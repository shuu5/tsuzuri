# folio2 の vessel 宣言（器 scribe2 が便を起こすときに読む・scribe2 pipe/declaration.rs）。値は器の上限（rules 行 runner.allowed_commands）の内側。
# 置いた便 = f2-648.10（便 0 の受け皿・持ち主の裁定 2026-09-17）。要件面 = 要件書の正本 YAML（scribe2 の yaml 読み手は `- id: FR1` の行だけを読む＝FR / NFR。flow 形の AC / CON / GOAL は読まない → 契約の req は FR / NFR に限る）。
schema = 1
allowed-commands = ["cargo", "git"]
common-verify = ["cargo nextest run --workspace --no-tests=fail --no-fail-fast", "cargo clippy --workspace --all-targets -- -D warnings"]
requirements = "design-intent/srs.yaml"
