# 床（scripts/check_draft.py）が RED になる fixture（凍結・f2-648.2 の受入・P-10.1 の day-1 代替＝床の入力ではない）。runner = tests/run_floor_cases.py。
# 各 case は凍結した土台 tests/fixtures/floor_base/design-intent/（憲法 v1.0・判断の記録 ADR-1〜ADR-10 の時点）の写し（一時 dir）に mutate を順に当てて床を回す（土台も正本も触らない）。段の種類と期待の欄は runner の冒頭を見る。
# 敵対レビュー 1 周目（B1〜B3 / M1〜M7 / m1）・2 周目（fc-1〜fc-9 / fp-1〜fp-7 / loophole-1〜13 / content-1・2・5・11 / fixrun-1〜6）・
# 3 周目（loophole-v3-1〜6・9〜11・15 / fp3-2・4〜7・9・10 / content-limits-1・2・6・13）・4 周目（loophole-v4-1〜5・7 / F-1〜F-3）・5 周目（doc-v5-1〜2 / loophole-v5-1〜9）の再現と、正の経路（欄の決まりの写し・範囲の増減・空の値・貼れる差分・改行入りの値・浅い写し）を含む。
# 写しは既定で git の 1 commit（床は版管理の無い写しを「まだ分からない」に落とす）。no_git: true の case だけ版管理なし。
expected_cases: 135

shared:
  p8_title_old: &p8_title_old 撤退条件を決定と同時に書く
  p8_title_new: &p8_title_new 撤退条件を決定と同時に書き、数える
  p8_old: &p8_old 取り消しにくい判断（ADR）には、それを捨てる条件を同時に書く。
  p8_new: &p8_new 取り消しにくい判断（ADR）には、それを捨てる条件を同時に書き、検査する。
  p8_newer: &p8_newer 取り消しにくい判断（ADR）には、それを捨てる条件を同時に書き、検査し、記帳する。
  p8_2_text: &p8_2_text 撤退条件が満たされたかを数える。
  prec_old: &prec_old 条どうしが衝突したら「網羅より揃い ／ 速さより黙らないこと ／ 賢さより戻せること」の順で解き、段どうしが衝突したら「絶対にやらない ＞ 確認してから ＞ いつも守る」の順で解く。
  prec_new: &prec_new 条どうしが衝突したら「網羅より揃い ／ 速さより黙らないこと ／ 賢さより戻せること」の順で解き、段どうしが衝突したら「絶対にやらない ＞ 確認してから ＞ いつも守る」の順で解く。迷ったら止めて持ち主へ渡す。
  mlr_old: &mlr_old kind が reject / build-check でも live が now でない条は、その検査結果を「まだ分からない」として出す（P-4.2）。
  ns_statement: &ns_statement 非エンジニアが AI と相談しながら、必要な設計文書だけを、同じ見た目で迷わず持てる
  ns_for_whom: &ns_for_whom 持ち主（非エンジニア）と、それを読む AI。同じページを両方が読む。人には「やさしく言うと」、AI には機械のための面。
  ns_judged_by: &ns_judged_by 要件書 §5 受入基準
