# folio2 判断の記録 ADR-2 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。読み物は preview/readable.html（生成物・手で直さない）。
id: ADR-2
title: 条文改訂の差分検査（A-2 / N-4）の比較元は、発効版の条文の写しを凍結した anchor file の列（design-intent/anchors/）とし、版管理の履歴には依らない
status: accepted
date: 2026-09-12
context: A-2 の機構は「正本の比較元（baseline）との差分（diff）」だが、比較元をどこから取るかが決まっていない。憲法の比較元の欄（meta.baseline）は「初回発効の commit（hash は台帳 f2-648.1 notes に記帳。file は自分の commit hash を持てない）」と書く＝台帳には記帳されているが、file だけを読む床からは解決できない。P-10.2 は生成物どうしの突き合わせだけを合格判定にすることを禁じ、P-10.3 は anchor が維持できない検査を「まだ分からない」に落とす。敵対レビュー 3 周（2026-09-12・台帳 f2-648.2 notes）は、対が 1 組あれば同じ条の他の変更が通ること・写しの置き場を消して同じ版で凍結し直せること・写しの承認欄や欄集合や承認者の定義が保護の外にあること・索引を空にすると検査が黙ること・値の型の変更が無記録で通ること・凍結後に承認の逐語を書き換えても落ちないことを実測で示した。敵対レビュー 4 周目（2026-09-13）は、列の頭が固定されておらず最新版の anchor と索引の項を消して前の版へ戻せること・次の版を凍結した後は前の版の記録を書き換えても黙ること・anchor の削除を版管理に記録（commit）してしまえば同じ版で凍結し直せることを実測で示した。敵対レビュー 5 周目（2026-09-13）は、版管理の見え方（別の版管理・根の無い枝・浅い写し・環境変数・記録の無い版管理）を選べば列を始め直して持ち帰れること・列の根の版を名指す架空の記録が通ること・追跡済みの anchor の置き場（anchors/）を後から除外（ignore）できることを実測で示した。
decision: 発効した版ごとに、条文の写し（憲法 schema.amendment_scope の各節＝schema 節・前文・各条の id・見出し・段・縛る相手・規範文の id・本文・型・強度）を凍結 anchor の置き場（design-intent/anchors/）の版ごとの file（constitution-<版>.yaml）に凍結し、索引（index.yaml・追記のみ）で列にする。anchor は自分の中に「直前の版」「写しの範囲と取り方（節の一覧・条の 5 欄・規範文の 4 欄）」「発効の承認の写し（憲法 meta.approval）」「その版を改訂した判断の承認一覧（判断の id・承認者・日付・裁定 id・逐語・対話面）」「写しの本体」を固定の欄で持ち、digest 以外の全欄を機械が計算する番号（digest・sha256）が覆う。列の根は最初の版（v1.0）に固定する。床は (1) 現行の写しが最新 anchor と一致すること（不一致なら N-4）、(2) 最新 anchor の版が憲法の版と同じこと（版を上げて凍結するまでの間は「版が違う」を出して記録の消し込みは測らず、直前の版の改訂を告発しない。条の消失・改番・番号の再利用は執筆中も測る）、(3) 索引と file と digest と直前の版が一致し列が切れていないこと＝切れていれば「まだ分からない」（版管理の履歴にその anchor が在れば「履歴に在ったが無い」の不合格が先に立つ。索引だけが消えたとき・索引が空なのに anchor file が残るときも不合格）、列の根の anchor の digest が床の定数と一致すること（根は 1 度きり＝別の写し〔別の版管理・根の無い枝・浅い写し・記録の無い版管理〕で同じ版を凍結し直して持ち帰っても落ちる）、発効した判断の改訂欄が名指す版が列の根より後の版か執筆中の版であること（列に無い版＝最新版の anchor と索引の項を消して前の版へ戻した細工と、根の版＝改訂前の無い架空の記録を落とす）、版管理（git）との照合＝環境変数（GIT_DIR 等）を継承せず全ての参照（ref）の履歴を見て、先頭（HEAD）か履歴に在った anchor が作業ツリーに在ること・履歴に在った同じ形式の anchor と中身が同じこと（差し替え・書き換えを落とす。形式が違う古い anchor は移行の痕跡として見ない）・anchors/ とその file が除外（ignore）されていないこと（追跡済みでも）・最新版以外の anchor が追跡されていること・design-intent 自体が版管理の根でないこと（版管理が無い・記録（commit）が無い・読めない写しは「まだ分からない」。浅い写しは anchor が 1 本も無いときだけ「まだ分からない」）、(4) 直前の anchor と現行の差分と、列の全区間で隣り合う anchor どうしの差分を欄単位で全件並べ（値は型付き・一覧は 1 値・空（null）も 1 値・空文字は印）、その版を名指す発効した判断の記録の改訂欄（amends・field・previous_text・new_text）と 1 対 1 に消し込めること（余りも不足も落とす＝次の版を凍結した後に前の版の記録を書き換えても落ちる）、変わった条には改訂来歴（amended_by）があること、写しの範囲の増減も欄単位の（新設）（削除）で記録されること（改訂欄の対象は現行と列に在った条 id・節名＝狭める改訂も名指せる）、(5) 写しの取り方と範囲の下限・列の根・置き場・印が床の定数と一致すること（欄の決まりの file はその写し＝data 側で動かせない）、(6) 発効の承認の写しが憲法 meta.approval と一致し、承認一覧の各項が指す判断の記録が実在してその承認欄と 1 字も違わないこと、(7) 条 id が条の形（P-n / A-n / N-n）で範囲の節名と衝突しないこと・版の綴りが v<数>.<数> であること・現行の写しについて、欄名が「.」を含まないこと・規範文 id の重複・改番・廃止した番号の再利用・印を値に持つ欄が無いこと（P-7.1）、(8) 正本 4 file・anchors/・adr/・design-intent 自体が参照だけの置き換え（symlink）でないこと、を検査する。版管理（git）は比較元ではなく、消された anchor を早く止める補助として読む（列の真偽は索引と digest が受け持つ）。anchor は床の script（check_draft.py --freeze-anchor）が検査と同じ写しの関数で作り、全検査が 0 違反かつ「まだ分からない」が無く、差分とその版の発効した判断があるときだけ書く。同じ版は上書きせず、anchor と索引は消さない・空にしない。列の始め直し（版管理の先頭か履歴に anchor が在った・記録が在るのに anchor が無い・最初の版が v1.0 でない・根の digest が床の定数と違う）は認めない。anchor が 0 本で記録も無ければ「まだ分からない」（P-10.3）。
options:
  - {id: a, name: 条文の写しを凍結した anchor file の列, text: 発効版ごとに条文の写しを凍結 anchor の置き場（anchors/）に 1 file 凍結し、索引で列にし、床が現行と欄単位で突き合わせる。, verdict: adopted, reason: 版管理の履歴に依らず、写し（clone）の直後でも検査できる。前の文（previous_text）を anchor の欄の値と完全一致で照合できる。改竄への耐性は全欄の番号（digest）と索引の列で「うっかり・手抜き」を止め、揃えて書き換える改竄は版管理の履歴と取り込みの審査が受け持つ（他の案でも同じ）。ただし凍結と検査が同じ関数を通るので P-10.1 の「検査側からの独立」は満たさない（P-10.2 の限界）。P-10.1（機構の欄（live）が M0・未発効）は本判断の射程外で、発効日（day-1）の代替として床の fixture（tests/floor_cases.yaml）を置くが、それは床の入力ではない（fixture の不在は検出されない）＝M0 で床の入力に取り込む。anchor は差分検査の比較元に留まる。}
  - {id: b, name: 発効 commit の履歴番号（commit hash）を型付きデータに書く, text: 欄の決まり（adr/schema.yaml）か憲法の先頭の欄（meta）に履歴番号を置き、版管理の命令（git show）で比較元を取り出す。, verdict: rejected, reason: 取り込み（squash merge）で履歴番号が確定するのは取り込み後＝毎回 2 度の commit が要る。履歴の無い写し（shallow clone）では検査が「読めない」になる。改竄への耐性は同じ作業ツリーの file に書く点で案 a と同等で、優位は無い。}
  - {id: c, name: 版の印（git tag）を比較元にする, text: 発効 commit に印を付け、床は印の指す憲法と比べる。, verdict: rejected, reason: 印は push が別で写し（clone）の間でずれる。印が無い環境で検査が黙るか落ちるかを機械で弁別しにくい。印は動かせるので改竄への耐性も案 a を上回らない。}
  - {id: d, name: 統合先（origin/main）との差分, text: 床は統合先の憲法と現行を比べる。, verdict: rejected, reason: 比較対象が動く（取り込みの要求（PR）の外で統合先が進む）。生成物どうしの突き合わせに当たる（P-10.2）。}
basis: [A-2, N-4, P-4, P-6, P-7, P-10, P-12, R-7]
retreat: {kind: measure, condition: 数えるのは planner 席（床の script を回す席）で、台帳に記帳する。凍結忘れ（版を上げたのに凍結の命令（--freeze-anchor）を回さず床が「版が違う」で落ちる）が rules 行 R-7 の上限を超えて繰り返されたとき、または列切れ（anchor か索引を消して不合格か「まだ分からない」に落ちる）が R-7 の上限を超えて繰り返されたとき（2 つは R-7 の same_failure では別種なので、別々に数える）、本判断を捨て、比較元を anchor の列から、便 0 の検査（CI）が版管理の履歴から作る比較元へ替える。}
amends: []
approval: {who: 持ち主, date: 2026-09-13, ruling: f2-648.2 notes 2026-09-13 09:35, verbatim: すべて承認する, surface: R-8}
plain: 憲法の「いま有効な文」の写しを、版ごとに 1 枚ずつ凍結して、前の版とつないだ列にして置いておきます。機械は「いまの憲法がいちばん新しい写しと同じか」「列がつながっているか」「前の写しから変わった欄の 1 つ 1 つに、理由の記録・どの文からどの文へ・あなたの OK が付いているか（書き漏らしも書き過ぎも無いか）」「写しに書かれた OK の言葉が、理由の記録の OK の言葉と今も同じか」を数えます。写しが 1 枚も無いか、列が切れているか、列の目次が空で写しも無いときは「まだ分からない」と言い、合格にはしません（目次だけが消えたとき・目次が空なのに写しが残っているときは不合格にします）。いちばん新しい写しを消して前の版に戻したり、凍結したあとで前の版の記録を書き換えたり、消したことを版の履歴に残してから同じ版で凍結し直したりしても止まります。写しの列のいちばん最初の 1 枚の番号は機械の側が覚えているので、別の場所で最初の 1 枚を作り直して持ってきても通りません。版の履歴が読めない複製の上では「まだ分からない」と言います。写しをどこか 1 字でも手で直すと、写しから計算した番号が合わなくなって止まります。番号の付け替えや、消した番号の使い回しも止まります。
consequences:
  - 憲法の版を上げる取り込みの要求（PR）は、判断の記録（その版の欄単位の改訂欄つき）・各条の改訂来歴（amended_by）・新しい anchor と索引の追記の 4 点を同時に含む。改訂欄は床の script（check_draft.py --emit-amends）が最新 anchor との差分から、そのまま貼れる形で印字できる。
  - 凍結 anchor の置き場（anchors/）の file と索引は生成物（手で直さない・P-6.2）で、凍結後は正本の変更に追随させず、消さない・空にしない（消すと、版管理の履歴と記録が名指す版から不合格になるか、列が切れて「まだ分からない」に落ちる）。
  - 憲法の発効の承認欄（meta.approval）は初回発効の承認で、以後の版では書き換えない（各版の承認は判断の記録の承認欄と anchor の承認一覧が持つ）。書き換えると全 anchor の写しと食い違って落ちる。
  - 床が守るのは「記録の無い改訂が黙って通らない」ことまで。anchor と索引と憲法を揃えて書き換え番号を計算し直す改竄（承認の逐語を含む）・床の script の定数（写しの取り方・承認者・対話面・裁定 id の形）を書き換える細工は、版管理の履歴と取り込みの審査で読む（欄の決まりの limits_note に明記）。版管理の見え方（別の版管理・根の無い枝・浅い写し・環境変数）を選ぶ細工には、環境変数の遮断・全ての参照の照合・同じ形式の anchor の中身の照合・列の根の番号（digest）の固定で応じる。履歴ごと書き換える細工（強制の push・参照の付け替え）と床の定数を書き換える細工は床の外。改訂来歴（amended_by）のうち理由の文・日付・裁定 id は形だけを見る（承認者と前の文は照合する）。
  - rules 行（rules.yaml）と憲法の改訂章（amendment）・各条の機構（mechanism）/ 平易文（plain）/ 出所（rationale）は本 anchor の外。P-17.2 と P-17.4 の機構は憲法のとおり便 0 の検査で置く。
  - 写しの取り方（条の 5 欄・規範文の 4 欄）や anchor の形式を変える移行は床の script の改訂で、既存 anchor と食い違うので「まだ分からない」に落ちる。旧 anchor を消して同じ版で凍結し直す道は版管理の履歴照合が塞ぐので、移行は床の外の手順＝旧列の退避先・新列の根・床の定数の変更を判断の記録に書いてから、取り込みの審査で床の差分と一緒に読む（day-1 では想定しない）。
  - 床は版管理（git）を読む。版管理の無い写し（作業ツリーの複製）・記録（commit）の無い写し・読めない写しでは「まだ分からない」になるので、写しで床を回すときも版管理の初期化と記録（git init + commit）の中で回す（床の fixture の実行器は既定でそうする）。浅い写しは anchor が揃っていれば回る。
  - 列の根（v1.0）の anchor の番号（digest）は床の定数で、床の script は folio2 の憲法 v1.0 の凍結に結び付く。根を作り直す移行では床の定数を直し、取り込みの審査で読む。
  - 条の廃止（status）の機構は発効日（day-1）の憲法 schema に無い（条の欄に status が無い）。条は消せず、廃止も表せない＝M0 で決める。
  - M0 で folio が同じ検査を持てば anchor の生成と検査を folio へ移し、床の script の側を削除する（判断は変えない・道具の移管）。M0 では床の fixture（tests/floor_cases.yaml）を床の入力にする（P-10.1）。
