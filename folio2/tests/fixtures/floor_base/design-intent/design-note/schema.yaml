# folio2 設計ノート — 欄の決まり（v1・2026-09-17・f2-648.7）
# 設計ノート = 「どう作るか」を書く文書の 1 つの型（判断の記録 ADR-3 決定 (1)・要件書 FR9）。正本は YAML 1 file（P-6.1）で、置き場は design-intent/design-note/<doc id>.yaml（path は repo の根からの相対）。
# この file は欄の決まりの型付きデータ（P-5.1）。機械の検査（床）は folio check が持つ（要件書 FR9〜FR12・便 23 で着地）。schema 節は生成区間で、床の定数から folio schema --write が導出する（人は直さない・判断の記録 ADR-9）。
# day-1 の床（Python の script）は退役済みで、本 dir は folio check が読む（ADR-3 決定 (6) の移管の完了）。
# 読み方: schema 節のうち *_note で終わる欄は人が読む説明（規則ではない・N-2）。schema 節のそれ以外の欄は床の定数からの導出物である（判断の記録の欄の決まり adr/schema.yaml と同じ形・ADR-1）。meta・mapping・plain は schema 節の外（床の定数ではない）。

meta:
  id: folio2-design-note-schema
  version: 1
  date: 2026-09-17
  decided_by: [ADR-3, ADR-4]
  requirements: [FR9, FR10, FR11, FR12, FR13, FR14, FR15]
  owner: 持ち主（shuu5）
  author: planner 席（AI・fable 5.1）
  floor: {live: M1, landed: 便 23}
  floor_note: 床は M1 の便 23 で着地した（folio check が設計ノートを数える）。見本 example.yaml は生成器から独立した固定の材料で、M1 の凍結 anchor（P-10.1）の元になる候補（要件書の受入基準の fixture そのものではない）。
  type_enum_ruling: {basis: [ADR-3, FR9, FR12], ruling: f2-648 notes 2026-09-17 06:53 JST（逐語「承認する」・対話面 R-8・f2-648.7 の取り込みの承認）, ruled_at: 2026-09-17}
  type_enum_ruling_note: 節の型の閉じた一覧（schema.section.type_enum）と文書の状態の値域（schema.doc_meta.status_enum の example）は、判断の記録 ADR-3 決定 (1) と要件書 FR9 が「など」で開いていた一覧を本 file が初めて閉じたもの（P-2.4）。ruling / ruled_at は本便の取り込みの承認（持ち主の逐語・2026-09-17）で埋めた（rules 行の初版と同じ手順・裁定前は null で置いていた・P-12.3）。P-2.4 の「判断の記録」は ADR-3 決定 (1) を出所とし、閉じた一覧そのものは ADR-3 の帰結として持ち主の承認で追認する（ADR は新しく起こさない）。以後の追加は判断の記録を要する。

# folio:schema:begin — 生成区間・手で直さない・正本は実装の定数（folio schema --write が書く）
schema:
  floor_note: 以下の欄は床の実装の定数からの導出物である（生成区間・判断の記録 ADR-9）。型も値も床の定数と違わないことを folio check が数える（判断の記録の欄の決まりと同じ）。変えるときは床の実装の定数を直し、folio schema --write で書き直す。
  path_base: repo-root
  path_base_note: 本 file と設計ノートの中の path（fixture・parts.json・導出物）は repo の根からの相対で書く。
  date_format: ^\d{4}-\d{2}-\d{2}$
  doc:
    required: [meta, sections]
    optional: [figures, sources]
    sources: {in_ref_population: false}
    doc_note: 1 設計ノート = YAML 1 file。節（sections）の並びが本文。図（figures）は判断の記録 ADR-4 の型付き記述で持つ。外部への参照（報告 HTML 等）は sources に置き、参照 id の母集団に入れない（in_ref_population = false・要件書 NFR3 と同じ）
  doc_meta:
    required: [id, title, version, status, generated, profile]
    optional: [approval, supersedes, superseded_by, note]
    id_pattern: ^[a-z][a-z0-9-]*$
    id_note: 文書 id（doc id）= file 名の stem。append-only＝改名は「新しい id + 旧 id の廃止（status retired・superseded_by）」で表し、番号や名を再利用しない（P-7）。契約 id は「<doc id>#<row id>」の形で、前半がこの id（器 scribe2 の契約表と同じ形）
    version_pattern: ^v[0-9]+\.[0-9]+$
    status_enum: [draft, effective, retired, example]
    effective_status: [effective, retired]
    approval_required_when: effective_status
    status_note:
      draft: 未承認・拘束力なし（承認欄は空でよい）
      effective: 発効（承認欄に持ち主の逐語・日付・裁定 id・対話面が必須）
      retired: 廃止（superseded_by 必須・P-7.2・承認欄を持つ）
      example: 見本（拘束力なし・承認欄を持たない・凍結 anchor の材料）
    profile_enum: [design-note]
    profile_note: 密度 profile は 1 行（見せ方だけを持つ・拘束の旗を置かない・ADR-3 決定 (1)・N-3）。文書の種類による違いは節の型で表す（P-5.3）
    approval: {required: [who, date, ruling, verbatim, surface], surface_enum: [R-8]}
    approval_note: P-12.2。effective_status の文書にだけ必須（approval_required_when）。承認者の値域・裁定 id の形は判断の記録の欄の決まり（adr/schema.yaml）と同じ定数を床が持つ。持ち主との対話面（R-8）を通っていない記録に承認欄を置かない（P-12.3）
  section:
    required: [n, type, title]
    optional: [body, rows, note]
    n_rule: {start: 1, order: ascending, append_only: true, gaps_allowed: true}
    n_note: 節番号（§N の N）。folio2 の自前の決まり（P-7.1 の番号の扱いを節に当てたもの・判断の記録と要件書には無い）。契約表の行の section 欄はこの n を指す（見出しの字面ではない）。器（scribe2）の設計文書の「## N.」と同じ意味
    type_enum: [prose, parts-table, ports-table, fields-table, teeth-table, contract-table]
    type_note: 節の型の閉じた一覧（P-2.4・裁定は meta.type_enum_ruling）。判断の記録 ADR-3 決定 (1) が名指す 部品の表・口の表・欄の表・歯の表・契約表 に、散文の節（要件書 FR12 の母集団）を足した 6 つ。要件書 FR9 = 一覧に無い型の節を持つ正本は生成せずに落とす
    by_type:
      prose:
        required: [body]
        forbid: [rows]
        prose_gate_rules_row: R-16
        body_note: 散文。規範の印を持つ文の門（同じ文に参照 id・数と単位を持たない）は rules 行 R-16 の値（印・「禁止」の直後の文字・単位）と population（母集団の除外・文の区切り）が持ち、ここには写さない（要件書 FR12）
      parts-table:
        required: [rows]
        row: {required: [id, name, role], optional: [ref, note]}
        row_note: 部品の表。role = その部品が何をするか（1 行）。ref = 参照 id（条・要件・rules 行・判断の記録）の一覧
      ports-table:
        required: [rows]
        row: {required: [id, name, input, output, refuses], optional: [ref, note]}
        refuses_none_marker: なし
        row_note: 口の表（命令・関数・接点）。refuses = 何を断るか（黙って飛ばさない・P-4）。断らない口は refuses_none_marker の値を書く（空にしない）
      fields-table:
        required: [rows]
        row: {required: [id, name, need, shape], optional: [enum, note]}
        need_enum: [required, optional]
        shape_enum: [text, list, number, bool, table]
        row_note: 欄の表（folio2 自身の型付きデータの欄を記述する節）。need / shape の値域は folio2 の自前（契約表の外部の欄の決まりとは別物＝器の値域を写したものではない）
      teeth-table:
        required: [rows]
        row: {required: [id, name, red_when, fixture], optional: [ref, note]}
        row_note: 歯の表（検査・test）。red_when = 何を壊せば落ちるか（1 文）。fixture = 固定の材料の path（凍結 anchor・P-10.1・repo の根からの相対）。要件書の受入基準の red_test と同じ形
      contract-table:
        required: [rows]
        section_ref_type: prose
        section_ref_note: 行の section 欄は同じ文書の節番号 n を指し、その節は prose の型であること（folio2 側の導出の成立条件 = 節の body の逐語を goal へ写すため。器 scribe2 は「節が在り本文が非空」だけを見る＝folio2 が導出のために足す条件で、器の受付を狭めない）
        rows_note: 契約表。行の欄の集合と値域は本 file に書かない＝schema.contract_table.external_schema が指す器（scribe2）の導出 file をそのまま読む（ADR-3 決定 (2)・要件書 FR10）
  contract_table:
    external_schema:
      owner: scribe2
      path: contracts/schema.toml
      format: toml
      reader_expects: {head: schema = 1, rows_key: field, row_fields: [name, need, shape]}
      value_domains: from-file
      unknown_value: まだ分からない
    external_schema_note: 器（scribe2）が自分の型（pipe/table.rs の定数）から導出した生成物。folio2 はこれを読んで契約表の節の欄を登録し、欄の一覧も値域も自分の型にも散文にも持たない（P-5.1・P-6.3・P-6.4・N-2）＝reader_expects は読み手の期待する形であって正本ではなく、need / shape の値域は file の値をそのまま受ける（value_domains = from-file）。欄の追加・値域の変更は器の版上げで足り、folio2 の判断の記録は要らない。file が読めない・期待する形でない・知らない値が在るときは「まだ分からない」（unknown_value・要件書 FR10・AC8）
    reads: [design-doc-contract-table, external-schema-file]
    never_reads: [per-run-contract-file]
    reads_note: folio2 が読むのは設計文書の中の契約表（scribe2 では docs/design の [[contract]] の区間）と外部の欄の決まりの file だけ。便ごとの契約 file（run dir の contract.toml）は読まない（scribe2 planner の助言 2026-09-16・形が変わる途中）
    row_id: {pattern: '^[a-z][a-z0-9-]*$', owner: folio2, scope: own-id-space}
    row_id_note: 行の id は文書内で一意・append-only。この形は folio2 が所有する文書の id 空間の解決（R-4）の範囲で folio2 が自前に持つもので、器の値域（器は「文書内で一意」だけを言う）を写したものではない。文書 id と同じ形（ハイフン可）
    semantic_check_owner: scribe2
    semantic_check_note: 行の id の一意・要件の欄が要件書に実在・節の欄が同じ文書に実在し本文が非空・依存の解決と輪の無さ・検証の欄の形・触る型の閉包が書き込み範囲に収まること、は器（scribe2）の 1 つの関数（編集時・黙って飛ばさない）が持つ。folio2 は持たない（ADR-3 決定 (3)・要件書 scope_m1.not_build）
    folio_check: [yaml-form, derived-diff-zero, own-id-space]
    folio_check_note: 契約表について folio2 が持つ検査は 3 つだけ = 正本の形（重複キー・未知の欄・欄の非空・要件書 FR5 の構造の床）/ 導出物の差分 0（FR11・事後の検出・P-18.2）/ folio2 が所有する文書の id 空間の解決（R-4・母集団は広げない）
  derived:
    format: toml-subset
    extension: .toml
    granularity: one-file-per-doc
    head: schema = 1
    array: contract
    row_fields: external_schema の field の name をそのまま + goal
    goal: 行の section が指す節の body の逐語を単一行に写す（各行を trim し空行を落とし空白 1 つで繋ぐ・引用符と逆斜線は escape しない）
    section_value_shape: text
    empty_list: omit-key
    empty_list_note: 器の読み手は空の配列を拒む（緩めない）ので、空の一覧は key ごと省いて表す。YAML 正本の側では空の一覧（depends が空 等）を書いてよく、導出器が省く
    value_grammar: [text, list-of-text, number, bool]
    placement: 消費側（器 scribe2）の repo に版管理で置く。path は消費側が宣言する（拡張子 .toml・全文を同じ parser に渡す）
    check: {command: folio build --check, verdict_on_diff: nonzero, stage: post}
    derived_note: 判断の記録 ADR-3 決定 (4)・要件書 FR11。器は統合先（main）へ着地した後の受付からしか新しい表を読まない（正本の改訂 → 取り込みの要求 → 着地 → 再受付）。契約 file の読み手は共有の scalar の読み手で escape を解かず複数行の値も扱わない（scribe2 contract-source.md §2・実測 2026-09-16）＝goal の単一行化と section を文字列で出す（section_value_shape）のはそのため
  landing:
    source_of_truth: scribe2 の記録（record）
    read_port: 統合先の commit（squash）の本文の末尾の印（trailer・契約 id と要件 id・器が書く）
    trailer_name_source: {owner: scribe2, derived_from: 器の名前の定数, unreadable: まだ分からない}
    verdict_values: {used: [着地, まだ分からない], never: [未着地]}
    verdict_cases:
      - {when: 印が在る, verdict: 着地（印の commit の要約値（sha）を添える）}
      - {when: 印が無い, verdict: まだ分からない}
      - {when: 自分の repo への取り込みの要求で終わる形（印も記録も持たない）, verdict: まだ分からない（恒久）}
      - {when: 印の名か commit が読めない, verdict: まだ分からない}
    forbidden_wording: 未着地
    landing_note: 要件書 FR13・ADR-3 決定 (5)(6)。着地の判定の語は要件書 FR13 のとおり「着地」と「まだ分からない」の 2 つで、床の検査結果の語（合格・不合格）は使わない（P-3.3・床の合格と紛れさせない）。「未着地」は出さない（印の不在は未着地と弁別できないため・P-4.2）。印の名は器の名前の定数から導出され、folio2 は名を手で持たない（trailer_name_source）。他の repo の要件 id・契約 id・便の id は参照 id の床（R-4）の母集団に入れず、出所付きの測定値として扱う
  index:
    entries: [doc, requirement, contract]
    entry_fields: [id, title]
    index_note: 要件書 FR14。機械が読む id の索引（文書・要件・契約の id と 1 行の題）。中身を席へ届ける経路は器の役割の注入が持つ（要件書 CON9）
  figures:
    spec: 図の道具（archify）の型付き記述（JSON の 5 型の欄の決まりそのまま・ADR-4 決定 (1)）
    entry: {required: [id, type, caption, spec], optional: [refs, note]}
    type_enum_ref: design-intent/preview/parts.json figure_type_enum
    body_classes_ref: design-intent/preview/parts.json figure_body_classes
    body_classes_rules_row: R-3
    semantic_attrs: keep
    viewer_chrome: discard
    quality_rules_row: R-14
    tool_version_rules_row: R-15
    network_commands: forbid
    skill_listing: forbid
    retry_rules_row: R-7
    retry_record: ledger
    figures_note: 図の正本は設計ノートの figures 節に型付き記述で置き、別 file にも散文にも持たない（ADR-4 決定 (1)）。生成は要件書 FR15（検査を通らない図は生成しない・前の生成物を上書きしない・凍結 anchor が落ちたら「まだ分からない」・決定 (2)(6)）。図の本体の意味の属性は捨てず（semantic_attrs = keep・決定 (3)）、閲覧の仕掛けは捨て（viewer_chrome = discard・決定 (3)）、意味を表す class は部品目録に載り色・字の大きさ・線の太さは design token で塗る（body_classes・R-3・決定 (3)）。道具の通信する命令は使わず（network_commands = forbid）、AI 向けの説明（skill）として載せない（skill_listing = forbid・R-1 の母集団外・決定 (5)）。修正の往復は R-7 が上限で、往復の記録は台帳に残し撤退条件の測定に使う（retry_record = ledger・決定 (7)）。図の対（持ち主の裁定 2026-09-19・f2-648 notes）＝設計ノートの図は、非エンジニア向けの手順図（専門の言葉を使わず「誰が・どの順で・何をして・だめならどうなるか」）と、エンジニア向けの順序図（命令の名・旗・終了コード・file 名をそのまま）を対で置く。見本は design-note/figures.yaml。これは書き方の指針であり床は数えない
  guards:
    in_loop: []
    post: [yaml-form, derived-diff-zero, own-id-space, prose-gate]
    polarity_list_feed: true
    p18_4_judged_by: R-13
    guards_note: 設計ノートの編集を編集の時点で止める仕掛け（in-loop）は folio2 側に 1 本も無い（器 scribe2 の受付は別 repo の guard で、folio2 の設計ノートの編集を止めない）。この節は極性一覧（P-18.3）へ寄せる材料であり、P-18.4 の判定は folio2 全体を数える rules 行 R-13 の 1 面に委ねる（判定面を 2 つにしない・P-6.3）。post の検査は編集時に止めることの代わりにしない（P-18.2）
# folio:schema:end

mapping:
  - {source: ADR-3 決定 (1), here: schema.doc_meta.profile_enum / schema.section.type_enum, requirement: FR9}
  - {source: ADR-3 決定 (2), here: schema.contract_table.external_schema（欄も値域も持たない）, requirement: FR10}
  - {source: ADR-3 決定 (3), here: schema.contract_table.semantic_check_owner / folio_check, requirement: FR9・FR5・scope_m1.not_build}
  - {source: ADR-3 決定 (4), here: schema.derived, requirement: FR11}
  - {source: ADR-3 決定 (5), here: schema.landing.read_port / trailer_name_source, requirement: FR13}
  - {source: ADR-3 決定 (6), here: schema.landing.verdict_cases / schema.doc.sources.in_ref_population, requirement: FR13・NFR3}
  - {source: ADR-3 決定 (7), here: schema.section.by_type.prose.prose_gate_rules_row（式は rules 行 R-16）, requirement: FR12}
  - {source: ADR-3 決定 (8), here: 本 file の外（順序と範囲 = 要件書 CON8）, requirement: CON8}
  - {source: ADR-3 決定 (9), here: schema.index, requirement: FR14・CON9}
  - {source: ADR-4 決定 (1), here: schema.figures.spec / figures_note（別 file にも散文にも持たない）, requirement: FR15}
  - {source: ADR-4 決定 (2), here: schema.figures.quality_rules_row（R-14）, requirement: FR15}
  - {source: ADR-4 決定 (3), here: schema.figures.semantic_attrs / viewer_chrome / body_classes_ref / body_classes_rules_row, requirement: FR15}
  - {source: ADR-4 決定 (4), here: schema.figures.type_enum_ref（R-5 の 8 型）, requirement: FR15}
  - {source: ADR-4 決定 (5), here: schema.figures.tool_version_rules_row / network_commands / skill_listing, requirement: FR15・NFR1}
  - {source: ADR-4 決定 (6), here: schema.figures.figures_note（凍結 anchor が落ちたら「まだ分からない」）・schema.section.by_type.teeth-table, requirement: FR15・AC12}
  - {source: ADR-4 決定 (7), here: schema.figures.retry_rules_row / retry_record, requirement: FR15}
  - {source: folio2 の自前, here: schema.section.n_rule / schema.contract_table.row_id / schema.doc_meta.status_enum の example / schema.section.by_type.contract-table.section_ref_type, requirement: P-7・R-4（判断の記録・要件書には無い・裁定は meta.type_enum_ruling）}

plain: 「どう作るか」を書く設計の文書（設計ノート）の書き方の決まりです。文書は 1 種類だけで、中は番号つきの節を並べます。節の種類は 6 つ（説明の文・部品の表・口の表・欄の表・検査の表・契約表）に限り、それ以外の節があれば機械が作らずに止めます。契約表（便 1 本ごとの約束の表）の「どんな欄があり、どんな値を取るか」は scribe2 の機械が持つ写しをそのまま読み、folio 側には書きません（知らない値が来たら「まだ分からない」と言います）。契約表から scribe2 が読む file を機械が作り、repo に置いた file とずれていれば「ずれている」と言います。便が本当に入ったかは commit の末尾の印だけを見て、無ければ「まだ分からない」と言い、「入っていない」とは言いません。説明の文の中で「〜しなければならない」と書いた文には番号を添え、単位のついた数を書きません。図は決まった書き方で書き、道具が外と通信する機能は使いません。発効した文書だけがあなたの OK の言葉を承認欄に持ち、見本は承認欄を持ちません。この決まりは folio が機械で確かめます。決まりの部分は機械の中の決まりから folio が自動で書くので、手では直しません。
