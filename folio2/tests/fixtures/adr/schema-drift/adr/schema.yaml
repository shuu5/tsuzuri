# folio check の歯の fixture（adr/・crates/folio/tests/adr.rs）。変異 = schema 節の options_rule.min を床の定数 2 と違う 3 にする → 1。
meta: {id: fixture-adr-schema, version: 1, date: 2026-09-17, decided_by: [ADR-1]}
schema:
  id_pattern: '^ADR-[1-9][0-9]*$'
  date_format: '^\d{4}-\d{2}-\d{2}$'
  ruling_pattern: '(?<![0-9A-Za-z_.-])[a-z][0-9]-[0-9a-z]+(\.[0-9]+)*(:[0-9]{8}T[0-9]{4}Z-[0-9]+| notes( [0-9]{4}-[0-9]{2}-[0-9]{2}( [0-9]{2}:[0-9][0-9x])?| [0-9]{2}:[0-9][0-9x])( JST)?)?'
  ruling_forms: [question, notes-time, bead]
  ruling_fields:
    - constitution.yaml meta.approval.ruling
    - constitution.yaml articles[].amended_by[].ruling
    - rules.yaml thresholds[].ruling
    - rules.yaml discipline[].ruling
    - adr/ADR-*.yaml approval.ruling
    - design-note/*.yaml meta.approval[].ruling
    - srs.yaml meta.approval[].stamp
    - index.yaml meta.approval[].stamp
    - ceiling.yaml meta.approval[].stamp
    - intake.yaml meta.approval[].stamp
    - graph.yaml meta.approval[].stamp
  ruling_skeleton:
    - constitution.yaml meta.approval.ruling
    - rules.yaml thresholds[].ruling
    - rules.yaml discipline[].ruling
  ruling_skip_roles: [作成, レビュー]
  owner: 持ち主
  required: [id, title, status, date, context, decision, options, basis, retreat, plain]
  optional: [amends, grill, approval, consequences, produced, supersedes, superseded_by, note, figures]
  non_empty: [title, context, decision, plain]
  enums:
    status: [proposed, accepted, retired]
    verdict: [adopted, rejected]
    retreat_kind: [spike, measure, ruling]
    approver: [持ち主, planner 席, orchestrator 席]
    surface: [R-8]
  effective_status: [accepted, retired]
  option: {required: [id, name, text, verdict, reason], optional: []}
  options_rule: {min: 3, adopted: 1}
  retreat: {required: [kind, condition], optional: []}
  amends_entry:
    required: [target, field, version, previous_text, new_text]
    optional: []
    new_article_marker: （新設）
    deleted_marker: （削除）
    empty_marker: （空）
  grill: {required: [when, who, where, summary], optional: []}
  approval: {required: [who, date, ruling, verbatim, surface], optional: []}
  amended_by_entry: {required: [adr, date, approved_by, ruling, previous_text, rationale], optional: []}
  figures:
    entry: {required: [id, type, caption, spec], optional: [refs, note]}
    type_enum_ref: design-intent/preview/parts.json figure_type_enum
  anchor:
    dir: anchors
    file_name: 'constitution-<version>.yaml'
    index_file: index.yaml
    first_version: v1.0
    root_digests: {}
    version_pattern: '^v[0-9]+\.[0-9]+$'
    digest_algo: sha256-json-1
    file_keys: [kind, digest_algo, version, previous, projection, meta_approval, approvals, content, digest]
    projection_article_fields: [id, title, tier, binds, statements]
    statement_fields: [id, text, pattern, strength]
    scope_minimum: [schema, precedence, articles]
  seal: {file: adr-seals.yaml, kind: adr-seals, outside: [status, superseded_by]}
plain: 判断の記録の書き方の決まりです。
