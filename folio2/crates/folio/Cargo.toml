[package]
name = "folio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
# 行 k-tz-tests: binary を持たない（src/main.rs は folio2/retired/ へ退役）。tz の binary を撃つ歯は境界の package の
# [[test]]（file は下の tests/ に置いたまま）で、ここには binary を撃たない歯だけを名指す。
autotests = false

[dependencies]
clap = { version = "4", features = ["derive"] }
yaml-rust2 = { version = "0.12", default-features = false }

[build-dependencies]
yaml-rust2 = { version = "0.12", default-features = false }

[lints]
workspace = true

# binary を撃たない歯（行 k-tz-tests）
[[test]]
name = "constitution_enums"

[[test]]
name = "deps"

[[test]]
name = "face_labels"

[[test]]
name = "face_style"

[[test]]
name = "fdrop"

[[test]]
name = "modules"

[[test]]
name = "parts_catalog"
