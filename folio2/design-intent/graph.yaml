# folio2 索引の欄の決まり — 正本（v0.1・orchestrator 席）
# 位置: 判断の記録 ADR-13 決定 (1)(2)（節点の範囲は判断の記録 ADR-14 決定 (1) が id を持つ行に狭めた＝文書そのものと節は節点にしない）。設計文書の索引（節点と辺）の 種類と型の閉じた一覧 を人が読める形で持つ。
# 索引の中身そのものはここに置かない＝毎回 folio graph --print が正本から組み直す導出物である（ADR-13 決定 (4)・P-6.3 / P-6.4）。
# 状態: v0.1 は発効（2026-09-23 23:49 JST 持ち主「全部推奨で良い」・一括 14 の問 6 = 承認欄に持ち主の承認の行を足しただけで中身は不変・起草は便 95・行 cr・仕分けは docs/design/batch14-triage.md）。閉じた一覧の正本は実装の型付きの定数 crates/folio/src/graph.rs で、下の生成区間はその写しである（P-5.1・P-5.6）。

meta:
  id: folio2-graph
  title: 設計文書の索引の欄の決まり
  version: v0.1
  status: effective
  approval:
    - {role: 作成, who: orchestrator 席（AI・fable 5.1）, when: 2026-09-22, stamp: 起草（便 95・行 cr・判断の記録 ADR-13 決定 (1)(2)）, version: v0.1}
    - {role: 承認, who: 持ち主（shuu5）, when: 2026-09-23, stamp: "発効（f2-648 notes 2026-09-23 23:49 JST・対話面 R-8・一括 14 の問 6〔第 0.1 版の発効・中身は不変〕への回答・推奨どおり）", verbatim: 全部推奨で良い, version: v0.1}
# folio:schema:begin — 生成区間・手で直さない・正本は実装の定数（folio schema --write が書く）
schema:
  top_level: [meta, schema]
  top_level_note: 最上位の節の閉じた一覧（ほかの節は床が落とす）。meta は人が書き、schema は生成区間。索引の中身そのものはこの file に置かない＝毎回 folio graph --print が正本から組み直す導出物である（判断の記録 ADR-13 決定 (4)・P-6.3 / P-6.4）
  node: {required: [id, kind, file, digest, title]}
  node_note: 索引の節点 1 つの欄。id は設計文書の全体で 1 つに定まる id（設計ノートの行は文書 id と行 id を「#」でつないだ字）、kind は node_kinds の値、file は正本の置き場からの相対の path、digest は節点の本文の要約値（式は digest_note）、title は空白を 1 つに畳んで Unicode の字で 36 に切った 1 行の題（設計ノートの行は行の section が指す節の題）
  node_kinds: [条, 規範文, 規則行, 目的, 要件, 非機能要件, 受入基準, 制約, 登場人物, 出力, 判断の記録, 設計ノートの行]
  node_kinds_note: 節点の種類の閉じた一覧（順も固定・増減は判断の記録が要る＝P-2.4 と同じ扱い）。正本は実装の型付きの定数 crates/folio/src/graph.rs の NODE_KINDS で、この節はその写しである（P-5.1・P-5.6）
  edge: {required: [from, to, type]}
  edge_note: 索引の辺 1 つの欄。from と to は節点の id、type は edge_types の値。両端が節点のときだけ表に出し、端が節点でない参照（図の名・改訂の範囲の節名）は数だけ要約の 1 行に出す（P-4.2）
  edge_types:
    - in-article
    - relations.articles
    - relations.reqs
    - relations.rules
    - relations.sections
    - amended_by
    - article
    - refs
    - basis
    - goals
    - rules
    - adrs
    - verify.ac
    - verifies
    - figures
    - produced
    - amends
    - req
    - depends
  edge_types_note: 辺の型の閉じた一覧（順も固定・ADR-13 決定 (2)）。正本は実装の型付きの定数 crates/folio/src/graph.rs の EDGE_TYPES で、この節はその写しである。figures は伝播に使わない（決定 (2)）。観点が読む文書と入口の棚の関係は辺にしない＝文書そのものを節点にしないので（判断の記録 ADR-14 決定 (1)）、その関係は天井の正本の読む欄の表と入口の棚から引く
  edge_fields:
    constitution.yaml: [relations]
    rules.yaml: [article, refs]
    srs.yaml: [basis, goals, rules, adrs, verifies, verify.ac]
    adr: [basis, produced]
    design-note: [req, depends, basis]
  edge_fields_note: 辺の欄の閉じた一覧（正本の file ごと・欄の名・design-note は設計ノートの契約表の節の行の欄）。節点の要約値はこの欄を落とした本文だけを数えるので、この欄に id を足すだけの変更は節点の要約値を動かさない。正本は実装の型付きの定数 crates/folio/src/graph.rs の EDGE_FIELDS で、この節はその写しである（P-5.1・P-5.6）。verify.ac は要件の verify の中の対を指す。図の欄（figures）と改訂の来歴の欄（amended_by・amends）は散文を持つので本文の側に残す
  digest_note: 節点の要約値の式（正本の読み口に依らず、行の逐語の byte で決まる）。① 節点の block は、その id を持つ行から、空行でなく字下げが頭の行以下である最初の行の直前まで（判断の記録は file の全行・設計ノートの行は契約表の rows の中の字下げ 6 の「- 」の行から）。② block から、入れ子の節点の block と 辺の欄の行（その行より深い続きの行も）を落とし、流れの形の行からは辺の欄の対を落とす。③ 末尾の空行を落とし、残った行を改行ごと連結した byte の sha256 の先頭 8 字が要約値
  ids:
    rule_sections: [thresholds, discipline]
    srs_sections: [goals, requirements, nonfunctional, acceptance, constraints, actors, outputs]
    relation_namespaces: [reqs, rules, articles, sections]
    prefixes: {article: [P-, A-, N-], rule: [R-, D-], srs: [FR, NFR, AC, CON, GOAL]}
  ids_note: 参照 id の空間の閉じた一覧。参照 id の解決の母集団（行 R-4）と散文の門と散文の言及の読み（行 R-17）が同じ定数を引く。rule_sections は規則の表の行を持つ節、srs_sections は要件書の id を持つ節、relation_namespaces は憲法の条の relations の名前空間である。prefixes は参照 id の頭で、article の頭の id は枝番 .<数> を取れ、rule と srs の頭の id は取れない。正本は実装の型付きの定数 crates/folio/src/refs.rs と prose.rs で、この節はその写しである（P-5.1・P-5.6・行 D-11）
  mentions:
    targets:
      - constitution.yaml
      - rules.yaml
      - srs.yaml
      - vocabulary.yaml
      - ceiling.yaml
      - index.yaml
      - intake.yaml
      - adr/
      - design-note/
    typed:
      - article
      - articles
      - amended_by
      - amends
      - ac
      - adrs
      - basis
      - figures
      - goals
      - produced
      - reads
      - ref
      - refs
      - relations
      - req
      - reqs
      - rules
      - sections
      - target
      - verifies
      - verify
    provenance: [approval, date, grill, ruled_at, ruling, source]
    top_skipped: [meta, schema]
    excluded: [対象外, 本判断の外, 同じ運び方, 同形, と同じく, と揃う, 審査の記帳, 根拠から, へ移した, と書いたら]
    srs_kinds:
      goals: 目的
      actors: 登場人物
      outputs: 出力
      requirements: 要件
      nonfunctional: 要件
      acceptance: 受入基準
      constraints: 制約
    receives:
      条: [条, 規範文, 規則行, 判断の記録, 要件, 制約, 受入基準, 目的, 登場人物, 出力]
      規範文: []
      規則行: [条, 規範文, 規則行, 判断の記録, 要件, 制約, 受入基準, 目的, 登場人物, 出力]
      判断の記録: [条, 規範文, 規則行, 判断の記録, 要件, 制約, 受入基準, 目的, 登場人物, 出力]
      要件: [条, 規範文, 規則行, 判断の記録, 受入基準, 目的]
      制約: [条, 規範文, 規則行]
      受入基準: [要件]
      目的: []
      登場人物: []
      出力: []
  mentions_note: 散文の言及の歯（行 R-17）の機械の読みを閉じる 5 つの閉じた一覧。targets は対象の file（名が / で終わるものは dir の中の記録）、typed は型付きの辺として読む欄、provenance は来歴の欄、top_skipped は読まない最上位の節で、散文の欄はこの 3 つの補集合である。srs_kinds は要件書の節ごとの行の種類で、id を持つ行の種類は条・規範文・規則行・判断の記録とこの値である。receives は受け皿の表で、鍵は出所の行の種類、値はその行の型付きの欄が受けられる指す先の種類であり、値に無い組（空の一覧の行は全部）は数えない。excluded は数えない言及の語形で、言及を含む 1 文にどれかが在れば数えない。正本は実装の型付きの定数 crates/folio/src/mentions.rs で、この節はその写しである（P-5.6・行 D-11）
# folio:schema:end
