revises:
  - {target: ADR-3, decision: (8), kind: narrow, summary: 「folio2 の M1 で設計ノートの YAML 正本と導出物へ移す」を M1 の段の義務として読まず（導出物の口の段は ADR-16 決定 (5)(7) と要件 FR11 の M3）、scribe2 の設計文書の中の契約表を移す相手から外し（ADR-21・今の形のまま使い終わる）、YAML 正本の節から導出物を作る向きは ADR-16 決定 (1)(5) と ADR-21 決定 (1) が v3 の置き場で持つものとして残し（本判断は相手を足さない）、設計文書を移す範囲の論点を閉じる}
