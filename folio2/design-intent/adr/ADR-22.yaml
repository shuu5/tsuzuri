consequences:
  - 発効した判断の記録どうしで、契約表の段と相手の字が揃う。ADR-3 決定 (8) の字は残り、読み方は本判断の改訂の欄と ADR-3 の注の段と平易文の読み方の段が持つ。ADR-16 の決定 (1) の字も残り、読み方は本判断の改訂の欄と ADR-16 の注の段が持つ。
  - 要件書の版が 1 つ上がる（制約 CON8 の本文の頭の文を第 1.1 版の字の記録として過去の字にし、今の段と相手と閉じた論点を書く・CON8 の出所の欄に本判断・M1 の範囲の節の注の「CON8 の別の論点」を閉じた字へ・M3 の範囲の節の作らないの行の「M3 の後に改めて問う」を閉じた字へ）。制約の番号と、要件の規範文と番号と段の欄は変わらない（条 P-7）。一括 19 と同じ回で承認されたら、一括 19 の版上げに同居させる。
  - 天井の 32 周目の整合の所見 2 と 3（F-2・F-3）は、本判断の承認の後の字の直しで解く。一括 19 の直しの一覧には入れない（同じ字を 2 か所で直さない）。
  - 設計ノートの欄の決まりの対応表の行（ADR-3 決定 (8) → 要件書 CON8）は変えない。指し先の CON8 が閉じた字を持つ。要件書の来歴の欄と、設計の置き場の外の起草の時点の記録（docs/design）と、歯の固定の材料（fixture）の写しも変えない。
  - folio2 自身の設計ノート（便の契約表・置き場は docs/design）の置き場と移行の扱いは変わらない。本判断の (2) は scribe2 と v3 の契約表だけを扱う。
  - 本判断の発効は、判断の記録の状態の欄として周の引き金を動かす（どの判断の記録の発効も同じ）。便は起こさない。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 の notes に記帳する。数える時機は、判断の記録 ADR-21 の撤退条件を数える時機（v3 の repo の統合先に新しい commit が入った後の最初の本流の周の前）と同じ 1 回とする。
    (1) scribe2 の移行の再開: scribe2 の台帳が、scribe2 の設計文書（契約表を持つものを含む）の folio2 の形への移行の再開を記帳した回（s2-07l.214 か後継の項・folio2 の席が読んで写す）を数える。ADR-21 の撤退条件 (4) と同じ事実で、同じ機会に 1 回と数える。
    1 回で、ADR-3 決定 (8) の (ア) の相手（scribe2 の契約表）と (イ) の範囲の論点を元の読みへ戻すかを持ち主へ問う。戻すなら本判断の改訂の欄を取り下げる判断の記録を起こす（ADR-21 の撤退条件 (4) で起こす記録と 1 本に束ねてよい）。
    (2) 移す相手の出現: folio2 の道具の置き場を持つ外部の利用者のうち、設計文書を folio2 の形でなく（散文か前の版の道具の形で）持ち、それを folio2 の形へ移すと持ち主か利用者の持ち主が台帳に記帳した回を数える。
    数える口は台帳 f2-648 の notes と、利用者の台帳の項の名指しである。1 回で、その利用者について移す範囲の論点を起こす判断の記録を起こす（本判断の (3) が閉じた論点を、その利用者について開き直す）。
    (3) 向きが v3 の置き場で立たない: v3 の置き場の契約表を持つ設計ノートに導出物の命令を撃って導出物を作れなかった回（命令が違反か「まだ分からない」で終わり、直しを当てても同じ理由で終わった）を数える。
    数える口は、v3 の置き場の台帳の記帳と、席が v3 の repo を読み取りだけで撃った結果の 2 つで、どちらも席が台帳 f2-648 の notes に写した回を数える（写していない回は数えない）。
    同じ種類の失敗が規則の表の行 R-7 の回数を超えたら、契約表を設計ノートの YAML 正本の節から導出物へ作る向き（本判断の (2) が残した向き）を v3 の置き場で問い直す判断の記録を起こす。
    同じ種類の定めは行 R-7 の同じ種類の欄（検査の id・判定・対象の path の 3 つ組）に従い、本判断は別の定めを持たない。当てはめは、検査の id = 導出物の命令、判定 = 違反か「まだ分からない」、対象の path = その設計ノートの path である。
    ADR-21 の撤退条件 (2)（v3 の設計が器は契約を型で受けると決めた回）に当たったときも、同じ記録で本判断の (2) の向きを一緒に問い直す（二重に記録を起こさない）。
    (4) 数えられない回（scribe2 の台帳が読めない・v3 の repo が読めない・利用者の台帳が読めない）が規則の表の行 R-7 の回数を超えたら、本判断の撤退条件の判定を「まだ分からない」に落として持ち主へ渡す（条 P-4.2・P-11.1）。
    数えられない回は、どの条件でもその機会ごとに 1 回と数え、「同じ」とみなすのは（撤退条件の番号・数えられなかった理由）の 2 つ組が一致する回である。v3 の台帳が立つ前の「v3 の台帳が無い」は、数える物が無いとして数えない。

