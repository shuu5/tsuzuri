id: ADR-22
title: 契約表を「folio2 の M1 で設計ノートの YAML 正本と導出物へ移す」とした順序を閉じる — 判断の記録 ADR-3 の決定 (8) の範囲を、判断の記録 ADR-16 と ADR-21 が既に決めた形（導出物の口は M3・scribe2 の設計文書の契約表は移さない・YAML 正本と導出物で持つのは v3 の設計の置き場が自分の repo で書く契約表）まで狭め、ADR-16 の決定 (1) の「M3 の後に改めて問う」の句を閉じる

status: accepted
date: 2026-09-24

plain: |
  判断の記録 ADR-3（2026-09-16 発効）は、scribe2 と folio2 の受け持ちの線引きを決めた記録です。その 8 番目の決定は、次の順序を決めていました。
  「scribe2 の便の約束の表（契約表）は、いまの形（scribe2 の設計文書の中の、機械が読む区間）で先に使い始め、folio2 の段 M1 で、設計ノートの YAML の正本と、そこから作る写し（導出物）へ移す」。
  あわせて、「scribe2 の設計文書のどこまでを YAML へ移すか」は別の論点として、あとであなたに聞くことにしていました。

  その後に、3 つのことが起きました。
  1 つ目。導出物を作る口は M1 では作らず、次の段 M3 で作りました（判断の記録 ADR-16・要件 FR11）。
  2 つ目。2026-09-24 に、scribe2 の持ち主の裁定で、scribe2 の設計文書を folio2 の形へ移す計画は取りやめになりました。scribe2 は残りの仕事を前の版の道具（folio v1）のまま片付けます（判断の記録 ADR-21）。
  3 つ目。M3 の相手は、器の次の世代（scribe v3・以下 v3）の設計の置き場になりました。v3 は設計文書を最初から folio2 の形で書くので、移すものがありません（同じく ADR-21）。

  ところが、ADR-3 の 8 番目の決定を「狭める」記録がどこにもありませんでした。
  ADR-16 も ADR-21 も、この決定を名指していません。判断の記録の書き方の決まりでは、発効した決定の範囲を後から変えるときは、変える側の記録の「改訂の欄」に書くことになっています。
  そのため、発効した記録どうしが「M1 で scribe2 の契約表を移す」と「導出物は M3・scribe2 の文書は移さない」を同時に言っている形になり、天井の 32 周目がそれを「止める」と指摘しました。

  この判断では、ADR-3 の 8 番目の決定を狭めます。
  ・「M1 で移す」の順序は閉じます。導出物を作る口は M3 に在ります（ADR-16 が決めたとおり）。
  ・scribe2 の設計文書の中の契約表は移しません。scribe2 の契約表は、いまの形のまま最後まで使われます（ADR-21 が決めたとおり）。
  ・「契約表は設計ノートの YAML の正本に置き、器が読む写しをそこから作る」という向きは、向きとして残します。この判断は相手を足しません。v3 の設計の置き場が自分の repo で最初から書く契約表にこの向きを当てるのは、ADR-16 と ADR-21 の決定です。
  ・「scribe2 の設計文書のどこまでを移すか」の論点は、移す相手が無くなったので閉じます。ADR-16 の決定 (1) の「契約表を持たない設計文書の移行は、M3 の後に改めて問う」の句も、同じ理由で閉じます。

  ADR-3 と ADR-16 の決定の文そのものは書き換えません。この判断の改訂の欄と、2 つの記録の注の段で断ります（今までの判断の記録と同じやり方です）。
  要件書の制約 CON8 と M3・M1 の範囲の節の字は、承認の後に席が今の段に合う字に直します。

  やめる条件も決めます。scribe2 が移行を再開したとき、設計の文書を folio2 の形でなく持っている利用者が新しく現れたとき、v3 の置き場で契約表から導出物が作れない失敗が続いたときに、あなたに問い直します。

context: |
  (1) 出所。天井の 32 周目（本流 68196cf・2026-09-24）の文書どうしの整合の所見 1（F-1・重さ 止める・反証で 支持）。
  所見の要旨は、判断の記録 ADR-3 決定 (8)「順序は、契約表を今の形（scribe2 の設計文書の中の機械が読む区間）で着地させ、folio2 の M1 で設計ノートの YAML 正本と導出物へ移す」が逐語で生きたまま、
  判断の記録 ADR-16 はその段を M3 に置き、判断の記録 ADR-21 は scribe2 の設計文書は移らないとして論点を閉じたが、どちらの改訂の欄も ADR-3 決定 (8) を名指していない、である。
  反証は支持で、退けた読みは 3 つ（ADR-21 決定 (0) の「scribe2 の設計文書の移行のためだけに置いた論点の閉じ方」に (8) が含まれる読み・ADR-16 の注 (e) が (8) を狭めた読み・M1 を過ぎたので (8) は失効した読み）である。
  どれも、判断の記録の欄の決まり（改訂の欄は「発効した判断が生きたまま、その決定の範囲が別の判断で変わる」ときに使う）と、ADR-21 決定 (6)（範囲の改訂は改訂の欄が持つ）で退けられた。
  同じ形の所見は天井の 29〜31 周目にも在り（判断の記録 ADR-13 決定 (8) の件）、そのときは判断の記録 ADR-20 の改訂の欄で解いた。
  同じ周の整合の所見 2（F-2・要件書の制約 CON8 の本文の頭の文が「M1 で…導出物へ移す」と言い切り、末尾の文が取りやめを言う）と所見 3（F-3・要件書の M3 の範囲の節の作らないの行が「要件書 CON8 のとおり M3 の後に改めて問う」と CON8 を指すが、CON8 の末尾は「論点は閉じた」と言う）は、F-1 の根の字を写した所である。

  (2) ADR-3 決定 (8) の中身。決定 (8) は 2 つの文を持つ。
  (ア) 順序の文。scribe2 の契約表を今の形で着地させ、folio2 の M1 で設計ノートの YAML 正本と導出物へ移す（scribe2 planner の裁定・s2-07l.197 notes 2026-09-13）。
  (イ) 範囲の文。設計文書を YAML へ移す範囲は M1 の要件書の承認時に持ち主へ出す別の論点とする。
  (イ) は要件書 第 1.1 版の承認（2026-09-16）で「最初の範囲は契約表を持つ設計文書だけ・他の設計文書の移行は M1 の後に改めて問う」と裁定され、要件書の制約 CON8 がその字を持つ。
  ADR-16 決定 (1) は「契約表を持たない設計文書の移行は、要件書 CON8 のとおり M3 の後に改めて問う」と時機を M3 の後へ定め直し、CON8 は第 1.33 版でそれに追随した（ADR-16 の注 (e)）。

  (3) その後に決まったこと（どれも発効した判断か要件書の版）。
  (ウ) 導出物の口の段。要件 FR11（導出物）は M1 の要件として第 1.1 版で足されたが、保留（第 1.30 版）を経て、ADR-16 決定 (5)(7) で M3 の口 ⑤（便 119・独立の命令）に置かれ、第 1.39 版で段の欄が M3 になった。
  要件書の M1 の範囲の節の作らないの行は「導出物の生成・差分 0 の検査（M1 で作ると決めた後に保留にし、M3 の口へ移した）」と書く。
  M1 の段で着地したのは、設計ノートの型と契約表の節（要件 FR9・FR10）と散文の門（FR12）と索引（FR14）と図（FR15）で、scribe2 の契約表はどれにも移っていない。
  (エ) scribe2 の設計文書の移行の取りやめ。2026-09-24 の scribe2 の持ち主の裁定（scribe2 の台帳 s2-07l.214 notes・folio2 の控え 台帳 f2-648.188）で、scribe2 は残りの契約を前の版の道具（folio v1）のまま畳む。
  ADR-21 は M3 の利用者を器の次の世代（scribe v3・以下 v3）の設計の置き場（新しい置き場（scribe3）の repo の design-intent）へ読み替え、v3 は設計文書を移さず最初から folio2 の形で書く、とした（ADR-21 決定 (1)）。
  (オ) ADR-21 の改訂の欄は 5 行で、ADR-16 決定 (1)(3)(6)(7) と ADR-3 決定 (7) の撤去の句だけを狭める。ADR-16 の改訂の欄は ADR-2 決定 (3) と ADR-3 決定 (7) を広げる 2 行だけである。
  ADR-3 決定 (8) を名指す改訂の行は、どの判断の記録にも無い（本判断の起草の全数の読み・判断の記録の置き場の 21 本）。

  (4) (8) を生きた向きとして引く所（本判断の起草・本流 68196cf・design-intent と docs/design の全数の読み）。
  判断の記録 ADR-16 は、文脈 (1) で「判断の記録 ADR-3 決定 (8) と要件書 CON8 が…と裁定済み」と、決定 (1) の末尾で「契約表を持たない設計文書の移行は、要件書 CON8 のとおり M3 の後に改めて問う」と、
  案 d（器の設計文書の散文を道具が直に読む案）の退けた理由で「判断の記録 ADR-3 決定 (8) が「M1 で設計ノートの YAML 正本へ移す」と決めた向きの逆でもある」と、注 (e) で「ADR-3 決定 (8) は移す順序を決め」と引く。
  判断の記録 ADR-3 の平易文は「scribe2 の設計文書を folio2 の形（YAML）へ移すのは M1 で、どこまで移すかはそのとき改めてあなたに聞きます」と書く。
  要件書は、制約 CON8 の本文と出所の欄・M1 の範囲の節の注（「設計文書（scribe2 の docs/design）を YAML 正本へ移す範囲は CON8 の別の論点」）・M3 の範囲の節の作らないの行（CON8 を指す句）で引く。
  設計ノートの欄の決まり（design-note/schema.yaml）の対応表の行は「ADR-3 決定 (8) → 本 file の外（順序と範囲 = 要件書 CON8）」と指すだけで、向きの字を持たない。
  要件書の来歴の欄（第 1.1 版からの変更の行）と、docs/design の便の設計ノートの置き場の行（folio2 自身の設計ノートを「M1 で YAML 正本へ移す」と書く 43 本）と、仕分けの記録は、起草の時点の字の記録である。
  床の歯の fixture（tests/fixtures/floor_base の要件書と設計ノートの欄の決まり）は凍結した写しで、床の入力ではない。

  (5) 何が今も生きているか。ADR-3 決定 (8) のうち、次の向きは ADR-16 と ADR-21 のもとでも生きている。
  契約表は設計ノートの YAML 正本の節に置き、器が読む形の写し（導出物）はそこから道具が作る（器の設計文書の散文を道具が直に読まない・ADR-16 案 d の退けた理由の本体）。
  ADR-21 決定 (1) の判定点 ②③（導出物が v3 の repo に着地して差分 0 を数えられる・v3 の便を運ぶ器の受付がその導出物を読んで通す）は、この向きを v3 の置き場で確かめるものである。
  変わったのは、段（M1 → M3 の口）と、(8) の相手から scribe2 の設計文書の中の契約表が外れたこと（向きは向きとして残り、v3 の設計の置き場が自分の repo で書く契約表に当てるのは ADR-16 決定 (1)(5) と ADR-21 決定 (1) で、(8) の側で相手を足さない）と、(イ) の範囲の論点の相手の有無だけである。

decision: |
  (0) 本判断は条文を改訂しない。規則の表の行を足さない。便を起こさない。決めるのは、判断の記録 ADR-3 決定 (8) の範囲を、ADR-16 と ADR-21 が既に決めた形まで狭めることと、
  ADR-16 決定 (1) の末尾の「契約表を持たない設計文書の移行は、要件書 CON8 のとおり M3 の後に改めて問う」の句を閉じることだけである。ADR-3 の決定 (1)〜(7)(9) と、ADR-16・ADR-21 の他の決定は変えない。

  (1) **「M1 で移す」の順序を閉じる（ADR-3 決定 (8) の (ア) を狭める）。**
  (ア) の「folio2 の M1 で設計ノートの YAML 正本と導出物へ移す」は、本判断の発効の後、M1 の段の義務として読まない。
  導出物の口の段は、ADR-16 決定 (5)(7) と要件 FR11 の段の欄（M3）が持つ。M1 の段で着地した設計ノートの型と契約表の節（要件 FR9・FR10）は、(ア) の向きの受け皿として残る。
  (ア) の前半「契約表を今の形（scribe2 の設計文書の中の機械が読む区間）で着地させ」は、scribe2 の契約表の終わりの形として残る。scribe2 は前の版の道具のまま残りの契約を畳むので（ADR-21 文脈 (1)）、その契約表は今の形のまま使い終わる。

  (2) **scribe2 の設計文書の中の契約表は移さない（(ア) の当てる相手を狭める）。**
  (ア) が移すと定めた相手のうち、scribe2 の設計文書の中の契約表は、scribe2 の設計文書の移行の取りやめ（ADR-21）で相手から外す。
  契約表を設計ノートの YAML 正本の節に置き、器が読む導出物をそこから道具が作る向きは残す。その向きを M3 の出口の利用者（v3 の設計の置き場）が自分の repo で最初から設計ノートの形で書く契約表に当てるのは、ADR-16 決定 (1)(5) と ADR-21 決定 (1) である。
  本判断は (8) の側で相手を足さない。v3 の契約表は「移す」ではなく「最初からその形で書く」もので、判定点 ②③ が v3 の置き場でこの向きを確かめる（ADR-21 決定 (1)）。
  folio2 自身の設計ノート（docs/design の便の契約表と裁定の記録）の扱いは (8) の相手ではなく、本判断は変えない（語彙の「設計文書」の項の注が持つ）。

  (3) **(イ) の範囲の論点を閉じる（ADR-3 決定 (8) の (イ) と ADR-16 決定 (1) の末尾の句を狭める）。**
  (イ)「設計文書を YAML へ移す範囲は…別の論点」は、要件書 第 1.1 版の裁定（契約表を持つ設計文書だけ）と ADR-16 決定 (1) の時機（M3 の後）を経て、scribe2 の設計文書について開いていた。
  scribe2 の設計文書は移らず（ADR-21）、v3 は設計文書を移さず最初から folio2 の形で書くので、問う相手が無い。本判断の発効で、この論点を閉じる。
  ADR-16 決定 (1) の末尾「契約表を持たない設計文書の移行は、要件書 CON8 のとおり M3 の後に改めて問う」も、同じ理由で閉じる（改訂の欄の 2 行目）。
  ADR-21 の改訂の欄の 1 行目も同じ ADR-16 決定 (1) を狭めるが、それが外したのは決定 (1) の範囲の文の中の「設計文書を移す話」（M3 の中の移行）で、末尾の問う句（M3 の後の時機の文）は名指していない。本判断の 2 行目はその句だけを閉じ、ADR-21 の 1 行目と重ならない。
  ADR-21 決定 (1) は「M3 に入れないもの（ADR-16 決定 (1) の列）は変えない」とし、列のうち「利用者の憲法・判断の記録・調べものの文書の移行」は当たる物が無いと読んだ。本判断はその読みを、列の後ろの問う句にも同じく当てるだけで、M3 に入れないものの列は変えない。
  設計文書を folio2 の形でなく持っている外部の利用者が新しく現れたら、移す範囲の論点はその利用者について新しい判断の記録で起こす（撤退条件 (2)）。

  (4) **発効した決定の本文は書き換えない。** ADR-3 と ADR-16 の決定・文脈・案・撤退条件・承認欄と見出しの字は変えない。範囲の改訂は本判断の改訂の欄が持ち（欄の決まりのとおり改訂する側の片側だけ）、
  ADR-3 の注と ADR-16 の注に 1 段ずつ、本判断の読みと改訂の欄の在り処を断る。ADR-3 の平易文の末尾に読み方の 1 段を足す（決定の字ではなく平易文なので、ADR-21 が ADR-16 の平易文に読み方の段を足した形に倣う）。
  ADR-16 の案 d の退けた理由の「ADR-3 決定 (8) が「M1 で設計ノートの YAML 正本へ移す」と決めた向き」と注 (e) の「ADR-3 決定 (8) は移す順序を決め」は、向き（YAML 正本の節から導出物を作る・散文を直に読まない）が生きていることで理由として立つので、字は変えず ADR-16 の注の段で本判断の読みを断る。
  要件書の制約 CON8 と M1・M3 の範囲の節の字は、承認の後に席が書く（承認要求 docs/design/adr-22.md の §3）。

  (5) 憲法の条文は 1 字も改訂しない。条文の改訂が要ると分かったら、その時点で本判断を止めて条 A-2 の手順へ移す。

options:
  - id: a
    name: 改訂の欄で ADR-3 決定 (8) と ADR-16 決定 (1) の末尾の句を狭め、決定の本文は書き換えず注で断る（採る）
    text: |
      決定 (1)〜(4) の形。小さい判断の記録 1 本の改訂の欄に 2 行（ADR-3 決定 (8)・ADR-16 決定 (1)）を置き、ADR-3 と ADR-16 の注に 1 段ずつ、ADR-3 の平易文に読み方の 1 段を足す。要件書の字は承認の後に直す。
    verdict: adopted
    reason: |
      判断の記録の欄の決まりの改訂の欄は、発効した判断が生きたまま、その決定の範囲が別の判断で変わるときの口である。ADR-3 は決定 (1)〜(7)(9) が生きており（要件 FR9・FR10・FR12・FR14・規則の表の行 R-16）、(8) も向き（YAML 正本の節から導出物を作る）が生きている。変えるのは段と相手と範囲の論点の有無だけなので、この口に合う。
      ADR-21 決定 (6) が範囲の改訂を改訂の欄に限ったのと同じ形で、天井の 29〜31 周目の同じ形の所見を ADR-20 の改訂の欄で解いた先例とも揃う。
      中身は ADR-16 と ADR-21 が既に決めたことの帰結で、新しい向きを足さない。費用は判断の記録 1 本と注 3 段と要件書の字 3 か所である。
  - id: b
    name: ADR-3 を退役させ、決定 (8) を除いた後継の判断の記録で置き換える
    text: |
      ADR-3 の状態を退役（retired）にし、後継の判断の記録が置き換えの欄（supersedes）で置き換える。後継は決定 (1)〜(7)(9) を写し、(8) を今の形に書き直す。
    verdict: rejected
    reason: |
      状態は判断の記録 1 本に 1 つで、決定 (8) だけを退役させる口は無い。退役させると、生きている決定 (1)〜(7)(9) を後継へ 1 字も変えずに写すことになり、ADR-16 と ADR-21 の改訂の欄のうち ADR-3 決定 (7) を行き先に持つ 2 行と、要件書・設計ノートの欄の決まりの対応表・規則の表の行の出所が指す ADR-3 を、後継へ付け替えるかどうかの判断が要る。
      決定の生きている判断を廃止の状態にすることは、条 P-7.2 の状態の意味とも合わない。ADR-21 案 b（ADR-16 を退役させる案）を退けた理由と同じである。
  - id: c
    name: 注だけで断る（改訂の欄を使わない）
    text: |
      判断の記録を起こさず、ADR-3 の注に「決定 (8) の段は ADR-16、相手は ADR-21 で変わった」と 1 段足し、要件書の字を直すだけにする。
    verdict: rejected
    reason: |
      判断の記録の欄の決まりは、範囲を変える口を改訂の欄に置き、注を範囲の改訂の口にしない。ADR-21 決定 (6) も範囲の改訂は改訂の欄が持つと限る。注だけで断ると、発効した決定の範囲が判断の記録の口と持ち主の承認を経ずに変わることになる（条 A-2 の形・条 P-13.3）。
      32 周目の反証は、ADR-16 の注 (e) を (8) を狭めた記録と読む道を退けており、注の段を足しても同じ理由で退けられる見込みが高い（29〜31 周目の ADR-13 決定 (8) の件も、注では解けず改訂の欄で解いた）。
  - id: d
    name: ADR-3 決定 (8) の本文を今の段と相手の字に書き換える
    text: |
      決定 (8) の字を「導出物の口は M3・scribe2 の契約表は移さない」に直し、注に書き換えの記録を置く。
    verdict: rejected
    reason: |
      発効した判断の記録の決定の本文は書き換えない（ADR-17・ADR-20・ADR-21 の先例・一括 17 の問 8 で持ち主が承認した「発効した ADR-18 の決定の字は書き換えない」）。書き換えると、承認欄の逐語が承認した字と今の字が食い違い、何が承認されたかを判断の記録の上でたどれなくなる。
  - id: e
    name: 発効した ADR-21 の改訂の欄に ADR-3 決定 (8) の行を足す
    text: |
      32 周目の所見が挙げた直す先の候補の 1 つ目。ADR-21 の改訂の欄に 6 行目として ADR-3 決定 (8) を狭める行を足し、ADR-21 の注に追記の段を置く。
    verdict: rejected
    reason: |
      ADR-21 は 2026-09-24 22:38（日本時間）に持ち主の承認で発効し、承認要求は改訂の欄の 5 行を示して承認された。発効の後に改訂の欄の行を足すのは、承認された範囲の外の改訂を承認の記録なしに足すことになる（条 P-12・P-13.3）。
      足すには結局同じ承認が要り、それなら行き先の違う改訂を別の判断の記録に分けた方が、どの承認がどの行を認めたかを 1 対 1 でたどれる。

