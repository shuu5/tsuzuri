consequences:
  - M3 の出口の判定点 ①〜③ は v3 の置き場で数える。v3 の置き場は新しい置き場（scribe3）の repo に立っているが判定点の記帳はまだ無く、記帳が在るまで判定点は 3 つとも「まだ分からない」のままである（要件書の受入基準 AC23〜AC25 の形は変わらない）。
  - ADR-16 の撤退条件 (1) の窓は v3 の置き場が立った時点から始まり、発効の時点で既に始まっている。その時点は新しい置き場（scribe3）の骨格の版（5091abb・2026-09-24 17:45:49 JST）である。外の置き場の実測は写しの上なので数えない。そこで見た床に効く新しい種類の候補は 1 つ（裁定 id の形・台帳の接頭辞）で、閾値の 3 に届いていない。
  - v3 の入口に要る便は、台帳 f2-648.189〜.196 の 8 件の控え（骨格と面の生成器の食い違い・規則の表の引用符付きの id と索引の読み手・面と生成物に焼かれた「folio2」の名・外の置き場の始まりの凍結の手順と列の根の表・始まりの凍結が空の承認欄を凍結する罠・行 R-17 が無いと散文の言及の歯が黙ること・値域を狭める変更が黙って通ること・骨格の憲法の雛形が scribe2 の形であること）である。M3 の出口の判定点に直接効くのは列の根の表の行（⑦ = f2-648.192）と承認欄の罠（f2-648.193）で、ほかは面の側か黙りの側である。順は席が決める。
  - 骨格の命令が書く憲法の雛形は scribe2 の形（本来の憲法を指す・根拠の種別は値域の既存の値（scribe2-article）・名は床の受付の宣言（floor-declaration））である。v3 の持ち主は第 1.0 版の承認と凍結の前に、条と前文の字を v3 の字へ、憲法の名を v3 の名へ書き換える。名を凍結の後に変えると列の根の表の行と合わなくなる（ADR-16 の帰結）。本来の憲法を持たない利用者向けの雛形を道具に持つかは、v3 の入口の便の論点である（控え f2-648.196）。新しい置き場（scribe3）の憲法の名は今も床の受付の宣言（floor-declaration）である。
  - 散文の門の参照 id の形は folio2 の 4 種（条・規則の行・要件・契約）のまま、どの置き場でも同じになる。v3 は最初から folio2 の形で書く。参照 id の形を行 R-16 から読む便は起こさないので、要件 FR12 の規範文は今のまま残る。
  - 器（scribe2）の暫定の散文の門は scribe2 の中に残り、scribe2 が前の版の道具で残りを畳むあいだ scribe2 の門として働く。folio2 はその撤去の条件を持たない。規則の表の行 R-16 の注の「揃える向き・撤去の条件は ADR-16 決定 (6) の便が運ぶ」の字は、裁定 id を付けて閉じた字へ直す（承認の後に席が書く）。
  - 要件書の版が 1 つ上がる（M3 の範囲の節の指し先に本判断・要件 FR22 の注・受入基準 AC23〜AC25 の平易文と固定の材料の「scribe2」の字・制約 CON8 の末尾・要件 FR11 の注の s2-07l.473 の字・要件 FR12 の注の撤去の条件の字）。規範文と番号と段の欄は変わらない（条 P-7）。
    受入基準 AC25 の判定の文は、読んだ器の組み立てを名指す記帳を求める字になり、受入の判定が狭まる（決定 (1)・承認要求の 🔴 問 1 に載せた）。
  - 台帳 f2-648.93（器の暫定の散文の門の撤去を器へ要求する）は、folio2 が撤去の条件を持たなくなるので閉じる（決定 (3)）。
  - 判断の記録 ADR-16 の決定の本文は変わらない。読み方は本判断の改訂の欄と、ADR-16 の注の 1 段と平易文の末尾の 1 段が持つ。
  - v3 が folio の実装を同じ repo に合流させると、v3 の置き場は M3 の「外部の利用者」の性質を失う。その時機が判定点 ①〜③ の記帳より先に来たら、本判断の撤退条件 (1) で持ち主へ問う。
  - 本判断の発効は、判断の記録の状態の欄として周の引き金を動かす（どの判断の記録の発効も同じ）。便は起こさない。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 の notes に記帳する。v3 の repo は読み取りだけで見る。v3 の台帳の記録は id で名指して写す。
    (1) 外部の前提が崩れる: folio の実装（folio の組み立ての単位のソース）を v3 の repo へ移す取り込みが、M3 の出口の判定点 ①〜③ の記帳が揃う前に着地した回を数える。
    数える口は、v3 の repo の統合先の履歴に folio の組み立ての単位の置き場が現れた最初の commit と、判定点 ③ の記帳の時刻の前後である。
    v3 の置き場の憲法の名（meta.id）が folio2 の憲法の名（folio2-constitution）と同じになった commit が、判定点 ①〜③ の記帳が揃う前に統合先に入った回も、同じ (1) に数える（決定 (1) の 2 つ目の限定）。
    1 回で、条 P-13.4 の「外部の利用者で受入が通った後」の物差しを v3 の置き場で満たせるかを持ち主へ問い、案 b（新しい M3 の判断の記録）と比べ直す判断の記録を起こす。
    (2) 境界が導出物の file を使わない: 判定点 ③ の記帳より前に、v3 の設計文書で「器は契約を導出物の file でなく型で受ける」と決めた判断の記録か設計ノートが発効した回を数える。
    1 回で、判定点 ②③ の物差しを問い直す判断の記録を起こす（案 d と比べる）。
    (3) 判定点 ① が来ない: 本判断の発効の時刻から 30 日のあいだに、判定点 ① の記帳（v3 の置き場の床の合格と撃った folio の組み立ての要約値）が台帳 f2-648 の notes に名指されなかったら数える。
    数える口は台帳 f2-648 の notes である。1 回で持ち主へ問い、案 c（保留）と比べ直す。30 日は、ADR-16 の便 ①〜⑤ が 2026-09-24 に揃い、M3 の口が使われないまま置かれる期間の上限として置く（推測の閾値）。
    (4) scribe2 の移行の再開: scribe2 の台帳が scribe2 の設計文書の folio2 の形への移行の再開を記帳した回（s2-07l.214 か後継の項・folio2 の席が読んで写す）を数える。
    1 回で、ADR-16 の元の読み（利用者 = scribe2）へ戻すかを持ち主へ問う。戻すなら本判断の改訂の欄を取り下げる判断の記録を起こす。
    (5) 数えられない回（v3 の repo が読めない・v3 の台帳が読めない・scribe2 の台帳が読めない）が数値の表の行 R-7 の回数を超えたら、本判断の撤退条件の判定を「まだ分からない」に落として持ち主へ渡す（条 P-4.2・P-11.1）。
    数える時機は、v3 の repo の統合先に新しい commit が入った後の最初の本流の周の前に 1 回とし、(1)(2)(4) もこの時機に数える（(3) は発効から 30 日の時点で 1 回数える）。数えられない回は、どの条件でもその機会ごとに 1 回と数える。v3 の台帳が立つ前の「v3 の台帳が無い」は、数える物が無いとして数えない。
    「同じ」とみなすのは（撤退条件の番号・数えられなかった理由）の 2 つ組が一致する回である。

grill: {when: 2026-09-24, who: 独立の検証役（起草役とは別の文脈の AI・opus 5.5・読み取りと写しの上の実測だけ）と起草役の自己反証, where: ~/.local/share/folio2/handoff-2026-09-24/adr21-verify.md（再実行の道具 adr21-verify-scripts/）と docs/design/adr-21-grill.md（自己反証と改訂 c の当て方の一覧）, summary: 論点 8 つを崩しにかかった。中心（ADR-16 を生かしたまま利用者を v3 の置き場へ読み替え・判定点 ①〜③ を保つ・scribe2 の移行のためだけの論点を閉じる）は支持。条件付きの所は 3 つで、v3 を外部の利用者と数える条件（合流の前に限る）を決定 (1) と撤退条件 (1) に・判定点 ③ で読んだ器の組み立てを名指すことを決定 (1) に・骨格の雛形が scribe2 の形であることを帰結に書いた。残る危うさは v3 の境界の形と合流の時機で、撤退条件 (1)(2) が持つ。独立の検証の総合は条件付き支持で、中心の判断と改訂の欄 5 行の対と向きは支持した。穴は blocking 4（改訂の欄の形が歯を落とす〔改訂 b で閉じた〕・v3 の置き場は既に立ち器の受け口は着地済みという事実の誤り・持ち主の「folio2 で作ってはだめなのか」を問うていない・承認の後の欄の漏れ 4 行）と文面 7 と低い重さ 5 で、改訂 c で全部を席の裁定どおりに当てた。改訂 c の再検証は支持（blocking 0・新しい穴 3）で、改訂 d で当てた。}

