id: ADR-21
title: M3 の出口の利用者を scribe2 から器の次の世代（scribe v3）の設計の置き場へ読み替え、scribe2 の設計文書の移行に掛かる論点を閉じる — 判断の記録 ADR-16 の決定 (1)(3)(6)(7) と ADR-3 の決定 (7) の撤去の句の範囲を狭める

status: accepted
