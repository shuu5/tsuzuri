decision: |
  (0) 本判断は条文を改訂しない。規則の表の行を足さない。決めるのは、判断の記録 ADR-16 の決定のうち利用者を scribe2 と読んでいた所の読み替えと、
  scribe2 の設計文書の移行のためだけに置いた論点の閉じ方（判断の記録 ADR-3 決定 (7) の撤去の句を含む）と、ADR-16 の撤退条件 (1) の窓の起点である。ADR-16 の決定 (2)(4)(5) は変えない。

  (1) **M3 の利用者を v3 の設計の置き場へ読み替える（ADR-16 決定 (1) を狭める）。**
  本判断は、v3 の合流先の repo が folio2 の repo と別の repo である（今の置き場は新しい置き場（scribe3）の repo・文脈 (9)）ことを前提とする。持ち主がこの前提を否とする（folio2 の repo を v3 に育てる）なら、本判断は発効させない（承認要求の 🔴 問 2・案 c）。
  ADR-16 決定 (1) の「外部の利用者 1 つ（scribe2）」は、本判断の発効の後、「v3 の設計の置き場（v3 の repo の下に folio init --dir で書いた置き場）」と読む。
  M3 の出口は、その置き場の 1 本目の契約表を持つ設計ノートが判定点 ①〜③ を通ったときである。判定点の中身は ADR-16 決定 (1) のまま、場所を v3 の置き場とする＝
  ① v3 の置き場で床が合格する（撃った folio の組み立ての要約値を記帳に添える）、② 導出物が v3 の repo に着地して差分 0 を数えられる、③ v3 の便を運ぶ器の受付がその導出物を読んで通す。
  判定点 ③ の記帳は、読んだ器の組み立て（器の repo と commit）を名指す。v3 の器は今の器（scribe2）から v3 の中の器へ替わりうるので、どの器が読んだかを特定しないと判定点 ③ を確かめ直せないためである。
  判定点の記帳は v3 の置き場の台帳が持ち、folio2 の台帳 f2-648 はその id を名指す。記帳が無いあいだ判定点は「まだ分からない」である（要件書の受入基準 AC23〜AC25 の形のまま）。
  M3 に入れないもの（ADR-16 決定 (1) の列）は変えない。そのうち「利用者の憲法・判断の記録・調べものの文書の移行」は、v3 が移さず新しく書くので当たる物が無い。
  面の生成と配信・注入は、v3 の置き場でも M3 の出口に入れない（外の置き場の実測で骨格のままでは落ちる命令が在るが、それは v3 の入口の便で扱う・帰結）。
  利用者の依存として folio を固定する裁定を scribe2 の憲法の条（A3）に結んだ字は、v3 では v3 の設計が決める（同じ組み立ての束に入れば依存の追加ではなくなる）。
  v3 の置き場を M3 の「外部の利用者」と数えるのは、その置き場が folio の実装を持つ repo と別の repo に在り、その置き場の憲法の名が folio2 の憲法の名と違うあいだとする（文脈 (7)）。

  (2) **置き場と骨格の形を、本来の憲法を別に持つ利用者に限る（ADR-16 決定 (3) を狭める）。**
  決定 (3) の「scribe2 の置き場は design-intent/folio2 とする」と、骨格の憲法を「床の受付の宣言」と題して規範文と前文が利用者の本来の憲法を指し根拠の種別を値域の既存の値（scribe2-article）で結ぶ形は、
  同じ repo に本来の憲法（前の版の文書群）を別に持つ利用者に限って当てる。v3 の置き場の場所は v3 が選ぶ（連絡の字は v3 の repo の design-intent）。
  v3 の骨格の憲法は v3 の憲法そのものとし、v3 の持ち主が骨格の雛形の「本来の憲法を指す」字を v3 の条へ書き換えてから第 1.0 版を承認し、その後に始まりの凍結を撃つ（文脈 (6)）。
  骨格の命令の振る舞いと雛形は本判断では変えない（便を起こさない）。本来の憲法を持たない利用者向けの雛形を持つかは、v3 の入口の便の論点として残す（帰結）。
  決定 (3) のうち、既に別の文書群が在る置き場には書かないこと・雛形に folio2 の口座名と席とモデルの名と持ち主の逐語を写さないこと・相談窓口の雛形の扱い・案内の 1 行は変えない。

  (3) **scribe2 の移行のためだけの論点を閉じる（ADR-16 決定 (6) を狭める）。**
  決定 (6) のうち、scribe2 の値（器の 9 形）・種の振り分けの初版・数と単位の読み方を scribe2 が folio の読みに揃えること・器の暫定の散文の門（scribe2 の側の要件が持つ門）の撤去の条件・
  形だけ認める形の字の並びを器の歯の 12 例に合わせる fixture は、scribe2 の設計文書が folio の置き場へ移らないので閉じる。
  参照 id の形を行 R-16 から読む便（撤去の前提の便）は起こさない。要件 FR12 の規範文の直し（参照 id の 4 種の列挙を行 R-16 の値の形へ）もその便と同じ版の予定だったので行わない。FR12 の規範文は今の 4 種のままである。
  決定 (6) の形（参照 id の形は道具の閉じた一覧から置き場ごとに行 R-16 の値で選び、形ごとに解決か形だけ認めるかを持つ）は向きとして残す。
  folio2 の形の外の参照 id を要る利用者が出たときに、その便を改めて起こす。v3 は最初から folio2 の参照 id の形で書く（連絡の (エ)）ので、M3 の出口はこの便を要らない。
  folio2 の行 R-16 の値と folio2 の散文の門は 1 字も変わらない。
  器の暫定の散文の門の撤去は、folio2 の判断の記録が条件を持たない器の側の扱いとする。判断の記録 ADR-3 決定 (7) の「M1 が引き取ったら撤去する」は、ADR-16 決定 (6) が条件を定め直した字で、
  その定め直しを本判断が閉じても元の字へは戻らない（改訂の欄で ADR-3 決定 (7) の撤去の句も狭める）。器は利用者の設計文書を folio の床に掛けないまま前の版の道具で畳むので、撤去の時機は器の持ち主が決める。
  章の上限 12 を超える scribe2 の文書の論点（ADR-16 文脈 (8)・案 i）は、決定 (5) が導出物を配信の組み立てから切り離したことで M3 の判定点から既に外れており、利用者が v3 に替わっても変わらない。v3 は章の上限の中で書く。

  (4) **便の列から scribe2 の側の便を外す（ADR-16 決定 (7) を狭める）。**
  決定 (7) のうち、参照 id の形を行 R-16 から読む便と、利用者の側の便（読む file の述語・導出物の差分の歯・要件書の最小の写しの導出・暫定の門の撤去）は、列から外す。
  ⑦（列の根の表に利用者の行を足す便）は残し、利用者を v3 の置き場と読む。起こすのは、v3 の持ち主が v3 の憲法の第 1.0 版を承認し、始まりの凍結の命令が要約値の全桁を出して断った後である（規則の表の行 D-11 の手順）。
  運ぶのは、そのとき folio の実装を持つ repo の便である（合流の前は folio2 の便）。
  v3 の入口に要る便（台帳 f2-648.189〜.196 の 8 件の控え）は M3 の列に入れない。帰結で名指すだけで、順は席が決める。

  (5) **ADR-16 の撤退条件の数え方（ADR-20 決定 (4) と同じ形・撤退条件の字は変えず ADR-16 の注で断る）。**
  撤退条件 (1)（洗い出しの漏れ）の窓の起点は、v3 の置き場が立った時点＝v3 の repo に骨格の命令が書いた置き場を載せた最初の commit の時刻とする。
  その時点は新しい置き場（scribe3）の repo の版（5091abb・2026-09-24 17:45:49 JST）で、発効の時点では窓は既に始まっている。席はその repo と commit と時刻を台帳 f2-648 に記帳する。窓の終わりは M3 の出口（判定点 ③ の記帳）のまま。
  基準の 7 種類（ADR-16 文脈 (2)(3) の (ア)〜(キ)）と閾値（3 種類）と戻し先は変えない。外の置き場の実測（文脈 (5)）は時刻では窓の中だが、v3 の repo でなく写しの上の実測なので数えない。
  床に効く種類の候補（裁定 id の形）が 1 つ在ったことを記帳の最初の行に添える。
  撤退条件 (2)(3)(4) は字のまま数え、「利用者」を v3 の置き場と読む。

  (6) **発効した決定の本文は書き換えない。** ADR-16 の決定・文脈・案・撤退条件・承認欄と見出しの字は変えない。範囲の改訂は本判断の改訂の欄が持ち（欄の決まりのとおり改訂する側の片側だけ）、
  ADR-16 の注に 1 段で本判断の読みと改訂の欄の在り処を断る。ADR-16 の平易文の末尾に、利用者の読み替えの 1 段を足す（決定の字ではなく平易文なので、先例 ADR-20 が ADR-18 の平易文を直した形に倣う）。
  要件書と規則の表の行 R-16 の注の字の揃えは、承認の後に席が書く（承認要求 docs/design/adr-21.md の §3）。

  (7) 憲法の条文は 1 字も改訂しない。条文の改訂が要ると分かったら、その時点で本判断を止めて条 A-2 の手順へ移す。

options:
  - id: a
    name: ADR-16 を生かしたまま、利用者を v3 の設計の置き場へ読み替え、scribe2 の移行のためだけの論点を閉じる（採る）
    text: |
      決定 (1)〜(7) の形。ADR-16 の決定 (1)(3)(6)(7) を改訂の欄で狭め、決定の本文は書き換えない。
