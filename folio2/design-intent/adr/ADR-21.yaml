      丸ごと置き換えると、生きている決定 (2)(4)(5) を 1 字も変えずに後継へ写し、ADR-16 の改訂の欄 2 行（ADR-2 決定 (3) を広げる行と ADR-3 決定 (7) を広げる行）も後継へ移すことになる。移さないと列の根の表の根拠が退役した判断に残る。
