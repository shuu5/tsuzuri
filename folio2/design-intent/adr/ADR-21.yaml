      討論の起こしの推奨は「設計ノートの行 → 契約（toml）」で、導出物の file の側である。v3 の最初の便を運ぶのは今の器で、今の器は導出物の file を読み、表の行の目標の欄（goal）も受ける（s2-07l.586 着地）。導出物の口（要件 FR11・便 119）は着地しており、受入基準 AC24・AC25 の形も在る。
      床の合格だけでは、条 P-13.4 が求める「外部の利用者の受入」のうち、器が folio の出力を実際に使える面が確かめられない。
      v3 の設計が型の境界を選んだときに ②③ を問い直すことは、本判断の撤退条件 (2) に置いた。
  - id: e
    name: 利用者を scribe2 のまま残し、scribe2 の移行の再開を待つ
    text: |
      ADR-16 の字を変えず、scribe2 が v3 の前に移行を再開するのを待つ。
    verdict: rejected
    reason: |
