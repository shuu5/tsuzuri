plain: |
  folio2 の次の段（M3）は、「folio2 以外の場所で、folio2 の道具の検査に合格できるか」を確かめる段です（判断の記録 ADR-16）。
  その「folio2 以外の場所」には、scribe2 の repo を選んでいました。scribe2 の設計文書のうち、便の約束の表（契約表）を持つものを folio2 の形に移して、検査に掛ける計画でした。
  ところが 2026-09-24 に、scribe2 の持ち主の裁定で、この移行は取りやめになりました。
  scribe2 は残りの仕事を前の版の道具（folio v1）のまま片付けます。folio2 の形へ移るのは、器の次の世代（scribe v3・以下 v3）を作るときです。
  v3 は、scribe2 の中心の部分と folio2 と画面の層を 1 つの repo にまとめる世代で、v3 の設計文書は最初から folio2 の形で書きます（folio2 の道具の init 命令が書く骨格から始めます）。
  その置き場は 2026-09-24 の夕方に、新しい repo（名は scribe3）の中にもう立っています。
  このままでは、ADR-16 の出口は「scribe2 が文書を移して合格したとき」のままで、その日は来ません。

  この判断では、出口の相手を scribe2 から「v3 の設計の置き場」に読み替えます。
  出口の 3 つの確かめ（その置き場で道具の検査に合格する・便の約束の写しがそこに入ってずれが 0 と数える・便を運ぶ道具がその写しを読んで通す）は、そのまま v3 の置き場で確かめます。
  「移す」の話は無くなります。v3 は移すのでなく新しく書くからです。
  ADR-16 の決定の文そのものは書き換えません。発効した判断の記録なので、この判断の「改訂の欄」と、ADR-16 の注の 1 段で断ります（今までの判断の記録と同じやり方です）。

  あわせて、scribe2 の移行のためだけにあった話を閉じます。
  scribe2 の文書の番号の書き方（9 種類）に合わせる話、章が多すぎる文書の話、scribe2 の側の仮の検査を外す話です。
  v3 は最初から folio2 の番号の書き方と章の上限で書くので、どれも要らなくなりました。
  番号の書き方を置き場ごとに変える仕組み（ADR-16 の決定 (6)）の考え方は残しますが、そのための便はいまは起こしません。

  v3 の置き場で検査を通すまでに直す所（骨格のままだと画面が作れない・「folio2」という名前が画面に焼き込まれている、など）は、別の控え 8 件に書いてあります。
  その順番は席が決めるので、この判断には並べません。

  やめる条件も決めます。folio の実装そのものが v3 の repo へ移ってしまい、v3 が「外の利用者」と言えなくなったら、あなたに問い直します。
  v3 の設計が「便の約束は写しの file でなく型で渡す」と決めたら、出口の 3 つの確かめのうち後ろの 2 つを問い直します。
  発効から 30 日たっても v3 の置き場で検査の合格が記帳されないとき、scribe2 がやはり移行を再開したときも、あなたに問い直します。

  あなたは scribe2 の側で「それを folio2 で作ってはだめなのか」と問うていました。その答えはまだ記録に見つかりません。
  v3 を folio2 と別の repo で作るか、folio2 の repo を v3 に育てるかを、別の問いであなたに聞きます。
  folio2 の repo で作るなら、v3 は「外の利用者」になれないので、この判断は発効させず保留にします。

