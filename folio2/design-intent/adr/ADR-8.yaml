# folio2 判断の記録 ADR-8 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。人が読む面は判断の記録の面（adr-8.html・生成物・手で直さない）。
# 状態: accepted（発効 2026-09-19・持ち主の承認は approval 欄・裁定 id = f2-648.52 notes 2026-09-19）。条文の改訂ではない（amends は空）。要件書の改訂（v1.6・FR17 / FR18・AC15 / AC16）は本判断の発効と同じ承認で運んだ。grill は独立の審査役（opus・読み取り専用）が発効の前に行い、記録は docs/design/adr-8-grill.md。
# 位置: f2-648.52。元になった持ち主の直命 = 2026-09-19「作ったdesign-intentを様々な観点でレビューしてそのプロジェクトと整合しているか確認するレビューエージェントなどは不可欠なはずだ」（台帳 f2-648 notes に逐語・論点 C の裁定「天井は置き換えの前提条件にしないが M2 で建てる」）。
id: ADR-8
title: 天井（AI による意味の検査）は、文書の型ごとの係を作らず、汎用の 4 観点を folio が組む「材料の束」で回し、所見を型付きの file と 3 値で受ける — folio は AI を起動せず、材料の形と所見の形だけを床で数え、床の合格と天井の合格を混ぜない
status: accepted
date: 2026-09-19
context: 持ち主は 2026-09-19 に、設計文書を様々な観点で読み直して 実際に作っているものと整合しているかを確かめる AI の検査（天井）は不可欠だと述べた（台帳 f2-648 notes・対話面 R-8）。planner 席が同日に確かめた事実は次のとおり。(1) folio2 の天井は 0 本で、面は正本の逐語で組み AI の散文の枠を持たない（P-6.1・P-6.2）ため、前の版の「生成物が正本の正確な要約か」の観点はそのままでは空になる。要件書の M0 と M1 の範囲は「読みやすさの AI 検査と見た目の AI 検査は、建てないあいだ P-4.2 に従って『まだ分からない』として表に出す」までである。(2) 憲法 P-3 は「機械で決定的に検査できる項目は床に、意味の検査（読みやすさ・忠実さ）は AI の天井に置き、床の合格を天井の合格として扱わない」を求める。(3) 憲法 N-5 は文書の型ごとの AI の係（agent）と検査の観点（lens）の増設を拒み、rules 行 R-1（要件書 NFR1）は folio が AI へ常時渡す説明文を 2,000 字以下に縛る。前の版（folio v1）は文書の型ごとに係を増やして 36 本になり、これが N-5 と R-1 の由来である。(4) 前の版が天井で到達していた教訓は 5 つある。完成の合格は床の全通過と天井の合格の両方が要る／床は単独で完成を名乗らず「天井は未」と返す／天井の材料は正本を基準（anchor）にし、生成物を自分で読んで自分を正しいとする二重の正本を封じる／止める重さの所見だけを独立の文脈で反証する 2 段目を持つ／所見が残る限り着地は既定で止まる。(5) 器（scribe2）は前の版の天井を 1 本も配線しておらず、器が便の審査に使う検査の観点（lens）は、契約と便ごとの作業用の複製（作業ツリー）を読んで合否と根拠を型付きの file（審査の結果 review.json）で返す形である。(6) 憲法 P-1 は「要否・採否の最終判断を代行する機能」を持たないことを、A-1 は外部の鍵と課金を使う操作に持ち主の確認を求める。(7) 憲法 P-5.3 は文書の種類による違いを汎用の検査と密度 profile のデータで表すことを求め、rules 行 D-1〜D-6 は並列に起動する AI の内側を opus まで・モデルと念入りさの明示・返り値は file・MCP の非共有と定める。
decision: 天井の形を次のとおり定める。(1) 観点 = 文書の型に依らない 4 つに閉じる。① 忠実さ（人が書く自由文が元の文の意味を保つか。母集団は床が既に天井へ投げている 4 つに閉じる = rules 行 R-9 の注の「日本語の専門語の判定」・rules 行 R-10 の注の「平易文の落とし・足し」・判断の記録の欄の決まりの limits_note が弁別できないとする改番・図の refs の行き先の意味）② 読みやすさ（非エンジニアが入口から歩いて「何が決まりで・何が要件で・なぜそうしたか」を頑張れば読めるか）③ 設計文書どうしの整合（憲法・要件書・判断の記録・設計ノートの間の矛盾・重複・範囲の越境・参照の意味の食い違い）④ 実態との整合（設計文書が言うことと、版管理の中の code・契約表・台帳の着地の記録との意味の食い違い。床が数える一致 = 参照 id の解決 R-4・着地の印 FR13・欄の一致 は除き、機械で決定的に検査できない食い違いだけを見る・P-3.1）。文書の型による違い（どの欄を読むか・読み手の想定・見る面）は設定のデータ（新しい正本 = 天井の正本・観点ごとの問いの文と読む欄の表・P-5.3 の「密度 profile のデータ」をこの意味で読み、rules 行 R-5 の密度 profile の一覧には触れない）で表し、観点も係も型ごとに増やさない（N-5・P-5.3）。(2) 起動の形 = folio は AI を起動しない。folio の命令 1 つ（名は便で決める・天井の材料を組む口）が観点ごとに「材料の束」を 1 つの置き場へ組む。束の中身は、正本の写し（基準）・生成した面の写し・その観点の問いの文（天井の正本から）・所見の欄の決まり・読む欄の一覧である。束を読んで AI を回すのは席（planner 席）か器（scribe2）で、モデルと念入りさは起動する側が明示し、内側は opus まで（D-1・D-2・要件書 CON5・CON6）。folio は AI の係の説明文を持たないので、R-1 の母集団に足す字は 0 である。(3) 所見の形 = 観点ごとに型付きの file（所見 1 件 = id・観点・場所〔文書の id と欄か節〕・重さ〔止める／直す／参考〕・根拠〔正本の逐語の引用〕・反証の結果〔支持／退けた／まだ分からない〕）と、観点の 3 値（合格・不合格・まだ分からない）を、材料の束と同じ置き場へ file として書く（D-5）。合格の観点にも必須の欄を課す = 読んだ文書の id の一覧（読む欄の一覧は材料の束の側が持つ）・読んだ材料の束の要約値（sha256）・起動の記録（モデル・念入りさ・時刻）で、1 つでも欠けるか要約値が束と合わなければ床がその観点を「まだ分からない」に落とす（AI を回さずに書いた所見 file を合格として通さない・P-4.1）。「止める」の重さの所見だけは、別の文脈の AI が中立に反証する 2 段目を通す（反証の材料も folio が組む）。反証の結果が「まだ分からない」なら所見は残す（裏付けが取れたときだけ退ける）。(4) folio が数える側（床）= 所見 file の欄の決まりと 3 値・観点の一覧が天井の正本と一致すること・所見の根拠が正本に実在すること（逐語の照合）・「まだ分からない」の観点が 1 つでもあれば天井は合格にしないこと（P-4）。天井の命令の検査（--check）は 4 観点が全部合格のときだけ 0 で終わり、不合格 1・まだ分からない 2 を返す（FR5 の 3 値）。完成の判定 = 床の全通過と天井の 4 観点すべての合格を同時に満たしたときだけで、生成した面には天井の名札（観点ごとの 3 値と日付）を床の合格の名札と別の欄に出す（P-3.3）。天井が合格でない間は、folio2 自身の設計文書の便の着地を既定で止め、再開は所見の解消か持ち主の裁定だけとする（器の便の門にこの検査を置くかは決定 (6) の器の側の結線）。所見の意味の当否は folio が判定しない（P-1）。(5) 止める仕組み = 同じ場所の同じ重さの所見が rules 行 R-7 の回数を超えて残れば、自動の直しを続けず持ち主へ渡す（P-11）。1 周の費用と時間は rules 表に置かない（rules の欄の決まりが時間と費用を除外し、要件書 not_frozen も同じ理由で凍結しない）。実測は台帳に記帳し、撤退条件の数えに使う。(6) 順序 = 本判断の発効 → 要件書の次の版（天井の要件 2 つと受入基準 2 つ）→ 便 = 所見の欄の決まりと天井の正本を床に入れる → 材料の束を組む命令（凍結 anchor = 欠陥を 1 つ仕込んだ最小の正本と、そこから決定的に組める束の写し・P-10.1）→ 面の名札 → folio2 自身の設計文書で 4 観点を 1 周（席が回す・実地の値を台帳に記帳）→ 器（scribe2）への結線は前の版の置き換えの段 2 の後に器の側で決める（契約表と器の境界は判断の記録 ADR-3 のまま）。
options:
  - id: a
    name: 汎用の 4 観点を folio が組む材料の束で回し、AI の起動は席か器に任せる
    text: 観点を型に依らない 4 つに閉じ、folio は材料の束（正本の写し・面の写し・問いの文・所見の欄の決まり）と所見の床だけを持つ。AI の起動・モデル・念入りさは席か器が持つ。
    verdict: adopted
    reason: N-5（型ごとの係を増やさない）と R-1（説明文 2,000 字）を満たしたまま P-3.2 の天井を建てられる。前の版の教訓（正本を基準に・反証の 2 段目・止める既定）を機械の形で引き継げる。AI を起動しないので鍵と課金（A-1）を folio が持たず、P-1（最終判断の代行をしない）と両立する。
  - id: b
    name: 前の版（folio v1）の文書の型ごとの係（36 本）を移植する
    text: 忠実さと読みやすさの係を文書の型ごとに 2 本ずつ持ち、反証の係と束ねる skill を足す。
    verdict: rejected
    reason: N-5.1 が拒む形そのもので、R-1 の上限を大きく超える（前の版の実測が N-5 と R-1 の由来）。型が増えるたびに係が増え、説明文が膨らんで遅く高くなる。
  - id: c
    name: folio 自身が AI を起動して天井を回す（外部の AI の口を folio が呼ぶ）
    text: folio の命令が AI の口（外部の道具か API）を子の処理で呼び、所見を受け取って合否まで出す。
    verdict: rejected
    reason: 鍵と課金を folio が持つ操作になる（A-1 の確認の義務は消えず、folio が鍵を持たない形なら席の側に留まる）。外部の依存が増える（A-3）。席と器は既に AI を起動する口（Agent の同時起動・器の lens）を持つので、folio が同じ口をもう 1 つ持つことになる。
  - id: d
    name: 天井を持たず、床だけで完成を判定する
    text: 意味の検査は人の読みに任せ、folio は床の 3 値だけを出す。
    verdict: rejected
    reason: P-3.2 と P-3.3 に反し、持ち主の 2026-09-19 の直命（レビューは不可欠）に反する。床の合格を完成と読み違える事故を防げない。
  - id: e
    name: 観点を 1 つの汎用レビューにまとめる
    text: 観点を分けず、1 本の問いで設計文書全体を 1 度に読ませる。
    verdict: rejected
    reason: 所見の場所と重さが粗くなり、観点ごとに読む欄と読み手を設定のデータで変えられず、P-5.3 の形にならない。反証の 2 段目は組めるが、1 本の問いに 4 つの読み方が混ざるので退ける根拠が薄くなる。
basis: [P-1, P-3, P-4, P-5, P-6, P-7, P-10, P-11, P-13, N-5, A-1, A-3, R-1, R-4, R-5, R-7, R-9, R-10, D-1, D-2, D-5, FR5, FR13, NFR1, CON5, CON6, ADR-3, ADR-5, D-6, R-8]
produced: [FR17, FR18, FR20, AC15, AC16, AC18, D-12]
retreat:
  kind: measure
  condition: 数えるのは orchestrator 席（2026-09-19 までの名は planner 席・天井を回す席）で、台帳に記帳する。発効後、folio2 自身の設計文書で 4 観点を回した最初の 2 周で数える。① 「止める」の所見のうち反証で退けられたものが半数を超えたら、決定 (1) の 4 観点を捨て、観点の数と問いの文を組み直す判断の記録を起こす。② 2 周とも所見が 1 件も出ず「合格」しか返さない観点が同じなら、その観点を捨てる（4 観点を 3 つ以下にする判断の記録を起こす）。③ 所見 file の欄の決まりを守れない AI の返事が rules 行 R-7 の回数を超えて続いたら、決定 (2)（folio は起動しない・材料の束）を捨てて案 c（folio が起動する）へ移るかを持ち主に問う。
amends: []
grill: {when: 2026-09-19, who: 独立の審査役（opus・読み取り専用の agent・planner 席が材料を渡した）, where: docs/design/adr-8-grill.md（台帳 f2-648.52 notes 2026-09-19 に要旨）, summary: 発効を止める重さ 3 件（天井の 3 値を誰も消費しない・回ったことと見つける力を測れない・撤退条件が捨てる条件でなく費用の行は rules の欄の決まりと衝突）と直すとよい 6 件を全部反映した。N-5.1 に当たらないこと・前の版の教訓 ③④ が写っていること・形式の穴が無いこと・案 b / d の却下が事実に基づくことは支持。まだ分からない 2 件（器の側の審査が所見だけ書く運用を止められるか・費用の実地の値）は決定 (6) と帰結の実地の 1 周へ送った}
approval: {who: 持ち主, date: 2026-09-19, ruling: f2-648.52 notes 2026-09-19 13:3x JST（発効の承認・要件書 v1.6 を同じ承認で運ぶと明記した承認要求への回答）・f2-648 notes 2026-09-19（論点 C の裁定の逐語「論点はすべて推奨で良い」と「レビューエージェントなどは不可欠なはずだ」）, verbatim: 承認する, surface: R-8}
plain: 「機械が数えられないこと」＝意味のレビューを AI にやらせる仕組みの決め方です。前の版は文書の種類ごとに専門の AI 係を作って 36 本になり、AI が毎回読む説明文が膨らみました。今回は係を作らず、「観点」を 4 つだけ決めます（① 人が書いた自由文（やさしい説明・専門語の言い換え・図の根拠の行き先）と、機械が見分けられない番号の付け替えが、元の文と同じ意味か ② 非エンジニアが読めるか ③ 文書どうしが矛盾していないか ④ 文書と実際のコードや記録が食い違っていないか）。folio がやるのは、観点ごとに「読む材料の束」（元の文書・生成したページ・問いの文・返事の書き方・その観点で読む欄の一覧）を用意することと、返ってきた所見が決まった形か・根拠が本当に文書にあるかを機械で数えることまでです。AI を動かすのは、いつも AI を動かしている席や器の側です。「止めるべき」という所見は、別の AI が中立に反証してから残します。反証が「まだ分からない」と返ってきたら所見は残し、裏付けが取れたときだけ退けます。同じ場所に同じ重さの所見が決めた回数を超えて残ったら、自動の直しを続けず、そこで止めてあなたに渡します。返事が「まだ分からない」なら合格にせず、機械の合格（床）と AI の合格（天井）は別の名札で見せます。天井が合格でない間は、folio2 自身の設計文書を変える便の着地を止めます。再開できるのは、所見を解消したときか、あなたが決めたときだけです。
consequences:
  - 要件書の次の版（v1.6）= 天井の要件 2 つ（FR17 材料の束を組む・FR18 所見の形と 3 値を床で数える）と受入基準 2 つ（AC15 観点 4 つの材料の束が凍結 fixture〔欠陥を 1 つ仕込んだ最小の正本〕から決定的に組め、束の要約値が期待と一致する・AC16 所見 file の必須欄が 1 つ欠けるか束の要約値が合わないと「まだ分からない」になり、「まだ分からない」の観点があると合格にならない）を新しい番号で足し（P-7.1）、本判断の発効と同じ承認で発効する（P-13.3）。
  - 新しい正本（天井の正本・観点 4 つ・観点ごとの問いの文と読む欄・所見の欄の決まり・重さの値域）を設計文書の置き場に置き、床が見る正本を 1 file 広げる（判断の記録 ADR-6 の intake.yaml と同じ運び方・凍結 fixture の期待は変えない）。
  - 語彙に語を足す（観点・所見・反証・材料の束・天井の名札）。rules 行は足さない（費用と時間は rules の欄の決まりが除外する）。
  - 部品目録に天井の名札の部品を足す便は、生成器の閉じた一覧と目録の一致の検査を通す（判断の記録 ADR-5 帰結）。面の型は増えない。
  - folio2 自身の設計文書で 4 観点を 1 周回した結果（所見の数・反証で退けた数・費用と時間の実測・凍結 anchor の欠陥が所見に出たか）を台帳に記帳し、撤退条件の数えの起点にする。欠陥が所見に出なければ、その観点の問いの文を直す（AI が回ったことは所見 file の起動の記録と束の要約値で床が見るが、見つける力は人が台帳で見る）。
  - 器（scribe2）への結線（便の審査に天井の所見を使うか・誰が回すか）は本判断の外で、前の版の置き換えの段 2 の後に器の側の設計として決める。
  - 本判断は条文を改訂しないので A-2.3 の対象外。発効の承認は持ち主から planner 席の対話面（R-8）で取り、承認欄と台帳 f2-648.52 に逐語で記帳する。発効の前に、反対側からの検証（grill）を独立の文脈で行い、その記録（docs/design/adr-8-grill.md）を grill 欄に写す。
