note: |
  【出所】天井の 37 周目（一括 23 の枝 d0372fa の上・2026-09-26）の整合 F-1（止める・反証 支持）。席の裁定（2026-09-26）は、反証の支持を受けて判断の記録を起こし、ADR-18 決定 (5) を改訂の欄で狭めること、
  一括 23（要件書 第 1.45 版）と本判断を同じ承認要求（🔴 問 1 = 第 1.45 版・問 2 = 本判断の発効）に束ねること（先例 = 一括 19 と ADR-22・天井の 33 周目）である。
  【起草の経緯】一括 23 の起草（2026-09-26）は、起草役の問い 1 で「ADR-18 決定 (5) を改訂の欄で狭める判断の記録を起こすか」を問い、推奨を「起こさない（注で断る）」としていた。席は一度その推奨どおりに裁定し、改訂 b（d0372fa）で ADR-18 の注に「字の上では狭める」の段を足した。
  37 周目の整合がこの形を 止める で拾って反証が支持したので、裁定を改めて本判断を起草した。注の段の「字の上では狭めるが、意味は条 P-4.1・P-4.2 の補い」という読みは、反証が「正本の字が支えない」として退けた。
  【実装と例の在り処（本文から移した）】門の実装は crates/folio/src/gate.rs の run・dir_parts（--dir を今の dir からの要素に直す）・other_root（write-set の path の根の突き合わせ）・is_design_source。理由の字は定数 UNKNOWN_DIR_OUTSIDE・UNKNOWN_OTHER_ROOT・FROM_THE_TOP。
  歯は crates/folio/tests/gate.rs の f142_the_gate_is_unknown_from_above_the_worktree と f142_the_gate_is_unknown_when_the_dir_is_outside_the_cwd（今の dir の外の --dir・絶対 path・3 つ目の形）と、crates/folio/src/gate.rs の単体の歯 f142_the_dir_and_the_write_set_share_one_root（.. の要素）。
  決定 (1) の 3 つ目の形の例: --dir が .worktrees/x/design-intent のとき、design-intent/srs.yaml と x/design-intent/srs.yaml は当たり、.worktrees/x/design-intent/srs.yaml と x/README.md は当たらない。境目の 2 つ＝--dir が .worktrees/x/design-intent で一覧が design-intent（並びと同じ長さ）なら当たらず通す、--dir が a/a で一覧が a/a（置き場と同じ長さ）なら当たって まだ分からない（契約 docs/design/delivery-142.md §1 (b) の 3・独立の検証の実測 adr24-verify.md・一括 23 の改訂 d で撃ち直した batch23-scripts/shapes-d.txt）。
  本文の「置き場の path」は --dir、「書き換える file の一覧」は write-set、「門を撃つ場所」は今の dir のこと（判断の記録の本文は語彙に無い英字の語を持たない）。
  【検証】独立の検証 = ~/.local/share/folio2/handoff-2026-09-26/adr24-verify.md（2026-09-26・別の文脈の AI・読み取りと写しの上の実測）。総合は不支持だが、blocking 1 件は一括 23 の仕分けの古い字（B-1）で本判断の字には無く、本判断の中身（改訂の欄の向きと行き先・照らせない形・案の比べ）は支持。
  非 blocking のうち本判断に掛かる 4 件（決定 (1) の 3 つ目の形の定義の文が境目 2 つで実装と違う・帰結の行 D-12 の手順・文脈 (1) の改訂 b・この段）は一括 23 の改訂 d で当てた。条文を改訂しない判断なので grill の欄は必須でなく、置かなかった（検証の在り処はこの段）。
  【発効】2026-09-26 09:20 JST、持ち主が対話面 R-8 で「承認する」と答えた（一括 23 の問 1〔要件書 第 1.45 版・項 1〜7〕と本判断の問 2 の承認要求への同じ回の回答・推奨どおり・退けた項は無い）。
  逐語と日付は承認欄に置き、台帳 f2-648 の notes にも同じ逐語で記帳する（条 P-12.2）。同じ承認で要件書 第 1.45 版が発効し、要件 FR20 の判断の記録の欄に本判断を足した。
  本判断の発効は判断の記録の状態の欄として周の引き金を動かすので、取り込みの後に本流で周を 1 本回す（帰結の 3 つ目）。
