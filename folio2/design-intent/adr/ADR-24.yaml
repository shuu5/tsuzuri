id: ADR-24
title: 天井の門の「設計文書の file が無ければ通す」を、書き換える file の一覧と設計文書の置き場を同じ起点で照らせるときに限る — 判断の記録 ADR-18 の決定 (5) を狭める

status: accepted
date: 2026-09-26

plain: |
  天井の門は、設計文書を書き換える便を器に出してよいかを「通す・止める・まだ分からない」で答える仕組みです。
  その答え方の式は、判断の記録 ADR-18 の 5 番目の決定が決めています。式の最初の分かれ道は「便が書き換える file の一覧に、設計文書の置き場の file が 1 つも無ければ通す」です。

  9 月 25 日に、門の穴を 1 つ直しました（便 142）。門を作業ツリー（枝ごとに取り出した作業用の置き場）の一番上以外の場所で門を実行すると、一覧の file と設計文書の置き場を照らし合わせられず、設計文書を書き換える便でも黙って「通す」を返していました。
  直した後の門は、一覧と置き場を同じ起点で照らし合わせられないとき、file が在るか無いかを決めずに「まだ分からない」と答え、実行し直す場所を添えます。

  ところが、この動きは 5 番目の決定の字にはありません。字だけを読むと、照らし合わせられないときでも「実装の file だけの一覧なら通す」と読めます。
  要件書の第 1.45 版（一括 23）はこの動きを要件の規範の文に書きましたが、発効した判断の記録の決定と要件書が同じ場合に逆の答えを持つ形になりました。
  天井の 37 周目がこれを「止める」と指摘し、反証でも支持されました。判断の記録の書き方の決まりでは、発効した決定の範囲を後から変えるときは、変える側の記録の「改訂の欄」に書きます。注に断りを書くだけでは直したことになりません。

  この判断では、5 番目の決定の「無ければ通す」を、一覧と置き場を同じ起点で照らし合わせられるときに限ります。
  照らし合わせられないときは、実装の file だけの一覧でも「まだ分からない」です。判定できない所で通さない、という憲法の条（P-4.1・P-4.2）に沿う形です。
  照らし合わせられるときの答え方（無ければ通す・在れば印を見て 3 通り）は変えません。

  機械はすでにこの形で動いているので、機械を直す便はありません。ADR-18 の決定の文そのものは書き換えず、この判断の改訂の欄で狭めます。ADR-18 の注には、この判断を指す 1 段を置くだけです（今までの判断の記録と同じやり方です）。

  やめる条件も決めます。照らし合わせられないことで「まだ分からない」になった正しい便が続いたとき（実行し直す手間が効き目より重いとき）と、同じ食い違いが周でまた止められたときに、あなたに問い直します。

context: |
  (1) 出所。天井の 37 周目（一括 23 の枝 d0372fa の上・2026-09-26）の文書どうしの整合の所見 1（F-1・重さ 止める・反証 支持）。
  所見の要旨は、要件 FR20 の第 1.45 版の規範文が、書き換える file の一覧と設計文書の置き場の path を同じ根で照らせないとき、実装の file だけの一覧でも 2（まだ分からない）を返すと定めるのに、
  発効した判断の記録 ADR-18 の決定 (5)「便の書き換える file の一覧に設計文書の置き場の file が無ければ 通す（0・今と同じ）」は生きたままで、これを狭める改訂の欄を持つ判断の記録が無い、である。
  一括 23 の改訂 b（d0372fa）は ADR-18 の注の 1 段で「字の上では狭める」と断るだけで済ませており、これは判断の記録 ADR-22 が退けた案 c（注だけで断る）と同じ形である。
  反証は支持で、退けた読みは「条 P-4.1・P-4.2 が判断の記録より上位なので、決定 (5) の『無ければ』は判定できるときだけを指す」である（正本の字がその読みを支えず、ADR-18 の注が自ら「字の上では狭める」と断っていた）。
  (2) 実装。便 142（台帳 f2-648.214・2026-09-25 着地・契約 docs/design/delivery-142.md）は、門の実装の最初に根の突き合わせを置いた。
  門は、門に渡された設計文書の置き場の path を門を撃つ場所からの要素の列に直し、その場所の下に無ければ まだ分からない（置き場がその場所の下に無い）を返す。
  次に、書き換える file の一覧の各 path が同じ根からの相対で読めるかを見て、絶対 path・.. の要素を持つ path・置き場の path の 2 番目か後ろの要素から末尾までの並びの下に在り、置き場の path の下には無い path に まだ分からない（置き場と一覧の根が違う）を返す。
  どちらも設計文書の置き場の file の有無の判定より前に在る。確かめる歯は便 142 が足した 3 本で、関数の名と file の在り処は注に置く。
  便 142 の契約 §1 (a) の 5 は、この まだ分からない を「判定が実行できないとき」の族（印が読めない・引き金の要約値が測れない）に置き、要件書の改訂は要らないとした。
  (3) 要件書。一括 22（要件書 第 1.44 版）は同じ前提を要件 FR20 の注にだけ書いた。天井の 36 周目の整合と実態の所見（どちらも F-1）が、注にだけ在る前提が規範文と逆の答えを読ませると拾い、
  一括 23（要件書 第 1.45 版・2026-09-26 に本判断と同じ回で発効）がこの前提を要件 FR20 の規範文と確かめ方と受入基準 AC18 の 8 つ目の場合へ上げた。その結果、要件書と判断の記録 ADR-18 の決定 (5) が同じ入力に別の答えを持つ形になった（37 周目の所見）。
  (4) 口の決まり。判断の記録の欄の決まり（design-intent/adr/schema.yaml の revises_note）は、発効した判断が生きたまま、その決定の範囲が別の判断で変わるときの口を改訂の欄（revises）に置く。
  判断の記録 ADR-21 決定 (6) は範囲の改訂を改訂の欄に限り、ADR-22 は注だけで断る案 c を「注を範囲の改訂の口にしない」として退けた。ADR-20 は ADR-18 の決定 (1)(2) の範囲を改訂の欄で広げ・狭めた先例である。

decision: |
  (0) 本判断は条文を改訂しない。規則の表の行を足さない。便を起こさない（実装と歯は便 142 で既に本判断の形である）。決めるのは、判断の記録 ADR-18 の決定 (5) の範囲を狭めることだけである。
  ADR-18 の決定 (1)〜(4)(6) と、決定 (5) の照らせるときの式は変えない。

  (1) **門の「無ければ 通す」を、同じ根で照らせるときに限る（ADR-18 決定 (5) を狭める）。**
  門は、便の書き換える file の一覧の各 path と、門に渡す設計文書の置き場の path を、門を撃つ場所を同じ根として照らす。
  置き場の path が門を撃つ場所の下に無いか、一覧に同じ根からの相対で読めない path（絶対 path・.. の要素を持つ path・置き場の path の 2 番目か後ろの要素から末尾までの並びの下に在り、置き場の path の下には無い path）が在れば、照らせないので、
  設計文書の置き場の file の有無を判定せず まだ分からない（2）とし、撃ち直し方（作業ツリーの一番上から撃つ）を理由の行に出す。
  3 つ目の形は、置き場の path の 2 番目か後ろの要素から末尾までの並びの下に在り、置き場の path の下には無い path である（下に在る = その並びで始まり、並びより長い）。例えば置き場の path が枝の作業ツリーの下の設計文書の置き場を指すとき、設計文書の置き場の名や枝の名から書き始めた path が当たり、置き場の path の全部から書いた path は当たらない（例の字は注の【実装と例の在り処】の段）。
  照らせないときは、実装の file だけの一覧でも まだ分からない（2）である。照らせるときは決定 (5) の式のとおり（無ければ 通す・在るときの 3 値と、「まだ分からない」が「不合格」より先に立つ順序）で、変えない。

  (2) **条との関係。** 照らせないときの まだ分からない は、判定を実行できない所を通すことにも止めることにもしない、条 P-4.1・P-4.2 の当てはめである。
  門が既に持つ判定が実行できないときの族（印が読めない・天井の正本が読めない・引き金の要約値が測れない・印の節点の表が読めない など）と同じ扱いで、3 値の意味は変わらない。

  (3) **要件書との関係。** 要件 FR20 の第 1.45 版の規範文と確かめ方、受入基準 AC18 の 8 つ目の場合（書き換える file の一覧と置き場の path を同じ根で照らせない）が本判断の (1) を写す。
  要件書の第 1.45 版と本判断は同じ承認要求で問う（一括 23）。どちらか一方だけを発効させると、要件書と判断の記録の食い違いが残る。

  (4) **発効した決定の本文は書き換えない。** ADR-18 の見出し・文脈・決定・案・帰結・撤退条件・承認欄の字は変えない。範囲の改訂は本判断の改訂の欄が持ち（欄の決まりのとおり改訂する側の片側だけ）、
  ADR-18 の注に 1 段で本判断を指す。注は範囲の改訂の口にしない。

options:
  - id: a
    name: 改訂の欄で ADR-18 決定 (5) を狭め、決定の本文は書き換えず注で本判断を指す（採る）
    text: |
      決定 (0)〜(4) の形。小さい判断の記録 1 本の改訂の欄に 1 行（ADR-18 決定 (5)・narrow）を置き、ADR-18 の注の 1 段を本判断を指す字にする。要件書の第 1.45 版と同じ承認で発効させる。
    verdict: adopted
    reason: |
      判断の記録の欄の決まりの改訂の欄は、発効した判断が生きたまま、その決定の範囲が別の判断で変わるときの口である。ADR-18 は決定 (1)〜(6) が生きており、決定 (5) も照らせるときの式は生きている。
      ADR-20 が ADR-18 の決定 (1)(2) を、ADR-22 が ADR-3 決定 (8) と ADR-16 決定 (1) を改訂の欄で解いた先例と揃う。37 周目の反証が支持した読み（注では狭められない）にも正面から答える。
      中身は便 142 が既に実装し歯が確かめている振る舞いで、新しい向きを足さない。費用は判断の記録 1 本と注 1 段である。
  - id: b
    name: 注だけで断る（改訂の欄を使わない）
    text: |
      判断の記録を起こさず、ADR-18 の注に「決定 (5) の『無ければ』は照らせるときだけを指す」と書く（一括 23 の起草の形・ADR-22 案 c と同じ）。
    verdict: rejected
    reason: |
      判断の記録の欄の決まりは、範囲を変える口を改訂の欄に置き、注を範囲の改訂の口にしない。ADR-21 決定 (6) も範囲の改訂は改訂の欄が持つと限り、ADR-22 は同じ形の案 c を退けた。
      37 周目の反証は、この形を「2 文書の決定が食い違うことは変わらない」として支持の側に数えた。同じ注の字で次の周を回しても、同じ所で止まる見込みが高い。
      「字の上では狭めていない（決定 (5) は照らせるときしか判定できない）」と注の字を改める道も、正本の字がその読みを支えないという反証の理由で退けられる。
  - id: c
    name: 要件 FR20 の規範文から前提を外し、実装を便 142 の前の形へ戻す
    text: |
      要件書の第 1.45 版の規範文の 2 文と確かめ方と AC18 の 8 つ目の場合を外し、門は照らせないときも file の有無を判定する形（決定 (5) の字どおり）へ実装を戻す。
    verdict: rejected
    reason: |
      便 142 の前の門は、照らせない所で設計文書を書き換える便にも 0（通す）を黙って返していた（台帳 f2-648.214・判定できない所で通すので条 P-4.1 に反する）。戻すとその穴が開き直る。
      照らせないときに file の有無を判定する形は、置き場の file を置き場と照らさずに数えることで、判定の材料が無い所で答えを出すことになる（条 P-4.2）。
  - id: d
    name: ADR-18 決定 (5) の本文を、照らせるときに限る字へ書き換える
    text: |
      決定 (5) の字に「照らせるとき」の前提と照らせないときの まだ分からない を書き足し、注に書き換えの記録を置く。
    verdict: rejected
    reason: |
      発効した判断の記録の決定の字は、当時の決定の記録なので書き換えず、範囲の変更は別の判断の改訂の欄で持つ（判断の記録の欄の決まり・ADR-20 案 f と ADR-22 案 d を退けた理由と同じ）。
      書き換えると、決定 (5) を読んだ過去の周の所見と承認の逐語が、今の字と合わなくなる。

basis: [P-4, P-6, P-7, P-8, P-12, A-2, R-7, R-8, D-12, D-14, FR20, AC18, ADR-8, ADR-18, ADR-19, ADR-20, ADR-21, ADR-22]

revises:
  - {target: ADR-18, decision: (5), kind: narrow, summary: 「便の書き換える file の一覧に設計文書の置き場の file が無ければ 通す」を、一覧の各 path と置き場の path を門を撃つ場所を同じ根として照らせるときに限り、照らせないとき（置き場がその場所の下に無い・一覧に絶対 path か .. の要素を持つ path か置き場の path の 2 番目か後ろの要素から末尾までの並びの下に在り、置き場の path の下には無い pathが在る）は file の有無を判定せず まだ分からない（2）とする（実装の file だけの一覧でも 2・便 142 の実装・要件 FR20 第 1.45 版）}

consequences:
  - 要件 FR20 の規範文（第 1.45 版）と判断の記録 ADR-18 の決定 (5) の読みが揃う。ADR-18 の決定 (5) の字は残り、読み方は本判断の改訂の欄と ADR-18 の注の 1 段が持つ。
  - 門の振る舞いは変わらない（便 142 の実装のまま）。置き場の path が門を撃つ場所の下に無いか、書き換える file の一覧に絶対 path などが在ると、実装の file だけの一覧でも まだ分からない になる。席の受付は行 D-12 の門を作業ツリーの一番上から撃つ。撃つ場所は要件 FR20 の規範文の撃ち直し方と注、便 142 の契約が書き、門の理由の行も同じ撃ち直し方を返す。規則の表の開発規律行 D-12 の字は門を撃つ時機（器へ出す前）を定め、撃つ場所は定めない。本判断は行 D-12 の字を変えない。
  - 本判断の発効は、判断の記録の状態の欄として周の引き金を動かす（どの判断の記録の発効も同じ）。便は起こさない。
  - 要件書の版は一括 23 の第 1.45 版で上がる（本判断のための版上げは無い）。要件 FR20 の判断の記録の欄に本判断を足すのは、承認の後に席が書く（承認の後の欄）。
  - 天井の 37 周目の整合の所見 1（F-1）は、本判断の発効で解く。一括 23 の直しの一覧には入れない（同じ字を 2 か所で直さない）。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 の notes に記帳する。数える期間は本判断の発効の時刻から 14 日とする（(2)(3) は期間を切らない）。
    (1) 照らせないことで止まった正しい便: 席の受付か一括の段取りで門が照らせない理由（置き場が門を撃つ場所の下に無い・置き場と一覧の根が違う）で まだ分からない を返し、
    作業ツリーの一番上から同じ一覧で撃ち直すと 通す（0）になった回を数える。数える口は、席が台帳 f2-648 の notes に写した門の理由の行の字である（写していない回は数えない）。
    期間の中で 3 回になったら、門が path を字面でなく解いて照らす形（symlink と .. を解き、別の根の path を置き場へ写し直す）を持ち主に問う。撃ち直しの手間が、照らせない所で通さない効き目より重いかを問う材料にする。
    (2) 食い違いが残る: 本判断の発効の後の周で、門の「無ければ 通す」の範囲について、要件 FR20 と判断の記録 ADR-18・本判断の間の文書どうしの整合の 止める が反証で支持されたら数える。
    1 件で本判断の形が失敗したとみなし、その周の所見を添えて持ち主へ問う（ADR-18 決定 (5) の本文を書き換える案 d を含めて）。
    (3) 数えられない回（台帳が読めない・周の所見が読めない）が規則の表の行 R-7 の回数を超えたら、本判断の撤退条件の判定を「まだ分からない」に落として持ち主へ渡す（条 P-4.2）。
    「同じ」とみなすのは（撤退条件の番号・数えられなかった理由）の 2 つ組が一致する回である。

