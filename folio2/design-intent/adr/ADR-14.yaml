# folio2 判断の記録 ADR-14 — 索引の節点を id を持つ行に閉じ、索引の欄の決まりの正本は天井の一覧にだけ載せる
# 状態: accepted（起草 2026-09-22・発効 2026-09-22 20:52 JST 持ち主「全部承認する」・一括 12・orchestrator 席 fable 5.1）。出所 = 便 94 の 🔴 2 点目と便 95 の 🔴 1 点目（契約 docs/design/delivery-94.md・delivery-95.md の §1）。
# これは判断の記録 ADR-13 の決定 (1) を 2 か所で狭める改訂で、ADR-13 は生きたまま残る（欄の決まりの revises の使い方）。

id: ADR-14
title: 設計文書の索引の節点を「id を持つ行」に閉じ、索引の欄の決まりの正本は天井の読む文書の一覧にだけ載せる

status: accepted
date: 2026-09-22

plain: |
  設計文書の地図（索引）に何を「点」として載せるかを、少し狭める判断です。
  もとの判断は「id を持つ 1 行」と「指摘の置き場になる章」の 2 つを点にすると決めていました。
  実装してみると、章のほうには文書の中に番号が無く、地図を作る道具が自分で番号を付けるしかありません。
  そうすると「番号で指す」という決まりの指す先が、地図の中にしか無い番号になってしまいます。
  そこで点は「id を持つ 1 行」だけにします。章どうしのつながりは、もともと別の正本（天井の読む欄の表・
  入口の棚・設計ノートの章の欄）が型付きで持っているので、地図から外しても引けなくなるものはありません。
  もう 1 つ、地図の決まりを書いたファイルを入口の棚に並べるかどうかも決めます。
  入口の棚には「あなたの相談の答えで決まる文書の型」を並べる約束で、道具自身の決まりは並べません。
  地図の決まりは道具自身のものなので、棚には出さず、AI の審査が読む文書の一覧にだけ載せます。

context: |
  (1) 実装の事実（便 94・2026-09-22 着地・台帳 f2-648.132）。索引の口は、設計文書の中で id を持つ行 198 を節点として出す。
  判断の記録 ADR-13 の決定 (1) が挙げるもう半分（所見の置き場になる節）は運ばなかった。
  下調べの設計ノートの一覧は、設計ノートの節・語・欄の語・天井の観点・各文書の節も節点の種類に挙げているが、
  それらの id は正本の中に無く、下調べの実験は接頭辞を自分で作って与えていた。

  (2) 条の縛り。正本に無い id を索引が作ると、id で参照するという条の指す先が索引にしか無い id になる。
  索引は毎回組み直す導出物なので、その id は版管理の中のどの正本にも存在しない。

  (3) 落ちる辺の実測。後半を入れたときに増える辺は 48 本で、内訳は 観点が読む文書 29・入口の棚の関係 4・
  入口の棚の付録 2・設計ノートの節の参照 13 である。この 4 つはいずれも、天井の正本の読む欄の表・
  入口の棚の正本・設計ノートの節の欄が型付きで既に持っており、索引の外から引ける。

  (4) 実装の事実（便 95・2026-09-22 着地・台帳 f2-648.133）。索引の欄の決まりの正本を新しく置いたが、
  入口の棚にも天井の読む文書の一覧にも載せていない。ADR-13 の決定 (1) の末尾は「この正本は入口の棚と
  天井の正本の文書の一覧に載る」と書いている。

  (5) 入口の棚の側の逐語（持ち主が承認した第 0.3 版）。「この棚には、相談窓口が決める文書の型（道具自身の正本 =
  相談窓口の正本と天井の正本は載せない）と、型どうしのつながりが出る。」索引の欄の決まりは相談窓口の回答で
  要否が決まる文書ではなく、道具自身の正本である。

  (6) 相談窓口の判断の記録 ADR-6 の側の縛り。決定 (2) は写像の行き先を棚の文書の id と注入に閉じ、
  その撤退条件の 1 つ目は、棚の文書の型が 4 つから増える便を設計するときに持ち主へ問うと定める。
  索引の欄の決まりを棚へ載せることは、その撤退条件が問えと言う場面に当たる。
  判断の記録 ADR-13 は決定 (1) の末尾で棚へ載せると書いたが、この根拠にも撤退条件にも触れていない
  （天井の 24 周目の 文書どうしの整合 F-5）。

decision: |
  (1) **索引の節点は「設計文書の中で id を持つ行」に閉じる。** 所見の置き場になる節（設計ノートの節・語・
  欄の語・天井の観点・各文書の節・文書そのもの）は節点にしない。正本に無い id を索引が作る形は採らない。
  節どうしのつながりは、それを型付きで持っている正本の側（天井の正本の読む欄の表・入口の棚・設計ノートの節の欄）
  から引く。所見の場所（文書の id と欄か節）の書き方は変えない＝所見の場所は索引の節点の id とは別の道である。

  (2) **索引の欄の決まりの正本は、天井の読む文書の一覧にだけ載せる。** 入口の棚には載せない。
  棚の文書の型は 4 つのまま増えないので、相談窓口の判断の記録 ADR-6 の撤退条件の 1 つ目は発動しない。
  天井の読む文書の一覧に足すには、天井の正本の版上げ（持ち主の承認欄）と、実装の型付きの定数と
  生成区間と凍結 anchor が同時に動くので、便 1 本で運ぶ。どの観点がこの文書を読むかは、その版上げで決める。

options:
  - id: a
    name: 節点を id を持つ行に閉じ、索引の欄の決まりは天井の一覧にだけ載せる（採る）
    text: |
      索引の節点を正本に id が在る行だけに限る。節を節点にする口は作らない。
      索引の欄の決まりの正本は天井の読む文書の一覧に足し、入口の棚には足さない。
    verdict: adopted
    reason: |
      正本に無い id を導出物が作らないので、id で参照するという条の指す先が版管理の中に残る。
      落ちる 48 本の辺は、いずれも別の正本が型付きで持っているので引けなくなるものが無い。
      入口の棚は持ち主が承認した説明文が道具自身の正本を載せないと定めており、その字と衝突しない。
  - id: b
    name: 所見の置き場になる節も節点にする便を起こす（もとの判断の字のまま運ぶ）
    text: |
      設計ノートの節・語・欄の語・天井の観点・各文書の節に、索引が接頭辞つきの id を与えて節点にする。
      辺は 48 本増え、注意の先の一覧は節の単位でも届くようになる。
    verdict: rejected
    reason: |
      索引が作った id は版管理の中のどの正本にも無く、id で参照するという条の指す先が索引にしか無い id になる。
      増える 48 本の辺の出所は 4 つとも別の正本が型付きで持っているので、索引に入れなくても引ける。
      効き目（注意の先の一覧に節が入ること）は測っていない見積であり、測るなら注意の先の口が入った後で、
      そのときは節点を増やさずに「参考」の列でも同じことができる。
  - id: c
    name: 索引の欄の決まりの正本を入口の棚にも載せる
    text: |
      入口の棚の説明文を書き換えて、道具自身の正本も棚に並ぶ形にする。
    verdict: rejected
    reason: |
      棚の説明文は持ち主が承認した第 0.3 版の逐語で、相談窓口が決める文書の型だけを並べると定めている。
      索引の欄の決まりを載せるには、その承認済みの 1 文を書き換えることになる。
      棚は非エンジニアが最初に開く面であり、道具自身の決まりを並べると読み手の想定から外れる。

basis: [P-5, P-6, P-2, P-13, P-4, P-12, R-7, R-8, ADR-13, ADR-6]

revises:
  - {target: ADR-13, decision: (1), kind: narrow, summary: 節点の範囲を「id を持つ行」に閉じて「所見の置き場になる節」を外し、この正本が載る先を入口の棚と天井の一覧の 2 つから天井の一覧だけに狭める}

consequences:
  - 索引の節点の種類の閉じた一覧は、いまの 11 種類のまま動かない（節を表す種類を足さない）。
  - 天井の読む文書の一覧が 9 から 10 になる便が 1 本要る（実装の型付きの定数と生成区間と凍結 anchor が同時に動く）。
  - 入口の棚の正本は 1 字も動かない。棚に並ぶ文書の型は 4 つのままで、相談窓口の写像の行き先も変わらない。
  - 注意の先の一覧は節点の単位で組む。節の単位で注意を向けたいときは、その節を持つ行の節点から辿る。
  - 所見の場所の書き方（文書の id と欄か節）は変えない。索引の節点の id と所見の場所は別の道のままである。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 へ記帳する。
    (1) 節が節点でないことで取りこぼす: 注意の先の口が入った後の最初の 3 周で、重さが「止める」の所見のうち、
    置き場が節であって、その節を持つ行の節点が一覧に 1 つも挙がっていなかったものを数える。3 件で本判断の
    決定 (1) を捨て、節を節点にする形（案 b）を測り直す判断の記録を起こす。
    (2) 天井の一覧に載せる便が運べない: 実装の定数と生成区間と凍結 anchor が同時に動く便が 2 度続けて
    受付で落ちたら、決定 (2) の運び方（便 1 本）を捨て、段を分ける設計ノートを起こす。
    (3) 数えられない回が数値の表の行 R-7 の回数を超えたら、本判断の撤退条件の判定を「まだ分からない」に落として
    持ち主へ渡す。

approval: {who: 持ち主, date: 2026-09-22, ruling: f2-648 notes 2026-09-22 20:52 JST（発効の承認・一括 12 の承認要求〔問い 5 つ〕への回答・問 3 = 本判断の発効と判断の記録 ADR-13 の平易文と注の訂正）, verbatim: 全部承認する, surface: R-8}
note: |
  本判断は判断の記録 ADR-13 を生かしたまま、その決定 (1) の範囲を 2 か所で狭める。
  丸ごと置き換える形（後継の判断）ではないので、置き換えの欄は使わない。
  改訂の来歴は改訂する側だけが持つので、ADR-13 の側に逆向きの欄は置かない。

  【出所】便 94 の契約 docs/design/delivery-94.md §1 (f) の 🔴 2 点目（節点の範囲）と、
  便 95 の契約 docs/design/delivery-95.md §1 (e) の 🔴 1 点目（2 file の版上げ）。
  どちらも、着地した便が判断の字と違う形で運んだことを便の側が宣言したものである。
  仕分けは docs/design/batch12-triage.md（一括 12）。

  【発効】2026-09-22 20:52 JST、持ち主が対話面 R-8 で「全部承認する」と答えた。この承認は一括 12 の
