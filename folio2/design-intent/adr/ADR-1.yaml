# folio2 判断の記録 ADR-1 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。人が読む面は folio face --face adr（生成物・手で直さない）。
id: ADR-1
title: 判断の記録の正本は「1 判断 = 型付きの YAML 1 file」とし、design-intent/adr/ にゼロ詰めしない番号（ADR-n）で置く
status: accepted
date: 2026-09-12
context: 憲法の初版（v1.0）は 3 つの機構（P-8.1 撤退条件の必須・A-2 条文改訂の差分検査・N-4 裁定なしの改憲の拒否）を「判断の記録の正本 schema が置かれたときに実在する（live が adr）」として発効した。schema が無い間はこの 3 つが「まだ分からない」のままで、発効後に条文を直す手続きを機械で確かめられない。語彙は判断の記録を「戻せない判断を、理由・退けた案・撤退条件つきで残す 1 枚」と定めている。要件書 M0 は「判断の記録（ADR）と設計ノートの生成」を作らない側に置く（§2）が、正本の欄の決まりは生成でなく型付きデータであり、文書は着手の関門（gate）の外で進められる（CON1）。敵対レビュー 3 周（2026-09-12・台帳 f2-648.2 notes）は、欄の決まりの中の値（承認者・対話面・裁定 id の形・案の最小数）が書き換えられる欄のままだと、旗を消しても「今回だけ」の口が残ることを実測で示した。
decision: 判断の記録は 1 判断につき YAML 1 file とし、欄と値域を型付きの欄の決まり（adr/schema.yaml）で閉じる。判断の記録は folio が生成する文書ではないので P-6.1 の対象ではないが、正本の持ち方は P-6.1 と同じ形（文書 1 つ = file 1 つ）に揃え、判断 1 本を文書 1 つと数える。番号は folio2 の他の id（P-1・R-7・FR1）と同じくゼロ詰めしない ADR-n とし、前の版（folio v1）や scribe2 の 4 桁の番号（ADR-0047 の形）と形で区別する。file 名は id と同じにする。撤退条件・退けた案（採用は 1 つ）・根拠の id・承認の欄（逐語・日付・裁定 id・対話面）を必須か条件付き必須の欄として持ち、条文を改訂する判断は「どの版の・どの欄を・どの文からどの文へ」（version・field・previous_text・new_text）を欄単位で全件書く。欄の決まりの閾値・値域・置き場（承認者・対話面・裁定 id の形・案の最小数・写しの取り方・列の根・印）は床（folio check）の定数とし、欄の決まりの file はその写しで、型も値も 1 字でも食い違えば床が落とす＝data 側で動かせない（N-3.1・旗も、値を緩める欄も持たない）。判断の記録の本文（見出し・問題・決定・案・撤退条件・平易文・帰結）の英字語は「日本語（原語）」の形で書き、根拠（basis）の各項は id の形、本文の参照 id は実在するものに限る。これらは欄の決まりの規則として床が無条件に課し、rules 行 R-4 / R-9 の行と母集団は変えない。憲法の各条にある改訂来歴の欄（amended_by）の欄集合もこの欄の決まりが持つ（憲法の schema 節は A-2 の差分の範囲なので触らない）。
options:
  - {id: a, name: 型付きの YAML 1 file を 1 判断ごとに置く, text: 判断ごとの file（adr/ADR-n.yaml）に 1 判断ずつ置き、欄と値域は欄の決まり（adr/schema.yaml）で閉じる。, verdict: adopted, reason: 機械が欄の欠落（撤退条件・承認・退けた案）を数えられる（P-5.1）。判断 1 本の追加や改訂が file 1 つの差分になり、取り込みの審査（PR）で判断の単位が見える。番号が空いている（廃止）ことも file の存在で追える（P-7.2）。}
  - {id: e, name: 全部の判断を 1 file の配列に持つ, text: 判断の記録を 1 つの file（配列）に並べ、欄の決まりは同じにする。, verdict: rejected, reason: 粒度の軸でいちばん近い対抗案。1 判断の追加や改訂が毎回同じ file の変更になり、2 席が同じ作業ツリーで書くと衝突する。取り込みの審査で「どの判断が変わったか」が file 名で見えない。}
  - {id: b, name: 憲法 file の中に判断の節を足す, text: 憲法の正本（constitution.yaml）に判断の節を設けて並べる。, verdict: rejected, reason: 憲法の節の一覧（top_level）は閉じており（N-3）、節を足すのは schema 節の変更＝A-2 の改訂になる。判断を 1 つ足すたびに改憲になり、file も肥大する。}
  - {id: c, name: 散文（Markdown）の判断の記録, text: 前の版（folio v1）と同じ、文書の置き場に散文で置く形（docs/adr/ADR-0001.md）。, verdict: rejected, reason: 散文の欄は欠落を機械で検査できない（N-2 の極性と逆）。v1 は 48 本が全部「発効（accepted）」で「取り消した決定」を機械で引けなかった（P-7 の出所）。}
  - {id: d, name: 台帳（bd）の notes だけに残す, text: 判断は台帳の notes の逐語で足りるとする。, verdict: rejected, reason: 台帳はタスクと裁定の記帳先であって規則も文書も置かない（P-5.4）。承認は文書の承認欄にも記帳する（P-12.2）。}
basis: [P-8, A-2, N-4, N-3, P-5, P-6, P-7, P-12, P-13, R-7, R-8, CON1]
retreat: {kind: measure, condition: 数えるのは orchestrator 席（2026-09-19 までの名は planner 席・床を回す席）で、数えた結果は台帳に記帳する。案 a の利点（判断ごとの file で 2 席の衝突を避ける・どの判断が変わったかが file 名で見える）が出ていない事例＝2 席が同じ判断の記録の file を同時に直して取り込みが競合した回数、または取り込みの審査で判断の単位を file 名で追えなかった回数のどちらかが、同じ種類の失敗として rules 行 R-7 の上限を超えたら、本判断を捨てて案 e（全部を 1 file の配列に持つ）へ戻す。戻す前に持ち主へ知らせる。}
amends: []
approval: {who: 持ち主, date: 2026-09-13, ruling: f2-648.2 notes 2026-09-13 09:35, verbatim: すべて承認する, surface: R-8}
plain: 「なぜそう決めたか」を残すメモは、1 つの決定につき 1 枚のファイルにします。書く欄（何が問題か・何を決めたか・他にどんな案があってなぜ選ばなかったか・うまくいかなかったらいつやめるか・あなたの OK の言葉）は決まっていて、決まった欄が無い・空だと機械が止めます（あなたの OK の言葉は、発効させるときに要ります）。本文に英語の言葉を出すときは「日本語（原語）」の形で書き、本文に書く番号は実在するものだけにします。どちらも機械が数えます。誰が OK を出せるか・どこで OK を受けるか・番号の形といった決まりの中の値は機械の側が持っていて、決まりのファイルを書き換えても緩められません。番号は 1 から順に付け、前の道具の番号（0047 のような 4 桁）とは見た目で区別できるようにします。憲法の文を直す決定には「どの版の、どの欄を、どの文からどの文へ」を全部書きます。
consequences:
  - 憲法の 3 機構（P-8.1・A-2・N-4）の検査が床に実在する（発効日は Python の床・2026-09-18 からは folio check）。3 条の機構の欄（live）を「判断の記録の正本の後（adr）」から「いま動く（now）」に直すのは持ち主の承認の時で、機構の欄は A-2.2 の外なので改訂ではなく P-13.3 の変更として本判断に記す。
  - 以後、条文を直す変更は「判断の記録（発効済み・その版の欄単位の改訂欄つき）+ 各条の改訂来歴（amended_by）+ 凍結 anchor（ADR-2）」の 3 点を伴わないと床が落とす。
  - 読み物（preview/readable.html）に判断の記録の節が増える。M0 の folio の読み物の生成器は発効日の script を写したものなので、この節を置いたままで、「M0 ではこの節を置かない」という選択は採らなかった（述べた費用＝読む手段が正本 YAML だけになり「やさしく言うと」の面が無くなること も起きていない）。M1 以降の人が読む面は要件書 FR16（判断の記録の面）が引き取り、読み物のこの節の退役は判断の記録 ADR-7 決定 (5) が持つ。
  - 判断の記録の本文の英字語・本文の参照 id・根拠の形の検査は、欄の決まりの規則として床が課す。rules 行 R-4（参照 id）と R-9（英字語）の行と母集団は変えない（判断の記録は正本 4 file の外）。
  - M0 で folio が判断の記録の型を実装（Rust）の側で持ち、同じ検査を出せた時点で、欄の決まり（adr/schema.yaml）を正本から外し、床の判断の記録の節を削除する（判断は変えない・道具の移管）。道具の移管は 2026-09-18 に済み（day-1 の Python の床は退役の置き場へ移した）、この帰結の完了の形は判断の記録 ADR-9 が引き取った。
note: 条文の改訂ではないので A-2.3（grill）の対象外。敵対レビュー 4 周（読み取り専用の agent・opus）の記録は台帳 f2-648.2 notes に置く。平易文の直し（2026-09-20・天井の 8 周目と平易文の総点検〔全数の突き合わせ〕・持ち主の裁定 2026-09-20 17:21 JST〔f2-648 notes・逐語「承認する」〕）= 改訂を書く欄の「どの文からどの文へ」と、本文の英字語と参照番号の決まりを平易文に足した。実態との突き合わせの直し（2026-09-20・約束と実態の総点検と天井の 9 周目・持ち主の裁定 f2-648 notes 2026-09-21 00:00 JST〔逐語「すべて推奨で進めて」〕）= 撤退条件の席の名を今の名に、退役した道具の名を今の口の名に直し、読み物に判断の記録の節を置かないという採らなかった選択を帰結の側で実態に合わせた。決定の「判断の記録は folio が生成する文書ではないので P-6.1 の対象ではない」は、要件書 FR16 と判断の記録 ADR-7（判断の記録の面を生成器の 4 面目に足す・2026-09-18 発効）で前提が変わった = 今は判断の記録も folio が面を生成する文書で、正本は YAML 1 file（P-6.1 の形）。決定の字は変えない（2026-09-20・約束と実態の総点検）。実態との突き合わせの直し（2026-09-21・天井の 15 周目の直しの一括 9・裁定 id f2-648 notes 2026-09-21 18:42 JST（逐語「承認する」・一括 9））= 帰結が指す読み物（readable.html）は 2026-09-21 に退役済み（design-intent/preview/retired/ へ可逆に移し、命令 folio render は便 62〔台帳 f2-648.94〕で撤去した）。帰結の字は変えない。
