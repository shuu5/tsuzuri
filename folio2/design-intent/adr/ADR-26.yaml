# 状態: accepted（起草 2026-09-26・改訂 b〜e 2026-09-27・orchestrator 席の起草役〔opus 5.5〕・発効 2026-09-27 00:40 JST 持ち主「承認する」= 一括 27 の 🔴 問 1〔docs/design/ceiling-rules-triage.md〕・f2-648 notes・対話面 R-8）。憲法の条文は 1 字も変えない。
# 起点: 持ち主の直命（2026-09-26 17:32 JST・f2-648 notes）→ 席の調査（~/.local/share/folio2/handoff-2026-09-26/ceiling-audit/）→ 討論 7 論点（2026-09-26 23:26〜23:34 JST・全部「推奨で」）。

id: ADR-26
title: 天井の周と承認の回数を規則で締める（節目・上限・承認の範囲・置き換え）

status: accepted
date: 2026-09-26

plain: |
  天井（AI が設計文書を読んで食い違いを探す審査）は、磨けば磨くだけ直す所が見つかります。これまでは直すたびに周（AI の審査を 1 回まわすこと）を回し直し、直しのたびにあなたの承認を求めていたので、周も承認も上限なく増えていました。
  この判断は、周を回す時と承認を求める時を、規則の表の行で決まった形に締めます。

  周を回すのは 2 つの時だけにします。1 つは、反証でも支持された「止める」（本物の食い違い）を直した時。もう 1 つは「節目」で、M の出口の前か、便が 10 本着地した時の早い方です。例外として、この判断を取り込んだ直後に 1 回だけ、移行のための周を回します（判断の記録の状態の欄を引き金から外す実装の便を通すため）。
  「直す」「参考」の所見は台帳に積んでおき、節目の周の前にまとめて当てます。1 つの一括で回す周は 2 回までで、それでも合格しなければ「まだ分からない」としてあなたに渡します。
  判断の記録が提案中から発効に変わっただけでは周を回しません。提案中の判断の記録も、次の周が読みます。

  あなたの承認が要るのは 4 つだけにします。憲法の改訂・規則の表の行の追加と変更・憲法を改訂する判断の記録の発効・要件の追加と削除と M への割り当てです。
  それ以外（要件書の字の直し・天井の正本・入口・憲法を改訂しない判断の記録）は席が決めて承認欄に記帳し、あなたはいつでも覆せます。消す・外へ出す・お金のかかる道具を使う前の確認と、外部ライブラリを増やす・減らす確認は、今までどおりあなたに聞きます。

  直しは前の字を置き換えるか削るのを既定にし、規則の表の裁定の欄には最新の 1 つだけを書きます。天井の 4 つの観点は変えません。

context: |
  (1) 持ち主の直命（2026-09-26 17:32 JST・f2-648 notes）の要旨は、設計の磨き（天井の周）は上限なく続けられるので、ある程度の実装の後に決まった回数だけ磨く形にし、毎回の承認も減らすべきで、これは道具の構造の問題ではないか、である。
  (2) 席の調査（47 周・所見 938 件）の数は次のとおりである。止める は 52 件（6%）で、反証で 44 件が支持された＝道具の価値で、捨てない。直す は 727 件で、席が全部を当て、その直しが規範の欄に触れて周を起こし直していた。47 周のうち 4 観点とも合格した周は 20 である。
  (3) 持ち主の承認は 98 回で、憲法・規則の表・受入基準が持ち主の承認を名指す明文の根拠を持つのは 39 回だった。要件書の版の承認 45 回は要件書の自己規定（承認欄に持ち主の逐語が入った時点で発効）に依り、要件書の 47 版のうち 22 版は規範文が 1 字も変わっていない。判断の記録 25 本のうち条文を改訂したのは 4 本で、欄の決まりは条文を改訂しない判断を席が承認してよいとしている。天井の正本の承認には明文の根拠が無い。
  (4) 構造の欠陥は 4 つである。① 判断の記録の発効（状態の欄の変化）だけで本流の周が要る。② 天井と門の文書を天井が読み、直すたびに字が増える。③ 直しが足す形で正本が膨れる（要件書は 8 日で 4.7 倍）。④ 周と承認の回数の上限が規則に無い。
  (5) 席は 7 つの論点を 1 つずつ持ち主と討論し、7 つとも推奨の案を得た（f2-648 notes 2026-09-26 23:26〜23:34 JST）。

decision: |
  (0) 本判断は憲法の条文を改訂しない。天井の周の中身（材料の束・観点・重さ・反証・3 値）と門の式は変えない。決めるのは、周を起こす時・一括の周の回数・周の引き金の判断の記録の欄・持ち主の承認の範囲・直しの形であり、周の引き金の欄は判断の記録 ADR-18 の改訂の欄と実装の型付きの定数に、ほかは規則の表の行に置く（条 N-2.1・P-5.5）。
  (1) **周を起こすのは 止める の直しと節目だけにする（開発規律行 D-16）。** 反証で支持された 止める の直しを一括の枝に書いたときと、節目のときだけ周を起こす。直す と 参考 は台帳に積み、次の節目の前に 1 つの一括でまとめて当てる。引き金の欄の変更・判断の記録の発効・門の まだ分からない は、それだけでは周を起こさない。門が まだ分からない を返した設計文書の便は次の周の後に出す（行 D-12）。
  (2) **一括 1 つにつき枝の上の周は 2 回までとする（閾値行 R-21）。** 2 回で 4 観点とも合格しなければ往復を止め、枝と所見を まだ分からない として持ち主へ出す（条 P-4.2）。一括の枝の上の運び方は開発規律行 D-14 を置き換えた字が持つ。
  (3) **判断の記録の状態の欄を周の引き金から外す。** 判断の記録 ADR-18 決定 (1) の規範の欄 ② を、状態を問わずすべての判断の記録の id・決定・撤退条件・改訂の欄・置き換えの欄とし、状態の欄と、発効した記録に絞る条件を外す（改訂の欄）。提案中の判断の記録の字も引き金の要約値に入り、周が読む。発効の記帳だけでは引き金の要約値が動かない。実装は引き金の便 1 本（引き金の型付きの定数から状態の欄と発効の絞りを外す・凍結 anchor の測り直し）で運ぶ。この便は天井の正本の生成区間の写しも生成区間を書く命令で書き直すので、門の対象になる。その門を通すため、一括 27 の取り込みの直後に本流で周を 1 回だけ回して印を新しくする（移行の周・1 回限りで以後は無い）。引き金の便の着地までは、判断の記録の発効の記帳で引き金の要約値が動き印が古くなるが、(1) によりそれだけでは周を起こさない。
  (4) **持ち主の承認は 4 つに絞る（開発規律行 D-17）。** 憲法の改訂・規則の表の行の追加と変更・憲法を改訂する判断の記録の発効・要件の追加と削除と M への割り当て、の 4 つだけが持ち主の承認（逐語と日付・対話面 R-8）を要する。それ以外は席の裁定で発効し、席は承認欄に「席の裁定」の行（席・日付・台帳の裁定の id）を記帳する。持ち主はいつでも覆せる。要件書の自己規定（meta.effective）をこの形に書き換える（第 1.48 版）。消す・外へ出す・使う操作の確認（条 A-1）と外部ライブラリの増減の確認（条 A-3）は変えない。
  (5) **直しは置き換える・削るを既定にする（開発規律行 D-18）。** 字が増えるなら同じだけ削るか理由を台帳に記帳する。規則の表の行の裁定の欄は最新の 1 つだけを書き、前の裁定の鎖は台帳と版管理の履歴に任せる。既に膨れた字は、外の置き場で使える状態にする実装の便 8 本（台帳 f2-648 の群 A）の後の最初の節目で 1 回刈る。
  (6) **節目は「M の出口の前」と「便 10 本の着地ごと」の早い方とする（閾値行 R-22・開発規律行 D-16）。**
  (7) **天井の 4 観点（忠実さ・読みやすさ・文書どうしの整合・実態との整合）は変えない。**

options:
  - id: a
    name: 周を起こす時・回数・承認の範囲・直しの形を規則の表の行と判断の記録で締める（採る）
    text: |
      決定 (0)〜(7) の形。規則の表の行 5 本を足し、行 D-12 と D-14 を置き換え、判断の記録 ADR-8・ADR-18・ADR-19 の決定の範囲を改訂の欄で変え、実装は引き金の便 1 本。
    verdict: adopted
    reason: |
      止める（本物の食い違い）を拾う力は残したまま、直す の即時の反映と周の再起動の連鎖を断つ。承認も明文の根拠を持つ 4 つに揃う。
      上限と節目を規則の表の行に置くので、席の運用で磨きが足されても行が止める（条 N-2.1）。
  - id: b
    name: 規則を変えず、席の運用で直す の当て方を控える
    text: |
      規則の表と判断の記録は変えず、席が 直す を当てる数を自分で減らす。
    verdict: rejected
    reason: |
      周が止まらなかった原因の 1 つは、規則の字が「引き金の外だけでは回さない」と言っていたのに、席の運用が合格の後の磨きを足していたことである。運用だけで控えても同じことが起きうる（条 N-2.1）。
  - id: c
    name: 天井を M の出口の前の 1 回だけにし、観点を減らす
    text: |
      周を M の出口の前の 1 回だけにし、読みやすさと忠実さの観点を 参考 止まりにする。
    verdict: rejected
    reason: |
      止める の 52 件のうち 44 件は反証で支持され、読みやすさと忠実さの 止める も承認の質を守っていた。M の出口までの間に本物の食い違いを拾う周が無くなる（討論の論点 7）。

basis: [P-3, P-4, P-5, P-6, P-8, P-11, P-12, A-1, A-2, A-3, N-2, R-7, R-8, D-12, D-14, FR20, ADR-8, ADR-18, ADR-19, ADR-20]

produced: [R-21, R-22, D-16, D-17, D-18]

revises:
  - {target: ADR-18, decision: (1) ②, kind: narrow, summary: 規範の欄 ② から判断の記録の状態の欄を外す（同じ決定 (1) の widen の行と対を分けるため、決定の番号に ② を添えた）＝判断の記録の発効や廃止の記帳だけでは引き金の要約値が動かない}
  - {target: ADR-18, decision: (1), kind: widen, summary: 規範の欄 ② の発効した記録に絞る条件を外し、状態を問わずすべての判断の記録の id・決定・撤退条件・改訂の欄・置き換えの欄を引き金に入れる（提案中の記録の字は、それを読む枝の上の周の束と同じ字）}
  - {target: ADR-18, decision: (3), kind: narrow, summary: 手順の引き金 ① の「合格するまで周を回し直す」を、一括の枝の上で行 R-21 の回数までに狭め、超えたら まだ分からない として持ち主へ出す。② の M の出口の前の周は節目の周として行 D-16 が持つ}
  - {target: ADR-19, decision: (1), kind: narrow, summary: 枝の上で周を回す一括を 止める の直しの一括と節目の一括（行 D-16）に狭め、周の回数を行 R-21 までにする。1 回の承認要求で持ち主へ出すのは持ち主の承認が要る項（行 D-17）を含む一括だけで、含まない一括は席の裁定を記帳して取り込む}
  - {target: ADR-19, decision: (2), kind: narrow, summary: 承認で周の引き金の欄が変わっても、それだけでは本流で周を回さない（次の周が読む・行 D-16）}
  - {target: ADR-19, decision: (3), kind: narrow, summary: 往復を止めて持ち主に問う場合 (イ) から「判断の記録の発効か廃止」を外す（憲法を改訂しない判断の記録は席の裁定・行 D-17）。末文の「判断の記録の発効を含む承認の後の周は残る」も外す（発効だけでは周を起こさない・本判断の決定 (1)(3)）。行 R-21 の回数で合格しない枝を止めて出すことは本判断の決定 (2) が持つ}
  - {target: ADR-8, decision: (5), kind: narrow, summary: 同じ場所の同じ重さの所見が行 R-7 の回数を超えて残れば持ち主へ渡す、の数えを反証で支持された 止める の所見に狭める（台帳に積んだ 直す と 参考 は、次の節目まで当てないのが本判断の決定 (1) の形なので数えない）}

consequences:
  - 持ち主の承認の回数の見込みは、これまでの 98 回の形なら 30 回前後に減る。要件書の版の多くは席の裁定と事後の記帳で発効する（席の裁定の行は、台帳 f2-648.229 の便までは面の表紙の日付に読まれない）。
  - 周の見込みは、外の置き場で使える状態にする実装の便 8 本（台帳 f2-648 の群 A）の間は 0 周で、ほかは移行の 1 周（一括 27 の取り込みの直後）と M3 の出口の前の節目の 1 周になる。
  - 失うものは、直す の即時の反映である。直す は次の節目まで台帳に積まれ、その間の面には古い字が残る。
  - 一般の形として、周を起こさずに引き金の要約値を動かす取り込み（引き金の便の着地・その便の前の判断の記録の発効〔本判断の発効を含む〕・周を起こさない持ち主の一括）の後は、設計文書を書き換える便が次の周まで門で まだ分からない になる。待ちの便が設計文書の便だけなら行 R-22 の本数に届かないので、出口は持ち主の裁定か M の出口の前の周である。
  - 行 D-12 と D-14 の字、判断の記録 ADR-8 決定 (5)・ADR-18 決定 (1)(3)・ADR-19 決定 (1)〜(3) の読みと、ADR-19 と ADR-20 の帰結の「判断の記録の発効の後に本流で周が要る」は、本判断の改訂の欄と置き換えた行の字が持つ。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 の notes に記帳する。
    (1) 節目の周で 止める が 3 件以上出て、そのうち台帳に積んだ 直す の見送りが原因だと反証役が判定したもの（数えるため、節目の周の反証の依頼文に原因の問いを足す）が 1 件でもあれば、決定 (1) を戻す（直す をその都度当てる形）かを持ち主に問う。
    (2) 席の裁定で発効した版を持ち主が覆した回数が 2 回に達したら、決定 (4) を持ち主の承認へ戻すかを持ち主に問う。
    (3) 行 R-21 の上限で まだ分からない に落ちた一括が続けて 3 つになったら、行 R-21 の値を持ち主に問い直す。

