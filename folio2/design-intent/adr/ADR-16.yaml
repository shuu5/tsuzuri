  【判断の記録 ADR-22 による改訂（2026-09-25 発効・持ち主の承認 07:03 JST「すべて承認する」）】決定 (1) の末尾「契約表を持たない設計文書の移行は、要件書 CON8 のとおり M3 の後に改めて問う」は、判断の記録 ADR-22 の改訂の欄（狭める向き）で閉じた。scribe2 の設計文書は移らず、器の次の世代（scribe v3）は設計文書を最初から folio2 の形で書くので、問う相手が無い。M3 に入れないものの列と判定点 ①〜③ は変えない。
