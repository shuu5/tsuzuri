# folio2 判断の記録 ADR-16 — M3 = 契約表を持つ設計ノートを、外部の利用者 1 つ（scribe2）が自分の repo で folio2 の床に掛けられる形
# 状態: accepted（発効 2026-09-23 17:39 JST・持ち主の承認・逐語「裁定は両方承認する」・🔴 1 = 本判断の発効 + 要件書 版 A + 便 7〜9 の列・🔴 2 = ADR-3 決定 (3) は改訂の対象に足さない。起草 2026-09-23・改訂 a〜d = grill 3 周と scribe2 の消費側コメント 2 周への応答・orchestrator 席 fable 5.1）
# scribe2 の消費側のコメント（blocking 4）への応答と、両者の食い違いへの orchestrator 席の裁定 3 点の反映。
# 出所 = scribe2 からの移行の依頼への folio2 席の回答 ~/.local/share/folio2/handoff-2026-09-23/scribe2-migration-reply.md の §1「M3 の最小の口」と、
# 事実の一覧 同 dir の migration-facts.md。grill の記録 = 同 dir の adr16-grill.md。scribe2 のコメント = 同 dir の scribe2-adr16-comments.md。
# 起草の記録（読んだ材料・実測の手順・迷った点・改訂ごとの直した点と直さなかった点）= 同 dir の adr16-draft.md。
# 実測は scratchpad の写しの repo（folio2 の design-intent を削って作った「利用者の最小の design-intent」）に main 0f00d59 の folio を撃った。

id: ADR-16
title: M3 は「契約表を持つ設計ノートを外部の利用者 1 つが自分の repo で床に掛けられる」に限り、1 つの組み立てのまま、列の根を憲法の名ごとの表に広げ、値域と部品目録は道具の側に残す

status: accepted
date: 2026-09-23

plain: |
  folio2 の道具を、はじめて folio2 以外の場所（scribe2 の repo）で使えるようにするための判断です。
  いまの道具は、folio2 のためだけに作られた箇所がいくつかあって、ほかの repo の文書を検査すると、
  どう直しても「合格」まで届きません。写しの repo で実際に試して確かめました。

  まず、次の段（M3）でやることを小さく決めます。
  scribe2 の設計文書のうち「便 1 本で何を作るか」の表（契約表）を持つものだけを、
  folio2 の形（YAML）で scribe2 の repo に置き、道具の形の検査（床）に掛けて合格させ、scribe2 が読む形の写しをそこから作れるようにする。これだけです。
  scribe2 の憲法・判断の記録・調べものの文書を移すこと、人が読むページを作って見せること、ページの見た目を直すことは、この段に入れません。
  AI による意味の検査（天井・4 つの観点のどれも）、AI の手元へ憲法を写すこと、便が入ったかを印から読むこと、
  AI へ常時渡す説明文の量を数えること、scribe2 の側の仮の検査を外すことも、この段に入れません。
  scribe2 は、動かした道具の版を特定する番号を記録に添えて試します。道具の中身で合否が変わるからです。

  次に、folio2 専用になっている箇所を 1 つずつ扱います。
  道具を scribe2 用に別に作り分けることはしません。道具は 1 つのままにします。
  (1) 憲法の写しの列の「いちばん最初の 1 枚」（見出しの「列の根」）の番号は、いま道具の中に folio2 の分が 1 つだけ入っています。
  これを見出しの「憲法の名ごとの表」（利用者の repo ごとに、その repo の憲法が名乗る名前で 1 行を持つ表）に広げ、scribe2 の分を 1 行足せるようにします。
  足すには folio2 の側の便と、scribe2 の持ち主の OK が要ります。scribe2 の側の文書を書き換えても、この表は動きません。
  各利用者の手元に写すのは表のうち自分の行だけにするので、表に行を 1 つ足しても、ほかの利用者の検査は落ちません。
  (2) 憲法の値の選び方の一覧（段・強さなど）と、ページの部品の一覧は、道具の側に残します。
  これはページの作り方や検査のしかたと一体だからです。repo の側の一覧が道具の一覧の中に収まっていれば検査を続け、
  道具の知らない値が混じっていたら「まだ分からない」と正直に言います。
  (3) 新しい repo では、写しの列と番号の一覧の 2 つの基準が、互いに「相手が無いから作れない」と断り合って、
  どちらも作れません。これも試して確かめました。2 つがどちらも無く、ほかの検査にも引っかかりが無い（違反も「まだ分からない」も無い）ときにだけ使える命令で、同時に作れるようにします。
  この命令はどの検査も外しません。
  (4) 新しい repo で最初の文書一式を書く命令（folio init）を足します。いまは、案内の 1 行が
  相談窓口の命令を使うよう勧めるのに、その命令は新しい repo では動かず、行き止まりになっています。
  書く場所は利用者が選び、別の文書が既に在る場所には書きません。scribe2 は design-intent の中の folio2 という場所に置きます。
  scribe2 の側に置く「憲法」は、憲法とは名乗らず「床の受付の宣言」と呼び、決まりの文は 1〜2 本だけにして、
  scribe2 の本来の憲法の条を番号で指します。AI の手元へ写すこともしません。

  「決まりの文には番号を添え、数と単位を書かない」という検査は、決まりの言葉と単位の一覧が scribe2 と同じです。
  違いは 3 つあります。「番号」として数える形と、数と単位の読み方（英字の単位の後の複数形の字と全角の空白）と、番号の行き先を調べるかどうかです。
  番号として数える形は、repo ごとに規則の表の行に持たせます。folio2 の一覧は今のままで、scribe2 の一覧は scribe2 の形にします。
  そのうち、番号の行き先を調べられない形（節の記号・台帳の番号・4 桁の判断の番号）は「形だけ認める」種類に分けます。
  scribe2 の憲法の条の番号と英字を含む規則の番号も、行き先が folio の置き場の外なので、M3 では同じ種類に置きます。どの形をどちらの種類に置くかの最初の割り振りは、scribe2 の持ち主が決めます。
  数と単位の読み方は repo ごとに変えず、scribe2 の側が folio の読みに揃えます。
  scribe2 の側の仮の検査を外すのは、契約表を持つ文書が全部移り、scribe2 の自動の検査が道具を動かすようになってからです。
  契約表から scribe2 が読む形の写しを作る口（FR11）は、scribe2 の側の読む口が 2026-09-22 に出来たので、
  保留を解く条件は満たされました。この判断と同じ OK で要件書の版を上げて保留を解き、便を起こします。
  この写しを作る命令は、人が読むページを組み立てる命令から切り離します。ページの組み立ては「全部作れなければ 1 枚も書かない」決まりで、
  scribe2 の文書の半分近くは章が多すぎてページを作れないため、同じ命令に入れると写しも作れなくなるからです。

  最後に、やめる条件を決めておきます。scribe2 の文書を検査して、道具の中の folio2 専用の値が原因で
  「まだ分からない」になる種類が新しく 3 つ出たら、今回の洗い出しは足りなかったということなので、測り直します。
  folio2 自身の検査の結果が、この判断の便のせいで 1 度でも変わったら止めます。
  道具を作り分けないと進めない場面が 2 回来たとき、表の行や値の一覧を変えただけで利用者の検査が落ちた回が 2 回に達したときも、
  この判断を捨てて考え直します。

  （2026-09-24 の後の読み方）scribe2 の設計文書を移す計画は、scribe2 の持ち主の裁定で取りやめになりました。判断の記録 ADR-21 は、この判断で道具を試す相手（外の利用者）の scribe2 を、器の次の世代（scribe v3）の設計の置き場に読み替えています。出口の 3 つの確かめはその置き場で数え、3 つ目の記録には、読んだ器の組み立て（器の repo と commit）を名指します。読み替えるのは、この試す相手だけです。置き場を design-intent の中の folio2 という場所にすることと、憲法を「床の受付の宣言」と呼んで本来の憲法の条を番号で指す形は、同じ repo に本来の憲法を別に持つ利用者に限ります。v3 の置き場の場所は v3 が選び、v3 の骨格の憲法は v3 の憲法そのもので、v3 の持ち主が骨格の「本来の憲法を指す」字を v3 の条に書き換えてから第 1.0 版を承認し、その後に始まりの凍結を動かします。v3 は設計文書を最初から folio2 の形で書くので、scribe2 の番号の書き方に合わせる話と、scribe2 の側の仮の検査を外す話は閉じました。上の段落は、発効したときの字のまま残しています。

context: |
  (1) 依頼と前提。scribe2 は folio2 の最初の外部の利用者になる。scribe2 の依頼（台帳 s2-07l.214 を畳むため・持ち主の指示）に
  folio2 席が回答し、その §1 が M3 の最小の口を 5 つ挙げた。判断の記録 ADR-3 決定 (8) と要件書 CON8 が
  「YAML へ移す最初の範囲は契約表を持つ設計文書だけ」と裁定済みである。条 P-13.4 は、自分の便で自分を運ぶ運用（self-host）を
  外部の利用者で受入が通った後に始めると定めている。M3 はその「外部の利用者の受入」に当たる最初の段である。
  いまの要件書（第 1.30 版）には M3 の範囲の節が無く、M3 の語は保留の 3 本（FR11・FR13・NFR1）の「M3 の入口で再判定」の句にしか出ない。
  要件書の最上位の節は床の閉じた一覧（17 節）なので、M3 の範囲の節（scope_m3）を足すには床の定数の改訂が要る。
  scribe2 で契約表を持つ設計文書は 22 本中 17 本である（grill の実測）。

  (2) 実測: 今の道具は外部の repo を合格させられない。folio2 の design-intent を削って「利用者の最小の design-intent」を
  写しの repo に作り（条・規則の表の行・要件 1 本・受入基準 1 本・判断の記録 1 本・契約表を持つ設計ノート 1 本）、
  統合先の先頭（main 0f00d59）の道具を撃った。違反 0 まで削った時点で「まだ分からない」が 2 件残り、どの順に凍結の旗を撃っても消えなかった。
  (ア) 列の根。凍結 anchor の列の最初の 1 枚の要約値は床の定数で、folio2 の憲法 第 1.0 版の値 1 つだけを持つ（判断の記録 ADR-2 決定 (3)）。
  別の中身の憲法で列を始めると「列の根の要約値が床の定数と違う」の違反で凍結できない（実測）。
  (イ) 始まりの凍結の輪。憲法の列（凍結 anchor の憲法の写し）も番号の一覧（凍結 anchor の id の一覧）も 0 本の repo では、
  憲法の列を凍結する旗は「id の一覧が無いので測れない」を理由に断り、id の一覧を凍結する旗は「凍結 anchor が 0 本」を理由に断る（実測）。
  各旗は自分の基準の不在だけを数えから外し、相手の不在は外さない。folio2 は憲法の列が先に在り、id の一覧を後の便で足したので、この輪に当たらなかった。
  以上 2 つは互いに独立である。

  (3) 他に folio2 専用に焼かれている箇所。回答が挙げた 3 つ（列の根・憲法の値域・部品目録）を実装の側（src）で確かめ、実測で 3 つ足した。
  (ウ) 憲法の値域（段・縛る相手・型・強度など 10 鍵）は、組み立て時に組み立ての script（build.rs）が folio2 の憲法の正本の値域の節（schema.enums）から型へ導出する。
  床（folio check）は条の値をこの型で引くので、利用者の憲法が別の値を宣言して使うと「憲法の値域に無い」の違反になる。
  文言は「憲法の値域」だが、照合先は利用者の憲法ではなく道具を組み立てた folio2 の憲法である。
  面の生成器は同じずれを「組み立て時の値域と違う」として数えるが、床は数えない。
  面の名札の表（段・強度・型などの名札と色）は型の値の全部を並べた場合分けで持ち、その他の値を受ける枝を持たない（判断の記録 ADR-11 決定 (4)②）。
  このうち 2 鍵（根拠の種別・機構がいつ実在するか）の値は folio2 の出自と段の名そのものである。
  (エ) 部品目録（parts.json）は組み立て時に導出して焼き込む。床は部品目録を読まず、写しの repo に部品目録が無くても床の合否は変わらない（実測）。
  置き場の部品目録を読むのは部品の検査の命令だけで、組み立て時と違えば「組み立て直す」と断る。
  面の生成器は組み立て時に焼いた一覧を使い、様式の 2 file（folio.css・folio-ui.js）は検査される置き場の下から写す。
  (オ) 床が id で名指すもの。承認の対話面は規則の表の行 R-8 に固定され（判断の記録と設計ノートの欄の決まりの値域）、
  散文の門は行 R-16 の値を読み（無ければ「まだ分からない」）、要件書と語彙の生成区間の説明の注は条 N-3 を名指す。
  規則の表の行は必ず縛る条を持ち、どの条からも参照されない行は数えられる（R-4）。縛る条の id は床に固定されず、改番しても違反 0 のままである（grill の実測）。
  最小は、行 R-8 と R-16 を 1 本の条が縛り、条 N-3 を残した「条 2 本・行 2 本」で、注から条 N-3 を外せば条 1 本になる（grill の実測）。
  条は規範文を 1 本以上要るので、規範文の無い条にはできない。
  (カ) 判断の記録の欄の決まりの出所。判断の記録の欄の決まりの file の先頭の欄（meta.decided_by）は、同じ design-intent の判断の記録の実在を求める。
  folio2 の写しでは folio2 の ADR-1 と ADR-2 を名指しており、利用者の repo では解決しない（実測）。
  (キ) 器の導出 file の置き場。床は契約表の欄の決まり（contracts/schema.toml）を、検査する置き場の親の場所から固定で探す。
  置き場を repo の根の直下でない場所（例 design-intent/folio2）にすると、repo の根に在る器の導出 file を読めず「まだ分からない」になる（実測）。
  版管理の根を解く口は、版管理の照合の側に既に在る（gitcheck.rs の git toplevel）。

  (4) 置き場。scribe2 には既に design-intent の場所が在り、前の版（folio v1）の文書群（憲法ほかの spec・判断の記録 56 本・調べもの・語彙の file）が使っている。
  folio2 の正本 7 file は語彙の file（vocabulary.yaml）を含むので、同じ場所には置けない。
  前の版の道具は 3 つの場所（spec・decisions・research）しか走査せず、scribe2 の入口の検査は design-intent の下を文書だけの面として通す（scribe2 のコメント）。
  folio は置き場の名を固定していない。実測で、最小の写しを design-intent/folio2 に置き、器の導出 file をその親の場所に置くと、
  結果は repo の根の直下に置いたときと同じ（違反 0・まだ分からない 2）だった。器の導出 file を repo の根にだけ置くと「まだ分からない」が 1 つ増えた。

  (5) 値を repo の側から読む前例。散文の門の印と単位の一覧（行 R-16）、注入の上限（行 R-2）などは、既に検査される repo の規則の表から実行時に読んでいる。
  規則の表の行は裁定 id と時刻を持ち（条 P-17.1）、値を緩めるときは検証を前置する（条 P-17.4）。
  判断の記録 ADR-11 決定 (3)(ア) は、部品目録と憲法の値域を「持ち主か設計文書が決める中身で、型付きの file が正本」と分類し、
  実装はそれを「実行時に読むか組み立て時に導出する」とした。同 (4)② は、憲法の値域を組み立て時の導出に替え、実行時に読む形は採れないとした。
  一方、判断の記録の欄の決まりの file の先頭の注と判断の記録 ADR-2 は、列の根を「data 側で動かすことはできない」値に挙げている。

  (6) 読まれない .md と導出物。器 scribe2 の設計文書（docs/design の Markdown）は folio のどの口も読まない。
  folio2 の設計ノートの正本は設計ノートの置き場の YAML 1 file である（条 P-6.1）。
  契約表の欄の決まりは器が導出した型付き file から読み、この口（FR10）は実装済みで、契約表を持つ設計ノートは既に床で検査できる。
  導出物（FR11）の口は未実装で保留である。その前提の器の口 s2-07l.473 は 2026-09-22 に着地済みで、
  器は契約表の指し先（pointer）が導出 toml を指すとき、その行の節の逐語（goal）を受ける（scribe2 の返事・2026-09-23）。

  (7) 散文の門の突き合わせ（src で確かめた）。器の暫定の門と folio2 の行 R-16 は、規範の印 5 種・「禁止」の直後の 5 文字・単位 13 語（宣言の順まで）・
  母集団から外すもの・文の区切りが同じである。違いは 3 つある。
  1 つ目は参照 id として数える形である。folio2 は実装の定数で、条（P-・A-・N-）・規則（R-・D-）・要件（GOAL・NFR・FR・AC・CON）・契約（<文書 id>#<行 id>）を数える。
  器は 9 形を数える = 器の憲法の条（ハイフンの無い条の番号・例（C7・N2））・要件（FR・AC・NFR と数）・規則（R- と英数・例（R-C4-1））・
  4 桁の判断の記録（例（ADR-0047））・節の記号（§ と数）・契約（<文書 id>#<行 id>）・台帳 id（s2- の形）。共通は要件の 3 形と規則の R- と契約 id である。
  2 つ目は数と単位の読み方で、器は英字の単位の直後の複数形の字を 1 つ落として読み、数と単位の間に半角の空白 1 つだけを許す。
  folio2 は複数形の字を落とさず、空白の字なら全角も含めて 1 つ許す（grill の実測で、全角の空白を挟んだ数と単位は folio2 だけが落とした）。
  3 つ目は解決である。folio2 の門は、印を持つ文の参照 id を同じ design-intent の条・規則の表・要件・判断の記録の id で解決し、
  無ければ違反にする（note.rs）。器の門は形を数えるだけで解決しない。
  scribe2 の設計文書 22 本で規範の印を持つ文は 1 文だけで、今の folio2 の形でも器の形でも通る（grill の実測）。
  参照 id の形の一覧を実装の中に持つことは、判断の記録 ADR-11 決定 (4)⑧（台帳 f2-648.76）の論点と同じである。
  器の暫定の門は「対象が 0 本なら違反に倒す」ので、.md を 1 本ずつ退役させると、最後の 1 本で器の門が落ちる。

  (8) 面の側の制約。設計ノートの面は章の上限 12（節の数 + 図が在れば 1）を持ち、超えると面を導出せず、配信の組み立ては全部か無しかである。
  散文の本文は書式付きの文章（Markdown）として描かれない。章の上限は実装にだけ在る閾値で、規則の表の行へ移すことは
  判断の記録 ADR-11 決定 (4)⑦ で決まっている（台帳 f2-648.75・未着地）。床は章の数を数えない（grill の実測・15 節の設計ノートで床は違反 0）。
  一方、要件 FR11 の契機（when）と設計ノートの欄の決まりの床の定数（導出物の検査の命令の名）は、導出物の検査を配信の組み立て（folio build --check）に結んでいる。
  配信の組み立ては全部か無しかで、章の上限を超える設計ノートが 1 本でも在るか様式の file が無いと 1 file も書かない（site.rs）。
  scribe2 の設計文書 22 本のうち 10 本が章の上限を超え、契約行 223 本のうち 202 本がその 10 本に在る（scribe2 の実測）。
  このままだと、導出物は scribe2 の契約行の大半で作れない。1 本目は 11 節の文書（pipeline-conflict）に替わった。

  (9) 利用者の側の制約（scribe2 のコメント）。scribe2 の自動の検査は folio2 を撃たない。folio2 を撃つには依存の追加と取得の経路の宣言
  （依存の増減を扱う scribe2 の憲法の条（A3）の裁定）が要る。席が手元で組み立てた folio を撃つ形は、依存の追加に当たらない（scribe2 の 2 周目のコメント）。scribe2 は公開の repo で、口座名と持ち主の逐語を版管理の file に書かない。
  scribe2 の要件書の要件は 71 本で、見出し・規範文・平易文に語彙に無い英字の語が 192 語ある。1 本目の文書の契約表が指す要件は 3 本である。

decision: |
  (1) M3 の範囲。M3 は「契約表を持つ設計ノートを、外部の利用者 1 つ（scribe2）が自分の repo の folio の置き場に置き、
  同じ 1 つの folio の床に掛けて合格まで届き、器が読む導出物をそこから作れる」に限る。
  入口は本判断の発効と、要件書に M3 の範囲の節（scope_m3）を足す版の発効である。
  出口は、利用者の 1 本目の設計ノートが次の 3 つの判定点を通ったときである:
  ① 利用者の repo で床が合格する、② 導出物が利用者の repo に着地して差分 0 を数えられる、③ 器の受付がその導出物を読んで通す。
  判定点 ① の前提は、利用者が撃った folio の組み立てを判定点の記帳で特定できることである。利用者は撃つ folio の組み立ての要約値を判定点の記帳に添える。
  列の根の表と値域は組み立ての中に在るので、組み立てを特定しないと、どの版で検査したかが合否の一部になる。
  利用者の依存として folio を固定する裁定（scribe2 の憲法の条（A3））は、利用者の自動の検査で床を撃つ段（決定 (6) の撤去の条件）で当たる。
  判定点 ①〜③ の記帳は利用者の台帳が持ち（scribe2 は s2- の項）、folio2 の台帳 f2-648 はその id を名指す。
  判定点 ① の記帳は、席が撃った床の出力の写しと、撃った folio の組み立ての要約値を持つ。
  M3 に入れないもの = 利用者の憲法・判断の記録・調べものの文書の移行、面の生成と配信（build の面・serve・face・figure）、
  天井（ceiling）、注入（inject）、着地の印（FR13）、常時注入の量（NFR1）、面の見た目の直し（設計ノートの面の章の上限を緩めることを含む）、
  器の暫定の散文の門の撤去（決定 (6)）。
  契約表を持たない設計文書の移行は、要件書 CON8 のとおり M3 の後に改めて問う。
  M3 の範囲の節を足すには、要件書の最上位の節の閉じた一覧（床の定数）を改訂する便が、要件書の版上げより先に要る。

  (2) 道具は 1 つの組み立てのままにする。利用者ごとに定数を替えた別の組み立てを持たない。
  folio2 専用に焼かれている箇所は、次の (ア)〜(キ) のとおり扱う。
  判定の式は 1 つで、利用者ごとに違ってよいのは「検査される置き場の型付きデータ」か「道具の側の閉じた表の行」だけである。

  (ア) 列の根は、床の定数を「憲法の名（検査される置き場の憲法の正本の meta.id）から根の要約値を引く表」に広げる。
  最初の版は表に持たせず、全行で共通の今の値（第 1.0 版）のままにする（判断の記録 ADR-2 の改訂は決定 (3) の範囲に留める）。
  folio2 の行（folio2 の憲法の名・今の要約値）は 1 字も変えない。表に無い名の憲法の列の根は、
  凍結の旗が要約値の全桁を出して断り（表に行を足すための値を出す）、既に在る列なら床が違反として落とす。どちらも合格にはならない。
  表の鍵は検査される置き場の憲法の名で、利用者の本来の憲法（前の版の文書）の同一性は表に載らない。
  表に行を足すのは folio2 の便で、契約表の行か設計ノートが利用者の持ち主の承認の裁定 id を名指す（規則の表の行 D-11 の手順）。
  表は判断の記録の欄の決まりの file の生成区間に写しを導出する（条 P-5.6・行 D-11）。写しは「検査される置き場の名の行だけ」とする
  （写しは表と置き場の名から決定的に決まる）。表を写さない形は、行 D-11 が写しの導出を求める定数なので採らない。
  検査される repo の側の data（憲法の名を書き換える・根の file を書き換える）で表の行を選び直しても、
  別の行の要約値との不一致か、表に無い名の断りにしかならない。

  (イ) 始まりの凍結は、憲法の列と id の一覧がどちらも 0 本の置き場でだけ成り立つ凍結の命令とし、2 つを同時に書く（旗の名は便で決める）。
  この命令はどの検査も数えから外さない。前提は、その 2 つの基準の不在を除くすべての検査が 0 違反で「まだ分からない」も無いことである。
  どちらか 1 本でも在れば断る。書いた後は、ふだんの床が全部の検査を回す。今ある 2 つの旗の前提は変えない。

  (ウ) 憲法の値域は、組み立て時の導出のまま道具の側に残す（判断の記録 ADR-11 決定 (4)② を変えない）。
  値域を利用者ごとの data にすると失うものは、面の名札の表の網羅（値が足されたら組み立てが通らないこと）と、
  強度の値に掛かる文末の極性の検査のように値の意味を式が持つ箇所の確かさである。
  代わりに、床に「置き場の憲法の値域の節の各鍵が、組み立てた版の同じ鍵の部分集合か」を数える口を足す。
  部分集合なら、条の値は置き場の値域でも組み立てた型でも引けるので判定できる（床は置き場の値域に無い値を違反にする）。
  部分集合でない鍵が 1 つでも在れば「組み立て時の値域に無い値がある」の「まだ分からない」にする（条 P-4.2）。
  folio2 が値域に値を足しても、利用者の値域は部分集合のままなので、利用者の床は変わらない。
  利用者の憲法の値域が道具の値域の外の値を要るようになったら、それは利用者の憲法を移す別の判断の記録で扱い、
  そのとき 10 鍵を「道具の意味を持つ鍵」と「repo の出自を持つ鍵（根拠の種別・機構がいつ実在するか）」に分けるかを問う。

  (エ) 部品目録は repo ごとに持たない。部品目録は 1 つの生成器（条 P-2.1）の閉じた一覧（条 P-2.4）で、
  部品を足すには生成器の実装が要るので、利用者の data で広げられる値ではない。床は部品目録を読まないので M3 の床には効かない。
  面の生成（様式の file を置き場の下から写す形を含む）を利用者に広げるときに、別の判断の記録で扱う。

  (オ) 床が id で名指すのは、規則の表の行 R-8 と R-16 の行 id と、要件書と語彙の生成区間の注が名指す条 N-3 である。
  生成区間の注から条 id を外す（注は床の定数の字面なので folio2 の便で直す・folio2 の床の結果は変わらない）。
  骨格は、行 R-8 と R-16 と、それを縛る条を持つ。例外の口を足さないことを定める条（folio2 の条 N-3 に当たる）は、
  利用者の本来の憲法に指す先の条が在るときだけ置く（無ければ条は行 R-8・R-16 を縛る 1 本）。どちらにするかは骨格の承認の裁定（利用者の持ち主）で決める。
  指す先の無い条を置くと、骨格が新しい規範を書くことになり、しかも条は外せないためである（帰結）。
  条の番号は利用者の番号空間の 1 から振り、folio2 の番号を予約しない（条 P-7.1）。
  行 R-17（散文の言及の歯）は骨格に入れない。行が無ければ黙る歯で、設計ノートの散文の節は数えの外なので M3 の判定点に効かない。
  利用者が要れば、利用者の持ち主の裁定で足す。

  (カ) 判断の記録の欄の決まりの出所は、骨格の命令が利用者の置き場に最初の判断の記録（folio の欄の決まりを採る・提案中）を書き、
  欄の決まりの file の先頭の欄がそれを名指す形にする。発効は利用者の持ち主の承認で行う。

  (キ) 器の導出 file（contracts/schema.toml）の解決先を、検査する置き場の親の場所の固定から、置き場を含む版管理の根（git toplevel）へ改める。
  床の読み（note.rs）と面の生成器の同じ読み（face_note.rs）を同じ便で直す。解く関数は 1 つにして床と面の生成器で共有し、
  版管理の根が在ればそこ、無ければ置き場の親に倒す（面は版管理を要らない命令で、面の歯の写しは版管理を持たない。床は版管理の無い写しを既に「まだ分からない」にしている）。
  この形は便 ④ の契約に書く。
  folio2 自身では置き場の親の場所が版管理の根なので、結果は変わらない。

  (3) 骨格の命令（folio init --dir）を足す。
  置き場（--dir）は利用者が選び、既に別の文書群が在る置き場には書かない（正本が 1 本でも在れば何も書かずに断る・上書きしない・条 N-1.1）。
  scribe2 の置き場は design-intent/folio2 とする（前の版の道具が走査しない場所で、scribe2 の入口の検査が文書だけの面として通す・文脈 (4)）。
  設計ノートと導出物の path と、器の指し先の読み替えの規則はその置き場から決まる。
  書くもの = 正本 7 file・判断の記録の置き場と欄の決まり・設計ノートの置き場と欄の決まり。
  生成区間は床の定数から書き（folio schema --write と同じ導出）、(2)(オ)(カ) の最小の条・行・判断の記録を足す。
  骨格の憲法の file は、利用者の repo では憲法と名乗らず「床の受付の宣言」と題する（名は利用者が決める）。
  条の規範文は、利用者の本来の憲法の条を番号で指す 1 文とし、根拠の種別は値域の既存の値（scribe2-article）で本来の条を名指す。
  骨格は注入の対象にしない（M3 の外）。
  骨格の命令の雛形は、folio2 の口座名・席とモデルの名・folio2 の持ち主の逐語を写さない（雛形の元の folio2 の正本には在る）。
  承認欄の逐語を利用者の台帳の裁定 id を指す形で書いても、今の床は変わらない（grill の実測で違反 0）。床の変更は要らない。
  逐語を台帳を指す形にすることは、folio2 の条 P-12.2 の下では逐語の記帳にならないので、利用者の宣言の条がそれを認める形にし、
  利用者の持ち主が骨格の承認のときに明記する。
  相談窓口の質問は、骨格の命令の雛形として道具に持つ（組み立て時に folio2 の相談窓口の正本から導出し、回答と承認の欄は写さない）。
  書いた後は利用者の repo に書かれた相談窓口の file（intake.yaml）が正本であり、folio intake は今のまま置き場から読む（判断の記録 ADR-6 決定 (1) を変えない）。
  案内の 1 行（FR3）は、憲法の正本が無い置き場では骨格の命令を案内する（今の「相談窓口の命令を撃て」は新しい repo で行き止まりになる）。

  (4) 条 N-3.1 との整合。N-3.1 が拒むのは規則の例外機構（無効化の旗・「今回だけ」の口）である。
  本判断が置く物差しは「検査される repo の側の data を書き換えて、落ちるはずの検査を通せるか」で、(2) の 7 つはどれも通せない。
  (ア) の表は道具の側に在り、検査される側は行を選べるだけで、選び直しは断りにしかならない。
  (イ) の命令は検査を数えから外さず、自分が作る 2 つの基準の不在だけを前提から除き、書いた後はふだんの床が全部を数える。
  (ウ) は値域のずれを「まだ分からない」に上げる向きで、緩める向きの口を持たない。
  (エ) は床の外。(オ)(カ) は雛形を書くだけで、書いた後の値は利用者の型付きデータ（裁定 id を持つ規則の表の行・承認欄を持つ判断の記録）である。
  (キ) は置き場を解く式の改めで、どの検査も外さない。
  利用者の規則の表の値（散文の門の印と単位など）を実行時に読むのは今もそうで、それは利用者の持ち主が裁定する repo ごとの正本であり、例外の口ではない。
  決定 (6) の参照 id の形の一覧も同じく repo ごとの行 R-16 の値で、改訂は裁定 id を持つ。
  folio2 の参照 id の床の母集団は、検査される design-intent の正本の中に閉じたまま広げない（判断の記録 ADR-3 決定 (6)）。
  利用者の要件 id は利用者の design-intent の中では内部の id であり、folio2 の design-intent からは解決しない。

  (5) M3 の入口の再判定（保留の 3 本）。
  FR11（導出物と差分 0）の保留を解く条件は、器の口 s2-07l.473 の着地であり、この条件は満たされた（2026-09-22 着地・文脈 (6)）。
  導出物を組む口と差分を数える口は、配信の組み立て（folio build）から切り離した独立の命令とし、面の生成器も様式の file も呼ばない（名は便で決める・案 folio derive --check）。
  配信の組み立ての全部か無しか（条 P-4.1 の実装）は変えない。面だけを飛ばして残りを書く形は採らない。
  要件 FR11 の契機（when）と、設計ノートの欄の決まりの床の定数（導出物の検査の命令の名）は、この独立の命令を名指すように直す。
  判断の記録 ADR-3 決定 (3) の括弧の「folio build --check」は、導出物の差分 0 の検査の呼び名の例示として読む（決定の中身＝事後の drift の検出は変えない）。
  FR11 の保留の解除と契機の直しは、本判断の発効と同じ承認で出す要件書の版に入れる（M3 の範囲の節を待たない・決定 (7)）。便はその版の後に起こす。
  導出物の形は判断の記録 ADR-3 決定 (4) のまま（先頭の版の宣言・契約の配列・各行の節の逐語・空の一覧は欄名を省く）で、
  器の読み手が受ける形との一致は、導出物の便の受入で器の受付に実物を読ませて確かめる（判定点 ③）。
  判定点 ③ は folio2 の外の事実なので、folio2 の受入基準では、利用者の台帳の記録が在れば着地、無ければ「まだ分からない」の測定値として書く（ADR-3 決定 (5) と同じ形）。
  FR13（着地の印）と NFR1（常時注入の量）は M3 に入れず、保留のまま残す。

  (6) 散文の門の引き取り（判断の記録 ADR-3 決定 (7)）。式は道具の 1 つで、印・単位・参照 id の形の一覧は検査される design-intent の行 R-16 の値である。
  参照 id の形は、道具が知る形の閉じた一覧（条・規則の行・要件・契約・判断の記録・節の記号・台帳 id など）から選ぶ。
  形の名と字の並びは実装の型付きの定数のままで、写しを生成区間へ出す（条 P-5.6・判断の記録 ADR-11 決定 (4)⑧ を変えない）。
  どの形を選ぶかと、形ごとに「置き場の正本の id として解決する」か「出所の印として形だけ認める」かは、repo ごとの行 R-16 の値に持つ。
  解決する形の id は、検査される design-intent の条・規則の表・要件・判断の記録・契約の id で解決し、無ければ違反にする。
  形だけ認める形は、参照 id が在ると認めるだけで解決しない。解決の対象は検査される design-intent の id に閉じ、行 R-4 の母集団は広げない（ADR-3 決定 (6)）。
  値の欄の閉じた一覧を床に置き、未知の欄を落とす（欄の名の綴りの誤りで黙って既定に倒れる形を塞ぐ・条 P-4.1）。
  folio2 の値は今の形のまま（条・規則・要件・契約 = すべて解決する形）とし、和集合にしない。folio2 の門は 1 字も緩まない。
  利用者の行 R-16 の雛形は folio2 の値で、雛形を書いた後の値は利用者の持ち主が裁定する。形だけ認める形を足すことは、その repo の持ち主の裁定の範囲である。
  形だけ認める形の id しか持たない規範の文は門を通る。folio の床はその文の規範の効力を確かめない。形だけ認める形を選ぶ裁定は、効力を確かめる層が利用者の側に在ることを前提とする（scribe2 は自分の憲法の条（C1・C5・N2）と自動の検査）。
  scribe2 の値は器の 9 形とする。そのうち節の記号・台帳 id・4 桁の判断の記録は形だけ認める形である。
  器の憲法の条と英字を含む規則の番号も、行き先が folio の置き場の外なので、M3 では形だけ認める形に置く。
  どの形をどちらの種に置くかの初版は、骨格の承認と同じ利用者の持ち主の裁定で決め、行に裁定 id と時刻を付ける（条 P-17.1）。
  形が重なるとき（例: 形だけ認める「R- と英数」と、骨格の行を解決する「R- と数」）にどちらを取るかの順は、値の欄の決まりとして、参照 id の形を読む便の設計ノートで決める（推奨 = 解決する形を先に試し、解けなければ形だけ認める形に倒す）。
  数と単位の読み方の 2 つの違い（複数形の字・全角の空白）は式の側の違いなので repo ごとの値にしない。どちらへ揃えるかは器の暫定の門を撤去する前に決める。
  揃える向きは、利用者（scribe2）が folio の読み（複数形の字を落とさない・全角の空白も 1 つ許す）に揃える（撤去の後は folio の読みだけが残るため・scribe2 の 2 周目の答え）。
  scribe2 の側の暫定の門を直すのは撤去と同じ便で行う。形だけ認める形の字の並びは、器の門の歯の 12 例（器の読み手の定数の例示）を fixture に写して、器の読み手と 1 字も違わないことを確かめる。
  この 2 つは、参照 id の形を行 R-16 から読む便（撤去の前提の便）の契約に書く。
  行 R-16 の注の「器の暫定の門と同じ式」はこの 2 つの違いと合わないので、参照 id の形を読む便（と同じ要件書の版の取り込み）で、裁定 id を付けて直す（条 P-17.1）。
  参照 id の形を行 R-16 から読む便は M3 の出口に要らない（M3 の 1 本目の文書は規範の印を持つ文が 0 本）。器の暫定の門の撤去の前提の便として置く。
  要件 FR12 の規範文（参照 id を 4 種に列挙）の直しは、この便と同じ要件書の版で行い、要件書の版 A には入れない。
  FR12 の文と実装が食い違う期間を作らないためで、「行 R-16 に形の欄が無ければ今の 4 形」の既定も置かない（欄が無ければ既定に倒れる形は、上で塞ぐと決めた形と向きが逆になる）。
  器の暫定の門を撤去する条件は、契約表を持つ利用者の設計文書が全部移り、かつ利用者の自動の検査が folio の床を撃つ（組み立ての版の固定の後）ことである。
  撤去は最後の .md の退役より前に置く（文脈 (7)）。撤去は M3 の出口の判定点に入れない。

  (7) 便の列と順序。判断の記録 ADR-15 の列（便 106〜116）と一括 14 の後に運ぶ（判断の記録の床の file の余地が ADR-15 の列で開くため）。
  要件書の版は 2 つに分ける。版 A は本判断の発効と同じ承認で出す = FR11 の保留の解除と、FR11 の契機を独立の命令に直すことだけ（FR12 の直しは決定 (6) のとおり参照 id の形を読む便の版）。
  版 B は ① の後に出す = M3 の範囲の節・骨格の命令と列の根の表と始まりの凍結の要件と受入基準（持ち主の承認）。
  ⑤ 導出物の独立の命令（床の定数の命令の名の直しを含む・中・1〜2 便）は版 A の後に起こし、① と並べて運んでよい（判定点 ②③ の律速）。
  ① 要件書の最上位の節の閉じた一覧に M3 の範囲の節を足す（小・1 便）→ 版 B
  → ② 列の根の表（写しは自分の行だけ）と始まりの凍結の命令（中・1〜2 便）→ ③ 値域の部分集合を床で数える（小・1 便）
  → ④ 骨格の命令・案内の 1 行・生成区間の注から条 id を外す・器の導出 file を版管理の根で解く〔床と面の生成器の 2 か所〕（中・1〜2 便）。
  ⑦ 列の根の表に利用者の行を足す便（小・1 便）は、利用者が骨格を書き、持ち主が骨格を承認し、始まりの凍結の命令で要約値を得た後に起こす。判定点 ① の手前の律速である。
  合計 7〜9 便（① 1・② 1〜2・③ 1・④ 1〜2・⑤ 1〜2・⑦ 1）。
  参照 id の形を行 R-16 から読む便（小・1 便・値の欄の閉じた一覧を含む）は M3 の数に入れず、器の暫定の門の撤去の前提の便として後に置く。
  利用者の側の便（読む file の述語・導出物の差分の歯・要件書の最小の写しの導出・暫定の門の撤去）は利用者が起こす。

options:
  - id: a
    name: 1 つの組み立てのまま、列の根を憲法の名ごとの表に広げ、値域と部品目録は道具の側に残す（採る）
    text: |
      M3 を契約表を持つ設計ノートだけに限る。列の根は道具の側の表に利用者の行を足し、始まりの凍結の輪は両方 0 本の置き場でだけ成り立つ命令で解く。
      憲法の値域と部品目録は道具の閉じた一覧のまま残し、値域は部分集合で比べる。骨格の命令で最小の置き場を書く。
    verdict: adopted
    reason: |
      実測で見つかった束縛のうち、利用者の合格を塞いでいるのは列の根・始まりの凍結の輪・器の導出 file の置き場の 3 つで、残りは雛形で足りる。
      列の根を道具の側に置いたままなので、検査される側の data で根を選び直せない（条 N-3.1 の物差しを満たす）。
      この守りは組み立ての取得と固定が利用者の手の届かない形で決まったとき（利用者の自動の検査で床を撃つ段）に限って、利用者から見て外側の証人になる（決定 (1) の前提）。
      それが決まる前の強さは、今の前の版の道具と同じである。
      値域を道具に残すので、面の名札の網羅と値の意味を持つ式を失わない。folio2 自身の値は 1 つも変わらない。
  - id: b
    name: 利用者ごとに定数を替えた別の組み立てを持つ
    text: |
      scribe2 用に、列の根・値域・部品目録を scribe2 の値にした別の組み立てを作り、scribe2 はそれを使う。
    verdict: rejected
    reason: |
      判定の式は同じでも、道具が 2 つになり、どちらの組み立てで検査したかが合否の一部になる。
      folio2 の変更のたびに 2 つを組み立てて配る費用が続き、片方だけ古い組み立てが残る。
      人が読むページを 1 つの生成器から出す条 P-2.1 とも、同じ内容を 2 面に人が持たない条 P-6.4 とも逆向きである。
      なお「どの版で検査したかが合否の一部になる」は採る案にも一部当たるので、採る案では版の固定を判定点 ① の前提に置いた。
  - id: c
    name: scribe2 の設計文書を folio2 の design-intent の中に置く
    text: |
      folio2 の repo の design-intent に scribe2 の設計ノートを置き、folio2 の床と列の根のまま検査する。
    verdict: rejected
    reason: |
      folio2 の開発を拘束するのは folio2 の設計文書であり（条 P-13.1）、他の repo の文書を足すと拘束の範囲が混ざる。
      契約表の要件の欄が scribe2 の要件を指すので、folio2 の参照 id の床の母集団を他の repo へ広げることになる（判断の記録 ADR-3 決定 (6) の反転）。
      器は導出物を消費側の repo の版管理から読むので（同 決定 (4)）、置き場とも合わない。
  - id: d
    name: 道具が器の設計文書の Markdown を直接読む
    text: |
      scribe2 の設計文書（docs/design の Markdown）をそのまま道具が読み、契約表の区間と散文を検査する。
    verdict: rejected
    reason: |
      文書の正本は YAML 1 file で、人が読むページはそこから生成する（条 P-6.1）。
      その書式の文章を読む口を足すと、同じ設計ノートの正本の形が 2 つになり、床の欄の決まりがその書式の書き方に開く。
      判断の記録 ADR-3 決定 (8) が「M1 で設計ノートの YAML 正本へ移す」と決めた向きの逆でもある。
  - id: e
    name: M3 を「scribe2 の設計文書を全部移す」にする
    text: |
      憲法・判断の記録・調べものの文書・語彙まで含めて、scribe2 の設計文書を全部 folio2 の形へ移す段を M3 とする。
    verdict: rejected
    reason: |
      判断の記録の欄の決まりは id の形と必須の欄（案・撤退条件・平易文・根拠）を持ち、凍結済みの判断を 1 字も変えずに写す欄が無い。
      憲法の条 id の形も違い、移すなら改番の論点（条 P-7.1）が出る。調べものの文書に当たる型は無い。
      どれも持ち主の裁定を要する別の論点で、要件書 CON8 が「最初は契約表を持つ設計文書だけ」と裁定済みである。
  - id: f
    name: 列の根を利用者の repo の data に置き、最初の凍結で自分で決める
    text: |
      列の根の要約値を床の定数から外し、利用者の repo の凍結 anchor の置き場の file に最初の凍結が書く。
      以後はその file を版管理の履歴の照合で守る。folio2 の値は歯の凍結の針に移す。
    verdict: rejected
    reason: |
      利用者ごとに folio2 の便が要らない利点はある。表に行を足しても他の利用者の写しが古くならない利点もある。
      しかし根を決めるのが検査される側の data になり、欄の決まりの file の先頭の注と判断の記録 ADR-2 決定 (3)(5) が挙げる
      「data 側で動かせない値」から列の根が外れるので、その注と決定の改訂が要る。
      守りは履歴の照合だけになり、履歴ごと作り直した写しを持ち帰る細工には外側の証人が無い。
      M3 の利用者は 1 つなので、表に 1 行足す費用の方が小さい。利用者が増えたときと、行の追加で他の利用者が落ちたときの撤退条件で見直す。
  - id: g
    name: 憲法の値域を実行時に利用者の憲法から読む
    text: |
      値域を組み立て時の型から外し、検査される repo の憲法の値域の節を実行時に読む。名札の表は既定の枝で受ける。
    verdict: rejected
    reason: |
      面の名札の表の網羅（値が変わったら組み立てが通らない）を失い、名札の無い値が既定の枝で黙って描かれる。
      強度の値に文末の極性の式が掛かるように、値の意味を式が持つ鍵があり、data で値を足しても式は意味を知らない。
      判断の記録 ADR-11 決定 (4)② が組み立て時の導出を選んだ理由（欄の決まりの木は組み立て時に決まる定数）とも衝突する。
      M3 は利用者の憲法を移さないので、今この費用を払う理由が無い。
  - id: h
    name: 支度表が「持たない」とした文書の検査を床が飛ばす
    text: |
      利用者の支度表で憲法や判断の記録を持たないと答えた repo では、正本 7 file のうち無い file と、それに掛かる検査を床が数えない。
    verdict: rejected
    reason: |
      検査される側の data で検査を外す口であり、条 N-3.1 の言う無効化の旗そのものになる。
      実行しなかった検査を「異常なし」と扱わない条 P-4.1 とも衝突する。最小の条と行を雛形で持てば同じ目的に届く。
  - id: i
    name: M3 で設計ノートの面の章の上限を緩める
    text: |
      利用者の設計文書は節が多いので、設計ノートの面の章の上限 12 を M3 の中で引き上げ、節をまとめずに移せるようにする。
    verdict: rejected
    reason: |
      上限に当たるから境界を動かす形は、器の行数の上限を境界の理由にしないと決めた判断の記録 ADR-15 の向きと逆である。
      面の見た目は M3 の範囲の外で、面の側の上限を変えるかは面の生成器の撤退条件（判断の記録 ADR-5）の側で問う論点である。
      上限はまず規則の表の行へ移す（判断の記録 ADR-11 決定 (4)⑦）。値を変えるのは、その行の裁定として別に扱う。
      導出物の口を配信の組み立てから切り離すこと（決定 (5)）を前提に、M3 の床と導出物は面を通らないので、上限は M3 の出口の判定点 3 つのどれにも効かない。
      この前提が無いと、導出物は章の上限を超える文書で作れず、この理由は成り立たない。
  - id: j
    name: 散文の門の参照 id の形を folio2 と器の和集合 1 つにする（改訂 a の案）
    text: |
      参照 id の形の一覧を行 R-16 の値へ移し、値を folio2 と器の形の和集合にして、folio2 の置き場にも利用者の置き場にも同じ値を置く。
    verdict: rejected
    reason: |
      scribe2 の設計文書で規範の印を持つ文は 1 文だけで、今の folio2 の形で通るので、M3 に要らない（grill の実測）。
      folio2 の門に節の記号と台帳 id を足すと、散文から散文や台帳を指すだけで規範の文が門を通り、条 N-2.2 の仕組みが空になる（条 P-5.4）。
      和集合は器の条の形・4 桁の判断の記録・英字を含む規則の番号を含まず、器の形の和にもなっていなかった。
      今の folio2 の門は参照 id を解決しているので、解決しない形を足すと門を緩める 2 つ目の変更になる。

  - id: k
    name: 配信の組み立てが上限を超える面だけを飛ばし、残りと導出物を書く
    text: |
      導出物を配信の組み立て（folio build --check）の中に置いたまま、面を導出できない設計ノートの面だけを飛ばして、残りの面と導出物を書く。
    verdict: rejected
    reason: |
      配信の組み立ての全部か無しかは、実行できなかった結果を「異常なし」と扱わない条 P-4.1 の実装である。
      面を飛ばすと、飛ばしたことを「まだ分からない」で表に出しても、配信先には一部だけ新しい束が残る。
      導出物を独立の命令にすれば、面を作らずに同じ目的に届く（決定 (5)）。
      導出物の置き場は消費側の repo の版管理で（判断の記録 ADR-3 決定 (4)）、配信の組み立ての出力先（配信先の場所）とは違う。

basis: [P-2, P-4, P-5, P-6, P-7, P-8, P-10, P-11, P-12, P-13, P-17, A-2, N-1, N-2, N-3, R-2, R-4, R-7, R-8, R-16, R-17, D-11, FR3, FR10, FR11, FR12, FR13, NFR1, CON8, ADR-1, ADR-2, ADR-3, ADR-5, ADR-6, ADR-9, ADR-11, ADR-15]

revises:
  - {target: ADR-2, decision: (3), kind: widen, summary: 列の根の anchor の要約値と一致させる床の定数を、folio2 の憲法の値 1 つから、検査される置き場の憲法の名で引く要約値の表へ広げる（最初の版は全行で今の値のまま・folio2 の行は変えない）}
  - {target: ADR-3, decision: (7), kind: widen, summary: 参照 id の形の一覧（条・rules 行・要件・契約の 4 種）を、検査される置き場の行 R-16 の値（道具の閉じた一覧から選び、形ごとに解決か出所の印かを持つ）へ広げる。folio2 の値は 4 種のまま・解決の母集団は変えない}

consequences:
  - 判断の記録の欄の決まりの file の生成区間のうち、列の根の欄の形が「値 1 つ」から「表」に変わる。folio2 の行の値は変わらない。
    列の根の表の写しは全利用者の欄の決まりの file の生成区間に載る。表に行を 1 つ足した組み立てを使うと、他の全利用者の床は自分の中身と関わりなく
    不合格になり、folio schema --write で写しを書き直すまで戻らない（写しの 1 字の違いを床が落とすため・grill の実測）。
    決定 (2)(ア) は写しを置き場の名の行だけにするので、この結合は消える（自分の行だけにしない形にしたときに、この帰結が生きる）。
  - 列の根の表を引く鍵（憲法の meta.id）は凍結 anchor の要約値の外に在る。meta.id を書き換えると照合する行が替わって床が落ちる。
    また表が証するのは列の根の中身であり、どの repo の列かは証さない。
  - 列の根の表に利用者の骨格の要約値が載るので、骨格の第 1.0 版の中身は、表に行を足した後は変えられない。
    利用者の持ち主が骨格を承認する前に、骨格の条と行の本文を決めきる必要がある。
  - 利用者の repo には、利用者の本来の憲法（前の版の文書）とは別に、床の受付の宣言（骨格）が並ぶ。骨格の条は本来の憲法の条と中身が重なる
    （scribe2 では承認の対話面と散文にしか無い規則の条（C7・N2））。重なりは、骨格の規範文が本来の条を番号で指す形で表す（決定 (3)）。
    骨格が縛る範囲を folio の置き場の運用に限ることは、今の縛る相手の値域では型付きの値にできない。
    これを受けるかは、骨格の命令の便の前に利用者の持ち主の裁定に回す（scribe2 は「憲法の改訂ではない・folio2 が読む型付きデータの初版」として持ち主に出す）。
  - 憲法の欄の決まりには条の廃止の欄が無いので、骨格の条は列の根に載った後は外せない。
    利用者の本来の憲法を移した後も骨格の条は残り、移す条の番号は骨格の条の後から振ることになる。条の廃止の機構は台帳 f2-648.100 が別に扱う。
  - 例外の口を足さない条（folio2 の条 N-3 に当たる）について、scribe2 は置かない（条 1 本）を推奨すると表明済みである
    （scribe2 の憲法に 1 対 1 で当たる条が無く、近い条（C1・C5）は別物で、条は後から外せないため）。
    裁定は、骨格の命令の便（便 ④）の前に scribe2 の持ち主が行う（決定 (2)(オ) は変えない）。
  - 同じ repo に判断の記録の番号空間が 2 つできる（前の版の 4 桁の番号と、骨格が書く folio の番号）。字面は違うが、人が読むと取り違えうる。
  - 値域の比べ方を部分集合にしたので、folio2 が値域に値を足しても利用者の床は変わらない。
    folio2 の憲法の値域から値を外すか名を変えると、その値を置き場の値域に持つ全利用者の床が「まだ分からない」に落ち、戻すには各利用者の憲法の改訂が要る。
  - 利用者の repo は、要件書として利用者の要件の最小の写し（前の版の要件書からの導出物）を持つ。写しの範囲は、移した設計ノートの契約表が指す要件と、散文の門が解決する参照 id が指す要件だけとする
    （全部を写すと語彙に無い英字の語の登録から始まり、1 本目の便が語彙の便に化ける）。写しの導出は利用者の側の便である。
  - 利用者の repo は図の道具も様式の file も持たない。設計ノートに図を置くと床は型だけを見るが、面の生成は M3 の外なので描かれない。
  - 利用者の置き場の行 R-16 は利用者の形を持つので、同じ道具でも repo によって参照 id と認める形が違う。folio2 の門の値は変わらない。
    形だけ認める形の id しか持たない規範の文は門を通る。folio の床はその文の規範の効力を確かめず、確かめる層は利用者の側に在る
    （scribe2 は自分の憲法の条（C1・C5・N2）と自動の検査・決定 (6)）。
  - 要件 FR12 の規範文は参照 id を 4 種に列挙しているので、参照 id の形を行 R-16 から読む便と同じ要件書の版で、行 R-16 の値の形を指す書き方に改める（版 A には入れない）。
  - 要件 FR11 の契機と設計ノートの欄の決まりの床の定数の命令の名が、配信の組み立てから独立の命令へ替わる。配信の組み立ての振る舞いは変わらない。
  - 本判断は条文を改訂しない。規則の表の行は足さない。行 R-16 の値の欄の改訂は、参照 id の形を読む便のときに行う（列の根の表は実装の型付きの定数で、写しは生成区間に置く）。

retreat:
  kind: measure
  condition: |
    (1) 洗い出しの漏れ。数えるのは folio2 の席で、利用者の repo を読み取りだけで撃って数え、台帳 f2-648 へ記帳する
    （利用者の席は folio2 の台帳に書けないので、利用者の台帳の記録は id で名指して写す）。
    窓は、本判断の便が揃った後から M3 の出口（判定点 ③）までとする。
    利用者の repo で床が「まだ分からない」か違反を出したうち、原因が利用者の中身でなく道具に焼かれた folio2 専用の値であるものを、
    （検査の種別・判定・対象の path・原因の種類）の 4 つ組で記帳し、原因の種類ごとに数える。
    本判断の文脈 (2)(3) の (ア)〜(キ) の 7 つに無い種類が 3 つに達したら、決定 (2) の扱いを捨てて洗い出しからやり直す判断の記録を起こす。
    骨格が組み立てた版の値域で書かれている間は、値域のずれの「まだ分からない」は起きないので、この数えに入れない。

    (2) folio2 自身の値の変化。本判断の便のどれかの着地の後に、folio2 自身の置き場の床の結果（合否・違反と「まだ分からない」の件数）か、
    列の根の表の folio2 の行か、組み立てた憲法の値域か、folio2 の行 R-16 の値が、着地の前と違っていたら、その便を戻して決定 (2) の該当する項を捨てる。
    数えるのは取り込みの審査で、1 回で発動する。

    (3) 別の組み立てと結合。利用者が道具の値域の外の値か、部品目録の外の部品を要り、別の判断の記録を起こすまで待てないと
    持ち主が判じた記録（台帳の逐語）が在る回が 2 回に達したら、決定 (2)(ウ)(エ) を捨てて、repo ごとの値域と部品の形を比べる判断の記録を起こす。
    利用者が増えて列の根の表に folio2 以外の行が 3 行に達したときも、案 f と比べ直す判断の記録を起こす。
    列の根の表の行の追加か組み立てた値域の変更だけを理由に、利用者の床が不合格か「まだ分からない」に落ちた回が 2 回に達したときも、
    案 f と repo ごとの値域の形と比べ直す判断の記録を起こす。数えるのは folio2 の便を取り込む審査で、台帳 f2-648 へ記帳する。

    (4) 数えられない回が 2 回を超えたら、本判断の撤退条件の判定を「まだ分からない」に落として持ち主へ渡す。
    「同じ」とみなすのは（撤退条件の番号・数えられなかった理由・対象の便）の 3 つ組が一致する回である。
    この 2 回は本判断が自分で置く数で、規則の表の行 R-7 の繰り返し上限とは母集団が違う。

