  列の根の表と値域が道具の組み立ての中に在るので、合否はどの組み立てで検査したかで変わりうる、だから組み立てを特定しないとその合否を確かめ直せない、という意味である（天井の 29 周目 読みやすさ F-3）。
  同じ決定の作業場の言い方は、撃つ = 床の検査を動かす、記帳 = 台帳に書く、s2- の項 = scribe2 の台帳の項、である。要件書の M3 の範囲の節は第 1.35 版から第 1.37 版までこの決定を開いた字で写していたが、
  第 1.38 版でこの決定 (1) を指すだけの節に改めた（天井の 30 周目 整合 F-6・写しを人が 2 面で保たない）ので、開いた読み方をここに置く。決定の字は変えない。
  【天井の 31 周目の所見への応答（一括 18・2026-09-24 起草・持ち主の承認 2026-09-24 21:33 JST「すべて承認する」）】平易文の (3) の「2 つがどちらも無いときにだけ使える命令」は、決定 (2)(イ) と要件 FR24 が始まりの凍結に置く前提のうち、
  その 2 つの基準の不在を除くすべての検査が違反 0 で「まだ分からない」も無いこと、を落としていた（天井の 31 周目 忠実さ F-1）。平易文だけを読むと、断る場合が 1 つ見えなかった。
  平易文を「2 つがどちらも無く、ほかの検査にも引っかかりが無い（違反も「まだ分からない」も無い）ときにだけ」の形にした。命令の中身と義務の向きは変えない。見出し・文脈・決定・案・帰結・撤退条件・承認欄の字は変えない。
  【判断の記録 ADR-21 による改訂（2026-09-24 発効・持ち主の承認 22:38 JST「承認する」）】scribe2 の設計文書を folio2 の形へ移す段は、2026-09-24 に scribe2 の持ち主の裁定で取りやめになった（scribe2 の台帳 s2-07l.214 notes・folio2 の控え 台帳 f2-648.188）。
  決定 (1) の「外部の利用者 1 つ（scribe2）」は、判断の記録 ADR-21 の改訂の欄（狭める向き）で、器の次の世代（scribe v3）の設計の置き場（新しい置き場（scribe3）の design-intent）と読む。判定点 ①〜③ はその置き場で数え、判定点 ③ の記帳は読んだ器の組み立てを名指す。
  v3 の置き場を外部の利用者と数えるのは、folio の実装を持つ repo と別の repo に在り、憲法の名が folio2 の憲法の名と違うあいだに限る（v3 の合流先は新しい repo で、folio の実装は後から取り込む・ADR-21 の承認の問 2）。
  決定 (3) の scribe2 の置き場と骨格の宣言の形は、同じ repo に本来の憲法を別に持つ利用者に限る。決定 (6) の scribe2 の値・器の暫定の門の撤去の条件・参照 id の形を行 R-16 から読む便・要件 FR12 の規範文の直しは閉じた。
  決定 (7) の便の列から scribe2 の側の便を外し、⑦ の利用者を v3 の置き場と読む。撤退条件 (1) の窓の起点は、v3 の置き場が立った時点（版 5091abb・2026-09-24 17:45:49 JST）と読む（ADR-21 決定 (5)）。撤退条件 (2)〜(4) は字のまま数え、利用者を v3 の置き場と読む。
  決定の本文は発効した判断の記録の字なので書き換えず、改訂の欄は ADR-21 の側に在る（判断の記録の欄の決まりのとおり片側だけ）。見出し・文脈・決定・案・帰結・撤退条件・承認欄の字は変えない。
  【天井の 32 周目の所見への応答（一括 19・2026-09-24 起草・持ち主の承認 2026-09-25 07:03 JST「すべて承認する」）】平易文の末尾の読み方の段は、判断の記録 ADR-21 の読み替えを限定なしで「この判断の「scribe2」」の全体に掛けていたので、平易文の (4) の置き場（design-intent/folio2）と「床の受付の宣言」の形まで v3 に当たると読め、ADR-21 決定 (2) と改訂の欄（決定 (3) を狭める向き）と逆になっていた（天井の 32 周目 忠実さ F-1・止める・反証 支持）。
  段を、読み替えるのは道具を試す相手（決定 (1) の外部の利用者）だけで、置き場と宣言の形は同じ repo に本来の憲法を別に持つ利用者に限り、v3 の置き場の場所は v3 が選び、骨格の憲法は v3 の憲法そのもので v3 の持ち主が書き換えてから承認する、の字にした。判定点 ③ の記帳に読んだ器の組み立てを名指すことも添えた。
  あわせて、注 (f) の「器の今の読み手は欄 goal を未知の key として表ごと断る」「判定点 ③ は器の受け口の着地が要る」は、受け口の着地の前（2026-09-24 の朝）の字である。受け口は契約 s2-07l.586 として scribe2 の本流の版 0337cf1（2026-09-24 07:40 JST）に着地し、判定点 ③ の前提は満たされた。判定点 ③ の測定値は今も、器の受付が導出物を読んで通した利用者の台帳の記帳である（要件 FR11 の注・判断の記録 ADR-21 文脈 (3)・天井の 32 周目 実態 F-3）。
