id: ADR-25
title: 天井の門は、渡された場所が設計文書の置き場でない（すぐ下に憲法の正本の file constitution.yaml が無い）ときも、照らせないときと同じく まだ分からない を返す — 判断の記録 ADR-24 の決定 (1) を狭める

status: accepted
date: 2026-09-26

plain: |
  天井の門は、設計文書を書き換える便を器に出してよいかを「通す・止める・まだ分からない」で答える仕組みです。
  判断の記録 ADR-24（9 月 26 日の朝に発効）は、門の最初の分かれ道「書き換える file の一覧に設計文書の置き場の file が 1 つも無ければ通す」を、一覧と置き場を同じ起点（門を実行する場所）から照らし合わせられるときに限りました。
  照らし合わせられない形を 1 番目の決定に全部並べ（ほかの形は無いと決め）、それ以外のときの答え方は変えないと決めています。

  同じ日の昼に、門のもう 1 つの穴を直しました（便 150）。門に渡す設計文書の置き場の場所を間違えたとき（名前の打ち間違いや、置き場の中の別の場所を渡したとき）、門はそれを確かめず、設計文書を書き換える便でも黙って「通す」を返していました。
  直した後の門は、渡された場所のすぐ下に憲法の正本の file（constitution.yaml）が無ければ「そこは設計文書の置き場でない」とみなし、file が在るか無いかを決めずに「まだ分からない」と答え、実行し直す場所を添えます。
  書き換える file の一覧が実装の file だけでも「まだ分からない」です。

  ところが、この動きは ADR-24 の 1 番目の決定の一覧にありません。字だけを読むと、置き場でない場所を渡しても、実装の file だけの一覧なら「通す」と約束していると読めます。
  一括 25 の起草は、この差を要件書の注に「渡された場所が置き場であることを、決まりの文が当然の前提にしている」と断り書きを足すだけで済ませました。天井の 43 周目は、文書どうしの整合と実態との整合の 2 つの観点でこれを「止める」と指摘し、反証でも支持されました。
  判断の記録の書き方の決まりでは、発効した決定の範囲を後から変えるときは、変える側の記録の「改訂の欄」に書きます。注に断りを書くだけでは直したことになりません（ADR-24 のときと同じ理由です）。

  この判断では、ADR-24 の 1 番目の決定の「照らし合わせられない形」に、「渡された置き場のすぐ下に憲法の正本の file が無い（置き場でない）」を足します。
  そのときも file が在るか無いかを決めずに「まだ分からない」と答え、実行し直す場所を添えます。判定できない所で通さない、という憲法の条（P-4.1・P-4.2）に沿う形です。
  置き場のしるしを憲法の正本の file にした理由（機械の床が最初に読み、置き場を作るときに最初に書く file だから）も、この判断に書きます。
  照らし合わせられるときの答え方（無ければ通す・在れば印を見て 3 通り）は変えません。

  機械はすでにこの形で動いているので、機械を直す便はありません。ADR-24 の決定の文そのものは書き換えず、この判断の改訂の欄で狭めます。ADR-24 の注には、この判断を指す 1 段を置くだけです。
  ただし ADR-24 は「同じ食い違いが周でまた止められ、反証でも支持されたら、決定の文を書き換える案も含めてあなたに問う」とやめる条件に書いていました。今回がその 1 件目なので、書き換える案も並べて問います。

  残る小さな穴も書きます。憲法の正本の file を持つ別の置き場（試験用の写しなど）を渡すと、門はそこを置き場と読み、「通す」を返すことがあります。塞ぐには門が「どの置き場のつもりか」を推し量ることになるので塞がず、門を実行する場所と、門に渡す置き場の場所の書き方は、席（AI が作業する場所）の手順で守ります。

context: |
  (1) 出所。天井の 43 周目（一括 25 の枝 20606f1 の上・2026-09-26）の 2 件で、どちらも重さ 止める・反証 支持である。
  文書どうしの整合の所見 1（F-1・場所は要件 FR20 の注）の要旨は、要件 FR20 の注（第 1.47 版の起草の段）が、置き場でない置き場の path では書き換える file の一覧が実装の file だけでも門が 2（まだ分からない）を返すと書き、それを「規範文の前提と読む」読み方と判断の記録 ADR-24 決定 (2) で支えるが、
  ADR-24 決定 (1) は照らせない形を閉じた列で定め「照らせるときは決定 (5) の式のとおり（無ければ 通す…）で、変えない」と書くので、同じ入力に判断の記録は 0、要件書の注は 2 を答える、である。
  実態との整合の所見 1（F-1・場所は ADR-24 の決定）の要旨は、便 150 の後の門（本流 2765cd8）が、打ち間違いの置き場の path と実装の file だけの一覧に 2 を返す（反証役の実測）のに、ADR-24 決定 (1) の字ではその入力は照らせる側で 0 を約束する、である。
  2 件の反証はどちらも支持で、退けた読みは「照らす の普通の意味では、置き場でない path に一覧を照らせないので、ADR-24 の範囲に収まる」「ADR-18 決定 (5) の設計文書の置き場の file は置き場が在ることを前提にする」である（決定 (1) と改訂の欄の要旨が照らせない形を列挙で閉じ、決定 (0) が範囲を狭めることだけを決めると閉じているので、正本の字がその読みを支えない）。
  文書どうしの整合の所見 1 は ADR-24 の撤退条件 (2)（本判断の発効の後の周で、門の「無ければ 通す」の範囲について要件 FR20 と ADR-18・ADR-24 の間の文書どうしの整合の 止める が反証で支持されたら数え、1 件で持ち主へ問う）の 1 件目に当たり、実態との整合の所見 1 はそれに添える材料である（ADR-24 の撤退条件 (2) は文書どうしの整合だけを数える）。
  (2) 実装。便 150（台帳 f2-648.224・2026-09-26 着地・本流 2765cd8・契約 docs/design/delivery-150.md 行 ew）は、門の実装の最初の根の突き合わせ（便 142）の直後に、門に渡された置き場の path が置き場かの確かめを置いた。
  置き場の path の直下に憲法の正本の file（constitution.yaml）が file として無ければ、まだ分からない と、置き場でない旨と撃ち直し方（作業ツリーの一番上から撃つ）の理由の行を返す。書き換える file の一覧が実装の file だけでも同じである。
  便 150 の契約 §1 (a) の 5 と §1 (i) の 1 は、この まだ分からない を ADR-24 決定 (2) の「判定が実行できないとき」の族に置き、字どおりの読み（0）より厳しい側と断り、規範文か注へ上げるかを次の一括の材料として控えた（台帳 f2-648.224・f2-648.226）。
  (3) 一括 25 の起草の経緯。一括 25 の起草（2026-09-26・枝 docs/batch25）は、この差を要件 FR20 の注に「置き場であることを規範文の前提と読む」と断り、規範文・確かめ方・受入基準 AC18 の 8 場合は変えない形を推奨し（仕分けの判定 6）、同じ仕分けの迷った点 1 で次の周が拾う見込みを自ら挙げていた。
  注で断る形は、判断の記録 ADR-22 が退けた案 c と ADR-24 が退けた案 b と同じ形で、席は同じ形を再び採り、43 周目がそれを拾った。
  (4) 口の決まり。判断の記録の欄の決まり（design-intent/adr/schema.yaml の revises_note）は、発効した判断が生きたまま、その決定の範囲が別の判断で変わるときの口を改訂の欄（revises）に置く。
  ADR-24 は生きており、決定 (1) の照らせない形と照らせるときの式は、本判断の後も変わらない。ADR-24 自身が ADR-18 決定 (5) を改訂の欄で狭めた先例で、ADR-20・ADR-22 も同じ形である。

decision: |
  (0) 本判断は条文を改訂しない。規則の表の行を足さない。便を起こさない（実装と歯は便 150 で既に本判断の形である）。決めるのは、判断の記録 ADR-24 の決定 (1) の照らせない形の列に、置き場でない形を足すことだけである。
  ADR-24 の決定 (0)(2)〜(4) と、決定 (1) の照らせない形（置き場の path が門を撃つ場所の下に無い・一覧に同じ根からの相対で読めない path が在る）と照らせるときの式は変えない。ADR-18 の決定は本判断では改訂しない（ADR-18 決定 (5) を狭めるのは ADR-24 の改訂の欄で、本判断はその照らせない形の列を足す）。

  (1) **置き場でない置き場の path を、照らせない形に足す（ADR-24 決定 (1) を狭める）。**
  門は、ADR-24 決定 (1) の同じ根の確かめの後に、門に渡された設計文書の置き場の path が置き場かを確かめる。
  置き場の path の直下に憲法の正本の file（constitution.yaml）が file として無ければ、そこは設計文書の置き場でないので、書き換える file の一覧を置き場と照らせない。
  そのときは ADR-24 決定 (1) の照らせない形と同じく、設計文書の置き場の file の有無を判定せず まだ分からない（2）とし、置き場でない旨と撃ち直し方（作業ツリーの一番上から撃つ）を理由の行に出す。実装の file だけの一覧でも まだ分からない（2）である。
  置き場の path が門を撃つ場所の下に無いときや一覧に照らせない path が在るときは、ADR-24 決定 (1) の確かめが先に当たり、その理由の行を出す（答えは同じ まだ分からない）。
  置き場の目印は憲法の正本の file とする。床（folio check）が最初に読み、置き場を作る命令（folio init）が最初に書く正本で、置き場を置き場たらしめる file として床と揃う。
  天井の正本の file（ceiling.yaml）は門自身の入力なので採らない（天井の正本が無い置き場の まだ分からない の理由が「置き場でない」に変わり、天井の正本が読めないときと区別できなくなる）。
  入口の正本の file（index.yaml）は、置き場の下の凍結 anchor の置き場にも同じ名の file（anchor の索引）が在り、そこを置き場と読むので採らない。
  目印の file の名の正本は実装の型付きの定数で、本判断はその選び方を判断として持つ。目印の file の中身は読まない。
  置き場の path の直下に憲法の正本の file が在るときは、ADR-24 決定 (1) の照らせるときと同じく、ADR-18 決定 (5) の式のとおり（無ければ 通す・在るときの 3 値と、「まだ分からない」が「不合格」より先に立つ順序）で、変えない。

  (2) **条との関係。** 置き場でないときの まだ分からない は、判定を実行できない所を通すことにも止めることにもしない、条 P-4.1・P-4.2 の当てはめである。
  ADR-24 決定 (2) の族（照らせないとき・印が読めない・天井の正本が読めない・引き金の要約値が測れない・印の節点の表が読めない など）と同じ扱いで、3 値の意味は変わらない。

  (3) **要件書との関係。** 要件 FR20 の第 1.47 版の規範文と確かめ方、受入基準 AC18 の 9 つ目の場合（渡された設計文書の置き場が置き場でない）が本判断の (1) を写す。
  要件書の第 1.47 版と本判断は同じ承認要求で問う（一括 25）。どちらか一方だけを発効させると、要件書と判断の記録の食い違いが残る。

  (4) **発効した決定の本文は書き換えない。** ADR-24 の見出し・文脈・決定・案・帰結・撤退条件・承認欄・改訂の欄の字は変えない。範囲の改訂は本判断の改訂の欄が持ち（欄の決まりのとおり改訂する側の片側だけ）、
  ADR-24 の注に 1 段で本判断を指す。注は範囲の改訂の口にしない。

options:
  - id: a
    name: 改訂の欄で ADR-24 決定 (1) を狭め、決定の本文は書き換えず注で本判断を指す（採る）
    text: |
      決定 (0)〜(4) の形。小さい判断の記録 1 本の改訂の欄に 1 行（ADR-24 決定 (1)・narrow）を置き、ADR-24 の注に本判断を指す 1 段を置く。
      要件 FR20 の規範文・確かめ方・受入基準 AC18 に置き場でない形（9 つ目の場合）を写し、要件書の第 1.47 版と同じ承認で発効させる。
    verdict: adopted
    reason: |
      判断の記録の欄の決まりの改訂の欄は、発効した判断が生きたまま、その決定の範囲が別の判断で変わるときの口である。ADR-24 は生きており、決定 (1) の照らせない形も照らせるときの式も生きている。
      ADR-24 が ADR-18 決定 (5) を、ADR-20 が ADR-18 の決定 (1)(2) を、ADR-22 が ADR-3 決定 (8) と ADR-16 決定 (1) を改訂の欄で解いた先例と揃う。43 周目の 2 件の反証が支持した読み（注では狭められない）にも正面から答える。
      中身は便 150 が既に実装し歯が確かめている振る舞いで、新しい向きを足さない。費用は判断の記録 1 本と注 1 段と、要件書の規範文・確かめ方・受入基準の 1 形 1 場合である。
  - id: b
    name: 注だけで断る（改訂の欄を使わない・一括 25 の起草の形）
    text: |
      判断の記録を起こさず、要件 FR20 の注に「置き場であることを規範文の前提と読む」と断り、規範文・確かめ方・受入基準 AC18 の 8 場合は変えない（一括 25 の起草と改訂 b の形）。
    verdict: rejected
    reason: |
      判断の記録の欄の決まりは、範囲を変える口を改訂の欄に置き、注を範囲の改訂の口にしない。ADR-22 は同じ形の案 c を、ADR-24 は案 b を退けた。
      43 周目の 2 件の反証は、この形を「判断の記録は 0、要件書の注と実装は 2」として支持の側に数えた。同じ注の字で次の周を回しても、同じ所で止まる見込みが高い。
  - id: c
    name: 実装を便 150 の前の形へ戻す
    text: |
      門は置き場かを確かめず、置き場でない置き場の path でも一覧の file の有無を判定する形（ADR-24 決定 (1) の字どおり）へ実装を戻し、要件 FR20 の注の便 150 の段を外す。
    verdict: rejected
    reason: |
      便 150 の前の門は、置き場の場所の渡し間違いのとき、設計文書を書き換える便にも 0（通す）を黙って返していた（台帳 f2-648.224・天井の 41 周目 実態 F-1・判定できない所で通すので条 P-4.1 に反する）。戻すとその穴が開き直る。
      置き場でない所で file の有無を判定するのは、置き場と照らさずに数えることで、判定の材料が無い所で答えを出すことになる（条 P-4.2）。
  - id: d
    name: ADR-18 決定 (5) か ADR-24 決定 (1) の本文を、置き場でない形を含む字へ書き換える
    text: |
      発効した決定の字に「置き場でないとき」の前提とそのときの まだ分からない を書き足し、注に書き換えの記録を置く。
      ADR-24 の撤退条件 (2) は、同じ範囲の整合の 止める が反証で支持されたら、この案を含めて持ち主に問うと定めており、本判断の承認要求はこの案を持ち主が選べる代替として並べる。
    verdict: rejected
    reason: |
      発効した判断の記録の決定の字は、当時の決定の記録なので書き換えず、範囲の変更は別の判断の改訂の欄で持つ（判断の記録の欄の決まり・ADR-20 案 f・ADR-22 案 d・ADR-24 案 d を退けた理由と同じ）。
      書き換えると、決定を読んだ過去の周の所見と承認の逐語が、今の字と合わなくなる。
      今回の止めるは、改訂の欄の形が働かなかったからではなく、一括 25 の起草が新しい形を改訂の欄でなく注で運んだ（案 b の形を採った）ことから立った。改訂の欄の形は 37 周目の同じ種類の食い違いを 38〜42 周目で閉じている。
      ただし、同じ範囲に改訂の欄が 2 段（ADR-18 決定 (5) → ADR-24 → 本判断）重なり、読み手が 3 本をたどることになる。持ち主が読みやすさを重く見るなら、この案を選ぶ道がある。

