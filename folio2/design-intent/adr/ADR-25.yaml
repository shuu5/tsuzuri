revises:
  - {target: ADR-24, decision: (1), kind: narrow, summary: 照らせない形の閉じた列に、置き場の path の直下に憲法の正本の file（constitution.yaml）が file として無い形（置き場でない）を足し、そのときも設計文書の置き場の file の有無を判定せず まだ分からない（2）として理由の行に撃ち直し方を出す（実装の file だけの一覧でも 2・照らせるときの「無ければ 通す」の範囲を狭める・便 150 の実装・要件 FR20 第 1.47 版）}

consequences:
  - 要件 FR20 の規範文と確かめ方と受入基準 AC18 の 9 場合（第 1.47 版）と、判断の記録 ADR-24 の決定 (1) の読みが揃う。ADR-24 の決定 (1) の字は残り、置き場でない形の読み方は本判断の改訂の欄と ADR-24 の注の 1 段が持つ。
  - 門の振る舞いは変わらない（便 150 の実装のまま）。置き場の path の直下に憲法の正本の file が無いと、書き換える file の一覧が実装の file だけでも まだ分からない になる。席の受付は行 D-12 の門を作業ツリーの一番上から撃ち、置き場の path は設計文書の置き場を渡す。
  - 残る穴は塞がない。憲法の正本の file を持つ別の置き場（試験用の写しなど）を渡すと、門はそこを置き場と読み、書き換える file の一覧がその下に無ければ 通す（0）を返しうる。目印の file の中身は読まず別名の file（symlink）も辿るので、別名の目印や中身の壊れた目印でも置き場と読む（中身の壊れは引き金の要約値の測りと床が見る）。塞ぐには、一覧がどの置き場を指すかを門が推し量ることになり、便 142 の契約 §1 (d) の 2 が退けた形になる＝門は置き場の同一性を推し量らない。撃つ場所と置き場の path の字は席の手順が守る。
  - 本判断の発効は、判断の記録の状態の欄として周の引き金を動かす（どの判断の記録の発効も同じ）。便は起こさない。
  - 要件書の版は一括 25 の第 1.47 版で上がる（本判断のための版上げは無い）。要件 FR20 の判断の記録の欄に本判断を足すのは、承認の後に席が書く（承認の後の欄）。
  - 天井の 43 周目の文書どうしの整合の所見 1（F-1）と実態との整合の所見 1（F-1）は、本判断の発効で解く。文書どうしの整合の所見 1 を ADR-24 の撤退条件 (2) の 1 件目として席が台帳に数え（実態との整合の所見 1 は添える材料）、本判断の承認要求で案 d を並べて問うた（持ち主は案 a）。ADR-24 は本判断の発効の後も生きる。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 の notes に記帳する。数える期間は本判断の発効の時刻から 14 日とする（(2)(3) は期間を切らない）。
    (1) 置き場でないことで止まった正しい便: 席の受付か一括の段取りで門が置き場でない理由で まだ分からない を返し、
    作業ツリーの一番上から設計文書の置き場を渡して同じ一覧で撃ち直すと 通す（0）になった回を数える。数える口は、席が台帳 f2-648 の notes に写した門の理由の行の字である（写していない回は数えない）。
    期間の中で 3 回になったら、置き場の目印の選び方か、置き場の path を字面でなく解いて置き場へ写し直す形を持ち主に問う。撃ち直しの手間が、置き場でない所で通さない効き目より重いかを問う材料にする。
    (2) 食い違いが残る: 本判断の発効の後の周で、門の「無ければ 通す」の範囲について、要件 FR20 と判断の記録 ADR-18・ADR-24・本判断の間の文書どうしの整合か実態との整合の 止める が反証で支持されたら数える。
    1 件で本判断の形が失敗したとみなし、その周の所見を添えて持ち主へ問う（ADR-18 決定 (5) か ADR-24 決定 (1) の本文を書き換える案 d を含めて）。
    (3) 数えられない回（台帳が読めない・周の所見が読めない）が規則の表の行 R-7 の回数を超えたら、本判断の撤退条件の判定を「まだ分からない」に落として持ち主へ渡す（条 P-4.2）。
    「同じ」とみなすのは（撤退条件の番号・数えられなかった理由）の 2 つ組が一致する回である。

