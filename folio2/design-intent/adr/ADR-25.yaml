note: |
  【出所】天井の 43 周目（一括 25 の枝 20606f1 の上・2026-09-26）の整合 F-1 と実態 F-1（どちらも止める・反証 支持）。席の裁定（2026-09-26）は、反証の支持を受けて判断の記録を起こし、ADR-24 決定 (1) を改訂の欄で狭めること、
  一括 25（要件書 第 1.47 版）と本判断を同じ承認要求（🔴 問 1 = 天井の正本 第 0.16 版・問 2 = 要件書 第 1.47 版と行 D-12 の注・問 3 = 本判断の発効）に束ねること（先例 = 一括 23 と ADR-24・天井の 37 周目）である。
  2 件のうち文書どうしの整合の 1 件が ADR-24 の撤退条件 (2) の 1 件目（実態の 1 件は添える材料・撤退条件 (2) は文書どうしの整合だけを数える）で、席が台帳 f2-648 の notes に数え、問 3 に案 d（決定の本文を書き換える）を代替として並べた。
  【起草の経緯】一括 25 の起草（2026-09-26）は、仕分けの判定 6 で「--dir が置き場であること」を規範文の前提と読む断りを要件 FR20 の注に置き、規範文へ上げる形を 🔴 問 2 の代替案 (B) に回していた（迷った点 1 で次の周が拾う見込みを挙げていた）。
  43 周目の整合と実態がこの形を 止める で拾って反証が支持したので、席は裁定を改め、本判断を起草し、要件 FR20 の規範文へ置き場でない形を上げた（代替案 (B) の字）。
  【実装と歯の在り処】門の実装は crates/folio/src/gate.rs の run（根の突き合わせの直後に is_place を確かめる）・is_place（--dir の直下に PLACE_MARK が file として在るか）。理由の字は定数 UNKNOWN_NOT_A_PLACE と FROM_THE_TOP、目印の file の名は定数 PLACE_MARK（= constitution.yaml・crates/folio/src/check.rs の FILES の先頭に .yaml を足した字）。
  歯は crates/folio/src/gate.rs の単体の歯 f150_the_place_is_a_dir_with_the_mark と、crates/folio/tests/gate.rs の f150_the_gate_is_unknown_when_the_dir_is_not_a_place（打ち間違い・置き場の下の dir・空の dir・file・絶対 path の 5 通りと、実装の file だけの一覧の 1 通りと、判定の順の 1 通り）と f150_the_gate_reads_the_place_as_before（置き場のときの答えが変わらない）。
  目印の選び方（ceiling.yaml と index.yaml を採らない理由）の出所は契約 docs/design/delivery-150.md §1 (d) の 1・2、残る穴の出所は同 §1 (i) の 3 である。
  本文の「置き場の path」は --dir、「書き換える file の一覧」は write-set、「門を撃つ場所」は今の dir、「憲法の正本の file」は constitution.yaml のこと（判断の記録の本文は語彙に無い英字の語を持たない）。
  【判断の記録 ADR-18 の注との関係】本判断が改訂するのは ADR-24 決定 (1) で、ADR-18 決定 (5) の範囲を狭める口は ADR-24 の改訂の欄のままである（本判断は ADR-18 を改訂しない）。
  判断の記録の欄の決まりは改訂の欄を改訂する側の片側だけに置くので、改訂の先（ADR-24）の注には【判断の記録 ADR-25 との関係】の 1 段を置き、その先の先（ADR-18）の注には、照らせない形の一覧の正本が ADR-24 決定 (1) と本判断の決定 (1) の 2 つになる旨の 1 文だけを置く（範囲の改訂の口にしない・一括 25 の改訂 c'）。読み手は ADR-18 の注のその 1 文か ADR-24 の注の 1 段から本判断へたどれる。
  【発効】2026-09-26 15:28 JST（対話面 R-8・逐語「一括２５は承認する」・先の逐語「また３問についてもすべて承認する」2026-09-26 15:22 JST・f2-648 notes）。天井の正本 第 0.16 版・要件書 第 1.47 版と同じ承認要求（🔴 問 1〜問 3・docs/design/batch25-triage.md）への回答で、案 a（改訂の欄で狭める）が採られた。枝の上の 44 周目（4 観点合格・印 a686df9）と独立の検証 3 本（batch25-verify・adr25-verify・batch25-de-verify・~/.local/share/folio2/handoff-2026-09-26/）を経た。本判断の状態の欄の変化は周の引き金なので、取り込みの後に本流の周を回す。
