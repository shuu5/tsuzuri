# folio2 判断の記録 ADR-11 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。人が読む面は判断の記録の面（adr-11.html・生成物・手で直さない）。
# 状態: accepted（発効 2026-09-20・持ち主の承認の逐語は approval 欄と台帳・起草 2026-09-19・方向の裁定は台帳 f2-648 notes 2026-09-19 22:39 JST「１．推奨で」の ②③）。憲法の条文の改訂（第 1.1 版）を伴う＝A-2 / N-4 の手順（反対側からの検証・持ち主の承認の逐語・凍結 anchor・再注入）を通した。
# 位置: 天井の 2 周目（2026-09-19）の「文書どうしの整合」の止める所見 F-1 / F-2（どちらも反証 支持）の是正。下調べ = docs/design/adr-11-survey.md。反対側からの検証（grill）= docs/design/adr-11-grill.md（発効を止める重さ 6 件・直すとよい 13 件を反映した版）。

id: ADR-11
title: 実装の型付きの定数を規則の正本の置き場として憲法に明記し（P-5.1 の改訂と P-5.6 の新設）、同じ値を 2 か所に人が書く形は「正本の向き」を 1 つに決めて file ごとの便で解く
status: accepted
date: 2026-09-20
context: 判断の記録 ADR-9 は、欄の決まりの file 2 本の決まりの部分を床の定数（実装の中の型付きの定数）から導出する生成区間にし、決定の本文で「実装の中の型付きの定数は P-5.5 の型付きデータの 1 つとして扱う」と書いた。天井の 2 周目（2026-09-19）で「文書どうしの整合」の審査役はこれを止める所見の 1 つ目として挙げ、独立の文脈の反証役が支持した。根拠 = 憲法 P-5.1 の括弧が名指す置き場は 正本の file・規則の表の行・部品目録 の 3 つでどれも版管理の中の型付きの file であり、発効済みの判断の記録 ADR-5 の案 d と ADR-6 の案 b は実装の中に置くことを「型付きデータの外」と判定して退けており、ADR-9 自身も案 d の理由で括弧を「名指す置き場」と読んでいる。P-5.5 は「限る」と書くので、条の言う置き場の範囲を判断の記録の 1 文で広げることはできない（憲法も語彙も動いていない）。同じ周の止める所見の 2 つ目（反証 支持）は、ADR-9 が解いたのと同じ形（実装の定数と人が書く一覧を床が 1 字の一致で突き合わせる）が天井の正本に残り、判断の記録 ADR-10 の決定 (2)③ が「床の定数と一致したまま」とその維持を書いていることを、憲法 P-6.4（2 つの面を人が書き、一致を検査で強制する設計を採らない）と両立しないと指摘した。持ち主は 2026-09-19 に、1 つ目は憲法 P-5 と語彙を改訂して実装の型付きの定数を明記する向き、2 つ目は同じ判断の記録で方針を決めて便は file ごとに分ける向きを、推奨どおり裁定した。起草にあたり実装の定数を全数で下調べした結果、残っている形は 1 種類ではなかった。① 同じ一覧を設計文書の file と実装の両方に人が書き、床・面の生成器・命令・歯のどれかが一致を確かめているもの 22 本（天井の正本に 10・入口の正本に 4・憲法と規則の表に 4・部品目録に 4。うち 6 本は一覧の写しではなく「中身を人が書く行の id の集合」を実装が固定する形）。② 同じ一覧が 2 か所に在るのに誰も一致を確かめていないもの 21 本（憲法と規則の表の値域 11 本＝面の生成器が鍵の列として持つが、床はその値域を 1 度も読まない・相談窓口の回答の値 2 本・そのほか 8 本＝実装の中どうしの写し 5 と file との写し 3）。規則の表の状態の値域は、file と実装で順が既に食い違っている。③ 規則の値が実装にだけ在り、人が読める写しがどこにも無いもの 51 本（要件書・語彙・入口・相談窓口・天井の正本の最上位の節の閉じた一覧、図の欄の集合、参照 id の形と節の一覧、反証の束と結果の欄の集合、配信の接続先の判定の式、質問の数の上限や設計ノートの章の数の上限のような数）。④ 型付きの file が正本で実装が読むか組み立て時に導出するもの 24 本（規則の表の行の値・語彙・部品目録の型の一覧など）は既に P-6.3 の形である。加えて、撤退条件の種類の値域は床の文言が「憲法が正・床の定数を直す」と言う一方で、同じ値が欄の決まりの file の生成区間（正本は実装の定数と宣言）にも出ており、正本が 2 つに読める。要件書・入口・相談窓口については、ADR-9 の帰結が「同じ形が残る」と書いたのは不正確で、実測では要件書と相談窓口は ③（写しが無い）と ②（確かめていない）であり、P-6.4 の形（①）は天井の正本・入口の棚・部品目録・憲法の値域に在る。
decision: (1) 憲法を第 1.1 版に改訂する。P-5.1 の括弧の置き場に「実装の型付きの定数」を足し、P-5.6 を新設する＝「実装の型付きの定数を規則の正本とするあいだ、その写しを人が読める型付きデータとして設計文書の置き場へ決定的に導出する。」（型は「〜のあいだ」＝発効の前から正本になっている定数にも掛かり続ける義務）。P-14.3 の「生成区間」を「CLAUDE.md の生成区間」に改める（語彙の「生成区間」を広げると、注入の上限の条が欄の決まりの file の生成区間にまで掛かる文になるため・注入の総量は上限 R-2 の内）。P-5.5 の文は変えない＝P-5.1 の括弧が 4 つになれば、機械が執行する規則の正本の置き場は設計文書と型付きデータの 2 面のままであり、括弧は規範文なので注入される面だけを読んでも分かる。語彙は「型付きデータ」の定義（括弧に実装の型付きの定数を足し、その意味と P-5.6 の条件を書く）と「生成区間」の定義（憲法の注入の区間だけでなく、欄の決まりの file の決まりの部分も含む）を改める。P-5 の平易文と機構の注も同じ版で直す（改訂の範囲の外だが、平易文は義務を落とさない決まり R-10 に従う）。P-5 の機構の注には、写しが在る定数は生成区間の検査が byte 一致を数えること、写しがまだ無い定数を数える口は無く、その間 P-5.6 の充足は「まだ分からない」として扱うこと（P-4.2）を書く。(2) P-5.6 が掛かる定数の範囲は、判断の記録の本文ではなく規則の表の行 D-11（本判断の発効と同じ承認で足す）が正本として持つ。掛かる = folio の命令が 違反・拒否・「まだ分からない」を出す判定に使う 欄の集合・値域・閉じた一覧・判定の式（床だけでなく、面の生成器・天井の命令・配信の命令の判定も含む）。掛からない = file と置き場の名・文言の字面・体裁の数・面の生成器が値に当てる名札と見た目の列。検査の結果を分ける数の閾値は実装の定数に置かず規則の表の行に置く。掛かる定数を足す便・値を変える便は、契約表の行か設計ノートで根拠の判断の記録か裁定 id を名指す。(3) 同じ値を 2 か所に持つとき（P-5.6 が掛かるかどうかに関わらず、歯だけが一致を見ている組も含む）の正本の向きを、次の 5 つの決まりで 1 つに決める（P-6.3）。(ア) 持ち主か設計文書が決める中身（規則の表の行の値・部品目録・相談窓口の回答の値・中身を人が書く行そのもの・憲法の値域）は、型付きの file が正本で、実装は実行時に読むか組み立て時に導出し、手書きの写しを持たない。相談窓口の回答の値は検査の厳しさを決める値ではなく回答の言葉そのものなので、file の側で変えても規則を緩める口（N-3.1）にはならない。変更を機械の門が見張るのは憲法だけ（A-2 の差分の消し込み）で、ほかの file は取り込みの審査で人が読む。面の生成器が値域ごとに持つ表は、鍵の列が値域の写しで、名札と見た目の列だけが表の持ち物である。鍵の列は file から導出する（手書きの写しと一致の検査の組は、導出までのつなぎとしても置かない・P-6.4）。(イ) 検査される file の側から緩められてはならない形の決まり（最上位の節の閉じた一覧・必須の欄の集合・値域・閉じた id の集合）で、その file に憲法と同じ強さの変更の門が無いものは、実装の型付きの定数が正本で、その file の中の生成区間に写しを導出し（ADR-9 と同じ型・命令 folio schema の対象に足す）、同じ一覧を人が書いた欄は file から外す。(ウ) 中身を人が書く行の id の集合を実装が固定する形（天井の観点 4 つと読む文書・入口の棚）は、閉じた id の集合が (イ) の規則、行はその規則に従う実体であり、閉じた id の集合を生成区間へ出した後は「規則の全 id に行が 1 つずつ在る」の検査は実体の検査であって P-6.4 の言う二重の記述ではない（観点の数を実装が固定することは N-5.1 の機構でもある）。(エ) 検査の結果を分ける数の閾値は規則の表の行に置き、実装はその行から読む（散文の門 R-16 と同じ型）。裁定 id と時刻（P-17.1）と、値を緩める前の検証（P-17.4）が規則の表の行にしか掛からないためである。(オ) 持ち主の承認を経た一覧（天井の観点と読む文書・3 値・入口の棚）を「何にするか」の裁定の正本は、その承認を持つ設計文書（判断の記録 ADR-8・要件書 FR5・各 file の承認欄）に留まる（P-5.5 の前半）。実装の型付きの定数は、その裁定を機械が執行する形にした規則の正本であり（P-5.5 の後半）、裁定が変わったら便で定数を変える。裁定と定数の一致を機械が数える口は無いので、そこは取り込みの審査で人が見る。(ア) と (イ) の両方が当たる憲法自身の欄の決まりの節は、A-2 の門が在るので (ア)（file が正本）とする。(4) 便は file ごとに分け、次の順で起こす（1 本ずつ設計ノートと契約表の行を書く・順は天井の門に効く順）。① 天井の正本＝純粋な一覧 6 か所と閉じた id の集合 2 つを生成区間へ・束の中身の一覧の実装の中の 2 枚を 1 枚に寄せる・反証の規則の文と結果の欄の集合の置き場も決める（天井の正本の第 3 版・持ち主の承認を要する）。② 憲法と規則の表の値域＝憲法の値域は file を正本として実装の鍵の列と撤退条件の種類の手書きの写しを組み立て時の導出に替える案を第一の候補に、その便の設計ノートで案を比べて決める（欄の決まりの木は組み立て時に決まる定数なので、実行時に読む形は採れない）。憲法の欄の決まりの節そのものを動かす必要が出たら、A-2 の手順で別の判断の記録を起こす。規則の表の欄の決まりの節は門が無いので (イ) とする。③ 部品目録の上限 3 本と図の型の名札 1 本＝組み立て時の導出に足す。④ 入口の棚の閉じた id の集合＝生成区間へ。⑤ 要件書・語彙・入口・相談窓口の最上位の節の閉じた一覧と図の欄の集合＝各 file の生成区間へ。⑥ 相談窓口の回答の値＝実装が file から読む。⑦ 実装にだけ在る閾値（相談窓口の質問の数の上限・設計ノートの章の数の上限・版管理の照合の待ち時間）＝規則の表の行へ（行の追加は裁定 id を要するので持ち主に問う）。⑧ 参照 id の形と節の一覧・配信の接続先の判定の式＝写しを生成区間へ出し、実装の中で同じ一覧を 2 枚以上持つ箇所は 1 枚に寄せる。この 8 つは範囲の全部を尽くさない。残りは天井の周が所見として挙げたものから便を起こす。(5) 判断の記録 ADR-9 の決定のうち「実装の中の型付きの定数は P-5.5 の型付きデータの 1 つとして扱う」の 1 文の根拠は、本判断の発効後は憲法 P-5.1 と語彙が持つ（ADR-9 の判断は変えない）。ADR-10 の決定 (2)③ の「床の定数と一致したまま」の形は ① の便の着地で本判断が引き取る（ADR-10 の判断のうち第 2 版の中身と撤退条件の数え方は変えない）。
options:
  - id: a
    name: 憲法 P-5.1 に実装の型付きの定数を足し、写しの導出を P-5.6 で義務にする
    text: 括弧の置き場に実装の型付きの定数を足すだけでなく、それを規則の正本にしているあいだは人が読める写しを設計文書の置き場へ決定的に導出することを規範文 1 つで義務にする。義務が掛かる範囲は規則の表の行 D-11 に置く。語彙の 2 語と P-14.3 を改め、正本の向きの決まり 5 つと file ごとの便の順を判断の記録に書く。
    verdict: adopted
    reason: 持ち主の裁定（所見の 1 つ目は条と語彙の改訂・2 つ目は同じ判断の記録で方針）のとおり。括弧に足すだけ（案 c）だと、実装の中に在って人が読めない値まで型付きデータと呼べてしまい、P-5 の出所（規則が散文にしか無く守らせられなかった前の版の失敗）の逆向きの穴＝「規則が実装にしか無く、人も審査役も読めない」を条が許す。ADR-9 の反証役が「一覧の置き場は導出物の生成区間で満たされる」と読んだとおり、実装の定数を型付きデータと呼べる根拠は写しが設計文書の置き場に在ることなので、それを条の義務にする。写しが在る定数の検査は既に在る（命令 folio schema の検査が生成区間と導出の byte 一致を数える・FR19）。弱さも在る＝実装の定数は、規則の正本を置ける面の中で変更の門がいちばん弱い（帰結の 2 つ目）。
  - id: b
    name: 規則の値をすべて型付きの file に置き、実装は組み立て時に導出する
    text: 床の定数を設計文書の置き場の型付きの file へ移し、部品目録と同じ型で、実装の側の定数を組み立て時に file から導出する。憲法は改訂しない。
    verdict: rejected
    reason: P-5.1 の今の括弧のまま両立でき、実行時に読む案（ADR-9 の案 d）と違って検査の対象の置き場からは緩められない。しかし持ち主は 2026-09-19 にこの向きを採らないと裁定しており、便 45・46 で着地したばかりの向き（欄の決まりの木と説明の注 49 本を実装の側へ寄せた）を逆に運び直すことになる。移す先の file（天井の正本・入口・相談窓口・部品目録）には憲法のような変更の門が無く、取り込みの審査で人が読むだけである。ただし案 a の実装の側も、便で持ち主の裁定なしに変えられるという同じ水準の弱さを持つので、門の強さでは優劣が付かない。決め手は裁定と運び直しの費用である。案 a の撤退先として残す。
  - id: c
    name: P-5.1 の括弧に足すだけにする（P-5.6 を置かない）
    text: 括弧に「実装の型付きの定数」を足し、語彙を改める。写しの導出は ADR-9 の決定に任せ、条にはしない。
    verdict: rejected
    reason: 改訂は最小で、所見の 1 つ目の字面は解ける。しかし写しの無い定数（下調べの ③ の 51 本）まで条の上で適法になり、天井の審査役と持ち主が規則を読めない状態を条が追認する。義務が判断の記録にしか無いと、次の file で同じ所見が繰り返される。
  - id: d
    name: 憲法は変えず、ADR-9 の 1 文を取り下げる
    text: ADR-9 の「型付きデータの 1 つとして扱う」を消し、実装の定数は型付きデータではないと認めたうえで、生成区間を P-5.1 の「型の一覧の置き場」とだけ説明する。
    verdict: rejected
    reason: P-5.5 は機械が執行する規則の正本の置き場を 2 面に限っているので、正本が実装に在る事実と両立する説明にならない（反証役の支持の根拠 4）。正本を file の側へ戻すなら案 b と同じである。
basis: [P-4, P-5, P-6, P-13, P-14, P-17, A-2, N-3, N-4, N-5, R-2, R-7, R-10, R-16, D-11, ADR-5, ADR-6, ADR-8, ADR-9, ADR-10, FR5, FR19]
retreat:
  kind: measure
  condition: 数えるのは設計判断の席（この判断の記録を起こした席）で、台帳に記帳する。発効後の天井の周（天井の正本の版が変わっても周として続けて数える）で、(a)「実装の定数に在る規則の写しが無い・古い・正本の向きが 2 つに読める」の止める所見が反証で支持された回数、(b) 決定 (4) の便が便の上限に収まらず割り直しになった回数（受付の断りの記録 1 回、または 1 本の便を 2 本以上に割り直した記帳 1 回を 1 件と数える）を、rules 行 R-7 の同じ種類の失敗の定義では別種として別々に数える。(a) は決定 (4) の ①〜③ の便が着地した後の周から数え、R-7 の上限を超えたら、本判断を捨てて案 b（規則の値を型付きの file に置き、実装は組み立て時に導出する）へ移る判断の記録を起こす。(b) は着地を待たず、①〜③ のいずれかの便で R-7 の上限を超えた時点で同じ判定をする。そのとき憲法 P-5.1 の括弧と P-5.6 は、同じ手順（A-2）でもう一度改訂して元へ戻す。
