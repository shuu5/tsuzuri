plain: 憲法は「守らせたい決まりは、文章ではなく表に載せる」と言い、表の置き場を 3 つ名指ししていました。ところが今の folio は、書類の書き方の決まりの一部を道具の中（プログラムの中に型を付けて書いた値）に持っていて、そこは名指しされた 3 つに入っていませんでした。前の判断の記録は「それも表の 1 つとして扱う」と 1 文で済ませていましたが、憲法の言葉の範囲は憲法を直さないと広げられません。そこで憲法を直します。道具の中の決まりも置き場に数えますが、条件を付けます。それを元にしているあいだは、人が読める写しを機械が何度やっても同じ結果になる形で作り、設計文書の置き場に置き続けることです。あわせて、AI が毎回読む場所へ写す量の上限の条（P-14.3）が掛かる先を CLAUDE.md の区間だけに限り、用語集の 2 語（型付きデータ・生成区間）の説明も直します。対象は機械が合否の判定に使う決まりだけで、ファイルの名前や画面の言葉づかいは含みません（どれが対象かは規則の表に 1 行で書きます）。合否を分ける数は道具の中に置かず、規則の表に置きます。正直に言うと、道具の中の決まりは、憲法や規則の表と違って、持ち主の承認なしに作業の中で変えられます。歯止めは、写しの変化が必ず人の目に触れることと、決まりを足す便・値を変える便が根拠（判断の記録か台帳の裁定の番号）を名指す約束（規則の表の 1 行）だけです。あわせて、同じ一覧を 2 か所に人が書いて機械が見張る形がまだ何か所か残っているので、「どちらが元でどちらが写しか」を決める 5 つの決まりを置き、ファイル 1 つずつ順に直していきます。
consequences:
  - 憲法は第 1.1 版になる（初めての条文の改訂・改める規範文は P-5.1 と P-14.3、新設は P-5.6）。承認の後に、判断の記録の状態と承認欄・条 P-5 と P-14 の改訂来歴・規則の表の行 D-11 の裁定 id・凍結 anchor の第 1.1 版・CLAUDE.md の生成区間の再注入・読み物の生成し直しを同じ変更で置く（P-14・N-4.1）。注入の総量は上限 R-2 まで残り 140 byte ほどになる＝次に規範文を足す改訂は上限の見直し（P-17.4）を伴いうる。版と判断の記録の番号を字面で持つ歯の土台は、実の置き場から凍結した写しへ移し済み（台帳 f2-648.68）。
  - 本改訂は、機械が執行する規則の正本を置ける面のうち、変更に持ち主の裁定も裁定 id も要らない面（実装の型付きの定数）を条の上で適法にする。歯止めは、P-5.6 が求める写しの差分が設計文書の置き場の取り込みの審査に必ず現れることと、規則の表の行 D-11 の作法（根拠の判断の記録か裁定 id を便が名指す）だけであり、憲法（A-2）のような前置の機械の門は掛からない。規則の表の行の裁定 id の検査（P-17）も今は人が差分を読む水準で、機械の門としてはまだ実在しない。
  - 発効した時点で、P-5.6 が掛かるのに写しが無い定数（下調べの ③ の 51 本のうち D-11 の範囲に入るもの・総数は仕分けの便まで「まだ分からない」）と、向きが決まっていない二重の記述（① と ②）は、条と決定に対して未達のまま残る。床はそれを違反として数えず、P-5 の機構の注のとおり「まだ分からない」として扱う（P-4.2）。解くのは決定 (4) の便で、着地までの天井の周はそれを所見として挙げうる。天井の門（裁定 1・案 A）を掛けるのは、少なくとも ① 天井の正本 ② 憲法と規則の表の値域 ③ 部品目録 の便が着地し、次の周で整合の止めるが消えたのを確かめた後とする。
  - 天井の正本は ① の便で第 3 版になる（人が書く一覧 6 か所が生成区間へ移る・発効は持ち主の承認）。台帳に記した第 3 版の候補 4 つ（直前の版の写し・反証の規則の文の置き場・生成区間を持つ file への所見の直す先・整合の束に語彙）は同じ版で扱う。
  - 規則の表に閾値の行が増える（決定 (3)(エ)・⑦ の便）。行の追加は裁定 id と時刻を要する（P-17.1）ので、値と行の文面は便の前に持ち主へ問う。
  - 要件書は、生成区間の対象が増える便のたびに FR19 の受入基準（対象の file の一覧・生成の入力）を版付きで足す（P-13.3）。判断の記録と設計ノートの欄の決まりそのもの・床の出す文言は、本判断では変えない。
note: 元になった持ち主の逐語は台帳 f2-648 notes 2026-09-19 22:39 JST「１．推奨で」（対象 = 天井の 2 周目の裁定 3 点・② 整合の 1 つ目は憲法 P-5.1 / P-5.5 と語彙の改訂・③ 整合の 2 つ目は同じ判断の記録で方針を決め便は file ごと）。裁定は P-5.5 も改訂の対象に挙げていたが、起草の結果 P-5.5 の文は変えずに済むと判断し（反対側からの検証も支持）、その代わりに P-5.6 の新設と P-14.3 の改訂を発効の承認で問う。所見と反証の逐語は ~/.local/share/folio2/ceiling/2026-09-19-round2/（整合の止める所見 2 つの反証の理由）。下調べの全数は docs/design/adr-11-survey.md、反対側からの検証の記録は docs/design/adr-11-grill.md に在る。決定 (3)(ア) の末尾の 1 文と決定 (4)② の 1 文（導出できるまでのつなぎとして、面の生成器が値域との集合の一致を数える）は、天井の 3 周目の止める所見（整合 F-1・反証 支持 = つなぎそのものが憲法 P-6.4 の形）を受けて 2026-09-20 に外した。つなぎは 1 度も実施していない（設計ノート docs/design/adr-11-step2-enums.md の決定のとおり、便 49・50 で導出を先に入れた）。決定のほかの部分・撤退条件・改訂した条は不変。持ち主の裁定 f2-648 notes 2026-09-20 13:30 JST「どちらも推奨で」（問 1 = 案 A）。平易文を 2026-09-20 に直した（決定性の言い換えと、P-14.3 と語彙 2 語の改訂を足した・決定と撤退条件は不変・天井の 3〜5 周目の忠実さの「直す」・持ち主の裁定 f2-648 notes 2026-09-20 15:01 JST「１．推奨で」）。平易文の直し（2026-09-20・天井の 8 周目と平易文の総点検〔全数の突き合わせ〕・持ち主の裁定 2026-09-20 17:21 JST〔f2-648 notes・逐語「承認する」〕）= 歯止めを帰結の 2 つ（写しの変化が人の目に触れる・規則の表の行 D-11 の作法）に揃えた。
