# folio2 判断の記録 ADR-4 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。読み物は preview/readable.html（生成物・手で直さない）。
# 状態: proposed（提案中・拘束力なし）。発効（accepted）は持ち主の承認（逐語・日付・裁定 id・対話面 R-8）を承認欄に置いたとき。条文の改訂ではない（amends は空）。
# 位置: f2-648.5。持ち主の方針の裁定「受け入れで良い」（2026-09-15・f2-648 notes）は「実行環境（Node.js）を組み立て時の外部依存に持つ」方針への回答であり、本判断の発効の承認と、依存を実際に足す便での A-3.1 の確認は別に取る。
id: ADR-4
title: 図の文法と検査は外の道具（archify）の型付き記述（JSON）を借り、folio は検査に通った図（SVG）だけを部品として埋め、見た目の値（design token）と生成器は folio が持つ
status: proposed
date: 2026-09-15
context: 持ち主は 2026-09-15 に、公開の道具（OSS）である図の道具（archify）を調べるよう指示した。要旨は「これを使うとグラフを AI が型付き記述（JSON）で書けるようになる。folio2 の各種の文書（docs）の中の図を作るのに使いやすいのではないか」である（逐語は台帳 f2-648.5 の本文）。planner 席が本家の写し（clone・2026-09-14 の先頭）を手元で実行して確かめた事実は次のとおり。図の道具（archify）は、AI が型付き記述（JSON）で図を書き、機械が欄の決まり（schema）・配置の制約・描画・仕上がりの 9 検査を順に掛けて黙って飛ばさず（fail-closed）、決定的に 1 枚の自己完結の HTML へ組み立てる（compile）道具である。許諾は自由な許諾（MIT）、実行時の外部依存は 0 で実行環境（Node.js）の版 18 以上だけを要し、図の型は 5 つ（構成図・手順図・順序図・流れ図・状態図）、失敗は機械が読める診断（規則の id・対象・証拠・修正候補）で返り、「2 往復続けて誤りの数が減らなければ止めて正直に報告する」規則を自分で持つ（folio2 の P-11 / rules 行 R-7 と同型）。一方で自動配置は無く、AI が座標（格子の行と列か画素）まで書く。作者はそれを製品の差別化として明示的に選んでいる。要件書の図 2「folio が 1 回で通す 7 段」を題材に日本語の 7 箱の構成図を書いたところ、仕上がりの最上段（showcase）で全検査を通すまでに 4 往復を要した（座標なし → 格子の行と列 → 名札 6 件の重なり → 幅の広げ過ぎ → 合格）。出力の HTML は約 800 千 byte で、その大半は閲覧の仕掛け（viewer・JS 480 千 byte・CSS 280 千 byte・字体）であり、図の本体（SVG）は 16 千 byte、行内の様式 0・色の直書き 0・意味を表す class 29 種だけで描かれている（色・字の大きさ・線の太さは全部 class に掛かる）。閲覧の仕掛けの文言は英語と中国語だけだが、図の本体だけを使うなら関係しない。名札の日本語は文字幅 2 単位で測られ、行の折り返しも効く。検査と描画は通信しない（製品の印の取り込みだけが通信し、明示の命令でしか動かない）。folio2 の側の制約は次のとおり。人が読むページの生成器は 1 つ（P-2.1）、見た目の値（design token）は 1 か所（P-2.3）、図の型は閉じた一覧＝部品目録に載せ追加には判断の記録が要る（P-2.4・rules 行 R-5 の値は 3 型）、外部の道具を増やすときは予算（rules 行 R-6・未定）と許諾に照らして持ち主の確認を得る（A-3.1）、例外機構を足さない（N-3.1）、通信先は tailnet の内側（N-6）。閲覧の仕掛けごと取り込むと生成器と見た目の値が 2 系統になり、前の版（folio v1）で提示層が 3 系統に割れた事故を繰り返す。持ち主は調査報告（版管理の外・台帳 f2-648 notes に所在）を読み、「実行環境（Node.js）を組み立て時の外部依存に持つか」の問いに「受け入れで良い」と答えた（2026-09-15・f2-648 notes）。folio2 は「設計文書まで・Rust 実装は保留」の直命（2026-09-12・f2-648 notes）の下にあり、本判断は設計の記録であって実装の着手ではない。
decision: 図の道具（archify）を「図の文法と検査を借りる組み立て器（compiler）」として使い、次のとおり境界を定める。(1) 図の正本は、その図を載せる文書の正本 YAML の図の節に、道具の型付き記述（JSON の 5 型の欄の決まりそのまま）で置く。図の正本を別 file にも散文にも持たない（P-6.1・P-5.1）。(2) folio の生成器が道具を子の処理（process）として呼び、検査（validate）と描画（render）を掛ける。仕上がりの段は最上段（showcase）に固定し、その値は発効時に rules 行として置く（緩める口を持たない・N-3.1）。検査を通らなかった図は生成せず、前の生成物も上書きしない（P-4.1）。同じ図の修正の往復が rules 行 R-7 の上限を超えたら止めて持ち主へ渡す（P-11.1）。(3) 道具の出力から図の本体（SVG）だけを取り出し、閲覧の仕掛け（viewer）・様式（CSS）・動き（JS）・字体は捨てる。図の本体の意味を表す class（箱の種別・線の種別・矢じり・文字の役割）を部品目録に載せ、色・字の大きさ・線の太さは folio の見た目の値（design token）で 1 か所に定義する（P-2.3・R-3）。人が読むページの生成器は folio 1 つのままで、道具は生成器の内側の部品を作る道具である（P-2.1）。図の本体に残る意味の属性（箱の id・種別・名札、線の始点と終点と名札）は捨てず、folio 自身の閲覧の仕掛け（部品目録に載せた部品）がそれを読んで箱の強調や経路の追跡を行ってよい＝閲覧の機能を持つ主体は folio であって道具ではない。(4) 部品目録の図の型に道具の 5 型を足す。これは rules 行 R-5 の値の改訂であり、本判断の発効と同時に裁定 id と時刻を付けて行う（P-17.1・P-2.4）。既存の 3 型は残す。(5) 依存は実行環境（Node.js）の版 18 以上と道具の版 1 つで、道具の版は固定し（版の番号と要約値（sha256）を型付きデータに置く）、製品の印の取り込み（通信する命令）は使わず、道具を AI 向けの説明（skill）としては載せない（rules 行 R-1 の母集団に入れない）。依存を実際に足す便では A-3.1 の確認を持ち主から別に得る（本判断は方針であり、その確認の代わりではない）。(6) 検査は生成側からも検査側からも独立した凍結 anchor を持つ（P-10.1）＝図の型付き記述 1 本と、それから期待される図の本体の写しを固定の fixture として置き、道具の版上げで図の本体の class の契約が変われば anchor が落ちて「まだ分からない」に落とす（P-10.3）。(7) 図を書く AI の座標決めの往復は道具の診断（修正候補つき）で機械的に回すが、その往復の記録は台帳に残し、撤退条件の測定に使う。
options:
  - {id: a, name: 組み立て器として借り、図の本体（SVG）だけを部品に埋める, text: 図の正本は道具（archify）の型付き記述（JSON）で文書の正本 YAML に置き、folio が道具を子の処理（process）で呼んで検査と描画を掛け、出力から図の本体（SVG）だけを抜いて部品として埋め、見た目の値（design token）は folio が持つ。閲覧の仕掛けは捨てる。, verdict: adopted, reason: 得たいのは「AI が書け、機械が黙って飛ばさず落とせる図の文法と検査」であって閲覧の仕掛けではない。図の本体は意味を表す class だけで描かれているので（行内の様式 0・色の直書き 0・実測）、見た目の所有権を folio に残せる（P-2.1・P-2.3）。5 型の配置制約・名札の衝突・可読性の検査を自作せずに済み、実行時の外部依存は 0・許諾は自由な許諾（MIT）・通信なし（A-3・N-6）。捨てるのは閲覧側の機能（検索・強調・経路の追跡・章立ての案内・発表の動き・画像と動画の書き出し・版管理の行への飛び先）と、生きた下見（preview）であり、図の本体には意味の属性が残るので強調と追跡は folio の部品として持ち直せる。版どうしの差分（compare）は機械が読める出力（receipt）を型付き記述の側で出せるので、閲覧の仕掛けを捨てても失わない。}
  - {id: b, name: 道具の出力（閲覧の仕掛け込みの HTML）をそのまま置く, text: 道具（archify）が出す自己完結の HTML を別ページか埋め込み枠（iframe）として配信先に置く。, verdict: rejected, reason: 人が読むページの生成器が 2 つ、見た目の値が 2 系統になり（P-2.1・P-2.3 に正面から反する）、閲覧の仕掛けの文言は日本語を持たない。前の版（folio v1）で提示層が 3 系統に割れた事故の再演になる。}
  - {id: c, name: 思想だけを移し、folio が自前で型付きの図と検査を持つ, text: 道具（archify）を依存にせず、Rust の folio が図の型付き記述の欄の決まりと、配置の制約・名札の衝突・可読性の検査を自前で持つ。, verdict: rejected, reason: 外部依存 0 で憲法に最も素直だが、道具が 5 か月・400 件の取り込みを掛けて磨いた 5 型の配置検査を folio が背負うことになり、保留中の Rust 実装の規模を大きく膨らませる。既存の 3 型は現行の生成器で足りているので、案 a が破れたときの逃げ道として撤退条件に置く。}
  - {id: d, name: 自動配置を持つ既存の図の記法（mermaid 等）を使う, text: 文章に近い記法（mermaid）や自動配置の仕掛けで図を書き、閲覧側で描画させる。, verdict: rejected, reason: 自動配置の道具は名札の衝突・可読性を黙って飛ばさず落とす検査を持たず、描画が閲覧側で行われるので生成物が決定的でなく凍結 anchor を置けない（P-3.1・P-10.1・P-10.2）。道具（archify）の作者自身も自動配置の実験で「様式を被せた自動配置は元の記法と大差ない」と結論している。}
basis: [P-2, P-3, P-4, P-5, P-6, P-8, P-10, P-11, P-17, A-3, N-3, N-6, R-1, R-3, R-5, R-6, R-7, FR4, NFR2, AC2, GOAL2, CON2, CON7, ADR-1]
retreat: {kind: measure, condition: 数えるのは planner 席（図を書く往復と床を回す席）で、台帳に記帳する。発効後、① 道具（archify）の版上げで図の本体（SVG）の class の契約が変わり凍結 anchor が落ちた回数、または ② 1 つの図の修正の往復が rules 行 R-7 の上限を超えて止まった件数、のどちらかが同じ種類の失敗として R-7 の上限を超えたら、本判断を捨てて案 c（folio が自前で型付きの図と検査を持つ）へ移る。① と ② は R-7 の同じ種類の失敗の定義（same_failure）では別種なので別々に数える。移る前に持ち主へ知らせる。}
amends: []
plain: 図を「AI が書ける文法」で持つために、外の道具（archify）を借ります。借りるのは「図の書き方（型付きの記述）」と「機械が図の崩れを見つけて止める検査」だけで、その道具が付けてくる見た目（色・字・動き・閲覧の画面）は捨て、図の線と箱だけを folio のページに埋めて、色や字の大きさは folio の 1 か所の値で塗ります。だから「ページを作る係は 1 つ」「見た目の元の値は 1 か所」という憲法は守られます。図の種類は 5 つ増えるので、使える部品の一覧に足し、その足し込みは記録と番号つきで行います。道具は実行環境（Node.js）の上で動くので、folio を組み立てるときに 1 つ外の物を使うことになります。これは、あなたが「受け入れで良い」と答えた点です（実際に足すときにもう一度確認します）。道具の中身が変わって埋めた図が崩れるようになったり、1 枚の図を直す往復が決めた回数を超えて止まることが続いたりしたら、この決め方をやめて folio が自前で図の検査を持つ形に移ります。この記録はまだ提案中で、あなたの OK の言葉を承認欄に置いたときに効きます。
consequences:
  - 発効と同時に rules 行 R-5 の値を「図は 3 型」から「図は 8 型（既存 3 型 + 道具（archify）の 5 型）」へ改訂し、裁定 id と時刻を行に付ける（P-17.1）。仕上がりの段（showcase 固定）と道具の版（版の番号と要約値（sha256））の行も同時に足す。部品目録（parts.json の figure_type_enum と図の本体の class）へ 5 型と意味を表す class を載せる。
  - 語彙に語を足す（図の道具・型付き記述・図の本体・閲覧の仕掛け・組み立て器）。識別子の一覧に道具の名（archify）・実行環境の名（Node.js）・図の本体の形式名（SVG）を足す。
  - 依存を実際に足す便（Rust 実装の保留が解けた後）では、A-3.1 の確認（rules 行 R-6 の予算と許諾 MIT に照らす）を持ち主から取り、要件書 CON2 の手順に従う。実行環境（Node.js）の版と道具の版の固定は型付きデータに置き、便の検査（CI）で照合する。
  - 凍結 anchor（P-10.1）として、図の型付き記述 1 本とそれから期待される図の本体の写しを固定の fixture に置く。道具の版上げはこの anchor で検出し、落ちたら「まだ分からない」に落とす（P-10.3）。
  - 要件書に図の生成の要件を足すのは版上げ（append・新しい番号）で行い、持ち主の承認欄で発効する（P-13.3）。M0 の範囲は変えない。
  - 図を書く AI の座標決めの往復（診断 → 修正候補 → 再検査）は道具の側が機械的に回すが、上限は rules 行 R-7 に従い（P-11.1）、超えたら止めて持ち主へ渡す。往復の件数は台帳に記帳し、撤退条件の測定に使う。
  - 道具（archify）の閲覧側の機能のうち folio が捨てるもの（検索・箱の強調・経路の追跡・章立ての案内・発表の動き・画像と動画の書き出し・版管理の行への飛び先・生きた下見）は、要るものだけを folio の部品（部品目録に載せる）として持ち直す。図の本体の意味の属性がその材料になる。版どうしの差分は道具の機械が読める出力（receipt）を型付き記述の側で使う。
  - 本判断は条文を改訂しないので A-2.3 の対象外。発効の承認は持ち主から planner 席の対話面（R-8）で取り、承認欄と台帳 f2-648.5 に逐語で記帳する。
note: 調査報告（版管理の外・session の記録）= 持ち主の設定の外の置き場 ~/.local/share/folio2/reports/2026-09-15-archify/index.html（tailnet の内側で配信）。実測の要点は台帳 f2-648 notes 2026-09-15。本家 = tt-a1i/archify（許諾 MIT・先頭 851b279・2026-09-14）。
