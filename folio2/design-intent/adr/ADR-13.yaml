# folio2 判断の記録 ADR-13 — 設計文書をグラフとして持ち、天井に注意の先を渡す
# 状態: accepted（起草 2026-09-22・発効 2026-09-22 11:42 JST 持ち主「全部承認する」・orchestrator 席 fable 5.1）。下調べの設計ノート = docs/design/graph-and-incremental-ceiling.md（第 4 版）
# 起点: 持ち主の問い 2026-09-22 01:1x（対話面 R-8）。判断の記録 ADR-8 の注が持つ門の撤退条件の発動。
# 第 2 版（2026-09-22）: 敵対的検証（条 A-2.3）の 12 点を反映。
# 第 3 版（2026-09-22）: 持ち主の目的関数の裁定（精度・10:1x〜10:2x JST）を反映し、束を切る決定を取り下げた。
# 第 4 版（2026-09-22）: 辺の後付けの 1 回目（PR #240）の実測と、その検証役の所見を反映した。
# 4 点は発効の承認で推奨どおりに確定した（設計ノート §10.2 に経緯・本 file の決定 (7)(9)(14) と便の列が確定の側）。

id: ADR-13
title: 設計文書の id 参照を辺とするグラフを導出物として持ち、天井の束を切らずに注意の先を渡す
status: accepted
date: 2026-09-22

plain: |
  設計文書の中の「この決まりはあの条が根拠」「この受入基準はあの要件を確かめる」といった指し合いを、
  機械が 1 枚の地図として取り出せるようにします。地図は新しく書くものではなく、いま文書が持っている欄から
  作り直せる写しです（手で書く面は作りません）。
  この判断が目指すのは精度です。設計文書が道標として正しいこと、見落としてあとから直す回数が減ること、
  そして現実的な時間で回り続けることの 3 つを良くします。AI に渡す字数を減らすことは目的ではありません。
  地図でできることは 3 つあります。
  1 つ目は、AI が最初に「この repo の設計文書には何があって何が何を指しているか」を 36 キロバイトほどの表 1 枚で
  受け取れること。全部の文書を読むと 550 キロバイトなので、15 分の 1 で全体像が得られます。
  2 つ目は、AI による意味の検査（天井）を回すとき、材料はこれまでどおり全部渡したうえで、その先頭に
  「今回変わった所と、そこから指し合いを 2 つ分たどった範囲」の一覧を添えること。
  これは「ここだけ見ろ」ではなく「ここから見はじめろ」です。材料を削らないので見落としは増えず、
  一覧の大きさは材料の 1 パーセントにも満たないので、ほとんど只で AI の注意を正しい所へ向けられます。
  3 つ目は、中身がまったく変わっていない変更で検査の周をまるごと省くこと。実際の時間はここで減らします。
  もう 1 つ、地図そのものを良くする手を先に打ちます。いま文書の文章の中には、欄に書かれていない指し合いが
  258 組あります。これを欄へ書き写すと、指摘が指す相手が近くに入る割合が 4 つの読み方すべてで上がり、
  重い指摘の取りこぼしが 10 件から 6 件へ減りました。書き写す作業は別の担当が進めており、
  以後は「文章で指したなら欄にも書くこと」という決まりを機械が見張ります。
  なお、欄に指し合いを足すだけの変更では検査の周を回しません。地図を良くする作業が検査の回数を
  増やしてしまっては本末転倒だからです。

context: |
  (1) 目的関数の裁定（2026-09-22 10:1x〜10:2x JST・対話面 R-8・台帳 f2-648 notes に逐語）。
  目指すのは精度である＝現実的な開発時間で、高い精度の道標となる設計文書を作り維持すること。
  天井の周をひたすら回すような実時間の無為な消費は不可。AI へ渡す字数の削減は目的ではなく、
  要らない情報を落として精度が上がるなら可、精度と引き換えに字数だけ減らすのは不可。
  節点を増やして辺を完全にする案は、精度が上がり手戻りが減るなら良いが、天井を高い頻度で走らせる種になるなら微妙。
  **第 2 版は「1 周あたりに読む字数」を主な物差しにしていた。この裁定でそれは物差しから外れた。**

  (2) 事実。設計文書の正本は 9 つの文書で合計 550,398 byte。その中に id を持つ節点が 285、欄に id を並べた
  型付きの辺が 721 本ある（向きを落とすと対が 568・辺を持つ節点が 218・次数は中央値 3・最大 35）。
  節点と辺の数は敵対的検証が独立に数えて一致した。第 1 版は辺の一覧に 規範文と条をつなぐ構造の辺（in-article・134 本）を
  載せていなかったのに段を数えるときは使っていたので、第 2 版で閉じた一覧に足した。

  (3) いまの天井の費用。直近の 1 周の正本の写しの合計は 2,083,365 byte、置き場の総量は 141,619,070 byte、
  1 周の所要は 15 分から 20 分。束は文書の単位でしか絞っておらず、観点が「この欄だけ読む」と宣言していても
  名指された file の全部を写す。今の正本を 4 観点ぶんで測ると file 全部が 2,177,001 byte、
  読む欄だけが 862,970 byte（39.6%）。設計文書が 1 byte でも変われば印は古くなるので、3 日で 25 周、
  うち 2026-09-21 の 1 日で 14 周を回した。判断の記録 ADR-8 の注が門に付けた撤退条件は、この実測で満たされている。

  (4) 直近 40 commit の実測で、変わった節点は中央値 2・平均 7.0・最大 43。40 回のうち 14 回は節点が 1 つも
  変わっていない（生成物だけ、または生成区間と欄の決まりの file だけ）。この 14 回は、いまは 1 周を丸ごと回している。

  (5) 辺をつなぐと精度が上がる（本版の中心の実測）。過去 23 周の所見を、その所見を立てるのに要る相手を
  全部そろえる数えで測ると、2 段以内に入るのは 整合 64.8%・忠実さ 75.0%・読みやすさ 79.4%・実態 73.6%。
  文章の中の id の言及のうち、来歴と生成区間を除き囲む節点の id が取れる 800 件から、まだ欄になっていない
  258 対を辺に足すと、2 段以内は 整合 79.5%・忠実さ 83.8%・読みやすさ 85.3%・実態 85.1% に上がり、
  3 段以上に落ちる「止める」の所見は 10 件から 6 件へ減る。
  対価は近傍が太ること（節点 1 つあたりの 2 段の近傍が 中央値 16 から 49・最大 136 から 166）。
  **束を切る設計ならこの太りは「読む量が 3 倍」を意味したが、束を切らない形ではそうならない。**

  (6) 注意の先の一覧を添える費用は小さい。直近 40 commit で、変わった節点と 2 段の近傍を合わせた一覧は
  節点の数が 中央値 85・最大 209、字数にして 中央値 8,160 byte・最大 20,064 byte で、
  読む欄まで絞った束（862,970 byte）の 0.9% にすぎない。

  (7) 持ち越しの前提は実測で偽だった。材料の束の要約値が 1 byte も違わない 2 周が 2 組あり、判定（合格）は
  両方とも一致したが、忠実さで挙がった所見 7 種のうち両方に出たのは 1 種だけ、実態でも 4 種のうち 1 種だけだった。
  持ち越しの条件を過去 23 周に当てると所見の 27.6%（402 件のうち 111 件・止める 3 件を含む）が消える。

  (8) 既に約束されていて未実装のもの。要件書は「機械が読む id の索引を出す」「契約表から導出物を生成して
  差分を数える」「着地は commit の末尾の印だけから読む」の 3 つを定めているが、口はいずれも無い。
  要件書の注には実装の状態が日付つきの文章で手書きされており（注の合計 14,577 byte・うち状態を述べる注が
  8 件 7,647 byte）、実態との整合の観点が毎周それを読み、注を手で実態へ合わせ直すためだけの版上げが
  繰り返されている。いま要件書の面には「未実装」が 7 か所出ており、持ち主は面を開けば動くかどうかを読める。

  (9) 持ち主の問いの後半「リンクと節点の対応をしっかり作り込む方向で設計を根本から考え直すか」について。
  第 2 版はこれを「id の体系ごと作り直す」と読んで退けようとし、その実証に失敗した。
  **第 3 版は「対応を作り込む」の部分を採る**（258 対を欄へ書き写し、床の規則で維持する）。
  採らないのは「id の体系ごと作り直す」の部分で、作り直せば判断の記録 12 本と条 27 本と要件 20 本の
  id の連続性（条 P-7.1 が禁じる改番）と凍結 anchor 3 本を失うが、書き写しはそれを 1 つも失わずに同じ利益を取る。

options:
  - id: a
    name: 索引を導出物として持ち、束は切らずに注意の先の一覧を添える（辺の後付けを先に・持ち越しなし）
    text: |
      設計文書の id を持つ行と、所見の置き場になる節を節点とし、いま欄に在る id の並びを辺とする索引を、
      正本から決定的に導出する口を folio に置く。索引は導出物で、人が書く面は作らない。
      天井の束は、観点が宣言する読む欄まで絞ったうえで、その観点が読む文書を丸ごと渡す（内容は 1 つも落とさない）。
      束の先頭に「変わった節点・そこから辺で 2 段の近傍・型付きの辺で届かないが文章で指されている参考」の
      一覧を添え、観点の問いの文に「一覧に挙がった所から見はじめ、一覧の外で見つけた食い違いも同じ形で挙げる」の
      1 文を足す。前の周の判定は持ち越さない。
      節点の要約値を印に持ち、周の引き金（節点の本文・生成区間と欄の決まり・面の生成器と部品目録・
      実態の観点の実装の証拠）が 1 つも変わらない変更では周を要らないと出す。**辺を足すだけの変更は引き金に数えない。**
      門は「印が古い」の側だけを便の file の単位にし、「不合格」は repo 全体で止めるを残す。
      文章の中の id の言及のうち本物の依存は、走査で救い上げるのではなく型付きの欄へ書き写し、
      「文章で指したなら欄にも在ること」を床の規則が見張る。
    verdict: adopted
    reason: |
      目的関数（精度・手戻り・実時間）の 3 つとも良くなる。
      精度: 束を 1 字も削らないので観点が見られない範囲を作らない。そのうえで注意の先を渡すので、
      AI は最初に見るべき所を知って始められる。辺の後付けで所見が指す相手が近くに入る割合が
      4 観点すべてで上がる（2 段以内が 64.8〜79.4% から 79.5〜85.3% へ）。
      手戻り: 3 段以上に落ちる「止める」の所見が 10 件から 6 件へ減る。
      実時間: 40 回の変更のうち 14 回は周が要らなくなり、1 周の所要（15 分から 20 分）がそのぶん浮く。
      辺を足すだけの変更を引き金に数えないので、地図を良くする作業が周を呼ぶことも無い。
      字数は副産物で、1 周は今の 42% になる（第 2 版の 22% より増えるが、増えたぶんは精度を買った代金である）。
      索引を導出物に限るので、同じ内容を人が 2 か所に書く形（条 P-6.4 が禁じる形）にならない。
      憲法の条文の改訂を要しない。
  - id: b
    name: 注意の先で束を切る（第 2 版の形）
    text: |
      観点ごとに影響集合を求め、その外に在る節点を束から落とす。1 周の読む量は今の 22%（中央値）まで下がる。
    verdict: rejected
    reason: |
      目的が精度だから退ける。束を切ると、切った先に在る食い違いを観点は見られない。
      辺を後付けした後でも「止める」の所見 6 件は 2 段の外に在る。
      第 2 版はこれを「撤退条件で数える」で受けようとしたが、数えられるのは見つかった後であって、
      見つからなかったものは数えられない。
      字数では案 b が勝つ（1 周 22% 対 42%）が、その差は精度で払う値段としては高すぎる。
  - id: c
    name: 文章の中の id の言及を、書き写さずに走査で拾って辺として使う
    text: |
      型付きの欄に無い指し合いを、床の参照 id の走査（数値の表の行 R-4 と同じ式）で文章から拾い、そのまま辺にする。
    verdict: rejected
    reason: |
      3 つの理由で退ける。第 1 に、本物の依存と、来歴や説明のための言及とを機械が区別できない
      （走査の母集団は範囲の取り方で 800 から 1,805 まで動く）。第 2 に、条 N-2 の向きに反する
      ＝文章にしか無い関係を機械の判定の根拠へ昇格させることになる。第 3 に、走査の式が変われば辺が変わる。
      欄へ書き写せば、依存は型付きの欄に在り、床が数え、人が読める。だから案 a は書き写しを先に置いた。
  - id: d
    name: 文書ごとの印にする
    text: |
      判断の記録 ADR-8 の注と、天井の門の設計ノート（docs/design/ceiling-gate.md）が素描した段階 2 の形。
      印を file ごとに持ち、変わった文書だけを古いとする。
    verdict: rejected
    reason: |
      素描そのものが「文書どうしの整合の観点は差分にできないので費用は半分にしかならない」と書いていた。
      実測でもそのとおりで、整合の観点は読む欄まで絞っても 59.6% を読む。文書の単位では直近 40 回の変更で
      中央値 2 文書（9 つのうち 22%）が丸ごと古くなる。案 a は印の単位を節点にするが、
      それが効くのは「周を回すか」と「門が何を止めるか」であって、束の大きさには効かない。
  - id: e
    name: 前の周の合格を持ち越す
    text: |
      前の周でその節点についての所見が 0 だった観点は、節点の要約値が変わらないかぎり前の判定を持ち越す。
    verdict: rejected
    reason: |
      前提が実測で偽だった。材料の束が 1 byte も違わない 2 周で、挙がった所見 7 種のうち両方に出たのは 1 種だけ。
      持ち越しを過去 23 周に当てると所見の 27.6%（止める 3 件を含む）が消える。
      さらに 実態 の観点の入力には実装が入っており、節点の要約値には現れない。
      条 N-3.1 の例外機構には当たらない（旗でも口でもなく、1 byte 違えば効かない）が、
      精度の軸では純粋な損である。束を切らない形では、持ち越しが無くても 1 周の字数は変わらない。

