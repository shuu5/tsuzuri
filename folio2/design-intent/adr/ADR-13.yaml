decision: |
  (0) 本判断の目的関数は精度である。評価の軸は 3 つで、この順＝① 設計文書が道標として正しいか
  ② 見落としてあとから直す回数が減るか ③ 実時間（周の回数 × 1 周の所要）が減るか。
  AI へ渡す字数は副産物として記録するだけで、目的にしない。字数と精度が衝突したら精度を採る。

  (1) 節点と辺を型で定める。節点 = 設計文書の中で id を持つ行と、所見の置き場になる節。欄は 5 つ（id・種類・
  所属 file・欄の要約値・1 行の題）。種類は閉じた一覧とし、その正本は実装の型付きの定数に置く。
  その写しを受ける file は、便が新しく起こす索引の欄の決まりの正本（design-intent/graph.yaml）の生成区間とする
  （要件書 FR19 の対象に足す・条 P-5.1 と P-5.6）。索引の中身そのものは版管理に置かない（毎回組み直す導出物）。
  この正本は入口の棚と天井の正本の文書の一覧に載るので、その 2 file の版上げを伴う。

  (2) 辺の型を閉じた一覧にする。第 1 版の 9 型に、規範文と条をつなぐ構造の辺と、文章から欄へ書き写した辺を
  足して 11 型とする。書き写した辺は、書き写し先の欄（根拠・数値の表の行・関係・参照）のいずれかに入るので、
  実装が別の型として持つ必要は無い（一覧に別行を置くのは後付けの出所を記録に残すためである）。
  伝播は両向きに行う。図の参照は伝播に使わない。観点の読む欄は観点の読む範囲を決めるのに使い、節点間の辺にしない。

  (3) **文章の中の id の言及のうち本物の依存は、走査で救い上げるのではなく型付きの欄へ書き写す。**
  対象は、来歴と生成区間を除き囲む節点の id が取れる言及 800 件のうち、まだ欄になっていない 258 対。
  書き写しは別の起草役が別の枝で起こしており、同じ取り込みが **数値の表に床の規則の行
  「文章の中の id の言及は、型付きの欄にも在ること」** を足す。本判断の便の列は、その行を機械が数える歯から始まる。
  書き写した後に残る言及（自分の id・承認と版の来歴・説明のための言及・節点に結べないもの）は辺にせず、
  注意の先の一覧の「参考」の列に別立てで並べる。床はそれを数えない。

  (3-b) **文章の言及の受け皿になる欄が無い節点の種類には、欄を足す。ただし 1 つの汎用の欄にまとめず、
  受ける相手ごとに閉じた欄を分ける。**
  1 回目の書き写し（2026-09-22・別の枝）で足せた id は 69 で、95 対は欄の意味に合わず除外した。
  そのうち 59 対は **受け皿の欄が無い**ことによる。要件書の根拠の欄も規則の表の行の条の欄も、
  条 1 つだけを指す欄として面の生成器が解いており、そこへ条以外の id を書くと歯が落ちる。
  **欄の意味を広げるのではなく、次の 3 つの欄を足す。**

  （ア）要件の項に **判断の記録だけを受ける欄**（`adrs`）を足す（14 対）。何でも受ける汎用の欄にすると
  根拠の欄との使い分けが人の判断になり、機械で数えられる形に閉じるという向き（条 N-2）から遠ざかる。
  （イ）規則の表の行に **条以外（要件・制約・判断の記録・ほかの行）を指す欄**を足す（33 対）。
  この欄は行 R-4 の双方向の式と母集団に触るので、（ア）より重く、先に本判断でこの欄を定める。
  （ウ）判断の記録に **その判断が生んだ要件・規則を記す帰結の欄**を足す（12 対）。
  **帰結を根拠の欄（`basis`）に書かない。** 判断の記録の面は根拠の欄を章 04「根拠と撤退条件」に描くので、
  そこへ帰結を混ぜると、公開される面で根拠と帰結の区別が失われる。

  欄の決まりは実装の型付きの定数に置き、生成区間へ導出する（要件書・規則の表・判断の記録の欄の決まりは
  既に導出の対象なので、対象の file は増えない）。面の生成器は（イ）（ウ）を当面出さない
  （面を組む file の余地が足りないため・出すのは file を割る便の後）。
  **要件の項がほかの要件・制約を指す 12 対は保留する。** 依存の意味が一定でなく（撤去の前提・
  構造の床への寄せ・制約から要件）、1 つの欄に混ぜると何の辺かを機械で言えなくなる。
  （ア）を入れた後の数えを見てから決める。

  (4) グラフの正本は設計文書そのものであり、索引は導出物である（条 P-6.3）。索引の file を人が書く面は作らない
  （条 P-6.4）。索引が組めない状態で注意の先を問われたら「まだ分からない」を返す（条 P-4.2）。

  (5) **天井の束を影響集合で切らない。** 束は、観点が宣言する読む欄まで絞ったうえで、その観点が読む文書を
  丸ごと渡す。切るのは観点が自分で「読まない」と宣言した欄だけで、それは無関係な欄を落とすことであって
  関係する内容を落とすことではない（精度は同じか上がる）。
  第 2 版は影響集合で束を切る決定を持っていたが、切った先に在る食い違いを観点が見られなくなるので取り下げる。

  (6) **束の先頭に注意の先の一覧を添える。** 一覧は 3 つの列を持つ＝① 変わった節点（前の周の印との要約値の差・
  id と種類と file と題と変わった欄の名）② そこから型付きの辺で 2 段以内に在る節点の id と題
  ③ 型付きの辺で届かないが、変わった節点の id を文章に含む節点（参考）。
  観点の問いの文に 1 文を足す＝「一覧に挙がった所から見はじめること。一覧の外で見つけた食い違いも、
  同じ形で所見に挙げること。」
  これは「ここだけ読め」ではなく「ここから見ろ」である。束を切らないので、一覧の外を読んではいけない理由は無い。
  一覧の大きさは束の 1% 未満（中央値 8,160 byte）。半径を 2 段にするのは、後付けの後に 4 観点の所見の
  79.5% から 85.3% が 2 段以内に入ることと、3 段に広げると近傍が辺を持つ節点のほぼ全部に届いて
  一覧が一覧でなくなることによる。

  (7) **前の周の判定は持ち越さない。毎周、観点に問い直す。**

  (8) 天井の印に節点ごとの要約値の表を足す。**周の引き金**（① 節点の本文の要約値 ② 生成区間と欄の決まりの
  file の中身 ③ 面の生成器と部品目録と様式 ④ 実態の観点についてのみ実装の証拠）が 1 つも変わらない変更では、
  周を要らないと出す。① だけを引き金にすると、過去に「止める」を 4 件生んだ場所（生成区間・欄の決まりの注）の
  変更が天井に 1 度も掛からなくなる。
  **辺を足すだけの変更は引き金に数えない。** 関係の欄に id を足すだけの変更は、条文も規範文も平易文も動かさない。
  地図を良くする作業と床の規則が、天井を高い頻度で走らせる種になってはいけない（持ち主の裁定）。
  この判定は決定的にできる＝便の差分が節点の本文の欄を 1 つも変えず、辺の欄だけを変えたなら引き金にしない。
  欄の分類は実装の型付きの定数に置き、生成区間へ導出する。
  周の回数は加えて、数値の表の開発規律行 D-12 の一括（複数の直しを 1 つの便でまとめる運用）で減らす。

  (9) 門（要件書 FR20）は、**「まだ分からない（印が古い）」の側だけ**を便の file の単位にする。
  印に無い節点が在るか要約値が違う節点が在り、かつその節点がこの便の書き換える file に在るときだけ 2 を返す。
  ほかの file だけを触る便は通す。**「不合格」の側は今のまま repo 全体で止める。**
  所見の直す先は置き場と別の file にあることが多く（過去の「止める」13 件のうち 6 件）、
  置き場だけを鍵にすると直すべき file の便が素通りするためである。
  3 値の意味と、「まだ分からない」が「不合格」より先に立つ順序は変えない。
  通したときも、印の古い節点の数と不合格の節点の数を 1 行で出し、台帳へ記帳する口を持つ。

  (10) 材料の束を観点が宣言する読む欄まで絞るとき、**材料の束の凍結 anchor を folio の実装に依らずに作り直す。**
  今の独立性は「正本を byte のまま写す」ことから来ており、欄を切り出すと写しが folio の産物になる
  （条 P-10.2 が禁じる形に近づく）。欄を切り出す独立の script を anchor と一緒に凍結し、
  維持できなくなったらその検査の結果を「まだ分からない」に落とす（条 P-10.3）。

  (11) 全体像を安く速く出す口を置く。節点の索引と辺の索引を 2 つの表で出し、合計およそ 36,000 byte
  （設計文書の正本の約 6.5%）。これは字数の節約ではなく精度と実時間の手である＝AI が何が在るかを知って始められ、
  全体像を得るまでの時間が短くなる。
  CLAUDE.md には載せない（数値の表の行 R-2 の上限 8,000 byte を超えるため・条 P-14.3）。
  代わりに、席が始まるときの 1 行の口（folio hello）に、設計文書が在るときの 1 行を足す。

  (12) 台帳とは読み取り専用でつなぐ。台帳へは 1 行も書かない（条 P-5.4）。読むのは台帳の行の受入の欄が持つ
  設計への案内（pointer）1 種類だけ。**台帳由来の欄は床の合否と門の判定に使わない。面と知らせにだけ使う。**
  台帳は版管理の外にあり、読めるが古いときは「まだ分からない」ではなく違う値を返すので、
  条 P-3.1 の「決定的」と条 P-10.1 の凍結 anchor に噛み合わないためである。
  床と門が読むのは版管理の中にあるもの（契約表の行・着地の commit の末尾の印）だけにする。
  契約が受け付けられた後にその要件の節点が変わったら「要再読」を席と器へ知らせる（便を止める仕掛けではない）。

  (13) 実装の状態を要件書の注から導出物へ移す。**3 値（着地・便は在るが印が無い＝まだ分からない・便が無い）は
  機能要件にだけ当てる。非機能要件は対象外とし、その注は手書きのまま残す**（非機能要件の「未達」は便の有無ではなく
  閾値に対する測定の結果であり、この 3 値では表せない）。
  **導出した状態を要件書の面へ出す便を、注から落とす便と同じ列に置く。**
  落とす文と残す文が同じ文に同居するので、切り分けは「状態の語を含む文は、出所の括弧を残して状態の語だけを
  置き換える」とし、8 件の注について落とす前後の字を便の契約表の行に 1 本ずつ書く。
  実態との整合の観点が読む相手を注から導出物へ替える（天井の正本の版上げを要する）。

  (14) **本判断は判断の記録 ADR-8 の決定 (4)（天井が合格でない間は設計文書の便の着地を既定で止める）を狭める。**
  狭めるのは「まだ分からない」の側だけだが、既定で止める範囲が repo 全体から便の file へ変わるので、
  決定の範囲の改訂である。判断の記録どうしの改訂を記す型付きの欄が今は無い（改訂の範囲の欄は条を指す欄で、
  判断の記録を指せない）ので、**その欄を欄の決まりへ足す便を列に入れる**（実装の型付きの定数の改訂・便 1 本）。
  その便が着地したら、本判断はその欄で ADR-8 を指す行を持つ。それまでは帰結の文章だけが記帳である。

  (15) 憲法の条文は 1 字も改訂しない。運ぶのは要件書の版上げ（新しい要件 3 本と FR17・FR20 の改訂と
  FR11・FR13 の注の改訂）と、入口の棚と天井の正本の文書の一覧の版上げと、天井の正本の版上げと、
  判断の記録の欄の決まりの版上げと、数値の表の新しい行（書き写しの取り込みが運ぶ）と、
  語彙の追加（節点・辺・注意の先・周の引き金の 4 語）である。
  条文の改訂が要ると分かったら、その時点で本判断を止めて条 A-2 の手順へ移す。

  (16) 便の列は 12 本で、順は精度の軸と依存の順とする。⓪-1 要件の項に判断の記録の欄を足して 14 対を写す
  ⓪-2 規則の表の行の欄と判断の記録の帰結の欄を足して 45 対を写す・移す ① 書き写しの床の歯 ② 索引の口と索引の欄の決まりの正本
  ③ 全体像の出力と席が始まるときの 1 行 ④ 束を読む欄まで絞る（凍結 anchor の作り直しを含む）
  ⑤ 節点ごとの要約値の印と周の引き金 ⑥ 注意の先の一覧 ⑦ 判断の記録の欄の決まりに判断どうしの改訂の欄
  ⑧ 要件書の面を組む file を割る ⑨ 実装の状態の導出と面への出力と注の直し ⑩ 門の単位の変更。
  ①〜⑤ と ⑦ ⑧ は設計文書の正本を書き換えないか持ち主の承認欄で発効するので、門の対象外である。

consequences:
  - 天井の 1 周が読む量は、今の束に対しておよそ 42%（読む欄まで絞った 862,970 byte に、注意の先の一覧の中央値 8,160 byte を足した値）になる。第 2 版は束を切って 22% としていたが、その差は精度で払う代金である。実時間の節約は 1 周の中ではなく周の回数で取る。
  - 直近 40 回の変更のうち 14 回は周そのものが要らなくなる。決定 (8) の引き金を ② ③ ④ へ広げ、辺だけの変更を除いた後に何回残るかは まだ分からない（便が着地してから実測して台帳へ記帳する）。
  - 辺の後付けの 1 回目（足した id 69・2026-09-22）で、所見が指す相手が 2 段以内に入る割合は 整合 63.6% から 69.3%・忠実さ 75.0% から 82.5%・実態 72.4% から 79.3% へ上がり、読みやすさは 76.5% で据え置き。3 段以上に落ちる「止める」の所見は 10 件から 9 件へ減る（整合が 4 件から 3 件）。型付きの辺は 721 本から 790 本になる（足した 71・消した 2）。ただし足した 69 のうち 18（後ろ向きの辺 12・否定文だけを出所にした 6）は誤りとして外すので、確定値はそれより下がる。279 対すべてを写せたときの見積は 整合 79.5% で、差は受け皿の欄が無い 59 対による。欄を足して残りを写せばその見積へ近づくが、それは見積であって実測ではない。残る取りこぼしは撤退条件の 1 つ目と 2 つ目が数える。
  - 数値の表に床の規則の行が 1 行増える（別の枝で起草済み・本判断の枝には未着地・書き写しの取り込みが運ぶ・裁定 id と時刻を行に付ける・条 P-17.1）。機械の歯は本判断の便の列で足すので、それまでこの行の判定は「まだ分からない」である。歯が入った後は、文章で id を指したなら型付きの欄にも書くことが機械で強制される。
  - 欄が 3 つ増える。要件の項に判断の記録を受ける欄、規則の表の行に条以外を受ける欄、判断の記録に帰結の欄である（欄の決まりは実装の型付きの定数・生成区間へ導出する）。3 つとも既に導出の対象の file なので対象は増えず、版上げは生成区間の再生成と書き写しのぶんである。規則の表の行の欄は行 R-4 の母集団に触るので、その行の改訂に裁定 id と時刻が要る（条 P-17.1）。面の生成器は後ろの 2 つを当面出さない。
  - 要件書は新しい要件 3 本（機械が読む id の索引・全体像の出力・注意の先の一覧）を持ち、FR17（材料の束）と FR20（門）の規範文が改訂され、FR11 と FR13 の注が実装の状態の導出へ置き換わる。既存の要件の番号は 1 つも動かない（条 P-7.1）。
  - 索引の欄の決まりの正本（design-intent/graph.yaml）が 1 本増える。入口の棚と天井の正本の文書の一覧がその版上げを伴う。天井が読む文書は 9 から 10 になる。
  - 天井の正本は 2 度版が上がる（観点の問いの文に注意の先の 1 文・実態の観点の読む相手を導出物へ）。観点の数（4 つ）と重さの値域は変わらない（条 N-5）。
  - 語彙に 4 語（節点・辺・注意の先・周の引き金）が増える。
  - 節点ごとの要約値の表を持つ印はおよそ 16 キロバイトになる（今は 976 byte）。生成物 1 file の上書きなので、版管理の履歴は行単位の差分として読める（条 P-6.2）。
  - 判断の記録の欄の決まりに、判断の記録どうしの改訂を記す欄が 1 つ増える（実装の型付きの定数の改訂・生成区間の導出）。
  - 本判断は判断の記録 ADR-8 の決定 (4) を狭める。狭めるのは「まだ分からない（印が古い）」の側だけで、「不合格」の側は今のまま repo 全体で止める。第 1 版の帰結は「ADR-8 の決定を 1 つも捨てない」と書いていたが、それは偽だったので取り下げる。
  - 要件書 FR11・FR13・FR14 の未実装の 3 つが、本判断の便の列の中で実装される（台帳の起票を閉じる）。床の穴（要件と判断の記録と受入基準の id の消失と改番を数える口が無い）も、節点の索引が在れば数えられるようになる。
  - 注意の先を渡したときに観点の AI が実際に精度を上げるかは、まだ測れていない。測ったのは「所見が指す相手が一覧に入るか」であって「一覧を渡された AI が所見を立てられるか」ではない。注意の先の便の着地後の最初の 3 周で、一覧に挙がった節点に置かれた所見の割合を数えて台帳へ記帳する。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 へ記帳する。
    (1) 注意の先が当たらない: 重さが「止める」の所見のうち、注意の先の一覧（変わった節点・2 段の近傍・参考）に
    1 つも挙がっていなかった節点に置かれたものを数える。5 件で一覧を捨て、束だけを渡す形に戻す
    （束は元から切っていないので、捨てても観点が見られる範囲は減らない）。
    (2) 辺の型が足りない: 上の 1 で数えた所見のうち、書き写しの後も型付きの辺で 3 段以上離れていたものを数える。
    3 件で、辺の型を足すか設計を根本から見直す設計ノートを起こす。
    (3) 辺の追加が周を呼ぶ: 決定 (8) の「辺を足すだけの変更は引き金に数えない」を入れた後に、
    辺だけが変わった変更に由来する「止める」の所見が出たら数える。2 件で辺の追加も引き金に数える形へ戻す。
    (4) 索引が実時間を取り戻さない: 索引を組む口と注意の先を組む口の所要の合計が、1 周の所要の 1 割を超えたら数える。
    実測 3 回で注意の先の一覧を止める（索引と全体像の出力は残す）。
    (5) 門を緩めた対価: 門が「まだ分からない」を出さずに通した便のうち、着地の時点で印に不合格の節点が
    残っていた便の本数を数える。2 本で決定 (9) の緩めを捨て、判定を repo 全体へ戻す。
    単位を周ではなく便の本数にしたのは、周が起きない失敗の形を数えるためである。
    (6) 周の引き金が漏れる: 決定 (8) の引き金で「周は要らない」と出した後に、次の周でその変更に由来する
    「止める」の所見が出たら数える。2 件で引き金の判定をやめ、設計文書の file が 1 つでも変われば周を回す形に戻す。
    (7) 数えられない回が数値の表の行 R-7 の回数を超えたら、本判断の撤退条件の判定を「まだ分からない」に落として
    持ち主へ渡す（条 P-4.2・P-11.1）。

approval: {who: 持ち主, date: 2026-09-22, ruling: f2-648 notes 2026-09-22 11:42 JST（発効の承認・一括 11 と辺の後付けと判断の記録 ADR-13 を 1 つの承認で発効する承認要求への回答・4 点は推奨どおり）, verbatim: 全部承認する, surface: R-8}
note: |
  下調べの設計ノート = docs/design/graph-and-incremental-ceiling.md（第 3 版・実測の手順と数え直しの方法を節ごとに添えてある）。

  【第 3 版の由来】持ち主の目的関数の裁定（2026-09-22 10:1x〜10:2x JST・対話面 R-8・台帳 f2-648 notes に逐語）。
  要点は 4 つ。① 目的は精度である＝現実的な開発時間で、高い精度の道標となる設計文書を作り維持すること。
  ② 天井の周をひたすら回すような実時間の無為な消費は不可。③ AI へ渡す字数の削減は目的ではない
  ＝要らない情報を落として精度が上がるなら可、精度と引き換えに字数だけ減らすのは不可。
  ④ 節点を増やして辺を完全にする案は、精度が上がり手戻りが減るなら良いが、天井を高い頻度で走らせる種になるなら微妙。
  この裁定で、第 2 版の主な物差し（1 周あたりに読む字数）が物差しから外れた。
  第 3 版で変えた決定は 4 つ。
  (a) 影響集合で束を切る決定を取り下げ、束を切らずに注意の先の一覧を添える形にした（決定 (5)(6)）。
  (b) 文章の中の id の言及 258 対を型付きの欄へ書き写すことと、それを維持する床の規則を決定に入れた（決定 (3)）。
  (c) 辺を足すだけの変更を周の引き金に数えないと決めた（決定 (8)・裁定 ④ への答え）。
  (d) 目的関数そのものを決定 (0) に置いた。
  第 2 版が持ち主へ上げた 5 点のうち「半径をいくつにするか」は問いでなくなった（束を切らないので、半径は
  一覧の広さでしかなく、狭くても情報は失われない）。残る 4 点は設計ノート §10.2 に置いて推奨を添え、
