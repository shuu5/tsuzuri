# folio2 判断の記録 ADR-31 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。人が読む面は判断の記録の面（adr-31.html・生成物・手で直さない）。
# 状態: accepted（起草 2026-09-28・orchestrator 席の起草役〔opus 5.5〕・改訂 a = 独立の検証 adr31-verify.md への席の裁定 adr31-rev-a.md・改訂 b = 再検証の R1・R2・N6・改訂 c = tsuzuri の目通しの後の計画だけの行の 2 欄と判断の表の範囲）。accepted = 持ち主の承認 f2-648 notes 2026-09-28 10:29 JST（逐語「全部承認する」）。憲法の条文は 1 字も変えない。
# 起点: 台帳 f2-648.267・依頼 ~/.local/share/folio2/handoff-2026-09-28/adr31-brief.md・起草の記録 adr31-draft.md（実測の表・script は adr31-scripts/）。

id: ADR-31
title: 決定の欄に台帳の裁定 id を求め、計画の設計ノートの行の索引を契約表から導き、引かれた裁定 id を形の種類つきで書き出す（AI の席の文書運用の強制のうち folio の持ち分）

status: accepted
date: 2026-09-28

plain: |
  外の利用者（tsuzuri）の設計の席は、約 35 行ぶんの計画と自分の判断を版管理の外のメモに置き、あなたへの問いを台帳でなく会話で出しました。行はどれも形が正しく、機械の検査を全部通りました。欠けていたのは行の上の層（計画・判断・裁定の反映）で、それを読む検査が無かったのです。この判断は、直す 5 段のうち folio が受け持つ 3 つを決めます。
  1 つ目。決定を書く欄（承認欄・規則の表の行の裁定の欄など）には、台帳の番号が要ります。番号が 1 つも無ければ機械が止めます。ただし機械が見るのは番号の形だけで、会話の決定を覚え書きの番号の下に写せば通ってしまいます。それを止めるのは器（scribe2）で、便が新しく書いた決定の欄の番号が台帳の問いの記録に本当に在るかを確かめます。
  2 つ目。置き場が規則の表に「計画のノートはこれ」という名札の行を置くと、その設計ノートに、全部の契約表から機械が書く行の一覧（手で直さない区間）と、まだ契約の無い計画だけの行と、判断の表を持たせ、食い違いを機械が止めます。一覧と計画だけの行の節は、名札の行が指すノートの外に置くと止まります。
  3 つ目。文書が引いている番号を、形の種類（問いの番号・notes の日時・台帳の番号だけ）をつけて 1 件 1 行で書き出します。台帳と突き合わせるのは器です。

context: |
  (1) 外の利用者（tsuzuri・持ち主の裁定 2026-09-27 で folio2 の唯一の外の利用者）の持ち主は、裁定（t3-hub.57.1・逐語「どちらも推奨で進めて」・案 A）で 5 段を順に進めると決めた: ① 裁定 id の実在（床は形・器は実在）② 計画の設計ノートの必須化（置き場の欄 key の行で有効にし、行の索引は契約表から導く生成区間）③ 器は床が清浄なときだけ受け付ける ④ 反映先の型と未反映の突き合わせ ⑤ 会話の問いを断る guard。folio の持ち分は ① の形・② の全部・④ の書き出しで、③⑤ と ① の実在と ④ の突き合わせは器の持ち分（folio2 の答え = handoff-2026-09-28/t3-hub56-reply.md）。外の利用者の裁定は folio2 の持ち主の承認の代わりにならない（条 P-12.1）。
  (2) 今の床が裁定 id の形（台帳の id の語を含むか）を見るのは、判断の記録と設計ノートの承認欄・憲法の改訂来歴・凍結 anchor の承認一覧だけである。規則の表の行の裁定の欄と、要件書・入口・天井の正本・相談窓口・索引の欄の決まりの承認欄の行は見ない（条 P-12 と P-17 の機構の注・台帳 f2-648.187）。設計ノートの承認欄は値が一覧の形だと素通りする（f2-648.242）。条 P-17 の差分を数える口は無く、規則の表の行を消しても床には見えない。
  (3) 決定の欄を全数で数えると、本流（0fb780e）は 153 欄で台帳の id の無いものは行 R-10 と D-8 の 2 欄（初版の答えの記号だけ・G16=A と G14=A）、外の利用者の写し（f68e8d3 と同じ設計文書の 0bc6f45）は 55 欄で 0 欄である。外の利用者の 55 欄はどれも最初に切り出す id が覚え書きの台帳の id（t3-hub.1 か s2-07l.214）で、器の問いの形（t3-hub.56:20260927T2259Z-1）を持つ欄は 5 つだけ、それもいつも 2 つ目以降に出る。folio2 の形は台帳の id と notes の日時（f2-648 notes 2026-09-28 07:18 JST）である。
  (4) 外の利用者の計画のノート（surface-plan）は 7 節とも散文である。残りの行の節の 53 行のうち 4 行は既に第 6 波のノートの契約表に在り、順の節と依存が名指す id のうち 1 つ（g-seat-split）はどこにも無い（字の拾いの参考値）。置き場の契約表は 9 ノート 97 行である。
  (5) folio2 自身の契約表は設計文書（docs/design の md）に在り、folio の設計ノートの母集団の外である。folio2 の計画と現在地は台帳 f2-648 の notes と版管理の外の引き継ぎ file に在る。

decision: |
  (0) 本判断は憲法の条文を改訂しない。器の持ち分（実在の確かめ・受付の床・反映先の型と突き合わせ・問いの guard）と外の利用者の側の約束は本判断の外である。
  (1) **裁定 id の形の床（便 A）。** 決定の欄を次の閉じた一覧とする（実装の定数・欄の決まりの生成区間に写す）: 憲法の発効の承認と各条の改訂来歴の ruling・規則の表の全行の ruling・判断の記録の承認欄の ruling・設計ノートの承認欄の各行の ruling・要件書・入口・天井の正本・相談窓口・索引の欄の決まりの承認欄のうち役が 作成 と レビュー でない行の stamp・判断の表の各行の ruling（便 B が足す）。憲法の各条の前の版との対応（supersedes_v1）の裁定の欄は一覧に入れない。この欄は前の版（folio v1）との対応の閉じた来歴で、憲法の初めの発効の時に固まり、新しい決定を書き込まない（例 条 P-2 の「裁定 #4」は持ち主の裁定＝f2-648 notes 2026-09-12 08:55 JST の推奨どおり採った 9 点の 4 つ目）。床（folio check）は各欄の値から決定 (3) の関数で裁定 id を 1 つも切り出せなければ違反とする（どの形の種類で足りるかは床で決めない）。値が字でない（一覧・表）ときも違反とする。値が骨格の印（未記入）のときは、骨格が書く欄（憲法の発効の承認と規則の表の行）に限り まだ分からない とし（裁定の前・条 P-17.3）、判断の記録と設計ノートの承認欄の未記入は今のまま違反とする。全ての置き場に掛け、選ぶ行を持たない。folio2 の行 R-10 と D-8 は、便 A の着地の前に、裁定の欄に本判断の承認の裁定 id と日付を書き、裁定の日付の欄（ruled_at）をその日付にする（行 D-18 の最新の 1 つ・条 P-17.1・行 D-17 の承認は本判断の承認に含める）。
  (2) **計画の設計ノート（便 B）。**
  (ア) 閾値の行の欄（key）の閉じた一覧に値（plan-note）を足す。この値の行を計画の名札の行と呼び、行の値は計画のノートの文書 id、種別は生成時の検査（build-check）、段は事後（post）である。名札の行が置き場に無ければ (エ) を掛けない（計画のノートを持つかは置き場の持ち主が行で決める）。名札の行が 2 本以上か、値が文書 id の形でなければ まだ分からない（行 R-19 の欄と同じ）。規則の表の欄の決まりの key の注は、行が無いときの扱いを key ごとに書き分ける（note-chapters は まだ分からない・plan-note は掛けない・生成区間）。
  (イ) 計画のノートは設計ノートの 1 つで、文書の種類を増やさない（条 P-5.3・N-5.1）。節の型の閉じた一覧に 3 つ足す（条 P-2.4・設計ノートの欄の決まりの type_enum_ruling は本判断の承認を引く）: 行の索引（row-index・生成区間・行 = id と所属の文書 id）・計画だけの行（row-plan・人が書く・行 = id と what、任意の depends・ruling・note・大きさ〔size〕・書く file の一覧〔files〕）・判断の表（decision-table・人が書く・行 = id・text・ruling）。計画だけの行の大きさ（字）と書く file の一覧（字の一覧）は、契約の行ができるまで運ぶ手書きの写しで、床は形だけを見て値を器の語と照らさない（folio は器の欄の一覧を持たない・判断の記録 ADR-3 決定 (2)）。契約の行ができたら契約の行が正本で、計画だけの行は (エ) の二重の決まりで外れる。判断の表に置くのは台帳に記録の在る判断（持ち主の裁定か、台帳に記帳した席の裁定＝例 folio2 の notes の席の裁定）で、台帳に記録の無い判断は散文に残り床の外である（書かれない会話の決定が機械に見えないのと同じ残り）。行の索引と計画だけの行の節は、名札の行が名指す計画のノートにだけ置け、ほかに在れば名札の行の有無に関わらず違反とする（名札の行を消すと、残った節が床に見える）。判断の表はどの設計ノートにも置ける。
  (ウ) 行の索引は、置き場の設計ノートの契約表の行（folio derive と同じ母集団と読み手）から、file 名の順・表の中の順に導く。行の欄は id と文書 id だけで、器の欄（題・大きさ・依存）は写さない（判断の記録 ADR-3 決定 (2)）。書くのは folio derive --write（契約表の導出物と同じ回・全部か無しか・器の欄の決まりの file が無い置き場では書けない）で、folio check と folio derive --check が同じ関数で導き直して比べ、食い違えば違反とし、書き直す命令を理由に出す（条 P-6.3・P-15.2）。
  (エ) 名札の行が在るとき床は次を数える: 計画のノートが在って状態が発効（effective）である（無い・下書きなら まだ分からない）・行の索引の節がちょうど 1 つで導出と一致する・計画だけの行の id が一意で、行の索引に無い（両方に在れば違反＝契約の行を書いたら人の節から外す）・計画だけの行の depends の id が行の索引か計画だけの行に在る（宙に浮いた id は違反）・判断の表の ruling が決定 (1) の形を持つ。計画の順は計画だけの行の節の並びで表し、depends は中身の依存だけを書く（同じ file を書く行の直列は器が持つ）。行の索引の全行が順に出ることは求めない。
  (オ) 現在地（どの行が着地したか）は器が導いて面に結ぶ持ち分で、本判断の外である。
  (3) **裁定 id の文法（決定 (1) と (4) が同じ関数で使う）。** 関数は欄の値から裁定 id を全部切り出し、各々に形の種類（閉じた一覧 question・notes-time・bead）を付ける。語頭（頭か、前の字が英数字・「_」・「-」・「.」でない位置）の台帳の id（英小字 1・数字 1・「-」・英数字の並びに「.数字」の段を何段でも）を 1 つの裁定 id とし、直後に器の問いの印（「:」年月日 T 時分 Z「-」連番）が続けばそれを含めて問いの形（question）、台帳の notes の日付か時刻（分の 1 桁が x の概数を含む）と日本時刻の印（JST）が続けばそれを含めて日時の形（notes-time）、どちらも無ければ台帳の id だけの形（bead）とする。置き場ごとの見出しの字（例「裁定 id =」）は名指さず、形だけで拾う。欄の決まりの ruling_pattern とその注はこの文法の写しに直す（生成区間）。本流と外の利用者の写しで今の判定と「1 つ以上在るか」の答えが割れる欄は 0 である。
  (4) **書き出し（便 C）。** folio check --emit-rulings は、床と同じ読み手と歩き手で決定の欄を読み、決定 (3) の関数で切り出した裁定 id を全部、1 件 1 行の JSON（JSON Lines）で標準出力に出す。欄は 7 つ（ruling = 切り出した字・form = 形の種類・bead = 台帳の id の部分・node = 欄を持つ節点の id で、節点の無い欄〔承認欄の行など〕では null・file・line・field）である。違反は標準エラーに出し、終了コードは素の床と同じとする（--emit-amends と同じ形）。標準出力の一覧が全数なのは終了コードが 0 のときだけである。標準出力は JSON の行だけで「#」で始まる注の行を出さず、要約と違反は標準エラーに出す。置き場の約束の形（外の利用者なら question）の裁定 id が台帳の問いの記録に解けるかと、反映先の型との突き合わせは器が持つ。
  (5) **順と便。** 便は A → B → C の順（外の利用者の順と同じ）で、契約表は本判断の承認の後に書く。便 B は 3 つの節の型の面の描き方を含み、差分が審査の上限を超えるなら型・床・書く命令の便と面の便に割る。外の利用者が名札の行を置くのは便 B の全部の着地の後である。
  (6) **folio2 自身。** 便 A は folio2 にも掛かる。名札の行を folio2 に置くかは持ち主が決める（置いても索引は見本のノートの行だけ＝文脈 (5)）。
  (7) **前の判断との関係。** 置き換える決定は無く、前の判断の記録の本文は変えない（判断の記録 ADR-30 決定 (1)）。判断の記録 ADR-16 決定 (1) の M3 の範囲に、決定の欄の形の床・計画のノートの床と索引の導出・裁定 id の書き出しを足す（ADR-16 の本文は変えない・ADR-21 決定 (1) と同じく後の判断の記録が範囲を動かす形）。3 つの節の型の面の描き方は M3 の外で、設計ノートの面の要件 FR9 の範囲として運ぶ。判断の記録 ADR-3 決定 (1) の節の型の一覧に 3 つを足す。便 A の着地と同じ取り込みで、条 P-12 と P-17 の機構の注（条文の外・条 A-2.2）の「数える範囲」を直す。

options:
  - id: a
    name: 決定の欄の形を全置き場に掛け、計画のノートは名札の行で選び、索引は導出の命令が書き、書き出しは床の命令の旗にする（採る）
    text: 決定 (1)〜(7) の形。
    verdict: adopted
    reason: 形の床は本流で 2 欄・外の利用者で 0 欄しか落とさず、選ぶ行が要らない。索引は契約表からの導出だけで手の 2 面を作らない（条 P-6.4）。書く命令は契約表を直した後に席が既に撃つ folio derive --write で、手順が増えない。書き出しは床と同じ読み手と関数を通るので、床の数えた欄と器の読む欄が割れない。
  - id: b
    name: 便 A も名札の行で選ぶ（選択参加・opt-in）
    text: 決定の欄の形の検査を、置き場が行を置いたときだけ掛ける。
    verdict: rejected
    reason: 選ぶ理由が無い（落ちるのは folio2 の 2 欄だけ）。選ぶ行は検査を外す旗として働き、規則の表の行を消しても床には見えない（条 N-3.1・文脈 (2)）。
  - id: c
    name: 計画のノートに行の一覧を手で書き、契約表と床で突き合わせる
    text: 計画のノートの行の一覧を人が書き、各ノートの契約表との一致を床が数える。
    verdict: rejected
    reason: 同じ中身を 2 つの面で人が書き、検査で揃える形になる（条 P-6.4）。導出にすれば「計画に無い行」と「契約の無い計画の行」がそもそも起きない。
  - id: d
    name: 行の索引を folio schema --write・新しい命令・面の組み立てのどれかで作る
    text: 生成区間を schema の命令が書くか、索引の専用の命令を足すか、正本に持たずに面だけで組む。
    verdict: rejected
    reason: schema の命令は実装の定数の写しで（判断の記録 ADR-9）、契約表を直した後に撃つ習慣が無い。新しい命令は床を 5 本にし、器と利用者の撃ち方を変える。面だけで組むと、YAML を読む席と天井に索引が届かない。
  - id: e
    name: 裁定 id を器の問いの形（question）だけに絞る
    text: 決定の欄が器の問いの形の裁定 id を持つことを床が求める。
    verdict: rejected
    reason: 外の利用者の 55 欄のうち 5 欄・本流の 153 欄のうち 0 欄しか満たさず、前の記録は書き換えられない（前の裁定に器の問いの番号は無い）。どの形を約束とするかは器と各置き場が決め、器は便の差分で新しく書かれた欄にだけ掛けられる（形の種類は書き出しが渡す）。
  - id: f
    name: 書き出しを索引の口（folio graph --print --rulings）に置く
    text: 索引の命令に旗を足し、節点ごとの行の番号の作りを使って書き出す。
    verdict: rejected
    reason: 索引の命令が読むのは憲法・規則の表・要件書・判断の記録だけで、決定の欄のうち本流 153 欄の 83 欄（承認欄の行と憲法の発効の承認）・外の利用者 55 欄の 12 欄と判断の表の全行を読まない。足すと 1 つの命令が 2 つの母集団を持つ。床の命令なら決定の欄の母集団が便 A と同じ読み手で揃う。

basis: [P-1, P-2, P-3, P-4, P-5, P-6, P-12, P-13, P-15, P-17, A-2.2, N-2, N-3, N-5, R-8, R-10, R-19, D-8, D-17, D-18, FR5, FR9, FR11, FR14, ADR-3, ADR-9, ADR-11, ADR-16, ADR-21, ADR-30]
produced: [FR26, FR27, AC28, AC29]

consequences:
  - 床だけでは会話の経路を止めない。床は形の種類を問わず裁定 id が 1 つ在れば通すので、会話の決定を覚え書きの台帳の id（例 t3-hub.1）の下に写せば、床の形の検査も台帳の id の実在も通る。止めるのは器で、便の差分で新しく書かれたか変わった決定の欄について、置き場の約束の形（外の利用者なら question）の裁定 id が台帳の問いの記録に解けるかを見る（本判断の外）。
  - 名札の行と行の索引・計画だけの行の節を一緒に消す変更は、今の床には見えない（設計ノートに封が無く、条 P-17.2 の差分の検査は未実装・閉じるのはその検査か器）。
  - 文書のどこにも書かれない会話の決定は、どの機械の検査にも見えない（天井か持ち主だけが気づける）。
  - 要件の散文の中の裁定（外の利用者の要件書は承認欄が空で、裁定は散文に在る）は決定の欄でないので数えない。
  - 骨格（folio init）の直後の置き場は決定の欄 4 つが 未記入 で、床の まだ分からない が増える（違反にはしない）。
  - 名札の行を置いた置き場では、契約表の行を足す・消すたびに、folio derive --write を撃つまで床が落ちる（導出物と同じ手順）。器の欄の決まりの file の無い置き場は索引を書けず、床は まだ分からない のままである。

