  【出所】台帳 f2-648.267。外の利用者（tsuzuri）の答え（裁定の逐語・裁定 id の形・契約表の置き場・計画だけの行の二重を床が落とす求め）は handoff-2026-09-28/tsuzuri-57-answers.md の写し。改訂 a は独立の検証（adr31-verify.md・blocking 6・非 blocking 5）への席の裁定（adr31-rev-a.md）。
  【器の持ち分の 1 文】器は、便の差分で新しく書かれたか変わった決定の欄について、書き出しの form が置き場の約束の形か、その裁定 id が台帳の問いの記録に解けるかを見る（外の利用者の約束は question）。
  【検証の要点】条文を改訂しないので A-2.3 の検証の記録は要らない。起草役の自己反証: (i) 名札の行は検査を外す旗か → 名札の行を消しても、行の索引と計画だけの行の節が残れば決定 (2)(イ) が落とす。名札の行と行の索引・計画だけの行の節を一緒に消すと、今の床には見えない（設計ノートには封が無く、条 P-17.2 の規則の表の行の差分の検査は未実装）。この穴を閉じるのは条 P-17.2 の差分の検査か、便の差分を見る器である。(ii) 形だけの床は番号らしい字で通る → 通る（帰結の 1 つ目）。止めるのは器で、そのために書き出しは形の種類を全部渡す。(iii) 計画だけの行と索引の二重 → 床が落とす（決定 (2)(エ)）。
  【実測】script は adr31-scripts/（measure-a.py・forms.py・plan-rows.py）。骨格の直後の置き場で決定の欄 4 つ（憲法の発効の承認と規則の表の 3 行）が 未記入。一覧の外に置いたもの: 憲法の supersedes_v1 の裁定（folio2 の条 P-2 に 1 件「裁定 #4」＝f2-648 notes 2026-09-12 08:55 JST・初めの発効で固まった来歴）・支度表の承認欄（設計文書の正本に数えない）・憲法の rationale の ref（根拠の欄）。
