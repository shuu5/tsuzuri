  - {target: ADR-13, decision: (8), kind: narrow, summary: 周の引き金を節点の本文と生成区間と面の生成器と実態の証拠の 4 つの変化から、規範の欄の要約値の変化に狭める（辺を足すだけの変更を数えないことは変えない）}

consequences:
  - 周の回数は、過去 25 周への模擬でおよそ 4 周（16%）減る。減るのは合格の後に引き金の外の変更だけで始まっていた往復で、不合格の後の往復（26 周のうち 19 周）は減らない。実時間の大きな節約はこの判断からは出ない＝周の回数の本当の駆動（4 観点とも合格する割合がおよそ 0.27・止める の 74% が前から在った字）への手は別の判断で問う。
  - 注・平易文・図・生成区間の字は、書いてから次の引き金の周まで天井に読まれない。模擬ではその間に見つかるはずだった支持の 止める が 4 件遅れる。遅れの間は門の理由の行と面の天井の名札が「まだ読まれていない」と出す。遅れが便の手戻りに化けた数は撤退条件の (1) で数える。
  - 判断の記録 ADR-13 の決定 (8) が引き金に入れていた生成区間と欄の決まりの注は、次の引き金の周まで読まれない。ADR-13 は、そこが過去に 止める を 4 件生んだので引き金に入れていた。本判断は「読まない」でなく「後で読む」なので、決定 (8) の懸念（天井に 1 度も掛からない）は起きない。
  - 印は 1 行（引き金の要約値）増える。便アの着地の直後は、今の印に引き金の要約値の欄が無いので門は まだ分からない を返し、最初の周で印を付け直す。
  - 要件 FR20 の規範文と受入基準 AC18 の場合の数が変わる＝要件書の版上げ。既存の要件の番号は 1 つも動かない（条 P-7）。
  - 規則の表の開発規律行 D-12 の何を数えるかの欄が変わる（裁定 id と時刻を付ける・条 P-17.1）。
  - 天井の正本の生成区間に引き金の一覧の写しが 1 つ増え、版が上がる。観点の数と重さの値域と問いの文は変わらない（条 N-5）。
  - 語彙の「周の引き金」の定義が、ADR-13 の 4 つから本判断の規範の欄 5 つと手順の引き金 2 つに変わる。
  - 台帳 f2-648.145（周の引き金の判定の口）は便アに置き換わり、f2-648.146（門の単位）は便アの着地の後に要否を問い直す。台帳の書き換えは席が行う。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 の notes に記帳する。窓は、便アが着地して引き金の要約値を持つ印が初めて付いた時刻から 7 日とする。
    (1) 遅れが手戻りになる: 引き金の周で見つかり反証で支持された 止める のうち、根拠の字（空白を除き、「…」で割った 6 字以上の断片がすべて在るか）が
    その周の直前の印の周の正本に無く、印の後の引き金の外の変更で入ったものを数える。2 件で本判断を捨て、門の「古い」の判定を
    正本の要約値（今の厳格な形）へ戻す（便 1 本・印の欄は残す）。過去 25 周への模擬ではこの数は 5 日で 1 件だった。
    (2) 節約が無い: 窓の 7 日のうちに、門が「印の後に引き金の外の変更が在る」を理由に 通す を返した便が 1 本も無ければ、
    本判断は周を 1 つも減らしていないので、門の式を今の厳格な形へ戻し、引き金の欄と口を外す判断の記録を起こす（使われない仕掛けを残さない）。
    (3) 引き金が漏れる: 引き金の外だけが変わった区間の後の最初の引き金の周で、根拠の字がその引き金の外の変更で入った規範の欄
    （決定 (1) の 5 つ）に 止める が立ったら、決定 (1) の一覧に穴が在るので、その欄を一覧に足す改訂を持ち主に問う（1 件で問う）。
    (4) 数えられない回が数値の表の行 R-7 の回数を超えたら、本判断の撤退条件の判定を「まだ分からない」に落として持ち主へ渡す（条 P-4.2・P-11.1）。

