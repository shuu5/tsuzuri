# 状態: accepted（起草 2026-09-24・orchestrator 席 fable 5.1 の起草役・発効 2026-09-24 11:51 JST 持ち主「全部推奨で」= 報告 8102 の 8 問への回答・問 1 = 案 a）。憲法の条文は 1 字も変えない（条文を改訂しない判断）。
# 起点: 持ち主の裁定 2026-09-24 09:46 JST「裁定はすべて承認する」（f2-648 notes・対話面 R-8）が、席の推奨「天井の周を一括ごとから版の発効ごとへ絞る判断の記録を起こす」を承認した。引き金そのものの裁定は、この判断の記録の承認で行う。
# 敵対的検証（条 A-2.3・起草役とは別の文脈の検証役）= docs/design/adr-18-grill.md。承認要求の要旨と、承認の後に席が書く欄の表 = docs/design/adr-18.md。
# 起草の記録（読んだ材料・実測の手順と script・迷った点）= ~/.local/share/folio2/handoff-2026-09-24/adr18-draft.md。実測は main 2d90e8d の時点。

id: ADR-18
title: 天井の周を回す引き金を規範の欄の変更に絞り、門は最後の引き金に対する周の合格で判定する — 注・平易文・図・生成区間だけの変更は次の引き金の周が読む

status: accepted
date: 2026-09-24

plain: |
  AI が意味を読む検査（天井）の 1 周を、いつ回すかの決まりを変えます。
  いまは、設計文書が 1 字でも変わると天井の判定の印が古くなり、設計文書を書き換える次の便の前に 1 周を回し直します。
  この決まりでは、次の 5 つの「規範の欄」が変わったときだけ周を回します。
  憲法の条文、発効した判断の記録（状態・決定・撤退条件・改訂と置き換えの欄）、要件書の規範の部分（要件・非機能要件・受入基準の規範文や判定の文など・制約・最上位の目的と範囲の節）、規則の表の行の中身（注と裁定と来歴を除く）、天井そのものの重さ・読む文書の一覧・観点と問いの文です。
  注・平易文・図・用語集・入口・生成区間だけが変わったときは周を回さず、次に規範の欄が変わったときの周がまとめて読みます。
  AI に渡す材料は今までどおり 1 字も削らないので、読まれないまま終わる字はありません。読むのが後になるだけです。
  門（設計文書を書き換える便を受け付けるかを決める所）は、「最後に規範の欄が変わった後の周が 4 観点とも合格か」で決めます。
  合格の後に注や平易文だけが変わっていれば便を通しますが、「印の後に変わった所がまだ読まれていない」ことを門の返事とページの天井の名札にはっきり出します。
  完成の判定（M の出口）は今までどおり、全部の字を読んだ周の合格を求めます。
  正直に言うと、この変更で減る周は多くありません。過去 25 周に当てると 4 周（16%）ほどです。
  周の回数を押し上げている本当の理由は、不合格の周の後に直して回し直す往復（26 周のうち 19 周）であり、この判断はそこを変えません。
  最初に考えた「要件書の版が上がるたび」や「新しい番号が増えたときだけ」という絞り方は、前者は周がほとんど減らず、
  後者は規範文の直しを読まずに便を通すことになり、正しさを最優先するあなたの方針に反するので採りません。

context: |
  (1) 起点と目的関数。持ち主は 2026-09-24 の朝（09:1x JST）に開発の速さの説明を求め、席は実測（器の記録
  ~/.local/state/scribe2-v2-state-folio2/fleet/events.jsonl と版管理と台帳）から「席の活動時間の約 86% は便の外の
  逐次の作業で、その大半は天井の周回と一括の承認待ち」と報告し、推奨の 1 つに「天井の周を一括ごとから版の発効ごとへ絞る」を挙げた。
  持ち主は同じ朝に「裁定はすべて承認する」と答えた（09:46 JST・f2-648 notes・対話面 R-8）。
  目的関数は判断の記録 ADR-13 の決定 (0) のまま＝① 設計文書が道標として正しいか ② 見落としてあとから直す回数が減るか
  ③ 実時間が減るか、の順である。天井の周をひたすら回すような実時間の無為な消費は不可だが、精度と引き換えに時間を買うのも不可。

  (2) いまの引き金は型付きの欄として在るのではなく、門の式の中に在る。天井の正本（ceiling.yaml）に引き金の欄は無い。
  門（要件 FR20・実装 crates/folio/src/gate.rs の run）は、印の正本の要約値（観点が読む文書の全文を連結した要約値）が
  今の正本の要約値と違えば「まだ分からない」を返す。だから設計文書が 1 字でも変わると、設計文書を書き換える次の便の前に周が要る。
  判断の記録 ADR-13 の決定 (8) は節点の本文ほか 4 つを引き金とし、何も変わらない変更では周を要らないと出す口を定めたが、
  その口（便の列の ⑤ の 2 本目・台帳 f2-648.145）は未実装で、4 つのうち 2 つ（面の生成器と部品目録・実態の観点の実装の証拠）は
  いまの門も数えていない。

  (3) 周の実測（周の置き場 ~/.local/share/folio2/ceiling/<日付>-round<N>/・1〜27 周・28 周目は進行中で除く）。
  4 観点とも合格した周は 27 周のうち 7 周（6・14・15・18・21・23・26。印は 14 周目から 6 回付けた。
  「合格 4 周」とした席の速報は数え違いで、7 周が正しい）。所見は 674 件（重さ 止める 40・直す 540・参考 94）。
  止める の 40 件は、反証で 32 件が支持（実態との整合 13・文書どうしの整合 12・忠実さ 7）、8 件が退けられた
  （読みやすさ 5・文書どうしの整合 3）。1 周の審査の開始から反証の終わりまでは中央値でおよそ 8 分。
  2〜27 周の所見 626 件のうち、前のどれかの周に同じ場所（文書と欄の対）の所見が在ったものは 318 件（50.8%）、
  観点まで同じものは 264 件（42.2%）。3〜27 周の所見のうち根拠の字が 1 つ前の周の正本に既に在ったものは
  574 件のうち 520 件（90.6%）で、止める では 31 件のうち 23 件（74%）。**周の大半は、直前の変更が持ち込んだ字ではなく、
  前から在った字を毎回違う所から拾っている**（審査役は確率的に読む）。
  2〜27 周の 26 周のうち 19 周は、前の周が不合格だったので回した周である。1 周が 4 観点とも合格する割合はおよそ 0.27、
  不合格から合格までの往復は平均で 3.7 周ほど続く。**周の回数を押し上げているのはこの往復で、引き金ではない。**

  (4) 引き金の絞り方ごとの実測（周の間の 26 区間の正本を版管理から取り出して比べた・起草役と検証役が別々の script で数えて一致）。
  便（台帳の id で始まる取り込み）75 本のうち設計文書の正本を変えたのは 21 本で、残る 54 本は周の入力を 1 字も動かさない。
  ただし周はもともと設計文書が変わった区間でしか回っておらず、26 区間のすべてで設計文書が変わっている。
  〔甲〕要件書の版の字（meta.version）が変わった区間 = 26 のうち 20。一括がほぼ毎回要件書の版を上げるので、周はほとんど減らない。
  〔乙〕番号の集合（憲法の版・発効した判断の記録・要件と受入基準と制約・規則の表の行）が変わった区間 = 26 のうち 8。
  過去の判定をそのまま使う粗い模擬では 25 周のうち 12 周を回すことになるが、飛ばす周で見つかっていた反証で支持された 止める 32 件のうち
  18 件（要件と非機能要件の規範文 5 本と配信の接続先を定める条の規範文を含む）が次の引き金まで遅れ、その間に最大 24 本の便（うち設計文書を書き換えた便 12 本）が
  着地する。規範文の書き換え（26 区間のうち 9）・天井の正本の版上げ（同 5）・発効した判断の記録の決定の字の直し（同 3）・
  承認の対話面を指す規則の表の行 R-8 の値の書き換え（同 1）が引き金の外を素通りする。
  〔丙〕規範の欄の要約値（決定 (1) の 5 つ）が変わった区間 = 26 のうち 20。模擬では 25 周のうち 21 周を回し、飛ばすのは 4 周
  （19・20・22・23）。遅れる支持の 止める は 4 件（導出物の要件の注・同じ要件の規範文〔前から在った字〕・手順図の副題・要件書の生成区間の注）。
  往復の本数で見ても、合格の後に始まる往復が 8 本から 7 本に減るだけで、節約はおよそ 4 周（16%）である。

  (5) 観点を減らす案（持ち主へ示した代替案 B）の実測。読みやすさの 止める は 5 件ともに反証で退けられ、
  読みやすさだけが理由で不合格になった周は 0 周である（読みやすさが不合格だった 10 周目は、整合と実態も不合格だった）。
  ほかの 3 観点は支持された 止める を 32 件出している。

decision: |
  (0) 本判断の目的関数は判断の記録 ADR-13 の決定 (0) のまま（精度・手戻り・実時間の順）とし、実時間の節約のうち、
  規範の字の変更を読まずに便を通すことで得る分は取らない。本判断が減らすのは、合格の後に注・平易文・図・生成区間だけが
  変わったことで始まる周と、その周から始まる一括である。不合格の後の往復は減らさない（周の中身は変えない）。

  (1) **周の引き金を「規範の欄の要約値」が変わることに絞る。** 規範の欄は次の 5 つの閉じた一覧とする。
  ① 憲法の条文（条 A-2.2 が名指す 5 欄 = id・見出し・段・縛る相手・規範文。凍結 anchor の写しの取り方と同じ）
  ② 発効した判断の記録（状態が accepted か retired のもの）の id・状態・決定・撤退条件・改訂の欄（amends・revises）・置き換えの欄
  ③ 要件書の要件と非機能要件の id・規範文・強さ・型・起きるとき・確かめ方・M の割り当て、受入基準の id・題・確かめる要件・判定の文、
  制約の id と本文、最上位の目的と範囲の節（M ごとの範囲の節を含む）
  ④ 規則の表の行の id と、注・裁定・来歴を除く中身の欄（条・何を数えるか・値・種別・状態・段・母集団・同じ種類の定め）
  ⑤ 天井の正本の重さ・読む文書の一覧の id と file・観点の行（読み手・問いの文・読む欄）
  一覧の正本は実装の型付きの定数に置き、天井の正本の末尾の生成区間へ写しを導出する（条 P-5.1・P-5.6・判断の記録 ADR-11）。
  引き金の要約値は、この 5 つを決まった順に並べた写しの要約値とする。

  (2) **引き金の外の変更では周を回さない。** 注・平易文・図・前提と退けた案と帰結と注（判断の記録）・語彙・入口・相談窓口・
  索引の欄の決まり・設計ノート・生成区間・各文書の表紙の節（meta・承認欄を含む）だけが変わった変更がそれに当たる。
  それらは次の引き金の周が読む。材料の束は今までどおり観点が読むと宣言した節を丸ごと渡す（判断の記録 ADR-13 決定 (5)）ので、
  引き金の外の変更も次の周で必ず束に入る。辺を足すだけの変更を引き金に数えないこと（同 決定 (8)）は変えない。

  (3) **手順の引き金を 2 つ残す。** ① 周が不合格か「まだ分からない」だったときは、直しの一括が引き金の外であっても、
  合格するまで周を回し直す（今と同じ）。② M の出口の裁定を持ち主に問う前に、そのときの正本の全文に対して 1 周を回す。
  M の出口を表す型付きの欄は無いので、② は門ではなく席の受付の作法（規則の表の開発規律行 D-12）が持つ。

  (4) **印に引き金の要約値の欄を足す。** 印（design-intent/preview/ceiling-stamp.yaml）は、周の結果から導出するときに、
  そのときの正本の引き金の要約値を 1 行で持つ。印の意味は「その引き金の要約値の正本に対して、4 観点が 3 値を出した記録」になる。
  印と門は同じ 1 つの関数で引き金の要約値を測る（条 P-15.2・便 104 が正本の要約値でそうしたのと同じ形）。
  正本の要約値の欄（sources）と節点ごとの要約値の表（nodes）は今のまま残す。

  (5) **門の式を改める（要件 FR20 の --gate）。** 便の書き換える file の一覧に設計文書の置き場の file が無ければ 通す（0・今と同じ）。
  在るときは、印が無い・印に引き金の要約値の欄が無い・印の引き金の要約値が今と違う・印に「まだ分からない」の観点が在る、の
  どれかなら まだ分からない（2）。そうでなく印に不合格の観点が在れば 止める（1）。どちらでもなければ 通す（0）。
  3 値の意味と、「まだ分からない」が「不合格」より先に立つ順序は変えない。
  通すときに印の正本の要約値が今と違えば、理由の行に「印の後に引き金の外の変更が在る（節点 k 個・次の引き金の周が読む）」を添える
  （k は印の節点ごとの要約値の表と今の正本の違う節点の数・条 P-4.2）。

  (6) **完成の判定と面の名札は、読まれていない字を合格と言わない。** 判断の記録 ADR-8 決定 (4) の完成の判定
  （床の全通過と天井の 4 観点すべての合格）は、印の正本の要約値が今の正本と同じときだけ満たす（今の字のまま）。
  面の天井の名札は、印の正本の要約値が今の正本と違えば、観点ごとの 3 値と日付に「印の後に変わった所はまだ読まれていない」を添える（条 P-3.3・P-4.2）。

  (7) **運ぶもの。** 要件 FR20 の規範文・平易文・確かめ方と受入基準 AC18（門の場合を 6 から 7 へ・「引き金は同じで正本の他の字が違う → 通す」を足す）
  の改訂＝要件書の版上げ。規則の表の開発規律行 D-12 の改訂（何を数えるかの欄に周の引き金と手順の引き金 2 つ・裁定 id と時刻・条 P-17.1）。
  語彙の「周の引き金」の定義の改訂。天井の正本の版上げ（承認欄の行と、生成区間に引き金の一覧の写しが入ること）。
  実装の便は 2 本＝便ア（引き金の型付きの定数と要約値の関数・印の欄・門の式・生成区間の導出・凍結の写しと歯）と、
  便イ（面の天井の名札の添え書き）。判断の記録 ADR-13 の便の列の ⑤ の 2 本目（周の引き金の判定の口・台帳 f2-648.145）は便アが置き換える。
  同じ列の ⑩（門の単位を便の file の単位へ・f2-648.146）は本判断では変えず、便アの着地の後に要否を問い直す。

  (8) 憲法の条文は 1 字も改訂しない。条文の改訂が要ると分かったら、その時点で本判断を止めて条 A-2 の手順へ移す。

options:
  - id: a
    name: 規範の欄の要約値を引き金にし、門は最後の引き金に対する周の合格で判定する（注・平易文・図・生成区間だけの変更は次の引き金の周が読む）
    text: |
      決定 (1)〜(7) の形。引き金を型付きの 5 つの規範の欄に閉じ、印に引き金の要約値を持たせ、門はそれで「古い」を判定する。
      引き金の外の変更は、門の返事と面の名札に「まだ読まれていない」と出したうえで、次の引き金の周が読む。
    verdict: adopted
    reason: |
      精度を落とさずに取れる節約だけを取る。規範の字（条文・決定・規範文・受入基準・規則の行・天井の物差し）の変更は
      1 つも読まずに通さない。遅れるのは注・平易文・図・生成区間の字で、過去 25 周への模擬では飛ばす 4 周で支持された 止める 4 件が次の周まで遅れる
      （うち 3 件は注・図・生成区間、1 件は前から在った規範文の字で、どれも直前の変更が持ち込んだ規範の字ではない）。
      節約は小さい（25 周のうち約 4 周）が、判断の記録 ADR-13 がすでに約束して未実装の「周が要るかを判定する口」を、
      決定的に数えられる具体の形で置き換えるので、実装の費用の多くは既に列に在った仕事である。
      読まれていない字を門の理由と面の名札に出すので、条 P-4.2 の「まだ分からない として表に出す」を満たす。
  - id: b
    name: 番号の集合だけを引き金にする（新しい判断の発効・憲法の版・要件と受入基準と規則の新しい番号・M の出口）
    text: |
      持ち主へ最初に示した方向（版の発効ごと）を、決定的に数えられる形にしたもの。新しい番号や発効が増えたときだけ周を回し、
      既存の行の規範文の書き換えや一括の直しは周を起こさない。
    verdict: rejected
    reason: |
      目的関数（精度が先）に反する。過去 26 区間に当てると、既存の規範文の書き換え 9 区間・天井の正本の版上げ 5 区間・
      発効した判断の記録の決定の字の直し 3 区間・承認の対話面を指す行 R-8 の値の書き換え 1 区間が引き金の外を素通りする。
      模擬では反証で支持された 止める 32 件のうち 18 件（規範文 5 本と配信の接続先を定める条の規範文を含む）が次の引き金まで遅れ、
      その間に設計文書を書き換えた便が最大 12 本着地する＝欠陥の在る規範文の上に便の契約が建ち、直すときに契約表と歯の手戻りになる。
      新しい番号を足さずに既存の行を書き換えれば門を外せる誘因も生む（条 N-3.1 の趣旨に近づく）。
      周の減り方も、往復の長さ（平均 3.7 周）で置き直すと模擬の 12 周ではなく 18〜22 周で、節約は見かけより小さい。
  - id: c
    name: 要件書の版の字が変わるたびに周を回す（版上げごと・字どおり）
    text: |
      要件書の版の字（meta.version）・憲法の版・判断の記録の発効を引き金にする。
    verdict: rejected
    reason: |
      周がほとんど減らない。一括のたびに要件書の版が上がるので、過去 26 区間のうち 20 区間で引き金が起きる（案 a と同じ数）。
      そのうえ要件書の版を上げない変更（規則の表の行・判断の記録の決定の字・天井の正本の問いの文）を拾わないので、
      案 a より精度が低く、節約は同じである。
  - id: d
    name: 今のまま（設計文書が 1 字でも変われば印は古い）
    text: |
      門の式も引き金も変えない。判断の記録 ADR-13 の周の引き金の判定の口（f2-648.145）は、いまの列のまま後で運ぶ。
    verdict: rejected
    reason: |
      合格の後に注や平易文だけを直した一括が、そのたびに周と次の一括を呼ぶ形が残る（過去には合格の後の往復が 8 本始まり、うち 1 本は案 a なら起きていない）。
      節約は小さいので持ち主がこの案を選ぶのも筋は通るが、案 a は精度の損が注・平易文・図・生成区間の読む時期の遅れだけで、
      ADR-13 の未実装の口を具体の形にするので、案 a を採る。
  - id: e
    name: 観点を 4 から 2 へ減らす
    text: |
      支持された 止める を出していない観点を外し、1 周の手間を減らす。
    verdict: rejected
    reason: |
      周の回数が減らない。読みやすさだけが理由で不合格になった周は 27 周のうち 0 周で、外しても往復は 1 本も短くならない。
      2 つまで減らすには、支持された 止める を 32 件出した実態との整合・文書どうしの整合・忠実さのどれかを外すことになり、本物の欠陥を落とす。
      観点の数を変えるのは判断の記録 ADR-8 決定 (1) の改訂でもある。
      読みやすさの 止める が反証で 5 件とも退けられた事実は、天井の正本の重さの基準の直しの候補として別に問う（本判断に混ぜない）。

