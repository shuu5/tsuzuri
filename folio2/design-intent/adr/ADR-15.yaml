# folio2 判断の記録 ADR-15 — 実装の区切りの境界は責務で決め、器の行数の上限を境界の理由にしない
# 状態: accepted（発効 2026-09-23 10:33 JST・持ち主の承認・逐語「承認する」・起草 2026-09-23・改訂 c = 反対側からの確認〔grill〕の再検証への応答・orchestrator 席 fable 5.1）。
# 出所 = 総点検の設計ノート docs/design/audit-2026-09-23.md の §3-c と §3-d と §4 の 🔴 3（持ち主の承認 2026-09-23 08:13 JST・対話面 R-8・逐語「問いは全部推奨で」）。
# 反対側からの確認の記録 = ~/.local/share/folio2/handoff-2026-09-23/adr15-grill.md（独立の審査役。改訂 a に対して 支持 2・退ける 5・まだ分からない 2、改訂 b の再検証で 直った 6・残る 5。どちらも判定は「直してから」）。改訂 b と改訂 c はその応答である（対応は note の表）。
# 改訂 c の実測は写しの repo で 11 本の便を実際に当て、各便で組み立て（cargo build・警告 0）と歯（cargo nextest run・777 本中 777 本）まで通して数えた。
# 区切りの図（層 × file × 責務 × 正規化行 × 余地）・依存の辺の全数・便ごとの書き込み範囲・実測の手順は docs/design/module-map-2026-09-23.md が持つ（本 file は判断だけを持つ）。

id: ADR-15
title: 実装の区切りの境界は責務で決め、器の行数の上限を境界の理由にしない

status: accepted
date: 2026-09-23

plain: |
  道具の中身をどう分けるか、その分け方の決まりです。
  いまの folio の中身は 44 枚のファイルに分かれていますが、その切れ目の一部は
  「1 枚のファイルに書ける行数の上限に当たったから、そこで切った」というだけの理由でできています。
  便を運ぶ道具の側が 1 枚 1,500 行という上限を持っていて、その上限に当たった便が 4 本ありました。
  中身は 1 行も変えずに、ただ半分に分けただけの便です。
  その結果いま、残り 300 行を切ったファイルが 4 枚あります。この 4 枚に少しでも大きな手を入れる便は、
  運ぶ前の受付で断られます。判断の記録・設計ノート・入口・憲法の 4 つのページに関わる場所です。

  そこで、切れ目の理由を「行数」から「仕事の役割」に変えます。
  役割は 6 つに分けます。土台（数の計算や合否の型）・読む（ファイルを型に直す）・
  検査する（決まりに合っているか数える）・導出する（正本から別の形を作る）・
  面に出す（人が読むページを書く）・配る（命令の入口と、出来たものを置いて見せて知らせるところ）の 6 つです。
  そして「上の役割は下の役割を使ってよいが、下から上は使わない」という向きの決まりを 1 本だけ置きます。
  いま数えたところ、この向きに反している使い方が 20 か所ありました。
  20 か所の出どころは 7 枚のファイルで、どれも「みんなが使う型や読み手や一覧」と「ひとつの命令の本体」を
  同じファイルに同居させていたことが原因です。同居しているものを下の役割へ降ろせば、20 か所は 0 になります。

  この向きが守られているかどうかは、人が気をつけるのではなく、自動の検査（歯）が毎回数えます。
  検査の側に置くのは、道具の中に置くと道具が自分で自分を採点することになるからです。
  ただし、置き場所を分けても書き手と時刻は同じなので、これは「独立した動かない基準」ではありません。
  凍結した実測、つまり「その時点の姿を写して固めたもの」として置きます。
  残っている 20 か所の一覧も検査が持ち、便が進むたびに減らします。増やす向きの書き換えは認めません。

  直す順は、まず「みんなが使うもの」を下へ降ろす 7 回を運び、そのあとで塞がっている 4 枚を開ける 4 回を運びます。
  全部で 11 回に分けて運びます。この順なら、向きに反する使い方は 20 → 13 → 8 → 7 → 6 → 3 → 1 → 0 と
  1 回も増えずに減ります。写しの道具に 11 回ぶんを実際に当てて、毎回、組み立てが通ること・
  自動の検査が 777 本すべて通ること・書類の検査が合格することまで確かめて数えました。
  逆の順（塞がりを先に開ける）にすると、開けた先の新しいファイルがまた上向きに名指すので、数が増えます。
  なお、最後の 2 回で切り出す中身は、正本を読むだけでなくページの部品も呼ぶので、
  下の役割へは降ろさず、同じ「ページを書く」役割の中で 2 枚に割ります。
  そしてこの決まりが縛るのは道具の中身の分け方だけで、人が読むページの分け方は別の決まりが持ちます。

  最後に、この判断をやめる条件も決めておきます。
  役割で分け直したのに受付の断りが減らなかったら、分け方が間違っていたということなので、測り直します。
  逆に、便を運ぶ道具の側が行数の上限をやめたとしても、この切れ目は元に戻しません。
  行数で決めたのではなく、役割で決めたからです。

context: |
  (1) 上限が境界を決めた跡の実測（総点検の棚卸し・基準 main aff1b32）。
  便を運ぶ器（scribe2）は 1 file あたりの行数の上限 1,500（幅 120 で正規化）を持ち、受付のときに
  書き込み範囲の各 file の余地（上限 − 正規化行数）を便の大きさの見積と比べる。
  断るのは 見積 が 余地 を超えたときだけである（器の実装で確かめた）。
  この上限だけを理由に、中身を 1 行も変えずに file を割った便が 4 本ある（便 35・便 87・便 89・便 100）。
  便 76 は上限のために file を書き込み範囲から外した。境界が便の中身でなく便の形を決めた例である。

  (2) いま塞がっているところ。実装の側（src）は 44 file・正規化 26,160 行で、上限を超えるものは無いが、
  余地が 300 未満で中くらいの便が通らない file が 4 本ある。
  判断の記録の床 110・入口の面の生成器 122・設計ノートの床 138・憲法の面の生成器 206 である。
  歯の側は 2 本が既に上限を超えており（面の歯 −285・入口の面の歯 −28）、
  この 2 本を書き込み範囲に含む便は今すぐ断られる。

  (3) 依存の向きの実測。実装の側の 44 file が互いを名指す辺（判断の記録 ADR-13 の言う辺）を、
  責務で割り当てた 6 つの層に照らして数えた。
  注釈を剥がしてから走査し、区切りを宣言する入口の file は接頭辞の無い名指しも数えた（44 節点の図）。
  下向き 127・同じ層 75・上向き 20（辺の計 222）である。

  (4) 上向きの 20 本の出どころは 7 つの file で、どれも「層をまたいで使われる型・読み手・閉じた一覧の定数」と
  「ひとつの命令の口の本体」を同じ file に同居させている。上向きの辺はすべて前者を名指しており、
  後者を名指す辺は 1 本も無い。前者を 1 つ下の層へ降ろせば 20 本は 0 本になる。
  写しの repo へ 11 本の便を実際に当て、各便で組み立てを通して確かめた
  （20 → 13 → 8 → 7 → 6 → 3 → 1 → 0 → 0 → 0 → 0 → 0）。

  (5) 上限は誰の決まりか。行数の上限は器（scribe2）の受付の規則であって、folio2 の設計判断ではない。
  条 P-13 は folio2 の開発を拘束するのは設計文書だと定める。
  器の都合で決まった境界は、設計文書のどこにも根拠を持たない。

  (6) 層の割り当ては何の正本か。実装の型付きの定数の扱いは判断の記録 ADR-11 が決めている。
  規則の表の行 D-11 は、条 P-5 の写しの導出が掛かるのを
  「folio の命令が 違反・拒否・「まだ分からない」を出す判定に使う 欄の集合・値域・閉じた一覧・判定の式」に限る。
  層の割り当ての表を読むのは歯であって folio の命令ではないので、写しの導出は掛からない。

  (7) 置き場の選び方とその限界。層の割り当てを実装の側（src）に置いて歯がそれを読む形にすると、
  実装が自分で自分を採点することになる。歯の側に置けば採点する側と採点される側の file は分かれる。
  ただし、割り当ても辺の一覧も実装の側と同じ便・同じ書き手が同じ書き込み範囲の中で書き直すので、
  条 P-10 が求める「生成側からも検査側からも独立した」凍結 anchor にはならない。

  (8) 走査の限界（実測）。字面の走査は 4 つを見落とす。
  区間が接頭辞なしで取り込んだ名（`use` で取り込んだ名を接頭辞なしで呼ぶと、その依存は字面に現れない。
  区間を切り出すとその名を新しく名指すことになり、そこで初めて辺が生える。実測で 4 便に出た）。
  注釈の中の名指し（剥がさないと偽の辺になる。今の写しでは剥がしても辺の計は変わらないが、
  降ろした先の file の説明文が偽の辺を作る場面を実測で 2 件見た）。
  区切りを宣言する入口の file が接頭辞なしで名指す 16 本（数えないと 43 節点の図になる）。
  再輸出を挟んだ名指し（今の写しに 1 例あり、呼ぶ側の真の行き先は再輸出の元である）。

  (9) 同じ層の中の絡み。相互に名指す対は 30 で、うち 17 対が同じ層の中に在る。
  向きの決まりは同じ層を許すので、この 17 対には何も掛からない。
  11 本の便の後は 14 対（層 2 が 6・層 4 が 8）が残り、そのうち 2 対は
  上限だけを理由に割った便（便 35・便 100）の跡そのものである。

decision: |
  (1) **実装の区切りの境界は責務で決める。** 器の行数の上限に当たったことを、
  file を割る理由にも、書き込み範囲から file を外す理由にもしない。
  上限に当たった便は、責務の線が引ける割り方を探すか、便の大きさを改める。
  責務の線はすべての同じ種類の中身に一様に掛かる。どれを先に運ぶかを余地で決めることは、
  境界を余地で決めることとは別である。

  (2) **責務の層は 6 つとし、依存は下向きだけとする。**
  土台（文書を知らない共通の型と計算）・読む（正本の byte を型に直し、閉じた一覧と値域と床の木の型を持つ）・
  検査する（型に直したものを決まりに照らして数える）・導出する（正本から別の型付きの出力を作る）・
  面に出す（人が読むページを書く）・配る（命令の入口と、生成物を置き、見せ、知らせるところ）の 6 つである。
  file は自分より下の層だけを名指す。同じ層どうしの名指しは許す。
  総点検の設計ノートが挙げた 5 つの層に、土台を 1 つ足した。
  合否の型と要約値の計算は文書を何も知らず、読む層にも属さないからである。
  閉じた一覧が読む層に在るという定義が実測と合うのは、決定 (5) の 3 本目と 4 本目の便の後である。
  それまでは、部品目録の閉じた一覧と入口の棚の閉じた一覧が検査の層と面の層に在る。

  (3) **層をまたいで使われる型・読み手・閉じた一覧の定数は、使う側の一番下の層へ降ろす。**
  上向きの辺 20 本はすべてこの形で解ける。降ろす先は新しい file で、
  元の file には命令の口の本体だけを残す。閉じた一覧を層 1 へ置くのは条 P-2 と条 P-6 の形に沿う
  （一覧は 1 か所で閉じ、組み立て時に正本から導出した写しを読む側が持つ）。
  この降ろしは出力を変えない。ただし「1 字も変えない」ではない。
  移す中身の見え方（私か、同じ道具の中で公開か）は広がり、元の file には再輸出の行を置くことがある。
  見え方が広がる数は便ごとに実測して契約に書く（11 本の合計は 183 か所だった）。

  **ただし、切り出す中身が面の口を呼ぶなら、下の層へ降ろさず同じ層の中で割る。**
  面の生成器のうち「正本を読んで面の文脈を組む」部分は、字面や名札を作る面の口を呼び、
  関係の欄からはリンク（HTML）も組む。これを層 1 へ置くと層 1 の定義（正本の byte を型に直す）が壊れるので、
  新しい file を層 4 に置く。向きの決まりは同じ層を許すので、これで塞がりは開き、上向きの辺も増えない。

  (4) **層の割り当てと、まだ降ろしていない上向きの辺の一覧は、歯が凍結した実測として持つ。**
  これは規則ではなく、その時点の姿の写しである（条 P-5 が閉じる 4 つの置き場の外に在ってよいのはこのためで、
  凍結 anchor が歯の置き場に在るのと同じ扱いとする）。
  歯は 2 つを数える。1 つ目は、割り当ての表の file の集合が入口の file が宣言する区切りの集合と一致すること
  （新しい file は必ず層を持つ）。2 つ目は、実装の側を走査して得た上向きの辺の集合が、
  凍結した一覧と 1 本も違わないこと（多くても少なくても落ちる）。
  一覧は許可ではない。行を足す書き換えは認めず、足すなら本判断を改訂する
  （無効化の旗も「今回だけ」の口も持たない＝条 N-3 が拒む形にしない）。
  走査は注釈を剥がし、区切りを宣言する入口の file は接頭辞なしの名指しも数える。
  再輸出を挟んだ名指しは見えない＝この歯が言えるのは「字面の上で上向きの辺が無い」までである。
  歯の側に置いても、書き手と時刻が実装の側と同じである以上、条 P-10 の独立した anchor にはならない。

  (5) **降ろす順は、層をまたいで使われるものを先に降ろし、塞がっている file を後で開ける。**
  便は 11 本とする（総点検の設計ノートの案は 4 本だった）。
  1 本目から 7 本目で 7 つの同居を解き、8 本目から 11 本目で余地 300 未満の 4 file を割る
  （うち後ろの 2 本は面の中の割り）。
  この順で上向きの辺は 20 → 13 → 8 → 7 → 6 → 3 → 1 → 0 と 1 本も増えずに減る。
  写しの repo で 11 本を実際に当て、各便で組み立てを通して数えた。
  逆順にすると、先に開けた file の降ろし先が層をまたいで名指すので上向きの辺が増える。
  どの便も出力を変えない。既存の歯は、前の割りを字面で固定している 1 本だけを 4 本目で直し、
  ほかは 1 本も動かさない（境界の歯 2 本を 1 本目で足す）。
  **切り出す区間は、区間の外に定義がある名を使っていないかを便の契約を書く前に列挙する。**
  字面の走査はこれを見ないので、列挙しないと表に無い上向きの辺が生える（実測で 4 便に出た）。
  各便の受入には、既存の歯が全部通ることのほかに、
  設計文書の床が合格であることと、欄の決まりの生成区間が 9 file とも一致することを置く。
  口の呼ぶ順が変わる 7 本目には、凍結の後始末が同じ条件で同じ回数だけ走ることも受入に置く
  （歯が全部通っても振る舞いが変わりうる唯一の便である）。

  (6) **この判断は実装の区切りだけを縛る。** 人が読む文書の側の分け方（面の型・観点・密度）は
  閉じた一覧が別に持ち、本判断は増やしも減らしもしない。

options:
  - id: a
    name: 責務で割り直し、依存の向きを歯で数える（採る）
    text: |
      境界の理由を責務に変え、6 つの層と下向きだけの向きの決まりを置く。
      層をまたいで使われる型と読み手と閉じた一覧を下の層へ降ろし、割り当てと残りの辺の一覧を歯が持つ。
      層をまたぐものを先に降ろし、塞がっている 4 file を後で開ける。
    verdict: adopted
    reason: |
      境界の理由が設計文書の中に来るので、器の規則が変わっても揺れない。
      上向きの辺 20 本は 7 つの同居を解けば 0 になり、解いた副産物として塞がっている 4 file も開く。
      向きが守られているかどうかを歯が毎回数えるので、決まりが文章の中だけに残らない（条 N-2）。
      この順なら上向きの辺が 1 本も増えずに減るので、決定 (4) の「行を足す書き換えは認めない」とも
      撤退条件とも食い違わない。写しの repo で 11 本を実際に当て、各便で組み立てと歯まで通して確かめた。
  - id: b
    name: 器の行数の上限を緩めてもらう
    text: |
      器（scribe2）の受付の規則の上限 1,500 を、folio2 の都合に合わせて引き上げてもらう。
      いまの境界はそのまま残し、塞がっている 4 file には手を入れずに次の便を運ぶ。
    verdict: rejected
    reason: |
      塞がりは消えるが、境界が器の数で決まる形は変わらない。上限が上がれば、
      次に当たる場所が先へ動くだけである。
      境界の理由が folio2 の設計文書の外に在り続けるので、条 P-13 の言う
      「folio2 の開発を拘束するのは設計文書」という形から外れる。
      器の側の規則を folio2 の都合で変える要求でもあり、器の手番と時期が読めない。
      依存の向きの 20 本も残るので、便の書き込み範囲が責務の単位で閉じない問題は何も解けない。
  - id: c
    name: 触る便が来るたびに、その場で割る
    text: |
      いままでどおり、上限に当たった便がその場で file を半分に割って進む。
      判断の記録も層の表も置かず、歯も足さない。
    verdict: rejected
    reason: |
      いままでの 4 本がこの形で、その結果が今の塞がりである。
      割る場所はそのとき運んでいた便の中身で決まるので、同じ責務が 2 つの file に散り、
      互いを名指す形が残る（要件書の面の 3 file は既にそうなっている）。
      境界の理由が便の契約の中にしか残らず、後から読む人には数の話にしか見えない。
  - id: d
    name: 層を 5 つのままにし、土台を置かない
    text: |
      総点検の設計ノートが挙げた 5 つ（読む・検査する・導出する・面に出す・配る）をそのまま層にし、
      合否の型と要約値の計算は読む層に入れる。
    verdict: rejected
    reason: |
      合否の 3 値と終了コードの型・要約値の計算は、正本を 1 字も読まないし文書の形を何も知らない。
      読む層に入れると、その層の責務が「正本を型に直す」と言えなくなり、
      層の名が何を指すか実測から決められなくなる。
      層を 1 つ足す費用は表の 1 行と歯の 1 行だけで、割り当ての曖昧さを消す利得が上回る。
  - id: e
    name: 塞がっている 4 file を先に開け、層をまたぐものを後で降ろす（起草の初版の順）
    text: |
      余地 300 未満の 4 file を責務で割る便を先に運び、そのあとで層をまたいで使われる型と読み手を降ろす。
      塞がりが 4 便で開くので、中くらいの便が早く運べるようになる。
    verdict: rejected
    reason: |
      写しの file へ機械的に当てて数えたところ、この順では上向きの辺が増える。
      先に開けた file の降ろし先が、まだ降りていない型・閉じた一覧を層をまたいで名指すからである。
      増えたままの状態が 4 便続くので、決定 (4) の「行を足す書き換えは認めない」に最初の 1 便で抵触し、
      上向きの辺が減らないことを捨てる合図とする撤退条件も、計画どおり運んだだけで発動してしまう。
      塞がりが 7 便ぶん遅れて開く費用は在るが、便の総数は変わらない。

basis: [P-2, P-4, P-5, P-6, P-10, P-11, P-13, P-18, A-2, N-2, N-3, N-5, R-7, R-8, R-13, D-11, ADR-11, ADR-13]

consequences:
  - 実装の側の file は 44 から 54 に増え、正規化の行は 26,160 から 26,263 になる（増えるのは新しい file の説明文だけ）。
    上限を超える file は 0 本のままで、余地が 300 未満の file は 4 本から 0 本になる
    （判断の記録の床 603・設計ノートの床 612・入口の面 565・憲法の面 499）。
    最小の降ろし先は 5 行、最大は 621 行である。
  - 歯の file が 1 本増える（境界の歯 2 本を持つ）。歯の本数は 777 から 779 になる。
    既存の歯は 1 本だけ直す（前の割りを字面で固定している歯が、入口の棚の閉じた一覧の降ろしで落ちる）。
    写しの repo で 11 本を当てたあと、歯は 777 本中 777 本が通った。
  - 上向きの辺は 20 本から 0 本になり、途中で 1 本も増えない。
    0 本に達したあとは、字面の上で上向きの辺を 1 本でも足す変更が歯で落ちる。
  - 移す中身の見え方は 11 本の合計で 183 か所広がる（私から、同じ道具の中で公開へ）。
    この副作用は本判断の向きと逆で、その数だけ道具の全体から名指せるものが増える。
  - 相互に名指す対は 30 から 14 に減るが、残る 14 対はすべて同じ層の中に在るので、向きの決まりは何も言わない。
    そのうち 2 対は、上限だけを理由に割った便の跡そのものである（要件書の面の 3 file）。
    この跡を解くのは本判断の外で、同じ責務の線を後から当てる後続である。
  - 床の定数を読む層へ降ろす便は 2 本しか運ばない。同じ線が掛かる残り 5 本
    （天井・入口・相談窓口・規則の表・正本 7 file の床の定数）は余地が足りているので、
    本判断では運ばず後続に置く。責務の線はこの 5 本にも同じに掛かる。
  - 辺を動かす便はどれも境界の歯の file を書き込み範囲に入れる＝この file が全部の割り直しの便の合流点になり、
    並行して運ぶ便を直列にする。便の書き込み範囲が責務の単位で閉じて重なりが減るという見込みに、
    これは逆向きに働く。どちらが勝つかは測っていない（撤退条件の 1 つ目で数える）。
  - 器の行数の上限が将来外れても、本判断で引いた境界は戻さない。境界は責務で決めたからである。
  - 人が読む文書の側の分け方（面の型・観点・密度）は本判断の外で、閉じた一覧が別に持つ（条 N-5）。
  - 撤退条件の 4 つ目が使う「2 回」は本判断の自前の数で、条 P-11 と規則の表の行 R-7 の繰り返し上限とは
    母集団が違う（行 R-7 の 3 つ組は検査の id と判定と対象の道であり、本判断が数えるものには無い）。
  - 本判断が置く執行は事後の段だけである。編集の時点で止める仕掛けは置かないので、
    規則の表の行 R-13（編集の時点で止める仕掛けの本数の下限）の状態は変わらない。条 P-18 への答はここまでである。
  - 歯の側に置いた層の割り当ては、持ち主の承認なしに作業の中で書き換えられる。
    歯止めは、書き換えが必ず取り込みの審査に現れることと、上向きの辺の一覧を増やす向きに
    書き換えるなら本判断の改訂が要るという本判断の決定 (4) だけである。

retreat:
  kind: measure
  condition: |
    (1) 責務で割っても受付の断りが減らない。数えるのは取り込みの審査で、台帳 f2-648 へ記帳する。
    11 本目の便が着地した後の 10 便で、実装の側の file の余地が足りずに受付で断られた回数を数える。
    3 回に達したら、決定 (2) の層の数と決定 (3) の降ろし方を捨てて測り直す判断の記録を起こす。
    歯の側の file が原因の断りはここに数えない（本判断は歯の側の境界を決めていない）。

    (2) 上向きの辺が増える。境界の歯が出す上向きの辺の集合を、取り込みの審査が直前の便の一覧と比べる
    （歯そのものは凍結した一覧との一致しか見ないので、便が辺を増やして一覧も同時に足せば歯は通る。
    増えたことを捉えるのは、審査が歯の file の差分を読む側である）。
    11 本の便のどれかの着地後に、上向きの辺が直前の便より増えていたら、
    決定 (5) の順を捨てて順を組み直す。増える便は計画に 1 本も無いことを写しの file で確かめてあるので、
    増えたときは実測か計画のどちらかが誤っていたということである。

    (3) 境界が責務で引けない場所が出る。判定するのは取り込みの審査（届かないときは持ち主）で、
    便を運ぶ席ではない。1 つの file を責務で割ろうとして、どちらの層にも属する部分が残り、
    割り方を決められないと審査が判じた便が 2 本に達したら、決定 (2) の層の定義を捨てて測り直す。

    (4) 数えられない回が 2 回を超えたら、本判断の撤退条件の判定を「まだ分からない」に落として持ち主へ渡す。
    「同じ」とみなすのは（撤退条件の番号・数えられなかった理由・対象の便）の 3 つ組が一致する回である。
    この 2 回は本判断が自分で置く数であり、規則の表の行 R-7 の繰り返し上限とは別である
    （行 R-7 が言う 3 つ組は検査の id と判定と対象の道で、本判断が数えるものとは母集団が違う）。

approval: {who: 持ち主, date: 2026-09-23, ruling: f2-648 notes 2026-09-23 10:33 JST（発効の承認・🔴 1〔本判断の発効と便 106〜116 の列〕への回答・推奨どおり）, verbatim: 承認する, surface: R-8}
note: |
  【出所】総点検の設計ノート docs/design/audit-2026-09-23.md の §3-c（便の列）・§3-d（本判断の案）・
  §4 の 🔴 3（module の境界を責務で割り直す）。持ち主の承認は 2026-09-23 08:13 JST、対話面 R-8、
  逐語「問いは全部推奨で」（台帳 f2-648 notes）。この承認は総点検の 6 つの問いへの回答で、
  本判断の起草はその 🔴 3 の推奨に当たる。本判断そのものの発効は 2026-09-23 10:33 JST に持ち主が承認した（承認欄）。

  【改訂 b の理由】反対側からの確認（grill・独立の審査役・fable 5.1・
  ~/.local/share/folio2/handoff-2026-09-23/adr15-grill.md）が、支持 2・退ける 5・まだ分からない 2 で
  「直してから」と判じた。改訂 b はその 23 の直しへの応答である。改めた要点は次の 6 つ。

  1. 便の順を入れ替えた（直し 6・13・21）。初版は「塞がりを開ける 4 本 → 型を降ろす 1 本」で、
  その理由を「先に開けないと受付で断られる」と書いていた。器の受付は 見積 が 余地 を超えたときだけ断るので、
  見積 S（100 行）に対して余地 110 と 138 の file は断られない＝理由が偽だった。
  さらに審査役の実測で、初版の順では最初の便で上向きの辺が 20 から 21 へ増えることが分かった
  （降ろした先が床の木の型を層をまたいで名指すため）。増えたまま 4 便続くので、決定 (4) とも撤退条件とも
  食い違っていた。改訂 b は順を「層をまたぐものを先に降ろす 7 本 → 塞がりを開ける 4 本」に入れ替え、
  写しの file へ 11 本を機械的に当てて 20 → 13 → 8 → 7 → 6 → 3 → 1 → 0 を実測した。

  2. 「1 字も変えない」を直した（直し 7）。審査役が便 1 本を実際に当てたところ、
  私（非公開）の定数 25 本と欄 2 つを同じ道具の中で公開する必要があり、元の file に再輸出の 1 行が要った。
  決定 (3) を「出力を変えない。ただし見え方は広がり、再輸出の行を置くことがある」に改めた。

  3. 便ごとの上向きの値を実測に直した（直し 12）。初版の値（20 → 20 → 20 → 20 → 13）は推測で、誤っていた。
  改訂 b の値はすべて写しの file への機械的な適用から取った。

  4. 走査の限界を書いた（直し 10）。注釈を剥がすこと・区切りを宣言する入口の file の接頭辞なしの
  名指し 16 本を数えること・再輸出は見えないこと。初版の数は注釈を剥がしていなかったので、
  下向きと同じ層の値が改訂 b で変わった（115 / 72 → 127 / 75。上向きの 20 本は同じ）。

  5. 層の表の位置づけを「規則」から「凍結した実測」に改めた（直し 18）。
  条 P-5 が閉じる 4 つの置き場の外に在ることが問題にならなくなる。
  あわせて、置き場を分けても条 P-10 の独立した anchor にはならないことを決定 (4) に明記した（直し 9）。

  6. 撤退条件 4 つを書き直した（直し 14・15・16）。数える母集団を実装の側に限り、判定者を取り込みの審査に置き、
  規則の表の行 R-7 の援用を外して 2 回を本判断の自前の数として置いた。

  そのほかの直しの反映: 層 5 の責務に命令の入口を足した（直し 1）。閉じた一覧が読む層に在るという定義が
  実測と合う時点を決定 (2) に書いた（直し 2）。床の定数を 2 本しか降ろさない理由と残り 5 本の扱いを
  帰結に書いた（直し 3）。同居は 5 つでなく 7 つに直した（直し 4）。同じ層の中の絡みを文脈と帰結に置いた
  （直し 5）。便ごとの受入に床の合格と生成区間の一致を足した（直し 8）。境界の歯の file が合流点になることを
  帰結に書いた（直し 11・20）。規則の表の行 D-11 の引き方を「folio の命令が出す判定に使わないから」に
  改めた（直し 17）。条 P-18 への答を帰結に置いた（直し 19）。平易文に決定 (5) と (6) を足した（直し 22）。
  根拠の欄の id のうち本文に現れなかったものに本文の根拠を足した（直し 23）。

  【改訂 c の理由】反対側からの確認の再検証（同じ審査役・直った 6・残る 5・判定「直してから」）が、
  改訂 b の致命 4 件と「まだ分からない」2 件はすべて直ったと認めたうえで、1 種類の誤りを残すと判じた。
  **区間の切り出しを字面の走査だけで測ったため、区間が接頭辞なしで取り込んだ名が見えていなかった。**
  改訂 c は写しの repo で 11 本の便を実際に当て、各便で組み立て（警告 0）と歯（777 本中 777 本）と
  設計文書の床（合格）と欄の決まりの生成区間（9 file 一致）と注入（一致）まで通して数え直した。直した 5 点は次のとおり。

  1. 2 本目の便の区間に、字面の逃がしと id の形の 2 つを足した（審査役の b-1-1）。
  足さないと、降ろした先がその 2 つを層をまたいで名指すので上向きが 8 でなく 9 になる。実測で確かめた。
  2. 5 本目の便に、天井の所見と束の閉じた一覧 8 本も足した（審査役の b-1-2）。同じ理由で、足さないと 3 でなく 4 になる。
  3. 10 本目と 11 本目の新しい file を層 1 でなく層 4 に置き、決定 (3) に「面の中の割り」の場合を書き分けた
  （審査役の b-1-4）。この 2 つの区間は面の口を呼び、関係の欄からはリンク（HTML）も組むので、
  層 1 の定義（正本の byte を型に直す）に当てはまらない。
  4. 決定 (5) に「区間の外に定義がある名を便の契約の前に列挙する」を足し、走査の限界に 4 つ目として書いた
  （審査役の b-1-5）。これが無いと次の便の見積でも同じ誤りが出る。
  5. 「既存の歯を 1 本も動かさない」を直した。4 本目の便は、前の割りを字面で固定している歯 1 本を直す必要がある
  （入口の棚の閉じた一覧がその歯の見る file から降りるため）。写しで実測して分かった。
  あわせて、撤退条件 (2) の数え方を「歯が出す集合を取り込みの審査が直前の便の一覧と比べる」に改め（審査役の b-3 補）、
  7 本目の受入に「凍結の後始末が同じ条件で同じ回数だけ走る」を足し（b-4 補）、
  根拠の欄のうち本文に現れていなかった 6 つに本文の根拠を足した（b-5 補）。

  【改訂 b で改めた点は下に残す】

  【審査役の「まだ分からない」2 件の判定】
  1 件目（境界の歯の形）は判定した。走査の限界 3 つは実測して直し（注釈を剥がす・入口の file の
  接頭辞なしを数える・再輸出は見えない）、独立性の主張は取り下げて「凍結した実測」に位置づけ直した。
  歯の file が全部の便の合流点になる負債は帰結に置いた。残るのは「歯の一覧が独立の anchor でないこと」で、
  これは限界として明記した（消せない）。
  2 件目（条 P-5 の置き場に歯の定数が入るか）は判定した。審査役の推奨どおり、層の表を規則ではなく
  凍結した実測として置くことで、置き場の列挙に触れない形にした。
  「実装の型付きの定数」が歯を含むかという読みそのものは、本判断では決めない（まだ分からない・P-4.2）。
  決めるなら条の改訂（A-2 の手続き）が要る。

  【歯の失敗 4 本の再現】審査役の写しでは 777 本中 4 本が落ちた
  （設計文書の床・最上位の節・部品の突き合わせ・配信先の組み立て）。
  本枝の作業ツリーで同じ命令を撃つと 777 本中 777 本が通る。
  落ちた 4 本はどれも実の設計文書を版管理ごと読む歯で、審査役の写しに版管理が無かったことによる環境差である。
  本物の不具合ではない。席へ報告する必要は無い。
  改訂 c の写しの repo でも、版管理を入れてから撃つと 11 本の便を当てたあとで 777 本中 777 本が通った。

  【実測の出所】区切りの図・正規化行数・余地・依存の辺の全数・便ごとの実測の列は
  docs/design/module-map-2026-09-23.md が持つ。棚卸しの表は
  ~/.local/share/folio2/handoff-2026-09-23/audit-inventory.md の §3 と §4。
  正規化の式は器（scribe2）の規則と同じ（全行 + 1 行の字数が 120 を超える行は ceil(字数 ÷ 120) − 1 を足す）。
  基準点は origin/main の aff1b32（実装の側はそこから 1 byte も動いていない）。

  【総点検の設計ノートとの違い】§3-c は src の割り直しを便 4 本（106〜109）と見積もった。
  改訂 b は 11 本にする。層をまたいで使われるものを降ろす 7 本が先に要るためである。
  §3-c の便 110 以降（歯の pin を性質へ）の番号は 7 本ぶん後ろへ動く。
  便 105（歯の file 2 本の割り直し）は本判断の外で、入口の面を割る便の前提である。
