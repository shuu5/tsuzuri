# folio2 判断の記録 ADR-32 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。人が読む面は判断の記録の面（adr-32.html・生成物・手で直さない）。
# 状態: accepted（起草 2026-09-28・orchestrator 席の起草役〔opus 5.5〕・改訂 a = 独立の検証 adr32-verify.md の B1・N1〜N5・撤退条件 (2) の範囲の直し = 便 186 の起草役の知らせ）。accepted = 持ち主の承認 f2-648.270 notes 2026-09-28 16:13 JST（逐語「承認する」）。憲法の条文は 1 字も変えない。
# 起点: 台帳 f2-648.270・依頼 ~/.local/share/folio2/handoff-2026-09-28/adr32-brief.md・起草の記録 adr32-draft.md（実測の表・script は adr32-scripts/）。

id: ADR-32
title: 設計文書の索引に、設計ノートの契約表の行を「文書 id#行 id」の節点として足し、要件への辺と同じノートの行への辺を持たせる

status: accepted
date: 2026-09-28

plain: |
  設計文書の地図（索引）に、設計ノートの契約表の行（便 1 本ずつの約束）も点として載せる判断です。
  いまの地図に載るのは、憲法・規則の表・要件書・判断の記録の行だけです。外の利用者（tsuzuri）は地図から画面を作るので、設計ノートの帯が空のままでした。
  点の名前は「文書の名#行の名」（例 surface-wave9#e-hold）にします。器（scribe2）と tsuzuri が便を指すときに使っている名前と同じです。
  指し合いは 2 種類足します。行が満たす要件と、同じノートの中で先に済ませる行です。
  点の見出しは、その行の説明の章の題（例「行 e-hold — …」）にし、技術者向けの要約には行の題の全文を出します。
  誰がいつ決めたか（裁定の番号）は地図に入れません。別の便で作る「裁定の番号の書き出し」が文書の file ごとに出すので、tsuzuri はそれと file の名で結びます。
  地図のほかの行は 1 字も変わりません。

context: |
  (1) 出所（台帳 f2-648.270）。外の利用者 tsuzuri の地図の画面の設計ノートの帯が空で、tsuzuri の持ち主が問うた。tsuzuri は設計の YAML を自分で読まない（tsuzuri の条 P-2）ので、folio の索引（folio graph --print と --summary）が契約表の行を節点として持つのを待っている（tsuzuri の行 c-dn-rows・求める形の写しは handoff-2026-09-28/tsuzuri-270-shape.md）。
  (2) 今の索引が読むのは憲法・規則の表・要件書・判断の記録だけで、節点の種類（11）と辺の型（17）は閉じた一覧である（判断の記録 ADR-13 決定 (1)(2)・増減は判断の記録が要る）。判断の記録 ADR-14 決定 (1) は節点を「id を持つ行」に閉じ、節と文書そのものを節点にせず、正本に無い id を索引が作らないと決めた。設計ノートの欄の決まりの注（index_note・生成区間）は、この決定から「契約表の行は節点にならない」と読んでいる。
  (3) 契約表の行は行 id を持つ。契約 id の形「文書 id#行 id」は設計ノートの欄の決まりの注（id_note）が定め（器の契約表と同じ形）、器と外の利用者の台帳は便の設計の在り処をこの形で指す。設計ノートの床は、文書の見出しの欄（meta）の id と file 名の一致・行 id の形・行が満たす要件の欄（req）の id が要件書の 7 節に在ること・先に済ませる行の欄（depends）の id が同じ節の行に在ることを既に数える。行 id が文書の中で一意であること（注 row_id_note）は、節の中でしか数えていない。
  (4) 実測（参考値・2026-09-28）。本流と床の土台の設計ノートは見本 2 本で、契約表の行は 1 つ（example#a）。tsuzuri の写し（0f09104）は設計ノート 17 本のうち 14 本に契約表が在り、行 126（どれも字下げ 6 の塊の形）・1 本の中の行 id の重なり 0・要件への指し 264（要件 199・非機能要件 65・どれも節点）・先の行への指し 83（どれも同じノートの行）。行の節の欄（section）が指す節の題は 71 行が「行 x — …」、55 行が「便 x — …」で、2 行で 1 つの節を指すものが 1 つ在る。
  (5) 裁定 id の書き出し（判断の記録 ADR-31 決定 (4)・便 C・未着地）は 1 件 1 行で 7 つの欄（ruling・form・bead・node・file・line・field）を出す。設計ノートの承認欄の行は節点の欄が空（null）で、file の欄が設計ノートの置き場の下の字（design-note/<file 名>）である。
  (6) 便 183（判断の記録 ADR-31 の便 B の前半）は、設計ノートの欄の決まりの生成区間と床の土台の索引の凍結 anchor と歯の file の graph を書き換え、2026-09-28 に本流（8fb31c9）に着地した。

decision: |
  (0) 本判断は憲法の条文を改訂しない。
  (1) **節点の種類に「設計ノートの行」を足す**（閉じた一覧 11 → 12・条 P-2.4）。対象は設計ノートの置き場（design-note/ の schema.yaml でない .yaml・床と導出と同じ読み手）の契約表の節（型 contract-table）の行だけで、状態（見本・下書き・発効）で分けない。ほかの表の行・計画の 3 つの節の型の行・節・ノートそのものは節点にしない（ADR-14 決定 (1)）。
  (2) **id は文書の見出しの欄（meta）の id と行 id を「#」でつないだ字**（例 surface-wave9#e-hold）。欄の決まりの注（id_note）が定める契約 id の形で、正本に在る形の id である（ADR-14 決定 (1) の「索引が作る id」に当たらない）。「#」を持つ id はほかの種類に無く衝突しない。1 本のノートの中で行 id が重なれば索引は組めず、索引のどの口（--print・--summary・--digest・folio hello）も まだ分からない とし、床は索引の節点の違反に数える（注〔row_id_note〕の「文書内で一意」）。口が同じ id の節点を 2 度組んだら黙って 1 つに数えないことは種類を問わず掛け、今の種類で振る舞いが変わるのは床が既に違反に数えている正本だけである（条 P-4.1）。
  (3) **欄。** 所属 file は設計ノートの置き場の下の字（design-note/<file 名>）、行の番号は行 id が書かれた行、題は行の節の欄（section）が指す節の題（空白を畳んで 36 字）、技術の要約（--summary の eng）は行の題（title）の全文、平易文は行の平易文の欄（契約表の欄に無いので空・null）。要約値は今の式で、要約する塊は契約表の行の一覧（rows）の中の字下げ 6 の「- 」の行から取る（行 id の欄の順を問わない）。
  (4) **辺の型を 2 つ足す**（17 → 19）。行 → 要件（型 req・行の欄 req）と、行 → 同じノートの先に済ませる行（型 depends・行の欄 depends）。型の名は欄の名とする（今の型の名の決まり）。2 つとも伝播に使う（ADR-13 決定 (2)・伝播の外は図の参照だけ）。辺の欄の一覧に設計ノートの 2 欄（design-note: [req, depends]）を足す（辺だけの変更は要約値を動かさない）。端が節点でないものは今の決まりどおり数えるだけとする（違反は設計ノートの床が既に数える）。
  (5) **裁定 id は節点の欄にしない。** 便 C の書き出しの行を file で結ぶ（設計ノートの承認欄の行の file と、索引の設計ノートの行の file は同じ字）。契約表の行を持たないノートの承認欄の行は、索引に同じ file の行が無く結ぶ先を持たない（決定 (1) のとおりノートそのものは節点にしない）。--summary の欄は 7 つのままとする。
  (6) **変えないもの。** 設計ノートの外の節点・辺・--summary の行の字、--digest の外の行（種類と型の行と file の行と要約の行だけが増える）、folio build の出力。索引の節点の床（folio check の check_index）は設計ノートの file にも掛かる。
  (7) **前の判断との関係。** ADR-13 決定 (1)(2) の閉じた一覧に足す（前の判断の記録の本文は変えない・ADR-30 決定 (1)）。ADR-14 決定 (1) の範囲（id を持つ行）の中で、注（index_note）の読みを直す。1 本のノートの中の行 id の重なりを床が数えるのは、ADR-3 決定 (3) が folio2 に残した「folio2 が所有する文書の id 空間の解決（R-4）」に当たる読み（索引の id の一意）で、器の意味の検査を folio2 へ移すものではない。設計ノートの欄の決まりの注（semantic_check_note）にこの 1 句を足す。語彙の「節点」の定義に設計ノートの行を足す。
  (8) **便。** 便 185（行 gf）1 本で、実装・生成区間 2 本（索引の欄の決まり・設計ノートの欄の決まりの注 2 つ）・語彙・凍結 anchor・歯を運ぶ。便 183 の着地（本流 8fb31c9）の後に受け付ける（生成区間と凍結 anchor と歯の file が重なる）。外の利用者は着地の後に folio schema --write を撃ってから自分の行を書く。

options:
  - id: a
    name: 種類 設計ノートの行・id は「文書 id#行 id」・辺は要件と先の行への 2 型・裁定 id は書き出しの行を file で結ぶ（採る）
    text: 決定 (1)〜(8) の形。
    verdict: adopted
    reason: 外の利用者の求めどおりで、器と外の利用者が既に使う契約 id をそのまま節点の id にする。見出しは外の利用者の行ごとの章の題（126 行のうち 125 行が自分の章を持つ）で、技術の要約は行の題の全文になる。裁定 id は切り出す関数を 1 つに保ち（便 A・C と同じ関数）、--summary の 7 欄の形も変えない。
  - id: b
    name: 種類の名を「契約表の行」にする
    text: 範囲（契約表の行だけ）をそのまま名にする。
    verdict: rejected
    reason: 範囲は正確になるが、持ち主が見る 2 つの面（folio の索引と tsuzuri の画面）で同じものに 2 つの名が付く。範囲は語彙の定義と索引の欄の決まりの注が持てる。
  - id: c
    name: 裁定 id を節点の欄（rulings）に持つ
    text: 設計ノートの承認欄の裁定 id を、そのノートの各行の節点の欄に写す。
    verdict: rejected
    reason: 裁定 id を切り出す関数を索引も持つことになり、書き出しと 2 つの読み手になる（条 P-6.3）。同じノートの全行が同じ裁定を重ねて持ち、持ち主が承認した --summary の 7 欄の形（要件書 第 1.52 版）も変わる。
  - id: d
    name: 辺の型に今の型（relations.reqs か basis）を使う
    text: 新しい型を足さず、今の型の名で行 → 要件の辺を出す。
    verdict: rejected
    reason: 型の名は辺の出所の欄の名で、別の欄の名を使うと出所を偽る。relations.reqs は憲法の関係の欄、basis は要件書と判断の記録の根拠の欄である。
  - id: e
    name: ノートそのものや、ほかの表の行も節点にする
    text: 設計ノート 1 本を節点にし、部品・口・欄・歯の表の行も節点にする。
    verdict: rejected
    reason: 文書そのものを節点にしない決定（ADR-14 決定 (1)）に反する。ほかの表の行 id は節の中でだけ一意で、全体の id を作ると索引が作る id になる。外の利用者は求めていない。

basis: [P-2, P-4, P-5, P-6, P-7, P-10, FR9, FR11, FR14, ADR-3, ADR-13, ADR-14, ADR-30, ADR-31, R-4, D-17, D-18]
produced: [AC30]

consequences:
  - 外の利用者（tsuzuri）の写しでは、前の 2 つの時点の写し（0f09104・1c26a6f）で節点が 240 から 366 に、辺が 539 から 886（行 126・要件への辺 264・先の行への辺 83）になり、今の写し（71b4043）で 240 から 368 に、539 から 889（行 128・要件への辺 267・先の行への辺 83）になる（参考値・2026-09-28）。外の利用者は便 185 の着地の後に folio schema --write（索引の欄の決まりと設計ノートの欄の決まりの 2 本）を撃つまで床が落ちる。本流は節点 1 と辺 1 が増える。
  - 索引の節点の床が設計ノートの file にも掛かり、folio check が設計ノートの書き方も縛る。YAML として同じ意味でも、行の逐語で切れない書き方の契約表は床の違反になり、索引は まだ分からない になる。切れない書き方は、行 id の引用符（二重・単）・type の行の末尾の注釈・type の値の引用符・行の一覧（rows）の列を字下げ 4 に書く・見出しの欄（meta）の id の行の末尾の注釈・流れの形の行の題を引用符で囲み、その中に「, id:」を含む・行の一覧や見出しの欄を流れの形で書く・字下げの無い列である（字下げは 2 / 4 / 6 / 8・id と type の値に注釈も引用符も付けない・本流と tsuzuri の写しでは 0 件）。
  - 1 本のノートの別々の契約表に同じ行 id を書くと、床が違反に数え、索引のどの口も まだ分からない になる（今は器だけが数えていた）。同じ id の節点を 2 度組んだ索引は、今の種類（要件書など）でも --digest と挨拶の命令（folio hello）が まだ分からない になる（今は黙って 1 つに数えていた・床は前から違反に数える）。
  - 塊の形の行の頭の行に辺の欄（req・depends）を書くと、その欄の変更でも要約値が動く（辺の欄の行として落とすのは字下げ 8 の行）。
  - 注意の先の一覧（未実装）は、変わった要件から契約表の行へ 1 段で届く（ADR-13 決定 (12) の「要再読」と同じ向き）。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 の notes に 1 件ごとに記帳する（日付・材料の在り処・当たった条件）。
    (1) 便 185 の着地の後、索引の節点の床が設計ノートの file で出した違反のうち、器が受け付ける正しい正本なのに行の逐語で切れなかったものが 2 件を超えたら（3 件目で）、行の逐語の切り方を広げるか設計ノートを索引の床の外に置くかを持ち主に問う。
    (2) 契約表の行を持つ設計ノートについて、便 C の書き出しの行と索引の設計ノートの行が file の字で結べない件が 1 件でも出たら、決定 (5) を捨て、裁定 id を節点の欄に持つ形（案 c）を測り直す判断の記録を起こす。
    (3) 外の利用者が索引を使わずに設計ノートの YAML を自分で読む実装を持ったら（読み手が 2 つ）、形を外の利用者の席と持ち主に問う。

approval: {who: 持ち主, date: 2026-09-28, ruling: "f2-648.270 notes 2026-09-28 16:13 JST（逐語「承認する」・判断の記録 ADR-32 と要件書 第 1.54 版〔FR14 に 1 文・AC30 を M1 に割り当て〕・問 2 つは推奨〔種類の名 = 設計ノートの行・裁定 id は節点に持たせず書き出しの file で結ぶ〕）", verbatim: 承認する, surface: R-8}

note: |
  【出所】台帳 f2-648.270。外の利用者（tsuzuri）の求める形は handoff-2026-09-28/tsuzuri-270-shape.md の写し（種類の名・id・辺・欄・裁定 id の渡し方）。
  【検証の要点】条文を改訂しないので、改訂の前の敵対的な検証の記録は要らない。起草役の自己反証: (i)「#」の id は索引が作る id か → 形は欄の決まりの注（id_note）が定め、器と外の利用者の台帳が同じ字で便を指す。(ii) 床が器の意味の検査（ADR-3 決定 (3)）へ広がるか → 新しく数えるのは 1 本のノートの中の行 id の重なりだけで、欄の決まりの注（row_id_note）が既に定めている（索引はこれが無いと組めない）。(iii) 要約値が folio の実装に寄るか → 凍結 anchor の独立の実装（tests/fixtures/schema/node-digest.py）に同じ規則を足し、本流・床の土台・tsuzuri の写しで索引の値と一致させた。
  【実測】script は adr32-scripts/（measure-rows.py・index-notes.py・anchors-185.py ほか）。見本は origin の impl/d185。
