# folio2 判断の記録 ADR-27 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。人が読む面は判断の記録の面（adr-27.html・生成物・手で直さない）。
# 状態: accepted（起草 2026-09-27・orchestrator 席の起草役〔opus 5.5〕・発効 2026-09-27 03:30 JST 席の裁定〔行 D-17・憲法を改訂しない判断の記録〕・f2-648 notes）。憲法の条文は 1 字も変えない。
# 起点: 便 153 の契約（docs/design/delivery-153.md）の独立の検証の blocking B1（~/.local/share/folio2/handoff-2026-09-27/d153-verify.md）で、席が案 (b)「別の判断の記録を短く 1 本起こす」を採った。

id: ADR-27
title: 面の生成を外の置き場へ広げる（様式と部品目録は組み立てに焼いたものを既定にする）

status: accepted
date: 2026-09-27

plain: |
  folio2 の外の置き場（ほかのプロジェクトの設計文書）でも、人が読むページを作れるようにします。
  ページを作る命令は、見た目の元（色や字の大きさを決める様式の file 2 つ）と、使ってよい部品の一覧を、置き場の中から読んでいました。外の置き場にはそれが無いので、ページが作れませんでした。
  この判断で、様式と部品の一覧は、folio2 の中の 1 つの元を道具の組み立てのときに焼き込んだものを使うことにします。置き場に自前の file が在ればそれを使い、在るのに読めないときは黙って替えずに「まだ分からない」と出します。
  置き場へ写しを書き出すことはしません。写しは元とずれていくからです。

context: |
  (1) 判断の記録 ADR-16 決定 (2)(エ) は部品目録を repo ごとに持たないとし、末文で「面の生成（様式の file を置き場の下から写す形を含む）を利用者に広げるときに、別の判断の記録で扱う」と先送りした。本判断はその別の判断の記録である。
  (2) ADR-21 決定 (1) は、骨格のままで落ちる命令を v3 の入口の便で扱うとした。持ち主の直命（2026-09-26 17:32 JST・台帳 f2-648 notes）は、道具としての完成＝ほかの repo で動かすことを最優先にした。
  (3) 便 152（骨格の命令の雛形・PR #344）の後、外の置き場で面の生成と部品の検査が落ちる残りは、置き場に様式の 2 file（folio.css・folio-ui.js）と部品目録（parts.json）が無いことだけである（便 153 の契約と独立の検証の実測）。

decision: |
  (0) 本判断は憲法の条文を改訂しない。規則の表の行を足さない。ADR-16 決定 (2)(エ) の「部品目録は repo ごとに持たない」は変えない。M3 の出口の判定点（ADR-21 決定 (1)）も変えない。
  (1) **面の生成（build・face・parts --check）を外の置き場へ広げる。**
  (2) **様式の 2 file と部品目録は、組み立て時に焼いたものを既定にする。** 焼く元は folio2 の生成物の棚（design-intent/preview/）の file 1 つずつで、写しを手で持たない（条 P-2.3・要件 NFR2）。置き場の下に file が在れば今までどおりそれを使う（様式は置き場の下から写し、部品目録は組み立て時の一覧と照らす＝ADR-16 の形のまま）。「無い」は file が見つからないときだけで、在るのに読めない（dir・壊れた symlink・権限が無い・途中が file）ときは今までどおり まだ分からない とする（条 P-4.1）。
  (3) **骨格の命令（init）は様式と部品目録を置き場へ書かない。** 受入基準 AC19 の書く file 11 本の閉じた一覧を保つ。
  (4) **実装は便 153（行 ez）で運ぶ。**

options:
  - id: a
    name: 組み立て時に焼いたものを既定にする（採る）
    text: 決定 (0)〜(4) の形。置き場に file が無いときだけ、道具に焼いた 1 つの元で面を生成し部品を数える。
    verdict: adopted
    reason: 元が 1 つのまま（条 P-2.3）で、骨格の書く file も増えない。読めない file を黙って替えない（条 P-4.1）。
  - id: b
    name: 骨格の命令が置き場へ様式と部品目録の写しを書く
    text: 骨格の命令（init）が folio2 の 3 file を置き場へ写す。
    verdict: rejected
    reason: 受入基準 AC19 の閉じた一覧が崩れる。置き場の写しは folio2 の元が変わるとずれる（条 P-2.3）。
  - id: c
    name: 利用者が手で写す
    text: 案内に従い、利用者が folio2 の 3 file を自分の置き場へ写す。
    verdict: rejected
    reason: 手直しなしには回らず、道具としての完成を最優先にした持ち主の直命に合わない。写しがずれるのも案 b と同じ。

basis: [P-2, P-4, P-6, P-12, R-8, D-16, D-17, D-18, FR4, FR7, FR22, NFR2, AC19, ADR-16, ADR-21]

revises:
  - {target: ADR-16, decision: (2)(エ), kind: widen, summary: 末文の先送り（面の生成を利用者に広げるときは別の判断の記録で扱う）を本判断が引き受け、1 つの生成器の部品目録を使う形を外の置き場の面の生成へ広げ、様式の 2 file も置き場に無ければ組み立て時に焼いた 1 つの元を使う（1 文目の「repo ごとに持たない」は変えない）}

consequences:
  - 骨格のままの外の置き場でも、面の生成が配信先を書き、部品の検査が数えられる。終了コードは、床が まだ分からない を返すあいだはそのまま まだ分からない である。
  - 失うものは置き場ごとの見た目である。自前の様式を置かない置き場の面は、どれも folio2 と同じ見た目になる。
  - ADR-16 文脈 (エ) の「様式の 2 file は検査される置き場の下から写す」と、同 帰結の「利用者の repo は…様式の file も持たない…描かれない」の様式の字は、本判断の改訂の欄が持つ。字の直しは次の節目の材料（行 D-16・D-18）で、台帳 f2-648.189 に控える。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 の notes に記帳する。
    (1) 外の置き場が自分の様式（design token）を要すると持ち主か利用者が言った記帳が 1 件になったら、置き場ごとの様式の持ち方を問い直す。
    (2) 焼いた様式か部品目録と folio2 の生成物の棚（design-intent/preview/）の食い違いを床か歯が拾った回が 1 回になったら、焼き方を問い直す。

approval: {who: orchestrator 席, date: 2026-09-27, ruling: "f2-648 notes 2026-09-27 03:30 JST（席の裁定・行 D-17・憲法を改訂しない判断の記録）", verbatim: 席の裁定（ADR-16 決定 (2)(エ) の別の判断の記録・便 153 の前提）, surface: R-8}

note: |
  【実装】焼いた元は crates/folio/src/parts.rs の BAKED_CATALOG・BAKED_CSS・BAKED_UI_JS（include_str! で design-intent/preview/ を読む）、様式の枝は site.rs の関数 style（便 153 の契約）。「無い」は symlink_metadata の NotFound だけ（検証の blocking B2）。
  【承認】対話面の値域は今 R-8 だけで、席の裁定の記帳先を値域に足す直しは台帳 f2-648.230 の便が運ぶ（行 D-17 の注）。
