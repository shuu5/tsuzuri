# folio2 判断の記録 ADR-34 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。人が読む面は判断の記録の面（adr-34.html・生成物・手で直さない）。
# 状態: proposed（起草 2026-09-28・orchestrator 席の起草役 trust-draft〔opus 5.5〕・席の裁定 16:5x で番号 ADR-34 を割り当て）。持ち主の承認の前。憲法の条文と要件書の字は 1 字も変えない。
# 発効の道（席の裁定 2026-09-28）: 要件書の字が変わらないので行 D-17 では席の裁定で足りるが、床を狭める判断なので ADR-33 と束ねて持ち主の承認に出す。
# 起点: 台帳 f2-648.258・f2-648.177・依頼 ~/.local/share/folio2/handoff-2026-09-28/trust-brief.md・起草の記録 trust-draft.md（実測の表・script は trust-scripts/）。

id: ADR-34
title: 床の版管理の照合が数える履歴を、先頭（HEAD）から辿れる履歴と根の無い枝の履歴に限り、取り込んでいない枝の履歴を数えない

status: accepted
date: 2026-09-28

plain: |
  床（folio check）は、凍結した写し（anchor）が消されたり書き換えられたりしていないかを、版管理（git）の履歴と照らします。
  いまは repo の中の全部の枝の履歴を照らします。そのため、作業中の別の枝で写しを 1 枚足すと、本流の手元の床が「履歴に在った写しが無い」と言って落ちます。その枝がまだ本流に入っていないだけで、本物の違反ではありません。
  並べて進める枝が増えるほど、この偽の違反で席と作業者が止まります。外の利用者（tsuzuri）も作業枝を持ちます。
  この判断の後は、いま検査している枝の過去（先頭から辿れる履歴）と、その枝と過去を 1 つも共有しない枝（根の無い枝）の履歴だけを照らします。本流から分かれてまだ本流に入っていない枝の履歴は数えません。
  本流の上で写しを消した・書き換えた、は今までどおり落ちます。根の無い枝へ切って写しを外す手口も、その枝の上で落ちます。
  写しの無い頃の過去から切り直した枝で写しを作り直すと、その枝の上の床は通ることがあります。ただし、その枝を本流へ取り込んだ時点で（merge・squash・rebase のどれでも）、本流の床が落とします。
  あわせて、取り込みの形によっては本流の床が見落としていた穴（この判断の前からある）を塞ぎます。

context: |
  (1) 出所（台帳 f2-648.177・2026-09-24 と f2-648.258・2026-09-27）。取り込んでいない枝（docs/adr17）が憲法の写しの 1 枚（anchors/constitution-v1.3.yaml）を足した時点で、本流（628c547）の作業ツリーの床が違反 1「版管理の履歴に在ったが作業ツリーに無い」を出した。止めた便 170 の作業の枝と控えの枝（impl/f2-648.254-run1）が封の一覧（anchors/adr-seals.yaml）を持つ間、本流の根の床が同じ違反 1 を出し、本物の design-intent を検査する歯 5 本も手元で落ちた（便 172 の設計ノートの前提 5）。CI は浅い写しなので落ちない＝手元だけの偽の違反。2 例目が出たので、台帳 .258 の昇格条件に当たる。
  (2) 床の中で版管理を読むのは版管理の照合の実装（crates/folio/src/gitcheck.rs）だけで、全ての参照の履歴を読むのは履歴の一覧の命令（git log --all --name-status）と、その commit の本文を出す命令（git show）の 1 か所である。ほかの命令（rev-parse・check-ignore・ls-tree HEAD）は先頭か作業ツリーだけを読む。この履歴から、履歴に在った anchor（消えたら違反）・同じ形式の anchor の中身（違えば差し替えの違反）・列の始め直しの判定（版管理の履歴に anchor が在った）の 3 つを組む。
  (3) 判断の記録 ADR-2 決定 (3) は「全ての参照（ref）の履歴を見て、先頭（HEAD）か履歴に在った anchor が作業ツリーに在ること・履歴に在った同じ形式の anchor と中身が同じこと」と書く。偽の違反はこの字どおりの帰結である。ADR-2 の前提は敵対レビュー 5 周目（2026-09-13）が、版管理の見え方（別の版管理・根の無い枝・浅い写し・環境変数・記録の無い版管理）を選べば列を始め直して持ち帰れると示したことで、床の fixture の根の無い枝の場合（git-orphan-branch-refreeze・根の無い枝へ切って anchor の置き場を外し凍結し直す手口）はこの照合で落ちる。ADR-2 の帰結は、履歴ごと書き換える細工（強制の push・参照の付け替え）を床の外に置く。
  (4) 実測（参考値・2026-09-28・最小の手書きの写し 7 つ・本流 7528256 の binary と便 190 の見本の binary）。偽の違反 3 形 = 取り込んでいない枝が anchor を足す（違反 1）・中身を書き換える（差し替えの違反 1）・anchor の無い本流と最初の anchor を足した枝（違反 2・本来は「まだ分からない」）は、見本で 0 になる。本物の違反 3 形 = 本流で削除を commit・根の無い枝で anchors/ を外す・今の枝で書き換えを commit は、見本でも同じ数で落ちる。封の一覧が入る前の本流の commit（b0f09d4）に控えの枝の参照を持つ写しでは、本流の binary の違反「封の一覧は版管理の履歴に在ったが作業ツリーに無い」1 が見本で 0 になる。外の利用者の写し（tsuzuri・a618238・枝 154・先頭の外の commit 146）は、本流の binary と見本の床の出力が byte で同じ（合格 0/0）。敵対の形（共通の祖先を持つ枝で anchor を消して中身の違う同じ版を置き直し、その枝を先頭へ取り込む）は、取り込む前の本流では数えず、取り込んだ後は差し替えの違反 1 で落ちる。版管理の外の用途の参照（台帳の置き場の形の refs/dolt/data・anchor の置き場に触れない根の無い 2 commit）を足しても違反は増えない。要件書・憲法・規則の表に「全ての参照」を名指す字は無い（2026-09-28 に grep で確かめた）。
  (5) 独立の検証（2026-09-28・handoff-2026-09-28/trust-verify.md・本物の design-intent を持つ写しの 39 場面）。anchor の無い頃の commit から切った枝で中身の違う同じ版を凍結し直す形と、根の無い枝に anchor の無い頃の commit を繋ぐ形（merge -s ours）は、見本の範囲ではその枝の上の床が合格（終了コード 0）になる（本判断の前の床は 1）。さらに、その枝を普通の merge（衝突を枝の側で解く）で本流へ取り込んだ後の本流の床は、本判断の前も見本も合格だった。原因は履歴の一覧の命令（git log -- <anchor の置き場>）の既定の履歴の簡約で、取り込みの commit の anchor の置き場が枝の側の親と同じなら、本流の側の親（元の anchor を足した commit）を辿らない。--full-history を足すとこの 2 形だけが本流で落ち（差し替えの違反 1）、ほかの 36 場面と folio2・tsuzuri の写しの床の出力は変わらない。--full-history だけでは、未追跡の file を作業の一時置き場へ退けた形（git stash -u の未追跡の commit は根の無い commit）で偽の違反が 1 つ増えるので、作業の一時置き場（refs/stash）を数えから外す。
  (6) 判断の記録 ADR-30 決定 (1) により、発効した判断の記録（ADR-2）の本文は変えない。今の規範は判断の記録の欄の決まり（adr/schema.yaml の生成区間の注 anchor_note と limits_note・床の定数の写し）が持つ。

decision: |
  (0) 本判断は憲法の条文を改訂しない。判断の記録 ADR-2 の本文は変えない（ADR-30 決定 (1)）。
  (1) **数える履歴。** 床の版管理の照合が数える commit は、(a) 先頭（HEAD）から辿れる commit と、(b) 先頭から辿れず、祖先にも先頭から辿れる commit を 1 つも持たない commit（根の無い枝）とする。(c) 先頭から辿れず、祖先に先頭から辿れる commit を持つ commit（取り込んでいない枝・先頭より先へ進んだ参照・止めた便の枝）は数えない。3 つの照合（履歴に在った anchor・同じ形式の anchor の中身・列の始め直しの判定）とも同じ範囲を使う。(c) の commit も、先頭へ取り込んだ時点で先頭から辿れる commit になり数える（共通の祖先を持つ枝で anchor を消して凍結し直した枝は、取り込みの形〔merge・squash・rebase〕を問わず、取り込んだ後の本流の床が落とす。merge では決定 (2) の --full-history で本流の側の親を辿る）。作業の一時置き場（refs/stash）は数えない。(b) には版管理の外の用途の参照（例 台帳の置き場の refs/dolt/data）の根の無い履歴も入るが、anchor の置き場に触れない履歴は照合に何も足さない。ADR-2 決定 (3) の「全ての参照（ref）の履歴」をこの範囲に狭める。
  (2) **読み方。** 全ての参照は今までどおり読む（履歴の一覧の命令〔git log --exclude=refs/stash --all --full-history〕）。--full-history は、取り込みの commit の anchor の置き場が片方の親と同じでも、もう片方の親の履歴を落とさない（既定の履歴の簡約を切る・本判断の前の床より強い）。(c) の commit は親つきの commit の一覧（git rev-list --parents --exclude=refs/stash --all --not HEAD）から 1 回で組み、先頭から辿れる親を持つ commit から子へ辿って拾う。命令が失敗したら「まだ分からない」とする（今の「版管理を読めない」と同じ）。
  (3) **変えないもの。** 先頭の木（ls-tree）との照合・除外（ignore）・未追跡・版管理の根・浅い写し・環境変数の遮断・列の根の digest の照らし・違反の字。床の fixture（tests/floor_cases.yaml）の字（根の無い枝の場合〔git-orphan-branch-refreeze〕は今の字のまま落ちる）。folio build の出力。
  (4) **その枝の上での早い検出は床の外に置く。** anchor の無い頃の commit から切り直した枝（本流と共通の祖先を持つ）と、根の無い枝に anchor の無い頃の commit を繋いだ枝（merge -s ours）は、本流の anchor を数えないので、そこで anchor を置き直すと、その枝の上の床は通りうる（anchor を外しただけなら 0 本の「まだ分からない」か、記録が在るのに anchor が無い違反）。その枝を本流へ取り込んだ時点で、本流の床が落とす（決定 (1)(2)）。本流の床を通さずに入れる道は参照の付け替え（強制の push）だけで、ADR-2 の帰結の床の外として、取り込みの審査と共有先（remote）の保護に任せる。
  (5) **今の規範の置き場。** 判断の記録の欄の決まり（adr/schema.yaml）の注 2 つ（anchor_note・limits_note）に本判断の範囲を書く（床の定数の置き場〔crates/folio/src/floor_adr.rs〕を直し、folio schema --write で生成区間を書き直す）。
  (6) **便。** 便 190（行 gk）1 本で、実装・注 2 つ・生成区間・凍結 anchor（tests/fixtures/schema/adr-region.txt）・歯を運ぶ。本判断の発効の後に受け付ける。

options:
  - id: a
    name: 先頭から辿れる履歴と根の無い枝の履歴を数え、取り込んでいない枝の履歴を数えない（採る）
    text: 決定 (1)〜(6) の形。
    verdict: adopted
    reason: 偽の違反 3 形が消え、本物の違反 3 形と根の無い枝の手口（床の fixture の git-orphan-branch-refreeze）は今までどおり落ちる。全ての参照を読むことは変えず、数える範囲だけを先頭との祖先の関係で決めるので、どの置き場でも同じ式で動く。
  - id: b
    name: 先頭から辿れる履歴だけを数える
    text: 履歴の一覧の命令を全ての参照（git log --all）から先頭だけ（git log HEAD）に替える（台帳 .177 の候補・依頼の既定）。
    verdict: rejected
    reason: 根の無い枝へ切って anchor の置き場を外す手口（ADR-2 の前提の敵対レビュー 5 周目）の防ぎが消える。見本をこの形に変えると、床の fixture の根の無い枝の場合（git-orphan-branch-refreeze）と便 190 の歯の 1 本（f190_rootless_branch_still_sees_the_other_history）が落ちる（変異 M2 で実測）。
  - id: c
    name: 先頭から辿れる履歴と、先頭を祖先に持つ参照の履歴を数える
    text: 台帳 .258 の候補。
    verdict: rejected
    reason: 本流から切って、本流がまだ進んでいない作業枝は先頭を祖先に持つので、偽の違反の多くが残る（最小の写しの偽の違反 3 形はどれもこの形）。
  - id: d
    name: 全ての参照の履歴を数えるまま（今の形）
    text: 手元の床は、取り込んでいない枝の無い写し（浅い写し・clone --single-branch）で撃つ運用で避ける。
    verdict: rejected
    reason: 偽の違反は並べる枝の数だけ増え、席・作業者・外の利用者がそのたびに写しを作り直す。止めた便の枝や控えの枝は消すまで残る（消すのは持ち主の手）。
  - id: e
    name: 既定の枝の参照（origin/HEAD）の履歴も数える
    text: 本流の参照を「正」として、先頭の履歴に足す。
    verdict: rejected
    reason: 本流が先へ進んだ作業枝で、本流が新しく足した anchor を「無い」と数える偽の違反が出る（台帳 .177 の形の裏返し）。共有先（remote）の名と既定の枝の設定は置き場ごとに違い、無い置き場もある。

basis: [P-3, P-4, P-8, P-10, FR5, ADR-2, ADR-30]

consequences:
  - 本流の手元の床と、本物の design-intent を検査する歯は、取り込んでいない枝・止めた便の枝・控えの枝が在っても落ちない。枝の上で周を回すときも、その枝を先頭にした写しで撃てば本流の枝の履歴に引かれない。
  - 取り込んでいない枝で anchor を足した・書き換えた、は、その枝を先頭にした床でだけ数える（本流の anchor はその枝の祖先なので、書き換えはその枝の床で落ちる）。
  - 先へ進んだ参照（例 取り込んだ後の origin/main）に在って手元の先頭に無い anchor は数えない＝手元が遅れているだけのときに「消えた」と言わない。
  - 取り込みの commit の anchor の置き場が枝の側と同じとき、本判断の前の床は本流の側の親を辿らず、anchor の無い頃から切った枝で凍結し直して衝突を枝の側で解いた取り込みの後も本流の床が黙っていた（本判断の前から在る穴）。決定 (2) の --full-history でこの形も本流の床が落とす＝この点では本判断の前より強い。
  - 浅い写しで全部の枝を持つ形（clone --depth 1 --no-single-branch）では、枝の先頭が親の無い浅い commit になって根の無い枝として数えるので、取り込んでいない枝の偽の違反が残る（決定 (3) で浅い写しは変えない・CI の既定の 1 つの参照の浅い写しには出ない）。
  - 床の版管理の命令が 1 本（git rev-list）増える（folio2 の写しで 0.02〜0.03 秒・参考値）。
  - 外の利用者は、便 190 の着地の後に folio schema --write（判断の記録の欄の決まりの注 2 つ）を撃つまで folio schema --check が落ちる。床（folio check）は注を数えないので落ちない。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 の notes に 1 件ごとに記帳する（日付・材料の在り処・当たった条件）。
    (1) 便 190 の着地の後、取り込んでいない枝の履歴のせいで本流の床が違反を出した件が 1 件でも出たら、決定 (2) の組み方を測り直す（範囲の実装の漏れ）。
    (2) 決定 (4) の枝（anchor の無い頃の commit から切り直した枝・根の無い枝に繋いだ枝）で anchor を外すか置き直した commit が本流の先頭の祖先に入ったのに、取り込みの後の本流の床（folio check）が版管理の違反を出さなかった件が 1 件でも出たら（数え方 = 取り込みの後の本流で folio check を撃ち、終了コードと違反の字を記帳する。参照の付け替えで入った件は、共有先〔remote〕の保護の記録と、付け替えの後の本流の床で数える）、本判断を捨て、全ての参照を数える形（ADR-2 のまま）か既定の枝の参照を数える形（案 e）を測り直す判断の記録を起こす。
    (3) 外の利用者の置き場で、本判断の範囲では偽の違反が消えない枝の形（例 別の repo の履歴を取り込んだ枝）が出たら、形を外の利用者の席と持ち主に問う。

approval: {who: 持ち主, date: 2026-09-28, ruling: "f2-648 notes 2026-09-28 22:08 JST（逐語「推奨で良い」・承認の束 B = 判断の記録 ADR-34・台帳 f2-648.258 / f2-648.177・問 1 つは推奨〔照らす範囲 = 今の枝の過去と根の無い枝〕）", verbatim: 推奨で良い, surface: R-8}

note: |
  【出所】台帳 f2-648.258・f2-648.177。席の裁定（2026-09-28 16:5x・lanes-common.md の表）で番号 ADR-34 を割り当てた。
  【検証の要点】条文を改訂しないので、改訂の前の敵対的な検証の記録は要らない。床を狭める判断なので、独立の検証の記録（handoff-2026-09-28/trust-verify.md・39 場面・本物の写し・変異）を添える。その blocking 1（字が実測と合わない）を受けて改訂 a で --full-history と --exclude=refs/stash を足し、決定 (1)(2)(4)・平易文・撤退条件 (2) を実測どおりに直した。起草役の自己反証: (i) 狭めると防ぎが減るか → 根の無い枝の手口はその枝の上で落ちる。減るのは anchor の無い頃から切り直した枝（と根の無い枝に繋いだ枝）の上での早い検出で、その枝の床は通りうる。本流へは取り込みの形を問わず本流の床が落とし、本流の床を通さない道は参照の付け替えだけ（ADR-2 の帰結の床の外）。(ii) ADR-2 の本文を変えるか → 変えない。狭めた範囲は本判断と欄の決まりの注が持つ（ADR-30 決定 (1)）。(iii) 外の利用者の答えが変わるか → tsuzuri の写しで床の出力が byte で同じ。
  【実測】script は trust-scripts/（repro.sh・tz-190.sh・mut-190.py ほか）。見本は origin の impl/d190。
