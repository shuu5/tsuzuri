consequences:
  - 憲法は第 1.3 版になる（3 度目の条文の改訂・改める欄は条 N-6 の見出しと前文の根拠の行の 2 つ・規範文は 0 本）。凍結 anchor は第 1.3 版の file（anchors/constitution-v1.3.yaml）として置き、索引に 1 項を追記する。列の根（第 1.0 版の anchor）の要約値と床の定数は変わらない＝列の 4 枚目が増えるだけである（写しで実測・docs/design/adr-17.md）。
  - CLAUDE.md の生成区間は 1 字も動かない（見出しと前文の根拠の行は生成区間に写らない）。要件書・語彙・規則の表・実装・便の契約も動かない＝本改訂で運ぶ便は無い。歯は改訂来歴の項の数を固定する 1 本の値だけが動き（決定 (5)）、席はその file を自分の取り込みの要求で直せる（席は歯と fixture を直す権限を持つ）。
  - 面は、憲法の面（条 N-6 の見出し・条 A-1 の関係の欄・前文の根拠の行）・条 N-6 を根拠に持つ判断の記録の面（ADR-4・ADR-5・ADR-6・ADR-12〔注の 1 段落も〕・本判断）・要件書の面（FR7 の根拠）が組み立てのたびに変わる。入口の面には条の見出しは出ない。前文は改訂来歴の欄を持たないので、憲法の面の前文に改訂来歴は出ない（前文の改訂は本判断の面の改訂の欄と憲法の先頭の注の版の行が持つ）。天井の印は正本が変わるので古くなり、次の周（28 周目以降）で読み直される。
  - 判断の記録 ADR-12 の決定の本文と改訂の欄には第 1.2 版の見出しの字が残る。注の断りで読み方と今の字を示す（決定 (3)）。
  - 英字の語（walk）が消えるのは憲法の中だけである。入口の承認欄・受入基準 AC5・判断の記録 ADR-5 / ADR-7 と要件書の図の節の節点の id には残る（本判断の範囲の外で動かさない）。
  - 配信の断りの文言（「拒否 — bind 先 <住所> は tailnet の外」）と判断の記録 ADR-5 の決定 (5) の「tailnet の外への接続は拒む」は、本判断の範囲の外で動かさない（前者は判断の記録 ADR-12 の帰結が次に配信の実装を触る便へ回した。後者は第 1.2 版より前の発効済みの記録の字で、並べた句の読み違いは起きない）。
  - 本判断は条文を改訂するので A-2.3 の対象である＝発効の前に反対側からの検証を実施し、その記録を設計ノートの file（docs/design/adr-17-grill.md）に置いて検証の欄（grill）で指す。承認は持ち主の逐語・日付・裁定 id・対話面 R-8 を承認の欄（approval）と台帳に記帳する。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 の notes に記帳する。窓は発効から天井の周を 3 周回し終えるまでとする。発効から 14 日を過ぎても 3 周に満たなければ、その日までに回った周で判定し、1 周も回らなければ判定を「まだ分からない」に落として持ち主へ渡す（P-4.2）。
    数える所見は、観点を問わず、重さが「直す」なら挙がった時点の 1 件、「止める」なら反証で支持された 1 件とする（天井の正本 ceiling.yaml の weights.refute は「止める」だけを反証に回し、「直す」は反証を経ない）。所見は場所（place）と引用（evidence）と理由の欄で数える。
    (1) 見出し。場所が憲法の条 N-6 の見出しの欄（articles.N-6.title）で、理由が「拒む先（どこが拒まれるか）が読み取れない」か「規範文 N-6.1 と違う範囲を名指す」なら、その 1 件で決定 (1) を捨て、案 b（肯定の形「限る」）か案 e（規範文 N-6.1 の字「でも…でもない先へ」）へ改める改訂を持ち主に問う判断の記録を起こす。
    (2) 根拠の行。場所が憲法の前文の根拠の行の欄（precedence.rationale）で、理由が「承認の出所（台帳 f2-648 notes 2026-09-12 の見本 v4 の承認）を辿れない」か「日本語の言い換えが承認の事実と違う」なら、その 1 件で決定 (2) を捨て、案 g（受入基準 AC5 と同じ形・日本語の後に原語を括弧）か台帳の場所を添える形へ改める改訂を持ち主に問う。
    (3) 断りの注。場所が判断の記録 ADR-12 の決定の欄（decision）か改訂の欄（amends）で、引用が第 1.2 版の見出しの字を含み、理由が拒む先の読み違いなら、その 1 件で決定 (3) を捨て、判断の記録の決定の本文の古い字を扱う形（例えば面が改訂済みの印を出す）を持ち主に問う。
    (4) 数えられない回。周の束が読めない・所見の欄が壊れているなどで (1)〜(3) を数えられなかった回が規則の表の行 R-7 の回数を超えたら、本判断の撤退条件の判定を「まだ分からない」に落として持ち主へ渡す（P-4.2・P-11.1）。

