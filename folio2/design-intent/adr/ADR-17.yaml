# 状態: accepted（発効 2026-09-24・持ち主の承認 2026-09-24 11:51 JST「全部推奨で」・台帳 f2-648 notes・対話面 R-8）。起草 2026-09-24・作成 = orchestrator 席〔AI・fable 5.1〕の起草役。憲法の条文の改訂（第 1.3 版）を伴い、A-2 / N-4 の手順（反対側からの検証・持ち主の承認の逐語・凍結 anchor v1.3・再注入の確かめ）を通した。
# 位置: 台帳 f2-648.168。一括 15 の問 6（持ち主の承認 2026-09-24 07:46 JST「承認する」・推奨どおり＝一括 15 の後に 2 つを束ねた 1 本の判断の記録を起こす）の受け皿。
# 反対側からの検証（grill）= docs/design/adr-17-grill.md（A-2.3 により改訂の前に実施）。承認要求の要旨と、承認の後に席が書く欄の表 = docs/design/adr-17.md。
# 起草の時点では憲法の正本を 1 字も変えなかった。版上げと凍結 anchor（anchors/constitution-v1.3.yaml）と改訂来歴と承認欄は、持ち主の承認の後に同じ取り込みの要求で置いた。

id: ADR-17
title: 条 N-6 の見出しを「同じ端末の中と tailnet の中より外へ広げない」の向きに、前文の順位の根拠の行の英字の語（walk）を日本語に改める（憲法 第 1.3 版）

status: accepted
date: 2026-09-24

plain: |
  憲法の字を 2 か所だけ直します。中身（守らせる決まり）は 1 つも変わりません。
  1 つ目は、「見せる先」の条（N-6）の見出しです。今は「見せる先を同じ端末の中と tailnet の外へ広げない」です。
  これは「同じ端末の中」と「tailnet の外」を並べた句にも読めて、そう読むと「同じ端末の中へも広げない」になり、本文と逆になります。
  本文は「同じ端末の中か私設ネット（tailnet）の中だけに見せ、そのどちらでもない先は機械が止める」と言っています。
  そこで見出しを「見せる先を、同じ端末の中と tailnet の中より外へ広げない」に改めます。
  要件書の図の名札は、この前の一括で同じ字に揃えてあります。
  2 つ目は、憲法の前書きの「迷ったらどちらへ倒すか」の根拠の行にある英語の語（walk）です。
  「持ち主が実際に開いて読み、承認済み」という日本語に置き換えます。
  見出しも前書きも、1 字でも変えるには憲法の改訂の手順（理由とやめる条件を書き、反対側から確かめ、あなたの OK をもらう）が要ります。
  手順を 2 回に分けないよう、2 つを 1 回にまとめました。
  前の判断の記録（ADR-12）には古い見出しの字がそのまま残っています。そこは当時の記録なので書き換えず、読み方の断りを注に 1 段落足します。

context: |
  (1) 条 N-6 の見出し。天井の 27 周目（2026-09-23）の読みやすさの審査役は、条 N-6 の見出し「見せる先を同じ端末の中と tailnet の外へ広げない」を直す所見（読みやすさ F-4）に挙げた。
  この句は「同じ端末の中と tailnet」の外、と読むのが起草の意図だが、「同じ端末の中」と「tailnet の外」を「と」で並べた句にも読める。
  後の読みでは「同じ端末の中へも広げない」になり、同じ端末の中（loopback）を拒まない規範文 N-6.1 と平易文の逆になる。
  平易文を読めば解けるが、見出しは平易文の無い場所にも出る（憲法の面の条 A-1 の関係の欄・条 N-6 を根拠に持つ判断の記録 ADR-4 / ADR-5 / ADR-6 / ADR-12 の根拠の一覧・要件書 FR7 の根拠。起草の写しの組み立てで実測・入口の面には出ない）。
  見出しは判断の記録 ADR-12 が第 1.2 版で「見せる先を tailnet の外へ広げない」から今の字に改めたもので、その時の検証の記録の提案 1 が「同じ向きに改める」ことを求め、字の二通りの読みは検討されなかった。
  要件書 FR7 の図の節（fig-tech）の名札と副題に在った同じ字は、一括 15 の問 1（2026-09-24 承認）で同じ向きの字（「同じ端末の中と tailnet の中より外」）に揃えた。
  見出しは条 A-2.2 が名指す条文の 5 欄（id・見出し・規範文・段・縛る相手）の 1 つで、凍結 anchor の写しに入るので、直すには条 A-2 の改訂（判断の記録と撤退条件・敵対的検証・持ち主の承認）が要る。

  (2) 前文の順位の根拠の行の英字の語（walk）。天井の 24 周目（2026-09-22）の読みやすさの審査役は、前文（precedence）の根拠の行
  「見本 v4 §0「迷ったらどちらへ倒すか」（walk 承認済み・2026-09-12）」の英字の語を直す所見（読みやすさ F-1）に挙げた。
  その語（walk）は語彙の見出し語にも原語にも識別子の免除の一覧にも無く、面の用語集で引けない（前文の根拠の行は規則の表の行 R-9 の母集団の外なので床の違反ではなく、天井の読みやすさの所見である）。要件書の受入基準 AC5 は同じことを「実際に開いて読み（walk）」と日本語を先に書いている。
  前文は改訂の範囲（憲法 schema.amendment_scope = schema・precedence・articles）の節で、凍結 anchor は前文を根拠の行まで丸ごと写す。
  字を変えると床が「判断の記録と承認を伴わない改憲」で落とす（一括 12 がその枝で実測した）。一括 12〜15 はこれを直さずに持ち越した。

  (3) 束ねる理由。一括 15 の問 6 は、2 つを 1 本の判断の記録で運ぶ改訂を一括 15 の後に起こすことを問い、持ち主は推奨どおり承認した（2026-09-24 07:46 JST「承認する」）。
  1 本ずつ起こすと、敵対的検証・持ち主の承認・凍結 anchor の版が 2 回ずつ要る。

  (4) 発効済みの判断の記録 ADR-12 の決定 (1) の本文と改訂の欄（amends）の見出しの行は、第 1.2 版の見出しの字をそのまま持つ。
  改訂の欄の後の字（new_text）は、床が第 1.1 版と第 1.2 版の凍結 anchor の差分と 1 字ずつ突き合わせる（列の全区間の消し込み）ので、書き換えられない。
  決定の本文は床が突き合わせないが、改訂の欄と同じ字を持つ当時の記録である。

decision: |
  (1) 憲法を第 1.3 版に改訂する。条 N-6 の見出しを
  「見せる先を同じ端末の中と tailnet の外へ広げない」から
  「見せる先を、同じ端末の中と tailnet の中より外へ広げない」に改める。
  条の id・段（never）・縛る相手（tool）・規範文 N-6.1 と N-6.2 は 1 字も変えない。拒む先の範囲も変えない（見出しが本文と同じ範囲を名指すようにするだけである）。

  (2) 同じ版で、前文の順位の根拠の行の 1 行目（precedence.rationale の kind folio2-ruling の行）の参照の字（ref）を
  「見本 v4 §0「迷ったらどちらへ倒すか」（walk 承認済み・2026-09-12）」から
  「見本 v4 §0「迷ったらどちらへ倒すか」（持ち主が実際に開いて読み、承認済み・2026-09-12）」に改める。
  前文の規範文（text）・平易文（plain）・縛る相手・機構と、根拠の行の 2 行目は 1 字も変えない。

  (3) 判断の記録 ADR-12 の決定の本文と改訂の欄は変えない。発効のときに、ADR-12 の注（note）の末尾へ次の 1 段落を足して断る（逐語）。
  「【判断の記録 ADR-17 による見出しの改訂（憲法 第 1.3 版）】決定 (1) と改訂の欄に在る見出しの字「見せる先を同じ端末の中と tailnet の外へ広げない」は第 1.2 版の見出しの逐語で、書き換えない（改訂の欄の字は第 1.2 版の凍結 anchor との消し込みが固定し、決定 (1) の字は当時の決定の記録である）。
  この字は「同じ端末の中」と「tailnet の外」を並べた句にも読めるが、意味は規範文 N-6.1 と平易文のとおり、同じ端末の中でも tailnet の中でもない先へ広げない、である。
  第 1.3 版で見出しを「見せる先を、同じ端末の中と tailnet の中より外へ広げない」に改めた（判断の記録 ADR-17・持ち主の承認 <日付 時刻> JST・台帳 f2-648 notes）。」

  (4) 改訂の来歴。条 N-6 の改訂来歴（amended_by）に 2 件目を置く（1 件目の ADR-12 の行は変えない）。
  前文は改訂来歴の欄を持たない（憲法 schema の precedence.optional が空）ので、前文の改訂は本判断の改訂の欄（amends）の行だけが持つ。
  改訂の欄は、床の差分の印字（folio check --emit-amends）を起草の写しで撃って得た 2 行で、版の字だけ v1.3 にする（本 file の amends）。

  (5) 条文の外の字で、同じ版で揃えるもの。憲法の先頭の注の版の行（v1.3 と第 1.3 版の来歴）と版の欄（meta.version）の値 v1.3。
  CLAUDE.md の生成区間（前文の規範文と条の規範文）は 1 字も動かない＝再注入は差分 0 を確かめるだけである（写しで実測）。
  要件書・語彙・規則の表・実装・便の契約は 1 行も動かない。歯は 1 本だけ、正本の改訂来歴の項の数を固定する歯（crates/folio/tests/face_constitution.rs の f80_amendment_rows_carry_the_previous_text・値 4 → 5）を発効の取り込みの要求で同時に直す（起草の写しの模擬で、この 1 本だけが落ちると実測した）。
  憲法の先頭の注の版の行には「第 1.3 版 <発効日> = 判断の記録 ADR-17（条 N-6 の見出しと前文の根拠の行の字の直し・規範文は 0 本）」と、規範文が動かないことまで書く。

  (6) 発効の手順は A-2 のとおり＝反対側からの検証（docs/design/adr-17-grill.md）を改訂の前に実施し、持ち主の承認（逐語・日付・裁定 id・対話面 R-8）を得てから、
  席が 1 本の取り込みの要求で (1)(2)(4)(5) と ADR-12 の注 (3) と、歯 1 本の値の更新と、本判断の状態（accepted）・承認欄を置き（検証の欄は検証を終えた起草の時点で置いた）、凍結 anchor（anchors/constitution-v1.3.yaml と索引の 1 項）を folio check --freeze-anchor で書く。
  凍結の前に、その時点の本流（main）の上で folio check --emit-amends の 2 行と歯の本数を測り直し、本判断の改訂の欄と一致することを確かめる。
  承認は 1 回で求めるが、(1) 見出し・(2) 根拠の行・(3) ADR-12 の注の断りの 3 つは別々に退けられる（退けたときに外すものは docs/design/adr-17.md の承認要求が持つ）。

options:
  - id: a
    name: 見出しを否定の形のまま「中より外へ」に、根拠の行を日本語だけに（1 版で束ねる）
    text: N-6 の見出しを「見せる先を、同じ端末の中と tailnet の中より外へ広げない」に、前文の根拠の行の英字の語（walk）を含む字を「持ち主が実際に開いて読み、承認済み」に、同じ第 1.3 版で改める。ADR-12 は注で断る。
    verdict: adopted
    reason: 見出しは「同じ端末の中」と「tailnet の中」を同じ形（〜の中）で並べ、その外を「より外」で名指す。並べる 2 つの句の形が揃うので「と」はそこで閉じて読まれやすく、前の字の並べた句の読み（同じ端末の中へも広げない）は弱まる。「より」を起点（〜から）と読んでも意味は同じになる。ただし「同じ端末の中」と「tailnet の中より外」を並べる読みは文法の上では残る（検証の記録の問 1）。段が「絶対にやらない」の条 6 本の見出しはどれも「〜ない」の否定の形で、この形を保つ。要件書の図の名札（一括 15 の問 1 で承認済み）と同じ字の向きになり、面どうしの字が揃う。根拠の行は、受入基準 AC5 と同じ日本語（実際に開いて読み）を使い、英字の語を置かない。2 つを 1 版で運ぶので、検証・承認・凍結が 1 回で済む。
  - id: b
    name: 見出しを肯定の形「限る」に改める
    text: N-6 の見出しを「見せる先を、同じ端末の中か tailnet の中に限る」に改める。前文の根拠の行は案 a と同じ。
    verdict: rejected
    reason: 範囲を肯定の形で名指すので、並べた句の読み違いは案 a より起きにくい。しかし段が「絶対にやらない」の条の見出しで 1 本だけ肯定の形になり、見出しの形と段（やってはいけないこと）の対応が崩れる。「限る」は何を拒むかを読み手が裏返して得る形でもある。要件書の図の名札（「…中より外への bind の拒否」）とも向きが揃わず、図の字をもう 1 度直すか、2 つの字が並ぶことになる。
  - id: c
    name: 憲法は改訂せず、見出しは平易文に任せ、根拠の行の英字の語（walk）は語彙に足す
    text: 見出しは今の字のまま残し、平易文が意味を解くことに頼る。根拠の行の英字の語（walk）は語彙に 1 語足して、面の用語集で引けるようにする。
    verdict: rejected
    reason: 改訂の手順も承認も要らず、語彙の追加は要件書の版で運べる。しかし見出しは平易文の無い場所（条の関係の欄・判断の記録の根拠の一覧・要件書 FR7 の根拠）に出るので、段が「絶対にやらない」の条の見出しが 1 つの読みで本文と逆を言う欠陥がそのまま残る。所見の再発の数は理由にしない（前文の根拠の行の所見は 24 周目の 1 回で 25〜28 周目には無く、条 N-6 の見出しの所見は 27 周目の 1 回で 28 周目には無い・実測）。ただし持ち越しは一括 12〜15 の 4 回続き、持ち主は一括 15 の問 6 で束ねて起こすことを承認した。その語（walk）を語彙に足しても、日本語の文の中に英字の語を先に置く形（専門語は日本語を先に・原語は括弧）は残り、受入基準 AC5 の書き方とも揃わない。1 か所の英字の語のために語彙に語を足すのは、語彙の数えを増やす割に得るものが小さい。
  - id: d
    name: 見出しと根拠の行を 2 本の判断の記録に分ける
    text: 条 N-6 の見出しだけを先に 1 本の判断の記録で直し、根拠の行の英字の語（walk）は後の別の改訂で直す。
    verdict: rejected
    reason: 見出しの直しは早く出せる。しかし検証・承認・凍結 anchor の版が 2 回ずつ要り、憲法の版の列が 1 本ぶん長くなる。一括 15 の問 6 で持ち主はこの案（問 6 の代替案 B）を退け、束ねる推奨を承認した。
  - id: e
    name: 見出しに規範文 N-6.1 の字を写す
    text: N-6 の見出しを「見せる先を、同じ端末の中でも tailnet の中でもない先へ広げない」に改める。前文の根拠の行は案 a と同じ。
    verdict: rejected
    reason: 「でも…でもない」は両方に掛かることが字の上で決まり、並べた句の読みが起きない。規範文 N-6.1 と同じ字なので本文との食い違いも起きない。しかし否定が 2 つ重なり（でもない先へ・広げない）、段が「絶対にやらない」の条の見出し 6 本の中で最も長くなる。要件書の図の名札（一括 15 の問 1 で承認済み）とも字が違う。案 a が次の周で読み違いとして挙がったときの乗り換え先として撤退条件 (1) に置く。
  - id: f
    name: 見出しの掛かりを「を越えて」か読点で切る
    text: N-6 の見出しを「見せる先を、同じ端末の中と tailnet の中を越えて広げない」にするか、読点で「と」の掛かりを切る。前文の根拠の行は案 a と同じ。
    verdict: rejected
    reason: 「を越えて」は名詞に並べられないので、並べた句の読みは案 a より起きにくい。しかし「見せる先を」「中を越えて」と「〜を」が 2 つ続いて字が硬く、図の名札とも字が違う。読点は「と」の掛かりの内側を切れず（「同じ端末の中と、tailnet の外へ」は並べた句の読みをむしろ強める）、採れない。
  - id: g
    name: 根拠の行を受入基準 AC5 と同じ形（日本語の後に原語を括弧）にする
    text: 前文の根拠の行を「見本 v4 §0「迷ったらどちらへ倒すか」（持ち主が実際に開いて読み（walk）、承認済み・2026-09-12）」に改める。見出しは案 a と同じ。
    verdict: rejected
    reason: 憲法の読み方の注（専門語は日本語を先に、原語は括弧）と受入基準 AC5 の書き方に揃い、その英字の語で探す読み手が入口の承認欄と同じ語に当たる。しかし根拠の行はすでに括弧の中に在り、括弧が入れ子になる。受入基準 AC5 が指すのは 2026-09-18 の生成した 3 面の承認で、根拠の行が指す 2026-09-12 の見本 v4 の承認とは別の出来事なので、AC5 の語に結び付ける益は小さい。日本語の「持ち主が実際に開いて読み」は AC5 の見出しの逐語の一部なので、日本語で探せば同じ句に当たる。

basis: [A-1, A-2, N-4, N-6, P-4, P-7, P-8, P-11, P-12, P-14, R-7, R-8, R-9, FR7, AC5, ADR-2, ADR-4, ADR-5, ADR-6, ADR-7, ADR-12]

grill: {when: 2026-09-24, who: 検証役（AI・opus・独立の文脈・読み取りのみ）, where: docs/design/adr-17-grill.md, summary: 7 論点を攻めと守りで検証した。総合は改訂を支持（条件付き）。新しい見出しは並べる 2 つの句を「〜の中」の同じ形に揃えて前の字の並べた句の読みを弱め（文法の上の余地は残る）、段が「絶対にやらない」の条の見出しの形と承認済みの図の名札に揃う。根拠の行の新しい字は台帳 f2-648 の 2026-09-12 の持ち主の逐語で支えられ、受入基準 AC5 の句の逐語を含む。判断の記録 ADR-12 を注で断る形は床（注を突き合わせない）・P-6.2・P-7・前例と整合する。起草の写しの模擬で床は合格、生成区間は差分 0、改訂の欄の 2 行は差分と 1 対 1 に消し込まれ、列の根と床の定数は動かない。条件は 10 件で、実測との食い違い 2 件（改訂来歴の項の数を固定する歯 1 本が落ちる・測った写しの版）、判断の記録の言い過ぎと実測違い 3 件（入口の面には見出しが出ない・並べた句の余地を残さないの言い切り・再発の見込み）、比べていない案と承認の形 2 件（見出しの案 e・f と根拠の行の受入基準 AC5 の形・部分承認）、発効のときに置く字 3 件（改訂来歴の理由の裸の英字の語・ADR-12 の注の理由の分け方・撤退条件の日の上限と数える欄）である。案 b・案 e への差し戻しは要らない。10 件は起草役が判断の記録と承認要求へ全部反映した（測った写しの版は本流 2d90e8d の上で測り直した）。}
