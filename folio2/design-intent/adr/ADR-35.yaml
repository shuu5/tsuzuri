# folio2 判断の記録 ADR-35 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。人が読む面は判断の記録の面（adr-35.html・生成物・手で直さない）。
# 状態: accepted（発効 2026-09-29・持ち主の承認 f2-648 notes 2026-09-29 13:19 JST・逐語「１．全部推奨で」・対話面 R-8）。起草 2026-09-29・orchestrator 席の起草役 growth-draft〔opus 5.5〕・番号は席が割り当てた＝取り下げた前の下書き〔docs/rulings の ADR-35〕の番号を使う。憲法の条文は 1 字も変えない。
# 発効の道: 要件の追加（要件書 第 1.57 版の FR30〜FR32・AC33〜AC35）と規則の表の閾値の行の追加（R-23〜R-25）を伴うので、行 D-17 により持ち主の承認で発効する。外の利用者 tsuzuri の持ち主は 2026-09-29 に tsuzuri の board で方向を答えた（t3-hub.66.1・t3-hub.66.2 = A・束 batch:20260929T0058Z-1）。folio2 の字の承認はこれとは別に folio2 の対話面（R-8）で取る。
# 起点: 台帳 f2-648.275.9・依頼 ~/.local/share/folio2/handoff-2026-09-28/growth-brief.md・起草の記録 growth-draft.md（実測の表・script は growth-scripts/）。

id: ADR-35
title: 設計ノートの増殖を床で縛る 3 つの口 — 生きたノートと行の数の上限を置き場の規則の表の読む口の名の欄（key）の行から読み、索引の 1 行に状態の欄を足し（判断の記録 ADR-32 決定 (5) の一部を置き換える）、設計ノートの後継の欄が要件と判断の記録を指せるようにする

status: accepted
date: 2026-09-29

plain: |
  設計ノート（便の約束を書く文書）が溜まり続けないように、folio に 3 つの口を足す判断です。
  外の利用者（tsuzuri）では設計ノートが 52 本に増え、7 割は中身が全部済んだまま残っています。いまの folio は数えるだけで、減らす力を持ちません。
  1 つ目。生きているノート（下書きと発効）の本数・1 本の中の便の約束の行の数・まだ約束になっていない計画の行の数を、機械が数えます。置き場の規則の表に上限の行を置き、超えたら検査（床）が落とします。上限の値は置き場の持ち主が決め、folio は値を持ちません。上限の行が無ければ「まだ分からない」と言い、合格にしません。廃止したノートと見本は数えません。
  2 つ目。地図（索引）の点ごとの 1 行に「状態」を足します。設計ノートの行はノートの状態、判断の記録は記録の状態を、書かれた字のまま出します。利用者はこれを見て、廃止した文書の点を畳めます。
  3 つ目。設計ノートを廃止するとき、中身を移した先として、別の設計ノートのほか、要件と判断の記録も名指せるようにします。名指した先が無ければ検査が落とします。
  全部済んだノートを自動で廃止する仕組みは作りません（folio は便が済んだかを読まないため）。どのノートを廃止するかを決めるのも持ち主です。
  folio2 自身の上限の行も同じ承認で足します。folio2 の設計ノートの置き場は見本 2 本だけなので、値は 1 本・1 行・1 行です。

context: |
  (1) 出所（台帳 f2-648.275.9・親 f2-648.275）。外の利用者（tsuzuri）の案 v0.2（2026-09-29・控え t3-hub.66）の 3 つ、数の上限（B-2）・索引の状態の欄（B-4）・後継の欄の先（B-5）。案は、外の利用者の持ち主の問い（走行と裁定の節点は溜まる一方か・設計ノートは整理されているか・整理を強いる力はあるか）への答えから起こした。外の利用者の実測（参考値・案 v0.2 の字）は設計ノート 52 本・7454 行、うち 36 本は全行が着地したまま残る。案の原則は「減らす力は AI の記憶でなく、器か folio の検査が落ちる形で持つ」「消さない。退役は状態で表し、置き場に残す」で、方針と値は外の利用者の憲法と規則の表が持ち、folio は数える口だけを持つ。外の利用者の持ち主は 2026-09-29 に外の利用者の問いの板（board）で案の方向を答えた（t3-hub.66.1・t3-hub.66.2 = A〔folio の側の 3 つは今 folio2 で作る〕・束〔batch:20260929T0058Z-1〕）。folio2 の字の承認は、これとは別に folio2 の対話面で取る（条 P-12.1）。
  (2) 設計ノートの一生（folio2 本流 1c7f927 の実装・handoff-2026-09-28/notelife-facts.md）。状態は下書き（draft）・発効（effective）・廃止（retired）・見本（example）の閉じた一覧で、廃止は承認欄と後継の欄（superseded_by）を要る。床・導出・索引・面のどれも廃止を特別に扱わない（行はそのまま数え、導出し、節点にする）。folio は置き場の直下の設計ノートだけを読むので、退役の置き場（design-note/retired/ など）へ移したノートは床・導出・索引・面から黙って消える。後継の欄の先は同じ置き場の別の設計ノートの id だけで、無ければつながりの違反、自分自身なら形の違反になる。前の欄（supersedes）も同じ。着地した行の状態は folio に無い（要件 FR13 は第 1.56 版で保留のまま）。
  (3) 数の上限。設計ノートに掛かる上限は章の数（読む口の名の欄〔key〕の値が章の上限の名〔note-chapters〕の閾値の行・folio2 では行 R-19）だけで、ノートの本数・1 本の契約表の行の数・計画だけの行の数には無い。欄（key）の値の閉じた一覧は章の上限（note-chapters）・計画の名札（plan-note）・編集時の止めの下限（in-loop-min）の 3 つで、行が無いときの扱いが値ごとに違う。章の上限は まだ分からない、計画の名札は計画の床を掛けない、編集時の止めの下限は数えずに 1 行出す（判断の記録 ADR-33 決定 (5)・編集時の止めの一覧が器の行の着地まで空で、行を置いても数えられないため）。どれも道具は既定の値を持たない。
  (4) 索引の点ごとの 1 行（folio graph --print --summary）は 7 つの欄（id・kind・file・line・title・plain・eng）で、状態の欄を持たない。判断の記録 ADR-32 決定 (5) は「--summary の欄は 7 つのままとする」と決め、決定 (1) は「状態で分けない」と決めた。短い出力（--digest）は種類ごとの節点・型ごとの辺・file ごとの節点の 3 つの表と要約の 2 行で、--summary の欄を持たない（graph.rs の digest）＝--summary に欄を足しても --digest は変わらない。要件 FR14 の規範文は --summary の欄を列挙している。
  (5) 実測（参考値・2026-09-29・本流 001c865〔第 1.56 版〕）。folio2 の設計ノートの置き場は見本 2 本（example・figures・どちらも状態 example）だけで、生きたノートは 0 本、生きたノートの契約表の行は 0、計画だけの行は 0 である。folio2 の便の設計ノート（docs/design/ の Markdown 242 本・契約の行は 1 本に 0〜2）は folio の床の外で、器が読む。
  (6) 判断の記録 ADR-30 決定 (1) により、発効した判断の記録の本文は変えない。変えてよいのは退役のときの状態の欄と後継の欄だけで、判断の記録の欄の決まりは判断の記録どうしの改訂の欄を持たない。一部の決定だけを置き換えた前例（ADR-30 決定 (8)・ADR-34）は、前の記録の状態の欄を変えなかった。

decision: |
  (0) 本判断は憲法の条文を改訂しない。判断の記録 ADR-32 の本文と状態の欄は変えない（判断の記録 ADR-30 決定 (1)(8)・一部の決定を置き換える判断は前の記録を退役させない）。ADR-32 決定 (5) の末文「--summary の欄は 7 つのままとする」を本判断の決定 (2) で置き換える。決定 (5) の残り（裁定 id は節点の欄にしない・書き出しの行を file で結ぶ）と決定 (1)（状態で分けない）は変えない。
  (1) **数える口。** (ア) 欄（key）の値の閉じた一覧に 3 つを足す（3 → 6）。生きたノートの本数（live-notes・値は「<正の整数> 本 以下」）・生きたノート 1 本の契約表の行の数（note-rows・値は「<正の整数> 行 以下」）・置き場の生きたノートの計画だけの行の数の合計（plan-rows・値は「<正の整数> 行 以下」）。(イ) 生きたノートは、置き場の設計ノートの置き場（design-note/）の直下で名が「.yaml」で終わり、欄の決まりの file（schema.yaml）でない file のうち、読めて最上位が表で、見出しの欄の状態（meta.status）の値がちょうど下書き（draft）か発効（effective）のものとする（床と導出と索引と同じ読み手・下の dir は読まない・記号の連結と読めない file は数えずに まだ分からない とする）。廃止（retired）と見本（example）とほかの値は数えない。1 本の行の数は、そのノートの節の一覧（sections）の項のうち型（type）の値が契約表（contract-table）の節について、行の一覧（rows）の項の数を足した数とし、1 本ごとに値と比べる。計画だけの行の数は、全部の生きたノートの節の一覧の項のうち型の値が計画だけの行（row-plan）の節の、行の一覧の項の数の合計とする。合計にするのは、その節を置けるのが計画のノート 1 本だけで（要件 FR27）、床が合格の置き場では 1 本ごとの数と合計が同じになり、決まりに反した置き場でも数が 1 つに定まるからである。計画だけの行は契約の行ができたら外れる（判断の記録 ADR-31 決定 (2)(エ)）ので、合計は「契約の無いまま溜まった計画」の量である。(ウ) 値の形は章の上限（note-chapters）と同じく、頭が 0 でない半角の数字の並び・半角の空白 1 つ・単位の字（本数は「本」、行の数は「行」）・半角の空白 1 つ・「以下」の 1 つだけとする（例「52 本 以下」「40 行 以下」。全角の数字・桁区切り・空白の違い・「以上」は形が違う）。(エ) 置き場に読めた設計ノートが 1 本でも在るとき（見本だけでも）3 つの行を読む（章の上限と同じ条件）。行が無い・2 本以上在る・値の形が違うときは、その数えを まだ分からない とする（道具は既定の値を持たない・条 P-4.2）。(オ) 数が値を超えたら違反（設計ノートの形の種別・終了 1）とする。違反の字は、上限の行の id か欄（key）の値と、上限の値と、名指す先（1 本の行の数はそのノートの id・ほかの 2 つは置き場）だけを持ち、今の数を持たない。今の数は同じ出力の「#」で始まる行に出す。編集時の口（folio check --proposed）は違反の字を書く前と後で完全に一致するかで比べるので（判断の記録 ADR-33 決定 (2)）、字に今の数を入れると、上限を 2 以上超えた置き場で数を 1 つ減らす退役や統合の編集が新しい違反として止まるからである。(カ) 値を読む関数は規則の表の床の実装（rules.rs）に 1 つ（章の上限と同じ読み手を 4 つの値で共有する）、数える関数は設計ノートの床の実装（note.rs）に 1 つとする。いま値を読むのは床（folio check と、同じ関数を通る編集時の口 folio check --proposed）だけで、面の生成器はこの上限で止めない。章の上限は面の章の帯の読みやすさの上限で面が持つ理由があるが、この 3 つは置き場の量の上限で面の形に関わらないからである。面が後でこの数や上限を出すときは同じ関数を呼ぶ（条 P-6.3）。(キ) 編集時の止めの下限（in-loop-min）の「行が無ければ数えずに 1 行出す」形は採らない。行を置かない置き場で増殖を黙って通すことになる（前文の順位「速さより黙らないこと」・条 P-4.2）。編集時の止めの下限がその形なのは数える材料が器の行の着地まで空だったからで、この 3 つにはその事情が無い。計画の名札（plan-note）の「行が無ければ掛けない」形も採らない（名札の行は計画のノートを持つかの選びで、上限の行は値の選びである）。(ク) 章の上限（note-chapters）の違反の字も (オ) と同じ形に揃える。今の字は章の今の数を持つので、上限を 2 以上超えたノートの章を減らす編集も編集時の口が止める。面の生成器と床は同じ関数（over_cap）で同じ字を出す（条 P-6.3）ので、面の断りの字も同じ形になり、今の数は別の行に出す。運ぶのは便 207 である。
  (2) **索引の状態の欄。** (ア) folio graph --print --summary の各行の末尾（技術の要約 eng の後）に欄 status を置く（8 欄目）。(イ) 値は、節点の所属 file が 1 つの状態を持つ文書のとき、その状態の欄の字をそのまま出す。設計ノートの行はそのノートの見出しの欄の状態（meta.status・draft・effective・retired・example）、判断の記録はその記録の status（proposed・accepted・retired）である。状態の欄が無いか字でなければ空の値（null）とする（欠けは床が数える）。字は訳さない（語の置き場を 2 つにしない・条 P-6.3）。(ウ) ほかの節点（条・規範文・規則行・目的・要件・非機能要件・受入基準・制約・登場人物・出力）は空の値（null）とする。これらは 1 本の大きな文書の中の行で、行ごとの一生の状態を持たない。文書の状態（例 要件書の見出しの欄の状態〔meta.status〕）を行に写すと、保留の要件や廃止の行にも「発効」が付き、欄の意味が割れる。規則の表の行の status（仮・凍結・未定）は値の固さの軸で一生の状態でないので写さない。(エ) 変えないもの。ほかの 7 欄の字と順（status を外した行は本判断の前と byte で同じ）・--print の表・--digest・挨拶の命令（folio hello）・節点の種類（12）と辺の型（19）・索引の欄の決まりの生成区間（節点の必須欄は表の 5 欄で --summary の欄を持たない）・folio build の出力。(オ) 畳むのは読み手（外の利用者の地図）の側で、索引は状態で節点を落とさない（ADR-32 決定 (1)）。
  (3) **後継の欄の先。** (ア) 設計ノートの見出しの欄の後継（superseded_by）の値は、設計ノートの id に加えて、要件の id（要件 FR・非機能要件 NFR）と判断の記録の id（ADR-n）を指せる。前（supersedes）は今のまま設計ノートの id だけとする。(イ) 形で読み分ける。頭が FR か NFR で後ろが数字なら要件、頭が ADR- で後ろが数字なら判断の記録、ほかは設計ノートの id として読む（設計ノートの id は英小字で始まる形なので重ならない）。(ウ) 床は先の実在を数える。要件は置き場の要件書の要件の節（requirements）か非機能要件の節（nonfunctional）の id、判断の記録は置き場の adr/ の記録の id に照らし、無ければ今と同じつながりの違反とする（編集時の口は止めず、事後の床が落とす・判断の記録 ADR-33 決定 (2)）。自分自身を指す字は今と同じ形の違反とする。先の状態（発効しているか）は今の設計ノートの後継と同じく数えない。(エ) 題ごとの文書は、設計ノートとして書けば今の形で指せる。置き場の中の path（設計ノートでない file）は、外の利用者が題ごとの文書の形を定めるまで入れない。(オ) 設計ノートの面は、廃止の行の後継のリンクを先の種類の面（要件書の面の要件の場所・判断の記録の面・設計ノートの面）へ張る。要件と判断の記録の先は面の生成器の今の参照 id の解き方で解き（先が無ければリンクを張らず「まだ分からない」を添える）、設計ノートの先は今と同じく実在を確かめない（実在は床が数える）。(カ) 設計ノートの欄の決まりの生成区間の注に、後継の先の 3 種を書く（床の定数の置き場を直し、folio schema --write で書き直す）。
  (4) **範囲の外。** (ア) 着地に応じた退役（全行が着地したノートを退役させる・退役の忘れを落とす）は、外の利用者と器の持ち分とする。folio は着地を読まない（要件 FR13 は第 1.56 版で保留のまま）。(イ) 索引の裁定への辺（ruled_by）は足さない。辺の型の閉じた一覧（19）は変えず、裁定の字は書き出し（folio check --emit-rulings）から外の利用者が組む。(ウ)「設計ノートは中間の文書で、上流へ吸収して退役する」という方針そのものは folio に置かない（folio は置き場の採否を代わりに決めない・条 P-1.2）。方針と値は置き場の憲法と規則の表が持つ。(エ) 状態の値域（4 つ）は変えない。「発効のまま数えない」状態は作らない。(オ) 退役の置き場を読む口は作らない（退役は状態で表し、置き場に残す・条 P-7.2）。(カ) 生きたノートを見本（example）に替えると、承認欄も後継も要らずに数えから外れ、契約表の行は導出に残る（知っている穴）。見本の本数は数えない。見本かどうかの意味は folio に分からないので、付け替えを縛るのは置き場の持ち主の規律か、外の利用者の検査の持ち分とする。
  (5) **folio2 自身の値の行。** 同じ承認で、規則の表に閾値の行 R-23（生きたノートの本数・1 本 以下）・R-24（1 本の契約表の行の数・1 行 以下）・R-25（計画だけの行の数の合計・1 行 以下）を足す。値は folio2 の今の実測（前提 (5) の 0 本・0 行・0 行）を下回らない最小の正の整数とし、片方向にだけ締める（外の利用者の案の数の上限（B-2）の決まりと同じ）。行の条は P-7 とし（下げる道は廃止を状態で表すことで、消すことではない）、条の関係の欄（relations.rules）に 3 行を足す（行 R-4 の双方向・条文の欄は変えない）。欄（key）は、道具が読めるようになる便 207 が行に足す（それまで行は道具に読まれない・行 R-19 と便 179 の前例）。
  (6) **便。** 3 本。便 207（行 hb）は数える口（決定 (1)）で、規則の表の生成区間（欄〔key〕の値の一覧と注）と、行 R-23〜R-25 の欄（key）と、床の土台の fixture の値の行を運ぶ。便 208（行 hc）は状態の欄（決定 (2)）。便 209（行 hd）は後継の欄の先（決定 (3)）で、設計ノートの欄の決まりの生成区間を運ぶ。どれも本判断と要件書 第 1.57 版の発効の後に受け付け、契約はその後に書く。本流で走っている便と書き換える file が重なる便（207 は便 203・204、209 は 207）は、先の便の着地の後に数え直して運ぶ。
  (7) **知らせ。** 席は便 207 と 208 と 209 の着地の前に、外の利用者（tsuzuri）へ次を知らせる。欄（key）の 3 つの値と、行の値の形。行が無ければ まだ分からない になるので、folio の組み立てを上げる commit と値の行 3 本を同じにし、値は入れる時点の実測以上にすること。--summary の 8 欄目 status の値と null の決まり。--summary の 1 行を読む側（地図の読み手）と、その字を比べる側（字の一致の検査〔k-parity〕が --summary を比べるなら）は、folio の組み立てを上げる同じ commit で直すこと（--digest と --print の形は変わらない）。同じ commit で足す値の行 3 本で、--digest の規則行の節点と、行の条への辺と、規則の表の file の節点の数が 3 ずつ動き、--print も節点 3 つと辺が増えること。同じ commit で、値の行の条の関係の欄（relations.rules）にも 3 行を足すこと（行の双方向〔folio2 では行 R-4〕・無いと 1 行につき逆参照の違反が 2 件出る）。生きたノートを見本に替えると数えから外れること（決定 (4)(カ)）。後継の先の 3 種と実在の数え。folio schema --write を撃つ要（規則の表と設計ノートの欄の決まりの生成区間）。

options:
  - id: a
    name: 置き場の規則の表の読む口の名の欄（key）の 3 行で上限を読み（行が無ければ まだ分からない）・索引の 1 行に文書ごとの状態の欄・後継の先を要件と判断の記録へ（採る）
    text: 決定 (1)〜(7) の形。
    verdict: adopted
    reason: 減らす力を道具の検査に持たせ、値と方針は置き場の持ち主の選びに残す（条 P-1.2・P-5.1）。数える口と値の読み手は章の上限と同じ 1 つずつの関数で、面と床の 2 つの読み手を作らない。状態の欄は正本の字を写すだけで、外の利用者が状態を正本から別に読む 2 つ目の読み手を要らなくする。後継の先の広がりは、中身を移した先を機械で辿れるようにし、実在を床が数える。
  - id: b
    name: 上限の値を folio の既定の値として持つ
    text: 行が無い置き場では folio の既定の値（例 folio2 の値）で数える。
    verdict: rejected
    reason: 上限は置き場の持ち主の選びで、道具が値を持つと置き場ごとの値を型付きデータでなく道具の中に持つことになる（条 P-5.1・P-1.2）。章の上限の行も既定の値を持たない。
  - id: c
    name: 行が無ければ数えずに 1 行出す（極性一覧の下限の行〔in-loop-min〕の形）
    text: 上限の行を置かない置き場では数えず、数えなかったことを知らせる。
    verdict: rejected
    reason: 行を置かない置き場で増殖を黙って通す（前文の順位「速さより黙らないこと」・条 P-4.2）。極性一覧の下限の行の形は、数える材料が器の行の着地まで空だった事情によるもので、ここには当たらない。
  - id: d
    name: 状態の欄に、どの節点にも所属する文書の状態を出す
    text: 要件は要件書の見出しの欄の状態（meta.status）、条は憲法の見出しの欄の状態（meta.status）のように、節点の所属 file の文書の状態を全部の節点に出す。
    verdict: rejected
    reason: 1 本の大きな文書の中の行に文書の版の状態が付き、保留の要件（FR13）や廃止の行にも「発効」が付く。欄の意味が「その点の一生」と「文書の版」に割れる。
  - id: e
    name: 状態の欄を設計ノートの行だけに出す
    text: 判断の記録を含むほかの節点は全部空の値（null）にする。
    verdict: rejected
    reason: 判断の記録も 1 本で 1 つの一生の状態（提案中・発効・廃止）を持ち、外の利用者が廃止した判断の記録を畳むには記録の YAML を自分で読むことになる（読み手が 2 つ・条 P-6.3）。
  - id: f
    name: 退役の置き場（design-note/retired/）へ移したノートを読む口を足す
    text: 移したノートを床と索引が読み、廃止として扱う。
    verdict: rejected
    reason: 退役は状態で表し置き場に残す（条 P-7.2）。移す形を認めると、同じ廃止に 2 つの表し方ができ、移した先を読まない道具（導出の古い toml）が黙って残る。
  - id: g
    name: 後継の先を置き場の中の任意の path にも広げる
    text: 題ごとの文書を、設計ノートでない file の path で指せるようにする。
    verdict: rejected
    reason: 外の利用者が題ごとの文書の形を定めていない。folio が知らない形の file は実在しか数えられず、中身を移した事実の確かめにならない。題ごとの文書は設計ノートとして書けば今の形で指せる。

