consequences:
  - folio2 の床は、便 207 の着地の後、行 R-23〜R-25 の値で数えて合格のまま（参考値・2026-09-29 に生きたノート 0 本・行 0・計画だけの行 0）。folio2 に生きたノートを 2 本置くには、前に行 R-23 の値を上げる承認が要る（行は種別 deny で、緩めるときは条 A-2.3 の検証を前置する）。
  - 外の利用者は、便 207 の後の folio に上げる commit で値の行 3 本を置かないと床が まだ分からない（終了 2）になり、入れる時点の実測より小さい値を置くと不合格（終了 1）になって、床の合格を求める設計の commit の道具が止まる。
  - 違反の字に今の数を持たないので、書く前から同じ上限の同じ名指す先の違反が在る編集（本数か計画だけの行の合計が超えた置き場にさらに足す・行の数が超えたノートにさらに行を足す）は、編集時の口では止まらない（書く前にも同じ字の違反が在る）。超えていない別のノートが上限を跨ぐ編集は、名指す先の違う新しい違反として止まる。事後の床は落とし続けるので、床の合格を求める commit の道具は止まる。減らす編集（退役・統合）は編集時の口でも止まらない。章の上限も同じになる（決定 (1)(ク)）。
  - 生きたノートが上限に達した置き場では、新しいノートを足す前に、ノートの退役か統合が要る。退役 1 本ごとに承認欄の行（誰が・いつ・裁定）と後継が要る（状態 retired は承認欄を要る）。
  - --summary の 1 行が 1 欄長くなり、閉じた欄の集合で 1 行の JSON を読む読み手は落ちうる（判断の記録 ADR-32 のときに外の利用者の読み手が閉じた種類の集合で落ちた前例）。--digest と --print の形は変わらない（値の行を足すと --digest の数は動く・決定 (7)）。
  - 後継が要件か判断の記録を指す廃止のノートの面は、要件書の面と判断の記録の面へリンクを張る。要件と判断の記録の番号は付け替えない（条 P-7.1）ので、リンクの先は動かない。
  - 便 207 は規則の表の生成区間と規則の表の床の実装（rules.rs）を、本流で走っている便 203（rules.rs）と便 204（rules.rs・規則の表の生成区間とその凍結 anchor）と共有するので、その 2 本の着地の後に数え直して運ぶ。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 の notes に 1 件ごとに記帳する（日付・材料の在り処・当たった条件）。
    (1) 便 207 の着地の後 30 日のうちに、外の利用者（tsuzuri）が 3 つの欄（key）の行を自分の規則の表に置かなかったら（folio の組み立てを上げないまま済ませた場合を含む・数え方 = 席が 30 日目に外の利用者の規則の表の写しを読み、3 つの欄（key）の行の有無を記帳する）、数える口を持ち続けるかを外の利用者の席と持ち主に問う（口を使う置き場が無い）。
    (2) 上限の行を置いた置き場で、上限に当たった件のうち、ノートを退役も統合もせずに値を上げる裁定が 2 件を超えたら（3 件目で・数え方 = 置き場の規則の表の行の裁定の欄の来歴）、上限が整理の力になっていないとして、数える口を捨てるか形を変えるかを持ち主に問う判断の記録を起こす。
    (3) 外の利用者の地図が、索引の状態の欄を使わずに設計ノートか判断の記録の正本の状態を自分で読む実装を持ち続けたら（読み手が 2 つ）、状態の欄の形を外の利用者の席と持ち主に問う。

