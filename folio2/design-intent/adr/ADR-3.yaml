# folio2 判断の記録 ADR-3 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。読み物は preview/readable.html（生成物・手で直さない）。
# 状態: accepted（発効 2026-09-16・持ち主の承認は approval 欄・裁定 id = f2-648 notes 2026-09-16）。条文の改訂ではない（amends は空）。発効と同時に行った変更 = 要件書 v1.1（M1 の要件 FR9〜FR15・AC7〜AC13・CON8〜CON9・2026-09-16 発効「いずれも推奨で進めて」）・rules 行 R-16・語彙（f2-648.4）。
id: ADR-3
title: 契約表（便の割りの表）の所有と境界 — 欄集合の正本は器（scribe2）の型から導出した型付き file、意味の検査は器の編集時の止める仕掛け、folio2 は器・導出・導出物の差分 0 だけを持つ
status: accepted
date: 2026-09-13
context: 持ち主は 2026-09-13 に scribe2 の席で、scribe2 と folio2 の v2 同士を統合に向けて擦り合わせること、planner が継続的に folio を使って憲法と要件書に沿った設計文書の管理を機械的に（v2 は正本が YAML）行えるように徹底的に調査・検討・検証することを指示した（逐語は scribe2 の台帳 s2-07l.42 notes）。scribe2 は憲法・要件書・判断の記録を前の版（folio v1）の生成物で持ち、その下に設計文書（docs/design）を散文で 14 本置き、そこから便 1 本の割り（契約）を切っている。契約は 3 段の写し（設計文書の散文 → 台帳の受入 → 契約 file の手写し）で、書き込み範囲（write-set）の落ちが 5 例・設計の穴が門まで見つからない、が実測され、持ち主の裁定（s2-07l.197 notes 2026-09-13）で「契約の正本を設計文書の中の機械が読む契約表へ移し、器が契約 file を生成し、審査の段を置く」と決まった。folio2 側は要件書 M0 が設計ノートの生成を「作らない側」に置き、v2 の形の裁定 #2 で第一級の 4 型（憲法・要件書・判断の記録・設計ノート）を持つと決めているが、他の repo（scribe2）の設計文書を folio2 が管理する形はまだ決めていない。両席の planner が 4 つの問い（設計文書の位置づけ・契約表の所有・散文の門・id の結線）を擦り合わせ、folio2 planner の草案を 3 観点（folio2 の拘束 SSOT との整合・scribe2 側の実現性・持ち主の意図と順序）の敵対的な検証に掛けたところ、草案の 12 点が反証された（最大のものは「契約表の意味の検査を folio2 の汎用の床に置く」で、3 観点が独立に「2 実装か、器の編集時の止める仕掛けの弱体化」と指摘した）。本判断はその検証後の合意案（両席の記帳先 = folio2 台帳 f2-648.4・scribe2 台帳 s2-07l.197）を folio2 の設計文書として残す。
decision: 境界を次のとおり定める。(1) 設計ノートは 1 つの型（密度 profile の 1 行）で、任意の型付きの節（部品の表・口の表・欄の表・歯の表など、節の型は閉じた一覧）を持てる。前の版（folio v1）のように文書の中身の種類ごとに生成の束（pack）を分けない（P-5.3・P-2.4）。何が folio2 の開発を拘束するかは語彙の設計文書の項と P-13 が決め、密度 profile は見せ方だけを持つ（拘束の旗を profile に置かない・N-3）。(2) 契約表は設計ノートの 1 つの節で、その節の型は「外部の欄の決まりを参照する型」1 つとする。契約表の欄の集合と値域の正本は器（scribe2）の機械側の型であり、器がそこから型付き file 1 枚（contracts/schema.toml・生成物・器の repo に版管理で置く）を導出する。folio2 はその導出 file を読んで節の型を登録し、欄の追加・値域の変更は器の側の版上げで足りる（folio2 の判断の記録は要らない）。設計文書の散文はその file を指すだけで、欄の一覧を散文に持たない（P-5.1・P-5.5・N-2・P-6.3）。(3) 契約表の意味の検査（行の id の一意・要件の欄が要件書に実在・節の欄が同じ文書に実在し本文が非空・依存の解決と輪の無さ・検証の欄の形・触る型の閉包が書き込み範囲に収まること）は器の 1 つの関数（受付と表の検査が同じ関数・編集時・黙って飛ばさない）が持つ。folio2 はそれを持たず、持つのは YAML 正本の形（重複キー・未知の欄・欄の非空）と、導出物の差分 0（folio build --check・事後の drift の検出であって編集時に止める仕掛けの代わりではない・P-18.2）と、folio2 が所有する文書の id 空間の解決（R-4）だけである。(4) 導出物の形は表の形式（TOML）の部分集合の契約の配列（[[contract]]）で、器の値の文法（文字列・文字列の一覧・数・真偽）を共有する。各行は節の本文の逐語（goal）を運び、空の一覧は欄名（key）を省いて表し、先頭に版の宣言（schema = 1）を置く。導出物は消費側の repo に版管理で置き、器は統合先（main）へ着地した後の受付からしか新しい表を読まない（正本の改訂 → 取り込みの要求（PR）→ 着地 → 再受付）。(5) 着地（便が統合先へ入った事実）の正本は器の記録（record・器の状態の帳簿）であり、器は着地の 1 つの commit（squash）の本文の末尾に契約の id と要件の id の印（trailer・既存の便の id の印と 1 組・名は器の名前の定数から導出）を同時に書く。folio2 の要件の追跡表（RTM）が読む口はこの印 1 つで、印が在れば着地（着地の印 sha）、無ければ「まだ分からない」と出し「未着地」とは言わない（P-4.2）。自分の repo への取り込みの要求で終わる形（--pr-cmd）は印も記録も持たないので、要件の追跡表では恒久に「まだ分からない」と出す。器の記録の書き出し（export）は出所付きの測定値として補助に留める。(6) folio2 の参照 id の床（R-4）の母集団（正本 4 file・内部 3 空間）は広げない。他の repo の要件 id・契約 id・便の id・着地の印は床の母集団に入れず、要件の追跡表の測定値（3 値・出所付き）として扱う。要件書の NFR3・AC6 は据え置き、M1 の要件は新しい番号を足す（P-7.2）。(7) 設計ノートの散文の門は 1 つの形とする。規範の印（しなければならない・してはならない・禁止・原語の助動詞など。印の一覧は型付きデータ）を持つ文は、同じ文の中に参照 id（条 id・rules 行 id・要件 id・契約 id）を持ち、数と単位を持たない。記述の文は自由。数と単位を散文から一律に排する床は採らない（出所・実測・帰結の数値が偽陽性になる）。この床は folio2 の M1 で実在し、それまでは器（scribe2）が同じ式（印の一覧を型付きデータで持つ）を自分の検査に暫定で置き、M1 が引き取ったら撤去する（持ち主の裁定 2026-09-13T08:53Z「裁定はいずれも推奨で良い」・s2-07l.197 notes）。意味だけで規範になる文は床の外（天井）で、M1 までは天井も無い。(8) 順序は、契約表を今の形（scribe2 の設計文書の中の機械が読む区間）で着地させ、folio2 の M1 で設計ノートの YAML 正本と導出物へ移す（scribe2 planner の裁定・s2-07l.197 notes 2026-09-13・持ち主の裁定の直接の帰結ゆえ持ち主へは上げない）。設計文書を YAML へ移す範囲は M1 の要件書の承認時に持ち主へ出す別の論点とする。(9) 設計ノートや要件書の中身が席の文脈へ届く経路は器の役割の注入が持ち、folio2 は機械が読む id の索引（文書・要件・契約の id と 1 行の題）を出すまでとする。憲法の注入（P-14・R-2）は憲法専用のまま広げない。
options:
  - {id: a, name: 欄集合の正本は器の型、意味の検査は器の編集時の止める仕掛け、folio2 は器・導出・差分 0, text: 契約表の欄の集合は器（scribe2）の機械側の型から導出した型付き file を正本とし、意味の検査は器の 1 つの関数が編集時に持ち、folio2 は設計ノートの器・導出物の生成・差分 0 の検査・自分の id 空間の解決だけを持つ。, verdict: adopted, reason: 検査は 1 実装（器の受付と表の検査が同じ関数）で編集時に止まり（P-18.1・scribe2 憲法 C16）、欄の集合は型付きデータに 1 つ（P-5.1）、2 つの面は導出で結ばれる（P-6.3）。3 観点の敵対的な検証で唯一残った分担。}
  - {id: b, name: folio2 が汎用の床として契約表の意味の検査も持つ, text: 行の id の一意・要件と節の実在・依存の解決などを folio2 の参照 id の床の母集団の拡張として持ち、器の検査と並べる。, verdict: rejected, reason: 器が既に同じ述語を編集時の止める仕掛け（受付）として持つので 2 実装になるか、器から外して事後の検査に降格する（P-18.2 に反する）。3 観点が独立に同じ指摘をし、検証 4 名がいずれも指摘を支持した。}
  - {id: c, name: 欄の集合の正本を設計文書の散文に置く, text: 契約表の欄の一覧を scribe2 の設計文書の説明文（1 項目）に書き、folio2 の器はそれを読んで節の型を登録する。, verdict: rejected, reason: folio2 の器が執行する型の一覧の正本が他の repo の散文になる（P-5.1・P-5.5・N-2）。folio2 の検査の対象は folio2 が所有する文書に限るので床は落とさず、規則が黙って散文に戻る。折り返しに器の側でも列挙の正本は機械側の型（scribe2 の判断の記録 ADR-0013）。}
  - {id: d, name: 設計文書を前の版の 4 つの束（構造・口・欄・歯）に分解する, text: scribe2 の設計文書の中身を前の版（folio v1）の生成の束ごとに 4 つの文書へ分け、束ごとの検査を掛ける。, verdict: rejected, reason: 文書の種類による違いは汎用の検査と密度 profile のデータで表す（P-5.3）。節の型は閉じた一覧に載せる（P-2.4）。前の版で束が増えるほど係と説明文が膨らんだ（N-5 の出所）。}
  - {id: e, name: folio2 の参照 id の床の母集団を他の repo の id へ広げる, text: R-4 の母集団を密度 profile が宣言する形にし、scribe2 の要件 id・契約 id・便の id を床が解決する。, verdict: rejected, reason: 「内部 3 空間」は rules 行だけでなく要件書の規範文（NFR3）・受入基準（AC6）・条の機構の注・判断の記録の欄の決まりに在り、広げるのは裁定（G15）の反転と要件の意味の差し替え（P-7）になる。他の repo の先頭に依存すると床が決定的でなくなる（P-3.1・P-10）。}
  - {id: f, name: 着地の正本を commit の印（trailer）にする, text: 着地した事実の正本を統合先の commit の末尾の印とし、器の記録は補助にする。, verdict: rejected, reason: 印を書くのは器であり、器は自分の記録から印を書く。2 つの面があるなら記録が正本で印は導出（P-6.3）。印の不在は「未着地」と「印の無い着地（導入前の commit・自分の repo への取り込みの要求で終わる形）」を弁別できず、正本にすると黙って飛ばす形になる（P-4.1）。}
basis: [P-2, P-4, P-5, P-6, P-7, P-10, P-13, P-14, P-18, N-2, N-3, N-5, R-2, R-4, R-9, NFR3, AC6, CON1, CON6, D-7, ADR-1]
retreat: {kind: measure, condition: 数えるのは orchestrator 席（2026-09-19 までの名は planner 席・folio2 の M1 の受入で床を回す席）で、数えた結果は台帳に記帳する。M1 の受入の後、① 導出物の手編集が器の受付を通り事後の差分 0 の検査でしか落ちなかった件数、または ② 自分の repo への取り込みの要求で終わる形でない便のうち、印の不在で要件の追跡表が「まだ分からない」を出した件数、のどちらかが同じ種類の失敗として rules 行 R-7 の上限を超えたら、本判断を捨てて ① なら案 b（folio2 も意味の検査を持つ）、② なら器の記録の書き出しを folio2 の読む口にする形へ戻す。戻す前に持ち主へ知らせる。}
