approval: {who: 持ち主, date: 2026-09-16, ruling: f2-648 notes 2026-09-16 22:5x JST・f2-648.4 notes（発効の承認・要件書 v1.1 の着手・ADR-4 の発効・branch の削除と束ねた 1 回の逐語）, verbatim: scribe2がある程度形になったので開発をどんどん進めていきたい。いずれも承認する, surface: R-8}
plain: 「便 1 本で何を作るか」を書いた表（契約表）を、scribe2 と folio2 のどちらが何を受け持つかの線引きです。あわせて、設計ノートは 1 つの型にし、中身の種類ごとにページの作り方を分けないことも決めます。表の欄の決まりは scribe2 の機械が持っていて、そこから作った写しを folio2 が読みます（人が 2 か所に手で書くことはしません）。表の中身が正しいか（番号が実在するか・依存が輪になっていないか）を止めるのは scribe2 の受付で、folio2 はページと写しを作り、写しが元とずれていないかを後から数えるだけです。便が本当に入ったかは scribe2 の帳簿が正で、folio2 は commit の末尾の印だけを読み、印が無ければ「まだ分からない」と言います。folio2 の「番号は必ずつながる」検査の範囲は今のまま広げません。設計文書の文章に「〜しなければならない」のような決まりの文を書くときは番号を添え、その文には数と単位を書かない、という検査は folio2 の M1 で動き、それまでは scribe2 が同じ検査を仮に持ちます。scribe2 の設計文書を folio2 の形（YAML）へ移すのは M1 で、どこまで移すかはそのとき改めてあなたに聞きます。設計ノートや要件書の中身が AI の席の手元へ届く経路は scribe2 の側が持ち、folio2 が出すのは機械が読む番号の索引までです。憲法を AI の手元へ写す仕掛けは憲法専用のまま広げません。
consequences:
  - folio2 の要件書に M1 の要件を足す（新しい番号・append）— 設計ノートの型と任意の型付き節・外部の欄の決まりを参照する節の型・導出物と差分 0 の検査・散文の門（1 形）・要件の追跡表の測定値（3 値・出所付き）・id の索引。NFR3 と AC6 は据え置く。要件書の版上げは持ち主の承認欄で発効する（P-13.3）。
  - rules に行を足す（規範の印の一覧・M1 の床の対象）— 裁定 id と時刻を行に付け（P-17.1）、憲法の関係の欄に逆参照を置く（R-4 の双方向。条文の改訂ではない）。新しい床は生成側からも検査側からも独立した凍結 anchor を持つ（P-10.1）。
  - 語彙に語を足す（設計ノート・契約表・便の記録）。commit の末尾の印（trailer）は識別子の一覧へ。
  - scribe2 側は設計文書（docs/design/contract-source.md）と判断の記録（ADR-0023）に本判断と同じ境界を持つ（両側の記帳先は id で結ぶ・folio2 台帳 f2-648.4・scribe2 台帳 s2-07l.197）。器の暫定の床（散文の門）は M1 が引き取ったら撤去する。
  - 本判断は条文を改訂しないので A-2.3 の対象外。発効の承認は持ち主から折り返しの席（folio2 planner 席・R-8）で取り、承認欄と台帳 f2-648.4 に逐語で記帳する。scribe2 の席で出た裁定は裁定 id（s2-07l.197 notes・s2-07l.149 notes）として引用する。
  - folio2 の rules 行 D-7「便は便 0 以降（s2-07l.149 の裁定後）」の条件は 2026-09-13 の裁定で満たされたが、便 0 の着手は持ち主の保留（park）の解除と要件書 CON1 の門が別に要る（本判断は着手の判断ではない）。
note: 敵対的な検証の記録 = folio2 の並列実行 wf_415727c2-596（3 観点・読み取り専用・指摘 8 + 8 + 8・検証 17 判定すべて支持）。合意案の全文 = folio2 の .claude-session/reports/2026-09-13-scribe2-align/reply-v2.md（版管理の外・session の記録）。要件書 M0 の scope は変えない（設計ノートの生成は M1）。平易文を 2026-09-20 に直した（規範の印の例を規則の表の行 R-16 の一覧に合わせ、数と単位を書かないことを足した・決定と撤退条件は不変・天井の 3〜5 周目の忠実さの「直す」・持ち主の裁定 f2-648 notes 2026-09-20 15:01 JST「１．推奨で」）。決定 (7) の例の訂正（天井の 7 周目（2026-09-20・main 85c3d7a）の整合 F-4）= 規範の印の例から「必ず」を外した。印の一覧の正本は rules 行 R-16 で、その注は副詞「必ず」を数えないと定める。決定の中身（印の一覧は型付きデータ）は変えていない。持ち主の裁定 2026-09-20 16:36 JST（f2-648 notes・逐語「承認する」）。平易文の直し（2026-09-20・天井の 8 周目と平易文の総点検〔全数の突き合わせ〕・持ち主の裁定 2026-09-20 17:21 JST〔f2-648 notes・逐語「承認する」〕）= 決定 (1)（設計ノートは 1 つの型）を平易文に足した。実態との突き合わせの直し（2026-09-20・約束と実態の総点検と天井の 9 周目・持ち主の裁定 f2-648 notes 2026-09-21 00:00 JST〔逐語「すべて推奨で進めて」〕）= 撤退条件の席の名を今の名に直した（決定 (7) の散文の門の引き取りの状態は要件書 FR12 の注と規則の表 R-16 の注が持つ）。平易文の直し（2026-09-21・天井の 10 周目の忠実さの「直す」・持ち主の裁定 f2-648 notes 2026-09-21 07:26 JST〔逐語「承認する」・天井の 10 周目の直しの一括 4〕）= 決定 (9)（設計ノートや要件書の中身が席へ届く経路は器が持ち、folio2 が出すのは機械が読む id の索引まで・憲法の注入は広げない）を平易文に足した。決定と撤退条件は不変。
