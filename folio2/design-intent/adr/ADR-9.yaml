# folio2 判断の記録 ADR-9 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。人が読む面は判断の記録の面（adr-9.html・生成物・手で直さない）。
# 状態: accepted（発効 2026-09-19・持ち主の承認の逐語は approval 欄と台帳 f2-648 notes 2026-09-19 20:1x JST・方向の裁定 2「ひとまず全部推奨でよい。」2026-09-19）。条文の改訂ではない（amends は空）。
# 位置: 天井の 1 周目（2026-09-19・f2-648 notes）で「文書どうしの整合」の止める所見 F-1（反証 支持）の解消。判断の記録 ADR-1 の帰結 5 つ目の道筋の完了。反対側からの検証（grill・docs/design/adr-9-grill.md）の発効を止める重さ 3 件と直すとよい 11 件を反映した版。

id: ADR-9
title: 欄の決まりの file（判断の記録・設計ノート）の schema 節は床の定数から folio が導出する生成区間とし、人は書かない
status: accepted
date: 2026-09-19
context: 判断の記録 ADR-1 は、欄の決まりの閾値・値域・置き場を床（当時は検査の script）の定数とし、欄の決まりの file（adr/schema.yaml）を「その写し」として置き、型も値も 1 字でも食い違えば床が落とすと決めた。設計ノートの欄の決まり（design-note/schema.yaml）も同じ形を M1 へ広げた。天井の 1 周目（2026-09-19・folio2 自身の設計文書）で「文書どうしの整合」の審査役がこれを憲法 P-6.4（2 つの面を人が書き、一致を検査で強制する設計を採らない）と両立しない止める所見として挙げ、独立の文脈の反証役が支持した。根拠 = 2 つの面（実装の定数と欄の決まりの file）をどちらも人が書き、生成の命令も生成物の宣言も無く（同じ ADR-2 は凍結 anchor を生成物と明記する非対称）、一致を 1 字の食い違いで落とす形は P-6.4 の 3 要素にそのまま当たり、P-6 の出所である前の版の失敗（両面手書き + 門 → 正本からの導出へ全面転換）と同型である。ADR-1 の帰結 4 つ目は「folio が同じ検査を出せた時点で欄の決まりの file を正本から外す」と既に道筋を書いており、床の script（Python）は便 22 で退役したが、欄の決まりの file は正本に残ったままだった（実態との整合の所見 F-7 も同じ指摘）。人が書く面が黙って古くなる実測が 2 つ在る＝設計ノートの欄の決まりの床の欄（meta.floor）は「M1 までは まだ分からない」のままで便 23 の着地後も直っておらず、判断の記録の欄の決まりの先頭の注は退役済みの床の script を名指したままである（どちらも床の覆う範囲の外なので検査が拾わない）。床の定数が覆うのは欄の決まりの file のうち schema 節の値の欄だけで、先頭の欄（meta）・対応表（mapping）・平易文（plain）・先頭の注と *_note の説明は覆っていない。持ち主は 2026-09-19 に裁定 2 として案 a（導出物にする）を推奨どおり承認した。
decision: 欄の決まりの file 2 本（adr/schema.yaml・design-note/schema.yaml）のうち schema 節（値の欄と *_note の説明）を、床の定数（実装の中の型付きの定数・adr.rs と note.rs の FLOOR と、同じ file に置く説明の注）から folio が決定的に導出する生成区間とする（P-6.3・憲法の生成区間 P-14 と同じ型＝印で挟む）。人は生成区間を直さない（P-6.2）。file の残り（先頭の注・先頭の欄（meta）・対応表（mapping）・平易文（plain））は設計文書の側に人が書くまま残す＝裁定の記録（meta.type_enum_ruling の裁定 id・逐語・日付）の正本は設計文書に留まる（P-5.5）。実装の中の型付きの定数は P-5.5 の「型付きデータ」の 1 つとして扱い、機械が執行する規則の正本の置き場は設計文書と型付きデータの 2 面のままとする。人が読む型付きデータの面（欄の決まりの file の生成区間）は、その正本からの導出物として残す。導出の口は folio schema --write（書く）／--check（置き場の file の生成区間と導出の byte 一致を数え、印が無い 2・不一致 1・一致 0・folio inject と同じ型）。folio check の置き場（dir）ごとの検査（欄単位の突き合わせ・凍結 fixture の最小の写しにも当てる）は現行のまま残し、byte 一致は folio schema --check が設計文書の置き場に対して持つ（CI で撃つ）。値も説明も正本は実装の定数 1 か所で、data 側に旗も値を緩める欄も無い（N-3.1 は保つ）。生成区間の先頭の行は「生成区間・手で直さない・正本は実装の定数」と書く。判断の記録と設計ノートの欄の決まりそのもの（欄・値域・閾値）は変えない。
options:
  - id: a
    name: 欄の決まりの file の schema 節を床の定数からの生成区間にする
    text: 実装の定数を正本とし、folio が欄の決まりの file 2 本の schema 節を生成する。folio schema --check は生成区間の byte 一致を数える。先頭の欄（meta）・対応表（mapping）・平易文（plain）と先頭の注は人が書くまま残り、人が読む写しは残る。
    verdict: adopted
    reason: P-6.3（一方を正本とし他方は導出する）・P-6.4（両面手書きを採らない）・P-6.2（生成物を手で直さない）と揃い、ADR-1 の帰結 4 つ目の道筋を「写しを残したまま」完了できる。憲法の生成区間（folio inject・P-14）と同じ型なので新しい機構を増やさない。N-3.1（data 側で緩められない）はそのまま保てる。案 b と同じく P-5.1 / P-5.5 の説明（規則の正本が実装の定数に在る理由）を要するが、人が読む型付きデータの面を導出物として残すので型の一覧は型付きデータに在り続け、裁定の記録は設計文書の側に留まる。
  - id: b
    name: 欄の決まりの file を正本から外す
    text: 欄の決まりの file 2 本を退役し、欄の決まりは実装の定数だけが持つ。人は判断の記録の面と用語集で読む。
    verdict: rejected
    reason: 変更は最小だが、人が読める欄の一覧が無くなり、P-5.1（型の一覧は型付きデータに置く）を実装の定数だけで満たす説明が要る。案 a の撤退先として残す。
  - id: c
    name: 両立の根拠を判断の記録に書き足す
    text: ADR-1 に「実装の定数は人が書く面ではない」等の根拠を足し、所見を退ける。
    verdict: rejected
    reason: 反証役が「欄の決まりの file を生成物と宣言した箇所は無く生成の命令も無い（同じ ADR-2 は凍結 anchor を生成物と明記し生成の命令を名指す非対称）・欄の決まりの floor_note が『変えるときは床の script を直す』と手作業の同期を前提にしている」と潰しており、根拠が立たない。P-6 の出所の失敗と同型のまま残る。
  - id: d
    name: 欄の決まりの file を正本にし、実装が起動時に読む
    text: 欄の決まりの file 2 本を正本とし、床の定数を持たず、folio が起動のたびに読んで閾値・値域・置き場に使う。
    verdict: rejected
    reason: P-5.1 の括弧が名指す置き場（正本 YAML）に正本を置ける唯一の向きだが、data 側が規則を緩める口そのものになる（承認者・対話面・裁定 id の形・案の最小数を書き換えれば検査が緩む）。ADR-1 の敵対レビュー 3 周（2026-09-12・f2-648.2 notes）はこれを実測で示し、凍結 fixture の 15 の場合（owner-knob ほか）がその実証を固定している。N-3.1（例外機構を足さない）に正面から反する。
  - id: e
    name: 欄の決まりの file 全体を生成物にする
    text: 先頭の注・先頭の欄（meta）・対応表（mapping）・平易文（plain）まで含めて file 全体を実装の定数から生成し、byte 一致を file 全体に当てる。
    verdict: rejected
    reason: 床の定数は schema 節の値しか覆っておらず、file 全体を生成物にすると裁定の記録（meta.type_enum_ruling の裁定 id と逐語）と対応表（mapping）の正本まで実装へ移り、P-5.5（原則と裁定の正本は設計文書）に反する。凍結 fixture の写し 16 本（最小の写し・各 2,199 byte）を完全な写しに差し替えることになり、便の上限に収まらない。
basis: [P-5, P-6, P-10, P-14, N-3, ADR-1, ADR-2, ADR-8, FR6, P-13, R-7]
retreat:
  kind: measure
  condition: 数えるのは orchestrator 席（2026-09-19 までの名は planner 席）で、台帳に記帳する。発効後、(a) 生成区間を人が直して folio schema --check か folio check が落ちた回数、(b) 導出の口の不一致（生成区間の印や体裁の差）で便の受付か取り込みの審査が止まった回数（器の断りの記録 1 回を 1 件と数える）を、rules 行 R-7 の同じ種類の失敗の定義（same_failure）では別種として別々に数え、どちらかが R-7 の上限を超えたら、本判断を捨てて案 b（欄の決まりの file を正本から外す）へ移る判断の記録を起こす。
amends: []
grill: {when: 2026-09-19, who: 独立の審査役（opus・読み取り専用の agent・planner 席が材料を渡した）, where: docs/design/adr-9-grill.md（台帳 f2-648 notes 2026-09-19 に要旨）, summary: 発効を止める重さ 3 件（P-5.5 の 2 面に実装の定数が入るかの読みと逆向きの案 d が無い・導出の範囲が未決で file 全体だと裁定の正本が実装へ移る・byte 一致を凍結 fixture の最小の写し 16 本に当てると偽になる）と直すとよい 11 件（撤退条件の 2 種は R-7 では別種・同じ形が天井の正本ほかに残る・天井の束に生成物が入る・ADR-2 決定 (5) も引き取る・古くなった宣言 2 つ・配信先の語・案 c の引用・基準の P-2・体裁の変化）を全部反映した。向き（導出物にする）・P-6.3 / P-6.4 / P-6.2 との両立・N-3.1 の保持・案 b / c の却下・平易文の水準・床の実測（合格）は支持。まだ分からない 1 件（便の大きさ）は範囲を schema 節に限り fixture を欄単位のままにすることで 2 便に収まる見込み}
approval: {who: 持ち主, date: 2026-09-19, ruling: f2-648 notes 2026-09-19 20:1x JST（発効の承認・判断の記録 ADR-9・ADR-10 と天井の正本 第 2 版（v0.2）を 1 つの承認で発効する承認要求への回答）, verbatim: どちらも承認する, surface: R-8}
plain: 「判断の記録の書き方」と「設計ノートの書き方」を決めたファイルが 2 枚あり、今は機械の中の決まりと人が書いたファイルの両方に同じ中身があって、機械が「1 文字でも違えば止める」形でした。憲法は「同じ中身を 2 か所に人が書いて見張る形は採らない」と言っています。そこで、人が書くのをやめて、機械の決まりから folio が、何度やっても同じ結果になる形で、そのファイルの決まりの部分を作る形にします。機械の側に移すのは欄の決まりの部分だけで、先頭の注・誰がいつ決めたかの記録・対応表・やさしい説明文はファイルの側に残します。読める写しは残りますが、直すときは機械の決まりの側を直します。
consequences:
  - 便で運ぶもの（2 便に割る見込み）＝命令 folio schema（--write / --check）と生成区間の印・欄の決まりの file 2 本の schema 節を生成区間に書き換え（体裁は生成器の形に一度書き換わる）・*_note の説明を実装の定数の側（adr.rs と note.rs）へ移す・凍結 anchor（P-10.1・導出物の期待）・先頭の注と先頭の欄（meta）の古くなった宣言 2 つ（設計ノートの床の欄（meta.floor）・判断の記録の退役済みの床の名指し）の直し。folio check の置き場（dir）ごとの検査と床の出す文言は変えないので、凍結 fixture の写し 16 本と床の凍結の場合（floor_cases）の 15 件の期待は不変。要件書の次の版に導出物の要件と受入基準を足し、本判断の発効と同じ承認で発効する（P-13.3）。
  - 判断の記録 ADR-1 は判断を変えず、帰結 5 つ目（欄の決まりの file を正本から外す）の完了の形を本判断が引き取る（道具の移管の完了）。判断の記録 ADR-2 の決定 (5) が言う「欄の決まりの file はその写し」の写しの部分も、本判断の生成区間が引き取る（ADR-2 の判断は変えない）。
  - 天井の 1 周目の止める所見（文書どうしの整合 F-1）は本判断の発効と便の着地で解消し、天井の門（裁定 1・案 A）はその後の便から掛ける（この掛かり始めの条件は、後から発効した判断の記録 ADR-11 の帰結 3 つ目が定め直して引き取った・本判断の判断は変えない）。同じ形（実装の定数と人が書く一覧を床が突き合わせる）は天井の正本（ceiling.yaml）・入口・相談窓口・要件書の節の一覧にも残り、判断の記録 ADR-10 の決定 (2)③ は天井の正本についてその維持を明記している。それらの扱いは本判断の外で、2 周目の所見を材料に別の判断の記録で決める。
  - 天井の束は判断の記録の置き場（dir）の .yaml を全部写すので、生成区間を持つ欄の決まりの file も束に入るが、その正本（実装の定数）は天井の読む文書の一覧に無い。審査役が欄の決まりへの所見を出したときの直す先の扱いは、天井の正本の第 3 版（v0.3）の候補として台帳に記す。
  - 欄の決まりの file の *_note（人が読む説明）は実装の定数の側に持つ（値と同じ 1 か所）。説明を直す変更は実装の変更になる。
note: 元になった持ち主の逐語は台帳 f2-648 notes 2026-09-19「ひとまず全部推奨でよい。」（裁定 2 = 案 a）。天井の所見と反証の逐語は ~/.local/share/folio2/ceiling/2026-09-19-round1/bundle/coherence/（findings.yaml F-1・refute.yaml）。反対側からの検証（grill）は 2026-09-19 に独立の文脈で行い、記録を grill 欄に写した。平易文を 2026-09-20 に直した（「自動で」を「何度やっても同じ結果になる形で」に直した・決定と撤退条件は不変・天井の 3〜5 周目の忠実さの「直す」・持ち主の裁定 f2-648 notes 2026-09-20 15:01 JST「１．推奨で」）。平易文の直し（天井の 7 周目（2026-09-20・main 85c3d7a）の忠実さ F-4）= file の側に残るものを決定の 4 つ（先頭の注・先頭の欄・対応表・平易文）に揃えた。持ち主の裁定 2026-09-20 16:36 JST（f2-648 notes・逐語「承認する」）。実態との突き合わせの直し（2026-09-20・約束と実態の総点検と天井の 9 周目・持ち主の裁定 f2-648 notes 2026-09-21 00:00 JST〔逐語「すべて推奨で進めて」〕）= 引き取る相手の帰結の番号を 4 つ目から 5 つ目に正し、天井の門の掛かり始めを判断の記録 ADR-11 の帰結が引き取る旨を帰結に足し、撤退条件の席の名を今の名に直した。帰結の「同じ形（実装の定数と人が書く一覧を床が突き合わせる）が残る」の列は不正確で、実測の列（天井の正本・入口の棚・部品目録・憲法の値域）は判断の記録 ADR-11 の前提と決定 (4) が持つ（天井の 13 周目の文書どうしの整合 F-5・帰結と判断は変えない）。 【天井の 27 周目の所見への応答（一括 15・2026-09-24 起草・持ち主の承認 2026-09-24 07:46 JST「承認する」・7 問とも推奨どおり）】文脈と案 a の理由の「ADR-1 の帰結 4 つ目」は「5 つ目」の書き損じとして読む（2026-09-20 の直し〔裁定 2026-09-21 00:00 JST〕は帰結の欄の番号だけを正し、同じ相手を指す文脈と案の番号が 4 つ目のまま残った）。ADR-1 の帰結の 4 つ目は判断の記録の本文の英字語・参照 id・根拠の形を床が課す話で、欄の決まりの file を正本から外す道筋は 5 つ目である。発効済みの文脈と案の字は変えない（天井の 27 周目 文書どうしの整合 F-9）。
