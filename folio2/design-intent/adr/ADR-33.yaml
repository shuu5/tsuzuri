note: |
  【出所】台帳 f2-648.275.2。器の側の今の形は scribe2 の設計文書 vessel-hook.md（5 節・15 節）と polarity.md、tsuzuri の側は写し（bbc8126）の憲法の編集時の止めの条と、同じ関数の条。
  【検証の要点】条文を改訂しないので、改訂の前の敵対的な検証の記録は要らない。起草役の自己反証: (i) つながりを止めないのは条 P-18.1 を狭める改訂か → 規範文は変えず、「食い違う」の読みを判断の記録に書く。未達の範囲（つながり）は事後の床が落とし、条 P-18.2 のとおり事後を編集時の代わりにはしていない（形と凍結は編集時に止める）。(ii) 写しの上の床は素の床と同じ関数か → 口と folio check が同じ 1 本の関数を撃ち、歯が同じ写しで ⊆ を固定する。違いは版管理との照合が写しで測れないことだけで、写しが版管理の外に在ることの「まだ分からない」は前後とも数えない（独立の検証の反例 H1・H3・H5 で、書く前の数えが正本を読めずに途中で止まった周にだけ後に出ることが分かり、決定 (1) を直した）。(iii) 書く前から在る違反を数えないと、壊れた置き場を黙って通すか → 口は編集 1 回ぶんの増分だけを答え、置き場の全体は素の床が数える（口の 通す は床の 合格 ではない・条 P-3.3）。(iv) 面の段を口で撃たないのは、面の要る形の崩れを編集時に通す穴か → 穴である。ただし写しでは段の門が開かず、門を外せば ⊆ が崩れる（決定 (6)）。口は数えていないことを名乗り、事後の床が落とし、撤退条件 (5) が形の検査へ移す時機を数える。(v) 口は置き場の外を書かないか → 独立の検証の反例 S1（置き場の中の記号の連結〔symlink〕を辿って写しの外の file を書いた）で、書く先の path が記号の連結を通れば書かずに まだ分からない とした（決定 (1)）。(vi) つながりの行を標準出力に出すと、器が断りの字の上限で止める行を落とすか → 出す順を 止める → まだ分からない → 要約 → つながり にし、器は後ろから切るのでつながりの行から先に落ちる（歯が順を固定する）。(vii) 撤退条件 (1)(2) は器の記録を材料にするが、記録は中身を持たない（逐語を残さない）。(2) が数えられるのは同じ中身が後に着地した周だけで、中身を変えて書き直した周（誤った断りのいちばん出やすい形）は数えから落ちる。落ちた周は (2) の続きが まだ分からない として数を記帳し、多ければ中身を器の手元に一時に残す形を持ち主に問う。
  【実測】script は guard-scripts/。見本は origin の impl/d198。
