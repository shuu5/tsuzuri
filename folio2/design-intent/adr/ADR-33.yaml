consequences:
  - 器の側にも要件と判断の記録と便が要る。器の席の答え（2026-09-28）では、本判断の承認の後に器の次の要件書の周に入れる（承認の後に本判断の id を器の席へ知らせる）。器の行は便 199 の着地の後に配線する。
  - 時間切れ（器の予算を越えた周）の極性と扱いは、器の判断の記録に委ねる。器は、通して知らせる側に傾いている（着地の時に同じ関数〔folio の床・器の受付の床〕が検査し直し、負荷の下で編集時に閉じると編集の道が止まるため）。宣言が在り、掛かる file なのに実行 file が解けないか宣言が壊れている周は、閉じる側（器の仮の極性・理由の字に直し方を名指す）。
  - 殻の命令（Bash）の書き換え（sed -i・リダイレクト）で置き場の file を書く道は、その場では止めない（器の書き込み範囲の門も口も見ない・器の今の予定に無く、器の次の世代の扱い）。着地の床（同じ関数・取り込みの前）が止める。
  - 器の行が着地するまでは、口は人と席が手で撃つ道具で、編集は止まらない（条 P-18.1 の未達は続き、条 P-18 の機構の注がそう書く）。
  - folio check の出力と終了は変わらない（つながりの印は数えの内側の印で、違反の字も数も変えない）。
  - 器の行の後は、AI の席が設計文書を書く周に、形と凍結の違反がその場で断られ、断りの字は素の床の字と同じになる。つながりの違反は編集を止めずに口の標準出力の後ろで名指され（断る周は断りの字の後ろ・通す周は器が AI の席へ渡す知らせ）、事後の床が落とす。
  - 口は置き場を 2 回数えるので、器の予算の内に収めるには最適化した組み立て（release）の実行 file が要る（参考値 folio2 0.30〜0.46 秒・外の利用者の写し 0.16〜0.27 秒。最適化しない組み立て〔debug〕では folio2 で 2.1〜3.1 秒）。面の段を撃たないので、便 187 の後も口の時間は変わらない（試しの写しで、負荷 20〜27 の周に folio2 0.25〜0.47 秒・外の利用者の写し 0.16〜0.22 秒、負荷 86〜102 の周に 0.60〜2.16 秒・0.33〜0.69 秒）。
  - 同じ file の離れた 2 か所を同時に変える必要のある形の決まり（行を別の所へ移すと、消してから足せば番号の消失・足してから消せば id の重複）は、1 回の置き換え（Edit）で両方を覆うか file を丸ごと書く。
  - 外の利用者（tsuzuri）は、便 200 の着地の後に folio schema --write（設計ノートの欄の決まりの仕掛けの一覧〔guards〕と規則の表の読む口の名の欄〔key〕の値域）を撃つまで床が落ちる。極性一覧の下限は、外の利用者の下限の行にその欄を付けるまで数えない。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 の notes に 1 件ごとに記帳する（日付・材料の在り処・当たった条件）。材料は、器の周ごとの記録の行（口の終了・所要の時間・標準出力の要約値・書いた後の中身の要約値・置き場の中の相対の path・時間切れか否か）と、着地の床（器の受付の床と取り込みの前の検査）の結果である。
    (1) 器の行の着地の後、器の記録で口が止めた（終了 1）周のうち、正しい正本への一歩だったと持ち主か席が記帳したものが 2 件を超えたら（3 件目で）、止める族と止めない族の境（決定 (2)）を持ち主に問う。器の記録は中身を持たないので、数えられるのは持ち主か席がその場で記帳した周だけである。
    (2) 器の記録で口が止めた（1）か まだ分からない（2）と答えた周のうち、同じ相対の path に同じ中身（書いた後の中身の要約値が同じ）が 7 日の内に着地して着地の床が合格したものについて、席が着地の直前の置き場にその中身を渡して口と素の床を撃ち直し（器の宣言の key と同じ --dir の字〔相対か絶対か〕で撃つ・字が違うと置き場の dir の字を持つ行の要約値が変わる）、口の止めた行が素の床に無いか、口が まだ分からない（2）と答えて素の床が合格なら 1 件と数える。撃ち直しの口の標準出力の要約値が記録の値と違う周（断った時と置き場が違い、元の答えの再現でない）は、件に数えず まだ分からない に数える。1 件でも出たら、器の行を外すよう器の席へ頼み、決定 (1) を捨てて直す判断の記録を起こす。
    (2) の続き（数えられない周）。記録で 1 か 2 と答え、同じ中身が 7 日の内に着地しなかった周（中身を変えて書き直した周を含む）は数えられない。席は 7 日ごとに、その数と撃ち直しの要約値が違った周の数を まだ分からない として記帳する（条 P-4.2）。1 と 2 の周が 4 周以上ある 7 日で、その数が同じ 7 日の 1 と 2 の周の半分を超えたら、1 と 2 の周の書いた後の中身を器の手元に一時に残す形（記録はそれを指すだけ）を器の席へ頼むかを持ち主に問う。
    (3) 器の記録で、所要の時間が器の予算（hook.budget_ms）を超えた周と時間切れの周（器の極性で通した周を含む）が、連続する 7 日の口を撃った周の 5% を超えたら、書く前の数えを使い回す形（案 g・置き場の要約値が同じ間は前の結果を読む）を起こす判断の記録を起こす。
    (4) 着地の床で落ちた違反のうち種類がつながりの族のもの（口は止めない）が 2 件を超えたら（3 件目で）、その種類を止める族へ移すかを持ち主に問う。族は、落ちた中身を着地の直前の置き場で口に渡し、つながりの行に出たものをつながりの族と数える（床の出力は族を持たず、同じ種類の字に両方の族が在る）。
    (5) 着地の床の面の段で落ちたもの（口は面の段を数えない）が 2 件を超えたら（3 件目で）、その形の決まりを面の段から床の形の検査へ移す（口が止める族に入る）便を起こすかを持ち主に問う。面の段を口で撃つ形（決定 (6) で退けた）は開き直さない（形の検査へ移せば、同じ関数のまま予算の内で止められる）。

