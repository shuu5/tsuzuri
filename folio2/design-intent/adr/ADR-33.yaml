# folio2 判断の記録 ADR-33 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。人が読む面は判断の記録の面（adr-33.html・生成物・手で直さない）。
# 状態: proposed（起草 2026-09-28・orchestrator 席の起草役 guard-draft〔opus 5.5〕）。承認欄は空（持ち主の承認は席が対話面 R-8 で取る）。憲法の条文は 1 字も変えない。
# 起点: 台帳 f2-648.275.2・依頼 ~/.local/share/folio2/handoff-2026-09-28/guard-brief.md・起草の記録 guard-draft.md（実測の表・script は guard-scripts/）。

id: ADR-33
title: 編集時の止め — 置き場の file に書こうとしている中身を、書く前に床と同じ関数で数える口を folio に置き、編集を止める仕掛けは器が持つ

status: accepted
date: 2026-09-28

plain: |
  設計文書（YAML）を書き換えるその場で、決まりに反する書き換えを止める仕掛けを作る判断です。
  いまは、書き換えた後に検査（床）を回すまで何も止まりません。AI の席が形の崩れた文書を書いても、その場では気づきません。
  folio に「書こうとしている中身を、書く前に床と同じ検査で数える口」を足します。書く前と書いた後の置き場を比べ、書いた後にだけ増える違反を返します。
  止めるのは、その file の形の違反（欄・値の一覧・番号の形・散文の決まり）と、凍結を破る違反（発効した判断の記録の本文・番号の凍結の一覧に在る番号を消すこと）です。
  ほかの文書との「つながり」（まだ無い番号を指す・両方向に書く決まり）は止めません。2 つの文書を順に直す途中で必ず一度は食い違うので、止めると先へ進めなくなるからです。つながりは名前を挙げて知らせ、今までどおり後の検査（床）が落とします。
  その場で止めないものは、ほかに 4 つあります。憲法の条文の書き換え、古い凍結の一覧に入っていない番号を消すこと、殻の命令（Bash）での書き換え、人が読むページ（面）が組めない形（床の形の検査は通るが、ページを組むと崩れるもの。例: 判断の記録の帰結の項を文字列でなく「名: 値」の組の形で書く）です。どれも後の検査（床）が落とします。
  面が組めない形を書く時点で数えないのは、書く時点で数える写しを版管理の外に置くのでページを組む段が動かず、動かしてもその段だけで 0.8 秒ほど増えて待ちの予算 2 秒を越えやすいからです（決定 (6)）。
  書き換えを実際に止める仕掛け（hook）は器（scribe2）が持ちます。器は書き換えの前に folio の口を呼び、止めるの答えなら書き換えを断ります。
  止める仕掛けの一覧（極性一覧）を出す口と、その場で止める仕掛けが決めた本数より少ない構成を検査で落とす口も folio に足します。
  憲法の条文は変えません。

context: |
  (1) 出所（台帳 f2-648.275.2）。持ち主の問い（2026-09-28 16:3x JST・逐語「folio2って設計文書を作る部分もなにかしらの強制力を働かせて正しい文書を作成するものではないの？」）と指示（同・逐語「推奨で進めて良いし器の編集時の止めについてもすすめてよい。並列性を上げて最高速で進めて。」）。
  (2) 憲法の条 P-18（P-18.1〜P-18.4）と条 P-15 の機構は、いつ実在するか（live）が M1 のまま実装されていない。条 P-18 の機構の注は「folio2 側の編集時 guard も 1 本も無い」と書き、極性一覧を出す口と行 R-13 の下限を数える口も無い（verified・本流 7528256）。
  (3) いまの強制は、事後の床（folio check・inject --check・schema --check・derive --check）と器の受付の床と天井だけで、設計文書の YAML を書く時点では何も止めない。外の利用者（tsuzuri）の AI の席は、Write と Edit で設計文書の YAML を直接書く。外の利用者の憲法の編集時の止めの条（規範文は folio2 の条 P-18 と同じ）の機構の注は「編集時の guard は器の PreToolUse」と書くが、器の道具の前の hook（PreToolUse）の門は書き込み範囲・命令・起票・権能・走っている便の行の 5 つで、設計文書の床を撃つ門は無い（verified・scribe2 の設計文書 vessel-hook.md の 5 節と 15 節）。
  (4) 床の形（verified・本流 7528256）。folio check は床の 2 つの関数（check_dir と check_index）を順に撃ち、置き場の file を 10 余りの部品がそれぞれ読み、版管理（git）の命令を子の実行（process）で 100 回前後撃つ。違反は（種類・字）の組で、どの検査の族かを持たない。器の導出 file（contracts/schema.toml）は、置き場を含む版管理の根の下か、版管理の外なら置き場の親の下から読む。
  (5) 実測（参考値・2026-09-28・負荷 20〜110 の周）。素の folio check は最適化した組み立て（release）で folio2 0.19〜0.60 秒・tsuzuri の写し 0.15〜0.30 秒、最適化しない組み立て（debug）で 0.9〜3.2 秒・0.66〜0.99 秒。git を抜くと folio2 の最適化した組み立てで 0.20 秒。器の hook の予算は器の規則の行（hook.budget_ms）の 2000 ミリ秒、待ちの上限は行（hook.timeout_s）の 10 秒（scribe2 rules/manifest.toml）で、時間切れは道具の外の枠（Claude Code）の側で判定が消える（通る）。器の席の答え（2026-09-28 17:4x JST・推奨として）では、口に当てる予算は器の hook の予算（hook.budget_ms の 2 秒・器の非機能要件）で、待ちの上限（hook.timeout_s）ではない。
  (6) 双方向の決まり（規則の表の行と条の関係の欄の逆参照・判断の記録の後継と前任・条の改訂の記録と判断の記録の amends・判断の記録の発効と封・条の件数）は、2 つの file か同じ file の離れた 2 か所を順に書く途中で必ず一度食い違う。置き換えの道具（Edit）は 1 回に 1 か所を置き換え、要件書（255 KB）を丸ごと書き直すのは現実的でない。抜け道の旗は条 N-3.1 で持てない。
  (7) 器（scribe2）は道具の前の hook（PreToolUse）を、編集系の道具（Write・Edit・MultiEdit・NotebookEdit）を選ぶ道具の名の選び（matcher）で持ち、極性一覧（29 の仕掛け・in-loop 23）と、置き場ごとの path の種別の宣言（design-intent-paths・scribe2 の判断の記録 ADR-0047）を持つ。走っている便の行の門（vessel-hook.md の 15 節）は、置き換える前と後の字（old_string と new_string）から書いた後の本文を組み立てる形を既に持つ。
  (8) 床の穴のレーンの便 187（行 gh・見本 14bca08・未着地・着地の順は本便より先）は、床の最後に面の段を足す。面の段は、床のほかの段が違反も「まだ分からない」も保留も数えていないときだけ、配信の面を組む生成器と同じ関数で面を全部組み（図の道具は撃たない）、組めなければ面の字のまま違反 1 件にする。版管理の外の写しは照合が「まだ分からない」1 件になるので、面の段は開かない（便 187 の歯が固定する）。起草役の実測（参考値・負荷 20〜27）では、面の段を積んだ素の床は最適化した組み立てで folio2 0.50〜0.64 秒・tsuzuri の写し 0.29〜0.34 秒（積まない床は 0.20〜0.24 秒・0.13〜0.16 秒）で、同じレーンの起草役の実測は 0.49 秒から 1.29 秒。負荷 86〜102 の周（別のレーンの組み立てが重なった周・32 core）では、面の段を積んだ素の床は最適化した組み立てで folio2 1.02〜2.53 秒・tsuzuri の写し 0.92〜1.67 秒、最適化しない組み立てで 8.2〜12.9 秒・2.8〜4.6 秒。

decision: |
  (0) 本判断は憲法の条文を改訂しない。条 P-15 と条 P-18 の機構の欄（live と注）は、機構が実在した版で改める（憲法 schema 節の機構の段の規則・条文の外）。
  (1) **口の形。** folio check --dir <置き場> --proposed <置き場からの相対の file> が、標準入力の中身をその file に書いた後の置き場を、書く前の置き場と比べる。数える関数は folio check と同じ 1 本（床の 2 つの関数〔check_dir と check_index〕を順に撃つ関数で、folio check もこの関数を撃つ）。置き場と器の導出 file を一時の作業場所へ写し、写しのまま 1 回、その file を差し替えて 1 回数え、後にだけ在る違反と「まだ分からない」を返す（（種類・字）の組を重複ごと数える差）。終了は 通す 0・止める 1・まだ分からない 2（後にだけ在る「まだ分からない」・置き場の外を指す字・書く先の path が記号の連結〔symlink〕を通ること・写しの中で版管理の根が解けること・読めない標準入力）。止める行・「まだ分からない」の行・要約の 1 行・つながりの行を、この順に標準出力に出し、標準エラーには診断だけを出す（器は標準出力だけを AI の席へ渡し、行の数と字の量の上限で後ろから切るので、つながりの行から先に落ちる）。止める行は素の床の行そのもので、つながりの行は固定の接頭辞「# つながり（編集は止めない・事後の床が数える）: 」の後に素の床の行と同じ字を続ける。止めるかどうかは終了コードだけで読む（つながりの行だけなら 通す 0）。「まだ分からない」の行（書いた後にだけ在る まだ分からない と、数えられなかった理由）は固定の接頭辞「# まだ分からない: 」（素の床の まだ分からない の行と同じ字）で始める。要約の 1 行は 通す／止める／まだ分からない の字で、書く前から在る「まだ分からない」の数を添える（口が数えきれない置き場を名乗る・判定には入れない）。口は置き場の file を書かず、一時の作業場所は終わりに消す。写しは版管理の外に置く。写しが版管理の外に在ることだけから出る「まだ分からない」（版管理が無いか読めない）は、書く前にも後にも数えない（書く前の数えが正本を読めずに途中で止まった周にだけ後に出るので、数えると正本が読めない置き場を直す編集を止める・照合は事後の床だけが数える）。書く先の path が記号の連結（symlink）を通れば、書かずに まだ分からない とする（写しの外の file を書かない）。写しの床の子の版管理の命令（git）には、一時の作業場所の親を探しの天井（GIT_CEILING_DIRECTORIES）に渡し、写しの外の版管理を見ない（一時の作業場所の置き場は呼び手の環境〔TMPDIR〕で決まり、版管理の作業ツリーの中に在りうる・器は環境変数を足さない）。それでも写しの中で版管理の根が解ければ（置き場の dir そのものが版管理の根の形）、まだ分からない とする。一時の作業場所の path に「:」が在ると、探しの天井の字が「:」で割れて効かず、その path が版管理の作業ツリーの中なら毎回この まだ分からない になる（閉じる側に倒れる・答えを誤って 通す にはしない）。
  (2) **止める族と止めない族。** 後にだけ在る違反のうち、つながりの違反は編集を止めず、標準出力の後ろに名指す（決定 (1)・器は標準エラーを記録の診断にだけ使い AI の席には渡さないので、標準エラーでは名指しが AI の席に届かない・条 P-4.2）。事後の床は今までどおり数えて落とす（条 P-18.2）。つながりの違反とは、2 つの正本の間の相互の参照と、条文の凍結 anchor の列と改訂の記録の突き合わせの違反で、発効した判断の記録の本文と封の一覧の照合と、id の一覧の凍結 anchor との照合（番号の消失と改番）は含まない（この 2 つは 2 か所を突き合わせる検査でも凍結として止める）。つながりに数えるのは、網の関数 5 つ（参照 id の解決と逆参照と件数・語彙・判断の記録と正本の突き合わせ・凍結 anchor の列と改訂の記録・散文の言及）の違反と、網の外の関数の中の突き合わせの字（設計ノートの参照 id の解決と別のノートの実在・計画の床・判断の記録どうしの後継と前任と欄の決まりの出所・発効した判断の記録の封の欠け・入口と相談窓口と天井の英字の語）である。それ以外（file の形・値域・id の形・散文の門・裁定 id の形・発効した判断の記録の本文の封・id の消失と改番・欄の決まりの写し・索引の節点）は止める。後にだけ在る「まだ分からない」は族を問わず止める側に数える（条 P-4.1）。条 P-18.1 の「食い違う」は形と凍結への食い違いと読み、まだ揃っていないつながりは事後の床が数える（context (6)）。
  (3) **止める仕掛け（hook）は器が持つ。** 器（scribe2）の道具の前の hook（PreToolUse）が、編集系の道具が置き場の宣言（design-intent-paths）の下の file を書く周に、書いた後の中身を組み立てて folio の口へ渡し、止める（1）か まだ分からない（2）なら編集を断って口の出力の行を断りの字に写す。器が口を撃てない周（口の実行 file が無い・時間切れ）は器の極性で倒す。hook は保証でなく、保証は事後の床である（条 P-15.1）。folio は hook を持たず、folio2 の repo にも置かない。器の行の形（口の実行 file の置き場・待ちの上限・断りの字・器の極性一覧の行）は器の判断の記録が決め、folio2 は台帳を通して器の席へ頼む。外の利用者（tsuzuri）が器を離れて自分で仕えるときは、外の利用者の hook が同じ口を撃てば同じ判定になる（口は 1 つ）。器の席の答え（2026-09-28・推奨として）: 口の実行 file は置き場ごとの器の宣言の key（1 行の命令・書く file の path を入れる穴・殻〔shell〕を通さない・頭の語は実行 file を探す道〔PATH〕で解く）で名指し、folio が道に無い置き場の扱いは器の持ち分である。書いた後の中身は器の設計文書（vessel-hook.md）の 15 節の形 3 の 1 つの読み手で組み立て、口へは標準入力で渡す（本判断の口の形のままで合う）。器の席の追加の答え（2026-09-28・推奨として）: 器は口の標準出力の全体を逐語で断りの字に写し（行の数と字の量に上限・種類を接頭辞で分けない）、標準エラーは器の記録の診断だけにする。器の席（2026-09-28 20:0x JST・器の台帳の覚え書き s2-07l.738.6）は本判断の出力の形（3 種の行の順・後ろから切る・止めるかは終了コードだけ）を受け取り、通す周のつながりの行は道具の前の hook の知らせ（additionalContext）として AI の席へ渡す案で、道具の外の枠がそれを AI に届けるかは器が設計の節で実測する。器は口を撃つ周ごとに 1 行を記録する（口の終了・所要の時間・標準出力の要約値〔sha256〕・書いた後の中身の要約値・置き場の中の相対の path・時間切れか否か・逐語は残さない）。記録の置き場は器の設計が決める。
  (4) **同じ関数の歯（条 P-15.2）。** folio の歯が、同じ写しで、口が止めた行はどれも同じ中身を書いた置き場の素の床の行に同じ字で在ること（編集時の判定 ⊆ 事後の判定）と、つながりの違反は口が止めず素の床が落とすことを固定する。器の側の歯（口の終了と出力をそのまま断りに写すこと）は器の便が持つ。
  (5) **極性一覧と下限（条 P-18.3・P-18.4）。** folio check --polarity が、置き場の憲法の各条の機構のうち種別が拒む（reject）か生成時の検査（build-check）のもの（段・極性）と、規則の表の閾値の行（段・極性は行の条の機構の極性）と、床の定数の仕掛けの一覧（guards・設計ノートの欄の決まりの生成区間に写す名・段は in_loop か post・極性は fail-closed）から、極性一覧を 1 仕掛け 1 行で出し、末尾に集計の 1 行を出す。床は、道具が値を読む口の名の欄（key）の値が下限の名（in-loop-min）の閾値の行が 1 本在るとき、極性一覧の段が in-loop の本数がその値（「<正の整数> 本以上」）を割れば違反にする。その行が無ければ数えず出力に 1 行出し、2 本以上在るか値の形が違えば「まだ分からない」とする。folio2 は行 R-13 にその欄と値を付け（what・値・種別・段は変えない）、その欄の閉じた一覧に同じ値を足す。床の定数の仕掛けの一覧の in_loop は、口が止める族の名（yaml-form・prose-gate）にする（post の一覧は変えない）。ただし、行 R-13 の欄と in_loop の名は、条 P-15・P-18 の機構の live を改めることと一緒に、器の行が着地した後にする（決定 (7)）。
  (6) **止める範囲。** 口が数えるのは置き場の中の file（床が読む file）だけである。置き場の外の生成物（CLAUDE.md の生成区間・導出物の置き場）と、置き場の中の生成区間の欄の決まりとの一致（folio schema --check）は口に入れず、事後の 3 本（inject --check・derive --check・schema --check）が数える。面を組んで初めて分かる崩れ（床の面の段・context (8)）も口では数えず、事後の床が数える。理由は 3 つ。写しでは面の段の門が開かず、口の関数に入れても何も数えない（起草役の実測・試しの写しの歯が通る）。門を外して写しで面を組めば、つながりの違反が残る途中の置き場で、口の止めた行が素の床に無い（素の床は門が閉じて面を組まない）＝決定 (4) の ⊆ が崩れる。面を 2 回組む時間が器の予算を圧す。口は面の段を数えていないことを要約の 1 行の括弧の中で名乗る（黙って 通す と言わない・条 P-4.2・器は標準エラーを AI の席に渡さないので標準出力で名乗る・行は増やさない）。
  (7) **便。** 便 198（行 gs）が口・網の関数 5 つの族・床の 1 本の関数・歯を運ぶ。便 199（行 gt）が網の外の関数の中の突き合わせの字の族（設計ノート・計画・判断の記録・封・入口・相談窓口・天井）を運ぶ。便 200（行 gu）が極性一覧の口と下限の数え・読む口の名の欄（key）の値域・床の定数の仕掛けの一覧の欄を運ぶ（in_loop は空のまま・行 R-13 に key が無いので下限は数えずに 1 行出す）。器の行は便 199 の着地の後に器の席へ頼む（それまでは口がつながりの一部を止める）。床の定数の仕掛けの一覧の in_loop に名を置くこと・行 R-13 に key を付けること・条 P-15 と条 P-18 の機構の live を改めることの 3 つは、器の行が着地し、器の極性一覧に口を撃つ行（design-check）が在ることを席が確かめた後に行う（先に行うと、編集の時点で止める仕掛けが 1 本も動かないのに条 P-18.4 の床が合格になり、条 P-18 の機構の注の未達の字も消える・条 P-4.1・P-15.1・P-3.3）。便 199 と便 200 の契約は便 198 の着地の後に書く（余地を数え直す）。便 187 が先に着地したら、便 198 の契約を改訂する（素の folio check は床の 1 本の関数の後に面の段を撃つ・口は面の段を撃たず要約の 1 行の括弧の中で名乗る・その歯 1 本。便 187 の見本に積んだ試しの写しは起草の記録に在る）。
  (8) **器の予算（2 秒）に収める形。** どの形でも、口の止める行は床の 1 本の関数の行だけで、素の床の行の部分集合のまま（決定 (4)）。① 口は床の 1 本の関数だけを 2 回撃ち、面の段は撃たない（決定 (6)）。面の段まで 2 回撃つと、便 187 の起草役の実測（素の床 1 回 1.29 秒）では負荷が無くても 2 秒を越える。② 器の宣言の key は、最適化した組み立て（release）の実行 file を名指す。最適化しない組み立て（debug）の口は 2.4〜11 秒で越える。③ 書く file に掛かる段だけを数える形は採らない（file ごとに別の式になる＝案 c・凍結と索引の検査は file をまたぐ）。④ 書く前の答えを使い回す形は今は採らない（案 g）。起草役と独立の検証役の実測（参考値・context (5)(8)・両者の記録）で、release の口の計算の時間（CPU・負荷に依らない下限）は folio2 の要件書で 0.36〜0.37 秒で、壁の時計は負荷で伸びる。folio2 の口は負荷 20〜27 で 0.25〜0.47 秒、負荷 62〜109 で 0.43〜2.73 秒（負荷 100 を越える周では release でも 2 秒を越える周が在る・検証役の周で 5 回中 2 回）。外の利用者（tsuzuri）の写しの口は負荷 62〜109 で 0.32〜1.07 秒。越えるのは計算の取り合いのためで、数えを 1 回に減らしても負荷 100 を越える周では越えうる。越えた周は器の時間切れの極性に従い、口の答えが無いだけで編集を誤って止めはしない（事後の床が同じ関数で数える）。使い回しは撤退条件 (3) が当たってから起こす。撤退条件 (3) は、器の周ごとの記録の所要の時間と時間切れか否かで数える。

options:
  - id: a
    name: 口は床と同じ関数を書く前と後の写しで 2 回撃ち、形と凍結の違反だけを止め、hook は器が持つ（採る）
    text: 決定 (1)〜(7) の形。
    verdict: adopted
    reason: 編集時の判定と事後の判定が 1 本の関数になり（条 P-15.2）、つながりを止めないので 2 つの file を順に書く編集が止め合わない（context (6)）。書く前から在った違反は数えないので、壊れた置き場を直す編集も止めない。器は書いた後の本文を組み立てる形と編集系の道具の hook と path の種別の宣言を既に持つ（context (7)）。
  - id: b
    name: 書いた後の置き場の床の違反を全部止める（族を分けない）
    text: 口は書いた後の置き場を素の床で数え、違反が 1 つでも在れば止める。
    verdict: rejected
    reason: 双方向の決まりを持つ 2 つの file の編集が互いに止め合い、先へ進めなくなる（context (6)）。書く前から在る違反で全部の編集が止まり、それを直す編集も止まる。抜け道の旗は条 N-3.1 で持てない。
  - id: c
    name: 1 file の形だけを別の関数で速く数える（置き場を写さない）
    text: 編集する file の種類ごとの形の検査だけを、床とは別の入口で数える。
    verdict: rejected
    reason: 床と別の式になり、同じ関数で確かめる条 P-15.2 を満たさない（2 つの面を人が揃える形・条 P-6.4）。発効した判断の記録の本文の封や番号の消失のように、ほかの file と突き合わせて初めて分かる凍結を見ない。床の関数を file ごとに割る改修が、床の全部の部品に掛かる。
  - id: d
    name: 書いた後に床を撃って知らせる（PostToolUse の hook）
    text: 書き換えの後に素の床を撃ち、増えた違反を AI の席へ知らせる。
    verdict: rejected
    reason: 書いた後なので、編集の時点で止める条 P-18.1 にならない。戻すには別の書き換えが要り、戻す操作が消す操作に近づく。
  - id: e
    name: hook を folio2 の repo と外の利用者の repo の設定にそれぞれ置く
    text: 置き場ごとに、道具の外の枠の設定（.claude の下）へ口を撃つ hook を置く。
    verdict: rejected
    reason: 同じ門の配線が置き場ごとに増える。folio2 と外の利用者（tsuzuri）はどちらも器が仕える repo で、外の利用者の憲法の編集時の止めの条の注は器の道具の前の hook（PreToolUse）を指す。folio2 の repo の設定の dir は便で運べない（新しい dir）。
  - id: f
    name: 口が道具の外の枠（Claude Code）の hook の入力を直接読む
    text: folio が hook の入力（道具の名・file の path・置き換える字）を読み、書いた後の中身を自分で組み立てる。
    verdict: rejected
    reason: folio が道具の外の枠の入力の形に縛られ、文書を生成し検査し知らせる役（条 P-1.1）の外へ出る。書いた後の本文の組み立ては器が既に持つ（context (7)）。
  - id: g
    name: 書く前の答えを使い回して、数えを 1 回に減らす
    text: 置き場の要約値が同じ間は、前に数えた書く前の答えを読み、書いた後の 1 回だけを数える。
    verdict: rejected
    reason: 今の実測では要らない（決定 (8) ④）。答えの置き場と要約値という 2 つ目の状態を持ち、古い答えを読むと、口の止める行が素の床の行に無い件（決定 (4) の部分集合の崩れ）を生みうる。要約値に入れる物（置き場の全 file の byte・器の導出 file・実行 file の版）と歯を決めてからでないと安全に持てない。撤退条件 (3) が当たったら、この形を判断の記録で起こす。

