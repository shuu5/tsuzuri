id: ADR-23
title: 憲法の schema 節の機構の段の規則を「機構がまだ無い条は床の判定に数えず、条ごとに表に出す」に改め、前文の平易文の順位の言い換えを直す（憲法 第 1.4 版）

status: accepted
date: 2026-09-24

plain: |
  憲法の決まりの 1 つが、道具の実際の動きと食い違っています。その決まりの字を、実際に守れる形に直します。
  憲法の各条には、その条を守らせる仕掛け（機構）と、その仕掛けがいつから動くかが書いてあります。この記録の決定では「いつから動くか」を「実在の段」と呼んでいますが、条の「段」（いつも守る・確認してから変える・絶対にやらない）とは別のものです。
  いま 6 つの条（P-11・P-13・P-15・P-17・P-18・A-3）は、仕掛けがまだ作られていません。
  憲法の型の節は「仕掛けがまだ無い条は、検査の結果を「まだ分からない」として出す」と約束しています。
  ところが検査の道具（folio check）は、その 6 つを何も言わずに「合格（違反 0・まだ分からない 0）」と返します。約束と逆です。
  直し方は 2 つあります。道具に 6 つの「まだ分からない」を出させるか、約束の字を直すかです。
  道具に出させると、仕掛けが作られるまで毎回「まだ分からない」になり、毎日の作業の確かめ（床）が全部止まります。
  そこで約束の字を「仕掛けがまだ無い条は、合否の数には入れず、検査の出力と憲法のページに条ごとに並べて見せる」に直します。
  見せる 1 行を検査の道具に足す小さな便を、あとで 1 つ出します。
  憲法のページの「M1 で動く」という札も、実際にはまだ動いていないので、「仕掛けがまだ無い」の字に直す便を出します。この 2 つが済んでから、次の見直しの周を回します。
  仕掛けを作ったら、その条の「いつから動くか」を「いま動く」に直し、そこから合否の数に入ります。「いつから動くか」の欄を、検査を止めるスイッチには使いません。
  あわせて、条 P-18 の注は P-18.4 を「まだ分からない」として扱うと書いていましたが、事実と違うので直します。編集の時点で止める仕掛けは 1 本も無く、P-18.4 は「まだ守れていないと分かっている」状態です（条の本文ではなく注の直しです）。P-13 と P-17 の注の「まだ分からない」の扱いはそのまま残り、合否の数に入れないだけです。
  同じ改訂で、憲法の前書きの「迷ったら」の文の言い換えも直します。今は「全部そろえる」より「そろっている」で、同じ言葉が 2 回出て違いが分かりにくいからです。
  新しい字は「何でも漏れなく入れる」より「同じ形にそろっている」です。
  どちらの字も、変えるには憲法の改訂の手順（理由とやめる条件を書き、反対側から確かめ、あなたの OK をもらう）が要ります。2 つを 1 回にまとめました。
  条の本文（規範文）と見出しは 1 字も変わりません。

  （発効の後の読み方）この判断は 2026-09-25 に発効しました。上で約束した 2 本の小さな便は、同じ日に着地しました。検査の道具は、仕掛けがまだ無い 6 つの条を出力の 1 行で並べます。憲法のページの札は「M1 で動く」から「仕掛けがまだ無い」の字に直り、その後に「床は判定しない・憲法が書く実在の予定は M1」の字になりました。この「M1」は、仕掛けを作る時期が決まったという意味ではありません。作る時期はまだ決まっていませんが、それを言う値が決まりの中に無いので、憲法の字の M1 をそのまま残しています。上の段落は、承認をお願いしたときの字のまま残しています。

context: |
  (1) 約束と実態の食い違い。憲法の schema 節の機構の段の規則（schema.mechanism_live_rule）は、第 1.0 版から同じ字で、機構の種別（kind）が機械が拒む（reject）か検査で落とす（build-check）でも、実在の段（live）が「いま」（now）でない条は、その検査の結果を「まだ分からない」として出す（条 P-4.2）と約束する（逐語は本判断の改訂の欄の 2 行目の前の字）。
  いまその条は 6 本（P-11 機械が拒む・P-13 検査で落とす・P-15 検査で落とす・P-17 機械が拒む・P-18 検査で落とす・A-3 機械が拒む。実在の段〔live〕はどれも M1）である。
  本流（68196cf）の床（folio check --dir design-intent）は「合格（違反 0・まだ分からない 0）」を返し、6 本の条について何も出さない。
  実装（crates/folio/src）で機構の実在の段を読むのは、床の値域の検査（check.rs・値が値域に在るか）と、憲法の面の機構の欄の名札（face_constitution.rs・face_labels.rs の「M1 で動く」）だけである。
  天井の 32 周目の実態の審査役はこれを 止める に挙げ（実態 F-1・文書が実態と逆のことを約束している）、反証役は支持した（refute/F-1/result.yaml・2026-09-24T13:57:38Z）。
  反証の記録は、6 本の条の注の「まだ分からないとして扱う」は人の扱いの宣言で検査の出力ではない、P-11・P-15・A-3 の注にはその字も無い、と結んだ。

  (2) 前史。初日の床（day-1・scripts/check_draft.py・commit 814366c）は、条 P-18.4 の 1 つについてだけ、標準エラーに「まだ分からない（live delivery-0・便 0 で編集時 guard が入るまで）」と 1 行を出していた。
  その行は終了コードにも違反の数にも入らず、ほかの条（当時 live が now でない条）には出さなかった（起草の時点で 814366c の file を読んで確かめた）。
  つまり初日の床も、その 1 条を判定に数えなかった。ただし名は「まだ分からない」で、在る計算（極性一覧から数えた編集時の本数 0）の結果を、実在の段（delivery-0）を理由に「まだ分からない」へ抑えていた。これは本判断の案 d の形で、案 a の規則が禁じる使い方（段を理由に在る検査の結果を抑える）でもある。
  Rust の床へ写したとき（M0）、この 1 行も落ち、規則の字だけが残った。

  (3) 直し方は大きく 2 つで、その間に中の案が 1 つ在る。一括 19 の仕分けの 🔴 問 4 と、その起草役・検証役の申し送りが挙げた。
  ① 床に入れる＝6 本の条ごとに「まだ分からない」を判定の数に入れる。床は 6 本の機構が実在するまで終了コード 2 を返し続ける。
  便の確かめ（verify）・受付の前の確かめ（precheck）・天井の門は、どれも床 4 本の終了コード 0 で受ける運びなので、全部止まる。
  止めないには、終了コード 2 を受ける手順か、この 6 件だけを判定から外す口が要り、後者は結局 schema 節の改訂になる。
  ② 規則の字を実態の向きに改める＝条 A-2 の改訂（schema 節は憲法 schema.amendment_scope の節・凍結 anchor に丸ごと写る）。
  ③ 中の案＝6 本の条ごとに「まだ分からない」を判定とは別の行に出し、要約の行に別枠で数え、判定と終了コードは変えない（一括 19 の起草役の推奨・検証役の穴 (i)）。今の規則の字を改訂なしに充たすとも読めるが、要件書の 3 値の定めと割れるとも読める（下の (6)・案 d）。
  なお、機構の注で断るだけ（字も床も変えない）では、規則の字が「出す」のまま残り、次の周の実態が同じ 止める を立てる見込みが高い（反証の記録）。

  (4) 前文の平易文。天井の 32 周目の読みやすさの審査役は、前文の平易文の「迷ったら「全部そろえる」より「そろっている」」を直す所見に挙げた（読みやすさ F-1・直す）。
  「網羅より揃い」の言い換えが同じ動詞「そろう」の 2 つの形になっていて、どちらが勝つのか、何が違うのかを非エンジニアが読み分けにくい。前文は入口の「はじめて読む人」の最初の行き先に在る。
  前文は平易文と注の字を含めて丸ごと条 A-2 の改訂の範囲に在る（判断の記録 ADR-20 決定 (2)）ので、字を変えるには憲法の版が要る。
  一括 19 は、本件の改訂を起こすなら同じ改訂に載せる（別に版を上げると改訂が 2 回になる）と推奨した。

  (5) 同じ憲法は、機構の定義として検査の対象を狭める字の先例を持つ。条 P-7 の機構の注は、発効の前は比較の元（baseline）が無いことを「検査対象外＝散文の適用除外ではなく機構の定義」と書く。
  本判断の案 a は同じ形（機構が無いうちは判定の対象外・それは例外の口ではなく機構の定義）を、機構の段の規則として schema 節に置く。

  (6) 要件書の 3 値の定め（verdicts）。「合格」は「検査が最後まで動いて、決まりに反する箇所が 1 つも無かったとき」、「まだ分からない」は「検査そのものが動かせなかったとき。合格として表示しない（憲法 P-4・AC3）」である。
  要件 FR5 の規範文は「実行できなかった検査を合格と表示しない」。どちらも、在る検査が走れなかった場合を「まだ分からない」と呼ぶ。
  6 本の条を守らせる検査はまだ作られていない（在るのに走れなかったのではない）。案 a はこれを 3 値のどれでもなく判定の外に置く。中の案は同じ条に「まだ分からない」の名を付けながら要約で「合格」と言うので、3 値の定めと FR5 の字とが割れる読みが立つ（案 d）。

  (7) 6 本の条の実在の段の値（live）はどれも M1 で、意味は「M1 で実在する」（schema.mechanism_live_meaning）である。M1 の段は着地済みで、要件書の M1 の範囲の節の作る 5 行にも、M3 の範囲の節にも、6 本の機構は無い。値は古い約束のまま残っている（一括 19 の検証役の穴 (iv)）。

decision: |
  (1) 憲法を第 1.4 版に改訂する。schema 節の機構の段の規則（schema.mechanism_live_rule）を、改訂の欄の 2 行目の前の字から後の字に改める。後の字の意味は、機構の種別が機械が拒む（reject）か検査で落とす（build-check）でも実在の段が「いま」（now）でない条は、機構がまだ無い条として床の判定（違反・まだ分からない）に数えず、folio check の出力と面の機構の欄に条ごとに表に出す（条 P-3.3・P-4.1）、実在の段は実在する検査を止める旗ではなく機構が実在した版で「いま」に改める、である（逐語は改訂の欄と docs/design/adr-23.md の表）。
  読み方は次の 4 つである。
  ① 「数えず」は判定の数（違反・まだ分からない）と終了コードに入れないことで、判定の値域（合格 / 不合格 / まだ分からない・条 P-4 の機構の注）は変えない。
  条の充足（その条が守られているか）の扱いは変えない。P-13・P-17 の注が書く「充足は「まだ分からない」として扱う」は人の扱いとしてそのまま残り、床の判定の数に入れないだけである。
  条 P-18 の注の「P-18.3 / P-18.4 の充足は「まだ分からない」として扱う」は、P-18.4 について事実と違う。編集時の guard が 0 本であることは同じ注が書いており、P-18.4 は分かっている未達である。承認の後に席が P-18 の注をその字へ直す（機構の注は条文の 5 欄の外・条 P-13.3 の記録は本判断）。
  根拠の括弧を（P-3.3・P-4.1）にしたのはこのためである。この行の働きは、床の合格を完成とも「異常なし」とも読ませないこと（P-3.3・P-4.1）で、「まだ分からない」の名を付けること（P-4.2）ではない。
  ② 「表に出す」は 2 か所で行う。folio check の出力＝決定 (3) の便が足す標準エラーの 1 行（条の id を並べる）。面の機構の欄＝憲法の面の名札と条の注（名札の字は決定 (4) の面の名札の便で「機構がまだ無い」の向きへ改める）。folio build の床の行は「表に出す」所に数えない（規則の字が folio check と名指す）。
  ③ 「実在する検査を止める旗ではない」は、実在の段（live）の値が、床の実装に在る検査（規則の表の行が数える検査・歯）を走らせるか否かに一切掛からないことを言う。今の床もそうである（実在の段を読むのは値域の検査と面の名札だけ）。
  ④ 「機構が実在した版で now に改める」は、条の機構の注が名指す検査・口が本流に着地した取り込みの要求の中で、その条の実在の段を「いま」（now）に改めることを言う。改めた版から、その条の検査は床の判定に入る。改めた版で床が不合格になること（例 条 P-18 の機構が着いて編集時の guard が 0 本と数えたとき）は、改めない理由にならない。それが条の約束である。
  ⑤ 6 本の条の実在の段の値（M1）は、本判断では変えない（文脈 (7)）。理由は 3 つである。
  値域（schema.enums.mechanism_live = now・M0・delivery-0・M1・adr）に、今の実態（予定の段が決まっていない）を正しく言う値が無い。M3 に移すと、M3 の範囲に無い機構を M3 で実在すると言う別の古い約束になる。
  値域に「予定なし」のような値を足すのは schema 節の値域の変更＝条 A-2 の改訂で、値域は組み立て時に実装の型へ焼かれる（crates/folio/build.rs・便 49）ので、面の名札と歯の便も要る。本判断の範囲を広げてまで今足す益は、面の名札の字を改める便（帰結）で得られる。
  値だけを変えるなら、条 A-2.2 の判定では改訂に当たらない。改訂の範囲の条文は 5 欄（id・見出し・規範文・段・縛る相手）と schema 節・前文で、各条の機構の欄（mechanism）はその外である（凍結 anchor の写しの取り方 projection_article_fields も 5 欄・床の実装 floor_adr.rs も機構の欄を差分の検査の外と書く）。そのときは条 P-13.3 のとおり判断の記録か版付きの文書で残す。
  条の id・見出し・段・縛る相手・規範文と、schema 節のほかの欄（値域・実在の段の意味 mechanism_live_meaning を含む）と 6 本の条の機構の欄は 1 字も変えない。

  (2) 同じ版で、前文の平易文（precedence.plain）の 1 文目の「迷ったら「全部そろえる」より「そろっている」、」を「迷ったら「何でも漏れなく入れる」より「同じ形にそろっている」、」に改める。
  「網羅より揃い」の 2 つの語を、別の動詞（入れる・そろう）で言い分ける。「漏れなく入れる」が網羅、「同じ形にそろっている」が揃いに当たる。
  前文の規範文（text）・平易文の残り（「早い」より〜・段の順位の 2 文目）・根拠の行・縛る相手・機構は 1 字も変えない。CLAUDE.md の生成区間は前文の規範文だけを写すので動かない。

  (3) folio check の出力に 1 行を足す便を 1 本起こす（契約表と便番号は席が別に起こす・大きさ S の見込み）。
  folio check は、置き場の憲法の条のうち機構の種別が機械が拒む（reject）か検査で落とす（build-check）で、実在の段が「いま」（now）でない条を、標準エラーに 1 行で並べる。
  字の形は「# 機構がまだ無い条（床の判定の外・憲法 schema.mechanism_live_rule）: P-11（M1）・P-13（M1）・P-15（M1）・P-17（M1）・P-18（M1）・A-3（M1）」を下限とし、並べる順は憲法の条の並び、括弧の中は実在の段の値とする。
  当たる条が 0 本なら行を出さない。判定・違反とまだ分からないの数・終了コード・標準出力（要約の行「folio check: 合格（違反 0・まだ分からない 0）」を含む）は 1 byte も変えない。
  出す場所は「# まだ分からない:」の行と同じ標準エラーで、要約の行の直前とする。凍結の口（--freeze-anchor など）と差分の印字（--emit-amends）でも同じ行を標準エラーに出す。ただし凍結を断る道（要約の行より前に終了コード 1 で抜ける）では出さない。
  歯は、当たる条を持つ最小の fixture で行が出ること・0 本の fixture で出ないこと・どちらでも判定と終了コードと標準出力が行を足す前と同じであることを数える。
  加えて、folio2 自身の憲法の上で当たる条の一覧を固定する歯を 1 本置く（今の値は P-11・P-13・P-15・P-17・P-18・A-3 の 6 本・並びと実在の段の値まで）。
  条の実在の段を「いま」（now）から、そうでない値へ戻す変更も、機構が着地して「いま」に改める変更も、この歯の値を同じ取り込みの要求で直さないと落ちる＝段の欄の変更が審査の目に必ず入る（撤退条件 (2) の決定的な受け皿）。
  この一覧を固定する歯は、憲法の機構の欄の写しを人が歯に書く 2 つ目の写しで、段の欄の変更を審査に引き出すための意図した写しである（実の正本の本数に依らない歯の向きの例外として断る）。
  folio build の床の行と面は、この便では触らない（面の名札は決定 (4) の別の便）。

  (4) 順序。持ち主の承認の後、席が 1 本の取り込みの要求で (1)(2) と版上げと凍結 anchor と本判断の状態・承認欄を置き、その後に決定 (3) の便を運ぶ。
  決定 (3) の便と、面の名札の便（実在の段が「いま」（now）でない条の憲法の面の名札「M1 で動く」を「機構がまだ無い（床は判定しない）」の向きの字へ改める・「まだ分からない」の字は使わない・承認要求の承認の後の欄 17）の 2 本が着地するまで、本流の上で天井の周の束を組まない。
  新しい字の「folio check の出力に表に出す」は決定 (3) の便の前は実装に無く、面の名札「M1 で動く」は 6 本とも偽の字なので、どちらが欠けても束を組むと同じ形の 止める が立つ。
  便が決定 (3) の字で着地できない（契約の審査で落ちる・R-7 の回数を超えて失敗する）ときは、本判断の決定 (1) の ② の「folio check の出力」を外す改訂を持ち主に問う（撤退条件 (5)）。

  (5) 発効の手順は A-2 のとおり＝反対側からの検証（docs/design/adr-23-grill.md）を改訂の前に実施し、持ち主の承認（逐語・日付・裁定 id・対話面 R-8）を得てから、
  席が 1 本の取り込みの要求で (1)(2) と、憲法の先頭の注の版の行と版の欄（meta.version の値 v1.4）と、本判断の状態（accepted）・承認欄・検証の欄を置き、凍結 anchor（anchors/constitution-v1.4.yaml と索引の 1 項）を folio check --freeze-anchor で書く。
  凍結の前に、その時点の本流の上で folio check --emit-amends の 2 行を測り直し、本判断の改訂の欄と一致することを確かめる。
  憲法の先頭の注の版の行には「第 1.4 版 <発効日> = 判断の記録 ADR-23（schema 節の機構の段の規則と前文の平易文の字の直し・規範文と見出しは 0 本）」と書く。
  schema 節と前文は改訂来歴の欄を持たない（憲法 schema の precedence.optional が空・schema 節は条ではない）ので、改訂は本判断の改訂の欄と憲法の先頭の注の版の行だけが持つ。
  承認は 1 回で求めるが、(1)＋(3)（機構の段の規則と便）と (2)（前文の平易文）は別々に退けられる（退けたときに外すものは docs/design/adr-23.md の承認要求が持つ）。

options:
  - id: a
    name: 機構がまだ無い条は判定に数えず、folio check の出力と面に条ごとに表に出す（規則の字を改める・1 行の便）
    text: schema 節の規則を決定 (1) の字に改め、folio check が標準エラーに当たる条を 1 行で並べる便を起こす。前文の平易文の直しを同じ第 1.4 版に載せる。
    verdict: adopted
    reason: 床は今のまま終了コード 0 で運べ、機構がまだ無い条は検査の出力（床を撃つ人と席が必ず見る所）と憲法の面（持ち主が読む所）の 2 か所で見える。判定の値域（3 値）は変わらず、「まだ分からない」の意味（判定できない）も薄まらない。条 P-7 の注の「検査対象外＝散文の適用除外ではなく機構の定義」と同じ形である。規則の字に「実在の段は検査を止める旗ではない」と「機構が実在した版で「いま」に改める」を持たせ、段の欄を例外の口に使う読み（N-3.1）を字の上で塞ぐ。初日の床（day-1）も 1 条を判定に数えなかったが、名は「まだ分からない」で、在る計算の結果を段で抑えていた（文脈 (2)）。案 a は名を「機構がまだ無い条」に変え、段で在る検査を抑えることを字で禁じる。
  - id: b
    name: 床に入れる（6 本の条ごとに「まだ分からない」を判定に数える）
    text: 規則の字は変えず、folio check が当たる条ごとに「まだ分からない」を 1 件出し、終了コード 2 を返す便を起こす。
    verdict: rejected
    reason: 約束の字を広いまま保てる。しかし床は 6 本の機構が全部実在するまで（P-17 の差分の口・P-18 の極性一覧と編集時 guard・A-3 の依存の予算の検査など、どれも未着手）終了コード 2 を返し続ける。便の確かめ・受付の前の確かめ・天井の門は床の終了コード 0 で受けるので全部止まる。止めないには終了コード 2 を受ける手順か 6 件を外す口が要り、前者は床の「まだ分からない」をいつも受け流す運びになって、本物の「まだ分からない」（凍結 anchor が読めない等）が同じ終了コードの中に埋もれる（条 P-4.1 の趣旨に反する）。後者は案 a と同じ schema 節の改訂になる。床の事例（tests/floor_cases.yaml）のうち終了コード 0 を期待する 21 件も、土台の第 1.0 版の写しが実在の段が「いま」（now）でない条を持つので、全部終了コード 2 に変わり、凍結した期待値を書き直す便が要る（一括 19 の起草役の数え・起草役の grep で expect_rc 0 は 21 件）。
  - id: c
    name: 6 本の条の機構の注で断るだけ（字も床も変えない）
    text: P-11・P-15・A-3 の機構の注にも「充足はまだ分からないとして扱う」を足し、schema 節と床は変えない。
    verdict: rejected
    reason: いちばん軽く、条 A-2 の手順も要らない（機構の注は条文の 5 欄の外）。しかし schema 節の規則は「検査結果を…出す」のまま残り、実装は出さないので、約束と実態の逆は解けない。反証の記録は、注の宣言は人の扱いで検査の出力ではないと結んでおり、次の周の実態が同じ 止める を立てる見込みが高い。
  - id: d
    name: 中の案 — 条ごとに「まだ分からない」を判定とは別の行に出し、要約の行に別枠で数える（判定と終了コードは変えない）
    text: folio check が 6 本の条ごとに「機構未稼働・まだ分からない」の行を出し、要約の行に「合格（違反 0・まだ分からない 0・機構未稼働 6）」のように別枠の数を足す。判定の値と終了コードは今のまま。規則の字は変えない読みと、1 句を足す読みの 2 つが在る。
    verdict: rejected
    reason: 床は今のまま運べ、条ごとの「まだ分からない」の字が検査の出力に実際に出るので、条 P-4.2 の「表に出す」を字どおり充たすと読める。今の規則の字（検査結果を「まだ分からない」として出す）は判定に数えるとまでは書いていないので、改訂なしに充たすという読みも立つ（一括 19 の検証役の穴 (i)）。しかし要件書の 3 値の定めは「まだ分からない」を「検査そのものが動かせなかった・合格として表示しない」と定め、要件 FR5 は「実行できなかった検査を合格と表示しない」と定める。同じ出力で「まだ分からない」を 6 件出しながら要約で「合格」と言うのは、この 2 つと割れる読みが立つ（一括 19 の起草役の読み）。その前に、同じ出力が「まだ分からない」の行を 6 つ出しながら要約で「まだ分からない 0」とも書くので、1 回の出力の中で食い違う（別枠の数を足しても、まだ分からないの数の欄とは割れたまま・独立の検証）。割れないようにするには、判定に入る「まだ分からない」と入らない「まだ分からない」の 2 種を定める字が要り、実在の段の値がその切り替えになる。これは 3 値の 1 つに例外の口を足す形で、条 N-3.1 に触れる恐れがあり、要件 FR5 の注か規範文にも断りが要る。便の大きさは M の見込みである（check.rs・判定の型・main.rs の要約の行・要約の字の形を見る歯 10 file 約 21 か所・新しい歯。床の事例の期待値は終了コードだけを見るので動かない見込み）。案 a は同じ条を「まだ分からない」と呼ばず、判定の外の「機構がまだ無い条」として並べるので、3 値と FR5 の定めを割らない。見える場所（検査の出力と面）は案 a と同じである。
  - id: e
    name: 要約の行に、まだ分からないと別の名の数を足す（「合格（違反 0・まだ分からない 0・機構がまだ無い条 6）」）
    text: 案 a と同じ字の改訂で、folio check の標準エラーの 1 行の代わりに（か、それに加えて）folio check の要約の行へ「まだ分からない」と別の名の数を足す。
    verdict: rejected
    reason: 要約の行は床を撃つ人が必ず読む行で、見える力は標準エラーの 1 行より強い。しかし要約の行の字は、歯のうち要約の字の形を見る所が約 21 か所（crates/folio/tests の 10 file・逐語の「違反 0・まだ分からない 0」だけなら 15 か所・9 file）に在り、便の契約表と一括の文書の多くも逐語で引いている。周りの script が字で読むかは全数を測っていない。便は判定の型と要約の行と歯を直す M の見込みになる。数だけでは条の id が分からず、どの条かは結局別の行が要る。標準エラーの 1 行は要約の行の直前に出るので、端末では並んで読める。撤退条件 (3) の所見が立ったら、この案へ乗り換える改訂を問う。
  - id: f
    name: 6 本の条の機構の種別を実態に合わせて「人が目で確かめる」か「機構なし」に書き換える
    text: 規則は変えず、6 本の条の機構の種別を人が目で確かめる（human-review）か機構なし（none）に、実在の段を「いま」（now）に書き換える（規則の対象から外れる）。
    verdict: rejected
    reason: 規則の字も床も変えずに約束と実態が揃い、機構の欄は条文の 5 欄の外なので条 A-2 の手順も要らない。しかし、設計した守らせ方（機械が拒む・検査で落とす）と極性一覧の元データ（stage と polarity は reject と build-check にだけ必須・条 P-18.3）が消え、未達を「機構なし」と書き換えて見えなくする向きになる。仕掛けを作るときに種別を戻す必要があり、戻し忘れても何も落ちない。前文の平易文の直しには別に改訂が要る。
  - id: g
    name: 前文の平易文の直しを載せない（機構の段の規則だけで版を上げる）
    text: 決定 (1)(3) だけで第 1.4 版に上げ、前文の平易文は台帳の控えにして次の憲法の改訂に載せる。
    verdict: rejected
    reason: 改訂の範囲が 1 か所に絞れ、承認の問いが単純になる。しかし前文は条 A-2 の改訂の範囲に在り、別に直すには検証・承認・凍結 anchor の版がもう 1 回ずつ要る。読みやすさの所見（F-1）は入口の「はじめて読む人」の最初の行き先の字である。決定 (2) は部分承認で別に退けられるので、束ねても持ち主の選ぶ幅は狭まらない。

basis: [A-2, N-3, N-4, P-3, P-4, P-7, P-8, P-11, P-12, P-13, P-14, P-15, P-17, P-18, A-3, R-7, R-8, R-10, D-14, FR5, FR20, AC3, ADR-2, ADR-12, ADR-17, ADR-20]

grill: {when: 2026-09-24, who: 起草役（AI・opus 5.5・自己反証）と独立の検証役（AI・opus 5.5・別の文脈・読み取りと git clone の写しの上の実測だけ）, where: docs/design/adr-23-grill.md, summary: 起草役は 13 問を攻めと守りで検証し、改訂を支持した（条件付き）。独立の検証役（~/.local/share/folio2/handoff-2026-09-24/adr23-verify.md）は案 a を支持し、6 本の一覧・実在の段が検査を止めないこと・値だけの変更は改訂に当たらないこと・改訂の欄の 2 行を独立に確かめ、blocking 3（規則の字の床の出力が folio build の行も含むと読める・面の名札の便が周の前提に無い・一括 19 の欄の指し違い）と文面 9 を挙げた。改訂 c で全部を当て、再検証（2026-09-25）は支持・blocking 0 だった。}
approval: {who: 持ち主, date: 2026-09-25, ruling: f2-648 notes 2026-09-25 07:03 JST（発効の承認・一括 19 と判断の記録 ADR-22・ADR-23 の承認要求への同じ回の回答・本判断の問 1 は 2 つとも承認）, verbatim: すべて承認する, surface: R-8}

amends:
  - {"target": "precedence", "field": "plain", "version": "v1.4", "previous_text": "迷ったら「全部そろえる」より「そろっている」、「早い」より「黙って飛ばさない」、「賢い」より「元に戻せる」を選びます。段が食い違ったら、「絶対にやらない」＞「確認してから」＞「いつも守る」の順で強い方が勝ちます。", "new_text": "迷ったら「何でも漏れなく入れる」より「同じ形にそろっている」、「早い」より「黙って飛ばさない」、「賢い」より「元に戻せる」を選びます。段が食い違ったら、「絶対にやらない」＞「確認してから」＞「いつも守る」の順で強い方が勝ちます。"}
  - {"target": "schema", "field": "mechanism_live_rule", "version": "v1.4", "previous_text": "kind が reject / build-check でも live が now でない条は、その検査結果を「まだ分からない」として出す（P-4.2）。", "new_text": "kind が reject / build-check でも live が now でない条は、機構がまだ無い条として床の判定（違反・まだ分からない）に数えず、folio check の出力と面の機構の欄に条ごとに表に出す（P-3.3・P-4.1）。live は実在する検査を止める旗ではなく、機構が実在した版で now に改める。"}

consequences:
  - 憲法は第 1.4 版になる（4 度目の改訂・改める欄は schema 節の機構の段の規則と前文の平易文の 2 つ・規範文と見出しは 0 本）。凍結 anchor は第 1.4 版の file（anchors/constitution-v1.4.yaml）として置き、索引に 1 項を追記する。列の根（第 1.0 版の anchor）の要約値と床の定数は変わらない（写しで実測・docs/design/adr-23.md）。
  - CLAUDE.md の生成区間は 1 字も動かない（schema 節と前文の平易文は生成区間に写らない・写しで実測）。要件書・語彙・規則の表は動かない。実装は決定 (3) の便 1 本だけが動く。歯は、版上げの取り込みでは 1 本も動かない（写しの模擬で 861 本中 861 本 合格・docs/design/adr-23.md）。決定 (3) の行を足す試作を写しに当てても、既存の歯 861 本は 1 本も落ちなかった（要約の行と標準出力を変えないため）。
  - folio init が書く骨格の憲法の schema 節は、folio2 の憲法の schema 節を組み立て時に写す（便 125）。次の組み立てから、骨格の schema 節の機構の段の規則も新しい字になる。骨格の唯一の条は実在の段が「いま」（now）なので、決定 (3) の行は骨格では出ない。
  - 面は、憲法の面（前文の平易文の 1 句・schema 節は面に出ない）と本判断の面が組み立てのたびに変わる（写しの組み立てで実測・前文の平易文は入口の面には出ない）。天井の印は正本が変わるので古くなる（前文と schema 節は周の引き金の欄・判断の記録 ADR-20）。次の周は決定 (4) のとおり便の着地の後の本流で組む。
  - 6 本の条の機構が実在していないことは変わらない。本判断はそれを床の判定の外に置き、見える場所を 2 か所に定めるだけで、条の充足を約束しない（条 P-3.3）。6 本の機構を作る便は本判断の外で、どれも台帳の控えか条の注が持つ。
  - 実在の段の意味（schema.mechanism_live_meaning の「M1 = M1 で実在する」）と 6 本の条の段の値 M1 は、M1 の段を過ぎた今、古い約束を残す（決定 (1) ⑤ で変えない）。
    面の名札「M1 で動く」は、機構がまだ無い条について「もう動いている」とも読め、6 本とも偽の字である。名札を改める便は決定 (4) が天井の周の前提に置く。
  - 条 P-18.4・P-17.2 のように「検査が落とす」と約束する規範文の未達は、本判断で閉じない。P-18.4 は分かっている未達（編集時の guard 0 本）で、条 P-18 の機構は「まだ無い」より「初日の床にあった口が退役し、Rust の床へ写していない」が正確である。閉じるのは P-18・P-17 の機構の便で、どれも便の列に無い。
  - 本判断は条文の周りの節を改訂するので A-2.3 の対象である＝発効の前に反対側からの検証を実施し、その記録を設計ノートの file（docs/design/adr-23-grill.md）に置いて検証の欄（grill）で指す。承認は持ち主の逐語・日付・裁定 id・対話面 R-8 を承認の欄（approval）と台帳に記帳する。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 の notes に記帳する。(1)〜(4) の窓は、決定 (3) の便と面の名札の便が着地した後の本流で天井の周を 3 周回し終えるまでとする。
    発効から 14 日を過ぎても 3 周に満たなければ、その日までに回った周で判定し、1 周も回らなければ判定を「まだ分からない」に落として持ち主へ渡す（P-4.2）。(2) は窓を持たず、本判断が生きている間ずっと数える。
    所見は、重さが「直す」なら挙がった時点の 1 件、「止める」なら反証で支持された 1 件と数え、場所（place）と引用（evidence）と理由の欄で当てる。
    (1) 段の直し忘れ。folio check の出力の 1 行に載る条のうち、その条の機構（条の注が名指す検査・口・歯）が本流に実在すると実測された条が 1 本でも出たら（天井の実態の所見か、席の実測）、その 1 件で、その条の実在の段を「いま」（now）に改める直しを起こし、決定 (1) の「数えず」を捨てて案 b（まだ分からないを判定に数える）へ改めるかを持ち主に問う。
    (2) 段の欄を旗に使った疑い。本流の取り込みで、条の機構の実在の段が「いま」（now）から、そうでない値へ変わった変更か、そうでない値どうしの先送り（例 一括 11 が P-11・P-17・P-18 を delivery-0 から M1 へ、P-13 を M0 から M1 へ移した形）が 1 件でも入ったら（決定 (3) の一覧を固定する歯の値の変更か、版管理の差分で数える・決定的）、その 1 件で、その変更の理由を台帳に記帳し、実在の段の欄の変更に判断の記録を要する改訂（案 b への乗り換えを含む）を持ち主に問う。
    (3) 黙る範囲が見えない。場所が憲法の schema 節の機構の段の規則か 6 本の条の機構の欄か憲法の面（天井の所見の場所は文書に限る）で、理由が「床の合格が機構の無い条まで覆うと読める」「機構の無い条が folio check の出力か面から読み取れない」「名札が動いていると読める」のどれかの所見が、止めるなら 1 件、直すなら窓の中の別の周で 2 件立ったら、案 e（要約の行に数を足す）か面の名札の字を改める便か、案 b へ改めるかを持ち主に問う。
    (4) 前文の平易文。場所が前文の平易文（precedence.plain）で、理由が「網羅より揃いの義務を落とした・足した」（規則の表の行 R-10 の忠実さ）か「網羅と揃いの違いが読み分けられない」なら、その 1 件で決定 (2) を捨て、前の字か所見の提案の字へ改める改訂を持ち主に問う。
    (5) 便が運べない。決定 (3) の便が、発効から 14 日以内に着地しないか、同じ種類の失敗が規則の表の行 R-7 の回数を超えたら、決定 (1) の ② の「folio check の出力」を外す改訂（表に出す所を面だけにする）か案 b かを持ち主に問う（P-11.1）。面の名札の便が同じ条件に当たったときも同じ形で問う。
    (6) 数えられない回。周の束が読めない・所見の欄が壊れているなどで (1)〜(4) を数えられなかった回が行 R-7 の回数を超えたら、本判断の撤退条件の判定を「まだ分からない」に落として持ち主へ渡す（P-4.2・P-11.1）。

