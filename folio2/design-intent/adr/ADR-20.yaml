decision: |
  (0) 本判断の目的関数は判断の記録 ADR-13 の決定 (0) のまま（精度・手戻り・実時間の順）とする。本判断は周の数を減らしも増やしもしない（文脈 (4)・(7)）。
  決めるのは、判断の記録 ADR-18 の決定 (1) と (2) の食い違いの解き方と、それに揃える字である。

  (1) **判断の記録 ADR-18 の決定 (2) の辺の断りを狭める（改訂の欄 narrow）。** 決定 (2) の末尾の文「辺を足すだけの変更を引き金に数えないこと（同 決定 (8)）は変えない。」は、
  本判断の発効の後、次のとおりに読む。「辺を足すだけの変更を引き金に数えないこと（同 決定 (8)）は、規範の欄に入らない辺の欄（憲法の条の関係の欄・規則の表の行の参照の欄・
  要件書の根拠と目的と規則と判断の記録の欄・判断の記録の根拠と帰結の欄）に限って残す。受入基準の確かめる要件（verifies）・要件と非機能要件の確かめ方の中の受入基準（verify.ac）・
  規則の表の行の条（article）は、索引では辺の欄だが、(1) ③ ④ の規範の欄に入るので、そこへ id を足すだけの変更も引き金に数える。」
  決定 (1) ③ ④ と、3 つの欄を持つ引き金の一覧の定数は変えない（今の実装はこの読みのとおりに動いている・文脈 (3) (6)）。

  (2) **判断の記録 ADR-18 の決定 (1) ① に、憲法の前文と schema 節を足す（改訂の欄 widen）。** 決定 (1) ① は、本判断の発効の後、
  「① 憲法の条文（条 A-2.2 が名指す 5 欄 = id・見出し・段・縛る相手・規範文）と、条 A-2 の改訂の範囲に在る前文と憲法の schema 節（凍結 anchor の写しの取り方と同じ・前文と schema 節は丸ごと）」と読む。
  引き金の一覧の型付きの定数（crates/folio/src/ceiling.rs）の憲法の写しの範囲を、条文だけから改訂の範囲（schema・precedence・articles）へ広げ、
  引き金の要約値の関数（gate.rs の trigger_digest）が憲法をその範囲で写す（凍結 anchor の写しの関数を同じ範囲で通す）。天井の正本の生成区間の引き金の一覧の写しも同じ便で 1 行変わる。
  前文と schema 節は、平易文や注の字を含めて丸ごと改訂の範囲に在るので、その字の変更はどれも引き金の側に入る（決定 (2) の引き金の外には入らない）。
  これで、ADR-18 決定 (1) の「一覧の正本は実装の型付きの定数に置く」と ① の中身が 1 対 1 になる。今までは、前文と schema 節の変更は条 A-2 の改訂として発効した判断の記録の改訂の欄を必ず伴い、
  その欄（決定 (1) ②）が引き金を動かしていた（過去 2 区間のうち 2）。本判断の後は、その結び付きに依らずに引き金が直接数える。

  (3) **引き金の式のうち変えるのは、憲法の写しの範囲だけである。** 3 つの辺の欄を持つ定数・判断の記録と要件書と規則の表と天井の正本の写し・門の判定の式・印の欄は変えない。
  定数が変わると引き金の要約値の値が変わるが、本判断の発効そのもの（判断の記録の状態の欄）が既に引き金を動かすので、発効の後に本流で周が 1 本要ることは定数を変えても変えなくても同じである。

  (4) **引き金の漏れの数え方（天井の 30 周目 整合 F-7）。** 判断の記録 ADR-13 の撤退条件 (6) は、字のまま自分の数えで数える（効力は変えない）。
  ADR-18 の撤退条件 (1)・(3) も字のまま数える。同じ件が ADR-13 の (6) と ADR-18 の (1) の両方に当たるときは、両方に数える（閾値と戻し先はそれぞれの字のとおり）。
  ADR-13 の撤退条件 (3)（辺だけの変更に由来する 止める を数える）も字のまま数える。決定 (1) の後は、3 つの欄の変更は引き金に入るので、(3) に当たる件は規範の欄に入らない辺の欄から生まれる。
  撤退条件の字は変えず、ADR-13 の注で断る。

  (5) **発効した決定の本文は書き換えない。字を揃える（発効の後に席が書く・便 1 本）。**
  ① 判断の記録 ADR-18 の決定 (1) ① と (2) の本文、判断の記録 ADR-13 の決定 (8) の本文は書き換えない。範囲の改訂は本判断の改訂の欄が持ち（欄の決まりのとおり改訂する側の片側だけ）、
  ADR-18 と ADR-13 の注にそれぞれ 1 段で、本判断の決定 (1) (2) の読みと改訂の欄の在り処を断る（一括 17 の問 8 の説明・判断の記録 ADR-17 が ADR-12 の決定を書き換えず注で断った先例に揃える）。
  ADR-18 の改訂の欄の ADR-13 決定 (8) の要約の括弧「（辺を足すだけの変更を数えないことは変えない）」は、一括 17 の問 8 の推奨の字どおり
  「（辺を足すだけの変更を数えないことは、規範の欄に入らない辺の欄に限って残す・判断の記録 ADR-20）」へ改める。
  ② 語彙の「周の引き金」の末尾の文。
  ③ 要件 FR20 の注に 1 文（要件書の版上げ・規範文と番号は不変・条 P-7）。
  ④ 平易文 2 か所: 判断の記録 ADR-18 の平易文と要件 FR20 の平易文が規範の欄を並べる「憲法の条文」に「前文と schema 節」を足す。決定 (2) の後は前文と schema 節が型付きの一覧の中身なので、一覧の中身を言い換える平易文にも出す。
  これで、一括 17 の仕分け（docs/design/batch17-triage.md）の「問どうしの依存」の行「問 2・問 3 と問 8」が「平易文の「憲法の条文」に前文と schema 節を足すかは ADR-20 の起草で一緒に決める」と本判断へ持ち越した件を、「足す」で閉じる。
  ⑤ 便 1 本: 決定 (2) の定数と関数、索引の欄の決まりの注（graph.yaml の edge_fields_note）と天井の正本の引き金の注（ceiling.yaml の trigger_note）の生成区間の字、
  天井の正本の写しと凍結の写しと歯を直す。便の着地までは、門は本流の印の古さ（引き金の要約値の欄が無い）で まだ分からない を返すので、その便を器へ出す道は承認要求（docs/design/adr-20.md）の問 2 で持ち主に問う。

  (6) 憲法の条文は 1 字も改訂しない。条文の改訂が要ると分かったら、その時点で本判断を止めて条 A-2 の手順へ移す。

options:
  - id: a
    name: 決定 (2) の辺の断りを規範の欄に入らない辺に狭め、前文と schema 節は定数に足さず判断の記録の改訂の欄を通して数える
    text: |
      起草の時点の推奨。辺の扱いは案 d と同じ。前文と schema 節は、条 A-2 の改訂が必ず伴う発効した判断の記録の改訂の欄（決定 (1) ②）で数え、引き金の一覧の定数は変えない。
    verdict: rejected
    reason: |
      ADR-18 決定 (1) の中に「一覧の正本は実装の型付きの定数に置く」と「前文と schema 節は定数に入れない」を並べることになり、整合の審査役が次に拾いうる新しい食い違いを生む。
      一括 17 の問 8 のコストの欄が持ち主に見せた推奨の形（前文と schema 節の引き金の定数・生成区間の写し・凍結の写し・歯の便）とも違う。
      費用の差は小さい。発効の後の本流の周は a でも d でも 1 本要り、a でも注の字の便が天井の正本の写し 20 本・凍結の写し・歯を動かす（約 29 file）。
      d の上乗せは、定数と関数の範囲と生成区間の 1 行と門の歯 6 本である（独立の検証の模擬）。
      結び付きそのもの（床が合格する本流では前文の変更に発効した判断の記録の改訂の欄が要る）は成り立つが、床を経ない取り込みや浅い写しでは破れる。
  - id: b
    name: 辺の欄を決定 (1) から外す（確かめる要件・確かめ方の中の受入基準・規則の表の行の条を引き金に数えない）
    text: |
      一括 17 の問 8 の代替の向き。決定 (2) と語彙と索引の注はそのまま残し、決定 (1) ③ ④ と引き金の一覧の定数から 3 つの欄を外す。
    verdict: rejected
    reason: |
      どの受入基準がどの要件を確かめるかと、規則の行がどの条を縛るかの変更を、周で読まずに通すことになり、精度を最優先にする方針（ADR-18 決定 (0)）に反する。
      引き金の一覧の定数・天井の正本の生成区間・凍結の写し・歯を直す実装の便が 1 本要る。
      過去 29 区間では 3 つの辺の欄だけが動いた区間が 0 なので、この案で減る周も 0 である。費用だけがあって利益が無い。
  - id: c
    name: 辺の例外を全部外す（どの辺の欄に id を足しても周を回す）
    text: |
      決定 (2) の辺の断りを消し、根拠・参照・関係・目的・規則・判断の記録・帰結の辺の欄も引き金の一覧に足す。
    verdict: rejected
    reason: |
      判断の記録 ADR-13 の決定 (8) は、持ち主の目的関数の裁定の ④（辺を完全にする作業が天井を高い頻度で走らせる種になるなら微妙・2026-09-22）への答えとして辺の例外を置いた。
      辺の後付け（書き写し）の便は根拠や参照の欄に id を足すだけの便で、この案ではその便のたびに周が要る。過去 29 区間では追加の周は 0 だったが、それは辺の後付けが
      ほかの規範の欄の変更と同じ区間に入っていたからで、今後もそうなる保証は無い。引き金の一覧の定数を足す実装の便も要る。
      根拠や参照の欄は規範の欄の結び付きを説明する線で、規範そのものではないので、次の引き金の周が読めば足りる（ADR-18 決定 (2) の考え方）。
  - id: d
    name: 決定 (2) の辺の断りを規範の欄に入らない辺に狭め、前文と schema 節を引き金の一覧の型付きの定数に足す（決定の本文は書き換えず改訂の欄と注で断る）
    text: |
      決定 (1)〜(5) の形。実装がすでに従っている決定 (1) ③ ④ の側を正とし、決定 (2) と語彙と索引の注の断りを狭める。
      前文と schema 節は、引き金の要約値の関数が憲法を写す範囲を改訂の範囲へ広げて直接数える。ADR-18 と ADR-13 の決定の本文は書き換えない。
    verdict: adopted
    reason: |
      持ち主が一括 17 の問 8 で承認した向きと、そのコストの欄が見せた形（前文と schema 節の引き金の定数の便）そのものである。
      どの受入基準がどの要件を確かめるか・規則の行がどの条を縛るかは完成の物差しと規則の縛る先そのもので、読まずに通すと精度が落ちる（ADR-18 決定 (0)）。
      前文と schema 節を定数に入れるので、ADR-18 決定 (1) の「一覧の正本は定数」と ① の中身が 1 対 1 になり、床を経ない取り込みでも引き金が直接数える。
      過去 29 区間に当てると周の数は変わらない（3 つの辺の欄だけが動いた区間 0・前文が動いた 2 区間は案 a の結び付きでも引き金になっていた）。
      定数を変える費用は、注の字の便（案 a でも要る）への小さな上乗せで、発効の後の周は案 a でも同じく 1 本要る。
  - id: e
    name: 決定の字を変えず、注で「(1) が (2) に優先する」と断る
    text: |
      判断の記録 ADR-18 の決定 (1) と (2) の本文は変えず、注に優先の順を書く。改訂の欄も語彙も索引の注も変えない。
    verdict: rejected
    reason: |
      決定の範囲を変える判断を注で済ませるのは、判断の記録の欄の決まり（別の判断の改訂の欄で変える形）に合わない（一括 17 の問 8 が退けた向き）。
      語彙と索引の注の「辺を足すだけの変更は引き金にならない」も残るので、読み手は 3 か所で逆の答えを読む。
      31 周目の反証は「後の決定が前を上書きする形になっていない」ことを解けない理由に挙げており、注だけではその形にならない。
  - id: f
    name: 案 d の中身で、ADR-18 の決定 (1) ① と (2) の本文そのものを書き換える
    text: |
      起草の時点の推奨に在った形。本判断の改訂の欄に加えて、ADR-18 の決定の本文の該当の文を新しい読みの字へ書き換え、注に改訂の記録を足す。
    verdict: rejected
    reason: |
      一括 17 の問 8 で持ち主が承認した説明（発効した ADR-18 の決定の字は書き換えない・判断の記録の欄の決まりは、発効した判断の決定の範囲を別の判断の改訂の欄で変える形だけを持つ）と逆である。
      同じ日の先例（判断の記録 ADR-17 は ADR-12 の決定と改訂の欄に残る古い字を、当時の決定の記録なので書き換えず注で断った）とも違う。
      書き換える理由（本文の 2 文を次の周が拾う）は、同じ趣旨の字を持つ ADR-13 決定 (8) を書き換えない扱いと両立しない。
      改訂の欄の狭める向き（narrow）で「後の決定が前を上書きする形」になれば解ける見込みの方が、31 周目の反証の読みに近い（確率的な審査なので保証ではない）。

basis: [P-3, P-4, P-5, P-6, P-7, P-8, P-11, P-13, P-15, A-2, N-2, N-4, R-7, R-8, D-12, D-14, FR14, FR19, FR20, AC18, ADR-2, ADR-12, ADR-13, ADR-17, ADR-18, ADR-19]

revises:
  - {target: ADR-18, decision: (1), kind: widen, summary: 規範の欄の ① に、条 A-2 の改訂の範囲に在る憲法の前文と schema 節を足す（引き金の一覧の型付きの定数の憲法の写しの範囲を条文から改訂の範囲へ広げる・便 1 本）}
  - {target: ADR-18, decision: (2), kind: narrow, summary: 引き金の外に置く辺の断りを、規範の欄に入らない辺の欄（関係・参照・根拠・目的・規則・判断の記録・帰結）に限る（受入基準の確かめる要件・要件の確かめ方の中の受入基準・規則の表の行の条は引き金に数える）}
  - {target: ADR-13, decision: (8), kind: widen, summary: 辺を足すだけの変更を周の引き金に数えない断りを規範の欄に入らない辺の欄に限り、確かめる要件・確かめ方の中の受入基準・規則の表の行の条へ id を足す変更を引き金に入れる（引き金そのものは ADR-18 が規範の欄の要約値に狭めたまま）}

consequences:
  - 周の回数は変わらない。過去 29 区間に当てると、確かめる要件・確かめ方の中の受入基準・規則の表の行の条だけが動いた区間は 0 で、前文が動いた 2 区間は 2 つとも判断の記録の発効と同じ区間だった（独立の検証が別の道で一致）。本判断は周を減らす判断でも増やす判断でもない。
  - 本判断の発効（判断の記録の状態の欄）と、便による引き金の一覧の定数の変更は、どちらも引き金の要約値を動かす。発効と便の後に本流で周が 1 本要る（どの判断の記録の発効も同じで、定数を変えない形でも同じく 1 本要る）。
  - 今後、受入基準の確かめる要件や要件の確かめ方の中の受入基準や規則の表の行の条だけを直す便・一括は、ほかの規範の欄を動かさなくても周を呼ぶ。字の上でもこれが正になる（今までも実装はそう動いていた）。
  - 前文と schema 節だけを直す変更も、引き金の一覧が直接数える。今までは発効した判断の記録の改訂の欄との結び付き（床が求める）で間接に引き金になっていた。
  - 判断の記録 ADR-18 と ADR-13 の決定の本文は変わらない。読み方は本判断の改訂の欄と、両者の注の 1 段が持つ。ADR-18 の改訂の欄の ADR-13 決定 (8) の要約の括弧だけが一括 17 の問 8 の字どおりに変わる。
  - 便が 1 本要る（M・約 29 file = 索引の欄の決まりと天井の正本の生成区間・graph.rs と ceiling.rs と gate.rs・天井の正本の写し 20 本・生成区間の byte 数と要約値の歯の定数・節点の要約値の凍結の写し・門の歯と印の fixture）。便の着地までは、索引の注に「この欄に id を足すだけの変更は周の引き金にならない」の古い字が残る。
  - 便の着地の前に本流で周を回すと、索引の注の古い字で同じ型の 止める が立つ見込みが高い（30・31 周目の F-1 はこの注を食い違いの側に引いた）。便の着地の前は門が まだ分からない を返すので、便を器へ出す道を持ち主に問う（承認要求の問 2）。
  - 要件書の版が 1 つ上がる（要件 FR20 の注に 1 文・平易文に前文と schema 節・判断の記録の欄に ADR-20）。規範文と番号は変わらない（条 P-7）。
  - 判断の記録 ADR-13 の撤退条件 (6) と ADR-18 の撤退条件 (1)・(3) は、どれも字のまま数える。同じ件が 2 つに当たれば両方に数える。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 の notes に記帳する。数える期間は、決定 (5) ⑤ の便の着地の時刻から 14 日とする（(1) だけは期間を切らない）。
    数えの道具（~/.local/share/folio2/handoff-2026-09-24/adr20-scripts/ の intervals.py）は、周の base ごとに設計文書を版管理から写して folio ceiling --stamp を撃ち、印の trigger の行に前文と schema 節の要約を足して比べる（--stamp に渡す束はどの周の束でもよい・周は名と sha を足して撃つ）。決定的に再実行できる。
    道具の置き場は版管理の外に在る（判断の記録 ADR-13 の数えの道具と同じ）。置き場の端末を移るときは、この置き場を写してから数える。
    (1) 前文と schema 節が引き金を動かさない: 便の着地の後の周の base の区間のうち、憲法の前文か schema 節（凍結 anchor の写しの範囲）が動いたのに、
    引き金の要約値（その base で folio ceiling --stamp が出す印の trigger の行）が動かない区間を数える。撃つのは便の着地の後に組み直した道具である（組み直さずに撃つと偽の 1 件が出るが、まだ分からない へ落ちるので安全側に倒れる）。1 件で本判断の撤退条件の判定を「まだ分からない」に落とし、
    その区間を添えて持ち主へ渡す（定数か関数の誤り・条 P-4.2）。
    (2) 辺の欄の引き金が周を呼ぶだけ: 引き金の要約値の違いが、確かめる要件・確かめ方の中の受入基準・規則の表の行の条の 3 つの欄だけに由来した周（intervals.py の「辺だけ」の区間の後の周）を数える。
    期間の中で 2 周になり、そのどちらの周でも 3 つの欄の変更に根拠の字を持つ 止める が反証で支持されなかったら、3 つの欄を引き金から外す形（案 b）を持ち主に問う。
    (3) 食い違いが残る: 決定 (5) の字の揃え（便の着地を含む）が終わった後の周で、辺の欄と引き金の扱い、または前文と schema 節の引き金の扱いについて、
    文書どうしの整合の 止める が反証で支持されたら数える。1 件で本判断の字の揃えが失敗したとみなし、その周の所見を添えて持ち主へ問う（決定の本文を書き換える案 f を含めて）。
    (4) 数えられない回が数値の表の行 R-7 の回数を超えたら、本判断の撤退条件の判定を「まだ分からない」に落として持ち主へ渡す（条 P-4.2・P-11.1）。

