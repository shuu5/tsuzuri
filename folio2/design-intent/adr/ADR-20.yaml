id: ADR-20
title: 周の引き金から外す辺の欄を、規範の欄に入らない辺に限り、憲法の前文と schema 節を引き金の型付きの定数に足す — 判断の記録 ADR-18 の決定 (1) と (2) の食い違いを解く

status: accepted
date: 2026-09-24

plain: |
  AI が意味を読む検査（天井）の 1 周をいつ回すかの決まり（判断の記録 ADR-18）の中に、互いに食い違う 2 つの文がありました。
  1 つ目の文は、受入基準が「どの要件を確かめるか」、要件が「どの受入基準で確かめるか」、規則の表の行が「どの条を縛るか」を、周を回すきっかけになる大事な欄（規範の欄）に数えます。
  2 つ目の文は、「文書どうしのつながり（辺）を足すだけの変更では周を回さない」と言います。
  ところが、この 3 つの欄は、設計文書の索引ではつながりの欄として扱われています。だから同じ変更が、1 つ目の文では周を回し、2 つ目の文では回さないことになっていました。
  機械（天井の門）は、すでに 1 つ目の文のとおりに動いています。天井の 30 周目と 31 周目が、続けてこの食い違いで止まりました。
  この判断では、1 つ目の文を正しい側とし、2 つ目の文の断りを狭めます。
  この 3 つの欄を書き換えたら周を回します。ほかのつながりの欄（根拠・参照・条どうしの関係など）に番号を足すだけなら、今までどおり周を回しません。
  どの受入基準がどの要件を確かめるかは、「何ができたら完成か」の中身そのものなので、読まずに通すと正しさが落ちるからです。
  あわせて、憲法の前文（条どうしが衝突したときの順位）と憲法の決まりの節も、周のきっかけの一覧に入れます。
  この 2 つは条文と同じく、書き換えると憲法の改訂になります。いまは一覧に無く、改訂には判断の記録の発効が必ず伴うので、その発効をきっかけに間接に周が回っていました（過去の 2 回は、ほかの規範の欄の変更も同じ間に在ったので周が回りました）。
  これを一覧に書いて、機械が直接数えるようにします。機械を直す便が 1 本要り、生成される注の字もその便で直します。
  ADR-18 の決定の文そのものは書き換えません。発効した判断の記録なので、この判断の「改訂の欄」と、ADR-18 の注の 1 段で断ります（今までの判断の記録と同じやり方です）。
  正直に言うと、過去 29 回の周と周の間に当てると、この判断で回す周の数は 1 つも変わりません。
  この 3 つの欄だけが変わった間は一度も無く、前文が変わった 2 回はどちらも判断の記録の発効と一緒でした。
  この判断は周を減らしも増やしもせず、文書の中の食い違いを消して、次の周が同じ所で止まらないようにするものです。
  機械を直す便は、門（設計文書の便を受け付けるかを決める所）が「まだ分からない」と言っている間に出すことになるので、出してよいかを別の問いであなたに聞きます。

context: |
