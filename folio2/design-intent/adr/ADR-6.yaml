# folio2 判断の記録 ADR-6 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。人が読む面は folio face --face adr（生成物・手で直さない）。
# 状態: accepted（発効 2026-09-18・持ち主の承認は approval 欄・裁定 id = f2-648.31 notes 2026-09-18）。条文の改訂ではない（amends は空）。
# 位置: f2-648.31。元になった持ち主の裁定 = 2026-09-18 の 3 つの問い（置き場・質問 5 つ・支度表の形）への回答（台帳 f2-648 notes に逐語「承認するし質問も全て推奨で承認する」）。
id: ADR-6
title: 相談窓口（intake）は、質問と写像表を持つ新しい正本（intake.yaml）から 5 つの はい／いいえ の質問を対話面の散文で出し、支度表を YAML 1 枚として書き、人が読む面は入口の面の節として出す
status: accepted
date: 2026-09-18
context: 要件書 FR1 は、持ち主が相談窓口（intake）を実行したとき 5 問以下の易しい質問を推奨回答つきで出し、回答から文書の集合を写像して支度表 1 枚を生成することを求める。FR2 は回答が無くても推奨回答で進み「推奨で進めた項目」を支度表の別枠に出すことを、FR8 は途中で足すときに差分だけを問うことを、AC1 は固定の回答 5 つの fixture と期待の支度表の一致を求める。rules 行 D-10 は、質問と推奨回答を対話面（rules 行 R-8）の散文で出し選択式の窓を使わないことを定める。planner 席が 2026-09-18 に確かめた事実は次のとおり。(1) 質問の文・推奨回答・回答から文書の集合への写像表は、設計文書のどこにも無い（要件書 FR1 の注は「写像表は rules 側か付録側に置く」と言うだけで、型も置き場も決めていない）。(2) 入口の正本（index.yaml）の棚は文書の型を 4 つ（憲法・要件書・設計ノート・判断の記録）と付録 2 つ（語彙・rules・どちらも憲法の中）に閉じている。(3) 3 面（入口・憲法・要件書）は生成器の出力だけになり、持ち主の承認（AC5）も済んだので、面の型を増やす便は判断の記録 ADR-5 の撤退条件（面の型が増えるときはテンプレートの案へ移るかを問う）に触れる。(4) 支度表は管理下の対象（憲法 N-1）であり、認証なしの公開ネットに晒さない対象（N-6.2）である。分岐は 3 つ在り、どれも後の便の契約と受入を決めるので、便を起こす前に持ち主に問うた（2026-09-18・台帳 f2-648 notes）。
decision: 相談窓口（intake）の形を次のとおり定める。(1) 置き場 = 質問・推奨回答・回答から文書の集合への写像表・支度表の欄の決まりは、新しい正本（intake.yaml・設計文書の置き場の直下・入口の正本と同じく 1 文書 1 file・P-6.1）に置く。床（folio check）が見る正本を 5 file から 6 file へ広げる変更は別の便で運び、凍結 fixture の期待は変えない（判断の記録 ADR-5 決定 (2) と同じ運び方）。(2) 質問 = 5 つで、どれも はい／いいえ で答え、推奨回答はどれも はい。① 何があっても守る線を決めておくか（はい → 憲法・付録の語彙と rules を含む）② 「できた」の線を先に書くか（はい → 要件書）③ 戻せない判断を 1 本ずつ残すか（はい → 判断の記録・最初は 0 本の棚）④ 作り方（設計ノート）は実装の直前に書くでよいか（はい → 「まだ無い」の棚に置く）⑤ 憲法を AI の手元へ写すか（はい → CLAUDE.md の生成区間への注入）。回答から文書の集合への写像は相談窓口の正本（intake.yaml）の各質問の行が持ち、写像の行き先は入口の棚の文書の id と注入の 5 つに閉じる。(3) 支度表 = 正本は YAML 1 枚（持つ文書・推奨で進めた項目の別枠・承認欄）で、設計文書の置き場に置く。人が読む面は 4 面目を足さず、入口の面に「支度表」の節として出す（面の型は 3 のまま・判断の記録 ADR-5 の撤退条件に触れない）。(4) 回答の受け方 = 命令は質問と推奨回答を対話面の散文として標準出力へ書き（rules 行 D-10・選択式の窓を使わない）、回答は旗（answers）で渡す YAML の file から読む。file が無ければ全項目を推奨回答で進め、その全項目を支度表の別枠に出す（FR2）。既に支度表が在るときは、答え済みの項目を問わず差分だけを問う（FR8）。(5) 順序 = 本判断の発効 → intake.yaml を床に入れる便 → 命令の便（AC1 の fixture を凍結 anchor として置く）→ 入口の面に支度表の節を足す便 → 気づかせる 1 行（FR3）の便。便は直列で運ぶ。
options:
  - {id: a, name: 新しい正本に質問と写像表を置き、支度表は YAML 1 枚と入口の面の節で出す, text: 質問・推奨回答・写像表・支度表の欄の決まりを相談窓口の正本（intake.yaml）に置く。支度表は YAML 1 枚を正本とし、人が読む面は入口の面の節として出す。回答は対話面の散文で問い、旗（answers）の file で受ける。, verdict: adopted, reason: 質問文は rules 行の型（閾値と作法の行）に合わず、1 文書 1 file（P-6.1）で入口の正本と同じ形に揃う。支度表を YAML にすれば管理下の対象として床で数えられ、入口の面の節にすれば面の型が増えず ADR-5 の撤退条件に触れない。対話面の散文で問う形は rules 行 D-10 のとおり。持ち主の裁定 2026-09-18（推奨をすべて承認）。}
  - {id: b, name: 写像表を rules の正本（rules.yaml）の付録の節に置く, text: 要件書 FR1 の注のとおり、回答から文書の集合への写像表を rules の正本（rules.yaml）の付録の節に置き、質問文は命令の中に固定で持つ。, verdict: rejected, reason: rules 行は閾値と作法の表で、行の追加と変更に裁定 id と時刻を要する（P-17）。質問文を命令の中に固定で持つと文が型付きデータの外に隠れ（P-5.1）、直すたびに便が要る。}
  - {id: c, name: 支度表を 4 面目の HTML として生成する, text: 支度表を入口・憲法・要件書と並ぶ 4 面目のページとして生成器に足す。, verdict: rejected, reason: 面の型が 3 から 4 に増え、判断の記録 ADR-5 の撤退条件（面の型が増える便を設計するときはテンプレートの案へ移るかを問う）に触れる。支度表は 1 枚の短い表で、入口の面の節で足りる。}
  - {id: d, name: 質問を選択式の窓で問う, text: 命令が質問を選択式の問いの窓として出し、持ち主が窓で選ぶ。, verdict: rejected, reason: rules 行 D-10 が、相談窓口の質問と推奨回答を対話面の散文で出し選択式の窓を使わないと定める。}
basis: [P-1, P-4, P-5, P-6, P-12, N-1, N-6, D-10, R-8, FR1, FR2, FR3, FR8, AC1, ADR-5]
retreat: {kind: ruling, condition: 決定 (2) の質問 5 つと写像の行き先を捨てて質問と行き先を組み直すかを持ち主に問う。問うのは orchestrator 席（2026-09-19 までの名は planner 席）で、時機は次の 2 つ。① 入口の棚（index.yaml の shelf.documents）の文書の型が 4 つから増える便を設計するとき（設計ノートはもともとこの 4 つの中に在るので、2026-09-20 時点で増やす候補は無い）。② 持ち主が支度表の承認を 2 回続けて拒み、その理由が質問の文か行き先にあるとき（rules 行 R-7 の上限と同じ数え方）。決定 (3)（入口の面の節）は、支度表の欄が増えて入口の面の節に収まらなくなったとき、面を 1 つ足すかを ADR-5 の撤退条件と一緒に問う。}
amends: []
approval: {who: 持ち主, date: 2026-09-18, ruling: f2-648.31 notes 2026-09-18 11:4x JST（発効の承認）・f2-648 notes 2026-09-18（元になった 3 つの問いへの回答の逐語「承認するし質問も全て推奨で承認する」）, verbatim: 承認する, surface: R-8}
plain: 「どの文書が要るか」を AI と決める相談窓口の形を決める記録です。質問は 5 つだけで、どれも はい／いいえ で答え、どれにも「おすすめ（はい）」がついています。答えなくても止まらず、おすすめで決めた所は支度表の別枠に出ます。質問と「答えるとどの文書が要ることになるか」の対応は、新しい元の文書 1 つ（intake.yaml）に書きます。結果の支度表は機械が読める表 1 枚で、人が読むときは入口のページの中に「支度表」の節として出ます（ページの種類は 3 つのまま増やしません）。質問は文章で出し、答えは file で渡します。あとから文書を足すときは、答え済みの質問は聞き直しません。文書の種類が今の 4 つから増えるとき、またはあなたが支度表の OK を 2 回続けて出さず、その理由が質問の文か行き先にあるときは、質問 5 つと行き先を組み直すかをあなたに問います。
consequences:
  - 相談窓口の正本（intake.yaml）を足す便では、床が見る正本を 6 file へ広げる。凍結 fixture（134 case）の期待は変えず、欄の決まりは正本の schema 節に置く（P-5.1）。語彙に足す語が出れば同じ便で足す（R-9）。
  - 命令の便は、固定の回答 5 つの fixture（AC1 の red_test が名指す tests/fixtures/intake/answers-5.yaml）と期待の支度表を生成側から独立した凍結 anchor として置く（P-10.1）。
  - 入口の面に支度表の節を足す便は、部品目録に無い部品を足さず（AC2）、支度表が無いときは節を「まだ無い」の形で出す（P-4.2）。
  - 支度表は管理下の対象（N-1）で、配信の外（N-6.2）。取り消せない削除をしない（退役は可逆な移動で行う・N-1）。
  - 本判断は条文を改訂しないので A-2.3 の対象外。発効の承認は持ち主から planner 席の対話面（R-8）で取り、承認欄と台帳に逐語で記帳する。
note: 元になった持ち主の回答の逐語は台帳 f2-648 notes 2026-09-18（3 つの問いへの回答「承認するし質問も全て推奨で承認する」）。質問の文と写像の下書きは intake.yaml v0.1（同じ PR）。平易文の直し（2026-09-20・天井の 8 周目と平易文の総点検〔全数の突き合わせ〕・持ち主の裁定 2026-09-20 17:21 JST〔f2-648 notes・逐語「承認する」〕）= 撤退条件を平易文に足した。帰結の「折り返し可能な削除をしない」は「取り消せない削除をしない」の書き損じとして訂正した（N-1 と同じ向き・決定の中身は不変）。実態との突き合わせの直し（2026-09-20・約束と実態の総点検と天井の 9 周目・持ち主の裁定 f2-648 notes 2026-09-21 00:00 JST〔逐語「すべて推奨で進めて」〕）= 撤退条件の席の名を今の名に、① の時機を入口の棚の欄の言い方に、面の数の名指しを数に依らない言い方に直した。問いの文の直し（2026-09-21・天井の 11 周目の文書どうしの整合の「直す」・裁定 id f2-648 notes 2026-09-21 08:59 JST〔逐語「問い１−４は推奨で進めて」・天井の 11 周目の直しの一括 5〕）= 決定 (2) の ④ は書く時機（実装の直前に書くか）を尋ねる形だったが、答えが決めるのは設計ノートを持つか持たないかなので、正本（intake.yaml）の問い q4 の文を、ほかの 4 問と同じ「持つか持たないか」を尋ねる形に揃えた。書く時機は同じ文の括弧に残す。写像の行き先（はい → 設計ノート）と決定の文は変えない。決定 (2) ④ の字（書く時機を尋ねる形）と正本の問い q4 の字（持つかを尋ねる形）の違いはこの注が持ち、決定の字は変えない。
