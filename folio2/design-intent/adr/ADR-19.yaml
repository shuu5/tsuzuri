id: ADR-19
title: 不合格の後の往復は、直しの一括の枝の上で周を回し直して閉じ、4 観点とも合格した枝だけを 1 回の承認で持ち主へ出す — 周の中身と読む字は変えず、往復ごとの承認待ちだけを減らす

status: accepted
date: 2026-09-24

plain: |
  AI が意味を読む検査（天井）の 1 周が不合格になったあとの、直して回し直す往復の運び方を変えます。
  いまは、不合格の周ごとに、席が直しをまとめ（一括）、あなたの承認を待ち、本流に入れてから次の周を回します。
  次の周がまた不合格なら、もう一度直して、もう一度あなたの承認を待ちます。
  この判断では、直しの一括を作ったら、あなたに出す前に、その一括の作業の枝の上で次の周を回します。
  不合格なら、止める理由になった所見のそれぞれに直しを足して、また回します（直さずに回し直して偶然の合格を待つことはしません）。
  4 観点とも合格したら、その枝をまとめて 1 回だけあなたに出します。
  枝が開いている間は、本流の設計文書を書き換える便を通しません。その間に本流の規範の字が動いたら、枝を載せ替えて周を回し直します。
  2026-09-22 にあなたが決めた「印が古くても設計文書の便を門を経ずに出す」は、天井の門の判定の式を改める便（ADR-18 の便ア）が着地した時点で置き換わります（それまでは今のまま）。
  枝が開いていない間は、設計文書の便を天井の門で判定します。
  周が読む字は今と同じで全部です。合格した観点の判定を次の周へ持ち越すこともしません。
  変わるのは、往復のたびにあなたの承認を待たなくなることと、あなたが承認する字が、すでに天井に合格した字になることです。
  過去 28 周に当てると、あなたの承認はおよそ 16 回から 12 回に減ります（同じ失敗の繰り返しで 1 度も止めなければ 11 回）。
  消える承認待ちはおよそ 1.6 時間で、そこから、枝の上で直せない所見で止めてあなたに問う待ちが新しく生まれる分を引いた値です。夜の間の長い待ちの 1 回は残ります。
  周の回数そのものは減りません。
  同じ種類の失敗が規則の表の行 R-7 の回数を超えたとき、条文の改訂や判断の発効のようにあなたの選択が要るとき、消す操作が要るときは、
  枝の上の往復を止めて、今までどおりその場であなたに問います。
  この形は、承認の記帳（承認欄・版の来歴・規則の表の裁定の欄）だけの変更で天井の印が古くならないこと（判断の記録 ADR-18 の案 a）に依ります。
  ADR-18 を今のまま（1 字でも変われば印が古い）にするなら、承認を記帳した時点で枝の上の合格が古くなり、本流で回す周がまた要るので、本判断は取り下げます。
  ほかに考えた形（合格した観点を持ち越す・周の前に総点検を置く・反証で退けられた「止める」を軽くする・観点ごとに審査役を増やす）は、
  見逃しが増えるか、周が減らないか、往復がかえって増えるので採りません。

context: |
  (1) 起点。判断の記録 ADR-18（天井の周の引き金を規範の欄の変更に絞る・proposed）は、その敵対的検証で、
  周の回数を押し上げている本当の駆動は引き金ではなく「不合格の後の往復」だと実測し、注の「別に問う候補」の ① に
  「不合格の後の往復を短くする形」、② に「読みやすさの重さの基準」を置いた。本判断は ① を扱い、② を案の 1 つ（案 c）として検討する。
  目的関数は判断の記録 ADR-13 の決定 (0) のまま（① 設計文書が道標として正しいか ② 見落としてあとから直す回数 ③ 実時間の順）で、
  持ち主の方針は「精度が先・実時間を無為に使わない・字数の節約は二次」である。

  (2) 周と往復の実測（周の置き場 ~/.local/share/folio2/ceiling/<日付>-round<N>/ の 1〜28 周・数えの手順は注の【実測の出所】）。
  4 観点とも合格した周は 28 周のうち 8 周（6・14・15・18・21・23・26・28）。所見は 704 件（止める 40・直す 565・参考 99）、
  止める の反証は支持 32・退けた 8。観点ごとの合格は、忠実さ 22・読みやすさ 27・文書どうしの整合 18・実態との整合 16（28 周のうち）。
  前の周が不合格だったので回した周は 27 周のうち 20 周で、不合格の周から次の合格の周までの連鎖は 7 本である。
  不合格の周 20 本のうち 13 本は不合格の観点が 1 つだけだった（2 つが 5 本・3 つが 2 本）。
  1 周の所要（束を組んでから最後の反証が終わるまで）は中央値でおよそ 18 分（11〜36 分）。
  不合格の周の終わりから次の周の始まりまでの間隔は、20 本の合計でおよそ 59 時間、中央値でおよそ 1.3 時間で、
