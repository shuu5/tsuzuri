  決定 (4) は今の実際の運び方より厳しい制約で、その裁定を ADR-18 の便アの着地の時点で置き換える。

decision: |
  (0) 本判断の目的関数は判断の記録 ADR-13 の決定 (0) のまま（精度・手戻り・実時間の順）とする。
  本判断は周の中身を変えない＝周が読む字（材料の束）・観点・重さ・3 値・反証・門の式は、判断の記録 ADR-8・ADR-13 と要件 FR17・FR18・FR20 のままとし、
  前の周の判定を持ち越さないこと（判断の記録 ADR-13 の決定 (7)）も変えない。見つける数を減らさず、周と周の間の待ちだけを減らす。

  (1) **直しの一括は、持ち主の承認を求める前に、その一括の作業の枝の上で天井の周を回す。**
  一括とは、天井の所見の直しを 1 つの作業の枝にまとめて設計文書の正本へ入れるものをいう。周が不合格か「まだ分からない」だったとき、
  または一括が周の引き金の欄を変えるとき、席は次の順で運ぶ。一括の枝を切ってから本流へ取り込むまでを「窓」と呼ぶ。
  ① 席は直しを枝に書く。持ち主に問う項は、席の推奨の案で書く。
  ② 周の前ごとに、本流（origin/main）をその枝へ取り込み、枝の設計文書の置き場から材料の束を組む（天井の口 --write・--check・--refute は今のまま）。
  ③ 周が不合格か「まだ分からない」なら、その理由になった支持の 止める のそれぞれに直しを当てて同じ枝に足し（同じ一括のまま）、② に戻る。
  直しを当てずに回し直してよいのは、「まだ分からない」のうち実行できなかった回（起動の記録が無い・束が古い・反証が未・止める が全部退けられた再判定待ち）だけで、
  それも窓の中で 1 回までとする（2 回目は (3) の (エ) で持ち主へ出す）。合格が出るまで引き直す形にはしない。
  ④ 4 観点とも合格したら、枝の上で天井の判定の印を導出し（--stamp）、印を枝に置く。
  ⑤ 枝の上で回したすべての周の所見と直しと結果を 1 つの承認要求にまとめ、持ち主へ 1 回だけ出す（対話面 R-8）。
  1 回の承認要求に載せるのは、本流の 1 つの周から切った 1 つの一括（その枝の上で回した周を含む）だけで、本流の別の周から切った一括とは束ねない。
  ⑥ 承認の後に、席は承認の記帳（承認欄・版の来歴・規則の表の裁定の欄と裁定の時刻・台帳の notes）を同じ枝に書いて本流へ取り込み、窓を閉じる。
  ⑦ 窓の間に、本流の規範の欄の要約値（判断の記録 ADR-18 の決定 (1)）が、枝の上の最後の周の束を組んだときの値から動いたら、
  枝を本流に載せ替えて周を回し直す（再開）。動いたかは要約値の比較で機械が決め、席の読みに依らない。
  ADR-18 の便ア（引き金の要約値を印と門に入れる便）の着地までは、印の正本の全体の要約値（今の門の式）で比べる。再開は窓を閉じない。
  ⑧ 枝の上で周を回すことは、注だけの是正を承認を問わずに取り込む今の作法と衝突しない（周が読むのは枝の正本で、承認の要否は周の後に決まる）。
  持ち主に問う項を持たず、枝の本流に対する差分が規範の欄の要約値を動かさない一括（注だけの是正・条 A-2.2 により改訂に当たらない）は、
  枝の上の周の合格の後に、承認を求めず席が台帳に記帳して取り込む（今の作法のまま）。
  動かすかは ⑦ と同じ比較で決め、席が選ぶ旗は持たない（条 N-3.1）。ADR-18 の便アの着地までは、席が差分の欄を ADR-18 の規範の欄の一覧に照らして分け、その照合を台帳に記帳する。
  ⑨ 直す先が枝に書けない所見（実装の型付きの定数から導出する生成区間）は、台帳に控えとして起票した 1 件に束ね、窓を閉じた後、次の周の前に便で運ぶ（今の運用）。
  その型の支持の 止める で枝の上の周が合格できないときは、(3) の (オ) で持ち主へ出す。

  (2) **承認で字が変わったときは、本流で周を回す。** 持ち主が推奨と違う案を選んで周の引き金の欄が変わったとき、
  または ④ の印の後に本流の引き金の欄が動いたときは、門（要件 FR20 の --gate）が「まだ分からない」を返すので、
  取り込みの後に本流で周を回す（今と同じ）。承認の記帳だけで引き金の欄が動かないなら、④ の印がそのまま本流の印になる。

  (3) **枝の上の往復を止めて、その場で持ち主に問う場合。** 次のどれかに当たったら、(1) の ① 〜 ④ を続けず、そのときの枝と所見を持ち主へ出す（今の往復ごとの承認と同じ）。
  (ア) 同じ種類の失敗が、窓の中で規則の表の行 R-7 の回数を超えた（条 P-11.1）。
  ここで数える失敗は、反証で支持された 止める の所見であり、観点と場所の組で同じと見る。場所は所見の置き場の file で、
  判断の記録と設計ノートの所見は場所の頭の id が指す file とする。1 つの周の中で同じ組が複数あっても 1 と数える。
  数えは窓の中で通して行う＝枝を切るきっかけになった周を含め、続いていなくても数え、再開（(1) ⑦）でも数えを戻さない。
  (イ) 直しに、条文の改訂（条 A-2）・判断の記録の発効か廃止・持ち主の選択が要るのに席が推奨を 1 つに決められない問いが要る。
  (ウ) 直しに、消す・外へ出す・外の道具や鍵を使う操作が要る（条 A-1）。
  (エ) 直しを当てずに回し直す回が、窓の中で 2 回目になる。
  (オ) 直す先が枝に書けない支持の 止める（(1) ⑨）で、枝の上の周が合格できない。
  止めて持ち主へ出した枝は、承認の後に本流へ取り込んで窓を閉じる。次の周が不合格なら、新しい枝と新しい窓で数え直す。
  (ア)〜(オ) で止めて出す枝は 4 観点とも合格した枝ではない＝「4 観点とも合格した枝だけを承認へ出す」の例外で、承認要求にその旨と止めた理由を書く。
  判断の記録の発効（状態を提案中から発効へ）を含む承認は、それ自体が周の引き金の欄を変えるので、(1) の形でも承認の後の周は残る。

  (4) **窓の間は、本流の設計文書を書き換える便を受け付けない。** 窓の間は、門（要件 FR20 の --gate）が 通す を返しても、
  本流の設計文書の正本を書き換える便を器へ出さない（門の判定に依らない順序の規律）。
  合格の周の後に始まった窓では、本流の印が新しい合格のままで門が 通す を返すので、門だけでは判断の記録 ADR-8 の決定 (4)
  （天井が合格でない間は設計文書の便の着地を止める）の趣旨を保てないためである。実装だけの便は止めない。
  窓を開くとき、席は設計文書を書き換える便の台帳の件を器の列で保留にし、窓を閉じたら解放する
  （器は待ちの便を先行の便の着地の直後に自動で起こすので、列に在る便が窓の間に起動しうるため。席の手順で、器の仕掛けは増やさない）。
  **本判断の決定 (4) は、2026-09-22 00:0x（日本時間）の持ち主の裁定（設計文書を触る便は印が古くても門を経ずに出す）を置き換える＝窓の外では判断の記録 ADR-18 の案 a の門で判定し、
  窓の中では設計文書を書き換える便を受け付けない。2026-09-22 の裁定は ADR-18 の便ア（門の判定の式）の着地まで有効で、着地の時点で本判断の決定 (4) に置き換わる**
  （撤退条件を数える期間の起点と同じ点。門が今の式のまま設計文書の便が止まる間を作らないため）。
  枝の上の合格と印は、本流へ取り込むまで本流の完成の判定にも門の判定にも数えない（本流へ取り込むまでは本流の正本ではない・条 P-3.3）。

  (5) **型付きの行に置く。** (1)〜(4) の手順は、規則の表に開発規律の新しい行（以下「一括の行」・番号は承認の後に席が振る・種別 human-review・条 P-11）として置く
  （条 N-2.1＝散文と記憶にしか無い規則を規則として扱わない）。一括の行は、憲法の条 P-11 に加えて条 P-3（門）と条 P-12（承認）の関係の欄にも載せる。
  行 D-12 の注の「一括の運用はこの行の何を数えるかの欄が定めていない」は、その在り処を一括の行と書き直す。
  語彙に「一括」の項を足す。要件書は、要件 FR20 の注に「印は一括の枝の上で導出して、一括と一緒に本流へ取り込むことがある（ADR-18 の便アの着地の後）」の 1 文を足し、
  FR20 の規則の欄に一括の行を足すだけで、規範文は変えない。
  天井の正本は変えない。実装の便は要らない（天井の口はどれも --dir で枝の置き場を読める。門が承認の記帳を引き金の外に数える口は ADR-18 の便アが入れる）。

  (6) **判断の記録 ADR-18 の案 a に依る。** 本判断は、承認の記帳の欄が周の引き金の外に在ること（ADR-18 の決定 (1)(2)）を前提にする。
  ADR-18 を案 a で発効しないなら、承認を記帳した時点で枝の上の印が古くなり (1) ⑥ の後に必ず本流の周が要るので、本判断は発効させず取り下げる。
  ADR-18 の便アが着地するまでは、一括の行の手順は (1) ⑤ までを運び、承認の後に本流で周を回す（今と同じ）。

  (7) 憲法の条文は 1 字も改訂しない。条文の改訂が要ると分かったら、その時点で本判断を止めて条 A-2 の手順へ移す。

options:
  - id: a
    name: 不合格の観点だけを回し直し、合格した観点の判定は持ち越す（観点ごとの印）
    text: |
      不合格の周の後は、止める を出した観点だけを次の周で回す。合格した観点は、その観点の読む字が同じなら（または連鎖が終わるまで）判定を持ち越す。
      印を観点ごとに持つ。
    verdict: rejected
    reason: |
      精度を落とすうえに、周がほとんど減らない。過去の記録に当てると、連鎖の終わりまで持ち越す形では不合格の後の周が 20 から 18 に減るだけで、
      持ち越した観点が実際に出していた支持の 止める 8 件（うち 6 件は前から在った字）を、その周では拾えない（後の周で拾われうる）。
      観点の読む字が同じときだけ持ち越す形では、持ち越せる回が 51 回のうち 0 回で、節約が無い（直しの一括は、どの観点も読む要件書を必ず動かす）。
      4 観点の合格は欠陥の無いことを保証しない（支持の 止める 32 件のうち 15 件は合格の周をまたいで残っていた）ので、合格を持ち越すと偶然の合格が固まる。
      判断の記録 ADR-13 の決定 (7)（前の周の判定は持ち越さない）の改訂にもなる。観点を絞れば 1 周の AI の起動は減るが、観点は並べて回すので実時間は減らない。
  - id: b
    name: 周の前に総点検（全数の分担読み・周とは別の束）を置き、周は総点検の後だけ回す
    text: |
      前から在った字の 止める を、周の外の総点検で一度に洗う。総点検は担当の範囲を 1 件も飛ばさず全部読む点検役を並べて回し、
      その直しの一括の後に周を回す。
    verdict: rejected
    reason: |
      過去の 2 回の総点検の効きは範囲によって割れ、往復の構造は変わらない。平易文の総点検の後は、前から在った字への忠実さの支持の 止める が
      ほぼ出なくなった（9〜28 周で範囲の外の 1 件）が、約束と実態の総点検の後も実態の支持の 止める は前から在った字に 5 件残った。
      2 回の総点検の後も連鎖（7〜14 周）は 5 周続いた。総点検の直しの一括そのものが次の周の 止める を 1 件持ち込んでおり、
      その型（直しが持ち込む欠陥）は総点検では減らない。周のたびに総点検を前置すると、周ごとの手間と承認の数が増える。
      範囲を決めて 1 回だけ回す総点検（例えば一度も総点検していない文書どうしの整合）は有効でありうるので、本判断の外の候補として残す（注）。
  - id: c
    name: 反証で退けられた 止める だけの観点を合格に読み替え、読みやすさの 止める の重さの基準を絞る
    text: |
      反証で全部退けられた 止める しか持たない観点を「まだ分からない（再判定待ち）」でなく合格と読む。
      読みやすさの問いの文の 止める の基準を狭める（反証で 5 件とも退けられたため）。
    verdict: rejected
    reason: |
      周が 1 周も減らない。過去 28 周で、この読み替えで 4 観点とも合格に変わる周は 0 周である
      （該当は 10 周目の読みやすさだけで、その周は整合と実態も不合格だった）。読みやすさの 止める 5 件のうち 4 件は 1 周目で、観点の判定は合格のままだった。
      節約は反証の起動の数だけで、実時間にも精度にも効かない。読み替えは、反証の前の判断を反証の後の結論に読み替えない今の実装の形（便 41）を崩す。
      読みやすさの重さの基準は、本判断に混ぜず、天井の正本の問いの文の改訂の候補として残す（注）。
  - id: d
    name: 今のまま（不合格のたびに一括を承認してから本流で次の周を回す）
    text: |
      往復の運び方を変えない。一括の手順は型付きの行に置かず、席の作法のまま運ぶ。
    verdict: rejected
    reason: |
      持ち主の承認待ちが、連鎖の中の往復ごとに周の前に挟まる形が残る（過去の 7 連鎖では、本判断の形に比べて承認がおよそ 4〜5 回多い）。
      一括が持ち込んだ字を、持ち主が天井に掛かる前に承認する形も残る（支持の 止める 4 件）。一括の手順が型付きの行に無い状態（判断の記録 ADR-13 の注 (f)）も残る。
      周の回数は変わらず、節約は決定 (3) の止める場合を当てると小さくなる。窓の間に本流の設計文書の便を止める待ちも生まれず、
      2026-09-22 の持ち主の裁定（印が古くても設計文書の便を門を経ずに出す）もそのまま残るので、今のままを選ぶのも筋は通る。
  - id: e
    name: 直しの一括の枝の上で周を回し直して往復を閉じ、4 観点とも合格した枝だけを 1 回の承認で出す
    text: |
      決定 (1)〜(6) の形。周の中身は変えず、不合格の後の往復を承認の前の枝の上で回す。持ち主への承認要求は連鎖ごとに原則 1 回になり、
      持ち主が承認する字は天井に合格した字になる。同じ失敗の繰り返し・条文や判断の発効・消す操作が要るときは、その場で持ち主に問う。
    verdict: adopted
    reason: |
      周の中身を変えずに往復の待ちを減らせる形はこれだけである。周が読む字も観点も判定も今のままで、見つける数は減らない。
      ただし精度の損は 0 ではない。承認待ちの間に本流へ着地した実装の便を枝の上の周は読まず、実態との整合の観点がそれを読むのは次の引き金の周になる（帰結）。
      過去の 7 連鎖に決定 (3) の止める場合ごと当てると、持ち主の承認はおよそ 16 回から 12 回になり（(ア) が当たらなければ 11 回）、承認待ちはおよそ 1.6 時間から (オ) の新しい待ちを引いた分だけ消える。
      一括そのものが持ち込んだ欠陥（支持の 止める 4 件）は、持ち主の承認の前に枝の上の周で見つかる＝承認の精度が上がる。
      実装の便は要らず、手順を型付きの行に置くので、今は作法と記憶にしか無い一括の運び方が規則になる（条 N-2）。
      節約は周の回数ではなく待ちの時間と承認の回数で、連鎖が短いとき（往復 1 本）はほとんど節約が無い。
  - id: f
    name: 観点ごとに独立の審査役を複数並べ、所見の和を取る（多重読み）
    text: |
      1 周の中で、観点ごとに同じ束を独立の審査役 k 本が読み、所見の和で観点の判定を出す。1 周の見つける割合を上げ、連鎖を早く尽きさせる。
    verdict: rejected
    reason: |
      往復がかえって増える。1 本の審査役が 1 件を拾う割合を 0.17 として模型で見積ると（独立を仮定した上限側の見込み）、
      前から在る欠陥が 4 件のとき、不合格の後の周は k = 1 で平均 0.8 周、k = 3 で 1.8 周に増える（合格の周に残る欠陥は 3.2 件から 1.4 件に減る）。
      合格の意味は強くなるが、本判断の問い（往復を短くする）とは逆向きで、同じ問いの文と同じ種類の審査役の読みは独立でないので見込みは上振れしている。
      精度の側の手として、本判断の外で、今の周に影として 2 本目の審査役を並べて実測する候補に残す（注）。


