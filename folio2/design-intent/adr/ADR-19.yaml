  - 判断の記録 ADR-18 の案 a が発効しないなら、本判断は発効しない（決定 (6)）。ADR-18 の便アが着地するまでは、承認の後の本流の周が残る。
  - 判断の記録の発効を含む承認では、承認の後の周が残る（状態の欄が周の引き金に入るため）。過去の支持の 止める のうち 5 件は判断の記録の発効が持ち込んだ字だった。そこへの手は本判断の外である（注）。

