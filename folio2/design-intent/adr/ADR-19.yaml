  3 か所は判断の記録の発効を含む承認（1 周目の後・2 周目の後・24 周目の後の一括 12）で、承認の後の周も残る。
  1 か所は同じ種類の失敗（実態との整合・要件書）で、7・9・10 周目に出て 10 周目で行 R-7 の 2 回を超える（決定 (3) (ア) の数え方）。
