  - 持ち主が承認する字は、枝の上で 4 観点とも合格した字になる。過去には、一括が持ち込んだ字に立った支持の 止める が 4 件あり、持ち主はそれらを天井に掛かる前に承認していた。その型は承認の前に枝の上で見つかる。
  - 持ち主が往復の途中の所見と直しを見るのは、連鎖の終わりの 1 回の承認要求の中になる。承認要求には枝の上で回したすべての周の所見と直しと結果を載せる。途中で方向を変えたいときに間に合わない形になるので、決定 (3) の止める場合と撤退条件 (1) で数える。
  - 1 回の承認要求に入る直しの数は、往復が長い連鎖ほど多くなる。1 つの窓の中の積み上がりの歯止めは、決定 (3) の (ア)（同じ失敗の繰り返し）と (エ)（直しを当てない回し直しの 2 回目）だけである。決定 (1) ⑤ は並行する窓どうしを束ねないだけで、1 つの窓の大きさは縛らない（過去の最長の連鎖 7 周も 1 つの窓になる）。持ち主が読み切れたかは機械で数えられない。
  - 窓の間は、本流の設計文書を書き換える便を門の判定に依らず止め、器の列の便も保留にする（決定 (4)）。今は 2026-09-22 の持ち主の裁定により印が古くても設計文書の便を門を経ずに出しているので、決定 (4) は今の実際の運び方より厳しく、窓の間はその便が窓を閉じるまで待つ。過去には合格の周の後の間に設計文書の便が 14 本着地しており（うち 10 本は 23 周目と 24 周目の間）、その流れが窓の間は止まる。実装だけの便は止まらない。
  - 窓の外では、設計文書の便を門（ADR-18 の案 a の式）で判定する。2026-09-22 の裁定は ADR-18 の便アの着地まで有効で、着地の時点で決定 (4) に置き換わるので、門が今の式のまま設計文書の便が止まる間は生まれない。
  - 窓の間は設計文書の便を止めるので、枝の上の周が読まない本流の変化は実装だけの便に限る。承認待ちの間に着地した実装の便は枝の印に読まれず、着地の時点の本流を次の引き金の周の実態との整合の観点が読む（過去の承認待ち 21 本のうち 8 本で、待ちの間に実装の便が 1〜4 本着地していた）。周の中身を変えないので見つける数は減らないが、実態の観点がその実装を読む時は遅れる。
  - 印を付け直すためだけの取り込み（天井の印の付け直しの依頼）は、印を一括と一緒に取り込むので要らなくなる。その裏側として、承認の記帳の後は印の正本の要約値が今の正本と違うので、判断の記録 ADR-18 の決定 (6) により、完成の判定は満たされず、面の天井の名札に「印の後に変わった所はまだ読まれていない」が添えられる。M の出口では ADR-18 の決定 (3) ② が全文の周を回すので、完成の判定の実害は無い。
