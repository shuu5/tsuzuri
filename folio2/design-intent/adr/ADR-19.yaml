    数える期間は、判断の記録 ADR-18 の便アの着地の時刻から 7 日か、その後に一括の行の手順で閉じた連鎖が 3 本になるまでの、遅い方とする
    （便アの着地より前は承認の後の本流の周が残り、本判断の効き目を測れないため）。
    (1) 持ち主の判断を先回りしている: 1 回の承認要求で、持ち主が席の推奨と違う案を選び、周の引き金の欄が変わった一括を数える。
    期間の中で 2 本になったら、本判断を捨て、一括の行を廃止して往復ごとの承認（今の形）へ戻す判断の記録を起こす。
    (2) 枝の上の往復が閉じない: 決定 (3) の (ア)（同じ種類の失敗が窓の中で通して行 R-7 の回数を超えた）で往復を止めた連鎖を数える。期間の中で 2 本になったら (1) と同じく捨てる。
    (3) 承認の後に古くなる: 承認の記帳だけの変更で門が「まだ分からない」を返した回（判断の記録の発効を含む承認は数えない）を数える。
    1 回で、承認の記帳の欄と周の引き金の欄の食い違いとして、ADR-18 の規範の欄の一覧の見直しを持ち主に問う。
    (4) 数えられない回が数値の表の行 R-7 の回数を超えたら、本判断の撤退条件の判定を「まだ分からない」に落として持ち主へ渡す（条 P-4.2・P-11.1）。
    節約が小さいこと（往復が 1 本で閉じる連鎖ばかりであること）は撤退の理由にしない。一括の行は実装の仕掛けを持たず、残して害が無いためである。

grill: {when: 2026-09-24, who: 独立の検証役（起草役とは別の文脈の AI・opus 5.5・読み取りだけ）と起草役の自己反証, where: ~/.local/share/folio2/handoff-2026-09-24/adr19-verify.md（数え直しの script adr19-verify-scripts/ と承認の後の欄を写しに当てた差分）と docs/design/adr-19-grill.md（自己反証と改訂 b の当て方の一覧）, summary: 独立の検証の総合は条件付き支持。骨（周の中身を変えずに承認待ちを外す・承認する字を天井に合格した字にする・ADR-18 の案 a への片向きの依存）は実測でも筋でも崩れなかった。数え直しは周・所見・反証・字の生まれ・案 a の再生で起草役と一致した。穴は 9 点（重い 3 点＝利益の数が決定 (3) を当てておらず過大・合格の周の後に始まる連鎖で門が設計文書の便を通す・止める場合 (ア) の数え方が未定）と文面 7 点で、改訂 b で全部を席の裁定どおりに当てた（利益の数を検証役の値へ・窓の間は設計文書の便を受け付けない・窓と再開と通しの数え・直しの無い回し直しは 1 回まで・承認要求は 1 つの周の一括・注だけの是正の作法を残す・枝に書けない所見は控えに束ねる・撤退の数えの起点を便アの着地へ・関係の欄を 3 条へ）。改訂 b の再検証も条件付き支持で、残った穴 4 点（止める場合 (オ) を利益の数に当てていない・決定 (4) が 2026-09-22 の持ち主の裁定と衝突する・器の列の便が窓の間に自動で起動しうる・(ア) の数え方が本文に無い）と文面 6 点を、改訂 c で席の裁定どおりに当てた（承認およそ 16 回が 12 回・発効で 2026-09-22 の裁定を置き換えると明記・窓を開くとき列の便を保留・(ア) の所見を支持の 止める と定めて本文へ）}

