amends:
  - {"target": "N-6", "field": "title", "version": "v1.2", "previous_text": "見せる先を tailnet の外へ広げない", "new_text": "見せる先を同じ端末の中と tailnet の外へ広げない"}
  - {"target": "N-6", "field": "statements.N-6.1.text", "version": "v1.2", "previous_text": "配信（serve）の接続先（bind 先）が tailnet の外なら、起動を拒む。", "new_text": "配信（serve）の接続先（bind 先）が、同じ端末の中（loopback）でも tailnet の中でもないなら、起動を拒む。"}
  - {"target": "precedence", "field": "plain", "version": "v1.2", "previous_text": "迷ったら「全部そろえる」より「そろっている」、「早い」より「黙って飛ばさない」、「賢い」より「元に戻せる」を選びます。段が食い違ったら、強い段（絶対にやらない）が勝ちます。", "new_text": "迷ったら「全部そろえる」より「そろっている」、「早い」より「黙って飛ばさない」、「賢い」より「元に戻せる」を選びます。段が食い違ったら、「絶対にやらない」＞「確認してから」＞「いつも守る」の順で強い方が勝ちます。"}
plain: 憲法には「見せる先が私設ネット（tailnet）の外なら、機械が起動を止める」と書いてあります。ところが実際の道具は、同じパソコンの中だけに見せる場合（loopback）は止めません。これはうっかりではなく、便 17 でそう決めて、歯（自動の確かめ）も設計ノートもそのとおりに書いてあります。揃っていないのは憲法と要件書の文のほうだけです。そこで文のほうを直します。「同じパソコンの中でも私設ネットの中でもないなら止める」に改めます。外へ出さないという約束はもう 1 本の文が持ち続けますし、同じパソコンの中は外から届く道がないので、守りは弱くなりません。逆に道具のほうを直すと、私設ネットにつながっていないパソコンでは「見せる」が 1 度も使えなくなり、便 17 で決めたことを後から覆すことになるので採りません。ついでに、憲法の前書きのやさしい文も直します。今は「いちばん強い段が勝ちます」としか書いていなくて、3 つの段の順番（絶対にやらない ＞ 確認してから ＞ いつも守る）が読み取れないからです。この 2 つは、あなたの OK をもらってから版を上げます。
consequences:
  - 憲法は第 1.2 版になる（2 度目の条文の改訂・改める規範文は N-6.1 の 1 本・前文の平易文 1 件・条の平易文と機構の注 1 件）。凍結 anchor は第 1.2 版の file（anchors/constitution-v1.2.yaml）として置き、索引に追記する。発効までは版と anchor の列が食い違うので、床は「版を上げたのに凍結していない」で落ち続ける（正しい振る舞い・A-2）。
  - 要件書は次の版（v1.23）になる（FR7 の規範文と平易文・注だけ。ほかの要件と受入基準と制約は据え置き）。発効は本判断と同じ 1 つの承認で運ぶ。
  - 実装・歯・便 17 の契約は 1 行も動かない＝本改訂で運ぶ便は無い。動くのは設計文書 4 file（憲法・要件書・語彙・判断の記録）と凍結 anchor と CLAUDE.md の生成区間だけである。
  - FR7 の確かめ方の欄は同じ版で便 17 の歯 2 本（住所を明示して外の先を指す起動を拒む・住所を明示しない起動で tailnet の住所を解けなければ拒む）まで広げた＝新しい歯は要らない。17 周目の 2 つ目の所見（実態との突き合わせ F-2）はこれで全部閉じる。
  - 条 N-6 の段は「絶対にやらない」のままで、拒む先の範囲が 1 種類ぶん狭まる。同じ端末の中を通す配信から出力が端末の外へ出た経路が実測されたら、撤退条件のとおり案 b へ戻す。
  - 配信の接続先の判定の式そのものを人が読める型付きデータへ写す義務は、判断の記録 ADR-11 の決定 (4)⑧ が持ち、台帳の行は f2-648.76（未着手）である。本判断はその写しを出さない＝条文と実装の食い違いだけを閉じる。写しが出るまで、条 P-5.6 の充足はこの判定について「まだ分からない」に留まる（P-4.2）。
  - 断りの文言（「拒否 — bind 先 <住所> は tailnet の外」）と命令の一覧の説明は、便 17 の歯が字面を固定しているので本判断では動かさない。規則の表の行 D-11 により文言の字面は写しの義務の外だが、次に配信の実装を触る便で実態へ揃える。
  - 本判断は条文を改訂するので A-2.3 の対象である＝発効の前に反対側からの検証（grill）を実施し、その記録を設計ノートの file（docs/design/adr-12-grill.md）に置いて検証の欄（grill）で指す。承認は持ち主の逐語・日付・裁定 id・対話面 R-8 を承認の欄（approval）と台帳に記帳する。
note: 起草の材料は天井の 17 周目の所見（実態との突き合わせ F-1 止める・F-2 直す）と 13 周目の所見（忠実さ F-1 直す）で、束は ~/.local/share/folio2/ceiling/2026-09-21-round17/ と同 round13/ に在る。実装の根拠は crates/folio/src/serve.rs の inside（ip.is_loopback() || in_tailnet(ip)）と in_tailnet（100.64.0.0/10・127.0.0.1 には false）、歯 serve_binds_only_inside_the_tailnet_or_loopback、便 17 の設計ノート docs/design/delivery-17.md §1 (b) 4. と §3（loopback での配信 11 要求）。要件書 FR7 の図の節 fig-tech の名札は「bind 先が loopback か 100.64.0.0/10 でなければ起動を拒む（N-6.1）」と既に実装どおりである。approval の欄と、憲法と要件書の版の承認欄の行と、条 N-6 の改訂来歴（amended_by）の 1 件は、発効のときに席が置く（起草の時点では空＝欄ごと持たない。来歴を先に置くと床が「発効していない判断を指す来歴」で落とすので、第 1.1 版の起草のときと同じく発効の手で置く）。置く 1 件の欄 ＝ adr は ADR-12、date は発効日、approved_by は 持ち主、ruling は承認の裁定 id と時刻、previous_text は「配信（serve）の接続先（bind 先）が tailnet の外なら、起動を拒む。」、rationale は「配信の実装・歯・便 17 の契約・図の名札はどれも同じ端末の中（loopback）か tailnet の中を拒まない範囲としており、条の文だけが実装と逆だった。外へ晒さない狙いは N-6.2 が持ち続けるので、条の文を実態と同じ範囲へ揃える（天井の 17 周目の実態との突き合わせの止める所見・判断の記録 ADR-12）。同じ端末の中の住所は、その端末の外の機器から直には届かない。同じ端末の上の別の道具で外へ中継すれば届くが、それは「出す」操作で、条 A-1.1 と N-6.2 の領分であり、この経路は改訂の前から在って本改訂は 1 本も増やさない（検証の記録の提案 5）。」。見出しの改訂（第 1.2 版）も同じ 1 件でよい＝来歴は条の単位で持つ（検証の記録の提案 1）。grill の欄は A-2.3 の検証を終えた時点で埋めた。同じ取り込みの要求（PR）で運ぶ別件 = 判断の記録 ADR-8 の注の追記（17 周目の実態との突き合わせの所見 F-3・帰結の待つ相手の断り）で、本判断の改訂の範囲の外＝承認要求では 1 件として別に示す。 【判断の記録 ADR-17 による見出しの改訂（憲法 第 1.3 版）】決定 (1) と改訂の欄に在る見出しの字「見せる先を同じ端末の中と tailnet の外へ広げない」は第 1.2 版の見出しの逐語で、書き換えない（改訂の欄の字は第 1.2 版の凍結 anchor との消し込みが固定し、決定 (1) の字は当時の決定の記録である）。この字は「同じ端末の中」と「tailnet の外」を並べた句にも読めるが、意味は規範文 N-6.1 と平易文のとおり、同じ端末の中でも tailnet の中でもない先へ広げない、である。第 1.3 版で見出しを「見せる先を、同じ端末の中と tailnet の中より外へ広げない」に改めた（判断の記録 ADR-17・持ち主の承認 2026-09-24 11:51 JST・台帳 f2-648 notes）。
