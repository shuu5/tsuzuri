# folio2 判断の記録 ADR-12 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。人が読む面は判断の記録の面（adr-12.html・生成物・手で直さない）。
# 状態: accepted（起草 2026-09-21・発効 2026-09-21 20:33 JST 持ち主「承認する」・orchestrator 席 fable 5.1）。憲法の条文の改訂（第 1.2 版）を伴う＝発効には A-2 / N-4 の手順（反対側からの検証・持ち主の承認の逐語・凍結 anchor・再注入）が要る。grill 欄は A-2.3 の検証を終えた時点で埋め、approval 欄は発効のときに置く。
# 位置: 天井の 17 周目（2026-09-21・main c673990）の「実態との突き合わせ」の止める所見 F-1（条 N-6.1 と配信の実装の食い違い）と同 F-2（要件書 FR7 の側）の是正。同じ改訂に 13 周目の「忠実さ」の所見 F-1（前文の平易文が段の順位を 3 段で書いていない）の直しを同梱する。反対側からの検証（grill）= docs/design/adr-12-grill.md（A-2.3 により改訂の前に実施し、結果を反映してから grill 欄を埋める）。実装の根拠 = crates/folio/src/serve.rs の inside（ip.is_loopback() || in_tailnet(ip)）と歯 serve_binds_only_inside_the_tailnet_or_loopback、便 17 の設計ノート docs/design/delivery-17.md §1 (b) 4.。

id: ADR-12
title: 配信の接続先の条 N-6.1 を「同じ端末の中（loopback）でも tailnet の中でもないなら拒む」の向きへ改訂し（憲法 第 1.2 版）、要件書 FR7 の規範文と前文の平易文を同じ改訂で揃える
status: accepted
date: 2026-09-21
context: 天井の 17 周目（2026-09-21）で「実態との突き合わせ」の審査役は、条 N-6.1「配信（serve）の接続先（bind 先）が tailnet の外なら、起動を拒む。」を止める所見の 1 つ目に挙げた。配信の実装は tailnet の範囲を 100.64.0.0/10 だけと数える一方、bind してよい住所は「同じ端末の中（loopback）か tailnet の中」と定めており、住所を明示して同じ端末の中を指す起動は拒まれずに配信する。歯もその側で固定している。これは取り違えではなく便 17 で意図して決めたことで、便 17 の設計ノート（docs/design/delivery-17.md）は「同じ端末の中（loopback・127.0.0.0/8）か tailnet の範囲（100.64.0.0/10）のどちらかでなければ拒む」と書き、要件書 FR7 の図の節の名札も実装どおり「接続先が同じ端末の中か tailnet の範囲でなければ起動を拒む」と書いている。食い違っているのは規範文の側だけである。同じ周の 2 つ目の所見（実態との突き合わせ F-2・直す）は、要件書 FR7 の規範文「folio serve は tailnet 上でのみ配信し、公開ネットへ接続（bind）しない。」が条と同じ食い違いを持つこと、確かめ方の欄が「tailnet の住所が無いとき起動を拒む」＝住所を渡さない道だけを見るのでこの食い違いを拾えないことを指摘した。N-6 は段が「絶対にやらない」で、条は無条件に約束するのに実装は 1 種類の入力（同じ端末の中）を通す＝この入力について条と実装が逆である。なお N-6.2 が守ろうとしているもの（配信の出力と支度表・台帳の中身を認証なしの公開ネットに晒さない）は、同じ端末の中への配信では動かない。同じ端末の中の住所は、その端末の外の機器から直には届かない。同じ端末の上の別の道具で外へ中継すれば届くが、それは配信の接続先の話ではなく「出す」操作であり、条 A-1.1 が実行前の確認を求め、条 N-6.2 が結果の側で拒む。この経路は改訂の前から在り、本改訂は 1 本も増やさない。開発と検査の側は同じ端末の中を必要としている＝便 17 の歯は同じ端末の中で配信して要求を送り返す形で書かれており、tailnet の住所を持たない端末（別の端末・組み立ての場）では tailnet の住所を解けないので、同じ端末の中を外すと folio serve はその端末で 1 度も起動できない。加えて 13 周目に「忠実さ」の審査役は、前文の平易文「段が食い違ったら、強い段（絶対にやらない）が勝ちます。」が規範の側の 3 段の順位（絶対にやらない ＞ 確認してから ＞ いつも守る）のうち最強の段しか言わず、「確認してから」と「いつも守る」の間の順位を落としていると挙げた。「確認してから」の段の条と「いつも守る」の段の条が衝突したときの解き方が、平易文からは読めない。どちらも条文の側を直す話なので、1 つの版（第 1.2 版）で運ぶ。
decision: (1) 憲法を第 1.2 版に改訂する。N-6.1 の規範文を「配信（serve）の接続先（bind 先）が、同じ端末の中（loopback）でも tailnet の中でもないなら、起動を拒む。」に改める（型は unwanted・強度は must・段は never のまま。条の id と縛る相手は変えない。見出しは同じ版で「見せる先を同じ端末の中と tailnet の外へ広げない」に改める＝改訂の範囲の 5 欄の 1 つなので amends の行を持つ〔検証の記録の提案 1〕）。N-6.2 は 1 字も変えない＝外へ晒さないという N-6 の狙いは不変で、この改訂が広げるのは「拒まない先」の範囲ではなく、条の文が実装と同じ範囲を名指すようにすることである。(2) 同じ版で前文の平易文を「段が食い違ったら、「絶対にやらない」＞「確認してから」＞「いつも守る」の順で強い方が勝ちます。」に改める（前文の規範文は 1 字も変えない・13 周目の所見 F-1 の是正・R-10 に従い義務を落とさず足さない）。(3) N-6 の平易文に同じ端末の中を除く旨を 1 語添え、N-6 の機構の注を実際の判定（同じ端末の中か tailnet の範囲でなければ拒む）に揃える。どちらも改訂の範囲（A-2.2 の条文の 5 欄）の外なので差分の消し込みには載らないが、平易文が義務を落とさない決まり（R-10）と、機構の注が実態を偽らないこと（P-4.1）に従って同じ版で直す。(4) 要件書を次の版（v1.23）に上げ、FR7 の規範文を「folio は全面を配信先へ生成する。folio serve は同じ端末の中（loopback）か tailnet の上でのみ配信し、公開ネットへ接続（bind）しない。」に、平易文を同じ向きに改める。FR7 の確かめ方の欄も同じ版で、便 17 に既に在る歯まで広げる＝「住所を明示して同じ端末の中でも tailnet の中でもない先を指す起動を拒むことと、住所を明示しない起動で tailnet の住所を解けなければ拒むことを見る」に改める。新しい歯は要らず、欄が見る道が実装と同じ 2 本になる（17 周目の所見 F-2 の残りはこれで閉じる・検証の記録の提案 3）。(5) 便 17 の契約（歯・実装・設計ノート）は変えない＝本改訂は実装を 1 行も動かさない。動くのは設計文書の側だけである。(6) 発効の手順は A-2 のとおり＝反対側からの検証（grill・docs/design/adr-12-grill.md）を改訂の前に実施し、持ち主の承認（逐語・日付・裁定 id・対話面 R-8）を得てから版を上げ、凍結 anchor（anchors/constitution-v1.2.yaml）を置き、CLAUDE.md の生成区間を注入し直す。(7) 同じ版で、語彙の tailnet の定義の後段を「配信で見せる先は、ここか同じ端末の中（loopback）だけ（N-6）。」に改め、要件書の図の節（fig-tech）の名札（caption）・副題・参加者 serve の副題を実態へ揃える。どちらも改訂の範囲（A-2.2 の 5 欄と前文と schema 節）の外だが、条を指し示す文と図の名札が偽のまま残らないよう同じ版で直す（P-4.1・検証の記録の提案 2 と 4）。語そのものの意味は広げない（案 d を退けた理由をそのまま保つ）。図の参加者の副題は枠に収めるため「端末内と tailnet だけ」と縮めた（意味は同じ＝図の道具は参加者の箱を固定の幅で描き、逐語の「同じ端末の中と tailnet だけ」も検証の記録が挙げた「端末の中と tailnet だけ」も入らないと実測した）。
options:
  - id: a
    name: 条文を改訂して同じ端末の中（loopback）を除く
    text: N-6.1 の規範文を「同じ端末の中でも tailnet の中でもないなら拒む」の向きへ改め、要件書 FR7 の規範文と平易文を同じ向きに揃える。実装・歯・便 17 の契約は変えない。前文の平易文の直しを同じ版に同梱する。
    verdict: adopted
    reason: N-6 の狙い（外へ晒さない）は N-6.2 が持ち続け、同じ端末の中への配信は外から届く経路を持たないので狙いは 1 つも損なわれない。開発と検査は同じ端末の中を必要としている（便 17 の歯は同じ端末の中で配信して要求を送り返す・tailnet の住所を持たない端末では folio serve が 1 度も起動できなくなる）。実態の側（実装・歯・図の名札・設計ノート）は既に 4 つとも同じ範囲を書いており、揃っていないのは条と要件書の規範文の 2 か所だけなので、実態に合わせて条を直す方が動かす面が少ない。対価は、条の約束が 1 種類の入力ぶん弱くなることと、それを持ち主の承認 1 回で通すことである。
  - id: b
    name: 実装から同じ端末の中（loopback）を外す
    text: 配信の実装の判定を tailnet の範囲だけにし、歯を書き換える。条と要件書の規範文は 1 字も変えない。
    verdict: rejected
    reason: 条の約束をいちばん強く守る道で、改訂も承認も要らない。しかし folio serve は tailnet の住所を解けない端末で 1 度も起動できなくなり、便 17 の歯（同じ端末の中で配信して要求を送り返す）と設計ノートの契約を後から覆すことになる。便 17 は持ち主の承認を経て着地しており、その決定を天井の所見 1 件で裏返すのは、実態に合わせて条を直すより取り消しにくい。組み立ての場や別の端末で面を確かめる道も同時に消える。
  - id: c
    name: 条文は変えず、機構の注と平易文だけで同じ端末の中を説明する
    text: N-6.1 の規範文は残し、N-6 の機構の注と平易文に「同じ端末の中は外と扱わない」と書いて食い違いを説明する。
    verdict: rejected
    reason: 改訂も承認も要らず、その場は収まる。しかし規範文が偽のまま残り、機構の注と平易文は改訂の範囲の外＝凍結 anchor にも差分の消し込みにも載らないので、規則の実質が散文にしか無い形（N-2）になる。段が「絶対にやらない」の条について、条を読んだだけでは拒む先が分からない状態を追認することにもなる。次の周で同じ所見がそのまま返る。
  - id: d
    name: 語彙の tailnet の定義に同じ端末の中を含める
    text: 条も要件書も変えず、語彙の tailnet の項を「自分の端末どうしだけがつながる私設ネットと、同じ端末の中」に広げる。
    verdict: rejected
    reason: 改訂の範囲を憲法の外に逃がせるが、tailnet は外の世界に実在する道具の名で、その語の意味を folio2 の都合で広げると、同じ語を使う rules 行 D-8（版管理へ載せる file に tailnet の住所を書かない）や要件書 CON3 の読みまで一緒にずれる。実装の側も tailnet の範囲と同じ端末の中を別の判定として持っている＝語を広げると実装の 2 つの判定と語彙の 1 語が対応しなくなる。
basis: [P-4, P-7, P-8, P-13, A-2, N-2, N-4, N-6, R-7, R-8, R-10, D-8, FR7, CON3, ADR-2, ADR-8, ADR-11, A-1, D-11, P-11, P-5]
retreat:
  kind: measure
  condition: 数えるのは orchestrator 席で、台帳（f2-648）に記帳する。発効後に、同じ端末の中（loopback）を通す配信から出力が端末の外へ出た経路が 1 つでも実測されたら（自分の端末で起動した folio serve の出力が、別の端末か公開ネットから取れたことを 1 度でも確かめたら）、本判断を捨てて案 b（実装から同じ端末の中を外す）へ戻し、条を改訂前の向きへ戻す改訂を起こす。数えるのは実測 1 件からで、机上の心配は数えない。加えて、席は同じ端末の中を指して配信を起こした便ごとに、その端末で外向きの中継（前置きの配信器・転送・公開の口）が動いていないことを 1 行で確かめて台帳へ記帳する。確かめられなかった回が規則の表の行 R-7 の回数を超えたら、本判断の撤退条件の判定を「まだ分からない」に落として持ち主へ渡す（P-4.2・P-11.1）。決定 (2) については、前文の平易文が 3 段の順位を述べることで義務を足したと天井の忠実さの観点が挙げたら、その 1 件で決定 (2) を捨て、前の文へ戻す改訂を起こす（R-10 は落としも足しも 0 と定める）。
grill: {when: 2026-09-21, who: 検証役（AI・opus・独立の文脈・読み取りのみ）, where: docs/design/adr-12-grill.md, summary: 7 論点を攻めと守りで検証した。総合は改訂を支持（条件付き）。条 N-6.2 が破れる経路の本数は改訂の前後で変わらず（同じ端末の中は tailnet の住所より届く範囲が狭く、中継は条 A-1.1 と N-6.2 の領分）、実態の側は便 17 の承認を経て初めから揃っており、差分の検査は 2 件を数えて 2 件とも記録で消し込まれ番号は動かない。条件は 8 件で、同じ版で直すもの 4 件（条 N-6 の見出し・語彙の tailnet の定義の後段・要件書 FR7 の確かめ方・図の節 fig-tech の 3 か所）と、判断の記録の欄を直すもの 4 件（問題の欄の言い切り・撤退条件の数えられる脚・帰結の依存の名指しと古い字面の断り・決定 (2) の撤退の受け皿）である。案 b への差し戻しは要らない。8 件は、起草の後に席の依頼で判断の記録と憲法・要件書・語彙へ全部反映した。}
