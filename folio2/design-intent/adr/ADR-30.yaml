# folio2 判断の記録 ADR-30 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。人が読む面は判断の記録の面（adr-30.html・生成物・手で直さない）。
# 状態: accepted（起草 2026-09-27・orchestrator 席の起草役〔opus 5.5〕・発効 2026-09-27 12:50 JST 持ち主「承認する」= 構造の直し A → C → B・f2-648 notes・対話面 R-8）。憲法の条文は 1 字も変えない。
# 起点: 診断 ~/.local/share/folio2/handoff-2026-09-27/loop-diag.md と席の仕様 struct30-spec.md（決定の番号 (1)〜(8) は便 169・170 の契約と同じ）。ADR-28・ADR-29 は凍結中の枝の上だけに在る（番号は再利用しない・P-7.1）。

id: ADR-30
title: 発効した判断の記録を凍結された来歴にし、天井の周を起こす時と門の式を削る（構造の直し A → C → B）

status: accepted
date: 2026-09-27

plain: |
  天井（AI が設計文書を読んで食い違いを探す審査）は、席が直した字を次の周で読んで「止める」を出し、その直しがまた次の周の材料になる輪を回していました。28〜52 周の「止める」16 件のうち 14 件は、直前の周で席自身が書いた字が原因でした。この判断は、その輪の燃料と回し手を削ります。
  1 つ目。判断の記録（なぜそう決めたかの記録）は、発効したら中身を変えない「来歴」にします。判断を変えたいときは新しい判断の記録を立てます。いま守る決まりは、憲法・規則の表・要件書・設計ノートだけが持ち、食い違って見えても今の決まりが正しいとします。これを機械が確かめる仕掛け（封）を床に足し、天井は判断の記録の題と状態だけを読みます。
  2 つ目。天井の周を回すのは、反証でも支持された「止める」を直して確かめる時と、M の出口をあなたに問う前だけにします。「直す」「参考」はまとめて当てず、便 10 本ごとの節目（行 R-22）はやめます。
  3 つ目。門は「書き換える file に、反証で支持されてまだ直していない止めるが在るか」だけを見ます。印（天井の結果の記録）の後に文書が変わっただけでは止めず、通すときは「印の後の変更はまだ審査していない」と添えます。
  4 つ目。天井は folio2 自身の運用の規則（開発規律の行と入口の読む順番）を読みません。

context: |
  (1) 持ち主の承認（2026-09-27 12:50 JST・対話面 R-8・逐語「承認する」・台帳 f2-648 notes）は、診断の直し A（発効した判断の記録を凍結された来歴にする）・C（周を起こすのは 止める の確かめと M の出口だけ・行 D-16 の積み荷と節目・行 R-22・門の「全体の印が古ければ 2」を削る）・B（天井の読む欄から運用の規則を外す）をこの順で行うことを承認し、伴う規則の表の行と要件の変更の裁定とした（行 D-17）。
  (2) 28〜52 周の 止める 16 件は反証で全部支持され、14 件は直前 0〜2 周に席自身の編集（一括・判断の記録）が書いたか食い違わせた字だった。9 件（整合の 止める は 7 件の全部）は判断の記録の決定と要件・規則・別の判断の記録が両立しない形で、この食い違いを直すためだけに判断の記録が 5 本（ADR-20・22・24・25 と凍結中の 28）生まれた。着地した一括 12 本は全部、発効した判断の記録を書き換えた（計 37 回）。
  (3) 止める 11 件は天井と門の仕掛けか folio2 の運用の規則についてで、止める と 直す に占める割合は 2〜14 周の 16% から 40〜52 周の 79% に増えた。規則を足して輪を締めた一括 27 の後、48〜51 周の所見 71 件のうち 60 件はその規則についてだった。
  (4) 周 25 回は全部一括が起こした（枝の上 17・印を取り直す本流 8・実装の便は 0）。一括 14 本のうち 8 本は 直す と 参考 の積み荷か節目だった。
  (5) 外の置き場（t3 = tsuzuri）には、全文書を読む天井の既定（folio init が本流の天井の正本を焼く）・改訂の欄を持つ判断の記録の床・全体で 1 つの印を見る門が、道具ごと入る。

decision: |
  (0) 本判断は憲法の条文を改訂しない。天井の観点 4 つ・重さ・反証・3 値、行 R-21・R-7・D-17 は変えない。
  (1) **凍結された来歴。** 発効した判断の記録（状態が accepted か retired）の本文は変えない。変えてよいのは退役のときの状態の欄と後継の欄（superseded_by）だけである。判断を変えるときは新しい判断の記録を立てる。今の規範（義務・値・範囲）は憲法・規則の表・要件書・設計ノートだけが持ち、判断の記録は「なぜそう決めたか」の来歴である。判断の記録と今の規範が食い違って見えても、今の規範が正で、判断の記録は直さない。ただし撤退条件は、その決定が生きている間、席が数える（条 P-8.1）。
  (2) **改訂の欄を削る。** 欄の決まりから改訂の欄（revises・床の定数とその注）を削る。本流の判断の記録の改訂の欄の行は、本判断の発効と同じ取り込みで 1 回だけ消す（凍結の前の最後の書き換え・中身の今の規範は規則の表と要件書に在り、来歴は版管理の履歴に在る）。欄の決まりから欄を削るのは便 170 である。
  (3) **床の封。** 発効した判断の記録ごとに、本文（状態の欄と後継の欄を除く）の要約値を封の一覧に置き、床（folio check）が本文の変化を落とす。封の一覧は folio が書く生成物で、足すだけで在る行を書き換えない（条 P-6.2）。発効した判断の記録で封の行が無いものも床が落とし、封を足す命令を理由の行に出す。凍結 anchor（条 P-10.1）は便の歯の固定の材料である。実装は便 170 である。
  (4) **天井は判断の記録の題と状態だけを読む。** 天井の正本の 4 観点の読む欄の判断の記録を題と状態（title・status）にする（決定・前提・退けた案・注・帰結・平易文・改訂の欄を読まない）。判断の記録の面（人が読むページ）はそのまま生成する（読み手のための来歴）。
  (5) **周を起こすのは 2 つだけ。** (a) 反証で支持された 止める の直しを一括の枝に書き、それを確かめるとき（枝の上の周・上限は行 R-21）。(b) M の出口の裁定を持ち主に問う前。所見の 直す と 参考 は所見の file に残し、一括で当てない。当てるのは、ゴール（最上位の目的）に向かう便がその節点を書き換えるときか、持ち主が選んだときだけである。行 R-22（節目の本数）は廃止する（番号は空けたまま）。行 D-18 の「群 A の後の最初の節目で 1 回だけ刈る」義務も外す（直しは置き換えと削りを既定にする本体は残す）。印の古さ・判断の記録の発効・引き金の欄の変更は周を起こさない。
  (6) **門の式。** 天井の門（folio ceiling --gate）は、便の書き換える file の一覧のうち設計文書の正本の file について、印が記した「反証で支持された 止める」の場所の file が 1 つでも在れば 止める（1）。反証の済んでいない 止める の場所の file が在るとき・印が無いか読めないとき・印の観点の結果が欠けているとき（観点の行が無いか、観点が まだ分からない でその理由が反証の済んでいない 止める だけでないとき〔例 止める が全部退けられた再判定待ち・数えられなかった観点〕）は まだ分からない（2）。それ以外は 通す（0）で、理由の行に印の周を書き「印の後の変更は審査していない」と添える（条 P-4.2・P-3.3＝通すは天井の合格ではない）。印の古さ（引き金の要約値・正本の要約値）では止めない。根の照らし（便 142・150 の まだ分からない）と「設計文書の正本を書き換えない便は 通す」はそのままである。止める の場所の file は、所見の場所の頭の文書 id を天井の正本の文書の一覧で file に解いたもの（判断の記録と設計ノートは場所の頭の id が指す 1 file・頭の id が file に解けないときはその文書の置き場の全体）で、印はそのために支持と未反証の 止める の場所を記す。実装は便 169 である。
  (7) **天井は運用の規則を読まない。** 天井の正本の読む欄から、規則の表の開発規律の行（discipline）と入口の読む順番（lanes）を外す（規則の表の閾値の行は読む）。語彙の運用の語（一括・周の引き金・本流・作業ツリー・台帳・裁定 id・天井の印）は、語を選んで外す口が今は無いので読むままにする。folio init が外の置き場へ焼く天井の正本は本流の天井の正本なので、同じ読む欄が外の置き場へ届く。面（人が読むページ）に残る開発規律の行と判断の記録の本文は天井の正本の問いの文で所見に挙げないと断り、面を束から外す口は後続の便とする。
  (8) **前の判断のうち置き換えるもの。** 前の判断の記録の本文は書き換えない（決定 (1)）。次の決定（部分）は本判断が置き換える。全体が置き換わる判断の記録は無いので、状態の欄はどれも変えない。
  ① ADR-8 決定 (4) の末文（天井が合格でない間は設計文書の便の着地を既定で止める）→ 決定 (6)。決定 (1) ② の読みやすさの「なぜそうしたか」を読めるか → 決定 (4)。
  ② ADR-13 決定 (8)（周の引き金）→ 決定 (5)。決定 (9)（門の まだ分からない の単位・不合格は置き場の全体で止める）→ 決定 (6)。決定 (14) の「判断の記録どうしの改訂の欄を欄の決まりへ足す」→ 決定 (2)。
  ③ ADR-18 決定 (1)(2)（周の引き金）と (3)（手順の引き金）→ 決定 (5)。決定 (4)（門が使う印の引き金の要約値）と (5)（門の式）→ 決定 (6)。決定 (6)（完成の判定と面の名札）は置き換えない。
  ④ ADR-19 決定 (1) の「一括が周の引き金の欄を変えるときも枝の上で周を回す」と ⑦ ⑧（引き金の要約値による載せ替えと取り込みの仕分け）・決定 (2)・決定 (3) の末文・決定 (6)（ADR-18 の案 a への依存）→ 決定 (5)。窓と一括の枝の運びと行 R-7 の数えは置き換えない。
  ⑤ ADR-20 決定 (1)〜(5)（周の引き金の欄の範囲と、改訂の欄による字の揃え）→ 決定 (2)(5)(6)。引き金は周も門も起こさなくなる。引き金の定数を消すかは便 169 が決め、定数が残るあいだは ADR-20 がその字の来歴である。
  ⑥ ADR-21 決定 (6)・ADR-22 決定 (4)・ADR-24 決定 (4)・ADR-25 決定 (4)（範囲の改訂は改訂の欄が持ち、改訂される側の注に 1 段で断る）→ 決定 (1)(2)。
  ⑦ ADR-24 決定 (1) と ADR-25 決定 (1) の「照らせるときは ADR-18 決定 (5) の式のとおり」→ 決定 (6)。照らせない形と置き場でない形は置き換えない。
  ⑧ ADR-26 決定 (0) の「門の式は変えない」・決定 (1)（止める の直しと節目・積み荷の一括）・決定 (3)（判断の記録の状態の欄を引き金から外すことと移行の周）・決定 (5) の末文（群 A の後の最初の節目で刈る）・決定 (6)（節目と行 R-22）→ 決定 (5)(6)。決定 (2)(4)(7) は置き換えない。
  ⑨ ADR-10 決定 (2) ② のうち読む欄に規則の表の開発規律の行（discipline）・入口の読む順番（lanes）・判断の記録の前提と退けた案（context・options）を足した分 → 決定 (4)(7)。ほかの読む欄は置き換えない。
  置き換えた決定に結び付く撤退条件は、本判断の発効で数えるのを終える＝ADR-8 の注の門の撤退条件・ADR-13 撤退条件 (3)(5)(6)・ADR-18 撤退条件 (1)〜(3)・ADR-19 撤退条件 (3)・ADR-20 撤退条件 (1)〜(3)・ADR-26 撤退条件 (1)。ADR-18 撤退条件 (1) と ADR-26 撤退条件 (1)（遅れと見送りの見張り）は本判断の撤退条件 (4) が引き継ぐ。

options:
  - id: a
    name: 判断の記録を凍結し、周を起こす時と門の式を削り、天井の読む欄から運用を外す（採る）
    text: 決定 (0)〜(8) の形。足すのは床の封の検査 1 つだけで、ほかは削る（改訂の欄・節目と積み荷の一括・行 R-22・門の印の古さの判定・読む欄の運用の節）。
    verdict: adopted
    reason: 診断の再生で、止める 16 件のうち 11〜12 件が起きず、止める の出た周は 25 周のうち 10 周から 3 周に、1 周が次の周を生む数は約 0.64 から約 0.19 に、周は 25 回から 6 回になる（loop-diag の結論 11・12）。床の定数と init の既定を直すので外の置き場にも道具ごと効く。
  - id: b
    name: 改訂の欄を任意の来歴の欄として残す
    text: 改訂の欄を消さず、読み手のための任意の来歴の欄にする（床は値域だけを見る）。
    verdict: rejected
    reason: 欄が在る限り判断の記録を今の規範に揃える口が残り、止める 9 件の形が同じ燃料で起きる。来歴は版管理の履歴と本判断の決定 (8) が持てる。
  - id: c
    name: 印の古さの門を残し、窓だけを狭める
    text: 門の「印が古ければ まだ分からない」を残し、印を取り直す周を起こす範囲（引き金の欄）を狭める。
    verdict: rejected
    reason: 印を取り直す本流の周 8 回は全部、全体の要約値が動いて門が 2 を返したことで起きた。引き金を狭める直し（ADR-18・ADR-20・ADR-26）を 3 回重ねても周は減らず、狭める字そのものが次の所見になった。
  - id: d
    name: 周の回数の上限だけで締める
    text: 周を起こす時は変えず、周の回数の上限の行を足して締める。
    verdict: rejected
    reason: 一括 27 がこの形で、上限と節目の行を足した 2 周後に節目の一括 30 を義務にし、所見は周あたり 8.5 件から 17.8 件に増えた（loop-diag の表 1・表 5）。上限は燃料（判断の記録の揃え・運用の自己参照）を断たない。

basis: [P-3, P-4, P-6, P-7, P-8, P-10, P-11, P-12, P-13, P-17, A-2, R-7, R-8, R-21, R-22, D-12, D-14, D-16, D-17, D-18, FR20, AC18, ADR-8, ADR-10, ADR-13, ADR-18, ADR-19, ADR-20, ADR-21, ADR-22, ADR-24, ADR-25, ADR-26]

consequences:
  - 周は、止める の直しを確かめる枝の上の周と M の出口の前の周だけになり、本流で印を取り直す周は要らない。直す と 参考 は、面に古い字を残したまま所見の file に留まる。
  - 門が 止める を返せるのは、支持の 止める を記した印が本流に在るときだけである。席は周のあとに、合格でなくても印を書く（枝の上の印は取り込むまで数えない・行 D-14）。
  - 便 169 の着地までの門は前の式（印の引き金の要約値で古さを測る）のままで、設計文書の便に まだ分からない を返しうる。その間の出口は持ち主の裁定である（行 D-12）。
  - 失うものは 2 つある。古くなった判断の記録の決定を天井が見ない（読み手は状態の欄と本判断の決定 (8) で辿る）。門が、印の後の審査していない編集を通す（通すは天井の合格ではない・M の出口の前の周が読む）。
  - 材料の束は読む欄に挙げた文書の面も丸ごと写す。本流（62111b1）の実測で、観点ごとの束の約 3 メガバイト（MB）のうち判断の記録の面が約 1.3 メガバイトで、憲法の面は規則の表の開発規律の行を、入口の面は読む順番を載せる。決定 (4)(7) を面の写しにも効かせる口は、席が便に割り振る。
  - 規則の表の状態の値域に廃止の値が無いので、行 R-22 の廃止は何を数えるかの欄と値の欄で表す（番号は空けたまま・条 P-7.2）。値域に廃止を足すのは便である。
  - 外の置き場（tsuzuri）の判断の記録 2 本（7 番と 8 番）は改訂の欄を 3 行持つ。便 170 の着地の後の床はそれを未知の欄として落とすので、行を消してから封を足す手順を便 170 の契約が持つ。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 の notes に 1 件ごとに記帳する（日付・材料の在り処・当たった条件）。
    (1) 凍結した判断の記録の決定と今の規範の食い違いが実装の誤りを生んだ件が 2 件を超えたら（3 件目で）、判断の記録に置き換えの印を付け直す口（来歴の欄）を持ち主に問う。実装の誤りは、便の差し戻し（契約の改訂を含む）か着地の後の修正で、原因が「判断の記録の決定を今の規範として読んだ」と契約か台帳に書かれたものを数える。
    (2) 本判断の後の周で、周 1 回あたりの支持の 止める のうち、席自身の直前 2 周の間の編集（一括・判断の記録・席の設計の取り込み）が書いたか食い違わせた字が誘因のものが、続けて 3 周で半数を超えたら、輪が別の燃料で回っているとして直しの形を持ち主に問う。誘因は、所見の根拠の逐語と場所の節点が直前 2 周の束に無かったか、そこで変わったかで数える（loop-diag の表 3 と同じ数え方・script は loop-diag-scripts/ の age_findings.py）。
    (3) 外の置き場（tsuzuri）で、天井の周が持ち主の直命なしに 1 週（月曜から日曜）に 5 周を超えたら、外の置き場の天井の既定（読む欄・周を起こす時）を持ち主に問う。数えは tsuzuri の台帳の周の記帳を読んで行う（読むだけ）。
