# folio2 設計ノートの見本 2（status: example・拘束力なし）。欄の決まりは design-note/schema.yaml。
# 題材は図の道具（archify・判断の記録 ADR-4）が描く図の対。持ち主の裁定 2026-09-19「手順図が非エンジニア二わかりやすいが順序図はエンジニアにわかりやすいのでそのように書いて両方あったらいいんじゃない？」（f2-648 notes）。
# 図の記述（型付き記述）は AI が座標も書き、道具の検査（仕上がりの段 showcase・rules 行 R-14）を通したものだけを置く。往復は台帳に記帳する（rules 行 R-7）。
meta:
  id: figures
  title: 図の見本 — 同じことを 2 つの読み手に向けて描く（手順図と順序図の対）
  version: v0.2
  status: example
  generated: 2026-09-19
  profile: design-note
  note: 見本（status example）は承認欄を持たない。設計ノートの図は、非エンジニア向けの手順図とエンジニア向けの順序図を対で置く（持ち主の裁定 2026-09-19）。

sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      同じこと（図がページに載るまで）を、読み手の違う 2 枚の図で描く。
      手順図は、専門の言葉を使わずに「誰が・どの順で・何をして・だめならどうなるか」を見せる図で、非エンジニアの読み手に向ける。
      順序図は、命令の名・旗・終了コード・file 名をそのまま書き、誰と誰が何をやり取りするかを見せる図で、エンジニアの読み手に向ける。
      設計ノートは、この 2 枚を対で置く。図の記述は正本のこの file の図の節に置き、道具の検査を通らない図は生成されず、前の生成物も上書きされない（FR15）。

figures:
  - id: fig-plain
    type: archify-workflow
    caption: 手順図（非エンジニア向け）— 図がページに載るまで。だめなら前の絵のまま
