        col: 4
        type: backend
        label: 絵だけ取り出す
        sublabel: 色は folio が付ける
        width: 140
      - id: place
        lane: folio
        col: 5
        type: frontend
        label: ページに載せる
        sublabel: 拡大もできる
        width: 140
      - id: keep
        lane: trouble
