        col: 1
        type: backend
        label: 機械の形にする
        sublabel: そのまま渡せる形
        width: 140
      - id: check
        lane: checker
        col: 2
        type: security
        label: 崩れを見る
        sublabel: 字の重なり・線の交差
        width: 140
      - id: draw
        lane: checker
        col: 3
