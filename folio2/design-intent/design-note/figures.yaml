        to: draw
        label: 合格
        variant: emphasis
      - id: e4
        from: check
        to: keep
        label: 不合格
        variant: security
        role: error
      - id: e5
        from: draw
        to: pick
        variant: default
      - id: e6
        from: pick
        to: place
        variant: emphasis
      mainPath:
