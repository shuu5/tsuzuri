# folio2 憲法 — 正本（v1.2・初回の発効 2026-09-12・第 1.1 版 2026-09-20 = 判断の記録 ADR-11・第 1.2 版 2026-09-21 = 判断の記録 ADR-12・orchestrator 席 fable 5.1）
#
# 位置: f2-648.1「day-1 文書」。v0.1（初稿）を敵対レビュー wf_5e659fc9-0ed（7 観点・反証 24 + 追加反証 34・review/summary.md）で
# 直したもの。裁定 G1〜G16・P1〜P5 に従う。裁定に触れる変更は入れず、承認要求の「論点」として別枠で出す。
# 読み方（規則ではない・規則は schema: 節と各条の欄が持つ）:
#   - 規範文は日本語で書く（G10）。専門語は日本語を先に、原語は括弧で添える。型（pattern / strength）は欄に持つ。
#   - 段（tier）は「実行時の扱い」（G3）。どの段の条も、外すには §6 の改訂（判断の記録 + 裁定 id + 持ち主の承認）が要る。
#   - 各条は rationale / binds / mechanism を必ず持つ（G1=B / G2=C / G4=A）。数値は条文に書かず rules 行の id で呼ぶ（P-5）。
#   - 発効前（v0.x）の変更は meta.changes_from_* に列挙してある（当時は binding: false ゆえ改番は P-7 に触れなかった）。以後の改訂は amended_by。
# 状態: 発効（持ち主の承認 2026-09-12「承認する」・逐語は f2-648.1 notes と meta.approval）。改訂は §6（A-2 / N-4）。改訂の来歴は各条の amended_by と凍結 anchor の列（anchors/）が持つ＝第 1.1 版は条 P-5 と P-14（判断の記録 ADR-11・承認 2026-09-20）、第 1.2 版は前文の平易文と条 N-6（判断の記録 ADR-12・承認 2026-09-21）。

schema:
  version: 1
  top_level: [schema, meta, north_star, precedence, articles, rules_pointer, amendment, glossary_pointer, sources]   # 未知の節は検査で落とす（N-3）
  meta:
    required: [id, version, status, binding, baseline, generated, owner, author, counts, approval]
    optional: [changes_from_v0_1, changes_from_v0_2]
  precedence:
    required: [text, plain, binds, mechanism, rationale]
    optional: []
  article:
    required: [id, title, tier, binds, statements, plain, rationale, mechanism]
    optional: [relations, retreat, amended_by, supersedes_v1, note]
  mechanism:
    required: [kind, live]
    optional: [note, stage, polarity]
    stage_polarity_required_for: [reject, build-check]   # 極性一覧（P-18.3）の元データ
  amendment_scope: [schema, precedence, articles]         # A-2 / N-4 の baseline diff の母集合（条文 = 各条の id / title / statements / tier / binds）
  statement:
    required: [id, pattern, strength, text]
    one_sentence: true            # 1 規範文 = 1 文（「。」1 つ）
    one_polarity: true            # strength must-not ⇔ 文末が「〜ない。」／ must・should ⇔ それ以外
    numbers: forbidden            # 数値は書かず rules 行の id で参照する（P-5）
    language: ja-first            # 専門語は日本語を先・原語は括弧。裸の英語キーワードを置かない（G10）
  plain:
    required: true                # 全枝番の義務を落とさず・足さず・強度を変えない（受入 (f)・R-10）
  enums:
    tier: [always, ask-first, never]
    binds: [tool, practice, both]
    pattern: [ubiquitous, event, state, unwanted, optional]
    strength: [must, must-not, should]
    rationale_kind: [v1-incident, scribe2-article, folio2-ruling]
    mechanism_kind: [reject, build-check, human-review, none]
    mechanism_live: [now, M0, delivery-0, M1, adr]   # その機構がいつ実在するか
    retreat_kind: [spike, measure, ruling]
    stage: [in-loop, post]                             # 編集時に止める / 事後（生成時・検査時）
    polarity: [fail-open, fail-closed]                 # 仕掛けが壊れたとき 通す / 止める
  mechanism_live_meaning:
    now: 発効（design-intent/ と CLAUDE.md の配置）の時点で、不合格を出せる検査が実在する
    M0: 要件書 M0 の受入で実在する
    delivery-0: 便 0（CI と編集時 guard）で実在する
    M1: M1 で実在する
    adr: 判断の記録（ADR）の正本 schema が置かれたときに実在する
  mechanism_kind_meaning:
    reject: 実行時に機械が操作そのものを拒む（操作は起きない）。操作の口を持たないこと（削除の経路が無い等）も含む
    build-check: 生成・検査の時点で機械が判定し、不合格なら成果物を出さない
    human-review: 人が目で確かめる（機械可読な根拠があればそれを見る）
    none: 機構なし（note に理由が必須）
  mechanism_live_rule: kind が reject / build-check でも live が now でない条は、その検査結果を「まだ分からない」として出す（P-4.2）。
  tier_mechanism_allowed:         # G3「never = やろうとしたら機械が拒む」を検査できる形にした許容集合
    always: [reject, build-check, human-review, none]
    ask-first: [human-review, reject, build-check]   # 「聞いたか」を機械が確かめる形（A-2 の baseline diff）も座れる
    never: [reject, build-check]
  tier_precedence: [never, ask-first, always]   # 段どうしが衝突したときの優先（前文が言う）
  preamble: precedence            # precedence は条ではなく全条に先立つ前文（scribe2 と同じ扱い・F9）

