north_star:
  statement: 非エンジニアが AI と相談しながら、必要な設計文書だけを、同じ見た目で迷わず持てる
  for_whom: 持ち主（非エンジニア）と、それを読む AI。同じページを両方が読む。人には「やさしく言うと」、AI には機械のための面。
  judged_by: 要件書 §5 受入基準

# 前文（条ではない・全条に先立つ・F9 は承認要求の論点）
precedence:
  text: 条どうしが衝突したら「網羅より揃い ／ 速さより黙らないこと ／ 賢さより戻せること」の順で解き、段どうしが衝突したら「絶対にやらない ＞ 確認してから ＞ いつも守る」の順で解く。
  plain: 迷ったら「全部そろえる」より「そろっている」、「早い」より「黙って飛ばさない」、「賢い」より「元に戻せる」を選びます。段が食い違ったら、「絶対にやらない」＞「確認してから」＞「いつも守る」の順で強い方が勝ちます。
  binds: both
  mechanism: {kind: none, live: now, note: 判断の規則であって機械では検査できない。生成区間（P-14）の先頭に写す。}
  rationale:
    - {kind: folio2-ruling, ref: "見本 v4 §0「迷ったらどちらへ倒すか」（walk 承認済み・2026-09-12）"}
    - {kind: scribe2-article, ref: "順位は条 id を持たず全条に先立つ（scribe2 憲法 §1）"}

articles:

  # ───────────────────────── Always（いつも守る）─────────────────────────
  - id: P-1
    title: 判断する道具を作らない
    tier: always
    binds: tool
    statements:
      - {id: P-1.1, pattern: ubiquitous, strength: must, text: folio は文書を生成し、機械で検査し、結果を知らせるところまでを担う。}
      - {id: P-1.2, pattern: ubiquitous, strength: must-not, text: folio は要否・採否の最終判断を代行する機能を持たない。}
    plain: 道具は、書類を作って、間違いを見つけて、知らせるところまで。「これでいいか」を最後に決める機能は、道具の側に作りません。決めるのはあなたです。
    rationale:
      - {kind: v1-incident, ref: "research/document-discipline-engine-design §11（判断は人間・「判断する engine」を作らない）"}
      - {kind: folio2-ruling, ref: "裁定 #1（推奨で進み、支度表で覆す）"}
    mechanism: {kind: build-check, live: M0, stage: post, polarity: fail-closed, note: 公開する命令（subcommand）の値域は実装の型付きの定数で閉じ、その全数一致を歯 p1_commands_closed_list（凍結の一覧との突き合わせ・P-10.1）が数える。採否を決める口の不在は、その一覧に採否を決める命令が無いことで表す。支度表は「推奨で進めた項目」を別枠に出す（FR2・AC1）。}
    relations: {reqs: [FR1, FR2, AC1]}

  - id: P-2
    title: 提示層は単一の生成器が所有する
    tier: always
    binds: tool
    statements:
      - {id: P-2.1, pattern: ubiquitous, strength: must, text: 人が読むページはすべて 1 つの生成器から出力する。}
      - {id: P-2.2, pattern: ubiquitous, strength: must-not, text: 手書きのページを配信先と入口の導線に置かない。}
      - {id: P-2.3, pattern: ubiquitous, strength: must, text: 色・字の大きさ・余白の元の値（design token）は 1 か所で定義する。}
      - {id: P-2.4, pattern: ubiquitous, strength: must, text: 部品・図の型・密度 profile は閉じた一覧（部品目録）で持ち、追加には判断の記録を要する。}
    plain: 見た目を作る係は 1 つだけ。誰かが手でページを書き足すと、そこから見た目が割れていくので、見せる置き場（配信先）にも入口の案内にも、手書きのページは置きません。色や字の大きさ・余白の元の値も 1 か所。使える部品・図の型・文書の密度の設定（密度 profile）は決まった一覧にあるものだけで、一覧に足すときは判断の記録が要ります。
    rationale:
      - {kind: v1-incident, ref: "提示層 3 系統 + token 2 系統で積集合 0・原因は所有者が 2 つ（報告 軸 5・ADR-0039 → 0054）"}
      - {kind: folio2-ruling, ref: "裁定 #4（v1 P-2 を置換）"}
    mechanism: {kind: build-check, live: now, stage: post, polarity: fail-closed, note: 全面の class と data-component を部品目録の値域と突合し目録外 0（R-3）、床が掛からないページ 0（NFR2・AC2）、図の型は R-5 の一覧内。床は folio parts --check（数える面は入口・憲法・要件書・判断の記録・設計ノートの 5 つ）。色や字の大きさが design token 由来である割合（R-3 の後半）を数える口は無く、その部分の充足は「まだ分からない」として扱う（P-4.2）。床が掛からないページは、読み物が 2026-09-21 に退役して 0 枚になった（要件書 NFR2 の注）。密度 profile の閉じた一覧は部品目録（preview/parts.json の profile_enum・組み立て時に導出する実装の定数）に在る（便 68・2026-09-21 着地）＝条 P-2.4 が名指す置き場の中。}
    retreat: {kind: spike, condition: 単一生成器で v1 要件書相当の密度が出せない（spike 5）なら再検討する。}
    supersedes_v1: {doc: folio v1 憲章, article: "P-2: format は HTML + common.css のみ", ruling: "裁定 #4", rationale: 見た目が割れた原因は形式（HTML か Markdown か）ではなく、所有者が 2 つあったこと。}
    relations: {reqs: [FR4, NFR2, AC2], rules: [R-3, R-5]}

  - id: P-3
    title: 検査は二層 — 機械の床と AI の天井
    tier: always
    binds: tool
    statements:
      - {id: P-3.1, pattern: ubiquitous, strength: must, text: 機械で決定的に検査できる項目は床に置く。}
      - {id: P-3.2, pattern: ubiquitous, strength: must, text: 意味の検査（読みやすさ・忠実さ）は AI の天井に置く。}
      - {id: P-3.3, pattern: ubiquitous, strength: must-not, text: 床の合格を、完成や天井の合格として扱わない。}
    plain: 機械が数えられること（部品が揃っているか等）は機械の側に、意味（分かりやすいか等）は AI の側に置きます。機械の合格は「壊れていない」であって「良い」ではありません。床の合格を「できあがり」としても扱いません。
    rationale:
      - {kind: v1-incident, ref: "ADR-0028 §2.1 / ADR-0045 §2.3（二層 enforcement・CEILING=PENDING）"}
      - {kind: folio2-ruling, ref: "裁定 #6（gate I は実行したら blocking・未実行は Pending）・G15=A（P-3 を置き場を定める条へ弱める）"}
    mechanism: {kind: build-check, live: M0, stage: post, polarity: fail-closed, note: 層の別は命令の別（天井 = folio ceiling --check〔AI の所見を数える〕だけ・ほかの命令の --check と folio check はすべて床。folio ceiling --stamp〔周の結果から印を導出する〕と --gate〔印と正本の要約値から 3 値を決定的に返す〕は、命令の名が天井の側に在っても床の性質を持つ＝AI を動かさず決定的である）と面の名札（天井の名札・便 40）で表す。検査を一覧として持ち、その各行に層の欄を付けて数える口は未実装なので、その部分の充足は「まだ分からない」として扱う（P-4.2）。未実行の天井は P-4.2 により「まだ分からない」（FR5・AC3）。}
    relations: {reqs: [FR5, AC3], rules: [D-12], articles: [P-4]}

  - id: P-4
    title: 黙って飛ばさない（fail-closed）
    tier: always
    binds: tool
    statements:
      - {id: P-4.1, pattern: ubiquitous, strength: must-not, text: 検査・生成が実行できなかった結果を「異常なし」として扱わない。}
      - {id: P-4.2, pattern: ubiquitous, strength: must, text: 判定できないものは「まだ分からない」として表に出す。}
    plain: できなかったことを「問題なし」に化けさせません。分からないときは「まだ分からない」と表示します。
    rationale:
      - {kind: v1-incident, ref: "engine-design §12 ②（parser-differential に 2 連続で敗北 → 受理域を絞る fail-closed へ転換）・ADR-0045 no silent skip"}
    mechanism: {kind: build-check, live: M0, stage: post, polarity: fail-closed, note: 床を故意に壊した状態で「まだ分からない」になり、合格にならない（AC3）。判定の値域は 合格 / 不合格 / まだ分からない の 3 値。}
    relations: {reqs: [FR5, AC3], rules: [D-5, R-14]}

  - id: P-5
    title: 規則は型付きデータに置き、番号で呼ぶ
    amended_by:
      - {adr: ADR-11, date: 2026-09-20, approved_by: 持ち主, ruling: f2-648 notes 2026-09-20 00:09 JST（発効の承認・判断の記録 ADR-11 と憲法 第 1.1 版と rules 行 D-11 を 1 つの承認で発効する承認要求への回答）, previous_text: 規則・閾値・型の一覧は型付きデータ（正本 YAML・rules 行・部品目録）に置く。, rationale: 実装の型付きの定数を規則の正本の置き場として括弧に明記する（天井の 2 周目の整合の止める所見・判断の記録 ADR-11）。}
      - {adr: ADR-11, date: 2026-09-20, approved_by: 持ち主, ruling: f2-648 notes 2026-09-20 00:09 JST（発効の承認・判断の記録 ADR-11 と憲法 第 1.1 版と rules 行 D-11 を 1 つの承認で発効する承認要求への回答）, previous_text: （新設）, rationale: P-5.6 の新設。実装の型付きの定数を規則の正本とするあいだ、人が読める写しを設計文書の置き場へ導出する義務を置く（判断の記録 ADR-11）。}
    tier: always
    binds: both
    statements:
      - {id: P-5.1, pattern: ubiquitous, strength: must, text: 規則・閾値・型の一覧は型付きデータ（正本 YAML・rules 行・部品目録・実装の型付きの定数）に置く。}
      - {id: P-5.2, pattern: ubiquitous, strength: must, text: 文書と台帳（bd）からは、規則を id で参照する。}
      - {id: P-5.3, pattern: ubiquitous, strength: must, text: 文書の種類による違いは、汎用の検査と密度 profile のデータで表す。}
      - {id: P-5.4, pattern: ubiquitous, strength: must-not, text: 台帳（bd）はタスクと裁定の記帳先であり、規則を置かない。}
      - {id: P-5.5, pattern: ubiquitous, strength: must, text: 原則と裁定の正本は設計文書、機械が執行する規則の正本は型付きデータとし、置き場をこの 2 面に限る。}
      - {id: P-5.6, pattern: state, strength: must, text: 実装の型付きの定数を規則の正本とするあいだ、その写しを人が読める型付きデータとして設計文書の置き場へ決定的に導出する。}
    plain: 「こうしてね」と文章に書いただけでは、AI は守り続けられません。守らせたい規則は表に載せ、番号で呼びます。文書の種類ごとの違いも、種類ごとに検査を分けず、どの種類にも同じ 1 つの検査（汎用の検査）と、見せ方の設定の表（密度 profile）で表します。台帳（タスクと持ち主の決めごとの帳簿）には規則を書きません。原則と裁定は設計文書に、機械が守らせる規則は表に、置き場はこの 2 つだけです。道具の中に型を付けて書いた決まりも表の 1 つに数えますが、それを元にしているあいだは、人が読める表（型付きデータ）の形の写しを、機械が何度やっても同じ結果になる形で作って、設計文書の置き場に置き続けます。
    rationale:
      - {kind: scribe2-article, ref: "C1（規則はデータ）・C14（規律は文書とデータの 2 面）・C15 / C15.2（台帳はタスク専用・id 参照）。C1 の「値は 1 file」は G14=A により folio2 では憲法 / rules / 語彙 / 要件書の 4 file に分ける（意図的な逸脱）"}
      - {kind: v1-incident, ref: "folio/CLAUDE.md:18「本 hook は tier-2 shaping であって guarantee ではない」＝規則が散文にしか無い・rules.html 248KB の散文"}
      - {kind: folio2-ruling, ref: "G2=C（二層: 憲法は道具の折れない線・開発規律は型付きデータ）・G14=A"}
    mechanism: {kind: build-check, live: now, stage: post, polarity: fail-closed, note: 参照 id の未解決 0（R-4・双方向・NFR3）。rules 表の各行に裁定 id 列（P-17）。散文だけの規則は N-2 が落とす。P-5.6 は、写しが在る定数については folio schema --check が導出との byte 一致を数える（FR19）。写しがまだ無い定数を数える口は無く、その間 P-5.6 の充足は「まだ分からない」として扱う（P-4.2・判断の記録 ADR-11 の便で対象を足す・範囲は rules 行 D-11）。床は folio check（day-1 の検査 script は退役済み）。}
    relations: {reqs: [NFR3, AC6, FR19], rules: [R-4, R-9, R-10, R-11, R-12, D-11], articles: [N-2, P-17, P-6, P-4]}

  - id: P-6
    title: 正本は 1 つ、ほかはそこから導出する
    tier: always
    binds: tool
    statements:
      - {id: P-6.1, pattern: ubiquitous, strength: must, text: folio が生成する各文書の正本は YAML 1 file であり、人が読むページはそこから逐語で生成する。}
      - {id: P-6.2, pattern: ubiquitous, strength: must-not, text: 生成物を手で直さない。}
      - {id: P-6.3, pattern: ubiquitous, strength: must, text: 同じ内容を 2 つの面が持つとき、一方を正本とし、他方は導出する。}
      - {id: P-6.4, pattern: ubiquitous, strength: must-not, text: 2 つの面を人が書き、一致を検査で強制する設計を採らない。}
    plain: 文書 1 つにつき「元のファイル」は 1 つ。見えているページはそこから作った写しなので、直したいときは元を直し、写しを手で直してはいけません。同じことが 2 か所に要るときは片方から自動で作り、「両方を手で書いて合っているか見張る」形は採りません。
    rationale:
      - {kind: folio2-ruling, ref: "裁定 #4（正本 YAML・HTML は生成物）"}
      - {kind: v1-incident, ref: "v1 憲法の正本が手書き HTML（origin 22,748 byte）で、消費側（scribe2）が 834 行の HTML parser を自作した（ADR-0051 層分離・ADR-0045 逐語 extract）。生成物は 90,122 byte"}
      - {kind: v1-incident, ref: "ADR-0033 §2.3 で Option B（両面手書き + gate）を選び、45 日後（2026-05-29 → 07-13）の ADR-0050 で Option A'（正本から derive）へ全面転換。ADR-0052（手動同鏡は人の規律に依存し実際に drift）"}
    mechanism: {kind: build-check, live: now, stage: post, polarity: fail-closed, note: 正本から再生成して差分 0 でなければ落とす（folio inject --check〔CLAUDE.md の生成区間〕・folio build --check〔配信先の全面〕・folio face と folio figure と folio schema の --check。読み物の folio render --check は 2026-09-21 に退役）。消費側が別の正本層を宣言する文書（例えば scribe2 憲法は HTML が正本）は folio の生成対象外で、読むだけ。}
    retreat: {kind: spike, condition: 憲法の改訂表現（del/ins・amended_by）が YAML で表せないと spike 1 で分かったら、憲法だけ二正本 + byte 束縛へ退避する。}
    relations: {reqs: [FR4, FR6], articles: [P-14]}

  - id: P-7
    title: 番号は増やすだけ（append only）
    tier: always
    binds: both
    statements:
      - {id: P-7.1, pattern: ubiquitous, strength: must-not, text: 要件・条文・判断・受入基準の id を再利用・改番しない。}
      - {id: P-7.2, pattern: ubiquitous, strength: must, text: 廃止は状態（status）で表し、番号は空けたままにする。}
    plain: 一度つけた番号は、消したり付け替えたりしません。「3 番は廃止」と書いて、3 番の番号は空けたままにします。
    rationale:
      - {kind: v1-incident, ref: "ADR-0034 §2.2。v1 では append-only は守られた側で、実害は逆＝48 ADR が全部 accepted で「取り消した決定」を機械で引けない（→ P-7.2）"}
    mechanism: {kind: build-check, live: delivery-0, stage: post, polarity: fail-closed, note: meta.binding が true の直近版を baseline に取り、id の消失・意味の差し替えを落とす。発効前（binding false）は baseline が無いので検査対象外＝散文の適用除外ではなく機構の定義。baseline は 2 つ＝憲法（design-intent/anchors/ の constitution-v*.yaml・実装 anchor.rs）と、要件・判断・受入基準の id の一覧（同じ置き場の ids-v*.yaml・id と規範文の要約値だけ・実装 ids.rs・凍結は folio check --freeze-ids）。id の一覧の側は、baseline の id が現行に無ければ P-7（番号を消した）、その要約値が現行の別の id に在れば P-7.1（同じ本文を別の番号に付け替えた）で落とし、ids- の anchor が 1 本も無ければ まだ分からない に落とす。}
    relations: {reqs: [NFR3]}

  - id: P-8
    title: 撤退条件を決定と同時に書く
    tier: always
    binds: practice
    statements:
      - {id: P-8.1, pattern: ubiquitous, strength: must, text: 取り消しにくい判断（ADR）には、それを捨てる条件を同時に書く。}
    plain: 判断の記録（ADR）を書くときは、「うまくいかなかったら、こうなった時点でやめる」も一緒に書きます。
    rationale:
      - {kind: v1-incident, ref: "ADR-0047 §2.4（confirmed 偽陽性 1 件で warn へ戻す・判断者は user）"}
    mechanism: {kind: build-check, live: now, stage: post, polarity: fail-closed, note: 判断の記録（ADR）の正本 schema で retreat 欄を必須にする（空なら生成が落ちる）。その schema は判断の記録の置き場の欄の決まり（adr/schema.yaml）が持ち、床は folio check が数える。}
    relations: {sections: [§6]}

  - id: P-10
    title: 検査の物差しを、検査されるものから独立に持つ
    tier: always
    binds: tool
    statements:
      - {id: P-10.1, pattern: ubiquitous, strength: must, text: 検査は、生成側からも検査側からも独立した凍結 anchor（固定の fixture）を 1 本以上持つ。}
      - {id: P-10.2, pattern: ubiquitous, strength: must-not, text: 生成物どうしの突き合わせを唯一の合格判定にしない。}
      - {id: P-10.3, pattern: unwanted, strength: must, text: anchor が維持できなくなった検査の結果は「まだ分からない」に落とす。}
    plain: 「自分で作ったものと自分で作ったものを見比べて OK」は、何でも OK になってしまうので、それだけでは合格にしません。作る側からも検査する側からも独立した、動かない基準を 1 つ以上、別に置きます。その基準が保てなくなった検査は「まだ分からない」に戻します。
    rationale:
      - {kind: v1-incident, ref: "ADR-0053（flip 後 ORIG==生成物 で自己比較恒真化・任意値 PASS → 凍結 literal census + round-trip + 敵対 test の三本柱へ。再発ハザードへの予防的退役・user 裁定 2026-07-18）"}
    mechanism: {kind: build-check, live: M0, stage: post, polarity: fail-closed, note: 凍結 fixture を検査の入力に持ち、fixture 不在は「まだ分からない」、fixture との不一致は「不合格」に落とす。}
    relations: {articles: [P-3, P-4]}

  - id: P-11
    title: 同じ穴が繰り返したら、止めて人へ渡す
    tier: always
    binds: both
    statements:
      - {id: P-11.1, pattern: event, strength: must, text: 同じ種類の失敗が rules 行 R-7 の回数を超えたとき、自動の修正を続けず、止めて持ち主へ渡す。}
    plain: 同じ穴に何度もはまるなら、機械が粘るのをやめて人に相談します。「何度まで」は表（R-7 行）で決めます。
    rationale:
      - {kind: v1-incident, ref: "engine-design §12（parser-differential の whack-a-mole を round 1 / round 2 の 2 連続で実証 → user 判断で fail-closed へ転換）"}
    mechanism: {kind: reject, live: delivery-0, stage: post, polarity: fail-closed, note: 便・並列実行の再試行回数を R-7 で上限にし、超えたら止める。「同じ種類」の判定は R-7 行の same_failure 欄が定める。回数を数えて止めるのは席と器（scribe2）で、folio は数える面を持たない＝この実態と実測の正本は rules 行 R-7 の注であり、ここには写さない。}
    relations: {rules: [R-7, D-4], articles: [P-1]}

  - id: P-12
    title: 承認は 1 つの面から、言葉どおりに残す
    tier: always
    binds: practice
    statements:
      - {id: P-12.1, pattern: ubiquitous, strength: must, text: 持ち主の承認は、rules 行 R-8 が指す 1 つの対話面を通ったものだけを受け取る。}
      - {id: P-12.2, pattern: ubiquitous, strength: must, text: 受け取った承認は、逐語と日付を添えて台帳の notes と文書の承認欄に記帳する。}
      - {id: P-12.3, pattern: ubiquitous, strength: must-not, text: 会話の記憶を承認の根拠にしない。}
    plain: 「OK と言った」は、決まった 1 つの場所（対話面）を通ったものだけ。言葉どおりに、日付つきで、台帳と文書の承認欄の両方に残します。「前に OK と言っていたはず」という記憶は承認の代わりになりません。
    rationale:
      - {kind: scribe2-article, ref: "C7 / C7.2（対話面は 1 つ・逐語で記帳）"}
      - {kind: folio2-ruling, ref: "G8=A（C7 を足す）・運用実績（G1〜G16・P1〜P5 の裁定はすべて bd notes の逐語）・受入 (c)"}
    mechanism: {kind: build-check, live: M0, stage: post, polarity: fail-closed, note: 承認欄（approval）の逐語・日付・裁定 id・対話面の欄充足を schema で検査する。「どの面を通ったか」の同定は人が見る。day-1 は bd notes の逐語を人が確かめる。}
    relations: {rules: [R-8, D-10], sections: [§6]}

  - id: P-13
    title: 拘束するのは設計文書、前の版は道具、自分を作るのは最後
    tier: always
    binds: practice
    statements:
      - {id: P-13.1, pattern: ubiquitous, strength: must, text: folio2 の開発を拘束するのは設計文書（design-intent）である。}
      - {id: P-13.2, pattern: ubiquitous, strength: must-not, text: 前の版（folio v1）を、受入の物差し役にも停止権の持ち主にもしない。}
      - {id: P-13.3, pattern: ubiquitous, strength: must, text: 設計文書の変更は、判断の記録か版付きの文書として残す。}
      - {id: P-13.4, pattern: state, strength: must, text: 自分のコードの変更を自分の便で運ぶ運用（self-host）は、外部の利用者で受入が通った後に始める。}
    plain: 何が正しいかを決めるのは設計文書で、前の道具ではありません。前の道具（folio v1）は使ってよいが、正しさの物差しにも止める権限にもしません。設計文書を変えたら、その記録（判断の記録か新しい版）を残します。自分の便で自分のコードを運ぶのは、よそで使ってもらって合格した後＝いちばん最後です。
    rationale:
      - {kind: scribe2-article, ref: "C8 / C8.3（前の版を物差しにしない・design-intent の変更は ADR か版付き文書）。C8.2 は P-18 へ"}
      - {kind: v1-incident, ref: "self-host の層解釈と oracle 死角に ADR 6 本（0044 / 0045 / 0050 / 0051 / 0053 / 0056）"}
      - {kind: folio2-ruling, ref: "G7=A（C8 を移行条項つきで写す）・G6=A（順序は別条）・要件書 CON4（v1 は読むだけ）"}
    mechanism: {kind: build-check, live: M0, stage: post, polarity: fail-closed, note: folio2 の生成器・検査器が v1 の path に書き込み口を持たない（CON4）。書き込み先は呼び手が渡す出力先の指定だけだが、そのことを歯で固定してはいない（2026-09-20 時点）＝回帰を検出する口が無く、その部分の充足は「まだ分からない」として扱う（P-4.2）。v1 側の guard 設定の目視は開発規律 D-9。}
    note: scribe2 は ADR-0003 で「成熟宣言 + user go」の解禁 gate を廃止した。folio2 が P-13.4 の順序を残すのは G6=A（順序は別条）の裁定による。それまでは v1 の生成器と手作業を道具として使う（CON4）。
    relations: {reqs: [CON1, CON4], rules: [D-7, D-9], articles: [A-4, P-18]}

  - id: P-14
    title: 憲法を AI の手元へ写す（注入）
    amended_by:
      - {adr: ADR-11, date: 2026-09-20, approved_by: 持ち主, ruling: f2-648 notes 2026-09-20 00:09 JST（発効の承認・判断の記録 ADR-11 と憲法 第 1.1 版と rules 行 D-11 を 1 つの承認で発効する承認要求への回答）, previous_text: 生成区間の総バイト数は rules 行 R-2 以下に収める。, rationale: 語彙の生成区間の定義を広げるのに合わせ、注入の上限が掛かる対象を CLAUDE.md の生成区間と明記する（判断の記録 ADR-11）。}
    tier: always
    binds: tool
    statements:
      - {id: P-14.1, pattern: event, strength: must, text: folio inject --write を実行したとき、憲法の前文と規範文を持つ条を CLAUDE.md の生成区間へ決定的に導出して書く。}
      - {id: P-14.2, pattern: event, strength: must, text: folio inject --check は生成区間と正本の差分を検出し、差があれば失敗（非 0）で終える。}
      - {id: P-14.3, pattern: ubiquitous, strength: must, text: CLAUDE.md の生成区間の総バイト数は rules 行 R-2 以下に収める。}
    plain: 憲法の前文と「守らせる条」を、AI が毎回読む場所（CLAUDE.md）に、何度やっても同じ結果になる形で写します。ずれていたら検査が失敗して止まります。写す量には上限（R-2 行）があります。
    rationale:
      - {kind: folio2-ruling, ref: "受入 (b)・注入の所有（規格は folio・呼ぶのは consumer・pointer 化は却下）・G9=A（上限は rules 行）・G13=A（母集団は規範文を持つ条）"}
      - {kind: scribe2-article, ref: "C1.2（人が読む規則の文書は型から生成し、手書きの規範文は 0 行）"}
    mechanism: {kind: build-check, live: now, stage: post, polarity: fail-closed, note: --check の byte 一致（AC4）。R-2 超過は落とす。生成と検査は同じ導出関数（day-1 は inject_check.py・M0 で folio inject）。注入する欄は R-2 行の projection 欄が定める。同型の実装は scribe2 の xtask gen-claude-md / check claude-md-constitution（条ではなく実装）。}
    relations: {reqs: [FR6, AC4, NFR1], rules: [R-2], articles: [P-6]}

  - id: P-15
    title: 自動の仕掛けに寄りかからない
    tier: always
    binds: tool
    statements:
      - {id: P-15.1, pattern: ubiquitous, strength: must-not, text: 自動で走る仕掛け（hook）を「守られる保証」として設計しない。}
      - {id: P-15.2, pattern: ubiquitous, strength: must, text: 編集の時点で止める仕掛けを持つときは、その判定の式を事後の検査が同じ関数で確かめる。}
    plain: 「自動で止まるはず」を頼りにしません。止まらなかったときにも壊れない作りにします。編集の時点で止める仕掛けを置くなら、後から確かめる検査も、その判定を同じ 1 つの関数で見ます（同じ中身を別々に 2 か所へ書いたのでは足りません）。
    rationale:
      - {kind: v1-incident, ref: "folio/CLAUDE.md:18 逐語「本 hook は tier-2 shaping であって guarantee ではない」・ADR-0043 §2.3"}
      - {kind: v1-incident, ref: "plugin-lib.sh:238 / check-content-boundary.sh:55（hook と事後検査が 2 実装の人間同期＝drift の実体）"}
    mechanism: {kind: build-check, live: M1, stage: post, polarity: fail-closed, note: 編集時の判定の式と事後検査が同一関数であることを test で固定する（advisory ⊆ guarantee）。folio2 に hook が置かれるまでは対象が無い。}
    note: 見本 v4 では N-1（Never）。G3 の軸（Never = 機械が拒む）では拒む形にできないため Always へ移した。「止める仕掛けを持つこと」自体の義務は P-18。
    relations: {rules: [D-6], articles: [P-18]}

  - id: P-16
    title: 設計判断を下す席は、その時点で最上位のモデルで動かす
    tier: always
    binds: practice
    statements:
      - {id: P-16.1, pattern: ubiquitous, strength: must, text: folio の設計判断を下す席は、その時点で最上位の AI モデルで動かす。}
      - {id: P-16.2, pattern: ubiquitous, strength: must-not, text: 道具（並列実行・便・作業者）の内側には最上位のモデルを求めない。}
    plain: 設計を考える席には、そのとき一番賢い AI を使います。手足として動く道具の中まで同じにする必要はありません。
    rationale:
      - {kind: folio2-ruling, ref: "user 2026-09-12 15:49 前提 (2)・17:1x 裁定 1 / 4（席のみ・道具の内側は opus まで）・4 層の置き場（憲法 = 性質のみ）"}
      - {kind: v1-incident, ref: "ADR-0021（不変原則に可変の固有名を書くと下流の更新のたびに改憲を強いられる → 現行のモデル名は要件書 CON5 へ）"}
    mechanism: {kind: human-review, live: now, note: 席の起動時に model と effort を見る。機械可読な根拠（席の transcript の assistant.model）があるのでそれを見る（目視で取り違えた実績が f2-648.1 notes にある）。現行の該当（モデル名・effort）は要件書 CON5 が持つ。}
    retreat: {kind: ruling, condition: 「最上位」の判定が割れて運用が止まるなら、要件書 CON で名指しする形へ退避する。}
    relations: {reqs: [CON5], rules: [D-1, D-2]}

  - id: P-17
    title: 数値の表を変えるときは、裁定 id を行に付ける
    tier: always
    binds: both
    statements:
      - {id: P-17.1, pattern: ubiquitous, strength: must, text: rules 表（R-n・D-n）の行の追加・変更は、裁定 id と時刻を行に付ける。}
      - {id: P-17.2, pattern: unwanted, strength: must, text: 裁定 id の無い rules 行の変更があったら、検査がそれを落とす。}
      - {id: P-17.3, pattern: ubiquitous, strength: must, text: 初版の行は、この憲法の発効の承認を裁定とみなし、発効時にその id と時刻を全行に付ける。}
      - {id: P-17.4, pattern: event, strength: must, text: folio の振る舞いを縛る閾値行（deny 種別）の値を緩めるとき、A-2.3 の検証を前置する。}
    plain: 数値や作法の表を変えるときは、どの決定（裁定の番号）でいつ変えたかを行に書きます。書いていない変更は機械が止めます。最初の表は、この憲法の承認をその決定として扱い、承認のときに番号と日付を全部の行に入れます。機械が測って落とす閾値の行（deny 種別）の線をゆるめるときは、改訂と同じように反対側から確かめてからにします。
    rationale:
      - {kind: scribe2-article, ref: "C5（規則変更 = manifest diff + 裁定 id）・A2（C4 / C13 の閾値変更にも grill 検証を前置）"}
      - {kind: folio2-ruling, ref: "G5=A（A-2 を条文改訂と rules 数値に分割）"}
    mechanism: {kind: reject, live: delivery-0, stage: post, polarity: fail-closed, note: rules 行の差分に裁定 id と時刻が無ければ落とす。この差分を数える口は未実装である（2026-09-20 時点・便 0 は 2026-09-17 に着地したが、その検査は置かれなかった）。それまでは取り込みの要求の差分を人が見るにとどまり、P-17.1 / P-17.2 / P-17.4 の充足は「まだ分からない」として扱う（P-4.2）。}
    relations: {rules: [R-1, R-2, R-3, R-4, R-5, R-6, R-7, R-8, R-9, R-10, R-11, R-12, R-13, R-14, R-15, R-16, D-3, D-5, D-8], articles: [A-2]}

  - id: P-18
    title: 逸脱は編集の時点で止める（極性一覧）
    tier: always
    binds: tool
    statements:
      - {id: P-18.1, pattern: event, strength: must, text: 編集が設計文書か rules と食い違うとき、その編集を編集の時点で止める。}
      - {id: P-18.2, pattern: ubiquitous, strength: must-not, text: 事後の検査を、編集の時点で止めることの代わりにしない。}
      - {id: P-18.3, pattern: ubiquitous, strength: must, text: 止める仕掛け（guard）は「開く／閉じる」の極性と「編集時／事後」の別を型で持ち、その一覧（極性一覧）を生成時に出す。}
      - {id: P-18.4, pattern: unwanted, strength: must, text: 編集の時点で止める guard が 1 本も無い構成なら、検査がそれを落とす。}
    plain: 決まりに反する書き換えは、書き換えたその場で止めます。「後で検査するから」は、その場で止めることの代わりになりません。止める仕掛けと検査には「壊れたら通す／止める」「その場／後で」の札を型として付け、その一覧は作るたびに機械が出します。その場で止める仕掛けが 1 つも無い状態は検査で落とします。
    rationale:
      - {kind: scribe2-article, ref: "C8.2（design-intent と食い違う編集は編集時に止める）・C16 / C16.2（事後検証を代替にしない・編集時 guard 0 の構成を CI が拒む）・C11.2（極性の型と build 時の極性一覧）"}
      - {kind: folio2-ruling, ref: "裁定 #3（scribe2 の機構条のうち「極性一覧」を写す）・G3=A（撤去コストは共通 1 行）"}
    mechanism: {kind: build-check, live: delivery-0, stage: post, polarity: fail-closed, note: 各条の mechanism の stage / polarity 欄と rules 行の stage 列から極性一覧を生成し、編集時（in-loop）の本数が rules 行 R-13 の下限を割れば不合格。極性一覧を出す口と R-13 を数える口は未実装である（2026-09-20 時点・day-1 の口は 2026-09-18 に退役し Rust の床へ写していない）。folio2 側の編集時 guard も 1 本も無い（設計ノートの欄の決まりの guards 欄が逐語でそう書く）。それまで P-18.3 / P-18.4 の充足は「まだ分からない」として扱う（P-4.2）。}
    note: v0.1 では P-15.2 の条件節（「持つときは」）に潰れ、scribe2 C16 が課す義務が落ちていた（敵対レビュー scribe2-consistency-02・-04）。
    relations: {rules: [R-13], articles: [P-15, P-13, P-4]}

  # ───────────────────────── Ask-first（実行前に持ち主へ聞く）─────────────────────────
  - id: A-1
    title: 消す・外へ出す・使う は確認してから
    tier: ask-first
    binds: both
    statements:
      - {id: A-1.1, pattern: event, strength: must, text: 既存の文書やデータを消す、外へ出す、外部の道具や鍵を使う（課金を含む）操作を行うとき、実行前に rules 行 R-8 の対話面で持ち主の確認を得る。}
    plain: 「消す」「外に出す（公開の場所へ置くことを含む）」「外の道具や鍵を使う（お金がかかるものを含む）」の 3 つは、道具が勝手にやらず、決まった対話の場所であなたに確認してからにします。
    rationale:
      - {kind: scribe2-article, ref: "A1（3 クラスの操作・C7 の対話面を通す）"}
      - {kind: folio2-ruling, ref: "G8=A・G14=A（承認済み生成物の PUBLIC repo への commit は「出す」＝人手 commit 1 本を確認の上で）"}
    mechanism: {kind: human-review, live: now, note: 会話面で確認し逐語を記帳（P-12）。便 0 以降は契約の自己申告（3 クラス）で便が止まり、承認の記帳で再開する（scribe2 の仕組み）。N-1 / N-6 が拒む操作は確認の対象にならない（拒まれる）。}
    relations: {rules: [R-8], articles: [N-1, N-6, P-12, A-4]}

  - id: A-2
    title: 憲法の条文を変えるとき
    tier: ask-first
    binds: practice
    statements:
      - {id: A-2.1, pattern: event, strength: must, text: 条文を改訂するとき、判断の記録と撤退条件を先に書き、持ち主の承認（逐語・日付・裁定 id）を得てから版を上げる。}
      - {id: A-2.2, pattern: ubiquitous, strength: must-not, text: 条文（id・見出し・規範文・段・縛る相手）と schema 節・前文が 1 文字も変わらない変更を改訂として扱わない。}
      - {id: A-2.3, pattern: event, strength: must, text: 改訂の前に、その改訂が主張する利益を敵対的に検証し（grill）、記録を判断の記録に添える。}
    plain: この文書は勝手に書き換えません。理由と撤退条件を書き、その改訂が本当に良いかを反対側から確かめてその記録を判断の記録に添え、あなたの OK（言葉どおり・日付・裁定の番号）を残してから版を上げます。条の番号・見出し・守らせる文・その条をいつも守るのか／確認してから変えるのか／絶対にやらないのか（段）・その条が縛る相手（道具の作りか、作る側の作法か）と、決まりの型（schema）・前文のどれ 1 つも変わらない直しは「改訂」ではありません。
    rationale:
      - {kind: scribe2-article, ref: "A2（主張された利益の grill 検証を前置 → user 裁定）"}
      - {kind: v1-incident, ref: "ADR-0056 §2.1（宣言内容を 1 文字も変えない生成経路の flip だけが「変更」に該当しない。宣言文・段・id・見出しの変更は対象）"}
      - {kind: folio2-ruling, ref: "G5=A（rules 数値の変更は P-17 へ分離）・G8=A（M4 は但し書き）"}
    mechanism: {kind: build-check, live: now, stage: post, polarity: fail-closed, note: 正本の baseline diff — 母集合は schema 節・前文・各条の id / title / statements / tier / binds（amendment_scope）。差分には対応する amended_by（adr・date・approved_by・ruling・previous_text・rationale）が要り、amended_by.adr が指す判断の記録の実在も同じ検査が確かめる（R-4 の母集合＝内部 3 空間は変えない・G15）。差分 0 なら A-2.2 の非改訂（自己申告では適用しない）。無ければ N-4 が落とす。}
    relations: {rules: [R-4], articles: [N-4, P-8, P-17], sections: [§6]}

  - id: A-3
    title: 依存する外部ソフトの増減
    tier: ask-first
    binds: tool
    statements:
      - {id: A-3.1, pattern: event, strength: must, text: 外部ライブラリを増やす・減らすとき、予算（rules 行 R-6）と使ってよい条件（ライセンス）に照らし、持ち主の確認を得る。}
    plain: 他人の作った部品を増やすときも減らすときも、本数の上限（R-6 行・まだ未定）と使ってよい条件（ライセンス）を見て、確認してから行います。
    rationale:
      - {kind: scribe2-article, ref: "A3 / C13（依存の予算・値は folio2 専用）"}
      - {kind: folio2-ruling, ref: "裁定 #3（依存予算は folio2 専用値）・G7=A（裁定 #3 の根拠「C8」は「C13」の誤りとして訂正）"}
    mechanism: {kind: reject, live: M1, stage: post, polarity: fail-closed, note: cargo deny + R-6 の予算（Rust が入ってから）。それまでは人が確かめる。}
    relations: {reqs: [CON2], rules: [R-6, R-15]}

  - id: A-4
    title: 自分で自分を作ること（self-host）は既定で許可、取り消せない操作だけ確認
    tier: ask-first
    binds: practice
    statements:
      - {id: A-4.1, pattern: ubiquitous, strength: must, text: folio が folio 自身の文書・コードを変える運用は、既定で許可する。}
      - {id: A-4.2, pattern: event, strength: must, text: その操作が取り消せない（消す・出す・使う）とき、A-1 として持ち主に確認する。}
      - {id: A-4.3, pattern: ubiquitous, strength: must, text: 取り込み（merge）・公開へ出ない便・外部依存を増やさない変更は、A-4.2 の判定で「取り消せる」と扱う。}
    plain: 道具が自分自身を作り変えるのは既定で OK。ただし取り消せない操作（消す・外に出す・外の道具や鍵を使う）だけは先に聞きます。取り込み・公開へ出ない便・外の部品を増やさない変更は「取り消せる」側で、公開の場所へ出す便は「出す」として A-1 で聞きます。順番（自分を作るのは最後）は P-13 が決めます。
    rationale:
      - {kind: scribe2-article, ref: "A4 / A4.3（現行: 既定で許可・不可逆だけ Ask-first・可逆の定義・ADR-0003）"}
      - {kind: folio2-ruling, ref: "G6=A（見本の A-4 は改訂前の写しで逆だった・現 A4 に揃える）・G8=A（M6 は A-4 の分割先）"}
    mechanism: {kind: human-review, live: now, note: A-1 と同じ経路。便 0 以降は契約の自己申告（3 クラス）が A-4.3 の分類を機械で持つ。}
    relations: {articles: [A-1, P-13]}

  # ───────────────────────── Never（やろうとしたら機械が拒む）─────────────────────────
  - id: N-1
    title: 取り消せない削除をしない
    tier: never
    binds: tool
    statements:
      - {id: N-1.1, pattern: unwanted, strength: must, text: 操作が管理下の対象を回復不能に削除するなら、folio はそれを拒む。}
      - {id: N-1.2, pattern: ubiquitous, strength: must, text: 退役（廃止）は可逆な移動としてのみ行う。}
    plain: folio が預かっているもの（元のファイル・作ったページ・支度表・台帳の記録）を、元に戻せない形では消しません（機械が止めます）。片づけるときは、戻せる形（移動）だけ。
    rationale:
      - {kind: scribe2-article, ref: "N1 / N1.2"}
      - {kind: folio2-ruling, ref: "G8=A（不可逆な削除は Never）"}
    mechanism: {kind: reject, live: M0, stage: post, polarity: fail-closed, note: 管理下の対象（正本・生成した面・支度表・台帳の記録）を消す経路を実装しない。決定的に作り直せる写しの作り直しに限り消す（folio ceiling --write が束の材料の置き場を作り直すとき・図の道具を撃つために folio 自身が作った一時の置き場）。退役は可逆な移動で行い、folio は退役の口を持たない。消す呼び出しをこの 2 つに限ることは歯で固定していない（2026-09-20 時点）。}
    relations: {articles: [A-1, P-7]}

  - id: N-2
    title: 文章にしか無い規則を、規則として扱わない
    tier: never
    binds: both
    statements:
      - {id: N-2.1, pattern: unwanted, strength: must-not, text: 変更が、散文・記憶・会話にしか無い規則を持ち込むなら、それを規則として扱わない。}
      - {id: N-2.2, pattern: unwanted, strength: must, text: 変更が、散文・記憶・会話にしか無い規則を持ち込むなら、検査がそれを落とす。}
    plain: 「文章に書いてあるから」「前に話したから」「覚えているから」はルールになりません。表に載せて番号で呼ぶ（P-5）まで、機械は守ってくれませんし、そういう変更は検査で落とします。
    rationale:
      - {kind: scribe2-article, ref: "N2 / C1.2（規則を散文・memory・chat にだけ置かない・生成された文書の中の手書き規範文は 0 行）"}
      - {kind: v1-incident, ref: "folio/CLAUDE.md:18 の散文 hook 規則・rules.html 248KB"}
    mechanism: {kind: build-check, live: now, stage: post, polarity: fail-closed, note: ① folio が生成する文書（配信先の面・CLAUDE.md 生成区間）の中に、正本に無い手書きの規範文が 0 行（再生成との差分 0 = folio build --check と folio inject --check。読み物の folio render --check は 2026-09-21 に退役）。② CLAUDE.md の生成区間の外に規範語（〜する。／〜ない。で終わる行）を置かない（folio inject --check が数える）。検査対象は folio2 が所有する文書に限る。}
    note: 見本 v4 の P-5（Always）に含まれていた禁止側を Never へ置いた（G12 の改番）。
    relations: {rules: [R-16], articles: [P-5, P-14, P-17]}

  - id: N-3
    title: 例外の仕組みを作らない
    tier: never
    binds: tool
    statements:
      - {id: N-3.1, pattern: unwanted, strength: must, text: 変更が規則の例外機構（無効化の旗・「今回だけ」の口）を足すなら、それを拒む。}
    plain: 「今回だけ特別」のスイッチを足す変更は、機械が止めます。変えたいときは正式に改訂します。
    rationale:
      - {kind: v1-incident, ref: "ADR-0047 §2.2（例外機構を導入しない＝逃げ道と規律を一致させる）"}
    mechanism: {kind: build-check, live: now, stage: post, polarity: fail-closed, note: 正本と rules の全節（top_level・meta・前文・条・規範文・mechanism・rules 行）で未知の欄を schema 検査が落とす（床は folio check）。}
    note: scribe2 N3（host 固有の分岐を code に焼かない）とは別の条。番号の一致は意図していない。
    relations: {articles: [A-2], sections: [§6]}

  - id: N-4
    title: 判断の記録と裁定 id を伴わない改憲をしない
    tier: never
    binds: practice
    statements:
      - {id: N-4.1, pattern: unwanted, strength: must, text: 条文の改訂が、判断の記録・裁定 id・承認の逐語のいずれかを欠くなら、それを拒む。}
    plain: 判断の記録・決定の番号（裁定 id）・あなたの OK の言葉、この 3 つが揃っていない書き換えは、機械が止めます。
    rationale:
      - {kind: scribe2-article, ref: "N4 / N4.2（新 ADR + delta marker + 裁定 id）"}
      - {kind: folio2-ruling, ref: "G5=A（N-4 新設）"}
    mechanism: {kind: build-check, live: now, stage: post, polarity: fail-closed, note: A-2 と同じ検査関数・同じ母集合（schema 節・前文・各条の id / title / statements / tier / binds）。対応する amended_by が無ければ落とす（A-2 は手続き・N-4 はその拒否）。}
    relations: {articles: [A-2], sections: [§6]}

  - id: N-5
    title: 文書の種類ごとに専用の AI 係を作らない
    tier: never
    binds: tool
    statements:
      - {id: N-5.1, pattern: unwanted, strength: must, text: 変更が文書の型ごとの AI 係（agent）や検査の観点（lens）を増設するなら、それを拒む。}
    plain: 文書の種類が増えるたびに専用の AI 係や検査の観点を増やすことは、機械が拒みます。違いは設定の表（P-5.3）で表します。係が増えると AI が毎回読む説明文が膨らんで、遅く・高くなるからです（v1 では 36 係になりました）。
    rationale:
      - {kind: v1-incident, ref: "agent 36 本・description 合計 29,027 字・ADR-0007 → 0055（Tier 1 → Tier 0 pointer digest へ降格）"}
    mechanism: {kind: reject, live: M0, stage: post, polarity: fail-closed, note: AI 係と検査の観点は閉じた一覧（部品目録と同型）で持ち、一覧外・文書型専用のものは 0（検査の観点は天井の正本の 4 つで閉じ、folio2 が自前で定義した AI 係は 0 本）。常時注入の総量は R-1 の上限で落とす。その母集団の定義と実測は規則の表の行 R-1 の注が持つ（ここには写さない・直前の「0 本」は自前で定義した係の数であって母集団の数ではない）。この上限を数える口は未実装である（2026-09-20 時点）＝その部分の充足は「まだ分からない」として扱う（P-4.2・要件書 NFR1 の注）。}
    relations: {reqs: [NFR1], rules: [R-1, D-3], articles: [P-5]}

  - id: N-6
    title: 見せる先を同じ端末の中と tailnet の外へ広げない
    amended_by:
      - {adr: ADR-12, date: 2026-09-21, approved_by: 持ち主, ruling: f2-648 notes 2026-09-21 20:33 JST（発効の承認・判断の記録 ADR-12 と憲法 第 1.2 版と要件書 v1.23 を 1 つの承認で発効する承認要求への回答）, previous_text: 配信（serve）の接続先（bind 先）が tailnet の外なら、起動を拒む。, rationale: 実装（便 17）は同じ端末の中（loopback）への配信を通し、外へ晒さない狙い（N-6.2）は損なわれない。同じ端末の中の住所は端末の外の機器から直には届かず、中継は「出す」操作として A-1.1 と N-6.2 が受ける＝外へ出る経路は改訂の前後で 1 本も増えない。見出しも同じ向きに改め（前の見出し = 見せる先を tailnet の外へ広げない）、前文の平易文の 3 段の順位の直しを同じ版に同梱した（天井の 17 周目の実態 F-1・13 周目の忠実さ F-1）。}
    tier: never
    binds: tool
    statements:
      - {id: N-6.1, pattern: unwanted, strength: must, text: 配信（serve）の接続先（bind 先）が、同じ端末の中（loopback）でも tailnet の中でもないなら、起動を拒む。}
      - {id: N-6.2, pattern: ubiquitous, strength: must-not, text: 配信の出力と、支度表・台帳の中身を、認証なしの公開ネットに晒さない。}
    plain: 見せる先は自分の端末どうしの私設ネット（tailnet）か、同じ端末の中（loopback）だけで、そのどちらでもない先へ向けた配信は機械が起動を止めます。配信で見せるページや、支度表・台帳の中身を、認証なしの公開の場所に出しません。承認済みの文書を版管理（公開 repo）へ置くのは別の話で、A-1 の「出す」として確認します。
    rationale:
      - {kind: folio2-ruling, ref: "要件書 CON3（tailnet のみ）・FR7・G8=A（出す（公開）の Never）・G14=A（承認済み HTML は design-intent/preview/ へ・生 IP は除去）"}
      - {kind: v1-incident, ref: "tailnet-serve の下限（tailnet の住所が無いと起動を拒む）"}
    mechanism: {kind: reject, live: now, stage: post, polarity: fail-closed, note: 接続先が同じ端末の中（loopback）でも tailnet の範囲でもないとき serve が起動を拒み、住所を明示しない起動は tailnet の住所を解けなければ拒む（FR7 の確かめ方・day-1 は tailnet-serve script）。}
    note: CON3 の強さは Never 相当なのに見本では A-1（Ask-first）に対応していたねじれを解いた。v0.1 の「生成物」は G14=A（PUBLIC repo への commit）と矛盾したため配信面に絞った。
    relations: {reqs: [CON3, FR7], rules: [D-8], articles: [A-1]}

# ───────────────────────── §5 rules（数値は条文に書かない）─────────────────────────
rules_pointer: 数値の決まりは 1 か所にまとめていて、この章がその表です。行は 2 種類あり、閾値行（R-n・超えてはいけない数）と開発規律行（D-n・進め方の決まり）です。条文は数値を書かずに行の番号で呼び、行はその数値が縛る条を指し返します。表の元の file は rules.yaml です。

