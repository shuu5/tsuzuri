# folio2 語彙 — 正本（v1.0・発効 2026-09-12）
# G11=A: データの正本はこの file・読者が引く場所は憲法 §7（HTML は生成物）・要件書 §8 は見出し + リンク。
# 床 = R-9（本文に出る専門語のうち語彙に無いもの 0）。目標は 20 語前後だが v0.2 は「未定義 0」を優先して 31 語（承認要求の論点）。
# 3 節: terms = 読者が引く語 / field_terms = 欄の名前（機械層・定義済みとして数える）/ identifiers = 英字の識別子（file 名・命令名・製品名・code の語）。R-9 は terms・field_terms・identifiers のどれにも無い英字の語を数える。
# 各語: id（slug・append only）/ term（見出し語）/ en（原語・無ければ null）/ short（1 行の平易な言い換え）/ def（定義）/ note（任意）。
# 定義文の中の専門語は、同じ語彙の別項か日本語の言い換えで閉じる（定義の閉包）。

terms:
  - {id: source-of-truth, term: 正本・生成物・生成器, en: source of truth / generated artifact / emitter, short: 元になる唯一のファイルと、そこから機械が作る写しと、作る係, def: 正本 = 元になる唯一のファイル（文書 1 つにつき 1 つ）。生成物 = 正本から機械が作ったもの（手で直さない）。生成器 = それを作る係。直したいときは正本を直す。}
  - {id: derived-artifact, term: 導出物, en: derived artifact, short: 正本から機械が作り、版管理の中にも置く写し, def: 正本から機械が決定的に作った写しのうち、生成物の棚ではなく版管理の中に置き、ほかの道具や AI がそれを読むもの（器〔scribe2〕が読む契約表の形・各 file の生成区間・CLAUDE.md の生成区間）。手で直さず、正本から作り直して差分 0 を数える（P-6.2・P-6.3・要件 FR11 / FR19）。}
  - {id: presentation-layer, term: 提示層, en: presentation layer, short: 人が読むページとその見た目の層, def: 人が読むページと、その見た目（部品・色・字の大きさ）をまとめた層。folio2 では 1 つの生成器だけが持つ（P-2）。}
  - {id: typed-data, term: 型付きデータ, en: typed data, short: 欄と値の型が決まった表, def: 欄と値の型が決まった表（正本 YAML・rules 行・部品目録・実装の型付きの定数）。機械が読んで検査できる。文章に書いた規則と違い、守らせられる（P-5）。実装の型付きの定数 = 道具の中に型を付けて書いた、機械の判定に使う値（欄の集合・値域・閉じた一覧・判定の式）で、これを規則の正本にしているあいだは、人が読める写しを設計文書の置き場の生成区間へ機械が導出する（P-5.6・判断の記録 ADR-9 / ADR-11）。どの定数に掛かり、どれに掛からないかは rules 行 D-11 が持つ。}
  - {id: design-intent, term: 設計文書（design-intent）, en: design-intent, short: 設計文書の置き場（design-intent）に在る正本の集まり, def: folio2 の開発を拘束する文書の集まり＝設計文書の置き場に在る正本すべて。中身は 憲法・規則の表・語彙・要件書・判断の記録（ADR）・入口の正本・相談窓口の正本・天井の正本・設計ノートとそれぞれの欄の決まり である。原則と決定の正本はここ（P-13）。同じ置き場に在るが「設計文書の正本」に数えないものが 2 つある。部品目録（置き場は条 P-2 の機構の注が持つ生成物の棚 preview/ の中）と支度表の正本（相談窓口の生成物に持ち主の承認欄を足したもの）である。どちらも天井の読む文書には入らない。天井の門（要件 FR20）が数える正本からは、生成物の棚に在る部品目録だけが外れ、支度表の正本は門が数える側に在る。folio2 自身の設計ノート（便の契約表・裁定の記録）は移行中で、設計文書の置き場の外（版管理の中の別の置き場・名は要件書 FR15 / FR20 の注が持つ）に在り、YAML の設計ノート（design-note/）へ移すまでは天井の読む文書の外。}
  - {id: floor-ceiling, term: 床・天井, en: floor / ceiling, short: 機械が数える検査と、AI が意味を見る検査, def: 床 = 機械が決定的に（何度やっても同じ結果になる形で）検査する層。合格は「壊れていない」の意味。天井 = AI が意味を検査する層（P-3）。}
  - {id: fail-closed, term: 黙って飛ばさない（fail-closed）, en: fail-closed, short: 確かめられなかったら「合格」にしない, def: 確かめられなかったら「合格」にしない、という安全側の倒し方。分からないときは「まだ分からない」と表示する（P-4）。}
  - {id: frozen-anchor, term: 凍結 anchor（固定の fixture）, en: frozen anchor / fixture, short: 検査のための動かない基準, def: 作る側からも検査する側からも独立した、動かない基準（固定の見本データ）。生成物どうしの見比べだけを合格にしないために置く（P-10）。}
  - {id: design-token, term: design token, en: design token, short: 色・字の大きさ・余白の元の値, def: 色・字の大きさ・余白などの元の値。1 か所で決めて全ページが使う（P-2）。}
  - {id: parts-catalog, term: 部品目録, en: parts catalog, short: ページを組み立てる部品の一覧, def: ページを組み立てる部品（表紙・章帯・カード・図）の閉じた一覧。ここに無い部品は使えない。図の型もここに載る。密度 profile の閉じた一覧もここに載る（置き場は条 P-2 の機構の注が持つ）。}
  - {id: profile, term: 密度 profile, en: density profile, short: 文書の種類ごとの見せ方の設定, def: 文書の種類ごとの見せ方の設定（どれくらい詰めて見せるか・使う図の型）。係を増やさず、設定で違いを表す（P-5.3・N-5）。}
  - {id: adr, term: 判断の記録（ADR）, en: ADR, short: 戻せない判断を理由つきで残す 1 枚, def: 戻せない判断を、理由・退けた案・撤退条件つきで残す 1 枚。憲法の改訂にも必ず要る（P-8・A-2）。}
  - {id: retreat, term: 撤退条件, en: retreat condition, short: その判断を捨てる条件, def: その判断を捨てる条件。決めるときに一緒に書く（P-8）。}
  - {id: ruling-id, term: 裁定 id, en: ruling id, short: 持ち主が決めた記録の番号, def: 持ち主が決めたことを指す番号（台帳の notes の逐語と日付）。rules 行や改訂には必ず付く（P-17・N-4）。}
  - {id: verbatim, term: 逐語, en: verbatim, short: 言葉どおりの引用, def: 人の発言を言い換えずそのまま引用すること。承認は逐語で残す（P-12）。機械が写しを「忠実に作る」ことは「逐語で（忠実に）生成」と書き分ける（P-6）。}
  - {id: dialogue-surface, term: 対話面, en: dialogue surface, short: 承認を受け取る決まった会話の場所, def: 持ち主の承認を受け取る、決まった 1 つの会話の場所（rules 行 R-8 が指す）。ここを通らない「OK」は承認にならない（P-12）。}
  - {id: ledger, term: 台帳（bd）, en: ledger (bd), short: タスクと裁定を記帳する帳簿, def: タスクと持ち主の裁定を記帳する帳簿（道具の名前は bd）。規則は置かない（P-5.4）。}
  - {id: hook-guard, term: 自動の仕掛け（hook）・止める仕掛け（guard）, en: hook / guard, short: 出来事のときに自動で走る仕掛けと、逸脱を止める仕掛け, def: 自動の仕掛け（hook）= ある出来事のときに自動で走る仕掛け。便利だが、それだけでは守られる保証にならない（P-15）。止める仕掛け（guard）= 決まりに反する編集や操作を止める仕掛けと検査の総称。壊れたときに「通す／止める」の極性と「その場／後で」の別を持つ（P-18）。}
  - {id: polarity, term: 極性, en: polarity, short: 「する／しない」と「通す／止める」の向き, def: 規範文なら「〜する」（必ず守る）か「〜しない」（決してしない）か。止める仕掛けなら、壊れたときに「開く（通す）」か「閉じる（止める）」か＝条 P-18.3 の「開く／閉じる」と、面の札の「通す／止める」「閉じる」は同じ 1 つの向きの言い換えである。1 つにつき 1 つの向き（P-18）。}
  - {id: face, term: 面, en: face, short: 正本から生成する、人が読む 1 枚のページ, def: 正本から folio が生成する、人が読む 1 枚のページ（入口・憲法・要件書・判断の記録・設計ノート）。数えるときの単位はこの語で、「枚」も「ページ」も同じものを指す。「機械のための面」は別の語である。}
  - {id: machine-layer, term: 機械のための面, en: machine layer, short: AI が正確に読むための短い表, def: AI が正確に読むための短い表。人は開かなくてよい。}
  - {id: generated-block, term: 生成区間, en: generated block, short: file の中で機械が書き換える印のついた範囲, def: file の中で、機械が書き換える印のついた範囲（CLAUDE.md の憲法の写しと、そのほかの file の決まりの部分）。対象の file の一覧はここで数え上げず、要件 FR19 が持つ（同じ一覧を 2 か所に置かない・P-6.3）。手で直さない（P-6.2・P-14）。正本は別に在り、機械がそこから導出して書く。}
  - {id: inject, term: 注入, en: inject, short: 憲法の守らせる条を AI の手元へ写すこと, def: 憲法の前文と規範文を持つ条を CLAUDE.md の生成区間へ写すこと。書き込み（--write）と検査（--check）がある（P-14）。}
  - {id: intake, term: 相談窓口（intake）と支度表, en: intake / preparation sheet, short: 何の文書が要るかを決める入口と、その結果の 1 枚, def: 相談窓口 = どの文書を持つかを易しい質問で決める入口。支度表 = その結果（持つ文書・推奨で進めた項目）を 1 枚にしたもの（要件書 FR1）。}
  - {id: delivery, term: 便, en: delivery, short: 変更を 1 まとまりで運ぶ単位, def: 変更を 1 まとまりで運ぶ単位（契約〔何を作るかの約束・設計ノートの契約表の行〕→ 実装 → 検査 → 取り込み）。運ぶ器は scribe2（CON6）。}
  - {id: spike, term: spike, en: spike, short: 決める前に小さく試して測ること, def: 決める前に小さく試して測ること。}
  - {id: tailnet, term: tailnet, en: tailnet, short: 自分の端末どうしだけがつながる私設ネット, def: 自分の端末どうしだけがつながる私設ネット。配信で見せる先は、ここか同じ端末の中（loopback）だけ（N-6）。}
  - {id: self-host, term: 自分で自分を作る（self-host）, en: self-host, short: folio が folio 自身の文書やコードを作る運用, def: folio が folio 自身の文書やコードを自分の道具で作る運用。文書は最初から自分で作るが、コードの変更を自分の便で運ぶのは最後（P-13・A-4）。}
  - {id: oracle, term: 物差し役（oracle）, en: oracle, short: 何が正しいかを決める役, def: 何が正しいかを決める役。前の版（folio v1）にはこの役を持たせない（P-13）。}
  - {id: reversible, term: 取り消せる・取り消せない（3 クラス）, en: reversible / irreversible, short: 元に戻せる操作と、戻せない 3 種類の操作, def: 取り消せない操作 = 消す・外へ出す（公開・送信・公開 repo への commit と push）・外の道具や鍵を使う（課金を含む） の 3 クラス（A-1）。取り込み（merge）・公開へ出ない便（自分の repo の中で閉じる変更）・外の部品を増やさない変更は取り消せる側（A-4.3）。}
  - {id: managed-object, term: 管理下の対象, en: managed object, short: folio が預かっているもの, def: folio が預かっているもの = 正本・生成物・支度表・台帳の記帳。取り消せない削除をしない対象（N-1）。}
  - {id: deterministic, term: 決定的（に検査する・に導出する）, en: deterministic, short: 何度やっても同じ結果になる形で, def: 同じ入力なら何度やっても同じ結果になる形で（機械が数える検査・生成区間の導出はこの形で行う。P-3・P-14）。}
  - {id: seat, term: 席, en: seat, short: AI が作業する場所（orchestrator 席など）, def: AI が作業する場所（tmux の窓 1 つ）。設計判断を下す席は最上位のモデルで動かす（P-16）。}
  - {id: figure-tool, term: 図の道具（archify）, en: archify, short: AI が型付きの記述で図を書き、機械が検査して描く外の道具, def: 図を型付き記述で書かせ、欄の決まり・配置・描画・仕上がりの検査を掛けて図の本体を出す公開の道具（OSS）。folio2 は組み立て器として借り、閲覧の仕掛けは捨てる（判断の記録 ADR-4）。}
  - {id: typed-figure-spec, term: 型付き記述（図の）, en: typed figure spec (JSON), short: 図の中身を欄と値で書いた正本, def: 図の箱・線・名札・座標を欄と値（JSON）で書いたもの。図の正本はこの形で、その図を載せる文書の正本 YAML の図の節に置く（ADR-4）。}
  - {id: figure-body, term: 図の本体（SVG）, en: figure body (SVG), short: 道具の出力から取り出す、図の線と箱だけ, def: 図の道具の出力のうち、線と箱と文字だけを持つ部分（SVG）。意味を表す class だけで描かれ、色・字の大きさ・線の太さは folio の design token で塗る。folio のページに埋める部品はこれだけ（ADR-4）。}
  - {id: viewer-chrome, term: 閲覧の仕掛け, en: viewer, short: 図を見る画面の飾りと動き, def: 図の道具が図の本体に付けてくる閲覧の画面（様式・動き・字体・検索・書き出し）。folio2 は捨て、要るものだけを部品目録の部品として持ち直す（ADR-4）。}
  - {id: compiler, term: 組み立て器（compiler）, en: compiler, short: 記述を検査して 1 枚に組み立てる係, def: 型付きの記述を検査し、何度やっても同じ結果になる形で 1 枚の出力へ組み立てる道具。folio2 では図の道具をこの役でだけ使い、人が読むページの生成器は folio 1 つのまま（P-2.1）。}
  - {id: design-note, term: 設計ノート, en: design note, short: 「どう作るか」を書く設計の文書（1 つの型）, def: 設計の中身（部品・口・欄・歯・契約表などの型付きの節）を持つ文書の型。folio2 では 1 つの型（密度 profile の 1 行）で、節の型は閉じた一覧から選ぶ。前の版（folio v1）のように中身の種類ごとに生成の束を分けない（ADR-3・M1）。}
  - {id: contract-table, term: 契約表, en: contract table, short: 便 1 本ずつの約束を並べた表, def: 便 1 本で何を作るか（要件・書き込み範囲・確かめ方・完了の条件）を 1 行ずつ並べた表。設計ノートの 1 つの節で、欄の集合と値域の正本は器（scribe2）の型から導出した型付き file。意味の検査は器の編集時の止める仕掛けが持ち、folio2 が持つのは 正本の YAML の形（重複キー・未知の欄・欄の非空）と 導出物の差分 0 と folio2 が所有する文書の id 空間の解決 の 3 つだけである（ADR-3 決定 (3)・設計ノートの欄の決まりの folio_check と同じ 3 つ）。}
  - {id: landing-record, term: 着地の記録（便の記録）, en: landing record, short: 便が統合先に入った事実の帳簿, def: 便が統合先（main）へ入った事実の正本は器（scribe2）の記録。folio2 は着地の commit の末尾の印（trailer・契約 id と要件 id）だけを読み、印が無ければ「まだ分からない」と出す（ADR-3・P-4.2）。}
  - {id: prose-gate, term: 散文の門, en: prose gate, short: 説明文の中の「守れ」の文に番号を求める検査, def: 設計ノートの散文のうち規範の印（rules 行 R-16 の一覧）を持つ文が、同じ文の中に参照 id を持ち、数と単位を持たないことを数える床。記述の文は自由。folio2 の M1 で実在し、それまで器（scribe2）が同じ式を暫定で持つ（ADR-3）。}

  - {id: viewpoint, term: 観点（天井の）, en: viewpoint, short: AI に文書を読ませるときの読み方 4 つ, def: 天井（AI の意味の検査）で文書を読む読み方。忠実さ・読みやすさ・文書どうしの整合・実態との整合の 4 つに閉じ、文書の型ごとには増やさない（判断の記録 ADR-8・N-5）。条 N-5.1 が原語を lens と書くのは、同じこの語を指す。}
  - {id: finding, term: 所見, en: finding, short: AI が返す指摘 1 件の型付きの記録, def: 天井の AI が返す指摘 1 件。観点・場所・重さ（止める／直す／参考）・正本の逐語の根拠・反証の結果を欄に持ち、形と根拠の実在を床が数える（ADR-8 決定 (3)(4)）。}
  - {id: refute, term: 反証, en: refute, short: 「止める」所見を別の AI が中立に確かめ直すこと, def: 重さが「止める」の所見だけを、別の文脈の AI が裏付けを取って 支持／退けた／まだ分からない で返す 2 段目。「まだ分からない」なら所見は残す（ADR-8 決定 (3)）。}
  - {id: bundle, term: 材料の束, en: bundle, short: 観点ごとに folio が組む AI の読む材料, def: 正本の写し・生成した面の写し・その観点の問いの文・所見の欄の決まり・読む欄の一覧を 1 つの置き場に組んだもの。要約値を持ち、所見の起動の記録と照合する。folio は束を組むだけで AI を起動しない（ADR-8 決定 (2)）。}
  - {id: ceiling-badge, term: 天井の名札, en: ceiling badge, short: 面に出す観点ごとの 3 値と日付, def: 生成した面に出す天井の結果の札。観点ごとの 合格／不合格／まだ分からない と日付を、床の合格の名札と別の欄に出す（ADR-8 決定 (4)・P-3.3）。}
  - {id: tooth, term: 歯, en: test, short: 壊すと落ちて知らせる自動の検査, def: 実装を壊したときに落ちて知らせる自動の検査 1 本。「赤い歯（RED の歯）」は、直す前の実装では落ち、直した後に通る検査のことで、便の受入はこの形で表す。「歯の表」は設計ノートで検査を並べた表。}
  - {id: port, term: 口, en: interface, short: 道具が外から呼ばれる受け口, def: 道具が外から呼ばれる受け口（命令・命令の旗・関数）。「口の表」は設計ノートで受け口を並べた表。まだ作っていない受け口は「口が無い」と言う。}
  - {id: vessel, term: 器, en: vessel, short: 便を運ぶ道具（scribe2）, def: 便の受付・審査・実装の席の起動・着地までを運ぶ道具。folio2 では scribe2 を指す。席（AI が作業する場所）とは別（P-16.2）。}
  - {id: mapping, term: 写像, en: mapping, short: 回答の組み合わせから、要る文書の集合を 1 つに決めること, def: 回答の組み合わせから、要る文書の集合を 1 つに決めること。相談窓口（intake）の正本が回答と文書の対応の表を持ち、同じ回答なら何度やっても同じ集合になる（要件書 FR1・判断の記録 ADR-6）。}
  - {id: population, term: 母集団, en: population, short: 数える対象の全体, def: 数える対象の全体。床の検査ごとに「何を数えるか」を決めるもので、規則の表の行が欄（population）として持つ。どの行が持つかはここで数え上げず、規則の表そのものが正本である（P-6.3）。}
  - {id: value-range, term: 値域, en: value range, short: その欄や旗が取ってよい値の範囲, def: 欄や旗が取ってよい値の範囲（閉じた一覧・数の上限と下限・真偽）。型付きデータはこれを機械の判定に使い、どの値域が規則の正本かは規則の表の行 D-11 が持つ（P-5.1）。}
  - {id: digest, term: 要約値, en: digest, short: 中身が 1 字でも変われば変わる短い印, def: file の中身から決まった手順で作る短い字列。中身が 1 字でも変われば値が変わるので、同じ材料を読んだか・同じ写しかを照らすのに使う（材料の束・図の道具の版の固定・天井の判定の印・着地の commit）。}
  - {id: ceiling-stamp, term: 天井の判定の印, en: ceiling stamp, short: 天井の 1 周の結果を機械が読める 1 file にした生成物, def: 天井の 1 周の結果（周の id・観点ごとの 3 値と反証の結果・正本と面と材料の束の要約値・起動の記録・読んだ文書の id）を生成物の棚へ 1 file で書いたもの。面に出す天井の名札とは別の生成物で、天井の門がこれを読む（要件 FR20）。}
  - {id: ceiling-gate, term: 天井の門, en: ceiling gate, short: 設計文書を書き換える便を天井の印で 3 値に判定する仕掛け, def: 便が書き換える file の一覧と天井の判定の印と今の正本から、通す・止める・まだ分からない の 3 値を返す仕掛け。設計ノートの散文の門（規範の印を持つ文を数える床）とは別物である（要件 FR20・判断の記録 ADR-8）。}

# 欄の名前（機械層・読者は引かない・R-9 の母集団外）
field_terms:
  - {id: tier, term: 段, en: tier, def: 条の実行時の扱い。いつも守る（道具も AI も守る）／確認してから変える（消す・外へ出す・外の道具や鍵を使う操作は実行前に持ち主へ聞く）／絶対にやらない（やろうとしたら機械が拒む）。この 3 つの値域の正本は憲法の schema 節にあり、ここは読み手のための言い換えである（P-6.3）。}
  - {id: normative-statement, term: 規範文, en: normative statement, def: 条の中の、守るべきことを書いた文。型（いつ守るか）と強度を欄に持ち、1 文 1 極性。}
  - {id: plain-text, term: やさしく言うと, en: plain reading, def: 規範文を非エンジニア向けに言い換えた文。規範文に無い義務を足さず、落とさない（受入 (f)・R-10）。}
  - {id: strength, term: 強度, en: strength, def: must（必ず守る）／ must-not（決してしない）／ should（既定・外すなら理由を残す）。文末と一致する（R-11）。この 3 つの値域の正本は憲法の schema 節にある（P-6.3）。}
  - {id: pattern, term: 型（いつ守るか）, en: pattern, def: つねに／〜のとき／〜のあいだ／〜になったら／〜ならば の 5 型（並びは憲法の schema 節の値域 ubiquitous・event・state・unwanted・optional の順で、名札の字は面の生成器と同じ）。4 つ目は望まない事態が起きたらそれを拒む・落とすという向きの型で、憲法の規範文は多く「〜なら、…拒む／落とす」の形で書く。5 つ目を持つ条は憲法にまだ 1 本も無い。}
  - {id: mechanism, term: 機構, en: mechanism, def: 条をどう守らせるか。reject（機械が操作を拒む）／ build-check（生成時の検査で落とす）／ human-review（人が見る）／ none（無し・理由必須）と、いつ実在するか（live）。守らせ方と「いつ実在するか」の値域の正本は憲法の schema 節にある（P-6.3）。}
  - {id: binds, term: 縛る相手, en: binds, def: 条が縛る相手。tool（道具の作り）／ practice（作る側の作法）／ both。この 3 つの値域の正本は憲法の schema 節にある（P-6.3）。}

# v0.1 からの変更: 外した語 = なし（段・極性・規範文・やさしく言うと は field_terms へ移動）。足した語 = 提示層・型付きデータ・設計文書・密度 profile・逐語・対話面・台帳・止める仕掛け・注入・相談窓口・取り消せる／取り消せない・管理下の対象。
# 統合 = 正本 + 生成物・生成器 / hook + guard / 相談窓口 + 支度表。「自己開発」は self-host に統一。「決定的に」は本文で「何度やっても同じ結果になる形で」と言い換えて添える。
# 第 1.0 版（2026-09-12 発効）の後に足した語（外した語は無い・id は append only・P-7.1）: 図の道具（archify）・型付き記述（図の）・図の本体（SVG）・閲覧の仕掛け・組み立て器（compiler）（2026-09-16・判断の記録 ADR-4）／設計ノート・契約表・着地の記録（便の記録）・散文の門（2026-09-16・判断の記録 ADR-3）／観点（天井の）・所見・反証・材料の束・天井の名札（2026-09-19・判断の記録 ADR-8）／歯・口（2026-09-20・天井の 7 周目）／器（2026-09-21・天井の 12 周目の忠実さ F-3）／母集団（2026-09-21・天井の 15 周目の読みやすさ F-2）／値域・要約値・天井の判定の印・天井の門（2026-09-21・天井の 16〜20 周目の直しの一括 10）／導出物・面（2026-09-22・天井の 21〜23 周目の直しの一括 11）。

# 英字の識別子（R-9 の免除一覧・型付きデータ）。語彙の語ではなく「固有名・命令・code の語」。日本語の言い換えは不要だが、増やすときは行に理由を付ける。
identifiers:
  - {group: file と形式, words: [yaml, html, css, js, json, md, claude.md, file, path, repo, svg, toml], why: file 名・形式名・置き場の呼び名}
  - {group: 道具と製品, words: [folio, folio2, bd, scribe2, cargo, deny, tmux, python3, opus, sonnet, xhigh, mcp, playwright, chrome, github, archify, node.js, oss], why: 固有名。可変のモデル名は要件書 CON5 が持つ}
  - {group: 命令と旗, words: [inject, serve, build, merge, write, check, print, commit, push, retire], why: folio の命令名と git の操作名}
  - {group: code の語, words: [crate, class, data-component, token, plugin, skill, script, workflow, agent, lens, spawn, effort, notes, url, ip, id, ai, ok, rules, byte, hook, guard, fixture, anchor, profile, oracle, self-host, spike, tailnet, adr, design-intent, git, ci, m0, m1, v1, v2, v3, v4, subcommand, in-loop, post, schema, sources, srs, showcase, trailer], why: 語彙の見出し語の原語か、code・道具の語。日本語を先に添えて使う}
  - {group: 席と言語, words: [planner, admin, orchestrator, fable, high, bash, rust], why: 席の名前（planner と admin は 2026-09-19 までの 2 席の名・orchestrator は今の 1 席の名）・現行のモデル名と念入りさ（要件書 CON5 が持つ）・言語名}

