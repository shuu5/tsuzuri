  - {id: D-11, article: P-5, what: 実装の型付きの定数のうち憲法 P-5.6（写しの導出）が掛かるのは、folio の命令が 違反・拒否・「まだ分からない」を出す判定に使う 欄の集合・値域・閉じた一覧・判定の式。掛からないのは、file と置き場の名・文言の字面・体裁の数（行の幅や載せる字数）・面の生成器が値に当てる名札と見た目の列。検査の結果（違反・「まだ分からない」）を分ける数の閾値は実装の定数に置かず rules 行に置く。P-5.6 が掛かる定数を足す便・値を変える便は、契約表の行か設計ノートで、根拠の判断の記録か裁定 id を名指す, kind: human-review, status: 仮, ruling: "f2-648 notes 2026-09-20 00:09 JST（発効の承認・判断の記録 ADR-11 と憲法 第 1.1 版と rules 行 D-11 を 1 つの承認で発効する承認要求への回答）（判断の記録 ADR-11 の発効の承認）", ruled_at: 2026-09-20, note: 判断の記録 ADR-11 決定 (2)。範囲の正本はこの行（判断の記録の本文は写し）。機械が数える口は無い＝取り込みの審査で人が見る}
