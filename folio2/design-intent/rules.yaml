# folio2 rules — 数値と開発規律の正本（v1.0・発効 2026-09-12・初版の全行の裁定 = 発効承認「承認する」f2-648.1 notes 20:2x・P-17.3）
# G14=A: design-intent/rules.yaml。2 節: thresholds = 閾値行 R-n（機械が測って止める値）/ discipline = 開発規律行 D-n（人が守る作法・G2=C）。
# 変更手続き: 行の追加・変更は P-17（裁定 id と時刻を行に付ける）。初版の行は憲法の発効の承認を裁定とみなす（P-17.3）＝ ruling / ruled_at が null の行は発効時に埋める。
# 読み方は schema 節が持つ（コメントは規則ではない）。
# schema 節は生成区間（判断の記録 ADR-11 決定 (3)(イ)・(4)②）= 正本は実装の型付きの定数（規則の表の床の木）で、ここはその写し。手で直さず folio schema --write が書く。行（R-n・D-n）は人が書く。持ち主の承認 2026-09-20（逐語「承認する」・裁定 id f2-648 notes 2026-09-20 11:05 JST）。

# folio:schema:begin — 生成区間・手で直さない・正本は実装の定数（folio schema --write が書く）
schema:
  version: 1
  top_level: [schema, thresholds, discipline]
  top_level_note: 最上位の節の閉じた一覧（ほかの節は床が落とす）。thresholds と discipline は人が書き、schema は生成区間
  threshold_row:
    required: [id, article, what, value, kind, status, ruling, ruled_at, stage]
    optional: [basis, projection, same_failure, population, note, refs]
  discipline_row:
    required: [id, article, what, kind, status, ruling, ruled_at]
    optional: [note, refs]
  refs_note: その行の散文が依っている、article の条以外の id の一覧（ほかの行・要件書の id・判断の記録・別の条と規範文）。各項は id の形（P-5.2）で、その行自身の id と article の値は書かない。未解決は行 R-4 の 1 つ目の数えが拾い、判断の記録の未実在は A-2 の網が拾う（R-4 の what と値と母集団は変えない）
  enums:
    kind: [deny, build-check, detect, human-review]
    status: [仮, 凍結, 未定]
    stage: [in-loop, post]
  enums_note: stage は憲法の値域 stage と同じ値（実装は憲法から導出した名の列を使う）
  kind_meaning:
    deny: 機械が測って、値域の外なら落とす（上限の超過・下限の不足・固定の値との違い。憲法の reject / build-check に対応）
    build-check: 生成時の検査で数え、違反なら落とす（憲法の build-check に対応）
    detect: 記録・起票のみ・止めない（憲法の none に対応）
    human-review: 人が守る作法（憲法の human-review に対応・D 行）
  kind_map_to_constitution:
    deny: [reject, build-check]
    build-check: [build-check]
    detect: [none]
  kind_map_to_constitution_note: R 行にだけ適用する（D 行は作法＝条の機構とは別）。右辺は憲法の値域 mechanism_kind の値
  excluded:
    what: [時間（「60 分以内」）, 費用（「300k token 以下」）]
    why: 測る仕組みが別で凍結できない。M1 の実地試験（非エンジニア 1 回）で初めて数値を決める（要件書 not_frozen）。
  reverse_reference: 各行は article 欄で条を指し、その条の relations.rules に行 id が載る（R-4 の双方向）。
# folio:schema:end

