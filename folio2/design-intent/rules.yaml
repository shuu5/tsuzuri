  - {id: D-7, article: P-13, what: scribe2 は限定利用 — 便は便 0 以降（s2-07l.149 の裁定後）・作業記憶の退避と復元の専用の口は持たない（器の側で 2026-09-19 に無くなった。残すものは台帳の notes・復元は台帳と版管理の履歴）・書き換える file が重ならない便は器が並べて運んでよい（重なる便は器が断る）, kind: human-review, status: 凍結, ruling: "f2-648 notes 2026-09-22 11:42 JST（逐語「全部承認する」・一括 11・本便の変更はこの欄の呼び名を「user」から「持ち主」に統一しただけで、値・母集団・裁定そのものは不変）・f2-648 notes 2026-09-20 17:21 JST（逐語「承認する」・平易文の直しの一括と同じ承認）・初版 = 持ち主 2026-09-12 17:1x 裁定 3 / 5 + s2 planner 返信", ruled_at: 2026-09-22, note: "2026-09-20 までの値は「作業記憶の退避と復元は当面 v1 の共通 skill（global skill）・並列便は使わない」。器が 2026-09-19 に 1 席（orchestrator）になり退避の口が無くなったこと、dispatcher が書き換える file の重ならない便を並べて運ぶことに合わせた"}
