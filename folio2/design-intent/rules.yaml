  - {id: R-16, article: N-2, what: 設計ノートの散文の門（規範の印の一覧と、印を持つ文に許さない「数と単位」の単位の一覧）, value: {marks: [しなければならない, してはならない, してはいけない, SHALL, MUST], prohibition: {word: 禁止, clause_ends: ["。", "）", "・", "、", null]}, units: [秒, 分, 時間, 日, 件, 本, 行, byte, KB, MB, "%", s, ms]}, kind: build-check, status: 仮, ruling: "f2-648 notes 2026-09-22 11:42 JST（逐語「全部承認する」・天井の 23 周目の直しの一括 11 = 注に値の欄の名の日本語の名札を足した・値は不変）・前の裁定 = f2-648 notes 2026-09-21 00:00 JST（逐語「すべて推奨で進めて」・約束と実態の総点検の一括と同じ承認）・前の裁定 = ADR-3 発効承認 2026-09-16 22:5x JST（f2-648 notes・f2-648.4 notes・逐語「いずれも承認する」）・式の出所 = 持ち主の裁定 2026-09-13T08:53Z（s2-07l.197 notes・G-e = (b)）", ruled_at: 2026-09-22, stage: post, population: 設計ノートの散文（code fence の内側・行頭が縦線の表の行・注釈の行を除く）。印を持つ文だけを数え、記述の文は自由。憲法・rules・要件書の規範文には掛けない（R-9 / R-12 の領分）。文の区切りは「。」か行末, note: 値の欄の名の読み方は次のとおり。marks = 規範の印の一覧／prohibition = 「禁止」の扱い（word = その語・clause_ends = 直後に来たときだけ印にする文字の一覧）／units = 単位の一覧。面（憲法 §5）に出る小見出しの正本は実装の閉じた表（便 79）で、ここはその読み方の言い換えである（P-6.3）。値は型付き（印 5 種 = 部分一致・英語は否定形も含む・副詞「必ず」は数えない／「禁止」は直後の文字が clause_ends のどれか〔null = 行末〕のときだけ印／単位 13 種 = 数字列の直後）。scribe2 の暫定床（xtask の散文の門・印 5・直後の文字 5・単位 13 の宣言順まで同じ）と同じ式（ADR-3 決定 (7)）。folio2 の M1 が引き取ったら scribe2 側を撤去する（引き取りは便 24 で済んだ〔2026-09-18〕が器の側の式は 2026-09-20 時点でも残っており、撤去は M1 の残りが揃った後に器へ要求する）。生成側からも検査側からも独立した凍結 anchor を持つ（P-10.1・要件書 FR12）。値の一覧は M1 の実装で型付きデータ（この行）から読む＝散文に写さない}
  - {id: R-17, article: N-2, what: 設計文書の中で id を持つ行の散文の欄に現れた、その行以外の id のうち、その行の型付きの欄に無いものの数, value: 0 件, kind: build-check, status: 仮, ruling: "f2-648 notes 2026-09-22 11:42 JST（逐語「全部承認する」・行の追加を含む辺の後付け PR の承認・一括 11 と設計文書のグラフの判断の記録と 1 つの承認）・前の裁定 = f2-648 notes 2026-09-22 10:2x JST（逐語「それで進めて」・散文の言及を型付きの欄へ書き写す後付けの便の裁定・辺の書き写しの設計ノート docs/design/edge-retrofit-2026-09-22.md）", ruled_at: 2026-09-22, stage: post, population: 正本 YAML（憲法・規則の表・要件書・語彙・天井・入口・相談窓口・判断の記録・設計ノート）の中で id を持つ行の、型付きの欄の外に在る散文の欄（注・平易文・文脈・決定・案の理由・帰結・撤退条件 など）。数えない言及 = その行自身の id・承認と版の来歴（承認の欄と meta の節）・生成区間（schema の節）・反対側からの確認（grill）と反証の記録・その行に掛からないと述べた言及（対象外・本判断の外）・その行が生んだもの（判断の記録が発効で生んだ要件・受入基準・規則の行・後続の判断）・先例の引き合い（同じ運び方・同形にする）。境界を名指す非変更と非拡大の宣言（その行や要件を変えない・広げない）は数える。書き写す先は、その行の種類が既に持つ型付きの欄だけ（判断の記録 = basis・要件書の項 = basis〔条の id だけ〕と rules・条 = relations）＝この行のために欄を増やさない, note: この行の機械の検査（folio check の歯）は便で足す（台帳 f2-648 の後続）。それまでこの行の判定は「まだ分からない」（P-4.2）。書き写しの初回は 2026-09-22 の後付けの便で済ませ、残差（受け皿の欄が無い出所）と数えは設計ノート docs/design/edge-retrofit-2026-09-22.md が持つ。歯が入るまでの間、この行は床の値ではなく書き手の作法として働く}

