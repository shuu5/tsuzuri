  - {id: D-10, article: P-12, what: 持ち主への問い（承認の要求・反対側からの確認（grill）・相談窓口の質問）は対話面（R-8）の散文で出し、選択式の問いの窓（AskUserQuestion）を使わない。相談窓口（FR1）の質問と推奨回答も文で提示する, kind: human-review, status: 凍結, ruling: "f2-648 notes 2026-09-22 11:42 JST（逐語「全部承認する」・一括 11・本便の変更はこの欄の呼び名を「user」から「持ち主」に統一しただけで、値・母集団・裁定そのものは不変）・持ち主 2026-09-13 18:0x（f2-648 notes・逐語「v2においてもask user questionは使わないような方向にするようにdesign-intentに記載して」）", ruled_at: 2026-09-22, note: "前の版（folio v1）の設計の係（folio-architect）は 1 問ずつ選択式の窓で問う規律を skill に持っていた。v2 は対話面の散文を既定にし、選択式の窓を持たない。要件書 FR1 への行参照は v1.1 で足す（P-5.2）", refs: [P-5.2, R-8]}
  - {id: D-11, article: P-5, what: 実装の型付きの定数のうち憲法 P-5.6（写しの導出）が掛かるのは、folio の命令が 違反・拒否・「まだ分からない」を出す判定に使う 欄の集合・値域・閉じた一覧・判定の式。掛からないのは、file と置き場の名・文言の字面・体裁の数（行の幅や載せる字数）・面の生成器が値に当てる名札と見た目の列。検査の結果（違反・「まだ分からない」）を分ける数の閾値は実装の定数に置かず rules 行に置く。P-5.6 が掛かる定数を足す便・値を変える便は、契約表の行か設計ノートで、根拠の判断の記録か裁定 id を名指す, kind: human-review, status: 仮, ruling: "f2-648 notes 2026-09-20 00:09 JST（発効の承認・判断の記録 ADR-11 と憲法 第 1.1 版と rules 行 D-11 を 1 つの承認で発効する承認要求への回答）（判断の記録 ADR-11 の発効の承認）", ruled_at: 2026-09-20, note: 判断の記録 ADR-11 決定 (2)。範囲の正本はこの行（判断の記録の本文は写し）。機械が数える口は無い＝取り込みの審査で人が見る, refs: [P-5.6]}
  - {id: D-12, article: P-3, what: "設計文書の正本を書き換える便は、器（scribe2）へ出す前に天井の門（folio ceiling --gate）を撃ち、通す のときだけ器へ出す。止める・まだ分からない のときは出さず、次の周（行 D-16）の後に撃ち直すか、持ち主の裁定を先に取る。天井の周を起こす時は行 D-16 が定め、門の判定だけでは周を起こさない", kind: human-review, status: 仮, ruling: "f2-648 notes 2026-09-27 00:40 JST（逐語「承認する」・一括 27 の 🔴 問 1）", ruled_at: 2026-09-27, note: "出所は討論の論点 1（f2-648 notes 2026-09-26 23:26 JST・逐語「とりあえず論点１は推奨で」・判断の記録 ADR-26 決定 (1)）と、判断の記録 ADR-8 決定 (4)(6)・ADR-18 決定 (1)(3)(5)（決定 (5) の「無ければ 通す」は、判断の記録 ADR-24 の改訂の欄が、書き換える file の一覧と設計文書の置き場を同じ起点で照らせるときに限り、判断の記録 ADR-25〔2026-09-26 発効〕の改訂の欄が、渡された置き場が設計文書の置き場でない形を照らせない形の一覧に足す）・ADR-24 決定 (1)・ADR-25 決定 (1)・要件書 FR20 の口（folio ceiling --stamp / --gate）。器（scribe2）への結線が器の側の口で入ったら、この行を器の受付の作法へ改める。門そのものを捨てる条件（撤退条件）は判断の記録 ADR-8 の注が持ち、ここには写さない。複数の直しを 1 つの便と 1 回の承認でまとめる運用（一括）は、この行の門の下で席が運んでいる作法である＝その運び方は開発規律行 D-14 が定める（判断の記録 ADR-19）。周の回数を減らす手としてそれを指す文書（判断の記録 ADR-13 の決定 (8)）はこの注を読む。周の引き金の規範の欄の一覧は判断の記録 ADR-18 決定 (1) が定め、その正本は実装の型付きの定数（crates/folio/src/ceiling.rs）で、写しは天井の正本の生成区間に在る（同じ判断の記録の便ア＝台帳 f2-648.178 が 2026-09-24 に入れた・ここには写さない）。門の式は便アの着地から印の引き金の要約値で古さを測る（門を外す口は持たない）。門が印の古さで まだ分からない を返しても、それだけでは周を起こさない（行 D-16・判断の記録 ADR-26 決定 (1)）。窓の間は行 D-14 のとおり設計文書を書き換える便を出さない。M の出口の前の周は節目の周として行 D-16 が持つ。門を撃つ場所（命令を実行する場所）は作業ツリーの一番上で、これは規則ではなく席の手順である。撃ち直し方（理由の行）の正本は判断の記録 ADR-24 決定 (1)（置き場でない形は ADR-25 決定 (1)・要件 FR20 の規範文はその写し）、撃つ場所の字の正本は要件 FR20 の注で、この注はその要旨を 1 文で写すだけである（天井の 38〜42 周目 整合）。撃つ場所の誤りで書き換える file の一覧と設計文書の置き場を同じ起点で照らせないときは、門は まだ分からない を返し、撃ち直し方を理由の行に出す。門に渡す設計文書の置き場の場所を間違えること（置き場の渡し間違い・台帳 f2-648.224・条 P-4.1・天井の 41 周目 実態 F-1）のうち、置き場でない場所を渡す渡し間違いは、便 150（2026-09-26 着地）で門が まだ分からない を返す形になった（判断の記録 ADR-25 決定 (1)・2026-09-26 発効）。残る穴は、憲法の正本を持つ別の置き場（試験用の写しなど）を渡す渡し間違いで、門は 通す を返しうる。その字と塞がない理由は要件 FR20 の注が持ち、ここには写さない", refs: [ADR-8, ADR-13, ADR-18, D-14, ADR-19, ADR-24, P-4, ADR-25, D-16, ADR-26]}
  - {id: D-13, article: P-6, what: "便の契約（設計ノートの契約表と、その行が指す節）の本文に、要約値・byte 数・行数の実測値を写さない。書くのは、その値を組み直す手順（独立の script の名と撃ち方）と、変わらないものの理由である。数を書くときは 参考値 と断り、測った土台（base の commit の要約値）を添える", kind: human-review, status: 仮, ruling: "f2-648 notes 2026-09-23 08:13 JST（逐語「問いは全部推奨で」・総点検の設計ノート docs/design/audit-2026-09-23.md の 🔴 6 の裁定・初版の行）", ruled_at: 2026-09-23, note: "出所は総点検の設計ノート docs/design/audit-2026-09-23.md の §3-b（P1）。契約の改訂 41 回のうち便の中身の誤りは 0 件で、先行の便が着地して写した数が古くなることが改訂の主な理由だった。契約の雛形（節の並びと契約表の欄）と、必ず書く 4 点は、契約の型 docs/design/delivery-template.md が持つ＝この行は雛形の中身を定めない。契約の取り込みの前に席が作業ツリーで受付を先に撃つことは規則ではなく席の手順で、設計文書を触る便に天井の門を撃たせる行と同じ段に置く"}
  - {id: D-14, article: P-11, what: "要旨＝行 D-16 が周を起こす一括（止める の直しの一括と節目の一括）は、直しをその一括の作業の枝の上に書き、そこで行 R-21 の回数まで周を回し、4 観点とも合格した枝を本流へ取り込む。持ち主の承認が要る項（行 D-17）を含む一括は 1 回の承認要求で持ち主へ出してから取り込み、含まない一括は席の裁定を記帳して取り込む。一括の枝を切ってから取り込むまで（窓）は、本流の設計文書を書き換える便を止める。往復を止めてすぐ持ち主へ出す場合は末尾に挙げる。以下はその細目である。周の前ごとに本流を枝へ取り込む。窓（一括の枝を切ってから本流へ取り込むまで）の間は、本流の設計文書の正本を書き換える便を、門の判定に依らず器へ出さない。窓を開くとき、席は設計文書を書き換える便の台帳の件を器の列で保留にし、窓を閉じたら解放する。窓の間に本流の規範の欄の要約値が、枝の上の最後の周の束を組んだときの値から動いたら、枝を本流に載せ替えて周を回し直す（動いたかは要約値の比較で決める）。周が不合格か まだ分からない なら、その理由になった支持の 止める のそれぞれに直しを当ててから回し直す。直しを当てずに回し直してよいのは実行できなかった回（起動の記録が無い・束が古い・反証が未・止める が全部退けられた再判定待ち）だけで、窓の中で 1 回までとする。承認要求と記帳には、枝の上で回したすべての周の所見と直しと結果を添える。止める の直しの一括は本流の 1 つの周の所見から切り、周をまたいで束ねない。節目の一括は、前の節目の後に台帳に積んだ 直す と 参考 を束ねる。枝の上の合格と印は、本流へ取り込むまで本流の完成の判定にも門の判定にも数えない。直す先が枝に書けない所見（実装の定数から導出する生成区間）は、台帳に控えとして起票した 1 件に束ね、窓を閉じた後、次の周の前に便で運ぶ。次のどれかに当たったら往復を止め、そのときの枝と所見をその場で持ち主へ出す（4 観点合格でない例外として断る）＝枝の上の周が行 R-21 の回数で 4 観点とも合格しない（まだ分からない として出す・条 P-4.2）・同じ種類の失敗が窓の中で通して行 R-7 の回数を超えた（数える失敗は反証で支持された 止める の所見で、観点と場所〔所見の置き場の file・判断の記録と設計ノートは場所の頭の id が指す file〕の組で同じと見る。1 つの周の中の同じ組は 1 と数え、枝を切るきっかけの周を含め、続いていなくても数え、載せ替えでも戻さない。止めて出した枝は承認の後に取り込んで窓を閉じ、次の窓では数え直す）・直しを当てずに回し直す回が窓の中で 2 回目になる・条文の改訂か席が推奨を 1 つに決められない問いが要る・消す・外へ出す・外の道具や鍵を使う操作が要る・枝に書けない所見の 止める で枝の上の周が合格できない", kind: human-review, status: 仮, ruling: "f2-648 notes 2026-09-27 00:40 JST（逐語「承認する」・一括 27 の 🔴 問 1）", ruled_at: 2026-09-27, note: "出所は判断の記録 ADR-19（決定 (1)〜(5)）と、その決定 (1)〜(3) を改訂の欄で狭めた判断の記録 ADR-26（決定 (1)(2)(4)・討論の論点 1・2・4・f2-648 notes 2026-09-26 23:26〜23:29 JST・逐語「とりあえず論点１は推奨で」「推奨で」）。窓の間に設計文書の便を止めるのは、合格の周の後に始まった窓では本流の印が新しい合格のままで門が通すので、門だけでは判断の記録 ADR-8 の決定 (4) の趣旨を保てないためである（不合格の周から始まった窓では行 D-12 の門でも止まる）。器の列の保留と解放は器の命令 pipe dispatch hold で行い、便 125 を保留にした形と同じである（席の手順・器の仕掛けは増やさない）。2026-09-22 00:0x JST の持ち主の裁定の席の扱い（設計文書を触る便は印が古くても門を経ずに出す・台帳 f2-648 notes 2026-09-22）は、判断の記録 ADR-18 の便ア（門の判定の式・台帳 f2-648.178）の着地まで有効だった。便アは 2026-09-24 に着地し（main 9eeff33）、その時点でこの行の窓の定めに置き換わった＝窓の外では行 D-12 の門で判定し、窓の中では設計文書の便を受け付けない。直しを当てない回し直しを 1 回までにしたのは、実行できなかった回が続くのは道具か器の故障の兆しで、同じ束の読み直しが合格の引き直しになるのを防ぐためである（行 R-7 の 2 回は直しを当てた失敗の繰り返しの上限で、別の数え）。規範の欄の一覧は判断の記録 ADR-18 の決定 (1)(2) に依る。承認の記帳だけの変更で印が古くならないのは、引き金の便（判断の記録 ADR-26 決定 (3) の実装の便）の着地からである（それまでは判断の記録の発効の記帳で印が古くなる）。今は門が引き金の要約値で古さを測る（行 D-12 の注）。承認の要否は一括の中身で行 D-17 が決める（周の結果では決めない）。直す先が枝に書けない所見の運び方は今の運用（台帳 f2-648.171 の形）。判断の記録 ADR-13 の注 (f) が「規則として縛るなら行を足すことになる」と書いた行がこの行である。what の止める場合の「観点と場所の組」は、同じ種類の失敗の定めの正本である行 R-7 の same_failure の 3 つ組（検査の id・判定・対象の path）を天井の所見に当てた読みで、検査の id は観点、判定は反証で支持された 止める、対象の path は所見の置き場の file（判断の記録と設計ノートは場所の頭の id が指す file）に当たる。この行が足すのは、その読みと、窓の中の数え方（1 つの周の中の同じ組は 1 と数える・続いていなくても数える・載せ替えでも戻さない）だけで、同じ種類の定めを別に持たない（憲法の条 P-11 の機構の注・天井の 32 周目 整合 F-6）", refs: [P-3, P-12, R-7, D-12, ADR-8, ADR-13, ADR-18, ADR-19, P-4.2, R-21, D-16, D-17, ADR-26]}
  - {id: D-16, article: P-3, what: "天井の周を起こすのは次の 2 つだけである。(a) 反証で支持された 止める の所見の直しを一括の枝に書いたとき（その枝の上の周・回数の上限は行 R-21）。(b) 節目＝M の出口の裁定を持ち主に問う前と、前の節目の後に便が行 R-22 の本数だけ着地したときの、早い方。所見の 直す と 参考 は台帳に積み、次の節目の前に 1 つの一括でまとめて当てる（その一括の枝の上の周が節目の周になる）。引き金の欄の変更・判断の記録の発効・門の まだ分からない は、それだけでは周を起こさない（門が まだ分からない を返した設計文書の便は次の周の後に出す）", kind: human-review, status: 仮, ruling: "f2-648 notes 2026-09-27 00:40 JST（逐語「承認する」・一括 27 の 🔴 問 1）", ruled_at: 2026-09-27, note: "出所は判断の記録 ADR-26 決定 (1)(6)（討論の論点 1・6・f2-648 notes 2026-09-26 23:26 JST と 23:32 JST・逐語「とりあえず論点１は推奨で」「推奨で」）。一括 27 の取り込みの直後の本流の周は、引き金の便の門を通すための移行の 1 回で、(a)(b) の外の唯一の例外であり、以後は無い（同 決定 (3)）。天井の観点・重さ・反証・3 値は変えない（同 決定 (7)）。一括の枝の上の運び方は行 D-14、門は行 D-12 が持ち、門で止まった便が次の周を待てないときの出口は持ち主の裁定か M の出口の前の周である", refs: [R-21, R-22, D-12, D-14, ADR-26]}
  - {id: D-17, article: P-12, what: "設計文書の正本の変更の発効に持ち主の承認（逐語と日付・対話面 R-8）を要するのは次の 4 つだけである。憲法の改訂・規則の表の行の追加と変更・憲法を改訂する判断の記録の発効・要件の追加と削除と M への割り当て。それ以外（要件書の字の直し・天井の正本・入口・憲法を改訂しない判断の記録の発効と廃止 など）は席の裁定で発効し、席は承認欄に「席の裁定」の行（席・日付・台帳の裁定の id）を記帳する。持ち主はいつでも席の裁定を覆せる", kind: human-review, status: 仮, ruling: "f2-648 notes 2026-09-27 00:40 JST（逐語「承認する」・一括 27 の 🔴 問 1）", ruled_at: 2026-09-27, note: "出所は判断の記録 ADR-26 決定 (4)（討論の論点 4・f2-648 notes 2026-09-26 23:29 JST・逐語「推奨で」）。記帳の形は、要件書・天井の正本・入口の承認欄では役の欄が「席の裁定」の行（who = orchestrator 席・when・stamp に台帳の裁定の id・version・逐語の欄は持たない＝持ち主の承認の行と役の字で分ける・条 P-12.2）、判断の記録と設計ノートでは欄の決まりの承認欄（承認者 = orchestrator 席で持ち主の承認と分ける・逐語の欄には席の裁定の字）である。対話面の欄の値域は今 1 つだけで、席の裁定の記帳先（台帳 f2-648 の notes）を値域に足す欄の決まりの改訂は、台帳 f2-648.230 の便で運ぶ。設計ノートの欄の決まりの状態と承認欄の説明（生成区間）が持ち主の逐語を要すると書いたままなのも、同じ改訂で直す。席の裁定の行は、台帳 f2-648.229 の便までは面の表紙の日付に読まれない。要件の規範文の意味を変える直しと受入基準の追加・削除は「要件の追加と削除」に入る。便が実装の型付きの定数を変えて生成区間の規則を変えるのは「規則の表の行の変更」に入る。消す・外へ出す・使う操作の確認（条 A-1）と外部ライブラリの増減の確認（条 A-3）はこの行の外で、変えない", refs: [R-8, A-1, A-2, A-3, ADR-26]}
  - {id: D-18, article: P-6, what: "設計文書の正本の直しは、既定で前の字を置き換えるか削る。直しで字が増えるときは、同じだけ削るか、増やす理由を台帳に記帳する。規則の表の行の裁定の欄は最新の裁定 1 つだけを書き、前の裁定の鎖は書かない（来歴は台帳の notes と版管理の履歴が持つ）", kind: human-review, status: 仮, ruling: "f2-648 notes 2026-09-27 00:40 JST（逐語「承認する」・一括 27 の 🔴 問 1）", ruled_at: 2026-09-27, note: "出所は判断の記録 ADR-26 決定 (5)（討論の論点 5・f2-648 notes 2026-09-26 23:30 JST・逐語「推奨で」）。既に膨れた字（前の裁定の鎖を含む）は、外の置き場で使える状態にする実装の便 8 本（台帳 f2-648 の群 A）の後の最初の節目で 1 回だけ刈る。この行の発効の時点では刈らない", refs: [P-5.4, D-16, ADR-26]}
