  - {id: D-3, article: N-5, what: v1 の並列実行の骨格（凍結骨格 6 本）は使わない。並列は素の係（Agent）の同時起動か、その場で書く並列の台本（Workflow script）で組み、v1 の差し込み（plugin）は積まない, kind: human-review, status: 凍結, ruling: "f2-648 notes 2026-09-22 11:42 JST（逐語「全部承認する」・一括 11・本便の変更はこの欄の呼び名を「user」から「持ち主」に統一しただけで、値・母集団・裁定そのものは不変）・f2-648 notes 2026-09-21 16:09 JST（逐語「承認する」・天井の 14 周目の直しの一括 8 = 注と what の言い換えのみ・値は不変）・前の裁定 = f2-648 notes 2026-09-21 14:00 JST（逐語「承認するから進めて」・天井の 13 周目の直しの一括 7 = what の英語の語に日本語を添えた・値は不変）・前の裁定 = f2-648 notes 2026-09-21 08:59 JST（逐語「問い１−４は推奨で進めて」・天井の 11 周目の直しの一括 5）・前の裁定 = f2-648 notes 2026-09-21 00:00 JST（逐語「すべて推奨で進めて」・約束と実態の総点検の一括と同じ承認）・持ち主 2026-09-12（s2-07l.42 notes・PR #764）", ruled_at: 2026-09-22, note: "前の版（folio v1）の plugin を設定から外した事実と日付は行 R-1 の注が持つ（ここには写さない）。効きめが出るのは AI の席を起こし直した後なので、起こし直すまでは動いている席に前の骨格が載ったままである（行 R-1 の測り直しの前提）", refs: [R-1]}
  - {id: D-4, article: P-11, what: その場で書く並列の台本（Workflow script）は予算を明示する = 出力の上限を AI の字数の単位（token 数・語彙の design token とは別物）で台本の中に書いて検査し、超えたら止める。係（Agent）の数の上限も台本に書く。1 回の実行は 1 論点, kind: human-review, status: 凍結, ruling: "f2-648 notes 2026-09-22 11:42 JST（逐語「全部承認する」・一括 11・本便の変更はこの欄の呼び名を「user」から「持ち主」に統一しただけで、値・母集団・裁定そのものは不変）・f2-648 notes 2026-09-21 16:09 JST（逐語「承認する」・天井の 14 周目の直しの一括 8 = 注と what の言い換えのみ・値は不変）・前の裁定 = 持ち主 2026-09-12（budget 明示）・f2-648 notes 2026-09-21 14:00 JST（逐語「承認するから進めて」・天井の 13 周目の直しの一括 7 = what の英語の語に日本語を添えた・値は不変）", ruled_at: 2026-09-22}
