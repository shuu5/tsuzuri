  - id: FR9
    title: 設計ノートを 1 つの型で生成する
    pattern: event
    strength: must
    when: 設計ノートの正本（YAML）から生成が求められたとき
    shall: folio は設計ノートを 1 つの型（密度 profile の 1 行）として生成し、節は閉じた一覧にある型（部品の表・口の表・欄の表・歯の表・契約表など）だけを許し、一覧に無い型の節を持つ正本は生成せずに落とす。正本の形（重複キー・未知の欄・欄の非空）は構造の床（FR5）で数える。
    plain: 「どう作るか」を書く設計の文書は 1 種類だけ。中の節（部品の表・契約表など）は決まった種類から選び、知らない種類の節があれば作らずに止めます。前の道具のように文書の種類ごとに係を増やしません。正本の形（同じ鍵の重複・知らない欄・空の欄）は構造の床（FR5）が数えます。
    basis: [P-5, P-2, N-5]
    verify: {method: test, how: 閉じた一覧に無い節の型を 1 つ持つ fixture で生成が落ち、一覧内だけの fixture で通ることを見る, ac: [AC7]}
