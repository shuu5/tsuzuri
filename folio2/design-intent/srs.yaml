    figures: []
    milestone: M1
    note: 判断の記録 ADR-3 決定 (1)。何が folio2 の開発を拘束するかは語彙の設計文書の項と P-13 が決め、密度 profile は見せ方だけを持つ。設計ノートの正本の未知の欄は、2026-09-21 までは最上位の節と表の行だけを床が数え、meta・節（sections の行）・図の行（figures の行）は数えていなかった（天井の 11 周目の止める所見 実態との整合 F-1・反証 支持）。この 3 階層は便 61（台帳 f2-648.92・契約表 docs/design/delivery-61.md 行 bj・2026-09-21 着地）で床に入った。
  - id: FR10
    title: 契約表の欄は器の導出 file から読む
    pattern: event
    strength: must
    when: 設計ノートの節の型が「外部の欄の決まりを参照する型」（契約表）であるとき
    shall: folio は器（scribe2）が自分の型から導出した型付き file（欄の集合と値域）を読んで節の欄を登録し、欄の一覧を自分の型にも散文にも持たない。導出 file が読めないときは「まだ分からない」と出し、合格にしない。
    plain: 便の約束を書く表（契約表）の「どんな欄があるか」は scribe2 の機械が決めていて、folio はその写し（file）を読むだけ。欄が増えても folio 側に判断の記録は要りません。写しが読めなければ「まだ分からない」と言い、合格にはしません。
    basis: [P-5, P-6, N-2, P-4]
    verify: {method: test, how: 導出 file を 1 欄変えた fixture で節の欄が追従し、導出 file を欠いた fixture で「まだ分からない」になることを見る, ac: [AC8, AC13]}
    goals: [GOAL4]
    figures: []
    milestone: M1
    note: 判断の記録 ADR-3 決定 (2)・(3)。契約表の意味の検査（行の id の一意・要件と節の実在・依存の解決と輪の無さ・閉包）は器の 1 つの関数が編集時に持ち、folio は持たない。
  - id: FR11
    title: 導出物を生成し、差分 0 を数える
    pattern: event
    strength: must
    when: folio build --check が実行されたとき
    shall: folio は設計ノートの契約表から器の形（表の形式の契約の配列・各行に節の本文の逐語・空の一覧は欄名を省く・先頭に版の宣言・器の値の文法〔文字列・文字列の一覧・数・真偽〕を共有する）の導出物を生成し、版管理に置かれた導出物との差分を数えて、差があれば非 0 で終了する。この検査は事後の検出であり、編集の時点で止める仕掛けの代わりにしない。
    plain: 契約表から scribe2 が読む形の file を機械が作り、repo に置いてある file と 1 字でもずれていれば「ずれている」と言って止まります。ただしこれは後から数える検査で、書いた瞬間に止める仕掛けの代わりではありません。
    basis: [P-6, P-18, P-10]
    verify: {method: test, how: 手書きの契約表と期待される導出物の対を凍結 anchor（生成器から独立した固定の fixture）として置き、導出物を 1 字変えた fixture で --check が非 0 になり、anchor と一致する fixture で 0 になることを見る（生成物どうしの突き合わせだけを合格にしない）, ac: [AC9]}
    goals: [GOAL4]
    figures: []
    milestone: M1
    note: 判断の記録 ADR-3 決定 (4)。器は統合先（main）へ着地した後の受付からしか新しい表を読まない（正本の改訂 → 取り込みの要求 → 着地 → 再受付）。この要件の口（導出物を組む・差分を数える）は未実装である（2026-09-20 時点）。器の側が導出物を読む口を持つまで便を起こさない（台帳 f2-648 の子に起票）。それまで設計ノートの欄の決まりの注も「未実装」と書く。
  - id: FR12
    title: 散文の門（規範の印を持つ文だけ）
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: folio は設計ノートの散文のうち、規範の印（rules 行 R-16 の一覧）を持つ文が、同じ文の中に参照 id（条 id・rules 行 id・要件 id・契約 id）を持ち、数と単位（rules 行 R-16 の一覧）を持たないことを床で数え、違反があれば落とす。記述の文は数えない。
    plain: 設計の説明文の中で「〜しなければならない」のような決まりの言い方をした文には、必ず番号（条・数値の表の行・要件・契約のどれか）を添え、「30 秒」のような単位のついた数を書かないことを機械が数えます（単位の無い数や普通の説明文は自由です）。
    basis: [N-2, P-5, P-10]
    rules: [R-16]
    verify: {method: test, how: 印を持つ文に参照 id が無い fixture と数と単位を持つ fixture で違反が数えられ、記述の文だけの fixture で 0 になることを見る（凍結 anchor を持つ）, ac: [AC10]}
    goals: [GOAL4]
    figures: []
    milestone: M1
    note: 判断の記録 ADR-3 決定 (7)。M1 まで器（scribe2）が同じ式を暫定で持ち、M1 が引き取ったら撤去する。folio2 の引き取りは便 24 で済んだ（2026-09-18）が、器の側の暫定の式は 2026-09-20 時点でも残っている。撤去は M1 の残り（FR11 / FR13 / FR14）が揃った後に器へ要求する（台帳 f2-648.93 に起票済み・前提は f2-648.88）。意味だけで規範になる文は床の外（天井）。数と単位を散文から一律に排する床は採らない（偽陽性）。
  - id: FR13
    title: 着地は印だけから読み、無ければ「まだ分からない」
    pattern: event
    strength: must
    when: 要件の追跡表を生成するとき
    shall: folio は各契約の着地を、統合先の commit の末尾の印（器が書く契約 id と要件 id）だけから読み、印が在れば着地（印の commit の要約値（sha））、無ければ「まだ分からない」と出し「未着地」とは言わない。他の repo の要件 id・契約 id・便の id は参照 id の床（rules 行 R-4）の母集団に入れず、出所付きの測定値（3 値）として扱う。
    plain: 「その便は本当に入ったか」は、scribe2 が commit の末尾に書く印だけを見て答えます。印があれば「入った」、無ければ「まだ分からない」と言い、「入っていない」とは言いません。scribe2 側の番号が実在するかは folio の検査で追わず、測った値として見せるだけです。
    basis: [P-4, P-7, P-10, P-13]
    rules: [R-4]
    verify: {method: test, how: 印の無い commit の契約が「まだ分からない」と出て「未着地」と出ないこと、印の在る commit で sha が出ることを見る, ac: [AC11]}
    goals: [GOAL4]
    figures: []
    milestone: M1
    note: 判断の記録 ADR-3 決定 (5)・(6)。自分の repo への取り込みの要求で終わる形（印も記録も持たない）は恒久に「まだ分からない」。器の記録の書き出しは出所付きの測定値として補助に留める。この要件の口（commit の末尾の印から着地を読む）は未実装である（2026-09-20 時点・FR11 の後の便）。
  - id: FR14
    title: 機械が読む id の索引を出す
    pattern: event
    strength: should
    when: folio build が実行されたとき
    shall: folio は機械が読む id の索引（文書・要件・契約の id と 1 行の題）を出す。中身を席へ届ける経路は CON9 のとおり器が持つ。
    plain: AI が「どんな文書・要件・契約があるか」を番号と 1 行の題で引ける一覧を出します。中身を AI の手元に届けるのは scribe2 の役目です（CON9）。
    basis: [P-14, P-5]
    verify: {method: test, how: 索引の id の集合が正本の id の集合と一致することを見る, ac: []}
    goals: [GOAL3]
    figures: []
    milestone: M1
    note: 判断の記録 ADR-3 決定 (9)。この要件の口（機械が読む id の索引を出す）は未実装である（2026-09-20 時点・FR11 の後の便）。
  - id: FR15
    title: 図は型付き記述から生成し、通らない図は出さない
    pattern: event
    strength: must
    when: 文書を生成するとき、正本の図の節に図の道具の型付き記述（rules 行 R-5 の一覧のうち道具の 5 型）があれば
    shall: folio は図の道具（archify）を子の処理として呼び、検査と描画を仕上がりの段（rules 行 R-14）で掛け、出力から図の本体（SVG）だけを部品として埋め、図の本体の意味の属性（箱の id・種別・名札、線の始点と終点と名札）は落とさない。図の正本を別 file にも散文にも持たない。道具の通信する命令（製品の印の取り込み）は使わない。検査を通らなかった図は生成せず、前の生成物も上書きしない。凍結 anchor（型付き記述 1 本と図の本体の写し）が落ちたら判定を「まだ分からない」に落とす。同じ図の修正の往復が rules 行 R-7 の上限を超えたら止めて持ち主へ渡す。
    plain: 図は AI が決まった書き方（型付きの記述）で書き、外の道具が検査して描きます。図の検査と描画は、いちばん厳しい水準（規則の表 R-14 の showcase）でだけ掛け、水準は緩められません。folio は描かれた図の線と箱だけをページに埋め（箱は番号（id）・種類・名札を、線はどこからどこへつながるかと名札を、そのまま残します）、道具の付けてくる画面は捨て、道具が外と通信する機能は使いません。図の元の記述は文書の正本の中にだけ置きます。検査に通らない図は出さず、前の図もそのまま残します（上書きしません）。基準の図（凍結 anchor）と合わなくなったら「まだ分からない」と言います。直す往復が決めた回数を超えたら止めてあなたに渡します。
    basis: [P-2, P-4, P-11, A-3, P-10]
    rules: [R-5, R-7, R-14, R-15]
    verify: {method: test, how: 仕上がりの段の検査を通らない型付き記述の fixture で図が生成されず前の生成物が残ること、通る fixture で図の本体が部品目録の class だけで埋まることを見る（凍結 anchor = 型付き記述 1 本と図の本体の写し）, ac: [AC12]}
    goals: [GOAL2, GOAL4]
    figures: []
    milestone: M1
    note: 判断の記録 ADR-4。依存（実行環境 Node.js と道具の版・rules 行 R-15）を実際に足す便では A-3.1 の確認を別に取る（CON2）。凍結 anchor を実行時に照合して判定を「まだ分からない」に落とす口は、便 60（台帳 f2-648.91・契約表 docs/design/delivery-60.md 行 bi・2026-09-21 着地）で実装（crates/folio/src/figure.rs）に入った。それまでは anchor（tests/fixtures/figure/anchor/）を読むのは歯 crates/folio/tests/figure.rs だけだった（天井の 10 周目の止める所見 実態との整合 F-3・反証 支持・の是正）。往復の数えは folio の外＝席と器が台帳で数える（判断の記録 ADR-4 決定 (7)・rules 行 R-7 の注・歯 figure.rs の注と同じ）。往復の件数は台帳に記帳し、撤退条件の測定に使う。

  - id: FR16
    title: 判断の記録の面を正本から逐語で生成する
    pattern: event
    strength: must
    when: 判断の記録の正本（adr/ADR-n.yaml）から生成が求められたとき
    shall: folio は判断の記録 1 本につき人が読むページ 1 枚を、3 面と同じ単一の生成器と単一の design token で生成し、中身は正本の欄（見出し・状態・日付・問題・決定・案の表・根拠の id・撤退条件・改訂の一覧・承認欄・平易文・帰結）から逐語で組む。採用した案と退けた案は同じ形で並べる。状態が提案中の記録には「提案中・拘束力なし」の印を、廃止の記録には後継の id への導線を出す。一覧は入口の面の棚から出し、棚から各ページへ辿れるようにする。根拠の id の行き先が無ければ「まだ分からない」の印で出す。
    plain: 「あとから戻せない判断」の記録 1 本につき、入口・憲法・要件書と同じ見た目のページを 1 枚作ります。中身は元の記録をそのまま写し、採った案と退けた案を同じ形で並べ、承認の言葉と日付もそのまま出します。まだ承認されていない記録には「提案中・拘束力なし」の印が付き、廃止された記録には後を継いだ記録への道しるべが付きます。根拠の番号の行き先が見つからないときは「まだ分からない」の印で出します。入口のページの棚から 1 本ずつ開けます。
    basis: [P-2, P-4, P-6, P-12, N-5]
    verify: {method: test+inspection, how: 生成器が出すすべての面の部品の名札（class）が部品目録に在ることを機械が数え（AC2）、そのうち判断の記録の面を個別の固定の材料でも数え（AC14）、生成した判断の記録の面を持ち主が開いて読んで承認する（AC5 の形・逐語と日付を記帳）, ac: [AC2, AC14]}
    goals: [GOAL2]
    figures: []
    milestone: M1
    note: 判断の記録 ADR-7 決定 (1)〜(4)。生成器は手書きのまま（判断の記録 ADR-5 決定 (3)・持ち主の裁定 2026-09-18「推奨で承認する」）。部品目録へ足す部品は最小で、図の型は増やさない。

  - id: FR17
    title: 天井の材料の束を観点ごとに組む
    pattern: event
    strength: must
    when: 天井の材料を組む命令が実行されたとき
    shall: folio は天井の正本の観点ごとに、正本の写し（基準）・生成した面の写し・その観点の問いの文・所見の欄の決まり・読む欄の一覧を 1 つの置き場へ決定的に組み、束の要約値を書く。重さが「止める」の所見については、その所見ごとの反証の材料の束も同じ命令で組む。AI は起動しない。
    plain: AI に読ませる「材料の束」を観点ごとに、機械が何度やっても同じ結果になる形で用意し、束の中身の要約値（中身が 1 字でも変われば変わる短い印）も書きます。「止める」と書かれた所見については、それをもう一度たしかめるための材料の束も、同じ命令で 1 件ずつ用意します。AI を動かすのは folio ではなく、いつも AI を動かしている席や器です。
    basis: [P-3, P-5, P-10, N-5]
    verify: {method: test, how: 欠陥を 1 つ仕込んだ最小の正本の fixture から束を組み、凍結した期待の束と要約値が一致することを見る, ac: [AC15]}
    goals: [GOAL4]
    figures: [図1]
    milestone: M2
    note: 判断の記録 ADR-8 決定 (1)(2)(3)。観点は型に依らない 4 つ（忠実さ・読みやすさ・文書どうしの整合・実態との整合）で天井の正本に閉じる。反証の材料の束を組む口は folio ceiling --refute で、便 42 が 2026-09-19 に着地させた（判断の記録 ADR-8 決定 (3)）。実装に在るその口を要件の文が言っていなかったので、第 1.18 版で 1 文を足した（天井の 11 周目の実態との整合 F-5）。
  - id: FR18
    title: 所見の形と天井の 3 値を床で数える
    pattern: event
    strength: must
    when: 所見 file が置かれ、天井の検査が実行されたとき
    shall: folio は所見 file の欄の決まり・観点の一覧の一致・根拠の逐語の実在・束の要約値の一致・起動の記録の有無を数え、観点ごとに 合格・不合格・まだ分からない を返す。観点ごとの 3 値と日付は、生成する面に天井の名札として、床の合格の名札と別の欄で出す。「まだ分からない」の観点が 1 つでもあれば天井を合格にしない。所見の意味の当否は判定しない。
    plain: AI が返した所見が「決まった形か・根拠が本当に文書にあるか・本当に材料を読んで動いたか」を機械が数えます。観点ごとの結果と日付は、作ったページの上に「天井の名札」として、機械の検査（床）の名札とは別に出します。中身が正しいかは機械は決めません。1 つでも「まだ分からない」があれば合格にしません。
    basis: [P-1, P-3, P-4, P-11]
    verify: {method: test, how: 必須欄を 1 つ欠いた所見 file と要約値の合わない所見 file で「まだ分からない」になり、全観点が合格の fixture でだけ 0 で終わることを見る, ac: [AC16]}
    goals: [GOAL4]
    figures: [図1, 図3]
    milestone: M2
    note: 判断の記録 ADR-8 決定 (3)(4)(5)。止める所見の反証の 2 段目も同じ欄の決まりで受ける。v1.24 で規範文と平易文に、観点ごとの 3 値と日付を面の天井の名札として出す口の 1 文を足した（天井の 20 周目 実態との整合 F-1）。この口は便 40 で着地しており（部品 ceiling-stamp・実装 crates/folio/src/face.rs の ceiling_stamp・旗は folio face --ceiling と folio build --ceiling・歯 crates/folio/tests/badge.rs・部品目録 design-intent/preview/parts.json）、根拠は判断の記録 ADR-8 決定 (4) と部品目録だけが持っていた。要件 FR17 が第 1.18 版で行った補い（実装に在る口を要件の文が言っていなかった）と同じ形で、実装は変えない。
  - id: FR19
    title: 欄の決まりの file と天井の正本と規則の表の決まりの部分を床の定数から導出する（schema）
    pattern: event
    strength: must
    when: folio schema --write が実行されたとき
    shall: folio は判断の記録と設計ノートの欄の決まりの file と天井の正本と規則の表と入口の正本と、要件書・語彙・相談窓口の正本の生成区間へ、床の定数から決定的に導出した決まりの部分（欄の決まり・観点と読む文書の閉じた id の集合・値域と閾値の型・入口の棚の閉じた id の集合・最上位の節の閉じた一覧・要件書の図の節の行の欄）を書き込む。--check は生成区間と導出の差分を検出し、生成区間の印が無ければ「まだ分からない」で、差があれば非 0 で終了する。生成区間の外は書き換えない。
    plain: 「文書の書き方の決まり」を載せたファイルと「AI の審査の決まり」を載せたファイル（天井の正本）と「数値と作法の表」（規則の表）と、入口・要件書・用語集・相談窓口のファイルのうち、決まりの部分（棚に並ぶ文書の種類・章の見出しの一覧など）は機械の中の決まりから folio が、何度やっても同じ結果になる形で書きます。人が手で直してずれたら検査が失敗して止まり、自動で書く区間の目印が無ければ「まだ分からない」と言います。自動で書く区間の外（人が書く部分 = 誰がいつ決めたかの記録・やさしい説明文・規則の表の行など）には触りません。
    basis: [P-6, P-5, N-3]
    verify: {method: test, how: 生成区間を 1 字変えて --check が非 0 になり、印を消すと「まだ分からない」になることを見る, ac: [AC17]}
    goals: [GOAL3, GOAL4]
    figures: []
    milestone: M2
    note: 判断の記録 ADR-9・ADR-11 決定 (4)①（v1.9 で天井の正本を対象に足した）・決定 (4)②（v1.10 で規則の表を対象に足した）。憲法の生成区間（FR6）と同じ型。folio check の置き場ごとの欄単位の検査は変えない。対象の file は増えるたびにこの要件の文に足す（憲法 P-5.6・P-13.3）。v1.22 で入口の正本（便 76 = 棚の閉じた id の集合・ADR-11 決定 (4)④）と要件書・語彙・入口・相談窓口の最上位の節の閉じた一覧と要件書の図の節の行の欄（便 77・決定 (4)⑤）を対象に足した。入口の口は便 76（台帳 f2-648.111・契約は docs/design/delivery-76.md）、要件書・語彙・相談窓口の口は便 77（f2-648.112・契約は docs/design/delivery-77.md）で着地し、8 file すべてが生成区間の印を持つ（実装の TARGETS は 8 file・2026-09-21）。v1.24 で規範文の括弧の「観点と読む欄」を「観点と読む文書の閉じた id の集合」に改めた（天井の 20 周目 整合 F-1）＝天井の正本は観点ごとの読む欄（reads）を生成区間の外の人が書く節に持ち、生成区間に在るのは観点と読む文書の閉じた id だけである（判断の記録 ADR-11 決定 (4)①）。同じ版で根拠から条 P-14 を外した（天井の 16 周目 整合 F-3）＝P-14 の規範文 3 本は folio inject と CLAUDE.md の生成区間だけを縛り、判断の記録 ADR-11 決定 (1) が P-14.3 の掛かる先を CLAUDE.md の生成区間へ狭めている。この注が言う「憲法の生成区間（FR6）と同じ型」は機構の形の相似であって根拠ではない。
  - id: FR20
    title: 天井の門 — 天井の判定の印を生成物として書き、設計文書を書き換える便の受付を印で 3 値に判定する（ceiling --stamp / --gate）
    pattern: event
    strength: must
    when: folio ceiling --stamp か --gate が実行されたとき
    shall: folio は --stamp で、周の結果（観点ごとの所見 file と「止める」の反証の結果 file）から天井の判定の印（周の id・観点ごとの 3 値と反証の結果・正本の要約値・面の要約値・束の要約値・起動の記録・読んだ文書の id）を決定的に導出し、設計文書の置き場の生成物の棚（preview/）へ 1 file で書く（既に同じなら書かない・手で直さない）。--gate は、渡された便の書き換える file の一覧（write-set）と印と今の正本から 3 値を返す。その一覧に設計文書の正本が 1 つも無ければ 0（通す）。在るときは、印が 4 観点とも合格で印の正本の要約値が今の正本の要約値と同じなら 0、印に不合格の観点が在れば 1（止める）、印が無い・印の正本の要約値が今と違う・印に「まだ分からない」の観点が在れば 2（まだ分からない）とし、理由を 1 行で出す。「まだ分からない」の観点が在るときは、不合格の観点が同時に在っても 2（まだ分からない）を先に返す。持ち主の承認欄で発効する設計文書の変更は門の対象外である。
    plain: AI の審査（天井）の結果を、機械が読める「天井の判定の印」として文書の置き場に 1 つ書きます。設計文書を書き換える便を器に出す前に、その印を見て 3 通りに答えます。印が「4 観点とも合格」で、印を付けたときから設計文書が 1 字も変わっていなければ通します。印に不合格が在れば止めます。印が無い・設計文書が変わって印が古い・印に「まだ分からない」が在れば「まだ分からない」と言い、受付を先に進めません（不合格と「まだ分からない」が同時に在るときは「まだ分からない」を先に言います）。実装だけの便と、あなたが承認欄で発効させる設計文書の直しは、門の対象外なのでそのまま進めます（設計文書を触らない便は通す）。
    basis: [P-3, P-4, P-6, P-10, N-3]
    verify: {method: test, how: 凍結の束と所見から導出した印が凍結の写しと一致すること、門の 6 場合（設計文書を触らない・合格で同じ要約値・不合格・要約値が違う・まだ分からないの観点・印が無い）で 3 値が期待どおりになることを見る, ac: [AC18]}
    goals: [GOAL3, GOAL4]
    figures: []
    milestone: M2
    note: この要件の口は 2 つとも着地済みである（--stamp = 便 72・crates/folio/src/stamp.rs・台帳 f2-648.107・2026-09-21／--gate = 便 73・crates/folio/src/gate.rs・台帳 f2-648.108・2026-09-21）。印 design-intent/preview/ceiling-stamp.yaml は、周が 4 観点とも合格したときに席が --stamp で書く生成物で、手で直さない（P-6.2）。初回は天井の 14 周目の合格（2026-09-21）で書いた（design-intent/preview/ceiling-stamp.yaml）。印を導出し直して差分を数える口は持たず、印の鮮度は --gate が印の正本の要約値と今の正本の要約値を突き合わせて測る。器（scribe2）への結線が器の側の口で入るまでは、席の受付の手順で運ぶ（判断の記録 ADR-8 決定 (6)・器への結線は器が決める）。その手順の正本は規則の表の開発規律行 D-12 であり、ここには写さない。判断の記録 ADR-8 決定 (4)（天井が合格でない間は設計文書の便の着地を止める）。門の形の裁定と撤退条件は判断の記録 ADR-8 の注（2026-09-21 の追記）が持つ。形は設計ノート docs/design/ceiling-gate.md。面の天井の名札は印を読む形に変える（別の便）。v1.24 で規範文に 3 値の優先（「まだ分からない」が在れば「不合格」より先に立つ）の 1 文を足し、平易文の門の対象外を規範文の字（持ち主の承認欄で発効する設計文書の変更）に揃えた（天井の 17 周目 実態との整合 F-4・20 周目 忠実さ F-3）。実装（crates/folio/src/gate.rs の run）は初めから「まだ分からない」の観点を先に見て 2 を返しており、規範文の並びだけが逆に読めた＝実装は変えない。受入基準 AC18 の 6 場合は混在の場合を持たない（場合を足すかは別の版）。

nonfunctional:
  - id: NFR1
    title: AI へ常時渡す説明文の上限
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: folio2 の設定が AI へ常時渡す説明文（係と skill の名前 + 説明・母集団は rules 行 R-1）の合計は rules 行 R-1 の値以下にする。
    plain: AI が毎回読まされる「設定が載せている AI の係と skill の説明文」の量に上限を置きます。v1 ではこれが膨らんで遅く高くなりました。前の版の道具は 2026-09-21 に設定から外しました。効くのは AI の席を起こし直した後で、量を数える口もまだ無いので、測り直すまでは「まだ分からない」のままです。
    basis: [N-5, P-14]
    rules: [R-1]
    verify: {method: test, how: 計測 script が数え、R-1 と比べる（値はここに再掲しない）, ac: []}
    goals: [GOAL3, GOAL4]
    figures: [図2-6]
    note: 図の道具（archify）は AI 向けの説明（skill）として載せない＝R-1 の母集団に入れない（判断の記録 ADR-4 決定 (5)・v1.1 で注を足した）。未達である（2026-09-20 時点・天井の 9 周目の止める所見 実態との整合 F-1・反証 支持）。母集団の定義と実測の値は規則の表の行 R-1 の注が持つ（ここには写さない）。この要件の口（常時注入される係と skill の名前と説明を数える）は未実装なので、測り直すまでこの要件の充足は「まだ分からない」として扱う（P-4.2）。
  - id: NFR2
    title: 見た目の材料は 1 か所から
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: 全生成面の design token は単一の定義に由来し、部品目録に無い class は rules 行 R-3 の値（0）、床が掛からない HTML 面は 0 にする。
    plain: どのページも、色や字の大きさ・部品を同じ 1 か所から取ります。「このページだけの飾り」は 0 個。検査（床）が掛からないページも 0 枚。器（scribe2）に要件を読ませるためだけに残していた読み物のページは、2026-09-21 に退役しました（消さずに退役の棚へ移しました）。守れていないページは 0 枚です。
    note: この要件の未達は 2026-09-21 に解消した。床が掛からない HTML 面は 0 枚で、器（scribe2）の要件面は .vessel.toml の requirements が要件書の正本 design-intent/srs.yaml を直に指す。経緯は次のとおり。2026-09-20 までは未達が 1 枚在った（天井の 7 周目（2026-09-20・main 85c3d7a）の止める所見 実態 F-1・反証 支持）。器の審査の要件面のためだけに残していた day-1 の読み物（design-intent/preview/ の下・folio render の生成物）は、自前の design token と部品目録に無い class を持ち、folio parts --check の面の一覧（5 面）に入らなかった。正本との byte 一致（folio render --check）は掛かったが、この要件の言う床（class と design token の突き合わせ）は掛からなかった。読み物は配信先（folio build の出力）にも入口の導線にも載せていない。器の側の口（要件面を要件書の正本から直に読む口・器の台帳 s2-07l.467）は 2026-09-20 に着地して閉じ、器の binary の入れ替え（2026-09-21・器からの連絡）を受けて、読み物は 2026-09-21 に design-intent/preview/retired/readable.html へ可逆に移して退役した（持ち主の裁定 2026-09-21 08:47 JST・逐語「退役して」・A-1・判断の記録 ADR-7 の案 c の理由と同じ見立て。file を消すのは A-1 の「消す」なので持ち主に確認した）。命令 folio render と歯は便 62（2026-09-21 着地）で退役した。
    basis: [P-2]
    rules: [R-3, R-5]
    verify: {method: test, how: 全面の class を部品目録と突合する, ac: [AC2]}
    goals: [GOAL2]
    figures: [図2-4]
  - id: NFR3
    title: 参照は必ずつながる
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: 文書間の参照 id（要件 id・条 id・rules 行 id の内部 3 空間）の未解決は rules 行 R-4 の値（0）にする。外部への参照（報告 HTML 等）は sources 欄に置き、母集団に入れない。
    plain: 「FR3 を見よ」「P-2 による」と書いたら、その番号は必ず実在します。行き先の無い番号は 0 個。外の報告などへの参照はこの数えに入れず、出所の欄（sources）に置きます。
    basis: [P-5, P-7]
    rules: [R-4]
    verify: {method: test, how: 参照 id を全部集め、実在を数える, ac: [AC6]}
    goals: [GOAL4]
    figures: [全段]
    note: rules 行 R-4 の母集団は正本 4 file（憲法・規則の表・語彙・要件書）で、実装（refs.rs）もその 4 file を解く。入口・相談窓口・天井の正本の参照 id はこの母集団の外に在り、その未解決は数えていない＝その部分は「まだ分からない」として扱う（P-4.2）。母集団を広げるかは判断の記録 ADR-3 決定 (6) の読み直しが要る（後続）。v1.24 で規範文の「母集合」を「母集団」に改めた（天井の 20 周目 読みやすさ F-1）＝用語集の見出し語・規則の表の行 R-1 / R-4 / R-9 / R-16・非機能要件 NFR1 の規範文・この要件の注と同じ語に揃えた。数える対象は変えない。

acceptance:
  - {id: AC1, title: 決まった 5 つの回答で支度表ができ、未回答の項目は別枠に出る, plain: 決まった答えを 5 つ入れると「何を作るか」の表が出て、答えなかった項目は別の枠に分けて出る。それを見せてもらえたら OK。, verifies: [FR1, FR2], red_test: {sentence: 固定回答 5 つの fixture を入れ、期待の支度表と一致し、無回答では全項目が別枠に出る, fixture: tests/fixtures/intake/answers-5.yaml}}
  - {id: AC2, title: 生成器が出すすべての面の class が部品目録に存在し、目録に無い class は 0, plain: 生成器が出すすべての面（今は入口・憲法・要件書・判断の記録・設計ノートの 5 つ）のどれにも、部品表に載っていない飾りが 1 つも無いことを、機械（部品の検査 folio parts --check）が数えて見せる。, verifies: [FR4, FR16, NFR2], red_test: {sentence: 目録外 class を 1 つ足した fixture で不合格になり、実の正本から生成した面では合格になる, fixture: tests/fixtures/floor/（mini-ok.html = 通る面・mini-extra.html = 目録外 class を 1 つ足した面・mini.css = 様式の定義・parts-catalog.json = 部品目録の凍結の写し）}}
  - {id: AC3, title: 床を壊した状態で「まだ分からない」が表示され、合格にならない, plain: わざと検査を壊した状態で道具を走らせ、「まだ分からない」と表示されて「合格」にならないことを見せる。, verifies: [FR5], red_test: {sentence: 正本が 1 つ欠けた fixture で床の結果が「まだ分からない」になり「合格」にならない, fixture: tests/fixtures/check/missing-file/}}
  - {id: AC4, title: CLAUDE.md の生成区間を 1 字変えると --check が非 0 で終わる, plain: AI の手元にある憲法の写しを 1 文字だけ書き換えて道具を走らせ、道具が「ずれている」と言って止まることを見せる。, verifies: [FR6], red_test: {sentence: 生成区間を 1 byte 変えた CLAUDE.md で --check の終了コードが非 0 になる, fixture: tests/fixtures/inject/drift/}}
  - {id: AC5, title: 生成した 3 面（入口・憲法・要件書）を持ち主が実際に開いて読み（walk）承認済み, plain: 3 枚のページを実際に開いて見て、持ち主が「確認した　大体これで良い」と言った記録（言葉どおり・日付つき）がある。, verifies: [FR4], red_test: {sentence: 承認の逐語と日付が台帳（f2-648 notes）と承認欄にある, fixture: 入口の正本 index.yaml の承認欄（持ち主の逐語 2026-09-18「確認した　大体これで良い」・生成した 3 面の walk）と bd f2-648 notes。手書きの見本 3 面の段の承認は 2026-09-12「承認するけど…」で、見本は design-intent/preview/retired/ へ退役済み}, note: 付帯条件（user 直命）を受入に含める（G16=A・受入 (d)）。}
  - {id: AC6, title: 内部 3 空間の参照 id の未解決が 0, plain: 要件・条文・数値の表の番号を全部集めて、行き先の無い番号が 0 個であることを機械が数えて見せる。, verifies: [NFR3], red_test: {sentence: 存在しない id を 1 つ書いた fixture で未解決 1 が報告され、正本 4 file では 0 になる, fixture: tests/fixtures/refs/dangling-id/}}

  - {id: AC7, title: 設計ノートが閉じた一覧の節の型だけで生成され、一覧に無い節の型は落ちる, plain: 設計の文書を機械が作れて、知らない種類の節があると作らずに止まることを見せる。, verifies: [FR9], red_test: {sentence: 一覧に無い節の型を 1 つ持つ fixture で生成が落ち、一覧内だけの fixture で通る, fixture: tests/fixtures/design-note/section-types/（落ちる側と通る側の 2 本）}, milestone: M1}
  - {id: AC8, title: 器の導出 file が無いと「まだ分からない」になり、合格にならない, plain: 契約表の「欄の決まり」の写しが無い状態で走らせ、「まだ分からない」と出て「合格」にならないことを見せる。, verifies: [FR10], red_test: {sentence: 導出 file を欠いた fixture で判定が「まだ分からない」になり合格にならない, fixture: tests/fixtures/design-note/schema-missing/}, milestone: M1}
  - {id: AC9, title: 導出物を 1 字変えると --check が非 0 で終わる, plain: scribe2 が読む形の file を 1 文字だけ書き換えて走らせ、「ずれている」と言って止まることを見せる。, verifies: [FR11], red_test: {sentence: 導出物を 1 byte 変えた fixture で --check の終了コードが非 0 になる, fixture: tests/fixtures/contracts/（凍結 anchor = 契約表と期待導出物の対 + 1 字ずらした導出物）。固定の材料はまだ置いていない＝要件 FR11 の口が未実装のため（2026-09-20 時点）・path は便で置くときの予定の名}, milestone: M1}
  - {id: AC10, title: 規範の印を持つ文の違反が数えられ、記述の文は数えられない, plain: 「〜しなければならない」と書いたのに番号が無い文・数と単位を書いた文が違反として出て、普通の説明文は出ないことを見せる。, verifies: [FR12], red_test: {sentence: 参照 id の無い印付きの文 1 つと数と単位を持つ印付きの文 1 つの fixture で違反 2 が報告され、記述の文だけの fixture で 0 になる, fixture: tests/fixtures/prose-gate/}, milestone: M1}
  - {id: AC11, title: 印の無い commit の契約は「まだ分からない」と出て「未着地」と出ない, plain: 便が入ったかを示す印が無いとき、「まだ分からない」と表示され「入っていない」とは表示されないことを見せる。, verifies: [FR13], red_test: {sentence: 印の無い commit の fixture で「まだ分からない」が出て「未着地」が出ず、印の在る fixture で要約値（sha）が出る, fixture: tests/fixtures/rtm/（印の無い commit と印の在る commit の 2 本）。固定の材料はまだ置いていない＝要件 FR13 の口が未実装のため（2026-09-20 時点）・path は便で置くときの予定の名}, milestone: M1}
  - {id: AC12, title: 検査を通らない図は生成されず、前の生成物が残る, plain: わざと崩れた図の記述を入れて走らせ、図が作られず前の図がそのまま残ることを見せる。, verifies: [FR15], red_test: {sentence: 前の生成物を置いた上で、仕上がりの段の検査を通らない型付き記述の fixture を入れると図が生成されず前の生成物の要約値が変わらない, fixture: tests/fixtures/figure/（固定の材料は 2 本 = fails-showcase.json が通らない記述・anchor/spec.json が通る記述。ほかに anchor/body.svg と README.md が在る。前の生成物は固定の材料ではなく歯 crates/folio/tests/figure.rs の中の字列）}, milestone: M1}
  - {id: AC13, title: 器の導出 file を 1 欄変えると契約表の節の欄が追従する, plain: scribe2 側の「欄の決まり」の写しに欄を 1 つ足すと、folio の契約表にもその欄が現れ、folio 側の記録を直さなくてよいことを見せる。, verifies: [FR10], red_test: {sentence: 導出 file に欄を 1 つ足した fixture で契約表の節にその欄が登録され、folio 側の型に欄の一覧が無い, fixture: tests/fixtures/design-note/schema-plus-one/}, milestone: M1}
  - {id: AC14, title: 判断の記録の面のすべての class が部品目録に存在し、目録に無い class は 0, plain: 判断の記録のページに、部品表に載っていない飾りが 1 つも無いことを、機械が数えて見せる。, verifies: [FR16], red_test: {sentence: 目録外 class を 1 つ足した判断の記録の fixture で不合格になり、実の正本の判断の記録では合格になる, fixture: tests/fixtures/face/adr/（判断の記録 2 本 = ADR-1.yaml と ADR-2.yaml・改訂来歴の突き合わせに 2 本目が要る + 目録外 class を足した面 extra-class.html 1 本）}, milestone: M1}

  - {id: AC15, title: 4 観点の材料の束が凍結 fixture から決定的に組め、束の要約値が期待と一致する, plain: 欠陥を 1 つ仕込んだ小さな文書から、4 つの観点の材料の束を機械が組み、凍結してある期待の要約値と一致することを見せる。, verifies: [FR17], red_test: {sentence: 凍結 fixture の正本から組んだ束の要約値が期待の値と違えば不合格になり、期待と同じなら合格になる, fixture: tests/fixtures/ceiling/bundle/（欠陥を 1 つ仕込んだ最小の正本の写し source/ と面の写し faces/）。期待の要約値はこの置き場ではなく歯の側の定数が持ち、同じ歯が外の命令で測り直して突き合わせる（P-10.2）}, milestone: M2, note: 要件 FR17 の第 1.18 版で足した反証の材料の束（folio ceiling --refute）は、この受入の判定の式には入れていない（反証の束の要約値は便 42 の歯が数える・受入基準へ足すかは持ち主の裁定・2026-09-21）}
  - {id: AC16, title: 所見 file の必須欄が欠けるか束の要約値が合わないと「まだ分からない」になり、その観点があると天井は合格にならない, plain: AI の返事が形を守っていない・材料を読まずに書いた、と機械が見抜いて「まだ分からない」と出し、「合格」にしないことを見せる。, verifies: [FR18], red_test: {sentence: 必須欄を 1 つ欠いた所見 file と束の要約値の合わない所見 file で 2 になり、4 観点が形どおりの所見 file でだけ 0 になる, fixture: tests/fixtures/ceiling/findings/（所見 file 11 本 = 合格 4・欄の欠け・要約値違い・根拠が正本に無い・反証が未・反証で支持・反証で全部退けた・所見なしの不合格）}, milestone: M2}
  - {id: AC17, title: 欄の決まりの file と天井の正本と規則の表と入口・要件書・語彙・相談窓口の正本の生成区間を 1 字変えると --check が非 0 で終わり、印が無いと「まだ分からない」になる, plain: 「文書の書き方の決まり」のファイルや天井の正本や規則の表や入口・要件書・用語集・相談窓口のファイルの、自動で書かれた部分を 1 文字だけ書き換えて道具を走らせ、道具が「ずれている」と言って止まることを見せる。目印を消したときは「まだ分からない」と言うことも見せる。, verifies: [FR19], red_test: {sentence: 生成区間を 1 byte 変えた欄の決まりの file か天井の正本か規則の表か入口・要件書・語彙・相談窓口の正本で --check の終了コードが非 0 になり、印の無い file では「まだ分からない」の終了コードになる, fixture: tests/fixtures/schema/（8 file の写し adr-region.txt・ceiling-region.txt・note-region.txt・rules-region.txt・index-region.txt・srs-region.txt・vocabulary-region.txt・intake-region.txt）}, milestone: M2}
  - {id: AC18, title: 天井の印が凍結の束と所見から決定的に導出でき、門が印と便の書き換える file の一覧（write-set）から 3 値を返す, plain: 欠陥を 1 つ仕込んだ小さな文書の審査の結果から機械が印を書き、凍結してある期待と一致することを見せる。その印を使って、設計文書を触らない便は通す・印が合格で文書が変わっていなければ通す・不合格なら止める・印が無い、古い、「まだ分からない」が在るなら「まだ分からない」と言うことを見せる。, verifies: [FR20], red_test: {sentence: 凍結の束と所見から導出した印が期待の写しと違えば不合格になり、門の 6 場合（設計文書を触らない・合格で同じ要約値・不合格・要約値が違う・まだ分からないの観点・印が無い）の終了コードが期待と違えば不合格になる, fixture: tests/fixtures/ceiling/（凍結の束と所見・印の期待の写し）（印の期待の写し = tests/fixtures/ceiling/findings/stamp-expected.yaml・門の側の印の写し 3 本 = 同 dir の stamp-pass / stamp-fail / stamp-unknown.yaml）}, milestone: M2}
not_frozen: 「60 分以内にできる」「300k token 以下」は、ここには書かない。測定の仕組みが違うので、M1 の実地試験（非エンジニア 1 回）で初めて数値を決める。

constraints:
  - {id: CON1, title: 順序, text: 実装本体は持ち主の裁定（2026-09-17）で着手し、変更は器（scribe2）の便で運ぶ（便 1 本 = 契約表の行 1 つ・受付 → 審査 → 実装 → 検査 → 着地）。文書・裁定・小さな試し（spike）は便の外で先に進めてよい。scribe2 の骨格（台帳 s2-07l）の出口を待つ条件はこの版で外した。, basis: [P-13], source: 持ち主の裁定 2026-09-10（s2-07l.42 notes）・2026-09-12（P5）・2026-09-17 07:4x JST（f2-648 notes・逐語「それらの制限はすべて取っ払うので今のscribe2を使ってfolio2の実装を進めろ。」）}
  - {id: CON2, title: 確認, text: 外部ライブラリを増やす・減らすときの確認の義務は条 A-3.1 が持つ（ここには写さない）。, basis: [A-3], source: 憲法 A-3}
  - {id: CON3, title: 公開, text: 見せる先の制限は条 N-6.1 と N-6.2 が持つ（ここには写さない）。, basis: [N-6], source: 憲法 N-6・tailnet-serve の下限}
  - {id: CON4, title: 移行元, text: 前の版（folio v1）の HTML 72 面は凍結。参照するが書かない。物差し役と停止権の制限は条 P-13.2 が持つ（ここには写さない）。, basis: [P-13], source: 報告 軸 5・憲法 P-13}
  - {id: CON5, title: 席のモデル, text: folio の設計判断を下す席（orchestrator 席）は、現行では fable 5.1・effort は high または xhigh で動かす。high と xhigh の切替は持ち主が /effort で手動で行い、folio2 は既定の仕組みを持たない。並列実行・便・作業者の内側で使うモデルの上限は規則の表の行 D-1 のとおり（規則は行が持ち、ここには写さない）。, basis: [P-16], source: "持ち主の裁定 2026-09-12 17:1x（P1 / P4）・席の名は持ち主の裁定 2026-09-20 15:20 JST（f2-648 notes・第 1.13 版）・第 1.19 版で規則の写しをやめ行 D-1 の参照にした（天井の 12 周目の整合 F-3・裁定 id f2-648 notes 2026-09-21 10:17 JST）", rules: [D-1, D-2]}
  - {id: CON6, title: scribe2 の限定利用, text: scribe2 の限定利用の作法は規則の表の行 D-7 のとおり。並列の組み方と予算の明示は行 D-3・D-4 のとおり（規則は行が持ち、ここには写さない）。, basis: [P-13, P-16], source: 持ち主の裁定 2026-09-12（P3 / P5・s2 経由 18:1x）・第 1.15 版で規則の写しをやめ行 D-7 の参照にした（行 D-7 の改訂は同じ承認）, rules: [D-3, D-4, D-7]}
  - {id: CON7, title: 実装の手段, text: folio v2 は Rust の単一 crate として実装する（bash の寄せ集めをやめる）。, basis: [], source: 裁定 s2-07l.42（folio v2 Rust 化・3 択決定）。GOAL4 から移した（G15 D10）。}

  - {id: CON8, title: M1 の順序と移す範囲, text: 契約表は今の形（scribe2 の設計文書の中の機械が読む区間）で着地させ、folio2 の M1 で設計ノートの YAML 正本と導出物へ移す。scribe2 の設計文書のどこまでを YAML へ移すかは、本版（v1.1）の承認時に持ち主へ出す別の論点とし、その裁定 = 最初の範囲は契約表を持つ設計文書だけ（他の設計文書の移行は M1 の後に改めて問う）。, basis: [P-13, P-6], source: 判断の記録 ADR-3 決定 (8)・scribe2 planner の裁定（s2-07l.197 notes 2026-09-13）・持ち主の裁定 2026-09-16「いずれも推奨で進めて」（f2-648 notes 23:5x JST・推奨 = 契約表を持つ文書だけ）}
  - {id: CON9, title: 席へ届く経路, text: 設計ノートや要件書の中身が席の文脈へ届く経路は器（scribe2）の役割の注入が持つ。憲法の注入（FR6）は憲法専用のまま広げない。folio が出すのは機械が読む id の索引（FR14）まで。, basis: [P-14, P-13], source: 判断の記録 ADR-3 決定 (9)}

