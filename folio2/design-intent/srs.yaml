# 決まりの部分（生成区間）。最上位の節の閉じた一覧と図の節の行の欄。正本は実装の型付きの定数（crates/folio/src/check.rs）で、ここはその人が読む写し。手で直さず folio schema --write が書く（判断の記録 ADR-11 決定 (3)(イ)・(4)⑤・憲法 P-5.6）。ほかの節は人が書く
# folio:schema:begin — 生成区間・手で直さない・正本は実装の定数（folio schema --write が書く）
schema:
  top_level:
    - meta
    - goals
    - scope
    - scope_m1
    - actors
    - outputs
    - rail
    - verdicts
    - requirements
    - nonfunctional
    - acceptance
    - not_frozen
    - constraints
    - sources
    - glossary_pointer
    - figures
    - schema
  top_level_note: 最上位の節の閉じた一覧（ほかの節は床が落とす・N-3）。schema のほかの節は人が書き、schema は生成区間。scope_m1 は名を空けてある節で、今の正本には無い
  figures:
    entry: {required: [id, type, caption, spec], optional: [refs, note]}
  figures_note: 要件書の図の節の行の欄（判断の記録と設計ノートの欄の決まりの figures.entry と同じ形）。型（type）の値域は部品目録が持つ
# folio:schema:end
