glossary_pointer: この章は、この文書に出てくる言葉の意味をまとめた一覧です。語と定義の元は語彙の file（vocabulary.yaml）1 つに置いていて、この章は憲法 §7 と同じ形でそれを出します。

# 図の節（便 34 の欄・任意・最上位）: 手順図（非エンジニア向け）と順序図（エンジニア向け）の対（持ち主の裁定 2026-09-19）。型付き記述は図の道具の検査（showcase・R-14）を通したもの。要件の行の figures 欄（図1〜図3）は folio が自前で描く図で、この節とは別。往復の回数は台帳 f2-648 notes に記帳。
figures:
- id: fig-plain
  type: archify-workflow
  caption: 手順図（非エンジニア向け）— 文書が読める形になって届くまで。機械が確かめられなければ止めて知らせ、合格にすり替えない（FR5・FR7）。帯の EX は「だめだったとき」の例外の帯の印（番号の帯とは別扱い）
  refs:
  - FR5
  - FR7
  spec:
    schema_version: 2
    diagram_type: workflow
    meta:
      title: 文書が読める形になって届くまで
      subtitle: 書く → 機械が確かめる → ページにする → 私設ネットの中だけで見せる。確かめられなければ止めて知らせる。
      quality_profile: showcase
      legend: {mode: auto, entries: {frontend: {label: 見せる側（私設ネットの中の面）}, backend: {label: 道具の処理}, security: {label: 確かめて止める側}, external: {label: 人の側（書く人・持ち主）}}}
    lanes:
    - id: writer
      label: 書く人
    - id: folio
      label: folio
    - id: owner
      label: 持ち主
    - id: trouble
      label: だめだったとき
      variant: exception
    nodes:
    - id: write
      lane: writer
      col: 0
      type: external
      label: 正本を書く
      sublabel: 決まった書き方で 1 file
      width: 140
    - id: check
      lane: folio
      col: 1
      type: security
      label: 形を確かめる
      sublabel: 合格・不合格・まだ分からない
      width: 150
    - id: make
      lane: folio
      col: 2
      type: backend
      label: ページを作る
      sublabel: 全部か無しか
      width: 140
