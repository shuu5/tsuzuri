  effective: 承認欄の「承認」に持ち主の逐語と日付が入った時点で発効する（憲法 §6 発効段と同じ形）。版ごとに承認の行を足し、前の版の行は書き換えない。
  changes_from_v1_0:
    - M1 の要件を新しい番号で足した（FR9〜FR15・AC7〜AC13・CON8〜CON9）。M0 の要件（FR1〜FR8・NFR1〜NFR3・AC1〜AC6・CON1〜CON7）は据え置き（P-7.2）。NFR3 と AC6 の母集団（内部 3 空間）は広げない（ADR-3 決定 (6)）
    - 出所 = 判断の記録 ADR-3（契約表の所有と境界・2026-09-16 発効）と ADR-4（図の道具・2026-09-16 発効）の帰結。M1 の範囲 = 設計ノート（1 型・任意の型付き節）・契約表（外部の欄の決まりを参照する節）・導出物と差分 0・散文の門・要件の追跡表の測定値・id の索引・図の生成
    - FR1 に rules 行 D-10（持ち主への問いは対話面の散文で）の参照を足した（D-10 の note の予告どおり）
    - 承認欄は版ごとに行を持つ（v1.0 の行は書き換えない）。v1.1 の承認の行は持ち主の逐語（2026-09-16「いずれも推奨で進めて」）が入って発効した（それまでは status draft で置いていた）
  changes_from_v1_3:
    - 判断の記録の面（人が読むページ）の要件 FR16 と受入基準 AC14 を次の番号で足し、scope の「作らない」の行から判断の記録の生成を外した（設計ノートの生成は M1 のまま）。M0・M1 の要件・受入基準・制約は据え置き（P-7.2）。出所 = 判断の記録 ADR-7（2026-09-18 発効）と持ち主の直命 2026-09-18「ADRも人が読むページの生成に入れて」・裁定「推奨で承認する」（ADR-5 の撤退条件 ① = 手書きのまま）・発効の逐語「承認する」
  changes_from_v1_2:
    - 図 3（検査の答えは 3 つ・FR5 と AC3 の説明図）の正本として verdicts の節を足した（3 行 = 合格・不合格・まだ分からない・各行に id・name・tone・cond）。文は 2026-09-12 に見た目を承認した見本 srs.html の図 3 から起こした。要件・受入基準・制約は据え置き（P-7.2）。出所 = 判断の記録 ADR-5 決定 (1)（文章と数は正本から組む）と持ち主の裁定 2026-09-17（逐語「Aですすめてよい」）
  changes_from_v1_1:
    - CON1（順序）を改訂した: 「実装本体は scribe2 の骨格 s2-07l の出口が出来てから」→「実装本体は持ち主の裁定（2026-09-17）で着手し、変更は scribe2 の便で運ぶ」。持ち主の直命 2026-09-12（設計文書まで・Rust 実装は保留）も同じ逐語で解除。要件・受入基準・他の制約は据え置き（P-7.2）
    - 便 0 の範囲と受け皿（.vessel.toml・docs/design/delivery-0.md の契約表）は要件書の外（設計文書と契約表・判断の記録 ADR-3 決定 (8) の形）

goals:
  - {id: GOAL1, title: 相談して決められる, text: 「どの文書が要るか分からない」を無くす。最初と途中の両方に窓口がある。}
  - {id: GOAL2, title: 見た目が揃う, text: 入口も要件書も同じ品質・同じ様式。割れたページを作れない。}
  - {id: GOAL3, title: AI が自分で動き出す, text: 持ち主が道具を起動しなくても、AI が必要なときに folio を使う。}
  - {id: GOAL4, title: 壊れにくい道具, text: 寄せ集めの script をやめ、1 つの実装に置き換える。検査は黙らない。実装の手段は CON7 が決める。}

scope:
  build:
    - 相談窓口（intake）と支度表
    - 3 面（入口・憲法・要件書）の生成
    - 形の検査（床）と 3 値の判定
    - セッション開始の 1 行
    - 憲法を AI の手元へ写す（inject）
    - 組み立てて見せる（build と serve）
  not_build:
    - M0 では作らない（その後 M1 で着地済み）— 設計ノートの生成。M1 の「作る」の側に移り、要件 FR9 と、判断の記録の面の要件 FR16 が持つ
    - 「番号が実在するか」を機械で追う仕組みの完成形（M0 は参照 id の未解決 0 を数えるだけ）
    - 何が変わったかの検出器
    - "M0 では作らない（見た目の AI 検査はいまも作らない／読みやすさの AI 検査はその後 M2 で着地済み）— 見た目の AI 検査。建てないあいだ、判定は P-4.2 に従って「まだ分からない」として表に出す。読みやすさの AI 検査（天井・置き場の条は P-3.2）は M2 で作った。M2 はこの章に範囲の節を持たず、M2 で作ったもの（天井）の範囲は要件 FR17 / FR18 と判断の記録 ADR-8 が持つ"

scope_m1:
  build:
    - 設計ノートの生成（1 つの型・任意の型付き節・節の型は閉じた一覧）
    - 契約表の節（器 scribe2 の型から導出した欄の決まりを読む）
    - 散文の門（規範の印を持つ文だけ）
    - 要件の追跡表の測定値（着地の印・3 値・出所付き）と id の索引
    - 図の生成（図の道具の型付き記述 → 図の本体を部品として埋める）
  not_build:
    - 他の repo の要件 id・契約 id・便の id を参照 id の床（R-4）で解決すること（測定値に留める・ADR-3 決定 (6)）
    - 契約表の意味の検査（行の id の一意・要件と節の実在・依存の解決と輪の無さ・閉包〔触る型の閉包が書き込み範囲に収まること〕）— 器（scribe2）の編集時の止める仕掛けが持つ（ADR-3 決定 (3)）
    - 図の道具の閲覧の仕掛け（検索・強調・経路の追跡・発表の動き・書き出し）をそのまま置くこと（要るものは部品として持ち直す・ADR-4 決定 (3)）
    - 図の自動配置（座標は AI が書く・ADR-4）
    - 導出物の生成・差分 0 の検査（M1 で作ると決めた後に保留にし、M3 の口へ移した・要件 FR11・判断の記録 ADR-16 決定 (5)(7)）
  note: M1 の実装の着手は CON1 の順序に従う。設計文書（scribe2 の docs/design）を YAML 正本へ移す範囲は CON8 の別の論点。

scope_m3:
  build:
    - M3 の範囲（M3 に限るもの・入口・出口の 3 つの判定点・判定点 ① の前提・判定点の記録）の正本は判断の記録 ADR-16 決定 (1) である（ここには写さない・条 P-6.3）
    - 出口の判定点 ①〜③ を確かめる受入基準は AC23・AC24・AC25 である
    - M3 の道具の口の要件は FR22・FR23・FR24・FR25 と FR11 である（口の割り振りは同 決定 (2)・(7)）
  not_build:
    - M3 に入れないものの正本も判断の記録 ADR-16 決定 (1) である（ここには写さない）。契約表を持たない設計文書の移行は要件書 CON8 のとおり M3 の後に改めて問う
  note: この節は判断の記録 ADR-16 決定 (1) を指す節で、範囲の字を写さない。第 1.37 版までは決定 (1) を人が開いた字で写し、「食い違えば決定 (1) を正とする」の断りだけで 2 面を人の手で保っていた（条 P-6.3・P-6.4 に合わない・天井の 30 周目 整合 F-6）ので、第 1.38 版で写しを外した。要件書に固有なのは、出口の判定点を確かめる受入基準の id と、M3 の口の要件の id だけである。便の列と順序は同 決定 (7) が持つ。決定 (1) を開いた読み方（作業場の言い方と、組み立てを特定する理由の因果）は同じ判断の記録の注に在る（天井の 29 周目 読みやすさ F-3）。

actors:
  - {id: owner, name: 持ち主（非エンジニア）, role: 答える・決める}
  - {id: ai-session, name: AI セッション（Claude Code）, role: 起動する}
  - {id: scribe2, name: scribe2（変更を運ぶ器）, role: 中で動かす}
  - {id: folio-v1, name: folio v1（移行元・読み取りのみ）, role: 読み取る}
  - {id: folio-v2, name: folio v2, role: 道具}
outputs:
  - {id: prep-sheet, name: 支度表, from: FR1}
  - {id: three-faces, name: 3 面（入口・憲法・要件書）, from: FR4}
  - {id: verdict, name: 検査の結果（3 値）, from: FR5}

# 図 2「folio が 1 回で通す 7 段」の正本（段 3 の空欄を解く: 承認は P-12 と A-1 / A-2 が定める）
rail:
  - {n: 1, who: 持ち主, what: 相談して決める, reqs: [FR1, FR2, FR3, FR8]}
  - {n: 2, who: folio, what: 支度表が出る, reqs: [FR1, FR8]}
  - {n: 3, who: 持ち主, what: あなたが決める（採否）, reqs: [], basis: [P-1, P-12], note: この段を定める要件は無い（判断は道具の外・憲法 P-1）。承認の受け方は P-12、確認が要る操作は A-1 / A-2。}
  - {n: 4, who: folio, what: 3 枚を出す, reqs: [FR4, NFR2]}
  - {n: 5, who: folio, what: 床の検査, reqs: [FR5]}
  - {n: 6, who: folio, what: AI の手元へ配る, reqs: [FR6, NFR1]}
  - {n: 7, who: folio, what: 組み立てて、見せる, reqs: [FR7]}

# 図 3「検査の答えは 3 つ」の正本（FR5・AC3 の説明図・v1.3）。tone は図の色（ok / bad / neutral）
verdicts:
  - {id: pass, name: 合格 — 壊れていない, tone: ok, cond: 検査が最後まで動いて、決まりに反する箇所が 1 つも無かったとき}
  - {id: fail, name: 不合格 — 壊れている, tone: bad, cond: 検査が最後まで動いて、決まりに反する箇所が見つかったとき。直して検査をやり直すと「合格」へ移れる}
  - {id: pending, name: まだ分からない — 検査できなかった, tone: neutral, cond: 検査そのものが動かせなかったとき。合格として表示しない（憲法 P-4・AC3）}

requirements:
  - id: FR1
    title: 相談窓口（intake）
    pattern: event
    strength: must
    when: 持ち主が folio intake を実行したとき
    shall: folio は 5 問以下の易しい質問を推奨回答つきで提示し、回答から文書の集合を写像して支度表 1 枚を生成する。
    plain: 「何の文書が要るか」を AI と決める入口。質問は 5 つまで、どれにも「おすすめ」がついています。決まりの文の「写像」は、回答の組み合わせから、要る文書の集合を 1 つに決めることです。結果は支度表 1 枚。
    basis: [P-1]
    verify: {method: test, how: 決まった回答 5 つを入れ、支度表が期待どおりか比較する, ac: [AC1]}
    goals: [GOAL1]
    figures: [図2-1, 図2-2, 図1]
    rules: [D-10]
    note: 回答 → 文書集合の写像表は相談窓口の正本（intake.yaml）に置く（判断の記録 ADR-6 決定 (1)）。当初の案（規則の表か付録の側に置く・G15 D11）は同じ判断が案 b として退けたので、第 1.17 版でこの注を直した。質問と推奨回答は対話面の散文で出し、選択式の窓を使わない（D-10・v1.1 で参照を足した）。
  - id: FR2
    title: 答えが無くても止まらない
    pattern: unwanted
    strength: must
    when: 質問への回答が得られないとき
    shall: folio は推奨回答で進み、支度表に「推奨で進めた項目」を別枠で明示する。
    plain: 忙しくて答えられなくても作業は止まりません。ただし「おすすめで決めた所」は、支度表の中の別の枠にまとめて出します。
    basis: [P-1]
    verify: {method: test, how: 無回答で実行し、別枠に全項目が出ることを見る, ac: [AC1]}
    goals: [GOAL1]
    figures: [図2-1]
  - id: FR3
    title: 気づかせる 1 行
    pattern: state
    strength: should
    when: design-intent が未整備であるあいだ
    shall: セッション開始時に folio は 1 行だけ案内を出す。止める設定は 1 つ、プロジェクト 1 つにつき 1 回のみ。
    plain: 文書がまだ無いプロジェクトでは、AI のセッションが始まったときに一言だけ知らせます（プロジェクト 1 つにつき 1 回だけです）。うるさければ「止める設定」1 か所で切れます。
    basis: [P-1]
    verify: {method: test, how: 未整備 / 整備済 / 止める設定 の 3 状態で出力行数を数える, ac: []}
    goals: [GOAL3]
    figures: [図2-1, 図1]
    note: folio が持つのは命令 folio hello（3 状態の判定・止める設定・1 回きりの印）まで。セッション開始へ結ぶ仕掛け（hook）は各プロジェクトの設定が持ち、folio の外に在る（設計ノートの便 21 の記録）。同じ命令は設計文書が整備済みのときにも 1 行を出すが、そちらは毎回出る別の 1 行で、この要件ではなく FR21 が持つ（第 1.28 版）。置き場に憲法の正本が無いときにこの 1 行が案内する先（骨格の命令）は FR22 が持つ（第 1.34 版）。1 行の案内先は、便 125（台帳 f2-648.173・2026-09-24 着地）で相談窓口の命令から骨格の命令 folio init に替わった＝前の案内先の相談窓口の命令は、憲法の正本の無い新しい repo では行き止まりだった（第 1.38 版で着地の後の字にした）。
  - id: FR4
    title: 入口・憲法・要件書の面を 1 つの生成器と 1 組の design token で出す
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: folio は正本（YAML）から入口・憲法・要件書の 3 面を、単一の生成器と単一の design token で生成する。
    plain: 入口・憲法・要件書の面は、元のファイル（正本 YAML）から同じ係が同じ材料（色や字の大きさの元の値と、決まった部品）で作るので、見た目が割れません。
    basis: [P-2, P-6]
    verify: {method: test+inspection, how: 目で見て確かめ、NFR2 の数値で判定する, ac: [AC2, AC5]}
    goals: [GOAL2]
    figures: [図2-4, 図1]
    note: この要件が名指すのは M0 の 3 面（入口・憲法・要件書）である。あとから足した面は別の要件が定める＝設計ノートの面は FR9、判断の記録の面は FR16 で、どちらも同じ生成器と同じ design token で出る。いま読める面の数はここに書かず、入口の棚が正本から数えて出す（P-6.3）。第 1.29 版で見出しから枚数を外し、見出しの射程を規範文と同じ 3 面（入口・憲法・要件書）に揃えた（天井の 25 周目 読みやすさ F-4 = 見出しの 3 と受入基準 AC2 の 5 と入口の棚の数が別々に読めた／独立の検証 3-d = 数を外しただけの見出しは規範文より広く読める）。
  - id: FR5
    title: 検査結果を必ず返す
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: folio は配信先を組み立てるたびに（folio build）構造の床を実行し、結果を合格・不合格・まだ分からない の 3 値で返す。実行できなかった検査を合格と表示しない。
    plain: 配信先を組み立てるたび（folio build）に形の検査（床）を回し、「合格・不合格・まだ分からない」の 3 つのどれかを必ず表示します。「分からない」を「合格」にすり替えません。
    basis: [P-3, P-4]
    verify: {method: test, how: 床を故意に壊して「まだ分からない」になることを見る, ac: [AC3]}
    goals: [GOAL4]
    figures: [図2-5, 図1, 図3]
    note: v1.11 で床を回す口を定めた。folio build の --write は最初に構造の床を回し、不合格なら配信先へ 1 file も書かずに非 0 で終え、まだ分からないなら書いたうえで「まだ分からない」の終了コードで終える。面 1 枚の口（face）と図の口（figure）は部品の口で、床は回さない。天井の 3 周目の止める所見（実態 F-1・反証 支持）の是正。
  - id: FR6
    title: 憲法を AI の手元に届ける（inject）
    pattern: event
    strength: must
    when: folio inject --write が実行されたとき
    shall: folio は憲法の前文と規範文を持つ条を CLAUDE.md の生成区間へ書き込む。--check は区間と正本の差分を検出し、差があれば非 0 で終了する。
    plain: 憲法の前文（迷ったらどちらへ倒すかの順位）と、「決まりの文（規範文）を持つ条」を全部、AI が毎回読む場所（CLAUDE.md）に、何度やっても同じ結果になる形で写します。ずれていたら検査が失敗して止まります。
    basis: [P-14, P-6]
    rules: [R-2]
    verify: {method: test, how: 区間を 1 字変えて --check が非 0 になることを見る, ac: [AC4]}
    goals: [GOAL3, GOAL4]
    figures: [図2-6]
    note: v1.24 で規範文と平易文に憲法の前文（順位）を足した（天井の 19 周目 整合 F-2・20 周目 整合 F-4）。条 P-14.1 と規則の表の行 R-2 の注入の範囲の欄は初めから「前文 + 規範文を持つ条」で、実装（folio inject）も生成区間の先頭に前文を写しており、狭かったのはこの要件の文だけだった。第 1.24 版より前のこの欄は見本の根拠の誤参照への書き手あてのメモで、正しい根拠（P-14 と P-6）は同じカードの根拠の欄に在るので落とした（天井の 17 周目 読みやすさ F-6）。
  - id: FR7
    title: 組み立てて、見せる（build / serve）
    pattern: event
    strength: must
    when: folio build が実行されたとき（規範文の前半）と、folio serve が起動されたとき（後半の配信の接続先）
    shall: folio は全面を配信先へ生成する。folio serve は同じ端末の中（loopback）か tailnet の上でのみ配信し、公開ネットへ接続（bind）しない。
    plain: 「作る」と「見せる」の 2 つの命令。作るときは 1 枚ずつではなく全部の面をまとめて配信先へ出します（1 枚でも作れなければ 1 byte も書きません）。見せる先は自分の端末どうしの私設ネット（tailnet）か、同じ端末の中（loopback）だけ。
    basis: [N-6]
    verify: {method: test+inspection, how: 住所を明示して同じ端末の中でも tailnet の中でもない先を指す起動を拒むことと、住所を明示しない起動で tailnet の住所を解けなければ拒むことを見る, ac: []}
    goals: [GOAL2]
    figures: [図2-7]
    note: v1.23 で規範文と平易文に同じ端末の中（loopback）を足した（判断の記録 ADR-12・条 N-6.1 の第 1.2 版の改訂と同じ向き）。出所は天井の 17 周目（2026-09-21）の実態との突き合わせの所見 F-1（条の側・止める）と F-2（この要件の側）で、実装・歯・便 17 の契約・同じ file の図の節の名札は初めから同じ端末の中を通す側で揃っており、食い違っていたのは条とこの規範文の 2 か所だけだった。確かめ方の欄も同じ版で、便 17 に既に在る歯（住所を明示して外の先を指す起動を拒む・住所を明示しない起動で tailnet の住所を解けなければ拒む）まで広げた＝新しい歯は要らず、欄が見る道が実装と同じ 2 本になった（所見 F-2 の残りはこれで閉じる）。平易文の直し（第 1.24 版・天井の 16 周目 忠実さ F-3・18 周目 忠実さ F-4・20 周目 忠実さ F-4）= 規範文の前半（全面を配信先へ生成する）が平易文に無かったので 1 文を足した。規範文は変えない。面の導出は全部か無しかである（1 枚でも導出できなければ 1 byte も書かない・実装は crates/folio/src/site.rs・M3 の範囲を決めた判断の記録の決定 (5) が「配信の組み立ての全部か無しかは変えない」と決めている）。第 1.33 版でこの 1 文をこの注に書き、平易文の括弧から「要件 FR5 の注が持つ」という取り違えた帰属を外した（天井の 27 周目 忠実さ F-2＝FR5 の注が持つのは床が不合格なら書かない約束で、面の全部か無しかは持たない）。手順図 fig-plain と順序図 fig-tech の「全部か無しか」の名札はこの注を根拠にする。規範文は変えない。第 1.39 版で起きるときの欄に folio serve の起動を足した＝起きるときが folio build の実行だけで、規範文の後半の配信の接続先の縛りが build の実行を条件にするように読めた。根拠の条 N-6.1 は serve を起動するたびに掛かり、確かめ方の欄が見るのも serve の起動である（天井の 31 周目 整合 F-4）。shall の字と確かめ方は変えない。
  - id: FR8
    title: 途中で足す窓口
    pattern: event
    strength: should
    when: 持ち主が文書の追加・削除を求めたとき
    shall: folio は差分だけを対象に intake を再実行し、支度表を更新する。
    plain: あとから「やっぱりこの文書も」「これはもう要らない」となっても、最初からやり直さず、差分だけ相談します。
    basis: [P-1]
    verify: {method: test, how: 既存の支度表 + 追加 1 型で、質問が差分だけになることを見る, ac: []}
    goals: [GOAL1]
    figures: [図2-1, 図2-2]

  - id: FR9
    title: 設計ノートを 1 つの型で生成する
    pattern: event
    strength: must
    when: 設計ノートの正本（YAML）から生成が求められたとき
    shall: folio は設計ノートを 1 つの型（密度 profile の 1 行）として生成し、節は閉じた一覧にある型（部品の表・口の表・欄の表・歯の表・契約表など）だけを許し、一覧に無い型の節を持つ正本は生成せずに落とす。正本の形（重複キー・未知の欄・欄の非空）は構造の床（FR5）で数える。
    plain: 「どう作るか」を書く設計の文書は 1 種類だけ。中の節（部品の表・契約表など）は決まった種類から選び、知らない種類の節があれば作らずに止めます。前の道具のように文書の種類ごとに係を増やしません。正本の形（同じ欄名が 2 度出ること・知らない欄・空の欄）は構造の床（FR5）が数えます。
    basis: [P-5, P-2, N-5, P-13]
    adrs: [ADR-3]
    verify: {method: test, how: 閉じた一覧に無い節の型を 1 つ持つ fixture で生成が落ち、一覧内だけの fixture で通ることを見る, ac: [AC7]}
    goals: [GOAL2, GOAL4]
    figures: []
    milestone: M1
    note: 判断の記録 ADR-3 決定 (1)。何が folio2 の開発を拘束するかは語彙の設計文書の項と P-13 が決め、密度 profile は見せ方だけを持つ。設計ノートの正本の未知の欄は、2026-09-21 までは最上位の節と表の行だけを床が数え、meta・節（sections の行）・図の行（figures の行）は数えていなかった（天井の 11 周目の止める所見 実態との整合 F-1・反証 支持）。この 3 階層は便 61（台帳 f2-648.92・契約表 docs/design/delivery-61.md 行 bj・2026-09-21 着地）で床に入った。
  - id: FR10
    title: 契約表の欄は器の導出 file から読む
    pattern: event
    strength: must
    when: 設計ノートの節の型が「外部の欄の決まりを参照する型」（契約表）であるとき
    shall: folio は器（scribe2）が自分の型から導出した型付き file（欄の集合と値域）を読んで節の欄を登録し、欄の一覧を自分の型にも散文にも持たない。導出 file が読めないときは「まだ分からない」と出し、合格にしない。
    plain: 便の約束を書く表（契約表）の「どんな欄があるか」は scribe2 の機械が決めていて、folio はその写し（file）を読むだけ。欄が増えても folio 側に判断の記録は要りません。写しが読めなければ「まだ分からない」と言い、合格にはしません。
    basis: [P-5, P-6, N-2, P-4]
    adrs: [ADR-3]
    verify: {method: test, how: 導出 file を 1 欄変えた fixture で節の欄が追従し、導出 file を欠いた fixture で「まだ分からない」になることを見る, ac: [AC8, AC13]}
    goals: [GOAL4]
    figures: []
    milestone: M1
    note: 判断の記録 ADR-3 決定 (2)・(3)。契約表の意味の検査（行の id の一意・要件と節の実在・依存の解決と輪の無さ・閉包）は器の 1 つの関数が編集時に持ち、folio は持たない。器の導出 file（contracts/schema.toml）を探す場所は、判断の記録 ADR-16 決定 (2)(キ) で、検査する置き場の親の場所の固定から、置き場を含む版管理の根へ改める（版管理の根が無ければ置き場の親に倒す・床と面の生成器で 1 つの関数を共有する・第 1.34 版で書いた）。口は同じ判断の記録の決定 (7) の ④ の 1 便目（便 123・台帳 f2-648.172・2026-09-24 着地）で入った＝版管理の根は crates/folio/src/gitcheck.rs が求め、器の導出 file の path は crates/folio/src/note.rs の 1 つの関数が解き、床の読み手と面の生成器がそれを共有する（歯は crates/folio/tests/resolve.rs）。④ の 2 便目（骨格の命令）は要件 FR22 の口である（第 1.38 版で着地の後の字にした・天井の 29 周目 実態 F-6）。folio2 自身では置き場の親が版管理の根なので結果は変わらない。
  - id: FR11
    title: 導出物を生成し、差分 0 を数える
    pattern: event
    strength: must
    when: 導出物の検査の命令 folio derive --check（配信の組み立て folio build から切り離した独立の命令・面の生成器も様式の file も呼ばない）が実行されたとき
    shall: folio は設計ノートの契約表から器の形（表の形式の契約の配列・各行に節の本文の逐語・空の一覧は欄名を省く・先頭に版の宣言・器の値の文法〔文字列・文字列の一覧・数・真偽〕を共有する）の導出物を生成し、版管理に置かれた導出物との差分を数えて、差があれば非 0 で終了する。この検査は事後の検出であり、編集の時点で止める仕掛けの代わりにしない。
    plain: 契約表から scribe2 が読む形の file を機械が作り、版管理（repo）に置いてある file と 1 字でもずれていれば「ずれている」と言って止まります。ただしこれは後から数える検査で、書いた瞬間に止める仕掛けの代わりではありません。
    basis: [P-6, P-18, P-10]
    adrs: [ADR-3, ADR-16]
    verify: {method: test, how: 手書きの契約表と期待される導出物の対を凍結 anchor（生成器から独立した固定の fixture）として置き、導出物を 1 字変えた fixture で --check が非 0 になり、anchor と一致する fixture で 0 になることを見る（生成物どうしの突き合わせだけを合格にしない）, ac: [AC9, AC24, AC25]}
    goals: [GOAL4]
    figures: []
    milestone: M3
    note: 状態は 保留の解除（第 1.31 版・裁定 id f2-648 notes 2026-09-23 17:39 JST・判断の記録 ADR-16 決定 (5)）。解除の前提とした器の口 s2-07l.473（導出物の欄 goal の受け口）は着地していない＝s2-07l.473 は 2026-09-22 に memo として閉じられ未着地（folio2 席の返答「保留・閉じてよい」）。器の読み手は導出物の欄 goal を未知の key として断る（scribe2 main 596989b・2026-09-24 実測）ので、判定点 ③（器が導出物を読む・ADR-16 決定 (1)）は器の受け口の着地が要る。s2-07l.473 は 2026-09-24 に器の台帳で再開された（契約 1 本・S 見込み）。s2-07l.473 の着地は判定点 ③ の前提（受け口）である。判定点 ③ の測定値は、器の受付が folio2 の導出物を読んで通した記録（利用者の台帳）で、在れば着地・無ければ まだ分からない（ADR-16 決定 (5)）。folio2 の側の口（独立の命令 folio derive / --check・便 119）はそれに依らず起こし、2026-09-24 に着地した（main c33ee44・folio2 自身の導出物 contracts/example.toml が版管理に載り、差分 0 を数えた＝判定点 ①② の folio2 側の材料）（第 1.33 版で「器の口 s2-07l.473 は 2026-09-22 に着地し」の誤りを直した・ADR-16 の注 (f)）。この要件の状態を定めるのはこの欄 1 か所で、台帳 f2-648.143 と判断の記録と設計ノートの字はこの欄に従い、食い違えばこの欄を正とする（第 1.33 版で「同じ状態を指すだけである」の字を改めた＝台帳の題と本文が第 1.31 版に追随していなかった・天井の 27 周目 実態 F-1）。判断の記録 ADR-3 決定 (4)（導出物の形）。器は統合先（main）へ着地した後の受付からしか新しい表を読まない（正本の改訂 → 取り込みの要求 → 着地 → 再受付）。導出物を組む口と差分を数える口は、上に書いたとおり便 119（台帳 f2-648.167）で着地した。命令の名 folio derive と、設計ノートの欄の決まりの床の定数が名指す導出物の検査の命令（生成区間の字 folio derive --check）も同じ便で直した（第 1.35 版で、この段の着地の前の字を着地の後の字に改めた・天井の 28 周目 整合 F-1・実態 F-1）。判断の記録 ADR-3 決定 (3) の括弧の命令の名は呼び名の例示として読む。第 1.39 版で段の欄を M1 から M3 へ改めた＝この要件は M1 で作ると決めた後に保留になり、判断の記録 ADR-16 決定 (5) の M3 の入口の再判定で保留を解いて M3 の口に数えた（同 決定 (7) の ⑤・M3 の範囲の節）が、段の欄だけが M1 のまま残り、同じ要件が M1 と M3 の 2 つの段に読めた（天井の 31 周目 整合 F-3）。確かめる受入基準 AC9 の段の欄も同じ版で M3 にし、M1 の範囲の節の作るの 2 行目から導出物の生成と差分 0 の検査を外して、作らないの側に M3 の口へ移したことを書いた。規範文と確かめ方と受入の判定の式は変えない。
  - id: FR12
    title: 散文の門（規範の印を持つ文だけ）
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: folio は設計ノートの散文のうち、規範の印（rules 行 R-16 の一覧）を持つ文が、同じ文の中に参照 id（条 id・rules 行 id・要件 id・契約 id）を持ち、数と単位（rules 行 R-16 の一覧）を持たないことを床で数え、違反があれば落とす。記述の文は数えない。
    plain: 設計の説明文の中で「〜しなければならない」のような決まりの言い方をした文には、必ず番号（条・数値の表の行・要件・契約のどれか）を添え、「30 秒」のような単位のついた数を書かないことを機械が数えます（単位の無い数や普通の説明文は自由です）。
    basis: [N-2, P-5, P-10, P-6]
    rules: [R-16]
    adrs: [ADR-3]
    verify: {method: test, how: 印を持つ文に参照 id が無い fixture と数と単位を持つ fixture で違反が数えられ、記述の文だけの fixture で 0 になることを見る（凍結 anchor を持つ）, ac: [AC10]}
    goals: [GOAL4]
    figures: []
    milestone: M1
    note: 判断の記録 ADR-3 決定 (7)。器（scribe2）が暫定の門を持つ。撤去の条件は、ADR-3 決定 (7) の「folio2 が引き取ったら」を判断の記録 ADR-16 決定 (6) が定め直した。folio2 の引き取りは便 24 で済んだ（2026-09-18）が、器の側の暫定の門は 2026-09-23 時点でも残っている。器の暫定の門とこの要件の床は、印と単位の一覧は同じだが同じ式ではない（違いが 3 つ在る）。違いの中身と、撤去をいつ器へ要求するかの正本は規則の表の行 R-16 の注で、ここには写さない（P-6.3・第 1.28 版で二重の記述を外した・第 1.33 版で「同じ式を暫定で持つ」の字を改めた＝天井の 27 周目 整合 F-2）。意味だけで規範になる文は床の外（天井）。数と単位を散文から一律に排する床は採らない（偽陽性）。
  - id: FR13
    title: 着地は印だけから読み、無ければ「まだ分からない」
    pattern: event
    strength: must
    when: 要件の追跡表を生成するとき
    shall: folio は各契約の着地を、統合先の commit の末尾の印（器が書く契約 id と要件 id）だけから読み、印が在れば着地（印の commit の要約値（sha））、無ければ「まだ分からない」と出し「未着地」とは言わない。他の repo の要件 id・契約 id・便の id は参照 id の床（rules 行 R-4）の母集団に入れず、出所付きの測定値（3 値）として扱う。
    plain: 「その便は本当に入ったか」は、scribe2 が版管理に変更を記録するとき（その 1 回分の記録を commit と呼びます）に、その記録の末尾に書く印だけを見て答えます。印があれば「入った」、無ければ「まだ分からない」と言い、「入っていない」とは言いません。scribe2 側の番号が実在するかは folio の検査で追わず、測った値として見せるだけです。
    basis: [P-4, P-7, P-10, P-13]
    rules: [R-4]
    adrs: [ADR-3]
    verify: {method: test, how: 印の無い commit の契約が「まだ分からない」と出て「未着地」と出ないこと、印の在る commit で sha が出ることを見る, ac: [AC11]}
    goals: [GOAL4]
    figures: []
    milestone: M1
    note: 状態は 保留＝判断の記録 ADR-16 決定 (5) の M3 の入口の再判定（2026-09-23 17:39 JST の承認）で、M3 に入れず保留のまま残した。保留にしたとき（第 1.30 版・裁定 id f2-648 notes 2026-09-23 08:13 JST）の条件だった器の口 s2-07l.473 は着地していない（2026-09-22 に memo として閉じられた・要件 FR11 の注）。この要件の口は要件 FR11 の導出物の便（ADR-16 決定 (7) の ⑤）の後に起こす。次に再判定するのは M3 の出口（ADR-16 決定 (1) の判定点 ①〜③ が揃ったとき）である（第 1.33 版・天井の 27 周目 整合 F-1・実態 F-2）。この要件の状態を定めるのはこの欄 1 か所で、台帳 f2-648.144 と判断の記録と設計ノートの字はこの欄に従い、食い違えばこの欄を正とする。判断の記録 ADR-3 決定 (5)・(6)。自分の repo への取り込みの要求で終わる形（印も記録も持たない）は恒久に「まだ分からない」。器の記録の書き出しは出所付きの測定値として補助に留める。この要件の口（commit の末尾の印から着地を読む）は未実装である（2026-09-24 時点・crates/folio/src に commit の末尾の印を読む口は無い）。第 1.39 版で平易文の commit に言い換えを添えた（天井の 31 周目 読みやすさ F-3・語彙には足していない＝版管理の操作名として英字の識別子の側に在る）。規範文は変えない。
  - id: FR14
    title: 機械が読む id の索引を出す
    pattern: event
    strength: should
    when: folio graph --print が実行されたとき
    shall: folio は機械が読む id の索引を、設計文書の正本から毎回組み直す導出物として出す。索引は節点（設計文書の中で id を持つ行・欄は id と種類と所属 file と欄の要約値と 1 行の題）と辺（両端の節点の id と型）を持ち、種類と型は索引の欄の決まりの正本が持つ閉じた一覧とする。索引の中身そのものは版管理に置かない。中身を席へ届ける経路は CON9 のとおり器が持つ。
    plain: AI が「どんな文書・要件・決まりがあって、どれがどれを指しているか」を引ける一覧を出します。一覧は「点」（設計文書の中で番号を持つ行。番号・種類・どのファイルに在るか・中身の短い印・1 行の題を持つ）と「指し合い」（両端の点の番号と、指し方の種類）でできていて、点の種類も指し方の種類も決まった一覧から選びます。一覧は毎回その場で作り直すもので、ファイルとして版管理に残すものではありません。中身を AI の手元に届けるのは scribe2 の役目です（CON9）。
    basis: [P-5, P-6]
    adrs: [ADR-3, ADR-13]
    verify: {method: test, how: 索引の節点の id の集合が正本の id の集合と一致し、辺の型が閉じた一覧の外に出ないことを見る, ac: []}
    goals: [GOAL3]
    figures: []
    milestone: M1
    note: 判断の記録 ADR-3 決定 (9)・ADR-13 決定 (1)(2)(4)。この要件の口は 2026-09-22 に着地した（台帳 f2-648.132・契約は docs/design/delivery-94.md）。第 1.28 版で、口の名（folio graph --print）と起動の条件と索引の中身を着地した実装に合わせた＝前の字は口の名を持たず、起動の条件を folio build とし、索引の中身を「文書・要件・契約の id と 1 行の題」と書いていた。節点の種類と辺の型の閉じた一覧の正本は実装の型付きの定数で、その写しは索引の欄の決まりの正本の生成区間に在る（FR19 の対象）。第 1.38 版で根拠の欄から憲法の注入の条（folio inject と CLAUDE.md の生成区間だけを縛る条・FR19・NFR1 の注と同じ読み）を外し、条 P-6 を足した（天井の 29 周目 整合 F-4）＝索引は CLAUDE.md に入らず、正本から毎回組み直す導出物なので、正本と導出の条 P-6 を根拠に置く。注入を広げない断りの在り処は CON9 である。
  - id: FR15
    title: 図は型付き記述から生成し、通らない図は出さない
    pattern: event
    strength: must
    when: 文書を生成するとき、正本の図の節に図の道具の型付き記述（rules 行 R-5 の一覧のうち道具の 5 型）があれば
    shall: folio は図の道具（archify）を子の処理として呼び、検査と描画を仕上がりの段（rules 行 R-14）で掛け、出力から図の本体（SVG）だけを部品として埋め、図の本体の意味の属性（箱の id・種別・名札、線の始点と終点と名札）は落とさない。図の正本を別 file にも散文にも持たない。道具の通信する命令（製品の印の取り込み）は使わない。検査を通らなかった図は生成せず、前の生成物も上書きしない。凍結 anchor（型付き記述 1 本と図の本体の写し）が落ちたら判定を「まだ分からない」に落とす。同じ図の修正の往復が rules 行 R-7 の上限を超えたら止めて持ち主へ渡す。
    plain: 図は AI が決まった書き方（型付きの記述）で書き、外の道具が検査して描きます。図の検査と描画は、いちばん厳しい水準（規則の表 R-14 の showcase）でだけ掛け、水準は緩められません。folio は描かれた図の線と箱だけをページに埋め（箱は番号（id）・種類・名札を、線はどこからどこへつながるかと名札を、そのまま残します）、道具の付けてくる画面は捨て、道具が外と通信する機能は使いません。図の元の記述は文書の正本の中にだけ置きます。検査に通らない図は出さず、前の図もそのまま残します（上書きしません）。基準の図（凍結 anchor）と合わなくなったら「まだ分からない」と言います。直す往復が決めた回数を超えたら止めてあなたに渡します。
    basis: [P-2, P-4, P-11, A-3, P-10]
    rules: [R-5, R-7, R-14, R-15]
    adrs: [ADR-4]
    verify: {method: test, how: 仕上がりの段の検査を通らない型付き記述の fixture で図が生成されず前の生成物が残ること、通る fixture で図の本体が部品目録の class だけで埋まることを見る（凍結 anchor = 型付き記述 1 本と図の本体の写し）, ac: [AC12]}
    goals: [GOAL2, GOAL4]
    figures: []
    milestone: M1
    note: 判断の記録 ADR-4。依存（実行環境 Node.js と道具の版・rules 行 R-15）を実際に足す便では A-3.1 の確認を別に取る（CON2）。凍結 anchor を実行時に照合して判定を「まだ分からない」に落とす口は、便 60（台帳 f2-648.91・契約表 docs/design/delivery-60.md 行 bi・2026-09-21 着地）で実装（crates/folio/src/figure.rs）に入った。それまでは anchor（tests/fixtures/figure/anchor/）を読むのは歯 crates/folio/tests/figure.rs だけだった（天井の 10 周目の止める所見 実態との整合 F-3・反証 支持・の是正）。往復の数えは folio の外＝席と器が台帳で数える（判断の記録 ADR-4 決定 (7)・rules 行 R-7 の注・歯 figure.rs の注と同じ）。往復の件数は台帳に記帳し、撤退条件の測定に使う。

  - id: FR16
    title: 判断の記録の面を正本から逐語で生成する
    pattern: event
    strength: must
    when: 判断の記録の正本（adr/ADR-n.yaml）から生成が求められたとき
    shall: folio は判断の記録 1 本につき人が読むページ 1 枚を、3 面と同じ単一の生成器と単一の design token で生成し、中身は正本の欄（見出し・状態・日付・問題・決定・案の表・根拠の id・撤退条件・改訂の一覧・承認欄・平易文・帰結）から逐語で組む。採用した案と退けた案は同じ形で並べる。状態が提案中の記録には「提案中・拘束力なし」の印を、廃止の記録には後継の id への導線を出す。一覧は入口の面の棚から出し、棚から各ページへ辿れるようにする。根拠の id の行き先が無ければ「まだ分からない」の印で出す。
    plain: 「あとから戻せない判断」の記録 1 本につき、入口・憲法・要件書と同じ見た目のページを 1 枚作ります。中身は元の記録をそのまま写し、採った案と退けた案を同じ形で並べ、承認の言葉と日付もそのまま出します。まだ承認されていない記録には「提案中・拘束力なし」の印が付き、廃止された記録には後を継いだ記録への道しるべが付きます。根拠の番号の行き先が見つからないときは「まだ分からない」の印で出します。入口のページの棚から 1 本ずつ開けます。
    basis: [P-2, P-4, P-6, P-12, N-5]
    adrs: [ADR-5]
    verify: {method: test+inspection, how: 生成器が出すすべての面の部品の名札（class）が部品目録に在ることを機械が数え（AC2）、そのうち判断の記録の面を個別の固定の材料でも数え（AC14）、生成した判断の記録の面を持ち主が開いて読んで承認する（AC5 の形・逐語と日付を記帳）, ac: [AC2, AC14]}
    goals: [GOAL2]
    figures: []
    milestone: M1
    note: 判断の記録 ADR-7 決定 (1)〜(4)。生成器は手書きのまま（判断の記録 ADR-5 決定 (3)・持ち主の裁定 2026-09-18「推奨で承認する」）。部品目録へ足す部品は最小で、図の型は増やさない。

  - id: FR17
    title: 天井の材料の束を観点ごとに組む
    pattern: event
    strength: must
    when: 天井の材料を組む命令が実行されたとき
    shall: folio は天井の正本の観点ごとに、その観点が読むと宣言した節まで絞った正本の写し（基準）・生成した面の写し・その観点の問いの文・所見の欄の決まり・読む欄の一覧を 1 つの置き場へ決定的に組み、束の要約値を書く。重さが「止める」の所見については、その所見ごとの反証の材料の束も同じ命令で組む。AI は起動しない。
    plain: AI に読ませる「材料の束」を観点ごとに、その観点が読むと言った章だけに絞って、機械が何度やっても同じ結果になる形で用意し、束の中身の要約値（中身が 1 字でも変われば変わる短い印）も書きます。「止める」と書かれた所見については、それをもう一度たしかめるための材料の束も、同じ命令で 1 件ずつ用意します。AI を動かすのは folio ではなく、いつも AI を動かしている席や器です。
    basis: [P-3, P-5, P-10, N-5]
    adrs: [ADR-8, ADR-13]
    verify: {method: test, how: 欠陥を 1 つ仕込んだ最小の正本の fixture から束を組み、凍結した期待の束と要約値が一致することを見る, ac: [AC15]}
    goals: [GOAL4]
    figures: []
    milestone: M2
    note: 判断の記録 ADR-8 決定 (1)(2)(3)。観点は型に依らない 4 つ（忠実さ・読みやすさ・文書どうしの整合・実態との整合）で天井の正本に閉じる。反証の材料の束を組む口は folio ceiling --refute で、便 42 が 2026-09-19 に着地させた（判断の記録 ADR-8 決定 (3)）。実装に在るその口を要件の文が言っていなかったので、第 1.18 版で 1 文を足した（天井の 11 周目の実態との整合 F-5）。第 1.28 版で、束を観点が読むと宣言した節まで絞る 1 句を規範文と平易文に足した（判断の記録 ADR-13 決定 (5)）。絞る口は便 98（台帳 f2-648.140・2026-09-22 着地・実装は crates/folio/src/ceiling_src.rs の cut_sections）で入り、凍結 anchor は folio の実装に依らない独立の script が組む（決定 (10)・便 97 = 台帳 f2-648.135・2026-09-22 着地）。判断の記録 ADR-13 の決定 (5)(10) は絞る単位を「観点が宣言する読む欄」と書くが、この規範文と実装の単位は節である＝観点が読むと宣言した欄を含む最上位の節を丸ごと残し、宣言の無い最上位の節だけを落とす（宣言が欄まで下りていても、同じ節の中のほかの欄は落とさない）＝決定の単位（欄）より粗い節で止めており、切る上限（読まないと宣言した欄だけを切る）は守っている。第 1.32 版でこの断りを足し、判断の記録 ADR-13 の注 (m) も同じことを書く（天井の 26 周目 整合 F-5・実態 F-1）。第 1.33 版で図の指し先から図 1 を外した＝図 1（誰が使い、何が出るか）の出る側は支度表・3 面・検査の結果だけで、天井も材料の束も描いていない（天井の 27 周目 読みやすさ F-3・要件 FR18 も同じ）。
  - id: FR18
    title: 所見の形と天井の 3 値を床で数える
    pattern: event
    strength: must
    when: 所見 file が置かれ、天井の検査が実行されたとき
    shall: folio は所見 file の欄の決まり・観点の一覧の一致・根拠の逐語の実在・束の要約値の一致・起動の記録の有無を数え、観点ごとに 合格・不合格・まだ分からない を返す。観点ごとの 3 値と日付は、生成する面に天井の名札として、床の合格の名札と別の欄で出す。「まだ分からない」の観点が 1 つでもあれば天井を合格にしない。所見の意味の当否は判定しない。
    plain: AI が返した所見が「決まった形か・観点の顔ぶれが決めたとおりか・根拠が本当に文書にあるか・本当に材料を読んで動いたか」を機械が数えます。観点ごとの結果と日付は、作ったページの上に「天井の名札」として、機械の検査（床）の名札とは別に出します。中身が正しいかは機械は決めません。1 つでも「まだ分からない」があれば合格にしません。
    basis: [P-1, P-3, P-4, P-11]
    adrs: [ADR-8]
    verify: {method: test, how: 必須欄を 1 つ欠いた所見 file と要約値の合わない所見 file で「まだ分からない」になり、全観点が合格の fixture でだけ 0 で終わることを見る, ac: [AC16]}
    goals: [GOAL4]
    figures: [図3]
    milestone: M2
    note: 判断の記録 ADR-8 決定 (3)(4)(5)。止める所見の反証の 2 段目も同じ欄の決まりで受ける。v1.24 で規範文と平易文に、観点ごとの 3 値と日付を面の天井の名札として出す口の 1 文を足した（天井の 20 周目 実態との整合 F-1）。この口は便 40 で着地しており（部品 ceiling-stamp・実装 crates/folio/src/face.rs の ceiling_stamp・面は印 design-intent/preview/ceiling-stamp.yaml を読む〔便 83・台帳 f2-648.121・2026-09-22 に旗 --ceiling を外した〕・歯 crates/folio/tests/badge.rs・部品目録 design-intent/preview/parts.json）、根拠は判断の記録 ADR-8 決定 (4) と部品目録だけが持っていた。要件 FR17 が第 1.18 版で行った補い（実装に在る口を要件の文が言っていなかった）と同じ形で、実装は変えない。第 1.33 版で図の指し先から図 1 を外し、3 値の図（図 3）だけにした（天井の 27 周目 読みやすさ F-3＝図 1 は天井も所見も描いていない）。
  - id: FR19
    title: 文書の決まりの部分を、機械の中の決まりから各 file の生成区間へ写す（schema）
    pattern: event
    strength: must
    when: folio schema --write が実行されたとき
    shall: folio は判断の記録と設計ノートの欄の決まりの file と天井の正本と規則の表と入口の正本と索引の欄の決まりの正本と、要件書・語彙・相談窓口の正本の生成区間へ、床の定数から決定的に導出した決まりの部分（欄の決まり・観点と読む文書の閉じた id の集合・値域と閾値の型・入口の棚の閉じた id の集合・最上位の節の閉じた一覧・要件書の図の節の行の欄・節点の種類と辺の型の閉じた一覧）を書き込む。--check は生成区間と導出の差分を検出し、生成区間の印が無ければ「まだ分からない」で、差があれば非 0 で終了する。生成区間の外は書き換えない。
    plain: 「文書の書き方の決まり」を載せたファイルと「AI の審査の決まり」を載せたファイル（天井の正本）と「数値と作法の表」（規則の表）と、入口・索引の決まり・要件書・用語集・相談窓口のファイルのうち、決まりの部分（棚に並ぶ文書の種類・章の見出しの一覧など）は機械の中の決まりから folio が、何度やっても同じ結果になる形で書きます。人が手で直してずれたら検査が失敗して止まり、自動で書く区間の目印が無ければ「まだ分からない」と言います。自動で書く区間の外（人が書く部分 = 誰がいつ決めたかの記録・やさしい説明文・規則の表の行など）には触りません。
    basis: [P-6, P-5, N-3, P-13]
    adrs: [ADR-9, ADR-13]
    verify: {method: test, how: 生成区間を 1 字変えて --check が非 0 になり、印を消すと「まだ分からない」になることを見る, ac: [AC17]}
    goals: [GOAL3, GOAL4]
    figures: []
    milestone: M2
    note: 判断の記録 ADR-9・ADR-11 決定 (4)①（v1.9 で天井の正本を対象に足した）・決定 (4)②（v1.10 で規則の表を対象に足した）。憲法の生成区間（FR6）と同じ型。folio check の置き場ごとの欄単位の検査は変えない。対象の file は増えるたびにこの要件の文に足す（憲法 P-5.6・P-13.3）。v1.22 で入口の正本（便 76 = 棚の閉じた id の集合・ADR-11 決定 (4)④）と要件書・語彙・入口・相談窓口の最上位の節の閉じた一覧と要件書の図の節の行の欄（便 77・決定 (4)⑤）を対象に足した。入口の口は便 76（台帳 f2-648.111・契約は docs/design/delivery-76.md）、要件書・語彙・相談窓口の口は便 77（f2-648.112・契約は docs/design/delivery-77.md）で着地し、8 file すべてが生成区間の印を持つ（実装の TARGETS は 8 file・2026-09-21）。v1.24 で規範文の括弧の「観点と読む欄」を「観点と読む文書の閉じた id の集合」に改めた（天井の 20 周目 整合 F-1）＝天井の正本は観点ごとの読む欄（reads）を生成区間の外の人が書く節に持ち、生成区間に在るのは観点と読む文書の閉じた id だけである（判断の記録 ADR-11 決定 (4)①）。同じ版で根拠から条 P-14 を外した（天井の 16 周目 整合 F-3）＝P-14 の規範文 3 本は folio inject と CLAUDE.md の生成区間だけを縛り、判断の記録 ADR-11 決定 (1) が P-14.3 の掛かる先を CLAUDE.md の生成区間へ狭めている。この注が言う「憲法の生成区間（FR6）と同じ型」は機構の形の相似であって根拠ではない。第 1.25 版で見出しの字を「決まりの部分を、機械の中の決まりから各 file の生成区間へ写す」に改めた（天井の 22 周目 読みやすさ F-5・23 周目 読みやすさ F-6）＝見出しだけが用語集から引けない語（床の定数・導出する）を重ねており、平易文が既に使っている言い換えに揃えた。規範文と受入の判定の式は変えない。第 1.28 版で索引の欄の決まりの正本（節点の種類と辺の型の閉じた一覧）を対象に足した＝口は便 95（台帳 f2-648.133・契約は docs/design/delivery-95.md）で着地し、実装が導出する file は 9 本になった（2026-09-22）。
  - id: FR20
    title: 天井の門 — 天井の判定の印を生成物として書き、設計文書を書き換える便の受付を印で 3 値に判定する（ceiling --stamp / --gate）
    pattern: event
    strength: must
    when: folio ceiling --stamp か --gate が実行されたとき
    shall: folio は --stamp で、周の結果（観点ごとの所見 file と「止める」の反証の結果 file）から天井の判定の印（周の id・観点ごとの 3 値と反証の結果・正本の要約値・引き金の要約値・面の要約値・束の要約値・節点ごとの要約値の表と残差の要約値・起動の記録・読んだ文書の id）を決定的に導出し、設計文書の置き場の生成物の棚（preview/）へ 1 file で書く（既に同じなら書かない・手で直さない）。--gate は、渡された便の書き換える file の一覧（write-set）と印と今の正本から 3 値を返す。その一覧に設計文書の置き場の file（生成物の棚 preview/ と退役の置き場の file を除く）が 1 つも無ければ 0（通す）。在るときは、印が 4 観点とも合格で印の引き金の要約値が今の正本の引き金の要約値と同じなら 0、印に不合格の観点が在れば 1（止める）、印が無い・印の引き金の要約値が無いか今と違う・印に「まだ分からない」の観点が在れば 2（まだ分からない）とし、理由を 1 行で出す。0 を返すときに印の正本の要約値が今と違えば、印の後に変わった節点の数を理由の行に添える。「まだ分からない」の観点が在るときは、不合格の観点が同時に在っても 2（まだ分からない）を先に返す。引き金の要約値は、天井の正本の生成区間が写す規範の欄の一覧から、印と門が同じ関数で測る。持ち主の承認欄で発効する設計文書の変更は門の対象外である。
    plain: 設計文書を書き換える便を器に出す前に、「天井の判定の印」を見て、通す・止める・まだ分からない の 3 通りに答えます。印が「4 観点とも合格」で、印を付けたときから設計文書の規範の欄（この段落の最後の文に書く 5 つ）が 1 字も変わっていなければ通します。注や平易文や図だけが変わっているときも通しますが、その変わった所がまだ読まれていないことと、その数を返事に添えます。印に不合格が在れば止めます。印が無い・規範の欄が変わって印が古い・印に「まだ分からない」が在れば「まだ分からない」と言い、受付を先に進めません（不合格と「まだ分からない」が同時に在るときは「まだ分からない」を先に言います）。実装だけの便と、あなたが承認欄で発効させる設計文書の直しは、門の対象外なのでそのまま進めます（設計文書の置き場の file を触らない便は通す）。印は、AI の審査（天井）の結果を機械が読める形にして文書の置き場に 1 つ書いたもので、設計文書の一行一行がいまどんな中身かを表す短い印も並べます。規範の欄とは、憲法の条文と前文と schema 節、発効した判断の記録の状態と決定と撤退条件と改訂と置き換えの欄、要件・非機能要件・受入基準の本体（規範文・確かめ方・判定の文など）と制約と最上位の目的と範囲の節、規則の表の行の中身（注と裁定と来歴を除く）、天井の重さと読む文書の一覧と観点の行（読み手・問いの文・読む欄）のことで、細かい一覧は判断の記録 ADR-18 の決定 (1) と天井の正本の自動で書く区間に在ります。
    basis: [P-3, P-4, P-6, P-10, N-3]
    rules: [D-12, D-14]
    adrs: [ADR-8, ADR-13, ADR-18, ADR-19, ADR-20]
    verify: {method: test, how: 凍結の束と所見から導出した印が凍結の写しと一致すること、門の 7 場合（設計文書の置き場の file を触らない・合格で同じ引き金の要約値・合格で引き金の要約値は同じで正本の他の字が違う・不合格・引き金の要約値が違う・まだ分からないの観点・印が無い）で 3 値が期待どおりになることを見る, ac: [AC18]}
    goals: [GOAL3, GOAL4]
    figures: []
    milestone: M2
    note: 印は、直しの一括の枝の上で導出して、一括と一緒に本流へ取り込むことがある（判断の記録 ADR-19・規則の表の開発規律行 D-14）。判断の記録 ADR-18 の便アの着地（2026-09-24・台帳 f2-648.178）の後は、門は取り込みの後の本流の引き金の要約値と印を突き合わせて鮮度を測る（便アの着地までは、承認の記帳の取り込みで印が古くなったので、承認の後に本流で周を回していた）。この要件の口は 2 つとも着地済みである（--stamp = 便 72・crates/folio/src/stamp.rs・台帳 f2-648.107・2026-09-21／--gate = 便 73・crates/folio/src/gate.rs・台帳 f2-648.108・2026-09-21）。印 design-intent/preview/ceiling-stamp.yaml は、周が 4 観点とも合格したときに席が --stamp で書く生成物で、手で直さない（P-6.2）。初回は天井の 14 周目の合格（2026-09-21）で書いた（design-intent/preview/ceiling-stamp.yaml）。印を導出し直して差分を数える口は持たず、印の鮮度は --gate が印の引き金の要約値と今の正本の引き金の要約値を突き合わせて測る（正本の要約値の違いは、通すときに印の後に変わった節点の数を添えるのに使う・便アの着地の後の字に第 1.38 版で直した・天井の 30 周目 実態 F-3）。器（scribe2）への結線が器の側の口で入るまでは、席の受付の手順で運ぶ（判断の記録 ADR-8 決定 (6)・器への結線は器が決める）。その手順の正本は規則の表の開発規律行 D-12 であり、ここには写さない。判断の記録 ADR-8 決定 (4)（天井が合格でない間は設計文書の便の着地を止める）。門の形の裁定と撤退条件は判断の記録 ADR-8 の注（2026-09-21 の追記）が持つ。形は設計ノート docs/design/ceiling-gate.md。面の天井の名札は、便 83（台帳 f2-648.121・2026-09-22 着地・crates/folio/src/face.rs の ceiling_stamp）で印を読む形に変わった。第 1.32 版で規範文の「設計文書の正本が 1 つも無ければ」を、門が実際に数える範囲の字（設計文書の置き場の file・生成物の棚と退役の置き場を除く）に直し、同じ版で平易文と受入基準 AC18 の平易文と固定の材料の場合の名札（設計文書の置き場の file を触らない便は通す）と、この要件の確かめ方の場合の名札も同じ字にした（天井の 26 周目 整合 F-7・判定の式は変えない）。語彙の「設計文書」の項は支度表の正本を設計文書の正本に数えないが、門は置き場で数えるので支度表の正本も数える＝前の字では、支度表の正本だけを書き換える便の扱いが 2 文書で逆に読めた。実装（crates/folio/src/gate.rs の is_design_source）は初めからこの範囲で数えており、変えない。v1.24 で規範文に 3 値の優先（「まだ分からない」が在れば「不合格」より先に立つ）の 1 文を足し、平易文の門の対象外を規範文の字（持ち主の承認欄で発効する設計文書の変更）に揃えた（天井の 17 周目 実態との整合 F-4・20 周目 忠実さ F-3）。実装（crates/folio/src/gate.rs の run）は初めから「まだ分からない」の観点を先に見て 2 を返しており、規範文の並びだけが逆に読めた＝実装は変えない。受入基準 AC18 の 6 場合は混在の場合を持たない（場合を足すかは別の版）。第 1.28 版で印の中身の数え上げに節点ごとの要約値の表と残差の要約値を足した＝口は便 99（台帳 f2-648.136・契約は docs/design/delivery-99.md）で着地し、判断の記録 ADR-13 決定 (8) が定めていたものに要件の字が追いついた。その表を使って周が要るか要らないかを判定する口は、この版では要件にしない（後続の便・条 P-4.2）。判断の記録 ADR-13 決定 (9)（門の「まだ分からない」の側だけを便の書き換える file の節点の単位にし、ほかの file だけを触る便は通す）は、この要件の規範文にはまだ入っていない＝その決定は便の列の ⑩ が運ぶ後続で、いまの規範文と実装（crates/folio/src/gate.rs）はどちらも「まだ分からない」の側も設計文書の置き場の全体で測る、狭める前の形である。決定 (9) が狭めるのは「まだ分からない」の側だけで、「不合格」の側は狭めた後も置き場の全体で止める（判断の記録の決定 (9) はこれを「repo 全体」と書く。指しているのは同じ範囲＝「便が書き換える file の単位に狭めない」ことで、実装が実際に見るのは設計文書の置き場である）。第 1.36 版（判断の記録 ADR-18・2026-09-24 11:51 JST 持ち主「全部推奨で」）で、規範文の門の式の古さの判定を、印の正本の要約値から印の引き金の要約値（天井の周の引き金 = 規範の欄の要約値・同 決定 (1)）へ改め、0 を返すときに印の後に変わった節点の数を添える 1 句と、印の中身の列に引き金の要約値を足した。確かめ方と受入基準 AC18 の場合は 6 から 7 へ（引き金は同じで正本の他の字が違う → 0）。この版の規範文の口は便ア（台帳 f2-648.178・2026-09-24 着地・f2-648.145 を置き換えた）で入った＝規範の欄の一覧の型付きの定数は crates/folio/src/ceiling.rs、その写しは天井の正本の生成区間、引き金の要約値の関数は crates/folio/src/gate.rs で、印（crates/folio/src/stamp.rs）は引き金の要約値の 1 行を持つ。着地の前の実装は印に引き金の要約値を持たず、正本の要約値で古さを測っていた（設計文書の正本が 1 字でも変われば門は まだ分からない を返した・第 1.38 版で着地の後の字にした）。完成の判定は今のまま、印の正本の要約値が今の正本と同じときだけ満たす（判断の記録 ADR-18 決定 (6)）。第 1.38 版で、平易文の規範の欄の括弧を判断の記録 ADR-18 決定 (1) の一覧と同じ中身にし、括弧を門の条件の文の前の別の文へ出して非機能要件を名指した（天井の 30 周目 読みやすさ F-1・忠実さ F-4）（天井の 29 周目 忠実さ F-1・前の字は判断の記録の状態と撤退条件と改訂と置き換えの欄・制約と目的と範囲の節・重さと読む文書の一覧を落とし、撤退条件だけを変えた便を 通す と読ませた）。規範文と受入の判定の式は変えない。第 1.39 版で平易文の並びを、答えの 3 通りと門の条件を先に、印の説明を次に、規範の欄の中身を最後に置く順に改めた（天井の 31 周目 読みやすさ F-4＝要旨が 1 段落の中に埋もれていた）。規範の欄の中身の文は第 1.38 版の字のまま最後へ移した（判断の記録 ADR-20 の発効で前文と schema 節を足した）。規範文と受入の判定の式は変えない。引き金の規範の欄のうち受入基準の確かめる要件・要件の確かめ方の中の受入基準・規則の表の行の条は、索引では辺の欄だが引き金に入り、憲法の前文と schema 節も引き金の一覧に入る（判断の記録 ADR-20・天井の 30 周目と 31 周目の整合の所見）。

  - id: FR21
    title: 全体像を短い出力で出す
    pattern: event
    strength: should
    when: folio graph --digest が実行されたとき
    shall: folio は設計文書の全体像（文書ごとの節点と辺の数・種類ごとと型ごとの数・辺の多い節点の並び）を、正本を全部読むより十分に短い 1 つの出力として出す。設計文書が在るときは、席が始まるときの 1 行にも節点と辺の数と、この口の名を出す。
    plain: 「この置き場の設計文書には何がいくつあって、どれがどれを指しているか」を、文書を全部読まなくても分かる短い一覧で出します。設計文書が在るときは、AI の作業が始まるときの 1 行にも、その数とこの一覧の出し方を添えます。
    basis: [P-5]
    rules: [R-2]
    adrs: [ADR-13]
    verify: {method: test, how: 出力の各数が索引の実測と一致し、出力の大きさが正本の合計より十分に小さいことを見る, ac: []}
    goals: [GOAL3]
    figures: []
    milestone: M2
    note: 判断の記録 ADR-13 決定 (11)。この要件の口は 2026-09-22 に着地した（台帳 f2-648.134・契約は docs/design/delivery-96.md・便 96・統合先 main の着地の commit は 0806433）。その契約の req は FR14 / FR3 で、この要件を指していない＝この要件は便の後に新設されたので、契約からこの要件への線は 0 本である（第 1.30 版）。席が始まるときの 1 行は、未整備のあいだの 1 行（FR3）とは別で、設計文書が整備済みのときに毎回出る。この出力は AI へ常時渡す説明文ではないので、非機能要件 NFR1 の母集団（規則の表の行 R-1）の対象外である。全体像を CLAUDE.md の生成区間へ載せることはしない（行 R-2 の上限）。
  - id: FR22
    title: 新しい置き場に最初の文書一式（骨格）を書く（init）
    pattern: event
    strength: must
    when: folio init --dir が実行されたとき
    shall: folio は利用者が選んだ置き場（--dir）に、正本 7 file と、索引の欄の決まりの file（graph.yaml）と、判断の記録の置き場とその欄の決まりの file と、設計ノートの置き場とその欄の決まりの file を書く。各 file の生成区間は床の定数から導出し（folio schema --write と同じ導出）、承認の対話面の行 R-8 と散文の門の行 R-16 と、その 2 行を縛る最小の条と、判断の記録の欄の決まりの file の先頭の欄が名指す最初の判断の記録（folio の欄の決まりを採る・提案中）を足す。置き場に正本が 1 本でも在れば何も書かずに非 0 で終え、上書きしない。雛形には folio2 の口座名・席とモデルの名・folio2 の持ち主の逐語を写さない。置き場に憲法の正本が無いとき、案内の 1 行（FR3）はこの命令を案内する。
    plain: 新しい repo で folio を使い始めるときに、最初の文書一式（骨格）を 1 つの命令で書きます。書く場所は利用者が選びます。そこに文書が 1 つでも在れば、何も書かずに断ります（上書きしません）。書くのは、決まりの部分を機械が埋めた文書のひな形と、承認の受け方と説明文の検査の決まりの 2 行と、それを縛るいちばん小さな条と、最初の判断の記録（提案中）です。folio2 の口座名、席とモデルの名、持ち主の言葉は写しません。文書がまだ無い repo では、AI のセッションが始まるときの 1 行がこの命令を案内します。
    basis: [P-6, P-7, P-12, N-1, N-3]
    rules: [R-8, R-16, R-17]
    adrs: [ADR-16, ADR-6]
    verify: {method: test, how: 版管理（git init と commit）の中の空の置き場に撃つと骨格が書かれて床の違反が 0 で「まだ分からない」が凍結 anchor の 2 つの基準の不在だけになり、正本を 1 本置いた置き場では非 0 で終えて置き場の byte が変わらないこと・書いた file の生成区間と雛形の相談窓口の文を除く範囲に folio2 の承認欄の who の全字・版付きのモデルの名・verbatim の字（床の定数と雛形の文に現れない字）が 1 回も出ないこと・憲法の正本の無い置き場で案内の 1 行が骨格の命令を名指すことを見る, ac: [AC19, AC23, AC26, AC27]}
    goals: [GOAL1, GOAL3]
    figures: []
    milestone: M3
    note: 判断の記録 ADR-16 決定 (3) と (2)(オ)(カ)。この要件の口は、同じ判断の記録の決定 (7) の ④ の 2 便目（便 125・台帳 f2-648.173・2026-09-24 着地）で入った＝骨格の命令は crates/folio/src/init.rs、案内の 1 行は crates/folio/src/hello.rs、歯は crates/folio/tests/init.rs である。④ の 1 便目（生成区間の注から条 id を外す・器の導出 file を版管理の根で解く）は便 123 で着地し、要件 FR10 の注が持つ。scribe2 の置き場は design-intent/folio2 とする（前の版の道具が走査しない場所で、scribe2 の入口の検査が文書だけの面として通す）。骨格の憲法の file は、利用者の repo では憲法と名乗らず「床の受付の宣言」と題し（名は利用者が決める）、条の規範文は利用者の本来の憲法の条を番号で指す 1 文とし、根拠の種別は値域の既存の値（scribe2-article）で本来の条を名指す。例外の口を足さないことを定める条（folio2 の条 N-3 に当たる）は、利用者の本来の憲法に指す先の条が在るときだけ置き、どちらにするかは骨格の承認の裁定（利用者の持ち主）で決める。条の番号は利用者の番号空間の 1 から振り、folio2 の番号を予約しない（条 P-7.1）。散文の言及の歯の行 R-17 は骨格に入れず、利用者が要れば利用者の持ち主の裁定で足す。骨格は注入の対象にしない（M3 の外）。第 1.35 版で、規範文と受入基準 AC19 の書く file の数え上げに索引の欄の決まりの file（graph.yaml）を足した＝生成区間の導出（folio schema --write と同じ導出）は graph.yaml も書き、書かないと folio schema --check が「まだ分からない」で止まる（便 125 の起草の実測 2026-09-24・天井の 28 周目 整合 F-4）。判断の記録 ADR-16 決定 (3) の「書くもの」の字は変えず、同じ判断の記録の注 (h) で断った＝骨格が書く file の数え上げの正本はこの要件の規範文である。承認欄の逐語を利用者の台帳の裁定 id を指す形で書くことは、利用者の宣言の条がそれを認める形にし、利用者の持ち主が骨格の承認のときに明記する。相談窓口の質問は骨格の命令の雛形として道具に持ち（組み立て時に folio2 の相談窓口の正本から導出し、回答と承認の欄は写さない）、書いた後は利用者の repo の相談窓口の file が正本で、folio intake は今のまま置き場から読む（判断の記録 ADR-6 決定 (1) を変えない）。骨格を書いた直後の置き場は、凍結 anchor の 2 つの基準（憲法の列と id の一覧）が無いので床が「まだ分からない」を返す＝始まりの凍結（FR24）で閉じる。置き場が版管理の外に在ると、版管理の不在の「まだ分からない」が 1 件足される（2026-09-24 の版 B の検証の実測）ので、確かめ方と受入基準 AC19 は版管理の中の空の置き場で撃つ。
  - id: FR23
    title: 憲法の列の根を、憲法の名ごとの表で照らす
    pattern: event
    strength: must
    when: 床が凍結 anchor の憲法の列を数えるとき、または憲法の列を凍結する命令が実行されたとき
    shall: folio は、凍結 anchor の憲法の列の最初の 1 枚（列の根）の要約値を、検査される置き場の憲法の正本の名で床の定数の表から引いた値と照らす。表に無い名の憲法の列の根は、凍結の命令では要約値の全桁を出して断り、既に在る列では床が違反として落とす（どちらも合格にしない）。表の写しは、判断の記録の欄の決まりの file の生成区間へ、検査される置き場の名の行だけを導出する。folio2 の行（folio2 の憲法の名と今の要約値）は 1 字も変えない。
    plain: 憲法の写しの列が、決まった最初の 1 枚（列の根）から始まっているかを確かめます。そのために、列の最初の 1 枚の印（要約値）を、道具の中に持つ「憲法の名ごとの表」の値と照らします。表に名前の無い憲法なら、凍結を断り、最初の 1 枚の印を省かずに全部の桁で出します（この印は、表に行を足すときの材料になります）。既にある列なら検査が落とします。どちらも合格にはしません。表のうち各利用者の手元へ写すのは自分の行だけなので、表に行が増えてもほかの利用者の検査は落ちません。folio2 の行は変えません。
    basis: [P-5, P-10, N-3]
    rules: [D-11]
    adrs: [ADR-16, ADR-2]
    verify: {method: test, how: 表に無い名の憲法の列で凍結の命令が要約値の全桁を出して断り、凍結済みの列の憲法の名を書き換えると床が違反を出し、folio2 自身の置き場の床の結果が変わらず、生成区間の表の写しが置き場の名の行だけであることを見る, ac: [AC20, AC23]}
    goals: [GOAL4]
    figures: []
    milestone: M3
    note: 判断の記録 ADR-16 決定 (2)(ア) が判断の記録 ADR-2 決定 (3)（列の根の要約値を folio2 の憲法の値 1 つの床の定数と一致させる）を広げた。最初の版は表に持たせず、全行で共通の今の値（第 1.0 版）のままにする。表の鍵は検査される置き場の憲法の名で、利用者の本来の憲法（前の版の文書）の同一性は表に載らない。表に行を足すのは folio2 の便で、契約表の行か設計ノートが利用者の持ち主の承認の裁定 id を名指す（規則の表の行 D-11 の手順）。検査される repo の側の data（憲法の名を書き換える・根の file を書き換える）で表の行を選び直しても、別の行の要約値との不一致か、表に無い名の断りにしかならない。この要件の口は、判断の記録 ADR-16 決定 (7) の ②（便 121・台帳 f2-648.170・2026-09-24 着地・始まりの凍結の命令 FR24 と同じ便）で入った＝列の根の表は床の定数 root_digests（crates/folio/src/floor_adr.rs）で、床の照らしは crates/folio/src/anchor.rs、凍結の命令の断りは crates/folio/src/freeze.rs が持ち、歯は crates/folio/tests/freeze_root.rs である（第 1.38 版で着地の後の字にした・天井の 29 周目 実態 F-3）。利用者の行を足す便は同じ決定の ⑦（利用者が骨格を書き、持ち主が骨格を承認し、始まりの凍結の命令で要約値を得た後）で起こす。
  - id: FR24
    title: 憲法の列と id の一覧がどちらも無い置き場で、2 つを同時に凍結する（始まりの凍結）
    pattern: event
    strength: must
    when: 始まりの凍結の命令（folio check --freeze-start）が実行されたとき
    shall: folio は、置き場の凍結 anchor に憲法の列と id の一覧がどちらも 0 本で、その 2 つの基準の不在を除くすべての検査が違反 0 で「まだ分からない」も無いときに限り、憲法の列と id の一覧を同時に書く。どちらか 1 本でも在るか、ほかの検査に違反か「まだ分からない」が在れば、何も書かずに断る。この命令はどの検査も数えから外さず、書いた後はふだんの床が全部の検査を回す。今ある 2 つの凍結の命令の前提は変えない。
    plain: 新しい repo では、憲法の写しの列と番号の一覧の 2 つが、互いに「相手が無いから作れない」と断り合って、どちらも作れません。2 つがどちらも無く、ほかの検査が全部きれいなときにだけ使える命令で、2 つを同時に作ります。どちらかが既にあるときや、ほかの検査に問題があるときは、何も書かずに断ります。この命令はどの検査も外しません。今ある 2 つの凍結の命令（写しの列だけ・番号の一覧だけを作る命令）が何を前提に動くかも変えません。
    basis: [P-4, P-10, N-3]
    adrs: [ADR-16]
    verify: {method: test, how: 版管理の中の写しで、2 つの基準がどちらも無くほかの検査が違反 0 で「まだ分からない」も無い置き場では 2 つが書かれて書いた後の床が全部の検査を回して違反 0 で「まだ分からない」も 0 になり、どちらか 1 本が在る置き場とほかの検査に違反が在る置き場とほかの検査に「まだ分からない」が在る置き場では何も書かずに断ることを見る, ac: [AC21, AC23]}
    goals: [GOAL4]
    figures: []
    milestone: M3
    note: 判断の記録 ADR-16 決定 (2)(イ)。今の 2 つの凍結の旗（憲法の列を凍結する旗と id の一覧を凍結する旗）は、どちらも自分の基準の不在だけを数えから外し相手の不在は外さないので、両方 0 本の置き場では互いに断り合う（同じ判断の記録の文脈 (2)(イ) の実測）。folio2 は憲法の列が先に在り、id の一覧を後の便で足したので、この輪に当たらなかった。列の根の照らし（FR23）はこの命令でも外さない＝表に行の無い名の憲法では、この命令も要約値の全桁を出して断り、その値で表に行を足す便を起こす（同じ判断の記録の決定 (7) の ⑦）。この要件の口は、同じ判断の記録の決定 (7) の ②（便 121・台帳 f2-648.170・2026-09-24 着地）で入った＝旗は folio check --freeze-start で、実装は crates/folio/src/freeze.rs、歯は crates/folio/tests/freeze_root.rs である。第 1.38 版で着地の後の字にし、起きるときの欄の「旗の名は便で決める」を便で決まった旗の名に替えた（天井の 29 周目 実態 F-4・判定の式は変えない）。
  - id: FR25
    title: 置き場の憲法の値域が、道具を組み立てた値域の部分集合かを数える
    pattern: event
    strength: must
    when: 床が置き場の憲法の正本を数えるとき
    shall: folio は、置き場の憲法の値域の節の各鍵が、道具を組み立てた版の同じ鍵の値の部分集合かを床で数える。部分集合なら条の値を置き場の値域で引き、置き場の値域に無い値を違反にする。部分集合でない鍵が 1 つでも在れば「組み立て時の値域に無い値がある」の「まだ分からない」とし、合格にしない。値域を置き場ごとに広げる口は持たない。
    plain: 憲法で使える値の一覧（段・強さなど）は、道具の側に持ったままにします。置き場の憲法の一覧が道具の一覧の中に収まっていれば、いつもどおり検査を続け、置き場の一覧に無い値を使った条を違反として出します。道具の知らない値が混じっていたら、「まだ分からない」と正直に言い、合格にはしません。
    basis: [P-4, P-5, N-3]
    adrs: [ADR-16, ADR-11]
    verify: {method: test, how: 置き場の値域が組み立てた値域の部分集合の写しで床が続いて置き場の値域に無い値の条が違反になり、組み立てた値域の外の値を 1 つ足した写しで「まだ分からない」になって合格にならないことを見る, ac: [AC22, AC23]}
    goals: [GOAL4]
    figures: []
    milestone: M3
    note: 判断の記録 ADR-16 決定 (2)(ウ)。値域は組み立て時の導出のまま道具の側に残す（判断の記録 ADR-11 決定 (4)② を変えない）。いまの床は置き場の憲法が宣言した値域を読まず、条の値を組み立てた型で引くので、利用者の憲法が別の値を宣言して使うと「憲法の値域に無い」の違反になる（ADR-16 の文脈 (3)(ウ)）。folio2 が値域に値を足しても、利用者の値域は部分集合のままなので利用者の床は変わらない。値を外すか名を変えると、その値を置き場の値域に持つ全利用者の床が「まだ分からない」に落ち、戻すには各利用者の憲法の改訂が要る（ADR-16 の帰結）。利用者の憲法の値域が道具の値域の外の値を要るようになったら、利用者の憲法を移す別の判断の記録で扱う。この要件の口は、判断の記録 ADR-16 決定 (7) の ③（便 122・台帳 f2-648.174・2026-09-24 着地）で入った＝部分集合の判定は crates/folio/src/check.rs、歯は crates/folio/tests/constitution_range.rs、凍結 anchor は手書きの tests/fixtures/check/enum-range-anchor.yaml である（第 1.38 版で着地の後の字にした・天井の 29 周目 実態 F-5）。

nonfunctional:
  - id: NFR1
    title: AI へ常時渡す説明文の上限
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: folio2 の設定が AI へ常時渡す説明文（係と skill の名前 + 説明・母集団は rules 行 R-1）の合計は rules 行 R-1 の値以下にする。
    plain: AI が毎回読まされる「設定が載せている AI の係と skill の説明文」の量に上限を置きます。v1 ではこれが膨らんで遅く高くなりました。前の版の道具は 2026-09-21 に設定から外しました。効くのは AI の席を起こし直した後で、量を数える口もまだ無いので、測り直すまでは「まだ分からない」のままです。
    basis: [N-5, P-4]
    rules: [R-1]
    adrs: [ADR-4]
    verify: {method: test, how: 計測 script が数え、R-1 と比べる（値はここに再掲しない）, ac: []}
    goals: [GOAL3, GOAL4]
    figures: [図2-6]
    note: 状態は 保留＝判断の記録 ADR-16 決定 (5) の M3 の入口の再判定（2026-09-23 17:39 JST の承認）で、M3 に入れず保留のまま残した。保留の理由は量を数える口が無いことで、要件 FR11 / FR13 の器の口ではなく、この要件だけの口である（保留の明示は第 1.30 版・裁定 id f2-648 notes 2026-09-23 08:13 JST）。次に再判定するのは M3 の出口である（第 1.33 版・天井の 27 周目 整合 F-1・実態 F-2）。この要件の状態を定めるのはこの欄 1 か所で、台帳と判断の記録と設計ノートの字はこの欄に従い、食い違えばこの欄を正とする。この要件は未達である。口（常時注入される係と skill の名前と説明を数える）が未実装なので、測り直すまで充足は「まだ分からない」として扱う（P-4.2）。母集団の定義と実測の値は規則の表の行 R-1 が持つ（ここには写さない）。図の道具（archify）は AI 向けの説明（skill）として載せない＝R-1 の母集団に入れない（判断の記録 ADR-4 決定 (5)）。第 1.25 版で根拠から条 P-14 を外した（天井の 23 周目 整合 F-2）＝P-14 の規範文は folio inject と CLAUDE.md の生成区間だけを縛り、この要件の母集団（行 R-1）はそこを含まない＝要件 FR19 が第 1.24 版で同じ理由で外したのと同じ向きである（条 P-14 の関係の欄からもこの要件を外した）。（審査の記帳 = 未達の判定は天井の 9 周目〔2026-09-20〕の止める所見 実態との整合 F-1・反証 支持）
  - id: NFR2
    title: 見た目の材料は 1 か所から
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: 全生成面の design token は単一の定義に由来し、部品目録に無い class は rules 行 R-3 の値にし、床が掛からない HTML 面は 0 にする。
    plain: どのページも、色や字の大きさ・部品を同じ 1 か所から取ります。「このページだけの飾り」は 0 個。検査（床）が掛からないページも 0 枚。器（scribe2）に要件を読ませるためだけに残していた読み物のページは、2026-09-21 に退役しました（まず退役の棚へ移し、その棚は 2026-09-23 に承認を得て消しました。版管理の履歴には残っています）。守れていないページは 0 枚です。
    note: この要件の未達は 2026-09-21 に解消した。床が掛からない HTML 面は 0 枚で、器（scribe2）の要件面は .vessel.toml の requirements が要件書の正本 design-intent/srs.yaml を直に指す。読み物の退役はこれで版管理の上でも閉じた＝面（readable.html）も命令 folio render と歯も、その元になった day-1 の生成 script も、退役の棚へ可逆に移した（N-1.2）。経緯は次のとおり。2026-09-20 までは未達が 1 枚在った。器の審査の要件面のためだけに残していた day-1 の読み物（design-intent/preview/ の下・folio render の生成物）は、自前の design token と部品目録に無い class を持ち、folio parts --check の面の一覧（5 面）に入らなかった。正本との byte 一致（folio render --check）は掛かったが、この要件の言う床（class と design token の突き合わせ）は掛からなかった。読み物は配信先（folio build の出力）にも入口の導線にも載せていない。器の側の口（要件面を要件書の正本から直に読む口）が着地して閉じ、器の binary の入れ替えを受けて、読み物は 2026-09-21 に design-intent/preview/retired/readable.html へ可逆に移して退役した（file を消すのは A-1 の「消す」なので持ち主に確認した）。命令 folio render と歯は便 62 で、day-1 の生成 script 3 本は 2026-09-22 に、それぞれ退役の棚へ移した。3 つの退役の棚（design-intent/preview/retired/・scripts/retired/・crates/folio/retired/）は 2026-09-23 に repo から消した（総点検 🔴 4・A-1 承認・git の履歴に残る）。第 1.25 版で規範文の「rules 行 R-3 の値（0）」から括弧を外した（天井の 22 周目 整合 F-4）＝値の正本は行 R-3 で、行の値は 2 つ組なので括弧は片方だけの写しでもあった。数える対象は変えない。（審査の記帳 = 未達の判定は天井の 7 周目〔2026-09-20・main 85c3d7a〕の止める所見 実態 F-1・反証 支持／器の側の口は器の台帳 s2-07l.467・2026-09-20 着地／読み物の退役は持ち主の裁定 2026-09-21 08:47 JST・逐語「退役して」・判断の記録 ADR-7 の案 c の理由と同じ見立て）
    basis: [P-2, A-1, N-1]
    rules: [R-3, R-5]
    verify: {method: test, how: 全面の class を部品目録と突合する, ac: [AC2]}
    goals: [GOAL2]
    figures: [図2-4]
  - id: NFR3
    title: 参照は必ずつながる
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: 文書間の参照 id（要件 id・条 id・rules 行 id の内部 3 空間）の未解決は rules 行 R-4 の値にする。外部への参照（報告 HTML 等）は sources 欄に置き、母集団に入れない。
    plain: 「FR3 を見よ」「P-2 による」と書いたら、その番号は必ず実在します。行き先の無い番号は 0 個。外の報告などへの参照はこの数えに入れず、出所の欄（sources）に置きます。
    basis: [P-5, P-7, P-4]
    rules: [R-4]
    verify: {method: test, how: 参照 id を全部集め、実在を数える, ac: [AC6]}
    goals: [GOAL4]
    figures: [全段]
    note: rules 行 R-4 の母集団は正本 4 file（憲法・規則の表・語彙・要件書）で、実装（refs.rs）もその 4 file を解く。入口・相談窓口・天井の正本と索引の欄の決まりの正本（design-intent/graph.yaml・2026-09-22 着地・便 95）の参照 id はこの母集団の外に在り（索引の欄の決まりの正本は床 folio check が読む file にも入らない）、その未解決は数えていない＝その部分は「まだ分からない」として扱う（P-4.2）。母集団を広げるかは判断の記録 ADR-3 決定 (6) の読み直しが要る（後続）。（審査の記帳 = 第 1.24 版で規範文の「母集合」を「母集団」に改めた〔天井の 20 周目 読みやすさ F-1〕＝用語集の見出し語・規則の表の行 R-1 / R-4 / R-9 / R-16・非機能要件 NFR1 の規範文・この要件の注と同じ語に揃えた。第 1.25 版で規範文の括弧の「（0）」を外した〔天井の 22 周目 整合 F-4〕＝値の正本は行 R-4 で、行の値は 2 つ組なので括弧は片方だけの写しでもあった。どちらも数える対象は変えない）

acceptance:
  - {id: AC1, title: 決まった 5 つの回答で支度表ができ、未回答の項目は別枠に出る, plain: 決まった答えを 5 つ入れると「何を作るか」の表が出て、答えなかった項目は別の枠に分けて出る。それを見せてもらえたら OK。, verifies: [FR1, FR2], red_test: {sentence: 固定回答 5 つの fixture を入れ、期待の支度表と一致し、無回答では全項目が別枠に出る, fixture: tests/fixtures/intake/answers-5.yaml}}
  - {id: AC2, title: 生成器が出すすべての面の class が部品目録に存在し、目録に無い class は 0, plain: 生成器が出すすべての面（今は入口・憲法・要件書・判断の記録・設計ノートの 5 つ）のどれにも、部品表に載っていない飾りが 1 つも無いことを、機械（部品の検査 folio parts --check）が数えて見せる。, verifies: [FR4, FR16, NFR2], red_test: {sentence: 目録外 class を 1 つ足した fixture で不合格になり、実の正本から生成した面では合格になる, fixture: tests/fixtures/floor/（mini-ok.html = 通る面・mini-extra.html = 目録外 class を 1 つ足した面・mini.css = 様式の定義・parts-catalog.json = 部品目録の凍結の写し）}}
  - {id: AC3, title: 床を壊した状態で「まだ分からない」が表示され、合格にならない, plain: わざと検査を壊した状態で道具を走らせ、「まだ分からない」と表示されて「合格」にならないことを見せる。, verifies: [FR5], red_test: {sentence: 正本が 1 つ欠けた fixture で床の結果が「まだ分からない」になり「合格」にならない, fixture: tests/fixtures/check/missing-file/}}
  - {id: AC4, title: CLAUDE.md の生成区間を 1 字変えると --check が非 0 で終わる, plain: AI の手元にある憲法の写しを 1 文字だけ書き換えて道具を走らせ、道具が「ずれている」と言って止まることを見せる。, verifies: [FR6], red_test: {sentence: 生成区間を 1 byte 変えた CLAUDE.md で --check の終了コードが非 0 になる, fixture: tests/fixtures/inject/drift/}}
  - {id: AC5, title: 生成した 3 面（入口・憲法・要件書）を持ち主が実際に開いて読み（walk）承認済み, plain: 3 枚のページを実際に開いて見て、持ち主が「確認した　大体これで良い」と言った記録（言葉どおり・日付つき）がある。, verifies: [FR4], red_test: {sentence: 承認の逐語と日付が台帳（f2-648 notes）と承認欄にある, fixture: 入口の正本 index.yaml の承認欄（持ち主の逐語 2026-09-18「確認した　大体これで良い」・生成した 3 面の walk）と bd f2-648 notes。手書きの見本 3 面の段の承認は 2026-09-12「承認するけど…」で、見本は 2026-09-18 に design-intent/preview/retired/ へ退役し、その棚ごと 2026-09-23 に repo から消した（見本は git の履歴にだけ在る・総点検の 🔴 4・A-1 の承認）}, note: 付帯条件（user 直命）を受入に含める（G16=A・受入 (d)）。第 1.33 版で固定の材料の見本の置き場を今の字に直した（天井の 27 周目 整合 F-3・実態 F-4）。}
  - {id: AC6, title: 内部 3 空間の参照 id の未解決が 0, plain: 要件・条文・数値の表の番号を全部集めて、行き先の無い番号が 0 個であることを機械が数えて見せる。, verifies: [NFR3], red_test: {sentence: 存在しない id を 1 つ書いた fixture で未解決 1 が報告され、正本 4 file では 0 になる, fixture: tests/fixtures/refs/dangling-id/}}

  - {id: AC7, title: 設計ノートが閉じた一覧の節の型だけで生成され、一覧に無い節の型は落ちる, plain: 設計の文書を機械が作れて、知らない種類の節があると作らずに止まることを見せる。, verifies: [FR9], red_test: {sentence: 一覧に無い節の型を 1 つ持つ fixture で生成が落ち、一覧内だけの fixture で通る, fixture: tests/fixtures/design-note/section-types/（落ちる側と通る側の 2 本）}, milestone: M1}
  - {id: AC8, title: 器の導出 file が無いと「まだ分からない」になり、合格にならない, plain: 契約表の「欄の決まり」の写しが無い状態で走らせ、「まだ分からない」と出て「合格」にならないことを見せる。, verifies: [FR10], red_test: {sentence: 導出 file を欠いた fixture で判定が「まだ分からない」になり合格にならない, fixture: tests/fixtures/design-note/schema-missing/}, milestone: M1}
  - {id: AC9, title: 導出物を 1 字変えると --check が非 0 で終わる, plain: scribe2 が読む形の file を 1 文字だけ書き換えて走らせ、「ずれている」と言って止まることを見せる。, verifies: [FR11], red_test: {sentence: 導出物を 1 byte 変えた fixture で --check の終了コードが非 0 になる, fixture: tests/fixtures/design-note/derive-anchor.yaml と derive-anchor.toml（凍結 anchor = 手書きの契約表と、それから期待される導出物の対・便 119 が 2026-09-24 に置いた）。1 字ずらした導出物は file に置かず、歯 crates/folio/tests/derive.rs が期待の導出物の写しの 1 byte を変えて作る}, milestone: M3}
  - {id: AC10, title: 規範の印を持つ文の違反が数えられ、記述の文は数えられない, plain: 「〜しなければならない」と書いたのに番号が無い文・数と単位を書いた文が違反として出て、普通の説明文は出ないことを見せる。, verifies: [FR12], red_test: {sentence: 参照 id の無い印付きの文 1 つと数と単位を持つ印付きの文 1 つの fixture で違反 2 が報告され、記述の文だけの fixture で 0 になる, fixture: tests/fixtures/prose-gate/}, milestone: M1}
