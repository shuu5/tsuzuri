  - {id: AC18, title: 天井の印が凍結の束と所見から決定的に導出でき、門が印と便の書き換える file の一覧（write-set）から 3 値を返す, plain: 欠陥を 1 つ仕込んだ小さな文書の審査の結果から機械が印を書き、凍結してある期待と一致することを見せる。その印を使って、設計文書の置き場の file を触らない便は通す・印が合格で規範の欄が変わっていなければ通す（注や平易文だけが変わっていても通し、変わった所の数を添える）・不合格なら止める・印が無い、規範の欄が変わって古い、「まだ分からない」が在るなら「まだ分からない」と言うことを見せる。, verifies: [FR20], red_test: {sentence: 凍結の束と所見から導出した印が期待の写しと違えば不合格になり、門の 7 場合（設計文書の置き場の file を触らない・合格で同じ引き金の要約値・合格で引き金の要約値は同じで正本の他の字が違う・不合格・引き金の要約値が違う・まだ分からないの観点・印が無い）の終了コードが期待と違えば不合格になる, fixture: tests/fixtures/ceiling/（凍結の束と所見・印の期待の写し）（印の期待の写し = tests/fixtures/ceiling/findings/stamp-expected.yaml・門の側の印の写し 3 本 = 同 dir の stamp-pass / stamp-fail / stamp-unknown.yaml）}, milestone: M2}

