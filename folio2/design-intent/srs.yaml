  effective: 承認欄の「承認」に持ち主の逐語と日付が入った時点で発効する（憲法 §6 発効段と同じ形）。版ごとに承認の行を足し、前の版の行は書き換えない。
  changes_from_v1_0:
    - M1 の要件を新しい番号で足した（FR9〜FR15・AC7〜AC13・CON8〜CON9）。M0 の要件（FR1〜FR8・NFR1〜NFR3・AC1〜AC6・CON1〜CON7）は据え置き（P-7.2）。NFR3 と AC6 の母集団（内部 3 空間）は広げない（ADR-3 決定 (6)）
    - 出所 = 判断の記録 ADR-3（契約表の所有と境界・2026-09-16 発効）と ADR-4（図の道具・2026-09-16 発効）の帰結。M1 の範囲 = 設計ノート（1 型・任意の型付き節）・契約表（外部の欄の決まりを参照する節）・導出物と差分 0・散文の門・要件の追跡表の測定値・id の索引・図の生成
    - FR1 に rules 行 D-10（持ち主への問いは対話面の散文で）の参照を足した（D-10 の note の予告どおり）
    - 承認欄は版ごとに行を持つ（v1.0 の行は書き換えない）。v1.1 の承認の行は持ち主の逐語（2026-09-16「いずれも推奨で進めて」）が入って発効した（それまでは status draft で置いていた）
  changes_from_v1_3:
    - 判断の記録の面（人が読むページ）の要件 FR16 と受入基準 AC14 を次の番号で足し、scope の「作らない」の行から判断の記録の生成を外した（設計ノートの生成は M1 のまま）。M0・M1 の要件・受入基準・制約は据え置き（P-7.2）。出所 = 判断の記録 ADR-7（2026-09-18 発効）と持ち主の直命 2026-09-18「ADRも人が読むページの生成に入れて」・裁定「推奨で承認する」（ADR-5 の撤退条件 ① = 手書きのまま）・発効の逐語「承認する」
  changes_from_v1_2:
    - 図 3（検査の答えは 3 つ・FR5 と AC3 の説明図）の正本として verdicts の節を足した（3 行 = 合格・不合格・まだ分からない・各行に id・name・tone・cond）。文は 2026-09-12 に見た目を承認した見本 srs.html の図 3 から起こした。要件・受入基準・制約は据え置き（P-7.2）。出所 = 判断の記録 ADR-5 決定 (1)（文章と数は正本から組む）と持ち主の裁定 2026-09-17（逐語「Aですすめてよい」）
  changes_from_v1_1:
    - CON1（順序）を改訂した: 「実装本体は scribe2 の骨格 s2-07l の出口が出来てから」→「実装本体は持ち主の裁定（2026-09-17）で着手し、変更は scribe2 の便で運ぶ」。持ち主の直命 2026-09-12（設計文書まで・Rust 実装は保留）も同じ逐語で解除。要件・受入基準・他の制約は据え置き（P-7.2）
    - 便 0 の範囲と受け皿（.vessel.toml・docs/design/delivery-0.md の契約表）は要件書の外（設計文書と契約表・判断の記録 ADR-3 決定 (8) の形）

goals:
  - {id: GOAL1, title: 相談して決められる, text: 「どの文書が要るか分からない」を無くす。最初と途中の両方に窓口がある。}
  - {id: GOAL2, title: 見た目が揃う, text: 入口も要件書も同じ品質・同じ様式。割れたページを作れない。}
  - {id: GOAL3, title: AI が自分で動き出す, text: 持ち主が道具を起動しなくても、AI が必要なときに folio を使う。}
  - {id: GOAL4, title: 壊れにくい道具, text: 寄せ集めの script をやめ、1 つの実装に置き換える。検査は黙らない。実装の手段は CON7 が決める。}

scope:
  build:
    - 相談窓口（intake）と支度表
    - 3 面（入口・憲法・要件書）の生成
    - 形の検査（床）と 3 値の判定
    - セッション開始の 1 行
    - 憲法を AI の手元へ写す（inject）
    - 組み立てて見せる（build と serve）
  not_build:
    - 設計ノートの生成 — M0 では作らない。M1 の「作る」の側へ移って着地済み（判断の記録の面は第 1.4 版で FR16 として足した）
    - 「番号が実在するか」を機械で追う仕組みの完成形（M0 は参照 id の未解決 0 を数えるだけ）
    - 何が変わったかの検出器
    - "見た目の AI 検査 — M0 でも今も作らない（建てないあいだ、判定は P-4.2 に従って「まだ分からない」として表に出す）。同じ行に在った読みやすさの AI 検査（天井・置き場の条は P-3.2）は M2 の「作る」の側へ移って着地済み（第 1.6 版の FR17 / FR18・判断の記録 ADR-8）"

scope_m1:
  build:
    - 設計ノートの生成（1 つの型・任意の型付き節・節の型は閉じた一覧）
    - 契約表の節（器 scribe2 の型から導出した欄の決まりを読む）と導出物の生成・差分 0 の検査
    - 散文の門（規範の印を持つ文だけ）
    - 要件の追跡表の測定値（着地の印・3 値・出所付き）と id の索引
    - 図の生成（図の道具の型付き記述 → 図の本体を部品として埋める）
  not_build:
    - 他の repo の要件 id・契約 id・便の id を参照 id の床（R-4）で解決すること（測定値に留める・ADR-3 決定 (6)）
    - 契約表の意味の検査（行の id の一意・要件と節の実在・依存の解決と輪の無さ・閉包〔触る型の閉包が書き込み範囲に収まること〕）— 器（scribe2）の編集時の止める仕掛けが持つ（ADR-3 決定 (3)）
    - 図の道具の閲覧の仕掛け（検索・強調・経路の追跡・発表の動き・書き出し）をそのまま置くこと（要るものは部品として持ち直す・ADR-4 決定 (3)）
    - 図の自動配置（座標は AI が書く・ADR-4）
  note: M1 の実装の着手は CON1 の順序に従う。設計文書（scribe2 の docs/design）を YAML 正本へ移す範囲は CON8 の別の論点。

actors:
  - {id: owner, name: 持ち主（非エンジニア）, role: 答える・決める}
  - {id: ai-session, name: AI セッション（Claude Code）, role: 起動する}
  - {id: scribe2, name: scribe2（変更を運ぶ器）, role: 中で動かす}
  - {id: folio-v1, name: folio v1（移行元・読み取りのみ）, role: 読み取る}
  - {id: folio-v2, name: folio v2, role: 道具}
outputs:
  - {id: prep-sheet, name: 支度表, from: FR1}
  - {id: three-faces, name: 3 面（入口・憲法・要件書）, from: FR4}
  - {id: verdict, name: 検査の結果（3 値）, from: FR5}

# 図 2「folio が 1 回で通す 7 段」の正本（段 3 の空欄を解く: 承認は P-12 と A-1 / A-2 が定める）
rail:
  - {n: 1, who: 持ち主, what: 相談して決める, reqs: [FR1, FR2, FR3, FR8]}
  - {n: 2, who: folio, what: 支度表が出る, reqs: [FR1, FR8]}
  - {n: 3, who: 持ち主, what: あなたが決める（採否）, reqs: [], basis: [P-1, P-12], note: この段を定める要件は無い（判断は道具の外・憲法 P-1）。承認の受け方は P-12、確認が要る操作は A-1 / A-2。}
  - {n: 4, who: folio, what: 3 枚を出す, reqs: [FR4, NFR2]}
  - {n: 5, who: folio, what: 床の検査, reqs: [FR5]}
  - {n: 6, who: folio, what: AI の手元へ配る, reqs: [FR6, NFR1]}
  - {n: 7, who: folio, what: 組み立てて、見せる, reqs: [FR7]}

# 図 3「検査の答えは 3 つ」の正本（FR5・AC3 の説明図・v1.3）。tone は図の色（ok / bad / neutral）
verdicts:
  - {id: pass, name: 合格 — 壊れていない, tone: ok, cond: 検査が最後まで動いて、決まりに反する箇所が 1 つも無かったとき}
  - {id: fail, name: 不合格 — 壊れている, tone: bad, cond: 検査が最後まで動いて、決まりに反する箇所が見つかったとき。直して検査をやり直すと「合格」へ移れる}
  - {id: pending, name: まだ分からない — 検査できなかった, tone: neutral, cond: 検査そのものが動かせなかったとき。合格として表示しない（憲法 P-4・AC3）}

requirements:
  - id: FR1
    title: 相談窓口（intake）
    pattern: event
    strength: must
    when: 持ち主が folio intake を実行したとき
    shall: folio は 5 問以下の易しい質問を推奨回答つきで提示し、回答から文書の集合を写像して支度表 1 枚を生成する。
    plain: 「何の文書が要るか」を AI と決める入口。質問は 5 つまで、どれにも「おすすめ」がついています。決まりの文の「写像」は、回答の組み合わせから、要る文書の集合を 1 つに決めることです。結果は支度表 1 枚。
    basis: [P-1]
    verify: {method: test, how: 決まった回答 5 つを入れ、支度表が期待どおりか比較する, ac: [AC1]}
    goals: [GOAL1]
    figures: [図2-1, 図2-2, 図1]
    rules: [D-10]
    note: 回答 → 文書集合の写像表は相談窓口の正本（intake.yaml）に置く（判断の記録 ADR-6 決定 (1)）。当初の案（規則の表か付録の側に置く・G15 D11）は同じ判断が案 b として退けたので、第 1.17 版でこの注を直した。質問と推奨回答は対話面の散文で出し、選択式の窓を使わない（D-10・v1.1 で参照を足した）。
  - id: FR2
    title: 答えが無くても止まらない
    pattern: unwanted
    strength: must
    when: 質問への回答が得られないとき
    shall: folio は推奨回答で進み、支度表に「推奨で進めた項目」を別枠で明示する。
    plain: 忙しくて答えられなくても作業は止まりません。ただし「おすすめで決めた所」は、支度表の中の別の枠にまとめて出します。
    basis: [P-1]
    verify: {method: test, how: 無回答で実行し、別枠に全項目が出ることを見る, ac: [AC1]}
