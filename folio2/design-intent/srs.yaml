  - id: FR6
    title: 憲法を AI の手元に届ける（inject）
    pattern: event
    strength: must
    when: folio inject --write が実行されたとき
    shall: folio は憲法の前文と規範文を持つ条を CLAUDE.md の生成区間へ書き込む。--check は区間と正本の差分を検出し、差があれば非 0 で終了する。
    plain: 憲法の前文（迷ったらどちらへ倒すかの順位）と、「決まりの文（規範文）を持つ条」を全部、AI が毎回読む場所（CLAUDE.md）に、何度やっても同じ結果になる形で写します。ずれていたら検査が失敗して止まります。
    basis: [P-14, P-6]
    verify: {method: test, how: 区間を 1 字変えて --check が非 0 になることを見る, ac: [AC4]}
    goals: [GOAL3, GOAL4]
    figures: [図2-6]
    note: v1.24 で規範文と平易文に憲法の前文（順位）を足した（天井の 19 周目 整合 F-2・20 周目 整合 F-4）。条 P-14.1 と規則の表の行 R-2 の注入の範囲の欄は初めから「前文 + 規範文を持つ条」で、実装（folio inject）も生成区間の先頭に前文を写しており、狭かったのはこの要件の文だけだった。第 1.24 版より前のこの欄は見本の根拠の誤参照への書き手あてのメモで、正しい根拠（P-14 と P-6）は同じカードの根拠の欄に在るので落とした（天井の 17 周目 読みやすさ F-6）。
  - id: FR7
    title: 組み立てて、見せる（build / serve）
    pattern: event
    strength: must
    when: folio build が実行されたとき
    shall: folio は全面を配信先へ生成する。folio serve は同じ端末の中（loopback）か tailnet の上でのみ配信し、公開ネットへ接続（bind）しない。
    plain: 「作る」と「見せる」の 2 つの命令。作るときは 1 枚ずつではなく全部の面をまとめて配信先へ出します（1 枚でも欠けたら 1 byte も書きません）。見せる先は自分の端末どうしの私設ネット（tailnet）か、同じ端末の中（loopback）だけ。
    basis: [N-6]
    verify: {method: test+inspection, how: 住所を明示して同じ端末の中でも tailnet の中でもない先を指す起動を拒むことと、住所を明示しない起動で tailnet の住所を解けなければ拒むことを見る, ac: []}
    goals: [GOAL2]
    figures: [図2-7]
    note: v1.23 で規範文と平易文に同じ端末の中（loopback）を足した（判断の記録 ADR-12・条 N-6.1 の第 1.2 版の改訂と同じ向き）。出所は天井の 17 周目（2026-09-21）の実態との突き合わせの所見 F-1（条の側・止める）と F-2（この要件の側）で、実装・歯・便 17 の契約・同じ file の図の節の名札は初めから同じ端末の中を通す側で揃っており、食い違っていたのは条とこの規範文の 2 か所だけだった。確かめ方の欄も同じ版で、便 17 に既に在る歯（住所を明示して外の先を指す起動を拒む・住所を明示しない起動で tailnet の住所を解けなければ拒む）まで広げた＝新しい歯は要らず、欄が見る道が実装と同じ 2 本になった（所見 F-2 の残りはこれで閉じる）。平易文の直し（第 1.24 版・天井の 16 周目 忠実さ F-3・18 周目 忠実さ F-4・20 周目 忠実さ F-4）= 規範文の前半（全面を配信先へ生成する）が平易文に無かったので 1 文を足した。規範文は変えない。
  - id: FR8
