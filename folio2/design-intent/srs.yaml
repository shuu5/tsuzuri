  - {id: AC20, title: 表に無い名の憲法の列の根は凍結で断られて床で落ち、folio2 の床は変わらない, plain: 憲法の写しの列が決まった最初の 1 枚から始まっているかを道具が確かめることを見せる。道具の表に名前の無い憲法で凍結の命令を実行すると、断って、最初の 1 枚の印（要約値）を表に行を足すときの材料として省かずに全部の桁で出すこと、既にある列の憲法の名を書き換えると検査が落ちること、folio2 自身の検査の結果が変わらないこと、利用者の手元へ写す表が自分の行だけであることを見せる。, verifies: [FR23], red_test: {sentence: 表に無い名の憲法の写しで凍結の命令が非 0 で終えて要約値の全桁を出し、凍結済みの列の憲法の名を書き換えた写しで床が違反を出し、folio2 の置き場の床の結果が便の前と同じで、生成区間の表の写しが置き場の名の行だけになる, fixture: 凍結の土台 tests/fixtures/floor_base/design-intent（凍結済みの憲法の列）と、表に無い名で別の中身の根を持つ tests/fixtures/anchor/root-digest-drift/。folio2 の列の根の要約値は歯の中の定数に持ち、道具の中の表は読まない（歯 crates/folio/tests/freeze_root.rs・便 121 が 2026-09-24 に置いた）}, milestone: M3}
