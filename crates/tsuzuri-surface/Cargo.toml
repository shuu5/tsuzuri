[package]
name = "tsuzuri-surface"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# 面の crate の直接依存は別枠の予算（規則の行 R-25: 8 本以下・xtask の歯 skeleton_ が名の一覧で測る）。
# 並べ方と状態の印と測れていないの判定（view）は host でも組み立てる。
[dependencies]
tsuzuri-contract = { path = "../tsuzuri-contract" }

# DOM と通信（board と net）は wasm の target のときだけ組み立てる（便 g-min・Leptos の csr）。
# web-sys の feature は後の block の便が manifest を触らずに済むよう便 g-parts でまとめて足した（外の package は増やさない）。
[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventSource",
    "EventTarget",
    "Headers",
    "History",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MessageEvent",
    "MouseEvent",
    "PointerEvent",
    "Request",
    "RequestInit",
    "Response",
    "Storage",
    "StorageEvent",
    "SvgElement",
    "WheelEvent",
    "Window",
] }

# 歯は server と同じ台帳の読み（tsuzuri_boundary::server::ledger::parse）で fixture を読む。
[dev-dependencies]
tsuzuri-boundary = { path = "../tsuzuri-boundary" }
