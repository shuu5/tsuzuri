で始め、字 裁定 id = にしない。器の bind と裁定の数え・中核の undelivered・answers の辺・行 e-revoke の取り消すの button（字 裁定 id = の行から組む閉じた問いの効いている最後の裁定の頁だけに出る・契約の surface の pub fn latest_ruling と面の project の node の pub fn shows_revoke）のどれにも方針は乗らない。(f) label は親から継がない（作る問いの label はちょうど 2 つ・根の t3-hub は label を持たないが、根に label が足されても形を崩さない）。作った id は子を作る書きの標準出力から読む（--silent の出力が id だけであることと、入った bd が --no-inherit-labels を持つことは席が実物で確かめた）。(g) 根は、今の memo の探しの根の決まり（種類 epic で親が無い）に closed を除くことを足し、いくつも在れば id の自然な順で最初。(h) 範囲の検査（all か open の問いの id・400 の字 scope）と空の逐語の断りは変えない。方針は配達しない（裁定でない）。(i) 作った後に落ちると、open の問い（題 方針（範囲 = …）・方針の行が無いか閉じていない）が残る。問いの頁にその card が出て、中核の不変条件 g-4（open の問いは touches を持つ）がその id を名指し、502 と 500 の本文も id を名指すので、席が見て閉じる（消さない）。(j) 503 の字 no-policy-memo は出なくなる（下の範囲の外 (2)）。(k) 外すのは決定の数（これまでの決定の項と件数）で、open の問いの数と列（account board の決定待ち・問いの頁の card）は外さない。方針の問いが open なのは (i) の途中で落ちた後だけで、席が見て閉じる印になる。 範囲の外（席への申し送り・notes.md の問い）。(1) 要件 FR8 の premises の検査は後の行 f-premises（計画の 9 節）が作る。(2) 面の policy の NoMemo の変種と NO_MEMO の字は届かなくなるが、この行では消さない。(3) 契約の surface.rs の RulingId の doc（方針は字 policy:）と for_policy、graph.rs の NodeKind::Policy の doc（根の直下の memo 方針の notes の定型行から導く）、設計ノート surface の節点の一覧の n-policy の字は古くなる（この行の file の外）。(4) t3-hub.29 を閉じるのは着地の後の席の台帳の書き。(5) 器の要件 FR83 は、追跡された file が引く裁定 id の形の字を台帳の閉じた問いの裁定の行に解けるかで見る。方針の問いは裁定の行を持たないので、tsuzuri が器の ruling-check を宣言した後に文書が方針の id を引くと解けない id に数えられうる（計画の 6 節の器への問い）。 着地済みの歯（境界と契約の crate の tests と src を grep で確かめ、試作で撃った）。tests/server_batch.rs（write-set・1017 行）の 12 本のうち、方針の memo への追記を見る server_batch_policy_all_appends_to_memo・server_batch_policy_scope_and_refusals・server_batch_policy_id_counts_up_and_picks_first_memo は今の決まりを見るので消し、server_batch_guards_write_nothing（同じ Origin の後の bdw の回 4）と server_batch_repo_and_state_bytes_unchanged（bdw の回 7）は方針の書きが 3 回になるので done (11)(12) のとおり直す（直さないと落ちる・今の偽の bdw は標準出力に何も出さないので方針が 502 になる・試作で確かめた）。ほかの 7 本は束の口だけを見る（着地した e-batch-partial が直した server_batch_write_failure_is_502_with_done_rows を含む）。契約の contract_form_ は CreateChild の欄と Effect の form