done = "(1) 境界の crate の pub mod acct の pub struct Acct の pub fn doc は、節の作業場の最初の読みで bd を proj-a・proj-b・proj-e の anchor で 1 度ずつ撃ち、引数の state dir の event log の更新時刻だけを替えた後の読みでは最初と同じ電文を返して器の argv を 18 にし、bd は proj-b だけに撃ち、proj-a の anchor の .beads の issues.jsonl を置いて更新時刻を替えた後の読みでは最初と同じ電文を返して器の argv を 27 にし、bd を proj-a と proj-b に撃つ（歯 alean_ledger_follows_mark） (2) Acct の pub fn with_git_hold（Duration を受け Acct を返す）で 400 ミリ秒にした Acct は、最初の読みで git を 10 回撃ち、event log の更新時刻を替えた持ち回しの内の読みでは器の argv を 18 にして git を撃たず、500 ミリ秒の後に更新時刻を替えた読みでは最初の 10 の argv をもう 1 度ずつ撃ち、どの読みも最初と同じ電文を返し、pub const GIT_HOLD は 60 秒（歯 alean_git_held） (3) Acct の pub fn with_own（server の ledger の pub struct Source を受け Acct を返す）に、proj-a の anchor の字の末に /. を足した repo の watched の Source（先に read を 1 度撃つ）を渡した Acct の doc は、with_own の無い Acct の doc と同じ電文を返して bd を proj-b と proj-e だけに撃ち、proj-a の .beads の issues.jsonl を置いて更新時刻を替えた後の読みでは同じ電文を返して bd を proj-b だけに撃つ（歯 alean_own_ledger_shared） (4) server の mod.rs に字 .with_own(sources.ledger.clone()) が 1 度在り、acct.rs に字 .map(|_| s.spawn(move || self.ledger_got(a))) が 1 度在り、字 s.spawn(move || source.got()) は無い（歯 alean_wiring_text） (5) Acct の 5 秒の中の 2 度の読みと marks は器 9・git 10・bd 3 の argv を 1 度ずつ撃ち、HOLD と 300 ミリ秒の後の読みの後は器の argv が 2 度ずつ、git の argv は 1 度ずつのまま、bd は proj-a・proj-b・proj-b・proj-e（歯 server_acct_holds_five_seconds） (6) 停止の記録を置いてから消す 3 度の集め直しの後、器の argv は 3 度ずつ（計 27）、git は 10、bd は proj-a・proj-b・proj-b・proj-b・proj-e（歯 acchold_card_follows_off_file） (7) bd を落として anchor の .beads の issues.jsonl を置き HOLD と 2 秒を待った後の Acct の doc_read は、最初と同じ電文と、経過が 5 秒以上 60 秒未満の落ちた読みの時刻を返す（歯 rhold_acct_ledger_held）"
