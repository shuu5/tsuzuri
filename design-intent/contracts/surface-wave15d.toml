goal = "在りかの main は 46113c7（計画 surface-plan 第 0.47 版・同じ build.rs と mod.rs を書いた行 f-premises〔便 t3-hub.52.90〕と、境界の board.rs と歯 server_read・server_coalesce を置き場だけの = で持った行 c-pipe-misfit〔便 t3-hub.52.88〕の着地の後）。この節の行の番号はその main の字で、鎖で先に流す行 c-dn-unknown と c-dn-edges（ノート surface-wave14d）が同じ build.rs・mod.rs・board.rs と歯を書くと動くので、足す所は fn と型の名でも書いた。実物の値は、席の folio の pin 6467915 を main の写しの design-intent（git の写し）に撃った出力と、2026-09-28 の台帳の値。 なぜ。要件 FR3 は不変条件の 12 本を 3 値で数え、発効した記録は裁定の行を持つ（g-3）と宙に浮いた裁定 0（g-7）を含む。設計ノート surface の 19 節は g-3 を accepted の判断の記録と規則行は ruled_by を持ち先の bead の notes にその裁定の行が在る、g-7 を裁定は問い（answers）か発効した記録（ruled_by の先）のどちらかに結ばれる とし、18 節は辺 ruled_by を 判断の記録・規則行・発効した文書から裁定へ・正本は承認欄 とする。今の中核の src/graph/check.rs は g-3・g-7・g-9 を私的な fn unmeasured（80〜82 行）でつねに Verdict::Unknown にし（RULES の 38・42・44 行・pub const UNMEASURED は 56 行の 3 本）、build.rs の頭の doc（5 行）は ruled_by の辺を組まない（索引に裁定の欄が無い）とする。そのため tz graph --check は違反が無くても rc 2 を返す（計画 3 節の席の決め）。folio2 の判断の記録 ADR-32 の決定 (5) と folio2 の席が送った手順（2026-09-28）は、索引の要約に裁定の欄を足さず、folio check --emit-rulings の行を索引の節点へ結ぶ道を決めた。受入 AC5 の前半の fixture の置き場は要件書の字どおり tests/fixtures/graph/unruled/ にする（今の tests/fixtures/graph/unruled.json は中核の graph_unruled_has_no_ruling の fixture で、この行は触らない）。 在りか・folio の書き出し（この行の外・読むだけ）。folio check --dir <dir> --emit-rulings は、決定の欄から切り出した裁定 id を 1 件 1 行の JSON（鍵 ruling・form・bead・node・file・line・field）で標準出力に書き、違反と要約は標準エラーに書き、終了コードは素の床と同じで、一覧が全数なのは 0 のときだけ。form は閉じた 3（question・notes-time・bead）で、question の ruling は台帳の id に器の問いの印が続く字、bead の ruling は台帳の id と同じ字、notes-time の ruling は台帳の id に notes の日時が続く字。node は判断の記録の approval.ruling・規則の表の行の ruling・憲法の条の amended_by の ruling の行では節点の id で、設計ノートの meta.approval[n].ruling・憲法の meta.approval.ruling・判断の表の行の ruling・承認欄の stamp の行では null。file と node の字は索引（graph --print の 5 列の行）の file と id の字と同じ。1 つの承認の字に裁定 id が 2 つ在れば行は 2 つで、同じ裁定 id が 2 度出ても畳まない。main の写しで 213 行・rc 0・0.2 秒ほどで、git の無い写しでは rc 2（床がまだ分からない）だった。 在りか・中核（write-set）。src/graph/mod.rs（213 行）は use serde::Serialize（15 行）と、pub struct Graph（128〜142 行・derive は Debug・Clone・Default・PartialEq・Serialize・pub な欄 nodes・edges・unread・skipped・beads・runs・policies）と impl Graph（144 行から・is_read は 146 行・node は 172 行）を持ち、graph の module の pub な型は tests から tsuzuri_core::graph::<名> で届く。src/graph/build.rs（558 行・pub mod build）の pub fn add_summary（94〜126 行）は要約の字を読めなければ g を変えずに偽を返す形で、私的な fn edge（133〜139 行）が辺を作り、私的な fn add_ledger の notes の定型行の loop（344〜368 行）は行頭 裁定 id = の行から裁定の節点（id は最初の・の前）を組み、bead が問いのときだけ answers の辺（裁定から問いへ・366 行）を組む。src/graph/check.rs（318 行・pub mod check）は type Rule（32 行・fn(&Graph) -> Verdict）と RULES（35〜48 行）と pub const INVARIANTS（51〜53 行）と UNMEASURED（55〜56 行）と pub fn check（59〜67 行）と、要る出所が読めなければ Unknown・名指す id が空なら Pass・在れば Violation を返す私的な fn judge（70〜78 行）と、辺の型ごとの組の私的な fn pairs（124〜130 行）を持つ。 在りか・境界（write-set）。src/server/design.rs（160 行）は pub const SUMMARY_ARGS（26 行）と FOLIO_TIMEOUT（5 秒・29 行）と FOLIO_WAIT（32 行）と、pub struct Design（36〜42 行・欄 repo と folio と私的な合流の場 shared と summary_shared）と pub fn summary_args（84〜88 行）と pub fn summary（92〜97 行・capture で rc 0 の標準出力だけを返し、合流した呼び出しは FOLIO_WAIT まで待つ）を持つ。src/server/board.rs（278 行）の pub struct Texts（40〜48 行・derive に Default・pub な欄 design・ledger・events・summary）を Sources の pub fn gather_held（69〜85 行）が組み、索引と要約は thread::scope で並べて撃つ。私的な fn built（108〜113 行）は build と add_summary を撃ち、pub fn graph（116〜120 行）と view・view_open・around が使う。境界の src/cli/graph.rs（300 行）の私的な fn check（196〜233 行）は、まだ分からない の本の理由を UNMEASURED に在れば 測る機構がまだ無い、ほかは 読めない出所が在る と書き、pub const NEXT の g-3（36〜39 行）と g-7（49〜52 行）の次の 1 手の字を持つ。pub fn run の match（157〜176 行）は、tz graph --check と旗なしでは Sources::gather の Texts を board::graph に渡し（164 行）、--design は Texts の既定に索引と要約だけを置き、Mode::Check で fn check に電文の invariants を渡す（181 行）。use は 17 行、頭の doc は 1〜8 行。 形。(a) mod.rs の pub struct PolicyAttr の前に pub enum RulingForm（Question・NotesTime・Bead・derive は Debug・Clone・Copy・PartialEq・Eq・Serialize・Deserialize・serde の rename_all は kebab-case）と pub struct RulingRow（pub な欄 ruling・form・bead・node〔Option〕・file・field・欄 line は読み捨てる・derive は Debug・Clone・PartialEq・Eq・Serialize・Deserialize）と、RulingRow の pub fn target（form が Question なら ruling、ほかは bead）を足す。Graph に pub な欄 rulings（Option の BTreeMap・鍵は節点の id・値は結んだ RulingRow の Vec）を最後に足し、impl Graph に pub fn holds（form が Question なら種類 NodeKind::Ruling で id が ruling の節点が在るか、ほかは beads に bead が在るか）を足す。use を serde の Deserialize と Serialize にし、頭の doc に 書き出しの結びの 1 行を足す。(b) build.rs の add_summary の後に pub fn read_rulings（字が空か、JSON の object として読めないか RulingRow の形に合わない行が 1 つでも在れば None・空の行は読み捨てる）と、私的な fn note_approval（欄の道が meta.approval[ と数字と ].ruling）と、pub fn add_rulings（読めなければ g を変えずに偽・読めたら結んだ表を g.rulings に置いて真）を足す。add_rulings は上から順に、node が在れば id が node で file が同じ字の節点 1 つへ、node が無く note_approval なら file が同じ字の種類 NodeKind::NoteRow の節点の全部へ結び、ほかの行は結ばない。辺は、節点の id の順・行の順に、holds が真の行だけ、節点から target へ型 EdgeType::RuledBy を build の辺の後に足し、同じ組は 1 本にする。頭の doc の 5 行を、ruled_by の辺は build の後に add_rulings が書き出しから組む旨に替える。(c) check.rs の RULES の g-3 を私的な fn g3_ruled、g-7 を私的な fn g7_bound にし、UNMEASURED を g-9 の 1 つに、新しい pub const RULED（g-3 と g-7）を足し、頭の doc の 2 行を直す。g3_ruled は、rulings が None か設計の索引か台帳が読めなければ Unknown、結んだ行のうち holds が偽の行の bead の族（最初の「.」の前の字）が beads のどれかの鍵の族と同じなら、その行の節点の id を名指し、名指す id が在れば Violation、無くて族の違う行が在れば Unknown、ほかは Pass。私的な fn unbound は、種類 NodeKind::Ruling の節点のうち answers の辺の元でも ruled_by の辺の先でもない節点の id を、pub fn in_ruling_grammar が真の組（文法の内）と偽の組（文法の外）に分ける（どちらも BTreeSet）。in_ruling_grammar は folio の ruling.rs の裁定 id の文法の写しで、字の全部が、台帳の id（英小字 1・数字 1・「-」・英小字か数字の並び・「.数字」の段を何段でも）に、器の問いの印（「:」年月日 8 桁「T」時分 4 桁「Z-」連番）か notes の日時（「 notes」に「 年-月-日」か「 時:分」か両方・分の 1 桁は x でもよい・任意の「 JST」）が続くか、どちらも続かない形なら真（正規表現を使わず字の走査で書く）。g7_bound は、rulings が None なら Unknown、文法の内の組を judge（要る出所は設計の索引と台帳）に渡し、Pass でも文法の外の組が空でなければ Unknown。pub fn outside_rulings は、rulings が在り設計の索引と台帳が読めて、文法の内の組が空で文法の外の組が空でないときだけ、その数を Some で返す（g-7 がそのために まだ分からない のとき）。頭の doc に g-7 の文法の外の 1 行を足す。(d) 境界の design.rs に pub const RULINGS_ARGS（check・--emit-rulings・--dir）と Design の私的な欄 rulings_shared と pub fn rulings_args と pub fn rulings（summ