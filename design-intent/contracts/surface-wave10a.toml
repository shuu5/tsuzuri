goal = "なぜ。持ち主の裁定 t3-hub.52.53（裁定 id = t3-hub.52.53:20260928T0412Z-1・逐語は問いの bead の notes・字はここに写さない）と席の読み（同じ notes の 5 項）で、グラフは節点を切らずに組の箱へ畳み、最初の図は帯ごとの組の箱と epic を出し、箱を押すと 1 段開きもう一度で畳み、見える箱は 40 まで（越えるときは古く開いた組から畳み直す）とした。同じノートの行 c-graph-fold が電文と中核と口を替え、この行は面の描きと開き閉じを受け持つ。見本 mock v3 の map.html の graphModel（判断の記録 ADR-7 が承認した見本）はグラフの箱を選ぶ形なので、この裁定がグラフの眺めについてだけ改める。要件は FR5（帯と地図の描き方）と FR14（hover の規則）。 使う電文（行 c-graph-fold が足す・この行は書かない）。契約の graph の ViewNode は node・status・rank・kids・degree に、group（組の箱なら真）と fold（BoxFold の Leaf は開けない・Folded は押すと開く・Open は開いていて押すと畳む）を持ち、GraphView は nodes・edges・shown・folded・cut・total・unread に、open（開いたままの箱の id・開いた順）と refused（上限を越えるので開かなかった id）を持つ。4 つの欄は serde の既定を持ち、欄の無い字は group が偽・fold が Leaf・列が空に読める。組の箱の node の id は ~ で始まる字か ~ を含む塊の字（例 ~rule・~art:P・~b:SRS・t3-hub.52~1-12）、kind は中の節点の種類、title は組の題（例 規則行・条 P・t3-hub.52.1 … t3-hub.52.12）、file と digest と line と plain と eng は None、status は None。kids はその箱へ畳まれて自分の箱を持たない節点の数。口 GET /api/graph/view は query の open（id を字 , でつなぎ %XX で書いた 1 つの値）を受け、無ければ最初の図を返す。 在りか（main 1c26a6f で確かめた・この行は c-graph-fold の着地の後に流す）。src/mapview/graph.rs（write-set・host でも組む）は pub const PATH（二重引用符で囲んだ /api/graph/view が file に 1 度）・REASON・pub fn doc・配置の定数と Pos・Column・Lane・BandRow・Layout と pub fn layout・線の LineStyle と line_style・curve・straight・line_ends・edge_path・line_svg・legend_line・esc・cut・BOX_TITLE_CHARS・round_mark・open_question・closed・border・kids_badge（kids が 0 より大なら語の鍵 children の語と空白と数）・node_svg（ViewNode と Pos を受け、字 g class= と引用符で囲んだ node と data-key と tabindex と aria-label の要素の中に、縁の rect class hit と頭の記号と 1 行目の id と 2 行目の題 12 字と子の数の札を置く・href と link の role を持たない）・BandFill と band_fill と zero_text・svg・band_labels・LEGEND_SHAPES と LEGEND_BORDERS と LEGEND_HOVER・Legend と legend・edge_term・ChainRow（id・title・shape・alert・kids）と ChainBand と chain・count_line（shown / total ・ 子 folded ・ ✂ cut の形）・expert_line・HUB_DEGREE と LIT_MAX と DEPTH と Side と Highlight と degrees と highlight・PinBar と PinAction と pin_next・拡大の定数と Zoom と initial_scale と box_height と dragged・opens_node を持ち、末に wasm の target のときだけの pub use dom::view と mod dom; を持つ。src/mapview/graph/dom.rs（write-set・wasm の target のときだけ）の pub fn view は crate::net::read(PATH) で眺めを読み、panel が図と凡例と数の行と狭い幅の一覧を組み、click で固定、dblclick と Enter と Space で節点の頁へ移り、図と一覧の hover card を view_cards の値で出す。src/widgets/nodecard.rs（write-set）は pub fn card_for（GraphNode と状態を受け Card）と pub fn view_cards（ViewNode の slice を受け、id ごとに最初の節点の card_for の値）ほかを持つ。hover の Card は title・kind・value・src・more の 5 つの欄を持つ（この行は変えない）。vocab.json（write-set）の鍵 children の見出しの語は 子、cut は 表示した数。 在りかの補い（器の事前の点検の返しで足した・main de09113 で確かめた）。(a) 狭い幅の一覧の 1 行の pub struct ChainRow（graph.rs・欄 id・title・shape・alert・kids）を組むのは graph.rs の関数 chain だけで、repo の全部の file で字 ChainRow が在るのは graph.rs だけ。着地済みの歯 mapgraph_narrow_chain_order（tests/mapgraph.rs・write-set の =）は chain(&v) の値の欄 id・kids・shape・title を読むだけで、ChainRow の構造体の式を書かない。だから ChainRow に欄 group と fold を足しても、この歯は直さずに組めて通る（done (8) と合う）。(b) mapview の encode（src/mapview/mod.rs の pub fn encode）は、英数字と字 - と _ と . と ~ の 4 つをそのまま残し、ほかの byte を全部 %XX（大文字の 16 進 2 桁）にする。だから ~rule は ~rule のまま、~art:P は ~art%3AP になる（: は %3A）。区切りの字 , は encode に通さずに id の間に置く（done (1) の ~rule,~art%3AP）。 形（host・新しい src/mapview/graph/fold.rs・graph.rs に pub mod fold; の行を足す）。pub struct OpenList（derive は Debug と Clone と Default と PartialEq と Eq・開いた箱の id の列）に pub fn ids（&[String]）・pub fn toggle（&mut self と id の &str と BoxFold を受け bool）・pub fn adopt（&mut self と String の slice）・pub fn path（String）を置く（決まりは done (1)）。pub fn mark_svg（ViewNode と Pos を受け、Leaf なら None、Folded なら右下の小さな四角と字 ▸、Open なら字 ▾ を持つ字 g の要素の SVG の字の Some）と pub fn refused_line（GraphView を受け String の Option）を置く。fold.rs の字には二重引用符で囲んだ /api/ の字を書かない（query の path は PATH から format で組む・着地済みの歯 parts_paths_distinct_in_block_modules は src の二重引用符の /api/ の字を集め、/api/graph/view は graph.rs に 1 度だけと見る）。 形（host・graph.rs）。node_svg は、group が真の箱では 1 行目に esc と cut を通した題を、2 行目に種類の語（語の鍵 kind_key の語）と字 · と語の鍵 gf_group の語を書き、aria-label も題と種類の語と gf_group の語にし、縁の rect class hit に stroke