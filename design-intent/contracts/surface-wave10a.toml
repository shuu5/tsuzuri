id = "c-graph-fold"
title = "グラフの眺め（中核の graph の view と口 /api/graph/view）を、上限で節点を切る形から、どの節点も見えている箱のどれかに畳む形に替え、電文の箱に組の印と開きの 3 値を、眺めに開いた箱の列と開けなかった箱の列を足し、口は query の open で開く箱の id の列を受ける（上限 40 は見える箱の数の上限・越えるときは古く開いた組から畳み直す）"
