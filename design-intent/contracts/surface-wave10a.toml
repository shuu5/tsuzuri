done = "(1) 契約の graph の module に pub enum BoxFold（Leaf・Folded・Open の 3 つ・serde の字は leaf・folded・open・既定は Leaf・pub const ALL はこの順）が在り、ViewNode に pub な欄 group（bool）と fold（BoxFold）が、GraphView に pub な欄 open と refused（どちらも String の Vec）が在ってどれも serde の既定を持ち、欄 group と fold の無い ViewNode の字は group が偽で fold が Leaf に、欄 open と refused の無い GraphView の字は 2 つとも空に読め、ALL の 3 つを契約の wire の encode に通した字は順に、二重引用符で囲んだ leaf・folded・open（歯 gtuck_wire_defaults） (2) 13 節点 16 辺の例のグラフの view は、箱 6 つを節の順で（id・段・子の数・次数が ~art:P 0 3 3・~rule 1 1 1・~srs:req 2 2 3・~srs:actor 0 1 0・~adr 1 1 2・e 3 4 2）出し、group は e だけ偽で fold は 6 つとも Folded、状態は e だけ open、まとめた辺は節の 6 本（本数はどれも 1）、shown・folded・cut・total は 6・12・0・13、open と refused は空（歯 gview_example_view） (3) 同じ例で open に ~art:P・P-1・~srs:req・FR1・e・e.1・~rule・~adr・~srs:actor をこの順に渡すと、箱は節の 16 で、P-1・FR1・e・e.1 と 5 つの組は Open、規範文の 2 つ・AC1・ACT1・R-1・ADR-1・走行は Leaf、e の子の数は 2（問いと裁定）で、ほかの子の数は 0、辺は節の 12 本（P-1.1 と P-1.2 から P-1 への in-article は 2 本ずつ）、shown・folded・cut・total は 16・2・0・13、open は渡した列のまま（歯 gtuck_levels_example） (4) 規則行 R-1〜R-30・判断の記録 ADR-1〜ADR-30・要件 FR1〜FR30 で辺の無いグラフで、~rule・~rule~1-12・~adr・~adr~1-12・~srs:req・~srs:req~1-12 を渡すと、open は ~adr・~adr~1-12・~srs:req・~srs:req~1-12、~rule は Folded で子の数 30、shown は 33 で refused は空（歯 gtuck_refold_oldest） (5) 節の帯のグラフ（条 3・srs の 7 種に 1 つずつ・epic E の子の task E.1〜E.144・E.1 の走行 12）で、E・E~1-12・E.1 を渡すと open はその 3 つで shown は 39、帯の箱 ~b:constitution（子の数 3）と ~b:SRS（子の数 7）が Folded で出て、同じ列の後に ~b:SRS を足すと open は ~b:SRS だけで shown は 9、E は Folded で子の数 156、~b:constitution は Folded のまま（歯 gtuck_bands_make_room） (6) epic X1〜X30 と X1 の子の task 144 のグラフで、X1・X2・no-such・X1 を渡すと refused は X1 だけで open は空、箱の列は open を渡さない view と同じ（id・fold・子の数）、子 619 の epic の見本で h~1-12・h.1・A-1・空の字・~b:nope を渡すと open と refused は空で shown は 2（歯 gtuck_refuse_and_ignore） (7) 子 619 の epic の見本で h と h~577-619 を渡すと、箱は ~art:A・h・h~1-144・h~145-288・h~289-432・h~433-576・h~577-588・h~577-619・h~589-600・h~601-612・h~613-619 の 11 で、子の数は h~1-144 が 145・h~577-588 が 12・h~613-619 が 7、題は h~577-588 が h.577 … h.588、辺は 8 本の parent-child で本数は 144 が 4 本と 12 が 3 本と 7 が 1 本（歯 gtuck_chunk_ids） (8) 実物の見本（設計の索引・台帳 8 行・event の記録の fixture）の view は shown が 20 以下で、view とその Folded の箱を 1 つずつ open に渡した眺めのどれも、cut が 0・shown が VIEW_CAP 以下・箱の id が重ならず・group の偽の箱の数と folded の和が total・辺の両端が箱の id で from と to が違い、1 つずつ渡した眺めの open はその id だけで refused は空（歯 gtuck_real_every_node_boxed） (9) 中核の graph の fold の pub fn open_list は字を字 , で分けて空の項を捨てた列を返し（a,,b は a と b・空の字は空の列・前後の空白は残す）、pub const CHUNK は 12、view の VIEW_CAP は 40 のまま（歯 gtuck_open_list_split） (10) 口 GET /api/graph/view は query の open の値を open_list に通して眺めに渡し、実物の見本の place で、view の最初の Folded の箱の id を %XX にして open に置いた応答の本文は中核の view_open に同じ id の列を渡した電文の字と同じで open はその id だけ、open が no-such の応答と query の無い応答の本文は中核の view の電文の字と同じ（歯 gtuck_route_open_query） (11) src/graph/fold.rs と src/graph/view.rs の字に std::fs と std::process と SystemTime が無い（歯 gtuck_pure_text） (12) 着地済みの歯は、gview_example_view・gview_hub_619_view_is_capped・gview_cycle_view_returns を節のとおり直し、contract_form.rs と tests/mapgraph.rs の struct の字に新しい欄を足し、写しの contract_form.json を作り直したうえで全部通り（xtask の check・gview_ の残り・nsum_ の全部・contract_form_ の全部・server_view_ の全部・nsumw_routes_carry_fields・mapgraph_ の全部を含む）、足す外の依存は 0 本（歯 gtuck_pure_text が中核の Cargo.toml の直接依存の名が serde と serde_json と tsuzuri-contract だけと見る） (13) tests/gtuck.rs の test の属性の付いた fn の名はどれも gtuck_ で始まり、名から先頭の gtuck_ を除いた字は、節に並べた filter の語のどれも部分の字として含まない（歯 gtuck_own_names_clean が自分の file の字を読んで全部の名を見る）"
goal = "なぜ。地図のグラフは約 700 の節点のうち上限の 40 だけを選んで描き、残りを切る。持ち主の裁定 t3-hub.52.53（裁定 id = t3-hub.52.53:20260928T0412Z-1・逐語は問いの bead の notes に記帳・字はここに写さない）の要旨は、グラフは全体像を知るものなので、上限から溢れたら出さないのでなく、畳む手段を使いうまく組を作って畳むこと。席の読み（同じ bead の notes・2026-09-28T04:2xZ）は 5 つ。(1) 黙って切る節点を無くし、どの節点も見えている組のどれかに畳まれ、cut は通常 0。(2) 組の段は、憲法は条の系（id の頭の A・N・P）→ 条 → 規範文、規則は規則行の 1 組、要件書は種類ごとの組（受入基準は verify.ac で検める要件へ畳む）、判断の記録は 1 組、設計ノートはノート → 行（今は 0 節点で、0 でも働く形にする）、台帳は epic → task → 走行（問いは親へ・裁定は問いへの今の畳みを残す）。(3) 最初の図は帯ごとの組の箱と epic を出し、組の箱に中の数を出す。(4) 箱を押すと 1 段開き、もう一度で畳む。40 は見える箱の数の上限とし、開いて越えるときは古く開いた組から畳み直す（落とさない）。(5) 辺は見えている代表へまとめ、数を出す。この行は中核と電文と口を受け持ち、面の開き閉じは同じノートの行 g-graph-fold が受け持つ。見本 mock v3 の map.html の graphModel（判断の記録 ADR-7 が承認した見本・子を持つ節点と次数の順に 40 まで）を、この裁定がグラフの眺めについてだけ改める（ADR-7 の本文は上限と選び方の字を持たない）。要件は FR5（帯と地図の描き方）。 在りか（main 1c26a6f で確かめた・1eb50a7 から code は変わらない）。中核の src/graph/view.rs（write-set）は pub const VIEW_CAP（40）と pub fn view（Graph の参照を受け、契約の GraphView を返す）と pub(super) fn count と私的な fn rank_of を持つ。今の view は、規範文を条へ（id が 条の id と字 . と数字の並び）・question を parent-child の先へ・ruling を answers の先の畳み先へ畳み、辺を basis_end で根拠の側へ向けて（D・U・型）でまとめ、候補が 40 を越えれば子を持つ節点・眺めの次数の大きい順・id の自然な順で先頭の 40 を取って残りを切り、段を D から U への最も長い道で決め、節点を種類の順と自然な順で並べる。cut は上限で切った数と畳まれずに辺の無い節点の数の和。今の実物の口の値は shown 40・folded 134・cut 509・total 706 で、規則行 27 と走行 224 は全部切られる。src/graph/mod.rs（write-set）は pub mod around・build・check・view と pub use view::view と Graph（nodes・edges・unread・skipped・beads・runs の欄と index・degrees・status・unread_wire ほか）を持つ。契約の src/graph.rs（write-set）の ViewNode は node（GraphNode）・status・rank・kids・degree、ViewEdge は from・to・型・count、GraphView は nodes・edges・shown・folded・cut・total・unread の欄を持ち、どれも derive は Debug と Clone と PartialEq と Eq と serde で Default は無い。同じ file に近傍の畳みの pub enum Fold（none・up・down・both）が在るので、新しい enum の名は BoxFold にする。境界の routes/graphview.rs（write-set）は GET /api/graph/view の Entry と私的な fn view を持ち、board.rs（write-set）の pub fn view（Texts を受け、私的な built で組んだグラフを中核の view に渡す）を呼ぶ。第 9 波の行 e-hold（surface-wave9・今流れている）はこの 2 つの file を書き、route の file の字に aged( を置き、台帳の読みを持ち回す集めの fn の組を使う形にする（その行の done (7) と節）。この行は e-hold の着地の後に流し、その形（集めの fn と aged( で包むこと）を残して、呼ぶ眺めの関数だけを替える。 形（契約）。graph.rs に pub enum BoxFold を足す（derive は Debug と Clone と Copy と Default と PartialEq と Eq と Hash と serde・serde の字は小文字の leaf・folded・open・既定は Leaf・pub const ALL は Leaf・Folded・Open）。ViewNode の末に pub group: bool（組の箱なら真）と pub fold: BoxFold（Leaf は開けない・Folded は押すと開く・Open は開いていて押すと畳む）を、GraphView の末に pub open: Vec<String>（開いたままの箱の id・開いた順）と pub refused: Vec<String>（開くと上限を越え、畳み直しても収まらないので開かなかった id・求めの順）を足し、4 つとも serde の既定を付ける（今の電文の字と fixture の tests/fixtures/surface/graph-view.json は欄が無くても読める）。組の箱は ViewNode の 1 つとして nodes に入り、node は作った GraphNode（id は組の id・kind は組の種類・title は組の題・file と digest と line と plain と eng は None）、status は None。 形（組の木・中核の新しい src/graph/fold.rs）。節点の種類の帯は面の帯と同じ 7 つ（constitution は条と規範文・rules は規則行・ADR は判断の記録・SRS は目的と要件と非機能要件と受入基準と制約と登場人物と出力・design-note は設計ノートの行・beads は台帳の 7 種・pipeline は走行）。各帯の箱の id は字 ~b: と帯の名（例 ~b:SRS）、種類はその帯の順の先頭の種類（条・規則行・判断の記録・目的・note-row・epic・run）、題は帯の名。帯の箱の子（1 段目）は、constitution は条の系の組 ~art: と系の字（系は id の頭の ASCII の英字の並び・無ければ _）で、中は条と条へ畳まれない規範文、rules は ~rule、ADR は ~adr、SRS は種類ごとの ~srs: と種類の英字（goal・req・nfr・ac・constraint・actor・output）、design-note はノートごとの ~note: とノートの id（節点の id の字 # より前）、beads は epic の節点の全部（epic の親子は辺で出し、木では入れ子にしない）と、台帳のほかの組 ~led: と種類の英字（task・memo・question・ruling・receipt・policy）、pipeline は task へつながらない走行の組 ~run。2 段目から下は、規範文は今の決まりで畳む条の子、受入基準は verify.ac で検める要件か非機能要件（辺 verify.ac の from か辺 verifies の to・複数なら自然な順の先頭）の子、task と memo は parent-child の先が epic か task か memo ならその子、走行は run_of の先が epic か task か memo ならその子（どれも無ければ台帳のほかの組か ~run の中）。question（parent-child の先が在る）と ruling（answers の先が在る）は今の畳みのまま開かない子で、自分の箱を持たず、畳み先の箱に数える（先が無ければ ~led:question か ~led:ruling の中の箱）。畳み先をたどって輪になる節点と、親をたどって帯に着かない節点は、台帳のほかの組に入れる。組は中の節点が在るときだけ、帯の箱は中の組か節点が在るときだけ作る。箱の子は種類の順・id の自然な順に並べ、帯の箱でない箱の子が CHUNK（12）を越えれば、先頭から CHUNK ずつ区切った塊の組にする（塊の数が CHUNK を越えれば塊をさらに CHUNK ずつまとめる・区切りの幅は CHUNK の冪）。塊の id は親の箱の id と字 ~ と、覆う子の番号の範囲（1 から数え、字 - でつなぐ・例 t3-hub.52~1-12・h~577-619）、種類は覆う先頭の節点の種類、題は覆う先頭と末の節点の id を字 … でつないだ字（例 h.577 … h.588）。~ で始まる組の id と ~ を含む塊の id は、実物の設計の id と bead の id と走行の id に ~ が無いので、節点の id と重ならない（確かめた）。 形（開き・fold.rs）。pub const CHUNK: usize = 12 と pub fn open_list（&str を受け、字 , で分けて空の項を捨てた String の Vec を返す・前後の空白は切らない）を置く。開く列の処理は次の決まり（私的な関数の形は問わない）。初めに帯の箱を帯の順に 1 つずつ開く（初めから開いている帯）。次に求めの列を順に見て、開ける箱（子を持つ箱）でない id・求めの中の 2 度目の id・今見えていない箱（先祖のどれかが開いていない）の id・帯でなく既に開いている id は捨てる。帯の箱の id は、開いている帯でも閉じた帯でも、その位置で開いた（開いた時を今にする）と数える。開くと見える箱の数（帯の箱は開いていれば数えず畳んでいれば 1・ほかの箱は開いていても 1）が VIEW_CAP を越えるなら、今開いた id とその先祖を除き、求めで開いた箱の開いた順の古いもの、次に初めから開いている帯の帯の順で、1 つずつ畳み直し（その子孫の開きも外す）、収まれば開く。全部を畳み直しても収まらなければ、その id を開かず（畳み直しも戻す）refused に積む。電文の open は求めで開いてそのまま開いている id の開いた順の列（初めから開いている帯は入らない）。この決まりで、見える箱はつねに VIEW_CAP 以下になり、節点は落ちない。 形（眺め・view.rs）。pub fn view_open（Graph の参照と String の slice を受け GraphView を返す）を足し、pub fn view は view_open に空の列を渡した値を返す（引数と返りは今のまま）。mod.rs は pub mod fold; を足し、pub use view::{view, view_open}; にする。箱の列は見える箱のうち開いた帯の箱を除いた全部。節点ごとに見える箱（問いと裁定は畳み先の見える箱・ほかは自分か一番近い見える先祖）を決め、辺は今の決め方（basis_end の向き・同じ箱の辺は捨てる・（D・U・型）でまとめて本数・D と U の自然な順と型の順）で見える箱へまとめ、段は今の rank_of の決め方で箱と辺から決め、箱は種類の順と自然な順に並べる。節点の箱の status・degree は今のまま（degree はグラフの次数）、組の箱の status は None で degree はまとめた辺でつながる別の箱の数。kids はその箱へ畳まれて自分の箱を持たない節点の数（節点の箱は自分を除く）。fold は子の無い箱が Leaf、開いた箱が Open、ほかが Folded。shown は箱の数、folded は kids の和、total は Graph の nodes の数、cut は total から節点の箱の数と folded を引いた数（同じ id の 2 つ目の節点だけが残る・通常 0）、unread は今のまま。 今日の実物の最初の図（2026-09-28 に口 /api/graph で取った 706 節点で試作を撃った値・点検の notes）は、~art:A（13）・~art:N（20）・~art:P（106）・~rule（27）・~srs:goal（4）・~srs:req（37）・~srs:nfr（3）・~srs:constraint（6）・~srs:actor（5）・~srs:output（4）・~adr（15）・epic 8 つ・~led:ruling（51）の 20 箱で、shown 20・folded 698・cut 0・total 706。t3-hub.52 と t3-hub.52~1-12 と走行 7 の t3-hub.13 を開くと 38 箱で、constitution・rules・SRS・ADR の帯が帯の箱に畳まれる。 形（口）。routes/graphview.rs の fn view は要求の query の open（Request の query は同じ鍵の最初の値を %XX と + を戻して返す）を open_list に通し（無ければ空の列）、board の新しい pub fn view_open（Texts 