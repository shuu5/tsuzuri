done = "(1) 面の mapview の compact の module（host でも組む）に pub fn zero_key（帯の Band を受け &'static str）が在り、SRS の帯は鍵 k:要件、pipeline の帯は鍵 run、ほかの 5 つの帯（constitution・rules・ADR・design-note・beads）は帯の鍵（Band の key の値）を返し、7 つの帯の値はどれも語の辞書（crate の vocab の vocab の term）に在る（歯 mtips_zero_keys） (2) compact の module に pub fn zero_card（Band を受け widgets の hover の Card の Option）が在り、SRS の帯では title が requirement 0 本・kind が requirement · SRS・value が ✓ 0 と測れた = 要件の行が無い・src が design-intent/srs.yaml・more が空の Card を、pipeline の帯では title が run 0 件・kind が run · pipeline・value が ✓ 0 と測れた = RunCreated が無い・src が …/fleet/events.jsonl・more が <state dir>/fleet/events.jsonl の 1 つだけの Card を返し、ほかの 5 つの帯では None を返す（歯 mtips_zero_cards） (3) compact.rs の字 mod dom { から後の字（wasm の target のときだけの mod dom）は、字 Cards::Empty => match zero_card(band) { と、class の値が empty で tabindex の値が 0 で use:attach=card を持つ div の開きの tag の直後に字 <span>{label(zero_key(band))}</span> が続く字と、class の値が empty だけの div の開きの tag の直後に同じ span の字が続く字を持ち、字 {label(band.key())} を持たない（歯 mtips_dom_text） (4) table.rs の字 mod dom { から後の字は、use:expert_tip=c.types_text() だけを持つ td の開きの tag の直後に pair_button に c と search と空の字を渡す呼び出しの字と td の閉じの tag が続く字を持ち、字 title= を持たない（歯 mtips_dom_text） (5) graph/dom.rs の字は、class の値が cutline num・tabindex の値が 0・data-term の値が cut で use:expert_tip=line を持ち中身が {count} の div の字と、字 let line = expert_line(&v); を持ち、字 expert_row と字 shows_internal を持たない（歯 mtips_dom_text） (6) 書く 4 つの file（compact.rs・table.rs・graph.rs・graph/dom.rs）の字を読む着地済みの面の歯は通る（歯 mapview_classes_and_keys_exist・ncard_dom_wiring・mlink_compact_tags_are_anchors・cgdom_wiring_text・btuck_vocab_keys・btuck_dom_wiring_text・gnav_chain_rows_are_anchors・gnav_dom_moved_out・mapgraph_path_and_no_new_dependency・frame_classes_are_in_stylesheet・frame_no_heading_words_in_code）"
goal = "在りか（main 456ad07・計画 surface-plan 第 0.56 版で確かめた・code は f21df41 と同じで、間の差はノートと計画と導出の toml だけ）。この行の書く file と、その字を読む着地済みの歯の file は main 0590728 と同じで、間の着地（c-pipe-ci）は語の辞書 vocab.json を書き、この行の使う鍵の語は変わらない。試作は 0590728 の写しと f21df41 の写しで撃った。 なぜ。要件 FR14 は hover の card を 4 行（1 行 36 字）と詳しくと決め、card を出す要素を頁を持つ節点の札・圧縮された cell・記号だけの要素に限り、経験者だけの内部の字は経験者の mode の注釈に置く。見本 mock v3（docs/design/mock3 の map.html）は 3 か所でそれを使う。(1) 圧縮の面の読めて 0 件の SRS の帯は、class empty と data-card srs0 と tabindex 0 の div に種類の語 requirement（鍵 k:要件）と数 0 を出し、pipeline の帯は data-card run0 の div に語 run と数 0 を出す。card srs0 と run0 は 4 行で、題 requirement 0 本・run 0 件、種類と帯の行、値の行 ✓ 0 と測れた = 要件の行が無い・RunCreated が無い、出所 design-intent/srs.yaml・fleet/events.jsonl。(2) グラフの数の行（class cutline num・data-term cut）は data-tip-expert に字 shown= と folded= と cut= と total= の 1 行を持つ。(3) 表の行列の数の button は data-tip-expert に辺の型の名を字 · でつないだ字を持つ。本番は、0 件の帯が帯の鍵の語（SRS・pipeline）と数 0 だけで card を持たず、グラフは数の行の下に経験者の mode のときだけ同じ 1 行を出す別の行を置き、表は数の button に title（browser の tip・mode によらず出る）で辺の型の名を出す。0 と測れたこと（読めて 0 件）を card で言うのは要件 NFR2 の読めないと 0 件の見分けを初心者にも見せるため。 在りか・compact.rs（write-set）。host の部分は Tag・Article・Lane・Cards（枝 Unmeasured・Empty・Tags・Articles・Lanes）・BandBox（欄 band・count・cards と fn class・ids）・pub fn tag・pub fn compact・非公開の band_box（読めた帯で節点が 0 なら Cards::Empty）と、use の crate の widgets の hover の Card と widgets の nodecard の node_card を持つ。wasm の target のときだけの mod dom の cards_view の Empty の枝は、class empty の div の中に帯の鍵の語（label に band.key() を渡した字）の span と、class num の b の数 0 を置く。mod dom は crate の widgets の hover の attach を use する。帯の Band（src/mapview/band.rs・書かない）の name は SRS と pipeline、path は design-intent/srs.yaml と <state dir>/fleet/events.jsonl。widgets の nodecard（書かない）の pub fn short_path は斜線の片が 3 つ以上なら字 …/ と末尾の 2 片にする（design-intent/srs.yaml はそのまま・pipeline の path は …/fleet/events.jsonl）。語の辞書（書かない）の鍵 k:要件 の語は requirement、鍵 run の語は run、鍵 b:SRS と b:pipeline の語は SRS と pipeline。 在りか・表とグラフ（write-set）。src/mapview/table.rs の mod dom の view は行列の数の在る cell を td の中の pair_button（c と search と空の class）で置き、幅の狭い画面の一覧（class items mxlist）の行は辺の型の名を字 code の要素で出してから同じ pair_button（class num）を置く。pair_button は数の button に data-pair と title=c.types_text() と押しの受け手を付ける。Cell の types_text は辺の型の名（edge_name）を字 · でつなぐ。src/mapview/graph/dom.rs の fn panel は、let line = expert_line(&v) の値を、数の行（class cutline num・tabindex 0・data-term cut・中身は count_line の字）の下の閉じ expert_row（shows_internal(mode()) が真のとき class small muted mono の div）で出し、use の widgets の help から HelpCtx・h2・shows_internal を引く。src/mapview/graph.rs（1094 行・着地済みの歯 gnav_dom_moved_out の上限 1150）の pub fn expert_line の doc は、経験者向けの 1 行（数の行の下）と書く。経験者だけの注釈の directive（src/widgets/help.rs の expert_tip・着地済みの行 g-tip-expert・書かない）は、要素に mouseenter と mouseleave の受け手を付け、経験者の mode で留めた注釈が無いときだけ字を出す。 形。(a) compact.rs の host の部分に pub fn zero_key と pub fn zero_card を足す（値は done (1) と (2)）。zero_card の title は zero_key の語と字 0 本（SRS）か 0 件（pipeline）、kind は語と字 · と帯の name、src は帯の path を short_path に通した字、more は path が src と違えば path の 1 つだけ（節点の card の node_card と同じ決め）。use に crate の vocab の label と nodecard の short_path を足す。(b) mod dom の Empty の枝は zero_card(band) で分け、Some なら tabindex 0 と use:attach=card を持つ div、None なら今の div にし、どちらも数の横の語を label(zero_key(band)) にする（mod dom の use に zero_card と zero_key を足す）。(c) table.rs は行列の数の cell の td に use:expert_tip=c.types_text() を付け、pair_button から title を外す（mod dom の use に expert_tip を足す）。(d) graph/dom.rs は数の行の div に use:expert_tip=line を付け、閉じ expert_row とその置き場を消し、use の shows_internal を expert_tip に替える。(e) graph.rs は expert_line の doc だけを、数の行の経験者だけの注釈（見本の data-tip-expert）の 1 行と書く（行の数は変わらない）。(f) compact.rs と table.rs の頭の doc に 1 行ずつ、0 件の SRS と pipeline の帯の card と、行列の数の cell の経験者の注釈を書く。doc の字と graph.rs の doc は歯で測らず、この行の差分で持つ。試作（main 0590728 と f21df41 の写し）で compact.rs は 357 から 394 行、table.rs は 201 から 205 行、graph/dom.rs は 536 から 532 行、graph.rs は 1094 行のまま、新しい歯 tests/mtips.rs は 110 行。git diff は 12620 byte（5 file・163 行足し 16 行消し）。 決めた幅（起草の決め）。(g) 見本の card の詳しくの行（要件書は雛形だけ・器の state dir は在る）は出さない。電文（GraphDoc）はその事実を持たず、面が測らない字を測れたように出さない（要件 NFR2）。詳しくは節点の card と同じく出所の全部の字だけにする。(h) 見本の class zrun は付けない（見本の ui.css と面の style.css のどちらにも規則が無い）。(i) card の種類の行は Card の欄が字なので、見本の帯の印と帯の名の chip を、語と字 · と帯の名の字にする（node_card の種類の行と同じ形）。値の行の ✓ は見本の印を字で書く。(j) 0 件の箱の数の横の語は見本どおり、SRS は種類の語（何が 0 本か）、pipeline は語 run（何が 0 件か）にする。ほかの 5 つの帯の 0 件の箱は見本に形が無いので、今の帯の鍵の語のまま card を付けない。tabindex 0 は card の在る箱だけに付ける（見本どおり）。(k) 行列の注釈は見本の button でなく td に付ける。pair_button は幅の狭い一覧と共有で、一覧は辺の型の名を字で出すので注釈が要らず、mouseenter は td の中の button の上でも届く。(l) 数の button の title を外す。title は mode によらず browser が出す tip で、経験者だけの注釈と同じ字が 2 度出る（見本の button は title を持たない）。(m) グラフの数の行の下の経験者の別の行を外す。見本に無く、同じ字を注釈が持つ（経験者の mode で数の行に指を置くと出る）。 着地済みの歯（grep で確かめ、試作で撃った・write-set の置き場だけの =）。mapview_classes_and_keys_exist は compact.rs・table.rs・graph.rs・graph/dom.rs の class の字と語の鍵が style.css と語の辞書に在ることを見る（この行は class empty と鍵 k:要件 と run だけを使い、どれも在る）。ncard_dom_wiring と mlink_compact_tags_are_anchors は compact.rs の札の a の字と card の字を見る（この行は札の字を変えない）。cgdom_wiring_text・btuck_vocab_keys・btuck_dom_wiring_text・gnav_chain_rows_are_anchors は graph/dom.rs と graph.rs の字を見る（この行は数の行の class と data-term と中身の字を変えない）。gnav_dom_moved_out は graph.rs の行数の上限を、mapgraph_path_and_no_new_dependency は graph.rs の字を見る（doc の 1 行だけで行数も字の決まりも変わらない）。frame_classes_are_in_stylesheet と frame_no_heading_words_in_code は src の class の字と、辞書の日本語の見出しの語を二重引用符で囲んだ字を見る（card の字はどの見出しの語とも同じでない）。widgets の help の歯 tipx_ は help.rs を読み、この行は help.rs を書かない。 測り方。新しい歯は面の crate の tests/mtips.rs に置き、名を mtips_ で始める（3 本・mtips_zero_cards・mtips_zero_keys・mtips_dom_text）。DOM は wasm の target のときだけ組むので、host の歯は zero_card と zero_key の値と、compact.rs と table.rs の字 mod dom { から後の字と graph/dom.rs の字を読む。新しい歯の名は main 456ad07 の contracts の verify の filter の語 241 のどれも部分の字として含まず、接頭辞 mtips_ もどの語にも含まれない。試作で verify の nextest の 9 行の歯 72 本が通り、host と wasm の target の clippy が通り、2 行を当てた写しで xtask の check（workspace の歯 1330 本と surface-build）が通った。噛み: 数の行の use:expert_tip を外すか、数の button に title を戻すか、行列の cell の use:expert_tip を外すか、0 件の箱の card の枝を外すか、数の行の下の経験者の行を戻すと mtips_dom_text が落ち、SRS の card の値の字を崩すか pipeline の card を無くすと mtips_zero_cards が落ち、pipeline の数の横の語を帯の鍵に戻すと mtips_zero_cards と mtips_zero_keys が落ちる（どれも名指した歯のほかは通る）。 依存と順。depends は空。計画の依存 g-tip-expert（便 t3-hub.52.34）と g-card-node（便 t3-hub.52.19）は着地済み。compact.rs は g-card-node（着地済み）の後にこの行、その後に同じノートの g-dn-group（compact.rs に design-note の帯のノートごとの枝を足す）。graph.rs と graph/dom.rs は g-graph-label と c-dn-edges（どちらも着地済み）の後にこの行。いま走る・待つ便と置いた行の書く file とは重ならない。置き場だけの = の重なりは、tests/frame.rs を c-pipe-ci とノート surface-wave18c の h-win-store・g-coach が、tests/ncard.rs を h-win-store・g-coach が = で持つ（= どうしなので器の交差の断りが同時に流さない）。 範囲の外。ほかの 5 つの帯の 0 件の card・見本の詳しくの行と class zrun・幅の狭い一覧の行・経験者だけの注釈の directive と語の辞書と style.css・expert_line と count_line の値・グラフの数の行の class と data-term。"

