s の腕を 1 つずつ足す（mapview は札の class と印の class を、ncard は check_tag を、Lanes の腕と同じ字で呼ぶ）。src と tests で Cards を match で分けるのはこの 2 つと compact.rs の ids と mod dom だけ（grep で確かめた）。 形。(a) host の部分に pub struct NoteGroup（derive は Debug・Clone・PartialEq・Eq・pub な欄 note の String と tags の Tag の Vec）と、Cards の枝 Notes(Vec<NoteGroup>) を足す。(b) ids に Notes の腕（組の順に組の札の id）を足し、band_box に design-note の帯の腕 Band::DesignNote => Cards::Notes(notes(doc, &mine)) を足す（節点が 0 の帯は今のまま Empty）。(c) pub fn note_of と非公開の fn notes を足す。notes は帯の節点のノートの名を natural で並べて重ねを除き、ノートごとに節点を (line が無いか, line) の順と、同じなら id の natural の順に並べて tag で札にする。(d) mod dom の cards_view に Notes の腕を足す。印は Lanes の腕と同じ format の shape、見出しは class subh の div の中に印の span・class mono のノートの名・class num muted の札の数、その後に札を tag_view で並べ、全体を class cards7 の div に入れる。(e) 頭の doc に、design-note はノートごとの見出しの下にノートの行の札を並べる 1 行を足す。doc の字は歯で測らず、この行の差分で持つ。試作（g-map-tips の試作の差分を当てた main の写し）で git diff は 11640 byte（4 file・216 行足し・消す行なし）で、新しい歯 tests/dngrp.rs は 146 行。 決めた幅（起草の決め）。(f) ノートの順は見本の字の順（sort）でなく natural の順にする（面のほかの帯の id と同じく、surface-wave9 を surface-wave10a の前に置く）。(g) ノートの中の順は見本どおり行の番号（file の中の順）にし、番号の無い行は後に id の natural の順で置く（索引が番号を持たない行でも順が決まる）。(h) 見出しのノートの名は字だけにする（ノートの頁は無いので link にしない）。見出しの数はそのノートの札の数で、箱の数（count）は帯の節点の数のまま。(i) 見出しの印は Lanes の腕と同じ帯の印（見本の TZ.shape の fill）。語の辞書と style.css は書かない（class subh・mono・num muted・cards7 は style.css に在る）。(j) 組の fixture の値は歯の中で fixture の設計ノートの行を写して id と題と line だけを替えて組む（電文の節点の欄を字で並べないので、後の行が GraphNode に欄を足しても歯を直さない）。 着地済みの歯。箱の ids を見る mapview_compact_bands_and_tags_in_order・mapview_every_tag_and_row_shows_id・mlink_hrefs_open_same_id は、fixture の設計ノートの行が 1 つのノートに在り id の自然な順が今と同じなので値が変わらない。mtips_dom_text・ncard_dom_wiring・mlink_compact_tags_are_anchors は compact.rs の 0 件の箱と札の字を読み、この行はその字を変えない（write-set の置き場だけの =）。frame_ は src の class の字を見る（足す class は style.css に在る）。 測り方。新しい歯は面の crate の tests/dngrp.rs に置き、名を dngrp_ で始める（4 本・dngrp_note_of・dngrp_fixture_one_note・dngrp_notes_natural_rows_by_line・dngrp_dom_text）。新しい歯の名は main 456ad07 の contracts の verify の filter の語 241 のどれも部分の字として含まず、接頭辞 dngrp_ もどの語にも含まれない。試作で verify の nextest の 6 行を含む面の歯 76 本（g-map-tips の verify の歯と合わせて）が通り、2 行を当てた写しで xtask の check が通った。噛み: design-note の帯を id の自然な順の札に戻すと dngrp_fixture_one_note と dngrp_notes_natural_rows_by_line が、ノートを字の順に並べるか、ノートの中を id の自然な順だけで並べるか、番号の無い行を先に並べると dngrp_notes_natural_rows_by_line が、ノートの名を最後の番号記号の前にすると dngrp_note_of が、見出しの数の span を外すと dngrp_dom_text が落ち、箱の ids から Notes の札を外すと dngrp_notes_natural_rows_by_line と mapview_compact_bands_and_tags_in_order と mapview_every_tag_and_row_shows_id が落ちる。 依存と順。depends は g-map-tips（同じノート・同じ compact.rs を書く）。計画の依存 c-dn-rows（便 t3-hub.52.86）は着地済み。この行の書く tests/ncard.rs は、ノート surface-wave18c の h-win-store と g-coach が置き場だけの = で持つので、この行と同時に流さない（この行は Cards の腕を 1 つ足すだけで、2 行の歯の期待の字は変わらないので、どちらが先でもよい）。tests/frame.rs は c-pipe-ci と h-win-store・g-coach も置き場だけの = で持つ（= どうし）。ほかの書く file は、いま走る・待つ便と置いた行の write-set と重ならない。 範囲の外。ノートの頁と見出しの link・ほかの帯の並べ方・語の辞書と style.css・電文と中核（行の番号の欄と組の木）。"
