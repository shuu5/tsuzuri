req = ["FR14"]
section = "3"
write-set = ["crates/tsuzuri-surface/src/mapview/compact.rs", "crates/tsuzuri-surface/src/mapview/table.rs", "crates/tsuzuri-surface/src/mapview/graph.rs", "crates/tsuzuri-surface/src/mapview/graph/dom.rs", "+crates/tsuzuri-surface/tests/mtips.rs", "=crates/tsuzuri-surface/tests/mapview.rs", "=crates/tsuzuri-surface/tests/ncard.rs", "=crates/tsuzuri-surface/tests/maplink.rs", "=crates/tsuzuri-surface/tests/cgdom.rs", "=crates/tsuzuri-surface/tests/btuck.rs", "=crates/tsuzuri-surface/tests/graphnav.rs", "=crates/tsuzuri-surface/tests/mapgraph.rs", "=crates/tsuzuri-surface/tests/frame.rs"]
