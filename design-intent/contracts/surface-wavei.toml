done = "(1) 境界の crate に新しい module stage（新しい file の src/stage/mod.rs・lib.rs に pub mod stage の 1 行）の子 module terminal（新しい file の src/stage/terminal.rs・target の cfg で囲まない host の code）が在り、pub const HEADER は字 [[device]]、pub const FACE は字 host.toml、pub const KEYS は 7 つの字 name・ssh・chrome・os・display・ime-env・profile-dir をこの順に持つ &str の配列、pub enum Os の pub const ALL は Linux・Macos・Windows をこの順に持ち、pub fn word はそれぞれ字 linux・macos・windows を返し、pub struct Terminal は節の 7 つの pub な欄を節の型で持ち（歯が struct の字で組む）、pub fn lookup は本文の &str と名の &str を受け Result の Terminal と String を、pub fn names は本文の &str を受け Vec の String を、pub fn read_face は state dir の &Path を受け Result の String と String を返す（歯が 3 つの fn を型を書いた fn の値に束ね、fixture の term-a の行の os を字 macos と字 windows に替えた本文の lookup の欄 os がそれぞれ Macos と Windows）（歯 stage_term_shape_and_words） (2) fixture の tests/fixtures/stage/terminals.toml の字は HEADER とちょうど同じ行を 2 つ持ち、lookup に fixture の字と名 term-a を渡すと節の term-a の Terminal（ime_env は 2 つの組をこの順）を、名 term-b を渡すと節の term-b の Terminal（display は None・ime_env は空）を Ok で返す（歯 stage_term_reads_fixture_rows） (3) names は fixture の字に字 term-a と字 term-b をこの順に持つ列を返し、fixture の字のうち最初の [[device]] の見出しの行より前の字（表 account-group の name が grp-a の行を持つ）と空の字には空の列を返す（歯 stage_term_names_in_order） (4) read_face は、作業場の dir の下に fixture の字を名 host.toml の file で書いた dir を渡すと fixture の字を Ok で返し、host.toml の無い dir を渡すと Err で、その dir に host.toml をつないだ path の字を含む（歯 stage_term_reads_face_file） (5) lookup は fixture の字と名 term-c では Err で字 term-c と字 term-a と字 term-b を含み、名 grp-a（fixture の表 account-group の name の値）と空の本文と名 term-a では Err で、fixture の後ろに name が term-a の 2 つ目の [[device]] の行を足した本文と名 term-a では Err で字 term-a を含む（歯 stage_term_unknown_or_twice_refused） (6) fixture の term-b の行から profile-dir の行を除いた本文では、名 term-b の lookup は Err で字 term-b と字 profile-dir を含み、名 term-a の lookup は節の term-a の Terminal を Ok で返す（歯 stage_term_profile_dir_required） (7) fixture の term-a の行の display の値を字 :1.0 と字 :12 に替えた本文の lookup は display がその字の Terminal を Ok で返し、値を字 wayland-1・字 :（コロンだけ）・字 :a・字 :0.（点で終わる）・字 0・字 host:0 に替えた本文ではどれも Err で字 term-a と字 display-env を含み、どの本文でも名 term-b の lookup は節の term-b の Terminal を Ok で返す（歯 stage_term_display_x_only） (8) fixture の term-a の行を節の表の 14 通りに直した本文では、名 term-a の lookup はどれも Err で、字 term-a と、表の名指しの字を角括弧 1 組で囲んだ字（例 字 [os]）を含み、KEYS の 7 つの字のうち表の名指しの字でないものを角括弧で囲んだ字はどれも含まない（歯 stage_term_value_forms_refused） (9) src/stage/terminal.rs の字は unsafe・std::env・std::process・std::net・print!・println! のどれも部分の字として含まない（歯 stage_term_pure_reader） (10) この行は Cargo.toml と Cargo.lock を書かず（どちらも write-set の外・依存を足さない）、着地済みの歯は全部通る（xtask の check が撃つ・節に値で書いた skeleton_boundary_std_only_and_bin_tz と brand_path_written_once_in_contract と tz の binary を撃つ歯を含む）（歯 skeleton_boundary_std_only_and_bin_tz と xtask の check） (11) tests/stterm.rs の test の属性の付いた fn の名はどれも stage_term_ で始まり、名から先頭の stage_term_ を除いた字は、節に並べた filter の語のどれも部分の字として含まない（歯 stage_term_own_names_clean が自分の file の字を読んで全部の名を見る）"
goal = "なぜ。要件 FR16 は、席が端末の一覧（器の宣言の行・名・ssh の宛先・Chrome の場所・画面の環境・入力の環境・専用の profile・OS）から端末の名で命令するとする。判断の記録 ADR-5 の決定 (2) は、端末の一覧を器の宣言（host の面）の行として持ち、端末の値を code に焼かない（条 N-7）とする。器（scribe2）は host の面（state dir の追跡されない host.toml）の表 [[device]] を着地させた（器の ADR-0076・器の設計 host-init.md の 15 節・器の要件 FR57）が、器は値を読んで形を守るだけで使わず、読み方は消費側が決める（host-init.md の 15 節の後続）。tsuzuri の境界の crate に表示面の module はまだ無い（src の下は acct.rs・accthb.rs・cli・hook・lib.rs・main.rs・server だけ・確かめた）。この行は、表示面の最初の部品として、host の面の本文から [[device]] の行を読み、端末の名で 1 行を引く純粋な関数を置く。起動の引数（行 i-2）・CDP の口（行 i-3）・落ちる先（行 i-4）・tz の口（行 i-5）はどれもこの関数の返す値を使う。傘の行 i（設計ノート surface-board の契約表）の done (4)（端末の値は code に無く器の宣言の行から読む）の読みの側にあたる。 持ち主の裁定 t3-hub.59.1（裁定 id = t3-hub.59.1:20260928T0120Z-1・逐語は問いの notes・席の読みは台帳 t3-hub.59 の notes）。表示先の PC は 1 台で始め、setup の skill か席との対話で最初に決め、設定としていつでも変えられ、2 つの board に設定の画面を置く（project ごとの切り替えと全部の一括）。席はこれを 2 つの層に分けた（判断の記録 ADR-15 の決定 (1)）。層 A はどの PC が在るか（器の host の面の [[device]]・この行が読む）、層 B はどの project をどの PC に出すか（tsuzuri 自前の追跡されない設定・後の行 i-7）。層 B の値は層 A の名だけを受け、設定の画面（後の行 i-8）と setup の skill（後の行 i-9）は層 A の名を選び肢に出すので、この行は名の列を返す names を pub で置く。器の席の答え（2026-09-28・台帳 t3-hub.59 の notes・器の memo s2-07l.727）は、層 A の書きの口を器に置く方向で、[[device]] を host 全体の 1 つの面へ移す案を推す（器の ADR-0076 の部分の置き換え・時期は board の設定の画面の波）。そこでこの行は、本文を受ける純粋な関数（lookup と names・歯の多くはこちらに向ける）と、file を読む薄い関数（read_face と FACE）を分け、置き場が移っても read_face と FACE だけを替えればすむ形にする。 器の答え（2026-09-28・器の席 scribe2 から・持ち主の決めの要らない技術の答え）。S2-1: tsuzuri は host の面の [[device]] を直に読む（中核の account の host.rs の読み手と同じ自前の読み方）。key の集合は閉じていて、必須は name・ssh・chrome・os、任意は display・ime-env・profile-dir。器は知らない key を持つ面を丸ごと断るので、tsuzuri は key を足さない。読む前に器の scribe2 validate --state-dir を撃って rc 0 を確かめるのは配線の行 i-5 の仕事で、この行は純粋な読みと引きだけ。S2-2: display は X の DISPLAY としてだけ読む。Wayland の端末は、器が欄 display-env を足すまで範囲の外（器の memo s2-07l.726）。X の形（コロンと数字、後ろに点と数字が続いてもよい）でない display の値は、display-env が無いことを理由に名指して断る。S2-3: tsuzuri が読むのは自分の anchor の state dir の host.toml だけで、tsuzuri の席は host.toml を書かない（read_face は渡された state dir の下の host.toml だけを読み、どの state dir を渡すかは行 i-5）。S2-4: profile-dir は器では任意のまま、表示面では無い行を断る（下の T4）。S2-5: スマホは [[device]] の外に置く（ssh の届かない端末へは board の URL を渡すだけで、席の目は server 側の headless の Chrome・後の行 i-4・持ち主の裁定 t3-hub.59.4（裁定 id = t3-hub.59.4:20260928T0123Z-1）・判断の記録 ADR-15 の決定 (5)）。 計画との合わせ。この行は計画 surface-plan（v0.9）の 4 節の行 i-1 と同じ file と大きさ M と依存なしで、境界の lib.rs は 5 節の鎖に拠る。表示面の見積り（席の作業場の i-scope の 6 節）が i を割り、器の答えで i-1 は持ち主の答えに依らず起草できた。持ち主の裁定 t3-hub.59.1〜.59.5 と .59.7 の後に、計画は層 B の設定・board の設定の画面・setup の skill・知らせの行を足し、配信の窓の行 i-6 を外した（この行の形は変わらず、names と read_face を足しただけ）。この行の大きさは見積りの S でなく M にした。器の受付は大きさを 1 file あたりの増えの見積（S は 100・M は 300）として読み、この行の読み手（新しい file の src/stage/terminal.rs）は下の形を全部持つと 100 を越える見込みだから（席の下書きで数えた）。歯は傘の行 i の write-set の 1 つの tests/stage.rs でなく、行ごとの file（この行は tests/stterm.rs）に置く（i の行どうしを直列にしないため）。傘の verify の filter の語 stage_ は、この行の歯の名の頭の stage_term_ の前の部分なので、傘の filter もこの行の歯を選ぶ（傘は器に流さない行）。 在りか（main 2f84856 で確かめた・起草の main 2bc9aa0 から、この行が書く file と下に値で書いた file と歯は変わっていない・その間に着地した行が境界の crate で書いたのは acct.rs と server の events.rs と歯の athr・wsteady・server_acct・server_read で、どれもこの行の file を読まない）。境界の crate の src/lib.rs は 12 行で、doc の 6 行（最初の行は crate の要約、続く 5 行は便と行ごとに置いた module を 1 行ずつ述べ、最後の行は行 f-stop の hook）と空の 1 行と pub mod の 5 行（acct・accthb・cli・hook・server をこの順）だけを持つ。境界の crate の src の下に stage は無く、tests/fixtures の下に stage は無い。境界の crate の Cargo.toml は [[bin]] の名 tz（path は src/main.rs）と [dependencies] の 2 つ（契約の型の crate の tsuzuri-contract と中核の crate の tsuzuri-core・どちらも path の依存）だけを持ち、dev-dependencies と build-dependencies と target ごとの節を持たない。xtask の src/main.rs の歯 skeleton_boundary_std_only_and_bin_tz（xtask の check の nextest が撃つ）は、この Cargo.toml を読み、[dependencies]・[dev-dependencies]・[build-dependencies] の鍵が workspace の 5 つの member の名（tsuzuri-contract・tsuzuri-core・tsuzuri-boundary・tsuzuri-surface・xtask）だけであることと、字 [target. を持たないことと、[dependencies] の鍵がちょうど tsuzuri-contract と tsuzuri-core をこの順に持つことと、[[bin]] の name が tz であることを見る（この行は Cargo.toml を書かないので直さずに通る）。先例の自前の読み手は中核の crate の src/account/host.rs の pub fn declaration（host.toml の字を受け、表 [[account]] の label と表 [[account-group]] の name・anchors・accounts だけを読み、TOML の部品を使わない・行ごとに前後の空白を除き、角括弧で始まる行で表を切り替え〔見出しは字 # より前の字で見る〕、ほかの行は最初の = で key と値に分ける）で、この行はこの読み方を倣うが、関数も型も使わず変えもしない（中核の host.rs は口座の board の材料で、端末の値は境界の中で閉じる）。 器の形（器 main 54a09fa の crates/scribe2/src/rules/device.rs と rules/manifest.rs で確かめた・器の歯あり）。器の読み手は host の面を行ごとに前後の空白を除いて読み、空の行と # で始まる行を飛ばし、角括弧で始まる行を表の見出しとして読み、見出しでない行は key と値を最初の = で分ける。値は引用符 1 組で囲んだ字（中の逃がしの字は解かずにそのまま読む）・整数・真偽・1 行で閉じた字の配列だけを受ける。表 [[device]] の 1 行の key は KEYS の 7 つだけで、知らない key・欠けた必須の欄・空の値・空白を含む name と ssh・3 語の外の os・形の外の ime-env（KEY は英大文字と数字と下線だけで先頭が数字でない・最初の = で分け VALUE は空でない・同じ KEY の 2 度）・同じ name の 2 行を、行番号つきで断り、面の全体を読めないとする（rc 1）。追跡される面に置いた表は断る（端末の値は host の面だけ・行 D-4 を器が機械で守る）。 形（境界・新しい module stage）。新しい file の src/stage/mod.rs は doc（表示面・要件 FR16・傘の行 i の子の行が file を足す）と pub mod terminal の 1 行。lib.rs に pub mod stage の 1 行（pub mod server の後）と doc の 1 行（行 i-1 で表示面の module stage を置く旨）を足し、ほかの行は変えない。子 module terminal（新しい file の src/stage/terminal.rs・target の cfg で囲まない host の code・引用符で囲んだ /api/ で始まる字を持たない）は次を持つ。pub const HEADER（&str・字 [[device]]）。pub const FACE（&str・字 host.toml・器の host の面の file の名）。pub const KEYS（[&str; 7]・字 name・ssh・chrome・os・display・ime-env・profile-dir の順・器の閉じた集合と同じ）。pub enum Os（変種 Linux・Macos・Windows・Debug・Clone・Copy・PartialEq・Eq）と、その pub const ALL（[Os; 3]・この順）と pub fn word（self を受け &'static str・字 linux・macos・windows）。起動の argv の組み分けは、この Os の値でだけ行う（行 i-2・条 N-7）。pub struct Terminal（Debug・Clone・PartialEq・Eq）は pub な欄 name（String）・ssh（String）・chrome（String）・os（Os）・display（Option の String）・ime_env（Vec の String と String の組・宣言の順）・profile_dir（String）の 7 つ。pub fn lookup（host_toml の &str と name の &str を受け Result の Terminal と String）と pub fn names（host_toml の &str を受け Vec の String）は file も子 process も環境変数も触らない。names は、本文の [[device]] の行のうち name の値が引用符 1 組で囲んだ字の行の、その字を宣言の順に（同じ名もそのまま）並べた列を返し、知らない名の Err が並べる在る名の列もこれと同じ（読み方は下の lookup の (a) から (c)）。pub fn read_face（state_dir の &Path を受け Result の String と String）は、state_dir に FACE をつないだ path の file を UTF-8 の字として読み、読めなければその path の字を含む Err を返す（file を読むのはこの関数だけ・中身は検めない）。 lookup の読み方。(a) 本文を行ごとに前後の空白を除いて読み、空の行と # で始まる行を飛ばす。(b) 角括弧で始まる行は表の見出しで、字が HEADER とちょうど同じなら [[device]] の 1 行を始め、ほかの見出しは別の表を始める（別の表の中の行と、最初の見出しより前の行は読まない）。(c) [[device]] の行の中の行は、最初の = の前後で key と値に分けて前後の空白を除く。(d) name の値が引用符 1 組で囲んだ引く名とちょうど同じ行が 1 つも無ければ、知らない名として Err（引いた名と、読めた全部の行の name の値を並べた字を含む）。2 つ以上なら同じ名が 2 つとして Err（名を含む）。(e) 引いた行だけを次の順で検める（ほかの行の形は見ない・面の全体の形は器の validate が持つ）。key が KEYS の外か = の無い行（その行の字を名指す）・同じ key の 2 度は Err。ime-env でない値は引用符 1 組で囲んだ空でない字（中に引用符を持たない・逃がしの字は解かずに器と同じくそのまま読むので Windows の path の逆向きの斜線も字のまま）で、ほかの形は Err。ssh・chrome・os が無ければ Err。ssh が空白を含むか字 - で始まれば Err（ssh の旗と読まれないため・器より狭い）。os が Os の ALL の word のどれでもなければ Err。display が在って X の画面の形（字 : の後に 10 進の数字が 1 つ以上、その後に字 . と 10 進の数字が 1 つ以上続いてもよい・ほかの字を持たない）でなければ、字 display-env を含む Err（Wayland の画面の環境は器の欄 display-env を待つ・S2-2）。profile-dir が無ければ、字 profile-dir を含む Err（T4）。ime-env は 1 行で閉じた角括弧の中のコンマで分けた引用符 1 組の字の列で、各要素を最初の = で KEY と VALUE に分け、KEY が英大文字と数字と下線だけで先頭が数字でなく空でなく、VALUE が空でないこと（器と同じ）を見て、外れれば Err（KEY は起動の env の名になるので、遠くの shell に渡す前に形を閉じる）。空の配列は空の列。(f) Ok の Terminal は、name が引いた名、display が無ければ None、ime-env が無ければ空の列。Err の字は、引いた端末の名と、断った key の名を角括弧 1 組で囲んだ字（例 字 [os]・知らない key は その key の字を、= の無い行はその行の字を囲む）を含む 1 行で、KEYS のうち断った key でない key の名を角括弧で囲んだ字を含まない（裸の短い key の名は添え書きの字に紛れる・字 host は字 os を含む・字の残りは歯が見ない・次の 1 手〔器の host の面の行を直す〕を添える形を推す・条 P-7.3）。コンマを含む ime-env の要素の読みと、表の見出しの行の後ろの注釈の読みは歯が見ない。 T4 と N-3。profile-dir の無い行に既定の dir を補わない（Chrome 136 からは既定の profile で remote debugging の口が開かない・Chrome の公開の告知・この server では確かめていない。黙って補えば条 N-3 の抜け道になる）。tz stage は端末の値を上書きする旗を持たず（行 i-5）、値の出所はこの行の lookup だけにする。host の名を見て分けることもしない（条 N-7）。 節の字（fixture・新しい file の tests/fixtures/stage/terminals.toml・名も宛先も path も偽物で、どの host の値でもない・行 D-4）。字は次の順の行。注釈の行（偽の端末の fixture である旨）、schema = 1、空の行、見出し [[account-group]]、name = grp-a（値は引用符で囲む・以下同じ）、空の行、見出し [[device]]、name = term-a、ssh = me@term-a、chrome = /fake/bin/chro