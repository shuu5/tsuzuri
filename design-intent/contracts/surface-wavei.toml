goal = "なぜ。要件 FR16 は、席が端末の Chrome を起こし、CDP を tunnel で引いて navigate・viewport・reload・click・入力・key・scroll・待ちと、screenshot・DOM・console を行うとし、受入 AC13 は偽の ssh と偽の Chrome で CDP の命令の列が snapshot と一致することを見るとする。判断の記録 ADR-5 の決定 (1) も同じ命令と席の目を端末の Chrome に対して行う。CDP は Chrome の remote debugging の口の websocket の上の JSON の message で、境界の crate には websocket の client も JSON の値を読む手も無い（確かめた・下の在りか）。この行は、表示面の CDP の口として、websocket の client の側と、命令の語彙を CDP の method の列に写す純粋な関数と、列を撃って応答を待つ session を置く。起動の引数と tunnel（行 i-2）・落ちる先（行 i-4）・tz の口（行 i-5）はこの session を使う。傘の行 i（設計ノート surface-board の契約表）の done (2)（CDP の命令の列が snapshot と一致）にあたる。 決定はしご（条 P-27）。要るか: 要る（CDP は websocket の上にだけ在る）。既に在るか: 無い。試作（repo の外の作業場の stage-server）は外の部品の tungstenite と serde を使い、Chrome の起動は unsafe の extern を呼ぶので、code は持ち込まず、試作で動いた命令と method の対応だけを参照にした。CDP の応答の型を契約の型の crate に置いて wire の decode で読む案は、契約の型の crate を面と server の電文の置き場に保つためと、event は Chrome が送る形の決まらない object で型に閉じられないため採らない。標準 library と入っている依存で足りるか: 足りる。境界の crate は標準 library と workspace の 2 つの crate だけ（xtask の歯 skeleton_boundary_std_only_and_bin_tz）で、websocket の client の側は unix socket・std の RandomState・SHA-1 と base64 の小さな手書きで書ける（HTTP と SSE も自前で書いた先例がある・境界の server の http.rs）。外の部品を足さないので、条 A-3 の持ち主の確認も規則の行 R-2 の予算も要らない。 計画との合わせ（この行は計画 surface-plan〔v0.9〕の 4 節の行 i-3 と同じ file と大きさ M と依存）。見積り（i-scope の 6 節）の i-3 の file は stage の cdp.rs と ws.rs で、依存は無しだった。起草で file に新しい src/stage/json.rs を足し、計画 v0.9 はそれを写した。JSON の読み書きを cdp.rs に入れると cdp.rs が大きさ M の 1 file の見積り（300）を越える見込み（席の下書きで数えた）で、同じ読みを後の行 i-2（Chrome の /json/version と /json/list の応答）と i-5（写真・DOM・console の応答）も使うから。依存は行 i-1（同じノート）にした。この行は i-1 が置く src/stage/mod.rs に pub mod の 3 行を足すので、i-1 の後に流す。歯は行ごとの file の tests/stcdp.rs に置く。 在りか（main 2f84856 と、行 i-1 の着地の後の形で確かめた・起草の main 2bc9aa0 から、この行が読む file と下に値で書いた file と歯は変わっていない）。行 i-1 の着地の後、境界の crate の src/lib.rs は pub mod の 6 行（acct・accthb・cli・hook・server・stage をこの順）と doc の行を持ち、src/stage/mod.rs は行 i-1 が置いた doc と pub mod terminal の 1 行だけを持つ（i-1 の節・この行の歯はどちらの字も読まない）。境界の crate の Cargo.toml は [[bin]] の名 tz（path は src/main.rs）と [dependencies] の 2 つ（契約の型の crate の tsuzuri-contract と中核の crate の tsuzuri-core・どちらも path の依存）だけを持ち、dev-dependencies と build-dependencies と target ごとの節を持たない。xtask の src/main.rs の歯 skeleton_boundary_std_only_and_bin_tz（xtask の check の nextest が撃つ）は、この Cargo.toml を読み、[dependencies]・[dev-dependencies]・[build-dependencies] の鍵が workspace の 5 つの member の名（tsuzuri-contract・tsuzuri-core・tsuzuri-boundary・tsuzuri-surface・xtask）だけであることと、字 [target. を持たないことと、[dependencies] の鍵がちょうど tsuzuri-contract と tsuzuri-core をこの順に持つことと、[[bin]] の name が tz であることを見る（この行は Cargo.toml を書かないので直さずに通る）。境界の crate は serde に直に依存しないので、JSON の型を derive できない。契約の型の crate の wire（pub fn encode と decode・serde_json の Error の再公開）は serde の Serialize と Deserialize の型にしか使えず、JSON の値の汎用の型（serde_json の Value）を公開しない（確かめた）。境界の server の http.rs は受ける側の HTTP（read_request と Response）だけで、websocket の握手の応答を読む client の側は無い。境界の crate の src に UnixStream と RandomState を使う所はまだ無い。 形（境界・module stage の 3 つの新しい子 module・どれも target の cfg で囲まない host の code・引用符で囲んだ /api/ で始まる字を持たない・unsafe を持たない〔行 R-10〕）。stage の mod.rs に pub mod cdp・pub mod json・pub mod ws の 3 行（名の順・pub mod terminal と並べる）と doc の 1 行（行 i-3 で CDP の口を置く旨）を足し、ほかは変えない。 子 module ws（websocket の client の側・RFC 6455）。pub const GUID（&str・字 258EAFA5-E914-47DA-95CA-C5AB0DC85B11・RFC 6455 の 1.3 節）。pub const MAX_MESSAGE（usize・67108864＝64 MiB・1 つの字の message の上限・写真の base64 の字を受ける）。pub fn accept（鍵の &str を受け String・鍵と GUID をつないだ字の SHA-1 の 20 byte の base64〔字 = の詰めを付ける〕）。pub struct Socket（欄は外に見せない）。pub fn connect（Socket の関連関数・unix socket の &Path と resource の &str と timeout の Duration を受け Result の Socket と String）は、std の os の unix の net の UnixStream で path に繋ぎ、読みと書きの上限を timeout にし、16 byte の乱れた値（std の collections の hash_map の RandomState の新しい値の hasher の finish の値の 8 byte を 2 回）の base64 を鍵にして、頭を次の順の行で送る。字 GET と空白と resource と空白と HTTP/1.1、Host 欄 localhost、Upgrade 欄 websocket、Connection 欄 Upgrade、Sec-WebSocket-Key 欄 鍵、Sec-WebSocket-Version 欄 13、空の行（行の区切りは CR と LF）。Origin の欄と拡張と subprotocol の欄は付けない（Chrome 111 からは、許していない Origin の欄を持つ websocket の握手を断り、Origin の欄の無い握手は受ける・Host の欄は IP か localhost だけを受ける・どちらも Chrome の公開の告知で、この server では確かめていない）。応答の頭は CR と LF の 2 組の並びまで読み（上限は 8 KiB ほど・越えれば Err・頭の後に続けて届いた byte は捨てずに最初の frame の読みに使う〔1 byte ずつ読むか、読み過ぎた byte を持ち越す〕・server は握手の応答の直後に frame を送ってよく、歯の偽の server もそう送る）、状態の行の 2 つ目の語が 101 で、名が Sec-WebSocket-Accept（大文字と小文字を区別しない）の欄の値が accept に鍵を渡した字と同じときだけ Ok。繋げない・書けない・読めない・状態が 101 でない・応答の鍵が無いか違うは Err。pub fn send（&mut self と字の &str を受け Result の unit と String）は、字を 1 つの frame（FIN の bit と opcode 1）で送る。frame は MASK の bit を立て、長さは 125 以下なら 7 bit、65535 以下なら印 126 と 2 byte、ほかは印 127 と 8 byte（どれも big endian の最も短い形）、その後に 4 byte の mask の鍵（frame ごとに RandomState の新しい値から取る）、その後に鍵で xor した payload。pub fn recv（&mut self を受け Result の Option の String と String）は、次の字の message を読む。opcode 1 の frame で始まり、FIN の無い間は opcode 0 の frame をつなぎ、FIN の在る frame で UTF-8 の字にして Some で返す。ping（opcode 9）には同じ payload の pong（opcode 10・mask つき）を返して読み続け、pong は読み捨てる。close（opcode 8）を受けたら、自分がまだ close を送っていなければ受けた payload の最初の 2 byte（状態の code）の close を返して None の Ok を返す。次のどれかは Err。server の frame の MASK の bit・RSV の 3 つの bit のどれか・opcode 2（binary）とほかの知らない opcode・字の message の途中の opcode 1・前の字の無い opcode 0・長さの頭が示す長さと既に読んだ長さの和が MAX_MESSAGE を越える（payload を読む前に断る）・UTF-8 でない字・読みの上限の時間切れと接続の終わり。pub fn close（self を受け Result の unit と String）は、payload が状態の code 1000 の 2 byte（3 と 232）の close を mask つきで送り、相手の close か接続の終わりか誤りまで読んでから Ok を返す（送れなければ Err）。 子 module json（表示面の小さな JSON の読み書き・境界の crate は serde に直に依存しないので std だけで書く）。pub fn escape（&str を受け String）は、字を引用符で囲んだ JSON の字にし、中の引用符は逆斜線と引用符に、逆斜線は逆斜線 2 つに、改行・復帰・水平タブは逆斜線と n・r・t に、ほかの U+0020 より前の字は逆斜線と u と小文字の 4 桁の 16 進にし、ほかの字はそのまま置く。pub fn member（object の &str と key の &str を受け Option の &str・返りの寿命は object と同じ）は、JSON の object の字の一番上の段の鍵が key と同じ組の値の字（前後の空白を除いた字・字の値は引用符ごと・object と配列の値は括弧ごと）を返し、入れ子の値の中の鍵と、字の値の中の字は鍵と見ない。object でない字・鍵の無い字・形の読めない字は None。pub fn unquote（&str を受け Option の String）は、JSON の字の値を字に戻す（逃がしは引用符・逆斜線・斜線・b・f・n・r・t と、u と 4 桁の 16 進〔U+D800 から U+DBFF の後の逆斜線と u と U+DC00 から U+DFFF は 2 つで 1 字〕だけ）。字の値でない字・ほかの逃がし・対の欠けた代理の値は None。 子 module cdp（CDP の口と命令の列）。pub const DOM_EXPRESSION（&str・字 document.documentElement.outerHTML・評価する唯一の式）。pub const LOAD_EVENT（&str・字 Page.loadEventFired）。pub enum Command（Debug・Clone・PartialEq・Eq）は変種 Navigate（欄 url の String）・Viewport（欄 width と height の u32・scale の u32・mobile の bool）・Reload・Click（欄 x と y の u32）・Type（欄 text の String）・Key（欄 key の String）・Scroll（欄 x と y の u32・dy の i32）・Wait（欄 ms の u64）・Screenshot・Dom・Console の 11 で（欄を持つ変種は名の在る欄の形、Reload・Screenshot・Dom・Console は欄の無い変種）、要件 FR16 の navigate・viewport・reload・click・入力・key・scroll・待ち・screenshot・DOM・console にこの順で対応する。どの変種も式や method の名を運ぶ欄を持たず、Command に non_exhaustive の属性を付けない（歯は wildcard の腕の無い match で 11 の変種を数え上げるので、変種を足す行は歯の file を直すことになる）。pub enum Step（Debug・Clone・PartialEq・Eq）は変種 Call（欄 method の &'static str と params の String・params は JSON の object の字）・Await（名の無い 1 つの欄の &'static str・待つ event の method の名）・Pause（名の無い 1 つの欄の Duration）で、Call は名の在る欄の形、Await と Pause は tuple の形。pub fn steps（&Command を受け Vec の Step）は下の命令の表の列を返す純粋な関数。pub fn message（id の u64・method の &str・params の &str を受け String）は、鍵 id（10 進の数）・method（引用符で囲んだ method の字）・params（params の字そのまま）をこの順に、鍵と値をコロンで、組どうしをコンマでつなぎ、空白を挟まずに波括弧で囲んだ字を返す。pub struct Session（欄は外に見せない）。pub fn open（Session の関連関数・&Path と resource の &str と timeout の Duration を受け Result の Session と String）は Socket の connect で繋ぐ。pub fn run（&mut self と &Command を受け Result の Vec の String と String）は steps の歩を順に行い、Call の歩の応答の字を順に返す。Call は、session の中で 1 から 1 ずつ増える id で message を send し、recv で読んだ字のうち一番上の段に鍵 id の無い字を event として受けた順に貯め、鍵 id の値がその id と同じ字を応答とする（応答が鍵 error を持てば、method の名とその error の鍵 message の値を unquote した字を含む Err）。ほかの id の応答・相手の close・読みの誤りと時間切れは、method の名を含む Err。Await は、その run が始まってから貯めた event のうち一番上の段の鍵 method の値を unquote した字が待つ名と同じ字が在るまで recv で読み進め（読んだ字は event として貯める）、Await を始めてから timeout を越えれば（その間に届いた別の event では延びない）待つ名を含む Err。Pause はその間だけ眠る（CDP を撃たない）。どの歩の Err でも、その後の歩は撃たずに