done = "(1) 面の account の home の module（host でも組む）の pub struct NxRow に欄 card（widgets の hover の Card）が在り、pub fn nx_row の引数は電文の &ProjectRow と電文の at の EpochSecs の 2 つで、card は account の projects の nx_card にその行と at を渡した値、ほかの欄（project・group・lead・key・line・marks・class）は今の値のまま、next_all は電文の at を nx_row に渡し、fixture の acct-doc.json の電文を home の home に渡した next の 3 行（proj-a・proj-b・proj-c の順）の card は、名が同じ電文の projects の行を nx_card に電文の at と渡した値と等しく、projects の row_cards に電文とその行を渡した値の need とも等しく、proj-a の card の title は proj-a · (e) 質問・kind は 各 project の次の一手 · e・value は proj-a.7 · 1 件、proj-b の title は proj-b · 測れていない・kind は 各 project の次の一手 · ―・value は ―（歯 hcnx_rows_carry_cards） (2) pub struct Member に欄 card（Card の Option）が在り、pub fn group_view の引数は &GroupCard と口座の列の &[AccountRow] の Option と電文の &AccountDoc の 3 つ（session の列と移動の列と at は電文の欄から取る）で、Member の card は電文の projects に名が member の project と同じ行が在ればその最初の行と電文を account の projects の gproj_card に渡した値の Some、無ければ None で、fixture の電文の home の groups の Tier1 の members の card は、proj-a が title proj-a-orch・kind ✓ 今の口座で動いている・value 登録 acct-1 = 群 acct-1・more 動いている の 1 行、proj-c が title proj-c・kind session なし・value Tier1 の今の口座 acct-1・空の more、Tier2 の proj-b が title proj-b-orch・kind ! 移動待ち・value 登録 acct-1 ≠ 群 acct-2・more 待っている の 1 行で、どれも gproj_card に電文と同じ名の行を渡した値と等しく、電文の projects から proj-c の行を除くと Tier1 の proj-c の card は None で proj-a の card は変わらず、GroupView のほかの欄と Member の project と sign は今の値のまま（歯 hcnx_member_cards） (3) home.rs の字 mod dom { より後に、fn nx_row_view の本体で字 <div class=r.class から最初の > までの tag が tabindex と等号と引用符で囲んだ 0 と字 use:attach= を含み、fn group_card の本体で字 <span class= と引用符で囲んだ pchip で始まる tag（最初の > まで）が 1 つ以上在ってどれも tabindex の 0 と字 use:attach_some= を含み、mod dom に private の fn attach_some（引数は el の web_sys::Element と card の Card の Option・返りは無し）が在ってその本体を空白を除いた字に attach(el,card) が在り、mod dom の use に crate::widgets::hover の attach と Card が在る（歯 hcnx_dom_wiring が home.rs の字を読む・DOM が組めることは xtask の surface-build で見る） (4) 着地済みの tests/accthome.rs は、home::nx_row の呼びの全部に 2 つ目の引数として fixture の電文の at を足す直しだけを受け、accthome_ の歯の期待の値は変えずに全部通る（歯 accthome_next_row_line_and_marks・accthome_next_all_on_fixture・accthome_groups_on_fixture・accthome_no_pressure_marks・accthome_vocab_css_deps_and_frame） (5) 着地済みの歯は write-set の外の file を直さずに全部通り（xtask の check と surface-build・hcard_ の歯の全部を含む）、home.rs に足す字は語 hot・spark・measured_at・c-occ・remaining・refused と字 cap を二重の引用符で囲んだ字を含まず、引用符で囲んだ class の字を足さず、Cargo.toml・vocab.json・style.css・fixture・account の projects.rs と board.rs は触らない（歯 hcard_dom_wiring と accthome_no_pressure_marks） (6) tests/hcnx.rs の test の属性の付いた fn の名はどれも hcnx_ で始まり、名から先頭の hcnx_ を除いた字は、節に並べた filter の語のどれも部分の字として含まない（歯 hcnx_names_clean が自分の file の字を読んで全部の名を見る）"
goal = "なぜ。見本の account board の HOME（docs/design/mock3/account/index.html の render の home の枝）は、次の一手の並びの各行（class nxrow の div）に data-card の鍵 nx と tabindex の 0 を付け、群の枠（class gcard の section）の project の chip（class pchip の span）に鍵 gproj と tabindex の 0 を付ける。card の中身は window.__tz_card の nx の枝（各 project の表の要対応の欄と同じ枝・題と当たりの種の字と 1 行と出所と 6 種の結果）と gproj の枝（各 project の表の口座の欄と同じ枝・席の口座と群の今の口座の一致・席の無い project は群の今の口座だけ）。見本は群の枠そのものには card を出さない（枠が中身を全部見せる・見本の注記）。本番の HOME（便 h-home と h-cards-home・src/account/home.rs）は口座の名の欄と移動の行にだけ card を持ち、次の一手の行と project の chip は card を持たない（main c8236de で確かめた）。要件 FR14 は hover の card を 4 行（1 行 36 字）と詳しくと決め、圧縮された cell に card を出す。次の一手の行は project の 7 種の判じを 1 行と 6 つの印に縮めた cell、project の chip は席の口座と群の今の口座の一致を印 1 つに縮めた cell で、どちらも見本（判断の記録 ADR-7 で確定）が card を付ける要素。計画 surface-plan の 4 節の行 h-cards-nx（依存 h-cards-proj・着地済み）で、組み手は着地済みの projects.rs の nx_card と gproj_card（下の組み手の段に字と値で書いた）を使い、群の枠の chip には gproj_card を席の有無に依らず使う。 在りか（main c8236de で確かめた）。src/account/home.rs は account の mod.rs の pub mod home で host でも組む（着地済みの accthome と hcard の歯が tsuzuri_surface の account の home の path で使う）。host の部分: pub struct NxRow（欄 project・group は String・lead は NextMove の Option・key は &'static str・line は String・marks は NxMark の Vec・class は &'static str・derive は Debug・Clone・PartialEq・Eq）と pub fn nx_row（今の引数は &ProjectRow だけ）と pub fn next_all（&AccountDoc を受け、lead の 7 種の順に並べて nx_row で組む）。pub struct Member（欄 project は String・sign は project の seat の Sign・derive は Debug・Clone・PartialEq・Eq）と pub struct GroupView（欄 name・account・recorded・since・previous・pressure・members・candidates・next_account・next・limited・more）と pub fn group_view（今の引数は &GroupCard・口座の列の Option・&[SessionLine]・移動の &Reading の MoveRow の Vec・at の EpochSecs）は、members を GroupCard の members の順に project と matches から組んだ印で組む。group_view を呼ぶ所は面の src と tests で home.rs の pub fn home だけで（session.rs と projects.rs の group_view は別の module の別の関数・grep で確かめた）、home は groups が Known なら各 GroupCard を group_view に口座の列と電文の sessions・moves・at と渡す。NxRow と Member と GroupView を struct の字で組む所は home.rs の nx_row と group_view だけ（tests に無い・grep で確かめた）。nx_row を呼ぶのは next_all と着地済みの tests/accthome.rs の歯 accthome_next_row_line_and_marks の 3 か所だけ。host の部分の use は契約の型の EpochSecs と account の AccountDoc・AccountRow・GroupCard・MoveRow・ProjectRow・SessionLine、board の NextMove と Reading、seat の QuotaUsed と SeatState、stats の CheckResult と NextStep、crate の frame の Block・project の Body・project の next の big と key・project の seat の NG・OK・Sign・WINDOWS・WindowRow・hmd・short・window_row・view の Fetched・vocab の label・widgets の hover の Card。wasm の target のときだけの mod dom は、use に leptos の prelude の全部・契約の account の ProjectRow・super の定数と型と content・account の windows の NOT_YET_KEY・button_text・open・open_url・account の PATH と doc・frame の Block と Mode・project の seat の WindowRow・crate::project の Body・UNKNOWN・body_view・section・state_icon・unmeasured・vocab の label・widgets の help の HelpCtx・h2・hs・shows_internal・widgets の hover の attach を持つ。fn next_view は net の read に PATH を渡した読みから電文の projects の memo と Home の memo を組み、行ごとに名の同じ ProjectRow を探して fn nx_row_view（引数は NxRow と ProjectRow の Option と mode の signal の Option）に渡す。nx_row_view の外の要素の字は今 <div class=r.class> で属性を持たない。fn groups_view は群ごとに fn group_card（引数は GroupView と mode の signal の Option）を呼び、group_card は members ごとに <span class=引用符で囲んだ pchip> の span（中に印の span と data-t の span に名）を組み、属性を持たない。口座の名の欄（fn acct_row_view の class c-name の div）と移動の行（fn mv_li の li）は tabindex の 0 と use:attach= を持つ（着地済み・この行は変えない）。 hover の card（src/widgets/hover.rs・widgets の mod.rs の pub mod hover で host でも組む・この行は書かない）の pub struct Card は欄 title・kind・value・src（String）と more（String の Vec）を持ち、derive は Debug・Clone・PartialEq・Eq・Default。wasm の target のときだけの pub fn attach（引数は web_sys の Element と Card・返りは無し）は hover.rs の mod dom に在り、hover.rs が wasm の target のときだけ pub use で crate::widgets::hover の名として出す。block は view の要素に use:attach と等号と Card の値を書いて付ける（着地済みの home.rs の口座の名の欄と移動の行、projects.rs の 5 つの欄が前例）。account board の頁（src/account/board.rs の App・wasm のときだけ・この行は書かない）は provide_context(HoverCtx::default()) を呼び view の末尾に <CardLayer/> を置き、tab の block の view はその中で組まれる。 組み手（着地済みの行 h-cards-proj〔t3-hub.53.15・main 550176b〕が足した物・src/account/projects.rs・account の mod.rs の pub mod projects で host でも組み、結合試験から tsuzuri_surface の account の projects の path で use で引ける・この行は書かない・main c8236de で確かめた）。pub const NX_SRC（&str・字 中核の next_step_seat）・pub const NX_MISS（&str・字 なし）・pub const GPROJ_SRC（&str・字 doctor の席の行と群の今の記録）。 pub fn nx_card(project: &ProjectRow, at: EpochSecs) -> Card は Card の 5 つの欄を全部埋める。title は、電文の next が Known なら名と字 · と字 ( と lead の語の鍵（nx_a から nx_g）の末尾の 1 字と字 ) と空白と語の鍵の語、Unknown なら名と字 · と語の鍵 st_unknown の語。kind は語の鍵 next_all の語と字 · と、a から f の 6 種（NextMove の ALL から Nothing を除いた順）のうち next の checks の結果が Hit の種の末尾の 1 字と、lead が Nothing なら字 g を、空白でつないだ字（1 つも無ければ ―）。value は lead とその種の check を project の next の module の pub fn big に渡した値の what（Unknown なら ―）。src は NX_SRC と字 · ◷ と project の seat の pub fn hm に at を渡した字。more は 6 種の順に 1 行ずつ、字 ( と末尾の 1 字と字 ) と空白と語と空白と、結果が Hit なら字 · と big の what、Miss なら NX_MISS、NotJudged か check が無い（next が Unknown を含む）なら ―。big の what は、Question の種なら check の target と字 · と count と字 件（target が無ければ count と字 件）。 pub fn gproj_card(doc: &AccountDoc, project: &ProjectRow) -> Card も 5 つの欄を全部埋める。今の口座は行の group を pub fn current（電文の groups の中で row の group が同じ GroupCard の row の account・groups が Unknown か群が無ければ None）に渡した値。seat が Known の席の card c なら、印は pub fn acc の mark（c の account と今の口座が両方在れば、同じなら project の seat の pub const OK〔glyph ✓〕・違えば pub const NG〔glyph !〕・どちらか無ければ None）で、title は c の target、kind は OK なら glyph と空白と語の鍵 seat_match の語・NG なら glyph と空白と seat_mismatch の語・None なら st_unknown の語、value は字 登録 と空白と c の account（無ければ ?）と空白と、OK なら字 =・NG なら字 ≠・None なら ? と空白と字 群 と空白と今の口座（無ければ ?）、src は GPROJ_SRC、more は c の状態の語（crate::project の state_key に project の seat の state_value を渡した鍵の語）の 1 行。seat が Unknown なら title は名、kind は語の鍵 seat_none の語、value は群の名（無ければ ―）と字 の今の口座 と空白と今の口座（無ければ ?）、src は GPROJ_SRC、more は空。 pub struct RowCards（pub な欄 need・led・runs は Card・orch と acc は Card の Option・derive は Debug・Clone・PartialEq・Eq）と pub fn row_cards(doc: &AccountDoc, project: &ProjectRow) -> RowCards の need は nx_card に行と電文の at を渡した値。projects.rs は host の部分で super の home の group_more を use している（home と projects が互いの pub の関数を使うのは今もそう）。 語の辞書（crates/tsuzuri-surface/vocab.json・書かない・確かめた）の語は、next_all が 各 project の次の一手・nx_a が 限度 / 移動・nx_b が 応答なし・nx_c が 止まっている run・nx_d が 束の承認・nx_e が 質問・nx_f が 発効待ち・st_unknown が 測れていない・seat_match が 今の口座で動いている・seat_mismatch が 移動待ち・seat_none が session なし・st_run が 動いている・st_wait が 待っている。 fixture の値（tests/fixtures/account/acct-doc.json・書かない・確かめた）。電文の at は 1790510400。projects の proj-a は group Tier1・seat Known（target proj-a-orch・state run・account acct-1）・next Known（lead question・checks は limit-or-move と unresponsive と stalled-run と nothing が miss、batch-approval と awaiting-effect が not-judged、question が hit で count 1 と target proj-a.7）。proj-b は group Tier2・seat Known（target proj-b-orch・state wait・account acct-1）・next Unknown。proj-c は group Tier1・seat Unknown・next Unknown。groups は Known で、Tier1 の row の account は acct-1・members は proj-a と proj-c、Tier2 の row の account は acct-2・members は proj-b。 この fixture で組み手が返す値（main の code と辞書から数えた）。nx_card の proj-a は title proj-a · (e) 質問・kind 各 project の次の一手 · e・value proj-a.7 · 1 件・more は (a) 限度 / 移動 なし・(b) 応答なし なし・(c) 止まっている run なし・(d) 束の承認 ―・(e) 質問 · proj-a.7 · 1 件・(f) 発効待ち ― の 6 行。proj-b は title proj-b · 測れていない・kind 各 project の次の一手 · ―・value ―・more は末尾がどれも ― の 6 行（proj-c も同じ形で名だけ違う）。gproj_card の proj-a は title proj-a-orch・kind ✓ 今の口座で動いている・value 登録 acct-1 = 群 acct-1・src doctor の席の行と群の今の記録・more 動いている の 1 行（席の口座 acct-1 と Tier1 の今の口座 acct-1 が同じ）、proj-b は title proj-b-orch・kind ! 移動待ち・value 登録 acct-1 ≠ 群 acct-2・more 待っている の 1 行（席の口座 acct-1 と Tier2 の今の口座 acct-2 が違う）、proj-c は title proj-c・kind session なし・value Tier1 の今の口座 acct-1・more は空。どの card の 4 行も 36 字以下。 電文（crates/tsuzuri-contract・この行は書かない）。AccountDoc（derive は Debug・Clone・PartialEq・Serialize・Deserialize）の pub な欄は at・accounts・caps・groups・moves・notices・projects・sessions・dormant。ProjectRow の欄 name・group（String の Option）・seat（Reading の SeatCard）・next（Reading の NextStep）ほか。GroupCard の欄 row（GroupRow・欄 group と account ほか）・members（GroupMember の Vec・欄 project・seat_account・matches）ほか。契約の型の crate の pub mod wire の pub fn decode で fixture の字を AccountDoc に読める。fixture（tests/fixtures/account/acct-doc.json・書かない）の projects は proj-a（群 Tier1・席 proj-a-orch・次の一手が Known で lead は Question）・proj-b（群 Tier2・席 proj-b-orch・次の一手 Unknown）・proj-c（群 Tier1・席 Unknown・次の一手 Unknown）、groups は Tier1（今の口座 acct-1・members は proj-a と proj-c）と Tier2（今の口座 acct-2・members は proj-b）。 形（host の部分・home.rs）。host の部分の use に super の projects の nx_card と gproj_card を足す。NxRow に欄 card（Card）を足し、nx_row の引数を (row: &ProjectRow, at: EpochSecs) にして card に nx_card(row, at) の値を置く（ほかの欄の組み方は変えない）。next_all は rows を nx_row に電文の at と渡して組む。Member に欄 card（Card の Option）を足す。group_view の引数を (card: &GroupCard, accounts: Option<&[AccountRow]>, doc: &AccountDoc) にし、limited に渡す session の列は電文の sessions、group_more に渡す移動の列は電文の moves、hmd の今は電文の at とし（値は今と同じ）、members の各 Member の card は電文の projects の中で name が member の project と同じ最初の行を gproj_card に電文と渡した値（無ければ None）。home は group_view に口座の列と電文を渡す。Home・next_all・nx_row の外の欄・marks・rank・group_more・limited・acct_card・acct_row・mv_card・moves・content の値は変えない。card の 4 行は着地済みの Card の rows が 36 字で切る（上の fixture の値はどれも 36 字以下・確かめた）。足す字は 40 行ほどで、home.rs は受付の上限 1500 行の内に留まる（計画 surface-plan の 5 節の上限に近い file・後の行 h-next-unknown・h-thr-home・h-acct-spark の余白は各行の起草で確かめる）。 形（DOM・mod dom の中）。mod dom の use の widgets の hover に Card を足す（attach は今在る）。private の fn attach_some（引数は el の web_sys::Element と card の Card の Option・返りは無し）を足し、本体は card が Some なら attach に el とその card を渡すだけにする（字 attach(el, card) の形・着地済みの projects.rs の mod dom に同じ名と形の private の fn attach_some が在るが、private なので home.rs からは使えず、projects.rs は書かない）。nx_row_view は外の div の class の後に tabindex と等号と引用符で囲んだ 0 と字 use:attach= と行の card を置く（card は view の前に r から取り出す・tag は今のまま字 <div class=r.class で始める）。group_card は members の span の class の後に tabindex の 0 と字 use:attach_some= と member の card を置く（tag は今のまま字 <span class= と引用符で囲んだ pchip で始める）。どの tag の属性の式にも字 > を書かない（歯は tag を最初の > までと読む）。next_view・groups_view・allowance_view・acct_row_view・meter・moves_view・moves_body・mv_li の字と、group_card の見出し・今の口座・窓・候補・詳しくの段の字は変えない（着地済みの acctlook の歯は groups_view の本体の字と hs の used の字を、hcard_dom_wiring は c-name の tag と li の tag の use:attach= と mv_card( ほかの字を読む）。引用符で囲んだ class の字は足さない。 出さない物。見本の nx の枝の次の一手の図（figTop）と出所の元の長い字（srcFull）と、見本の gproj の枝の種類の行の状態の icon（hover の Card は字だけ）。群の枠そのものの card（見本も出さない）。 着地済みの歯。tests/accthome.rs（write-set・書く）は home::nx_row(&p) を 3 か所で呼ぶので、各呼びに 2 つ目の引数 fixture の電文の at を足す（例 fixture().at・期待の値は変えない・NxRow の比べは欄ごとで card を見ない）。accthome_no_pressure_marks は home.rs の字に語 hot・spark・measured_at・c-occ・remaining・refused と、字 cap を二重の引用符で囲んだ字と class の値 cap の字が無いことを見る（足す字の名 nx_card・gproj_card・attach_some・card はどれも含まない・註の字にも書かない）。accthome_vocab_css_deps_and_frame は home.rs の引用符で囲んだ class の字が stylesheet に在ること・字 crate::net::read(PATH) と open(&p.name, &u) と pub fn view(block: Block) -> leptos::prelude::AnyView が在ることを見る（変えない）。tests/hcard.rs（置き場だけの =）の hcard_dom_wiring は mod dom の字の use:attach= が 2 つ以上・c-name の tag の全部と li の tag に use:attach= が在ることを見る（この行は use:attach= を足すだけ）。書く file の外で直さずに通る歯: acctlook（groups_view の本体と hs の used の字）・acctframe（account の下の file の class の字が stylesheet に在ること・口の字と保存の字が無いこと・この行はどれも足さない）・aord（home の content の accounts と groups の candidates と moves の値・変えない）・hcproj（projects.rs の値と字・書かない）。 測り方。新しい歯は面の crate の tests/hcnx.rs に置き、名を hcnx_ で始める。fixture の電文は tests/fixtures/account/acct-doc.json を wire の decode で読み（書かない）、home の home に渡す。比べる値は tsuzuri_surface の account の projects の nx_card・gproj_card・row_cards を撃った値で、時刻の字（出所の ◷ の後）を字で固めない（後の行 g-jst が時刻の字を替えても、この歯は直さずに済む）。DOM の字の歯は home.rs の字を読む。自分の名の歯は tests/hcnx.rs の字を読み、test の属性の行の次の fn の名を全部集め、名の数が 4 以上であることと done (6) を見る。 filter の語（着地済みの行の verify の filter の語と、同じノートの行 h-cards-led の接頭辞 hcled_・この行の接頭辞 hcnx_ は並べない・ほかの語を部分の字として含む語は省いた）は aaround_・accept_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・board_min_・bport_・brand_・btuck_・cadopt_・cgdom_・contract_form_・cround_・csled_・denv_・flight_・fmark_・frame_・fserve_・fstop_・gapspage_・ghb_・glabel_・gnav_・graph_・gsum_・gtuck_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcproj_・hcsess_・hfig_・hook_・hruling_・hsblock_・hsderive_・hspage_・hsym_・iclose_・ilink_・kcli_・klink_・lcard_・ledgerblock_・lhome_・lspark_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・parts_・pclosed_・pfold_・pipe_・plimit_・pmore_・project_・ptitle_・pwhole_・qblock_・qgate_・qkey_・question_・rhold_・runsdoc_・saxis_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_ で、新しい歯の名から先頭の hcnx_ を除いた字は、このどれも部分の字として含まない。名は done に書いた hcnx_rows_carry_cards・hcnx_member_cards・hcnx_dom_wiring・hcnx_names_clean（どれも並べた語を含まない）。 依存と順。depends は無い（行 h-cards-proj は着地済み・t3-hub.53.15・550176b）。同じノートの行 h-cards-led とは書く file も置き場だけの = も重ならないので並べて流す。計画の 5 節の鎖では home.rs は h-next-unknown → h-thr-home → h-cards-nx → h-acct-spark、歯 accthome は h-acct-order（着地済み）→ g-jst → h-thr-home → h-cards-nx → h-acct-spark の順の見込みだが、待ちの解けた行から先に流してよく、この行は依存が全部着地しているので先に流せる。器は走行中の行と write-set が重なる行（置き場だけの = 同士も）を断るので、home.rs か accthome.rs か hcard.rs を書くか = で持つ行（g-jst・h-next-unknown・h-thr-home・h-acct-spark）とは同時に流さず、順は便の bead の依存で持つ。外の依存は足さない。"

[[contract]]
id = "h-cards-led"
title = "account board の台帳の処理状況の表の各行の project の欄に hover の card を付ける（各 project の表の台帳の欄と同じ card を、行 h-cards-proj の組み手 led_card で組む・台帳の無い行にも付ける）"
req = ["FR14"]
section = "4"
write-set = ["crates/tsuzuri-surface/src/account/ledger.rs", "+crates/tsuzuri-surface/tests/hcled.rs", "=crates/tsuzuri-surface/tests/acctled.rs", "=crates/tsuzuri-surface/tests/ledspark.rs"]
verify = ["cargo nextest run -p tsuzuri-surface --test hcled --no-tests=fail hcled_", "cargo nextest run -p tsuzuri-surface --test acctled --no-tests=fail acctled_", "cargo nextest run -p tsuzuri-surface --test ledspark --no-tests=fail lspark_", "cargo run -q -p xtask -- surface-build", "cargo run -q -p xtask -- check"]
size = "S"
done = "(1) 面の account の ledger の module（host でも組む）の pub struct LedRow に欄 card（widgets の hover の Card）が在り、pub fn table は各行の card に account の projects の led_card に電文の projects のその行（LedRow の index の位置）を渡した値を置き、並べ方の 4 つ（judge・project・net・backlog）のどれでも各行の card は電文の projects の index の位置の行を led_card に渡した値と等しく、fixture の acct-doc.json の電文の表の proj-a の行の card の title は proj-a · 台帳の処理状況・kind は ↑+2 24h · ↑+4 7d · closed/日 0.9・value は task 9（ready 5 / blocked 3）・more は memo 3 · stale 1 と question 2 · epic 2 と lead p50 4.0d / p90 12d の 3 行、proj-b の行の card は title proj-b · 台帳なし・kind 台帳の処理状況・value 測れていない・src bd list --all の bead・空の more（proj-c も同じ形）で、LedRow のほかの欄（index・name・class・cells）と LedTable の sort と行の順は今の値のまま（歯 hcled_rows_carry_cards） (2) ledger.rs の字 mod dom { より後に、fn row_view の本体で字 <div class= と引用符で囲んだ c-p で始まる tag（最初の > まで）が 1 つ以上在ってどれも tabindex と等号と引用符で囲んだ 0 と字 use:attach= を含み、mod dom の use に crate::widgets::hover の attach が在る（歯 hcled_dom_wiring が ledger.rs の字を読む・DOM が組めることは xtask の surface-build で見る） (3) 着地済みの歯は直さずに全部通り（xtask の check と surface-build・acctled_ と lspark_ の歯の全部を含む）、ledger.rs に引用符で囲んだ class の字を足さず、Cargo.toml・vocab.json・style.css・fixture・account の projects.rs は触らない（歯 acctled_fold_signal_keys_and_classes と acctled_rows_on_fixture と lspark_dom_after_more） (4) tests/hcled.rs の test の属性の付いた fn の名はどれも hcled_ で始まり、名から先頭の hcled_ を除いた字は、節に並べた filter の語のどれも部分の字として含まない（歯 hcled_names_clean が自分の file の字を読んで全部の名を見る）"
goal = "なぜ。見本の account board の台帳の処理状況の表（docs/design/mock3/account/index.html の関数 ledTable）は、各行の project の欄（class c-p の div）に data-card の鍵 led と tabindex の 0 を付ける。台帳の在る行も無い行（j-none の行）も同じ欄に付ける。card の中身は window.__tz_card の led の枝（関数 ledCard・各 project の表の台帳の欄と同じ関数）で、題・純減 24h と 7d と closed/日・open の task と ready と blocked・出所と時点・memo と stale ほかの 4 行と詳しく。本番の表（便 h-led と h-led-spark・src/account/ledger.rs）は card を 1 枚も持たない（ledger.rs に use:attach の字は無い・main 2e0732e で確かめた）。要件 FR14 は hover の card を 4 行（1 行 36 字）と詳しくと決め、圧縮された cell に card を出す。project の欄は project の台帳の積みと速度の全部を名 1 つに縮めた cell で、見本（判断の記録 ADR-7 で確定）が card を付ける要素。計画 surface-plan の 4 節の行 h-cards-led（依存 h-cards-proj・着地済み）で、組み手は h-cards-proj が足した led_card を使う。 在りか（main 2e0732e で確かめた）。src/account/ledger.rs は account の mod.rs の pub mod ledger で host でも組む（着地済みの acctled と ledspark の歯が tsuzuri_surface の account の ledger の path で使う）。host の部分: pub struct LedRow（欄 index は usize・name と class は String・cells は Reading の Cells・derive は Debug・Clone・PartialEq）と impl の judge_key・numbers・more・marks、pub struct LedTable（欄 sort と rows・derive は Debug・Clone・PartialEq）と impl の order と names、pub fn content（口の読みと Sort を受け Body の LedTable）と pub fn table（&AccountDoc と Sort を受け LedTable）。table は order の並びの各 index i について電文の projects の i の位置の行 p から Cells を組み、LedRow を struct の字で index・name・class・cells で組む（LedRow と LedTable を struct の字で組む所は面の src と tests で table だけ・grep で確かめた）。host の部分の use は std の cmp の Reverse、契約の型の account の AccountDoc と ProjectRow、board の LedgerJudge と Reading、stats の LedgerStats、crate の frame（self と Block）・project の Body・project の ledger の JUDGES・Judge・NONE・Net・SPARK_H・SPARK_W・age・fixed1・judge・net・spark・spark_svg・view の Fetched で、hover の Card と account の projects は use していない。wasm の target のときだけの mod dom は、use に std の BTreeMap・leptos の prelude の全部・契約の board の Reading・super の定数と型と content・sort_of・with_sort・account の PATH・project の ledger の Judge・NONE・Net・crate::project の Body・UNKNOWN・body_view・section・state_icon・unmeasured・vocab の label・widgets の help の HelpCtx・hs・shows_internal を持ち、hover の attach は無い。fn row_view（引数は LedRow と開き閉じの signal と経験者の Signal）は本体の初めに project の欄を字 view! { <div class=引用符で囲んだ c-p><span data-t=引用符で囲んだ空><name></span></div> } で 1 度だけ組み、台帳が Unknown の行（早く返す枝）と Known の行の両方の view にその値を置く。project の欄の tag は今は属性を持たない。 hover の card（src/widgets/hover.rs・widgets の mod.rs の pub mod hover で host でも組む・この行は書かない）の pub struct Card は欄 title・kind・value・src（String）と more（String の Vec）を持ち、derive は Debug・Clone・PartialEq・Eq・Default。wasm の target のときだけの pub fn attach（引数は web_sys の Element と Card・返りは無し）は hover.rs の mod dom に在り、hover.rs が wasm の target のときだけ pub use で crate::widgets::hover の名として出す。block は view の要素に use:attach と等号と Card の値を書いて付ける（着地済みの home.rs の口座の名の欄と移動の行、projects.rs の 5 つの欄が前例）。account board の頁（src/account/board.rs の App・wasm のときだけ・この行は書かない）は provide_context(HoverCtx::default()) を呼び view の末尾に <CardLayer/> を置き、tab の block の view はその中で組まれる。 組み手（着地済みの行 h-cards-proj・t3-hub.53.15・main 550176b・src/account/projects.rs・host でも組む pub・この行は書かない）。pub fn led_card（&ProjectRow を受け Card）は見本の ledCard の写しで、ledger が Known なら題は名と · と語の鍵 ledger_state の語、種類は純減 24h と 7d の矢印と字と l_rate の語と closed/日の小数 1 桁、値は task と open の task と ready と blocked、出所は字 bd list --all の bead と 時点 と台帳の at の時と分、more は memo と stale・question と epic・lead の p50 と p90 の 3 行、Unknown なら題は名と · と語の鍵 j_none の語・種類は ledger_state の語・値は st_unknown の語・出所は字 bd list --all の bead・more は空で、fixture の値は行 h-cards-proj の done (2) のとおり。行 h-cards-proj は各 project の表の台帳の欄の card に同じ関数を使う（RowCards の led）。 電文（crates/tsuzuri-contract・この行は書かない）。AccountDoc の欄 projects は ProjectRow の Vec で、ProjectRow の欄 ledger は Reading の LedgerStats。fixture（tests/fixtures/account/acct-doc.json・書かない）の projects は proj-a（台帳 Known）・proj-b（台帳 Unknown）・proj-c（台帳 Unknown）の 3 行。 形（host の部分・ledger.rs）。host の部分の use に super の projects の led_card と crate の widgets の hover の Card を足す（ledger.rs から super の projects の pub の関数を使うのは、projects.rs が super の home の group_more を使うのと同じ形）。LedRow に欄 card