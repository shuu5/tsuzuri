[[contract]]
id = "g-top-fit"
title = "上端の帯（header の class top）を幅 1000px 以下では見本の狭い幅と同じ 2 段の形にして、761〜1000px の幅で帯が横へはみ出さない（style.css の規則 7 つを字を変えずに幅 1000 の塊へ移す）"
req = ["NFR1"]
section = "3"
write-set = ["crates/tsuzuri-surface/style.css", "+crates/tsuzuri-surface/tests/topfit.rs", "=crates/tsuzuri-surface/tests/frame.rs", "=crates/tsuzuri-surface/tests/gpill.rs"]
verify = ["cargo nextest run -p tsuzuri-surface --test topfit --no-tests=fail topfit_", "cargo nextest run -p tsuzuri-surface --test frame --no-tests=fail frame_", "cargo nextest run -p tsuzuri-surface --test gpill --no-tests=fail gpill_", "cargo run -q -p xtask -- surface-build", "cargo run -q -p xtask -- check"]
size = "S"
done = "(1) 面の crate の style.css を注釈を除いて読み、max-width の値 N px の media の塊を括弧を数えて切り出したとき、幅 390・760・768・780・820・853・900・960・1000 のどの幅でも、N がその幅以上の塊のどれかに、節の形に書いた帯の狭い形の 7 つの規則の字がそれぞれ在る（歯 topfit_wraps_at_named_widths） (2) 同じ切り出しで、幅 1001・1024・1280 のどの幅でも、N がその幅以上の塊のどれにも字 .top { が無い（歯 topfit_one_row_above_break） (3) 同じ 7 つの規則の字は、見本 docs/design/mock3/ui.css の N が 760 の塊のどれかにそれぞれ在る（歯 topfit_narrow_form_from_mock）"
goal = "在りかの main は 244d0e2（計画 surface-plan 第 0.65 版）。この行は計画だけの行（9 節）を経ずにノートへ置く欠陥の直し（計画 3 節の席の決め・第 0.16 版の e-idle-close と g-graph-label と同じ扱い）で、承認は計画の裁定を継ぐ。 なぜ。席の実測（2026-09-29T00:45Z・main 539398e の board）で、project board の上端の帯（header の class top・flex-wrap は nowrap）が幅およそ 761〜855px で右へはみ出し、頁に横 scroll が出る。起草の測り（同じ board を幅ごとの iframe で読んだ）で、質問・地図・抜けの検査・節点の頁のはみ出しは 761px で 104・768px で 97・780px で 85・820px で 45・853px で 12 px、900px 以上と 760px 以下は 0。home は席の pill を出さない頁なので 0。はみ出すのは帯の右端の mode の切り替え（class seg）。帯の子は backwrap（min-width 0 で潰れる）・brand・nav・grow・時刻の chip・鮮度の印（class st）・席の pill・seg で、見本 mock v3 の帯には時刻の chip と鮮度の印が無い（行 g-fresh・g-pulse・g-seatpill・g-jst が足した）。前の行 g-top-fix（t3-hub.34）は時刻の chip の字を縮めて 780px で直したが、後の行の足しで帯がまた伸びた。要件 NFR1 と規則の行 R-23 が測る幅は 1280 と 390 だけで、この行はその間の幅（縦に持った tablet の幅）を名指して測る。 在りか・style.css（write-set・crates/tsuzuri-surface/style.css・面の stylesheet・見本の ui.css の写しに面の規則を足した物）。上端の帯の規則は注釈 上端の帯 の節（.top は flex で height 56px・gap var(--s3)・padding 0 var(--s4)）。帯を 2 段に組み替える 7 つの規則は、今は注釈 狭い幅（390） の直後の塊 @media (max-width: 760px) の頭に在る。見本 docs/design/mock3/ui.css の同じ塊の頭にも同じ 7 つの規則が同じ字で在る（確かめた）。account board の帯（header の class top vessel）も同じ .top の規則を使う。 形（style.css）。760 の塊の頭の 7 つの規則を、字を変えずに、その塊のすぐ前に置く新しい塊 @media (max-width: 1000px) へ移す。塊の前に注釈 上端の帯の狭い形（幅 1000 以下・行 g-top-fit） と、1 行の形は子の最も狭い幅の和が収まる幅（1001 以上）でだけ使う旨の注釈を置く。7 つの規則の字は次のとおり（見本の 760 の塊の字のまま）。(1) .top { gap: var(--s2); padding: 0 var(--s3); height: auto; min-height: 56px; flex-wrap: wrap; padding-top: var(--s1); padding-bottom: var(--s1); } (2) .nav { order: 5; width: 100%; margin: 0; justify-content: space-between; } (3) .nav a { padding: 0 var(--s2); flex: 1; justify-content: center; } (4) .nav a .lbl { display: none; } (5) .brand .name { display: none; } (6) .seatpill .who { display: none; } (7) .seatpill { padding: 0 var(--s2); }。760 の塊には残りの規則（.page 以下）が今の順で残る。塊の置き場は元の位置の直前なので、ほかの規則との後先（cascade）は変わらない。 変わらない物と読む順（歯で測らず、この行の差分で持つ）。760px 以下の帯は今と同じ 2 段の形。1001px 以上の帯は今と同じ 1 行の形。761〜1000px では project board と account board の帯がどちらも 2 段の形（頁の link は 2 段目で印だけ・brand の名と席の pill の語を隠す）になる（1 つの境で 2 つの board をそろえる・席の決め）。見本の ui.css・語の辞書 vocab.json・面の src の rs・電文・外の依存は書かない。起草の測り（直しの塊を注入）で、home・質問・地図・抜けの検査・節点の頁と account board の HOME と session の tab の 13 の幅（390〜1280）のはみ出しは全部 0、帯の高さは 761〜1000px で 56 から約 97px になった。 決めた幅（起草の決め・席が 1000 に決めた）。帯の 1 行の形に要る最も狭い幅（header の幅を潰して測った scrollWidth）は、地図・質問・抜けの検査の頁で 882〜915px（席の pill の状態で動く）、時刻の chip が 20 時間を超えた長い字（例 09-26 21:53 JST・112px・短い字は 73px）で約 39px、席の pill の経過の字で約 50px 伸び、最悪の見積もりは約 980px。境を 1000 にすると 1024px（横に持った tablet）は 1 行のまま。account board の帯の最も狭い幅は約 700px（休止の chip つき）で、今はどの幅でもはみ出さない。退けた候補。時刻の chip を狭い幅で隠す（761〜763px がまだはみ出し、最終の記録の時刻を失う）。帯を常に折り返す（1280px でも backwrap の字の幅で mode の切り替えが 2 段目へ落ちる）。頁の link の字だけを隠す中間の形（見本に無い第 3 の形で、約 100px しか縮まない）。帯に部品を足す後の行は、最も狭い幅の和が 1001px 以下かを測り直す。 着地済みの歯（面の crate の tests を grep で確かめ、試作で撃った）。style.css の class を集める歯 tests/frame.rs の frame_classes_are_in_stylesheet（注釈を除いて . の後の名を集める・移しても名の集まりは同じ）と、tests/gpill.rs の gpill_ の歯（字 .seatpill { と .seatpill .who の在る無し）は置き場だけの = で持ち、verify で撃つ。前の行 g-top-fix の歯 tests/topbar.rs は時刻の字の関数だけを見て style.css を読まないので持たない。 測り方・歯（tests/topfit.rs・新しい file・接頭辞 topfit_）。横 scroll そのものは browser でしか測れない（browser の runner は傘の行 j の j-runner）ので、歯は幅を名指して、その幅で効く塊（max-width の値がその幅以上）の規則の字を見る。歯は env! の CARGO_MANIFEST_DIR から style.css と ../../docs/design/mock3/ui.css を読み、注釈を除き、字 @media (max-width: の後の数と px) を読み、続く { から括弧の深さを数えて塊の中身を切り出す。7 つの規則の字は歯の const BAND に持つ。歯の名は topfit_wraps_at_named_widths・topfit_one_row_above_break・topfit_narrow_form_from_mock。使う item は無い（面の crate の pub の item を使わない）。 filter の語。main 244d0e2 の contracts の verify の filter の語 249 のどれも、接頭辞 topfit_ と 3 つの歯の名に部分の字として含まれず、接頭辞と名もどの語にも含まれない（確かめた）。着地済みの filter の topbar_（g-top-fix・--test 無し）も topfit_ を含まない。 依存と順。depends は空（ノートの行は 1 つ）。style.css を書く走行中と待ちの便は無く、計画 5 節の鎖にも style.css は無い。frame.rs と gpill.rs は置き場だけの = で、同じ file を = で持つ行とは器の交差の断りが同時に流さない。 範囲の外。見本の ui.css の塊の幅（見本は時刻の chip を持たないので 760 のまま）。帯の子の字の長さと並び。browser での横 scroll の測り（j-runner の後）。1280 と 390 の受入の測り（NFR1・R-23）。"
