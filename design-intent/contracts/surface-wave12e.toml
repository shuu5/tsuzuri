ちた 502 の応答だけが持つこと・閉じていないは notes への追記は済み閉じる書きが落ちた（問いは open のまま・notes にこの id の裁定の行が残る）・書いていないはこの束が何も書いていない（追記が落ちた行と、落ちた行より後の撃っていない行）を書く。変種の順は Written・Skipped・Refused・Unclosed・Unwritten。ほかの型と欄は変えない。 形・境界。accept の書きの輪で、追記が落ちたら落ちた行を Unwritten、追記が通って閉じる書きが落ちたら落ちた行を Unclosed（その行の裁定の id）にし、落ちた行より後の行を全部 Unwritten にして、items に要求の全部の行を要求の順に持つ WriteFailed を返す（2 回とも書き終えた行は今のまま Written・落ちた行より後の書きは撃たない・配達は撃たない・何も消す書きを足さない）。WriteFailed の doc と module の頭の doc の受付の順の 8 をこれに合わせ、routes/batch.rs の post_batch の doc の 502 の本文の文を、要求の全部の行の結果を要求の順に持つ BatchResponse に直す（写し方は変えない）。200 の道と断りと 4xx と 5xx の道は変えない。 形・面。batch に pub const LEFT（字 残り）と UNCLOSED（字 記録したが閉じていない）と pub struct Left（pub な欄 question・title・ruling・derive は Debug・Clone・PartialEq・Eq）を足し、Partial を名の在る欄 written と left（Left の Vec）にし、pub fn outcome に 2 つ目の引数 sent（Row の slice）を足す。502 の束の応答の items のうち Unclosed と Unwritten の行を応答の順に Left にし（title は sent の同じ id の行の title、無ければ問いの id の字・ruling は Unclosed の裁定の id か None）、Written・Skipped・Refused の行は left に入れない。line は left が空なら今の字、空でなければ今の字の後に空白と中黒と空白と LEFT と空白と left の数と空白と中黒と空白と、left の順の名（Unclosed は title と全角の括弧で包んだ UNCLOSED・Unwritten は title）を字 、 でつないだ字（例は done (5) の字）。keeps_text と reloads は今のまま。dom の submit は送る前に選んだ行を Row の Vec に写し、応答を outcome に写しの slice と一緒に渡す（外した id の off は今のまま替えない）。pub fn written・request_body・selected と 200・409・ほかの 4xx と 5xx・届かないの道は変えない。 決めた幅（起草の決め・席の決めの中）。(a) 最初に落ちた書きで止める今の決まりは変えない（disk の満ちでは後の書きも落ちる・落ちた後に書き続けて台帳の形を読めなくしない）。(b) 落ちた行は落ちた書きで分ける。bdw の上限 30 秒を越えて止めた書きは落ちた扱いで、実は書けていることが在りうる（Unwritten と名指した行の notes に裁定の行が在りうる）ので、面は一覧を読み直して台帳を正とする（今の reloads）。(c) 502 では配達を撃たない今の決まりを変えない。書き終えた行の裁定と、閉じていない行の裁定の行は、中核の undelivered が open の問いの行も拾うので、席の停止の hook が席へ返す（t3-hub.52.61 の実例と同じ）。(d) 何も消さない。閉じていない行の裁定の行は notes に残し、送り直しは新しい裁定の id（next_id が同じ分の id を数える）の行を足して閉じ、束の id は next_batch_id が数を増やす。前の行を取り消すかは持ち主の取り消しの口（計画の行 e-revoke）の役で、この行は書かない。(e) 送り直しの選び。送った行のうち閉じた行は読み直しで一覧から消え、残りの行は外した id に無いので選ばれたままで、欄の字は残るので、送るを押せば残りだけを送り直す。読み直しで新しく増えた行は今の決まりのとおり選ばれる（残りだけに絞る決まりは足さない・席への申し送り）。(f) 名指し