 の末に足す行は batch の pub fn line に裁定の id と問いの id と束の id batch:20260928T0441Z-1 と字 束の答え を渡した字・notes の改行は JSON の字の中で逃がす）を置き、落とす回の file を消して送り直す。配達の口の印の分は、歯の側で送り直しの前後の時刻の ruling の pub fn minute の 2 つの字のどちらかで見る。 測り方・面の歯（tests/bhalfpanel.rs・新しい file）。bhalf_outcome_names_left は Row を歯の中で組み（number 1〜3・id fx-h.1〜3・題 色の数・字の大きさ・余白・a1 は偽・touches は空・digest は番号の 16 字の 16 進）、502 の本文は BatchResponse（束の id batch:20260928T0441Z-1・items は fx-h.1 の Written〔裁定 fx-h.1:20260928T0441Z-1〕・fx-h.2 の Unclosed〔裁定 fx-h.2:20260928T0441Z-1〕・fx-h.3 の Unwritten）を wire の encode に通した字。line の期待は ask の REFUSED と batch の WRITTEN から組む。bhalf_submit_passes_sent は CARGO_MANIFEST_DIR の src/project/batch.rs の字を読む（DOM は wasm の target だけなので字で見る）。 filter の語（main bac6854 の contracts の verify の filter の語 188 を、ほかの語を部分の字として含まない 124 語に畳んだ語と、計画の後の行 g-gz の接頭辞 pgz_・この行の接頭辞 bhalf_ は並べない・同じノートの行 t-fstop-tidy は新しい歯の名を持たない）は aaround_・accept_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・board_min_・bport_・brand_・btuck_・cadopt_・cgdom_・cmark_・contract_form_・cround_・csled_・denv_・ecache_・flight_・fmark_・frame_・fserve_・fstop_・gapspage_・gfresh_・ghb_・glabel_・gnav_・graph_・gsum_・gtuck_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hspage_・hsym_・iclose_・ilink_・kcli_・klink_・launch_・lcard_・ledgerblock_・lhome_・lspark_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・parts_・pclosed_・pfold_・pipe_・plimit_・pmore_・pquest_・project_・ptitle_・punmap_・pwhole_・qblock_・qgate_・qkey_・question_・rhold_・runsdoc_・saxis_・sclosed_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_・pgz_ で、新しい歯の名はどれも bhalf_ で始まり、名の全体がこのどれも部分の字として含まない（例 bhalf_server_x・bhalf_question_x・bhalf_stage_x は不可）。畳んだ語で足りる（着地済みの filter のうち歯の名そのものと serv