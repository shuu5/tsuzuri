[[contract]]
id = "t-fstop-tidy"
title = "着地済みの歯 fstop_worktree_stays_quiet が worktree を模して作る .git（file の後に空の dir）を、歯が通っても落ちても drop の守りで消し、CARGO_TARGET_TMPDIR の下に .git を残さない（歯の tz の見方と歯の数は変えない）"
req = ["FR9"]
section = "3"
write-set = ["crates/tsuzuri-boundary/tests/fstop.rs"]
verify = ["cargo nextest run -p tsuzuri-boundary --test fstop --no-tests=fail fstop_", "cargo run -q -p xtask -- check"]
size = "S"
done = "(1) tests/fstop.rs に私的な struct Tidy（名の無い 1 つの欄の PathBuf）と impl Drop が在り、drop は std::fs::symlink_metadata がその path を dir と返せば remove_dir_all、ほか（file か path が無い）は remove_file を撃ち、どちらの誤りも捨てる。fstop_worktree_stays_quiet は wt/.git の path で Tidy を束ねてから .git の file を書き（歯の file の字 fn fstop_worktree_stays_quiet() より後の字で、字 Tidy(git.clone()) の最初の位置が字 fs::write(&git の最初の位置より前）、最後の tz の撃ちとその 2 つの assert の後に Tidy を drop して wt/.git の symlink_metadata が Err、続けて std::panic::catch_unwind に渡した閉包（同じ path で Tidy を束ね、.git の dir を作って panic する）の結果が Err で、その後も wt/.git の symlink_metadata が Err（歯 fstop_worktree_stays_quiet） (2) fstop_worktree_stays_quiet の tz の見方は今のまま。.git が字 gitdir とコロンと空白と別の dir（other）の path と改行の file の wt を --repo にして hook stop を撃つと rc 0 で標準出力と標準エラーが空で偽の bd と偽の bdw を撃たず、.git の file を消して空の dir にした wt で撃つと rc 0 で標準出力が節の 3 つの Pending の答えと改行 1 つ（歯 fstop_worktree_stays_quiet） (3) ほかの fstop_ の 9 本（fstop_parse_args・fstop_blocks_then_marks・fstop_output_before_marks・fstop_quiet_when_continued・fstop_quiet_when_nothing_pending・fstop_mark_failure_keeps_output・fstop_budget_bounds_marks・fstop_usage_errors_are_one・fstop_own_names_clean）は直さずに通り、test の属性の付いた fn の数は 10 のまま（fstop_own_names_clean が数え、どの名も fstop_ で始まり file の const FILTER_WORDS の 92 語を含まないことを見る・この行は新しい歯を足さない）（歯 fstop_own_names_clean）"
goal = "在りかの main は bac6854（行 i-2 と c-pipe-unmapped の着地の後）。この節の字はその code の値。 なぜ。器（scribe2）の走行の worktree ごとに target/ の下に CARGO_TARGET_TMPDIR（target/tmp）が在り、着地済みの歯 fstop_worktree_stays_quiet（行 f-stop・便 t3-hub.55.5）は target/tmp/fstop/worktree/wt/.git を空の dir として残す。2026-09-28T04:4xZ に disk が満ち、退役した走行の target/ を消すとき、rm の守りが、どの target/ にも残るこの空の .git の dir を理由に 29 個の削除を断った（席は持ち主の承認〔t3-hub.1 の notes の user 2026-09-28T04:49Z〕で、空の .git を別の置き場へ移してから消した・計画 surface-plan の 2 節）。以後の走行も同じ .git を残すので、歯の片付けの行を置く（席の決め・計画の 9 節の行 t-fstop-tidy・拠る要件は着地済みの行 f-stop と同じ FR9）。器の掃除（器の行 ae の git clean -X）もこの dir を消すので、この行は片付けで、何も止めない。 在りか（crates/tsuzuri-boundary/tests/fstop.rs・write-set・main bac6854 で確かめた）。歯の作業場は私的な struct Place（欄 root・repo・log）で、Place::new(name) は Place::with_pause に name と字 : を渡し、with_pause は root を CARGO_TARGET_TMPDIR の下の fstop/<name> にして、先に fs::remove_dir_all で root を消し（誤りは捨てる）、repo と log の dir を作り、偽の bd（受けた引数を log/bd.log に足してから root の out.json を出す sh）と偽の bdw（撃たれた回ごとの argv と cwd を log に書く sh・私的な fn recorder）を root に置き、out.json に fixture の stop/ledger.json の字を書く。歯 fstop_worktree_stays_quiet は Place::new に字 worktree を渡し、root の下に wt と other の dir を作り、wt/.git に字 gitdir とコロンと空白と other の path と改行の file を書いて、tz の hook stop を --repo wt と偽の --bd と --bdw で撃ち（私的な fn tz・PATH の頭に root を足し、標準入力に const P1〔鍵 stop_hook_active が false の JSON の object〕を書いて閉じる）、rc 0・標準出力と標準エラーが空・偽の bd と偽の bdw の記録が空を見る。続けて .git の file を fs::remove_file で消して fs::create_dir で空の dir にし、同じく撃って rc 0・標準出力が私的な fn answer の字（節の 3 つの Pending を tsuzuri_core::delivery::block に渡した字と改行 1 つ）を見て終わる。.git の dir は消さないので、次の走らせの Place::new が root を消すまで残り、走行の worktree では最後の走らせの後に残る。境界の hook の src/hook/stop.rs の pub fn run は、--repo の下の .git が file なら何もせずに 0（args.repo に .git を join した path の is_file）で、dir ならほかの歯と同じ道（台帳を読み未配達を答える）を通る。この行は src を触らない。 在りかの補い（fstop.rs のほかの fn・確かめた）。ほかの 9 本の歯は Place の repo と log と root の下の file（bd・bdw・out.json・file.txt）だけを書き、.git を作らない。fstop_own_names_clean は CARGO_MANIFEST_DIR の tests/fstop.rs を読み、字 #[test] の行の次の fn の名を集めて数が 10 で、名から fstop_ を除いた字が const FILTER_WORDS（92 語）のどれも含まないことを見る。歯の file の use は std::ffi::OsString・std::fs・std::io の BufRead と BufReader と Read と Write・std::os::unix::fs::PermissionsExt・std::path の Path と PathBuf・std::process の Command と Output と Stdio・std::time の Duration と SystemTime と UNIX_EPOCH（std::panic::catch_unwind は path で書いてよい）。workspace の Cargo.toml の profile は release だけを書き（行 g-strip）、test の profile の panic は巻き戻し（cargo は test の panic の設定を使わない）。 形。tests/fstop.rs に私的な struct Tidy（名の無い 1 つの欄の PathBuf・doc は drop で path を消す守りで、歯が通っても落ちても worktree を模した .git を CARGO_TARGET_TMPDIR の下に残さない旨）と impl Drop を足す。drop は fs::symlink_metadata が dir を返せば fs::remove_dir_all、ほかは fs::remove_file を撃ち、結果を捨てる（path が無ければ何もしないのと同じ）。fstop_worktree_stays_quiet の git の path を作った直後、.git の file を書く前に Tidy(git.clone()) を束ねる。最後の tz の撃ちとその 2 つの assert の後に、(a) Tidy を drop して git の symlink_metadata が Err、(b) std::panic::catch_unwind に閉包（Tidy(git.clone()) を束ね、fs::create_dir で .git の dir を作り、panic する）を渡して結果が Err、その後に symlink_metadata が Err、(c) CARGO_MANIFEST_DIR の tests/fstop.rs の字のうち字 fn fstop_worktree_stays_quiet() より後の字で、字 Tidy(git.clone()) の最初の位置が字 fs::write(&git の最初の位置より前、を足す（(c) の字の探し方は問わない・例 字 fn fstop_worktree_stays_quiet() で split した 2 つ目の字の find）。歯の前半と後半の tz の見方（撃ち方・rc・標準出力と標準エラー・偽の bd と bdw の記録）と、Place・ほかの fn・定数・FILTER_WORDS は変えない。新しい test の属性の fn は足さない。wt と other と repo と log の dir と bd・bdw・out.json は残してよい（.git でないので rm の守りに掛からない・次の走らせの Place::new が消す）。 限り。drop は panic の巻き戻しでは撃たれるが、process が kill で止められたとき（nextest の時間切れの kill ほか）と abort では撃たれない。そのときは次の走らせの Place::new が root を消し、器の掃除（git clean -X）も消す。閉包の panic は標準エラーに panic の行を書く（test の出力は nextest が捕まえ、通った歯では出さない）。 着地済みの歯（確かめた）。fstop.rs の 10 本は verify の fstop_ で全部撃つ。境界の crate のほかの歯で .git を作るのは tests/qgate.rs の Place::new だけで、どの歯の作業場でも repo/.git に字 gitdir とコロンと空白と字 /nonexistent/qgate の 1 行の file を書き、消さない（file で dir でない）。計画の行 t-fstop-tidy の書く file は fstop.rs だけなので、この行は qgate.rs を触らない（席への申し送り）。中核と契約と面の crate の歯と xtask の歯に .git を作るものは無い（tests と src を grep で確かめた）。src/hook/stop.rs は読むだけで変えない。 測り方。verify は cargo nextest run -p tsuzuri-boundary --test fstop --no-tests=fail fstop_（10 本）と xtask の check。この行は新しい歯の名を足さない（接頭辞を持たない・名の見張りは着地済みの fstop_own_names_clean のまま）。試作（main の写しに当てた）で 10 本が通り、走らせの後に CARGO_TARGET_TMPDIR の下の fstop の置き場に .git が 1 つも無いことを find で確かめた（今の code では fstop/worktree/wt/.git の空の dir が残ることも同じ写しで確かめた）。 依存と順。depends は空。計画の 5 節の鎖（歯 tests/fstop.rs は f-gate〔置き場だけの =〕と t-fstop-tidy を同時に流さない）の f-gate は着地済み。同じノートの行 e-batch-partial とは書く file も置き場だけの = の file も重ならないので並べて流す。これから fstop.rs を write-set（置き場だけの = を含む）に持つ行とは、器が同時に流さないので、順は便の bead の依存で持つ。外の依存は足さず、境界の src・Cargo.toml・fixture は触らない。"

[[contract]]
id = "e-batch-partial"
title = "まとめて承認の束の書きが k 行目で落ちたとき、502 の応答が要求の全部の行を要求の順に、書いた・閉じていない（逐語は notes に在る）・書いていないで名指し、面が残りの行を送った行の題で名指して欄の字と残りの選びを保ち、残りだけを送り直せるようにする（台帳の行は何も消さない）"
req = ["FR7"]
section = "4"
write-set = ["crates/tsuzuri-contract/src/surface.rs", "crates/tsuzuri-boundary/src/server/batch.rs", "crates/tsuzuri-boundary/src/server/routes/batch.rs", "crates/tsuzuri-surface/src/project/batch.rs", "crates/tsuzuri-boundary/tests/server_batch.rs", "crates/tsuzuri-surface/tests/batchpanel.rs", "+crates/tsuzuri-boundary/tests/bhalf.rs", "+crates/tsuzuri-surface/tests/bhalfpanel.rs", "=crates/tsuzuri-contract/tests/contract_form.rs"]
verify = ["cargo nextest run -p tsuzuri-boundary --test bhalf --no-tests=fail bhalf_", "cargo nextest run -p tsuzuri-surface --test bhalfpanel --no-tests=fail bhalf_", "cargo nextest run -p tsuzuri-boundary --test server_batch --no-tests=fail server_batch_", "cargo nextest run -p tsuzuri-surface --test batchpanel --no-tests=fail batchpanel_", "cargo nextest run -p tsuzuri-contract --test contract_form --no-tests=fail contract_form_", "cargo run -q -p xtask -- check"]
size = "M"
done = "(1) 契約の型の crate の surface の pub enum ItemOutcome（serde の tag outcome・rename_all kebab-case）に変種 Unclosed（名の在る欄 ruling の RulingId）と Unwritten（欄の無い変種）が足され、既存の Written・Skipped・Refused の電文の字は今のまま。BatchItemResult の電文の字は、問い fx-h.1 の Written（裁定 fx-h.1:20260928T0441Z-1）が鍵 question・outcome・ruling をこの順に持つ 1 つの JSON の object で値が字 fx-h.1・written・fx-h.1:20260928T0441Z-1、問い fx-h.2 の Unclosed（裁定 fx-h.2:20260928T0441Z-1）が同じ 3 つの鍵の順で値が字 fx-h.2・unclosed・fx-h.2:20260928T0441Z-1、問い fx-h.3 の Unwritten が鍵 question と outcome だけの object で値が字 fx-h.3・unwritten（空白の無い字）で、どれも decode で同じ値に戻り、outcome の値が字 unsent の object は decode が誤り（歯 bhalf_wire_words） (2) 境界の server の batch の module の pub fn accept は、節の 3 問の束（束の逐語 束の答え・受付の時刻 1790570490）の 6 回の bdw の書き（1 行目の追記・閉じる・2 行目の追記・閉じる・3 行目の追記・閉じる）の s 回目（s は 1 から 6）が落ちると、Outcome::WriteFailed の BatchResponse の束の id が batch:20260928T0441Z-1 で、items が要求の 3 行を要求の順に持ち、落ちた行（0 から数えて s-1 を 2 で割った切り捨ての行）より前の行は Written（裁定 <問いの id>:20260928T0441Z-1）、落ちた行は s が偶数（閉じる書き）なら Unclosed（同じ形の裁定の id）で奇数（追記）なら Unwritten、落ちた行より後の行は Unwritten で、bdw は s 回だけ撃たれて argv の列は落ちない束の 6 回の argv の頭の s 個と同じで、器の配達の口（偽の scribe2）は撃たない（歯 bhalf_step_k_of_n） (3) 4 回目（2 行目の閉じる書き）で落ちた束の後に、偽の bd の台帳を、fx-h.1 を status closed で notes の末に 1 つ目の束の fx-h.1 の裁定の行を足した字、fx-h.2 を status open のまま notes の末に 1 つ目の束の fx-h.2 の裁定の行を足した字、fx-h.3 を今のままにして、fx-h.2 と fx-h.3 をその台帳の版の要約値で同じ時刻に送り直すと、Outcome::Recorded で束の id は batch:20260928T0441Z-2、fx-h.2 は Written（裁定 fx-h.2:20260928T0441Z-2）・fx-h.3 は Written（裁定 fx-h.3:20260928T0441Z-1）で、bdw の 5 回目から 8 回目は fx-h.2 の追記と閉じると fx-h.3 の追記と閉じる（束の id は batch:20260928T0441Z-2）、9 回目と 10 回目は 2 つの新しい裁定の配達の口の印の追記、器は束の id batch:20260928T0441Z-2 で 1 度だけ撃たれ、撃った 10 回の書きはどれも 3 語の argv で update と --append-notes= で始まる語か close と --reason= で始まる語（notes の置き換えと開き直しは無い）で、前の裁定 fx-h.2:20260928T0441Z-1 の行を消す書きも、その裁定の印を置く書きも無い（歯 bhalf_resend_rest） (4) 着地済みの server_batch_write_failure_is_502_with_done_rows は、3 回目（2 つ目の問いの追記）で落ちた 502 の本文の items を 2 行（fx-b.2 の Written と fx-b.3 の Unwritten）で、1 回目で落ちた 5