# 相談窓口 — 正本（folio init の雛形・質問は利用者が書き換える）
meta:
  id: intake
  title: 相談窓口
  version: v0.1
  status: draft
  generated: 2026-09-24
  approval: []
answers:
  values: [はい, いいえ]
  default: recommend
targets:
  - {id: constitution, type: 憲法, with: [vocabulary, rules]}
  - {id: srs, type: 要件書, with: []}
  - {id: adr, type: 判断の記録, with: []}
  - {id: design-note, type: 設計ノート, with: []}
  - {id: inject, type: 憲法の注入（CLAUDE.md の生成区間）, with: []}
questions:
  - {id: q1, ask: 何があっても守る線（憲法）を決めておきますか, recommend: はい, why: 守る線が無いと、道具も AI も「止まる基準」を持てない, yes: [constitution], no: []}
  - {id: q2, ask: 「できた」の線（要件書）を先に書きますか, recommend: はい, why: 何ができたら完成かを先に書かないと、作ったものを測れない, yes: [srs], no: []}
  - {id: q3, ask: 戻せない判断を 1 本ずつ記録に残しますか, recommend: はい, why: 後から「なぜそうしたか」を辿れる。最初は 0 本の棚を置くだけ, yes: [adr], no: []}
  - {id: q4, ask: 作り方（設計ノート）を持ちますか（書くのは実装の直前）, recommend: はい, why: 早く書くと実装と食い違う。棚には「まだ無い」と出す, yes: [design-note], no: []}
  - {id: q5, ask: 憲法を AI の手元（CLAUDE.md）へ写しますか, recommend: はい, why: 写しておくと AI が毎回の作業で憲法を読む, yes: [inject], no: []}
sheet:
  file: intake-sheet.yaml
  title: 支度表
  explain: 相談の結果として出る「何を持つか」の表。持つ文書と、答えなかったので推奨で進めた項目を別枠に出す。
# folio:schema:begin — 生成区間・手で直さない・正本は実装の定数（folio schema --write が書く）
schema:
  top_level: [meta, answers, targets, questions, sheet, schema]
  top_level_note: 最上位の節の閉じた一覧（ほかの節は床が落とす）。meta と answers と targets と questions と sheet は人が書き、schema は生成区間
  answers: {values_count: 2, branches: [yes, no], default_fixed: recommend}
  answers_note: 回答の値の読み方。値の言葉そのものは人が書く answers.values が正本で、命令 folio intake は実行のたびにそれを読む。values の 1 つ目の値の回答は質問の行の branches の 1 つ目の欄（yes）の行き先を、2 つ目の値の回答は 2 つ目の欄（no）の行き先を選ぶ。values の数が values_count と違えば、支度表を書く口（folio intake --write）は 1 byte も書かずに「まだ分からない」で断る（床の folio check は values の数を数えない）。answers.default は values の値か、固定の値 default_fixed（答えの無い質問を各質問の推奨回答で進める）。values_count・branches・default_fixed の正本は実装の型付きの定数（crates/folio/src/intake.rs）で、この節はその写しである
  targets: {fixed: [inject]}
  targets_note: 行き先の id の値域に足す固定の値。targets の行の id は入口の棚の文書の id か、この一覧の値（inject = 憲法を AI の手元の CLAUDE.md へ写す注入・棚には無い）。正本は実装の型付きの定数（crates/folio/src/intake.rs）で、この節はその写しである
# folio:schema:end
