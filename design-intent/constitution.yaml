# tsuzuri 憲法 — 正本（改名前の仮の名は scribe3・ADR-6）（v1.0・発効 2026-09-25・持ち主の裁定 user 2026-09-24T22:39Z「これでよい」・記帳先 scribe2 台帳 s2-07l.214 notes・s3:design 席が scribe2 と folio2 の憲法を合流させて起草）。第 1.1 版（2026-09-27）は条 P-16 の改訂（判断の記録 ADR-12・反対側からの検証 docs/grill/2026-09-27-J-p16-amend-grill.md）。第 1.2 版（2026-09-29）は写しの表の答えによる規範文の追加（判断の記録 ADR-19・反対側からの検証 docs/grill/2026-09-29-L-copy-tables-amend-grill.md）。第 1.3 版（2026-09-29）は条 P-28 の新設（判断の記録 ADR-20・設計ノートの増え方を folio の床の上限で縛る）。第 1.4 版（2026-10-04）は条 P-13.1 の改訂と規範文 P-8.3・P-20.5・P-25.7 の新設と前文の機構の注の出所の直し（判断の記録 ADR-38・反対側からの検証 docs/grill/2026-10-04-Q-constitution-inject-grill.md）。第 1.5 版（2026-10-06）は条 P-13.1 の改訂（判断の記録 ADR-73・要の写しの段「いつも守る」の条の id と題を規則の表の作法の行の id と what に替える・反対側からの検証 docs/grill/2026-10-06-ADR-73-grill.md）
