# 憲法 — 床の受付の宣言（folio init の雛形・名と本文は利用者が決めて書き換える）
"schema":
  "version": 1
  "top_level":
    - "schema"
    - "meta"
    - "north_star"
    - "precedence"
    - "articles"
    - "rules_pointer"
    - "amendment"
    - "glossary_pointer"
    - "sources"
  "meta":
    "required":
      - "id"
      - "version"
      - "status"
      - "binding"
      - "baseline"
      - "generated"
      - "owner"
      - "author"
      - "counts"
      - "approval"
    "optional":
      - "changes_from_v0_1"
      - "changes_from_v0_2"
  "precedence":
    "required":
      - "text"
      - "plain"
      - "binds"
      - "mechanism"
      - "rationale"
    "optional": []
  "article":
    "required":
      - "id"
      - "title"
      - "tier"
      - "binds"
      - "statements"
      - "plain"
      - "rationale"
      - "mechanism"
    "optional":
      - "relations"
      - "retreat"
      - "amended_by"
      - "supersedes_v1"
      - "note"
  "mechanism":
    "required":
      - "kind"
      - "live"
    "optional":
      - "note"
      - "stage"
      - "polarity"
    "stage_polarity_required_for":
      - "reject"
      - "build-check"
  "amendment_scope":
    - "schema"
    - "precedence"
    - "articles"
  "statement":
    "required":
      - "id"
      - "pattern"
      - "strength"
      - "text"
    "one_sentence": true
    "one_polarity": true
    "numbers": "forbidden"
    "language": "ja-first"
  "plain":
    "required": true
  "enums":
    "tier":
      - "always"
      - "ask-first"
      - "never"
    "binds":
      - "tool"
      - "practice"
      - "both"
    "pattern":
      - "ubiquitous"
      - "event"
      - "state"
      - "unwanted"
      - "optional"
    "strength":
      - "must"
      - "must-not"
      - "should"
    "rationale_kind":
      - "v1-incident"
      - "scribe2-article"
      - "folio2-ruling"
    "mechanism_kind":
      - "reject"
      - "build-check"
      - "human-review"
      - "none"
    "mechanism_live":
      - "now"
      - "M0"
      - "delivery-0"
      - "M1"
      - "adr"
    "retreat_kind":
      - "spike"
      - "measure"
      - "ruling"
    "stage":
      - "in-loop"
      - "post"
    "polarity":
      - "fail-open"
      - "fail-closed"
  "mechanism_live_meaning":
    "now": "発効（design-intent/ と CLAUDE.md の配置）の時点で、不合格を出せる検査が実在する"
    "M0": "要件書 M0 の受入で実在する"
    "delivery-0": "便 0（CI と編集時 guard）で実在する"
    "M1": "M1 で実在する"
    "adr": "判断の記録（ADR）の正本 schema が置かれたときに実在する"
  "mechanism_kind_meaning":
    "reject": "実行時に機械が操作そのものを拒む（操作は起きない）。操作の口を持たないこと（削除の経路が無い等）も含む"
    "build-check": "生成・検査の時点で機械が判定し、不合格なら成果物を出さない"
    "human-review": "人が目で確かめる（機械可読な根拠があればそれを見る）"
    "none": "機構なし（note に理由が必須）"
  "mechanism_live_rule": "kind が reject / build-check でも live が now でない条は、その検査結果を「まだ分からない」として出す（P-4.2）。"
  "tier_mechanism_allowed":
    "always":
      - "reject"
      - "build-check"
      - "human-review"
      - "none"
    "ask-first":
      - "human-review"
      - "reject"
      - "build-check"
    "never":
      - "reject"
      - "build-check"
  "tier_precedence":
    - "never"
    - "ask-first"
    - "always"
  "preamble": "precedence"

meta:
  id: floor-declaration
  version: v1.0
  status: draft
  binding: false
  baseline: 未記入
