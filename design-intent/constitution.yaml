  owner: 持ち主
  author: 未記入
  counts: {always: 1, ask-first: 0, never: 0}
  approval: {who: 未記入, date: 未記入, ruling: 未記入, verbatim: 未記入, surface: 規則の表の行 R-8 の対話面}

north_star:
  statement: 未記入
  for_whom: 未記入
