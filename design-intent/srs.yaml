  - id: FR1061
    title: "導入先の同期"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "器は doctor の 1 項目として、 この host の導入先（install 帳簿が指す repo と worktree・席の登録 row の anchor）ごとに、 呼ばれる binary が自己申告する build 元 commit（測れない周は unknown）・plugin の読み込み元と hook 集合の digest・install 帳簿の記録・共有 cache の実体・scribe2 repo の HEAD を実測して 1 行に並べ、 食い違いを typed な語（none / binary / plugin / install）で名指し、 推測で埋めず、 自分の checkout を上流の既定 branch へ前進のみで揃え（揃えられない周は typed に断る）そこから binary を build して呼ばれる場所へ入れ、 その install を記録（sha・時刻・host）に残す 1 つの口を提供する。 その口は、 host のどこかで自分の外の器の process（便の driver・関門・着地・列・起こし・runner・lens）が生きている周と、 その数えを測れない周は、 上流へ揃える前に busy と断り、 揃えた後に、 呼ばれる binary が自己申告する build 元 commit（測れない周と手元の変更つきの build は build する側に倒す）と HEAD の木が器の repo の dir の下で同じ周は build せずに unchanged と断り、 どの断りでも install の記録を残さない"
    plain: "他の project に入っている scribe2 が「どの版の本体・どの版の hook」で動いているかを、doctor の 1 項目として器が自分で測り、導入先（install 帳簿が指す repo と worktree、席の登録 row の anchor）ごとに 1 行ずつ出します。本体が自己申告する build 元 commit（測れなければ unknown）、plugin の読み込み元と hook 集合の digest、install 帳簿の記録、共有 cache の実体、scribe2 repo の HEAD を並べ、食い違いを none / binary / plugin / install の語で名指しし、推測で埋めません。更新は 1 つの口で、自分の checkout を上流の既定 branch へ前進だけで揃え（揃えられなければ typed に断る）、本体を build して呼ばれる場所へ入れ、その install を sha・時刻・host の記録に残します。ほかで器の作業（便や審査役など）が動いている間は入れ替えずに busy と断り、呼ばれている本体が揃えた後の木と同じなら build せずに unchanged と断ります（どちらも記録を残しません）。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1031]}
    goals: [GOAL1001, GOAL1003]
    figures: []
    note: "なぜ要るか: 人の手が入らなくても安全に進む（GOAL1001）から来ています。複数の project に入った scribe2 の本体と hook が黙って古くなると、guard の無い席が動き続けます。器が自分で測って名指しし、更新を 1 つの口で行えば、手順書を人が覚える形（GOAL1003 の逆）にならないからです。"
