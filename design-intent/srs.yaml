  - id: FR1072
    title: "見張り自身の設定の編集の拒否"
    pattern: unwanted
    strength: must
    when: "口座の設定を読む session が、 編集系の道具（Edit / Write / MultiEdit / NotebookEdit）の対象の path か、 Bash の書き込みの語列（rm・tee・sed の in-place・redirect の対象・mv の両端・cp と ln の行き先）の path で、 見張り自身の設定（host の面の口座ごとの settings.json とその実体・対象 repo の root の .claude の settings.json と settings.local.json）を書こうとするとき"
    shall: "器の host-guard は対象の path を cwd から解いた path と実体の path の両方で見張り自身の設定の file と比べ（当たるとは一致か、 その file を含む dir であること）、 当たれば実行の前に deny し、 断る理由に種類と当たった実体の path を告げ、 代わりの経路として user が編集することを示す。 この種類は rules 行を持たず切れない"
    plain: "口座の設定を読む session（人と話す席など。器が起こす実装役 runner や審査役 lens には届きません）が、見張り自身を呼ぶ設定 file（口座ごとの settings.json とその実体、作業中の repo の root にある .claude の settings.json と settings.local.json）を書き換えようとしたら、器の見張り（host-guard）が実行の前に止めます。編集の道具の対象 path でも、Bash の書き込み（rm・tee・sed の上書き・リダイレクトの先・mv の両端・cp と ln の行き先）でも同じで、path は作業 dir から解いた形と実体（symlink の先）の形の両方で比べ、file そのものか、その file を含む dir に当たれば止めます。止めるときは区分（見張りの種類）と当たった実体の path を告げ、代わりに user が編集するよう示します。この区分だけは規則の行を持たず、切れません。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1042]}
    goals: [GOAL1001, GOAL1003]
    figures: []
    note: "なぜ要るか: 人の手が入らなくても安全に進む（GOAL1001）から来ています。見張りを呼ぶのは口座の設定 file の 1 行なので、AI の席がその file を書き換えれば見張りは黙って外れます。他の区分を切る・緩めるのは user の決定の印がついた規則の行だけにし、この区分は行も持たず切れないことにして（GOAL1003）、設定 file の書き換えを見張り自身が止めれば、事故で守りが消えないからです（ADR-0056）。"
  - id: FR1073
    title: "doctor の host-guard の行"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "器は doctor の 1 行として、 host-guard の種類ごとの on / off（出所は種類ごとの rules 行の enabled・行の無い種類は no-row・見張り自身の設定の種類は固定で on）・発効している行の数・配線（FR1075）を持つ口座の数と口座の数・配線の実体の数・binary の解決（ok / missing / other。 binary が無い周は harness が通すので、 その状態を言うのは doctor だけ）・登録 row（FR1040）の anchor のうち群の表のどの行（群と park の区画）の anchor にも無いものの件数（隣の private repo の漏れの検出線・FR1080）を実測して並べ、 判定せず rc を変えない。 rules が読めない周はその旨の 1 行を出す"
    plain: "器の健康診断（doctor）は、見張り（host-guard）の状態を 1 行で出します。区分（見張りの種類）ごとの on / off（出所は区分ごとの規則の行の enabled。行が無ければ no-row、見張り自身の設定の区分は常に on）、効いている行の数、呼び出しの行（host-guard の配線）を持つ口座の数と口座の数、呼び出し先の設定 file の実体の数、器のプログラムが見つかるか（ok / missing / other。見つからないときは harness が通してしまうので、それを言えるのはこの行だけです）、席の登録の anchor のうちかたまりを宣言する表のどの行（かたまりと park の区画）にも無いものの件数（隣の private repo の漏れに気づくため・FR1080）を測って並べます。区分が off や no-row、配線を持つ口座の数が口座の数より少ない、プログラムが missing、のどれかなら見張りは効いていません。判定はせず、終了コードも変えません。規則の file が読めないときはその旨を 1 行で出します。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1043, AC1063]}
    goals: [GOAL1001, GOAL1003]
    figures: []
    note: "なぜ要るか: 記憶に頼らない（GOAL1003）から来ています。見張りが切れている・呼び出しの行が欠けている・器のプログラムが見つからない、のどれも黙って通る側に倒れるので、その状態を席の記憶や散文でなく健康診断の実測 1 行で読めるようにし、黙って無効にならないようにするためです（GOAL1001・ADR-0056）。群の表のどの行にも属さない置き場を数えるのは、口座を占めない park の区画ができても、どこにも宣言されていない置き場の席を見落とさないためです（ADR-0091）。"
  - id: FR1074
    title: "rm の不可逆削除の拒否"
    pattern: unwanted
    strength: must
    when: "口座の設定を読む session が撃つ Bash の rm の対象の path が、 守る集合（state dir とその配下・cwd の repo の tracked file・repo の .git と worktree の本体）に一致・祖先・配下で当たるとき、 または path が解けない形（変数展開・command 置換・チルダ始まり・brace・同じ command の cd の後ろの相対 path・守る path に当たる dir の配下の glob）のとき"
    shall: "器の host-guard は実行の前に deny し、 断る理由に当たった守る集合の記号か解けない形を告げ、 代わりの経路として tracked な file は git rm・それ以外は退役の mv を示す。 守る集合は host に依らない記号（state-dir / repo-tracked / repo-git）の閉じた列で rm の種類の rules 行が持ち、 実行時に解く。 その行が無い周は fail-closed で断り、 enabled が false の周は rm の種類だけを切る"
    plain: "口座の設定を読む session（人と話す席など。器が起こす実装役 runner には届きません）が撃つ rm（削除の命令）は、行き先で止めるかを決めます。守る場所は 3 つで、器の置き場とその中、作業中の repo の管理下（git が追う）file、repo の履歴の置き場（.git）と worktree の本体です。行き先がその場所そのもの・それを包む dir・その中のどれかなら止めます。行き先が確かめられない形（変数・命令の結果・home を表す ~ で始まる・{ } のまとめ書き・同じ命令の中で dir を移った後の相対の場所・守る dir の中の * のまとめ指定）も止めます。止めるときは当たった場所の記号か確かめられない形を告げ、代わりに管理下の file なら git rm（履歴から戻せる削除）、それ以外は退役の mv（消さずに脇へ移す）を示します。守る場所は machine に依らない 3 つの記号（state-dir / repo-tracked / repo-git）で rm の区分の規則の行が持ち、実行のたびに解きます。その行が無ければ止める側に倒し、行を off にしたときだけ rm の区分が外れます。当たらない rm は通します。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1044]}
    goals: [GOAL1001, GOAL1003]
    figures: []
    note: "なぜ要るか: 人の手が入らなくても安全に進む（GOAL1001）から来ています。元に戻せない削除は憲法が禁じる操作で、器の置き場を消す rm は一度通ると取り返しがつかず、repo の管理下の file も未 commit の変更ごと消えうるので、戻せる経路（git rm）に揃えます。守る場所を machine ごとの path でなく記号で規則の行に置き（GOAL1003）、行き先を確かめられない削除は止める側に倒し、戻せる経路（git rm・退役の mv）へ向ければ、散文の注意書きに頼らずに済むからです（ADR-0056）。"
  - id: FR1075
    title: "host-guard の配線"
    pattern: event
    strength: must
    when: "器の口座の口（口座の登録と同じ subcommand・FR1058）に host-guard の配線が要求されたとき"
    shall: "器は host の面の全口座の settings.json を実体に解き、 実体ごとに 1 回だけ、 道具の直前に host-guard を呼ぶ hook 行 1 本（対象の道具と timeout は跨版で固定し足さない）を足すだけの merge で書く（host-guard を呼ぶ行が在れば触らず、 他の key と symlink を保つ）。 読めない実体は断って 1 byte も書かない。 出力は口座の数・実体の数・足した数・触らなかった数・断った数の 1 行で、 断った実体が 1 つ以上なら rc 2。 配線の正本は file で、 event は書かない"
    plain: "口座の口（口座を器に足す・退役させる subcommand）に「見張りの呼び出しをつなぐ」と頼まれたら、器は machine の宣言（host の面）にある全口座の settings.json を、道しるべ（symlink）の先の実体まで解き、実体ごとに 1 回だけ書きます。書くのは、道具の直前に器の見張り（host-guard）を呼ぶ hook の行 1 本を「足すだけ」で、対象の道具と待ち時間は版を跨いで固定して増やさず、行がすでにあれば触らず、他の設定と道しるべは保ち、読めない設定 file には 1 byte も書きません。結果は口座の数・実体の数・足した数・触らなかった数・断った数の 1 行で、断った file が 1 つでもあれば終了コード 2 です。つないだかどうかの正本は設定 file そのもので、記録（event）には書きません。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1045]}
    goals: [GOAL1001, GOAL1003]
    figures: []
    note: "なぜ要るか: 人の手が入らなくても安全に進む（GOAL1001）から来ています。見張り（FR1056 / FR1072 / FR1074 / FR1076 / FR1080）が口座の設定を読む全 session に効くのは、口座の設定 file に呼び出しの行があるときだけです。その行を machine ごとの配備 script や手書きに任せると、machine 固有の値が散り、欠けても気づけません。器の口が実体へ足すだけの merge で書き、正本を file に置いて健康診断（FR1073）が実測すれば（GOAL1003）、配線の欠けが黙って残らないからです（ADR-0056）。"
  - id: FR1076
    title: "台帳の破壊と素 write の拒否"
    pattern: unwanted
    strength: must
    when: "口座の設定を読む session が撃つ Bash の bd / bdw の segment が、 cwd の repo が .beads と scripts/bdw を root に持つ周に、 台帳の破壊の語列（rules 行 host_guard.ledger）か台帳 write の 4 形（素 write。 起票の門と同じ判定・rules 行 ledger.denied_writes）に当たるとき、 または起票の門の rules 行が不発効で rules 行 host_guard.ledger が on の周に bd / bdw の書き込みの subcommand を撃つとき"
    shall: "器の host-guard は実行の前に deny し、 断る理由に台帳の種類と当たった語列か形を告げる。 rules 行 host_guard.ledger の enabled は語列と形の両方を切り、 起票の門の rules 行が不発効の周の全 deny も rules 行 host_guard.ledger が on のときだけで、 読みの subcommand は通す。 foreign の台帳（-C・--db・--global・別 prefix）は対象の外"
    plain: "口座の設定を読む session が撃つ bd / bdw（作業の記録簿＝台帳の道具）の command は、作業中の repo の root に台帳（.beads）と台帳の script（scripts/bdw）の両方があるときだけ見張ります。台帳を壊す語の並び（見張りの台帳の規則の行）か、起票の門と同じ 4 つの書き込みの形（素 write。起票の門の規則の行）に当たれば、器の見張り（host-guard）が実行の前に止め、区分と当たった並びか形を告げます。見張りの台帳の行を off にすると語の並びも形も止めなくなります。起票の門の行が効いていない（無い・off など）ときは、見張りの台帳の行が on のときだけ、bd の書き込みの subcommand を全部止めます（読むだけの subcommand は通します）。別の台帳（foreign の台帳。-C・--db・--global・別の prefix）は見張りません。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1046]}
    goals: [GOAL1001, GOAL1003]
    figures: []
    note: "なぜ要るか: 人の手が入らなくても安全に進む（GOAL1001）から来ています。作業の記録簿（台帳）を壊す語の並びと、台帳の script を経ない書き込み（素 write）の判定は、器の中では器の plugin を積む席の hook の入口（command guard と起票の門）にしかありません。判定の本体を器の外の script に置くと、本体が消えたときに黙って通ります。同じ規則の行と同じ判定を見張り（host-guard）が使えば（GOAL1003）、台帳を持つ repo でだけ、どの session からでも同じ形で止まるからです（ADR-0056）。"
  - id: FR1077
    title: "regate（裁定つきの 1 段戻し）"
    pattern: event
    strength: must
    when: "便に裁定の逐語を添えて regate（gate の判定が FAIL の Gated の便を Implemented へ 1 段戻す器の口）が要求されたとき"
    shall: "器は、 段が Gated ∧ 判定が FAIL ∧ 所有者の印が無いか印の process が退役 ∧ 逐語が非空、 の 4 つを全部満たす周だけ、 便の記録に段 Implemented と裁定の逐語を持つ記帳を 1 件書いて戻し（worktree・commit・判定の記録には触れない）、 戻った便は同じ worktree で再開の候補になる（FR1068 の regate の種目）。 1 つでも外れる周と、 判定か所有者の印を読めない周は、 何も書かずに理由 1 行で断る。 戻した直後は段が Implemented なので、 gate が再び Gated を記帳するまで次の regate は段の条件で断られる（1 つの FAIL につき戻すのは 1 回）。 器は FAIL の理由（契約の赤か・器の欠陥か・環境か）を自分では分類せず、 裁定なしに自動では戻さない"
    plain: "gate の結果が不合格（FAIL）で止まった便を、人が裁定の逐語（言葉をそのままの字面で）を添えて Implemented〔実装が済んで gate を待つ段〕へ 1 段だけ戻す口が regate です。器が戻すのは 4 つの条件を全部満たすときだけです。段が Gated であること、gate の結果が不合格であること、便を運ぶ process の所有者の印が無いか、その process が退役していること、逐語が空でないことです。戻すときは便の記録に段と逐語を持つ記帳を 1 件だけ書き、作業の場所（worktree）・commit・gate の結果の記録には触れません。戻った便は同じ作業の場所で再開の候補になります（FR1068）。条件が 1 つでも外れるときと、結果や所有者の印を読めないときは、何も書かずに理由を 1 行で告げて断ります。戻した直後は段が Implemented なので、gate がもう一度 Gated の段を記帳するまで次の regate は段の条件で断られます（1 つの不合格につき戻せるのは 1 回）。不合格の理由（契約の赤か・器の欠陥か・環境か）を器が自分で分けることはせず、裁定なしに自動で戻すこともしません。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1047, AC1038]}
    goals: [GOAL1001, GOAL1003]
    figures: []
    note: "なぜ要るか: 人の手が入らなくても安全に進む（GOAL1001）と記憶に頼らない（GOAL1003）から来ています。gate の一時の赤（負荷や環境）で落ちた便を捨てると、実装役の成果が消えます。かといって器が赤の理由を自分で分類して戻すと、契約の赤を無限に撃ち直す形が作れてしまいます。理由の分類は裁定であって述語ではないので、人が裁定の逐語を添えたときだけ戻します。戻したことは記帳 1 件を正本として残し、後から誰が何を根拠に戻したかを読めるようにします（GOAL1003）。"
  - id: FR1078
    title: "heartbeat の決め方と管理 tick の健全"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "器は、 管理 tick（FR1027）が黙った席へ送る打刻の合図を heartbeat と呼び、 heartbeat を席ごとに決める口（seat heartbeat on|off|default|status）を持つ。 on は明示 on の記録を、 off は明示 off の記録を、 それぞれ席の状態の dir に 1 つ（1 行・時刻）置いて他方を消し、 default は両方を消す（可逆・ADR-0092）。 明示 off の記録は ADR-0070 の停止の記録と同じ置き場と形で、 既に在る停止の記録は明示 off と読む。 heartbeat の実効の値は次の順で決まり、 決まり方を閉じた 3 語で名乗る — (1) 明示の記録が 1 つだけ在る周はその値（explicit）で、 明示の記録が 2 つとも在る周と在るのに読めない周は off（explicit）、 (2) 明示の記録が無く、 席の置き場が属する群の表の行（群か park の区画）が任意の key heartbeat（on か off）を持つ周はその値（group）、 (3) それ以外は種類の既定で、 群の置き場の席は on・park の区画の置き場の席は off・群の表のどの行にも属さない席は on（default）。 口の default は明示の記録を消す操作で、 決まり方の default は (3) で決まったことを指す。 群の表の行の key heartbeat が on と off の外の値を持つ host の面は FR1057 の読みで断る（fail-closed）。 実効の値が off の席には管理 tick は合図を送らず判定行に理由 heartbeat-off を出し、 死んだ席の起こし直し（FR1059）・移動の周の退避・群の移動の判定（FR1038）・park の移り先の判定（FR1095）はそのまま撃つ（管理 tick は止めない）。 管理 tick は周ごとに席の状態の dir へ最後の周の打刻（時刻・判定・理由の 1 行・rc 1 の周も）を書き、 seat tick status は席ごとに最後の周の時刻・経過・健全（経過が周期の rules 行の 2 倍以内）・heartbeat の実効の値・決まり方・梯子の段・次の合図の 7 項目を、 seat heartbeat status は実効の値と決まり方と最後の周の打刻の 3 項目を、 doctor の席の行は heartbeat の実効の値と管理 tick の健全の 2 項目を出す。 健全かを判じるのは読み手で、 管理 tick は判じない。 外の読み手（別 project の画面など）は heartbeat の実効の値を器の口の出力から読み（記録の file の有無は実効の値でない）、 on / off / default は器の口を撃つ（明示の記録の書き手は器の口 1 本で、 管理 tick は書かない）。 最後の周の打刻は event log に書かない（ADR-0070）"
    plain: "席を見回る管理 tick が、黙っている席に送る合図（打刻の合図）を heartbeat と呼びます。heartbeat は席ごとに決められます（scribe2 seat heartbeat on|off|default|status）。on は「明示 on」の記録を、off は「明示 off」の記録を席の dir に 1 つ置いて他方を消し、default は両方を消します（戻せます・ADR-0092）。明示 off の記録は前の決定（ADR-0070）の停止の記録と同じ置き場と形で、すでにある停止の記録は明示 off と読みます。実際に送るかどうか（実効の値）は次の順で決まり、どこで決まったか（決まり方）を 3 つの語で名乗ります。(1) 明示の記録が 1 つだけあればその値（explicit）。2 つとも在るときと、在るのに読めないときは off（explicit）。(2) 明示の記録が無く、席の置き場が属する、かたまりを宣言する表（群の表）の行（群か park の区画 Tier9 の行）に任意で書く heartbeat の key（on か off）があればその値（group）。(3) それ以外は種類の既定で、かたまりの席は on・park の区画の席は off・どちらにも属さない席は on（default）。口の default は記録を消す操作で、決まり方の default は (3) で決まったという意味です。行の heartbeat の key が on と off の外なら、host の設定の読みの時点で断ります（FR1057）。off でも管理 tick 自体は止まらず、死んだ席の起こし直し（FR1059）・口座の移動のための退避・かたまりの移動の判定（FR1038）と park の移り先の判定（FR1095）はそのまま動き、合図だけ送りません（判定の行には heartbeat-off と残ります）。管理 tick は毎周「最後に周った時刻と判定と理由」を席の dir に 1 行残し（失敗した周も）、seat tick status がそれを読んで、最後に周った時刻・経過・健全か（周期の 2 倍以内に周ったか）・heartbeat の実効の値・決まり方・梯子の段・次の合図の 7 つを席ごとに出します。seat heartbeat status は実効の値と決まり方と最後に周った記録の 3 つを、doctor の席の行は実効の値と健全かの 2 つを出します。健全かを判じるのは読む側で、管理 tick は判じません。画面（別 project の GUI など）は heartbeat の実効の値を器の口の出力から読み（記録の file が在るかどうかは実効の値ではありません）、on・off・default は器の口を叩きます（明示の記録を書くのは器の口だけで、管理 tick は書きません）。最後に周った記録は出来事の log には書きません（ADR-0070）。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1048, AC1064]}
    goals: [GOAL1001, GOAL1002]
    figures: []
    note: "なぜ要るか: 自律安全（GOAL1001）と消費は害（GOAL1002）から来ています。合図だけを席ごとに決める口が無いと管理 tick の timer ごと止めるしかなく、口座の移動と死んだ席の起こし直しも止まります（GOAL1001）。合図を受けない席は token を消費しません（GOAL1002）。健全かを読む側が判じることと書き手を器の 1 本にする理由は ADR-0070 が、明示の記録を 2 つにし、行の key と種類の既定で既定を決める理由と採らなかった案は ADR-0092 が持ちます（持ち主の裁定 2026-09-26T00:53Z・2026-09-28T01:55Z・02:00Z）。"
  - id: FR1079
    title: "裁定の指し示し"
    pattern: event
    strength: should
    when: "器の口（seat deliver）が撃たれたとき"
    shall: "器は、 宛先の席に登録 row（FR1040）が在り、 撃たれた時点で席の状態の打刻の最終行が idle で入力欄が空いているときにだけ、 渡された裁定面の記帳 id 1 つ（ASCII の英数字と 4 つの記号（ピリオド・ハイフン・下線・コロン）だけの 1 語・長さの上限は器の定数）を指し示しの雛形に入れた 1 行（裁定が届いた旨の指し示し・裁定の逐語と続きの指示は持たない）を、 管理 tick（FR1027）と同じ入力欄の門を通して 1 回差し込み、 結果（送れた・断った理由）を 1 行で返す。 空の id・文字種の外（空白・制御文字・4 つの記号の外の ASCII 記号・ASCII の外の文字を含む）の id・長さの上限を越える id・登録 row の無い宛先・打刻の最終行が idle でない席（考え中・打刻が無い・読めない）・入力欄に文字が在る席は 1 key も送らず typed な理由の語で断る。 送る行に入る外からの値は記帳 id 1 つだけで、 口のほかの引数（置き場・宛先・道具の差し替え）は送る行に入らない（席間の連絡の経路にしない・FR1044）。 器は撃ち手・裁定面の書き込みの有無・裁定の中身を確かめない（撃つのは裁定面が自分の置き場に裁定を書いた後・中身は消費側が自分の置き場から読む・ADR-0077）"
    plain: "器の口（seat deliver）が撃たれると、器は待っている席へ「裁定が届いた」の 1 行を 1 回だけ送ります。撃つのは、別の project の裁定面（持ち主が裁定を書き込む画面と server）が自分の置き場に裁定を書いた後です。器は、誰が撃ったか・裁定が本当に書かれたか・裁定の中身を確かめません（中身は消費側の仕組みが自分の置き場から読みます）。送るのは器が決めた形（指し示しの雛形）の 1 行で、送る行に入る外からの値は裁定面の記帳 id 1 つだけです（ASCII の英数字と 4 つの記号（ピリオド・ハイフン・下線・コロン）だけの 1 語で、長さに上限があります）。行は届いたことを知らせるだけで、続きを促す文は持ちません。送り先は、登録（FR1040）があり、撃たれた時点で状態の打刻の最終行が「待っている（idle）」で、入力欄が空いている席だけで、送る前の入力欄の確かめ（入力欄の門）は管理 tick（FR1027）と同じです。結果（送れた・断った理由）は 1 行で返します。空の id・形の外の id（空白・制御文字・4 つの記号の外の ASCII 記号・ASCII の外の文字を含む）・長すぎる id・登録の無い宛先・考え中の席や打刻が無い・読めない席・入力欄に文字が在る席には、キーを 1 つも（Enter も）送らずに理由の語を返して断ります。宛先や置き場などほかの引数の値は送る行に入らないので、席どうしの連絡の経路にしない作りです（FR1044・ADR-0077）。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1049]}
    goals: [GOAL1001, GOAL1003]
    figures: []
    note: "なぜ要るか: 自律安全（GOAL1001）と記憶に頼らない（GOAL1003）から来ています。待っている席は、放っておくと次の管理 tick の合図まで裁定に気づかず、持ち主との対話が止まります（GOAL1001）。知らせるのは裁定の在りかの指し示しだけで、中身は消費側の仕組みが自分の置き場から読んで席へ届けるので、差し込まれた文を裁定の出所にしません（GOAL1003）。送る行に入る外からの値を記帳 id に絞る理由と、送る前の確かめを管理 tick と揃える理由は ADR-0077 が持ちます（持ち主の裁定 2026-09-27T00:51Z）。"
  - id: FR1080
    title: "公開の字面の走査"
    pattern: unwanted
    strength: must
    when: "口座の設定を読む session が撃つ Bash の公開の segment のうち、 publish の種類の rules 行が無いとき、 または rules 行の enabled が true の周に、 repo の全履歴を走査なしに出す command（repo の可視性を public へ変える・public の repo を作る）であるか、 公開先の repo（push の行き先か gh の対象）か出ていく字面が解けない（読めない字面を含み、 owner/name を導けないことは含まない）か、 判定がどの段でも締め切り（NFR1005）に間に合わないか、 host の面を読めない（FR1057）か、 公開先の repo が private と実測できず隣の private repo が 1 つ以上在り、 出ていく字面が隣の private repo の識別子の 4 形（repo の名・object id・tracked path・台帳 id）のどれかを 1 つでも含むか読む上限（NFR1005）を越えるとき"
    shall: "器の host-guard は実行の前に deny し、 断る理由として rules 行が無いことか、 host の面を読めないこと（FR1057・行番号）か、 全履歴を出す command の種別か、 解けない形か、 越えた上限の名か、 当たった識別子の形と語と repo の先頭 5 件と件数を告げ、 代わりの経路を理由ごとに示す（rules 行は裁定を添えて置く・host の面は行番号の行を直す・全履歴を出す command は user が行う・解けない形は解ける形で書き直す・上限は分けて出す・締め切りは撃ち直す・識別子は消して「隣の project」と件数に言い換えて出し直す）。 判定の順は、 rules 行（無い周は fail-closed で断り、 enabled が false の周は publish の種類を撃たずに通す）→ host の面の読み（読めない周は fail-closed で断る・FR1057）→ 全履歴を出す command（器が持つ閉じた形の一覧〔可視性を public へ変える gh repo edit と gh api の書き・public の repo を作る gh repo create〕に当たる command を、 公開先の repo の可視性と隣の private repo の数に依らず GitHub に問わずに断る。 repo を編集する gh api のうち可視性の欄を解けない書きは解けない形とする）→ 解き（解けない周は隣の private repo が 0 の host でも断る）→ 可視性 → 走査で、 走査せずに通すのは、 enabled が false の周のほか、 解けた公開の segment のうち公開先の repo が private と実測できた周か、 隣の private repo が 0 の周（群の表の行を持たない host を含む）だけである。 群の表の行に公開先の repo の外の anchor が無い host は GitHub に可視性を問わない。 可視性は GitHub に問い（送るのは公開先の repo と、 群の表の行（群と park の区画）の anchor のうち実体が在り公開先の repo と別のものの owner/name〔導き方は glossary の公開先の repo〕と、 remote の先端の問いだけ・A1 の解釈は ADR-0078）、 読めない可視性と owner/name を導けない repo の可視性は、 公開先の repo なら public・群の表の行の anchor なら private と読む。 識別子の 4 形（照合の単位は glossary）の一覧は publish の種類の rules 行が持ち（行の値は形の記号の閉じた列だけ・除外の要素を持つ行の断りは FR1057）、 無害と裁定した字句は公開の除外の表（host の面）が字句のまま持つ（行は裁定 id を持ち、 欄が無いか空の行の断りは FR1057・行を求める台帳の問いは effect を operation で立て、 document で立てた問いは未反映の裁定〔FR1084〕に数えられて待たせる側に倒れる・ADR-0093）。 公開の segment でない周、 publish の種類は git と gh を撃たない"
    plain: "口座の設定を読む session が、git の push や、gh の本文を出す命令と repo を作る・編集する命令（公開の segment）を撃つと、器の見張り（host-guard）は実行の前に次の順で判じます。まず publish の種類の規則の行を読み、行が無ければ止め、off なら何も調べずに通します。次に host の面を読み、読めなければ止めます（FR1057・直すのは告げた行番号の行です）。次に、repo を public に切り替える命令と public の repo を作る命令（器が形の一覧を持ち、gh api で可視性を変える書きも含みます）は、repo の全履歴を調べずに出してしまうので、出す先の repo の可視性や隣の private repo の数に依らず、GitHub に問わずに止めます（その操作は人が行います）。次に出す先の repo（公開先の repo）と出ていく文字を解き、解けない・読めないときは隣の private repo が 0 の host でも止めます。次に public か private かを GitHub に問い合わせます。送るのは、公開先の repo と、host の面のかたまりを宣言する表（群の表）の行に登録した repo（anchor・park の区画 Tier9 に置いた repo も含みます）のうち実体が在り公開先の repo と別のものの owner と名と、remote の先端の問いだけで、これを外へ出してよい範囲とする解釈は ADR-0078 が持ちます。owner と名は、git が実際に押す先の URL（gh の出す先は gh 自身が解いた repo）から同じ規則で導き（GitHub の外の host の URL からは導きません）、同じ repo かは owner と名の一致で判じ、owner と名を導けない repo は確かめられない可視性として扱います。群の表の行に公開先の repo の外の repo が無い host は問い合わせません。確かめられない可視性は、公開先の repo なら public、群の表の行の repo なら private と読みます（止める側に倒します）。公開先の repo が private と確かめられたときと、群の表の行の repo のうち実体が在り公開先と別で public と確かめられないもの（隣の private repo）が 0 のとき（群の表の行を持たない host を含む。park の区画だけを宣言した host は行を持つ host です）は、調べずに通します。最後に出ていく文字（出ていく commit の説明文・書いた人と commit した人の名・変更の足した行と file の path・押す tag の説明・押す branch や tag の名・gh の本文と本文の file）を調べ、隣の private repo の識別子（repo の名・隣の repo が持ち、公開先の最新から辿れない commit などの id〔7 桁以上に縮めた形も含む〕・/ を含み、隣の git が追う file の path を / の区切りで切った末尾と一致し、公開先の最新に無い path・隣の台帳の id の 4 つの形）が 1 つでもあるか、出ていく文字が読む上限を越えれば止めます。repo の名は、出ていく文字と名をともに ASCII の英数字と _ の外の字（- や . や / を含む）で区切った部分の並びで、大文字と小文字を区別せずに照合し、一般的な単語の名でも除きません。公開の規則の行が持つのは識別子の形の記号の列だけで、除外の要素を持つ行は読みの時点で断ります（FR1057）。repo の名の当たりのうち除くのは、持ち主の裁定で足した無害な字句（公開の除外の表）を同じ区切りで切った並びと、大文字と小文字を区別せずに一致するところの中の当たりだけで、表は host の面（state dir ごとに置く host 固有の宣言で、git で追わない場所）に字句のまま持ちます。表の行は裁定 id を持ち、裁定 id の欄が無いか空の行があれば host の設定の読みの時点で断ります（FR1057・ADR-0093）。表の行を求める台帳の問いは effect を operation（操作で済む）で立てます。document で立てると写されていない裁定（FR1084）に数えられ、待たせる側に倒れます。どの段でも調べが締め切りに間に合わないときも止めます（数値は NFR1005）。止めるときは理由と、理由ごとの代わりの道を告げます（規則の行が無いなら持ち主の裁定を添えて行を置く・識別子なら当たった形と語と repo を先頭 5 件と件数で示して、識別子を消して『隣の project』と件数に言い換えて出し直す・解けない形なら解ける形で書き直す・上限なら分けて出す・締め切りなら撃ち直す・全履歴を出す命令なら人が行う）。公開の segment でないとき、publish の種類は git も gh も撃ちません。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1050, AC1023, AC1063]}
    goals: [GOAL1001, GOAL1003]
    figures: []
    note: "なぜ要るか: 人の手が入らなくても安全に進む（GOAL1001）と記憶に頼らない（GOAL1003）から来ています。public の repo へ出た push は取り消せないので、止めるなら撃つ前でなければなりません。公開の前に相手の可視性を確かめ差分を目で探す手順は散文の規則なので、手順が抜けた回には隣の private repo の内部の事実がそのまま public の repo へ出ます（GOAL1003）。器の見張りが公開の直前に同じ判定を撃てば、口座の設定を読むどの session からも同じ形で止まり、器の着地には FR1011（main に載せる前）と FR1050（push の前）が同じ判定を掛けます（GOAL1001）。見張りの種類に足す理由と、GitHub へ問い合わせることを外へ出してよい範囲とする解釈は ADR-0078 が持ちます（持ち主の裁定 2026-09-27T17:39Z・2026-09-27T22:21Z・2026-09-27T23:55Z）。無害な字句の表を host の面に字句のまま置く理由と採らなかった案は ADR-0093 に在ります（持ち主の裁定 2026-09-29T05:46Z）。"
  - id: FR1081
    title: "起票の門の 4 つの断り"
    pattern: unwanted
    strength: must
    when: "器の plugin を積む席の session が、 自分の道具の呼び出しとして台帳の書き（bd / bdw の command の字面）で次の (a)〜(d) のどれかを撃とうとするとき（席が起こした子 process の書き〔Bash から起こした常駐の server など〕は道具の呼び出しでないので門の外）＝(a) label intake:question を持つ bead の create のうち、 本文が 4 つの行（概要・技術・理由・推奨で始まる行）のどれかを欠くか、 metadata の effect を欠くか、 effect の値が閉じた 2 値（document＝答えを文書へ写すべき問い・operation＝答えが操作で済む問い）の外である書き、 metadata の asked（FR1089）を欠くか値が閉じた 2 値（seat・user）の外である書き、 label intake:memo を併せ持つ書き、 または親の bead を名指しながら親の label を継がない指定を持たない書き、 (b) notes に裁定の行（裁定 id の欄を持つ行・FR1082）を足す書き、 (c) 引き金の行（FR1087）を持たない memo の create と、 昇格条件の節を引き金の行の無い本文へ書き換える update、 (d) 台帳の repo（cwd から上へ辿って最初に .beads を持つ dir）の HEAD の vessel 宣言が任意 key close-check を true で持つ repo か、 宣言が在って読めない repo での、 bead の close のうち close の理由が close の理由の文法（FR1091）の外である書き（理由の無い close を含む）と、 着地の形（FR1091）の close の理由を持つ書き（その repo では着地の形は land の終端〔FR1050・FR1096〕だけが書く）（git を撃てない周は宣言が無いのと同じに読み、 .beads を持つ祖先が無い周は (d) に当たらず、 宣言が在って読めない repo でも (d) に当たるのは上の 2 形の書きだけで、 (a)〜(c) は全部の repo の書きに当たる）"
    shall: "器の起票の門は実行の前に deny し、 断る理由に形ごとの中身（(a) は欠けた欄・外れた値・併せ持つ label・継ぐ親の label、 (b) は裁定の行を書くのは器の口〔seat ruling bind と裁定面の答えの口・FR1082〕だけであること、 (c) は引き金の 5 形、 (d) は close の理由の文法か、 着地の形を書くのは land の終端だけであること、 宣言が在って読めない repo では読めない旨と当たった形）を告げ、 台帳を変えない。 器が問いとして読む記録は label intake:question の bead だけで、 この label を持たない bead の create には (a) の検査を掛けない"
    plain: "要するに、台帳への書き込みのうち決まった 4 つの形を、器の門が実行の前に止める、という決まりです。器の plugin を積む席の session が自分の道具の呼び出しとして台帳に書くとき（bd か bdw の command）、器の起票の門は次の 4 つを止めます（席が起こした子 process〔Bash から起こした常駐の server など〕の書き込みは道具の呼び出しではないので、この門は判じません）。1 つ目は、「問い」の印（label intake:question）を付けた記録（台帳の問い）の起票で、本文に「概要」「技術」「理由」「推奨」で始まる 4 つの行のどれかが無いか、付帯の情報（metadata）に effect（答えを文書へ写すべき問いなら document、操作で済む問いなら operation）が無いか、その 2 つの値の外のもの、問いのきっかけ（asked・seat か user・FR1089）が無いかその 2 つの値の外のもの、memo の印（label intake:memo）も併せ持つもの、親の記録を名指しながら親の印を継がない指定を持たないものです。2 つ目は、notes に裁定の行を足す書き込みで、裁定の行を書くのは器の口（seat ruling bind と裁定面の答えの口・FR1082）だけです。3 つ目は、引き金の行（FR1087）を持たない memo の起票と、昇格条件の節を引き金の行の無い中身に書き換える更新です。4 つ目は、close の理由が決まった形（FR1091）の外である close（理由の無い close を含む）と、着地の形の理由を持つ close（門の掛かる repo では、着地の形は land の終端〔FR1050・FR1096〕だけが書きます）です。4 つ目だけは、台帳の repo（席がいま居る dir〔cwd〕から上へ辿って最初に .beads を持つ dir）の、いま取り出している commit（HEAD）の設定 file（vessel 宣言・commit していない字は読みません）が close-check を true で持つ repo と、設定 file が在って読めない repo でだけ止めます。close-check が無いか false の repo・設定 file が無い repo・.beads を持つ dir が見つからないとき・git を動かせないとき（設定 file が無いのと同じに読みます）は止めません（1〜3 つ目は全部の repo で止めます）。止めるときは形ごとに、欠けた欄か外れた値・裁定の行は器の口だけが書くこと・引き金の 5 つの形・close の理由の決まった形か着地の形は land の終端だけが書くこと（設定 file が在って読めない repo では、読めないことと当たった形）を告げ、台帳は変えません。設定 file が在って読めない repo でも、close のうち止めるのは 4 つ目の 2 つの形だけで、形に合う close は通します。器が問いとして読むのは「問い」の印を付けた記録だけで、印の無い記録の起票には 1 つ目の検査を掛けません。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1051, AC1059, AC1061]}
    goals: [GOAL1003, GOAL1001]
    figures: []
    note: "なぜ要るか: 記憶に頼らない（GOAL1003）と自律安全（GOAL1001）から来ています。問いと答えと写すべきかを決まった形で台帳に残せば、答えを結ぶ先と写し忘れを機械が数えられ（FR1084）、裁定の行と memo の条件も同じ門で形を守れるので、席の手順に頼らずに済みます。形は持ち主の裁定 2026-09-28T00:05Z・2026-09-28T00:54Z・2026-09-28T13:14Z に従い、経緯と却下した案は ADR-0083（(a) の元の形と (b)・(c)）・ADR-0087（asked と印）・ADR-0089（(d)）と ADR-0094（(d) の land の終端の 3 つの経路）と ADR-0097（(d) を、設定 file〔vessel 宣言〕が close-check を true で持つ repo と、宣言が在って読めない repo に限る形）に在ります。(d) を全部の repo に掛けないのは、器の便でない着地で自由な字の理由で閉じる運用の repo では席の閉じがほぼ全部止まるためです（持ち主の裁定 2026-09-29T21:53Z）。宣言が在って読めない repo に掛けるのは、読めない宣言を無いと読むと close-check を持つ repo が字の誤り 1 つで門の外へ出るためです（ADR-0097 の分析・器の憲法 C10）。"
  - id: FR1082
    title: "発話の記帳と裁定の結び"
    pattern: event
    strength: must
    when: "user が、 marker が器の NAME を言う repo（FR1019 / FR1024）で器の plugin を積む対話の session（runner と lens を除く）へ prompt を打ったとき、 器の口 seat ruling bind（問いの bead の id と発話の ts を受ける）が撃たれたとき、 または裁定面の答えの口（問いの bead の id を受け、 逐語を command の字面の外で受ける）が撃たれたとき、 または席の道具の呼び出しが答えの口の command を撃とうとするとき"
    shall: "prompt が打たれたときは、 器は、 prompt が model に読まれる前に、 打たれた prompt を、 開いた台帳の問いの有無に依らず、 逐語のまま発話 event（actor が human・発話を指す値は発話の ts〔器が発話ごとに一意に振り、 同じ秒の発話は秒より下の桁で分ける〕・session と発話の経路〔対話の session〕を持つ）として fleet の event log に 1 件記帳し、 器が入力欄へ差し込んだ行（FR1044 の閉じた一覧の全種・管理 tick の打刻の合図を含む）と別の session から届いた message の包みは記帳しない。 bind が撃たれたときは、 名指した発話 event が在って名指した問いへまだ結ばれておらず（1 つの発話は複数の問いへ結べる）、 名指した bead が開いた台帳の問いである周だけ（問いは発話の後に起こしたものでもよい）、 器が裁定 id（<問い id>:<YYYYMMDDTHHMMZ>-<n>・bind が発行する id の n は 1 で、 形の -<n> は消費側の台帳の行の形と揃えるために持つ）を発行し、 問いの notes に裁定の行（裁定 id・問い・発話の ts・発話の経路・逐語の順の 5 欄を持つ 1 行・逐語は発話 event から写して最後の欄に置く・4 欄の既存の行は発話の経路を対話の session と読む）を書き、 問いを裁定の形（FR1091）の close の理由で close し、 裁定 event（問いの asked・問いの起票の時刻・発話の ts・発話の経路を持つ・FR1089）を記帳する。 発話が無い・発話がその問いへ結び済み・問いが閉じている・bead が台帳の問いでない周は何も書かずに理由を名指して断る。 裁定面の答えの口が撃たれたときは、 逐語が空白だけの周と、 問いが閉じているか bead が台帳の問いでない周は、 発話 event も含めて何も書かずに理由を名指して断り、 通る周は逐語を発話の経路が裁定面の発話 event として記帳し、 同じ周に bind と同じ書き（裁定 id の発行・裁定の行・close・裁定 event）を行って、 裁定 id を 1 行で返す。 答えの口は承認 event（FR1016）を記帳しない（承認は便の承認の口だけが受ける・器の憲法 C7・ADR-0087）。 席の道具の呼び出しが答えの口の command を撃とうとするときは、 器の hook の入口が実行の前に断る（席が起こした子 process の撃ちは門の外）。 席が notes に裁定の行を書く書きは FR1081 が断り、 器は、 席の道具の呼び出しが逐語を渡して裁定 event を記帳する口を持たない（ADR-0087）"
    plain: "要するに、user が打った字（または裁定面で書いた字）をそのまま記録し、席は問いとその字を結ぶだけ、という決まりです。器を導入した repo（目印 .vessel に器の名が書かれた repo）で、user が対話の session（実装役と審査役を除きます）へ文を打つと、器はその文が model に読まれる前に、開いている台帳の問いの有無に依らず、一字一句そのまま人が打った字の記録（発話 event。打った時刻がその発話を指し、session と発話の経路も持ちます）として出来事の log に残します。器が入力欄へ差し込んだ行（FR1044 の決まった一覧の全部。管理 tick の打刻の合図も含みます）と、別の session から届いた message の包みは残しません。席は器の口（seat ruling bind）に問いの番号と発話の時刻を渡して、問いと答えを結びます。器は、その発話が在ってその問いへまだ結ばれておらず（1 つの発話を複数の問いへ結べます）、その問いがまだ開いている台帳の問いであるときだけ（問いは発話の後に起こしたものでも構いません。問われる前に user が出した指示も、席が後から問いを起こして結べます）、裁定 id（<問いの番号>:<UTC の年月日と時分>-1 の形。末尾の番号は、器を導入した別の repo の台帳の書き方と形を揃えるために持ち、この口では 1 です）を発行し、問いの notes に裁定の行（裁定 id・問い・発話の時刻・発話の経路・user の言葉の順に 5 つを持つ 1 行。言葉を最後に置くのは、言葉の中の区切りの字で後ろの欄が割れないためです・ADR-0083。4 つを持つ既存の行は、発話の経路をチャット〔対話の session〕と読みます）を書き、裁定の形（FR1091）の理由で問いを閉じ、裁定の記録（裁定 event。問いの asked・問いを起こした時刻・発話の時刻・発話の経路を持ちます・FR1089）を残します。言葉は人が打った字の記録から写すので、席は言葉を自分で打ちません。発話が無い・その発話がその問いへもう結ばれている・問いが閉じている・問いでない記録のときは、何も書かずに理由を告げて断ります。席が notes に裁定の行を書こうとすると、起票の門が止めます（FR1081）。裁定面（消費側の project の、裁定を書く画面）の答えの口では、空白だけの言葉・閉じた問い・問いでない記録への答えを何も書かずに断り（言葉は command の文字の外で受けます）、通るときは言葉を発話の経路が裁定面の発話として記録し、同じ書き込みで問いに結んで、裁定 id を 1 行で返します。答えの口は承認の記録を作りません（承認は便の承認の口だけが受けます）。席が自分の道具の呼び出しでこの口を撃つと、器の hook が実行の前に止めます（席が起こした子 process からの撃ちは門の外です）。席の道具の呼び出しが言葉を渡して裁定を記録する口はありません。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1052, AC1058, AC1059]}
    goals: [GOAL1003, GOAL1001]
    figures: []
    note: "なぜ要るか: 記憶に頼らない（GOAL1003）と自律安全（GOAL1001）から来ています。bind では裁定の言葉は必ず器が記録した発話の写しになり、席は言葉を自分で打てないので、席の手順に頼らずに問いと答えの組が台帳に残ります。裁定面の答えの口は席の道具の呼び出しからは撃てませんが、席が起こした子 process からの撃ちは止めず、発話の経路で分けて残し数えます（信頼の線を画面の分だけ下げる形です）。問いと答えを結ぶ形は user の裁定 2026-09-28T00:05Z に、打った字を問いの有無に依らず記録する範囲は user の裁定 2026-09-28T09:04Z に、裁定面の答えを同じ裁定の行にする口は user の裁定 2026-09-28T13:47Z に従い、経緯と却下した案は ADR-0083 と ADR-0087 に在ります。"
  - id: FR1083
    title: "裁定 id の実在"
    pattern: unwanted
    strength: must
    when: "main（着地では便の base）の vessel 宣言が任意 key ruling-check を true で持つ repo で、 受付に出た契約の設計の節か契約表の行、 または着地の差分が足す字面が、 解けない裁定 id か、 opt-in の線（ruling-check が main の履歴で初めて true になった commit）の後に足された時刻の形（user <UTC の時刻>）の引用（引用に数える字面は閉じた規則が決める）を持つとき、 または着地の差分が足すか変える判断の欄（rules 行の ruling 欄・ADR の approval の裁定の欄・設計の節の裁定の欄）が引用に数える問い id の形（FR1082）の裁定 id を 1 つも持たないとき、 または着地の差分が引用に数える問い id の形の裁定 id を足さずに ruling-check を true から外すとき"
    shall: "器は、 受付では契約を便にせず typed な理由で断り、 着地では FR1010 の留め（main に載せず Gated に留め、 理由の event は FR1010 の形で記帳する）に掛け、 どちらも当たった裁定 id か欄を名指す。 引用は、 追跡された file の字面から裁定 id の閉じた 3 形（問い id の形・batch: で始まる形・policy: で始まる形）と時刻の形を拾う閉じた規則で数える（字面を数えるだけで文書の意味は読まず、 FR1083 と FR1084 は同じ閉じた規則で引用を数える）。 問い id の形は、 問いの部分が repo の台帳の id の接頭辞（台帳が issue の id に付ける prefix）で始まるものだけを引用に数え、 ほかの接頭辞の問い id の形の字面は引用でない（数えも断りもせず、 一覧に載せる要も無い）。 batch: と policy: の形と opt-in の線の後に足された時刻の形は、 vessel 宣言の任意 key ruling-fixtures（字面の閉じた一覧）に同じ字面が在るものを引用に数えない（一致は字面の完全一致だけで wildcard などの型を持たず、 backtick や code の囲みなどの書式はどの字面も引用から外さず、 一覧に無い字面は引用に数える）。 解けるとは、 問い id の形はその id が閉じた台帳の問いの notes の裁定の行の裁定 id の欄と一致すること、 batch: と policy: の形は器を導入した別の repo（消費側）の台帳が自分の経路で書く裁定の行の裁定 id の欄か束の欄と一致することとする。 判断の欄が台帳の bead の id だけを引く形は、 その bead が在っても裁定 id に数えない。 opt-in の線より前から在る時刻の形の引用と、 差分に無い判断の欄は断らずに数え、 doctor の 1 行に main の追跡された file の中の解けない引用と線の前の時刻の形の引用の件数と id を出す"
    plain: "要するに、repo が選んだときだけ、文書が引く裁定の番号が台帳の本物の裁定に結ばれているかを器が確かめ、結ばれていないものを成果に使わせない、という決まりです。repo の宣言 file（vessel 宣言）に ruling-check = true を書いて選んだ repo で、器は、文書が引く裁定の番号（裁定 id）が台帳の閉じた問いの裁定の行に本当に在るかを確かめます。番号の形は決まった 3 つです。器の口が発行する問いの番号の形（FR1082）と、器を導入した別の repo（消費側）の台帳が自分の経路で書く裁定の行の batch: と policy: で始まる形で、後の 2 つはその台帳の裁定の行の裁定 id の欄か束の欄（消費側の台帳の行が持つことのある、もう 1 つの id の欄。器の結びの口が書く行には在りません）に一致すれば解けます。問いの番号の形は、この repo の台帳の番号の頭（接頭辞）で始まるものだけを数え、ほかの頭の番号の形の字（test の見本など）は引用に数えず、断りもせず、一覧に載せる要もありません（下の判断の欄の条件でも数えません）。ほかに、これまで使ってきた時刻だけの形（user <UTC の時刻>）がありますが、これは台帳の問いに結べないので、選んだ時点（ruling-check が main で初めて true になった commit。opt-in の線）より前の引用は数えるだけにし、後から足した引用は断ります。ただし test の見本のように、わざと台帳に無い番号を書く字もあるので、batch: と policy: で始まる形と線の後の時刻の形は、宣言の file の ruling-fixtures（見本の字をそのまま並べた決まった一覧）に一字違わず同じ字が在れば数えません。一覧に無い字は数え、backtick や code の囲みなどの書式で囲んでも外れません。受付に出た契約の設計の節か契約表の行が、台帳に無い番号・まだ開いている問いの番号・線の後に足した時刻の形を持つときは、受付で断って便にしません。着地の差分が同じものを足すときと、差分が足すか変える「判断の欄」（規則の行の裁定の欄・決定記録の承認の裁定の欄・設計の節の裁定の欄）が引用に数える問いの番号の形（この repo の台帳の接頭辞で始まるもの）を 1 つも持たないとき（ほかの頭の番号だけを持つ欄も、持たないのと同じです）は、main に載せずに待たせ（Gated・FR1010）、当たった番号か欄を名指す理由を記録します（同じ理由が続く間は記録し直さず、理由が変われば 1 件足します・FR1010）。判断の欄が台帳の記録の id だけを引く形は、その記録が在っても番号に数えません。記録の id は問いと答えの組を指さないので、持ち主の字に結ばれている証しにならないからです。ruling-check を true から外す差分も、引用に数える問いの番号（この repo の台帳の接頭辞のもの）を足さなければ断るので、裁定なしには確かめを外せません。器は字を数えるだけで文書の意味は読まず、FR1084 と同じ決まりで数えます。差分に無い判断の欄と線の前の引用は断らずに数え、doctor の 1 行に main の中の解けない引用と線の前の時刻の形の引用の件数と番号を出します。この文書の中の時刻の形の引用は、どれも線より前のもの（数えるだけ）です。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1053]}
    goals: [GOAL1003, GOAL1001]
    figures: []
    note: "なぜ要るか: 記憶に頼らない（GOAL1003）と自律安全（GOAL1001）から来ています。判断の欄が空でないことだけを見る形では、覚えている番号や手で写した字も裁定として門を通れますが、引用が台帳の閉じた問いの裁定の行に解けることを受付と着地で確かめれば、持ち主の字に結ばれない判断は成果に使えません。ただし、test の code の見本や決まった done の文の見本まで断ると、器自身の歯や消費側の repo の見本が通らなくなります。そこで、問いの番号の形は自分の台帳の接頭辞のものだけを数え、batch: と policy: の形と線の後の時刻の形の見本は宣言の閉じた一覧に一字違わず載せたものだけを外します。これとは別に、batch: と policy: の形は消費側の台帳の束の欄にも解けるようにします。消費側の行はその欄にも同じ形の id を書くからです。全体は持ち主の裁定 2026-09-28T00:05Z・2026-09-28T00:54Z に従い、見本の数え方と束の欄は後の裁定（決めてほしいことは推奨で進める）の下の orchestrator の決定です。経緯と却下した案は ADR-0083 に在ります。"
  - id: FR1084
    title: "未反映の裁定"
    pattern: state
    strength: must
    when: "effect が document の閉じた台帳の問いの裁定 id のうち、 main の追跡された file が 1 つも引かない id（未反映の裁定）が在る間"
    shall: "器は dispatch の周ごとに未反映の裁定の id の列を置き場の file に書き（0 件の周も空の列を書く・引用は FR1083 と同じ閉じた規則で数え、 vessel 宣言の ruling-check に依らない）、 doctor の 1 行に件数と id を、 管理 tick（FR1027）の打刻の合図の alarm に語 unreflected を出し、 その裁定 id を acceptance か notes で引く契約と、 その問いに blocks される契約を、 起動の列（FR1068）で理由 unreflected-ruling:<id> を持たせて待たせ、 着地の周はその契約の便を FR1010 の留めに掛ける。 それ以外の契約と便と、 裁定を文書へ写す変更のうち器の便でない変更は止めない。 未反映は main の追跡された file の字面だけで判じ、 裁定からの経過時間を判定に使わず、 effect が operation の裁定は数えない。 未反映の裁定が 0 件になった周は置き場の file の列が空になり、 doctor の行と alarm の語 unreflected が消える"
    plain: "要するに、持ち主が決めたことが文書に写されるまで、その決めごとに関わる契約だけを待たせて知らせる、という決まりです。答えを文書へ写すべき（effect が document の）閉じた問いの裁定の番号のうち、main の追跡された file がどれも引いていないもの（未反映の裁定）がある間、器は送り出しの周ごとに未反映の番号の一覧を置き場の file に書きます（0 件の周も空の一覧を書きます）。doctor の 1 行に件数と番号を出し、管理 tick の合図の末尾に目印 unreflected を付けます（FR1027）。その番号を受入条件か notes で引く契約と、その問いに blocks される（問いが閉じるまで待つ依存を持つ）契約は、起動の列で理由 unreflected-ruling:<番号> を付けて待たせ、着地の周もその契約の便を main に載せずに待たせます（Gated・FR1010）。それ以外の契約と便と、裁定を文書へ写す変更のうち器の便でないものは止めません。未反映かどうかは main の文字だけで判じ（数え方は FR1083 と同じで、ruling-check を書いたかどうかに依りません）、経った時間は使わず、答えが操作で済む（effect が operation の）裁定は数えません。未反映が 0 件になった周には、一覧が空になり、doctor の行と目印 unreflected が消えます。"
