    figures: []
    rules: [R-2, R-25]
    adrs: [ADR-3]
  - id: NFR4
    title: 面の server の軽さ
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: 面の server は、口の読みの外の読み（子 process）を、その読みの入力の印が前の撃ちの時と同じで上限の古さの内なら撃ち直さず、知らせの受け手が 0 人の間は台帳を読まない。project board の home の頁と同じ口を知らせの種類で読み直す客 1 つを開いて 60 秒の後の 300 秒と、客を閉じて 30 秒の後の 120 秒の、server とその子 process の計算の時間（CPU）の和の平均は、規則の行 R-34 の 2 つの値以下にする。
    plain: 画面の server は、材料が変わっていない外の道具を起こし直さず、画面を開いている人が居ない間は台帳を読みません。画面を 1 枚開いている間と、開いていない間の計算の時間（CPU）の使い方には上限があります。
    basis: [P-27, P-4]
    verify: {method: test, how: 偽の器と偽の folio と偽の bd で入力の印が動かない 2 回目の読みと受け手 0 人の間の子の数を見る歯と、席の測りの script の 2 つの区間の計算の時間（CPU）, ac: [AC1]}
    goals: [GOAL1]
    figures: []
    rules: [R-34]
    adrs: [ADR-23, ADR-26]
    note: 値は持ち主の裁定 t3-hub.52.134（裁定 id = t3-hub.52.134:20260929T2152Z-1・案 D）で決め、構造の決まりは判断の記録 ADR-23（持ち主の裁定 t3-hub.52.133・裁定 id = t3-hub.52.133:20260929T2152Z-1）に拠る。値の字と測り方は規則の行 R-34。R-34 を越えた測りへの手当て（器の doctor の出力の持ち回しの上限を 60 秒にした形〔撤退の条件 (1) で 30 秒に戻した・行 m-doctor-30〕と、器の doctor の読みを器の側で軽くする問い）は判断の記録 ADR-26。

