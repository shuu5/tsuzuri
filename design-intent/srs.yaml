  - id: FR1057
    title: "host の面"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "器は host 固有の宣言値（口座 label・席に積む plugin dir・起動引数・群の表〔FR1038・FR1095・行の任意 key heartbeat は FR1078〕・公開の除外の表〔FR1080〕・書き込みの検出線の表〔FR1113〕）を state dir の host の面 1 file だけから読み、 tracked の manifest と同じ読み手と同じ拒否の形で検査し、 rules 行を持つ file・両面で重複する口座 label・schema 外の項目・群の表の名が Tier1〜Tier9 の外か数字が重複するか宣言順が数字の昇順でない行（FR1038）・key heartbeat が on と off の外の値の行（FR1078）・裁定 id の欄が無いか空の公開の除外の表の行（FR1080）・形の外れた書き込みの検出線の表の行と tracked の manifest に置いた同じ表（FR1113・後者は manifest の側の断りで、 帰結は manifest の読みが断る周と同じ〔FR1017〕）と、 除外の要素を持つ publish の種類の rules 行（FR1080・manifest の側の断りで、 帰結は rules 行が無い周と同じ fail-closed）を行番号付きで typed に拒み、 file が無い host では 0 宣言として続き、 在るが読めない host（拒む行を 1 つでも持つ host を含む）では host の面を読む口（計測・選定・管理 tick・doctor・席の起動・公開の字面の走査）が typed に止まる（公開の字面の走査は公開の segment を断る）"
    plain: "host ごとに違う値（どの口座があるか・席に積む plugin の場所・起動引数・かたまりを宣言する表〔群の表・FR1038・FR1095〕・公開の除外の表〔FR1080〕・記憶装置の書き込みを数える書き込みの検出線の表〔FR1113〕）は、state dir の 1 つの file（host の面）だけが持ちます。器は tracked の manifest と同じ読み方・同じ断り方でこの file を読み、rules 行が在る・口座 label が両面で重なる・schema に無い項目が在る・群の表の名が Tier1〜Tier9 の外か数字が重なるか小さい順でない（FR1038）・行の heartbeat の key が on と off の外（FR1078）・公開の除外の表の行に裁定 id の欄が無いか空（FR1080）・公開の規則の行が除外の要素を持つ（FR1080）・書き込みの検出線の表の行の形が外れているか同じ表が tracked の manifest に在る（FR1113）、のどれかなら行番号付きで断ります。file が無い host では宣言 0 として動き続け、在るのに読めない host（断る行を 1 つでも持つ host を含みます）では、host の面を読む口（計測・口座選び・管理 tick・doctor・席の起動・公開の字面の見張り）が止まります（見張りは公開を断ります）。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1028, AC1031, AC1041, AC1050, AC1064, AC1090]}
    goals: [GOAL1003, GOAL1001]
    figures: []
    note: "なぜ要るか: 記憶に頼らない（GOAL1003）から来ています。口座の宣言が tracked の manifest と host の写しの 2 か所に割れると、rules 行が動くたびに写しを手で作り直す作業と、2 つの宣言のずれが生まれます。host の値を 1 file に置き同じ読み手で読めば、写しを作り直す手間が消え、人の手が入らなくても安全に進める（GOAL1001）からです。群の表と公開の除外の表を host の面に置く理由は ADR-0091・ADR-0093 に在ります。"
  - id: FR1058
    title: "口座の登録と退役"
