  - {id: CON6, title: 席のモデル, text: orchestrator の席は Opus 5.5・念入りさ xhigh で動かす。相談の窓 consult は既定が Fable・念入りさ xhigh で、持ち主が開く窓は model と念入りさを持ち主が選び、席が自分で開く問う窓は既定で開く。席の model を下げる変更は判断の記録を要する。, basis: [P-16], source: 持ち主の裁定 2026-09-27（t3-hub.1）・判断の記録 ADR-10 と ADR-12 と ADR-29, adrs: [ADR-10, ADR-12, ADR-29]}
  - {id: CON5, title: 見せる先, text: 見せる先の制限は条 N-6 が持つ（ここには写さない）。, basis: [N-6], source: 憲法 N-6}
  - {id: CON1001, title: "器の憲法", text: "器の憲法（Always 17 / Ask-first 4 / Never 4）を器の要件書の上位に置き、 矛盾する要件を書かない", basis: [], source: "器の要件書 v0.36 の制約の 1 番（規定の出所 = 器の憲法 v0.5.0）"}
  - {id: CON1002, title: "公開", text: "本 repo は PUBLIC。 絶対 path・host 名・口座名・user 逐語を tracked file に書かない", basis: [], source: "器の要件書 v0.36 の制約の 2 番（規定の出所 = 器の憲法 A1（出す））"}
  - {id: CON1003, title: "歯", text: "test は Rust の 1 framework だけで、 bash / bats の歯を書かない", basis: [], source: "器の要件書 v0.36 の制約の 3 番（規定の出所 = 器の憲法 C12）"}
  - {id: CON1004, title: "作法", text: "前の器（v1）の役割席・gate 席・QA 席・契約押印・tier ラベルを持ち込まない", basis: [], source: "器の要件書 v0.36 の制約の 4 番（規定の出所 = ADR-0003）"}
  - {id: CON1005, title: "口", text: "binary は不可逆操作（force push・削除・公開・課金）の口を持たない", basis: [], source: "器の要件書 v0.36 の制約の 5 番（規定の出所 = 器の憲法 A1 / N1）"}
  - {id: CON1006, title: "headless", text: "headless の runner / lens は permission を毎回明示・rate limit は stream-json で検知・context の上限は契約の大きさで受ける（開発 session の context は /compact で扱う）", basis: [], source: "器の要件書 v0.36 の制約の 6 番（規定の出所の欄は空）"}

