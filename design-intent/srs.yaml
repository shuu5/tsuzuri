 0.7 版（2026-09-27）: 非機能要件 NFR3 の字に面の crate の予算の行 R-25 を名指した（器の契約の審査の指摘）。第 0.6 版（2026-09-27）: 非機能要件 NFR3 に面の crate の依存の予算の行 R-25 を結んだ。第 0.5 版（2026-09-27）: 条 P-16 の改訂（判断の記録 ADR-12）の発効に合わせ、制約 CON6 に相談の窓の念入りさと「席の model を下げる変更は判断の記録を要する」を足し、要件 FR19 の根拠に条 P-16 を足した。第 0.4 版（2026-09-27）: 指し示し（FR18）・相談の窓（FR19）・対象を広げる（FR20）・受入 AC15〜17・制約 CON6（席のモデル）を足した。第 0.3 版（2026-09-27）: 面の生成器の決まりに合わせた（道具の登場人物を 1 つ・入れる側と出る側の帯を 4 以下・要件の basis は憲法の条だけで判断の記録は adrs の欄）。第 0.2 版（2026-09-26）: 面の便の要件を判断の記録 ADR-3・ADR-5・ADR-7・ADR-8 から写した。討論の記録は docs/grill/2026-09-25-B-ruling-surface.md と 2026-09-25-C-stage-surface.md。見本は tsuzuri-site/mock3。
