  - id: FR1030
    title: "配送構造"
    pattern: ubiquitous
    strength: should
    when: "常時"
    shall: "便の配送構造は orchestrator の 1 役割の席（席数と一意性は FR1040）と器の dispatcher からなり、 口座は便ごとに FR1036 が選び、 便の起動・着地・merge は席でなく器の dispatcher が行い（起動の条件・順序・契機は FR1068・land の終端は FR1050・止まった終端を閉じる 2 つの口〔終端だけの撃ち直しと pipe retire〕の便 1 本を名指す形の撃ち手は FR1041）、 orchestrator は契約と priority と typed な介入（first / hold / release）と runner の質問への回答か契約の改訂だけを書き、 実装を自分では行わない（落ちる歯〔tests/ の編集〕は書く・FR1041）"
    plain: "便の配送構造は、orchestrator の席（役割は 1 つ。席数と一意性は FR1040）と器の dispatcher からなり、便を起こす・着地させる・merge するのは席ではなく器の dispatcher です（いつ・どれを・どの順で起こすかは FR1068、land の終端は FR1050。止まった便の終わりを閉じる 2 つの口〔終わりだけの撃ち直しと pipe retire〕は、便 1 本を名指す書き方に限って席の権能〔settle〕で席が撃てます・FR1041）。口座は便ごとに器が選びます（FR1036）。orchestrator が書くのは契約と優先度（priority）と介入の印（first / hold / release）、それに実装役の質問への回答か契約の直しだけで、実装は自分ではしません（落ちる test〔tests/ の編集〕は書きます・FR1041）。"
    basis: []
    verify: {method: inspection, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 A・analysis）", ac: [AC1010]}
    goals: [GOAL1001, GOAL1003]
    figures: []
    note: "なぜ要るか: 自律安全（GOAL1001）と記憶に頼らない（GOAL1003）のニーズから来ています。便を pipeline が運び、起こすのも着地させるのも器が担えば、人手なしで進む経路と判定の記録が 1 本に揃い、席の手番で便が待つことが無くなるからです。人と話す席を 1 つにした経緯は ADR-0045 に、却下した案は ADR-0016 と ADR-0034 に在ります。止まった終端を閉じる名指しの 2 形が席の権能に在る理由は FR1041 と ADR-0097 に在ります。 器の確かめ方の字 A（analysis）は、根の確かめ方の値 inspection に写した。"
  - id: FR1031
    title: "質問の停止"
    pattern: event
    strength: should
    when: "runner が契約の不足を typed な質問 record で返して止まったとき"
    shall: "pipeline は便を Questioned の段に倒し、 質問 event を逐語付きで記帳し、 回答 event が無い間は再開しない"
    plain: "実装役が「この契約では作れない」と判断したら、勝手に決めずに決まった形の合図（質問 record）を返して手を止めます。pipeline はそれを読んで便を「質問中」の段に倒し、質問の文面をそのまま記録し、回答が来るまで再開しません。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1010]}
    goals: [GOAL1001, GOAL1003]
    figures: []
    note: "なぜ要るか: 記憶に頼らない（GOAL1003）と自律安全（GOAL1001）のニーズから来ています。契約の穴が失敗や黙った推測として消えず、質問の逐語が記録に残るからです。"
  - id: FR1032
    title: "質問の再開"
    pattern: event
    strength: should
    when: "Questioned の便に回答 event（逐語付き）が記帳された状態で resume が要求されたとき"
    shall: "同じ便を続きの段から通し、 質問と回答の逐語を runner の入力に添える"
    plain: "orchestrator が回答を逐語のまま記録したうえで再開が要求されると、同じ便がそこから続きます（回答の記帳の後の再開は dispatcher が起こします・FR1068）。質問と回答の文面は実装役への入力に添えられます。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1010]}
    goals: [GOAL1001, GOAL1003]
    figures: []
    note: "なぜ要るか: 記憶に頼らない（GOAL1003）と自律安全（GOAL1001）のニーズから来ています。再開に要るものがすべて記録に在れば、別の process からでも同じ便を続けられるからです。"
  - id: FR1033
    title: "口座残量の計測"
    pattern: event
    strength: should
    when: "口座残量の計測が要求されたとき"
    shall: "manifest に列挙した口座（退役中の口座を除く・FR1058）ごとに、 5 時間窓・7 日窓・モデル別 7 日窓の口座残量と reset 時刻を口座の endpoint から 1 コマンドで読み、 出所（口座・endpoint・時刻）付きの実測値（Measured）として fleet の event log に記録し、 読めない回は理由付きで「測れなかった」を記録して 0 の値に読み替えない"
    plain: "口座残量の計測を求められると、器は manifest に書かれた口座（退役中の口座を除く）ごとに、5 時間・7 日・モデル別 7 日の残りと reset の時刻を口座の endpoint から 1 つのコマンドで読みます。読んだ値は「どの口座を・どこから・いつ読んだか」を添えて fleet の event log に残し、読めなかったときは理由を添えて「測れなかった」と残します（0 の値に読み替えません）。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 D・demonstration）", ac: [AC1011, AC1012]}
    goals: [GOAL1001, GOAL1002]
    figures: []
    note: "なぜ要るか: 消費は害（GOAL1002）と自律安全（GOAL1001）のニーズから来ています。口座の残りが記録に無いと、口座を allowance 窓の終わりまで使い切る判断（器の憲法 C9.2）を器が持てず、余った枠を無駄にするか上限に当たって止まるかのどちらかになるためです。runner が受ける上限 record（ADR-0012）は便を止める合図であって残量の正本ではなく、残量の正本は本要件の実測値です。 器の確かめ方の字 D（demonstration）は、根の確かめ方の値 test に写した。"
  - id: FR1034
    title: "追随"
    pattern: event
    strength: must
    when: "land が要求され、 verdict が PASS で、 worktree が clean で、 main の tip が記録した base より進み、 base が main の祖先であるとき"
    shall: "worktree の branch を main へ rebase して gate をやり直し、 進んだ base と衝突の事実を event に記帳する。 衝突した周は rules 行が持つ上限までは終端にせず、 上限に達した周は Failed で終端する。 rebase で便の変更が既に main に在る（commit が空になる）周は gate をやり直さず記帳して終端する。 main は変えない"
    plain: "着地を求められたとき、審査が合格していて、作業用 worktree に未 commit の変更が無く、main の先端が便の出発点（base）より進み、その出発点が main の祖先（枝分かれした位置）なら、作業用の branch を main の先端の上に積み直し（rebase＝main に追いつく・追随）、審査をやり直します。進んだ後の出発点と、ぶつかった（衝突）事実は記録に残します。ぶつかっても、規則の値が決める回数までは便を終わりにせず、その回数に達したら「失敗」で終わります。積み直した結果、便の変更がすでに main に入っていたときは、審査をやり直さずに記録して終わります。main 自体は動かしません。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1001]}
    goals: [GOAL1001]
    figures: []
    note: "なぜ要るか: 自律安全のニーズ（GOAL1001）から来ています。便を並べて流すと、後から着地する便は main に置き去りにされます。追いつく手順を器が持たないと、合格した便が出発点のずれだけで着地できず、人が手で直す経路が生まれます。ぶつかったときの解き方は決定記録（ADR-0019）が正本です。"
  - id: FR1035
    title: "上限停止の検知"
    pattern: event
    strength: must
    when: "便の runner が上限 record（ADR-0012 の typed な record・口座の上限の合図）で止まったとき"
    shall: "器はその停止を、 どの口座のどの窓かが分かる typed な event として記帳し、 worktree と便の記録を保ち、 便を Failed にしない"
    plain: "便の実装役が「口座の上限に当たった」の上限 record（上限に当たった印）で止まったら、器はそれを、どの口座のどの窓に当たったかが分かる印付きで記録します。作業場所（worktree）と便の記録は消さず、便を失敗にもしません。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1012]}
    goals: [GOAL1001]
    figures: []
    note: "なぜ要るか: 自律安全のニーズ（GOAL1001）から来ています。上限で止まった便を失敗に数えると、成果（worktree）を捨てて人が手で直す経路が生まれます。止まった事実を typed に残せば、別の口座で続きから再開できます（器の憲法 C9）。"
  - id: FR1036
    title: "口座選定"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "口座は、 manifest に宣言した口座（退役中の口座は FR1058 で候補から外れ、 便用は便の repo を anchor に持つ席の登録 row の口座（置き場を共有する他の repo の席の口座と、 park の区画〔FR1095〕の置き場の席の row の口座は候補に残る）と宣言された各群の今の口座（FR1038・host 全体で除き、 群の候補の他の口座は除かない）を次の選定から除き、 終端でない段の便は止めない）と実測した口座残量（FR1033）だけから決定的に選び、 便用（7 日窓の reset の早い口座から使い切る側）と開発 session 用（自席の鍵〔役割と anchor〕の外の登録 row の口座を除き〔park の区画の置き場の席の row の口座は除かない〕、 自席の鍵の row の口座は除かず、 逼迫度が最小の口座を選び余裕を残す側）の 2 つの規則を持ち、 規則の値は session 用の閾値の rules 行（R-C9-1 とその窓別の行・user 裁定で発効）だけから取る。 park の区画の置き場の席の選定の候補は FR1095 が持つ"
    plain: "どの口座を使うかは、manifest に書いた口座（退役中の口座はどちらの規則でも選びません。便には、便の repo を置き場に持つ席が登録している口座と、かたまり（群）がいま使っている口座〔FR1038。host 全体で外し、かたまりの候補の他の口座は外しません〕も選びません。置き場を共有する別の repo の席の口座は便の候補に残ります。外すのは次に選ぶときからで、まだ終わっていない便は止めません）と実測した残量から決めます。便は 7 日窓の reset が早い口座から使い切る側、orchestrator の席の session は（ほかの席が登録している口座を除き、自分の席の登録の口座は除かずに）いちばん余裕のある口座を選んで余裕を残す側、と規則が違います。規則の値は session 用の閾値の rules 行（R-C9-1 とその窓別の行）だけが持ち、user の裁定で有効になります。口座を占めない park の区画（Tier9・FR1095）の席が登録している口座は、便にも session にも外しません。park の区画の席が選ぶ口座の候補は FR1095 が持ちます。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1012, AC1013, AC1028, AC1029, AC1041, AC1063]}
    goals: [GOAL1001, GOAL1002]
    figures: []
    note: "なぜ要るか: 自律安全（GOAL1001）と消費は害（GOAL1002）から来ています。口座を人が選ぶと席が止まり、規則が散文に残ると drift します。1 本の純関数と rules 行に置けば、器が同じ規則で選び直せます（器の憲法 C9.2・C2・C1）。群の今の口座を便の候補から外す決定と、役割の口座と実効の口座をそれに置き換えた決定は ADR-0049 に、便用を 7 日窓の reset の早い順に並べる決定は ADR-0042 に、park の区画の席の口座をどの選定からも除かない決定は ADR-0091 に在ります。"
  - id: FR1037
    title: "別口座での途中再開"
    pattern: event
    strength: must
    when: "FR1035 で記帳された便、 または Spawned の段の便の再開が要求されたとき（この便の再開は FR1014 に優先する）"
    shall: "器は runner の process が生きているかを測り（生きている便は typed に断り、 runner を 2 本にしない）、 FR1036 で口座を選び（上限で止まった便は別の口座）、 同じ worktree と同じ契約（回答済みの質問と、 前の runner が残した未 commit の変更の一覧を添えて・FR1032）で runner を起こし直し、 記帳した段から Landed まで続ける。 候補となる口座が無い周は便を Failed にせず、 いずれかの口座の窓が最も早く reset する時刻まで待ってから再開する"
    plain: "上限で止まった便、または実装役が走っている段（Spawned）の便を再開するときは、器がまず実装役の process が生きているか確かめ（生きていれば断り、実装役を 2 つにしません）、口座を選び（上限で止まった便は別の口座）、同じ作業場所と同じ契約（回答済みの質問と、前の実装役が残した未 commit の変更の一覧も添えて）で実装役を起こし直し、記録した段の続きから着地まで進めます。使える口座が無いときは失敗にせず、いちばん早く枠が戻る時刻まで待ちます。この再開は通常の resume（FR1014）より優先されます。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1012, AC1039]}
    goals: [GOAL1001]
    figures: []
    note: "なぜ要るか: 自律安全のニーズ（GOAL1001）から来ています。再開のたびに契約や作業場所を作り直すと成果が失われます。同じ worktree と契約で続きから進める形なら、上限に当たっても成果が失われません。"
  - id: FR1038
    title: "群の逼迫の通知と移動"
    pattern: event
    strength: must
    when: "便の終端の周（dispatch の 1 周）か席自身の hook か管理 tick（FR1027）の周期が動いたとき"
    shall: "器は群の逼迫を計測のための常駐 timer では測らず、 便の終端の周（dispatch の 1 周）と席自身の hook と管理 tick（FR1027）の周期（群ごとに鮮度の窓に 1 回まで）の 3 系統で、 群の今の口座と群の席が居る口座の使用率を計測（FR1033）から鮮度つきで読み、 5 時間窓・7 日窓・モデル別窓の閾値の rules 行 3 本（user 裁定で発効）のいずれか以上になった群について、 便の終端の周は群の置き場の席の pane へ通知を 1 行注入して event に記し（同じ実測には 2 度通知しない）、 席自身の hook は session の開始の指示文と prompt が打たれた周の追加文脈にそれぞれ 1 行で告げて移動を頼む記録を host の根へ群ごと高々 1 件置き、 便の終端の周と管理 tick は群単位で host の lock の内側で 1 回だけ移り先（群の候補のうち、 今の口座でなく・他の群の今の口座でなく・退役中でなく・口座の墓標〔FR1097〕でなく〔鮮度の内側の実測を持つ墓標の口座も外す〕・鮮度の内側の実測を持ち 3 窓とも閾値未満の口座を、 残量の鍵〔7 日窓と群の席の役割の model（rules 行 seat.model.<役割>）の 7 日窓の残量（100 − 使用率）の小さい方が大きい順 → 7 日窓の reset が早い順 → 宣言順〕で並べ〔役割の model の行が無い口座は最後・5 時間窓は門にだけ使う・鮮度の外の候補は 1 回測る〕、 群を宣言順に見て「どの群の今の口座でもなく先の群の予約でもない先頭」をその群の予約〔群の予約〕とし、 移る群は自分の予約へ移る。 予約は記録せず周ごとに lock の内側で導出し、 他の群の移動と予約を排他するが便の起動は排他しない〔便用の口座選定の除外は群の今の口座だけ〕。 宣言の候補の列は集合で、 順は同点の tie-break にだけ効く。 終端でない段の便が使う口座は候補から外さない・ADR-0069）を決めて群の今の口座の記録（書き換える周は前の記録を消さず履歴の側へ可逆な move で移す）と承認 event を書き（判定は 1 本の関数で、 便の終端の周と管理 tick が同じ 1 本を呼び、 管理 tick は群ごとに鮮度の窓〔rules 行〕に 1 回まで撃ち、 判定の周だけ計測〔FR1033〕を起こしてよい・ADR-0066）、 古い席へ退避の合図を送って新しい口座で席を起こし直し（席の起こし直しは席の起動〔FR1059〕が行い、 直前の会話 id を運んで会話の続きから再開する・ADR-0067）、 候補が無い周は移らず user へ通知し妥協の移動を作らず、 群の逼迫の計測のための常駐 process と、 cycle・強制サイクルの印は持たず、 dispatch の 1 周を timer では撃たない（ADR-0045 §2 (2) / ADR-0049 / ADR-0055 / ADR-0066）。 群の今の口座が口座の墓標（FR1097）である群も、 同じ 1 本の判定が同じ移り先の決め方で移り先を決め、 同じ記録と承認 event（承認の逐語は群の宣言の行が持つ逐語）と同じ退避と起こし直しで移り、 候補が無い周は逼迫の群と同じ断りの手（移らず、 断りの event を記す）を使い、 墓標を知らせる口は足さない（墓標は群の逼迫でなく移動のもう 1 つの契機）。 判定は墓標の口座を測らず、 群の予約を持つのは、 群の今の口座の実測が閾値の rules 行のいずれか以上の群か、 群の今の口座が口座の墓標の群である（ADR-0074・ADR-0098）。 管理 tick（FR1027）の timer（FR1064）は判定の周の外では群の逼迫を測らず計測も起こさず、 tick の口座の門（FR1027）は計測（FR1033）の記録の最新値を読むだけである（ADR-0058）。 群の表（host の面）の行の名は Tier1〜Tier9 に限り（Tier1〜Tier8 の行が群・Tier9 の行が park の区画〔FR1095〕）、 Tier1〜Tier9 の外の名・数字の重複・宣言順が数字の昇順でない host の面は FR1057 の読みで断り（fail-closed）、 優先は宣言順のままで、 doctor の群の行は next=<label|none>（残量の鍵で導出した群の予約）を持ち、 移り先の判定と doctor は同じ 1 本の残量の鍵の関数を呼ぶ（ADR-0069・名の句は ADR-0091）。 本 FR の手（逼迫の通知・移動を頼む記録・移動・予約）は群だけに掛かり、 park の区画の手は FR1095 が持つ"
    plain: "器は、かたまり（群）の口座の使用率（残りの裏返し）を測るための常駐の timer を持ちません。作業（便）が 1 つ終わった直後の 1 周と、席が話す番のたびに動く仕組み（hook）と、席を周期で見回る管理 tick（FR1027）の 3 つで、かたまりのいま使う口座と席が実際に居る口座の使用率を、計測（FR1033）が残した値からいつ測ったかの鮮度つきで、3 つの窓（5 時間・7 日・モデル別）で読みます。使用率が閾値（rules 行 3 本・user 裁定）のどれか 1 つでも以上になっていれば、1 周はそのかたまりの席の画面に 1 行で知らせて記録に残し（同じ実測には 2 度知らせません）、席の仕組みは session の開始の指示文と prompt の周の追加文脈にそれぞれ 1 行で告げて「そろそろ移して」の記録（移動を頼む記録）を host の根にかたまりごと 1 件だけ置きます。移るときは、1 周か管理 tick が host の lockの内側でかたまり単位に 1 回だけ移り先（いま使う口座でなく、他のかたまりが使っておらず、退役中でなく、再 login の要る印（口座の墓標〔FR1097〕）を持たず〔新しい計測がある墓標の口座も外します〕、新しい計測があり 3 つの窓とも閾値未満の候補〔計測が古い候補は 1 回測ります〕を、残りの量の並べ方（残量の鍵）「7 日の窓とその席の役割の model の 7 日の窓の残りの少ない方が多い順 → 7 日の窓の reset が早い順 → 宣言の順」で並べ〔席の model の行が無い口座は最後・5 時間の窓は条件にだけ使います〕、かたまりを宣言の順に見て、どのかたまりも使っておらず前のかたまりの予約でもない先頭をそのかたまりの予約〔次に移る口座〕にします。予約は file に残さず毎周計算し直し、他のかたまりの移動と予約は避けますが、作業〔便〕の起動は避けません。宣言に並べた候補は集合で、順は同点のときだけ効きます。まだ終わっていない作業が使っている口座も候補に入ります・ADR-0069）を決め、いま使う口座の記録（前の記録は消さずに履歴の側へ戻せる形で動かします）と承認の記録を書き、古い席に退避の合図（作業を区切って終える合図）を送ってから、新しい口座で席を起こし直します（判定は 1 本で、tick はかたまりごとに鮮度の窓に 1 回までしか撃たず、その周だけ計測してよいことにします・ADR-0066。席を起こし直すのは席の起動（FR1059）で、その席の状態の打刻に残った会話 id を渡して直前の会話の続きから再開します。対話の記録の file を複写することはしません・ADR-0067）。移り先が無ければ移らず、人に知らせます。余裕の無い口座へ妥協して移すこともしません。いま使う口座が再 login の要る印（墓標）を持つときも、同じ 1 本の判定で移ります。墓標は逼迫ではなく移動のもう 1 つのきっかけで、同じ移り先の決め方・同じ記録と承認（承認の記録に写す逐語も同じ群の宣言の行です）・同じ退避と起こし直しを使い、移り先が無ければ逼迫のときと同じく移らずに断りを記録し、墓標を知らせる新しい口は足しません。判定は墓標の口座を測らず、予約を持つのは、いま使う口座の使用率が閾値以上か、いま使う口座が墓標のかたまりです（ADR-0074・ADR-0098）。かたまりの逼迫を測るための常駐の process と、cycle・強制サイクルの印は持たず、1 周を timer で撃つこともしません（ADR-0045 / ADR-0049 / ADR-0055 / ADR-0066）。管理 tick（FR1027）の timer（FR1064）は判定の周の外ではかたまりの逼迫を測らず計測も起こさず、tick の口座の門（FR1027）は計測（FR1033）の記録の最新値を読むだけです（ADR-0058）。かたまりを宣言する表（群の表）の行の名前は Tier1〜Tier9 に限り（Tier1〜Tier8 がかたまり〔群〕、Tier9 が口座を占めない park の区画〔FR1095〕です）、その外の名前・数字の重複・宣言の順が数字の小さい順でないときは host の設定の読みの時点で断ります（FR1057）（優先は宣言の順 = 数字の小さい順です）。doctor のかたまりの行には next=（残量の鍵で導いた予約。無ければ none）が出て、移り先の並べ方と doctor の next= は同じ 1 本の関数（残量の鍵）を使います（ADR-0069・名前の決まりは ADR-0091）。この FR の手（逼迫の知らせ・移動を頼む記録・移動・予約）はかたまりだけに掛かり、park の区画の手は FR1095 が持ちます。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1018, AC1041, AC1063]}
    goals: [GOAL1001, GOAL1003]
    figures: []
    note: "なぜ要るか: 自律安全（GOAL1001）と記憶に頼らない（GOAL1003）から来ています。複数の project の席を同じ口座にまとめ、上限が来たら群ごと一斉に移す要求（ADR-0049）を、時計を戻さずに満たすには、残りが減る周（席が話す・便が終わる）と見回りの判定の周に測れば足ります（ADR-0055・ADR-0066）。移動をかたまり単位の 1 回に閉じるのは同じ口座への殺到を構造で消すためで、席の起こし直しで会話 id を運ぶのは、会話を reset しても得るものが無いため（裁定 2026-09-25T03:58Z・ADR-0067）で、運ぶのは打刻に残った id 1 つだけなので、復帰の道は台帳と git から組む 1 本のままです（GOAL1003）。管理 tick を 3 つ目のきっかけに持つのは、便の無い host では 1 周が来ず、席の仕組み（hook）は移動を頼む記録を置くまでで判定を撃たないため、かたまりが移らないからです（ADR-0066）。移り先の候補から終端でない段の便の口座を外さないのは、新しい便がその口座で起きないことを便用の口座選定（FR1036）が既に保っていて、同じ目的の条件を 2 か所に持たないためです（ADR-0068）。移り先を残りの量で並べるのは、席は何日も同じ口座に居るので、いま残りが多い口座ほど長く働けるからで、7 日の窓と役割の model の窓の少ない方を取るのは、役割の model の窓だけが高い口座を上位に並べないためです。予約を宣言の順に導いて記録しないのは、かたまりが幾つ増えても数字の小さい群が良い口座を取り、記録が実測とずれる事故を作らないためで、予約が作業の起動を避けないのは、移った後に新しい作業がその口座で起きないことを口座選定（FR1036）が既に保っているからです（ADR-0069）。名前を Tier1〜Tier9 に限り Tier9 を口座を占めない park の区画にする理由は ADR-0091 に在ります。いま使う口座が墓標のときも移すのは、墓標の口座の席は人が気づくまで止まり、かたまりの席は移動の道（判定・退避・起こし直し）を持つので、墓標の席も移り先が在ればその道で人手なしに再開できるからです（login の画面で止まった席に退避が届くかは未測・GOAL1001・ADR-0098）。"
  - id: FR1039
    title: "intake の排他"
    pattern: unwanted
    strength: must
    when: "契約が intake に出され、 その write-set が終端でない段の便の write-set と交差するとき"
    shall: "器は交差する file と相手の便を名指す typed な理由で契約を断り、 便を作らない。 相手の便が終端の段に達するか止められた後は、 同じ契約を受け付ける。 契約を断る理由の閉じた一覧と終端でない段の便の判定は、 同時走行の最大値の断り（FR1068）と共有する"
    plain: "触る file の列が、いま走っている便の列と重なる契約は、入口（intake）の時点で「どの file が誰と重なるか」を名指して断り、便を作りません。走っていた便が終わるか止められれば、同じ契約は通ります。断る理由の一覧と「まだ終わっていない便」の数え方は、同時走行の最大値の断り（FR1068）と同じものを使います。"
