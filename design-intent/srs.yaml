    shall: "器は開発 session の席の役割を閉じた一覧の値（orchestrator の 1 つ）として持ち、 席の識別子（役割, anchor）を鍵に、 席の target・口座 label（FR1059 が解いた口座の写し）・起動の雛形を項目として fleet の event log へ記録し、 役割の記録が無い席をどの権能も持たない席として扱う。 1 つの anchor に orchestrator は 1 席とする"
