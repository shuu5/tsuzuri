  - id: FR1056
    title: "禁じる語列の command の拒否"
    pattern: unwanted
    strength: must
    when: "口座の設定を読む session（対話の席・口座の設定 dir を指定した起動・器を積まない session）または runner の session が撃つ Bash の command が manifest の禁じる語列（host-guard の口が読むのは発効している行だけ）のいずれかに当たるとき"
