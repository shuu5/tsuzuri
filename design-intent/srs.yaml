  - id: FR1100
    title: "行の審査"
    pattern: event
    strength: must
    when: "行の審査が設計の PR の head の commit を名指して要求されたとき"
    shall: "器は、 その commit と origin/main の先端の merge-base の間で行の digest が変わった契約表の行のうち、 設計 pointer がその行を指す bead が 1 本も無いか 1 本でも closed でない行ごとに、 受付と同じ機械の検査（FR1001・FR1048・FR1054・FR1105・FR1109 の判定を記帳せずに撃つ形）と、 契約の審査（FR1049）と同じ lens を、 head の commit を detach した審査の木を cwd にして読みの道具で 1 回撃ち、 判定を判定の鍵ごとに state dir の記録に残し、 head ごとの結果を閉じた 4 語（pass・fail・pending・stale）で、 行の審査の merge-base と判定した契約表の file の列とともに残す。 判定の鍵は、 行の digest・材料の鍵・code の木の鍵（対象 repo の code の file の木から決まる鍵）・basis（actual・forecast・partial）・祖先ごとの状態・lens の子が自ら出す lens の版の全部とし、 同じ鍵の記録を既に持つ行（理由の型が unparsed の記録を除く）は撃ち直さない。 機械の検査が確定の断りを返した行は lens を撃たずに FAIL とする。 未着地の祖先を持つ行は、 祖先の行と実装する節の本文を材料に足した予想の審査（forecast）とし、 祖先の新しい file を空で置かない。 bead の無い行は doc を跨ぐ祖先を測れないので partial とする。 結果は、 全行が PASS か、 INCONCLUSIVE の行が全部 forecast か partial で理由の型が unparsed でないなら pass、 FAIL の行か actual の INCONCLUSIVE の行か unparsed の行が 1 本でも在れば fail、 撃ち中の印の持ち主が生きている間は pending、 持ち主が死んで撃ち終えていなければ stale とする。 口は全部の行を撃ち終えるまで前面で走り、 結果を標準出力に返し、 席の入力欄へ差し込まない（行の審査の知らせは FR1044 の閉じた列に無い）"
    plain: "設計の PR の head の commit を名指して行の審査（merge の前の審査）を頼まれたら、器は、その commit と main の先端の分かれ目の間で中身の指紋（行の digest）が変わった契約表の行のうち、まだ閉じていない行（その行を指す台帳の記録が無いか、1 本でも閉じていない行）ごとに、受付と同じ機械の検査（FR1001・FR1048・FR1054・FR1105・FR1109 を記録せずに撃つ形）と、契約の審査（FR1049）と同じ審査役を、head の commit を切り離した審査の木を作業場所にして読みの道具で 1 回撃ち、判定を判定の鍵ごとに state dir に記録し、head ごとの結果を pass・fail・pending・stale の 4 語で、行の審査の分かれ目と判定した契約表の file の列といっしょに残します。判定の鍵は、行の digest・審査材料の指紋（材料の鍵）・code の木の鍵・判定の土台（actual・forecast・partial）・祖先ごとの状態・審査役が自分で名乗る版の全部から作り、同じ鍵の記録がある行は撃ち直しません（答えが読めなかった判定〔unparsed〕の記録を除きます）。機械の検査が確かに断った行は、審査役を撃たずに FAIL にします。まだ着地していない祖先を持つ行は、祖先の行と節の本文を材料に足した予想の審査（forecast）にし、祖先の新しい file を空で置きません。台帳の記録が無い行は、文書を跨ぐ祖先を測れないので partial にします。全部の行が合格か、判定できなかった行が全部 forecast か partial で unparsed でなければ pass、FAIL の行・actual で判定できなかった行・unparsed の行が 1 本でもあれば fail、撃ち中の印の持ち主が生きている間は pending、持ち主が死んで撃ち終えていなければ stale です。口は全部の行を撃ち終えるまで前面で走って結果を標準出力に返し、席の入力欄には差し込みません（行の審査の知らせは FR1044 の閉じた列にありません）。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1073, AC1022, AC1076, AC1082, AC1083, AC1081]}
    goals: [GOAL1001, GOAL1002]
    figures: []
    note: "なぜ要るか: 自律安全（GOAL1001）と消費は害（GOAL1002）から来ています。便の失敗の根の多くは設計の側にあり、便の中の審査は 1 回に穴を少ししか名指さないので、同じ行が何周もします（数えは ADR-0103）。列に並ぶ前の設計の PR の段で全部の行を審査すれば、穴を列の外で直せます。撃ち直さない鍵を判定に効く入力の全部で作るのは、祖先の直しや code の着地で判定が変わりうるのに、古い判定を写さないためです。知らせを席の入力欄へ差し込まないのは、器から席への差し込みを FR1044 が閉じた列で持つからです（ADR-0103）。"
  - id: FR1101
    title: "merge の門の行の審査の判定"
    pattern: unwanted
    strength: must
    when: "席の道具の呼び出しが PR を main へ入れる merge の command（help を出すだけの command を除く）を撃とうとし、 (i) anchor の HEAD の commit か local に在る PR の head の commit の vessel 宣言が任意 key row-review を true で持つ repo で、 その command が PR の head の commit を 40 桁の 16 進の sha で固定しないか、 その sha の行の審査（FR1100）の結果が無い・読めない・pass でないか、 結果が名指す契約表の file が行の審査の merge-base と今の origin/main の間で変わったとき、 (ii) どちらかの commit の vessel 宣言が在るのに読めないとき、 または (iii) anchor の HEAD の vessel 宣言が row-review を true で持つ repo で、 PR の head の commit を local に持たないとき"
    shall: "器の hook の入口は、 merge の門の 2 つ目の判定（1 つ目は FR1092 の trailer の判定）として merge の command を実行の前に deny し、 (i) では判定の順の閉じた 6 語（no-head-pin・row-review-missing〔結果が無い・読めない〕・row-review-pending・row-review-stale・row-review-failed・row-review-moved）のうち最初に当たる語を、 (ii) と (iii) では読めない理由を名指し、 次に撃つ口（(ii) と (iii) では git fetch origin）を名指す。 (ii) に当たらず、 anchor の HEAD の宣言も local に在る PR の head の commit の宣言も key row-review を true で持たない repo の merge の門は FR1092 の判定だけを持つ。 2 つ目の判定が読むのは、 2 つの commit の vessel 宣言（git で commit から読み、 作業ツリーは読まない）と state dir の結果の 1 file と契約表の file の差の有無だけで、 台帳と event log は読まない"
    plain: "席が PR を main へ入れる merge の command（help を出すだけの command は除きます）を撃つとき、次のどれかなら、器の hook が実行の前に止めます。(i) anchor の HEAD か、手元にある PR の head の commit の vessel 宣言が row-review の key を true で持つ repo で、PR の head の commit を 40 桁の sha で固定していない・その sha の行の審査（FR1100）の結果が無い・読めない・pass でない・結果が名指す契約表の file が、行の審査が比べた分かれ目（merge-base）より後に main で変わった。(ii) どちらかの宣言が在るのに読めない。(iii) anchor の宣言が key を true で持つ repo で、PR の head の commit が手元に無い。(i) では判定の順（no-head-pin・row-review-missing〔結果が無い・読めない〕・row-review-pending・row-review-stale・row-review-failed・row-review-moved）で最初に当たる語を、(ii) と (iii) では読めない理由を告げ、次に撃つ口（(ii) と (iii) では git fetch origin）も告げます。これは merge の門の 2 つ目の判定で、1 つ目は FR1092 の trailer の判定です。(ii) に当たらず、anchor の HEAD の宣言も手元にある PR の head の宣言も key を true で持たない repo では、門は FR1092 の判定だけです。2 つ目の判定が読むのは、2 つの commit の宣言（作業中の file でなく commit から読みます）と state dir の結果の file 1 つと、契約表の file の差の有無だけで、台帳と出来事の log は読みません。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1074, AC1062]}
    goals: [GOAL1001]
    figures: []
    note: "なぜ要るか: 自律安全（GOAL1001）から来ています。契約表の行の字が変わるのは merge の時点だけなので、そこで止めれば、席が merge する行は列に並ぶ前に審査済みになります。merge の後に審査すると、行はもう main にあり、直しにもう 1 本の PR が要ります。head を固定しないと、審査した commit と merge される commit が同じだと言えず、行の審査が比べた分かれ目より後に main で契約表が動くと、merge の結果の行は審査されていません。2 つの commit の宣言を読むのは、PR が自分で key を外して門を素通りする形と、key を足す PR が自分の門を持たない形を塞ぐためです。後の形を塞げるのは PR の head の commit が手元に在る周だけで、anchor が key を持たない repo で head が手元に無い周を断らないのは、名乗っていない消費側の repo の merge を黙って変えないためです（ADR-0103）。(ii) に当たらず、読める宣言がどれも key を true で持たない repo の merge の門は FR1092 の判定だけを持ちます。"
  - id: FR1102
    title: "行の予約"
    pattern: state
    strength: must
    when: "台帳の open な契約 B（起動の列の入力の条件〔依存・pointer〕も、 起動の列の外か列に戻ったかも問わない）が memo の label も台帳の問いの label（FR1081）も持たず、 B の直前の便が Landed でない終端（契約の審査が PASS でない・gate の verdict が FAIL・Failed・Stopped）に着き、 その後に同じ bead の便が起きておらず、 最新の介入の印が hold でなく、 その終端から rules 行 pipe.reserve_h の時間（値は user 裁定 id 付き・値 0 は期限なし）が過ぎていない間"
    shall: "器の dispatcher は、 B の直前の便の契約の write-set を B の行の予約とし、 FR1068 の順序の 1 関数で並べた時に B より後ろの候補のうち write-set が B の行の予約と交差する（FR1039 と同じ判定）候補を、 行の予約の待ち（reserved）の理由で待たせる。 B が台帳の blocks で待つ祖先（推移）の候補は待たせない。 rules 行が読めない周は期限なしとして読み、 読めないことを列挙に出す。 行の予約は B の新しい便の起動・B の close・B の memo か問いの label・B への hold の印・期限のどれかで解け、 器は記帳せず既存の記録から周ごとに導く"
    plain: "台帳の開いた契約 B が memo の印も問いの印も持たず、B の直前の便が着地でない終わり方（契約の審査で合格しなかった・gate の判定が FAIL・失敗・停止）をし、その後に同じ契約の便がまだ起きておらず、最後の介入の印が hold でなく、その終わりから規則の行 pipe.reserve_h の時間（user の裁定で決めます。0 は期限なし）が過ぎていない間、器の dispatcher は、B の直前の便の触ってよい file の列を B の取り置き（行の予約）にします。起動の順（FR1068）で B より後ろの候補のうち、触る file が B の取り置きと重なる（FR1039 と同じ判定）候補は、行の予約の待ち（reserved）の理由で待たせます。B が依存（blocks）で待つ祖先の候補は待たせません。規則の行が読めないときは期限なしとして読み、読めないことを列挙に出します。取り置きは、B の新しい便が起きる・B が閉じる・B が memo か問いの印を持つ・B に hold が付く・期限が来る、のどれかで解け、器は記録を足さずに既存の記録から周ごとに導きます。B が起動の列の条件（依存・pointer）を満たすか、列の外か列に戻ったかは問いません。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1075]}
    goals: [GOAL1001, GOAL1003]
    figures: []
    note: "なぜ要るか: 自律安全（GOAL1001）と記憶に頼らない（GOAL1003）から来ています。落ちた行を直す間に、同じ file を触る後ろの行が先に起きると、直った行がその便の終わりを待ちます（出来事は ADR-0103）。落ちた行が触る file を取り置けば、依存と優先度の順が崩れません。母集団を列の外の契約に限らないのは、直って列に戻った B が受付や依存で待つ間に、後ろの候補が同じ file を先に取る形も塞ぐためで、B の依存の祖先を待たせないのは、祖先まで待たせると、前提の行を足して B に付ける直し方で待ちの輪ができるからです。期限は、放置された行が後ろを永久に止めない安全弁です（ADR-0103）。"
  - id: FR1103
    title: "兄弟の待ち"
    pattern: state
    strength: must
    when: "台帳の open な契約 B の直前の便が、 契約の審査の FAIL か INCONCLUSIVE（理由の型が unparsed でない）か gate の FAIL で終端している間"
    shall: "器の dispatcher は、 B と同じ契約表の置き場の file の行のうち、 B と同じ節を実装する契約と、 B の行の digest（B の直前の便の記録から求める）を載せた行の審査（FR1100）の記録に載る契約を、 介入 first の印を持つ契約と B が台帳の blocks で待つ祖先（推移）の契約を除いて、 兄弟の待ち（sibling）の理由で待たせる。 兄弟の待ちは、 B の今の行の digest が B の直前の便の記録と違う周・B への release か hold の印・兄弟自身の今の行の digest の行の審査の記録で、 判定が PASS か、 forecast か partial で unparsed でない INCONCLUSIVE のものが B の終端より後に書かれた周・B の close・期限（rules 行 pipe.reserve_h を共用）のどれかで解け、 器は記帳せず既存の記録から周ごとに導く"
    plain: "台帳の開いた契約 B の直前の便が、契約の審査の FAIL か、答えが読めなかった判定（unparsed）でない「判定できなかった」（INCONCLUSIVE）か、gate の FAIL で終わっている間、器の dispatcher は、B と同じ契約表の置き場の file の行のうち、B と同じ節を実装する契約と、B の行の digest（B の直前の便の記録から求めます）を載せた行の審査（FR1100）の記録に載る契約を、介入の印 first を持つ契約と、B が依存（blocks）で待つ祖先の契約を除いて、兄弟の待ち（sibling）の理由で待たせます。兄弟の待ちは、B の今の行の digest が直前の便の記録と違う（直しが main に入った）・B に release か hold が付く・兄弟自身の今の行の digest の行の審査の記録（合格か、forecast か partial で unparsed でない「判定できなかった」）が B の終わりより後に書かれた・B が閉じる・期限（pipe.reserve_h を共用）、のどれかで解け、器は記録を足さずに既存の記録から周ごとに導きます。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1076]}
    goals: [GOAL1002, GOAL1001]
    figures: []
    note: "なぜ要るか: 消費は害（GOAL1002）と自律安全（GOAL1001）から来ています。同じ設計の PR から出た兄弟の行は先の行と同じ指示で書かれているので、先の行が落ちた直後に起こすと同じ理由で落ちます（出来事は ADR-0103）。指示が同じかは機械で判じられないので、同じ節と同じ設計の PR（同じ時に同じ前提で書いた行）を代わりの目印にします。失敗と停止の終わり方を元にしないのは、起動の失敗や人の停止は設計の穴を示さないからです。B が依存で待つ祖先を待たせないのは、祖先まで待たせると、前提の行を足して B に付ける直し方で待ちの輪ができるからです（ADR-0103）。"
  - id: FR1104
    title: "done の項目ごとの歯の欄を求める行"
    pattern: unwanted
    strength: must
    when: "vessel 宣言が任意 key teeth-check を true で持つ repo で、 契約表の検査に比べる base の commit が渡され、 その commit の同じ契約表の置き場の file に同じ id の行が無いか done の字が base と違う契約表の行（done の欄を持たない行を除く）が、 done の項目を 1 つも持たないか、 done の項目ごとの歯を名指す任意の欄を持たないとき"
