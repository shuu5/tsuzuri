    figures: []
    note: "なぜ要るか: 記憶に頼らない（GOAL1003）と自律安全（GOAL1001）から来ています。読み手がそれぞれ「今どこか」を判じ直すと、同じ部品が画面ごとに違う局面で描かれ、どれが正しいかを人が確かめる手間が残ります。判定を局面の出力の 1 か所に置いて読み手はそれを読むだけにし、古さを印で示せば、器の整理と見せ方が 1 対 1 のまま保たれます。user の裁定 2026-09-28T13:14Z に従い、経緯と却下した案は ADR-0088 に在ります。"
  - id: FR1095
    title: "park の区画"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "器は、 群の表の名 Tier9 の行が宣言する置き場（park の区画・FR1038）を、 口座を占めない置き場として扱う（ADR-0091）。 park の区画は群の今の口座の記録・種・群の予約・群の移動の判定・移動を頼む記録を持たず、 park の区画の行が並べた口座と、 park の区画の置き場の席の row の口座は、 便用と session 用の口座選定（FR1036）と群の移り先と群の予約（FR1038）のどれからも除かれない。 park の区画の置き場の席の口座は、 起動の周（FR1059）は口座の引数（行が並べた口座の外でもその口座）か、 引数が無ければ park の区画の行が並べた口座だけを候補にした session 用の口座選定（FR1036・候補が無い周は FR1069 の語で断る）で決まる。 管理 tick（FR1027）の周は park の移り先の判定を撃つ。 この判定は、 row の口座の計測（FR1033）の記録の最新値が session 用の閾値の rules 行（FR1036）のいずれか以上の周だけ、 行が並べた口座から row の口座を除いた session 用の口座選定の口座を返し、 row の口座の記録が無いか鮮度の外の周と候補が無い周は返さない（候補も記録の最新値だけで選び、 鮮度の外の候補は数えない）。 判定が口座を返した周だけ、 席は群の移動と同じ退避の合図と、 窓が shell に戻った周の起こし直し（FR1059・直前の会話 id を運ぶ）でその口座へ移り、 返さない周は移らず、 候補が無い周は判定行に理由 park-no-candidate を出す。 row の口座が同じ間は、 移り先が周ごとに変わっても、 退避の合図を窓が shell に戻るまでの周に重ねて送らない。 窓が shell に戻った park の区画の席の起こし直しの口座は、 判定が返せばその口座、 返さなければ row の口座である。 起こし直しは同じ判定の結果を使う。 park の区画の手は計測（FR1033）を起こさず、 host の lock を取らず（群の移動を待たせない）、 群の今の口座の記録も承認 event も書かない（移り先は席の起動と同じ session 用の口座選定で決まり、 行が並べた口座の宣言を A1 の「使う」の常設の承認と読み、 移った事実は判定行と、 起こし直し（FR1059）が event log に記帳する席の登録に残る・ADR-0091）。 席自身の hook は park の区画の席でも、 row の口座の使用率が群の逼迫の閾値の rules 行 3 本（FR1038）のいずれか以上の周に session の開始の指示文と prompt が打たれた周の追加文脈にそれぞれ 1 行で告げるが、 移動を頼む記録は置かない。 doctor の park の区画の行は kind=park を持ち（群の行は kind を持たない）、 今の口座・next・断りの欄（ADR-0074）を - で出す"
    plain: "要するに、Tier9 の行で宣言する置き場（park の区画）は、口座を独り占めしない、という決まりです（ADR-0091）。park の区画はいま使う口座の記録・最初の口座（種）・予約・かたまりの移動の判定・移動を頼む記録を持たず、park の区画の行に並べた口座と、park の区画の席が登録している口座は、便の口座選び・session の口座選び・かたまりの移り先と予約のどれからも外しません。park の区画の席を起こすときの口座は、口座を指定すればその口座（行に並べた口座の外でも）、指定しなければ行に並べた口座だけから session 用の選び方（FR1036）で選び、候補が無ければ FR1069 の断りで起こしません。管理 tick は毎周、park の移り先の判定を撃ちます。登録の口座の使用率の記録が session 用の閾値（FR1036 の rules 行）のどれか 1 つでも以上のときだけ、行に並べた口座から登録の口座を除いて同じ選び方で選んだ口座を返し、記録が無いか古いとき・候補が無いときは返しません（候補も記録の最新値だけで選び、古い記録の候補は数えません）。返したときだけ、かたまりの移動と同じ退避の合図と、窓が shell に戻ったときの起こし直し（会話の続きから）でその口座へ移ります。返さなければ移らず、候補が無いときは判定の行に park-no-candidate と出します。登録の口座が同じ間は、移り先が周ごとに変わっても、退避の合図を窓が shell に戻るまで重ねて送りません。窓が shell に戻った席の起こし直しは、判定が返せばその口座、返さなければ登録の口座で行います。park の区画の手は計測を起こさず、host の lock も取らず（かたまりの移動を待たせません）、いま使う口座の記録も承認の記録も書きません。移り先は席を起こすときと同じ session 用の選び方で決まり、行に並べた口座の宣言を、その口座を「使う」ことの常設の承認（A1）と読むからで、移った事実は判定の行と、起こし直しが残す席の登録の記録に残ります（席の登録は起動〔FR1059〕が書き直します）。席の仕組み（hook）は park の区画の席でも、登録の口座の使用率がかたまりの逼迫の閾値（rules 行 3 本・FR1038）のどれか 1 つでも以上なら session の開始の指示文と prompt の周の追加文脈にそれぞれ 1 行で告げますが、移動を頼む記録は置きません。doctor の park の区画の行は kind=park を持ち（かたまりの行は kind を持ちません）、いま使う口座・next・断りの欄を - で出します。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1063]}
    goals: [GOAL1001, GOAL1002]
    figures: []
    note: "なぜ要るか: 自律安全（GOAL1001）と消費は害（GOAL1002）から来ています。席は残すが日々は動かさずに置いておく repo を、かたまりに入れると口座を 1 つ占めて他のかたまりの移動と作業の流れを妨げ、かたまりの外に置くと席の登録の口座が他の席の口座選びから外れて口座を占めます（GOAL1001）。口座を占めない置き場の種類を 1 つ持ち、合図の既定を off にすれば、置いておく席は口座を占めず、既定では合図で token を使いません（GOAL1002）。名前で種類を決める理由・移る閾値を session 用の閾値にする理由・採らなかった案は ADR-0091 に在ります（持ち主の裁定 2026-09-28T01:55Z・2026-09-29T05:01Z・2026-09-29T05:44Z）。"
  - id: FR1096
    title: "PR で着地した便の close"
    pattern: event
    strength: must
    when: "PR で着地した便（--pr-cmd の形で Landed に達し、 main を動かさず自 repo への PR を作った便）の worktree を、 PR の merge の後に畳む器の口（pipe retire・撃ち手の権能は FR1041）が撃たれたとき"
    shall: "器は、 worktree が在って clean であることを git と forge に問う前に確かめ、 vessel 宣言の任意 key remote が名指す remote について、 その PR の merge の commit が remote の main の先端の祖先であることと、 remote の main の先端の commit の CI の結果を照合し、 success の周だけ台帳の便を着地の形の close の理由（FR1091・着地 commit id は merge の commit id・理由の尾に CI の結果と、 merge の commit が remote の main の先端でない周は先端の commit id を持つ）で close してから worktree を畳み（ADR-0094）、 close した周に memo の自動の close（FR1093）を撃つ。 契約が着地の形で閉じ済みの便への撃ちは照合も close も撃たずに畳むだけとする。 通らない周は close も畳みも event と台帳の書きもせず、 理由の閉じた語を 1 行出して rc 1 で終わり、 同じ口で撃ち直せる — worktree が無いか clean でないか move が落ちて畳めない周は worktree-unready（close 済みの周も含む）、 PR が merge されていない周は not-merged、 merge の commit が remote の main の先端の祖先でない周は not-ancestor、 先端の CI の結果が success でない周（結果がまだ無い周を含む）は ci-not-success、 照合に要る git か forge の問いを撃てない周と vessel 宣言が key remote を持たないか読めない周は unmeasured、 照合が通って close が台帳に届かない周は unwritten（畳まない）。 口に畳むだけの指定（--fold-only）を付けた周は、 照合も close もせずに worktree を可逆な move で畳み、 契約は開いたまま残す（merge されずに閉じた PR の便と、 key remote を持たない repo の PR の便と、 宣言と別の remote へ PR を出した便の出口。 畳んだ後は同じ口で着地の形の close に届かない）"
    plain: "要するに、PR を作って終わった便（PR で着地した便。--pr-cmd の形で着地し、main は動かさず自分の repo へ PR を作った便）は、PR が merge された後に器が確かめてから閉じる、という決まりです。PR の merge の後に便の作業場所（worktree）を畳む器の口（pipe retire。撃ち手の権能は FR1041）を撃つと、器はまず作業場所が在って clean かを確かめ、vessel 宣言が名指す押す先（任意 key remote）について、merge の commit が remote の main の先端（最新の commit）から辿れる（先端の祖先である）ことと、先端の commit の CI の結果を確かめ、緑のときだけ台帳の便を着地の形の理由（着地した commit は merge の commit。末尾に CI の結果と、merge の commit が先端でないときは先端の commit の番号を持ちます）で close してから作業場所を畳み、同じ周に memo の自動の close（FR1093）も撃ちます（ADR-0094）。契約がもう着地の形で閉じている便なら、確かめも close もせずに畳むだけです。通らないときは close も畳みも記録もせず、理由の語を 1 行出して rc 1 で終わり、同じ口で撃ち直せます。語は、作業場所が無いか clean でないか畳む動きが落ちた worktree-unready（もう閉じた周も含む）・merge されていない not-merged・祖先でない not-ancestor・CI が緑でない（まだ結果が無いときを含む）ci-not-success・確かめに要る git や forge の問い合わせが撃てないときと宣言に押す先が無いか読めないときの unmeasured・確かめが通ったのに close が台帳に届かないときの unwritten の 6 つです。畳むだけの指定（--fold-only）を付けたときは、確かめも close もせずに作業場所を戻せる形で畳み、契約は開いたまま残します（merge されずに閉じた PR の便や、押す先を宣言しない repo の PR の便、宣言と別の押す先へ PR を出した便の出口です。畳んだ後は、同じ口で着地の形の close には届きません）。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1015, AC1065]}
    goals: [GOAL1001, GOAL1003]
    figures: []
    note: "なぜ要るか: 自律安全（GOAL1001）と記憶に頼らない（GOAL1003）から来ています。起票の門の close の断り（FR1081 (d)）が掛かる repo では着地の形の close を書けるのが land の終端だけなので、main を動かさずに PR を作って終わる便は、器が merge を確かめて閉じなければ着地として閉じる手段がありません（GOAL1001）。merge の commit が remote の main の先端から辿れることと先端の CI を確かめるのは、merge されていない PR や赤い main を着地として閉じないためです（GOAL1003）。畳むだけの指定を残すのは、merge されずに閉じた PR の便・押す先を宣言しない repo の PR の便・宣言と別の押す先へ PR を出した便の作業場所（worktree）を戻せる形で片付ける道を失わないためです（GOAL1001）。採らなかった案は ADR-0094 に在ります（持ち主の裁定 2026-09-29T05:46Z）。この口の名指しの形が席の権能〔settle〕に在る理由は FR1041 と ADR-0097 に在ります（持ち主の裁定 2026-09-29T21:53Z・畳むだけの指定を名指しの形に含めるのは ADR-0097 が足した設計）。"
  - id: FR1097
    title: "口座の墓標の判定"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "器は口座の墓標（口座の credential の file に現れる、 再 login でしか戻らない印）を、 口座の設定 dir の credential の file を読む 1 本の関数で判じ（墓標の読みは、 計測〔FR1033〕が credential の file を読んで墓標の回を測れなかった回として記す読みと同じ 1 本）、 判じるときに計測を起こさず、 token の値をどの出力にも記録にも出さない。 器が credential の file を読むのは計測（FR1033）とこの判定だけで、 器は credential の file を書かない。 判定の語は閉じた 3 つで、 present（file が在り墓標と読めない。 期限切れの file・読めない file・墓標でなく token の無い file を含む）・missing（file が無いか、 同じ名の物が file でない）・dead（墓標）とする。 同じ 1 本を、 doctor と口座の一覧（account ls）の口座の行の credential=・管理 tick の合図を送らない句と起こす前の群の移動の判定（FR1027）・移動の契機と墓標の口座を測らない句と移り先の候補から外す句（FR1038）が読み、 doctor の群の行は墓標の語を持たない（群の今の口座の墓標は current= と口座の行の credential= で引く）。 期限の時刻を根拠にした判定と警報は持たず、 器は再 login を代行しない（ADR-0098）"
    plain: "器は、口座が再 login の要る印（口座の墓標）を持つかを、口座の設定 dir にある credential の file を読む 1 本の関数だけで判じます。この読みは、計測（FR1033）が「墓標で測れなかった」と記すときの読みと同じ 1 本です。判じるときに計測は起こさず、token の値はどの出力にも記録にも出しません。器が credential の file を読むのは計測とこの判定だけで、器は credential の file を書きません。答えの語は 3 つだけで、present は file が在って墓標と読めないとき（期限切れの file・読めない file・墓標でなく token の無い file も含みます。期限切れは墓標ではありません）、missing は file が無いとき（同じ名の物が file でないときも）、dead は墓標のときです。同じ 1 本を、doctor と口座の一覧（account ls）の口座の行の credential=、管理 tick の合図を送らない決まりと起こす前のかたまりの移動の判定（FR1027）、かたまりの移動のきっかけと墓標の口座を測らない決まりと移り先の候補から外す決まり（FR1038）が読みます。doctor のかたまりの行は墓標の語を持ちません（いま使う口座の墓標は current= と口座の行の credential= で引きます）。期限の時刻を理由にした判定や警報は持たず、器は再 login を代わりに行いません（ADR-0098）。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1018, AC1041, AC1066]}
    goals: [GOAL1001, GOAL1003]
    figures: []
    note: "なぜ要るか: 自律安全（GOAL1001）と記憶に頼らない（GOAL1003）から来ています。墓標の口座の席は、人が気づくまで止まります。file をその場で読む 1 本にすれば、doctor・管理 tick・かたまりの移動のどの面も同じ答えを読み（GOAL1003）、かたまりの席は移り先が在れば人手なしに別の口座へ移れます（GOAL1001）。採らなかった案（計測の記録から読む・移さずに知らせるだけにする・判定の語を 4 つにして期限切れも名指す など）は ADR-0098 に在ります。"
  - id: FR1098
    title: "終わりの門"
    pattern: event
    strength: must
    when: "runner の turn が rc 0 かつ base からの commit 1 件以上で終わったとき"
    shall: "器は Implemented と記帳する前に、 gate と同じ段の列（gate の write-set を照らす段・共通 verify・契約の verify の各行）を gate と同じ撃つ関数・封じ込め・並列の枠で便の worktree に撃ち（終わりの門）、 行ごとの rc を便の記録に残す。 全行の rc が 0 なら Implemented と記帳する。 rc が 0 でない行が在り、 測れなかった行が無く、 同じ便の門の赤の周の数が rules 行 runner.end_gate_rounds（値は user 裁定 id 付き）に届いていない周は、 段を Spawned のまま門の赤を記帳し、 同じ worktree・同じ base・同じ契約で runner を起こし直し、 stdin の契約の後ろに rc が 0 でない行ごとの行の字・rc・診断の末尾の抜粋（行ごとと合計に上限）を持つ節を足す。 周を使い切った周と、 測れなかった行が在る周は、 Implemented と記帳し、 記録に赤か測れなかったかを名乗る。 門を撃つ間は、 同じ便に runner を起こす口（手の再開を含む）を断る。 gate は終わりの門の結果を持ち越さずに全行を撃ち（FR1008）、 周の数は便の event から数えて process の記憶に持たない（FR1003）"
    plain: "実装役（runner）の turn が正常終了（rc 0）で、出発点から commit が 1 件以上あるときは、「実装済み」と記録する前に、器が gate と同じ検査の列（触ってよい範囲を照らす段・共通 verify・契約の verify の各行）を、gate と同じ撃ち方・封じ込め・並列の枠で便の worktree に撃ち、行ごとの結果を記録します（終わりの門）。全部が通れば「実装済み」にします。落ちた行があり、測れなかった行が無く、門で落ちた回数が規則の行 runner.end_gate_rounds の値（user の裁定で決めます）に届いていなければ、段は Spawned のままにして門の赤を記録し、同じ worktree・同じ出発点・同じ契約で実装役を起こし直し、入力の契約の後ろに、落ちた行ごとの行の字・rc・診断の末尾の抜粋（行ごとと合計に上限があります）を足します。回数を使い切ったときと、測れなかった行があるときは「実装済み」にして、落ちたか測れなかったかを記録に残します。門を撃っている間は、同じ便に実装役を起こす口（手での再開を含みます）を断ります。gate は門の結果を持ち越さず、全部の行を撃ち直します（FR1008）。回数は便の記録から数え、process の記憶には持ちません（FR1003）。gate と同じ列には gate の最初の、触ってよい範囲を照らす段（歯の照らし〔FR1106〕と、置き場だけと印を付けた file の検査〔FR1008〕を含みます）も入るので、そこで落ちた便も実装役が直せます。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1072]}
    goals: [GOAL1001, GOAL1002]
    figures: []
    note: "なぜ要るか: 自律安全（GOAL1001）と消費は害（GOAL1002）から来ています。共通 verify の行を実装役に渡すだけでは撃ったかを器は測れず、gate の FAIL の主な根の 1 つが共通 verify の赤です（数えは ADR-0102）。合格の条件は「渡したか」でなく「撃って通ったか」なので、器が実装役の turn の直後に撃って確かめます。判定の後に便を戻すと終端の数えと着地の列が動くので（器は裁定なしに自動では戻さない・FR1077）、門は判定の前の、実装役の turn の延長に置きます。門の間の再開を断るのは、実装役の process が終わっていて、手の再開が process の生死だけで判じると、2 本目の実装役が同じ worktree の隣に起きるからです。緑の便も共通 verify を 2 回撃つ費用は受け入れ、gate に門の結果を持ち越さないのは、gate が独立に測る性質を保つためです（ADR-0102）。"
  - id: FR1099
    title: "lens の permission の値の記録"
    pattern: unwanted
    strength: must
