  - id: FR16
    title: 表示面（席が端末の Chrome を起こす）
    pattern: event
    strength: must
    when: 席が持ち主に面を見せるとき
    shall: 席は端末の一覧（器の宣言の行・名・ssh の宛先・Chrome の場所・画面の環境・入力の環境・専用の profile・OS）から端末の名で命令し、ssh 経由で Chrome を専用の profile の app mode で起こし、CDP を tunnel で引いて navigate・viewport・reload・click・入力・key・scroll・待ちと、screenshot・DOM・console を行う。どの project をどの端末に出すかは版管理に載らない表示先の設定（全体の既定と project ごとの上書き・値は端末の一覧に在る名だけ）で持ち、tz の口で変え、2 つの board の設定の画面（project board では上の固定の帯の設定〔⚙〕の中の表示先）もその口を通る。窓は board ごとに 1 つで、席はその board の窓だけを操作する。窓を起こすのは、表示先の端末に初めて見せる時（その端末の最初の board の窓）と、持ち主が tz の口か board の button で頼んだ時だけで（持ち主が閉じた窓は開き直さない）、窓を足す手は動いている Chrome へ渡す起動の引数だけとし、窓を前に出す命令と窓を動かす命令と頁の target を作る CDP の命令は撃たず、持ち主へは知らせだけを出す。board の頁の上では click・入力・key を断る。ssh で届かない端末には board の URL を渡すだけにし、席は server 側の headless Chrome を自分の目にする。
    plain: 席があなたの PC の browser を開いて画面を出し、操作して見せます。どの project をどの PC に出すかは設定でいつでも変えられます。窓は board ごとに 1 つで、席が自分で開くのはその PC に最初に見せる 1 回だけ、ほかの board の窓はあなたが頼んだ時だけ開き、勝手に前に出さず、あなたが閉じた窓も開き直さず、知らせだけを出します。board の上では見せるだけです。ssh の届かない端末（スマホなど）には見る URL を渡します。
    basis: [N-5, N-6, N-7]
    verify: {method: test, how: 偽の ssh と偽の Chrome で起動の引数（profile・app mode・入力の環境）と CDP の命令の列を snapshot で見て、窓を前に出す命令と board の頁の上の入力の命令が無いことと、届かない端末で URL の行が出ることを見る, ac: [AC13]}
    goals: [GOAL4]
    figures: []
    adrs: [ADR-5, ADR-7, ADR-15, ADR-24, ADR-27]
  - id: FR17
    title: 人が打つ binary は tz の 1 つ
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: folio の口（check・schema・derive・ceiling・init・parts・face・figure・build・intake・hello）は同じ名の tz の subcommand で、引数と終了 code（合格 0・不合格 1・まだ分からない 2）は folio2 の口のまま。graph は tz graph に吸収し、inject は持たず、serve の要否は面の便で決める。
    plain: 打ち込む命令は tz の 1 つだけです。設計の道具の命令は tz の下で同じ名前で使えます。
    basis: [P-27, N-3]
    verify: {method: test, how: 口ごとに folio と tz の終了 code と出力の一致を見る, ac: [AC14]}
    goals: [GOAL4]
    figures: []
    adrs: [ADR-8]
  - id: FR18
    title: 指し示し（画像と囲みと一言を席へ渡す）
    pattern: event
    strength: must
    when: 持ち主が裁定面の指し示しの欄から指摘を送ったとき
    shall: 面の server は指摘に id を発行し、一言と全体の画像と囲みごとの切り抜きと頁の文脈と囲みの中の要素の素性（上限つき・入力欄の値は伏せる）を state dir に置き、台帳に bead 1 本を置く。取り込み方は、表示面の画面と DOM の写しを同時に取って裁定面で囲む・アプリの窓の上で要素を指すか範囲を囲む・画像を貼るか落として囲む、の 3 つ。指摘は承認として数えず問いを閉じない。
    plain: 画面の一部や画像を、一言と一緒に席へ渡せます。渡し方は 3 つで、席には囲んだ部分の画像とそこに在る部品の情報が届きます。承認としては数えません。
