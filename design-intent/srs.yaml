    strength: must
    when: "開発 session の席で session が開始されるとき（/compact の後を含む）、 または圧縮（/compact と自動圧縮）が始まる直前"
    shall: "session の開始では、 器は、 その席に役割の記録が在ればその役割の manifest 行と役割ごとの雛形から生成した短い指示文（席の同一性・憲法の効く部分の pointer・役割の特性・台帳の現在地の 4 群からなり、 行の構成と行数の上限は ADR-0045 が正本）を session の開始で文脈へ注入し（入力欄を経由しない）、 役割の記録が無ければ注入せず、 runner には憲法の散文を 1 行も注入しない。 生成した指示文は行が持つ権能をすべて名指し、 C 条文の規範文を持たず、 雛形の外に手書きの規範文を含まない（両向きの drift は CI が検査する・FR1018）。 役割の記録が在る席の session の開始では、 器は指示文の後ろに、 台帳と git と局面の出力から機械で導いた直近の流れの事実行（仕掛かり中の契約・直近に更新された契約・直近の commit・未 commit の変更・局面の出力〔FR1090〕が持つ席の手番の閾値越えの件数と最古の 1 件〔在る周だけ〕。 規範文を持たず指示文の行数に数えない）を出し、 圧縮の後の開始で圧縮の直前の 1 枠が在れば、 その 1 枠を 1 回だけ出して消す。 圧縮が始まる直前では、 器は役割の記録が在る席の直前の発言を逐語で圧縮の直前の 1 枠（state dir の席ごとの置き場・repo の外）に書き、 圧縮を止めない（役割の記録が無い席では書かない）"
    plain: "契機は 2 つあります。席の session が始まるとき（/compact の後も含む）と、圧縮が始まる直前です。session が始まるたびに、器がその席の短い指示文（manifest の行と役割ごとの雛形から生成）を会話の文脈へ差し込みます（入力欄は使いません）。中身は、席が誰か・憲法のうち効く部分への pointer・役割の特性・台帳の現在地の 4 群で、行の構成と行数の上限は ADR-0045 が正本です。役割の記録が無い席には何も差し込まず、実装役には憲法の文章を 1 行も渡しません。指示文は行が持つ権能をすべて名指し、憲法の C 条文の規範文を持たず、雛形の外に手書きの規範文は置きません。役割の記録が在る席では、同じ session の開始で、指示文の後ろに、台帳と git と局面の出力（FR1090）から機械で導いた直近の流れの事実行（仕掛かり中の契約・直近に更新された契約・直近の commit・未 commit の変更・席の手番のまま年齢の閾値を越えた部品（FR1090）があるときの件数といちばん古い 1 件）を出します。これは規範文を持たず、指示文の行数にも数えません。圧縮の後の開始で「圧縮の直前の 1 枠」が在れば、その 1 枠を 1 回だけ出して消します。圧縮（/compact と自動圧縮）が始まる直前には、器が役割の記録が在る席の直前の発言を逐語で「圧縮の直前の 1 枠」に書きます（役割の記録が無い席では書きません）。置き場は state dir の席ごとの置き場で、repo の外です。1 枠を書く処理は圧縮を止めません（書けないときも止めません）。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1017, AC1060]}
    goals: [GOAL1003]
    figures: []
    note: "なぜ要るか: 記憶に頼らない（GOAL1003）から来ています。書かれた規律が席の文脈に届く経路が無いと、要件が在っても守られません。生成した指示文を器が差し込めば、届く経路が構造になります（器の憲法 C1.2・C14.2）。席の記憶に頼らず続きを拾えるよう、台帳と git から機械で導いた事実行と、圧縮をまたぐ逐語の 1 枠も器が出します。事実行の 5 種目（席の手番の閾値越え）の経緯は ADR-0088 に在ります。"
  - id: FR1043
    title: "席の継続"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "器は席の queue を持たず、 続きの pointer を queue から注入しない（ADR-0045 §2 (2)）。 席が抱える次の仕事は台帳の現在値が持ち、 管理 tick（FR1027）が台帳の現在地から続きを進めるよう促す 1 行を注入する（ADR-0058）。 合図が 24 時間で打ち切られた後の席の続きは user が対話面で促す"
    plain: "器は席の queue（続きの pointer の並び）を持ちません（ADR-0045）。席の次の仕事は台帳が持ち、管理 tick（FR1027）が台帳の現在地から「続きを」と促す 1 行を差し込みます（ADR-0058）。合図が 24 時間で打ち切られた後は、続きは user が対話面で促します。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1018]}
    goals: [GOAL1001]
    figures: []
    note: "なぜ要るか: 自律安全（GOAL1001）から来ています。席の次の仕事は台帳が構造で持てるので、器が席の queue を別に持つ必要はありません（ADR-0045）。黙った席に続きを促す役は管理 tick が担い、人が気づいて促す手間を減らします（ADR-0058）。"
  - id: FR1044
    title: "席間の連絡（廃止）"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "1 つの anchor の席は orchestrator の 1 席（FR1040）であり、 器は席間の連絡の経路を持たない（ADR-0045 §2 (2) で廃止・ADR-0058）。 器から席の入力欄への差し込みは席の起動（FR1059）の起動行・管理 tick（FR1027）の打刻の合図・群の逼迫の通知と移動（FR1038）の通知と退避の合図・park の区画の移動（FR1095）の退避の合図・便の終端の周の通知（器の dispatcher〔FR1068〕が便の終端の周に orchestrator の席へ送る 1 行・形は dispatcher の設計が持つ。 起こす便が 0 の周の 1 行は memo の要約〔FR1087〕も持つ）・裁定の指し示し（FR1079・送る行に入る外からの値は裁定面の記帳 id だけ・ADR-0077）にだけ使い、 台帳の現在地から続きを進めるよう促す差し込みは打刻の合図だけで、 便の終端の周の通知は便の出来事と次の 1 手の在りか（起こす便が 0 の周は memo の要約も）を、 裁定の指し示しは裁定が届いたことだけを知らせる 1 行である。 席の turn の終わりの止め（FR1088）の理由は入力欄への差し込みではない。 経路の不在は不在を測る歯が確かめる"
    plain: "1 つの project に席は orchestrator の 1 席だけなので、席どうしの連絡の経路を器は持ちません（ADR-0045・ADR-0058）。器が席の入力欄に差し込むのは、席の起動の 1 行（FR1059）・管理 tick の打刻の合図（FR1027）・かたまりの逼迫の通知・移動の通知・退避の合図（FR1038）・park の区画の席の移動の退避の合図（FR1095）・便の終端の周の通知（便の終端の周〔dispatcher の 1 周〕に器の dispatcher〔FR1068〕が席へ送る 1 行。起こす便が 0 の周の 1 行は memo の要約〔FR1087〕も持ちます）・外の裁定面に裁定が書かれたことの 1 行の指し示し（FR1079・送る行に入る外からの値は裁定面の記帳 id だけで、中身は運ばない）だけです。台帳の現在地から続きを進めるよう促す差し込みは打刻の合図だけで、便の終端の周の通知は便の出来事と次の 1 手の在りか（起こす便が 0 の周は memo の要約も）を、裁定の指し示しは裁定が届いたことだけを知らせる 1 行です。席の turn の終わりの止め（FR1088）の理由は入力欄への差し込みではありません。経路が無いことは test が確かめます。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1019, AC1049, AC1057, AC1058, AC1090]}
    goals: [GOAL1003]
    figures: []
    note: "なぜ要るか: 記憶に頼らない（GOAL1003）から来ています。席間の連絡は席が 2 つ在る配送構造にだけ要る経路で、席が orchestrator の 1 つなら経路そのものが無いからです（ADR-0045）。打刻の合図は席どうしの連絡ではなく器から席への 1 行で、既存の入力欄の門を通ります（ADR-0058）。便の終端の周の通知も、器から席へ便の出来事と次の 1 手の在りかを知らせる 1 行で台帳の現在地から続きを進めるよう促さないので、席どうしの連絡ではありません（持ち主の裁定 2026-09-27T00:59Z）。裁定の指し示しが運ぶ外からの値は裁定面の記帳 id 1 つだけで、席どうしの連絡の経路にしない作りです（ADR-0077）。turn の終わりの止めを差し込みの一覧に入れない経緯は ADR-0087 に在ります。"
  - id: FR1045
    title: "権能の執行"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "権能で守られた操作はその権能を持つ役割の席からだけ通し、 検査は編集・実行の時点で（in-loop に）行い、 断るときは欠けた権能と権能を持つ rules 行の id を告げる。 席の src の編集は、 契約が typed な印で開いた便の write-set の内側に限り通す"
    plain: "権能で守られた操作は、その権能を持つ役割の席からしか通りません。検査は編集・実行の瞬間に行い、止めるときは足りない権能と、権能を持つ rules 行の id を告げます。席の本体 code（src）の編集は、契約が印で開いた便の作業範囲に限って通ります。"
