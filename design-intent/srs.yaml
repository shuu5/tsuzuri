  - id: FR19
    title: 相談の窓 consult（席の文脈から分けた自由な調べと検証の場）と型付きの所見
    pattern: event
    strength: must
    when: 持ち主か席が相談の窓を開き、窓が所見を出したとき
    shall: 相談の窓は、持ち主が席の窓の skill（/tsuzuri:consult）か board の上の帯と吹き出しの相談の口から頼み、席が skill で起こす。形は持ち主が直に話す窓（席の tmux の session の別の窓）と、席が背景で起こす非対話の問う窓の 2 つで、どちらも 1 つの議題に限らず、話題を替えても所見を渡しても閉じない。起動の口は席の口座の置き場の環境変数を継ぎ、器と tsuzuri の plugin を渡さず、制限の形・許可を聞かない形・道具の閉じた列（web の調べを含む）・外の道具（MCP）の断り・読む根の足しと書きの断り・私用の一時の置き場・囲い（有効・囲いの外の撃ち直しの断り・起きない時は起動で止める・資格の file の断り・殻の命令のネットワークは package の配り元だけ）で、窓ごとの作業場（席の drafts の下）を作業の dir にして起こす。所見を出す口は欄（結論・候補と採否・推奨・根拠の id・主張ごとの確かさ・持ち主に問うべき事・触る節点・使った model・読んだ束の要約値・話題・添え物）を検め、欠けていれば受けず、受けた所見を作業場の決まった dir に書く。相談の窓は repo と台帳を書かない。席は相談の見張りを背景に常に置き、見張りは新しい所見と受けの無い相談の頼みで固定の 1 行を出して終わる。席は所見を読む口で読み、台帳に相談の所見と相談の受けの行を置き、所見ごとに処分（採る・一部採る・採らない と理由・添え物ごとの保存する・しない）を宣言する。保存する添え物は席が repo へ写す。処分の無い所見と席に届いていない頼みは board の相談の窓と tz consult の一覧に出す。席が自分で開く問う窓の本数は規則の行 R-38 の上限を越えない。
    plain: 設計や技術の調べと検証をする別の窓を、席の窓の「/tsuzuri:consult」か board の「相談」で開きます。あなたが直に話す窓と、席が強い model に問う話さない形があり、どちらも話題を替えて使い続けられます。窓ごとの作業場でプログラムを組んで実験でき、web も調べられますが、repo と台帳は書けず、作業場の外へは囲いで書けません。結論は決まった形の file に書いて席に渡し、席が自動で気づいて、採るかどうかと、レポートを repo に保存するかを記録します。
    basis: [P-7, P-12, P-14, P-16, P-19, N-2, N-7]
    verify: {method: test, how: 欄の欠けた所見が断られ揃った所見が作業場の決まった dir に書かれることと、見張りの固定の 1 行と、席の読みの口の台帳の 2 行を見て、起動の口の argv と設定を fixture と比べ、囲いの中から作業場の外と repo への書きが断られることを撃つ, ac: [AC16, AC19]}
    goals: [GOAL1, GOAL2]
    figures: []
    rules: [R-38]
    adrs: [ADR-10, ADR-12, ADR-29]
    note: 自由な場と作業場と囲いと受け方と保存の選びは判断の記録 ADR-29（持ち主の裁定 t3-hub.75.1 と t3-hub.75.2）。前の字（器の口で 1 行を送る・未反映の一覧に載る）は ADR-29 決定 (1) の (エ)(オ) で替えた。相談の台帳の行は「相談の」で始まる閉じた頭で、memo と根の bead にだけ置く（ADR-29 決定 (4)）。
  - id: FR20
    title: 表示面の対象を広げる（中身が web の native・スマホの emulator・純粋な native）
    pattern: ubiquitous
    strength: should
    when: つねに
    shall: 表示面は、CDP を話す対象（web・中身が web の native）を CDP で、話さない対象（スマホの emulator・純粋な native）を画面の配信と入力の戻しの 1 本の経路で見せて操作する。対象ごとに別の表示の仕組みを作らない。
