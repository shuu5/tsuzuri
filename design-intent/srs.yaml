  - id: FR1105
    title: "done の項目ごとの歯の欄の照らし"
    pattern: unwanted
    strength: must
    when: "契約表の行が done の項目ごとの歯を名指す任意の欄を持ち、 欄が次のどれかに外れるとき — (a) 要素が「番号:歯」の形で読め、 歯は名・= を前に置いた既存の歯・@ と番号で指す verify 行・! を前に置いた器の仕組みの名の 4 形のどれか (b) 番号の集合が done の項目の 1〜K とちょうど等しい（K が 0 の行は欄を持てない） (c) @ と番号で指す verify 行が行の verify 行の本数の内に在る (d) 名と既存の歯が、 名を解く読み手の在る形の verify 行の 1 本に選ばれる (e) base を持つ判定（base を渡した契約表の検査の変わった行・受付・受付と同じ判定を便を作らずに撃つ器の口）では、 既存の歯が base の、 その歯を選ぶ verify 行が選ぶ test の範囲にちょうど 1 つ在り、 base に在る名の歯は 1 か所に定まる (f) 器の仕組みの名が閉じた 4 語（write-set・place-only・new-file・closure）の内に在り、 測る物（place-only は = の項目・new-file は + か ~ の項目・closure は便の worktree で契約表の検査を撃つ verify 行）を行が持つ"
    shall: "器は契約表の検査と受付と、 受付と同じ判定を便を作らずに撃つ器の口の同じ 1 つの判定で、 外れた要素と理由を全件・行番号つきで名指し、 受付は便を作らない"
    plain: "契約表の行が done の項目ごとの歯を名指す欄を持つとき、器は契約表の検査・受付・受付と同じ判定を便を作らずに撃つ口の同じ 1 つの判定で次の (a)〜(f) を確かめ、外れた要素と理由を全部・行番号つきで名指し、受付は便を作りません。(a) 要素が「番号:歯」の形で読め、歯は名・= を前に置いた既存の歯・@ と番号で指す verify 行・! を前に置いた器の仕組みの名の 4 つの形のどれか。(b) 番号の集合が done の項目の 1〜K とちょうど同じ（項目が 0 の行は欄を持てません）。(c) @ と番号で指す verify 行が、行の verify 行の本数の内にある。(d) 名と既存の歯が、名を解く読み手のある形の verify 行の 1 本に選ばれる。(e) 比べる元（base）を持つ判定（base を渡した契約表の検査の変わった行・受付・受付と同じ判定の口）では、既存の歯が base の、その歯を選ぶ verify 行が選ぶ test の範囲にちょうど 1 つあり、base にある名の歯は 1 か所に決まる。(f) 器の仕組みの名が閉じた 4 語（write-set・place-only・new-file・closure）の内にあり、測る物（place-only は = の項目・new-file は + か ~ の項目・closure は便の worktree で契約表の検査を撃つ verify 行）を行が持つ。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1077, AC1026]}
    goals: [GOAL1002, GOAL1003]
    figures: []
    note: "なぜ要るか: 消費は害（GOAL1002）と記憶に頼らない（GOAL1003）から来ています。約束の番号と歯の対応が設計の節の散文にしか無いと、器が数えられません。便の失敗の根には、done の項目に歯が無いか、歯があっても verify 行に入っていない（撃たれない）形があります（数えは ADR-0104）。(e) を比べる元の無い検査に掛けないのは、着地済みの行が名指した歯を後の便が改名しただけで、その便の gate が落ちるからです（ADR-0104）。"
  - id: FR1106
    title: "gate の歯の照らし"
    pattern: event
    strength: must
    when: "契約 file が done の項目ごとの歯を名指す任意の欄を持つ便の gate が要求されたとき"
    shall: "器は gate の write-set を照らす段で、 名の形の歯（= も @ も ! も前に置かない歯）が便の worktree の HEAD の、 その歯を選ぶ verify 行が選ぶ test の範囲にちょうど 1 つ在り、 base に無いか本文が base と違うことと、 既存の歯が同じ範囲にちょうど 1 つ在ること（FR1105 の (e) と同じ述語）を測り、 外れた歯を名指して段を落とす（FAIL・落とす段と理由の型はその段の既存のもの）。 @ と番号で指す verify 行はこの段で測らない（FR1008 の実走が測る）"
    plain: "契約の file が done の項目ごとの歯を名指す欄を持つ便の gate を頼まれたら、器は gate の最初の、触ってよい範囲を照らす段で、名の形の歯（= も @ も ! も前に置かない歯）が便の worktree の HEAD の、その歯を選ぶ verify 行が選ぶ test の範囲にちょうど 1 つあり、base に無いか本文が base と違うこと（書いた・書き換えた）と、既存の歯が同じ範囲にちょうど 1 つあること（FR1105 の (e) と同じ述語）を数え、外れた歯を名指してその段を落とします（FAIL。落とす段と理由の型は、その段の既存のものです）。@ と番号で指す verify 行はこの段では測らず、verify 行の実走（FR1008）が測ります。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1078]}
    goals: [GOAL1002]
    figures: []
    note: "なぜ要るか: 消費は害（GOAL1002）から来ています。verify 行は、名指した歯が無くても filter に当たるほかの歯で緑になりえます。実装役が歯を書かない・書き換えない・消す形は gate の verify だけでは止められないので、gate の最初の段で数えます（ADR-0104）。"
  - id: FR1107
    title: "code の索引"
    pattern: event
    strength: must
    when: "vessel 宣言が code の索引を作る外の道具の command の任意 key（言語に依らない code の索引の形式〔SCIP〕の file を出す command の key と、 名の使われ方の種類の一致を 1 行 1 件で出す command の key）のどちらかを名乗る repo で、 行の審査（FR1100）・受付と起動の列（閉じた型を変えると宣言した契約〔FR1048〕か code の事実を名乗る欄を持つ行〔FR1109〕を扱う周に限る）・表を出す器の口のどれかが commit の code の索引を要したとき"
    shall: "器は、 宣言が 2 つの key の片方だけなら索引の宣言の読みで断って索引を持たない（vessel 宣言のほかの key の読みと FR1101 の宣言の読みには数えない）。 両方を名乗るなら、 その commit の code の木と宣言から決まる鍵の索引が state dir に在ればそれを読み、 無ければその commit を detach した木で宣言の command を封じ込めの中で host の memory の枠を取って撃ち（時間の上限は rules 行 index.timeout_s・値は user 裁定 id 付き）、 出力を器自身の読み手で読んで 1 行 1 場所の表にして state dir に置き、 作れなかった周は失敗の語を記録に残して表を置かない。 同じ鍵の索引を作り中の持ち主が生きている間は、 行の審査と表を出す器の口はその終わりを待ち、 受付と起動の列は待たずに下の作り中の扱いをとる。 state dir の索引の合計が rules 行 index.cap_mb（値は user 裁定 id 付き）を越える周は、 作り中の鍵と anchor の HEAD の鍵を除いて古い順に上限まで消す。 索引は作り直せる値で、 無い・読めない・形の違う索引は無いと読み、 真実の置き場にしない。 base の索引を作り中の周は、 閉じた型を宣言し code の事実の欄を持たない契約を、 起動の列は受付の理由（作り中の名）で待たせ、 手の受付（起動の列を経ずに撃たれた受付）は同じ名で断って便を作らない（欄を持つ行の扱いは FR1109）。 索引を作れない周は、 閉包を code の索引の分を除く字面の閉包（FR1055）にとどめ、 受付の 1 行に索引が無いことを 1 語で残す（欄を持つ行の扱いは FR1109）"
    plain: "vessel 宣言が code の索引を作る外の道具の command の key（言語に依らない code の索引の形式〔SCIP〕の file を出す command と、名の使われ方の種類の一致を 1 行 1 件で出す command）のどちらかを名乗る repo で、行の審査（FR1100）・受付と起動の列（閉じた型を変えると宣言した契約〔FR1048〕か、code の事実を名乗る欄を持つ行〔FR1109〕を扱うときだけ）・表を出す器の口のどれかが、ある commit の code の索引を要したときの扱いです。宣言が 2 つの key の片方だけなら、索引の宣言の読みで断り、索引を持ちません（vessel 宣言のほかの key の読みと、FR1101 の宣言の読みには数えません）。両方あれば、器は、その commit の code の木と宣言から決まる鍵の索引が state dir にあればそれを読みます。無ければ、その commit を切り離した作業木で、宣言の command を封じ込めの中で host の memory の枠を取って撃ち（時間の上限は規則の行 index.timeout_s）、出力を器自身の読み手で読んで 1 行 1 場所の表にし、state dir に置きます。作れなかったときは失敗の語を記録に残し、表を置きません。同じ鍵の索引を作っている持ち主が生きている間は、行の審査と表を出す器の口はその終わりを待ち、受付と起動の列は待たずに下の作り中の扱いをとります。state dir の索引の合計が規則の行 index.cap_mb を越えたら、作り中の鍵と anchor の HEAD の鍵を除いて古い順に上限まで消します。2 つの規則の行の値は user の裁定で決めます。索引は作り直せる値で、無い・読めない・形の違う索引は無いと読み、真実の置き場にはしません。base の索引を作っている間は、閉じた型を宣言し code の事実の欄を持たない契約を、起動の列は受付の理由（作り中の名）で待たせ、手の受付（起動の列を経ずに撃たれた受付）は同じ名で断って便を作りません（欄を持つ行の扱いは FR1109）。索引を作れないときは、閉包を code の索引の分を除く字面の閉包（FR1055）にとどめ、受付の 1 行に索引が無いことを 1 語で残します（欄を持つ行の扱いは FR1109）。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1080, AC1082]}
    goals: [GOAL1003, GOAL1002]
    figures: []
    note: "なぜ要るか: 記憶に頼らない（GOAL1003）と消費は害（GOAL1002）から来ています。設計が code の事実を誤るか知らない型が便の失敗の根で最も多く、設計者は手の字の検索だけで「この型を組み立てている場所は全部でどこか」を引きます（数えは ADR-0105）。器の binary に依存を足さず（NFR1003）、言語は宣言の側に置けば、Rust 以外の言語の repo も同じ形で名乗れます。外の道具の索引と構文の分類の組み合わせでその問いに答えられることは、試しで確かめてあります（ADR-0105）。"
  - id: FR1108
    title: "行ごとの使われ方の表"
    pattern: event
    strength: must
    when: "契約の審査（FR1049）か行の審査（FR1100）の材料を組むとき、 または表を出す器の口が行か名を名指して撃たれたとき"
    shall: "器は、 その行か名指された名ごとに表を組む。 行を名指した周は、 行が変えると宣言した閉じた型と、 行が実装する節が名指す型と関数を項目にし、 名だけを名指した周はその名を項目にする。 表は項目ごとに、 参照・呼び手・構築・match・名を参照する歯・可視性の連鎖・その項目を宣言に持つほかの行の 7 つを、 名が現れる場所と件数と write-set の外の印とともに、 項目の名が tracked file に現れる件数と、 索引が読まない file に現れる件数（母集団）を並べる。 材料を組む周は表を材料の dir に同じ字で置き、 口の周は標準出力に出す。 契約の審査の材料は在る索引を読むだけで索引を作らせない（FR1107 を撃たない）。 code の索引が無い周は無いことを 1 行で名指す"
    plain: "契約の審査（FR1049）か行の審査（FR1100）の材料を組むとき、または表を出す器の口が行か名を名指して撃たれたとき、器は、その行か名指された名ごとに表を組みます。行を名指したときは、行が変えると宣言した閉じた型と、行が実装する節が名指す型と関数を項目にし、名だけを名指したときはその名を項目にします。表は項目ごとに、参照・呼び手・構築・match・名を参照する歯・公開範囲のつながり・その項目を宣言に持つほかの行、の 7 つを、名が現れる場所と件数と、触ってよい範囲の外の印といっしょに並べます。横には、項目の名が tracked な file に現れる件数と、索引が読まない file に現れる件数（数えた範囲）も並べます。材料を組むときは表を材料の dir に同じ字で置き、口のときは標準出力に出します。契約の審査の材料は、在る索引を読むだけで、索引を作らせません（FR1107 を撃ちません）。code の索引が無いときは、無いことを 1 行で名指します。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1081]}
    goals: [GOAL1003]
    figures: []
    note: "なぜ要るか: 記憶に頼らない（GOAL1003）から来ています。素の字の検索でも事実の多くは手に入りますが、余分な答えに埋もれて設計者が読めません（試しの数えは ADR-0105）。件数と数えた範囲を同時に出し、審査役にも同じ表を渡せば、設計者と審査役が同じ事実から判じられます（ADR-0105）。"
  - id: FR1109
    title: "名乗った code の事実の測り直し"
    pattern: unwanted
    strength: must
    when: "契約表の行が code の事実を数で名乗る任意の欄を持ち、 行の審査の head・受付の base・起動の列の HEAD のどれかの commit の code の索引で測った値が名乗りと違うか、 その索引を作り中か作れないか、 vessel 宣言が索引の 2 つの key を揃えて名乗らない repo のとき"
    shall: "器は、 値が違う周は名乗り・名乗りの値・実測の値・増えた場所と消えた場所・母集団を名指し、 行の審査はその行を FAIL にし、 受付は契約を断って便を作らず、 起動の列はその契約を受付の理由で待たせる。 索引を作り中の周（受付と起動の列だけが出会う・行の審査は終わりを待つ〔FR1107〕）と作れない周は、 名乗りと測れない理由を名指し、 行の審査はそれを確定の断りに数えず（行の判定は lens に委ね、 記録に理由を残す）、 受付は契約を断って便を作らず、 起動の列はその契約を受付の理由で待たせる（名乗った事実を測らずに起動しない）。 索引の 2 つの key を揃えて名乗らない repo（名乗らない repo と片方だけ名乗る repo）では永久に測れないので、 行の審査はその行を FAIL にし、 受付は断り、 起動の列は受付の理由で待たせる。 欄を持たない行はこの判定の外で、 契約表の検査はこの判定を撃たず、 欄の要素の形（FR1047）だけを照らす"
    plain: "契約表の行が code の事実を数で名乗る欄（たとえば「この型の組み立ての場所は 5 か所」）を持ち、行の審査の head・受付の base・起動の列の HEAD のどれかの commit の code の索引で数えた値が名乗りと違うか、その索引を作っている間か作れないか、vessel 宣言が索引の 2 つの key を揃えて名乗らない repo のときの扱いです。値が違うときは、器は、名乗り・名乗りの値・数えた値・増えた場所と消えた場所・数えた範囲を名指し、行の審査はその行を FAIL にし、受付は契約を断って便を作らず、起動の列はその契約を受付の理由で待たせます。索引を作っている間（受付と起動の列だけが出会います。行の審査は作り終わりを待ちます・FR1107）と作れないときは、名乗りと測れない理由を名指し、行の審査はそれを確かな断りに数えず（行の判定は審査役に任せ、記録に理由を残します）、受付は契約を断って便を作らず、起動の列はその契約を受付の理由で待たせます（名乗った事実を測らずに起動しません）。索引の 2 つの key を揃えて名乗らない repo（名乗らない repo と片方だけ名乗る repo）では永久に測れないので、行の審査はその行を FAIL にし、受付は断り、起動の列は受付の理由で待たせます。欄を持たない行はこの判定の外で、契約表の検査はこの判定を撃たず、欄の要素の形（FR1047）だけを照らします。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1083]}
    goals: [GOAL1003, GOAL1002]
    figures: []
    note: "なぜ要るか: 記憶に頼らない（GOAL1003）と消費は害（GOAL1002）から来ています。設計の時点では正しかった事実が、便を起こすまでの間に別の着地で変わると、実装役と gate の周を丸ごと使って便が落ちます（出来事は ADR-0105）。名乗った事実を merge の前・受付・便を起こす直前に数え直せば、古びた事実のまま便を起こしません。測れないときに通さないのは、名乗った事実を測らずに通すと名乗りが守りにならないからです（ADR-0105）。"
  - id: FR1110
    title: "上限の許可の記帳"
    pattern: event
    strength: must
    when: "席が器の上限の許可の口に bead・rules 行・値・期限・裁定 id を渡して許可の記帳を撃ったとき、 または bead と rules 行に取り消しを渡して撃ったとき"
    shall: "許可の記帳の周は、 器が次の 10 の照合を上から順に照らし、 全部通る周だけ上限の許可の event（actor は machine）を event log に 1 件書いて 1 行を返す: 行が rules 行 pipe.permit_rows（値は user 裁定 id 付き）の名指す行に在る（rule-not-listed）・値が manifest の値より大きい有限の整数（not-raise）・裁定 id が問い id の形でその裁定 event が在る（no-ruling）・裁定 event が引く発話 event が在り actor が human（no-utterance）・発話の経路が対話の session で、 発話 event の session が対象 repo の orchestrator の席の会話 id（claude の session の id・状態の打刻の file の最後の行）と同じ（not-surface・打刻の file が無いか空でない行を持たない周と、 file の最後の行の会話 id が空か会話 id の形でない周も断る）・発話が問いの起票より後（before-question）・期限が今より後で発話の時刻から rules 行 pipe.permit_max_h（値は user 裁定 id 付き）の時間の内側（bad-until）・同じ裁定 id か同じ発話を引く許可がまだ無い（reused）・問いの本文が bead と行 id と値を字のまま持つ（not-stated）・bead の便がまだ着地していない（landed）。 許可の記帳の周は、 器は照らす前に event log・manifest・台帳・対象 repo の orchestrator の席の状態の打刻を読み、 どれかを読めない（file は在るが開けないか、 打刻の file の最後の行が打刻の形〔会話 id の欄の値を除いた行の形〕でない〔前の行へは戻らない〕か、 ほかの置き場の行の形が壊れているか、 manifest の読みが断る〔FR1017〕）周は照合の順に関わらず何も書かずに読めない旨を名指して rc 2 で止まり（NFR1004）、 照合のどれかが外れる周は何も書かずに、 最初に外れた照合の理由の語を名指して rc 1 で断る。 rules 行 pipe.permit_rows が名指せるのは、 FR1111 が許可の読み手を持つ行（予算 cap の rules 行）だけで（ほかの行〔許可の読み手の無い 1 つの便か bead の消費の行・host と群で分け合う上限・構造の上限〔器の憲法 C4・C13〕・上限でない行〕を名指す値は FR1017 の読みが断る）、 上限を外す（上限なし）許可は持たない。 取り消しの周は、 器は裁定 id を要らず、 読むのは event log と manifest だけで、 照合は rule-not-listed だけを照らし（外れる周は何も書かずに rc 1 で断る）、 通る周は同じ bead と行の許可を今の時刻で切る event を 1 件書き（効いている許可が無い周も書く）、 event log か manifest を読めない周は何も書かずに rc 2 で止まる（NFR1004）"
    plain: "席が器の上限の許可の口に、作業（bead）・上限の行・上げる値・期限・裁定 id を渡して許可を記帳するとき、または作業と行に取り消しを渡したときの扱いです。許可の記帳では、器が 10 の照合を上から順に確かめます。(1) 行が許可の対象の行（rules 行 pipe.permit_rows が名指す行・値は user 裁定 id 付き）であること（rule-not-listed）、(2) 値が設定（manifest）の値より大きい有限の整数であること（not-raise）、(3) 裁定 id が問い id の形で、その裁定の記録が在ること（no-ruling）、(4) 裁定が引く発話の記録（発話 event）が在り、人の言葉であること（no-utterance）、(5) その発話が対話の session から来て、対象の repo の orchestrator の席の会話 id（claude の session の id・状態の打刻の file の最後の行）と同じ session で記帳されたこと（not-surface・打刻の file が無いか空でない行を持たないときや、file の最後の行の会話 id が空か会話 id の形でないときも断ります）、(6) 発話が問いを立てた後であること（before-question）、(7) 期限が今より後で、発話の時刻から期限の上限（rules 行 pipe.permit_max_h の時間・値は user 裁定 id 付き）の内側であること（bad-until）、(8) 同じ裁定 id や同じ発話を使った許可がまだ無いこと（reused）、(9) 問いの本文に作業・行 id・値が字のまま書いてあること（not-stated）、(10) 作業の便がまだ着地していないこと（landed）、の 10 です。全部通ったときだけ、記録の主（actor）を machine とした許可の記録を event log に 1 件書いて 1 行を返します（人の言葉は結んだ裁定が持ち、許可はそこから器が導いたものです）。許可の記帳では、器は照らす前に、出来事の記録（event log）・設定・台帳・対象の repo の orchestrator の席の状態の打刻を読みます。どれかが読めない（file は在るが開けない・打刻の file の最後の行が打刻の形〔会話 id の欄の値を除いた行の形〕でない〔前の行へは戻りません〕・ほかの記録の行の形が壊れている・設定の読みが断る〔FR1017〕）ときは、照合の順に関わらず何も書かずに読めない旨を名指して止まります（rc 2）。照合が 1 つでも外れたら、何も書かずに最初に外れた照合の語を名指して断ります（rc 1）。pipe.permit_rows が名指せるのは、許可の値を読む手を FR1111 が持つ行（予算の行）だけで、ほかの行（読む手の無い作業ごとの行・host と群で分け合う上限・構造の上限・上限でない行）を名指した設定は、読みで断られます（FR1017）。上限を外す（上限なし）許可は持ちません。取り消しは裁定 id を要らず、読むのは出来事の記録と設定だけで、確かめるのは行が対象の行かどうか（rule-not-listed・外れたら何も書かずに断ります）だけで、同じ作業と行の許可を今の時刻で切る記録を 1 件書きます（効いている許可が無くても書きます）。取り消しで出来事の記録か設定が読めないときは、何も書かずに止まります（rc 2）。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1084]}
    goals: [GOAL1002, GOAL1001]
    figures: []
    note: "なぜ要るか: 消費は害（GOAL1002）と自律安全（GOAL1001）から来ています。消費の上限は、user が見ていない間に token が大量に使われないための守りです。許可の記録が無いと、正当な作業が上限に当たったときの手は、設定を PR で上げて戻す（重く、上げている間はほかの作業の上限も緩みます）か、写しの設定を渡す（誰が許したかを器が確かめず、記録も残りません）かに限られます（出来事は ADR-0106）。user の答えに結んだ裁定を器が照らしてから記録に残せば、user が問いに短く答えるだけで作業 1 つの上限が上がります。普通の口では席が字を渡して許可を作れず、偽った跡は記録と一覧に残ります（改ざんを不可能にはしません）。上限を外す形を持たないのは、見ていない間の大量の消費を防ぐという動機とぶつかるためです。"
  - id: FR1111
    title: "上限の許可の効き"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "器は、 bead に効いている上限の許可（期限の前で、 bead の便が未着地で、 同じ bead と行の最新の記帳がその許可自身〔後に取り消しも新しい許可も無い〕で、 値が今の manifest の値より大きい許可）が在る周だけ、 その bead の便の gate の予算の照合と、 その gate が起こす lens に許可の値を cap として読ませ、 それ以外の周と、 その gate の照合と lens の外の読み手のすべて（ほかの bead の便・契約の審査〔FR1049〕と行の審査〔FR1100〕と memo の審査〔FR1087〕の lens・host 全体の読み・CI の門を含む）には manifest の値を読ませる（手動の 1 周〔pipe dispatch〕に --rules で渡した写しで起きた便の読みは FR1112 の断りの外で、 扱いは後継の決定が持つ・ADR-0106）。 manifest の値の宣言（FR1017）は変えず、 許可の値は裁定に基づく実行時の記録として読む（ADR-0106）。 許可の値を読んだ gate の周は、 段の event と verdict の記録に行と値と裁定 id を書く。 pipe show は bead の許可を状態の閉じた語で 1 行ずつ出し、 先に当たる語を選ぶ（landed〔bead の便が着地〕・revoked〔同じ bead と行の次の記帳が取り消し〕・superseded〔次の記帳が新しい許可〕・expired〔期限の後〕・overtaken〔値が今の manifest の値以下〕・active〔効いている〕の順）。 pipe dispatch ls は効いている許可を 1 行ずつ出す。 event log を読めない周は、 許可の値へ倒さずに gate が rc 2 で止まり、 verdict を書かない（NFR1004）"
    plain: "器は、作業（bead）に効いている上限の許可（期限の前で、作業の便がまだ着地しておらず、同じ作業と行の最新の記録がその許可自身〔後に取り消しも新しい許可も無い〕で、値が今の設定〔manifest〕の値より大きい許可）が在るときだけ、その作業の便の検査（gate）の予算の照合と、その検査が起こす審査役（lens）に許可の値を上限として読ませます。それ以外のときと、その検査とその審査役の外の読み手はすべて（ほかの作業の便、契約の審査〔FR1049〕・行の審査〔FR1100〕・memo の審査〔FR1087〕の審査役、host 全体の読み、CI の門を含みます）、設定の値を読みます。手動の 1 周（pipe dispatch）に --rules で渡した写しで起きた便の読みは FR1112 の断りの外で、扱いは後の判断が持ちます（ADR-0106）。設定の値の宣言（FR1017）は変えず、許可の値は裁定に基づく実行時の記録として読みます。許可の値を読んだ検査の周は、段の記録と verdict の記録に行・値・裁定 id を書きます。pipe show は作業の許可を状態の語で 1 行ずつ出し、先に当たる語を選びます（landed＝作業が着地済み・revoked＝同じ作業と行の次の記録が取り消し・superseded＝次の記録が新しい許可・expired＝期限切れ・overtaken＝設定の値が許可の値以上に上がった・active＝効いている、の順）。pipe dispatch ls は効いている許可を 1 行ずつ出します。出来事の記録（event log）が読めないときは許可の値に倒さず、検査を rc 2 で止めて判定を書きません（NFR1004）。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1085]}
    goals: [GOAL1002]
    figures: []
    note: "なぜ要るか: 消費は害（GOAL1002）から来ています。許可を読むのをその作業の検査（gate の照合と、その検査が起こす審査役）だけに絞れば、ほかの作業の上限は動きません。host と群で分け合う上限や構造の上限（器の憲法 C4・C13）は、許可の対象の行の列がそもそも名指せないので（FR1110・FR1017）、許可で上がりません。設定の値の宣言を変えずに実行時の記録として読むので、設定の置き場は 1 つのままです（ADR-0106）。使った周と効いている許可が記録と一覧に出るので、いつ誰の言葉で上げたかを後から引けます。"
  - id: FR1112
    title: "hook の subcommand と event log の書きと規則の差し替えの遮断"
    pattern: unwanted
    strength: must
    when: "席の道具の呼び出しが、 器の hook の subcommand を撃つ形か、 state dir の event log の file を書く形（Edit・Write・shell の書き込みの向け先）か、 pipe gate・pipe land・pipe resume に --rules を渡す形のとき"
    shall: "器の hook の入口は実行の前にその呼び出しを断り、 形ごとの理由の語を名指す（席が起こした子 process の撃ちと書きは門の外・FR1082 と同じ）。 権能の guard（FR1045）が先に断る呼び出し（権能〔merge〕を持たない席の pipe land・権能〔launch〕を持たない席の pipe resume など）はその断りを出す。 event log を読むだけの command と、 --rules を持たない pipe gate・pipe land・pipe resume と、 手動の 1 周（pipe dispatch）に渡す --rules はこの断りに当たらない（手動の 1 周の --rules の扱いは後継の決定が持つ・ADR-0106）"
    plain: "席の道具の呼び出しが、器の hook の subcommand を直に撃つ形、state dir の出来事の記録（event log）の file を書く形（Edit・Write・shell の書き込みの向け先）、検査・着地・再開の command（pipe gate・pipe land・pipe resume）に設定の差し替え（--rules）を渡す形のどれかなら、器の hook の入口が実行の前に止め、形ごとの理由の語を名指します。席が起こした子 process の撃ちと書きは、この門の外です（FR1082 と同じ）。権能の見張り（FR1045）が先に断る呼び出し（merge の権能を持たない席の pipe land、launch の権能を持たない席の pipe resume など）は、その断りが出ます。記録を読むだけの command と、--rules を持たない検査・着地・再開と、手動の 1 周（pipe dispatch）に渡す --rules は、この断りに当たりません（手動の 1 周の --rules の扱いは後の判断が持ちます・ADR-0106）。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1086]}
    goals: [GOAL1001]
    figures: []
    note: "なぜ要るか: 自律安全（GOAL1001）から来ています。許可の照合は「記帳された発話が在る」ことを根拠にするので、席が器の hook の subcommand を直に撃って発話の記録を作る形や、出来事の記録に行を書き足す形が通ると、許可を偽れます。検査・着地・再開（pipe gate・pipe land・pipe resume）に --rules で設定を差し替える形は、許可を偽るのではなく、誰が許したかを確かめずに上限を迂回する、記録の残らない抜け道です。hook と出来事の記録の 2 形を止めれば普通の口では許可を偽れず、3 つの command の --rules の迂回も閉じます。手動の 1 周（pipe dispatch）が便へ写す --rules は断りの外に残り、扱いは後の判断が持ちます（ADR-0106）。席が起こした子 process の撃ちと書きも、この門の外に残ります（FR1082 と同じ）。"
  - id: FR1113
    title: "書き込みの検出線"
    pattern: event
    strength: must
    when: "管理 tick（FR1027）の周が判定を終えたとき、 doctor が回ったとき、 または席の session に prompt が打たれて席自身の hook が動いたとき"
    shall: "器は、 host の面（FR1057）の書き込みの検出線の表（0〜n 行・行は面の中で一意な名と block 装置の stat file の絶対 path を持つ。 表の形と置き場の断りは FR1057）が名指す block 装置ごとに、 UTC の 1 日の書き込み（byte）の記録を host の根に置く。 管理 tick の周は、 登録 row（FR1040）を持つ席の周だけ、 判定の後に装置が起動から書いた量の累計を読み、 前の読みとの差をその日に足して記録を進める（読む欄と単位は ADR-0112）。 同じ host の管理 tick が何本回っても、 記録は装置ごとに同じ UTC 日の内では周期の rules 行（FR1027）の間隔に高々 1 回だけ進み、 日付が進んだ周は周期の内側でも日を閉じる（装置ごとの排他は群の host の lock〔FR1038〕とも park の区画の手〔FR1095〕とも別）。 管理 tick の判定行・stderr・rc・最後の周の打刻（FR1078）は、 表の有無と書き込みの記録の成否に依らない（記録を進める手は stdout にも stderr にも書かない）。 登録 row か周期と排他の rules 行を読めない周と表の無い host では何も書かず、 記録の無い周に装置の stat file を読めないか形でないときも記録を作らない。 器は日を次の 3 語だけで分ける — 測った日（measured）・欠けた日（partial・同じ日に累計が減った〔再起動の〕日と、 日付が進んだ周に累計が減ったか前の標本から周期の 2 倍を越えて空いたか記録の日が昨日でないときの記録の日と今日と、 記録の無い周に開いた日で、 値は実際の量の下限）・測れない日（unmeasured・標本の無い日で、 閉じた日の記録の値を - と書き、 doctor の値の欄には語 unmeasured を書く）。 欠けた日と測れない日を 0 とも完全な値とも書かない。 装置の stat file を読めない周・形でない周・表の path が記録の path と違う周は記録の数を変えずに読みの結果の語だけを書き、 ほかの周が記録を進めている周と記録を読めない周は記録を変えない（fail-closed）。 線は rules 行 4 本（host.write_avg_gb・host.write_day_gb・host.write_avg_days・host.write_owner_days・GB は 10^9 byte）が持ち、 値は user 裁定 id 付きでこの 4 行だけが持つ（既定は 1500 GB・3000 GB・7 日・3 日）。 判定は 1 本の関数で、 装置ごとに独立に（和を取らずに）、 閉じた日の越えを「その日の値が 1 日の線を越えた、 またはその日で終わる平均の窓の 1 日平均が平均の線を越えた」こととし（平均の窓の 1 日平均は、 平均の窓の各日のうち値の在る日の値の和を平均の窓の日数で割った切り捨てで、 平均の窓の全日が測った日でない平均は下限）、 欠けた日の下限の値だけで線を越えた日も越えと数え、 昨日から遡って続く越えの日数（越えない日と値の無い日で止まる）が持ち主の段の連続日数の rules 行以上の状態を持ち主の段とする。 doctor の越えた線と席の hook の行の契機は、 今日か昨日の値（欠けた日の下限を含む）が 1 日の線を越えた周と、 昨日で終わる平均の窓の 1 日平均が平均の線を越えた周で、 持ち主の段の日数は閉じた日の越えだけで数える。 doctor は表の行ごとに write-budget で始まる 1 行（名の budget は予算の行〔FR1110〕ではない）を出し、 今日と昨日の値・昨日で終わる平均の窓の 1 日平均・越えた線・続いた越えの日数・持ち主の段（owner=yes か no）を持ち（欄の列と字は ADR-0112）、 線の rules 行を読めない周と平均の窓の日数が 0 の周は線に依る値を no-rule と書いて既定の値で埋めず、 記録を読めない周は読めない欄を unreadable と名指して 0 とも既定の値とも書かず（この記録は真実の store でなく、 doctor の rc は変えない）、 表の無い host では書き込みの行を出さず、 書き込みの行の外の doctor の出力は表の有無と線の越えに依らない。 席自身の hook は、 席の pane を持つ呼び出しで、 越えた線を持つ表の行（線の rules 行を読めない周と平均の窓の日数が 0 の周は no-rule の行）ごとに、 持ち主の段を owner=yes か no で持つ 1 行を、 群の逼迫の 1 行（FR1038）の後ろの追加文脈へ足して注入計測の slot（FR1021）に 1 行を残し、 越えない周・表の無い host・面か記録を読めず越えの値の無い周は 1 byte も足さず、 stderr にも書かず rc 0 で終わり、 session の開始の口（FR1042）には足さない。 器は線を越えても作業を止めない（管理 tick・doctor・席の hook の rc は線の越えに依らない）。 越えの知らせは doctor の行と席の追加文脈の行だけで、 入力欄への差し込み（FR1044）を使わず、 持ち主の段の行を読んで user に示すのは器の外の消費側の板（ADR-0112）"
    plain: "器は、host の設定（host の面）の「書き込みの検出線」の表に書かれた記憶装置（block 装置）ごとに、UTC の 1 日に書いた量を数え、同じ host の全 project が共有する場所（host の根）に残します。表は host の面にだけ置けます。表の形が外れた行は host の面の読みが、tracked の manifest に置いた表は manifest の読みが、それぞれ行番号付きで断ります（FR1057。後者の帰結は manifest の読みが断るときと同じ・FR1017）。数えるのは、席を周期で見回る管理 tick（FR1027）が判定を終えた後のついでで、登録のある席の tick だけです。装置は起動からの書いた量の合計を出すので、前に読んだ値との差をその日に足していきます。同じ host で tick が何本回っても、装置ごとに同じ日の内では周期に多くても 1 回だけ数え、日付が進んだ周は日を閉じます。tick の判定の行・エラー出力・終了コード・最後に周った記録は、表の有無と書き込みの記録の成否に左右されません。登録や周期の rules 行が読めないときは何も書かず、記録が無いときに装置の file が読めなくても記録を作りません。日は 3 つに分けます。全部数えられた日（measured）、再起動や長い空き、または記録を初めて開いた日で一部が欠けた日（partial。値は実際の量の下限）、1 度も測れなかった日（unmeasured。記録の値は -、doctor には unmeasured と出ます）です。欠けた日と測れない日を 0 や完全な値とは書きません。装置の file が読めない・形が違う・表の path が記録と違うときは数を動かさずに読みの結果の語だけを書き、ほかの tick が記録を進めているときと記録が読めないときは記録に触りません。線は裁定 id 付きの rules 行 4 本だけが持ちます（既定は、7 日の平均で 1 日 1500 GB・1 日で 3000 GB・平均を取る日数 7 日・持ち主の段の連続日数 3 日。GB は 10 億 byte）。閉じた日は、その日が 1 日の線を越えたか、その日で終わる平均の窓（平均を取る日数・既定 7 日）の 1 日平均（値の無い日も窓の日数に数えて割り、測った日でない日を含む平均は下限の値です）が平均の線を越えたら「越え」で、欠けた日の下限の値だけで越えても越えと数えます。昨日から続いた越えの日数（越えない日と、値の無い日で数え直します）が連続日数に届くと「持ち主の段」です（持ち主の段は閉じた日だけで数え、doctor と席の行は今日の値が 1 日の線を越えた周にも越えを示します）。装置ごとに別々に判じ、合計はしません。健康診断（doctor）は表の行ごとに 1 行を出し、今日と昨日の値・昨日で終わる平均の窓の 1 日平均・越えた線・続いた日数・持ち主の段か（owner=yes / no）を示します。記録が読めない欄は unreadable と書き、0 や決まった値で埋めません。線の rules 行が読めないときと平均を取る日数が 0 のときは no-rule と書きます（決まった値で埋めません）。表の無い host では書き込みの行を出さず、ほかの行と終了コードは表の有無と越えに左右されません。席の pane を持つ呼び出しで prompt を受けるたびに、席の仕組み（hook）は、越えた線を持つ装置（線の rules 行が読めないときと平均を取る日数が 0 のときは no-rule の装置）ごとに、持ち主の段か（owner=yes / no）を持つ 1 行を AI への添え書き（追加文脈）に足し、注入計測の記録（FR1021）に 1 行を残します。越えない周・表の無い host・host の面か記録が読めず越えの値が無い周は何も足さず、エラーも出しません。入力欄には何も送らず（FR1044 の差し込みは使いません）、session の開始には足しません。越えても作業は止めません。持ち主に見せるのは、doctor の owner=yes を読む器の外の画面（消費側の板）です（ADR-0112）。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1090]}
    goals: [GOAL1002, GOAL1003]
    figures: []
    note: "なぜ要るか: 消費は害（GOAL1002）と記憶に頼らない（GOAL1003）から来ています。host の記憶装置は書いた量で寿命が減ります。器がその量を測って示さなければ、持ち主と席は装置の数を手で読んで割り算するしかありません（GOAL1003）。器が周期で回す管理 tick のついでに装置ごとの 1 日の書き込みを残し、持ち主の決めた線と比べて doctor の行と席への 1 行で示せば、手の読みに頼らずに兆しを早く知れます（GOAL1002）。線の値・平均の窓・持ち主の段の連続日数は持ち主の裁定（2026-10-03T02:42Z）で、越えても作業を止めないのも同じ裁定です。GOAL1002 の「超えたら止まる」は 1 便の上限の話で、この線は止める上限でなく、装置の寿命の兆しを示す検出線です。測れない日と欠けた日を 0 と書かないのは、測っていないものを測ったと数えないためです（C10）。専用の timer・入力欄への差し込み・台帳への起票・外の道具で装置自身の数え（SMART）を読む案を採らない理由は ADR-0112 が持ちます。"

nonfunctional:
  - id: NFR1
    title: 面の受入 12 条
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: 面は 1280・960・700・390 の 4 つの幅で、はみ出し 0・重なり 0・横 scroll 0・hover の card と click の吹き出しの欠け 0・見出しは語彙表の語だけ・最初の画面の散文は 300 字以下・page error 0・文の予算の違反 0・全節点に id・切り替えは URL に残る・持ち主の逐語の混入 0・外部の配信元からの library 0 を満たし、測定の script が数える。横 scroll 0 は頁の横 scroll で数え、縦積みの段で pipeline の面の中だけを横に scroll させる分は数えない。
    plain: 画面の崩れや長すぎる説明は、機械が数えて 0 であることを確かめます。
    basis: [P-2, N-6]
    verify: {method: test, how: browser の runner で全画面（project board の 1 枚の画面と帯の印が開く窓と節点の頁と account board の 3 つの tab）× 4 幅 × 2 mode を描いて 12 条を数える, ac: [AC9]}
    goals: [GOAL1]
    figures: []
    rules: [R-23]
    adrs: [ADR-7, ADR-27]
  - id: NFR2
    title: 更新の遅れ
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: 器の event と台帳の変化は 5 秒以内に面へ届く。席が問いを置く合図が在れば 200 ミリ秒、無ければ周期の読み（poll）で 1.5 秒以内。面は「最終更新」（最後に読めた時刻）を出す。台帳の読みが落ちたときと変化の知らせのつながりが切れたときは、最後に読めた中身を 60 秒まで出し続け、出している中身が最後に読めた時から 15 秒を越えれば一番上の帯に読み込み不良の注意の印を 1 つ出し、60 秒を越えたら 0 件でなく「測れていない」と出す。
    plain: 台帳や器の変化は数秒で画面に出ます。読めないときやつながらないときも前の中身を 1 分まで残し、15 秒を越えたら一番上の帯に「読み込み不良」の印を出し、1 分を越えたら「0」ではなく「測れていない」と出します。
    basis: [P-4]
    verify: {method: test, how: 一時の台帳へ 1 行書いてから SSE に届くまでの時間を測り、読みを落とした偽の bd で最後に読めた字を返し続けることと応答の頭の秒を見る, ac: [AC1]}
    goals: [GOAL1]
    figures: []
    rules: [R-21]
    adrs: [ADR-7]
    note: 持ち回しの上限と注意の印の値は持ち主の裁定 t3-hub.52.38（裁定 id = t3-hub.52.38:20260928T0154Z-1）と t3-hub.52.39（裁定 id = t3-hub.52.39:20260928T0155Z-1）で決めた。前の字は、読みが落ちればすぐ（面は 2 回目の失敗で）測れていないと出した。
  - id: NFR3
    title: 依存の予算と見せる先
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: core の依存は予算の行（rules 行 R-2）で数え、面の crate の依存は別枠の予算の行（rules 行 R-25）で数え、unmaintained の例外は裁定 id つきの行で持つ。見せる先は端末の中と tailnet の中に限る。
    plain: 画面の部品の数には上限があり、公開する先は自分の端末と tailnet の中だけです。
    basis: [P-26, N-6]
    verify: {method: test, how: cargo deny と bind の宛先の歯で見る, ac: [AC9]}
    goals: [GOAL4]
    figures: []
    rules: [R-2, R-25]
    adrs: [ADR-3]
  - id: NFR4
    title: 面の server の軽さ
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: 面の server は、口の読みの外の読み（子 process）を、その読みの入力の印が前の撃ちの時と同じで上限の古さの内なら撃ち直さず、知らせの受け手が 0 人の間は台帳を読まない。project board の home の頁と同じ口を知らせの種類で読み直す客 1 つを開いて 60 秒の後の 300 秒と、客を閉じて 30 秒の後の 120 秒の、server とその子 process の計算の時間（CPU）の和の平均は、規則の行 R-34 の 2 つの値以下にする。
    plain: 画面の server は、材料が変わっていない外の道具を起こし直さず、画面を開いている人が居ない間は台帳を読みません。画面を 1 枚開いている間と、開いていない間の計算の時間（CPU）の使い方には上限があります。
    basis: [P-27, P-4]
    verify: {method: test, how: 偽の器と偽の folio と偽の bd で入力の印が動かない 2 回目の読みと受け手 0 人の間の子の数を見る歯と、席の測りの script の 2 つの区間の計算の時間（CPU）, ac: [AC1]}
    goals: [GOAL1]
    figures: []
    rules: [R-34]
    adrs: [ADR-23, ADR-26]
    note: 値は持ち主の裁定 t3-hub.52.134（裁定 id = t3-hub.52.134:20260929T2152Z-1・案 D）で決め、構造の決まりは判断の記録 ADR-23（持ち主の裁定 t3-hub.52.133・裁定 id = t3-hub.52.133:20260929T2152Z-1）に拠る。値の字と測り方は規則の行 R-34。R-34 を越えた測りへの手当て（器の doctor の出力の持ち回しの上限を 60 秒にした形〔撤退の条件 (1) で 30 秒に戻した・行 m-doctor-30〕と、器の doctor の読みを器の側で軽くする問い）は判断の記録 ADR-26。
