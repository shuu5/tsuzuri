  - id: FR1027
    title: "管理 tick"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "器は開発 session（orchestrator の席）が黙っていないかを周期で見て、 登録 row（FR1040）を持ち状態の打刻の最終行が idle で入力欄が空いている席にだけ、 台帳の現在地から続きを進めるよう促す打刻の合図（heartbeat）1 行を注入する管理 tick を持つ（ADR-0058・heartbeat を席ごとに決める口と実効の値と管理 tick の最後の周の打刻は FR1078）。 打刻の合図の末尾には alarm（閉じた語 unreflected〔FR1084 の置き場の file が id を 1 つ以上持つ周〕・floor〔FR1085 の床の検査が不合格の周〕・unsorted〔局面の出力〔FR1090〕に未仕分けの発話〔FR1088〕が 1 つ以上在る周〕・owned〔局面の出力〔FR1090〕に席の手番の閾値越えが 1 つ以上在る周〕・unreadable〔局面の出力が無いか読めない周〕・stale〔局面の出力が古さの印を持ち、 添える先の unsorted も owned も無い周〕）を足し、 局面の出力が古さの印を持つ周は unsorted と owned の語に閉じた 1 語 stale を添え（FR1094・添える stale はその数が古いことを、 単独の stale は数えるものは無いが出力が古いことを言う）、 alarm は置き場の file だけを読んで決め（台帳も git も撃たない）、 合図を送らない周の席（FR1078 の実効の値が off の席・梯子の列が尽きた席など）には alarm も届かず、 doctor の行（FR1084・FR1085・FR1088・FR1094）だけが知らせる。 送るのは席が最後の打刻から黙りの初段（rules 行 1 本・既定 30 分）以上黙り、 最後の合図から今の段の待ち（段 n の待ちは梯子の列の n 番目・列を越えた段は送らない）が経ち、 口座の門（群の逼迫〔FR1038〕の閾値の rules 行のいずれか以上の口座の席には送らず、 計測〔FR1033〕の記録の最新値だけを読んで計測は起こさず、 記録が無い・古い周は通す）を通った周だけで、 登録 row の口座が口座の墓標（FR1097）の席は、 状態の打刻と梯子の記録を読まずに進み（群の席は群の移動の判定〔鮮度の窓に 1 回まで〕を撃ち、 移った周と群の今の口座の記録が既に登録 row の口座と違う周は移動の周の退避と起こし直し〔FR1038〕へ進む）、 移らない周は入力欄の門の前で合図を送らず、 判定行の理由を heartbeat の実効の値が off の席（FR1078）なら heartbeat-off・そうでなければ account-dead とし、 条件の列と順は ADR-0058 と ADR-0098 が正本で、 梯子の列と打ち切りの段は ADR-0068 が正本。 合図の間隔は席に変化が無ければ梯子の列（rules 行 1 本が持つ空でない昇順の秒の列・既定は 30 分 → 1 時間 → 3 時間 → 6 時間 → 12 時間 → 24 時間）の順で伸ばし（backoff）、 梯子の列が尽きた段では送らず（合図は梯子の列の長さまで・既定 6 本）、 席に変化（状態の打刻の最終行の時刻 = 変化の digest が動く。 比べる基準は合図の後に席が idle へ戻った周に取る）があれば梯子の列の先頭へ戻す。 周期・黙りの初段・梯子の列は rules 行 3 本（user 裁定 id つき）が持ち、 係数と上限の行は持たない。 梯子の記録（最後に送った時刻・何本目か・変化の digest）は席の置き場の file 1 つで、 記録が読めない・書けない周は送らず理由を判定行に出す（fail-closed）。 自席の置き場が群に属する周は、 群の移動の判定（FR1038・1 本の関数）を群ごとに鮮度の窓に 1 回まで host の lock の内側で撃ち、 その周だけ計測（FR1033）を起こしてよく、 他の周は測らない（ADR-0066）。 自席の置き場が park の区画に属する周の移動の手と起こし直しの口座は FR1095 が持つ。 登録 row を持ち窓が shell に戻った席（再起動・退避の後）は、 黙りと変化の判定（打刻の最終行の状態と梯子）を経ずに口座（群なら群の今の口座・park の区画なら FR1095・どちらにも属さなければ row の口座）を決めて席の起動（FR1059）で席の起こし直しを撃つ（FR1028）。 群の今の口座が口座の墓標である群の席は、 起こす前に群の移動の判定（鮮度の窓に 1 回まで）を撃ってから群の今の口座を読み直す（起こす口座は FR1059 が決める・判定を撃たない周と移り先の無い周は墓標の口座のまま起こす・ADR-0098）。 管理 tick の周は、 局面の出力（FR1090）の部分の書き直しの契機であり、 台帳か main の印が局面の出力の入力の印と違い書き直しの下限（FR1090）を過ぎた周は全部の書き直しの契機でもある（ADR-0108）。 host の面が書き込みの検出線の表（FR1113）を持つ host では、 登録 row（FR1040）を持つ席の管理 tick の周は判定の後に表の block 装置の書き込みの記録を進める契機でもあり、 これは計測（FR1033）ではない（FR1113・ADR-0112）。 便の起動の契機は FR1068 が持つ"
    plain: "器は、開発 session（orchestrator の席）が黙っていないかを周期で見に行き、登録（FR1040）があり、状態の打刻（席の hook が残す 1 行）の最終行が「待っている（idle）」で、入力欄が空いている席にだけ、台帳の現在地から続きを進めるよう促す 1 行（打刻の合図。この合図を heartbeat と呼び、席ごとに決める口と実際に送るかどうか〔実効の値〕と tick が最後に周った記録は FR1078）を差し込みます（ADR-0058）。合図の末尾には、置き場の file だけを読んで決める目印（alarm）を付けます。目印の語は、写されていない裁定がある unreflected（FR1084）・床の検査が不合格の floor（FR1085）・未仕分けの発話がある unsorted（FR1088）・席の手番で年齢の閾値を越えた部品（要件を除く）がある owned（FR1090）・局面の出力が無いか読めない unreadable・古さの印を持つのに添える先の unsorted も owned も無い単独の stale の 6 つだけで、局面の出力が古さの印を持つ周は unsorted と owned に stale を添えます（添える stale はその数が古いことを、単独の stale は数えるものは無いが出力が古いことを言います）。合図を送らない席（FR1078 の実効の値が off の席〔park の区画の既定を含みます〕や梯子の列が尽きた席など）には目印も届かないので、doctor の行だけが知らせます。送るのは、席が最後の打刻から黙りの閾値（黙りの初段・既定 30 分）以上黙っていて、最後の合図から今の段の待ちが経ち、口座の門（かたまり〔群〕の逼迫の閾値〔FR1038・rules 行 3 本〕のどれか 1 つでも以上の口座の席には送りません。計測〔FR1033〕が残した記録の最新値を読むだけで測り直さず、記録が無い・古いときは通します）を通ったときだけです。登録の口座が再 login の要る印（口座の墓標〔FR1097〕）を持つ席は、状態の打刻と梯子の記録を読まずに進みます。かたまりの席はかたまりの移動の判定（鮮度の窓に 1 回まで）を撃ち、移ったとき（いま使う口座の記録が既に登録の口座と違うときも）は移動の退避と起こし直し（FR1038）へ進みます。移らないときは入力欄を見る前に合図を送らず、判定の行の理由は、heartbeat の実効の値が off の席（FR1078）なら heartbeat-off、それ以外は account-dead です。条件の並びと順は ADR-0058 と ADR-0098 が正本です。席に変化が無ければ次の合図までの間隔を梯子の列（rules 行が持つ待ちの列・既定は 30 分 → 1 時間 → 3 時間 → 6 時間 → 12 時間 → 24 時間）の順で伸ばし（backoff）、梯子の列が尽きたら送りません（合図は梯子の列の長さの本数・既定 6 本）。席の状態の打刻の最終行の時刻（変化の digest）が動けば、間隔は梯子の列の先頭に戻ります（比べる基準は、合図の後に席が待ちに戻ったときの値です）。周期・黙りの初段・梯子の列の 3 つは rules 行が持ちます（user 裁定 id つき）。係数（倍率）と上限の行はありません。最後に送った時刻・何本目か・比べる基準の値は席の置き場の file 1 つに残し、読めない・書けないときは送らず、理由を判定の行に出します。かたまり（群）に属する席の tick は、かたまりごとに鮮度の窓に 1 回まで、host の lockの内側でかたまりの移動の判定（FR1038）を撃ち、その周だけ計測（FR1033）を起こしてよいことにします。判定の周の外ではかたまりの逼迫を測りません（ADR-0066）。口座を占めない park の区画（Tier9）に属する席の tick の移動の手と起こし直しの口座は FR1095 が持ちます。登録（FR1040）があり、再起動や退避で窓が shell に戻った席は、黙りと変化の判定を経ずに口座（かたまりならかたまりのいま使う口座・park の区画なら FR1095・どちらにも属さなければ登録の口座）を決め、席の起動（FR1059）で起こし直します（FR1028）。いま使う口座が墓標のかたまりの席は、起こす前に移動の判定（鮮度の窓に 1 回まで）を撃ってからいま使う口座を読み直します（起こす口座は FR1059 が決めます。判定を撃たない周と移り先が無い周は、墓標の口座のまま起こします）。tick の周は、局面の出力（FR1090）の部分の書き直しの契機でもあり、台帳か main の印が局面の出力の持つ入力の印と違い、書き直しの下限（FR1090）を過ぎた周は全部の書き直しの契機にもなります（ADR-0108）。host の設定（host の面）に書き込みの検出線の表がある host では、登録のある席の tick の周は、判定の後に記憶装置の書き込みの記録を進める契機にもなります。口座の計測（FR1033）とは別です（FR1113・ADR-0112）。便を起こす契機は FR1068 が持ちます。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1018, AC1048, AC1054, AC1055, AC1058, AC1060, AC1063, AC1064, AC1090]}
    goals: [GOAL1001, GOAL1002, GOAL1003]
    figures: []
    note: "なぜ要るか: 自律安全（GOAL1001）・消費は害（GOAL1002）・記憶に頼らない（GOAL1003）から来ています。器を使う他の project では席が黙ると誰も続きを促さず止まるので、席の外から周期で見て促す機構が要ります（GOAL1001）。合図の頻度を席の変化で決め、無変化なら梯子の列の順で伸ばして列が尽きたら打ち切るのは、同じ合図で席の token を無駄に消費しないためです（GOAL1002）。列を式でなく rules 行 1 本の値で持つのは、持ち主の裁定の列が等比でなく、裁定した値は式に畳まず列のまま持つためです（ADR-0068）。変化を状態の打刻の時刻だけで測るのは、画面の文字や散文を判定に使わない（GOAL1003）ためです（ADR-0058）。tick が判定と計測を持つのは、便の無い host でもかたまりが移るためで、判定の写しは作らず 1 周と同じ 1 本を呼びます（ADR-0066）。窓が shell に戻った席を tick が起こすのは、席を立て直す手番を人に残さないためです（裁定 2026-09-25T04:13Z）。alarm の語 unsorted と owned の経緯は ADR-0087 と ADR-0088 に在ります。alarm が unreadable と単独の stale を持つのは、局面の出力が無い・読めない周と、数えるものが無くても出力が古い周を、席が合図の目印で知れるようにするためです。口座の墓標の席に合図を送らないのは、墓標の口座では席の turn が落ちるだけで続きが進まず、合図のたびに落ちる turn と計測の記録が増えるからで（GOAL1002）、かたまりの席を打刻に依らず移動の判定へ進めるのは、墓標の席の打刻は終わらないまま残り、打刻を待つと移動が遅れるからです（GOAL1001・ADR-0098）。tick が全部の書き直しの契機も持つのは、便を回さない置き場でも局面の出力が台帳と main の変化に追いつくためです（GOAL1003・ADR-0108）。tick が書き込みの記録も進めるのは、席ごとに既に回る周を使い、専用の timer を持たずに記憶装置の書き込みを日ごとに残すためです（GOAL1002・ADR-0112）。"
  - id: FR1028
    title: "cycle（廃止）"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "器は退避の後に session を作り直して復元の command を注入する cycle を持たない（ADR-0045 §2 (2) で廃止）。 orchestrator の席の再起動は、 user が席の起動（FR1059）を撃つか、 管理 tick（FR1027）が登録 row を持ち窓が shell に戻った席に席の起こし直し（FR1059・直前の会話 id を運ぶ・ADR-0067）を撃つかの 2 つで、 周期で復元の command を注入する cycle とは違い、 席が居ない窓にだけ起こす。 不在は不在を測る歯が確かめる"
