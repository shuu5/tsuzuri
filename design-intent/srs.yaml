glossary_pointer: この章は、この文書に出てくる言葉の意味をまとめた一覧です。語と定義の元は語彙の file（vocabulary.yaml）1 つに置いていて、この章は憲法と同じ形でそれを出します。

figures: []
# folio:schema:begin — 生成区間・手で直さない・正本は実装の定数（folio schema --write が書く）
schema:
  top_level:
    - meta
    - goals
    - scope
    - scope_m1
    - scope_m3
    - actors
    - outputs
    - rail
    - verdicts
    - requirements
    - nonfunctional
    - acceptance
    - not_frozen
    - constraints
    - sources
    - glossary_pointer
    - figures
    - schema
  top_level_note: 最上位の節の閉じた一覧（ほかの節は床が落とす）。schema のほかの節は人が書き、schema は生成区間
  figures:
    entry: {required: [id, type, caption, spec], optional: [refs, note]}
  figures_note: 要件書の図の節の行の欄（判断の記録と設計ノートの欄の決まりの figures.entry と同じ形）。型（type）の値域は部品目録が持つ
  requirement_row:
    required_text: [id, title, pattern, strength, when, shall, plain]
    required_list: [goals, basis, figures]
    optional: [milestone, rules, adrs, note]
    verify: {required_text: [method, how], required_list: [ac]}
  requirement_row_note: 要件の行（requirements と nonfunctional）の欄の閉じた一覧。required_text は非空の字・required_list は在ること（空の一覧でよい）・optional は任意・verify は表
  ids_anchor:
    kind: ids-anchor
    sections:
      requirements: [shall, title]
      nonfunctional: [shall, title]
      acceptance: [title]
      adr: [title]
  ids_anchor_note: id の一覧の凍結 anchor（anchors/ の下の ids-<要件書の版>.yaml）の種別の値（kind）と、節ごとに要約値を取る欄（sections・先に在る方・adr は判断の記録の題）。正本は実装の型付きの定数 crates/folio/src/ids.rs の IDS_KIND と SECTIONS で、この節はその写しである
# folio:schema:end
