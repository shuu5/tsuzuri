    note: "なぜ要るか: 記憶に頼らない（GOAL1003）と自律安全（GOAL1001）から来ています。決めたことが文書に写されないまま進むと次の設計が古い文書を正として読むので、写されていない裁定を数えて知らせ、関わる契約だけを待たせて写す手を先に促します。持ち主の裁定 2026-09-28T00:05Z・2026-09-28T00:54Z に従い、経緯と却下した案は ADR-0083 に在ります。"
  - id: FR1085
    title: "床の検査"
    pattern: event
    strength: must
    when: "vessel 宣言が任意 key floor-check（1 行の command）を持つ repo で、 dispatch の周（FR1068 の契機の周）が回ったとき"
    shall: "撃つ側では、 器は main の先端の sha の rc の結果が置き場に無い周だけ、 その sha の木で floor-check の 1 行を 1 回撃ち、 rc 0 だけを合格と読む。 行は 1 行の形の検査・禁じる語列の判定（FR1056）・shell の記号の断りを通ったものだけを、 shell を通さず argv 1 本として、 頭の語を PATH で解いて（runner の allowlist に縛られず）封じ込め（NFR1006）の内側で撃ち、 検査に当たる行は撃たずに断ってその周を撃てない周と読む。 rc の結果（rc と要約の 1 行）は sha ごとに置き場へ残して同じ sha では撃ち直さず（main が進んだ周に撃ち直す）、 撃てない周と時間の上限（rules 行 floor.timeout_s・値は user 裁定 id 付き）を越えた周は、 その周を不合格と読んで結果を sha に残さず、 次の周に撃ち直す。 待たせる側では、 その周の判定か main の先端の sha に残った結果が不合格である間、 周ごとに起動の列（FR1068）の契約のうち、 orchestrator の介入 first の印を持つ契約はどれも床の検査の理由では待たせず（main を直す便の経路。 器は印を持つ契約が直す便かを判じない・他の待ちの条件は変わらない）、 それ以外の全部の契約を閉じた理由の語（floor:<rc>・floor:unfireable・floor:timeout）で待たせ、 doctor の 1 行に結果を、 管理 tick（FR1027）の打刻の合図の alarm に語 floor を出す。 列は timer を持たないので、 main が直った後の撃ち直しは次の契機の周（first の印で起きた便の終端の周を含む）に起き、 管理 tick の alarm の floor が orchestrator の席を起こし、 席の手動の 1 周がその契機になる"
    plain: "要するに、main がこれだけは通るべきと repo が決めた最低限の検査（床の検査）に落ちている間は、orchestrator が介入の印 first を付けた便（main を直す便に付ける印です）のほかは起こさない、という決まりです。repo の宣言 file（vessel 宣言）に floor-check（最低限の検査の 1 行の command）を書いた repo で、器は送り出しの周ごとに、main のいちばん新しい commit の結果（終了コード）がまだ無ければ、その commit の中身で floor-check を 1 回撃ちます。撃つ前に、1 行の形か・禁じる語列（FR1056）に当たらないか・shell の記号を持たないかを確かめ、当たる行は撃たずに断って、その周を撃てなかった周と読みます。撃つときは shell を通さず、頭の語を PATH から探し（実装役に許した command の一覧には縛られません）、memory の上限付きの箱（封じ込め）の中で撃ちます。終了コード 0 だけを合格と読み、結果（終了コードと要約 1 行）を commit ごとに残して、同じ commit では撃ち直さず、main が進んだら撃ち直します。撃てないときと、時間の上限（規則の行 floor.timeout_s が持ち、値は user の裁定で決めます）を越えたときは、その周を不合格と読み、結果を残さずに次の周で撃ち直します。不合格の間は、first の印を付けた契約はどれもこの理由では待たせず（ほかの待ちの条件はそのままです）、それ以外の起動の列の契約を全部、理由の語（floor:<終了コード>・floor:unfireable・floor:timeout のどれか）で待たせ、doctor の 1 行に結果を出し、管理 tick の合図の末尾に目印 floor を付けます（FR1027）。器は first の印を持つ契約が main を直す便かどうかを判じないので、直す便でない契約に first を付けると、その契約も赤の main の上で起きます。列は時計を持たないので、main を直した後の撃ち直しは次の送り出しの周（first の印で起きた便が終わった周を含みます）に起きます。目印 floor が orchestrator の席を起こし、席が手で頼む 1 周がその周になります。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1055]}
    goals: [GOAL1001, GOAL1002]
    figures: []
    note: "なぜ要るか: 自律安全（GOAL1001）と消費は害（GOAL1002）から来ています。main が床の検査に落ちている間に便を起こすと、どの便も同じ赤の上に積まれて便の枠を無駄にするので、介入の印 first を持つ便だけを床の検査では待たせず（main を直す便の経路）、ほかの便は main が通るまで待たせます（GOAL 2）。直す便まで待たせると、src を直せない orchestrator の席（FR1041）には、code が原因の赤を直す道が無くなるからです。器は first を持つ便が直す便かを判じないので、直す便でない便に付けた first でも、その便は赤の main の上で起きます。これは既存の印を直す道に使う代償です。持ち主の裁定 2026-09-28T00:05Z・2026-09-28T00:54Z に従い、経緯と却下した案は ADR-0084 に在ります。"
  - id: FR1086
    title: "選択式の問いの遮断"
    pattern: unwanted
    strength: must
    when: "器の plugin を積む session が、 marker が器の NAME を言う repo（FR1019 / FR1024）で選択式の問いの道具（AskUserQuestion）を撃とうとするとき"
    shall: "器の plugin の hook の入口は AskUserQuestion を実行の前に deny し、 断る理由に問いの経路（平文の返答で問うこと・user の裁定を要る問いは台帳の問い〔FR1081〕として立てること）と、 vessel 宣言が任意 key question-route を持つ repo ではその 1 行を告げる。 deny は登録 row の有無・役割・user が自分で開いた session か・skill の文が選択式の問いを求めるか（skill を起動した直後の周を含む）に依らず、 切る rules 行も例外の印も持たない。 ほかの道具の判定はこの deny に依らない"
    plain: "要するに、器を導入した repo では、選択式の問いの窓を例外なく使わせない、という決まりです。器を導入した repo（目印 .vessel に器の名が書かれた repo）で、器の plugin を積む session が選択式の問いの道具（AskUserQuestion）を使おうとすると、器の hook の入口は実行の前に止めます。止めるときは、問いの経路（平文の返事で問うこと・持ち主の裁定が要る問いは台帳の問い〔FR1081〕として立てること）と、repo の宣言 file（vessel 宣言）が question-route を書いていればその 1 行を告げます。席として登録されているか・役割・持ち主が自分で開いた session か・skill の文が選択式の問いを求めているか（skill を起動した直後も）に依らず止め、止めるのを切る規則の行も例外の印もありません。ほかの道具（Bash や Edit など）の判定は、この遮断に左右されません。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1056]}
    goals: [GOAL1001, GOAL1003]
    figures: []
    note: "なぜ要るか: 自律安全（GOAL1001）と記憶に頼らない（GOAL1003）から来ています。選択式の問いの窓は持ち主の操作を待って席を止め、選んだ選択肢は人が打った字の記録に残らず裁定に結べないので、例外を持たずに塞ぎます。持ち主の裁定 2026-09-28T00:49Z に従い、経緯と却下した案は ADR-0084 に在ります。"
  - id: FR1087
    title: "memo の引き金と審査"
    pattern: event
    strength: must
    when: "dispatch の周（FR1068 の契機の周）が回ったとき"
    shall: "器は、 周ごとに open な memo のうち昇格の行が全部の memo を除く全部（昇格の行が一部の memo は含む・FR1091）について、 昇格条件の節の引き金の行を閉じた 5 形（再発＝notes の再発の行が値の数以上・同梱＝閉じていない契約の行の write-set が値の path を持つ・依存＝値の bead が closed・期日＝値の UTC の年月日と時分を過ぎた・着地＝値の契約表の行が着地した。 行の字面の文法は設計 doc が持つ）で判じ、 1 つでも満ちた memo を引き金の満ちた memo とする（知らせと lint が数えるのは、 引き金の満ちた memo に限らず、 局面が memo-actionable の memo の全部・FR1091）。 引き金の満ちない memo のうち、 局面が memo-actionable（FR1091）の memo を除き、 前の判定から rules 行 memo.triage_interval_h（時間・値は user 裁定 id 付き）が過ぎたものを、 起こす便が 0 の周に限り、 rules 行 memo.triage_per_round（本数・値は user 裁定 id 付き）の本数まで、 読むだけの memo の審査の lens（口座は FR1036 の便用の規則で選び、 封じ込めは NFR1006）に掛け、 判定（昇格〔promote〕/ close / keep・証拠・昇格なら設計のスケッチ）を置き場の file に、 event を 1 行残す（器は判定で memo を close せず台帳に書かない）。 周は timer を持たないので、 審査も FR1068 の契機の周にだけ回る。 pipe dispatch ls に memo の行（引き金の成否・lens の判定・年齢・前の判定の時刻）を出し、 起こす便が 0 の周の便の終端の周の通知（FR1044）で open な memo の数・処置の待ちの memo（局面の出力の memo-actionable・FR1091）の数・次の 1 本とその判定を名指し（通知の字面は dispatcher の設計 doc が持つ）、 処置（昇格〔memo に設計 pointer を書く形か、 契約を分けて昇格の行を足す形・FR1091〕・close〔close の理由の文法・FR1091〕・引き金の書き直し・keep の記帳）で memo の局面が memo-actionable を出るまで周ごとに知らせ直す。 処置の待ちの memo は台帳の lint（FR1051）が数え、 引き金の行を持たない memo の書きは FR1081 が断る"
    plain: "要するに、器が周ごとに memo（契約にする前の覚え書き）の「契約へ上げる条件」を機械で判じ、処置の待ちの memo と長く放っておかれた memo を orchestrator の席に知らせ続ける、という決まりです。器は送り出しの周ごとに、開いている memo のうち昇格の行が「全部」の memo を除くすべての「昇格条件」の節にある引き金の行を判じます。引き金の形は 5 つに決まっています。再発（同じことが起きたと notes に書いた行が決めた数以上）・同梱（閉じていない契約の行の書いてよい file の列〔write-set〕にその path がある）・依存（名指した記録が閉じた）・期日（名指した <UTC の年月日と時分> を過ぎた）・着地（名指した契約表の行が着地した）で、行の書き方は設計 doc が持ちます。1 つでも満ちた memo は「引き金の満ちた memo」になります。知らせと lint が数えるのは、引き金の満ちた memo に限らず、局面が処置の待ち（FR1091）の memo の全部です（分けた契約が開いている memo と子の問いが開いている memo は、昇格の途中と問いの返事待ちの局面が先に立ちます）。引き金が満ちない memo のうち、処置の待ち（memo-actionable）の memo を除き、前の判定から規則の行 memo.triage_interval_h の時間が過ぎたものは、起こす便が 0 の周に限り、規則の行 memo.triage_per_round の本数まで、読むだけの審査役（memo の審査の lens。口座は便用の規則〔FR1036〕で選び、memory の上限付きの箱〔封じ込め・NFR1006〕の中で撃ちます）に読ませ、判定（昇格・閉じる・保つのどれか、証拠、昇格なら設計の下書き）を置き場の file に、出来事を log に 1 行残します。器は判定で memo を閉じず、台帳にも書きません（2 つの規則の行の値は user の裁定で決めます）。送り出しの周は時計を持たないので、審査も送り出しの周（FR1068）にだけ回ります。pipe dispatch ls には memo の行（引き金の成否・審査の判定・年齢・前の判定の時刻）を出し、起こす便が 0 の周に orchestrator の席へ送る便の終端の周の通知（FR1044）で、開いている memo の数・処置の待ちの memo の数・次の 1 本とその判定を知らせ、処置（昇格〔2 つの形・FR1091〕・閉じる〔決まった理由の形・FR1091〕・引き金の書き直し・保つの記録）で memo の局面が処置の待ちを出るまで周ごとに知らせ直します。処置の待ちの memo（局面の出力の memo-actionable）の本数と、いちばん古いものの年齢は、doctor の台帳の lint の行（FR1051）が出します。引き金の行を持たない memo の書き込みは起票の門が止めます（FR1081）。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1057, AC1061]}
    goals: [GOAL1003, GOAL1002]
    figures: []
    note: "なぜ要るか: 記憶に頼らない（GOAL1003）と消費は害（GOAL1002）から来ています。memo の昇格条件を機械が判じられる引き金の行にして周ごとに判じ、満ちない memo も間隔を置いて審査役に読ませれば、処置の要る memo が埋もれずに orchestrator の席へ届き、審査は起こす便が 0 の周に本数を絞って撃つので便の枠を奪いません。持ち主の裁定 2026-09-28T07:27Z に従い、経緯と却下した案は ADR-0085 に在ります。判定の範囲と処置の待ちの数え方は、ADR-0089 が ADR-0085 の一部を置き換えます。処置の待ちの memo を審査から除くのは、処置は orchestrator の手番で、審査を撃ち直しても処置が進まないからです（ADR-0085）。"
  - id: FR1088
    title: "発話の仕分け"
    pattern: event
    strength: must
    when: "器が発話 event（FR1082）を記帳する対話の session（runner と lens を除く）でその session の turn が終わろうとするとき、 仕分けの口（発話の ts と、 要望なら開いた memo の id を受ける）か ts を名指して発話 1 件を読む口が撃たれたとき、 または doctor が回ったとき"
    shall: "器は、 発話を閉じた 3 つの仕分け（要望＝仕分けの口が名指した開いた memo〔label intake:memo〕へ発端として結ぶ・答え＝bind か裁定面の答えの口〔FR1082〕で台帳の問いへ結ぶ・会話＝台帳を変えずに仕分け済みにする〔3 クラスの承認・runner への回答・go に使った発話も会話とし、 承認 event と回答 event には結ばない〕）のどれかで仕分け済みにし、 要望と会話の仕分けは仕分けの event を 1 件記帳するだけで台帳を書かない（発端の結びの正本は仕分けの event）。 1 つの発話は複数の memo と複数の問いへ仕分けてよく、 会話は要望か答えの仕分けを持つ発話には付けずに理由を名指して断り、 会話の後に要望か答えを足した発話は会話の仕分けを外す。 仕分けの口は、 発話 event が無い・名指した memo が開いた memo でない周も何も書かずに理由を名指して断る。 仕分け済みかの判定は、 turn の終わりの判定と局面の出力（FR1090）で、 同じ入力に対して同じ結果になる。 その session の turn が終わろうとする周に、 その session の未仕分けの発話のうち turn の終わりの止めでまだ告げていないものが 1 つ以上在れば、 器は turn の終わりを 1 度だけ止め、 その session の未仕分けの発話の ts を全部並べて仕分けの口を告げ（逐語を運ばない）、 止めた周は、 登録された席の session なら状態の打刻を idle にしない。 告げ済みの未仕分けの発話だけが在る周は止めない。 turn の終わりの判定は台帳を読まず、 event log の大きさに依らない読み（NFR1005）で決め、 判定の入力を読めない周は止めずに（fail-open）読めないことを event に記帳する。 ts を名指して読む口は発話 1 件の逐語を席へ返し、 doctor の 1 行は、 未仕分けの発話の件数と最古の ts と、 要望と会話で仕分けた件数を出す"
    plain: "要するに、user の発話（人が打った字の記録）を、要望・答え・会話のどれかで仕分けさせ、仕分け忘れは席の turn の終わりで止めて告げ、残りを数える、という決まりです。器が記録した発話（FR1082）は、要望なら開いている memo へ「この発話から来た」と結び（発端）、答えなら台帳の問いへ結んで裁定にし（FR1082）、会話なら台帳を変えずに仕分け済みにします（3 クラスの承認・実装役への回答・go に使った発話も会話にし、承認や回答の記録には結びません）。要望と会話の仕分けは器が出来事の log に 1 件残すだけで、台帳は書きません。1 つの発話を複数の memo や複数の問いへ仕分けることもできます。要望か答えを持つ発話に会話は付けられず、会話の後に要望か答えを足すと会話は外れます。記録の無い時刻や、開いた memo でない記録を名指すと、何も書かずに断ります。その session（実装役と審査役の session は除きます）の turn が終わろうとするとき、その session の未仕分けの発話のうちまだ告げていないものが在れば、器は終わりを 1 度止め、未仕分けの発話の時刻を全部並べて仕分けの口を告げます（言葉そのものは運びません）。止めた周は（登録された席なら）「待っている」の打刻をせず、告げ済みの発話だけが残る周は止めません。この判定は台帳を読まず、出来事の log の大きさに依らない読み方で決め、局面の出力と同じ入力なら同じ結果になります。判定の入力を読めないときは止めずに、読めないことを記録します。席は時刻を名指して発話 1 件の言葉を読めます。doctor の行は未仕分けの件数といちばん古い時刻と、要望と会話で仕分けた件数を出します。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1058]}
    goals: [GOAL1003, GOAL1001]
    figures: []
    note: "なぜ要るか: 記憶に頼らない（GOAL1003）と自律安全（GOAL1001）から来ています。user の要望を bead にするかを席の判断に任せると、しなかったことを誰も数えず、要望が会話の中で消えます。発話を決まった 3 つの形のどれかで仕分けさせ、仕分け忘れを器が turn の終わりで止め、会話として仕分けた件数も隠さず数えれば（FR1022）、要望が黙って消えたかを後から数えて確かめられます（仕分けの正しさは器が判じません・ADR-0087）。時刻を名指して 1 件を読む口は、前の session の発話を仕分けるためにあります。user の裁定 2026-09-28T13:12Z に従い、経緯と却下した案は ADR-0087 に在ります。"
  - id: FR1089
    title: "席の問いの台帳化"
    pattern: event
    strength: must
    when: "bind か裁定面の答えの口（FR1082）が台帳の問いと発話を結ぶとき、 または doctor が回ったとき"
    shall: "結ぶ周は、 器は裁定 event に FR1082 の欄を記帳する。 asked を持たない台帳の問いの結びは、 doctor の行で asked 無しとして別に数える。 asked は閉じた 2 値で、 seat は席が user の判断を求めた問い、 user は user の先立つ指示や方針を受けるために席が起こした問いを言う。 doctor の 1 行は、 問いの起票が発話より後の結び（asked が seat なら、 席が対話の session だけで問うてから問いを起こした形）を asked の値ごとの件数と裁定 id で出す。 問いの create の asked の欠けと値の外は起票の門（FR1081 (a)）が断る"
    plain: "要するに、席が user に判断を求める問いは台帳の問いとして立て、器は問いが発話より後に起こされた結びを数える、という決まりです。台帳の問いには、問いのきっかけ（asked）を 2 つの値で持たせます。seat は席が user の判断を求めた問い、user は user が先に出した指示や方針を受けるために席が起こした問いです。問いと発話を結ぶたびに（FR1082）、器は裁定の記録に asked・問いを起こした時刻・発話の時刻・発話の経路を残し、問いが発話より後に起こされた結びを、asked の値ごとの件数と裁定 id で doctor の行に出します。asked が seat のその形は、席がチャット（対話の session）だけで問い、後から問いを起こした形です。asked が user の問いを発話の後に起こすのは、先立つ指示を受ける正しい形です。asked の無い問いの結びは、doctor の行で asked 無しとして別に数えます。asked が無いか値の外の問いの起票は、起票の門が止めます（FR1081）。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1059]}
    goals: [GOAL1003, GOAL1001]
    figures: []
    note: "なぜ要るか: 記憶に頼らない（GOAL1003）と自律安全（GOAL1001）から来ています。問いがチャットにだけ在ると、圧縮で消え、答えを待つ問いが画面にも出ません。先に台帳の問いにすれば、チャットでも裁定面でも同じ裁定の行で答えられます。チャットの文は編集ではないので編集の時点では止められず、平文の中の問いを字面で探す判定も持たずに、結ぶ周に数える検出の線にしています。user の裁定 2026-09-28T13:14Z に従い、経緯と却下した案は ADR-0087 に在ります。"
  - id: FR1090
    title: "局面の出力"
    pattern: event
    strength: must
    when: "dispatch の周（FR1068 の契機の周）が回ったとき、 器が台帳を書いた直後（bind・裁定面の答えの口・land の終端の close〔FR1050・FR1096〕・memo の自動の close〔FR1093〕）、 全部を書き直す口が撃たれたとき、 管理 tick の周、 発話 event か仕分けの event の記帳の直後、 便を運ぶ器の process が便の段を記帳した直後、 起票の門が席の道具の呼び出しの台帳の書きを通したとき、 または器の hook の入口が器の便でない merge の command を通したとき（FR1092）"
    shall: "器は、 部品（発話・台帳の問い・memo・契約・開いた契約の最新の便・契約表の行・要件・epic・器の便でない着地の commit）ごとに、 局面（閉じた語）・手番（user・seat・vessel・runner・ci・none の閉じた 6 値）・局面に入った時刻・理由（起動の列の待ちの理由・受付の断りの名・便の段と終端の語をそのまま使う）・結び（発端・子の問い・昇格した契約・便・着地の commit・仕分け済みの発話の行き先）を導いて、 state dir ごとに 1 つの局面の出力に書く。 出力は版・入力の印（台帳と event log と main の印）・古さの印を持つ。 局面の語の一覧と優先の順・局面と理由から手番への対応・misfit の理由の語の一覧の正本は設計 doc の 1 節で（memo の局面の語と順は FR1091）、 便の段の全ての値は便の部品の局面へ漏れなく写り、 どの局面にも当たらない部品と、 FR1091・FR1092 が misfit と定める部品は、 局面 misfit とその一覧の理由の語で出す。 memo の引き金が満ちたかは FR1087 と同じ判定で決める。 出力は、 要件の部品を除き、 手番が seat の部品のうち局面ごとの年齢の閾値（rules 行 lifecycle.age_h・値は user 裁定 id 付き）を越えたもの（席の手番の閾値越え）の件数と最古の 1 件を持つ。 dispatch の周・器が台帳を書いた直後・全部を書き直す口の周と、 台帳の印か main の印（sha）が出力の入力の印と違い、 前の全部の書き直しの時刻からも管理 tick の撃った記録の最新の時刻からも書き直しの下限（rules 行 lifecycle.full_min_s・値は user 裁定 id 付き）以上経った管理 tick の周は全部を書き直す。 管理 tick のこの比べは印の値の等しさだけで台帳も git も撃たず、 event log の印は比べず、 管理 tick は撃った試みごとに時刻と書き直しの返りの語を撃った記録（state dir の 1 行）に残す（書き手の lock を他の process が持つ周は待たずに返り、 返りの語 busy を残して出力を変えない）。 出力が無いか読めない周・台帳か main の印を読めない周・rules 行 lifecycle.full_min_s の無い manifest の周は、 管理 tick は全部の書き直しを撃たず、 撃った記録も古さの印も残さない（ADR-0108）。 全部の書き直しの入力は台帳の全部・event log・main の契約表の置き場（既定と、 main の先端の vessel 宣言の contract-tables が足す分・FR1047・ADR-0109）の契約表と SRS・main の commit の trailer・main の先端の vessel 宣言で、 close した部品を出力に載せる窓（rules 行 lifecycle.closed_window_h・値は user 裁定 id 付き）は表示にだけ掛け、 局面が終わりでない閉じた部品（未反映の裁定を持つ閉じた台帳の問いなど）には掛けない。 閉じと着地の commit に由来する misfit は、 切り替えの線（線を記帳していない state dir で器が最初に全部を書き直した時刻・state dir ごとに 1 度だけ記帳し、 後の書き直しは版に依らず動かさない）より後の記録だけに掛け、 線の前の記録は misfit に数えない（それ以外の misfit は線に依らない・着地の commit は、 線を記帳した全部の書き直しが読んだ main の印より後に main へ入ったものを線の後とする）。 閉じに由来する misfit は、 さらに main の先端の vessel 宣言が close-check を true で持つ repo の閉じのうち、 close-check の線（全部の書き直しが main の先端の宣言で close-check を初めて true と読んだ時刻・state dir ごとに 1 度だけ記帳し、 後の書き直しは動かさない・切り替えの線より前にはならない）より後の閉じだけに掛け、 main の先端の宣言が close-check を true で持たない周はその repo の閉じを数えず、 先端の宣言が在って読めない周は入力を読めない周と同じに扱う。 全部を書き直さない管理 tick の周と発話 event か仕分けの event の記帳の直後と便を運ぶ器の process が便の段を記帳した直後は、 台帳も git も撃たずに、 event log の大きさに依らない読みで、 event log と時刻で決まる部分（発話・仕分けで結んだ発端・便の局面・年齢と席の手番の閾値越え・前の全部の書き直しが残した期日の引き金の満ち）だけを書き直す。 起票の門が席の道具の呼び出しの台帳の書きを通したときと、 器の hook の入口が器の便でない merge の command を通したときは、 書き直さずに出力に古さの印（付けた時点の入力の印を持つ）を付け、 印を付けた後に始まり、 印の種類に対応する入力の印（起票の門の印は台帳の印・merge の印は main の印）が印の持つ値より新しい全部の書き直しだけが印を消す（部分の書き直しは消さない・書きが落ちた周の印は次にその入力が動くまで残る）。 今の出力より古い入力の書きは残らず、 入力を読めない周は書き直さずに出力に古さの印を付けて理由を記帳し、 その印は入力の印を持たず、 読み手はこの印が在る間は出力を古いと示し、 印の後に始まり全部の入力を読めた全部の書き直しが印を消す。 古さの印の種類は閉じた 3 つ（起票の門・merge の門・読めない周）で、 出力は種類ごとに印を 1 つまで持ち、 同じ種類の後の印が前の印を置き換える。 発話の部品は ts・session・行き先だけを持ち、 逐語を持たない。 器は全部を書き直す口を持つ"
    plain: "要するに、部品（発話・台帳の問い・memo・契約・開いた契約の最新の便・契約表の行・要件・epic・便でない着地の commit）がそれぞれ一生のどこにいて、次に誰が動く番かを器が導き、state dir に 1 つの出力として書く、という決まりです。器は部品ごとに、局面（決まった語の一覧から 1 つ）・手番（user・seat・vessel・runner・ci・none の 6 つ）・その局面に入った時刻・理由（起動の列の待ちの理由・受付の断りの名・便の段の語をそのまま使う）・結び（発端・子の問い・昇格した契約・便・着地の commit・仕分けた発話の行き先）を導き、版の欄を持つ出力に書きます。局面の語の一覧・手番への対応・misfit の理由の一覧は設計 doc が持ち、memo の局面は FR1091 が持ちます。送り出しの周・器が台帳を書いた直後・全部を書き直す口を撃ったときと、台帳か main の印が出力の持つ入力の印と違い、前の全部の書き直しからも、管理 tick の撃った記録の最新の時刻からも書き直しの下限（規則の行 lifecycle.full_min_s の秒数）以上経った管理 tick の周は全部を書き直します（この印の比べそのものは台帳も git も撃たず、出来事の log の印は比べません。比べで全部の書き直しへ進んだ周は、書き直しが台帳と main を読みます。tick は撃った試みごとに、時刻と結果の語を撃った記録（state dir の 1 行）に残し、書き手の lock を他の process が持つときは待たずに busy を残します。出力が無いか読めない周・印を読めない周・規則の行が無い周は撃たず、記録も古さの印も残しません）。全部を書き直すときは、台帳の全部・出来事の log・main の契約表の置き場（既定の docs/design/ の直下の markdown と、main の先端の設定 file〔vessel 宣言〕が足す分）の契約表と SRS・main の commit の trailer・main の先端の設定 file を使い、close した部品を出す窓は表示にだけ掛けます。全部を書き直さない管理 tick の周と、発話や仕分けの記録の直後と、便を運ぶ器の process が便の段を記録した直後は、台帳も git も撃たずに、出来事の log と時刻で決まる部分だけを、log の大きさに依らない読み方で書き直します。出力は版と入力の印と古さの印を持ち、席の手番のまま局面ごとの年齢の閾値を越えた部品（要件を除く）の件数といちばん古い 1 件も持ちます。席の道具の呼び出しが起票の門を通って台帳を書くとき（子 process の書きには印が付きません）と、便でない merge を門が通したときは、書き直さずに、その時点の入力の印を持つ古さの印を出力に付け、印の後に始まり、印を付けた門が守る入力（台帳か main）がそれより新しい全部の書き直しだけが印を消します。便の段の値はすべて便の部品の局面へ写り、memo の引き金が満ちたかは FR1087 と同じ判定で決めます。古い入力からの書きは残らず、入力を読めない周は書き直さずに古さの印を付けて理由を残し、その印は、印の後に始まり全部の入力を読めた全部の書き直しが消します。古さの印は起票の門・merge の門・読めない周の 3 種類で、種類ごとに 1 つまでとし、同じ種類の後の印が前の印を置き換えます。close した部品を出す窓は、局面が終わりでない部品（未反映の裁定を持つ閉じた問いなど）には掛けません。閉じと着地の commit から来る misfit は、線をまだ記帳していない state dir で器が初めて全部を書き直した時（切り替えの線）より後の記録だけに掛けます（着地の commit は日時でなく、線を記帳した全部の書き直しが読んだ main の印より後に main へ入ったものを線の後と数えます）。線は state dir ごとに 1 度だけ記帳し、後の書き直しは版に依らず動かしません。ほかの misfit は線に依りません。閉じから来る misfit は、さらに main の先端の設定 file が close-check を true で持つ repo の閉じのうち、全部の書き直しが先端の設定 file で close-check を初めて true と読んだ時刻（close-check の線。state dir ごとに 1 度だけ記帳し、後の書き直しは動かさず、切り替えの線より前にはなりません）より後の閉じだけに掛け、持たない repo の閉じは数えません（先端の設定 file が在って読めないときは、入力を読めない周と同じに扱います）。発話の部品は言葉を持ちません。どの局面にも当たらない部品と、FR1091・FR1092 が定める部品は、misfit と理由の語で出します。読むだけでない bd の読み（--readonly の無い読み）も台帳の印を進めるので、起票の門が印を付けた後、門が通した書きが入る前にそういう読みが走ると、その後の全部の書き直しが印を消し、書きが入る前の出力が古さの印を持たないまま残ることがあります。次の全部の書き直しで追いつきます。出力を読む側の決まりは FR1094 が持ちます。"
