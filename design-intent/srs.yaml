  - id: FR1047
    title: "契約の正本"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "契約は契約表の置き場（tracked・ADR-0109）の契約表の 1 行（少なくとも要件 id・実装する設計の節・write-set・検証を持ち、 done の項目ごとの歯を名指す任意の欄と、 code の事実を数で名乗る任意の欄〔要素は列・項目・値の組で、 列は閉じた 7 語・項目は touches と同じ path の形・値は件数か可視性の字〕と、 行の根拠の条・規範文・規則行・判断の記録の id を並べる任意の欄 basis〔器は読んで運ぶだけで照らさず、 生成する契約 file に写さない〕を持てる）だけから取る。 契約表の置き場は既定で設計 doc の dir（docs/design/）の直下の markdown で、 vessel 宣言の任意 key contract-tables が dir（直下の拡張子が .md か .toml の file）か file を足し（置き換えない）、 宣言を読めない周は既定の置き場に倒さない（読み手ごとの倒れ方は ADR-0109）"
    plain: "契約の正本は、契約表の置き場（契約表を置いてよい tracked な file の一覧）にある契約表の 1 行だけです。行は少なくとも要件 id・実装する設計の節・write-set・検証を持ち、done の項目ごとの歯を名指す任意の欄と、code の事実を数で名乗る任意の欄と、行の根拠（条・規則・判断の記録の id）を並べる任意の欄 basis を持てます。code の事実の欄の要素は、列・項目・値の組です（列は閉じた 7 語、項目は touches と同じ path の形、値は件数か公開範囲の字）。契約表の置き場は、既定では docs/design/ のすぐ下の markdown で、設定 file（vessel 宣言）の contract-tables に書いた dir（すぐ下の .md と .toml）か file が足されます（置き換えません）。宣言を読めないときは既定の置き場に倒しません（読み手ごとに、止めるか広く見る側に倒れます・ADR-0109）。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1021, AC1077, AC1083, AC1087, AC1088]}
    goals: [GOAL1004, GOAL1003]
    figures: []
    note: "なぜ要るか: 契約は小さく（GOAL1004）と記憶に頼らない（GOAL1003）から来ています。契約が設計 doc の散文・台帳の受入条件・契約 file の 3 段の写しになっていると、写しの各段で write-set の落ちや設計の混入が起き、正本がどれか分からなくなるからです。契約表の置き場を repo が名乗れるのは、契約表を toml に置く repo でも正本が 1 つの決まりで読めるためです（ADR-0109）。"
  - id: FR1048
    title: "write-set の閉包"
    pattern: unwanted
    strength: must
    when: "intake に出された契約の行が閉じた型（variant を得る列挙・rules 行・完了の値・event の種類）を変えると宣言し、 base でその型を構造として持つ source file の集合（vessel 宣言が code の索引を名乗り base の索引が在る周は、 索引が別名・自分の型の短縮の構築・一括の取り込みを解いて名指す構築と match の場所の file を加えた集合）を write-set が含まないとき（導出が source を読めない周を含む）"
    shall: "器は足りない file（読めない周はその source）を名指す typed な理由で契約を断り、 便を作らない（索引を作り中の周と作れない周の扱いは FR1107）"
    plain: "契約の行が閉じた型（enum の variant・rules 行・完了の値・event の種類）を変える（足す・消す・改名する）と宣言したら、器はその型を構造として持つ file を base から数え上げ、write-set に足りない file を名指して断ります。読めない周も通しません。vessel 宣言が code の索引を名乗り、base の索引があるときは、索引が別名・自分の型の短縮の組み立て・一括の取り込みを解いて名指す、組み立てと match の場所の file も数えます。索引を作っている間と作れないときの扱いは FR1107 が決めます。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1021, AC1073, AC1082]}
    goals: [GOAL1004, GOAL1003]
    figures: []
    note: "なぜ要るか: 契約は小さく（GOAL1004）と記憶に頼らない（GOAL1003）から来ています。閉じた型に variant を足すと触る面は構造で決まるのに、それを人の記憶で write-set に写すと落ちが出るからです。閉包が code の索引の分を含むのは、字の走査は別名や一括の取り込みの越しの組み立てを見ず、その file の不足は実装役の編集が止められて初めて見えるからです（ADR-0105）。"
  - id: FR1049
    title: "契約の審査"
    pattern: event
    strength: must
    when: "便が intake を通ったとき（契約表の行から契約 file が生成された直後）"
    shall: "器はその直後に、 契約とそれが実装する設計と要件を lens に読ませて verdict を採り、 その verdict を契約の中身（sha）付きで、 lens に渡した設計の節の本文の写しとともに便の記録に残し、 PASS でない便は runner を起こさず Reviewed の段で FAIL として終端する。 lens を撃つ周は、 器が材料を組む前に対象 repo の HEAD の commit を読み、 その commit を便の記録の dir の直下（材料の dir の外）に detach した審査の木を lens の cwd にして lens を読みの道具（FR1005）で起こし、 判定の後に木を worktree の登録ごと外し、 木の commit id を審査の記録に残す（同じ path に前の周の木が在る周はそれを先に外し、 木を作れない周は lens を撃たずに INCONCLUSIVE として理由に審査の木を名指し、 anchor の作業木へ倒さない）。 ただし、 実物の base で組んだ判定の鍵（FR1100）が、 basis が actual で判定が PASS の行の審査の記録と同じ周は、 lens を撃たず審査の木も作らずにその判定を写し、 写したことを段の記録に残す（判定の鍵に lens の cmd の字は入れない）。 契約の中身の同一性は、 契約の字と、 便の記録に残る設計の節の本文の写しの両方で判定し（写しを持たない便は契約の字だけで判定する）、 同じ中身で審査 FAIL の便が在る契約が列に入らないことは FR1068 が定める"
    plain: "便が受付（intake）を通り、契約表の行から契約の file が作られた直後に、器が審査役へ契約とそれが実装する設計と要件を読ませて判定を採ります。審査役は、材料を組む前に読んだ対象 repo の HEAD の commit を便の記録の場所の直下（材料の dir の外）に切り離した作業木（審査の木）で、読みの道具を持って起き、判定の後に木を worktree の登録ごと外し、木の commit id を記録に残します（前の回の木が同じ場所にあれば先に外し、木を作れないときは審査役を撃たず、main の作業木で代わりに撃つこともせずに「判定できなかった」とし、理由に審査の木を名指します）。ただし、実物の出発点で組んだ判定の鍵（FR1100）が、行の審査の実物（actual）の合格の記録と同じときは、審査役を撃たず木も作らずにその判定を写し、写したことを記録に残します（鍵に審査役の command の字は入れません）。判定は契約の中身（sha）付きで、審査役に渡した設計の節の本文の写しといっしょに便の記録に残し、合格でない便は実装役を起こさず Reviewed の段で FAIL として終わります。契約の中身が同じかどうかは、契約の字と、便の記録に残した設計の節の本文の写しの両方で決めます（写しを持たない便は契約の字だけで決めます）。同じ中身で審査 FAIL の便が在る契約が列に入らないことは FR1068 が決めています。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1022, AC1068, AC1073, AC1081]}
    goals: [GOAL1002, GOAL1001]
    figures: []
    note: "なぜ要るか: 消費は害（GOAL1002）と自律安全（GOAL1001）から来ています。契約側の穴を実装後の gate で初めて見つけると、実装役と審査役の消費を丸ごと捨てて再受付になるからです。実装前に席が手で審査役を回す運用は散文の規則になり、器の段でなければなりません。審査の木を審査役の作業場所にするのは、main の作業木を起点にすると書ける設定の穴で main が書き換えられうるうえ、材料に無い事実（呼び手・組み立ての場所・既存の歯）を確かめる木が要るからです（ADR-0102）。行の審査の合格を写すのは同じ審査を 2 度撃たないためで、予想の審査を写さないのは、祖先の実物が材料に無かった審査を本番の代わりにしないためです（ADR-0103）。"
  - id: FR1050
    title: "land の終端"
    pattern: event
    strength: must
    when: "便が main に着地して Landed に達したとき（PR で着地した便を除く・その close は FR1096）"
    shall: "vessel 宣言が任意 key remote（押す先）を持つ repo では、 器は着地した main をその remote へ push する前に、 remote の先端から main までの出ていく字面を公開の字面の走査（FR1080 と同じ判定と publish の種類の rules 行・読む上限と締め切りは公開の segment と同じ値〔NFR1005〕・公開先の repo は key remote が名指す remote）に掛ける。 当たる周（識別子に当たる周と読む上限を越える周）は push も close もせず（main の commit は remote へ出ない）、 その push で出る便の全部を Failed と記帳して終端させ（FR1068 の着地済みの扱いから外し、 契約は release の印で起き直る）、 main が remote の先端に揃うまで以後の着地を止めて理由を出す（main を remote の先端に揃えるのは着地した commit を捨てる操作で、 3 クラス〔消す〕の承認として user に求める・FR1016）。 判定できない周（rules 行が無い周・解けない周・締め切りを越えた周・host の面を読めない周〔FR1057〕）は push も close もせずに、 その push で出る便の全部に失敗を記帳し、 次の Landed の周の push の前に同じ範囲を撃ち直す（通った周は、 先に失敗を記帳した便も close する）。 rules 行の enabled が false の周は走査しない。 push の後は push の先端（最後に着地した commit）の CI の結果を commit id で照合し、 台帳の便を着地の形の close の理由（FR1091・着地 commit id を持ち、 理由の尾に CI の結果を持つ・尾の字面は ADR-0094）で close し（land の終端が台帳へ書くのは、 この close と、 remote を持たない repo の close と、 PR で着地した便の close〔FR1096〕と、 memo の自動の close〔FR1093〕だけで、 3 つの close の経路は ADR-0094 が持つ）、 終端の各手を typed な event として記帳する。 候補の木に並べた順に着地し push の先端でない便は、 自分の着地 commit を含む push の先端の commit の CI の結果で照合し、 理由の尾に先端の commit id も持つ。 CI の結果が success でなければ close せず失敗を記帳する。 vessel 宣言が任意 key remote を持たない repo の便は、 走査も push も CI の照合も撃たずに（出さない）、 台帳の便を着地の形の close の理由（着地 commit id を持ち、 理由の尾に CI の照合なしを持つ）で close する（vessel 宣言を読めない周は remote を持たないと読まず、 close せずに失敗を記帳する。 撃ち直しは器が自動では撃たず、 その便の終端だけを撃ち直す器の口〔pipe land --terminal-only・撃ち手の権能は FR1041〕が、 撃った時点の宣言で本 FR の経路を選び直す）。"
    plain: "この決まりは main に着地した便のもので、PR で着地した便は除きます（その close は FR1096）。vessel 宣言に押す先（任意 key remote）がある repo では、着地した main を push する前に、器は remote の先端から main までの出ていく文字を公開の字面の走査（FR1080 と同じ判定と規則の行・出す先は押す先〔key remote〕が名指す remote）で調べます。読む上限と締め切りは公開の segment と同じです（NFR1005）。当たるか読む上限を越えたら push も close もせず、その push で出る便の全部を「失敗」で終わらせ（着地済みの扱い〔FR1068〕から外し、契約は起き直しの印で起き直ります）、main が remote の先端に揃うまで次の着地を止めて理由を出します（main を remote の先端に揃えるのは着地した commit を捨てる操作なので、3 クラス〔消す〕の承認として人に求めます）。調べきれない（規則の行が無い・解けない・締め切りを越えた・host の面を読めない〔FR1057〕）なら push も close もせずに失敗を記録し、次の着地の push の前に同じ範囲を撃ち直します（通ったら、先に失敗を記録した便も close します）。規則の行を off にしたときは調べません。push したら、push の先端（最後に着地した commit）の CI の結果を commit id で確かめ、台帳の便を着地の形の理由（着地した commit の番号を持ち、末尾に CI の結果を持ちます・FR1091・ADR-0094）で close します。land の終端が台帳へ書くのは、この close と、押す先の無い repo の close と、PR で着地した便の close（FR1096）と、条件を満たした memo の自動の close（昇格済みの形・FR1093）だけで、3 つの close の道は ADR-0094 が持ちます。候補の木に並べた順に着地した便のうち先端でない便は、自分の commit を含む先端の commit の CI の結果で確かめ、理由の末尾に先端の commit id も書きます。終端の各手は typed な event として記録します。CI が緑でなければ close せず失敗を記録します。vessel 宣言に押す先（任意 key remote）が無い repo の便は、外へ出さないので、走査も push も CI の確かめもせずに、着地の形の理由（着地した commit の番号と、末尾に「CI の確かめなし」）で close します（宣言が読めないときは押す先が無いとは読まず、close せずに失敗を記録します。撃ち直しは器が自動ではせず、その便の終端だけを撃ち直す器の口〔pipe land --terminal-only・撃ち手の権能は FR1041〕を撃つと、撃った時点の宣言で経路を選び直します）。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1015, AC1023, AC1061, AC1065, AC1089]}
    goals: [GOAL1001, GOAL1003]
    figures: []
    note: "なぜ要るか: 自律安全（GOAL1001）と記憶に頼らない（GOAL1003）から来ています。push・CI の照合・台帳の close が席の手順のままだと、「着地したのに close されていない」「close したが CI が赤」のずれを目視に頼ることになるからです。候補の木に並べた順に着地した便のうち push の先端でない便には CI の run が無く、先端の CI で確かめなければ手で close するしかありません（GOAL1001）。着地の push も実装役の書いた commit を remote へ出す経路なので、手の push と同じ走査を掛けます（持ち主の裁定 2026-09-27T22:21Z）。close の理由の頭の形と memo の自動の close の経緯は ADR-0089 に在ります。押す先の無い repo の便を器が閉じるのは、起票の門の close の断り（FR1081 (d)）が掛かる repo では着地の形を書けるのが land の終端だけなので、器が閉じなければその契約を着地として閉じる手段が無くなるためで、3 つの close の道の理由は ADR-0094 に在ります（持ち主の裁定 2026-09-29T05:46Z）。撃ち直しの口の名指しの形が席の権能〔settle〕に在る理由は FR1041 と ADR-0097 に在ります（持ち主の裁定 2026-09-29T21:53Z）。"
  - id: FR1051
