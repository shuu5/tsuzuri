    pattern: unwanted
    strength: must
    when: "席の起動（FR1059）で、 置き場が群に属さず口座の引数も無い周に、 session 用の口座選定（FR1036）が閾値未満の口座の候補を 1 つも返さないとき"
    shall: "器は席を起こさず、 登録 row を書かず key を 1 つも送らず、 理由の語 no-account と、 候補が無い理由の閉じた 4 語（閾値以上の over-threshold・上限に当たった all-limited・測れない unmeasured・FR1036 の session 用の除外集合に当たる excluded。 複数が当たる周はこの順で前の 1 語）を 1 行で告げて断る。 閾値以上でも上限に当たっていない口座や他の役割の口座との同居で席を起こす妥協の起動（ADR-0041 の 2 段）は持たない（群の移動も妥協しない・FR1038・ADR-0049）"
    plain: "要するに、口座に余裕が無ければ席を無理に起こさず、理由を 1 語で告げて断る、という決まりです。かたまり（群）に属さない置き場で、口座を指定せずに席を起こすとき、session 用の口座選定が閾値より余裕のある口座を 1 つも見つけられなければ、器は席を起こしません。席の登録も書かず、key も 1 つも送らず、理由の語 no-account と、候補が無い理由を決まった 4 つの語（閾値以上の over-threshold・上限に当たった all-limited・測れない unmeasured・口座選定の除外〔FR1036〕に当たる excluded。いくつも当たるときはこの順で前の 1 つ）で 1 行に告げて断ります。閾値以上でもまだ上限に当たっていない口座や、ほかの役割の席の口座に同居させて、無理に席を起こすこと（妥協の起動）はしません。かたまりの移動も同じく妥協しません（FR1038）。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1040, AC1063]}
    goals: [GOAL1001, GOAL1003]
    figures: []
    note: "なぜ要るか: 自律安全（GOAL1001）と記憶に頼らない（GOAL1003）から来ています。余裕の無い口座で席を立てても上限ですぐに止まるだけなので、起こさずに理由の語で断れば、候補が無い理由が 1 語で残り、人が口座を足すか、口座を指定して起こし直すかを決められます。口座の指定と群の今の口座は選定を通らないので、この断りに当たりません（FR1059）。理由の語で断る形は持ち主の裁定 2026-09-28T09:04Z に従い、ADR-0041 の妥協の起動を置き換える経緯と却下した案は ADR-0086 に在ります。"
