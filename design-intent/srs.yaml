  - id: FR1013
    title: "stop"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "stop --all は live な runner を止め、 rc を 0（全部止まった / 対象なし）・1（残った）・2（state が読めない）の 3 値で返す冪等な 1 コマンドである。 便 1 本を名指す stop は終端でないその便だけを止めて Stopped を記帳し、 止め切れない周は記帳せず rc 1、 既に終端の便は記帳を増やさず rc 1、 verdict を読めない Gated の便は終端かどうかを決められないので止めずに rc 2 で断る。 停止の権能は rules 行 role.orchestrator が持ち（FR1041）、 行が与えるのは便 1 本を名指す形だけで stop --all は与えない"
    plain: "stop --all は、動いている実装役をすべて止める 1 つのコマンドです。何度撃っても同じ結果になり、結果は 0（全部止まった、または止める対象なし）・1（止められないものが残った）・2（記録が読めない）の 3 値で返します。便 1 本を名指して止める形もあり、まだ終わっていないその便だけを止めて「止めた」と記録します。止め切れなかったときは記録せず 1 を、もう終わっている便には記録を増やさず 1 を返します。gate の結果（verdict）を読めない Gated の便は、もう終わっているかを決められないので、止めずに 2 を返して断ります。停止の権能は manifest の行 role.orchestrator が持ち（FR1041）、行が許すのは便 1 本を名指す形だけで、stop --all は許しません。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1004, AC1015]}
    goals: [GOAL1001]
    figures: []
    note: "なぜ要るか: 自律安全のニーズ（GOAL1001）から来ています。無人で動くものは、いつでも 1 コマンドで止められる必要があります。"
