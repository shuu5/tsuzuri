    note: "なぜ要るか: 記憶に頼らない（GOAL1003）と自律安全（GOAL1001）から来ています。「今どこか」を器・消費側・席がそれぞれ自分で計算すると食い違い、どこにも出ない死角が生まれます。判定を器の 1 か所に集めて 1 つの出力に書けば、器の整理と見せ方が作りの上で 1 対 1 になり、席の手番で止まった部品は打刻の合図の目印と直近の流れの事実行で席へ届きます（合図を止めた席には doctor の行が知らせます）。user の裁定 2026-09-28T13:14Z に従い、経緯と却下した案は ADR-0088 に在ります。閉じの misfit を close-check を true で持つ repo に限る理由は FR1091 に在ります（数えの境は ADR-0097 が SRS に委ねる点）。管理 tick が、台帳か main の印が出力の入力の印と違う周に全部を書き直すのは、便を回さない置き場でも出力が台帳と main に追いつくためで、印の比べで台帳も git も撃たず、前の全部の書き直しと撃った試みの記録から書き直しの下限を空けるのは、重い書き直しや落ちる書き直しを続けて撃たないためです（ADR-0108・下限の値は user の裁定 2026-10-01T15:27Z）。契約表の置き場を vessel 宣言が足す分まで読むのは、契約表を docs/design の外に置く repo でも出力が契約表の行を読めるためです（ADR-0109）。"
  - id: FR1091
    title: "memo の局面と処置"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "器は、 開いた memo を閉じた 4 つの局面のどれかに置く（宣言順に memo-promoting＝discovered-from で辿れる開いた契約が在るか、 FR1093 の close の条件を満たして close を待つ・memo-asking＝子の開いた台帳の問いが在る・memo-actionable＝処置の待ち〔引き金が満ちて keep の記帳（FR1087）の無いか、 処置の無い昇格か close の審査の判定〔FR1087〕が在るか、 昇格の行を持ち、 辿れる開いた契約が無く、 FR1093 の close の条件を満たさない〔辿れる契約が 0 本を含む〕〕・memo-waiting＝読める引き金が在って満ちない〔keep の判定を持つ memo と、 満ちた引き金に keep の記帳が付いた memo を含む〕）。 読める引き金の行を 1 つも持たず memo-promoting にも memo-asking にも当たらない memo（memo-actionable より先に判じる）と、 どの局面にも当たらない memo は、 局面の出力（FR1090）で misfit とする。 昇格は 2 形（memo の bead に設計 pointer を書いて契約にする形・memo を残して契約を分け、 notes に閉じた文法の昇格の行〔全部か一部と契約 id の列・全部の行はその memo から分けた契約の全部を並べる〕を足し、 分けた契約から discovered-from を張る形）とし、 昇格の行が複数在る memo は最後の行で判じる。 close の理由の文法は種類ごとの閉じた形の和（字面の正本は ADR-0089、 着地の形の理由の尾は ADR-0094）とし、 契約は着地・重複・後継・取り下げの形、 台帳の問いと decision の型の bead は裁定の形、 memo は昇格済み・まとめた・見送りの形、 epic は完了と取り下げの形を持つ。 和の外の理由の close と、 land の終端の外の着地の形の close の断りは FR1081 (d) が持ち、 bead の種類と理由の形の食い違いの閉じ・理由の裁定 id か bead id が解けない（裁定 id は FR1083 と同じ解け方）閉じ・理由の裁定 id が自分の notes の裁定の行にも裁定 event にも無い台帳の問いの閉じ・見送りの理由の裁定 id が memo の子の台帳の問いの裁定でない閉じ・まとめ先が開いた memo でない「まとめた」の閉じ・閉じた時点の台帳で FR1093 の close の条件（処置の無い判定の条件を除く）を満たさないか、 理由の契約 id の列が最後の昇格の行の列と違う昇格済みの閉じは、 局面の出力（FR1090）が misfit で数える（閉じの misfit を数える repo と境は FR1090）"
    plain: "要するに、開いた memo は決まった 4 つの局面のどれかにいて、close の理由の決まった形（文法）を定める、という決まりです。開いた memo の局面は、優先の順に、昇格の途中（分けた契約が開いている。自動の close の条件〔FR1093〕を満たして閉じるのを待つ memo も含む）・問いの返事待ち（子の台帳の問いが開いている）・処置の待ち（引き金が満ちて保つの記録が無い・処置の無い昇格か close の審査の判定が在る・昇格の行を持つが開いている分けた契約が無く、自動の close の条件を満たさない〔分けた契約が 0 本のときも〕）・引き金待ち（読める引き金が在って満ちない。保つの判定の memo と、満ちた引き金に保つの記録が付いた memo も含む）です。読める引き金が無く、昇格の途中でも問いの返事待ちでもない memo（処置の待ちより先に判じます）と、どれにも当たらない memo は misfit です。昇格には 2 つの形があります。memo にそのまま設計 pointer を書いて契約にする形と、memo を残して契約を分け、memo の notes に「全部」か「一部」と契約の番号を書いた昇格の行を足し、分けた契約から discovered-from の線を張る形です。「全部」の行は、その memo から分けた契約を全部並べます。昇格の行が複数あれば最後の行で判じます。close の理由の決まった形は記録の種類ごとに在り、memo なら昇格済み・まとめた（まとめ先の memo の番号）・見送り（user の裁定 id）の 3 つ、契約なら着地の形と、重複・後継・取り下げの形、台帳の問いと decision の型の記録なら裁定の形、epic なら完了と取り下げの形です。形の外の理由で閉じる席の書き込みと、席が着地の形で閉じる書き込みは起票の門が止め（FR1081・設定 file〔vessel 宣言〕が close-check を true で持つ repo と、設定 file が在って読めない repo だけ）、種類と形の食い違いや解けない番号、裁定の記録に無い裁定 id で閉じた問い、子の問いの裁定でない見送りの閉じ、まとめ先が開いた memo でない「まとめた」の閉じ、閉じた時点で自動の close の条件（FR1093・処置の無い判定の条件を除く）を満たさないか番号の列が最後の昇格の行と違う昇格済みの閉じは、局面の出力が misfit で数えます。閉じを数えるのは close-check を true で持つ repo の、全部の書き直しが main の先端の設定 file で close-check を初めて true と読んだ時刻（close-check の線）より後の閉じだけで、持たない repo の閉じは数えません（FR1090）。門は台帳の repo の HEAD の設定 file で、数えは main の先端の設定 file と close-check の線で決まります（FR1081・FR1090）。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1061, AC1057, AC1065]}
    goals: [GOAL1003, GOAL1002]
    figures: []
    note: "なぜ要るか: 記憶に頼らない（GOAL1003）と消費は害（GOAL1002）から来ています。memo の状態と閉じ方が決まっていないと、開いた memo が膨らみ、要望が席の判断で黙って落ちます。見送りに user の裁定を要し、一部だけ昇格した memo を残りの候補ごと閉じない形にすれば、要望の取りこぼしを数えて見せられます（その場で昇格した契約を取り下げる閉じは数えの外に残ります）。開いた memo を名のある局面と閉じ方に限る形は user の裁定 2026-09-28T13:14Z に、close の理由の文法を全部の種類へ広げる形は常設の指示 2026-09-28T00:54Z の下の決定に従い、経緯と却下した案は ADR-0089 に在ります。閉じの misfit を close-check を true で持つ repo の、close-check が true になった後の閉じに限るのは、自由な字で閉じる運用の repo が在り、その閉じのうち形に似た字（種類と形の食い違いや解けない番号）を数えると misfit の欄が意味を失うためで、境を repo ごとに持てば、後から close-check を持つ repo の前の閉じも数えずに済みます。数えの境は ADR-0097 が SRS に委ねる点で、門の射程は持ち主の裁定 2026-09-29T21:53Z と ADR-0097 に在ります。"
  - id: FR1092
    title: "器の便でない着地の発端"
    pattern: unwanted
    strength: must
    when: "席の道具の呼び出しが PR を main へ入れる merge の command（help を出すだけの command を除く・FR1101 と同じ読み）を撃とうとし、 その command が発端の trailer（値に台帳の bead の id を空白で区切って 1 本以上並べる commit の本文の行・名は ADR-0088）か器の便の trailer を持つ commit の本文を渡さないとき、 または main の先端に入った器の便でない commit が発端の trailer を持たないとき"
    shall: "器の hook の入口は merge の command を実行の前に deny して欠けを名指し、 CI の main の検査は発端の trailer の無い器の便でない commit を名指して非 0 で止める。 trailer の判定はどちらも本文の形だけを確かめ（CI は台帳に届かない）、 台帳に無い発端（並べた id の 1 本でも台帳に無いもの）は局面の出力（FR1090）が器の便でない着地の commit の部品の misfit で数える。 器の便の trailer が名指す便が event log に無い commit と、 切り替えの線より後の、 発端の trailer も器の便の trailer も持たない器の便でない commit も、 器の便でない着地の commit の部品として misfit で数える（どれも切り替えの線より後の commit だけ・FR1090）。 ただし、 切り替えの線より後の main の commit のうち発端の trailer を持つものが、 本文の追認の札（名は NAME から導き本 repo では Scribe2-Adopts・値は 40 字の sha と台帳の bead の id を空白で区切って 1 本以上）で、 発端の trailer も器の便の trailer も持たない commit を名指すときは、 札の id をその commit の発端として同じ判じに掛ける（台帳に無い id は misfit・照らしから外す commit は無い）"
    plain: "要するに、器の便を通らずに main へ入る変更（設計・ADR・要件の文書の変更など）にも、どの台帳の記録（memo・問い・契約など）のための変更かを示す発端の trailer（commit の本文の行・記録の番号を空白で区切って 1 つ以上並べる）を必ず付ける、という決まりです。席が PR を main へ入れる merge の command（help を出すだけの command は除きます）を撃つとき、その command が発端の trailer か器の便の trailer を持つ本文を渡さなければ、器の hook が実行の前に止めて欠けを告げます。CI の main の検査も、trailer の無い便でない commit を名指して止めます。trailer の判定はどちらも本文の形だけを見て、台帳に無い番号と、event log に無い便を名指す器の便の trailer と、切り替えの線より後の trailer の無い便でない commit は、局面の出力が misfit で数えます。札を付け忘れた古い commit には、後の commit の本文の追認の札（Scribe2-Adopts）で発端を結べ、結んだ番号も台帳で照らします。row-review の key を true で持つ repo では、同じ merge の門が 2 つ目の判定として行の審査の結果も見ます（FR1101）。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1062, AC1074]}
    goals: [GOAL1003, GOAL1001]
    figures: []
    note: "なぜ要るか: 記憶に頼らない（GOAL1003）と自律安全（GOAL1001）から来ています。設計や要件の変更が台帳のどの記録のためかを持たないと、案件の設計の局面が見えず、どの要望が文書まで届いたかを追えません。merge の時点で trailer を求めれば、編集の時点で止める形になります（器の憲法 C16）。この形は、死角を残さないという user の方向の裁定 2026-09-28T12:46Z と、段の全部を出力に入れる問い 3 の裁定 2026-09-28T13:14Z から導いたもので、trailer と merge の門そのものは個別の問いを経ていません（常設の指示 2026-09-28T00:54Z の下の決定）。経緯と却下した案は ADR-0088 に在ります。行の審査の判定（FR1101）を同じ門の 2 つ目の判定に置くのは、merge の command を読む入口を 1 つに保つためです（ADR-0103）。"
  - id: FR1093
    title: "memo の自動の close"
    pattern: event
    strength: must
    when: "land の終端（FR1050・FR1096）が契約を close したとき、 または dispatch の周（FR1068 の契機の周）が回ったとき"
    shall: "器は、 close の条件（最後の昇格の行が全部で、 その行の契約 id の列と discovered-from で辿れる契約の列が一致して 1 本以上在り、 その全部が着地の形〔FR1091〕で閉じ、 子の開いた台帳の問いと処置の無い昇格か close の審査の判定を持たない）を満たす開いた memo を、 昇格済みの形（契約 id の列を持つ・FR1091）の close の理由で close し、 満たさない memo は close しない（局面は FR1091）。 台帳を読めない周は close せず、 次の契機の周に判じ直す"
    plain: "要するに、分けた契約が全部着地した memo は、器が自分で閉じる、という決まりです。land の終端（FR1050・FR1096）と送り出しの周に、器は、最後の昇格の行が「全部」で、その行の契約の番号の列と discovered-from の線で辿れる契約の列が一致して 1 本以上在り、全部が着地の形で閉じ、子の開いた問いも処置の無い昇格か close の審査の判定も持たない開いた memo を、昇格済みの形（契約の番号の列を持つ）の理由で閉じます。条件を満たさない memo は閉じず、局面は FR1091 のとおりです。台帳を読めない周は閉じず、次の周に判じ直します。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1061, AC1065]}
    goals: [GOAL1003, GOAL1002]
    figures: []
    note: "なぜ要るか: 記憶に頼らない（GOAL1003）と消費は害（GOAL1002）から来ています。分けた契約が全部着地した memo を席の手で閉じる形にすると、閉じ忘れた memo が開いたまま積もり、開いた memo の数が要望の残りを表さなくなります。条件が機械で決まる閉じは器が行い、条件に届かない memo は処置の待ちに残して席へ知らせます。memo を名のある閉じ方に限る形は user の裁定 2026-09-28T13:14Z に、自動の close の契機と条件は常設の指示 2026-09-28T00:54Z の下の決定に従い、経緯と却下した案は ADR-0089 に、PR で着地した便の close も契機に数える理由は ADR-0094 に在ります。"
  - id: FR1094
    title: "局面の出力の読み手"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "器の次の読み手（便の終端の周の通知〔FR1044〕が便の段に添える 1 語〔局面の出力の便の部品の理由の語〕・doctor の未仕分けの発話の行〔FR1088〕と処置の待ちの memo の行〔FR1051〕と席の手番の閾値越えの行・管理 tick の alarm の語 unsorted・owned・unreadable・単独の stale〔FR1027〕・直近の流れの事実行〔FR1042〕・memo の判定の通知の処置の待ちの memo の数〔FR1087〕）は、 局面の出力（FR1090）と同じ判定の結果を使って自前の判定を持たず、 書きかけの出力を見ず、 出力が持つ入力の印と古さの印を自分が読める今の印と比べて古さを判じ（読み手ごとに比べる印の組は設計 doc の 1 節が持つ）、 古い出力を古いと示し、 出力が無いか読めない周は読めないことを示す。 doctor の席の手番の閾値越えの行は、 出力が持つその件数と最古の 1 件を出す。 器は局面の出力と同じ中身を text で出す口を持つ"
    plain: "要するに、局面の出力を読むものは自分で判定し直さず、出力が古いときは古いと示す、という決まりです。便の終端の通知が便の段に添える 1 語（便の部品の理由の語）・doctor の行（未仕分けの発話・処置の待ちの memo・席の手番の閾値越え）・管理 tick の目印 unsorted・owned・unreadable・単独の stale・直近の流れの事実行・memo の判定の通知の処置の待ちの数は、局面の出力（FR1090）と同じ判定の結果を使い、自前の判定を持ちません。読み手は書きかけの出力を見ず、出力が持つ入力の印と古さの印を自分が読める今の印と比べて古さを判じ（どの印を比べるかは読み手ごとに設計 doc が持ちます）、古いときは古いと示し、出力が無いか読めないときは読めないことを示します。doctor の閾値越えの行は、出力が持つ件数といちばん古い 1 件を出します。器は同じ中身を text で出す口も持ちます。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1060]}
