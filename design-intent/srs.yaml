  - id: FR1064
    title: "管理 tick の駆動"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "器は管理 tick（FR1027）の unit（systemd user の service と timer の対）を登録 row（FR1040）を持つ席ごとに導出して host の駆動機構へ置き有効化する口と、 退役 dir への移動で撤去する口を持つ。 unit の本文は NAME・target・置き場・binary・周期の rules 行と、 台帳 client（bd）の絶対 path（席の起動では host の面の宣言、 unit を入れる口と撤去の口では flag で渡したもの・どちらも無い導出の unit は台帳 client を名指さず、 その bytes は PATH の台帳 client の有無に依らない）から器が 1 関数で導出し（器自身は env・home・PATH を探して台帳 client を解かない〔素の名の解決は子 process の PATH に任せる〕・C2.2・ADR-0108）、 repo には入れず、 器の作った印の無い file は上書きも移動もせず、 有効化と撤去は 3 クラスに当たらない（ADR-0030 §2.1〜§2.5 の形・ADR-0058）。 doctor は flag の組（unit dir・binary・台帳 client）か host の面の組のどちらか 1 つを丸ごと使い（欄ごとに混ぜない）、 席ごとに unit の有無と一致を 1 行で言う。 台帳 client を持たない unit の tick は既定の素の名で台帳 client を撃ち、 撃てない周の全部の書き直しは入力を読めない周（FR1090）になる"
    plain: "器は、管理 tick（FR1027）を周期で撃つ tick の unit（systemd user の service と timer の対）を、登録（FR1040）のある席ごとに組んで host の駆動機構に置いて有効にする口と、退役の場所へ移して撤去する口を持ちます。unit の本文は器が名前・target・置き場・binary・周期の rules 行と、台帳 client（bd）の絶対 path（host の面に書いたものか、unit を入れる口の flag で渡したもの）から 1 つの関数で組みます。どちらも無いときは unit に台帳 client を載せず、PATH に台帳 client が在っても本文は変わりません（器は env・home・PATH を探して台帳 client を見つけることはしません）。unit は repo には入れず、器が作ったのでない file は上書きも移動もせず、有効にすることと撤去は 3 クラス（人に聞く操作）に当たりません（形は ADR-0030 と同じ・ADR-0058）。健康診断（doctor）は、flag で渡した組か host の面の組のどちらか 1 つを丸ごと使って、席ごとに unit の有無と一致を 1 行で言います。台帳 client を載せない unit の tick は既定の名で台帳 client を撃ち、撃てないときの全部の書き直しは入力を読めない周（FR1090）になります。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1018, AC1060]}
    goals: [GOAL1001, GOAL1003]
    figures: []
    note: "なぜ要るか: 自律安全（GOAL1001）と記憶に頼らない（GOAL1003）から来ています。黙った席は自分を起こせず、便の周に相乗りすると便が流れない project では動かないので、host の timer が管理 tick を周期で撃ちます。本文を器が組んで置くのは、決めた形（ADR-0030）をそのまま使え、host ごとの値を引数だけで受けて env を読まずに済むためです（ADR-0058）。台帳 client の path を unit に載せるのは、systemd user の timer の PATH は台帳 client を含むとは限らず、含まない host では tick の全部の書き直し（FR1090）が台帳を読めないためで、path を探さずに宣言か flag から受けるのは、host ごとの値を env で解かないためです（C2.2・ADR-0108）。"
