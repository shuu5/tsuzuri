    plain: "口座の設定を読む session（人と話す席と、口座の設定 dir を指定して起こした session。器を積まない素の session でも同じで、既定の設定 dir だけを読む起動は含みません）や実装役（runner）が撃つ Bash の command が、規則 file の行が持つ「禁じる語列」（撃ってはいけない語の並び。口座の設定から呼ばれる見張りが読むのは有効な行だけ）に当たるときは、器が実行の前に止め、どの rules 行のどの並びに当たったかを告げます。口座の設定を読む session には口座の設定から呼ばれる見張り（host-guard）が掛かり、器の plugin を積む席と実装役には器の plugin の command guard（禁じる語列の見張り）も掛かり、審査役（lens）には掛かりません。渡された中身が読めないときも見張りは止めます。契約と repo の宣言 file（vessel 宣言）の検証行も受付の時点で同じ判定に掛け、当たる行は行番号付きで断って便を作りません。禁じる語列に当たらない command はこの規則では止めません。ただし「pgrep -f」と「pkill -f」の行（自分に当たる待ちと止め）だけは、探す型が撃った shell 自身の command 行にも当たる形（待ちが終わらない・自分の shell を止める形）か、型の字が変数などで決まらない形のときだけ止め、1 字を角括弧で囲んだ型などは止めません。止めたときは「相手の pid を kill -0 で待つか、型の 1 字を [] で囲む」と次の手を告げます。この行は契約の検証行の受付の判定には掛けません。"
