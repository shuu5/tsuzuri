  - id: FR1041
    title: "権能の所在"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "役割ごとの権能は rules manifest の行 role.orchestrator（裁定 id 付き）が持ち、 承認の記帳と上限の許可の記帳と取り消し（FR1110）は rules 行 R-C7-1 が名指す orchestrator の席の権能〔approve〕とし、 便の起動・着地・merge は行に無く器の dispatcher だけが行い（FR1068）、 止まった終端を閉じる器の 2 つの口（便の終端だけの撃ち直し〔pipe land --terminal-only・FR1050〕と worktree を畳む口〔pipe retire・FR1096〕）は、 便 1 本を名指す形（畳むだけの指定〔--fold-only〕を 1 つ足した pipe retire を含み、 置き場と repo は席のものに限り規則を差し替えない）だけを行 role.orchestrator の権能〔settle〕で席が撃て、 それ以外の形は撃ち直しが権能〔merge〕・pipe retire が権能〔launch〕の手に残り（名指しの pipe retire が畳める便の列は ADR-0048・ADR-0097）、 席の src の編集は行に無く、 落ちる歯の編集（tests/ の path 種別）だけを行が与える"
    plain: "どの役割が何をしてよいかは manifest の行 role.orchestrator が持ちます（裁定 id 付き）。承認の記帳と、上限の許可の記帳と取り消し（FR1110）は、rules 行 R-C7-1（対話面の identity）が名指す orchestrator の席の権能〔approve〕です。便を起こす・着地させる・merge するのは行に無く、器の dispatcher だけが行います（FR1068）。ただし、止まった便の終わりを閉じる器の 2 つの口（終わりだけの撃ち直し〔pipe land --terminal-only・FR1050〕と、便の作業場所〔worktree〕を畳む口〔pipe retire・FR1096〕）は、便 1 本を名指す書き方（畳むだけの指定〔--fold-only〕を 1 つ足した pipe retire を含み、置き場と repo は席のものに限り、規則は差し替えない）に限って、行 role.orchestrator の権能〔settle〕で席が撃てます。それ以外の書き方は、撃ち直しが権能〔merge〕、pipe retire が権能〔launch〕の手に残ります。名指しの pipe retire が畳める便の列は ADR-0048 と ADR-0097 が持ちます。席の本体 code（src）の編集も行に無く、落ちる test（tests/）の編集だけを行が許します。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1015, AC1084]}
    goals: [GOAL1003, GOAL1001]
    figures: []
    note: "なぜ要るか: 記憶に頼らない（GOAL1003）と自律安全（GOAL1001）から来ています。権能を rules 行に置けば、執行（FR1045）も指示文（FR1042）も同じ行を読めます（器の憲法 C1・C14・N2）。止まった便の終わりを閉じる 2 つの口の名指しの形が権能〔settle〕に在るのは、起票の門の close の断り（FR1081 (d)）が掛かる repo では席が契約を着地の形で閉じられず、settle が無ければ止まった終端を閉じられるのが持ち主だけになるためです（持ち主の裁定 2026-09-29T21:53Z）。名指しの形に限るのは着地・起動・merge を席に戻さないためで、畳むだけの指定を名指しの形に含めるのは照合できない PR の便の出口として ADR-0097 が足した設計です。名指しの形と却下した案は ADR-0097 に在ります。上限の許可の口を承認と同じ権能に数えるのは、新しい権能の名を足さず、行 role.orchestrator を変えないためです（ADR-0106）。"
