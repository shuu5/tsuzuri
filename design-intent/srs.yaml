  - id: FR1068
    title: "便の自動起動"
    pattern: event
    strength: must
    when: "便が終端の段（Landed / Failed / Stopped）に達したとき、 便を運ぶ器の process が退役したとき、 手動の 1 周が要求されたとき、 介入の印が記録された直後、 または回答 event（FR1032）か approval.received（FR1016）が記帳された直後"
    shall: "器の dispatcher は起動の列（台帳の open な契約のうち、 依存が閉じ ∧ 設計 pointer が解決し ∧ memo でなく ∧ 台帳の問い（label intake:question・FR1081）でなく ∧ 同じ契約の中身で終端に達した便（審査（FR1049）FAIL の便を含む）が無い契約の並び）を orchestrator の介入 first → 契約の priority → 起票順で評価し（起動の列の外の契約もこの順序の上の位置を持つ・FR1102）、 終端でない段の便と write-set が交差せず（FR1039 と同じ判定）∧ 受付（write-set の余地・host の memory の枠・同時走行の最大値〔rules 行 pipe.max_live・値は user 裁定 id 付き〕・契約表の行の閉包と code の索引と code の事実の判定〔FR1048・FR1107・FR1109〕など）を通る契約を、 席の操作なしに条件を満たす本数だけ起こし（本数の絞りは受付の host の memory の枠と同時走行の最大値が行い、 受付が最大値で断った契約は列に留めて理由を持つ）、 起動の列の周に受付が契約を断ったときは、 断った契約ごとに断りの名と bead を event 1 件に記帳し（局面の出力〔FR1090〕の入力）、 起動は通常の便の起動の段（受付 → 審査（FR1049）→ runner の起動）をそのまま通り起動の前に待機の段を持たず、 契機が重なっても同じ契約を二重に起こさず、 同じ周で起こした便の write-set を次の候補の交差の相手に数え、 起こせない契約はまだ出ていない理由（依存 / 交差（Overlap）/ 受付 / 同時走行の最大値 / 終端に達した便（審査 FAIL を含む）/ hold / 未反映の裁定（unreflected-ruling・FR1084）/ 床の検査の不合格（floor・FR1085）/ 行の予約の待ち（reserved・FR1102）/ 兄弟の待ち（sibling・FR1103））を閉じた型で持って列に留め（未反映の裁定で待つのはその裁定 id を acceptance か notes で引く契約とその問いに blocks される契約だけで、 床の検査の不合格の間は介入 first の印を持つ契約（main を直す便に付ける印。 器は直す便かを判じない）のほかの全部の契約が待つ）、 hold の契約は起こさず release で戻し、 終端に達した便が起動の列から外した契約も release の印 1 つにつき 1 回だけ起動の列へ戻し（着地済みの便の契約は戻さず、 審査 FAIL の便の契約は中身が変わるまで戻さない・FR1049）、 介入を起動の列の記録として残し、 便を運ぶ器の process が退役した便は同じ周で器が再開（FR1037）を 1 回起こし（便を運ぶ器の process が残す所有者の印を持たない、 終端でない段の便は起こし直さない）、 所有者の印を持たなくても再開（FR1014）を 1 回起こす便は次の 5 種に閉じ＝回答が記帳された Questioned の便（FR1032 の回答を添える）・承認が記帳された Blocked の便（FR1016 の承認を添える）・verdict が PASS の Gated の便（gate が再び要求されて〔FR1008〕PASS が記録された便を含む）・regate（FR1077）で Gated から Implemented へ戻され、 その後 gate を通っていない便（所有者の印が無いか印の process が退役した便。 印の process が退役した便の再開は本種目の再開（FR1014）の 1 回に寄せ、 退役の節の再開（FR1037・Implemented の便には当たらない）と同じ周で重なっても同じ便を二重には起こさない。 regate の記帳も追随の記帳も持たない Implemented の便は起こし直さない）・追随で最新の gate の後に Implemented へ戻され、 その後 gate を通っていない便（所有者の印が無いか印の process が退役した便。 regate の種目と同じ周に重なっても同じ便を二重には起こさず、 退役の節の再開〔FR1037〕は Implemented の便に当たらないので重ならない・5 種目）、 verdict が PASS でない Gated の便と verdict を読めない Gated の便は起こさず、 verdict が PASS の Gated の便と regate で戻された便と追随で戻された便は専用の契機を持たず、 5 種とも上の契機の周で拾い、 便を運ぶ器の process が生きている便と生死を読めない便には触らず、 周期の timer を持たず、 台帳が読めない周は 1 本も起こさず測れなかったことを記帳する"
    plain: "要するに、器の dispatcher が、条件のそろった契約を席の手を借りずに起こし、起こせない契約には待ちの理由を付けて列に残す、という決まりです。便を起こすのは器の dispatcher です。便が終わったとき（着地・失敗・停止）、便を運ぶ器の process が退役したとき、手動で 1 周を頼まれたとき、介入の印を記録した直後、回答 event（FR1032）か approval.received（FR1016）を記帳した直後に、台帳の open な契約のうち依存が終わり・設計 pointer が解け・memo でも台帳の問い〔FR1081〕でもなく・同じ中身で終端に達した便（審査 FAIL の便を含む）が無い契約の並び（起動の列）を、orchestrator の介入 first → 契約の優先度（priority） → 起票順の順に見て、まだ終わっていない便と触る file が重ならず・受付（契約を便にする前の検査の段。触る file の余地・host の memory の枠・同時走行の最大値・契約表の行の閉包と code の索引と code の事実の判定〔FR1048・FR1107・FR1109〕など）を通る契約を、席の操作なしに条件を満たす本数だけ起こします。起動の列の外の契約も、この順の上の位置を持ちます（行の予約の待ちに使います・FR1102）。起こし方はふつうの便の起動（受付 → 審査 → 実装役の起動）をそのまま通る形で、起動の前に待つ段はありません。契機が重なっても同じ契約を二重には起こしません。同時に走らせる本数には最大値が 1 つあり（同時走行の最大値。値は規則の表の 1 行が持ち、user の裁定で決めます）、受付がまだ終わっていない便を数えて最大値に達している周は起こさず、その契約は理由を付けて列に残します。本数を絞るのは受付の host の memory の枠とこの最大値です。起動の列の周に受付が契約を断ったときは、断った契約ごとに断りの名と契約の番号を出来事の log に 1 件残し、局面の出力（FR1090）の理由に使います。同じ周で起こした便の file は次の候補の重なりに数え、起こせない契約は「まだ出ていない理由」（依存・重なり〔Overlap〕・受付・同時走行の最大値・終端に達した便〔審査 FAIL を含む〕・hold・未反映の裁定〔unreflected-ruling・FR1084〕・床の検査の不合格〔floor・FR1085〕・行の予約の待ち〔reserved・FR1102〕・兄弟の待ち〔sibling・FR1103〕）を決まった型で持って列に残し、hold の契約は起こさず release で戻します。待ちの理由のうち未反映の裁定と床の検査の不合格は、待たせる範囲が違います。未反映の裁定で待たせるのはその裁定を受入条件か notes で引く契約と、その問いに blocks される契約だけですが、床の検査の不合格の間は、介入の印 first を持つ契約のほかは、列の契約を全部待たせます（first は main を直す便に付ける印ですが、器は直す便かを判じないので、first を持つ契約はどれもこの理由では待たず、直す便でなくても赤の main の上で起きます）。終端に達した便が起動の列から外した契約も、release の印 1 つにつき 1 回だけ起動の列へ戻します（着地済みの便の契約は戻さず、審査 FAIL の便の契約は中身が変わるまで戻しません・FR1049）。介入は起動の列の記録に残します。便を運ぶ器の process が退役した便は、同じ周で器が再開（FR1037）を 1 回起こします（便を運ぶ器の process が残す所有者の印を持たない、まだ終わっていない便は起こし直しません）。所有者の印を持たなくても再開（FR1014）を 1 回起こす便は、次の 5 種だけです: 回答が記帳された質問中（Questioned）の便（FR1032 の回答を添えます）、承認が記帳された承認待ち（Blocked）の便（FR1016 の承認を添えます）、gate の結果（verdict）が合格（PASS）の Gated の便（gate がもう一度頼まれて PASS が記録された便を含みます・FR1008）、regate（FR1077。gate の結果が不合格（FAIL）の便を裁定の言葉つきで Implemented〔実装が済んで gate を待つ段〕へ 1 段戻す器の口）で Gated から Implemented へ戻され、その後 gate を通っていない便（所有者の印が無いか、印の process が退役した便。印の process が退役した便の再開はこの 4 種目の再開（FR1014）の 1 回に寄せ、退役した便の再開（FR1037）と同じ周で重なっても、同じ便を二重には起こしません。regate の記帳も追随の記帳も持たない Implemented の便は起こし直しません）、追随（main に追いつくこと）でいちばん新しい gate の後に Implemented へ戻され、その後 gate を通っていない便（所有者の印が無いか、印の process が退役した便。regate の種目と同じ周に重なっても同じ便を二重には起こさず、退役した便の再開〔FR1037〕は Implemented の便には当たらないので重なりません）。gate の結果が合格でない Gated の便と、gate の結果を読めない Gated の便は起こしません。gate の結果が合格の Gated の便と regate で戻された便と追随で戻された便は専用の契機を持たず、5 種とも上に挙げた契機の周で拾います。便を運ぶ器の process が生きている便と生死を読めない便には触りません。周期の timer は持ちません。台帳が読めないときは 1 本も起こさず「測れなかった」と記録します。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1022, AC1038, AC1054, AC1055, AC1051, AC1060, AC1075, AC1076]}
    goals: [GOAL1001, GOAL1003]
    figures: []
    note: "なぜ要るか: 人の手が入らなくても安全に進む（GOAL1001）と記憶に頼らない（GOAL1003）から来ています。便の起動が席の中継に乗っていると、着地から次の起動までの待ちと優先便の後回しが席の手番で起き、「同時に何本」のような規則が散文に残ります（最大値を持つなら規則の表の 1 行に置きます）。起動に要る判定（依存・重なり・受付・審査）は器がすべて持っているので、判定と起動を器の同じ関数に置けば、待ちは重なり・受付・同時走行の最大値と、終端に達した便が起動の列から外したこと（release の印 1 つにつき 1 回だけ戻す）で決まり、回答と承認の記帳も同じ周の契機になり、介入も記録に残るからです。regate で戻された便を専用の契機を足さずに同じ周で拾うのは、regate を撃つのが人の席で、その席が手動の 1 周も撃てるからです（裁定の記帳と再開の契機を分けても、契機が 1 つ増えるだけで拾う便は変わりません）。周期の timer を持たず便の終端を契機にする決定は ADR-0045 に、経緯と却下した案は ADR-0034 に、同時走行の最大値を 1 つだけ持つ決定は ADR-0035 に在ります。追随で戻された便に専用の契機を足さないのは、追随を撃つ着地の列の周と便の終端の周がすでに契機で、その周に所有者の印を失った便を拾えるからです（ADR-0068）。受付の断りを event に記帳する経緯は ADR-0088 に在ります。落ちた行の順番を守る行の予約と兄弟の待ちの決定は ADR-0103 に在ります。"
  - id: FR1069
