    plain: "repo root に目印（.vessel）が無いか、別の名前が書いてある repo では、hook の入口は何も出さず正常終了（rc 0）で黙り、その repo に 1 byte も書きません。黙るのはこの入口だけで、口座の設定から呼ばれる見張り（host-guard）は目印の有無や repo の位置に関わらず判定します。"
