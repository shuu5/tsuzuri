  - id: FR1059
    title: "席の起動"
    pattern: event
    strength: must
    when: "器の口から席の起動が要求されたとき、 または群の移動（FR1038）か管理 tick（FR1027）が席の起こし直しを要求したとき"
    shall: "器は席の役割（orchestrator）を必須で受け、 口座を、 置き場が群に属する周は群の今の口座（用語・書き換えは FR1038 の移動だけが行う・ADR-0049）に決め（引数が在って群の今の口座と違う周は typed に断る）、 それ以外の周は引数か session 用の口座選定（FR1036・park の区画の置き場の席の候補は FR1095・閾値未満の候補が無い周は FR1069）で決め、 起動行を手書きの起動の雛形を読まずに導出し（起動行の構成は決定記録が正本）、 席の起こし直しの周（群の移動と管理 tick の起こし・FR1038 / FR1027）はその席の状態の打刻の最終行の会話 id を起動行で運んで会話の続きから再開し（会話 id の形でない周は運ばない・対話の記録の file は複写しない・運び方は ADR-0067 が正本）、 席の登録（FR1040）を起動の前に書き、 target の窓の shell へ起動行を差し込み、 窓が無ければ作り tmux の session は作らず、 tmux の session が無い・入力欄に文字が在る・FR1069 が断る周・口座が退役中・引数の口座が群の今の口座と違うのいずれかでは typed に断り key を 1 つも送らない"
    plain: "器の subcommand で席を起こすとき（かたまりの移動（FR1038）や管理 tick（FR1027）が席を起こし直すときも同じ）は、席の役割（orchestrator）を必ず指定します。口座は、置き場がかたまり（群）に属するときはそのかたまりのいま使う口座（書き換えるのはかたまりの移動（FR1038）だけです・ADR-0049）にします（このとき指定した口座がそれと違えば断ります）。かたまりに属さないときは、指定した口座か session 用の口座選定で決めます（park の区画の席の候補は FR1095）（閾値未満の候補が無いときは席を起こさずに断ります・FR1069）。起動行は器が組み（何を含めるかは決定記録が正本）、手書きの雛形は読みません。席を起こし直すときは、その席の状態の打刻に残った会話 id を起動行で渡して会話の続きから再開します（会話 id の形でなければ渡しません・対話の記録の file の複写はしません・渡し方は ADR-0067 が正本）。席の登録を先に書き、窓の shell へ起動行を差し込みます。窓が無ければ作りますが、tmux の session は作りません。tmux の session が無い・入力欄に文字がある・閾値未満の候補が無い（FR1069）とき・口座が退役中・指定した口座がそのかたまりのいま使う口座と違うときは断り、key を 1 つも送りません。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1013, AC1029, AC1040, AC1041, AC1063]}
    goals: [GOAL1001, GOAL1003]
    figures: []
    note: "なぜ要るか: 人の手が入らなくても安全に進む（GOAL1001）から来ています。席の起動が別 repo の wrapper と前の器の launcher に乗っていると、器の視野の外の script に依存し、起動行の手書きが host 固有の値を散らします。器が導出して登録を先に書けば、記憶に頼らず（GOAL1003）に席を立てられるからです。口座をかたまり（群）のいま使う口座から先に決める決定は ADR-0049 に在ります（群の宣言も同じ決定）。"
