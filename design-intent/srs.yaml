goals:
  - {id: GOAL1, title: 面で決められる, text: 持ち主が席の問いに面で答え、まとめて承認し、全体の方針を書ける。答えは台帳に逐語で残り、席は面越しに起きる。}
  - {id: GOAL2, title: 全体像を見落とさない, text: 台帳と設計文書と走行と着地の commit と code（file・関数と型・歯）が 1 つの図に結ばれ、持ち主にも席にも実装と審査の AI にも「何が何につながるか」が見える。図は便の着地ごとに器が code から下へ積み上げる。宙に浮いた裁定や孤児の bead と、結びの無い定義は機械が数える。}
  - {id: GOAL3, title: 口座と席の健康が 1 面で分かる, text: 複数の project と複数の口座の残量・移り先・席の応答を 1 つの面で見て、次の一手が 1 つ大きく出る。}
  - {id: GOAL4, title: 席が持ち主の端末で見せる, text: 席が持ち主の端末の browser を起こし、面を開き、操作して見せる。持ち主は道具を起動しない。}
  - {id: GOAL5, title: ほかの project でも最初から十全に動く, text: Rust・TypeScript・Python のどの project でも、最初の日から器の便と図への結びと code の検索（名・呼び手・参照・全文）が十全に動く。席が記憶に書いて避けている失敗のうち、ほかの project でも起きる物は、器の構造（hook の断り・門・既定値・雛形・lint）が起こさせない。}
  - {id: GOAL1001, title: "自律安全", text: "人の手が入らなくても AI が自律的に開発を安全に進められる（目的関数の 1 位・K1〜K3）（器の上位の必要の 1 番・器の要件書の出所の欄 = 目的関数 §0-1）"}
  - {id: GOAL1002, title: "消費は害", text: "無駄な消費は害。 1 便の見積と上限を持ち、 超えたら人手を介さず止まる（器の上位の必要の 2 番・器の要件書の出所の欄 = 器の憲法 C6・恒久直命）"}
  - {id: GOAL1003, title: "記憶に頼らない", text: "規則の値は manifest に、 現在地は永続面に。 席の記憶や散文を判定入力にしない（器の上位の必要の 3 番・器の要件書の出所の欄 = 器の憲法 C1 / C3 / C15）"}
  - {id: GOAL1004, title: "契約は小さく", text: "契約が書き切れること。 QA の周回を繰り返さず、 検証は base で RED になる test で表す（器の上位の必要の 4 番・器の要件書の出所の欄 = 裁定 2026-09-09（MVP 切り直し））"}
  - {id: GOAL1005, title: "自己開発", text: "前の版（v1）を使わず、 design-intent を拘束条件として自分で自分を作る（器の上位の必要の 5 番・器の要件書の出所の欄 = ADR-0003（v1 完全放棄））"}

scope:
  build:
    - project board（上の固定の帯と窓・問いと裁定・pipeline の板・台帳 open の一覧と指標・個別の頁と近傍・orchestrator と口座）
    - account board（HOME・session・各 project の tab）
    - 導出グラフ（設計文書と設計ノートと台帳と走行を 1 つに結ぶ・不変条件の検査・近傍の材料）
    - 面の server（台帳の読み・裁定の記帳・SSE・承認の event）と契約の型の crate
    - 席の hook（裁定の注入・問いの起票の門・停止の hook）
    - 表示面（席が端末の Chrome を起こして操作する）
    - tz の口（folio の口の吸収・graph・init・doctor）
    - 指し示し（持ち主が画像と囲みと一言を席へ渡す）
    - 相談の窓 consult（席の文脈から分けた自由な調べと検証の場・作業場と囲い・型付きの所見）
  not_build:
    - 承認欄の自動記入と「決まったこと」の板（v1.1）
    - 時間軸の眺め（14 日の着地・便の回数）（v2）
    - 撤退条件の結線・天井の整合の観点・「仮に変えたら」（v2）
    - 端末側の常駐の agent（ADR-5 決定 (4)）
    - ssh の届かない端末へ画面を配信し入力を返す窓（v2 の候補・判断の記録 ADR-15 決定 (5)・持ち主の裁定 t3-hub.59.4）
    - 同じ workspace で型を直に渡す境界（ADR-4 決定 (2)・合流の後の別の判断）
    - account board の時点のつまみ（過去の時点に戻して見る）と関係の頁（持ち主の裁定 t3-hub.53.10 で作らないと決めた）
    - project board の地図の頁（圧縮・一覧・グラフ・表・設計の木・台帳の木）と口座の履歴と口座の「詳しく」と台帳の「詳しく」（持ち主の裁定 t3-hub.52.160.1 で消した・判断の記録 ADR-27 決定 (2)・1 つの bead のつながりは個別の頁に残す）

actors:
  - {id: owner, name: 持ち主（非エンジニア）, role: 面で答える・決める・方針を書く}
  - {id: orchestrator, name: 席（orchestrator と相談の窓 consult）, role: 問いを置き処分を宣言する・相談の所見を出す}
  - {id: vessel, name: 器（今は scribe2・合流後は tz）, role: 便を運び席を起こし口座を移す}
  - {id: terminal, name: 持ち主の端末, role: 席が ssh で Chrome を起こす先}
  - {id: tsuzuri, name: tsuzuri（tz の口・面の server・床）, role: 道具}
outputs:
  - {id: boards, name: 2 つの面（project board と account board）, from: FR1}
  - {id: graph, name: 導出グラフ（毎回組み直す・repo に書かない）, from: FR2}
  - {id: ruling, name: 裁定の記帳（台帳の notes の定型行 + 器の event）, from: FR6}
  - {id: stage, name: 表示面（端末の Chrome の窓）, from: FR16}

rail:
  - {n: 1, who: orchestrator 席, what: 近傍を材料に問いを置く（処分の宣言つき）, reqs: [FR4, FR6]}
  - {n: 2, who: 面の server, what: 問いを面に出す（SSE）, reqs: [FR6, NFR2]}
  - {n: 3, who: 持ち主, what: 面で答える（1 問か束・方針）, reqs: [FR6, FR7, FR8]}
  - {n: 4, who: 面の server, what: 台帳に逐語を記帳し承認の event を書く, reqs: [FR9]}
  - {n: 5, who: 器, what: 席を起こす（配達か停止の hook）, reqs: [FR9]}
  - {n: 6, who: orchestrator 席, what: 処分を宣言し設計文書か台帳へ反映する, reqs: [FR4, FR13]}
  - {n: 7, who: 床, what: 不変条件と未反映を数える, reqs: [FR3, FR13]}

verdicts:
  - {id: pass, name: 合格 — 壊れていない, tone: ok, cond: 検査が最後まで動いて、決まりに反する箇所が 1 つも無かったとき}
  - {id: fail, name: 不合格 — 壊れている, tone: bad, cond: 検査が最後まで動いて、決まりに反する箇所が見つかったとき}
  - {id: pending, name: まだ分からない — 検査できなかった, tone: neutral, cond: 検査そのものが動かせなかったとき。合格として表示しない（P-4）}

requirements:
  - id: FR1
    title: 面は 2 つ（project board と account board）
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: 面は project ごとの project board と器の側の account board の 2 つとし、account board は HOME・session・各 project の 3 つの tab を持つ。project board は account board から名前つきの新しい窓で開き、既に開いていれば前面に出し、「戻る」は自分の窓を閉じて account board へ戻る。mode（初心者と経験者）と、account board から開いた窓の一覧と、最初の案内を見終えた印と、個別の頁の本文と記録の段の開き閉じ（段の種類ごとに 1 つ・節点ごとでない）の 4 つは、その browser の保存に残す。これは便利のための写しで正本ではなく、台帳と設計文書と器の値は browser に置かず、保存が消えても面は URL と server の読みから同じ画面を組む。
    plain: 画面は 2 つです。project ごとの画面と、複数の project と口座をまとめて見る画面です。project の画面は新しい窓で開き、「戻る」で窓を閉じて元へ戻ります。初心者と経験者の切り替えや開いた窓の一覧、個別の頁の本文と記録を開いたか閉じたかは、その browser に覚えさせます（消えても画面は元どおり組めます）。
    basis: [P-2]
    verify: {method: test, how: 2 つの窓の名と「戻る」の 3 段（前面・開く・閉じる）を browser の runner で撃つ, ac: [AC9]}
    goals: [GOAL1, GOAL3]
    figures: []
    adrs: [ADR-7, ADR-30]
    note: 画面の設定（mode・開いた窓の一覧・最初の案内の済み印）をその browser に残すのは持ち主の裁定 t3-hub.52.16（裁定 id = t3-hub.52.16:20260927T2233Z-1）。個別の頁の本文と記録の段の開き閉じを残すのは持ち主の裁定 t3-hub.76.4（裁定 id = t3-hub.76.4:20261003T0057Z-1・判断の記録 ADR-30 決定 (4)）。ほかの畳める段の開き閉じは頁の一生の間だけ持つ（ノート surface-board の節 21）。
  - id: FR2
    title: 導出グラフ（設計文書と設計ノートと台帳と走行を 1 つに結ぶ）
    pattern: event
    strength: must
    when: 面の server か tz graph が呼ばれたとき
    shall: 設計文書の節点（11 種と設計ノートの行）と台帳の節点（epic・task・memo・question と notes から導く あなたの決定・orchestrator の受け・全体への指示）と走行（run）と着地の commit（器の event log の走行の終わりの札 sha の 40 字の名）を 1 つのグラフに毎回組み直す。辺は設計文書の型と台帳の型と結びの型（design・ruled_by・answers・touches・premises・source）と走行の型（run_of・raised・ran_by）と着地の型（landed・commit → 契約）で、repo に書かない。読めない出所は、その種類だけ「まだ分からない」とし、他の種類は組む。
    plain: 台帳と設計の文書と作業の走行と、作業を取り込んだ commit を、毎回 1 つの図に組み直します。file には書きません。読めない元があれば、その種類だけ「まだ分からない」と出し、ほかは組みます。
    basis: [P-6, P-19, N-2]
    verify: {method: test, how: 小さな design-intent と一時の台帳と偽の state dir の fixture で節点と辺の数と種類を snapshot と比べる, ac: [AC4, AC8]}
    goals: [GOAL2]
    figures: []
    adrs: [ADR-7]
  - id: FR3
    title: 不変条件の 12 本を 3 値で数える
    pattern: event
    strength: must
    when: tz graph --check が呼ばれたとき
    shall: 不変条件（辺の両端の実在・open の契約は設計の行を 1 つ指す・発効した記録は裁定の行を持つ・問いは処分を持つ・孤児 0・輪 0・宙に浮いた裁定 0・4 象限の違反 0・名指した id は欄にも在る・id の族が互いに素・走行は run_of を 1 つ持つ・Questioned の走行は問いを持つ）を数え、違反は id と次の 1 手を名指し、台帳か state が読めなければ「まだ分からない」とし合格にしない。
    plain: 図の決まり 12 本を機械が数えます。破れていれば、どの id が何を直せばよいかまで名指します。台帳が読めないときは「合格」と言いません。
    basis: [P-4, P-19]
    verify: {method: test, how: 不変条件ごとに違反 1 本の fixture を置き、その 1 本だけが名指されることを見る, ac: [AC5, AC7]}
    goals: [GOAL2]
    figures: []
    adrs: [ADR-7]
  - id: FR4
    title: 問いの起票の門（近傍の処分の宣言）
    pattern: event
    strength: must
    when: 席が問いを台帳に置こうとしたとき
    shall: 門（PreToolUse の guard）は、問いが touches を 1 つ以上持ち、touches の各節点から根拠と影響の各 1 段の近傍のうち、種類が条・規則行・発効した判断の記録・要件の 4 つの節点（次数が 30 を越える hub は除く）の全部に処分（touches か not-relevant）が宣言され、束の要約値が今の版と一致するときだけ通す。通さないときは処分の無い id を全部名指す。処分の要る節点が 30 を越える問いは「まだ分からない」として通さず、touches を絞った問いに分けさせる。
    plain: 席が質問を出すとき、関係する決まり・規則・決定・要件を 1 段先まで全部見たか（見て「関係ない」と言ったか）を機械が確かめます。見落としがあれば、その id を全部挙げて止めます。見るものが多すぎる質問は、分けて出し直させます。
    basis: [P-14, P-19]
    verify: {method: test, how: 処分の無い id が 1 つ在る・全部在る・要約値が古い・処分の要る節点が 30 を越える の 4 通りで allow と deny と まだ分からない を見て、hub と 4 種の外の節点が名指されないことを見る, ac: [AC6]}
    goals: [GOAL2]
    figures: []
    rules: [R-39]
    adrs: [ADR-7, ADR-30]
    note: 近傍の絞り（1 段・4 種・hub を除く・処分が 30 を越える問いは まだ分からない）は討論の記録 B の §11.3 の偽陽性の切り方で、持ち主の裁定 t3-hub.55.2（裁定 id = t3-hub.55.2:20260927T2233Z-1）で字を改めた。門は便 f-gate の着地の後に席の設定（PreToolUse・matcher Bash）に入れる（持ち主の裁定 t3-hub.55.3・裁定 id = t3-hub.55.3:20260927T2233Z-1）。設計の索引（folio graph）は判断の記録の状態を持たないので、索引がそれを持つまで門は判断の記録を状態によらず 4 種に数える（処分を多めに求める閉じる側・今の main で発効していない判断の記録は 1 つだけ・行 f-gate）。同じ門は、席が台帳の道具の作る命令で置く bead の、付帯の欄（metadata）の鍵（short）に置く短い題の欠けと字数の越えも断る（規則の行 R-39・判断の記録 ADR-30 決定 (6)・要件 FR10）。
  - id: FR5
    title: 帯と形と個別の頁と吹き出しの描き方
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: 帯は出所の正本の名で 7 つ（constitution・rules・ADR・SRS・design-note・beads・pipeline）とし beads の帯は種類の 7 行に分ける。形は 2 種（四角 = file に書かれた行・丸 = 台帳と走行）、色は帯、縁は状態だけで、個別の頁の図と節点の札と記号の見方に使う。地図の頁は持たず、1 つの bead のつながりは、札と一覧の行の吹き出しの口から開く個別の頁で見せる。個別の頁は上から頭と概要（表示の型の 1 つの全文と、その下に畳んだもう一方の概要）・つながり・本文（畳む）・記録（畳む）・走行の時間軸の順に並べる詳細の表示とし、本文と記録は台帳の本文と記録（notes）を見出し・箇条・番号・段落・等幅の字の形で描き、表示の型によらず閉じて始める。個別の頁の近傍は根拠の側と影響の側を各 2 段、節点に pointer を置くと両側を光らせ hub から先は広げず光る節点は 20 まで、段数と畳みは URL に残す。pipeline の札と台帳 open の一覧の行は click で吹き出しを開き、× と外の click と取り消しの鍵（Esc）で閉じ、hover では開かない（一覧の行にマウスの pointer を載せると、吹き出しは出さずに板の対応する札に hover の印を付ける・pointer の種類がマウスでない画面では付けない）。吹き出しは題の全体・概要（表示の型の 1 つの全文・規則の行 R-19 の字数を越えれば畳み、押すと開く）・id・種類・epic・設計の行・起票の時刻と経過・個別の頁への口・相談の口（その bead を添えて相談の窓を開く頼み・要件 FR19）と、段ごとの事実（Blocked は待つ相手と待つ理由・Queued は列に入った時刻とまだ起きない理由・Running / Gated は段の流れ・止まりは理由の全文と走行の歴と次の手・着地は commit と CI の結果）を出し、窓の幅が規則の行 R-35 のスマホの段では下からの板（sheet）にする。
    plain: 図の帯は元の文書の名前で分け、形は「文書の行 = 四角・台帳と走行 = 丸」の 2 つだけです。地図の頁はなくし、1 つの項目のつながりは、札を押して出る吹き出しから開く個別の頁で見ます。吹き出しは押すと開き、× か外を押すか取り消しの鍵（Esc）で閉じます。スマホでは下から出ます。吹き出しと個別の頁の概要は、初心者か経験者かの見せ方に合わせて 1 つだけを出し、吹き出しでは長い時に畳みます。個別の頁は、概要・つながり・本文・記録を上から並べた詳しい頁です。
    basis: [P-2, N-5]
    verify: {method: test, how: 節点の形と帯の class を snapshot で pin し、hub の fixture で光る節点が 20 以下で hub が展開されないことを見て、札の click で吹き出しが開き × と外の click と取り消しの鍵（Esc）で閉じ hover では開かないことを browser の runner で撃ち、2 つの表示の型で吹き出しと個別の頁の概要が 1 つだけで、R-19 の字数を越える吹き出しの概要が畳まれて押すと開き、個別の頁の段の順が頭・つながり・本文・記録・時間軸で本文と記録が閉じて始まることを歯で見る, ac: [AC4, AC9, AC18, AC20]}
    goals: [GOAL2]
    figures: []
    rules: [R-19, R-20, R-35]
    adrs: [ADR-7, ADR-27, ADR-29, ADR-30]
    note: 地図の 6 面とグラフの箱の畳み（見える箱 40 まで・持ち主の裁定 t3-hub.52.32 と t3-hub.52.53）は、判断の記録 ADR-27 決定 (2) で地図と一緒に消した。帯と形と色と縁と近傍の段数と光らせ方は、個別の頁の図（近傍）と節点の札と記号の見方が使い続ける（ADR-27 決定 (1) の (ア)）。概要の出し分けと吹き出しの概要の畳みと個別の頁の詳細の表示と一覧の行の hover の印は判断の記録 ADR-30 決定 (2)(3)(4)(8) で、ADR-27 決定 (2)(7) の字の置き換えは ADR-30 決定 (1)。
  - id: FR6
    title: 問いの card と答え
    pattern: event
    strength: must
    when: 持ち主が問いに答えたとき
    shall: 問いは台帳の question で、card の順は題・概要（表示の型の 1 つ・要件 FR15）・理由（常に表示）・推奨・答えの欄・つながり（畳む）。project board は問いを、上の固定の帯の質問の数から開く窓に 1 問ずつ出し、答えを送ると次の問いへ進み、全部に答えると窓を閉じる。束の承認と方針の欄は質問の窓の下の段に置く。答えは面の server が id（UTC の分つき）を発行し、問いの bead の notes に定型行として追記し、問いを閉じる。席は id を打たない。
    plain: 質問は、画面の上の帯から開く窓で、題・概要・理由・おすすめの順で並んだ札に 1 問ずつ答えます。答えると次の質問へ進み、全部答えると窓が閉じます。答えは台帳に「いつ・何と答えたか」の 1 行で残り、番号は機械が付けます。
    basis: [P-12, P-19]
    verify: {method: test, how: 一時の台帳と偽の bdw で答えを送り、notes の末尾の 1 行と closed を見て、窓で 2 問を続けて答えると 2 問目へ進み全部の後に窓が閉じることを browser の runner で見て、2 つの表示の型で card の概要が 1 つだけであることを歯で見る, ac: [AC1, AC18, AC20]}
    goals: [GOAL1]
    figures: []
    adrs: [ADR-7, ADR-27, ADR-30]
    note: card の概要を表示の型の 1 つにするのは判断の記録 ADR-30 決定 (1) の (ア) と決定 (2)。
  - id: FR7
    title: まとめて承認（束）
    pattern: event
    strength: must
    when: 持ち主が束で答えたとき
    shall: 束は 1 問 1 id と束の id を持ち、個別の文が無い行は束の逐語を取る。面が見た問いの版が今の版と違えば 1 byte も書かずに断る。A-1 の印（消す・出す・使う）を持つ問いは束に入れず個別の逐語を要る。取り消しは新しい裁定が前の id を名指して問いを open に戻す（消さない）。
    plain: いくつもの質問にまとめて「おすすめで」と答えられます。ただし、消す・出す・使う類の質問は 1 つずつ言葉で答えます。画面が古いときは何も書かずに断ります。取り消しは消さずに「前の答えを取り消す」と書き足します。
    basis: [A-1, P-12]
    verify: {method: test, how: 3 問の束・A-1 の印を含む束・古い版の束の 3 通りで台帳の byte と event を見る, ac: [AC1, AC2, AC3]}
    goals: [GOAL1]
    figures: []
    adrs: [ADR-7]
  - id: FR8
    title: 全体の方針の欄
    pattern: event
    strength: must
    when: 持ち主が方針を書いたとき
    shall: 方針は 1 つごとに、根の直下の閉じた問いの bead（label intake:question・方針の id は問いの裁定 id と同じ形）として範囲（この論点か全体）の札つきで記帳し、開いている問いを閉じず承認として数えない。今までの根の直下の memo「方針」の notes の方針の行は消さずに読み続ける。席は次の問いを置く前に範囲内の方針を読み、範囲内でまだどの問いの premises にも挙げられていない方針の id を次の問いの premises に持たなければ、問いの起票の門が断る。
    plain: 「今後はこうして」という方針を自由に書けます。方針は質問の答えとは別に残り、席は次の質問を出す前に必ず読みます。
    basis: [P-12]
    verify: {method: test, how: 新しい方針の後に premises の無い問いを置いて断られ、持てば通り、その後の問いは premises が無くても通ることを見る, ac: [AC1]}
    goals: [GOAL1]
    figures: []
    adrs: [ADR-7, ADR-16]
    note: 画面の方針の欄は範囲をつねに全体で送り、この論点の範囲を選ぶ切り替えを持たない（持ち主の指示 t3-hub.1・裁定 id = user 2026-09-28T01:2xZ・個々の問いへの答えはその問いの card で書く・行 g-policy-all）。この論点の札は server の受けとして残し、口を全体だけに狭めるかは後で決める。premises に挙げるのは範囲内の新しい方針だけで、1 度挙げた方針は以後の問いに要らない（1 度の確認・持ち主の裁定 t3-hub.64・裁定 id = t3-hub.64:20260928T1204Z-1 の案 B）。範囲が問いの id の方針は、その問いか、その問いの touches が名指す問いに及ぶ（席の決め 2026-09-28）。門を席の設定に入れるのは行 f-gate-install で、それまでは断らない。
  - id: FR9
    title: 承認の event と席の起こし
    pattern: event
    strength: must
    when: 面の server が裁定を記帳したとき
    shall: server は逐語つきの承認の event を器の event log に書く。席が待ちなら器の配達の口で「裁定 <id> が届いた」の 1 行を送り hook が逐語を注入する。席が考え中なら停止の hook が未読を見つけて続けさせる。裁定から 2 分で席の受けが無ければ面は「席に届いていない」と出す。
    plain: 答えは機械の記録にも残り、席は答えが来たことをすぐ知らされます。席が忙しいときは手が空いた瞬間に読みます。2 分たっても席が受け取らないときは、画面が赤く知らせます。
    basis: [P-12, P-14]
    verify: {method: test, how: 偽の器で配達と停止の hook の 2 経路を撃ち、event の 1 行と席の受けの行を見る, ac: [AC1]}
    goals: [GOAL1]
    figures: []
    rules: [R-21]
    adrs: [ADR-7]
    note: 配達の口は器の seat deliver（scribe2 main bed08a9 で着地）で、送る行は器が固定した 1 行、渡すのは記帳 id だけ（形は設計ノート surface §20 の ruling-id）。考え中の席は器が busy で断るので停止の hook の経路で拾う。
  - id: FR10
    title: pipeline の板と走行の節点
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: 走行（run）は節点で、属性（段・段の理由・gate の verdict・審査・費用・時刻）は器の event log から読み、板の札の段と理由と列に入った時刻は器の局面の出力（fleet/lifecycle.json）の部品から読む（読めない間は台帳の依存と event log の段で割る）。pipeline の板は Blocked・Queued・Running / Gated・止まり（Questioned / Failed / Stopped）・着地 の 5 列で、着地の列は規則の行 R-36 の時間の内の着地だけを出す。Blocked の列は相手を待っている物で、器の局面（run-blocked・相手は持ち主の承認）と、局面（contract-queued）のうち理由が依存（dependency）・重なり（overlap）・予約（reserved）の物（相手は欄 links.on と links.runs）を出し、Queued の列は局面（contract-queued）のそのほかの理由（止め（hold）を除く）の物を出して理由の語を平易な字で出す（理由は器の閉じた 11 語・知らない局面の語と理由の語は閉じた列で持たず「まだ分からない」に倒す）。Blocked の列には、依存でない理由で人の手を待つ留め置き（Held・局面（contract-queued）の理由が止め（hold）の物と、器の受付が断った物）も出し、列の見出しの数は Blocked と留め置きの内訳にし、留め置きの札は席の止めと受付の断りで別の印と、印の語と止めてからの経過の要の 1 行を持ち、吹き出しと個別の頁は止めた者・理由（席の止めは局面の出力の部品の理由の字・受付の断りは断りの名の平易な字と 1 行の理由・無ければ「まだ分からない」）・止めた時刻と経過・解く条件を出す。札は契約 bead の短い題と段ごとの要の 1 行（Blocked は待つ相手と待ちの長さ・Queued は列に在る長さと起票からの経過で、列に在る長さが規則の行 R-37 の時間を越えると注意の色・Running / Gated は今の段と走行の回数と経過と口座・止まりは理由の短い字と走行の回数・着地は時刻と CI の結果）を持ち（Blocked と Queued の札は設計の参照を持つ契約の bead だけ・epic は板に出さない）、5 列の下に形の崩れた open の bead（控えの印と設計の参照のどちらも無いか両方在る・epic と問いと裁定は除く）を出す要修正の行（0 本なら出さない）を置く。控え（memo）は板に出さず台帳 open の一覧に出す。短い題は台帳の道具（bd）の付帯の欄（metadata）の鍵（short）の字を写し、無ければ今の題から作る（便は契約の行 id・ほかは題の「—」の前）。置いた短い題も作った短い題も規則の行 R-19 の字数を越えれば頭を残して「…」で切り、付帯の欄（metadata）の鍵（short）に短い題を置かない席の起票は問いの起票の門が断る（規則の行 R-39）。面の server の電文は、bead の起票の時刻・依存の相手・短い題と、走行の段の流れと歴と、Queued のまだ起きない理由を持ち（概要は電文に載せず、吹き出しを開いた時に 1 本の引きの口から読む・要件 FR5）、器から読めない欄は「まだ分からない」と出す。板と台帳 open の一覧と問いの窓が同じ id で連動し、一覧の epic の組を選ぶと板はその epic の札を濃くし、札を選ぶと一覧の行に印を付ける。台帳 open の一覧の行の段の字と組の頭の段ごとの数には、板の札と同じ段の印を付ける。
    plain: 便の進み具合を 5 つの列で見せます。相手（あなたの承認やほかの便）を待っている便（Blocked）と順番を待つ便（Queued）を分け、何を待っているか・何分待っているかを札に出します。着地は直近 12 時間の分を出します。札の題は短い題で、押すと全体と詳しい事実が吹き出しで出ます。依存の相手は済んだのに、席が理由を付けて止めた便と器の受付が断った便は「留め置き（Held）」として Blocked と同じ列に印を付けて出し、押すと止めた理由と時刻とどうすれば動くかが出ます。短い題は長ければ「…」で切ります。
    basis: [P-19, N-2]
    verify: {method: test, how: 5 回やり直した契約 bead の fixture で走行の節点 5 つと板の札 1 つを見て、Blocked と Queued が別の列に出て、着地の列が R-36 の時間を越えた札を出さず、Queued の札が R-37 の時間を越えると注意の印を持ち、置いた短い題と作った短い題が R-19 の字数で切られることを見る, ac: [AC7, AC18]}
    rules: [R-19, R-36, R-37, R-39]
    goals: [GOAL2]
    figures: []
    adrs: [ADR-7, ADR-16, ADR-27, ADR-30, ADR-42]
    note: 5 列と札の要の 1 行と吹き出しと短い題と電文の足しは判断の記録 ADR-27 決定 (6)(7)(9)(10)。控えの列を板から外し、要修正の行は ADR-16 決定 (5) のまま 5 列の下に置く。一覧の段と Queued のまだ起きない理由と Blocked の相手（欄 links.on と links.runs）は器の局面の出力（fleet/lifecycle.json）から、走行の段の流れと歴は器の event log（fleet/events.jsonl）の 3 つの event（RunCreated・RunStage・RunDone）から、gate と審査の内訳は便の dir の 2 つの file（verdict.json・review.json）から読む（器の席の答え・ADR-27 決定 (10)）。局面の出力の全部の書き直しは、器の行が入るまで tsuzuri の側から周期で撃つ（器の席の勧めの下限 300 秒）。理由（reserved）の相手は器が局面の出力の欄に載せるまで「まだ分からない」。短い題の字数の上限と起票の門と一覧の段の印と、電文から本文の概要を外して吹き出しを開いた時に読む形は、判断の記録 ADR-30 決定 (1) の (キ)(ク) と決定 (3)(5)(6)(9)。
  - id: FR11
    title: 次の一手（閉じた 7 種）
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: 次の一手は閉じた 7 種（限度と移動・応答なし・止まっている走行・束の承認・質問・発効待ち・なし）を優先順に判じ 1 つを出す。project board は次の一手を上の固定の帯に出し、押すとその一手の窓（質問・止まった走行など）を開く。account board の HOME は各 project の次の一手を並列に出す。
    plain: 「今あなたがすることは何か」を、決まった順で 1 つだけ、画面の上の帯に出します。押すとその用事の窓が開きます。複数の project があれば並べて出します。
    basis: [P-2]
    verify: {method: test, how: 7 種の fixture で判じられる 1 つと順を snapshot で見る, ac: [AC9]}
    goals: [GOAL1, GOAL3]
    figures: []
    rules: [R-24]
    adrs: [ADR-7, ADR-27]
  - id: FR12
    title: 口座と席の健康
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: project の群は今の口座 1 つと候補の集合を持ち、次の移り先は器の doctor と同じ導出の値を写す。席の合図の健康（tick）と停止（heartbeat）は器の 2 つの file を読み、応答なしは tick が stale のときだけ出す。停止の切り替えは器の CLI を撃ち、面は state dir の file を書かない。移動中の席には退避までの残り秒（器の seat tick status の欄 grace_left= の写し・器の式は移動の合図の時刻 + 猶予 − 今・面も server も数えない）を出し、移り先で起こし直した席には出さない。使用量の閾値（窓ごとの cap）と逼迫の印と、移り先の候補が門で落ちた理由は、器の rules 行と event と doctor の値を写して出し、面も server も閾値を持たず判じない。project board は席と口座を上の固定の帯に小さく出し（席の状態・直近 3 時間の動きの細い帯・今の口座の 5 時間と 7 日の残り）、押すと 24 時間の稼働の帯と残りの詳しい値の窓を開き、口座の履歴と口座の「詳しく」は持たない。account board は休止中の project の印と、口座ごとの 7 日の使用量の小さな図と測った時刻の列を器の event log から写して出し、過去の時点に戻して見るつまみと仕組みを説明する関係の頁は持たない。
    plain: どの口座を使っていて、次はどこへ移るか、席が元気かを見せます。席の元気は器が書く 2 つの file で判じ、画面から器の file を書くことはありません。使用量の上限の目安と逼迫の印は器の値をそのまま写します。project の画面では、席と口座を上の帯に時計のように小さく出し、押すと詳しい窓が開きます。休止中の project と、口座ごとの 7 日の使い方の小さな図も出します。
    basis: [N-2, N-7]
    verify: {method: test, how: tick が古い・heartbeat-off が在る・move-signal が在る の fixture で状態の語と残り秒を見て、state dir の byte が不変であることを見る, ac: [AC10, AC11]}
    goals: [GOAL3]
    figures: []
    rules: [R-22]
    adrs: [ADR-7, ADR-26, ADR-27]
    note: 閾値と逼迫の印と候補の断りの理由を写して出すのは持ち主の裁定 t3-hub.53.8（裁定 id = t3-hub.53.8:20260927T2233Z-1）、account board の部品（休止中の印と 7 日の小さな図と測った時刻の列を作り、時点のつまみと関係の頁は作らない）は持ち主の裁定 t3-hub.53.10（裁定 id = t3-hub.53.10:20260927T2233Z-1）。器の doctor の字の写しの鮮度（面の server の持ち回しの上限）は、判断の記録 ADR-26 の決定 (2)(3) で 60 秒に延ばし、その撤退の条件 (1) で 30 秒に戻した（行 m-doctor-30）。
  - id: FR13
    title: 台帳の指標と未反映の一覧
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: 台帳の指標は open task・純減（24h と 7d）・closed/日・未反映・burndown・判定（順調・停滞・滞り・積み増し・台帳なし）・memo で、project board では台帳 open の一覧の見出しの小さな数と図に縮め、「詳しく」の畳みを持たず、ready / blocked・lead p50・stale・sparkline は出さない（epic の進みは一覧の epic の組の頭の 1 行に出す）。作業中の数と最古は出さない。判定の閾値は rules 行が持つ。未反映の一覧は、器（scribe2）の局面の出力が席の手番とする 3 つ（局面が処置の待ち〔memo-actionable〕か形の崩れ〔misfit〕の memo・未仕分けの発話・裁定の反映待ち）を出し、tsuzuri は自分で判じない（要望は発端を持つ memo で、独立の種類にしない）。project board は未反映の数を一覧の見出しに、一覧を上の固定の帯の抜けの検査の窓に出す。局面の出力がまだ無い間と、知らない局面の語と欄は「まだ分からない」、読めない版の出力の周は「読めない」、古さの印の在る出力は古いと示す。account board は各 project の anchor の台帳と design-intent と局面の出力を読むだけで（書かない）、project ごとに決定待ち（open の問いの数）と未反映の数を出す。
    plain: 積んである仕事の数と片付く速さと、判定を 1 語で、台帳の一覧の見出しに小さく見せます。席がまだ手を付けていないもの（処置を待つ memo・仕分けていない発言・反映を待つ裁定）は、器（scribe2）の判定をそのまま読んで、上の帯から開く窓の一覧に出します。閾値は規則の表にあり、後から変えられます。複数の project をまとめた画面でも、各 project の決定待ちと未反映の数を読んで出します（読むだけで書きません）。
    basis: [P-19, N-2]
    verify: {method: test, how: 一時の台帳の fixture で判定の 5 値を見て、局面の出力の fixture で未反映の 3 つの数と id と、出力が無い・知らない語・読めない版・古さの印の 4 つの周の示しを見る, ac: [AC12]}
    goals: [GOAL2, GOAL3]
    figures: []
    rules: [R-18]
    adrs: [ADR-7, ADR-27]
    note: ほかの project の台帳と design-intent を読むのは持ち主の裁定 t3-hub.53.9（裁定 id = t3-hub.53.9:20260927T2233Z-1）。
  - id: FR14
    title: 語彙と文の予算と hover の規則
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: 英語の技術語は英語のまま出し「?」で注釈する。「?」は 1 行目 40 字と箇条書き 4 項（1 項 20 字）と「詳しく」、hover の card は 4 行（1 行 36 字）と「詳しく」、経験者向けの 1 行は 60 字。hover の card を出すのは頁を持つ節点の札（project board の pipeline の札と台帳 open の一覧の行を除く）・記号だけの要素の 2 種だけで、pointer の右に出し、要素を出て 150 ミリ秒の猶予の間に card の方向へ動いたときだけ残す。project board の pipeline の札と一覧の行は、hover の card でなく click で開く吹き出し（要件 FR5）を出す。
    plain: 説明は短く、記号と図で表します。説明の長さと hover の出し方には決まりがあり、機械で数えます。
    basis: [P-2]
    verify: {method: test, how: 全画面の「?」と card を描いて字数と行数を数え、hover の置き場と、pipeline の札と一覧の行の click の吹き出しの口を browser の runner で撃つ, ac: [AC9]}
    goals: [GOAL1]
    figures: []
    rules: [R-19, R-20]
    adrs: [ADR-7, ADR-27]
  - id: FR15
    title: 概要は data で持つ
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: 節点ごとの概要（非エンジニア向けとエンジニア向け）は設計文書の plain の欄と台帳の要約の欄（bead の本文の定型行「概要 = 」と「技術 = 」の残りか、無ければ見出しの行「## 概要」と「## 技術」の下の次の見出しまでの字）に置き、面は写すだけで生成しない。面は概要を出す全部の所（吹き出し・個別の頁・質問の窓の card・hover の card）で、初心者の表示の型では非エンジニア向けだけを、経験者の表示の型ではエンジニア向けだけを出し、字は切り捨てず、長い時は規則の行 R-19 の字数で畳んで開ける形で出す。表示の型の側の概要が無い時はもう一方を印つきで、両方無い時は本文の頭の 1 行を印つきで出し、もう一方の概要は個別の頁にだけ畳んで置く。要約の無い節点は床が数える。
    plain: 各項目のやさしい説明は、文書と台帳の側に書いておき、画面はそれを写すだけです。初心者向けの見せ方では非エンジニア向けの説明だけを、経験者向けではエンジニア向けの説明だけを出します。説明の無い項目は機械が数えます。
    basis: [P-6, N-2]
    verify: {method: test, how: 要約の無い節点 1 つの fixture で床が 1 件を名指し、2 つの概要の字が違う fixture で表示の型ごとにもう一方の字が 4 つの面に出ないことを両向きで見る, ac: [AC12, AC20]}
    goals: [GOAL2]
    figures: []
    rules: [R-19]
    adrs: [ADR-7, ADR-30]
    note: 表示の型の 1 つを出す決まりと 2 つの概要の読みと代わりの出し方は判断の記録 ADR-30 決定 (2)(7)（ADR-7 決定 (4)(9)(11) の字の置き換えは ADR-30 決定 (1)）。この決まりは board の概要を出す全部の面に掛かる。
  - id: FR16
    title: 表示面（席が端末の Chrome を起こす）
    pattern: event
    strength: must
    when: 席が持ち主に面を見せるとき
    shall: 席は端末の一覧（器の宣言の行・名・ssh の宛先・Chrome の場所・画面の環境・入力の環境・専用の profile・OS）から端末の名で命令し、ssh 経由で Chrome を専用の profile の app mode で起こし、CDP を tunnel で引いて navigate・viewport・reload・click・入力・key・scroll・待ちと、screenshot・DOM・console を行う。どの project をどの端末に出すかは版管理に載らない表示先の設定（全体の既定と project ごとの上書き・値は端末の一覧に在る名だけ）で持ち、tz の口で変え、2 つの board の設定の画面（project board では上の固定の帯の設定〔⚙〕の中の表示先）もその口を通る。窓は board ごとに 1 つで、席はその board の窓だけを操作する。窓を起こすのは、表示先の端末に初めて見せる時（その端末の最初の board の窓）と、持ち主が tz の口か board の button で頼んだ時だけで（持ち主が閉じた窓は開き直さない）、窓を足す手は動いている Chrome へ渡す起動の引数だけとし、窓を前に出す命令と窓を動かす命令と頁の target を作る CDP の命令は撃たず、持ち主へは知らせだけを出す。board の頁の上では click・入力・key を断る。ssh で届かない端末には board の URL を渡すだけにし、席は server 側の headless Chrome を自分の目にする。
    plain: 席があなたの PC の browser を開いて画面を出し、操作して見せます。どの project をどの PC に出すかは設定でいつでも変えられます。窓は board ごとに 1 つで、席が自分で開くのはその PC に最初に見せる 1 回だけ、ほかの board の窓はあなたが頼んだ時だけ開き、勝手に前に出さず、あなたが閉じた窓も開き直さず、知らせだけを出します。board の上では見せるだけです。ssh の届かない端末（スマホなど）には見る URL を渡します。
    basis: [N-5, N-6, N-7]
    verify: {method: test, how: 偽の ssh と偽の Chrome で起動の引数（profile・app mode・入力の環境）と CDP の命令の列を snapshot で見て、窓を前に出す命令と board の頁の上の入力の命令が無いことと、届かない端末で URL の行が出ることを見る, ac: [AC13]}
    goals: [GOAL4]
    figures: []
    adrs: [ADR-5, ADR-7, ADR-15, ADR-24, ADR-27]
  - id: FR17
    title: 人が打つ binary は tz の 1 つ
    pattern: ubiquitous
    strength: must
    when: つねに
    shall: folio の口（check・schema・derive・ceiling・init・parts・face・figure・build・intake・hello）は同じ名の tz の subcommand で、引数と終了 code（合格 0・不合格 1・まだ分からない 2）は folio2 の口のまま。graph は tz graph に吸収し、inject は持たず、serve の要否は面の便で決める。
    plain: 打ち込む命令は tz の 1 つだけです。設計の道具の命令は tz の下で同じ名前で使えます。
    basis: [P-27, N-3]
    verify: {method: test, how: 口ごとに folio と tz の終了 code と出力の一致を見る, ac: [AC14]}
    goals: [GOAL4]
    figures: []
    adrs: [ADR-8]
  - id: FR18
    title: 指し示し（画像と囲みと一言を席へ渡す）
    pattern: event
    strength: must
    when: 持ち主が裁定面の指し示しの欄から指摘を送ったとき
    shall: 面の server は指摘に id を発行し、一言と全体の画像と囲みごとの切り抜きと頁の文脈と囲みの中の要素の素性（上限つき・入力欄の値は伏せる）を state dir に置き、台帳に bead 1 本を置く。取り込み方は、表示面の画面と DOM の写しを同時に取って裁定面で囲む・アプリの窓の上で要素を指すか範囲を囲む・画像を貼るか落として囲む、の 3 つ。指摘は承認として数えず問いを閉じない。
    plain: 画面の一部や画像を、一言と一緒に席へ渡せます。渡し方は 3 つで、席には囲んだ部分の画像とそこに在る部品の情報が届きます。承認としては数えません。
    basis: [P-7, P-12, N-6]
    verify: {method: test, how: 固定の DOM の写しと矩形で要素の列を比べ、偽の CDP で 3 つの取り込み方の命令の列と置き場の file を見る, ac: [AC15]}
    goals: [GOAL1, GOAL4]
    figures: []
    adrs: [ADR-9]
  - id: FR19
    title: 相談の窓 consult（席の文脈から分けた自由な調べと検証の場）と型付きの所見
    pattern: event
    strength: must
    when: 持ち主か席が相談の窓を開き、窓が所見を出したとき
    shall: 相談の窓は、持ち主が席の窓の skill（/tsuzuri:consult）か board の上の帯と吹き出しの相談の口から頼み、席が skill で起こす。形は持ち主が直に話す窓（席の tmux の session の別の窓）と、席が背景で起こす非対話の問う窓の 2 つで、どちらも 1 つの議題に限らず、話題を替えても所見を渡しても閉じない。起動の口は席の口座の置き場の環境変数を継ぎ、器と tsuzuri の plugin を渡さず、制限の形・許可を聞かない形・道具の閉じた列（web の調べを含む）・外の道具（MCP）の断り・読む根の足しと書きの断り・私用の一時の置き場・囲い（有効・囲いの外の撃ち直しの断り・起きない時は起動で止める・資格の file の断り・殻の命令のネットワークは package の配り元だけ）で、窓ごとの作業場（席の drafts の下）を作業の dir にして起こす。所見を出す口は欄（結論・候補と採否・推奨・根拠の id・主張ごとの確かさ・持ち主に問うべき事・触る節点・使った model・読んだ束の要約値・話題・添え物）を検め、欠けていれば受けず、受けた所見を作業場の決まった dir に書く。相談の窓は repo と台帳を書かない。席は相談の見張りを背景に常に置き、見張りは新しい所見と受けの無い相談の頼みで固定の 1 行を出して終わる。席は所見を読む口で読み、台帳に相談の所見と相談の受けの行を置き、所見ごとに処分（採る・一部採る・採らない と理由・添え物ごとの保存する・しない）を宣言する。保存する添え物は席が repo へ写す。処分の無い所見と席に届いていない頼みは board の相談の窓と tz consult の一覧に出す。席が自分で開く問う窓の本数は規則の行 R-38 の上限を越えない。
    plain: 設計や技術の調べと検証をする別の窓を、席の窓の「/tsuzuri:consult」か board の「相談」で開きます。あなたが直に話す窓と、席が強い model に問う話さない形があり、どちらも話題を替えて使い続けられます。窓ごとの作業場でプログラムを組んで実験でき、web も調べられますが、repo と台帳は書けず、作業場の外へは囲いで書けません。結論は決まった形の file に書いて席に渡し、席が自動で気づいて、採るかどうかと、レポートを repo に保存するかを記録します。
    basis: [P-7, P-12, P-14, P-16, P-19, N-2, N-7]
    verify: {method: test, how: 欄の欠けた所見が断られ揃った所見が作業場の決まった dir に書かれることと、見張りの固定の 1 行と、席の読みの口の台帳の 2 行を見て、起動の口の argv と設定を fixture と比べ、囲いの中から作業場の外と repo への書きが断られることを撃つ, ac: [AC16, AC19]}
    goals: [GOAL1, GOAL2]
    figures: []
    rules: [R-38]
    adrs: [ADR-10, ADR-12, ADR-29]
    note: 自由な場と作業場と囲いと受け方と保存の選びは判断の記録 ADR-29（持ち主の裁定 t3-hub.75.1 と t3-hub.75.2）。前の字（器の口で 1 行を送る・未反映の一覧に載る）は ADR-29 決定 (1) の (エ)(オ) で替えた。相談の台帳の行は「相談の」で始まる閉じた頭で、memo と根の bead にだけ置く（ADR-29 決定 (4)）。
  - id: FR20
    title: 表示面の対象を広げる（中身が web の native・スマホの emulator・純粋な native）
    pattern: ubiquitous
    strength: should
    when: つねに
    shall: 表示面は、CDP を話す対象（web・中身が web の native）を CDP で、話さない対象（スマホの emulator・純粋な native）を画面の配信と入力の戻しの 1 本の経路で見せて操作する。対象ごとに別の表示の仕組みを作らない。
    plain: 席が見せて操作できる対象を、web から native やスマホの emulator へ広げます。見せる仕組みは 2 つだけにします。
    basis: [N-5, N-6, N-7]
    verify: {method: test, how: 対象の種類ごとの端末の行の fixture で、選ばれる経路が 2 本のどちらかであることを見る, ac: [AC17]}
    goals: [GOAL4]
    figures: []
    adrs: [ADR-11]
  - id: FR1001
    title: "契約の検査"
    pattern: unwanted
    strength: must
    when: "契約 file（契約表の行から生成した写し・必須 field の集合は生成の型が持つ）に必須 field の欠落・複数行の verify・write-set 0 本が在るとき"
    shall: "全件を行番号付きで集めて拒否し、 便を作らない"
    plain: "契約の file に必須の項目（何が必須かは生成の型が持ちます）が欠けていたり、verify が複数行だったり、write-set が空だったら、問題を全部まとめて行番号付きで断り、便は作りません。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1006, AC1014, AC1073]}
    goals: [GOAL1004]
    figures: []
    note: "なぜ要るか: 契約が書き切れることを求めるニーズ（GOAL1004）から来ています。欠けた契約を後の段で見つけると QA の周回が始まるので、入口で全件まとめて断る方が安いからです。"
  - id: FR1002
    title: "契約の pointer"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "契約は SRS の要件 id と設計 doc を pointer で持ち、 設計 1 本から契約が複数出る形を保つ（適用対象は器の要件書を根拠に起票する契約・v1 由来の既存 bead は対象外）"
    plain: "契約には「どの要件のためか」（SRS の要件 id）と「どの設計から来たか」（設計 doc）を必ず書きます。設計 1 本から契約が何本も出る、という形を崩しません。対象は器の要件書を根拠に起票する契約で、v1 由来の既存 bead は対象外です。"
    basis: []
    verify: {method: inspection, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 I・inspection）", ac: [AC1002]}
    goals: [GOAL1004, GOAL1005]
    figures: []
    note: "なぜ要るか: 契約は小さく、しかし出どころは失わない、というニーズ（GOAL1004）から来ています。要件 id と設計 doc を指していれば、契約を書き直すときも全部の bead が同じ形を保てます。"
  - id: FR1003
    title: "便の永続"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "各段は fleet の event log を replay して現在地を読み、 段の終わりに event を 1 件追記する（process の記憶に状態を持たない）"
    plain: "各段は自分の記憶ではなく、追記だけの記録（event log）を最初から読み直して現在地を知り、終わるときに記録を 1 行足します。process の中に状態を抱えません。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1004]}
    goals: [GOAL1003]
    figures: []
    note: "なぜ要るか: 記憶に頼らない、というニーズ（GOAL1003）から来ています。process の中に状態を持つと、その process が死んだ瞬間に現在地が消えるからです。"
  - id: FR1004
    title: "runner の起動"
    pattern: event
    strength: must
    when: "便が Intake 段にあり spawn が要求されたとき"
    shall: "base を記録し、 worktree を切り、 write-set の allowlist（write-set で置き場だけ〔中身を変えない〕と印を付けた項目〔=〕は除く）を書いて runner を headless で起動する。 runner の stdin は、 契約の直後に共通 verify の節（便の写しの共通 verify の各行を、 gate と同じ 4 つの穴の埋め方〔base の sha・並列度の 2 つの穴に並列の枠を取らない並列度 1・契約の verify 行の filter 語〕で埋めた字。 写しを読めない周は読めない理由の 1 行、 行が 0 本の写しは なし の 1 行）を持つ"
    plain: "便が「受け付け済み」の段にあって起動を頼まれたら、出発点（base）を記録し、作業用の worktree を切り、書いてよい file の許可の列（触ってよい file の列から、置き場だけ〔中身を変えない〕と印を付けた項目〔=〕を除いたもの）を書き出してから、実装役（runner）を画面なしで起動します。実装役への入力は、契約の直後に共通 verify の節（便の写しの共通 verify の各行を、gate と同じ 4 つの穴の埋め方〔出発点の sha・並列度の 2 つの穴に並列の枠を取らない 1・契約の verify 行の filter 語〕で埋めた字。写しを読めないときは理由の 1 行、行が 0 本なら「なし」の 1 行）を持ちます。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1001, AC1071, AC1079]}
    goals: [GOAL1001]
    figures: []
    note: "なぜ要るか: 人の手が入らなくても安全に進む、というニーズ（GOAL1001）から来ています。出発点と触ってよい範囲を先に記録しておけば、実装役を無人で走らせても後から検証できます。実装役への入力に共通 verify の節を持たせるのは、gate が撃つ行を実装役が先に撃てるようにするためです（ADR-0102）。"
  - id: FR1005
    title: "runner と lens の口"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "runner と lens は claude -p（headless・stdin に契約 / diff・stdout に構造化 1 行・permission を毎回明示・口座は環境変数で切替）の 1 形で呼ぶ。 器が起こす claude（runner・lens・口座残量の計測）は、 口座の自動 memory（claude が口座の設定 dir の下に cwd ごとに持ち、 起動時に読む記憶）を子の env で毎回切り、 親の値を継承させない。 lens には読みの道具だけを道具の列として渡し、 許可の問いを誰にも出さない mode（dontAsk）を毎回明示し、 許可の規則は渡さず、 lens の起動に渡された permission の値は使わない（dontAsk でない値の記録は FR1099）。 lens の turn は rules 行 lens.max_turns（値は user 裁定 id 付き）を上限に持ち、 上限で終わった周の出力は判定を持たない周（FR1009・FR1049 の parse できない周）と読む"
    plain: "実装役（runner）も審査役（lens）も、同じ 1 つの形で呼びます。画面なしの claude -p に、契約や diff を入力で渡し、答えは構造化した 1 行で受け取り、許可の設定は毎回明示し、口座は環境変数で切り替えます。器が起こす claude（実装役・審査役・口座残量の計測）は、口座の自動 memory（claude が口座の設定の場所に作業場所ごとに持ち、起動のときに読む記憶）を毎回切り、親の値を引き継ぎません。審査役には読みの道具（Read・Grep・Glob の 3 つだけ）を渡し、許可の問いを出さない mode（dontAsk）を毎回明示し、許可の規則は渡さず、起動に渡された許可の値は使いません（dontAsk でない値の記録は FR1099）。審査役の turn は規則の行 lens.max_turns の値（user の裁定で決めます）を上限に持ちます。上限で終わった回の出力は判定を持たないので、答えが読めない回（FR1009・FR1049）にそのまま当たります。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1001, AC1002, AC1010, AC1067, AC1069, AC1070]}
    goals: [GOAL1001]
    figures: []
    note: "なぜ要るか: 自律安全のニーズ（GOAL1001）から来ています。画面のある席を建てると宛先解決や見張りの仕組みが要りますが、画面なしの 1 形なら process の起動と終了だけで完結します。審査役を読みの道具だけで起こすのは、編集を自動で許す mode で main の作業木から起きた審査役が、書けるのに code を読まずに終わる形を塞ぎ、読みを作業場所の中に閉じるためです。turn に上限を持つのは、読みが長引いても審査の費用に天井を置くためです。自動 memory を切るのは、同じ契約が走る口座によって違う材料で扱われないためです（数えと経緯は ADR-0102）。"
  - id: FR1006
    title: "完了判定"
    pattern: event
    strength: must
    when: "runner が終了したとき"
    shall: "rc 0 かつ base からの commit が 1 件以上なら終わりの門（FR1098）を経て Implemented、 それ以外は Failed と記帳する"
    plain: "実装役が終わったとき、正常終了（rc 0）で、出発点から commit が 1 件以上あれば、終わりの門（FR1098）を経て「実装済み」、そうでなければ「失敗」と記録します。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1001, AC1072]}
    goals: [GOAL1003]
    figures: []
    note: "なぜ要るか: 記憶に頼らない、というニーズ（GOAL1003）から来ています。「終わった」と言葉で申告させず、rc と commit の数という機械の事実で判定します。"
  - id: FR1007
    title: "入口の flip check"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "変更した .rs ごとに、 test 差分だけを base に当てて新規・変更 test が 1 本以上 RED になり、 かつ HEAD では GREEN であることを機械で確かめ、 docs-only でない変更に test 差分が無ければ拒む"
    plain: "変更した Rust の file ごとに、test の差分だけを出発点（base）に当てて「先に落ちる」こと、そして変更後（HEAD）では通ることを機械で確かめます。文書だけの変更（docs-only）を除き、test の差分が無い変更は受け付けません。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1003]}
    goals: [GOAL1004]
    figures: []
    note: "なぜ要るか: 契約は小さく、検証は base で落ちる test で表す、というニーズ（GOAL1004）から来ています。先に落ちない test は何も守っていないので、入口で機械が確かめます。"
  - id: FR1008
    title: "gate の機械検証"
    pattern: event
    strength: must
    when: "gate が要求されたとき"
    shall: "共通 verify と契約の verify の各行を worktree で実走して行ごとの rc を記録し、 1 本でも rc が 0 でなければ FAIL とする。 verify の実走の前の gate の write-set を照らす段は、 便の diff に在る write-set の置き場だけの項目（=）の file を名指して段を落とす（FAIL・done の項目ごとの歯の欄の有無に依らない）"
    plain: "審査（gate）を頼まれたら、共通 verify と契約に書いた検証コマンドを 1 行ずつ作業用 worktree で実際に走らせ、行ごとの結果を記録します。1 本でも失敗すれば FAIL です。検証コマンドを走らせる前の、触ってよい範囲を照らす段では、置き場だけと印を付けた file（=）が変更に含まれていれば、その file を名指して落とします（done の項目ごとの歯の欄の有無に依りません）。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1003, AC1020, AC1072, AC1078, AC1079]}
    goals: [GOAL1001]
    figures: []
    note: "なぜ要るか: 自律安全のニーズ（GOAL1001）から来ています。検証コマンドを実際に走らせた結果だけを信じ、実装役の自己申告を根拠にしません。置き場だけの file を gate でも測るのは、shell での書き換えは編集の時点の止め（FR1020）を通らないからです（FR1020・AC1079）。"
  - id: FR1009
    title: "lens の verdict"
    pattern: unwanted
    strength: must
    when: "lens が要るのに lens が無い・diff が効いている予算 cap（manifest の値か、 予算 cap の rules 行への上限の許可〔FR1111〕がその bead の便の gate と gate が起こす lens に効く周はその値）を超える・stdout が parse できない・verdict が 3 値の外のとき"
    shall: "PASS を名乗らず INCONCLUSIVE とする。 ただし lens は在るが lens の出力が parse できない周だけは、 同じ gate の中で lens を 1 回だけ撃ち直し、 撃ち直した lens の出力もなお parse できないときに INCONCLUSIVE とする（parse できたうえで規則が断った周は lens を撃ち直さない）"
    plain: "審査役が要るのに居ない、diff が効いている予算（設定の値か、予算の行への上限の許可〔FR1111〕が作業の便の検査〔gate〕とその検査が起こす審査役に効く周はその値・契約の審査などほかの審査役は設定の値のまま）を超える、答えが読めない、答えが 3 値（PASS / FAIL / INCONCLUSIVE）の外、のどれかなら、合格（PASS）とは言わず「判定できなかった（INCONCLUSIVE）」にします。ただし審査役は居るのに答えの形が読めなかったときだけは、同じ審査（gate）の中で審査役を 1 回だけ撃ち直し、それでも読めなければ「判定できなかった」にします（読めたうえで規則が断ったときは、審査役を撃ち直しません）。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1003, AC1069, AC1085]}
    goals: [GOAL1001]
    figures: []
    note: "なぜ要るか: 自律安全のニーズ（GOAL1001）から来ています。判定できなかった便を合格と呼ぶと、壊れたものが無人で着地します。"
  - id: FR1010
    title: "land の前提"
    pattern: unwanted
    strength: must
    when: "verdict が PASS でない、 または main の tip が記録した base と一致せず追随できない（base が main の祖先でない、 または worktree が clean でない）とき、 または FR1050 が着地を止めている間、 または FR1011 の着地の前の取り込み（候補の木を組む前）で remote の main の先端を読めない周・main と分かれている周・取り込みの CAS を git が断った周、 または裁定 id の実在（FR1083）か未反映の裁定（FR1084）の判定が便に当たる間"
    shall: "land は main を変えない（便の中身を main に載せない。 FR1011 の着地の前の取り込み〔remote に既に在る commit の fast-forward〕はこれに当たらず、 取り込んだ後の追随が落ちる周と再 gate が PASS でない周も取り込みを戻さない）。 verdict が PASS でない周と追随できない周は（取り込みの記帳を除き）event も変えず、 FR1050 の push の前の走査・FR1011 の着地の前の取り込み・FR1083・FR1084 が着地を止める間は便を Gated に留め、 留めの理由（止めた要件と、 当たった裁定 id か欄か、 取り込みの止めの閉じた 3 語〔unreadable・diverged・ff-failed〕）の event を記帳し（同じ理由が続く周は記帳し直さず、 理由が変われば 1 件記す）、 次の dispatch の周に同じ判定を撃ち直す。 取り込みの止めの間、 便は着地の番を持ち続けて後ろの便の着地も待たせ、 分かれた周は器が解かない（分かれた main を直すのは席の手）。 この留めは撃ち直しの上限の回数（FR1011）にも追随の衝突の上限（FR1034）にも数えず、 便を Failed にしない"
    plain: "審査が合格でないとき、または main の先端が記録した出発点（base）とずれていて追いつけない（出発点が main の祖先でない、または作業用 worktree に未 commit の変更がある）ときは、着地（land）は便の中身を main に載せません。ここで「載せない」は便の中身のことで、FR1011 の着地の前の取り込み〔remote に既に在る commit への fast-forward〕はこれに当たらず、取り込んだ後に追いつけないときと審査をやり直して合格でないときも、取り込みは戻しません。合格でないときと追いつけないときは、取り込みの記録のほかは記録も変えません。push の前の走査が当たるか読む上限を越えて、main が remote の先端に揃うまで着地が止められている間（FR1050）と、着地の前の取り込みで remote の main の先端を読めない・main と分かれている・取り込みの書き換えを git が断った（別の書きとの競合など）とき（FR1011）と、便が引く裁定の番号が台帳に結ばれていない（FR1083）か、写されていない裁定に関わる（FR1084）間は、main に載せずに便を待たせ（Gated）、止めた要件と、当たった裁定 id か欄を記録します（同じ理由が続く間は記録し直さず、理由が変われば 1 件記録します。取り込みの止めの理由は unreadable・diverged・ff-failed の 3 語です）。次の送り出しの周に同じ判定を撃ち直します。取り込みが止まっている間、その便は着地の番を持ち続けるので、後ろの便も待ちます。分かれたときは器が自分では直さず、席が分かれた main を直すまで続きます。この待ちは撃ち直しの回数の上限（FR1011）にも追随の衝突の上限（FR1034）にも数えず、「失敗」にもしません。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1003, AC1023, AC1053, AC1054, AC1089]}
    goals: [GOAL1001, GOAL1003]
    figures: []
    note: "なぜ要るか: 自律安全のニーズ（GOAL1001）から来ています。合格していない便や、出発点が main の祖先でない（main が巻き戻った・分岐した）便が main に載る経路を構造的に持たないためです。着地が止められている間に着地を重ねないのは、隣の private repo の識別子を持つ commit が残る main の上に次の便を積まないためです（GOAL1001）。裁定の待ちと push の前の停止を回数の上限に数えないのは、写す手や承認が来るまで待つのが正しい状態で、回数を重ねても解けないからです。止めた理由を、同じ理由が続く間は記録を増やさず、理由が変わったときだけ 1 件足すのは、便がなぜ載らないかを記録から読めるようにしつつ、同じ理由で記録を増やさないためです（GOAL1003）。取り込みが止まった周に着地させないのは、分かれた周は積んでも push が落ちるだけで、読めない周と取り込みの書き換えを git が断った周は次の周に解けうるからです。どれも原因は便でなく repo の側（remote か anchor の main）に在るので、失敗にも上限の数えにもしません（GOAL1001）。番を持ち続けるのも同じ理由で、番を後ろの便へ渡しても同じ止めに当たります。「main を変えない」を便の中身を載せないことと読むのは、着地の前の取り込みが remote に既に在る commit だけを main に入れ、席の pull と同じ結果になるからです（設計 pipeline.md §69）。 器の trace に無かった散文の指し GOAL1003 を型付きの欄へ足した（取り込みの段 1）。"
  - id: FR1011
    title: "land"
    pattern: event
    strength: must
    when: "verdict が PASS で、 FR1010 の留め（FR1050・FR1083・FR1084）に当たらないとき"
    shall: "vessel 宣言が任意 key remote（押す先）を持つ repo では、 便が着地の番を取った周と番を取らずに進む周（番待ちの上限を越えた周・列を導けない周）に（PR で着地する便・land を通らない 2 つの口〔終端だけの撃ち直し（pipe land --terminal-only・FR1050）と着地の後の検出（pipe land --detection-only・ADR-0060）〕・候補の木で既に着地した便を除く）、 器は候補の木を組む前に remote の main の先端を読み、 main がその祖先なら CAS の fast-forward で取り込み、 取り込んだ事実を便の event に記帳する（着地の前の取り込み。 便の中身を載せない。 main と先端が同じ周・main が先を行く周・remote に main が無い周・vessel 宣言を読めない周は取り込まずに進む〔読めない周は終端が FR1050 の読めない周で止める〕。 先端を読めない周・分かれた周〔祖先の判定を読めない周を含む〕・取り込みの CAS を git が断った周は main も remote も動かさずに FR1010 の留め）。 取り込みの後に FR1010 の base の前提（追随は FR1034）を判じ、 揃った便について、 worktree の tree を squash 1 commit で main に載せる前に、 その commit の出ていく字面を FR1050 の push の前と同じ公開の字面の走査に掛け、 当たる便（識別子に当たる便と読む上限を越える便）は main に載せずに Failed と記帳して止まり、 判定できない便（publish の種類の rules 行が無い周・解けない周・締め切りを越えた周）は main に載せずに理由を記帳して Gated に留まり、 次の dispatch の周に同じ判定を撃ち直す（rules 行が持つ上限の回数に達した便は Failed で終端する）。 候補の木に並べた便は、 断った便（Failed か Gated に留めた便）より後ろの便も main に載せずに並びへ戻す（候補の木を組み直して gate を撃ち直す）。 rules 行の enabled が false の周は走査しない。 通った便は squash 1 commit で main に載せ（tree 同一・CAS）、 main で verify を再実走し、 RED なら Failed と記帳して止まる"
    plain: "審査が合格で、着地を止める留め（FR1050・FR1083・FR1084）に当たらなければ、まず、vessel 宣言に押す先（任意 key remote）がある repo では、便が着地の番を取ったとき（番待ちの上限を越えて番を取らずに進むときと、列を導けないときも）に、候補の木を組む前に remote の main の先端を読み、main がその先端の祖先（遅れているだけ）なら前へ進めて（fast-forward）取り込み、取り込んだことを記録します（着地の前の取り込み）。取り込みは便の中身を載せません。main と先端が同じとき・main が先を行くとき・remote に main が無いとき・vessel 宣言を読めないとき（終端が FR1050 の読めない周で止めます）は取り込まずに進み、PR で着地する便・着地を通らない 2 つの口（終わりだけの撃ち直しと、着地の後の検出）・候補の木で先の便といっしょに既に着地した便も取り込みません。先端を読めない・分かれている（祖先かどうかを判じられないときを含みます）・取り込みの書き換えを git が断った（別の書きとの競合など）ときは、main も remote も動かさずに FR1010 の待ちになります。取り込みの後に、出発点（base）の前提（FR1010・追随は FR1034）を確かめ、揃った便について、main に載せる 1 つの commit の出ていく文字を、push の前と同じ公開の字面の走査で調べます。隣の private repo の識別子に当たる便と、読む上限を越える便は main に載せずに「失敗」と記録して止め、調べきれない便（規則の行が無い・解けない・締め切りを越えた）は main に載せずに理由を記録して待たせ、次の送り出しの周に同じ調べを撃ち直します（規則の行が持つ回数に達したら「失敗」で終わらせます）。どちらの場合も、候補の木に並べた便は、断った便より後ろの便も main に載せずに並びへ戻し、木を組み直して検査を撃ち直します。規則の行を off にしたときは調べません。通ったら、作業用 worktree の中身を 1 つの commit にまとめて main に載せ（中身が同一であることと、他の変更と競合しないことを確かめて）、main の上で検証を撃ち直します。落ちたら「失敗」と記録して止まります。"
    basis: []
    verify: {method: test, how: "器の歯で ac の欄の受入の基準を撃つ（器の確かめ方の字 T・test）", ac: [AC1001, AC1023, AC1089]}
    goals: [GOAL1001]
    figures: []
    note: "なぜ要るか: 自律安全のニーズ（GOAL1001）から来ています。main に載せた直後に検証を撃ち直すことで、「作業用の木では通ったが main では落ちる」を無人で検知します。載せる前に公開の字面の走査を撃つのは、断った commit が main に残って後の便の push まで止めないためです（FR1050）。着地の前に remote の main を取り込むのは、local の main が remote の main の先端より遅れたまま着地すると、終端の push が non-fast-forward で落ちて便が止まるためです（GOAL1001）。"
