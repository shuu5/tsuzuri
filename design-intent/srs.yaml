  - id: NFR1005
    title: "hook の予算"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "道具 1 回の呼出しにつき hook は binary 1 本の呼出し 2 回以内（hook の入口と host-guard の口）・各 2.0 秒以内・重い I/O を持たない。 turn の終わりの判定の hook と発話の記帳の hook の呼出しも各 2.0 秒以内で、 event log の大きさに依らない読みだけを持つ（FR1088・FR1090）。 host-guard の呼出しは git の問い合わせ 1 回まで。 ただし公開の segment（FR1080）の周の host-guard の呼出しだけは、 2.0 秒と git 1 回と重い I/O を持たないことに代えて、 git と gh の問い合わせ（GitHub への問いを含む）を数で縛らず、 出ていく字面を 8 MB まで読み、 全体を締め切り 6 秒で縛る（越えた周の扱いは FR1080）。 FR1011 と FR1050 の着地の段の走査も同じ読む上限と締め切りで縛る"
    plain: "道具 1 回の呼び出しにつき、器の binary を呼ぶのは 2 回まで（器の hook の入口と、口座の設定から呼ばれる見張り host-guard）で、1 回ごとに 2.0 秒以内に終わり、重い読み書きをしません。見張りが git に問い合わせるのは 1 回までです。turn の終わりの判定の hook と発話の記帳の hook の呼び出しも 1 回ごとに 2.0 秒以内に終わり、出来事の log が大きくなっても読む量は変わりません（test が測ります）。ただし公開の segment（FR1080）のときの見張りだけは、2.0 秒と git 1 回と重い読み書きをしないことの代わりに、git と gh への問い合わせ（GitHub への問いを含む）を回数で縛らず、出ていく文字を 8 MB まで読み、全体を 6 秒の締め切りで縛ります（越えたときに止めるのは FR1080）。hook の入口のかかった時間と、見張りが止めた回のかかった時間は注入計測の記録に残し、見張りが通した回の時間の上限と git の回数と公開の segment のときの締め切りは test が測ります。着地の段の走査（FR1011・FR1050）も同じ 8 MB と 6 秒で縛ります。"
    basis: []
    verify: {method: test, how: "hook の wall time と host-guard が断る周の wall time を注入計測の slot に記録し、 host-guard が通す周の時間の上限と git の子 process の回数と公開の segment の周の締め切りは歯が測る。 turn の終わりの判定の hook と発話の記帳の hook の読む byte が event log の大きさで変わらないことも歯が測る（AC1058・AC1060）", ac: [AC1007, AC1044, AC1050, AC1023, AC1058, AC1060]}
    goals: [GOAL1002]
    figures: []
    note: "分類: 応答。面の数字: 速さ・2.0 秒（hook の呼出し 1 回の上限（公開の segment を除く））。 器の非機能要件は EARS の型と強さの欄を持たないので、型 ubiquitous・強さ must・条件 常時 とした。"
  - id: NFR1006
    title: "host の資源"
    pattern: ubiquitous
    strength: must
    when: "常時"
    shall: "封じ込めの外で走る器の子 process 0 本・検証の行の並列度は並列の枠から"
    plain: "器が起こす子 process は、すべて封じ込めの箱の中で走らせます（箱の外で走る子 process は 0 本）。検証の行（変異検査と、gate と終わりの門の共通 verify・契約の verify の行）を何本同時に走らせるかは、host 全体の並列の枠から決めます。便ごとに、封じ込めの有無・並列度・縮退の理由が記録に残ることを fixture で確かめます。"
    basis: []
