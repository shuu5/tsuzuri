  置き換えられた: なし (現行)
  ADR-1045 §2 (2) の部分 supersede。 戻す機構は管理 tick (seat tick・判定の列は前の器の順から退避物・context・cycle・hook 集合の 4 条件を除き口座の門は残した形)・打刻の合図 (合図の backoff を含む)・tick の unit (seat tick install / uninstall) の 3 つで、 それに伴い §2 (2) が名指した「席の状態の打刻のうち読み手が消えるもの (Busy / Idle)」の項も部分 supersede し (打刻は現物に残っており、 tick がその読み手として戻る = ADR-1015 §2.1 / §2.3 がそのまま効く)、 rules 行は seat.tick_stale_s (初段の待ち・黙りの閾値・Busy の古さの 3 役)・seat.pointer_backoff_factor・seat.pointer_backoff_max_s の 3 本が戻り、 seat.tick_interval_s (ADR-1030 §2.2 の決定を初めて land する) が新設される。 ADR-1045 が §2 (2) で消した残り (作業記憶の退避・復元・消費、 直命の表と現在地の DATA、 context の計測と cap guard、 cycle と強制 cycle、 退避の合図、 tick-stamp の file、 席が自分で打つ生存の判子の口と file、 statusline、 席間の連絡、 hook 集合の食い違いによる作り直し、 skill、 他の rules 行) と、 §2 (1) の役割・§2 (3) の注入・§2 (4) の残すもの・§2 (5) の順序は不変。 ADR-1030 (tick の unit) は superseded のままで、 本 ADR がその §2.1〜§2.5 の形を pointer で写して戻す。 ADR-1055 (群の逼迫は timer を持たず便の終端の周と席の hook で測る) の決定は不変で、 本 ADR の tick は逼迫を測らない (ADR-1055 が「管理 tick の廃止は不変」と書いた前提の記述だけが古くなる)。 ADR-1034 / FR1068 の dispatcher の契機 (周期の timer を持たない) は不変。 ADR-1056 の配線 (口座の設定 file の hook 行) は本 ADR に関わらない。 発効は SRS の改訂と rules 行の裁定 id の後で、 それまで系譜上は現行 (current) でも proposed のまま何も拘束しない。
  照会終端 — PRIN-THE-VESSEL-PROMPTS-AT-THE-PACE-OF-CHANGE
  席を促すのは器で、 促す頻度は席の変化で決まり、 変化が無ければ打ち切る。 席に自分を起こさせず、 便の周に相乗りさせず、 固定の間隔で叩き続けもしない。
  本 ADR が dispatcher への相乗り・席の自己判断・固定間隔・何もしない案を退け、 backoff つきの管理 tick を器に戻したのはこの原則に行き着く (これ以上は遡らない照会終端)。
options:
  - id: "OPT1"
    name: "管理 tick を backoff つきで戻す — unit は器が導出し、 変化は hook の打刻で測り、 無変化なら間隔を伸ばして待ちが 24 時間を超えたら送らない"
    text: |
      器の subcommand seat tick を戻し、 判定の列は前の器の順から退避物・context・cycle・hook 集合の 4 条件を除き口座の門は残した形 (登録 row の門 → 状態の打刻 → 変化の digest の比較 → 黙りの門 → 上限の判定 → 床 → 口座の門 → 入力欄の門 → 記録を書く → 注入)。 合図を送るのは、 席が最後の打刻から 40 分以上黙っている ∧ 最後の合図から今の段の待ちが経った ∧ 口座が FR1038 の閾値を越えていない (記録が無い・古い周は通す) 周だけ。 変化の digest は席の状態の打刻の最終行の時刻の 1 値。 合図を送る周は梯子の記録 1 行を注入の前に書き (書けない周は送らない)、 席が応えて Idle に戻った周の digest を基準にし、 以後は無変化なら段を登って待ちを倍にし、 待ちが 24 時間を超える段は送らず、 変化で段 0 に戻す。 床の出所も梯子の記録で、 記録が無い周は初段として送り、 読めない周は送らない。 unit は ADR-1030 の形で器が導出して host へ書き、 rules 行 4 本 (間隔・初段の待ち・係数・上限) が値を持つ。
      （平易）見回りを、 無駄に動かない形で器に戻す案です。 器の口 1 つが 1 分ごとに席を見て、 席の登録・席が押した判子・変化の比較・黙りの門・上限の判定・最後の合図からの待ち・口座の門・入力欄、 の順に条件を確かめ、 全部そろったときだけ記録を 1 行書いてから続きを促す 1 行を差し入れます。 送るのは、 席が最後の判子から 40 分以上黙っていて、 最後の合図から今の待ち以上たち、 口座が閾値を越えていないときです。 席に変化があったかは、 判子の最終行の時刻だけで測ります。 「間隔の列と最後に送った時刻の記録」が書けなければ送らず、 比べる基準は席が応え終わった時点の判子の時刻に取り、 以後は変化が無ければ次の合図までの待ちを倍にし (80 → 160 → 320 → 640 → 1,280 分)、 その次の待ち (2,560 分) が 24 時間を超えるので送りません。 合図は最大 6 本で、 最後は最初からおよそ 41 時間後です。 打ち切った後も毎回測り、 席が変化すれば待ちを最短 (40 分) に戻し、 次の合図は席がまた 40 分黙ってから送ります。 周期を作る host の登録は器が組んで書き、 値は規則の行 4 本が持ちます。 代わりに、 host に timer が戻り、 規則の行 3 本が戻って 1 本が増え、 記録 file が 1 つ増え、 要件書の改訂が要り、 合図に応えない席への合図も最大 6 本で打ち切られます。
      利点: 器を使う他の project でも、 席が黙れば器が続きを促す (DR1)
      利点: 席の turn を消費するのは変化の周だけで、 無変化の席への合図は最大 6 本 (最後は初回から約 41 時間後) で打ち切られる (DR2)
      利点: 判定入力は打刻の時刻だけで、 pane の字面も台帳も読まない (DR4)。 unit の導出と値の置き場は決定済みの形の再利用 (DR5)
      欠点: host に timer が戻り、 systemd user session の無い host では効かない
      欠点: rules 行 3 本が戻り 1 本を新設し、 席の置き場に梯子の記録 1 file を足す。 SRS の FR1027 / FR1038 / FR1043 / FR1044 / FR1064 の改訂と AC1018 の不在の歯の書き換えが要る (user の手番)
      欠点: 送った合図が入力欄に残ったまま消費されない・席が固まっている周は梯子が登る側に倒すので、 本当に黙っている席への合図も最大 6 本で打ち切られる (打ち切りは判定行と doctor から人が拾う)
    verdict: adopted
    reason: "器の subcommand seat tick を戻し、 判定の列は前の器の順から退避物・context・cycle・hook 集合の 4 条件を除き口座の門は残した形 (登録 row の門 → 状態の打刻 → 変化の digest の比較 → 黙りの門 → 上限の判定 → 床 → 口座の門 → 入力欄の門 → 記録を書く → 注入)。 合図を送るのは、 席が最後の打刻から 40 分以上黙っている ∧ 最後の合図から今の段の待ちが経った ∧ 口座が FR1038 の閾値を越えていない (記録が無い・古い周は通す) 周だけ。 変化の digest は席の状態の打刻の最終行の時刻の 1 値。 合図を送る周は梯子の記録 1 行を注入の前に書き (書けない周は送らない)、 席が応えて Idle に戻った周の digest を基準にし、 以後は無変化なら段を登って待ちを倍にし、 待ちが 24 時間を超える段は送らず、 変化で段 0 に戻す。 床の出所も梯子の記録で、 記録が無い周は初段として送り、 読めない周は送らない。 unit は ADR-1030 の形で器が導出して host へ書き、 rules 行 4 本 (間隔・初段の待ち・係数・上限) が値を持つ。"
  - id: "OPT2"
    name: "dispatcher の周に相乗りし、 timer を持たない"
    text: |
      便の終端の周 (dispatch の 1 周) に席の変化の判定を足し、 黙った席へ合図を出す。 ADR-1055 が群の逼迫で選んだ形と同じ。 決め手は分析 (黙った席では便も流れない)。
      （平易）作業が 1 つ終わったときの周 (dispatcher の 1 周) に、 席が黙っていないかの判定を相乗りさせ、 timer を持たない案です。 判定は足しますが timer も host の登録も戻さず、 この repo のように作業が絶えず流れる場所では席は作業のたびに促されます。 けれども器を使う他の project では、 席が黙ると作業も流れず、 契機そのものが来ません。 つまり user が決めた状況に効きません。 決め手は分析です。
      利点: timer も unit も戻さず、 既存の契機 1 つに判定を足すだけで済む (判定は足すが timer は足さない・DR3・DR5)
      利点: 本 repo では便が絶えず流れるので、 席は便の終端ごとに促される
      欠点: 器を使う他の project で席が黙ると便も流れず、 契機が来ない = 裁定の状況そのものに効かない (DR1)
      欠点: 席の変化の判定を便の周に載せると、 dispatcher の 1 周の仕事が増え、 便が無い周の挙動が周ごとに変わる
    verdict: rejected
    reason: "決め手は分析 (黙った席では便も流れない)。"
  - id: "OPT3"
    name: "席 (AI) に自分で heartbeat を打たせ、 器は測らない"
    text: |
      席が自分の判断で周期的に生存の判子を打ち、 続きを進めるかを自分で決める。 器は促さない。 決め手は分析 (席を起こす行為自体が消費で、 黙った席は自分を起こせない)。
      （平易）席 (AI) に、 自分の判断で周期的に生存の判子を打たせ、 器は測らない案です。 器に timer も記録も 1 つも足さず、 席が文脈を見て「いま続けるべきか」を判断できる利点があります。 けれども黙った席は自分を起こせないので、 user が決めた状況に効きません。 起きている席に判断させれば、 その判断の手番自体が消費になります。 「変化が無いか」の判断が席の自由な文章と記憶に置かれ、 機械が測る値になりません。 決め手は分析です。
      利点: 器に timer・unit・記録を 1 つも足さない (DR3)
      利点: 席が文脈を見て「いま続けるべきか」を判断できる
      欠点: 黙った席は自分を起こせない = 裁定の状況に効かない (DR1)。 起きている席に判断させれば、 判断の turn 自体が消費になる (DR2)
      欠点: 「変化が無いか」の判断が席の自由文と記憶に置かれ、 機械の判定入力にならない (DR4・N2)
    verdict: rejected
    reason: "決め手は分析 (席を起こす行為自体が消費で、 黙った席は自分を起こせない)。"
  - id: "OPT4"
    name: "固定間隔で無期限に合図を送る (前の器の床だけの形)"
    text: |
      前の合図から初段の待ちを過ぎたら、 席の変化に関わらず同じ合図を送り続ける。 決め手は裁定 (無変化なら伸ばして打ち切ることが条件)。
      （平易）前の合図から 40 分たったら、 席の変化に関わらず同じ合図を送り続ける案です (前の器が最初に持っていた形)。 実装が最も小さく、 記録も倍率も上限も要らず、 本当に黙っている席にも合図が届き続けます。 けれども承認待ちのように変化の無い席に同じ合図が送られ続け、 受けるたびに 1 手番を消費します。 前の器の実測では、 席は約 30 本の合図を受けました (器の記録は 12 件・差は未解明)。 user の決定の条件 (無変化なら伸ばして打ち切る) に反します。 決め手は user の決定です。
      利点: 実装が最も小さく、 梯子の記録も係数と上限の行も要らない
      利点: 本当に黙っている席にも合図が届き続け、 打ち切られない
      欠点: 承認待ちなどで無変化の席に同じ合図が送られ続け、 受けるたびに 1 turn を消費する (前の器の実測・CTX3・DR2)。 裁定の条件に反する
    verdict: rejected
    reason: "決め手は裁定 (無変化なら伸ばして打ち切ることが条件)。"
  - id: "OPT5"
    name: "何もしない (ADR-1045 のまま・席は人が促す)"
    text: |
      管理 tick を戻さず、 黙った席は user が対話面で促す (いまの FR1043 の形)。 決め手は裁定 (heartbeat は要ると覆った)。
      （平易）何もせず、 黙った席は人が対話の画面で促す案です (いまの要件書の形)。 器に何も足さず、 要件書も規則の行も動かず、 この repo では作業の終わりの通知で足りています。 けれども器を使う他の project では席が黙ったままになり、 人が気づいて促すまで進みません。 決め手は user の決定 (heartbeat は要る、 と覆った) です。
      利点: 器に何も足さず、 SRS も rules 行も動かない (DR3)
      利点: 本 repo では便の終端の通知で足りている
      欠点: 器を使う他の project では席が黙ったままになり、 人が気づいて促すまで進まない (DR1・C9)
    verdict: rejected
    reason: "決め手は裁定 (heartbeat は要ると覆った)。"
