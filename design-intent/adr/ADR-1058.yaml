  器の案の章の要約: 候補を 5 つ並べます。 見回りを「待ちを伸ばして打ち切る形」で戻す案、 作業が終わったときの周に相乗りして timer を持たない案、 席 (AI) に自分で heartbeat を打たせて器は測らない案、 固定の間隔で無期限に合図を送る案、 何もしない案です。 却下した 4 案にも利点を並べ、 退けた決め手が user の決定か分析かを各案に書きます。 相乗りの案は、 判定は足すものの timer と host の登録を足さない点で選んだ案に勝ちます。 席に打たせる案と何もしない案は、 器に仕組みを 1 つも足さない点で勝ちます。 固定間隔の案は、 本当に黙っている席にも合図が届き続ける点で勝ちます。 前の器が退けた 2 つの形 (席に判断させる・固定回数で中断) は前の設計の §14 で却下済みなので、 ここでは比べ直しません。
  器の専門語の説明: 本文に出てくる専門語 22 個を、 やさしい言葉で説明します。 この記録で意味を決めた語は「heartbeat」「backoff」「変化の digest」の 3 つで、 残りは器の側の言葉です。
  ・heartbeat（heartbeat）: 本 ADR での管理 tick の呼び名 (席を促す見回り)。 user の裁定はこの語で管理 tick を指す。 前の器に在った、 席が自分で打つ生存の判子の口と file はこの語で呼ばず、 本 ADR では戻さない。
  ・管理 tick（management tick）: 席の外から周期 (1 分) で回り、 席が黙っていないかを見て、 条件が揃ったときだけ続きを促す 1 行を注入する仕組み。 見回り自体は席 (AI) を起こさず費用を持たない。 本 ADR で backoff つきで器に戻る。 前の器が持っていた退避の合図と cycle の駆動は戻さない。
  ・打刻の合図（continue signal）: 管理 tick が黙った席の入力欄に注入する、 席に続きを促す 1 行 (判子ではない。 判子は「状態の打刻」)。 台帳の現在地から続きを進めるよう促す。 席がこれに応え終わったことは Stop の打刻で測る。
  ・tick の unit（tick unit）: 管理 tick を席ごとに周期で撃つ host の systemd user の service と timer の対。 器の口 (seat tick install) が登録 row の target・置き場・binary・rules 行の間隔から 1 関数で導出して書き、 有効化まで撃つ。 撤去は退役 dir への移動 (ADR-1030 の形)。
  ・状態の打刻（state stamp）: 席の中で hook が state.jsonl へ append する 1 行 (state / event / ts / sid)。 UserPromptSubmit で Busy、 Stop と SessionStart で Idle。 管理 tick はこの最終行だけを席の状態と変化の出所にし、 pane の字面は読まない (ADR-1015)。
  ・席の状態（seat state）: 開発 session が turn を走らせているか (Busy) 応え終わって待っているか (Idle) の閉じた enum。 出所は状態の打刻で、 管理 tick は Idle の席にだけ合図を送る。
  ・backoff（backoff）: 同じ相手に同じ働きかけを繰り返すとき、 反応が無ければ次までの間隔を倍々に伸ばし、 上限で打ち切る形。 本 ADR では合図の間隔を初段 40 分から 2 倍ずつ伸ばし、 次の待ちが 24 時間を超える段で送らず、 席に変化があれば初段へ戻す。
  ・変化の digest（change digest）: 席に変化があったかを比べるための値 = 席の状態の打刻の最終行の時刻の 1 値。 読める形で梯子の記録に残し、 fleet の event log・context・台帳・pane の字面は入れない。
  ・開発 session（development session）: 設計・契約・review を行う AI の session (Claude Code)。 登録された席で動くときだけ権能を持ち、 実装は runner が便で行う。
  ・orchestrator（orchestrator）: 席の唯一の役割。 user と話し、 承認と裁定を受け取り、 契約・設計・落ちる歯を書く。 本 ADR の管理 tick が続きを促す相手はこの席である。
  ・dispatcher（dispatcher）: 台帳から起動の列を導き、 便の終端の直後・便を運ぶ process の退役・手動の 1 周・介入の印の直後・回答と承認の記帳の直後に便を起こし、 着地させる器の口。 周期の timer を持たず、 本 ADR でも変えない。
  ・rules 行（rules row）: 規則の値を 1 つ持つ行。 器の規則の manifest (repo 内の 1 file・build 時に binary へ埋め込む) に置き、 id・種類・値・enabled・裁定 id・裁定日を持つ (憲法 C1)。 本 ADR で 3 本が戻り 1 本が新設される (梯子の記録 1 file は新たに足す)。
  ・裁定 id（ruling id）: その値を user が決めたことを指す印。 rules 行が持ち、 裁定 id の無い rules 行の変更は C5 の CI が落とす。
  ・state dir（state directory）: 器が状態 (event log・席ごとの打刻・注入の記録) を置く dir。 差し替えは CLI 引数だけで行い、 env は読まない。 本 ADR の梯子の記録は席ごとの dir に 1 file 置く。
  ・導入先（consumer）: 本 repo 以外で器の plugin (hook の配線) と binary を積む project とその worktree。 本 ADR の裁定はここで席が黙ることから来た。
  ・doctor（doctor）: 器の状態を 1 度に照らし合わせて見せる命令。 本 ADR では登録 row のある席ごとに tick の unit の有無と一致を 1 語で出す。
  ・event log（event log）: 1 行 1 出来事を追記する file。 fleet の現在地はこれを replay して導く。 席の登録 row もここに在る。 本 ADR の変化の digest には入れない。
  ・退役（retirement）: 使わなくなったものを消さずに脇へ移すこと。 元に戻せる move で行う (憲法 N1)。 tick の unit の撤去はこれで行う。
  ・hook（hook）: 決まった瞬間に外の命令を自動で呼ぶ仕組み。 Claude Code の session は開始・話す番の直前・応え終わった直後などに設定された command を呼ぶ。 本 ADR ではその周に状態の打刻を書く。
  ・anchor（anchor）: 対象 repo の main checkout。 席の鍵の一部で、 1 つの anchor に orchestrator は 1 席。
  ・席の登録（seat registration）: 席の役割と anchor を鍵に、 target・口座 label・起動の雛形を項目として fleet の event log に記録すること。 本 ADR の tick はこの row のある席にだけ合図を送り、 unit もこの row のある席ごとに書く。
  ・3 クラス（three classes）: 憲法 A1 の 消す / 出す / 使う。 実行前に user の承認を対話面で取る。 tick の unit の有効化と撤去はどれにも当たらず、 器が自分で撃つ (ADR-1030 §2.4)。
  器の頁の末: このページは、大もとの機械データ (正本) から自動で組み立てられています。構造は機械が自動で検査し、内容が元データに忠実かは独立のレビューで確かめます。
