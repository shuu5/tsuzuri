# 判断の記録 ADR-1058 — 器 scribe2 の判断の記録 ADR-0058 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1058
title: "heartbeat (管理 tick) を器に戻す — 席が黙ったら器が続きを促し、 変化が無ければ合図の間隔を倍々に伸ばし、 待ちが 24 時間を超えたら送らない (ADR-1045 の一部を戻す)"
status: proposed
date: 2026-09-23
context: |
  席 (人と AI が話す session) が黙っても、 器を使う他の project では誰も続きを促さず、 席は止まったままになる。 本 ADR は、 席の外から周期で席を見て、 黙った席に続きを促す 1 行を差し入れる仕組み (heartbeat = 管理 tick) を器に戻す。 席に変化が無ければ合図の間隔を倍々に伸ばし (backoff)、 次の待ちが 24 時間を超える段では送らず、 席に変化があれば初段の待ちへ戻す。 前の決定 (ADR-1045) が消した仕組みのうち、 戻すのは管理 tick・続きを促す合図 (打刻の合図)・周期を作る host の登録 (tick の unit) の 3 つで、 他の仕組みは消したままにする (ADR-1045 の一部だけを置き換える = 部分 supersede)。 本 repo では、 便 (契約 1 本の 1 往復) が終わるたびに器が席の画面 (pane) へ知らせるので席が動き続け、 この仕組みが要らないように見えただけである。
  なぜこの判断が要るのかを、 user の決定と器の現物と前の器の形から説明します。 user は「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」という前の結論を覆し、 器を使う他の project では席が黙ったままになる、 と決めました。 条件は、 無駄に動き回らないこと、 つまり席に変化が無ければ合図の待ちを伸ばし、 24 時間まで伸びたら打ち切ることです。 前の決定で消えた code は git の履歴に残り、 いまの要件書は「持たない」と書いています。 一方で、 席が自分で押す判子 (状態の打刻) と、 席の画面へ 1 行を差し入れる経路は器に残っています。 前の器は、 待ちの長さだけで合図を止めていたので、 無変化の席に同じ合図が送られ続けました (席が受けたのは約 30 本・器の記録は 12 件・差は未解明)。 その実測から、 待ちを倍々に伸ばして打ち切る形を決めていました。 憲法は席の停止を器が検知して再開させることを求め、 仕組みを足すときは先に消すものを名指すことも求めます。 器を使う他の project の席は、 器の plugin の hook から判子を押しているので、 新しい配線は要りません。
  CTX1 裁定 — 器を使う他の project では席が黙ると止まる
  2026-09-23 の user 裁定は、 heartbeat（席を促す見回りの呼び名） (管理 tick（席を周期で見る仕組み）) は要らないという前の結論を覆した。 本 repo では要望が縦に連なり、 便が終わるたびに dispatcher（便を起こす器の口） の周が席の pane へ通知を出すので、 席は続きを促されなくても動き続けた。 それで管理 tick が要らないように見えただけで、 器を使う他の project (導入先（器を使う他の repo）) では、 席が黙ると続きを促す機構が無く、 席は黙ったままになる。 裁定の条件は、 無駄に動き回らないこと = 席に変化が無ければ合図の間隔を徐々に伸ばし、 間隔が 24 時間に達したら合図を打ち切ること、 である (本 ADR はこれを「次の待ちが 24 時間を超える段では送らない」と読む)。 逐語は非公開の作業記録簿 (台帳 s2-07l.580 の本文) に在る。
  CTX2 現物 — ADR-1045 で消えたものと、 器に残っているもの
  ADR-1045 §2 (2) (user 裁定 2026-09-18) は、 席の自律機能ごと管理 tick・打刻の合図の注入・合図の backoff（間隔を倍々に伸ばす形）・tick の unit・tick-stamp の file を削除し、 席の状態（動いているか待っているか）の打刻（席が押す判子）のうち読み手が消えるもの (UserPromptSubmit / Stop の Busy / Idle) も削除の対象に名指した。 削除の直前の code は git の履歴に在り、 rules 行（裁定つきの規則の行） seat.tick_stale_s / seat.signal_backoff_s / seat.pointer_backoff_factor / seat.pointer_backoff_max_s も manifest から消えた。 ADR-1030 が決めた unit の口 (seat tick install / uninstall) と間隔の行 seat.tick_interval_s は、 削除の直前の現物にも無い (決定は在ったが land せず、 器を使う project の unit は人が手で書いていた)。 いまの SRS (v0.20) は FR1027 (管理 tick を持たない)・FR1043 (続きの pointer を注入しない)・FR1064 (tick の unit（周期を作る host の登録） の口を持たない)・FR1044 (入力欄への合図の注入を持たない・差し込みは席の起動の起動行だけ) が「持たない」を要求し、 AC1018 の不在を測る歯がそれを確かめる。 一方で器に残っているものが在る。 席の状態の打刻 (hook（決まった瞬間に動く口） が UserPromptSubmit / Stop / SessionStart の周に state.jsonl へ 1 行を append する・ADR-1015) は 3 つとも現物に在るが、 最終行を席の状態として読む型は消えている。 席の pane へ 1 行を注入する経路 (入力欄の門・器自身の目印との一致で通す) は、 便の終端の pane 通知・群の逼迫の通知 (ADR-1055)・席の起こし直しが使うので在る。 systemctl は便の閉じ込めの scope の片付けで既に撃っており、 unit を reload / enable する口だけが無い。
  CTX3 前の器の backoff の形 (削除前の最後の版・user 裁定 2026-09-17)
  前の器の合図の brake は時間だけ (前の合図から seat.tick_stale_s 未満なら送らない) で、 席の状態が変わったかを見なかった。 器を使う別の project の実測 (台帳 s2-07l.423・2026-09-17) では、 承認待ちで無変化の席に同じ合図が約 6 時間送られ続け、 席が受けた合図は約 30 本、 器の注入の記録は 12 件で、 差は前の器では未解明のままである。 合図を受けるたびに席は 1 turn (1 手番) を消費した。 tick の周期は刻みが細かくても token を消費しない = 消費するのは合図に応える席の turn だけである。 user 裁定 2026-09-17T00:55Z (逐語は台帳 s2-07l.423 の notes) は、 tick は 1 分・合図は初段 40 分・無変化なら間隔を伸ばして最後は止める、 と定めた。 前の器の設計 (削除前の最後の版の §14) の形は次のとおり。 (1) 変化の digest（席が動いたかの目印） は 2 値 = 席の状態の打刻の最終行の ts と、 置き場の fleet の event log（出来事の記録 file） の最終行の ts。 context は入れない (合図に応える turn ごとに増えるので無変化の席でも毎回変わる)。 台帳は読まない (毎周 bd を子 process で撃つ費用を tick に持ち込まない・台帳の動きは席の turn になって状態の打刻に現れる)。 (2) 合図を送った周は席の置き場に梯子の記録 1 行 (送った時刻 sent_at・段 step・基準の digest) を書くが、 送った周の digest は基準にしない (合図に応える席の turn が状態の打刻を必ず 1 行進めるので、 それと比べると毎回「変化あり」になり梯子が登らない)。 基準は席が合図に応えて Idle に戻った最初の周に取る (settle)。 settle しないまま初段の待ちを過ぎた周は、 その周の digest を基準にする (応えない席へは梯子が登る側に倒す)。 (3) 以後の周は基準と今の digest を比べ、 違えば段 0 (待ち = 初段 40 分)、 同じなら段 + 1 で待ち = 初段 × 係数 ^ 段 (sent_at から測る)。 待ちが上限 (86,400 秒) を超える段は送らない。 (4) 打ち切りの後も毎周 digest を測り、 変化した周に段 0 へ戻して送る。 (5) 最後の合図からの待ちは tick-stamp の mtime から測り (初段の待ちを下限として先に効かせた)、 梯子の記録とは別の file だった。 登録 row の口座の使用率が閾値以上・測れない周は送らない口座の軸も列に在った (本 ADR は測れない周を通す側に変える)。 (6) rules 行は係数 (2) と上限の秒 (86400) を足し、 初段は seat.tick_stale_s (2,400 秒) を流用した。 §14 で却下済みの形は、 席 (AI) に「変化が無ければ heartbeat を打たない」と判断させる形 (席を起こす行為自体が合図の消費・自由文を判定入力にする) と、 固定の「3 回無変化で中断」(応答に依存して永久停止しうる) で、 本 ADR は比べ直さない。
  CTX4 憲法と既存の決定の向き (本 ADR の解釈)
  C9 (席の停止の検知と再開) は席の停止の検知と再開を器に求める。 ADR-1045 は席 (orchestrator（人と話す唯一の席） 1 席) の面を「人と話す席は人が起こす」と解釈し、 便の側は dispatcher の起こし直しが担うとした。 本 ADR は、 席の面のうち「黙った席に続きを促す」だけを器へ戻し、 席の作り直し (cycle) は戻さない。 C2.2 (env を読まない) / C3 (状態は 1 つの置き場) は設定と状態の置き場を manifest と 1 つの DB に限る。 本 ADR が足す file は席の置き場 (state dir（器の状態の置き場） の既存の席の dir) の梯子の記録 1 つだけで、 tick-stamp と席が自分で打つ生存の判子の file は戻さず、 rules 行の値は manifest に、 host 固有の値 (unit dir・binary) は引数にだけ置く (C1 規則は manifest の行 / N3 host 固有の分岐を持たない)。 SRS の上位要求 GOAL1002 (無駄な消費は害) は、 席の turn を消費する合図を無変化の席へ繰り返さないことを求める。 C17.2 (足す前に消すものを名指す) に対して本 ADR が足すのは、 tick の判定・梯子の記録・unit の導出・rules 行 4 本・unit による毎分の走査 (AI を起こさない・費用は無視できる)・口座の使用率の読み (既存の読み手の再利用) で、 いまの器から消すものは 0 である。 本 ADR は消した機構の縮小版を戻す側なので、 戻さない範囲 (前の器の判定条件のうち退避物・context・cycle・hook 集合の 4 条件と、 席が自分で打つ生存の判子の file と口) を名指すことで C17.2 を満たすと解釈する。 ADR-1015 (席の状態は hook の打刻) は席の状態を hook の打刻で持ち、 pane の字面を判定入力にしない (C3.3)。 ADR-1045 は Busy / Idle の打刻を「読み手が消える分」として部分 supersede したが、 打刻は現物に残っており、 本 ADR で tick がその読み手として戻り、 ADR-1015 §2.3 (打刻が無い・読めない・Busy が古い周は注入しない・古さの閾値は seat.tick_stale_s) がそのまま効く。 ADR-1030 (tick の unit は器が書く) は unit を器が 1 関数で導出して host へ書き、 有効化を 3 クラス非該当と読む形を決めた (ADR-1045 で丸ごと superseded)。 本 ADR はその形を pointer で写して戻す (ADR-1030 の状態は superseded のまま)。 ADR-1055 (群の逼迫は時計で測らない) は群の逼迫を timer で測らず便の終端の周と席の hook で測ると決め、 管理 tick の廃止は不変と書いた。 「時計で測らない」の前提は群の逼迫の計測についてのもので、 本 ADR の tick の timer は逼迫を測らないので、 その決定は崩れない (「管理 tick の廃止は不変」と書いた記述だけが本 ADR で古くなる)。 ADR-1055 CTX2 が 2026-09-22 に据え置きと書く「拍」(host の timer 1 本が dispatch の 1 周を撃つ案) は便の契機の話で、 席を促す tick とは目的が違うので選択肢に並べない。 ADR-1034 / FR1068 の dispatcher は周期の timer を持たず、 本 ADR はこれも変えない。 C11 (判定は閉じた enum) は判定を閉じた enum で持つことを、 C13 (依存を足さない) は依存を足さないこと (systemctl は host の道具・git / tmux と同種) を求める。
  CTX5 器を使う他の project の配線
  器を使う project (導入先) の席は、 host の面 (host.toml) の [[plugin]] が名指す器の plugin dir を起動行に積み、 その plugin の hooks.json が UserPromptSubmit / Stop / SessionStart の周に器の hook を呼んで状態の打刻を書く (ADR-1026 / ADR-1028)。 席の登録（席の記録 row） row (役割・target・anchor（席が仕える repo）・口座) は fleet の event log に在り、 tick の unit の母集団はこの登録 row である (ADR-1030 §2.5・FR1040)。 unit は host の systemd user の unit dir に器が書き、 その host の doctor（器の健康診断） が席ごとに unit の有無と一致を名指す。 口座の設定 file の hook 行 (ADR-1056 の配線) はここでは要らない = 打刻は器の plugin の hook が既に書いている。
  （選択肢を測るものさし）この判断を評価する 5 本のものさしです。 黙った席を器が続きへ促すこと、 無駄に動かないこと (席の手番を使うのは変化があったときだけ。 毎分の見回り自体は AI を起こさず費用がかかりません)、 戻す仕組みは 3 つだけにすること、 席の変化は判子で測って画面の文字を読まないこと、 そして周期は host の timer で作り、 その登録は器が組んで書くことです。 向き (heartbeat を戻す・無変化なら伸ばして打ち切る) は 2026-09-23 の user の決定で決まっており、 ここで比べるのはその形です。
  DR1｜黙った席を続きへ促す — 器を使う他の project でも、 席が黙ったら器が席の外から続きを促し、 人が気づいて促す必要を無くす (憲法 C9 の席の面) CTX1 (裁定)・憲法 C9 (席の停止の検知と再開)
  DR2｜無駄に動かない — 席の turn を消費するのは変化があった周だけ。 無変化なら合図の間隔を倍々に伸ばし、 次の待ちが 24 時間を超える段では送らず、 変化で初段へ戻す。 毎分の見回り自体は席 (AI) を起こさず費用を持たない CTX1 (裁定の条件)・CTX3 (無変化の席に合図が送られ続けた実測)・SRS の上位要求 GOAL1002 (消費は害)
  DR3｜戻すのは 3 つだけ — 管理 tick・打刻の合図・tick の unit に閉じ、 ADR-1045 が消した残りは消したままにし、 状態の置き場と rules 行を最小に保つ (増殖の防止) CTX2・CTX4 (C17.2 / C2.2 / C3)・憲法の順位 2 位 (増殖の防止)
  DR4｜席の変化は hook の打刻で測り、 pane の字面と自由文を判定入力にしない CTX4 (ADR-1015・C3.3)・CTX3 (digest の材料)
  DR5｜周期は host の systemd user の timer で作り、 unit は器が 1 関数で導出して書く。 host 固有の値は引数だけで、 env と home は読まない CTX4 (ADR-1030・C2.2・N3)・CTX5
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 見回りを器の口 1 つで戻し、 判定は前の器の順を土台に、 退避物・文脈の量・作り直し・hook の食い違いの 4 条件を除き、 口座の門は残した列 = 「席の登録 → 判子 → 変化の比較 → 黙りの門 → 上限の判定 → 最後の合図からの待ち → 口座の門 → 入力欄 → 記録を書く → 差し入れ」に固定します。 合図を送るのは、 席が最後の判子から 40 分以上黙っていて、 最後の合図から今の待ちがたち、 口座が閾値を越えていない見回りだけです (口座の残りは既にある記録の最新値を読むだけで、 測り直しはせず、 記録が無い・古いときは通します)。 席の変化は、 判子の最終行の時刻だけで測ります。 合図を送る前に「間隔の列と最後に送った時刻の記録」(梯子の記録) を 1 行書き (書けなければ送りません)、 比べる基準は席が応え終わった時点の判子の時刻に取り、 以後は無変化なら次の待ちを倍にし、 待ちが 24 時間を超える段では送らず、 変化があれば待ちは最短に戻ります。 周期を作る host の登録は、 前に決めた形 (ADR-1030) のまま器が組んで書きます。 値は規則の行 4 本 (周期・最短の待ち・倍率・上限) が持ちます。 要件書の 5 本 (FR1027・FR1038・FR1043・FR1044・FR1064) は「持たない」から「待ちを伸ばして打ち切る形で持つ」へ改訂する根拠になり、 席の登録 (FR1040) の記録をそのまま読みます。 群の残りの通知と移動 (FR1038) は変えず、 「見回りは持たない」の句だけ外します。
  採用 — OPT1
  器 SHALL 管理 tick を subcommand seat tick 1 つで戻し、 打刻の合図（続きを促す 1 行）と、 tick の unit を器が導出して host へ書く口 (seat tick install / uninstall) を戻す。 戻す機構はこの 3 つで、 それに伴い状態の打刻の読み手の役 (ADR-1015 §2.3) と rules 行 seat.tick_stale_s の 3 役 (初段の待ち・黙りの閾値・Busy の古さ) が戻り、 seat.tick_interval_s は新設する。 ADR-1045 が消した他の機構・tick-stamp の file・席が自分で打つ生存の判子の file と口 SHALL NOT 戻さない。 tick の判定 SHALL 前の器の順から退避物・context・cycle・hook 集合の 4 条件を除き口座の門は残した順序固定の列 = 登録 row の門 → 状態の打刻 (無い・読めない・Busy・Busy が seat.tick_stale_s より古い周は注入しない) → 変化の digest の比較 (比べる基準を取る settle) → 黙りの門 (最後の打刻から seat.tick_stale_s 未満なら送らず理由 1 語) → 上限の判定 (次の待ちが上限を超える段なら stopped) → 床 (最後の合図から今の段の待ちが経ったか) → 口座の門 (FR1038 の閾値の rules 行のいずれか以上の口座の席には送らず理由 1 語・FR1033 の記録の最新値だけを読み計測は起こさず・記録が無い・古い周は通す) → 入力欄の門 → 記録を書く → 注入、 の順に評価し、 最初に立たなかった条件を閉じた enum の理由にする (値の名は設計 doc が決める)。 変化の digest SHALL 席の状態の打刻の最終行の時刻の 1 値とし、 fleet の event log・context・台帳・pane の字面 SHALL NOT 材料にしない。 backoff の梯子 SHALL 合図を送る周に席の置き場へ梯子の記録 1 行 (送った時刻 sent_at・段 step・基準の digest) を注入の前に書き、 書けない周は送らず判定行に理由を出す (fail-closed)。 注入 (入力欄への書き込みと Enter) が落ちた周も記録は残し送ったと数える (best-effort・次の段で再送)。 基準は席が合図に応えて Idle に戻った最初の周の digest に取り (初段の待ちを過ぎても応えない周はその周の digest)、 以後の周は基準と今の digest が違えば段 0、 同じなら記録の段 + 1 とし (段を記録に進めるのは送った周だけ)、 待ち = 初段 × 係数 ^ 段 を sent_at から測り、 待ちが上限を超える段は送らない。 打ち切りの後も毎周 digest を測り、 席が変化すれば段を初段へ戻し、 次の合図は席がまた 40 分黙ってから送る。 床の出所 SHALL 梯子の記録の sent_at だけとし、 記録が無い周は初段として送って記録を作り、 読めない周は送らず理由を出す。 値 SHALL rules 行 4 本 (間隔 60 秒・初段の待ち 2,400 秒・係数 2・上限 86,400 秒・裁定 id つき) が持ち、 host の面と env SHALL NOT 読まない。 打刻の合図 SHALL 台帳の現在地から続きを進めるよう促す 1 行 (器自身の目印つき) を既存の注入の経路で注入し、 席の応答 SHALL Stop の打刻で測る。 tick の unit SHALL ADR-1030 §2.1〜§2.5 と同じ形 (導出・引数・書き・3 クラス非該当の有効化・退役 dir への撤去・doctor の語) とする。 判定行 SHALL 既存の注入の記録に pointer の語 (sent / settling / wait / stopped) と段を足す。 群の逼迫の計測 (ADR-1055) と便の起動の契機 (FR1068) SHALL 不変で、 tick に載せない。 SRS の FR1027 / FR1038 / FR1043 / FR1044 / FR1064 と AC1018 は user が /folio-architect で改訂し、 本 ADR SHALL その改訂と rules 行の裁定 id（user の決定を指す印） の後に発効し、 それまで何も拘束しない。
  （平易）見回り (管理 tick) を、 器の口 1 つで戻します。 一緒に戻すのは、 続きを促す 1 行 (判子ではありません) と、 周期を作る host の登録を器が組んで書く口で、 戻す仕組みはこの 3 つです。 それに伴い、 席が押す判子を読む役と、 判子の古さと最短の待ちと黙りの長さの 3 つに使う閾値が戻り、 周期の値は新しく置きます。 前の決定が消した残り (記憶の退避と復元、 文脈の量の計測と上限の見張り、 強制の作り直し、 退避を促す合図、 画面の下の 1 行、 席どうしの連絡、 hook の食い違いの検知、 直命の表と現在地の DATA、 skill、 他の規則の行、 前の器の見回りが打っていた印の file、 席が自分で打つ生存の判子の file と口) は戻しません。 判定の順序は前の器の順を土台に、 退避物・文脈の量・作り直し・hook の食い違いの 4 条件を除き、 口座の門は残した列で固定です。 席の登録が在るか、 判子の最終行が「応え終わって待っている」か (判子が無い・読めない・「動いている」・「動いている」のまま古い席には差し入れない)、 変化の比較、 黙りの門 (最後の判子から 40 分未満なら送らない)、 上限の判定 (次の待ちが 24 時間を超える段なら打ち切り)、 最後の合図から今の待ちがたったか、 口座の門 (閾値を越えた口座の席には送らない。 口座の残りは既にある記録の最新値を読むだけで測り直さず、 記録が無い・古いときは通す)、 画面と入力欄が空いているか (人の文字が在れば送らず記録も書かない)、 記録を書く、 差し入れる、 の順で、 最初に満たさなかった条件を理由にします (理由の値の名は設計 doc が決めます)。 変化で待ちが最短に戻っても、 次の合図は席がまた 40 分黙ってからで、 対話の直後には届きません。 席の変化は判子の最終行の時刻だけで測り、 出来事の記録 file・文脈の量・台帳・画面の文字は使いません。 合図を送る前に、 席の置き場に「間隔の列と最後に送った時刻の記録」を 1 行 (送った時刻・何本目か・比べる基準) 書き、 書けなければ送らずに理由を出します。 差し入れ (入力欄への書き込みと Enter) が落ちても記録は残し、 送ったと数えて次の段で送り直します。 比べる基準は、 席が合図に応え終わって待ちに戻った最初の見回りの判子の時刻です (40 分たっても応えなければその時の値)。 以後の見回りでは、 基準と今の値が違えば最初の段に戻り、 同じなら記録の段の次の段とし (段を記録に進めるのは送ったときだけ)、 待ちは 40 分 × 2 の段乗、 待ちが 24 時間を超える段では送りません。 打ち切った後も毎回測り、 席が変化すれば最初の段に戻し、 次の合図は席がまた 40 分黙ってから送ります。 最後の合図からの待ちを測る出所もこの記録だけで、 記録が無ければ 1 本送って記録を作り、 記録が読めなければ送らずに理由を判定の行に出します (壊れた記録は人が直すまで合図が止まります)。 足す file はこの記録 1 つだけです。 値は規則の行 4 本 (周期 60 秒・最短の待ち 2,400 秒・倍率 2・上限 86,400 秒) が持ち、 machine ごとの設定や環境変数は読みません。 続きを促す 1 行は、 台帳の現在地から続きを進めるよう促す文で、 器の目印をつけて既存の差し入れの経路 (入力欄の門) から入れ、 席が応え終わったことは「待っている」の判子で測ります。 周期を作る host の登録は、 前に決めた形 (ADR-1030) のままです。 登録された席ごとに service と timer を器が 1 つの関数で組み、 置き場と実行 file と書き先は引数で受け、 途中の状態を残さず書き、 器が作ったのでない file は上書きも移動もせず、 有効化と撤去は人の承認を要さず、 撤去は退役の場所への移動で、 健康診断が席ごとに host の登録の有無と一致を 1 語で出します。 判定の行には、 合図の状態 (送った・基準待ち・待ち・打ち切り) と段を足します。 口座の残りを測る仕組み (ADR-1055) と便を起こす契機は変えず、 見回りに載せません。 要件書の 5 本と受入基準は user が改訂し、 この記録は改訂と規則の行の決定の印が揃ってから効きます。 それまでは何も拘束しません。
  （理由）器を使う他の project では、 席が黙ると誰も続きを促さず、 席は黙ったままになります。 席の外から周期で見て促す見回りを器に戻せば、 人が気づいて促す必要が無くなります。 毎分の見回り自体は席 (AI) を起こさないので費用がかかりません。 費用がかかるのは合図に応える席の 1 手番だけです。 前の器は待ちの長さだけで合図を止めていたので、 無変化の席に同じ合図が送られ続け、 席が受けるたびに 1 手番を消費しました。 だから合図の頻度は席の変化で決め、 変化が無ければ待ちを倍々に伸ばし、 24 時間を超えたら打ち切り、 変化があれば戻します。 席の変化を判子の時刻だけで測るのは、 画面の文字や自由な文章を判定に使わないという既存の決定 (ADR-1015) を守るためです。 文脈の量を入れないのは、 合図に応えるたびに増えて無変化の席でも毎回「変化あり」になるからで、 出来事の記録 file を入れないのは、 同じ置き場を使う他の repo の作業が流れただけでこの席の待ちが最短に戻ってしまうからです。 作業の終わりの通知をこの席が読んで動けば判子が進むので、 その場合は待ちが戻るのが正しい挙動です。 台帳を読まないのは、 毎回の子 process の費用を見回りに持ち込まないためで、 台帳の動きは席の手番になって判子に現れます。 合図を送ると、 席はそれに応えて必ず判子を 1 つ進めます。 送った時点と比べると毎回「変化あり」に見えて待ちが伸びないので、 席が応え終わった時点の判子の時刻を基準にして比べます。 待ちの出所を記録 1 つに寄せ、 記録を送る前に書いて書けなければ送らず、 読めない周も送らない側に倒すのは、 記録の書き損ねや読み違いで 1 分ごとに合図が出る事故を塞ぐためです。 合図を送るのを「席が 40 分黙っている」ときに限るのは、 対話の直後の席に続きを促さないためです。 口座の門を残すのは、 閾値を越えた口座の席を促しても手番が動かせず、 合図が無駄になるからです。 その門で測り直しをしないのは、 見回りを毎分回しても費用を持たせないためで、 記録が無い・古いときに通すのは、 届いても費用が無い合図を止める理由が無いからです。 戻す仕組みを 3 つに閉じるのは、 前の決定が消したものを増殖させないためで、 席が自分で打つ生存の判子の file と口を戻さないのは、 席が応え終わったことは既にある「待っている」の判子で測れ、 状態の置き場を増やさずに済むからです。 周期を作る host の登録を器が組むのは、 前に決めた形 (ADR-1030) をそのまま使え、 machine ごとの値を引数だけで受けて環境変数を読まずに済むからです。 相乗りの案は timer を足しませんが、 黙った席では作業も流れず契機が来ないので退けました。 席に自分で打たせる案は器に何も足しませんが、 黙った席は自分を起こせず、 起きている席の判断も消費になるので退けました。 固定間隔の案は本当に黙っている席にも届き続けますが、 user の決定の条件に反するので退けました。 何もしない案は、 器を使う他の project で席が黙ったままになるので退けました。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1027（rationale）: FR1027 は管理 tick とその間隔と backoff の rules 行を「持たない」と書く。 本 ADR はこれを「backoff つきで持つ」へ改訂する根拠 (器を使う他の project で席が黙る・無変化なら伸ばして打ち切る形) を与える。 改訂は /folio-architect の段で user が行う。
  FR1043（rationale）: FR1043 は続きの pointer を注入せず、 黙った席の続きは user が促すと書く。 本 ADR は、 続きを促す 1 行 (打刻の合図) を器が backoff つきで注入する形へ改訂する根拠を与える。 席が抱える次の仕事が台帳の現在値に在ることは不変で、 合図はそれを読んで続きを進めるよう促すだけである。
  FR1044（rationale）: FR1044 は入力欄への差し込みを席の起動の起動行に限る。 本 ADR は打刻の合図の注入 (既存の入力欄の門を通る) を差し込みに足す改訂の根拠を与える。 席間の連絡の経路を持たないことは不変である。
  FR1064（implementation）: FR1064 は tick の unit の導入と撤去の口を持たないと書く。 本 ADR は ADR-1030 §2.1〜§2.5 の形 (器が 1 関数で導出して host へ書き、 有効化まで撃ち、 撤去は退役（消さずに脇へ移す） dir への移動) の口を戻す実装の形を与える。 改訂は /folio-architect の段。
  FR1038（rationale）: FR1038 は群の逼迫の通知と移動を定め、 その文末で「管理 tick は持たない」と書く。 本 ADR はその句を外す改訂の根拠を与える。 tick は群の逼迫を測らず (計測は起こさず)、 FR1033 の記録の最新値を口座の門で読むだけで、 通知と移動の経路 (ADR-1055) は不変である。
  FR1040（rationale）: FR1040 は席の登録 row (役割と anchor を鍵に target・口座 label・雛形を持つ) を定める。 本 ADR の tick の unit の母集団と、 tick の判定の先頭の門は、 この登録 row である。 FR1040 の文面は変えず、 同じ row を読む理由 (登録の無い席へは注入せず unit も書かない) を与える。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 前の決定 (ADR-1045) のうち、 見回り・続きを促す合図・周期を作る host の登録の 3 つを消した部分と、 判子の読み手を消した部分だけを置き換え、 残りは変えません。 判子の決定 (ADR-1015) は読み手が戻るのでそのまま効き、 host の登録の決定 (ADR-1030) は置き換えられたままで、 その形をここから指して戻します。 口座の残りを作業の終わりと席の手番で測る決定 (ADR-1055) は、 見回りが口座の残りを測らないので崩れず (「見回りの廃止は変えない」と書いた前提の文だけが古くなります)、 便 (作業の 1 往復) を起こす仕組みに timer を持たない決定は変えません。 この記録は発効前 (proposed) で、 系譜の上では現行 (current) ですが、 要件書の改訂と規則の行の決定が揃うまで何も拘束しません。 原則は「促すのは器・頻度は変化で決まり・変化が無ければ打ち切る」です。
