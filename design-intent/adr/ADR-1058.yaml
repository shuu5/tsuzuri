retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「席」は人と AI が話す 1 つの session、 「heartbeat」は席の外から周期で席を見て、 黙った席に続きを促す 1 行を差し入れる見回り (管理 tick) のことです。 前の決定 (ADR-1045) はこの見回りを消しました。 この repo では作業が次々に流れ、 作業が 1 つ終わるたびに器が席へ知らせるので、 席は促されなくても動き続け、 見回りが要らないように見えたのです。 けれども器を使う他の project では、 席が黙ると続きを促すものが無く、 席は黙ったままになります。 この記録は、 見回りを「無駄に動かない形」で器に戻すことを決めます。 席に変化が無ければ次の合図までの待ちを倍々に伸ばし、 待ちが 24 時間を超えたらそれ以上は送りません (合図は最大 6 本・最後は最初からおよそ 41 時間後)。 席に変化があれば待ちは最短 (40 分) に戻り、 最後の合図から 40 分が過ぎていて席が 40 分黙っていれば次の合図が出ます。 戻すのは、 見回り・続きを促す合図・周期を作る host の登録の 3 つだけで、 前の決定が消した他の仕組みは消したままにします。
consequences:
  - "この判断で良くなることと、 代わりに引き受けることです。 器を使う他の project でも席が黙れば器が促し、 席の手番を使うのは変化があったときだけで、 無変化の席への合図は待ちが 24 時間を超えたら打ち切られます (最大 6 本・最後は最初からおよそ 41 時間後)。 戻す仕組みは 3 つに閉じ、 判定に画面の文字も台帳 (作業記録簿) も使いません。 代わりに引き受けることは 10 です。 host に timer が戻り、 systemd の無い host では動きません。 規則の行 3 本が戻り 1 本を新設し、 記録 file 1 つを足し、 要件書の改訂が user の手番で要ります。 判子が出なくなった席には届かないか合図が空回りし、 合図に応えない席への合図も最大 6 本で打ち切られます。 合図に応える 1 手番の消費は残り、 作業の終わりの通知を席が読んで動けば待ちは最短に戻ります。 入力欄に人の打ちかけの文字が在る見回りは差し入れが次へ送られ、 記録が壊れた席は人が直すまで合図が止まり、 黙った時間は席の最後の判子から測るので対話の直後には届かず、 届かなかった合図も送ったと数えて次の段で送り直し、 口座の門は口座の残りの記録の最新値だけを読むので、 記録が無い・古いときは閾値を越えた口座の席にも合図が届きます。"
  - "良い結果: 器を使う他の project でも、 席が黙れば器が席の外から続きを促し、 人が気づいて促す必要が無くなる"
  - "良い結果: 席の turn を消費するのは変化があった周だけになる。 無変化の席では、 最初の合図の後の待ちが 80 → 160 → 320 → 640 → 1,280 分と伸び、 その次の待ち (2,560 分) が 24 時間を超えるので送らない = 合図は最大 6 本で、 最後は初回から約 41 時間後。 変化があれば段 0 に戻り、 最後の合図から 40 分が過ぎ、 席が 40 分黙り、 口座の門を通れば次の合図が出る"
  - "良い結果: 戻す機構が 3 つに閉じ、 判定入力は打刻の時刻だけで、 pane の字面も台帳も読まない形で戻る。 unit の導出と値の置き場は決定済みの形の再利用で、 新しい依存も新しい env の継ぎ目も無い"
  - "代償: host に systemd user の timer が戻る。 systemd user session の無い host では unit の有効化が断られ、 tick は回らない (代わりの駆動は本 ADR の射程外)"
  - "代償: rules 行 3 本 (初段の待ち・係数・上限) が戻り 1 本 (間隔) を新設し、 席の置き場に梯子の記録 1 file を足す。 SRS の FR1027 / FR1038 / FR1043 / FR1044 / FR1064 の改訂と AC1018 の不在の歯の書き換えが要る (user の手番)。 それまで SRS と本 ADR は食い違い、 本 ADR は proposed で何も拘束しない"
  - "代償: 席の変化の測り方は状態の打刻の最終行の時刻に依存する。 hook が死んで打刻が出なくなった席は、 最終行が Busy なら古さで放置され (合図は出ない)、 最終行が Idle なら合図が出て梯子が登り打ち切られる。 打刻の無い席 (器の plugin を積まない席) には届かない (fail-closed の代償・判定行と doctor から人が拾う)"
  - "代償: 送った合図が入力欄に残ったまま消費されない・席が固まっている周は梯子が登る側に倒すので、 本当に黙っている席への合図も最大 6 本で打ち切られる。 打ち切りの後は変化が無い限り器は促さず、 人が seat launch か対話面で起こす"
  - "代償: 合図に応える 1 turn の消費は残る (変化があった周ごとに 1 回)。 変化は席自身の打刻だけで測る。 便の終端の通知と群の逼迫の通知も、 席が turn として消費すれば打刻が進み、 席は動いたので梯子は段 0 に戻る (正しい挙動)。 席が黙ったままなら通知は入力欄に残り、 打刻は進まない"
  - "代償: 打刻の合図の注入は既存の入力欄の門を通るので、 席の入力欄に人の打ちかけの文字が在る周は注入されず、 記録も書かず、 次の周へ送られる。 この周の梯子は登らず、 待ちも伸びない"
  - "代償: 梯子の記録が読めない席は、 人が記録を退役させるまで合図が止まる (判定行が理由を出す・直すのは user)。 前の器は読めない記録を「記録なし」と読み替えて送っていたが、 本 ADR は送らない側に倒す"
  - "代償: 黙っている時間は席の最後の打刻から測り、 合図が出るのは席が 40 分以上黙り、 最後の合図から今の段の待ち以上経ち、 口座の門を通った周である。 変化で段が 0 に戻っても、 次の合図は席が 40 分黙ってからで、 対話の turn の直後には届かない"
  - "代償: 注入 (入力欄への書き込みと Enter) が落ちた周も記録は残り、 送ったと数える。 届かなかった合図が段に数えられ、 次の段の待ちの後に再送される (合図は best-effort)"
  - "代償: 口座の門は FR1033 の計測の記録の最新値だけを読み、 計測は起こさない (ADR-1055 の「鮮度が切れたら計測」は使わない)。 記録が無い・古い周は門を通して送るので、 閾値を越えた口座の席に合図が届くことがある (best-effort・届いても手番は動かず費用は無い)"
