    name: "便用の鍵 (7 日窓の reset が早い順) をそのまま群にも使う"
    text: |
      ADR-1042 の run_key を群の移り先にも当て、 鍵を 1 本にする。 決め手は分析 (用途が違う)。
      （平易）便に口座を渡す並べ方 (7 日の窓の reset が早い順) をそのまま群の移り先にも使い、 関数を 1 本にする案です。 関数が 1 本で済む点で勝ります。 けれども、 便の並べ方は「reset までに使わなければ消える枠を使い潰す」ための順で、 席は何日も同じ口座に居るので残りを見ないと直ぐ線を越えます。 model 別の窓も見ないので Fable が高い口座を避けられません。 決め手は分析です。
      利点: 鍵の関数が 1 本で済む
      欠点: 便用は「reset までに使わなければ消える枠を使い潰す」ための順で、 席は何日も同じ口座に居るので残量を見ないと直ぐ逼迫する (DR1)
      欠点: モデル別の窓を見ないので Fable が高い口座を避けられない (DR1)
    verdict: rejected
    reason: "決め手は分析 (用途が違う)。"
  - id: "OPT4"
    name: "予約を file に記録する"
    text: |
      群ごとに <群>.reserved の file を置き、 移る群はそれを読む。 決め手は分析 (記録の事故の置き場)。
      （平易）群ごとに予約の file を置き、 移る群はそれを読む案です。 予約が周をまたいで安定し、 画面が file を読むだけで済む点で勝ります。 けれども、 実測が変わっても予約が古いまま残って線を越えた口座へ移ることがあり (導いた値を記録する形)、 消し忘れ・移動の途中に残る札・読めないときの扱い、 という新しい口が増えます。 移り先の判定の周は新しい計測を読み直すので (測るのは判定の周だけ)、 毎周の計算で足ります。 決め手は分析です。
      利点: 予約が周をまたいで安定し、 GUI が file を読むだけで済む
      欠点: 実測が変わっても予約が古いまま残り、 逼迫した口座へ移る (C10 の導出値を記録する形) (DR3)
      欠点: 消し忘れ・移動の途中の札・読めない周の扱い、 という新しい fail-closed の口が増える (DR3・DR4)
      欠点: 移り先の判定の周は鮮度の内側の実測を読み直す (計測は判定の周だけ・FR1027 / FR1038) ので、 周ごとの導出で足りる (DR3)
    verdict: rejected
    reason: "決め手は分析 (記録の事故の置き場)。"
  - id: "OPT5"
    name: "5 時間窓も鍵に入れ、 残量を reset までの時間で割った速さで並べる"
    text: |
      3 窓の残量を reset までの残り時間で割り、 消費できる速さの大きい順に並べる。 決め手は分析 (式の妥当性を測る材料が無い)。
      （平易）5 時間の窓も並べ方に入れ、 3 つの窓の残りを reset までの残り時間で割った「使える速さ」の大きい順に並べる案です。 reset までの時間を直接使える点で勝ります。 けれども、 5 時間の窓は数時間で戻るので並べ順が毎周揺れ (便の並べ方も 5 時間の窓を並べ順に入れていません)、 式の妥当性を測る材料が無く、 裁定した並べ方より複雑です。 決め手は分析です。
      利点: reset までの時間を鍵の中で直接使える
      欠点: 5 時間窓は数時間で開き直るので並べ順が周ごとに揺れる (ADR-1042 も 5 時間窓を便用の並べ順に入れていない) (DR1)
      欠点: 式の妥当性を測る材料が無く、 裁定した鍵 (残量 → reset → 宣言順) より複雑で C17 の最小に反する (DR4)
    verdict: rejected
    reason: "決め手は分析 (式の妥当性を測る材料が無い)。"
basis: [FR1027, FR1033, FR1036, FR1038, AC1041, ADR-1042, ADR-1049, ADR-1055, ADR-1066, ADR-1068]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「席」は人と AI が話す 1 つの session、 「便」は契約 1 本を実装から着地まで運ぶ 1 回の走り、 「口座」は席や便が使う Claude Code の login 単位、 「群」は同じ口座を共有する project のかたまりです。 群の口座の残りが線を越えたとき、 群は別の口座へ移ります。 これまで移り先は「宣言に並べた候補の順で、 条件を満たす最初の口座」でした (ADR-1049)。 2026-09-26 に持ち主は、 それは要望 (Fable の窓と 7 日の窓の残りと、 reset までの時間を見て、 群ごとに最適な口座を選ぶ) と違うと指摘し、 残りの量で並べる形を裁定しました。 並べ方は、 7 日の窓とその席の model の 7 日の窓の残りの少ない方が多い順 → 7 日の窓の reset が早い順 → 宣言の順、 です。 差し戻し (Fable の窓が高くて 7 日の窓が低い口座が選ばれないか) には、 候補に入る条件が model の窓も線で断り、 並べ方が 2 つの窓の残りの少ない方を取ることで答えました。 群が幾つ増えても移り先が被らないよう、 群ごとの「次に移る口座 (予約)」を宣言の順に先の群から決め、 予約は file に残さず毎周計算し直します。 予約は他の群の移動と予約を避けますが、 便の起動は避けません。 群の名前は Tier1・Tier2 のように Tier<数字> に固定します。 要件書の FR1038 と AC1041 (版 0.25) の改訂を伴い、 同じ PR で land します。
