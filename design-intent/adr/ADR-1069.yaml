  器の承認の欄: 裁定 (user)・user・裁定 id user 2026-09-26T00:43Z (移り先は 7 日窓と役割の model の 7 日窓の残量の小さい方が大きい順・7 日窓の reset が早い順・宣言順で並べ、 群ごとの予約は宣言順で導出し、 予約は他の群の移動と予約を排他するが便の起動は排他しない)・2026-09-26T00:48Z (群の名は Tier<数字> に固定)。 要旨だけを写す。 逐語は非公開の作業記録簿 (台帳 s2-07l.645 の notes) に在る・裁定済
  器の承認の欄: 設計 (orchestrator)・orchestrator・2026-09-26 草稿 v1 (tsuzuri の設計席からの relay と持ち主の差し戻しを受け、 現物の口 (群の段の移り先・便用の並べ鍵・面の読みの種) の読みと合わせて形にした。 拘束する constitution の版 0.5.0)・作成
  器の案の章の要約: 候補を 5 つ並べます。 残りの量で並べ・予約を宣言の順に導き・名前を Tier<数字> に固定する案 (選んだ案)、 今のまま (宣言の順で最初) の案、 便に口座を渡す並べ方 (reset が早い順) をそのまま群にも使う案、 予約を file に記録する案、 5 時間の窓も並べ方に入れて残りを reset までの時間で割った速さで並べる案です。 却下した 4 案にも利点を並べ、 退けた決め手が現物か分析かを各案に書きます。 今のままの案は要件も決定も動かさない点で、 便の並べ方を使う案は関数が 1 本で済む点で、 file に記録する案は予約が周をまたいで安定し画面が file を読むだけで済む点で、 速さで並べる案は reset までの時間を直接使える点で、 選んだ案に勝ります。
  器の専門語の説明: 本文に出てくる専門語 10 個を、 やさしい言葉で説明します。
  ・群の予約（group reservation）: 群ごとに周ごと導出する、 その群が次に移る口座。 群を宣言順に見て、 どの群の今の口座でもなく先の群の予約でもない、 並べた候補の先頭。 記録せず、 他の群の移動と予約を排他し、 便の起動は排他しない。 doctor の群の行の next= の値。
  ・残量（headroom）: 口座の窓 (5 時間窓・7 日窓・モデル別 7 日窓) の使用率を 100 から引いた値。 移り先の鍵は 7 日窓と役割の model の 7 日窓の残量の小さい方を使う。
  ・並べ鍵（sort key）: 候補の口座を並べる比較の値の組 (辞書順・分岐なし)。 群の移り先は「残量の小さい方が大きい順 → 7 日窓の reset が早い順 → 宣言順」。 便用の並べ鍵 (ADR-1042) とは別の関数。
  ・役割の model（role model）: 席の役割ごとに rules 行 seat.model.<役割> が宣言する model (orchestrator は fable)。 移り先の鍵はこの model のモデル別 7 日窓を見る。 その行を持たない口座は最後に並ぶ。
  ・門（gate condition）: 移り先の候補に入る条件。 今の口座でない・他の群の今の口座でない・退役中でない・鮮度の内側の実測を持ち 3 窓とも閾値未満。 5 時間窓は門にだけ効く。 本 ADR は門を変えない。
  ・群の今の口座（group effective account）: project の群の席が実際に使う口座。 host の根に群ごとに高々 1 件の記録で持ち、 記録が無い周は種 (宣言順で前の群の種でない最初の候補・本 ADR が追認)。 便用の口座選定はこの口座を候補から外す。
  ・Tier の名（tier name）: 群の名の形 Tier<数字>。 数字は重複せず、 宣言順は数字の昇順に限る (違う面は読みで断る)。 数字の小さい群が予約で先に選ぶ。
  ・便用の口座選定（run account selection）: 便を起こす周に器が口座を選ぶ規則 (FR1036)。 群については今の口座だけを候補から外し (席の登録 row の口座・役割の口座・役割の実効の口座も外す)、 予約された口座は外さない。 並べ鍵は 7 日窓の reset が早い順 (ADR-1042)。
  ・鮮度（freshness）: 計測の記録を「今の値」と読める経過の上限 (rules 行 1 本)。 鮮度の外の候補は移り先の判定の周に 1 回測ってから並べる。
  ・lock の内側（under the host lock）: host の群用 dir の lock (1 file) を握った区間。 移動の判定・記録・予約の導出はこの内側で行い、 tick と 1 周の群の段が同じ周に同じ群を撃たない。
  器の頁の末: このページは、大もとの機械データ (正本) から自動で組み立てられています。構造は機械が自動で検査し、内容が元データに忠実かは独立のレビューで確かめます。
