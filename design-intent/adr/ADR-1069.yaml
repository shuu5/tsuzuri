  ruling: "s2-07l.645（器の台帳の id・器の記録の承認の欄が名指す・取り込みの裁定 t3-hub.74.60.1:20261004T0113Z-1）"
  verbatim: "器の台帳 s2-07l.645 の notes に在る（この file に写さない）"
  surface: R-8
consequences:
  - "この判断で良くなること 3 つと、 代わりに引き受けること 3 つです。 良くなるのは、 移り先が残りの量で決まり Fable の窓が高い口座は条件で断られるか並べ方で沈むこと (席が長く働ける口座へ移ります)、 群が幾つ増えても同じ決め方で数字の小さい Tier が良い口座を予約し 2 つの群が同じ口座へ飛ばないこと (便は予約された口座を使ってよいままです)、 doctor の next= で次にどこへ移るかが毎周見え別 project の画面も同じ関数の値を出せること (宣言の順や独自の推定を写しません) です。 引き受けるのは、 後の群は先の群が線を越えていなくても先の群の予約を避けて二番手へ移ること (良い口座を先の群のために空けておく形で、 持ち主の裁定です)、 群の名前が Tier<数字> に固定され別の名前を使う設定は読みで断られること (今の名前 Tier1 / Tier2 は合います)、 要件書の FR1038 と AC1041 の改訂を伴い前の決定 3 つの「候補の先頭」の読み (種の「候補の先頭」を含みます) が置き換わること、 です。"
  - "良い結果: 移り先が残量で決まり、 Fable の窓が高い口座は門で断られるか鍵で沈む。 席が長く働ける口座へ移る"
  - "良い結果: 群が幾つ増えても同じ導出で、 数字の小さい Tier が良い口座を予約し、 2 群が同じ口座へ飛ばない。 便は予約された口座を使ってよい"
  - "良い結果: doctor の next= で「次にどこへ移るか」が周ごとに見え、 別 project の board も同じ関数の値を出せる (宣言順の値や独自の推定を写さない)"
  - "代償: 後の群は、 先の群が逼迫していなくても先の群の予約を避けて二番手へ移る (良い口座を先の群のために空けておく形・持ち主の裁定)"
  - "代償: 群の名が Tier<数字> に固定され、 別の名を使う host の面は読みで断られる (既存の host の名は Tier1 / Tier2 で合う)"
  - "代償: 要件 FR1038 と AC1041 の改訂 (v0.25) を伴い、 ADR-1049 / ADR-1055 / ADR-1068 の移り先の「候補の先頭」の読みと ADR-1049 の種の「候補の先頭」が本 ADR に置き換わる (3 つは frozen のまま・supersession の系譜で読む)"
note: |
  器の元の file: scribe2/design-intent/decisions/ADR-0069-group-moves-pick-by-headroom-and-reserve-in-tier-order.html
