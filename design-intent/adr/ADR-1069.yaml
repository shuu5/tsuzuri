  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録は前の決定 3 つを部分的に置き換えます (置き換える節は 4 つ)。 ADR-1049 からは「並べた順が候補の順・移り先は候補の順で条件を満たす最初の口座」と「記録が無いときの種は候補の先頭」(設計 doc の「宣言の順で前のかたまりの種でない最初の候補」を追認します) を、 ADR-1055 からは第 3 段の移り先の「候補の先頭」を、 ADR-1068 からは移り先の「候補の先頭」の読み (条件 2 つと「動いている便の口座を外さない」と便の除外「いま使う口座だけ」は保ちます) を置き換え、 他は保ちます。 保つのは、 ADR-1049 の群・宣言の表・記録・承認の記録・新しい口座で新しい席を起こす・候補が無ければ移らない、 ADR-1055 の契機 2 系統と lock と 3 段、 ADR-1066 の判定の置き場と契機、 ADR-1068 の条件 2 つと便の除外、 ADR-1042 の便の並べ方、 の全部です。 この記録は受け入れ済み (accepted) で、 要件書の改訂 (版 0.25) と同じ PR で発効します。 原則は「移り先は残量で選び、 優先は宣言順で予約し、 予約は記録せず周ごとに導き、 便の起動は妨げない。」です。
