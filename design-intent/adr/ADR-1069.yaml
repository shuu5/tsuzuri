# 判断の記録 ADR-1069 — 器 scribe2 の判断の記録 ADR-0069 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1069
title: "群の移り先は残量の鍵で並べ、 群ごとの予約を宣言順に導出し、 群の名は Tier と数字に固定する — 移り先は「7 日窓と役割の model の 7 日窓の残量の小さい方が大きい順 → 7 日窓の reset が早い順 → 宣言順」で並べた候補から、 群を宣言順に見て「どの群の今の口座でもなく先の群の予約でもない先頭」を各群の予約とし、 予約は記録せず周ごとに lock の内側で導出し、 便の起動は排他しない (ADR-1049 の「候補の順 = 宣言順」と ADR-1055 / ADR-1068 の移り先の「候補の先頭」を部分 supersede・要件 FR1038 と AC1041 の改訂を伴う)"
status: accepted
date: 2026-09-26
context: |
  ADR-1049 は群の移り先を「宣言の候補の順で、 門を通る最初の口座」と決め、 ADR-1068 は門を「他の群の今の口座でない ∧ 閾値未満」の 2 条件にした。 2026-09-26 に持ち主は、 移り先が宣言順で黙って決まるのは要望 (Fable と 7 日窓の残量と reset までの時間を見て群ごとに最適な口座を選ぶ) と違うと指摘し、 残量の鍵で並べる形を裁定した (00:43Z)。 差し戻し (Fable の窓が高く 7 日窓が低い口座が選ばれないか) には、 門がモデル別 7 日窓も閾値で断り、 鍵が 2 つの窓の残量の小さい方を取ることで答えた。 群が増えても移り先が被らないよう、 群ごとの予約を宣言順に導出し (記録しない)、 予約は他の群の移動と予約を排他するが便の起動は排他しない。 群の名は Tier<数字> に固定し、 宣言順は数字の昇順に限る (00:48Z)。 要件 FR1038 と AC1041 (v0.25) の改訂を伴う。
  なぜこの判断が要るのかを、 経緯 (宣言の順)・別 project からの報告と裁定 1 (残りで並べる)・差し戻し (Fable の窓)・裁定 2 (予約と Tier の名)・器の今の部品・これまでの決まり・この判断の範囲の 7 つから説明します。 前の決定 (ADR-1049) は、 群の宣言に候補の口座を並べ、 「並べた順が候補の順」とし、 移り先を「候補の順で条件を満たす最初の口座」と決めました。 後の決定 (ADR-1055・ADR-1068) はその形を受け継ぎ、 条件を「他の群がいま使う口座でなく、 3 つの窓とも線の下」の 2 つにしました。 一方で、 便に口座を渡す選び方 (ADR-1042) は「7 日の窓の reset が早い順」で動的に並べる仕組みを持っていました。 つまり動的に並べる部品は器に在り、 群の移り先だけが宣言の順でした。 2026-09-26 に別 project (tsuzuri) の設計席が持ち主の指示で器の仕様を確かめ、 移り先が宣言の順で黙って決まるのは持ち主の要望と違うと報告しました。 持ち主は「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」と差し戻しました。 実測で答えは 2 段でした。 候補に入る条件は 3 つの窓の全部を線で断り、 実データの model 別の行は Fable だけなので、 Fable が 95 以上の口座は候補に入りません。 並べ方の 1 つ目は 2 つの窓の残りの少ない方なので、 Fable 90 / 7 日 10 の口座は残り 10 として、 Fable 40 / 7 日 60 の口座 (残り 40) の後ろに沈みます。 残る穴は「席の model の行を持たない口座」で、 その口座は最後に並べます。 次に持ち主は、 群は幾らでも増え、 各群に口座を 1 つ占有させる想定 (新しい便と他の群の移動は弾き、 動いている便は残す) なので、 同じ並べ方を全群に当てると次の移り先が全群で被る、 群の中で次の移り先を占有する「予約」が要る、 予約は他の群の移動と予約を避けるが便の起動は避けない、 優先は群の並び順 (Tier1 → Tier2)、 名前は Tier<数字> に固定したい、 と裁定しました。 器の部品を見ると、 移動は見回りも 1 周も machine 全体の lock の内側で行い、 移った群はその場で記録を書き、 後の群はそれを読んで避けるので、 2 つの群が同じ周に同じ口座へ飛ぶ事故は既に起きません。 足りないのは優先で、 先に線を越えた群が最良の口座を取っていました。 決まりの側では、 宣言値と実測値と導出値を分ける・足すときに外す物を名指す・道は 1 本、 が効きます。 動かすのは、 並べ方・予約の導出・名前の形の 3 か所だけで、 候補に入る条件・lock・記録・承認の記録・退避・起こし直し・便に口座を渡す選び方・種の決め方は動かしません。
  CTX1 経緯 — 移り先は宣言の候補の順 (ADR-1049 / ADR-1055 / ADR-1068)
  ADR-1049 は群 (同じ口座を共有する project のかたまり) の宣言に候補の口座の列を持たせ、 「宣言順が候補の順」とし、 移り先を「候補の順で門（候補に入るための条件）を通る最初の口座」、 記録の無い周の今の口座 (種) を「候補の先頭」と決めた。 ADR-1055 は第 3 段の移り先を同じ形で受け継ぎ、 ADR-1068 は門を「他の群の今の口座（かたまりがいま使う口座）でない ∧ 3 窓とも閾値未満」の 2 条件にして稼働中の便の口座を候補に戻した。 種はその後の設計 (account-lifecycle.md §28・s2-07l.641) で「宣言順で前の群の種でない最初の候補」になり、 両群が同じ候補の列を宣言しても初期状態で同じ口座に乗らない。 一方、 便用の口座選定（便に口座を渡す選び方） (ADR-1042) は「7 日窓の reset が早い順 → 走行中の便数 → label」の動的な並べ鍵（候補を並べる比較の値の組）を持つ。 動的に並べる機構は器に在り、 群の移り先だけが宣言順だった。
  CTX2 relay と裁定 1 — 移り先は残量（窓の使用率の残り）の鍵で並べる
  2026-09-26 に tsuzuri (別 project) の設計席が、 持ち主の指示で器の群の仕様を確かめ、 移り先が宣言順で黙って決まるのは持ち主の要望 (Fable と 7 日窓の残量と reset までの時間を考慮して群ごとに最適な口座を選ぶ) と違うと報告した (00:20Z・要旨)。 席は候補を集合とし順は同点の tie-break にだけ使う形と、 鍵 (7 日窓とモデル別 7 日窓の残量の小さい方が大きい順 → 7 日窓の reset が早い順 → 宣言順) を提案し、 持ち主は差し戻しの後にその形を裁定した (00:43Z・要旨)。 5 時間窓は門にだけ使い鍵に入れない (5 時間窓は数時間で開き直るので並べ順の材料にすると順が揺れる。 ADR-1042 も 5 時間窓を便用の並べ順に入れていない)。
  CTX3 差し戻し — Fable の窓が高く 7 日窓が低い口座
  持ち主は「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」と差し戻した (00:36Z・要旨)。 実測で 2 段の答えを得た。 (1) 門は 3 窓 (5 時間・7 日・モデル別 7 日) の全部を閾値 (85 / 95 / 95) で断り、 実データのモデル別の行は Fable だけ (計測 6,882 行の全部) なので、 Fable が 95 以上の口座は候補に入らない。 (2) 鍵の第 1 項は 7 日窓と役割の model（席の役割が既定で使う model） の 7 日窓の残量 (100 − 使用率) の小さい方なので、 Fable 90 / 7 日窓 10 の口座は残量 10 として Fable 40 / 7 日窓 60 の口座 (残量 40) の後ろに沈む。 残る穴は「役割の model の行を持たない口座は鍵に model が入らず 7 日窓だけで上位に来る」ことで、 その口座は最後に並べる (便用の鍵が 7 日窓の reset を持たない口座を最後にするのと同じ形)。 役割の model は rules 行 seat.model.<役割> (orchestrator は fable) から取る。
  CTX4 裁定 2 — 群が増えても移り先が被らない予約と、 Tier の名（かたまりの名の形）
  持ち主は、 群は今 Tier1 と Tier2 だが幾らでも増え、 各群に口座を 1 つ割り当てて占有させる想定 (新規の便と他の群の移動は弾き、 稼働中の便は残す) なので、 同じ鍵を全群に当てると次の移り先が全群で被る、 群の中で次の移り先を占有する「予約」が要る、 予約は他の群の移動と予約を排他するが便の起動は排他しない、 予約の優先は群の並び順 (Tier1 → Tier2)、 群の名は Tier<数字> に固定して数字の小さい方を優先したい、 と裁定した (00:48Z・要旨)。 実測では、 移動は tick の判定も 1 周の群の段も host の lock 1 本の内側で行い、 移った群はその場で記録を書き、 後の群は他の群の今の口座を記録から読んで飛ばすので、 2 群が同じ周に同じ口座へ飛ぶ事故は既に起きない。 足りないのは優先で、 先に逼迫した群が最良の口座を取っていた。 予約を file に記録する形は退け、 lock の内側（1 つの手だけが動く区間）で周ごとに導出する (記録と実測のずれ・消し忘れで永久に塞がる、 という新しい事故の置き場を作らない)。 予約が便の起動を排他しないのは、 移った後に新しい便がその口座で起きないことを便用の口座選定が既に満たし (ADR-1068)、 予約の段階で便を弾くと口座が遊ぶためである (持ち主の裁定の要旨)。 移り先の判定の周は鮮度（計測が新しいと言える窓）の内側の実測を読み直す (計測を起こすのは判定の周だけ・鮮度の外の候補を 1 回測る・FR1027 / FR1038) ので、 予約は周ごとの導出で足りる。
  CTX5 現物 — 移り先の判定・便用の鍵・種・lock
  main aa4bfe1 で、 群の移り先は hook/group.rs の target_of が group.accounts() を宣言順に走査し、 今の口座・他の群の今の口座・退役中を飛ばし、 鮮度の外なら 1 回測り、 pressed が無い最初の label を返す (残量や reset で並べない)。 便用の並べ鍵は fleet/select.rs の run_key (7 日窓の reset の無い口座を最後・reset 昇順・走行中の便数・label) で、 session 用は逼迫度が最小。 種は rules/manifest.rs の seed_groups が宣言順に前の群の種を避けて埋め、 check_duplicate_groups が名と置き場の重複を断る。 1 周の群の段 (pipe/dispatch/group.rs の round) は lock の内側で群を宣言順に回し、 先に移った群の移り先を currents で更新して後の群が飛ばす。 tick (seat/tick.rs の judged) は同じ lock を取り others を記録から集める。 計測の記録 (fleet/usage.rs) は 5 時間窓・7 日窓・モデル別 7 日窓 (model の名つき) の行を持ち、 group.rs の pressed が 3 窓を閾値で判じる。 doctor の群の行は group= accounts= anchors= seat-accounts= current= の 5 項目。
  CTX6 憲法と既存の決定の向き (本 ADR の解釈)
  C10 (宣言値・実測値・導出値を分ける) から、 予約は導出値であり記録しない。 移り先の鍵は実測値 (計測の記録の行) だけから決め、 宣言値 (候補の列) は同点の順にだけ効く。 C17 (足すときに何を外すかを名指す) から、 足すのは並べ鍵の関数 1 本と doctor の項目 1 つで、 外すのは「候補の先頭 = 宣言順の最初」の読み。 file も型も足さない。 C2 (経路は 1 本) から、 鍵は用途別の関数に閉じ (便用の run_key の隣に群用の鍵を置く)、 移り先の判定と doctor の next= が同じ 1 本を呼ぶ。 C5 (裁定は値に印を持つ) から、 閾値の行 3 本と役割の model の行は今の裁定のまま (本 ADR は値を変えない)。 ADR-1042 (便用は reset が早い順) は用途が違うので不変。 ADR-1049 の群・宣言・記録・承認 event・候補が無ければ移らない、 ADR-1055 の契機と lock と 3 段、 ADR-1066 の判定の置き場、 ADR-1068 の門の 2 条件と便用の除外 (群の今の口座だけ) は本 ADR の前提。
  CTX7 射程 — 動かすのは並べ方・予約・名の 3 か所と、 種の出所の追認
  動かすのは (1) 移り先の候補の並べ方 (宣言順 → 残量の鍵・宣言順は tie-break)、 (2) 群ごとの予約の導出 (宣言順で先の群から・記録しない・doctor に next= を足す)、 (3) 群の名の形 (自由 → Tier<数字>・宣言順は数字の昇順) の 3 つ。 動かさないのは、 門の条件 (今の口座でない・他の群の今の口座でない・退役中でない・鮮度の内側の実測で 3 窓とも閾値未満)、 鮮度の外の候補を 1 回測る規則、 移動の契機・lock・記録・承認 event・退避・起こし直し、 便用の口座選定の除外 (群については今の口座だけ) と便用の並べ鍵、 閾値と model の rules 行の値、 event の種類。 種の規則は設計 §28 の形 (宣言順で前の群の種でない最初の候補) を本 ADR が追認し、 ADR-1049 の「候補の先頭」を置き換える (4 か所目)。
  （選択肢を測るものさし）この判断を評価する 4 本のものさしです。 移り先は残りの量で選ぶこと (席が長く働ける口座を、 7 日の窓と席の model の 7 日の窓の残りの少ない方で測る。 Fable が高い口座は沈む)。 群の優先は宣言の順で、 予約は他の群の移動と予約を避け、 便の起動は避けないこと (群が増えても同じ決め方で、 数字の小さい Tier が良い口座を取る)。 予約は記録しないこと (lock の内側で毎周計算し直し、 記録と実測のずれや消し忘れの事故を作らない)。 口も型も増やさないこと (並べる関数 1 本と doctor の項目 1 つを足し、 条件・lock・記録・便の除外は変えない) です。
  DR1｜移り先は残量で選ぶ — 席が長く働ける口座を、 7 日窓と役割の model の 7 日窓の残量の小さい方で測る (Fable が高い口座は沈む・持ち主の要望と差し戻し・C10) CTX2・CTX3・CTX6
  DR2｜群の優先は宣言順で、 予約は他の群の移動と予約を排他し便の起動は排他しない — 群が増えても同じ導出で、 数字の小さい Tier が良い口座を取る (持ち主の裁定 2) CTX4・CTX6
  DR3｜予約は記録しない — lock の内側で周ごとに導出し、 記録と実測のずれと消し忘れの事故を作らない (C10・N1 の可逆性) CTX4・CTX5・CTX6
  DR4｜口も型も増やさない — 鍵の関数 1 本と doctor の項目 1 つを足し、 門・lock・記録・便用の除外・種は不変 (C2・C17) CTX5・CTX7
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 群の移り先は、 候補に入る条件 (いま使う口座でない・他の群がいま使う口座でない・退役中でない・新しい計測があり 3 つの窓とも線の下・計測が古い候補は 1 回測る) を通る口座を、 7 日の窓と席の model の 7 日の窓の残りの少ない方が多い順 → 7 日の窓の reset が早い順 → 宣言の順、 で並べたものから選びます。 席の model の行を持たない口座は最後です。 5 時間の窓は条件にだけ使い、 並べ方には入れません。 宣言に並べた候補は集合として読み、 順は同点のときにだけ効きます。 群の予約は、 群を宣言の順に見て「どの群もいま使っておらず、 先の群の予約でもない、 並べた候補の先頭」で、 移る群は自分の予約へ移ります。 予約は記録せず、 machine 全体の lockの内側で毎周計算し直し、 他の群の移動と予約を避けますが、 便の起動は避けません (便に口座を渡す選び方が外すのは群のいま使う口座だけのままで、 予約された口座を便は使ってよく、 動いている便は移動を妨げません)。 群の名前は Tier<数字> (数字は重複しない) に限り、 宣言の順が数字の小さい順でない設定は読みの時点で断ります。 優先は宣言の順のままです。 doctor の群の行に next= (今の並べ方で導いた予約) を足し、 移り先の判定と doctor は同じ 1 本の関数を呼びます。 候補が無い群は今どおり移らず断ります。 記録が無いときの種は、 宣言の順で前のかたまりの種でない最初の候補です (設計 doc の形をこの記録が追認し、 前の決定の「候補の先頭」を置き換えます)。 移動の契機・lock・記録・承認の記録・退避・起こし直し・便の並べ方・線の値・記録の種類は変えません。 前の決定のうち、 ADR-1049 の「並べた順が候補の順・移り先は候補の順で最初」と「種は候補の先頭」と、 ADR-1055 / ADR-1068 の移り先の「候補の先頭」の読みを置き換え、 他は保ちます。 要件書では、 FR1038 (群の移動) の移り先を残りの量で並べ予約を導き名前を固定する根拠になり、 FR1036 (便に口座を渡す選び方) は変えず予約された口座を便が使ってよいこと、 FR1033 (残量の計測) の行が並べ方の材料であること、 FR1027 (見回り) が判定を撃つ契機は変わらないことを主張します。
  採用 — OPT1
  群の移り先 SHALL 門 (今の口座でない ∧ 他の群の今の口座でない ∧ 退役中でない ∧ 鮮度の内側の実測を持ち 5 時間窓・7 日窓・モデル別 7 日窓とも閾値未満・鮮度の外の候補は 1 回測る) を通る候補を、 (a) 7 日窓と群の席の役割の model (rules 行 seat.model.<役割>) の 7 日窓の残量 (100 − 使用率) の小さい方が大きい順 → (b) 7 日窓の reset が早い順 → (c) 宣言順、 の辞書順で並べたものから選び、 役割の model の行を持たない口座 SHALL 最後に並ぶ。 5 時間窓 SHALL 門にだけ使い鍵に入れない。 宣言の候補の列 SHALL 集合として読み、 順 SHALL (c) にだけ効く。 群の予約 SHALL 群を宣言順に見て「どの群の今の口座でもなく、 先の群の予約でもない、 並べた候補の先頭」とし、 移る群 SHALL 自分の予約へ移る。 予約 SHALL 記録せず、 host の lock の内側で周ごとに導出し、 他の群の移動と予約を排他するが便の起動 SHALL 排他しない (便用の口座選定の除外は群の今の口座だけのまま・予約された口座を便は使ってよい・稼働中の便は移動を妨げない)。 群の名 SHALL Tier<数字> (数字は重複しない) に限り、 宣言順が数字の昇順でない host の面 SHALL 読みで断る (fail-closed)。 優先 SHALL 宣言順のまま。 doctor の群の行 SHALL next=<label|none> (今の鍵で導出した予約) を持ち、 移り先の判定と doctor SHALL 同じ 1 本の鍵の関数を呼ぶ。 候補が無い群 SHALL 今どおり移らず断る。 記録の無い周の種 SHALL 宣言順で前の群の種でない最初の候補 (設計 account-lifecycle.md §28 の形を本 ADR が追認し、 ADR-1049 の「候補の先頭が種」を置き換える)。 移動の契機・lock・記録・承認 event・退避・起こし直し・便用の並べ鍵・閾値と model の rules 行の値・event の種類 SHALL 変えない。 本 ADR SHALL ADR-1049 の「候補の順 = 宣言順・移り先は候補の順で門を通る最初・記録の無い周は候補の先頭が種」と、 ADR-1055 / ADR-1068 の移り先の「閾値未満の候補の先頭」の読みを置き換え、 他は保つ。 要件 FR1038 と AC1041 (SRS v0.25) の改訂を伴い、 同じ PR で land する。
  （平易）群の移り先は、 候補に入る条件 (いま使う口座でない・他の群がいま使う口座でない・退役中でない・新しい計測があり 5 時間・7 日・model 別 7 日の 3 つの窓とも線の下・計測が古い候補は 1 回測る) を通る口座を、 7 日の窓とその群の席の役割の model (規則の表の行が決める。 orchestrator は fable) の 7 日の窓の残り (100 − 使用率) の少ない方が多い順 → 7 日の窓の reset が早い順 → 宣言の順、 で並べたものから選びます。 席の model の行を持たない口座は最後に並びます。 5 時間の窓は条件にだけ使い、 並べ方には入れません。 宣言に並べた候補は集合として読み、 順は同点のときにだけ効きます。 群の予約は、 群を宣言の順に見て「どの群もいま使っておらず、 先の群の予約でもない、 並べた候補の先頭」で、 移る群は自分の予約へ移ります。 予約は記録せず、 machine 全体の lockの内側で毎周計算し直し、 他の群の移動と予約を避けますが、 便の起動は避けません (便に口座を渡す選び方が外すのは群のいま使う口座だけのままで、 予約された口座を便は使ってよく、 動いている便は移動を妨げません)。 群の名前は Tier<数字> (数字は重複しない) に限り、 宣言の順が数字の小さい順でない設定は読みの時点で断ります。 優先は宣言の順のままです。 doctor の群の行に next= (今の並べ方で導いた予約。 無ければ none) を足し、 移り先の判定と doctor は同じ 1 本の関数を呼びます。 候補が無い群は今どおり移らず断ります。 移動の契機・lock・記録・承認の記録・退避・起こし直し・種の決め方・便の並べ方・線と model の規則の値・記録の種類は変えません。 前の決定のうち、 ADR-1049 の「並べた順が候補の順・移り先は候補の順で最初」と、 ADR-1055 / ADR-1068 の移り先の「候補の先頭」の読みを置き換え、 他は保ちます。 要件書の FR1038 と AC1041 (版 0.25) の改訂を伴い、 同じ PR で land します。
  （理由）持ち主の裁定は、 移り先を残りの量で並べること、 群ごとに予約して宣言の順に優先すること、 予約は他の群の移動と予約を避けるが便の起動は避けないこと、 名前を Tier<数字> に固定すること、 の受諾でした。 残りの量で並べるのは、 席が何日も同じ口座に居るので、 いま残りが多い口座ほど長く働けるからで、 2 つの窓の少ない方を取るのは、 持ち主の差し戻し (Fable が高くて 7 日の窓が低い口座) をそのまま塞ぐためです。 候補に入る条件が model の窓も線で断るので、 線を越えた Fable の口座は並べる前に消えます。 席の model の行を持たない口座を最後にするのは、 その口座の Fable の残りが読めず、 7 日の窓だけで上位に来る穴を塞ぐためです (便の並べ方が reset の無い口座を最後にするのと同じ形)。 便の並べ方を流用する案を退けたのは、 便は「消える枠を使い潰す」順で、 席の目的 (長く働く) と逆だからです。 予約を宣言の順に導くのは、 群が幾つ増えても同じ決め方で数字の小さい Tier が良い口座を取るためで、 記録しないのは、 導いた値を記録すると実測とずれて線を越えた口座へ移ったり消し忘れで塞がったりする事故の置き場になるからです (宣言値・実測値・導出値を分ける決まり)。 移り先の判定の周は新しい計測を読み直す (測るのは判定の周だけ) ので、 lock の内側で毎周計算し直せば足ります。 予約が便の起動を避けないのは、 便に口座を渡す選び方が群のいま使う口座を外す既存の規則 (ADR-1068) で「移った後に新しい便がその口座で起きない」が既に満たされ、 予約の段階で便を弾くと口座が遊ぶからです (持ち主の裁定の要旨)。 5 時間の窓を並べ方に入れず速さの式も使わないのは、 5 時間の窓は数時間で戻って順が揺れ、 式の妥当性を測る材料が無いからです (足すときは最小に)。 名前を固定するのは、 数字の小さい群が優先という約束を名前で読めるようにし、 宣言の順と名前がずれる設定を読みで断るためです。 足すのは並べる関数 1 本と doctor の項目 1 つで、 条件・lock・記録・便の除外は変えないので、 足すときに外す物を名指す決まりと道は 1 本の決まりに沿います。 後の群が二番手へ移ること・名前の形の固定・要件書と前の決定の読みの置き換えは、 代償として引き受けます。
