  verbatim: "tsuzuri の台帳 t3-hub.74.60.1 の notes に在る（この file に写さない・器の記録は器の台帳の裁定 id を名指さない）"
  surface: R-8
consequences:
  - "この判断で良くなること 4 つと、 代わりに引き受けること 6 つです。 良くなるのは、 決定と要件と実装が揃うこと、 断った周をそのまま撃ち直せること、 候補なしの周に余裕の無い口座を使う判断が人の手に残ること、 器の code の変更が無いことです。 引き受けるのは、 候補が尽きた置き場で席が立たず対話面も無いこと、 AC1040 を測る歯を足す必要があること、 excluded の語が要件書の口座選定の除外の集合に結び付くこと、 設計 doc と語彙の書き直しが要ること、 以前の user の裁定 (候補が無くても席は立てる・全口座が上限のときだけは断る) を新しい裁定で覆し、 席が立たず対話面も無い形を引き受けること、 init の導入が席の段で止まりうることです。"
  - "良い結果: 決定・要件・実装が同じ形になり、 code に無い約束 (妥協の 2 段・妥協の理由・指示文の妥協の穴) が決定記録の現行から外れる"
  - "良い結果: 候補なしの周の起動は何も書かず何も送らないので、 同じ command をそのまま撃ち直せ、 登録 row を読む点検も汚れない"
  - "良い結果: 選定の経路では、 閾値の外で口座を席に使う判断は人の名指しの 1 手に残り、 器の中の候補なしの扱いが群の移動と同じ向き (移らない・起こさない) に揃う"
  - "良い結果: 器の src の変更は 0 で、 足すのは AC1040 を測る歯だけである"
  - "代償: 群の外の置き場で候補が尽きた周は席が立たず、 人が口座を名指すか reset を待つまで、 その置き場の対話面は無い (ADR-1041 が妥協で避けた形を引き受ける)"
  - "代償: AC1040 の 4/4 には新しい歯が要る。 席の起動を通す断りの歯は unmeasured の 1 形だけで (e2e の seat/launch.rs の型付きの断りの歯)、 4 語の畳み方は選定の単体の歯が、 over-threshold は session 用の fleet select の e2e が、 all-limited と excluded は便用の fleet select の e2e が測るだけである。 over-threshold・all-limited・excluded の 3 形を席の起動で撃って登録 row 0 と key 0 を測る歯と、 全部が上限の口座と実測が無い口座だけの fixture で前の語 all-limited だけが出る歯と、 閾値以上の口座と閾値未満の口座を 1 つずつ持つ fixture で閾値未満の口座で起きる歯を足す (今の候補の在る周の歯は、 閾値未満の 2 口座の 1 つを除外で外す形である)"
  - "代償: excluded の語は FR1036 の session 用の除外集合 (自席の鍵の外の登録 row の口座) に結び付く。 同じ SRS の版は FR1036・AC1013・用語集の実効の口座と実効の記録を code と ADR-1049 (群の今の口座) に揃えたが、 後で選定の除外を変える便は FR1069 の excluded の句と AC1040 も同時に直す要がある"
  - "代償: 設計 doc の seat-roles.md §18 (妥協の起動) と carry-prep.md の「FR1069 は未着地」の句は、 本 ADR の着地の後に書き直しが要る。 語彙の妥協の起動・妥協の通知・実効の記録の定義も同じ PR で直す"
  - "代償: 裁定 id user 2026-09-17T06:10Z の要旨 (3) (候補が無くても席は立てる・全口座が上限に当たっている周だけは従来どおり断る) を 裁定 id user 2026-09-28T09:04Z (断る推奨を採る) で覆すので、 群の外の置き場で候補が尽きた周に対話面が無くなる形を、 持ち主の選んだ代償として引き受ける"
  - "代償: init の 1 発の導入で、 口座の実測が無い新しい置き場は席の段で止まり (failed:seat:no-account)、 人の 1 手が要る"
note: |
  器の元の file: scribe2/design-intent/decisions/ADR-0086-seat-launch-without-a-candidate-is-refused-not-compromised.html
  器の表紙の頭: 設計判断記録 (ADR) scribe2 — 口座の候補が無い席の起動
  器の表紙: 状態accepted選択肢5件 (OPT1–OPT5)結果良い 4 / トレードオフ 6版v0.1.0 / 2026-09-28
  器の表紙: 正当化する要件: SRS-SCRIBE2-MVP の FR1069・FR1059・FR1036
  器の表紙: 想定読者: scribe2 の開発 session と user — 口座の窓や選定の内部の専門知識は不要 (専門語はやさしい言葉を併記)
  器の承認の欄: 裁定 (user)・user・裁定 id user 2026-09-28T09:04Z (妥協の口座で席を起こさず、 理由の語で断る推奨を採る) と 裁定 id user 2026-09-28T00:54Z (決めてほしいことは推奨で進める、 の常設の指示)。 置き換える ADR-1041 の妥協の起動は 裁定 id user 2026-09-17T06:10Z の要旨 (3) を受けた決定で、 本 ADR はその部分を 09:04Z の裁定で覆す。 逐語は台帳にだけ在る・裁定済
  器の承認の欄: 設計 (orchestrator)・orchestrator・2026-09-28 草稿 v3 (SRS 版 0.28 の最終文の FR1069・FR1036・AC1040・AC1013 と用語集を受け、 席の起動の口座の決め方・候補なしの理由の畳み方・断りの 1 行と rc・器が自分で起こし直す経路の口座・init の席の段・既存の歯を現物で読んだ。 拘束する constitution の版 0.5.0)・作成
  器の案の章の要約: 候補を 5 つ並べます。 起こさずに理由の語で断る案 (選んだ案)、 ADR-1041 のまま妥協の口座で席を立てる案、 閾値だけを外して選び直す薄い妥協の案、 候補が現れるまで起動の中で待つ案、 群の口座へ倒す案です。
  器の専門語の説明: 本文に出てくる専門語 10 個を、 やさしい言葉で説明します。
  ・席の起動（seat launch）: 器の seat launch が役割と口座から起動行を導き、 登録 row を先に書いて tmux の窓の shell へ差し込むこと (FR1059・ADR-1026)。 口座は群の今の口座・口座の引数・session 用の選定のどれかで決まる。
  ・口座選定（account selection）: 宣言した口座と実測した残量から 1 本の関数が口座を選ぶこと (FR1036)。 session 用は閾値未満で余裕が最大の口座を選び、 無い周は候補なしの理由を返す。
  ・候補なしの理由（no-candidate reason）: 選定が候補を返さない周の閉じた 4 語。 over-threshold (閾値以上)・all-limited (上限に当たった)・unmeasured (測れない・口座 0 も)・excluded (FR1036 の session 用の除外集合 = 自席の鍵の外の登録 row の口座)。 複数が当たる周はこの順で前の 1 語。
  ・妥協の起動（compromise launch）: 閾値未満の候補が無い周に、 上限に当たっていない測れた口座のうち閾値以上の口座、 それも無ければ他の役割の口座 (役割が 1 つの今は他の置き場の席の口座) との同居も入れた口座で席を起こすこと (ADR-1041 の 2 段・over-threshold と shared-with-role)。 ADR-1041 が決め、 code には無かった。 本 ADR で器は持たないと決める。
  ・妥協の通知（compromise notice）: ADR-1041 が決めた、 既に立っている席の口座が閾値以上で選び直しの候補が無い周に、 管理 tick が 1 回だけ注入する行。 管理 tick の軸ごと ADR-1045 §2 (2) で消え、 code にも無い。 戻った管理 tick にも、 本 ADR で器は持たせないと決める。
  ・群の今の口座（group effective account）: project の群の席が使う口座で、 器が host の根に群ごとに高々 1 件で持つ (ADR-1049)。 群の置き場の席の起動は選定を撃たずにこの口座を使う。
  ・登録 row（registration row）: 席の役割と置き場を鍵に、 口座と起動行を持つ fleet の event log の 1 件 (FR1040)。 席の起動は key を送る前にこれを書き、 候補なしで断った周は書かない。
  ・実効の口座（effective role account）: 役割の席が使うと器が役割ごとに解く口座 (ADR-1041)。 器は持たず、 群の今の口座に置き換わった (ADR-1049)。 席の口座は群の今の口座か口座の引数か session 用の口座選定 (FR1036) で決まる (FR1059)。
  ・実効の記録（effective role record）: 器が host の根に役割ごとに高々 1 件書く、 役割の実効の口座の記録 (ADR-1041・妥協の理由も載せる形だった)。 器は持たず、 群の今の口座の記録 (ADR-1049) に置き換わった。
  ・対話面（dialogue surface）: user と器が承認や裁定をやり取りする、 ちょうど 1 つの面 (C7)。 orchestrator の席がこれを持つので、 席が立たない間は対話面も無い。
  器の頁の末: このページは、大もとの機械データ (正本) から自動で組み立てられています。構造は機械が自動で検査し、内容が元データに忠実かは独立のレビューで確かめます。
