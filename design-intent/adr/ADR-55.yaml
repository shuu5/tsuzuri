# 判断の記録 ADR-55 — 相談の話す窓を群の口座の移動に付いて来させ（窓の手すきを待ち、同じ作業場で席の今の口座に開き直し、会話を続ける）、窓の記録に口座と会話の id を持たせ、口座の board に窓を並べる（持ち主の裁定 2026-10-05・記帳先 = tsuzuri の台帳の問い t3-hub.88.1.1 と t3-hub.88.1.2 の notes）
# 判断の記録 ADR-29 の決定 (5) と (7) の字のうち、この記録の決定 (1) が名指す字だけを置き換える（部分の置き換え・ほかの決定と字は効いたまま）。ADR-29 は封の一覧で本文が凍っているので本文は変えない（前例 ADR-29 の頭の注・ADR-53・ADR-54）。
# 起草は係 w183a（2026-10-05）。材料は問い t3-hub.88.1.1 と t3-hub.88.1.2 の本文と、係 w183a の調べ（drafts/w183a/w/notes.md の 1〜6 節）と、検証役 qv182 の確かめ（drafts/qv182/w/notes.md）。
# 仕上げは係 w184a（2026-10-05・main 9d94cb38 の判断の記録 ADR-54 の後に合わせ、行の割りと置くノート surface-wave29b を決定 (6) に書いた）。言付けと Remote Control と状態の 1 行は決めず、後の改めか新しい記録で足せる形にした。
id: ADR-55
title: 相談の話す窓を群の口座の移動に付いて来させ、窓が手すきの時に同じ作業場で席の今の口座に開き直して会話を続け、窓の記録に起こした時の口座と今の会話の id を持たせ、口座の board に窓を口座つきで並べる（ADR-29 の決定 (5)(7) の部分の置き換え）
status: accepted
date: 2026-10-05
context: |
  判断の記録 ADR-29 の決定 (5) は、起動の口が席の環境の口座の置き場（器が群に割り当てた今の口座）を継いで窓を起こすと決め、群の移動の時は開いている話す窓は前の口座のまま動き続け、上限で止まったら同じ作業場で開き直し、作業場の控えと前の所見から続けると決めた。器の移動は登録した席だけを起こし直すので、窓は前の口座に残る（ADR-29 の文脈の器の席の答え (4)）。
  2026-10-05 の群の移動で、席は新しい口座で起こし直され、会話は器が運ぶ会話の id の続き（--resume）で続いた。相談の話す窓（cw1）は前の口座のまま動き、会話を書き続けた（係 w183a が process と会話の記録の時刻で確かめた）。持ち主は、窓も群の口座の移動に付いてくるべきで、口座の board に窓が出ていないので整理し、今の窓の会話をそのまま引き継いで続けたいと求めた（memo の札（t3-hub.88.1））。
  係 w183a の調べ。どの口座の置き場の会話の記録の置き場も同じ 1 つの dir を指す symlink で、どの口座からも同じ会話の file が見える（V）。器の席の移動は、同じ作業の dir（anchor）から会話の id を --resume で運ぶだけで、会話の記録を写さない（器の code・D）。窓の記録（作業場の窓の控えと process の印）は、起こした時の口座も会話の id も持たない（D）。口座の board の session の行の種類は、席と便の 2 つに閉じていて、窓を読まない（D）。Claude Code は会話の id を名指す続き（--resume）と、続きを新しい id で写す旗（--fork-session）と、会話の id を決めて起こす旗（--session-id）を持ち、起動の口が渡す設定（--settings）の hook は制限の形（--restricted）でも効く（ADR-29 の守りの hook がこの形で動いている・D）。会話の始まりの hook（SessionStart）の入力は会話の id と始まりの種類（startup・resume・clear・compact）を持つ（公式の文書・D）。
  検証役の確かめ（qv182）。口座の置き場を替えて同じ作業の dir から --resume で続けると、前の会話がそのまま続き、会話の記録は写しなしで同じ file に足され、制限の形と設定と囲いの下でも妨げが無い。新しい口座では作業の dir の信頼の問いが出て、押すまで止まる（信頼は口座ごとの設定 file に在り、親の dir の信頼を継ぐ）。前の process が生きたまま同じ会話の id で続けると、2 つが同じ file に書いて会話が 2 枝に割れ、後で続けた時に片方の turn が落ちる。設定の hook は制限の形の下でも撃たれ、会話の始まりの hook の入力は会話の id と始まりの種類（見えた種類は startup・resume・clear・fork）を持ち、消し直し（/clear）と窓の中の選び直しの後は新しい id で撃たれる（使い捨ての作業場と model の haiku で撃った・検証役の記録（drafts/qv182/w/notes.md）・V）。
  問い（t3-hub.88.1.1）は、窓が移動に付いてくる形（tsuzuri だけを直す・器が起こす・付いてこない）を持ち主に問い、案 A（tsuzuri だけを直し、口座の board に窓を出す）に裁定された。問い（t3-hub.88.1.2）は、今の窓の会話の引き継ぎ方（同じ窓を開き直す・新しい窓に写す）を問い、案 A（同じ窓のまま同じ作業場で新しい口座に開き直す）に裁定された（裁定 id は承認の欄）。
decision: |
  (1) 置き換える字。ADR-29 の決定 (5) の「群の移動の時、開いている話す窓は前の口座のまま動き続け、上限で止まりうる。止まったら持ち主か席が同じ作業場で開き直し、作業場の控えと前の所見から続ける。」を、「群の移動の時、開いている話す窓は、判断の記録 ADR-55 の決定 (3) で席の今の口座へ移る。止まった話す窓を持ち主か席が同じ作業場で開き直す時も、窓の記録の最後の会話の id を継いで会話を続け、会話の id が無い時だけ作業場の控えと前の所見から続ける。」に置き換える。ADR-29 の決定 (7) の「設定は次を置く。」の列の末（判断の記録 ADR-54 が足した (キ) の後）に、次の (ク) を足す。(ク) 会話の印の hook（会話の始まり・持ち主の入力・turn の終わり）を置き、印の口に窓の作業場の決まった 1 file だけを書かせる。この hook は守りの hook でなく、断らない。ほかの字（決定 (5) の口座の継ぎ方・閉じた環境の列・問う窓の扱い・新しく開く窓の口座・作業場を残す字と、決定 (7) のほかの項と、その後の部分の置き換えの字）は効いたまま。
  (2) 窓の記録。起動の口は、起こすごとの process の印に、起こした時の口座の置き場（席の環境の口座の置き場の環境変数の値）を書く。会話の印の口は、作業場の決まった 1 file に、時刻と、手すきか忙しいかと、今の会話の id と、始まりの種類を 1 行ずつ足す。消し直し（/clear）の後も、新しい会話の id を拾う。印の口が書くのは、起動の口が窓ごとに決めて hook の命令に置いた作業場の、その 1 file だけとする。
  (3) 付いてくる形。席の相談の見張りは、生きている話す窓の process の印の口座が、席の今の環境の口座と違う時に、固定の 1 行で席を起こす。席は付いてくる口（起動の口の続きの形）を撃つ。口は、窓の会話の印の最後が turn の終わり（手すき）になるのを待ち、tmux の窓を名を確かめて閉じ、前の process が無いことを確かめてから（生きたまま同じ会話の id で続けると会話が 2 枝に割れる）、同じ作業場で、席の今の口座で、最後の会話の id を継いで窓を起こし直す。起動の口は、起こす前に、起こす口座の置き場の設定 file に、その窓の作業場 1 つだけの信頼の印を置く（新しい口座では信頼の問いで窓が止まるため・器が席を起こす前に anchor の信頼の印を置くのと同じ形で、同じ dir の一時 file からの置き換えで書き、既に在れば書かない・起草の置き場やその親は信頼に足さない）。会話の印は会話の id（session_id）で取り、transcript の path は使わない（別の作業の dir から続けた時の会話の始まりの hook の path は在らない file を指す）。持ち主が打ちかけて送っていない字を消さないため、入力欄が空かを照らせる形を作る行の試作で決め、照らせない間は手すきだけを待つ。待ちに上限を置き、越えたら起こし直さず、見張りの 1 行で席に知らせ、席が持ち主に問う。付いてくる起こし直しは、窓の閉じ（ADR-29 の決定 (3) の持ち主が閉じる）に数えず、台帳には相談の開きの行を撃ち直しの印で書き、相談の閉じの行は書かない。問う窓は付いて来させない（短く終わり、止まれば今の撃ち直しの道）。閉じた窓と退いた窓も付いて来させない。
  (4) 口座の board。口座の board は、project ごとに相談の窓の作業場を読み（読むだけ）、閉じていない窓ごとに、session の行の種類「相談の窓」で、窓の名・口座（process の印の口座の置き場の名）・状態（生きている・止まった）・開いた時刻を並べ、窓の口座が群の今の口座と違う時は印を出す。project board の相談の窓の一覧にも、窓ごとの口座を出す。口座の印を持たない窓（この記録の前に起こした窓）の口座は「分からない」と出す。
  (5) 今の窓。この記録の行の着地の後、席は今の話す窓（cw1）を閉じずに、同じ窓のまま同じ作業場で席の今の口座に開き直し、会話を続ける（問い t3-hub.88.1.2 の案 A）。この記録の前に起こした窓は会話の印を持たないので、席が会話の id を名指して付いてくる口に渡し、手すきを測れないので、開き直す前に持ち主に今開き直してよいかを確かめる。
  (6) 測り方。起動の口の検めは、設定に会話の印の hook が無い形と、続きの旗の値が会話の id の形（uuid）でない形を断る。process の印の口座・会話の印の 1 行・見張りの口座のずれの 1 行・付いてくる口の待ちと閉じと起こし直し・口座の board の相談の窓の行は、歯で測る（ノート surface-wave29b の契約表の行 cs-acct-mark・cs-resume・cs-follow・c-acct-consult・e-acct-consult）。要件 FR19 の字を同じ commit で改める（要件書の版上げ）。
options:
  - id: a
    name: 席の見張りが口座のずれを拾い、手すきを待って同じ作業場で開き直し、会話を続ける（tsuzuri だけを直す）
    text: 決定 (1) から (6)。
    verdict: adopted
    reason: 持ち主の手を足さずに、窓が会話ごと新しい口座へ移り、前の口座を上限まで使い続けない。器の席の移動と同じ考え（turn の終わりを打刻で待つ・会話の id を --resume で運ぶ・会話の記録を写さない）を窓に写すだけで、器を替えない。作業場が同じなので、会話の中の file の path がそのまま効く。
  - id: b
    name: 器の移動が窓も起こし直す
    text: 器の群の段が、席を起こし直す時に、project が宣言した付いてくる物の口も撃つか、窓を器に名乗らせる。
    verdict: rejected
    reason: 器の要件の改訂と判断の記録と契約が要り、器の行の列の後ろに並ぶ。器が tsuzuri の相談の窓を知ることになる。窓を器に名乗らせる形は、器の席の行と窓を置き換え、器の plugin の守りと噛み合わない（ADR-29 の案 b と同じ理由）。
  - id: c
    name: 付いて来させず、開き直しで会話を続けられるようにだけする
    text: 決定 (5) の前の字のまま前の口座で動かし、止まった時の開き直しにだけ会話の id の続きを足す。
    verdict: rejected
    reason: 持ち主の求め（付いてくるべき）に応えない。移動の後も前の口座を使い続け、上限で止まるまで気づかれない。
  - id: d
    name: 新しい窓を開いて前の窓の会話を写す
    text: 前の窓を閉じて新しい窓を開き、前の窓の会話の写し（--fork-session）から続ける。
    verdict: rejected
    reason: 新しい窓の作業場は別の path なので、会話の記録の写しか別の dir からの続きが要り、会話の中の前の作業場の file に新しい窓の囲いから書けず読む道具も届かない。前の窓を閉じると、所見の処分の後に作業場が退きの置き場へ動き、会話の path がさらにずれる。新しい口が 2 つ要る（問い t3-hub.88.1.2 の案 B）。
  - id: e
    name: 各口座で起草の置き場の親を 1 度信頼しておく
    text: 口座ごとに、窓の作業場の親の dir（席の起草の置き場）を 1 度信頼し、親の信頼を継がせて信頼の問いを出さない。
    verdict: rejected
    reason: 信頼の範囲が、窓の作業場から起草の置き場の全部（ほかの係の写しを含む）へ広がる。口座が増えるたびに持ち主か席の手が要る。
  - id: f
    name: 開き直しのたびに持ち主が信頼の問いを押す
    text: 起動の口は信頼の印を書かず、新しい口座で開き直した窓の信頼の問いを持ち主が 1 度押す。
    verdict: rejected
    reason: 持ち主の手を足さないという求め（問い t3-hub.88.1.1 の案 A）に反し、持ち主が居ない間の移動では窓が問いで止まり続ける。
basis: [ADR-29, ADR-54, FR19]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo の札（t3-hub.88.1）か後継の memo の notes に 1 件ごとに記帳する。数える材料は、器の群の移動の event と、窓の process の印と会話の印と、相談の開きの行（撃ち直しの印）と、見張りの 1 行と、持ち主の言葉。問う相手は持ち主。
    (1) 着地の後の 30 日の内に、群の移動の後 30 分を越えても前の口座のまま動いていた話す窓（付いてくる口が起こし直せなかった窓）が 2 件になったら、形を問い直す（案 b を含む）。
    (2) 付いてくる起こし直しで、持ち主の打ちかけの字が消えたか、turn の途中で窓が閉じられたと分かった事が 1 件でもあったら、待ち方を問い直す。
    (3) 会話の id を継いだ起こし直しで、会話が続かなかった（前の会話が見えない窓が開いた）事が 1 件でもあったら、続きの形を問い直す。
plain: |
  相談の窓を、口座の切り替えに付いてくるようにする記録です。
  今は、project の群の口座が移ると、席だけが新しい口座で起こし直され、開いている窓は前の口座のまま動き続けます。今朝の移動でも窓（cw1）は前の口座に残りました。
  これからは、席が「窓の口座が席と違う」に気づき、窓がひと区切り（答えを返し終えた所）になったら、同じ作業場のまま新しい口座で窓を開き直します。会話はそのまま続きます。あなたの手は要りません。打ちかけの字を消さないよう待ち、待ちきれない時は開き直さずにあなたに聞きます。席に問う形の窓（問う窓）は短く終わるので付いてきません。
  窓の記録に、どの口座で起こしたかと今の会話の番号を残します。口座の board には、相談の窓を口座つきで並べ、群の口座とずれている窓に印を付けます。
  今の窓（cw1）は、直しが着地した後に、閉じずに同じ窓のまま新しい口座で開き直し、会話を続けます。その時は、開き直してよいかをあなたに先に聞きます。
  付いてこなかった窓が続いたり、打ちかけの字が消えたり、会話が続かなかったりしたら、形をあなたに問い直します。
approval:
  who: 持ち主
  date: 2026-10-05
  ruling: t3-hub.88.1.1（裁定 id = t3-hub.88.1.1:20261005T0058Z-1・案 A・tool の呼び・notes に逐語）と t3-hub.88.1.2（裁定 id = t3-hub.88.1.2:20261005T0058Z-1・案 A・tool の呼び・notes に逐語）・束 batch:20261005T0058Z-1
  verbatim: "どちらも推奨で良い"
  surface: R-8
consequences:
  - 席と相談の窓の間の言付け（席から窓へ・窓から席へ）は、この記録で決めない。問い（t3-hub.88.1.3）の裁定を受けて、この記録の改めか新しい記録で足す。会話の印の hook と印の口は、言付けの受けにも使える形にしておく（印の口は知らない事の入力を書かずに 0 で返すので、hook の事を足しても窓を止めない）。
  - Remote Control と状態の 1 行（status line）は、この記録の外とする（別の問いで決める）。足す時は、ADR-29 の決定 (7) の設定の列にこの記録の (ク) の次の文字で足せる。
  - 付いてくる口は、席が起き直して見張りを置き直した後に撃たれるので、移動から数分は窓が前の口座で動く。
  - 会話の印の口は囲いの外で持ち主の権限で走り、作業場の 1 file に書く。ADR-29 の守りの hook（読むだけで書かない）とは別の口とする。
  - 同じ会話を 2 つの process が書かないよう、付いてくる口は前の process が無いことを確かめてから起こす。
  - 起動の口が口座の置き場の設定 file に信頼の印を書くのは、器の口座の管理（器が席の anchor の印を置く）と同じ file を、窓の作業場の 1 行だけ書く形とする。器の口座の管理の口が窓の作業場の信頼を置けるようになったら、そちらへ移す。
  - 窓の中の選び直し（/resume）の並びは、窓の名がどれも同じなので名で見分けられない（時刻と大きさだけ）。持ち主の手での選び直しに頼らず、会話の印の会話の id で続ける。
note: 起草は係 w183a・仕上げは係 w184a（2026-10-05）。承認の欄の逐語と経路は、適用の script が台帳の問い t3-hub.88.1.1 と t3-hub.88.1.2 の notes の定型行から読んで入れた。
