# 判断の記録 ADR-51 — 段 3「AI に届ける」の近い仕様の組み方・審査役の上限・契約の審査の条の読み（持ち主の裁定 2026-10-04・記帳先 = tsuzuri の台帳の問い t3-hub.80.7・t3-hub.80.8・t3-hub.80.9 の notes）
# 起草は係 w161a（2026-10-05）。材料は係 w150a の調べ（drafts/w150a/w/notes.md・questions.md・sizes.tsv・neigh.tsv・cases.tsv）。承認の欄は 3 つの問いの裁定。
id: ADR-51
title: 実装の AI と審査役に渡す近い仕様は、設計の層を設計を書いた時に tz derive が契約表の導出物の欄に束ねて器が写し、code の層は段 2 の後に器の受付で足し、審査役の上限 150,000 byte は替えずに内側へ塊ごとに収め、契約の審査にも条の規範文を渡して観点を増やさずに観点 1 の読みを広げる
status: accepted
date: 2026-10-04
context: |
  ADR-44 の段 3（AI に届ける）は、実装の AI（runner）と審査役の材料を、グラフの近傍（要件の本文・判断の記録・条・受入基準・触る code の過去の行）から組むとした。
  今の材料（係 w150a・本番の 616 便・423 bead・V）。runner の指示は雛形と契約の写しだけで（中央値 19,320 byte・byte の上限なし）、要件・判断の記録・条・規則の行・受入基準の本文は 0。契約の審査は、芯（契約・設計の節・要件・done の項目）が上限（器の規則の行 gate.token_cap・150,000 byte）を越えたら審査せず判定の決まらない（INCONCLUSIVE）とし、base の要約と外の材料を残りに塊ごとに収める（芯の中央値 25,646 byte・残りの中央値 117,862 byte・下から 1 割 79,445 byte・外の材料は 192 便で切られた）。設計の節は goal と同じ字で 2 度載る（614 便・中央値 9,431 byte）。gate の審査役は上限を diff の本文だけに当て（中央値 28,507 byte）、要件の本文も受けない。憲法を読むのは gate の審査役だけで、契約の審査の雛形には憲法の字が無い。
  落ちの判じ（14 件）。設計の層の近傍で防げた物 5・防げた見込み 2・code の層が要る物 6・材料では防げない物 1。gate で条の違反として落ちた 2 件（t3-hub.52.179 の条 P-7・t3-hub.74.59.10 の条 P-2）は、どちらも起草の側の欠陥で、契約の審査は通し、実装と gate の 1 周を使った後に落ちた。条 P-7 の件は行の要件の根拠から辺では届かず、規範文の全部の写しでしか拾えない。
  近い仕様の大きさの見積もり（I）。1 便 中央値 4,571 byte・上から 1 割 10,654 byte・最大 35,564 byte。
  問いは 3 つで、組む所（t3-hub.80.7）は案 A、上限（t3-hub.80.8）は替えない、条の読み（t3-hub.80.9）は案 A に裁定された（裁定 id は承認の欄）。
decision: |
  (1) 組む所（問い t3-hub.80.7）。設計の層の近い仕様（要件の本文・判断の記録の決定・条の規範文・規則の行・受入基準）は、設計を書いた時に tz derive が、生きた設計ノートの行ごとに契約表の導出物だけの欄（context）へ束ねる。器はその欄を読んで便の契約の写しに写し（runner は契約の写しごと受ける）、2 つの審査役の材料に足す。器は欄の中身を組まない。code の層（触る file を最後に書いた着地の行・file を読む既存の歯・近い定義）は導出物に入れず（着地ごとに替わる字を入れると main で導出の照らしが赤になる）、段 2 の commit の節点（ADR-46 の決定 (2)）の着地の後に、器の受付で宣言の口（宣言の任意の鍵）を撃って足す。名指しで引けない id は 1 つの塊として出し、黙って落とさない（条 P-7）。
  (2) 審査役の上限（問い t3-hub.80.8）。上限（150,000 byte）の値は替えない。契約の審査は、芯を今のとおり数え（越えたら審査せず判定の決まらない形のまま）、近い仕様は芯の後・base の要約の前に塊ごとに収める。gate の審査役は diff を先に数え（diff が越えた時の判定の決まらない形は今のまま）、近い仕様は残りに塊ごとに収める＝gate の上限が数える物は diff から diff と近い仕様に広がる。収まらない塊は落とし、落とした塊を 1 行で知らせる（条 P-7）。runner には byte の上限を置かず全部を渡す（1 便の token の線は替えない）。設計の節が goal と同じ字で 2 度載る分を外す器の行（v-review-dedup）を先に流す。
  (3) 条（問い t3-hub.80.9）。契約の審査にも、行の根拠と要件の根拠が指す条の規範文と、憲法の規範文の全部の写し（ADR-38 の決定 (3) の全文の写し・約 15 キロバイト（KB））を渡す。審査の観点は増やさず（設計の節との適合・状態遷移の一周・write-set の連鎖の 3 つのまま）、観点 1 の「設計の節と食い違わない」の読みを「節と、節が拠る条と食い違わない」に広げる。条 N-5.1 は文書の型ごとの AI の係や検査の観点を増設する変更を拒む文で、在る観点の読みを広げて材料を足す変更はこれに当たらないと読む。
  (4) 順。器の契約表の読みが新しい欄（context）を受ける行を、tz derive が欄を書く行より先に着地させる（器の読みは知らない鍵の表を表ごと断るため）。行の割りと塊の順と深さは係（w150a）の案から始める。近い仕様を組む純関数と tz の口が着地した後に、今の契約で近い仕様を実の字で測り直し、設計の層で防げた 7 件の欠けた字が塊に入るかを照らしてから、器の行を起こす（ADR-44 の決定 (4) と同じく、まず測る）。
options:
  - id: a
    name: 導出物の欄で束ね、上限の内に収め、条を渡す
    text: 決定 (1) から (4)。
    verdict: adopted
    reason: 中身が設計の commit で決まり、席と係と受付の下見が置く前に同じ字を見られ、審査の先撃ちの鍵も揺れない。上限を上げずに大半の便で全部入り、新しい閾値を足さずに済む。条の違反が実装と gate の 1 周の前に見つかる。失うのは、契約表の導出物が行ごとに中央値 約 4.6 KB 太ること・code の層が段 2 の後まで渡らないこと・外の材料が今より早く切られること・契約の審査の材料が 15 KB 前後増えて条の読みで不合格が増えうること（今 gate で落ちている物が 1 段前に移る見込み）。
  - id: b
    name: 便を起こす時に器が組む
    text: 最初から器の受付で宣言の口を撃ち、便の base の木と git から設計の層と code の層を組む（問い t3-hub.80.7 の案 B）。
    verdict: rejected
    reason: 1 つの仕組みで済むが、器が tz の binary に実行時に頼り、落ちた時の扱いと版の固定が要り、席は受付の下見を撃たないと中身を見られない。
  - id: c
    name: 渡さず AI に引かせる
    text: runner の許す命令に tz を足して引かせる（問い t3-hub.80.7 の案 C）。
    verdict: rejected
    reason: byte を食わないが、係 419 本の起草で近傍の口を材料に使った跡は 2 件ほどで、審査役は命令を撃てない。
  - id: d
    name: 近い仕様の分だけ上限を上げる
    text: 審査役の上限の値を近い仕様の分だけ上げる（問い t3-hub.80.8 の案 B）。
    verdict: rejected
    reason: 新しい値の裁定が要り、上げなくても大半の便で全部入る。
  - id: e
    name: 契約の審査に条を渡さない
    text: 条 N-5.1 を狭く読み、条は gate の審査役だけが読む（問い t3-hub.80.9 の案 B）。
    verdict: rejected
    reason: 起草の側の条の違反が、実装と gate の 1 周を使った後にしか見つからない。
basis: [ADR-44, ADR-46, ADR-38, N-5, P-7, P-2]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo（t3-hub.80）か後継の memo の notes に記帳する。問う相手は持ち主。
    (1) 近い仕様を審査役に渡す行の着地の後の 2 週で、契約の審査か gate の判定の決まらない形（上限の越え）が着地の前の 2 週より増えたら、塊の収め方と上限を問い直す。
    (2) 同じ 2 週で、近い仕様の塊を落とした便が、渡した便の 1 割を越えたら、上限の値を問い直す。
    (3) 条を渡す行の着地の後の 2 週で、契約の審査が条の読みで不合格にし、席が審査の誤りと判じて撃ち直した便が 3 本を越えたら、観点 1 の読みの広げを問い直す。
plain: |
  作業を実装する AI と審査する AI に、その作業に近い仕様（要件の本文・判断の記録・憲法の条・規則・受入の基準）を機械が束ねて渡す形を決める記録です。今は 0 しか渡っていません。
  束ねるのは設計を書いた時で、機械が設計から作る表に欄として書き、器はそれを写すだけにします。code に近い材料は、code の図の土台ができた後に、作業を起こす時に足します。
  審査役に渡す字の上限（150,000 byte）は替えず、その内側に塊ごとに収め、収まらない塊は落として 1 行で知らせます。
  実装の前の審査にも憲法の条の文を渡し、今の観点の中で「設計が拠る条に反していないか」も読ませます。観点の数は増やしません。
approval:
  who: 持ち主
  date: 2026-10-04
  ruling: t3-hub.80.7（裁定 id = t3-hub.80.7:20261004T2037Z-1・組む所は案 A）と t3-hub.80.8（裁定 id = t3-hub.80.8:20261004T2037Z-1・上限は替えない）と t3-hub.80.9（裁定 id = t3-hub.80.9:20261004T2037Z-1・条を渡すのは案 A）・束 batch:20261004T2037Z-1・裁定面・notes に逐語
  verbatim: "すべて推奨で承認する"
  surface: R-8
consequences:
  - 行の割りの案（係 w150a）は、グラフに依らない 2 行（設計の節の二重を外す v-review-dedup・gate に要件の本文を渡す v-gate-req）を先に、次に近い仕様を組む純関数・tz の口・器の欄の読み・導出の欄・審査役の穴の順。後段に code の層の 2 行。置き場のノートは席が決める。
  - 同じ組み手を tz の口にも出し、席と係が起草の時に近い仕様を引けるようにする（落ちの多くは起草の側で、器の材料だけでは起草の前に効かない）。
  - ADR-44 の退きの条件 (1)（本番の 1 回目の着地の率）は、この記録の行の着地にも掛かる。
note: 起草は係 w161a。数は係 w150a の測り（main の木と 2026-10-05 の 616 便の便の作業の dir）による。
