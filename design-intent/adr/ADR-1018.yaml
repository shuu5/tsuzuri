basis: [FR1023, FR1026, FR1027, FR1028, FR1029, NFR1003, AC1008, ADR-1004, ADR-1013, ADR-1014, ADR-1015, ADR-1017, CON1002]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  作業記憶にまつわる機械の仕事を 3 つの subcommand に分けます。 「退避」は file を作る、 「復元」は file と台帳を突き合わせて事実の行 (DATA) を出す、 「消費」は使い終えた file を移動する。 判断 (今どこにいて次に何をするか) と、 それを人に読める文章にする仕事は、 これまでどおり開発 session が担います。 復元は何も書きません。 起票が要りそうな項目も「候補」として並べるだけで、 台帳には触りません。
approval:
  who: 持ち主
  date: 2026-09-12
  ruling: "s2-07l.61（器の台帳の id・器の記録の承認の欄が名指す・取り込みの裁定 t3-hub.74.60.1:20261004T0113Z-1）"
  verbatim: "器の台帳 s2-07l.61 の notes に在る（この file に写さない）"
  surface: R-8
consequences:
  - "良い面は、 退避と復元の機械の部分が Rust の歯で守られ、 session id の取り違えが構造として消え、 出所の無い規則が周を越えて生き残らなくなり、 前の版への依存が切れることです。 悪い面は、 共通 skill の書き換えという repo の外の作業が要ること、 器が持つ subcommand と enum が増えること、 前の版が持っていた便利な観測 (飛行中の agent の列挙・user 発言の自動抽出) が当面無くなることです。"
  - "Positive: 機械層が Rust の歯 (C12) と typed enum (C3.3 / C11) で守られ、 前の版の bats と python から離れる (C8)。 sid を打刻から取るため role 誤解決の事故 (memory 記録) が構造として消える。 暫定行が次の cycle に載らないため N2 の向き (prose にしか無い規則は規則でない) が機械で守られる。 復元が read-only ゆえ全 role が回しても台帳への越境 write が出ない (C15)。 優先順位が enum の宣言順にあり散文注記を持たない (C2)。"
  - "Negative (受け入れるコスト): subcommand 3 つ・閉じた enum 3 つ (PointerKind・実在の 3 値・DATA の marker) と境界 enum 3 つ・Guard 2 つ・rules 行 2 つ (seat.wm_directive_cap・seat.ledger_timeout_s・いずれも契約が裁定 id 付きで manifest に足すまでは本 ADR の予定行であり、 C14.2 の相互参照は行が manifest に在って初めて成立する) が増える (core の行数は R-C4-1 の内側で測る)。 global skill 2 本の書き換えと前の版 script の退役は本 repo の外 (user の操作)。 前の版の overlay (飛行中 agent / WF の列挙・transcript digest) は当面持たない (§2.5)。 開発 session が退避物を直接書けなくなるため、 計画弧と新規命令行を typed な入力 file で渡す手間が 1 段増える。"
