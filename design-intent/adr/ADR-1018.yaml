  器の記録の前置き: 本 ADR は IETF RFC 2119 および RFC 8174 / BCP 14 に定義される MUST / SHALL / SHOULD / MAY のキーワード解釈規約に従う。 ADR は決定時点の記録であり、 改訂は新しい ADR による supersede で行う。 本 ADR の §2 は user 裁定 (2026-09-12) を受けた決定で、 §3 は SRS への pointer である。 要件 (FR1023 / AC1008) は本 ADR より先に SRS v0.5 へ入っており、 本 ADR は要件の文面を持たず、 理由・形・却下案 だけを持つ。 本 ADR は ADR-1004 §2.2 面 3「台帳 (bd) の read / write を行わない」のうち read の禁止だけを、 復元の subcommand が bd --readonly を子 process で読む 1 点に限って supersede する (write の禁止と「台帳 adapter は MVP 外」は不変)。 退避物の file 名・消費の suffix・move の作法は SRS FR1023 が固定済みで、 本 ADR はそれを変えない。
