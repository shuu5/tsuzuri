plain: |
  本体は「どの commit から build されたか」を自分の中に持ち、 --version と doctor で名乗ります。 git が無いなど測れないときは「不明」と名乗り、 それらしい値をでっち上げません。
approval:
  who: 持ち主
  date: 2026-09-15
  ruling: "s2-07l.268・s2-07l.303（器の台帳の id・器の記録の承認の欄が名指す・取り込みの裁定 t3-hub.74.60.1:20261004T0113Z-1）"
  verbatim: "器の台帳 s2-07l.268・s2-07l.303 の notes に在る（この file に写さない）"
  surface: R-8
consequences:
  - "良い面は、 複数の project で「黙って古くなる」版が無くなること (器が測り、 器が名指し、 器が作り直す)、 更新の手順を人が覚えなくてよいこと、 素の session の起動が器の視野に入り前の版の wrapper を退役できることです。 悪い面は、 hook の引数と席の記録が 1 つずつ増えること、 配線が変わるたびに planner / admin の席が作り直される (数分の空白) こと、 更新の口が git と cargo を子 process として呼ぶことです。"
  - "Positive: 版の provenance が型で在る (C10)。 doctor が全導入先を 1 関数で突合する (C3.2)。 install の記録が append-only の 1 store (C6.3)。 配線の食い違いを人手なしで直す (C9)。 通知の散文が消える (N2)。 wrapper への依存が切れる (ADR-1009 §1 の根因と同型の外部 script を 1 本減らす)。 rules 行を足さない (C5 非該当)。"
  - "Negative (受け入れるコスト): hooks.json の全 command に引数 1 つ (生成物の drift 検査が守る)。 席の記録 file 1 つ (打刻の置き場の隣)。 配線が変わるたびに登録席の作り直し (退避 → /exit → 立て直し・数分の空白・退避物は保たれる)。 更新の口が git と cargo を子 process で呼ぶ (timeout は唯一の wait・失敗は typed)。 [[vessel]] の宣言が無い host では head=undeclared と更新の拒否 (宣言は user の 1 回の準備)。 digest の実装 (FNV-1a) を器が持つ (10 行・依存なし)。"
note: |
  器の元の file: scribe2/design-intent/decisions/ADR-0028-consumer-sync-is-measured-and-updated-by-the-vessel.html
  器の記録の頭: Status: accepted · Date: 2026-09-15 · version 0.4.6 (拘束する constitution の版) · C3.2 / C6.3 / C9 / C10 / N2 の適用を記録し、 ADR-1026 §2.1 の host の manifest に表を 1 種、 ADR-1017 §2.1 の event に kind を 1 つ、 ADR-1026 §2.3 の起動行に役割なしの形を 1 つ足す (supersede しない・追補) · 要件は SRS v0.11 (FR1060 / FR1061 / FR1062 / 器の要件書に無い受入の番号 30（元の字は AC と 30 を続けた受入の id・食い違い D12） / AC1031 / 器の要件書に無い受入の番号 32（元の字は AC と 32 を続けた受入の id・食い違い D12）) が正本
  器の記録の前置き: 本 ADR は IETF RFC 2119 および RFC 8174 / BCP 14 に定義される MUST / SHALL / SHOULD / MAY のキーワード解釈規約に従う。 ADR は決定時点の記録であり、 改訂は新しい ADR による supersede で行う。 本 ADR の §2 は設計判断 (承認 SSOT の 3 クラスに非該当) で、 その向きを定めた user の裁定 2 件 (2026-09-14「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」・2026-09-15「更新の範囲は ff してから build + install」) と user の直命 (複数の導入先の管理方法を構造で既定する・逐語は台帳 s2-07l.268 / s2-07l.303 の notes) を出所とする。
  器の機械の欄 version: 0.4.6 (拘束する constitution の版。 本 ADR は憲法の条文を動かさない)
  器の機械の欄 decided-by: planner (2026-09-15・設計判断) — 向きは user の裁定 2 件 (2026-09-14 12:5xZ 役割なしの起動・2026-09-15 01:0xZ 更新の範囲 = ff → build + install) と user の直命 (導入先の管理方法を構造で既定) が定めた。 逐語は台帳 s2-07l.268 / s2-07l.303 の notes (本 file には写さない)。
  器の機械の欄 stakeholders: Developer, AI Agent, External Reviewer
  器の機械の欄 supersedes: なし (追補)。 ADR-1026 §2.1 の host の manifest の表 (3 種) に [[vessel]] を 1 種、 ADR-1017 §2.1 の event の kind に InstallRecorded を 1 つ、 ADR-1026 §2.3 の起動行の導出に役割なしの形を 1 つ足す。 既存の表・kind・導出は不変。
  器の機械の欄 related: ADR-1004 §2.5 (schema 版・既存の行はすべて読める) / ADR-1015 §2.1 (hook の打刻の置き場) / ADR-1017 §2.1 (event の形) / ADR-1018 §2.3 (rebrief の DATA の marker) / ADR-1020 §2.4 (席の退避と立て直し) / ADR-1022 §2.1 (席の登録 row) / ADR-1026 §2.1 / §2.3 (host の manifest・起動行の導出) / constitution C2 / C2.2 / C3 / C3.2 / C6.3 / C9 / C10 / C10.2 / C11.3 / N1 / N2
  器の却下案の節の要約: 5 つの案を退けました。 「更新のたびに planner が導入先へ 1 行通知する」は散文の手順で、 忘れれば黙って古くなります。 「Claude Code の cache の写しを正とし器が同期する」は読み込み元が版で変わる挙動に依存します。 「Claude Code の帳簿を器が書く」は他人の帳簿で形が変わります。 「配線の食い違いを /reload-plugins で直す」は効くかどうかを器が確かめられません。 「役割なしの起動は wrapper のまま」は器の視野の外に起動経路を残します。
  器の記録の出所（Trace）:
  出所は、 導入先 (folio2・ubuntu-note-system) の planner からの問い合わせと実測、 器の現物、 そして user の裁定と直命です。
  ・user の直命 (2026-09-15・planner の席): 「再現性の高い複数の他の project における適切な管理方法を構造で既定する」「plugin が更新されても新しく入った hook は clear + rebrief では適用されない可能性」。 裁定 (2026-09-15 01:0xZ・grill): 更新の範囲 = ff してから build + install。 逐語は台帳 s2-07l.303 の notes。
  ・user の裁定 (2026-09-14 12:5xZ): 役割なしの起動にも対応する (不測の事態のため)。 逐語は台帳 s2-07l.268 の notes。
  ・導入先の実測 (2026-09-15・folio2 planner の問い合わせ Q1〜Q5・ubuntu-note-system planner の実測): directory source の plugin は cache でなく作業ツリーを読む (2 例)・帳簿の sha は install 時刻で止まる・cache は口座 dir ごとに 1 つを全導入先が共有し最後の install が上書きする・hook 集合は起動時の snapshot で /clear では更新されない。
  ・器の現物 (main d849870): main.rs render_version (版番号だけ)・hooks/hooks.json (全 command が $TMUX_PANE / $CLAUDE_PROJECT_DIR を引数で受ける形)・hook/mod.rs session_start (名乗りと打刻)・fleet/mod.rs EventKind (15 variant)・seat/tick.rs parked_entry (終了の手の入口は合図の出所を持たない = 台帳 s2-07l.307)・account/mod.rs login_line / seat/cycle.rs derive_launch (起動行の導出)。
  ・先行決定: ADR-1026 §2.1 / §2.3・ADR-1020 §2.4・ADR-1017 §2.1・ADR-1015 §2.1・ADR-1018 §2.3・ADR-1004 §2.5。
  ・設計: docs/design/consumer-sync.md (§2〜§6・契約 (a)〜(d))・docs/design/account-lifecycle.md §4.5 (役割なしの起動・契約 (d))。 契約は台帳 s2-07l.302 / s2-07l.303 / s2-07l.307 / s2-07l.304 / s2-07l.268 (本 ADR の land 後に dispatch)。
