# 判断の記録 ADR-20 — 憲法に条 P-28 を新設し、設計ノートの増え方を folio の床の上限で縛る（発効 2026-09-29・憲法 第 1.3 版・記帳先 = tsuzuri の台帳 t3-hub.66.3 notes）
# 出所は控えの memo t3-hub.66（実測・器と folio2 の見立て・案 v0.2）と持ち主の裁定 t3-hub.66.1（案 C = 憲法の増殖の防止に B の検査を仕組みとして付ける・条文の字は別に承認に出す）。
# 反対側からの検証（A-2.3）の記録は docs/grill/2026-09-29-M-growth-article-grill.md（独立の検証役の記録と設計席の処分）。字（見出しと規範文 5 本の型と強さと本文）と規則の表の行 3 本の値の決め方は持ち主が承認した。
# 改訂の欄（amends）は凍結の基準との差分と 1 対 1 に消し込まれる（folio check --emit-amends の出力と同じ）。
id: ADR-20
title: 憲法に条 P-28 を新設し、設計ノートを中間の文書として、生きたノートの本数と行の数の上限を folio の床が数えて落とし、全部の行が着地したノートを廃止にする
status: accepted
date: 2026-09-29
context: |
  前文の順位の「増殖の防止」は判断の規則の 1 行だけで、機構が無い（機構の種類は機構なし（none））。数を縛る規則の表の行は、設計ノートの章の数（行 R-26）だけである。
  控えの memo（t3-hub.66）の実測（2026-09-29 の朝）では、設計ノートは 52 本・7454 行で、上流（要件・判断の記録・憲法）の 3.8 倍あり、36 本は全部の契約表の行が着地したまま残っていた。同じ日の午後（起草の第 2 版の時点）には、生きた設計ノート（状態が下書きか発効）は 78 本で、そのうち 69 本は全部の契約表の行が着地していた（台帳の写しから、全部の行が着地したノートを名指す行の決まりで数えた目安）。1 本の契約表の行の最大は 32（surface-board）、計画だけの行の合計は 20 だった。波ごとに小さなノートを足す運びなので、本数は 1 日で数十本増える。発効の commit の時点の数と束の本数は、その commit の文と行 R-31〜R-33 の値が持つ。
  減らす力を AI の記憶に頼ると忘れられる。持ち主は、器と folio の検査が落ちる形で整える案を一括で進めると答え（持ち主の裁定（t3-hub.66.1）・案 A）、その中の案 C として、憲法の「増殖の防止」に設計ノートの検査を仕組みとして付け、条文の字は別に承認に出すと決めた。同じ答えで、案の第 0.2 版の数の上限の項（B-2）（最初の値は入れる時点の最大以上・退役に合わせて段ごとに下げる）と、着地済みのノートの退役を席が設計の commit で行うことも決まっている。
  folio2 は判断の記録 35 番（発効 2026-09-29）で、数える口 3 つ（生きたノートの本数・1 本の契約表の行の数・計画だけの行の合計）と、索引の 1 行の状態の欄と、設計ノートの後継の欄の先（要件と判断の記録）を足す。便 207〜209 は 2026-09-29 に着地した（folio2 の本流 0c910db）。上限の値は置き場の規則の表の行（欄 key の値 live-notes・note-rows・plan-rows）から読み、行が無ければ まだ分からない とする（床は非 0）。folio は値を持たず、方針も持たない。方針と値は置き場の憲法と規則の表が持つ。
  folio2 の知らせ: folio の組み立てを上げる commit と値の行 3 本を同じにし、値は入れる時点の実測以上にすること。違反の字は今の数を持たない。生きたノートを見本の状態に置くと、承認欄も後継も要らずに数えから外れる穴がある。検証役の写しでは、ほかに 2 つの道が開いていた。下の dir へ動かしたノートは folio が黙って読まなくなり、古い契約の toml は残る。開いた行を持つノートを廃止しても、folio は廃止を特別に扱わず、契約の toml は出続ける。
  全部の契約表の行が着地した設計ノートは、着地済みの行（c-note-stale）の tz graph --check が数と文書 id を名指す（detect・落とさない）。この名指しは設計ノートの状態を読まないので、廃止した後も名指し続ける。
  行 R-32 の値は今 surface-board の 32 に縛られ、行の少ない波のノートには効かない。本数の上限は、行を既に在るノートへ寄せる向きにも働く。計画だけの行の上限は、持ち主の新しい頼みを計画に書く前に、ほかの計画の行の起草を求める。
  条 P-27.2 は、規則の表の行と仕掛けを足す提案に、先に消すものを名指すことを求める。
decision: |
  (1) 憲法に条 P-28（段 いつも守る・縛る相手 both）を新設する。見出しと規範文 5 本は改訂の欄（amends）のとおり。P-28.1 は、中身を移したとき、または全部の契約表の行が着地したときに、後継を名指して廃止の状態にし、設計ノートの置き場の直下に残す。P-28.2 は生きたノートの本数・ノートごとの契約表の行の数・計画だけの行の合計に規則の表の行で上限を置き、床が落とす。P-28.3 は上限を緩めるときに減らせない理由を検証の記録に書く。P-28.4 は、見本の状態に置く道と置き場の直下から動かす道で数えから外すことと、開いた契約表の行を持つノートの廃止を禁じる。P-28.5 は全部の行が着地したノートを廃止まで検査が名指し、猶予の行が在るときは猶予を越えたものを落とす。条 N-1.2 の可逆な移動は、設計ノートでは状態の替え（置き場の直下に残し、状態を戻せば戻る）で満たす。これは条 P-3.2（廃止は状態で表す）と同じ読みである。下の dir へ移す形は、folio が黙って読まなくなり古い契約の toml が残るので採らない。
  (2) 条の機構は組み立て時の検査（build-check）・今（now）・段 post・閉じる側（fail-closed）とする。P-28.2 は folio の床、P-28.1 の後継の実在は folio の床のつながりの検査、P-28.5 の名指しは tz graph --check の detect で、廃止したノートを名指しから外すのは計画の行（c-note-retired）の着地からである。猶予の行は、落とす実装の行と同じ commit で足す。P-28.3 と P-28.4 は設計の commit の審査で人が見る。今（now）の印が本当になるよう、発効の commit は folio の pin を便 209 の着地の後の commit へ上げる commit と同じにする（決定 (5)）。
  (3) 規則の表に閾値の行 R-31（生きたノートの本数・欄 key live-notes・値「<正の整数> 本 以下」）・R-32（ノートごとの契約表の行の数・note-rows・「<正の整数> 行 以下」）・R-33（計画だけの行の合計・plan-rows・「<正の整数> 行 以下」）を足す。どれも種別 deny・段 post・状態 仮・条 P-28。条 P-28 の条の関係の欄（relations.rules）に 3 行を書く（行と条の双方向）。
  (4) 最初の値は、決定 (5) の 1 つの commit の中で、廃止の束の後の実測（folio の床の標準エラーの今の数の行）とする。生きた設計ノートか計画だけの行を減らす commit は、同じ commit で該当の行の値を実測まで下げる。行の裁定の欄と時刻は本判断の裁定のまま替えず、下げの来歴は git の履歴と commit の文（継いだ裁定 id）に残す。上げる変更（緩める側）は条 P-17.4 の検証と持ち主の裁定を要し、P-28.3 の理由を検証の記録に書く。統合で減らせるのは、計画だけの行か、全部の行が着地したノートだけである（開いた契約の行を別のノートへ移すと契約 id が変わり、条 P-3.1 に当たる）。
  (5) 発効は 1 つの commit にまとめる。folio の pin を上げ、folio schema --write で生成区間を書き直す。全部の契約表の行が着地したノートを束にして廃止する（決定 (6)）。値の行 3 本（値は束の後の実測）と条 P-28 と本判断を置き、計画に行（c-note-retired）を足し、凍結の基準と判断の記録の封を足す。束を同じ commit に入れるので、pin と束のあいだに新しいノートを足せない窓は無い。pin の用意が承認より先にできたら、pin の commit を承認まで待たせる（行 3 本の無い pin は床が まだ分からない で非 0 になり、設計の commit が全部止まる）。待てないときは、案の第 0.2 版の数の上限の項（B-2）を承認した裁定（t3-hub.66.1）を行の裁定にし、行 3 本を条 P-2 の下に仮に置き、束と一緒に pin する。条 P-28 の発効の commit で、行の条を P-28 へ替え、この問いの裁定 id を足す（行の変更なので条 P-17.1）。承認が pin より先に来たら、発効を pin の時まで待たせる（条の字だけを先に入れると、行の欄 key を今の pin が読めず床が落ちる）。
  (6) 後継は決定的に決める。中身を移したノートの後継は、移した先とする。全部の行が着地しただけのノートの後継は、計画のノート（行 R-27 の値）とする。計画のノートの行の索引は全部の行とノートの対を持ち、今の pin でも指せる。廃止のときにノートの承認欄に足す行は本判断の裁定を継ぐ（1 本ごとに持ち主に問わない・この委ねは持ち主の裁定（t3-hub.66.1）で決まっている）。廃止では、状態を retired にし、版を 1 つ上げ、承認欄に 1 行と後継の欄を足し、ほかの字は変えない。開いた契約の行を持つノートと、計画のノートは廃止にしない。
  (7) 前文の順位の字（「増殖の防止」）と機構の注は変えない。順位は判断の規則のまま残し、設計ノートの機構は条 P-28 が持つ。地図の節点の増え方は器の局面の出力の窓が持つ（行 c-map-lc・本判断の外）。
  (8) 条 P-27.2 の「先に消すもの」は 2 つある。全部の行が着地したノート（起草の第 2 版の時点で 69 本）を束で廃止し、生きた数から外す。計画の 6 節の増殖の段落の末の 3 文（退役の忘れの見張りと、起草と退役の予定）を、発効した事実の 3 文に短くする。
  (9) 計画の 9 節に計画だけの行（c-note-retired）を足す。tz graph --check の全部の行が着地したノートの行から、索引の状態の欄が retired のノートを外す行で、依存は行（g-map-retired）と同じである。
options:
  - id: a
    name: 条 P-28 を新設し、束の廃止と同じ commit で folio の組み立ての版（pin）を上げ、値は束の後の実測にする
    text: 決定 (1) から (9)。
    verdict: adopted
    reason: 減らす力を AI の記憶でなく床の検査に置ける。方針と値は置き場（憲法と規則の表）に、数える口は folio に、着地は器と tsuzuri に置き、判じ方が割れない。束を同じ commit に入れるので、窓も最初の余白も無い。見本・置き場の外・開いた行の廃止の 3 つの逃げ道を、条の字で塞ぐ。
  - id: b
    name: 前文の順位の機構の欄に検査を書く
    text: 前文の「増殖の防止」の機構を機構なし（none）から組み立て時の検査（build-check）に替え、注に folio の数える口を書く。
    verdict: rejected
    reason: 前文は条どうしの衝突を解く順位で、規範文と段を持たない。機構を持たせると、判断の規則と検査の規則が 1 つの欄に混ざり、何が落ちるかを規範文で言えない。
  - id: c
    name: 規則の表の行 3 本だけを足し、憲法は変えない
    text: 行 R-26 と同じく、行の条を P-2 にして値の行 3 本を足す。方針は計画の散文に書く。
    verdict: rejected
    reason: 最後の形としては、条 P-2（正本は 1 つ）と意味が合わない。方針と逃げ道の禁止と緩める前の理由が散文にしか無くなり、条 N-2 に当たる。持ち主の裁定（t3-hub.66.1）の案 C にも合わない。決定 (5) のつなぎとして条 P-2 の下に仮に置くのは、発効までの間だけである。
  - id: d
    name: 退役の忘れを今すぐ猶予の行で落とす
    text: 猶予の行（全部の行が着地してから廃止までの日数）を今足し、tz graph --check が猶予を越えたノートで落ちる。
    verdict: rejected
    reason: tz graph --check の名指しは今 detect で、廃止したノートも名指し続ける。落とす形の実装の行が無いまま猶予を置くと、廃止した後もずっと落ちる。P-28.5 の後半は、猶予の行と落とす実装の行を同じ commit で足した時に効く。
  - id: e
    name: 廃止の束を folio の組み立ての版（pin）を上げた後の別の commit にし、最初の値はその時点の実測にする
    text: 版を上げる commit では値を束の前の実測（今 78 本）に置き、次の設計の commit で束と値の下げを行う。
    verdict: rejected
    reason: 版を上げる commit と束のあいだに、新しいノートを足す commit が全部落ちる窓ができる。並行の波の起草が踏む。束の前の値は、廃止を待つノートの分だけ余白になる。
basis: [P-28, P-27, P-17, P-2, A-2, P-3, P-4, N-1, N-2, R-26, R-27]
produced: [R-31, R-32, R-33]
grill:
  when: 2026-09-29
  who: 検証役（AI・Opus・独立の文脈・読み取りだけ）
  where: docs/grill/2026-09-29-M-growth-article-grill.md
  summary: 独立の検証は条件付きの支持で、直すべき所を 10 挙げた。条の字の 2 つ（着地しただけのノートの廃止・逃げ道の 3 つ）、名指しの持続、段取りの 3 つ（pin が先の順・束の窓・下げの義務）、撤退条件の空、問いの誤りである。設計席は 10 を全部採り、束を pin と同じ commit に入れて窓と最初の余白を消した。
retreat:
  kind: measure
  condition: |
    数えるのは t3:orchestrator 席で、控えの memo（t3-hub.66）の notes に 1 件ごとに記帳する（日付・材料・当たった条件）。確かめるのは持ち主。
    (1) 上限に当たった件のうち、廃止も統合もせずに値を上げる裁定が 3 件目になったら（数え方 = git の履歴の、行 R-31〜R-33 の値の変更と、その commit の文の裁定 id）、上限が整理の力になっていないとして、条 P-28 の形（上限の置き方・猶予の行）を持ち主に問う。
    (2) 最初の廃止の束の後 14 日の時点で、生きた設計ノートの本数か、その契約表の行の合計が、束の直後の値より多ければ（数え方 = folio の床の今の数の行と、生きたノートの契約表の行の合計）、上限の形と廃止の運び（決定 (4) と (6)）を持ち主に問う。
    (3) 上限の行のせいで設計の commit が止まり、廃止か統合で 1 日のうちに解けなかった件が 3 件目になったら、最初の値の置き方（決定 (4)）を持ち主に問う。
plain: |
  設計ノート（便の約束を書く文書）が増え続けないように、憲法に 1 条を足す提案です。
  設計ノートは、要件や判断の記録へ中身を移すまでの途中の文書とします。中身を移したときか、約束の行が全部済んだときに「廃止」の印を付けて、消さずに残します。
  生きているノート（下書きか発効）の本数・1 本の中の約束の行の数・まだ約束になっていない予定の行の数に上限を置き、越えたら folio の検査が記録を止めます。
  folio を新しい版に上げる同じ記録で、全部済んだノートをまとめて廃止し、上限はその後の数ちょうどにします。減らしたら同じ記録で上限も下げます。上げるときは、減らせない理由を書いてあなたに聞きます。
  「見本」の印で置く・置き場の外へ動かす・済んでいない約束があるのに廃止する、の 3 つは禁じます。
approval:
  who: 持ち主
  date: 2026-09-29
  ruling: t3-hub.66.3（裁定 id = t3-hub.66.3:20260929T0656Z-1・notes に逐語）
  verbatim: 推奨で良い。
  surface: R-8
note: 発効のときに憲法に条 P-28 を足し、新しい版の凍結の基準を置く。同じ commit で folio の pin を上げ、全部の行が着地したノートを廃止し、規則の表の行 R-31〜R-33 を足し、計画に行を足す（決定 (5)）。
