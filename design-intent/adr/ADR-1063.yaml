  器の案の章の要約: 候補を 6 つ並べます。 git の全体の設定の印 1 つと段の列で導入する案 (選んだ案)、 環境変数か固定の場所で置き場を知る案、 雛形を host 全体の置き場に置く案、 口座の dir を丸ごと写す案、 init が質問して 1 つずつ決める案、 init が口座のかたまり (群) へ自動で入れる案です。 却下した 5 案にも利点を並べ、 退けた決め手が現物か分析かを各案に書きます。 環境変数の案は host init が要らず人の手が 2 語で済む点で、 host 全体に置く案は雛形が 1 か所で写しが増えない点で、 写す案は置き場ごとに独立する点で、 質問する案は選択肢を見ながら決められる点で、 自動で群へ入れる案は人が引数を打たずに済む点で、 選んだ案に勝ちます。
  器の専門語の説明: 本文に出てくる専門語 14 個を、 やさしい言葉で説明します。 この記録で意味を決めた語は「雛形の置き場」「host-template」「init」の 3 つで、 残りは器の側の言葉です。
  ・雛形の置き場（template state dir）: host init が git の global 設定に登録する既存の state dir 1 つ (本 ADR)。 init はここの host の manifest から 4 表を写し、 口座の dir をここの口座の dir へ symlink で結び、 新しい置き場をこの dir の隣に作る。
  ・host-template（host template pointer）: git の global 設定に置く key 1 つ (key 名は NAME から導く・本 ADR)。 値は雛形の置き場の絶対 path で、 host 単位の唯一の pointer。 doctor が host-template の行で在るか・読めるかを言う。
  ・init（init）: repo ごとに 1 回撃つ器の subcommand (本 ADR)。 置き場・host の面・口座・marker と local 設定・vessel 宣言・群・commit・tmux と席の段を順に通し、 各段は在れば skip、 段ごとに 1 行と次の 1 手を出す。
  ・state dir（state dir）: 器が状態 (event log・受付・席の登録など) と host の manifest を置く dir。 repo の git の local 設定がどの state dir に仕えるかを指す。 本 ADR の init は雛形の置き場の隣に新しい state dir を作る。
  ・host の manifest（host manifest）: state dir の host.toml。 口座・plugin・起動引数・vessel・群の 5 表を持つ host 固有の宣言値の置き場 (ADR-1026・ADR-1049)。 本 ADR の init は群を除く 4 表を雛形から写す。
  ・vessel 宣言（vessel declaration）: 対象 repo の root の tracked file .vessel.toml。 許す command と共通の検証などを repo 自身が名乗る (ADR-1010 / ADR-1047)。 本 ADR の init は Cargo.toml の有無で形を選んだ雛形を書く。
  ・project の群（project group）: 席の口座を持つ単位 (ADR-1049)。 名・置き場の列・候補の口座の列を host の manifest の表 1 つが宣言する。 群の宣言は A1 の「使う」の常設の承認で、 本 ADR の init は --group を打った周だけ repo を足す。
  ・席の起動（seat launch）: 器の subcommand seat launch が役割と口座から起動行を導き、 席の登録を先に書いて tmux の窓へ差し込むこと (ADR-1026)。 本 ADR の後は引数の無い形が既定を解く。
  ・口座の登録（account registration）: 器の subcommand account add が口座の設定 dir と host の manifest の宣言を揃え、 login の起動行を user へ渡すこと (ADR-1026・FR1058)。 credential は読まず書かない。 本 ADR の init は口座を登録せず、 既に在る口座の dir を結ぶだけ。
  ・anchor（anchor）: 対象 repo の main checkout。 席と便の鍵の一部で、 1 つの anchor に orchestrator の席 1 つ。 本 ADR の引数の無い seat launch は cwd の repo をこれとして扱う。
  ・起動の記述（invocation）: 子 process の program・引数・cwd・env などを持つ core の型 (ADR-1062)。 終端は自分で撃たず差し替え口へ渡す。 本 ADR の git・tmux・seat launch の子 process も全部これで記述する。
  ・境界 crate（boundary crate）: core の外側に置く crate で、 binary を持ち core に依存する。 derive などの外部形式を扱う面がここに閉じる (C13.2)。 本 ADR の git・tmux・seat launch の子 process はここの差し替え口の実物が撃つ。
  ・裁定 id（ruling id）: user 裁定を一意に指す id。 裁定の時刻 (UTC)。 本 ADR は 2026-09-24T13:02Z・13:04Z の 2 つを指す。
  ・doctor（doctor）: 器の状態と host の配線を 1 回で照合して行に並べる subcommand。 本 ADR の後は host-template の行と init の行で導入の欠落を名指し、 次の 1 手を 1 つ言う。
