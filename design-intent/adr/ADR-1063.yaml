# 判断の記録 ADR-1063 — 器 scribe2 の判断の記録 ADR-0063 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1063
title: "新しい repo を器に載せる口は 1 発で、 host の面は git の global 設定が指す既存の置き場 (雛形) から継承する — 人が打つのは host init・init・doctor の 3 語、 席は引数なしで立つ (ADR-1026 の seat launch の必須の引数を引数の無い形に限って部分 supersede・ADR-1049 が後続に送った導入の口)"
status: proposed
date: 2026-09-24
context: |
  今は新しい repo を器に載せるのに、 人が 7 手 (置き場の dir・口座の配線・host の面の写し・git の設定・marker・宣言・tmux と席の長い起動) を打ち、 1 つ抜けると席は黙って動かない。 user は、 導入は 1 コマンドで終わること、 人が打つ command を最小にすること、 人間向けの説明を持つことを裁定した (裁定 id user 2026-09-24T13:02Z / 13:04Z)。 本 ADR は、 人が打つのを host に 1 回の host init・repo ごとに 1 回の init・困ったときの doctor の 3 語に閉じ、 host の面は git の global 設定の pointer 1 つが指す既存の置き場 (雛形) から写し、 席は引数の無い seat launch で立て、 doctor が欠落と次の 1 手を名指すと決める。 ADR-1026 の seat launch の必須の引数 (役割・置き場・target) を、 引数の無い形に限って既定で解く形に置き換える (長い形は不変)。 口座が repo を信じた印 (trust) を器が埋めるかは別の裁定で決め、 後続の ADR に送る。
  なぜこの判断が要るのかを、 user の決定と、 実際に起きたことと、 器の今の部品と、 これまでの決まりから説明します。 user は 2026-09-24 に、 新しい project の導入は 1 コマンドで終わるべきこと、 人が打つ command を最小にしてそれで器が十分に動くこと、 人間向けの説明が要ることを決めました。 同じ日の新しい project の立ち上げは 7 つの手作業で、 そのうち目印の file と repo の名乗りの file が抜け、 席は指示文を受け取れずに保留で止まりました。 別の 2 つの project の移行も、 repo の外に書いた 15 段の手順を人が辿りました。 点検の doctor はこの抜けを言いません。 器には目印を書く口・設定 file の読み手・口座を足す口・席を立てる口がすでに在りますが、 それらをつなぐ口と、 引数を省いたときの既定がありません。 決まりの側では、 host ごとの値で分岐する code を書かないこと、 環境変数の差し込み口を新しく作らないこと、 口座を使う判断は人に聞くこと、 口座の鍵を読まないことが効いています。 口座がその repo を信じていないと席の起動が止まる件は、 別の決定に送ります。
  CTX1 経緯 — 導入は 1 コマンドで、 人が打つ command は最小限、 という裁定
  2026-09-24 に user は 3 つを裁定した。 1 つ目 (裁定 id（user の決定の印） user 2026-09-24T13:02Z) は、 新しい project を器に載せるのは 1 コマンドで終わる簡便さが要る、 である。 2 つ目と 3 つ目 (裁定 id user 2026-09-24T13:04Z) は、 器には制御の道具が多いのに人間向けの説明が無く初見の人が知りようがないこと、 人が打つ command を最小にしてそれで器が十全に動くようにすること、 である。 要旨だけを写し、 逐語は非公開の作業記録簿 (台帳 s2-07l.609) に在る。 ADR-1049 は群の決定の射程外として「導入の口」と「外部 API の鍵の欄」を後続の決定記録に送っている。 本 ADR はそのうち導入の口を決め、 鍵の欄は決めない。
  CTX2 実測 — 手作業 7 手のうち 2 つが抜け、 席は黙って止まった
  2026-09-24 の新しい project の立ち上げは手作業 7 手 (置き場の dir・口座の配線・host の面の写し・git の設定・marker・宣言・tmux と席の長い起動) で、 このうち marker (vessel init（repo を載せる口） が書く) と vessel 宣言（repo の名乗り）の 2 つが抜けた。 抜けた状態では SessionStart の hook が「仕えない repo」として 0 byte で黙り、 席に指示文が入らず、 seat launch は launch-unconfirmed の保留になった (memo s2-07l.604 の実地試験でも同じ)。 別の 2 つの project の移行も、 repo の外の散文の手順 (15 段) を人が辿った (memo s2-07l.491 の notes)。 doctor（点検の 1 コマンド） はこれらの欠落を名指さない。
  CTX3 現物 — 部品は揃っているが、 つなぐ口と既定が無い
  base 0b6af26 で、 vessel init は git の local 設定 (NAME から導いた key に置き場の path) と marker (.vessel・name と version の 2 行) を書き、 別の名乗りの marker が在る周は 1 byte も書かず断る。 env も HOME も読まない。 host の面 (state dir（器の状態の置き場） の host.toml) は口座・plugin・起動引数・vessel・群の 5 表を受け、 面が無い周は 0 宣言で止めない。 口座の dir は account add が実 dir として作り、 host では複数の置き場が同じ口座を使うので、 置き場の口座の dir は既存の設定 dir への symlink になっている (host の運用で、 器は知らない)。 seat launch は置き場・役割・target を必須に受け、 tmux の session は在る前提で、 無ければ断る (窓は無ければ作る)。 doctor は席の登録・口座・導入先・配線の行を出すが、 marker・宣言・host の面の欠落を名指す行は無い。 vessel 宣言の必須の key は 3 つ (schema・許す command・共通の検証) で、 cargo の行を持つ宣言は入口の flip の行か「測らない」の名乗りを要る。 子 process は core が起動の記述（何を起こすかの記述）で記述し、 境界 crate（process を起こす箱） が撃つ (ADR-1062)。
  CTX4 後続 — 口座の trust は別の裁定で決める
  口座がその repo を一度も信じていない (trust していない) と席の起動（席を立てる口）が Claude Code の確認で止まる穴は、 別の裁定で決めて後続の ADR に送り、 本 ADR は決めない。
  CTX5 憲法と既存の決定の向き (本 ADR の解釈)
  N3 は host 固有の値で分岐する code を拒み、 C10 は host ごとの値を manifest (host の面) に置き、 C2.2 と ADR-1004 §2.4 は env の差し込み口を新設しない (置き場の差し替えは CLI 引数だけ)。 xtask の env-reads の門は src の env の読みを数える。 A1 は消す・出す・使うの 3 クラスを実行前に user に聞き、 ADR-1049 は群の宣言を A1 の「使う」の常設の承認とする。 FR1058 は口座の登録（口座を足す口）で credential を読まず書かないことを、 FR1059 は席の起動が役割を必須で受け tmux の session は作らないことを、 FR1061 は doctor が導入先ごとに実測を typed な語で名指し推測で埋めないことを求める。 ADR-1026 は host の面を置き場ごとの 1 file とし、 seat launch の役割を必須とした。 ADR-1045 は席の役割を orchestrator 1 つにした。 ADR-1010 / ADR-1047 は vessel 宣言の形を決めた。 C17 は足す前に要るか・既に在るかを順に問う。
  （選択肢を測るものさし）この判断を評価する 6 本のものさしです。 人が打つ command を最小にすること、 置き場の在り処を host ごとの値で分岐せず環境変数も固定の場所も使わずに知ること、 今の設定 file と名乗りの file の形と、 引数を全部書いた席の起動の形を変えないこと (引数の無い形だけは前の決定が必ず指定するとした引数を器が解きます)、 口座の鍵 (credential) を読まず、 口座を使う判断を人に残すこと、 黙って止まる席を作らず抜けを名指すこと、 そして新しい口は今の口を順に呼ぶだけにして外部の部品を足さないことです。
  DR1｜人が打つ command を最小にする — host に 1 回・repo ごとに 1 回・困ったら 1 回、 残りは器が導く CTX1 (裁定)・CTX2 (7 手と抜け)
  DR2｜置き場の在り処を host 固有の値で分岐せずに知る — env を読まず、 固定の path も焼かない CTX5 (N3・C2.2・ADR-1004 §2.4・env-reads の門)
  DR3｜既存の外形を変えない — host の面は置き場ごと、 宣言・marker・seat launch の長い形・既存の置き場と repo は無変更 CTX3・CTX5 (ADR-1026・ADR-1049・ADR-1010 / ADR-1047)
  DR4｜credential と A1 の境を越えない — credential を読まず写さず、 口座を使う判断 (群) は人が持つ CTX5 (FR1058・A1・ADR-1049)
  DR5｜黙って止まる席を作らない — 欠落は doctor が次の 1 手で名指す CTX2・CTX5 (FR1061)
  DR6｜足すものを最小にする — 新しい口は既存の口を順に呼ぶだけにし、 依存を足さない CTX3・CTX5 (C17)
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 host init は、 すでに在る置き場 1 つの場所を git の全体の設定に書くだけです。 init は、 置き場を作る・設定 file を写す・口座をつなぐ・目印と git の設定を書く・名乗りの file を書く・(指定したときだけ) 群に足す・書いた file だけを 1 commit にする・tmux の画面を用意して席を立てる、 の段を決まった順に通り、 すでに在る段は飛ばし、 段ごとに 1 行と最後に次の 1 手を出します。 席を立てる口は、 引数が無ければ置き場と役割と画面の場所と口座を自分で解き、 引数があればそちらを使います。 doctor は雛形の印の行と導入の行で、 抜けを決まった順に並べて次の 1 手を 1 つ言います。 要件書では、 この記録の読みで席の起動の要件 (FR1059) を満たす形を示し (session を作るのは席の起動でなく init の段と読みます)、 口座の鍵を読まない要件 (FR1058) を口座のつなぎの段へ、 点検が実測を名指して推測で埋めない要件 (FR1061) を doctor の新しい行へ広げる根拠になります。
  採用 — OPT1
  器 SHALL 新しい repo を載せる人の手を host init (host に 1 回)・init (repo ごとに 1 回)・doctor (困ったとき) の 3 語に閉じる。 host init SHALL 既存の state dir 1 つを雛形の置き場として受け、 git の global 設定の key <NAME>.template (NAME は器の名の定数・本 ADR は host-template と呼ぶ) に絶対 path を書き (同じ値なら書かない)、 dir が無い・host の manifest が読めない周は 1 byte も書かず断る。 器 SHALL 雛形の置き場をこの pointer 1 つだけで知り、 env と HOME を読まない。 init SHALL 段の順を置き場・host の面・口座・marker と local 設定・vessel 宣言・群・commit・tmux と席に固定し、 各段は在れば skip し、 段ごとに 1 行と最後に次の 1 手 (next=) を 1 つ出し、 段の失敗はその段だけ書かずに名指して続きへ進む。 git の repo でない・host-template が無い周は 1 段目の前に断る。 置き場 SHALL 雛形の親の下の「雛形の dir 名 - repo の dir 名」とする。 host の面 SHALL 雛形の口座・plugin・起動引数・vessel の 4 表を写し、 群の表は写さず、 既存の loader で検査してから rename で置く。 口座の dir SHALL 雛形の口座の dir (link ならその先) への symlink とし、 credential SHALL 読まず写さない。 vessel 宣言 SHALL Cargo.toml の有無で cargo の形か git の形を選び、 値は上限の内側に置く。 群 SHALL --group を打った周だけ足し、 群を宣言する同じ親の下の全面の anchors に repo を足し、 新しい面にも同じ群の行を写し、 1 面でも検査に落ちれば 1 面も書かない。 commit SHALL init が書いた marker と宣言だけを 1 commit にする。 init SHALL tmux の session が無ければ作り、 引数の無い seat launch を 1 回撃つ。 引数の無い seat launch SHALL 置き場を cwd の repo の local 設定から、 役割を orchestrator、 target を repo の dir 名の session の orchestrator の窓、 口座を群の今の口座か session 用の選定から解き、 明示の引数は既定に勝ち、 長い形の判定と断りを変えない。 doctor SHALL host-template の行と init の行 (欠落を宣言順に並べ次の 1 手を 1 つ) を出し、 SessionStart の hook の 0 byte は変えない。 子 process SHALL 全部を起動の記述 (ADR-1062) で記述する。 器 SHALL NOT 群へ自動で入れず、 対話で聞かず、 本 ADR で依存を足さない。 口座の trust を器が埋めるか SHALL 本 ADR で決めない (後続の ADR)。
  （平易）器は、 新しい repo を載せるために人が打つのを、 host init (host に 1 回)・init (repo ごとに 1 回)・doctor (困ったとき) の 3 つに閉じます。 host init は、 すでに在る置き場 1 つを雛形として受け、 その場所を git の全体の設定の 1 項目 (key の名は器の名から導く <NAME>.template・この記録は host-template と呼びます) に書きます。 同じ値ならもう書かず、 dir が無いか設定 file が読めないときは何も書かずに断ります。 器は雛形の置き場をこの 1 項目だけで知り、 環境変数も HOME も読みません。 init は、 置き場・設定 file・口座・目印と git の設定・名乗りの file・群・commit・tmux と席の順に段を通り、 すでに在る段は飛ばし、 段ごとに 1 行と最後に次の 1 手を出し、 失敗した段はそこだけ書かずに名指して先へ進みます。 git の repo でないか雛形の登録が無いときは、 最初の段の前に断ります。 新しい置き場は雛形の隣に「雛形の名前 - repo の名前」で作ります。 設定 file は雛形の口座・plugin・起動引数・vessel の 4 つの表を写し、 群の表は写さず、 今の読み手で確かめてから置きます。 口座の dir は雛形の口座の dir (それ自体が link ならその先) への symlink にし、 口座の鍵は読まず写しません。 名乗りの file は Cargo.toml の有無で cargo の形か git だけの形を選び、 値は器の上限の内側に置きます。 群は --group を打ったときだけ足し、 同じ親の下でその群を宣言している全部の設定 file に repo を足し、 新しい置き場の設定 file にも同じ群の行を写し、 1 つでも確かめに落ちれば 1 つも書きません。 commit は init が書いた目印と名乗りの file だけを 1 つにまとめます。 最後に tmux の画面が無ければ作り、 引数の無い席の起動を 1 回撃ちます。 引数の無い席の起動は、 置き場を今いる repo の git の設定から、 役割を orchestrator、 画面の場所を repo の名前から、 口座を群の今の口座か席用の選び方から解き、 引数があればそちらを使い、 引数を全部書いた形の判定と断り方は変えません。 doctor は雛形の登録の行と導入の行 (抜けを決まった順に並べて次の 1 手を 1 つ) を出し、 席が立ち上がるときの hook が黙る動きは変えません。 起こす道具 (git や tmux など) は全部「何を起こすかの記述」(ADR-1062) で書きます。 器は群へ勝手に入れず、 質問で決めず、 この記録で外部の部品を足しません。 口座が repo を信じた印を器が埋めるかは、 この記録では決めず後の決定に送ります。
  （理由）user の決定は、 導入を 1 コマンドにし、 人が打つ command を最小にし、 人間向けの説明を持つことでした。 すべてを 1 語にできない理由は、 どの置き場を雛形にするかという host ごとの値が 1 つだけ残るからです。 それを環境変数や決まった場所で知れば、 環境変数の差し込み口を作らない・host ごとの値で分岐しないという決まりに反します。 そこで、 すでに器が置き場の紐づけに使っている git の設定と同じ道具で、 host の全体に 1 つだけ印を書く口 (host init) を置き、 残りは repo ごとに 1 回の init が雛形から導く形にしました。 init が今の口 (目印を書く口・設定 file の読み手・名乗りの file の形・席を立てる口) を順に呼ぶだけにしたのは、 今の口の形 (引数を全部書いた席の起動を含む) を変えずに既存の置き場と repo を 1 字も触らず、 外部の部品も足さないためです。 各段を飛ばせる形にしたのは、 途中で失敗しても撃ち直すだけで済み、 次の 1 手を必ず言えるようにするためです。 口座を symlink でつなぐのは、 口座の鍵を読まないという要件の内側に留まるためで、 群へ入れるのを --group に限るのは、 口座を使う判断を人に残すためです。 雛形を host 全体の置き場に置く案は、 設定 file を置き場ごとに 1 つとした前の決定の形を変えるので退けました。 質問で決める案は席から撃てないので退けました。 引数の無い席の起動で役割を orchestrator と解くのは、 席の役割が 1 つになったので (ADR-1045) 省いても曖昧にならないからで、 前の決定の「役割は必ず指定する」と、 置き場と画面の場所の必須は、 この形に限って置き換えます。 口座が repo を信じていないと席が確認で止まる穴は残りますが、 それを器が埋めるかは別の裁定が要るので、 この記録には入れず後の決定に送ります。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1059（claim）: FR1059 は席の起動が役割を受け、 口座を群の今の口座か選定で決め、 tmux の session は作らずに窓へ起動行を差し込むことを求める。 本 ADR の引数の無い seat launch は役割を orchestrator (ADR-1045 の唯一の席の役割) に解いてから受け、 口座の決め方と session を作らないことは変えない。 FR1059 の「tmux の session は作らず」を seat launch の話と読み、 init の段が seat launch の前に session を作るのは本 ADR の解釈である。 「役割を必須で受け」を「役割が決まらないまま起動しない」と読むのは本 ADR の解釈で、 SRS の文面の改訂は user の手番に残る。
  FR1058（rationale）: FR1058 は口座の登録で credential を読まず書かないことを求める。 本 ADR の init は口座を登録せず、 雛形の口座の dir を symlink で結ぶだけで credential を読まず写さない。 FR1058 の柵を init の口座の段 (口座の dir の配線) にも同じ形で置く根拠を FR1058 に取る。
  FR1061（rationale）: FR1061 は doctor が導入先ごとに実測を 1 行に並べ、 食い違いを typed な語で名指し推測で埋めないことを求める。 本 ADR の host-template と init の行は、 同じ形 (実測・typed な語・推測で埋めない・次の 1 手) を導入の欠落へ広げる。 FR1061 の文面は導入先の同期で、 導入の欠落の行は FR1061 の文面そのものではない (根拠として指す)。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 前の決定 (ADR-1026) のうち、 席を立てる口の「役割は必ず指定する」の文と、 置き場と画面の場所を必ず渡すとした構文の文の必須の部分だけを、 引数の無い形に限って置き換えます。 引数の無い形では役割を orchestrator (席の唯一の役割) と解き、 置き場は今いる repo の git の設定から、 画面の場所は repo の名前から解きます。 引数を全部書いた形は変えません。 login と信じる印を user が付けるという文は変えません。 群の決定 (ADR-1049) は置き換えず、 そこが後の決定へ送った「導入の口」をこの記録が決めます (外部 API の鍵の欄は決めません)。 要件書の文面はこの記録では変えず、 改訂が要るかは user が決めます。 この記録は発効前 (proposed) で、 系譜の上では現行 (current) ですが、 受け入れられるまで何も拘束しません。 原則は「人が打つのは入口の 1 語、 残りは器が既に在る置き場から導く。 黙って止まる代わりに、 次の 1 手を名指す」です。
  改訂状態: current
  置き換える ADR: ADR-1026
  置き換えられた: なし (現行)
  部分 supersede で、 置き換えるのは ADR-1026 §2.3 の 2 つの文の必須の部分だけである。 (1) 「--role SHALL 閉じた Role の名で必須」を、 引数の無い seat launch に限り、 役割を orchestrator (ADR-1045 の唯一の席の役割) と解いてから受ける形に読み替える。 (2) 構文の文 (seat launch --state-dir S --role <Role> --target S:W …) の --state-dir と --target の必須を、 引数の無い形に限り、 置き場を cwd の repo の local 設定から、 target を repo の dir 名から解く既定に読み替える。 長い形は不変である。 明示の引数は既定に勝ち、 長い形の判定・断りの字面・起動行の導出・登録を先に書くこと・session を作らないことは不変である。 ADR-1026 §2.2 の login と trust を user の手番とする文は supersede しない (trust を器が埋めるかは別の裁定と後続の ADR)。 ADR-1049 は supersede しない (群の宣言の外形・群の今の口座・移動は不変・本 ADR は ADR-1049 が後続に送った導入の口を決め、 外部 API の鍵の欄と席の登録 row の退役の種類は決めない)。 ADR-1062 (起動の記述)・ADR-1010 / ADR-1047 (宣言の形)・ADR-1004 §2.4 (env の差し込み口を持たない) は不変。 SRS の FR1059 の「役割を必須で受け」の文面は本 ADR では変えず、 改訂が要るかは user の手番とする。 発効は本 ADR が accepted になった後で、 それまで何も拘束しない。
  照会終端 — PRIN-ONE-WORD-AT-THE-DOOR-THE-VESSEL-DERIVES-THE-REST
  人が打つのは入口の 1 語、 残りは器が既に在る置き場から導く。 黙って止まる代わりに、 次の 1 手を名指す。
  本 ADR が env や固定の path で置き場を知る案・雛形を host の根に置く案・credential を写す案・対話で聞く案・群へ自動で入れる案を退け、 pointer 1 つと段の列を選んだのはこの原則に行き着く (これ以上は遡らない照会終端)。
options:
  - id: "OPT1"
    name: "host に 1 回の pointer と repo ごとに 1 回の段の列 — 雛形の置き場（写しの元の置き場）から写し、 席は引数なしで立つ"
    text: |
      host init が git の global 設定に雛形の置き場の絶対 path を 1 つ書き、 init が段の順 (置き場・host の面・口座・marker と local 設定・宣言・群・commit・tmux と席) を冪等に通して段ごとに 1 行と次の 1 手を出す。 seat launch は引数なしで既定を解き、 doctor は host-template（雛形を指す印） と init の 2 行で欠落を名指す。 依存は足さない。 決め手は分析 (裁定の 3 点を、 既存の口と外形を変えずに満たす形のうち、 人の手が最小で env を読まない形)。
      （平易）host に 1 回だけ、 すでに動いている置き場の場所を git の全体の設定に書き (host init)、 repo ごとに 1 回、 その雛形から新しい置き場を作って段を順に通す (init) 案です。 段は、 置き場・設定 file の写し・口座のつなぎ・目印と git の設定・名乗りの file・(指定したときだけ) 群・commit・tmux と席で、 すでに在る段は飛ばし、 段ごとに 1 行と次の 1 手を出します。 席は引数なしで立ち、 doctor が抜けを名指します。 人が打つのは 3 語になり、 環境変数も固定の場所も読まず、 今の設定 file と名乗りの file の形も、 引数を全部書いた席の起動の形も変えず (引数の無い形だけは前の決定が必ず指定するとした引数を器が解きます)、 口座の鍵も読まず、 外部の部品も足しません。 代わりに、 引数の無い起動は今いる repo に頼り、 置き場の名付けを器に焼き、 仕事が 4 つの契約に割れ、 口座が repo を信じていないと席が確認で止まる穴は残ります。 決め手は分析で、 user の決定の 3 点を、 今の口と形を変えずに満たす形のうち、 人の手が最小で環境変数を読まない形でした。
      利点: 人が打つのは host init (host に 1 回)・init (repo ごとに 1 回)・doctor (困ったら) の 3 語で、 7 手の手作業と repo の外の散文の手順が消える (DR1)
      利点: 置き場の在り処は git の global 設定の pointer 1 つで知り、 名は雛形から導くので、 env も固定の path も読まない (DR2)
      利点: host の面の loader・vessel init・宣言の形・seat launch の長い形を再利用し、 外形を変えない。 既存の置き場と repo は 1 字も変わらない (DR3)
      利点: 口座は symlink で結ぶだけで credential を読まず写さず、 群へ入れるのは --group を打つ人だけ (DR4)
      利点: 各段が冪等で、 途中で失敗しても段を名指して続け、 next= が次の 1 手を言う。 doctor が欠落を宣言順に名指す (DR5)
      利点: 既存の口を順に呼ぶだけで、 依存を足さない (DR6)
      欠点: 引数の無い seat launch は cwd の repo の設定に頼り、 ADR-1026 の必須の引数 (役割・置き場・target) の文を引数の無い形に限って置き換える
      欠点: 置き場の名付け (雛形の dir 名 - repo の dir 名) を器の関数に焼き、 別の名付けを持たない
      欠点: init は段が多い 1 つの口で、 契約は 4 行 (host init・init・席・doctor) に割れる
      欠点: 口座が repo を信じていない周の trust の確認で席が止まる穴は残り、 後続の ADR に送る
    verdict: adopted
    reason: "決め手は分析 (裁定の 3 点を、 既存の口と外形を変えずに満たす形のうち、 人の手が最小で env を読まない形)。"
  - id: "OPT2"
    name: "env か固定の path (XDG の置き場) で雛形の置き場を知る"
    text: |
      SCRIBE2_HOME のような env か、 XDG の規約の固定の dir を雛形の置き場として読む。 決め手は分析 (env-reads の門と N3・C2.2 に反する)。
      （平易）環境変数 (例: SCRIBE2_HOME) か、 決まった場所 (XDG の規約の dir) を雛形の置き場として読む案です。 git の設定を書かずに済むので host init が要らず、 人が打つのは init と doctor の 2 語になります。 他の道具でも広く使われる形で、 初見の人に説明しやすい点も勝ります。 けれども、 環境変数を読むのは器の検査 (env-reads) と、 環境変数の差し込み口を新しく作らないという決まりに反します。 決まった場所は、 host ごとに置き場の親が違う運用を code に焼くことになり、 host ごとの値で分岐しないという決まりに反します。 決め手は分析です。
      利点: git の設定を 1 つも書かずに済み、 host init が要らない (人が打つのは init と doctor の 2 語)
      利点: 他の道具でも広く使われる形で、 初見の人に説明しやすい
      欠点: env を読むと xtask の env-reads の門と C2.2 (env の差し込み口を新設しない) に反する (DR2)
      欠点: 固定の path は host ごとの置き場の運用 (置き場の親が host で違う) を code に焼き、 N3 に反する (DR2)
    verdict: rejected
    reason: "決め手は分析 (env-reads の門と N3・C2.2 に反する)。"
  - id: "OPT3"
    name: "雛形を host の根の host.toml に置く"
    text: |
      置き場の親の下の host 用 dir (host の根) に共通の host.toml を置き、 各置き場はそれを継承する。 決め手は分析 (host の面を置き場ごと 1 file とした ADR-1026 / ADR-1049 の外形を変える)。
      （平易）置き場の親の下にある host 全体の置き場 (host の根) に共通の設定 file を置き、 各置き場がそれを受け継ぐ案です。 雛形が host に 1 か所で、 そこを直せば全部の置き場に効き、 写しが増えません。 host の根は置き場から環境変数なしで導けます。 けれども、 設定 file は置き場ごとに 1 つという前の決定 (ADR-1026) と、 群の宣言をその file の表にした決定 (ADR-1049) の形が変わり、 読み手の全部に受け継ぎの規則が要ります。 host の根は状態の記録の置き場で、 宣言を置くと、 宣言と実際の値を別の file に分ける決まりも崩れます。 決め手は分析です。
      利点: 雛形が host に 1 か所で、 写しが増えない (host の面を直せば全置き場に効く)
      利点: host の根は既に受付札と群の今の口座の記録を持ち、 置き場から env なしで導ける
      欠点: host の面を置き場ごとの 1 file とした ADR-1026 と、 群の宣言をその面の表とした ADR-1049 の外形が変わり、 loader と全読み手に継承の規則が要る (DR3)
      欠点: host の根は状態の記録の置き場で、 宣言を置くと宣言と実効を file で分ける形 (C10) が崩れる
    verdict: rejected
    reason: "決め手は分析 (host の面を置き場ごと 1 file とした ADR-1026 / ADR-1049 の外形を変える)。"
  - id: "OPT4"
    name: "口座の credential の dir を新しい置き場へ copy する"
    text: |
      雛形の口座の dir を symlink でなく丸ごと写す。 決め手は分析 (FR1058 の柵の外で、 可逆でない)。
      （平易）雛形の口座の dir を、 symlink でつながずに丸ごと新しい置き場へ写す案です。 置き場ごとに口座の dir が独立するので、 雛形の置き場を消しても新しい置き場が動きます。 けれども、 口座の鍵 (credential) を読んで写すことになり、 鍵を読まず書かないという要件 (FR1058) の外に出ます。 login を更新しても写しには届かず、 同じ口座の dir が host の中に複数に割れ、 消すのも戻すのも手作業になります。 決め手は分析です。
      利点: 置き場ごとに口座の dir が独立し、 雛形の置き場を消しても新しい置き場が動く
      欠点: credential を読んで写すことになり、 FR1058 (credential は読まず書かない) の外に出る (DR4)
      欠点: login の更新が写しに届かず、 同じ口座の dir が host に複数に割れる。 消すのも戻すのも手作業になる
    verdict: rejected
    reason: "決め手は分析 (FR1058 の柵の外で、 可逆でない)。"
  - id: "OPT5"
    name: "init が対話で聞く"
    text: |
      置き場の名・写す口座・群・宣言の形を init が端末で 1 つずつ聞く。 決め手は分析 (席からは撃てず、 1 発にならない)。
      （平易）init が置き場の名前・写す口座・群・名乗りの file の形を、 端末で 1 つずつ質問して決める案です。 初見の人が選択肢を見ながら決められ、 器が既定を推測しなくて済みます。 けれども、 席 (AI の session) は質問に答えられないので、 撃てるのが人の端末だけになります。 人が打つ回数も質問の数だけ増え、 「1 コマンドで終わる」「人が打つ command を最小に」という user の決定に反します。 決め手は分析です。
      利点: 初見の人が選択肢を見ながら決められる
      利点: 既定を器が推さずに済む
      欠点: 席 (AI の session) からは対話の入力に答えられず、 撃てる口が人の端末だけになる
      欠点: 人が打つ回数が問いの数だけ増え、 裁定の「1 コマンドで終わる」と「人が打つ command を最小に」に反する (DR1)
    verdict: rejected
    reason: "決め手は分析 (席からは撃てず、 1 発にならない)。"
  - id: "OPT6"
    name: "init が群へ自動で入れる"
    text: |
      雛形の置き場が属する群へ、 新しい repo を init が黙って足す。 決め手は分析 (A1 の「使う」を器が決める形になる)。
      （平易）雛形の置き場が入っている群 (口座を共にする project のかたまり) へ、 新しい repo を init が黙って足す案です。 人が --group を打たずに済み、 群の口座で席が立ちます。 けれども、 どの口座を使うかは人に聞く決まり (A1 の「使う」) で、 群の宣言がその承認にあたるので、 器が勝手に承認の範囲を広げることになります。 雛形が複数の群に入っているときに、 どこへ入れるかを器が推測することにもなります。 決め手は分析です。
      利点: 人は --group を打たずに済み、 群の口座で席が立つ
      欠点: 口座を使う判断 (A1 の「使う」・ADR-1049 では群の宣言がその常設の承認) を器が勝手に広げる (DR4)
      欠点: 雛形が複数の群に属する周に、 どの群へ入れるかを器が推すことになる
    verdict: rejected
    reason: "決め手は分析 (A1 の「使う」を器が決める形になる)。"
basis: [FR1058, FR1059, FR1061, ADR-1004, ADR-1010, ADR-1026, ADR-1045, ADR-1047, ADR-1049, ADR-1062]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「置き場 (state dir)」は器 (scribe2) が 1 つの repo のための状態と設定を置く dir、 「host の面」は置き場ごとの設定 file (どの口座・どの plugin・どの起動引数を使うか) のことです。 今は新しい repo を器に載せるのに、 人が 7 つの手作業 (置き場の dir を作る・口座をつなぐ・設定 file を別の置き場から写す・git の設定・目印の file・repo の名乗りの file・tmux と席の長い起動) を打ち、 1 つ抜けると席は黙って動きません。 user は 2026-09-24 に、 導入は 1 コマンドで終わること、 人が打つ command を最小にすること、 人間向けの説明を持つことを決めました。 この記録は、 人が打つのを 3 つ (host に 1 回の host init・repo ごとに 1 回の init・困ったときの doctor) に閉じると決めます。 host init は、 すでに動いている置き場 1 つを「雛形」として git の全体の設定に登録します。 init は、 雛形の隣に新しい置き場を作って設定を写し、 口座をつなぎ、 目印と名乗りの file を書いて 1 commit にし、 tmux の画面を用意して席を立てるところまでを、 順に 1 段ずつ行います。 席は引数なしで立ち、 doctor は抜けているものと次にやる 1 手を言います。 要件書では、 席の起動 (FR1059)・口座の鍵を読まないこと (FR1058)・点検が実測を名指すこと (FR1061) の 3 つの要件を支えます。 前の決定 (ADR-1026) が必ず指定するとした引数 (役割・置き場・画面の場所) を、 引数の無い形に限って器が自分で解く形に置き換えます (引数を全部書いた形は変えません)。 口座がその repo を一度も「信じる」と答えていないと席の起動が確認の画面で止まる件は、 別の決定で決めるので、 この記録では扱いません。 この記録は、 受け入れられるまで何も拘束しない発効前 (proposed) の記録です。
consequences:
  - "この判断で良くなること 4 つと、 代わりに引き受けること 5 つです。 良くなるのは、 人が打つのが 3 語になって 7 つの手作業と repo の外の手順が消えること、 抜けを doctor が順に名指して次の 1 手を言うこと、 init を何度撃っても壊れず途中で失敗しても続けられること、 環境変数を読まず、 今の設定 file と名乗りの file の形と引数を全部書いた席の起動の形も変えないことです。 引き受けるのは、 引数の無い席の起動が今いる repo に頼り、 前の決定が必ず指定するとした引数をその形に限って器が解くこと、 置き場の名付けを器に焼くこと、 群を指定したときは他の置き場の設定 file も書き換えること、 名乗りの file の雛形は最小の値で init の仕事が 4 つの契約に割れること、 そして口座が repo を信じていないと席が確認で止まる穴が残り、 後の決定に送ることです。"
  - "良い結果: 人が打つ command が host init・init・doctor の 3 語になり、 置き場の dir・口座の配線・host の面の写し・git の設定・marker・宣言・tmux と席の長い起動の 7 手と、 repo の外の散文の手順が消える。 人間向けの説明は 3 語の説明で足りる長さになる"
  - "良い結果: marker・宣言・host の面・口座・session・登録の欠落を doctor が宣言順に名指し、 次の 1 手を 1 つ言う。 SessionStart の hook が 0 byte で黙る極性は変えずに、 黙った理由が doctor の 1 行で分かる"
  - "良い結果: init の各段は冪等で、 2 度撃っても全段 skip になり、 段の途中の失敗は名指されて続きの段が進む。 群の面の書き換えは全部か皆無かで、 置き場ごとの宣言が食い違う周を作らない"
  - "良い結果: 置き場の在り処は git の global 設定の pointer 1 つで、 env も HOME も固定の path も読まない。 host の面・vessel 宣言・marker・seat launch の長い形の外形は変わらず、 既存の置き場と repo は無変更で動く"
  - "代償: 引数の無い seat launch は cwd の repo の local 設定に頼り、 別の repo の中で撃てばその repo の席を起こす。 ADR-1026 の「役割は必須」の文と構文の文の置き場・target の必須は引数の無い形で置き換わる (長い形は不変)"
  - "代償: 置き場の名付け (雛形の親の下の「雛形の dir 名 - repo の dir 名」) を器の関数に焼き、 別の名付けの口を持たない。 git の global 設定が消えると init は 1 段目の前に断り、 doctor の host-template の行が absent を言う"
  - "代償: --group の周は、 init が他の置き場の host の面を書き換える初めての口になる。 全部か皆無かで守るが、 書く面の数は同じ親の下で群を宣言する置き場の数だけ増える"
  - "代償: 宣言の雛形は最小の値 (cargo の形は nextest と clippy・git の形は差分の無さ・入口の flip は「測らない」の名乗り) で、 repo 固有の検証は後で足す。 init は段が多い 1 つの口で、 契約は 4 行に割れる"
  - "代償: 口座がその repo を一度も信じていない (trust していない) 周は、 init の後でも席の起動が Claude Code の確認で止まりうる。 この穴を器が埋めるかは別の裁定で決め、 後続の ADR に送る。 doctor の既存の trust= の行 (口座ごと) は変えない"
