  器の案の章の要約: 候補を 6 つ並べます。 host の設定 file に表を足して席を立てた直後に時計を入れる案 (選んだ案)、 環境変数から dir を解く案、 自分の実行 file の場所から器の場所を解く案、 点検が残す install の記録から器の場所を取る案、 systemd の道具を子 process で撃って dir を聞く案、 そして今のまま人が席ごとに打つ案です。 却下した 5 案にも利点を並べ、 退けた決め手が現物か分析かを各案に書きます。 環境変数の案と systemd の道具の案は設定 file に書く行が 0 になる点で、 実行 file の場所の案と記録の案は器の場所を人が書かずに済む点で、 今のままの案は器の変更が 0 で撃つ時点を人が決められる点で、 選んだ案に勝ちます。
  器の専門語の説明: 本文に出てくる専門語 11 個を、 やさしい言葉で説明します。 この記録で意味を決めた語は「tick の宣言」の 1 つで、 残りは器の側の言葉です。
  ・tick の宣言（tick declaration）: host の面 (host.toml) の表 [[tick]] (本 ADR)。 unit を置く dir の絶対 path (unit-dir) と unit が撃つ器の絶対 path (binary) の 2 欄を持つ 0 か 1 行の表。 席の起動と doctor と init が読み、 器は書かない (人が雛形の面に 1 度だけ書く)。
  ・tick の unit（tick unit）: 管理 tick を席ごとに周期で撃つ host の systemd user の unit (service と timer の対)。 seat tick install が NAME・target・置き場・binary・rules 行の間隔から 1 関数で導出して書き、 有効化まで撃つ (ADR-1030 §2.1〜§2.4)。 本 ADR の後は席の起動が同じ 1 本を撃つ。
  ・管理 tick（heartbeat）: 開発 session が黙っていないかを周期で見て、 条件が揃ったときだけ続きを促す 1 行を注入する仕組み (SRS FR1027・ADR-1058)。 host の systemd user の timer が周期で撃つ。 本 ADR はその timer を誰がいつ入れるかを決める。
  ・host の manifest（host manifest）: state dir の host.toml (host の面)。 口座・plugin・起動引数・vessel・群の 5 表を持つ host 固有の宣言値の置き場 (ADR-1026・ADR-1049)。 本 ADR で表 [[tick]] が増えて 6 表になる (init が写すのは群を除く 5 表)。
  ・席の起動（seat launch）: 器の subcommand seat launch が役割と口座から起動行を導き、 席の登録を先に書いて tmux の窓へ差し込むこと (ADR-1026・ADR-1063 の引数の無い形を含む)。 本 ADR の後は、 席を立てた周に tick の unit の install を面の値で撃つ。
  ・席の登録（seat registration）: 席の役割と anchor を鍵に、 target・口座・起動の雛形を fleet の event log に記録すること (SRS FR1040)。 tick の unit はこの登録 row を持つ席ごとに 1 対ある。 doctor は登録 row ごとに unit の有無を名指す。
  ・state dir（state dir）: 器が状態 (event log・受付・席の登録など) と host の manifest を置く dir。 本 ADR の tick の宣言はこの dir の host.toml に置く。
  ・doctor（doctor）: 器の状態と host の配線を 1 回で照合して行に並べる subcommand。 本 ADR の後は表の在る host の行に tick=declared を出し、 flag が無くても面の値で登録 row ごとの unit の有無を名指す (表の無い host の行は 1 字も変わらない)。
  ・init（init）: repo ごとに 1 回撃つ器の subcommand (ADR-1063)。 雛形の host の面の表を新しい置き場へ写す。 本 ADR の後は [[tick]] を 5 表目として写す。
  ・雛形の置き場（template state dir）: host init が git の global 設定に登録する既存の state dir 1 つ (ADR-1063)。 人はここの host の面に 1 度だけ [[tick]] を書き、 init がそれを写す。
  ・裁定 id（ruling id）: user 裁定を一意に指す id。 裁定の時刻 (UTC)。 本 ADR は 2026-09-24T22:09Z の候補 2 を指す。
