      撤退: doc の注の行の数が替えの時から 25 % 増えたら、doc の注にも上限の行を足すか戻すかを問う（kind measure）。
      費え: 行 2 本（数え方の替え・穴を塞ぐ便）と裁定 1 本。待ちは約半日（I）。
    verdict: rejected
    reason: |
      主張する利益: 振る舞いを持つ code の量だけを縛る。doc の注を削る誘いが無くなる。一度で余地が約 1.9 万行（伸びの約 6 日分・F10）になる。
      失う物: 上限 90000 の字を保ったまま実は 21 % 上げる（作法の行 D-8 と条 A-2.3 の上限の替えに当たり、字の上で上げに見えない分だけ持ち主の目から隠れる）。2026-09-15 の数え方の替えと同じ形の 2 度目で、上げの根（note の B1）の数え方を替えて余地を作る口を太くする。上限が何を守るのか（2 つ目の問い）が決まる前に、読む量を縛るのを止める事になる。
  - id: d
    name: 丁 — 穴を残し、上限だけを上げる
    text: 穴は器の memo に置き、R-C4-1 を見込みの分だけ上げる便だけを流す。
    verdict: rejected
    reason: 穴は数えから本番の code を外す抜け道で、知った後に残すのは門の回避と同じ（席の memo の席の決め 04:25Z）。真の数えでは既に上限を越えている事（F3）と、82,000 と 90,000 への上げも越えた後だった事（F11）が隠れたまま、次の上げの問いの数が 1,413 行ずれる。穴は子 process の禁止と外の値の読みの禁止の目も塞ぐ（F2）。
