# 判断の記録 ADR-79 — 器の core の総行数の上限（器の行 R-C4-1・値 90000）と数え方の穴の扱い（第 2 稿）
# 第 1 稿は係 w408a、検証役 v410 の 1 巡の攻め（直す 10・問う 15）を入れた第 2 稿は係 w411a（2026-10-07）。数は写しの木 main 629bbd5d（器の core の src は 799d350b と同じ）で、係の数えの写し（drafts/w411a/w/count3.py・決めた式をそのまま写した数え）で撃ち直した。撃った命令と rc と所見の処分の表は drafts/w411a/w/notes.md。穴を塞ぐ契約の行の第 2 版は drafts/w411a/w/contract/v-core-count-hole.toml と .md で、式はこの記録の決定 (1) と同じ字である。持ち主の承認の前（status proposed・承認の欄と攻めの欄は空）。条文は替えないので amends は無い。
# 持ち主の裁定 t3-hub.92.10.12 で発効（2026-10-07・推奨の案 甲）。反対側からの検証は検証役 v410 の 1 巡（docs/grill/2026-10-07-ADR-79-grill.md）。行 R-4 の数える範囲（population）の字は、穴を塞ぐ便の着地の commit で当てる（code の数え方と行の字を同じ時に替える）。
id: ADR-79
title: 器の core の数え方の穴を末尾の検査の連なりの式で塞ぎ、上限 90000 を保って縮めの行で承認済みの 77-4 を流し、77-5 から後の道を同じ問いの 2 つ目で持ち主に決めてもらう
status: retired
date: 2026-10-07
superseded_by: ADR-80
context: |
  器の core の総行数の上限は器の行 R-C4-1（値 90000・裁定 user 2026-10-03T05:09Z）で、tsuzuri の規則の行 R-4 がその値を名指す。行 R-4 の上限の替えも、数える範囲（population）の替えも、条 P-22.3 により条 A-2 を通し、条 A-2.3 の攻め（grill）を前に置く。前例として、範囲の替えは緩めでも締めでも同じ手続きに通す（docs/grill/2026-09-30-O-r4-range-grill.md の 52 行目）。ADR-77 の行 77-4 の残りの便を置く前に、器の core の余地が尽きた（席の memo の notes 2026-10-07T04:15Z・04:25Z）。印 V は現物で照らした・D は導いた・I は見立て・U は分からない。
  ・（F1） 今の値（V・幅 120 の重みの行）: 今の式（file の最初の行頭の検査の印（#[cfg(test)]）から末尾を歯と読む）で core の本体は 89,012 行・余地 988 行。
  ・（F2） 数え方の穴（V）: 審査の file（pipe/review.rs）の 69 行目と移しの証の file（pipe/move_proof.rs）の 27 行目は、検査の印が 1 行の取り込み（use）に掛かるだけで、その下の本番の code が歯として数えから外れる。穴を作ったのはどちらも便である（移しの証の file は着地の commit（629c88aa・2026-09-21）、審査の file は着地の commit（bab8daf6・2026-10-06））。同じ切り方は、器の core の閉包（closure.rs の src_region と test_region）と衝突の予想（collide.rs）、器の xtask の数え（workspace.rs の split_test_src）と core の本体の子 process の禁止と外の値の読みの禁止と規則の読み手の数え（check_sizes.rs の body_lines・env_reads.rs の sites_in・rules_wired.rs の reader_lines）、器の境界の e2e の歯の助け（main.rs の help_body_count）、tsuzuri の xtask の数え（xtask/src/size.rs の split）に在る。器の xtask の印の反転の照らし（flipcheck.rs の split_regions）だけは、印の次の空でない行が mod で始まる時だけ切る形を既に持つ。穴は数えだけでなく、子 process の禁止と外の値の読みの禁止の目も塞いでいる（今その区間に子 process と外の値の読みは 0 件の潜んだ穴・V は検証役 v410 の照らし）。
  ・（F3） 穴を塞いだ数（V・決定 (1) の式）: core の本体は 90,425 行で余地は −425 行。差 1,413 行は審査の file 806 行と移しの証の file 607 行だけで、ほかの file に差は無い。走査の作りの違う調べ係 r407 の真の区間の数え（検査の印が掛かる item の span の和）とは、同じ commit（4a1efdc2）で 90,408 対 90,404 の 4 行差（2 つの file の真ん中の検査の印の付いた取り込みの行）。tsuzuri の crates と tsuzuri の xtask と器の xtask と器の境界の crate の本体の数は、決定 (1) の式でも替わらない。決定 (1) の式で歯の区間が空になる file は器の crate に 0 本で、歯を探す関数（test_region）から消える歯は無い。
  ・（F4） 行の種類（V・決定 (1) の式の本体・幅 120 の重み）: code 63,339・doc の注 19,053（21.1%）・空行 7,048・ほかの注 985。10 行を越える doc の注の塊は 119 か所・計 2,001 行で、各塊を 5 行に縮めると 1,406 行が減る（上の限り）。module 別の減りは pipe 830・hook 149・seat 133・headless 118・fleet 66・ledger 51・rules 27・polarity 18・account 7・order 7。
  ・（F5） 縮める道（r407 の §3 と v410 の照らし）: 歯だけが呼ぶ pub 28 本 215 行と呼び手の無い定数 2 行（上の限り 217 行・V）のうち、別の crate の統合の検査が呼ぶ 2 本（NOT_A_GUARD 22 行・SHAPES 15 行）は歯の区間へ移せない（cfg(test) は検査する crate にだけ効く・D）。列挙と並べて置く pin の const は本体に残る（D）。手残りは約 130〜180 行（I）。同じ本文の fn の重なりは code 5 行以上の 10 組で上の限り 116 行・手残り約 80〜116 行（I）。doc の注の塊は上の限り 1,406 行・審査と持ち主の目に通る分を 30〜70% と見て手残り約 420〜990 行（I）。縮めの上の限りの和は 1,739 行（D）、手残りの和は約 630〜1,290 行（I）。
  ・（F6） 見込みと実の増え（V）: 落ちの記録の便（v-fall-record）は見込み 543 行に本体の実の増え 306 行、構造の欄の便（v-structure-fields）は見込み 88 行に実の増え 17 行。実は見込みの 0.19〜0.56 倍。
  ・（F7） 穴を塞ぐ行（v-core-count-hole・契約の第 2 版）そのものが core に足す行: 欄 growth の core の .rs の和は 213 行（D・受付の見込み・歯を含む）、本体の増えは約 100 行（I）。
  ・（F8） 承認済みで器の core を触る行: ADR-77 の行 77-4 の残り（落ちの数えの便（v-fall-count）は走り中で見込み 293 行・系譜の便（v-fall-lineage）218 行・構造の札の便（v-structure-tag）427 行・V は台帳の notes の字）、行 77-5〜77-7（見込みは U）、行 77-8（器の core に乗る分は U）、ADR-78 の道具の行のうち器へ移す物（見込みは U）。
  ・（F9） 足りる量（D と I）: 上限 90000 の下で 77-4 を流し切るには、受付の見込みでは 425＋213＋293＋645＝1,576 行の余地が要る（D）。実の増えで見ると 425＋約 100＋56〜165＋123〜361＝約 704〜1,051 行（I・F6 の比で割り引いた）。縮めの手残り（約 630〜1,290 行・I）は、下の側では 77-4 にも足りず、上の側でも 77-4 の後に残る余地は約 580 行までで、77-5 から後の行はほぼ入らない（I）。
  ・（F10） 伸びの速さ（V・r407 の §4）: core の本体は 09-23→09-30 に +23,307 行、09-30→10-07 に +22,368 行（1 日あたり約 3,195 行・D）。縮めの上の限り 1,739 行は伸びの約 0.54 日分（D）。
  ・（F11） 上げの来歴（V・器の commit と台帳・詳しくは note の上げの根）: 値は 20,000（2026-09-09）から 7 回上がり 90,000 になった（24 日で 8 つの値）。ほかに 2026-09-15 に数え方を替え、file の中の歯の区間を数えから外した（上限 40,000 は保った・実の上げ）。上げを問うた時点の commit を決定 (1) の式で数えると、66,000 の問い（c9423568）で 58,225 / 60,000、74,000 の問い（faf41b76）で 63,820 / 66,000、82,000 の問い（2fbe0c11）で 74,054 / 74,000、90,000 の問い（b5d8b24e）で 82,132 / 82,000 で、後の 2 回は真の数えでは既に上限を越えた後の上げだった（移しの証の file の 607 行の穴が隠した）。tsuzuri の規則の行 R-4 が器の行を名指した 2026-09-29 より後の 3 回の上げには、tsuzuri の側の攻めの記録（docs/grill）と判断の記録が無い（V）。
decision: |
  (1) 穴を塞ぐ（どの案でも同じ）。歯の区間（検査の区間）を、file の末尾まで検査の印の付いた top の item だけが続く連なりの、最初の item の行の頭から末尾までとする。印は top の item の頭の外の属性のうち、空白を除いた字が検査の印（#[cfg(test)]）に等しい物とする。item の終わりは、字・一字・注・生の字と寿命の一重引用符を飛ばした括弧の深さで読む（字下げや閉じの波括弧の列に頼らない）。最後の item が印の無い item なら歯の区間は空で、file の全体が本体である。真ん中の印の付いた item は本体に数える（数えすぎの側）。名で検査の file（tests.rs と _tests.rs で終わる file）は今の通り丸ごと歯と読み、その宣言が宣言する file の歯の区間に在る事を core の歯が照らす。
    式を選んだ訳（決定はしご・条 P-27.1）: 穴は在る（段 1）。印の反転の照らしの切り方（印の次の行が mod の時だけ切る）は既に在る（段 2）が、file の頭に印の付いた空の mod を置く形と、mod の後に本番の code を置く形を歯と読む抜け道が残るので足りない。第 1 稿の式（mod で始まる最初の印から末尾・後に本番の code が在れば全体を本体）は、閉じを行頭の閉じの波括弧で読むので字下げを崩した形で抜け（器には整形の門が無い）、全体に倒した file の歯が閉包と審査から消える。core と xtask は依存の crate を 1 つも持たず、標準の library に Rust の字句の読みは無い（段 3）。1 行では書けない（段 4）。なので item を字句で読む最小の実装を core と xtask に 1 つずつ置き、ほかの読み手（閉包・衝突の予想・受付の数え・xtask の 4 つの測りと印の反転の照らし・e2e の歯の助け）はその 2 つを呼ぶ（段 5）。2 つの実装の一致は、core の見本の file 1 本を両方の crate の歯が撃って守る。式の比べの表は notes の「式の比べ」。
    行 R-4 の数える範囲（population）の字を同じ字に替える（数える範囲の替えなので条 P-22.3 と条 A-2 を通し、この記録の攻めがその攻めを兼ねる）。器の側の数え方の決め（user 2026-09-15 の裁定の中身）も替わるので、器の憲法の条 A2 の攻めはこの記録の攻め（検証役 v410 の 1 巡）が兼ね、裁定は 1 本で tsuzuri の行 R-4 と器の数え方の両方を覆う（I・器の側の記録に同じ裁定 id を写す）。契約の行は穴を塞ぐ便（v-core-count-hole・第 2 版）。tsuzuri の xtask の数え（xtask/src/size.rs）は器の便と別の tsuzuri の行（仮の名 t-core-count-tail）で同じ式に揃える。その行の着地まで tsuzuri の数えは今の式のままだが、今の tsuzuri の crates では値が替わらない（F3）。
  (2) 穴を塞ぐ便は、真の数えの余地がその growth の core の .rs の和（213 行・F7）を下回る間は、着地の時に器の xtask の core-lines で落ちる（受付は PATH の binary に埋めた今の式で数えるので通る）。穴を塞ぐ便の着地の後に PATH の binary を入れ替え、受付も新しい式で数える。
  (3) 上限 90000 を保ち（作法の行 D-8）、縮めの行で余地を作る（選択肢 甲を採る）。縮めの行は次の 4 本で、どれも本体の振る舞いを替えない（歯の数と断言を替えない・在りかと doc の字だけを替える）。印の反転の照らし（flip-check）と審査をどう通すか（移しの札か、doc だけの便の形か）は各行の契約に書く（U）。
    ・行 一 歯だけが呼ぶ pub を歯の区間へ移し、呼び手の無い定数を消す。別の crate の統合の検査が呼ぶ pub（NOT_A_GUARD・SHAPES）と列挙と並べる pin の const は移さない（手残り約 130〜180 行・I）。
    ・行 二 同じ本文の fn の重なりのうち code 5 行以上の 10 組を 1 本に寄せる（手残り約 80〜116 行・guard.rs と role_guard.rs の 2 組は可視性を替える）。
    ・行 三 pipe の 10 行を越える doc の注の塊を、名・型・断りの理由と出所の id の 1 行を残して 5 行以内に縮める（上の限り 830 行）。設計の文と判断の記録の字の写しは出所の id の名指しに替える。
    ・行 四 pipe の外の同じ塊を同じ形で縮める（上の限り 576 行）。
  (4) 行の順: 1. 走り中の落ちの数えの便（v-fall-count）は止めない（席の決め・memo の notes 04:25Z）。2. 一・二を並べる。3. 真の数え（count3.py の core_lines_tail）の余地が穴を塞ぐ便の growth の core の .rs の和（213 行）以上になったら、穴を塞ぐ便を流す。足りなければ 三 を先に流す。4. 穴を塞ぐ便の着地と PATH の binary の入れ替えの後に、系譜の便（v-fall-lineage）と構造の札の便（v-structure-tag）を、受付の余地が各行の見込み以上の時に置く。足りなければ 三、次に 四 を流す。一〜四 は古い式の数を減らすだけで増やさない（余地を増やす側）。5. 行 77-5〜77-8 のうち器の core を触る物と ADR-78 の道具の行のうち器へ移す物は、持ち主が 2 つ目の問い（(5)）に答えるまで置かない。
  (5) 2 つ目の問い（この記録と同じ問いで持ち主に出す）: 77-5 から後の器の core の伸び（F10 の速さなら 1 週で約 2 万行）を、どの道で受けるか。案は、(i) 承認済みの行の growth の和だけ上限を上げ、上げは前の上げの後に着地した縮めの行と対にする（選択肢 乙の形）、(ii) core を crate に割り、割った crate に器の上限の行を足す（選択肢 戊の形）、(iii) 承認済みの行の範囲を細くするか core の外に置く（ADR-77 と ADR-78 の範囲の替え）。問いの前に「上限が何を守るのか（読む量か・組み立ての時間か・境界の形か）」を持ち主に名指してもらい、それで (i)〜(iii) を同じ物差しで比べる。答えまでの間、(4)-5 の行は待つ（費えは選択肢 甲の失う物）。
  (6) 上げの問いの形は、新しい決まりを足さない。器の憲法の条 A2（閾値の替えの前の攻め）・条 A-2.3・行 D-10（上限の替えは出す前に必ず攻めさせる）が既に求めている（決定はしごの段 2）。漏れの根は決まりの無さでなく門の無さ（note の B5）なので、器の規則の差の照らし（rules-diff）が C4 の行の値の替えに攻めの記録の path を要る形は、(5) の答えで上げの道を採った時に、その記録で問う（今は採らない）。
  (7) 消す物（条 P-27.2）: （K1） 読み手ごとの最初の行頭の印で切る分かれと印の字の const（閉包の test_mark_at と TEST_MARK・xtask の check_sizes.rs と env_reads.rs と rules_wired.rs の TEST_MOD_MARK と印で break する分岐・印の反転の照らしの test_offset と marker_offset と next_line_is_test_mod と TEST_MOD_HEADS と列 0 を先に見る字下げの逃げ・e2e の help_body_count の割り）と、その字を書いた doc の注。（K2） 行 R-4 の population の「file の行頭 #[cfg(test)] の最初の行から末尾を検査の区間」の字。（K3） 縮めの行が移す pub の本体の側の宣言と、寄せた重なりの 2 本目以降の fn。（K4） 今の式を pin する見本（2 つの SPLIT_FIXTURE の字と値）と、字下げの印を区間の始まりと読む歯（entrance_test_mod_mark_allows_indent）。（K4 の続き） 第 1 稿の数えの写し（drafts/w408a/w/count2.py）は数えの名指しから外し、count3.py に替える。撤退の 2 つの鍵の手の記帳は、行 77-8 の日次の測りに移った時に消す。
options:
  - id: a
    name: 甲 — 穴を塞ぎ、上限 90000 を保ち、縮めの行で 77-4 を流し、77-5 から後は 2 つ目の問いで決める
    text: |
      決定 (1)〜(7)。行は穴を塞ぐ便と縮めの行 一〜四 の 5 本（器の便・size はどれも M・I）と、tsuzuri の数えを揃える行 1 本。待ちの見立ては 1 便あたり 30 分〜1 時間（落ちの記録の便は起こしから着地まで約 30 分・memo の notes）で、一・二・穴を塞ぐ便と要るだけの 三・四 を流して約 1 日（I）。足りる量は（F9）のとおり幅を持つ（I）: 縮めの手残り約 630〜1,290 行に対し、77-4 を流し切るのに実の増えで約 704〜1,051 行が要り、下の側では 77-4 の構造の札の便が入らない。
      撤退: 撤退 (1)・(2)。
      費え: 行 6 本・裁定 1 本（行 R-4 の数える範囲の字）・2 つ目の問い 1 本。
    verdict: adopted
    reason: |
      主張する利益: 持ち主の決めた値 90000 を揺らさない（作法の行 D-8）。穴を知った後に漏れた余地で行を足さない（門の回避を止める）。持ち主が 3 度求めた「後でリファクタリング」（2026-09-13・09-14・09-15・器の台帳 s2-07l.198 と s2-07l.238 と s2-07l.339 の notes）を、上げの代わりの行として初めて形にする。上げの根（note の A2・A5）の「上げと縮めを対にしない」を、上げずに縮めで受ける形で止める。2 つ目の問いを今出すので、持ち主が本当に決める問い（上限が守る物と伸びの受け方）を先へ送らない。
      失う物: 承認済みの行を待たせる。持ち主の決めた範囲（ADR-77 の行 77-5〜77-8 と ADR-78 の道具の行のうち器へ移す物）を、2 つ目の問いの答えまで止める（作法の行 D-8 は甲にも当たる＝持ち主の 2 つの決め（上限 90000 と承認済みの行の範囲）が当たり合い、甲は範囲の側を待たせる）。答えが同じ日に出れば待ちは約 1 日、出なければ撤退 (1) の窓（7 日）まで。77-4 の残りも約 1 日遅れる。doc の注の縮め（行 三・四）は、code を読む係と審査の材料から設計の訳の字を減らし、出所の id を辿る手間を増やす。審査が材料の欠け（section-material-missing）で決めきれない判じ（INCONCLUSIVE）は前例が在り（器の台帳 s2-07l.740 の notes）、増える側に起きうる（I）。縮めの行は多くの file を触るので、走り中と後の行と write-set が交わり、並べられない待ちが増える（I）。縮めは伸びの約 0.54 日分で（F10）、一度きりである。
  - id: e
    name: 戊 — 上限 90000 を保ち、core を crate に割って、割った crate に上限の行を足す
    text: |
      core の module の群（hook 13,074 行・fleet 9,864 行・seat 8,227 行・V は r407 の §2）を新しい crate に移し、その crate に器の上限の行を足す。core の上限の値 90000 の字は替えない。前例は 2026-09-24 の境界の crate への移し（器の台帳 s2-07l.198）。穴を塞ぐ事は甲と同じ。
