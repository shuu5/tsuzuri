    text: |
      穴を塞ぐ便の前に、R-C4-1 を 90,000 から 91,600 に上げる便を着地させる（穴 425 行・穴を塞ぐ便の growth の core 分 213 行・77-4 の残り 3 本の見込み 938 行の和 1,576 行を 100 行に切り上げ・D）。上げを縛る構造: (a) 上げは、前の上げの後に着地した縮めの行が上げの幅の 25 % 以上を減らした後に限る。(b) 着地ごとの増えの記帳（行 77-8 の日次の測りの項に足す）。(c) 上げの幅は承認済みの行の見込みの和を越えない。(a) と (b) は上げと切り離して甲にも付けられる。
