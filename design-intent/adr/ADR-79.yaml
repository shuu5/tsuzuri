    name: 己 — 上限の値でなく、伸びに週ごとの予算を置く
    text: 上限 90000 の字は替えず、core の本体の伸びに週ごとの予算（例 1 週で承認済みの行の growth の和まで）を置き、予算を越える行は次の週へ送る。穴を塞ぐ事は甲と同じ。測りの便 1 本で着地ごとの core-lines の前後の差を数える。
