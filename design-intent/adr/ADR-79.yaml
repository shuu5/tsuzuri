grill:
  who: 検証役 v410（AI・起草者と別の独立の文脈・読み取りだけ）
  when: 2026-10-07
  where: docs/grill/2026-10-07-ADR-79-grill.md
  summary: 検証役 v410 が係 w408a の第 1 稿を 1 巡攻めた（直す 10・問う 15・よい 10）。重い物は、行頭の検査の印で切る式の写しが第 1 稿の 5 か所の外に 4 か所在り、穴が子 process と環境変数の読みの目も塞いでいた事・第 1 稿の式が字下げした閉じで抜ける事（係 w409a の式に揃える）・穴を塞ぐ便そのものの増えが足りる量に入っていない事・甲も承認済みの行を待たせるので作法 D-8 が甲にも当たる事・撤退が測れない形だった事。係 w411a が全部を処分した（drafts の w411a/w/notes.md の表）。
retreat:
  kind: measure
  condition: |
    数えは tsuzuri の設計の席が取る。穴を塞ぐ便の着地の前は係の数えの写し（python3 -I count3.py <tsuzuri の repo> <main の hash> scribe2/crates/scribe2/src/）の core_lines_tail を、着地の後は器の xtask の core-lines の値を、縮めの行と穴を塞ぐ便と 77-4 の便の着地ごとに 席の memo か後継の memo の notes に撃った命令と数で記帳する。審査の判じは、器の台帳の便の notes の判じの字（INCONCLUSIVE と section-material-missing）を席が数える（器の event の鍵の名は U）。どちらも手の記帳で新しい仕組みを足さず、ADR-77 の行 77-8 の着地の後は日次の測りの欄 measure の項へ移す（鍵の名はこの欄のまま）。問う相手は持ち主。各行は 鍵・向き・閾値・窓 の形で書く（条 P-4.2）。
    (1) 鍵（core_true_headroom）（真の数えの器の core の余地・行）・向き 下回る・閾値 645 行（系譜の便 218 行と構造の札の便 427 行の見込みの和）・窓 穴を塞ぐ便の着地の日から 7 日（日付で閉じる・穴を塞ぐ便が 2026-10-10 までに着地しなければ 2026-10-10 から 7 日） → 窓の末に下回っていれば、縮めの行をもう 1 本書くか、2 つ目の問いの案 (i)〜(iii) のどれかを、2 つ目の問いの答えが無ければ改めて持ち主に問う。
    (2) 鍵（review_material_missing_7d）（審査の判じが材料の欠け（section-material-missing）で INCONCLUSIVE になった器の便の数・件）・向き 越える・閾値 1 件（2 件以上で当たる）・窓 行 三 の着地の日から 7 日 → doc の注の縮め（行 三・四）を戻すか、選択肢 丙を持ち主に問う。
plain: |
  器（scribe2）の中心の部品（core）には「全部で 90,000 行まで」という上限があり、超えると機械が着地を止めます。この上限は 24 日で 7 回上がり、20,000 行から 90,000 行になりました。
  1. 数え方の穴が見つかりました。「ここから下はテスト」という印を 1 行のために使った 2 つの file で、その下の本番の code 約 1,400 行が数えから外れていました。正しく数えると、今すでに上限を約 425 行超えています。過去の 82,000 と 90,000 への上げも、正しく数えると既に上限を超えた後でした。穴はどの案でも塞ぎます（file の末尾に続くテストの部分だけをテストと数える式にします）。
  2. 推す案（甲）は、上限 90,000 を保ち、code を縮める行（テストだけが使う部品をテストの側へ移す・同じ中身の関数を 1 つにする・長い説明の注を短くする）で余地を作ってから、穴を塞ぎ、承認済みの行（77-4）を流す案です。縮めで作れる余地は約 630〜1,290 行の見込みで、77-4 を流し切るのにぎりぎりか足りない場合があります。縮めは伸びの約半日分の一度きりなので、その先の承認済みの行（77-5 から後と、器へ移す道具の行）は、あなたの 2 つ目の答えまで待たせます。失う物は、その待ちと、code の中の長い説明が短くなる事です。
  3. 選ばなかった案: 戊は core を部品に割り、割った部品に別の上限を置く案です（数日かかり、今の詰まりは解けません）。己は伸びに週ごとの予算を置く案です（今の超過を解きません）。乙は上限を 91,600 行に上げて上げを縛る決まりを足す案です（あなたの決めた 90,000 を替えます）。丙は説明の注（全体の 21 %）を数えない案で、字の上では 90,000 のままですが、実は約 19,000 行の上げです。丁は穴を残して上げる案で、門の回避になります。
  4. 上げが続いた根は、AI の側では「前回と同じ幅」での上げの推奨と、上げと縮めを対にしなかった事と、上げには攻め（grill）が要るという既に在った決まりの半分を撃たなかった事、器の側では上げの手続きが軽く攻めの半分に門が無い事と、数え方の穴です。
  決めてほしい事は 3 つです: (1) 案（推奨は甲）。(2) 数える範囲の字の替え（穴を塞ぐ式）。(3) 2 つ目の問い: 77-5 から後の伸びをどう受けるか（上限が何を守るのかを名指したうえで、限った上げ・core を割る・承認済みの行を細くするのどれか）。
approval:
  who: 持ち主
  date: 2026-10-07
  surface: R-8
  verbatim: 上限の判断の記録は推奨でよい
  ruling: t3-hub.92.10.12（裁定 id = t3-hub.92.10.12:20261007T0529Z-1・notes に逐語）
note: |
  第 1 稿の起草は係 w408a、第 2 稿は係 w411a（2026-10-07・検証役 v410 の所見の全部の処分は drafts/w411a/w/notes.md の表）。数は写しの木 main 629bbd5d で係の数えの写し（count3.py）を撃って取った（V）。第 1 稿の数（90,453・差 1,441・調べ係 r407 との 49 行の差）は第 1 稿の式の数で、決定 (1) の式に揃えて 90,425・差 1,413・4 行の差に替えた。
  名の列: 選択肢の名（甲〜己）は席の頼みの 3 筋（甲・乙・丙）に、比べのための丁と、検証役 v410 が挙げた欠けた案の戊・己を足した。縮めの行の 一〜四 と tsuzuri の行（t-core-count-tail）は仮の名で、席が契約の行の id に替える。
  上げの根（事実・V は器の commit の本文と器の台帳 issues.jsonl の字）:
  ・20,000（6d937b06・2026-09-09）初めの値。
  ・26,000（0cdd2e67・2026-09-13・裁定 user 2026-09-13T07:08Z）機能の便 s2-07l.191 の write-set の中に値の替えを入れた。持ち主は同じ時に縮めの要を言い、s2-07l.198（縮めの行）が起きた。
  ・40,000（95ec722d・2026-09-14・裁定 user 2026-09-14）きっかけは便 s2-07l.208 の 4 回目の走りが 26,000 を 129 行越えて着地の門で落ちた事。持ち主の字は「上げて後で縮める」の趣旨（逐語は器の台帳 s2-07l.238 の notes）。
  ・2026-09-15 数え方の替え（s2-07l.198.1・裁定 user 2026-09-15T10:07Z）file の中の歯の区間を数えから外した（上限 40,000 は保った・実の上げ）。
  ・60,000（55dc7f1d・2026-09-15）きっかけは s2-07l.303 の着地で余地 3,198 になり s2-07l.241 が受付の余地で止まった事。持ち主の字は「一時的に緩め、縮めを定期的に」の趣旨（逐語は器の台帳 s2-07l.339）。縮めの行 s2-07l.198 は 2026-09-24 に閉じた（境界の crate への移し）。
  ・66,000（1862abd0・2026-09-29・s2-07l.740）理由は core-lines 57,618 / 60,000 と束 A・D・E の計画の約 +5,500 行。
  ・74,000（51f49c48・2026-09-30・s2-07l.741）理由は 63,213 / 66,000 と束 E の見込みの和 約 7,800 行。
  ・82,000（cb950ac3・2026-10-01・s2-07l.746）理由は 73,447 / 74,000 と見込みの和 約 5,900 行。推奨の字は「前回と同じ +8000」。真の数えは 74,054 / 74,000（F11）。
  ・90,000（8f0849be・2026-10-03・s2-07l.753）理由は余地 475 と見込み約 850 行と待ちの行。推奨の字は「前回と同じ +8000」。真の数えは 82,132 / 82,000（F11）。
  AI の側の根（席と設計の係の手）:
  （A1） 上げの幅を、待ちの行の見込みの和か前の幅の写しで決めた（V・s2-07l.745 と s2-07l.752 の問いの推奨の字）。上げの度数を決めたのは伸びの速さ（F10）である（D）。
  （A2） 上げと縮めを対にしなかった（V・s2-07l.740・741・746・753 の本文に縮めの行の名が無い）。
  （A3） 上げの問いは要と推奨だけを書き、失う物と撤退条件を書かなかった（V・本文の節は 概要・技術・理由・推奨）。
  （A4） 穴は便が作り、審査も着地の門も見なかった（V・F2 の 2 commit）。故意の跡は見当たらない（I）。
  （A5） 器の憲法の条 A2 は C4 の閾値の替えの前に攻め（grill）を求める（V・器の設計の憲法の A2 の行）が、上げの問いは A2 を「user の裁定を要る」とだけ引き（V・s2-07l.745 と 752 の理由の字）、攻めの半分を撃たなかった。
  （A6） tsuzuri の側でも、行 R-4 の note と条 P-22 の注は 2026-09-29（c8c0998c）から「器の行の値を替えるのも P-22.3 の上限の変更に当たる」と書いていたのに、席は後の 3 回の上げで行 R-4 の値の字だけを写した（V・0f95444b と bb7bf028 ほか）。繋がりが無かったのでなく、在った決まりを撃たなかった（第 1 稿の B2 を AI の側へ移した）。
  器の側の根（仕組み）:
  （B1） 上げの口が軽い: 上げは値と裁定 id と値を pin する歯だけを替える S の便で、問いの答えは短い承認の字で足りた（V・s2-07l.740〜753）。数え方の替え（2026-09-15）も同じ口で通った。
  （B3） 数え方の穴: 式の写しが読み手ごとに在り、印の後が歯だけかを照らす歯が無く、印の反転の照らしだけが別の切り方を持っていた（V・F2）。
  （B4） 上限は着地の門と受付の見込みでだけ効き、伸びの向きを知らせる測りが無い。どの上げも余地が上限の 8 % 以下か越えた後に出た（V・余地 −129 / 26,000・3,198 / 40,000・2,382 / 60,000・2,787 / 66,000・553 / 74,000・475 / 82,000・真の数えでは後の 2 つは越えた後）。
  （B5） 条 A2 の攻めの半分に門が無い: 器の規則の差の照らし（rules-diff）は値の替えに裁定 id が在るかだけを見る（V・rules_diff.rs の頭）。決定 (6) のとおり、決まりを足しても同じ所で漏れる（I）。
  まだ分からない事（U）: 行 77-5〜77-7 と ADR-78 の道具の行の器の core の見込み。縮めの行が印の反転の照らしと審査をどう通るか。器の審査の判じの event の鍵の名。器の憲法の条 A2 の攻めを tsuzuri の記録の攻めが兼ねる事を、器の側の記録がどう名指すか。
