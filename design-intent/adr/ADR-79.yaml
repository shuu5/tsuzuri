    verdict: rejected
    reason: |
      主張する利益: core の値 90000 の字と、承認済みの行の範囲の両方を揺らさない。core の読む量を群の境界で割れる。
      失う物: crate の間の pub の面が増え、組み立ての形が替わる。新しい crate に上限の行が無ければ 3 度目の数え方の口になり、行を足すので消す物の名指し（条 P-27.2）が要る。上限の総和は実は上がる（作法の行 D-8 の範囲の替えに当たり、甲と同じく持ち主の決めが要る）。移しの行は数日掛かり、77-4 の今の詰まりを解かない。今の詰まりの答えでなく、2 つ目の問いの案 (ii) として持ち主に出す。
