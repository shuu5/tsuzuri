      (D) 管理席がその場で答える。 却下: 契約の SSOT は planner が持ち (台帳の契約・C15.2)、 席が答えると契約と実装が別の言葉を持つ。 中継に限る (§2.3)。 (D') 質問を Blocked に相乗りさせる案も却下: 承認 (人由来・3 クラス) と質問 (機械由来が既定・契約の不足) は意味も actor も違い、 同じ段に載せると FR1022 の計測が混ざる。
