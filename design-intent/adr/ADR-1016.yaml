    name: "runner を teammate (Agent tool の subagent) にして親へ text で聞き返す"
    text: |
      (B) runner を teammate (Agent tool の subagent) にして親へ text で聞き返す。 却下: settings 不読の強制 (ADR-1011)・無 session での起動・typed な判定入力 (ADR-1012)・毎回明示の権限 (ADR-1009 / 0010) の 4 差を失い、 判定入力が自由文になる (C3.3 の向き)。 口座分離が席の層で達成できることは、 この 4 差を埋めない (research §4)。
