  - id: "C"
    name: "質問を gate の FAIL で代用する"
    text: |
      (C) 質問を gate の FAIL で代用する。 却下: 契約の穴が「実装の失敗」として記録され、 契約側を直す向きが judgment に残る。 FR1022 の計測で人の関与 (回答) が見えない。
    verdict: rejected
    reason: "契約の穴が「実装の失敗」として記録され、 契約側を直す向きが judgment に残る。 FR1022 の計測で人の関与 (回答) が見えない。"
