# 判断の記録 ADR-41 — 器が便に渡す口座を選ぶ順の頭に、ほかの置き場の走りを持つ口座を後に回す鍵を足す（持ち主の裁定 2026-10-04・記帳先 = tsuzuri の台帳の問い t3-hub.74.61.1 の notes）
# 起草は係 w120a（2026-10-04）。材料は drafts/w112a/w/notes.md（席への問い）と drafts/w120a/w/notes.md（試作と噛み）。承認の欄の逐語は適用の script が --verbatim41 の file から入れる。
id: ADR-41
title: 器は便に渡す口座を選ぶ時、ほかの置き場で便が走っている口座を外さずに順の最後へ回し、ほかに候補が無ければその口座を選ぶ
status: accepted
date: 2026-10-04
context: |
  実験場（ADR-37）の便は、本番と同じ口座の消える残りを使い（決定 (3)）、実験の置き場（state dir）は本番の置き場と同じ親の下に置く（決定 (5)）。ADR-37 の決定 (7) は、口座の選びに host の根の走りを数える行（xp-host-live）を最初の形 B の前に起こすと決めた。
  器の今の選び（器の判断の記録 ADR-0042）は、便に渡す口座を、(1) 7 日の窓の戻り（reset）の早い口座、(2) 走っている便の数の少ない口座、(3) 口座の名（label）の順で並べた先頭にする。走っている便の数は自分の置き場の記録（event）だけから数え、ほかの置き場の走りは見えない。しかも 2 つ目の鍵は、1 つ目の戻りが同じ口座の間でしか効かない。器の設計は、走っている便の数でも口座あたりの便の数でも口座を外さない（1 口座に何便でも重ねる）と書く。
  ゆえに今の形のままでは、本番と実験の便が両方とも戻りの最も早い同じ口座を選び、その口座の 5 時間の窓を取り合う。実験場の比べは本番と同じ時刻に走るので、取り合うと両方の出来の測りが濁る。
  前半の行（xp-host-runs）は、runner の間だけ host の根の札の置き場（runs）に、器が選んだ口座の名と置き場の字を持つ走りの札を置く。数える側の形がこの記録の問いである。
  問い（t3-hub.74.61.1）は案 A に裁定された（裁定 id は承認の欄）。
decision: |
  (1) 頭の鍵。器の便用の選びの並べ鍵の頭に「ほかの置き場の生きた走りの札を持つか」を足す。持つ口座は、7 日の窓の戻り・走っている便の数・口座の名のどれで先であっても、持たない口座の後に回る。持つ口座どうしは今の順（器の ADR-0042 の 3 つの鍵）のまま並ぶ。
  (2) 外さない。持つ口座を候補から外さない。ほかに候補が無ければその口座を選び、候補が 1 つも無い周の理由と待つ戻りの時刻は札で替わらない。実験の置き場が宣言した 1 口座を本番の便が使っている時も、実験の便は止まらずにその口座を選ぶ。
  (3) ほかの置き場の札。host の根の札の置き場（runs）の札のうち、置き場の字が自分の置き場の字と違い、持ち主の process が生きている札を数える。生死は受付の札と同じ判じ（process の番号（pid）の起動の時刻が札の時刻以前なら生）で見る。自分の置き場の走りは今までどおり記録の便の数（2 つ目の鍵）で数え、札では数えない。死んだ札と読めない札は数えるたびに消す（受付の札と同じ一時の印で、器の憲法の物の扱いの外）。
  (4) 読む所。便用の選び（便の起こし・上限で止まった便の起こし直しとその待ちの観測・gate の審査役の口座の選び）と、命令（fleet select）の便用の出力が、同じ 1 本の読みで札を読む。席の立て直しの選び（session 用）は札を読まない。
  (5) 器の記録との関係。器の判断の記録（ADR-0042）の 3 つの鍵は、この記録の頭の鍵の後にそのまま残る。器の判断の記録と設計文書は凍った資料のまま書き換えず（ADR-36 の決定 (7)）、器の部品の注はこの記録と後半の行（xp-host-live）を指す。
  (6) 効く時。後半の行（xp-host-live）が前半の行（xp-host-runs）の後に着地し、PATH の器の binary を入れ替えた後に効く。最初の形 B（ADR-37 の決定 (6)）の前に置く。
options:
  - id: a
    name: 札を持つ口座を順の最後に回す（外さない）
    text: 決定 (1) から (6)。
    verdict: adopted
    reason: 本番はほかに候補が在る限り実験の口座を避けるので 5 時間の窓を取り合わず、実験は宣言した口座で止まらずに走る。口座を外さないので、1 口座に何便でも重ねる器の形と候補なしの周の扱いを崩さない。
  - id: b
    name: 札を持つ口座を候補から外す
    text: 席の登録の口座と同じく、ほかの置き場の生きた札を持つ口座を便用の候補から外す。
    verdict: rejected
    reason: 実験の置き場は宣言した 1 口座しか持たないので、本番の便がその口座に 1 本でも居ると実験が待って止まる。本番も実験の口座を避けて候補が減り、口座待ちが増える。
  - id: c
    name: 今の 2 つ目の鍵（走っている便の数）に足す
    text: ほかの置き場の札の数を、走っている便の数に足す。
    verdict: rejected
    reason: 2 つ目の鍵は 7 日の窓の戻りが同じ口座の間でしか効かないので、戻りの早い同じ口座を本番と実験の両方が選び続け、取り合いが減らない。
basis: [ADR-37, ADR-36]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo（t3-hub.74.54）か後継の memo の notes に 1 件ごとに記帳する（日付・周・材料・当たった条件）。問う相手は持ち主。
    (1) 形 B の周の間に、本番の便がほかに候補を持ちながら実験の口座を選んだ（便の記録の口座と走りの札の時刻で照らす）ことが 1 度でも見つかったら、札の読み（置き場の字の照らしと生死の判じ）を調べて記帳し、形を問う。
    (2) 実験の便が宣言した口座の待ちで 30 分を越えて止まったら（外さない形では起きない見込み）、形を問い直す。
    (3) host の根の札の置き場（runs）の札が 100 枚を越えて残ったら（死んだ札の消し損ね）、回収の形を問い直す。
plain: |
  器が作業（便）に使う口座を選ぶ時、ほかの置き場（実験場など）で作業が走っている口座を後回しにする決めです（推奨の案）。
  後回しにするだけで外さないので、ほかに使える口座が無ければ、その口座をそのまま使います。
  これで本番と実験が同じ口座の 5 時間の枠を取り合わず、比べの測りが濁りません。実験の作業も止まりません。
approval:
  who: 持ち主
  date: 2026-10-04
  ruling: t3-hub.74.61.1（裁定 id = t3-hub.74.61.1:20261004T0113Z-1・口座の選びの鍵の順は案 A・席とのチャット・notes に逐語）
  verbatim: "１−７はすべて推奨で良い"
  surface: R-8
consequences:
  - 後半の行（xp-host-live）を、前半の行（xp-host-runs）の着地の後に流す（ノート surface-wave27b・試作は係 w120a）。器の部品の 7 file を書く（大きさ M）。
  - 命令（fleet select）の便用の出力も同じ順を出す（命令の出力の形は替えない）。
  - 置き場の字は字のまま比べる。--state-dir に相対の path を渡した置き場の札は、同じ置き場でも別の置き場に読まれて自分の口座を後に回しうる（外さないので便は止まらない）。
  - gate と受付の審査役の claude の走りは札を置かないので数えない（審査役どうしの口座の取り合いは残る）。
note: 起草 w120a（2026-10-04）。試作は写し drafts/w120a の枝（branch） xp-live（commit c9496898）。持ち主の逐語は台帳の notes に在り、この下書きには書かない（承認の欄は適用の script が入れる）。
