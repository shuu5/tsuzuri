  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「便」は器が自動で進める 1 つの作業、 「余地」は file の上限 (1 file 1500 行) までの空き、 「見込み」はこの作業でその file が増えそうな行数のことです。 器は作業を始める前に、 触る file のそれぞれについて「この作業で増える行数が file の空きに入るか」を見積で確かめます。 今の見積は契約の大きさ (S / M / L) 1 つを触る file の全部に同じ値で当てるので、 増える見込みが数十行の file まで大きな値で測られ、 空きに入る作業が入口で断られていました。 この記録は、 契約の行に file ごとの見込みを書ける欄 growth を足し、 入口の検査は file ごとの見込みと空きを比べることを決めます。 大きさの 3 段と上限の値は変えません。 見込みを信じるのは入口の先読みだけで、 上限そのものは着地前の門が実際に数えて守ります。
consequences:
  - "この判断で良くなることと、 代わりに引き受けることです。 空きに入る作業は行を割らずに通り、 見積の粒度が file に揃い、 版を跨ぐ形は欄 1 つで済み、 場当たりの分割が要らなくなります。 代わりに引き受けることは 5 つあります。 file と行数を手で書く宣言が増え、 見込みと実際の差は門でしか捕まりません。 古いプログラムは新しい欄を持つ設計 doc を丸ごと拒むので、 入れ替えが要り、 入れ替えるまでは欄を書いた作業が入口で同じ理由で断られ続けます。 触る file の列を器が自動で作る行と約束の行は欄を使えません。 入口の検査を直す file 自身の空きが小さいので、 この作業自体は一番小さい大きさで出します。 本体全体の見積は file ごとの見込みの合計になるので、 file ごとには空きに入っても本体全体の空きで断られることはあります。 見込みと実際の差の記録は、 この記録では決めません。"
  - "良い結果: 実増分が余地の内側に在る契約 (行 i の型) は、 行を割らずに file ごとの見込みを書くだけで受付を通る。 見積の粒度が測る単位 (file) に揃う"
  - "良い結果: 変わる面は任意の欄 1 つで、 write-set の項目の文法と接頭辞を剥がす関数と項目を読む site は不変。 赤になる既存の歯は欄の pin (FIELDS 17 → 18・任意 10 → 11・TABLE_ERRORS 15 → 16) と Contract の構築点 3 か所 (intake.rs の歯・pipe/mod.rs の歯の fixture・e2e/polarity.rs の fixture) と ContractRow の歯の fixture 2 か所 (table/check.rs・contract.rs) と CapHeadroom の samples (refuse.rs) に閉じる (全部 write-set の中)"
  - "良い結果: 断られた契約を戻す経路が定まり、 席が場当たりの純移動で余地を作る運用が要らなくなる。 純移動は設計の責務の群で切る便に戻る"
  - "代償: 行ごとに file と行数の対を手で書く宣言が増える。 宣言と実増分の乖離は受付では捕まらず、 gate の上限の測定でしか捕まらない (宣言を信じるのは受付の先読みだけ)"
  - "代償: 古い binary は growth を持つ doc を知らない key として doc ごと拒む。 着地は PATH の binary の入れ替えを伴い、 入れ替えるまでは growth を書いた行の受付が同じ理由で断り続ける"
  - "代償: write-set の欄を持たない行 (write-set を器が導出する行と約束の行) は growth を持てず、 その行は今までどおり size の一律の見積で測られる"
  - "代償: 本便自身は受付の余地が 133 行の file を触るので、 S でしか受付を通らない。 core の見積が和になるので、 多くの file に大きな見込みを書く行は core の余地で断られうる"
  - "代償: 見込みは受付の 1 時点の先読みで、 着地時の実増分は記録しない。 乖離の記録 (検出線に載せるか) は本 ADR では決めず、 要るなら別の決定で行う"
