  器の承認の欄: 裁定 (user)・user・2026-09-23 (契約表の行に file ごとの見込み行数を宣言する口を器に足し、 受付は file ごとの見込みと余地を比べる・上限の値 (size の 3 段と file の上限) は変えない・設計 § と契約 1 本を先に通し、 断られた契約はその後に受付へ・逐語は非公開の作業記録簿 = 台帳 s2-07l.578 の description)・裁定済
  器の承認の欄: 設計 (orchestrator)・orchestrator・2026-09-23 草稿 v1 (裁定の向きを、 受付の現物の式・契約表の欄の正本・写しの任意 key・rules 行 3 本に合わせて形にし、 設計 § 46 と契約表の行 ax を同じ PR に置いた。 拘束する constitution の版 0.5.0)・作成
  器の案の章の要約: 候補を 6 つ並べます。 契約の行に file ごとの見込みの欄を足す案、 触る file の列の各項目の末尾に見込みを添える案、 大きさを作業全体の合計と読み替える案、 大きさに段を足すか上限を上げる案、 何もせず分割で空きを作り続ける案、 断られたときに器が新しい問いの型で orchestrator に返す案です。 却下した 5 案にも利点を並べ、 退けた決め手が user の決定か分析かを各案に書きます。 末尾に添える案は欄を足さずに済む点で、 合計と読み替える案は数を 1 つのまま保てる点で、 問いの型を足す案は戻す経路が器の型として残る点で、 選んだ案に勝ります。
  器の専門語の説明: 本文に出てくる専門語 15 個を、 やさしい言葉で説明します。
  ・器（vessel）: scribe2 そのもの。 Rust で書いた 1 つのプログラム (binary) と、 それが持つ規則と記録の全体。
  ・便（run）: 器が契約 1 本から起こして自動で進める 1 つの作業。 受付を通って起き、 審査と実装と gate を経て着地する。
  ・契約表（contract table）: 設計 doc の中に在る、 便 1 本の契約を 1 行ずつ持つ表。 行は要件 id・設計の節・触る file の列 (write-set)・確かめ方・size などの欄を持ち、 契約の正本 (ADR-1023)。
  ・受付（intake）: 契約を便にする前の検査の段。 write-set の項目の実在・他の便との交差・上限の余地・host の memory の枠・同時走行の最大値を測り、 通らない契約は理由を名指して断り便を作らない。
  ・write-set（write-set）: 契約の行が宣言する、 その便が触ってよい file の列。 項目は素の path か、 接頭辞 1 字 (新規 +・縮む面 -・消える ~・置き場だけ =) つきの path で、 受付・交差・guard・gate は接頭辞を剥がした素の path で照らす。
  ・見込み行数（per-file growth）: 契約表の行の任意の欄 growth が file ごとに宣言する、 その便でその file が増える行数の見込み。 size は既定の 1 file あたりの見込みで、 growth は名指した file だけを上書きする。 受付の上限の余地の判定にだけ効く。
  ・上限の余地（cap headroom）: write-set の .rs file の上限 (1 file 1500 行) と base の行数の差。 受付が file ごとの見込みと比べ、 見込みが余地を超える file を名指して断る。 core の合計も見込みの和で同じ式を 1 回。
  ・席（seat）: 人と AI が対話する 1 つの session。 器の hook が状態を打刻し、 役割 (orchestrator など) を持つ。
  ・orchestrator（orchestrator）: 設計 doc と契約表の行を書き、 便を起こす向きを決める役割の席。 受付で断られた契約を読んで、 growth を書くか純移動を先に通すか設計に戻るかを決める。
  ・dispatcher（dispatcher）: 器の中で、 起動の列の契約を評価して受付を通る契約を席の操作なしに起こす部品 (FR1068)。 受付で断った契約は理由を持って列に留める。
  ・gate（gate）: 便の成果を着地させる前に、 歯と検査を実際に走らせて合否を測る門。 file と core の行数の上限はここで測定され、 宣言が偽でも上限は超えられない。
  ・歯（tooth (test)）: 決めたことが守られているかを機械で確かめる自動の検査。 器では Rust の test 1 framework だけで書く (憲法 C12)。
  ・rules 行（rules row）: 規則の値を 1 つ持つ行。 器の規則の manifest (repo 内の 1 file・build 時に binary へ埋め込む) に置き、 id・種類・値・enabled・裁定 id・裁定時刻を持つ (憲法 C1)。 size の 3 段と file と core の上限はここに在る。
  ・裁定 id（ruling id）: その値を user が決めたことを指す印。 rules 行が持ち、 裁定 id の無い rules 行の変更は CI が落とす。
  ・core（core）: 器の本体の Rust source (crates 配下の src の .rs の本体)。 行数の合計に上限 (rules 行 R-C4-1) が在り、 in-file の歯を除いた本体だけを数える (ADR-1033)。
