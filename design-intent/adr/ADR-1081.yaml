  器の案の章の要約: 候補を 8 つ並べます。 名が閉じた列の dir を終わった便の木から消す案 (選んだ案)、 今のまま人が手で消す案、 git clean で無視された file を全部消す案、 退役した worktree だけを掃除する案、 build の出力先を repo ごとに 1 つ共有する案、 退役した worktree を丸ごと消す案、 disk の空きが少ないと便の起動を断る門の案、 消してよい dir を宣言 file に書かせる案です。
  器の専門語の説明: 本文に出てくる専門語 10 個を、 やさしい言葉で説明します。
  ・閉じた列（closed sweep list）: 器が live でない便の木から消す dir の名の閉じた列 (宣言順): target (Rust)、 node_modules (TypeScript)、 .venv、 __pycache__、 .mypy_cache、 .pytest_cache、 .ruff_cache (Python)、 .expo (React Native + Expo)。 どれも器が対応する言語の build と依存の置き場で、 commit した木と toolchain と lock file から作り直せる。 追跡されている file を持つ dir は消さない。
  ・無視の規則（ignore rules）: project の .gitignore などが持つ、 git が追わない file の宣言。 「commit しない」を言うだけで「作り直せる」は言わない。 本 ADR の掃除はこれを読まない。
  ・worktree（worktree）: git が 1 つの repo から切る別の作業 dir。 器は便 1 本ごとに対象 repo の .worktrees の下に切り (FR1004)、 着地や畳みの後はその下の retired の dir へ move する。
  ・退役（retirement）: host、 席、 口座、 便の worktree を運用から外す操作。 可逆な move で行う (N1.2)。 本 ADR の後も便の worktree の退役は git worktree move のまま。
  ・live（live）: 便が終端でないこと。 終端 = 段が Landed / Failed / Stopped、 または Gated で判定が FAIL、 または Reviewed で判定が PASS でない、 または Intake で運転手の札が無いか所有者が死んでいる。 器は 1 関数で Some(true) / Some(false) / None (測れない) を返し、 本 ADR の掃除は Some(false) の便だけを触る。
  ・運転手の終端の周（driver terminal round）: 便を段から段へ運ぶ器の process (運転手) が、 pipe の run、 resume、 land、 stop、 retire の subcommand を終えて段を記帳した後の 1 周 (設計 dispatcher.md §5)。 便の段は終端とは限らない。 時計では撃たれない。 本 ADR は列の 1 周の前に掃除を撃つ。
  ・host-guard（host-guard）: 口座の設定を読む session が撃つ Bash の command を、 実行の前に rules 行の禁じる語列と照らして断る器の口 (FR1056・ADR-1056)。 席と runner には器の plugin の command guard も同じ語列で掛かる。 rules 行 host_guard.git は git clean -f を持ち、 本 ADR の後も変わらない。
  ・ENOSPC（ENOSPC）: file を書こうとして disk に空きが無いときに OS が返す error。 2026-09-28 に 3 つの project の便がこれで落ちた。
  ・便（run）: 契約 1 本の 1 往復 (intake → runner → gate → land)。 識別子は run id で、 現在地は event log から導く。 便ごとに worktree が 1 つ在る。
  ・器（vessel）: scribe2 の実行基盤 (plugin と binary と席の運用) の 1 世代。 便を運び、 本 ADR の掃除も持つ。
