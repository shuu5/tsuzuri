    name: "project ごとに .vessel.toml で消す dir を宣言する"
    text: |
      器の宣言 file .vessel.toml に消してよい dir の列を project ごとに書かせ、 器はその dir だけを消す (器の列を既定にして宣言で足す形も含む)。 決め手は分析 (跨版の新しい key と読み手が要り、 対応する言語の置き場は器の列で既に覆える)。
      （平易）器の宣言 file .vessel.toml に、 消してよい dir の列を project ごとに書かせる案です (器の列を既定にして宣言で足す形も含みます)。 dist や build のような汎い名も対象にでき、 何を消すかが project の宣言として読め、 書いた project から順に効く点で勝ります。 けれども、 版を跨ぐ新しい key と読み手が要り、 書かない project では効かず、 器が対応する言語の置き場は器の列が宣言なしで既に覆えるので退けました。
      利点: project ごとに dist や build のような汎い名も対象にでき、 器の列を足す便が要らない
      利点: 何を消すかが project の宣言として読め、 宣言を書いた project から順に効く
      欠点: 跨版の新しい key と読み手が要り、 足すには ADR と消費側への告知が要る (DR4)
      欠点: 宣言を書かない project では効かない (採用案の列に無い置き場が残るのと同じ形の欠点で、 採用案は対応する言語の置き場を宣言なしで覆う) (DR1・DR3)
    verdict: rejected
    reason: "決め手は分析 (跨版の新しい key と読み手が要り、 対応する言語の置き場は器の列で既に覆える)。"
