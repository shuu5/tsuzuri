  器の案の章の要約: 候補を 4 つ並べます。7 日窓の reset の早い順に並べる案、いまの「どの窓でも最も早い reset」のままにする案、5 時間窓と 7 日窓を重み付きで合成する案、残量の多い順に並べる案です。
  器の専門語の説明: 本文に出てくる専門語を、やさしい言葉で説明します。
  ・便用の並べ鍵（run ordering key）: 便に渡す口座を並べる比較の値の組。 7 日窓の reset 時刻 (早い順・持たない口座は最後)、 走行中の便数 (少ない順)、 label (辞書順) の 3 つで、 辞書順に比べて先頭を選ぶ。
  ・7 日窓（seven-day window）: 口座単位の 7 日の使用枠。 reset が来ると使用率が 0 に戻り、 それまでに使わなかった枠は消える。 モデル別の 7 日窓 (特定の model だけを数える枠) とは別の窓。
  ・5 時間窓（five-hour window）: 口座単位の 5 時間の使用枠。 1 日に何度も開き直る。 便用の順序には使わず、 上限に当たったかの判定と逼迫度にだけ効く。
  ・逼迫度（pressure）: 口座の数える窓のうち最大の使用率。 session 用の選定は逼迫度が最小 (余裕が最大) の口座を選び、 窓の全量に達した口座は「当たっている」として候補にしない。 便用の順序には使わない。
  ・消費の無い窓（idle window）: まだ使っていないので reset の予定が無い窓 (使用率 0・reset 未定)。 測れた実測として数えるが、 reset 時刻を持たないので並べ鍵では最後になる (ADR-1024)。
