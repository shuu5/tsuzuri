  - "良い結果: 7 日窓の枠を reset で消える順に使い、 口座全体で使える量が増える"
  - "良い結果: 並べ鍵の 1 つ目が 1 窓 1 値になり、 選ばれた理由を 1 文で説明できる"
  - "良い結果: 既存の閉じた enum で窓を弁別するので、 型・入力の形・rules 行・event の形が増えない (変わるのは選定の純関数の中の reset の読み 1 か所)"
  - "良い結果: 席用の順序と候補の判定は変わらず、 席用と便用の順序が別であることが鍵の窓でもはっきりする"
  - "代償: 5 時間窓の残りが reset で消えるぶんは順序で拾わなくなる (5 時間窓は開き直りが多く、 失う量は小さい側)"
  - "代償: 7 日窓の reset が同じ口座どうしは走行中の便数 → label で決まる"
  - "代償: 7 日窓の reset が近い口座に便が寄り、 その口座の 5 時間窓が上限に当たる回が増えうる (上限停止と別口座での途中再開が受ける・SRS FR1035 / FR1037)"
