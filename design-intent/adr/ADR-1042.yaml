# 判断の記録 ADR-1042 — 器 scribe2 の判断の記録 ADR-0042 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1042
title: "便用の並べ鍵は 7 日窓の reset の早い順 (7 日窓の reset を持たない口座は最後・5 時間窓とモデル別窓は鍵にしない・席用の順序は不変・ADR-1027 §2.2 の 1 つ目の鍵を supersede)"
status: accepted
date: 2026-09-17
context: |
  便に渡す口座の並べ鍵の 1 つ目を、 「数える窓の reset のうち最も早いもの」から「7 日窓の reset」に替える。 7 日窓の枠は reset までに使わなければ消えるので、 消える順に使う。 2 つ目以降の鍵 (走行中の便数 → label)・候補の判定・席用の順序は変えない。
  なぜこの判断が要るのかを、現物と user の裁定から説明します。いまの便用の順序は「どの窓でもよいので reset がいちばん近い口座」で、実際にはほとんどの周で 5 時間窓の reset の順に並びます。消えると惜しいのは 7 日窓の残りなので、user は 7 日窓の reset が近い口座から使い潰すと裁定しました。
  CTX1 現物 — 1 つ目の鍵は数える窓の reset の最小で、 実質は 5 時間窓の reset の順
  ADR-1027 §2.2 の便用の並べ鍵（便に渡す口座を並べる比較の値の組）の 1 つ目は、 口座の数える窓 (5 時間窓・7 日窓・便が使う model のモデル別 7 日窓) の最新の実測行が持つ reset 時刻のうち最も早いもの。 選定の純関数 (crates/scribe2/src/fleet/select.rs) は口座の読みの 1 欄にその最小を持ち、 候補の reset の欄へ写して並べ鍵の関数が読む。 5 時間窓が reset を持つ口座では、 7 日窓の reset が 5 時間窓の reset より手前に迫った周を除いて 5 時間窓の reset が最小になるので、 並びは実質 5 時間窓の reset の順になる。
  CTX2 消えると惜しいのは 7 日窓の枠
  窓の枠は reset までに使わなければ消える。 5 時間窓は 1 日に何度も開き直るので、 ある 5 時間窓の残りを逃しても次の窓がすぐ来る。 7 日窓（口座単位の 7 日の使用枠）は開き直りが週に 1 回で、 reset の時点で残っていた枠はその週のぶんが丸ごと消える。 5 時間窓の reset の順で並べると、 7 日窓の reset が近い口座に便が回らないまま reset を迎え、 口座全体で使える量が減りうる。 ADR-1027 の狙い (reset で消える残りから使う・憲法 C9.2) に照らすと、 鍵にする窓が狙いと合っていない。
  CTX3 user の裁定 — 便用は 7 日窓の reset が近い口座から順に使い潰す
  裁定 id = user 2026-09-17T06:10Z (論点 A・逐語は台帳 s2-07l.436) と同日 06:2xZ (逐語は台帳 s2-07l.439)。 逐語は台帳が原本で本 file には写さない (CON1002)。 要旨: 便用は 7 日窓の reset が近い口座から順に使い潰す (7 日窓の枠は reset までに使わなければ消える = 消える順に使うのが口座全体の消費を最大にする)。 席用 (逼迫度の最小 = 余裕が最大) とは順序を明示的に分ける。
  CTX4 現物の型 — 窓の種類は閉じた enum で、 7 日窓は型で名指せる
  口座残量の窓の種類は fleet の閉じた enum (crates/scribe2/src/fleet/mod.rs の WindowKind・5 時間窓 / 7 日窓 / モデル別の 7 日窓の 3 値) で、 実測行は窓の種類と任意の reset 時刻を持つ (ADR-1017・ADR-1024)。 選定の純関数は既にこの enum でモデル別窓を弁別している。 7 日窓の実測行だけを拾うのに新しい型も新しい入力も要らず、 口座の読みが reset を導く 1 か所を「全部の窓の最小」から「7 日窓の行の reset」に替えれば足りる。
  CTX5 席用と便用は選ぶ順序が別
  選定の純関数は用途で順序が分かれる (ADR-1041 CTX5): session 用は逼迫度（数える窓のうち最大の使用率）が最小 (= 余裕が最大) の口座、 便用は並べ鍵の昇順の先頭。 当たっている口座 (窓の全量) と測れない口座と除外の口座はどちらの用途でも候補にならない。 本 ADR が替えるのは便用の並べ鍵の 1 つ目だけで、 用途の分岐・候補の判定・session 用の順序には触れない。
  （選択肢を測るものさし）判断を評価する 4 本のものさしです。消える枠を消える順に使えること、鍵が 1 つの値で説明できて値の線を増やさないこと、選定の純関数と入力の形を変えないこと、席用の順序と候補の判定を変えないことです。
  DR1｜reset で消える枠を、 消える順に使う (口座全体の消費を最大にする) user 裁定 2026-09-17T06:10Z (台帳 s2-07l.436 / s2-07l.439) / 憲法 C9.2
  DR2｜鍵は現物の型で名指せる 1 つの値にする。 重みや rules 行のような値の線を増やさず、 なぜその口座が選ばれたかを 1 文で説明できる 憲法の順位 (膨張の防止) / C1 / C10
  DR3｜選定は純関数 1 本のまま。 入力と出力の形・構築点・event の形を動かさない 憲法 C2 / ADR-1020 §2.2 / ADR-1027 §2.2
  DR4｜席用の順序 (余裕が最大)・候補の判定 (当たっている・測れない・除外)・候補なしの周に待つ reset の導き方は変えない ADR-1041 / ADR-1024 §2.2 / SRS FR1037
decision: |
  選んだ案と、それが要件書のどの要件を支えるかを示します。便用の並べ鍵の 1 つ目を 7 日窓の reset の早い順に替え、それ以外の鍵と候補の判定と席用の順序はそのままにします。
  採用 — OPT1
  便用の規則 SHALL 候補を次の 3 つの鍵で辞書順に並べ、 先頭を選ぶ: (1) その口座の 7 日窓 (口座単位の 7 日窓・モデル別の 7 日窓ではない) の古くない最新の実測行が持つ reset 時刻 (昇順)、 (2) その口座で走行中の便の数 (昇順・ADR-1027 §2.3)、 (3) label の辞書順。 (1) の reset 時刻を持たない口座 (7 日窓が消費の無い窓で reset 未定・ADR-1024 §2.1、 または 7 日窓の実測行が reset を過ぎて古く数えられない周) SHALL 候補からは外さず、 reset 時刻を持つ口座の後ろに並べる。 5 時間窓とモデル別 7 日窓の reset 時刻 SHALL NOT 便用の並べ鍵に使う: それらの窓は逼迫度と「当たっている」の判定にだけ効き、 当たっている口座は従来どおり候補から外れる。 窓の種類 SHALL 既存の閉じた enum (WindowKind) で弁別し、 新しい型・新しい入力・新しい rules 行を足さない。 候補の判定 (除外・測れない・当たっている)、 候補なしの周に運ぶ最も早い reset (当たっている窓の開き直る時刻から導く・待ちに渡す値)、 session 用の規則 (prefer → 逼迫度の最小 → label・R-C9-1)、 純関数の形 (入力と出力) は変えない。 便用と session 用の順序は用途の分岐で分かれたままとし、 session 用は 7 日窓の reset を読まない。 本 ADR は ADR-1027 §2.2 の鍵 (1)「口座の窓の reset 時刻のうち最も早い時刻」だけを supersede する。
  （平易）便に渡す口座は、7 日窓の reset が近い順に並べて先頭を選びます。reset が同じなら走行中の便が少ない口座、それも同じなら名前順です。7 日窓をまだ使っていない口座は、消えるものが無いので最後に回します (候補からは外しません)。5 時間窓やモデル別の窓は順序に使わず、上限に当たった口座を候補から外す判定にだけ使います。席を起こすときの選び方は今までどおり余裕が最大の口座です。
  （理由）7 日窓の残りは reset が来ると消え、次に開き直るのは 1 週間後です。5 時間窓は 1 日に何度も開き直るので、その残りを優先しても口座全体で使える量はほとんど増えません。だから消える順に使うなら、見るべき窓は 7 日窓です。重みで合成する案は新しい値を持ち込み説明もできなくなるので採らず、残量の多い順は目的に合わないので採りません。窓の種類は既に型で区別できるので、変えるのは選定の中で reset を読む 1 か所だけです。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1036（claim）: 便用 (口座残量を使い切る側) の規則の順序が 7 日窓の reset の早い順になる。 席用 (余裕を残す側) の規則と rules 行 R-C9-1 は不変。 FR1036 の句は窓を名指していないので字面は変えない。
  FR1033（claim）: 鍵の出所は FR1033 の計測が窓ごとに記録する実測行の reset 時刻 (7 日窓の行)。 計測と記録の形は不変。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この ADR が版の系譜のどこに在るかと、判断が最後に行き着く原則です。ADR-1027 が決めた便用の順序のうち、1 つ目の鍵だけを置き換えます。候補の決め方、2 つ目以降の鍵、便数の数え方はそのままです。
  改訂状態: current
  置き換える ADR: なし (新規)
  置き換えられた: なし (現行)
  本 ADR は現行。 ADR-1027 を部分 supersede する: §2.2 の鍵 (1)「口座の窓 (5 時間窓・7 日窓・用途が使う model のモデル別 7 日窓) の最新の実測行が持つ reset 時刻のうち最も早い時刻」を「7 日窓の実測行が持つ reset 時刻」に置き換える。 同じ §2.2 の鍵 (2) (走行中の便数)・鍵 (3) (label)・「逼迫度は便用の順序に使わない」・「同じ周に 2 便を続けて選ぶと同じ口座が選ばれうる」、 §2.1 (候補は口座の状態だけで決め便数で絞らない)、 §2.3 (便数の出所)、 §2.4 (不変のもの) は現行のまま。 ADR-1041 の決定と CTX5 が便用の順序を指す句「reset の早い順に使い切る (ADR-1027)」は、 本 ADR の後は「7 日窓の reset の早い順」と読む (ADR-1041 の決定そのものは変えない)。 ADR-1020 §2.2 の純関数の形、 ADR-1024 §2.2 の reset 無しの実測行の読み (古くない実測として数える・待つ reset の導出に入れない)、 R-C9-1 は現行のまま。 SRS FR1036 の句は窓を名指していないので改訂を要しない。
  照会終端 — PRIN-SPEND-WHAT-EXPIRES-FIRST
  reset で消える枠は、 消える順に使う。 順序の鍵は現物の型で名指せる 1 つの値にし、 合成した値では並べない。
  本 ADR の判断はこの原則に行き着く (これ以上は遡らない照会終端)。
options:
  - id: "OPT1"
    name: "便用の 1 つ目の鍵を 7 日窓の reset の早い順にする (7 日窓の reset を持たない口座は最後)"
    text: |
      口座単位の 7 日窓の古くない最新の実測行が持つ reset 時刻の昇順で並べ、 その reset を持たない口座は最後に回す。 2 つ目以降の鍵 (走行中の便数 → label) は ADR-1027 のまま。 5 時間窓とモデル別 7 日窓は鍵に使わず、 当たっている口座を候補から外す判定にだけ効く。
      （平易）7 日窓の reset がいちばん近い口座から便に渡します。7 日窓の残りは reset で消えるので、先に消える口座を先に使い切る形です。5 時間窓が上限に当たった口座は今までどおり候補から外れるだけで、順序には関わりません。
      利点: 消えると惜しい 7 日窓の枠を、 消える順に使える (口座全体の消費が増える)
      利点: 鍵が 1 窓 1 値で、 なぜその口座かを 1 文で説明できる
      利点: 窓の種類は既存の閉じた enum で弁別でき、 型・入力・rules 行を足さない
      利点: 席用の順序・候補の判定・待つ reset の導き方に触れない
      欠点: 5 時間窓の残りが reset で消えるぶんは順序で拾わなくなる
      欠点: 7 日窓の reset が同じ口座どうしは便数 → label の鍵に落ちる
      欠点: 7 日窓の reset が近い口座に便が寄り、 その口座の 5 時間窓が上限に当たる回が増えうる (別口座での途中再開が受ける)
      欠点: 並びを pin している既存の歯の期待値を書き換える
    verdict: adopted
    reason: "口座単位の 7 日窓の古くない最新の実測行が持つ reset 時刻の昇順で並べ、 その reset を持たない口座は最後に回す。 2 つ目以降の鍵 (走行中の便数 → label) は ADR-1027 のまま。 5 時間窓とモデル別 7 日窓は鍵に使わず、 当たっている口座を候補から外す判定にだけ効く。"
  - id: "OPT2"
    name: "現状のまま (数える窓の reset のうち最も早いもの)"
    text: |
      ADR-1027 §2.2 の鍵 (1) を変えない。
      （平易）いまの形です。変更は要りませんが、実際にはほとんどいつも 5 時間窓の reset の順に並ぶので、7 日窓の reset が近い口座の残りが使われないまま消えることがあります。
      利点: 器の変更が無く、 既存の歯もそのまま
      利点: 5 時間窓の残りを reset の前に拾いやすい
      欠点: 並びが実質 5 時間窓の reset の順になり、 7 日窓の枠が消える順と合わない (user の裁定と食い違う)
      欠点: 5 時間窓は開き直りが多く、 その残りを優先しても口座全体の消費はほとんど増えない
    verdict: rejected
    reason: "ADR-1027 §2.2 の鍵 (1) を変えない。"
  - id: "OPT3"
    name: "5 時間窓と 7 日窓の reset を重み付きで合成した値で並べる"
    text: |
      2 つの窓の reset までの近さに重みを掛けて 1 つの得点にし、 得点の順で並べる。
      （平易）両方の窓を少しずつ考慮する案です。どちらの残りも拾えそうに見えますが、重みという新しい値を誰かが決めて持ち続ける必要があり、「なぜこの口座が選ばれたか」を一言で説明できなくなります。
      利点: 5 時間窓の残りも順序に少し反映できる
      欠点: 重みという値の線が増える (rules 行と裁定が要る・憲法 C1 / C5)
      欠点: 得点は時刻でも使用率でもない合成値で、 選ばれた理由を説明できず、 歯で pin する期待値も重みに依存する
    verdict: rejected
    reason: "2 つの窓の reset までの近さに重みを掛けて 1 つの得点にし、 得点の順で並べる。"
  - id: "OPT4"
    name: "残量の多い順に並べる"
    text: |
      7 日窓の使用率が低い (残りが多い) 口座から便に渡す。
      （平易）たくさん残っている口座から使う案です。上限に当たりにくくはなりますが、reset が遠い口座の残りは急いで使わなくても消えません。先に消える枠を先に使う、という目的に合いません。
      利点: 便が上限に当たりにくい口座へ回る
      欠点: reset が近い口座の残りが後回しになり、 消える枠を先に使う目的に合わない
      欠点: 席用の順序 (余裕が最大) と同じ向きになり、 席が使う口座と便が使う口座が同じ口座に集まる
    verdict: rejected
    reason: "7 日窓の使用率が低い (残りが多い) 口座から便に渡す。"
basis: [FR1033, FR1035, FR1036, FR1037, ADR-1017, ADR-1020, ADR-1024, ADR-1027, ADR-1041, CON1002]
