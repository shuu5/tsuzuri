# 判断の記録 ADR-54 — 相談の窓が読める範囲を、作業場と読む根（repo と器の出力）と道具の置き場だけに絞る（持ち主の裁定 2026-10-05・記帳先 = tsuzuri の台帳の問い t3-hub.86.1 の notes）
# 判断の記録 ADR-29 の決定 (7) の字のうち、この記録の決定 (1) が名指す字だけを置き換える（部分の置き換え・ほかの決定と字は効いたまま）。ADR-29 は封の一覧で本文が凍っているので本文は変えない（前例 ADR-29 の頭の注・ADR-52・ADR-53）。
# 起草は係 w182a（2026-10-05）。材料は問い t3-hub.86.1 の本文と、係 w173a の調べ（drafts/w173a/w/notes.md の 1〜4 節と囲いの模型）と、行 cs-read-roots の試作。承認の欄は問い t3-hub.86.1 の裁定。
id: ADR-54
title: 相談の窓が読める範囲を、作業場と読む根（repo と器の出力）と道具の置き場だけに絞り、ほかの project と会話の記録と home の下のほかの file を、窓の殻の命令と読む道具の両方から見えなくする（ADR-29 の決定 (7) の部分の置き換え）
status: accepted
date: 2026-10-05
context: |
  判断の記録 ADR-29 の決定 (7) は、相談の窓の守りを基本ソフトの囲いで持ち、起動の口が渡す設定の項を (ア) から (カ) まで列べた。読みについて決めたのは、読む根の足し（repo と台帳と器の state を窓の読む根に足す）と、(ウ) の資格の file を囲いから見えなくすることだけで、読みを絞る項は列に無い。束の手引きの「資格と private な project の中身を外へ出さないでください」の字と撤退の条件 (6)（private な project の中身が web で出たら web の道具の許しを問い直す）は、窓が private な project を読めることを前に置いて、web の側で見張る形だった。
  memo（t3-hub.86）の調べ（係 w173a・2026-10-05）で、窓の殻の命令（囲いの中の Bash の道具とその子）が home の下のほぼ全部を読めることを、囲いの模型（bubblewrap・中身は読まず在るかと覆いの形だけ）で確かめた。ほかの project（private を含む）、Claude Code の会話の記録、席の起草の置き場のほかの係と窓、資格の file の閉じた列の外に在る資格らしき file（資格の file の写し 14 と口座の資格の実体 7 ほか・名だけで確かめた）が読める。窓は web の道具でどの URL へも字を出せるので、読めた物は外へ出うる。読む道具（Read・Grep・Glob）は、作業場と読む根の外を許可を聞かない形（dontAsk）で断られる見込みで、殻の命令が主な穴だった。窓の道具の大きな結果（web の道具の大きな頁など）を Claude Code が口座の置き場の下に落とした file は、今も口座の置き場の読みの断りで窓から読めない（相談の窓の所見（cw1-5）の棚卸しの 7 番目）。
  Claude Code（2.1.257 版から）には、読む道具が作業場と読む根の外を全部の許可の形で断り、囲いが有効なら殻の命令にも home と利用者の file の置き場（/home・/root・/mnt・/media・/srv ほか）を断る鍵（permissions.blockReadsOutsideWorkingDirectories）が在る。断りの下でも、作業場と足した読む根（--add-dir）と session の一時の置き場と git の設定と Claude Code が要る置き場の一部は戻る。囲いの読みの戻し（sandbox.filesystem.allowRead）で、断られた所の中の path を戻せる。模型で、home を空にして読む根と作業場と道具の置き場だけを戻すと、rust・uv・python・node・npm・git・claude・tz が動き、守る物は全部見えなくなった。道具の置き場も戻さないと rust と uv と claude が撃てない（rc 127）。
  問い（t3-hub.86.1）は 3 つの案（絞る・資格らしき file を一つずつ隠す一覧に足す・今のまま）を持ち主に問い、案 A（絞る）に裁定された（裁定 id は承認の欄）。
decision: |
  (1) 置き換える字。ADR-29 の決定 (7) の「設定は次を置く。」の列の末（(カ) の後）に、次の (キ) を足す。(キ) 窓の読みは、作業場と読む根（repo と器の state の fleet と pipe）と道具の置き場だけに絞る。読む道具は作業場と読む根の外を全部の許可の形で断り、囲いの中の殻の命令は home と利用者の file の置き場を読めず、作業場と読む根のほかに戻すのは、Claude Code が戻す物（session の一時の置き場・git の設定・Claude Code が要る置き場の一部）と、決定 (2) の道具の置き場だけとする。ほかの字（(ア) から (カ) と、その後の部分の置き換えの字と、資格の file の覆い）は効いたまま。
  (2) 道具の置き場。殻の命令に読みを戻すのは、home の下の道具の実行 file と処理系の置き場の閉じた列（~/.cargo/bin・~/.rustup・~/.local/bin/uv・~/.local/bin/uvx・~/.local/bin/claude・~/.local/share/uv/python・~/.local/share/claude の 7 つ）と、起動の口が解いた tz の path の 1 つだけとする。tz の path を戻すのは、ほかの project の窓では tz が読む根の外の写しの組みに在り、戻さないと所見の口を撃てないから。実行 file の dir は dir ごとでなく file ごとに戻す（その dir には口座と host の一覧らしき file が在る）。列に道具の置き場（資格と利用者の file を持たない実行 file と処理系の置き場）を足すのは契約表の行でよく、持ち主に問わない。道具の置き場でない物（ほかの project・会話の記録・home の下の文書と設定の dir）を戻すのは、この記録の改めとして持ち主に問う。
  (3) 測り方。起動の口の設定に、鍵（permissions.blockReadsOutsideWorkingDirectories）を真で置き、囲いの読みの戻し（sandbox.filesystem.allowRead）に、決定 (2) の列の順に解いた tz を足した列を置く。起動の口の検めは、鍵が真でない設定と、戻しの列が字か順で違う設定と、囲いの file の仕切りを外す鍵（sandbox.filesystem.disabled）を置いた設定を断る（仕切りを外すと読みの断りが殻の命令に届かない）。束の手引きに、読める範囲と、要る物は持ち主か所見で頼むこと（席が作業場へ写す）を 1 行で書く。設定と検めの断りと手引きの字は歯で測る（ノート（surface-wave29a）の行（cs-read-roots））。要件 FR19 の字を同じ commit で改める（要件書の版上げ）。
  (4) 着地の後の確かめ。行の着地の後に開く最初の窓で、殻の命令と読む道具の両方から、ほかの project・会話の記録・口座の資格の実体・資格の file の写しが見えないことと、作業場と読む根が読めることと、列の道具（rust の組みと uv の入れ）と所見の口と束の組み直しが撃てることを確かめる。窓が道具の大きな結果の file を読み返せないのは今と同じで、この記録は替えない（訳は口座の置き場の読みの断りで、読みの絞りではない）。
options:
  - id: a
    name: 絞る（鍵と道具の置き場の戻し）
    text: 決定 (1) から (4)。
    verdict: adopted
    reason: 一つの鍵で、囲いの中の殻の命令と読む道具の両方を閉じ、home の外の利用者の file の置き場（/mnt ほか）も閉じる。戻す先は Claude Code の正規の仕組み（作業場・読む根・git の設定）に任せ、読む根の列と二重に持たない。home に新しい資格の file が増えても漏れない。模型で、道具が動き守る物が見えなくなることを確かめた。
  - id: b
    name: 資格らしき file を一つずつ隠す一覧に足す
    text: 読みは絞らず、資格の file の閉じた列（ADR-29 の決定 (7)(ウ) の内）に、一覧の外の資格らしき file を足す。
    verdict: rejected
    reason: home に新しい資格の file が増えるたびに漏れる（今も一覧の外に 20 を越える）。ほかの project と会話の記録は資格でないが private な中身で、読めたまま web の道具で外へ出る道が残る。
  - id: c
    name: 今のまま
    text: 読みは今のままにし、web で外へ出したと分かったら web の道具の許しを問い直す撤退の条件（ADR-29 の撤退の条件 (6)）だけで見張る。
    verdict: rejected
    reason: 出た後にしか分からず、出た物は戻せない。
  - id: d
    name: 囲いの読みの断りを手で書く
    text: 鍵を使わず、囲いの読みの断り（sandbox.filesystem.denyRead）に home を置き、読みの戻しに読む根と作業場と道具の置き場と git の設定を手で列べる。
    verdict: rejected
    reason: 読む道具には効かず（許可を聞かない形の断りに頼るまま）、home の外の置き場（/mnt ほか）が残り、戻す先の全部を読む根の列と二重に持つ。
  - id: e
    name: 道具の置き場を戻さない
    text: 鍵だけを置き、囲いの読みの戻しを置かない。
    verdict: rejected
    reason: home の下に入れた rust と uv と claude が窓で撃てなくなり（模型で rc 127）、持ち主の答え（スクラッチの実験と検証のプログラムを組めること）に反する。
basis: [ADR-29, FR19]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo（t3-hub.86）か後継の memo の notes に 1 件ごとに記帳する。数える材料は、決定 (4) の確かめの結果と、相談の窓の所見の欄（囲いに断られて困った事）と、持ち主の言葉と、窓の作業場の file。問う相手は持ち主。
    (1) 決定 (4) の確かめで、守る物が見える、作業場か読む根が読めない、所見の口か束の組み直しが撃てない、列の道具が撃てない、のどれかが 1 件でも出たら、形（鍵を外すか・戻す列を足すか）を問い直す。
    (2) 着地の後の 14 日の内に、読みの断りで実験か調べに困った事（所見の欄か持ち主の言葉）が 3 件を越えたら、戻す列と読む根を問い直す（ADR-29 の撤退の条件 (3) の数えにも足す）。
plain: |
  相談の窓が読める範囲を絞る記録です。
  今は、窓の中で撃つ命令が、あなたの home の下のほぼ全部（ほかの project・Claude の会話の記録・資格の写しらしき file）を読めます。窓は web の道具でどの URL へも字を出せるので、読めた物は外へ出えます。
  これからは、窓が読めるのは、窓の作業場と、tsuzuri の repo と、器の出力（fleet と pipe）と、道具の置き場（rust・uv・claude など）だけです。ほかの project と会話の記録と home の下のほかの file は、窓から見えなくなります。資格を隠す今の覆いはそのまま残します。
  窓の中から、ほかの project の code や home の下の文書を参考に読めなくなります。要る時は席が作業場へ写して渡します。home の下に入れた道具のうち列に無い物（bun ほか）は窓で使えません。道具の置き場は行で足せますが、道具でない物を戻す時はあなたに問います。
  着地の後に最初に開く窓で、守る物が見えないことと、道具と所見の口が動くことを確かめます。通らなければ形をあなたに問い直します。困った事が 14 日で 3 件を越えた時も問い直します。
  窓が web の大きな頁などの大きな結果を読み返せないのは、今も同じです（口座の置き場を隠しているため）。この記録では替えず、別に直し方を探します。
approval:
  who: 持ち主
  date: 2026-10-05
  ruling: t3-hub.86.1（裁定 id = t3-hub.86.1:20261005T0043Z-1・案 A・tool の呼び・notes に逐語）
  verbatim: "推奨で良い"
  surface: R-8
consequences:
  - 資格の覆い（資格の file の閉じた列・state dir の口座の置き場とその実体・台帳の鍵）は残す。読みの断りが殻の命令に届かない形（囲いが起きない・囲いの file の仕切りを外す鍵）は、起動で止めるか起動の口の検めが断る。
  - 問う窓が席から継ぐ環境変数の絞り（memo（t3-hub.86）の候補の 3 つ目）は、この記録の外とする。
  - 同じ行で、束の手引きに、込み入った殻の命令を作業場の script に書いて撃つ 1 行（memo（t3-hub.84）の候補の 1 つ目）を載せる。
  - 今開いている窓は、起こし直すまで前の設定のまま読める。着地の後に開く窓から効く。
  - 問いの本文は、窓が自分の大きな出力の file を読み返せなければ形を問い直すとした。読み返せないのは今も同じで、訳は口座の置き場の読みの断り（資格の覆い）なので、この記録の形の問い直しでなく、memo（t3-hub.86）の候補（大きな結果の置き場を作業場へ向ける設定が在るか）として扱う。
  - 鍵は Claude Code の 2.1.257 版からで、古い版は知らない鍵を黙って捨てうる。起動の口の検めは設定の字を見るだけで版は測れないので、決定 (4) の確かめで効きを見る。
note: 起草は係 w182a（2026-10-05）。承認の欄の逐語は、適用の script が台帳の問い t3-hub.86.1 の notes の定型行から読んで入れた。
