  who: 持ち主
  date: 2026-10-07
  surface: R-8
  verbatim: どちらも承認する
  ruling: t3-hub.92.10.26（裁定 id = t3-hub.92.10.26:20261007T0842Z-1・notes に逐語）
note: |
  第 1 稿の起草は係 w425a、第 2 稿は係 w429a（2026-10-07）。第 2 稿の材料は検証役 v427 の所見（drafts/v427/w/notes.md）と数え（count427.out・extra427.out・resolve427.out）と器の雛形と code の現物。数は写しの木 main 0f3bd1d0 で撃ち直し、質の欄の審査は第 1 稿の 141 本・v427 の 142 本から 143 本に、質 1 以上の PASS の着地は 46 本から 48 本に増えた（撃つ時までに審査と着地が増えた・V）。
  名の列: 選択肢の名（甲〜庚）は席の頼みの形（甲）に、比べのための乙〜庚を足した。行の名（v-ladder-field・行（v-ladder-memo）・行（v-ladder-review）・行（t-ladder-drafter））と鍵の名（ladder・proof）と段の語（need・exists・std・line・min）と断りの語（ladder-missing・ladder-form・ladder-exists-found）と理由の型（quality・review-quality）と 審査の記録（review.json） の欄（quality_judged）は仮の名で、行の起草で器の名の決まりと照らす。
  席の決めからの外れ（notes に訳）: 型（quality） を P-10.6 の数えに入れる（決定 (5) の (iii)）。影の窓を「7 日か便 30 本」でなく「7 日を過ぎ、かつ初めて起きた便 20 本」で閉じる。数える範囲を「新しく足す・変える物」のうち既に在る item の中の変更を外した「新しく足す名と file」にする（決定 (5) の (i)）。
  まだ分からない事（U）: 欄を書いた後の質の件数の割合と影の窓の門が立つ日。誤りの本数（k0）。契約の審査 1 周と gate 1 周の量。実装の時の名を替えた近い複製の量。器の欄の決まりの生成の file（scribe2/contracts/schema.toml）と tsuzuri の欄の写し（contracts/field-schema/schema.toml）のどちらが行（v-ladder-field）の書き先か。行 77-6 と file（ledger/memo.rs） の交わりの順。
