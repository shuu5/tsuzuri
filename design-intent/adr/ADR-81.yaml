    reason: |
      主張する利益: 便の終端と置き直しの手間が無く、席の手が減る。
      失う物: 起草係は器の外の席の係で、器に起草の周を起こす口が無い。新しい周とその上限を足す事になる（条 N-3・条 P-27.2）。甲の受け皿の型は新しい周を足さずに同じ bead の回数の止めを外せる（v427 の S2 の (iii)）。
  - id: f
    name: 己 — 第 1 稿の形（5 観点・範囲を絞らない・すぐ判定を替える・型（quality） を数える型に置く）
    text: 契約の審査の PASS で質の 5 観点の件数の和が 1 以上の周を、影の窓を置かずに理由の型（quality） の FAIL に読み、同じ型の数えに入れる。
    verdict: rejected
    reason: |
      主張する利益: 判定の替えが 1 行で早く入り、yagni と shrink と既に在る code の指摘も止める。
      失う物: 過去の数で初回の着地が 50/88 から 27/88、窓の最大が 55 % になり、停止線の 70 % に届く窓が 0 個で、線が解けない（F4・F5）。58 本のうち 33 本は既に在る code だけの指摘（F3）。同じ bead で 2 本以上落ちる bead が 10 本で、行 R-3 で受付が断り、P-10.6・P-10.7 が型（quality） の構造の memo と期日の断りを最初の日に起こす（v427 の M3）。
  - id: g
    name: 庚 — gate の審査役に diff の上の質の数えを足し、実装の時の近い複製を影の窓から測る
    text: 決定 (4) の (b)。gate の雛形に 3 観点の数えを diff が新しく足した item に限って足し、判定の記録に写し、判定を替えるかは決定 (5) と同じ門で決める。
    verdict: rejected
    reason: |
      主張する利益: 実装の時に goal の内で足された名を替えた近い複製と別の作りを、着地の前に数えられる（F11 の漏れの唯一の着地前の口）。
      失う物: gate に審査役の揺れの在る数えを足し、測りの前に器の行が 1 本増え、gate の雛形の指紋が替わり、gate 1 周の量が増える（U）。漏れの量がまだ測れていない（撤退 (6) で測ってから問う）。
basis: [P-1.6, P-4.2, P-7.2, P-10, P-10.3, P-10.4, P-10.6, P-10.7, P-27, P-27.1, P-27.2, A-2.1, A-2.2, N-2, N-3, R-3, R-46, R-47, FR1009, ADR-33, ADR-43, ADR-63, ADR-64, ADR-77, P-28]
grill:
  who: 検証役 v427（AI・起草者と別の独立の文脈・読み取りだけ）
  when: 2026-10-07
  where: docs/grill/2026-10-07-ADR-81-grill.md
  summary: 検証役 v427 が係 w425a の第 1 稿を 1 巡攻めた（直す 7・問う 8・よい 6）。重い物は、質 1 以上の PASS を FAIL に読むと初回の着地が 49/87 から 27/87 に落ち停止線が解けなくなる事・指摘の 58 本のうち 33 本が既に在る code を指す事・実装の時の名前違いの近い複製を止める所が無い事・preflight に崩せる照らしが無い事。第 2 稿（係 w429a）が全部を処分し、席が処分の表と照らした。
retreat:
  kind: measure
  condition: |
    数えは tsuzuri の設計の席が取る。器の状態の置き場の契約の審査の記録（review.json の verdict・kind・欄 quality_judged・quality_at）と契約の写し（contract.toml の欄 ladder と write-set）と memo の判定（pipe/memo の verdict）を、係の数えの写し（count429.py）を広げた物で日ごとに数え、memo（t3-hub.92.10）か後継の memo の notes に撃った命令と数を記帳する。行 77-8 が先に着地する時は、その契約の測りの項の一覧に下の鍵を足し、数える行の着地の前はまだ分からないを出す（条 P-7.2・床が鍵を項の一覧と照らす P-4 の機構で落ちないため）。後に着地する時は、この記録の発効の後の tsuzuri の行で項を足す。どれかに当たったら、当たった条件とこの記録の id を持ち主に問う。各行は 鍵・向き・閾値・窓（条 P-4.2）。
    (1) 鍵（quality_fail_breaks_line）（行 R-46 の窓（直近に初めて起きた便 20 本）で、着地した便が 14 本に届かず、着地した便と型（quality） の FAIL で終わった便の和が 14 本以上の日の数・日）・向き 越える・閾値 0 日（1 日目で当たる）・窓 行（v-ladder-review）の着地から、末の 14 日（日ごとに動かす） → 質の FAIL だけで停止線を引き起こした。出所は行 R-46 の値（70 %）。影の窓の形（判定を替えない）へ戻すかを問う。
    (2) 鍵（contract_quality_fail_misfire）（型（quality） の FAIL のうち、席が誤り＝指した名が欄（ladder）の最後の要素の「+」の名に無いか、指した無駄が木に無いと判じた件数）・向き 越える・閾値 決定 (5) の (ii) の 誤りの本数（k0） から引く値（標本 20 本の誤りの率 （k0 と 1 の大きい方）/20 の二項の 95 % の上の分位: 誤りの本数（k0） が 0 か 1 なら 3 件・2 なら 4 件・3 なら 6 件・4 なら 7 件・5 なら 8 件・係の表（bin429.out））・窓 行（v-ladder-review）の着地から型（quality） の FAIL が 20 件に達するまで（30 日で閉じる） → 影の窓の形へ戻すかを問う。
    (3) 鍵（quality_fail_repeat_beads_14d）（型（quality） の FAIL を 2 本以上持つ bead の数・本）・向き 越える・閾値 2 本（3 本目で当たる・過去の数を決定 (5) の形に当てると 0 本・F4・閾値は見立て I）・窓 行（v-ladder-review）の着地から、末の 14 日（日ごとに動かす） → 受け皿の型で回数の止めが無い事の費えが溢れている。数える型へ移すか、判定の形を問う。
    (4) 鍵（memo_ladder_unparsed_7d）（日ごとの読みで、語 unparsed で証しの字が鍵の断りの字で始まり、時刻が末の 7 日に在る memo の判定の file の数・件・下の限り・決定 (2)）・向き 越える・閾値 2 件（3 件目で当たる）・窓 行（v-ladder-memo）の着地から、末の 7 日（日ごとに動かす） → memo の審査の雛形を直す行を置くか、memo の鍵を外すかを問う。
    (5) 鍵（ladder_undeclared_new_7d）（契約の審査の 場所の列（quality_at） の場所のうち、名が base に無く path が欄（write-set）に在るのに、欄（ladder）の最後の要素に「+」で無い場所の数・件＝欄が足す物を漏らした数）・向き 越える・閾値 2 件（3 件目で当たる・見立て I）・窓 行（v-ladder-field）の着地から、末の 7 日（日ごとに動かす） → 欄が形だけになっている。preflight の照らしを足すか、欄を外すかを問う。
    (6) 鍵（near_copy_in_goal_14d）（総量の上限を止める記録の下書きの夜の段が名を替えた近い写しとして載せた組のうち、席が同じ事をする本物の複製で、どちらかが契約の goal の内で実装役が足した物と判じた組の数・組）・向き 越える・閾値 1 組（2 組目で当たる・見立て I）・窓 その下書きの行（t-waste-nightly）の着地から、末の 14 日（日ごとに動かす） → 実装の時の漏れが在る。案 庚（gate の diff の上の質の数えを影の窓から入れる）を置くかを問う。その下書きが採られなければ測れない（U）。
plain: |
  「決定はしご」は、何かを足す前に「要るか → もう在るか → 標準の部品で足りるか → 1 行で書けるか → 最小の作りは何か」を順に確かめる決まりです。今は AI の席の決まりの文にしか無く、設計の係・実装の係・覚え書き（memo）の審査には届いていません。無駄の指摘が 1 件以上ついた契約のうち 48 本が、そのまま通って着地しました（指摘は数えるだけで、合否を動かさない作りのため）。
  1. 推す案（甲）: 決まりの文を各所に書き足すのでなく、各所が出す物に「どの段で止まったか・その証し」の欄を書かせ、機械が確かめます。覚え書きの審査は、契約に上げる時と閉じる時に段と証しを書きます（消すだけの覚え書きも上げられます）。設計の係は、契約に「もう在る物を探した跡」と「新しく足す名の一覧」を書き、機械が今の code と照らして、在るのに「無い」と書いた物や、新しいと名乗った名が既に在る物を断ります。
  2. 契約の審査の合否は、すぐには替えません。まず指摘を「その契約が新しく足す名」だけに絞って数え、替えたらどうなるかを 1 週ほど影で測ります。替えるのは「消せる」「標準の部品で足りる」「言語の機能で足りる」の 3 つの指摘だけで、過去の数に当てると不合格になる契約は 58 本から 10 本に減ります。それでも、最初の回で着地する率の停止線（70 %）を、替えたせいで割らない時だけ替えます（過去の数では 69 回の窓のうち 3 回だけ当たり、停止線が今のままなら替わりません）。指摘の間違いの率も先に 20 本で測ります。
  3. 実装の係には何も足しません。ただし、実装の時に名前だけ替えた似た関数が足される事は、この案では止まりません（総量の上限を止める記録の下書きの夜の検出が見つけるだけです）。それが見つかったら、検査（gate）に数えを足すかをあなたに問います。
  4. 失う物: 停止線が解けるまで、無駄の指摘は今と同じく数えるだけです。合否を替えた後は、不合格の割合が 29 % から 36 % に上がり、最初の回の着地は 50 本から 44 本（88 本中）に減る見込みです。同じ契約の質の不合格には回数の止めを付けず、多ければあなたに問います。
  5. 選ばなかった案: 文だけ足す案（乙）、欄だけで合否を替えない案（丙）、実装の係に足した物の一覧を出させる案（丁）、同じ便の中で直させる案（戊）、第 1 稿のすぐ全部の指摘で落とす案（己・停止線が解けなくなります）、検査（gate）にも数えを足す案（庚・まず漏れを測ります）。
  6. 憲法の文は替えません。条 P-27 の「どう守らせるか」の欄を「人の目」から「機械の確かめ」に替え、機械が見ない所（判断の記録・実装の係）は人の目のままと書きます。以前の決め（ADR-63 の「数えるだけで合否を動かさない」）を替えるので、あなたの承認が要ります。要件 FR1009 の 1 句は、合否を替える日に影で測った数を添えて別に問います。
  やめる条件: 質の不合格だけで停止線を割った日が出る・指摘の間違いが測った率から引いた件数を越える・同じ契約で質の不合格が 2 本以上の契約が 2 週で 3 本・覚え書きの審査が読めない形になる事が 1 週で 3 件・新しく足す名の書き漏れが 1 週で 3 件・実装の時の似た関数が 2 週で 2 組、のどれかに当たったら、あなたに問います。
  決めてほしい事は 3 つです: (1) 案（推奨は甲）。(2) 指摘の間違いの率の線（推奨は 20 本中 5 本まで）。(3) 器の便の順（上限を止める器の行と PATH の入れ替えの後に欄の 2 本を置き、影で測る間は 77-4 の残りと 77-5 を止めない）。
