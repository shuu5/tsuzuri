# 第 1 稿は係 w425a、第 2 稿は係 w429a（2026-10-07・検証役 v427 の攻め 1 巡の直す 7・問う 8・よい 6 と席の決めで直した）。数は写しの木 main 0f3bd1d0 と器の状態の置き場で、係の数え（drafts/w429a/w/count429.py・読みは drafts/v427/w/count427.py をそのまま使う）を撃って取った。撃った命令と rc と所見ごとの処分は drafts/w429a/w/notes.md。持ち主の承認の前（status proposed・承認の欄と攻めの欄は空）。条文は替えない（決定 (7)）ので改訂の欄（amends）は無い。
# 持ち主の裁定 t3-hub.92.10.26 で発効（2026-10-07・逐語「どちらも承認する」・推奨のとおり＝案 甲・誤りの率の線 20 本中 5 本・器の便の順）。攻めの記録は発効の前の別の commit（463c59f4）で置いた。
id: ADR-81
title: 決定はしごを memo の審査の判定の鍵と契約の欄と契約の審査の判定の 3 か所の型付きの欄と門にし、契約の審査の判定の替えは影の窓で数えてから、新しく足す名の消せる面と標準の部品と言語の機能の 3 観点に絞り、同じ型の数えの外の受け皿の型で入れ、実装役には足さない
status: accepted
date: 2026-10-07
context: |
  持ち主の問い（memo t3-hub.92.10 の notes 2026-10-07T07:42Z）は、決定はしご（条 P-27.1・要るか → 既に在るか → 標準 library か入っている依存で足りるか → 1 行で書けるか → 最小実装）が効いておらず、席にしか入っていないのではないか、設計の係と実装役と memo を扱う所にも要るのではないか、というものである。席は、しごの文を各所の指示に書き足す形（散文の規律の足し・条 N-2 に当たる）でなく、各所の出す物の欄と、それを照らす門にする形を推した。並べて承認を問う総量の上限を止める記録の下書き（係 w426a の第 5 稿）の無駄の門（同じ本文の関数を便ごとに字句の要約値で落とす・夜に並んだ 2 便の組と名だけ替えた写しを拾う・公開の範囲の狭めと夜の索引）とは重ねず、そこに無い段を受け持つ。印 V は現物で照らした・D は導いた・I は見立て・U は分からない。
  ・（F1） 契約の審査の記録（review.json）のうち質の欄を持つのは 143 本（PASS 101・FAIL 42・最初は 2026-10-06）。質の件数 1 以上の PASS は 58 本で、そのうち 48 本が着地した（V・係の数え（count429.py）の出力）。
  ・（F2） この記録は契約の審査（実装の前・Stage の Reviewed）の判定で、diff は無い（V・器の審査の file（pipe/review.rs）の頭の注）。審査役は 5 観点を数えるが、数は判定を動かさない（V・審査の雛形（lens-contract.txt）の節「数える質の観点」と ADR-63 の決定 (7) の乙'）。gate の雛形は質を数えない（V）。
  ・（F3） 今の雛形の数える範囲は「契約が作る・変える code（契約と設計の節が名指す変更と、木に在ればその変更の写し）」で、既に在る code を含む（V・lens-contract.txt）。質 1 以上の PASS 58 本の場所を審査の木（契約を当てる前の base）と照らすと、既に在る所だけを指す便が 33 本・新しい所だけが 17 本・混ざりが 8 本（V・検証役 v427 の数え（count427.py））。
  ・（F4） 判定を替える形ごとの過去の数への当て（V・count429.py・初めて起きた便 88 本・行 R-46 の窓 20 本の窓は 69 個）:
    今のまま: FAIL に替わる便 0・初回の着地 50/88・窓の最大 75 %・70 % 以上の窓 8 個。
    第 1 稿（5 観点・範囲を絞らない）: 58 本（審査の 40.6 %）・初回の着地 27/88・窓の最大 55 %・70 % 以上の窓 0 個。
    3 観点（消せる面（delete）・標準 library で足りる自作（stdlib）・言語の機能で足りる作り（native））だけ・範囲を絞らない: 29 本・38/88・60 %・0 個。
    5 観点・新しく足す名と file だけ: 25 本・37/88・70 %・1 個。
    3 観点・新しく足す名と file で path が write-set に在る物だけ（この記録の形）: 10 本（審査の 7.0 %・契約の審査の FAIL の割合は 29.4 % から 36.4 %）・44/88・70 %・3 個。同じ bead で 2 本以上落ちる bead は 0。10 本の場所 12 か所は全部が消せる面で、名は全部が着地の commit に在った（V・loc429.py・指摘が正しいかは U）。
    既に在る名の中の変更も数える上の限り: 5 観点 37 本・3 観点 16 本（V）。
  ・（F5） 行 R-46 は、直近に初めて起きた便 20 本の窓で初回の着地の率が 70 % を下回るあいだ、構造の直しの行と壊れの札の便のほかを断る停止線である（V・rules.yaml）。質の FAIL で終わった初めての便は初回の着地に数えられない（D）。
  ・（F6） 器の同じ型の数え（落ちの file（pipe/fall.rs）の関数（counted））は、受け皿の型（review-other・review-unparsed）と便の問いの止まりを bead ごとの数えに入れない（V・器の設計 contract-source.md §23）。条 P-10 の機構の注は、bead ごとの断り（P-10.3・P-10.7）は受け皿の型を数えず、bead をまたぐ数え（P-10.6）は数えると書く（V・constitution.yaml の P-10）。
  ・（F7） 新しい名を名乗る文法は既に 2 つ在る: write-set の項目の接頭辞「+」（新しい file）と、約束の行の欄（symbols）の接頭辞「+」（base に無い名）。後者は受付が関数（closure::symbols_in_base）で base に照らし、「+」付きが base に在るか「+」無しが base に無ければ断る（V・file（pipe/cli/intake/row.rs） の関数（check_symbols）・断りの語（promise-symbol-unresolved））。
  ・（F8） memo の審査の判定は 72 本: 残す（keep）62・閉じる（close）9・契約へ上げる（promote）1・寄せる（merge）0（V）。判定は memo ごとに 1 つの file（pipe/memo/<id>/verdict）に上書きで置かれ、履歴は残らない。読めない周は語 unparsed として同じ file に書かれる（V・pipe/dispatch/memo_lens.rs）。
  ・（F9） しごの字が在るのは席の憲法の写しと憲法の正本と検証役の型だけで、実装役の雛形・memo の審査の雛形・契約の審査の雛形・gate の雛形・起草係の型・調べ係の型には無い（V・grep・第 1 稿）。条 P-27 の機構は人の目（human-review）である（V）。
  ・（F10） 要件 FR1009 の shall は ADR-63 の決定 (6)(7) を写し、台帳を読まず書かない memo の口が PASS の判定のうち消せる面を 1 以上と数えた便からも memo の案を組む句を持つ（V・srs.yaml・版 0.44・持ち主の承認の印）。FR1009 を確かめる受入の基準 3 本の題はこの口を名指さない（V）。器の審査の file の頭の注は理由の型（FindingKind）の 7 語を不変と書く（V・pipe/review.rs）。
  ・（F11） 契約の審査は diff を見ず、gate の観点（contract-fit）は goal と done の外だけを数え、gate は質を数えず、総量の上限を止める記録の下書きの便ごとの門は字句が全く同じ本文 3 行以上の関数だけを落とす（V・v427 の M5）。なので、実装役が goal の内で足す名を替えた近い複製は、どの門にも掛からない（D）。
decision: |
  (1) 4 か所の持ち手。しごの段の宣言を、各所の出す物の型付きの欄に置き、欄の在る無しと形と base で崩せる所は機械が、中身は審査役が照らす。各所の指示の文に規律の散文を足さない（条 N-2）。段の語は閉じた 5 語（要るか（need）・既に在るか（exists）・標準 library か入っている依存（std）・1 行（line）・最小実装（min））で、器の定数 1 本に置く（条 P-1.6・字の正本は条 P-27.1 で、定数の注が名指す）。
    ・memo を契約に上げる所: memo の審査の判定の鍵（決定 (2)）。
    ・契約を書く所: 契約の欄（ladder）と preflight の照らし（決定 (3)）。
    ・実装する所: 足さない。漏れは名指して受け持ちを決める（決定 (4)）。
    ・審査する所: 契約の審査の数えを絞り、影の窓で測ってから判定を替える（決定 (5)）。
  (2) memo の審査。判定の JSON に、止まった段の鍵（ladder）（5 語の 1 つ）と証しの鍵（proof）を足す。
    ・上げる（promote）周: 段は std・line・min のどれか。証しは決定 (3) の最後の要素と同じ文法（名の列を「;」で継ぎ、base に無い新しい名は「+」を前に付け、「+」の無い名は契約が中身を変えるか消す既に在る名）。消すだけ・直すだけの memo は「+」の無い名だけで上げられる。
    ・close の周: 段は need か exists。need の証しは要らない訳の出所の id（要件・条・判断の記録・台帳の id の形）、exists の証しは既に在る物の「<path>」か「<path>#<名>」。
    ・merge と keep の周は 2 つの鍵を書かない（今の鍵（into）と（why）と同じ形）。
    器の読み（memo_lens.rs）は、上げる（promote）か閉じる（close）周で鍵が無い・語の外・段が判定と合わない・証しが段ごとの文法に合わない周を unparsed に倒す（形だけを見る・memo の審査は base の材料を持たないので名の在る無しは照らさず、上げた後の契約の preflight が照らす）。need か exists で止まった memo は上げない（promote しない）。雛形（lens-memo.txt）の判定の決め方に「要るか・既に在るかで止まる memo は keep でなく close と書く」の 1 文と鍵の形を足す（器の読みと対の字で、規律の散文でない）。
    判定の file が上書きで撤退 (4) の数えが取れない事（F8・U）の扱い: 新しい記録を足さず（条 P-27.2）、日ごとの測りが全部の verdict の file を 1 度読み、語 unparsed で証しの字が鍵の断りの字で始まり、時刻（at）が末の 7 日に在る file を数える。日の間に上書きされた unparsed は数えないので、この数は下の限りである（撤退 (4) の閾値はこの数に掛ける）。
  (3) 契約を書く所（起草係と preflight）。契約の欄の表（pipe/table.rs の FIELDS）に欄（ladder）（字の列・表では任意・今開いている bead を壊さない）を足し、preflight だけが必須にする（欄が無い契約は断りの語 ladder-missing）。要素は「<段>:<証し>」で、要るか（need）の段は書かない（要るかの証しは必須の欄（req）そのもので、欄に写すと必ず通る形の照らしになるので照らさない・検証役（v427）の所見（M7）。要素は exists から始まり、しごの順に飛ばさず重ねずに並び、最後の要素が止まった段（std・line・min のどれか）である。preflight は次を照らし、外れたら断る（断りの語 ladder-form・崩れた要素を名指す）。
    ・exists の証しは「<path>」か「<path>#<名>」か「none=<語>」。path は base の木に在る事。none=<語> の語は、約束の行の欄（symbols）と同じ読み手（closure::symbols_in_base）で base に引き、識別子として在れば断る（断りの語 ladder-exists-found・語と在りかを名指す）。探した語が base に在るのに「無い」と書いた契約を崩す照らしである。
    ・std と line が止まらなかった段の証しは空でない字。std で止まった時の証しは、標準 library の path（std・core・alloc で始まる）か、base の Cargo.lock に在る crate の名で始まる事。
    ・最後の要素の証しは、事実（F7）の約束の行の欄（symbols）の文法をそのまま使う名の列（「;」で継ぐ・「+」付きは base に無い新しい名・「+」無しは中身を変えるか消す既に在る名）で、同じ読み手で base に照らし、極性が合わなければ断る（断りの語は ladder-form・名と極性を名指す）。新しい file は欄（write-set）の「+」の項目が名乗り、欄（ladder）は file の文法を持たない。3 つ目の新しい物の文法を作らない（条 P-27.1 の段 2）。
    ・足す定義の無い契約（消すだけ・直すだけ）は、最後の要素を「+」の無い名だけで書く（例「min:old_fn」）。着地した 85 便のうち、.rs の新しい定義を 1 つも足さない便は 3 本（V・v427 の extra427.out）。
    中身（「+」無しの名で足りる理由・std の部品で本当に足りるか）は契約の審査役が木で照らす（決定 (5)）。起草係の型（drafter.md）と前置きの手引きの参照の file（agent-discipline の reference.md）には欄の名と要素の形の字だけを足す。memo から上げた契約は、memo の判定の段と証しを最後の要素の材料に写す（席の起票の手・照らしは preflight）。
  (4) 実装する所（実装役）。実装役の雛形（runner.txt）にも出力にも何も足さない。足した名の自己申告の列は diff の写しで照らす物が増えない（しごの要るかの段）。漏れ（F11）: 実装役が goal の内で足す名を替えた近い複製と、同じ事をする別の作りは、契約の審査（実装の前・diff を見ない）では止まらない。この記録はこの漏れを止めると言わない。受け持ちの比べ:
    ・（a） 総量の上限を止める記録の下書きの夜の段の、識別子を番号に替えた字句の要約値で名を替えた近い写しの組を拾い、整理の memo の材料に載せる形。足す行 0（その下書きの行 t-waste-nightly に在る）。着地は止めず 1 日遅れで名指すだけで、名の指す先の違う組も含む（その下書きの H6 (iii)）。
    ・（b） gate の審査役に diff の上の質の数え（3 観点・diff が新しく足した item に限る）を足し、影の窓から入れて、判定を替えるかは決定 (5) と同じ測り（行 R-46 の窓の当てと誤りの率）で決める形。足す行は器 1 本（gate の雛形と判定の記録と数え）と、gate の雛形の指紋の替え 1 回。gate 1 周の量が増える（U）。
    推し: 今は (a) だけに頼り、(b) は置かない。訳: (a) は足す行が 0 で、近い写しが実際にどれだけ入るかを測る口になる。(b) は審査役の揺れの在る数えを gate に足し、測りの前に器の行を 1 本増やす。(b) を置くかは撤退 (6) の鍵が当たった時に持ち主に問う（選ばなかった案 庚）。総量の上限を止める記録の下書きが採られなければ (a) が無いので、撤退 (6) は測れず、漏れの量は U のまま残る。
  (5) 契約の審査（数えを絞り、影の窓で測ってから判定を替える）。3 つの段で入れる。
    ・（i） 数えの範囲と影の窓（行（v-ladder-field） と同じ行）。雛形（lens-contract.txt）の節「数える質の観点」の最初の文を次の字に替える: 「この契約の欄（ladder）の最後の要素が「+」で名乗る新しい名と、欄（write-set）の「+」の項目が名乗る新しい file の中で、次の 5 つを数える。契約が触るだけの既に在る code と、既に在る item の中の変更は数えない。場所の列（quality_at） の場所は「<path>#<名>」か新しい file の「<path>」で書き、path:行 と識別子だけの形は使わない。」（既に在る item の中の変更を外す訳: diff の前に既に在る code と分けられず、器が機械で絞れない・D。上の限りは F4 の 37 本と 16 本）。器は子 module（pipe/review/quality.rs）で、lens の 場所の列（quality_at） のうち観点 delete・stdlib・native の場所で、名が欄（ladder）の最後の要素の「+」の名か path が欄（write-set）の「+」の項目と合う物の件数を数え、審査の記録（review.json） に欄（quality_judged）として写す（判定は動かさない）。この段では「数は判定を動かさない」の字は残す。
    ・（ii） 誤りの率の測り（影の窓の中）。席は調べ係に、過去の F4 の形の 10 本（count429.out の F_new3_ws の runs）と、影の窓で欄（quality_judged）が 1 以上の便を時刻の順に足した計 20 本の場所を、審査の木で判じさせ（指した名が契約の足す物に在り、本当に消せるか・標準の部品か言語の機能で足りるか）、席が照らして誤りの本数（k0） を memo の notes に書く。14 日で 20 本に届かなければ、在る本数（n0） で判じ、下の式の 20 を 在る本数（n0） に替える。
    ・（iii） 判定の替え（行（v-ladder-review）・影の窓の門を通った時だけ席が置く）。器は契約の審査役の判定が PASS で欄（quality_judged）が 1 以上の周を、理由の型（quality）の FAIL に読む。判じの順は、lens の判定の読み → 約束の行の審査（Promised）の倒し（理由の型が約束の 3 語の外の FAIL を INCONCLUSIVE に倒す）→ 質の読み（PASS の周だけ）とし、質の FAIL は約束の倒しに掛けない（約束の 3 語は器が受付で測り終えた物で、質は受付で測らない）。型（quality）は器の閉じた型（FindingKind の 8 つ目の枝・落ちの型の語（review-quality）・file（pipe/fall.rs）の型の並び（FALLS））に足し、受け皿の型の組（review-other・review-unparsed と同じ）に入れる。なので、bead ごとの数え（行 R-3 の回数）と P-10.3・P-10.7 の断りに数えない（F6・ADR-77 の決定 (2) の P-10.3 の「受け皿の型はこの断りに数えない」の前例）。bead をまたぐ数え（P-10.6）には数える（規範文 P-10.6 に除きが無く、除くには条の改め（条 A-2.1）が要る。P-10.6 が起こすのは型（review-quality） の構造の memo 1 本で、後は便の id を足すだけで、P-10.7 の期日の断りは受け皿の型に掛からない・D）。焼き直しの門（関数（unaddressed））の型（quality） の物差しは、前の便の 場所の列（quality_at） の「+」の名が、今回の契約の欄（ladder）の最後の要素に「+」で残っていない事とする。雛形の節「数える質の観点」の「件数だけを数える・判定の根拠にしない」と「数は判定を動かさない」の字を「delete・stdlib・native を 1 以上数えたら PASS を返さない（yagni と shrink は数えるだけ）」の 1 文に替え、欄（ladder）の exists の証しを木で照らして外れたら delete に数える 1 文を足す。
    影の窓の門（判定を替える閾値・数で決める）。窓は行（v-ladder-field） の着地から始まり、7 日を過ぎ、かつ着地の後に初めて起きた便が 20 本に達した時に閉じる（行 R-46 の窓が 20 本なので、便 30 本の窓では初めての便 20 本を持たない日がある・D）。閉じた日から日ごとに、次の 2 つが共に立った最初の日に、席が影の窓の測りの数を添えて要件 FR1009 の句の改め（決定 (6)）を持ち主に別の問いで出し、その承認の後に行（v-ladder-review） の bead を置く（要件の字はこの記録の承認では替えない・席の照らしの決め）。
    ・門 1（停止線を解けなくしない）: 行 R-46 と同じ窓（直近に初めて起きた便 20 本）で、着地した便の数から、そのうち欄（quality_judged）が 1 以上だった便の数を引いた数が 14（20 本の 70 %・R-46 の値）以上。出所: 判定を替えた後の初回の着地の率がこの数になる（D）ので、替えた日に停止線を引き起こさない値。過去の数に当てると 69 個の窓のうち 3 個で立つ（今のまま線に届く窓は 8 個・V・F4）。
    ・門 2（誤りの率）: (ii) の 誤りの本数（k0） が 5 以下（20 本の 25 %）。値は見立て（I・正しい指摘 3 件に誤り 1 件までを費えの釣り合いと見た）で、承認の裁定がその値の裁定を兼ねる（ADR-77 の決定 (3) と同じ形）。
    窓が閉じて 30 日のうちに門が立たなければ、席は替えずに持ち主に問う（数えの欄と範囲の絞りはそのまま残し、判定は替えない・選ばなかった案 丙の形で止まる）。
    直しの周: 型（quality） の FAIL は便の終端で、席が契約を直して置き直す。数えに入れないので回数の止めは無く、同じ bead の 2 度目からは撤退 (3) で測る。新しい周の上限の仕組みは足さない。
    ADR-63 の決定 (7) を替える手続き: この記録は、封で凍った ADR-63 の決定 (7) のうち、(i) で乙' の数える範囲を、(iii) で乙' の「判定の決め方は替えず FAIL にしない」の段と「契約審査が質で FAIL にする形（乙）は採らない」の文を、3 観点に限って替える。yagni と shrink は数えるだけのまま。ADR-63 の本文と、ほかの決定と、決定 (7) の残りは替えない（ADR-43 の決定 (1) と同じ形・ADR-64 も同じ形で ADR-63 を替えた）。ADR-63 は発効のまま残す。
  (6) 要件と器の設計の字の改め（行ごとの時機）。
    ・要件 FR1009 の shall と plain の「台帳を読まず書かない memo の口は、PASS の判定のうち消せる面（delete）を 1 以上と数えた便からも memo の案を組む」の句を消し、「契約の審査が PASS の判定のうち新しく足す名の消せる面・標準 library で足りる自作・言語の機能で足りる作りを 1 以上と数えた周を理由の型（quality）の FAIL に読む」の句に替える。版を 1 つ上げ、承認の印にこの記録の承認の裁定 id を書く。時機は影の窓の門が立って席が 行（v-ladder-review） を置く前の設計の commit（門が立たなければ改めない）。FR1009 を確かめる受入の基準 3 本は替えない（F10）。
    ・器の設計 contract-source.md の §22（理由の型の閉じた語に （quality） を足し、7 語を 8 語にする）と §23（受け皿の型の組に （review-quality） を足す）と、器の審査の file の頭の注（FindingKind の 7 語は不変）と質の file の頭の注（判定は動かさない）は、行（v-ladder-review） の write-set に入れ、その行の着地で替える。§4 の契約の審査の段と、欄（ladder）の形は行（v-ladder-field） の write-set の設計の節に入れる。
  (7) 憲法の当たり。条 P-27 の機構の欄を、人の目（human-review）から機械の照らし（build-check）に替える。機構の欄は凍結の写しの外で、条 A-2.2 により改訂に当たらず、版を上げず、改訂の欄（amends）を書かない（V・第 1 稿で写しの床を撃った・検証役 v427 の O1）。条 P-27 の全部を機械が照らすとは書かない（v427 の S7）。替える字は行（v-ladder-field） と行（v-ladder-memo） の着地の後の席の設計の commit で置き、行（v-ladder-review） の着地の後に注の判定の句を足す。案の字は {kind: build-check, live: now, stage: post, polarity: fail-closed, note: P-27.1 の段の宣言のうち、memo の審査の判定の鍵の形は器の memo の読みが、契約の欄（ladder）の在る無しと形と base に照らせる名は preflight が断り、契約の審査の質の数えの範囲は器が欄で絞る（判断の記録 ADR-81）。判断の記録と起草の手と実装役の足す物と P-27.2 の消す物の名指しは、契約の審査と gate と検証役の攻めの人の目のまま。} とする（条 P-28 の機構の注が機械と人の目を並べる前例と同じ形）。条 P-27 の題と規範文と段と縛る相手と前文は替えない。持ち主の承認が要るのは、ADR-63 の決定 (7)（持ち主の裁定 t3-hub.87.14）を替えるからである（要件 FR1009 の句は門が立った日に別に問う）。
  (8) 先に消す物（条 P-27.2）と、この記録の足しをしごに通した段。
    消す物: （K1） 器の memo の口の PASS の質の原本（ledger/memo.rs の関数（quality） と、そこだけが呼ぶ file（quality.rs） の関数（delete_count）と再輸出と歯）を行（v-ladder-review） で消す（判定を替えた後は新しく足す名の消せる面が 1 以上の周は PASS でなく、口の読み手が涸れる）。要件の句は決定 (6)。（K2） 審査の雛形の「件数だけを数える・判定の根拠にしない」と「数は判定を動かさない」の字と、質の file と審査の file の頭の注の「判定は動かさない」の字を行（v-ladder-review） で替える。（K3） ADR-63 の決定 (7) の席の週 1 の質の memo のまとめのうち stdlib と native の 2 観点の分を、行（v-ladder-review） の着地で止める（FAIL に替わるので PASS の数が涸れる）。yagni と shrink の分を総量の上限を止める記録の下書きの整理の memo に寄せるかは、その記録の適用の時に席が決める（U）。消す物の 4 つ目（K4）: 第 1 稿の欄（ladder）の最後の要素の「<path>#<名>」の列の文法と need の要素は作らない（約束の行の欄（symbols）の文法と欄（req）に寄せた）。
    段: 要るか（一部が成立）＝ 着地 48 本が質 1 以上のまま PASS（F1）だが、うち新しく足す名を 3 観点で指す物は 10 本で、残りは既に在る code の指摘（F3・F4）。しごの字は席と検証役にしか無い（F9）。既に在るか（一部が成立）＝ 質の 5 観点の数え・判定ごとの閉じた鍵の memo の読み・契約の欄の表と形の断り・約束の行の「+」の名の base の照らし・write-set の「+」・受け皿の型と同じ型の数えの除き・PASS と数の食い違いを FAIL に読む前例（ADR-63 の決定 (6)）が在るので、新しい審査役・雛形・段・周の上限・新しい物の文法を作らない。新しく足すのは、契約の欄 1 つ・memo の判定の鍵 2 つ・理由の型の語 1 つ・審査の記録（review.json） の欄 1 つと、各々の照らしだけ。標準 library か入っている依存（成立）＝ 依存を足さない。1 行（判定の読みの替えだけが成立）＝ 判定の替えは条件 1 つで、影の窓を先に置く。最小実装 ＝ 決定 (9) の 4 行。
  (9) 行と順。行は 4 本（仮の名・大きさ・置き場・触る file）。器を書く便は同時に 1 本（ADR-33 の決定 (12)）。
    ・行（v-ladder-field）（器・M）: file（pipe/table.rs）（欄の表）と、新しい子 module file（pipe/table/ladder.rs）（5 語の定数・要素の読み・形の照らし）・file（pipe/cli/preflight.rs）（断りの語 ladder-missing・ladder-form・ladder-exists-found の撃ち）・file（pipe/refuse.rs）（断りの枝 3 つと名の順の歯）・file（pipe/review/quality.rs）（欄（quality_judged）の数え）・file（pipe/review.rs）（その欄を写す呼びの数行だけ・今 1,442 行で行 R-C4-2 の 1 module 1,500 行の 96 % なので、数えの本体は子 module に置き、審査の file に関数を足さない）・headless/lens-contract.txt（決定 (5) の (i) の字）・欄の決まりの生成の file・器の設計の節。
    ・行（v-ladder-memo）（器・S）: file（pipe/dispatch/memo_lens.rs） と file（pipe/dispatch/memo.rs）（判定の 1 行の鍵 2 つ）と headless/lens-memo.txt。
    ・行（t-ladder-drafter）（tsuzuri・S）: plugin/agents/drafter.md と plugin/skills/agent-discipline/reference.md の欄の名と形の字。
    ・行（v-ladder-review）（器・M）: 決定 (5) の (iii) の判定の読み（pipe/review/quality.rs）・file（pipe/review.rs）（FindingKind の枝と頭の注・判じの順の呼び）・file（pipe/fall.rs）（型の並び（FALLS）と受け皿の組）・焼き直しの門の物差し・lens-contract.txt の (iii) の字・K1（ledger/memo.rs と quality.rs）・K2・器の設計 §22 と §23。影の窓の門が立った後にだけ置く。
    総量の上限を止める記録の下書きとの順: その下書きの器の順（1. 上限を止める行 v-cap-stop・2. 種を消す行・3. 穴を塞ぐ行・4. PATH の binary の入れ替え・5. 77-4 の残り 2 本・6. 77-5 から後）の 4. の後に 行（v-ladder-field） と 行（v-ladder-memo） を置き、影の窓の測りの間は 5. と 6. を止めない（影の窓は判定を替えず、器の便を止めない）。行（v-ladder-review） は影の窓の門が立った日に、その時の列の次に置く。行（t-ladder-drafter） は 行（v-ladder-field） の着地と PATH の binary の入れ替えの後（preflight が欄を知る前に起草係が欄を書くと、置く時に断られない代わりに照らされない）。決定 (7) の機構の欄の替えは 行（v-ladder-field） と 行（v-ladder-memo） の着地の後の席の設計の commit。依存と write-set の交わりは notes の依存の行に書く: file（preflight.rs） は上限を止める行と交わり、file（refuse.rs） の名の順の歯は 77-4 の残りの行（v-structure-tag）が断りの枝を足すなら書き替えが重なり、file（fall.rs） は 77-4 の残りの行（v-fall-lineage）と、file（ledger/memo.rs） は行 77-6 と交わる。前の 2 つは順で解け、後の 2 つは 行（v-ladder-review） が影の窓の後に来るので先の行の着地の後になる（77-6 との順は 77-6 の起草で照らす・U）。
    77-4 の残りの前に置く第 1 稿の順を替えた訳: 影の窓の間は判定を替えないので、同じ型の数えと構造の札の道（77-4 の残り）を待たせる訳が無く、R-3 で止まった bead を札の道の無いまま持ち主に問う期間を延ばさない（v427 の S5）。費えは 77-4 の残りが器の便 2 本ぶん（v-ladder-field と 行（v-ladder-memo））遅れる事（1 本 30 分〜1 時間・I）。
