# 判断の記録 ADR-15 — 表示面の運び（発効 2026-09-28・持ち主の裁定 t3-hub.59.6:20260928T0249Z-1〔この記録と要件 FR16 の書き換えの承認〕・記帳先 = tsuzuri の台帳 t3-hub.59.6 notes）
# 判断の記録 ADR-5 の決定 (3) を置き換える（部分の置き換え・ADR-5 のほかの決定は効いたまま）。運びの答えは t3-hub.59.1〜.59.5 と .59.7 の notes。席の技術の読みと器の答えは台帳 t3-hub.59 の notes。見積りは席の作業場の i-scope の報告。
id: ADR-15
title: 表示面の運びは、表示先を器の端末の宣言と tsuzuri の表示先の設定の 2 層で持ち、ssh の届かない端末へは URL だけを渡し、窓は初めて見せる時の 1 回だけ起こして前に出さず、閉じた窓は開き直さずに知らせだけを出し、board の頁の上では見せるだけにする
status: accepted
date: 2026-09-28
context: |
  判断の記録 ADR-5（2026-09-25）は表示面の形を決めた。席が持ち主の端末の Chrome を ssh 経由で app mode で起こして CDP で操作し、端末の一覧は器の宣言（host の面）の行が持ち、ssh で届かない端末は server 側の headless Chrome の画面を配信する窓へ落とす（決定 (3)）。
  行を割る前に、席は運びの 5 つの論点を board の問い（t3-hub.59.1〜.59.5）で持ち主に出した。どの PC に出すか・席専用の Chrome の設定の置き場（profile）・席が PC の窓でどこまで操作してよいか・ssh の届かない端末で画面を見る方法・窓を前に出す時の 5 つである。持ち主は 2026-09-28 に 5 問とも答えた。
  答えのうち、ssh の届かない端末へは URL を渡すだけでよいという答えは ADR-5 の決定 (3) を変える。ほかの答えは、ADR-5 に無かった運び（表示先の設定・知らせ・操作の範囲）を足す。
  席は 5 つの答えをこの記録と要件 FR16 の書き換えにまとめ、持ち主が閉じた窓を次の見せで開き直すかの問い（t3-hub.59.7）と一緒に、board の問いで持ち主に出した。持ち主は、まとめをこのまま承認し（t3-hub.59.6）、閉じた窓は開き直さず知らせと URL だけにする案を選んだ（t3-hub.59.7）。
  事実。器（scribe2）の host の面の端末の表（[[device]]・器の判断の記録 ADR-0076）は key の集合が閉じていて、器は知らない key を持つ面を丸ごと断る。tsuzuri の席は host の面を書かない（器の答え 2026-09-28）。持ち主が画面から PC を足す書きの口は、器が置く方向で形と時期は未定である（器の覚え書き（s2-07l.727））。画面の合成の仕組み（Wayland）の環境の欄は器が足す予定で、それまでその端末は範囲の外である（器の覚え書き（s2-07l.726））。持ち主の最初の PC はタイル型の窓の管理（sway）で動き、窓を前に出すことも最小化も無く、新しい窓は今見ている仮想の机（workspace）を割って出る。画面を配信する窓は大きい仕事で、board の行と file が重なりうる。
decision: |
  (1) 表示先を 2 つの層で持つ。層 A はどの PC が在るか（名・ssh の宛先・Chrome の場所・OS・画面・入力・専用の profile）で、ADR-5 の決定 (2) のとおり器の host の面の端末の表に置く。書くのは持ち主か器の席で、tsuzuri の席は書かない。持ち主が画面から PC を足す口は、器の書きの口の着地の後に足す。層 B はどの project をどの PC に出すかで、tsuzuri 自前の設定として版管理に載らない置き場に持つ。層 B は全体の既定と project ごとの上書きの 2 段で、値は層 A に在る PC の名だけを受ける。
  (2) 層 B を変える口は tz の口 1 つ（設定を見る・project ごとに置く・全部の project に一括で置く）とする。持ち主が起こす設定の手引きの skill（setup）と、2 つの board の設定の画面（project board は自分の project・account board は一括と project ごと）は、どれもこの口を通る。board の画面からは、heartbeat の口（裁定 t3-hub.52.29）と同じく server が tz の口を撃ち、面と server は設定の file を自分で書かない。設定の手引きの skill は持ち主が起こす聞き取りで、ADR-14 の決定 (5) の例外にあたる。表示先の無い時、席は URL だけを渡し、決めてほしいことは board の問いで出す（チャットで聞かない）。
  (3) 最初の PC は持ち主の 1 台（ThinkPad）から始める。その行は、器の画面の環境の欄の着地の後に器の席が書く。Windows の据え置きの PC（desktop）は後で別に問う。
  (4) 席専用の Chrome の設定の置き場（profile）は、各 PC のホームの下の隠れた dir（~/.cache/tsuzuri-stage）とし、層 A の行の欄に書く。code に既定の dir を持たない。
  (5) ADR-5 の決定 (3) をこの決定に置き換える。ssh で届かない端末（スマホ・ssh の無い PC）には、tailnet の中の board の URL を渡すだけにし、席はその端末の browser を操作しない。URL の host の部分は実行の時に組み、版管理に載る file に書かない。server 側の headless Chrome は席の目（screenshot・DOM・console）として残す。画面を配信し入力を返す窓は作らず、次の版の候補（v2・専用のスマホの app の案と同じ所）に送る。ADR-5 の決定 (1)(2)(4)(5) は変えない。ADR-11 の画面の配信の経路（CDP を話さない対象）は、この決定の外に在る。
  (6) 席は窓を前に出さず、動かさない。窓を起こすのは、表示先の PC に初めて見せる時の 1 回だけとし（タイル型の窓の管理では今見ている仮想の机に出る）、その後の頁の替え・reload・scroll は同じ窓の中で行う。持ち主が窓を閉じた後は起こし直さず、知らせと URL だけを出す（t3-hub.59.7）。窓を開き直すのは、持ち主が tz の口か board の button で頼んだ時だけとする。初めて見せたかどうかは、層 B の設定の置き場に PC ごとの印として持つ（形は行で決める）。窓を前に出す命令・窓を動かす命令・新しい窓を起こす命令は撃たず、歯で断る。持ち主に見てほしい時は知らせだけを出す（その PC の画面の知らせ・席の返事の中の URL・後に board の知らせ）。Windows とほかの種類の PC（mac）で最小化を解かずに知らせだけを出す形は、急がずに後で決める。
  (7) 席の操作の範囲。開発中の app の上では click・入力・key もしてよい。board の頁の上では見せるだけ（開く・移動・reload・scroll・screenshot・DOM の読み）にし、click・入力・key の命令を歯で断る。任意の JavaScript を撃つ口は持たない。持ち主の答えを席が代わりに打てないようにするためである（条 P-12.1）。
options:
  - id: a
    name: 2 層の表示先と URL だけの見せ方と知らせだけの運び
    text: 決定 (1) から (7)。
    verdict: adopted
    reason: 持ち主の運びの答え（t3-hub.59.1〜.59.5 と .59.7）をそのまま運びにした形で、持ち主がこのまとめを承認した（t3-hub.59.6）。器の閉じた端末の表を変えず、画面を配信する窓という大きい仕事を作らない。
  - id: b
    name: ssh の届かない端末へ画面を配信する窓を作る
    text: ADR-5 の決定 (3) のまま、server 側の headless Chrome の画面を配り入力を返す窓を board の後に作る。
    verdict: rejected
    reason: 持ち主は、スマホでは Firefox で board を見られれば足り、席がスマホの browser を操作しなくてよいと答えた（t3-hub.59.4）。
  - id: c
    name: 問いと見ての時だけ窓を前に出す
    text: 開く・頁の替え・reload は席が自由にし、前に出すのは持ち主に問いか見てを出す時だけにする。
    verdict: rejected
    reason: 持ち主は窓が前に出るのを嫌い、知らせだけを望んだ（t3-hub.59.5）。
  - id: d
    name: 表示先を器の端末の表か git の設定に書く
    text: どの project をどの PC に出すかを、器の host の面の端末の行の欄か、git の全体の設定と各 project の git の設定に書く。
    verdict: rejected
    reason: 器は知らない key を持つ面を丸ごと断り、tsuzuri の席は host の面を書かない。git の全体の設定の file は持ち主の設定の束（dotfiles）として版管理に載りうるので、PC の名が漏れうる（行 D-4）。各 project の git の設定は全体の既定を置けず、一括の変更が多くの file に割れる。
  - id: e
    name: どこでも click と入力をしてよい
    text: board の頁の上でも席が click と入力をする。
    verdict: rejected
    reason: 席が持ち主の答えを打てると、承認の出所が曖昧になる（条 P-12.1・t3-hub.59.3 の案 C）。
  - id: f
    name: 持ち主が閉じた窓を次の見せで開き直す
    text: 持ち主が窓を閉じた後も、次に見せる時に席が窓を起こし直す（今見ている画面に新しい窓が割り込む）。
    verdict: rejected
    reason: 持ち主は、閉じた後は開き直さずに知らせと URL だけを出し、開くのは持ち主が tz の口か board の button で決める形を選んだ（t3-hub.59.7）。
basis: [P-12, N-3, N-5, N-6, N-7, D-4, ADR-5, ADR-11, ADR-14]
retreat:
  kind: measure
  condition: 持ち主が、ssh の届かない端末で URL だけでは用が足りない（見られない・遅い・操作が要る）と 1 度でも言うか、知らせだけでは見落としたと 2 度言ったら、画面を配信する窓か専用のスマホの app（次の版の候補）と、知らせの形を持ち主に問い直す。数えるのは tsuzuri の設計の席。
plain: |
  席があなたの PC に画面を見せるときの運び方を決めます。
  どの PC があるかは器の設定に、どの project をどの PC に出すかは tsuzuri の設定に書きます。tsuzuri の設定は、tz の命令・board の設定の画面・最初の手引きの skill から、project ごとにも全部まとめてもいつでも変えられます。最初は ThinkPad 1 台から始めます。
  席は窓を勝手に前に出しません。最初の 1 回だけ今見ている画面に開き、その後は動かさず、見てほしい時は知らせだけを出します。あなたが窓を閉じたら席は開き直さず、知らせと URL だけを出します。開き直すのは、あなたが tz の命令か board の button で頼んだ時だけです。
  スマホのように ssh で届かない端末には、見るための URL を渡すだけにします。画面を配る窓は作らず、将来の版の候補にします。
  開発中の app では席が click や入力もしますが、board の上では見せるだけで、あなたの答えを代わりに打ちません。
  この記録はあなたの承認で発効しています。承認の記帳先は tsuzuri の台帳です。
