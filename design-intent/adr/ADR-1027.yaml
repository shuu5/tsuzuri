    name: "便用の口座は reset が最も近い口座から選び、 同点は走行中の便が少ない口座に倒し、 1 口座あたりの便数で候補を絞らない (ADR-1020 §2.2 の便用の規則を supersede)"
    text: |
      便に渡せる口座は、 manifest に書いた口座から、 退役中の口座・planner や admin の席が使っている口座・上限に当たっている口座・測れていない口座を除いたものです。 その口座で今いくつの便が走っているかは、 候補から外す理由にしません。 1 つの口座に何便重ねてもよく、 途中で上限に当たった便は別の口座で続きから再開します。
    verdict: adopted
    reason: "器の記録が採った決定（字は決定の欄・器の記録の §2）。文脈の要約: 便に渡す口座は、 これまで「まだ当たっていない口座のうち、 いちばん残りが少ないもの」を選んでいました (ADR-1020 §2.2)。 実際の運用では 2 つのことが起きました。 1 つ目は、 器の外の起動 script が「走行中の便が使っている口座は次の便に使わない」という規則を勝手に持ち、 便に使える口座が 3 つに見えて並列が 3 便で頭打ちになったことです。 器の規則にそんな除外は無く、 便は途中で上限に当たっても別の口座で続きから再開できるので、 1 つの口座に何便重ねても失うものはありません。 2 つ目は、 「残りが少ない口座から」という順序が、 いつ元に戻る (reset) かを見ていないことです。 使い残した分は reset で消えるので、 まもなく reset する口座の残りを先に使う方が、 全体で使える量が増えます。 この記録は、 候補を口座の状態だけで決め (走行中の便の数では絞らない)、 順序を「reset が近い口座から・同点なら走行中の便が少ない口座へ」に改めます。"
  - id: "A"
    name: "逼迫度が最大の口座 (ADR-1020 §2.2・現行)"
    text: |
      (A) 逼迫度が最大の口座 (ADR-1020 §2.2・現行)。 却下: reset 時刻を見ないので、 7 日窓が高い口座に集中し、 5 時間窓の残りが reset で消える口座を使い残す。 「使い切る」の近似としては reset の近さの方が直接である。
    verdict: rejected
    reason: "reset 時刻を見ないので、 7 日窓が高い口座に集中し、 5 時間窓の残りが reset で消える口座を使い残す。 「使い切る」の近似としては reset の近さの方が直接である。"
  - id: "B"
    name: "逼迫度が最小の口座 (余裕を残す側)"
    text: |
      (B) 逼迫度が最小の口座 (余裕を残す側)。 却下: session 用の規則と同じ向きで、 便が使い切る側 (C9.2・FR1036) に倒れない。
    verdict: rejected
    reason: "session 用の規則と同じ向きで、 便が使い切る側 (C9.2・FR1036) に倒れない。"
  - id: "C"
    name: "口座あたりの便数に上限 (1 口座 1 便を含む)"
    text: |
      (C) 口座あたりの便数に上限 (1 口座 1 便を含む)。 却下: 並列を口座数で絞る。 便は途中再開できるので上限で失うものが無く、 上限は保護でなく浪費になる。 器の外の起動 script がこの規則を散文で持ち、 実際に候補を 3 つに見せて並列を止めた (N2 の型)。
    verdict: rejected
    reason: "並列を口座数で絞る。 便は途中再開できるので上限で失うものが無く、 上限は保護でなく浪費になる。 器の外の起動 script がこの規則を散文で持ち、 実際に候補を 3 つに見せて並列を止めた (N2 の型)。"
  - id: "D"
    name: "走行中の便数だけで均等に回す (round-robin)"
    text: |
      (D) 走行中の便数だけで均等に回す (round-robin)。 却下: reset の近さを見ないので、 まもなく消える残りと遠い残りを同じに扱う。 均等は同点の解消に使う (§2.2 の (2))。
    verdict: rejected
    reason: "reset の近さを見ないので、 まもなく消える残りと遠い残りを同じに扱う。 均等は同点の解消に使う (§2.2 の (2))。"
