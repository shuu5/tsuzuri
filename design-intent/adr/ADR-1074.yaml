consequences:
  - "この判断で良くなること 3 つと、 代わりに引き受けること 3 つです。 良くなるのは、 逼迫していない群が候補を塞がず上限に達した群が移れること、 断りが host のどの席からも読めること、 増える呼びが先の群の今の口座 1 回で増える状態が印 1 file だけなことです。 引き受けるのは、 先の群が逼迫していない周は予約が無いので逼迫に転じた周の移り先が次の周に決まること、 doctor の群の行が 1 欄増えて既存の歯の期待が動くこと、 断りが能動的には 1 席にしか届かないことです。"
  - "良い結果: 逼迫していない群が候補を塞がず、 上限に達した群は残る口座へ移れる。 両方が逼迫した周の優先は宣言順のまま"
  - "良い結果: 移り先の無い断りは群用 dir の印と doctor の群の行で host のどの席からも読め、 1 席の画面に閉じない"
  - "良い結果: 増える呼びは先の群の今の口座 1 回、 増える状態は印 1 file で、 次の判定が退避する"
  - "代償: 先の群が逼迫していない周は予約が無く、 その周に逼迫に転じた先の群の移り先は次の周に決まる (同じ周の候補は後の群が取っている)"
  - "代償: doctor の群の行が 1 欄増え、 行の全文を読む既存の歯の期待が動く"
  - "代償: 断りは能動的には 1 席にしか届かない。 host の全席へ届く形は別の置き場の列挙を要し、 本 ADR では採らない"
