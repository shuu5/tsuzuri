  器の案の章の要約: 候補を 4 つ並べます。 予約を逼迫した群だけに限り断りの印を群用 dir に置く案 (選んだ案)、 逼迫した後の群が先の群の予約を奪う案、 断りの 1 行を host の全席へ送る案、 口座を増やす運用で受ける案です。 選ばなかった 3 つは、 規則が 2 つになる・別の置き場は列挙できない・運用は規則でない、 という理由で退けました。
  器の専門語の説明: 本文に出てくる専門語 7 個を、 やさしい言葉で説明します。
  ・群の予約（group reservation）: 群ごとに周ごと導く、 その群が次に移る口座。 候補を残量の鍵で並べ、 どの群の今の口座でもなく先の群の予約でもない先頭。 本 ADR で、 その周に逼迫している群だけが持つ。
  ・逼迫（pressure）: 口座の実測の窓 (5 時間・7 日・モデル別 7 日) のどれかが閾値の rules 行の値以上であること。 群の今の口座が逼迫した周に群は移る。
  ・残量の鍵（headroom key）: 7 日窓と役割の model の 7 日窓の残量の小さい方が大きい順 → 7 日窓の reset が早い順 → 宣言順、 の辞書順 (ADR-1069)。 本 ADR で変えない。
  ・断りの印（refusal mark）: 移り先の無い断りの周に群用 dir へ書く 1 file (群の名・断りの時刻・理由)。 次の判定 (留まる・移る) が history へ退避する。 doctor の群の行が時刻を出す。
  ・群の今の口座（current account）: 群の記録が指す口座 (記録が無ければ種)。 本 ADR で、 先の群の逼迫はこの口座の実測 1 つで判じる。
  ・群用 dir（group dir）: host で 1 つの dir で、 群ごとの記録・頼み・判定の打刻・本 ADR の断りの印を置く。 別の置き場 (state dir) の席からも同じ dir を読む。
  ・管理 tick（management tick）: 席の外から周期 (rules 行 1 本・既定 15 秒) で回り、 死んだ席を起こし直し、 移動の周に退避を撃ち、 群の移動の判定を撃つ仕組み (ADR-1058・ADR-1066)。
