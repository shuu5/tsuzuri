# 判断の記録 ADR-7 — 裁定面の形（発効 2026-09-26・持ち主の裁定 user 2026-09-26T07:51Z・記帳先 = tsuzuri の台帳 t3-hub.1 notes）
# 討論の記録は docs/grill/2026-09-25-B-ruling-surface.md（§8・§11・§14・§16・§18）。見本は tsuzuri-site/mock3（静的 HTML・直し 1 から 11 の report は席の作業場）。
id: ADR-7
title: 裁定面は project board と account board の 2 面とし、台帳と設計文書と走行を 1 つの導出グラフに結んで帯を出所の名で描き、文と hover に予算を持ち、mock で確かめた受入条件を面の便の歯にする
status: accepted
date: 2026-09-26
context: |
  持ち主の要件は「裁定をまとめて承認でき、全体の方針を自由に書け、席が面を実時間で更新して面越しに対話でき、台帳と epic の全体像を直感的に把握できる高機能な面」で、さらに「台帳（beads）と設計文書（design-intent）は両方ともグラフ化でき、面に出し、裁定と考察の材料にし、AI にも見落としなく精査できる仕組み」と「pipeline の表示をそれらに連動させる」と「口座の残量と負荷を複数 project と複数口座で見る面」が足された。
  席は仮の裁定を 15 本積み、静的 HTML の mock を 3 版と直し 11 回で作り、持ち主が実機で評価した。評価で決まったのは、語は英語の技術語を英語のまま「?」で注釈すること、抽象の層の名（決まり・設計・判断・作業）は捨てて帯を出所の正本の名にすること、形は 2 種にすること、口座の面は器の側の別の面で project board は新しい窓で開くこと、文字を減らし記号と図で整理すること、hover は pointer の近くに出し下の項目の邪魔をしないこと、台帳の処理状況の指標の取捨である。
  器の側の前提は scribe2 と確認し合意した。群は「一つの口座を共有する project の群」で今の口座は 1 つ、移り先は残量の鍵と宣言順の予約で導き、席の合図の健康と停止は器が file に書き、群の移動の退避は猶予を持つ（scribe2 の判断の記録 ADR-0069 から ADR-0071）。
decision: |
  (1) 面は 2 つ。project board は project ごとに 1 つで、その project の orchestrator が data と窓を持つ。account board は器の側の 1 つで、複数 project と複数口座を並列に見る。account board は HOME（project の群と口座・各 project の次の一手・口座の移動は畳む）・session・各 project の 3 つの tab を持つ。project board は account board から名前つきの新しい窓で開き、既に開いていれば前面に出す。project board の「戻る」は自分の窓を閉じて account board の窓へ戻る。
  (2) 面の土台は 1 つの導出グラフ。節点は設計文書の 11 種と設計ノートの行、台帳の 7 種（epic・task・memo・question と、notes から導く あなたの決定・orchestrator の受け・全体への指示）、走行（run）。辺は設計文書の 17 型と台帳の 4 型と結びの 6 型（design・ruled_by・answers・touches・premises・source）と走行の 3 型で、memo の昇格先を指す辺を候補として足す（型の名は設計ノートで決める）。不変条件の 12 本（G-1 から G-12）を床（tz graph --check）が 3 値で数え、席は問いを置く前に近傍（tz graph --around）を材料にし、近傍の全節点に処分（touches か not-relevant）を宣言する。
  (3) 描き方。帯は出所の正本の名で 7 つ（constitution・rules・ADR・SRS・design-note・beads・pipeline）、beads の帯は種類の 7 行に分ける。形は 2 種（四角 = file に書かれた行・丸 = 台帳と走行）、囲みは 1 種、色は帯、縁は状態だけ。凡例は実物の見本で描く。全節点に id を出す。地図は圧縮・一覧・グラフ・表の 4 面を 1 つの tab 列で切り替え、切り替えは URL に残す。グラフは wheel と drag で拡大と移動ができ帯の名は左端に固定する。近傍は根拠の側と影響の側を各 2 段、段数と畳みは URL に残す。hover した節点から両側を光らせ、hub から先は広げず、光る節点は 20 までとする。
  (4) 問いと裁定。問いは台帳の question で、答えは notes の定型行として あなたの決定 の節点になる。card の順は題・概要（非エンジニア向けとエンジニア向け）・理由（常に表示）・推奨・答えの欄・つながり（畳む）。まとめて承認は 1 問 1 id と束の id を持ち、見た版が古ければ断る。全体への指示は方針の欄で受ける。承認の event は面の server が書き、席は配達の期限と停止の hook で起きる。
  (5) pipeline は走行を節点にして連動する。pipeline dashboard の列は Queued / Blocked・Running / Gated・Questioned / Failed / Stopped・Landed の 4 つで、段の名は英語のまま「?」で注釈する。
  (6) 次の一手は閉じた 7 種を優先順に判じ 1 つを大きく出す（限度と移動・応答なし・止まっている走行・束の承認・質問・発効待ち・なし）。account board の HOME は各 project の次の一手を並列に出す。
  (7) 口座。project の群は今の口座 1 つ、候補は集合で、次の移り先は器の doctor と同じ導出の値を写す（none は移り先なしか鮮度の外）。project board は「orchestrator と口座」の 1 つの block に状態・稼働の記録（24h / 6h / 3h）・登録の口座・群の名・3 窓の残量を出し、逼迫か移動中のときだけ状態の帯を出す。account board の session の表は project → role（orchestrator が上・pipeline が下）→ session → 口座 → 段 → 経過 → 稼働の記録の順で、並べ方は切り替えられる。席の合図の健康（tick）と停止（heartbeat）は器の 2 つの file を読み、応答なしは tick が stale のときだけ、停止の切り替えは器の CLI を撃つ（面は file を書かない）。移動中の席には退避までの残り秒を出す。
  (8) 台帳の処理状況。指標は open task・純減（24h と 7d）・closed/日・未反映・burndown・判定（順調・停滞・滞り・積み増し・台帳なし）・memo で、ready / blocked・lead p50・stale・sparkline・epic の進みは「詳しく」の中に置き、作業中の数と最古は出さない。判定の閾値は rules 行で持つ。design-intent に未反映のもの（昇格先の無い memo・処分の宣言の無い裁定・反映されていない要望）は一覧で出す。表は判定 1 語と主指標 3 つと「詳しく」の 3 段で読む。各 project の tab は表で、要対応の重い順に並べる。
  (9) 語彙と文の予算。英語の技術語は英語のまま出し「?」で注釈し、言い換えるのは一般に使わない日本語だけ。「?」の注釈は 1 行目 40 字と箇条書き 4 項（1 項 20 字）と「詳しく」、hover card は 4 行（1 行 36 字）と「詳しく」、経験者向けの 1 行は 60 字。「・」で 3 つ以上つなぐ文と括弧の入れ子は書かない。状態・方向・増減・閾値・時間は記号と数で表し、手順は小さな図で描く。初心者と経験者の mode を持つ。
  (10) hover の規則。card を出すのは頁を持つ節点の札・圧縮された cell・記号だけの要素の 3 種だけで、自分の中身を全部見せている block には出さない。card は pointer の右 16 ピクセルに出し、要素を出て 150 ミリ秒の猶予の間に card の方向へ動いたときだけ残す。card にはくちばしを付け、hover 中の要素に枠を出す。
  (11) 概要は data で持つ。節点ごとの概要（非エンジニア向けとエンジニア向け）は設計文書の plain の欄と台帳の要約の欄に置き、面は写すだけ。要約の無い節点は床が数える。
  (12) 受入条件は面の便の歯にする。はみ出し 0・重なり 0・390 幅で横 scroll 0・hover の欠け 0・見出しは語彙表の語だけ・最初の画面の散文は 300 字以下・page error 0・文の予算の違反 0・全節点に id・切り替えは URL に残る・持ち主の逐語の混入 0・外部の library 0。mock の測定 script を歯の種にする。
  (13) mock は仕様の見本であり本番ではない。本番の面は ADR-3 の Rust の wasm で作り、契約表から導出物を作って器が読む順（ADR-4）に従う。実装は folio2 の M3 の出口の後に起こす。
  (14) 端末（ADR-5 の (2) を広げる）。端末の行に入力の環境（LANG・GTK_IM_MODULE・QT_IM_MODULE・XMODIFIERS）と専用の profile（--user-data-dir）と IME の flag を持つ。同じ profile の既存の process が窓を開くと環境が効かないので、面の窓は専用の profile で起こす。
options:
  - id: a
    name: 2 面と導出グラフと文の予算
    text: 決定 (1) から (14)。
    verdict: adopted
    reason: mock を 3 版と直し 11 回で持ち主が実機で評価し、受入条件を数値で満たした形。持ち主が「反映された mock で確定」と裁定した。
  - id: b
    name: project board だけ
    text: 口座と複数 project の面を作らず、project board に口座の情報を足す。
    verdict: rejected
    reason: 複数 project と複数口座を並列に見る面が無く、群の移動と残量の全体像が見えない。持ち主が別の面と裁定した。
  - id: c
    name: 抽象の層と力学の配置
    text: 帯を 決まり・設計・判断・作業 の 4 層にし、全体像を力学の配置の絵にする。
    verdict: rejected
    reason: 持ち主に「何と何がつながっているか」が逆に分かりにくく、1,000 節点の絵は形が毎回変わって読めない。
basis: [P-2, P-6, P-7, P-12, P-19, P-20, N-2, N-5, N-6, ADR-3, ADR-4, ADR-5]
retreat:
  kind: measure
  condition: 本番の面で決定 (12) の受入条件のどれかが 2 便続けて落ちるか、持ち主が「文字が多い」と 2 度言ったら、文の予算と hover の規則を見直す便を起こす。数えるのは t3:orchestrator 席。
plain: |
  決定の画面の形を決めます。画面は 2 つです。project ごとの画面と、複数の project と口座をまとめて見る画面です。project の画面は新しい窓で開き、「戻る」で窓を閉じて元へ戻ります。
  中身は、台帳と設計の文書と作業の走行を 1 つの図に結んだものです。図の帯は元の文書の名前で分け、形は「文書の行 = 四角・台帳と走行 = 丸」の 2 つだけにします。
  質問には、題・概要・理由・おすすめの順で答えられます。まとめて承認もできます。次に何をすればよいかは、決まった順で 1 つだけ大きく出します。
  口座の画面には、今どの口座を使っているか、残りはどれだけか、次にどこへ移るか、席が元気かが出ます。台帳の画面には、積んである仕事と片付く速さと、まだ設計に反映されていないものが出ます。
  文字は減らし、記号と図で表します。説明の長さと hover の出し方には決まりを置き、機械で数えます。
  この記録はあなたの承認で発効しています。承認の記帳先は tsuzuri の台帳です。
