# 判断の記録 ADR-83 — 作り直し （v4） のゴール G1〜（G11） を epic を閉じる条件として測れる形に置き、器の構造の行が入るまで毎日の検証を置き、それる型を止める門を段で置く（第 2 稿）
# 起草は係 w443a（2026-10-07）。第 1 稿（係 w436a）を検証役 （v439） の所見 A1〜A15 と席の処分（台帳 t3-hub.92.10 の notes 2026-10-07T09:55Z）で作り直した。前の記録の直しは判断の記録 ADR-84 に割った。
# 持ち主の裁定 t3-hub.92.10.29・.30・.32 で発効（2026-10-07・推奨のとおり）。反対側からの検証は検証役 v439 が第 1 稿を 1 巡攻め、第 2 稿の直しは席が所見 A1〜A15 の処分の表と照らした。条の字は替えない（amends を持たない）。
id: ADR-83
title: 作り直し（v4）のゴール G1〜（G11） を epic を閉じる条件として測れる形に置き、器の構造の行が入るまで毎日の検証を置き、出す前の攻めを検証役の観点から段で入れ、契約は設計係の出す物だけにし、撤退とゴールの窓を機械が読む
status: accepted
date: 2026-10-07
context: |
  持ち主は 2026-10-07T09:12:15.602Z の発話（逐語は台帳 t3-hub.92.10 の notes 09:17Z の行）で、ADR-82 の承認に続けて、同じ型のミスをしない器の構造の仕組みが入るまでは今回のような検証を定期的に行い、ゴールを明確に置いてそれないようにせよと求めた（V）。「器」は語の表の定義（design-intent/vocabulary.yaml の vessel・scribe2 の本体）で読む（V）。同じ型のミスは、検証役 （v433） の監査（要直し 8 件）が名指した型である（V）: (a) 退けた案へ戻る道（F1・F3・F12）、(b) 役の混ざり（F6・F10・F11・F17）、(c) 閉じた決めに当たる道（F4・F15）、(d) 測りの窓を席の記憶で開く（F2）、(e) 承認の字と記録の字の食い違い（ADR-82 の第 1 稿）。
  ・反例（V）。ADR-80 は検証役 （v423） の、ADR-81 は検証役 （v427） の攻め（grill の欄）を持って発効したが、（F10）（ADR-81 の決定 (5) の「席が契約を直して置き直す」）・（F11）（ADR-80 の決定 (8) の「契約の起草は席」）・（F12）（ADR-80 の撤退 (1) の止めた上限へ戻る道）は通った。だから攻めを求める床の code を足しても、攻めの観点が型を見なければ止まらない（D）。作法の行 D-10 の 1 つ目の文は「待ち・門・検証の周回は効きを数えてから足し」である（V・design-intent/rules.yaml:145）。
  ・今の手当て（V）。epic t3-hub.92 の本文の節「それない決まり」（本文の頭にゴールを書く・毎日 1 度の検証役の監査）は条 N-2.1 の文だけの決まりで、毎日の監査は会話の中の定期の起こしで置き、会話が切れると止まる（台帳 t3-hub.92 の notes 2026-10-07T10:01Z）。ライン停止の解きは判断の記録 ADR-77 の決定 (8) の （K7） と (9)（行 77-7 の着地で器の停止線に代える・それまでは memo t3-hub.92.10 の昇格条件）が持ち、epic の本文のゴールの節もそれを替えないと書く（V）。
  ・撤退の窓の読み（V）。ADR-77 の決定 (3) は判断の記録の撤退の欄 measure と日次の測りを行 77-8 に置き、消す物 K3 で手の数えの字をその欄の写しから消す。ADR-80 と ADR-81 の撤退は 77-8 の欄へ移ると書く。77-8 はライン停止の解きの後の順に在る。
  ・今の値（V）。検証役の起こし 16 本（2026-10-05〜10-07・spec.json と meter.json の在る物）の新しい量の中央は 197,165 token。問いの bead（label intake:question）は 2026-09-30T09:30Z から 102 本、2026-10-06 から 15 本。判断の記録（番号 99 以下）で日付が 2026-09-30 から後の物は 57 本で、grill の欄を持つ物は 20 本。
decision: |
  (1) ゴール（epic t3-hub.92 を閉じる条件）。G1〜（G11） は epic を閉じる条件にとどめ、ライン停止の解きは替えない（ADR-77 の決定 (8) の K7 と (9)・memo t3-hub.92.10 の昇格条件のまま）。各行は 鍵・満たす値・窓・出所。出所が「監査の数え（D）」の鍵は、毎日の監査の検証役が完全な記録から数えて notes に撃った命令と数を書く。在る無しの鍵は効きを測らない。値は今日の数からの見立て（I）で、承認の裁定がその値の裁定を兼ねる。
    ・G1 鍵（wip_blank_7d）（圧縮の後に器が出す作業中の bead の欄が空か古いか、定型の行〔計画:・次の手:・優先:・未決:〕を欠いた周の数）・満たす値 0・窓 末の 7 日・出所 監査の数え（D・器に event の種が無い）。
    ・G2 鍵（unsorted_owner_utterances_7d）（持ち主の発話で仕分けの記帳を持たない物の数）・満たす値 0・窓 末の 7 日・出所 監査の数え（D・器の event log は係の知らせを持ち主の発話と分けない）。
    ・G3 鍵（memo_gate_bypass_7d）（label intake:memo の起票のうち metadata の digest を持たない物）・満たす値 0・窓 末の 7 日・出所 台帳。鍵（open_memos_delta_7d）（開いた memo の数の、今と 7 日前の差）・満たす値 負・窓 末の 7 日・出所 監査の数え（D・7 日前の数は監査が日ごとに記帳する）。
    ・G4 鍵（patch_paths）（器と plugin に残る差の file を当てる道の数・ADR-84 の決定 (1) の一覧の grep）・満たす値 0・窓 着地ごと・出所 監査の数え（D）。鍵（design_first_land_rate）（ADR-82 の決定 (2) の 1 回目の着地率）・満たす値 70% 以上・窓 ADR-82 の窓・出所 ADR-82 の決定 (2) の席の数え。
    ・G5 鍵（review_mechanical_fail_7d）（契約の審査の非 PASS のうち、preflight が字で照らせる型の数）・満たす値 0・窓 末の 7 日・出所 監査の数え（D・器の run の dir の review.json）。
    ・（G6） 鍵（design_commit_share_7d）（main の commit のうち印の行 Scribe2-Contract を持たない物の割合）・満たす値 40% を下回る・窓 末の 7 日・出所 監査の数え（D・git の log）。
    ・（G7） 鍵（rerun_untouched_7d）（main の差が便の write-set の依存の閉包に触れないのに着地の前に撃ち直した数）・満たす値 0・窓 末の 7 日・出所 段 （S5） の行が足す（その行の起草で数えを足す・それまで U）。
    ・G8 鍵（daily_late_finds_30d）（push ごとの CI なら push の時に見つかった落ちを日次の撃ちが後から見つけた件）・満たす値 1 以下・窓 段 （S6） の行の着地から 30 日・出所 段 （S6） の行が足す（それまで U）。
    ・（G9） 鍵（planted_defect_runs）（植えた欠陥で係と便の prompt の検出の率を測って記帳した回の数）・満たす値 1 以上・出所 段 （S7） の行。在る無しの鍵。
    ・（G10） 鍵（ladder_rows_landed）（ADR-81 の決定 (9) の行 4 本のうち着地した本数）・満たす値 4。鍵（ladder_shadow_closed）（ADR-81 の影の窓が閉じた）・満たす値 1。出所 台帳と main の印の行。在る無しの鍵。
    ・（G11） 鍵（line_77_5_landed）（行 77-5 の着地）・満たす値 1・出所 main の印の行（在る無しの鍵）。鍵（r3_contract_rerun_7d）（同じ型の落ちが行 R-3 に達した行で、構造の直しの行を置かずに契約を直して撃ち直した数）・満たす値 0・窓 末の 7 日・出所 監査の数え（D・行 77-4 の着地の後は器の型の記録）。
    閉じ方: 同じ日の監査で全部の鍵が満たされた時、席は epic を閉じて持ち主に知らせる。窓が開いている鍵（G8 の 30 日）は窓が閉じるまで満たさない側に数え、U の鍵は満たさない側に数える。
  (2) 定期の検証（器の構造の行が入るまでの手当て）。毎日 1 度、席は検証役（型 tsuzuri:verifier・読むだけ・1 巡・頼みの対象は <段の memo>/rebuild-audit）を起こし、前の検証の後に席が書いた決めと出した物（判断の記録・問い・契約・memo・notes の推奨の行）を、ゴール（決定 (1)）と作り直しの決め（退けた案・役の分け）に照らさせる。観点は決定 (3) の段 1 で検証役の型の定義に置く字で、頼みに書き直さない。今は会話の中の定期の起こしで置き、会話が替わった日は席が作業中の bead の行（次の手:）から置き直す。決定 (5) の鍵（audit_overdue）が着地した日から、期日の見張りは日次の撃ちが持つ。終わり: 器の構造の行（ADR-77 の行 77-4 の残り 2 本・77-5・77-6・77-7）とこの記録の行（決定 (6)）が全部着地し、その後に続けて 3 回の監査の要直しが 0 になった時、席は毎日の検証を止めるかを持ち主に問う。
  (3) 出す前の攻め（門 C2）を段で置く（条 P-27.1 のはしご）。
    ・段 1（行 t-verifier-lens）: 検証役の型の定義（plugin/agents/verifier.md）に観点を 1 行ずつ 6 行足す。退けた案へ戻る道（撤退と推奨の行き先が退けた案か）・役の混ざり（設計係か席が実装か契約の字を作る形）・ゴールの結び（決定 (1) のどの G に結ぶか）・承認の字と記録の字の食い違い（記録と頼みが承認の逐語に引き金・動き・問う句を足すか削るか）・前の段の消す物（前の段の memo が名指す消す物が code に残るまま、後の記録が残す決めを置いていないか）・引いた決まりと前の記録の字が今も効くか（status・外した便・宣言の鍵）。
    ・段 2（効きの測り・席の手）: 段 1 の着地の後、席は観点つきの検証役を、ADR-80 と ADR-81 の発効の前の稿（drafts/w426a/w/ADR-80.v5w.yaml・drafts/w429a/w/ADR-81.v2w.yaml）に 1 巡ずつ当て（頼みに v433 の notes を材料として渡さない）、（F10）・（F11）・（F12）（v433 の監査の notes）のうち拾った数 k を memo （t3-hub.92.10） の notes に記帳する。
    ・段 3（床の code の門・条件つき）: k が 2 以上なら、席は作法の行 D-10 の 2 つ目の文を「条の改めと上限の替え（条 A-2.3 が名指す物）と判断の記録は、出す前に必ず攻めさせる」に替え（問い q2 で問いの bead も選ばれたら「判断の記録と問いの bead」）、行 （t-attack-floor） を起草させる。その行の形: 判断の記録の床（folio2 の adr.rs の check_between）は、番号 85 以上の発効した記録に grill の欄と、その欄の攻めた file の sha256 を求め、発効する file から status・approval・grill・supersedes・superseded_by の欄を除いた木の要約値と照らす。問いの bead も攻める時は、起票の門（crates/tsuzuri-core/src/gate.rs）が metadata の （attack） の検証役の （spec.json） の target に問いか記録の id を含む事を求める。k が 1 以下なら、席は観点の字を直して段 2 を 1 度だけ撃ち直し、それでも 1 以下なら行 D-10 も床も替えず、数を添えて持ち主に問う。
  (4) 契約は設計係の出す物だけ（門 C4）。止める物: 契約の書き（欄 acceptance に [[contract]] の行を持つ create と update と、本文だけの update）のうち、本文が起草の置き場の <名>/w/contract/<行 id>.md と一致しない物、acceptance が同じ dir の <行 id>.toml から欄 section・goal・depends の行を除いた字と一致しない物、<名>/spec.json が型（tsuzuri:drafter）で欄 （ended） を持たない物、2 つの file の更新の時刻が （ended） より後の物。止める所: 契約の散文の門（crates/tsuzuri-core/src/contract_gate.rs・行 t-contract-from-draft）。席が契約の欠けを見つけた時の道は、設計係を起こして直させ、その出す物を置く 1 つになる。はしごの証し: 段 1（要る）は （F6）・（F10）・（F17） の契約の分が席の手で起きた事（V）。段 2（今在る物で足りるか）は、契約の散文の門が本文の形だけを見て出所を見ない事と、作法の行だけでは条 N-2.1 の文だけの決まりである事で足りない（V）。段 3 は新しい依存と置き場を足さず、今在る門に照らしを足す。消す物: 席の置き場の契約の写し（bodies/v4 の c-*.md と acc-*.toml）の道。席の置き場の外の script（bead-from-draft.py）は設計係の 2 file を読むだけなので残し、門がその組みの食い違いを断る。
  (5) 撤退とゴールの窓を機械が読む（門 C5）。行 77-8 の前半を前に倒した行 （t-window-read） として、ライン停止の中で流す: 判断の記録の撤退の欄 measure（鍵・向き・閾値・窓）と、日次の撃ち（xtask/src/daily.rs）がその欄とこの記録の決定 (1) の鍵を読み、当たった日に記録の id と条件の番号を題に持つ memo を席へ起こす（開いている間は notes に足す）。窓の始まりは機械が読める印の 2 種だけを読む: 行の着地（main の commit の印の行 Scribe2-Contract が名指す行 id）と記録の発効（その記録の file の status を accepted にした commit の時刻）。ほかの始まり（段の着地・席が選んだ行の組・本数で閉じる窓）は U と書き、窓が閉じた日も読まず、毎日の監査が数える。この記録の鍵（audit_overdue）（前の監査の spec.json の ended から 24 時間を越え、その後に台帳の notes の頭の時刻 [席 <時刻>] が在る）・向き 越える・閾値 0・窓 行 （t-window-read） の着地から も同じ読み手が読む。前の記録の写しは ADR-84 の決定 (9) の表で、ADR-77 の消す物 K3 の写しの道に乗せる（封じた記録の本文は替えない）。行 77-8 の残り（床が鍵を測りの項の一覧と照らす・持ち主の対話面への出し・席の日次の測りの退け K6）は ADR-77 の順のまま。
  (6) 行と順。tsuzuri の行 t-verifier-lens（段 1）・（t-attack-floor）（段 3・条件つき）・（t-contract-from-draft）（C4）・（t-window-read）（C5）。どの行も設計係が起草し、便で入れる。依存は後の行が前の行の code を呼ぶ時だけで、段 3 は段 2 の数の後。席の契約の起票は C4 の着地の後にその門を通る。
  (7) 規則の行。替えるのは作法の行 D-10 の 2 つ目の文だけで、段 3 の条件が立った時にこの記録の承認の裁定を引いて替える。足す行は無い（期日の 24 時間は決定 (5) の鍵の閾値で、承認の裁定が値の裁定を兼ねる）。条の字は替えない。
options:
  - id: a
    name: 甲 — 第 1 稿のまま（門 C1〜C5 を全部置き、出す前の攻めの床の code を段 2 を待たずに置き、ゴールの全部が満たされた時にライン停止を解く）（削らない案）
    text: |
      第 1 稿の決定 (1)〜(12)。C1（監査の期日を停止の hook で止める・規則の行 1 本）と C3（ゴールの結びを起票の門で止める）を置き、C2 の床と問いの門の code を観点と同時に置く。
    verdict: rejected
    reason: |
      主張する利益: 型を全部、席の判じを通らない門で止める形に近い。
      失う物（退けた訳）: ライン停止の解きを替えると ADR-77 の決定 (8) の （K7） と (9) に当たる（v439 の A1）。C2 の床は ADR-80 と ADR-81 の反例で効きが測られていない（A3）。C1 は 1 度止めるだけで日次の memo と同じ強さ（A6）、C3 はどの型にも結ばない（A7）。足す門が 2 つ・規則の行が 1 本・hook の code が多い。
  - id: b
    name: 乙 — ゴールを epic を閉じる条件に置き、毎日の検証を置き、C2 を段で入れ、C4 と C5 を足す（推奨）
    text: |
      決定 (1)〜(7)。C1 は C5 の鍵（audit_overdue）に畳み、C3 は外して結びの照らしを毎日の監査と C2 の観点に置く。
    verdict: adopted
    reason: |
      主張する利益: 持ち主の 2 つの求め（器の構造の行が入るまでの定期の検証・ゴールを明確に置く）を、閉じた決めに当たらずに満たす。C2 は効きを数えてから床に進む（作法の行 D-10 の 1 つ目の文）。C5 は承認済みの行 77-8 の前倒しで、読み手を 2 本作らない。
      失う物: 段 1 と段 2 の間は、出す前の攻めを求める床が無い（攻めは今の作法の行 D-10 の範囲のまま）。窓の始まりが機械に読めない撤退（ADR-72 と ADR-82 の条件）は C5 で止まらず、毎日の監査の数えに残る。席が契約の小さな欠けも自分で直せず、毎回設計係 1 体の量が掛かる。
  - id: c
    name: 丙 — 門を足さず、毎日の監査だけを続ける
    text: |
      決定 (1)(2) だけ。
    verdict: rejected
    reason: |
      主張する利益: 行を流さず、器の線を止めない。
      失う物（退けた訳）: 持ち主の求めは、構造の仕組みが入るまでの手当てとして検証を名指している。監査は出した後にしか見つけず、会話が切れると止まる。
basis: [N-2, N-3, P-4, P-4.2, P-27, P-27.1, P-27.2, A-2.3, R-3, D-3, D-8, D-10, ADR-72, ADR-77, ADR-80, ADR-81, ADR-82, ADR-84]
retreat:
  kind: measure
  condition: |
    数えは決定 (5) の読み手（行 t-window-read）が日次の撃ちの記録から取り、当たった日に条件の番号とこの記録の id を題に持つ memo を席へ起こす。読み手の着地の前は、毎日の監査の検証役が完全な記録から数え、席が memo （t3-hub.92.10） か後継の memo の notes に撃った命令と数を記帳する。問う相手は持ち主。各行は 鍵・向き・閾値・窓（条 P-4.2）。どの行き先も、退けた案（差の file・席か設計係が完成した code か契約の字を作る形・止めた上限）と、判断の記録の出す前の攻めを外す事を戻し先に置かない。
    (1) 鍵（audit_new_tokens_7d）（毎日の監査の検証役の新しい量の 7 日の和）・向き 越える・閾値 2,100,000 token（予算 300,000 の 7 日分）・窓 承認から末の 7 日 → 監査の観点の数か、頼みの範囲を問う。
    (2) 鍵（attack_new_tokens_median_14d）（出す前の攻め 1 本あたりの検証役の新しい量の中央）・向き 越える・閾値 300,000 token・窓 行 D-10 を替えた commit から 14 日 → 問いの bead の攻めの範囲か、観点の数を問う。
    (3) 鍵（attack_zero_fix_ratio_14d）（出す前の攻めのうち要直しが 0 だった割合）・向き 越える・閾値 80%・窓 同じ → 観点の字か、問いの bead の攻めの範囲を問う。
    (4) 鍵（contract_redraft_per10）（門 C4 の断りの後に設計係を起こし直した数を契約の bead 10 本あたりにした値）・向き 越える・閾値 3・窓 行 （t-contract-from-draft） の着地から 14 日 → 設計係の頼みの形か、preflight の照らしを足すかを問う（席が契約を直す道は戻し先に置かない）。
    (5) 鍵（window_memo_false_14d）（門 C5 が起こした memo のうち、鍵の読み誤りで席が閉じた数）・向き 越える・閾値 2・窓 行 （t-window-read） の着地から 14 日 → 窓の印の読み方を問う。
plain: |
  持ち主の求め（2026-10-07T09:12:15.602Z の発話・逐語は台帳 t3-hub.92.10 の notes 09:17Z の行）「同じ型のミスをしない器の構造の仕組みが入るまでは定期的に検証し、ゴールを明確に置いてそれないようにする」を記録にします。「器」は語の表のとおり scribe2 の本体と読みます。
  1. ゴール: G1〜（G11） を、作り直しの大きな束（epic）を閉じる条件として「何を数え、どの値なら満たし、何日の窓か、誰が数えるか」で決めます。ライン停止を解く条件は替えません（前の記録 ADR-77 のまま）。
  2. 毎日の検証: 器の構造の作業とこの記録の作業が全部入り、続けて 3 回直す所が 0 になったら、止めてよいかを問います。
  3. 出す前の検証: まず検証役の見る所を 6 つ足し、前に見落とした 3 件を拾えるかを数えます。2 件以上拾えたら、判断の記録を出す前の検証を機械で求めます。
  4. 契約は設計係が出した file そのままでしか置けなくします。
  5. 撤退とゴールの期限を毎日機械が読み、時が来たら memo を起こします。前の検証から 24 時間を過ぎても同じです。
  失う物: 出す前の検証の機械の門は、効きを数えるまで入りません。席は契約の小さな欠けも設計係に直させます。期限の始まりを機械が読めない古い撤退は、毎日の検証が数えます。
consequences:
  - 毎日の監査の終わりは器の行 77-4 の残り・77-5〜77-7 の着地に結ぶので、ライン停止の間は監査が続く（I・1 日 約 25 万 token）。
  - 判断の記録の床の縛り（段 3）は条件が立つまで入らない。入る時は番号 85 以上に効き、ADR-83 と ADR-84 は縛らない。
  - 対話面だけで出す推奨と、窓の始まりを機械が読めない撤退（F2 の型）は門で止まらず、毎日の監査が後から見る（D）。
  - epic t3-hub.92 の本文の「それない決まり」の 1 つ目の箇条（本文の頭にゴールを書く）は文だけの決まりのまま残り、毎日の監査と C2 の観点が照らす。
