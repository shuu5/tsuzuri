note: |
  起草は係 w443a。番号 ADR-83 は第 1 稿と同じ。席の頼みのとおり記録を 2 本に割り、前の記録の直しは ADR-84 に置いた。第 1 稿から減らした物: 門 C1（C5 の鍵に畳む）と C3（外す）・足す規則の行 1 本・ゴールの鍵 structure_target_drop（効きの測りは ADR-77 の行 77-6 が持つ）・C2 の床の code を条件つきにした。C4 の消す物から bead-from-draft.py を外した（v439 が代わりの道の無さを指した・A の表の C4）。
