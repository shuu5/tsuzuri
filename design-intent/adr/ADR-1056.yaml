retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「席」は人と AI が話す 1 つの session、 「口座」は Claude を使う利用者の登録ごとの設定のまとまり (その口座の設定を読んで起きる session が全部読む)、 「見張り」は危ない操作を実行の直前に止める仕組みのことです。 git の履歴を壊す操作・元に戻せない削除・tmux の server を壊す操作・作業の記録簿 (台帳) を壊す操作を止める見張りは、 いま器の外の script と共有の plugin に在り、 判定の本体が見つからないと黙って通してしまいます。 この記録は、 その判定を器のプログラムの 1 つの口へ移し、 口座の共通設定から呼んで、 口座の設定を読む全 session (器を使わない session を含む) に効かせることを決めます。 器が自分で起こす session は口座の設定を読まないので届きません。 そのうち作業を進める session は器の plugin の見張りが守り、 review の session と口座の残りを測る session は権限の設定だけが守ります。 切るのは user の決定の印がついた規則の行だけで、 切れていることは器の健康診断が 1 行で言います。
approval:
  who: 持ち主
  date: 2026-10-03
  ruling: "t3-hub.74.53:20261003T2211Z-1（問い t3-hub.74.53 の案 A・器の記録 ADR-0056 を、規則の旗で見張りを切れる句を除いて受け直す・器の台帳の裁定 s2-07l.494 は器の承認の欄の字）"
  verbatim: "先ほどの問いは全部推奨で"
  surface: R-8
consequences:
  - "この判断で良くなることと、 代わりに引き受けることです。 口座の設定を読む session は器を使わなくても同じ規則で守られ、 外の 2 つの場所への依存が切れて、 切れた状態は健康診断に出ます。 代わりに引き受けることは 11 あります。 プログラムが見つからない・時間切れの周は止められません。 別の shell や言語や変数を通した設定の書き換えは通り、 設定を読まない起動では見張りごと外れます。 器を使う session では同じ命令を 2 度見て、 語の切り方の違いで判断が割れることがあります。 移し終えるまで古い見張りと並んで動き、 切る・戻すには規則の行の変更と入れ直しが要り、 repo の管理下の file を消すには git の削除を使います。 器が起こす session には届かず、 review の session は権限の設定だけが守ります。 口座の設定を読む AI の session は設定 file を書き換えられず、 既定の設定の場所は口座の設定の実体でない限り守りも配線もしません。 削除の見張りは、 変数や { } や dir を移った後の相対の場所で組んだ行き先・repo の管理下の file を含む場所や器の置き場の中の * を断り (生成物だけの場所の * は通り)、 1 つだけの file の削除や git で戻せる削除にも掛かる点で今の見張りより厳しくなります。 一方で、 別の命令や sudo などの前置きの中までは見ず、 find の削除も見ず、 別の repo や system の場所、 HOME の中の大事なデータは守らない点で緩くなります。 台帳の見張りは、 別の台帳への書き込みを断りません。"
  - "良い結果: 口座の設定を読む全 session (器を積まない session・marker の無い repo の session・口座の設定 dir を指定した起動) が、 器の中の同じ規則の行と同じ照合の関数で守られる"
  - "良い結果: 判定と値の本体が器の中の 1 か所になり、 共有 plugin と前の器への依存が切れて、 前の器の本体を退役できる前提が揃う"
  - "良い結果: 切れた状態・配線の欠け・binary の不在が doctor の 1 行に出て、 不在を知らせるためだけの script が要らなくなる"
  - "代償: binary が PATH に無い周は通すと選んだ (締め出しの回避)。 時間切れの周も harness が通す。 器はその周を防げず、 doctor が後から測るだけである"
  - "代償: 見張り自身の設定の編集の種類は、 interpreter の引数 (sh -c や python -c の中身)・変数・eval・別の shell を通して守る file を書く周を通し、 列に無い書き込みの命令 (truncate・dd・git restore など) も、 brace・command 置換・同じ command の cd の後の相対 path で守る file を書く周も通す (目的は事故の防止・ADR-1025 §2.6 と同じ残りの穴)。 rm の種類は、 変数と command 置換と brace と ~ の path と、 守る path に当たる glob を解けない path として断る。 user の設定を読まない起動 (--setting-sources) は見張りごと外れ、 止められない"
  - "代償: 器を積む session では hook の入口と host-guard が同じ command を 2 度見て、 判定の時間が 2 回分かかる。 分割が 2 通りなので、 引用符の中に区切りを含む command (例 git commit -m の引用符の中の「; git branch -D x」) は 2 つの口で判定が割れ、 断りはその和になる"
  - "代償: 移植が走り切るまで host の python の見張りと並走する期間があり、 同じ command が 2 度断られる (退役は歯が緑になった後の mv)"
  - "代償: 見張りを切る・戻すには rules 行の PR と merge と binary の install が要り、 host ごとの緩めも無い。 rm の守る集合は state dir 自身とその配下全部と cwd の repo の tracked file を含むので、 tracked file を含む dir や上位の dir を丸ごと消す rm は通らず、 tracked file を消すには git rm (履歴から戻せる) を使う。 state dir には harness の口座の設定 dir (transcript・memory) も在り、 state dir の中の不要物は退役の mv で脇へ移す (器の口が在る面はその口)"
  - "代償: 器が起こす session (runner・lens・usage の更新) には host-guard が届かない。 runner には語列の種類 (host_guard.git・host_guard.tmux・host_guard.ledger の語列) が command guard を通して掛かるが、 rm と見張り自身の設定の編集の種類は掛からない。 lens と usage の更新には語列の種類も host-guard も掛からず、 permission mode だけが守る。 lens の起動形は本 ADR では変えない (変えるなら ADR-1011 §2.2 を supersede する別の決定)"
  - "代償: 口座の設定を読む AI の session は、 口座と project の settings file を書き換えられない (守る file は file 単位で断る)。 口座の設定の書き換えは user が session の外で行うか器の口 (口座の設定を書き換える口) を経て、 project の設定の書き換えは user が session の外で行う"
  - "代償: 既定の設定 dir (口座の設定 dir を指定しない素の起動が読む dir) は、 HOME を読まないので、 口座の settings.json の実体でない限り守る集合にも配線先にも入れない。 いまはどの口座の settings.json もそこを指す symlink なので配線は届くが、 symlink の無い host の素の起動には届かない"
  - "代償: rm の種類は、 変数と command 置換の path を断る点で母集団 (通す) と極性が逆である (設計の裁定による意図した逸脱)。 変数で path を組む日常の rm (一時 dir の掃除や loop の中の rm)、 brace の慣用句 (x{,.bak})、 tracked file を含む dir や state dir の中の glob (*.log や src/*.bak)、 cd の後の相対 path の rm も断られる。 守る path に当たらない場所の glob (一時 dir の * や untracked の生成物だけの build/*) は通る"
  - "代償: rm の種類は母集団より 2 点狭い。 interpreter・eval・xargs・find -exec と透過ランチャ (sudo・env・timeout・command) を貫通せず、 find -delete も見ない。 system の path・cwd の repo でない repo (隣の repo・中に repo を含む dir)・HOME 配下の実データ・credential・git 管理外のデータを守らない"
  - "代償: 台帳の種類は foreign の台帳 (-C・--db・--global・別 prefix) への write を母集団と違って断らない。 母集団の has-remote の門は、 .beads と scripts/bdw を持つ repo という条件で置き換える"
note: |
  器の元の file: scribe2/design-intent/decisions/ADR-0056-destructive-guards-are-one-vessel-subcommand-wired-from-account-settings.html
  器の表紙の頭: 設計判断記録 (ADR) scribe2 — host の破壊防止の見張り
  器の表紙: 状態proposed選択肢5件 (OPT1–OPT5)結果良い 3 / トレードオフ 11版v0.1.0 / 2026-09-23
  器の表紙: 正当化する要件: SRS-SCRIBE2-MVP の FR1056・FR1072・FR1073・FR1074・FR1075・FR1076
  器の表紙: 想定読者: scribe2 の開発 session と消費側 repo の席と user — 器の内部は不要 (専門語はやさしい言葉を併記)
  器の承認の欄: 裁定 (user)・user・2026-09-20 (破壊防止の見張りを Rust で器へ取り込み、 器を入れた fleet (器を入れた machine 全体) の共通設定から器の binary を呼ぶ・切る / 調整するのは user の権限の設定・逐語は非公開の作業記録簿 = 台帳 s2-07l.494 の notes) ・ 2026-09-23 (前の器の本体の退役は本件が依存を切った後・逐語は同じ notes)・裁定済
  器の承認の欄: 設計 (orchestrator)・orchestrator・2026-09-23 草稿 v3.5 (裁定の向きを、 器の hook の入口・command guard・起票の門・口座の口・起動の構築点の現物に合わせて形にし、 ceiling の findings 5 周分を当てた。 拘束する constitution の版 0.5.0)・作成
  器の案の章の要約: 候補を 5 つ並べます。 器のプログラムに別の口を 1 つ作って共通設定から呼ぶ案、 今のまま残す案、 器の plugin にだけ載せる案、 shell の別名で塞ぐ案、 外の製品に任せる案です。 却下した 4 案にも利点を並べ、 退けた決め手が user の決定か分析かを各案に書きます。 今のまま残す案は、 今日から効き作る量が無い点では選んだ案に勝ちます。 plugin にだけ載せる案は、 器が起こす作業の session に届く点で勝ちます。
  器の専門語の説明: 本文に出てくる専門語 25 個を、 やさしい言葉で説明します。
  ・器（vessel）: scribe2 そのもの。 Rust で書いた 1 つのプログラム (binary) と、 それが持つ規則と記録の全体。
  ・口座（account）: Claude を使う利用者の登録ごとの設定のまとまり。 その口座の設定を読んで起きる session は全部同じ設定 dir を読む (器が起こす session の runner・lens・usage の更新は読まない)。 器は口座の口 (account add) で口座の設定 dir を作る。
  ・subcommand（subcommand）: 器のプログラムに渡す最初の語で選ぶ入口 (口)。 host-guard・hook・doctor はそれぞれ別の口で、 同じプログラムの中の別の仕事を呼ぶ。
  ・host-guard（host-guard）: 危ない操作を実行の直前に止める見張りのうち、 口座の設定を読む全 session に効くもの。 器の subcommand host-guard が掛け、 marker の有無に依らず効く。 役割の guard を掛ける hook の入口とは別の口で、 器が起こす session (runner・lens・usage の更新) には届かない。
  ・見張りの種類（guard kind）: host-guard が止める操作の区分。 git の履歴破壊・rm の不可逆削除・tmux server の破壊・台帳の破壊と素 write・見張り自身の設定の編集の 5 つに閉じ、 足すときは 1 つの enum に値を 1 つ足す。
  ・正本（source of truth）: 判定や値の、 それを見れば決まる唯一の置き場。 写しや呼び出しの薄い層ではなく、 中身を持つ側のこと。
  ・shim（shim）: 自分では判定を持たず、 別の場所に在る本体を呼び出すだけの薄い script。 本体が見つからないと、 いまの shim は黙って通す。
  ・配線（wiring）: どの瞬間に何を呼ぶかの登録。 本 ADR では口座の settings.json に書く hook 行 1 本で、 道具の直前に器の host-guard を --state-dir つきで呼ぶことだけを登録し、 判定は持たない。
  ・settings.json（settings.json）: 口座の設定 dir に在る設定 file。 その口座の設定を読む全 session が読む。 いまはどの口座の file も 1 つの実体への symlink で、 器の口座の口は既存の中身と symlink を保ったまま実体へ host-guard の hook 行を merge して書く。
  ・symlink（symbolic link）: 別の場所に在る file を指す、 中身を持たない file。 どれを開いても指す先の 1 つの実体が読まれる。 本 ADR ではどの口座の settings.json も 1 つの実体を指す形を言い、 見張り自身の設定の編集の種類は導いた path とこれを解いた実体の path の両方で比べる。
  ・hook（hook）: 決まった瞬間に外の命令を自動で呼ぶ仕組み。 Claude Code の session は開始・道具の直前などに設定された command を呼び、 rc 2 が返るとその道具の実行を止める。
  ・harness（harness）: AI の session を動かし、 道具の実行と hook の呼び出しを受け持つ Claude Code のプログラム。 hook の command が見つからない・時間切れの周の扱いはこちらが決める。
  ・payload（payload）: hook が呼ぶ command へ渡される中身。 stdin の JSON で、 道具の名・道具への入力 (Bash の command や編集先の path)・作業 dir を持つ。
  ・tokenizer（tokenizer）: 命令の行を語に切り分ける部品。 引用符と \ を解いて語に分け、 ; や && や | で区切りごとの列にする。 器では起票の門の segment 分割 1 本で、 本 ADR で host-guard もこれを使う (command guard の分割は従来のまま)。
  ・rules 行（rules row）: 規則の値を 1 つ持つ行。 器の規則の manifest (repo 内の 1 file・build 時に binary へ埋め込む) に置き、 id・種類・値・enabled・裁定 id・裁定日を持つ (憲法 C1)。
  ・host の面（host manifest）: machine ごとの事実を書く宣言の file。 state dir の host.toml で、 口座・席に積む plugin dir・群などの宣言値を持ち、 rules 行は置けない。 本 ADR はここに何も足さず、 口座の宣言から守る settings.json を導くのに読む。
  ・裁定 id（ruling id）: その値を user が決めたことを指す印。 user の裁定を指す id で、 rules 行が持ち、 裁定 id の無い rules 行の変更は C5 の CI が落とす。
  ・doctor（doctor）: 器の状態を 1 度に照らし合わせて見せる命令。 host の版・口座・退役・rules 行を照合し、 本 ADR で見張りの種類ごとの on / off と出所・配線の実体の数と口座の数・binary の解決を 1 行で出す。
  ・fail-closed（fail-closed）: 分からないときは止める、 という倒し方。 入力が読めない・判定が決まらない周に操作を通さず断る極性で、 host-guard は payload が読めない周に断る。
  ・fail-open（fail-open）: 分からないときは通す、 という倒し方。 判定が得られない周に操作をそのまま通す極性で、 hook の command が見つからない・時間切れの周の harness の振る舞いがこれに当たる。
  ・退役（retirement）: 使わなくなったものを消さずに脇へ移すこと。 元に戻せる move で行う (憲法 N1)。 host-guard は不可逆な削除を断り、 代わりの経路として退役を名乗る。
  ・force push（force push）: 遠くの履歴を手元の履歴で上書きする操作。 host-guard は断り、 上書き前の状態を確かめる --force-with-lease は通す。
  ・台帳（ledger）: 契約と裁定を書き留める記録簿。 bd の記録で、 write は bdw を経て 1 本ずつ直列に行う。
  ・marker（marker）: この repo は器が面倒を見る、 という目印。 repo の .vessel file で、 自分の名を言う repo でだけ器の hook の入口が仕え、 無い repo では黙る (FR1024)。 host-guard はこの目印を見ない。
  ・歯（tooth (test)）: 決めたことが守られているかを機械で確かめる自動の検査。 器では Rust の test 1 framework だけで書く (憲法 C12)。
  器の頁の末: このページは、大もとの機械データ (正本) から自動で組み立てられています。構造は機械が自動で検査し、内容が元データに忠実かは独立のレビューで確かめます。
