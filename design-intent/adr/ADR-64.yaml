consequences:
  - 器の行が同時に並べるようになり、器の列の待ちが縮む。器の便の着地ごとに、走るほかの便（根の便も）が審査を撃ち直す量が増え、床を外した後は並ぶ便の数だけ増える（審査は削らない）。宣言の行（t-scope-on）の後は、器の文書だけの着地でも走る便が撃ち直す。
  - 根を名乗る行（v-roots）の後は、受付が器の src の file ごとの 1,500 行と器の core crate の本体の上限を契約の size の見込みで測って断る。器の src 273 本のうち 27 本は 1,200 行を越えるので、見込みで断られた器の行に growth を書く起草の手間が増える。
  - 欄 done-teeth に器の歯の名を書けるのは根を名乗る行（v-roots）の着地の後に起こす便だけになる（前の base の便は審査が歯を見つけられず落ちる）。
  - 塞ぐまでは、器の crate の外の scribe2/ の下（規則の表・plugin・manifest と錠・契約の型・組みと lint の設定・文書）を write-set に書く行を、crate を書く行でも置けない。そういう行は宣言の行（t-scope-on）の着地を待つ。門は新しいか write-set が替わった行だけを判じるので、置き済みの行は判じない。
  - 組めない物の残り。塞ぐ前に門の外で置かれた行（門より前に置いた行）が器の crate の外の入力だけを着地させると、走る便は撃ち直しを省く。着地の列に後ろの便が居る周は、候補の木の検査（ADR-60 の決定 (6)）が組めない物を main の前に落とす。単独の着地では、撃ち直しを省いた後に squash と CAS で main を進め、主実測が赤を見つけて止まる（自動では戻さず、main の赤を戻す手が要る）。審査役だけが拾う食い違いはどちらでも残る。撤退 (2) がこれを数える。
  - 席の門 1 本（gate-scribe2-crates.py）と、観る 1 回の記帳の手間が増える。門は宣言の行（t-scope-on）の着地の後は何も断らず、席は設計の commit の script（commit-design.sh）から外すか残すかを選べる。
note: 起草は係 w254a、検証役の攻めを映した直しは係 w258a（2026-10-05）。承認の欄の逐語と経路は、適用の script が台帳の問いの notes の定型行から読んで入れた。条 A-2.3 と P-17.4 の字は当たらない（床は規則の行でなく宣言の鍵）。断りを外す変更なので、ADR-60 の決定 (5) の前例に倣い検証役の記録を添えた（docs/grill/2026-10-05-ADR-64-floor-grill.md）。検証役 qv66 の攻め（致命 2・要直し 6・軽い 5）は、封の前に係 w258a が全部映した。行 t-scope-on の値を器の dir の 1 項目に広げた直しは、ノート surface-wave29c の第 0.42 版。ノート surface-wave29d を起こして行 t-run-cap-off を置き、31 行の全部が着地したノート surface-wave29b を廃止した。封の行は tz check --freeze-adrs が足す。
