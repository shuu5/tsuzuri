consequences:
  - "良い面は、 上限に当たっても便の作業が捨てられないこと、 口座を窓の終わりまで使い切れること、 席が上限で止まって他の仕事を詰まらせなくなること、 口座を選ぶ理由が 1 本の関数に閉じて人の手も前の版の道具も要らなくなること、 前の版の道具が見せなかったモデル別の窓が選定に効くことです。 悪い面は、 段と完了の種類が 1 つずつ増えること、 席の登録に口座と起動の雛形が要ること、 選定のたびに計測が 1 回走ること、 測れていない口座が選ばれないこと、 退避の合図が席の作業を途中で止めることです。"
  - "Positive: 上限停止の便の worktree・commit・回答が保たれ、 別口座で Landed まで続く (C9・N1・AC1012)。 口座は当たるまで使われる (C9.2) が席の口座は便に食われない (§2.2 の除外)。 席は閾値の手前で退避し、 別口座で復元される (AC1013)。 選定が 1 純関数・入力 2 種 (宣言値 + 実測値) に閉じ、 前の版の道具への依存が消える (C8 の向き)。 モデル別 7 日窓が逼迫度に入る (記録時点の事故型)。 R-C9-1 が散文の行から typed な行になり、 C1 / C14.2 の相互参照が実体を持つ。"
  - "Negative (受け入れるコスト): Stage の variant 1 つ・Completion の variant 1 つ (運ぶ値が pid でない初の variant)・rules 行 R-C9-1 の値の型変更 (契約・裁定 id)・管理 tick からの計測 (鮮度が切れた周だけ) が増える。 極性一覧は増えない (§2.4 の判定は guard ではない)。 席の登録 row (ADR-1022 §2.1) に口座 label と起動の雛形の 2 field が要り、 登録時に人が雛形を渡す (1 席 1 回)。 選定のたびに FR1033 の計測 (host の HTTP client の子 process・口座数ぶん) が 1 回走る。 測れない口座 (credential 不在・墓標・HTTP 失敗) は選ばれない (保守側・その口座は席の手番で直す)。 逼迫度の比較はモデル別窓の display name 一致に依る (ADR-1017 §2.5 の限界のまま)。 退避の合図が busy の席に入るので作業が中断される (意図した不便・context の cap と同じ)。 候補なしの便は reset 時刻まで待つ (最長で窓 1 つぶん)。 R-C9-1 の値は初期は宣言値で、 退避の実測が溜まるまで保守的に出る (C10)。"
