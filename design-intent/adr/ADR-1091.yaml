consequences:
  - "この判断で良くなること 3 つと、 代わりに引き受けること 5 つです。 良くなるのは、 区画が口座を占めないこと、 群の移動と便を待たせず区画の席が線に達した周に人の手を待たずに移ること、 種類が名 1 語で読めて Tier9 の行が群と読まれて口座を占める誤りが起きないことです。 引き受けるのは、 群が 8 本までになること、 移るかが記録だけで決まり告げられても移らない周があること、 doctor の行が 1 種増えて外の読み手に知らせること、 区画の席と他の席が同じ口座に並びうること、 区画の移動は承認の記録を残さず、 移った事実を見回りの判定の行 (次の周で上書きされる) と、 起こし直しが記録する席の登録から読むことです。"
  - "良い結果: 区画の置き場は口座を占めず、 行が並べた口座は群の移り先と予約と、 便と他の席の選定にそのまま使われる"
  - "良い結果: 区画の手は lock を取らず計測を起こさないので、 群の移動と便を待たせず、 区画の席は row の口座の使用率が session 用の閾値に達した周に人の手を待たず移る"
  - "良い結果: 種類は名 1 語で読め (doctor の kind=park)、 区画を表すのに新しい表・key・rules 行・記録を足さない。 Tier9 を宣言しても群として口座を占める誤りが、 読みの形で起きない"
  - "代償: 群は Tier1〜Tier8 の 8 本までになり、 Tier10 以上の群は宣言できない (既存の群の名 Tier1 / Tier2 は合う)"
  - "代償: 区画の席の移動は計測の記録だけに依るので、 記録が無いか古い周は移らない (計測を起こさない代償)。 告げる線 (群の逼迫の閾値) と移る線 (session 用の閾値) が別で、 告げられても移らない周がある"
  - "代償: doctor に kind=park の行が加わる (群の行の欄の形は変えない)。 doctor の出力を読む外の読み手 (別 project の画面) は kind の有無で種類を分ける要があり、 変化を知らせる"
  - "代償: 区画の席の row の口座を他の席も選べるので、 区画の席と群の席や便が同じ口座に並び、 その口座が早く逼迫しうる"
  - "代償: 区画の移動は承認 event を書かない (移り先は席の起動と同じ session 用の口座選定で決まり、 起動が承認 event を書かないのと同じ) ので、 移った事実は群の移動の承認 event の列からは追えず、 管理 tick の判定行 (次の周で上書きされる) と、 起こし直し (FR1059) が event log に記帳する席の登録から読む"
