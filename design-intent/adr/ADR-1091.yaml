  部分 supersede。 ADR-1069 から置き換えるのは決定の群の名の句 (群の名 SHALL Tier<数字> で数字は重複しない) だけで、 群の表の行の名を Tier1〜Tier9 に限り、 Tier1〜Tier8 の行を群、 Tier9 の行を群でない park の区画とし、 Tier1〜Tier9 の外の名 (Tier0・Tier10 以上・Tier の形でない名) を読みで断る形に替える。 宣言順が数字の昇順でない面の断りと、 優先は宣言順のままは保つ。 ADR-1049 から置き換えるのは決定の「便の置き場の席の登録 row の除外 SHALL 残す」の範囲だけで、 区画の置き場の席の row の口座をこの除外に入れない。 保つのは、 ADR-1069 の残量の鍵・群の予約とその排他・種・doctor の群の行の next=、 ADR-1049 の群 (席の口座を持つ単位)・群の宣言を host の面の表 1 つに置くこと・群の宣言を A1 の常設の承認とし群の移動の周に承認 event を記すこと・群の今の口座の記録・移動は新しい口座で席を起こすこと・候補が無ければ移らないこと、 ADR-1074 の予約と断りの読みの全部で、 どれも群 (Tier1〜Tier8 の行) にだけ掛かる。 区画の行は同じ表に置き、 表の数は変えない。 ADR-1078 は置き換えない。 ADR-1078 が書かれた版では群の表の行は全て群だった (ADR-1069 の名の句) ので、 その決定の「群の anchor」は群の表の行の anchor を指す。 本 ADR はこれを範囲の読みとして区画の anchor も含めて読む (区画に置いた repo も隣の private repo に数え、 可視性を問う)。 ADR-1078 の目的 (隣の private repo の識別子を公開の前に止める) は置き場が群か区画かに依らない点で、 口座を持つ単位を決める ADR-1049・ADR-1069・ADR-1074 の「群」を Tier1〜Tier8 の行だけに読むのと根拠が違う。 ADR-1086 の語 excluded は FR1036 の session 用の除外集合を指す参照のままで、 集合から区画の席の row の口座が外れても句は変えない。
