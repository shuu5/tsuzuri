  器の案の章の要約: 候補を 4 つ並べます。 名 Tier9 の行を park の区画にする案 (選んだ案) と、 選ばなかった 3 つです。 選ばなかったのは、 群の行に種類の欄を足す案、 区画を作らず群の外に置いたままにする案、 区画の席が移る線を群の逼迫の線にする案です。
  器の専門語の説明: 本文に出てくる専門語 8 個を、 やさしい言葉で説明します。
  ・群の表（group table）: host の面が持つ置き場のかたまりの宣言の表 (FR1038)。 行の名は Tier1〜Tier9 に限り、 Tier1〜Tier8 の行は群を、 Tier9 の行は park の区画を宣言する。 修飾の無い「群」は Tier1〜Tier8 の行の群だけを指す。
  ・park の区画（park lot）: 群の表の名 Tier9 の行が宣言する置き場のまとまり (FR1095)。 群ではなく、 群の今の口座・種・群の予約・群の移動の判定・移動を頼む記録を持たず、 口座選定・群の移り先・群の予約のどれからも口座を除かない。
  ・park の移り先の判定（park move target）: 区画の席の移り先の口座を返す判定 (FR1095)。 row の口座の計測の記録の最新値が session 用の閾値の rules 行のいずれか以上の周だけ、 行が並べた口座から row の口座を除いた session 用の選定の口座を返す (候補も記録の最新値だけで選ぶ)。 計測を起こさず lock を取らない。 群の移動の判定 (FR1038) とは別。
  ・群の今の口座（group effective account）: 群の席が実際に使う口座。 器が host の根に群ごとに高々 1 件の記録で持ち (ADR-1049)、 書き換えは群の移動だけが行う。 区画は持たない。
  ・群の予約（group reservation）: 群ごとに周ごと導出する、 その群が次に移る口座 (ADR-1069・ADR-1074)。 記録せず、 他の群の移動と予約を排他する。 区画は持たない。
  ・row の口座（row account）: 席の登録 row (FR1040) が持つ口座。 群の表のどの行にも属さない席の起こし直しの口座で、 区画の席では park の移り先の判定が口座を返さない周の起こし直しの口座。 群の席は row の口座でなく群の今の口座に居る。
  ・session 用の閾値（session selection threshold）: session 用の口座選定が候補にする口座の使用率の上限の rules 行 (FR1036)。 今の行は R-C9-1 の 1 本で、 窓別の行は user 裁定で足す。 この値未満の口座だけが候補になり、 区画の席が移る線もこの行のいずれか以上。 群の逼迫の閾値 (FR1038) とは別。
  ・管理 tick（management tick）: 器が周期で席を見て、 黙った席へ合図を送り、 窓が shell に戻った席を起こし直す仕事 (FR1027)。 区画の席の周には park の移り先の判定を撃つ。
  器の頁の末: このページは、大もとの機械データ (正本) から自動で組み立てられています。構造は機械が自動で検査し、内容が元データに忠実かは独立のレビューで確かめます。
