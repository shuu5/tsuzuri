      利点: 候補を行が並べた口座に絞り、 宣言の外の口座へは引数でしか行かない (DR5)
      欠点: 群は Tier1〜Tier8 の 8 本までになり、 Tier10 以上は宣言できない
      欠点: 移るかは計測の記録だけで決まるので、 記録が無いか古い周は移らない
      欠点: 告げる線 (群の逼迫の閾値) と移る線 (session 用の閾値) が別で、 告げられても移らない周がある
      欠点: 区画の席の row の口座を他の席も選べるので、 区画の席と他の席が同じ口座に並びうる
      欠点: doctor に kind=park の行が加わり、 doctor の出力を読む外の読み手 (別 project の画面) へ変化を知らせる要がある
      欠点: 区画の移動は承認 event を書かないので、 移った事実は群の移動の承認 event の列からは追えず、 管理 tick の判定行 (次の周で上書きされる) と、 起こし直し (FR1059) が event log に記帳する席の登録から読む
    verdict: adopted
    reason: "決め手は分析 (群の仕組みに触れず、 区画を名 1 語で読める)。"
  - id: "OPT2"
    name: "群の行に種類の key を足し、 どの番号の行でも区画にできる"
    text: |
      群の行に明示の key (kind = park など) を足し、 どの Tier の番号の行でも park の区画にできる形。 決め手は分析 (番号と種類の 2 軸になる)。
      （平易）群の行に「この行は区画」という種類の欄を足し、 どの番号の行でも区画にできる案です。 名が優先の順だけを表し、 群の数に上限を置かない点で勝ります。 けれども、 番号と種類の 2 つの軸になり、 宣言の順が優先という決まりが区画の行に何を意味するかを別に決める要が出ます。 行の形に欄が 1 つ増え、 読み手は名と欄の 2 つを見て種類を知ることになります。 持ち主の呼び名は Tier9 で、 名で決めれば 1 語で足ります。 退けました。
      利点: 名は優先の順だけを表し、 区画の数と位置に名の制限が無い
      利点: 群の名に上限を置かず、 Tier10 以上の群も宣言できる
      欠点: 番号と種類の 2 軸になり、 宣言順が優先という規則が区画の行に何を意味するかを別に決める要が出る (DR3)
      欠点: 行の形に key が 1 つ増え、 読み手 (doctor・別 project の画面) は名と key の 2 つを見て種類を知る (DR3)
      欠点: 持ち主の呼び名は Tier9 で、 名で決めれば 1 語で足りる
    verdict: rejected
    reason: "決め手は分析 (番号と種類の 2 軸になる)。"
  - id: "OPT3"
    name: "区画を宣言せず、 群の外の席として置く"
    text: |
      区画の仕組みを作らず、 休ませる置き場を群の外に置いたままにする。 決め手は分析 (群の外の席も口座を占める)。
      （平易）区画の仕組みを作らず、 休ませたい置き場を群の外に置いたままにする案です。 器を変えず、 群の仕組みにも触れない点で勝ります。 けれども、 群の外の席の口座は他の席の選び方から外れるので、 やはり口座を占めます。 口座の残りが尽きかけても移らず、 口座の替えは人の手に残ります。 候補を行に並べた口座に絞ることも表せません。 置き場が表に無いので、 非公開の隣の repo の数えに群の表の置き場として入らず、 表のどの行にも無い置き場として doctor に数えられます。 退けました。
      利点: 器を変えず、 今の読み手のまま動く
      利点: 群の仕組みに一切触れない
      欠点: 群の外の席の row の口座は他の席の session 用の選定から外れる (FR1036) ので、 口座を占める (DR1)
      欠点: 群の外の席は口座が逼迫しても移らず、 口座の替えが人の手に残る
      欠点: 候補を行が並べた口座に絞る制限を表せない (DR5)
      欠点: 置き場が群の表に無いので、 隣の private repo の数え (FR1080) と群の外の anchor の数え (FR1073) で群の表の置き場として扱えない
    verdict: rejected
    reason: "決め手は分析 (群の外の席も口座を占める)。"
  - id: "OPT4"
    name: "区画の移る線を群の逼迫の閾値にする"
    text: |
      OPT1 と同じ区画を作り、 移る条件の線だけを群の逼迫の閾値の rules 行 3 本 (5 時間窓・7 日窓・モデル別窓) にする。 決め手は分析 (選定の規則と別の線で口座を替え、 移り先を選ぶ線と食い違えば往復する)。
      （平易）選んだ案と同じ区画を作り、 移る条件の線だけを群の逼迫の線 (5 時間・7 日・model 別の 3 本) にする案です。 告げる線と移る線が揃い、 告げられた席が移る点で勝ります。 けれども、 口座の選び方の決まり (R-C9-1) と別の線で口座を替えることになります。 移り先も群の逼迫の線で選べば往復は起きませんが、 その形でも別の線で替えることは変わりません。 移り先をいまの選び方で選ぶ形では、 群の逼迫の 5 時間の線 (いまの値 85) が選び方の線 (いまの値 95) より低いので、 選ばれた移り先もその線以上でありえ、 移った先ですぐ移り直す往復が起きえます。 退けました。
      利点: hook が告げる線と移る線が揃い、 告げられた席が移る
      利点: 群と区画で逼迫の読みが 1 つになる
      欠点: 選定の規則 (R-C9-1) と別の線で口座を替えることになる (DR4・C9.2)。 移り先も群の逼迫の閾値で選ぶ形にすれば往復は起きないが、 その形も R-C9-1 と別の線で口座を替える
      欠点: 移り先を session 用の選定で選ぶ形では、 群の逼迫の閾値の 5 時間窓の行 (今の値 85) が session 用の閾値 (今の値 95) より低いので、 選ばれた移り先もその線以上でありえ、 移った先ですぐ移り直す往復が起きうる (DR4)
    verdict: rejected
    reason: "決め手は分析 (選定の規則と別の線で口座を替え、 移り先を選ぶ線と食い違えば往復する)。"
