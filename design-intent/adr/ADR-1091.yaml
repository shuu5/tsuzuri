# 判断の記録 ADR-1091 — 器 scribe2 の判断の記録 ADR-0091 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1091
title: "群の表の名 Tier9 の行は群でなく park の区画で、 口座を占めない — 区画は群の今の口座・種・予約・群の移動の判定・移動を頼む記録を持たず、 どの口座選定からも口座を除かず、 席は行が並べた口座からの session 用の選定の口座に居て、 park の移り先の判定が口座を返した周だけ移る (ADR-1069 の群の名の句と ADR-1049 の便用の row の除外の範囲を部分 supersede)"
status: accepted
date: 2026-09-29
context: |
  群は宣言した置き場の席を群の今の口座 1 つに集め、 その口座を占める。 席は残すが日々は動かさない repo を置く場所が無く、 群に入れても群の外に置いても口座を占めていた。 本 ADR は群の表の名 Tier9 の行を、 口座を占めず pipeline を妨げない park の区画と決める。
  なぜこの判断が要るのかを、 経緯 (群は口座を 1 つ占める)・事象 (休ませる置き場の行き場が無い)・持ち主の裁定・要件書の側・憲法の向き・この判断の範囲の 6 つから説明します。 群に入れても、 群の外に置いても、 休ませたい置き場は口座を占めていました。 憲法の向きには、 行に並べた口座の宣言を、 その口座を使うことの前もっての承認と読む解釈も含みます。
  CTX1 経緯 — 群は口座を 1 つ占める
  ADR-1049 は席の口座を持つ単位を project の群とし、 群の宣言 (名・置き場の列・候補の口座の列) を host の面の表 1 つに置き、 群の今の口座（かたまりがいま使う口座）を host の根の記録 1 件で持つと決めた。 群の置き場の席はどの置き場からでも群の今の口座に居て、 便用の口座選定は群の口座を host 全体で候補から外す (ADR-1049 の群の候補の口座の全部は、 ADR-1068 で群の今の口座だけになった)。 ADR-1069 は群の名を Tier<数字> (数字は重複しない・宣言順は数字の昇順) に固定し、 移り先を残量の鍵で並べ、 群を宣言順に見て群ごとの予約を導く形にした。 群の移り先と予約は他の群の今の口座を避け、 群の移動の判定は host の lock の内側で撃つ (ADR-1066)。 こうして群は口座を 1 つ占め、 他の群の移動と便の選定はその口座を使えない。
  CTX2 事象 — 休ませる置き場の行き場が無い
  席は残すが日々は動かさない repo の置き場が無い。 群に入れると、 その群が口座を 1 つ占め、 他の群の移り先と予約と便の選定からその口座が外れる。 群の外に置くと、 席の登録 row の口座（席の登録の口座）が他の席の session 用の口座選定から外れる (FR1036 の、 自席の鍵の外の登録 row の除外) ので、 やはり口座を占める。 群の外の席は群の移動の判定の外に在り、 口座が逼迫しても管理 tick（周期で席を見回る仕事） は row の口座のまま起こし直すだけで移さず、 heartbeat の合図も既定で届く。 今の読み手は群の名の形 (Tier と先頭に 0 の無い数字・昇順) だけを見るので、 Tier9 の行を宣言すると群として読まれ、 口座を 1 つ占める。 当座は、 休ませたい置き場を群から外し、 口座の替えは人が手で行っている。
  CTX3 裁定 — 口座を占めず、 pipeline を妨げない
  持ち主は 2026-09-28T01:55Z に、 名 Tier9 の置き場を口座を占めない特別な置き場として器に載せ (便を撃ってよく、 他の群の移り先にも使ってよい)、 heartbeat の合図の既定を off にするよう指示した。 02:00Z には論点 4 つ (名 Tier9 をこの置き場に予約する・予約も排他もせず口座は session 用の口座選定で決める・heartbeat の明示の記録・行ごとの既定) を推奨で決着した。 2026-09-29T00:54Z には、 判断の要る点を推奨で進めるよう常設で指示した。 05:01Z には、 この置き場は pipeline を妨げず、 他の Tier と違って口座を占めないことを再び確かめた。 05:44Z には、 席の口座の候補を行が並べた口座だけにすると決めた。 要旨だけを写し、 逐語は台帳が持つ (記録は memo s2-07l.730)。
  CTX4 要件の側 — SRS v0.30 が区画の手を FR1095 に集めた
  SRS v0.30 は park の区画（口座を占めない休ませ場所）の手を新しい FR1095 に集め、 FR1038 に群の表（かたまりを宣言する表）の名の句 (Tier1〜Tier9 に限り、 Tier9 の行は park の区画) と、 群の手 (逼迫の通知・移動を頼む記録・移動・予約) は群だけに掛かる句を置いた。 FR1057 は群の表の名の断りを host の面の読みの断りの列に置く。 FR1036 は park の区画の置き場の席の row の口座を便用と session 用の除外に入れず、 session 用の閾値（候補にできる使用率の上限）の rules 行は今は R-C9-1 の 1 本で、 窓別の行は user 裁定で足す枠として FR1036 に在る。 FR1059 は区画の席の起動の口座を引数か FR1095 の候補からの選定で決め、 FR1027 は管理 tick の周に park の移り先の判定（区画の席の移り先の決め方）を撃たせ、 FR1044 は器の差し込みの閉じた一覧に park の区画の移動の退避の合図を入れる。 FR1073 は doctor が数える登録 row の anchor の件数を、 群の表のどの行 (群と park の区画) の anchor にも無いものに限り、 FR1080 は隣の private repo と可視性を問う anchor を群の表の行 (群と park の区画) の anchor から導く。 区画の heartbeat の既定 (off) は FR1078 が持ち、 本 ADR の外に在る。 SRS の glossary は、 修飾の無い「群」を Tier1〜Tier8 の行の群だけに限る。
  CTX5 憲法の向き (本 ADR の解釈)
  A1 (使う): Tier9 の行が並べた口座の宣言を、 その口座を「使う」ことの常設の承認と読む (ADR-1049 の群の宣言と同じ形)。 区画の席の移り先は席の起動と同じ session 用の口座選定 (FR1036) で決まり、 起動の口座選定が承認 event を書かないのと同じく、 区画の移動も承認 event を書かない。 群の移動が群の今の口座の記録を書き換える周に承認 event を書くこと (ADR-1049) は変えない。 移った事実は管理 tick の判定行 (次の周で上書きされる) と、 起こし直し (FR1059) が event log に記帳する席の登録に残る。 この読みは裁定 02:00Z (口座は session 用の口座選定で決める) と 05:44Z (候補は行が並べた口座だけ) に沿い、 裁定 00:54Z の下で推奨のまま決めた。 N3 (host 固有の値で分岐しない): 器が分けるのは名 Tier9 という器の文法が固定する名で、 どの置き場を区画に置くかは host の面の宣言値のまま (C10.2) なので、 名を host 固有の値とは読まない。 C2 (選定は 1 本の関数): 区画の席の口座は既存の session 用の口座選定 1 本を、 候補を行が並べた口座に絞って呼ぶだけで、 選定の関数を足さない。 行が群か区画かは名から導く閉じた 2 種で決まる。 C9.2 (R-C9-1 の選定規則に従って口座を窓の終わりまで使う): 区画の席が移る線を選定と同じ session 用の閾値の rules 行に置く。 C17 (決定はしご): 区画を表すのに新しい表・key・rules 行・記録を足さず、 足す仕組みは park の移り先の判定 1 本で、 消すのは休ませたい置き場の口座を人が手で替える手順である。
  CTX6 射程 — 動かすのは 4 つ、 群の仕組みは動かさない
  動かすのは (1) 群の表の名の句 (Tier1〜Tier9 に限り、 Tier9 の行を park の区画にする)、 (2) 区画の置き場の席の row の口座を便用と session 用の除外に入れないこと、 (3) 区画の席の起動と起こし直しの口座と park の移り先の判定 (row の口座が同じ間は移り先が変わっても退避の合図を重ねないことを含む)、 (4) 区画の席の hook の告げ方と doctor の kind=park の行、 の 4 つ。 動かさないのは、 群の今の口座の記録と種・残量の鍵・群の予約と排他・群の移動の判定と契機と lock・群の移動の承認 event・退避の合図と猶予 (ADR-1079)・起こし直しが会話 id を運ぶこと・便用の並べ鍵・閾値の rules 行の値・doctor の群の行の欄・宣言の表の数 (群の表 1 つのまま)。 heartbeat の決め方は本 ADR の外に在る。
  （選択肢を測るものさし）この判断を評価する 5 本のものさしです。 口座を占めないこと。 pipeline (群の移動と便の流れ) を待たせないこと。 種類を 1 語で読め、 宣言の形と仕組みを増やさないこと。 口座の選び方の決まりと同じ線で移り、 移った先ですぐ移り直す往復をしないこと。 席の口座の候補を行に並べた口座だけにすること。
  DR1｜口座を占めない — 区画は口座の記録も予約も持たず、 どの選定からも口座を除かない CTX2・CTX3
  DR2｜pipeline を妨げない — 区画の手は host の lock を取らず計測を起こさず、 群の移動と便を待たせない CTX1・CTX3
  DR3｜種類を 1 語で読め、 宣言の形と仕組みを増やさない — 名で種類が決まり、 区画を表すのに表・key・rules 行・記録を足さない (C2・C17) CTX5
  DR4｜選定の規則の線で移る — 移る線と移り先を選ぶ線を、 選定の規則 (R-C9-1) の session 用の閾値の rules 行に揃え、 移った先ですぐ移り直す往復も起こさない (C9.2) CTX5
  DR5｜候補は行が並べた口座だけ — 区画の席は宣言の外の口座へ、 引数で名指されない限り行かない CTX3
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 群を宣言する表の行の名を Tier1〜Tier9 に限り、 Tier9 の行を区画とします。 区画は口座の記録も予約も持たず、 行に並べた口座と区画の席の口座はどの選び方からも外れません。 席は行に並べた口座から選んだ口座に居て、 見回りの周に、 記録の上で線以上になった周だけ移ります。 支えるのは FR1095 (区画) と、 FR1038・FR1036・FR1027・FR1059・FR1073・FR1080・FR1044・FR1057 の区画に掛かる句で、 どれもこの判断が中身を決める側 (主張) です。
  採用 — OPT1
  群の表 (host の面) の行の名 SHALL Tier1〜Tier9 に限り、 Tier1〜Tier8 の行を群、 Tier9 の行を park の区画とし、 Tier1〜Tier9 の外の名・数字の重複・宣言順が数字の昇順でない面 SHALL host の面の読み (FR1057) で断る (fail-closed)。 優先 SHALL 宣言順のまま。 park の区画 SHALL 群の今の口座の記録・種・群の予約・群の移動の判定・移動を頼む記録を持たず、 区画の行が並べた口座と区画の置き場の席の row の口座 SHALL 便用と session 用の口座選定・群の移り先・群の予約のどれからも除かれない。 区画の行が並べた口座の宣言 SHALL A1 の「使う」の常設の承認と読む。 区画の置き場の席の起動の口座 SHALL 口座の引数が在ればその口座 (行が並べた口座の外でも)、 無ければ行が並べた口座だけを候補にした session 用の口座選定の口座とし、 候補が無い周 SHALL FR1069 の語で断る。 管理 tick の周 SHALL park の移り先の判定を撃ち、 判定 SHALL row の口座の計測の記録の最新値が session 用の閾値の rules 行 (FR1036) のいずれか以上の周だけ、 行が並べた口座から row の口座を除いた session 用の口座選定の口座を返し (候補も記録の最新値だけで選び、 鮮度の外の候補は数えない)、 記録が無いか鮮度の外の周と候補が無い周は返さない。 判定が口座を返した周だけ席 SHALL 群の移動と同じ退避の合図 (FR1044 の差し込みの 1 つ) と、 窓が shell に戻った周の起こし直し (直前の会話 id を運ぶ) でその口座へ移り、 row の口座が同じ間の退避の合図 SHALL NOT 移り先が周ごとに変わっても窓が shell に戻るまでの周に重ねて送らず、 候補が無い周 SHALL 判定行に理由 park-no-candidate を出す。 窓が shell に戻った区画の席の起こし直しの口座 SHALL 判定が返せばその口座、 返さなければ row の口座とし、 起こし直し SHALL 同じ判定の結果を使う。 区画の手 SHALL NOT 計測を起こさず、 host の lock を取らず、 群の今の口座の記録と承認 event を書かない (移り先は席の起動と同じ session 用の口座選定で決まり、 移った事実は管理 tick の判定行 (次の周で上書きされる) と、 起こし直し (FR1059) が event log に記帳する席の登録に残る)。 席自身の hook SHALL 区画の席でも row の口座の使用率が群の逼迫の閾値の rules 行 3 本のいずれか以上の周に指示文の 1 行で告げ、 移動を頼む記録を置かない。 doctor の区画の行 SHALL kind=park を持ち、 今の口座・next・断りの欄を - で出し、 群の行は kind を持たない。 隣の private repo の数えと可視性を問う anchor (FR1080) と、 群の表のどの行の anchor にも無い登録 row の anchor の数え (FR1073) SHALL 区画の行を群の表の行として扱う。 区画を表すために新しい表・key・rules 行・記録 SHALL NOT 足さない。 群の手 (逼迫の通知・移動を頼む記録・移動・予約・残量の鍵・種) SHALL 変えない。
  （平易）群を宣言する表の行の名は Tier1〜Tier9 に限り、 Tier1〜Tier8 の行を群、 Tier9 の行を park の区画とします。 それ以外の名・同じ数字の重複・数字の小さい順でない並びの表は、 読む時点で断ります。 優先は宣言の順のままです。 区画は、 群がいま使う口座の記録・その種・予約・群の移動の判定・移動を頼む記録を持ちません。 区画の行に並べた口座と区画の席の口座は、 便と席の口座の選び方・群の移り先・群の予約のどれからも外れません。 行に並べた口座の宣言は、 その口座を使うことの前もっての承認と読みます。 区画の席を起こす口座は、 名指しがあればその口座 (行に無くても)、 無ければ行に並べた口座だけから選んだ口座で、 候補が無ければ決まった語で断ります。 見回りの周には区画の移り先の判定を撃ちます。 判定は、 いまの口座の使った割合の最新の記録が選び方の線のどれか 1 つ以上のときだけ、 行に並べた他の口座から選んだ口座を返し、 記録が無い・古い・候補が無いときは返しません。 返したときだけ、 席は群の移動と同じ退避の合図と、 画面が shell に戻った周の起こし直し (直前の会話の続きから再開する。 会話の記録そのものは写さない) で移ります。 いまの口座が同じ間は、 移り先が周ごとに変わっても、 退避の合図を画面が shell に戻るまで重ねて送りません。 候補が無ければ理由の語を出します。 画面が shell に戻った席は、 判定が返せばその口座、 返さなければ席の記録にある口座で起こし直し、 起こし直しは同じ判定の結果を使います。 区画の手は新しく測らず、 host の鍵を取らず、 群の記録と承認の記録を書きません (移り先は席の起動と同じ選び方で決まり、 起動も承認の記録を書かないため)。 移った事実は見回りの判定の行 (次の周で上書きされる) と、 起こし直しが残す席の登録の記録に残ります。 区画の席の hook は、 群の逼迫の線のどれか 1 つ以上になった周に 1 行で告げますが、 移動を頼む記録は置きません。 doctor の区画の行は kind=park を持ち、 今の口座・次の口座・断りの欄は - です。 群の行は kind を持ちません。 非公開の隣の repo の数えと、 表のどの行にも無い置き場の数えでは、 区画の行も表の行として扱います。 区画を表すために新しい表・欄・規則の表の行・記録は足さず、 群の仕組みは変えません。
  （理由）持ち主の要求は、 休ませる置き場が口座を占めず pipeline を妨げないことでした。 群に入れると口座を 1 つ占め、 群の外に置いても席の口座が他の席の選び方から外れて占めるので、 どちらの置き方でも要求に届きません。 そこで、 群と同じ表に並べつつ群ではない種類を 1 つ足し、 口座の記録も予約も持たせず、 どの選び方からも口座を外さないことにしました。 種類を名 Tier9 で決めたのは、 持ち主の呼び名がそれで、 読み手が 1 語で種類を知れ、 欄や表を足さずに済むからです。 欄を足す案は番号と種類の 2 軸になり、 宣言の順の意味を別に決める要が出ます。 代わりに群は 8 本までになり、 Tier10 以上は宣言できません (欄を足す案はこの上限を持ちません)。 区画の席の口座は既にある選び方 1 本を、 候補を行に並べた口座に絞って呼ぶだけにし、 選び方を増やしません。 候補を行に並べた口座に絞るのは持ち主の裁定で、 宣言の外の口座へは名指しでしか行かないためです。 移る線を選び方と同じ線にしたのは、 まず口座の選び方の決まり (R-C9-1) の線で口座を替えるためで、 群の逼迫の線で移ると、 選び方が選んだ移り先もその線以上でありうるので、 移った先ですぐ移り直す往復も起きうるからです。 移るかを記録だけで決め、 新しく測らず host の鍵も取らないのは、 群の移動と便を待たせないためです。 行に並べた口座の宣言をその口座を使うことの前もっての承認と読むのは、 群の宣言 (ADR-1049) と同じ形の宣言で、 持ち主の裁定 (口座は席を起こすときと同じ選び方で決める・候補は行に並べた口座だけ) に沿うからです。 群は同じ前もっての承認の下でも、 群のいまの口座の記録を書き換える移動ごとに承認の記録を書きます。 区画はその記録を持たず、 移り先は席の起動と同じ選び方で決まり、 席の起動はその選び方で承認の記録を書かないので、 区画の移動も移るたびの承認の記録を書きません。 移った事実は見回りの判定の行 (次の周で上書きされる) と、 起こし直しが残す席の登録の記録に残します。 記録が古いと移らないこと、 告げる線と移る線が別で告げられても移らない周があること、 区画の席と他の席が同じ口座に並びうること、 doctor の行が 1 種増えること、 移るたびの承認の記録が残らないことは、 その代償として引き受けます。 群の仕組みそのものは変えないので、 群の移動・予約・種の決まりはそのまま働きます。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1095（claim）: FR1095 (park の区画) の決定の側。 区画が群の今の口座・種・予約・群の移動の判定・移動を頼む記録を持たず口座をどの選定からも除かないこと、 起動の口座、 park の移り先の判定 (session 用の閾値の rules 行のいずれか以上・記録の最新値だけ・計測を起こさない・lock を取らない)、 row の口座が同じ間は移り先が変わっても退避の合図を重ねないこと、 退避と起こし直しの口座、 A1 の読み (行が並べた口座の宣言を常設の承認と読む) と移る周に承認 event を書かないこと (移り先は席の起動と同じ session 用の選定で決まる)、 hook の告げ方、 doctor の kind=park を本 ADR が決める。 AC1063 の (b) (c) (d) はこの決定を測る。
  FR1038（claim）: FR1038 の群の表の名の句 (Tier1〜Tier9 に限り、 Tier9 の行は park の区画・外の名と重複と昇順でない面の断り) と、 群の手は群だけに掛かる句の決定の側。 ADR-1069 の群の名の句を置き換える。 AC1063 の (a) はこの決定を測る。
  FR1036（claim）: FR1036 の便用と session 用の除外に区画の置き場の席の row の口座を入れないことと、 区画の席の選定の候補を FR1095 (行が並べた口座) に置くことの決定の側。 ADR-1049 の便用の row の除外の範囲を狭める。
  FR1027（claim）: FR1027 の管理 tick が、 自席の置き場が区画に属する周に park の移り先の判定を撃ち、 窓が shell に戻った区画の席の起こし直しの口座を FR1095 で決めることの決定の側。 群の移動の判定 (ADR-1066) の契機と lock は変えない。
  FR1059（claim）: FR1059 の席の起動が、 区画の置き場の席の口座を引数か行が並べた口座からの session 用の選定で決め (群の今の口座との不一致の断りは群だけに掛かる)、 候補が無い周を FR1069 の語で断ることの決定の側。
  FR1073（claim）: FR1073 の doctor の host-guard の行が数える、 群の表のどの行の anchor にも無い登録 row の anchor の件数で、 区画の行を群の表の行として数える決定の側。 区画に置いた置き場は宣言された置き場で、 漏れとして数えない。 AC1063 の (f) はこの決定を測る。
  FR1080（claim）: FR1080 の公開の字面の走査が、 隣の private repo と可視性を問う anchor を群の表の全ての行 (群と区画) の anchor から導く決定の側 (区画に置いた repo も隣の private repo に数える)。 ADR-1078 の「群の anchor」の範囲の読みを与える。 AC1063 の (e) はこの決定を測る。
  FR1044（claim）: FR1044 の器の差し込みの閉じた一覧に、 park の区画の移動 (FR1095) の退避の合図を入れる決定の側。 区画の席は群の移動と同じ退避の合図で移り、 差し込みの形を新しく足さない。
  FR1057（claim）: FR1057 の host の面の読みが拒む行のうち、 群の表の名が Tier1〜Tier9 の外か数字が重複するか宣言順が数字の昇順でない行の断りの決定の側 (断りの範囲は FR1057 が持つ)。 名の断りは、 FR1057 に link する AC1041 (数字の重複を含む) と、 FR1038 を経る AC1063 の (a) が測る。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録は 2 本の決定記録を一部だけ置き換えます。 ADR-1069 からは群の名の句 (Tier と重複しない数字なら幾つでもよい) を Tier1〜Tier9 に限る形へ、 ADR-1049 からは便に口座を渡すときに外す席の口座の範囲を置き換えます。 群そのものの決まり (群の今の口座・予約・移動・種・移動の承認の記録) は変えません。 ADR-1078 は置き換えず、 書かれた時点で表の行が全て群だったので、 その「群の anchor」を区画の anchor も含めて読みます。 行き着く原則は「休ませる置き場は口座を占めず、 他の置き場の流れを待たせない」です。
