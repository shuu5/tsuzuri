    text: |
      群の表の行の名を Tier1〜Tier9 に限り、 Tier9 の行を群でなく park の区画とする。 区画は群の今の口座の記録・種・予約・群の移動の判定・移動を頼む記録を持たず、 行が並べた口座と区画の席の row の口座をどの選定からも除かない。 席の口座は引数か、 行が並べた口座だけを候補にした session 用の選定で決め、 管理 tick の周に park の移り先の判定 (row の口座の記録の最新値が session 用の閾値の rules 行のいずれか以上の周だけ口座を返す・計測を起こさない・lock を取らない) が口座を返した周だけ移る。 行が並べた口座の宣言を A1 の常設の承認と読み (ADR-1049 の群の宣言と同じ形)、 移り先は席の起動と同じ session 用の選定で決まるので、 起動と同じく移る周に承認 event を書かない。 hook は告げるが移動を頼む記録を置かず、 doctor の行は kind=park を持つ。 決め手は分析 (群の仕組みに触れず、 区画を名 1 語で読める)。
      （平易）群を宣言する表の Tier9 の行を、 群ではない park の区画にする案です。 区画は、 いま使う口座の記録も、 次に移る口座の予約も持ちません。 行に並べた口座も区画の席の口座も、 群の移り先・便・他の席の選び方から外れないので、 口座を占めません。 区画の席は、 口座を名指されればその口座に、 名指されなければ行に並べた口座から選んだ余裕のある口座に居ます。 見回りの周に、 いまの口座の使った割合の記録が選び方と同じ線以上のときだけ別の口座を選んで移り、 そのとき新しく測ったり host の鍵を取ったりしません。 行に並べた口座の宣言は前もっての承認と読み、 移り先は席の起動と同じ選び方で決まるので、 起動と同じく移るたびの承認の記録は書きません。 代わりに、 群は 8 本までになり、 記録が古いと移らず、 告げる線と移る線が違うので告げられても移らない周があり、 区画の席が他の席と同じ口座に並びえます。 doctor の行が 1 種増えるので外の読み手に知らせる要があり、 移った事実は承認の記録でなく、 見回りの判定の行 (次の周で上書きされる) と、 起こし直しが残す席の登録の記録から読むことになります。 分析で選びました。
      利点: 区画は口座の記録も予約も持たず、 どの選定も区画の口座を使えるので、 口座を占めない (DR1)
      利点: 区画の手は lock を取らず計測を起こさないので、 群の移動と便を待たせない (DR2)
