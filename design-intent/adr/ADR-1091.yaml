retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「席」は人と AI が話す 1 つの session、 「便」は契約 1 本を実装から着地まで運ぶ 1 回の走り、 「口座」は席や便が使う Claude Code の login 単位、 「群」は同じ口座を共有する project のかたまりです。 群は自分の席をいま使う口座 1 つに集め、 その口座を占めます。 席は残しておくが日々は動かさない repo を置く場所が無く、 群に入れても群の外に置いても口座を占めていました。 この記録は、 群を宣言する表の名 Tier9 の行を、 群ではない「park の区画」と決めます。 区画は口座を占めず、 どの口座の選び方からも口座を外さず、 群の移動や便を待たせません。 区画の席は、 名指した口座か、 行に並べた口座から選んだ余裕のある口座に居て、 いまの口座の使った割合が線以上になった新しい記録があり、 移り先の候補がある周だけ、 別の口座へ移ります。 行に並べた口座の宣言は、 群の宣言と同じく、 その口座を使うことの前もっての承認と読みます。 移り先は席を起こすときと同じ口座の選び方で決まるので、 席の起動が承認を記録しないのと同じく、 移るたびの承認も記録しません。 要件書では、 区画の要件 FR1095 と、 表の名・口座の選び方・見回り・席の起動・doctor の数え・公開の見張り・席の入力欄への差し込み・host の宣言の読みの要件 (FR1038・FR1036・FR1027・FR1059・FR1073・FR1080・FR1044・FR1057) を支えます。
