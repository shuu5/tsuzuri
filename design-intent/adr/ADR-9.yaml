# 判断の記録 ADR-9 — 指し示し（発効 2026-09-27・持ち主の裁定 user 2026-09-27T05:44Z・記帳先 = tsuzuri の台帳 t3-hub.1 notes）
# 討論の記録は docs/grill/2026-09-27-H-pointing.md。
id: ADR-9
title: 持ち主は画面の一部や画像を一言と一緒に席へ渡せるようにし、最初の版は 3 つの取り込み方で始め、指摘は承認として数えず、画像は host の中だけに置く
status: accepted
date: 2026-09-27
context: |
  裁定面は、席が用意した問いに持ち主が答える形である。持ち主は「用意された入力欄では言えない指摘」も渡したいと要望した。アプリやエラーの画面の画像と、アプリの特定の部分を囲って文脈として渡す機能で、remote の端末から席の host へ届くことが条件である。
  今の席は ssh と tmux の中に居て、remote の端末から画像を貼れない。持ち主は画面の場所を言葉で説明するしかない。
  席は ADR-5 の形で端末の Chrome に CDP の通り道を持つ。CDP には要素を選ぶ口と範囲を撮る口と、画面と DOM を同じ瞬間に写す口が在る（host の Chrome で確かめた）。器には待ちの席へ固定の 1 行を送る口が在る。
decision: |
  (1) 裁定面に「指し示しの欄」を置く。持ち主は画像と囲みと一言を 1 件の指摘として送る。指摘の id は面の server が発行する。
  (2) 最初の版の取り込み方は 3 つ。(ア) 席が表示面の今の画面と DOM の写しを同時に取り、持ち主が裁定面の上で囲む (イ) 持ち主がアプリの窓の上で要素を click するか範囲を drag する（CDP の要素を選ぶ口と範囲を撮る口・1 回で元に戻す）(ウ) 持ち主が画像を貼るか落として囲む。
  (3) 次の版に回すのは、端末の画面を直接取り込む方法と、配信の窓で囲む方法。
  (4) 指摘が運ぶのは、一言・全体の画像・囲みごとの切り抜き・頁の文脈・囲みの中の要素の素性（上限つき）・直前の異常。要素の素性は DOM を持つ出所のときだけ。入力欄の値は伏せる。
  (5) 囲みから要素への対応は、DOM の写しの上の純粋な関数で導く。頁が後で変わっても解ける。
  (6) 画像と DOM の写しは state dir に置き、版管理と台帳の remote へ出さない。自動では消さず、消すのは A-1 の問いで行う。
  (7) 指摘は承認として数えず、問いを閉じない。台帳には bead 1 本を置き、反映されていない要望として未反映の一覧に載せる。席は指摘ごとに処分を宣言する。
  (8) 席へは裁定と同じ 2 経路で届ける（待ちの席へは器の固定の 1 行・考え中の席は停止の hook）。hook は一言と切り抜きの path と要素の要約を注入し、画像は席が path で読む。
  (9) アプリの頁に道具の帯を注入する形と、端末側に常駐の道具を置く形は採らない。
options:
  - id: a
    name: 裁定面の指し示しの欄と 3 つの取り込み方
    text: 決定 (1) から (9)。
    verdict: adopted
    reason: CDP の口と browser の貼り付けが既に在り、足すのは欄と純粋な関数と置き場だけで済む。アプリの DOM を汚さない。
  - id: b
    name: アプリの頁に道具の帯を注入する
    text: 席が CDP で頁に script を入れ、頁の中の button で指す。
    verdict: rejected
    reason: 開発中のアプリの DOM と配置を汚し、歯と干渉する。
  - id: c
    name: 端末側に常駐の道具
    text: 端末に画面の取り込みの道具を入れる。
    verdict: rejected
    reason: ADR-5 の決定 (4) が端末側の常駐の agent を作らないと決めている。
basis: [P-7, P-12, P-19, A-1, N-1, N-5, N-6, ADR-5, ADR-7]
retreat:
  kind: spike
  condition: 要素を選ぶ口が app mode の窓と ssh 越しの CDP で動かないと試作で分かったら、取り込み方 (イ) を外し (ア) と (ウ) だけで始める。
plain: |
  画面の一部や画像を、一言と一緒に席へ渡せるようにします。決定の画面に「指し示しの欄」を足します。
  渡し方は 3 つです。席が今の画面を撮ってあなたが囲む、アプリの上で直接指すか囲む、撮った画像を貼って囲む、です。
  席には、囲んだ部分の画像と、そこに在る部品の情報が届きます。
  指し示しは承認としては数えません。画像には個人の情報が写ることがあるので、席の機械の中だけに置きます。
  この記録はあなたの承認で発効しています。承認の記帳先は tsuzuri の台帳です。
