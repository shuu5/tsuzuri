  - id: "chosen"
    name: "自 repo への branch push と PR 作成は憲法 A4.2 の「出す」ではない (A4.3 の可逆)"
    text: |
      決めることは 3 つです。 「出す」とは何か、 では機械はどうやって見分けるのか、 そして今回は決めない範囲はどこかです。
    verdict: adopted
    reason: "器の記録が採った決定（字は決定の欄・器の記録の §2）。文脈の要約: 自分の repo に枝を押して「見てください」の札 (PR) を立てる操作に、 これまで人の承認を要求していました。 憲法を読み直すと、 承認が要るのは取り消せない操作だけで、 この操作は取り消せます。"
  - id: "i"
    name: "現状維持 (1 便 1 承認)"
    text: |
      案 (i) 現状維持 (1 便 1 承認): 却下。 利点は実在する——承認 event が残るので「誰が何を許したか」の記録が便ごとに揃い、 判定を間違える余地が無い (安全側へ倒れる)。 ただし却下の理由は条の違反ではない——A4.2 は「不可逆なら聞け」という下限であって、 可逆な操作について聞くことを禁じてはいない。 却下する理由は運用の実測にある: 承認が安く大量に要求されると儀式化し、 不可逆な操作の前で止まる機能そのものが薄まる (§1 の実測: 同日 3 便で 6 回)。 A4.3 が自 repo への dispatch を可逆と名指したのは、 まさにこの摩耗を避けるためである。
    verdict: rejected
    reason: "利点は実在する——承認 event が残るので「誰が何を許したか」の記録が便ごとに揃い、 判定を間違える余地が無い (安全側へ倒れる)。 ただし却下の理由は条の違反ではない——A4.2 は「不可逆なら聞け」という下限であって、 可逆な操作について聞くことを禁じてはいない。 却下する理由は運用の実測にある: 承認が安く大量に要求されると儀式化し、 不可逆な操作の前で止まる機能そのものが薄まる (§1 の実測: 同日 3 便で 6 回)。 A4.3 が自 repo への dispatch を可逆と名指したのは、 まさにこの摩耗を避けるためである。"
  - id: "ii"
    name: "--pr-cmd の文面や remote の URL から自 repo かを機械が判定する enforcer"
    text: |
      案 (ii) --pr-cmd の文面や remote の URL から自 repo かを機械が判定する enforcer: 却下。 利点も実在する——自己申告に頼らず「repo の外へ出るか」を機械が測れるので、 名乗り間違い (§3 Negative) を塞げる。 しかし remote の解決は道具側にあり (seam に渡るのは sh -c の 1 行で、 push 先を決めるのは道具である)、 core は道具を知らない設計を採っている。 ここで文面を parse すると、 器が道具の方言を追いかける実装を抱え込み、 道具を変えた日に静かに誤判定する。 ∴ 判定の面は次の版の enforcer (A4 機構欄) へ置き、 本 ADR は範囲の解釈だけを確定する。
    verdict: rejected
    reason: "利点も実在する——自己申告に頼らず「repo の外へ出るか」を機械が測れるので、 名乗り間違い (§3 Negative) を塞げる。 しかし remote の解決は道具側にあり (seam に渡るのは sh -c の 1 行で、 push 先を決めるのは道具である)、 core は道具を知らない設計を採っている。 ここで文面を parse すると、 器が道具の方言を追いかける実装を抱え込み、 道具を変えた日に静かに誤判定する。 ∴ 判定の面は次の版の enforcer (A4 機構欄) へ置き、 本 ADR は範囲の解釈だけを確定する。"
  - id: "iii"
    name: "憲法 A4.2 の「出す」の範囲を条文へ明文化する"
    text: |
      案 (iii) 憲法 A4.2 の「出す」の範囲を条文へ明文化する: 却下。 利点は最も強い——解釈を ADR に置くより条文に置いた方が、 読む側は 1 か所で完結する。 しかし憲法条文の改訂は A2 の user 裁定の手続きを要し、 かつ A4.3 がすでに「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」と答えている。 答えの在る条へ言葉を足す改訂は、 手続きの費用に見合う情報を増やさない (同じ内容が 2 か所に載り、 片方が古くなる面が生まれる)。 ∴ 解釈の記録で足りる。
    verdict: rejected
    reason: "利点は最も強い——解釈を ADR に置くより条文に置いた方が、 読む側は 1 か所で完結する。 しかし憲法条文の改訂は A2 の user 裁定の手続きを要し、 かつ A4.3 がすでに「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」と答えている。 答えの在る条へ言葉を足す改訂は、 手続きの費用に見合う情報を増やさない (同じ内容が 2 か所に載り、 片方が古くなる面が生まれる)。 ∴ 解釈の記録で足りる。"
