# 判断の記録 ADR-1008 — 器 scribe2 の判断の記録 ADR-0008 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1008
title: "自 repo への branch push と PR 作成は憲法 A4.2 の「出す」ではない (A4.3 の可逆)"
status: accepted
date: 2026-09-10
context: |
  自分の repo に枝を押して「見てください」の札 (PR) を立てる操作に、 これまで人の承認を要求していました。 憲法を読み直すと、 承認が要るのは取り消せない操作だけで、 この操作は取り消せます。
  憲法 A4.2 は「操作が不可逆 (destroy / publish / 追加課金) のとき」だけ C7 の対話面で先に確認せよと定め、 A4.3 は「merge・自 repo への dispatch・依存なしの code 変更は A4.2 の目的において可逆と扱う」と定める。 一方 pipeline の設計 doc は --pr-cmd を「公開の口」と呼び、 前提に「run に承認 event が在る」を足していた (§5.4)。 加えて §5.5 は「3 クラスの判定は契約の自己申告に加え、 seam の使用からの導出を 1 つ持つ」と定めていた。 これは ADR ではなく実装時の設計裁定 (2026-09-10) である。
  この読みの下で、 自 repo (すでに公開されている本 repo) へ branch を push して PR を出すだけの便が「出す」に分類され、 1 便ごとに人の承認を消費していた (記録時点の実測: 同日 3 便で承認 6 回)。 承認が安く大量に要求されると、 承認そのものが儀式化して「本当に不可逆な操作の前で止まる」機能が薄まる——A4.2 が守ろうとしているのはその機能である。 ∴ 「出す」の範囲を条の解釈として確定する必要がある。 本 repo の作法は憲法条の解釈が要る便は実装前に ADR を書くと定めるので、 ここへ記録する。
decision: |
  決めることは 3 つです。 「出す」とは何か、 では機械はどうやって見分けるのか、 そして今回は決めない範囲はどこかです。
  本 ADR は A4.2 の「出す」(publish) の範囲の解釈だけを記録する。 憲法本文・rules 表・SRS はいずれも書き換えない (A4.3 が既に答えているため、 解釈で足りる)。
  §2.1 自 repo への PR は「出す」ではない
  自分の repo に枝を押して PR を立てるのは、 どちらも後から閉じられるので「出す」に含みません。 一方、 非公開のものを公開に切り替えることや、 外へ送ることは「出す」のままです。
  憲法の語釈は「出す (public 化・外部送信)」である。 本 ADR が確定するのはその裏側だけ——自 repo への branch push と PR 作成は A4.3 の「自 repo への dispatch」として可逆であり、 Ask-first の対象外である (MUST NOT be gated on approval)。 可逆性の根拠は機構にある: この形は main を 1 byte も動かさず、 branch も PR も後から閉じられる——A4.3 が merge を可逆と呼ぶのと同じ理由で、 merge の手前の操作も可逆である。
  「出す」に含まれるものは条の語釈のとおりで、 本 ADR はそれを 1 つも減らさない: public 化 (可視性を private から public へ反転する操作・repo の公開設定を含む) と外部送信 (他 repo への push、 外部サービスへの送信、 release / tag の公開、 公開 URL の発行)。 この列挙は語釈の例示であって網羅ではない——判定に迷う操作は「取り消せるか」で決め、 取り消せないなら A4.2 の側へ倒す (fail-closed)。
  本 repo が既に PUBLIC であることは判定を変えない。 PR は公開 repo の中で起こる出来事で、 可視性を反転させないからである。 ⚠ PUBLIC 面の情報を増やす便は依然として Ask-first である——それは衛生規則ではなく A1 の義務であり、 本 ADR の射程外として1 文字も緩めない (逐語・host 名・口座名を tracked file へ書かないという規律も同様に不変)。
  §2.2 機構 — 判定は契約の自己申告だけ
  機械は「この便は消す / 出す / 使うに当たる」と契約が自分で名乗った分だけ止めます。 道具を使ったかどうかから推測するのはやめます。
  --pr-cmd は承認 event を前提としない (MUST NOT require)。 本 ADR が廃止するのは設計 §5.5 の「seam の使用からの導出」であり、 判定の面は憲法 A4 の機構欄が定めるとおり契約の自己申告 (classes) + rules 行の deny list のままである (deny list は未着——記録時点の rules manifest に 3 クラスの deny 行は 1 本も無い)。 本 ADR は「出す」の範囲だけを扱い、 「消す」「使う」の判定には触れない。 導出を残せない理由は、 それが操作の可逆性ではなく道具の名前で止めていたことにある——同じ seam に他 repo へ push する道具を渡しても、 自 repo へ PR を出す道具を渡しても、 導出は同じ判定を出す。 ∴ 正しく止まる形にはならない。
  classes に publish を名乗る契約は従来どおり spawn の手前で Blocked となり、 承認 event を受けるまで進まない (SRS FR1015 / FR1016・AC1005 は不変)。 承認の受理面 (C7 の対話面・逐語を event へ記帳する) も ADR-1005 のまま変えない (supersede しない)。
  §2.3 射程外
  この記録は範囲の読み方だけを決めます。 憲法の文そのものを直すことも、 機械が操作の中身を見て判定することも、 ここでは決めません。
  次は本 ADR の決定ではない (MUST NOT be read as such): 憲法条文の改訂 (A2 の手続きを要する・本 ADR は条文を 1 文字も変えない)、 操作の中身から 3 クラスを判定する enforcer の実装 (A4 の機構欄・次の版)、 push 先が自 repo かを機械が弁別すること (remote の解決は道具側にあり core は道具を知らない・MVP は自己申告)、 「出す」以外の 2 クラス (消す / 使う) の範囲 (本 ADR は publish の範囲だけを扱う)。
