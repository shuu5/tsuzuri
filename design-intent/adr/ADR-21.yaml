# 判断の記録 ADR-21 — folio の持ち込みの依存の一覧を承認し、規則の行 R-2 の許しの一覧に 1 つの条件を足す（発効 2026-09-29・持ち主の裁定 t3-hub.67.29 と決め直しの t3-hub.67.30・記帳先 = tsuzuri の台帳の問いの notes）
# 判断の記録 ADR-18 の決定 (5)（依存の一覧は持ち込みの時に 1 回承認）を folio について行う。規則の行を緩める変更なので、条 P-17.4 と A-2.3 の反対側からの検証を前置した。
# 検証の記録は docs/grill/2026-09-29-N-license-list-grill.md（独立の検証役の記録と設計席の処分）。検証が最初の問いの前提の誤りを見つけたので、持ち主に決め直しを問うた（t3-hub.67.30）。
id: ADR-21
title: folio の持ち込みで入る依存の一覧を承認し、外せる部品は外して、規則の行 R-2 の許しの一覧には外せない圧縮の道具の名の条件だけを足す
status: accepted
date: 2026-09-29
context: |
  判断の記録 ADR-18 の決定 (5) は、持ち込む code への規則の行 R-2 を最初は除外の表で持って段ごとの便で外し、依存は持ち込みの時に一覧で 1 回、持ち主の承認を取ると決めた。folio の持ち込む木は folio2 の本流（今 0c910db）の直しの後の先頭である。
  folio の依存の錠の file（Cargo.lock）には、今 folio を除いて 35 本の部品が在る。直接は 2 本（命令の引数の読み手（clap）の版 4 と、YAML の読み手（yaml-rust2）の版 0.10）、間接は 33 本（うち 2 本は Windows 用）。ほかに図の道具（vendor/archify・版 2.16.0・条件 MIT）と、それを動かす node（版 18 以上・図を描く命令の時だけ）が入る。35 本の条件の欄（Windows 用 2 本は crates.io の記録）のうち、R-2 の許しの一覧（MIT・Apache-2.0・Unicode-3.0・CC0-1.0・BSL-1.0）で満たせないのは 2 本である。文字の符号の変換の部品（encoding_rs・版 0.8.41）は三条項の条件（BSD-3-Clause）も要り、表の鍵の散らしの部品（foldhash・版 0.1.5）は圧縮の道具の名の条件（Zlib）だけである。
  最初の問い（t3-hub.67.29）は 2 本とも外せないと書き、持ち主は一覧に 2 つの条件を足す推奨を選んだ。反対側からの検証が、この前提の誤りを見つけた。表の鍵の散らしの部品は外せない。YAML の読み手が使う順序つきの表の部品（hashlink）が、既定の散らしの機能を固定で引く。文字の符号の変換の部品は、YAML の読み手の既定の機能（encoding）だけが引く任意の部品で、folio は file を文字列で読み、符号を判じる口（YamlDecoder）を使わない。検証役の写しで既定の機能を切ると（folio の manifest の 2 行）、その部品とそれだけが引く 8 本の計 9 本が消えて外の部品は 35 本から 26 本になり、歯は全部の 1182 本が通った。
  最初の問いは、tsuzuri の今の依存の錠の file（外の部品 184 本）が既に R-2 と食い違っていたことも書いていなかった。圧縮の道具の名の条件だけの部品が 5 本在る（const_format・const_format_proc_macros・konst・konst_macro_rules・slotmap）。どれも面の crate の Leptos が引き、面の外の部品の一覧の承認（t3-hub.1）の時に、条 A-3.1 の条件の照らしが抜けていた。CI が cargo deny を撃たない（条 P-26.5 の機構の注）ので見えなかった。
  圧縮の道具の名の条件は、出所を偽らないことと、変えた写しにその旨を示すことと、中身の写しから表示を消さないことを求め、組み立て物に表示を写す義務は無い。tsuzuri の許し（MIT OR Apache-2.0）で配ることを妨げない。tsuzuri は今、組み立て物を配らない（workspace の manifest の publish = false）。
  設計席は決め直しの問い（t3-hub.67.30）を出し、文字の符号の変換の部品を外して圧縮の道具の名の条件だけを足す形を推奨した。部品を減らすのも条 A-3.1 の確認の対象なので、この問いの答えがその確認を兼ねる。
decision: |
  (1) folio の持ち込みの依存の一覧を承認する。範囲は、直接 2 本（命令の引数の読み手・YAML の読み手）と、文字の符号の変換の部品を外した後の錠の file が解く間接 24 本（うち 2 本は Windows 用）と、図の道具（vendor/archify・版 2.16.0）と、実行の時の node（版 18 以上）である。承認は、持ち込む先頭の錠の file の部品の名の集合と条件の欄が、検証役の写しの 26 本と同じであることを前提にする。持ち込みの便は、その先頭の錠の file の名の集合と条件の欄の差を、決定 (4) の読み方で評価して節に添える。名か条件が増えたら、その分は承認の外とし、足す部品として条 A-3 の確認に出す。版だけが上がり条件の欄が同じ部品は承認の内とする。
  (2) 文字の符号の変換の部品は、持ち込みの前に folio2 の直しの便で外す。直しは folio の manifest の YAML の読み手の 2 行（通常と組み立ての依存）で既定の機能を切り、錠の file を書き直すだけで、folio の code は変えない。持ち込む commit はその直しの着地の後にする。外した部品は、YAML の読み手の版上げか、根の workspace に入った後にほかの crate が YAML の読み手を既定の機能で引くと、機能の合わせで黙って戻る。そこで、錠の file にその部品が無いことを見る歯を、持ち込みの後の行（t-carry-ex か k-join-folio）で置く。歯が着地するまでは、持ち込みの便の評価（決定 (1)）と依存を増減する commit の手の評価（決定 (7)）で見る。これは ADR-18 の決定 (5) の既定の道（外せるものは外す）のとおりで、条 A-3.1 の減らす確認は決め直しの答え（t3-hub.67.30）で満たす。
  (3) 規則の行 R-2 の値の許しの一覧に、圧縮の道具の名の条件（Zlib）だけを足し、6 つにする。三条項の条件（BSD-3-Clause）は足さない。行の裁定の欄に 2 つの裁定 id を足し、時刻を決め直しの裁定の時刻にする。予算の部分（直接依存の本数・1 PR に足せる本数・増分 check の差）の字は変えない。
  (4) 許しの一覧の読み方と範囲。範囲は行 R-2 の欄（population）に書く。予算の部分は core（面の crate は行 R-25）、許しの一覧は tsuzuri の repo が組み立てる crate の依存の全部（通常・組み立て・開発の時の依存と、全部の target・持ち込んだ folio を含む）である。条件の式（SPDX）の「または（OR）」は一方が一覧に在れば満たし、「かつ（AND）」は全部が一覧に在るときだけ満たす。条件の欄の無い部品と、式の読めない部品は満たさないとする。図の道具（条件 MIT）は一覧の内で満たす。部品でない実行の環境（node）は数えの外とし、この 1 回の承認で持つ。
  (5) 面の crate が前から引いていた圧縮の道具の名の条件の 5 本は、面の外の部品の承認（t3-hub.1）の時の照らしの漏れで、同じ commit の一覧の変更で訂正する。これは一覧を緩める利益には数えない（足す理由は、外せない表の鍵の散らしの部品である）。
  (6) 組み立て物を配る（公開の版を出す）ことにしたら、その前に、許しの一覧の条件が求める表示を配る物に写す仕掛けを置く。今は配らないので置かない。
  (7) 監査は条 P-26.5 のとおり CI の cargo deny で行う。今の CI は撃たない。cargo deny を CI に置く仕事は、計画（surface-plan）の 6 節の folio の持ち込みの段落に後の行（k-deny）として持ち、許しの一覧の写しはその行で R-2 の値から作る。計画だけの行は足さない（行 R-33 の上限ちょうど）。その行が着地するまでは、依存を増やすか減らす commit と持ち込みの便で、席が錠の file を決定 (4) の読み方で手で評価する。
options:
  - id: a
    name: 外せる部品を外し、R-2 の許しの一覧に圧縮の道具の名の条件だけを足す
    text: 決定 (1) から (7)。
    verdict: adopted
    reason: 緩める幅が条件 1 つで済み、持ち込む外の部品が 9 本減る。足す条件は、YAML の読み手を使う限り外せない部品のためで、決定はしご（条 P-27.1）の「要るか」を通る。外せる部品を外すのは ADR-18 の決定 (5) の既定の道で、除外の表の行も要らない。歯は既定の機能を切った写しで全部通った。持ち主は決め直しの問いでこの形を選んだ（t3-hub.67.30）。
  - id: b
    name: 最初の答えのまま、2 つの条件を足す
    text: 文字の符号の変換の部品を残し、R-2 の一覧に三条項の条件と圧縮の道具の名の条件を足して 7 つにする。
    verdict: rejected
    reason: 三条項の条件を要る部品は、manifest の 2 行の直しで 0 本になる。使わない部品のために一覧を広げると、後で同じ条件の部品が版上げで間接に入っても一覧の判断を通らない。撤退条件（要る部品が 0 本になったら外す）が、外した時に必ず当たる。
  - id: c
    name: 持ち込みの後に外し、それまで三条項の条件は除外の表で持つ
    text: 文字の符号の変換の部品は持ち込みの後の tsuzuri の便で外し、それまでは ADR-18 の除外の表に 1 行を置く。
    verdict: rejected
    reason: 直しは folio の code を変えない manifest の 2 行なので、持ち込みの前に入れても等しさの確かめ（ADR-18 の決定 (2)）はそのまま使える。除外の行と、それを外す便が 1 つずつ増える。
  - id: d
    name: 一覧を承認しない（持ち込みを止める）
    text: folio を持ち込まず、組み立ての版を固定した外の道具として使い続ける。
    verdict: rejected
    reason: ADR-4 と ADR-18 の合流の線を止める。足す条件は 1 つで緩く、止めるほどの害が無い。
basis: [P-26, P-17, P-27, A-2, A-3, R-2, R-25, R-33, ADR-18, ADR-3, ADR-4]
grill:
  when: 2026-09-29
  who: 検証役（AI・Opus・独立の文脈・読み取りと写しの組み立てだけ）
  where: docs/grill/2026-09-29-N-license-list-grill.md
  summary: 独立の検証は条件付きの支持で、最初の問いの前提の誤り（外せる部品を外せないと書いた）と、三条項の条件を足す利益が耐えないことを重く挙げた。ほかに、面の既存の食い違いの扱い・一覧の範囲の字・ADR-18 の既定の道との合い方・検証と裁定の順・撤退条件の数え方・監査の便の不在を挙げた。設計席は持ち主に決め直しを問い、その答えで外せる部品を外して圧縮の道具の名の条件だけを足す形にし、ほかの論点も全部採った。
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、持ち込みの控え（t3-hub.67）の notes に 1 件ごとに記帳する（日付・材料・当たった条件）。数える時は、依存を増やすか減らす commit と、持ち込みの便である。数え方は、錠の file の外の部品ごとに manifest の条件の欄を決定 (4) の読み方で評価する（監査の後の行の着地の前は席の手の script・着地の後は CI の cargo deny）。問う相手は持ち主。
    (1) 持ち込む先頭の錠の file か、その後の依存を増減する commit の錠の file に、6 つの一覧で満たせない条件の部品が 1 本でも在れば（文字の符号の変換の部品が残るか戻った場合を含む）、その部品を条 A-3 の確認に出し、決定 (1) と (2) を持ち主に問う。
    (2) 依存を減らす commit の後で、圧縮の道具の名の条件を要る部品が repo の依存の全部で 0 本になったら、その条件を一覧から外すか（締める向きの変更）を持ち主に問う。
    (3) 圧縮の道具の名の条件の部品の中身の許しの file に、欄の式に無い義務が見つかったら（人の審査で見る）、決定 (3) を持ち主に問い直す。
plain: |
  folio を tsuzuri に持ち込むと、folio が使う外の部品と、図を描く道具と、それを動かす node が一緒に入ります。その一覧を承認した記録です。
  最初の問いでは「2 本の部品は外せない」と書きましたが、1 本（文字の符号の変換の部品）は設定の 2 行で外せると分かりました。持ち込む前に外すので、部品は 35 本から 26 本に減ります。
  部品の「使ってよい条件」は tsuzuri の規則の一覧に 5 つあります。外せないもう 1 本のために、圧縮の道具の名の条件だけを足して 6 つにします。作った人の名前の表示を残せば自由に使える緩い条件です。
  画面の部品がこの条件の部品を前から 5 本使っていたのに一覧に無かったので、その漏れもこれで直します。依存を自動で監査する仕組みは後の仕事で置き、それまでは部品を増減するたびに席が手で確かめます。
  この記録はあなたの 2 つの答え（最初の問いと決め直しの問い）で発効しています。承認の記帳先は tsuzuri の台帳の問いです。
approval:
  who: 持ち主
  date: 2026-09-29
  ruling: t3-hub.67.29（裁定 id = t3-hub.67.29:20260929T1025Z-1・束 batch:20260929T1025Z-1・依存の一覧と圧縮の道具の名の条件）・t3-hub.67.30（裁定 id = t3-hub.67.30:20260929T1132Z-1・決め直し）・notes に逐語
  verbatim: どちらも推奨でよい／推奨で良い
  surface: R-8
note: 逐語は t3-hub.67.29 の束と t3-hub.67.30 の字の順。規則の行 R-2 の値と範囲の欄と裁定の欄と時刻、計画（surface-plan）の 6 節の段落（依存の一覧の文と後の行 k-deny）を同じ commit で直す。文字の符号の変換の部品を外す直しは folio2 の便で、持ち込む commit の前に着地させる（決定 (2)）。
