# 判断の記録 ADR-77 — 前文の条の順位の 1 位「場当たりの修正の禁止」に、条 P-10 と条 P-4 の改めで規範文と機構を与える（第 1.7 版）
# 第 2 稿は係 w393a（2026-10-07・係 w387a の第 1 稿を検証役 v391 の grill の直す物の全部と席の決めで直した）。検証役 v391 の所見は docs/grill/2026-10-07-ADR-77-grill.md、項ごとの直しの対応は起草の置き場の notes。
# 改めの欄（amends）は写しで tz check --emit-amends が出した物を貼った（anchor v1.6 との欄単位の差と 1 対 1）。
# 持ち主の裁定 t3-hub.92.10.1 で発効（2026-10-07・案 甲と推奨の値の全部）。行 R-3 の字は行 77-4 の着地の commit で、作法の行 D-11 の廃止は行 77-0 の着地の後に当てる（決定 (4)(6)）。D-14 は決定 (6) の「行 77-0 の着地の後」より前に、この発効の commit で足した（条 P-10 の relations・決定・produced が D-14 を名指し、封の前に実在が要る・77-0 を待つ訳は廃止の D-11 が写しに残る事で D-14 の足しに当たらない・D-11 と並んでも要の写しは上限の 6,000 byte に収まる・席の決め）。
id: ADR-77
title: 前文の条の順位の 1 位「場当たりの修正の禁止」に、条 P-10 と条 P-4 の改めで規範文と機構を与え、同じ型の落ちを契約の直しでも bead の替えでも数えから外さず、回数に達した行と期日を過ぎた型の流し直しを構造の札の無い限り断り、bead をまたぐ再発で器が構造の memo を起こし、停止線と撤退と構造の直しの効きの測りを器と tsuzuri の道具の中に置く（第 1.7 版）
status: accepted
date: 2026-10-07
context: |
  持ち主は 2026-10-07 に、席が目の前の物を場当たりに直す事は scribe v1 から繰り返し禁じてきた事で、そのための憲法なのに守られていないので、憲法とそれを席に徹底させる所から直すべきだと求めた（発話 2026-10-07T01:20:02.909Z・要旨と在りかは memo t3-hub.92.10 の notes 2026-10-07T01:22Z・逐語はここに写さない）。同じ日に新しい機能の便を止めるライン停止を決め（同 notes 2026-10-07T01:20Z）、役割の分け方は案 B（席は 1 つのまま、機械的な手は器へ、調べと照らしは既存の係へ、席は対話・決め・承認・採否）に決めた（同 notes 2026-10-07T01:42Z）。完全技術版の検討は memo t3-hub.80 の notes 2026-10-07T01:05Z。
  抜け（調べ係 r386 の §3・印 V は係が読んで確かめた・D は記録から・I は見立て）。
  ・抜け（G1） 規範文の無い価値: 「場当たりの修正の禁止」は前文の順位の字にだけ在り、語の定義も規範文も機構も無い（constitution.yaml:173-176 の mechanism kind none・V）。前文は schema で規範文を持てない（constitution.yaml:29-36・V）ので、値に規範を持たせるには条の側に置く。
  ・抜け（G2） 席を縛らない数え: 行 R-3 の欄 same_failure は「契約か節を変えた後の不合格は同じ種類に数えない」（rules.yaml:50・V）。器の受付の同型の停止は、先頭の便の材料の契約と節が今回と同じ字の時だけ断る（scribe2/crates/scribe2/src/pipe/cli/intake.rs:1106-1135 の fn exclude_same_kind・断りの型は pipe/refuse.rs:201-210・V）。数えの鍵は同じ bead の連続なので、契約を直すか、型の違う落ちを挟むか、bead を替えると数えが外れる（intake.rs:1110-1124・V）。
  ・抜け（G3） 数える落ちが狭い: 同型の停止が数えるのは審査の FAIL の型（FindingKind）だけで、gate・終端の門・受付の断り・便の問い・席の止めは型で数えない（intake.rs:1110-1124・V）。
  ・抜け（G4） 機械の面の無い所: 前文（none）・条 P-27（human-review）・作法の行 D-5・D-7・D-10・D-11（human-review）（V）。
  ・抜け（G5） 注入で足りない: 席の手元に注がれていた順位の 1 行（contracts/seat/brief.txt:2）と D-11（同 :41）は効かなかった（D）。
  ・抜け（G6） 測る口の無い撤退: 撤退の kind が measure の判断の記録 66 本のうち 65 本が「数えるのは席」（V）。日次の測り（first_run_landed_3d ほか）は repo の外の席の道具（eval_daily.py:720）で、閾値も知らせも持たない（V）。
  ・抜け（G7） memo が行にならない: D-11 は起票まで。構造の直しの memo（t3-hub.87.33.2・t3-hub.74.49.12）が行にならないまま同じ型が再発した（D）。
  ・抜け（G8） 停止線が無い: 2026-10-06T09:00Z 以後に初めて起きた便 59 本の 1 本目の着地は 32 本（54%）で、前の 7 日は 91%（memo t3-hub.92.10 の本文・D）。
  今回の失敗の数え（調べ係 r385 の §1 の #10・#11・D）: 席は同じ便を審査の FAIL のまま流し直し、streak 4 が 1 本（t3-hub.92.7.24）・streak 3 が 4 本（t3-hub.89.19・92.3.1・92.7.14・92.6.4）で、5 本とも契約を場当たりに直すたびに器の数えが戻って止まらなかった。席は 25.4 時間に便を 26 回止め、123 回直に commit した（同 #9・#10）。write-set の閉包の落ちは、器の判断の記録 ADR-0045 の観点 CTX3 の便の問い 20 件が 20 件ともこの型で、2026-10-06〜07 にも別の bead で同じ型が再発した（memo t3-hub.92 の notes 2026-10-07T00:49Z・D）＝bead をまたぐ同じ型の再発で、bead ごとの数えには一度も掛からない。
  持ち主の前の裁定（この記録が覆す物）: 2026-09-16 の器の裁定（user 2026-09-16T05:53Z）は、器の設計 §23 (2) に「契約か節のどちらかが変わっていれば通す（焼き直しは書き直し）」を置き、lens の verdict の揺れを訳に、材料不変の再 intake を 1 回も許さない形を採らなかった（scribe2/docs/design/contract-source.md:223-224・V）。2026-09-29 の tsuzuri の裁定（t3-hub.67.10:20260929T0609Z-1）は、「直した上での再挑戦は同じ失敗ではない」という考えで行 R-3 の same_failure に器の定義を写す案を採り、材料の条件を外す案を採らなかった（V）。どちらも、直した再挑戦は場当たりではない、という前提に立つ。上の数えはその前提が実際には外れた事を示す: 契約の直しは原因の構造を替えずに数えを 0 に戻す道として使われ（streak 3〜4 の 5 本）、同じ型は bead をまたいで続いた。前の裁定を保つ案（選ばなかった案 戊）は、bead をまたぐ数えと停止線だけを足して契約の直しによる数えの戻しを残す形で、裁定を覆さずに済むが、bead の中の場当たりの流し直し（5 本の形）は止まらない。
  前例: 前文の順位の 4 位「増殖の防止」は判断の規則だけで機構を持たなかったので、判断の記録 ADR-20 が機構を持つ条 P-28 を置いた（V）。1 位には同じ手当てが一度も無い（V）。
  最初に狙う構造の直し: write-set の閉包の落ち（契約が替える名の使い手が write-set の外に在る）。器の code の索引（.vessel.toml:37-43 の index-scip と index-roles）は答えを持っていたが、main の着地ごとに組まれず、preflight と設計係の材料に配線されていない（memo t3-hub.80 の notes の (2)・D）。
decision: |
  (1) 語「場当たりの修正」（同じ型の落ちをまた生む構造を替えずに目の前の物だけを直して通すこと）と「構造の札」と「壊れの札」を語彙の file に足す（vocabulary.diff.md の字）。
  (2) 条 P-10 の題を改め、規範文 P-10.2〜P-10.7 を足す（constitution.diff.md の §5 の字）。
  ・P-10.2 数え: 便の落ちと便を求めた受付の断りを閉じた型で記録し、契約か節の字の替えでも、別の型の落ちを挟んでも、行の着地まで累計で数える。preflight と契約の置きの断りは編集の時点の検査の口なので数えない（条 P-14 の向き）。数えの単位は行で、着地せずに閉じた bead の後に行 R-47 の窓のうちに write-set の交わる契約を持って起きた bead は前の bead と同じ行に数える（bead の替えで数えを外さない）。席が審査の前に止めた便の後に契約か節を替えた起こし直しも型「止めて書き直し」で数える。
  ・P-10.3 bead ごとの断り: 回数に達した行の起こし直しは、その落ちの型を狙い、その落ちの後に着地した構造の直しの行を構造の札（便の頭の 1 行「構造: <行 id>」）で名指さない限り器が断る。名指す先は台帳の行に限り（判断の記録は名指せない）、その行は欄に狙う型・出所の memo・落ちた便の id の列を持ち、器はその列がその型の落ちとして event log に在るかを照らす。札 1 つで通るのは 1 回で、回数を超えた行は札が在っても断る（P-10.1）。受け皿の型（other と unparsed）と便の問いの止まりはこの断りに数えない（lens の揺れと、問わせない契約への誘いを避ける）。
  ・P-10.4 停止線: 初回の着地の率が行 R-46 の線を下回るあいだ、器は構造の直しの行の便と壊れの札（「壊れ: <着地した行の id> <落ちの型>」）を持つ便のほかを断る。壊れの札は、名指す行の着地の後にその型の落ち（main の赤か gate の段）が event log に在り、便の write-set が名指す行の write-set と交わる時だけ通す。
  ・P-10.5 効き: 構造の直しの行の着地の後、行 R-47 の窓で狙う型の便あたりの率が着地の前の同じ長さの窓より下がらなければ、器が出所の memo を開き直す。前の窓のその型の落ちが下限（R-47 の値）に届かない時は判じない。
  ・P-10.6 bead をまたぐ数え: 同じ型の落ちが bead をまたいで R-47 の窓のうちに R-3 の回数に達したら、器が型と便の id の列を写した構造の memo を台帳に起こす（同じ型の開いた構造の memo が在れば便の id を足すだけ）。受け皿の型と便の問いの止まりもここでは数える。
  ・P-10.7 期日: 器が起こすか開き直した構造の memo が R-47 の窓のうちに行にならないあいだ、器はその型で落ちた行の起こし直しを断る。
  器の照らしは字面と記録の実在だけを見て中身の良し悪しを判じず、開き直しは memo の状態を開くだけで、直すかと何で直すかは決めない（条 P-19.2）。名指せる行が無い時、席は便を起こさず持ち主に問う。器は持ち主の答えを札として読まない（今回だけの口を作らない・条 N-3.1）。持ち主の答えは、構造の直しの行を起こすか、規則の表の値を改める（条 P-17）かになる。断りの次の 1 手は「調べ係に型と再発を調べさせ、構造の直しの行を起こすか持ち主に問う」（条 P-7.3・案 B の調べを既存の係へ）。前文の text と kind は替えず、前文の機構の注を、規範文を持つ条（P-10・P-28）を名指し機構の在る無しを各条の mechanism の欄に預ける字にする。
  (3) 条 P-4 の題と縛る相手（binds）を実務（practice）から両方（both）に改め、規範文 P-4.2（撤退の条件が測りなら、鍵と比べの向きと閾値と窓で書く）と P-4.3（越えたら測りの道具が席の起動の合図と持ち主の対話面に出す）を足す（constitution.diff.md の §4）。向きは閉じた列挙（越える・下回る・前の窓より下がらない）で、前の窓より下がらないの閾値は前の同じ長さの窓の数の下限（届かなければ判じない）。閾値は判断の記録の撤退の欄に書き、承認の裁定がその値の裁定を兼ねる。欄 measure（鍵・向き・閾値・窓）を判断の記録の欄の決まりに足すのは床の実装の定数の改めで、行 77-8 が持つ。その着地までは撤退の条件の字に 鍵・向き・閾値・窓 の行を書く（この記録の撤退がその形）。
  (4) この記録は持ち主の前の裁定 2 つ（2026-09-16 の器の §23 (2)「焼き直しは書き直し」・t3-hub.67.10:20260929T0609Z-1 の「直した上での再挑戦は同じ失敗ではない」）を覆す。行 R-3 の欄 same_failure を、数えの単位を行（bead とその系譜）にし、契約か節の字の替えでも型の割りでも数えを戻さない字に替える（rules.diff.md の §1・K1）。R-3 の値（2 回）は替えない。字を替えるのは器の行 77-4 の着地の commit で、その commit で欄 ruling にこの記録の承認の裁定 id を足す。数えは 77-4 の着地の後の落ちから始める（過去の event を読み直して一度に止めない）。
  (5) 閾値の行 R-46（初回の着地の率の停止線・kind deny・stage in-loop）と R-47（効き・再発・期日の窓・kind detect・stage post）を足す（rules.diff.md の §2）。値は持ち主の裁定で決め（条 P-17）、推奨は R-46 が 70 %・窓は直近に初めて起きた便 20 本・届かない間は前の判じを保ち、判じの始めは行 77-7 の着地の時の席の手のライン停止の状態。R-47 が 7 日・効きの下限は前の窓のその型の落ち 3 本・後の窓の便が前の窓の半分に届かなければ窓を延ばす。率は器の event log から器の中の 1 本の関数で出す（repo の外の日次の測りを正本にしない）。
  (6) 作法の行 D-11 を廃止の状態にし（id は空けたまま・条 P-3.2・廃止の訳は器が構造の memo を起こす P-10.6）、作法の行 D-14（同じ種類の落ちが R-3 に達した行は、契約を直して起こし直さず、構造の直しの行を先に置くか持ち主に問う）を足す（rules.diff.md の §3・§4・K2）。当ては行 77-0 の着地の後。
  (7) 行の順（依存は後の行が前の行の code か数えを呼ぶ時と、同じ file に触る時）。行の名は 77-0〜77-8 とし、mechanism の live の値（M1 ほか）と字を重ねない（第 1 稿の M0〜M4 との対応は note）。
  ・第 1 段（並べる）: 行 77-0 folio の行（席の手元の写しの作法の行から状態 廃止 の行を外す・folio2/crates/folio/src/seat.rs:183-201 の fn discipline は status を見ないので、廃止の D-11 が席に注がれ続ける・V）。行 77-1 器の行（pipe/cli/intake.rs 1,480 行を割る）。行 77-2 器の行（pipe/dispatch.rs 1,459 行を割る）。行 77-3 器の行（pipe/refuse.rs 1,340 行を割る・77-4 が断りの枝を 3 つ以上足すと上限 1,500 行の 90% を越える見込み）。4 本は触る file が交わらない。上限の余地を型の束ねで避けず、足す行の前に割る（memo t3-hub.92.10 の候補 L4）。
  ・第 2 段: 行 77-4 器の行（P-10.2・P-10.3）: 落ちの記録に閉じた型を持たせ（審査の FAIL の型・gate の FAIL の落ちた段の名・終端の門の断り・便の問いの止まり（write-set の足しを求めた問いとほかの問いを枝に割る）・便を求めた受付の断り・止めて書き直し・条 P-1.6 の閉じた列挙）、数えを行の着地までの累計にし、行の系譜を write-set の交わり（intake.rs:1181 の fn exclude_overlap と同じ読み手）で照らし、fn exclude_same_kind の材料の字の比べの分岐を消し（K1）、構造の札と構造の直しの行の欄を受付が台帳と event log で照らす。数えは着地の後の落ちから。77-1 と 77-3 の後。memo t3-hub.92.10 の候補 （L1） と （L2） の前半の型の記録はこの行に入る。
  ・第 3 段（並べる）: 行 77-5 器と tsuzuri の行（最初に狙う構造の直し・memo t3-hub.92.10 の候補 L3）: 器が main の着地ごとに code の索引を組み、preflight が契約の替える名の使い手を索引から数えて write-set の外を断り、設計係の材料に索引の近傍と同じ file の過去の便の落ちた理由を出す。狙う型は write-set の閉包の落ち。77-4 の型の列挙の枝を呼び、同じ intake.rs の判定に触るので 77-4 の後（撤退 (6) の前の窓も 77-4 の型の記録から数える）。行 77-6 器の行（P-10.5〜P-10.7）: 器の memo の口（scribe2/crates/scribe2/src/ledger/memo.rs と pipe/dispatch/memo.rs）が、bead をまたぐ数えで構造の memo を起こし、構造の直しの行の効きを R-47 の窓で率と下限で照らして出所の memo を開き直し、期日を過ぎた memo の型の起こし直しを断りに入れる。77-4 の数えを読む。77-5 とは触る file が交わらない（交わりは起草の時に照らし直す・U）。
  ・第 4 段: 行 77-7 器の行（P-10.4）: dispatch が器の event log から初回の着地の率を 1 本の関数で出して R-46 の線と比べ、下回るあいだ構造の直しの行の便と壊れの札を持つ便のほかを断る。77-2 と 77-4 の後（札と行の欄の照らしを呼ぶ）。dispatch/memo.rs に触る 77-6 の後。memo t3-hub.92.10 の候補 （L2） の後半。
  ・第 5 段: 行 77-8 tsuzuri の行（P-4.2・P-4.3）: 判断の記録の撤退に欄 measure を足し床が鍵を測りの項の一覧と照らし、日次の測りを repo の中（tz）に移して越えを席の起動の合図と board に出す。77-4 の型の記録を読む。memo t3-hub.92.10 の候補 （L1） の後半（日次の型ごとの数と再発）はこの行に入る。
  memo t3-hub.92.10 の候補 （L1）・（L2）・（L3）・（L4）・（L5） はこれらの行に吸わせ、別に起こさない（K4）。
