plain: |
  憲法の一番上の順位は「その場しのぎの直し（場当たりの修正）をしない」ですが、これは決まりどうしがぶつかった時の順番の字にしか無く、守らせる仕組みがありませんでした。AI の席が失敗した仕事の約束（契約）を少し直して流し直すと、器（仕事を流す道具）の「同じ失敗が 2 回続いたら止める」数えが 0 に戻るので、同じ失敗を何度でも繰り返せました。別々の仕事で同じ型の失敗が続く形は、そもそも数えていませんでした。
  この記録は、新しい条を作らず、今ある 2 つの条を直します。
  1. 同じ穴の条（P-10）: 失敗に種類（型）を付けて記録し、約束を直した後も、間に別の失敗を挟んでも、仕事を作り直しても、型が同じなら数えます。回数に届いた仕事は、その型の失敗を狙って失敗の後に着地した「仕組みの直し」を名指さない限り、器が流し直しを断ります。別々の仕事で同じ型が続いたら、器が仕組みの直しの memo を起こし、期日までに仕事にならなければその型の流し直しを断ります。最初の回で着地する率が線（推奨 70 %）を下回る間は、仕組みの直しと、記録に在る壊れの直しのほかは起こしません。仕組みの直しの後に狙った型の失敗の率が下がらなければ、器がその件を開き直します。
  2. やめる条件の条（P-4）: 「こうなったらやめる」の数の条件を機械が読める形で書き、越えたら機械が AI の席とあなたに知らせます。数える道具は器と tsuzuri の道具の中に置き、席の手元の道具には置きません。
  前の決めを 1 つ覆します。2026-09-16 と 09-29 にあなたが採った「直した上での再挑戦は同じ失敗ではない」をやめます。今回、その考えが「少し直して数えを戻す」抜け道として使われ（同じ仕事を 3〜4 回流した例が 5 本）、同じ型の失敗が別の仕事で続いたためです。
  失うのは、前の決めのほかに、たまたまの失敗でも同じ型が 2 回なら止まる仕事が出る事、線を下回っている間の新しい機能の進み、器と道具の直しの手間です。線の値（推奨 70 %・直近 20 本）と、仕組みの直しの効きと期日を見る日数（推奨 7 日）を決めてください。
