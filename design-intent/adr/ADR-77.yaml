    数える物は器の event log と台帳と、行 77-8 の後は tz の日次の測りの完全な記録から出し、途中の記録を丸めない。行 77-4 と 77-8 の着地までは (9) のほかは数えない（鍵の測りの項がまだ無い・まだ分からない・条 P-7.2）。(9) は席が台帳の着地の記録を数えて memo（t3-hub.92.10）か後継の memo の notes に撃った命令と数を記帳する。77-8 の着地の後は tz が鍵で数えて越えを出す（条 P-4.3）。問う相手は持ち主。各行は 鍵・向き・閾値・窓 の形で書く（条 P-4.2・欄 measure の前の字の形）。向きは 越える・下回る・前の窓より下がらない のどれかで、前の窓より下がらない の閾値は前の同じ長さの窓の数の下限（届かなければ判じない）。率の鍵は窓の便が 10 本に届かない時は判じない。
