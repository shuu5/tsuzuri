  - {"target": "precedence", "field": "mechanism.note", "version": "v1.7", "previous_text": "判断の規則であって機械では検査できない。条の順位の 5 つは、scribe2 の前文の 3 つ（場当たりの修正の禁止 → 増殖の防止 → compile 速度）の 1 つ目と 2 つ目の間に、folio2 の前文から黙らないこと（速さより黙らない）と戻せること（賢さより戻せる）を挟んだもの。folio2 の前文の網羅より揃いは写していない（2026-09-24 に承認した順位の 5 つ・判断の記録 ADR-38）。", "new_text": "順位そのものは判断の規則であって機械では検査できない。1 位の場当たりの修正の禁止は条 P-10 が、4 位の増殖の防止は条 P-28 が規範文を持ち、その機構の在る無しは各条の mechanism の欄に従う（判断の記録 ADR-77・ADR-20）。条の順位の 5 つは、scribe2 の前文の 3 つ（場当たりの修正の禁止 → 増殖の防止 → compile 速度）の 1 つ目と 2 つ目の間に、folio2 の前文から黙らないこと（速さより黙らない）と戻せること（賢さより戻せる）を挟んだもの。folio2 の前文の網羅より揃いは写していない（2026-09-24 に承認した順位の 5 つ・判断の記録 ADR-38）。"}
