    verdict: rejected
    reason: "憲法 C2 が明示的に禁じる形である。 加えて注記は測れないので、 本 ADR が塞ごうとしている穴をそのまま残す。"
  - id: "D"
    name: "現状維持"
    text: |
      (D) 現状維持。 却下: 文書の 3 本 drift が残り、 C2 の充足が測られない状態が続く。 並びが静かにずれた周は、 段の実行順が変わっても誰も気づかない。
    verdict: rejected
    reason: "文書の 3 本 drift が残り、 C2 の充足が測られない状態が続く。 並びが静かにずれた周は、 段の実行順が変わっても誰も気づかない。"
