  surface: R-8
consequences:
  - "良い面は、 文書が古くなる余地が消えること、 そして「並びが実行順」という決まりが初めて機械で測られるようになることです。 悪い面は、 一覧を読みたい人がコードか実行結果を見に行く必要があること。 もうひとつ、 末尾の入れ忘れという穴が残ることです。 どちらも承知のうえで選んでいます。"
  - "Positive: 文書側に drift しうる列挙が無くなる (C1.2 の向き)。 C2 の充足のうち並びの正しさが 5 面すべてで測られる状態になる——記録時点まで、 並びを測る歯は 1 本も無かった (母集団 5 面)。 measure の増減で ADR を立てる必要が消え、 記録の増殖が減る (憲法の順位「増殖の防止」)。"
  - "Negative (受け入れるコスト): 列挙を知りたい読み手は現物 (判定行または実装) を見に行くことになる。 文書だけで完結しない。 pointer が指す先が動いた便では pointer の更新が要る (列挙の更新より頻度は低い)。"
  - "Negative (残る穴): §2.3 の末尾入れ忘れは、 rules::ALL に manifest 行を伴う場合を除きどの面も受けていない (実測)。 本 ADR は並びを測る面を足すが、 集合の完全性は測らない。 加えて §2.3 末尾のとおり、 判定行そのものが集合として pin されていない状態が当面続く。 どちらも塞ぐ面は別便である。"
note: |
  器の元の file: scribe2/design-intent/decisions/ADR-0013-machine-holds-enumerations-docs-hold-pointers.html
  器の記録の頭: Status: accepted · Date: 2026-09-11 · version 0.4.6 (拘束する constitution の版) · C1.2 / C2 の適用を記録 (C12.5 は帰結の参照)
  器の記録の前置き: 本 ADR は IETF RFC 2119 および RFC 8174 / BCP 14 に定義される MUST / SHALL / SHOULD / MAY のキーワード解釈規約に従う。 ADR は決定時点の記録であり、 改訂は新しい ADR による supersede で行う。
  器の却下案の節の要約: 4 つの案を退けました。 いちばん素直な「文書の一覧を今の数に直す」案は、 次の便で同じずれを作り直すだけです。 一覧を機械から自動生成する案は筋が通りますが、 生成の仕組みを 1 つ増やすぶん高くつきます。 並び順を文章で注記する案は決まりに反します。 何もしない案は、 ずれを抱えたまま「並びが実行順」を誰も測らない状態を続けることになります。
  器の記録の出所（Trace）:
  出所は、 実際に検査を走らせて出力を数えたことと、 並びを測る歯を書いて「無い状態では落ちる」ことを確かめたことです。 担保が無いと分かった件は、 別の便の審査で見つかりました。
  ・drift の実測 (2026-09-11・main = e892fdc): cargo xtask check の判定行を現物で数え、 文書側の列挙 (記録時点 11 本) との差を確認した。 判定行が並べる measure は 14 であった。
  ・C2 の充足が測られていないことの実測 (同日): (a)〜(c) の形を持つ面を全数で洗い出し (母集団 5 面 = CHECKS / VERDICTS / ALL / STAGES / KINDS)、 並びを判別子順と突き合わせる歯を検索して 0 本 / 5 面であることを確認した。 並び自体は 5 面とも正しかった——測る面が無いだけである。
  ・「末尾の入れ忘れを受ける面が在るか」の実測 (同日・本 ADR の §2.3 を書き直させた測定): 3 通りを現物で壊して撃った。 (i) Check に variant を足し CHECKS から落とす → 368/368 緑 (受けない)。 (ii) RuleKind を足し manifest 行も足して ALL を更新しない → rc 100 (受ける)。 (iii) 同じく行を伴わない → 368/368 緑 (受けない)。 §2.3 の初稿は「網羅 match と外形が受ける」と書いていたが、 (i) がそれを偽と示したので差し替えた。
  ・歯の flip の実測 (同日): (d) の歯を先に置いた木で cargo nextest run --workspace が rc 101 (述語が存在しない compile error = 機能不在) で落ち、 述語を置いた後に 368/368 で通ることを実測した。
  ・述語の非空虚性 (同日): 並べ替え・中間の欠番・重複の 3 つの壊し方で述語が偽を返すことを歯にした。 真を返すだけの述語ではない。
  ・判定行が集合として pin されていないことの実測 (2026-09-11・別便の review): xtask の歯は判定行に対し個別 token の contains のみで、 順序も token 集合も測っていないことが確認された。 §2.3 末尾の限界はこの実測に基づく。
