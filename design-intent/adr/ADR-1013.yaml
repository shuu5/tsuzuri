# 判断の記録 ADR-1013 — 器 scribe2 の判断の記録 ADR-0013 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1013
title: "列挙は機械が持ち文書は pointer だけを持つ (ADR-1006 の measure tag 列挙を supersede)。 C2「宣言順」の充足形は const slice の判別子順 pin"
status: accepted
date: 2026-09-11
context: |
  この器には「どの検査を、 どの順でやるか」の一覧が、 動いているコードと、 説明の文書の 2 か所にあります。 文書側の一覧は人が書き写したもので、 実際に動いている一覧より 3 つ少ないまま残っていました。 手で数えた一覧は必ず古くなります。 いっぽうコード側では、 一覧の並びがそのまま実行順になるという決まりなのに、 その並びが正しいことを機械が測っていませんでした。 どちらも「守られているはず」と思われていて、 誰も測っていなかった、 という話です。
  ADR-1006 §2.1 は cargo xtask check が measure する tag を列挙し (記録時点で 11 本)、 §2.2 は各 tag が測るものを 1 行ずつ並べた。 2026-09-11 の実測 (main = e892fdc・判定行の現物) では、 判定行が並べる measure は 14 であった。 文書側の列挙は 3 本ぶん drift していた。
  この drift は本件固有の事故ではない。 同じ形が独立に 2 度観測されている。 (a) measure を足す便の review が「文書の件数を直さないまま『本便で数え直した』と書いた」形を捕まえた。 (b) 設計文書の歯一覧が現物と 29 本ずれていることが記録された。 手で数えた列挙は必ず腐る——腐っても compile も CI も通るので、 腐ったことに気づく面が無い。
  憲法 C1.2 は「規則の文書は型と manifest から導出し、 手書きの規範行を 0 にする」と定める。 列挙を文書へ写す形はこの条と正面から衝突する。 列挙を「更新する」対処は、 次の便で同じ drift を作り直すだけである。
  別の面として、 憲法 C2 は「適用順は stage 列挙の宣言順だけから取り、 順序についての散文注記を持たない」と定める。 器はこれを「閉じた enum + 全 variant の const slice + 網羅 match」の形で実装しており、 記録時点で対象は 5 面ある (pipe::gate::CHECKS / pipe::gate::VERDICTS / rules::ALL / fleet::STAGES / fleet::KINDS)。 C2 が名指す「stage 列挙」に直接あたるのは fleet::Stage である。 ところが const slice の並びは手で書くので、 宣言順から静かにずれうる——ずれても compile は通り、 順序の注記は持たない方針ゆえ、 機械が測らなければ誰も気づかない。 記録時点で 5 面の並びはいずれも正しく、 それを測る歯は 1 本も無かった (母集団 = 上の 5 面)。
decision: |
  §2.1 列挙の SSOT は機械側に置き、 文書は pointer だけを持つ
  一覧の正本は動いているコードと、 それが出す実際の出力だと決めます。 文書は一覧を書き写さず、 「どこを見れば本物が分かるか」だけを書きます。 こうすると、 文書が古くなる余地そのものが無くなります。 項目が増えたり減ったりしても、 そのたびに新しい記録を立てる必要はなくなります。
  器 SHALL 列挙の SSOT を機械側 (型と、 それを写す外形) に置く。 design-intent の文書 SHALL NOT 列挙を写す。 文書 SHALL 「どこを見れば現物が分かるか」の pointer を持つ。 本件の pointer は cargo xtask check が出す判定行と、 それを組み立てる実装 (crates/xtask/src/check.rs の summary) である。
  本決定は ADR-1006 の次を supersede する: §2.1 (11 本の列挙)、 §2.2 (各 tag が測るものの列挙)、 §2.3 のうち「tag の増減は本 ADR を supersede する新 ADR で行う (MUST)」の規定と、 同節末尾の「ADR-1002 §2.6 (a) の 10 tag は本 ADR の 11 本に読み替える」という読み替え規定 (読み替え先の数が列挙であり、 現物と drift するため)。 文書が列挙を持たない以上、 measure の増減で差し替える列挙が存在しないためである。 measure の増減は通常の契約 (bead) で足りる (MAY)——ただし repo の「ADR を書く条件」に当たる便 (憲法条の解釈・外部依存・跨版契約・却下案を残す価値のある分岐) は従来どおり ADR を要する。 ADR-1006 §2.4 (ADR-1002 §2.2 の例示の訂正) は supersede しない——列挙ではなく実測の訂正記録だからである。
  §2.2 C2「宣言順」の充足形
  「並びがそのまま実行順になる」決まりを、 実際に守れている形として次のように定めます。 種類は閉じた型で数えきる。 全部の並びを 1 か所に書く。 場合分けは取りこぼしがあれば組み立てに失敗するようにする。 そのうえで、 並びが宣言した順のままであることを機械が測る。 最後の 1 つが今まで無かった部分です。
  器 SHALL 憲法 C2 の充足形を次の 4 つの対で持つ: (a) 閉じた enum (variant の集合を型が閉じる)、 (b) 全 variant を並べた const slice (この並びが適用順序である)、 (c) 網羅 match (variant の追加が compile error になる)、 (d) const slice の並びが判別子の昇順 (0, 1, 2, …) と一致することを測る歯。
  (d) の述語 SHALL crate 内に 1 つだけ置く。 3 面が別々の実装を持つと、 片方だけ緩む形で穴が開くためである。 述語は判別子の slice ではなく写像の関数を受け取り、 as を書く場所を呼び手の 1 行へ閉じる。
  記録時点の対象は 5 面である: pipe::gate::CHECKS (機械検証の段・並びが適用順序)、 pipe::gate::VERDICTS (gate の 3 値)、 rules::ALL (規則種別の母集団)、 fleet::STAGES (便の段・C2 が名指す「stage 列挙」)、 fleet::KINDS (event の種類)。 この 3 面という数を文書側の権威にしない (§2.1)——新しく (a)〜(c) の形を持つ面を足す便は、 同じ便で (d) の歯を足す (MUST)。
  §2.3 pin が捕まえない形 (実測で「受ける面が無い」と分かった穴)
  この測り方には、 はっきりした穴が 1 つあります。 種類を末尾に足して一覧へ入れ忘れた場合は見つけられません。 順番の入れ替え・重複・途中の抜けは見つかります。 穴を受け止める別の仕組みが既にあるのかどうかを、 実際に壊して確かめました。 結果は「ほとんどの面で受け止められていない」でした。 穴はこの記録では塞ぎません——塞ぐには別の道具が要ります。 わかった限界は、 主張と同じ場所に書いておきます。
  (d) の歯が捕まえるのは「並べ替え」「重複」「中間の欠番」である。 enum の末尾に足した variant を const slice へ入れ忘れた形は捕まえない——残りの判別子が 0..len に収まるからである。
  この形を受ける面が既に在るかを 2026-09-11 に実測した (結果は面ごとに異なる)。 rules::ALL では、 manifest 行を伴う追加だけが捕まる——行の kind は ALL を通して解決されるので、 ALL に無い variant の行は未知の kind として parse できず歯が落ちる (variant と行を足し ALL を更新しない木で rc 100 を実測)。 行を伴わない追加は捕まらない (同条件で行を外すと 368/368 が緑)。 pipe::gate の 2 面と fleet の 2 面では捕まらない (Check に variant を足し CHECKS から落とした木で 368/368 が緑)。 網羅 match は arm を書かせるが、 const slice への登録は強制しない。
  したがって「末尾の入れ忘れ」は、 rules::ALL に manifest 行を伴う場合を除き、 現時点でどの面も受けていない。 本 ADR はこの穴を塞がない (MUST NOT be read as closing it)。 塞ぐには「閉じた enum の variant 数と const slice の要素数の一致」を機械が測る面が要り、 stable Rust では derive macro (外部依存の追加 = A3 の承認事項) か、 構造検査側の text 面 (判別子ではなく宣言の字面を数える) のいずれかになる。 選択は別便で行う。
  本 ADR の記録時点のもう 1 つの限界: §2.1 が SSOT と定めた「判定行」は、 集合としても順序としても pin されていない。 構造検査の歯は判定行に対して個別 token の contains を当てるだけで、 token の集合も並びも測っていない (2026-09-11 実測)。 したがって §2.1 は「文書が列挙を持たない」ことは達成するが、 「機械側が列挙を守っている」ことの担保は現時点で個別 token の存在までである。 判定行を外形として pin する面は別便で入れる。 本 ADR はこの不在を知ったうえで決めている——担保が既に在るかのように書かない。
  §2.4 射程外
  この記録が決めるのは「一覧をどこに置くか」と「並びをどう測るか」だけです。 それぞれの検査が何を測るか、 上限の数値、 出力の書式は、 ここでは決めません。
  次は本 ADR の決定ではない (MUST NOT be read as such): 各 measure の実装と測定定義、 閾値の実値と置き場 (rules manifest と裁定 id が扱う)、 判定行の書式、 判定行を外形 snapshot として pin する面の設計 (別便)、 CI の job 構成。
