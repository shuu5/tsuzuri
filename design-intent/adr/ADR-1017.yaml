  器の却下案の節の要約: 6 つの案を退けました。 Rust の HTTP crate を足す案は依存 0 本の約束を破ります。 前の版の script の出力を読む案は、 前の版を器の判断の元にしてしまいます。 Claude Code が disk に残す cache を読む案は、 書き手と鮮度が器の外にあり出所が付きません。 残量だけ別 file に置く案は「fleet の状態は 1 つの file」に反します。 本当の口座名や path を manifest に書く案は公開 repo で禁じられています。 state dir の下を走査して口座を見つける案は、 真実を host ごとの dir に置くことになります。
