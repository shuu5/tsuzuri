    reason: "ADR-1017 §2.3 (真実は宣言・C3「per-host dir に真実を置かない」)。 dir が在っても宣言の無い口座は「無い」。 退役中の dir を除く判定が場所に依存する。"
  - id: "C"
    name: "退役 = host の面の行を消す"
    text: |
      (C) 退役 = host の面の行を消す。 却下: 退役は状態 (C3「退役は DB」) で、 宣言 file の書き換えは可逆 move にならない (行を失う・N1.2)。 event + mv が復帰の逆操作を持つ。
    verdict: rejected
    reason: "退役は状態 (C3「退役は DB」) で、 宣言 file の書き換えは可逆 move にならない (行を失う・N1.2)。 event + mv が復帰の逆操作を持つ。"
  - id: "D"
    name: "seat launch --launch FILE (雛形 file を渡す)"
    text: |
      (D) seat launch --launch FILE (雛形 file を渡す)。 却下: 雛形が手書きに戻り host 固有の絶対 path が file に散る (C10.2)。 host 固有の値は [[plugin]] / [[launch-arg]] の行で持ち、 行は器が組む。 seat register --launch FILE は既存 row の更新のために残す (register の雛形は supersede しない)。
    verdict: rejected
    reason: "雛形が手書きに戻り host 固有の絶対 path が file に散る (C10.2)。 host 固有の値は [[plugin]] / [[launch-arg]] の行で持ち、 行は器が組む。 seat register --launch FILE は既存 row の更新のために残す (register の雛形は supersede しない)。"
  - id: "E"
    name: "外の wrapper の周辺機能 (user-scope MCP 設定の同期・別口座への --resume の混線 fence・primary 口座の写像) を器に持ち込む"
    text: |
      (E) 外の wrapper の周辺機能 (user-scope MCP 設定の同期・別口座への --resume の混線 fence・primary 口座の写像) を器に持ち込む。 却下 (user 裁定 2026-09-14): MCP 同期は別 repo の運用 (器は口座の設定 dir の中身を書かない・agent view の 1 項目を除く)、 --resume の混線は登録 row が口座を持つ器の構造で起きない (席の口座は row・立て直しも row から)、 primary は session 用の選定 (ADR-1020 §2.2) が代替する。
    verdict: rejected
    reason: "MCP 同期は別 repo の運用 (器は口座の設定 dir の中身を書かない・agent view の 1 項目を除く)、 --resume の混線は登録 row が口座を持つ器の構造で起きない (席の口座は row・立て直しも row から)、 primary は session 用の選定 (ADR-1020 §2.2) が代替する。"
basis: [FR1033, FR1036, FR1038, FR1040, FR1057, FR1058, NFR1006, AC1013, ADR-1004, ADR-1009, ADR-1011, ADR-1014, ADR-1017, ADR-1020, ADR-1022, CON1002]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  「どの口座があるか」「席にどの plugin を積むか」「起動に足す引数」は、 host ごとに違う値です。 これを state dir の 1 つの file (host の manifest) に置きます。 規則の値 (rules 行) は今までどおり repo の manifest だけが持ち、 host の file には規則を 1 行も書きません。 器は両方を同じ読み方・同じ断り方で読みます。 host の file が無い host では口座 0 として動き続け、 在るのに壊れている host では止まります。 この repo の tracked の manifest からは口座の行を外します (公開面の情報が減る側)。
approval:
  who: 持ち主
  date: 2026-09-14
  ruling: "s2-07l.38・s2-07l.220・s2-07l.226・s2-07l（器の台帳の id・器の記録の承認の欄が名指す・取り込みの裁定 t3-hub.74.60.1:20261004T0113Z-1）"
  verbatim: "器の台帳 s2-07l.38・s2-07l.220・s2-07l.226・s2-07l の notes に在る（この file に写さない）"
  surface: R-8
consequences:
  - "良い面は、 口座の宣言が host ごとに 1 file になり写しの再生成が消えること、 口座を足す・外す・席を起こすが器の口で済み、 別 repo の wrapper と前の版の launcher が要らなくなること、 退役が記録に残り可逆であること、 起動行が導出されて手書きの絶対 path が減ることです。 悪い面は、 host の manifest という 2 面目の file が増えること (rules 行は置けないので規則の置き場は 1 つのまま)、 出来事の種類が 2 つ増えて数え直しが要ること、 login と trust は依然 user の手番であること、 host の file が壊れていると計測も tick も止まることです。"
  - "Positive: 宣言の置き場が 1 つ (host の面) になり、 rules.host.toml の写し (台帳 s2-07l.220) が消える。 tick と fleet usage が同じ宣言を読む (台帳 s2-07l.224)。 外の wrapper 2 本への依存が切れる (器の視野の内側・ADR-1009 §1 の根因の型を再発させない)。 退役が C3 の DB に載る (AccountRetired / AccountRestored)。 起動行の host 固有の値は [[plugin]] / [[launch-arg]] の行に集まり (C10.2)、 手書きの雛形が消える。 Guard・rules 行は増えない。"
  - "Negative (受け入れるコスト): manifest の面が 2 つ (loader は 1 本・rules 行は tracked だけ・面をまたぐ重複の検査が要る)。 EventKind +2 (KINDS の pin・property の生成器・literal 構築点が動く)。 Registration.sid の任意化 (読み手 3 か所)。 login / trust / 再 login は user の手番のまま (器は代筆しない)。 host の面が壊れている host では計測・選定・tick・doctor が止まる (FailClosed・manifest の拒否と同じ極性・無い host は縮退で続く)。 席の起動は依然 tmux の pane への注入 (tmux の外の起動は持たない)。"
note: |
  器の元の file: scribe2/design-intent/decisions/ADR-0026-account-lifecycle-host-manifest-and-seat-launch.html
  器の記録の頭: Status: accepted · Date: 2026-09-14 · version 0.4.6 (拘束する constitution の版) · C10.2 / C3 / C2.2 / N1.2 の適用を記録し、 ADR-1017 §2.3 の「口座の列挙は tracked の manifest」を「host の manifest の面」に、 ADR-1020 §2.4 の「起動の雛形は登録時に渡す」を「器が導出する (雛形は override)」に、 ADR-1022 §2.1 の「登録の書き手は席の session」を「器の起動の口も書く」形に、 それぞれ限って supersede · 要件は SRS (FR1033 / FR1036 / FR1038 / FR1040 / AC1013) が正本
  器の記録の前置き: 本 ADR は IETF RFC 2119 および RFC 8174 / BCP 14 に定義される MUST / SHALL / SHOULD / MAY のキーワード解釈規約に従う。 ADR は決定時点の記録であり、 改訂は新しい ADR による supersede で行う。 本 ADR の §2 は user の裁定 (2026-09-14・逐語は台帳が原本で本 file には写さない〔CON1002〕) で、 §3 は SRS への pointer である。 本 ADR は要件の文面を 1 字も持たず、 理由・形・却下案 だけを持つ。 本 ADR は ADR-1017 §2.3 のうち「口座は tracked の manifest に宣言する」の一文をhost の manifest の面に限って、 ADR-1020 §2.4 のうち「立て直しに使う起動行は登録時に渡した雛形」の一文を器が導出する形に限って、 ADR-1022 §2.1 のうち「登録は器の hook が走った session からしか受け付けない」の一文を器自身の起動の口が書く row に限って supersede する (label の不透明性・credential の場所・計測と選定の形・登録 row の鍵・権能の執行は不変)。
  器の機械の欄 version: 0.4.6 (拘束する constitution の版。 本 ADR は憲法の条文を動かさない。 C10.2 の「host 固有の値は manifest にだけ」を manifest の host の面として読む解釈を記録する)
  器の機械の欄 decided-by: user (2026-09-14) — planner の提案 (口座の口 4 つ・席の起動の口・host の manifest・持ち込まない範囲 3 つ・順序) を承認。 出所は user の指摘 (口座の登録の口が無い・口座の管理系が器の中に無い・外の wrapper 2 本に割れている) と planner の実測 (台帳 s2-07l.38 / s2-07l.220 / s2-07l.226)。 裁定の逐語は台帳 s2-07l の notes が原本で、 本 file には写さない (CON1002)
  器の機械の欄 stakeholders: Developer, AI Agent, External Reviewer
  器の機械の欄 supersedes: ADR-1017 §2.3 の「manifest SHALL 口座を [[account]] 行で列挙する」を、 その manifest が state dir の host の面 (host.toml) である形に限って supersede する (tracked の manifest の [[account]] の文法・label の不透明性・credential の場所・走査しない・A1 の対話面は不変)。 ADR-1020 §2.4 の「登録 row が持つ起動の雛形 (登録時に渡す)」を、 器の起動の口が導出した行を row に書く形に限って supersede する (穴 1 つ・fill_launch・立て直しの 3 条件・注入の門は不変)。 ADR-1022 §2.1 の「登録 SHALL 器の hook が走った session からしか受け付けない」を、 器自身の起動の口が書く row (sid 無し) を書き手に足す形に限って supersede する (鍵・置き換え・権能の執行は不変)
  器の機械の欄 related: ADR-1004 §2.3 / §2.4 (TOML subset・場所は manifest の外) / ADR-1011 §2.1 (器が起こす claude は settings を読まない・runner / lens に限る・不変) / ADR-1014 §2.1 (guard の定義・本 ADR は Guard を増やさない) / ADR-1017 §2.1 / §2.3 (計測・宣言) / ADR-1020 §2.2 / §2.4 (選定・立て直し) / ADR-1022 §2.1 / §2.5 (登録・対話面) / constitution C1 / C2 / C2.2 / C3 / C3.2 / C9 / C10 / C10.2 / C11.3 / C16.2 / N1 / N1.2 / A1 / SRS FR1033 / FR1036 / FR1038 / FR1040 / AC1013 / CON1002
  器の却下案の節の要約: 5 つの案を退けました。 口座の宣言を tracked の manifest に残す案は、 公開 repo に host の値を書き続けます。 state dir の dir を数えて口座にする案は、 宣言でなく場所を真実にします。 退役を宣言の行の削除で表す案は、 取り消せません。 起動の雛形 file を口の引数に残す案は、 手書きの絶対 path が戻ります。 外の wrapper が持つ周辺機能 (設定の同期・再開の混線 fence・主口座) を持ち込む案は、 器の構造で不要になっているか、 用途が別 repo の運用です。
  器の記録の出所（Trace）:
  出所は、 user の指摘 (口座の登録の口が無い・管理系が器の中に無い・2 つの command に割れている)、 planner の実測 (外の wrapper 2 本の実体・7 口座の link の手作業・私用 manifest の写し・SRS の scope)、 器の現物 (宣言の読み手・立て直しの経路・登録 row)、 そして user の裁定です。
  ・user の指摘 (2026-09-14・会話面): 席の起動が別 repo の口座切替 wrapper と前の版の launcher に乗っている・口座の登録の口が無い・口座の管理系が器の中に無い・2 command に割れている時点で整理されていない。 逐語は台帳 s2-07l の notes が原本。
  ・planner の実測 (2026-09-14): wrapper 2 本の実体 (label → CLAUDE_CONFIG_DIR の export と透過／launcher = plugin の自動検出と cgroup の防壁)・器の現物 (rules/manifest.rs の [[account]] reader・seat/cycle.rs の fill_launch / relaunch・fleet/mod.rs の Registration・seat/tick.rs の計測が --rules を伝える形)・tick の unit が --rules を渡さない・tracked の面に [[account]] 5 行・私用 manifest に 7 行・登録 row の雛形が手書きの絶対 path・SRS scope「席の起動 (v3)」。
  ・台帳: s2-07l.38 (seat autonomy の memo・「席の起動と初回の口座選択」を後続に残す)・s2-07l.220 (私用 manifest の写しの再生成・判定点 .217 Landed 済み)・s2-07l.224 (tick と usage が同じ宣言を読む)・s2-07l.226 (1) (credential だけの dir では立て直しが落ちる・7 口座の link を手で差し替え)・s2-07l.233 (doctor の口座行)。
  ・user 裁定 (2026-09-14・会話面): 席の起動の口 (役割は必須) / 口座の口 4 つ / host の面 / 持ち込まない範囲 3 つ / 順序 (席の起動の便は .222 の後・.208 run 5 の前) を承認。 逐語は台帳 s2-07l の notes が原本。
  ・先行決定: ADR-1004 §2.3 / §2.4・ADR-1011 §2.1・ADR-1014 §2.1・ADR-1017 §2.1 / §2.3・ADR-1020 §2.2 / §2.4・ADR-1022 §2.1。
