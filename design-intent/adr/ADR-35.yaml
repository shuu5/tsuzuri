# 判断の記録 ADR-35 — 器 scribe2 の便の組みを並び（同時に走る便の枠）ごとに温かく使い回す（持ち主の決め 2026-10-03・SSD の整理の 3 番目・記帳先 = tsuzuri の台帳 t3-hub.77 の notes と問い t3-hub.77.15 の notes）
# 起草は係 w98a（形 d の案）を係 w101a が形 (c) へ書き直した（2026-10-04）。材料は drafts/w101a/w/notes.md（設計・測り・失う物）と drafts/w98a/w/notes.md（器の code の調べ・形ごとの測り）。承認の欄は席が埋めた（問い t3-hub.77.15 の裁定）。
id: ADR-35
title: 器 scribe2 の便は、名乗った repo では並びごとに path を固定した作業木を使い回し、中身だけを便の base に替えて木の中の target で組む
status: accepted
date: 2026-10-03
context: |
  持ち主の決め（2026-10-03・SSD の整理を推奨の順で進める）の 3 番目。装置の書きは 1 日 1.6〜1.9 TB（規則の行 R-40 の予算 1.5 TB）で、約 85% が tsuzuri の便の木だった。
  器の今の形。便ごとに新しい作業木（.worktrees/scribe2/<run>）を 作業木を切る git の命令（git worktree add）で切り、器は組みの置き場の環境変数を置かないので、cargo は木の中の target に依存から全部を組む。着地した木は retired/<run> へ 移し（move） し、target は終端の掃除が消す。着地の確かめの木と列の候補の木も冷えた所から組む。
  測り（係 w98a と w101a の写し・便が撃つ組みの列の写し・歯の全部の実行は除く）。冷えた 1 便目は正味 5.41〜5.42 ギガバイト（GB）・127〜153 秒。木の path を固定して中身だけ替えた 2 便目は、core を触る便で 2.92 ギガバイト（GB）（−46%）、歯の file だけを触る便で 0.53〜0.85 ギガバイト（GB）（−84〜−90%）。歯だけの便の残りの約 9 割は、旗の違う 2 つの clippy が workspace の crate の照らしを交互に書き直す費用で、形によらない。組みの置き場だけを共有して木を便ごとに切ると、新しい木の file の時刻が全部新しいので workspace の crate を全部組み直す（−25〜30% の見積もり）。前の便の木を 移し（move） で引き継ぐと、境界・面・folio の 組みの前の script（build.rs） が木の絶対の path を焼いているので組めず（rc 101）、同じ path に別の木が在れば落ちずに別の中身を組む穴を形として持つ。着地した便の 45.7% は歯の file だけを触る。
  cargo は workspace の crate の新しさを file の更新の時刻（mtime）で見る。git の取り出し（checkout）は中身の替わる file だけを書く。木の path が替わらなければ、組みの前の script（build.rs） が焼く絶対の path も同じ木を指し続ける。
  実の重なり（tsuzuri の置き場・09-27〜10-03・430 便）は、live な便が 2 本以下の時間が 92.3%・5 本以上が 1.7%・最大 11 本。
decision: |
  (1) 並びの木。器への宣言の任意 key（build-lanes）を真（true）と名乗った repo の便は、初回の周（turn）で並びの木 .worktrees/scribe2/lane/<n> を 1 つ取る。持たれていない並びのうち木の在る最も小さい番号を使い回し、無ければ木の無い最も小さい番号に新しく切る。並びを取るのは repo ごとの錠（lock）の中（器の store の取り方）で、並びの印 lane/<n>.run に便の id を書き、便の path（.worktrees/scribe2/<run>）に並びの木を指す相対の symlink を置く。便の path を読む器の呼び手は替えない。名乗らない repo の便は今の形のまま替わらない。
  (2) 中身の替え。使い回す木は、index の状態（stat）を合わせた後に 取り出しの命令（git checkout -f）で中身を便の base に替え、消しの命令（git clean -ffdx -e /target）で target の外の未追跡と無視の file を全部消し、木が clean で HEAD が base の周だけ 枝（branch） scribe2/<run> を付けて使う。そうでない周は木を今の退役の形（retired/<前の便> への move）で退かせ、同じ並びに新しく切る。組みの置き場は木の中の target のままで、器は子に環境変数を足さない（器の憲法の条（C2.2）の読みは替えない）。
  (3) 着地の退かせ。並びを持つ便の退役（着地と pipe retire）は、木が clean なら retired/ へ 移し（move） せず並びに残し（印を書き直し、便の path の symlink を外す）、clean でなければ今の形のまま retired/<run> へ 移し（move） する。枝（branch） は消さない。器の憲法 N1.2（退役は可逆な 移し（move） でだけ）は、着地した clean な木の中身が main と 枝（branch） に在り木を 枝（branch） から作り直せることをもって、木の dir を並びに残して次の便が中身を替えることを許すと読む（持ち主の問い t3-hub.77.15）。
  (4) 落ちた便と止めた便。並びを持ち続け（再開と regate は同じ木で撃つ）、ほかの便には渡さない。便の終わりの掃除（器の ADR-0081）は symlink の木を見ないので並びの target を消さない。
  (5) 掃除。並びの木の大きさの合計の上限を rules の新しい行で持ち、器の掃除が越えた周に live な便が持たない並びを最も長く使われていない順に丸ごと退かせる（返された並びは retired/<印の便> へ、live でない便が持つ並びはその便の元の path へ 移し（move） し、移した木の target は今の掃除が消す）。上限は 40 ギビバイト（GiB）（rules の行の値は 40960・持ち主の答え t3-hub.77.15 の案 A）。名乗りは上限の行の着地の後に置く。
  (6) 並びを使わない木。着地の確かめ・列の候補・着地の後の検出・base・床・審査の木は並びを使わず今のまま組む（器の ADR-0039 を受け直さない）。
  (7) 効く時。器の code の行が着地しても、PATH の器の binary を入れ替える（行 v-swap の門）までは効かない。tsuzuri の宣言に 宣言の任意 key（build-lanes）を足す行は、入れ替えと (5) の行の着地の後に席が置く。
options:
  - id: a
    name: 今のまま（便ごとに冷えた木と冷えた組み）
    text: 便ごとに新しい作業木を切り、木の中の target に依存から全部を組む。
    verdict: rejected
    reason: 便ごとの最初の組みの列で正味 5.4 ギガバイト（GB） を払い続ける。
  - id: b
    name: 並びの組みの置き場だけを共有する
    text: 木は便ごとに新しく切り、子の cargo に並びの CARGO_TARGET_DIR を置く。
    verdict: rejected
    reason: 新しい木の file の時刻が全部新しいので workspace の crate を全部組み直し、減りは 25〜30% の見積もりにとどまる。子に環境変数を足すので器の憲法の条（C2.2）の読みを替え、tsuzuri の plugin の hook も直す。
  - id: c
    name: 並びの木の path を固定し中身だけを替える
    text: 決定 (1) から (7)。
    verdict: adopted
    reason: 書きが最も減る（core を触る便 −46%・歯だけの便 −84〜−90%）。木の path が替わらないので 組みの前の script（build.rs） の焼く絶対の path の穴を形として持たず、環境変数も足さない。便の path を並びの木への symlink にするので、path を読む器の呼び手を替えずに済む。
  - id: d
    name: 退かせた木を 移し（move） で引き継ぎ、並びの組みの置き場で組む
    text: 便ごとの path は今のまま、前の便の木を git worktree 移し（move） で引き継ぎ、子に CARGO_TARGET_DIR を置く。
    verdict: rejected
    reason: 引き継いだ木では境界の 組みの前の script（build.rs） の生成の file が前の path を名指して組めず（rc 101）、同じ path に別の木が在れば落ちずに別の中身を組む穴を形として持つ。環境変数も足す。
basis: [ADR-33, ADR-34, R-40, N-2, N-3]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、台帳 t3-hub.77 の notes に記帳する。問う相手は持ち主。
    (1) 並びの木の古い成果で偽の緑（便の gate が緑だった木が、着地の後の CI か並びを退かせて冷えた所から撃ち直すと落ちる）が 1 度でも見つかったら、宣言の名乗りを外す行を置いて原因を問う。
    (2) 名乗りの後 7 日の装置の書きが、名乗りの前の 7 日より 25% 以上減っていなければ、形を問い直す。
    (3) 並びの上限に当たって丸ごと退かせる回数が 1 日 4 回を越えたら、上限の値を問い直す。
plain: |
  器が作業ごとに一から部品を組み直しているのを、作業の枠（並び）ごとに作業場所を残して使い回す形に替える決めです（推奨の案）。
  今は作業 1 本ごとに、記憶の装置（SSD）へ約 5.4 ギガバイト（GB） を書いて組み直しています。作業場所を残して中身だけを入れ替えると、変わったところだけを組み直すので、重い作業で約 2.9 ギガバイト（GB）、テストだけを触る作業では 0.5〜0.9 ギガバイト（GB） になりました（測り）。
  着地した作業の作業場所は保管用の場所へ移さず、次の作業が中身を入れ替えて使います（作業の中身は main と作業の 枝（branch） に残ります）。組み立ての結果は作業が無い時も 記憶の装置に残るので、合計の上限を 40 ギビバイト（GiB） とし、越えたら最も長く使われていない並びから片付けます。
  名乗った project だけに効き、ほかの project の作業は今のままです。
approval:
  who: 持ち主
  date: 2026-10-03
  ruling: t3-hub.77.15（裁定 id = t3-hub.77.15:20261003T2211Z-1・便の組みを並びごとに残して使い回す形 c・並びの置き場の合計の上限 40 GiB の案 A・席とのチャット・notes に逐語）
  verbatim: "先ほどの問いは全部推奨で"
  surface: R-8
consequences:
  - 決定 (5) の上限の行は試作の係が置く（値 40960）。その行の着地の前は tsuzuri は名乗らない。
  - 未決（席の Edit の分類）。器の hook の分類は並びの木の中の path を便の木と読まず、席が便の木の中を Edit で書く周を契約で開いた file と認めない（厳しい側に倒れる）。直すなら印を読む 1 段を足す行を別に置く。
  - 未決（clippy の旗の行き来）。歯だけの便の 2 便目に残る書きの約 9 割は、契約の clippy（-p と --no-deps）と共通の 確かめ（verify） の clippy（--workspace）の旗の違いで、形によらない。減らす手（旗を揃える）は別の判断の記録で扱う。
  - 並びの木の数は同時の便の数で決まり、上限を越える混みの時だけ冷えた組みに戻る。落ちた便が畳まれずに残る間、その並びは使い回せない。
note: 起草 w98a（形 d の案・測り）を w101a が形 (c) へ書き直した。数は drafts/w98a/w/measure.tsv（R1・R2c）と drafts/w101a/w/measure.tsv（R1〜R4）から。試作は写し drafts/w101a の 枝（branch） r-lane（main c9e6f915 の上・行 v-lane の差の file）。
