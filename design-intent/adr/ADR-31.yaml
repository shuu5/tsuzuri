# 判断の記録 ADR-31 — 開発の組みの書き込みと演算を減らす（デバッグの情報を行の表だけ・歯の時間切れ・組みの置き場・1 日の書き込みの予算と知らせの口・一度きりの組みの途中の保存）
# 起草は係 w86a（2026-10-03）。持ち主の答え t3-hub.77.1〜t3-hub.77.3 で問いの所を確定し、席が承認の欄を埋めた。
# 測りと見積もりの全部は起草の notes（drafts/w86a/w/notes.md）。歯の file の束ねは別の判断の記録が持つ。
id: ADR-31
title: 開発の組みの書き込みを 1 桁下げる — デバッグの情報（debuginfo）を行の表だけにし、歯に時間切れを置き、組みの置き場は今のまま、1 日の書き込みに予算の線と知らせの口を置き、一度きりの組みは途中の保存（incremental）を切る
status: accepted
date: 2026-10-03
context: |
  系の記憶の装置（NVMe の SSD）は定格の書き込み量が 1,200 テラ（TB）の見込みで、起動からの 8.08 日で 39.1 テラを書いた（1 日 4.8 テラ・直近の日は 6.5〜8.7 テラ）。この速さだと約 7〜8 か月で定格に届く。持ち主は memo t3-hub.77 で、書き込みと演算の装置（CPU）を tsuzuri の問題として見直すよう求めた。
  書きは main の歯の file の数に比例して育った（09-27 の 52 本から 10-03 の 384 本・便の数は 1 日 101 本から 31 本に減ったのに書きは 2.8 テラから 6.5 テラに増えた）。時ごとの回帰で、tsuzuri の便 1 本は約 102 ギガ（GB）、7 日の 37.5 テラのうち約 23 テラが tsuzuri の便と席の起草（器の席の実測で席の起草の流れは 1 日 約 0.98 テラ）。
  元は歯の実行 file。cargo は歯の置き場（tests/）の 1 file を 1 つの crate にし、部品（lib）と依存と標準の部品のデバッグの情報（debuginfo）を丸ごと入れた実行 file を作る（392 本・19.1 ギガ・組みの置き場の全部で 23.6 ギガ）。部品を 1 行替えると下流の実行 file を全部 link し直す（core の部品に注 1 行で 20.6 ギガ）。既定の全部のデバッグの情報が実行 file の大半で、tsuzuri と器と口座の hook と skill に虫取りの道具（debugger）と全部のデバッグの情報を使う所は 0、host に虫取りの道具（gdb と lldb）は無い。器 scribe2 は既に開発の組みを行の表だけで組む。
  歯の時間切れが無い（nextest の設定の file が無い）。便（t3-hub.74.31）の着地の前の check で、図の描き手の待ちで 1 本の歯が 30 分止まった。
  主記憶（RAM）の上の組み（tmpfs）は、書いた処理の群（cgroup）の記憶の量に数えられ、退避の領域（swap）で戻せない。2026-10-03 に席の枠（scope の memory.max 32 GiB）が組みの 31 ギガで上限に当たり、席ごと落ちた。便の枠は約 117.6 ギビ（GiB）・利用者の全体の枠は 110 ギビ。
  同じ組みの置き場の中で途中の保存（incremental）を切り替えると、workspace の crate が別の印（hash）で組み直され、実行 file が 2 重に置かれる。今の決めの入出力の優先（ionice）は、装置の順番の係（scheduler）が無し（none）なので効いていない。
decision: |
  (1) 根の設定（Cargo.toml）に開発の段（profile.dev）を置き、デバッグの情報（debug）の値を行の表だけ（line-tables-only）にする（器と同じ値・行 r-dbg）。panic と歯の落ちの file と行、呼び出しの跡（RUST_BACKTRACE の backtrace）の各段の file と行は残り、抜けるのは虫取りの道具（debugger）で見る変数と型だけ。0 からの組みは 23.6 → 10.6 ギガ（GB）、部品 1 行の組み直しは 20.6 → 8.9 ギガ、組みの演算は 3 割減る。デバッグの情報を無し（偽の値 false）にはしない（持ち主の答え t3-hub.77.1・無しにすると呼び出しの跡の各段の file と行を失う。0 からの組みは 3.9 ギガ）。
  (2) nextest の設定（.config/nextest.toml）に歯の時間切れを置く。既定の段の時間切れの値（slow-timeout）で、60 秒ごとに遅い歯（SLOW）と報せ、5 回目の 300 秒で止めて時間切れ（TIMEOUT）の落ちにする（行 r-nextest-timeout）。並びの数・再試行・落ちた時の止め方は替えない。今の歯の最長は host の負荷（load）によって 26〜62 秒。
  (3) 使い捨ての組み立ての置き場（係と便の target）は今の系の記憶の装置（SSD）のまま（持ち主の答え t3-hub.77.2）。主記憶（RAM）と 2 本目の装置は採らない。(1) と歯の束ね（係 w87a の判断の記録の見込み）と (6) の着地の後に測り直す。
  (4) 系の装置の 1 日の書き込みに予算の線を置く。7 日の平均で 1 日 1.5 テラ（TB）以下（持ち主の答え t3-hub.77.3）、1 日で 3 テラを越えた日も知らせる。測りは核の数え（/sys/block の書いた区の数）の日ごとの差で、装置の名は設定に置く（条 N-7）。値は規則の行 R-40 に裁定 id を付けて置く（条 P-17）。
  (5) 線を越えた時の知らせの口は、board の札と席への memo（持ち主の答え t3-hub.77.3 の問いの字に含めた）。持ち主へは 3 日続けて越えた時だけ届ける。測りと知らせは host の全体を見る器に頼み、tsuzuri の board はその値を読んで札にする。
  (6) 一度きりの組み（land の main の実測・掃除の後の regate・flip-check の基の木・検出線の写し・席の床の写し）は、その組みの置き場の最初の組みから途中の保存を切って（CARGO_INCREMENTAL=0）通し、1 つの置き場の中で値を切り替えない。編集を繰り返す木（便の runner の木・係の試作）は途中の保存を使うまま（切ると部品 1 行の組み直しが 21 → 41 秒・演算 1.7 倍）。器の側の段は器への頼みとし、席の床の写しは席の起草の決まり（drafter-common の 2026-10-03 の決め）で行う。ノートの契約の行にはしない。
options:
  - id: a
    name: 行の表だけのデバッグの情報と歯の時間切れと今の置き場と予算の線と一度きりの組みの途中の保存の切り
    text: 決定 (1) から (6)。
    verdict: adopted
    reason: 使っている物を失わずに、0 からの組みと部品 1 行の組み直しの書きを半分以下にし、束ねと合わせて 1 桁下げる見込み。器と同じ段の値で器の変更を少なくする。止まった歯を報せ、速さは削らない。
  - id: b
    name: 今の段の値のまま束ねだけ
    text: デバッグの情報は既定の全部のまま、歯の file の束ねだけで減らす。
    verdict: rejected
    reason: 束ねの 1 本ごとに標準の部品と自分の crate の全部のデバッグの情報が残り（core の束で 71 対 35 メガ（MB））、組みの演算も 3 割重い。使っていない物のために払い続ける。
  - id: c
    name: デバッグの情報を無しにする
    text: 開発の段の debug を偽（false）にする（cargo の既定で標準の部品のデバッグの情報も抜ける）。
    verdict: rejected
    reason: 0 からの組みは 3.9 ギガ（GB）と最も小さいが、呼び出しの跡（backtrace）の各段の file と行を失う。束ねの後は行の表だけとの差が 0 からの組み 1 回あたり約 1 ギガに縮む。持ち主は行の番号で止めると答えた（t3-hub.77.1）。
  - id: d
    name: 依存の部品だけデバッグの情報を抜く
    text: 決定 (1) に加えて、依存の部品の全部の段（profile.dev.package）の debug を偽にする。
    verdict: rejected
    reason: 行の表だけより 4% 小さいだけで、依存の段の行を失い、段が 1 つ増える。
  - id: e
    name: 使い捨ての組みの置き場を主記憶（RAM）に置く
    text: 便と係の組みの置き場を主記憶の上の領域（tmpfs の /dev/shm など）に置く。
    verdict: rejected
    reason: 主記憶の上の領域（tmpfs）の頁は書いた処理の群（cgroup）に数えられ退避の領域で戻せず、席の枠で落ちた。器が便ごとに置き場を決めて消す手が要り、束ねの後は書きが 1 桁小さく値打ちが薄い（持ち主の答え t3-hub.77.2）。
  - id: f
    name: 使い捨ての組みの置き場を 2 本目の装置に置く
    text: 控え（backup）の置き場の装置に組みの置き場を置く。
    verdict: rejected
    reason: 書きは無くならず控えの置き場へ移るだけで、控えの装置の寿命を削る。
  - id: g
    name: 演算の装置を買い替える・入出力の優先を強める
    text: 速い部品に替えるか、装置の順番の係を替えて入出力の優先（ionice）を効かせる。
    verdict: rejected
    reason: 書きの量と書きの待ちは減らない。cargo の書きは核の書き出しの係（kernel の flusher）が出し、処理ごとの優先に載らない。組みと link の仕事を減らす方が演算にも効く。
basis: [P-4, P-7, P-17, P-19, P-23, P-25, P-26, N-7, NFR2, NFR3]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo t3-hub.77 に 1 件ごとに記帳する。
    (1) 決定 (1) と束ねと (6) の着地の後、7 日の平均の書き込みが (4) の線を 3 日続けて越えたら、(3) を開き直し、一度きりの組みを主記憶に置く案を処理の群の上限（memory.max）と合わせて測る。
    (2) 決定 (1) の後、歯の落ちか panic の調べで呼び出しの跡の行だけでは足りず虫取りの道具の変数が要った場面が 1 か月に 2 度以上あったら、デバッグの情報を全部へ戻すか、その時だけ全部で組む手順を決め直す。
    (3) 決定 (2) の後、負荷の高い時に緑の歯が時間切れで落ちたことが 1 度でもあったら、時間切れの値（period と terminate-after）を問い直す。
    (4) 決定 (6) の一度きりの組みで、器が同じ置き場を途中の保存のあり・なしの両方で使い、置き場の大きさが途中の保存なしの 0 からの組みの 1.5 倍を越えたら、(6) を外すか置き場を分ける。
plain: |
  組み（build）の出力の大半は、歯（テスト）ごとに作る実行 file と、その中の虫取りの道具（debugger）用の情報です。歯の file 1 本ごとに部品を丸ごと入れた実行 file を作るので、部品を 1 行直すたびに約 20 ギガ（GB）を書き直していました。
  虫取りの道具は誰も使っていないので、情報を行の番号だけに減らします（器と同じ）。誤りの場所の file と行は今までどおり出ます。あわせて、止まった歯を 5 分で止めて知らせるようにします。
  置き場（主記憶や 2 本目の装置）は、量が減ってから考え直します。1 日の書き込みに上限の線を引き、越えたら board の札と席への memo で知らせ、3 日続けて越えたらあなたにも届けます。上限の値（7 日の平均で 1 日 1.5 テラ（TB））と、置き場を今の装置のままにすることと、情報を行の番号で止めることは、あなたの答えで決めました。
  使い捨ての組みでは、途中の保存（incremental）を作らないように器に頼みます。
  この記録はあなたの承認で発効しています。承認の記帳先は tsuzuri の台帳の問いです。
approval:
  who: 持ち主
  date: 2026-10-03
  ruling: t3-hub.77.1（裁定 id = t3-hub.77.1:20261003T0242Z-1・第 1 問は案 A の行の番号だけ）・t3-hub.77.2（裁定 id = t3-hub.77.2:20261003T0242Z-1・第 3 問は案 A の今の装置のまま）・t3-hub.77.3（裁定 id = t3-hub.77.3:20261003T0242Z-1・第 4 問は案 B の 7 日の平均 1.5 テラ）・どれも席とのチャット・notes に逐語
  verbatim: "ほかは推奨でよい"
  surface: R-8
note: 逐語は問い t3-hub.77.1〜t3-hub.77.3 の notes（3 つの問いに同じ発話を結んだ・同じ発話の前の行は第 2 問〔束ねの群の大きさ〕への問い返しで、第 2 問は別の判断の記録が持つ）。同じ commit で、判断の記録の封（anchors/adr-seals.yaml）に ADR-31 の行を足し（tz check --freeze-adrs）、規則の行 R-40（1 日の書き込みの予算の線・detect）を足して条 P-23 の relations に結び、ノート surface-wave27a に行 r-dbg（決定 (1)）と r-nextest-timeout（決定 (2)）を足す。決定 (3)(4)(5) の測りと知らせは器への頼み（memo t3-hub.77）、決定 (6) は器への頼みと席の起草の決まり。
