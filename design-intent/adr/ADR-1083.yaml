# 判断の記録 ADR-1083 — 器 scribe2 の判断の記録 ADR-0083 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1083
title: "席から持ち主への問いは台帳の問いに立て、 裁定は器が記帳した持ち主の発話に結ぶ — 発話 event と seat ruling bind・裁定 id の実在の門 (ruling-check の opt-in)・未反映の裁定は関わる契約だけを待たせる (ADR-1037 の書き手の口・時刻の id・doctor の突合と、 ADR-1016 §2.3 の逐語の置き場を部分 supersede)"
status: accepted
date: 2026-09-28
context: |
  ADR-1037 は便の無い裁定を、 席が逐語を打つ口で記録し、 器が打った時刻を裁定 id にした。 その字が持ち主のものか、 引かれた id が本当の裁定を指すか、 決めたことが文書に写されたかを、 器は確かめられない。 本 ADR は、 問いを台帳の問いの形に閉じ、 持ち主の打った字を器が全部記帳し、 席は問いと発話を結ぶだけにし、 引用の実在と未反映を字の数えで判じる形を決める。
  なぜこの判断が要るのかを 7 つで示します。 経緯 (裁定は、 席が言葉を打つ口と時刻の番号で記録してきた)・事象 (字が持ち主のものか、 番号が本当に在るか、 文書に写されたかを確かめていない)・現物 (持ち主の文は器の hook を通り、 台帳の書き込みは門を通り、 列と着地には待たせる形がある)・隣の形 (別の project は自分の画面と server で同じ役を持つ)・前の器の直命の表との線・憲法の向き (逐語と裁定の番号と承認を受ける面の読み方、 検査を選ぶ印の置き場の読み方)・射程 (動かすものと動かさないもの) です。
  CTX1 経緯 — 裁定は ADR-1037 で「席が逐語を打つ口」と「器が打つ時刻の id」になり、 席から持ち主への問いは記録の形を持たない
  ADR-1037 は便の無い裁定を event kind RulingReceived (actor が human・便を持たない) として持ち、 書き手を対話面の席の口 seat ruling add 1 つに限り、 裁定 id（裁定を指す番号） をその event の ts とし、 doctor が rules 行の裁定の欄 (user <分までの時刻>) ごとに同じ分の event の有無を読む形を決めた。 逐語はこの口の引数で、 席が打つ。 ADR-1016 §2.3 は user の逐語を承認 event にだけ載せると定めた。 席から持ち主への問いを記録する形は器に無く (EventKind の 24 値にも台帳の label にも無い)、 裁定が「どの問いへの答えか」を指す欄も無い。 runner の質問 record (ADR-1016 §2.2) は便の中の問いで、 持ち主への問いではない。 現物の実測 (main d6d9513・2026-09-28): rules manifest の 77 行のうち裁定の欄が時刻の形の行は 60 行 (分まで在る 54 行・分の 1 桁が x の 6 行)、 別の番号の形 12 行、 そのほか 5 行で、 分まで在る 54 行のうち同じ分の RulingReceived を持つのは 2 行だけ (この host の event log)。 追跡された file 423 本のうち時刻の形の引用を持つものは 70 本で、 うち 32 本は凍った決定記録 (書き換えず、 改訂は supersede する新しい記録で行う) である。 同じ main の .rs の行のうち policy: の字を含むものは 74 行で、 どれも code の名前付きの引数か型注釈である。
  CTX2 事象 — 裁定の字が持ち主の字か、 引かれた id が本当の裁定か、 決めたことが文書に写されたかを、 器は確かめない
  器の検査は、 rules 行の裁定の欄が空でないこと、 値を変えて裁定の字が同じ行を断ること (rules-diff)、 doctor の同じ分の突合 (数えるだけ) の 3 つで、 引かれた裁定 id が実在の裁定を指すかを確かめる検査は 0 である。 seat ruling add の逐語は席が打つ字なので、 持ち主の言い換え・記憶違い・会話で聞いた気がする判断も同じ形で記録される。 消費側の project の 1 つの実測では、 台帳の bead の id に「席の判断」を添えた字が裁定の欄として形の検査を通った。 持ち主が決めたことが文書に写されたかを数える面も無く、 写し忘れは、 次の設計と契約が古い文書を正として読むまで見えない。 持ち主は問われる前に指示を出すことも多い。
  CTX3 現物 — 持ち主の prompt は器の hook を通り、 台帳の書きは起票の門（台帳の書き込みを止める門）を通り、 列と tick と着地には待たせる型が在る
  器の plugin の hooks.json は UserPromptSubmit で器の hook を撃つ (今は席の状態の打刻と群の合図の行だけ)。 hook は prompt の経路で走るので、 台帳も git も読まない形が要る (台帳の読み 1 回は約 0.35 秒・ADR-1045 の実測)。 器が席の入力欄へ差し込む行は閉じた一覧 (FR1044: 起動行・管理 tick の打刻の合図・群の通知と合図・便の終端の周の通知・裁定の指し示し) で、 どれも器の雛形の形を持つ。 起票の門 (ADR-1056) は席の道具の呼び出しの bd / bdw の書きに掛かり (席が Bash から起こした子 process の書きは見ない)、 memo の 4 節の判定を持つ。 起動の列は memo を label で外し、 台帳の lint は epic と decision の型を契約に数えない。 vessel 宣言（repo の宣言） (.vessel.toml・ADR-1010) は任意 key を持て、 検査を測らないと repo が名乗る key の前例が在る (ADR-1054)。 起動の列の待ち理由は閉じた 8 値、 受付の断りは閉じた 23 値で、 列の全部を待たせる先例 HostBusy が在る。 着地の前提 (FR1010) には push の走査が着地を止める間 (FR1050) の留めが在り、 SRS 版 0.28 はこの留めを、 便を Gated に留めて理由の event を便ごとに 1 件だけ記帳し (同じ理由が続く周は記帳し直さない)、 撃ち直しの上限 (FR1011) に数えず Failed にしない形に書く (FR1050 の留めの code は main に未着地)。 dispatch の周が置き場へ file を書き、 管理 tick は台帳も git も撃たずにそれを数えるだけ、 という型が事前審査に在る。
  CTX4 隣の形 — 消費側の project の 1 つは、 自分の台帳と自分の裁定面の server で同じ役を持つ
  消費側の project の 1 つは、 型 task で label intake:question の bead・notes の裁定の行（問いに書く答えの 1 行） (裁定 id・問い・逐語の欄をこの順に持ち、 裁定 id は <問い>:<UTC の年月日と時分>-<n> の形)・close_reason「裁定 <裁定 id>」を使い、 id は自分の裁定面の server だけが発行して、 自分の経路で台帳へ書く (その server は席が Bash から起こす常駐の process として走りうる)。 その台帳は batch: と policy: で始まる id の形も使い、 裁定の行に裁定 id の欄と別の束の欄 (batch: の形の id を持つ) を持つこともある。 その repo の決まった done の文は、 台帳に解けない batch: などの形の字面を fixture として持ち、 scribe2 自身の FR1082 と FR1083 の歯 (未着地) も、 台帳に無い裁定 id の形を fixture に持つことになる。 scribe2 の持ち主は端末の対話の session で答え、 その server を通らない。
  CTX5 直命の表（持ち主の発言の旧い表）との線 — 前の器は持ち主の発言を 1 件ずつ状態付きで持って席へ運び、 ADR-1045 がそれを消した
  ADR-1031 の直命の表は、 持ち主が対話面で言った発言のうち席の行動を拘束するものを 1 件ずつ event (DirectiveIssued / DirectiveClosed) に持ち、 状態と前提 pointer を typed に持ち、 復元の DATA が有効な直命を逐語で並べて席へ運んだ。 ADR-1045 §2 (2) はこれを席の自律機能と共に消し (状態の置き場を増やす・C3 / C2.2)、 SRS の FR1065 は「器は user の発言を event log に持たない」と書いていた。 持ち主の打った字を全部記帳する形は、 字面だけ見ればこの表の復活に見える。 違いを決めるのは、 記録が席へ運ばれるか (起動行・圧縮の直前の枠・合図・通知・一覧) と、 記録が状態 (有効か・閉じたか) を持つかである。
  CTX6 憲法の向き — C7.2 の「逐語」・C5 と A2 の「裁定 id」と C7 の経路の読み、 C1 の下での opt-in の key の置き場の読みが要る
  C7 は承認をちょうど 1 つの対話面 (rules 行 R-C7-1・値は orchestrator) で受け、 C7.2 は受けた承認をすべて user の逐語を運ぶ承認 event として記録する。 C7 の人の層は「会話の記憶を承認の根拠にしない」と書く。 ADR-1037 は C7.2 の「承認」に裁定を含めて読み、 裁定の記帳も R-C7-1 の席の権能 (SRS FR1041 の「承認の記帳」) に数えて、 書き手の口で席の役割を確かめた。 ADR-1016 §2.3 も承認の対話面を R-C7-1 のままとし、 対話面を増やさないと決めている。 C5 は裁定 id の無い rules 行の変更を CI が落とすと定め、 C14.2 は裁定 id を正本の側 (原則と裁定は文書の版・規則は manifest の行) に付け、 C15 / C15.2 は台帳を task と裁定に限り、 規則を変える PR と台帳の項目が裁定 id を引くことを求める。 CI は private な台帳に届かない。 C1 は規則の値 (有効 / 無効の旗を含む) を manifest 1 つに置く。 ADR-1010 は、 repo が自分について名乗る値を vessel 宣言に置き manifest は上限を持つ、 と C1 を適用した。 C3 は状態を 1 つの DB (event log) に置く。 N1 は不可逆な削除をしない。 C17.2 は走査・記録・rules 行・仕組みを足すなら先に消すものを名指させる。 N2 は散文にしか無い規則を規則と認めない。 本 ADR は、 裁定の行についての C7.2 の逐語と C5 の裁定 id の読み、 C7 の受理面の読み (結びの口 seat ruling bind は台帳の問い（台帳に立てる問い）に裁定の行を書く口で、 承認の受理面ではない。 承認は便の承認 pipe approve が受け、 FR1041 の承認の記帳の権能と役割の確かめもそこに残る)、 ruling-check の置き場の読みを決める (ADR を書く条件 1)。 便の承認の逐語は本 ADR の読みの外に置き、 変えない。 A2 と C7 の経路の読み (orchestrator の読み・持ち主の常設の指示 2026-09-28T00:54Z の下・持ち主が異を唱えれば改める): 憲法の規範文は、 A1・A3・A4.2 では承認を C7 の対話面を通して取ると書き、 A2 では裁定 id を伴う user 裁定を取ると書く (A2 の機構は rules 行の diff と裁定 id・C5 が CI で強制)。 C7 の機構の欄の「A1 / A2 / A3 / A4 の承認はすべてこの経路を通る」と §2.2 の「確認の経路は C7 が定める 1 つの対話面だけ」(どちらも出所は SPEC §2・ADR-1003) は、 承認 (relay 印と承認 event) の受理面を 1 つに保つ文と読み、 A2 の裁定 id を発行する口を縛る文とは読まない。 よって結びの口 seat ruling bind は A2 の型の裁定と裁定の行の裁定 id を発行し、 C7 の単一の受理面 (pipe approve が記帳する承認 event) は変えない。
  CTX7 射程 — 動かすのは門の形・発話の記帳・結びの口・引用の数え・未反映の待ちの 5 つ
  動かすのは、 (1) 起票の門の断りの形 (台帳の問いの形・席が書く裁定の行) と、 台帳の問いを台帳の lint と起動の列から外すこと、 (2) 発話 event（人が打った字の記録） の kind と記帳と計測での数え方、 (3) 結びの口 seat ruling bind と裁定 id の形と裁定の行、 seat ruling add と doctor の同じ分の突合の退役、 (4) vessel 宣言の任意 key ruling-check と ruling-fixtures と引用の実在の判定 (受付・着地・doctor)、 (5) 未反映の裁定（文書が引いていない裁定）の判定と待ち (置き場の file・doctor・tick の alarm・起動の列・着地) の 5 つで、 要件は SRS 版 0.28 の FR1081〜FR1084 と FR1010・FR1022・FR1027・FR1051・FR1065・FR1068 の改訂が持つ。 動かさないのは、 R-C7-1 の値、 便の承認 (pipe approve の逐語と役割の確かめ・FR1015 / FR1016 / FR1041)、 裁定の指し示しの口 (ADR-1077) と裁定面の記帳 id、 RulingReceived の kind と到達点の計測での承認の側、 event log の schema 版、 memo の引き金の形と審査・床の検査・選択式の問いの遮断 (どれも別の決定記録) である。 ADR を書く条件のうち 1 (C7.2・C5・C1 の読み)・3 (event の kind と key・notes の裁定の行の形・vessel 宣言の key は版を跨ぐ形)・4 (却下案を残す価値のある分岐) に当たる。
  （選択肢を測るものさし）この判断を測る 7 本のものさしです。 裁定の字は持ち主が打った字だけで、 席は打てないこと。 問われる前の指示も後から結べること。 引かれた番号が本当に在るかを器の門が確かめ、 文書の意味は読まないこと。 決めたことが文書に写されるまで関わる契約は進まず、 関わらない契約は止めないこと。 前の器の直命の表を戻さないこと。 持ち主の文の経路を軽く保ち、 器の外の server や道具に依らず、 問い・結び・実在・未反映の段の順に着地できること。 足すものを最小にし、 消すものを名指すことです。
  DR1｜裁定の字は持ち主が打った字だけで、 席はその字を打てない (C7.2・FR1082) CTX1・CTX2・CTX6
  DR2｜問われる前に出た指示も、 後から問いを起こして結べる CTX2
  DR3｜引かれた裁定 id の実在を席の注意でなく器の門が確かめ、 器は文書の意味を読まない (C5・C15.2・FR1083) CTX2・CTX6
  DR4｜決めたことが文書に写される前に、 それに関わる契約は進まないが、 関わらない契約は止めない (FR1084) CTX2・CTX3
  DR5｜直命の表を戻さない — 記録を席へ運ばず、 状態を持たせない (FR1065・ADR-1045 §2 (2)) CTX5
  DR6｜prompt の経路を軽く保ち、 器の外の server や道具の書き出しに依らず、 段の順 (問い → 結び → 実在 → 未反映) に着地できる CTX3・CTX4
  DR7｜足すものを最小にし、 消すものを名指す (C17.2) CTX6・CTX7
decision: |
  選んだ案と、 それが支える要件です。 問いは台帳の問いの形に閉じ、 問いの印を持つ記録は台帳の点検にも便を起こす列にも数えません。 台帳の書き込みの門は、 席が自分の道具で撃つ書き込みだけを見ます。 持ち主の文は問いの有無に依らず器が一字一句記録し、 席にはその記録の番号だけを返します。 席は結びの口で問いと記録を結び、 器が裁定の番号を出して問いに答えの 1 行を書き、 問いを閉じます。 この記録は前の器の直命の表ではなく、 席へは運びません。 結びの口は承認を受ける口ではなく、 便の承認の言葉は席が打つ今の形のまま変えません。 選んだ repo では文書が引く裁定の番号が本当に在るかを器が確かめ (test などの見本は、 ほかの頭の番号か宣言の一覧で外します)、 確かめられない変更の着地は止めて待たせ、 文書へ写していない裁定は、 それに関わる契約だけを待たせます。
  採用 — OPT1
  本 ADR は裁定の行について C7.2 の「user の逐語」を器の hook が prompt の入口で記録した字と読み (席の打ち直しは逐語でない・pipe approve の逐語は読みの外)、 C5 の「裁定 id」を ruling-check の repo では閉じた台帳の問いの裁定の行に解ける id と読む。 (1) 起票の門 SHALL 席の道具の呼び出しの 3 形を実行の前に断る: label intake:question の create が 4 行か effect の 2 値を欠くか外れる書き・notes に裁定の行を足す書き・引き金の行の無い memo の書き (形は別の決定記録)。 席が起こした子 process の書きは門の外。 この label の bead は台帳の lint と起動の列が契約にも memo にも数えない。 (2) marker が器の名を言う repo で、 器の hook SHALL user が器の plugin を積む対話の session に打った prompt を、 model が読む前に、 問いの有無に依らず逐語のまま event kind UtteranceReceived (actor が human) に 1 件記帳し、 その turn へ発話の ts だけの 1 行を返す。 器が入力欄へ差し込んだ行 (FR1044 の全種)・別の session からの包み・runner と lens は記帳しない。 (3) 口 seat ruling bind SHALL 問いの id と発話の ts を受け、 その ts の発話がちょうど 1 つ在って未だ結ばれず、 問いが開いた台帳の問いである周だけ (問いは発話の後でよい)、 裁定 id <問い id>:<YYYYMMDDTHHMMZ>-1 (時分は発話の分) を発行し、 問いの notes に裁定の行 (4 欄・逐語は発話 event から写して最後の欄) を書き、 close_reason「裁定 <裁定 id>」で閉じ、 裁定 event（裁定を結んだ記録） (RulingReceived に key ruling と utterance) を記帳する。 ほかの周は何も書かずに断る。 seat ruling add SHALL 消える。 (4) 発話 event SHALL 直命の表でない: 状態を持たず、 使い道は bind の写し元と到達点の計測の分類だけで、 逐語を起動行・圧縮の直前の枠・合図・通知・一覧へ運ばない。 (5) main (着地では便の base) の vessel 宣言が ruling-check = true の repo で、 器 SHALL 追跡された file の字から閉じた 3 形 (問いの部分が台帳の接頭辞で始まる問い id の形・batch: と policy: で始まる形) と時刻の形を FR1084 と同じ閉じた規則で数え (意味は読まない・ほかの接頭辞の問い id の形は数えない)、 batch: と policy: の形と opt-in の線の後の時刻の形は key ruling-fixtures (字面の閉じた一覧・完全一致だけ・書式は何も外さない) に在れば数えない。 batch: と policy: の形は裁定の行の裁定 id の欄か束の欄に解ける。 受付は設計の節と契約表の行が引く解けない id と線の後に足した時刻の形を名指して断る。 着地は、 それらを足す差分と、 数える問い id の形の id を持たずに判断の欄を足すか変えるか ruling-check を true から外す差分を FR1010 の留めに掛け (Gated・理由の event は便ごとに 1 件)、 当たった id か欄を名指す。 bead の id だけの欄は数えず、 線の前の引用は doctor が数えるだけ。 (6) effect が document の閉じた問いの裁定 id を main の追跡された file が 1 つも引かない間 (未反映の裁定・ruling-check に依らない)、 器 SHALL 周ごとに置き場の file・doctor の行・tick の alarm unreflected に出し、 その id を acceptance か notes で引く契約と問いに blocks される契約だけを待ち理由 unreflected-ruling:<id> で待たせ、 その便の着地も FR1010 の留めに掛ける。 器の便でない変更は止めず、 経過時間を使わず、 operation は数えない。
  （平易）決めたことを 6 つにまとめます。 まず読み方として、 裁定の行については、 持ち主の言葉とは器が記録した字のことで、 席が打ち直した字は言葉と数えません (便の承認の言葉はこの読みの外で今のまま)。 1 つ目、 席から持ち主への問いは、 台帳に「問い」の印を付け、 概要・技術・理由・推奨の 4 行と、 答えを文書へ写すべきか (document) 操作で済むか (operation) の印を持つ形で立てます。 台帳の書き込みの門は、 形の欠けた問い・席が自分で書く答えの行・引き金の行の無いメモの 3 つを止めます (メモの形は別の決定記録が持ちます)。 門が見るのは席が自分の道具で撃つ書き込みだけで、 席が起こした別の process (別の project の裁定の画面の server など) の書き込みは通します。 問いの印を持つ記録は、 台帳の点検にも便を起こす列にも数えません。 2 つ目、 器の名を書いた目印 (.vessel) を持つ repo では、 持ち主が対話の session に打った文を、 問いの有無に依らず、 AI が読む前に器が一字一句記録し、 席にはその記録の番号だけを返します。 器が自分で差し込んだ行・別の session から届いた文・実装役と審査役の AI の文は記録しません。 3 つ目、 席は結びの口で問いと記録を結び、 器が裁定の番号 (問いの番号・持ち主が打った時分・末尾の 1) を出し、 問いに答えの 1 行を書いて閉じ、 裁定の記録を残します。 1 つの記録は 1 つの裁定にだけ使い、 席が言葉を打つ旧い口は消します。 4 つ目、 この記録は前の器の直命の表ではなく、 状態を持たず、 席へは運びません。 人の手の数えには入れず、 結んだものは承認の側に、 結ばれない数は別の欄に出します。 5 つ目、 宣言の file で ruling-check を選んだ repo では、 文書が引く裁定の番号を器が文字の形で数え、 台帳に無い番号や、 選んだ後に足した旧い時刻の形を受付で断り、 着地でも止めます (止めた便はそのまま待たせ、 理由を 1 回だけ記録し、 撃ち直しの回数には数えません。 ruling-check を外す変更にも裁定の番号が要ります)。 規則の表・決定記録の承認・設計の節の裁定の欄を足すか変える変更も、 この repo の台帳の頭で始まる問いの形の裁定の番号を 1 つ以上持たないと着地で止め (ほかの頭の番号だけの欄は持たないのと同じ)、 台帳の記録の番号だけの欄は数えません。 選ぶ前から在る時刻の形は doctor が数えるだけです。 数えるのは、 この repo の台帳の番号の頭 (接頭辞) で始まる問いの番号だけで、 ほかの頭の番号は引用に数えず、 設計の節などに在っても断りません。 batch: と policy: の形と選んだ後の時刻の形は、 宣言の file の ruling-fixtures (見本の字をそのまま並べた決まった一覧) に一字違わず在れば数えず、 backtick などで囲んでも外れません。 batch: と policy: の形は、 消費側の台帳の答えの行の裁定の番号の欄か束の欄に一致すれば解けます。 6 つ目、 文書へ写すべき裁定を main のどの file も引いていない間は、 それを引く契約と問いを待つ契約だけを待たせ、 doctor と tick の合図で知らせます。 器の便でない写す変更は止めず、 経った時間では判じません。
  （理由）裁定の証拠を持ち主が打った字だけにしたのは、 憲法 C7.2 が承認に持ち主の逐語を求め、 その人の層が会話の記憶を承認の根拠にしないと書くのに、 今の口では席が打ち直した言い換えや記憶違いも同じ形で通るからです。 器が prompt の入口で字を記録し、 席には結ぶ手だけを渡せば、 裁定の字は席の注意に頼らず器が記録した持ち主の字からだけ写ります (記録へ直に書き足すか hook を偽の入力で撃つ偽造は代償として残ります)。 この読みは裁定の行に絞り、 便の承認の逐語は変えません。 結びの口が撃つ席の役割を確かめないのは、 憲法が C7 の対話面を通すと書くのは A1・A3・A4.2 の承認で、 A2 が求めるのは裁定 id を伴う裁定だと読むからです (C7 の機構の欄の「A1〜A4 の承認はすべてこの経路」は承認の受理面を 1 つに保つ文と読み、 承認と役割の確かめは便の承認 pipe approve に残ります。 この読みは orchestrator の読みで、 持ち主が異を唱えれば改めます)。 裁定の証拠は、 席の役割でなく持ち主が打った字の記録です。 記録を問いの有無に依らず全部にしたのは、 持ち主が裁定 09:04Z で全 prompt を記録する推奨を採ったからで、 持ち主は問われる前に指示を出すことが多く、 問いの開閉を見るには文ごとに台帳を読むか古い一覧を読むしかないからです。 代わりに event log は prompt のたびに伸び、 手元に残る字の重さは代償として引き受けます。 前の器の直命の表との違いは、 記録が状態を持たず、 席へ運ぶ読み手を持たないことで、 席へ返すのは番号だけです。 人の手の数えから発話を外したのは、 会話と指示が混ざり機械では分けられないからで、 結ばれない数は隠さず別に出します。 番号の実在を文字の形で数えるのは、 数えは番号の形だけを見るので文書の書式に依らず、 文書の道具の書き出しを待たずに段の順に着地できるからで、 数えるだけで意味は読まず、 形の偶然の一致も数えることは代償として引き受けます。 消費側の台帳が自分の経路で書く答えの行も同じ数えで解けます。 判断の欄に問いの形の番号を求め、 台帳の記録の番号だけを数えないのは、 台帳の記録の番号に席の判断を添えた字が、 裁定の欄として形の検査を通った実測があるからです。 選んだ時点より前の時刻の形を数えるだけにするのは、 引用を持つ 70 本の file のうち 32 本が書き換えない凍った決定記録だからで、 ruling-check を外す変更に裁定を求めるのは、 裁定なしに門を外せないようにするためです。 ruling-check は規則の表の値でなく、 ADR-1010 の置き場の読みどおり repo が自分について名乗る宣言として読みます。 検査を測らないと名乗る ADR-1054 の key と逆に検査を強める向きなので、 manifest に上限の行を置かず、 外すときに裁定を求めます。 数えを自分の台帳の頭の番号に絞り、 見本の字を宣言の閉じた一覧で外すのは、 test の code の見本や決まった done の文の見本まで断ると、 器自身の歯と消費側の repo の見本が通らなくなるからです (orchestrator の決定・持ち主の常設の指示 00:54Z の下)。 外れるのは一覧に一字違わず書いた字だけで、 書式や型では外れません。 ただし一覧へ項目を足す差分に裁定は要らないので、 一覧は裁定なしに開く免除の口で、 歯止めは、 足した項目が差分として着地の審査に見えることと、 一字違わない一致の 2 つだけです。 項目ごとに持ち主の裁定を求めないのは、 見本の字を並べるだけの是認の問いになり、 そうした問いは出さない決まり (要件カタログ R-F7) だからです。 代わりに、 見本を一覧に並べる手と、 裁定なしに足せる免除の口と、 古い項目が残る間その字が数えられないことと、 頭を打ち違えた番号が数えずに通ることは引き受けます。 batch: と policy: の形を束の欄にも解くのは、 消費側の台帳がその欄にも同じ形の id を書くからで、 結びの口が書く行は束の欄を持たないので本 repo の数えは変わりません。 問いの印を型でなく label で見るのは、 消費側の台帳が問いを型 task で立てるからです。 門を席の道具の呼び出しにだけ掛けるのは、 消費側の裁定面の server のように席が起こした別の process が自分の経路で答えの行を書くのを止めないためで、 その経路の偽造は代償として引き受けます。 未反映で関わる契約だけを待たせ、 着地の留めを撃ち直しの回数に数えないのは、 解く手 (裁定を結ぶ・文書へ写す) の多くは便の外に在り、 撃ち直すだけでは解けないからで、 理由は便ごとに 1 回だけ記録して周ごとに増やしません。 経った時間を使わないのは、 時間は写したかどうかと関係が無いからです。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1081（claim）: FR1081 (起票の門の 3 形) のうち、 形の欠けた台帳の問いの create と notes に裁定の行を足す書きの 2 形の根拠と、 門が席の道具の呼び出しにだけ掛かり子 process の書きを通す根拠と、 器が問いとして読む記録を label intake:question の bead に閉じ、 この label を持たない create に形の検査を掛けない根拠。 引き金の行を持たない memo の形は別の決定記録が持つ。
  FR1082（claim）: FR1082 (発話の記帳と裁定の結び) の、 全 prompt の発話 event (裁定 09:04Z)・除く行 (器が差し込んだ行の全種と包み)・marker の repo の範囲・seat ruling bind・裁定 id の形 (bind は -1)・裁定の行・close_reason・裁定 event・4 つの断り・seat ruling add の退役の根拠。
  FR1083（claim）: FR1083 (裁定 id の実在) の、 ruling-check の opt-in と線 (main の宣言で、 着地では便の base の宣言で判じる)・閉じた 3 形と時刻の形の数え (問い id の形は台帳の接頭辞のものだけ・ruling-fixtures の一覧の字面を外す)・batch と policy の解け先 (裁定 id の欄か束の欄)・受付の断りと着地の FR1010 の留め・判断の欄・問い id の形の id を足さずに ruling-check を true から外す差分の留め・doctor の行の根拠。
  FR1084（claim）: FR1084 (未反映の裁定) の、 未反映の定義と、 関わる契約だけを待たせ着地の周はその便を FR1010 の留めに掛けて器の便でない変更を止めない範囲・0 件の周の空の列と doctor の行と alarm の消失・経過時間を使わないこと・operation を数えないこと・ruling-check に依らないことの根拠。
  FR1022（claim）: FR1022 (人手 0 の計測) の改訂の根拠。 発話 event を人由来の数えに入れず、 結んだ発話は裁定 event として承認の側に数え、 結ばれない発話の本数を別の欄に出す。 発話は会話と指示が混ざり機械で分けられないので、 混ぜずに別に見せる。
  FR1065（claim）: FR1065 (直命の表・廃止) の改訂の根拠。 user の逐語が載る記録を承認 event (FR1016) と発話 event と裁定の行 (FR1082) にし、 発話 event を裁定の行の写し元と到達点の計測の分類 (FR1022) にだけ使い、 状態を持たせず席の指示文にも復元にも運ばない、 という直命の表との線を引く (ADR-1045 §2 (2) の削除は保つ)。
  FR1010（implementation）: FR1010 (land の前提) に FR1083 と FR1084 の着地の留めを足す実装側。 FR1050 の留めと同じく、 便を Gated に留めて理由の event を便ごとに 1 件だけ記帳し (同じ理由が続く周は記帳し直さない)、 撃ち直しの上限 (FR1011) に数えず Failed にしない (AC1023・AC1053・AC1054)。
  FR1027（implementation）: FR1027 (管理 tick) の打刻の合図の末尾の alarm (閉じた語 unreflected と floor) に語 unreflected を足す実装側。 alarm は置き場の file だけを読んで決め (台帳も git も撃たない)、 合図を送らない周の席 (FR1078 で止めた席・梯子の列が尽きた席) には doctor の行だけが知らせる。
  FR1068（implementation）: FR1068 (便の自動起動) の起動の列から台帳の問い (label intake:question) を外し、 待ち理由に unreflected-ruling を足す改訂の実装側。 待つのは未反映の裁定を acceptance か notes で引く契約と、 問いに blocks される契約だけ。
  FR1051（implementation）: FR1051 (台帳の lint) で、 label intake:question の bead を epic と decision の型の bead と同じく契約にも memo にも数えず名指さない実装側。 型でなく label で外すのは、 消費側の台帳が問いを型 task で立てるから。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 行き着く原則です。 ADR-1037 のうち、 席が言葉を打つ口 (とその席の確かめ)・時刻の番号・doctor の突き合わせの 3 点と、 ADR-1016 の「逐語は承認の記録にだけ」の規則を置き換えます。 ADR-1045 が消した直命の表は戻しません。 原則は、 持ち主の答えの証拠は持ち主が打った字の記録だけにし、 席はそれを指して結ぶだけ、 というものです。
  改訂状態: current
  置き換える ADR: ADR-1037, ADR-1016
  置き換えられた: なし (現行)
  部分 supersede で、 ADR-1037 から置き換えるのは 3 点 — (a) 書き手の口 seat ruling add --words (席が逐語を打つ口と、 その対話面の席の確かめ・planner の雛形の「裁定を受けた turn で撃つ」の 1 行・この口に掛けた FR1041 と FR1067 の claim の edge) を、 発話を証拠に取る結びの口 seat ruling bind に (bind は承認の受理面でなく、 承認の記帳の権能 FR1041 は便の承認 pipe approve に残る)、 (b) 裁定 id を器が打つ event の ts とする形を、 問い id の形に、 (c) doctor が rules 行の user <時刻> の欄ごとに同じ分の裁定 event を読む突合を、 ruling-check の repo の引用の実在の数え (FR1083 の doctor の行) に。 保つのは RulingReceived の kind (actor が human・便を持たない・detail が逐語・到達点の計測で承認の側)・seat ruling ls・pipe report の rulings の数え。 設計 dialogue-surface.md §4 (orchestrator の作法の 5 本目の行が seat ruling add を撃たせる) と fleet-event-log.md §9 は、 FR1082 の実装より先に着地する設計の行で書き直す。 ADR-1016 から置き換えるのは §2.3 の逐語の置き場の規則 (見出しの「user の言葉は承認 event でしか記帳しない」・規範文「user の逐語 SHALL 承認 event にだけ載る」・§4 の同じ句) で、 逐語は承認 event に加えて発話 event と裁定の行にも載る。 §2.3 の回答の口と経路は変えない。 ADR-1045 §2 (2) の直命の表の削除は保ち、 発話 event はその復活でない (決定 (4))。 ADR-1056 の起票の門と ADR-1010 の vessel 宣言は、 断りと key を足すだけで置き換えない。 ADR-1077 の裁定の指し示しの口には触れない (差し込む行を発話として記帳しないだけ)。
  照会終端 — PRIN-THE-OWNER-TYPES-THE-RULING
  持ち主の答えの証拠は、 持ち主が打った字を器が記録したものだけにし、 席はその字を指して結ぶだけにする。 記録は裁定の写し元であって、 席へ運ぶ指示ではない。
  本 ADR が、 席が逐語を打つ口・器の外の server・問いの在る周だけの記録を退け、 発話を全部記録しつつ席へは id だけを返す形を採ったのはこの原則に行き着く (これ以上は遡らない照会終端)。 射程は裁定の証拠で、 便の承認 (pipe approve) の逐語には本 ADR では当てない。
options:
  - id: "OPT1"
    name: "台帳の問いと、 持ち主の全 prompt の発話 event と、 結びの口を置き、 引用の実在と未反映を字の数えで判じる"
    text: |
      器が問いとして読む記録を label intake:question の台帳の問い (4 行と effect の 2 値) に閉じ、 台帳の lint と起動の列はこの label の bead を契約にも memo にも数えない。 起票の門は席の道具の呼び出しの 3 形を断り、 席が起こした子 process の書きは門の外で通す。 器の hook が持ち主の prompt を問いの有無に依らず発話 event に記帳し、 その turn に発話の ts だけを返す。 席は seat ruling bind で問いと発話を結び、 器が裁定 id を発行して裁定の行・close・裁定 event を書く。 席が逐語を打つ口 seat ruling add は消す。 ruling-check を宣言した repo では、 FR1083 と FR1084 が共有する閉じた規則が追跡された file の字から裁定 id の形を数え (問い id の形は台帳の接頭辞のものだけ・batch: と policy: の形と線の後の時刻の形は ruling-fixtures の一覧に在る字面を外す・batch: と policy: の形は束の欄にも解ける)、 受付で断り、 着地では FR1010 の留めに掛ける。 未反映の裁定は、 それを引く契約と問いに blocks される契約だけを待たせる。 決め手は分析 (OPT2〜OPT7 の欠点) と裁定 00:05Z・00:54Z、 記録の範囲は裁定 09:04Z (全 prompt を記録する推奨を採る)。
      （平易）選んだ案です。 席から持ち主への問いは、 台帳に決まった形 (概要・技術・理由・推奨の 4 行と、 答えを文書へ写すべきかの印) で立てます。 器の名を書いた目印を持つ repo で、 持ち主が器の plugin を積む対話の session に打った文は、 問いの有無に依らず、 AI が読む前に器が一字一句そのまま記録し (器が自分で差し込んだ行・別の session から届いた文・実装役と審査役の AI の文は除きます)、 席にはその記録の番号だけを返します。 席は結びの口で問いと記録を結び、 器が裁定の番号を出して、 問いに答えの 1 行 (持ち主の言葉は記録から写す) を書き、 問いを閉じます。 席が言葉を打つ今の口は消します。 問いの印を持つ記録は、 台帳の点検にも便を起こす列にも数えません。 選んだ repo では、 文書が引く裁定の番号を器が文字の形で数えて台帳に本当に在るかを確かめ、 文書へ写していない裁定は関わる契約だけを待たせます。 数えるのは、 この repo の台帳の番号の頭 (接頭辞) で始まる問いの番号と、 宣言の見本の一覧 (ruling-fixtures) に無い batch: と policy: の形と、 同じ一覧に無い、 選んだ後に足した時刻の形だけで、 batch: と policy: の形は台帳の答えの行の束の欄にも解けます。 良い点は、 裁定の字が器の記録した持ち主の字からだけ写って席の手順に字を打つ口が無く、 問われる前の指示も結べ、 ほかの便を止めず、 test の見本は断られず、 持ち主の文の経路で台帳も git も読まないことです。 代わりに、 持ち主の文が全部手元の記録に残って打つたびに伸び (消す口は無い)、 打つたびに記録の鍵を取るので鍵の待ちが長い host では遅れうり、 結ばれない文の数は会話の量を映すだけで、 版を跨ぐ約束が増え、 席が記録へ偽の発話を直に書き足すか器の hook を偽の入力で撃てば偽の発話を作れ、 席が起こした別の process からの書き込み (台帳の書き込みの門の外) も塞がず、 文字の数えは意味を読まず (番号を引くだけで写したことになり、 形の偶然の一致も数える)、 結びの口は撃つ人の役割を見ず、 便の承認の言葉は席が打つまま残り、 同じ秒の文は結べず、 器の便でない変更が足す裁定の欄は doctor の数えでしか見えず、 止めた便は解く手が来るまで待ち続け、 見本の字を一覧に並べる手が要り (古い項目が残るとその字はいつまでも数えられない)、 一覧へ足すのに裁定は要らないので一覧は裁定なしに開く抜け道でもあり (歯止めは足した差分が見えることと一字違わない一致だけ)、 頭を打ち違えた番号も数えずに通ることを引き受けます。
      利点: 裁定の逐語は hook が記録した持ち主の字からだけ写り、 席の手順の中に字を打つ口が無い (DR1)
      利点: 問われる前の指示も発話として残り、 問いを後から起こして結べる (DR2)
      利点: 引用の実在を受付と着地が確かめ、 bead の id だけの判断の欄（裁定を書く欄）や opt-in の線（検査を始めた commit）の後の時刻の形を通さない。 数えは id の形だけを見るので文書の書式に依らない (DR3)
      利点: 未反映は関わる契約だけを待たせ、 写す変更 (器の便でない変更) は止めない (DR4)
      利点: 発話の記録は状態を持たず、 逐語を席へ運ぶ読み手を持たない。 席へ返すのは発話の ts だけ (DR5)
      利点: hook は台帳も git も読まず event を 1 行足すだけで、 器の外の server にも道具の書き出しにも依らず、 段の順に着地できる (DR6)
      利点: 消すもの (席が逐語を打つ口・新しい裁定の時刻の id・doctor の同じ分の突合) を名指して足す (DR7)
      利点: test の code の見本と決まった done の文の見本は、 ほかの接頭辞の問い id の形か ruling-fixtures の一覧で外れて門に断られず、 束の欄にも解くので消費側の台帳の束の欄の id も引ける (DR3・DR6)
      利点: 台帳の問いは型でなく label で lint と起動の列から外すので、 問いを型 task で立てる消費側の台帳でも、 問いが設計 pointer の無い契約として名指されも待たされもしない (DR6)
      欠点: 持ち主の prompt が全部、 長さに依らず手元の event log に逐語で残り (雑談や誤って打った秘密の字も)、 log は prompt のたびに 1 件ずつ伸びる。 log は host の置き場に在り、 追跡も公開もしないが、 記録を消す口は器に無い (N1)
      欠点: prompt のたびに hook が event log の lock を取って 1 行足すので、 lock の待ちが長い host では prompt が遅れうる (hook の時間の予算は無い)
      欠点: 結ばれない発話が大半になり、 計測の別の欄の本数は会話の量を映すだけで、 指示の量とは読めない
      欠点: event の kind 1 つ・裁定 event の key 2 つ・vessel 宣言の key 2 つ (ruling-check と ruling-fixtures)・起動の列の待ち理由 1 つ・受付の断りが増え、 跨版の面が広がる。 古い版の読み手は未知の kind と key を読めない (ADR-1037 と同じ代償)
      欠点: 席が event log を直に書くか、 hook の口を偽の入力で撃てば、 偽の発話を作れる。 器はこの経路を塞がず、 塞ぐのは手順の中の口 (字を打つ口の不在と起票の門) だけである。 起票の門は席の道具の呼び出しにだけ掛かり、 席が Bash から起こした子 process の書き (消費側の裁定面の server など) は門の外で通るので、 子 process を通した裁定の行も塞がない
      欠点: 字の数えは意味を読まないので、 id を引くだけで未反映は解け、 引用が本当に裁定を写したかは確かめない。 形の偶然の一致も数える
      欠点: ruling-check を選んだ repo (器自身も) は batch: と policy: の形と線の後の時刻の形の見本を ruling-fixtures に並べる手が要り、 一覧に古い項目が残るとその字面はいつまでも数えられない。 一覧に項目を足す差分は裁定を要らないので、 一覧は裁定なしに開く免除の口で、 載せた字面は台帳に解けなくても受付と着地を抜ける。 歯止めは、 足した項目が差分として着地の審査に見えることと、 載せた字面が一字違わない完全一致でしか外れないことの 2 つだけである (どの版の宣言を読むか・差分が自ら足した項目で自分を外せるかは設計 § が決める)。 自分の接頭辞の問い id の形の見本は一覧で外せず、 ほかの接頭辞の問い id の形は、 接頭辞を打ち違えた引用でも数えずに通る
      欠点: 結びの口は承認の受理面でないので撃ち手の役割を確かめない (証拠は発話で、 断りは 4 形に閉じる。 R-C7-1 の役割の確かめは便の承認 pipe approve にだけ残る)。 登録 row の無い、 持ち主が自分で開いた session の発話も裁定になる
      欠点: 便の承認 (pipe approve) の逐語は席が打つ形のまま残り、 同じ秒に 2 つの session で打たれた発話は id で一意に指せず結べない
      欠点: 器の便でない変更は着地の判定を通らないので、 そこで足した判断の欄の引用は doctor の数えでしか見えない
      欠点: 着地の留めは撃ち直しの上限に数えないので、 解く手 (裁定を結ぶ・文書へ写す) が来るまで便は Gated に留まり続ける (理由の event は便ごとに 1 件で増えない)
    verdict: adopted
    reason: "決め手は分析 (OPT2〜OPT7 の欠点) と裁定 00:05Z・00:54Z、 記録の範囲は裁定 09:04Z (全 prompt を記録する推奨を採る)。"
  - id: "OPT2"
    name: "席が逐語を打つ今の口 (seat ruling add) を残し、 引用の実在の検査だけを足す"
    text: |
      seat ruling add と時刻の id をそのまま使い、 追跡された file の引用が RulingReceived に解けるかだけを確かめる。 決め手は分析 (字が持ち主のものかを確かめられない)。
      （平易）席が持ち主の言葉を打つ今の口を残し、 文書が引く番号が記録に在るかだけを足して確かめる案です。 器の変更が小さく、 持ち主の文を全部は記録せず、 口を撃てる席を対話の席に限る確かめも残る点で勝ります。 けれども、 言葉は席が打つので、 言い換えや記憶違いも同じ形で通り、 字が持ち主のものかは確かめられません。 答えが何の問いへのものかも残らず、 写し忘れを数えられず、 時刻の番号は同じ分の裁定を区別できないので退けました。
      利点: 器の変更が小さい。 hook に記帳を足さず、 口・歯・doctor の突合をそのまま使う
      利点: 持ち主の prompt を全部は記録しないので、 手元の log に持ち主の字が溜まらない
      利点: 口の撃ち手を対話面の席に限る確かめ (R-C7-1) が残る
      欠点: 逐語は席が打つ字で、 言い換え・記憶違い・聞いた気がする判断も同じ形で通る。 実在の検査は「その event が在るか」までで、 字が持ち主のものかは確かめない (DR1)
      欠点: 裁定が何への答えかが残らず、 文書へ写すべきかも分からないので、 未反映を数えられない (DR4)
      欠点: 時刻の id は分までで、 同じ分の裁定を一意に指せない (ADR-1037 の代償のまま)
    verdict: rejected
    reason: "決め手は分析 (字が持ち主のものかを確かめられない)。"
  - id: "OPT3"
    name: "裁定面の server だけが裁定 id を発行する (消費側の project の形に加わる)"
    text: |
      持ち主は裁定面の画面に答えを書き、 その server が id を発行して台帳へ書く。 器は発話を記録しない。 決め手は分析 (scribe2 の持ち主はその面を通らず、 器の門が器の外の server に依る)。
      （平易）別の project が既に使う形に加わり、 持ち主が裁定の画面に答えを書くと、 その server だけが番号を出して台帳へ書く案です。 席は字を打てず、 番号を出す所が 1 つに閉じ、 器は持ち主の文を記録せず hook に記帳も足さず、 答える場所が会話と分かれて明快な点で勝ります。 けれども、 その画面と server は器の外の別の project のもので、 scribe2 の持ち主は端末の対話で答えるので加われません。 器の門の働きが外の server の有無に依り、 server の無い repo では記録できず、 会話の中で出た指示は画面へ書き直さない限り結べないので退けました。
      利点: 消費側の project の 1 つが既に使う形で、 持ち主が画面に書いた字を server が記録するので、 席は字を打てない
      利点: id の発行が 1 か所に閉じ、 器は hook に記帳を足さない
      利点: 答えを書く面が会話から分かれ、 何に答えたかが画面で明快
      欠点: 裁定面は消費側の project が持つ器の外の server で、 scribe2 の持ち主は端末の対話の session で答える。 scribe2 はその面に加われない (DR6)
      欠点: 器の門の働きが器の外の server の在否に依り、 server を持たない repo では裁定を記録できない (DR6)
      欠点: 会話の中で出た指示は画面へ写し直さない限り記録されず、 問われる前の指示を結べない (DR2)
    verdict: rejected
    reason: "決め手は分析 (scribe2 の持ち主はその面を通らず、 器の門が器の外の server に依る)。"
  - id: "OPT4"
    name: "引かれた id の集合を、 文書の道具の側 (隣の project) の書き出しから読む"
    text: |
      字の数えを器に置かず、 文書を生成する道具が引用の集合を書き出し、 器はそれを読む。 決め手は分析 (書き出しの着地を待つと段の順が崩れる)。
      （平易）文書が引く番号を器が文字で数えるのでなく、 文書を作る道具 (隣の project) が引用の一覧を書き出し、 器はそれを読む案です。 文書の構造を知る読み手が拾うので偶然の一致を数えず、 読み手が 1 つに揃って器は字を数える仕組みを持たずに済み、 どの欄の引用かまで分かる点で勝ります。 けれども、 書き出しが出来上がるのを待つので、 確かめと未反映の段の着地が後ろへずれて順が崩れ、 器が隣の project の版に依り、 その道具を使わない repo や、 規則の表と code の中の番号を数えられないので退けました。
      利点: 文書の構造を知る読み手が引用を拾うので、 形の偶然の一致を数えない
      利点: 文書の読み手が 1 つに揃い、 器は字を数える関数を持たない
      利点: 引用がどの節のどの欄に在るかまで分かる
      利点: 文書の構造で見本と引用を分けるので、 見本の一覧も接頭辞の限りも要らない
      欠点: 書き出しの着地が先に要り、 実在と未反映の段の着地がその後になる (段の順が崩れる) (DR6)
      欠点: 書き出しの形式が器の跨版の約束に加わり、 器が隣の project の版に依る (DR6)
      欠点: その道具を使わない repo の引用と、 rules manifest や code の中の字は数えられない (DR3)
    verdict: rejected
    reason: "決め手は分析 (書き出しの着地を待つと段の順が崩れる)。"
  - id: "OPT5"
    name: "未反映の裁定が在る間は起動の列の全部を待たせる"
    text: |
      床の検査と同じく、 未反映が 1 件でも在れば列の全部を待たせる。 決め手は分析 (関わらない契約まで止まる)。
      （平易）文書へ写していない裁定が 1 つでも在る間は、 起こす便を全部待たせる案です。 写す手が最優先になり、 判定が単純で、 全部を待たせる前例と同じ形の点で勝ります。 けれども、 その裁定に関わらない契約まで止まり、 写す手 1 つの遅れが全部の便を止めます。 写す変更の多くは器の便でないので、 便を止めても写す手は速くならないので退けました。
      利点: 写す手が最優先になり、 未反映が長く残らない
      利点: 判定が単純で、 引く bead や blocks の辿りが要らない
      利点: 列の全部を待たせる先例 (HostBusy) と同じ型
      欠点: 裁定に関わらない契約まで止まり、 写す手 1 つの遅れが host の全部の便を止める (DR4)
      欠点: 写す変更の多くは器の便でないので、 列を止めても写す手は速くならない (DR4)
    verdict: rejected
    reason: "決め手は分析 (関わらない契約まで止まる)。"
  - id: "OPT6"
    name: "発話を、 開いた台帳の問いが在る周だけ記録する (grill の推奨)"
    text: |
      hook が prompt ごとに開いた問いが在るかを見て、 在る周だけ発話を記録する。 grill の論点 6 の推奨で、 00:54Z の常設の指示が承けていた形。 問われる前の指示は、 問いを起こした後に持ち主が言い直せば結べる。 決め手は分析 (問われる前の指示を言い直さずには結べず、 開いた問いを prompt の経路で知る手が要る) と裁定 09:04Z (持ち主は全 prompt を記録する推奨を採った)。
      （平易）持ち主の文を、 台帳の問いが開いている間だけ記録する案です。 議論の中で最初に推された形です。 手元に残る持ち主の文が少なく (雑談や誤って打った秘密の字が残りにくい)、 記録の多くが答えの候補になり、 「問いへの答えだけを記録する」と目的が明快で、 発言を全部持った前の器の直命の表との違いが誰にも分かり、 問われる前の指示も、 問いを立てた後に言い直せば結べる点で勝ります。 けれども、 持ち主は問われる前に指示を出すことが多く、 結ぶには言い直してもらう手が要ります。 また、 問いが開いているかを知るには、 文を打つたびに台帳を読む (1 回約 0.35 秒かかる) か、 便を起こす周に器が書く一覧を読む (問いを立てた直後の答えが次の周まで記録されない) かのどちらかになり、 結果が問いの立て方の順に依ります。 持ち主は裁定 (2026-09-28T09:04Z) で全部を記録する推奨を採ったので退けました。
      利点: 記録が問いの在る周に限られ、 手元の event log に残る持ち主の字が少ない (雑談や誤って打った秘密の字が残りにくい)
      利点: 記録した発話の多くが答えの候補になり、 結ばれない発話の本数が小さく、 計測の別の欄が読みやすい
      利点: 「問いへの答えだけを記録する」と目的が字面で明快で、 発言を全部持った直命の表との違いが誰にも分かる
      利点: 問われる前の指示も、 問いを起こした後に持ち主が言い直せば結べる
      欠点: 持ち主は問われる前に指示を出すことが多く、 その字は残らず、 結ぶには持ち主に言い直してもらう手が要る (DR2)
      欠点: hook が開いた問いを知るには、 prompt ごとに台帳を読む (1 回約 0.35 秒が prompt の経路に入る) か、 dispatch の周が書く置き場の file を読む (問いを起こした直後の答えが次の周まで記録されない) かのどちらかになる (DR6)
      欠点: 答えが問いを開く前か後かで扱いが分かれ、 結果が席の問いの起こし方の順に依る (DR2)
    verdict: rejected
    reason: "決め手は分析 (問われる前の指示を言い直さずには結べず、 開いた問いを prompt の経路で知る手が要る) と裁定 09:04Z (持ち主は全 prompt を記録する推奨を採った)。"
  - id: "OPT7"
    name: "effect を 5 値 (srs / rules / adr / note / none) にする"
    text: |
      問いの時点で答えを写す置き場の種類を名指す。 決め手は分析 (器の判定に要るのは写すべきかだけ)。
      （平易）問いの時点で、 答えを写す先の種類を 5 つ (要件書・規則の表・決定記録・メモ・写さない) から選ぶ案です。 写す先が早く分かり、 置き場ごとに数えられ、 写さない理由を分けて持てる点で勝ります。 けれども、 器は main の文字を数えて写したかを判じるので、 写す先の種類は判定を変えません。 要るのは写すべきかどうかの 2 つだけで、 値が増えると門と test が増え、 1 つの答えを複数の場所へ写す問いに合わず、 選ぶ時の迷いも増えるので退けました。
      利点: 写す先の種類が問いの時点で分かり、 写す手が迷わない
      利点: 置き場ごとに件数が見え、 写しの確かめを置き場に絞れる
      利点: 写さない理由 (note・none) を分けて持てる
      欠点: 未反映は main の追跡された file の字で判じるので、 置き場の種類は判定を変えない。 器に要るのは「文書へ写すべきか」の 2 値だけ (DR7)
      欠点: 閉じた値と起票の門の歯が増え、 1 つの答えを複数の置き場へ写す問いに合わない
      欠点: note と none と operation の違いが曖昧になり、 起票の時点の迷いが増える
    verdict: rejected
    reason: "決め手は分析 (器の判定に要るのは写すべきかだけ)。"
