retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「席」は器が立てる対話の AI の session、 「持ち主」は器を使って決める人 (user)、 「台帳」は仕事と裁定を記録する beads です。 これまで持ち主の決め (裁定) は、 席が持ち主の言葉を自分で打ち直して記録していたので、 本当に持ち主の字か、 文書が引く裁定の番号が本当に在るか、 決めたことが文書に写されたかを、 器は確かめられませんでした。 本 ADR は、 席から持ち主への問いを台帳の決まった形 (台帳の問い) に立てること、 器の名を書いた目印を持つ repo で、 持ち主が器の plugin を積む対話の session に打った文を器が一字一句そのまま全部記録すること (発話 event・器が差し込んだ行と別の session から届いた文は除く)、 席は問いとその記録を結ぶだけで言葉を打てないこと、 宣言で選んだ repo では文書が引く裁定の番号が本当に在るかを、 どの repo でも文書へ写していない裁定を、 器が文字を数えて確かめることを決めます。 台帳の問いは、 台帳の点検にも便を起こす列にも数えません。 結びの口は承認を受ける口ではなく、 便の承認とその言葉は今のままです。 要件 FR1081〜FR1084 を支え、 FR1022・FR1065 の改訂の理由を持ち、 FR1010・FR1027・FR1051・FR1068 の改訂に実装の形を与え、 ADR-1037 と ADR-1016 の一部を置き換えます。 記録する範囲は持ち主が裁定 (2026-09-28T09:04Z) で全部と決め、 記録は文を打つたびに伸びます。
approval:
  who: 持ち主
  date: 2026-09-28
  ruling: "t3-hub.74.60.1:20261004T0113Z-1（取り込みの裁定・器の記録の裁定 id の字 = user 2026-09-28T00:05Z・user 2026-09-28T00:54Z・user 2026-09-28T09:04Z・器の記録は器の台帳の裁定 id を名指さない）"
  verbatim: "tsuzuri の台帳 t3-hub.74.60.1 の notes に在る（この file に写さない・器の記録は器の台帳の裁定 id を名指さない）"
  surface: R-8
consequences:
  - "この判断で良くなること 4 つと、 代わりに引き受けること 9 つです。 良くなるのは、 裁定の字が器の記録した持ち主の字からだけ写り、 席の手順に字を打つ口が無いこと、 問いと答えと写すべきかが台帳に残り写し忘れを器が数えること、 選んだ repo で確かめられない引用が成果に入らず、 test などの見本は断られないこと、 直命の表を戻さずに言葉を結べ、 結ばれない文の数も見えることです。 引き受けるのは、 持ち主の文が全部手元に残って打つたびに記録が伸び、 消す口が無いこと、 版を跨ぐ約束が増えること、 席が記録へ偽の発話を直に書き足すか器の hook を偽の入力で撃てば偽の発話を作れ、 席が起こした別の process からの書き込みも塞がないこと、 文字の数えは意味を読まず、 裁定を実装する契約は文書が先に番号を引くまで待つこと、 結びの口は承認を受ける口でなく撃つ人の役割を見ないこと、 便の承認や同じ秒の文などの穴が残り、 止めた便は解く手が来るまで待ち続けること、 旧い突き合わせが消え、 一度選ぶと裁定なしには外せないこと、 旧い口を使う test と設計を先に書き換える要があること、 見本の字を宣言の一覧に並べる手が要り、 その一覧へは裁定なしに足せ (歯止めは差分が見えることと一字違わない一致だけ)、 古い項目や頭を打ち違えた番号は数えずに通ることです。"
  - "良い結果: 裁定の字は hook が記録した持ち主の字からだけ写り、 席の手順に字を打つ口が無い (偽造の経路は CSQ-N3)"
  - "良い結果: 問いと答えの組と、 答えを文書へ写すべきかが台帳に残り、 写し忘れを器が数え、 関わる契約だけを待たせる"
  - "良い結果: ruling-check を選んだ repo では、 解けない引用・bead の id だけの判断の欄・opt-in の線の後の時刻の形が便の成果に入らず、 test の code と決まった done の文の見本 (ほかの接頭辞の問い id の形と ruling-fixtures の一覧の字面) は断られない"
  - "良い結果: 直命の表を戻さずに裁定の言葉を持ち主の字に結び、 結ばれない発話の本数も計測に見える (隠さない)"
  - "代償: 持ち主の prompt が全部、 手元の event log に逐語で残って prompt のたびに伸び (lock の待ちが長い host では prompt も遅れうる)、 記録を消す口は器に無い"
  - "代償: 跨版の面が増える (kind 1・裁定 event の key 2・vessel 宣言の key 2 〔ruling-check・ruling-fixtures〕・待ち理由 1・受付の断り)。 古い版の読み手は未知の kind と key を読めない"
  - "代償: 偽の発話は event log の直の書きか hook の口の偽の入力で作れ、 器はそこを塞がない。 起票の門は席の道具の呼び出しにだけ掛かるので、 席が起こした子 process の書く裁定の行も通る"
  - "代償: 字の数えは意味を読まないので、 id を引くだけで未反映は解け、 形の偶然の一致も数える。 裁定を実装する契約がその id を引くと、 設計の節など器の便でない変更が先に id を main に載せるまで待つ (設計 → 契約の順を拘束する)。 batch: と policy: の形の字句は設計 § が閉じ、 code の名前付きの引数と型注釈 (main の .rs に 74 行) を拾わないようにする"
  - "代償: 結びの口は承認の受理面でなく撃ち手の役割を確かめない (R-C7-1 の役割の確かめは便の承認 pipe approve にだけ残る) ので、 持ち主が自分で開いた登録 row の無い session の発話も裁定になる"
  - "代償: 便の承認の逐語は席が打つ形のまま残り、 同じ秒の 2 つの発話は結べず、 器の便でない変更が足す判断の欄は doctor でしか見えない。 留めの便は解く手が来るまで Gated に留まる"
  - "代償: doctor の同じ分の突合は消え、 ruling-check を持たない repo では裁定の引用を数えない。 一度選んだ repo は、 問い id の形の裁定なしに門を外せない"
  - "代償: seat ruling add を使う歯・使い方の行・外形の snapshot と、 設計 dialogue-surface.md §4 の作法の行・fleet-event-log.md §9 を、 bind の実装より先に書き換える要がある"
  - "代償: ruling-check を選んだ repo (器自身も) は batch: と policy: の形と線の後の時刻の形の見本を ruling-fixtures に並べる手が要り、 一覧に古い項目が残るとその字面はいつまでも数えられない。 一覧に項目を足す差分は裁定を要らないので、 一覧は裁定なしに開く免除の口で、 載せた字面は台帳に解けなくても受付と着地を抜ける。 歯止めは、 足した項目が差分として着地の審査に見えることと、 載せた字面が一字違わない完全一致でしか外れないことの 2 つだけである (どの版の宣言を読むか・差分が自ら足した項目で自分を外せるかは設計 § が決める)。 自分の接頭辞の問い id の形の見本は一覧で外せず、 ほかの接頭辞の問い id の形は、 接頭辞を打ち違えた引用でも数えずに通る"
note: |
  器の元の file: scribe2/design-intent/decisions/ADR-0083-rulings-bind-ledger-questions-to-recorded-utterances.html
  器の表紙の頭: 設計判断記録 (ADR) scribe2 — 問いと裁定の記録
  器の表紙: 状態accepted選択肢7件 (OPT1–OPT7)結果良い 4 / トレードオフ 9版v0.1.0 / 2026-09-28
  器の表紙: 正当化する要件: SRS-SCRIBE2-MVP の FR1081・FR1082・FR1083・FR1084・FR1022・FR1065・FR1010・FR1027・FR1068・FR1051
  器の表紙: 想定読者: scribe2 の開発 session と user — 器の内部と Rust の専門知識は不要 (専門語はやさしい言葉を併記)
  器の承認の欄: 裁定 (user)・user・裁定 id user 2026-09-28T00:05Z (文書運用の強制を案 A で進める) と user 2026-09-28T00:54Z (決めてほしいことは推奨で進める、 の常設の指示)。 逐語は台帳にだけ在る・裁定済
  器の承認の欄: 裁定 (user・発話を記帳する範囲)・user・裁定 id user 2026-09-28T09:04Z (全 prompt を記録する推奨を採る)。 逐語は台帳にだけ在る・裁定済
  器の承認の欄: 設計 (orchestrator)・orchestrator・2026-09-28 草稿 v6 (SRS 版 0.28 の最終文の FR1081〜FR1084 と FR1010・FR1022・FR1027・FR1051・FR1065・FR1068 の改訂を受け、 裁定の口・EventKind・hook の UserPromptSubmit・起票の門・起動の列の待ち理由・rules 行の裁定の欄の形を現物で読んだ。 見本の数え方 (台帳の接頭辞・ruling-fixtures・束の欄) と A2 と C7 の経路の読みは、 持ち主の常設の指示 00:54Z の下の orchestrator の決定。 拘束する constitution の版 0.5.0)・作成
  器の案の章の要約: 候補を 7 つ並べます。 台帳の問いと持ち主の全部の文の記録と結びの口を置き、 引用を文字で数える案 (選んだ案)、 席が言葉を打つ今の口を残して引用の確かめだけを足す案、 別の project の裁定の画面の server だけが番号を出す案、 文書の道具が書き出す引用の一覧を読む案、 写していない裁定がある間は全部の便を止める案、 問いが開いている間だけ持ち主の文を記録する案 (持ち主は裁定で全部を記録する案を採りました)、 写し先の種類を 5 つに分ける案です。
  器の専門語の説明: 本文に出てくる専門語 11 個を、 やさしい言葉で説明します。
  ・台帳の問い（ledger question）: 席から持ち主 (user) への問いを記録する台帳の bead (label intake:question)。 本文に概要・技術・理由・推奨で始まる 4 行を、 metadata に effect (document = 答えを文書へ写すべき問い・operation = 答えが操作で済む問い) を持つ。 台帳の lint と起動の列は、 型でなく label でこの bead を外す。 runner の質問 record (ADR-1016) とは別。
  ・発話 event（utterance event）: 持ち主が器の plugin を積む対話の session に打った prompt を、 model が読む前に器が逐語のまま残す event (kind UtteranceReceived・actor は human・発話を指す値は ts)。 器が入力欄へ差し込んだ行・別の session からの包み・runner と lens は残さない。 人由来の数えに入れず、 結んだものは裁定 event として承認の側に数える。
  ・裁定 id（ruling id）: 持ち主の裁定を一意に指す id。 結びの口が発行する問い id の形 (問いの id・発話の UTC の年月日と時分・消費側の台帳の形に揃えた通し番号 1 を並べた形) で、 台帳の問いの裁定の行が持つ。 batch: と policy: で始まる形は、 消費側の台帳が自分の経路で書く裁定の行の裁定 id の欄か束の欄に解ける。 引用に数えるのは、 問いの部分が台帳の接頭辞で始まる問い id の形と、 ruling-fixtures の一覧に無い batch: と policy: の形と時刻の形で、 ほかの接頭辞の問い id の形は数えない。 ADR-1037 の時刻の形は、 opt-in の線の前の引用は数えるだけにし、 線の後に足した引用は一覧に無ければ断る。
  ・裁定の行（ruling line）: 台帳の問いの notes に書く 1 行。 裁定 id の欄で始まり、 裁定 id・問い・発話の ts・逐語の 4 欄をこの順に持ち (SRS FR1082 と同じ順)、 逐語の改行は \n の 2 字に写す。 逐語を最後に置くのは持ち主の字の中の「・」で欄が割れないため。 消費側の台帳の行は束の欄も持ちうり、 FR1083 は batch: と policy: の形をこの欄にも解く (問い id の形は裁定 id の欄だけ)。 本 repo では結びの口だけが書き (束の欄は無い)、 席の道具の呼び出しが足す書きは起票の門が断る。 消費側の台帳は自分の経路で書く。
  ・裁定 event（ruling event）: 裁定を逐語付きで残す event の kind RulingReceived (ADR-1037)。 本 ADR 以後は結びの口だけが書き、 問いの id・裁定 id・発話の ts を持つ。 到達点の計測では承認と同じ側に数える。
  ・opt-in の線（opt-in line）: vessel 宣言の ruling-check が main の履歴で初めて true になった commit。 これより前から在る時刻の形の引用は数えるだけにし、 後に足された時刻の形は、 ruling-fixtures の一覧に在るものを除き断る。
  ・判断の欄（judgement field）: rules 行の ruling 欄・ADR の approval の裁定の欄・設計の節の裁定の欄の閉じた 3 つ。 着地の差分がこれを足すか変えるときは、 問いの部分が台帳の接頭辞で始まる問い id の形の裁定 id を 1 つ以上持つ。 bead の id だけの欄は数えない。 ruling-check を true から外す差分も、 問い id の形の裁定 id を足さなければ着地で止まる。
  ・未反映の裁定（unreflected ruling）: effect が document の閉じた台帳の問いの裁定 id のうち、 main の追跡された file が 1 つも引かないもの (引用は FR1083 と同じ規則で数える)。 経過時間では判じず、 operation は数えない。 引く契約と問いに blocks される契約だけを待たせ、 着地ではその便を Gated に留める (FR1010)。
  ・直命の表（directive table）: 前の器が持ち主の発言を 1 件ずつ状態付きで持ち、 復元で席へ運んだ記録 (ADR-1031)。 ADR-1045 §2 (2) で消えた。 発話 event は状態を持たず席へ運ばないので、 これの復活でない。
  ・起票の門（ledger write gate）: 器の plugin を積む席の hook が bd / bdw の書きに掛ける門 (ADR-1056)。 本 ADR で 3 つの書きの形 (形の欠けた台帳の問い・notes に足す裁定の行・引き金の行の無い memo) を断る。 見るのは席の道具の呼び出しだけで、 席が起こした子 process の書きは門の外。 この 3 形は plugin の門だけが断り、 host-guard は掛けない。
  ・vessel 宣言（vessel declaration）: repo が器に自分について名乗る設定 file .vessel.toml (tracked・ADR-1010)。 本 ADR で任意 key ruling-check と ruling-fixtures (引用に数えない見本の字面の閉じた一覧・完全一致だけで書式は何も外さない・ruling-check と同じく版を跨ぐ形) を持てる。 この key は規則の表の値でなく repo が名乗る opt-in として、 ほかの key と同じく読む (C1・ADR-1010)。 検査をゆるめる名乗り (ADR-1054) と逆に検査を強める向きなので manifest に上限の行を置かず、 代わりに外す差分に裁定を求める。 true の repo だけが裁定 id の実在を確かめ (main の宣言で、 着地では便の base の宣言で判じる)、 key の無い repo は数えも断りもせず doctor の行がその旨を出す。 true から外す差分は問い id の形の裁定 id を要る。
  器の頁の末: このページは、大もとの機械データ (正本) から自動で組み立てられています。構造は機械が自動で検査し、内容が元データに忠実かは独立のレビューで確かめます。
