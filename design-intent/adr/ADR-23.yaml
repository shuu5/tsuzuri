produced: [NFR4, R-34]
note: 逐語は束 batch:20260929T2152Z-1 の t3-hub.52.133 の notes。要件 NFR4 の値は同じ束の t3-hub.52.134（裁定 id = t3-hub.52.134:20260929T2152Z-1）。同じ commit で、要件書に NFR4、規則の表に R-34、憲法 P-2 の relations に R-34、ノート surface-wave23b に 6 行と 6 節、計画 surface-plan に字を足し、判断の記録の封（anchors/adr-seals.yaml）に ADR-23 の行を足す（folio check --freeze-adrs）。数と測りの条件と歯の壊しの確かめは、席が問いの bead の notes に記帳する（起草の作業場は片付けで消える）。試作は main 6d7e98e5 の写しで起こし、main 3d57d349 の写しに 6 行を 1 つずつ当て直した写しで xtask の check と歯の噛みを見た（ノート surface-wave23b の 18〜23 行目）。
