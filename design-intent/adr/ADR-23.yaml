# 判断の記録 ADR-23 — 面の server を「見ている人が居る時だけ・入力が変わった所だけ」読む形に替える
# 問いは台帳の t3-hub.52.133（承認）と t3-hub.52.134（要件 NFR4 の値）。根拠の数と測りの条件と歯の確かめは、席が t3-hub.52.133 の notes に記帳する。
id: ADR-23
title: 面の server の外の読みと台帳の読みと読み解きを、受け手が居る時だけ、入力の印が動いた所だけ行う
status: accepted
date: 2026-09-29
context: |
  持ち主は、面の server（tz surface serve）が重いので、要件を満たしつつ軽くするために方法を根本から見直す必要はないかと問うた。席の実測（2026-09-29）では、配る tz を最適化の組み立て（release）に替えた後も、tsuzuri の server は頁を開いている間に自分と子で約 0.39 core を使い、器の doctor を 60 秒に約 30 本撃った。
  起草役の code の読みと実測で、重さは 4 つの所から来ていた。(1) 撃ち直しの単位が口の読みで、account board の口は前の集めから 5 秒を過ぎていれば、群の宣言の全部の state dir の doctor と tick status と使用量の読み（usage）と規則の行の読み（rules get）を撃ち直す。印の和は各 project の席の tick-last を含み、器の合図の時計（timer）が 15 秒ごとに書き替える。導出グラフの口は folio の 3 本を要求ごとに撃つ。(2) 頁を閉じた後も、60 秒ごとの印の取り直しが host 全体の集めを撃ち、台帳の見張りは受け手が 0 人でも台帳の印が動くたびに台帳の道具（bd）と台帳の形の行の doctor を撃つ。(3) account board の読みの台帳は、ほかの project の問いの見張りと同じ台帳を別に読む。(4) server 自身の計算の時間は、要求ごとに台帳と event log の全部を中核で何度も読み解く所に在った（口 /api/account の 1 回に 353 ミリ秒・10 回の平均）。
  器の CLI の入力を系統の呼びの記録（strace）で見ると、使用量の読み（usage）は state dir の event log と群の宣言の file（host.toml）だけを読み、tick status はそれに群の記録の .account と席の dir の tick-last を足し、規則の行の読み（rules get）は file を読まない。doctor は群の記録の .account と断りの記録（.refused）のほかに、端末の多重化の道具（tmux）と起動の管理（systemd）と git と口座の dir の file と plugin も読み、event log を 1 回に 9 度読むので、tsuzuri は doctor の入力の全部を file の印で持てない。器の doctor の席の行の欄 tick=（席の健康の語）と tick status の健康の欄（healthy=）は、器の同じ 1 関数（tick-last の時刻と今の時刻と器の規則の行の周期）から出る。台帳の道具（bd）の 1 本の計算の時間は起動と台帳の開きが大半で、絞る引数を付けても変わらない。folio の裁定の書き出しは契約の dir（contracts）と git も読む。
  要件 NFR2 と規則の行 R-21 は器の event と台帳の変化を 5 秒以内に面へ届けることを求め、規則の行 R-22 は器の字を写すことを求める。軽さ（計算の時間）の要件の行は無い。
decision: |
  (1) 外の読みの持ち回しの表。server の外の読み（子 process の読み）を、読みの鍵（program と引数の列と cwd）ごとに 1 つの字として持つ表を置く。表は、読みごとの入力の印の file（更新時刻と長さ）が前に撃つ前に取った値と同じで、撃ってから上限より短い間は撃ち直さず持った字を返す。読めなかった読み（落ちる・rc が 0 でない・5 秒で返らない）は 5 秒と上限の短い方だけ持つ。同じ鍵の読みは 1 本ずつ撃つ。撃つのは口の要求の時だけ。
  (2) 入力の印と上限と、遅れの開示。使用量の読み（usage）は state dir の群の宣言の file（host.toml）と event log。tick status はそれに群の記録の .account と断りの記録（.refused）の file と、state dir の seat の dir と、席の dir ごとの記録（tick-last・pointer-ladder・heartbeat-off・heartbeat-on・move-signal・account）。doctor は tick status の印から tick-last と pointer-ladder と move-signal を除いた印。規則の行の読み（rules get）は印を持たない。上限は tick status が今の 5 秒、doctor と使用量の読み（usage）と規則の行の読み（rules get）が 30 秒、folio の 3 つの読みが 300 秒で、folio の印は設計文書の dir の下の全 file、裁定の書き出しはそれに契約の dir（contracts）の下の全 file と git の HEAD と参照（refs）を足す。席の card の健康の語（健全と古いの分かれ）は、doctor の語でなく tick status の健康の欄（healthy=）と最後の打刻の欄（last=）から決める（5 秒の内のまま・doctor の語は打刻が無いか読めないの時だけ使う）。開示: doctor の印の外の入力の変化（tmux と起動の管理（systemd）と口座の dir の file と plugin と git）と、doctor の語の打刻が無いと読めないの変わり（打刻の file が消えた時は、その間の健康の語が「まだ分からない」と出る）と、使用量の窓の割合の時刻だけの動きは、今より最大 30 秒遅れて面に出る（今は最大 5 秒）。裁定の書き出しの入力のうち、git の除外の file（.gitignore）の変化も印に無く、上限の 300 秒まで遅れうる。器の event（event log の書き）と台帳の変化は印に入るので 5 秒の内のまま。
  (3) 分け合い。同じ server の中の席の card の読みと account board の読みは同じ表を分け合う。account board の印の一覧は最後の集めの一覧を返し、印の一覧の取り直しでは子を撃たない。account board の台帳の読みは、自分の repo の見張りの読みと、起動の引数 --project の置き場の見張りの読みを分け合う。account board の台帳の読みが落ちた anchor は、印が同じなら 5 秒の間は撃ち直さない。
  (4) 受け手が居ない時は読まない。台帳の見張りは、知らせ（SSE）の受け手が 0 人の間は、台帳の印が動いても読まない（受け手が付いた周で 1 回読む今の決まりは変えない）。口の台帳の読みは、台帳の印が最後の読みの前に取った印と違えば、見張りを待たず自分で読み、見張りの読みと同じく台帳の形の行の撃ちへ渡す。閉じている間に台帳が動いていれば、頁を開いた最初の口の読みは台帳の読みの分（壁で約 0.6 秒）だけ遅れ、その読みが落ちた時は閉じる前の最後の読みから古さを数える。印が動かなくても読み直す安全の網の間隔（store の印で前の読みが読めた時）は、600 秒にする（持ち主の答え）（jsonl の印の時は 5 秒のまま）。
  (5) 読み解きは字が変わった時だけ。account board の読みは、anchor ごとの台帳と event log の字を、前の要求で読み解いた時の字と比べ、同じなら前に読み解いた値（今の時刻に依らない値）を使う。今の時刻に依る組み立て（走行の数・次の一手・席の card）は要求ごとに行う。
  (6) 今は採らないもの。今の時刻に依る欄を tsuzuri が tick-last と規則の行から組む形（案 e）、doctor の印に tick-last を戻す形（案 f）、event log の末尾だけの読み、host で 1 か所が集める形（案 c）、台帳の読みを絞る形、見ている state dir だけの doctor、台帳の形の行の撃ちを同じ台帳の字の周で撃たない形。
  (7) 残りの doctor の重さ。持ち込み（判断の記録 ADR-18）は code の置き場を移すだけで、器は別の命令のまま撃つ。この記録では残りの doctor の重さを減らさない。器の側に軽い読みの口を頼むか、同じ process で読むかは、器の持ち込みの段で別に問う（この承認で向きを決めない）。表の鍵と印と上限は、どちらの形でもそのまま使える。
  (8) 軽さの要件 NFR4 を要件書に足し、値を規則の表の行 R-34（種別 detect）に置く。値は 2 つで、頁 1 枚（project board の home の頁を開いて 60 秒の後の 300 秒の平均）と、頁を開いていない時（頁を閉じて 30 秒の後の 120 秒の平均）の、server とその子の計算の時間の和の 1 core に対する割合。値は持ち主が問いの答え（案 D）で決め、頁 1 枚は 1 core の 20% 以下、頁を開いていない時は 1 core の 1% 以下。構造の部分（入力の印が動かず上限の内なら子を撃たない・受け手が 0 人なら台帳を読まない）は歯が見て、量の部分は席の測りの script が見る。席は、行の全部の着地の後（最初の測りは、器の event log の書きが 1 分に 4 行以上のふだんの速さの時に撃つ）と、その後に面の server の読みを変える行の着地ごとに、元の code（行 c-tick-word の前の commit の release）と並べて測り、state dir の数と event log の書きの速さと一緒に便の bead の notes に記帳する。
  (9) 条 P-27.2 の先に消すもの。account board の読みの集めの全部の持ち回し（5 秒と印の和で全部を撃ち直す形）、席の card の読みの持ち回し、60 秒ごとの印の取り直しの集め、受け手が 0 人の間の台帳の印の動いた周の読み（行 e-idle の「印が動けば 0 人でも読む」）、account board が --project の置き場の台帳を別に読む Source、要求ごとの台帳と event log の読み解き。
options:
  - id: a
    name: 受け手が居る時だけ、入力の印が動いた所だけ読み、読み解きは字が変わった時だけ行う
    text: 決定 (1)〜(9)。
    verdict: adopted
    reason: 試作（main 6d7e98e5 の写しで起こし、main 3d57d349 の写しに行を 1 つずつ当て直した写しの全部で xtask の check が通る・nextest 1683 本）を、元の server と同じ時に loopback の別の口の番号（port）で並べて 4 回測った（数と条件は問いの bead の notes）。どれも器の event log の書きが 1 分に約 0.7〜2.2 行の静かな時で、ふだんの速さ（約 4.5〜8.5 行）では測れていない。安全の網 600 秒の形で、頁 1 枚の 300 秒の平均は元 43.4%・28.5%・37.5%・30.1% → 試作 14.3%・8.5%・10.1%・7.6%、閉じて 30 秒の後の 120 秒は元 9.0%・3.3%・3.7% → 試作 0.2%・0.2%・0.4%（3 回）。網を 60 秒のままにした形は頁 1 枚 19.2%・13.4%・15.9%・14.7%。ふだんの速さに近い時の前の形の 1 回は、試作 15.8%・網 60 秒の形 21.9%。依存と口の電文の形と知らせの種類を変えない。変えるのは境界の crate の外の読みと見張りの読みの時機、中核の席の健康の語の出所と account の読み解きの形、歯。決定はしごの「既に在るか」で、今の印と持ち回しの形（行 e-acct-hbmark・a-lean・e-idle）を読みの単位と受け手の有無へ割るだけで足りる。費用は server の使う記憶の量（RSS）で、測りの終わりの 1 度の値で元より −38448〜+411384 kB（−3.1〜+35.6%・多い回が 4 回のうち 3 回）で、持つ量は台帳と event log の大きさに比例して増える。
  - id: b
    name: 外の読みを裏の thread の周期に移し、口は持った字だけを返す
    text: 見張りの thread が入力の印の動いた読みを撃ち、組み直した電文が前と違う時だけ板の変化の知らせを送る。口の要求は子を撃たない。
    verdict: rejected
    reason: 周期の撃ちと知らせの決まり（行 c-ev-kind）と受け手の数えを作り直すので大きいのに、子の本数の減りは a と同じ印で決まり、a より多くは減らない。
  - id: c
    name: host で 1 か所だけが account board を集める
    text: 1 本の server が全部の project の board を配るか、ほかの board の server が account の口を 1 本の server から名指しで受ける。
    verdict: rejected
    reason: 同じ host の 2 本の server で同時に頁を開いた時だけ 1 本ぶんの集めが減る。全部を 1 本で配る形は口と起動の引数と席の管理の道具を作り直し、名指しで受ける形は通信の読み手（http）と知らせの中継を足す。群の宣言の file は state dir で違いうるので中身が同じとも限らない。撤退条件 (1) で比べ直す。
  - id: d
    name: 器に軽い読みの口を頼む
    text: 器に、席の登録と群の行だけを出す doctor の区画の引数か、専用の読みの命令を頼む。
    verdict: rejected
    reason: a で要件の値に届く。残りの doctor の重さを器の側の口で減らすか、同じ process で読むかは、器の持ち込みの段で別に問う（決定 (7)・撤退条件 (1) と (3)）。
  - id: e
    name: 今の時刻に依る欄を tsuzuri が組む
    text: 席の健康と退避の残り秒を、器の出力の撃ち直しでなく、tick-last の時刻と器の規則の行の周期と撃った時刻から tsuzuri が組み、tick-last の動きで tick status を撃ち直さない。
    verdict: rejected
    reason: 規則の行 R-22 の式の内で組めるが、健康の語は tick status の欄の写し（決定 (2)）で 5 秒の内に保て、新しい読みが要らない。残る tick status の重さは起草の実測で頁 1 枚の約 1 ポイントで、要件の値に要らない。退避の残り秒は撃った時刻を表から中核へ渡す形が要り、行が増える。撤退条件 (1) で採り直す。
  - id: f
    name: doctor の印に tick-last を戻す
    text: 席の健康の語を doctor の語のままにし、doctor の入力の印に席の dir の tick-last を足して、合図の時計の書きのたびに doctor を撃ち直す。
    verdict: rejected
    reason: 時計が止まった時は tick-last が動かないので、健康の語が古いに変わるのは doctor の上限（30 秒）まで遅れる（5 秒の内に保てない）。起草の実測（a と同じ回に並べた 2 回）で頁 1 枚が a より 5.0〜6.0 ポイント重かった（19.3% と 14.3%・21.8% と 15.8%）。
basis: [P-27, P-4, P-2, NFR2, R-21, R-22, ADR-7, ADR-18]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、決定 (8) の時機に、席の測りの script（loopback の別の口の番号で読むだけの server を起こし、project board の home の頁の口を知らせの種類で読み直す客を開いて 60 秒の後の 300 秒と、閉じて 30 秒の後の 120 秒の、server とその子の計算の時間と子の本数を数える）で元の code と並べて測り、便の bead の notes に記帳する。問う相手は持ち主。
    (1) 要件 NFR4 の値（規則の行 R-34）を越えたら、doctor の上限（30 秒）・案 e（今の時刻に依る欄を組む）・案 c（host で 1 か所が集める）・器の持ち込みの段の問い（決定 (7)）を比べ直して問う。
    (2) 表の持ち回しか受け手の有無の読みのせいで、器の event か台帳の変化が 5 秒以内に面へ届かない例（要件 NFR2）か、席の健康の語が stale に変わるのが 10 秒より遅れた例が 1 つでも見つかったら、その読みの印と上限を直す行を起こし、直せなければ案 b を問う。
    (3) 器の持ち込みの段が 30 日より先に延びたら、決定 (7) の問いと案 d を問い直す。
plain: |
  画面の server が重かったのは、変わっていない材料まで外の道具で集め直し、大きな記録を毎回読み解き、画面を閉じた後も読み続けていたためです。
  これからは、(1) 外の道具の読みを 1 つずつ覚え、材料の file が変わった時か決めた時間が過ぎた時だけ起こし直し、(2) 画面を開いている人が居ない間は台帳を読まず、(3) 大きな記録は中身が変わった時だけ読み解きます。
  試しでは、画面を 1 枚開いた間の計算の使い方が 1 core の約 29〜43% から約 8〜14% に（静かな時の 4 回の測り）、画面を閉じた後は約 3〜9% から約 0.2〜0.4% になりました（3 回）。器の記録の書きがふだんの速さの時は、これより上がる見込みです。
  器の出来事と台帳の変化が 5 秒以内に画面に届く決まりと、器が席を「古い」と判じてから画面に出るまでの速さ（5 秒以内）は変えません。ただし、器が tmux や起動の管理（systemd）や口座の file から決める字は、今より最大 30 秒遅れて変わります。代わりに server の使う記憶が最大で約 4 割（約 400 MB）増えることがあり（測った 4 回のうち 3 回で増えた）、台帳と器の記録が伸びればその分増えます。
  残りの一番重い所（器の doctor）の減らし方は、器を持ち込む段で改めて問います。軽さの決まりの値は、画面を 1 枚開いている間は 1 core の 20% 以下、開いていない間は 1% 以下にしました。台帳の取りこぼしを拾い直す間隔は10 分にしました。
