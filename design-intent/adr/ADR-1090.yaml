  who: 持ち主
  date: 2026-09-29
  ruling: "s2-07l.739（器の台帳の id・器の記録の承認の欄が名指す・取り込みの裁定 t3-hub.74.60.1:20261004T0113Z-1）"
  verbatim: "器の台帳 s2-07l.739 の notes に在る（この file に写さない）"
  surface: R-8
consequences:
  - "この判断で良くなること 3 つと、 代わりに引き受けること 3 つです。 良くなるのは、 どの席でも 1 行だけ読んで器の文書だと分かること、 印の後ろに散文が隠れないこと、 参照の形を見分ける仕組みが変わらないことです。 引き受けるのは、 全ての席の指示文の字が変わり binary を入れ替えた後から効くこと、 印が器の文書の場所までは渡さないこと、 検査道具の側の判定は全参照を測らないまま残ることです。"
  - "良い結果: 消費側の席を含む全席で、 どの行を 1 行だけ読んでも印の後ろが器の文書だと字で分かり、 消費側の repo が自分の文書に使う印と字で分かれる"
  - "良い結果: 印の後ろに分類できない字を置いた行は雛形の違反として行番号つきで名指され、 印の後ろに散文が隠れない"
  - "良い結果: 分類の形 (PointerKind・前置き語の表・宣言順) は 1 字も変わらず、 解き手の変更は印の定数とその写しだけで済む"
  - "代償: 全席の指示文の字が変わり (1 行 7 byte・11 行で 77 byte)、 PATH の binary を入れ替えて起こし直した席から効く。 入れ替えるまで既存の席は前の版の印のまま"
  - "代償: 器の語が席に通じるかは指示文の 1 行目と名乗りの行に頼り、 印は器の文書の場所を渡さない (消費側から器の文書を開く道は別の論点に残る)"
  - "代償: xtask の seat-brief は印の後ろに pointer の字が 1 つ在る行を通したままで、 全参照の分類は器の中の歯だけが測る"
note: |
  器の元の file: scribe2/design-intent/decisions/ADR-0090-seat-brief-marks-the-vessel-ssot-and-every-reference-classifies.html
