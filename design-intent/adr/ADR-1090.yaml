# 判断の記録 ADR-1090 — 器 scribe2 の判断の記録 ADR-0090 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1090
title: "席の指示文の出所の印は器の文書だと名乗り (→ 器の SSOT:)、 印の後ろの参照は 1 本残らず pointer の形に分類できなければならない — 1 本でも分類できない参照を持つ行は雛形の違反 (ADR-1018 §2.2 の印の字・ADR-1022 §2.4 の規範文の定義の読み・ADR-1046 の用語 pointer 行の字を部分 supersede)"
status: accepted
date: 2026-09-29
context: |
  器は登録された全ての席 (器の repo の席も、 別の repo の席も) へ同じ 11 行の指示文を渡す。 各行の末尾の出所の参照は器の repo の文書を指すが、 字からはそれが分からず、 別の repo の席が自分の repo の同じ名の文書と読み違えうる。 本 ADR は印そのものに持ち主を名乗らせ、 あわせて印の後ろに分類できない参照が在る行を黙って通していた穴を塞ぐ。
  なぜこの判断が要るのかを、 経緯 (印の字と pointer 行の定義を 3 本の決定記録が持つ)・事象 (別の repo の席が器の文書を自分の repo の文書と読みうる)・機序 (行の分類が形の外の参照を捨てる)・憲法と既存の決定の向き・この判断の範囲の 5 つから説明します。 印はもともと、 今は廃止された作業記憶の命令行の印でした。
  CTX1 経緯 — 印の字と pointer 行の定義は 3 本の決定が持つ
  ADR-1018 §2.2 は、 作業記憶の命令行が本文末に出所 pointer（器の文書を指す参照） (→ SSOT: の後ろの参照) を持ち、 器が形を閉じた enum (PointerKind（参照の形の一覧）) で分類すると決めた。 ADR-1022 §2.4 は席の指示文（席への最初の案内）の雛形の行を穴か出所 pointer を持つ行に限り (ADR-1018 §2.2 と同じ検査)、 規範文を「pointer を持たない行」と定めた。 ADR-1046 の用語集は pointer 行を「行末の → SSOT: の後ろに出所を持つ行」と字で定める。 作業記憶は ADR-1045 §2 (2) で廃止され、 印は席の指示文の雛形にだけ残る。
  CTX2 事象 — 別の repo の席が器の文書を自分の repo の文書と読みうる
  器は SessionStart で、 登録された全ての席 (器の repo の席も消費側（器を使う別の repo）の席も) へ同じ 11 行の指示文を渡す。 行末の → SSOT: の後ろの参照 (憲法の条・ADR の番号・設計 doc の path) は器の repo の文書を指すが、 字からはそれが分からない。 消費側の席の報告 (2026-09-29) と写しの表の突き合わせで、 消費側の repo の憲法にも器の条と字の近い id の条 (中身は別) が在り、 席が指示文の条を自分の repo の条と読みうることが分かった (実測 1 件・記録は memo s2-07l.739)。 同じ害は ADR の番号と設計 doc の path にも及ぶ。 印 → SSOT: は器の前の版の作業記憶の印で、 消費側の repo の文書にもその repo 自身の文書を指す印として残りうる。
  CTX3 機序 — 行の分類は分類できない参照（形の外の参照）を捨てる
  行の分類は、 印の後ろの参照のうち分類できたものの最も強い kind を取り、 分類できない参照を捨てる。 雛形の歯も分類できない参照を黙って飛ばす。 同じ行に分類できる参照が 1 本在れば、 「憲法 N-7」「器の憲法 N3」のような分類できない字が印の後ろに在っても行は通り、 印の後ろに隠れた散文が規範文の検査の外に出る。 今の雛形 11 行には分類できない参照が無い。
  CTX4 憲法と既存の決定の向き (本 ADR の解釈)
  C1.2 (生成文に手書きの規範文を持たない) は、 pointer 行の読みを「印の後ろの参照が全部 pointer の形の行」と狭めるほど強く執行される。 N2 (散文にしか無い規則を規則と扱わない) と N3 (host 固有の値で分岐しない) は動かさない。 印の字は host に依らず、 器の repo の置き場 (絶対 path) も指示文に書かない。 CON1002 (公開面) から、 消費側の repo の名と条の中身は本 ADR に写さない。
  CTX5 射程 — 動かすのは印の字と、 行の分類の 1 規則だけ
  動かすのは (1) 雛形 11 行の行末の印の字、 (2) 印の字の定数 (器の中の 1 つと xtask の写し)、 (3) 行の分類が分類できない参照を 1 本でも持つ行を違反にすること。 動かさないのは PointerKind の閉じた列と形と宣言順・前置き語の表・Anchor の解決・穴の列 (5 つ)・生成文の行数 11・hook の出す順と記録の what・rules 行・xtask の seat-brief の判定の形 (印の後ろに pointer の字が 1 つ在る行を通す)・消費側の repo の文書。
  （選択肢を測るものさし）この判断を評価する 4 本のものさしです。 どの行を 1 行だけ抜き出しても持ち主が読めること。 参照の形を見分ける仕組みを 1 通りのまま増やさないこと。 印の後ろに散文を隠させないこと (形の外の参照を黙って通さない)。 公開面と host に依らない形を守ること (置き場・名・別の repo の値を書かない)。
  DR1｜1 行だけで持ち主が読める — どの行を抜き出しても、 印の後ろが器の文書だと字で分かる CTX2
  DR2｜分類は 1 通り — 解き手の形 (PointerKind・前置き語の表・宣言順) と閉じた穴の列を増やさない CTX1・CTX5
  DR3｜印の後ろに散文を隠さない — 分類できない参照を黙って通さない (C1.2・NFR1004) CTX3・CTX4
  DR4｜公開面と host 非依存を守る — 置き場・名・消費側の値を指示文にも記録にも書かない (N3・CON1002) CTX4
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 雛形の各行の印を「→ 器の SSOT:」に替え、 印の字は器の中の定数と検査道具の写しで同じにします。 行の分類は印の後ろの参照を 1 本残らず見分け、 1 本でも見分けられない行を違反に数えます。 参照の形の一覧・行の数・hook の出し方は変えません。 支えるのは FR1042 (指示文に手書きの規範文を含めない) と NFR1004 (不正な入力を黙って落とさない) への主張です。
  採用 — OPT1
  席の指示文の雛形の各行 SHALL 行末の出所の印（行末の矢印の目印）を → 器の SSOT: とし、 印より前の字・印の後ろの参照の列・行の数と順は変えない。 印の字 SHALL 器の中の 1 つの定数と xtask の写しで同じ字とする。 前の版の印 → SSOT: だけを持つ行 SHALL pointer を持たない行 (規範文) と読む。 行の分類 SHALL 印の後ろの参照を 1 本残らず PointerKind に分類し、 1 本でも分類できない参照を持つ行を分類できない行 (最初の 1 本の字を持つ) として雛形の違反に数え、 参照を 1 本も持たない行を pointer を持たない行、 全部分類できる行を最も強い kind の pointer 行とする。 ADR-1022 §2.4 の規範文の定義「pointer を持たない行」SHALL「印の後ろの参照が全部 pointer の形である行だけが pointer 行」と読む。 雛形の歯 SHALL 分類できない参照を黙って飛ばさない。 PointerKind の閉じた列・形・宣言順・前置き語の表・Anchor の解決・穴の列・生成文の行数・hook の出す順と記録の what・rules 行 SHALL NOT 変えない。 xtask の seat-brief の判定の形 (印の後ろに pointer の字が 1 つ在る行を通す) は変えない。 指示文 SHALL NOT 器の repo の置き場 (絶対 path) と器の名の字を持たない。 要件書は変えない (FR1042 の範囲)。
  （平易）席の指示文の雛形の各行は、 末尾の出所の印を「→ 器の SSOT:」にします。 印より前の字、 印の後ろの参照の並び、 行の数と順は変えません。 印の字は器の中の 1 つの定数と検査道具の写しで同じにします。 前の版の印「→ SSOT:」だけの行は、 出所を持たない行 (規範文) と読みます。 行の分類は、 印の後ろの参照を 1 本残らず形の一覧で見分け、 1 本でも見分けられない参照を持つ行を雛形の違反に数えます。 参照が 1 本も無い行は出所を持たない行、 全部見分けられる行は最も強い形の出所の行です。 雛形の自動の検査も、 見分けられない参照を黙って飛ばしません。 参照の形の一覧とその順・穴の一覧・行の数・hook の出し方・rules 行は変えず、 検査道具の側の判定の形も変えません。 指示文には器の置き場の path も器の名の字も書きません。 要件書は変えません。
  （理由）別の repo の席は、 自分の repo にも憲法や決定記録を持つので、 字の近い参照を自分の文書と読みえます。 そのため、 どの repo の文書かを字で分ける必要があります。 印そのものに持ち主を名乗らせれば、 1 行だけ読んでも、 参照が何本並んでも、 全部に掛かります。 参照の形を見分ける仕組みは変わらず、 直すのは印の字の定数とその写しだけです。 前の版の印は別の repo の文書にも残りうるので、 字を替えることで印の段階で分かれます。 あわせて、 今の行の分類は見分けられない参照を捨てるので、 印の後ろに散文を隠せました。 穴を歯の中だけで塞ぐと今の雛形では何も測れないので、 規則は行の分類そのものに置きます。 前置き語で分けずに全部を違反にするのは、 前置き語の無い字も散文の逃げ道になるからです。 器の置き場や名を指示文に書く案は、 host に依らない形と公開面の決まりに当たるので採りません。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1042（claim）: FR1042 (席の指示文は雛形と行から生成し、 雛形の外に手書きの規範文を含まない) の規範文の読みを、 印の後ろの参照が全部 pointer の形の行だけを pointer 行とする形で強め、 印に器の文書だと名乗らせると主張する。
  NFR1004（claim）: NFR1004 (不正な入力を黙って落とさない) の向きで、 行の分類が分類できない参照を捨てず、 雛形の違反として行番号つきで名指すと主張する。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録は 3 本の決定記録を一部だけ置き換えます。 印の字を決めた ADR-1018 §2.2、 規範文を「pointer を持たない行」と定めた ADR-1022 §2.4、 用語 pointer 行を字で定めた ADR-1046 です。 参照の形の一覧とその順、 雛形の経路と検査はそのまま保ちます。 行き着く原則は「指す字は、 それだけを切り出しても持ち主と形が読めなければならない」です。
  改訂状態: current
  置き換える ADR: ADR-1018, ADR-1022, ADR-1046
  置き換えられた: なし (現行)
  部分 supersede。 ADR-1018 §2.2 から置き換えるのは出所 pointer の印の字 (→ SSOT:) だけである。 作業記憶の命令行は ADR-1045 §2 (2) で作業記憶ごと廃止され、 印は ADR-1022 §2.4 が同じ検査として受けた席の指示文の雛形にだけ残るので、 置き換わるのはその雛形の印の字である。 ADR-1022 §2.4 から置き換えるのは規範文の定義「pointer を持たない行」の読みで、 印の後ろの参照が 1 本でも分類できない行も pointer 行でない (雛形の違反) と読む。 ADR-1046 の用語 pointer 行の定義の字 (行末の → SSOT: の後ろに出所を持つ行) は、 行末の → 器の SSOT: の後ろの参照が全部 pointer の形である行と読む。 動かさないもの: ADR-1018 §2.2 の PointerKind の閉じた列・形・宣言順を優先順位とすること・形の列挙の正本が機械側であること、 ADR-1022 §2.4 の雛形の経路・穴・xtask の検査の 3 項、 ADR-1046 の注入する憲法の行の範囲、 ADR-1045 §2 (3) の指示文の行数。
  照会終端 — PRIN-POINTERS-NAME-THEIR-OWNER
  指す字は、 それだけを切り出しても持ち主と形が読めなければならない。
  本 ADR が各参照への前置き・冒頭の 1 行・何もしないを退け、 印そのものに持ち主を名乗らせ、 分類できない参照を 1 本でも持つ行を落としたのはこの原則に行き着く (これ以上は遡らない照会終端)。
options:
  - id: "OPT1"
    name: "印を「→ 器の SSOT:」に替え、 印の後ろの参照は全部分類する"
    text: |
      雛形 11 行の行末の印を → 器の SSOT: に替え (印より前の字・参照の列・行の数と順は不変)、 器の中の印の定数と xtask の写しを同じ字にする。 行の分類は印の後ろの参照を 1 本残らず分類し、 1 本でも分類できなければ分類できない行として違反に数える。 雛形の歯も黙って飛ばさない。 決め手は分析 (印が持ち主を名乗り、 分類の形は変わらない)。
      （平易）各行の末尾の印を「→ 器の SSOT:」に替える案です。 印より前の字と参照の並びは 1 字も変えません。 印そのものが持ち主を名乗るので、 どの行を 1 行だけ抜き出しても、 印の後ろに参照が何本並んでも、 器の文書だと読めます。 器の中の直しは印の字の定数とその写しだけで、 参照の形を見分ける仕組みは変わりません。 あわせて、 印の後ろの参照を 1 本残らず見分け、 見分けられない参照が 1 本でも在る行を違反にします。 代わりに、 全ての席の指示文が 1 行 7 byte 伸び、 「器」の語が通じるかは指示文の 1 行目に頼ります。 分析で選びました。
      利点: 行を 1 行だけ抜き出しても器の文書と読め、 印の後ろに参照が何本並んでも全部に掛かる (DR1)
      利点: 解き手の変更は印の定数とその写しだけで、 PointerKind と前置き語の表は 1 字も変わらない (DR2)
      利点: 前の版の印だけの行は既存の規則で pointer を持たない行になり、 新しい仕組みが要らない (DR2)
      利点: 印の後ろに分類できない字を置いた行が違反として名指され、 散文の逃げ道が塞がる (DR3)
      欠点: 全席の指示文の字が変わり、 1 行につき 7 byte 伸びる
      欠点: 器の語が席に通じるかは、 指示文の 1 行目と名乗りの行に頼る
      欠点: xtask の seat-brief は印の後ろに pointer の字が 1 つ在る行を通したままで、 全参照を測るのは器の中の歯だけ
    verdict: adopted
    reason: "決め手は分析 (印が持ち主を名乗り、 分類の形は変わらない)。"
  - id: "OPT2"
    name: "各参照の頭に「器の」を付ける"
    text: |
      印は今の字のまま、 印の後ろの各参照の頭に持ち主の語を付ける (器の憲法 N3 など)。 決め手は分析 (解き手の形が 2 通りになる)。
      （平易）印は今のまま、 印の後ろの各参照の頭に「器の」を付ける案です (器の憲法 N3 など)。 参照ごとに持ち主が分かる点で勝ります。 けれども、 21 本の参照に同じ語が並び、 参照の形を見分ける仕組みに 2 段の前置きを足すことになって、 形ごとに書き方が 2 通りになります。 印の字は別の repo が自分の文書に使う印と同じままです。 退けました。
      利点: 参照ごとに持ち主が字で分かる
      欠点: 21 本の参照に同じ語が並ぶ
      欠点: 前置き語の表に 2 段の前置きを足すことになり、 kind ごとに形が 2 通りになって、 形が互いに重ならないかを測り直す (DR2)
      欠点: 印の字は前の版と同じままで、 消費側の repo が自分の文書に使う印と字で分かれない (DR1)
    verdict: rejected
    reason: "決め手は分析 (解き手の形が 2 通りになる)。"
  - id: "OPT3"
    name: "器の binary の名を字で書く"
    text: |
      印か参照に器の名を字で書く。 決め手は分析 (名の字を置く場所と穴の列が動く)。
      （平易）印か参照に器の名を字で書く案です。 器の名が直に分かる点で勝ります。 けれども、 器の名の字は repo の中の 1 か所だけに置く決まりがあり、 雛形に書くには名を埋める穴を 1 つ足すことになります。 閉じた穴の一覧が 5 つから 6 つになり、 その写しと件数の固定も動きます。 退けました。
      利点: 器の名が字で直に分かる
      欠点: 名の字は repo の中の 1 か所だけに置く決まりなので、 雛形に書くには穴を足すことになり、 閉じた穴の列 (器の中と xtask の写し・件数の pin) が 5 から 6 になる (DR2)
    verdict: rejected
    reason: "決め手は分析 (名の字を置く場所と穴の列が動く)。"
  - id: "OPT4"
    name: "指示文の冒頭に「以下の出所は器の文書」の 1 行を足す"
    text: |
      行の印は今のままにし、 指示文の頭に持ち主を告げる 1 行を足す。 決め手は分析 (行は 1 行ずつ読まれる)。
      （平易）指示文の頭に「以下の出所は器の文書」という 1 行を足す案です。 各行の字を変えない点で勝ります。 けれども、 行は 1 行ずつ抜き出して読まれるので、 冒頭の 1 行はその行に届きません。 指示文の行数 11 の決まりも動き、 足した 1 行も出所を持たなければそれ自体が雛形の違反です。 退けました。
      利点: 各行の字を変えない
      欠点: 行は 1 行ずつ抜き出して読まれ、 冒頭の 1 行はその行に届かない (DR1)
      欠点: 指示文の行数 11 の決まり (ADR-1045 §2 (3)) が動く
      欠点: 足す 1 行も印の後ろに出所を持たなければ、 それ自体が雛形の違反になる (DR3)
    verdict: rejected
    reason: "決め手は分析 (行は 1 行ずつ読まれる)。"
  - id: "OPT5"
    name: "印を残し、 直後に持ち主の語を置く"
    text: |
      印は今の字のまま、 印の直後に 1 度だけ持ち主の語を置く。 決め手は分析 (掛かる範囲が字から読めない)。
      （平易）印は今のまま、 印の直後に 1 度だけ「器の」を置く案です。 印の字を替えない点で勝ります。 けれども、 その語が区切りの後ろの参照にも掛かるのかが字から読めません。 別の repo が使う印とも字が同じままです。 持ち主の語は参照の形ではないので、 前の決定記録の形から外れ、 新しい決定記録も避けられません。 退けました。
      利点: 印の字を替えない
      欠点: 語が区切りの後ろの参照にも掛かるかが字から読めない (DR1)
      欠点: 消費側の repo が自分の文書に使う印と字が同じまま (DR1)
      欠点: 持ち主の語は PointerKind の形ではないので ADR-1018 §2.2 の形から外れ、 新しい ADR は避けられない
    verdict: rejected
    reason: "決め手は分析 (掛かる範囲が字から読めない)。"
  - id: "OPT6"
    name: "参照を html の anchor 付きの path で書く"
    text: |
      各参照を器の repo の中の文書の path と節の anchor で書く。 決め手は分析 (repo 相対の path は曖昧さを残す)。
      （平易）各参照を、 器の repo の中の文書の path と節の目印で書く案です。 参照が文書の場所と節まで名指す点で勝ります。 けれども、 repo の中の相対の path は別の repo にも同じ名で在りうるので、 どの repo の文書かの曖昧さが残ります。 退けました。
      利点: 参照が文書の場所と節まで名指す
      欠点: repo 相対の path は消費側の repo にも同じ名で在りうるので、 どの repo の文書かの曖昧さが残る (DR1)
    verdict: rejected
    reason: "決め手は分析 (repo 相対の path は曖昧さを残す)。"
  - id: "OPT7"
    name: "雛形の歯だけを失敗に替える"
    text: |
      印は OPT1 と同じく替え、 穴の塞ぎ方だけを本体の分類に置かず雛形の歯の中に留める。 決め手は分析 (今の雛形では歯が何も測らない)。
      （平易）印は選んだ案と同じく替え、 穴の塞ぎ方だけを雛形の歯 (自動の検査) の中に留める案です。 本体の型を触らない点で勝ります。 けれども、 今の雛形には見分けられない参照が無いので、 直す前でも直した後でも検査は緑のままで、 元の形へ戻す書き換えも捕まえません。 規則が歯の中にしか無く、 外から測れません。 退けました。
      利点: 本体の型を触らない
      欠点: 今の雛形には分類できない参照が無いので、 直す前の木でも直した後の木でも緑のまま、 最も強い kind だけを取る形へ戻す変異も捕まらない (DR3)
      欠点: 規則が歯の中にしか無く、 行の分類の値として外から測れない
    verdict: rejected
    reason: "決め手は分析 (今の雛形では歯が何も測らない)。"
  - id: "OPT8"
    name: "前置き語を持つ参照だけを違反にする"
    text: |
      印は OPT1 と同じく替え、 前置き語 (憲法・rules 行・ADR) を持つのに分類できない参照だけを違反にする。 決め手は分析 (逃げ道が残る)。
      （平易）印は選んだ案と同じく替え、 「憲法」「rules 行」「ADR」の前置き語を持つのに見分けられない参照だけを違反にする案です。 今の書き方への影響が小さい点で勝ります。 けれども、 器の中に閉じた前置き語の表を外へ出す口が要ります。 前置き語の無い字を印の後ろに置けば、 散文の逃げ道が残ります。 退けました。
      利点: 今の雛形の外の書き方への影響が小さい
      欠点: 本体の中に閉じた前置き語の表を外へ出す口が要る (DR2)
      欠点: 前置き語の無い字を印の後ろに置けば散文の逃げ道が残る (DR3)
    verdict: rejected
    reason: "決め手は分析 (逃げ道が残る)。"
  - id: "OPT9"
    name: "何もしない"
    text: |
      印の字も行の分類も今のままにする。 決め手は実測 (読み違えが 1 件ある)。
      （平易）印の字も行の見分け方も今のままにする案です。 字も検査も変わらない点で勝ります。 けれども、 別の repo の席の読み違えが実測で 1 件あり、 印の後ろに散文が隠れる穴も残ります。 退けました。
      利点: 字も歯も変わらない
      欠点: 消費側の席の読み違えが実測で 1 件ある (DR1)
      欠点: 印の後ろに散文が隠れる穴が残る (DR3)
    verdict: rejected
    reason: "決め手は実測 (読み違えが 1 件ある)。"
basis: [FR1042, NFR1004, ADR-1018, ADR-1022, ADR-1045, ADR-1046, N-7, CON1002]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「席」は人と AI が話す 1 つの session、 「席の指示文」は器が session の始まりに席へ渡す 11 行の案内です。 指示文の各行の末尾には「→ SSOT:」という印があり、 その後ろに出所の参照 (憲法の条・決定記録の番号・設計の文書) が並びます。 参照は器の repo の文書を指しますが、 字からはそれが分かりません。 器を使う別の repo の席も同じ指示文を受け取り、 その repo も自分の憲法や決定記録を持つので、 字の近い条を自分の repo の条と読み違えうることが 2026-09-29 の報告で分かりました。 この記録は、 印そのものを「→ 器の SSOT:」に替えて持ち主を名乗らせ、 あわせて印の後ろに器が形を見分けられない参照が 1 本でも在る行を、 黙って通さず雛形の違反にすると決めます。
