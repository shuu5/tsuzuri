# 判断の記録 ADR-38 — 憲法を tsuzuri の 1 つにまとめ、席の手元へ要の写しを注ぐ（持ち主の決め 2026-10-04・記帳先 = tsuzuri の台帳の memo t3-hub.74.59 と問い t3-hub.74.59.1〜.4 の notes）
# 起草は係 w115a（2026-10-04）。材料は drafts/w115a/w（map.tsv・refs.tsv・inject-design.md・interim.md・organize.md・notes.md）と検証役 qv118 の報告。承認の欄は席が埋める。
id: ADR-38
title: 憲法は tsuzuri の 1 つとし器の憲法を凍った資料にし、席の手元へは要の写しを注ぎ、全文の写しを別の file に導く
status: proposed
date: 2026-10-04
context: |
  持ち主の求め（台帳の控え（t3-hub.74.59）の notes）。まず憲法の統合と整理、そして tsuzuri の orchestrator の席に憲法を正しく注ぐ仕組みを完全に働かせること。
  今の事実（係と検証役 qv118 が照らした）。
  ・器 scribe2 の SessionStart の指示文（brief）は器の中に埋めた雛形 12 行で、4〜8 行目が器の憲法の番号（A1・A4.2・A4.3・A2・A3・N1〜N3・C7.2）を名指す。tsuzuri の憲法を読まない。器の N3（host の分岐）は tsuzuri の N-7 に当たり、tsuzuri の N-3 は例外の仕組みという別の条なので、同じ字の番号が別の条を指す。2026-10-04 に席が 1 度取り違えた。
  ・条 P-13 の 1 つ目の規範文は前文と規範文を持つ条の全部を写せと言い、3 つ目の規範文は規則の行 R-1（8,000 byte）以下と言う。全文（順位と 117 文）は 14,384 byte で、役割の行（1,519 byte・穴で約 +250）と合わせると R-1 の約 2 倍。第 1.0 版の時から両立していない（第 1.0 版の全文 11,975 byte）。R-1 を今測る者はいない（folio inject は退き、器の雛形の測りは穴と出所の印と権能だけを見る）。
  ・判断の記録 ADR-8 の決定 (4) は、folio inject（CLAUDE.md への注入）を使わず、憲法と役割の注入は器の brief が機械的に行うと決めた（封で凍っている）。その撤退条件は「folio inject の代わりが要ると分かったら、口を tz に足すかを持ち主に問う」で、今がそれに当たる。
  ・器の憲法は規範文 58 と順位で、tsuzuri の憲法はそれと folio2 の憲法を寄せて作った。対応表（付表 (13)）で、器の 59 文は同じ 40・広げた 3・一部 11・替えた 1・無い 4、folio2 の 68 文は同じ 49・広げた 12・一部 1・替えた 4・無い 2。判断の記録で答えないまま落ちた文が 11（器 9・folio2 2）在った。出所の欄の字の食い違い 3 は改憲なしの設計の commit（7a6fe66b）で直した。
  ・器の hook の配線は、席の起動行の 2 本目の plugin の dir（凍った元の repo の器の plugin）から来る。brief の字と規則の値は binary（tsuzuri の木の組み）に埋まる。host の宣言の plugin の dir は既に tsuzuri の器の plugin を指すが、登録済みの起動行には効いていない。
  問い 4 つ（t3-hub.74.59.1〜.4）を出す前に、検証役 qv118 が係の案を反対側から攻めた（A-2 の 3 つ目の規範文・P-17 の 4 つ目の規範文）。持ち主は 4 つを全部推奨で裁いた（2026-10-04 の 1 時 13 分（UTC））。
decision: |
  (1) 憲法は 1 つ。code と席を縛る憲法は tsuzuri の憲法だけとする（ADR-18 の決定 (6) の確かめ）。器の憲法（器の設計意図の憲法の頁・その生成物・器の CLAUDE.md の生成区間）は凍った資料として byte のまま残す（ADR-33 の決定 (2)・ADR-36 の決定 (7) と同じ扱い）。写し先の対応表は付表 (13) に置き、ADR-18 の決定 (6) が求めた表とする。
  (2) 写す量（問い t3-hub.74.59.2・案 A・丙'）。席の手元の生成区間は次の 6 段をこの順で並べる。1 段目は順位の 1 行（約 295 byte）。2 段目は段「絶対にやらない」の 7 条 15 文の全文（約 1,649 byte）。3 段目は段「確認してから」の 4 条 9 文の全文（約 1,420 byte）。4 段目は段「いつも守る」の 28 条の id と題を 1 行ずつ（約 1,654 byte）。5 段目は全文の写しの在りかの 1 行。6 段目は器の brief の役割の行（約 1,519 byte・穴で約 +250）。合わせて約 6,538 byte で、R-1 は 8,000 byte のまま変えない。条 P-13 の 1 つ目の規範文の字をこの 6 段に合わせて改める（改憲・付表 (14)）。
  (3) 写しの file（行（t-seatcopy））。tz derive が憲法の正本から 2 つの file を導く。要の写し（contracts/seat/brief.txt）は 1〜5 段目で、全文の写し（contracts/seat/constitution.txt）は順位と全部の規範文の 1 行 1 文（規範文の id と字・空白は 1 つに畳む）である。どちらも頭の 1 行に、手で直さないことと正本と版を書く。tz derive --check が 2 つの file と正本の差を落とす（P-13 の 2 つ目の規範文・P-2）。強さの値が規範の値でない文・「。」で終わらない文・文 0 本は「まだ分からない」で断る（退いた folio inject の導き方を引き継ぐ）。置き場を契約表の置き場（contracts）の直下にしないのは、器の契約表の宣言が直下の .md と .toml を契約表と読むためで、欄の写し（contracts/field-schema）と同じ扱いにする。
  (4) R-1 を誰がどう測るか（測る者の居ない量を作らない・N-2）。R-1 の何を数えるかの字（what）を「席の手元の生成区間（tz derive が導く要の写しの file と、器の SessionStart の brief の役割の行）の本文の総バイト数」に直し、値は 8,000 byte のまま、裁定 id と時刻をこの裁定に付け直す（P-17）。規則の行を 1 本足し（この記録の produced の欄）、役割の行の上限を 2,000 byte とする（R-1 の内訳）。測る者は 2 つで、tz derive が要の写しの byte を R-1 の値から新しい行の値を引いた上限で測り（行（t-seatcopy））、器の歯が雛形を見本の穴で埋めた役割の行の byte を新しい行の値で測る（行（v-brief-const））。和は R-1 の内に収まる。道具は行の値を id でなく欄（key）で読むので、行（t-seatcopy）が規則の表の欄（key）の閉じた一覧に 2 つの値を足し、その着地の後の設計の commit で R-1 と新しい行にその欄を書く。行の字は付表 (15)。
  (5) 最後の形（行（v-brief-const）・器の列）。器の宣言（.vessel.toml）に任意の鍵（seat-constitution・要の写しの repo 相対の path）を足す。鍵の在る project の席では、器の SessionStart が要の写しを字のまま出し、その後に役割の行を出し、器の 5 行（4〜8 行目）は出さない。鍵の無い project の席は今の 12 行のまま。写しが読めない周は 1 行で何を読めなかったかと次の 1 手（tz derive --write）を名指し、器の 5 行へ黙って戻さない（P-7）。要の写しは約 5,000 byte なので、今の SessionStart の 1 本の出力（最大 9,071 byte）に足しても、Claude Code の hook の出力の上限（1 本 10,000 字）の内に収まる見込みで、器の hook の宣言（hooks.json）は替えない。行（v-brief-const）は 1 回の出力の字の数を記録に足す（撤退条件 (5)）。
  (6) 暫定（問い t3-hub.74.59.3・案 A）。行（v-brief-const）が効くまで、tsuzuri の根の plugin（plugin/hooks/hooks.json・席の起動行の 1 本目）の SessionStart に command を 1 本足し、要の写しを出す。runner の印（$CLAUDE_PLUGIN_ROOT/scribe2-runner）が在る時は撃たない。器が要の写しを出した印（行（v-brief-const）が席の dir に書く）が在る時も出さない（器の brief は着地でなく入れ替えで効くので、消すのを着地に結ぶと届かない周か 2 重の周ができる）。行（t-seatcopy）の完了の条件（done）に 2 本の歯を入れる。1 本は hooks.json の全部の command が runner の印の除きの字を持つことを照らす歯で、もう 1 本は印の名が器の名の定数と「-runner」から成ることを照らす歯である（器の改名で除きが黙って外れないため・改名の行の write-set に hooks.json とこの歯を入れる）。行（v-brief-const）の write-set でこの 1 本を消す。
  (7) ADR-8 の決定 (4) からのずれ。(6) の間、注入の一部を器の brief でなく tsuzuri の plugin の hook が行う。ADR-8 は封で凍っているので本文は替えず、この記録がずれの範囲と期限を持つ。tz に注入の口（inject）は足さず（ADR-8 の決定 (4) の「口は tz inject として残さず」は保つ）、CLAUDE.md も使わない。ずれは行（v-brief-const）の着地と入れ替えで閉じる。
  (8) 写っていない 11 の文（問い t3-hub.74.59.4・案 A）。足す 3 は第 1.4 版の改憲とし、字は付表 (14)。器の条（C3.3）は P-20 に 1 文、器の条（C10.2）の半分は P-8 に 1 文（器と tz が出す報告と一覧は生成物だけ）、器の条（C12.6）は言い直して P-25 に 1 文（main が赤なら、戻すか直す取り込みを次の取り込みより先にする）とする。足さない 8 とその理由は付表 (13) に置く。folio2 の前文の順位「網羅より揃い」は足さず、前文の機構の注の字を 2026-09-24 に承認した順位の 5 つに合わせる（前文の機構の注は凍結 anchor の範囲なので、この版の改訂の欄に 1 件入れる）。
  (9) ほかの project の席（問い t3-hub.74.59.1・案 A）。器の宣言の鍵（seat-constitution）で要の写しを名指した project の席だけに写しを出す。名指さない project の席は器の 5 行のままとし、5 行の番号を tsuzuri の A-1・A-4・A-2・A-3・N-1・N-2・N-7 へ付け替える（中身は同じと対応表で確かめた・行（v-renum-face））。器の判断の記録（ADR-0046）が「整理の後へ送る」とした他 project の憲法の執行は、この形で閉じる。
  (10) 行の順。行（t-seatcopy）は tsuzuri の側の行で、器の列の外で流す。tsuzuri の根の plugin の hooks.json を同じく書く行（cs-plugin）の後に置く（ノート（surface-wave27b））。行（v-brief-const）は器の列で行（v-lane-cap）の次に置き、depends は行（t-seatcopy）。その前の 1 歩として、全部の席の起動行の器の plugin の dir を tsuzuri の器の plugin へ替え、席ごとの読み込み元の記録で確かめる（ADR-33 の決定 (3) の残り・器の code を書かない）。行（v-brief-const）の write-set に doctor の食い違いの語「読み込み元の root が宣言の plugin の dir と違う」を足す（今の語はこの違いを黙る）。付け替えの行は 2 段で、行（v-renum-face）（器の行・席と人に見える字＝雛形の 5 行と役割の行の出所の印・番号の解き手・実行の時の字 13 か所 5 file・その写し）を行（v-brief-const）の後に、code の注の番号の便（約 827 行・約 193 file・ADR-18 の決定 (5)）を行（v-join）と行（v-gates）の後に crate ごとの 3 行ほどで置く。器の規則の行の id は替えず、大きさの行と照らしの移しの行で tsuzuri の行へ移る時にその行で替えるか退かせる。退役の段は行（v-gates）に合わせ、器の検査の道具の憲法の生成と照らしの 4 つの口（gen-claude-md と claude-md-constitution・claude-md-done・claude-md-prose）を可逆な移しで退かせる。
  (11) 器の提案中の記録の受け直し（ADR-36 の決定 (6)）。行（v-brief-const）は器の判断の記録（ADR-0045）（brief の 12 行の形）と（ADR-0046）（注入の範囲）が述べる振る舞いを替えるので、この記録が 2 本を受け直す。鍵の無い project の席では 2 本の決め（12 行・順位と確認と禁止の出所の印の行だけを注ぐ）をそのまま受け直し、鍵の在る project の席ではこの記録の (2)(5) が替える。
  (12) 新しく書く tsuzuri の文書は、器の条の番号を規則として引かない。器の番号を引く時は「器の条（C2.2）＝ N-7 の 3 つ目の規範文」のように器の印と tsuzuri の id を対で書く。今、判断の記録 ADR-35 の 3 か所とノート（surface-wave27a）の 2 か所が器の番号を引く（後者の 1 か所は器の印も無い）。直すのは次にその文書の版を上げる時とする。
  (13) 付表 A（対応表と写さない文）。正本は係の表（drafts/w115a/w/map.tsv・器 59 行・folio2 68 行・tsuzuri だけの文 9）で、この付表と字が違えば付表が勝つ。写さない文と理由は次の 13。
  ・器の条（C3.2）（doctor の口）・器の条（C11.2）の半分（境界ごとの失敗の列挙）・器の条（C12.7）（性質の検査）・器の条（C13.4）（compile の時間の形）は ADR-19 の決定 (8)、器の条（C6.2）（1 回の便の token の上限で止める）は ADR-19 の決定 (3) で写さないと決めた。
  ・器の条（C1）の残り（database には実行時の状態だけ・値は宣言の 1 file）は P-20 と P-1 が縛る。
  ・器の条（C12.4）の残り（変異の対照を手で書かない）は、今の行の完了の条件（done）が手で入れる変異の噛みを求めるので、足すと即座に違反になる。
  ・器の条（C14.2）（文書と規則の表の食い違いを CI が落とす）は P-2 の 4 つ目の規範文とぶつかる。「どこからも引かれない行の数え」は N-2 の検出の行の候補。
  ・器の条（C15.2）（契約は要件 id・規則を替える変更は裁定 id・欠けを lint が落とす）は P-17 と器の受付が縛る。
  ・器の条（N4）の残り（同じ版で大きさの上限を越えない）と器の条（N4.2）（非互換と上限越えは新しい版で）は P-22 と N-4 が縛り、tsuzuri は repo を版で分けない。
  ・folio2 P5 の枝 3（文書の種類の違いは汎用の検査と密度の設定のデータで）は N-5 と P-18 が縛る。
  ・folio2 P13 の枝 4（外の利用者で受入が通ってから自分を運ぶ）は ADR-18 の決定 (6) が CON2 の記帳で満ちたと読む。
  ・folio2 の前文の順位「網羅より揃い」は、2026-09-24 に承認した順位の 5 つを開け直すことになるので足さない。
  (14) 付表 B（改憲の字・第 1.4 版）。条 P-13 の 1 つ目の規範文を改め、P-8・P-20・P-25 に規範文を 1 本ずつ足す。字と型と強さは改訂の欄（amends）のとおりで、改める字は検証役に攻めさせてから、もう一度持ち主の字の承認を得る（ADR-19 と同じ 2 段・A-2）。前文の機構の注を承認した順位の 5 つに合わせる。
  (15) 付表 C（規則の行の字）。R-1 は何を数えるかの字（what）を (4) の字に、裁定の欄にこの裁定を足し、時刻を 2026-10-04 の 1 時 13 分（UTC）にし、注に内訳と測る者を書き、指しの欄（refs）に新しい行を置く。新しい行は、条 P-13・何を数えるか「器の SessionStart の brief の役割の行（穴を埋めた後）の本文の byte（R-1 の内訳・残りを tz derive が導く要の写しの file に充てる）」・値「2,000 byte 以下」・種 deny・状態 仮・段 post・裁定と時刻は R-1 と同じ・指しの欄に R-1 を置く。
options:
  - id: a
    name: 要の写し（丙'）を注ぎ、全文の写しを別の file に導き、R-1 は変えない
    text: 決定 (1) から (15)。
    verdict: adopted
    reason: 名指せる実害（器の番号と tsuzuri の番号の取り違え）が消え、R-1 の内に余地約 1,462 byte が残る。全文は正本と同じ字の file で要る時に読める。手続きは条 P-13 の改憲で、甲の閾値の緩めとほぼ同じ重さ。
  - id: b
    name: 全文を注ぎ、R-1 を 20,000 byte に上げる（甲）
    text: 条 P-13 を変えず、R-1 を緩め（P-17 の 4 つ目の規範文）、何を数えるかの字を写しと役割の行の総バイト数にし、字の数を別の閾値の行で測る。
    verdict: rejected
    reason: 全文で席の判断が良くなる証拠が無い（検証役 qv118）。起動と圧縮ごとの出力が約 2 倍になり、版ごとの増え（平均 +803 byte）で改憲 2〜6 回のうちに上限が尽き、R-1 が憲法の大きさの上限を兼ねる。
  - id: c
    name: 順位と確認と禁止の全文だけを注ぐ（丙）
    text: 段「いつも守る」の条を写さない。
    verdict: rejected
    reason: 段「いつも守る」の 28 条の番号と題が手元に無いと、席が条を引く時に在りかも分からない。丙' との差は約 1,654 byte で R-1 の内に収まる。
basis: [ADR-4, ADR-8, ADR-18, ADR-19, ADR-33, ADR-35, ADR-36, CON2, P-1, P-2, P-4, P-7, P-8, P-13, P-17, P-18, P-20, P-22, P-25, A-1, A-2, A-3, A-4, N-1, N-2, N-3, N-4, N-5, N-7, R-1]
grill:
  when: 2026-10-04
  who: 検証役 qv118（AI・起草者と別の独立の文脈・読み取りだけ）
  where: docs/grill/2026-10-04-Q-constitution-inject-grill.md
  summary: 検証役 qv118 が係の案（全文を写し R-1 を上げる・暫定・写っていない 11 の文・ほかの席）を反対側から攻めた。数は全部合い、全文で席の判断が良くなる証拠は無く、実害は器の 5 行の番号の取り違えで、丙' で消えると見た。何を数えるかの字を 2 つに割る書き直しは縛りを緩めるので成り立たないとし、暫定の除きの字の書き忘れと改名で除きが外れる穴、撤退を着地に結ぶと届かない周と 2 重の周ができる穴を名指した。足す 5 のうち 2 つを替え（器の条（C12.6）の言い直し・器の条（C14.2）を足さない）、器の条（C12.4）の理由を替えた。改める字は字の承認の前に検証役がもう一度攻める。
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、台帳の控え（t3-hub.74.59）の notes に 1 件ごとに記帳する。問う相手は持ち主。
    (1) 暫定の 1 本が置かれた日から 14 日を過ぎても行（v-brief-const）が器の列に入らなければ、暫定を続けるか、器の列の先頭へ上げるかを問う。
    (2) 行（v-brief-const）の入れ替えの後に、席が器の番号と tsuzuri の番号を取り違えた記帳が 1 件でも在れば、写す量（全文か丙'か）を問い直す。
    (3) 席が段「いつも守る」の条の字を要る時に全文の写しを読まずに誤った記帳が 2 件在れば、写す量を問い直す。
    (4) tz derive か器の歯が測る byte が R-1 か役割の行の上限を越えたら、削らずに収める形を先に探し、無ければ値か写す量を問う。
    (5) 行（v-brief-const）の入れ替えの後、器の SessionStart の 1 本の出力の字の数が 9,000 字を越えた周が記録に 1 件でも在れば、出力を 2 本に割る行を起こすかを問う（Claude Code は 1 本 10,000 字で切る）。
plain: |
  憲法を tsuzuri の 1 つにまとめ、器（scribe2）の古い憲法は資料として残す記録です（推奨の案）。
  AI の席が起きた時と、会話を縮めた時に、憲法の要の部分を機械が手元に写します。要の部分は、ぶつかった時の順位、「絶対にやらない」と「確認してから」の全文、「いつも守る」の条の番号と題の一覧です。全文は別の写しの file に置き、要る時に読みます。
  写しの大きさの上限（8,000 byte）は変えません。上限は、道具（tz）と器の検査が分けて測ります。
  器の直しが届くまでは、tsuzuri の部品の起動時の仕掛けが同じ写しを出します。器の直しが届いたら、その仕掛けは退きます。
  器と folio2 の憲法から写っていなかった文のうち、3 つを足し、8 つは足さない理由を残します。ほかの project の席には、今の 5 行を番号だけ tsuzuri に合わせて出します。
consequences:
  - 置く行は行（t-seatcopy）（tsuzuri の側・M）・行（v-brief-const）（器の列・M）・行（v-renum-face）（器の列・S〜M）と、code の注の番号の便 3 行ほど（行（v-join）と行（v-gates）の後）。席の手の 1 歩は全部の席の起動行の器の plugin の dir の付け替え。
  - 第 1.4 版の改憲の字は、検証役がもう一度攻めた後に持ち主の字の承認を得てから入れる。それまでこの記録は提案中で、改訂の欄を持たない。
  - R-1 と新しい行の欄（key）は、行（t-seatcopy）が規則の表の欄（key）の閉じた一覧に値を足した後の設計の commit で書く。
  - 器の判断の記録（ADR-0045）と（ADR-0046）の受け直しは、ADR-36 の基準（A3）の 17 本の数えに入る。
note: 起草 w115a（2026-10-04）。数は係の表（drafts/w115a/w の measure.out・map-summary.out・refs-summary.out）と検証役 qv118 の報告から。持ち主の逐語は台帳の問い t3-hub.74.59.1〜.4 の notes に在り、ここには書かない。
