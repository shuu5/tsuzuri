  器の承認の欄: 裁定 (user)・user・裁定 id user 2026-09-26T08:28Z (席の起動を systemd の scope で包む・上限は 32 GiB = rules 行 seat.memory_max_mb 32768・§4 の「持ち込まない」を覆す)。 報告は 2026-09-25 12:55 JST (別 host の login 不能)。 要旨だけを写す。 逐語は非公開の作業記録簿 (台帳 s2-07l.627 の notes) に在る・裁定済
  器の承認の欄: 設計 (orchestrator)・orchestrator・2026-09-26 草稿 v1 (事故の追跡 (subagent の sed・破滅的 backtrack) と現物 (便の封じ込めの語列・席の起動行の導出・systemd-run --scope の exec の実測) を合わせて形にした。 拘束する constitution の版 0.5.0)・作成
  器の案の章の要約: 候補を 5 つ並べます。 席を起こす 1 行の頭に便と同じ箱を置く案 (選んだ案)、 席の Bash を hook で 1 command ずつ箱に包む案、 正規表現の字面を規則で見張る案、 machine の user 全体の囲いの上限を下げる運用で受ける案、 起動の前に箱を試しに作って作れない machine は縮退する案です。 選ばなかった 4 つは、 hook の限界・散文の規則は規則でない・ssh も同じ囲いに居る・試しの箱が test の machine を詰まらせる、 という理由で退けました。
  器の専門語の説明: 本文に出てくる専門語 9 個を、 やさしい言葉で説明します。
  ・席の箱（seat box）: 席の起動行の頭に置く systemd の scope。 上限は席の箱の行 (既定 32 GiB)。 溢れて殺されるのは箱の中の process だけ。 CPU の重みは付けない。
  ・封じ込めの箱（confinement scope）: 便 (runner / lens / 検証行) を閉じ込める memory 上限付きの囲い (ADR-1021)。 本 ADR は同じ語列と unit 名の関数で席の箱を組む。
  ・起動行の導出（launch line derivation）: 席の起動行 (env・claude・plugin・引数) を組む pure な 1 関数 (ADR-1026)。 本 ADR で頭の語列を Option で受け、 None なら 1 字も変わらない。
  ・縮退（degradation）: 箱を作れない周 (行が 0 / 読めない・道具が無い) に、 起動を止めずに素の行で起こし理由の語を出すこと (ADR-1021 と同じ極性)。
  ・起動の 1 行（launch line）: seat launch が stdout に出す結果 (launched / refused …)。 本 ADR で launched の末尾に scope=<unit 名|off|no-rules|no-systemd-run> が付く。
  ・user の slice（user slice）: systemd が user ごとに作る cgroup。 ssh の login も席もこの中に居るので、 席の 1 本の暴走が login を止める。
  ・管理 tick（management tick）: 席の外から周期で回り、 死んだ席を起こし直し、 移動の周に退避を撃ち、 黙った席へ合図を送る仕組み (ADR-1058・ADR-1066)。 箱の上限で claude が死んだ周もこれが起こし直す。
  ・subagent（subagent）: 席 (claude) が Agent tool で起こす下請けの agent。 その Bash も席の箱の中で走る。
  ・probe（probe）: 便の封じ込めが起動の前に scope を 1 つ作って作れるかを確かめる手 (ADR-1021)。 席の起動では撃たない (歯が実 scope を作る事故を避ける)。
  器の頁の末: このページは、大もとの機械データ (正本) から自動で組み立てられています。構造は機械が自動で検査し、内容が元データに忠実かは独立のレビューで確かめます。
