# 判断の記録 ADR-1072 — 器 scribe2 の判断の記録 ADR-0072 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1072
title: "席の起動を封じ込めの箱で包む — 席 (人と話す claude とその subagent) の起動行の頭に便と同じ systemd の scope (memory の上限は rules 行 1 本・32 GiB・CPU の重みは付けない) を置き、 行が 0 / 読めない周と道具が無い host は素の行に縮退し、 溢れて殺されるのは箱の中の 1 process だけで claude が死んだ周は管理 tick が起こし直す (ADR-1026 の「cgroup の防壁は席には持ち込まない」の読みを部分 supersede・要件は FR1059 / NFR1006 の範囲)"
status: accepted
date: 2026-09-26
context: |
  ADR-1021 は便 (runner / lens / 検証行) を memory の上限つきの箱に入れ、 ADR-1026 は席の起動を器に足すときに「前の版の launcher の cgroup の防壁は席には持ち込まない」と決めた。 2026-09-25 に席の subagent が撃った sed 1 本が RSS 81 GB まで膨らみ、 user の slice 全体が詰まって ssh の login まで止まった。 持ち主は 2026-09-26 に、 席の起動を systemd の scope で包み上限を 32 GiB とすると裁定した。
  なぜこの判断が要るのかを、 経緯 (便は箱の中・席は箱の外)・事象 (席の subagent の 1 本が machine を止めた)・器の今の部品・これまでの決まり・この判断の範囲の 5 つから説明します。 前の決定 (ADR-1021) は便を箱に入れ、 別の決定 (ADR-1026) は席を器で起こすときに「前の版の launcher の cgroup の防壁は席には持ち込まない」と決めました。 席は shell の子で器の子ではないからです。 2026-09-25 の事故で、 席の側にも箱が要ると分かりました。
  CTX1 経緯 — 便は箱の中、 席は箱の外 (ADR-1021・ADR-1026)
  ADR-1021 は便 (runner / lens / 検証行) を systemd の transient scope (memory の上限つきの箱) の内側で走らせ、 溢れたときに殺されるのは箱の中の process だけにした。 上限は rules 行 2 本 (gate.job_memory_mb と host.reserve_memory_mb) から導く 2 種で、 scope を作れない host は縮退（箱なしで起こすこと）して素の起動に戻る。 ADR-1026 は席の起動 (seat launch) を器に足すとき、 前の版の launcher が持っていた cgroup の防壁は席には持ち込まないと決めた。 席は shell の子で器の子ではなく、 NFR1006 (封じ込めの外で走る器の子 process 0 本) の対象でもないからである。 席 (人と話す claude と、 席が Agent tool で起こす subagent（席が起こす下請けの agent） と、 それらの Bash) は user の slice（その user の process 全部の囲い） に直に入る。
  CTX2 事象 — 席の subagent の 1 本が host 全体を止めた
  2026-09-25 12:10 JST 頃、 別 host が ssh と console の両方で login できなくなった。 原因は user の slice (MemoryHigh 100 GiB / MemoryMax 110 GiB) で 1 process が RSS 81 GB と swap 5.7 GB を使い、 slice 全体が throttle された (PSI memory full 98%・load 73)。 犯人は別 project の席の subagent が撃った sed 1 本で、 word-diff の長い行 (29〜12,663 字) に量指定子つきの後方参照を当てた破滅的 backtrack だった。 12:52 JST に TERM で消して復旧した。 同種の正規表現を配る skill や prompt は無く (grep 0 件)、 ad-hoc の 1 本だった。 便なら箱の中で 1 本が落ちて済んだが、 席には箱が無い。
  CTX3 現物 — 起動行の導出・封じ込めの語列・systemd-run --scope の振る舞い
  main c4d6d20 で、 席の起動行は seat/cycle/launch.rs の derive_launch (pure) が env 3 語 → claude → plugin dir の列 → host の面の引数の順で組み、 launch が役割の既定 (--model / --effort)・cd の前置・会話の引き継ぎの語を足して pane へ注入する。 登録 row には導出した行 (穴を埋める前) が載る。 起動の呼び手は 4 つ (seat launch・管理 tick の起こし直し・群の段の起こし直し・follow の起こし直し) で関数は 1 本。 便の封じ込め (pipe/confine.rs) は語列 scope_args (--user --scope --quiet --collect --unit=<name> -p MemoryMax=<mb>M -p CPUWeight=<w> -p OOMPolicy=continue) と unit 名の 1 関数 (<NAME>-<場所>-<段>-<n>-<pid>-<seq>) と probe（箱を試しに 1 つ作ること） (scope を 1 つ試しに作る) と閉じた理由 (no-systemd-run / no-scope / no-rules …) を持つ。 systemd-run --scope は -- の後ろの command を exec して自分は残らない (実測 — 子の親は起動した shell)。 pane の前面は claude のままで、 管理 tick（席を周期で見る仕組み） の「窓が shell か」の読みは変わらない。 env の前置は exec した子へ継承される。 e2e の道具箱は偽 systemd-run を PATH の先頭に積み、 実 scope を作らない。
  CTX4 憲法と既存の決定の向き (本 ADR の解釈)
  C2 (経路は 1 本) から、 席の箱（席を入れる memory の囲い）の語列は便の封じ込めと同じ 1 関数 (CPU の重みの有無の引数 1 つで 2 形) とし、 unit 名も同じ 1 関数で組む。 C10 (宣言値・実測値・導出値を分ける) から、 上限は rules 行の宣言値 (user 裁定 id つき)、 道具の有無は PATH の実測値、 起動の 1 行（seat launch が出す結果の 1 行）の scope= はその導出値で、 行を読めない周と道具が無い周は理由の語で縮退する (止めない)。 C17 (足すときに何を外すかを名指す) から、 足すのは rules 行 1 本・起動行の頭の語列・Launch の欄 1 つ・起動の 1 行の項目 1 つで、 外すのは無い (§4 の「持ち込まない」の判断を取り消す)。 決定はしごの各段を通した — 要るか (host の login 不能・持ち主の裁定)・既に在るか (便の箱は在るが席には無い)・既存の仕組みで足りるか (足りる — 便の scope の語列と unit 名の関数をそのまま使う)・1 行で書けるか (起動行の頭に語列 1 つ)・最小か (rules 行 1 本)。 N2 (散文にしか無い規則は規則として扱わない) から、 正規表現の字面を見張る形は退ける。 ADR-1021 の便の封じ込め、 ADR-1026 の口座の管理と起動の口、 ADR-1058 の管理 tick、 ADR-1067 の起こし直し (会話 id を運ぶ) は本 ADR の前提で変えない。
  CTX5 射程 — 動かすのは起動行の頭と rules 行 1 本・起動の 1 行の項目 1 つ
  動かすのは (1) 席の起動行の頭 (systemd の scope の語列・上限は rules 行 seat.memory_max_mb・値 0 と読めない周と道具の無い host は素の行)、 (2) 起動の 1 行の末尾の scope= (unit 名か縮退の語)、 (3) Launch の欄 1 つ (行の読み・4 つの呼び手が自分の manifest から埋める) の 3 つ。 動かさないのは、 席の起動の口と口座の選定・登録 row の形 (雛形には頭を載せない)・trust の書き・便の封じ込め (Wrap / probe / release)・管理 tick の判定の列・host の面・役割なしの手動の入口 (account shell)。 要件は FR1059 (席の起動) と NFR1006 (host の資源) の範囲に収まり、 SRS の改訂を伴わない。
  （選択肢を測るものさし）この判断を評価する 4 本のものさしです。 1 本の暴走が machine を道連れにしないこと (席とその subagent の Bash が溢れても殺されるのは席の箱の中だけ)。 上限は宣言値 1 つであること (規則の表の行 1 本で、 席ごと・役割ごとに分けない)。 止めずに縮退すること (道具が無い machine と行が 0 / 読めない周は素の行で起こし、 理由を結果の 1 行に出す)。 経路は 1 本であること (箱の語列と unit の名は便の封じ込めと同じ関数で、 席を起こす 4 つの呼び手は同じ 1 本を通る)。
  DR1｜1 本の暴走が host を道連れにしない — 席とその subagent の Bash が溢れても、 殺されるのは席の箱の中の process だけ (持ち主の裁定) CTX2・CTX5
  DR2｜上限は宣言値 1 つ — rules 行 1 本 (user 裁定 id つき) で、 席ごと・役割ごとに分けない (C10) CTX4
  DR3｜止めない、 縮退する — 道具が無い host と行が 0 / 読めない周は素の行で起こし、 理由を起動の 1 行に出す (ADR-1021 と同じ極性) CTX1・CTX3・CTX4
  DR4｜経路は 1 本 — 箱の語列と unit 名は便の封じ込めと同じ関数で、 起動の 4 つの呼び手は同じ 1 本を通る (C2・C17) CTX3・CTX4
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 器は規則の表に席の箱の行 (seat.memory_max_mb・既定 32768 MiB・裁定 id つき) を持ちます。 席を起こす 1 行の頭 (env の 3 語の直後・claude の前) に systemd の scope の語列を置き、 語列は便の箱と同じ関数 (CPU の重みは席には付けない)、 箱の名も便と同じ関数で組みます。 行が 0 / 読めない周と systemd-run が PATH に無い周は頭を付けず、 起動の前に箱を試しに作ることはしません。 登録の記録の雛形には頭を載せません。 結果の 1 行の末尾に箱の名か縮退の理由が付きます。 支えるのは FR1059 (席の起動) の根拠と、 NFR1006 (machine の資源)・FR1027 (見回り) への主張です。
  採用 — OPT1
  器 SHALL rules 行 seat.memory_max_mb (MiB の整数・既定 32768・user 裁定 id つき) を埋め込み manifest に持つ。 席の起動 SHALL 起動行の頭 (env 3 語の直後・claude の前) に systemd-run --user --scope --quiet --collect --unit=<name> -p MemoryMax=<mb>M -p OOMPolicy=continue -- の語列を置き、 語列 SHALL 便の封じ込めの scope の語列と同じ 1 関数 (CPU の重みの有無の引数 1 つ・席は付けない) とし、 unit 名 SHALL 便と同じ 1 関数 (<NAME>-<target>-seat-0-<pid>-<seq>) で組む。 値 0 と読めない周 SHALL 頭を付けず (語 no-rules)、 systemd-run が PATH の dir に実行可能な file として無い周 SHALL 頭を付けず (語 no-systemd-run)、 起動 SHALL NOT probe を撃たない。 登録 row の雛形 SHALL 頭を載せない。 起動の 1 行 SHALL 末尾に scope=<unit 名|off|no-rules|no-systemd-run> を持つ。 起動の 4 つの呼び手 SHALL 同じ 1 本を通り、 行の読みを自分の manifest から渡す。 席の起動の口・口座の選定・登録 row の形・trust の書き・便の封じ込め・管理 tick の判定の列・役割なしの手動の入口 SHALL 変えない。 本 ADR は ADR-1026 の「cgroup の防壁は席には持ち込まない」の読みを置き換え、 要件は FR1059 / NFR1006 の範囲で SRS の改訂を伴わない。
  （平易）器は規則の表に席の箱の行 (seat.memory_max_mb・MiB の整数・既定 32768・裁定 id つき) を持ちます。 席を起こす 1 行の頭 (env の 3 語の直後・claude の前) に systemd-run --user --scope --quiet --collect --unit=<名> -p MemoryMax=<上限>M -p OOMPolicy=continue -- の語列を置き、 語列は便の箱と同じ 1 関数 (CPU の重みの有無だけ引数で分け、 席は付けない)、 箱の名は便と同じ 1 関数 (scribe2-<席>-seat-0-<pid>-<通し番号>) で組みます。 行が 0 / 読めない周は頭を付けず (理由 no-rules)、 systemd-run が PATH の dir に実行できる file として無い周も頭を付けず (理由 no-systemd-run)、 起動の前に箱を試しに作ることはしません。 登録の記録の雛形には頭を載せません。 結果の 1 行の末尾に scope=<箱の名|off|no-rules|no-systemd-run> が付きます。 席を起こす 4 つの呼び手は同じ 1 本を通り、 行の読みを自分の規則の表から渡します。 席の起動の口・口座の選定・登録の記録の形・trust の書き・便の封じ込め・見回りの判定の順・役割なしの手動の入口は変えません。 この記録は ADR-1026 の「cgroup の防壁は席には持ち込まない」の読みを置き換え、 要件書は変えません (FR1059 / NFR1006 の範囲)。
  （理由）持ち主の裁定は、 席の起動を systemd の箱で包み上限を 32 GiB とする、 の受諾でした (本席の推奨は 16 GiB で、 持ち主は余地を優先して 32 GiB を選びました)。 箱の語列と名を便の封じ込めと同じ関数にするのは、 同じ意味の語列が 2 か所にあると片方だけ直す事故が起きるからです。 CPU の重みを席に付けないのは、 対話の席を便より軽くする理由が無いからです。 起動の前に箱を試しに作らないのは、 席の起動の歯が偽の systemd-run を積まず、 試しの箱が本物の scope を作って test の machine の systemd を詰まらせた事故があるからで、 席の起動は user の session manager が在る machine が前提 (見回りの unit と同じ) です。 上限を規則の表の行 1 本にするのは、 宣言値に裁定 id が残り、 席ごと・役割ごとに分ける理由が無いからです。 hook で command ごとに包む案は subagent の Bash が hook を通らず合計も抑えられない、 正規表現の見張りは散文の規則で塞ぐ先が無い、 囲いの上限の運用は ssh も同じ囲いに居る、 という理由で退けました。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1059（rationale）: FR1059 (席の起動) は起動行の導出と注入を書く。 本 ADR は起動行の頭に封じ込めの箱（便を入れる memory の囲い）を置く根拠 (host の login 不能・裁定 2026-09-26T08:28Z) と縮退の形を与える。
  NFR1006（claim）: NFR1006 (host の資源) は封じ込めの外で走る器の子 process 0 本を目標にする。 席は器の子ではないが、 本 ADR は席の起動行にも同じ箱を付けて host の資源を守ると主張する (目標の文は変えない)。
  FR1027（claim）: FR1027 (管理 tick) の起こし直しは本 ADR の後も同じ 1 本を通り、 箱の上限で claude が死んだ周は窓が shell に戻って起こし直される。 本 ADR は判定の列を変えないと主張する。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録は前の決定 ADR-1026 の「cgroup の防壁は席には持ち込まない」の読みだけを置き換え、 他は保ちます。 保つのは、 ADR-1026 の machine の面の宣言・口座の口・席の起動の口と口座の選定・登録の記録の形、 ADR-1021 の便の封じ込め (2 種の上限・縮退・記録)、 ADR-1058 の見回り、 ADR-1067 の起こし直しの全部です。 行き着く原則は「器が起こす process は便も席も箱の中で走る。 上限は宣言値 1 つで、 箱が作れない周は理由を出して素で起こす」です。
  改訂状態: current
  置き換える ADR: ADR-1026
  置き換えられた: なし (現行)
  部分 supersede で、 置き換えるのは 1 つ — ADR-1026 の「前の版の launcher が持つ cgroup の防壁は席には持ち込まない」の読み (席の起動行の頭に器の封じ込めの箱を置く) — で、 他は保つ。 保つのは、 ADR-1026 の host の面の宣言・口座の口 4 つ・席の起動の口と口座の選定・登録 row の形、 ADR-1021 の便の封じ込め (2 種の上限・縮退・record)、 ADR-1058 の管理 tick、 ADR-1067 の起こし直し、 の全部。 発効は本 ADR が accepted になり契約表の行 t が land した時点。
  照会終端 — PRIN-EVERY-VESSEL-PROCESS-HAS-A-BOX
  器が起こす process は便も席も箱の中で走る。 上限は宣言値 1 つで、 箱が作れない周は理由を出して素で起こす。
  本 ADR が hook で command ごとに包む案・正規表現の見張り・slice の運用・probe の流用を退け、 便と同じ語列を rules 行 1 本の上限で席の起動行の頭に置いたのはこの原則に行き着く (これ以上は遡らない照会終端)。
options:
  - id: "OPT1"
    name: "席の起動行の頭に便と同じ scope を置く (上限は rules 行 1 本・CPU の重みは付けない・probe は撃たない)"
    text: |
      rules 行 seat.memory_max_mb (MiB・既定 32768・裁定 id つき) を足す。 起動行の導出（席を起こす 1 行を組む関数） (pure) は頭の語列を Option で受け、 launch が決める — 値 0 / 読めない周は無し (語 no-rules)、 systemd-run が PATH の dir に実行可能な file として無い周は無し (語 no-systemd-run)、 在れば systemd-run --user --scope --quiet --collect --unit=<name> -p MemoryMax=<mb>M -p OOMPolicy=continue -- を env 3 語の直後・claude の前に置く。 語列は便の scope_args と同じ関数 (CPU の重みの有無の引数 1 つ)、 unit 名は便と同じ unit_name (<NAME>-<target>-seat-0-<pid>-<seq>)。 probe (scope を試しに作る) は撃たない。 登録 row の雛形には頭を載せない。 起動の 1 行の末尾に scope=<unit 名|off|no-rules|no-systemd-run>。 溢れた周は箱の中の 1 process が殺され、 claude が死んだ周は管理 tick が起こし直す。 決め手は現物 (持ち主の裁定)。
      （平易）席を起こす 1 行の頭に、 便と同じ systemd の scope (memory の上限つきの箱) を置く案です。 上限は規則の表の行 1 本 (既定 32 GiB)、 CPU の重みは席には付けません。 行が 0 / 読めない周と systemd-run が無い machine は頭を付けずに素の行で起こし、 結果の 1 行に理由を出します。 起動の前に箱を試しに作ることはしません。 溢れて殺されるのは箱の中の process だけで、 claude 自身が死んだ周は見回りが起こし直します。 他の席と ssh が生き、 上限が宣言値 1 つで、 語列と名が便と同じ関数である点で勝ります。 代わりに、 起こす 1 行が長くなって既存の歯の期待が動き、 session manager の無い machine では起こす行が失敗し、 上限に届いた周は claude 自身が殺されて turn が失われることがあります。 持ち主の裁定で選びました。
      利点: 席の subagent の Bash が溢れても殺されるのは席の箱の中で、 他の席と ssh は生きる (DR1)
      利点: 上限は rules 行 1 本の宣言値で、 裁定 id が残る (DR2)
      利点: 道具の無い host と行が 0 / 読めない周は素の行で起こし、 理由が起動の 1 行に出る (DR3)
      利点: 語列と unit 名が便の封じ込めと同じ関数で、 4 つの呼び手が同じ 1 本を通る (DR4)
      欠点: 席の起動行が長くなり、 起動行を pin する既存の歯 (31 本) の期待が動く
      欠点: probe を撃たないので、 systemd-run は在るが user の session manager が無い host では起動行が pane で失敗する (管理 tick の unit と同じ前提・その host では行を 0 にする裁定で戻せる)
      欠点: 箱の上限に届いた周は claude 自身が殺されることがあり、 会話は管理 tick の起こし直し (--resume) で戻るが、 その周の turn は失われる
    verdict: adopted
    reason: "決め手は現物 (持ち主の裁定)。"
  - id: "OPT2"
    name: "席の Bash を hook で 1 command ずつ scope に包む"
    text: |
      PreToolUse の見張り (host-guard) が撃つ command を systemd-run の scope で包む。 決め手は分析 (hook の限界)。
      （平易）席の Bash を、 hook (command を撃つ前の見張り) で 1 command ずつ箱に包む案です。 落ちるのが 1 command だけで claude 自身は殺されない点で勝ります。 けれども、 hook は command を書き換えられず、 subagent の Bash は hook を通らない周が在ります。 上限も command ごとで、 席の合計 (並走する Bash と claude 自身) を抑えられません。 退けました。
      利点: 落ちるのは 1 command だけで、 claude 自身は殺されない
      欠点: PreToolUse は command を書き換えられず、 subagent の Bash は hook を通らない周が在る (DR1)
      欠点: 上限が command ごとで、 席の合計 (並走する Bash と claude 自身) を抑えられない (DR2)
    verdict: rejected
    reason: "決め手は分析 (hook の限界)。"
  - id: "OPT3"
    name: "正規表現の字面を見張る (規則で塞ぐ)"
    text: |
      破滅的 backtrack の形 (量指定子つきの後方参照など) を prompt や hook の規則で禁じる。 決め手は分析 (N2)。
      （平易）破滅的な正規表現の形を prompt や hook の規則で禁じる案です。 今回の事故の直接の原因に当たる点で勝ります。 けれども、 散文にしか無い規則は規則として扱えず、 GNU sed には複雑度の上限が無いので塞ぐ先がありません。 次の暴走は正規表現とは限りません。 退けました。
      利点: 今回の事故の直接の原因に当たる
      欠点: 散文にしか無い規則は規則として扱えず (N2)、 GNU sed には複雑度の上限が無いので塞ぐ先が無い (DR1)
      欠点: 次の暴走は正規表現とは限らない (DR1)
    verdict: rejected
    reason: "決め手は分析 (N2)。"
  - id: "OPT4"
    name: "user の slice の MemoryHigh を下げる (host の運用)"
    text: |
      systemd の user slice の上限を下げ、 暴走が host の他の部分に及ばないようにする。 決め手は分析 (器の外・同じ slice)。
      （平易）machine の user 全体の囲い (slice) の上限を下げて、 暴走が machine の他の部分に及ばないようにする運用の案です。 器に足すものが無い点で勝ります。 けれども、 ssh の login も同じ囲いに居るので、 囲いの上限では login 不能を防げません。 machine の運用であって、 器の宣言値にも記録にもなりません。 退けました。
      利点: 器に足すものが無い
      欠点: ssh の login も同じ slice に居るので、 slice の上限では login 不能を防げない (DR1)
      欠点: host の運用で、 器の宣言値にも記録にもならない (DR2・DR3)
    verdict: rejected
    reason: "決め手は分析 (器の外・同じ slice)。"
  - id: "OPT5"
    name: "起動で probe を撃ち、 scope を作れない host は縮退する (便の封じ込めと同じ)"
    text: |
      便の封じ込めと同じく、 起動の前に scope を 1 つ試しに作り、 作れない host は素の行に縮退する。 決め手は分析 (歯が実 scope を作る)。
      （平易）便の封じ込めと同じく、 起動の前に箱を 1 つ試しに作って、 作れない machine は素の行に縮退する案です。 session manager の無い machine でも起こす行が失敗しない点で勝ります。 けれども、 席の起動の歯 (test) は偽の systemd-run の道具箱を積まないので、 試しの箱が本物の scope を作って test を走らせた machine の systemd を詰まらせます (以前の事故と同じ形)。 席の起動は user の session manager が在る machine が前提 (見回りの unit と同じ) なので、 試しの箱が守る周がありません。 退けました。
      利点: session manager の無い host でも起動行が失敗しない
      欠点: 席の起動の歯は偽 systemd-run の道具箱を積まないので、 probe が実 scope を作り user の systemd を詰まらせる (台帳 .504 の事故と同型) (DR4)
      欠点: 席の起動は user の session manager が在る host が前提 (管理 tick の unit と同じ) で、 probe が守る周が無い (DR3)
    verdict: rejected
    reason: "決め手は分析 (歯が実 scope を作る)。"
basis: [FR1027, FR1059, NFR1006, ADR-1021, ADR-1026, ADR-1058, ADR-1066, ADR-1067]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「席」は人と AI が話す 1 つの session (その席が起こす下請けの agent = subagent と、 それらが撃つ Bash を含む)、 「便」は器が起こす作業の process (実装役・審査役・検証の行)、 「箱」は memory の上限つきの囲い (systemd の scope) です。 これまで便は箱の中で走り、 溢れても便 1 本が落ちるだけで済みましたが、 席には箱が無く、 2026-09-25 に席の subagent が撃った sed 1 本が RSS 81 GB まで膨らんで machine 全体が詰まり、 ssh の login まで止まりました。 この記録は、 席を起こす 1 行の頭にも便と同じ箱 (上限は規則の表の行 1 本・32 GiB・CPU の重みは付けない) を置くと決めます。 道具が無い machine や行が 0 / 読めない周は今までどおりの素の行で起こし、 理由を結果の 1 行に出します。 溢れて殺されるのは箱の中の process だけで、 席の claude 自身が死んだ周は見回り (管理 tick) が起こし直します。 持ち主は 2026-09-26 に上限を 32 GiB と裁定しました。
