  verbatim: "器の台帳 s2-07l.627 の notes に在る（この file に写さない）"
  surface: R-8
consequences:
  - "この判断で良くなること 3 つと、 代わりに引き受けること 3 つです。 良くなるのは、 席とその subagent の Bash が溢れても殺されるのは席の箱の中だけで他の席と ssh が生きること、 上限が規則の表の行 1 本の宣言値で結果の 1 行に箱の名か理由が出ること、 箱の語列と名が便と同じ関数で 4 つの呼び手が同じ 1 本を通ることです。 引き受けるのは、 起こす 1 行が長くなり既存の歯 31 本の期待が動くこと、 試しの箱を作らないので systemd-run が在って user の session manager が無い machine では起こす 1 行が失敗すること (行を 0 にする裁定で戻す)、 上限に届いた周は claude 自身が殺されることがあり、 会話は起こし直しで戻るがその turn は失われることです。"
  - "良い結果: 席とその subagent の Bash が溢れても、 殺されるのは席の箱の中の process だけで、 他の席と ssh の login は生きる"
  - "良い結果: 上限は rules 行 1 本の宣言値で裁定 id が残り、 起動の 1 行に箱の unit 名か縮退の理由が出る"
  - "良い結果: 箱の語列と unit 名は便の封じ込めと同じ関数で、 席の起動の 4 つの呼び手が同じ 1 本を通る"
  - "代償: 起動行が長くなり、 起動行を pin する既存の歯 31 本の期待が動く (雛形の pin は素のまま)"
  - "代償: probe を撃たないので、 systemd-run が在って user の session manager が無い host では起動行が pane で失敗する。 その host では行を 0 にする裁定で戻す"
  - "代償: 上限に届いた周は claude 自身が殺されることがあり、 会話は起こし直しで戻るがその turn は失われる"
note: |
  器の元の file: scribe2/design-intent/decisions/ADR-0072-seats-launch-inside-a-memory-bounded-scope.html
