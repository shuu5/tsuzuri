  verbatim: 推奨で良い
  surface: R-8
note: 逐語は t3-hub.67.31 の notes。同じ commit で、判断の記録の封（anchors/adr-seals.yaml）に ADR-22 の行を足し（folio check --freeze-adrs）、計画（surface-plan）の 6 節の folio の持ち込みの段落を直す。ADR-18 の本文は封で凍っているので変えず、決定 (3) の folio2 の分の置き換えはこの記録の決定 (1) だけが持つ。ノート surface-wave23b の 6 節（着地した行 t-pub-fp）の「commit id を保つ」の字と、7 節（止めた行 t-carry-ex）は変えない。t-pub-fp は移し替えた後も要る（写しの commit の本文にも元の本文の字が残り、それらは本流の外の 2 本目の親の側に在る）。対応表は持ち込みの merge の直後の設計席の commit で置く。
