# 判断の記録 ADR-22 — folio2 の履歴を folio2/ の下へ移し替えて持ち込み、判断の記録 ADR-18 の決定 (3) を folio2 の分について改める（発効 2026-09-29・持ち主の裁定 t3-hub.67.31・記帳先 = tsuzuri の台帳の問いの notes）
# 判断の記録 ADR-18 の決定 (3) を folio2 の分について置き換える（部分の置き換え・ADR-18 のほかの決定は効いたまま）。ADR-18 は封の一覧で本文が凍っているので本文は変えない（前例 ADR-15）。ADR-4 の決定 (3) の字は変えない。
# 問いの本文と検証役の見立ては台帳 t3-hub.67.31 の notes。移し替えの道具と数は folio2 の席の確かめ（f1-verify と f1b-tools の記録）と席の予行。
id: ADR-22
title: folio2 の履歴は、中身と作者と日付と本文を保ったまま path を folio2/ の下へ移し替えた写しにして別の根として merge し、commit の番号が変わる分は対応表と凍結した folio2 の repo で引く
status: accepted
date: 2026-09-29
context: |
  判断の記録 ADR-18 の決定 (3) は、scribe2 と folio2 の履歴を commit の番号（id）を保って持ち込み（別の根として merge し sub-dir へ移す・ADR-4 の決定 (3)）、台帳の notes・commit の trailer・走行の記録・binary の世代が指す番号を解けるまま残すと決めた。
  席が tsuzuri の main の写しに folio2 を番号を保ったまま別の根として merge すると、folio の床の凍結 anchor の検査が tsuzuri の憲法の文書を不合格と誤って判じた（偽の違反 9）。検査は置き場の path で全部の枝（ref）の履歴を読み、folio2 の昔の憲法の文書が同じ置き場 design-intent/anchors/ に在ったためである。元の folio2 の履歴を枝として取るだけの形も、別の置き場へ番号を保って入れる形も、同じ違反 9 で落ちる。
  番号を保つ代わりの道（folio の検査を直す folio2 の便 210）は、folio2 の検証役が「憲法の文書をもう一方の repo のものへ差し替える細工が黙って通る」穴を見つけ、folio2 の席は採らないことにした。検証役は、履歴だけでは塞げず、持ち込むたびに番号の組の表を folio に足す形が要ると見ており、その案は試作されていない。
  folio2 の席は、folio を直す代わりに、持ち込む前に folio2 の履歴を folio2/ の下へ移し替える形を推した。移し替えは tsuzuri の席が folio2 の写し（clone）で撃ち、元の folio2 の repo は書き換えない。道具は git 本体と小さな script だけで、数秒で済み、書き出しの手（fast-export）なら撃つ人の設定に依らず同じ結果になる。中身・作者・記録者・日付・本文は元と同じで、folio2/ の木は元の木と同じである。検査の結果（今の folio のまま）は、tsuzuri の design-intent/ も folio2/design-intent/ も違反 0（浅い写し（clone）でも 0）。移し替えた後の細工（文書の差し替え・削除・書き換え）は、撃った形では落ちた（違反 5・1・4。folio2/ の側の 1・4 は、その検査を撃つ見張りを足したとき）。
  移し替えで変わるのは 3 つである。(1) folio2 の commit の番号が全部変わる（試しの folio2 0c910db で 595 本・今の folio2 の本流 b99daea で 597 本。持ち込む時点は folio2 の直し F3 の着地の後なので数本増える）。(2) GitHub の署名つきの commit（0c910db で 392 本・b99daea で 393 本）は署名が消え、付け直せない（GitHub の web の merge の鍵の署名。元の repo には残り、そこで確かめられる）。(3) 番号を指す字は tsuzuri の中では直に辿れない。tsuzuri の file 17 本に 62 か所・commit の本文に 37 か所（目安）のほか、持ち込む folio2 自身の file と本文にも在る（数えていない）。
  今の scribe2 は、履歴に憲法の文書の dir（design-intent/anchors/）が無く、番号を保ったまま検査が通った（違反 0・今の folio の検査で）。
  席はこれを持ち主に問い（t3-hub.67.31）、持ち主は推奨の案 A を選んだ。
decision: |
  (1) ADR-18 の決定 (3) を、folio2 の分についてこの決定に置き換える。folio2 の履歴は、中身・作者・記録者・日付・本文を保ち、path を folio2/ へ移した写しを、共通の祖先の無い別の履歴として merge する。元の番号は対応表と凍結した folio2 の repo で引く。ADR-18 のほかの決定は効いたままとする。
  (2) ADR-4 の決定 (3) は字を変えない。元の repo を書き換えないまま、「履歴を保つ」を、中身・作者・日付・本文を保つと読む。
  (3) 移し替えは、持ち込みの時に tsuzuri の席が folio2 の写し（clone）で撃ち、元の folio2 の repo は書き換えない。道具は git 本体と folio2 の席の小さな script で、script は指紋（sha256）を確かめてから写して使い、新しい道具は足さない。主の手は書き出しの手（fast-export と fast-import）とし、索引の手（filter-branch）でも撃って、2 つの手の先頭の番号と対応表が同じことを見る。merge の前に、本数が同じ・写しの先頭の folio2/ の木が元の先頭の木と同じ・全部の commit の作者と記録者と日付と本文の要約が同じ・対応表の行の数が本数と同じ・対応表の全行の照らし（作者・記録者・日付・本文・親・木）で合わない行が 0、を確かめる。merge は、木が重ならないので共通の祖先の無い履歴を許す指定（allow-unrelated-histories）だけで組み、1 本目の親は tsuzuri の main、2 本目の親は写しの先頭とする。
  (4) 元の（書き換えていない）folio2 の履歴は、tsuzuri の中へどんな形でも入れない（枝として取るだけでも床が違反 9 で落ちる）。tsuzuri の中で履歴の書き換えの命令を撃たない（元の履歴の控え（ref）が残る）。
  (5) 失うものは 3 つである。(ア) folio2 の commit の番号が全部変わる。(イ) GitHub の署名は写しでは消え、付け直せない。元の repo に残り、そこで確かめる。(ウ) 番号を指す字は tsuzuri の中では直に辿れない。ADR-18 の決定 (3) が「解けるまま」と名指した台帳の notes・commit の trailer・走行の記録・binary の世代が指す folio2 の番号も同じである。
  (6) 解き方は 3 つである。(ア) 対応表（docs/carry/folio2-ids.tsv・古い番号と新しい番号の組を 1 行ずつ・番号の字だけ）を、持ち込みの merge の直後の設計席の commit で置く。写しは決定的なので、表は凍結した folio2 の repo の同じ commit からいつでも作り直せて、全行を照らせる。(イ) 元の番号と署名は、凍結して保管する folio2 の repo（ADR-18 の決定 (1)）で引く。(ウ) tsuzuri の中から元の番号を引く口は、任意の git notes（既定では push されない）だけとし、置くかは席が決める。元の履歴を tsuzuri に別に持つ道は取らない（決定 (4)）。
  (7) scribe2 の履歴の形は、scribe2 の持ち込みの前に、scribe2 の履歴に design-intent/anchors/ が在るかと、写しの予行（番号を保つ merge の後の床と、path で履歴を読むほかの口〔git log の path の指定など〕が scribe2 の昔の design-intent/ の commit を tsuzuri のものと取り違えないか）で決める。無く、予行の床が違反 0 で取り違えも無いなら、ADR-18 の決定 (3) のとおり番号を保つ。在るか、床が落ちるか、取り違えが在るなら、移し替えるかを持ち主に問う。scribe2 は台帳・trailer・走行の記録・binary の世代が指す番号が folio2 よりずっと多い。
  (8) 持ち込んだ後、folio2/ の中の床（folio2/design-intent の検査）を撃つ見張りは今は無い（床を撃つのは設計の commit の門だけで、根の床だけを撃つ。CI は床を撃たない）。folio2/ の側の細工は、その床を撃てば落ちる。見張りを置く仕事は、計画（surface-plan）の 6 節の folio の持ち込みの段落に後の仕事として持ち、後の行を起草する時に置き場を決める。
options:
  - id: a
    name: folio2 の履歴を folio2/ の下へ移し替えて持ち込む
    text: 決定 (1) から (8)。
    verdict: adopted
    reason: folio を直さずに済み、偽の違反も、撃った細工の形で黙って通るものも出ない。失うのは番号の直のつながりと署名で、tsuzuri の中では対応表を引き、署名は凍結した folio2 の repo で見る（ADR-18 が案 d を退けた理由と同じ種類の損を、folio2 の分で受ける）。持ち主は推奨のこの案を選んだ（t3-hub.67.31）。
  - id: b
    name: 番号を保ち、folio の検査の直しを待つ
    text: folio2 に、差し替えの穴を塞ぐ folio の直しを設計し直してもらい、その着地を待って番号を保ったまま持ち込む。
    verdict: rejected
    reason: 番号を保てて、台帳や記録が指す番号も tsuzuri の中で解ける。ただし穴を塞ぐ folio の直しの設計・試作・検証とその承認がこれから要り、塞げるかもまだ確かめておらず、持ち込みはその分遅れる。検証役は、持ち込むたびに番号の組の表を folio に足す形が要ると見ている。
  - id: c
    name: 番号を保ち、床の偽の違反を除く口を足す
    text: 番号を保ったまま merge し、持ち込んだ履歴の凍結の文書を床の検査から外す口を置く。
    verdict: rejected
    reason: 条 N-3（例外の仕組みを作らない）に当たる。外す口は、同じ path の本物の差し替えも黙らせる。
basis: [ADR-18, ADR-4, P-2, N-3, CON2]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、持ち込みの控え（t3-hub.67）の notes に 1 件ごとに記帳する（日付・材料・当たった条件）。問う相手は持ち主。
    (1) 台帳の notes・commit の trailer・走行の記録・binary の世代・tsuzuri の file か commit の本文が指す folio2 の番号のうち、対応表でも凍結した folio2 の repo でも解けないものが 1 つでも見つかったら、持ち込みの形（決定 (1)(6)）を問い直す。
    (2) 持ち込みの時か後に、対応表の全行の照らしで合わない行が 1 つでも在るか、凍結した folio2 の repo の同じ commit から作り直した表が置いた表と byte で違えば、持ち込みの形を問い直す（持ち込みの前なら script が止まり、merge しない）。
    (3) 凍結した folio2 の repo が読めなくなったら（消えた・書き換わった・非公開になった）、元の番号と署名を引く道（決定 (6)）を問い直す。
plain: |
  folio2 の中身を tsuzuri に持ち込むとき、folio2 の履歴を「folio2/ という dir の下に最初から在った」形に移し替えてから入れる、と決めた記録です。
  そのまま入れると、tsuzuri の設計の検査が、folio2 の昔の文書を tsuzuri の文書と取り違えて「不合格」と誤って出します。移し替えれば検査は今のまま正しく働き、検査の道具を直す必要がありません。
  中身・書いた人・日付・説明文はそのままです。変わるのは commit の番号で、GitHub の署名も消えます。古い番号と新しい番号の対応表を tsuzuri に置き、元の folio2 の repo は消さずに凍結して残すので、古い番号と署名はそこで確かめられます。
  scribe2 は後で持ち込む前に、同じ取り違えが起きるかを確かめてから形を決めます。今の見込みでは、scribe2 は番号を保ったまま入れられます。
  この記録はあなたの承認で発効しています。承認の記帳先は tsuzuri の台帳の問いです。
approval:
