  器の承認の欄: 裁定 (user)・user・裁定 id user 2026-09-24T22:56Z (移り先の口座が anchor を trust していない穴は、 依存を足さず、 既存の入れ子 JSON の読み手に書き手を足す形で器が塞ぐ、 という推奨の受諾。 同日 13:38Z の serde_json を足す推奨の受諾は前提の誤りで取り下げ)。 要旨だけを写す。 逐語は非公開の作業記録簿 (台帳 s2-07l.609 の notes) に在る・裁定済
  器の承認の欄: 設計 (orchestrator)・orchestrator・2026-09-25 草稿 v1 (設計 host-init.md の §7 と契約表の行 e・account-autonomy.md §5 (2) と §10 を、 現物の口 (入れ子 JSON の読み手・doctor の trust= の読み手・seat launch の 1 本と呼び手 3 つ) の読みと合わせて形にした。 拘束する constitution の版 0.5.0)・作成
  器の案の章の要約: 候補を 7 つ並べます。 席を立てる口が登録の後・差し込みの前に既存の読み手に足した書き手で印を置く案 (選んだ案)、 JSON の部品を足して書く案、 設定 file を丸ごと書き直す案、 画面の問いを読んで key を送る案、 repo を載せる init の段で全部の口座に先に印を置く案、 印が無ければ起動を断る案、 設定 file の中身を host の宣言 file に写す案です。 却下した 6 案にも利点を並べ、 退けた決め手が現物か分析かを各案に書きます。 部品を足す案は書き手の code が最小になる点で、 丸ごと書く案は書き手が単純になる点で、 画面を読む案は file に触らない点で、 init で先に置く案は起動の口を変えない点で、 起動を断る案は Claude Code の file を書かない点で、 宣言に写す案は器が読むのを自分の面だけにできる点で、 選んだ案に勝ります。
  器の専門語の説明: 本文に出てくる専門語 9 個を、 やさしい言葉で説明します。 この記録で意味を決めた語は「trust の印」の 1 つで、 残りは器と Claude Code の側の言葉です。
  ・trust の印（trust flag）: 口座の設定 dir の .claude.json に在る、 anchor ごとの「この folder を信じる」の印 (projects の下のその anchor の項目の真偽)。 true なら Claude Code はその folder (anchor) で起動の trust dialog を出さない。 本 ADR の後は席の起動の 1 本が起動行の前に true に置き、 doctor は読むだけ。
  ・trust dialog（trust dialog）: Claude Code が、 その口座で一度も信じると答えていない folder で起動したときに出す確認 (既定は No, exit)。 答えるまで席は立たない。 器は pane の字面でこれに答えない (C3.3)。
  ・口座の設定 dir（account config dir）: state dir の accounts の下の label の dir (実 dir か symlink・ADR-1017 §2.3)。 Claude Code の credential・settings・.claude.json が在る。 本 ADR が書くのはこの dir の .claude.json の trust の印 1 key だけ。
  ・JSON の木（JSON tree）: 器が std だけで持つ入れ子 JSON の読み手 (parse / Tree / render)。 RFC 8259 の 6 形を読み、 数は 10 進の字面のまま持ち、 重複 key を拒み、 木を JSON に戻せる。 本 ADR はこれに「path に真偽を置く」と「書き戻す」の 2 関数を足す。
  ・席の起動（seat launch）: 器の subcommand seat launch が役割と口座から起動行を導き、 席の登録を先に書いて tmux の窓へ差し込むこと (ADR-1026・ADR-1063 の引数の無い形を含む)。 本 ADR の後は、 登録を書いた後・置き換えと差し込みの分岐の前に trust の印を置く。 呼び手は 3 つ (seat の長い形と短い形・群の移動の周・tick の移動の周)。
  ・群の移動（group move）: project の群の今の口座が逼迫したとき、 host の lock の内側で移り先を 1 回だけ決め、 新しい口座で新しい席を起こし、 古い席へ退避の合図を送ること (ADR-1049 §2・ADR-1055・SRS FR1038)。 本 ADR は移り先の口座が anchor を trust していない周に人の手を待つ穴を塞ぐ。
  ・anchor（anchor）: 対象 repo の main checkout の絶対 path。 席と便の鍵の一部 (SRS FR1040)。 trust の印はこの path を key にして口座ごとに置かれる。
  ・doctor（doctor）: 器の状態と host の配線を 1 回で照合して行に並べる subcommand。 trust= の行 (accepted / missing / unreadable) で口座 × anchor の印を読む (読むだけ・本 ADR で変えない)。
  ・裁定 id（ruling id）: user 裁定を一意に指す id。 裁定の時刻 (UTC)。 本 ADR は 2026-09-24T22:56Z を指し、 同日 13:38Z の裁定は取り下げられた。
