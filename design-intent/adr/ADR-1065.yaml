  置き換えられた: なし (現行)
  部分 supersede で、 置き換えるのは ADR-1026 の trust に関する 2 か所を、 trust の印 1 key に限ってである。 (1) ADR-1026 §2.2 の「login そのものと trust の受け入れは user が行い、 器は credential に触りません」のうち trust の受け入れを、 器が起こす席の起動の 1 本に限って、 口座の設定 dir の .claude.json の projects の下の <anchor> の hasTrustDialogAccepted を器が true に置く形に読み替える。 login は user の手番のままで、 account add の口 (login の起動行を差し込む) は変えない。 (2) ADR-1026 §2.5 が射程外とした「login と trust の代筆」のうち trust の代筆を、 同じ範囲で本 ADR が決める。 設計 account-autonomy.md §10 の却下 (器が .claude.json に印を書く形) は同 doc が本 ADR で supersede 済みと記す。 ADR-1017 は supersede しない。 §2.3 (credential を読まず・書かず・代筆せず) は不変で、 .credentials.json と settings.json はその fence のまま。 §2.5 (再 login は user の手番) は .claude.json と trust に触れていない。 ADR-1045 §2 (2) (立て直しの廃止)・ADR-1049 §2 (群の移動の形)・ADR-1055 (移動の周)・ADR-1063 (init と引数の無い起動)・ADR-1062 (子 process の記述) は不変。 発効は本 ADR が accepted になった後で、 それまで何も拘束しない。
