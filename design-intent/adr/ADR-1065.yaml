    text: |
      起動後に pane を読み、 trust dialog が出ていれば承認の key を送る。 13:38Z の裁定の代替案として上がっていた形。 決め手は分析 (C3.3)。
      （平易）起動した後に画面を読み、 問い (trust dialog) が出ていれば承認の key (Enter か Down + Enter) を送る案です。 1 回目の決定のときに代替案として上がっていた形です。 file に触らず、 user が問いに答えるのと同じ手を器が打つ点で勝ります。 けれども、 端末の描画を判定に使うことになり、 決まり (C3.3) と設計 doc の前の却下に反します。 既定の選択肢や行の字面が Claude Code の版で変わると誤った key を送り、 送った key が問い以外に届く周も生まれます。 決め手は分析です。
      利点: file に触らず、 user が dialog で答えるのと同じ手を器が打つ
      欠点: 端末の描画を判定入力にする (C3.3・account-autonomy.md §10 の却下のまま) (DR5)
      欠点: 既定の選択肢や行の字面が Claude Code の版で変わると誤った key を送る。 送った key が dialog 以外に届く周を作る (DR5)
    verdict: rejected
    reason: "決め手は分析 (C3.3)。"
  - id: "OPT5"
    name: "init の段で全口座 × anchor を先に trust する"
    text: |
      repo を載せる init が、 host の面の全口座の設定 dir にその anchor の印を先に置く。 決め手は分析 (書く相手が広がる)。
      （平易）repo を載せる口 (init) の段で、 host に在る全部の口座の設定 file にその repo の印を先に置く案です。 起動の口を変えずに済み、 どの口座へ移っても問いが出ない点で勝ります。 けれども、 信じていない folder を信じた印を全部の口座に撒くことになり、 書く相手を起こす 1 組に閉じたいという、 この判断のものさし (DR4) に反します。 init が起こさない席 (後から足した口座・後から入れた群) には効かず、 穴が残ります。 決め手は分析です。
      利点: 起動の 1 本を変えずに済み、 どの口座へ移っても dialog が出ない
      欠点: 信じていない folder を信じた印を全部の口座に置く。 書く相手は起こす 1 組に閉じる (DR4)
      欠点: init が起こさない席 (後から足した口座・後から入れた群) には効かず、 穴が残る (DR1)
    verdict: rejected
    reason: "決め手は分析 (書く相手が広がる)。"
  - id: "OPT6"
    name: "trust を起動の前提にして、 dialog が出うる周を断る"
    text: |
      印が無い口座 × anchor では席を起こさず Refused にし、 人に承認を求める。 決め手は分析 (人の手が要る周を器が増やす)。
      （平易）印が無い口座 × anchor では席を起こさず断り、 人に承認を求める案です。 器が Claude Code の file を書かずに済み、 前の決定の線が動かない点で勝ります。 けれども、 群の移動と init の周に人の手が要る形を器が増やし、 穴を塞がず名指すだけになります。 断りの種類が増え、 移動の周は候補が在るのに移りません。 決め手は分析です。
      利点: 器が Claude Code の file を書かずに済み、 fence は動かない
      欠点: 群の移動と init の周に人の手が要る形を器が増やす。 穴を塞がず名指すだけになる (DR1)
      欠点: 起動の断りの列に「trust が無い」が増え、 移動の周は候補が在るのに移らない (DR1・DR5)
    verdict: rejected
    reason: "決め手は分析 (人の手が要る周を器が増やす)。"
  - id: "OPT7"
    name: "設定 dir の .claude.json の内容を host の面の宣言に写す"
    text: |
      trust の印（信じた印の 1 key）を host の manifest の宣言として持ち、 器はそれを読んで起動の可否や書きを決める。 決め手は分析 (私有形式の二重化)。
      （平易）口座の設定 file の中身 (印) を host の宣言 file に写し、 器はそれを読んで起動の可否や書きを決める案です。 器が読むのは自分の面だけになり、 Claude Code の file の形に依らない点で勝ります。 けれども、 Claude Code の私有の状態を器の面に二重に持つことになり、 どちらが正かが割れます。 人が宣言 file に書く行が増え、 問いを消すには結局 .claude.json に印が要ります。 決め手は分析です。
      利点: 器が読むのは自分の面だけになり、 Claude Code の file の形に依らない
      欠点: Claude Code の私有形式の状態を器の面に二重に持ち、 どちらが正かが割れる (DR3)
      欠点: 人が面に書く行が増え、 dialog を消すには結局 .claude.json に印が要る (DR1)
    verdict: rejected
    reason: "決め手は分析 (私有形式の二重化)。"
basis: [FR1038, FR1040, FR1059, NFR1003, ADR-1017, ADR-1026, ADR-1045, ADR-1049, ADR-1055, ADR-1062, ADR-1063]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「席」は人と AI が話す 1 つの session、 「口座」は席が使う Claude Code の login 単位、 「anchor」は対象 repo の本体の場所、 「信じた印」(trust の印) は口座ごとの設定 file (.claude.json) に置かれる「この folder を信じる」と答えた記録です。 Claude Code は、 その口座で一度も信じると答えていない folder で起動すると、 起動直後に「信じるか」の問い (trust dialog・既定は No, exit) を出し、 答えるまで席は立ちません。 席が別の口座へ移るとき (群の移動) や、 新しい repo を載せて初めて席を起こすとき (init) は、 ここで人の手を待ちます。 2026-09-25 の本番の移動でも、 持ち主が手で承認するまで席は立ちませんでした。 この記録は、 席を立てる口 (seat launch) が、 席の登録を書いた後・起動行を差し込む (か自分の process を置き換える) 前に、 選んだ口座の設定 file の該当の印を「信じる」に置いてから起動行を送ると決めます。 新しい部品 (依存) は足さず、 器がすでに持つ入れ子 JSON の読み手に「印を置く」と「書き戻す」の 2 つの関数を足します。 書くのはその 1 key だけで、 他の key と並びと値は保ち、 一時 file に書いて読み直してから置き換えます。 結果は 5 つの言葉 (置いた・作って置いた・すでに信じていた・読めなかった・書けなかった) のどれかで起動の記録と起動の 1 行の末尾に残し、 印を置けなくても席は立てます。 書く相手は「今起こす口座 × 今の anchor」の 1 組だけで、 credential と settings の file は触りません。 前の決定 (ADR-1026) の「login そのものと trust の受け入れは user が行い、 器は credential に触りません」のうち trust の受け入れを、 この 1 key に限って置き換えます (credential には触らないままです)。 要件書では、 席の起動 (FR1059) の内側にこの 1 手を足し、 群の移動 (FR1038) が人の手を待たない根拠になり、 依存 0 本 (NFR1003) を保ちます。 この記録は、 受け入れられるまで何も拘束しない発効前 (proposed) の記録です。
consequences:
  - "この判断で良くなること 4 つと、 代わりに引き受けること 6 つです。 良くなるのは、 群の移動と init が起こす席で持ち主が問いを承認する 1 手が消えること、 部品を足さず読み手に 2 つの関数を足すだけで依存 0 本が変わらないこと、 書くのは 1 key だけで他の key と並びと値は保ち途中で壊れた file を作らないこと、 結果が決まった言葉で起動の記録と起動の 1 行と見回りの記録に残り、 印を置けなくても席が立ち、 確認は点検の既存の行で足りることです。 引き受けるのは、 Claude Code の私有の file に器が 1 key を書くこと (前の決定の線をこの 1 key に限って置き換える)、 席の起動が file の読み書きを 1 回持ち、 起動の記録と起動の 1 行と見回りの記録に項目が 1 つずつ増えること、 印の key 名や置き場は Claude Code 側の約束で、 変われば問いがまた出ること、 器は「信じる」にしか置かず、 戻すのは人の手であること、 書式が読み手の形に揃うので Claude Code の書式と違えば空白や escape の書き方が変わること、 同じ file を使う Claude Code と鍵を共有せず印が消える周がありうること (点検が名指して次の起動が置き直す) です。"
  - "良い結果: 群の移動と init が起こす席で、 持ち主が起動の trust dialog を承認する 1 手が消える。 移動の復帰は機械の注入だけで進む (ADR-1049 §2・ADR-1055 の形が閉じる)"
  - "良い結果: crate を足さず、 既存の読み手に「置く」と「書き戻す」の 2 関数を足すだけ。 NFR1003 (実行時の直接依存 0 本) は不変で、 同じ file を 2 つの読み手で読む形を作らない"
  - "良い結果: 書くのは 1 key だけで、 key・並び・値・数の字面を保ち (書式は render の 2 空白の形で、 Claude Code の書式と同じである限り byte で同じ)、 一時 file → 読み直し → rename で部分書きを作らない。 既に true の周は 1 byte も書かない。 credential と settings は触らない"
  - "良い結果: 結果は閉じた言葉 (written / created / accepted / unreadable / unwritable) で起動の記録の行と起動の 1 行の末尾と tick の記録の行に残り、 印を置けない周も席は立つ。 doctor の trust= の行が書いた後の周を accepted と読むので、 確認は既存の口で足りる"
  - "代償: Claude Code の私有形式の file (.claude.json) に器が 1 key を書く。 ADR-1026 §2.2 / §2.5 の trust の受け入れと代筆の射程外を、 この 1 key に限って supersede する (.credentials.json と settings.json は ADR-1017 §2.3 の fence のまま)"
  - "代償: 席の起動が file の読み・一時 file の書き・rename を 1 回持ち、 起動の記録の what の末尾と起動の 1 行の末尾に trust=<語> が 1 項目ずつ増える (外形 snapshot が動く)。 tick の記録の行にも 1 項目増える"
  - "代償: 印の key 名と置き場は Claude Code の側の約束で、 変われば器は unreadable か written のまま dialog が出る。 その周は doctor の trust= と起動の行の語で分かるが、 器は直せない"
  - "代償: 器は印を true にしか置かず、 false に戻す口は持たない (撤回は人の手)。 trust は user が folder を信じる宣言だが、 器が起こす席については器が代わりに置く (書く相手は今起こす 1 組に閉じる)"
  - "代償: 書き戻しの書式は読み手の render の形 (2 空白の入れ子・末尾の改行は元に在れば保つ) に揃う。 key・並び・値・数の字面は保つが、 元の file の空白や escape の書き方が render と違う周はそこが変わる。 歯の fixture は実物の .claude.json の書式で作る"
  - "代償: 同じ設定 dir を使って走る Claude Code と lock を共有しない。 読み → 一時 file → rename の間に Claude Code が同じ file を書いた周はどちらかが負け、 印が消えた周は doctor の trust=missing が名指して次の起動が置き直す (器の書きは読んだ木 + 印 1 つで、 他の key を消す方向には負けない)"
