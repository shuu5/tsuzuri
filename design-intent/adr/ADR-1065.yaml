# 判断の記録 ADR-1065 — 器 scribe2 の判断の記録 ADR-0065 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1065
title: "口座 × anchor の trust の印は席の起動が置く — seat launch の 1 本が prepare の後・置き換えと boot の分岐の前に、 選んだ口座の設定 dir の .claude.json に、 その anchor の trust の印を true で置いてから起動行を注入する。 依存は足さず既存の入れ子 JSON の読み手に書き手を足し、 言葉は閉じた列 written / created / accepted / unreadable / unwritable、 起動は止めない (ADR-1026 §2.2 / §2.5 の trust の受け入れと代筆の射程外を trust の印 1 key に限って部分 supersede・credential の fence は不変)"
status: proposed
date: 2026-09-25
context: |
  席が別の口座へ移るとき、 その口座がその repo (anchor) を一度も「信じる」と答えていないと、 Claude Code は起動直後に trust の dialog (既定は No, exit) を出して席が立たない。 群の自動の移動 (ADR-1049 §2・ADR-1055) と init が起こす席 (ADR-1063) はここで人の手を待つ (2026-09-25 の本番の移動でも持ち主が手で承認した)。 本 ADR は、 席の起動の 1 本 (seat launch) が登録 row を書いた後・自分の process の置き換えと起動行の注入の分岐の前に、 選んだ口座の設定 dir の .claude.json の該当の印 (projects の下の <anchor> の hasTrustDialogAccepted) を true に置くと決める。 依存は足さず (NFR1003)、 既存の入れ子 JSON の読み手に「path に真偽を置く 1 関数」と「一時 file → 読み直し → rename の書き戻し」を足す。 結果は閉じた言葉 (written / created / accepted / unreadable / unwritable) で起動の 1 行の末尾に添え、 印を置けない周も起動は止めない。 書く相手は「今起こす口座 × 今の anchor」の 1 組に閉じ、 .credentials.json と settings.json は触らない。
  なぜこの判断が要るのかを、 2 度の決定と、 実際に起きたことと、 器の今の部品と、 これまでの決まりから説明します。 群の移動の実地試験で、 移り先の口座がその repo を一度も信じると答えていないと、 起動直後の問い (trust dialog) で席が立たない穴が見つかりました。 1 回目の決定 (2026-09-24 13:38 UTC) は JSON を扱う部品を足して器が印を書く案を受け入れましたが、 器にはすでに入れ子 JSON の読み手が在り、 部品を足す案は「依存 0 本」の要件を書き換える必要があったので、 前提が誤りでした。 2 回目の決定 (同じ日の 22:56 UTC) は、 部品を足さず、 その読み手に書き手を足す形を受け入れ、 前の決定を取り下げました。 その後の 2026-09-25 の本番の移動では、 移り先の席が問いで止まり、 持ち主が手で承認するまで立ちませんでした。 器の部品は、 JSON を木として読んで戻す読み手と、 点検 (doctor) がその木から印を読む口までは在りますが、 木の path に真偽を置く関数と、 置いた木を同じ file へ書き戻す関数の 2 つが在りません。 席を立てる口は、 口座を選び、 起動行を組み、 登録を書いた後、 呼び手の窓が席の窓と同じなら自分の process を起動行に置き換え、 違えば窓へ差し込みます。 呼ぶ場所は 3 つ (人が打つ形・群の移動・見回りの移動) で、 席の立て直しの経路は前の決定 (ADR-1045) で消えているので、 席の起こし直しは全部この口を通ります。 決まりの側では、 依存 0 本・足す前に外す物を名指す・描画を判定に使わない・環境変数を読まない、 が効き、 前の決定は「器は credential の file に書かず、 trust は user が答える」としていました。 書く相手は席を起こすその 1 組に閉じ、 credential と settings と点検は触りません。
  CTX1 経緯 — 2 度の裁定と、 取り下げた前提
  群の移動（口座の乗り換え）の実地試験 (memo s2-07l.604) で、 移り先の口座がその anchor（repo の本体の場所） を一度も trust していないと起動の trust dialog（folder を信じる問い） (既定は No, exit) で席が立たない穴 (a) が見つかった。 2026-09-24T13:38Z の裁定は「serde_json を依存に足して器が印を書く」推奨を受諾したが、 器には既に入れ子 JSON の読み手 (doctor（点検の 1 コマンド） の trust= の行が使う) が在り、 依存を足す案は SRS NFR1003 (実行時の直接依存 0 本) の改稿を要するので、 推奨の前提が誤りだった。 2026-09-24T22:56Z の裁定は「依存を足さず、 既存の読み手に書き手を足す形で器が塞ぐ」推奨を受諾し、 前の裁定を取り下げた。 要旨だけを写し、 逐語は非公開の作業記録簿 (台帳 s2-07l.609) に在る。
  CTX2 実測 — 2026-09-25 の本番の移動で、 持ち主が手で trust を承認した
  2026-09-25 の群の自動の移動 (台帳 s2-07l.617) では、 tick が移り先の口座で席を起こしたが、 その口座はその anchor を trust しておらず、 起動の dialog で止まった (tick の記録は launched=launch-unconfirmed)。 席が立ったのは持ち主が手で承認した後である。 群の移動 (ADR-1049 §2・ADR-1055) は「新しい口座で新しい席を起こし、 復帰は機械の注入に任せる」と決めたが、 この 1 手だけが人の手に残っている。 init (ADR-1063) が起こす初回の席も同じ穴を持つ。
  CTX3 現物 — 読み手は在るが、 置く関数と書き戻す関数が無い
  base 80270bd で、 入れ子 JSON の読み手 (parse / Tree / render) は RFC 8259 の 6 形を読み、 数は 10 進の字面のまま持ち、 重複 key を拒み、 木を JSON に戻せる。 doctor の trust= の行 (accepted / missing / unreadable) は、 この読み手で口座の設定 dir（口座ごとの設定の置き場） の .claude.json の projects の下の <anchor> の hasTrustDialogAccepted を読む (読むだけ)。 無いのは、 木の path に真偽を置く 1 関数と、 置いた木を同じ file へ書き戻す 1 関数の 2 つ。 席の起動（席を立てる口）の 1 本 (launch) は model → 役割の既定 → 口座の選定 → 起動行の導出 → prepare が登録 row を書く、 まで進んだ後で 2 つに分かれる。 呼び手の pane が target と同じ周 (置き換え・約束 7) は boot を通らず、 自分の process を起動行へ exec で置き換えて返らない (stdout の 1 行も Launched も無く、 記録は record_launch が exec の前に inject.jsonl へ 1 行書く)。 それ以外の周は boot が注入し、 結果は Launched (Done / None / Refused / Failed)。 呼び手は 3 つ (seat の長い形と短い形・群の移動の周に席を起こす経路・tick の移動の周)。 席の立て直しの経路は ADR-1045 §2 (2) で消えており (relaunch.rs が持つのは boot と初回の選定だけ)、 席の起こし直しは全部この 1 本を通る。 口座の設定 dir は state dir の accounts の下の label の dir (実 dir か symlink) で、 ADR-1017 §2.3 の経路で解く。
  CTX4 射程 — 書くのは起動の 1 本だけ、 credential と settings と doctor は触らない
  書くのは席の起動の 1 本だけで、 init と account add は書かない (書く相手を「今起こす口座 × 今の anchor」の 1 組に閉じる)。 doctor の trust= の行は読むだけのまま (書いた後の周は accepted と読める＝それが確認)。 .credentials.json と settings.json は書かない (ADR-1017 の fence のまま)。 pane の字面で dialog に答える形は持たない (C3.3)。 Tree の形と parse の判定・prepare と登録 row・Launched の他の variant は変えない。 README の「新しい repo を器に載せる」の trust の 1 文は後続の docs で書く。
  CTX5 憲法と既存の決定の向き (本 ADR の解釈)
  NFR1003 は実行時の直接依存 0 本 (std だけで build) を求め、 C17.2 は仕組みを足す前に何を外すかを名指させる。 C3.3 は端末の描画や自由文を判定入力にしない。 C2.2 は env を読まず、 口座の設定 dir は state dir から解く (ADR-1017 §2.3・ADR-1026 §2.1)。 A1 は消す・出す・使うの 3 クラスを user に聞く。 本 ADR の読みでは、 .claude.json の 1 key の設置は 3 クラスに当たらない (消さず・repo の外に出さず・新しい資源を使わない)。 口座を使うこと自体は群の宣言の常設の承認 1 回で以後は都度聞かない (ADR-1049 §2)。 N1 は人の手で置いた物を壊さない。 ADR-1017 §2.3 は器が credential を読まず・書かず・代筆しないと決め (§2.5 は再 login を user の手番とするが、 .claude.json と trust には触れていない)、 ADR-1026 §2.2 は「login そのものと trust の受け入れは user が行い、 器は credential に触りません」と決め、 ADR-1026 §2.5 は login と trust の代筆を射程外 (account-autonomy.md §10 で却下済み) とした。 設計 §10 の当時の却下の理由は、 Claude Code の私有形式への書込 (ADR-1017 §2.5 と同じ fence と類推・credential と同じ dir) と、 trust は user が folder を信じる宣言＝器が代筆すると信じていない folder を信じたことになる、 の 2 つ。 ADR-1063 は trust を器が埋めるかを別の裁定と後続の ADR に送った。 ADR-1045 §2 (2) は席の立て直しを消し、 orchestrator の再起動は user が seat launch を撃つと決めた。 ADR-1049 §2 と ADR-1055 は群の移動を「新しい口座で新しい席を起こす」と決め、 ADR-1063 は init の 7 手を 3 語に閉じた。
  （選択肢を測るものさし）この判断を評価する 5 本のものさしです。 群の移動と init が起こす席が人の手を待たないこと。 部品 (依存) を足さず、 すでに在る読み手に書き手を足すだけにすること。 Claude Code の file の他の key と並びと値を保ち、 書くのは 1 key だけにし、 credential と settings は触らないこと。 書く相手を「今起こす口座 × 今の anchor」の 1 組に閉じ、 信じていない folder を信じた印を撒かないこと。 起動を止めず、 結果は決まった言葉で残し、 画面の描画は読まないことです。
  DR1｜群の移動と init が起こす席が人の手を待たない — trust の穴を器が塞ぎ、 移動の周に持ち主が dialog を承認する 1 手を消す CTX1 (裁定)・CTX2 (本番の移動の実測)
  DR2｜依存を足さない — 読み手は既に在る。 書き手を足すだけで、 crate を足さず NFR1003 を改稿しない CTX1 (取り下げた前提)・CTX3・CTX5 (NFR1003・C17.2)
  DR3｜Claude Code の file の他の内容を保つ — 書くのは 1 key だけで、 key・並び・値・数の字面を保つ (書式は読み手の render の形＝2 空白の入れ子で、 末尾の改行は元の file に在れば保つ)。 credential と settings は触らない CTX3 (読み手の性質)・CTX5 (ADR-1017 の fence・N1)
  DR4｜書く相手を「今起こす口座 × 今の anchor」の 1 組に閉じる — 信じていない folder を信じた印を撒かない CTX4・CTX5 (却下の理由 2 つ目・A1)
  DR5｜起動を止めず、 結果は閉じた言葉で残す — 描画を読まず (C3.3)、 印を置けない周も席は立て、 doctor が名指す CTX4・CTX5 (C3.3)
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 席を立てる口 (seat launch) は、 席の登録を書いた後・置き換えか差し込みかの分かれ目の前に 1 回だけ、 選んだ口座の設定 file (.claude.json) の該当の印 (projects の下のその anchor の hasTrustDialogAccepted) を「信じる」(true) に置きます。 書き方は、 同じ読み手で読み、 木の path に真偽を置き (途中の入れ物が無ければ作り、 隣の key と並びと値と数の書き方は変えず、 書式は読み手の形で、 末尾の改行は元に在れば保ち)、 同じ dir の一時 file に書き、 読み直して印が入っていることを確かめ、 置き換えます。 file が無ければ最小の file を作り、 すでに信じていれば 1 byte も書きません。 結果は 5 つの言葉 (置いた・作って置いた・すでに信じていた・読めなかった・書けなかった) のどれかで、 どの言葉でも起動行は送り、 言葉は起動の記録に残し (置き換えの周も差し込みの周も)、 差し込みの周はさらに結果の値と起動の 1 行の末尾に添えます。 群の移動はこの言葉を判定に使わず、 見回りの移動は記録に写すだけです。 同じ設定 file を使う Claude Code とは鍵 (lock) を共有せず、 印が消えた周は点検が名指して次の起動が置き直します。 依存は足さず、 書くのは今起こす 1 組だけで、 init と口座の登録 (account add) は書かず、 点検は読むだけ、 credential と settings は触らず、 画面の問いには答えません。 要件書では、 席の起動 (FR1059) の内側にこの 1 手を足して判定と断りは変えず、 群の移動 (FR1038) が人の手を待たない根拠になり、 依存 0 本 (NFR1003) は変えません。
  採用 — OPT1
  席の起動の 1 本 (seat launch の launch) SHALL prepare が通った後・置き換え (replace_with・約束 7) と boot の分岐の前に 1 回だけ、 選んだ口座の設定 dir の .claude.json について projects の下の <anchor の絶対 path> の hasTrustDialogAccepted を true に置く (置き換えの周も注入の周も同じ 1 回を通る)。 呼び手 3 つ (seat の長い形と短い形・群の移動の周に席を起こす経路・tick の移動の周) SHALL 変えない。 席の起こし直しは全部この 1 本を通る (立て直しの経路は ADR-1045 §2 (2) で消えている)。 書き方 SHALL 同じ読み手で読み → 木の path に真偽を置き (途中の object が無ければ作る・兄弟の key と並びと値と数の字面は変えない・書式は読み手の render の形＝2 空白の入れ子で、 末尾の改行は元の file に在れば保つ) → render の本文を同じ dir の一時 file に書き → 一時 file を同じ読み手で読み直して印が true であることを確かめ → rename で置き換える、 の順とし、 file が無い周 SHALL projects だけを持つ最小の木を同じ手で作り、 既に true の周 SHALL NOT 1 byte も書かない (mtime も動かない)。 言葉 SHALL 閉じた列 written (置いた) / created (file を作って置いた) / accepted (既に true・書かない) / unreadable (file は在るが JSON でない・途中が object でない・末端が真偽でない＝書かない) / unwritable (一時 file の書き・読み直しの不一致・rename のどれかが失敗＝置き換えない) とする。 どの言葉でも起動行 SHALL 送り、 Refused に SHALL NOT しない (trust は起動の前提でなく穴埋め)。 言葉 SHALL 起動の記録 (record_launch が inject.jsonl に書く行の what) の末尾に trust=<語> として、 置き換えの周も注入の周も残す。 注入の周 SHALL さらに Launched::Done の 3 つ目の値として返し、 seat launch の stdout の 1 行の末尾に trust=<語> を添え、 tick は launched= の後ろに trust=<語> を足す。 群の移動の周の起こしと tick の移動 SHALL NOT 言葉を判定に使わない。 器 SHALL NOT 同じ設定 dir を使って走る Claude Code と lock を共有しない。 印が消えた周 SHALL doctor の trust=missing が名指し、 次の起動が置き直す。 器 SHALL NOT 依存を足さない (NFR1003 は不変)。 書く相手 SHALL 今起こす口座 × 今の anchor の 1 組に閉じ、 init と account add SHALL NOT 書かない。 doctor の trust= の行 SHALL 読むだけのままとする。 .credentials.json と settings.json SHALL NOT 書かない (ADR-1017 §2.3 の fence のまま)。 Tree の形と parse の判定・prepare と登録 row・Launched の他の variant SHALL 変えない。 器 SHALL NOT pane の字面で dialog に答えない (C3.3)。
  （平易）席を立てる口 (seat launch) は、 席の登録を書いた後・置き換えか差し込みかの分かれ目の前に 1 回だけ (置き換えの周も差し込みの周も同じ 1 回を通ります)、 選んだ口座の設定 file (.claude.json) の該当の印 (projects の下の、 その repo の場所の hasTrustDialogAccepted) を「信じる」(true) に置きます。 呼ぶ場所 3 つ (人が打つ長い形と短い形・群の移動・見回りの移動) は変えません。 席の立て直しの経路は前の決定 (ADR-1045) で消えているので、 席の起こし直しは全部この口を通ります。 書き方は、 同じ読み手で読み、 木の path に真偽を置き (途中の入れ物が無ければ作り、 隣の key と並びと値と数の書き方は変えず、 書式は読み手の形＝2 空白の入れ子で、 末尾の改行は元の file に在れば保ち)、 同じ dir の一時 file に書き、 一時 file を読み直して印が入っていることを確かめ、 置き換える、 の順です。 file が無ければ projects だけを持つ最小の file を同じ手で作り、 すでに「信じる」なら 1 byte も書きません (更新時刻も動きません)。 結果の言葉は 5 つに決めます。 置いた (written)・file を作って置いた (created)・すでに信じていた (accepted)・読めなかった (unreadable・file は在るが JSON でない、 途中が入れ物でない、 末端が真偽でない＝書かない)・書けなかった (unwritable・一時 file の書き、 読み直しの不一致、 置き換えのどれかが失敗＝置き換えない) です。 どの言葉でも起動行は送り、 断りにはしません (印は起動の前提でなく穴埋めです)。 言葉は起動の記録 (差し込みの記録の行の what の末尾) に trust= の形で、 置き換えの周も差し込みの周も残します。 差し込みの周はさらに「立った」の結果の 3 つ目の値として返し、 起動の 1 行の末尾に添え、 見回りの移動は記録の行にも写しますが、 群の移動と見回りの移動はこの言葉を判定に使いません。 同じ設定 dir を使って走る Claude Code とは鍵 (lock) を共有しません。 印が消えた周は点検の trust=missing が名指し、 次の起動が置き直します。 部品 (依存) は足しません。 書く相手は今起こす口座 × 今の repo の 1 組だけで、 init と口座の登録 (account add) は書きません。 点検 (doctor) の trust の行は読むだけのままです。 credential の file と settings の file は書きません。 読み手の木の形と読みの判定・登録の書き・「立った」以外の結果は変えません。 画面の問いには答えません。
  （理由）user の決定は、 移り先の口座が repo を信じていない穴を、 部品を足さずに、 すでに在る入れ子 JSON の読み手に書き手を足す形で器が塞ぐ、 という推奨の受諾でした。 一度は部品を足す推奨が受け入れられましたが、 読み手はすでに在り、 部品を足すと「依存 0 本」の要件を書き換える必要があったので、 前提が誤りとして取り下げられました。 本番の移動で、 席が問いで止まり持ち主が手で承認するまで立たなかった実測が、 穴が本物であることを示しています。 印を置く場所を席を立てる口の内側 (登録の後・置き換えか差し込みかの分かれ目の前) の 1 か所にしたのは、 置き換えの周も差し込みの周もその 1 回を通り、 群の移動も見回りの移動も init が起こす席も同じ 1 本を通り、 席の立て直しの経路は前の決定 (ADR-1045) で消えているので、 呼ぶ場所を変えずに席が起こされる全部の周で印が置かれるからです。 書くのを 1 key だけにし、 一時 file に書いて読み直してから置き換えるのは、 Claude Code の file の他の key と並びと値を保ち、 途中で壊れた file を残さないためで、 丸ごと書く案を退けた理由です。 画面を読んで答える案を退けたのは、 描画を判定に使わない決まり (C3.3) のためです。 全部の口座に先に置く案を退けたのは、 信じていない folder を信じた印を撒かず、 書く相手を今起こす 1 組に閉じるためです。 起動を断る案を退けたのは、 人の手が要る周を器が増やさないためで、 だから印を置けなくても起動行は送り、 結果は決まった言葉で残して点検が名指します。 宣言 file に写す案を退けたのは、 Claude Code の私有の状態を二重に持たないためです。 前の決定 (ADR-1026) の「trust の受け入れは user が行う」をこの 1 key に限って置き換えるのは、 器が起こす席の前提は器が置くべきで、 credential に触らないという線 (ADR-1017) は保てるからです。 同じ file を使う Claude Code と鍵を共有しないことは代償として引き受け、 印が消えた周は点検が名指して次の起動が置き直します。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1059（claim）: FR1059 は席の起動が役割を受け、 口座を決め、 起動行を導出し、 登録を起動の前に書き、 target の窓へ差し込み、 断る周は typed に断り key を 1 つも送らないことを求める。 本 ADR は「登録を書いた後・置き換えと差し込みの分岐の前」に trust の印を置く 1 手をこの 1 本の内側に足し、 起動の判定と断りの列は変えない。 印を置けない周も起動行を送るのは、 FR1059 の「席の起動」が席を立てる口であって trust の有無を言う口でないという読みによる。
  FR1038（rationale）: FR1038 は群の移動を「移り先を 1 回だけ決め、 群の今の口座の記録を書き、 古い席へ退避の合図を送って新しい口座で席を起こし直す」形で求める。 移り先の口座が anchor を trust していない周は、 起こした席が dialog で止まり、 移動が人の手を待つ (CTX2)。 本 ADR は起動の 1 本の内側で印を置くので、 移動の周に席を起こす経路を変えずに、 この 1 手が消える。
  NFR1003（rationale）: NFR1003 は実行時の直接依存 0 本 (std だけで build) を求める。 本 ADR は JSON の crate を足さず、 既存の読み手に「置く」と「書き戻す」の 2 関数を足す形を選び、 依存を足す案 (OPT2) を退けた。 NFR1003 の文面は変えない。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録は前の決定 1 つ (ADR-1026) を、 信じた印の 1 key に限って部分的に置き換えます。 ADR-1026 の「login そのものと trust の受け入れは user が行い、 器は credential に触りません」のうち trust の受け入れを、 器が起こす席の起動の 1 本に限って器が置く形に読み替え、 同じ記録が範囲の外とした「trust の代筆」も同じ範囲で決めます。 login は user の手番のまま、 credential の file には触らない (ADR-1017 の線) ままです。 設計 doc の側でも、 前に「器は印を書かない」と退けた記述を、 この記録で置き換え済みと記します。 群の移動の形 (ADR-1049・ADR-1055) と、 repo を載せる口 (ADR-1063) は変えません。 この記録は発効前 (proposed) で、 系譜の上では現行 (current) ですが、 受け入れられるまで何も拘束しません。 原則は「器が起こす席の前提は器が置く。 置くのは今起こす 1 組の 1 key だけで、 他の key と値は保つ。」です。
