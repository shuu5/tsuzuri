  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  憲法のうち機械が既に守らせている条（C 条文）は、CI と編集時の guard だけで持ち、agent の context には毎回載せません。生成した規範文は CLAUDE.md から専用の生成 file 1 枚へ移し、CLAUDE.md にはその file を指す 1 行だけを残します。人間と話す席（orchestrator）の起動時には、憲法の順位と「先に聞く」「拒む」の条（A1 / A2 / A3 / A4.2 / N1 / N2 / N3）だけを、出所付きの短い行で注入します。実装役（runner）には憲法の文章を 1 行も注入しません。この決め方は scribe2 自身の repo だけのもので、他の project に生成した憲法をどう守らせるかは、scribe2 の整理が終わってから別に決めます。
consequences:
  - "この判断で良くなることと、代わりに引き受けることです。CLAUDE.md が 4 分の 1 の長さになり、注入は振る舞いを変える 6〜7 行だけになり、生成物と drift 検査と C1.2 / C14 はそのまま保たれ、新しい仕組みは足しません。代わりに、登録の無い session には pointer しか載らないこと、pointer 行が条文の要約であること、審査役の読み先を生成 file へ変えること、他 project の憲法の執行を先送りにすることを引き受けます。"
  - "良い結果: CLAUDE.md は 189 行 → 約 73 行・orchestrator の起動 1 回に載る憲法は約 117 行 → 6〜7 行 (公式の「短く・高信号」に沿う・compact のたびに戻る)"
  - "良い結果: C1.2 / C14 / C14.2 はそのまま満たす: 文書 (constitution.html) が原則の正本・生成 file は同じ生成器の生成物・drift 検査 `claude-md-constitution` は書き先の定数の差し替えだけで生き残る"
  - "良い結果: C 条文の執行の所在が明文になる (CTX3 の対応・母集団 16 条で対応の無い条 0)・注入と執行の二重化が消える"
  - "良い結果: 新しい生成器・rules 行・走査・record は 0 (C17 の段 2)・runner の SessionStart は 0 byte のまま"
  - "代償: 席の登録が無い session (ad-hoc・素の session) には憲法が pointer 1 行でしか載らない。 読むかは session 次第 (執行は CI と guard が持つので、 読まなくても止まる側は変わらない)"
  - "代償: 雛形の pointer 行は条文の要約で逐語ではない。 要約のずれは seat-brief の measure では測れず、 lens と人の目で見る (逐語は生成 file にあり、 pointer が指す)"
  - "代償: lens の観点 `constitution` の読み先を生成 file へ変える便が要る (雛形 `headless/lens.txt` の 1 行)。 変え忘れると lens は憲法を読まずに `constitution` の観点を 0 件と書く (0 件と未測の弁別は lens の INCONCLUSIVE の形に頼る)"
  - "代償: 他 project へ生成した憲法の執行の形は決めない (先送り)。 その project で憲法が「注入も執行も無い」状態になりうることを、 scribe2 の整理が終わるまで受け入れる"
