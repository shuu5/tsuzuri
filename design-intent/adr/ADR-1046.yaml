  - id: "OPT3"
    name: "憲法の散文を一切注入しない (rules manifest + hook だけ)"
    text: |
      C14 の 2 面にいちばん忠実。 だが A1 の「出す」「使う」と A2 / A3 / A4.2 の「先に聞く」、 N1〜N3 の「拒む」は機械の面をほとんど持たない (CTX4)。 注入しない orchestrator は聞かずに消す・出す・使う = user がいま直そうとしている失敗を再現する。 runner は 3 クラスの操作をしないので、 runner にはこの形が正解。
      （平易）憲法の文章を context にまったく入れず、機械の門だけに任せる案です。いちばん筋は通りますが、「先に聞く」「拒む」の条は機械では止められないものが多く、人間と話す席がそれを知らないと、聞かずに消したり公開したりします。実装役はそういう操作をしないので、実装役にだけはこの形を採ります。
      利点: C14 / N2 に最も忠実・注入量 0
      欠点: A / N 条の「聞く・拒む」に機械の面が無い (CTX4)・人間と話す席には不適
    verdict: rejected
    reason: "C14 の 2 面にいちばん忠実。 だが A1 の「出す」「使う」と A2 / A3 / A4.2 の「先に聞く」、 N1〜N3 の「拒む」は機械の面をほとんど持たない (CTX4)。 注入しない orchestrator は聞かずに消す・出す・使う = user がいま直そうとしている失敗を再現する。 runner は 3 クラスの操作をしないので、 runner にはこの形が正解。"
  - id: "OPT4"
    name: "注入する条の id を rules 行で選び、 生成器が抜粋 (2 枚目の生成 file) を作って雛形へ埋め込む"
    text: |
      雛形の pointer 行が「要約」であることを嫌い、 条文の逐語を constitution.html から抜粋して埋め込む案。 rules 行 (List・裁定 id 付き) が id を選び、 gen-claude-md が 2 枚目の生成 file を書き、 drift 検査をもう 1 面足す。 だが席の指示文は既に「穴か pointer 行」の規律を持ち (ADR-1022 §2.4)、 planner の雛形は A1 を pointer 行で運んでいる。 生成器の 2 枚目・rules 行・drift の面を足すのは、 決定はしごの段 2 (既に在るか) で止まる (ADR-1044)。
      （平易）注入する条を規則の行で選び、条文そのものを憲法から切り出して席の起動文に埋める案です。正確ではありますが、席の起動文は「出所付きの短い行」という決まりを既に持っていて、いまも A1 をその形で運んでいます。新しい生成物と規則の行とずれ検査を足すことになり、「既に在るか」の段で止まります。
      利点: 注入する文が条文の逐語になり、 要約のずれが無い・選ぶ条が manifest から辿れる
      欠点: 生成 file・rules 行・drift 検査を 1 面ずつ足す (DR4)・英語の SHALL 文が指示文に混ざる・雛形の規律 (pointer 行) が既に同じ役を果たしている
    verdict: rejected
    reason: "雛形の pointer 行が「要約」であることを嫌い、 条文の逐語を constitution.html から抜粋して埋め込む案。 rules 行 (List・裁定 id 付き) が id を選び、 gen-claude-md が 2 枚目の生成 file を書き、 drift 検査をもう 1 面足す。 だが席の指示文は既に「穴か pointer 行」の規律を持ち (ADR-1022 §2.4)、 planner の雛形は A1 を pointer 行で運んでいる。 生成器の 2 枚目・rules 行・drift の面を足すのは、 決定はしごの段 2 (既に在るか) で止まる (ADR-1044)。"
  - id: "OPT5"
    name: "全文を CLAUDE.md でなく SessionStart で注入する"
    text: |
      「hook で注入すれば強い」という直観に基づく案。 だが SessionStart の出力も system prompt ではなく会話先頭の system-reminder で、 置き場所による遵守率の差は文書化されていない (CTX2)。 長さは 117 行のまま、 席ごとの絞りも効かない。 得るものが無い。
      （平易）全文をそのまま、置き場所だけ CLAUDE.md から起動時の hook に変える案です。hook のほうが強く効きそうに見えますが、公式 docs にそういう根拠はなく、長さの問題はそのまま残ります。
      利点: compact のたびに全文が戻る
      欠点: 長さの問題が不変 (DR3)・「hook だから強い」の根拠が無い・plugin の hooks.json から system prompt 層へ書く正規経路も無い
    verdict: rejected
    reason: "「hook で注入すれば強い」という直観に基づく案。 だが SessionStart の出力も system prompt ではなく会話先頭の system-reminder で、 置き場所による遵守率の差は文書化されていない (CTX2)。 長さは 117 行のまま、 席ごとの絞りも効かない。 得るものが無い。"
