  器の案の章の要約: 候補を 5 つ並べます。生成区間を専用 file へ移して orchestrator には順位と Ask-first / Never の条だけを pointer 行で注入する案、CLAUDE.md に全文を置いたままにする現行の案、憲法の文章を一切注入しない案、注入する条を規則の行で選んで生成器がもう 1 枚の抜粋を作る案、そして全文を CLAUDE.md でなく SessionStart で注入する案です。
  器の専門語の説明: 本文に出てくる専門語を、やさしい言葉で説明します。
  ・生成区間（generated region）: `cargo xtask gen-claude-md` が書き、 印 (`constitution:begin` / `constitution:end`) で囲まれた区間。 中身は constitution.html の機械層から抽出した規範文で、 手で編集しない (`xtask check` の claude-md-constitution が drift を deny で落とす)。 本 ADR はこの区間を CLAUDE.md から生成 file 1 枚へ移す。
  ・憲法の生成 file（constitution generated file）: 生成区間の移り先 (docs/constitution.md・tracked)。 正本は constitution.html で、 この file は生成物。 CLAUDE.md の pointer 1 行と席の指示文の pointer と lens の観点 `constitution` がこの file を指す。
  ・pointer 行（pointer line）: 席の指示文の雛形の行のうち、 行末の `→ SSOT:` の後ろに出所 (憲法の条・ADR・設計 doc・rules 行) を持つ行。 出所を持たない行は規範文として雛形の規律に反し、 `xtask check` の seat-brief が落とす (ADR-1022 §2.4)。 本 ADR が orchestrator に注入する憲法の行はすべてこの形。
  ・席の指示文（seat brief）: SessionStart の hook が、 役割ごとの雛形 1 枚の穴を登録 row と rules 行の値で埋めて stdout に出す文。 登録の無い席 (runner・ad-hoc の session) には 0 byte。 compact のたびに出し直される (Claude Code の SessionStart の性質)。
  ・CI の門 / in-loop guard（CI gate / in-loop guard）: CI の門 = PR の入口で撃つ検査 (xtask check・clippy・flip-check・cargo deny・insta 等・PostHoc)。 in-loop guard = 編集や command の時点で止める PreToolUse の hook (write-set / command / role・InLoop / FailClosed)。 C 条文の執行はこの 2 種のどちらかに在る (CTX3)。
  ・Ask-first / Never の条（Ask-first / Never articles）: 憲法 §2 の段のうち、 「先に user に聞く」(A1〜A4) と「拒む」(N1〜N4)。 本 ADR が注入するのはそのうち機械の面をほとんど持たない A1 / A2 / A3 / A4.2 / N1 / N2 / N3 で、 A4 (許可)・N1.2 (code の形)・N4 (folio の gate と rules-diff) は注入しない。
  器の頁の末: このページは、大もとの機械データ (正本) から自動で組み立てられています。構造は機械が自動で検査し、内容が元データに忠実かは独立のレビューで確かめます。
