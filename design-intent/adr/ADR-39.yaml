# 判断の記録 ADR-39 — 器 scribe2 の設計の資料を tsuzuri の根の設計の正本へ取り込む（持ち主の裁定 2026-10-04・記帳先 = tsuzuri の台帳の memo t3-hub.74.60 と問い t3-hub.74.60.1）
# 起草は係 w114a（2026-10-04）。材料は drafts/w114a/w（inventory.tsv・drift.md・import-plan.md・question-import.md）。承認の欄の逐語は適用の script が --verbatim の file から入れる。
id: ADR-39
title: 器 scribe2 の要件・判断の記録・設計文書・語彙は、番号に 1000 を足す写しで tsuzuri の根の design-intent へ 5 段で取り込み、器の要件を器の振る舞いの正本にする（ADR-36 の決定 (7)・ADR-33 の決定 (2)・ADR-18 の決定 (8) の器の分を替える）
status: accepted
date: 2026-10-04
context: |
  持ち主の問い（2026-10-04・逐語は閉じた memo t3-hub.74.58 の notes）。器の設計書を folio の形で取り込み、正しく編集する作業が要るのではないか。今の決め ADR-36 の決定 (7) は、器の設計文書 31 本と判断の記録 112 本を凍った資料として残し、器の振る舞いを替える行は凍った文書を直さず、新しい振る舞いを行の節に書いて凍った文書の § を名指す、とした。その前の ADR-33 の決定 (2) は器の記録の file の名と設計文書の § の印を byte のまま運ぶとし、ADR-18 の決定 (8) は持ち込んだ設計文書を tsuzuri の設計文書の検査の外に置いた。
  材料の数（係 w114a の一覧・main 882e0298）。器の判断の記録の HTML 112 本（9.07 MB・accepted 90・proposed 22）・設計文書 31 本（6.20 MB・墓標の頁 3 本を含む）・要件 1 本（要件 113・受入基準 82・非機能 6・語 136）・語彙 1 本（254 KB・厳密な YAML でない）。今も効くかは、判断の記録が 効く 57・一部 47・替わった 3・退いた 5、設計文書が 効く 12・一部 16・退いた 3。器の code の注が引く数は、記録の id 742 行・設計文書の名 2,880 行・台帳の id 881 種。器の code が中身を読む凍った file の読み手は器の部品 3 つ（記録の索引と語彙の照らし・help の文書の名・憲法の照らし）。
  食い違い（drift.md）。着地した器の行 3 本（v-retire・v-join-prep・v-swap）と走り中の行 2 本（v-lane・v-lane-cap）と持ち込みと切り替えだけで、凍った文書と今の振る舞いが 11 件ずれた（着地 5・走り中 4・切り替え 2）。触れる所は設計文書の約 85 §（うち path の字 crates/xtask が 64 §）・器の判断の記録 7 本・器の要件 1 本。行の節が凍った § を名指していたのは 11 件のうち 1 件だけだった。
  仕組みの穴。器への宣言の要件の置き場（requirements）は根の要件書 1 本だけを読むので、器の行 12 本は器の要件を引けず、全部が根の非機能の要件 NFR3（依存の予算と見せる先）を引いている。器の受付と床は、行がどの約束を替えるかを見られない。
  床の決まり（判断の記録の欄の決まり）。記録の id の形は頭が 0 でない数で、頭が 0 の 4 桁（器の ADR-0047 の形）は外の参照として数えない。0 を落とすだけだと tsuzuri の同じ番号と衝突する。生きた設計ノートは 6 本の上限が満ちており（R-31）、設計ノートの章は 1 本 40 以下（R-26・廃止のノートも数える）で、器の設計文書のうち 4 本（72・69・51・45 章）が越える。発効した記録は封の一覧で本文が凍る。
  範囲。器の憲法の 2 file と席への憲法の注入は別の問い（memo t3-hub.74.59）が扱い、この記録の外に置く。
  問いは 1 本（t3-hub.74.60.1）で、案 A に裁定された（裁定 id は承認の欄）。
decision: |
  (1) 替える決め。この記録は、封で凍った 3 本の記録の決定を、器の資料の分について替える。3 本の本文は替えない（ADR-36 の決定 (6) が ADR-33 の決定 (8) の読みを替えたのと同じ形）。
  (ア) ADR-36 の決定 (7)（凍った資料として残し、行の節で凍った § を名指す）は、下の (5) の段 1 の着地までの間の運びとしてだけ効く。段 1 の着地の後は (6) の運びに替わる。
  (イ) ADR-33 の決定 (2)（器の記録の file の名と設計文書の § の印を byte のまま運び、後の行も替えない）は、元の file を段 5 まで置き場のまま byte のまま残し、段 5 で退役の置き場へ名を替えずに移す形に替える。§ の番号は (3) の写しで保つ。
  (ウ) ADR-18 の決定 (8)（持ち込んだ repo の設計文書を tsuzuri の設計文書の検査の外に置く）のうち、器の分は、取り込んだ物を根の床の内に置く。folio2 の分は替えない。
  (2) 番号の写し。器の判断の記録の番号（頭が 0 の 4 桁）と、器の要件・受入基準・非機能の要件の番号は、1000 を足した番号に写す（例: 器の記録 ADR-0028 は根の記録の 1028 番・器の要件の 61 番は根の要件の 1061 番）。器の code の注の id は替えない（ADR-18 の決定 (5)）。対応はこの規則 1 つで足り、対応表の file を置かない。
  (3) 節の番号。器の設計文書の「## N.」の N を設計ノートの節の番号 n にそのまま写す（設計ノートの欄の決まりが同じ意味と書く）。40 章を越える 4 本は 2 本の設計ノートに割り、後の本の 1 節目に前の本への 1 行を置いて元の番号を飛ばして続ける。床が番号の飛びを通さない時は、後の本を 1 から振り直し、元の番号との差の規則を後の本の 1 節目に書く。
  (4) 置き方。
  (ア) 器の要件は根の要件書へ写し、器の振る舞いの正本にする。
  (イ) 器の判断の記録は根の判断の記録の置き場へ写す。accepted の 90 本は承認の欄（承認者 = 持ち主・日付 = 元の記録の日付・裁定 = 元の記録が名指す器の台帳の id・逐語 = 器の台帳の notes を指す字・面 = 持ち主との対話面）を持たせて封へ入れる。提案中（proposed）の 22 本は提案中のまま置き、ADR-36 の決定 (6) の受け直しは、持ち主の裁定で提案中を accepted へ上げて封へ入れる 1 手にする。
  (ウ) 器の設計文書は根の設計ノートの置き場へ、状態を廃止（retired）にして写す。後継は各文書の頭の行が名指す器の要件、承認の欄はこの記録の裁定とする。各ノートの末に節「取り込みの時の食い違い」を足し、係（w114a）の食い違いの表（drift.md）の 11 件のうち当たる物と後継の要件を名指す。
  (エ) 器の語彙は根の語彙へ、同じ語の衝突を照らしてから足す。
  (オ) 器の憲法の 2 file と、席への憲法の注入は、この記録の外（memo t3-hub.74.59）。
  (5) 段。どの段も、床の 4 段（欄の決まりの書き直し・契約表の導出・床の検査・導出の照らし）が rc 0 の席の設計の commit で置く。
  段 0 はこの記録。
  段 1（要件）は別の係が起草し、行（v-flag-guard）の起草の前に置く。器の振る舞いの食い違いのうち要件に当たる物（器の自己更新の口の断りの段）を同じ commit で直す。
  段 2（判断の記録）は行（v-flag-guard）の前が良い（器の記録 ADR-0056 の受け直しを (4) の (イ) の 1 手にできる）。
  段 3（設計文書）と段 4（語彙）は順を問わない。
  段 5（元の file を退かせる）は、器の検査の部品のうち元の file を読む物（記録の索引・語彙の照らし・help の文書の名）を直す器の行と同じ便で、元の file を名を替えずに器の下の退役の置き場（scribe2/retired/）へ移す。行（v-gates）の中か直後に置く。憲法の 2 file と憲法の照らしの部品は (4) の (オ) のとおり動かさない。
  段 0 から段 4 は根の design-intent だけを書き、cargo を撃たず、器の下を書かないので、器を書く便の同時に 1 本の枠（ADR-33 の決定 (12)）を使わず、器の行と並べて流す。見込みは token 65 万〜100 万・席と係で 3.5〜4.5 日・記憶の装置（SSD）への書きは段 0 から段 4 で 1 ギガバイト（GB）未満。
  (6) 取り込みの後の運び。段 1 の着地の後、器の振る舞いを替える行は、置く時の席の設計の commit で取り込んだ器の要件の字を新しい振る舞いへ直し、行の要件の欄（req）にその要件を書く。凍った § の名指しは要らなくなる。段 1 の前に置く行は、ADR-36 の決定 (7) のとおり凍った § を名指す。
  (7) 器の台帳の裁定 id。床は裁定 id の形だけを見る。器の台帳は凍った器の repo の台帳に 1,053 項が全部閉じて在り（その machine だけに在る）、tsuzuri の台帳では題に元の id を持つ 52 項だけが引ける。引くのは凍った器の repo の台帳を読むだけの口で行い、その書き出しの写しを席の非公開の置き場に 1 つ置く。器の台帳の notes の逐語は公開の file に写さない。
  (8) 公開。写す本文は公開の器の repo の最新の木の字（ADR-33 の決定 (4) で最新の木の当たり 0）。新しく書く字（承認の欄・退きの欄・平易文・食い違いの直し）は commit ごとの公開の走査を通す。
options:
  - id: a
    name: 根の design-intent へ寄せ、番号に 1000 を足して写し、5 段で取り込む
    text: 決定 (1) から (8)。失う物は 0 にできる（番号・節の番号・元の file・code の注を保つ）。40 章を越える 4 本だけ 2 本ずつに割る。
    verdict: adopted
    reason: 器の行が器の要件を欄で引けるようになり（今 0 本から 113 本）、器と tsuzuri の判断の記録が同じ木で替わりを書け、面と持ち主の頁に器の設計が出て、床が 1 つで済む。後の名の替え（ADR-18 の決定 (4)）で番号を振り直さない。
  - id: b
    name: 器の下に独りで立つ folio の形の木を作り、床の歯 1 本で見張る（folio2 の前例）
    text: scribe2 の下に規則の表・要件・判断の記録・設計ノート・語彙の木を置き、根の検査にその場で床を撃つ歯を足す。
    verdict: rejected
    reason: 器への宣言の要件の置き場が根の要件書だけなので、器の行が器の要件を引けないまま残る（0 本）。木をまたいだ後継の名指しが書けず、面に出すには道具の直しが要る。器の検査が読む古い語彙の file と同じ名の file を同じ dir に置けない。
  - id: c
    name: 要件と判断の記録だけを根へ寄せ、設計文書は凍った文書のまま置く
    text: 段 3 を行わず、設計文書は今の置き場の字のまま残す。
    verdict: rejected
    reason: 設計文書の食い違いの約 85 § が床と面に載らず直らない。費用の差は token 20 万〜30 万だけ。
  - id: d
    name: 今の決定 (7) のまま凍らせ、行の節で名指すだけにする
    text: 取り込みをせず、器の振る舞いを替える行の節に凍った § を名指す。
    verdict: rejected
    reason: 食い違い 11 件が直らず、名指しは 11 件のうち 1 件しか守られていない。統合の残りの行 30〜45 本で 50〜130 件に増える見込みで、器の要件は引けないまま。
basis: [ADR-18, ADR-33, ADR-36, P-2, P-28, R-26, R-31, NFR3]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo（t3-hub.74.60）か後継の memo の notes に記帳する。問う相手は持ち主。
    (1) 同じ段が同じ理由で床に 3 度落ちたら、その段の形を問い直す。
    (2) 段 0 から段 4 の token が見込みの 1.5 倍（150 万）を越えたら、残りの段を止めて問う。
    (3) 段 1 の着地の後、器の振る舞いを替える行が要件の字を直さずに着地した回が 2 回に達したら、決定 (6) の運びを機械で見る行を起こすかを問う。
plain: |
  器（scribe2）の設計の資料を、凍らせたまま置かず、tsuzuri の設計の正本の形へ 5 段に分けて写し、器の振る舞いが替わるたびに直せるようにする記録です（推奨の案）。
  器の番号には 1000 を足して写すので、tsuzuri の番号とぶつからず、末の 3 桁で元の番号が読めます。元の file は消さず、器の検査が読まなくなった後に退役の置き場へ移します。
  最初に器の要件を写し、器の振る舞いを替える作業は、置く時にその要件を直して名指すようにします。器の憲法の扱いは別の問いで決めます。
approval:
  who: 持ち主
  date: 2026-10-04
  ruling: t3-hub.74.60.1（裁定 id = t3-hub.74.60.1:20261004T0113Z-1・取り込みは案 A・席とのチャット・notes に逐語）
  verbatim: "１−７はすべて推奨で良い"
  surface: R-8
consequences:
  - 段 1（要件）は別の係が起草し、行（v-flag-guard）の起草の前に置く。
  - 段 2 と段 3 は器の行と並べて流せる。段 5 は行（v-gates）に乗る。
  - ADR-36 の決定 (7) の名指しの運びは段 1 の着地まで続く。ADR-36 の目安の基準（C5・器の記録と設計文書の形の扱いの記録が在る）はこの記録で満ちる。
  - 未確か（段の起草の最初に確かめる）。根の要件書の欄の決まり（平易文の要否・器の上位の必要 5 本の id の写し方）・床が設計ノートの節の番号の飛びを通すか・判断の記録の本文に設計ノートの散文の門が掛かるか・器の語彙の厳密でない所の直しの手数。
note: 起草 w114a（2026-10-04）。数は drafts/w114a/w の inventory.tsv と drift.md から。持ち主の逐語は台帳の notes に在り、この下書きには書かない。
