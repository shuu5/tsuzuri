  器の承認の欄: 裁定 (user)・user・user 2026-09-20 (対話面・便を止める権能を起動の権能から分けて席に与える・逐語は台帳 s2-07l.495 の notes)・裁定済
  器の承認の欄: 設計 (orchestrator)・orchestrator・2026-09-20 起票 (権能の閉じた列と guard の表と stop の 2 つの口の現物・拘束する constitution の版 0.5.0)。 発効は権能 stop と rules 行の値と guard の照合が land した版・作成
  器の案の章の要約: 候補を 5 つ並べます。「止める」だけの許可を新しく作って席に渡す案、席に「始める」の許可ごと渡す案、止める手段を user の手だけに残す案、器が時間を見て勝手に止める案、そして「全部止める」も席に許す案です。
  器の専門語の説明: 本文に出てくる専門語を、やさしい言葉で説明します。
  ・権能（capability）: 役割ごとに許された操作の閉じた一覧。 列挙は器の中の型が持ち、 文書は写さない。 どの役割がどの権能を持つかは役割ごとの rules 行 (値は権能の名の列・user の裁定 id 付き) が持ち、 同じ 1 行を執行 (guard)・席の指示文・生成文書が読む。
  ・起動の権能（launch）: 便を起こす側の操作をまとめた権能 (受付・起動・再開・退役)。 ADR-1045 §2 (1) の後は席の rules 行に無く、 器の dispatcher の口である＝どの席からも撃てない。 本 ADR はこの束から停止だけを抜く。
  ・停止の権能（stop）: 走っている便 1 本を終端へ倒す操作の権能 (本 ADR が足す)。 席の rules 行に並び、 撃てるのは便を名指す形だけである。 生きている席を全部止める形は起動の権能のままで、 どの席からも撃てない。
  ・終端の段（terminal stage）: 便がそれ以上進まない段 (着地・失敗・停止と、 判定が FAIL の段)。 終端でない便だけが排他の母集団に数えられ、 同時走行の最大値にも数えられる。 終端に達した直後は列の契機の 1 つで、 器が次の便を起こす。
  ・列外（out of the queue）: 終端に着いた便の契約が起動の列から外れている状態。 契約の字が変わるか、 release の印が打たれた周に列へ戻る。 印 1 回で戻るのは 1 回だけで、 同じ字でまた終端に着けば再び列外になる。
  ・fail-closed（fail closed）: 解けない・読めない周に「通す」ではなく「止める」側へ倒す極性。 ここでは、 便の名指しを読めない停止の呼び出しを起動の権能の側 (＝席では撃てない側) へ倒す。 極性は型が持ち、 全 guard の一覧は器が生成する。
  器の頁の末: このページは、大もとの機械データ (正本) から自動で組み立てられています。構造は機械が自動で検査し、内容が元データに忠実かは独立のレビューで確かめます。
