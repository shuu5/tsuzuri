# 判断の記録 ADR-49 — 便 1 本の SSD の書きは器の読みの口で段ごとと和に数え、event log の形は替えない（ADR-37 の決定 (7) の読み・持ち主の裁定 2026-10-04・記帳先 = tsuzuri の台帳の問い t3-hub.80.22 の notes）
# 起草は係 w161a（2026-10-05）。材料は係 w154a の起草（drafts/w154a/w/notes.md・questions.md）と検証役 qv156 の攻め（drafts/qv156/w/attack.md）。ADR-37 は封で本文が凍っているので、その決定 (7) の読みをこの記録に残す。承認の欄は問い t3-hub.80.22 の裁定。
id: ADR-49
title: 便 1 本の記憶の装置（SSD）の書きは、器の読みの口 1 本が費用の記録の実装の AI の書きと便の作業の dir の 3 つの記録から段ごとと和で出し、器の event log の形は替えない（ADR-37 の決定 (7) は在る記録に書きの欄を足す決めと読む）
status: accepted
date: 2026-10-04
context: |
  ADR-37 の決定 (7) は、便ごとの書きの記録の行（xp-io-bytes）で「便の囲いごとの正味の書きの byte を、囲いの使用量の行と便の費用の event に足す」と決めた。着地した行は、囲いのうち実装の AI（runner）と gate の検証の 2 つだけを費用の event（RunCost）に載せた（行の題が自分で範囲を限っていた）。
  数（2026-10-04 の 23 便・書きの語を持つ便の全部・係 w154a・検証役 qv156 が撃ち直して一致）。測れている書きは 330.3 ギガバイト（GB）で、そのうち費用の event の書きは 239.9 GB（72.6%）。抜けは、終わりの門 29.3 GB（23 便の全部）・着地の確かめ 49.1 GB（7 便）・列の候補 12.1 GB（1 つの列の 2 便）で、どれも便の作業の dir の記録の file（end-gate.jsonl・verify-main.jsonl・verify.jsonl）の欄（write_bytes）にだけ在る。囲いの外の書き（作業木の作り・着地の git・審査役の claude の囲い）はどの記録にも無い。
  形の比べ。器の event の読み手は、知らない kind・key・source の行を読めない行にし、1 行でも読めなければ log の全部を読めない。新しい kind を足す形と費用の event に source を足す形は、器の binary を戻した時と旧い版の器が log の全部を読めなくなる（条 N-4.2）。在る source と在る欄に閉じた語で段の書きの行を費用の event に足す形（案 C'）は旧い器も読めるが、費用の event が「claude 1 回の消費」でなくなり、審査役でない囲いを審査役と書き、token の 0 が測った値でなく決めた値になる。
  ADR-37 の決定 (5) は、元から実験場の数えを「event と便の作業の dir から」と決めていて、実験場の見張りも同じ式で数えている。
  問い（t3-hub.80.22）は案 A に裁定された（裁定 id は承認の欄）。
decision: |
  (1) 読み。この記録は、封で凍った ADR-37 の決定 (7) の「便ごとの書きの記録」を、在る記録（囲いの使用量の行と便の費用の event）に書きの欄を足す決めと読み、行（xp-io-bytes）の着地で済んだとする。ADR-37 の本文と、ほかの決定は替えない。
  (2) 数える口。便 1 本の書きは、器の読みの口 1 本（pipe show の旗 --write・行 v-run-write）が数える。口は、費用の event の実装の AI の書きと、便の作業の dir の 3 つの記録（終わりの門・gate と列の候補の検証・着地の確かめ）の書きの欄から、段ごとの値と和を 1 行で出す。器の event log の形（kind・key・source・detail の語）は 1 字も替えない。新しい記録の file も置かない。
  (3) 測れない物。測れない段は 0 と書かず「測れていない」と出す（ADR-37 の決定 (7) のとおり）。囲いの外の書き（作業木の作り・着地の git・審査役の claude の囲い）は、この口でも数えない物として名指す。
  (4) 使い道。ADR-36 の基準（D1 と G11・便 1 本の書き込み）は、この口の和で測る。実験場の見張り（ADR-48 の決定 (3)）も同じ式で数え、基と本番の数え方を揃える。
options:
  - id: a
    name: 器の読みの口を足し、記録の形を替えない
    text: 決定 (1) から (4)。
    verdict: adopted
    reason: 記録の形も意味も替えないので、旧い版の器と戻した binary も log を今どおり読める。ほかの project の席でも同じ口が効く。失うのは「event log だけを読めば全部の書きが分かる」ことだが、ADR-37 の決定 (5) の数えは元から便の作業の dir も読むので、今の数え方には効かない。
  - id: b
    name: 費用の event に段の書きの行を足す
    text: 終わりの門・列の候補・着地の確かめの囲いが終わるたびに、在る source と在る欄に閉じた語（段の名と書きの byte）を持つ費用の event を 1 行ずつ書く（案 C'）。
    verdict: rejected
    reason: event log だけで全部が分かり ADR-37 の決定 (7) の字どおりだが、費用の event が claude 1 回の消費でなくなり（面の件数が 1 便 +1〜3）、審査役でない囲いを審査役と書き、token の 0 が決めた値になる。書く口が 3〜4 か所で、照らし直す着地済みの歯も多い。
  - id: c
    name: 新しい kind か source を足す
    text: event log に段の書きの新しい kind を足すか、費用の event の source を足す（案 B と案 C）。
    verdict: rejected
    reason: 旧い版の器と戻した binary が log の全部を読めなくなる（条 N-4.2）。
basis: [ADR-37, ADR-36, ADR-1004, N-4]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo（t3-hub.80）か後継の memo の notes に記帳する。問う相手は持ち主。
    (1) 行（v-run-write）の着地の後の 2 週で、口が「測れていない」と出す便が便の 1 割を越えたら、記録の形（案 C'）を問い直す。
    (2) 口の和と、席の見張りの道具の同じ式の和が 1 便でも 5% 以上違えば、式を問い直す。
    (3) 囲いの外の書きを測った時に、1 便あたり口の和の 1 割を越えたら、囲いの外を数える形を問う。
plain: |
  作業 1 本（便）が記憶の装置（SSD）にどれだけ書いたかの数え方を決める記録です。
  今の費用の記録は、測れている書きの約 7 割しか持っていません。残り（作業の終わりの検査・取り込みの確かめ・列の候補の検査）は、作業ごとの記録の file にだけあります。
  記録の形は替えず、器に「作業 1 本の書きを段ごとと合計で出す口」を足し、作業の評価の書きの基準はこの口の合計で測ります。前の決めの字は「費用の記録に書きを足した時点で済んだ」と読みます。
approval:
  who: 持ち主
  date: 2026-10-04
  ruling: t3-hub.80.22（裁定 id = t3-hub.80.22:20261004T2037Z-1・案 A・束 batch:20261004T2037Z-1・裁定面・notes に逐語）
  verbatim: "すべて推奨で承認する"
  surface: R-8
consequences:
  - 器の行（v-run-write）は口を足すだけで、器の event log と着地済みの歯の字を書き替えない。行の起草は係（w154a）。
  - 席の見張りの道具（形 B の見張りの数え）は、行の着地の後に口へ移せる。それまでは同じ式を手で組む。
note: 起草は係 w161a。数は係 w154a の測り（drafts/w154a/w/gaps-1004.tsv）と検証役 qv156 の撃ち直しによる。
