# 判断の記録 ADR-42 — board に新しい状態「留め置き」を足し、依存でない理由で人の手を待つ契約を Blocked と同じ列に印で分けて出し、席の止めの理由は器の止めの印だけに置く（持ち主の承認 2026-10-04・記帳先 = tsuzuri の台帳の問い t3-hub.79.1 と memo t3-hub.79 の notes）
# 起草は係 w131a（2026-10-04）。材料は drafts/w131a/w（vocab.md・mechanism.md・outline.md・notes.md）。承認の欄は席が埋めた（2026-10-04）。行の試作と差の file は係 w132a〜w136a。
# 同じ commit で語彙表に語（留め置き・原語 held）を足した。本文の英字の原語は全部（…）の中に置いた。
id: ADR-42
title: board は依存でない理由で人の手を待つ契約を新しい状態「留め置き」として Blocked と同じ列に印で分けて出し、席の止めの理由は器の止めの印だけに置いて印を外すと一緒に消す
status: accepted
date: 2026-10-04
context: |
  持ち主は（2026-10-04）、pipeline の Queued の列に 2 時間ほど留まった便（t3-hub.74.59.8・2026-10-04 の 04 時 07 分から 06 時 29 分）を見て、意図した物かを問うた。席の答えは、依存の相手は着地済みで、席が器の止めの印（hold）で止めていた、というものだった。器の止めの印は board に出ず、理由の字は席の台帳の notes にだけ在った（memo（t3-hub.79））。
  持ち主は（2026-10-04 の 06 時 51 分・席の推奨のまま）次を決めた。blocked の定義は替えない。新しい状態は依存でない理由で止まった契約で、中身は席が理由を付けて止めた物と、器の受付の断り（人の手が要る物）とする。同じ file の待ち（重なり（overlap）・自動で解ける）は入れない。board は blocked と新しい状態を同じ所にまとめて出し、札は印で分け、吹き出しと個別の頁に理由・止めた時刻・解く条件を出す。理由は席が書く。名は、適切で、ほかの語と一貫した物にする。
  係の調べ（main 35ddf966）。器の止めの印は器の記録の 1 行（種類 DispatchMark・欄 mark が hold）で、理由の字の欄は使っていない（欄 detail は空）。止めの口は列の 1 周も局面の出力の書き直しも撃たないので、止めた後に器の局面の出力（fleet/lifecycle.json）へ載るのは、次に別の契機が全部を書き直した時になる。局面の出力の契約の部品は、止めの時は局面（contract-queued）の理由が hold で、止めた時刻（since）を持たない。受付の断りは局面（contract-refused）で、理由は断りの名だけ（1 行の理由は捨てる）、列の理由が受付の断り（admission）の周は時刻も持たない。
  board（ADR-27 の決定 (6)）は、局面の出力が読めれば、承認待ち（run-blocked）と、列の待ちの理由が依存（dependency）・重なり（overlap）・予約（reserved）の物を Blocked の列に、ほかを Queued の列に出す。台帳の依存だけで割るのは局面の出力が読めない時の縮退である。ゆえに今、席の止めと受付の断りはどちらも Queued の列に出て、受付の断りの札の吹き出しの理由は「まだ分からない」になる（面の語の辞書は待ちの 12 語しか引かない）。
  名の調べ（drafts/w131a/w/vocab.md）。memo の仮の名「保留」は、要件 FR1015 の平易な字が器の Blocked（承認待ち）を「保留」と呼び、account board の移動の図も「保留」を出すので、日本語の名にしない。英字の候補は 3 つ（held・withheld・parked）を、key の形・日本語の字の形・既存の語との衝突・台帳の状態（status）との取り違えで比べた。台帳の状態の語（deferred）は「先送り」として一覧に出ているので候補から外した。
decision: |
  (1) 定義。新しい状態「留め置き（Held）」は、開いた契約の bead のうち、依存でない理由で、人の手（席が印を外すか、契約か設計の行を直すか）が入るまで器が起こさない物とする。中身は次の 2 つだけ。(ア) 席の止め: 器の止めの印（hold）が効いている物（局面（contract-queued）の理由が hold）。(イ) 受付の断り: 器の受付が断った物（局面（contract-refused））。
  (2) 含まない物と blocked。blocked の定義（ADR-27 の決定 (6)）は替えない。承認待ちと、依存・重なり・予約の待ちは今のまま Blocked で、留め置きに入れない。依存と止めが両方在る契約は、器の判定の順（依存が先）のとおり依存が閉じるまで Blocked に出て、閉じた後に留め置きに移る。host の混み（host-busy）と起こした便の受付待ち（launched）は自動で解けるので Queued のまま。手番が席でも、席が印を置いて止めた物でも受付が断った物でもない待ち（決定の反映待ち（unreflected-ruling）・床の検査の落ち（floor）・同じ設計の行の直し待ち（sibling））は Queued のまま、今の待つ理由の字を出す。
  (3) 名。段の key は留め置き（Held）とし、ほかの段と同じく英語のまま面に出す。日本語の字は「留め置き」。列は Blocked の列のまま（列の電文の字は替えない）で、見出しの字を「Blocked / Held」にする（今の合わせ列の見出しと同じ形）。語彙表に語を足し、要件 FR10 の字に留め置きの札を足す。
  (4) 理由の置き場と書き手。席の止めの理由の正本は、器の止めの印の行の欄（detail）の 1 つだけとする（字は「reason:」の後に理由・器の全部止めの逐語の形と同じ）。書くのは席で、release で印を外すと効いている理由も一緒に消える（器の記録の行は履歴として残る）。台帳の notes に止めた経緯を書くのは任意で、board は読まない。受付の断りの理由は器が書く。
  (5) 器の止めの口。止めの口（pipe dispatch hold BEAD --reason 字）は理由を要る。理由が無いか空白だけか改行を含む止めは、印を書かずに使い方の誤りとして断る。先の印（first）と release は理由を取らない。器は理由の字を判定に使わない（器の設計 dispatcher §4 の自由文を判定の入力にしない約束を守る）。打ち手の名は持たない。列の観測の口（dispatch ls）は今の行の字を替えず、効いている止めごとに 1 行（[DISPATCH-HOLD] bead=id since=時刻 why=理由）を件数の行の前に足す。止めの口は印を書いた直後に局面の出力の全部の書き直しを切り離した子で起こす（器の設計 case-lifecycle §21 の答えの口と同じ形）。
  (6) 局面の出力の足し。契約の部品に任意の欄（why・理由の字）を足す。局面（contract-queued）で理由が hold の時は効いている印の理由、局面（contract-refused）の時は受付の断りの 1 行の理由を置く。止めた時刻（since）は、止めの時は印の時刻、受付の断りの時は断りの記録の時刻（列の理由が受付の断りの周も）とする。受付の断りの記録の行（IntakeRefused）に 1 行の理由を欄（detail）で載せる。出力の版は 1 のまま（任意の欄の足しで、読み手は欠けた欄を値なしと読む）。
  (7) board の出し方。中核は局面の出力から段 Held を決め、Blocked の列に置く。列の見出しの数は Blocked と Held の内訳を出す。札は、席の止めと受付の断りで別の印を持ち、Blocked の札は印を持たない。札の要の 1 行は印の語と止めてからの経過とする。吹き出しと個別の頁（頭の概要の下）には、止めた者（席か器の受付）・理由（席の止めは理由の字、受付の断りは断りの名の平易な字と 1 行の理由）・止めた時刻と経過・解く条件（席の止めは席が印を外すと列に戻る、受付の断りは席が契約か設計の行を直すと次の周に受付をやり直す）を出す。局面の出力が読めない間は留め置きを判じず今の縮退のままにし、理由の欄が無い時は「まだ分からない」と出す。次の一手と台帳の指標と account board の形は替えない。
  (8) 器の記録との関係。器の設計文書と判断の記録は凍った資料のまま書き換えない（ADR-36 の決定 (7)）。行の節は dispatcher §4・§6・§26 と case-lifecycle §5.2・§12・§21 を名指し、新しい振る舞いを書く。器の待ちの知らせ（idle）の末尾の重なりの待ちの欄は、名（held=）が新しい状態の名と同じ語根で取り違えるので、名を（overlap=）に替える（数と file の並びの形は替えない）。この欄の読み手は器の中だけで（知らせの字を組む 1 関数と器の端から端の歯〔e2e〕の 6 か所）、tsuzuri の面と plugin の差し込み（hook）と席の script には無い。替えるのは止めの理由の器の行で、凍った器の設計文書 dispatcher §26 の字（held=）はその行の節が新しい名で読み替える。
  (9) 順と効く時。器の 3 行（止めの理由・局面の出力の足し・受付の断りの理由）を先に、board の行を後に流す。段の分類の行は器の行を待たずに組め、その間の理由は「まだ分からない」と出る。止めの口が理由を要るようになる器の行の着地の後、席は止めの手順（包みの script と起草の守り）を理由つきの形に替える。
options:
  - id: a
    name: 新しい段を足し、理由を器の止めの印に持たせ、局面の出力が運ぶ（推奨）
    text: 決定 (1) から (9)。
    verdict: adopted
    reason: 理由の置き場が 1 つで、印を外すと一緒に消える。board は今と同じく局面の出力だけを読み、器の判定を 2 本目に書かない。段が型に在るので、列・札・一覧・account board の段の字が同じ 1 つの分類から決まる。
  - id: b
    name: 理由を台帳の notes に置き、board が台帳を読んで切り出す
    text: 席は今のまま台帳の notes に理由を書き、board は notes の自由な字から止めの段を探す。
    verdict: rejected
    reason: 置き場が印と notes の 2 つになり、release で notes は消えない。自由な字の形を board が判じることになる。
  - id: c
    name: 段を足さず、札の欄で印だけを分ける
    text: 段は Queued のまま、札に止めの欄を足し、列の決めを札の欄で替える。
    verdict: rejected
    reason: 新しい状態が型に無く、列の決めと段の字が札の欄に散る。一覧と account board の段の字は Queued のまま残る。
  - id: d
    name: 理由の置き場を器の置き場の別の file にする
    text: 止めの理由を置き場の下の file に書き、release で消す。
    verdict: rejected
    reason: 器の設計（dispatcher §17 の却下）が記録と別の状態の file を退けている。記録の行と file の 2 つを合わせる仕事が増える。
  - id: e
    name: 重なりの待ちも留め置きに入れる
    text: 同じ file を書く便の待ちを留め置きに含める。
    verdict: rejected
    reason: 自動で解ける順番待ちで人の手が要らない（持ち主の決め）。
basis: [ADR-27, ADR-30, ADR-36, FR10, FR1015, FR1068, FR1090, R-19]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo（t3-hub.79）か作る行の bead の notes に 1 件ごとに記帳する（日付・材料・当たった条件）。問う相手は持ち主。
    (1) board の行の着地の後 14 日の内に、席か持ち主が board の留め置きを、器の知らせの重なりの待ちの欄（overlap=・名を替える前は held=）か器の予約（reserved）と取り違えた事を 1 度でも記帳したら、名を別の候補（withheld・日本語は差し止め）に替える案を問う。
    (2) 止めの口が理由を要るようになった後 14 日の内に、理由の無い止めの断りで席の手順が止まった事を席が 2 度記帳したら、断りを注意に緩める形を問う。
    (3) 器の行の着地の後、止めた時から board の札が留め置きに移るまでが 60 秒を越えた事が 1 度でも見つかったら、書き直しの契機の形を問い直す。
    (4) 持ち主が、決定 (2) で Queued に残した待ち（決定の反映待ち・床の検査の落ち・同じ設計の行の直し待ち）を留め置きに入れたいと 1 度でも言ったら、範囲を問い直す。
plain: |
  board に新しい状態「留め置き（Held）」を足します。依存の相手は済んでいるのに、席が理由を付けて止めた作業と、器の受付が断った作業がこれに当たります。どちらも人が手を入れるまで動きません。
  今はどちらも「順番待ち（Queued）」に見えていました。これからは「Blocked」と同じ列に「Blocked / Held」としてまとめて出し、札の印で見分けます。札を押すと、止めた理由・止めた時刻・どうすれば動くかが出ます。個別の頁にも同じことを出します。
  同じ file を書く作業の順番待ちは、自動で解けるので留め置きに入れません。Blocked の決まりは替えません。
  席が止める時は理由の書き込みを必ず求め、止めを外すと理由も一緒に消えます。理由の置き場は 1 つです。
  名の「保留」は、承認待ちの説明ですでに使われているので避けました。器の知らせに出ている同じ file を書く作業の順番待ちの数の欄（held=）は留め置きと紛らわしいので、名を重なり（overlap=）に替えます。
approval:
  who: 持ち主
  date: 2026-10-04
  ruling: t3-hub.79.1（裁定 id = t3-hub.79.1:20261004T0959Z-1・ADR-42 の案 A のまま承認・席とのチャット・notes に逐語）
  verbatim: "承認する"
  surface: R-8
consequences:
  - 器の行 3 つ（v-hold-why・v-hold-case・v-refuse-why）と board の行 5 つ（c-held-stage・g-held-col・g-held-pop・g-held-name・g-held-page）を設計ノート（surface-wave28a）に置く（行の割りは drafts/w131a/w/outline.md を元に、試作で 8 行に割った）。差は 27b の器の行と board の行の差の上で切ったので、board の行は 27b の board の行の着地の後に流す。
  - 器の着地済みの歯のうち止めの口を理由なしで撃つ 4 file の 9 か所に理由を足す（器の行の write-set に入る）。
  - 器の待ちの知らせの重なりの欄の名を（held=）から（overlap=）に替える（止めの理由の器の行・読み手は器の中の 7 か所だけ）。席が知らせを読む手順と席の memory の字を新しい名に合わせる。
  - 席の止めの手順（包みの script の使い方・起草の共通の守り・席の memory）を理由つきの形に替える。台帳の notes への理由の写しはやめてよい。
  - 段の数が 8 から 9 になるので、段の数を断言する着地済みの歯 2 本（契約の型の閉じた列・台帳の指標の段の集合）を段の分類の行で直す。
  - 要件 FR10 の shall と plain に留め置きの札を足し、要件書の版を上げる。語彙表に語（留め置き）を足す。ADR-27 の本文は封で凍っているので替えず、決定 (6) の Blocked の列に留め置きの札を加えて読む事はこの記録の決定 (3) と (7) が持つ。
  - 受付の断りの 1 行の理由は、宣言の中の path を字のまま含む（公開の repo の中の path で、外の名は持たない）。
note: 起草 w131a（2026-10-04）。memo（t3-hub.79）の範囲の (c) の字（重なりは Queued のまま）は、今の board では重なりが Blocked の列に在る（ADR-27 の決定 (6)）ので、決定 (2) は blocked の定義を替えない側で書いた。席はこの読みを問い（t3-hub.79.1）に書き、持ち主はこの記録を案のまま承認した。
