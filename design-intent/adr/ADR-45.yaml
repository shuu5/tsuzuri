# 判断の記録 ADR-45 — 合流の完了の基準（ADR-36）に、器の 3 つの宿題（便の流れの妥当性・グラフの正確さ・bead の一生）を測る門の群 H を足す（持ち主の裁定 2026-10-04・記帳先 = tsuzuri の台帳の問い t3-hub.80.4 の notes）
# 起草は席（2026-10-04）。数は係 w140a（drafts/w140a/w/inventory.md・tsv）と w141a（drafts/w141a/w/linkage.md）の出力による。ADR-36 は封で本文が凍っているので、その付表をこの記録が足す（ADR-39 の決定 (1) と同じ形）。
id: ADR-45
title: 合流の完了は、ADR-36 の基準 45 に、便の流れの妥当性・グラフの正確さ・bead の一生を測る門 7 つ（群 H）を足した 52 の基準で言う
status: accepted
date: 2026-10-04
context: |
  ADR-36 は、器 scribe2 の統合の完了を基準 45（門 32・目安 13）で言うと決めた。係の棚卸し（w140a・2026-10-04）は、基準 45 が合流の作業（錠・lint・大きさ・入れ子・費用）を測り、器の運用で出た 3 つの宿題（便の流れの妥当性・台帳のグラフの正確さ・bead の一生）を測る基準を持たないことを示した。門が全部満ちても 3 つの宿題は残る。
  数（2026-10-04・V）。器から移した宿題 48 本のうち 32 本が開いている。器が自分の repo で名乗っていた門の鍵 6 つ（close-check・row-review・teeth-check・index-scip・index-roles・detection-verify）を、tsuzuri の宣言は 1 つも名乗っていない。宣言は入口の赤を unmeasured と名乗る。導出グラフの不変条件の 3 番（g-3）は違反で、9 番（g-9）はいつも「まだ分からない」。グラフに commit の節点が 0。局面の出力は tsuzuri の置き場で 8 種を測れないと名乗る。commit の照らしの外れ（misfit）が 9 件残る。
  ADR-36 の基準 A5 は、器の宣言だけの鍵 6 つを「根の宣言へ移すか退役で退かせる」とし、働きを tsuzuri で効かせることまでは求めていない。
  問い（t3-hub.80.4）は案 A に裁定された（裁定 id は承認の欄）。
decision: |
  (1) 替える決め。この記録は、封で凍った ADR-36 の決定 (12)（付表）に群 H の門 7 つを足し、基準 A5 の読みを (2) の門（H1）で締める。ADR-36 の本文と、ほかの決定（基準と完了・釣り合いの掛け・基の値と窓・測りの口ほか）は替えない。合流の完了は、基準 52（門 39・目安 13）の門が全部満ちた木で言う。
  (2) 群 H（どれも門）。各行は「群の id・名・目標（今の値）」。
  ・（H1・門）器の門の働きが tsuzuri で効く。基準 A5 の鍵 6 つの各々について、tsuzuri の宣言で名乗って効くか、同じ働きの門を tsuzuri の着地の口に置いた記録が在る。働きを別の門が持つ時だけ退役で退かせてよい（今 0/6）。
  ・（H2・門）入口の赤を測る。器への宣言の入口の赤（entrance-flip）が unmeasured でなく、便の受付が base で歯が落ちることを確かめる（今 unmeasured）。
  ・（H3・門）グラフの正確さ。導出グラフの不変条件の全部で、違反 0 と「まだ分からない」0（今 3 番が違反・9 番がいつも「まだ分からない」）。
  ・（H4・門）commit の節点。グラフに着地の commit の節点が在り、閉じた契約の bead の全部が着地の commit の節点に結ぶ（今 節点 0）。
  ・（H5・門）一生の測り。局面の出力が tsuzuri の置き場で全部の種を測れる（今 8 種が測れない）。
  ・（H6・門）一生の閉じ。commit の照らしの外れ 0（今 9）・閉じた bead の便の作業木が残らない・main を赤にした便の束ねた commit を閉じる口が在る（後の 2 つの今の数は起草で測る）。
  ・（H7・門）器の宿題の始末。器と folio から移した宿題のうち、便の流れ・グラフ・bead の一生の主題の項の全部が、閉じた（直したか見送りの裁定）か、残す理由と期日を持つ（今 開いた 32 本の内の該当の数は起草で表にする）。
  (3) 測り。群（H）の値は ADR-36 の決定 (11) の測りの口と同じ notes に記帳する。測れない群（H）の門は、ADR-36 の決定 (1) のとおり満ちたと数えない。
options:
  - id: a
    name: 3 つの宿題を門として足す
    text: 決定 (1) から (3)。
    verdict: adopted
    reason: 3 つの宿題を残したまま合流の完了（ADR-40 の自己開発への切り替えの前提）を言えなくなる。持ち主の見立て（一部しか解かずに合流した）が数で当たっている所を、機械の数えで閉じる。
  - id: b
    name: 合流の後の別の計画にする
    text: 基準 45 は替えず、3 つの宿題は別の memo と計画で進める。
    verdict: rejected
    reason: 合流の完了は早く言えるが、宿題が門の外に残り、自己開発への切り替えの後に器の流れの穴を抱えたまま進む。
basis: [ADR-36, ADR-40, ADR-44, FR2, FR3]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo（t3-hub.80）か後継の memo の notes に記帳する。問う相手は持ち主。
    (1) 群（H）の門のどれかで、器の code の直しが要るのに、その行の起草が 2 週続けて置けなければ、門のまま待つか目安へ下げるかを問う。
    (2) 門（H1）の鍵のどれかが、名乗った後の 2 週で本番の 1 回目の着地の率（基準 G1）を 10 ポイント以上下げたら、その鍵の形を問い直す。
plain: |
  器を tsuzuri に合流させる作業が「終わった」と言える条件に、7 つの門を足す記録です。
  今の条件は合流の作業そのものを測るだけで、器を使う中で出た宿題（作業の流れが正しいか・つながりの図が正確か・作業の一生がきちんと閉じるか）を測っていませんでした。
  足すのは、器が自分に掛けていた検査が tsuzuri でも効くこと、テストが作業の前に落ちることを測ること、図の検査の違反が 0 であること、commit が図に入ること、作業の一生が全部測れて閉じること、移してきた宿題が全部片付くか理由と期日を持つことです。
approval:
  who: 持ち主
  date: 2026-10-04
  ruling: t3-hub.80.4（裁定 id = t3-hub.80.4:20261004T1456Z-1・案 A・束 batch:20261004T1456Z-1・裁定面・notes に逐語）
  verbatim: "すべて推奨で進めて良い"
  surface: R-8
consequences:
  - 合流の完了は群（H）の門 7 つの分だけ遅れる。自己開発への切り替え（ADR-40）の前提も同じだけ遅れる。
  - 門（H1）の行の審査（row-review）は、tsuzuri の設計の着地が手元の merge なので、門の置き場の設計が先に要る（ADR-44 の段 3）。
  - 門（H4）は、code のグラフの commit の節点の行で満ちる。
note: 起草は席。今の値は係 w140a と w141a の出力（2026-10-04）による。
