  器の案の章の要約: 候補を 8 つ並べます。 時計が目印を等しさで比べ、 裁定した間隔を空けて今の書き手を撃ち、 道具の場所を宣言で渡す案 (選んだ案) と、 選ばなかった 7 つです。 選ばなかった案は、 出来事の log (event log) の目印も比べる案・目印を git の前後関係で比べる案・file を読む側が自分で周期に撃つ手順にする案・作り直し専用の時計を足す案・間隔を持たないか code の定数で持つ案・時計が作り直しの口を別の process で撃つ案・systemd の環境の file で道具を見つけさせる案です。
  器の専門語の説明: 本文に出てくる専門語 9 個を、 やさしい言葉で説明します。
  ・局面の出力（case-position output）: 器が案件の部品ごとの局面・手番・時刻・理由・結びを導いて、 置き場 (state dir) ごとに 1 つ書く file lifecycle.json と、 古さの印の file lifecycle.stale の組 (ADR-1088・SRS FR1090)。 版の欄・入力の印・最後の全部の書き直しの時刻 full_at を持つ。
  ・管理 tick（management tick）: 席ごとの systemd の user の timer が rules 行 seat.tick_interval_s の周期で撃つ器の口 seat tick (ADR-1058・SRS FR1027)。 黙った席へ続きを促す合図を送り、 局面の出力の部分の書き直しを撃つ。 本 ADR で、 条件を満たす周に全部の書き直しも撃つ。
  ・全部の書き直し（full rewrite）: 台帳の全部・event log・main の設計 doc と SRS と trailer と宣言を読んで、 局面の出力を丸ごと導き直す書き (ADR-1088)。 書き手は 1 本で、 lock を取り、 撃った時の印より古くない出力には書かない。 1 回は空いた host で約 4 秒かかる。
  ・部分の書き直し（partial rewrite）: 台帳も git も撃たずに、 event log と時刻で決まる部分 (発話・便の局面・年齢と閾値越えなど) だけを局面の出力に書き直す書き (ADR-1088)。 管理 tick の周と、 発話や仕分けの記帳の直後と、 便の段の記帳の直後に撃つ (SRS FR1090)。
  ・入力の印（input marks）: 局面の出力が持つ、 書き直しが読んだ入力の目印 3 つ (台帳の印・event log の長さ・main の sha・欄 inputs)。 台帳の印は .beads の下の 1 file の読みで、 main の sha は ref の file の読みで取れ、 bd も git も撃たない。
  ・書き直しの下限（rewrite floor）: 管理 tick が全部の書き直しを撃つ間の最短の秒数で、 rules 行 lifecycle.full_min_s (値 300・裁定の字 user 2026-10-01T15:27Z) が持つ (本 ADR)。 出力の full_at と撃った記録の ts の新しい方から測る。
  ・撃った記録（attempt record）: 管理 tick が全部の書き直しを撃った周に、 返りに依らず置き場の fleet/lifecycle.tick へ書く 1 行 ts=<epoch 秒> wrote=<返りの語> (本 ADR)。 読むのは管理 tick の下限の判定だけで、 無いか読めない周は数えない。
  ・台帳 client（ledger client）: 台帳 (beads) を読み書きする command bd。 全部の書き直しは bd の読み (--readonly) で台帳の全件を読み、 台帳の印は動かさない。 本 ADR で、 seat tick は flag --bd でその場所を受け、 host の面の表 [[tick]] の任意の key bd が絶対 path を宣言する。
  ・host の面（host face）: 置き場 (state dir) ごとの host.toml 1 file で、 口座・群の表・表 [[tick]] など host 固有の宣言値を持つ (ADR-1026・ADR-1064・SRS FR1057)。 器は env と home を読まず、 host 固有の値をここと引数からだけ受ける。
