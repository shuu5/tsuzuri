# 判断の記録 ADR-1108 — 器 scribe2 の判断の記録 ADR-0108 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1108
title: "管理 tick の全部の書き直し — 台帳か main の印が局面の出力の印と等しくない周に、 rules 行 lifecycle.full_min_s の下限を空けて既存の書き手 1 本を撃ち、 台帳 client の場所は host の面の宣言で渡す (ADR-1088 の管理 tick の句・ADR-1064 の 3 句・ADR-1058 が戻した unit の形の 2 句を部分 supersede)"
status: accepted
date: 2026-10-02
context: |
  局面の出力を全部書き直すのは、 便を回す周・land の終端・口を撃った時だけで、 便を回さない置き場では台帳が変わっても出力が古いまま残る。 本 ADR は、 管理 tick の周に台帳と main の印 (小さい file の読みだけ) を出力の印と等しさで比べ、 違っていて前の書き直しから rules 行の下限 (300 秒) が経った周だけ、 既存の書き手 1 本で全部を書き直すと決める。 systemd の timer には台帳 client の bd が見えないので、 その場所は seat tick の flag と host の面の表 [[tick]] の任意の key で渡し、 宣言を受けた unit だけ起動の行の末尾に載せ、 器は env を読まない。
  なぜこの判断が要るのかを 5 つで示します。 便を回さない置き場では台帳が変わっても file が古いまま残り、 隣の project の設計席が数分の遅れで出してほしいと頼んだ経緯。 作り直し 1 回の重さと、 目印の読みの軽さの実測。 時計と作り直しの書き手の今の形。 時計からは台帳を読む道具が見えないという実測。 憲法と前の決定の向きと、 この決定が動かす範囲です。
  CTX1 経緯 — 便を回さない置き場では、 台帳が変わっても局面の出力（案件の今を書いた file）が古いまま残る
  局面の出力の全部の書き直し（出力を丸ごと作り直す）は、 dispatch の周・器が台帳を書いた直後 (land の終端の close など)・全部を書き直す口の 3 つの契機でだけ撃たれ (設計 case-lifecycle §12)、 管理 tick（席を周期で見る時計） の周は event log と時刻で決まる部分だけを書き直す (§13)。 ADR-1088 と FR1090 は、 管理 tick の周が台帳も git も撃たないと決めた。 dispatch の周は timer を持たない (FR1068) ので、 便を回さない置き場では、 台帳が変わっても、 次に便が回るか誰かが口を手で撃つまで出力は書き直されない。 2026-10-01、 隣の project の設計席が、 その project の画面 (板の一覧) は局面の出力を読むので、 便を回していない間も台帳の変化を出力に出してほしいと頼んだ。 5 分ほどの遅れなら足りるという条件つきである (memo s2-07l.738.42.1)。
  CTX2 現物 — 全部の書き直しは 1 回 4〜14 秒かかり、 入力の印（読んだ元の目印）の読みは bd も git も撃たない
  全部の書き直し 1 回は、 本 repo の台帳 (chunk 約 36 万)・event log 9.3 MB・設計 doc 30 本で、 空いた host で wall 4.3 秒・user 3.8 秒・最大 RSS 275 MB、 gate が走る host で wall 14.3 秒・user 3.7 秒だった (2026-10-01 の実測)。 全部の書き直しは台帳を bd の読み (--readonly) で読むので台帳の印を動かさず、 同じ置き場へ 2 回続けて撃つと 2 回目は Coalesced で generated が進まなかった (同日の実測)。 入力の印の読みは、 台帳は .beads の manifest の 1 file (embedded の形) か issues.jsonl の stat (files の形)、 main は refs/remotes/origin/main の loose の ref か packed-refs の読みで、 bd も git も撃たない。 印の順の比べのうち main の祖先の関係を見る比べだけが git を撃つ。 局面の出力は、 最後の全部の書き直しの時刻 full_at と、 読んだ入力の印 (欄 inputs の ledger・events・main) を持つ。
  CTX3 現物 — 管理 tick は席ごとの timer で 15 秒ごとに回り、 全部の書き直しの書き手と口は 1 本に揃っている
  管理 tick は、 器が席ごとに導出した systemd の user の service と timer の対 (ADR-1058 が戻した ADR-1030 の形・ADR-1064 が席の起動で入れる) が rules 行 seat.tick_interval_s (今の値 15 秒) ごとに撃つ oneshot である。 tick の 1 周は判定と打刻の後に部分の書き直し（時刻で動く所だけ直す）を撃ち、 その返りを捨てる (tick の rc と字は変えない)。 全部の書き直しの書き手は 1 本で、 置き場の lifecycle.lock を死んだ所有者だけ外す取り方で取り、 撃った時の印より今の出力の印が古くなければ書かず (Coalesced)、 返りは閉じた 6 値 (Written・Unchanged・Coalesced・Discarded・Busy・Unreadable) である。 口 fleet lifecycle write は、 同じ 1 本を観測の 1 周 (便を起こさない列の判定) と共に撃ち、 --bd で台帳 client（台帳を読み書きする道具） を受け、 lock を既定の時間まで待つ (--wait-ms N で待つ時間を変えられる)。 口の text は、 Written・Unchanged・Coalesced・Discarded の 4 つの返りで同じ show の字を出し、 ほかは lifecycle=busy か lifecycle=unreadable の 1 行を出す。 入力を読めない周は書き直さず、 出力に読めない印 (理由の 1 語・台帳なら ledger) を付ける。
  CTX4 現物 — systemd の user の PATH に台帳 client が無く、 tick の unit は env を持たない
  tick の unit の ExecStart は <binary> seat tick --state-dir S --target S:W (rules の写しを渡す周だけ --rules F) で、 Environment= も WorkingDirectory= も持たない (path は全部引数の値・C2.2)。 host の面（host ごとの設定 file）の表 [[tick]] は unit を置く dir と器の場所の 2 つの欄を絶対 path で持ち (ADR-1064)、 既知の key と必須の key が同じ 2 つの列なので、 任意の key を持てず未知の key を行番号つきで断る。 器はそれらを env・home・自分の実行 file の場所から解かない。 unit を手で入れる口 seat tick install と uninstall は引数だけで導出し (面を読まない)、 印は在るが bytes の違う file を unit-exists で断って動かさない。 doctor は --unit-dir と --binary の flag の組が在ればそれを、 無ければ面の [[tick]] を導出の引数に使う (flag が勝つ)。 systemd の user の PATH には台帳 client の bd が無い。 PATH に bd の無い env で口 fleet lifecycle write を撃つと lifecycle=unreadable (理由 ledger) で、 --bd に bd の絶対 path を渡すと書けた (2026-10-01 の実測)。 tick の周から全部の書き直しを撃つには、 台帳 client の場所を器に渡す道が要る。
  CTX5 憲法と既存の決定の向き — 閾値は裁定つきの rules 行・env は読まない・足す前に消すものを名指す、 と本 ADR の射程
  C1 と C5 により、 書き直しの下限（次に試すまでの最短） (全部の書き直しの間の最短の秒数) は rules 行 1 本に置き、 user の裁定 id を要る。 下限の値は 300 秒と裁定された (台帳の問い s2-07l.738.42.3・裁定 id s2-07l.738.42.3:20261001T1527Z-1・行の裁定の字 user 2026-10-01T15:27Z)。 C2.2 により器は env を読まず新しい env の口を作らず、 C10.2 により host 固有の値は host の面と引数にだけ置く。 C17.2 により、 rules 行・記録・仕組みを足す前に消すものを名指す。 N2 により、 散文の手順にしか無い規則は規則と認めない。 ADR-1088 の決定 (3) は、 管理 tick の周は台帳も git も撃たず部分だけを書き直すと定め、 FR1090・FR1027・AC1060 も同じ向きの字を持つ。 本 ADR が動かすのは、 管理 tick の周に条件つきの全部の書き直しを足すこと・その下限の rules 行・撃った記録の file・seat tick の flag --bd・host の面の表 [[tick]] の任意の key bd・bd を受けた unit の導出だけ ExecStart の末尾に --bd を載せること・seat tick install と uninstall と doctor の --bd・席の起動が面の bd を導出に渡すことである。 動かさないのは、 ほかの契機・書き手・部分の書き直し・印の読みと順の比べ・古さの印・読み手・tick の判定の列と rc と字で、 SRS の字の直しは別の round が持つ。 ADR を書く条件のうち 1 (C2.2・C5・C17.2 の読み)・3 (rules 行の kind・記録の file・host の面の key)・4 (却下案を残す価値のある分岐) に当たる。
  （選択肢を測るものさし）この判断を評価する 6 本のものさしです。 便を回さない置き場でも変化を数分で file に入れること。 変化の無い回は重い読みを撃たないこと。 重い作り直しの頻度を裁定つきの値で縛ること。 書き手と書き方を 1 本のまま使い、 新しい書き手も時計も足さないこと。 道具の場所を器が見える宣言で受け、 環境変数を読まないこと。 時計の結果と読み手を変えず、 足す前に消すものを名指すことです。
  DR1｜便を回さない置き場でも、 台帳か main の変化を数分の遅れで局面の出力に入れる CTX1
  DR2｜変化の無い周は重い読みを撃たない — 毎周の比べは小さい file の読みだけで、 bd も git も撃たない CTX2・CTX3
  DR3｜重い書き直しの頻度を、 裁定 id つきの rules 行の値で縛る (C1・C5) CTX2・CTX5
  DR4｜書き手と書きの形 (lock・coalesce・返りの 6 値) を 1 本のまま使い、 新しい書き手も新しい unit も足さない CTX3・CTX5
  DR5｜台帳 client の場所を器が見える宣言と引数で受け、 env を読まない (C2.2・C10.2) CTX4・CTX5
  DR6｜tick の判定・rc・字と局面の出力の読み手を変えず、 足すものの前に消すもの (便を回さない置き場で口を手で撃つ手番) を名指す (C17.2) CTX1・CTX3・CTX5
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 時計は毎回、 台帳と main の目印を file の目印と比べ、 file が在って読めること・裁定した 300 秒が経ったこと・どちらかの目印が違うことなどが全部そろった回だけ、 今と同じ書き手で作り直しを 1 回撃ち、 撃った記録に時刻と結果を 1 行残します。 時計の結果の字は変えません。 道具の場所は時計の新しい flag と host の設定 file で渡し、 時計を入れる口・外す口・確かめる口 (doctor) も同じ flag を受けます。 支える要件は 7 つで、 そのうち 3 つは要件書の字を別の改訂で直します。
  採用 — OPT1
  管理 tick SHALL 1 周の判定・打刻・部分の書き直しの後に、 次を全部満たす周だけ局面の出力の全部の書き直しを 1 回撃つ: manifest を読めて target の登録 row が在る・置き場の出力が在って読める (無いか読めない周は撃たず出力を作らない)・tick の manifest (--rules の写しか埋め込み) に rules 行 lifecycle.full_min_s が在る・今が出力の full_at と撃った記録の ts の新しい方から lifecycle.full_min_s 秒以上後 (full_at が null か読めない周は 0 と読み、 記録が無いか読めない周は記録を数えない)・登録 row の anchor の台帳の印か main の sha が出力の inputs.ledger か inputs.main と等しくない。 比べは値の等しさだけで bd も git も撃たず、 どちらかの印を読めない周は撃たず、 event log の印は比べない。 撃つのは口 fleet lifecycle write と同じ書き手 1 本で、 観測の 1 周を撃ち、 撃った時の印より古くない出力には書かず (coalesce)、 lock は待たずに Busy で返る。 repo は登録 row の anchor、 台帳 client は seat tick の新しい flag --bd B (無ければ bd) である。 撃った周は返りの 6 値に依らず、 置き場の fleet/lifecycle.tick を 1 行 ts=<epoch 秒> wrote=<返りの語> で一時 file から rename して書き、 撃たない周は書かない。 記録を読むのは管理 tick の下限の判定だけである。 管理 tick の rc・判定行・stderr は撃った周も撃たない周も変えない。 rules 行 lifecycle.full_min_s (kind 1 つ・形 Int・値 300 秒・裁定の字 user 2026-10-01T15:27Z・裁定 id s2-07l.738.42.3:20261001T1527Z-1) を足す。 host の面の表 [[tick]] SHALL 任意の key bd (台帳 client の絶対 path) を受け、 必須の key は unit-dir と binary のままとする。 unit の導出 SHALL bd を受けた周だけ service の ExecStart の末尾 (--rules F の後) に --bd <path> を載せ、 受けない導出の 2 file は今と同じ bytes とする。 席の起動は面の bd を導出に渡し、 seat tick install と uninstall は [--bd B] を受け (面は読まない)、 doctor は --unit-dir と --binary がそろった周だけ --bd を受け、 flag の組か面の組の一方を丸ごと使って欄ごとに混ぜない。 器は台帳 client の場所を env・home・自分の実行 file の場所・PATH の探索から解かず、 在るかも確かめない (C2.2)。 消すのは、 便を回さない置き場で古い出力を直すために全部を書き直す口を手で撃つ手番である (C17.2)。 本 ADR は ADR-1088 の決定 (3) のうち管理 tick の周を部分の書き直しに限り台帳も git も撃たないとする句を、 この条件つきの全部の書き直しの分だけ置き換え、 ADR-1064 の 3 句 (表 [[tick]] の欄を 2 つとする句・doctor の flag が勝つ句・席の起動が面の値で install を撃つ句) を key bd を足した形に、 ADR-1058 が pointer で戻した unit の形の 2 句 (ExecStart の固定の形・install と uninstall の口の引数) を --bd を受ける形に改める。 ほかの契機・書き手・部分の書き直し・印の読みと順の比べ・古さの印・読み手・tick の判定の列は変えない。 FR1090・FR1027・FR1064・AC1060 の字の直しは別の SRS の round が持つ。
  （平易）時計 (管理 tick) は、 毎回の判定と一部の書き直しの後に、 次が全部そろった回だけ、 局面の出力の作り直しを 1 回撃ちます: 席の登録が在る・file が在って読める・時計の読む規則の表 (rules) に間隔の行が在る・前の作り直しと前の試みの新しい方から 300 秒が経った・台帳か main の目印が file の目印と違う。 目印は小さい file を読むだけで取り、 台帳の道具も git も撃たず、 出来事の log の長さは比べません。 撃つのは今の作り直しの口と同じ書き手で、 file が既に新しければ書かず、 使用中なら待たずに次へ回します。 撃った回は結果に依らず撃った記録に時刻と結果の語を 1 行残し、 次の試みの間隔の判定だけがそれを読みます。 時計の結果の字は変えません。 間隔の値 300 秒は user の裁定です。 台帳を読む道具の場所は、 時計の新しい flag で受け、 host の設定 file の時計の表に任意の key で宣言でき (必須の key は 2 つのまま)、 受けた時計だけが起動の行の末尾 (規則の表の写しの指定の後) にそれを載せ、 受けない時計は今と 1 byte も変わりません。 席の起動は設定 file の key を渡し、 時計を入れる口と外す口は同じ flag を受けて設定 file を読まず、 確かめる口 (doctor) は時計の dir と本体の場所の flag がそろった時だけ受け、 flag の組か設定 file の組の一方を丸ごと使って混ぜません。 器は道具の場所を環境変数・home・自分の場所・PATH の探索から解かず、 在るかも確かめません。 消すのは、 便を回さない置き場で古い file を直すために口を手で撃つ手番です。 置き換えるのは、 ADR-1088 の時計の回は一部だけを書き直すとした句、 ADR-1064 の 3 句 (時計の表の欄を 2 つとした句・確かめる口が flag を優先する句・席の起動が時計を入れる句)、 ADR-1058 が戻した 2 句 (時計の起動の行の固定の形・時計を入れる口と外す口の引数) で、 それ以外は変えません。
  （理由）等しさで比べるのは、 動いたかどうかは等しさで分かり、 目印の読みが小さい file の読みだけで済むからです。 前後関係の比べは git を撃ち、 古い書きは書き手が自分で捨てます。 出来事の log の長さを比べないのは、 それが席や便の動く間ほぼ毎回伸び、 比べると台帳が動かなくても 300 秒ごとに重い作り直しを撃つからで、 出来事の log と時刻で決まる部分は一部の書き直しが既に持っています。 間隔を置くのは、 作り直しが 1 回 4 秒から 14 秒かかり、 台帳は席が動く間数秒ごとに動くからで、 間隔を規則の表 (rules) の行に置いて user の裁定を取ったのは、 閾値に裁定を求める憲法の線に沿うためです。 今の書き手を使うのは書き手を増やさないためで、 時計の中から撃つのは、 席ごとに時計を 1 組持つ形を保つためです (専用の時計を足す案との違い)。 口を子の process として撃たずに時計の中で書き手を呼ぶのは、 口の出力が 4 つの結果で同じ字を出し、 子では撃った記録に残す 6 つの結果の語を得られないからで、 代わりに撃つ回の時計は約 275 MB と数秒から十数秒を抱え、 書き手の異常終了は時計の異常終了になります。 道具の場所を host の設定 file の宣言と flag で受けるのは、 systemd の時計からは素の bd が見えず (実測)、 器は環境変数を読まず host ごとの値を設定 file と引数にだけ置くからです。 時計を入れる口と外す口に設定 file を読ませないのは、 設定 file を書き換えた前後でも同じ引数で古い時計を外せるようにするためで、 確かめる口が組を混ぜないのは、 flag で入れた時計を flag の組で確かめられるようにするためです。 読む側の手順や systemd の環境の file に任せると、 器が測れない文章の決まりになります。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1090（claim）: FR1090 (局面の出力) の全部の書き直しの契機に、 管理 tick の周のうち本 ADR の条件を満たす周を足すと主張する。 管理 tick の周の部分の書き直しが台帳も git も撃たない字はそのまま残す (字の直しと AC1060 の契機の数え方の直しは SRS の round)。
  FR1027（claim）: FR1027 (管理 tick) の「管理 tick の周は局面の出力の部分の書き直しの契機である」に、 条件を満たす周の全部の書き直しを足すと主張する。 alarm を置き場の file だけで決める字 (台帳も git も撃たない) は変えない (字の直しは SRS の round)。
  FR1064（claim）: FR1064 (管理 tick の駆動) の unit の導出の入力に、 host の面か install の口の引数が渡す台帳 client の path を足し、 受けない導出の unit は変えないと主張する (字の直しは SRS の round)。
  FR1057（rationale）: FR1057 (host の面) の、 host 固有の宣言値を host の面 1 file だけから読み、 schema 外の項目を行番号つきで断る形を保ち、 台帳 client の path をその面の表 [[tick]] の任意の key に置く。
  FR1017（rationale）: FR1017 (rules manifest) の、 規則の種類を閉じた enum に持ち値を manifest から読む形を保ち、 下限を rules 行 1 本と kind 1 つで足す。
  FR1094（rationale）: FR1094 (局面の出力の読み手) の約束は変えない。 全部の書き直しの出力は同じ 1 file で、 読み手は今までどおり印を比べて古さを示す。
  NFR1004（rationale）: NFR1004 (fail-closed) を保つのは撃つ周に限る。 撃つ周は返りに依らず撃った記録を書き、 台帳 client が見つからない周は書き直さずに出力へ読めない印 (理由 ledger) を付けて記録に wrote=unreadable を残す。 印を読めない周・出力が無いか読めない周・rules 行の無い周は、 管理 tick が記録を残さずに黙って撃たない (tick の rc と字も変えない・CSQ-N9)。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この決定が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この決定は 3 つの決定 (ADR) を部分的に置き換えます。 ADR-1088 からは、 時計の回は台帳も git も読まず一部だけを書き直すとした句を、 条件つきの作り直しの分だけ置き換えます。 ADR-1064 からは、 host の設定 file の時計の表の欄を 2 つとした句と、 確かめる口が flag を優先する句と、 席の起動が時計を入れる句を、 道具の場所の key を足した形に改めます。 ADR-1058 からは、 前の決定 ADR-1030 から参照の形で戻した時計の起動の行の固定の形と、 時計を入れる口・外す口の引数を、 末尾に道具の場所を載せうる形に改めます (ADR-1030 そのものは既に別の決定に置き換えられていて、 参照するだけです)。 ほかはそのまま保ちます。 原則は、 周期の見張りは毎回軽い目印の等しさだけを見て、 重い読みは目印が動いた回に裁定した間隔より密には撃たず、 その読みに要る道具の場所は器が見える宣言で受ける、 です。
  改訂状態: current
  置き換える ADR: ADR-1088, ADR-1064, ADR-1058
  置き換えられた: なし (現行)
  部分 supersede を 3 つ持つ。 ADR-1088 から置き換えるのは決定 (3) のうち、 管理 tick の周は台帳も git も撃たず event log と時刻で決まる部分だけを書き直すとする句の、 管理 tick の周の分だけである。 管理 tick の周は今までどおり部分の書き直しを撃ち、 それに加えて本 ADR の条件を満たす周だけ全部の書き直しを 1 回撃つ (その全部の書き直しは台帳を bd で、 main を git で読む)。 発話と仕分けの記帳の直後の部分の書き直し、 全部の書き直しのほかの契機・書き手・lock・coalesce・返りの値・入力の印と順の比べ・古さの印の付け方と消し方・読み手の約束・版の欄は変えない。 ADR-1064 から置き換えるのは 3 つの句である。 表 [[tick]] の欄を unit-dir と binary の 2 つとする句は、 既知の key を任意の bd を足した 3 つにし、 必須の key は 2 つのままとする形に改める。 doctor の flag が勝つ句は、 flag の組 (--unit-dir・--binary・任意の --bd) か面の組 (unit-dir・binary・bd) の一方を丸ごと使い、 欄ごとに混ぜない形へ bd まで延ばす。 席の起動が面の値で install を撃つ句は、 面の bd も導出に渡す形に広げる。 行が 0 か 1 であること・2 つの欄の形と断り方・tracked の面の断り・install の断りが起動の rc を変えないこと・host の行の tick=declared が値を書かないこと・init が面の本文を写すことは変えない。 ADR-1058 から置き換えるのは、 ADR-1045 が丸ごと superseded した ADR-1030 から pointer で戻した unit の形のうち 2 つの句だけである。 service の ExecStart の固定の形 (ADR-1030 §2.1 が定め、 今は <binary> seat tick --state-dir S --target S:W と、 rules の写しを受けた周だけ末尾の --rules F) は、 bd を受けた導出だけ末尾 (--rules F の後) に --bd <path> を載せる形に改め、 install と uninstall の口は [--bd B] を受ける。 bd を受けない導出の 2 file は今と同じ bytes で、 timer は bd に依らず、 unit が Environment=・WorkingDirectory=・%h を持たないこと、 器が env・home・自分の実行 file の場所を読まないこと、 unit の名・書き (器の印の無い file を上書きしない)・有効化・撤去は変えない。 ADR-1058 のほか (管理 tick の判定の列・打刻の合図と backoff・rules 行) も変えない。 ADR-1030 は superseded のままで、 本 ADR は参照するだけで置き換えない。 ADR-1064 自身の射程の句 (導出・seat tick install と uninstall の口と引数・既存の表の形・rules 行を変えないとする句) は、 本 ADR が変える所 (ExecStart の末尾の --bd・口の --bd・表の key bd・rules 行 lifecycle.full_min_s) でだけ古くなる (ADR-1058 が ADR-1055 の記述の一部を古くしたのと同じ読み)。 ADR-1026 の host の面は置き場ごとの 1 file のままで、 表 [[tick]] の key が 1 つ増える。
