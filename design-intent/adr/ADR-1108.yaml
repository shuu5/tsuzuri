  本 ADR が event log の印の比べ・順の比べ・消費側の手順・専用の unit・下限なしと code の定数・子 process・host の env を退け、 印の等しさと rules 行の下限と台帳 client の宣言を選んだのは、 この原則に行き着く (これ以上は遡らない照会終端)。
options:
  - id: "OPT1"
    name: "管理 tick が印を等しさで比べ、 rules 行の下限を空けて既存の書き手 1 本を撃ち、 台帳 client の場所は宣言で渡す"
    text: |
      管理 tick の周の終わりに、 登録 row の anchor の台帳の印と main の sha を出力の inputs と等しさで比べ、 どちらかが違い、 出力の full_at と撃った記録（試した時刻の記録）の新しい方から rules 行 lifecycle.full_min_s 秒が経った周だけ、 口 fleet lifecycle write と同じ書き手 1 本を lock を待たずに撃ち、 記録に 1 行残す。 台帳 client は seat tick の --bd と host の面の表 [[tick]] の任意の key bd で渡し、 宣言を受けた unit の ExecStart だけが末尾に --bd を持つ。 決め手は実測の費用と軽い印の読み (CTX2・CTX4) と頼みの遅れの条件 (CTX1)。
      （平易）時計 (管理 tick) が毎回、 台帳と main の目印を file の目印と比べ、 どちらかが違い、 前の作り直しと前の試みの新しい方から 300 秒が経った回だけ、 今と同じ書き手で作り直しを 1 回撃ちます。 書き手が使用中なら待たずに次へ回し、 撃った記録に 1 行残します。 台帳を読む道具の場所は、 時計の新しい flag と host の設定 file の key で渡し、 受けた時計だけが起動の行の末尾にそれを持ちます。 便を回さない置き場でも変化が数分で file に入り、 変化の無い回は小さい file を読むだけで済み、 作り直しは 300 秒に 1 回までで、 書き手も時計も増えず、 器は環境変数を読みません。 時計を入れる口と外す口は引数だけで組むので、 設定 file を書き換えた前後でも同じ引数で古い時計を外せ、 確かめる口は flag で入れた時計を flag の組で確かめられます。 時計の結果の字と file の読み手は変わらず、 file を直すために口を手で撃つ手番も消えます。 代わりに、 最長で 300 秒と時計の周期の和の遅れがあり、 席が動く間は台帳がよく動くので 300 秒ごとに 4 秒から 14 秒の作り直しが掛かり、 その間はほかの書き手が待つか飛びます。 撃つ回の時計は約 275 MB と数秒から十数秒を抱え、 書き手が異常に終われば時計も異常に終わります。 失敗した回も次の試みは 300 秒後になり、 1 つの置き場に repo の違う席が在ると作り直す repo が入れ替わりえ、 道具の場所を宣言せず時計の PATH にも bd が無い host では作り直しが台帳を読めないまま残り、 時計が既に在る host で設定 file に道具の場所を足すには、 古い引数で時計を外してから入れ直す順が要り、 設定 file に道具の場所を書くのは本体を新しい版に入れ替えた後になります。
      利点: 便を回さない置き場でも、 台帳か main の変化が最長で下限と tick の周期の和の後に出力に入る (DR1)
      利点: 印が動かない周は小さい file の読みと等しさの比べだけで、 bd も git も撃たない (DR2)
      利点: 重い書き直しは下限ごとに 1 回までで、 下限の値は裁定 id つきの rules 行が持つ (DR3)
      利点: 書き手・lock・coalesce・返りの 6 値は既存の 1 本のままで、 新しい unit も書き手も足さない (DR4)
      利点: 台帳 client の場所は host の面の宣言と引数で器に見え、 器は env を読まない (DR5)
      利点: install と uninstall は引数だけで導出するので面の書き換えの前後でも同じ引数で古い unit を外せ、 doctor は flag で入れた unit を flag の組で確かめられる (DR5)
      利点: tick の rc と字と読み手は変わらず、 便を回さない置き場で口を手で撃つ手番が消える (DR6)
      欠点: 台帳か main の変化が出力に入るまで、 最長で下限と tick の周期の和 (今の値で 300 秒と 15 秒) かかる
      欠点: 席が動く間は台帳がよく動くので、 全部の書き直しは 300 秒ごとに 1 回 4〜14 秒かかる
      欠点: 書き直しの間 (空いた host で約 4 秒・gate が走る host で約 14 秒) は lock を持つので、 ほかの書き手は待つか Busy で飛ぶ
      欠点: 撃つ周は tick の process が書き直しを抱え、 最大 RSS 約 275 MB を持ち、 1 周が 4〜14 秒延びる。 書き手が panic すると tick が異常に終わり、 rc を変えない約束の外になる
      欠点: 撃った記録は返りに依らず書くので、 Busy や Unreadable で終わった周も次の試みは下限の後になる
      欠点: 1 つの置き場に anchor の違う席が 2 つ以上在ると、 tick ごとに違う repo の印と比べ、 下限ごとに違う repo で書き直しうる
      欠点: 台帳 client を宣言せず timer の PATH にも bd が無い host では、 撃った記録が wrote=unreadable のままになる
      欠点: unit の既に在る host で面に bd を足すと導出の bytes が変わるので、 古い引数での uninstall から入れ直す順が要る
      欠点: 古い binary は面の key bd と flag --bd を断るので、 面に bd を書くのは binary を新しい版に入れ替えた後になる
    verdict: adopted
    reason: "決め手は実測の費用と軽い印の読み (CTX2・CTX4) と頼みの遅れの条件 (CTX1)。"
  - id: "OPT2"
    name: "event log の印も比べる"
    text: |
      台帳と main の印に加えて、 出力の inputs.events (event log の長さ) も今の長さと比べ、 違えば全部を書き直す。 決め手は event log の伸び方と部分の書き直しの受け持ち (CTX2・CTX3)。
      （平易）台帳と main に加えて、 出来事の log (event log) の長さも file の目印と比べる案です。 3 つの目印を全部比べるので形がそろい、 長さも 1 file の大きさを見るだけで取れる点で勝ります。 けれども、 出来事の log は席や便が動く間ほぼ毎回伸びるので、 台帳も main も動かない間も 300 秒ごとに 4 秒から 14 秒の作り直しを撃ち続けます。 選んだ案でこの費用が掛かるのは、 台帳か main が動いた間だけです。 出来事の log と時刻で決まる部分は、 すでに一部の書き直しが毎回書いています。
      利点: 出力が持つ入力の印 3 つを全部比べるので、 比べの形が対称で、 どの入力が動いた周も全部の書き直しで揃う
      利点: event log の長さも 1 file の大きさの読みで取れ、 bd も git も撃たない
      欠点: event log は席と便が動く間ほぼ毎周伸びるので、 台帳も main も動かない間も下限ごとに 1 回 4〜14 秒の書き直しと lock を使う。 OPT1 でこの費用が掛かるのは台帳か main が動いた間だけである (DR2・DR3)
      欠点: event log と時刻で決まる部分は、 既に部分の書き直しが毎周書いている (DR4)
    verdict: rejected
    reason: "決め手は event log の伸び方と部分の書き直しの受け持ち (CTX2・CTX3)。"
  - id: "OPT3"
    name: "印を順 (git の祖先の関係) で比べる"
    text: |
      等しさでなく、 今の印が出力の印より新しいかを順で比べ、 新しい周だけ撃つ。 main の順の比べは git を撃つ。 決め手は比べの費用と書き手の受け持ち (CTX2・CTX3)。
      （平易）目印が違うかどうかでなく、 今の目印が file の目印より新しいかを git の前後関係で比べる案です。 目印が古い側へ戻った回を動いたと数えず、 書き手が捨てるだけの作り直しを撃たずに済み、 書き手と同じ判じ方になる点で勝ります。 けれども、 main の目印が違う間、 この比べを 300 秒の判定より前に置くと時計の回ごと (今は 15 秒ごと) に git を撃つことになり、 毎回の比べが軽くなくなります (判定の後に置けば撃つ回だけです)。 動いたかどうかは等しさで足り、 古い書きは書き手が自分で捨てるので、 同じ比べを時計に写すだけになります。
      利点: 印が古い側へ戻った周 (順で古い印) を動いたと数えず、 書き手が捨てるだけの書き直しを撃たない
      利点: 書き手が lock の中で古い書きを捨てる判じ方と同じ順の読みになる
      欠点: main の印が違う間、 順の比べを下限の判定より前に置くと tick の周 (今の値で 15 秒) ごとに git を撃ち、 毎周の比べが軽くなくなる。 下限の判定の後に置けば git は撃つ周だけになる (DR2)
      欠点: 「動いた」は等しさで足り、 順は書き手が lock の中で比べて古い書きを捨てる (Discarded) ので、 tick の側に同じ比べを写すだけになる (DR4)
    verdict: rejected
    reason: "決め手は比べの費用と書き手の受け持ち (CTX2・CTX3)。"
  - id: "OPT4"
    name: "消費側が口 fleet lifecycle write を周期で撃つ手順にする"
    text: |
      器は変えず、 局面の出力を読む消費側の project が、 自分の timer か手順で全部を書き直す口を周期で撃つ。 決め手は N2 と器が測れるか (CTX1・CTX5)。
      （平易）器は変えず、 file を読む側の project が自分の時計や手順で作り直しの口を周期で撃つ案です。 器に code も規則の表 (rules) の行も足さず、 読む側が周期と置き場を選べる点で勝ります。 けれども、 文章の手順にしか無い決まりで、 器は撃たれたかも周期も測れず、 守られなかった回も見えません。 読む側ごとに同じ時計と手順を持ち、 置き場が増えるたびに写す手が要り、 道具の場所の問題もそのまま残ります。
      利点: 器に code も rules 行も足さず、 口は既に在る
      利点: 消費側が要る周期と置き場を自分で選べる
      欠点: 散文の手順にしか無い規則で、 器は撃たれたかも周期も測れず、 守られなかった周も見えない (N2・DR6)
      欠点: 消費側ごとに同じ timer と手順を持ち、 便を回さない置き場が増えるたびに写す手が要る (DR4)
      欠点: 消費側の timer にも台帳 client の場所の問題が同じ形で残る (DR5)
    verdict: rejected
    reason: "決め手は N2 と器が測れるか (CTX1・CTX5)。"
  - id: "OPT5"
    name: "書き直し専用の timer unit を足す"
    text: |
      管理 tick と別に、 置き場ごとに全部の書き直しだけを周期で撃つ systemd の unit を器が導出して入れる。 決め手は unit の数と既存の形 (CTX3・CTX4)。
      （平易）時計とは別に、 置き場ごとに作り直しだけを周期で撃つ専用の時計 (systemd の unit) を器が入れる案です。 作り直しの周期を時計と別に決められ、 時計の 1 回を重くせず、 時計の判定に手を入れない点で勝ります。 けれども、 置き場ごとに 2 本目の時計が要り、 席ごとに時計を 1 組持つ今の形を崩し、 入れる・外す・確かめるの手間が倍になります。 目印の比べと間隔はどちらにも要り、 道具の場所の問題も残ります。
      利点: 書き直しの周期を tick の周期と別に決められ、 tick の 1 周を重くしない
      利点: tick の判定の列と 1 周の流れに手を入れない
      欠点: 置き場ごとに 2 本目の unit が要り、 席ごとに service と timer を 1 組持つ今の形 (ADR-1058・ADR-1064) を崩す (DR4)
      欠点: unit の導出・入れ・撤去・doctor の一致の行が倍になり、 印の比べと下限は結局どちらにも要る (DR4)
      欠点: 2 本目の unit にも台帳 client の場所の問題が同じ形で残る (DR5)
    verdict: rejected
    reason: "決め手は unit の数と既存の形 (CTX3・CTX4)。"
  - id: "OPT6"
    name: "下限を持たないか、 下限を code の定数で持つ"
    text: |
      印が違えば tick の毎周に撃つ (下限なし)、 または下限を rules 行でなく code の定数にする。 決め手は実測の費用と C5 (CTX2・CTX5)。
      （平易）目印が違えば時計の毎回に撃つ (間隔を持たない)、 または間隔を規則の表 (rules) の行でなく code の定数で持つ案です。 間隔が無ければ台帳の変化が次の回 (今は 15 秒) で file に入り、 code の定数なら規則の表の行も裁定も要らない点で勝ります。 けれども、 台帳は席が動く間数秒ごとに動くので、 間隔が無いと時計の回ごとに数秒から十数秒の作り直しと鍵 (lock) の持ちが続き、 ほかの書き手が飛び続けます。 code の定数は裁定を通らない値で、 決まりの値に裁定を求める憲法の門を逃れます。
      利点: 下限が無ければ、 台帳の変化が次の tick の周 (今の値で 15 秒) で出力に入る
      利点: code の定数なら、 rules 行と裁定 id が要らず、 足す物が減る
      欠点: 台帳は席が動く間数秒ごとに動くので、 下限が無ければ tick の周ごとに 4〜14 秒の書き直しと lock が続き、 ほかの書き手が Busy で飛び続ける (DR2・DR3)
      欠点: code の定数は裁定を通らない閾値で、 C5 の門を逃れる (DR3)
    verdict: rejected
    reason: "決め手は実測の費用と C5 (CTX2・CTX5)。"
  - id: "OPT7"
    name: "管理 tick が口 fleet lifecycle write を子 process で撃つ"
    text: |
      tick の周に、 器自身の口 fleet lifecycle write を子 process として撃ち、 書き手を直に呼ばない。 決め手は読みの同一性と結果の受け取り方 (CTX3)。
      （平易）時計が、 器自身の作り直しの口を別の process として撃つ案です。 口の目印の先読みや結果の字をそのまま使えて足す code が少なく、 作り直しの失敗が時計に及ばない点で勝ります。 けれども、 口の出力は、 書いた・同じだった・重ねた・捨てたの 4 つの結果で同じ字なので、 撃った記録に残す 6 つの結果の語を子の出力から得られません。 記録が 3 つの状態に縮むか、 口の出力の形を変えることになります。
      利点: 口の印の先読み・coalesce・字の形をそのまま使え、 tick に足す code が少ない
      利点: 書き直しが tick と別の process で走るので、 書き直しの失敗が tick の process に及ばない
      欠点: 口の出力は返りの 4 つ (Written・Unchanged・Coalesced・Discarded) で同じ字なので、 撃った記録の 6 つの語を子の出力から得られず、 記録が 3 つの状態に縮むか、 口の出力の形を変えることになる (CTX3・DR4・DR6)
    verdict: rejected
    reason: "決め手は読みの同一性と結果の受け取り方 (CTX3)。"
  - id: "OPT8"
    name: "systemd の user の env (environment.d) で PATH に台帳 client を足す手順にする"
    text: |
      器は変えず、 host ごとに systemd の user の環境の設定 file で PATH に bd の dir を足し、 tick の unit が素の bd を見つけるようにする。 決め手は C2.2 と器が見えるか (CTX4・CTX5)。
      （平易）器は変えず、 host ごとに systemd の環境の file (environment.d) で道具の dir を探し先 (PATH) に足し、 時計が素の bd を見つけるようにする案です。 器に flag も key も足さず、 host に 1 file を置けば時計の全部とほかの unit にも効き、 今の時計の中身が変わらないので、 時計を外して入れ直す手番も、 本体を先に入れ替える順も要らない点で勝ります。 けれども、 器は環境変数を読まないので、 PATH に何が在り、 どの bd が撃たれるか (PATH の順で決まります) は器から見えず、 host ごとの値が設定 file の外に置かれます。 host に置く file は文章の手順にしか無い前提で、 器の宣言になりません。
      利点: 器に flag も key も足さず、 host に 1 file を置けば tick の unit の全部で bd が見つかる
      利点: systemd の user のほかの unit にも同じ PATH が効く
      利点: 今の unit の bytes が変わらず、 uninstall から入れ直す手番も、 binary を先に入れ替える順も要らない (OPT1 の CSQ-N6・CSQ-N7 の費用が無い)
      欠点: 器は env を読まないので、 PATH に何が在り、 どの bd が撃たれるか (PATH の順で決まる) は器から見えず、 host 固有の値が host の面の外に置かれる (C2.2・C10.2・DR5)
      欠点: host に置く file は散文の手順にしか無い host の前提で、 器の宣言にならない (N2・DR6)
    verdict: rejected
    reason: "決め手は C2.2 と器が見えるか (CTX4・CTX5)。"
