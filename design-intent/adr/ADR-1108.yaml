retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この決定で「器」は scribe2 の本体、 「席」は器が立てる対話の AI の session、 「便」は契約 1 本を実装して main へ入れる 1 回の走り、 「台帳」は作業と裁定を記録する beads です。 器は、 仕事の一つ一つが今どこにいるか (局面) を置き場ごとに 1 つの file (局面の出力) に書き、 画面や知らせはそれを読みます。 この file を丸ごと作り直す (全部の書き直し) のは、 便を回す周・器が台帳を書いた直後 (着地の終わりなど)・作り直しの口を撃った時だけなので、 便を回さない置き場では、 台帳が変わっても file が古いまま残ります。 この決定は、 席を周期で見ている時計 (管理 tick) が、 台帳と main の小さな目印だけを毎回 file の目印と比べ、 違っていて前の作り直しから 300 秒 (規則の表 (rules) の値・user の裁定) が経った回だけ、 今と同じ書き手で作り直しを 1 回撃つと決めます。 時計からは台帳を読む道具 (bd) が見えないので、 その場所は時計の flag と host ごとの設定 file の宣言で渡し、 宣言を受けた時計だけが起動の行の末尾にそれを持ち、 器は環境変数を読みません。
approval:
  who: 持ち主
  date: 2026-10-02
  ruling: "s2-07l.738.42.3:20261001T1527Z-1・s2-07l.738.42.3（器の台帳の id・器の記録の承認の欄が名指す・取り込みの裁定 t3-hub.74.60.1:20261004T0113Z-1）"
  verbatim: "器の台帳 s2-07l.738.42.3:20261001T1527Z-1・s2-07l.738.42.3 の notes に在る（この file に写さない）"
  surface: R-8
consequences:
  - "この判断で良くなること 5 つと、 代わりに引き受けること 9 つです。 良くなるのは、 便を回さない置き場でも変化が数分で file に入ること、 変化の無い回は軽い読みだけで済むこと、 書き手も時計も増やさないこと、 道具の場所が器に見えて宣言の無い host の時計は 1 byte も変わらないこと、 file を直すために口を手で撃つ手番が消えることです。 引き受けるのは、 最長で 300 秒と時計の周期の和の遅れ、 作り直しの間ほかの書き手が待つか飛ぶこと、 失敗した回も次の試みが 300 秒後になること、 1 つの置き場に repo の違う席が在ると作り直す repo が入れ替わりうること、 道具の場所を宣言せず時計の PATH にも bd が無い host では作り直しが台帳を読めずに終わり file に読めない印が付くこと、 古い本体が設定 file の新しい key と新しい flag を断るので入れ替えの順が要ること、 時計が既に在る host で設定 file に道具の場所を足すと時計を外して入れ直す順が要ること、 撃つ回の時計が約 275 MB と数秒から十数秒を抱え、 書き手の異常終了が時計の異常終了になること、 目印か間隔の行を読めない置き場では時計が何もせず何も残さず、 file はほかの契機でしか新しくならないことです。"
  - "良い結果: 便を回さない置き場でも、 台帳か main の変化が最長で下限と tick の周期の和の後に局面の出力に入り、 出力を読む画面が古いまま残らない"
  - "良い結果: 印が動かない周は小さい file の読みと等しさの比べだけで、 bd も git も撃たない"
  - "良い結果: 書き手・lock・coalesce・返りの 6 値・読み手は既存のままで、 新しい書き手も新しい unit も足さない"
  - "良い結果: 台帳 client の場所は host の面の宣言で器に見え、 宣言の無い host の unit は 1 byte も変わらない"
  - "良い結果: 便を回さない置き場で、 古い出力を直すために口を手で撃つ手番が消える"
  - "代償: 台帳か main の変化が出力に入るまで、 最長で下限と tick の周期の和 (今の値で 300 秒と 15 秒) かかる"
  - "代償: 書き直しの間 (空いた host で約 4 秒・gate が走る host で約 14 秒) は lock を持つので、 ほかの書き手は待つか Busy で飛び、 飛んだ分は次の周が拾う"
  - "代償: 撃った記録は返りに依らず書くので、 Busy や Unreadable で終わった周も次の試みは下限の後になる"
  - "代償: 1 つの置き場に anchor の違う席が 2 つ以上在ると、 tick ごとに違う repo の印と比べ、 下限ごとに違う repo で書き直しうる (判じ方は後の行)"
  - "代償: 台帳 client を宣言せず timer の PATH にも bd が無い host では、 台帳が動いた周の撃った記録が wrote=unreadable で、 出力は理由 ledger の読めない印を持つ (印は次に全部の入力を読めた全部の書き直しが消す)。 宣言した path が在るかは器が確かめず、 違う path も同じ記録で見える"
  - "代償: 古い binary は表 [[tick]] の key bd を未知の key として断り、 前の版の seat tick は --bd を未知の引数として断る (timer の毎周が落ちる) ので、 面に bd を書くのは PATH の binary と面の binary を新しい版にした後になる"
  - "代償: unit の既に在る host で面に bd を足すと導出の bytes が変わるので、 席の起動の install は unit-exists で断り、 doctor の面の組は foreign を名乗る。 古い引数で uninstall し、 面に bd を足し、 席を起こし直すか --bd つきで install する順が要る"
  - "代償: 撃つ周は tick の process が書き直しを抱え、 最大 RSS 約 275 MB を持ち、 1 周が 4〜14 秒延びる。 書き手が panic すると tick が異常に終わり、 rc を変えない約束の外になる"
  - "代償: 登録 row の anchor の台帳の印か main の ref を読めない置き場と、 tick の manifest に rules 行 lifecycle.full_min_s の無い置き場では、 管理 tick は撃たず何も記録しない (撃たない形の fail-closed)。 その置き場の出力は、 ほかの契機の全部の書き直しでしか新しくならない"
