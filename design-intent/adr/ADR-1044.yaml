  器の案の章の要約: 候補を 5 つ並べます。決定はしごを憲法の条にして機械の面は既存のものを指す案、ponytail を skill や散文として注入する案、はしごの段を型で宣言させて gate が形を検査する案、条に対応する規則の行を 1 本足す案、そして何もしない案です。
  器の専門語の説明: 本文に出てくる専門語を、やさしい言葉で説明します。
  ・決定はしご（decision ladder）: 変更を書く前に問う段の列。 要るか → 既に在るか → 標準 library か入っている依存で足りるか → 1 行で書けるか → 最小実装 の宣言順に通り、 最初に成立した段で止まる。 出所は ponytail (RESEARCH-ponytail §2) で、 本 ADR は憲法の条 C17 として持つ。
  ・段（rung）: 決定はしごの 1 つの問い。 「成立する」とは、 その段の答えで変更が終わること (例: 「既に在る」なら在るものを使って終わる)。
  ・過剰設計の 5 観点（five overdesign findings）: lens が数える閉じた観点のうち delete (消せる面) / stdlib (標準 library で足りる自作) / native (道具の既存機能で足りる作り込み) / yagni (この便が要らない一般化) / shrink (同じ意味のまま縮む面)。 件数は 0 でも書き、 欠けた周は INCONCLUSIVE (台帳 s2-07l.188)。
  ・便の規模の record（run size record）: 便ごとに verdicts の record へ残す size / files / lines / pub_symbols の 4 field。 閾値は持たず、 まず測る (C10・台帳 s2-07l.189)。
  ・delta marker（delta marker）: constitution.html の本文に条文の追加・書換えを残す印 (data-delta-id)。 条の追加は新しい ADR + この印 + 裁定 id の 3 つで行う (N4.2)。 本 ADR の C17 は /folio-architect の段でこの印付きで挿す。
  ・機械の面（machine face）: 憲法 C14 の 2 面のうち、 器が強制する側 (manifest の rules 行や閉じた型と件数)。 対は文書の面 (憲法・ADR・SRS = 人が読み裁定する側)。 C17 は値を持たないので行は無く、 型と件数が機械の面になる。
