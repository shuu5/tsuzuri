consequences:
  - "この判断で良くなることと、代わりに引き受けることです。提案と実装の両方に「先に問う順序」と「足す前に消す」の線が入り、code の変更は 0 で、審査役の予算も増えません。代わりに、「何を消すか」を機械では拒めないこと、条に値が無いので manifest の行を持たず deny の門にするには別の裁定が要ること、条文が効くのは /folio-architect の段の後であることを引き受けます。"
  - "良い結果: 提案 (契約・ADR・設計 §) と実装の両方が同じ順序で問われ、 「足すなら先に消す」が折れない線になる (CTX1 の力学に提案の段で止まる根拠ができる)"
  - "良い結果: code の変更は 0: 機械の面 (lens の 5 観点・便の規模の record) は land 済で、 rules 行・走査・record・機構を足さない"
  - "良い結果: lens の予算 (NFR1001) と便の大きさの目標 (NFR1002) は不変で、 5 観点の件数と母集団は verdict に残り続ける (「0 件」と「未測」の弁別)"
  - "代償: 「先に何を消すかを名指す」は機械では拒めない: 見るのは lens の delete の件数と提案の審査の散文の判断だけで、 はしごを飛ばした提案を CI は止めない (正直に散文の判断と書く)"
  - "代償: 条に値が無いので manifest に行を持たない (C2 / C16 と同じ形)。 後で deny の門 (例: 機構を足す diff で delete が 0 件なら FAIL) にしたいときは、 裁定 id を伴う昇格 (C12.4 / C5) と、 そのときに初めて行 1 本が要る"
  - "代償: 発効は /folio-architect が C17 を delta marker 付きで挿す段の後 (N4.2)。 それまで本 ADR は proposed で何も拘束せず、 constitution.html の件数表記 (16 / 4 / 4) と生成区間 (CLAUDE.md) の改訂も同じ段に付く"
