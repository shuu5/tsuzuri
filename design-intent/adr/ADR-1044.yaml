# 判断の記録 ADR-1044 — 器 scribe2 の判断の記録 ADR-0044 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1044
title: "決定はしごは憲法の条 (C17) で持つ (要るか → 既に在るか → 標準 library か入っている依存で足りるか → 1 行で書けるか → 最小実装 を宣言順に通り最初に成立した段で止まる・走査・record・rules 行・機構を足す提案は先に消すものを名指す・機械の面は既に在る lens の過剰設計 5 観点と便の規模の record で rules 行も機構も足さない)"
status: accepted
date: 2026-09-18
context: |
  器は 11 日で ADR を 43 本、 検出線 1 本を囲む省き方の機構を 5 つ、 同じ日に足して同じ日に消す字面の門を 1 つ積んだ。 ponytail の決定はしご (要るか → 既に在るか → 標準 library か入っている依存で足りるか → 1 行で書けるか → 最小実装) を憲法の条 C17 にし、 足す提案には先に消すものを名指させる。 機械の面は既に在る lens の過剰設計 5 観点と便の規模の record で、 rules 行も機構も足さない。
  なぜこの判断が要るのかを、現物と研究と裁定から説明します。器は 11 日で決定記録を 43 本積み、時間のかかる検査 1 本を囲んで「省く」仕組みを 5 つ重ね、ある日に足した字面の門をその日のうちに消す契約を起こしました。「書く前に、要るか・既に在るかを順に問う」作法（ponytail の決定はしご）は研究で調べ済みで、その機械の面は既に器に在ります。無いのは、その作法を器の折れない線として持つ条文です。
  CTX1 現物 — 器は足す方向にだけ積み上がってきた
  決定記録は decisions/README の表で ADR-1001 (2026-09-07) から ADR-1043 (2026-09-17) まで 11 日で 43 本。 検出線（変異検査 = 時間のかかる検査の行） 1 本 (main 実測 78 分のうち約 75 分・設計 gate-cost.md §5 の実測) を囲んで、 撃たない・持ち越す機構が 5 つ積まれた: 木が同じ周は検出線を撃たない (gate-cost.md §5・ADR-1021 §2.4) / 面に触れた周だけ撃つ (pipeline.md §30) / 追随の再 gate を省く (pipeline.md §33) / 候補の木 1 つに検査 1 回と patch-id の持ち越し (pipeline.md §40・ADR-1039) / 木が同じ周は全段撃たない (gate-cost.md §27・ADR-1043)。 受付の散文走査 (設計 contract-source.md §27 行 aa・台帳 s2-07l.429) は 2026-09-18 に着地し、 同じ日に契約 6 本 (台帳 s2-07l.476 が名指す) を字面で断り、 同じ日にそれを消す契約 (s2-07l.476) が起票された。 どれも個別には筋が通り、 積み重なると器の重さになる。
  CTX2 研究 — ponytail の決定はしごと、 その機械の面は既に器に在る
  RESEARCH-ponytail (2026-09-13) §2: ponytail は「要るか → 既に在るか → 標準 library で足りるか → native で足りるか → 入っている依存で足りるか → 1 行で書けるか → 最小実装」の決定はしごを最初に成立した段で止まる作法で、 強制の仕組みは無く散文の指示だけ。 独立検証では効果は実在するが宣伝値の 1/4〜1/2 (同 §2)。 同 §3 の突合: 段の大半は既に機械の線に対応する (依存 → C13 の allow-list と予算・最小実装 → C4 の大きさの上限・再利用 → 契約の write-set と lens・「最初に成立した段で止まる」→ C2 の宣言順)。 同 §4 の写し方 3 つのうち (1) lens の観点に過剰設計 5 種を足す・(2) 便の規模を record に残す は land 済: 台帳 s2-07l.188 (設計 pipeline.md §17) が lens の findings を閉じた 8 観点 (contract-fit / teeth-nonvacuous / constitution + delete / stdlib / native / yagni / shrink・宣言順・0 件も書く・欠けた周と母集団 0 の周は INCONCLUSIVE) にし、 s2-07l.189 が便の規模 (size / files / lines / pub_symbols・閾値なし) を verdicts の record に残す。 (3) はしごの typed な宣言 は未着手 (schema と SRS の FR を要する)。
  CTX3 裁定 — 決定はしごを憲法に取り込む
  user 裁定 2026-09-18T09:0xZ (対話面・逐語は台帳 s2-07l の notes) は C17 の条文案を採用し、 ADR の草稿を起こしてから /folio-architect の段で条文を渡すと決めた。 同じ日の先行の裁定 (要旨) は、 大整理を「削る側」で行い、 決定はしごを器の設計と提案の両方に当て、 憲法へ取り込むという向きを示している。 研究 §4 の写し方 (1)(2) は既に land しているので、 本 ADR が足すのは条文 1 つだけである。
  CTX4 憲法の向き
  N2 / C1.2 は散文にしか無い規則を規則と認めない (ponytail を skill として注入する形は取れない)。 C14 は規律を文書 (原則と裁定) と data (manifest = 強制する規則) の 2 面で持ち、 C14.2 は値を持つ規則の 2 面の drift を CI が拒む。 C2 は順序を列挙の宣言順で持ち散文の順序を持たない。 C4 / C13 は段の一部を既に deny gate で持つ。 C12.4 は検出線を deny へ昇格するには裁定 id が要ると定める。 A2 / N4.2 は条の追加を「新しい ADR + delta marker + 裁定 id」の手続きに限る。 憲法の順位は「場当たりの修正の禁止 → 増殖の防止 → compile 速度」で、 増殖の防止が 2 番目に在る。
  （選択肢を測るものさし）判断を評価する 5 本のものさしです。散文だけの規則を規則にしないこと、既に在る機械の面を使い新しい仕組みを足さないこと、「要るか」「何を消すか」の判断を機械に肩代わりさせず形と件数だけを機械が持つこと、条の追加の手続きを通ること、審査役の予算と便の大きさを増やさないことです。
  DR1｜散文・記憶・会話にしか無い規則を規則として持たない (注入する skill や prompt の本文は規則ではない) 憲法 N2 / C1.2
  DR2｜既に在る機械の面を使い、 新しい走査・record・rules 行・機構を足さない = 本 ADR 自身が決定はしごの段 2 (既に在るか) で止まる CTX2 / 憲法の順位「増殖の防止」
  DR3｜「要るか」「何を消すか」の判断は機械に肩代わりさせず、 機械が持つのは閉じた型と件数と母集団だけ (散文で判断・機械で形を強制) 憲法 C10 / C3.3 / 研究 §4 の安全側の理由
  DR4｜条の追加は新しい ADR + constitution.html の delta marker + 裁定 id の手続きを通り、 発効は /folio-architect の段 憲法 A2 / N4.2 / C8.3
  DR5｜lens の呼出し回数と token の予算、 便の diff の大きさの目標値を増やさない SRS NFR1001 / NFR1002 / rules 行 gate.lens_count
decision: |
  選んだ案と、それが要件書のどの要件を支えるかを示します。決定はしごを憲法の条 C17（Always）として加え、機械の面は審査役の過剰設計 5 観点と便の規模の記録を指します。規則の行・走査・記録・仕組みは足しません。審査役の判定が 3 値の外や観点欠けで判定不能になること（FR1009）、審査役の予算（NFR1001）、便の大きさの目標（NFR1002）に対応します。
  採用 — OPT1
  憲法 SHALL Always に条 C17 を加える。 条文 (日本語): 「変更を提案・実装するとき、 scribe2 は決定はしごを宣言順に通り (要るか → 既に在るか → 標準 library か入っている依存で足りるか → 1 行で書けるか → 最小実装)、 最初に成立した段で止まる。 走査・record・rules 行・機構を足す提案は、 先に何を消すかを名指す。」 条文 (EARS・生成区間の形): 「C17: WHEN a change is proposed or implemented, scribe2 SHALL pass the decision ladder in declaration order (needed at all, already exists, standard library or an existing dependency suffices, one line, minimal implementation) and SHALL stop at the first rung that holds, and SHALL name what is removed before adding a scanner, record, rules row or mechanism.」 機械の面 SHALL 既に在るものを指す: lens の findings の閉じた category のうち過剰設計の 5 観点 (delete / stdlib / native / yagni / shrink・宣言順・0 件も書く・欠けた周と母集団 0 の周は INCONCLUSIVE・台帳 s2-07l.188・設計 pipeline.md §17) と、 便の規模の record (size / files / lines / pub_symbols・閾値なし・台帳 s2-07l.189)。 本 ADR SHALL NOT rules 行・走査・record・機構を足す (条に値が無く manifest の行を持たない形は C2 / C16 と同じ)。 「先に何を消すかを名指す」 SHALL lens (delete の件数) と提案の審査 (planner / user の対話面) の散文の判断で見るものとし、 機械 SHALL NOT それを拒む。 deny の門への昇格 SHALL 裁定 id を伴う別の裁定 (C12.4 / C5) とする。 発効 SHALL /folio-architect が constitution.html に C17 を delta marker 付きで挿し §2 の一覧表と件数を改めた版 (N4.2) とし、 本 ADR SHALL それまで proposed のまま何も拘束しない。
  （平易）憲法の「いつも守る」段に C17 を足します。中身は「変更を提案するときも作るときも、要るか → 既に在るか → 標準 library か入っている依存で足りるか → 1 行で書けるか → 最小実装、の順に問い、最初に成立した段で止まる。走査・記録・規則の行・仕組みを足す提案は、先に何を消すかを名指す」です。機械が数える面は、審査役がすでに数えている過剰設計の 5 観点と、便の大きさの記録で、新しい行も仕組みも足しません。「何を消すか」の判断は審査役と人に残り、機械では拒みません。条文が効き始めるのは、/folio-architect で憲法の本文に印付きで挿してからです。
  （理由）はしごの段の大半（依存・大きさ・再利用・宣言順）は憲法の既存の線に既に対応していて、無かったのは「要るか」「既に在るか」を先に問う順序そのものと、「足すなら先に消す」の線です。順序と線は値を持たないので、機械の面は閾値ではなく、審査役が数える 5 観点と便の大きさの記録で足ります。この 2 つは研究の写し方 (1)(2) として既に land しているので、条文以外に足すものがありません。行を 1 本足す案は、5 観点の名を型と manifest の 2 か所で持つことになり、はしごの「既に在るか」で止まります。判断（この抽象は要るか・何を消すか）は機械では決められないので、散文の判断に残すと正直に書き、拒む門にしたいときは裁定 id を伴う別の裁定にします。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1009（claim）: C17 の機械の面は lens の 3 値の verdict に乗る: 過剰設計 5 観点の件数か母集団が欠けた周は PASS を名乗らず INCONCLUSIVE (台帳 s2-07l.188) で、 「見ていない」が「穴なし」に化けない。
  NFR1001（claim）: 5 観点は 1 本の lens の中の観点で、 lens の呼出し回数 (rules 行 gate.lens_count) と token の予算を増やさない。
  NFR1002（claim）: 段「最小実装」の測る面は便の規模の record (diff の行数・file 数・新しい pub symbol 数) で、 便の diff の大きさの目標と照合できる (閾値は持たない・C10 はまず測る)。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この ADR が版の系譜のどこに在るかと、判断が最後に行き着く原則です。既存の ADR は 1 本も置き換えません。研究 RESEARCH-ponytail の写し方 (1)(2) を決定として引き取り、(3) は保留のまま残します。行き着く原則は「最初に成立した段で止まり、足す前に消す」です。
  改訂状態: current (accepted・発効 = constitution.html v0.5.0 の C17 / C17.2・delta 差分の印 2026-09-18-001。 条文の正本は憲法で、 本 ADR の条文引用は提案時点の案)
  置き換える ADR: なし (新規)
  置き換えられた: なし (現行)
  憲法 (版 0.4.6) の C1〜C16 / A1〜A4 / N1〜N4 は不変で、 本 ADR は C17 を加えるだけ。 RESEARCH-ponytail §4 の写し方 (1) (lens の観点・台帳 s2-07l.188) と (2) (便の規模の record・s2-07l.189) は本 ADR で決定として引き取り、 (3) (はしごの typed な宣言) は OPT3 として保留 (起こす条件 = C17 の下でも lens の 5 観点の件数が減らない・または提案の段の判断が繰り返し外れると実測で分かったとき)。 ADR-1021 / ADR-1039 / ADR-1043 は CTX1 の現物として引くだけで不変。
  照会終端 — PRIN-STOP-AT-THE-FIRST-RUNG (本 ADR)
  変更は、 要るか → 既に在るか → 標準 library か入っている依存で足りるか → 1 行で書けるか → 最小実装 の順に問い、 最初に成立した段で止まる。 足すものは、 先に消すものを名指してからにする。
  本 ADR の判断はこの原則に行き着く (これ以上は遡らない照会終端)。 憲法の順位の 2 番目「増殖の防止」を、 提案と実装の手順の形で持ったものである。 判断は散文に残し、 機械は形と件数だけを持つ。
options:
  - id: "OPT1"
    name: "決定はしごを憲法の条 C17 にし、 機械の面は既に在る lens の 5 観点と便の規模の record を指す (rules 行も機構も足さない)"
    text: |
      Always の条 C17 を A2 / N4.2 の手続きで加える。 強制する面は台帳 s2-07l.188 / .189 で land 済の閉じた型 (findings の 5 観点・便の規模の 4 field) で、 新しい rules 行・走査・record・機構は足さない。 「先に消すものを名指す」は lens と提案の審査の散文の判断に残す。
      （平易）「上から順に問い、最初に成立した段で止まる」「足すなら先に消すものを名指す」を憲法の条にします。機械が数える面は、審査役がすでに数えている過剰設計の 5 観点と、便の大きさの記録です。新しい規則の行も仕組みも足しません。この ADR 自身が、はしごの「既に在るか」の段で止まっています。
      利点: 条文 1 つで器の設計と提案の両方に効き、 code の変更は 0 (機械の面は land 済)
      利点: 散文の規則にならない (N2): 強制する面は閉じた型と件数と母集団で、 欠けた周は INCONCLUSIVE (FR1009)
      利点: 判断は機械に肩代わりさせず (DR3)、 増殖の防止の順位を条文として持つ
      欠点: 「先に消すものを名指す」は機械では拒めない = lens の delete の件数と審査の散文の判断だけが見る
      欠点: 条に値が無いので manifest の行を持たない (C2 / C16 と同じ形)。 後で deny の門にしたければ裁定 id 付きの昇格が別途要る (C12.4)
    verdict: adopted
    reason: "Always の条 C17 を A2 / N4.2 の手続きで加える。 強制する面は台帳 s2-07l.188 / .189 で land 済の閉じた型 (findings の 5 観点・便の規模の 4 field) で、 新しい rules 行・走査・record・機構は足さない。 「先に消すものを名指す」は lens と提案の審査の散文の判断に残す。"
  - id: "OPT2"
    name: "ponytail を skill / prompt の散文として注入する"
    text: |
      ponytail の配布形そのまま。 散文にしか無い規則は規則ではなく (N2 / C1.2)、 prompt 本文が規範文になる穴 (台帳 s2-07l.176) を広げる (研究 §3 (a))。
      （平易）ponytail をそのまま「読み物」として agent に渡す案です。いちばん手軽ですが、この器は「文章にしか無い規則は規則ではない」と決めているので、守られたかどうかを誰も測れず、prompt の本文が規則になってしまう穴を広げます。
      利点: 導入が最も軽い・ponytail の文面と強度をそのまま使える
      欠点: N2 / C1.2 に反する (散文の規範文)・遵守を測る面が無い・prompt 本文の穴 (s2-07l.176) を広げる
    verdict: rejected
    reason: "ponytail の配布形そのまま。 散文にしか無い規則は規則ではなく (N2 / C1.2)、 prompt 本文が規範文になる穴 (台帳 s2-07l.176) を広げる (研究 §3 (a))。"
  - id: "OPT3"
    name: "はしごの段を runner が typed に宣言し、 gate が段の含意を検査する (研究 §4 (3))"
    text: |
      段を閉じた enum (Skip / Reuse / Stdlib / Native / Dependency / OneLine / Minimal) にし、 runner が止まった段と上の段を退けた理由を record で宣言、 gate が形 (段の宣言・含意と diff の整合) を検査する。 契約の field と record の schema を決めるので SRS の FR と ADR が要る。
      （平易）実装役に「どの段で止まったか」を型で宣言させ、gate がその形を検査する案です。効果は最も高いと読みますが、契約の形と記録の形を決める重い変更で、要件書の改訂も要ります。今は「足す前に消す」段階なので保留し、条文と lens の件数で足りないと分かったときに起こします。
      利点: runner が必ず一度「要るか・在るか」を通る構造になり、 過剰設計が record に残る (効果は 3 案で最も高いと読む)
      欠点: schema と契約の field を決める (ADR を書く条件 3)・SRS の FR 1 本・契約 2〜3 便 = 今の「削る側」の向き (CTX3) と DR2 に反する・Stdlib / Native は照合できる形が無い (研究 §5)
    verdict: rejected
    reason: "段を閉じた enum (Skip / Reuse / Stdlib / Native / Dependency / OneLine / Minimal) にし、 runner が止まった段と上の段を退けた理由を record で宣言、 gate が形 (段の宣言・含意と diff の整合) を検査する。 契約の field と record の schema を決めるので SRS の FR と ADR が要る。"
  - id: "OPT4"
    name: "C17 に対応する rules 行 1 本 (例: R-C17-1 / review.overdesign・値 = 過剰設計 5 観点の名) を manifest に足す"
    text: |
      C14.2 の 2 面のために行を 1 本足す案。 だが 5 観点の名は既に閉じた enum の宣言 (findings.rs) に在り、 行はその写しになる (1 つの列を 2 か所で持つ = drift の源)。 enabled の knob は誰も求めていない。 値 (閾値) の無い条は manifest に行を持たないのが現行の形 (C2 / C3 / C6 / C10 / C11 / C14 / C15 / C16 に行は無く、 R- 行を持つのは C4 / C7 / C8 / C9 / C12 / C13)。
      （平易）条文に対応する規則の行を 1 本足す案です。「文書と機械の 2 面をそろえる」ためのようですが、5 観点の名前はすでに器の型に在り、行はその写しになって 2 か所がずれる元になります。値を持たない条は行を持たない、というのが今の憲法の形です。この案自体が、はしごの「既に在るか」で止まります。
      利点: C17 の機械の面が manifest から辿れる・後の deny への昇格が行の enabled の反転で済む
      欠点: 閉じた enum の宣言を manifest に写す = 同じ列を 2 か所で持つ (C1 の「値は 1 か所」の趣旨に反する)・enabled の knob は yagni・値の無い条は行を持たない現行の形と揃わない
    verdict: rejected
    reason: "C14.2 の 2 面のために行を 1 本足す案。 だが 5 観点の名は既に閉じた enum の宣言 (findings.rs) に在り、 行はその写しになる (1 つの列を 2 か所で持つ = drift の源)。 enabled の knob は誰も求めていない。 値 (閾値) の無い条は manifest に行を持たないのが現行の形 (C2 / C3 / C6 / C10 / C11 / C14 / C15 / C16 に行は無く、 R- 行を持つのは C4 / C7 / C8 / C9 / C12 / C13)。"
  - id: "OPT5"
    name: "何もしない (機械の面は land 済なので条文は要らない)"
    text: |
      lens の 5 観点と便の規模の record は既に在る。 だが CTX1 の力学 (11 日で ADR 43 本・検出線 1 本を囲む機構 5 つ・同日に足して同日に消す門) は、 その 2 つが land した後も続いた。 「足す前に消す」を折れない線として持たなければ、 提案の段で止まる根拠が無い。
      （平易）機械が数える面はもう在るのだから条文は要らない、という案です。しかし、その面が入った後も器は足す方向に積み上がり続けました。数える面が在っても、「足す前に消す」を守るべき線として持たなければ、提案の段で止まる根拠がありません。
      利点: 変更が 0・憲法の改訂手続きが要らない
      欠点: CTX1 の力学がそのまま続く・lens の 5 観点は「数える」だけで、 提案を止める線がどこにも無い
    verdict: rejected
    reason: "lens の 5 観点と便の規模の record は既に在る。 だが CTX1 の力学 (11 日で ADR 43 本・検出線 1 本を囲む機構 5 つ・同日に足して同日に消す門) は、 その 2 つが land した後も続いた。 「足す前に消す」を折れない線として持たなければ、 提案の段で止まる根拠が無い。"
