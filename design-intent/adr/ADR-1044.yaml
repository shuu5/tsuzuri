  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  変更を提案するときも実装するときも、決定はしごを上から順に通り、最初に成立した段で止まることを憲法の条（C17）にします。走査・record・規則の行・仕組みを足す提案は、先に何を消すかを名指します。機械が数える面は、すでに在る審査役（lens）の過剰設計 5 観点と便の規模の記録で、新しい規則の行も仕組みも足しません。「先に消すものを名指す」の判断は審査役と人の散文の判断に残り、機械では拒みません。
