# 判断の記録 ADR-68 — land の終端は remote を宣言する repo の便を push の後にこの host の緑で閉じ、GitHub の検査は close の後に読む
# 器の判断の記録 ADR-1094（器の ADR-0094 の写し）の経路 (1) の close の時機と尾と、ADR-1023 の §2.5 の CI の後に閉じる順を、host の緑の周について置き換える（どちらの本文も封で替えない）。
# 起草は係 w278a（2026-10-06）。材料は台帳の問い t3-hub.90.2 の本文と裁定、係 w263a・w265a・w266a・w275a の試作（器の行 v-close-host の差の file）、便 t3-hub.90.3 の契約審査の FAIL の記録。
id: ADR-68
title: land の終端は remote を宣言する repo の main に着地した便を、push の後に CI を待たずこの host の緑で理由の尾 host=green で閉じ、GitHub の検査は close の後に子 process が読んで赤なら席へ知らせる（器の判断の記録 ADR-1094 の経路 (1) の close の時機と尾と、ADR-1023 の §2.5 の CI の後に閉じる順を置き換える）
status: accepted
date: 2026-10-06
context: |
  器は便を main に着地させた後、land の終端で push し、GitHub の検査（CI）を 30 秒ごとに最大 900 秒待って、success の周だけ札（台帳の契約）を「landed <着地 commit id> ci=success」で閉じる（器の判断の記録 ADR-1094 の経路 (1)・ADR-1023 の §2.5・要件 FR1050）。依存の在る後の便は札が閉じるまで起きない。10-05 の 79 便で着地から close まで中央 373 秒・上から 1 割 409 秒で、7 便は GitHub の障害で測れないまま札が残り、席が手で閉じた。
  器は着地の前の gate と着地の後の主実測で、同じ共通 verify をこの host で既に撃っている（木が gate の木と同じ周は主実測を省く・ADR-1043）。GitHub の検査がこの host の確かめに足すのは、cargo deny の 2 つ・insta の参照の照らし・入れ子の全部の撃ち・別の機械のまっさらな環境で、障害の外の main の赤は 09-27〜10-04 の 847 回で 2 回だった。
  持ち主は札を閉じる時機の台帳の問い（t3-hub.90.2）で甲（この host の確かめで閉じ、GitHub の検査は後から読む）を選んだ。器の行（v-close-host）はこの形を試作したが、その便（t3-hub.90.3）の契約審査は、要件 FR1091 が尾の字の正本を器の判断の記録 ADR-1094 とし、その決定（success の周だけ ci=success で閉じる）と器の設計 ledger-form.md §16（尾は閉じた 3 形）が尾と時機を固定するのに、置き換える判断が木に無いとして落とした。ADR-1094 の撤退の条件は、替える時は本文を直さず後継の判断の記録を立てると定める。
decision: |
  (1) close の時機と尾。remote を宣言する repo の main に着地した便の land の終端は、push の後に CI の照合を待たず、この host の緑（着地の前の gate と着地の後の主実測）を根拠に、台帳の便を「landed <着地 commit id> host=green」で閉じる。尾は 1 語で、先端の commit id（tip=）も CI の語も持たない。列の先端でない便も同じ形で閉じる。push の前の公開の走査と push の失敗の扱いは替えない。
  (2) GitHub の検査は後から読む。close の後に、着地の後の CI の口（pipe land --run <便 id> --ci-only <照合する sha>）を子 process で起こし、待たない。子は今の照合（唯一の待ち・規則の行 pipe.ci_poll_s の間隔・pipe.ci_wait_s の上限・落ちた run を先に見る）で読み、success か failure か測れないの 1 件を記す。赤の周は席へ終端の 1 行を送り、札は替えない。照合する先端が無い周（列の先端でない便で先端の祖先でない・測れない）は子を起こさず、測れないを記す。規則の行 pipe.ci_wait_s は後から読む上限になり、値と裁定 id は替えない。
  (3) 替えない経路。主実測が赤か測れなかった便を受け入れる周（pipe land --terminal-only の受け入れの形・判断の記録 ADR-45 の門 H6）は host の緑が無いので、今までどおり先端の CI の success を待ってから ci=success（先端でない周は tip= つき）で閉じ、success でなければ閉じない。remote を宣言しない repo の ci=none と、PR で着地した便の pipe retire の ci=success は替えない。
  (4) 尾の文法。着地の形の尾は閉じた 4 形（host=green・ci=success・ci=success tip=<40 桁の 16 進>・ci=none）になり、ほかは読めない尾である。台帳の閉じた理由の読み手は host=green を読める尾として返し、局面の出力（FR1090）と memo の自動の close の条件（FR1093）と行の着地の局面は、その理由で閉じた契約を着地と数える。起票の門は頭 landed の席の close を尾に依らず断る（FR1081 の (d) は替えない）。尾の字の正本は ADR-1094 と本記録で、値の形と語の切り方は器の設計 ledger-form.md §16 が持つ。
  (5) 要件。要件書の FR1091 の尾の正本に本記録を足し、FR1050 の shall と plain と受入 AC1023 の title と plain に (1) から (3) の但し書きを足す（要件書の版を上げる）。
  (6) 置き換えの範囲。器の判断の記録 ADR-1094 と ADR-1023 の本文は替えない。本記録が置き換えるのは、ADR-1094 の決定の経路 (1) の「success の周だけ ci=success で close する」の部分とその FR1050 への主張の尾の列、ADR-1023 の §2.5 の「CI が緑でなければ閉じない」の順の、remote を宣言する repo の host の緑の周の分だけである。ADR-1094 の経路 (2) と (3)・撃ち直しの口・着地の印は器が測った後にだけ書くという原則は保つ（host の緑は器が測った事実である）。先の台帳の問い（t3-hub.90.1）の裁定の丁 1（障害の時だけ host で撃つ読み手）は作らない。
options:
  - id: a
    name: 甲 — この host の緑で閉じ、GitHub の検査は後から読む
    text: 決定 (1) から (6)。
    verdict: adopted
    reason: 札の待ち（依存の鎖の 1 段ごとに中央約 6 分）と、GitHub の障害のたびに席が札を閉じる手順が消える。器は着地の前と後にこの host で同じ検査を撃っているので、GitHub の検査は外の環境の追いの確かめとして後から読み、赤は知らせで拾う。
  - id: b
    name: 乙 — 今のまま GitHub を待って閉じ、丁 1 の読み手を作る
    text: 経路 (1) は CI の success を待って閉じ、障害の時だけ host で撃つ読み手を作る。
    verdict: rejected
    reason: 依存の鎖の 1 段ごとに約 6 分の待ちが残り、読み手を 1 つ作って保つ。
  - id: c
    name: 丙 — 札は GitHub を待って閉じるが、後の便は着地で起こす
    text: 器の列が、着地済みで GitHub の検査を待つ札を後の便の妨げに数えない。
    verdict: rejected
    reason: 甲と同じく後の便が赤の上で走りうるうえ、着地済みで開いた札という 2 つ目の状態ができ、障害の時は席の手が残る。
basis: [ADR-1094, ADR-1023, ADR-1043, ADR-45, FR1050, FR1081, FR1090, FR1091, FR1093, AC1023]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、札の待ちの memo（t3-hub.90）か後継の memo の notes に記帳する。7 日の窓の始まりは器の行（v-close-host）の着地の commit の時刻である。問う相手は持ち主。
    (1) host=green で閉じた便の後の子の記録 terminal:ci:failure のうち、同じ sha の撃ち直しでも赤のままの周（GitHub の障害と揺れを除いた赤）が 7 日に 2 度在れば、CI を待ってから閉じる形に戻すかを問う。
    (2) host=green で閉じた札を、後から読んだ GitHub の検査の赤のために席が開き直すか、その赤の上で走った後の便を取り下げた周が 1 度でも在れば、報告して戻すかを問う。
    (3) 子を起こせない周（terminal:ci:unspawned）が 7 日に 3 度在れば、子の起こし方を直す行を置く。
plain: |
  作業の便が main に入った後、器は GitHub の検査の結果を待ってから札を閉じていました。待ちは 1 段ごとに約 6 分で、GitHub が止まると札が残りました。器は main に入れる前と後にこの host で同じ検査を撃っているので、その結果が緑なら札をすぐ閉じ、閉じた理由の字に「この host の確かめで緑」と書きます。GitHub の検査は閉じた後に別の process が読み、赤なら席へ知らせます。
  この host の確かめが赤だった便を受け入れるときと、押す先の無い repo と、PR で入った便は今のままです。
grill:
  when: 2026-10-06
  who: 起草係 w278a（AI・読みの範囲と試作の直し）
  where: 起草の置き場の w278a の notes.md の 1 節と 3 節と 5 節
  summary: 失うのは「札が閉じた＝GitHub の検査を通った」という印だけで、印は子の記録 terminal:ci:success に移る。後の便が GitHub の検査の赤の上で走りうる（障害の外の赤は 847 回で 2 回）のは撤退の条件 (1)(2) で見張る。受け入れの周は CI を待つ形を残す。
approval:
  who: 持ち主
  date: 2026-10-06
  ruling: "t3-hub.90.2（裁定 id = t3-hub.90.2:20261005T2257Z-1・甲・配達の口・notes に逐語）"
  verbatim: "推奨で良い というかもしかしてprivateならそもそもCI自体なくてもいいのでは？被ってるんでしょ？"
  surface: R-8
consequences:
  - 依存の鎖の 1 段ごとの札の待ち（10-05 は中央 373 秒）と、GitHub の障害のたびに席が札を手で閉じる手順が消える。後の便は札の close の直後に起きる。
  - 札の close は「GitHub の検査を通った」の印でなくなる。その印は子の記録（terminal:ci:success）に移り、赤は席への 1 行で拾う。札は赤でも閉じたまま残る。
  - 後の便が、後から GitHub の検査が赤と読む main の上で既に走っていることがある（障害の外の赤は 847 回で 2 回・この host の確かめは緑だった物）。
  - 2026-09-16 の持ち主の裁定の行 pipe.ci_wait_s に結んだ流れ（CI を待って success の時だけ閉じる）は、受け入れの周だけに残り、ほかの周では後から読む上限になる。
  - 着地の形の尾が 4 形になり、尾を読む消費側の読み手は host=green を受ける要がある。測れない札を席が手で閉じる道具 2 本は要らなくなる。
note: 起草は係 w278a。承認の欄の逐語と経路は、適用の script が台帳の問いの notes の定型行から読んで入れた（逐語の中の改行の印は空白 1 つにした）。
