# 判断の記録 ADR-47 — code の節点の名前と名前空間（提案中・起草は係 w146a 2026-10-05・判断の記録 ADR-44 の段 1・ADR-46 の決定 (3)）
# 材料は係 w146a の測り（drafts/w146a/w/defnames.py・oldptr.py とその出力）と、w141a の実測（drafts/w141a/w/linkage.md）と w142a の出力（drafts/w142a/w/shapes.md）。
id: ADR-47
title: code の節点の名前は repo の根からの字だけで決め（commit は 40 字の名・file は根からの path・定義は path と入れ子と名と種類・歯は crate の dir と名）、持ち込んだ code の注の古い番号は注の在る dir で名前空間を決めて規則 1 つで今の正本へ引き、器の設計文書の古い pointer は取り込みの段 3 のノートの名を元の文書の名から導いて引く
status: proposed
date: 2026-10-05
context: |
  ADR-46 の決定 (3) は、定義の節点の名前を「path と入れ子と名と種類」で決め、持ち込んだ code の注の古い番号を今の正本へ引く名前空間を、ADR-44 の段 1 で器の取り込みの段 3（ADR-39）の前に決めるとした。後から名を替えると、導いた物の置き場・board の URL・歯の見本が全部替わる。
  測り（V・係 w146a・2026-10-05・main b4b816a6 の木）。構文で探す道具で Rust の定義を全部読むと 32,169 個（関数 23,375・定数 5,403・構造体 1,370・module 1,209・列挙 620・型の別名 152・静的 25・macro 10・trait 5）・file 1,053 本。名を「path と入れ子と名」にすると同じ名の重なりが 4 組（節点 5 つが消える）、種類を足すと 3 組、trait の impl を「型と trait と型の引数」で書くと 1 組（cfg で分けた双子の main の関数 1 組）まで減る。歯（#[test] の関数）は 7,304 本で、crate の dir と関数の名の組の重なりは 0・名の最長は 103 字。
  測り（V・係 w141a・2026-10-04）。持ち込んだ code の注の名指しは、folio2 の 1,189 本のうち 930 本が、根の索引の同じ字の別の節点に当たる（folio2 の 1 番の判断の記録と根の 1 番の判断の記録は別の判断）。器の注の名指し 2,956 本のうち 1,396 本は器の番号に 1000 を足すと根に在り、276 本は根の同じ字の別の節点に当たり（器の非機能要件の 4 番は根の 1004 番）、38 本は tsuzuri の着地が根の名のまま書いた（35 番の判断の記録など）。器の要件の 1000 足しは要件書 第 0.27 版で済んだが、code の注は替えない決まり（ADR-18 の決定 (5)・ADR-39 の決定 (2)）。
  測り（V・係 w146a）。着地の commit の記録の札のうち器の設計文書を指す古い pointer（Scribe2-Contract の docs/design/<文書>.md#<行>）は 427 本（器の文書 27）で、folio2 の便の文書（delivery）を指す物が 154 本（文書 153・全部 folio2/docs/design/ に在る）。器の文書のうち 40 章を越えて ADR-39 の決定 (3) で 2 本に割る 4 本（contract-source・dispatcher・gate-cost・pipeline）を指す pointer のうち 96 本は 41 節以後の行を指す。今の木の区間で引けない pointer は 2 本（区間に無い行 1・今の木に無い文書 1）。
decision: |
  (1) 原則。code の節点の id は repo の根から読める字だけで決め、言語・読み取りの道具・道具の版・crate の版に依らない。id は増やすだけで、前に出した id の意味を替えない（条 P-3）。大文字と小文字を潰さない。
  (2) 着地の commit。id は git の commit の名の全部（40 字の小文字の 16 進）、題は頭の 8 字。正本は器の event log の走行の終わり（RunDone）の札 sha:（着地の squash の commit）で、導出は git を読まない。辺 landed（commit → その走行の契約 bead）を組む。電文の名は節点の種類 commit・辺の型 landed（行 c-commit-node）。
  (3) file。id は repo の根からの相対 path（区切りは /・頭に ./ を付けない）。入れ子の repo（scribe2/・folio2/）の file も根からの path で書く。
  (4) 定義。id は「<file の path>::<入れ子>::<名>@<種類>」。入れ子は中の module と impl の型を :: でつなぎ、trait の impl は「型[trait<型の引数>]」と書く。種類は言語の表の閉じた列（Rust は fn・const・struct・mod・enum・type・static・macro・trait から始める）。同じ path と入れ子と名と種類を持つ 2 つ目より後（cfg で分けた双子）には、file の中の出現の順で ~2・~3 を付ける。索引の記号（rust-analyzer の SCIP の記号）とは、名と入れ子の末尾で照らす。
  (5) 歯。id は「<crate の dir>::<歯の関数の名>」（crate の dir は Cargo.toml の在る dir の根からの path）。歯の file を束ねや割りで動かしても id は替わらない。同じ関数の定義の節点とは別の族とし、歯 → 定義の結びは段 4 の行で組む。言語ごとの歯の在りか（Rust は #[test] の関数）は言語の表が持つ。
  (6) 名前空間。code の注の id を引く空間は、注の在る file の家の dir で決める。
  (ア) scribe2/ の下。頭が 0 の 4 桁の番号の判断の記録と、1000 未満の番号の器の要件・非機能要件・受入基準・制約・目的は、ADR-39 の決定 (2) の規則（1000 を足す）で根の id に写して引く。頭が 0 でない番号の判断の記録・1000 以上の番号・ほかの形（条・規則行・行 id）は根の id のまま引く。これから scribe2/ の下に書く注は、根の要件を 1000 未満の番号で名指さない。
  (イ) folio2/ の下。folio2 の設計の正本（folio2/design-intent）の空間で引き、根のグラフの節点には結ばない。段 4 で folio2 の索引を読む時は、節点の id の頭に「folio2:」を付けて根の節点と分ける。
  (ウ) それ以外（crates/・xtask/・根の file）。根の空間で引く。
  引けない名指しは「空間の外れ」として数えて出す（条 P-7）。
  (7) 古い pointer。器の取り込みの段 3（ADR-39 の決定 (4) の (ウ)）で写す設計ノートの id は「scribe2-<元の文書の名（stem）>」とし、行 id は字のまま写す。2 本に割る 4 文書の後の本は「scribe2-<stem>-2」とする。古い pointer「docs/design/<stem>.md#<行>」は「scribe2-<stem>#<行>」で引き、前の本に無い行は後の本で引く（行 id は元の文書の中で一意なので 2 本のどちらか 1 本にだけ在る）。folio2 の便の文書（delivery）を指す pointer は (6) の (イ) の空間で引く。今の契約表の形の pointer（contracts/<ノート>.toml#<行>）は今のまま <ノート>#<行> で引く（廃止したノートも置き場に残る）。引けない pointer は数えて出す。
  (8) 書き換えない。持ち込んだ code の注と、着地の commit の記録の札は書き換えない（ADR-18 の決定 (5)）。対応表の file を置かず（ADR-39 の決定 (2)）、規則は導出の code（中核の名前の関数）に 1 つずつ置く。
  (9) 閉じた一覧の読み。ADR-7 の決定 (2) と ADR-17 の閉じた一覧（節点の種類 20・辺の型 32）は、ADR-46 の決定 (2) とこの記録で読み替える。行 c-commit-node の着地で 21 と 33 になる。段 4 で足す節点の種類の電文の名は file・定義（def）・歯（tooth）、辺の型は commit → その定義を最後に書いた（wrote）・行 → 行の便が書いた定義（implements）・歯 → 行と受入基準（tests）とする。
options:
  - id: a
    name: 根からの字の名・家の dir の名前空間・規則で引く古い pointer
    text: 決定 (1) から (9)。
    verdict: adopted
    reason: 名は git の木と記録だけから作り直せ（ADR-46 の決定 (5)）、測りの木で重なりが cfg の双子の 1 組だけになる。歯の id は file の束ねで替わらない。古い番号は規則 2 つ（1000 足しと folio2 の空間）と文書の名の規則 1 つで引け、対応表も注の書き換えも要らない。
  - id: b
    name: 索引の記号を定義の id にする
    text: rust-analyzer の SCIP の記号（道具の名・crate の名と版・path・記号）をそのまま定義の id にする。
    verdict: rejected
    reason: crate の版や道具の版で id が替わる。索引は任意の目（ADR-46 の決定 (4)）なので、索引の無い言語と repo で id が立たない。構文で探す道具の範囲から作れない。
  - id: c
    name: 注と古い札を今の正本の id へ書き換える
    text: 持ち込んだ code の注の古い番号を一括の便で根の id に書き換え、名前空間を持たない。
    verdict: rejected
    reason: ADR-18 の決定 (5) に反する。書き換えた注の行の行ごとの記録（blame）が書き換えの commit に移り、ADR-46 の決定 (6) の結び（定義 → それを書いた便）を壊す。着地の commit の札は git の履歴の中で書き換えられない。
  - id: d
    name: 対応表の file を置く
    text: 古い番号と古い pointer から今の id への対応を表の file に持つ。
    verdict: rejected
    reason: ADR-39 の決定 (2) に反する。規則 3 つで足りる対応を数千行の表にし、表の保ちが要る。
  - id: e
    name: 定義の id を増やすだけの番号にする
    text: 定義に連番を振り、番号の振りの記録を置き場に持つ。
    verdict: rejected
    reason: 番号の振りの正本が git の外に要り、git から作り直せない（ADR-46 の決定 (5)・条 P-20）。
basis: [ADR-7, ADR-17, ADR-18, ADR-39, ADR-44, ADR-45, ADR-46, FR2, P-2, P-3, P-7, P-20]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo（t3-hub.80）か後継の memo の notes に記帳する。問う相手は持ち主。
    (1) 段 4 の一括で、定義の id の重なり（~2 の札が要る組）が cfg の双子のほかに 1 組でも出たら、入れ子の形を問い直す。
    (2) 器の取り込みの段 3 の後、器の設計文書の古い pointer 427 本のうち引けない物が 2 本を越えたら、ノートの名の形を問い直す。
    (3) 段 4 の一括で、名前空間の規則で引いた注の名指しのうち空間の外れ（今の値は器 3・folio2 8）が、それぞれ 2 倍を越えたら、名前空間の規則を問い直す。
plain: |
  code の図に置く点（commit・file・関数や型・テスト）に、どう名前を付けるかを決める記録です。
  名前は、repo の中の場所と名前だけから決めます。道具や版が替わっても名前は替わりません。同じ名前の関数が重なる所は、種類と入れ子で分けます。
  持ち込んだ code の古いコメントは、別の番号の付け方で書かれています。書き換えずに、ファイルの置き場で読み方を決め、今の番号へ引きます。古い作業の記録が指す文書も、名前の決まりから今の文書を引けるようにします。
consequences:
  - 第 29 波 a の設計ノート（surface-wave29a）の commit の節点の行（c-commit-node）が commit の節点と辺 landed を足し、床の値の行（k-commit-count）が着地の commit の無い着地した契約を tz graph --check の床の値に出す（ADR-45 の門 H4 の測り）。
  - 器の取り込みの段 3 で写すノートの id は scribe2-<stem>（割る 4 文書の後の本は scribe2-<stem>-2）にする。
  - file・定義・歯の節点と名前空間の規則の関数は ADR-44 の段 4 の行に置く。
note: 起草は係 w146a（2026-10-05）。承認の欄は持ち主の裁定の後に席が書く。
