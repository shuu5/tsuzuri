# 判断の記録 ADR-82 — 設計だけの行の測りが線を外れた時の戻し先を、差の file から落ちの型ごとの構造の直しの行に置き換える
# 判断の記録 ADR-72 の撤退の条件 (2) の戻し先と、台帳 t3-hub.92.2 の notes 2026-10-07T01:05Z の行の推奨の後ろ半分を部分で置き換える。ADR-72 の本文は替えない（封・前例 ADR-68 と ADR-70 の頭の注・ADR-72 の決定 (9) の書き方）。ADR-72 は退役しない。
# 起草は係 w434a（2026-10-07）。材料は ADR-72 の本文、台帳 t3-hub.92.2 の notes（00:06Z・01:05Z・09:07Z・09:17Z の行）、検証役 v433 の所見 F1・F2・F16（drafts/v433/w/notes.md）。
id: ADR-82
title: 設計だけの行の 1 回目の着地率が 70% を下回った時の戻し先を、差の file から落ちの型ごとの構造の直しの行に置き換え、差の file を戻し先にしない（ADR-72 の撤退の条件 (2) の部分の置き換え）
status: accepted
date: 2026-10-07
context: |
  判断の記録 ADR-72 の決定 (3)（決め D2）は、起草係を設計係にし、設計係は code を書かず組まないと決めた。D2 は持ち主の指摘 (4)（グラフの束を設計係に渡して設計だけをさせる・発話 2026-10-06T07:51:34.606Z）から来る。同じ記録の撤退の条件 (2) は「設計だけの行が 10 本着地した時点で、1 本目の着地率が 70% を下回るか、着地 1 本あたりの新しい量（設計係と便の和）の中央が段（S2）の前の 7 日の中央を越えたら、差の file を大きい行だけ戻すかを問い直す」と書く（V・ADR-72.yaml:77）。
  この戻し先は、同じ記録が退けた案 丙（差の file を残す）へ戻る道である。ADR-72 が丙を退けた訳（ADR-72.yaml:50）は費えの字だけ（差を書く係は実質 2 度実装する・起草の重さが並列の天井・一度に替えると着地率の下がりを測れない）で、役の決め（指摘 (4) の「設計だけをさせる」と、後の発話 2026-10-07T08:58:32.627Z の「実質設計係が実装まで行うことになる」）が訳に書かれていなかった（V）。だから費えの引き金（着地率と量）が当たれば、退けた案を開け直せた。ADR-72 の帰結は「1 本目の着地率は下がる見込み（今の 91% の多くは差を当てるだけの便）」と書いており、70% の線は見込みどおりに当たる作りだった（D・検証役 v433 の所見 F1）。
  席の扱いの事実（V・台帳 t3-hub.92.2 の notes）。00:06Z の行で、席は条件 (2) を今まで測っていなかったと書き、条件の 10 本の時点でなく 59 本の時点で測った（2026-10-06T09:00Z 以後に初めて起きた bead 59 本のうち、1 本目の run で着地したのは 32 本・54%。前の 7 日 2026-09-29〜10-05 は 312/344・91%）。2 つ目の鍵（着地 1 本あたりの新しい量の中央）は測らずに持ち主に問うた。01:05Z の行で、持ち主は席の推奨を受けた（発話 2026-10-07T01:00:06.986Z）。推奨は、差の file は戻さず、器の直しを先に入れ、次の設計だけの行 10 本で 1 回目の着地率と 1 本あたりの量を測り直し、それでも 70% を下回れば大きい行だけ差の file を戻すかを問い直す、で、後ろ半分は丙へ戻る道を承認済みの推奨として残した。
  持ち主は 2026-10-07T08:58:32.627Z に、差の file を戻す提案は実質設計係が実装まで行う事になると指摘した。席は照らして、戻し先が D2 と丙の訳に矛盾すると認め（09:07Z の行）、戻し先を置き換える記録を対話面の 1 問で問い、持ち主は問いの字のとおりに承認した（09:17Z の行・発話 2026-10-07T09:12:15.602Z）。承認の字は量の引き金を持たず、動きは起こすで、持ち主に問う句を持たない。
decision: |
  (1) 置き換える字。ADR-72 の撤退の条件 (2) を、持ち主が承認した字（対話面の問いの字を語に合わせて整えた形）で読む。「1 回目の着地率が 70% を下回ったら、落ちの型を数え、多い型ごとに構造の直しの行（契約の機械の照らし・便の中の直しの周・行を小さく割る・大きい行の実装役の model）を起こす。差の file は戻し先にしない。」
  (2) 承認の字を測れる形にする席の足し（引き金と動きは替えない）。窓の始まりは、席が測り直しを決めた 2026-10-07T01:05Z（台帳 t3-hub.92.2 の notes の同じ時刻の行）で、ADR-72 の撤退の条件の窓の始まり（各段の着地の commit の時刻）をこの条件 (2) についてだけ置き換える。測る時は、窓の中に初めて起きて着地した設計だけの行の 10 本目が着地した時で、条件の本数を過ぎてから測らない。1 回目の着地率は、その 10 本のうち 1 本目の run で着地した本数の割合である。数えるのは tsuzuri の設計の席で、器の pipe の run の dir（verdict.json・review.json）と event log と台帳の完全な記録から出し、撃った命令と数を memo（t3-hub.92.2）か後継の memo の notes に記帳する。量の鍵は数えない。
  (3) 落ちの型と直しの行。1 本目の run で着地しなかった行ごとに、その run が止まった所（器の event log の終端の語と、審査の記録の型か gate の所見の型）を 1 つの型として数える。多い型は 2 本以上の型である。席は多い型ごとに、(1) の 4 つの直しのうち 1 つを選んで設計係に起草させ、便で流す。持ち主には問わず、型の数えと選んだ直しを持ち主への報告に書く。
  (4) 丙を退ける訳に役の決めを足す。ADR-72 の案 丙（差の file を残す）は、費えの訳に加え、役の決め（設計係は設計だけを書き、実装は便だけがする・ADR-72 の決定 (3) と持ち主の指摘 (4)）に反するので退ける。差の file か、設計係か席が完成した code を書く形を戻す事は、どの撤退の条件の戻し先にも置かない。それを戻すには D2 の役の決めを替える新しい判断の記録と持ち主の承認が要る。
  (5) 置き換える範囲。置き換えるのは、ADR-72 の撤退の条件 (2) の字の全体（引き金と戻し先の字「差の file を大きい行だけ戻すかを問い直す」）と窓の始まり、台帳 t3-hub.92.2 の notes 01:05Z の推奨の後ろ半分（それでも 70% を下回れば大きい行だけ差の file を戻すかを問い直す）である。ADR-72 の条件 (2) の量の引き金（着地 1 本あたりの新しい量の中央が段（S2）の前の 7 日の中央を越える）は承認の字に無いので、この置き換えで消える。10 本の時点と 70% の線は承認の字と決定 (2) が持つ。01:05Z の推奨の前の半分（差の file は戻さず、器の直しを先に入れ、次の 10 本で測り直す）は残す。ADR-72 の本文と、ほかの撤退の条件 (1) と (3)〜(6) は替えない。
  (6) ADR-72 の status と superseded_by は替えない。部分の置き換えで ADR-72 は退役しないので、status は accepted のまま、superseded_by を置かず、この記録も supersedes を置かない（部分の置き換えの前例は前の記録を退役させず、丸ごとの置き換えだけが前の記録を退役させる）。
  (7) 条文。この記録は条の字を替えない（amends と grill を持たない）。
options:
  - id: a
    name: 甲 — 戻し先を落ちの型ごとの構造の直しの行に置き換え、差の file を戻し先に置かない
    text: 決定 (1) から (7)。
    verdict: adopted
    reason: 1 回目の着地率の線は残したまま、戻し先を役の分け（設計係は設計・実装は便）の内に収める。戻し先の 4 つの直しは ADR-72 の帰結が既に挙げた抑えの手（契約に決めを書く・便の中の直しの周・大きい行だけ実装役を opus にする・小さい行から測る）と同じ向きで、落ちた所を直す。失う物は、差を当てるだけの便が出していた 1 本目の着地率（91%）へ早く戻る道と、量の引き金で量の増えを見張る所で、型ごとの直しの行を起こす手間（行の起草と便）に替わる。
  - id: b
    name: 乙 — ADR-72 の字のまま（差の file を大きい行だけ戻すかを問い直す）
    text: 撤退の条件 (2) と 01:05Z の推奨の後ろ半分をそのまま残す。
    verdict: rejected
    reason: 戻し先は ADR-72 の退けた案 丙へ戻る道で、差を書く係は実質 2 度実装し、設計係が実装まで行う形になる。D2 と持ち主の指摘 (4) に反する。帰結が着地率の下がりを見込んでいるので、引き金は見込みどおりに当たり、退けた案が承認済みの推奨として開き続ける。
  - id: c
    name: 丙 — 撤退の条件 (2) を消す
    text: 設計だけの行の 1 回目の着地率を撤退の条件として測らない。
    verdict: rejected
    reason: 設計だけにした費え（1 本目の着地率の下がり）を見張る所が無くなり、落ちが続いても直しの行を起こす時が来ない。測りを残し、戻し先だけを役の分けの内に替えれば足りる。
basis: [ADR-72, ADR-59, N-2, N-3, P-4, P-27]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo（t3-hub.92.2）か後継の memo の notes に撃った命令と数を記帳する。問う相手は持ち主。数は器の pipe の run の dir と event log と台帳の完全な記録から、決定 (2) と (3) の数え方で出す。鍵は 1 回目の着地率だけで、量は数えない。どの戻し先も、設計係は設計だけを書き実装は便だけがする役の分けを崩さず、差の file か、設計係か席が完成した code を書く形を戻し先に置かない。
    (1) 決定 (1) で起こした構造の直しの行が全部着地した時刻を窓の始まりとし、窓の中に初めて起きて着地した設計だけの行の 10 本目の着地の時点で、1 回目の着地率が 70% を下回ったら、2 巡目の落ちの型の数えと選んだ直しを添えて、構造の直しの行を足すか、行の大きさの上限か実装役の model の既定を替えるかを問う。
    (2) 決定 (3) の落ちの型の数えで、2 本以上の型が 1 つも無ければ（落ちが型ごとに散り、直しの行の的が決まらない）、型の分け方（どの終端の語と所見の型を 1 つの型に束ねるか）を問い直す。
    (3) (1) が 2 巡続けて当たったら、設計係が契約に書く決めの欄（関数の署名・歯の名と断言・置き場・ほかの行との境目）の形を問い直す。
plain: |
  前の記録（ADR-72）には「設計だけの作業がうまく着地しなかったら、大きい作業だけ差の file（設計係が完成した code を書く形）を戻すかを問い直す」という逃げ道がありました。これは、前の記録が退けた案に戻る道で、設計係に実装までさせる事になります。持ち主はこれを指摘し、置き換えを承認しました。
  この記録で逃げ道を置き換えます。設計だけの作業 10 本のうち、1 回目で着地したのが 7 割を下回ったら、どこで落ちたかの型を数え、多い型ごとに仕組みの直し（契約の機械の確かめ・同じ作業の中の直し・作業を小さく割る・大きい作業の実装役の model）を起こします。どの直しを選んだかは持ち主への報告に書きます。差の file は戻し先にしません。前の記録にあった「1 本あたりの量が増えたら」の引き金は、承認の字に無いので消えます。数え始めは 2026-10-07 01:05（世界時）です。
  前の記録の本文は替えず、前の記録も退役させません。この記録が読み替えを持ちます。
  失うのは、差を当てるだけの作業が出していた高い着地率へ早く戻る道で、代わりに型ごとの直しの作業を起こす手間がかかります。
approval:
  who: 持ち主
  date: 2026-10-07
  ruling: "t3-hub.92.2 notes 2026-10-07T09:17Z（発話 2026-10-07T09:12:15.602Z の記帳）"
  verbatim: "よい"
  surface: R-8
consequences:
  - 席は窓の 10 本目の着地の時に 1 回目の着地率を測り、下回れば直しの行を起こして報告に書く。条件の本数を過ぎてから測る事をしない（決定 (2)）。
  - 量の引き金が消えるので、設計だけの行の量の増えを撤退の条件では見張らない。
  - 差の file の 255 本（docs/retired/patch）は履歴の写しで、戻し先ではない。
  - 器に残る差の file の道（契約の欄 patch・雛形 runner.txt の差の行の句ほか）を消す行は、この記録では決めず、その行の起草で置く。
  - 撤退の条件 (2) が当たった時の手間は、差の file を書く起草係の重さから、落ちの型ごとの直しの行の起草と便に移る。持ち主の手は問いの答えから報告の読みに替わる。
note: 起草は係 w434a。番号は design-intent/adr と起草の置き場の下書きを照らし、ADR-82 を名乗る物が無い事を確かめた（置き場の他の係の notes が ADR-82 を名乗るのはこの起草の予告だけ・器の一覧の ADR-0082 は器の記録で別）。承認の欄の裁定は台帳 t3-hub.92.2 の notes の 2026-10-07T09:17Z の行で、逐語はその行の発話の頭。置き換える字（決定 (1)）は 09:07Z の対話面の問いの字（持ち主が承認した字）を語に合わせて整えた形で、引き金と動きは替えていない。第 1 稿は席の頼みの字（量の引き金と問う句を足した字）を写していたので、第 2 稿で承認の字に戻した。grill と amends の欄は置かない（条文を替えない記録のため）。検証役 v433 の所見のうち F1（丙の訳に役の決めを足す）・F2（01:05Z の推奨の後ろ半分を名指す・席が 59 本の時点で 2 つ目の鍵を測らずに問うた事実）・F16（差の file の 255 本は戻し先でない）を入れた。
