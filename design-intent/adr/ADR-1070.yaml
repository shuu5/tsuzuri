# 判断の記録 ADR-1070 — 器 scribe2 の判断の記録 ADR-0070 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1070
title: "heartbeat は打刻の合図を指し、 席ごとに止められ、 管理 tick は止めない — 席の状態の dir の停止の記録 1 つで管理 tick は合図だけを送らず (起こし直し・退避・群の判定は撃つ)、 tick は周ごとに最後の周の打刻を書き、 seat tick status と doctor が健全と on/off を出し、 外の画面は file を読んで止める口は器の CLI を撃つ (ADR-1058 の「heartbeat = 管理 tick」の読みを部分 supersede・要件 FR1078 / AC1048 の新設と FR1027 の語の改めを伴う)"
status: accepted
date: 2026-09-26
context: |
  ADR-1058 は管理 tick を器に戻し、 その呼び名として heartbeat を使った。 ADR-1068 は合図が梯子の列の末尾で止まると決めたが、 人が状況に応じて合図だけを止める口は無く、 tick 自体が動いているかも systemctl でしか見えない。 2026-09-26 に持ち主は、 tick は導入 project で既定で常時オン (口座の移動・状態把握の意味を持つ) にし、 heartbeat (黙った席へ送る合図) は席ごとに手で止められるようにし、 別 project の画面 (account board) にも tick の健全と heartbeat の on/off と止める口を作るべきだと要望し、 席の設計 (heartbeat = 打刻の合図・口は seat heartbeat off|on|status・止めるのは合図だけ・tick は周ごとに最後の周の打刻を書き健全は読み手が判じる) を裁定した (00:53Z)。 要件 FR1078 / AC1048 の新設と FR1027 の語の改め (v0.25) を伴う。
  なぜこの判断が要るのかを、 経緯 (heartbeat の語と止める口の不在)・要望と裁定・器の今の部品・これまでの決まり・この判断の範囲の 5 つから説明します。 前の決定 (ADR-1058) は見回りを器に戻し、 持ち主の裁定の語に合わせて heartbeat をその呼び名にしました。 後の決定 (ADR-1068) は合図の待ちを 30 分 → 1 時間 → 3 時間 → 6 時間 → 12 時間 → 24 時間 の列にし、 列が尽きたら止まると決めました。 けれども、 席を意図して休ませたい周や保守の周に合図だけを止める口は無く、 止めるには見回りの timer を退役させるしかなく、 それでは落ちた席の起こし直し・移動のための退避・群の移動の判定も止まります。 2026-09-26 に持ち主は、 見回りは導入 project で既定で常にオンにすべき (口座の移動や状態把握など意味が多い) だが heartbeat は状況に応じて止められるべきで、 手で見回りはそのまま heartbeat だけ止める簡単な方法を CLI に作るべきだ、 さらに別 project (tsuzuri) で作る画面にも見回りが健全に動いていることの表示・heartbeat が on かの表示・画面から off にする口を作るべきだ、 と要望しました。 席は、 heartbeat の語を「見回りが黙った席へ送る合図」に改めて見回りは tick のままとする形、 席ごとの停止の記録 1 つと CLI の口、 毎周の「最後に周った記録」、 status と doctor の見せ方、 画面は file を読み止める口は CLI を叩く形を提案し、 持ち主は推奨で進めると裁定しました。 器の部品を見ると、 見回りの 1 周は、 登録の読み → 窓が shell なら落ちた席の起こし直し → 移動の周なら退避 → 合図 (黙りの長さ・待ちの列・口座の門・入力欄の門) → 群の判定、 の順で、 毎周の判定を 1 行で標準出力に出し (journal が残す)、 合図を止める分岐はありません。 席ごとの「最後に周った時刻」の file も無く、 見回りの生死は systemctl でしか見えません。 決まりの側では、 道は 1 本 (書き手は器の 1 本)・宣言値と実測値と導出値を分ける (健全かは読む側が導く)・足すときに外す物を名指す・消えたら戻せない削除を断る (停止は消せば戻る)、 が効きます。 動かすのは、 語の指す先・停止の口・最後に周った記録・見せ方の 4 か所だけで、 見回りの判定の順・起こし直し・退避・群の判定・待ちの列・unit と周期・記録の種類は動かしません。
