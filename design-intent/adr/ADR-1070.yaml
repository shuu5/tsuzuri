  器の案の章の要約: 候補を 5 つ並べます。 heartbeat を合図の呼び名にし・席ごとの停止の記録 1 つ・最後に周った記録・status と doctor で見せる案 (選んだ案)、 見回りの timer を止めて heartbeat off にする案、 off を規則の表 (host の設定) で持つ案、 最後に周った記録を出来事の log に書く案、 machine 全体の off を 1 つの file で持つ案です。 却下した 4 案にも利点を並べ、 退けた決め手が現物か分析かを各案に書きます。 timer を止める案は口も記録も増えない点で、 規則の表で持つ案は宣言値として設定に残る点で、 log に書く案は記録の置き場が 1 つに揃う点で、 machine 全体の off の案は保守の周に 1 回で全席を止められる点で、 選んだ案に勝ります。
  器の専門語の説明: 本文に出てくる専門語 10 個を、 やさしい言葉で説明します。
  ・heartbeat（heartbeat）: 管理 tick が黙った席の入力欄へ注入する、 続きを促す 1 行 (打刻の合図) の呼び名。 席ごとに止められる。 ADR-1058 では管理 tick の呼び名だったが、 本 ADR で指す先を合図に改めた。
  ・管理 tick（management tick）: 席の外から周期 (rules 行 1 本・既定 15 秒) で回り、 死んだ席を起こし直し、 移動の周に退避を撃ち、 黙った席へ合図を送り、 群の移動の判定を撃つ仕組み (ADR-1058・ADR-1066)。 本 ADR の後も止めない。
  ・打刻の合図（stamp signal）: 管理 tick が黙った席の入力欄へ注入する、 台帳の現在地から続きを進めるよう促す 1 行 (ADR-1058)。 待ちは梯子の列の段で決まり (ADR-1068)、 席ごとの停止の記録が在れば送らない。
  ・停止の記録（pause record）: 席の状態の dir に置く 1 行の file。 在れば管理 tick はその席へ合図を送らない。 器の口 (seat heartbeat off) だけが置き、 on が消す (可逆)。 在るのに読めない周も止めたと読む。
  ・最後の周の打刻（last tick stamp）: 管理 tick が周ごとに席の状態の dir へ書く 1 行 (時刻・判定・理由)。 rc 1 の周も書く。 健全かはこれを読む側が判じる。
  ・健全（healthy）: 最後の周の打刻の時刻から今までの経過が周期 (rules 行) の 2 倍以内であること。 読み手 (seat tick status・doctor・外の画面) が導き、 管理 tick は判じない。
  ・判定行（decision line）: 管理 tick が周ごとに標準出力へ出す 1 行 (decision= target= reason= …)。 合図を止めた周は decision=noop reason=heartbeat-off。
  ・席の状態の dir（seat state dir）: state dir の下の席 (target) ごとの dir。 状態の打刻・梯子の記録・停止の記録・最後の周の打刻を置く。
  ・死んだ席の起こし直し（dead seat relaunch）: 登録 row を持ち窓が shell に戻った席を、 管理 tick が席の起動 (FR1059) で起こし直すこと。 heartbeat が止まっている席でも撃つ。
  ・移動の周の退避（move-round evacuation）: 群の今の口座が席の口座と違う周に、 管理 tick が席へ終了の合図を送ること (FR1038)。 heartbeat が止まっている席でも撃つ。
