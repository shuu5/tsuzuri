decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 heartbeat は見回りが黙った席へ送る合図を指し、 見回りは tick と呼びます。 器は seat heartbeat off|on|status の口を持ち、 off は席の dir に停止の記録 (時刻 1 行) を置き、 on はそれを消し (戻せます)、 status は on|off と最後に周った記録を 1 行で出します。 見回りは合図を送る前に停止の記録を見て、 在れば合図を送らず判定の行を noop / heartbeat-off にし、 落ちた席の起こし直し・移動のための退避・群の判定はそのまま撃ちます。 記録が在るのに読めない周も止めたと読みます。 見回りは毎周、 席の dir に「最後に周った記録」(時刻・判定・理由の 1 行・失敗した周も) を書きます。 seat tick status は席ごとに 1 行 (最後の時刻・経過秒・健全か・heartbeat の on/off・待ちの段・次の合図までの秒か停止) を出し、 doctor の席の行に heartbeat と tick の 2 項目を足します。 健全かは「今 − 最後の時刻 ≤ 周期の 2 倍」で読む側が判じ、 見回りは判じません。 停止の記録の書き手は器の口 1 本で、 外の画面は 2 つの file を読んでよいが書かず、 止める・戻すは器の CLI を叩きます。 見回りの判定の順・待ちの列と記録・口座の門・入力欄の門・unit と周期・記録の種類・規則の表は変えません。 要件書では、 FR1078 (新設・heartbeat の停止と見回りの健康) の根拠、 FR1027 (見回り) の語を改める根拠になり、 FR1064 (見回りの unit) は変えず停止は unit の退役と別の口であること、 FR1059 (席の起動) による起こし直しと FR1038 (群の移動) の退避と判定は heartbeat が off でも撃つことを主張します。
  採用 — OPT1
  heartbeat SHALL 管理 tick が黙った席へ送る打刻の合図を指し、 管理 tick SHALL tick と呼ぶ (ADR-1058 の「heartbeat = 管理 tick」の読みを本 ADR が置き換える)。 器 SHALL seat heartbeat off|on|status (--state-dir と --target) の口を持ち、 off SHALL 席の状態の dir に停止の記録 (1 行 ts=<UTC>・一時 file → rename) を置き、 on SHALL それを消し (可逆)、 status SHALL on|off と最後の周の打刻を 1 行で出す。 管理 tick SHALL 判定の列の打刻の合図の段の前で停止の記録を読み、 在れば合図を送らず決定行を decision=noop reason=heartbeat-off (pointer=- step=-) とし、 死んだ席の起こし直し・移動の周の退避・群の判定 SHALL そのまま撃つ。 記録が在るのに読めない周 SHALL off と読む (合図は正の証拠でだけ送る)。 管理 tick SHALL 周ごとに席の状態の dir へ最後の周の打刻 (1 行 ts=<UTC> decision=<語> reason=<語>・一時 file → rename・rc 1 の周も) を書く。 seat tick status SHALL 席ごとに 1 行 (target= last=<ts> age=<秒> healthy=yes|no heartbeat=on|off step=<段> next=<秒|stopped>) を出し、 doctor の席の行 SHALL heartbeat= と tick= の 2 項目を持つ。 健全 SHALL 「今 − 最後の周の時刻 ≤ 2 × 周期の rules 行」で読み手が判じ、 tick SHALL NOT 判じない。 停止の記録の書き手 SHALL 器の口 1 本とし、 外の画面 SHALL 2 つの file を読んでよいが書かず、 止める・戻す SHALL 器の CLI を撃つ。 NoopReason SHALL 変種 heartbeat-off を末尾に足す。 tick の判定の列の順・梯子の列と記録・口座の門・入力欄の門・unit の導出と周期・event の種類・rules 行 SHALL 変えない (打刻は event log に書かない)。 要件 FR1078 / AC1048 の新設と FR1027 の語の改め (SRS v0.25) を伴い、 同じ PR で land する。
  （平易）heartbeat は、 見回り (管理 tick) が黙った席へ送る合図 (続きを進めてと促す 1 行) を指し、 見回りは tick と呼びます (前の決定 ADR-1058 の「heartbeat = 見回りの呼び名」の読みをこの記録が置き換えます)。 器は seat heartbeat off|on|status (state dir と席の target を指定) の口を持ち、 off は席の dir に停止の記録 (時刻 1 行・一時 file を置き換える形) を置き、 on はそれを消し (戻せます)、 status は on|off と最後に周った記録を 1 行で出します。 見回りは合図を送る段の前で停止の記録を読み、 在れば合図を送らず判定の行を noop / heartbeat-off にし、 落ちた席の起こし直し・移動のための退避・群の判定はそのまま撃ちます。 記録が在るのに読めない周も止めたと読みます (合図は確かな証拠があるときだけ送ります)。 見回りは毎周、 席の dir に「最後に周った記録」(時刻・判定・理由の 1 行・失敗した周も) を書きます。 seat tick status は席ごとに 1 行 (席・最後の時刻・経過秒・健全か・heartbeat の on/off・待ちの段・次の合図までの秒か停止) を出し、 doctor の席の行に heartbeat と tick の 2 項目を足します。 健全かは「今 − 最後の時刻 ≤ 周期 (規則の表の行) の 2 倍」で読む側が判じ、 見回りは判じません。 停止の記録の書き手は器の口 1 本で、 外の画面は 2 つの file を読んでよいが書かず、 止める・戻すは器の CLI を叩きます。 送らない理由の一覧に heartbeat-off を 1 つ足します。 見回りの判定の順・待ちの列と記録・口座の門・入力欄の門・unit と周期・記録の種類・規則の表は変えません (最後に周った記録は出来事の log に書きません)。 要件書の FR1078 / AC1048 の新設と FR1027 の語の改め (版 0.25) を伴い、 同じ PR で land します。
  （理由）持ち主の裁定は、 見回りは常にオンで heartbeat (合図) だけを席ごとに止めること、 止める口は簡単な CLI にすること、 画面にも見回りの健全さと合図の on/off と止める口を作ること、 の受諾でした。 heartbeat の語を合図に改めるのは、 持ち主が今回「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」と 2 つを分けて使ったからで、 語の指す先が動いたのに語彙を据え置くと、 裁定の文と器の語がずれます。 timer を止める案を退けたのは、 それでは口座の移動と落ちた席の起こし直しも止まり、 持ち主の「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」と逆だからです。 席ごとの記録 1 つにするのは、 「状況に応じて」の口は置く／消すだけの軽い可逆な形が合い、 規則の表や host の設定に持つと席を休ませるたびに設定の編集と裁定の印が要るからです (消えたら戻せない削除を断る決まりにも沿います)。 止めるのを合図だけにし起こし直しと退避と群の判定を撃つのは、 それらが「状態把握と口座の移動」という見回りの本来の仕事だからです。 最後に周った記録を席ごとの file にして log に書かないのは、 健全さは最新 1 件で足り、 15 秒ごと × 席数の行で便の状態の再生に関係ない log を肥やさないためです。 健全かを読む側が判じるのは、 宣言値と実測値と導出値を分ける決まりに沿い、 見回りが「自分は健全だ」と書く形を避けるためです。 書き手を器の 1 本にし画面は CLI を叩くのは、 道は 1 本の決まりで、 画面が壊れた記録を置く事故を作らないためです。 machine 全体の off を今は足さないのは、 席ごとの off を席の数だけ叩けば同じことができ、 要るときに足せばよいからです (足すときは最小に)。 file が 2 つ増えること・off の席が合図で起こされないこと・要件書の改訂と前の決定の語の読みの置き換えは、 代償として引き受けます。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1078（rationale）: FR1078 (新設・v0.25) は heartbeat の停止の口と tick の健康の打刻を書く。 本 ADR はその形 (席ごとの記録 1 つ・合図だけ止める・最後の周の打刻・status と doctor・書き手は器の 1 本) の根拠を与える (裁定 2026-09-26T00:53Z)。
  FR1027（rationale）: FR1027 (管理 tick) の label は v0.24 まで「管理 tick（heartbeat）」で、 heartbeat は tick の呼び名だった。 本 ADR は heartbeat を打刻の合図の呼び名に改め、 合図の停止 (FR1078) が FR1027 の合図を止め tick の他の仕事を止めない根拠を与える。
  FR1064（claim）: FR1064 (tick の unit) の導出と周期は変えない。 本 ADR は heartbeat の停止を unit の退役と別の口で行うと主張する。
  FR1059（claim）: FR1059 (席の起動) による死んだ席の起こし直しは、 heartbeat が off の席でも撃つ。 本 ADR は停止が合図だけに効くと主張する。
  FR1038（claim）: FR1038 (群の移動) の tick からの判定と退避は、 heartbeat が off の席でも撃つ。 本 ADR は停止が群の移動を止めないと主張する。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録は前の決定 ADR-1058 の「heartbeat = 見回りの呼び名」の読みだけを置き換え (heartbeat は合図を指し、 見回りは tick と呼びます)、 他は保ちます。 保つのは、 ADR-1058 の見回りを戻す 3 つの機構・判定の順・変化の測り方・待ちの記録・書けなければ送らない規則・口座の門、 ADR-1064 の unit の導出、 ADR-1066 の群の判定、 ADR-1068 の待ちの列と打ち切り、 の全部です。 この記録は受け入れ済み (accepted) で、 要件書の改訂 (版 0.25) と同じ PR で発効します。 原則は「止めるのは合図であって見回りではない。 止める口は席ごとに可逆で、 健康は打刻で見せ、 判じるのは読み手。」です。
  改訂状態: current
  置き換える ADR: ADR-1058
  置き換えられた: なし (現行)
  部分 supersede で、 置き換えるのは 1 つ — ADR-1058 の「heartbeat = 管理 tick の呼び名 (席を促す見回り)」の読み (heartbeat は打刻の合図を指し、 管理 tick は tick と呼ぶ) — で、 他は保つ。 保つのは、 ADR-1058 の管理 tick を戻す 3 つの機構・判定の列の順・変化の digest・梯子の記録・fail-closed・口座の門、 ADR-1064 の unit の導出、 ADR-1066 の群の判定、 ADR-1068 の梯子の列と打ち切り、 の全部。 発効は本 ADR が accepted になり FR1078 / AC1048 と FR1027 の改訂 (v0.25) が land した時点で、 同じ PR で land する。
  照会終端 — PRIN-STOP-THE-SIGNAL-NOT-THE-TICK
  止めるのは合図であって見回りではない。 止める口は席ごとに可逆で、 健康は打刻で見せ、 判じるのは読み手。
