  C2 (経路は 1 本) から、 停止の記録の書き手は器の口 1 本で、 外の画面 (別 project の board) は記録を読んでよいが書かず、 止める・戻すは器の CLI を撃つ。 C10 (宣言値・実測値・導出値を分ける) から、 最後の周の打刻（tick が最後に周った記録）は実測値 (時刻・判定・理由) で、 「健全か」はそれを読む側の導出値 (経過が周期の 2 倍以内) であり tick は判じない。 C17 (足すときに何を外すかを名指す) から、 足すのは停止の記録 1 file・最後の周の打刻 1 file・NoopReason の変種 1 つ・CLI の verb 1 つ (heartbeat) と status の口・doctor の項目 2 つで、 外すのは無い (合図の停止は列の末尾の停止と別の口)。 N1 (消えたら戻せない削除を断る) から、 停止の記録は消す (on) ことで戻る可逆な形。 ADR-1058 の管理 tick を戻す機構・判定の列の順・fail-closed、 ADR-1064 の unit の導出、 ADR-1066 の群の判定、 ADR-1068 の梯子の列は本 ADR の前提で、 変えるのは heartbeat の語の指す先だけ。
  CTX5 射程 — 動かすのは語・停止の口・健康の打刻・見せ方の 4 か所
  動かすのは (1) heartbeat の語の指す先 (管理 tick → 打刻の合図)、 (2) 席ごとの停止の口 (seat heartbeat off|on|status・記録 <state_dir>/seat/<target>/heartbeat-off・tick は合図の段の前で読み off なら noop reason=heartbeat-off)、 (3) 最後の周の打刻 (<state_dir>/seat/<target>/tick-last・1 行 ts= decision= reason=・rc 1 の周も書く)、 (4) 見せ方 (seat tick status の 1 行 target= last= age= healthy= heartbeat= step= next=・doctor の席の行に heartbeat= と tick=) の 4 つ。 動かさないのは、 tick の判定の列の順・死んだ席の起こし直し・移動の周の退避・群の判定・梯子の列と記録・口座の門・入力欄の門・unit の導出と周期・event の種類 (打刻は event log に書かない)・rules 行。
  （選択肢を測るものさし）この判断を評価する 4 本のものさしです。 見回りは止めず合図だけ止めること (口座の移動と状態把握は止まらず、 席を促す合図だけが状況に応じて止まる)。 止める口は席ごとで可逆で裁定が要らないこと (席の dir の記録 1 つを置く／消すだけで、 規則の表や host の設定を書き換えない)。 健全さは記録で見せ判じるのは読む側であること (見回りは毎周「最後に周った時刻と判定」を書き、 健全かは経過が周期の 2 倍以内かで読む側が導く)。 書き手は器の 1 本であること (外の画面は file を読んでよいが書かず、 止める・戻すは器の CLI を叩く) です。
