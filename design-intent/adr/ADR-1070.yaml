  main aa4bfe1 で、 管理 tick (seat/tick.rs) の周は front (登録 row の読み → 窓が shell なら死んだ席の起こし直し → 移動の周なら退避の門) → 打刻の合図 (黙りの初段・梯子の列・口座の門・入力欄の門) → back (群の判定・鮮度の窓に 1 回) の順で、 判定行（tick が周ごとに出す 1 行） (decision= target= reason= pointer= step= consumed= move= launched= judged=) を stdout に出し、 systemd の journal がそれを残す。 合図を止める分岐は無く、 止まるのは列が尽きた段 (pointer=stopped) だけ。 tick が周ごとに残す記録は判定行と群の判定の打刻 (<群用 dir>/<群>.judged) だけで、 席ごとの「最後に周った時刻」の file は無い。 合図の記録は <state_dir>/seat/<target>/pointer-ladder (送った周だけ書く)。 送らない理由は NoopReason の閉じた列 (18 種・歯の母集団) で、 判定行の reason= の語。 CLI は seat tick (1 回) / tick install / tick uninstall。 unit (ADR-1064) は周期 (rules 行 seat.tick_interval_s・15 秒) だけを読む。 tick の生死は systemctl --user list-timers でしか見えない。
