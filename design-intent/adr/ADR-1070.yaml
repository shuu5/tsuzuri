  ADR-1058 は管理 tick (席の外から周期で席を見て、 黙った席へ続きを促す 1 行 = 打刻の合図（続きを促す 1 行）を注入する仕組み) を器に戻し、 持ち主の裁定の語に合わせて heartbeat をその呼び名とした。 語彙 (vocabulary) の heartbeat も「ADR-1058 での管理 tick の呼び名」である。 ADR-1068 は合図の待ちを梯子の列 (30 分 → 1 時間 → 3 時間 → 6 時間 → 12 時間 → 24 時間) にし、 列が尽きた段で合図が止まると決めた。 人が状況に応じて (席を意図して休ませる・保守の周など) 合図だけを止める口は無く、 止めるには tick の timer (ADR-1064 の unit) を止めるしかないが、 それでは tick の他の仕事 (死んだ席の起こし直し・移動の周の退避・群の移動の判定) も止まる。
