    text: |
      heartbeat の語を「管理 tick が黙った席へ送る合図」に改め、 管理 tick は tick のまま。 CLI に seat heartbeat off|on|status を足し、 off は席の状態の dir に停止の記録 (1 行 ts=) を一時 file → rename で置き、 on は消す。 tick は合図の段の前で記録を見て、 在れば decision=noop reason=heartbeat-off で合図を送らず、 死んだ席の起こし直し・移動の周の退避・群の判定はそのまま撃つ。 記録が在るのに読めない周も off。 tick は周ごとに最後の周の打刻 (1 行 ts= decision= reason=・rc 1 の周も) を席の状態の dir に書き、 seat tick status が席ごとに 1 行 (target= last= age= healthy= heartbeat= step= next=) を出し、 doctor の席の行に heartbeat= と tick= を足す。 健全 = 経過が周期の 2 倍以内 (読み手が判じる)。 外の画面は 2 つの file を読んで表示し、 off / on は器の CLI を撃つ。 決め手は現物 (持ち主の裁定)。
      （平易）heartbeat の語を「見回りが黙った席へ送る合図」に改め、 見回りは tick のままにする案です。 CLI に seat heartbeat off|on|status を足し、 off は席の dir に停止の記録 (時刻 1 行) を置き、 on は消します。 見回りは合図を送る前に記録を見て、 在れば合図を送らず (判定の行は noop / heartbeat-off)、 落ちた席の起こし直し・退避・群の判定はそのまま撃ちます。 記録が在るのに読めない周も止めたと読みます。 見回りは毎周「最後に周った記録」(時刻・判定・理由) を席の dir に書き、 seat tick status が席ごとに 1 行 (最後の時刻・経過・健全か・on/off・段・次の合図) を出し、 doctor の席の行に 2 項目を足します。 健全かは経過が周期の 2 倍以内かで読む側が判じます。 外の画面は 2 つの file を読んで表示し、 止める・戻すは器の CLI を叩きます。 見回りの仕事は止まらず、 止める・戻すが戻せる記録 1 つで、 生死が file 1 つで分かり、 書き手が器の 1 本です。 代わりに、 席の dir に file が 2 つ増え毎周の書き込みが席の数だけ増えること、 off の席は起こし直し以外では起こされないこと、 要件書の改訂と前の決定の語の読みの置き換えを引き受けます。 決め手は現物 (持ち主の裁定) です。
      利点: tick の仕事 (起こし直し・退避・群の判定) は止まらず、 合図だけが席ごとに止まる (DR1)
      利点: 止める・戻すが記録 1 つの置く／消すで可逆、 裁定 id も host の面の編集も要らない (DR2)
      利点: tick の生死が systemctl を見ずに file 1 つで分かり、 別 project の画面が同じ file を読める (DR3)
