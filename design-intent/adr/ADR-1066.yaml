    name: "判定を 1 本に切り出し、 管理 tick が群ごとに鮮度の窓に 1 回まで lock の内側で撃つ (dispatch の群の段も同じ 1 本を呼ぶ)"
    text: |
      群の移動の判定（移るかを決める 1 本） (測る集合 → 計測 → 逼迫の読み → 移り先 → 移動の記録と承認 event・候補なしの断りの event・頼みの履歴化) を dispatch の群の段から 1 本の関数に切り出し、 群の記録の読み手と lock と同じ module に置く。 dispatch の 1 周の群の段はその 1 本を呼び (今と同じ lock・同じ順)、 退避の合図と起こし直しと保留の event と席への行は群の段に残る。 管理 tick は、 自席の anchor（repo の本体の場所） が群に属する周に、 host の群用 dir の群ごとの判定の打刻 (1 file) を読み、 前の判定から fleet.usage_fresh_s 以上が経っていれば (か打刻が無ければ) 同じ lock の内側で同じ 1 本を撃って打刻を書く。 判定の周だけ計測を起こしてよい (口は群の段と同じ鮮度つきの 1 本・頼みの在る群は鮮度に依らず・無い群は鮮度の外だけ)。 lock を取れない周は撃たずに今の列へ進む。 判定の後の続き (他の置き場の席の退避と起こし直し) は各席の tick の移動の門が今のまま自席に撃つ。 決め手は分析 (裁定の完全自律を、 判定を増やさず契機を 1 つ足す形で満たす)。
      （平易）群の移動の判定 (測る集合 → 計測 → 残りを読む → 移り先を決める → 移動の記録と承認の記録、 候補なしの断りの記録、 メモの履歴化) を 1 周の群の手番から 1 本の関数に切り出し、 群の記録の読み手と鍵と同じ場所に置く案です。 1 周の群の手番はその 1 本を今と同じ鍵の内側・同じ順で呼び、 古い席への合図・起こし直し・保留の記録・席の画面への行は自分に残します。 見回り (管理 tick) は、 自分の席の repo が群に属する周に、 共通の置き場にある群ごとの「最後に判定した時刻」を読み、 時刻が無いか鮮度の窓 (fleet.usage_fresh_s) より古ければ鍵の内側で同じ 1 本を撃って時刻を書き直します。 判定の周だけ口座を測ってよく (口は 1 周と同じ鮮度つきの計測の 1 本・メモのある群は窓に関係なく・無い群は窓の外だけ)、 鍵を取れない周は撃たずに今の列へ進みます。 判定の後の続き (他の置き場の席を終える・起こし直す) は、 各席の見回りの移動の門が今のまま自分の席に撃ちます。 便の無い host でも群が移り、 判定は 1 本のまま、 鍵と時刻で殺到せず、 変えない線は保たれ (群の手番の外形は動かず、 判定の 1 本は席の画面に触らない)、 見回りの計測は判定の周だけで rules 行は足しません。 代わりに、 見回りが計測の子 process を起こす周が生まれ要件 (FR1027・AC1018) の改訂を伴うこと、 要件 FR1038 のきっかけの文の改訂を伴い改訂までは何も拘束しないこと、 見回りの時計が無い席は今まで通り移らないこと、 共通の置き場に時刻の file が群ごとに 1 つ増え判定行に欄が増えること、 判定の切り出しが 1 周の群の手番の歯の範囲に及ぶこと、 見回りの判定は自分の置き場の記録しか読まず別の置き場の「便が使っている」を見ないことを引き受けます。 決め手は分析で、 完全自律の決定を、 判定を増やさずきっかけを 1 つ足す形で満たす案でした。
      利点: 便の無い host / project でも、 席が居る限り tick が判定を撃ち、 群が移る (DR1)
      利点: 判定は 1 本で、 群の段と tick が同じ関数を呼ぶ。 契機ごとに判定を書かない (DR2)
      利点: lock の内側で群ごとに 1 回、 打刻で鮮度の窓に 1 回まで＝置き場の数だけ tick が居ても判定は群ごとに鮮度の窓に 1 回で、 同じ口座へ殺到しない (DR3)
      利点: dispatch の 1 周の契機・記録と移り先の形・tick の梯子と口座の門・群の段の外形 (退避・起こし直し・通知・event) は動かず、 判定の 1 本は席の pane に触らない (DR4)
      利点: tick の計測は判定の周だけ (頼みの在る群は鮮度に依らず・無い群は鮮度の外だけ・群の段と同じ) で、 他の周は起こさない。 rules 行は足さない (DR5)
      欠点: 管理 tick が計測の子 process を起こす周が生まれる (鮮度の窓に群ごとに 1 回まで)。 要件 FR1027 / AC1018 の「測らない・計測の起動 0 件」の改訂を伴う
      欠点: 要件 FR1038 の契機の文の改訂を伴い、 改訂までは何も拘束しない
      欠点: tick の unit が無い席は今まで通り移らない (unit は席の起動が入れる・ADR-1064)
      欠点: host の群用 dir に判定の打刻の file が群ごとに 1 つ増え、 tick の判定行に判定の結果の欄が増える (外形 snapshot が動く)
      欠点: 判定の関数の純移動は群の段の歯の write-set に及ぶ (置き場を移すだけで判定の形は変えない)
      欠点: tick の判定は自席の置き場を入力にするので、 「便が使っていない」の条件は自席の置き場の live 便でしか判じられず、 別の置き場の live 便は見えない
    verdict: adopted
    reason: "決め手は分析 (裁定の完全自律を、 判定を増やさず契機を 1 つ足す形で満たす)。"
  - id: "OPT2"
    name: "timer で dispatch の 1 周を撃つ"
    text: |
      置き場ごとに timer を立て、 dispatch の 1 周 (群の段を含む) を周期で撃つ。 ADR-1055 OPT2 と同じ形。 決め手は分析 (周は pipeline と repo に結びつく)。
      （平易）置き場ごとに時計を立て、 1 周 (群の手番を含む) を周期で撃つ案です。 前の決定 (ADR-1055) の却下案と同じ形です。 判定の置き場を動かさず、 群の手番をそのまま周期で撃てる点で勝ります。 けれども、 1 周は pipeline と repo (置き場の台帳と契約表) に結びついていて、 便の無い host には周そのものが無く、 pipeline を持たない project は撃つ相手を持ちません。 置き場ごとに周を立てると、 群の判定が置き場の数だけ走り、 計測の子 process と記録が置き場の数だけ増えます。 決め手は分析です。
      利点: 判定の置き場を動かさず、 群の段をそのまま周期で撃てる
      欠点: dispatch の 1 周は pipeline と repo (置き場の台帳と契約表) に結びつき、 便の無い host では周そのものが無い。 pipeline を持たない project は撃つ相手を持たない (DR1)
      欠点: 置き場ごとに周を立てると、 群の判定が置き場の数だけ走る (lock で直列にはなるが、 計測の子 process と event が置き場の数だけ増える) (DR3)
    verdict: rejected
    reason: "決め手は分析 (周は pipeline と repo に結びつく)。"
  - id: "OPT3"
    name: "席自身の hook が判定して起こし直す"
    text: |
      SessionStart / UserPromptSubmit の hook が逼迫を読んだ周に、 移り先を決めて記録を書き、 自分を起こし直す。 ADR-1055 OPT3 と同じ形。 決め手は分析 (席は自分を起こす権能を持たない)。
      （平易）席が話す番の hook が残りを読んだ周に、 移り先を決めて記録を書き、 自分を起こし直す案です。 前の決定 (ADR-1055) の却下案と同じ形です。 きっかけが席の話す番にあり、 時計も見回りも要らない点で勝ります。 けれども、 席は自分を起こす権能を持たず (ADR-1045)、 hook の席は作業中で退避の合図と起こし直しの門を通りません。 置き場ごとに判断が割れ、 同じ群の席が同じ口座へ殺到します。 話す番の無い席 (黙っている席・便の無い host で待つ席) には判定が届きません。 決め手は分析です。
      利点: 契機が席の話す番に在り、 timer も tick も要らない
      欠点: 席は自分を起こす権能を持たない (ADR-1045・ADR-1055 OPT3 の却下)。 hook の席は作業中で、 退避の合図と起こし直しの門を通らない (DR4)
      欠点: 置き場ごとに判断が割れ、 同じ群の席が同じ口座へ殺到する (群単位の 1 回にならない) (DR3)
      欠点: 話す番の無い席 (黙っている席・便の無い host で待つ席) は判定に届かない (DR1)
    verdict: rejected
    reason: "決め手は分析 (席は自分を起こす権能を持たない)。"
  - id: "OPT4"
    name: "人が見る"
    text: |
      器は通知と移動を頼む記録までにとどめ、 移動は人が 1 周を手で撃つか、 doctor を見て判断する。 決め手は分析 (裁定に反する)。
      （平易）器は通知と「移動を頼むメモ」までにとどめ、 移動は人が 1 周を手で撃つか、 doctor を見て判断する案です。 器が周期で計測の子 process を起こす周が生まれない点で勝ります。 けれども、 群の口座の移動を含めて器が完全に自律するという決定に反し、 便の無い host では人が 1 周を撃つまで永久に待ちます (今日の実測そのものです)。 決め手は分析です。
      利点: 器が周期で計測の子 process を起こす周が生まれない
      欠点: 完全自律の裁定に反する。 便の無い host では人が 1 周を撃つまで永久に待つ (今日の実測そのもの) (DR1)
    verdict: rejected
    reason: "決め手は分析 (裁定に反する)。"
  - id: "OPT5"
    name: "tick は判定せず、 移動を頼む記録を dispatch の 1 周が拾うまで待つ (今の形)"
    text: |
      席の hook が置いた移動を頼む記録を、 次の dispatch の 1 周の群の段が読んで判定する。 今の形のまま。 決め手は現物 (2026-09-25 の実測)。
      （平易）席の hook が置いた「移動を頼むメモ」を、 次の 1 周の群の手番が読んで判定する、 今の形のままの案です。 判定のきっかけが 1 周だけで、 見回りは計測も判定も持たない点 (前の決定のまま) で勝ります。 けれども、 便の無い host では次の 1 周が来ず、 メモは永久に待ちます (2026-09-25 の実測)。 pipeline を持たない project の席は、 群に属していても移りません。 決め手は現物です。
      利点: 判定の契機が dispatch の 1 周だけで、 tick は計測も判定も持たない (ADR-1055 のまま)
      欠点: 便の無い host では次の 1 周が来ず、 頼みの記録は永久に待つ (2026-09-25 の実測) (DR1)
      欠点: pipeline を持たない project の席は、 群に属していても移らない (DR1)
    verdict: rejected
    reason: "決め手は現物 (2026-09-25 の実測)。"
basis: [FR1027, FR1033, FR1038, FR1040, FR1064, AC1018, ADR-1020, ADR-1045, ADR-1049, ADR-1055, ADR-1058, ADR-1064, ADR-1065]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「席」は人と AI が話す 1 つの session、 「口座」は席が使う Claude Code の login 単位、 「群」は同じ口座を共有する project のかたまり、 「群の移動」は残りが少なくなった口座から群ごと別の口座へ移ることです。 前の決定 (ADR-1055) は、 群の残りを測って移すきっかけを「作業 (便) が 1 つ終わった直後に器が回す 1 周」と「席が話す番のたびに動く仕組み (hook)」の 2 つに置き、 時計は持たないと決めました。 その後、 席ごとに周期で回る見回り (管理 tick) が器に戻り、 見回りは「移動が決まった後の続き」(古い席を終えて、 新しい口座で席を起こし直す) を自分の席に撃つようになりましたが、 「移るかどうかを決める判定」(残りを読む → 移り先を決める → 記録と承認を書く) は今も 1 周の中にしかありません。 2026-09-25 の実測で、 群の記録が動いたのは pipeline が 1 周を撃った瞬間だけで、 pipeline を持たない project (設計だけの repo) は誰も移さないことが分かりました。 この記録は、 その判定を 1 周の中から 1 本の関数に切り出し、 1 周と見回りが同じ 1 本を鍵 (lock) の内側で呼ぶと決めます。 見回りはその判定を群ごとに「計測をやり直さない窓」(鮮度) に 1 回までしか撃たず、 判定の周だけ口座の残りを測ってよいことにします (席が「移してほしい」と置いたメモがある群は窓に関係なく測り、 無い群は窓の外だけ測ります)。 判定の 1 本は、 古い席を終える手も席を起こし直す手も撃ちません。 その 2 つの手は 2 系統のままです: 便の終端の 1 周は自分の置き場の席にこれまで通り撃ち、 他の置き場の席には各席の見回りが自分の席にだけ撃ちます。 便の終端の 1 周の判定は残り、 1 周を時計で撃たない線も保ちます。 要件書では、 群の逼迫の通知と移動 (FR1038) のきっかけに見回りの周期を足し、 見回りは測らない (FR1027・受入基準 AC1018) の文を改める改訂を伴います (改訂は持ち主が要件書の編集の口で行います)。 この記録は、 受け入れられ要件書が改訂されるまで何も拘束しない発効前 (proposed) の記録です。
approval:
  who: 持ち主
  date: 2026-09-25
  ruling: "s2-07l.629（器の台帳の id・器の記録の承認の欄が名指す・取り込みの裁定 t3-hub.74.60.1:20261004T0113Z-1）"
  verbatim: "器の台帳 s2-07l.629 の notes に在る（この file に写さない）"
  surface: R-8
consequences:
  - "この判断で良くなること 4 つと、 代わりに引き受けること 6 つです。 良くなるのは、 便の無い host や project でも席と見回りがある限り群が移り「移動を頼むメモ」が永久に待つ形が消えること、 判定が 1 本のままきっかけが 3 つになること、 置き場の数だけ見回りがいても判定は群ごとに鮮度の窓に 1 回で殺到が構造で起きないこと、 退避と起こし直しが 2 系統 (1 周は自分の置き場・各席の見回りは他の置き場) のままで判定の 1 本は席の画面に触らず、 記録と移り先の形や 1 周のきっかけと群の手番の外形が動かないことです。 引き受けるのは、 見回りが計測の子 process を起こす周が生まれ、 前の決定 (ADR-1058) の「見回りは費用を持たない」と「見回りは残りを測らない」という前提の文が判定の周に限って古くなること、 要件書 (FR1038・FR1027・AC1018) の改訂を伴い改訂まで何も拘束しないこと、 見回りの時計が無い席は今まで通り移らないこと、 共通の置き場に判定の時刻の file が群ごとに 1 つ増え判定行に欄が増えること (1 本が止まった周は理由の語を載せて今の列へ進み、 移動は起きない)、 判定の切り出しが 1 周の群の手番の歯の範囲に及ぶこと (判定の形は 1 字も変えない)、 見回りの判定は自分の置き場の記録しか読まないので「便が使っていない」を別の置き場については判じられないことです。"
  - "良い結果: 便の無い host / project でも、 席が居て tick の unit が在る限り、 群の移動の判定が群ごとに鮮度の窓に 1 回まで撃たれ、 群が移る。 移動を頼む記録が永久に待つ形が消える"
  - "良い結果: 判定は 1 本で、 dispatch の 1 周の群の段と管理 tick が同じ関数を同じ lock の内側で呼ぶ。 契機が 3 つになっても判定の写しは 1 つのまま (C2・純移動)"
  - "良い結果: 置き場の数だけ tick が居ても、 判定は群ごとに鮮度の窓に 1 回で、 lock が同じ周の二重の判定を止める。 同じ群の席が同じ口座へ殺到する形は構造で起きない (ADR-1055 CSQ-P3 のまま)"
  - "良い結果: 退避と起こし直しは 2 系統のまま — 便の終端の周の群の段は自分の置き場の席に今まで通り撃ち、 他の置き場の席は各席の tick の移動の門が自席に撃つ。 判定の 1 本は席の pane に触らず、 記録と移り先の形・tick の梯子と口座の門・dispatch の 1 周の契機と群の段の外形は動かない"
  - "代償: 管理 tick が計測の子 process を起こす周が生まれる (群ごとに鮮度の窓に 1 回まで・判定の周だけ)。 ADR-1058 の「見回り自体は費用を持たない」と、 ADR-1058 が ADR-1055 と衝突しない理由に置いた「tick の timer は逼迫を測らない」という前提の文は、 判定の周に限って古くなる"
  - "代償: 要件 FR1038 の契機と FR1027 / AC1018 の「測らない・計測の起動 0 件」の改訂を伴う。 改訂が land するまで本 ADR は何も拘束せず、 実装の便は改訂の後にしか出せない"
  - "代償: tick の unit が無い席 (unit は席の起動が入れる・ADR-1064) は今まで通り移らない。 群の判定は「席が居る host」でだけ進む"
  - "代償: host の群用 dir に判定の打刻の file が群ごとに 1 つ増え、 tick の判定行に judged= の欄が増える (外形 snapshot が動く)。 1 本が typed に止まる周 (面・閾値の行・event log・打刻が読めない) は judged=error:<語> で今の列へ進み、 移動は起きない"
  - "代償: 判定の関数の切り出しは純移動で、 群の段の歯の write-set に及ぶ。 判定の形 (移り先の 3 条件・記録・承認 event・断り) は 1 字も変えない"
  - "代償: tick の判定は自席の置き場を入力にするので、 移り先の「便が使っていない」の条件は自席の置き場の live 便でしか判じられない。 pipeline を持たない置き場の tick は別の置き場の live 便を見ない (置き場を跨いで live 便を読む形は本 ADR では足さない)"
