  器の案の章の要約: 候補を 5 つ並べます。 判定を 1 本に切り出して見回りが群ごとに鮮度の窓に 1 回まで鍵の内側で撃つ案 (選んだ案・1 周の群の手番も同じ 1 本を呼ぶ)、 時計で 1 周を撃つ案、 席自身の hook が判定して起こし直す案、 人が見る案、 見回りは判定せず「移動を頼むメモ」を 1 周が拾うまで待つ案 (今の形) です。 却下した 4 案にも利点を並べ、 退けた決め手が現物か分析かを各案に書きます。 時計で 1 周を撃つ案は判定の置き場を動かさずに済む点で、 hook が判定する案は時計も見回りも要らない点で、 人が見る案は器が周期で計測の子 process を起こさない点で、 今の形のまま待つ案は見回りが計測も判定も持たない点で、 選んだ案に勝ります。
  器の専門語の説明: 本文に出てくる専門語 16 個を、 やさしい言葉で説明します。 この記録で意味を決めた語は「群の移動の判定」と「判定の打刻」の 2 つで、 残りは器と前の決定の側の言葉です。
  ・群の移動の判定（group move judgement）: 測る集合を取り、 計測し、 群の今の口座の逼迫を読み、 移り先を候補の順で 1 回決め、 群の今の口座の記録と承認 event (候補なしなら断りの event) を書き、 移動を頼む記録を履歴へ移す 1 本の関数 (移り先の 3 条件と記録の形は ADR-1049)。 出力は閉じた 3 値 (移った / 移らない / 候補なし)。 退避・起こし直し・席の pane への行は持たない。 本 ADR で dispatch の群の段から切り出し、 群の段と管理 tick が host の lock の内側で呼ぶ。
  ・管理 tick（management tick）: 席の外から周期 (rules 行 seat.tick_interval_s) で回り、 席が黙っていないかを見て条件が揃った周だけ続きを促す 1 行を注入する仕組み (ADR-1058)。 群の記録と自席の口座が違う周は退避と起こし直しを自席に撃つ (seat-heartbeat.md §4 / §7)。 本 ADR の後は群の移動の判定も群ごとに鮮度の窓に 1 回まで撃つ。
  ・群の段（group stage）: dispatch の 1 周の頭で走る、 群ごとの計測・通知・移動・退避の合図・起こし直しの段 (account-lifecycle.md §19 / §20)。 host の lock の内側で走り、 便の列の rc を変えない。 本 ADR の後は判定を自分で持たず 1 本の関数を呼び、 退避の合図・起こし直し・保留の event・席への行は自分の置き場の席に今まで通り撃つ。
  ・dispatch の 1 周（dispatch round）: 契約の列を読んで起こせる便を起こす器の 1 巡 (設計 dispatcher.md)。 便の終端・手動・印の直後に撃たれ、 時計では撃たれない (ADR-1055・本 ADR でも変えない)。 pipeline と repo に結びつくので、 便の無い host には無い。
  ・判定の打刻（judgement stamp）: host の群用 dir に群ごとに 1 file (<群>.judged・ts の 1 行) で持つ、 最後に群の移動の判定を撃った UTC 秒。 管理 tick はこれと rules 行 fleet.usage_fresh_s を比べて判定を撃つかを決め、 撃った周に今の ts で書く。 rules 行は足さない。
  ・鮮度（freshness）: 口座の計測の値を新しいと見なす秒数 (rules 行 fleet.usage_fresh_s)。 窓の内側では usage API を撃ち直さない (ADR-1020・account-autonomy.md §13)。 移動を頼む記録が在る群だけは窓に依らず測る。 本 ADR は tick の判定の周の上限にも同じ行を使う。
  ・lock（lock）: host の群用 dir に置く排他の file (create_new)。 群の段と tick の移動の門が既に共有し、 本 ADR の後は tick の判定も同じ鍵の内側で撃つ。 取れない周は判定を撃たず今の列へ進む (止めない)。
  ・host の根（host root）: state dir (置き場) の親の下の host 用 dir。 置き場を跨いで同じ 1 つで、 群用 dir (群の今の口座の記録・移動を頼む記録・lock・本 ADR の判定の打刻) を持つ (ADR-1049)。
  ・移動を頼む記録（move request record）: 席自身の hook が逼迫を読んだ周に host の群用 dir へ置く群ごとに高々 1 件の記録 (ADR-1055)。 判定はこれを読んで鮮度に依らず計測し、 判定の後に履歴の側へ移す。 本 ADR の後は dispatch の 1 周を待たず、 次の tick の判定の周も拾う。
  ・退避の合図（evacuation signal）: 移動の周に古い席の画面へ注入する 1 行 (作業記憶を台帳と git に残して /exit)。 送り手は 2 系統: 便の終端の周の群の段は自分の置き場の席へ今まで通り送り、 他の置き場の席には各席の管理 tick の移動の門が自席に /exit (か dialog の Enter) を撃つ (seat-heartbeat.md §4 / §7)。 判定の 1 本は送らない。
  ・移動の門（move gate）: 管理 tick の判定の列のうち、 群の今の口座と自席の登録 row の口座が違う周に、 退避 (/exit か dialog の Enter) か起こし直し (会話の resume を含む) を自席にだけ撃つ段 (seat-heartbeat.md §4 / §7)。 本 ADR の判定の周はこの門の前に置き、 判定の側は他の席に触らない。
  ・hook（hook）: 席 (Claude Code の session) が決まった瞬間 (開始・話す番の直前・道具の直前・圧縮の直前・話す番の終わり) に器を呼ぶ口。 群の逼迫の側では通知と移動を頼む記録までを撃ち、 判定は撃たない (ADR-1055 OPT3 の却下のまま)。
  ・usage API（usage API）: 口座ごとの使用率 (5 時間窓・7 日窓・モデル別窓) を返す外部の口。 器は鮮度つきの計測の 1 本でこれを撃ち、 鮮度の内側では撃ち直さない。 本 ADR の tick の判定の周も同じ 1 本を使う。
  ・rules 行（rules row）: 器の規則の manifest に置く 1 行 (id・種類・値・裁定 id・裁定日)。 閾値 3 本・鮮度・tick の周期はこの形で持つ。 本 ADR は行を足さず、 既存の行を読む。
  ・裁定 id（ruling id）: user 裁定を一意に指す id。 裁定の時刻 (UTC)。 本 ADR は 2026-09-25T04:13Z を指す。
  ・anchor（anchor）: 対象 repo の main checkout の絶対 path。 席と便の鍵の一部 (SRS FR1040)。 群の宣言は anchor の列で群を名指し、 tick は自席の登録 row の anchor から群を引く。
