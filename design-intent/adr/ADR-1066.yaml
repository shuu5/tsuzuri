# 判断の記録 ADR-1066 — 器 scribe2 の判断の記録 ADR-0066 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1066
title: "管理 tick が群の移動の判定を撃つ — dispatch の 1 周の群の段と同じ 1 本の判定 (逼迫の読み → 移り先 → 記録 → 承認 event) を、 席ごとの管理 tick が host の lock の内側で群ごとに鮮度の窓に 1 回まで撃ち、 便の無い host でも群が移る。 判定は 1 本に切り出して周と tick が同じ 1 本を呼び、 退避と起こし直しは便の終端の周の群の段 (自分の置き場の席) と各席の tick の移動の門 (他の置き場の席) が撃ち、 dispatch の 1 周を timer で撃たない線は保つ (ADR-1055 の契機の部分を supersede・要件 FR1038 の改訂を伴う)"
status: accepted
date: 2026-09-25
context: |
  ADR-1055 は群の逼迫の契機を「便の終端の周 (dispatch の 1 周) と席自身の hook の 2 系統」に置き、 timer を持たないと決めた。 その後 ADR-1058 が管理 tick を席ごとの周期の見回りとして器に戻し、 tick は「群の記録と自席の口座が違う周」に退避と起こし直しの続きを自席に撃つ (設計 seat-heartbeat.md §4 / §7) が、 判定 (逼迫の読み・移り先・記録・承認 event) は今も dispatch の 1 周にしか無い。 2026-09-25 の実測で、 群の記録が動いたのは pipeline が 1 周を撃った瞬間だけで、 pipeline を持たない project (設計だけの repo) は誰も移さず、 席の hook は通知と「移動を頼む記録」までで判定は撃たないことが分かった。 本 ADR は、 群の移動の判定を dispatch の群の段から 1 本の関数に切り出し (置き場は群の記録の読み手と lock と同じ)、 dispatch の 1 周と管理 tick が同じ 1 本を host の lock の内側で呼ぶと決める。 tick はその判定を群ごとに鮮度の窓 (rules 行 fleet.usage_fresh_s) に 1 回まで撃ち、 判定の周だけ計測を起こしてよい。 判定の 1 本は退避も起こし直しも撃たず、 便の終端の周の群の段は自分の置き場の席に今まで通り撃ち、 他の置き場の席は各席の tick の移動の門が撃つ。 要件 FR1038 の契機に tick の周期を足す改訂を伴う (SRS の改訂は持ち主が spec の編集の口で行う)。
  なぜこの判断が要るのかを、 経緯・実測・器の今の部品・要件書との関係・これまでの決まり・この判断の範囲の 6 つから説明します。 前の決定 (ADR-1049) は席の口座を群 (project のかたまり) で持ち、 残りが線を越えたら群ごと別の口座へ移ると決め、 次の決定 (ADR-1055) はそのきっかけを「便が終わった直後の 1 周」と「席が話す番の hook」の 2 つに置き、 時計を持たないと決めました。 その後 ADR-1058 が席ごとの見回り (管理 tick) を器に戻し、 ADR-1064 が見回りの時計を席の起動が入れる形にし、 設計 doc は見回りに「移動が決まった後の続き」(古い席を終える・新しい口座で起こし直す) を自分の席に撃たせました。 けれども判定そのものは 1 周の中にしかありません。 2026-09-25 の実測では、 群の記録が動いたのは pipeline が 1 周を撃った瞬間だけで、 pipeline を持たない project は誰も移さず、 席の hook は知らせて「移動を頼むメモ」を置くまでで、 見回りは「測らない・子 process を起こさない」ままでした。 器の部品を見ると、 1 周の群の手番 (群の段) は鍵を取り、 群ごとに今の口座と測る集合を決め、 口座ごとに 1 回だけ計測し、 逼迫なら移り先を決めて記録と承認を書き、 古い席へ合図を送って起こし直します。 逼迫は今の口座のいちばん新しい実測で読みますが、 移り先には窓の内側の新しい実測が要るので、 測らない周は移り先を持てません。 「便が使っていない」の条件は、 呼んだ側の置き場の記録で判じます。 群の記録の読み手・移動を頼むメモ・鍵・逼迫の判定は同じ場所にあり、 見回りの移動の門はその鍵と読み手をすでに呼んでいます。 要件書では、 FR1038 がきっかけを 2 つと書き、 FR1027 と受入基準 AC1018 が「見回りは測らない・計測の起動 0 件」と書いているので、 この判断はそれらの改訂を伴います。 決まりの側では、 経路は 1 本 (判定を 2 か所に書かない)・状態は型で運ぶ、 が効き、 「足す前に外す物を名指す」決まりについては、 判定は場所を移すだけ (純移動) で、 足すのは判定の時刻の file 1 種と見回りが計測を撃つきっかけ 1 つ、 rules 行は足さない、 と読みます。 動かすのは判定の置き場ときっかけだけで、 移り先の決め方・記録の形・鍵・便の終端の 1 周の群の手番 (残る・同じ 1 本を呼ぶ)・hook の役目・見回りの梯子と合図・退避と起こし直しの 2 系統は動かしません。
  CTX1 経緯 — 契機を 2 系統に置いた決定と、 その後に戻った tick
  ADR-1049 は席の口座を project の群で持ち、 閾値を越えたら群ごと別の口座へ移ると決め、 ADR-1055 はその契機を「便の終端の周 (dispatch の 1 周（器が次の作業を配る 1 巡）) と席自身の hook（席の節目に自動で動く仕組み） の 2 系統」に置き、 timer・常駐 process を持たないと決めた (OPT2「timer で dispatch の 1 周を撃つ」と OPT3「席自身の hook が判定して起こし直す」は却下)。 その後 ADR-1058 が管理 tick（席を周期で見る仕組み） (席ごとに systemd の timer で周期に回る見回り) を器に戻し、 ADR-1064 が tick の unit を席の起動が入れる形にした。 設計 seat-heartbeat.md §4 / §7 は tick に「群の記録と自席の口座が違う周」の続き (自席への /exit・shell に戻った窓への起こし直し・会話の resume) を持たせたが、 判定 (逼迫の読み・移り先・記録・承認 event) は dispatch の 1 周の群の段（1 周の中の群の手番）にしか無い。 2026-09-25T04:13Z の裁定は、 群の口座の移動を含めて器が完全に自律する方針を受諾した。 要旨だけを写し、 逐語は非公開の作業記録簿 (台帳 s2-07l.629) に在る。
  CTX2 実測 — 便の無い host では群は移らない
  2026-09-25 の実測で、 群の今の口座の記録が動いたのは、 scribe2 の pipeline が便の終端か手動で 1 周を撃った瞬間だけであった。 pipeline を持たない project (設計だけの repo など) の席は、 同じ群に属していても、 その置き場で誰も判定を撃たない。 席自身の hook は SessionStart と UserPromptSubmit で自席の口座の逼迫を読んで告げ、 移動を頼む記録（席が置く移動のメモ）を host の根（machine 共通の置き場）に置くまでで (account-lifecycle.md §19 形 5・§20 形 4)、 判定は撃たない。 管理 tick は席ごとに周期で回っているが、 今は「測らない・子 process を起こさない」(seat-heartbeat.md §2 形 4・AC1018 の「tick の周に計測の起動が 0 件」) で、 移動の門（tick が自席を移す手）は群の記録を読むだけである。 つまり ADR-1055 CSQ-N1 の「席も便も動いていない周は測らず、 手で 1 周を撃つまで移動は起きない」が、 便の無い host では「永久に待つ」に化けている。
  CTX3 現物 — 判定は群の段の中に、 続きは tick の中に、 別々に在る
  base 67e74ff で、 dispatch の 1 周の群の段は 1 関数 (round) が、 host の面を合わせた manifest → 閾値の行 (Caps) → host の群用 dir の lock（1 度に 1 つ通す鍵） (create_new) → 群ごとの計画 (今の口座の解決・測る集合 = 今の口座 ∪ 群の置き場の席の登録 row の口座・移動を頼む記録の有無) → 口座ごとに 1 周に 1 回の計測 (頼みの在る群は鮮度（計測をやり直さない窓）に依らず、 他は鮮度の外だけ・口は計測の鮮度つきの 1 本) → event log の読み直し → 群ごとの 1 手 (記録が在って登録 row が遅れた席が在れば起こし直しの続き / 逼迫なら移り先を 1 回決めて記録・承認 event・退避の合図・起こし直し / 候補なしなら断りの event と席への断りの 1 行 / 逼迫でなければ通知) の順で撃つ。 逼迫は群の今の口座の最新の実測 (鮮度を問わない) で読み、 移り先には候補の 3 窓とも閾値未満の鮮度の内側の実測が要る＝計測を起こさない周は移り先を持てない。 「便が使っていない」の条件は呼び手の置き場の event log の live 便で判じる。 保留の event は起こし直し (relaunch) が記し、 断りの 1 行・逼迫の通知・退避の合図は群の置き場の席の pane へ送る。 群の記録の読み手 (current_of・記録 > 種)・移動を頼む記録 (put_request)・lock・逼迫の判定 (pressed) は群の記録と同じ module に在り、 tick の移動の門はその lock と読み手を既に呼ぶ。 tick の判定の列は front (登録 row → 窓が shell か → 打刻 → 梯子) → moving (群の記録と自席の口座の比較・lock・shell なら起こし直し・claude なら /exit か Enter) → back (黙り・上限・床・口座の門・入力欄・記録・注入) で、 計測の鮮度の内側の最新の回 (fresh_rows) を読むだけで計測は起こさない。 rules 行（裁定つきの値を持つ設定の行）は fleet.usage_fresh_s (計測の鮮度・300 秒)・fleet.group_pressure_5h_pct / _7d_pct / _model_pct (閾値 85 / 95 / 95)・seat.tick_interval_s (tick の周期・60 秒) が在る。 host の群用 dir は置き場の親の下＝置き場を跨いで同じ 1 dir で、 群ごとに今の口座の記録 1 file と移動を頼む記録 1 file を持つ。
  CTX4 要件文との関係 — FR1038 の契機と、 tick の「測らない」の文
  SRS FR1038 は群の逼迫の契機を「便の終端の周 (dispatch の 1 周) と席自身の hook の 2 系統」と書き、 「管理 tick (FR1027) の timer (FR1064) は群の逼迫を測らず計測も起こさず、 tick の口座の門は計測の記録の最新値を読むだけ」と書く。 FR1027 は「群の逼迫 (FR1038) は測らず」と書き、 AC1018 は「tick の周に計測 (FR1033) の起動が 0 件」を歯の受入に持つ。 本 ADR は FR1038 の契機に tick の周期を足し、 FR1027 と AC1018 の「測らない・計測の起動 0 件」を「判定の周 (群ごとに鮮度の窓に 1 回まで) だけ計測を起こしてよい」に改める改訂を伴う。 SRS の改訂は持ち主が spec の編集の口で行い、 本 ADR は改訂までは proposed で何も拘束しない (ADR-1055 CTX4 と同じ順)。
  CTX5 憲法と既存の決定の向き (本 ADR の解釈)
  C2 は経路を 1 本にする (判定の関数は 1 つ・契機ごとに書かない)。 C17.2 は record・rules 行・mechanism を足すときに何を外すかを名指させる。 本 ADR の読みでは、 判定は純移動 (場所を移すだけで写しを作らない) で、 足すのは判定の打刻（最後に判定した時刻）の file 1 種 (群ごとに 1 file) と tick が計測を撃つ契機 1 つであり、 rules 行は足さない (判定の間隔は鮮度の行で足りる)。 C3 は状態を型で運び、 端末の見た目や自由文を判定に使わない。 C10 は宣言値と実測値と導出値を型で分け、 C11 は失敗と極性を型で持つ。 A1 は消す・出す・使うの 3 クラスを user に聞くが、 口座を使うこと自体は群の宣言の常設の承認 1 回で以後は都度聞かない (ADR-1049 §2・移動の承認 event はその写し)。 ADR-1055 の原則「逼迫は何かが動いた周にだけ進むので、 動いた周に測る」は、 便の無い host では「動いた周」が席の話す番しか無く、 席は自分を起こす権能を持たない (ADR-1045・ADR-1055 OPT3 の却下) ので、 判定の契機が消える。 ADR-1058 は tick を「席の外から周期で回り、 見回り自体は席を起こさず費用を持たない」仕組みとして戻し、 ADR-1055 と衝突しない理由として「tick の timer は逼迫を測らない」という前提の文を置いた。 ADR-1049 (群・鍵・記録・移り先の 3 条件) と ADR-1020 §2.4 (候補なしの周は立て直さない) は不変。 ADR-1065 は移り先の口座の trust の印を席の起動が置くと決め、 起こし直しの人の手を消した＝本 ADR の完全自律はその上に立つ。
  CTX6 射程 — 動かすのは判定の置き場と契機だけ
  動かすのは (1) 判定を 1 本の関数に切り出す置き場 (群の記録の読み手と lock と同じ module)、 (2) tick がその判定を群ごとに鮮度の窓に 1 回まで撃つ契機と、 その打刻の file (host の群用 dir に群ごとに 1 file・rules 行は足さない)、 (3) 判定の周に計測を起こしてよいこと、 の 3 つ。 1 本の範囲は「測る集合 → 計測 → 判定 → 移動の記録と承認 event・候補なしの断りの event・頼みの履歴化」までで、 出力は閉じた enum (移った / 移らない / 候補なし)。 退避と起こし直しは 2 系統で、 便の終端の周の群の段は自分の置き場の席に今まで通り (退避の合図（古い席へ「終えて」の 1 行） → 起こし直し・保留の event) 撃ち、 他の置き場の席は各席の tick の移動の門 (§4 / §7) が自席に撃つ。 判定の 1 本はどちらも撃たず、 席の pane にも触らない — 他の置き場の席の pane に触る形は設計 §9 が退け (tick が判定だけして退避も自分で全席に送る案)、 列に無い置き場の席を列が起こす形は設計 §4 が退けた (登録 row の書き手が置き場の外に増える)。 動かさないのは、 移り先の 3 条件と記録の形と承認 event の kind と detail (ADR-1049・§20 形 5 / 6)、 lock の 1 本、 便の終端の周の群の段の外形 (通知・断りの 1 行・退避・起こし直し・event)、 席の hook の通知と移動を頼む記録 (§19 形 5・§20 形 4)、 tick の梯子と打刻の合図と口座の門 (ADR-1058)、 tick の移動の門、 tick の unit と周期の rules 行 (ADR-1064)、 dispatch の 1 周の契機 (timer で撃たない・ADR-1055)。
  （選択肢を測るものさし）この判断を評価する 5 本のものさしです。 便の無い host や project でも群が移ること (きっかけが pipeline の有無に依らない)。 判定は 1 本で、 1 周と見回りが同じ関数を呼び、 きっかけごとに判定を書かないこと。 殺到しないこと (判定は鍵の内側で群ごとに 1 回、 見回りの周は鮮度の窓で上限し、 置き場の数だけ走らせない)。 変えない線を保つこと (1 周を時計で撃たない・記録と移り先の形・見回りの梯子と口座の門・群の手番の外形・退避と起こし直しは 1 周が自分の置き場に、 各席の見回りが他の置き場に撃つ 2 系統で、 判定の 1 本は席の画面に触らない)。 見回りの計測は判定の周だけにすること (判定は新しい実測で残りを読むが移り先には窓の内側の実測が要るので判定の周は測ってよく、 メモのある群は窓に関係なく、 無い群は窓の外だけ、 他の周は起こさない。 要件の「測らない」は改訂で置き換える) です。
  DR1｜便の無い host / project でも群が移る — 判定の契機が pipeline の有無に依らない (完全自律の裁定) CTX1 (裁定)・CTX2 (実測)
  DR2｜判定は 1 本 — 群の段と tick が同じ関数を呼び、 契機ごとに判定を書かない (C2・純移動) CTX3・CTX5
  DR3｜殺到しない — 判定は host の lock の内側で群ごとに 1 回、 tick の周は鮮度の窓で上限し、 置き場の数だけ走らせない CTX3 (lock と群用 dir は置き場を跨いで 1 つ)・CTX5 (ADR-1055 OPT3 の却下の理由)
  DR4｜変えない線を保つ — dispatch の 1 周を timer で撃たない (ADR-1055)・記録と移り先の形 (ADR-1049)・tick の梯子と口座の門 (ADR-1058)・群の段の外形・退避と起こし直しは群の段 (自分の置き場) と各席の tick の門 (他の置き場) の 2 系統で、 判定の 1 本は席の pane に触らない CTX5・CTX6 (設計 §9 / §4 の却下の根)
  DR5｜tick の計測は判定の周だけ — 判定は最新の実測で逼迫を読むが移り先には鮮度の内側の実測が要るので、 判定の周は計測してよく (頼みの在る群は鮮度に依らず・無い群は鮮度の外だけ)、 他の周は起こさない。 要件の「測らない」は改訂で置き換える CTX3 (逼迫と移り先の読み・鮮度の行)・CTX4 (FR1027 / AC1018)
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 器は、 群の移動の判定 (測る集合を取る → 計測する → 群の今の口座の残りを読む → 移り先を決める → 群の今の口座の記録と承認の記録を書く、 候補が無ければ断りの記録を書く、 「移動を頼むメモ」を履歴へ移す。 結果は「移った / 移らない / 候補なし」の 3 値) を 1 周の群の手番から 1 本の関数に切り出し、 群の記録の読み手と鍵と同じ場所に置きます。 1 周の群の手番はその 1 本を今と同じ鍵の内側・同じ順で呼び、 判定を別に持たず、 古い席への合図・起こし直し・保留の記録・席の画面への行は今まで通り自分で撃ちます。 見回り (管理 tick) は、 自分の席の repo が群に属する周に、 machine 共通の置き場にある群ごとの「最後に判定した時刻」を読み、 時刻が無いか鮮度の窓 (rules 行 fleet.usage_fresh_s) より古ければ、 同じ鍵の内側で同じ 1 本を自分の置き場を入力にして撃ち、 時刻を書き直します。 窓の内側の周と鍵を取れない周は、 判定を撃たず今の列へ進みます (理由の語で止めません)。 rules 行は足しません。 判定の周だけ、 1 周と同じ鮮度つきの計測の口で口座を測ってよく (メモのある群は窓に関係なく、 無い群は窓の外だけ)、 それ以外の見回りの周は計測を起こしません。 判定の 1 本は古い席を終える手も起こし直す手も撃たず、 席の画面に触りません。 その 2 つは 2 系統のまま: 便の終端の 1 周は自分の置き場の席に今まで通り、 他の置き場の席には各席の見回りの移動の門が自分の席にだけ撃ちます。 便の終端の 1 周の群の手番は残り、 席の hook は通知とメモまでで判定は撃たず、 見回りの判定行には judged= の欄 (移った / とどまる / 候補なし / 止まった理由・撃たない周は -) が載り、 記録は判定の 1 本が書いて見回り自身は書きません。 1 周を時計で撃つことはしません。 要件書では、 群の逼迫の通知と移動 (FR1038) のきっかけに見回りの周期を足す根拠になり、 見回り (FR1027) と受入基準 AC1018 の「測らない・計測の起動 0 件」を「判定の周だけ鮮度の窓に 1 回まで測ってよい」に改める根拠になり、 口座残量の計測 (FR1033) の 1 本をそのまま使うことを主張します。
  採用 — OPT1
  器 SHALL 群の移動の判定 (測る集合 → 計測 → 群の今の口座の逼迫の読み → 移り先の決定 → 群の今の口座の記録と承認 event・候補なしの断りの event・移動を頼む記録の履歴化・移り先の 3 条件と記録の形と event の kind と detail は ADR-1049 と今のまま・出力は閉じた enum の 3 値 = 移った / 移らない / 候補なし) を dispatch の 1 周の群の段から 1 本の関数に切り出し、 群の記録の読み手と lock と同じ module に置く。 dispatch の 1 周の群の段 SHALL その 1 本を今と同じ lock の内側・同じ順で呼び、 判定を別に持たず (C2)、 退避の合図・起こし直し・保留の event・席の pane への行 (通知・断りの 1 行) は群の段に残す (外形は 1 字も変えない)。 管理 tick SHALL 自席の登録 row の anchor が群に属する周に、 front の後・移動の門の前で、 host の群用 dir の群ごとの判定の打刻 (1 file・最後に判定を撃った UTC 秒) を読み、 打刻が無いか rules 行 fleet.usage_fresh_s より古い周だけ、 群の段と同じ lock の内側で同じ 1 本を自席の置き場を入力に撃ち、 打刻を今の ts で書く。 鮮度の内側の周と lock を取れない周 SHALL 判定を撃たず今の列 (移動の門・梯子) へ進む (理由の語で止めない・group-locked は移動の門の語のまま)。 rules 行 SHALL NOT 足さない (周期は seat.tick_interval_s・窓は fleet.usage_fresh_s のまま)。 判定の周 SHALL 群の段と同じ鮮度つきの計測の 1 本で計測を起こしてよく (移動を頼む記録が在る群は鮮度に依らず今の口座を測り、 無い群は鮮度の外だけ測る・群の段と同じ)、 それ以外の tick の周 SHALL NOT 計測を起こさない (打刻の合図の列は今まで通り測らない)。 判定の 1 本 SHALL NOT 退避も起こし直しも撃たず、 席の pane に触らない — 便の終端の周の群の段 SHALL 自分の置き場の席に今まで通り撃ち、 他の置き場の席は各席の管理 tick の移動の門 (seat-heartbeat.md §4 / §7) が自席にだけ撃つ。 便の終端の周の群の段 SHALL 残る (便の終端でも進む・同じ lock で排他)。 席自身の hook SHALL 今のまま通知と移動を頼む記録までとし、 判定 SHALL NOT 撃たない。 tick の判定行 SHALL 末尾に judged=<moved:<label>|stay|none|error:<語>> を持ち、 撃たない周は judged=- とする (列は固定・C10・C11)。 event (移動・断り) は判定の 1 本が記し、 tick 自身 SHALL NOT event を記さない。 器 SHALL NOT dispatch の 1 周を timer で撃たない (ADR-1055 の線は保つ)。 本 ADR SHALL 要件 FR1038 の契機 (2 系統) に管理 tick の周期を足し、 FR1027 と AC1018 の「tick は群の逼迫を測らず計測を起こさない」を「判定の周だけ鮮度の窓に 1 回まで計測してよい」に改める改訂を伴い、 改訂までは何も拘束しない。
  （平易）器は、 群の移動の判定 (測る集合を取る → 計測する → 群の今の口座の残りを読む → 移り先を決める → 群の今の口座の記録と承認の記録を書く、 候補が無ければ断りの記録を書く、 「移動を頼むメモ」を履歴へ移す。 移り先の 3 条件と記録の形と記録の種類は ADR-1049 と今のまま。 結果は「移った / 移らない / 候補なし」の 3 値) を 1 周の群の手番から 1 本の関数に切り出し、 群の記録の読み手と鍵と同じ場所に置きます。 1 周の群の手番はその 1 本を今と同じ鍵の内側・同じ順で呼び、 判定を別に持たず (経路は 1 本)、 古い席への合図・起こし直し・保留の記録・席の画面への行 (通知・断りの 1 行) は自分に残します (外形は 1 字も変えません)。 見回り (管理 tick) は、 自分の席の登録 row の repo が群に属する周に、 列の front の後・移動の門の前で、 machine 共通の置き場の群ごとの「最後に判定した時刻」(1 file) を読み、 時刻が無いか rules 行 fleet.usage_fresh_s より古い周だけ、 群の手番と同じ鍵の内側で同じ 1 本を自分の置き場を入力にして撃ち、 時刻を今の値で書きます。 窓の内側の周と鍵を取れない周は、 判定を撃たず今の列 (移動の門・梯子) へ進みます (理由の語で止めず、 鍵の語は移動の門の語のままです)。 rules 行は足しません (周期は seat.tick_interval_s・窓は fleet.usage_fresh_s のまま)。 判定の周は群の手番と同じ鮮度つきの計測の 1 本で口座を測ってよく (メモのある群は窓に関係なく今の口座を測り、 無い群は窓の外だけ測る・群の手番と同じ)、 それ以外の見回りの周は計測を起こしません (打刻の合図の列は今まで通り測りません)。 判定の 1 本は古い席を終える手も起こし直す手も撃たず、 席の画面に触りません。 その 2 つは 2 系統です: 便の終端の 1 周の群の手番は自分の置き場の席に今まで通り撃ち、 他の置き場の席には各席の見回りの移動の門が自分の席にだけ撃ちます。 便の終端の 1 周の群の手番は残ります (便の終端でも進み、 同じ鍵で排他します)。 席自身の hook は今のまま通知と「移動を頼むメモ」までで、 判定は撃ちません。 見回りの判定行の末尾には judged= の欄 (移った先の口座 / とどまる / 候補なし / 止まった理由・撃たない周は -) が載り、 記録 (移動・断り) は判定の 1 本が書き、 見回り自身は記録を書きません。 1 周を時計で撃つことはしません (前の決定の線を保ちます)。 この記録は、 要件 FR1038 のきっかけ (2 つ) に見回りの周期を足し、 FR1027 と AC1018 の「見回りは群の逼迫を測らず計測を起こさない」を「判定の周だけ鮮度の窓に 1 回まで測ってよい」に改める改訂を伴い、 改訂までは何も拘束しません。
  （理由）user の決定は、 群の口座の移動を含めて器が完全に自律する、 という方針の受諾でした。 2026-09-25 の実測で、 群の記録が動いたのは pipeline が 1 周を撃った瞬間だけで、 pipeline を持たない project は誰も移さず、 席の hook は知らせてメモを置くまで、 見回りは測らず判定もしない、 と分かったことが、 前の決定 (ADR-1055) のきっかけ 2 つでは自律に届かない証拠です。 時計で 1 周を撃つ案を退けたのは、 1 周が pipeline と repo に結びついていて便の無い host には周そのものが無いことと、 置き場ごとに周を立てると群の判定が置き場の数だけ走ることの 2 つです。 hook が判定する案を退けたのは、 席は自分を起こす権能を持たず、 置き場ごとに判断が割れて殺到するからです。 判定を 1 本の関数に切り出して 1 周と見回りが同じ 1 本を呼ぶ形にしたのは、 見回りをきっかけに足しても判定を写さないためで (経路は 1 本)、 判定は場所を移すだけの純移動で、 足すのは判定の時刻の file と見回りが計測を撃つきっかけの 2 つに閉じます。 見回りに撃たせるのは、 見回りが席ごとに周期で回っていて、 群の記録と鍵をすでに呼んでいるからで、 群ごとの「最後に判定した時刻」と鮮度の窓で上限するのは、 置き場の数だけ見回りがいても判定を群ごとに 1 回に保つためです。 判定の周だけ口座を測ってよいとしたのは、 判定は今の口座のいちばん新しい実測で残りを読みますが、 移り先には窓の内側の新しい実測が要るので、 測らない見回りは移り先を持てないからです。 メモのある群は窓に関係なく測るのは 1 周の群の手番と同じ形で、 見回りの他の周には計測を起こさせないことで見回りの費用を判定の周に閉じます。 古い席を終える手と起こし直す手を判定の 1 本に持たせず 2 系統 (1 周は自分の置き場・各席の見回りは他の置き場) のままにしたのは、 判定の側が他の置き場の席の画面に触る形を設計が退け、 列に無い置き場の席を列が起こすと登録 row の書き手が置き場の外に増える形も設計が退けているからです。 便の終端の 1 周の判定を残し 1 周を時計で撃たないのは、 前の決定のその線を動かす理由が無いからです (変えない線)。 人が見る案を退けたのは決定に反するからで、 今の形のまま待つ案を退けたのは実測がそれを否定したからです。 要件書の改訂を伴うこと、 見回りが計測の子 process を起こす周が生まれること、 見回りの時計が無い席は今まで通り移らないこと、 時刻の file と判定行の欄が増えること、 切り出しが群の手番の歯に及ぶこと、 見回りの判定が別の置き場の便を見ないことは、 代償として引き受けます。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1038（rationale）: FR1038 は群の逼迫の契機を「便の終端の周と席自身の hook の 2 系統」と書き、 管理 tick の timer は群の逼迫を測らないと書く。 本 ADR はその契機に「管理 tick の周期 (群ごとに鮮度の窓に 1 回まで・lock の内側)」を足す根拠 (便の無い host では 2 系統のどちらも判定を撃たない) を与え、 判定の中身 (移り先の 3 条件・記録・承認 event) と便の終端の周の退避・起こし直しは変えない。 FR1038 の改訂は持ち主が spec の編集の口で行う。
  FR1027（rationale）: FR1027 は管理 tick の口座の門が計測の記録の最新値を読むだけで計測を起こさず、 群の逼迫は測らないと書く。 本 ADR は口座の門と梯子と合図の列は変えず、 tick の判定の周 (群ごとに鮮度の窓に 1 回まで) だけ群の段と同じ 1 本で計測してよいとする。 その文の改訂 (FR1027 と AC1018 の「計測の起動 0 件」) は FR1038 と同じ改訂で行う。
  FR1033（claim）: FR1033 は口座残量の計測を 1 コマンドで読み、 出所つきの実測として event log に記録し、 読めない回は 0 に読み替えないことを求める。 本 ADR の tick の判定は群の段と同じ鮮度つきの計測の 1 本を使い、 別の計測の口を足さない。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録は前の決定 1 つ (ADR-1055) を、 きっかけの部分に限って部分的に置き換えます。 ADR-1055 の「便が終わった直後の 1 周と席の hook の 2 つで測る」に「見回りの周期 (群ごとに鮮度の窓に 1 回まで・鍵の内側)」を 3 つ目のきっかけとして足し、 「時計や常駐の process を持たない」のうち群の移動の判定のきっかけに関する部分を置き換えます (見回りの時計は ADR-1058 がすでに戻したもので、 新しく時計を足すのではありません)。 保つのは、 1 周を時計で撃たない線・席の hook が判定して起こし直さない線・判定は鍵の内側で群ごとに 1 回・候補が無い周は移らず妥協の移動を作らない、 の 4 つです。 ADR-1055 の原則「動いた周に測る」は、 便の無い host では動いた周が判定に届かない実測を受けて、 きっかけの側でこの記録の原則が置き換えます。 見回りを戻した決定 (ADR-1058: 見回りの存在・梯子・24 時間の打ち切り・口座の門) はこの記録の前提として変えませんが、 その決定が「見回りは残りを測らないから ADR-1055 と衝突しない」と置いた前提の文は、 判定の周に限ってこの記録が改めます (置き換える決定の列には数えません)。 群と鍵と記録の形 (ADR-1049)・見回りの時計は席の起動が入れる (ADR-1064)・信じた印は席の起動が置く (ADR-1065)・席は自分を起こし直さない (ADR-1045) は変えません。 この記録は発効前 (proposed) で、 系譜の上では現行 (current) ですが、 受け入れられ要件書が改訂されるまで何も拘束しません。 原則は「群の移動の判定は 1 本で、 契機はそれを鍵の内側で呼ぶだけ。 契機を足すときは判定を写さず、 呼び手を 1 つ足す。」です。
  改訂状態: current
  置き換える ADR: ADR-1055
  置き換えられた: なし (現行)
  部分 supersede で、 置き換えるのは ADR-1055 の契機の部分だけである。 (1) ADR-1055 の決定「群の逼迫を便の終端の周と席自身の hook の 2 系統で測る」に、 管理 tick の周期 (群ごとに鮮度の窓に 1 回まで・host の lock の内側) を 3 つ目の契機として足す。 (2) ADR-1055 の「器 SHALL NOT timer・常駐 process を持たない」のうち、 群の移動の判定の契機に関する部分を本 ADR が置き換える (tick の timer は ADR-1058 が既に戻したもので、 本 ADR が新しく timer を足すのではない)。 保つのは、 dispatch の 1 周を timer で撃たない線 (ADR-1055 OPT2 の却下)・席自身の hook が判定して起こし直さない線 (OPT3 の却下)・判定は host の lock の内側で群ごとに 1 回・候補なしの周は移らず妥協の移動を作らない (ADR-1020 §2.4) の 4 つ。 ADR-1055 の原則「逼迫は何かが動いた周にだけ進むので、 動いた周に測る」は、 便の無い host では「動いた周」が判定に届かない実測を受けて、 本 ADR の原則 (判定は 1 本・契機はそれを鍵の内側で呼ぶだけ) が契機の側で置き換える。 ADR-1058 の決定 (heartbeat の存在・梯子・24 時間の打ち切り・口座の門) は本 ADR の前提として不変だが、 ADR-1058 が置いた前提の文「tick の timer は逼迫を測らないので ADR-1055 と衝突しない」は、 本 ADR が判定の周に限って改める (supersedes には数えない)。 ADR-1049 (群・鍵・記録・移り先の 3 条件)・ADR-1064 (tick の unit は席の起動が入れる)・ADR-1065 (trust の印は席の起動が置く)・ADR-1045 §2 (2) (席は自分を起こし直さない) は不変。 発効は本 ADR が accepted になり FR1038 / FR1027 / AC1018 の改訂が land した後で、 それまで何も拘束しない。
  照会終端 — PRIN-THE-JUDGEMENT-IS-ONE-FUNCTION-AND-EVERY-TRIGGER-CALLS-IT-UNDER-THE-LOCK
  群の移動の判定は 1 本で、 契機はそれを鍵の内側で呼ぶだけ。 契機を足すときは判定を写さず、 呼び手を 1 つ足す。
  本 ADR が timer で 1 周を撃つ案・席の hook が判定する案・人が見る案・今の形のまま待つ案を退け、 判定を 1 本に切り出して tick を 3 つ目の呼び手にしたのはこの原則に行き着く (これ以上は遡らない照会終端)。
