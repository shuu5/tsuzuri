# 判断の記録 ADR-26 — 面の server の軽さの上限を越えた測りへの手当て（発効 2026-09-30・持ち主の裁定 t3-hub.52.156:20260930T1120Z-1 と t3-hub.52.157:20260930T1120Z-1・束 batch:20260930T1120Z-1・記帳先 = tsuzuri の台帳の問い t3-hub.52.156 と t3-hub.52.157 の notes）
# 判断の記録 ADR-23 の決定 (2) と決定 (7) の字のうち、決定 (1) が名指す字だけを置き換え、撤退 (2) の数え方を足す（部分の置き換え・ADR-23 のほかの決定と字は効いたまま）。ADR-23 は封の一覧で本文が凍っているので本文は変えない（前例 ADR-24）。
# 台帳を読む前に短く待つ手（却けた案 b）は束から外した。根拠の数と測りの条件と検証役 qv36c・qv36d の見つけは、席が問いの bead の notes に記帳する。
id: ADR-26
title: 面の server の doctor の持ち回しの上限を 60 秒にし、器の側で軽くする問いを今起こす
status: accepted
date: 2026-09-30
context: |
  判断の記録 ADR-23 の撤退の条件 (1) は、要件 NFR4 の値（規則の行 R-34）を越えたら案を比べ直して持ち主に問うと決めた。ADR-23 の行の全部の着地の後、account board の大きな字を要求ごとに写さない行（m-big-copies）の着地の後も、頁 1 枚の 300 秒の平均が 1 core の 20% を越えた回が残った。1 本の測りで今の code 29.5%・待ちの試作 23.1%・doctor 60 秒の試作 19.8%、並べた測りで今の code 28.0%・doctor 60 秒の試作 24.9%。閉じた後は記録の在る 16 回とも 1% の内だった。
  前の測りは、5 秒で打ち切った台帳の読みの計算を数えていなかった（測りの包みの形のため・本番の server は台帳の道具を直の子として待つので数に入る）。server を専用の制御の群（cgroup）に入れ、その群の計算の時間（CPU）の和で測り直すと、打ち切った読みは 1 本あたり 0.33〜0.8 秒で、1 本の測りの越えた回の見込みは今の code 31.4〜34.1%・待ちの試作 24.0〜25.3%・doctor 60 秒の試作 23.0〜27.6% だった。測りの値は子の撃ちを記録する包みの分（1 本約 2 ミリ秒・0.6〜1.1 ポイント）を含む。どの測りも R-34 の注の形（元と同じ時に並べる）ではない。
  越えた回は頁の 300 秒に台帳の印が動いた秒が 20〜52 で、越えなかった回は 1〜14 だった（記録の在る 12 の窓）。多くはほかの project の席の書きで、tsuzuri の席自身の書きも台帳の形の検査（doctor --repo）を通して約 3〜4 ポイントを足した。同じ code の回ごとの差（8〜15 ポイント）は、どの手の効きよりも大きい。
  器の doctor の撃ちは頁の 300 秒に 71〜85 本（今の code と待ちの試作・6.4〜8.3 ポイント）で、計算の 58〜72% は 2 つの state dir に集まる。doctor の撃ち直しは、入力の印（event log を含む）が動いた後の要求か、上限の 30 秒を過ぎた後の要求で起きる。
  台帳の見張りは、合図が無い時も台帳の変化を 1.5 秒の内に面へ届ける（要件 NFR2・規則の行 R-21）。今の負荷では台帳の読みの壁の中央が 1.0〜4.4 秒で、5 秒で打ち切った読みも在る（規則の行 R-21 の越えとして席が記帳する件で、この記録の決定ではない）。
  席は持ち主に 2 つの問いを束で問うた。1 つ目（t3-hub.52.156）は doctor だけの上限を 30 秒から 60 秒に延ばすか、2 つ目（t3-hub.52.157）は ADR-23 の決定 (7) の問い（器の側で軽くする問い）を器の持ち込みの段を待たずに今起こすかである。持ち主は 2 問とも推奨の案 A を選んだ（束 batch:20260930T1120Z-1）。
  器の席は 2 つ目の問いに答えた（2026-09-30・出所は問い（t3-hub.52.157）の notes の器の席の答えの行・器の席の測り）。doctor の計算の約 9 割は event log の読み直しで、1 回の doctor が event log を 10〜11 回開いて読み直す。event log が約 8.5 メガバイトの置き場で doctor 1 本は 0.8〜1.2 秒、約 3.2 メガバイトの置き場で 0.3〜0.36 秒で、子の撃ちは合わせて約 0.02 秒だった。台帳の形の検査（doctor --repo）は event log を読まず、重さは台帳の全部の読みと読み解き（約 1.7 秒・台帳の大きさに比例）である。器の席は、doctor の入口で event log を 1 回だけ読む形を器の便にする（出力の字は変えない・約 8.5 メガバイトの置き場で 0.1〜0.15 秒の見込み・器の席の見込みは 1〜2 日）と答え、状態の file の口（新しい置き場の形で、書き手が同じ計算を払う）と、同じ process で読む形は今は勧めないとした。tsuzuri の側への勧めは、台帳の形の検査を台帳の入力の印が動いた時だけ撃ち時間の上限も持つ形、event log の大きい置き場ほど読みの周期を分ける形、event log を読むほかの読みを doctor と重ねない形だった。
decision: |
  (1) ADR-23 の字のうち、次の字だけをこの記録の決定に置き換え、または足す。(ア) 決定 (2) の「doctor と使用量の読み（usage）と規則の行の読み（rules get）が 30 秒」を、決定 (2) の「doctor が 60 秒、使用量の読み（usage）と規則の行の読み（rules get）が 30 秒」と読む。(イ) 決定 (2) の開示の「今より最大 30 秒遅れて面に出る」を、doctor の印の外の入力の変化と doctor の語の打刻が無いと読めないの変わりについては決定 (3) の字と読む（使用量の窓の割合の時刻だけの動きは 30 秒のまま）。(ウ) 決定 (3) の開示のうち、tick status の行か欄が読めない間の健康の語の遅れは、ADR-23 の撤退 (2) の「stale に変わるのが 10 秒より遅れた例」に数える（数えた時は、その間の語を「まだ分からない」にする行を起こす）。(エ) 決定 (7) の「器の持ち込みの段で別に問う」を、この記録の決定 (4) の時機に問うと読む。ADR-23 のほかの字は変えない。
  (2) doctor の出力の持ち回しの上限は 60 秒とする。使用量の読み（usage）と規則の行の読み（rules get）の上限は 30 秒のまま。doctor の入力の印は ADR-23 の決定 (2) のまま（event log を含む）なので、器の event の書きの後の要求では上限の内でも撃ち直す。
  (3) 開示: doctor の印の外の入力（tmux と起動の管理（systemd）と口座の dir の file と plugin と git）の変化と、doctor の語の打刻が無いと読めないの変わりは、上限の 60 秒を過ぎた後の最初の頁の読み直しで面に出る。外の読みは口の要求の時にしか撃たないので、60 秒は上限でなく、遅れは 60 秒と次の読み直しまでの間と doctor の走り（5 秒まで）の和になる。読み直しは、席の合図の時計が動いている間は 15 秒ごとの書きが起こすが、時計が止まっている間は頁の次の読み直しまで延びる。遅れる面の字は、account board の次の移り先と移り先の候補と候補が門で落ちた理由と休止中の席の列、席の card の群の行（断りと逼迫の欄）と anchor である（要件 FR12 と規則の行 R-22 の写しの鮮度が延び、写す字は変えない）。使用量の読みの上限は 30 秒のままで、逼迫の印も使用量の読みから出るので、口座を移る線（規則の行 R-30）の値と判じ方と印の鮮度は変わらない。席の card の健康の語は tick status の欄から決めるので 5 秒の内のままだが、tick status の行か欄が読めない間は doctor の語を使うので、その間の健康の語は同じ遅れで古い。
  (4) 器の doctor の読みを器の側で軽くする問い（ADR-23 決定 (7)・器に軽い読みの口を頼むか同じ process で読むか）は、器の持ち込みの段を待たずに今起こす。問いには、doctor の計算が 2 つの state dir に集まることと、doctor が event log を 1 回に 9 度読むこと（ADR-23 の context）を添える。器の席は器の側の読み 1 本の計算を測って答え（context）、doctor の入口で event log を 1 回だけ読む形を器の便にする（出力の字は変えない）。状態の file の口と同じ process で読む形は今は起こさず、その便の着地の後の測りでまだ足りなければ問い直す。tsuzuri の側の台帳の形の検査（doctor --repo）の間引きは、その測りを見て席が決める（この記録の決定ではない）。ADR-23 の撤退 (3)（持ち込みの段が 30 日より先に延びたら決定 (7) を問い直す）は、この決定で果たされる。
  (5) 決定 (4) の器の便（doctor の入口で event log を 1 回だけ読む形）の着地までは、R-34 の越えを席が便の bead の notes に記帳し、ADR-23 の撤退 (1) の比べ直しは、その便の着地の後の最初の測りで 1 度行う。ただし、その間の頁 1 枚の値がこの記録の context の最大（並べた測りで 28.0%・見込みで 34.1%）を越えたら、着地を待たずに比べ直して問う。
options:
  - id: a
    name: doctor だけの上限を 60 秒にし、器の側で軽くする問いを今起こす
    text: 決定 (1) から (5)。
    verdict: adopted
    reason: 並べた測りで、doctor だけ 60 秒の形は、doctor の計算が 1.2〜2.8 ポイント減り（前の並べた測りの 2 組・打ち切った読みまで数える組と、1 本ずつの 4 回の組）、頁の全体では 27.0% → 24.8%（前の並べた測り）と 28.0% → 24.9%（打ち切った読みまで数える組）だった。規則の表の行の値を変えず、要件 NFR2 と規則の行 R-21 と R-22 の字を保つ。1 本で測った doctor 60 秒の試作の忙しい回が見込み 23.0〜27.6% で越えたので、これだけでは越えた回を 20% の内に戻せず、残りは決定 (4) の器の側の直しで扱う。持ち主は 2 問とも案 A を選んだ。
  - id: b
    name: 台帳の印が動いた周は合図で終わる短い待ちの後に読む
    text: ADR-23 決定 (4) の「台帳の見張りは、知らせ（SSE）の受け手が 0 人の間は、台帳の印が動いても読まない」の後に、「台帳の見張りは、台帳の印が前の読みの印から動いた周（問いの合図の周と、受け手が 0 人から 1 人以上になった周を除く）に、合図の口で 300 ミリ秒まで待ってから印を取り直して読む。待ちの間に合図が来たら待ちを終えて読む。口の台帳の読みは、印が動いていれば 300 ミリ秒待ってから読む」を足し、決定 (4) の「（壁で約 0.6 秒）」を「（台帳の読みの壁と 300 ミリ秒の和）」と、「見張りを待たず自分で読み」を「見張りを待たず、印が動いていれば 300 ミリ秒待ってから自分で読み」と読む。
    verdict: rejected
    reason: 効きを決められないので、持ち主に問う束から外した。減りの幅は 0.2〜3.5 ポイントで、−0.2 は打ち切った読みまで数える形で並べた組（台帳がほぼ動かない時間）、−1.4 は前の並べた測り（打ち切った読みの減り 46 → 33 本を数えない形）、−2.1〜−3.5 はその測りの頁の窓の撃った読みの差 −12 本に 1 本 0.53〜0.88 秒を当てた見込みである。今の負荷では合図の無い時の 1.5 秒が待ちの無い形でも守れておらず、待ちはその越えを 0.3 秒ずつ広げる。台帳の動きの多い時間に並べて測り直し、効きが 1.5 ポイントを越えて出た時だけ問う。
  - id: c
    name: 規則の行 R-34 の頁の値を上げる
    text: 手当てをせず、値だけを 35% に上げる。
    verdict: rejected
    reason: 計算の量は減らず、台帳の書きが増えた日と anchor が増えた日に越える。25% と 30% は越えた回（28.0%・見込みの最大 34.1%）を通さない。緩める変更で条 P-17.4 の検証と裁定が要る。
  - id: d
    name: doctor と使用量の読みと規則の行の読みの 3 つの上限を 60 秒にする
    text: 3 つの読みが共有する上限の定数をそのまま 60 秒にする。
    verdict: rejected
    reason: 使用量の読みと規則の行の読みの計算の時間は頁の 0.1〜0.2 ポイントで、延ばしても減らず、使用量の割合と閾値の遅れだけが延びる。
  - id: e
    name: 待ちを 1 秒にし、1.5 秒の決まりを緩める
    text: 規則の行 R-21 と要件 NFR2 の合図の無い時の 1.5 秒を約 4 秒に上げ、印が 1 秒静まるまで待つ。
    verdict: rejected
    reason: 要件 NFR2 の字と規則の行 R-21 の値を変えるので、持ち主の裁定（条 P-17.1 の裁定 id）が要り、緩める向きなので反対側からの検証を前置する（条 P-17.4 に倣う）。着地済みの歯を書き替え、合図の無い周の台帳の変化の届きが最大約 4 秒に延びる。効きは測っていない。
  - id: f
    name: 今の時刻に依る欄を tsuzuri が tick-last と規則の行から組む（ADR-23 の案 e）
    text: 器の tick status の撃ちを tsuzuri の読みに替える。
    verdict: rejected
    reason: 消えるのは tick status の分（包みの記録で 1.1〜2.0 ポイント・記録の切り捨ての分で約 0.5 上がりうる）が上限で、越えた回はどれも 20% の内に戻らない。
  - id: g
    name: host で 1 か所が集める（ADR-23 の案 c）
    text: account board の集めを host の 1 本に寄せる。
    verdict: rejected
    reason: 頁 1 枚の測りでは集める 1 本が同じ仕事をするので減らない。host の全体では同時に開いた server の数から 1 本を引いた分だけ減る。
  - id: h
    name: 台帳の形の検査にも持ち回しの上限を置く
    text: 自分の台帳の書きごとに撃つ台帳の形の行の doctor（--repo）に上限を置く（ADR-23 決定 (6) の「台帳の形の行の撃ちを同じ台帳の字の周で撃たない形」の近縁）。
    verdict: rejected
    reason: 越えた組で 2.3〜4.7 ポイントを占めるが、上限で減る分は測っていない。台帳の形の行（ADR-16 決定 (6)）の鮮度が延び、要件 NFR2 の台帳の変化の 5 秒に当たるかの確かめが要る。器の席は台帳の入力の印が動いた時だけ撃つ間引きを勧めた（context）が、採るかは決定 (4) の器の便の着地の後の測りを見て席が決め、別の行で起こす。
basis: [P-27, P-4, P-2, P-17.4, NFR2, NFR4, FR12, R-21, R-22, R-30, R-34, ADR-23, ADR-18, ADR-16]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、ADR-23 の決定 (8) の測りの時機に、打ち切った台帳の読みまで数える形（server と子孫の制御の群（cgroup）の計算の時間（CPU）の和・包みの分を含む）で、ADR-23 決定 (8) の元と、この記録の行の前の commit の release の両方と同じ時に並べて測り（R-34 の判じは前者、この撤退は後者）、便の bead の notes に記帳する。問う相手は持ち主。この記録は、ADR-23 の撤退 (1) の比べを 2026-09-30 に果たした。
    (1) 着地の後の並べた測りで、doctor の計算が、この記録の行の前の commit の release（doctor の上限 30 秒の形）より 1 ポイント以上減っていなければ、上限を 30 秒に戻す行を起こす。R-34 の越えの続きは決定 (5) のとおりに扱う。
    (2) 席の合図の時計が動いている間に、決定 (3) の字が器の変化から 90 秒を越えて面に出なかった例が 1 つでも見つかれば、上限を 30 秒に戻す行を起こす（90 秒は 60 秒と読み直しの間 15 秒と doctor の走り 5 秒と見張りの周期の余地の和。時計が止まっている間の遅れは決定 (3) の開示のとおりで数えない）。席が、器の席の移動・plugin の入れ替え・起動の管理の変化を起こした時か、持ち主か器の席から知らせを受けた時に、変化の時刻（器の event log か tmux の記録）と、面の字が変わった時刻（口 /api/account の読み直し）を便の bead の notes に記帳して数える。
plain: |
  画面の server の重さの上限を、最新の code でも越える回が残りました。越えたのは、ほかの project の席などが台帳を続けて書いた時です。
  そこで、器の健康診断（doctor）を撃ち直す間隔を 30 秒から 60 秒にします。器の出来事は今までどおり 5 秒以内に出ますが、次の移り先や候補や断りの理由や休止中の席の列など、tmux や起動の管理や口座の file や plugin や git の変化から決まる字は、今の約 30 秒遅れが約 60 秒遅れになります。
  これだけでは上限の内に戻らないので、器の健康診断を器の側で軽くする相談を、器の持ち込みを待たずに器の席へ起こしました。器の席は、健康診断が器の記録を 1 回に 10 回ほど読み直していたのを 1 回だけ読む形に器の側で直すと答えました（1〜2 日の見込み）。その直しが入るまでは、越えた回を席が記録し、入った後にもう一度比べます。台帳を読む前に短く待つ手は、効きを測れていないので問いに出さず、測ってから決めます。
  この記録はあなたの承認で発効しています。承認の記帳先は tsuzuri の台帳の問いです。
