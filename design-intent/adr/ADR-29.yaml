# 判断の記録 ADR-29 — 相談の窓 consult の作り直し（tsuzuri の plugin の機能・席の文脈から分けた自由な調べと検証の場・話す窓と問う窓・窓ごとの作業場と OS の囲い・いつもの web の調べ・report は席が保存を選ぶ・席の見張りで受ける）（提案中・発端は memo t3-hub.75・持ち主の答えは問い t3-hub.75.1）
# 判断の記録 ADR-10 の決定 (1)〜(5)(7)(8)(9) と ADR-27 の決定 (3)(4)(7) の字のうち、この記録の決定 (1) が名指す字だけを置き換える（部分の置き換え・ほかの決定と字は効いたまま）。ADR-10 と ADR-27 は封の一覧で本文が凍っているので本文は変えない（前例 ADR-24・ADR-26・ADR-27）。
# 反対側からの検証の記録は docs/grill/2026-10-03-P-consult-rethink-grill.md。番号 28 は、起草 w60a の持ち込みの判断の記録（未 commit・ADR-27 の note）に空けてある。
id: ADR-29
title: 相談の窓 consult を、席の文脈を汚さないために分けた自由な調べと検証の場として tsuzuri の plugin の機能で作り直し、窓ごとの作業場で基本ソフトの囲いの中の実験といつもの web の調べを許し、結果は所見とレポートで席に渡して席が保存を選び、席の背景の見張りで受ける
status: proposed
date: 2026-10-03
grill:
  when: 2026-10-03
  who: 検証役 qv44a（Claude Code と tmux の事実・非対話の窓の実験 16 回）と qv44b（設計の食い違い・2 度）・どちらも AI・Opus・起草者と別の文脈
  where: docs/grill/2026-10-03-P-consult-rethink-grill.md
  summary: 窓どうしの連絡は許可の形の違う席に止め置かれて落ちる・口座の許しと落ちた守りの hook で書けてしまう・board の button の道は今の code で通らない・開いた問いの notes に書くと版が動く・部分の置き換えの名指しの漏れ、を挙げた。持ち主の答えで実験と web を許す形に替えた後は、Claude Code の sandbox で作業場の外へ書けない囲いが成り立つことと、既定のままの穴（共有の temp・足した dir の書き・資格の file の読み）を設定で塞げることを撃って確かめた。
context: |
  判断の記録 ADR-10（2026-09-27 発効）は相談の窓を決め、器の対応を待つ間の当座の手順（docs/consult/）を置いた。当座の手順は一度も使われていない。持ち主は理由を手作業の多さと答えた（memo t3-hub.75 の notes・2026-10-02T21:25Z）。
  持ち主は 2026-10-02 に 5 つの答えを出した。(ア) 形は両方（持ち主が直に話す窓と、席が強い model に問う話さない形）。(イ) 当座を使わなかった理由は手作業の多さ。(ウ) 入口はチャットと board の button の両方（skill の形は席の推し）。(エ) 口座は project の群の同じ口座を使い、器の仕組みとそろえる。(オ) tsuzuri の plugin の機能として作り、ほかの project でも使えるようにする。答え (ア) で、ADR-10 が subagent の案を捨てた理由（持ち主が直に話せない）は、問う形については持ち主が受け入れた。
  持ち主は案の問い（t3-hub.75.1）に答えた（2026-10-02T22:38Z・裁定 t3-hub.75.1:20261002T2238Z-1）。(カ) 相談の窓は、新しい技術のスクラッチの実験や、データの検証のためにプログラムを組むことができるべきで、それはプロジェクトを汚さない形であること。調査のレポートも作れるべきで、ただし直にプロジェクトに保存せず、orchestrator に渡して保存するかを選ばせること。(キ) web の調べはいつもできること（スクラッチの機能を残さないと上質な調べはできない）。(ク) ほかの論点は推奨のとおり。(ケ) 相談の窓は 1 つの議題の相談に限らず、orchestrator の文脈を汚さないために分けているだけの自由な調べと検証の場とすること。1 つの話が終わってもすぐ閉じず、途中で消し直し（/clear）して別の話題を検証して結果を orchestrator に渡す使い方も、窓が複数在る使い方もある。
  器の席の答え（2026-10-02 と 10-03・器の main の code と設計で確かめた・memo t3-hub.75）。(1) 群の今の口座を返す読むだけの命令は無い。席の process は口座の置き場の環境変数（CLAUDE_CONFIG_DIR）に群の今の口座を持つので、席から起こすならその環境を継げば群の口座になる。(2) 器の席の起こし方（scribe2 seat）は、本物の orchestrator の席の行と窓を置き換えるので使わない。(3) 器の plugin を読むと、登録の無い窓は書きを断られ、入力の hook が相談の会話を持ち主の発話として数え、停止の hook が仕分けを求めて止まる。器の plugin は席の起動の旗でしか読まれない。(4) 群の移動は登録した席だけを動かすので、相談の窓は前の口座に残る。(5) 器の配達の口に種類を足すのは受けられる形だが、器の要件の改訂（持ち主が起こす）と器の判断の記録と契約が要る。(6) 台帳の memo の label を持つ bead は memo と読まれ、閉じの頭は memo の 3 つに限られ、memo の審査の列に入るので、相談の一生は memo に合わない。(7) host の宣言（host.toml）は project ごとの state dir に在るので、その [[plugin]] の行は project ごとに効く。
  検証役の確かめ（docs/grill の P）。撃って確かめた事（verified）: (1) 許可を聞かない形（dontAsk）の窓から確かめを飛ばす形（bypass）の席へ窓どうしの連絡を送ると、席の側で持ち主の承認待ちに止め置かれ、5 分で捨てられる。(2) 口座の設定の許す一覧は許可を聞かない形でも効き、守りの hook が落ちると道具が走る。(3) 制限の形（--restricted）で非対話の窓を起こすと、口座の設定（許す一覧・hook・環境）を読まず、file の道具は作業の dir と足した dir（--add-dir）に閉じ、渡した道具（--tools）だけが在り、--settings の設定は効き、口座の認証は効いたまま。(4) Claude Code の囲い（sandbox・この host では bubblewrap）を有効にし、囲いの外で撃ち直す道を断ると、作業場の中では 言語の処理系と道具（python・cargo・uv）が聞かれずに走り、作業場の外へは 基本ソフト（OS）が読むだけの file の仕組み（read-only file system）として書かせず、囲いを外す引数は効かず、窓どうしの口（unix socket）と外の process に届かない。囲いが起きない時は起動で止める設定が在る。(5) 既定のままの囲いには穴が在る（同じ user の窓の全部が共有する temp の置き場が書ける・足した dir が殻の命令から書ける・資格の file が読める）。どれも設定で塞げる（私用の短い temp の置き場・足した dir の書きの断り・資格の file の断り）。(6) 殻の命令のネットワークは許したドメインだけに出られ、許していない暗号の web の通信（https）と ssh は断られる。web の調べの道具（WebSearch・WebFetch）は囲いの外で許しの規則に従い、素の名の許しは殻の命令のネットワークを広げない。(7) tmux の新しい窓は tmux の server の環境で起き、-e で渡した値だけが届く。(8) 席の背景の命令（run_in_background）が終わると、待ちの席は起こされる。(9) 今の tsuzuri の plugin の hook は project の build を撃つので、ほかの project では動かない。(10) 開いた問いの版の要約値は notes を含む。(11) 器の管理の合図は 40 分黙った席にだけ送られる。推し量り（inferred）: 対話の窓でも制限の形と囲いの設定は同じに効く（文書と code の字から・撃っていない）。持ち主が対話の窓で ! で打つ命令は囲いの外で走る。
  使用量について。相談の窓は群の同じ口座で動き、新しい課金や鍵を足さないので、憲法 A-1 の「使う」の確認には当たらない。強い model の使用量は器の model 別の見張りには入らない。web の調べの道具は外へ字を出す道でもあり、持ち主はいつもの web の調べを求めた（答え (キ)）。
decision: |
  (1) 前の判断の字のうち、次の字だけをこの記録の決定に置き換える。ほかの字は効いたまま。
  (ア) ADR-10 決定 (1) の「役割を 2 つにする（orchestrator と consult）」は、器の役割は orchestrator の 1 つのままとし、相談の窓はこの記録の決定 (3)(5) の起動の口が起こす窓と読む。同じ決定 (1) の「持ち主と直に話す」「model は持ち主が選び」は話す窓にだけ掛け、問う窓はこの記録の決定 (10) とする。
  (イ) ADR-10 決定 (2) の「相談は台帳の bead として起こす」は、この記録の決定 (4)(8) の記帳に替える。束を機械が組む字は効いたまま（話題ごとに窓の中からも組める）。
  (ウ) ADR-10 決定 (3) の所見の欄に、話題（題の bead の id か自由な題）と添え物（作業場のレポートとプログラムと結果の file の列）を足す。ほかの欄と欠けを断る字は効いたまま。
  (エ) ADR-10 決定 (4) の「相談の窓から orchestrator へ送る」と「考え中の席には送らず、停止の hook が拾う」は、この記録の決定 (8) の受け方に替える。席に見えるのは所見の id を指す固定の 1 行だけで、中身は file から読む字は効いたまま。
  (オ) ADR-10 決定 (5) の処分に、添え物を repo に保存するかの選びを足す。「未反映の一覧」は、この記録の決定 (9) の置き場に替える。
  (カ) ADR-10 決定 (7) の「窓は使い捨てにする」は、この記録の決定 (3) の自由な場に替える（話題が終わっても閉じない・持ち主が閉じる）。model の替え方に窓の中の替え（/model）を足し、開き直しの続きも残す。
  (キ) ADR-10 決定 (8) の権能は、読む（repo・台帳・web）・作業場の中の編集と実験（決定 (7) の囲いの中）・所見を出す口、に替える。repo の編集・台帳の書き・回答・承認・go・便の起動を持たない字は効いたまま。
  (ク) ADR-10 決定 (9) の当座の手順は、この記録の決定 (2) の口が着地したら退く。
  (ケ) ADR-27 決定 (3) の帯の項目に相談の口を足し、決定 (4) の帯の印が開く窓に相談の窓を足し、決定 (7) の吹き出しの口に相談の口を足す。
  (2) 相談の窓は tsuzuri の plugin の機能として作る。plugin に skill（consult）を置き、本体は tz の consult の命令（開く・束を組む・起こす・見張る・所見を出す・読む・処分する・一覧・閉じる）にする。plugin の hook と skill は tz を 1 つの決まった解き方（plugin と同じ checkout の build・無ければ PATH の名）で引き、tz と plugin の版を照らして、合わなければ相談の窓を起こさない。project ごとの値（state dir・台帳）は project の宣言から読み、host ごとの値で分岐しない。ほかの project の席は、その project の state dir の host の宣言に tsuzuri の plugin の [[plugin]] の行を足して読む（器の席の推し）。tsuzuri の宣言を持たない project では、plugin の hook は何もしない。ほかの project で使い始める時期は project ごとに持ち主が決める。
  (3) 相談の窓は、席の文脈を汚さないために分けた、自由な調べと検証の場とする。1 つの議題に限らない。窓の中では話題を替えてよく（消し直しの /clear を含む）、話題ごとに結果を所見として席へ渡せる。所見を渡しても窓は閉じない。持ち主の言葉で開く窓は同時に何本でもよい。形は 2 つとする。話す窓は、席の tmux の session に名 consult と窓の id の窓を、持ち主の見ている窓を替えずに開き、持ち主が PC の端末で直に話す（board やスマホから開いても話す所は PC の端末）。窓は持ち主が閉じる。持ち主が閉じると言った時は、席が起動の口で閉じる。問う窓は、席が背景の命令として非対話の Claude Code（claude -p）を起こし、束と問いを読ませて所見を出させて終わる。2 つの形は同じ起動の口（tz consult launch）と同じ口座（決定 (5)）と同じ囲い（決定 (7)）と同じ所見の口を通る。どの所見も、席はそのまま採らず処分を宣言する（ADR-10 決定 (5)）。
  (4) 入口は 2 つとする。(ア) 席の窓の skill（/tsuzuri:consult。題・形・model は省けば題なし・話す窓・既定）。持ち主が席の窓で打つか、席が自分で撃つ。(イ) board の上の帯の相談の口（題と形と model を書く窓・題は省ける）と、札と行の吹き出しからその bead を添えて開く口。記帳は、相談の bead を別に起こさず、台帳の型付きの行で置く。行の頭は「相談の」で始まる閉じた列（相談の頼み・相談の開き・相談の所見・相談の受け・相談の処分・相談の閉じ）で、器が読む頭（裁定・見送り・昇格済み・まとめた など）と重ねない。行を置けるのは memo と project の根の bead だけで、開いた問い（版の要約値が notes を含む）と契約の bead には置かない。窓の開きと閉じの行は根の bead に、所見から先の行は話題の bead（問いか契約なら親の memo・題なしなら根）に置き、題の id を行に書く。行には起こし手（持ち主の button・持ち主のチャット〔器の発話の記録の時刻を添える〕・席）を書く。相談の窓は台帳を書かない（所見を作業場に置くまで）。台帳の行を書くのは、席（受けと処分）と起動の口（開きと閉じ）と面の server（button の頼み・制約 CON3 の内・承認として数えず裁定の行にしない・要件 FR18 の指摘とも別の行）。席には決定 (8) の受け方で届き、席が skill で窓を開く。面の server は窓を開かない。頼みが裁定と同じ時間の内に席に受けられなければ、board の相談の窓に「席に届いていない」と出す。
  (5) 起動の口は席の環境を継いで窓を起こす。口座は席の口座の置き場の環境変数（器が群に割り当てた今の口座）で、tmux の窓には -e で渡す（渡すのは閉じた列＝口座の置き場・PATH・窓の id・私用の temp の置き場だけ）。器の席の起こし方（scribe2 seat）は使わない。窓ごとの作業場は、席の起草の写しの置き場（drafts）の下の窓の名の dir とし、窓の作業の dir にする（器が古い build と依存の置き場を片付ける）。群の移動の時、開いている話す窓は前の口座のまま動き続け、上限で止まりうる。止まったら持ち主か席が同じ作業場で開き直し、作業場の控えと前の所見から続ける。問う窓は席の子なので、席の起こし直しで止まりうる。起動の口は問う窓の process の印を作業場に残し、tz consult の一覧は所見の無いまま process の無い問う窓を「止まった」と出し、席の停止の hook がそれを拾い、席が束から撃ち直す。新しく開く窓は、その時の席の環境の口座で開く。窓を閉じた後も作業場は残し、所見が全部処分された後に、起動の口が退きの置き場へ移す（消さない）。
  (6) 相談の窓には器の plugin も tsuzuri の plugin も渡さない（plugin は起動の旗でしか読まれない・tsuzuri の plugin の席の hook が相談の窓で裁定を拾うと席に届かなくなる）。起動の口の argv の歯が plugin の置き場の旗の無いことを測る。相談の窓の会話は持ち主の発話として器に記録されない。これは ADR-10 決定 (6)（相談の窓の会話は承認にならない）と合う。制限の形で起こすので、口座の設定（許す一覧・hook・環境）も読まない。相談の窓では、持ち主の口座の hook の守り（host の守り）の代わりに、決定 (7) の基本ソフトの囲いが掛かる。口座の hook の終わりの台帳の同期と始まりの取り込み（fetch）も撃たれない。
  (7) 守りは基本ソフト（OS）の囲いで持ち、起動の口が渡す形にする。起動の口は、制限の形（--restricted）・許可を聞かない形（dontAsk）・道具の閉じた列（読む道具・殻の命令・書きの道具・web の調べの 2 つ）・外の道具の断り（MCP の道具を全部断る）・読む根の足し（--add-dir に repo と台帳と器の state）・私用の短い temp の置き場・設定（--settings）で窓を起こす。設定は次を置く。(ア) 囲い（sandbox）を有効にし、囲いの中の殻の命令は聞かずに許し、囲いの外で撃ち直す道を断り、囲いが起きない時は起動で止める。(イ) 書けるのは作業場の下だけ（書きの道具の許しは作業場の絶対 path の編集の規則だけ）で、読む根は囲いの書きの断りにも置く。(ウ) 資格の file（GitHub と ssh と git の資格の類）を囲いから見えなくする。(エ) 殻の命令のネットワークは package の置き場のドメインだけに許し、git の remote の host は許さない（送り出し〔push〕と投稿の道を持たない）。(オ) web の調べの道具（WebSearch・WebFetch）は素の名でいつも許す（ドメインの全部を許す形は殻のネットワークを広げるので書かない）。(カ) 窓どうしの口（unix socket）と囲いの外の命令の列（excluded）は置かない。これで、作業場の中ではスクラッチの実験・データの検証のプログラム・repo の写しでの試しを聞かずに撃て、作業場の外（repo を含む）へは書けず、席の窓と器に届かない。package を入れる実験の形は持ち主に問う（持ち主の全体の決まりは package の管理を container でする）。案は 2 つ。(甲) 作業場の外に置いた固定の包みの命令（tz consult box）が container を起こし、繋ぐ dir（作業場は書ける・読む根は読むだけ）とネットワークを包みが決める。囲いの中からは container が起きない（検証役が近似で確かめた）ので、包みの命令だけを囲いの外で撃つ。(乙) 囲いの中で、package の置き場のドメインだけを許し、作業場の中へ入れる（全体の決まりの字からは外れる）。守りの hook は道具の名の閉じた列と所見の口の検めに減らし、落ちても断る形で撃つ。起動の口の argv と設定は歯で測り、対話の窓での効きは作る行で撃って確かめ、確かめられなければ起動の形を問い直す。
  (8) 所見の口（tz consult answer）は欄を検め（ADR-10 決定 (3)）、所見の file を作業場の決まった dir に書き、添え物が作業場の下に在ることを確かめる。席は次の形で受ける。席は相談の見張り（tz consult watch）を背景に常に 1 本置く。見張りは、開いている窓の作業場の新しい所見と、台帳の受けの無い相談の頼みが現れると、固定の 1 行（窓の id の所見 n が届いた・相談の頼み id が届いた・在りかと、見張りを置き直す命令の字）を出して終わり、待ちの席を起こす。席は起きたら置き直す。見張りは背景の命令の時間の上限いっぱいで待ち、上限で終わった時も置き直す（上限が短いほど席の turn が増える）。見張りは生きている印を置き場に置き、tsuzuri の plugin の席の停止の hook は、印の無い時に見張りを置くよう席を続けさせる（turn の終わりごとに 1 度）。起こし直しの後は、器の起こし直しの初手の行で撃たれる入力の時の hook が、見張りを置くよう 1 行足す。問う窓は、席の背景の命令の終わりが同じ固定の 1 行を出す。席は所見を読む口（tz consult show）で読み、読んだ口が経路の語（見張り・完了・hook・一覧）つきの相談の所見と相談の受けの行を台帳に置く。見張りが無い間の拾いは、tsuzuri の plugin の席の hook（入力の時・道具の周・停止）が、board の未受けの口の安い判じを先に撃ち、受けの無い所見と頼みを裁定と別の字で席に足す。窓どうしの連絡は使わない。器の配達の口に相談の種類を足す道は撤退の先とする（撤退の条件 (2)）。
  (9) 処分は所見ごとに、採る・一部採る・採らない と理由に、添え物ごとの保存する・しないを足して宣言する（tz consult dispose・相談の処分の行）。保存すると決めた添え物は、席が repo の決まった置き場へ写して commit する（窓は repo に書かない）。処分の無い所見と、席に届いていない頼みは、board の相談の窓の一覧と tz consult の一覧に出す。要件 FR13 の未反映の一覧は器の判定だけを出すので、そこには混ぜない。帯の相談の口は色の付く数を持たない（色の付く数は持ち主のやる事で、所見の処分は席の手番）。
  (10) model と念入りさの既定は Fable・xhigh（制約 CON6）で、起動の口は念入りさを旗（--effort）で明示する。話す窓は持ち主が開く時に選び、窓の中の model の替えでも替えられる。問う窓は、持ち主の言葉（skill か button）で開く時は持ち主が選び、席が自分で開く時は既定で開く。問う窓の既定は CON6 で持ち主が選んだ既定なので、条 P-16 の持ち主が選んだ model に当たる。席が自分で開く問う窓は、同時に 1 本・1 日（UTC）3 本までとし、問う窓の全部の同時の本数にも上限を置く（値は規則の行に置く）。数えるのは起動の口で、起こし手が席の窓だけを数え、止まって撃ち直した窓は数えない。越える時は起動の口が断り、席は決定の画面で持ち主に問う。持ち主の言葉で開く話す窓には本数の上限を置かない。所見の model の欄は出した時の model を書く。
  (11) 持ち主の手は、窓を開くと言う（skill か button・題と形と model は省ける）・窓で話して調べる・結果を席へ渡させる、の 3 つにする。窓を開く・束を組む・最初の指示・所見を席に届ける・開き直しの続き・保存の写しは、機械と席がする。
options:
  - id: a
    name: 自由な調べと検証の場・基本ソフトの囲いの中の実験・いつもの web・席の見張り
    text: 決定 (1) から (11)。
    verdict: adopted
    reason: 持ち主の 5 つの答えと問い（t3-hub.75.1）への答えの全部に応え、器の変更なしで今の器と Claude Code の口だけで動く。実験と web を許しても、作業場の外へ書けず席と器に届かない囲いが成り立つことを検証役が撃って確かめた。2 つの形が起動・口座・囲い・所見の口・受け方を共有する。
  - id: b
    name: 器の席の起こし方で相談の窓を起こす
    text: scribe2 seat の短い形か seat launch で、席として相談の窓を起こす。
    verdict: rejected
    reason: 器の席の答えで、本物の orchestrator の席の行と窓を置き換えると分かった。
  - id: c
    name: 問う窓を席の subagent にする
    text: 席が Agent の道具で別の model の subagent を起こし、所見を出させる。
    verdict: rejected
    reason: subagent は席の許可の形（確かめを飛ばす形）を継ぐので、制限の形と囲いを掛けられず、2 つの形で仕組みが分かれる。
  - id: d
    name: 器の配達の口に相談の種類を足す
    text: 器の配達の口（scribe2 seat deliver）に相談の 1 種類（相談に動きがある）を足し、button の頼みと所見の知らせを、待ちの席へ器が送る。
    verdict: rejected
    reason: 器の要件の改訂（持ち主が器の側で起こす手続き）と器の判断の記録と契約が要り、時間がかかる。所見も頼みも席の背景の見張りで受けられるので、今は要らない。拾いが遅れる時の撤退の先（撤退の条件 (2)）として残す。
  - id: e
    name: 面の server が窓を開く
    text: board の button を押すと、面の server が tmux の窓を開いて相談の窓を起こす。
    verdict: rejected
    reason: 面の server は台帳と器の記録だけを書く軽い口にとどめる（制約 CON3 の趣旨）ので、process を起こす経路を持たせない。server は群の今の口座の環境も持たない。
  - id: f
    name: 閉じた命令の一覧と許可の設定だけで守る
    text: 殻の命令を読む命令の閉じた一覧に限り、許可を聞かない形と hook で守り、実験と build を持たせない。
    verdict: rejected
    reason: 持ち主の答え (カ)（スクラッチの実験と検証の program を組めること）に反する。命令の字の検めは抜け道が多く（書く旗・組み合わせ）、基本ソフトの囲いの方が書きとネットワークを確かに閉じる。
  - id: g
    name: tsuzuri の中だけの道具にする
    text: plugin に置かず、tsuzuri の repo の script と手順で動かす。
    verdict: rejected
    reason: 持ち主の答え (オ)（ほかの project でも使えるように）に反する。
  - id: h
    name: 窓どうしの連絡で所見を知らせる
    text: 相談の窓が、所見の口の出した 1 行を Claude Code の窓どうしの連絡で席へ送る。
    verdict: rejected
    reason: 許可を聞かない形の窓から確かめを飛ばす形の席へ送ると、席で持ち主の承認待ちに止め置かれ、5 分で捨てられる（検証役の実験）。囲いの中からは窓どうしの口（unix socket）にも届かない。
  - id: i
    name: 相談ごとに memo の bead を起こす
    text: 相談を 1 本の memo の bead にし、所見と処分をその notes に書く。
    verdict: rejected
    reason: memo の閉じの頭と審査の列が相談の一生に合わない（器の席の答え）。相談の窓は 1 つの議題に限らない（持ち主の答え (ケ)）ので、bead 1 本に結ぶ形も合わない。
  - id: j
    name: 窓は 1 つの議題の相談に限り、所見を出したら閉じる
    text: ADR-10 のとおり、相談は 1 件の論点で、窓は使い捨てにする。
    verdict: rejected
    reason: 持ち主の答え (ケ)（自由な調べと検証の場・途中で話題を替える・窓が複数）に反する。
