retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo t3-hub.75（作る行の bead が在ればその notes）に 1 件ごとに記帳する。数える材料は、台帳の相談の行（頼み・開き・所見・受け・処分・閉じの時刻と経路の語と起こし手）と、所見の欄と、起動の口の結果の行。問う相手は持ち主（(2) は器の席にも）。
    (1) ADR-10 の条件を引き継ぐ。着地の後の所見を 10 本ずつ区切り、その中で処分の無いまま 7 日を越えたものが 3 本以上になったら、受け方と処分の形を問い直す。
    (2) 着地の後 14 日ごとに、受けの経路が hook か一覧で、所見か頼みが現れてから受けまで 30 分を越えた物が 3 件以上なら、器の配達の口に相談の種類を足す道（案 d）を持ち主と器の席に問う。
    (3) 着地の後 14 日の内に、所見の欄の「囲いに断られて困った事」か持ち主の言葉で、実験に要るのに囲いが断った事が 3 件を越えたら、囲いの許し（ネットワークのドメイン・読む根・package の入れ方）を問い直す。
    (4) 着地の後 30 日の内に、起動の口が窓を開けなかった（結果の行が失敗）ことが 2 度あったら、起動の形を問い直す。
    (5) 席が自分で開いた問う窓の所見が 10 本たまるごとに、処分が「採らない」の物が 7 本を越えていたら、席が自分で問う範囲を問い直す。
    (6) web の調べの道具で、外へ出してはならない字（資格・private な project の中身）が出たと分かった事が 1 度でもあったら、web の道具の許しを持ち主に問い直す。
plain: |
  設計や技術の調べ・検証をする「相談の窓」を作り直します。席（いつもの窓）の頭を汚さないために分けた、自由な調べと検証の場です。
  入口は、席の窓で「/tsuzuri:consult」と打つか、board の「相談」を押すだけです。題は付けても付けなくてもかまいません。窓は何本でも開けて、1 つの話が終わっても閉じず、途中で消し直し（/clear）して別の話題に移れます。閉じるのはあなたです。
  形は 2 つです。あなたが直に話す窓（PC の端末の別の tmux の窓）と、席が強い model に問うて結論だけをもらう話さない形です。model はいつもは Fable で、開く時や窓の中で替えられます。席が自分で問うのは 1 日 3 本までです。
  窓ごとに repo の外に作業場があり、新しい技術を試すプログラムやデータを検証するプログラムを組んで撃てます。web の調べもいつもできます。repo は読むだけで、作業場の外へは基本ソフトの囲いで書けないので、プロジェクトは汚れません。GitHub などへの送り出しや投稿はできません。
  結果は決まった形の結論の file にまとめ、調査のレポートなどを添えて席に渡します。結論ができると席が自動で気づき、採るかどうかと、レポートを repo に保存するかどうかを選んで記録します。承認は今までどおり決定の画面だけで受けます。
  窓は席と同じ口座（群の口座）で開きます。口座が移っても開いている窓は前の口座のままで、上限で止まったら開き直して続きから話せます。強い model の使用量も同じ口座に数わります。
  tsuzuri の plugin の機能として作るので、ほかの project でも使えるように作ります。ほかの project で使い始める時期は、project ごとに決めます。
  この記録はまだ提案です。
note: 番号 28 は起草 w60a の持ち込みの判断の記録に空けてある（ADR-27 の note）。発効の時に、要件 FR19（自由な場・2 つの形・作業場と囲い・記帳・受け方・保存の選び）と FR5（吹き出しの相談の口）と帯の項目を持つ要件の字と FR19 の受入の字（器の口の argv を、起動の口の argv と設定と囲いの断りと見張りの 1 行に）を改め、制約 CON6 に問う窓の model の選び手を足し、scope と語彙表の相談の窓の def を改め、席が自分で開く問う窓の上限の規則の行を足す。相談の行の頭を器の局面が無視することと、導出グラフが相談の行の頭を知ることは、作る行の前に器の席と確かめる。当座の手順 docs/consult/ は、決定 (2) の口が着地した時に退きの置き場へ移す。器の memo s2-07l.738.42.14（群の今の口座を返す読むだけの命令）は、この記録では使わない（面の server は窓を開かない）。
