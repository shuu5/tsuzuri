# 判断の記録 ADR-29 — 相談の窓 consult の作り直し（tsuzuri の plugin の機能・話す窓と問う窓の 2 つの形・skill と board の口・席の環境を継ぐ口座・制限の形の起動と守り・席の見張りで所見を受ける）（提案中・発端は memo t3-hub.75）
# 判断の記録 ADR-10 の決定 (1)(2)(4)(5)(7)(8)(9) と ADR-27 の決定 (3)(4)(7) の字のうち、この記録の決定 (1) が名指す字だけを置き換える（部分の置き換え・ほかの決定と字は効いたまま）。ADR-10 と ADR-27 は封の一覧で本文が凍っているので本文は変えない（前例 ADR-24・ADR-26・ADR-27）。
# 反対側からの検証の記録は docs/grill/2026-10-03-P-consult-rethink-grill.md。番号 28 は、起草 w60a の持ち込みの判断の記録（未 commit・ADR-27 の note）に空けてある。
id: ADR-29
title: 相談の窓 consult を tsuzuri の plugin の機能として作り直し、持ち主と話す窓と席が問う窓の 2 つの形を、席の環境を継ぐ同じ起動の口と同じ守りと同じ所見の口で動かし、所見は席の背景の見張りで受け、入口は席の窓の skill と board の相談の口にする
status: proposed
date: 2026-10-03
grill:
  when: 2026-10-03
  who: 検証役 qv44a（Claude Code と tmux の事実・小さな実験）と qv44b（設計の食い違い）・どちらも AI・Opus・起草者と別の文脈
  where: docs/grill/2026-10-03-P-consult-rethink-grill.md
  summary: 窓どうしの連絡は許可の形の違う席に止め置かれて落ちる・口座の許しと落ちた守りの hook で書けてしまう・board の button の道は今の code で通らない・部分の置き換えの名指しの漏れ、の 4 つの重い穴を挙げた。席は渡し方を席の見張りに、守りを制限の形の起動に、記帳を題の bead の行に替えた。
context: |
  判断の記録 ADR-10（2026-09-27 発効）は相談の窓を決め、器の対応を待つ間の当座の手順（docs/consult/）を置いた。当座の手順は一度も使われていない。持ち主は理由を手作業の多さと答えた（memo t3-hub.75 の notes・2026-10-02T21:25Z）。当座の手は 8 つで、持ち主の手はそのうち 6 つ（相談を開くと言う・窓を開いて model を選ぶ・最初の一言を打つ・相談する・所見を席に知らせる・model を替える時に開き直す）だった。
  持ち主は 2026-10-02 に 5 つの答えを出した。(ア) 形は両方（持ち主が相談の相手と直に話す窓と、席が強い model に問う話さない形）。(イ) 当座を使わなかった理由は手作業の多さ。(ウ) 入口はチャットと board の button の両方で、skill を使うかを問うた（skill の形は席の推しで、この記録の承認で決める）。(エ) 口座は project の群の同じ口座を使い、器の仕組みとそろえる。(オ) tsuzuri の plugin の機能として作り、tsuzuri を使って開発するほかの project でも使えるようにする。答え (ア) で、ADR-10 が subagent の案を捨てた理由（持ち主が直に話せない）は、問う形については持ち主が受け入れた。
  器の席の答え（2026-10-02 と 10-03・器の main の code と設計で確かめた・memo t3-hub.75）。(1) 群の今の口座を返す読むだけの命令は無い。席の process は口座の置き場の環境変数（CLAUDE_CONFIG_DIR）に群の今の口座を持つので、席から起こすならその環境を継げば群の口座になる。(2) 器の席の起こし方（scribe2 seat）は、本物の orchestrator の席の行と窓を置き換えるので使わない。(3) 器の plugin を読むと、登録の無い窓は書きを断られ、入力の hook が相談の会話を持ち主の発話として数え、停止の hook が仕分けを求めて止まる。器の plugin は席の起動の旗でしか読まれない。(4) 群の移動は登録した席だけを動かすので、相談の窓は前の口座に残る。(5) 器の配達の口に種類を足すのは受けられる形だが、器の要件の改訂（持ち主が起こす）と器の判断の記録と契約が要る。(6) 台帳の memo の label を持つ bead は memo と読まれ、閉じの頭は memo の 3 つに限られ、memo の審査の列に入るので、相談の一生（頼み・所見・済み）は memo に合わない。相談の記帳は tsuzuri の側に置くのを推す。(7) host の宣言（host.toml）は project ごとの state dir に在るので、その [[plugin]] の行は project ごとに効く。
  検証役の確かめ（docs/grill の P・verified）。(1) 許可を聞かない形（dontAsk）の窓から、確かめを飛ばす形（bypass）の席へ窓どうしの連絡を送ると、席の側で持ち主の承認待ちに止め置かれ、5 分で捨てられる。(2) 口座の設定の許す一覧（殻の命令の bash や git）は、許可を聞かない形でも効き、守りの hook が落ちた時と時間切れの時は道具が走る。(3) 制限の形（--restricted）で非対話の窓を起こすと、口座の設定（許す一覧・hook・環境）を読まず、file の道具は作業の dir と足した dir（--add-dir）に閉じ、渡した道具（--tools）だけが在り、確かめを飛ばす形は断られ、--settings の hook と許しは効き、口座の認証は効いたまま。対話の窓でも同じに効くかは、説明の字（help）と文書と code の字からの推し量りで、撃っていない（inferred）。(4) tmux の新しい窓は tmux の server の環境で起き、-e で渡した値だけが届く。(5) skill は /tsuzuri:consult の名になり、model が自分で撃てる。(6) 席の背景の命令（run_in_background）が終わると、待ちの席は起こされる。(7) 今の tsuzuri の plugin の hook は project の build（target/debug/tz）を撃つので、ほかの project では動かない。(8) tsuzuri の方針の口は配達しない。配達の道が拾うのは裁定の行だけで、器の配達の口が送る字は裁定に決まっている。(9) 器の管理の合図は、40 分黙った席にだけ送られ、変化が無ければ間を空け、停止の記録を置いた席には送られない。(10) 開いた問いの版の要約値は notes を含むので、開いた問いの notes に行を足すと、持ち主の答えが古い版として断られる。
  使用量について。相談の窓は群の同じ口座で動き、新しい課金や鍵を足さないので、憲法 A-1 の「使う」の確認には当たらない。強い model の使用量は器の model 別の見張りには入らない。
decision: |
  (1) 前の判断の字のうち、次の字だけをこの記録の決定に置き換える。ほかの字は効いたまま。
  (ア) ADR-10 決定 (1) の「役割を 2 つにする（orchestrator と consult）」は、器の役割は orchestrator の 1 つのままとし、相談の窓はこの記録の決定 (3)(5) の起動の口が起こす窓と読む。同じ決定 (1) の「持ち主と直に話す」「model は持ち主が選び」は話す窓にだけ掛け、問う窓はこの記録の決定 (10) とする。
  (イ) ADR-10 決定 (2) の「相談は台帳の bead として起こす」は、この記録の決定 (4) の記帳に替える。束を機械が組む字は効いたまま。
  (ウ) ADR-10 決定 (4) の「相談の窓から orchestrator へ送る」と「考え中の席には送らず、停止の hook が拾う」は、この記録の決定 (8) の受け方に替える。席に見えるのは所見の id を指す固定の 1 行だけで、中身は置き場の file から読む字は効いたまま。
  (エ) ADR-10 決定 (5) の「未反映の一覧」は、この記録の決定 (9) の置き場に替える。
  (オ) ADR-10 決定 (7) の model の替え方に、話す窓の中の model の替え（/model）を足す。開き直しも残す。
  (カ) ADR-10 決定 (8) の「repo の外の編集」は「相談の置き場の下の編集」に狭める。
  (キ) ADR-10 決定 (9) の当座の手順は、この記録の決定 (2) の口が着地したら退く。
  (ク) ADR-27 決定 (3) の帯の項目に相談の口を足し、決定 (4) の帯の印が開く窓に相談の窓を足し、決定 (7) の吹き出しの口に相談の口を足す。
  (2) 相談の窓は tsuzuri の plugin の機能として作る。plugin に skill（consult）を置き、本体は tz の consult の命令（開く・束を組む・起こす・見張る・所見を出す・読む・処分する・一覧）にする。plugin の hook と skill は tz を 1 つの決まった解き方（plugin と同じ checkout の build・無ければ PATH の名）で引き、tz と plugin の版を照らして、合わなければ相談の窓を起こさない。project ごとの値（state dir・台帳）は project の宣言から読み、host ごとの値で分岐しない。ほかの project の席は、その project の state dir の host の宣言に tsuzuri の plugin の [[plugin]] の行を足して読む（器の席の推し）。tsuzuri の宣言を持たない project では、plugin の hook は何もしない。ほかの project で使い始める時期は project ごとに持ち主が決める。
  (3) 形は 2 つとする。話す窓は、席の tmux の session に名 consult と相談の id の窓を、持ち主の見ている窓を替えずに開き、持ち主が PC の端末で直に話す（board やスマホから開いても話す所は PC の端末）。問う窓は、席が背景の命令として非対話の Claude Code（claude -p）を起こし、束を読ませて所見を出させて終わる。2 つの形は同じ起動の口（tz consult launch）と同じ口座（決定 (5)）と同じ守り（決定 (7)）と同じ所見の口（ADR-10 決定 (3)）を通る。問う窓の所見も、席はそのまま採らず処分を宣言する（ADR-10 決定 (5)）。話す窓は持ち主が閉じる。持ち主が相談を終えると言った時は、席が起動の口で閉じる。
  (4) 入口は 2 つとする。(ア) 席の窓の skill（/tsuzuri:consult 題・形と model は省けば既定）。持ち主が席の窓で打つか、席が自分で撃つ。(イ) board の上の帯の相談の口（題と形と model を書く窓）と、札と行の吹き出しからその bead を添えて開く口。記帳は、相談の bead を別に起こさず、題の発端の bead の notes に型付きの行で置く。行の頭は「相談の」で始まる閉じた列（相談の頼み・相談の開き・相談の所見・相談の受け・相談の処分）で、器が読む頭（裁定・見送り・昇格済み・まとめた など）と重ねない。行を置けるのは memo と project の根の bead だけで、開いた問い（版の要約値が notes を含む）と契約の bead には置かない。題が問いか契約の時と、帯の口と skill で bead の無い題の時は、親の memo か根の bead に置き、題の id を行に書く。行には起こし手（持ち主の button・持ち主のチャット〔器の発話の記録の時刻を添える〕・席）を書く。button の頼みは面の server が台帳に書き（制約 CON3 の内）、承認として数えない（裁定の行にしない・要件 FR18 の指摘とも別の行）。席には決定 (8) の受け方で届き、席が skill で窓を開く。面の server は窓を開かない。頼みが裁定と同じ時間の内に席に受けられなければ、board の相談の窓に「席に届いていない」と出す。
  (5) 起動の口は席の環境を継いで窓を起こす。口座は席の口座の置き場の環境変数（器が群に割り当てた今の口座）で、tmux の窓には -e で渡す（渡すのは閉じた列＝口座の置き場・PATH・相談の id だけ）。器の席の起こし方（scribe2 seat）は使わない。群の移動の時、開いている話す窓は前の口座のまま動き続け、上限で止まりうる。止まったら持ち主か席が開き直し、束と控えと前の所見から続ける。問う窓は席の子なので、席の起こし直しで止まりうる。起動の口は問う窓の process の印を置き場に残し、tz consult の一覧は所見の無いまま process の無い問う窓を「止まった」と出し、席の停止の hook がそれを拾う。止まった問う窓は、席が束から撃ち直す。新しく開く窓は、その時の席の環境の口座で開く。
  (6) 相談の窓には器の plugin も tsuzuri の plugin も渡さない（plugin は起動の旗でしか読まれない・tsuzuri の plugin の席の hook が相談の窓で裁定を拾うと席に届かなくなる）。起動の口の argv の歯が plugin の置き場の旗の無いことを測る。相談の窓の会話は持ち主の発話として器に記録されない。これは ADR-10 決定 (6)（相談の窓の会話は承認にならない）と合う。制限の形で起こすので、口座の設定（許す一覧・hook・環境）も読まない。相談の窓では、持ち主の口座の hook の守り（host の守り＝壊す git・rm・tmux・台帳の守り）の代わりに、それより狭い決定 (7) の守りだけが掛かる（持ち主に問う）。口座の hook の終わりの台帳の同期と始まりの取り込み（fetch）も撃たれない。
  (7) 守りは起動の口が渡す形で持つ。起動の口は、制限の形（--restricted）・許可を聞かない形（dontAsk）・道具の閉じた列（--tools に読む道具と殻の命令と書きの道具だけ。web の調べの道具は持ち主の答えに従う）・外の道具の断り（MCP の道具を全部断る）・読む根と相談の置き場の足し（--add-dir）・守りの設定（--settings）で窓を起こす。守りの設定は、書きの許しを相談の置き場の下だけに置き（絶対 path の編集の規則で書く）、殻の命令を tz consult の口（台帳と git の履歴を決まった argv で読む口・所見の口）だけに限り（file は組み込みの読む道具で読む）、全部の道具に掛かる守りの hook を置く。守りの hook は path の symlink を解いてから比べ、殻の特別な字（つなぎ・書き先・置き換え・改行）を含む命令を断り、落ちた時も断る形で撃つ（包みの中で hook の時間の上限より短い時間切れを掛け、落ちても越えても終了 code 2 に倒す）。build と実験の写しは相談の窓に持たせない（要る時は所見の持ち主に問うべき事か、席への頼みに書く）。web の調べの道具は既定で持たせず、持ち主が開く時に足すと言った相談だけ足す（持ち主に問う）。対話の窓での制限の形は、作る行で撃って確かめ、確かめられなければ起動の形を問い直す。守りの断りは相談の置き場の log に 1 行ずつ残す。起動の口の argv と守りの判定は歯で測る。
  (8) 所見の口（tz consult answer）は欄を検め（ADR-10 決定 (3)）、置き場の file と、題の bead の notes の所見の行を書く。席は次の形で受ける。席は相談の見張り（tz consult watch）を背景に常に 1 本置く。見張りは project の受けの印の無い相談の行（所見と button の頼み）が現れると、固定の 1 行（相談の id の所見 n が届いた・相談の頼み id が届いた・在りかは台帳と置き場・見張りを置き直す命令の字）を出して終わり、待ちの席を起こす。席は起きたら置き直す。見張りは背景の命令の時間の上限いっぱいで待ち、上限で終わった時も置き直す（上限が短いほど席の turn が増える）。見張りは生きている印を置き場に置き、tsuzuri の plugin の席の停止の hook は、印の無い時に見張りを置くよう席を続けさせる（turn の終わりごとに 1 度）。起こし直しの後は、器の起こし直しの初手の行で撃たれる入力の時の hook が、見張りを置くよう 1 行足す。問う窓は、席の背景の命令の終わりが同じ固定の 1 行を出す。席は所見を読む口（tz consult show）で読み、読んだ口が経路の語（見張り・完了・hook・一覧）つきの相談の受けの行を置く。見張りが無い間の拾いは、tsuzuri の plugin の席の hook（入力の時・道具の周・停止）が、board の未受けの口の安い判じを先に撃ち、受けの無い相談の行を裁定と別の字（相談の頼み・相談の所見）で席に足す。窓どうしの連絡は使わない。器の配達の口に相談の種類を足す道は撤退の先とする（撤退の条件 (2)）。
  (9) 処分の無い所見と、席に届いていない頼みは、board の相談の窓の一覧と tz consult の一覧に出す。要件 FR13 の未反映の一覧は器の判定だけを出すので、そこには混ぜない。帯の相談の口は色の付く数を持たない（色の付く数は持ち主のやる事で、所見の処分は席の手番）。
  (10) model と念入りさの既定は Fable・xhigh（制約 CON6）で、起動の口は念入りさを旗（--effort）で明示する。話す窓は持ち主が開く時に選び、窓の中の model の替えでも替えられる。問う窓は、持ち主の言葉（skill か button）で開く時は持ち主が選び、席が自分で開く時は既定で開く。問う窓の既定は CON6 で持ち主が選んだ既定なので、条 P-16 の持ち主が選んだ model に当たる。席が自分で開く問う窓は、同時に 1 本・1 日（UTC）3 本までとし、問う窓の全部の同時の本数にも上限を置く（値は規則の行に置く）。数えるのは起動の口で、相談の行の起こし手が席の物だけを数え、止まって撃ち直した窓は数えない。越える時は起動の口が断り、席は決定の画面で持ち主に問う。所見の model の欄は出した時の model を書く。
  (11) 持ち主の手は、題を言う（skill か button・形と model は既定なら選ばない）・話す窓で話す・話の終わりに所見を出させる、の 3 つにする。窓を開く・束を組む・最初の指示・所見を席に届ける・開き直しの続き・窓を閉じるは、機械と席がする。
options:
  - id: a
    name: plugin の機能・2 つの形・制限の形の起動・席の見張り
    text: 決定 (1) から (11)。
    verdict: adopted
    reason: 持ち主の 5 つの答えの全部に応え、器の変更なしで今の器と Claude Code の口だけで動く。2 つの形が起動・口座・守り・所見の口・受け方を共有する。守りは口座の設定に頼らず、落ちても断る形にできる（検証役が撃って確かめた）。
  - id: b
    name: 器の席の起こし方で相談の窓を起こす
    text: scribe2 seat の短い形か seat launch で、席として相談の窓を起こす。
    verdict: rejected
    reason: 器の席の答えで、本物の orchestrator の席の行と窓を置き換えると分かった。
  - id: c
    name: 問う窓を席の subagent にする
    text: 席が Agent の道具で別の model の subagent を起こし、所見を出させる。
    verdict: rejected
    reason: subagent は席の許可の形（確かめを飛ばす形）を継ぐので、制限の形の守りを掛けられず、2 つの形で仕組みが分かれる。
  - id: d
    name: 器の配達の口に相談の種類を足す
    text: 器の配達の口（scribe2 seat deliver）に相談の 1 種類（相談の id に動きがある）を足し、button の頼みと所見の知らせを、待ちの席へ器が送る。
    verdict: rejected
    reason: 器の要件の改訂（持ち主が器の側で起こす手続き）と器の判断の記録と契約が要り、時間がかかる。所見も頼みも席の背景の見張りで受けられるので、今は要らない。拾いが遅れる時の撤退の先（撤退の条件 (2)）として残す。
  - id: e
    name: 面の server が窓を開く
    text: board の button を押すと、面の server が tmux の窓を開いて相談の窓を起こす。
    verdict: rejected
    reason: 面の server は台帳と器の記録だけを書く軽い口にとどめる（制約 CON3 の趣旨）ので、process を起こす経路を持たせない。server は群の今の口座の環境も持たない。
  - id: f
    name: Claude Code の許可の設定だけで守る
    text: 計画の形（plan）か、許可を聞かない形と断る一覧だけで読むだけにする。
    verdict: rejected
    reason: 計画の形は控えと所見の file も書けない。口座の許す一覧は合わさって狭められず、守りの hook が落ちると口座の許す命令が走る。
  - id: g
    name: tsuzuri の中だけの道具にする
    text: plugin に置かず、tsuzuri の repo の script と手順で動かす。
    verdict: rejected
    reason: 持ち主の答え (オ)（ほかの project でも使えるように）に反する。
  - id: h
    name: 窓どうしの連絡で所見を知らせる
    text: 相談の窓が、所見の口の出した 1 行を Claude Code の窓どうしの連絡で席へ送る。
    verdict: rejected
    reason: 許可を聞かない形の窓から確かめを飛ばす形の席へ送ると、席で持ち主の承認待ちに止め置かれ、5 分で捨てられる（検証役の実験）。席の名も起こし直しで変わる。
  - id: i
    name: 相談ごとに memo の bead を起こす
    text: 相談を 1 本の memo の bead にし、所見と処分をその notes に書く。
    verdict: rejected
    reason: memo の閉じの頭と審査の列が相談の一生に合わない（器の席の答え）。題の発端の bead の行に置けば、bead を増やさない。
basis: [P-2, P-7, P-12, P-14, P-16, P-19, A-1, N-2, N-7, D-3, FR5, FR8, FR9, FR13, FR18, FR19, CON3, CON6, ADR-10, ADR-12, ADR-27]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo t3-hub.75（作る行の bead が在ればその notes）に 1 件ごとに記帳する。数える材料は、台帳の型付きの行（頼み・所見・受け・処分の時刻と経路の語）と、相談の置き場の守りの断りの log と起動の口の結果の行。問う相手は持ち主（(2) は器の席にも）。
    (1) ADR-10 の条件を引き継ぐ。着地の後の所見を 10 本ずつ区切り、その中で処分の無いまま 7 日を越えたものが 3 本以上になったら、受け方と処分の形を問い直す。
    (2) 着地の後 14 日ごとに、受けの印の経路が hook か一覧で、所見か頼みが台帳に置かれてから受けまで 30 分を越えた物が 3 件以上なら、器の配達の口に相談の種類を足す道（案 d）を持ち主と器の席に問う。
    (3) 着地の後 14 日の内に、守りの断りが 1 相談で 5 件を越えた相談が 3 件以上なら、閉じた一覧を問い直す。
    (4) 着地の後 30 日の内に、起動の口が窓を開けなかった（結果の行が失敗）ことが 2 度あったら、起動の形を問い直す。
    (5) 席が自分で開いた問う窓の所見が 10 本たまるごとに、処分が「採らない」の物が 7 本を越えていたら、席が自分で問う範囲を問い直す。
    (6) 着地の後 14 日の内に、守りの hook が断る印（終了 code 2）でなく落ちたか時間切れになったことが、守りの断りの log に 1 件でもあったら、守りの撃ち方を直す行を立てる。
plain: |
  設計の相談の窓を、手作業を減らして使える形に作り直します。あなたの手は「題を言う」「話す」「話の終わりに結論を出させる」の 3 つだけです。
  入口は 2 つです。席の窓で「/tsuzuri:consult 題」と打つか、board の上の帯や項目の吹き出しの「相談」を押して題を書きます。席が窓を開き、読む材料を揃えます。board から押した頼みは、席が背景に置いている見張りですぐ気づきます。見張りが外れている間は遅れることがあり、その間は board に「席に届いていない」と出ます。
  相談の形も 2 つです。あなたが直に話す窓（PC の端末の別の tmux の窓）と、席が強い model に問うて結論だけをもらう話さない形です。model はいつもは Fable で、開く時や窓の中で替えられます。席が自分で問うのは 1 日 3 本までです。
  窓は席と同じ口座（群の口座）で開きます。口座が移っても開いている窓は前の口座のままで、上限で止まったら開き直して続きから話せます。強い model の使用量も同じ口座に数わります。
  窓は repo と台帳を書けず、結論は決まった形の file に書きます。相談の窓では、いつもの守りの代わりに、置き場の下だけ書けて決まった読む命令だけを撃てる、もっと狭い守りが掛かります。web の調べと、試しに動かすことは、いつもは持たせません。台帳へは結論の印だけを機械が書きます。結論ができると席が自動で気づき、採るかどうかを必ず記録します。承認は今までどおり決定の画面だけで受けます。
  tsuzuri の plugin の機能として作るので、ほかの project でも使えるように作ります。ほかの project で使い始める時期は、project ごとに決めます。
  この記録はまだ提案です。決定の画面の問いで承認をもらいます。
note: 番号 28 は起草 w60a の持ち込みの判断の記録に空けてある（ADR-27 の note）。承認の時に、要件 FR19（記帳・2 つの形・起動の口・守り・受け方）と FR5（吹き出しの相談の口）と帯の項目を持つ要件の字とFR19 の受入の字（器の口の argv を、起動の口の argv と守りの判定と見張りの 1 行に）を改め、制約 CON6 に問う窓の model の選び手を足し、scope と語彙表の相談の窓の def を改め、席が自分で開く問う窓の上限の規則の行を足す。相談の行の頭を器の局面が無視することと、導出グラフが相談の行の頭を知ることは、作る行の前に器の席と確かめる。当座の手順 docs/consult/ は、決定 (2) の口が着地した時に退きの置き場へ移す。器の memo s2-07l.738.42.14（群の今の口座を返す読むだけの命令）は、この記録では使わない（面の server は窓を開かない）。承認の後に器の席へ知らせる。
