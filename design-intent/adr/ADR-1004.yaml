consequences:
  - "良い点は、 依存 0 本のまま今日から状態を永続でき、 process を殺しても続きが引けること、 環境変数の増殖を最初から塞げることです。 悪い点は、 file が追記だけなので大きくなり続けること、 同じ host の中でしか lock が効かないこと、 憲法 §3 の写しと manifest の drift をまだ機械が測れないことです。"
  - "Positive"
  - "・直接依存 0 本 (NFR1003) を保ったまま fleet の永続面が手に入る。 cell の sandbox が crates.io を引けなくても build できる。"
  - "・現在地が replay で決まるため、 process を殺して別 process で resume できる (SRS AC1004)。 席の記憶や散文を判定入力にしない (C3.3) 形が構造で決まる。"
