  器の案の章の要約: 候補を 6 つ並べます。 4 つの局面と 2 つの昇格の形と種類ごとの閉じた理由の形を決める案 (選んだ案)、 今の条件のまま辿れる契約が全部閉じたら閉じる案、 memo を閉じずに開いたまま置く案、 memo の見送りを席の判断で書ける案、 門が台帳を読んで確かめる案、 契約の取り下げにも裁定の番号を求める案です。
  器の専門語の説明: 本文に出てくる専門語 10 個を、 やさしい言葉で説明します。
  ・memo（memo）: 台帳の bead のうち label intake:memo を持ち、 受入条件の設計 pointer を持たない覚え書き (ADR-1051 の 4 象限)。 本文に 4 つの節を持ち、 昇格条件の節に引き金の行を持つ (FR1087)。 開いた memo は 4 つの局面のどれかにいて、 close の理由は昇格済み・まとめた・見送りの 3 つの形に限る (FR1091)。
  ・局面（lifecycle position）: 部品が一生のどこにいるかを表す閉じた語 (FR1090)。 便の段とは別の語。 開いた memo の局面は宣言順に memo-promoting (昇格の途中)・memo-asking (問いの返事待ち)・memo-actionable (処置の待ち)・memo-waiting (引き金待ち) で (FR1091)、 当たらない memo は misfit。
  ・昇格の行（promotion line）: memo を残して契約を分ける昇格で、 memo の notes に足す閉じた文法の 1 行。 「昇格: 全部 <契約 id の列>」(分けた契約の全部) か「昇格: 一部 <契約 id の列>」で、 複数在れば最後の行で判じる。 全部の行の memo は引き金の判定と審査から外れ、 最後の行が全部で列が辿れる契約と一致し全部着地の形で閉じると、 子の開いた問いと処置の無い判定を持たなければ器が「昇格済み」で閉じる。
  ・close の理由の文法（closed-reason grammar）: bead の close_reason を種類ごとの閉じた形の和に限る決まり (字面の正本は本 ADR・SRS FR1091 は形の名)。 頭は 9 つ (種類との組は 10 形) で、 契約は landed <着地 commit id>・重複・後継・取り下げ <理由>、 台帳の問いと decision の型は裁定 <裁定 id>、 memo は昇格済み・まとめた・見送り <裁定 id>、 epic は完了と取り下げ。 和の外は起票の門が字面で断り、 種類との食い違いは misfit。
  ・処置（disposition）: memo に席が付ける始末の閉じた 4 種 (昇格・close・引き金の行の書き直し・keep の記帳・FR1087)。 昇格は 2 つの形で、 close の理由は memo の 3 つの形に限る。 引き金が満ちて keep の記帳の無い memo と処置の無い昇格か close の判定を持つ memo は、 処置の待ち (memo-actionable) に出る。 知らせ直しは処置が付いただけでは止まらず、 局面が memo-actionable を出るまで続く。
  ・着地の形（landed form）: close_reason が landed と着地 commit id で始まる閉じ。 land の終端が CI の結果と共に書く (FR1050)。 SRS は形の名だけを持ち、 字面は本 ADR。 自動の close は、 最後の昇格の行の列の契約が全部この閉じのときだけ memo を閉じる。
  ・misfit（misfit）: 局面の出力で、 どの局面にも当たらない部品と、 FR1091・FR1092 が定める形 (読める引き金の無い memo・閉じの誤りなど) の部品に付く局面の値 (FR1090)。 理由の語を持ち、 手番は席。 閉じの misfit は切り替えの線より後の閉じだけに掛かり、 開いた memo の misfit は線に依らない。
  ・起票の門（ledger write gate）: 器の plugin を積む席の hook が、 席の道具の呼び出しの台帳の書きの command を実行の前に読んで断る門 (ADR-1056・FR1081)。 close の判定では command と本文の file だけを読み台帳を読まない (台帳を読むのは親の付け先の形の判定だけ・ledger-form §12)。 本 ADR で、 理由が close の理由の文法の外の close と席の着地の形の close を断る。
  ・discovered-from（discovered-from）: 台帳の依存の辺の種類の 1 つ。 memo を残して契約を分ける昇格で、 分けた契約から memo へ張る。 memo から辿れる開いた契約が在れば memo-promoting で、 昇格の行の列と食い違う memo は自動の close をされない。
  ・引き金（trigger line）: memo の昇格条件の節に置く、 器が判じる 1 行 (閉じた 5 形・FR1087・ADR-1085)。 満ちない memo と満ちて keep の記帳が付いた memo は memo-waiting、 満ちて記帳の無い memo は memo-actionable。 読める引き金の無い memo は、 memo-promoting にも memo-asking にも当たらなければ misfit。
