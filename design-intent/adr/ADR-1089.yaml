      （平易）今の決まりのまま、 memo から辿れる契約が全部閉じたら、 land の終端 (取り込みの最後の手順) で器が memo を閉じる案です。 席は辺を 1 つ張るだけで済み、 上がり切った memo が開いたまま残らず、 新しい形も足さない点で勝ります。 けれども、 候補の一部だけを上げた memo も、 上げた契約が閉じると残りの候補ごと閉じます。 契約の閉じ方も問わないので、 着地せずに閉じた契約だけでも memo が閉じ、 要望が黙って落ちます。 閉じた理由の字は自由なままで、 閉じ方を機械で読めません。 だから退けました。
