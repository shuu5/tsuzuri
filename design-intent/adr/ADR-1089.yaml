  部分 supersede。 ADR-1051 から置き換えるのは 3 点 — (a) 決定の「memo から契約への遷移 SHALL 受入条件に pointer 行を書き label を外し … discovered-from の edge を張る 3 書きとし」を、 その 3 書きを昇格の (i) の形として残したうえで、 memo を残して契約を分け notes に昇格の行を足す (ii) の形を並べる形に、 (b) 決定の「memo の close SHALL 着地の終端が行い (辿れる契約が全部 closed になった周・既存の close の 1 種)、 辿れない周と読めない周 SHALL close せず台帳 lint が名指す」を、 自動の close の条件 (最後の昇格の行が全部で、 列と辿れる契約が一致して 1 本以上在り、 全部が着地の形で閉じ、 子の開いた問いと処置の無い昇格か close の判定を持たない) を満たす memo だけを、 land の終端が契約を close した周と dispatch の周の 2 つの契機が「昇格済み <契約 id の列>」で閉じ、 読めない周は閉じずに次の契機の周に判じ直す形に (設計 ledger-form.md §3 の 10 の理由の字〔着地の sha〕もこの形に置き換わる)、 (c) (b) の閉じ残りを名指す台帳の lint の項目 (§3 の 4 の (viii)) の役を、 局面の出力の memo-actionable と misfit に (doctor の行を消す手番は同じ束の ADR-1088 の局面の出力と同じ便が持つ)。 ADR-1085 から置き換えるのは 5 点 — (d) 決定の「discovered-from で辿れる契約を持つ memo (昇格済み) を除き」を、 昇格の行が全部の memo だけを引き金の判定と審査から外す形に (一部の memo は外さない)、 (e) 決定の処置の「昇格 (acceptance に設計 pointer を持つ契約へ書き直す)」を 2 形に、 処置の close を memo の close の 3 つの理由の形 (昇格済み・まとめた・見送り) に、 (f) DR4 の「memo の処置は席の手番のまま、 器の台帳の書きは着地の close の 1 種のまま」を、 昇格済みの close は器が撃ち (land の終端が契約を close した周と dispatch の周・どちらも計算で決まる close の 1 種)、 見送りは memo の子の台帳の問いへの user の裁定 id を要る形に (memo を落とす〔見送る〕かを席だけで決める形を外す・処置の 4 種の数は変えない)、 (g) OPT6 の欠点が拠った「器の close は着地の終端の 1 か所」を、 land の終端と dispatch の周の 2 か所 (どちらも計算で決まる close の 1 種) に、 (h) 決定の「doctor の台帳の lint の項目 (FR1051) SHALL 処置の付かない昇格の待ちの memo の本数と最古の年齢を出す」と通知の「昇格の待ちの数」を、 処置の待ちの memo (memo-actionable) の本数と最古の年齢と数に (数えは局面の出力と同じ判定の結果・FR1094)、 知らせ直しを止める「処置が付くまで」を、 memo の局面が memo-actionable を出るまでに (処置が付いただけでは止めない・FR1087)。 ADR-1085 の処置の待ち (引き金の満ちた memo〔ADR-1085 の語で昇格の待ち〕と、 処置の無い昇格と close の判定) は、 本 ADR の memo-actionable が閉じ残りの条件を足して含み、 keep の判定と、 満ちた引き金に keep の記帳が付いた memo は memo-waiting に置く。 動かさないもの: ADR-1051 の 4 象限・memo の 4 節・起票の門の memo の 4 節の検査・契約表からの plan、 ADR-1085 の引き金の 5 形と字面・審査の lens (本数・間隔・判定の 3 値・口座と封じ込め)・器が審査の判定で memo を閉じないこと・周ごとの知らせ直し (止める時は (h))・処置の 4 種。 ADR-1045 §2 の dispatcher の着地は不変で、 land の終端が台帳へ書くのは便の close と memo の自動の close だけ (FR1050)、 dispatch の周の memo の自動の close も dispatcher の close の 1 種である。 裁定の行を書いて台帳の問いを「裁定 <裁定 id>」で close するのは bind と裁定面の答えの口 (FR1082・ADR-1083) で、 本 ADR はこの書きを動かさず、 その close の理由を文法の 1 形として数えるだけである (器の台帳の書きは close と裁定の行・SRS の台帳 adapter)。
