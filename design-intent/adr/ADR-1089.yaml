  開いた memo は名のある局面のどれかにいて、 bead が出ていくのは名のある形の閉じだけにする。 要望を落とす出口は user の裁定だけが開け、 どこにも当たらないものは misfit として見せる。
  本 ADR が、 宣言なしに閉じる形・閉じない形・席の判断の見送り・台帳を読む門・契約の取り下げにも裁定を求める形を退け、 4 つの局面と種類ごとの閉じた理由の形を採ったのはこの原則に行き着く (これ以上は遡らない照会終端)。 採った形はこの原則を、 数えの外の 3 つ (その場で昇格した契約の取り下げ・「まとめた」の移しの妥当さ・「全部」か「一部」かの宣言と書き直す昇格が候補の全部を覆うか・CSQ-N3) を除いて満たす。 射程は台帳の bead の閉じ方と開いた memo の居場所で、 契約の着地の判定と審査の lens の判定には掛けない。
options:
  - id: "OPT1"
    name: "開いた memo を 4 つの局面に置き、 昇格を 2 形にし、 全部の昇格が全部着地した memo だけを器が閉じ、 bead を閉じる理由を種類ごとの閉じた形に限る"
    text: |
      開いた memo は memo-promoting・memo-asking・memo-actionable・memo-waiting の宣言順のどれかにいて、 読める引き金の行を持たず memo-promoting にも memo-asking にも当たらない memo と、 当たらない memo は局面 misfit で出る。 昇格は memo を契約へ書き直す形 (1 memo → 1 契約) と、 memo を残して契約を分け notes に昇格の行 (全部か一部と契約 id の列) を足し discovered-from を張る形の 2 つ。 land の終端が契約を close した周と dispatch の周は、 自動の close の条件 (最後の昇格の行が全部で、 その行の契約 id の列と discovered-from で辿れる契約の列が一致して 1 本以上在り、 その全部が着地の形で閉じ、 子の開いた台帳の問いと処置の無い昇格か close の審査の判定を持たない) を満たす memo (閉じるまでは memo-promoting) を「昇格済み <契約 id の列>」で閉じ、 それ以外の閉じ残りは memo-actionable で席の手番にする。 close_reason は種類ごとの閉じた形の和 (頭は 9 つ・種類との組は 10 形) に限り (契約・台帳の問い・memo・epic・decision の型の全部に形があり、 裁定 id を要るのは memo の見送り〔memo の子の台帳の問いの裁定〕と、 裁定そのものを記す問いと decision だけ)、 起票の門は台帳を読まずに和の外と席の着地の形の close を断り、 種類と形の食い違いと解けない id は局面の出力が misfit で数える。 memo の notes の大きさは rules 行の上限を越えると台帳の lint が名指す。 決め手は裁定 13:14Z (開いた状態 3 つ・閉じ方 3 つ・見送りは裁定) と、 常設の指示 00:54Z の下の orchestrator の決定 (4 つ目の局面・昇格の 2 形・自動の close・契約と epic と decision の閉じの形・見送りの裁定を memo の子の問いの裁定に限る) と、 分析 (要望を落とす出口が、 数えの外の 3 つ〔その場で昇格した契約の取り下げ・「まとめた」の移しの妥当さ・「全部」か「一部」かの宣言と書き直す昇格が候補の全部を覆うか〕を除き user の裁定だけに残り、 契約の片付けは席に残り、 門は close の判定で台帳を読まない)。
      （平易）選んだ案です。 開いた memo は、 優先の順に、 昇格の途中 (memo から辿れる契約が開いているか、 器が閉じる条件を満たして閉じるのを待つ)・問いの返事待ち (memo の子の台帳の問いが開いている)・処置の待ち (引き金が満ちて「残す」の記帳が無い・審査役の「上げる」か「閉じる」の判定に始末が無い・昇格の行を持ち辿れる契約に開いたものが無いのに器が閉じる条件を満たさない)・引き金待ち (読める引き金が在って満ちないか、 満ちた引き金に「残す」の記帳が付いた) のどれかにいます。 読める引き金が 1 つも無く昇格の途中でも問いの返事待ちでもない memo と、 どれにも当たらない memo は misfit です。 昇格は、 memo をそのまま契約に書き直す形と、 memo を残して契約を分け notes に「昇格: 全部」か「昇格: 一部」と契約の番号を書く形の 2 つです。 最後の昇格の行が「全部」で、 行に書いた契約の番号と memo から辿れる契約が一致して 1 本以上在り、 その全部が着地で閉じ、 子の台帳の問いが開いておらず、 審査役の「上げる」か「閉じる」の判定が始末の無いまま残っていない memo だけを、 器が、 land の終端 (取り込みの最後の手順) が契約を閉じたときか便を起こす仕組みの回に「昇格済み」と閉じます。 bead を閉じる理由は種類ごとの決まった形 (頭は 9 つ) に限り、 memo の見送りには、 その memo の子の問いへの user の裁定の番号が要ります。 契約の重複・後継・取り下げは席が理由を添えて片付けます。 形の外は門が台帳を読まずに止め、 種類との食い違いや解けない番号は後から misfit で数えます。 memo の notes が上限の大きさを越えたら点検が名指します。 落とす出口が (その場で昇格した契約の取り下げと、 「全部」か「一部」かを席が正しく書いたかを除き) user の裁定だけに残り、 「一部」と書いた昇格が残りを巻き込まず、 門が閉じる判定で台帳を読まない点で勝ります。 代わりに、 席が書く行が増え、 字の形で止められない崩れは後から数えるだけになり、 契約の取り下げの妥当さは機械で確かめず、 その場で昇格した契約の取り下げは数えの外に残り、 「まとめた」の候補が本当に移ったかも、 「全部」か「一部」かを席が正しく書いたか (memo を書き直した契約が候補を全部覆うかも) も確かめず (席が「全部」と書けば、 器は残りの候補ごと memo を閉じます)、 今ある memo の移し替えと版を跨ぐ約束が増えます。
      利点: 閉じた bead の理由から閉じ方が機械で読め、 memo の見送りは user の裁定 id に結び、 着地の外で閉じた契約を辿る memo は memo-actionable に残るので、 席が要望を黙って落とす形が門と misfit の 2 か所で見える (その場で昇格した契約の取り下げ・「まとめた」の移しの妥当さ・「全部」か「一部」かの宣言と書き直す昇格が候補の全部を覆うかは数えの外・DR1)
      利点: 開いた memo は 4 つの局面か misfit のどちらかに必ず出て、 判定は 1 つの関数と列挙の宣言順で決まる (DR2)
      利点: 昇格の行に「一部」と書いた memo は残りの候補ごと閉じず、 分けた契約が全部閉じた後に memo-actionable として席へ戻る (DR3)
      利点: 門は close を字面だけで断り台帳を読まず、 器の台帳の書きに足すのは memo の自動の close (close の 1 種) だけ (DR4)
      利点: どの種類の bead にも閉じる形があり、 契約の重複・後継・取り下げは席がその場で片付けられる。 memo を契約へ書き直す昇格は今の 3 書きのまま通る。 足すのは notes の 1 行の形と理由の文法と rules 行 1 本 (DR5)
      利点: 作業の記録を積んだ memo を台帳の lint が名指す (DR6)
      欠点: 分ける昇格では席が昇格の行と discovered-from の 2 つを書き、 両者が食い違う memo は自動の close をされず、 後から memo-actionable で見えるだけ
      欠点: 門は字面しか見ないので、 種類と形の食い違い・解けない id・notes の大きさは編集の時点で止まらず、 局面の出力と台帳の lint が後から数える (C16 の編集の時点の止めは和の形まで)
      欠点: 契約の取り下げは理由の字を添えれば席が閉じられるので、 取り下げの妥当さは機械で確かめず、 保証はその契約を辿る memo の memo-actionable と、 行の着地との突き合わせ (局面の出力の設計) に頼り、 その場で昇格した (memo を書き直した) 契約の取り下げは辿る memo が残らず数えの外に残る。 「まとめた」で候補が本当にまとめ先の memo へ移ったかも機械は確かめない。 「全部」か「一部」かの宣言と、 memo を契約へ書き直す昇格が候補の全部を覆うかも機械は確かめず (memo の候補の節は自由な文)、 席が「全部」と書けば器は残りの候補ごと memo を閉じ、 書き直しでは残りの候補が契約の着地と共に消える
      欠点: 既存の open な memo 23 本と、 memo でない bead から辿れる 10 本の memo は、 昇格の行・辺・読める引き金を足すまで memo-actionable か misfit に出る
      欠点: 跨版の面 (昇格の行の字面・close_reason の頭の 9 形・rules 行 1 本・misfit の理由の語) が増える
    verdict: adopted
    reason: "決め手は裁定 13:14Z (開いた状態 3 つ・閉じ方 3 つ・見送りは裁定) と、 常設の指示 00:54Z の下の orchestrator の決定 (4 つ目の局面・昇格の 2 形・自動の close・契約と epic と decision の閉じの形・見送りの裁定を memo の子の問いの裁定に限る) と、 分析 (要望を落とす出口が、 数えの外の 3 つ〔その場で昇格した契約の取り下げ・「まとめた」の移しの妥当さ・「全部」か「一部」かの宣言と書き直す昇格が候補の全部を覆うか〕を除き user の裁定だけに残り、 契約の片付けは席に残り、 門は close の判定で台帳を読まない)。"
