# 判断の記録 ADR-1089 — 器 scribe2 の判断の記録 ADR-0089 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1089
title: "開いた memo は宣言順の 4 つの局面のどれかにいて、 bead は種類ごとの閉じた理由の形でだけ閉じる — 昇格は memo を契約へ書き直す形と memo を残して契約を分け昇格の行を足す形の 2 つ、 全部の昇格が全部着地した memo だけを器が「昇格済み」で閉じ、 memo の見送りだけは user の裁定を要る (ADR-1051 と ADR-1085 の memo の昇格・close・数え・知らせ直しの止めの決定を部分 supersede)"
status: accepted
date: 2026-09-28
context: |
  memo (契約の前の覚え書き) を契約へ上げる形は 1 つしか決まっておらず、 候補の一部だけを上げた memo も、 辿れる契約が閉じると残りの候補ごと閉じる条件だった。 閉じた理由の字は自由で、 席が要望を黙って閉じても機械は見分けられない。 本 ADR は、 開いた memo の居場所を 4 つの局面に、 昇格を 2 つの形に、 bead を閉じる理由を種類ごとの閉じた形に閉じ、 器が閉じてよい memo と、 user の裁定なしには閉じられない memo を分ける。
  なぜこの判断が要るのかを 6 つで示します。 経緯 (memo を契約へ上げる形が 1 つしか無く、 閉じる条件が「辿れる契約が全部閉じた」だった)・事象 (一部だけ上げた memo が残りごと閉じ、 閉じた理由の頭の語は 100 通りを越えて機械で読めない)・裁定 (user が memo の整頓の定義を推奨の案で決めた)・現物 (台帳の書き込みの門は閉じる書き込みの判定で台帳を読まず、 取り込みの最後の手順が台帳へ書くのは閉じる書き込みだけ)・憲法と既存の決定の向き・射程です。
  CTX1 経緯 — ADR-1051 と ADR-1085 は昇格を 1 つの形だけで持ち、 memo（契約の前の覚え書き） を閉じる条件を「辿れる契約が全部 closed」に置いた
  ADR-1051 は台帳の bead を label intake:memo と受入条件の設計 pointer の 2 つの印の 4 象限で閉じ、 memo から契約への遷移を 3 書き (受入条件に pointer 行を書く・label を外す・discovered-from（契約から覚え書きへの辺） の辺を張る) として席の手番に置いた。 同じ ADR は memo の close を land の終端に置き、 その memo から discovered-from で辿れる契約が全部 closed になった周に閉じ (理由の字は着地の sha を持つ・設計 ledger-form.md §3 の 10)、 辿れない周と読めない周は閉じずに台帳の lint の項目 (同 §3 の 4 の (viii)) が名指す、 と決めた。 ADR-1085 は昇格条件の節を閉じた 5 形の引き金（契約へ上げる条件の行）の行にし、 処置（覚え書きへの始末）を 4 種 (昇格・close・引き金の行の書き直し・keep の記帳) に閉じ、 昇格を「受入条件に設計 pointer を持つ契約へ書き直す」と定め、 discovered-from で辿れる契約を持つ memo を昇格済みとして引き金の判定から外した。 ADR-1085 は、 審査の lens の close の判定で器が memo を閉じる案を、 器の close は land の終端の 1 か所 (計算で決まる close) に限られ、 閉じるか残すかは人 (席) の裁定である、 として退け、 memo の処置を席の手番に置いた (DR4)。 どちらの記録も、 1 つの memo から契約を複数に分ける形と、 close の理由の字の形を決めていない。
  CTX2 事象 — 一部だけ上げた memo は残りの候補ごと閉じ、 閉じた理由の字は機械で読めない
  memo は候補の節に複数の候補を持ちうり、 その一部だけが契約になることがある。 今の条件は、 memo に候補が残っていても、 辿れる契約が全部 closed になった周に memo を閉じる。 条件は契約の閉じ方を問わないので、 着地せずに閉じた契約だけでも memo は閉じる。 land の終端の memo の close はまだ code に無く (終端が閉じるのは便の契約だけ)、 台帳の lint が、 辿れる契約が全部 closed の open な memo を数えるだけである。 本 repo の台帳 (2026-09-28・bead 802 本) の実測: label intake:memo の bead は 129 本で open は 23 本、 memo でない bead から discovered-from で辿れる memo は 10 本 (辺 32 本・open な memo では 3 本) である。 閉じた bead 775 本の close_reason の最初の語は 102 通り、 閉じた memo 106 本では 53 通りで、 着地の形（着地で閉じた印） (landed と着地 commit id で始まる字) は 251 本だけである。 閉じた memo が上がったのか・まとめられたのか・見送られたのかを機械は読めず、 席が要望を黙って閉じても見分けがつかない。 open な memo の notes は中央値 764 byte だが、 最大の 1 本 (s2-07l.669) は 41,133 byte の作業の記録になっている。
  CTX3 裁定 — 案件の一生の方向と、 memo の整頓の定義 (問い 4)
  user は 裁定 user 2026-09-28T12:46Z で、 案件 (memo か台帳の問いから始まり、 その子の問い・昇格した契約・便・着地までを束ねた単位) の一生を、 器・裁定面・user の間で 1 対 1 に揃え、 LLM の死角を残さず、 memo の整頓もこの粒度で定義する方向を決めた。 問い 4 (memo の整頓の定義と今の開いた memo の処置) は 裁定 user 2026-09-28T13:14Z で推奨の案を採った。 その推奨は、 開いた memo は名のある状態 (引き金待ち・問いの返事待ち・昇格の途中) のどれかにいて、 閉じた memo は名のある閉じ方 (昇格済み・まとめた・見送り〔裁定を要る〕) のどれかを持ち、 作業の記録を memo に置かない、 という形である。 草稿の審査が、 引き金が満ちた memo と処置の無い審査の判定を持つ memo の居場所が無いこと (ADR-1085 の処置の待ち) と、 着地の外の閉じでも閉じる条件の甘さを見つけ、 orchestrator が下の常設の指示の下で 4 つ目の局面（一生のいまの位置） memo-actionable を足した。 SRS の審査は、 close の理由の文法（閉じ方の決まった形）が着地しない契約と decision の型の bead を覆わず、 席が閉じられない bead ができることを見つけ、 orchestrator は契約の閉じの形を重複・後継・取り下げ (理由の字つき・裁定 id を求めない) に広げると決めた (契約は席の作業の単位で、 片付けのたびに user の裁定を求めると自律を損ない、 要望を黙って落とさない保証は memo の側が持つ〔その場で昇格した契約の取り下げを除く・CSQ-N3〕)。 残りの分岐 (昇格の 2 形と昇格の行（上げた契約を書く行）の読み方・自動の close の契機と条件・門の入力・decision と epic の形・見送りの裁定を memo の子の台帳の問いの裁定に限ること) は 裁定 user 2026-09-28T00:54Z の常設の指示の下で推奨の形に決めた。 逐語は台帳にだけ在る (記録は memo s2-07l.739)。
  CTX4 現物 — 起票の門（台帳の書き込みを止める門）は close の判定で台帳を読まず、 land の終端の台帳の書きは close だけで、 局面の出力が死角を数える
  起票の門 (ADR-1056・FR1081) は、 close の書きの判定では、 器の plugin を積む席の道具の呼び出しの bd / bdw の command の字面と本文の file だけを読み、 台帳を読まない (ADR-1085 の memo の書きの門と同じ線・hook の予算は NFR1005 の 2.0 秒と重い I/O を持たない線)。 門が台帳を読むのは親の付け先の形の判定 (設計 ledger-form.md §12・掛かる書きの周に 1 回だけ) だけで、 その読みは低い負荷では 1 秒ほどで予算の内側だが、 負荷の間は予算を越え、 正しい書きを断り続けた (memo s2-07l.738.3)。 close の command の字面からは、 名指した bead が memo か契約かも、 理由の裁定 id が解けるかも分からない。 land の終端が台帳へ書くのは便の close で、 理由は着地の形 (landed と着地 commit id で始まる字) で CI の結果を持つ (ADR-1045 §2 の dispatcher の着地・FR1050)。 これとは別に、 器の口 bind と裁定面の答えの口が、 台帳の問いの notes に裁定の行を書き、 問いを「裁定 <裁定 id>」で close する (FR1082・ADR-1083)。 SRS 版 0.29 の台帳 adapter は、 器の台帳の書きを close と裁定の行 (FR1050・FR1082・FR1093) の口に限り、 着地の形の close は land の終端だけが書く (FR1081 (d))。 dispatch の周は周ごとに台帳を 1 回読み、 open な memo の全部の引き金を判じる (FR1087)。 SRS 版 0.29 は、 部品 (局面の出力が局面と手番を導く閉じた 9 種の単位) ごとの局面を器が 1 つの判定で導き、 どの局面にも当たらない部品を misfit（どこにも当たらない印） と理由の語で出し、 close した部品を出力に載せる窓 (rules 行 lifecycle.closed_window_h) を表示にだけ掛ける局面の出力を持ち (FR1090・同じ束の ADR-1088)、 便の終端の周の通知・doctor の行・管理 tick の alarm などの読み手は自前の判定を持たずにその結果を使う (FR1094)。 memo の子に台帳の問いを起こすと親の label intake:memo を継ぐので、 継がない指定を持たない create は起票の門が断る (FR1081 (a)・同じ束の ADR-1087)。
  CTX5 憲法と既存の決定の向き — 1 関数と宣言順・台帳は task と裁定だけ・編集の時点の止め
  C2 は選別と経路を 1 つの列挙の上の 1 関数にし、 適用の順を列挙の宣言順だけから取り、 順の散文を持たない。 C15 は台帳を task と裁定の記帳に限り、 規律を置かない (知見は ADR と research へ)。 C16 は仕様からの外れを編集の時点で止め、 後の検証で代えない。 C1 は規則の値を manifest の 1 file に置き、 C5 は rules 行の変更に user の裁定 id を求める。 C17.2 は記録・rules 行・仕組みを足す前に、 消すものを名指させる。 N2 は散文にしか無い規則を規則と認めない。 ADR-1053 は計算できる判断を code に、 意味の判断を lens に、 裁定を人に置く。 要望を落とすかは user の判断で、 席の判断で memo を閉じる形は、 要望の取りこぼしを席が作れる形である。 見送りの裁定 id を memo の子の台帳の問いの裁定に限れば、 その裁定がどの memo を落とす裁定かを台帳の親子の辺で確かめられる。 契約は設計から起こした席の作業の単位で、 その片付け (重複・後継・取り下げ) は席の手番に置ける。 本 ADR は C16 の読みを決める: 起票の門は hook の予算 (NFR1005) の内側で字面から判じられる外れを編集の時点で止め、 台帳の中身を要る判定 (bead の種類・id の解け・notes の大きさ) は局面の出力と台帳の lint が後から件数と id で数える。
  CTX6 射程 — 動かすのは局面・昇格の形・自動の close・close の理由の文法・notes の上限の 5 つ
  要件は SRS 版 0.29 の FR1091 (memo の局面と処置・常時)・FR1093 (memo の自動の close) と、 改訂した FR1050 (close の理由の頭と land の終端の台帳の書きの範囲)・FR1081 (起票の門の 4 つの断りの (d))・FR1087 (処置の中身と処置の待ちの数え)・FR1051 (処置の待ちと notes の上限)・FR1090 (局面の出力の misfit)・FR1094 (局面の出力の読み手) が持ち、 AC1061 が測る。 動かすのは、 開いた memo の局面の判定、 昇格の形、 memo の自動の close の条件と契機、 bead の close_reason の文法と門、 memo の notes の上限の lint の 5 つである。 動かさないのは、 memo の 4 節と 4 象限、 引き金の 5 形と審査の lens (本数・間隔・判定の 3 値)、 器が審査の判定で memo を閉じないこと、 land の終端の台帳の書きが close だけであること (FR1050)、 bind と裁定面の答えの口の書き (FR1082)、 起動の列 (memo は便を起こさない)、 処置の 4 種の数である。 局面の出力の置き場・手番・年齢・書き直しの契機は同じ束の ADR-1088 が、 発話を memo へ結ぶ仕分けは ADR-1087 が持つ。 局面の値 memo-actionable は、 前の器が消した棚卸しの印 [MEMO-DUE] (ADR-1085) と字を分けた別の語である。 昇格の行と close の理由の字面の正本は本 ADR が持ち、 SRS は形の名だけを持つ (FR1091・FR1050 の着地の形・FR1082 の裁定の形)。 設計 ledger-form.md の改稿が文法を写す。 ADR を書く条件のうち 1 (C16 と C15 の読み)・3 (notes の行の形・close_reason の形・rules 行は版を跨ぐ形)・4 (却下案を残す価値のある分岐) に当たり、 ADR-1051 と ADR-1085 の決定の一部を置き換える。
  （選択肢を測るものさし）この判断を測る 6 本のものさしです。 要望を席が黙って落とせないこと。 開いた memo は名のある局面のどれかに必ずいて、 当たらないものと閉じ方の崩れが見えること。 一部だけ上げた memo を残りごと閉じないこと。 門は閉じる判定で台帳を読まず、 器が台帳へ足す書き込みは memo を閉じる 1 つだけであること。 どの種類の bead にも閉じる形があり、 契約の片付けに user の手を要らず、 足すものを最小にすること。 台帳に作業の記録を積まないことです。
  DR1｜要望を席が黙って落とせない — 閉じた理由は機械で読める閉じた形で、 memo を落とす出口 (見送り) は user の裁定を要り、 着地の外で閉じた契約を辿る memo は処置を求められる CTX2・CTX3・CTX5
  DR2｜開いた memo は名のある局面のどれかに必ずいて、 当たらないものと閉じ方の崩れは misfit として見える (死角を残さない・1 関数と宣言順) CTX3・CTX4・CTX5
  DR3｜一部だけ上げた memo を、 残りの候補ごと閉じない CTX1・CTX2
  DR4｜起票の門の close の判定に台帳の読みを足さず (NFR1005・ADR-1085 の線)、 本 ADR が器の台帳の書きに足すのは memo の自動の close (close の 1 種) だけで、 land の終端が台帳へ書くのは便の close とこの close だけ (FR1050)。 裁定の行を書いて台帳の問いを close するのは bind と裁定面の答えの口 (FR1082) で、 本 ADR は動かさない CTX4
  DR5｜どの種類の bead にも閉じる形があり、 席が閉じられない bead を作らず、 席の作業の単位 (契約) の片付けに user の手を要らない (自律)。 足すものを最小にし、 memo を契約へ書き直す今の昇格を壊さない (C17.2) CTX1・CTX3・CTX5
  DR6｜台帳には task と裁定だけを置き、 作業の記録を memo に積まない (C15) CTX2・CTX5
decision: |
  選んだ案と、 それが支える要件です。 開いた memo は 4 つの局面のどれかにいて、 優先の順は宣言した順だけで決まります。 昇格は 2 つの形で、 全部を上げた memo の契約が行の番号と一致して全部着地で閉じ、 子の問いが開いておらず、 審査役の判定が始末の無いまま残っていないときだけ器が閉じます。 bead を閉じる理由は、 契約・台帳の問い・memo・epic・decision の型のどれにも決まった形があり、 形の外は門が止め、 崩れは misfit で数えます。
  採用 — OPT1
  開いた memo SHALL 閉じた 4 つの局面の 1 つにいる: memo-promoting (discovered-from で辿れる開いた契約が在るか、 下の自動の close の条件を満たして close を待つ)・memo-asking (子の開いた台帳の問いが在る)・memo-actionable (処置の待ち: 引き金が満ちて keep の記帳が無い・処置の無い昇格か close の審査の判定が在る・昇格の行を持ち辿れる開いた契約が無く自動の close の条件を満たさない〔0 本を含む〕)・memo-waiting (読める引き金が在り満ちない・keep の判定と、 満ちた引き金に keep の記帳が付いた memo もここ)。 判定 SHALL 局面の出力 (FR1090) の 1 関数が行い、 優先 SHALL 列挙の宣言順だけから取り (C2)、 読める引き金の行を持たず memo-promoting にも memo-asking にも当たらない memo (memo-actionable より先に判じる) と、 どれにも当たらない memo SHALL misfit と理由の語で出す。 昇格 SHALL 2 形とする: (i) memo の bead に設計 pointer を書いて契約にする、 (ii) memo を残して契約を分け、 notes に昇格の行 (「昇格: 全部 <契約 id の列>」か「昇格: 一部 <契約 id の列>」・全部の行は分けた契約の全部を並べる・複数在れば最後の行で判じる) を足し、 分けた契約から discovered-from を張る。 引き金の判定と審査 SHALL 昇格の行が全部の memo だけを外す。 land の終端が契約を close した周と dispatch の周 SHALL、 自動の close の条件 (最後の昇格の行が全部で、 その行の契約 id の列と辿れる契約の列が一致して 1 本以上在り、 その全部が着地の形で閉じ、 子の開いた台帳の問いと処置の無い昇格か close の審査の判定を持たない) を満たす memo を「昇格済み <契約 id の列>」で close し (FR1093・FR1050)、 満たさない memo は閉じず、 台帳を読めない周は次の契機の周に判じ直す。 通知と台帳の lint SHALL memo-actionable を局面の出力の結果で数える (FR1087・FR1051・FR1094)。 bead の close_reason SHALL 種類ごとの閉じた形の和に限る: 契約は「landed <着地 commit id> …」「重複 <bead id>」「後継 <bead id>」「取り下げ <理由>」、 台帳の問いと decision の型の bead は「裁定 <裁定 id>」、 memo は「昇格済み <契約 id の列>」「まとめた <memo id>」「見送り <裁定 id>」、 epic は「完了」と「取り下げ <理由>」 (頭は 9 形)。 形の無い bead SHALL 形を直してから閉じる。 起票の門 SHALL 席の道具の呼び出しの close のうち理由が和の外のもの (理由の無い close を含む) と着地の形のもの (land の終端だけが書く) を、 台帳を読まずに字面で断る (FR1081 (d))。 局面の出力 SHALL 次の閉じを misfit で数える: 種類と形の食い違い、 裁定 id か bead id が解けない閉じ (裁定 id は FR1083 の解け方、 問いは自分の裁定の行と裁定 event で解く)、 見送りの裁定 id が memo の子の台帳の問いの裁定でない閉じ、 まとめ先が開いた memo でない「まとめた」、 閉じた時点の台帳で FR1093 の close の条件 (処置の無い判定の条件を除く) を満たさないか、 理由の契約 id の列が最後の昇格の行の列と違う昇格済みの閉じ。 閉じの misfit SHALL 切り替えの線 (FR1090) より後の閉じだけに掛け、 開いた memo の misfit は線に依らない。 rules 行 memo.notes_max_bytes を越えた notes を持つ open な memo SHALL 台帳の lint (FR1051) が名指す。 処置 SHALL 4 種のまま (close は上の memo の 3 形)。 器 SHALL NOT 審査の判定で memo を閉じない。 昇格の行と close_reason の頭の字面 SHALL 跨版の面とし、 正本は本 ADR とする。
  （平易）開いた memo は、 宣言した順の 4 つの局面のどれか 1 つにいます。 昇格の途中 (memo から辿れる契約が開いているか、 器が閉じる条件を満たして閉じるのを待つ)・問いの返事待ち (子の台帳の問いが開いている)・処置の待ち (引き金が満ちて「残す」の記帳が無い、 審査役の「上げる」か「閉じる」の判定に始末が無い、 昇格の行を持ち辿れる契約に開いたものが無いのに器が閉じる条件を満たさない〔辿れる契約が 0 本も〕)・引き金待ち (読める引き金が在って満ちない。 審査役の「残す」の判定の memo と、 満ちた引き金に「残す」の記帳を付けた memo もここ) です。 判定は器の 1 つの関数が決めます。 読める引き金が 1 つも無く昇格の途中でも問いの返事待ちでもない memo は、 処置の待ちより先に misfit と判じ、 どれにも当たらない memo と共に理由の語を添えて出します。 昇格は 2 つの形です。 memo をそのまま契約に書き直す形 (今のまま) と、 memo を残して契約を分け、 notes に「昇格: 全部 <契約の番号の列>」か「昇格: 一部 <契約の番号の列>」を書き (「全部」の行は分けた契約を全部並べる。 複数あれば最後の行で判じる)、 分けた契約から memo へ辺を張る形です。 全部の行を持つ memo は引き金の判定と審査から外れ、 一部の memo は外れません。 器は、 land の終端 (取り込みの最後の手順) が契約を閉じたときと便を起こす仕組みの回に、 閉じる条件 (最後の昇格の行が「全部」で、 行に書いた契約の番号と memo から辿れる契約が一致して 1 本以上在り、 その全部が着地で閉じ、 子の台帳の問いが開いておらず、 審査役の「上げる」か「閉じる」の判定が始末の無いまま残っていない) を満たす memo を「昇格済み <契約の番号の列>」で閉じます。 満たさない memo (行の番号と辺が食い違う memo も) は閉じず、 台帳を読めない回は閉じずに次の回に判じ直します。 land の終端が台帳へ書くのは便を閉じる書き込みとこの閉じだけで、 台帳の問いに裁定の行を書いて閉じるのは、 裁定を結ぶ器の口と、 裁定面 (user が裁定を書く画面) の答えの口です。 bead を閉じる理由は種類ごとに決まった形に限ります。 契約は着地の形・「重複 <bead の番号>」・「後継 <bead の番号>」・「取り下げ <理由>」、 台帳の問いと decision の型の bead は「裁定 <裁定の番号>」、 memo は「昇格済み」「まとめた <memo の番号>」「見送り <裁定の番号>」、 epic は「完了」と「取り下げ <理由>」の、 合わせて 9 つの頭です。 形の崩れた bead は形を直してから閉じます。 席が自分の道具で撃つ閉じる書き込みのうち、 理由が決まった形の外のもの (理由の無いものも) と、 着地の形の理由 (これは land の終端だけが書く) は、 門が台帳を読まずに字だけで止めます。 種類と形の食い違い、 解けない裁定の番号 (問いの閉じならその問いの裁定の行にも記録にも無い番号)、 見送りの裁定が memo の子の問いの裁定でない閉じ、 まとめ先が開いた memo でない「まとめた」の閉じ、 解けない bead の番号 (昇格済み・まとめた・重複・後継)、 閉じた時点の台帳で、 器が閉じる条件 (上) から判定の始末の条件を除いたものを満たさないか、 理由に書いた契約の番号の列が最後の昇格の行の列と違う「昇格済み」の閉じ (最後の行が「一部」・行の番号と辿れる契約が揃わない・閉じた時点で着地していない契約を含む・子の問いが開いている) は、 局面の出力が misfit で数えます。 閉じの misfit は、 この版の器が最初に局面の出力を全部書き直した時点 (切り替えの線) より後の閉じだけに掛け、 それより前の閉じた記録は数えません (線が絞るのは閉じと着地の commit から来る misfit だけです)。 開いた memo の misfit は線に依りません。 処置の待ちの memo の数は、 便を起こす仕組みの通知と台帳の点検が、 局面の出力と同じ判定の結果で数えます。 memo の notes が上限の大きさ (規則の行・値は user の裁定の番号付き) を越えたら、 台帳の点検が名指します。 処置は 4 種のまま、 memo の閉じる理由を上の 3 つの形にし、 器は審査役の判定では memo を閉じません。 昇格の行と閉じる理由の頭の字は、 版を跨いで守る約束で、 字の正本はこの記録です (要件の文書は形の名だけを持ちます)。
  （理由）今の閉じる条件は、 memo から辿れる契約が全部閉じたかだけを見るので、 1 つの memo から一部だけを契約にした形と全部を上げた形を区別できず、 契約が着地したのか取りやめになったのかも見ません。 区別の材料を memo 自身の notes の 1 行 (全部か一部) と、 契約を閉じた理由の字 (着地の形か) に置けば、 器は計算だけで閉じてよい memo を決められます (「全部」の 1 行が正しいかは計算の外です)。 これは ADR-1085 が退けた「審査役の判定で閉じる」形と違い、 land の終端 (取り込みの最後の手順) の閉じと同じく計算で決まる閉じです。 閉じる理由の字を種類ごとの決まった形にしたのは、 台帳の実測で閉じた理由の頭が 100 通りを越え、 閉じた memo が上がったのか落とされたのかを機械が読めなかったからです。 memo の見送りに user の裁定の番号を求めるのは、 要望を落とすかは user の判断で、 席の判断で memo を閉じる形は取りこぼしを席が作れる形だからで、 user も見送りに裁定を要る推奨を採りました。 見送りの裁定をその memo の子の問いの裁定に限るのは、 どの memo を落とす裁定かを台帳の親子の線で確かめられるようにするためです。 契約の重複・後継・取り下げに裁定を求めないのは、 契約は席の作業の単位で、 片付けのたびに user の手を求めると自律を損ない、 要望を落とさない保証は、 着地の外で閉じた契約を辿る memo が処置の待ちに残る memo の側でほぼ持てるからです (その場で昇格した契約の取り下げは除きます)。 どの種類にも形を用意したのは、 形の無い種類の bead を席が閉じられなくなるのを防ぐためです。 門の閉じる判定を字だけに留めたのは、 門は道具 1 回ごとに 2 秒の予算で走り、 台帳を読むと負荷の間に予算を越えて正しい書き込みを止める実例 (門が親の付け先を確かめる読み) があるからです。 門で止められない崩れ (種類との食い違い・解けない番号・閉じた時点で条件を満たさないか番号の列が違う「昇格済み」) は、 同じ束で決める局面の出力が misfit として数えて見せます (その場で昇格した契約を取り下げる閉じ〔辿る memo が残らない〕、 候補が本当に移ったかを見ない「まとめた」、 候補を全部覆うかを見ない「全部」か「一部」かの宣言〔席が「全部」と書けば残りの候補ごと閉じる〕などは、 数えの外に残ります)。 開いた memo の局面を 1 つの関数と宣言した順で決めるのは、 選び分けを 1 関数と宣言順に閉じる憲法 C2 に従うためです。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1091（claim）: FR1091 (memo の局面と処置・常時) の決定の側。 開いた memo の 4 つの局面と宣言順 (自動の close の条件を満たして close を待つ memo は memo-promoting・昇格の行を持ち開いた契約が無く条件を満たさない memo は 0 本も memo-actionable・満ちた引き金に keep の記帳が付いた memo は memo-waiting)・読める引き金の行を持たず memo-promoting にも memo-asking にも当たらない memo (memo-actionable より先に判じる) と当たらない memo の misfit、 昇格の 2 形 (昇格の行の全部と一部・全部の行は分けた契約の全部・複数在れば最後の行で判じる)、 種類ごとの close の理由の和 (頭は 9 つ・種類との組は 10 形) と、 その字面の正本を本 ADR に置くこと (SRS の FR1091・FR1050・FR1082 は形の名だけを持つ)、 和の外と land の終端の外の着地の形の断りを FR1081 (d) の門に渡すこと、 食い違い・解けない id・memo の子の問いの裁定でない見送り・まとめ先が開いた memo でない「まとめた」・閉じた時点の台帳で FR1093 の close の条件 (処置の無い判定の条件を除く) を満たさないか、 理由の契約 id の列が最後の昇格の行の列と違う昇格済みを数える misfit を決める。 閉じた時点で判じるので、 契約が開いたまま昇格済みで閉じた memo は、 後でその契約が着地しても misfit のまま残る。 処置の無い判定の条件については、 FR1087 の処置は close を含み、 席の昇格済みの閉じがそれ自体で判定への処置になるので、 この条件は閉じた時点で必ず満ちる (本 ADR の読み)。 したがって器が閉じない処置の無い判定を持つ memo も、 席は昇格済みで閉じられる。 AC1061 の 4 局面・重なりの優先・自動の close の前の memo-promoting・misfit・最後の昇格の行・その場の昇格・文法の各形の通過と断り・閉じの misfit 8 つ・線に依らない misfit・notes の上限はこの決定を測る。 AC1061 の文法の各形の K は種類との組で数え、 台帳の問いと decision の型を分けて 11 (契約 4・台帳の問い 1・decision の型 1・memo 3・epic 2) とする。
  FR1093（claim）: FR1093 (memo の自動の close) の決定の側。 land の終端 (FR1050) が契約を close した周と dispatch の周が、 close の条件 (最後の昇格の行が全部で、 その行の契約 id の列と discovered-from で辿れる契約の列が一致して 1 本以上在り、 その全部が着地の形で閉じ、 子の開いた台帳の問いと処置の無い昇格か close の審査の判定を持たない) を満たす memo を昇格済みの形「昇格済み <契約 id の列>」で close し、 満たさない memo (一部の memo・着地の形の外の閉じを含む memo・判定を持つ memo・列の食い違う memo・辿れる契約が 0 本の memo・子の開いた問いを持つ memo) は閉じず、 その局面は FR1091 で決まる。 台帳を読めない周は閉じずに次の契機の周に判じ直す。 計算で決まる close で、 審査の判定では閉じない (ADR-1085)。 AC1061 の自動の close (列の一致)・読めない周・閉じない 5 つはこの決定を測る。
  FR1050（claim）: FR1050 (land の終端) は close の理由を着地の形 (着地 commit id を持つ) と形の名だけで持ち、 その字面「landed <着地 commit id> …」の正本は本 ADR で、 契約の閉じの形の 1 つ目である。 land の終端が台帳へ書くのは便の close と memo の自動の close (FR1093) だけで、 どちらも close の 1 種である (AC1061 の書きの排他)。 裁定の行を書いて台帳の問いを裁定の形「裁定 <裁定 id>」で close するのは bind と裁定面の答えの口 (FR1082) で、 land の終端の書きではない。 器の台帳の書きはこの 2 つの close と裁定の行だけ (台帳 adapter)。
  FR1081（claim）: FR1081 (起票の門の 4 形) の (d) の決定の側。 門は席の道具の呼び出しの close の字面だけを読み、 理由が種類ごとの形の和の外なら理由の無い close も含めて、 また理由が着地の形なら (着地の形は land の終端だけが書く)、 台帳を読まずに断る。 種類の判定と id の解けは門の外 (局面の出力) に置く。
  FR1087（claim）: FR1087 (memo の引き金と審査) の処置の中身の根拠。 処置の 4 種の数は変えず、 昇格を 2 形に、 memo の close を 3 つの理由の形に限る。 判定の対象から外すのは昇格の行が全部の memo だけで (ADR-1085 の「discovered-from で辿れる契約を持つ memo」の除外を置き換える)、 一部の memo は判じ続ける。 通知が数えるのは処置の待ちの memo (memo-actionable・局面の出力と同じ判定の結果・FR1094) で、 keep の判定の memo と、 満ちた引き金に keep の記帳 (ADR-1085 の notes の [keep] の行) が付いた memo は処置の待ちに数えない。 数えるのは、 引き金の満ちた memo に限らず、 局面が memo-actionable の memo の全部 (処置の無い判定を持つ memo と、 昇格の行を持ち閉じ残った memo を含む) である。 知らせ直しは、 処置が付いただけでは止めず、 memo の局面が memo-actionable を出るまで周ごとに続ける (引き金を書き直してもまだ満ちる memo は知らせ続ける・ADR-1085 の「処置が付くまで」を置き換える・supersession の (h))。
  FR1051（claim）: FR1051 (台帳の lint) が処置の待ちの memo (memo-actionable) の本数と最古の年齢を数えることと、 notes の上限の根拠。 rules 行 memo.notes_max_bytes (値は user 裁定 id 付き・C5) を越えた notes を持つ open な memo を名指し、 作業の記録を memo に積んだ形を見せる (C15)。 台帳の現在の notes を要るので門では止めない。
  FR1090（implementation）: FR1090 (局面の出力) のうち memo の部品の実装側。 4 つの局面を 1 関数と列挙の宣言順で導き、 引き金の満ちは FR1087 と同じ判定で判じ、 misfit の理由の語に、 読める引き金の無い memo・閉じた理由の形と bead の種類の食い違い・解けない裁定 id と bead id・memo の子の問いの裁定でない見送り・まとめ先が開いた memo でない「まとめた」・閉じた時点の台帳で FR1093 の close の条件 (処置の無い判定の条件を除く) を満たさないか理由の契約 id の列が最後の昇格の行の列と違う昇格済みの閉じを持たせる。 切り替えの線 (この版の器がその state dir で最初に全部を書き直した時刻・FR1090) が絞るのは閉じと着地の commit に由来する misfit だけで、 本 ADR の閉じの misfit は線より後の閉じだけに掛け、 線の前の閉じた bead (2026-09-28 に 775 本) を数えない。 開いた memo の misfit (読める引き金の行が無いなど) は線に依らない。
  FR1083（rationale）: memo の見送りと decision の型の bead の閉じが引く裁定 id は、 FR1083 の解け方 (閉じた台帳の問いの notes の裁定の行の裁定 id の欄と一致する) で解けるかを判じる。 門は close の判定で台帳を読まないので、 解けない id は局面の出力が数える。
  FR1094（rationale）: FR1094 (局面の出力の読み手) は、 便の終端の周の通知と doctor の処置の待ちの memo の行が局面の出力と同じ判定の結果を使い、 自前の判定を持たないことを求める。 本 ADR は memo-actionable の判定を局面の出力の 1 関数に置き、 通知と台帳の lint はその結果を数えるだけにする。
  NFR1005（rationale）: 起票の門の hook は道具 1 回につき binary の呼び出しの予算と 2.0 秒の内側で重い I/O を持たないので、 close の書きの判定は字面に閉じ、 close の判定に台帳の読みを足さない。
