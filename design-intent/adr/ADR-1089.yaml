  - id: "OPT3"
    name: "memo を閉じず、 昇格しても開いたまま置く"
    text: |
      memo を閉じる条件を持たず、 昇格した memo も開いたまま置き、 一覧で昇格済みと見せる。 決め手は分析 (開いた memo の母集団が膨らみ、 処置の要る memo が埋もれる)。
      （平易）memo を閉じる条件を持たず、 契約へ上げた memo も開いたまま置き、 一覧で「上げ済み」と見せる案です。 残りの候補が閉じて落ちることが無く、 自動で閉じる仕組みも理由の決まりも要らず、 経緯が 1 つの bead に残る点で勝ります。 けれども、 開いた memo が上がり切った分で膨らみ、 始末の要る memo が埋もれます。 「開いている」が「まだ何かが要る」を意味しなくなり、 局面を 1 つ足すか、 読み手が自分で判じ直すことになります。 席の判断で閉じる形 (見送りなど) をどう扱うかも残ります。 だから退けました。
      利点: 残りの候補が閉じて落ちることが無い (DR3)
      利点: 器の自動の close も close の理由の文法も要らない
      利点: 経緯が 1 つの bead に開いたまま残る
      欠点: 開いた memo の母集団が上がり切った memo で膨らみ、 処置の要る memo が埋もれる (DR2)
      欠点: 「開いている」が「まだ何かが要る」を意味しなくなり、 局面が 1 つ増えるか、 読み手が自前で判じる (DR2)
      欠点: 席の判断で閉じる形 (見送りなど) を別に決める手は変わらず残る (DR1)
    verdict: rejected
    reason: "決め手は分析 (開いた memo の母集団が膨らみ、 処置の要る memo が埋もれる)。"
  - id: "OPT4"
    name: "memo の見送りを席の判断で書ける (close の理由の文法は持つが、 見送りに裁定を要らない)"
    text: |
      close の理由の文法は持つが、 memo の見送りを、 席が理由の字を添えて書ける。 決め手は分析 (要望の取りこぼしを席が作れる) と裁定 13:14Z (見送りは裁定を要る推奨を採った)。
      （平易）閉じる理由の決まった形は持つが、 memo の見送りを、 席が理由の字を添えて自分の判断で書ける案です。 席が要らないものをその場で閉じられ、 user に問う手間が増えず、 理由の字が残る点で勝ります。 けれども、 要望を落とすかを席が決めるので、 user の知らないうちに要望が消えます。 理由の字は自由なので、 見送りが妥当だったかを機械は確かめられず、 user が知るのは閉じた後で、 見送りの前には止められません。 user が打った字 (発話) が要望として残らないという入口の取りこぼしと同じ型を、 memo の出口に残します。 user も見送りに裁定を要る推奨を採ったので、 退けました。
      利点: 席が要らない memo をその場で閉じられ、 user に問う手番が増えない
      利点: 見送りの理由の字が残るので、 後から読み返せる
      利点: 台帳の問いを起こさずに閉じられ、 手順が短い
      欠点: 要望を落とすかを席が決め、 user の知らないうちに要望が消える (DR1)
      欠点: 理由の字は自由な字で、 見送りの妥当さを機械は確かめられず、 user が知るのは閉じた後で、 見送りの前には止められない (DR1)
      欠点: 発話が要望として残らないという入口の取りこぼしと同じ型を、 memo の出口に残す (DR1)
    verdict: rejected
    reason: "決め手は分析 (要望の取りこぼしを席が作れる) と裁定 13:14Z (見送りは裁定を要る推奨を採った)。"
  - id: "OPT5"
    name: "起票の門が台帳を読んで、 閉じる bead の種類と理由の形と id の解けを確かめる"
    text: |
      起票の門が close の書きのたびに台帳を読み、 名指した bead の種類に合う形か、 見送りの裁定 id が解けるか、 昇格済みの契約が全部着地したかを確かめて断る。 決め手は分析 (負荷の間は hook の予算を越え、 §12 の台帳の読みが timeout で正しい書きを断り続けた実例が在る)。
      （平易）台帳の書き込みの門が、 閉じる書き込みのたびに台帳を読み、 閉じる bead の種類に合う形か、 見送りの裁定の番号が本当に在るか、 上げた契約が全部着地したかを確かめて止める案です。 崩れた閉じを書く時点で止められ、 後から数える手が要らず、 正しい形を名指して断れる点で勝ります。 けれども、 閉じるたびに台帳を読むので、 負荷の間は道具を 1 回使うごとの門の時間の予算 (2 秒以内・重い読み書きを持たない) を越え、 正しい閉じる書き込みを止めます (門が親の付け先を確かめる読みで起きた実例があります)。 負荷の低いときも、 閉じるたびに 1 秒ほどの読みが足されます。 台帳を読む判定が親の付け先の判定の外へ広がり、 読めないときは止める向きを閉じる書き込みにも持ち込みます。 だから退けました。
      利点: 種類と形の食い違いと解けない id を編集の時点で止められる (C16)
      利点: 後から misfit で数える手が要らず、 崩れた閉じが台帳に入らない
      利点: 門の断りに正しい形を名指せる
      欠点: close の書きごとに台帳を読み、 負荷の間は hook の予算 (NFR1005 の 2.0 秒と重い I/O を持たない線) を越えて正しい close を断る (設計 ledger-form.md §12 の親の付け先の判定の実例・memo s2-07l.738.3・DR4)
      欠点: 低い負荷の周でも、 close ごとに 1 秒ほどの読みが足される (§12 の実測 0.83〜1.13 秒・DR4)
      欠点: 台帳を読む判定が §12 の親の付け先の判定の外へ広がり、 timeout の極性 (読めない周は断る) を close にも持ち込む (DR4・DR5)
    verdict: rejected
    reason: "決め手は分析 (負荷の間は hook の予算を越え、 §12 の台帳の読みが timeout で正しい書きを断り続けた実例が在る)。"
  - id: "OPT6"
    name: "契約の取り下げにも裁定 id を求める (契約の閉じの形を着地と「取り下げ <裁定 id>」の 2 つにする)"
    text: |
      着地しない契約の閉じは全部「取り下げ <裁定 id>」とし、 重複や後継の片付けにも user の裁定を求める。 決め手は orchestrator の決定と分析 (席の作業の単位の片付けに毎回 user の手が要り自律を損ない、 要望を落とさない保証は、 その場で昇格した契約の取り下げを除き memo の側で足りる)。
      （平易）着地しない契約の閉じを全部「取り下げ <裁定の番号>」にし、 重複や後継の片付けにも user の裁定を求める案です。 契約を着地させずに閉じる判断が全部 user の目を通り、 形が少なく、 要望と契約の出口に同じ線が引け、 選んだ案が数えの外に残す穴 (その場で昇格した契約の取り下げ) も塞げる点で勝ります。 けれども、 契約は席の作業の単位で、 重複して起こした契約や後継へ移した契約の片付けにも毎回 user の手が要り、 自律を損ないます。 要望を黙って落とさない保証は、 着地の外で閉じた契約を辿る memo が処置の待ちに残って始末を求められることで memo の側にほぼ在ります (その場で昇格した契約は辿る memo が無いので覆いません)。 裁定を待つ間は重複した契約が開いたまま残り、 便を起こす列から外す手を打たない限り、 同じ仕事の便が 2 本起きえます。 だから退けました。
      利点: 契約を着地させずに閉じる判断が全部 user の裁定に結び、 取り下げの妥当さを user が必ず見る (DR1)
      利点: 契約の閉じの形が 2 つで少なく、 id の解けを FR1083 の解け方 1 つで判じられる
      利点: 要望と契約の両方の出口に同じ線 (落とすのは裁定だけ) が引かれ、 説明が揃う
      利点: その場で昇格した (memo を書き直した) 契約の取り下げ (OPT1 が数えの外に残す穴・CSQ-N3) も裁定に結び、 辿る memo の無い契約でも要望が黙って落ちない (DR1)
      欠点: 重複して起こした契約や後継へ移した契約の片付けにも毎回 user の裁定が要り、 席の作業の単位の片付けで自律を損なう (DR5)
      欠点: 要望を落とさない保証は、 着地の外で閉じた契約を辿る memo が memo-actionable に残って処置を求められることで memo の側にほぼ在り、 契約の全部に重ねる要が薄い (ただし memo の側の保証はその場で昇格した契約を覆わない・CSQ-N3・DR1)
      欠点: 裁定を待つ間、 重複した契約が開いたまま起動の列に残り、 defer で列から外さない限り、 同じ仕事の便が 2 本起きうる (DR5)
    verdict: rejected
    reason: "決め手は orchestrator の決定と分析 (席の作業の単位の片付けに毎回 user の手が要り自律を損ない、 要望を落とさない保証は、 その場で昇格した契約の取り下げを除き memo の側で足りる)。"
basis: [FR1050, FR1051, FR1081, FR1082, FR1083, FR1087, FR1090, FR1091, FR1092, FR1093, FR1094, NFR1005, AC1057, AC1061, ADR-1045, ADR-1051, ADR-1053, ADR-1056, ADR-1083, ADR-1085, ADR-1087, ADR-1088]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「席」は器が立てる対話の AI の session、 「台帳」は仕事と裁定を記録する beads、 「memo」は契約にする前の覚え書きの bead、 「契約」は 1 本ずつ作って取り込む仕事の約束です。 これまで memo を契約へ上げる形は「memo をそのまま契約に書き直す」1 つしか決まっておらず、 1 つの memo から契約を幾つかに分けたときに memo をいつ閉じるかの印がありませんでした。 決まっていた閉じる条件は「memo から辿れる契約が全部閉じたら閉じる」で、 候補の一部だけを契約にした memo も残りの候補ごと閉じ、 契約が着地せずに閉じても memo が閉じます。 閉じた理由の字も自由なので、 席が要望を黙って閉じても機械は見分けられません。 本 ADR は、 開いた memo の居場所を宣言した順の 4 つの局面 (昇格の途中・問いの返事待ち・処置の待ち・引き金待ち) に決め、 どこにも当たらない memo を misfit (形の崩れ) として見せます。 昇格は、 memo を契約に書き直す形と、 memo を残して契約を分け、 memo の notes に「昇格: 全部」か「昇格: 一部」と契約の番号を書く形の 2 つにします。 最後の昇格の行が「全部」で、 書いた契約の番号と memo から辿れる契約が一致し、 その全部が着地で閉じ、 子の問いが開いておらず、 審査役の判定が始末の無いまま残っていない memo だけを器が「昇格済み」で閉じます。 bead を閉じる理由は種類ごとに決まった形 (頭は 9 つ) に限り、 memo の閉じ方のうち見送りだけは、 その memo の子の問いへの user の裁定の番号を要ります (契約の重複・後継・取り下げは席が片付けます)。 形の外の理由で閉じる書き込みは台帳の書き込みの門が台帳を読まずに止め、 種類との食い違いや解けない番号は後から misfit として数えます (要件 FR1091 と FR1093 を中心に FR1050・FR1081・FR1087・FR1051・FR1090、 根拠に FR1083・FR1094・NFR1005)。
approval:
  who: 持ち主
  date: 2026-09-28
  ruling: "s2-07l.739（器の台帳の id・器の記録の承認の欄が名指す・取り込みの裁定 t3-hub.74.60.1:20261004T0113Z-1）"
  verbatim: "器の台帳 s2-07l.739 の notes に在る（この file に写さない）"
  surface: R-8
consequences:
  - "この判断で良くなること 4 つと、 代わりに引き受けること 8 つです。 良くなるのは、 閉じ方が機械で読めて要望を落とす出口が user の裁定に結ぶこと、 「一部」と書いた memo が残りごと閉じないこと、 開いた memo と閉じ方の崩れが misfit に出ること (数えの外の穴を除く)、 門が閉じる判定で台帳を読まず今の昇格も壊さないことです。 引き受けるのは、 席の書く行が増えること、 門で止まらず後から数えるものが残り、 器の便の外で着地した契約は着地の形を持てないこと、 契約の取り下げの妥当さを機械が確かめず、 その場で昇格した契約の取り下げは数えの外に残り、 「まとめた」の候補が本当に移ったかも、 「全部」か「一部」かの宣言が候補を全部覆うかも確かめないこと、 今ある memo の移し替えが要ること、 版を跨ぐ約束が増えること、 器が memo を閉じる契機が 2 つになり、 notes の上限の値と memo の見送りを user に問う手番が要ること、 取り下げで閉じた契約の行を見せる局面を後で足す要があること、 別の project の台帳へ引き継いだ memo を閉じる専用の形が無いことです。"
  - "良い結果: 閉じた bead の理由から閉じ方が機械で読め、 要望を落とす出口 (memo の見送り) は user の裁定 id に結び、 着地の外で閉じた契約を辿る memo は memo-actionable に残るので、 席が要望を黙って落とす形が門と misfit の 2 か所で数えて見える (その場で昇格した契約の取り下げ・「まとめた」の移しの妥当さ・「全部」か「一部」かの宣言と書き直す昇格が候補の全部を覆うかを除く・CSQ-N3)。 契約の重複・後継・取り下げは席がその場で片付けられる"
  - "良い結果: 昇格の行に「一部」と書いた memo は残りの候補ごと閉じず、 全部の昇格が全部着地した memo は、 子の開いた問いと処置の無い判定を持たなければ器が閉じるので、 開いた memo が上がり切った分で膨らまない"
  - "良い結果: 開いた memo は 4 つの局面か misfit のどちらかに必ず出て、 閉じ方の崩れも misfit に出る。 どの種類の bead にも閉じる形があり、 形が無いために閉じられない bead が無い"
  - "良い結果: 起票の門は close の判定で台帳を読まず (NFR1005)、 land の終端が台帳へ書くのは便の close と memo の自動の close だけ (FR1050) で、 bind と裁定面の答えの口の書き (FR1082) は変えない。 memo を契約へ書き直す昇格は今の 3 書きのまま通る"
  - "代償: 分ける昇格では席が昇格の行と discovered-from の 2 つを書き、 一部の memo は分けた契約が全部閉じた後も、 処置 (追加の昇格・まとめた・見送り) を付けるまで memo-actionable に残る"
  - "代償: 門は字面しか見ないので、 種類と形の食い違い・解けない id・閉じた時点で条件を満たさないか列の違う昇格済み・notes の大きさは編集の時点で止まらず、 局面の出力と台帳の lint が後から数える (C16 の編集の時点の止めは和の形と席の着地の形まで)。 閉じの misfit は切り替えの線より後の閉じだけで、 線の前の閉じた bead は数えない。 昇格済みの閉じの misfit は閉じた時点の状態で判じるので、 局面の出力は close の時刻と閉じた後の notes の書き足しを区別して読む要がある (読みの形は ADR-1088 の設計 doc)。 席は着地の形で閉じられないので、 器の便の外で着地した契約の閉じは着地の形を持たない。 epic の「完了」が開いた子を残すかは機械が確かめず (開いた子は自分の局面に残る)、 閉じ時は設計 ledger-form.md §10 の数え (子が全部 closed の open な epic) が名指す"
  - "代償: 契約と epic の取り下げは理由の字だけで閉じられ、 取り下げの妥当さを機械は確かめない。 要望の側の保証は辿る memo の memo-actionable が持ち、 memo に結ばれない契約の取り下げは、 行の着地との突き合わせ (CSQ-N7 の後続) でしか見えない。 その場で昇格した (memo を書き直した) 契約の取り下げは辿る memo が残らないので、 数えの外に残る穴である。 「まとめた」は、 候補が本当にまとめ先の memo へ移ったかを機械が確かめない (misfit が見るのはまとめ先が開いた memo かだけ)。 「全部」か「一部」かの宣言と、 memo を契約へ書き直す昇格 ((i) の形) が候補の全部を覆うかも機械は確かめない (memo の候補の節は自由な文)。 席が「全部」と書けば器は残りの候補ごと memo を閉じ、 書き直しでは残りの候補が契約の着地と共に消える。 機械の確かめ (候補に閉じた id を持たせるか、 審査の lens に「全部」の行と候補の節を突き合わせさせる) は設計 doc に委ねる。 形の無い bead (4 象限の違反) は閉じる前に形を直す手が要る"
  - "代償: 既存の open な memo 23 本と、 memo でない bead から辿れる 10 本の memo は、 昇格の行・辺・読める引き金を足すまで memo-actionable か misfit に出る。 着地の形の字を持たない既存の閉じた契約は、 辿る memo の側で着地の外の閉じとして数える。 開いた memo の misfit (読める引き金の行が無いなど) は切り替えの線に依らず、 線は閉じと着地の commit に由来する misfit にだけ掛かる (FR1090)"
  - "代償: 跨版の面が増える (昇格の行の字面・close_reason の頭の 9 形・rules 行 memo.notes_max_bytes・misfit の理由の語)。 字面の正本は本 ADR で、 設計 ledger-form.md の改稿と消費側の読み手が写す要がある"
  - "代償: 器が memo を閉じる契機が、 land の終端が契約を close した周と dispatch の周の 2 つになる (どちらも close の 1 種)。 notes の上限の値は user の裁定を要り (C5)、 設計 doc の推奨の値を台帳の問いで聞く手番が要る。 memo の見送りは memo の子の台帳の問いで裁定を取る手番を要り、 それ以外の裁定 id (別の問いの裁定や、 消費側の台帳が書く batch か policy で始まる形) の見送りは misfit に出る"
  - "代償: 取り下げで閉じた契約の bead は設計 pointer を持ったまま台帳に残るので、 その契約表の行は「行に bead が無い」形にならず misfit に出ない。 行の bead が全部着地の形の外で閉じた行を、 局面の出力の局面の一覧 (ADR-1088 の設計 doc) に持たせる後続が要る"
  - "代償: memo の中身を別の project の台帳へ引き継いだ memo を閉じる専用の形が無い。 「まとめた」の先は同じ台帳の開いた memo に限るので、 今は見送り (memo の子の台帳の問いへの user の裁定) か、 memo の側の台帳の契約への昇格でしか閉じられない (消費側の project に答える中で見つけた残る穴)"
