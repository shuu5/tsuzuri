# 判断の記録 ADR-16 — 台帳の bead の種類と pipeline の板の見せ方（発効 2026-09-28・持ち主の裁定 t3-hub.60:20260928T0904Z-1 と t3-hub.52.71:20260928T0904Z-1〔束 batch:20260928T0904Z-1〕・記帳先 = tsuzuri の台帳の各問いの notes）
# 判断の記録 ADR-7 の決定 (4)（全体への指示は方針の欄で受ける）は効いたままで、この記録は方針の記帳先（要件 FR8）と、bead の種類と、pipeline の板の列の外の出し方（要件 FR10）を決める。器（scribe2）の答えは台帳 t3-hub.1 の notes と計画 surface-plan の 6 節。
id: ADR-16
title: 台帳の bead の種類を器と同じ 2 つの印で決めて「作業」と常設の控えを置かず、方針は 1 つごとに閉じた問いとして記帳し、pipeline の板は控えの列と 4 列と要修正の行で見せる
status: accepted
date: 2026-09-28
context: |
  持ち主は 2026-09-28 に、project board の pipeline の板の Queued と Blocked に同じものがずっと置いてあり、memo も置いてあるのではと指摘した。調べると、板は走行を持たない open の task を全部 Queued か Blocked に出し、設計の参照（acceptance の design = contracts/<名>.toml#<行>）を見ていなかった。長く居座ったのは設計の参照も控えの印も無い bead（席が「作業」と呼んでいた、計画の予定の行を台帳に先に作ったもの）だった。持ち主はその 8 分後に、「作業」は昇格前の控えとも常設の控えとも違うのか、全部の bead の運用の整合を器（scribe2）の席と相談して整理し、場合によっては 4 列の下に横長の行で出すべきかを、器と持ち主とよく相談したいと指示した。
  器の席の答え（2026-09-28）。器は bead の種類を 2 つの印だけで決める。控えの印（label intake:memo）だけなら控え、設計の参照だけなら契約、両方か両方無しなら形の崩れ（器の ledger/form.rs・epic と bd の種類 decision は区分の外）。器は常設の控えを置かない（器の側の持ち主の裁定・器の憲法 C15 = 台帳は仕事と裁定だけを持つ）。チャットの指示の逐語は、器の束 A（持ち主の発言を hook が全部 event に残し、席が後から問いの bead を立てて seat ruling bind で結ぶと、器が裁定 id を出し逐語を写し問いを閉じる）で問いの bead に移す。束 A の着地までは今の t3-hub.1 の逐語をそのまま置く。器には板が無く、見せ方は tsuzuri が決めてよく、器の頼みは形の崩れた bead を直しの要るものとして見せることだけ。
  tsuzuri の今。開いた bead は 11 本（契約 2・控え 4 のうち常設 2〔裁定の控え t3-hub.1・方針 t3-hub.29〕・まとめ 5・印なし 0）。方針の欄（要件 FR8）は根の直下の控え「方針」（t3-hub.29）の notes に方針の行を足していた。tsuzuri の憲法の条 P-1 は、台帳をタスクと裁定の記帳先とし、規則を置かないとする。
  席はこの整理を 2 つの問い（t3-hub.60 = 種類と方針の記帳先・t3-hub.52.71 = 板の見せ方・3 案を並べた見本の画面つき）で持ち主に出し、持ち主は同じ日に両方とも推奨の案 A を選んだ。
decision: |
  (1) bead の種類は器と同じ 2 つの印で決める。控えの印だけなら控え（memo）、設計の参照だけなら契約、両方か両方無しなら形の崩れ（要修正）。まとめ（epic）・問い（intake:question）・裁定（bd の種類 decision）は区分の外に置く。「作業」という種類は置かない。
  (2) 計画の予定の行は bead を先に作らず、計画（surface-plan）の計画だけの行に置き、設計ノートに契約の行を置いた時に契約の bead を作る。まだ設計していない事柄は、昇格の条件を書いた控えにする。
  (3) 常設の控えは置かない。裁定の控え（t3-hub.1）は、器の束 A の着地の後に、版管理に載る file が裁定 id で引いているチャットの指示だけを閉じた問いの bead へ移し、ほかは記録として残して閉じる。束 A の着地までは今の逐語をそのまま置く。
  (4) 方針の欄（要件 FR8）の記帳先を、方針 1 つにつき根の直下の閉じた問いの bead 1 本に替える。方針の id は問いの裁定 id と同じ形にし、範囲（この論点か全体）の札を持つ。書いても開いている問いを閉じず、承認として数えない。席が次の問いを置く前に範囲内の方針を読み、問いの premises に方針の id を持たなければ server が断る決まりは変えない。今までの控え「方針」（t3-hub.29）の方針の行は消さずに読み続け、新しい記帳先の行が着地した後に t3-hub.29 を閉じる。
  (5) pipeline の板は、左端に控えの列（起票からの時間と昇格の条件・2026-09-28 の持ち主の指示）を置き、4 列（Queued / Blocked・Running / Gated・Questioned / Failed / Stopped・Landed）の下に横長の「要修正」の行を 1 本置く。要修正の行は形の崩れた open の bead を出し、0 本のときは出さない。Queued / Blocked の札は設計の参照を持つ契約の bead だけにする。まとめ（epic）は板に出さず、地図と台帳の頁に出す。常設の行は置かない。
  (6) 形の判じ方は器の決まり（2 つの印）と同じ式にする。器が判定を機械が読める形で出すなら、tsuzuri はそれを写して自分で判じない（二つ目の読み手を作らない）。
options:
  - id: a
    name: 器に揃え、方針は閉じた問いに記帳し、板は控えの列と 4 列と要修正の行
    text: 決定 (1) から (6)。
    verdict: adopted
    reason: 持ち主が 2 つの問いとも推奨の案 A を選んだ（t3-hub.60・t3-hub.52.71）。種類が 2 つの印だけで閉じ、板のどこに何が出るかが印で決まり、器の点検とも数が合う。裁定と方針が問いの 1 種類に集まり、文書が引く裁定 id を器が確かめられる。
  - id: b
    name: 方針だけ常設の控えに残す
    text: 決定 (1)〜(3)・(5)・(6) は同じで、方針（t3-hub.29）は要件 FR8 のとおり常設の控えとして残す。
    verdict: rejected
    reason: 昇格の条件が満ちない控えが控えの列に居続け、控えの列の起票からの時間と昇格の条件が意味を持たなくなる。持ち主は案 A を選んだ（t3-hub.60）。
  - id: c
    name: 「作業」と常設を tsuzuri だけの種類として残す
    text: 印の無い bead を「作業」、閉じない控えを「常設」として tsuzuri の種類に足し、板に行を足す。
    verdict: rejected
    reason: 器からは形の崩れに見え、器の拾い方と点検と数が食い違い続ける。持ち主は案 A を選んだ（t3-hub.60）。
  - id: d
    name: 板の 4 列の下に要修正の行と常設の行の 2 行
    text: 決定 (5) に加えて、裁定の控えと方針を常設の行に出し、控えの列から外す。
    verdict: rejected
    reason: 常設の控えを置かないので要らない。持ち主は案 A を選んだ（t3-hub.52.71）。
  - id: e
    name: 下の行を置かず、要修正は板の見出しの数の印
    text: 板は控えの列と 4 列だけにし、要修正は見出しの数の印で出して押すと一覧を開く。
    verdict: rejected
    reason: 崩れた bead が目に入りにくく、2026-09-28 のように何時間も気付かれないおそれがある。持ち主は案 A を選んだ（t3-hub.52.71）。
basis: [P-1, P-2, ADR-7]
retreat:
  kind: measure
  condition: 要修正の行に出た bead が 7 日で 3 本を越えるか、器の束 A の形が決定 (3) と (4) の前提（発言の event と seat ruling bind）から変わったら、起票の作法と方針の記帳先を持ち主に問い直す。数えるのは tsuzuri の設計の席。
plain: |
  台帳の項目（bead）の種類を、器と同じ 2 つの印で決めます。控えの印だけなら控え、設計の参照だけなら契約で、どちらも無いか両方あるものは「要修正」です。まとめ（epic）と質問と裁定はこの区分の外です。「作業」という種類は無くします。
  計画の予定は台帳に先に作らず、設計ができた時に契約として作ります。まだ設計していないことは、昇格の条件を書いた控えにします。
  閉じない控えは置きません。チャットでいただいた指示の控えは、器の新しい仕組み（発言の記録を後から質問に結ぶ）ができたら、文書が引いている分を質問の記録へ移して閉じます。方針の欄に書いた方針は、1 つごとに閉じた質問として残すように替えます。今までの方針は消さずに読み続けます。
  pipeline の板は、左端に控えの列、真ん中に今の 4 列、その下に「要修正」の横長の行を置きます。要修正の行は 0 本なら出しません。まとめ（epic）は板に出さず、地図と台帳の頁に出します。
  この記録はあなたの承認で発効しています。承認の記帳先は tsuzuri の台帳です。
