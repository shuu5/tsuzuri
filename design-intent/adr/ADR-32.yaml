# 判断の記録 ADR-32 — 歯の置き方を段の束ねにする（着地した歯は crate ごとの群・上限 1 万行・新しい行の歯は 1 本の file・溜まったら畳みの行）
# 起草は係 w87a と w89a（2026-10-03）。群の大きさは持ち主の裁定（t3-hub.77.7:20261003T0330Z-1・案 B の 1 万行）。承認の欄は席が埋める（下書きは欄を置かない）。
# 測りの全部は起草の notes（drafts/w87a/w/notes.md・drafts/w86a/w/q2/notes.md と summary.md・drafts/w89a/w/notes.md）。
id: ADR-32
title: 歯（テスト）の置き方を段の束ねにする — 着地した歯は crate ごとの群（上限 1 万行）へまとめ、新しい行の歯は今までどおり 1 本の file で足し、溜まったら畳みの行が群へ移す
status: accepted
date: 2026-10-03
context: |
  系の記憶の装置（SSD）の書き込みは 1 日 約 4.8 テラ（TB）で、tsuzuri の便の組みがそのうち 1 日 2〜3.5 テラを占める（器の席の監査・memo t3-hub.77）。最大の項は歯の実行 file で、1 回の組みで 395〜422 本・18.8〜19.3 ギガ（GB）になる。cargo は歯の置き場（tests/）の 1 file を 1 つの crate として組み、部品（lib）を 1 行替えるとそれに依る歯の実行 file を全部 link し直す（core だけで 1 回 2,098 メガ（MB）・係 w87a の測り）。判断の記録 ADR-31 の決定 (1)（デバッグの情報を行の表だけ）は 1 本ごとの大きさを下げたが、本数は替えない。
  歯の file は 384 本（歯の印の付いた関数 2,778・155,400 行）。「1 行に新しい歯の file を 1 本」は規則の行と判断の記録に無く、起草の守りと器の受付の門が守らせている。器は nextest の行を crate と範囲（旗なし・部品だけ・名指した 1 本）で読み、名指した 1 本は置き場の直下の同じ名の file と同じ名の dir の下を読み、歯を関数の名（fn の名）だけで照らす。器の書く範囲（write-set）の重なりは file ごとに見る。規則の行 R-4 と判断の記録 ADR-25 は歯の置き場を数えない。
  束ねの試作（係 w87a）で、crate ごとに歯をまとめると 0 からの組みの歯の実行 file が 約 395 本 19 ギガから 18 本 1.17 ギガに減り、歯の数と中身は替わらなかった。ただし行ごとに束の入口の file（main.rs）へ module の行を足す形は、器が書く範囲の重なりで便を直列に流す（同じノートの行の対の重なりが 715 から 1,350 へ）。
  群の大きさの測り（係 w86a・境界の crate の 91 本・42,537 行・行の表だけのデバッグの情報）で、着地した歯の file を 1 本直した後の組みの壁の秒の中央は、今の形（1 file 1 本）0.32 秒・上限 5 千行 0.49 秒・1 万行 0.67 秒（5 巡りの全部で今の形より遅い・差は +0.17・+0.35 秒）、2 万行 1.05 秒・1 束 1.25 秒。core の部品 1 行の後の組みは 1.6〜2.1 秒で形の差が小さい。冷えた組みは 5 千行 3.70 秒・1 万行 4.16 秒・2 万行 6.00 秒・1 束 11.46 秒（1 束は演算の並びが 1.5 に落ち、host の混みで 2 倍に延びる）。1 回の流れ（冷えた組み・部品 1 行の後・歯の file 1 本の後・clippy・歯の実行）の書きの中央は 5 千行 1.66 ギガ・1 万行 1.27 ギガ・2 万行 1.08 ギガ・1 束 0.93 ギガ。今の形の同じ流れは測りの上限（15 ギガ）に収まらないので撃っていない（部品 1 行の後の書きだけで境界の crate 4.12 ギガ・束ねると 0.87 ギガ）。
decision: |
  (1) 着地した歯は crate ごとの群に置く。群は歯の置き場の下の dir（名と番・例 teeth1）で、入口の file（main.rs）は頭の注の 2 行の直後に歯だけで組む印（cfg の属性）を置き、あとは module の行だけを名の順に持つ。歯の file は群の dir に元の名のまま置き、中身は移した file を名指す path の字の書き換えのほか替えない。境界の crate が組む folio の歯の群は folio の置き場の下の群（tz1〜tz5）を、境界の部品の表（manifest）の歯の項で名指す。
  (2) 群の大きさの上限は 1 万行（10,000 行・持ち主の裁定（t3-hub.77.7:20261003T0330Z-1））。最初の移しは歯の file を名の順に、最後の群へ上限まで詰め、越えれば次の群を開く。
  (3) 新しい行の歯は今までどおり歯の置き場の直下の 1 本の file（段）で足す。受付・確かめの行（verify）・書く範囲の決まりは替えない。群の入口の file と module の file を書くのは畳みの行だけ。
  (4) 段の file が 12 本に達するごとに、席が畳みの行を 1 行置く。畳みは、まだ着地していない行の書く範囲と verify の行が名指さない段の file を、最後の群へ（上限を越えれば次の群へ）移す。手は席の道具（fold2.py と seq.sh）で、移し・入口の file・path の字の書き換え・歯の表の書き直しを機械で行う。
  (5) 歯の関数の名は crate の dir の中（歯の置き場と本体の置き場（src）の歯の区間）で一意にする。今の重なり（契約の crate の 3 つの名・16 か所）は畳みの行（t-fold-contract）で群の字を挟んだ名へ替える。これは「移した歯の名を 1 字も替えない」の唯一の例外。
  (6) xtask の歯（接頭辞 kfold_）が、群の入口の file が群の dir の module を 1 度ずつだけ名指すこと（名指さない file は組まれず歯が黙って消える）・群と module の数が歯の表のとおりであること・(5) の一意を見る。
  (7) 新しい歯の接頭辞は、契約表の verify の絞りの語と、群の module の名（元の file の名と区切りの 2 つのコロン）のどれとも部分の字で重ならない。
  (8) 最初の移しは 6 行（xtask・契約・core・境界・面・folio の順・ノート surface-wave27a）で、1 本ずつ流す。
  (9) 着地した行の verify の字（名指した 1 本の旧い名）と差の file は歴史として残し、書き換えない。
  (10) 規則の行 R-4 の範囲（判断の記録 ADR-25）は替えない。群の上限は規則の行にせず、席の道具の頭の定数が持つ。nextest の設定は判断の記録 ADR-31 の行（r-nextest-timeout）が持つ。
options:
  - id: a
    name: 段の束ね・群の上限 1 万行
    text: 決定 (1) から (10)。着地した歯は crate ごとの 1 万行までの群、新しい行の歯は段の 1 本、12 本ごとに畳む。
    verdict: adopted
    reason: 持ち主が 1 万行を選んだ（裁定（t3-hub.77.7:20261003T0330Z-1））。着地した歯を直した後の組みは 0.67 秒で今の形より 0.35 秒遅いが、1 回の流れの書きは 1.27 ギガ（GB）で 5 千行より約 2 割少なく、冷えた組みは 4.16 秒で並びを保つ。新しい行は段の 1 本で足すので、便の並び（書く範囲の重なり）を削らない。
  - id: b
    name: 段の束ね・群の上限 5 千行
    text: 案 a と同じ形で、群の上限を 5 千行にする。
    verdict: rejected
    reason: 持ち主が 1 万行を選んだ。着地した歯を直した後の遅れは今の形から +0.17 秒（0.49 秒）と最も小さいが、1 回の流れの書きが 1.66 ギガ（GB）で 1 万行（1.27 ギガ）より約 3 割多い。
  - id: c
    name: 段の束ね・群の上限 2 万行
    text: 案 a と同じ形で、群の上限を 2 万行にする。
    verdict: rejected
    reason: 1 回の流れの書きは 1.08 ギガ（GB）と少ないが、着地した歯を直した後の組みが 1.05 秒（今の形の 3 倍）、冷えた組みが 6.00 秒に延び、演算の並びが 3.2 に落ちる。
  - id: d
    name: crate ごとに 1 束
    text: 着地した歯を crate ごとに 1 つの群にまとめる（群の上限を置かない）。
    verdict: rejected
    reason: 書きは 0.93 ギガ（GB）と最も少ないが、組みが compiler の 1 本のほぼ直列になり（演算の並び 1.5）、冷えた組みが 11.46 秒・直した後の組みが 1.25 秒で、host の混みで 2 倍に延びる。
  - id: e
    name: 束ねない
    text: 今のまま、歯の置き場の 1 file を 1 本の実行 file に組む。
    verdict: rejected
    reason: 着地した歯を直した後の組みは 0.32 秒と最も速いが、部品 1 行の後の書き（境界の crate だけで 4.12 ギガ（GB）・束ねると 0.87 ギガ）と 0 からの組みの歯の実行 file（約 395 本）が減らない。
  - id: f
    name: 段を置かず、新しい行が束の入口の file に module の行を足す
    text: 歯を crate ごとの束にまとめ、新しい行の歯は束の dir に置いて入口の file（main.rs）に module の行を足す。
    verdict: rejected
    reason: 新しい歯を足す行（全行 363 のうち 300）が入口の file で重なり、器が便を直列に流す（同じノートの行の対の重なり 715 から 1,350 へ）。開発の速さを削る。
  - id: g
    name: 本体の置き場（src）の中の単体の歯
    text: 歯を本体の file の歯の区間へ移し、部品の 1 つの実行 file に組む。
    verdict: rejected
    reason: 歯 15.5 万行 ÷ 本体 5.0 万行で規則の行 R-4 の比 1.0 を越え、tz の実行 file を撃つ歯 90 本を置けない。
basis: [P-25, P-26, R-4, ADR-25, ADR-31, NFR3]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo t3-hub.77 に 1 件ごとに記帳する。
    (1) 器が module の行だけの書く範囲の項を重なりと見ない仕組みを持ったら、段と畳みの決まり（決定 (3)(4)）を見直す。
    (2) 畳みの行が 2 本続けて、差の当て直しのほかの理由で落ちたら、席の道具の手と決定 (4) を見直す。
plain: |
  歯（テスト）の file を 1 本ずつ別の実行 file に組むのをやめ、着地した歯は crate ごとに 1 万行までの群にまとめて組みます。群の大きさはあなたの答えで決めました。
  新しい歯は今までどおり 1 本で書き、12 本たまったら機械でまとめます。1 回の組みの歯の実行 file は約 19 ギガ（GB）から大きく減り、歯の数と中身は替わりません。
  着地した歯を直した時の組みは 1 回 約 0.35 秒遅くなりますが、部品を直した時と 0 からの組みの書き込みが大きく減ります。
  この記録はあなたの承認で発効しています。承認の記帳先は tsuzuri の台帳の問いです。
note: 起草 w87a（道具と 6 行の字）と w89a（今の main での切り直しと確かめ）。測りは w87a と w86a。同じ commit で、ノート surface-wave27a に段の束ねの 6 行（t-fold-xtask〜t-fold-folio）を足す。器への任意の頼み（module の行だけの項を重なりと見ない仕組み）は、器の席が器の決定はしご（要るか）で今は足さないと決めた（畳みの行の費用が実測で重くなったら上げ直す）。
