# 判断の記録 ADR-1005 — 器 scribe2 の判断の記録 ADR-0005 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1005
title: "憲法改訂 = A3 の承認経路を C7 の対話面へ揃える"
status: accepted
date: 2026-09-09
context: |
  承認を受け取る窓口を「ちょうど 1 つ」と決め直したとき、 その決定を A1 (消す / 出す / 使う) には反映しましたが、 A3 (依存 OSS の追加・削除) には反映し忘れていました。 A3 の条文には、 もう存在しない席の名前 —「planner を通った印」— が残ったままです。 本 ADR は、 その取りこぼしを直す記録です。
  ADR-1003 §2.1 は、 承認の受理面はちょうど 1 つであるという不変量だけを条文に残し、 その面の identity は条文でなく rules 行 R-C7-1 が持つ、 と決めた。 この決定は C7 と A1 に反映され、 A4.2 の受理面の語もこれに合わせた。 しかし ADR-1003 の射程は C7 / A1・C8 / A4・N4 に限られており、 A3 は射程に入っていなかった。 その結果、 A3 の規範文には改訂前の機構「as a relay stamp through the planner」が残った。 これは vocabulary が「歴史的な語」と定めた relay 印と、 唯一の対話面ではなくなった planner 席を、 現行条文が名指したまま参照し続ける状態である。 A3 は依存 OSS の追加・削除という C13 の手続きの入口であり、 承認の受理面が機械的に定まらないと Ask-first が成立しない。 憲法条文の改訂は A2 の user 裁定事項であり、 2026-09-09 に user は A3 を A1 と同形へ書き換える裁定を出した。 N4.2 が憲法改訂に新しい ADRを要求するため、 land 済みの ADR-1003 を書き換えるのではなく本 ADR を新設して記録面とする。
decision: |
  決めたことは 1 つです。 A3 で user の承認を取る経路を、 A1 と同じ「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」に揃えます。 依存を足すときの手続き (予算の範囲に収める・compile 時間の実測差を記す) は 1 mm も変えません。
  下の EARS block は決定時点の条文案であり、 施行された条文の正本は ../spec/constitution.html の #a3 である。 齟齬時は憲法を正とする (本 ADR は WHY を持ち、 条文の WHAT は憲法が持つ)。
  §2.1 A3 = 承認は C7 の対話面を通す・C13 の手続きは据置
  A3 の「user に確認し」を「C7 の対話面を通して user の承認を取り」に改めます。 これは A1 に入れたのと同じ文で、 新しい決まりを足すものではありません。 対話面が誰かは条文でなく差し替えできる行 (R-C7-1) が持ち、 今の値は「user 直」です。
  A3 の条文を次に置き換える (MUST)。 射程は承認の受理面だけである: C13 の手続き (許可リスト + 予算・compile 時間の実測差) と R-C13-1 の値は据置く。
  A3: WHEN an OSS dependency is to be added or removed, scribe2 SHALL obtain the user's approval through the dialogue surface designated by R-C7-1 (C7) first, and SHALL follow the C13 procedure (C13, R-C13-1).
  機構 (型 / lint / CI)
  承認の受理面は C7 の対話面 (rules 行 R-C7-1・初期値 = user 直) のみで、 受理した承認は approval event に逐語付きで記帳する (C7.2)。 改訂前の「planner 発行の relay 印」は廃止 (席の名を条文に焼いた形だったため・ADR-1003 §2.1 と同じ理由)。 C13 の許可リスト + 予算 (R-C13-1) と cargo deny は無改変。
  出所
  user 裁定 2026-09-09 (A3 の承認経路・ADR-1003 とは別の裁定)・本 ADR §1
  本改訂は ADR-1003 §2.1 の決定を A3 へ適用したものであり、 新しい決定ではない。 A1 と A3 で承認経路の語が食い違わないようにすることが目的で、 A1 の EARS の該当句と逐語で同形にする。
  §2.2 憲法 file への反映のしかた
  憲法の file は作り直さず、 同じ file の中で書き換えます。 消した文は消し線、 足した文は下線の印を付けて本文に残すので、 何がどう変わったかが後から読めます。
  design-intent/spec/constitution.html を同一 file の中で改訂する (MUST)。
  ・(a) #a3 の card の要旨・規範文・出所を §2.1 の文へ置き換え、 旧文は folio の delta marker (del.delta / ins.delta・data-delta-id = 差分の印 2026-09-09-011) で本文に残す。 機構 dd は C13 の記述のみで改訂前の席の名を含まないため触らない。
  ・(b) §2 の一覧表の A3 行の「機構の要点」と「出所」を新文に合わせる (ins.delta のみ。 旧文「C13 の手続き」は据置ゆえ del にしない)。
  ・(c) 前書きの machine-readable dl の source と §5 Trace に、 本 ADR による A3 の改訂を項として足す。 ADR-1003 の項 (5 条・差分の印 2026-09-09-001〜005・009〜010) は変えない。
  ・(d) 条数は変えない (Always 16 / Ask-first 4 / Never 4)。 folio-version と JSON-LD の folio:version は 0.4.6 のまま (本改訂は SPEC の版を動かさない)。
  ・(e) JSON-LD への dc:isReferencedBy の追加と各 page の chrome は folio の生成物であり、 手編集しない。
  §2.3 本 ADR の射程外
  この ADR は A3 の承認の窓口だけを直します。 依存を足すときの予算や手続き、 ADR-1003 が決めたことそのものには手を触れません。
  次は本 ADR の決定ではない (MUST NOT be read as such): C13 の手続きと R-C13-1 の値 (無改変)、 ADR-1003 の本文 (frozen・本 ADR は supersede しない)、 R-C7-1 の値 (対話面が誰かの判断は rules 行の変更で行う・C5)、 A1 / A2 / A4 / N4 の条文。 本 ADR が変えるのは constitution の #a3 と、 それに伴う §2 一覧表の 1 行・前書きの source・§5 Trace だけである。
