  部分 supersede で、 置き換えるのは 1 つ — ADR-1045 §2 (3) の「runner SHALL … PreToolUse の write-set guard と command guard だけを受ける」の「だけ」を、 選択式の問いの deny (FR1086) を 1 枚足した列に改める。 runner に憲法の散文を注入しないことと、 ADR-1045 のほかの全部は保つ。 ほかの ADR は置き換えず、 足すだけの追補である。 ADR-1022 の PreToolUse の matcher の文 (Edit 系に Bash を足す) と「発話は監視しない」は変えず、 対象の後ろに AskUserQuestion を 1 つ足す (止めるのは道具の呼び出しで、 問いの字は読まない)。 ADR-1022 がその根拠とした「機械に見えるのは編集と実行だけ」の前提は、 AskUserQuestion の呼び出しの分だけ広がる (字は読まない)。 ADR-1054 の宣言 file の任意 key の集合に floor-check と question-route を足す (schema は上げない)。 ADR-1034 の閉じた型の待ち理由に floor を 1 値足し、 介入 first の印は列の順を動かす意味のまま、 床の検査の待ちを外す鍵にも使う。 ADR-1056 の host-guard の配線 (対象と timeout) は変えない。
