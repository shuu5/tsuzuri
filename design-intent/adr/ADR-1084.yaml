  器の承認の欄: 裁定 (user)・user・裁定 id user 2026-09-28T00:05Z (文書運用の強制を案 A で進める・床の検査の門はその段 3)・2026-09-28T00:49Z (選択式の問いの道具は例外なく使わない・skill の文が求めても)・2026-09-28T00:54Z (決めてほしいことは推奨で進める、 の常設の指示・床の検査の不合格の間に介入 first の印を持つ契約のほかを待たせる形と止める範囲はこの指示の下の推奨)。 時間の上限の rules 行の名 floor.timeout_s は orchestrator がこの指示の下で決めた。 行の値は裁定されておらず、 行を置くときに user 裁定 id を付ける (本 ADR は推奨だけを書く)。 逐語は台帳にだけ在る・裁定済
  器の承認の欄: 設計 (orchestrator)・orchestrator・2026-09-28 草稿 v4 (SRS 版 0.28 の round 3 の文の FR1085・FR1086・FR1068・FR1027 と AC1055・AC1056 を受け、 起動の列の待ち理由の型・宣言 file の key の集合・CI の 1 行の撃ち方・hook の入口の門の順と仕える条件・承認の問いの一律 deny を現物で読み、 床の検査の撃ち方と止める範囲を決めた。 拘束する constitution の版 0.5.0)・作成
  器の案の章の要約: 候補を 9 つ並べます。 main の commit ごとに床の検査を撃ち落ちている間は first の印の無い契約を待たせ、 選択式の問いは器を名乗る repo で例外なく止める案 (選んだ案)、 床の検査の不合格で関わる便だけを待たせる案、 床の検査を便ごとの検査に入れる案、 持ち主が起こした grill の skill の間だけ通す案、 登録された席だけに掛ける案、 器の repo だけで宣言の key で選ぶ案、 repo の設定 file の拒否の欄に置く案、 口座の設定から呼ばれる見張りに足す案、 散文と記憶に書くだけの案です。
  器の専門語の説明: 本文に出てくる専門語 11 個を、 やさしい言葉で説明します。
  ・床の検査（floor check）: vessel 宣言の任意 key floor-check が名乗る 1 行の command を、 dispatch の周 (FR1068 の契機の周) に main の先端の木で撃つ検査 (SRS FR1085)。 rc で終わった結果は sha ごとに 1 回で、 撃てない周と時間切れの周は次の周に撃ち直す。 行は撃つ前に形・禁じる語列・shell の記号の検査に掛け、 当たる行はその周を撃てない周にする。 rc 0 だけが合格で、 不合格の間は介入 first の印を持つ契約のほかは起動の列の契約が待つ。 便ごとの gate とは別。
  ・vessel 宣言（vessel declaration）: repo が器に自分を名乗る設定 file で、 repo の root に marker の隣に置く追跡された .vessel.toml (ADR-1010)。 本 ADR で任意 key の floor-check と question-route を持てるようになる。 未知の key は読みの誤りとして断られる。
  ・介入（orchestrator intervention）: orchestrator が起動の列に付ける typed な印で (user の直命の対として記録される)、 first (最優先へ)・hold (止める)・release (戻す) の 3 つ (ADR-1034・SRS FR1068)。 本 ADR で、 first の印を持つ契約は床の検査の不合格の間も floor では待たない (器は印を持つ契約が直す便かを判じない)。
  ・起動の列（dispatch queue）: dispatcher が台帳から導く、 起動を待つ契約の並び (SRS FR1068)。 起こせない契約は閉じた型の待ち理由を持って列に留まる。 本 ADR で理由に floor が加わる。
  ・dispatcher（dispatcher）: 台帳から起動の列を導き、 条件を満たす便を、 便の終端・手動の 1 周・介入の印の直後などの契機 (FR1068) に起こす器の口 (ADR-1034・ADR-1045)。 周期の timer を持たない。
  ・封じ込め（confinement）: 器が起こす子 process を memory の上限付きの箱の中で走らせること (SRS NFR1006)。 上限を越えて止められるのは箱の中だけ。
  ・AskUserQuestion（AskUserQuestion）: Claude Code の道具の 1 つで、 選択肢を並べた窓を開き、 user が選ぶまで session を待たせる。 選んだ答えは user が打った字として残らない。
  ・問いの経路（question route）: 選択式の問いを止めた周に器が告げる道 (SRS FR1086)。 平文の返答で問うことと、 user の裁定が要る問いを台帳の問い (FR1081) として立てることの 2 つに、 repo の宣言の question-route の 1 行が加わる。
  ・matcher（hook matcher）: hooks.json の hook の行が、 どの道具の呼び出しで撃たれるかを名で並べた欄。 器の plugin の PreToolUse の行は Bash と Edit 系を合わせた 5 つで、 本 ADR で AskUserQuestion が加わる。
  ・marker（marker）: repo root に置く .vessel。 中身が器の NAME を言う repo だけで器の hook の入口が仕え、 他の repo では黙る (SRS FR1019・FR1024)。
  ・跨版の面（cross-version surface）: 器の版が上がっても外から読まれる形を変えない約束。 変えるときは新しい ADR を要し、 歯が pin する。 本 ADR では宣言の 2 key・待ちの理由の 3 形・matcher の AskUserQuestion。
