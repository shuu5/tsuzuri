    name: "main の commit ごとに床の検査を撃ち不合格なら first の印の無い契約を待たせ、 選択式の問いは marker が器を名乗る repo で例外なく止める"
    text: |
      vessel 宣言の任意 key floor-check の 1 行を、 dispatch の周 (FR1068 の契機の周) に main の先端の sha の rc の結果が無いときだけ、 行に固有の検査 3 つ (1 行の形・FR1056 の禁じる語列・shell の記号) に掛け、 通った行をその sha の木で ci-cmd と同じ撃ち方 (argv・PATH・allowlist の外) で封じ込めの箱の中で 1 回撃つ。 検査に当たる行は撃たずにその周を撃てない周と読む (fail-closed)。 rc の結果は sha ごとに残し、 撃てない周と時間切れの周は sha の結果として残さず (周の判定は別の周の記録に残す) 次の周に撃ち直す。 不合格の間は、 介入 first の印を持つ契約を floor では待たせず (main を直す便の経路・器は直す便かを判じない)、 それ以外の起動の列の契約を待ち理由 floor で待たせる (HostBusy と同じ型)。 tick の alarm で起きた席は直す契約を起票して first の印を付け、 便の外で main が直ったときは手動の 1 周を撃つ。 あわせて plugin の hook の既存の行の対象に AskUserQuestion を足し、 pane・登録 row・役割を解く前の 1 関数で、 通す値を持たずに deny し、 問いの経路と宣言の question-route の 1 行を告げる。 止める範囲は marker が器の NAME を言う repo。 決め手は裁定 (00:49Z の例外なし・00:54Z の推奨) と分析 (直す経路を閉じずに first の印の無い便の赤の上の積み上げを止め、 抜け道を持たない)。
      （平易）main の commit ごとに床の検査を撃ち、 選択式の問いを例外なく止める案です。 repo が宣言 file に床の検査の 1 行 (floor-check) を書くと、 器は便を起こす周に、 main の今の commit の結果がまだ無いときだけ、 その行を形・禁じた command の並び・shell の記号の 3 つで検査し、 通った行をその commit の木で 1 回撃ちます。 検査に当たる行は撃たず、 その周を撃てなかった周として扱います。 撃ち方は ci-cmd と同じく shell を通さず、 実装役に許した command の一覧に縛られず、 さらに memory の上限付きの箱の中で撃ちます。 終了コードで終わった結果は commit ごとに残し、 撃てなかった周と時間切れの周は残さず次の周に撃ち直します。 落ちている間は、 介入の印 first を持つ契約 (main を直す便に付ける印) だけを起こし、 ほかの契約を理由 floor で待たせます (待ちの理由の型は、 器の健康の遮断器が「待つ」を返した周と同じです)。 tick の知らせで起きた席は、 直す契約を起票して first の印を付けます。 選択式の問いの道具は、 器の plugin の hook の既存の行の対象に足し、 席の登録や役割を調べる前に止め、 通す値も切る行も持たず、 問いの経路と repo の宣言の 1 行を告げます。 first の印の無い便は壊れた main に積まれず、 直す道は閉じず、 撃つ費用が縛られ、 設定の上での抜け道が無く、 既存の口を使う点で勝ります。 代わりに、 床の検査が落ちている間は first の印の無い便は関わらなくても待ち、 直す便には印を付ける手番が要り、 印を付けた契約は直す便でなくても起きること、 終了コードで落ちた結果は main が進むまで残り、 時間切れが続くと周ごとに上限まで周が止まること、 床の検査の行を 1 つの command にまとめる必要があり、 行が検査に当たるか host の側で撃てない (頭の語が PATH に無い・箱を作れない・時間の上限の行が無い) と、 直すまで first の印の無い契約が全部待つこと、 古い器が新しい key を断ること、 立っている session は立て直すまで止まらないこと、 器を名乗らない repo や器の plugin を積まない session では止まらず、 器の binary が無い周は通すことを引き受けます。
      利点: main が床の検査に落ちている間は first の印の無い便は起きず、 その便は赤の上に積まれない (first の印を持つ便は直す便でなくても起きる)。 直す便は first の印で起こせるので、 直す経路は閉じない。 待ち理由・doctor・tick の alarm に見える (DR1)
      利点: rc で終わった床の検査は main の木ごとに 1 回だけ撃ち、 時間の上限と封じ込めの箱が縛る (DR2)
      利点: 撃つ前に行の形・禁じる語列・shell の記号を検査し、 当たる行は撃たずに撃てない周と読むので、 宣言の 1 行で器に禁じた command を撃たせられず、 撃たなかった行が合格に化けない (DR5)
      利点: 選択式の問いが skill の文や席の記憶に依らず止まり、 通す値も切る行も無いので、 設定の上での抜け道が無い (DR3)
      利点: 止めた周に問いの経路と repo の宣言の 1 行が model へ返り、 平文か台帳の問いで問い直せる (DR4)
      利点: 管轄の外の沈黙・host-guard の配線・hook の command 行・他の道具の判定を変えない (DR5)
      利点: CI の 1 行の撃ち方・HostBusy の型・既存の hook の行を使い、 新しい口は宣言の key 2 つと判定 1 つ (DR6)
      欠点: 床の検査の不合格の間は、 first の印の無い便は関わらない便も全部待つ。 直す便を起こすには席が直す契約を起票して first の印を付ける手番が要り、 器は印を持つ契約が直す便かを判じないので、 印を付けた契約は直す便でなくても赤の上で起きる。 列は周期の timer を持たないので、 便の外で main が直った後の周は alarm で起きた席の手動の 1 周 (か便の終端・介入の印) が要り、 合図を送らない周の席 (FR1078 で止めた席・梯子の列が尽きた席) には doctor の行だけが知らせる
      欠点: rc で落ちた結果は同じ sha の間残り、 直すには main を進める。 撃てない周と時間切れの周は sha の結果として残さないので、 時間を越え続ける床の検査は周ごとに撃ち直され、 周ごとに上限まで待つ
      欠点: 行は shell を通さないので、 複数の検査を並べたい repo は PATH に置いた 1 つの command にまとめる必要がある。 検査に当たる行を書いた repo や、 頭の語が PATH で解けない・箱を作れない・行 floor.timeout_s を読めない host では、 直すまで first の印の無い契約の全部が floor:unfireable で待つ
      欠点: 2 key を書いた宣言は、 key を知らない古い binary の受付が未知の key として断る
      欠点: hooks.json が変わるので導入先の digest が動き、 立っている session は立て直すまで止まらない
      欠点: marker が器を名乗らない repo の session と、 器の plugin を積まない session では選択式の問いは止まらない。 器の binary が無い周は hook が通す側に倒れる
    verdict: adopted
    reason: "決め手は裁定 (00:49Z の例外なし・00:54Z の推奨) と分析 (直す経路を閉じずに first の印の無い便の赤の上の積み上げを止め、 抜け道を持たない)。"
  - id: "OPT2"
    name: "床の検査の不合格では関わる便だけを待たせる"
    text: |
      床の検査の不合格を、 不合格の原因に触れる便 (write-set が赤の file に触れる便など) だけの待ちにし、 他の便は起こし続ける。 未反映の裁定の待ち (関わる便だけ) と同じ形。 決め手は分析 (関わりを判じる読み手が要り、 どの便も同じ赤の木の上に積まれる)。
      （平易）床の検査が落ちたとき、 原因に触れる便だけを待たせ、 他の便は起こし続ける案です。 床の検査と無関係な便が止まらず、 未反映の裁定の待ち (関わる便だけ) と同じ考え方で済む点で勝ります。 けれども、 どの file のせいかを検査の出力から判じる読み手が要り、 検査ごとに出力の形が違うので器は一般には読めません。 起こした便はどれも同じ赤の main の上に積まれます。 直す便は赤の file に触れるので関わる便として待ちうるうえ、 起こして先に来させるには採った案と同じく first の印が要り、 直す道では採った案に勝らないため退けました。
      利点: 床の検査と無関係な便が止まらず、 列の流れが保たれる
      利点: 未反映の裁定の待ちと同じ形で、 待ちの範囲の考え方が 1 つになる
      欠点: 床の検査の出力から「どの file のせいか」を判じる読み手が要り、 検査ごとに出力の形が違うので器が一般には読めない (DR6)
      欠点: 起こした便はどれも同じ赤の main の上に積まれ、 gate か着地の後の検査で落ちるか、 赤を前提にした変更を足す (DR1)
      欠点: 直す便は赤の file に触れるので関わる便として待ちうる。 起こして他の便より先に来させるには、 採った案と同じく first の印が要り (採った案も直す便を first の印で起こす)、 直す経路では採った案に勝らない (DR1)
    verdict: rejected
    reason: "決め手は分析 (関わりを判じる読み手が要り、 どの便も同じ赤の木の上に積まれる)。"
  - id: "OPT3"
    name: "床の検査を便ごとの gate の共通 verify に入れる (新しい key を足さない)"
    text: |
      床の検査の 1 行を vessel 宣言の共通 verify に足し、 便ごとの gate で撃つ。 宣言に新しい key を足さず、 既存の口だけで済ませる。 決め手は分析 (main そのものを測らず、 便の外の着地の後の赤を拾えない)。
      （平易）床の検査の 1 行を、 新しい key を足さずに、 便ごとの検査 (共通 verify) に入れる案です。 新しい key も待ちの理由も足さず、 便ごとに床の検査を通ることを確かめられる点で勝ります。 けれども、 共通 verify は実装役に許した command しか撃てず、 その一覧の外の検査の道具を床の検査に置けません。 便の外で main が赤になっても次の便を起こす前には測らず、 起こしてから落とすことになり、 床の検査を便の数だけ撃つので費用が便の数に比例するため退けました。
      利点: 新しい key も待ち理由も足さない
      利点: 便ごとに候補の木が床の検査を通ることを gate が確かめる
      欠点: 共通 verify は runner の allowlist の内側の command しか撃てず、 allowlist の外の検査の道具を床の検査に置けない (DR6)
      欠点: 便の外の着地 (docs の PR の直の merge など) で main が赤になっても、 次の便を起こす前には測らず、 便を起こしてから gate で落とす (DR1)
      欠点: 床の検査を便の数だけ撃ち、 費用が便の数に比例する (DR2)
    verdict: rejected
    reason: "決め手は分析 (main そのものを測らず、 便の外の着地の後の赤を拾えない)。"
  - id: "OPT4"
    name: "持ち主が起こした grill の skill の周だけ選択式の問いを通す (草稿 v1 の例外)"
    text: |
      rules 行 seat.owner_grill_skills に通す skill の名を並べ、 UserPromptExpansion で持ち主の skill の起動に印を書き、 同じ prompt_id の間だけ AskUserQuestion を通す。 skill の作法 (設計の grill の Phase C) をそのまま使える形。 決め手は裁定 (00:49Z が例外を落とした) と分析 (hook の入力に skill の中かを示す欄が無い)。
      （平易）持ち主が自分で起こした grill の skill の間だけ、 選択式の問いを通す案です (この ADR の最初の草稿の例外)。 規則の行に通す skill の名を並べ、 skill の起動に印を書き、 同じ入力の周 (prompt_id) の間だけ通します。 skill の作法を書き換えずに使え、 席が勝手に開く窓は止まる点で勝ります。 けれども、 hook の入力には skill の中の呼び出しかを示す欄が無く、 印と入力の周の寿命から推すしかないので、 推し方が外れると skill の外の呼び出しも通ります。 例外そのものが抜け道になり、 通した周の答えは持ち主が打った字でないので裁定に結べず、 規則の行・印の記録・hook の行も増えます。 持ち主も 2026-09-28T00:49Z に例外を持たないと裁定したので退けました。
      利点: skill の文が求める選択式の問いを、 持ち主が自分で起こした周だけ使え、 skill の作法を書き換えずに済む
      利点: 席が勝手に開く窓 (skill の外の呼び出し) は止まる
      欠点: hook の入力に「skill の中の呼び出しか」を示す欄が無く、 起動の印と prompt_id の寿命から推すしかない。 推し方が外れると skill の外の呼び出しも通る (DR3)
      欠点: 例外の印と通す skill の列が抜け道になり、 通した周の答えは持ち主が打った字でないので裁定に結べない (DR3)
      欠点: rules 行 1 本・印の記録・UserPromptExpansion の hook の行が増える (DR6)
      欠点: 裁定 00:49Z は例外を持たずに使わないと決めた
    verdict: rejected
    reason: "決め手は裁定 (00:49Z が例外を落とした) と分析 (hook の入力に skill の中かを示す欄が無い)。"
  - id: "OPT5"
    name: "登録 row を持つ席だけに掛ける"
    text: |
      役割の guard と同じく、 pane から登録 row を解けた席の session だけで AskUserQuestion を止め、 登録 row の無い session (持ち主が自分で開いた session など) は通す。 決め手は分析 (持ち主が開いた session が最も grill の skill を撃つ)。
      （平易）席として登録された session だけで止め、 登録の無い session (持ち主が自分で開いた session など) は通す案です。 席の権能の見張りと同じ解き方で、 席でない session の作業を変えない点で勝ります。 けれども、 設計の grill の skill を撃つのは主に持ち主が開いた session で、 止めたい周の多くが素通りします。 判定が席の登録の読み出しに依り、 読めない周の扱いも要ります。 持ち主の裁定は、 いかなる時も使わないとし、 登録の有無で分けていないので退けました。
      利点: 役割の guard と同じ解き方で、 席でない session の作業を変えない
      利点: 持ち主が自分で開いた session では選択式の問いを使い続けられる
      欠点: 持ち主が自分で開いた session は登録 row を持たず、 設計の grill の skill を撃つのは主にそこなので、 止めたい周の多くが素通りする (DR3)
      欠点: 判定が pane と event log の replay に依り、 解けない周の扱いが要る (DR5)
      欠点: 裁定 00:49Z はいかなる時も使わないとし、 登録の有無で分けていない
    verdict: rejected
    reason: "決め手は分析 (持ち主が開いた session が最も grill の skill を撃つ)。"
  - id: "OPT6"
    name: "器の repo だけに掛け、 vessel 宣言の key で opt-in する"
    text: |
      宣言に止める旨の key を持つ repo (まず器の repo) だけで AskUserQuestion を止め、 消費側の project は key を書くまで今のままにする。 決め手は分析 (切る値を持つことになり、 消費側の席の作法が割れる)。
      （平易）器の repo で先に試し、 他の project は宣言 file の key を書いたときだけ止める案です。 他の project の作業をその project が選ぶまで変えず、 器の repo で先に試せる点で勝ります。 けれども、 key が「止めない」を選べる値になり、 切る値を持たないとした裁定と逆になります。 同じ器の plugin を積む席でも repo ごとに作法が割れ、 規律が席の記憶と散文に戻るので退けました。
      利点: 消費側の project の作業を、 その project が選ぶまで変えない
      利点: 器の repo で先に試せる
      欠点: 宣言の key が「止めない」を選べる値になり、 切る値を持たないとした裁定と逆になる (DR3)
      欠点: 同じ器の plugin を積む席でも repo ごとに作法が割れ、 席の記憶と散文に規律が戻る (DR3)
    verdict: rejected
    reason: "決め手は分析 (切る値を持つことになり、 消費側の席の作法が割れる)。"
  - id: "OPT7"
    name: "anchor の設定 file (.claude/settings.local.json か追跡された settings.json) の permissions.deny に AskUserQuestion を置く"
    text: |
      器の hook でなく、 Claude Code の permission の deny の欄で道具そのものを使えなくする。 置き場は untracked な local の file か、 追跡された .claude/settings.json の 2 つの変種。 hook も binary も要らない形。 決め手は分析 (器の見張りがどちらの編集も止め、 local は消費側へ届かず、 追跡された file は repo ごとに行を消せば切れる)。
      （平易）器の hook でなく、 repo の中の設定 file の拒否の欄に道具の名を置く案です。 置き場は追跡されない local の file (.claude/settings.local.json) か、 追跡された .claude/settings.json の 2 通りです。 器の code を変えず、 Claude Code 自身が道具を拒み、 器の本体が無いときも効く点で勝ります。 けれども、 どちらの file の書き換えも器の見張りが止めます (席の権能の見張りと、 口座の設定から呼ばれる見張りの両方が守っています)。 置けるのは持ち主が手で置くときだけです。 local の file は他の project の席へ届かず、 版を跨いで保たれません。 追跡された file は届きますが、 repo ごとに行を置き、 消せば切れるので、 切る値を持たない門になりません。 断るときに問いの経路も告げられないので退けました。
      利点: 器の code を変えず、 Claude Code 自身が道具を拒む
      利点: binary が無い周も効く
      欠点: どちらの file の編集も器の見張りが止める (役割の guard は orchestrator の edit-code の外として断り、 host-guard の見張り自身の設定の編集の種類も同じ file を守る)。 置けるのは持ち主が手で置く周だけ (DR5)
      欠点: local の変種は untracked な host の file で、 消費側の project の席へ届かず、 版を跨いで保たれない。 追跡された settings.json の変種は消費側へ届くが、 repo ごとに行を置き、 消せば切れるので、 切る値を持たない門にならない (DR3)
      欠点: 断りの理由に問いの経路を載せられない (DR4)
    verdict: rejected
    reason: "決め手は分析 (器の見張りがどちらの編集も止め、 local は消費側へ届かず、 追跡された file は repo ごとに行を消せば切れる)。"
  - id: "OPT8"
    name: "host-guard の配線の対象に AskUserQuestion を足す (口座の設定を読む全 session)"
    text: |
      口座の設定から呼ばれる host-guard に 1 種類を足し、 marker に依らず、 器の plugin を積まない session も含めて止める。 裁定の「いかなる時も」を字のまま覆う形。 決め手は分析 (管轄の外の repo まで器が作法を強いる判断が要り、 配線の対象を固定した決定に触れる)。
      （平易）口座の設定から呼ばれる見張り (host-guard) に 1 種類を足し、 器の目印の有無に依らず、 器の plugin を積まない session も含めて止める案です。 持ち主の「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」を字のまま覆い、 器の hook の一覧を変えない点で勝ります。 けれども、 器に加わっていない repo の対話の作法まで器が決めることになり、 管轄の外でも判定する見張りの口の列 (FR1024 が並べる口) を広げる判断が要ります。 その見張りは壊す操作を止める口で、 対象と時間の上限は固定と決まっていて (ADR-1056)、 変えるには新しい決定が要り、 対話の作法と壊す操作の見張りが同じ口に混ざるので退けました。
      利点: marker の無い repo の session と、 器の plugin を積まない session でも止まる
      利点: 器の hook の一覧 (hooks.json) を変えず、 導入先の digest も動かない
      欠点: FR1024 が並べる host-guard の口に FR1086 を足し、 器に加わっていない repo の対話の作法まで器が決める判断が要る (DR5)
      欠点: host-guard は破壊を止める見張りで、 配線の対象と timeout は固定と決まっている (ADR-1056)。 変えるには新しい hook 行と新しい決定が要る (DR5)
      欠点: 口座の設定を読む全 session の毎回の問いに掛かり、 対話の作法と破壊の見張りが同じ口に混ざる (DR6)
    verdict: rejected
    reason: "決め手は分析 (管轄の外の repo まで器が作法を強いる判断が要り、 配線の対象を固定した決定に触れる)。"
  - id: "OPT9"
    name: "何も足さない — 散文と記憶で使わないと書く"
    text: |
      床の検査は席が手で確かめ、 選択式の問いは CLAUDE.md や席の記憶の行で使わないと書くだけにする。 器の変更は 0。 決め手は憲法 (N2 から散文だけの規則は規則でない) と分析。
      （平易）器には何も足さず、 床の検査は席が手で確かめ、 選択式の問いは CLAUDE.md や席の記憶に使わないと書くだけにする案です。 器の変更も版を跨ぐ約束も増えない点で勝ります。 けれども、 憲法 N2 は散文と記憶にだけ在る規則を規則と扱いません。 skill の文が求めると席はそちらに従いうるうえ、 main が床の検査に落ちても席が気づくまで便を積み続けるので退けました。
      利点: 器の変更も跨版の約束も増えない
      利点: skill の作法を変えずに済む
      欠点: 散文と記憶にだけ在る規則は規則でない (N2)。 skill の文が求めると席はそちらに従いうる (DR3)
      欠点: main が床の検査に落ちても席が気づくまで便を積み続ける (DR1)
    verdict: rejected
    reason: "決め手は憲法 (N2 から散文だけの規則は規則でない) と分析。"
