  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「便」は契約 1 本を実装して着地させる 1 往復、 「席」は器が立てる対話の AI の session です。 本 ADR は 2 つを決めます。 1 つ目は床の検査です。 repo が自分の宣言 file に最低限の検査の 1 行 (floor-check) を書くと、 器は便を起こす周に、 main の今の commit ごとに、 行の形・禁じた command の並び・shell の記号を検査してからその行を撃ちます (当たる行は撃たずに、 撃てなかった周として扱います)。 落ちている間は、 介入の印 first を付けた契約だけを起こし、 ほかの契約を待たせます (first は main を直す便に付ける印ですが、 器は直す便かを判じないので、 直す便でない契約に付けてもその契約は起きます)。 撃てなかった周と時間切れの周は次の周に撃ち直します。 知らせで起きた席は直す契約を起票して first の印を付け、 便の外で main が直ったときは 1 周を回します。 2 つ目は選択式の問いの遮断です。 器の plugin の hook が、 選択肢を出す問いの窓 (AskUserQuestion) を例外なく止め、 平文で問い、 持ち主の裁定が要る問いは台帳の問いとして立てるよう告げます。 止めるのは器の目印 (marker) が器を名乗る repo だけで、 器に加わっていない repo では今までどおり黙ります (要件 FR1085・FR1086 と、 FR1068 の待ちの理由・FR1027 の知らせの語を支えます)。
