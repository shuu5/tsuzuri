  本 ADR が関わる便だけの待ち・便ごとの gate への同居・持ち主の skill の例外・登録 row の席だけ・repo ごとの opt-in・設定 file の deny・host-guard への同居・散文だけを退け、 main の commit ごとの床の検査 (first の印を持つ便だけを通す・印は直す便に付けるが器は判じない) と例外の無い hook の門を採ったのはこの原則に行き着く (これ以上は遡らない照会終端)。 射程は器の管轄 (marker が器の NAME を言う repo) の中で、 管轄の外で黙る約束 (FR1024) はこの原則の外に置く。
