  verbatim: "tsuzuri の台帳 t3-hub.74.60.1 の notes に在る（この file に写さない・器の記録は器の台帳の裁定 id を名指さない）"
  surface: R-8
consequences:
  - "この判断で良くなること 4 つと、 代わりに引き受けること 8 つです。 良くなるのは、 first の印の無い便は赤の main の上に積まれず直す経路は閉じないこと、 床の検査を撃つ費用が縛られ宣言の 1 行も検査されること、 選択式の問いが skill の文や記憶に依らず止まること、 止めた所で問い直す道が返ることです。 引き受けるのは、 床の検査が落ちている間は first の印の無い便は関わらなくても待ち、 直す便に印を付ける手番が要り、 印を付けた契約は直す便でなくても起きること、 終了コードで落ちた結果は main が進むまで残り、 時間切れが続くと周ごとに上限まで周が止まること、 床の検査の行を 1 つの command にまとめる必要があること、 古い器が新しい key を断ること、 hook の一覧が変わり立っている session は立て直すまで止まらないこと、 器を名乗らない repo や器の plugin を積まない session では止まらず、 器の binary が無い周は通すこと、 skill の問いを平文で問い直す手番が増えること、 宣言の行が検査に当たるか host の側で撃てないと、 直すまで first の印の無い契約が全部待つことです。"
  - "良い結果: main が床の検査に落ちている間は first の印の無い便は起きず、 その便は赤の上に積まれない (first の印を持つ便は、 直す便でなくても赤の上で起きる)。 直す便は first の印で起きるので、 code が原因の赤も直す経路が閉じない。 理由は起動の列の待ち理由・doctor・tick の alarm に見える"
  - "良い結果: rc で終わった床の検査は main の木ごとに 1 回だけ撃たれ、 時間の上限と封じ込めの箱で縛られる。 宣言の 1 行は撃つ前に形・禁じる語列・shell の記号の検査を通り、 当たる行は撃たずに撃てない周と読む"
  - "良い結果: 選択式の問いは skill の文や席の記憶に依らず止まり、 席が窓で止まることも、 裁定に結べない答えが残ることも無くなる"
  - "良い結果: 止めた周に問いの経路と repo の宣言の 1 行が model に返り、 席は平文か台帳の問いで問い直せる"
  - "代償: 床の検査の不合格の間は、 first の印の無い便は関わらない便も全部待つ。 回復は、 管理 tick の alarm の floor で起きた席が直す契約を設計の文書の契約表の行から起こし (ADR-1023)、 first の印を付ける手番による。 器は印を持つ契約が直す便かを判じないので、 印を付けた契約は直す便でなくても赤の上で起きる。 列は周期の timer を持たないので、 便の外で main が直ったときは手動の 1 周 (か便の終端・介入の印) が要り、 合図を送らない周の席 (FR1078 で止めた席・梯子の列が尽きた席) には doctor の行だけが知らせる"
  - "代償: rc で落ちた結果は同じ sha の間は記録に残り、 同じ sha で撃ち直す口は無いので、 直すには main を進める。 撃てない周と時間切れの周は sha の結果として残さず周ごとに撃ち直すので、 時間を越え続ける床の検査は周ごとに上限 (floor.timeout_s) まで周を待たせる"
  - "代償: floor-check の行は shell を通さないので、 複数の検査を並べたい repo は PATH に置いた 1 つの command にまとめる。 器の repo の床の検査 (設計の文書の検査の 2 つ) も、 その道具を PATH に置いてから opt-in する"
  - "代償: 2 key を書いた宣言は、 key を知らない古い binary の受付が未知の key として断る。 key を書くのは、 器の版を上げ、 rules 行 floor.timeout_s が置かれた後である (行を読めない周は撃てない周になる)"
  - "代償: hooks.json が変わるので導入先の hook の一覧の digest が動き、 doctor の同期の行が plugin の食い違いを名指す。 立っている session は起動時の一覧で動き続け、 立て直すまで選択式の問いは止まらない"
  - "代償: marker が器を名乗らない repo の session と、 器の plugin を積まない session (lens・手で起こした plugin の無い session) では止まらない。 binary が無い周は hook が通す側に倒れる"
  - "代償: skill の文が選択式の問いを求める skill (設計の grill など) は、 席が平文で問い直す手番が 1 つ増える。 runner にも同じ deny が届くが、 断り文が告げる経路 (平文の返答・台帳の問い) は席のためのもので、 runner の問いは最終行の質問 record のまま (ADR-1016)"
  - "代償: 撃てない周は、 原因が宣言の floor-check の行 (形・禁じる語列・shell の記号の検査に当たる) でも host の側 (頭の語が PATH で解けない・箱を作れない・rules 行 floor.timeout_s を読めない) でも、 直すまで first の印の無い契約の全部が floor:unfireable で待つ。 host の側の原因は契約の便では直らず host の手が要る。 宣言の誤り 1 行や host の不備で列が止まる代償を、 撃たなかった行を合格に読み替えない (C10) ための fail-closed として引き受ける"
