# 判断の記録 ADR-1084 — 器 scribe2 の判断の記録 ADR-0084 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1084
title: "便は main が床の検査に落ちている間は介入 first の印を持つ便だけを起こし、 選択式の問いの道具は器の hook が例外なく止める — vessel 宣言に floor-check と question-route の 2 key を足し、 plugin の hook の対象に AskUserQuestion を足す (床の検査の不合格は first の印の無い契約を全部待たせ、 止める範囲は marker が器を名乗る repo・ADR-1045 の runner の guard の列を部分 supersede)"
status: accepted
date: 2026-09-28
context: |
  main が最低限の検査 (床の検査) に落ちたまま便を起こすと、 どの便も同じ赤の上に積まれる。 選択式の問いの窓は席を止め、 選んだ答えは持ち主が打った字として残らない。 本 ADR は、 repo が宣言した床の検査の 1 行を main の commit ごとに撃ち、 不合格の間は介入 first の印を持つ契約 (main を直す便に付ける印で、 器は直す便かを判じない) だけを起こしてほかを待たせる、 と決める。 あわせて、 器の plugin の hook が選択式の問いの道具を例外なく止め、 問いの経路を告げると決める。 止める範囲は marker が器を名乗る repo で、 管轄の外で黙る約束 (FR1024) は変えない。
  なぜこの判断が要るのかを、 経緯 (main そのものを最低限の検査に掛ける口も、 選択式の問いを止める門も器に無い)・事象 (選択式の問いの窓は席を止め、 選んだ答えは裁定に結べない)・機序 (hook の入力に skill の中の呼び出しかを示す欄は無く、 hook の一覧は session の起動時に読まれる)・憲法と既存の決定の向き・射程の 5 つで示します。
  CTX1 経緯 — main そのものを最低限の検査に掛ける口が器に無く、 選択式の問いを止める門も無い
  gate は便ごとの候補の木を検査し、 着地の直後の主実測も着地した木を測る。 けれども便の外の着地 (orchestrator の席が直に merge する docs の PR など) の後の main を最低限の検査に掛ける口は無く、 main がその検査に落ちたまま次の便が起きうる。 vessel 宣言（repo の宣言 file） (.vessel.toml) には床の検査（main の最低限の検査）の宣言が無い。 宣言の任意 key には、 runner の allowlist に縛られない 1 行の先例 ci-cmd が在り、 器はそれを shell を通さず argv 1 本として撃ち、 頭の語は PATH で解く (宣言 1 行が別の command を継ぎ足せないため)。 受付は宣言を読む段で ci-cmd の形 (穴 {sha} を持つ空でない 1 行) だけを検査し、 外れる宣言を行番号付きで断る。 共通 verify の行に掛ける allowlist・shell の記号・禁じる語列 (FR1056) の判定は ci-cmd には掛けていない (現物で読んだ事実)。 起動の列（起動を待つ契約の並び）の待ち理由は閉じた 8 値の型で、 列を丸ごと止める先例は器の健康の遮断器が「待つ」を返した周の HostBusy (dispatcher（便を自動で起こす口） の設計の §18) である。 待ち理由の列は FR1068 の本文が持つので、 新しい理由は FR1068 の改訂になる。 束 A (文書運用の強制) はこれを段 3 (床の検査の門) と段 5 (対話の見張り) とした。
  CTX2 事象 — 選択式の問いの窓は席を止め、 選んだ答えは裁定に結べない
  plugin の PreToolUse の hook の対象 (matcher（hook を撃つ道具の列）) も host-guard の配線の対象も Bash と Edit 系を合わせた 5 つの道具で、 選択式の問いの道具 AskUserQuestion（選択肢を出す問いの窓） はどちらの hook にも届かない。 届いても役割の guard の判定は権能付きの操作だけを見るので素通しになる。 設計の grill の skill など、 skill の文が選択式の問いを求めることがあり、 席は窓を開いて持ち主の操作を待って止まる。 選んだ選択肢は持ち主が打った字ではないので、 発話の記録として残らず裁定に結べない (SRS の FR1086 の根拠)。 「使わない」の規律は今は席の記憶と散文にしか無く、 N2 から規則ではない。 持ち主は 2026-09-28T00:49Z に、 skill の文が求めても例外なく使わないと裁定した。 掛ける範囲の問い (grill の論点 5) で推奨として採られた集合は、 器の repo と消費側の project の席と、 持ち主が自分で開いた session で、 どれも marker（所属の目印 file） が器の NAME を言う repo の中で動く。
  CTX3 機序 — hook の入力に「skill の中の呼び出しか」を示す欄は無く、 hook の一覧は session の起動時に読まれる
  Claude Code の hooks reference (記録時点 2026-09-28) では、 PreToolUse の matcher に AskUserQuestion を名で書け、 deny の理由は model に届く。 user が打つ skill の起動には UserPromptExpansion が撃たれ、 入力は expansion_type・command_name・command_args・prompt (生の skill の行) で、 matcher は command_name である (ADR-1031 の記録と同じ)。 hook の共通の入力 (session_id・prompt_id・transcript_path・cwd・permission_mode ほか) に、 道具の呼び出しが skill の中かを示す欄は無い。 ゆえに「持ち主が起こした grill の skill の間だけ通す」例外は、 起動の周に印を書き prompt_id の寿命で推すしかなく、 事実でなく推論になる。 hook の一覧 (hooks.json) は session の起動時に読まれ、 変わった一覧は立っている session に届かない (ADR-1028)。 一覧の食い違いで席を作り直す仕組みは廃止のままで (FR1062)、 導入先の同期の doctor の行 (FR1061) が digest の食い違いを名指す。
  CTX4 憲法と既存の決定の向き
  N2 は散文と記憶にだけ在る規則を規則と扱わない。 C16 は仕様からの逸脱を編集の時点で止め、 C16.2 と C11.2 は行為の中の guard を極性一覧に載せる。 C2 は新しい理由を閉じた型の 1 値として足す。 C10 は測れない値を合格に読み替えない。 C1 は規則の値を manifest 1 つに置き、 C5 は rules 行に裁定 id を求めるので、 時間の上限は rules 行 1 本で裁定 id を持つ。 floor-check の行は規則の値ではなく、 ci-cmd や remote と同じく repo が自分を名乗る宣言値で、 置き場は vessel 宣言である (ADR-1010 が宣言を repo の名乗りとし、 受付が manifest の上限と突き合わせる読み)。 NFR1006 は封じ込め（memory 上限付きの箱）の外で走る器の子 process を 0 本にする。 C17.2 は、 走査・記録・rules 行・仕組みを足すなら先に消すものを名指す、 と定める。 本 ADR が足すのは記録 2 種 (sha ごとの rc の結果・周ごとの判定)・rules 行 1 本 (時間の上限)・判定 2 つで、 消すものとして名指すのは、 席の記憶と散文に置かれた 2 つの規律 (選択式の問いを使わない・main の床の検査を席が手で確かめる手番) を器の判定へ移すことである (解釈)。 既存の決定では、 役割の guard は PreToolUse の hook の入口に在り pane の無い session を止めない (ADR-1022)。 PreToolUse の hook は runner にも届く (ADR-1025)。 host-guard の配線の対象と timeout は固定で、 変えるには新しい hook 行と新しい決定が要り、 行を持たず切れない種類の先例 (見張り自身の設定の編集) を持つ (ADR-1056)。 承認の問いへの答えも Allow の値を持たない一律の deny である。 宣言 file の任意 key は足しても schema を上げず、 未知の key は読みの誤りとして断る (ADR-1054)。 着地した commit を使い捨ての worktree に出して封じ込めの箱の中で撃つ先例は着地後の検出である (ADR-1060)。 dispatcher は列の各便に閉じた型の理由を付けて列挙し、 orchestrator の介入（順番を動かす印） first / hold / release で列の順を動かせ (ADR-1034)、 周期の timer を持たない (ADR-1045)。 orchestrator の席は実装を自分でせず、 edit-code は tests/ の path に限られ (ADR-1045 §2 (1))、 runner は PreToolUse の write-set guard と command guard だけを受ける (ADR-1045 §2 (3))。
  CTX5 射程 — 動かすのは宣言の key 2 つ・rules 行 1 本・待ち理由と alarm の語・hook の対象 1 つと判定 1 つ
  動かすのは、 (1) vessel 宣言の任意 key floor-check とその行に固有の検査 (1 行の形・禁じる語列・shell の記号)、 rc の結果の記録と周の判定の記録、 起動の列の待ち理由 floor とそれを外す鍵としての介入 first の印、 管理 tick の合図の末尾の alarm の語 floor、 rules 行 floor.timeout_s (FR1085・FR1068・FR1027)、 (2) plugin の hooks.json の PreToolUse の既存の行の matcher に AskUserQuestion を足すことと、 それを止める判定 1 つと、 vessel 宣言の任意 key question-route (FR1086)、 だけである。 動かさないのは、 gate と主実測と着地後の検出、 便ごとの共通 verify、 ci-cmd の受付の検査、 待ち理由の既存の 8 値と HostBusy の判定、 host-guard の配線、 hook の command 行と timeout、 Bash と Edit 系の判定、 管轄の外の沈黙 (FR1024)、 宣言 file の schema の版である。 裁定 id の実在と未反映の裁定 (待ち理由 unreflected-ruling) は同じ束の別の ADR が持つ。 時間の上限の行 floor.timeout_s の値は本 ADR の決定ではなく、 推奨は 300 秒である。 床の検査は数分で終わる最低限の検査であるべきで、 周はその終わりを待つので、 それを越える検査は床の検査でなく便ごとの検査に置く、 という線による。
  （選択肢を測るものさし）この判断を評価する 6 本のものさしです。 壊れた main の上に便を積まず、 直す経路を閉じないこと。 床の検査を撃つ費用を縛ること (終了コードで終わった結果は同じ commit で撃ち直さず、 1 回ごとを時間の上限と箱で縛る)。 選択式の問いを散文や記憶でなく器の門で止め、 抜け道を持たないこと。 止めた所で問いの経路を告げること。 管轄の外で黙る約束や他の道具の判定など、 既存の約束を壊さないこと。 足すものを最小にすること。
  DR1｜壊れた main の上に便を積まず、 直す経路を閉じない — main が床の検査に落ちている間は first の印 (直す便に付ける印) を持つ便のほかを起こさない CTX1
  DR2｜床の検査を撃つ費用を縛る — rc で終わった結果は同じ木で撃ち直さず、 1 回ごとを時間の上限と封じ込めの箱で縛る (GOAL1002・NFR1006) CTX1・CTX4
  DR3｜選択式の問いは散文や記憶でなく器の門で止め、 例外や切る行という抜け道を持たない (N2・裁定 00:49Z) CTX2・CTX3・CTX4
  DR4｜止めた所で問いの経路（問いを出す正しい道）を告げる — 止めるだけで終わらず、 平文の返答と台帳の問いと repo の宣言の 1 行を返す CTX2
  DR5｜管轄と既存の約束を壊さない — 管轄の外の沈黙・他の道具の判定・hook の予算・host-guard の配線・宣言の schema CTX3・CTX4・CTX5
  DR6｜足すものを最小にする — CI の 1 行の撃ち方・HostBusy の型・既存の hook の行を使う (C17) CTX1・CTX4
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 床の検査の 1 行は、 撃つ前に形・禁じた command の並び・shell の記号を検査し (当たる行は撃たずに撃てなかった周と読みます)、 main の commit ごとに箱の中で撃ち、 終了コードで終わった結果だけを commit ごとに残します。 落ちている間は、 介入の印 first を持つ契約 (main を直す便に付ける印・器は直す便かを判じない) のほかを、 閉じた 3 つの形の理由で待たせます。 選択式の問いの道具は、 器を名乗る repo で、 例外も切る行も持たずに止め、 問いの経路を告げます。
  採用 — OPT1
  器 SHALL vessel 宣言に任意 key floor-check (repo が名乗る 1 行の command・ci-cmd と同じく宣言値) を足す。 key を持つ repo でだけ、 dispatch の周 (FR1068 の契機の周) ごとに撃つ側と待たせる側の 2 つを行い、 key の無い repo では撃たず待たせない。 撃つ側: main の先端の sha の rc の結果が置き場に無い周だけ、 その sha を出した木 (anchor の作業木ではない) の宣言から行を読み、 撃つ前に行に固有の検査 3 つ (1 行の形〔空でなく、 改行を含む制御文字も穴も持たない〕・FR1056 と同じ判定の禁じる語列・shell の記号〔共通 verify の行と同じ集合〕の断り) に掛け、 当たる行は撃たずに行番号付きで断ってその周を撃てない周と読む (fail-closed。 ci-cmd の形の検査とは別で、 ci-cmd には禁じる語列を掛けていない)。 通った行は shell を通さず argv 1 本で、 頭の語を PATH で解き、 runner の allowlist に縛られず、 封じ込め (NFR1006) の箱の内側で 1 回撃ち、 周はその終わりを待つ。 rc 0 だけを合格と読む。 rc で終わった結果 (rc と要約の 1 行) SHALL sha を鍵に置き場へ残し、 同じ sha では撃ち直さない (main が進んだ周に撃つ)。 撃てない周 (検査に当たる・行か頭の語が解けない・箱を作れない・時間の上限の行を読めない) と時間の上限 (rules 行 floor.timeout_s・値は user 裁定 id 付き) を越えた周 SHALL その周を不合格と読み、 sha の結果として残さず (その周の判定の語は sha と別の周の記録として置き場に残し、 doctor と tick はそれを読む)、 次の周に撃ち直す。 待たせる側: その周の判定か main の先端の sha に残った結果が不合格である間 SHALL 周ごとに、 介入 first の印を持つ契約は floor で待たせず (main を直す便の経路・器は直す便かを判じない・他の待ちの条件は変えない)、 それ以外の起動の列の全部の契約の理由を floor にし (他の待ちの理由より先に出す・閉じた型の 1 値)、 理由の語は floor:<rc>・floor:unfireable・floor:timeout の閉じた 3 形とし、 doctor の 1 行に結果を、 管理 tick の合図の末尾の alarm に語 floor を出す (tick は置き場を読むだけで撃たない)。 列は timer を持たず、 main が直った後の撃ち直しは次の契機の周 (first の印で起きた便の終端か、 alarm の floor で起きた orchestrator の席の手動の 1 周) に起きる。 器 SHALL plugin の hooks.json の PreToolUse の既存の行の matcher に AskUserQuestion を足し (command 行と timeout は変えない)、 hook の入口は session の起動の repo の marker が器の NAME を言う周に AskUserQuestion を実行の前に deny する。 判定は pane・登録 row・役割を解く前の 1 関数で、 登録 row の有無・役割 (orchestrator の席か runner の session か)・user が開いた session か・skill の文やその起動の直後かに依らず、 通す値も切る rules 行も例外の印も持たず、 極性一覧に 1 行載る。 断りは rc 2 と 1 行で、 問いの経路 (平文の返答で問う・user の裁定が要る問いは台帳の問い〔FR1081〕) と、 anchor の HEAD の vessel 宣言の任意 key question-route (1 行) が在ればその行を告げる。 置き場か宣言を読めない周も deny する。 他の道具の判定はこの deny に依らず、 host-guard の配線と FR1024 の沈黙も変えない。 floor-check と question-route の 2 key・待ちの 3 形・matcher の AskUserQuestion SHALL 跨版の面（版を跨いで保つ約束）とし、 外すには新しい ADR を要する。
  （平易）repo が宣言 file に床の検査の 1 行 (floor-check) を書けます。 これは CI の結果を読む 1 行 (ci-cmd) と同じ、 repo が自分を名乗る値です。 行を書いた repo でだけ、 器は便を起こす周ごとに、 撃つ側と待たせる側の 2 つで働きます。 撃つ側では、 main の今の commit の結果が無いときだけ、 その commit の宣言から行を読み、 1 行の形 (空でなく、 改行などの制御文字も {sha} のような穴も持たない)・禁じた command の並び・shell の記号の 3 つを検査します (ci-cmd の形の検査とは別の、 この行だけの検査です)。 当たる行は撃たずに行の番号付きで断り、 その周を撃てなかった周として扱います。 通った行はその commit の木 (作業中の木ではなく) で、 shell を通さず、 実装役の一覧に縛られず、 箱の中で 1 回撃ち、 終わるのを待ちます。 終了コードで終わった結果は commit ごとに残し、 同じ commit では撃ち直しません。 撃てなかった周と、 時間の上限 (規則の行 floor.timeout_s・値は持ち主の裁定で決める) を越えた周は commit の結果としては残さず (その周の判定は別の周の記録に残し、 doctor と知らせはそれを読みます)、 次の周に撃ち直します。 終了コード 0 だけが合格です。 待たせる側では、 落ちている間は、 介入の印 first を持つ契約 (main を直す便の道。 器は直す便かを判じません) はこの理由で待たせず、 ほかの起動を待つ契約を待たせ、 この理由をほかの待ちの理由より先に出します。 理由は floor の後に終了コード・撃てない・時間切れのどれかを付けた 3 つの形です。 doctor の 1 行と、 管理 tick の知らせの末尾の目印 floor で知らせます。 列は時計で回らないので、 知らせで起きた対話の席は直す契約を起票して first の印を付け (起こすのは dispatcher です)、 便の外で main が直ったときは 1 周を回します。 選択式の問いの道具は、 器の plugin の hook の既存の行の対象に足し、 器を名乗る repo では、 登録・役割 (対話の席か実装役の session か)・誰が開いたか・skill の文に依らず止めます。 通す値も切る行も例外の印もありません。 断るときは、 平文の返答で問うこと、 持ち主の裁定が要る問いは台帳の問いとして立てること、 そして宣言に question-route の 1 行が在ればそれを告げます。 他の道具の判定・口座の見張り・管轄の外で黙る約束は変えません。 2 つの key と理由の 3 つの形と対象に足した名は、 器の版を跨いで保ちます。
  （理由）main が最低限の検査に落ちたまま便を起こすと、 どの便も同じ赤の上に積まれ、 gate か着地の後の検査で落ちるか、 赤を前提にした変更を足し、 手番が無駄になります。 そこで落ちている間は、 介入の印 first を持つ契約のほかを待たせます。 直す便まで待たせると、 実装を自分でせず src を直せない orchestrator の席 (ADR-1045) には、 code が原因の赤を直す道が無くなるからで、 列の順を動かす既存の印 first を直す便の鍵に使います。 床の検査の待ちだけを外す専用の印を作らないのは、 要件 FR1085 が first と決め、 印を増やさない (DR6) ためで、 代わりに急ぎで付けた first も、 直す便でなければ赤の上で起きます。 関わる便だけを待たせる形は、 検査の出力からどの file のせいかを判じる読み手が要り、 器はそれを一般には読めず、 直す便を先に来させるにはやはり first の印が要ります。 床の検査を便ごとの検査に入れる形は、 便の外の着地の後の赤を次の便の前に拾えず、 撃つ回数も便の数だけ増えます。 終了コードで終わった結果を commit ごとに 1 回だけ持つのは、 撃つ費用を縛るためで (DR2)、 撃てなかった周と時間切れの周は commit の結果として残さず次の周に撃ち直します。 撃ち方を ci-cmd と同じにし、 撃つ前にこの行だけの検査で禁じた command の並びと shell の記号も断るのは、 追跡された file の 1 行が shell で別の command を継ぎ足したり、 器の周に禁じた command を撃たせたりできないようにし、 既存の口で済ませるためです。 検査に当たる行を撃てなかった周と読んで待たせるのは、 撃たなかった行を合格に読み替えないためです (C10)。 選択式の問いを止めるのは、 窓が開いている間は席が持ち主の操作を待って止まり、 選んだ答えは持ち主が打った字でないので裁定に結べないからです。 散文や記憶の規則は規則でないので (N2)、 器の門で止めます。 例外を持たないのは持ち主の裁定 (2026-09-28T00:49Z・skill の文が求めても例外なく使わない) で、 加えて hook の入力に skill の中の呼び出しかを示す欄が無く、 例外は推論に頼る抜け道になります。 判定を席の登録や役割を調べる前に置くのは、 登録の無い session も同じに止めるためです。 止める範囲を器を名乗る repo にしたのは、 掛ける範囲の問いで採った推奨の集合 (器の repo と消費側の project の席と、 持ち主が開いた session) がどれもその中に居るからで、 管轄の外で黙る約束 (FR1024) を保てます。 first の印の契約のほかを待たせる形と止める範囲は、 推奨で進める常設の指示 (2026-09-28T00:54Z) の下の推奨です。 限界として、 床の検査の側では、 first の印の無い関わらない便も待ち、 印を付けた契約は直す便でなくても起き、 時間切れが続くと周ごとに上限まで周が止まり、 宣言の行の誤り 1 つや host の不備 (頭の語が PATH に無い・箱を作れない・時間の上限の行が無い) で印の無い契約が全部待つことを、 選択式の問いの側では、 管轄の外の session と器の plugin を積まない session で止まらず、 器の binary が無い周は通してしまうことを残します。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1085（claim）: FR1085 (床の検査) の 2 つの半分の形を決めると主張する。 撃つ側 — 宣言の key・dispatch の周に main の先端の sha ごとに 1 回・行に固有の検査 3 つと当たる行の撃てない周 (fail-closed)・argv と PATH と封じ込め・rc 0 だけ合格・rc の結果だけを sha に残し、 撃てない周と時間切れの周は不合格と読んで残さず撃ち直す。 待たせる側 — 不合格の間は介入 first の印を持つ契約を待たせず、 ほかの契約を閉じた 3 形の理由で待たせること・doctor と alarm・timer を持たない回復の経路 (first の印で起こす直す便と、 alarm で起きた席の手動の 1 周)。
  FR1068（claim）: FR1068 (便の自動起動) の待ち理由の閉じた型に床の検査の不合格 (floor・FR1085) を 1 値足し、 不合格の間は介入 first の印を持つ契約のほかの全部の契約が待つと主張する (FR1085 の待たせる側)。 同じ改訂の unreflected-ruling は同じ束の別の ADR が持つ。
  FR1027（claim）: FR1027 (管理 tick) の打刻の合図の末尾の alarm の閉じた語に floor を足し、 tick は置き場の記録を数えるだけで床の検査を撃たないと主張する。 alarm の語 unreflected は同じ束の別の ADR が持つ。
  FR1086（claim）: FR1086 (選択式の問いの遮断) の形 — 既存の hook の行の対象・例外を持たない 1 関数・問いの経路と question-route の告げ方・止める範囲 (marker が器の NAME を言う repo)・ほかの道具の判定がこの deny に依らないこと — を決めると主張する。 AC1056 の deny の 5 形のうち役割に当たるのは、 登録 row を持つ orchestrator の席と runner の session の 2 つ (役割の一覧の値は 1 つ)。
  NFR1006（implementation）: NFR1006 (host の資源) の封じ込めの外で走る子 process 0 本を、 床の検査の 1 行にも当てる。 NFR1006 が床の検査を求めたのではなく、 新しい子 process をその内側に置く。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録は、 hook の対象・宣言 file の key・起動の列の待ちの理由にそれぞれ足す追補で、 置き換えるのは ADR-1045 の「runner は write-set guard と command guard だけを受ける」の 1 句だけです (runner にも選択式の問いの deny が掛かるので、 その句を部分的に置き換えます)。 介入の印 first には、 列の順を動かす意味のまま床の検査の待ちを外す鍵の役目が加わり、 ADR-1022 の「機械に見えるのは編集と実行だけ」の前提は、 選択式の問いの道具の呼び出しの分だけ広がります。
