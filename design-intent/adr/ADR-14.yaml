# 判断の記録 ADR-14 — 文書の運用を仕組みで強いる 5 段に tsuzuri が加わる（発効 2026-09-27・持ち主の裁定 t3-hub.57.1:20260927T2357Z-1・記帳先 = tsuzuri の台帳 t3-hub.57.1 notes）
# 相談の全文は台帳 t3-hub.57 の notes（s2 と folio2 の答えと席のまとめ）。実装は各席の判断の記録と行で、この記録は tsuzuri の側の約束と加わる順だけを持つ。
id: ADR-14
title: 文書の運用の強制は、無いと先へ進めない形の 5 段で入れ、tsuzuri は各段が器と folio に着地した順に加わる
status: accepted
date: 2026-09-27
context: |
  2026-09-27 の画面の波で、計画と決定は席の追跡されない作業場の中にだけ在り、持ち主への問いはチャットで出ていた。計画の設計ノート（surface-plan）は持ち主の指摘の後にようやく書かれた（裁定 t3-hub.56:20260927T2259Z-1）。
  持ち主は、これを folio と器に文書を適切に作らせ運用させる強制力が無かったことと読み、その方法を folio2 と scribe2 の席に相談するよう指示した。
  folio2 と scribe2 の 2 つの席の答えはほぼ一致した。形の検査は欠けた層に気づけない。層を在らせるのは、その層を読まないと動けない読み手である。だから抜けを探す検査ではなく、無いと先へ進めない形にする。
  席は 2 つの答えを 5 段の案にまとめ、board の問い（t3-hub.57.1）で持ち主に出した。持ち主は案 A（5 段をこの順で進める）を選んだ。
decision: |
  (1) 引く裁定 id の実在。追跡された file が引く裁定 id は、台帳の問いの記録に解け、対話面 R-8 を通ったものだけとする。床（folio）が形を、器が実在を見る。チャットだけの裁定は引けないので、文書に書けない。
  (2) 計画の設計ノートの必須と行の索引の生成。置き場が folio の鍵の行で加わると、発効した計画のノートが 1 つ要る（無いか草稿なら床は まだ分からない）。計画の行の索引は各ノートの契約表から導く生成の節にし、手で書くのは差の調べ・行の順・裁定を引く決定だけにする。
  (3) 送り出し（dispatch）の時の床の合格。器は便を送り出す（dispatch）前に folio check を撃ち、合格（まだ分からない 0）のときだけ流す。計画が草稿なら (2) により止まる。
  (4) 問いの反映先の型と未反映の差。board の問いは起票の時に反映先の型（文書に書くものと、操作だけのもの）を持つ。文書に書く裁定は、追跡された file がその id を引くまで未反映とし、器は受付・送り出し・着地でこれを比べ、止めるのはその裁定に関わる便だけにする。壁時計の期限は使わない。
  (5) 席への直接の問い（AskUserQuestion）の見張り。器の道具を使う前の hook（PreToolUse）が席の役の直接の問いを断り、board の問いの道を返す。持ち主が起こす聞き取り（grill）は例外とする。
  (6) 断る物。散文の規則、AI の審査役を強制に使うこと、日付の古さ、手で書く 2 つの面を検査で揃えること、反映不要の旗。
  (7) tsuzuri の側の約束。各段は scribe2 の席（器）と folio2 の席（folio）の判断の記録と行で入る。tsuzuri は各段が着地した順に加わり（(2) は置き場の鍵の行を足す）、加わる前の穴は計画の設計ノート（surface-plan）の運びで埋める。どの段に加わったかは計画の設計ノートの 6 節に記す。
  (8) 残る穴。どの文書にも入らないチャットの決定は機械では見えない。持ち主への問いは board に出す運びと、(5) の見張りで狭める。
options:
  - id: E1
    name: 無いと先へ進めない形の 5 段
    text: 決定 (1) から (7)。
    verdict: adopted
    reason: 2 つの席の答えが一致した形で、どの段も読み手（床・器の受付・送り出し・見張り）が層を読まないと先へ進めない。検査の足し算でなく、欠けた層を決定的な違反にする。
  - id: E2
    name: 一部の段だけ
    text: 5 段のうち選んだ段だけを入れる。
    verdict: rejected
    reason: 段は前の段を足場にする（(3) は (2) の計画が無いと止める物が無く、(4) は (1) の実在が無いと引く id を信じられない）。持ち主は 5 段とも選んだ。
  - id: E3
    name: 見送り
    text: 今の運び（席が計画を書き、問いを board に出す）を続け、仕組みは足さない。
    verdict: rejected
    reason: 今回の抜けは運びの約束が在っても起きた。散文の約束は規則として扱わない（条 N-2）。
basis: [N-2, P-2, R-8]
retreat:
  kind: ruling
  condition: 段の 1 つが、着地の後に正しい作業を止める（誤って断る）ことが 2 度起き、その段を持つ席の直しで消えないとき、その段だけを外すかを持ち主の裁定で決め直す。
plain: |
  設計ノートを書き忘れたり、あなたへの質問をチャットで出したりすることを、AI の心がけでなく仕組みで止めるための決定です。
  考え方は「抜けを見つける検査」ではなく「無いと先へ進めない形」にすることです。5 つの段を順に入れます。
  1. 文書に書ける答えの番号は、board の質問の記録に実在するものだけです（チャットでの答えは文書に書けなくなります）。
  2. 計画の設計ノートを必須にし、行の一覧は各ノートから自動で作ります。
  3. 器は検査が完全に合格のときだけ作業を流します。
  4. 質問を出すときに答えの書き先を決め、書かれるまでその答えに関わる作業だけを止めます。
  5. 席が質問用の道具であなたに直接聞くのを器が止め、board へ回します（あなたが始める聞き取りは例外）。
  各段は scribe2 と folio2 の側で作られ、tsuzuri は出来た順に加わります。
  この記録はあなたの承認で発効しています。承認の記帳先は tsuzuri の台帳です。
approval:
