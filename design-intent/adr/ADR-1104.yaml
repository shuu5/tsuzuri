  器の案の章の要約: 候補を 8 つ並べます。 行に対応の欄を足して器が 3 か所で数える案 (選んだ案) と、 選ばなかった 7 つです。 選ばなかった案は、 審査の係の表だけで持つ案・done を子行に割る案・全部の行に欄を求める案・今の行を一覧に凍らせて免除する案・動きの変わらない決まりにも字を数える歯を書かせる案・変わった行を着地の列の鍵で決める案・欄の読み手と照らしを一度に足す案です。
  器の専門語の説明: 本文に出てくる専門語 5 個を、 やさしい言葉で説明します。
  ・done の項目（done item）: 契約表の行の done の字を、 (1) から 1 ずつ増える番号の印で区切った約束の 1 つ (設計 contract-source.md §64 の読み手・本 ADR)。 印は半角の括弧と ASCII の数字だけ。
  ・歯の対応の欄（done-teeth field）: 契約表の行の任意の欄 done-teeth (本 ADR)。 要素は「<番号>:<歯>」で、 done の項目ごとに、 その約束を外した実装で落ちる歯を 1 本以上名指す。 器が表の検査・受付・gate で揃いと在りかを数える。
  ・既存の歯の印（kept tooth mark）: 歯の対応の欄の歯の名の前に置く = (本 ADR)。 base に在り、 その便が本文を変えない歯を表す。 gate は印の無い名の歯にだけ、 base から足されたか本文が変わったことを求める。
  ・仕組みの歯（mechanism tooth）: 歯の対応の欄の !<名> の形 (本 ADR)。 名は閉じた 4 語 (write-set・place-only・new-file・closure) で、 外した実装でも観測の変わらない構造の制約を、 器の仕組み (runner の guard・gate の最初の段・便の木で撃つ表の検査の閉包) が測ることを表す。 closure は、 足した file がほかの行の touches の型を名指してその行の閉包を write-set の外へ広げないことで、 行は便の木で表の検査を撃つ検証行を持つ。 挙動の約束には書かない。
  ・検証行の番号の歯（verify-line tooth）: 歯の対応の欄の @k の形 (本 ADR)。 行の k 本目の検証行の全体を歯とする。 歯の名を 1 本ずつ解く読み手の無い形 (別の言語の test の撃ち手・文書の検査) の項目は、 この形で書く。
