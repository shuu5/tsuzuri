consequences:
  - "良い点は、 記録と実際に動いているものが一致し、 検査の 1 行を読めば何が測られているか分かることです。 弱い点は、 一致を機械が見張っているわけではないことです。"
  - "Positive: 記録された列挙と判定行の現物が一致するため、 判定行 1 行から「何が測られているか」を辿れる。 tag を足す便は本 ADR の supersede を伴うので、 測定面の増減が記録面に残る。"
  - "Negative: 列挙と現物の一致を測る機械は無い。 tag を足しても本 ADR を supersede しなければ、 記録は再び現物より少ないまま気付かれない (ADR-1002 §2.4 が 10 本のまま残ったのと同じ形)。 この乖離は現時点では便の手続き (契約が ADR の更新を要求する) で抑える。 ci-decl のように「実体を持たない案」を先に記録しない規律も、 同じ理由で人間の手続き側に在る。"
