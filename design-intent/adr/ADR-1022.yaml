  器の記録の前置き: 本 ADR は IETF RFC 2119 および RFC 8174 / BCP 14 に定義される MUST / SHALL / SHOULD / MAY のキーワード解釈規約に従う。 ADR は決定時点の記録であり、 改訂は新しい ADR による supersede で行う。 本 ADR の §2 は user 裁定 (2026-09-12・論点 1〜5 と要件書の grill Q1〜Q3) を受けた決定で、 §3 は SRS v0.7 への pointer である。 本 ADR は要件の文面を持たない。 ADR-1016 §2.1 が文書面にだけ置いた席の役割の規律 (管理席は答えず中継する・go の後に merge する・自分の手で実装しない) に、 データ面 (rules 行) と機械の執行 (guard) と注入 (生成文) を与える決定であり、 憲法の条文は動かさない (C7 は「対話面の identity は R-C7-1 が持つ」と定めており、 §2.5 は行の値の変更である)。 発効: 本 ADR は rules 行の値を持たず (C1)、 役割ごとの権能の列と R-C7-1 の新しい値は契約が裁定 id 付きで manifest に書く。 accepted である (§2.1〜§2.5 の実装 bead は起票できる)。
  器の機械の欄 version: 0.4.6 (拘束する constitution の版。 本 ADR は憲法の条文を動かさない)
  器の機械の欄 decided-by: user (2026-09-12) — planner の相談材料 (役割の規律をどこに置き、 どう強制するか) の論点 5 つに対する裁定 (要旨: 1 = 強制の芯は Role / Capability の閉じた型 + manifest 行。 2 = 役割の識別は器の席登録 (DB に記録・起動 script に組み込む)。 3 = 注入は SessionStart hook。 4 = 対話面 R-C7-1 を planner の席へ。 5 = 席層の land を folio2 の Rust 便の前提にする。 加えて「発話は止めなくてよい・機械で止めるときに planner の許可が要ると告げれば足りる・散文や字面でなく構造 / システム / 機械で規律を守らせる」) と、 要件書の grill (同日) の裁定 (Q1 = 役割の判定は登録 row だけ。 Q2 = 管理席は 1 席。 Q3 = 継続は must・席間の連絡は should)。 逐語は台帳 s2-07l.155 の notes が原本で本 file には写さない (CON1002)
  器の機械の欄 stakeholders: Developer, AI Agent, External Reviewer
  器の機械の欄 supersedes: 次の文を部分 supersedeする (§2.6): (i) ADR-1016 §2.1「便の既定の配送構造を planner 1 席 + 管理席 N 席 (N ≥ 1・各席 1 口座)」を「anchor ごとに planner 1 席 + 管理席 1 席 (各席 1 口座)」と読む、 (ii) ADR-1004 §2.6「口座・lease・退役・tmux 席の状態 (C3 の残りの列・C9) は MVP の event log に持たせない (SRS scope out)」を、 席の登録 row (役割・target・anchor・口座 label・起動の雛形) に限って supersede する (lease・退役は引き続き持たない。 口座残量は ADR-1017 §2.1 が既に supersede 済み)。 他の文は変えない。 R-C7-1 の値の変更 (§2.5) は ADR-1003 §2.1 が想定した「行の値の変更」であり supersede ではない (related)
