  器の却下案の節の要約: 7 つの案を退けました。 役割ごとの skill や agent 定義を plugin に同梱する案は文章の置き場を増やします。 対象 repo の CLAUDE.md に生成区間を書く案は注入と二重になります。 窓の名前で役割を決める案は字面と host の慣習に依ります。 subcommand が役割の引数を検査する案は identity を偽装できます。 管理席を N 席のままにする案は、 並列と口座の分散が別の層に移った今、 理由がありません。 manifest の文章型の行に置く案は文章を manifest に置いただけです。 発話を監視して止める案は機械に見えないものを見ようとします。
  器の記録の出所（Trace）:
  出所は、 user の問いと 5 つの論点の裁定、 要件書の grill の裁定、 器の現物 (hook が渡す identity・plugin の注入・型と行) の実測、 散文面の棚卸し、 そして先行決定 (対話面の行・席の状態の打刻・配送構造・列挙の置き場・極性一覧) です。
  ・user の問いと裁定 (2026-09-12・会話面・planner 席): 憲法は「この器を作る規律」で「この器を plugin として使う規律」ではない → 役割の規律の置き場と強制力を 5 論点で grill → 論点 1〜5 を推奨で裁定 → 「発話は止めなくてよい・機械で止めるとき planner の許可が要ると告げれば足りる・構造 / システム / 機械で守らせる・同種の問題が無いか全体を確かめる」→ 要件書の grill Q1〜Q3 を裁定。 逐語は台帳 s2-07l.155 の notes (tracked file には写さない・CON1002)。
