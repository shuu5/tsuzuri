consequences:
  - "良い面は、 役割の決まりが文章の約束から器の構造 (型・行・番人・生成文) に移り、 別の project でも席を登録するだけで同じように効くこと、 決まりの置き場が 1 つになって前の版の「同じ文が散って食い違う」形が消えること、 管理席が user に直接裁定を求めても記帳で止まること、 止められた席が「誰の権能か」を知って迂回せず持ち込めることです。 悪い面は、 型が 2 つ・行が役割の数だけ・番人が 1 つ・event が 1 つ増えること、 席を使う前に登録が要ること、 hook が Bash にも挟まって毎回 pane を解くこと、 発話までは止められないこと、 器の hook を積まない session では番人が効かないことです。"
  - "Positive: 役割の規律が C14 の 2 面 (文書 = SRS / ADR・manifest = 権能の行) に収まり、 執行 (§2.3)・注入 (§2.4)・生成文書 (C1.2)・drift 検査 (C14.2) が同じ行を読む (1 source)。 consumer は席の登録だけで同じ執行と注入を得る (前の版の同文 N 面を作らない・N2)。 事故型 (a) (b) (c) (e) は guard で止まり、 (d) は記帳で効かなくなり、 (f) は ADR-1018 の内蔵の便へ。 deny 文が権能の所在を告げるので、 席は迂回でなく持ち込みへ向かう (裁定の期待値)。 identity が hook の pane に閉じ、 subcommand の引数を信用しない (偽装の面が消える)。 席の数が anchor ごとに 2 で固定され、 tick / cycle の運用費が席数で増えない。"
  - "Negative (受け入れるコスト): Role / Capability の enum 2 つ・RuleKind の variant 1 つと役割ごとの rules 行・Guard の variant 1 つ (極性一覧に 1 行・hook の束の末尾)・EventKind の variant 1 つ・subcommand 1 つ・雛形 2 枚・xtask の検査 1 つ・PreToolUse の shell 行の変更 (Bash の matcher と --pane) が増える。 席は使う前に登録が要る (1 席 1 回・起動が器に入るまで人の操作)。 PreToolUse(Bash) が毎回 pane → target → replay を解く (NFR1005 の内側で実測済みだが event log の伸びに比例する・replay の cache は C3 により持たない)。 発話は止まらない (期待値で受ける)。 plugin を積まない session は guard が無く、 登録もできない (fail-open の面は s2-07l.149 の束)。 R-C7-1 の値の変更で、 user が管理席に直接話した裁定は記帳されず planner の手番が 1 回入る (意図した不便)。 管理席 1 席への縮退で、 移行期の席並列 (ADR-1016 §1) の速さは出ない (並列は便の層)。"
