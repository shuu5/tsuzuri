# 判断の記録 ADR-73 — 席の手元の写しを作法の行に替える（条 P-13.1 の改めと作法の行 D-5〜D-13）
# 判断の記録 ADR-38 の決定のうち、要の写しに段「いつも守る」の条の id と題の一覧を写す字（案 a の丙'）を部分で置き換える。ADR-38 の本文は替えない。
# 起草は係 w308a（2026-10-06）。材料は memo t3-hub.92.1 の本文と notes（記憶の仕分け・係 w306r）、見直しの記録（係 w303r の prompts-review.md の §2.1 と §3）、作り直しの案（tobe.md の流れ 7）、係 w308a の brief-design.md。検証役 w311v の所見（docs/grill/2026-10-06-ADR-73-grill.md）を係 w312a が映して直した（2026-10-06）。
id: ADR-73
title: 席の手元の要の写しは、段「いつも守る」の条の id と題の一覧に替えて、規則の表の作法の行（席の振る舞いの決まり）の id と what を持つ（条 P-13.1 の改め・作法の行 D-5〜D-13 を足す）
status: accepted
date: 2026-10-06
context: |
  持ち主は 2026-10-06 に作り直し（v4）を決め（決め D1〜D6 は全部推奨・発話 2026-10-06T08:08:35.348Z・記帳 t3-hub.91.4 notes 2026-10-06 08:11）、続けて席の起こしの文脈の替えを推奨で進めると決めた（発話 2026-10-06T08:16:48.774Z・epic t3-hub.92・段の memo t3-hub.92.1）。その段で、席の自動の記憶（MEMORY.md）を切る。記憶には席の振る舞いの決まりが在り、係（w306r）の仕分けで 15 件（席 11・主 4）が席の指示文の材料になった。散文と記憶にしか無い決まりは決まりとして扱わない（条 N-2.1）ので、切る前に型付きの置き場へ移す必要がある（条 P-1・P-2）。
  席の手元の要の写し（contracts/seat/brief.txt・5,160 byte・58 行）は、判断の記録 ADR-38 の案 a（丙'）で、段「いつも守る」の段の名の行と条の id と題の 28 行（合わせて 29 行・1,670 byte）を持つ。見直しの記録（prompts-review.md §2.1）は、題だけでは今何をするかが決まらず解釈が揺れると見た（I）。ADR-38 が丙を退けた理由は「28 条の番号と題が手元に無いと、席が条を引く時に在りかも分からない」で、題の一覧はどの条を読めばよいかの索引として働いている。全文の写し（contracts/seat/constitution.txt・14,900 byte・122 行）の在りかの行は要の写しに残るが、在りかの行は file を名指すだけで索引の代わりにはならない。
  要の写しの上限は R-1 − R-41 の 6,000 byte で、今の形に作法の行 13 本の id と what（2,314 byte）と段の名の行を足すと 7,487 byte になり越える。
  規則の表の作法の節（作法の行・種別 human-review・欄 article と ruling）には、席の作法 D-1〜D-4 が既に在る。器の役割の行（7 行・1,765 byte）は、決定はしご・対話面の作法・実装を自分でしない・起草の置き場を既に持つ。持ち主の全 project の指示（口座の CLAUDE.md）は、平易に話す・日本語で返す・編集の後の commit と push・解釈の分かれは明示して見せる、を持つ。
  ADR-38 の暫定（tsuzuri の plugin の SessionStart の 1 本）は既に終わっている。器の宣言（.vessel.toml）に要の写しを名指す鍵が在り、plugin/hooks/hooks.json に要の写しを出す行は無い（検証役 w311v の照らし）。
decision: |
  (1) 条 P-13.1 の字を「注入の命令を実行したとき、憲法の前文の順位と、段「絶対にやらない」と段「確認してから」の規範文の全文と、全文の写しの在りかと、規則の表の作法の行の id と what と、席の役割の指示文を、この順で席の手元の生成区間へ決定的に導出して書く。」に改める（憲法 第 1.5 版）。段「いつも守る」の条の id と題の一覧は要の写しから外し、全文の写しに残す。
  (2) 席の振る舞いの決まりの正本は、規則の表の作法の節の作法の行の 1 つとする。作法の行は全部の行の id と what を写し、欄 article・kind・ruling・note・refs は写さない（行ごとに写すかを選ぶ欄は置かない）。係だけを縛る作法が出たら、その時に欄を足す。
  (3) 作法の行 D-5〜D-13 の 9 行を足す（字は規則の表の行）。D-5 席は決める係・D-6 止まって問うのは段「確認してから」の条に当たる時と見立てだけの分かれの時だけ・D-7 ほかは推奨に決めて報告に明示し記帳・D-8 決めた値と範囲を揺らさず削らない・D-9 事実は完全な記録と code の現物から・D-10 周回は効きを数えてから足し検証役は 1 巡まで・D-11 再発の防ぎは門と hook と雛形の memo へ・D-12 係を並べ cache の切れた係は起こし直す・D-13 行き違いの照らしと相手の席への知らせ。D-5〜D-7 の出所は持ち主の向きと作り直しの案と見直しの記録で、D-8〜D-13 は記憶の 15 件のうち 10 件を縮めて入れた。5 件は入れない（3 件は役か道具の罠で席の決まりでない・1 件は係の手引きの参照に在る・1 件は口座の CLAUDE.md と重なる）。
  (4) 器の雛形と役割の行は替えない。決定はしごと対話面の作法は役割の行が持つので、作法の行に重ねない。口座の CLAUDE.md の行も重ねない。D-6 は止まる種類を段「確認してから」の条（A-1〜A-4）に任せて数え直さない（同じ決まりの正本を 2 つにしない・P-2）。持ち主の決めた値と範囲を替えない決まりは D-8 が持ち、D-6 の止まる種類には足さない。D-7 は決めた事を持ち主への報告に明示するので、口座の CLAUDE.md の「解釈の分かれは明示して見せる」と張り合わない。
  (5) 導き方の替えは tsuzuri の行（t-seat-manners）（ノート（surface-v4a））が作る。行の便は、この記録の承認と憲法 第 1.5 版の着地（anchor の凍結を含む）の後に流す。自動の記憶を切る鍵は、作法の行が main に着地した後に入れる。
  (6) R-1 と R-41 の値は替えない。要の写しは 5,817 byte・43 行、役割の行と合わせ 7,582 / 8,000・50 行になる（今は 5,160 byte・6,925 / 8,000・65 行）。注入の byte は 657 増え、要の写しの上限 6,000 byte までの余りは 840 から 183 byte に減る。作法の行の 1 本は平均 178 byte なので、余りは作法の行 1 本に足りない。次に作法の行を足す時は、縮めるか R-1 を改めるかを問う（撤退 (3)）。
  (7) 第 1.5 版の着地から行（t-seat-manners）の着地までのずれ。この間、今の tz derive（folio2 の seat.rs）は頭の版の字だけが第 1.5 版で、段「いつも守る」の条の題を持ち作法の行を持たない要の写しを導く。第 1.5 版の設計の commit はこの導き直しの 2 file（要の写しと全文の写し）を含むので derive --check は通るが、要の写しは改めた P-13.1 の字を満たさない。この間 P-13.1 は「まだ分からない」と扱い、この記録がずれの範囲と期限を持つ（ADR-38 の決定 (7) と同じ形）。ずれは行（t-seat-manners）の着地で閉じ、期限は撤退 (4)。席の手元はこの間も今の形（条の題あり・作法の行なし）のままで、自動の記憶を切るのは着地の後（(5)）なので、決まりが手元から消える間は無い。
  (8) ADR-38 が丙を退けた理由への答え。失うのは、段「いつも守る」の 28 条の索引（どの条を読めばよいか）が手元に在ることである。代わりの費えは、条を引く要る時に全文の写し（14,900 byte・122 行）を読むことで、作法の行の欄 article が名指す条（P-19・P-27 など）も手元の題では引けず全文の写しで引く。順位の行は前文の逐語なので段「いつも守る」の名を名指したまま残し、段の中身は全文の写しで引く。この費えを払うのは、題だけでは今何をするかが決まらず、空く byte で今何をするかを決める作法の行を手元に置けるからである。ADR-38 の撤退の条件 (2)（器の番号と tsuzuri の番号の取り違え）は題の有無と別の量なので、そのまま生きる。(3)（いつも守る の条の字を全文の写しを読まずに誤った記帳 2 件）は、この記録の撤退 (1) が置き換える（窓を行（t-seat-manners）の着地から数え直し、題が手元に無い形で数える）。
options:
  - id: a
    name: 甲 — 要の写しの条の題を作法の行に替える
    text: 決定 (1) から (8)。
    verdict: adopted
    reason: 席の決まりが型付きの置き場 1 つに在り、記憶を切っても起きるたびと圧縮ごとに席の文脈に残る。R-1 の値を替えずに収まる。失う物は、byte が 657 増え要の写しの余りが 183 byte（作法の行 1 本に足りない）に減ることと、条の索引が手元から消え要る時に全文の写し（14,900 byte）を読む費えである。
  - id: b
    name: 乙 — 条の題を残し、R-1 を上げて作法の行を足す
    text: 条 P-13.1 に作法の行の id と what を足す改めをし（題は残す）、R-1 を約 9,500 byte に上げる。
    verdict: rejected
    reason: 条の索引は手元に残る。しかし要の写しは 7,487 byte・注入は 9,252 byte になり、起動と圧縮ごとの文脈が今より 2,327 byte 増える。条の改めに加えて閾値の改め（条 P-17・A-2.3 の検証）が要る。題は今何をするかを決めない（見直し §2.1）ので、索引を残す値打ちが byte の増えと閾値の改めに見合わないと見た（I）。
  - id: c
    name: 丙 — 器の雛形（orchestrator.txt）に席の作法を書く
    text: 器の役割の行に作法の行を足す。
    verdict: rejected
    reason: 器の雛形は器を使う全部の project の席の物で、tsuzuri の決まりの正本にならない。役割の行の上限 R-41（2,000 byte）を越え、器の行と器の版の入れ替えが要る。
  - id: d
    name: 丁 — 作法を CLAUDE.md（根か口座）に書く
    text: 席の決まりを CLAUDE.md の散文に足す。
    verdict: rejected
    reason: 散文にしか無い規則になる（条 N-2.1）。口座の CLAUDE.md は持ち主の全 project で共有され、根の CLAUDE.md は係と便も読む。番号を持たず、条から引けない（条 P-1）。
  - id: e
    name: 戊 — 作法の行を規則の表に足すが写さず、在りかの 1 行だけを写す
    text: D-5〜D-13 を規則の表に足し、要の写しには条の題を残したまま規則の表の在りかの 1 行（約 30 byte）を足す（条 P-13.1 に在りかの行を足す改め）。
    verdict: rejected
    reason: byte はほぼ増えず条の索引も残る。しかし作法の行は起きるたびと圧縮ごとの文脈に入らず、席が自分で規則の表（file 全体 55,745 byte・作法の節 5,989 byte）を読む時だけ効く。今は自動の記憶が起きるたびに決まりを席の文脈に入れているので、記憶を切ると決まりが自動で手元に来る道が無くなる。
produced: [D-5, D-6, D-7, D-8, D-9, D-10, D-11, D-12, D-13]
basis: [ADR-38, N-2.1, P-1, P-2, P-13, P-17, P-19, P-27, A-1, A-2, A-2.3, A-4, R-1, R-41, D-1, D-4]
grill:
  when: 2026-10-06
  who: 検証役 w311v（AI・起草者と別の独立の文脈・読み取りだけ）
  where: docs/grill/2026-10-06-ADR-73-grill.md
  summary: 検証役 w311v が係 w308a の下書き（この記録・憲法の差・作法の行 D-5〜D-13・持ち主への問い）を 1 巡攻めた。判じは直してからよい（致命 0・要直し 9・軽い 7）。数は合ったが、行が 15 減るのを利益に書き byte が 592 増え余りが 248 byte に減ることを書いていない、P-13.1 の字が「作法の行の全文」と言い導く物（id と what）と合わない、第 1.5 版の着地から行（t-seat-manners）の着地までの間に P-13.1 を満たさない窓がある、ADR-38 が丙を退けた理由（題は索引）に答えていない、と見た。D-6 は段「確認してから」を数え直して依存の増減と外部の道具の使用が漏れ、句「持ち主の決めの改め」は D-8 と重なる、D-7 は口座の CLAUDE.md の「分岐は明示」と張り合う、D-10 の「緩める問いだけ」は A-2.3 と食い違う、と名指した。係 w312a が席の決めの字で D-6・D-7・D-10・D-12 と P-13.1 を直し、数を測り直し（作法の行の字が替わり byte は 657 増え余りは 183 byte）、ずれの期限（決定 (7)）と ADR-38 への答え（決定 (8)）と在りかだけを写す案（戊）を足した。直した字は席が所見と照らす（D-10・2 巡目の検証役は置かない）。
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo（t3-hub.92.1）か後継の memo の notes に記帳する。問う相手は持ち主。(1)〜(3) の窓の始まりは行（t-seat-manners）の着地の commit の時刻で、窓は 14 日。
    (1) 席が段「いつも守る」の条を取り違えたか、条を引けずに誤った決めをした例が、記帳か持ち主の指摘で 2 件出たら、条の題の一覧を要の写しに戻すかを問い直す（ADR-38 の撤退 (3) を置き換える）。
    (2) 作法の行と同じ決まりが記憶か CLAUDE.md の散文に再び書かれた例が 1 件でも出たら、作法の行の置き場（決定 (2)）を問い直す。
    (3) 要の写しが R-1 − R-41 の 6,000 byte を越えて導出が断られたら、作法の行を縮めるか R-1 を改めるかを問う。
    (4) 憲法 第 1.5 版の着地の日から 14 日を過ぎても行（t-seat-manners）が着地しなければ、版を戻すか行を列の先へ上げるかを問う（決定 (7) のずれの期限）。
plain: |
  席（設計の AI）は、起きるたびに憲法の大事な所を手元に写して読みます。今はそこに「いつも守る」の 28 条の題が並び、どの条を読めばよいかの目次として働いていますが、題だけでは何をすればよいかは決まりません。
  この記録で、その 28 行を外し、代わりに席の振る舞いの決まり（決める係として働く・止まって問うのは決まった種類だけ・ほかは推奨に決めて報告と記帳をする、など 13 行の番号と字）を写します。決まりの正本は規則の表に 1 つだけ置きます。記憶を切っても決まりは残ります。
  失うのは、手元の目次です。条を引く時は全文の写しの file（約 15,000 byte）を読みます。写しは 657 byte 増え、上限までの余りは 183 byte（決まり 1 行に足りない）になります。
