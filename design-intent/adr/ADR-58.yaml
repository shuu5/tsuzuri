# 判断の記録 ADR-58 — 面の見た目の file と語の辞書の file は基として残し、新しい規則と語だけを足す行は行ごとの部品の file に書く
# 判断の記録 ADR-13 の「新しい機能は新しい file だけで足せる形」を、面の stylesheet と語彙へ広げる。
# 起草は係 w198a（2026-10-05）。材料は問いの本文（drafts/w198a/w/q-adr58.md）と係の数え（drafts/w198a/w/notes.md・hot.py・sel.py）。
id: ADR-58
title: 面の見た目の file と語の辞書の file は基として残し、新しい規則と新しい語だけを足す行は、行ごとの部品の file に書く（判断の記録 ADR-13 の新しい file だけで足す形を見た目と語へ広げる）
status: accepted
date: 2026-10-05
context: |
  言付け。面の見た目の基の file（style.css）と語の辞書の基の file（vocab.json）を多くの行が書くので、器の入口の排他（書く file が重なれば 2 本目を起こさない）と席の depends で、面の便がほぼ 1 本ずつ流れる。直近 3 日の着地 116 本のうち 35 本がどちらかを書き、2 つの file が交差した depends の待ちは 32 組・157 時間（待った bead の時間の和）。
  書いた行の多くは足すだけだった（見た目は 30 本のうち 19 本・語は 24 本のうち 20 本）。今の見た目の基の file の頭の注は、面で足した規則を末尾の節だけに置くと決めているが、実際には関係する規則の隣への差し込みが多い。
  語の読みには、同じ欄に 2 度在る鍵を黙って後勝ちにし、英語の欄（english）と言い換えの欄（rephrase）の両方に在る鍵を黙って英語の欄の勝ちにする穴があった（検証役の名指し）。今の vocab.json と 2026-09-20 からの全部の版には、どちらの重なりも無い。
decision: |
  (1) 置き場。面の crate の見た目の基の file（crates/tsuzuri-surface/style.css）と語の辞書の基の file（crates/tsuzuri-surface/vocab.json）は基として残す。新しい当て先の字（selector）だけを足す行は見た目の部品の dir（crates/tsuzuri-surface/style/）に、新しい鍵だけを足す行は語の部品の dir（crates/tsuzuri-surface/vocab/）に、行 id を名にした部品の file を書く（同じ行が 2 つ書く時は、行 id に - と英小文字の語を足す）。
  (2) 順。部品は名の byte の順に、基の後に効く。見た目は、基を頁の雛形（index.html）の link のまま配り、部品は wasm が面を描く前に head の末尾へ見た目の要素（style）1 つとして入れる。語は、vocab() が基と部品の全部を 1 つの表に読む。
  (3) 持ち主。当て先の字（selector・注を除き空白を詰め、カンマで割った 1 つずつ・@media の中も数える）と語の鍵は、基と部品の全部の中で 1 つの file だけが持つ。既にある当て先の字や鍵を直す行は、それを持つ file を書く。基の当て先の字を部品で書き直して上書きの順を替えることはしない。
  (4) 断り。見た目の重なりは、歯が当て先の字と 2 つの file の名を名指して断る。語の重なりは、読みが鍵と 2 つの在りか（file の名と欄）を書いた Err にする。重なりは、1 つの file の同じ欄に 2 度在る鍵（基も部品も）・1 つの file の英語の欄と言い換えの欄の両方に在る鍵・2 つの file に在る鍵の 3 つ。歯は、置き場の全部が読めることを断言する（vocab() は Err の時に空の語彙になるため）。前の「英語の欄を先に引き、同じ鍵が言い換えの欄にも在れば英語の欄が勝つ」は、この決定で置き換える。1 つの file の中の断りは、語彙の鍵の重なりを断る行（g-vocab-dupkey）が先に置く。
  (5) 部品の名は英小文字か数字で始まり、英小文字と数字と - だけ。外れた名は組み立ての script が file の名を書いた Err にする。dir は空にしない（決まりを書いた file を 1 つ置く）。
  (6) 受入の測り（xtask の accept）は、基と部品の和の語彙で見出しを照らす。
  (7) 見た目の基の file の頭の注の「面の crate で足した規則は末尾の節だけに置く」は、この決定 (1) から (3) を名指す字に置き換える。
options:
  - id: a
    name: 甲 — 基を残し、新しい規則と語だけを足す行は行ごとの部品の file に書く
    text: 決定 (1) から (7)。
    verdict: adopted
    reason: 足すだけの行（3 日で見た目の 63%・語の 83%）が 2 つの file を書かなくなり、交差そのものが消える（3 日で 13 組・55 時間）。器を替えず、面の crate と xtask の中の行で済む。器の重なりの判じの改め（別の問い）と重ねると、互いに残す組を消し合う。
  - id: b
    name: 乙 — 2 つの file を全部、部品ごとの file に割る
    text: 基を無くし、見た目は大きな節ごとに、語は鍵の頭ごとに割る。
    verdict: rejected
    reason: 歯 68 本と受入の測りの読みの書き換えと、審査に渡す差の上限を越える移し（3 行以上）が要り、移しの間は面の行と全部交差する。消える待ちは甲より最大 4 組しか増えず、足す行は同じ部品へ足すので割れない。
  - id: c
    name: 丙 — file は割らず、器の重なりの判じだけに任せる
    text: 器の入口が、差が両方の順で当たる組を通す形だけに頼る。
    verdict: rejected
    reason: 同じ所に差し込んだ組（3 日で 17 組）は順が要るので消えず、器の直しとその答えを待つ。消える待ちの 79 時間は、意味の依存を測れない上限。判じそのものは別の問いで扱い、この決定と重ねて使える。
  - id: d
    name: 丁 — 今のまま
    text: 席が重なる行を depends で並べ続ける。
    verdict: rejected
    reason: 並列性を最優先にする持ち主の言に合わない。
basis: [ADR-13, ADR-32, R-25]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、語彙の部品の行（g-vocab-parts）の着地の後の面の行 20 本か 7 日の早い方まで、並列の詰まりの memo か後継の memo の notes に記帳する。問う相手は持ち主。
    (1) 足すだけの行が基を書いた数。足すだけの行の 3 割を越えれば、起草の頼みの字と置く前の照らしを見直す。
    (2) 部品の順か、基と部品の分かれが原因の見た目の崩れ（受入 12 条の測りか持ち主の名指し）。1 件でも出れば、崩れた部品を基へ戻す行を置き、決定 (2) と (3) を見直す。
    (3) 2 つの file の交差による depends の待ちの和。窓の中で、着地の前の 3 日の値 157 時間の 3 分の 1（約 52 時間）を越えれば、乙を問い直す。
plain: |
  面の見た目と語の辞書は、今は 1 つずつの大きな file で、多くの作業が同じ file を書くので、作業が 1 本ずつしか流れませんでした。
  これからは、新しく足すだけの作業は自分専用の小さな file に書き、組み立ての時に決まった順でつなぎます。
  同じ名前の規則や語が 2 つの所に在れば、テストか読みが止めます。既にある規則や語を直す作業は、今までどおりそれを持つ file を書きます。
approval:
  who: 持ち主
  date: 2026-10-05
  ruling: t3-hub.89.1（裁定 id = t3-hub.89.1:20261005T0459Z-1・甲・配達の口・notes に逐語）
  verbatim: "推奨で"
  surface: R-8
consequences:
  - 足すだけの行は 2 つの file を書かず、行どうしの交差が消える。席は、その行のために depends を書かない。
  - 基を直す行どうし（3 日で 4 組・37 時間）と、ほかの file で交差する組（15 組）は残る。
  - 1 つの部品の規則が基と部品に分かれる。読む人は基と部品の dir の両方を見る。
  - 基だけを読む歯（63 file）は部品を見ない。数や無いことの確かさは、決定 (3) と (4) の断りで保つ。
  - 見た目の部品は wasm に入り、配る file の一覧は替わらない。wasm が起動しなければ部品も効かないが、今も body は空で同じ。
  - 部品を足すと面の lib を組み直す。行の verify は面を組むので、増えはほぼ 0。
  - 並べて流した組は、後の行の着地の前に追随の撃ち直しが 1 回増えうる（1 回 4〜6 GB・面の波の間 1 日約 15〜25 GB の見込み）。
note: 起草は係 w198a（2026-10-05）。承認の欄の逐語と経路は、適用の script が台帳の問いの notes の定型行から読んで入れた。
