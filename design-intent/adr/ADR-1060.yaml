  器の承認の欄: 設計 (orchestrator)・orchestrator・2026-09-24 草稿 v5 (裁定の向きを、 gate と land の現物 (検出線の段・撃ち直し・持ち越し・land の終端・主実測の tmp worktree) と SRS v0.21 に合わせて形にし、 fidelity の findings 4 周分を当てた。 拘束する constitution の版 0.5.0)・作成
  器の案の章の要約: 候補を 5 つ並べます。 gate から外して本線に載った後に器が切り離して撃つ案、 gate に残して時間だけ短くする案、 変異検査をやめる案、 実装役 (runner) に自分で撃たせる案、 別の列が本線に載った便を拾って撃つ案です。 却下した 4 案にも利点を並べ、 退けた決め手が user の決定か憲法か分析かを各案に書きます。 gate に残す案は、 審査の時点で結果が揃い器を変えずに済む点で、 やめる案は費用が丸ごと消える点で、 実装役に撃たせる案は同じ便の中で test を直せる点で、 別の列の案は同時に撃つ本数を 1 本ずつに絞れる点で、 選んだ案に勝ちます。
  器の専門語の説明: 本文に出てくる専門語 21 個を、 やさしい言葉で説明します。 この記録で意味を決めた語は「着地後の検出」と「臨界路」の 2 つで、 残りは器の側の言葉です。
  ・検出線（detection line）: 超えたら機械が検知して記録・起票する線。 PR は止めない。 CI が落とす deny 閾値とは区別する。 本 ADR では vessel 宣言の detection-verify の行 (変異の生存を測る xtask mutants-diff・語彙の変異検出線と同じ実体) を指す。
  ・着地後の検出（post-landing detection）: 便が Landed に達した後に、 器が land から切り離した子 process で検出線の行を 1 回撃つこと (本 ADR)。 着地した commit を tmp worktree に出し、 base は着地した commit の親で、 gate と同じ並列の枠と封じ込めの箱を通る。 撃つ前に今の検出線の行と同じ受付札を取る。 結果は record と event に残し、 着地は戻さない。
  ・臨界路（critical path）: 便が着地までに必ず待つ段の列 (runner → gate → land)。 この列に座る段の秒は便 1 本の待ちに足される。 本 ADR は検出線をこの列から外す。
  ・gate（gate）: 便の成果物を独立に検証して Verdict を返す機構。 MVP は契約の verify の実走 + lens 1 本 (SRS FR1008 / FR1009)。 crate の gate module が担う。 歯 (test / lint / CI) とは別の entity。
  ・共通 verify（common verify）: どの便にも共通の deny する検証 (flip check・test・lint・依存監査) を対象 repo の vessel 宣言に置き、 intake が便ごとに凍結した写しを gate が契約 verify の前に撃つもの (C2・ADR-1009 / ADR-1010)。 検出線の行は別の列 (detection-verify・ADR-1021 §2.4) に置き、 契約の verify は便固有の行だけを持つ。
  ・land の終端（land terminal）: 着地の後に器が続ける 3 手 (remote への push・着地 commit の CI の結果の照合・台帳の close) と、 その typed な記帳 (SRS FR1050)。 着地の事実の正本は器の record で、 commit の trailer はそこからの導出面 (ADR-1023 §2.5)。
  ・同じ木の主実測（same-tree main check）: 便が main に着地した直後の検査 (主実測) のうち、 着地する commit の木の sha が gate の verdict の tree と一致する周のもの。 木の sha の一致を gate の測定の再現と見なし、 全段を撃たず record 1 本で残して着地を進める (ADR-1043)。
  ・検出の母集団（detection population）: mutant ごとに走らせる歯の集合 (ADR-1052)。 package の lib の歯と bin の歯と、 契約が名指した歯。 この集合が捕まえない mutant が変異の生存として記録される (C12.4・R-C12-1)。
  ・契約の歯の穴（contract teeth hole）: 宣言 file の検出線の行に置く 4 つ目の穴 {teeth} (ADR-1052)。 器が契約の verify 行から導いた歯の名の列で埋め、 道具は受けた語をそのまま filter に使う。 語が無い周は空を表す閉じた 1 語で埋める。
  ・並列の枠（mutation parallel slot）: host 単位で便の変異検査に配る並列の枠 (SRS NFR1006)。 契約を便にする前の検査の段 (受付) とは別。 置き場は state dir の親の下の host 用 dir で project をまたぎ、 枠 1 組は受付札 1 つで表す (ADR-1021 §2.3)。 器が管理する状態ではなく受付の一時的な印。
  ・封じ込めの箱（confinement box）: 封じ込めが process を閉じ込める memory 上限付きの囲い (systemd-run --user --scope で作る transient scope)。 上限を超えると殺されるのはその中の process だけ (ADR-1021 §2.2・ADR-1040)。
  ・器の健康の遮断器（vessel health breaker）: verify の行を撃つ前に走行可能な process と待ちの process を読み、 閾値と比べて空いている / 混んでいる / 測れないの 3 値を返す境界 (ADR-1050)。 混んだ周は待ち、 待ち切れなかった周は行を撃たない。 行為を止めうるので極性一覧に載る guard。
  ・vessel 宣言（vessel declaration）: 対象 repo の root に marker の隣として置く tracked file .vessel.toml。 その repo の allowlist と共通 verify を repo 自身が名乗る宣言値で、 intake が manifest の上限と突合して便ごとに写しへ凍結する (C10・ADR-1010)。 marker そのものは変えない。
  ・rules 行（rules row）: manifest に置く規則の値 1 行 (閾値・有効/無効・裁定 id・裁定時刻・逐語)。 数値の置き場 (C1) で、 変更の手続きは C5。 変異の生存の極性は R-C12-1 の行が持ち、 本 ADR は行を足さない。
  ・裁定 id（ruling id）: user 裁定を一意に指す id。 器が打った裁定 event の ts (UTC) で、 rules 行の ruling 欄が指す。 rules 行の変更 (C5)、 閾値変更 (A2)、 憲法改訂 (N4) が要求する。
  ・台帳（ledger）: 作業 (issue) と裁定の記録。 実体は beads で、 v2 は自前の台帳を持たない。 本 ADR の着地後の検出の結果は bead の notes と close の行に写さない (C15・FR1050)。
  ・event log（event log）: 1 行 1 出来事を追記する file。 fleet の現在地はこれを replay して導く (C3・SRS FR1003)。 本 ADR の着地後の検出は、 起こした周と終えた周をここに 1 件ずつ記す。
  ・lens（lens）: diff を読んで verdict (PASS / FAIL / INCONCLUSIVE) を返す headless の Claude process (SRS FR1009)。 MVP の gate は lens 1 本。 審査の材料は契約と diff で、 検出線の record は読まない (現物)。
  ・runner（runner）: 契約 1 本を worktree で実装する headless の Claude process (SRS FR1004 / FR1005)。 席ではなく使い捨て。 禁じる語列で変異検査を撃てない。
  ・dispatcher（dispatcher）: 台帳から起動の列を導き、 便の終端の直後・手動の 1 周・介入の印の直後に便を起こし、 gate を通った便を land する器の口 (SRS FR1068 / FR1050)。 周期の timer を持たず、 本 ADR でも変えない。
  ・orchestrator（orchestrator）: 席の唯一の役割。 user と話し、 承認と裁定を受け取り、 契約・設計・落ちる歯を書く。 本 ADR では、 着地後の検出の record を読んで歯を補強する次の契約を起こす。
  器の頁の末: このページは、大もとの機械データ (正本) から自動で組み立てられています。構造は機械が自動で検査し、内容が元データに忠実かは独立のレビューで確かめます。
