  器の承認の欄: 裁定 (user)・user・裁定 id user 2026-09-28T01:44Z (退避を速くし、 進捗を外へ保存するところだけ確実に働かせ、 subagent は止めて再開の側で起こし直す)。 逐語は台帳にだけ在る・裁定済
  器の承認の欄: 設計 (orchestrator)・orchestrator・2026-09-28 草稿 v3 (群の移動で古い口座の 5 時間枠が尽きた事象を現物 (猶予の 1 関数・合図の記録・tick の移動の門・群の段の移動の周と続きの周・状態の打刻と SessionStart の hook) で読み、 turn の終わりの読み方と上限の形を決めた。 拘束する constitution の版 0.5.0)・作成
  器の案の章の要約: 候補を 6 つ並べます。 turn の終わりで即 /exit し猶予は上限にする案 (選んだ案)、 30 分待つ今の形、 猶予を 5 分に縮めるだけの案、 合図と /exit を続けて送る案、 席が「保存した」を器の口で申告する案、 subagent の終わりを process の木で待つ案です。 選ばなかった 5 つは、 古い口座を尽かす・turn が早く終わった席も 5 分待たせる・全ての移動で保存を外の道具の順に任せる・口が増え打刻で足りる・subagent が外から見えない、 がそれぞれの決め手です。
  器の専門語の説明: 本文に出てくる専門語 7 個を、 やさしい言葉で説明します。
  ・応え終えた印（notice turn ended）: 席の状態の打刻のうち、 合図の記録の時刻以後の busy が 1 つ以上在り、 最終行が Stop の idle であること。 合図を受けた turn が終わったことを表し、 作業記憶を書き終えたかは表さない。 本 ADR で真なら猶予を待たずに /exit を送る。
  ・退避の猶予（move grace）: 群が別の口座へ移った席へ器が /exit を送るまでの時間の上限。 rules 行 seat.move_grace_s (整数の秒) が持ち、 本 ADR で値は 300、 起点は合図の記録に書いた時刻。 応え終えた印が真ならそれより前に送る。
  ・退避の合図（evacuation notice）: 群が別の口座へ移った周に古い席の入力欄へ注入する 1 行。 本 ADR で、 新しい subagent を起こさず、 走っている subagent の要旨と出力 file を台帳へ書き、 作業記憶を残して turn を終えるよう案内する字面になる。
  ・合図の記録（notice mark）: 席の状態の dir に置く 1 行の file (移り先の口座・群の記録の時刻か種の印・合図の時刻)。 同じ移動の記録が在れば合図を送り直さず、 応え終えた印と猶予はその時刻から数える。 本 ADR で時刻は両入口とも合図を送る前に取る。
  ・状態の打刻（seat stamp）: Claude Code の hook が席の状態の dir に 1 行ずつ足す記録。 入力を受けて turn が始まると busy、 turn が終わると idle (Stop)、 session が始まると idle (SessionStart・圧縮の後にも打たれる)。 本 ADR で移動の門は /exit を早めるためにだけ読む。
  ・起こし直し（relaunch）: 移動の後や窓が shell に戻った後に、 器が同じ窓で席を起こし、 直前の会話 id を運んで会話の続きから再開すること (ADR-1067)。 初手の字面は本 ADR で落ちた subagent の起こし直しを案内する。
  ・管理 tick（management tick）: 席の外から周期 (rules 行 1 本・既定 15 秒) で回り、 死んだ席を起こし直し、 移動の周に退避を撃ち、 黙った席へ合図を送る仕組み (ADR-1058・ADR-1066)。
