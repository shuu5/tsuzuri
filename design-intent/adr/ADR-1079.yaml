consequences:
  - "この判断で良くなること 3 つと、 代わりに引き受けること 4 つです。 良くなるのは、 合図の turn が終わった次の周に移ること、 上限までは合図の turn が終わるまで /exit を送らず保存と subagent の記帳を書く turn が席に渡ること、 管理 tick と群の段が同じ関数と同じ時刻の取り方で判じ口も行も増えないことです。 引き受けるのは、 裏の subagent が落ちて起こし直しの手間が出ること、 作業記憶を書き終えたかは測らず turn の終わりだけを測ること、 打刻が失われた席は上限の 5 分まで古い口座で動くこと、 上限の周は turn の途中でも /exit が届いて保存が切れうることです。"
  - "良い結果: 席が合図の turn を終えた次の周に新しい口座へ移り、 古い口座を使う時間が「合図の前から走っていた turn の残り + 合図の turn」と上限の 5 分の短い方になる"
  - "良い結果: 上限までは合図の turn が終わるまで /exit を送らないので、 作業記憶と落ちる subagent の記帳を書く turn が席に渡る"
  - "良い結果: tick と群の段は同じ 1 関数で /exit を判じ、 合図の時刻の取り方も揃い、 口も rules 行も増えない"
  - "代償: 裏で走る subagent は /exit で落ち、 途中の出力は file に書いた分しか残らず、 起こし直した席が台帳の記帳から起こし直す手間が出る"
  - "代償: 器は turn が終わったことだけを測り、 その turn の中で作業記憶を書き終えたかは測らない"
  - "代償: 打刻の Stop が失われた席は上限の 5 分まで古い口座で動く"
  - "代償: 印が取れない席と合図の turn が 5 分を越える席には、 上限で turn の途中でも /exit が届き、 保存が途中で切れうる (Claude Code の入力の順に任せる)"
