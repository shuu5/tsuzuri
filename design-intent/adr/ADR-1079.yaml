# 判断の記録 ADR-1079 — 器 scribe2 の判断の記録 ADR-0079 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1079
title: "退避は合図の turn が終わったら猶予を待たずに /exit — turn の終わりを状態の打刻で読み、 猶予は待ち時間から上限へ縮め、 落ちる subagent は台帳の記帳から起こし直す (ADR-1071 と ADR-1073 の待ちの読みを部分 supersede)"
status: accepted
date: 2026-09-28
context: |
  ADR-1071 は群の移動の退避を二段 (合図 → 猶予 → /exit) にし、 席の裏の subagent を落とさないために 30 分待つと決めた。 待つ間も席は古い口座を使い続け、 2026-09-28 に古い口座の 5 時間枠が尽きた。 本 ADR は、 席が合図に応えて turn を終えたと打刻で分かった周に /exit を送り、 猶予は上限へ縮める。
  なぜこの判断が要るのかを、 経緯 (猶予は subagent を落とさないための待ちだった)・事象 (待つ間に古い口座の 5 時間枠が尽きた)・機序 (席が合図の turn を終えたことは状態の打刻で分かる)・これまでの決まりと持ち主の指示・この判断の範囲の 5 つから説明します。 持ち主は、 subagent を落とさないことより古い口座を尽かさないことを先にし、 進捗の保存だけを確実に働かせるよう指示しました。
  CTX1 経緯 — 退避の猶予（/exit までの上限）は subagent を落とさないための待ちだった (ADR-1071・ADR-1073)
  ADR-1071 は群が別の口座へ移った周の退避を二段にした。 古い席へまず退避の合図（移るための席への 1 行）の 1 行を送り、 rules 行 seat.move_grace_s (1800 秒) の猶予を越えた周にだけ /exit を送る。 理由は、 席の turn が先に終わっても裏の subagent は走り続けるので、 すぐ /exit を送ると claude の process ごと subagent が落ちることだった。 移動の周は状態の打刻（席の動作中と待ちの記録）を読まず (打刻が古いまま残ると移動が止まる穴を塞ぐため)、 席の側の作法 (新しい subagent を起こさず今のを待つ) は合図の字面が伝える案内とした。 ADR-1073 は猶予の起点を席に合図を書いた時刻に改め、 同じ移動の合図の記録（合図を送った印）が在る周は残りが在る間は待つとし、 群の段は送達を確認した席ごとにその時の今で記録を書くとした。
  CTX2 事象 — 待つ間に古い口座の 5 時間枠が尽きた
  2026-09-28T01:28Z に群が別の口座へ移り、 合図は同じ分に 4 席へ届いた。 /exit の予定は合図から 30 分後だったが、 その前に古い口座の 5 時間枠が尽き、 3 席は持ち主の求めで orchestrator が猶予 0 の写しで管理 tick（席を周期で見る仕組み） を撃って移した。 30 分の待ちは、 限度に近い口座で席を動かし続ける時間でもあった。
  CTX3 機序 — 席が合図の turn を終えたことは状態の打刻で分かる
  席の状態の打刻は Claude Code の hook が書き、 入力を受けて turn が始まると busy (UserPromptSubmit)、 turn が終わると idle (Stop) を 1 行ずつ足し、 session が始まった時にも idle (SessionStart) を足す。 SessionStart の hook は種を問わず打たれ、 圧縮の後にも打たれるので、 その idle は turn の途中にも現れうる。 合図の時刻を合図を送る前に取れば、 合図を受けて始まった turn の busy は必ずその時刻以後に在り、 その後の最終行が Stop の idle なら合図の turn は終わっている。 合図の前から走っていた turn の busy はその時刻より前で、 その turn の終わりだけでは合図の turn が終わった証拠にならない。 管理 tick は送る前の周の時刻で記録を書くが、 群の段は送達と消費を見届けた後の時刻で書くので、 合図の turn の busy がその時刻より前か同じ秒になり、 この読みが働かない。 この読みにも例外が 2 つ在る — 合図の時刻と送達の間 (送達の待ちの長さ) に別の入力の turn が始まって終わるとそれを合図の turn の終わりと読みうること、 走っている turn に合図を差し込む版の Claude Code では合図の busy が打たれず読みが偽のままになること。 器が測れるのは turn が終わったことまでで、 席が作業記憶を書き終えたかは測れない。 subagent は session の終わりで落ち、 口座を切り替えた後に続きを頼めなかった (2026-09-23 に 1 回実測)。 席の会話は起こし直し（新しい口座で席を再開）で続きから再開する (ADR-1067)。
  CTX4 憲法と既存の決定の向き (本 ADR の解釈)
  C2 (経路は 1 本) から、 /exit の判定は tick と群の段が同じ 1 関数を呼び、 合図の時刻の取り方も両入口で揃える。 C10 (宣言値・実測値・導出値を分ける) から、 猶予は rules 行の宣言値、 turn の終わりは打刻の実測、 判定は導出で、 席の自己申告を証拠にしない。 C17 (決定はしご) から、 既に在る打刻で足りるので申告の口を足さない。 持ち主の指示 (2026-09-28T01:44Z) は、 subagent を落とさないことより古い口座を尽かさないことを先にし、 進捗の保存だけを確実に働かせる向きである。
  CTX5 射程 — 動かすのは /exit の判定と合図の時刻の取り方と猶予の値と字面 2 つ
  動かすのは (1) /exit の判定 (同じ移動の合図の記録が在り、 猶予を越えたか応え終えた印（合図に応え終えた印）が真) を 1 関数にし tick と群の段の続きの周が呼ぶこと、 (2) 群の段が合図の記録に書く時刻を、 席ごとに送る直前に取った時刻にすること、 (3) rules 行 seat.move_grace_s の値を 300 にし上限として読むこと、 (4) 退避の合図の字面 (走っている subagent は落ちる前提で要旨と出力 file の path を台帳へ書く) と起こし直しの初手の字面 (落ちた subagent は台帳の記帳から起こし直す)。 動かさないのは、 合図の記録の形と読み手・手の語・判定の列の順・lock・起こし直しの仕組み・群の記録・要件書。
  （選択肢を測るものさし）この判断を評価する 4 本のものさしです。 古い口座を尽かさないこと (移動が決まったら数分の内に移す)。 進捗の保存に turn を渡すこと (上限までは合図の turn が終わるまで /exit を急がない)。 移動を止めないこと (turn の終わりが取れない席も上限で必ず移す)。 足すものを最小にすること (既に在る打刻と記録を使い、 口と行を増やさない)。
  DR1｜古い口座を尽かさない — 移動が決まったら数分の内に新しい口座へ移す CTX2・CTX4
  DR2｜進捗の保存に turn を渡す — 席が合図の turn を終えるまでは /exit を急がない CTX3・CTX4
  DR3｜移動を止めない — turn の終わりが取れない席も上限で必ず移す CTX1・CTX3
  DR4｜足すものを最小にする — 既に在る打刻と記録を使い、 口と行を増やさない (C2・C17) CTX4・CTX5
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 応え終えた印は「合図の時刻以後に busy の打刻が在り、 最終行が Stop の idle」で、 1 つの関数が判じます。 /exit は「同じ移動の合図の記録が在り、 猶予を越えたか印が真」の周に送り、 管理 tick と群の段が同じ関数を呼びます。 合図の時刻は両方とも合図を送る前に取ります。 打刻は /exit を早めるためにだけ読み、 印が取れない席は上限の 5 分で移ります。 合図と起こし直しの字面は、 落ちる subagent の記帳と起こし直しを案内します。 支えるのは FR1038 (群の逼迫の通知と移動) の根拠と FR1027 (管理 tick) への主張です。
  採用 — OPT1
  器 SHALL 応え終えた印を 1 関数で判じる — 席の状態の打刻のうち、 合図の記録の時刻以後の busy が 1 つ以上在り、 読めた打刻の最終行が event Stop の idle なら真、 打刻が無い・読めない・読めた行が 0・最終行が SessionStart の idle なら偽 (形の外の行は読み飛ばす)。 器 SHALL /exit の判定を 1 関数で判じる — 同じ移動の合図の記録が在り、 猶予の残りが無いか応え終えた印が真なら真。 管理 tick の移動の門と群の段の続きの周 SHALL この 1 関数を呼び、 真の周に /exit を送り、 記録が在り偽の周は tick は待ち群の段は送らない。 合図の記録の時刻 SHALL 両入口とも合図を送る前に取った時刻とし、 群の段は席ごとに送る直前に取った時刻で送達を確認した席に書く。 打刻は /exit を早めるためにだけ読み、 印が偽の周は猶予の上限で /exit が届く (打刻で移動を止めない・上限の周は turn の途中でも送る)。 rules 行 seat.move_grace_s SHALL 値 300 秒の上限とする。 退避の合図の字面 SHALL 新しい subagent を起こさず、 走っている subagent は /exit で落ちる前提で依頼の要旨と出力 file の path を台帳へ書き、 作業記憶を台帳と git に残して turn を終えるよう案内し、 turn が終われば器が /exit を送ること・遅くとも残りの秒の後であることを載せる。 起こし直しの初手の字面 SHALL 移動で落ちた subagent は台帳に書いた要旨と path から起こし直すよう案内する。 合図の記録の形・手の語・判定の列の順・lock・起こし直しの仕組み・群の記録は変えない。 本 ADR は ADR-1071 と ADR-1073 の待ちの読み (supersession の 4 条) を置き換え、 要件書は変えない (FR1038 / FR1027 の範囲)。
  （平易）器は「応え終えた印」を 1 つの関数で判じます。 席の状態の打刻のうち、 合図の時刻以後に busy が 1 つ以上在り、 最終行が Stop の idle なら真です。 打刻が無い・読めない・読めた行が 0・最終行が SessionStart の idle (圧縮の後にも打たれる) なら偽です。 /exit の判定も 1 つの関数で、 同じ移動の合図の記録が在り、 猶予を越えたか印が真なら /exit を送ります。 管理 tick と群の段の続きの周がこの関数を呼び、 記録が在って偽の周は、 tick は待ち、 群の段は送りません。 合図の時刻は、 管理 tick も群の段も合図を送る前に取ります (群の段は席ごとに送る直前)。 打刻は /exit を早めるためにだけ読み、 印が取れない席も猶予の上限で必ず移ります (上限の周は turn の途中でも送ります)。 猶予の規則の行 seat.move_grace_s は上限 300 秒にします。 退避の合図は、 新しい subagent を起こさず、 走っている subagent は /exit で落ちる前提で依頼の要旨と出力 file の path を台帳へ書き、 作業記憶を台帳と git に残して turn を終えるよう案内し、 turn が終われば器が /exit を送ること、 遅くとも残りの秒の後であることを載せます。 起こし直しの初手は、 移動で落ちた subagent を台帳の記帳から起こし直すよう案内します。 合図の記録の形・手の語・判定の列の順・起こし直しの仕組みは変えず、 要件書も変えません。
  （理由）持ち主の裁定 (2026-09-28T01:44Z) は、 移動を速くし、 進捗を外へ保存するところだけ確実に働かせ、 subagent は止めて再開の側で起こし直す、 というものでした。 30 分の待ちは subagent を守りますが、 その間も古い口座を使い続け、 5 時間枠を尽かします。 席が合図の turn を終えたかを知る材料は既に在り、 状態の打刻は turn の始まり (busy) と終わり (Stop の idle) を 1 行ずつ持ちます。 合図の時刻を送る前に取れば、 その時刻以後の busy は合図を受けた turn のもので、 最終行が Stop の idle ならその turn は終わっています。 SessionStart の idle は圧縮の後にも打たれるので数えません。 これで、 turn の終わりが取れる席には合図の turn を渡し終えた後にだけ /exit を送れ、 口も規則の行も足さずに済みます。 値を縮めるだけの形は turn が早く終わった席も上限まで待たせ、 合図と /exit を続けて送る形は全ての移動で保存を外の道具の入力の順に任せ、 席に申告させる形は口を増やして撃ち忘れを残し、 process の木は subagent が見えません。 turn の終わりが取れない席のために猶予は上限として残し、 移動が止まる穴を開けません。 その上限の周は turn の途中でも /exit を送るので、 そこで保存が切れうることは引き受けます。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1038（rationale）: FR1038 (群の逼迫の通知と移動) は移った群の古い席に退避の合図を送り新しい口座で席を起こし直すと書く。 本 ADR は /exit の時刻の根拠 (合図の turn の終わりか上限の早い方) と、 古い口座を尽かさないことを subagent を落とさないことより先にする持ち主の裁定を与える。
  FR1027（claim）: FR1027 (管理 tick) の移動の周は判定の列の順を変えず、 /exit の判定だけを群の段と同じ 1 関数で撃ち、 状態の打刻は /exit を早めるためにだけ読むと主張する。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録は ADR-1071 と ADR-1073 のうち 4 つの条を置き換えます。 /exit は猶予の後という条、 移動の周は打刻を読まないという条と席の作法、 残りが在る周は待つという条、 群の段が送達の後の時刻で記録を書くという条です。 二段の退避の形 (合図が先)・合図の記録の形と起点・手の語・判定の列の順は保ちます。 行き着く原則は「合図の turn の終わりを確かめたら、 すぐ移る。 確かめられなくても、 上限を越えては待たない」です。
  改訂状態: current
  置き換える ADR: ADR-1071, ADR-1073
  置き換えられた: なし (現行)
  部分 supersede で、 置き換えるのは 4 条 — (1) ADR-1071 の「/exit は猶予の後・裏の subagent を落とさない」を「/exit は応え終えた印か猶予の上限の早い方」に改め、 rules 行 seat.move_grace_s の値を 1800 から上限の 300 に改める。 (2) ADR-1071 の「移動の周は状態の打刻を読まない」を「/exit を早めるためにだけ読む (移動を止めるためには読まない)」に改め、 同じ ADR の席の側の作法「新しい subagent を起こさず今のを待つ」を「新しい subagent を起こさず、 走っている subagent は落ちる前提で台帳に記帳する」に改める (合図の字面が伝える案内で規則ではない点は保つ)。 (3) ADR-1073 の管理 tick の分岐 (b) の「同じ移動の記録が在り残りが在る周は待つ」と、 群の段の続きの周の「残りが在る席には送らない」を、 「残りが在っても応え終えた印が真なら /exit」に改める。 (4) ADR-1073 の群の段の「送達を確認した席ごとに今の時刻で記録を書く」を「席ごとに送る直前に取った時刻で書く」に改める。 保つのは、 二段の退避の形 (合図が先)・合図の記録の形と起点 (合図の時刻)・読み手の 1 関数・手の語・判定の列の順・lock、 ADR-1066 の判定の置き場、 ADR-1067 の起こし直し、 ADR-1069 の移り先の鍵と予約、 の全部。
  照会終端 — PRIN-TURN-END-THEN-MOVE-AT-ONCE
  合図の turn の終わりを確かめたら、 すぐ移る。 確かめられなくても、 上限を越えては待たない。
  本 ADR が 30 分の待ち・猶予を縮めるだけの形・合図と /exit の連投・自己申告の口・process の木の見張りを退け、 打刻で合図の turn の終わりを確かめて即 /exit し、 猶予を上限にしたのはこの原則に行き着く (これ以上は遡らない照会終端)。
options:
  - id: "OPT1"
    name: "turn の終わりで即 /exit し、 猶予は上限にする"
    text: |
      同じ移動の合図の記録が在り、 合図の時刻 (両入口とも送る前に取る) 以後に busy の打刻が在って最終行が Stop の idle の周は、 猶予を待たずに次の周で /exit を送る。 印が取れない周は猶予 (値を 300 秒へ縮める) の上限で送る。 判定は 1 関数で tick と群の段が呼ぶ。 合図と起こし直しの字面で、 落ちる subagent の要旨と出力 file を台帳へ書かせ、 そこから起こし直させる。 決め手は持ち主の裁定 (2026-09-28T01:44Z)。
      （平易）席が合図に応えて turn を終えたことを状態の打刻で確かめ、 次の周で /exit を送る案です。 確かめ方は「合図の時刻以後に busy の打刻が在り、 最終行が Stop の idle」で、 合図の時刻は送る前に取ります。 確かめられない席は上限 (30 分から 5 分へ縮める) で移します。 管理 tick と群の段が同じ関数で判じます。 合図の字面で落ちる subagent の要旨と出力の file を台帳へ書かせ、 起こし直した席がそこから起こし直します。 古い口座を使う時間が「合図の前から走っていた turn の残りと合図の turn」と 5 分の短い方になり、 上限までは turn が終わるまで /exit を急がず、 移動は止まらず、 口も行も増えない点で勝ります。 代わりに、 裏の subagent は落ち、 作業記憶を書き終えたかは測らず、 上限の周は turn の途中でも /exit が届きます。 合図の時刻と送達の間に別の入力の turn が終わると、 それを合図の turn の終わりと読みうります。 決め手は持ち主の裁定です。
      利点: 席が合図の turn を終えた次の周 (15 秒) に移り、 古い口座を使う時間が「合図の前から走っていた turn の残り + 合図の turn」と上限の 5 分の短い方になる (DR1)
      利点: 上限までは合図の turn が終わるまで /exit を送らないので、 作業記憶を書く turn を席に渡せる (DR2)
      利点: 印が取れない席も上限の 5 分で移り、 打刻が古いまま残っても移動は止まらない (DR3)
      利点: 上限を安全側に置いても、 turn が早く終わる席は待たない (速さと安全を 1 つの値に負わせない)
      利点: 既に在る打刻と合図の記録だけを読み、 口も rules 行も増えない (DR4)
      欠点: 裏で走る subagent は /exit で落ち、 途中の出力は file に書いた分しか残らない
      欠点: 器が測るのは turn が終わったことだけで、 その turn の中で作業記憶を書き終えたかは測らない
      欠点: 印が取れない席と合図の turn が 5 分を越える席には、 上限で turn の途中でも /exit が届き (ADR-1071 の 1800 秒と同じ扱いで、 値が小さいぶん当たりやすい)、 保存が途中で切れうる。 turn の途中に届いた /exit の順は Claude Code の入力の待ち行列に任せ、 その挙動は測っていない
      欠点: 合図の時刻と送達の間に別の入力の turn が始まって終わると、 それを合図の turn の終わりと読みうる (送達の待ちの長さの窓)。 走っている turn に合図を差し込む版では印が偽のまま上限の経路へ倒れる
    verdict: adopted
    reason: "決め手は持ち主の裁定 (2026-09-28T01:44Z)。"
  - id: "OPT2"
    name: "猶予 1800 秒のまま待つ (今の形)"
    text: |
      合図の後 30 分は /exit を送らず、 裏の subagent の終わりを待つ。 決め手は持ち主の裁定 (待つ間に古い口座を尽かす)。
      （平易）合図の後 30 分は /exit を送らず、 裏の subagent の終わりを待つ今の形です。 subagent を落とさない見込みが最も高く、 器も変えない点で勝ります。 けれども、 待つ間も古い口座を使い続け、 5 時間枠を尽かして席が止まります。 30 分の内に subagent が終わる保証もありません。 持ち主の裁定で退けました。
      利点: 裏の subagent を落とさない見込みが最も高い
      利点: 器を変えない
      欠点: 待つ間も古い口座を使い続け、 5 時間枠を尽かして席が止まる (DR1)
      欠点: 30 分の内に subagent が終わる保証も無い (DR3)
    verdict: rejected
    reason: "決め手は持ち主の裁定 (待つ間に古い口座を尽かす)。"
  - id: "OPT3"
    name: "猶予を 300 秒に縮めるだけ (打刻は読まない)"
    text: |
      rules 行 seat.move_grace_s の値だけを 300 にし、 判定と打刻の扱いは今のまま (合図の後 5 分で /exit)。 決め手は分析 (上限の 1 つの値に速さと安全の両方を負わせる)。
      （平易）規則の行の値だけを 5 分に縮め、 打刻は読まない案です。 変えるのは値 1 つで、 器の code が増えない点で勝り、 移動も遅くとも 5 分で済みます。 けれども、 合図の turn が 30 秒で終わっても 5 分待ち、 その間に届いた別の入力で古い口座の上に新しい作業が始まりえます。 同じ 5 分で選んだ案と違うのはこの点で、 turn の途中で /exit が届きうることはどちらも同じです。 また、 長い保存の turn を切らないよう値を延ばすと全ての移動が遅くなります (選んだ案は値を延ばしても turn が早く終わる席は待ちません)。 退けました。
      利点: 変えるのは rules 行の値 1 つで、 器の code も読む打刻も増えない (DR4)
      利点: 移動は遅くとも 5 分で済む (DR1)
      欠点: 合図の turn が 30 秒で終わっても 5 分待ち、 その間に届いた別の入力で古い口座の上に新しい作業が始まりうる (DR1)。 同じ値 300 で OPT1 と違うのはこの点だけで、 turn の途中で /exit が届きうることは両案で同じ
      欠点: 長い保存の turn を切らないよう値を延ばすと全ての移動が遅くなる (OPT1 は値を延ばしても turn が早く終わる席は待たない) (DR1・DR2)
    verdict: rejected
    reason: "決め手は分析 (上限の 1 つの値に速さと安全の両方を負わせる)。"
  - id: "OPT4"
    name: "猶予 0 で合図と /exit を続けて送る"
    text: |
      合図の 1 行の直後に /exit を送り、 Claude Code の入力の待ち行列に「合図の turn の後に /exit」の順を任せる。 決め手は分析 (全ての移動で保存を外の道具の順に任せる)。
      （平易）合図の直後に /exit を送り、 Claude Code の入力の待ち行列に「合図の turn の後に /exit」の順を任せる案です。 待ちが最短で器の判定が要らない点で勝ります。 けれども、 全ての移動で、 待ち行列で /exit が先に効けば保存を書かずに落ち、 その順の挙動は外の道具の内側にあって版が変わると黙って崩れえます。 選んだ案がこの順に任せるのは、 turn の終わりが取れない席の上限の周だけです。 退けました。
      利点: 待ちが最短で、 器の判定が要らない (DR1・DR4)
      欠点: 全ての移動で、 入力の待ち行列で /exit が合図の turn より先に効けば保存を書かずに落ちる (DR2)。 OPT1 がこの順に任せるのは印が取れない席の上限の経路だけ
      欠点: 順の挙動は外の道具の内側で、 版が変わると黙って崩れうる (DR2)
    verdict: rejected
    reason: "決め手は分析 (全ての移動で保存を外の道具の順に任せる)。"
  - id: "OPT5"
    name: "席が「保存した」を器の口で申告する"
    text: |
      席が合図の turn の最後に器の口を撃ち、 器はその記録を見て /exit を送る。 決め手は分析 (turn の終わりは打刻で足りる)。
      （平易）席が合図の turn の最後に器の口を撃って「保存した」と申告し、 器がその記録を見て /exit を送る案です。 作業記憶を書き終えたことを席自身が言える点で勝ります。 けれども、 口が 1 つ増え、 撃ち忘れた席は上限まで待ち、 自己申告は実測でありません。 turn の終わりは状態の打刻が既に持っています。 退けました。
      利点: 作業記憶を書き終えたことを席自身が言える (DR2)
      欠点: 口が 1 つ増え、 撃ち忘れた席は上限まで待つ (DR3・DR4)
      欠点: 自己申告は実測でなく、 turn の終わりは打刻が既に持つ (C10・C17)
    verdict: rejected
    reason: "決め手は分析 (turn の終わりは打刻で足りる)。"
  - id: "OPT6"
    name: "subagent の終わりを process の木で待つ"
    text: |
      器が claude の子 process を見て、 subagent が走っていなければ /exit を送る。 決め手は分析 (見えない)。
      （平易）器が claude の子 process を見て、 subagent が走っていなければ /exit を送る案です。 subagent を落とさずに待ちを短くできる点で勝ります。 けれども、 subagent は claude の process の内側で走り外から見えず、 見えたとしても長い subagent の間は古い口座を使い続けます。 退けました。
      利点: subagent を落とさずに待ちを短くできる (DR1)
      欠点: subagent は claude の process の内側で走り、 外から見えない (DR3)
      欠点: 見えたとしても、 長い subagent の間は古い口座を使い続ける (DR1)
    verdict: rejected
    reason: "決め手は分析 (見えない)。"
basis: [FR1027, FR1038, ADR-1058, ADR-1066, ADR-1067, ADR-1069, ADR-1071, ADR-1073]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「席」は人と AI が話す 1 つの session、 「群」は同じ口座の候補を共に使う project の集まり、 「退避の合図」は群が別の口座へ移った周に古い席へ送る 1 行、 「猶予」は合図から /exit までの時間です。 前の決定 (ADR-1071) は、 席の裏で走る subagent を落とさないために、 合図の後 30 分待ってから /exit を送ると決めていました。 けれども待つ間も席は古い口座を使い続け、 2026-09-28 に古い口座の 5 時間枠が尽きました。 この記録は、 席が合図に応えて turn を終えたことを状態の打刻で確かめたら、 30 分を待たずに次の周で /exit を送ると決めます。 器が確かめるのは turn が終わったことだけで、 作業記憶を書き終えたかは確かめません。 30 分の待ちは確かめられない席のための上限として残し、 5 分に縮めます。 裏の subagent は落ちる前提にし、 合図の中で依頼の要旨と出力の file を台帳へ書かせ、 起こし直した席がそこから起こし直します。
