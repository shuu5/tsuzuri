# 判断の記録 ADR-69 — 契約の審査の材料は、項目を持つ行の審査の時だけ base の commit の code の索引を組んでから組み、組みの書きは役の一致を一時 file に書かない形で下げる
# 要件 FR1108 の「契約の審査の材料は在る索引を読むだけで索引を作らせない」を改める。器の判断の記録 ADR-1105（器の ADR-0105 の写し）の本文は替えない。
# 起草は設計の席（2026-10-06）。材料は係 w281a の notes と evidence（穴 D）、係 w286a の notes と cost.md（案ごとの組みの回数と書き）、係 w285a の evidence（器の workspace を入れた組みの測り）、台帳の問い t3-hub.87.32.3 の本文と裁定。
id: ADR-69
title: 契約の審査の材料は、項目を持つ行の審査の時だけ、審査の木と同じ base の commit の code の索引を組んでから組み、組みの書きは役の一致の出力を一時 file に書かない形で下げる（要件 FR1108 の審査は索引を作らせないの句を改める）
status: accepted
date: 2026-10-06
context: |
  器は契約の審査の材料に、行ごとの code の使われ方の表（index.txt・項目ごとの参照・呼び手・構築・match・歯・可視性・ほかの行と write-set の外の印）を入れる（要件 FR1108・器の判断の記録 ADR-1105）。要件 FR1108 は「契約の審査の材料は在る索引を読むだけで索引を作らせない」と書く。器の過去の材料 28 本は、索引が無い 19・作り中 1・組みの失敗 4・空 2・表 2 で、審査役は表をほぼ読めなかった（V・係 w281a）。
  持ち主は、設計と審査が既存の code を読まずに行を書き判じる事を落ちの元と見ている（memo t3-hub.87.32・t3-hub.91）。同じ日に、tsuzuri で索引を名乗る行（t-index-on）が着地し、索引の穴（役の列が空・器の workspace が索引の外）を塞ぐ行（v-index-paths）と、行の差の file が替える定義を項目にする行（v-patch-items）を置いた。
  契約の審査は受付の直後に同じ process で撃たれ、審査の木は受付の base（anchor の HEAD）と同じである（V・係 w286a）。組みは 1 回 約 70 秒・正味の書き 約 0.65 GB で（V）、そのうち役の一致の一時 file が 約 0.48 GB（V）。器の workspace を入れた後は 約 135 秒・約 0.91 GB（V・係 w285a）。今の行は項目を持たないので組みは 0 回で、行が項目を持つと審査の base ごとに 1 回、10-05 の速さで 1 日 59 回になる（I）。
decision: |
  (1) 組む時。契約の審査の材料を組む周は、行が項目（宣言の touches・節の名指し・差の file が替える定義）を 1 つ以上持ち、審査の木と同じ base の commit の索引が無いか作り中の時に限り、要件 FR1107 の組み立ての 1 本で索引を得てから表を組む。作れなかった記録の在る索引は撃ち直さず、無いことを 1 行で名指し、判定は止めない。項目を持たない行のためには組まない（表が空なので材料の本文は同じ）。
  (2) 使い回し。受付と同じ鍵の置き場を使い、同じ base の 2 本目の審査と受付は組まずに読む。
  (3) 書きを下げる。役の一致の道具（ast-grep）の出力を一時 file に書かず、組みの中で流れのまま読む器の行を、(1) の行の後に置く。
  (4) 要件。要件書の FR1108 の shall と plain の「契約の審査の材料は在る索引を読むだけで索引を作らせない」を (1) の字に改める（要件書の版を上げる）。
options:
  - id: a
    name: 甲 — 項目を持つ行の審査だけが組み、続けて一時 file を書かない行を置く
    text: 決定 (1) から (4)。
    verdict: adopted
    reason: 今の書きは 0 GB のまま、項目を持つ行の審査にだけ表が届く。審査の木と索引の commit が同じなので site と外の印がずれない。上の値は (3) で下げる。
  - id: b
    name: 乙 — 甲の (1)(2)(4) だけを置く
    text: 一時 file の行を置かない。
    verdict: rejected
    reason: 上の値が 1 日 約 38 GB（器の workspace を入れた後は 約 54 GB）のまま残る（I）。
  - id: c
    name: 丙 — 置かない
    text: 要件 FR1108 のまま、審査は在る索引を読むだけ。
    verdict: rejected
    reason: 審査役は code の使われ方を読めないまま残る。
  - id: d
    name: 便の実装の木で gate の時に組む・main の commit ごとに裏で組む・鍵を code の入力に絞る
    text: 係（w286a）の費えの表（cost.md）の案 乙・戊・丁。
    verdict: rejected
    reason: gate ごとに組むと上の値が 1 日 約 148 GB、main の commit ごとに裏で組むと 約 105 GB（I）。鍵を絞ると、入力の外の file が替わった周に古い表を読む。
basis: [ADR-1105, FR1108, FR1107, FR1049, NFR1006]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo（t3-hub.87.32）か後継の memo の notes に記帳する。窓の始まりは (1) の器の行（v-index-review）の着地の commit の時刻である。問う相手は持ち主。
    (1) 索引の組みの正味の書きが 1 日 20 GB を越える日が 3 日続いたら、組む行を絞るかを問い直す。
    (2) 組みの待ちのために契約の審査の段の秒の中央が、着地の前の 7 日の中央の 2 倍を越えたら、組みの時機を問い直す。
plain: |
  契約の審査役に渡す code の使われ方の表は、今ほぼ毎回「索引が無い」の 1 行でした。審査の時に索引がまだ無ければ、その場で組んでから表を渡します。組むのは、行が触る型や関数（項目）を持つ時だけです。組みは 1 回 約 1〜2 分で、SSD に 約 0.65〜0.9 GB を書くので、組みの中の一時 file を書かない形に直して書きを下げます。
grill:
  when: 2026-10-06
  who: 起草係 w286a（AI・案ごとの組みの回数と書きの表）
  where: 起草の置き場の w286a の cost.md と notes.md の 2 節と 6 節
  summary: 失うのは、項目を持つ行の審査が新しい base で 40〜135 秒待つ事と、行が項目を持つほど増える SSD の書きである。上の値は甲だけで 1 日 約 38〜54 GB、一時 file を書かない形で 約 18 GB の見込み（I・撃っていない）で、撤退の条件 (1) で見張る。
approval:
  who: 持ち主
  date: 2026-10-06
  ruling: "t3-hub.87.32.3（裁定 id = t3-hub.87.32.3:20261006T0424Z-1・甲・配達の口・notes に逐語）"
  verbatim: "どちらも推奨で良い"
  surface: R-8
consequences:
  - 項目を持つ行の契約の審査役は、code の使われ方の表（呼び手・読み手・歯と write-set の外の印）を読める。設計の係と席と審査役が同じ表を見る。
  - 行（v-patch-items）の着地の後は、差の file を持つ行は全部項目を持つので、組みは審査の base ごとに起きる。1 日の書きは撤退の条件 (1) で数える。
  - 組みは受付の枠を 2 job 分取る（行 v-index-paths の箱）。組む間は受付の枠が 1 つ減る。
  - 要件 FR1108 の審査は索引を作らせないの句は、項目を持たない行のためには作らせないの句に縮む。
note: 起草は設計の席。承認の欄の逐語は台帳の問いの notes の定型行から写した。器の行（v-index-review）の試作と歯と噛みと床は係 w286a、一時 file を書かない行は後に起草する。
