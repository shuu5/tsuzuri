# 判断の記録 ADR-60 — 器の入口の排他を、差の file が両方に在り再 gate の面の中だけで交わりどちらの順でも当たり同じ名を足さない組は通す形に改め、重なりを避けるためだけの順の決まりを書かない
# 判断の記録 ADR-1019 の §2.1 と §2.3 の一部を置き換える（ADR-1019 の本文は替えない・ADR-1019 の撤退の字のとおり後継の記録で替える）。
# 起草は係 w205a（2026-10-05）。材料は問いの本文（係 w197a の起草・検証役 qv184 の攻めと照らし直し）と係 w196a の測り。
id: ADR-60
title: 器の入口の排他を、差の file が両方に在り、再 gate の面の中だけで交わり、どちらの順でも当たり、同じ名を足さない組は通す形に改め、重なりを避けるためだけの順の決まり（depends）を書かない（判断の記録 ADR-1019 の §2.1 と §2.3 の一部を置き換える）
status: retired
date: 2026-10-05
superseded_by: ADR-84
context: |
  言付け。便が同時に走る本数の時間の平均（並列度）は、直近 3 日（10-02〜10-04）で 1.15、10-05 の 0〜13 時で 1.3 だった。器が許す同時走行の最大値は 16 本で、便はほぼ 1 本ずつ流れていた。
  待った bead の時間の和は 3 日で 385 時間で、うち依存の待ちが 360 時間（連鎖が 282 時間・73%）、入口の排他による重なりの待ちは 2.6 時間だった。後の行の差が単独でも両順でも当たり、書く file が交わる依存の組は 22 組・90.1 時間（意味の依存かは字の当たりでは分からない）。この組の時間の約 95% は器の外の file（多くは面の crate の見た目の file と語の辞書の file）で交わっていた。
  判断の記録 ADR-1019 は、着地での衝突の解きが高いので入口の排他を選び、単位を file にした。git は同じ file の離れた差を自ずと合わせるので、file の単位では当たる組まで断る。席は断りを避けて順の決まりで行を並べ、鎖が伸びた。重なりで待った 3 日の 6 組は、全部が差の file を持ち、全部が両順に当たった。
  着地の時に主の枝（main）が進んでいれば、器は積み直して追随の再 gate を撃つ。ただし再 gate を撃つ path の範囲（再 gate の面・器の検出の範囲の定数と宣言の入れ子の crate の根の和）は、tsuzuri では器の dir を含まない。そのため判断の記録 ADR-33 の決定 (12) が、器を書く便を同時に 1 本までにしている。
  差の file 177 本のうち着地を見つけた 162 本で、実装役が差の file の名指す file に差の外の行を書かなかった行は 153 本（94%）だった。
  持ち主は、開発の速さが最も大事で、ディスク（SSD）の問題を片付けたら並列性を最優先にすると言った。
decision: |
  (1) 通す組。入口の排他は、次を全部満たす 2 本の組だけを通す。交わる path が全部 file で、全部が再 gate の面の中に在る（器が追随の再 gate を撃つかを決める関数と同じ 1 本で照らす）。両方の契約が、契約表の行の新しい型の欄（差の file の欄）で差の file を名指す。両方の差が、交わる path を全部書く。面の外の path（今は器の dir の全部・根の歯の dir・契約表の dir・設計の文書の dir・設計意図の dir ほか）・dir の項・差に無い path・差の file の無い契約が 1 つでも在れば、今のまま断る。面の中の path だけが、積み直しの後に検査を撃ち直す受け皿を持つからである。器の行（v-roots）の着地で器の crate の dir が面に入ると、この条件は字を替えずに器の crate にも広がる。
  (2) 判じ方。器はその周の主の枝の先端を、repo の外の一時の索引（index）に読み、差を索引に当てる命令を 4 通り撃つ（候補だけ・相手だけ・候補の後に相手・相手の後に候補）。全部が通る時だけ通す。相手が 2 本以上なら、相手の差を起こした順に積んだ木にも候補が当たること。相手の差は、相手の便の起点の木（base）の file を読む。両方の差の足す行が同じ宣言の名を足す組も断る。名は、言語の Rust の関数・型・定数・mod の名、JSON の鍵の道（根からの鍵の列）、CSS の最上段の規則の選び手の字の全部とする。名は字で拾い、拾いすぎた時は断る側に倒れる。一時の索引と物（object）は repo の外に置き、周ごとに消す。読めない・当たらない・時間切れの周は断る側に倒す。
  (3) 置き場。判じは、純な交わりの関数の中でなく、入口と起動の列がその関数の後に呼ぶ 1 本の関数に置く。行の予約の照らしと、回答で書く file の列を広げる周の照らし直しは、file の交わりのまま替えない。入口と起動の列の間に主の枝が動いて判じが割れたら、入口の判じが勝ち、受付の断りとして今の口で記帳する。兄弟の待ちは替えない。
  (4) 理由の型と記帳。待ちの理由の重なり（Overlap）に、判じの結末を閉じた列で添える。列は 5 つで、差の file が無い（no-patch）・面の外（outside-face）・当たらない（not-commuting）・同じ名（same-name）・読めない（unreadable）。通した組は、器の出来事の記録（event）に 1 行記帳する（2 つの bead・交わった file・主の枝の先端）。その組の後の着地では、積み直しの衝突・撃ち直しの間に主の枝がまた動いた周（stale）・追随の再 gate の不合格・着地の列の候補の木の赤を分けて記帳し、着地の差と差の file の行の差の数も添える。
  (5) 入り切り。通すかどうかは規則の行 1 つ（器の規則の表の pipe.overlap_commute・真偽・値は裁定 id 付き）が持つ。断る行を緩めるので、真にする前に条 A-2.3 の検証を置く（条 P-17.4）。検証の記録はこの記録の grill の欄に添えた。規則の行は偽の値で入れ、(4) の記帳が着地した後の器の行で、この記録の裁定の id を引いて真にする。撤退は値を偽に戻す 1 行で済む。
  (6) 壊れ方の受け皿。着地までに主の枝が動けば積み直し、衝突すれば実装役を起こし直す（判断の記録 ADR-1019 の §2.2 のまま）。字は当たっても組めない物は、主の枝に入る前に、追随の再 gate（歯と審査役）か、着地の列の候補の木の検査（共通の検査と各便の契約の検査・審査役は撃たない）が落とす。衝突を道具に解かせることはしない。審査役だけが拾う食い違いは、着地の列に乗った周には拾われない。
  (7) 差の file の欄。差の file の path は、契約表の行の型の欄に持つ。散文の検査の行（verify）を判じの材料にしない。欄を足す行は、器の欄の写しを同じ行で直す。
  (8) 席の作法。席は、次を全部満たす 2 つの行の組に順の決まりを書かない。(a) 両方が差の file を持つ。(b) 後の行の差が、前の行の差の無い主の枝に単独で当たり、両順にも当たる。(c) 前の行の差が足す宣言の名を、後の行の差が使わず、同じ名（JSON は鍵の道・CSS は最上段の規則の選び手の字の全部）も足さない。(d) 交わる file が全部 (1) の面の中に在る（今は器の file と根の歯の dir ほかで交わる組が外れ、器の行（v-roots）の後は器の crate も入る）。(b) と (c) と (d) は、席が行を置く前の照らしの道具（読むだけ・SSD をほぼ使わない）が字で照らし、通らない組には順の決まりを書く。順の決まりを外した組は、起票の時に後の行の bead の付記（metadata）に印（omitted-dep）と前の行の bead を書く。作法は、器の行の着地を待たずにこの記録の発効から始める。排他の下では 2 本が同時に走らないので、追随は増えない。
  (9) 置き換え。判断の記録 ADR-1019 の §2.1 の「交差する契約を受け付けない」は、(5) の規則の行が真の周に (1) と (2) を通す組を除く形に置き換える。同じ §2.3 の「交差を入口で避ける」は (8) に置き換える。計画役が書く file の列を構造の連鎖で設計する事と、手で合わせる道を持たない事は替えない。ADR-1019 の本文は替えない。
  (10) 器を書く行は、判断の記録 ADR-33 の決定 (12) の 1 本の決まりの列に入る。
options:
  - id: a
    name: 甲 — 今のまま
    text: 何も替えない。
    verdict: rejected
    reason: 席が重なりのための順の決まりを外しても、同じ file の行は排他で 1 本ずつに戻り、鎖の待ちが重なりの待ちに替わるだけである。並列性を最優先にする持ち主の言に合わない。
  - id: b
    name: 乙 — 排他だけ改める
    text: 決定 (1) から (7) と (9) のうち §2.1 の分だけ。席の作法は替えない。
    verdict: rejected
    reason: 順の決まりが残るので、縮む待ちは重なりの分だけになる（3 日 2.6 時間・待ちの和の 0.7%）。
  - id: c
    name: 丙 — 排他を改め、重なりを避けるためだけの順の決まりを書かない作法を同じ記録に置く
    text: 決定 (1) から (10)。
    verdict: adopted
    reason: 縮む待ちの大半（和で 3 日 約 88 時間・23%・器の行（v-roots）の後は 約 93 時間）は、器の改めと作法を組にした時にしか出ない。書きの増えの見込みは 1 日 20〜30 ギガ（GB）で今の 3〜7% であり、撤退は規則の行 1 つを戻すだけで済む。
  - id: d
    name: 丁 — 丙に先回りを足す
    text: 順の決まりの後の行を、前の行の gate の通過の時点で前の行の枝の上で起こし、着地の列で順に着地させる。
    verdict: rejected
    reason: 足して縮む待ち（3 日 24.6 時間・6%）が小さいのに、書きが 1 日 最大 108〜222 ギガ（GB）増える。前の行の落ちる率が分からないので、丙の効きを 3 日測ってから改めて問う。
basis: [ADR-33, ADR-1019, P-17.4, A-2.3]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、便の直列の詰まりの memo（t3-hub.89）か後継の memo の notes に記帳する。数える材料は、器の出来事の記録の (4) の行と、着地と審査の記録と、bead の付記の印（omitted-dep）である。窓は 7 日で、毎日の始めに前の 7 日を数え直す。問う相手は持ち主。
    (ア) (4) に記帳した組の後に着地する便が、積み直しの衝突・追随の再 gate の不合格・着地の列の候補の木の赤のどれかに当たった数（原因は問わない）が、7 日に 2 本以上になったら、規則の行を偽に戻して問い直す。撃ち直しの間に主の枝がまた動いた周（stale）は別に数えて報告する。
    (イ) 通した組の追随の撃ち直しの書きが、3 日の平均で 1 日 80 ギガ（GB）を越えたら問う。
    (ウ) 印（omitted-dep）を持つ便の gate か審査の不合格（原因は問わない）が、7 日に 2 本以上になったら、照らしの道具に照らしを足すか作法を戻す。
    (エ) 規則の行を真にした器の行の着地から 3 日の時点で、同じ数えの道具で、(4) の記帳に載った組の数・器の外の行で順だけで交わる順の決まりの待ちの和（0 に近づくか）・面の行の起票から着地までの中央を測って報告する。これは撤退でなく報告である。
plain: |
  これまで器は、同じ file を書く作業を同時に走らせませんでした。git は同じ file の離れた所の変更を自ずと合わせられるので、合わせられる組まで止めていました。
  これからは、両方の作業が変更の下書き（差の file）を持ち、自動で検査をやり直す範囲の file だけで重なり、どちらの順でも当たり、同じ名前を足さない組なら同時に走らせます。それでも組めない時は、着地の前の検査が後の作業 1 本を落とします。
  席は、重なりを避けるためだけの順番の決まりを書かなくなります。外した時は印を残し、落ちる作業が増えたら元に戻します。切り替えは規則の行 1 つで、戻すのも 1 行です。
grill:
  when: 2026-10-05
  who: 検証役 qv184（AI・起草者と別の独立の文脈・読み取りだけ）
  where: docs/grill/2026-10-05-Q-parallel-exclusion-grill.md
  summary: 検証役 qv184 が問いの初版を反対側から攻めた。致命は 1 つで、再 gate の面の外の path では、組めない物を主の枝の前に落とす受け皿が無かった（面の中の path だけを通す形に直した）。ほかに待ちの和と割合・書きの見込みの式・撤退の数え方・同じ名を足す組（語の辞書の鍵の上書き）など要直しが 9 つ、軽い物が 4 つ在り、第 2 版で全部を映した。照らし直しでは、今日の重なりの組が根の歯の dir の file で交わる事と、語の辞書の鍵を字のまま拾うと項目を足す組を全部断る事を名指し、出す前に直した。数は全部が式と記録に合い、推奨の筋は崩れなかった。
approval:
  who: 持ち主
  date: 2026-10-05
  ruling: t3-hub.89.2（裁定 id = t3-hub.89.2:20261005T0513Z-1・案 C・tool の呼び・notes に逐語）
  verbatim: "推奨で"
  surface: R-8
consequences:
  - 器の外の file（多くは面の見た目の file と語の辞書の file）で順だけで交わる行が並び、縮む待ちは和で 3 日 約 88 時間である。和であって壁の時計の時間ではない。今日のような器の行の波には、器の行（v-roots）の着地の後から効く。
  - 同時に書いた 2 本が組めない時は、着地の前の検査で後の便 1 本を失う（ディスクの書き 約 7〜11 ギガ（GB）・トークン 約 225 万）。
  - 並んだ組の追随の撃ち直しで、ディスクの書きが見込みで 1 日 20〜30 ギガ（GB）増える（上の縁は 50〜130 ギガ・今は 1 日 約 450〜720 ギガ）。
  - 照らしで見落とした意味の依存（後の行の歯が前の行の振る舞いを前提にする等）で、後の行が先に走って gate で落ちる便が出うる。印（omitted-dep）で数え、撤退の (ウ) で戻す。
  - 並びが増えると、撃ち直しの間に主の枝がまた動く周が増え、追随の上限（pipe.follow_retries の値 2・衝突と合わせて数える）で落ちる便が増えうる（分からない）。
  - 器の中に file の型ごとの名の拾いが入る。ほかの project でも、拾いすぎは断る側なので安全側に倒れる。
  - 判じの費用は小さい。同じ当て方で約 150 組を 7 秒・書き 2 メガ（MB）で撃てた。
  - 要件書の入口の排他・便の自動起動・行の予約の要件と、入口の排他の受入の基準を、この記録に合わせて改める。
note: 起草は係 w205a（2026-10-05）。承認の欄の逐語と経路は、適用の script が台帳の問いの notes の定型行から読んで入れた。
