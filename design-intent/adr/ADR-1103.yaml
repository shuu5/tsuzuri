# 判断の記録 ADR-1103 — 器 scribe2 の判断の記録 ADR-0103 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1103
title: "契約表の行は設計の PR を main に入れる前に行の審査を通し、 審査か gate で落ちた行は行の予約で順番を守り、 同じ設計の兄弟の行を直しが入るまで待たせる — 先撃ちは退役する"
status: accepted
date: 2026-09-30
context: |
  契約の審査は、 契約が起動の列に並んで便が起きた後に在る。 設計の穴はそこで初めて見つかり、 落ちた行は列から外れ、 同じ file を触る後ろの行が先に起きる。 事前に撃つ先撃ちは審査の層になっておらず、 判定の使い回しは 1 度も起きていない。 本 ADR は、 審査を設計の PR の段 (列に並ぶ前) へ移して merge の門で止め、 それでも落ちた行は触る file を取り置いて順番を守り、 同じ設計から出た兄弟の行を待たせ、 先撃ちを退役させると決める。
  なぜこの判断が要るのかを 4 つから説明します。 便の失敗の大半が設計の側にあり、 審査が列に並んだ後に在るという経緯・落ちた行の file が誰のものでもなくなり、 兄弟の行を止める口が無いという現物・先撃ちが審査の層になっておらず使い回しが当たらないという実測・決める範囲です。
  CTX1 経緯 — 便の失敗の 96 % は設計の側で、 審査は列に並んだ後に在る
  2026-09-28〜09-30 に起きた便 165 本のうち、 FAIL か判断不能 (INCONCLUSIVE) は 76 件 (契約の審査 46・gate 30) で、 73 件の根は設計の側だった (code の事実の誤り 32・done の項目に落ちる歯が無い 24・設計の中の食い違い 9・書き足りない 8)。 runner の誤りが主因は 2 件、 環境 1 件、 審査役の誤りは 0 件。 契約の審査 (SRS FR1049) は、 設計の PR を merge して行が起動の列に入り、 便が起きた後の Reviewed の段に在る。 そのため設計の欠陥は便の中で初めて見つかり、 審査は 1 周に穴を 1〜3 個しか名指さないので、 同じ行が 2〜4 周する (1 行で 4 周・55 分)。 持ち主は 2026-09-30 に、 審査で落ちた行が後ろに回り他の行が前に回るのは依存と優先度の順を崩すと指摘した。
  CTX2 現物 — 落ちた行の file は誰のものでもなくなり、 同じ欠陥の兄弟を止める口が無い
  起動の列は、 直前の便が終端に着き契約の中身が変わらない行を列外 (Settled) にする。 列外の行の write-set は交差の相手に数えず、 交差を測る相手は live な便と同じ周に起こした便だけである。 そのため落ちた行が直るまでの間と、 直って列に戻った行が待つ間に、 同じ file を触る後ろの行が起きる。 2026-09-30 に、 2 回落ちた P2 の行の直しの間に同じ P2 の別の行が起き、 直った行はその行の終わりを待った。 同じ設計の PR で書いた兄弟の行は、 先の行が同じ指示で落ちた 4 秒後に起こされ、 同じ理由で落ちた (直しは 53 分後)。 merge の門 (SRS FR1092) は本文の trailer だけを読み、 行の中身を見ない。 gh の pr merge は head の sha を固定する flag (--match-head-commit) を持つ。 vessel 宣言の任意 key の読み手は、 どれも git で commit の宣言を読み、 作業ツリーの宣言を読まない。
  CTX3 先撃ち — 審査の層になっておらず、 使い回しは構造上当たらない
  先撃ち (依存を待つ行に事前に撃つ契約の審査・設計 dispatcher.md §27) は、 契約の審査で落ちた 46 件のうち 9 件にしか撃たれておらず、 そのうち 6 件は FAIL か判断不能を出したまま起動した (判定が起動を止めない)。 依存の無い行と再受付の便の 34 件には原理的に届かない。 判定の使い回しは全期間で 0 件で、 使い回しの口が在った窓の契約の審査 61 回でも 0 回だった。 理由は、 先撃ちの材料に予想の印の行が必ず入ること (114 本中 114 本)、 宣言だけの祖先は着地で変える既存の file を予想に写さず新しい file を空で置くので祖先の着地で材料が変わること、 lens の cmd に binary の置き場の path が入り 56 時間で 18 回変わったこと。 印を外しても材料が全部同じだったのは 20 回中 1 回で、 使い回すと先撃ちの見逃し (同じ版の PASS 11 回中 2 回を本番が FAIL にした) が素通りする。 費用は 09-28 以後 114 本で約 54.5 ドル (契約の審査の 41 %) で、 便の消費の記録に載らない。 lens の上限の値を 0 にしても、 先撃ちの一時の木と材料の組み直しは毎周撃たれる。
  CTX4 射程 — 審査の時点・merge の門・列の順・先撃ちの扱いを決め、 審査役の道具は別の決定に任せる
  決めるのは、 (1) 契約表の行を足す・変える設計の PR の head で、 変わった行ごとに機械の検査と契約の審査を撃つ口と、 その記録の形、 (2) merge の門がその記録を見て止める形と、 門に加わる repo の名乗り、 (3) 契約の審査の段が記録を使い回す条件、 (4) 先撃ちの退役の段、 (5) 落ちた行の行の予約（落ちた行の取り置き）と兄弟の行の待ち。 審査役に読みだけの道具を渡し作業場所を HEAD の写しにする形は、 同じ program の別の決定に任せ、 行の審査（merge 前の審査）の実装はその決定の実装の後に起こす。 SRS の FR1049・FR1068・FR1092 の字は追加の round で直し、 実装の行はその後に起こす。 ADR を書く条件のうち 1 (C10・C17.2・N1 の解釈)・3 (記録の形・跨版)・4 (却下案を残す価値) に当たる。
  （選択肢を測るものさし）この判断を評価する 7 本のものさしです。 設計の穴を列に並ぶ前に止めること。 落ちた行が在っても列の順を崩さず、 待ち合いの輪を作らないこと。 同じ欠陥の兄弟の行を続けて落とさないこと。 同じ審査を 2 度撃たず、 見逃しを素通りさせないこと。 仕組みを足す前に消す仕組みを名指すこと。 消費側の repo を黙って変えず、 公開の repo の CI に口座を置かず、 席の入力欄への差し込みを増やさないこと。 判定できないことを、 そのまま通ることに倒さないことです。
  DR1｜設計の穴を列に並ぶ前に止める — 便の中の審査と gate の FAIL の周回を減らす CTX1
  DR2｜列の順 (依存・優先度) を、 落ちた行が在っても崩さず、 待ちの輪を作らない CTX1・CTX2
  DR3｜同じ欠陥を持つ兄弟の行を連鎖させない CTX2
  DR4｜同じ審査を 2 度撃たない — 撃ち直さない鍵は判定に効く入力の全部で取り、 見逃しを素通りさせない CTX3
  DR5｜足す物の前に消す物を名指す (C17.2) — 口 1・on-disk の形 2・任意 key 1・門の断りの語 6・待ちの理由 2・rules 行 1・lens の flag 1 を足し、 先撃ちの module の残り・lens の --stage prelens・先撃ちの置き場の形 1・rules 行 2・使い回しの読み口 1 を消す。 event の種類は足さない (C17) CTX2・CTX3・CTX4
  DR6｜消費側の repo を黙って変えず、 PUBLIC の repo の CI に口座を置かず、 席の入力欄への差し込みを増やさない CTX4
  DR7｜測れないを通すに倒さない (C10) — 予想の審査と partial の判断不能を merge で通すのは、 その記録が契約の審査の段で写されず、 祖先の着地の後の契約の審査が実物で測り直して今どおり止めるからで、 測れないまま効く判定にはしない。 宣言や記録を読めない周は門を断る側に倒す CTX2・CTX4
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 設計の変更を main に入れる前に、 変わった行ごとに機械の検査と審査役の審査を撃ち、 判定に効く入力の全部を鍵にして記録します。 名乗った repo の merge の門は、 先端を固定しない merge・審査が通っていない merge・審査の後に main で行が動いた merge を止めます。 便の中の審査は、 鍵が同じ実物の合格の記録だけを使い回します。 落ちた行は触る file を取り置き、 兄弟の行を待たせ、 先撃ちは 2 段でやめます。
  採用 — OPT1
  器 SHALL 契約表の行を足す・変える設計の PR の head で行の審査を撃つ口 (pipe review --ref) を持つ。 口は head と origin/main の merge-base の間で行の digest（行の中身の指紋） (受付と同じ生成の契約の字の hash と、 実装する設計の節の本文の hash の対) が変わった行のうち、 指す bead が無いか 1 本でも closed でない行ごとに、 受付と同じ機械の検査と、 契約の審査と同じ lens を読みだけの形で 1 回撃つ。 判定は判定の鍵 (行の digest・材料の鍵・code の木の鍵・basis・祖先ごとの状態・lens の子が自ら出す lens の版) ごとに state dir の記録 (schema 1) に残し、 同じ鍵の行は撃ち直さず、 head ごとの結果を 1 語 (pass・fail・pending・stale) で残す。 口は前面で最後まで走り、 席の入力欄へは知らせない (FR1044 の閉じた列は変えない)。 未着地の祖先を持つ行は祖先の行と節を材料に足した予想の審査 (forecast) とし、 空の file を置かない。 bead の無い行の doc を跨ぐ祖先は測れない (partial)。 merge の門は、 anchor の HEAD か PR の head の vessel 宣言が任意 key row-review を持つ repo で、 head を 40 桁で固定しない merge、 その head の結果が pass でない merge、 審査の後に main で契約表の file が動いた merge を断る。 forecast と partial の判断不能は pass に数え、 FAIL と actual の判断不能は止める。 契約の審査の段は、 実物の base で組んだ判定の鍵が basis actual の PASS の記録と同じ周だけ lens を撃たずに写す。 先撃ちは rules 行 pipe.precheck_lens_per_round の値 0 (材料の組み直しも止める) と code の退役の 2 段で畳み、 事前審査の機械の予想と束は残す。 起動の列は、 直前の便が着地でない終端に着いた open な行 (列外か列に戻ったかを問わない) の write-set を行の予約とし、 FR1068 の順序で後ろの候補のうち交差するものを待たせる (その行の依存の祖先は待たせない)。 審査の FAIL か unparsed でない判断不能か gate の FAIL で終端した行の兄弟 (同じ節の行と、 その行の digest を載せた設計の PR の行の審査の記録に載る行) は待つ (first の印は待たない)。 行の予約と兄弟の待ち（兄弟の行の待ち）が解ける契機は設計 row-review.md §7・§8 の閉じた列が持ち、 どちらも既存の記録から周ごとに導き、 event の種類を足さない。 実装は同じ設計の行 a〜g で、 SRS の追加 round の後に起こす。
  （平易）器は、 契約表の行を足す・変える設計の変更の先端で、 行の審査を撃つ口を持ちます。 口は、 main との分かれ目から中身の指紋 (行の digest) が変わった行のうち、 まだ着地していない行ごとに、 受付と同じ機械の検査と、 本番と同じ審査役の審査を読みだけの形で 1 回撃ちます。 判定は、 行の中身・材料・code の木・祖先の状態・審査役が自分で名乗る版を並べた鍵ごとに記録し、 同じ鍵の行は撃ち直さず、 先端ごとの結果を 1 語で残します。 口は最後まで前で走り、 席の入力欄へは知らせません。 祖先がまだ無い行は、 空の file を置かず、 祖先の行と節を材料に足して予想の審査にします。 名乗った repo の merge の門は、 main か変更の側のどちらかが名乗っていれば、 先端を固定しない merge・結果が通っていない merge・審査の後に main で契約表が動いた merge を断ります。 予想の審査と仕事の札の無い行の判断不能は通し、 FAIL は止めます。 便の中の審査は、 鍵が同じ実物の合格の記録の時だけ撃たずに写します。 先撃ちは、 規則の表の値を 0 にして材料の組み直しも止める段と、 code をやめる段の 2 段で畳みます。 起動の列は、 着地でない終わり方をした行の触る file を、 その行が次の便を起こすまで取り置き、 順番で後ろの行を待たせます (その行が待っている祖先は待たせません)。 審査か gate で落ちた行の兄弟 (同じ節の行と、 同じ設計の変更で審査された行) は、 直しが入るまで待ちます。 取り置きと兄弟の待ちが解ける契機は設計の文書が閉じた列で持ち、 既存の記録から毎回導き、 出来事の種類は増やしません。
  （理由）merge の前に審査するのは、 行の字が変わるのは merge の時点だけで、 そこで止めれば席が merge する行は並ぶ前に審査済みになり、 落ちた行が列から外れて順番が崩れる形が生まれにくいからです。 先撃ちを強めない・判定で止めるだけにしないのは、 使い回しが材料の違いで外れて 1 度も当たらず、 依存を待つ行にしか届かないと実測で分かったからです。 CI で撃たないのは、 公開の repo に口座を置かず、 口座と箱と台帳を持つ host の器が撃つためです。 口が知らせを送らないのは、 席の入力欄への差し込みは閉じた列で持っていて、 新しい口は前に消した口の復活になるからです。 撃ち直さない鍵に材料と code の木と祖先の状態を入れるのは、 祖先の直しや code の着地で判定が変わりうるのに古い判定を写さないためで、 審査役の起動の字の代わりに審査役が自分で名乗る版を比べるのは、 字に本体の置き場が入り入れ替えのたびに外れるからです。 門が main と変更の両方の宣言を読むのは、 変更が自分で名乗りを外して門を素通りする形と、 名乗りを足す変更が自分の門を持たない形を両方塞ぐためです。 予想の審査の判断不能を通すのは、 祖先の本文は祖先が着地するまで存在せず、 止めると設計の変更が 1 本ずつになるからで、 その記録は便の中の審査で写さないので、 その行は列に入った後に実物で改めて測られます。 落ちた行の file を取り置くのは、 直した行を元の順位で先に起こすためで、 その行が待っている祖先を待たせないのは、 前提の行を足して直す形で待ち合いの輪を作らないためです。 兄弟を同じ節と同じ設計の変更に絞るのは、 同じ時に同じ前提で書いた行だけが同じ欠陥を持ちやすく、 指示が同じかは機械で判じられないからです。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1049（claim）: FR1049 (契約の審査) は便が受付を通った直後に審査する。 本 ADR は同じ審査を設計の PR の段へ前倒しし、 契約の審査の段は、 判定の鍵が同じ実物の PASS の記録の使い回しと、 予想の審査と入力の変わった行の審査し直しの段として残すと主張する (字の直しは SRS の追加 round)。
  FR1068（claim）: FR1068 (起動の列) は起こせない契約を閉じた型の理由で待たせる。 本 ADR は理由に行の予約の待ちと兄弟の待ちの 2 つを足し、 どちらも既存の記録から導き、 FR1068 の順序の 1 関数で前後を決めると主張する (字の直しは SRS の追加 round)。
  FR1092（claim）: FR1092 (merge の門) は本文の trailer の形を merge の前に確かめる。 本 ADR は名乗った repo の門に、 head の固定と行の審査の結果と契約表の動きを見る 2 つ目の判定を足すと主張する (trailer の判定の字に主語を付ける直しは SRS の追加 round)。
  FR1039（rationale）: FR1039 (交差の排他) の判定をそのまま行の予約の交差に使う。 本 ADR は交差の相手に、 live な便に加えて落ちた行の行の予約を数える理由を与えるだけで、 FR1039 の判定の関数は変えない。
  FR1044（rationale）: FR1044 (席の入力欄への差し込み) の閉じた列に項を足さない。 行の審査の口は前面で最後まで走り、 席は自分の道具の待ちで結果の行を読むので、 新しい差し込みの口が要らない。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録はどの記録も置き換えません。 器が便を自動で起こす決定と、 席を 1 つにして器が便を着地させる決定はそのまま保ち、 後者が持たないとした merge の後の審査も復活させません。 以前の設計が退けた「審査の判定を記録する」形は、 merge の門に読ませる理由で採り直し、 足す物は消す物と対にします。 原則は、 列の順は並ぶ前に審査して守り、 並んだ後に落ちた物は、 直るまでその場所を持ち続ける、 です。
  改訂状態: current
  置き換える ADR: なし (新規)
  置き換えられた: なし (現行)
  supersede は無い。 ADR-1034 (審査を通った契約を器が自動で起こす) と ADR-1045 (席は orchestrator 1 つで、 器の dispatcher が便を起こし着地させる) はそのまま保ち、 ADR-1045 が持たないとした契約が出来た直後の審査 (merge の後) は復活させず、 審査を merge の前の段に置く。 設計 dispatcher.md §16 が却下した「審査の判定を中身に紐づけて記録する」形は、 merge の門の入力にする理由で行の審査の記録として採り直し、 足す面は消す面と対にする (C17.2)。 ADR-1019 の交差の排他の判定は変えず、 相手に行の予約を足すだけである。 先撃ち (設計 dispatcher.md §27) は ADR を持たない設計の段で、 その code の退役は git の履歴に残る可逆な形 (N1) で行い、 設計 doc が記録する。
  照会終端 — PRIN-JUDGE-BEFORE-THE-QUEUE-AND-KEEP-THE-PLACE-OF-WHAT-FELL
  列の順は並ぶ前に審査して守り、 並んだ後に落ちた物は、 直るまでその場所を持ち続ける。
  本 ADR が先撃ちを強める案・CI で撃つ案・merge の後に撃つ案を退け、 merge の門と行の予約と兄弟の待ちを選んだのはこの原則に行き着く (これ以上は遡らない照会終端)。
options:
  - id: "OPT1"
    name: "設計の PR の段の行の審査と merge の門・落ちた行の行の予約と兄弟の待ち・先撃ちの退役"
    text: |
      設計の PR の head で、 変わった行ごとに受付と同じ機械の検査と契約の審査の lens を撃ち、 判定の鍵（審査を写す鍵）ごとに記録する。 merge の門は vessel 宣言で名乗った repo で、 head を固定しない merge と、 変わった行の審査が通っていない merge と、 審査の後に main で契約表が動いた merge を断る。 契約の審査の段は、 判定の鍵が同じ実物の PASS の記録だけを使い回す。 審査か gate で落ちた行は write-set を取り置き、 同じ設計の兄弟の行を待たせる。 先撃ちは rules 行の値 0 と code の退役の 2 段で畳む。 決め手は分析 (CTX1〜CTX3)。
      （平易）設計の変更を main に入れる前に、 変わった行ごとに機械の検査と審査役の審査を撃って記録し、 名乗った repo の merge の門で止める案です。 落ちた行は触る file を取り置いて順番を守り、 同じ設計から出た兄弟の行を直しが入るまで待たせ、 先撃ちはやめます。 席が merge する行は並ぶ前に審査され、 先撃ちの届かなかった行にも審査が届き、 足す仕組みは消す仕組みと対にします。 代わりに、 設計の変更ごとに審査の費用と待ちが要り、 まだ無い祖先に頼る行と仕事の札の無い行の判断不能は merge を通ります。
      利点: 席が merge する設計の PR の行は、 列に並ぶ前に審査を通る (DR1)
      利点: 依存の無い行と再受付の行にも審査が届く (先撃ちの届かない 34 件) (DR1)
      利点: 落ちた行の file は取り置かれ、 直った行は元の順位のまま後ろの行より先に起きる。 落ちた行の依存の祖先は待たないので輪ができない (DR2)
      利点: 同じ設計の PR の兄弟の行は直しが入るまで起きない (DR3)
      利点: 撃ち直さない鍵と使い回しの鍵は判定に効く入力の全部と lens の子が出す版で取り、 予想の審査は写さない (DR4)
      利点: 足す物と消す物を対で名指し、 event の種類を足さず、 受付・事前審査・契約の審査・merge の門の既存の関数と口を借りる (DR5)
      利点: 門に加わるのは宣言で名乗った repo だけで、 審査は host の器が撃ち、 口は前面で最後まで走って席へ差し込まない (DR6)
      欠点: 設計の PR ごとに読みの道具を持つ lens を行の数だけ撃つ費用が要る (未実測)
      欠点: 記録は host の state dir に在り、 別の host から merge すると撃ち直しが要る
      欠点: 祖先が未着地の行と bead の無い行の判断不能は merge を通り、 その行の穴は列に入った後の審査で止まる
      欠点: 新しい doc を 1 本の PR で起こすと、 その doc の全部の行が兄弟になる
    verdict: adopted
    reason: "決め手は分析 (CTX1〜CTX3)。"
  - id: "OPT2"
    name: "先撃ちを Opus に戻すだけ"
    text: |
      先撃ちの model を契約の審査と同じ model に戻し、 使い回しの条件を満たさせる。 決め手は実測 (CTX3)。
      （平易）先撃ちの審査役を、 本番の審査と同じ強い model に戻すだけの案です。 仕組みを足さず、 規則の表の値 1 つで済む点で勝ります。 けれども、 判定を使い回す鍵は材料の違いで外れ、 model が同じだった期間でも 1 度も当たりませんでした。 当たっても先撃ちの見逃しがそのまま本番を素通りし、 届くのも依存を待つ行だけです。
      利点: 足す仕組みが無く、 rules 行の値 1 つで済む
      利点: 先撃ちの判定の質が契約の審査と揃う
      欠点: 使い回しは材料の鍵（審査材料の指紋）で外れ、 model を揃えた窓でも 0 回だった (DR4)
      欠点: 当たっても先撃ちの見逃しがそのまま素通りする (DR4)
      欠点: 依存を待つ行にしか届かず、 審査が列に並んだ後に在る形は変わらない (DR1・DR2)
    verdict: rejected
    reason: "決め手は実測 (CTX3)。"
  - id: "OPT3"
    name: "先撃ちの判定で起動を止める"
    text: |
      先撃ちが FAIL か判断不能を出した行を、 依存が閉じても起こさない。 決め手は分析 (CTX3)。
      （平易）先撃ちが落とした行を、 依存が閉じても起こさない案です。 先撃ちの判定のまま起きてしまった 6 件は止まり、 待ちの理由を 1 つ足すだけで済む点で勝ります。 けれども、 届くのは依存を待つ行だけで、 審査で落ちた 46 件のうち 34 件には届きません。 落ちた行が列から外れて順番が崩れる形も残ります。
      利点: 先撃ちの判定のまま起動した 6 件は止まる
      利点: 待ちの理由を 1 つ足すだけで済む
      欠点: 届くのは依存を待つ行だけで、 46 件中 34 件には届かない (DR1)
      欠点: 落ちた行が列から外れて順番が崩れる形は残る (DR2)
      欠点: 予想の空の file に由来する判断不能で、 着地で消える理由の待ちが生まれる (DR4・DR7)
    verdict: rejected
    reason: "決め手は分析 (CTX3)。"
  - id: "OPT4"
    name: "CI で契約の審査の lens を撃つ"
    text: |
      設計の PR の CI の job で lens を撃ち、 合格を merge の条件にする。 決め手は分析と PUBLIC の制約 (DR6)。
      （平易）設計の変更の CI (自動の検査の場) で審査役の審査を撃ち、 合格を merge の条件にする案です。 forge の必須の検査に載せられ、 どこから merge しても同じ記録を見る点で勝ります。 けれども、 公開の repo の CI に審査役の口座と model を持たせることになり、 口座の選び方や箱の上限や台帳は host の器の側に在るので CI からは届きません。 push のたびに撃つと費用も増えます。
      利点: merge の条件を forge の必須の検査に載せられる
      利点: どの host から merge しても同じ記録を見る
      欠点: PUBLIC の repo の CI に lens の口座と model を持たせることになる (DR6)
      欠点: 口座の選定・封じ込め・rules 行は host の器が持ち、 CI は台帳に届かない (DR5)
      欠点: PR の push ごとに撃つと費用が push の数に比例する (DR4)
    verdict: rejected
    reason: "決め手は分析と PUBLIC の制約 (DR6)。"
  - id: "OPT5"
    name: "行の審査を merge の後 (列に入った直後) に撃つ"
    text: |
      契約表の行が main に入った直後に審査し、 判定を中身ごとに記録する (ADR-1045 の前の、 契約が出来た直後の審査の形)。 決め手は分析 (DR1・DR2)。
      （平易）契約表の行が main に入った直後に審査する案で、 以前の形の復活です。 merge の門を変えずに済む点で勝ります。 けれども、 行は既に main に在るので、 落ちた行の直しにもう 1 本の変更が要り、 行の字が変わる merge の時点で止めないと、 落ちた行が起動の列の入力に残ります。
      利点: merge の門を変えずに済む
      利点: 審査は列に入る前に済む
      欠点: 行は既に main に在り、 落ちた行の直しにもう 1 本の PR が要る (DR1)
      欠点: 行の字が変わるのは merge の時点だけで、 そこで止めないと落ちた行が列の入力に残る (DR2)
    verdict: rejected
    reason: "決め手は分析 (DR1・DR2)。"
basis: [FR1039, FR1044, FR1049, FR1068, FR1092, ADR-1019, ADR-1034, ADR-1045, ADR-1088]
