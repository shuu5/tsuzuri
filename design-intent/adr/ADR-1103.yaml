  器の承認の欄: 裁定 (user)・user・採用は常設の裁定 user 2026-09-28T00:54Z (決めてほしいことは推奨で進める) の適用で、 SRS の追加 round (版 0.33) で accepted にした。 rules 行の値は裁定 user 2026-09-30T22:13Z 項 reserve (pipe.reserve_h = 24) と 項 precheck (pipe.precheck_lens_per_round = 0)。 台帳の問い s2-07l.736.33.4 の裁定 s2-07l.736.33.4:20260930T2213Z-1 に結んだ。 逐語は台帳にだけ在る・裁定済
  器の承認の欄: 設計 (orchestrator)・orchestrator・2026-09-30 草稿 v2 (契約の審査の段・先撃ちの木と使い回しの読み口・起動の列の終端の行の扱いと順序と交差の判定・merge の門・vessel 宣言の任意 key の読み手・lens の rules 行の読みを現物で読み、 ADR-1019・ADR-1034・ADR-1045・ADR-1088 の決定と、 便 165 本の FAIL / INCONCLUSIVE 76 件の分析と、 PR の敵対審査の 36 件と照らした。 推奨の採用は 裁定 user 2026-09-28T00:54Z (決めてほしいことは推奨で進める、 の常設の指示) の適用で、 逐語は台帳にだけ在る。 SRS の追加 round の grill の論点 (予想と partial の判断不能を merge で通すか・兄弟の範囲・門の名乗り・行の審査の消費) は推奨として書き、 round の裁定で確定する。 rules 行 pipe.reserve_h の値と pipe.precheck_lens_per_round の値 0 は常設の指示に含めず、 C5 の裁定 id を round で別に取る。 拘束する constitution の版 0.5.0)・作成
  器の案の章の要約: 候補を 5 つ並べます。 merge の前に審査して門で止め、 落ちた行の順番を守り、 先撃ちをやめる案 (選んだ案) と、 選ばなかった 4 つです。 選ばなかった案は、 先撃ちの審査役を強い model に戻すだけの案・先撃ちの判定で起動を止める案・CI で審査を撃つ案・merge の後に審査する案です。
  器の専門語の説明: 本文に出てくる専門語 6 個を、 やさしい言葉で説明します。
  ・行の審査（row review）: 契約表の行を足す・変える設計の PR の head で、 変わった行ごとに器が撃つ機械の検査と契約の審査の lens (本 ADR)。 判定は判定の鍵ごとに state dir に記録し、 merge の門と契約の審査の段が読む。
  ・行の digest（row digest）: 行の欄から受付と同じ生成で作った契約の字の hash と、 行が実装する設計の節の本文の hash の対 (本 ADR)。 SRS FR1049 が契約の中身の同一性に使う 2 つと同じもの。
  ・材料の鍵（materials key）: 審査の材料の dir の全 file の名と本文から決まる 1 つの digest (本 ADR)。 lens の cmd の字は入れない。 判定の鍵の 1 つ。
  ・判定の鍵（verdict key）: 行の digest・材料の鍵・code の木の鍵・basis・祖先ごとの状態・lens の版を並べた字の digest (本 ADR)。 同じ鍵の行は撃ち直さず、 契約の審査の段は同じ鍵の実物の PASS だけを写す。
  ・行の予約（row reservation）: 直前の便が着地でない終端に着いた open な行が、 次の便を起こすまで持つ write-set の取り置き (本 ADR)。 起動の列の順で後ろの候補のうち交差するものを待たせ、 その行の依存の祖先は待たせない。 群の予約とは別。
  ・兄弟の待ち（sibling wait）: 審査か gate で落ちた行と同じ節を実装する行か、 落ちた行を載せた設計の PR の行の審査の記録に載る行を、 直しが入るまで待たせる起動の列の理由 (本 ADR)。 介入 first の印を持つ候補は待たない。
