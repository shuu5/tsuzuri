consequences:
  - "この判断で良くなること 4 つと、 代わりに引き受けること 6 つです。 良くなるのは、 席が merge する設計の変更の行が merge の前に審査されること、 落ちた行が元の順位で先に起きること、 兄弟の行が続けて落ちないこと、 記録に載らない先撃ちの費用が無くなることです。 引き受けるのは、 merge の前の審査の費用と待ち、 門を通らない merge が残ること、 祖先がまだ無い行と仕事の札の無い行の判断不能が merge を通ること、 新しい文書の行が全部兄弟になること、 期限と退役の値と審査の消費に持ち主の裁定が要ること、 記録が畳まれず増えることです。"
  - "良い結果: 席が merge する設計の PR の行は、 merge の前に行の審査を通り、 設計の穴はそこで止まる"
  - "良い結果: 落ちた行は元の順位のまま、 同じ file を触る後ろの行より先に起きる"
  - "良い結果: 同じ設計の PR の兄弟の行が、 同じ欠陥で続けて落ちない"
  - "良い結果: 先撃ちの費用 (便の記録に載らない分) が無くなり、 行の審査の消費は記録に残る"
  - "代償: 設計の PR ごとに読みの道具を持つ lens を行の数だけ撃つ費用と待ちが要る (費用は未実測で、 着地の後に測って見直す)"
  - "代償: 門の外の merge が残る。 別の host の merge は記録が無く口の撃ち直しが要り、 GitHub の画面の merge と器が着地させる便 (runner が設計 doc の行を書き換えた便を含む) は門を通らない"
  - "代償: 祖先が未着地の行と bead の無い行の判断不能は merge を通り、 その穴は列に入った後の契約の審査で止まる"
  - "代償: 新しい doc を 1 本の PR で起こすと、 1 行の欠陥でその doc の全部の行が直しまで待つ (first の印で名指して起こせる)"
  - "代償: 行の予約の期限と先撃ちの退役の値と行の審査の消費は、 SRS の追加 round で持ち主の裁定を取る"
  - "代償: 行の審査の記録は畳まれず push ごとに増える (量の上限と掃除は別の設計)"
