  ・heartbeat の実効の値（effective heartbeat）: 管理 tick がその席へ打刻の合図を送るか (on) 送らないか (off) の、 その周の値 (FR1078)。 明示の記録 → 群の表の行の任意 key heartbeat → 種類の既定の順で決まる。 記録の file の有無そのものではない。
  ・明示の記録（explicit record）: 口 seat heartbeat on / off が席の状態の dir に置く 1 行 (時刻) の file。 明示 on と明示 off の 2 種で、 置くときは他方を消し、 default は両方を消す。 書き手は器の口 1 本。 明示 off は ADR-1070 の停止の記録を同じ置き場と形のまま引き継ぐ。
  ・決まり方（resolution source）: heartbeat の実効の値がどの段で決まったかを名乗る閉じた 3 語 — explicit (明示の記録)・group (群の表の行の key)・default (種類の既定)。 口の default (明示の記録を消す操作) とは別。
  ・種類の既定（kind default）: 明示の記録も群の表の行の key も無い席の値 (決まる順の段 3・FR1078)。 置き場の種類ごとに決まっていて、 群の置き場の席は on・park の区画の置き場の席は off・群の表のどの行にも属さない席は on。 宣言では変わらない (行ごとに値を変えるのは段 2 の群の表の行の key で、 種類の既定に勝つ)。
  ・群の表（group table）: host の面が持つ置き場のかたまりの宣言の表 (FR1038)。 行の名は Tier1〜Tier9 に限り、 Tier1〜Tier8 の行は群 (口座を占め、 群の今の口座を持つ) を、 Tier9 の行は park の区画を宣言する。 行は任意の key heartbeat (on か off) を持てる (FR1078)。
  ・park の区画（park lot）: 群の表の、 名 Tier9 の行が宣言する置き場のまとまり (FR1095・ADR-1091)。 群ではなく口座を占めない。 席は残すが日々は動かさない repo を置く。 heartbeat の種類の既定は off (FR1078)。
  ・管理 tick（management tick）: 席の外から周期で回り、 死んだ席を起こし直し、 移動の周に退避を撃ち、 黙った席へ合図を送り、 群の移動の判定と park の移り先の判定を撃つ仕組み (FR1027)。 heartbeat が off の席でも止めない。
  ・打刻の合図（stamp signal）: 管理 tick が黙った席の入力欄へ注入する、 台帳の現在地から続きを進めるよう促す 1 行 (ADR-1058)。 heartbeat はこの合図の呼び名 (ADR-1070)。 末尾に alarm を乗せうる (FR1027)。
  ・席の状態の dir（seat state dir）: state dir の下の席 (target) ごとの dir。 状態の打刻・梯子の記録・明示の記録・最後の周の打刻を置く。
  ・最後の周の打刻（last tick stamp）: 管理 tick が周ごとに席の状態の dir へ書く 1 行 (時刻・判定・理由)。 rc 1 の周も書く。 健全かはこれを読む側が判じる (ADR-1070)。
