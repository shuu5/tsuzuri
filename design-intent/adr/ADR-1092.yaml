plain: |
  この記録で「器」は scribe2 の本体、 「席」は人と AI が話す 1 つの session、 「見回り (管理 tick)」は席の外から周期で席を見る仕組み、 「合図 (heartbeat)」は見回りが黙った席へ送る「続きを進めて」の 1 行です。 これまで合図を送るかは、 席ごとの停止の記録が在るか無いかだけで決まり、 記録が無い席には全部送っていました (ADR-1070)。 持ち主は、 席は残すが日々は動かさない置き場 (park の区画) の席には既定で合図を送らず (合図で token を使わない)、 それでも合図を受けたい席は表せるようにすると裁定し、 その形も推奨のまま決めました (2026-09-28)。 この記録は、 口を seat heartbeat on|off|default|status にし、 on と off は席ごとの明示の記録を 1 つ置いてもう一方を消し、 default は両方を消すこと、 合図を送るかは「明示の記録 → 群の表の行の key → 種類の既定 (群は送る・park の区画は送らない・どこにも属さない席は送る)」の順で決め、 どこで決まったかを 3 語 (explicit・group・default) で名乗ることを決めます。 口の default は記録を消す操作で、 3 語の default は種類の既定で決まったことを指します。 要件書では FR1078 (heartbeat の決め方) の根拠になり、 FR1027 (見回り) を支えます。
