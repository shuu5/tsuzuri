  器の案の章の要約: 候補を 4 つ並べます。 明示 on と明示 off の 2 つの記録と、 群の表の行の key と、 種類の既定の順で決める案 (選んだ案)、 今の形のまま park の区画の席に器が停止の記録を書く案、 既定を host 全体の 1 値で持つ案、 明示 on を持たず停止の記録と種類の既定だけにする案です。 選ばなかった 3 案にも利点を並べ、 退けた決め手を各案に書きます。
