    verdict: adopted
    reason: "器の記録が採った決定（字は決定の欄・器の記録の §2）。文脈の要約: 前の記録 (ADR-1009) は、 実装役を起こすとき「起動した人の設定は読まず、 相手の repo の設定だけ読む」と決めました。 ところが相手の repo の設定 file は、 審査される PR 自身の中身です。 そこに「この command は聞かずに許す」と書けば、 器が置いた門番 (承認の問いに一律で断る hook) には問いが届かず、 「この場面でこの command を動かせ」と書けば、 器が許した覚えのない command が動きます。 審査役 (lens) に至っては、 起動した人の設定も相手の repo の設定も全部読んでいました。"
  - id: "a"
    name: "--restricted を使う"
    text: |
      案 (a) --restricted を使う: 却下。 利点は user / project / local の settings を無視することが flag の定義に含まれ、 file tool を作業 dir に閉じる副次効果もあること。 しかし同じ flag が Bash を含む「command を実行する組込み tool」を --tools で名指ししない限り外し、 settings / git / tool 設定 file への書込みを「人か設定済みの承認 handler」の承認へ倒す。 無人の runner はそこで構造的に止まり、 何を名指すかという新しい列挙 (組込み tool の一覧) を器が抱える。 目的 (settings を読まない) に対して足す変更が大きく、 版ごとに意味が動く面も広い。 ∴ settings だけを切る flag を選ぶ (§2.1)。
    verdict: rejected
    reason: "利点は user / project / local の settings を無視することが flag の定義に含まれ、 file tool を作業 dir に閉じる副次効果もあること。 しかし同じ flag が Bash を含む「command を実行する組込み tool」を --tools で名指ししない限り外し、 settings / git / tool 設定 file への書込みを「人か設定済みの承認 handler」の承認へ倒す。 無人の runner はそこで構造的に止まり、 何を名指すかという新しい列挙 (組込み tool の一覧) を器が抱える。 目的 (settings を読まない) に対して足す変更が大きく、 版ごとに意味が動く面も広い。 ∴ settings だけを切る flag を選ぶ (§2.1)。"
  - id: "b"
    name: "--settings <器が生成した最小 file> を渡す"
    text: |
      案 (b) --settings <器が生成した最小 file> を渡す: 却下。 利点は「器が settings を与える」という形が ADR-1009 §2.1 の趣旨に近く見えること。 しかし --settings は settings を追加で読む flag であり、 project も user も消えない (checkout の allow と hooks はそのまま効く)。 器が与える必要のある settings も記録時点には無い (権限は --allowedTools・hook は --plugin-dir で既に与えている)。 ∴ 渡さない (§2.1 MUST NOT)。
    verdict: rejected
    reason: "利点は「器が settings を与える」という形が ADR-1009 §2.1 の趣旨に近く見えること。 しかし --settings は settings を追加で読む flag であり、 project も user も消えない (checkout の allow と hooks はそのまま効く)。 器が与える必要のある settings も記録時点には無い (権限は --allowedTools・hook は --plugin-dir で既に与えている)。 ∴ 渡さない (§2.1 MUST NOT)。"
  - id: "c"
    name: "intake / gate が checkout の settings を字面で検査して拒む"
    text: |
      案 (c) intake / gate が checkout の settings を字面で検査して拒む: 却下 (§2.3)。 事後検証・第 2 の parser・user / local が見えない、 の 3 点。 fallback としても置かない——置くと「読まない起動形」が外れたときに字面検査が黙って主役になり、 C16 の極性が事後側へ倒れる。
    verdict: rejected
    reason: "事後検証・第 2 の parser・user / local が見えない、 の 3 点。 fallback としても置かない——置くと「読まない起動形」が外れたときに字面検査が黙って主役になり、 C16 の極性が事後側へ倒れる。"
  - id: "d"
    name: "現状維持 (project を読み、 PermissionRequest hook の一律 deny に頼る)"
    text: |
      案 (d) 現状維持 (project を読み、 PermissionRequest hook の一律 deny に頼る): 却下。 利点は変更が無いこと。 しかし hook は「承認の問い」にだけ答える機構で、 allow 規則で問いが出ない経路と hooks による process 起動には届かない (§1)。 write-set の照合 (gate) は .claude/ を write-set に含めた便を止められず、 land した settings は以後の全便に効く。 lens に至っては全 source を継承していた。 ∴ 入力を断つ (§2.1)。
    verdict: rejected
    reason: "利点は変更が無いこと。 しかし hook は「承認の問い」にだけ答える機構で、 allow 規則で問いが出ない経路と hooks による process 起動には届かない (§1)。 write-set の照合 (gate) は .claude/ を write-set に含めた便を止められず、 land した settings は以後の全便に効く。 lens に至っては全 source を継承していた。 ∴ 入力を断つ (§2.1)。"
