    name: "器が起こす claude (runner / lens) は口座と対象 repo の settings を 1 つも読まない (--setting-sources 空 + --strict-mcp-config・ADR-1009 §2.1 / ADR-1010 §2.4 の起動 flag を部分 supersede)"
    text: |
