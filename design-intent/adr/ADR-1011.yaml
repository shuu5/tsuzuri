# 判断の記録 ADR-1011 — 器 scribe2 の判断の記録 ADR-0011 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1011
title: "器が起こす claude (runner / lens) は口座と対象 repo の settings を 1 つも読まない (--setting-sources 空 + --strict-mcp-config・ADR-1009 §2.1 / ADR-1010 §2.4 の起動 flag を部分 supersede)"
status: accepted
date: 2026-09-10
context: |
  前の記録 (ADR-1009) は、 実装役を起こすとき「起動した人の設定は読まず、 相手の repo の設定だけ読む」と決めました。 ところが相手の repo の設定 file は、 審査される PR 自身の中身です。 そこに「この command は聞かずに許す」と書けば、 器が置いた門番 (承認の問いに一律で断る hook) には問いが届かず、 「この場面でこの command を動かせ」と書けば、 器が許した覚えのない command が動きます。 審査役 (lens) に至っては、 起動した人の設定も相手の repo の設定も全部読んでいました。
  ADR-1009 §2.1 は runner を --setting-sources project と --allowedTools <allowlist> で起こすと定めた (MUST)。 目的は「user / local の settings を継承しない」ことであり、 project を読むこと自体は目的ではなかった。 実装は 2026-09-10 に land し、 ADR-1010 §2.4 が allowlist の出所を凍結した写しへ移した際も起動 flag は「ADR-1009 §2.1 のまま不変」とした。
  同日の便 (宣言の凍結) の lens review が、 この project が穴であることを指摘した (L4)。 runner の cwd は便の worktree であり、 worktree は審査対象の PR 自身の checkoutである。 Claude Code は project source として <cwd>/.claude/settings.json を読むので、 契約の write-set に .claude/ を含めた便が permissions.allow に Bash(*) 相当を書いて land すれば、 それ以後の全便の runner は宣言の外の command を承認要求なしに撃てる。 器の PermissionRequest hook (vessel-hook §6.5) は「承認の問い」にだけ答える機構であり、 allow 規則で問いが出ない経路は素通りする——ADR-1009 §2.1 が「明示 allow 以外は fail-closed」と呼んだ形は、 allow の出所が器だけであるときにだけ成り立っていた。 同じ file の hooks は SessionStart / PreToolUse 等で任意の command を起動する口でもあり、 こちらは allowlist の外側で checkout が runner の process を動かす経路である。
  lens の起動を実測すると、 --setting-sources を渡していなかった (Command を組む関数は runner だけがこの flag を足していた)。 既定はすべての source (user・project・local) を読むので、 lens は起動口座の settings と checkout の settings を両方継承し、 同じ diff が口座ごとに違う道具・違う hook の下で審査される形になっていた。 ADR-1009 §2.1 は runner だけを名指しており、 lens はその視野の外にあった。
  直す前に「読まない起動形」が実在するかを実 binary で測った (§5)。 対象 dir の .claude/settings.json に SessionStart hook で marker file を作らせ、 --setting-sources project では hook が発火して marker が生成され、 --setting-sources "" (空) では init record から始まり hook が 1 度も発火しなかった。 空指定は既定 (全 source) へ化けない。 ∴ 決めるべきは「どの flag で、 どこで、 何に対して」であり、 ADR-1009 §2.1 が flag を逐語で MUST と書いている以上、 frozen な ADR を部分 supersede する新 ADR として記録する (本 repo の作法「既存 ADR は frozen・改訂は supersede」)。 3 クラス (消す / 出す / 使う) にも憲法条文の改訂 (A2) にも当たらないので user 裁定は仰がず、 2026-09-10 の裁定 (抜け道を構造で閉じる) の適用として planner が決めた。
decision: |
  決めることは 4 つです。 器が起こす claude は起動した人の設定も相手の repo の設定も 1 つも読まない、 それを claude の起動命令を組む 1 か所に置いて実装役と審査役の両方に効かせる、 前の記録の flag の字面をこの形に改める、 そして「相手の repo の設定 file を器が覗いて危ない行を探す」形は採らない、 です。
  本 ADR は C11 (C11.2 の極性は型・allow を返す経路を作らない) と C16 (逸脱は編集時に止め、 事後検証で代替しない) の適用を記録し、 起動形を 1 か所に置く形は C2 の趣旨 (1 つの決まりは 1 つの関数・1 つの列挙に置き、 散文で二重に持たない) に倣う (C2 の条文が名指すのは選択・除外・routing であり、 起動形はその適用対象ではない——根拠は §2.1 自身の MUST である)。 憲法本文は書き換えない。 読みは次のとおり: 器が claude に与える権限の出所は器だけである (ADR-1009 §2.1 の趣旨)。 settings file は権限 (allow) と process の起動 (hooks) の両方を運ぶ入力であり、 その出所が起動口座であれ checkout であれ、 器の外にある。 ∴ 器が起こす claude は user / project / local の settings を読まない (Claude Code が常に適用する managed settings は §2.4)。 runner については、 これは「明示 allow 以外は fail-closed」を、 allow の出所を器に限ることで成り立たせる条件である (lens の境界は §2.2)。
  §2.1 起動形 — Command を組む 1 か所で user / project / local の settings を切る
  claude を起こす命令を組み立てる関数は器に 1 つしかありません。 そこで「起動した人の設定と相手の repo の設定は読まない」と「repo に置かれた外部ツール (MCP) の設定も読まない」を毎回付けます。 実装役も審査役も、 この関数を通らずに claude を起こすことはできません。
  器が claude を起こす Command を組む関数 (記録時点では headless::build・runner と lens が共有する唯一の構築点) は、 --setting-sources "" (空 = user / project / local のいずれも読まない) と --strict-mcp-config を毎回渡す (MUST)。 flag は呼出側 (runner / lens) でなくこの関数に置く (MUST): 呼出側に置くと lens のように「足し忘れた側」が既定 (全 source) へ落ちる。 器が claude を起こす新しい経路を足すときも、 この関数を通す (MUST・第 2 の構築点を作らない)。
  同じ関数は --settings (settings の追加読込) と --restricted (組込み tool の除去 mode) を渡さない (MUST NOT)。 前者は settings を消さず足す flag であり (§4 案 (b))、 後者は Bash を外して --tools の名指しを要求し、 かつ settings / git / tool 設定 file への書込みを人の承認へ倒すので、 無人の席では構造的に止まる (§4 案 (a))。 権限を丸ごと外す --dangerously-* 系を渡さないこと (記録時点の歯が runner と lens の両方で測る) は不変。 runner について、 --allowedTools に凍結した写しの allowlist を Bash(<cmd>:*) で渡すこと (ADR-1009 §2.1・ADR-1010 §2.4) と --plugin-dir に器が写した plugin を載せること (設計 pipeline §5.2 / §6) は不変。 両者について --permission-mode を毎回明示すること (設計 pipeline §6) は不変。 lens の起動形 (記録時点: --allowedTools も --plugin-dir も渡さない) は本 ADR では変えない (§2.2)。
  --strict-mcp-config は「--mcp-config で渡した server 以外を読まない」flag である。 記録時点の実測では checkout の .mcp.json は --setting-sources "" だけでも load されなかった (§5) が、 その挙動は project MCP server の承認状態という settings 側の状態に依っている。 本 ADR は settings 経路に依らず MCP の出所も器に限る belt として、 同じ関数で毎回渡す (MUST)。 器は --mcp-config を渡さない (記録時点・MCP server を器が与える決定は本 ADR に無い)。
  §2.2 ADR-1009 §2.1 の起動 flag を部分 supersede する
  前の記録が「相手の repo の設定だけ読む」と書いた flag の字面を、 「設定はどこからも読まない」に改めます。 それ以外——器が権限を与えること、 許す command の渡し方、 門番の hook が一律に断ること——は前の記録のままです。
  ADR-1009 §2.1 の「runner は claude を --setting-sources project と --allowedTools <allowlist> を付けて起こす (MUST)」は、 本 ADR により「runner は claude を settings を 1 つも読まない起動形 (§2.1) と --allowedTools <allowlist> を付けて起こす」と読む (SHALL be read as)。 「user / local の settings を継承しない (MUST NOT inherit)」は「user / project / local の settings を継承しない」へ拡張される。 同節の残り——allowlist の形 Bash(<cmd>:*)・PermissionRequest hook の一律 deny (allow を返す経路を作らない・C11)・write-set の fence は gate の照合が担うこと——と、 ADR-1010 §2.4 が定めた「allowlist は凍結した写しから組み manifest を読まない」は不変 (MUST remain)。 ADR-1010 §2.4 (normative) の一文「--setting-sources project と PermissionRequest hook の一律 deny は ADR-1009 §2.1 のまま不変」も、 flag の部分を同じく部分 supersede する (SHALL be read as 「§2.1 の起動形と PermissionRequest hook の一律 deny は不変」)——hook の一律 deny は不変のまま。 ADR-1009 §5 の実測行にある --setting-sources project の字面は決定時点の記録として残し、 書き換えない。
  本 ADR は lens を同じ起動形の適用対象に加える (ADR-1009 §2.1 は runner だけを名指していた)。 ただし lens の権限の境界は runner と同じではない: 記録時点の lens は --allowedTools を渡さず、 --plugin-dir も載せない (器の PermissionRequest hook は lens の session に無い)。 本 ADR の後、 lens の tool 権限の出所は --permission-mode の値と、 Claude Code が headless (-p) で答え手の無い承認要求をどう扱うかの既定だけになる (いずれも本 ADR は変えない・§2.4)。 本 ADR が lens について決めるのは「口座と checkout の settings が lens の権限と hook を広げる経路を断つ」ことまでであり、 lens に器の plugin を載せるか・組込み tool を絞るかは別の決定である (§2.4 候補)。
  §2.3 intake が settings を字面で検査する fallback は採らない
  「相手の repo の設定 file を器が読んで、 危ない行が在れば便を断る」という形も考えましたが、 採りません。 それは設定を読んでしまった後で追いかける検査で、 しかも起動した人の設定までは見えません。 読まない、 が答えです。
  intake (あるいは gate) が checkout の .claude/settings.json を parse し、 permissions.allow に Bash(...) が在れば rc 1 で拒む形は、 本 ADR の決定に含めない (MUST NOT be read as a fallback)。 理由は 3 つ: (1) それは settings が効いた後の事後検証であり、 C16 は逸脱を編集時 (ここでは起動時) に止めることを求める。 (2) 字面の検査は allow の書き方 (Bash(*) / Bash / 別の tool 名 / hooks の command) を列挙し続ける形になり、 器が Claude Code の settings schema を追いかける第 2 の parser になる。 (3) user / local の settings は checkout に無く、 intake からは見えない——lens の穴はこの形では閉じない。 §2.1 の起動形は入力そのものを断つので、 列挙も parser も要らない。 「読まない起動形が将来の版で受理されなくなる」場合は、 runner / lens の rc が claude の rc を写す (設計 §6) ので便が Failed として見える形で落ちる。 「空指定を既定へ読み替える版」が出た場合は見えない——これは §3 の残る弱点として記録し、 §5 の実測を検出線の候補として残す。
  §2.4 射程外
  組織が配る管理者設定 (これは claude が常に読みます)、 相手の repo の CLAUDE.md や skill のような「読ませる文章」まで切ることや、 組込み tool の一覧を絞ること、 環境変数の継承のしかた、 門番 hook の極性を変えること、 宣言 file の形を変えることは、 ここでは決めません。
  次は本 ADR の決定ではない (MUST NOT be read as such): managed settings (host / 組織が配布する settings・Claude Code が --setting-sources の値に依らず常に適用する第 4 の source・本 ADR の起動 flag では切れず、 §1 の脅威〔checkout と口座〕の外にある)、 checkout の CLAUDE.md・.claude/skills・.claude/agents 等のprompt 面の入力を切ること (それらが権限や process を運びうるかを本 ADR は測っていない・runner は checkout を読んで実装する役であり、 切る / 切らないの決定は別の論点)、 組込み tool の集合を --tools で絞ること (候補・別便)、 子 process の環境変数の継承 (ADR-1004 §2.4 と設計 §6 の裁定のまま)、 PermissionRequest hook の極性 (C11・一律 deny のまま)、 --permission-mode の値、 plugin の写し ({plugin_dir}) の扱いと plugin 自身の hooks (それは器の hooks である)、 vessel 宣言の schema (ADR-1010)、 器が MCP server を与えること (--mcp-config)、 憲法条文の改訂 (A2)。
