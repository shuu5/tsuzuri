# 判断の記録 ADR-84 — 前の記録の役の混ざりと退けた案へ戻る道と古い字を直し、差の file の入口の記録 ADR-60 を丸ごと置き換える
# 起草は係 w443a（2026-10-07）。第 1 稿の ADR-83 の決定 (9)(10)（係 w436a）を、検証役 （v439） の所見 A9・A10 と席の処分（台帳 t3-hub.92.10 の notes 2026-10-07T09:55Z）で割り出した。
# 持ち主の裁定 t3-hub.92.10.31・.32 で発効（2026-10-07・推奨のとおり）。ADR-60 を丸ごと置き換える（ADR-60 は retired・superseded_by ADR-84）。前の記録の本文は替えない（部分の置き換えは前例 ADR-82 の決定 (5)(6)・丸ごとの置き換えは前例 ADR-74 の決定 (8)）。後継が proposed の間は supersedes を書かない（欄の決まり）。
id: ADR-84
title: 前の記録の役の混ざり（席が契約を直す字）と退けた案へ戻る行き先と古い字を部分で置き換え、差の file の入口の記録 ADR-60 を丸ごと置き換えて ADR-74 の「残す」を外し、器に残る差の file の道を消す
status: accepted
date: 2026-10-07
supersedes: ADR-60
context: |
  検証役 （v433） の監査と （v439） の攻め（所見 A9・A10・A15）が、前の記録の字の食い違いを名指した（V・字は現物と合う・A15）。
  ・差の file の道（F4・F5）。作り直し （v4） の決め D2 で設計係は差の file を書かず、ADR-82 は差の file を戻し先に置かない。なのに ADR-74 の決定 (8) は「ADR-60 の決定 (5) の規則の行（pipe.overlap_commute） は値も行も替えずに残す。」と書き、器に差の file を読む道（契約の欄 patch・commute の module・審査の索引の patch・規則の行）が残る。雛形 runner.txt の差の行は行 （v-patch-drop-a）で消えた（着地 067b1b0a）（V）。欄 patch を持つ開いた契約は 0 本で、規則の行 pipe.overlap_commute の値は真（V・scribe2/rules/manifest.toml:697）。ADR-60 の決定 (1)〜(10) は差の file を持つ組の通しと、その作法・置き換え・古い字（(10) の「ADR-33 の決定 (12) の 1 本の決まりの列」）で、道を消すと生きた決定が残らない（D・A9）。
  ・役の混ざり（V）。ADR-81 の決定 (5) の「型（quality） の FAIL は便の終端で、席が契約を直して置き直す」という字（F10）と ADR-80 の決定 (8) の 6. の「（契約の起草は席）」という字（F11）は、ADR-72 の決定 (1)(2)(7)（席の手 3 つ・外れたら設計係へ返す）と食い違う。
  ・退けた案へ戻る道（V）。ADR-80 の撤退 (1) の行き先「上限の行を戻すか、整理を急ぐかを問う」は止めた上限へ戻る（F12）。ADR-72 の撤退 (6) の行き先「上限と戻し先を問い直す」は縛りが無い（F3）。
  ・器の凍った設計文書（V）。ADR-36 の決定 (7) は器の設計文書を凍った資料にしたが、ADR-80 の決定 (1) は「設計の文書（core-boundary.md と rules-manifest.md ほか 14 file）は、今の振る舞いを言う字だけを替え」と書く（係 w431a の notes の問い 1 と 2）。
  ・古い字（V）。ADR-80 の決定 (8) の頭と (4)、ADR-81 の決定 (9) の「器を書く便は同時に 1 本（ADR-33 の決定 (12)）」は、書いた時に外れていた床を名指す。床は ADR-63 の決定 (13) と ADR-64 の決定 (2)(3) で「観る 1 回の後」に外す事になり（裁定 t3-hub.87.39:20261005T2102Z-1）、外す便（t-run-cap-off）が閉じて着地し（着地 0de4a45a）、今の .vessel.toml に鍵 （run-cap） は無い。
decision: |
  (1) D1 ADR-60 を丸ごと置き換え、器の差の file の道を消す（F4・F5）。承認の時に ADR-60 の status を retired・superseded_by を ADR-84 にし、この記録の supersedes を ADR-60 にする。ADR-74 の決定 (8) の文「ADR-60 の決定 (5) の規則の行（pipe.overlap_commute） は値も行も替えずに残す。」を部分で置き換え、器の行 （v-patch-drop-b） を許す。消す物: 契約の欄 patch と契約表の読み・（commute） の module（pipe/commute.rs・commute/ledger.rs・commute/names.rs）と記帳・審査の索引の patch（pipe/review/index/patch.rs）・dispatch と受付の呼び（pipe/dispatch/candidates.rs・pipe/cli/intake/overlap.rs）・規則の行 pipe.overlap_commute・e2e の （commute） の歯（一覧は v433 の F5）・審査役の雛形（lens-contract.txt）の 33 行目の句「〔差の file など〕」とその snapshot 2 本（e2e__headless__lens_contract_prompt_external_form.snap・e2e__headless__lens_promise_prompt_external_form.snap）。（commute） の代わりの仕組みは足さない。ADR-1019 の §2.1（交差する契約を受け付けない）と §2.3（交差を入口で避ける）は、ADR-60 の決定 (9) の置き換えが外れて本文の字のまま効く（欄 patch を持つ開いた契約は 0 本なので、今の入口の振る舞いは替わらない）。
  (2) 直し D2・所見（F10）。ADR-81 の決定 (5) の「型（quality） の FAIL は便の終端で、席が契約を直して置き直す」を「型（quality） の FAIL は便の終端で、席が設計係を起こして契約を直させ、置き直す」に替える。数えと撤退 (3) は替えない。
  (3) 直し D3・所見（F11）。ADR-80 の決定 (8) の 6. の「（契約の起草は席）」を「（契約は席が起こす設計係が起草する）」に替える。
  (4) 直し D4・所見（F12）。ADR-80 の撤退 (1) の行き先「上限の行を戻すか、整理を急ぐかを問う」を「整理の memo を前に倒すか、無駄の門を強めるかを問う」に替える。上限を戻すかは、持ち主が新しい問いとして開く時だけで、撤退の行き先に置かない。
  (5) 直し D5・所見（F3）。ADR-72 の撤退 (6) の行き先「上限と戻し先を問い直す」を「周の上限の値と、設計係へ返す前の扱い（質問 record の扱い）を問い直す」に限る。
  (6) D6。ADR-80 の決定 (1) の「設計の文書（core-boundary.md と rules-manifest.md ほか 14 file）は、今の振る舞いを言う字だけを替え、来歴の字は残す」を外す（器の設計文書は凍った資料のまま・ADR-36 の決定 (7)）。同じ決定 (1) の main.rs の見本の字は替えない。
  (7) D7。ADR-80 の決定 (8) の頭の「（器を書く便は同時に 1 本・ADR-33 の (12)）」と決定 (4) の「器を書く便は同時に 1 本なので器の線に直列で並ぶ」、ADR-81 の決定 (9) の「器を書く便は同時に 1 本（ADR-33 の決定 (12)）」は、外れた床を名指す古い字として読み替える。読み替えた後: 器を書く便の同時の数は器の列（交わりの待ち overlap と依存）が決め、同時に 1 本の床は無い。ADR-60 の決定 (10) の同じ字は (1) の退役で消える。床を戻すなら新しい記録が要る。
  (8) 第 1 稿の表に無かった置き換え（v439 の A9 の ①〜④）。① ADR-77 の決定 (8) の （K7） と (9)（ライン停止の解き）は置き換えない（ADR-83 の決定 (1)）。② ADR-80 の決定 (5) の撤退の鍵の読み（引き金の道具が撤退 (1)(2)(3) を読む）を行 （t-refactor-trigger） から外し、ADR-83 の決定 (5) の読み手（行 t-window-read）に移す（読み手を 2 本作らない）。③ ADR-82 の決定 (2) と撤退の「数えるのは tsuzuri の設計の席」と、④ ADR-72 の撤退の頭の「数えるのは tsuzuri の設計の席で…記帳する」は置き換えない（(9) のとおり機械が読めないので、席の数えと毎日の監査のまま）。
  (9) 撤退の鍵の写し（ADR-83 の決定 (5) の読み手の入力）。値・向き・窓・行き先は替えない。替えずに写せない物は写さず U と書く。
    ・ADR-72 の (1)(3)〜(6): U。向きが「以上」か「1 度でも在る」で、閉じた向き（越える・下回る・前の窓より下がらない）に値を替えずに写せない。窓の始まり（段の着地）に機械の印が無い。
    ・ADR-82 の (1)〜(3): U。窓の始まり（席が選んだ構造の直しの行の組が全部着地した時刻）と終わり（10 本目）に機械の印が無い。
    ・ADR-77・ADR-80・ADR-81 の撤退: 既に鍵の形で写しは要らない。窓の始まりが行の着地か記録の発効の物だけを読み、ほかは U。
  (10) どの直しも、退けた案（差の file・席か設計係が完成した code か契約の字を作る形・止めた上限）を撤退の行き先に置かない（ADR-82 の決定 (4) と同じ縛り）。
  (11) 条文。この記録は条の字を替えない（amends を持たない）。規則の行 pipe.overlap_commute の消しは器の行 （v-patch-drop-b） の着地の commit で、この記録の承認の裁定を引く。
options:
  - id: a
    name: 甲 — ADR-60 を丸ごと置き換え、D1〜D7 と ①〜④ の扱いを 1 本に置く（削らない案・推奨）
    text: 決定 (1)〜(11)。
    verdict: adopted
    reason: |
      主張する利益: 差の file の道を器から消し、ADR-60 の死んだ決定（(6)(8)(9)(10)）を残さない（条 N-3）。席が契約を直す字と、退けた案と止めた上限へ戻る行き先を前の記録から外す。
      失う物: 持ち主が承認した ADR-74 の「値も行も替えずに残す」を覆す。器の code の消し（commute の module ほか）に器の便 1 本の量が掛かる。並べて流す道（交わる組の通し）を、差の file と一緒に失う。
  - id: b
    name: 乙 — ADR-60 は部分の置き換えで残す（第 1 稿の形）
    text: 決定 (2)〜(11) と、ADR-60 の決定 (1)〜(5)(7) だけの部分の置き換え。
    verdict: rejected
    reason: 置き換えた後の ADR-60 に生きた決定が残らず、(10) の古い字と (9) の ADR-1019 の置き換えが字のまま残る（v439 の A9）。
  - id: c
    name: 丙 — D1 を外す（ADR-74 の「残す」のまま器の commute を残す）
    text: 決定 (2)〜(10)。
    verdict: rejected
    reason: 差の file を書く者がいないのに器が差の file を読む道を持ち続け、条 N-3 の死んだ道と G4 の鍵 patch_paths が 0 にならない。
basis: [N-3, P-4, P-4.2, ADR-33, ADR-36, ADR-60, ADR-63, ADR-64, ADR-72, ADR-74, ADR-77, ADR-80, ADR-81, ADR-82, ADR-83, ADR-1019]
retreat:
  kind: measure
  condition: |
    数えは毎日の監査の検証役が器の event log の待ちの記録から完全に数え、席が memo （t3-hub.92.2） か後継の memo の notes に撃った命令と数を記帳する。問う相手は持ち主。差の file・（commute） の通し・席か設計係が契約か code の字を作る形は戻し先に置かない。各行は 鍵・向き・閾値・窓（条 P-4.2）。
    (1) 鍵（overlap_wait_hours_7d）（待ちの理由 overlap で待った bead の時間の和）・向き 越える・閾値 24 時間（ADR-60 の context の 3 日 2.6 時間の約 4 倍の 7 日の見立て・I）・窓 行 （v-patch-drop-b） の着地から末の 7 日 → 設計係の write-set の切り方と行の割り方を問う。
plain: |
  前の記録の字の食い違いを直します。
  1. 差の file（設計係が完成した code を書く形）の道を器から消します。前の記録 ADR-74 は「その規則の行は残す」と決めていましたが、それを覆します。差の file を持つ作業を同時に流す仕組みの記録 ADR-60 は、生きた決定が残らないので丸ごと退役させます。交わる作業は今と同じく器が順に流します。
  2. 「席が契約を直す」の字を「設計係に直させる」にします（2 か所）。
  3. 止めた上限と退けた案へ戻る逃げ道を、撤退の行き先から外します（2 か所）。
  4. 器の凍った設計文書の字を替える決めを外します。
  5. 「器の便は同時に 1 本」の古い字は、既に外した縛りとして読み替えます。
  6. 前の記録の撤退のうち、機械が期限を読めない物は、機械に写さず毎日の検証が数えます。
  失う物: 前の承認（ADR-74 の「残す」）を覆します。差の file を持つ作業を並べて流す道は無くなります。
consequences:
  - 器の入口は交わる契約を受け付けない形だけになる（今の振る舞いと同じ）。
  - ADR-80 の行 （t-refactor-trigger） は撤退の鍵を読まず、整理の引き金の鍵 3 つだけを持つ。
  - ADR-72 と ADR-82 の撤退は席の数えと毎日の監査に残り、（F2） の型（窓を席の記憶で開く）はこの 2 本では機械で止まらない。
approval:
  who: 持ち主
  date: 2026-10-07
  surface: R-8
  verbatim: 推奨で
  ruling: t3-hub.92.10.31（裁定 id = t3-hub.92.10.31:20261007T1053Z-1・差の道を消し ADR-60 を退役・案 甲）・t3-hub.92.10.32（裁定 id = t3-hub.92.10.32:20261007T1053Z-1・前の記録の直し D2〜D7・案 乙）・逐語は台帳 t3-hub.92.10 の notes
note: |
  起草は係 w443a。番号は design-intent/adr と起草の置き場を照らし、ADR-84 を名乗る記録が無い事を確かめた（置き場の席の notes が予告として名乗るだけ・design-intent/adr の 1084 番は器の記録 ADR-0084 の写しで別）。D1〜D7 の引きの字は （v439） の A15 が現物と照らした（V）。D1 の消す物に審査役の雛形の 33 行目の句を足したのは席の決め（台帳 t3-hub.92.2 の notes 2026-10-07T09:35Z）。
