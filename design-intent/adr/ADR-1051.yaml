  器の承認の欄: 設計 (orchestrator)・orchestrator・2026-09-21 起票 (審査の FAIL 104 件と実装席の問い 19 件の分類・契約表 161 行の欄の使用数・導出の現物・bd 1.1.0 の型と field と lint の現物を実測。 拘束する constitution の版 0.5.0)。 発効は約束の行の parse と導出が land した版・作成
  器の案の章の要約: 候補を 6 つ並べます。約束を子行にして導出と生成に置き換える案、散文を残して閉包の計算だけ足す案、約束を台帳の bead の field に置く案、実装席の回答で触る file の一覧を広げる案、memo を beads の独自の型で名乗る案、器が台帳へ直接起票する案です。
  器の専門語の説明: 本文に出てくる専門語を、やさしい言葉で説明します。
  ・約束の行（promise row）: 契約表の行の子行。 親の行 id・番号・約束の文・触る file・名指す識別子・歯の完全名・置き場・fixture の形・観測する結果の閉じた 9 欄を持ち、 器はここから write-set と verify と done を導く。 欄の集合の正本は core の型。
  ・Promised の行（promised row）: 子行の約束を 1 つでも持つ契約表の行。 手書きの write-set と done を持てず、 導出の入力も約束の行から組まれる。 手書きの行 (Declared) と導出の行 (Derived) に並ぶ 3 つ目の弁別で、 着地済みの行は移さない。
  ・4 象限（four-quadrant ledger state）: 台帳の bead の label intake:memo の有無と受入条件の設計 pointer の有無の組み合わせ。 label だけが memo、 pointer だけが契約、 両方在る形と両方無い形 (epic と裁定の bead を除く) は違反で、 台帳 lint が名指す。
  ・memo の 4 節（memo sections）: 出所 (run id・PR・裁定 id・user 逐語の在り処)・観測 (実測の事実)・候補 (0 個以上・却下も書く)・昇格条件 (要件 id か 要 ADR か 要 裁定) の 4 つ。 欠けは台帳 lint が数える。
  ・台帳の plan（ledger plan）: 全設計 doc の契約表の未着地の行から xtask が出す bd の graph の JSON。 title・受入条件の pointer 行・親の epic・label・depends の edge・出所の memo への edge を行から写す。 撃つのは席の手番で、 器は台帳へ書かない。
  ・写しの工程（copying step）: 設計者 (AI) が節の散文の約束を読み、 write-set と verify と done を手で欄に写す工程。 契約の審査で落ちた理由の 87 % の出所で、 本 ADR が器の導出に置き換える対象。
  器の頁の末: このページは、大もとの機械データ (正本) から自動で組み立てられています。構造は機械が自動で検査し、内容が元データに忠実かは独立のレビューで確かめます。
