  - "良い結果: 設計の変更と手の merge の着地も発端の trailer で案件へ結ばれ、 席の道具の merge の欠けは merge の時点で止まり、 画面や端末の merge の欠けも CI が名指す"
  - "代償: 跨版の面が増える (file 2 つ〔lifecycle.json と lifecycle.stale〕・版の欄と欄の名・局面の語・手番の値・event の kind IntakeRefused と LifecycleCutover・alarm の語 stale・trailer 1 種)。 語を消すか意味を変えるのは schema を壊す変更で、 憲法 N4 により器の新しい版でだけ行い (版の欄の整数も上げる)、 裁定面を先に直す手が要る"
  - "代償: 裁定 13:14Z に採った推奨の「台帳が動いた周」の書き直しを、 器の台帳の書きの直後に狭め、 席の台帳の書きは古さの印で示す (NFR1005 のため・常設の指示 00:54Z の下の orchestrator の決定)。 出力は書き直しの間は古い。 席の道具の呼び出しの台帳の書きと器の便でない merge (main が動く) は、 書き直さずに古さの印で「古い」と示されるだけで、 印の後に始まり印より新しい入力を読む全部の書き直し (dispatch の周・器の台帳の書きの直後・全部を書き直す口) まで直らず、 その間の部分の書き直しも印を消さない。 dispatch の周は timer を持たないので、 便が走らず口も撃たれない間は長く古いままになりうる (受け入れる限界)。 席の台帳の書きのたびに印が付くので、 便が走らない間は出力がほぼいつも古いと示される (全部を書き直す口を撃つ手順は設計 doc)。 門は書きの前に撃つが、 印は付けた時点の入力の印を持ち、 門が守る側の印 (起票の門は台帳の印・merge の門は main の sha) が印より新しい入力を読んだ書き直しだけが消すので、 印の後・書きの前に始まった書き直しは印を消さない。 門の後で書きが落ちた周は入力が動かず、 印は次の台帳の書きか main の動きまで残る (偽の「古い」・害は小さい)。 読めない周の印は入力の印を持たず、 在る間は読み手が出力を古いと示し、 印の後に始まり全部の入力を読めた全部の書き直しまで残る。 確定の契機に上げるには NFR1005 の改訂が要る"
  - "代償: 全部の書き直しは台帳の全部・event log・main の設計 doc と SRS と trailer を読み、 dispatch の周と器の台帳の書きの直後が重くなる。 発話 event の記帳の直後の書き直しは hook の中で走り、 NFR1005 が event log の大きさに依らない読みに縛るので、 部分の置き方 (台帳の大きさに比例する file を hook で読み書きしない形) を設計 doc が決める要 (lifecycle.json と lifecycle.stale の組の外の file が要るなら新しい ADR)"
  - "代償: 局面の語 (40 前後) と手番と一生の段の表との対応を設計 doc で保つ手が要る。 rules 行 (lifecycle.closed_window_h と局面ごとの lifecycle.age_h) の値に裁定 id が入るまで owned は出ない"
  - "代償: 管理 tick が合図を送らない席 (梯子の列が尽きた席・合図を止めた席) には owned も届かず、 doctor の行だけが知らせる (次の session の始まりには直近の流れの事実行も出す)。 FR1094 の 7 つの読み手 (便の終端の周の通知が便の段に添える 1 語・doctor の 3 つの行・alarm の語 unsorted と owned・直近の流れの事実行・FR1087 の通知の memo の数) は、 比べる印の組を読み手ごとに設計 doc に持ち、 出力が無いか読めない周は読めないと示す。 出力が古さの印を持つ周は alarm の語 unsorted と owned に stale が添わる"
  - "代償: merge の門は席の道具の呼び出しの command の字面しか見ず、 画面や端末の merge は CI の事後の検出だけになる。 CI は台帳に届かないので発端の id は形しか確かめず、 打ち違い (並べた id の 1 本でも台帳に無いもの) と event log に無い便を名指す器の便の trailer は misfit でだけ見え、 それも切り替えの線より後の commit だけである。 本文を渡せない merge の形は断られる"
  - "代償: merge の門と CI の main の検査は、 消費側の repo の席の merge と自 repo への PR の形 (--pr-cmd) の squash にも発端の trailer を要る。 --pr-cmd の PR は人が画面で merge する形なので、 門でなく CI が main に入った後で名指し (main が赤になる)、 発端の trailer を squash の本文へ渡す手順は設計 doc が持ち、 それが着くまではこの形の merge ごとに merge する者が trailer を足す手が要る。 裁定面は局面の出力の着地の結びを表示にだけ使い、 外部の道具は trailer を読む。 doctor の key と出力の欄も変わるので、 着地の前に消費側へ知らせ (ADR-1023 §2.5 の 1 文の置き換えも含む)、 設計 doc の欄の草稿を消費側の席に先に見せる手が要る"
  - "代償: 受付の断りは断った契約ごとに 1 件記帳するので、 同じ契約が周ごとに断られると event log が伸びる。 label intake:memo の定数を局面の関数が 5 つ目の読み手にしないよう、 実装の行で 1 か所へ寄せる手も要る"
  - "代償: 切り替えの線は state dir ごとに、 この版の器がその state dir で最初に全部を書き直した時刻で、 そのとき event LifecycleCutover (key version = 線を引いた器の版・key main = その書き直しが読んだ main の印) を 1 件だけ記帳し、 後の版は書き直さず読むだけにする (出力は導出物なので線を持たない)。 線が絞るのは閉じと着地の commit に由来する misfit (FR1092 の 3 つを含む) だけで、 ほかの misfit (どの局面にも当たらない部品・読める引き金の無い memo など) は線に依らない。 着地の commit は、 線を記帳した全部の書き直しが読んだ main の印より後に main へ入ったものを線の後とする (その書き直しが読んだ時点で main に在った commit は線の前)。 線の前の閉じと着地の commit は misfit に数えないので、 線より古い誤りは見えないまま残る。 binary を入れ替えてから最初の全部の書き直しまでの間は、 門がもう効いているのに、 その間の閉じと着地の commit も misfit に数えない (入れ替えの直後に全部を書き直す口を撃てば間は狭まる)"
