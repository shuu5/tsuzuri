plain: |
  この記録で「器」は scribe2 の本体、 「席」は器が立てる対話の AI の session、 「便」は契約 1 本を実装して main へ入れる 1 回の走り、 「台帳」は作業と裁定を記録する beads、 「裁定面」は消費側の project が持つ、 user が答えを書き込む画面です。 memo か台帳の問いを根にして、 そこから辿れる発話・問い・契約・便・着地のひとまとまりを「案件」、 その一つ一つを「部品」と呼び、 部品がいま一生のどこにいるかを「局面」、 次に動くべき者を「手番」と呼びます。 今は局面の判定が器の中の数か所 (待ちの理由・終端の語・settled・doctor の lint)・消費側の project の画面 2 つ・席の頭の中に分かれて互いに食い違い、 CI の結果待ちや受付の断りのように、 どこにも出ない段も残っています。 本 ADR は、 局面を器の 1 つの関数だけで決め、 その結果を器の置き場 (state dir) の 1 file (lifecycle.json) に書き、 器の知らせ・裁定面・席がその file を読むだけにして、 古い結果は古いと示す形を決めます。 席が長く放っている部品の数もこの file が持ち、 知らせはそれを読むだけです。 この file は前の版と次の版が共有する観測の面に加わるので、 ADR-1004 の観測の面の欄を部分的に置き換えます。 あわせて、 器の便を通らない着地 (設計の変更の PR など) に、 どの memo や問いから来たかを示す発端の trailer を求め、 merge の時点の門と CI で確かめます。 自 repo への PR の形を trailer の無い穴とした ADR-1023 の 1 文も、 この形で置き換えます。 要件 FR1090・FR1092・FR1094 を支え、 user の裁定 2026-09-28T12:46Z と 13:14Z の方向に沿います。
