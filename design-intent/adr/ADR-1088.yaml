  NFR1005（implementation）: NFR1005 (hook の予算・turn の終わりの判定の hook と発話の記帳の hook も event log の大きさに依らない読み) の内に、 発話の記帳の直後の部分の書き直しと、 起票の門と merge の門が書く古さの印を収める実装側。 収める形 (台帳の大きさに比例する file を hook で読み書きしない部分の置き方) は設計 doc が示し、 lifecycle.json と lifecycle.stale の組の外の file が要るなら新しい ADR を要する。 席の台帳の書きの後を受ける hook (PostToolUse) は足さない。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録は ADR-1004 と ADR-1023 を部分的に置き換えます。 ADR-1004 から置き換えるのは、 前の版と次の版が共有する面のうち観測の面の欄だけで、 そこに lifecycle.json と古さの印の file を足します。 既存の event log と export の形は変えず、 event log には kind を 2 つ足し、 器の便でない commit には発端の trailer を 1 種足します。 ADR-1023 から置き換えるのは、 自 repo への PR の形を trailer の無い穴とした 1 文だけで、 その形の merge にも発端の trailer を求めます。
  改訂状態: current
  置き換える ADR: ADR-1004, ADR-1023
  置き換えられた: なし (現行)
  部分 supersede で、 ADR-1004 から置き換えるのは §2.2 の表の面 2 (観測) の「v2 側の形」の欄だけである。 <state_dir>/fleet/events.jsonl (schema 1) と fleet export に、 局面の出力 <state_dir>/fleet/lifecycle.json (版の欄・局面の語の一覧・入力の印・生成の時刻を持ち、 rename で丸ごと入れ替え、 読み手の約束を持つ) を足す。 同じ dir に古さの印の file <state_dir>/fleet/lifecycle.stale も足し、 2 つの組を局面の出力とする。 lifecycle.stale は lifecycle.json と同じ規則の版の欄を持ち、 印の種類は閉じた 3 つ (起票の門・merge の門・読めない周) で、 種類ごとに印を 1 つまで持ち、 同じ種類の後の印が前の印を置き換える。 印は、 起票の門が席の道具の呼び出しの台帳の書きを通したとき・merge の門が器の便でない merge を通したとき・入力を読めない周に、 書き直さずに種類と時刻を書き、 門の 2 種はその時点の入力の印も書く。 起票の門と merge の門の印は、 印の後に始まり種類に対応する入力の印が印の値より新しい全部の書き直しだけが消す。 読めない周の印は入力の印を持たず、 在る間は読み手が出力を古いと示し、 印の後に始まり全部の入力を読めた全部の書き直しが消す。 events.jsonl と fleet export の形・path・schema 版は 1 字も変えず、 event の kind を 2 つ (IntakeRefused と LifecycleCutover) 足すだけ。 LifecycleCutover は key version (線を引いた器の版) と key main (その書き直しが読んだ main の印) を持ち、 state dir ごとに、 この版の器がその state dir で最初に全部を書き直した時に 1 件だけ記帳し、 後の版は書き直さず読むだけにする (IntakeRefused の kind と key は決定の (6))。 着地の commit は、 線を記帳した全部の書き直しが読んだ main の印 (key main) より後に main へ入ったものを線の後とする。 §2.5 の schema の規則 (欄を足す変更は同じ番号・読めなくなる変更は新しい版) は 2 つの file の版の欄 (整数) にもそのまま掛け、 局面の語を足す変更も同じ番号に数える (読み手は知らない語を「まだ分からない」と描く)。 ほかの面 (所属・台帳・停止・oracle) と §2.1 / §2.3 / §2.4 は変えない。 ADR-1023 から置き換えるのは、 §2.5 の「自 repo への PR の形 (--pr-cmd) を trailer も記録も持たない恒久の穴として明示する」1 文だけである。 その形の PR の squash も run: の trailer を持たないので、 merge の門と main-provenance の広げは器の便でない commit と同じに扱って発端の trailer (値は契約の bead の id) を要り、 穴は局面の出力の上で発端の trailer により案件へ結ばれる (器の記録を持たないのは変わらない・渡す手順は設計 doc)。 ADR-1023 §2.5 のほかの文 (便の run: と契約と要件の trailer・着地の事実の正本は器の記録・外部の道具が着地を読む口は trailer 1 つ・trailer の無い commit は「まだ分からない」) は変えない。 残す文の trailer は便の trailer (run: と契約と要件) を指し、 発端の trailer は外部の道具が着地を読む口ではない。 --pr-cmd の squash は契約と要件の trailer を持たないままで、 外部の道具の読みは「まだ分からない」のままであり、 案件へ結ばれるのは局面の出力の上だけである。 ADR-1023 §3 の Negative と §5 の合意 G-d の同じ句も、 この 1 文の範囲で読み替える。 局面の出力は観測の面で、 着地の commit の結びは trailer と器の記録から導いた写しにすぎず、 外部の道具が着地の事実を読む口を 2 つ目に増やすものではない。 器の便でない commit には発端の trailer を 1 種足す。 名は既存の契約と要件の trailer と同じく NAME から導き (NAME の頭を大文字にした語に -Source・本 repo では Scribe2-Source・run: は literal のまま)、 NAME を替えれば名も替わる (C2.2 の向き)。 値は 1 行以上で、 各行の値は空白で区切った台帳の bead の id の 1 本以上の列 (既存の要件の trailer と同じ列の形)。 trailer の無い既存の commit は「まだ分からない」の読みのままで、 trailer の無い commit のうち misfit に数えるのは、 切り替えの線より後の、 発端の trailer も器の便の trailer も持たない器の便でない commit だけである。 ADR-1051 が台帳 lint に課した名指し (memo へ辺の無い契約・辿れない memo) の義務は変えず、 その判じ手のうち局面の misfit と memo の局面に代わる部分を局面の関数へ寄せる (memo の close の条件の置き換えは FR1091 の決定記録が持つ)。 ADR-1045 の dispatcher と便の終端の周の通知の契機・宛先・1 行の形は変えず、 語の判じ手だけを寄せる。 ADR-1083 と ADR-1084 の置き場の file と alarm の型 (unreflected・floor) は変えず、 同じ型で語 owned を足す (語 unsorted は FR1088 の決定記録が足す)。 ADR-1058 の管理 tick の周期と梯子は変えない。 ADR-1082 と同じく、 消費側が読む形は歯で保つ約束とする。 path・file 名・版の欄の規則・読み手の約束を変えるときは新しい ADR を要し、 語と欄を足すだけなら設計 doc の 1 節の改稿で足りる。
  照会終端 — PRIN-ONE-JUDGE-MANY-READERS
  案件の部品がどこにいて次に誰が動くかは、 器の 1 つの関数だけが決め、 器の知らせも裁定面も席もその出力を読むだけにする。 出力は導出物で、 真実は event log と台帳と git に残す。
  本 ADR が、 消費側の自前の計算・読むたびの命令・遷移の event・窓で落とす入力を退け、 1 つの関数の出力を 1 つの file に書く形を採ったのはこの原則に行き着く (これ以上は遡らない照会終端)。 射程は局面と手番と理由と結びで、 便の生の時刻の列と台帳の中身 (問いの本文・notes) と発話の逐語には当てない。
options:
  - id: "OPT1"
    name: "器の 1 つの関数が局面を導いて state dir の 1 file に書き、 読み手は file を読むだけにする。 器の便でない着地は発端の trailer と merge の門で結ぶ"
    text: |
      器は 1 つの関数で案件の部品 9 種ごとに局面・手番・since・理由・結びを導き、 <state_dir>/fleet/lifecycle.json（一生の位置を書く file） を丸ごと入れ替えて書く。 全部の書き直しは dispatch の周・器の台帳の書きの直後・全部を書き直す口で、 event log と時刻で決まる部分は管理 tick の周と発話 event か仕分けの event の記帳の直後に台帳も git も撃たずに書き直す。 席の道具の呼び出しの台帳の書きと器の便でない merge は、 門が書き直さずに古さの印（出力が古いという目印） (その時点の入力の印を持つ) を置き、 印の後に始まり印より新しい入力を読んだ全部の書き直しだけが消す。 器の知らせ・doctor・事実行・裁定面は局面の語をこの関数か出力から得て、 古い出力を古いと示す。 受付の断りを event にし、 器の便でない着地の commit に発端の trailer を要り、 merge の門と main-provenance で確かめる。 決め手は裁定 12:46Z・13:14Z (問い 3 の推奨と消費側の条件) と分析 (OPT2〜OPT8 の欠点)。
      （平易）選んだ案です。 器は 1 つの関数で、 案件の部品 9 種 (発話・台帳の問い・memo・契約・開いた契約の最新の便・契約表の行・要件・epic・器の便でない着地の commit) ごとに、 いまの局面・次に動くべき者 (手番)・その局面に入った時刻・理由・つながり (どの発話や memo から来て、 どの契約と便と commit へ進んだか) を導きます。 どの局面にも当たらない部品は「misfit (当てはまらない)」と理由の語で出します。 結果は state dir の lifecycle.json に、 書きかけを見せないよう丸ごと入れ替えて書き、 版の欄と「何を元に作ったか」の目印 (入力の印) を持たせます。 全部を書き直すのは、 便を起こす周 (dispatch の周)・器が台帳を書いた直後・全部を書き直す口を撃ったときで、 管理 tick の周と発話や仕分けの記録の直後は event log と時刻で決まる部分だけを書き直します。 席が自分で台帳を書いた後と、 器の便でない merge で main が動いた後は受ける仕組みが無いので、 門が書き直さずに「古い」という印をその時点の目印と一緒に置き、 印の後に始まって印より新しい入力を読んだ全部の書き直しだけがそれを消します (便が走らない間は長く古いままになりうる限界を受け入れます)。 器の知らせ・doctor・事実行・裁定面は、 この結果を読むだけで、 古い結果は古いと、 読めない結果は読めないと示します。 受付の断りは event にし、 器の便でない着地の commit には発端の trailer を求め、 merge の門と CI で確かめます。 皆が同じ語を見て、 読む側も軽く、 切り替えの線より後の死角は「当てはまらない」として数えられます。 代わりに、 版を跨ぐ約束が増え、 結果が古い間があり、 書き直しが重く、 語と表の手入れが要り、 merge の門は形しか見ず消費側の repo にも効き、 断りの event で記録が伸びることを引き受けます。 user の裁定 12:46Z と 13:14Z (消費側の席の条件を入れた推奨) に沿う案です。
      利点: 判じ手が 1 つで、 器の知らせ・裁定面・席が同じ語を見るので、 器の整理と見せ方の 1 対 1 が作りの上で保たれる (DR1)
      利点: 読み手は file を 1 回読むだけで、 process も台帳の読みも読みの道に載らない (DR2)
      利点: 版の欄と読み手の約束で、 古い読み手は新しい語を「まだ分からない」と描き、 file が無いか読めない版の周は「測れない」と出す (DR3)
      利点: 窓を表示にだけ掛けるので、 閉じた bead を要る判定 (行の bead・未反映の裁定・引き金の依存) が誤らない (DR4)
      利点: どの局面にも当たらない部品は misfit で出て、 無音だった CI 待ち・閉じ損ね・受付の断り・席の手番の放置が局面と年齢と alarm の語 owned で見える (DR4)
      利点: 席の道具の merge の欠けは merge の時点で止まり、 画面や端末の merge の欠けも CI が事後に名指す (DR5)
      利点: alarm_word と doctor の (vi)(viii) の自前の判定を消して足し、 file は導出物で真実を持たない (DR6)
      欠点: 跨版の面が広がる (file 2 つ〔lifecycle.json と古さの印〕・版の欄と欄の名・局面の語・手番の値・event の kind 2〔IntakeRefused と LifecycleCutover〕・trailer 1)。 語を消すか意味を変えるのは schema を壊す変更で、 器の新しい版でだけ行い (N4・版の欄の整数も上げる)、 裁定面を先に直す手が要る
      欠点: 出力は書き直しの間は古い。 席の道具の呼び出しの台帳の書きと器の便でない merge は受ける hook が無いので、 門が書き直さずに置く古さの印で読み手が「古い」と示すだけで、 印より新しい入力を読む全部の書き直しまで出力は直らず、 その間の部分の書き直しも印を消さない。 dispatch の周は timer を持たないので、 便が走らず全部を書き直す口も撃たれない間は長く古いままになりうる (受け入れる限界)
      欠点: 全部の書き直しは台帳の全部・event log・main の設計 doc と SRS と trailer を読むので、 dispatch の周と器の台帳の書きの直後が重くなる。 発話 event の記帳の直後の部分の書き直しは hook の中で出力を読み書きし、 NFR1005 の重い I/O の線に近づく
      欠点: 局面の語は 40 前後になり、 語と手番と一生の段の表との対応を設計 doc で保つ手が要る。 rules 行が増え (lifecycle.closed_window_h と局面ごとの lifecycle.age_h)、 値の裁定までは owned が出ない
      欠点: merge の門は席の道具の呼び出しの command の字面しか見ず、 CI は台帳に届かないので、 発端の id は形しか確かめない。 打ち違えても形が合えば通り、 misfit でだけ見える。 本文を渡せない merge の形 (rebase) は断られる
      欠点: merge の門は marker が器の名を言う repo の全部で効くので、 消費側の repo の席の merge も発端の trailer を要る
      欠点: 受付の断りは断った契約ごとに周ごとに 1 件記帳するので、 同じ契約が周ごとに断られると event log が伸びる
    verdict: adopted
    reason: "決め手は裁定 12:46Z・13:14Z (問い 3 の推奨と消費側の条件) と分析 (OPT2〜OPT8 の欠点)。"
  - id: "OPT2"
