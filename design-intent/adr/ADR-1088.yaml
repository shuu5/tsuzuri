  器の案の章の要約: 候補を 8 つ並べます。 器の 1 つの関数の出力を 1 つの file に書き、 器の便でない着地を発端の trailer と merge の門で結ぶ案 (選んだ案)、 消費側が器の語を写して自前で判じる今の形、 読むたびに器の命令を撃つ案、 局面の移りを event として記録する案、 閉じた bead を窓で入力から落とす案、 設計の変更も器の便にする案、 発端の trailer を任意にする案、 PR の段の CI で本文を確かめる案です。 後ろの 3 つは、 器の便でない着地の結び方の候補です。
  器の専門語の説明: 本文に出てくる専門語 13 個を、 やさしい言葉で説明します。
  ・案件（case）: 根の部品 1 つ (memo か台帳の問い) と、 そこから結び (SRS FR1090) で辿れる部品と結びの束。 台帳の bead 1 本 (issue) とは別の語で、 1 つの発話は複数の案件の根へ仕分けられる。
  ・部品（part）: 局面の出力 (SRS FR1090) が局面と手番を導く単位で、 閉じた 9 種 (発話・台帳の問い・memo・契約・開いた契約の最新の便・契約表の行・要件・epic・器の便でない着地の commit)。
  ・局面（lifecycle position）: 部品が一生のどこにいるかを表す閉じた語 (SRS FR1090)。 優先の順は enum の宣言順 (C2) で、 語の一覧と優先の順と一生の段の表との対応は設計 doc の 1 節が持ち、 memo の局面の語と順は SRS FR1091 が持つ。 便の段とは別の語で、 便の段の値は便の部品の局面へ写る。 どの局面にも当たらない部品と FR1091・FR1092 が定める部品は misfit。
  ・手番（next mover）: 局面ごとに、 次に動く番が誰にあるかを表す閉じた 6 値 (user・seat・vessel・runner・ci・none・SRS FR1090)。 局面 (契約の待ちでは待ちの理由も) から手番への対応は設計 doc の 1 節が正本。 手番が seat のまま年齢の閾値を越えた部品 (席の手番の閾値越え・要件の部品を除く・SRS FR1090) は出力が件数と最古を持ち、 管理 tick が alarm の語 owned で知らせる。
  ・lifecycle.json（lifecycle file）: 局面の出力の本体の file (state dir の下の fleet/lifecycle.json・観測の面の 1 種)。 版の欄・局面の語の一覧・入力の印・生成の時刻・席の手番の閾値越えの件数と最古の 1 件と、 部品ごとの局面・手番・since・理由・結びを持ち、 一時 file からの rename で丸ごと入れ替わる。 導出物で真実を持たず (切り替えの線も持たない)、 消えても全部の書き直しで戻る。 発話の部品は ts・session・行き先だけで逐語を載せない。 器は同じ中身を text で出す口と、 全部を書き直す口を持つ。
  ・入力の印（input mark）: 局面の出力 (SRS FR1090) が持つ、 書き直しが読んだ台帳・event log・main の状態の印 (台帳の印・event log の長さ・main の sha)。 書き手は印が今の file より古い書きを捨て、 読み手は自分が読める今の印と比べて出力の古さを判じる (SRS FR1094・比べる組は読み手ごとに設計 doc)。
  ・古さの印（stale mark）: 局面の出力 (SRS FR1090) に付く印で、 lifecycle.json と同じ dir の file lifecycle.stale。 版の欄を持ち、 起票の門が席の道具の呼び出しの台帳の書きを通したとき・器の hook の入口が器の便でない merge を通したとき・入力を読めない周に、 書き直さずに種類と時刻を書く。 種類はこの 3 つに閉じ、 種類ごとに 1 つまでで、 同じ種類の後の印が前の印を置き換える。 門の印は付けた時点の入力の印を持ち、 印の後に始まり種類に対応する入力の印 (起票の門は台帳・merge は main) が印の値より新しい全部の書き直しだけが消す。 読めない周の印は入力の印を持たず、 在る間は読み手が出力を古いと示し、 印の後に始まり全部の入力を読めた全部の書き直しが消す。 部分の書き直しは消さない。 読み手はこの印を見て古い出力を古いと示す (SRS FR1094)。
  ・書き直しの契機（rewrite triggers）: lifecycle.json を書き直す時の 2 層。 全部の書き直しは dispatch の周・器が台帳を書いた直後 (bind・裁定面の答えの口・land の終端の close・memo の自動の close〔FR1093〕)・全部を書き直す口が撃たれたとき。 event log と時刻で決まる部分 (発話・仕分けで結んだ発端・便の局面・年齢と席の手番の閾値越え・前の全部の書き直しが残した期日の引き金の満ち) だけの書き直しは管理 tick の周と発話 event か仕分けの event の記帳の直後で、 台帳も git も撃たず、 event log の大きさに依らない読みだけを持つ (NFR1005)。 席の台帳の書きと器の便でない merge は書き直さず、 古さの印を置くだけ (SRS FR1090)。
  ・misfit（misfit）: 局面の出力 (SRS FR1090) で、 どの局面にも当たらない部品と、 SRS FR1091・FR1092 が定める形 (読める引き金の無い memo・閉じの誤り・台帳に無い id を 1 本でも持つ発端・event log に無い便を名指す trailer・trailer の無い器の便でない commit など) の部品に付ける局面の値。 閉じた理由の語を添え、 一覧と字面は設計 doc の 1 節が閉じる。 閉じと着地の commit に由来する判定 (FR1092 の 3 つを含む) は切り替えの線より後の記録にだけ掛け (着地の commit は線を記帳した全部の書き直しが読んだ main の印より後に main へ入ったもの)、 ほかの判定は線に依らない。 手番は設計 doc の対応表が決める (seat を想定)。
  ・owned（owned）: 管理 tick の打刻の合図の末尾に足す alarm の語の 1 つ (SRS FR1027)。 局面の出力が持つ席の手番の閾値越え (SRS FR1090) の件数が 1 以上の周に出て、 出力が古さの印を持つ周は閉じた 1 語 stale が添う。 alarm の語は出力の値だけで決め、 tick の alarm の判定は台帳を読まない。 年齢と閾値越えは管理 tick の周の部分の書き直しが書き直す (閾値をその書き直しが読むか、 全部の書き直しが部品ごとの期限を出力に写すかは設計 doc)。
  ・発端（origin）: 部品を生んだ上流。 memo なら生んだ発話で、 その結びの正本は仕分けの event (SRS FR1088)。 器の便でない着地の commit なら、 発端の trailer が名指す台帳の bead (SRS FR1092)。 発端の trailer の名は既存の契約と要件の trailer と同じく NAME から導き (NAME の頭を大文字にした語に -Source・本 repo では Scribe2-Source)、 各行の値は空白で区切った bead の id の 1 本以上の列。
  ・merge の門（merge gate）: 器の hook の入口が、 席の道具の呼び出しの PR の merge の command を実行の前に読み、 渡す commit の本文が発端の trailer か run: の trailer を持たなければ欠けを名指して断る段 (SRS FR1092)。 trailer の形だけを見て台帳は読まず、 着地の列の窓の門と同じ command を読む。 器の便でない merge を通したときは、 書き直さずに古さの印を置く。
  ・観測の面（observation face）: 前の版と次の版が共有する 5 つの面の 2 つ目 (ADR-1004 §2.2)。 event log と fleet export に、 本 ADR で lifecycle.json と古さの印の file が加わる。 path と file 名は版に依らず固定し、 変えるときは新しい ADR を要する。
