# 判断の記録 ADR-1088 — 器 scribe2 の判断の記録 ADR-0088 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1088
title: "案件の部品の局面は器の 1 つの関数で決めて state dir の 1 file に書き、 器の知らせ・裁定面・席が同じ file を読む — 局面の出力を観測の面の 1 種に足し (版の欄・読み手の約束・書き直しの契機の 2 層・呼ぶ向き・受付の断りの event)、 器の便でない着地は発端の trailer と merge の門で案件へ結ぶ (ADR-1004 §2.2 の面 2 と ADR-1023 §2.5 の 1 文を部分 supersede)"
status: accepted
date: 2026-09-28
context: |
  案件の部品が一生のどこにいて、 次に誰が動くかを、 今は器の中の数か所 (待ちの理由・終端の語・settled・doctor の lint)・消費側の画面 2 つ・席の頭が別々に判じ、 互いに食い違い、 どこにも出ない段も残る。 本 ADR は、 判じ手を器の 1 つの関数にし、 その出力を state dir の 1 file に書き、 器の知らせ・裁定面・席がその file を読むだけにする形と、 器の便でない着地を発端の trailer で案件へ結ぶ形を決める。
  なぜこの判断が要るのかを 6 つで示します。 局面の判定が 4 か所に分かれて食い違い、 どこにも出ない段があること (事象)。 観測の面と、 置き場の file を周が書いて管理 tick が数える型が既に在ること (現物)。 継ぎ目の機械の確かめが 2 本しかなく、 器の便でない着地が案件へ結ばれないこと (現物)。 user の裁定の方向と、 消費側の席が出した条件 (裁定)。 憲法と既存の決定の向き。 動かすものと動かさないものの射程です。
  CTX1 事象 — 案件（根から辿れる束）の部品（一生を追う単位）が一生のどこにいるかの判定が 4 か所に分かれて食い違い、 どこにも出ない段が残る
  案件の部品 (発話・台帳の問い・memo・契約・便・契約表の行・要件・epic) が一生のどこにいて次に誰が動くかを決める判定は、 今 4 か所 (器・消費側の画面 2 つ・席の頭) に在る。 1 つ目は器の中の数か所で、 起動の列の待ちの理由 (WaitReason・閉じた型)・便の終端の周の通知の語を決める dispatcher の alarm_word・終端に達した便を列から外す settled が別々に判じ、 doctor の台帳 lint の (vi) (memo を名指すのに辺の無い契約) と (viii) (辿れる契約が全部閉じた開いた memo) も別の判じ手を持つ。 2 つ目は器の外で、 消費側の project の 1 つが画面を 2 つ持ち、 それぞれ器の語を写して局面（一生のいまの位置）を自前で計算する。 2 つの画面は互いにも器とも食い違う (受付と実装中を区別しない・CI の結果を待つ便を着地に畳む・止めた便の扱いが画面ごとに違う)。 3 つ目は席の頭の中で、 圧縮で消える。 どこにも出ない段も在る: 受付の断りは起動の log の散文だけで event にならず、 CI の結果を待つ便と着地したが台帳で閉じていない契約は無音で、 契約表の行に bead が無いことと要件に行が 1 本も無いことを数える者はいない。 2026-09-28 には席が CI 待ちの便を 0 本と数え違えた。
  CTX2 現物 — 観測の面（外が読む器の記録）は event log と export の 2 つで、 置き場の file を周が書き管理 tick が数える型が既に在る
  ADR-1004 §2.2 は前の版と次の版が共有する 5 つの面を固定し、 面 2 (観測) を <state_dir>/fleet/events.jsonl と fleet export に置いた。 §2.5 は行と file に整数の schema を持たせ、 欄を足す変更は同じ番号・読めなくなる変更は新しい版とする。 ADR-1023 §2.5 は着地の commit の trailer を外部の道具が読む唯一の口とし、 trailer を持たない commit は「まだ分からない」と読み、 自 repo への PR の形 (--pr-cmd) を trailer も記録も持たない恒久の穴とする。 未反映の裁定 (FR1084) と床の検査 (FR1085) には、 dispatch の周が置き場の file を書き、 管理 tick がその file だけを読んで alarm の語を決める (台帳も git も撃たない) 型が在る。 管理 tick は既に event log の全部を読む。 器の plugin の hooks.json の hook は SessionStart・PreToolUse・PermissionRequest・UserPromptSubmit・Stop・PreCompact の 6 つで PostToolUse は無く、 plugin の hooks.json の matcher は道具の名でしか絞れない (command の字面で絞る「if」は設定の hook だけが持つ・2026-09-28 の実測)。 NFR1005 は道具 1 回の呼出しの hook を binary 2 回以内・各 2.0 秒以内・重い I/O なしに縛り、 NFR1006 は封じ込めの外で走る器の子 process を 0 本にする。 台帳の現在地の読み (status 級) は 1 回約 0.35 秒 (ADR-1045 の実測) で、 負荷の高い時は 2 秒を越え、 event log は 7 MB を越える。 起動の列は周期の timer を持たない (FR1068)。
  CTX3 現物 — 継ぎ目の機械の確かめは 2 本だけで、 器の便でない着地は案件へ結ばれない
  機械が今確かめる継ぎ目は、 設計 pointer の無い契約を起こさないこと (FR1068) と、 契約表の行の要件 id が SRS に在ること (契約表の検査) の 2 本である。 器の便は着地の commit に run: と契約と要件の trailer を書き (契約と要件の trailer の名は NAME から導く接頭辞を持ち、 run: は literal)、 案件の便と着地が結ばれる。 設計の変更 (SRS・ADR・設計 doc の PR の squash) と手の merge は bead も trailer も持たず、 どの memo や問いから来たかが main に残らない。 CI の main-provenance は main への push の時だけ撃ち、 HEAD が PR の squash (件名の末尾の (#N)) か run: の trailer を持つことを確かめる。 PR の段の CI は squash の本文を見られない (本文は merge の時に決まり、 merge する者が差し替えられる)。 器の hook の入口は既に席の道具の呼び出しの gh pr merge の command を読み、 着地の列の窓が閉じている間は断る (設計 vessel-hook §14)。
  CTX4 裁定 — 器の整理と見せ方を 1 対 1 にし、 局面の計算を器の 1 か所にまとめ、 裁定面は描くだけにする
  user は 裁定 id user 2026-09-28T12:46Z で、 user の発話から画面への反映までの一生を器の席・消費側の席・user の 3 者で整理し直し、 器の整理と見せ方を 1 対 1 にし、 LLM の席にも死角を残さない方向を決めた (memo s2-07l.739)。 裁定 id user 2026-09-28T13:14Z は、 局面の計算を器の 1 か所にまとめ、 裁定面は描くだけにする推奨を採った (問い 3)。 その推奨は消費側の席の意見を入れた形で、 器が局面の出力を state dir の file に書き (台帳か event が動いた周と管理 tick の周)、 裁定面と席はその file を読むだけにし、 読みの道に process を起こさない (消費側の台帳の読みは負荷の高い時 2 秒を越える)。 出力は版の欄を持ち、 知らない局面の語は「まだ分からない」、 出力が無いか器が古い周は「測れない」と描き、 便の生の時刻の列は event log のまま、 出力は state dir ごとに 1 つとする。 一生の段の表 (user に示した 25 段) の全部を出力に入れ、 裁定面は台帳を中身の表示 (問いの本文・notes) にだけ読む。 仕分け済みの発話の行き先 (どの memo・どの裁定・会話) も画面に出す (問い 1・裁定 id user 2026-09-28T13:12Z)。 逐語は台帳にだけ在る。
  CTX5 憲法と既存の決定の向き — 判定は 1 つの関数・真実は導出物に置かない・編集の時点で止める・消すものを先に名指す
  C2 は選定・除外・routing を 1 つの enumeration の上の 1 つの関数にし、 適用の順を enum の宣言順だけから取り、 順の散文を持たず、 新しい理由は変種 1 つで表すと定める。 C3 は真実を host ごとの dir・TSV・cache に置かず、 C10.2 は報告と一覧を生成物だけにする。 C16 は仕様からの逸脱を編集の時点で止め、 事後の確かめで代えない。 C17.2 は走査・記録・rules 行・仕組みを足す前に消すものを名指させ、 N2 は散文にしか無い規則を規則と認めない。 C5 は rules 行の値に user の裁定 id を要る。 ADR-1045 は観測を実測で要ると分かってから足すとし、 2 つの画面の食い違いは実測である。 FR1065 は発話 event の逐語を一覧へ運ばない。 FR1027 は管理 tick の alarm を置き場の file だけから決め (台帳も git も撃たない)、 合図を送らない周の席 (梯子の列が尽きた席・合図を止めた席) には alarm も届かない。 doctor の出力の key は裁定面が読むので、 key を変える便の前に消費側へ知らせる約束が在る (memo s2-07l.692)。
  CTX6 射程 — 動かすのは観測の面の 1 種・判じ手の寄せ・受付の断りの event・発端の trailer と merge の門（merge を止める門）の 4 つ
  動かすのは、 (1) 局面の関数と、 その出力 (観測の面の新しい 1 種・版を跨ぐ形・書き直しの契機・古さの印)、 (2) 便の終端の周の通知の語・doctor・管理 tick の alarm (語 owned（席の放置の知らせ）)・直近の流れの事実行の判じ手を局面の出力へ寄せること (読み手の約束)、 (3) 受付の断りの event の kind、 (4) 器の便でない着地の発端（どこから来たか）の trailer と merge の門と main-provenance の広げ、 の 4 つで、 要件は SRS 版 0.29 の FR1090・FR1092・FR1094 と FR1027・FR1042・FR1044・FR1051・FR1068・NFR1005 の改訂が持つ。 動かさないのは、 event log の schema 版と既存の kind・fleet export・起動の列の判定と待ちの理由・受付の判定・便の段・着地の手順・既存の trailer・発話の仕分けの形 (FR1088)・memo の局面の語と順と処置 (FR1091)・rules 行の値 (裁定 id を待つ) である。 判定の HOW (関数の個数・呼ぶ向き・書き手の直列化・file の名と欄・古さの印の置き場) は本 ADR と設計 doc の領分で、 SRS は FR1090 に書き手の WHAT (部品ごとの欄・版と入力の印（読んだ入力の版の目印）と古さの印・席の手番（次に動く者の番）の閾値越えの件数と最古・書き直しの契機と入力と範囲・古さの印の付け方と消し方・古い入力の書きを残さないこと) を、 FR1094 に 7 つの読み手の WHAT (同じ判定の結果を使い自前の判定を持たないこと・書きかけを見ないこと・出力の印を今の印と比べて古い出力を古いと示すこと・text の口) を持つ。 局面の語の一覧と優先の順と一生の段の表との対応・局面 (契約の待ちでは理由も) から手番への対応・misfit（どこにも当たらない印） の理由の語の閉じた一覧は設計 doc の 1 節が正本で (memo の局面の語と順は FR1091)、 欄の名と JSON の形・入力の印の形と古さの比べ方も設計 doc が持つ。 ADR を書く条件のうち 1 (C2・C3・C16 の読み)・3 (file・event の kind・trailer は版を跨ぐ形)・4 (却下案を残す価値のある分岐) に当たる。
  （選択肢を測るものさし）この判断を評価する 6 本のものさしです。 局面を決めるのは器の 1 つの関数だけで、 皆が同じ語を見ること。 読む側に process も台帳の読みも載せないこと。 版を跨いでも読み手が壊れず、 古さと測れなさが見えること。 どの部品も局面か「当てはまらない」のどちらかに出て、 無音の段が残らないこと。 継ぎ目の欠けは編集の時点で止めること。 足すものを最小にし、 消すものを名指し、 真実を出力に置かないことです。
  DR1｜局面を決める判じ手は器の 1 つの関数だけで、 器の知らせ・裁定面・席が同じ語を見る (C2・裁定 12:46Z と 13:14Z) CTX1・CTX4・CTX5
  DR2｜読み手の道に process も台帳の読みも載せず、 hook の予算 (NFR1005) と封じ込め (NFR1006) を越えない CTX2・CTX4
  DR3｜版を跨いで読み手が壊れず、 出力の古さと測れなさが読み手に見える (ADR-1004 §2.2 / §2.5) CTX2・CTX4
  DR4｜どの部品も局面か misfit のどちらかに出て、 無音の段と席の手番の放置が残らない CTX1・CTX3・CTX4
  DR5｜継ぎ目の欠けは編集の時点で止め、 事後の検出を添える (C16) CTX3・CTX5
  DR6｜足すものを最小にし、 消すものを名指し、 真実を出力に置かない (C3・C17.2) CTX5・CTX6
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 器は 1 つの関数で案件の部品 9 種ごとに局面・手番・時刻・理由・つながりを導き、 state dir の lifecycle.json を丸ごと入れ替えて書きます。 器の知らせ・doctor・直近の流れの事実行・裁定面はこの結果を読むだけで、 古い結果は古いと示します。 受付の断りを event にし、 器の便でない着地の commit には発端の trailer を求め、 merge の門と CI で確かめます。
  採用 — OPT1
  本 ADR は局面の出力を ADR-1004 §2.2 の面 2 (観測) に足し (その欄を部分 supersede)、 局面と手番の判定に C2 の「1 つの関数・宣言順」を当てる。 (1) 器 SHALL 1 つの関数で、 部品 9 種ごとに、 局面 (閉じた語)・手番 (user・seat・vessel・runner・ci・none)・since・理由 (既存の語をそのまま)・結び (発端・子の問い・昇格した契約・便・着地の commit・発話の行き先) を導き、 どれにも当たらない部品と FR1091・FR1092 が定める部品を misfit と閉じた理由の語で出す。 窓 (rules 行 lifecycle.closed_window_h) は局面が終わりの close した部品の表示にだけ掛ける。 閉じと着地の commit に由来する misfit は、 切り替えの線 (この版の器がその state dir で最初に全部を書き直した時刻・event LifecycleCutover〔key version・main〕に 1 度だけ残し後の版は動かさない) より後の記録にだけ掛ける (着地の commit は key main の印より後に入ったもの・他の misfit は線に依らない)。 関数は起動の列の関数を呼び、 逆は呼ばない。 (2) 出力 SHALL state dir ごとに 1 つ、 <state_dir>/fleet/lifecycle.json と同じ dir の lifecycle.stale (古さの印) の組で、 どちらも版の欄を持ち、 前者は局面の語の一覧・入力の印 (台帳の印・event log の長さ・main の sha)・生成の時刻・席の手番の閾値越えの件数と最古の 1 件を持ち、 一時 file からの rename で丸ごと入れ替え、 書き手は lock で 1 つずつ、 入力の印が今の file より古い書きは捨てる。 (3) 全部の書き直し SHALL dispatch の周・器が台帳を書いた直後・全部を書き直す口で撃ち、 管理 tick の周と発話 event か仕分けの event の記帳の直後は台帳も git も撃たず、 event log と時刻で決まる部分 (年齢と閾値越えを含む) だけを書き直す。 起票の門が席の道具の呼び出しの台帳の書きを、 merge の門が器の便でない merge の command を通したときと、 入力を読めない周 (理由を記帳する) は、 書き直さずに lifecycle.stale に種類 (この 3 つに閉じ、 種類ごとに 1 つ・後の印が置き換える) と時刻と、 門の印ならその時点の入力の印を書き、 印の後に始まり、 種類に対応する入力の印 (起票の門は台帳・merge の門は main) が印の値より新しいか、 読めない周の印 (入力の印を持たず、 在る間は読み手が出力を古いと示す) なら全部の入力を読めた全部の書き直しだけが印を消す。 (4) FR1094 の 7 つの読み手 SHALL 出力と同じ判定の結果を使い写しの判定を持たず、 書きかけを見ず、 出力の印を今の印と比べて古い出力を古いと、 無いか読めない出力を読めないと示す。 (5) 裁定面と席も版の欄を読み、 知らない語と欄を「まだ分からない」、 無いか読めない出力を「測れない」と描く。 (6) 受付 (FR1068) の断りの event は kind IntakeRefused (key bead と refuse)。 (7) main に入る器の便でない commit SHALL 発端の trailer (名は NAME から導き本 repo では Scribe2-Source・値は空白で区切った bead の id の列) を 1 行以上持ち、 merge の門 SHALL 席の道具の呼び出しの merge の command が発端か run: の trailer を持つ本文を渡さなければ実行の前に欠けを名指して断り、 main-provenance SHALL その trailer の無い器の便でない commit を名指して落とす (どちらも形だけで、 線より後の commit で発端の id が 1 本でも台帳に無いか、 run: の便が event log に無いか、 どちらの trailer も無ければその部品の misfit)。 (8) 消すもの: dispatcher の alarm_word の自前の判定と、 doctor の台帳 lint の (vi)(viii) のうち局面に代わる判定。
  （平易）局面の出力は、 前の版と次の版が共有する観測の面の中に 1 つの形として足します (ADR-1004 の観測の面の欄を部分的に置き換え、 既存の file の置き場は変えません)。 器は 1 つの関数で、 案件の部品 9 種 (発話・台帳の問い・memo・契約・開いた契約の最新の便・契約表の行・要件・epic・器の便でない着地の commit) ごとに局面・手番・局面に入った時刻・理由・つながりを導きます。 局面は閉じた語で、 どれを優先するかは語を宣言した順だけで決め (憲法 C2)、 便の段の値は全部どれかの局面へ写ります。 理由には、 起動の列の待ちの理由・受付の断りの名・便の段と終端の語をそのまま使います。 つながりには発端・子の問い・昇格した契約・便・着地の commit・仕分け済みの発話の行き先を載せ、 発話の部品は時刻と session と行き先だけで、 中身の字は載せません。 どの局面にも当たらない部品と、 要件 FR1091・FR1092 が当てはまらないと定める部品は、 misfit と理由の語 (種類と close の理由の形の食い違い・台帳に無い発端など) で出します。 memo の引き金が満ちたかは、 要件 FR1087 の判定と同じ判定で決めます。 語の一覧と優先の順・局面 (契約の待ちでは理由も) から手番への対応・理由の語の一覧は設計 doc の 1 節が正本で、 memo の局面の語と順だけは要件 FR1091 が持ちます。 判定には台帳の全部・event log・main の契約表と SRS と trailer を使い、 窓 (規則の値 lifecycle.closed_window_h) は close した部品を出力に載せるかにだけ使い、 閉じても局面が終わりでない部品 (未反映の裁定を持つ閉じた問いなど) には掛けません。 閉じと着地の commit から来る「当てはまらない」の判定は、 切り替えの線より後の記録にだけ掛け、 ほかの「当てはまらない」は線に依りません。 線は state dir ごとに、 この版の器がその state dir で初めて全部を書き直した時刻で、 そのとき event LifecycleCutover (key version = 線を引いた器の版・key main = その書き直しが読んだ main の印) を 1 件だけ残し、 後の版は書き直さずに読むだけです (出力は導き出したものなので、 線を持ちません)。 着地の commit は、 その key main の印より後に main へ入ったものを線の後とします。 binary を入れ替えてから最初の全部の書き直しまでの間の閉じと着地の commit は、 門がもう効いていても数えないので、 入れ替えの直後に全部を書き直す口を撃つとこの間が狭まります。 この関数は起動の列の関数を呼び、 起動の列の側はこの関数を呼びません。 結果は <state_dir>/fleet/lifecycle.json の 1 file に、 版の欄 (語と欄を足すだけでは上げない)・語の一覧・入力の印 (台帳の印・event log の長さ・main の sha)・作った時刻と、 席の手番の閾値越え (下で説明) の件数と最古の 1 件と一緒に書き、 同じ置き場の lifecycle.stale (古さの印・これも版の欄を持つ) と組で局面の出力とします。 一時 file からの名前の付け替えで丸ごと入れ替え、 書き手は 1 つずつ順番にし、 入力の印が今の file より古い書きは捨てます。 出力は導き出したものにすぎず、 真実は持ちません。 器は同じ中身を文字で出す口と、 全部を書き直す口を持ちます。 全部の書き直しは、 便を起こす周 (dispatch の周)・器が台帳を書いた直後・全部を書き直す口を撃ったときに行います。 管理 tick の周と発話や仕分けの記録の直後は、 台帳も git も読まず、 event log の大きさに依らない読みで、 event log と時刻で決まる部分 (発話・仕分けで結んだ発端・便の局面・年齢と閾値越え・前の全部の書き直しが残した期日の引き金の満ち) だけを書き直します。 席が自分で台帳を書くのを起票の門が通したときと、 器の便でない merge を merge の門が通したときは、 受ける仕組みを足すと hook の予算 (NFR1005) を越えるので、 門が書き直さずに lifecycle.stale へ古さの印 (種類と時刻とその時点の入力の印) を書くだけにします。 入力を読めない周も、 書き直さずに古さの印を付けて理由を記録しますが、 この印は入力の印を持たず、 印が在る間は読み手が出力を古いと示します。 印の種類は起票の門・merge の門・読めない周の 3 つに閉じ、 種類ごとに 1 つまでで、 同じ種類の後の印が前の印を置き換えます。 門の印を消すのは、 印の後に始まり、 印の種類に対応する入力の印 (起票の門なら台帳の印・merge の門なら main の sha) が印の値より新しい全部の書き直しだけです。 読めない周の印を消すのは、 印の後に始まり全部の入力を読めた全部の書き直しです。 部分の書き直しはどの印も消しません。 門は書きの前に撃つので、 印の後で書きの前に始まった書き直しは印を消しません。 便が走らない間は長く古いままになりうることは、 受け入れる限界です。 要件の部品を除き、 席が次に動くべき部品が局面ごとの年齢の規則 (lifecycle.age_h) を越えたものを席の手番の閾値越えと呼び、 出力がその件数と最古の 1 件を持ちます。 読み手は 7 つ (便の終わりの知らせが便の段に添える 1 語・doctor の未仕分けの発話と処置の待ちの memo と閾値越えの 3 つの行・管理 tick の知らせの語 unsorted と owned・直近の流れの事実行・memo の判定の知らせの処置の待ちの memo の数) で、 局面の関数と同じ判定の結果を使って自前の判定を持たず、 書きかけを見ず、 出力の入力の印と古さの印を自分が読める今の印と比べて、 古い出力を古いと、 出力が無いか読めない周は読めないと示します (要件 FR1094・比べる印の組は読み手ごとに設計 doc)。 出力が古さの印を持つ周は、 管理 tick の知らせの語 unsorted と owned に stale が添わります。 閾値越えは出力の値を読むだけで、 読み手は数え直しません。 読む側 (裁定面と席) は版の欄を読み、 知らない語と欄は「まだ分からない」、 出力が無いか読めない版なら「測れない」と描き、 便の細かい時刻の列は event log から読みます (原則の射程の外)。 出力は state dir ごとに 1 つで、 欄の名と JSON の形は設計 doc が持ち、 下書きを消費側の席に先に見せます。 受付は起動の列の周に断った契約ごとに、 event IntakeRefused (bead と断りの名) を 1 件記録し、 局面の関数はそれを読むだけです。 器の便でない commit が main に入るときは、 発端の trailer (名は器の名から導き、 本 repo では Scribe2-Source) を 1 行以上持たせ、 各行の値は空白で区切った bead の id の 1 本以上の列にします (既存の要件の trailer と同じ列の形)。 自 repo への PR の形 (--pr-cmd) の merge も同じく発端の trailer を要り、 ADR-1023 がこの形を trailer の無い穴とした 1 文はここで置き換えます。 merge の門は、 席の道具の呼び出しの merge の command が発端か run: の trailer を持つ本文を渡さないとき、 実行の前に欠けを名指して断ります。 main に入った後は CI (main-provenance) が、 その trailer の無い器の便でない commit を名指して落とします。 どちらも形だけを見ます。 切り替えの線より後の commit のうち、 発端に並べた id の 1 本でも台帳に無いものと、 器の便の trailer が名指す便が event log に無いものと、 発端の trailer も器の便の trailer も持たない器の便でないものは、 その commit の部品の misfit で数えます。 消すのは、 dispatcher の alarm_word の自前の判定 (出力の便の部品の理由の語の読みに替えます) と、 doctor の台帳 lint の (vi)(viii) のうち局面に代わる判定です (doctor の出力の key を変える便の前に消費側へ知らせます)。 消費側は自前の局面の計算を外す見込みで、 その行は消費側が持ちます (本 ADR の決定の外です)。
  （理由）局面の判定が器・消費側の画面 2 つ・席の頭の 4 か所に分かれていると、 器の整理と画面の見せ方は 1 対 1 になりません。 今すでに 2 つの画面が互いにも器とも食い違い、 席も CI 待ちの便を数え違えました。 user は裁定 12:46Z で 1 対 1 と死角の無さを求め、 裁定 13:14Z で判定を器の 1 か所にまとめる推奨を採りました。 判じ手を 1 つの関数にすれば、 1 対 1 は注意でなく作りで保たれます (憲法 C2 の「1 つの関数・宣言順」を局面の判定にも当てる読み)。 結果を file に書いて読む側は読むだけにしたのは、 消費側の席が「読む道に process を起こさない」を条件にし、 管理 tick と道具の呼び出しごとの hook は台帳を撃てないからです (NFR1005・FR1027)。 file は他の記録から導く値なので、 真実を置かない線 (憲法 C3) を守り、 消えても次の書き直しで戻ります。 版の欄と「まだ分からない」「測れない」の約束は、 前の版と次の版で読み手が壊れないための ADR-1004 の規則をこの file にも当てたものです。 窓を表示にだけ掛けるのは、 窓で入力を落とすと判定が大きく誤ると審査の模擬で分かったからです。 席の台帳の書きの後を確定の書き直しの時にしなかったのは、 受ける hook を足すと道具の呼び出しごとに binary が増えて hook の予算を越えるからで、 代わりに古さを隠さず示させます。 門の古さの印に付けた時点の入力の印を持たせ、 印の後に始まって印より新しい入力を読んだ全部の書き直しだけが消すのは、 門が書きの前に撃つので、 書きがまだ入っていない入力で作った出力や、 台帳を読まない部分の書き直しが古さを消して隠さないためです。 閉じと着地の commit に由来する当てはまらない判定を、 state dir ごとのこの版の最初の全部の書き直し (切り替えの線) より後の記録にだけ掛けるのは、 それより前の記録にはこの版の門が効く前に作られたものが含まれ、 数えると偽の「当てはまらない」が出るからです (線は binary の入れ替えから遅れうるので、 その間の記録も数えない限界が残ります)。 線を出力でなく event log に残すのは、 導き出した出力に真実を置かないためです。 席の手番の閾値越えを出力の値にしたのは、 管理 tick の alarm が台帳を読まずに出力の値だけで決まり、 読み手が同じ値を使えるようにするためです。 便が走らない間は出力が長く古いままになりうることは、 受け入れる限界として残します。 呼ぶ向きは局面の関数から起動の列への片方だけにし (起動の列と受付の判定は本 ADR で変えません)、 受付の断りの記録は断りを判じる受付の側に置きます。 器の便でない着地の発端は、 merge の時点で止め (憲法 C16)、 門の見えない merge は CI で後から名指す 2 段にしました。 PR の段の CI は squash の本文を見られず、 任意にすると付け忘れが無音になるからです。 trailer の名を器の名から導くのは、 既存の契約と要件の trailer と同じ組み方に揃え (run: は literal のまま)、 器の名を替えれば一緒に替わるようにするためです (憲法 C2.2 の向き)。 足すもの (file・語・規則の値・event・trailer・門) の前に、 alarm_word の判定と doctor の一部の判定を、 消すものとして名指しました (憲法 C17.2・消費側の写しを外すのは消費側の行の領分です)。 発端の trailer と merge の門の形は、 user の常設の指示 00:54Z の下で、 12:46Z の方向 (器の整理と見せ方を 1 対 1・LLM にも死角を残さない) に、 orchestrator の分析の骨格 (継ぎ目ごとに書き手と確かめる者を置く) を当てた orchestrator の決定です。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1090（claim）: FR1090 (局面の出力) の、 部品 9 種ごとの局面 (便の段の値は全て写る)・手番・時刻・理由・結び、 出力が版・入力の印・古さの印と席の手番の閾値越え (要件の部品を除き、 手番 seat の部品が局面ごとの rules 行 lifecycle.age_h を越えたもの) の件数と最古の 1 件を持つこと、 局面の語と優先の順と手番の対応と misfit の理由の語の一覧の正本を設計 doc の 1 節に置くこと (memo の局面の語と順は FR1091)、 FR1091・FR1092 が定める部品も misfit に出すこと、 memo の引き金の満ちを FR1087 と同じ判定で決めること、 全部の書き直し (dispatch の周・器の台帳の書きの直後・全部を書き直す口) と部分の書き直し (管理 tick の周・発話 event か仕分けの event の記帳の直後・範囲は発話・仕分けで結んだ発端・便の局面・年齢と閾値越え・前の全部の書き直しが残した期日の引き金の満ち) の契機と入力 (全部の書き直しは台帳の全部・event log・main の契約表と SRS と trailer を読み、 窓は表示だけで、 局面が終わりでない閉じた部品には掛けない)、 閉じと着地の commit に由来する misfit を切り替えの線 (この版の器がその state dir で最初に全部を書き直した時刻・state dir ごとに 1 度だけ記帳し、 後の版は動かさない) より後の記録にだけ掛けること (着地の commit は、 線を記帳した全部の書き直しが読んだ main の印より後に main へ入ったものを線の後とする・ほかの misfit は線に依らない)、 入力を読めない周に書き直さずに古さの印を付けて理由を記帳し、 その印が入力の印を持たず、 在る間は読み手が出力を古いと示し、 印の後に始まり全部の入力を読めた全部の書き直しが印を消すこと、 古さの印の種類を閉じた 3 つ (起票の門・merge の門・読めない周) にし、 出力が種類ごとに印を 1 つまで持ち、 同じ種類の後の印が前の印を置き換えること、 門が通したときに書き直さずに付ける古さの印がその時点の入力の印を持ち、 印の後に始まり、 印の種類に対応する入力の印 (起票の門は台帳・merge の門は main) が印の値より新しい全部の書き直しだけが印を消すこと (書きが落ちた周の印は次にその入力が動くまで残る)、 古い入力の書きを残さないこと、 発話の部品が逐語を持たないこと、 全部を書き直す口の根拠。 これを満たす HOW (1 つの関数・呼ぶ向き・lock と rename・file の名と欄・版の欄の規則・古さの印の置き場と中身と版の欄・切り替えの線の置き場と key) は本 ADR が決める。
  FR1094（claim）: FR1094 (局面の出力の読み手) の、 7 つの読み手 (便の終端の周の通知が便の段に添える 1 語〔出力の便の部品の理由の語〕・doctor の未仕分けの発話の行と処置の待ちの memo の行と席の手番の閾値越えの行・管理 tick の alarm の語 unsorted と owned・直近の流れの事実行・FR1087 の memo の判定の通知の処置の待ちの memo の数) が局面の出力と同じ判定の結果を使って自前の判定を持たないこと、 書きかけの出力を見ないこと (rename の丸ごとの入れ替え)、 出力が持つ入力の印と古さの印を自分が読める今の印と比べて古さを判じ古い出力を古いと示し (入力の印を持たない読めない周の古さの印が在る間は出力を古いと示す)、 出力が無いか読めない周は読めないと示すこと (読み手ごとに比べる印の組は設計 doc の 1 節)、 doctor の閾値越えの行が出力の件数と最古の 1 件を出すこと、 同じ中身を text で出す口の根拠。 閾値越えの定義と値は FR1090 の側 (出力) に在り、 読み手は読むだけ。
