  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 前の決定 (ADR-1033) のうち、 「道具を起こす関数を外の箱へ移す」という実現方法の文と、 「本体の箱は道具を起こす場所を 0 本しか持たない」を「test の区間を除く本体は 0 本」と読むこと、 引っ越しの量と便の数の見込み、 外の箱の上限の初期値を測る時点 (引っ越しの直後から、 検査で落とす便の起点へ)、 そして「外の箱は道具を起こして生の結果を返すだけで、 判定は本体に残る」という帰結の読みを置き換えます。 上限の係数 (実測の 1.2 倍) と user の決定の印は変えません。 測る時点の置き換えは、 user が 2026-09-24 の決定 (裁定 id user 2026-09-24T00:13Z) で前の決定の範囲内と扱うと決めたので、 新しい決定は要りません。 行数の数え方、 実行 file を外の箱に置く構成、 箱どうしの頼る向き、 本体の上限の値、 実行 file 1 つの決定 (ADR-1001) は変えません。 この記録は発効前 (proposed) で、 系譜の上では現行 (current) ですが、 受け入れられるまで何も拘束しません。 user は 2026-09-24 の決定で、 この記録の案を採りました。 原則は「本体は何を起こすかを書き、 起こすのは縁の 1 か所。 境界は呼び手を動かさずに引く」です。
