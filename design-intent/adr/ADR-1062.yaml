  器の案の章の要約: 候補を 6 つ並べます。 本体に記述と差し込み口だけを置いて外の箱の 1 か所が起こす案、 道具を起こす関数を呼んでいる側ごと外の箱へ移す案、 関数だけを前の決定どおりに引っ越しさせる案、 道具ごとに専用の口を作る案、 この段をやめて数を記録するだけの線のまま残す案、 本体の箱が外の箱に頼る向きに変える案です。 却下した 5 案にも利点を並べ、 退けた決め手が現物か分析かを各案に書きます。 呼んでいる側ごと移す案は本体の行数を数千行減らせ、 前の決定が見込んだ形 (道具を起こす関数を本体に持たない) にいちばん近い点で、 関数だけを移す案と向きを変える案は本体の行数が減る点で、 道具ごとの口の案は引数の形を型で強く縛れる点で、 この段をやめる案は費用が 0 で新しい仕組みを足さず、 増加の歯止めや生き残りの対処も口なしでできる点で、 選んだ案に勝ちます。
  器の専門語の説明: 本文に出てくる専門語 14 個を、 やさしい言葉で説明します。 この記録で意味を決めた語は「起動の記述」「差し替え口」「記録する stub」の 3 つで、 残りは器の側の言葉です。
  ・core（core crate）: 器の本体の crate (crates/NAME・lib vessel)。 型・閉じた enum・判定の純関数・file の読み書きを持つ。 本 ADR の後は、 src の本体で子 process を自分で起こさず、 起動の記述を差し替え口へ渡す。
  ・境界 crate（boundary crate）: core の外側に置く crate (crates/NAME-boundary)。 binary を持ち、 core に依存し core からは見えない。 本 ADR の後は差し替え口の実物 1 つを持ち、 bin の main の先頭で据える。 行数の上限 R-C4-5 を持つ。
  ・起動の記述（invocation）: 子 process の program・引数・cwd・env・入出力の向き・process group を持つ core の型 (本 ADR)。 std の Command と同じ builder の面と同じ 4 終端 (output・status・spawn・exec) を持ち、 終端は自分で撃たず差し替え口へ渡す。
  ・差し替え口（spawner seam）: 起動の記述を受けて実際に子 process を起こす役を表す core の trait (本 ADR)。 method は 4 終端と 1 対 1。 本番は process に 1 回だけ据え、 据えていない周は io の Unsupported を返す。
  ・記録する stub（recording stub）: 歯が差し替え口に据える偽物。 撃たれた program と引数を覚え、 歯が決めた結果を返す (spawn の終端は失敗だけ)。 site が差し替え口を通ることと、 結果の読みを測る。 据えた歯の thread の外へは効かない。
  ・Command（std Command）: Rust の標準 library が持つ子 process の builder (std の process module に在る)。 Command::new で組み、 output などの終端で撃つ。 本 ADR の後、 core と境界 crate の本番の src で組むのは境界 crate の 1 file だけ。
  ・歯の区間（test region）: src の .rs の中で最初の行頭の cfg(test) から後ろの区間と、 名で test の file (名が tests.rs か、 _tests.rs で終わる file) の全体。 core-lines と同じ切り方。 core-lines と core-spawn はここを数えず、 量は R-C4-3 が縛る。
  ・呼び手（caller）: ある関数を呼んでいる関数と file。 本 ADR では、 撃つ関数を呼ぶ core の file を指す (git の 3 関数で 16 file)。
  ・driver の関数（driver functions）: land・gate・train・follow など、 判定と子 process の起動が交互に並んで便を進める core の関数群。 器の中で driver と呼ぶ pipe run の process (便を進める者) が走らせる関数を指し、 その process そのものではない。 本 ADR はこれを境界 crate へ移さない。
  ・純移動（pure move）: 関数や型の本文を変えずに file や crate の間で動かす変更。 器が名と本文の hash で証明し lens には要約を渡す (pipeline.md 5.3 節)。
  ・検出線（detection line）: 超えたら機械が検知して記録・起票する線。 PR は止めない。 CI が落とす deny の閾値とは区別する。 core-spawn は deny の便までこの線に在る。
  ・rules 行（rules row）: manifest に置く規則の値 1 行 (閾値・有効/無効・裁定 id・裁定時刻・逐語)。 数値の置き場 (C1) で、 変更の手続きは C5。 本 ADR は R-C4-5 の行を deny の便で足す。
  ・裁定 id（ruling id）: user 裁定を一意に指す id。 裁定の ts (UTC) で、 rules 行の ruling 欄が指す。 rules 行の変更 (C5)、 閾値変更 (A2)、 憲法改訂 (N4) が要求する。
  ・決定はしご（decision ladder）: 変更のたびに通す 5 段の問い (要るか・既に在るか・std や既存の依存で足りるか・1 行で済むか・最小の実装か)。 最初に成り立った段で止まる (C17・ADR-1044)。
