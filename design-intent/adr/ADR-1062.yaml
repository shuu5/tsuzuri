      （平易）本体の箱には「何を起こすかの記述」の型と「起こす役を差し込む口」だけを置き、 実際に道具を起こす役は外の箱の 1 か所に置いて、 実行 file が動き出す最初に差し込む案です。 記述の型は標準の起動の型と同じ呼び方を持つので、 本体の各場所は組み立ての書き出しと読み込みの行だけを書き換え、 呼び方も判定も変えません。 test は偽の起こし役を差し込んで、 どんな道具をどんな引数で起こしたかと、 返った結果をどう読んだかを測れます。 本体の箱で道具を起こす場所は 0 になり、 検査で固定できます。 口を置く 1 便の後は、 書き換えの便を並べて流せます。 代わりに、 本体の箱の行数は減らず (150 行前後増える)、 道具を起こす関数と判定を並べる関数群は本体に残るので、 前の決定が見込んだ形にはなりません。 起こして流しながら読む起こし方では、 偽物は実物を起こさないので失敗だけを返します。 差し込んだ口という状態が 1 つ増えて差し込み忘れると全部が止まり、 test の区間には本物の起動が残り、 中身の書き換えなので「中身を変えない引っ越し」の証明は使えません。 決め手は分析で、 呼んでいる側を動かさずに前の決定を実現できる形のうち、 足す面が最小で便を並べて流せる形でした。
      利点: core の本体の Command::new が 0 になり deny で固定され、 何が I/O かが機械で決まる (DR1)
      利点: 呼び手の呼び方と判定が変わらず、 判定は core に残る。 関数の引数の数・順・戻りの形も変わらない (型の字面 Command が起動の記述に替わる所はある・DR2)
      利点: 歯が記録する stub で起動の引数を測れ、 output と status の周は結果の読みも測れる。 空 sha の生存変異を殺す歯が書ける (DR3)
      利点: 口を置く 1 便の後は、 site の置換 5 便が write-set を交えずに並列で流れる (各 S・DR4)
      利点: 依存 OSS を足さず、 std の型を写すだけで済む (DR5)
      欠点: driver の関数と git の 1 行の読みなどの撃つ関数は core に残り、 口越しに子 process を起こし続ける。 ADR-1033 が見込んだ形 (撃つ関数を core に持たず、 境界は生の結果だけを返す) にはならない (裁定 id user 2026-09-24T00:13Z で了解済み)
      欠点: 記録する stub は実 process を起こさないので、 spawn の終端は失敗だけを返す (std の Child は std の外から作れない)。 spawn の 15 site の成功の周は stub で測れず、 cfg(test) の実物を撃つ歯が持つ (DR3)
      欠点: core の行数は減らない (起動の記述と差し替え口で +150 行前後)。 ADR-1033 が見込んだ移す量 (3〜5 千行) は成立しない
      欠点: process 全体の状態 (据えた口) が 1 つ増え、 据え忘れた bin や e2e の test binary は全 site が撃てなくなる
      欠点: 歯の区間には cfg(test) の実物と fixture の起動が残る
      欠点: site の本文が変わるので純移動の機械証明は使えず、 各便の lens は置換の diff を読む
    verdict: adopted
    reason: "決め手は分析 (呼び手を動かさずに ADR-1033 の 0 本を実現できる形のうち、 面が最小で便を並列に流せる形)。"
  - id: "OPT2"
    name: "driver の関数ごと境界 crate へ移す"
    text: |
      撃つ関数を呼ぶ land・gate・train・follow などの driver の関数を、 呼び手ごと境界 crate へ移す。 core には呼ばれない判定と型だけが残る。 決め手は分析 (閉包ごと移せば判定が境界へ押し出され、 判定を残そうと切れば切り方が散文になる)。
      （平易）道具を起こす関数を呼んでいる land や gate などの関数群 (driver の関数) を、 呼んでいる側ごと外の箱へ移す案です。 本体の箱の行数が数千行の単位で減り、 道具を起こす関数を本体に持たないという前の決定の見込みにいちばん近い案です。 新しい型も口も足さず、 移す file の多くは中身を変えずに済みます。 けれども driver の関数の中では判定と道具の起動が交互に並んでいます。 呼ばれる関数を丸ごと移せば切れ目は組み立ての都合で機械的に決まりますが、 判定を含む数千行が外の箱へ出て、 外の箱の上限はその判定ごと認めることになります。 判定を本体に残そうと人が切れば、 どこで切るかを文章で判断することになり、 境界を機械で決めるという前の決定の物差しに反します。 どちらかを引き受けることになり、 1 便も多くの file を跨いで大きくなって並べて流せません。 決め手は分析です。
      利点: core の行数が数千行の単位で減り、 ADR-1033 が見込んだ形 (撃つ関数を core に持たない) にいちばん近い
      利点: 新しい型も trait も足さない。 移した file の多くは中身を変えずに済む
      欠点: driver の関数の中では判定と起動が交互に並ぶ。 撃つ関数を呼ぶ閉包ごと移せば境界は compile で機械的に決まるが、 判定を含む数千行が境界 crate へ押し出され、 境界 crate の上限 (R-C4-5) はその判定ごと実測 +20% で認めることになる。 判定を core に残そうと人が切れば、 切り方が散文の判断になる (ADR-1033 の DR3 に反する)。 どちらか一方を引き受ける (DR1 / DR2)
      欠点: 1 便が多くの呼び手を跨いで L 級になり、 並列に流せない (DR4)
    verdict: rejected
    reason: "決め手は分析 (閉包ごと移せば判定が境界へ押し出され、 判定を残そうと切れば切り方が散文になる)。"
  - id: "OPT3"
    name: "撃つ関数だけを境界 crate へ純移動する (ADR-1033 の見込みの 6 便)"
    text: |
      git・tmux・systemd・claude・curl などを撃つ関数を module ごとに境界 crate へ純移動し、 純移動の機械証明で lens に渡す。 決め手は現物 (core に残る呼び手が compile できない)。
      （平易）道具を起こす関数だけを、 前の決定の見込みどおり 6 便に分けて外の箱へ引っ越しさせる案です。 前の決定の文面どおりで新しい決定が要らず、 「中身を変えない引っ越し」の機械の証明が使えるので審査は要約を読むだけで済み、 本体の行数もその分減ります。 けれども本体の箱は外の箱を名指せない作りなので、 本体に残る呼んでいる側 (git の 3 関数だけで 16 file、 tmux の関数で 10 file) が組み立てできません。 組み立てを通すには呼んでいる側ごと移すしかなく、 それは上の driver の関数ごと移す案になります。 決め手は現物です。
      利点: ADR-1033 の文面どおりで、 新しい決定が要らない
      利点: 純移動の機械証明が使え、 lens は要約だけを読む
      利点: core の行数が撃つ関数の分だけ減る
      欠点: core は境界 crate に依存できないので、 core に残る呼び手 (git の 3 関数だけで 16 file・tmux の関数で 10 file) が compile できない (DR2)
      欠点: 呼び手の compile を通すには呼び手ごと移すしかなく、 それは driver の関数ごと移す案になる
    verdict: rejected
    reason: "決め手は現物 (core に残る呼び手が compile できない)。"
  - id: "OPT4"
    name: "道具ごとの typed な口 (git・tmux・systemctl など) を core に置く"
    text: |
      起動を 1 つの型でなく、 道具ごとに閉じた method の集合 (git の口・tmux の口・systemctl の口…) で表し、 境界 crate が各口を実装する。 決め手は分析 (子を流しながら読む site に結局 spawn の口が要り、 全道具の口を定義する最初の便が大きくなる)。
      （平易）起動を 1 つの型で表す代わりに、 git 用・tmux 用・systemctl 用のように道具ごとに専用の口を作り、 外の箱が各口を実装する案です。 起こせる引数の形が型で閉じるので、 記述の型より強く縛れ、 test の偽物も道具ごとに小さく書けます。 けれども、 子の出力を流しながら読む場所 (審査役の起動・便の起動・台帳の読み) は起こした子そのものを持ち続けるので、 どの道具の口にも汎用の起動の口が要り、 結局は記述の型と同じ面が残ります。 全部の道具の口を最初の便で定義するとその便が大きくなり、 後から道具ごとに足すと口の定義 file を複数の便が触って並べて流せません。 行数も記述の型より増えます。 決め手は分析です。
      利点: 撃てる引数の形が型で閉じ、 起動の記述より強く縛れる
      利点: 歯の偽物も道具ごとに小さく書ける
      欠点: 子を流しながら読む site (headless の lens・pipe の spawn・seat の台帳の読み) は Child を持つので、 どの道具の口にも汎用の spawn が要り、 結局起動の記述と同じ面が残る
      欠点: 全道具の口を最初の便で定義すると、 その便が大きくなる。 道具ごとに後から足すと、 口の定義 file を複数の便が触って write-set が交わる (DR4)
      欠点: 道具ごとの method と実装が増え、 行数も起動の記述より多い (DR5)
    verdict: rejected
    reason: "決め手は分析 (子を流しながら読む site に結局 spawn の口が要り、 全道具の口を定義する最初の便が大きくなる)。"
  - id: "OPT5"
    name: "段 2 をやめ、 core-spawn を検出線のまま残す"
    text: |
      core の余地は段 1 で戻ったので、 起動の site には触らず、 core-spawn は数だけを出す線のまま置く。 決め手は分析 (core が process を直接起こす構造が残り、 歯が差し替え口で起動を撃てない)。 目的と価値の選択でもあり、 裁定 id user 2026-09-24T00:13Z は OPT1 を採り本案を採らないと決めた。
      （平易）本体の行数の余裕は最初の便で既に戻ったので、 この段はやめて、 道具を起こす場所の数を記録するだけの線のまま残す案です。 費用が 0 で、 新しい仕組みも足さず、 「そもそも要るか」を最初に問う決まりに最も素直です。 選んだ案でも行数は減らないので、 行数という元の目的はもう果たされています。 場所が増えるのは、 今の数を上限にする規則の行 (user の決定が要る) で口なしに止められ、 生き残っていた変異も、 git の出力を値で受ける判定と git を起こす部分に関数を分ければ口なしで捕まえられます。 けれども、 本体が道具を直接起こす作りはそのまま残り、 本体が道具を起こす場所を 0 にするという前の決定は実現せず、 それを取り下げる別の決定が要ります。 test が口に偽物を差し込んで起動を測ることはできず、 分けた場所のほかは場所ごとに分割か専用の口を 1 つずつ足すことになります。 決め手は分析で、 何を大事にするかの選択でもあるので user に尋ね、 user はこの案を採らないと決めました (裁定 id user 2026-09-24T00:13Z)。
      利点: 費用が 0 で、 新しい仕組みも足さない (決定はしごの最初の段「要るか」に最も素直)
      利点: core の行数の目的は段 1 で既に果たされ、 OPT1 でも行数は減らない
      利点: site の増加は、 core-spawn を今の数で上限にする形 (ratchet) で口なしに止められる (rules 行なので A2 の裁定は要る)
      利点: 空 sha の生存変異は、 HEAD の読みを「git の出力を値で受ける pure 関数」と「撃つ面」に分け、 pure 側に歯を足せば口なしに殺せる (台帳 s2-07l.198 の notes に在る手)
      欠点: core が process を直接起こす構造が残る。 ADR-1033 の決定 (core の Command::new が 0・deny) は実現せず、 それを取り下げる別の ADR が要る (DR1)
      欠点: 歯が差し替え口で起動を撃てない。 pure 分割や自前の口で測れるのは手を入れた site だけで、 site ごとに 1 つずつ足すことになる (OPT1 は全 site で口が 1 つ・DR3)
    verdict: rejected
    reason: "決め手は分析 (core が process を直接起こす構造が残り、 歯が差し替え口で起動を撃てない)。"
  - id: "OPT6"
    name: "core を境界 crate に依存させる"
    text: |
      撃つ関数を境界 crate へ移し、 core の呼び手は境界 crate を use して今の形のまま呼ぶ。 決め手は分析 (今の構成では境界 crate が core に依存しているので依存が循環し Cargo が build を拒むが、 それは bin を別の crate へ移すか、 撃つ関数を std だけの葉の crate に置いて core がそれに依存すれば切れる。 どちらの形でも core は撃つ関数を直に呼び続け、 歯は実 process を撃つ・DR3)。
      （平易）道具を起こす関数を外の箱へ移し、 本体の箱のほうが外の箱に頼る向きに変えて、 呼んでいる側は今の形のまま呼ぶ案です。 呼び方が変わらず、 関数は中身を変えずに引っ越しでき、 本体の行数もその分減ります。 外の箱は実行 file を持ち、 既に本体に頼っているので、 今の作りのまま向きを逆にすると頼り合いが輪になって組み立てができません。 ただしこの輪は、 実行 file を 3 つ目の箱へ移す (済んだ最初の便をやり直す) か、 道具を起こす関数を標準の部品だけで作る小さな箱に置いて本体がそこに頼れば切れます。 退ける理由は輪ではなく、 どちらの形でも本体が道具を起こす関数を直に呼び続けるので、 test が偽物を差し込めず実物を起こし続けることです。 実行 file を移す形では、 この記録の読みでは、 本体が外の箱に頼らないというこの器の作りの前提も崩れます。 決め手は分析です。
      利点: 呼び手の呼び方が変わらず、 撃つ関数は純移動で移せる
      利点: core の行数が撃つ関数の分だけ減る
      欠点: 境界 crate は bin を持ち core に依存しているので、 依存が循環して build できない。 循環を切るには、 bin を 3 つ目の crate へ移す (着地済みの段 1 を組み直す) か、 撃つ関数を std だけの葉の crate に置いて core がそれに依存するか、 の構成の変更が要る
      欠点: どちらの形で循環を切っても core は撃つ関数を直に呼び続けるので、 core の歯は差し替えられずに実 process を撃ち、 site を偽物で測れない (DR3・退ける決め手)。 bin を移す形では core の依存に境界 crate が入る (本 ADR の読みでは C13.2 の前提が崩れる・補助の理由・DR1)
    verdict: rejected
    reason: "決め手は分析 (今の構成では境界 crate が core に依存しているので依存が循環し Cargo が build を拒むが、 それは bin を別の crate へ移すか、 撃つ関数を std だけの葉の crate に置いて core がそれに依存すれば切れる。"
basis: [FR1047, NFR1002, NFR1003, NFR1005, NFR1006, ADR-1001, ADR-1033, ADR-1044]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「core」は器 (scribe2) の本体の箱、 「境界 crate」は外の世界に触れる仕事を受け持つ別の箱、 「子 process」は器が git や tmux などの道具を起こすことです。 前の決定 (ADR-1033) は、 道具を起こす関数を本体の箱から外の箱へそのまま引っ越しさせ、 本体の箱が道具を自分で起こさないようにする、 と決めました。 実際に数え直すと、 道具を起こす関数は本体の箱の中の多くの file から呼ばれていました (git を起こす 3 つの関数だけで 16 file)。 本体の箱は外の箱を名指せない作りなので、 関数だけを引っ越しさせると呼んでいる側が組み立て (compile) できなくなります。 この記録は、 本体の箱には「何を起こすかの記述」と「起こす役を差し込む口」だけを置き、 実際に起こす役は外の箱の 1 か所に置いて、 実行 file が動き出す最初に差し込む、 と決めます。 呼んでいる側の呼び方と判定の code は変わらず、 本体の箱が道具を自分で起こす場所は 0 になり、 test は偽の起こし役を差し込んで、 どんな道具をどんな引数で起こしたかを測れます。 代わりに本体の箱の行数は減らず (150 行前後増える)、 前の決定が見込んだ移す量 (3〜5 千行) は成り立ちません。 前の決定は、 何が外の世界に触れる仕事かを「本体の箱が道具を起こす場所が 0」で機械的に決めると置いており、 この記録はそれを user が 2026-09-15 に決めた「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」の物差しと読んで、 満たします。 ただ、 道具を起こす関数と、 判定と起動が交互に並ぶ関数群は本体の箱に残り、 行数が減らない点が見込みと違います。 user は 2026-09-24 に、 行数が減らないことを承知の上でこの形で進めると決めました (裁定 id user 2026-09-24T00:13Z)。 この記録は、 受け入れられるまで何も拘束しない発効前 (proposed) の記録です。
consequences:
  - "この判断で良くなることと、 代わりに引き受けることです。 本体の箱で道具を起こす場所が 0 になって検査で固定され、 前の決定が実現し、 場所が増えることもなくなります。 test は偽物を差し込んで、 結果を全部受け取る起こし方と終わりの状態だけ受け取る起こし方では、 実物では作れない「成功したのに空」の回を作れ、 生き残っていた変異を捕まえる test が書けます。 呼んでいる側の呼び方が変わらないので、 口を置く 1 便の後は 5 便を並べて流せ、 判定は本体に残り、 外の箱の上限は小さいまま効きます。 代わりに引き受けることは 9 つです。 本体の箱の行数は減らず、 前の決定が見込んだ移す量は成り立ちません。 差し込んだ口という process 全体の状態が 1 つ増え、 実行 file や外の箱の test が差し込み忘れると道具を起こせなくなります (共通の関数を通らない新しい test は差し込み忘れます)。 test の区間には本物と test 用の起動が残ります。 中身が書き換わるので「中身を変えない引っ越し」の機械の証明は使えません。 全部を書き換えるまでの間に場所が増えうるので、 便を起こす直前に数え直します。 偽物は test の thread の中だけで効くので、 別の thread で道具を起こす経路は偽物で測れません。 外の箱の上限は小さく、 早めに当たりえます。 道具を起こす関数と判定を並べる関数群は本体に残り、 前の決定が見込んだ形にはなりません。 そして、 起こして流しながら読む起こし方では、 偽物は実物の道具を起こさないので失敗だけを返し (標準の型の子は外から作れない)、 成功した回は本物を起こす test のままです。"
  - "良い結果: core の本体の Command::new が 0 になり (main 9f516d3 の実測で 34 行 / 22 file から)、 core-spawn の deny で固定される。 境界 crate で std の Command を組む file も boundary-spawn の deny で 1 本に固定される。 何が I/O かが機械で決まるという ADR-1033 の決定が実現し、 検出線のままでは止まらなかった site の増加が止まる"
  - "良い結果: core の歯が記録する stub で起動の引数を測れ、 output と status の周は結果の読みも測れる。 実 git を撃つ歯では作れない「成功して stdout が空」の周を stub で作れ、 台帳の notes に残る空 sha の生存変異を殺す歯が書ける"
  - "良い結果: 呼び手の呼び方と関数の引数・戻りの形が変わらないので、 site の置換の便は追随を起こさず、 口を置く 1 便の後に 5 便が write-set を交えずに並列で流れる。 判定は core に残り、 境界 crate の上限は小さいまま (設計の見込みで 341 行) で効く"
  - "代償: core の行数は減らない。 起動の記述と差し替え口で core は +150 行前後、 境界 crate は +110 行前後 (設計 §9 の見込み)。 ADR-1033 の OPT1 が見込んだ移す量 (3〜5 千行) と台帳の見積 (約 2,800 行を core の外へ) は成立しない。 core の余地は段 1 の母集団の変更が既に戻している"
  - "代償: process 全体の状態 (据えた差し替え口) が 1 つ増える。 bin が据え忘れると全 site が Unsupported で撃てなくなる (境界 crate の e2e が落ちて気づく)。 境界 crate の e2e の test binary も core の lib を同じ process で呼ぶので、 据えないと、 seat の recent の git の読みを直に呼ぶ歯 2 本が git-unavailable に倒れて赤になる。 host 名の読みは /etc/hostname が無いか空の host だけ fallback の起動に届き、 据えないと unknown に倒れて、 bin の出力の host と照合する e2e の歯が赤になりうる。 libtest には全歯の前に走る入口が無いので、 据えるのは共通の関数 1 つで、 それを通らずに core の lib を呼ぶ新しい歯は据え忘れる"
  - "代償: 歯の区間には cfg(test) の実物と fixture の起動 (main 9f516d3 の実測で 10 行 / 8 file) が残り、 core-spawn はそれを数えない。 core の歯が実 process を撃つ既存の形は残る"
  - "代償: site の本文が書き換わるので、 純移動の機械証明は使えず、 各便の lens は置換の diff を読む。 各便は stub で site を測る新しい歯を書く"
  - "代償: 起票から deny の便までの間は core-spawn は検出線のままで、 母集団が増えうる (設計 §9 の初版の実測 33 から main 8ca0dc9 以後の 34)。 行を起票する直前に測り直し、 増えた site を行へ足す"
  - "代償: stub は歯の thread に閉じるので、 site が別の thread で撃つ経路は stub で測れず、 その経路の歯は実物で撃つ"
  - "代償: 記録する stub は実 process を起こさないので、 spawn の終端は失敗だけを返す (std の Child は std の外から作れない)。 子を流しながら読む site (headless の lens・pipe の spawn・seat の台帳の読みなど・spawn は 15 か所) の成功の周は、 cfg(test) の実物で実 process を撃つ歯のままである"
  - "代償: 境界 crate の上限は小さく (仮置き 341 行)、 bin の main は subcommand を足すたびに育つので、 早めに当たりうる。 値の変更は A2 の裁定になる"
  - "代償: driver の関数と撃つ関数は core に残って口越しに子 process を起こし、 core の行数は減らない。 ADR-1033 の物差し (core の Command::new が 0) は満たすが、 ADR-1033 が見込んだ形 (撃つ関数を core に持たず、 境界は生の結果だけを返す) にはならない。 file の読み書きはどの案でも core に残る。 user は 裁定 id user 2026-09-24T00:13Z でこの形を了解して採った"
