# 判断の記録 ADR-1062 — 器 scribe2 の判断の記録 ADR-0062 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1062
title: "core は子 process を自分で起こさず、 何を起こすかの記述を差し替え口へ渡す — 実物は境界 crate の 1 か所に据え、 撃つ関数の純移動はやめる (ADR-1033 の実現方法の一部を置き換える)"
status: proposed
date: 2026-09-24
context: |
  ADR-1033 は、 子 process を撃つ関数を core から境界 crate へ純移動して、 core が process を起こさない形にすると決めた。 測り直すと、 撃つ関数は core の中の多くの file から呼ばれており (git の 3 関数だけで 16 file)、 core は境界 crate に依存できないので、 撃つ関数だけを移すと呼び手が compile できない。 本 ADR は、 core に「何を起こすかの記述」の型 1 つと「起こす役の差し替え口」の trait 1 つを置き、 実物は境界 crate の 1 か所で bin の main の先頭に据えると決める。 呼び手の呼び方と判定は変わらず、 core の本体の Command::new は 0 になり、 歯は偽の起こし役を据えて site を測れる。 代わりに core の行数は減らず (+150 行前後)、 ADR-1033 が見込んだ移す量 (3〜5 千行) は成立しない。 ADR-1033 は何が I/O かを core の Command::new が 0 であることで機械で決めると置いており、 本 ADR はそれを 2026-09-15 の裁定の物差しと読んで満たす。 撃つ関数と driver の関数は core に残り、 core の行数が減らない点が裁定の見込みと違う。 user は core の行数が減らないことを了解した上でこの形 (OPT1) で進めると裁定した (裁定 id user 2026-09-24T00:13Z)。
  なぜこの判断が要るのかを、 これまでの決定と実測と器の現物から説明します。 user は 2026-09-15 に、 本体の箱の行数の数え方から test の行を外すこと、 道具を起こす部分を外の箱へ分けて本体を判定と型に絞ること、 外の箱にも行数の上限を置くことを決めました。 前の決定 (ADR-1033) はその実現方法を「道具を起こす関数を外の箱へ移す」と書き、 移す量を 3〜5 千行、 引っ越しの便を 6 本ほどと見込みました。 最初の 2 便 (数え方の変更と、 外の箱の新設) は済んでいます。 数え直すと、 本体の箱で道具を起こす場所は 34 か所 (22 file) で、 設計の初版が数えた main の 33 か所から、 その約 48 分後に入った変更 1 つで 1 か所増えていました。 今は数を記録するだけなので、 増えるのを止めません。 また、 道具を起こす関数は本体の中の多くの file から呼ばれ、 包みの関数や claude の組み立て役は起動の組み立てそのものを受け渡ししていました。 本体の箱は外の箱を名指せない作りなので、 関数だけを引っ越しさせると呼んでいる側が組み立てできず、 呼んでいる側ごと引っ越しさせると、 判定まで外の箱へ押し出されます。 つまり、 判定を本体に残すか、 道具を起こす関数を本体から出すかの選択になります。 前の決定は、 何が外の世界に触れる仕事かを「本体の箱が道具を起こす場所が 0」で機械的に決めると置き、 「純粋かどうか」を物差しにする案は人の判断に頼るとして退けていました。 この記録は、 その「0」を user の決定の文面の物差しと読みます。 file の読み書きはどの案でも本体に残ります。 test の側では、 git が成功したのに何も返さなかった回を実物の git では作れず、 その回を弾く判定の一行が変異検査で生き残ったままです。
  CTX1 経緯 — I/O 面を分ける決定と物差しは済み、 段 2 の形と行数の見込みの差が残る
  2026-09-15 の user 裁定 (A2・2 問) は、 core（器の本体の箱）-lines (R-C4-1) の母集団を core の src の本体 (in-file の歯を除く) にすること、 子 process を起こす I/O 面を境界 crate（process を起こす箱） へ分けて core を pure な判定と型に絞ること、 境界 crate にも行数の上限 (新しい rules 行・値は実測の +20%・同じ裁定 id（user の決定を指す印）) を置くことを決めた。 ADR-1033 はそれを記録し、 実現方法を、 std の Command（標準の起動の型） を構築する関数を境界 crate へ移すことと、 core が Command::new を 0 本しか持たないこと (deny) と書いた。 見込みは、 移す量が 3〜5 千行、 純移動（中身を変えない移動）の機械証明 (pipeline.md §5.3) で lens に渡せる、 純移動の便が 6 本ほど、 とした。 段 1 の 2 便 (core-lines の母集団を本体にする便・境界 crate を新設して bin と e2e の歯を移す便) は着地済みで、 core-spawn (core の src で Command::new を含む行の数) は数だけ出す検出線（止めずに記録する線）として動いている。 同じ日の後の裁定で R-C4-1 は一時 60,000 に緩められ、 リファクタリングを定期の枠で続けると決まった。 ADR-1033 は境界を散文でなく機械で決める (DR3) と置き、 何が I/O かを「core は Command::new を 0 本しか持たない (deny)」で決めると書き、 「pure かどうか」を物差しにする案 (判定を新しい crate へ出す案) を散文の判断として退けた。 本 ADR はその Command::new = 0 を裁定の文面の物差しと読む (本 ADR の解釈)。 file の読み書きはどの案でも core に残る。 本 ADR が採る案 (OPT1) はその物差し (本 ADR の読みでは core の本体の Command::new = 0) を満たす。 裁定と ADR-1033 の見込みと違うのは、 撃つ関数と driver の関数（便を進める関数群） (判定と起動が交互に並ぶ関数群) が core に残って口越しに起こし、 core の行数が減らない点である。 ADR-1033 が見込んだ形 (撃つ関数を core に持たず、 境界は生の結果だけを返す) にいちばん近いのは driver の関数ごと移す案 (OPT2) だが、 それは判定を境界 crate へ押し出す。 段 2 の形について user に 2 つを問い、 裁定 (裁定 id user 2026-09-24T00:13Z) を得た。 1 つ目は、 core の行数が減らない (core +150 行前後・境界 +110 行前後・ADR-1033 が見込んだ 3〜5 千行の移動は成立しない) ことを了解した上で OPT1 で進め、 段 2 をやめる案 (OPT5) は採らない、 である。 2 つ目は、 R-C4-5 を足す時点 (下の supersession) を core-spawn を deny にする便と同じ便とし、 既存の裁定 id user 2026-09-15T10:07Z の範囲内と扱う (新しい A2 の裁定は要らない)、 である。 逐語は非公開の作業記録簿 (台帳 s2-07l.198 の notes) に在る。
  CTX2 実測 — 撃つ site の数と、 検出線が増加を止めないこと
  main 9f516d3 (2026-09-24) の core の src で Command::new を含む行は、 本体 (core-lines と同じ切り方) が 34 行 / 22 file、 歯の区間（test の区間）が 10 行 / 8 file である。 設計 §9 の初版が同じ日に数えた main b82be74 では本体が 33 行 / 21 file で、 その約 48 分後に着地した便 1 本 (s2-07l.576・doctor の版の照合) が本体に 1 site を足した。 検出線は数を出すだけなので増加を止めない (実例はこの 1 件)。 道具別には git が最も多く、 systemctl・tmux・sh・systemd-run・kill・bd・自分自身の bin・claude・curl・hostname・cargo・CI の照会が続く。 歯の区間の 10 行は、 git の fixture を作る helper と、 死んだ pid を作る true の起動と、 包みの歯が渡す引数である。 core の行数は段 1 の母集団の変更の後に 44,118 / 60,000 (main 8ca0dc9・設計 §9 の実測。 9f516d3 では 44,657) で、 余地は段 1 で戻っている。 台帳の notes には、 変異検査の A/B (撃墜 11・生存 1・母集団 12) で生き残った 1 本が記録されている。 それは口座の導入先の HEAD の読み (git が成功して stdout が空の周を空 sha として弾く guard) で、 歯が実 git を撃つので「成功して空」の周を作れない。
  CTX3 現物 — 撃つ関数は core の中から呼ばれ、 core は境界 crate を名指せない
  main 9f516d3 で、 pipe/mod.rs の git の 3 関数 (bytes・ok・1 行の読み) は core の他の 16 file から呼ばれる。 seat/mod.rs の tmux に届く公開関数 (送る・pane を読む・pane の前面が shell かを見る・target を解く) は core の他の 10 file から呼ばれる。 pipe/confine.rs の包み (sh の行や Command を memory の囲いに入れる関数) は Command を値で受けて返し、 他の 5 file から呼ばれる。 headless/mod.rs の claude の構築点は Command を組んで返し、 包みへ渡す。 core の Cargo.toml は実行時の依存を 1 つも持たず、 境界 crate は core に依存する (向きは境界 → core の一方向)。 したがって撃つ関数だけを境界 crate へ移すと、 core に残る呼び手（関数を呼ぶ側）が compile できない。 呼び手ごと移すと、 land・gate・train・follow などの driver の関数 (判定と子 process の起動が交互に並ぶ関数群) が丸ごと境界 crate へ動き、 判定が境界へ押し出される。 core に残る関数の本文も変わるので、 純移動の機械証明 (名と本文の hash で「中身を変えていない」を示す仕組み) も使えない。 xtask の claude-spawn-points (deny) は、 claude の構築の字面が headless/ の中で mod.rs に 1 つだけ在ることを求める。
  CTX4 憲法と既存の決定の向き (本 ADR の解釈)
  C4 は core の大きさなどの上限を CI の deny で守り、 上限の変更を A2 (user 裁定) に限る。 C13.2 は derive macro を境界 crate に閉じることを求める。 本 ADR はこれを、 core が境界 crate に依存しない構成を前提にした条と読む (条文そのものは依存の向きを言わない)。 C17 は変更のたびに決定はしご（足す前に通す 5 段） (要るか・既に在るか・std で足りるか・1 行で済むか・最小の実装か) を順に通し、 C17.2 は仕組みを足す前に消すものを名指すことを求める。 C12.4 は変異の生存を検出線として記録する。 ADR-1033 は境界を散文でなく機械 (Command::new の有無) で決める (DR3) と置き、 境界 crate の関数は「引数 → 子 process → 生の結果」だけを返し、 判定は core の純関数に残り、 歯は stub で撃てる、 と帰結 (CSQ-P3) に書いた。 ADR-1001 の実行 file 1 つは不変である。 ADR-1033 の「core は Command::new を 0 本しか持たない」は、 歯の区間を数えるかを書いていない。 本 ADR はこれを、 core-lines と同じ切り方で「core の src の本体は 0 本」と読む (歯の区間の量は R-C4-3 が縛る)。 C1 は rule value (閾値・発効の印・裁定 id など) を manifest の 1 file に置くことを求め、 C1.2 / N2 は規則を散文だけで持たないことを求める (ADR-1033 の DR3 の根)。 claude-spawn-points (1 つだけ) と ADR-1033 が deny と置いた core-spawn (0 本) は、 rules 行（裁定つきの規則の行）を持たない xtask の構造の検査である。 本 ADR はこの型の検査を C1 の rule value と読まない (本 ADR の解釈)。
  CTX5 材料 — std の Command の面は数えられ、 site ごとの差し替えの先例が在る
  core の site が std の Command に対して呼ぶ面は数えられる (数は src 全体の字面の件数)。 builder の面は new・arg・args・current_dir・env・env_remove・stdin・stdout・stderr・process_group・get_program・get_args・get_envs で、 終端は output (26 か所)・spawn (15)・status (4)・exec (1・席の起動の行) である。 exec と process_group のために unix の CommandExt を use する file が 5 つ在る。 hook/host_guard.rs は git の program の path を判定の場の引数に持ち、 歯が偽の git で呼出回数を数える。 headless の構築点も claude の program を引数に受ける。 これらは site ごとに program を差し替える先例で、 口は site ごとに別々である。 core の歯は nextest の下では歯ごとに別の process で走るが、 変異検査の道具は baseline を常に、 mutant の歯を的の歯の名が無い周に、 cargo test で同じ process の複数 thread で走らせる。 process 全体に効く偽物を歯が据えると、 並んで走る他の歯に漏れる。 境界 crate の e2e の歯は core の lib を同じ process で呼ぶものを持つ (seat の recent の git の読みを直に呼ぶ歯 2 本は、 実 git が撃てないと dirty の行と not-a-repo の判定が落ちる)。
  （選択肢を測るものさし）この判断を評価する 5 本のものさしです。 本体の箱が道具を自分で起こさないこと (前の決定を、 人の判断でなく機械で測れる形で実現すること)、 判定と呼んでいる側を本体の箱に残すこと、 test が実物の道具を起こさずに、 どんな道具をどんな引数で起こしたかを測れること、 変更を小さな便に割って並べて流せること、 そして足すものを最小にして依存する外部の部品を増やさず、 実行 file を 1 つのままにすることです。
  DR1｜core は子 process を自分で起こさない — ADR-1033 の決定 (core の Command::new が 0) を実現し、 境界を散文でなく機械で決める CTX1 (裁定)・CTX4 (ADR-1033 の DR3・C1.2)
  DR2｜判定と呼び手を core に残す — 境界 crate へ判定を押し出さない (境界 crate の上限が塞ぐ抜け穴を開けない) CTX3・CTX4 (C4・ADR-1033)
  DR3｜歯が実 process を撃たずに起動の site を測れる — 引数と結果の読みを偽物で決め、 生き残った変異を殺せる CTX2 (生存 1 本)・CTX4 (C12.4・ADR-1033 の帰結)
  DR4｜便を小さく並列に流せる — write-set が互いに交わらず、 呼び手の追随を起こさない CTX3・SRS NFR1002
  DR5｜足すものを最小にし消すものを名指す — 依存 OSS を足さず std だけで作り、 実行 file は 1 つのまま CTX4 (C17 / C17.2・ADR-1001)・CTX5・SRS NFR1003
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 本体の箱には、 標準の起動の型と同じ呼び方を持つ「何を起こすかの記述」の型を 1 つ置き、 実際に起こす段になったら、 その記述を「起こす役を差し込む口」へ渡すだけにします。 本番では、 外の箱が持つ本物の起こし役を、 実行 file が動き出す最初に 1 回だけ差し込みます。 外の箱の test も本体の code を同じ process で呼ぶので、 そうした test が最初に呼ぶ共通の関数 1 つで、 同じ本物を 1 回だけ差し込みます。 差し込まれていないときは「できない」を返し、 今ある「道具を起こせなかった」ときの扱いにそのまま落ちます。 本体の箱の各場所は、 組み立ての書き出しと読み込みの行だけを書き換え、 呼び方も判定も変えません。 test では、 何も差し込まなければ今までどおり本物が動き、 新しい test は、 起こした道具と引数を覚えて決めた結果を返す偽物を、 その test の中だけに差し込んで測ります。 全部の場所を書き換え終えたら、 本体の箱で道具を起こす場所が 1 つでも在れば落とす検査に変え、 外の箱で標準の起動の型を組む file が 2 つ以上になっても落とす検査を足し、 同じ便で外の箱の行数の上限を規則の行に足します。 要件書では、 1 つの変更を小さく保つ要件 (NFR1002) の根拠になり、 実行時に外部の部品に頼らない要件 (NFR1003) と、 器の子 process を memory の囲いの中で走らせる要件 (NFR1006) の形を変えず、 見張りの口が git を何回起こすかを test で測る要件 (NFR1005) と同じ測り方を全部の場所へ広げる根拠になります。
  採用 — OPT1
  core SHALL 子 process の起動を、 std の Command と同じ builder の面 (new・arg・args・current_dir・env・env_remove・stdin・stdout・stderr・process_group・get_program・get_args・get_envs) と同じ 4 終端 (output・status・spawn・exec) を同じ名と受け手の形で持つ型 1 つ (起動の記述) で組む。 終端 SHALL 起動の記述を解釈せず、 4 終端と 1 対 1 の method を持つ trait 1 つ (差し替え口) へ渡す。 本番の build で差し替え口 SHALL process に 1 回だけ据わり (2 回目は据えない)、 据えていない周の終端は io の Unsupported を返して各 site の既存の撃てない分岐に落ちる (新しい分岐を足さない)。 境界 crate SHALL 差し替え口の実物 1 つ (起動の記述を std の Command へ写して撃つ) を 1 file に持ち、 bin の main の先頭で据える。 境界 crate の e2e の test binary SHALL core の lib を同じ process で呼ぶ歯が最初に呼ぶ共通の関数 1 つで、 同じ実物を process に 1 回だけ据える (OnceLock)。 以後 core と境界 crate の本番の src で std の Command を構築するのはこの 1 file だけとする。 core の既存の site SHALL 構築の字面と use の行 (型の位置で Command を名指す包みと構築点では型の字面) だけを置き換え、 呼び方の形・判定と、 関数の引数の数・順・戻りの形を変えない。 呼び手は process_group と exec のための CommandExt の import を除き変わらない。 claude-spawn-points SHALL std の Command と起動の記述の構築を合わせて数える。 cfg(test) の build で core の歯 SHALL 据えずに撃てる (既定は歯の区間の実物で、 既存の歯はそのまま動く)。 新しい歯 SHALL 記録する stub (撃たれた program と引数を覚え、 決めた結果を返す。 実 process を起こさないので spawn の終端は失敗だけを返す) を据えて site が差し替え口を通ることを測り、 その stub は据えた歯の thread の外へ効かない (同じ process で並んで走る他の歯に漏れない)。 ADR-1033 の「core は Command::new を 0 本しか持たない」SHALL core の src の本体 (core-lines と同じ切り方) で 0 と読み、 core-spawn の母集団を本体にして 1 以上を deny にし、 同じ便で境界 crate の本体で Command::new を持つ file の数 (boundary-spawn) を 2 以上で deny にする。 境界 crate の行数の上限 R-C4-5 (kind BoundaryLines・deny・裁定 id user 2026-09-15T10:07Z) SHALL core-spawn の deny と同じ便で manifest に足し、 値はその便の base で測った境界 crate の src の本体 × 1.2 の切り上げとする (測る時点を ADR-1033 の移した直後から deny の便の base へ置き換える。 係数と裁定 id は変えず、 時点の置き換えは 裁定 id user 2026-09-24T00:13Z で同じ裁定の範囲内とする)。 撃つ関数を呼び手ごと境界 crate へ移す形と、 撃つ関数だけを移す純移動 SHALL NOT 採らない。 ADR-1001 の単一 binary、 ADR-1033 の core-lines の母集団・crate の構成・依存の向き、 R-C4-1 の値 SHALL 不変とする。 本 ADR が足す仕組みと引き換えに消すものは、 core の本体で std の Command を直に組む site (main 9f516d3 の実測で 34)、 5 file の CommandExt の import、 ADR-1033 が見込んだ純移動の 6 便の計画である (C17.2)。
  （平易）本体の箱は、 道具 (子 process) を起こすとき、 標準の起動の型と同じ呼び方 (道具の名前・引数・作業場所・環境の値・入出力の向き・process のまとまり、 の組み立てと読み出し) と、 同じ 4 つの起こし方 (結果を全部受け取る・終わりの状態だけ受け取る・起こして流しながら読む・自分をその道具に置き換える) を持つ型 1 つ (起動の記述) で組みます。 起こし方を呼ばれたら、 記述を解釈せずに、 4 つの起こし方と 1 対 1 の口 (差し替え口) へ渡します。 本番では口に起こし役を process に 1 回だけ差し込み、 2 回目は差し込みません。 差し込まれていないときは「できない」を返し、 今ある「起こせなかった」ときの扱いに落ちます (新しい扱いは足しません)。 外の箱は本物の起こし役 (記述を標準の起動の型へ写して起こす) を 1 file に持ち、 実行 file が動き出す最初に差し込みます。 外の箱の test の実行 file も、 本体の code を同じ process で呼ぶ test が最初に呼ぶ共通の関数 1 つで、 同じ本物を 1 回だけ差し込みます。 以後、 本体の箱と外の箱の本番の code で標準の起動の型を組むのはこの 1 file だけです。 本体の箱の今の各場所は、 組み立ての書き出しと読み込みの行 (起動を値として受け渡す包みと claude の組み立て役では型の名前) だけを書き換え、 呼び方・判定と、 関数の引数の数・順・戻りの形を変えません。 呼んでいる側は、 unix 用の追加の呼び方を読み込む行を除いて変わりません。 claude の組み立て役が 1 つであることを数える検査は、 標準の型と記述の型の組み立てを合わせて数えます。 test の build では何も差し込まずに本物が動き、 実物の git などを起こす今の test はそのまま動きます。 新しい test は、 起こした道具と引数を覚えて決めた結果を返す偽物 (起こして流しながら読む起こし方では失敗だけを返す) を差し込んで、 その場所が口を通ることを測ります。 その偽物は差し込んだ test の thread の外へは効かず、 同じ process で並んで走る他の test には漏れません。 前の決定の「本体の箱は道具を起こす場所を 0 本しか持たない」は、 test の区間を除く本体で 0 本と読み (行数の数え方と同じ切り方)、 1 か所でも在れば検査で落とします。 test の区間の本物と test 用の起動は数えません。 同じ便で、 外の箱の本番の code で標準の起動の型を組む file が 2 つ以上になっても検査で落とします。 外の箱の行数の上限 (R-C4-5・2026-09-15 の user の決定の印を持つ) は、 検査で落とすようにする便と同じ便で規則の行に足し、 値はその便の起点で測った外の箱の本体の行数の 1.2 倍の切り上げにします。 測る時点を引っ越しの直後からこの便の起点へ移すことは、 user が 2026-09-24 の決定 (裁定 id user 2026-09-24T00:13Z) で前の決定の範囲内と扱うと決めました。 道具を起こす関数を呼んでいる側ごと外の箱へ移す形と、 関数だけを移す引っ越しは採りません。 実行 file 1 つの決定 (ADR-1001)、 行数の数え方・箱の構成・頼る向き、 本体の行数の上限の値は変えません。 足す仕組みと引き換えに消すのは、 本体の箱で標準の起動の型を直に組む 34 か所、 5 file にある unix 用の追加の呼び方の読み込み、 前の決定が見込んだ引っ越し 6 便の計画です。
  （理由）前の決定は、 境界を人の判断でなく機械で決めると置き、 何が外の世界に触れる仕事かを「本体の箱が道具を起こす場所が 0」で決めると書き、 「純粋かどうか」を物差しにする案を退けました。 この記録はその「0」を user の決定の文面の物差しと読み、 本体に残る呼んでいる側を動かさずに満たします。 標準の起動の型と同じ呼び方を持つ記述の型を置けば、 各場所の書き換えは組み立ての書き出しと読み込みの行だけになり、 呼び方も判定も変わりません。 起こし役を口の向こうに置けば、 本物は外の箱の 1 か所に集まり、 test は偽物を差し込んで、 実物の道具では作れない回 (成功したのに空の出力) を作れます。 これは前の決定が帰結に書いた「歯は stub で撃てる」を、 引っ越しでなく口で実現する形です。 引き換えに、 道具を起こす関数と、 判定と起動を並べる関数群は本体に残り、 本体の行数は減りません。 前の決定が見込んだ形 (道具を起こす関数を本体に持たない) にいちばん近いのは呼んでいる側ごと移す案ですが、 それは判定を外の箱へ押し出すか、 切り方を人の判断に委ねます。 判定を本体に残すことを優先してこの案を選びました。 行数が減らない点は見込みと違うので user に尋ね、 user はそれを了解した上でこの案で進めると決めました (裁定 id user 2026-09-24T00:13Z)。 file の読み書きはどの案でも本体に残ります。 関数だけを移す案は、 本体が外の箱を名指せない作りのため組み立てができないので退けました。 向きを変える案の頼り合いの輪は、 実行 file を別の箱へ移すか、 道具を起こす関数を標準の部品だけで作る小さな箱に置けば切れますが、 どちらでも本体は道具を起こす関数を直に呼び続け、 test が偽物を差し込めないので退けました。 道具ごとの口の案は型で強く縛れますが、 流しながら読む場所に汎用の口が結局要り、 全部の口を定義する便が大きくなるので退けました。 この段をやめる案は費用が 0 で、 行数という元の目的は既に果たされており、 場所の増加も今の数を上限にする規則で止められ、 生き残る変異も関数を分ければ捕まえられる、 という強い利点があります。 それでも退けるのは、 本体が道具を直接起こす作りが残り、 偽物で測れる場所を 1 つずつ足していくことになるからです (選んだ案は全部の場所で口が 1 つです)。 実物を起こす今の test が残る点は、 どちらの案も同じです。 これは何を大事にするかの選択でもあるので user に尋ね、 user はこの段をやめる案を採らないと決めました。 偽物を test の thread の中に閉じるのは、 変異検査の道具が同じ process の複数の thread で test を走らせる回があり (基準の測定は常に、 変異の測定は狙う test の名が無い回に)、 process 全体に効く偽物だと他の test に漏れて、 生き残るはずの変異を捕まえたことにしてしまうからです。 外の箱の test でも本物を差し込むのは、 外の箱の test が本体の code を同じ process で呼び、 git を実際に起こして結果を確かめる test があるからです。 test の仕組みには全部の test の前に走る入口が無いので、 差し込むのは共通の関数 1 つです。 起こして流しながら読む起こし方では、 偽物は実物を起こさず、 標準の型の子は外から作れないので失敗だけを返し、 成功した回は本物を起こす test が持ちます。 本体の行数は減らないので、 前の決定が見込んだ移す量は成り立たないとここに書き残します。 行数の余裕は数え方の変更で既に戻っており、 この段が作るのは行数ではなく、 本体が道具を起こさないことと、 test が起動を測れることです。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  NFR1002（rationale）: NFR1002 は 1 契約の diff を 300 行程度に保つことを求める。 本 ADR は、 口を置く 1 便の後に site の置換を write-set の交わらない S の便に割れる形を選び、 driver の関数ごと移す L 級の便を退ける根拠を与える。
  NFR1003（claim）: 起動の記述と差し替え口は std の Command の面を写すだけで、 実行時の直接依存を足さない。 実物も境界 crate の中で std だけで書ける。 実行時の依存 0 本の約束はそのまま保たれる。
  NFR1005（rationale）: NFR1005 は host-guard が撃つ git の子 process の回数を歯が測ることを求め、 今は host-guard が偽の git の path を受ける自分専用の口を持ち、 それで回数を測っている。 本 ADR の記録する stub は同じ測り方を core の全 site へ広げる根拠になる (host-guard の今の口と歯は変えない)。
  NFR1006（rationale）: 封じ込めの包み (confine) は core に残り、 包んだ起動の記述を口へ渡すだけなので、 器の子 process を封じ込めの箱の中で走らせる形は変わらない。 起動の口が 1 か所になっても、 箱の外で走る子 process は増えない (本 ADR は NFR1006 を進めも損ないもしない)。
