  置き換えられた: なし (現行)
  部分 supersede で、 置き換えるのは ADR-1033 の実現方法の文だけである。 (1) 決定文のうち、 子 process を撃つ I/O 面 (std の Command を構築する関数) を境界 crate へ移すという部分は、 core が起動の記述を組んで差し替え口へ渡し、 境界 crate が差し替え口の実物 1 つを持って bin の main で据える、 と読む。 (2) 同じ決定文の「core は Command::new を 0 本しか持たない (xtask check の deny)」は、 「core の src の本体は 0 本 (歯の区間は数えない)」と読む。 (3) OPT1 の見込み (移す量は 3〜5 千行・純移動の機械証明で lens に渡せる・純移動の便が 6 本ほど) と、 帰結の「純移動の便が 6 本ほど要り、 その間 core と境界の use の path が動く」は成立せず、 口を置く 1 便と site を置換する 5 便と deny の 1 便に置き換わる。 (4) R-C4-5 の初期値を測る時点は、 決定文の「移した直後の実測」と帰結の「移動の最後の便で実測して確定」から、 「deny の便の base で測った境界 crate の src の本体」へ置き換わる (移動の便が無くなるため)。 係数 1.2 (実測 +20%) と裁定 id user 2026-09-15T10:07Z は変えず、 設計の見込みの値は 341 で、 ADR-1033 の見込み (移す 3〜5 千行の 1.2 倍) とは桁が違う。 時点の置き換えは 裁定 id user 2026-09-24T00:13Z で同じ裁定 (user 2026-09-15T10:07Z) の範囲内とし、 新しい A2 の裁定は要らない。 (5) 帰結 CSQ-P3 (境界 crate の関数は引数 → 子 process → 生の結果だけを返し、 判定は core の純関数に残る) と、 FR1047 の note の「純移動の証明で lens に渡る」は、 境界 crate が差し替え口の実物だけを持ち、 撃つ関数と driver の関数は core に残る形と読む。 不変のものは core-lines の母集団 (src の本体)・binary を境界 crate に置く構成・依存の向き (境界 → core)・R-C4-1 の値・ADR-1001 の単一 binary。 R-C4-5 の kind (BoundaryLines) は ADR-1033 には無く、 本 ADR の決定文が新たに置く。 boundary-spawn (境界 crate の本体で Command::new を持つ file が 2 以上で deny) も本 ADR の決定文が新たに置くが、 core-spawn・claude-spawn-points と同じ構造の検査で rules 行を持たない (本 ADR の解釈で C1 の rule value ではなく、 値を変えるのは ADR の改訂)。 発効は本 ADR が accepted になった後で、 それまで何も拘束しない。 段 2 の形は 裁定 id user 2026-09-24T00:13Z で本 ADR の案 (OPT1) に決まった。
