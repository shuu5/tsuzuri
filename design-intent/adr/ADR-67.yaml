# 判断の記録 ADR-67 — 話す窓の状態の行に、窓を起こした口座のふだんの statusline を先に出し、窓の 1 行を次の行に出す
# 判断の記録 ADR-57 の決定 (4) のうち、状態の 1 行の口が出す中身の字だけを置き換える（部分の置き換え・ADR-57 は封の一覧で本文が凍っているので本文は替えない・前例 ADR-57 の頭の注・ADR-66）。
# 起草は係 w277a（2026-10-06）。試作と歯と噛みも係 w277a（行 cs-status-seat・ノート surface-wave29d）。
id: ADR-67
title: 話す窓の状態の行は、窓を起こした口座の設定の statusLine の命令の出力を先に、窓の 1 行を次の行に出し、出せない周は窓の 1 行に訳の語を添える（判断の記録 ADR-57 の決定 (4) の状態の 1 行の中身の字の置き換え）
status: accepted
date: 2026-10-06
context: |
  持ち主の言葉（2026-10-06・memo t3-hub.88.1）。状態の行（statusline）と持ち主が呼ぶのは、席の窓に出るふだんの statusline（場所・model・使用量の上限など）であり、窓の数を並べた 1 行ではない。前の問い（t3-hub.84.3）の案 A は、状態の 1 行を「窓の控え・所見の数・束の要約値の頭・文脈の割合」の 1 行と読み違えた。
  今の形。判断の記録 ADR-57 の決定 (4) で、話す窓と問う窓の共通の設定に状態の 1 行の命令（tz consult statusline）を置き、口は作業場の窓の控えと所見の数と束の要約値の頭と Claude Code が渡す文脈の割合から 1 行を出す（行 cs-status-text・cs-status-verb）。窓は制限の形（claude --restricted）で起き、起動の口の設定（--settings）だけを読むので、口座の設定 file の statusLine（ふだんの statusline の命令）は窓に効かない（D）。窓の環境は口座の置き場（CLAUDE_CONFIG_DIR）を閉じた列で持ち、状態の行の命令はその環境で撃たれる（I・Claude Code が命令に自分の環境を渡す）。
  口座の命令の字は口座ごとの設定の値で、code に書かない（条 N-7）。命令の出力は、窓が書ける作業場の字（題・git の枝の名など）を含みうる。
decision: |
  (1) 置き換える字。ADR-57 の決定 (4) の「状態の 1 行の口は読むだけで、作業場の窓の控えと所見の数と束の要約値の頭と、Claude Code が渡す文脈の割合から 1 行を出す。」を、「状態の行の口は、窓を起こした口座の設定 file の statusLine の命令の出力の行を先に、作業場の窓の控えと所見の数と束の要約値の頭と Claude Code が渡す文脈の割合から組む窓の 1 行をその次の行に出す（判断の記録 ADR-67）。」に置き換える。ほかの字（命令を共通の設定に置くこと・囲いの外で走り制御の字を落とし symlink を辿らないこと・Remote Control の字・撤退の条件 (4)）は効いたまま。
  (2) 口座の命令。口座の置き場は器の今の口座の解き方と同じ環境の CLAUDE_CONFIG_DIR から引き、その下の設定 file（settings.json）の鍵（statusLine の command）の字をそのまま殻（sh -c）で撃つ。標準入力には Claude Code が口に渡したのと同じ session の JSON を渡し、cwd は作業場、標準エラーは捨てる。子は新しい process group に入れ、上限 1.5 秒（命令の字の timeout 2 の内）を越えたら group ごと止める。
  (3) 出せない周。口座の置き場が無い・設定 file が読めないか JSON でない（読めない）、鍵が無い（鍵なし）、命令が起きないか rc が 0 でない（落ちた）、上限を越えた（時間切れ）、口座の命令の中から口が撃たれた（入れ子・子に印の環境変数を置いて見る）周は、窓の 1 行の末に欄「口座 <訳の語>」を足した 1 行だけを出す。黙って飛ばさない（条 P-7）。命令が rc 0 で何も出さなければ窓の 1 行だけを出す（命令の出した物のまま）。
  (4) 字の守り。口は囲いの外で持ち主の権限で走るので、口座の命令の出力は行ごとに、色の制御の並び（色の指定（SGR）・ESC [ の後が数と ; だけで m で終わる・画面を動かさない）だけを通し、ほかの ESC の並び（m 以外で終わる並び・題の書き換えほか・単独の ESC）は並びごと丸ごと落とし、制御の字と向きの上書きの字を落とす。見える字で 1 行 400 字・頭の 8 行に切り、末の空の行を除き、色を通した行の末に色の戻しを足す（次の行に色を持ち越さない）。読む出力は 64 キビバイト（KiB）まで。ふだんの statusline の色はそのまま出る。
  (5) 再描画の間。起動の口は、起こす時の口座の設定 file の再描画の間（statusLine の refreshInterval・0 以上の整数）を、話す窓の設定の statusLine に同じ値で写す。無いか整数でなければ置かない。起動の口の検めは値の違いと欠けを断る。
  (6) 問う窓。問う窓の設定は今のまま（再描画の間を写さない・画面が無い）。口の振る舞いは窓の形で分けない。
  (7) 行。行（cs-status-seat・ノート surface-wave29d）が作る。窓は、行の着地の後に起こすか開き直した時から新しい形で起きる。
options:
  - id: a
    name: 甲 — ふだんの statusline を先に、窓の 1 行を次の行に出す
    text: 決定 (1) から (7)。
    verdict: adopted
    reason: 持ち主が見たいふだんの statusline（場所・model・使用量の上限）が窓にも出て、窓ごとの数（所見・文脈の割合）も次の行に残る。出せない周は訳の語で分かる。
  - id: b
    name: 乙 — ふだんの statusline だけを出す
    text: 同じ撃ち方で口座の命令の出力だけを出し、窓の 1 行は出せない周にだけ訳の語と出す。
    verdict: rejected
    reason: 窓の番号・所見の数・文脈の割合が画面から消え、窓を見分けるのは tmux の窓の名だけになる。
  - id: c
    name: 丙 — 起動の口が口座の命令の字を窓の設定へそのまま写す
    text: 窓の設定の statusLine の命令を口座の命令の字に替え、tz の口を挟まない。
    verdict: rejected
    reason: 窓の 1 行が出なくなり（乙と同じ）、囲いの外の命令の出力の制御の字を落とす所が無い。口座ごとの命令の字が起動の口の検めの材料に入る。
basis: [ADR-57, ADR-29, FR19, P-7, N-7]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、相談の窓の状態の行の memo（t3-hub.88.1）か後継の memo の notes に記帳する。窓の始まりは行（cs-status-seat）の着地の後に最初に起こした話す窓の時刻である。問う相手は持ち主。
    (1) 口座の命令が窓の画面を止めたか遅らせた（入力が遅れた・状態の行が 2 秒を越えて替わらない）例が 1 件でも出たら、口座の行を外して窓の 1 行だけに戻すかを問い直す。
    (2) 窓で口座の行が訳の語（読めない・鍵なし・落ちた）を出し続け、席の窓のふだんの statusline が同じ口座で出ている例が 1 件でも出たら、環境の受け渡しを調べ、直せなければ起動の口が置き場の path を命令の引数で渡す形を問う。
plain: |
  相談の窓の画面の下の状態の行に、席の窓と同じふだんの statusline（場所・model・使用量の上限など）を出し、その下に窓の番号・所見の数・文脈の割合の 1 行を出します。
  ふだんの statusline を出せないとき（設定が無い・命令が落ちた・時間がかかりすぎた）は、窓の 1 行の末に「口座 落ちた」のような短い訳を出します。
  失うのは、口座の命令の重さだけ窓の画面の更新が遅れうること（1.5 秒で切る）です。命令は窓の外の file を読んで画面に出しますが、窓の model には渡りません。色はそのまま出し、画面を動かす制御の字だけを落とします。
grill:
  when: 2026-10-06
  who: 起草係 w277a（AI・試作と歯と噛みも同じ係）
  where: 起草の置き場の w277a の notes.md
  summary: 口座の命令の字は設定の値のまま撃ち、出せない周は訳の語を添える。出力は色の並びだけを通してほかの制御の字を落とし、長さを切る。命令の中から口が撃たれる入れ子は印の環境変数で止める（止めないと process の鎖が終わらない）。命令が窓の画面を遅らせる恐れは上限 1.5 秒と撤退の条件 (1) で見る。
approval:
  who: 持ち主
  date: 2026-10-06
  ruling: "t3-hub.88.1.4（裁定 id = t3-hub.88.1.4:20261006T0424Z-1・notes に逐語）"
  verbatim: "どちらも推奨で良い"
  surface: R-8
consequences:
  - 話す窓の状態の行が 1 行から（口座の命令の行の数）+1 行になる。命令の出力の色は通し、ほかの制御の並びは落ちる。
  - 口は口座の命令を囲いの外で持ち主の権限で撃つ。命令は窓の読めない file（口座の置き場の下の使用量の控えなど）を読んで画面に出し、命令によっては file を書く（命令の持ち物）。窓の model は状態の行を読まない（I）。
  - 状態の行の口は file を書かない口のままだが、読むだけの口ではなくなる。要件 FR19 の「窓の記録を読むだけの状態の 1 行」の字を同じ commit で改める（要件書の版上げ）。
  - 口座の設定 file に statusLine が無い口座では、窓の 1 行の末に「口座 鍵なし」が出続ける。
note: 起草は係 w277a。承認の欄の逐語と経路は、適用の script が台帳の問いの notes の定型行から読んで入れた。
