  - "良い結果: 測っていない差分は起点が動かないので次の日次の検出に含まれ、 deferred と測れなかった周は measured と別の語で event と写しの置き場に残る (C10)。 pipe show --run は deferred を今の読み手のまま出し、 撃った便の行は since と runs でまとめた範囲を示す"
