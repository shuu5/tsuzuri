note: |
  器の元の file: scribe2/design-intent/decisions/ADR-0111-the-detection-line-runs-once-a-day-from-the-detection-origin.html
  器の表紙の頭: 設計判断記録 (ADR) scribe2 — 日次の検出
  器の表紙: 状態accepted選択肢6件 (OPT1–OPT6)結果良い 5 / トレードオフ 6版v0.1.0 / 2026-10-03
  器の表紙: 正当化する要件: SRS-SCRIBE2-MVP の NFR1006・FR1046・FR1050
  器の表紙: 想定読者: scribe2 の開発 session と user — 器の内部と Rust の専門知識は不要 (専門語はやさしい言葉を併記)
  器の承認の欄: 裁定 (user)・user・裁定 id s2-07l.736.34:20261003T0149Z-1 (台帳の問い s2-07l.736.34 への答えの要旨: 検出線を着地ごとから 1 日 1 回にまとめてよい)。 逐語は台帳にだけ在る・裁定済
  器の承認の欄: 設計 (orchestrator)・orchestrator・2026-10-03 草稿 v1 (land の finish が着地後の検出の口を起こす 1 か所・撃たなかった周の書き手・写しの置き場と pipe show の読み手・凍結した宣言の検出線の行を main 86cc4a25 の現物と設計 gate-cost §44 で読み、 host の書き込みと検出線の本数・変異の数・秒と GitHub の週次の変異検査の結果を実測した)。 形 (着地の終端の起こし方のまま回数を間引く)・検出の起点の file・base と歯の名の取り方・記録の足し方は、 裁定の下の orchestrator の決定。 拘束する constitution の版 0.5.0・作成
  器の案の章の要約: 候補を 6 つ並べます。 着地の後の起こし方はそのままに回数を 1 日 1 回に間引き、 前に測った位置から差分をまとめて測る案 (選んだ案) と、 選ばなかった 5 つです。 選ばなかった案は、 席ごとの定期の見張り (管理 tick) から撃つ案・GitHub の定期の CI へ移す案・変異検査専用の timer を足す案・着地ごとのまま一時の場所を memory に置く案・変異検査をやめる案です。
  器の専門語の説明: 本文に出てくる専門語 12 個を、 やさしい言葉で説明します。
  ・検出線（detection line）: 超えたら機械が検知して記録する線で、 PR も着地も止めない。 本 ADR では、 vessel 宣言の検出線の行 (変異の生存を測る道具の 1 行) を指す (C12.4・R-C12-1)。
  ・着地後の検出（post-landing detection）: 便が Landed に達した後に、 器が land から切り離した子 process で検出線の行を撃つこと (ADR-1060)。 受付札を取り、 封じ込めの箱と器の健康の遮断器を通る。 結果は record と event に残し、 着地は戻さない。
  ・日次の検出（daily detection）: 着地後の検出を、 land の終端の起こし方のまま、 rules 行の下限 (1 日) を空けて起こす形 (本 ADR)。 下限の内の便は口を起こさず deferred を記し、 起こした便は検出の起点から着地した sha までの差分をまとめて測る。
  ・検出の起点（detection origin）: state dir の pipe の置き場の直下の 1 file で、 前に測った main の sha (measured) と前に口を起こした時刻 (fired) を 1 行に持つ (本 ADR)。 測った周と面の外の周だけ measured が進み、 測れなかった周は動かない。
  ・変異の生存（mutant survival）: code をわざと書き換えた変異のうち、 歯 (test) がどれも落ちずに見逃したもの。 検出線はこの数を記録し、 deny への昇格は裁定 id つきの user 裁定でだけ行う (C12.4)。
  ・冷えた build（cold build）: 前の組み立ての成果 (target) を使い回さず、 一時 dir の木でゼロから組む build。 今の着地後の検出は、 便ごとに baseline の 1 回と cargo-mutants の job の写し 4 本でこれを払う。
  ・受付札（admission ticket）: host 単位の並列の枠を 1 組借りる印。 検出線の行は撃つ前にこれを取り、 枠が空かない周は待ちの上限の後に並列度 1 へ縮退する (SRS NFR1006・FR1046)。
  ・写しの置き場（copy place）: 便の run dir の中で、 検出線の周ごとに判定行の写しか撃たなかった理由の file を置く dir (設計 gate-cost §15)。 pipe show --run はここから検出線の行を出す。
  ・純移動（pure move）: code の中身を変えずに置き場だけを移した差分。 純移動と証明された hunk は変異を生やす差分から外して道具に渡す (設計 gate-cost §14)。 本 ADR の後は、 base が親の周だけこの付け足しを使う。
  ・rules 行（rules row）: manifest に置く規則の値 1 行 (値・有効か無効か・裁定 id・裁定日)。 足すにも変えるにも裁定 id が要る (C5)。 本 ADR は日次の検出の下限の行を 1 本足す。
  ・裁定 id（ruling id）: user の裁定を一意に指す id。 本 ADR の裁定は台帳の問い s2-07l.736.34 への答えで、 逐語は台帳にだけ在る。
  ・land の終端（land terminal）: 着地の後に器が続ける 3 手 (remote への push・着地 commit の CI の照合・台帳の close) と、 その記帳 (SRS FR1050)。 着地後の検出の口は、 この段の finish が切り離して起こす。
