# 判断の記録 ADR-63 — 起草から着地までの 8 つの段ごとに、論点の持ち手を機械の床・AI の天井・日次の物差しのどれかで置き、席の頼みの文と目と記憶だけに頼る所を無くす
# 判断の記録 ADR-59・ADR-32・ADR-45・ADR-33 は封じてあるので本文は替えず、この記録に足すか、この記録で持ち手を替える。
# 起草は係 w229a（2026-10-05）。検証役 qv63 の攻め（所見 19）と席の決めで係 w231a が直した（同じ日）。材料は席の調べ（drafts/audit-20261005 の synthesis.md と au1〜au4 の out.md）と、係が読んで撃って確かめた器と tsuzuri の現物（main 39ef378b と、行 t-fold-3 の着地の後の 55f0c39f）。
id: ADR-63
title: 起草から着地までの 8 つの段ごとに、論点の持ち手を機械の床か AI の天井か日次の物差しのどれかで置き、席の頼みの文と目と記憶だけに頼る所を無くす（判断の記録 ADR-59 の決定 (2)(4) と ADR-32 の決定 (4) に足して決定 (10) の値の持ち手を替え、ADR-45 の門 H1 の鍵 teeth-check を名乗り、ADR-33 の決定 (12) を床に上げる）
status: accepted
date: 2026-10-05
context: |
  持ち主は、起草係（契約の行と試作の code を書く AI の係）が仕組みに落ちておらず、席が頼みの文を場当たりに足していると懸念し、並列性のほかの論点（歯の file の増え・効率の悪い code・審査の確かさ・審査の前の防ぎ・ゴールを見失わない事）と、まだ見落としている論点も含めて、仕組みに落とすよう求めた。審査が確かである事は、持ち主が自分で挙げた論点である。席は 2026-10-05 に調べの係 4 体で数を確かめ、検証役 1 体が案を攻めた。印は V（撃って確かめた）・D（記録から導いた）・I（見立て）・U（分からない）。窓は 10-03T00:00Z〜10-05T10:06Z の 149 便。
  (ア) 便は差を当てるだけで、code は起草の段で全部書かれる。窓の 149 便の verify の 1 行目が、全部差の file の当たりの照らしだった（V）。
  (イ) 着地は確か。133 bead の 91% が 1 本目の便で着地し、main-red は 0・revert は 0（V）。
  (ウ) 質の持ち手がどの段にも無い。起草係に効く門は、行（ag-plugin）の着地（10-05）まで 0 本で、決まりは 6 か所に散り、git の外の頼みの共通の文と手引きの参照の file が 25 分で食い違った（V）。契約審査の雛形の観点 3 つは全部契約の字との適合で、PASS の根拠 148 のうち質の語を持つ物は 4（V）。それでいて便の新しい token の 62% を使う（窓の 3 日で契約審査 1,730 万・gate 740 万・実装 320 万・V）。gate は質の 5 観点を数えるが PASS の決めに効かず、gate の PASS 133 便のうち 53 便の質の指摘（delete を 1 以上と数えた便 18・観点ごとの和は delete 19・shrink 44・yagni 5）と、contract-fit・teeth-nonvacuous・constitution のどれかを 1 以上と数えながら PASS にした 7 便（5%）は、器のどこにも行かない（V）。同じ「同じ値を 2 か所に手で書く」が、ある便では FAIL、別の便では constitution 2 の PASS になり、後者の 2 つの値は今も main に在る（V）。gate の審査役は中央 9 turn・46 秒の浅い読みで、契約審査は 26〜28 turn で差を全部読む（D）。
  (エ) 審査の前の防ぎは厚い（噛み 133/135 行・置く前の受付の試し preflight を名指す notes 66/127・V）。それでも契約審査の落ち 10 件のうち 7 件は機械で見られる型だった（D・近似）。器は欄 done-teeth の照らしを既に持つが、欄の要否（番号つきの done の項目と欄が在るか）を断るのは器の表の検査（器の contracts check に --base を渡した周）だけで、tsuzuri でその周を撃つのは席の設計の commit の門（git の外の席の道具）だけである。受付と preflight は欄が在る行の形を見るだけで、欄の無い行を断らない（V）。tsuzuri の器への宣言は鍵 teeth-check を名乗っていない（判断の記録 ADR-45 の門 H1・鍵 6 つのうち 0・V）。名乗りで止まる見込みは、done と歯の対応の型の落ち 4 件のうち欄を持たなかった 2 件だけで（V）、ほかの 2 件は欄を持ったまま落ちた（V）。
  (オ) 並列の得のために曲げた形を返す時が決まっていない。歯の helper の字で同じ写しは 1,322 個・8,264 行（名が同じ物まで数えると最大 約 2 万行・V）、置き場を差の当たりで決めた行が 5（V）、module の頭の doc の行の id が 524 行（V）。畳みの引き金は席の目だけで、段の file が 12 本に達してから畳みの行を置くまで 22.6 時間かかり、41 本まで溜まった（V）。群の上限 1 万行を見る物が無く、畳みの道具の数え（群の dir の直下の .rs・入口の file を除く）で、10-05 の main（39ef378b）では 2 群が越えていた（中核の teeth1 10,127 行・境界の teeth3 10,001 行・V）。行（t-fold-3）の着地（55f0c39f）で越える群は 0 になったが、群は上限まで詰めるので、23 群のうち 16 群が 9,000 行を越え（最大 9,996 行・V）、群の中の歯を直す行で上限を越えうる。
  (カ) 起草係の予算は、頭に予算の在る係 250 体のうち 87% が越え、倍率の中央は 1.69。10-04 からの 100 体では 76% が越え、予算 10 万以下は 9/9、10 万を越える予算でも 67/91（74%）が越えた（D）。
  (キ) ゴール。10-05 に置いた行のうち、要件の追跡（trace）のままで要件書の目指す所の 2 番（グラフ）を引く行は 29/66 だが、そのうち 19 は相談の窓の要件（FR19）を引く行で、調べ係の読みでグラフの本体に直に効く物は 8/64（V・D）。目指す所の 5 番（ほかの project でも最初から十全に動く）を引く要件は 0（V）。席は持ち主に誤った数（歯の file 54 本から 488 本）を確かめた数として出した（正しくは 385 本から 488 本・V）。
  (ク) 記憶にしか無い決まりと、記憶にしか無い計画。器を書く便は同時に 1 本（ADR-33 の決定 (12)）は、器にも席の道具にも字が無く、席の記憶と hold だけで守られ、10-04 と 10-05 に 2 本並んだ（V・D）。次の段の行・週ごとのまとめ・畳みの日は、席の記憶と文脈だけで次の一手が起き、文脈の圧縮で失われうる（数えの memo t3-hub.80 の (f)・D）。
decision: |
  (1) 枠。起草から着地までを 8 つの段（行を選ぶ・頼む・起草・出す前・設計の commit と受付・契約審査・gate・着地の後）に分け、論点ごとの持ち手を 3 つの型のどれかで置く。床は器か係の門か歯か席の門で、機械で決まる項目を持つ（条 P-6.1）。天井は規律の手引きの参照の file（plugin/skills/agent-discipline/reference.md）と審査の雛形で、意味の判じを持つ（条 P-6.2）。物差しは日次の測りの群 q（決定 (9)）で、撤退と次の問いの材料になる。物差しの項は道具の key で名指し、この記録は項に番号を付けない。機械で決まる項目を天井に残さない。天井の文は決まりの正本でなく、正本は門と歯である（条 N-2・判断の記録 ADR-59 の決定 (6)）。段と論点の割り当ての表は帰結の欄（consequences）の 1 つ目の項に置く。
  (2) 手引きの正本は 1 つ（頼む・起草の段・天井）。reference.md を、席の起草の決まりの唯一の正本とする。git の外の頼みの共通の文にしか無い 4 項のうち 3 項（行を数珠つなぎにしない・門に断られたら回り込まず止めて知らせる・token の節約）を reference.md へ移す。残りの 1 項（案内の幅 100 字）は器の入れ子の歯（接頭辞 cli_help_）が既に落とすので写さず、手引きは歯の名だけを指す。共通の文は席の置き場の退役の dir へ移して頼みの文から指さない（ADR-59 の決定 (6) の、移した後は頼みの文から指さないの履行）。reference.md に次の天井を足す。(a) 置き場の物差しの順。領域（domain）の親に置く、交わる時は差の塊の文脈を離して両順で当てる（判断の記録 ADR-60）、それでも当たらなければ depends を書く。交わりのために置き場・名・並びを曲げた行は、節に「置き場の妥協」の 1 文を書く（決定 (8) の (d) の材料）。(b) 根の src の module の頭の doc に行の id を書かない（行の id は契約と commit が持つ）。正規表現で数えられるので、S3 の行（t-doc-ids-a）で xtask の lint の歯にし、それまでは天井とする。(c) goal に歯の本数を書かない（本数の正本は欄 done-teeth・条 P-2.3）。字の型を起草で照らし、数えられる形なら同じ lint の歯に入れる。(d) 実装の source の字を照らす歯を足す時は、振る舞いで測れない訳を節に 1 文書く。
  (3) 予算の下限（頼むの段・係の門）。起こしの門（ADR-59 の決定 (2)）は、頭の予算が新しい量 15 万より小さい起こしを、直した頭の見本を付けて断る。値は中核に置く下限の定数 1 つが持つ。群の係ごとの上限（MEMBER_NEW・判断の記録 ADR-61 の決定 (2)）は今同じ 15 万だが、下限は全部の起こし・上限は群の係ごとで中身が違うので共有せず（共有すると群の上限を上げた時に下限が黙って上がる）、歯で「下限 ≦ 群の係の上限」を見る（一致を強いる写しでないので条 P-2.4 に当たらない）。得は、予算 10 万以下の起こし（10-04 からの 100 体のうち 9 体・全部越えた）が出来ない予算で途中で書き終えの段に入り、新しい 1 体に頼み直す往復が減る事に限る。10 万を越える予算でも 74% が越えるので、越えの主因は見込みの低さで、下限では直らない。見込みの字は席の天井のまま、物差しの予算の項（drafter_budget_over）の型ごとの越えの率と倍率の中央を次の見込みに使う。
  (4) 出す前の床（出す前の段・係の門）。終える前の門（ADR-59 の決定 (4)）の欠けに 1 つ足す。頭の出す物が差の file（.patch）を名指す係は、出力の dir に床の記録の file（floor.tsv）を置く。記録は差の file ごとに 1 行で、行の id と、preflight（scribe2 pipe preflight）・tz check・tz derive --check・器の表の検査（scribe2 contracts check に --base main を渡した周）・verify の 2 行目から最後の行の、それぞれの rc を持つ。記録が無い・行が欠ける・rc が 0 でない時は、1 度目の終わりを止める（2 度目は ADR-59 のまま記帳して通す）。門は、数秒で済む 4 本（preflight・tz check・tz derive --check・器の表の検査）を床の写しで自分で撃ち直して記録の rc と比べ、食い違いも欠けとして止める。cargo の verify の行だけは撃ち直さず記録を受ける。門が床の写し・state dir・道具を見つけられず撃ち直せない時は、まだ分からない（条 P-7.2）として 1 度目の終わりを止め、何が見つからないかを名指す（2 度目は ADR-59 のまま記帳して通す）。要否は頭の出す物の字が決め、係が名乗る除外の印は置かない（条 N-3.1）。記録が在る事も撃ち直しの合格も、完成とも審査の合格とも扱わない（条 P-6.3）。
  (5) 名乗り（設計の commit と受付の段・器への宣言と席の門）。tsuzuri の器への宣言（.vessel.toml）に、器の任意の鍵 teeth-check を真で名乗る（判断の記録 ADR-45 の門 H1 の鍵の 1 つ・前の 1 歩の行 t-teeth-col と v-atk-names は着地済み）。名乗りで、器の表の検査は done の字が base と違う行に、番号つきの done の項目と欄 done-teeth を求める。tsuzuri でこの周を撃つのは、席の設計の commit の門（commit-design.sh・ADR-45 の門 H1 と同じ働きの席の門）で、断った行は main へ入らない。受付と preflight は欄が在る行の形を照らす（欄の要否は見ない）。席の門は断るごとに 1 行（時刻・ノート・断った門の名・rc）を席の道具の置き場の file に残し、物差しの床の断りの項（floor_refused_3d）が数える。器の新しい行は置かない。
  (6) gate の判定と数の揃い（gate の段・器の床）。gate の審査役が PASS を返し、findings の contract-fit・teeth-nonvacuous・constitution のどれかを 1 以上と数えた周を、器は判定と数の食い違いとして FAIL に読む。理由の型（verdict-count-mismatch）を付け、evidence に数えた数を写す。審査役が自分で違反を数えた周なので、判じられない周（条 P-7.2 のまだ分からない）でなく、不合格に読む。FAIL なら器の今の道（直前の FAIL の材料を次の gate に渡す口 prior_fail・memo の FAIL の口・席の撃ち直しの手順）に乗る。まだ分からない（INCONCLUSIVE）に読む形は、材料が次の gate に渡らず、同じ差を撃ち直すだけで回りが閉じないので採らない。あわせて gate の雛形（lens.txt）の判定の決め方に「contract-fit・teeth-nonvacuous・constitution を 1 以上数えたら PASS を返さない」の 1 文を足す。雛形は決定 (7) と同じ行で替え、雛形の指紋の替えを 1 回にする。席の型の表（同じ値を 2 か所に手で書くと FAIL など）は雛形に足さない。条 P-2.3 と P-2.4 は既に憲法に在って gate の constitution の観点が読むので、食い違いを機械が拾えば足り、古びる表を持たない。
  (7) 質の指摘を捨てず、返す（gate と着地の後の段・器の口と席）。gate の雛形（lens.txt）の出す JSON に、0 でない観点ごとの場所の列（at）を足し、器は判定の記録（verdict.json）に写す。観点の種類と数え方は替えない。器の memo の口（scribe2 ledger memo --run・台帳を読まず書かない・器の判断の記録 ADR-0045 §2）が、gate の PASS のうち findings の delete を 1 以上と数えた便からも memo の案（evidence と at を写す）を組めるようにする（今は FAIL と INCONCLUSIVE の終端だけで、PASS の記録は場所を持たない）。起票は席が今の道で撃つ。stdlib・native・yagni・shrink は 1 件ずつ起票せず、物差しの質の項（gate_pass_quality_3d）の 7 日の数と便の id の列から、席が週に 1 度、1 本の memo にまとめる。返す道として、開いた delete と constitution の memo と週の memo を、週に 1 度、掃除の行 1 本（大きさ M まで・gate に渡す差の上限 150,000 byte）に束ねて置く。最初の掃除の行の材料は、今 main に在る食い違いの 7 便分の指摘とする。乙'（契約審査が質を数える形）は、この決定の中の条件つきの段とする。乙' では、gate の質の 5 観点（delete・stdlib・native・yagni・shrink）の字を器の雛形の部品の file 1 本へ移し、契約審査の雛形（lens-contract.txt）がそれを読んで質を数え、判定の記録（review.json）に数と at を写すだけで、判定の決め方は替えず FAIL にしない。gate は質を数えない。観点は流れ全体で 5 つのまま置き場が動くだけで、審査の係も増えないので、条 N-5.1（文書の型ごとの係や検査の観点の増設を拒む）に当たらない。返し先は掃除の行と、同じ置き場の次の起草係の頼み。入れる前に、席は同じ過去の便 3 本の契約審査を今の雛形と乙' の雛形で 1 度ずつ撃ち、対の差の中央が 2 万以下なら席が入れ（器の行を 1 本足す・対の差の幅も記帳）、越えたら持ち主に問う（約 70 万）。撃ち直しの時刻・cache の温まり・審査役の揺れを、元の便の量との比べに混ぜないためである。過去の便に別の雛形を当てる口が器に無ければ、測りの前に器の行が 1 本要る（U）。乙' の器の行は、memo の口と判定の記録の写しを review.json の数と at へ向け直し、席は質の項（gate_pass_quality_3d）に代わる契約審査の側の項を足してから入れる（そうしないと PASS の memo の案と質の項が涸れ、撤退 (3) の数えが効きでなく材料の無さで減る）。入れた日を物差しの頁に記帳し、撤退 (3) の数えはその日の前後で分ける。契約審査が質で FAIL にする形（乙）は採らない。
  (8) 畳み（着地の後の段・物差しと席の道具と畳みの行）。(a) 群の行は、畳みの道具（fold2.py）と同じに数える（群の dir の直下の .rs・入口の file（main.rs）を除く・物差しの道具も 10-05 にこの数えに揃えた）。群の上限 1 万行（持ち主の裁定・ADR-32 の決定 (2)）と詰め方（上限まで詰める・ADR-32 の決定 (2)(4)）は替えない。この数えで 10-05 の main（39ef378b）で 1 万行を越えていた群 2 つ（中核の teeth1 10,127 行・境界の teeth3 10,001 行）は、畳みの行（t-fold-3）が両方から 1 module ずつを移して割った（着地 55f0c39f の後は 0 群・V）。今 9,000 行を越える 16 群は前もって割らず、群の中を直す行で 1 万行を越えた群は、次の畳みの行が割る（ADR-32 の決定 (4) に足す）。上限と段の file の上限 24 本は、全部の行を落とす歯にしない（共通の verify の xtask の check に入れると、群の歯を書く行と段を足す行が全部の便の gate で落ちうる）。2 つの値（上限 1 万・段 24）は束ねの表の file（kfold.rs）の定数が持ち、席の道具と物差しはそこから読む（ADR-32 の決定 (10) の値の持ち手を、席の道具の頭から repo の中の 1 か所へ替える・条 P-2.3）。値と比べる撃ちは歯にせず、xtask の下の命令（kfold-cap）にして、畳みの行の verify だけが名指す。命令は、畳みの行が書く範囲に持つ群と作る群だけを比べて落とし、ほかの群の越えは出力に名指すだけで落とさない（起草から着地までの間にほかの行の着地で群が越えても、畳みの行が落ちないため）。歯の印で外す形（#[ignore]）は例外の口になるので作らない（条 N-3.1）。物差しの群の最大の行の項（group_max_lines）と段の数の項（fold_stages）が毎日見る。(b) 段の file が 12 本以上の日は、段の数の項（fold_stages）が日次の頁に出し、席はその日に畳みの行を置く（ADR-32 の決定 (4) の引き金を席の目から物差しへ移す）。24 本に届いた日は、畳みの行が着地するまで、席は段を足す行を器の列で待たせる（hold）。(c) 畳みの行は、群へ移す歯の file の helper のうち中身が字で同じ物を、群の dir の共通の module 1 本へ寄せる（fold2.py の手に足す）。新しい行は今どおり自分の段の file の中で写してよい（並べる行の数を落とさない）。(d) 群の行が全部着地した後に、「置き場の妥協」の 1 文を持つ行の形を畳む行（形の畳み）を席が置く。
  (9) 物差しの群 q（全部の段・物差し）。日次の測り（席の道具 eval_daily.py・repo の外・ADR-36 の決定 (11) の測りの口 1）の群 q を、この記録の物差しとする。項の論点の番号は道具の見出しの表（LABELS）が正本で、この記録は項の key で名指す。今在る項は、着地（first_run_landed_3d・main_red_3d・main_revert_3d）、ゴール（goal_direct_1d・goal5_reqs）、審査（gate_pass_quality_3d・gate_pass_fit_3d・review_fail_kinds_3d）、審査の前（review_fail_machine_3d・intake_refused_3d・floor_refused_3d）、歯（teeth_files・helper_dup_lines・fold_stages・group_max_lines）、token（tokens_by_source_3d・drafter_budget_over）など。足す項は、判定の食い違いの FAIL の数（gate_mismatch_3d）・契約審査の落ちの done と歯の対応の型ごとの数（review_fail_teeth_kinds_3d・欄を持たない型と持つ型を分ける）・開いた質の memo の数（quality_memos_open）・契約審査 1 回の新しい量の中央（review_tokens_median_3d）・着地 1 本あたりの新しい量の中央に起草係の量を足した値（landing_tokens_median_3d）・係の終える前の門の止めと撃ち直しの食い違い（agent_stop_floor_7d）・期日を過ぎた持ち手の bead の数（overdue_holders）。今まだ分からない（U）の 2 項は、測る口を作る。予算の項（drafter_budget_over）は、係の終える前の門（agent-stop）が係の新しい量と頭の予算と倍率を起草の置き場の <名> の下の予算の記録の file（usage.json）に書き、物差しが前の日の分を読む。床の断りの項（floor_refused_3d）は、決定 (5) の席の門の 1 行の記録を読む。ゴールの項（goal_direct_1d）は、要件の追跡のまま目指す所の 2 番を引く行を数え、要件ごとの内訳（by_req）で相談の窓の要件（FR19）を分けて見せる。FR19 の追跡の広さは、目指す所の 5 番を引く要件と 1 本の問いにする（決定 (12)）。群 q は ADR-36 の基準（門と目安）に入れず、基準の表を替えない。席が持ち主に確かめた数として出す数は、群 q の出力か、別の道の命令で照らし合わせた数に限る（天井）。
  (10) 記憶の対応表（全部の段・天井から床へ上げる道）。席の記憶の項ごとに、行き先（器の門・係の門・手引き・tsuzuri だけ・消す）と、結んだ行か判断の記録の id を表にし、数えの memo（t3-hub.80）の notes に置く（公開の repo に置かない）。仕分けは係 1 体で 1 度撃つ。記憶にしか無い決まりは決まりとして扱わない（条 N-2.1）ので、表は記憶を門・手引き・消すへ移す道の帳面で、表の行そのものは決まりでない。
  (11) 順と流し方。行は 3 つの段（S1・S2・S3）で置き、行の一覧と大きさと depends は consequences に書く。S1 は今置く。S2 の行・S3 の行・週 1 の束ね（質の memo のまとめと掃除の行）・記憶の対応表・乙' の測りは、この記録の適用の時に席が台帳の bead にする。S2 の bead は依る S1 の bead への依存を、S3 の bead は S2 の bead への依存を持ち、週 1 の bead は defer の日付を持って、閉じる時に次の週の bead を起こす。bead は器の列の一覧に出るので、席の文脈の圧縮を越えて残る。走っている便は止めない。新しい機能の行の起草も止めない。決定 (5) の名乗りの行の着地の後に置く行は、欄 done-teeth を持つ。器の行は S1 の 2 本（決定 (13) の床の行と、決定 (6)(7) を 1 本にまとめた行）で、床の行を先に流し、もう 1 本はそれに依る。S3 の行は、規則の行 R-33 の計画だけの行の上限（4）のため計画の行にせず、bead が持つ。
  (12) 別の問い。歯と source の行数比に tests/ を数えるかと歯の中の file の行数の上限の寄せ（判断の記録 ADR-25）、目指す所の 5 番を引く要件と FR19 の追跡の広さ（要件を足すか、FR19 が引く目指す所を狭めるかの 1 本の問い）、着地した歯への変異の見本（記憶の装置 SSD の書き）は、この記録では決めず、別の問いで決める。出す時は席が決め、この記録の問いと並べて出さない。着地した行の差の file の行き先は問いにせず、ADR-32 の決定 (9)（歴史として残し書き換えない）のままとし、物差しの差の file の項（patch_files）が量を見る。
  (13) 器を書く便の同時の数（行を選ぶ段・器の床）。器の code（scribe2/）を書く範囲（write-set）に持つ便が同時に走る数を、床で 1 本までにする。数えるのは器の起こしの 1 つの判じ（dispatch の fire・終端の直後の 1 周と手動の 1 周が同じ判じを撃つ）で、待ちの理由を 1 つ足し、2 本目の判定を別に書かない（器の憲法 C2）。値 1 と、数える path の集まり（scribe2/ は tsuzuri に固有なので器の code に字で書かない）は器への宣言（.vessel.toml）の鍵が持ち、行（v-one-vessel）が足す。外す時も行で外す。ADR-33 の決定 (12) の決まりは今、器にも席の道具にも字が無く、席の記憶と hold だけで守られている（条 N-2.1・P-6.1）。決まりの理由（器の追随の再 gate と着地の後の検出線が scribe2/ を見ない）は行（v-roots）の着地で消えるので、その時に値を外す（撤退 (8)）。
options:
  - id: a
    name: 甲 — 段ごとの持ち手を全部置き、質は捨てずに返し、契約審査が質を数える形は測ってから入れる
    text: 決定 (1) から (13)。乙'（契約審査が質を数えるだけで FAIL にしない）は決定 (7) の中の条件つきの段で、同じ過去の便 3 本を今と乙' の雛形で対に撃ち、差の中央が 2 万以下なら席が入れ、越えたら持ち主に問う。
    verdict: adopted
    reason: 機械で決まる穴（done と歯の対応・判定と数の食い違い・器を書く便の同時の数・予算の下限・出す前の床の欠け）を床に置き（条 P-6.1）、群の上限と段の上限は全部の行を落とす歯にせず物差しと畳みの行で持つので、並べる便を落とさない。契約審査の落ちのうち欄を持たなかった 2 件（3 日で約 23 万・D）の型が設計の commit の門で止まる。判定と数の食い違い（3 日に 7 便）は FAIL の道に乗る。質の指摘は場所付きで残り、週 1 本の掃除の行で返る。契約審査で質を数える形は、費えを測る前に持ち主に問わず、測った増えが小さい時だけ席が入れる。次の段の行と週のまとめは台帳の bead が持つので、席の記憶と文脈の圧縮に頼らない。
  - id: b
    name: 乙 — 甲に、契約審査が質の指摘で FAIL にする形を足す
    text: 甲に足して、契約審査の雛形が質の 5 観点を数え、1 以上なら FAIL にする。gate は質を数えない。
    verdict: rejected
    reason: gate の PASS 133 便のうち 53 便（4 割・V）が質の指摘を持つので、その多くが起草へ戻り、1 周 約 17 万（D）と起草の直しが増える。質の指摘の多く（shrink 44）は便を止めるほどでない（I）。数えて返すだけの乙' は甲の中で測ってから入れる。
  - id: c
    name: 丙 — 審査の段だけ厚くする
    text: 決定 (6)(7) と乙の契約審査の質だけを置き、起草と設計の commit の門と物差しは置かない。
    verdict: rejected
    reason: 機械で見られる落ち（10 件のうち 7 件・近似）を高い審査が拾う形が残り（条 P-6.1 に沿わない）、起草係の予算と出す前の床と畳みの引き金とゴールの物差しと器を書く便の同時の数の穴が残る。
  - id: d
    name: 丁 — 今のまま、物差しだけ足す
    text: 決定 (9) だけを置く。
    verdict: rejected
    reason: 穴が数で見えるだけで持ち手が無い。done と歯の対応・判定と数の食い違い・器を書く便の同時の数のような機械で決まる項目を、席の目と記憶と審査役に残す。
  - id: e
    name: 戊 — 甲に、段（S1）の着地まで新しい機能の行の起草を止める事を足す
    text: 甲に足して、段（S1）の行が全部着地するまで、判断の済んだ 2 行のほかの新しい行を起草しない（席の調べのまとめの案）。
    verdict: rejected
    reason: 得は段（S1）の新しい手引きで起草できる事だけで、決定 (5) の名乗りの後は設計の commit の門が欄 done-teeth を求めるので、止めなくても守られる。止めると段（S1）の行の着地までの分（器の行 2 本は直列・1 本 中央 約 30 分・I）、機能の行が流れない。
basis: [ADR-59, ADR-61, ADR-32, ADR-45, ADR-33, ADR-60, ADR-36, ADR-25, FR21, FR19, R-33, P-2, P-6, P-7, P-9, N-2, N-3, N-5, P-28]
grill:
  when: 2026-10-05
  who: "検証役 qv63（攻め）と qv64（照らし直し）（AI・起草者と別の独立の文脈・読み取りだけ）"
  where: "docs/grill/2026-10-05-Q-drafter-system-grill.md"
  summary: "検証役 qv63 が第 1 版を反対側から攻めた（所見 19・致命 1・要直し 13・軽い 5）。致命は、群の行の上限を全部の行の検査に入る歯にすると上限まで詰めた群の歯を書く行が全部落ちる事で、上限を物差しと畳みの行で持ち数え方を畳みの道具と同じにする形に直した。ほかに、欄の要否を断るのは設計の commit の門だけである事・食い違いを FAIL に読む事・数の誤り・撤退の項の名・器を書く便の同時の数の床・計画を台帳の bead にする事などを第 2 版で映した。照らし直しの検証役 qv64 は第 2 版を、所見 19 のうち塞いだ 17・半分 2 と判じ、新しい要直し 5（撤退 (1) の基・畳みの行の比べる撃ちの範囲と形・質を数える形の測りの対照・入れた時の口の向け直し・詰めの線が持ち主の決めた上限の見直しに読める事）と軽い 8 を出し、第 3 版で映した。"
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、数えの memo（t3-hub.80）か後継の memo の notes に記帳する。材料は日次の測り（eval_daily.py）の群 q と群 c の項（下に key で名指す）と、器の出来事の記録と、係の札の file。窓は各行の着地から 7 日で、件数が足りなければ 14 日に延ばす。条が読む項がまだ分からない（U）の間は、その条の窓を始めない。問う相手は持ち主。
    (1) 決定 (5)。判断の記録 ADR-45 の撤退 (2)（名乗りの後 2 週で 1 本目の着地の率が 10 ポイント以上下がれば鍵の形を問う）に、次の線だけを足す。名乗りの後 7 日で、床の断りの項（floor_refused_3d）が数えた設計の commit の門の断りのうち、席が照らして正しい行を断ったと記帳した数が 3 を越えたら、名乗りを外す行（値を偽にする 1 行）を置いて問う。名乗りの前の窓の基は、done と歯の対応の字の型で 149 便に 4 件、そのうち欄を持たなかった物 2 件（V）。欄を持ったまま落ちる型（80.19 の 2 回）は名乗りで止まらない前提で、名乗りの後 14 日で、型ごとの数の項（review_fail_teeth_kinds_3d）が数える欄を持たない型が 0 にならないか、字の型の全部の率が 149 便に 3 件相当を越えたら、門の形を問う。
    (2) 決定 (6)。判定の食い違いの FAIL の項（gate_mismatch_3d）が数えた周のうち、席が照らして指摘が誤りで PASS が正しかったと記帳した数が、7 日で半分を越えたら、読みを外す行を置いて問う。あわせて、gate の 3 観点（contract-fit・teeth-nonvacuous・constitution）を 1 以上と数えた周の率が、読みと雛形の 1 文を入れる前の 7 日の半分を下回ったら、審査役が数を 0 に寄せた疑いとして問う（食い違いの FAIL の数は、効いても隠れても 0 に向かうので、それだけでは見分けられない）。
    (3) 決定 (7)。開いた質の memo の項（quality_memos_open）が、週 1 の掃除の行を 2 本着地させた後も 3 週続けて増えたら、先に掃除の行の頻度を問い、頻度を上げても増えれば乙（契約審査が質で FAIL にする）を問い直す。掃除の行は閉じた memo の数を物差しに記帳する。乙' を入れた日の前後で数えを分ける。乙' の段を入れたなら、入れて 7 日で契約審査 1 回の新しい量の中央の項（review_tokens_median_3d）が入れる前の 7 日の値より 2 万を越えて増えたら、乙' を外す行を置いて問う。
    (4) 決定 (3)。予算の項（drafter_budget_over）が口で読めるようになってから 14 日で、門に断られて頭を直して起こした係の越えの率が、10 万を越える予算の 10-04〜10-05 の率（74%・67/91）を上回れば、下限の値を問い直す。基は 10-04〜10-05 の 100 体の 76% と型ごとの率で記帳し、全部の 250 体の率（87%）と比べない。
    (5) 決定 (4)。係の終える前の門の項（agent_stop_floor_7d）で、門の撃ち直しの rc と床の記録の rc が食い違った係が 7 日に 2 を越えたら、記録の形を問う。正しく働いた係の終わりを床の記録の欠けで止めた例が 1 日 3 回を越え、1 週で減らなければ、その欠けを外す行を置いて問う（ADR-59 の撤退 (2) と同じ線）。
    (6) 決定 (8)。畳みの行が 2 本続けて、差の当て直しのほかの理由で落ちたら、席の道具と決定 (8) を見直す（ADR-32 の撤退 (2) と同じ線）。群の最大の行の項（group_max_lines）が上限 1 万を越えた日が、畳みの行を置いた後も 3 日続くか、段の数の項（fold_stages）が 24 本に届いた日が 7 日に 2 度在れば、畳みの引き金と頻度を問い直す。
    (7) 全体の釣り合い。足した項が読めるようになって 14 日で、着地 1 本あたりの新しい量の中央に起草係の量を足した値の項（landing_tokens_median_3d）が、段（S1）の最初の行の着地の前の 7 日の値の 1.1 倍を越えるか、1 本目の便で着地した率の項（first_run_landed_3d）が 85% を下回ったら、効いた決定を名指して問う（ADR-36 の決定 (2) の釣り合いと同じ向き）。群 c の着地あたりの token の項（tokens_per_landing_3d）は器の便の量の平均で起草係を含まないので、この条の基にしない。
    (8) 決定 (13)。行（v-roots）が着地し、器の追随の再 gate と着地の後の検出線が scribe2/ を見るようになったら、席は値を外す行を置く。それまでに、待ちの内訳の項（群 a の wait_top_h）で器の床の待ちが 1 日 2 時間を越える日が 7 日に 3 日在れば、行（v-join）と行（v-roots）を先へ繰り上げるかを問う。
plain: |
  AI の起草係が約束の行と試しの code を書いてから本線に入るまでの 8 つの段ごとに、気をつける事（費用・テストの増え・code の質・審査の確かさ・ゴール）を誰が持つかを決めた記録です。
  機械で白黒がつく事は機械の門に、意味の良し悪しは AI の手引きと審査に、傾きは毎日の測りに置きます。審査の判定と数が食い違う時は不合格に読み、質の指摘は捨てずに覚え書きにして週に 1 本の掃除で返し、テストの溜まりは数で畳みを促し、器を書く作業は同時に 1 本を機械で守ります。
  約束の審査に質を数えさせる形は、過去の 3 便を今の形と新しい形で撃ち比べて費用の増えを測り、小さければ入れ、大きければ改めて問います。テストの群の上限 1 万行と詰め方は替えず、越えた群は次の畳みで割ります。次の段の作業と週ごとのまとめは台帳に載せ、席の記憶だけに頼りません。
approval:
  who: 持ち主
  date: 2026-10-05
  ruling: t3-hub.87.14（裁定 id = t3-hub.87.14:20261005T1140Z-1・1（甲・推奨のとおり、段ごとの持ち手を全部置き、質は捨てずに返し、契約審査が質を数える形は測ってから入れる）・配達の口・notes に逐語）
  verbatim: "推奨で良い"
  surface: R-8
consequences:
  - 段と論点の持ち手の表（床・天井・物差し）。行を選ぶ段は、ゴールを物差しのゴールの項（goal_direct_1d と goal5_reqs）が持ち（目指す所の 5 番の要件と FR19 の追跡は別の問い）、並列を手引きの (2) の (a) と ADR-60 の床が、器を書く便の同時の数を決定 (13) の床が持つ。頼む段は、予算を係の門の決定 (3) と予算の項（drafter_budget_over）が、手引きの正本を決定 (2) が持つ。起草の段は、置き場・写し・名を手引きの (2) の (a)(b) と決定 (8) の (c)(d) が、source の字の歯を (2) の (d) が、歯の本数を (2) の (c) が持つ。出す前の段は、床の記録と安い 4 本の撃ち直しを係の門の決定 (4) が持つ。設計の commit と受付の段は、done と歯の対応を器への宣言と席の門の決定 (5) が、欄の形を受付と preflight が持つ。契約審査の段は、適合と歯の空振りを今の雛形が持ち、機械で見られる型は決定 (5) へ移り、質を数える形は決定 (7) の条件つきの段が持つ。gate の段は、判定の揃いを器の決定 (6) が、質を器の口と席の決定 (7) と質の項（gate_pass_quality_3d と quality_memos_open）が持つ。着地の後の段は、歯の費用と記憶の装置の書きを決定 (8) と歯の項（fold_stages と group_max_lines）と席の道具が、質の返しを週 1 の掃除の行が、曲げた形を形の畳みが、記憶を決定 (10) が、着地の確かさを着地の項（first_run_landed_3d）が持つ。
  - 段（S1）。今置く（行（ag-plugin）は 2026-10-05 に着地済み・行（t-fold-3）は大きさ S で、1 万行を越えていた 2 群から 1 module ずつを移し、10-05 に着地済み（55f0c39f））。行（ag-ref）は tsuzuri・参照の file（reference.md）に決定 (2) の 3 項と (a)〜(d)・歯は段の file・大きさ S・depends なし。行（t-teeth-on）は tsuzuri・.vessel.toml の teeth-check・歯 1 本・S・depends なし。行（t-kfold-cap）は tsuzuri・決定 (8) の (a) の 2 つの値を束ねの表の file（kfold.rs）の定数に置き、値と群の行・段の本数を比べる撃ちを xtask の下の命令（kfold-cap・歯にしない・畳みの行の verify だけが名指し、書く群と作る群だけを落とす）で足し、席の道具と物差しがその定数を読めるようにする・S〜M・depends なし（同じ kfold.rs を書く t-fold-3 は着地済み）。行（v-one-vessel）は器・決定 (13)・M・depends なし。行（v-gate-findings）は器・決定 (6) と (7)（判定の読み・雛形の 1 文と場所の列・PASS の memo の案）・M・depends は v-one-vessel。物差しの項の足しと 2 つの口のうち席の道具の側（eval_daily.py と commit-design.sh）は行にせず、席が直す。
  - 段（S2）。適用の時に台帳の bead にし、行（ag-ref）の着地の後に置く。行（ag-floor-rec）は tsuzuri・決定 (4)・中核の終える前の門の file（stop.rs）と境界の hook と参照の file の床の節・M・depends は ag-ref（同じ参照の file を書くため）。行（ag-budget-floor）は tsuzuri・決定 (3) と決定 (9) の予算の口（usage.json）・中核の起こしの門の file（spec.rs）と終える前の門・S〜M・depends なし。要件 FR21 の shall に予算の下限と床の記録の 2 つの句を足し、FR21 の判断の記録の欄に ADR-63 を足すのは、この 2 行を置く席の設計の commit で行う（この記録の適用は要件を書かない）。
  - 段（S3）。適用の時に台帳の bead にし、段（S2）の着地の後に置く。今の候補は次のとおり。行（t-shape-ag）は形の畳みで、ag 系の置き場と名、deny の写し、OUT の 2 つ、path の下の判じ、境界の hook の引数の読み 5 本・M〜L。行（t-anchor-chain）は folio の検査の file（anchor.rs）の 8 段の数珠を、親の関数が段を並べて呼ぶ形へ・M。行（t-doc-ids-a）と行（t-doc-ids-b）は根の src の module の頭の doc の行の id 524 行を外し、a は lint の歯を足す・審査に渡す差の上限 150,000 byte で 2 本・M ずつ。行（t-helper-fold）は決定 (8) の (c) を畳みの手に入れた後、既に群に在る helper の写しを寄せる・L。verify の絞りを名の部分一致から module の path の頭へ替える形は、器の行の要否と ADR-32 の決定 (7) との関わりを起草で照らし、決定 (7) を替えるなら判断の記録で行う。
  - 台帳の bead。適用の時に席が起こすのは、段（S2）の 2 行・段（S3）の 5 行・週 1 の束ね（質の memo のまとめと掃除の行・defer の日付つき・閉じる時に次の週を起こす）・記憶の対応表（係 1 体）・乙' の測り（同じ過去の便 3 本を 2 つの雛形で・約 70 万）。依存は S2 が段（S1）の bead へ、S3 が S2 の bead へ。期日を過ぎた bead は物差しの項（overdue_holders）が頁に出す。
  - 器の行の数珠。器を書く便は同時に 1 本（決定 (13)）で、この記録の器の行は段（S1）の 2 本（v-one-vessel を先に、v-gate-findings をそれに依って）と、乙' を入れる時の 1 本。数珠はこの記録の分で 2〜3 本（1 本 中央 約 30 分・I）。床の行が着地するまでは、決まりは今どおり席の hold が守る。tsuzuri の行は器の列を使わず、交わらない行（ag-ref・t-teeth-on）は並べて流す。
  - 置き場の上限（条 P-28）。生きた設計ノートは 6 本で上限に在るので新しいノートを起こさず、段（S1）の 5 行と段（S2）の 2 行はノート（surface-wave29c）に置く（今 4 行・残り 28・置いた後 21）。
  - 決定 (2) の費え。参照の file（reference.md）が 約 12 行増え、起草係 1 体が読む量が 約 1〜2 千 token 増える（I）。得は正本が 1 つになる事で、頼みの文の写し方のばらつき（10-05 の頼み 13 本で、回り込みの禁止を持つ物 2）が無くなる（V の数・効きは I）。module の頭の doc に行の id を書かないので、code から行を字で逆に引けなくなり、契約と、行ごとの由来を引く道具（git blame）で代える。
  - 決定 (3) の費え。予算 15 万未満の起こし（10-04 からの 100 体のうち 9 体・D）が全部断られ、席は頭を直して起こし直す。実の量は替わらない（その 9 体は全部越えた・D）。群の係（ADR-61）は係ごとの上限 15 万と下限 15 万が今同じ値なので、頭の予算はちょうど 15 万だけが通る。行（ag-ref）で参照の file の 10 節の群の頭の予算の字（150000 以下）を「ちょうど 150000」に直す。
  - 決定 (4) の費え。床の記録は係が既に撃つ命令の rc を写すだけで、cargo を足さない。preflight を名指さない係（notes 127 本のうち 61・V）は、1 行あたり preflight と tz の照らしの数十秒〜数分（I）と、1 体 約 5 千〜1 万 token（I）が増える。門の撃ち直しは終える時に数秒〜数十秒（I）。
  - 決定 (5) の費え。名乗りの後の行は欄 done-teeth を書く（1 行に要素 3〜10・I）。得は、契約審査の落ちのうち欄を持たなかった 2 件（74.62 と 77.10 の 2 周目・V）の型が設計の commit の門で止まる見込みで、3 日で契約審査 2 回分（便 1 本あたり 約 11.6 万・D）の約 23 万と撃ち直しの往復が浮く。欄を持ったまま落ちた 2 回（80.19・V）は止まらない。審査役が欄の検証行の番号の歯で表を誤る型は行（v-atk-names）で閉じた（D）。
  - 決定 (6) の費え。窓の PASS 133 便のうち 7 便（5%・V）が FAIL になり、1 便ごとに起草の直しと契約審査と gate の 1 周（約 17 万・D）と起草の量が増え、着地が遅れる。決定 (7) と同じ行で gate の雛形の指紋（lens の版の行）が 1 度替わるので、ADR-36 の測りの窓は器の入れ替えの前後として読む。
  - 決定 (7) の費え。PASS の memo の案は 3 日で 18 件以下（delete を 1 以上と数えた便・V）で、席の起票と読みの手間（1 件 約 2〜3 千 token・I）。stdlib・native・yagni・shrink は週 1 本。掃除の行は週 1 本（契約審査と gate の 1 周 約 17 万と起草・D・I）。乙' の測りは 1 度 約 70 万（同じ便 3 本を 2 つの雛形で・D・I）、入れれば契約審査 1 回に 2 万以下の増え（測ってから）と、memo の口と質の項の向け直し。
  - 決定 (8) の費え。畳みの行が段 12 本ごとに置かれ（1 回 約 15 分・前の畳みは 14 分・V）、その間は交わる行が流れない。段の file の上限 24 本で、段の歯の実行 file の重さが 約 1.2 GB で止まる（1 本 約 50 MB・I・これまでの最大 41 本で 約 2 GB）。helper の寄せで、字で同じ写し 8,264 行（V）が畳みごとに減る（減りの速さは I）。
  - 決定 (9) の費え。日次の測りの 1 回が今より伸びる（測っていない・U）。token は使わない。口の 1 つ（usage.json）は係の終える前の門の書きが 1 つ増える。
  - 決定 (10) の費え。係 1 体（新しい量 約 20〜30 万・I）と、表を保つ席の手間。
  - 決定 (13) の費え。器の行 1 本（S1）。器を書く便が 2 本目を待つ時間は、今の席の hold と同じ（I）。器の起こしの判じに数えが 1 つ増える。
  - 持ち主の手間は、この記録の承認 1 回。決定 (12) の別の問い 3 つは、出す時を席が決める。
  - 器の要件の句（決定 (6) の gate の判定の読み・決定 (7) の memo の口・決定 (13) の起こしの床）は、器の行の起草で既にある器の要件を照らし、足りなければその行の節で足す（U）。
note: 起草は係 w229a で、検証役 qv63 の攻めの後に係 w231a が直した（どちらも 2026-10-05）。材料は席の調べ（audit-20261005 の synthesis.md と au1〜au4）で、係が器と tsuzuri の現物を読んで撃って直した所と照らした命令は係の notes に在る。着地した行の差の file（docs/design/patch・196 本・約 6.2 MB）は問いにせず、ADR-32 の決定 (9) のまま残し、物差しの差の file の項が量を見る。承認の欄の逐語と経路と日付は、適用の script が台帳の問いの notes の定型行と裁定 id の時刻から読んで入れた。grill の欄は、検証役の攻めの後に席が適用の script の定数で埋めた。
