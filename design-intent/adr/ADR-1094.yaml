# 判断の記録 ADR-1094 — 器 scribe2 の判断の記録 ADR-0094 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1094
title: "land の終端が着地の形の close を書く経路は 3 つ — push の後の CI の照合と close、 vessel 宣言が任意 key remote を持たない repo の CI の照合なしの close、 PR で着地した便の merge の後に pipe retire が merge の祖先と先端の CI を照合してからの close (ADR-1089 の land の終端の範囲を部分 supersede)"
status: accepted
date: 2026-09-29
context: |
  着地の形 (契約を着地で閉じる理由の字) は land の終端だけが書き、 席が撃つ着地の形の close は起票の門が断る。 ところが land の終端が close を撃つのは remote へ push して CI を照合した便だけで、 押す先を宣言しない repo の便と、 PR を作って終わる便は、 着地しても契約を閉じる手段が無い。 本 ADR は land の終端が着地の形を書く経路を 3 つに広げ、 どの経路も器が測った事実の後にだけ書くと決める。
  なぜこの判断が要るのかを 7 つから説明します。 経緯 (land の終端は push の後に CI を確かめて閉じ、 ADR-1089 が着地の印を land の終端だけに閉じた)・押す先を宣言しない repo の便が閉じられないこと・PR を作って終わる便も閉じる口を持たないこと・持ち主の裁定と要件書の版 0.30・憲法の向き・この判断の範囲・forge (GitHub などの置き場) へ問える数に上限があることです。
  CTX1 経緯 — land の終端（取り込みの最後の手順）は push の後の CI の照合で閉じ、 ADR-1089 が着地の形（着地で閉じた印）を land の終端だけに閉じた
  ADR-1045 §2 は便の起動・着地・merge を器の dispatcher に置いた。 FR1050 の land の終端は、 着地した main を vessel 宣言（repo の名乗りの設定）の任意 key remote (押す先) へ push する前に出ていく字面を走査し (ADR-1078)、 push の後に push の先端の CI の結果を commit id で照合し、 success の周だけ台帳の便を close する。 理由の字は「landed <着地 commit id> ci=success」で、 並べて着地した便のうち先端でない便は、 先端でない commit には forge の CI の run が付かないので自分を祖先に持つ先端の CI で照合し、 末尾に tip=<先端の commit id> を持つ。 したがって押す経路の ci=success は、 どの便でも「その便を含む着地の後の main の先端の CI が success」を指し、 tip= は「着地した commit が先端でない」を指す。 ADR-1089 は bead の close の理由を種類ごとの閉じた形の和 (close の理由の文法) に閉じ、 契約の 1 つ目の形を着地の形 (landed <着地 commit id> …) とし、 起票の門（台帳の書き込みを止める門）が席の道具の呼び出しの着地の形の close を断る (FR1081 (d)) と決めた。 ADR-1089 はこの land の終端を dispatcher の着地の終端 (push → CI の照合 → close) と読み、 代償に、 器の便の外で着地した契約の閉じは着地の形を持たないことを挙げた。
  CTX2 事象 — remote を宣言しない repo の便は、 着地しても契約を閉じられない
  vessel 宣言が任意 key remote を持たない repo では、 今の land の終端は push を撃たず (憲法 A1 の「出す」を既定で撃たない)、 event も記帳せず、 close もせずに終わる。 便は Landed で main に着地しているが、 契約は開いたまま残る。 席は着地の形で閉じられず (FR1081 (d))、 取り下げの形で閉じると台帳から着地の事実が消える。 memo の自動の close の条件 (辿れる契約の全部が着地の形で閉じる・FR1093) も満たされず、 その契約へ分けた memo は器が閉じない。 vessel 宣言を読めない周の今の land の終端は、 push を撃たずに失敗 (unreadable) を記帳して終わり、 着地をやり直さずに終端だけを撃ち直す口 (pipe land --terminal-only) で継げる (この口は器が自動では撃たず、 便を起こす権能 launch の手が撃つ)。
  CTX3 事象 — PR で着地した便（PR を出して終えた便）も、 契約を閉じる口を持たない
  --pr-cmd の形の便は、 squash の代わりに便の branch を push して自 repo への PR を作り (main を動かさない・承認 event を前提にしない・ADR-1008)、 Landed を detail=pr で記帳して終わり、 land の終端は撃たれない。 --pr-cmd は任意の shell 行で、 器は PR をどの remote へ出したかを知らない。 merge は PR の上で押され、 その後に pipe retire（作業場を畳む器の口） が worktree を可逆 move で畳む (N1.2)。 --pr-cmd の形の便を起こすのも pipe retire を撃つのも便を起こす権能 (launch) の手で、 この権能は席の rules 行に無い (ADR-1048・今は user)。 dispatcher の周は --pr-cmd を使わない。 今の pipe retire は forge に問わず (merge 済みかは撃つ側が確かめる)、 段を動かさず、 台帳に書かず、 worktree が在って clean なら merge の有無に依らず畳む。 畳んだ worktree は元の場所に無いので、 2 度目の pipe retire は worktree が無いとして断られる。 この便の契約も着地の形で閉じる経路を持たない。 merge の方法 (squash など) によっては便の branch の commit が main の祖先にならず、 main に入ったことを確かめられるのは forge が返す merge の commit である。 CTX2 の便もこの便も器の便で、 ADR-1089 の代償が名指す器の便の外の着地ではない。
  CTX4 裁定と要件 — SRS 版 0.30 が 2 つの経路を land の終端に入れた
  持ち主の裁定 2026-09-29T05:46Z の下で、 SRS 版 0.30 は FR1050 に remote を持たない repo の close を、 FR1096 に PR で着地した便の close を入れた。 FR1050 は main に着地した便に掛かり (PR で着地した便を除き、 その close は FR1096)、 land の終端が台帳へ書くのを、 push の後の close・remote を持たない repo の close・PR で着地した便の close・memo の自動の close (FR1093) だけとし、 3 つの close の経路と理由の尾（閉じる理由の後ろの字）の字面を本 ADR に置く。 FR1096 は pipe retire の照合と close、 通らない周の閉じた 6 語、 畳むだけの指定（閉じずに畳む指定） (--fold-only) を持つ。 FR1081 (d) は着地の形を書くのを land の終端 (FR1050・FR1096) だけとし、 FR1091 は close の理由の文法の形の名を持ち (頭の字面は ADR-1089、 尾は本 ADR)、 FR1093 と FR1090 は land の終端 (FR1050・FR1096) の close を契機に持つ。 AC1065 が 2 つの新しい経路を測る。 SRS と本 ADR の残る分岐は、 常設の裁定 2026-09-29T00:54Z と 04:37Z (分岐は推奨で進める) の下で orchestrator が推奨のまま決めた。
  CTX5 憲法の向き (本 ADR の解釈)
  C10 (宣言した値は測って初めて実効にする) と C10.2 (手書きの確かめ済みの印を受けない) から、 着地の形は器が測った事実の後にだけ書き、 席の宣言からは書かない。 C16 (仕様の外れを編集の時点で止める) の止めは起票の門 (FR1081 (d)) のまま残す。 A1 (出す) から、 remote を持たない repo へは走査も push も撃たない。 C11.2 (失敗の極性) から、 測れない周は close しない側に倒す。 N1.2 から、 畳みは今のまま可逆 move とする。
  CTX6 射程 — 動かすのは land の終端の経路の数と、 2 つの新しい経路の形と、 pipe retire の指定だけ
  動かすのは (1) land の終端が着地の形の close を書く経路の数 (1 から 3 へ)、 (2) 2 つの新しい経路の close の理由の尾の字 (ci=none と、 PR の経路の tip=)、 (3) pipe retire の、 PR で着地した便への照合と close と、 通らない周の閉じた 6 語と、 照合も close もせずに畳むだけの指定 (--fold-only・本 ADR の前の pipe retire の振る舞いを明示の指定で残す) と、 契約が着地の形で閉じ済みの便への撃ちを畳むだけにすること、 (4) memo の自動の close と局面の出力の書き直しの契機が 3 つの経路のどの close にも掛かること。 動かさないのは、 close の理由の文法の頭の 9 形と種類との組、 memo の 4 つの局面と自動の close の条件、 起票の門の断りの範囲、 remote を持つ repo の push の前の走査と push の後の CI の照合、 pipe retire の他の対象 (squash の形で着地した便・Failed・Stopped・審査が PASS でなく終わった便) の扱い (畳むだけ・段を動かさない)、 pipe retire を撃つ手 (launch の権能・ADR-1048)、 --pr-cmd の口 (remote を宣言しない repo の PR の便も起動の段では断らない)、 器の便の外の着地 (FR1092) の閉じ。 決めないのは PR の merge の commit を forge に問う字面で、 設計 doc に委ねる (今の code は CI の結果を問う行 ci-cmd だけを持ち、 PR の状態を問う行を持たない。 vessel 宣言に新しい key を足すなら on-disk 形式の変更として別の ADR を要する)。 ADR を書く条件のうち 3 (理由の尾の字・retire の理由の語・畳むだけの指定は版を跨ぐ形) と 4 (却下案を残す価値のある分岐) に当たる。
  CTX7 制約 — forge への問いには上限があり、 CI の照合の問いで使い切った実例がある
  器が forge へ撃つ問い (CI の結果・PR の状態) は、 forge が利用者ごとに課す時間あたりの上限を、 同じ利用者の他の道具の問いと共有する。 過去に、 着地の CI の照合を短すぎる間隔で繰り返す便が並んだ周に上限を使い切り、 同じ利用者の他の道具の問いまで 1 時間ほど断られた実例がある。 問いの数が撃たれた手の数でなく時間 (周の数) に比例する形は、 上限を静かに食う。
  （選択肢を測るものさし）この判断を評価する 6 本のものさしです。 着地の印は器が測った着地にだけ付けること。 main に着地した契約は押す先の有無に依らず、 PR で着地した契約は宣言した押す先へ PR を出した便で閉じられること。 閉じる理由の頭の形と読み手の数を増やさないこと。 押す先の無い repo へは何も出さず、 測れないときは閉じずに撃ち直せること。 印の意味 (着地の後の main の先端が CI で緑) を経路で割らないこと。 forge への問いを時間に比例して増やさないことです。
  DR1｜着地の形は測った着地にだけ付く — 器が測った事実の後にだけ書き、 席の宣言からは書かない (C10・FR1081 (d)) CTX1・CTX5
  DR2｜着地した契約は閉じられる — main に着地した器の便は remote の有無に依らず、 PR で着地した器の便は宣言した remote (vessel 宣言の key remote) へ PR を出した便で、 契約に着地の形で閉じる経路がある CTX2・CTX3・CTX4
  DR3｜形を増やさない — close の理由の文法の頭の形と、 局面の出力の読み手の閉じた集合を広げない CTX1・CTX6
  DR4｜出さない既定と閉じない極性 — remote を持たない repo へは何も出さず、 測れない周は閉じずに同じ口で撃ち直せる (A1・C11.2) CTX2・CTX5
  DR5｜印の意味を経路で割らない — 着地の形の ci=success はどの経路でも「その便を含む着地の後の main の先端の CI が success」を指し、 tip= はどの経路でも「着地した commit が先端でない」を指す CTX1
  DR6｜forge の問いを時間に比例させない — forge への問いは撃たれた手の分に限り、 周の数に比例して上限を食わない CTX7
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 main に着地した便は、 押す先を持つ repo なら今の手順のまま、 押す先を持たない repo なら「CI の確かめなし」と書いて閉じます。 PR を作った便はこの 2 つの手順の外で、 pipe retire が merge と先端の CI を確かめてから閉じて作業場を畳みます。 PR を作った便で確かめが通らないときは何も書かず、 決まった 6 つの理由の語の 1 つを出して終わります。 支えるのは FR1050 (land の終端)・FR1096 (PR で着地した便の閉じ)・FR1081 の (d) (席の着地の印を止める門)・FR1093 (memo を器が閉じること) への主張と、 FR1091 (閉じる理由の決まった形) を根拠にすることです。
  採用 — OPT1
  land の終端 SHALL 着地の形 (close の理由の文法の契約の 1 つ目の形・頭の字面は ADR-1089、 頭の後ろの理由の尾の字面は本 ADR) の close を次の 3 つの経路でだけ書く。 (1) と (2) は main に着地した便だけに掛け、 PR で着地した便 (Landed の記録が detail=pr の便) には走査も push も CI の照合も close も撃たない (その便の close は (3) だけ)。 (1) vessel 宣言が任意 key remote を持つ repo の便は今のまま、 push の前の走査・push・push の先端の CI の照合を撃ち、 success の周だけ「landed <着地 commit id> ci=success」(着地 commit が先端でない便は末尾に tip=<先端の commit id>) で close する。 (2) vessel 宣言が任意 key remote を持たない repo の便は、 走査も push も CI の照合も撃たず、 着地した周に「landed <着地 commit id> ci=none」で close し (並べて着地した便もそれぞれ自分の着地 commit id で・tip= を付けない)、 走らなかった段の event を積まない。 vessel 宣言を読めない周 SHALL remote を持たない repo と読まず、 close せずに失敗を記帳する。 撃ち直しは器が自動では撃たず、 launch の権能の手がその便の終端だけを撃ち直す口 (pipe land --terminal-only) で撃ち、 撃った時点の宣言で経路を選び直す。 (3) PR で着地した便は、 merge の後に撃たれた pipe retire が、 worktree が在って clean であることを git と forge に問う前に確かめ、 PR の merge の commit を forge に、 それが remote (vessel 宣言の key remote が名指す remote) の main の先端の祖先であることを git に、 先端の commit の CI の結果を vessel 宣言の CI の行で問い、 全部が通った周だけ「landed <merge の commit id> ci=success」(merge の commit が先端でない周は末尾に tip=<先端の commit id>) で close し、 その後に worktree を可逆 move で畳む。 通らない周 SHALL close も畳みも event も台帳の書きもせず、 閉じた 6 語 worktree-unready・not-merged・not-ancestor・ci-not-success (結果がまだ無い周を含む)・unmeasured (git か forge の問いを撃てない周と、 vessel 宣言が key remote を持たないか読めない周)・unwritten (照合が通って close が台帳に届かない周) の 1 つを 1 行出して rc 1 で終わり、 同じ口で撃ち直せる。 契約が着地の形で閉じ済みの便への pipe retire SHALL 照合も close も撃たずに畳むだけとする。 worktree が無いか clean でないか move が落ちて畳めない周 SHALL worktree-unready とし、 close の後に move が落ちた周も含む (close は残り、 撃ち直しは畳むだけ)。 pipe retire に畳むだけの指定 (--fold-only) を付けた周 SHALL 照合も close もせずに worktree を可逆 move で畳み、 契約を開いたまま残す。 3 つの経路のどれで契約を close した周も (pipe retire の close を含む) memo の自動の close (FR1093) と局面の出力の書き直し (FR1090) の契機とする。 pipe retire の他の対象 SHALL 今のまま畳むだけで forge に問わず台帳に書かない。 起票の門 SHALL 席の道具の呼び出しの着地の形の close を今のまま断る。 close の理由の文法の頭の形と種類との組・memo の局面と自動の close の条件・push の前の走査の判定・pipe retire が段を動かさないこと SHALL NOT 変えない。
  （平易）着地の印で契約を閉じるのは land の終端だけで、 その経路は 3 つです。 1 つ目と 2 つ目は main に着地した便だけに掛かり、 PR を作った便には撃ちません。 1 つ目、 押す先 (remote) を持つ repo の便は今のまま、 公開前の走査・push・CI の確かめを撃ち、 成功したときだけ閉じます。 2 つ目、 押す先を持たない repo の便は、 走査も push も CI の確かめも撃たず、 着地したときに着地の commit と「CI の確かめなし」を書いて閉じます。 repo の名乗りの設定を読めないときは、 押す先が無いとは読まず、 閉じずに失敗を記録します。 撃ち直しは器が自動では撃たず、 便を起こす権能を持つ人が終端だけを撃ち直す口を撃ち、 撃った時点の設定で経路を選び直します。 3 つ目、 PR を作った便は、 merge の後に撃たれた pipe retire が、 作業場が在って汚れていないことを先に確かめ、 PR の merge の commit、 それが押す先の main の先端の祖先であること、 先端の CI の結果を問い、 全部通ったときだけ merge の commit を書いて閉じ (merge の commit が先端でないときは先端の commit も書き)、 それから作業場を畳みます。 通らないときは何も書かず、 作業場も畳まず、 決まった 6 つの理由の語 (worktree-unready・not-merged・not-ancestor・ci-not-success・unmeasured・unwritten) の 1 つを出して終わり、 同じ口で撃ち直せます。 契約が着地の印で閉じ済みの便に撃ったときは、 確かめも閉じもせずに作業場を畳むだけです。 作業場が無い・汚れている・動かすのに失敗して畳めないときは (閉じた後に動かすのに失敗したときも。 閉じた印は残ります) worktree-unready です。 畳むだけの指定 (--fold-only) を付けると、 確かめも閉じもせずに作業場だけを畳み、 契約は開いたまま残ります。 どの経路で閉じたときも、 memo を器が閉じる判定を回します。 pipe retire のそれ以外の対象は今のまま畳むだけです。 席が手で着地の印を付けて閉じるのは、 今のまま門が止めます。 閉じる理由の頭の形・memo の局面と閉じる条件・公開前の走査は変えません。
  （理由）着地の印は「本当に着地した」ことの印なので、 器が測った事実からだけ書くべきで、 席の申告から書くと手書きの確かめ済みの印になります。 そのため席が手で閉じる案は採らず、 門はそのままにして、 器の口の側に経路を足しました。 押す先を持たない repo では、 外へ何も出さないのが既定なので push しません。 push しないので CI の結果も無く、 着地の根拠は取り込みのときの main での検査の再実行だけです。 それでも着地は事実なので着地の印で閉じ、 CI で確かめていないことを「ci=none」として字に残します。 PR を作った便では、 merge の方法によっては便の branch の commit が main の祖先にならないので、 forge が返す merge の commit を main の先端の祖先として確かめます。 CI を merge の commit 自身でなく先端で確かめるのは、 押す経路の「CI 成功」の印が「その便を含む着地の後の main の先端が緑」を意味するからで、 PR の経路でも同じ意味にそろえるためです。 その代わり、 他の人の commit で先端が赤いと閉じないことを引き受けます。 確かめる押す先を git の既定から推さないのは、 測る先が repo の名乗った値でなく手元の clone ごとの git の設定になり、 同じ repo でも手元ごとに測る先が変わるからです。 PR をどこへ出したかを器が知らないのはどちらの案も同じで、 宣言と別の押す先へ PR を出した便は、 選んだ案でも祖先の確かめで閉じず、 畳むだけの指定で片付けます。 閉じてから畳むのは、 畳んだ作業場は元の場所に無く、 同じ口を撃ち直せなくなるからです。 確かめずに閉じる案は、 merge されていない PR を閉じうるので採りませんでした。 回ごとに見張る案には、 pipe retire を撃つのを待たずに閉じられる利点があります。 それでも、 PR が開いている間は回の数だけ forge への問いが続いて時間に比例して増え、 着地の CI の確かめを短い間隔で繰り返した便が並んだときに上限を使い切った実例もあるので、 採りませんでした。 別の理由の形を足さないのは、 どちらも着地した事実で、 memo を閉じる条件と読み手の集合を広げずに済むからです。
