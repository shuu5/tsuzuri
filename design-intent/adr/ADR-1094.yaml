  器の案の章の要約: 候補を 8 つ並べます。 着地の印を書く経路を 3 つにし、 どれも器の確かめの後に閉じる案 (選んだ案) と、 選ばなかった 7 つです。 選ばなかった案は、 席が手で閉じるのを許す案・別の理由の形を足す案・確かめずに閉じる案・便を起こす仕組みの回が PR の merge を見張る案・何もしない案・PR の merge の commit 自身の CI で確かめる案・押す先を宣言しない repo では git の既定の押す先に問う案です。
  器の専門語の説明: 本文に出てくる専門語 8 個を、 やさしい言葉で説明します。
  ・land の終端（land terminal）: 便が main に着地して Landed に達した後に器が撃つ手順 (FR1050) と、 PR で着地した便の merge の後に撃たれる pipe retire の照合と close (FR1096) の総称。 本 ADR で、 着地の形の close を書く経路は 3 つになる。 push の後の CI の照合と close・remote を持たない repo の CI の照合なしの close・PR で着地した便の pipe retire の照合と close。
  ・着地の形（landed form）: 契約の close の理由の 1 つ目の形 (頭は landed と着地 commit id・ADR-1089。 その後ろは理由の尾で本 ADR)。 land の終端だけが書き、 席の道具の呼び出しが書く close は起票の門が断る (FR1081 (d))。
  ・理由の尾（reason tail）: 着地の形の close の理由のうち、 頭 (landed <着地 commit id>) の後ろに続く字。 CI の結果 (ci=success) か CI の照合なし (ci=none) と、 着地した commit が先端でない周の tip=<先端の commit id> を持つ。 字面の正本は本 ADR (頭は ADR-1089)。
  ・PR で着地した便（PR-landed run）: --pr-cmd の形で Landed に達し (記録は detail=pr)、 main を動かさず自 repo への PR を作った便 (FR1096)。 land の終端の push の経路と remote なしの経路は撃たれず、 merge の後に pipe retire が照合して閉じ、 worktree を畳む。
  ・pipe retire（pipe retire）: 終わった便の worktree を可逆 move で畳む器の口 (N1.2)。 便を起こす権能 (launch) の口で、 席の rules 行には無い (ADR-1048)。 段を動かさない。 本 ADR で、 PR で着地した便に限って merge と先端の CI を照合し、 通った周に契約を閉じてから畳む (契約が閉じ済みの便は照合せずに畳むだけ)。
  ・畳むだけの指定（fold-only switch）: pipe retire に付ける指定 --fold-only。 照合も close もせずに worktree を可逆 move で畳み、 契約は開いたまま残す (FR1096)。 merge されずに閉じた PR の便と、 remote を宣言しない repo の PR の便と、 宣言と別の remote へ PR を出した便の出口。 畳んだ後は同じ口で着地の形の close に届かない。
  ・起票の門（ledger write gate）: 器の plugin を積む席の hook の入口が bd / bdw の command に掛ける門。 close の理由の文法の外の close と、 席が撃つ着地の形の close を、 台帳を読まずに断る (FR1081 (d))。
  ・vessel 宣言（vessel declaration）: repo が器に名乗る tracked な設定 file (ADR-1010)。 任意 key remote (押す先) と CI の行 (ci-cmd) を持てる。 remote を持たない repo の、 main に着地した便は push も CI の照合もせずに閉じ (宣言を読めない周は閉じない・FR1050)、 key remote は PR で着地した便の照合先でもある (FR1096)。
