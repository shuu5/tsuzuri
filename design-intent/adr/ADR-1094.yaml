      （平易）2 つの便の契約だけは、 merge や着地を確かめた席が手で着地の印を付けて閉じてよいとする案です。 器に新しい口が要らず、 席がすぐ閉じられる点で勝ります。 けれども、 門は字しか見ないので、 2 つの便の閉じだけを通すことができず、 席の着地の印を全部通すことになります。 印が器の確かめでなく席の申告から書かれ、 確かめは散文の手順に戻ります。 退けました。
      利点: 器に新しい口が要らず、 席は PR の merge を見てすぐ閉じられる
      欠点: 門 (FR1081 (d)) は字面しか見ないので、 2 つの便の close だけを通す形を字で分けられず、 席の着地の形の close を全部通すことになる (DR1)
      欠点: 着地の形が器の測りでなく席の宣言から書かれ、 手書きの確かめ済みの印になる (C10.2・DR1)
      欠点: merge と CI の確かめが散文の手順に戻る
    verdict: rejected
    reason: "決め手は分析 (門に穴が開く)。"
  - id: "OPT3"
    name: "2 つの便に別の close の理由の形を足す"
    text: |
      例えば remote を持たない repo の便と PR で着地した便に、 着地の形と別の頭の形を足す。 決め手は分析 (形と読み手の集合が増える)。
      （平易）2 つの便に、 着地の印とは別の頭の理由の形を足す案です。 どの経路で閉じたかが理由の頭で分かる点で勝ります。 けれども、 どちらの便も着地したのは事実で、 形を分けると memo を器が閉じる条件 (全部が着地の印) と、 状態を読む側の決まった集合を広げ直すことになります。 版を跨ぐ 9 つの頭の形も動き、 頭で照合する読み手 (門と memo を閉じる条件) と、 設計の文書と別の repo の読み手が書き換えを要します。 選んだ案のように尾を足すだけなら、 頭で照合する読み手は変わりません。 退けました。
      利点: どの経路で閉じたかが理由の頭で分かる
      欠点: どちらの便も着地したのは事実で、 形を分けると memo の自動の close の条件 (全部が着地の形) と局面の出力の読み手の閉じた集合を広げ直すことになる (DR3)
      欠点: 版を跨ぐ頭の 9 形が動き、 頭で照合する読み手 (起票の門の FR1081 (d)・memo の自動の close の条件の FR1093) と設計 doc と消費側の読み手が書き換えを要する。 尾を足すだけなら頭で照合する読み手は変わらない (DR3)
    verdict: rejected
    reason: "決め手は分析 (形と読み手の集合が増える)。"
  - id: "OPT4"
    name: "pipe retire が照合なしで閉じる"
    text: |
      PR で着地した便の worktree を畳むときに、 forge にも git にも問わずに着地の形で閉じる。 決め手は分析 (確かめずに着地と書く)。
      （平易）PR を作った便の作業場を畳むときに、 何も確かめずに着地の印で閉じる案です。 forge に問わず network に依らず、 今の口に閉じる 1 手を足すだけで済む点で勝ります。 けれども、 merge されていない PR や閉じられた PR、 main の先端が赤い便まで着地として閉じえます。 merge 済みかの確かめも「撃つ側が確かめる」散文に残ります。 退けました。
      利点: forge に問わず network に依らない
      利点: 今の pipe retire に close を 1 つ足すだけで済む
      欠点: merge されていない PR・閉じられた PR・main の先端が赤い便を着地として閉じうる (DR1)
      欠点: merge 済みかの確かめが「撃つ側が確かめる」散文に残る (DR1)
    verdict: rejected
    reason: "決め手は分析 (確かめずに着地と書く)。"
  - id: "OPT5"
    name: "dispatch の周が PR の merge を見張って閉じる"
    text: |
      dispatch の周ごとに、 開いた PR で着地した便の PR を forge に問い、 merge された周に閉じる。 決め手は分析 (問いが周の数に比例し、 畳みの手番が残るか撃つ手なしに入れ物を動かす)。
      （平易）便を起こす仕組みの回ごとに、 PR を作った便の PR を forge に問い、 merge された回に閉じる案です。 pipe retire を撃つのを待たずに閉じられる点で勝ります。 けれども、 回ごとに PR を作った便の数だけ forge へ問いを撃つので、 問いの数が時間に比例して forge が許す上限を食います。 回が作業場まで畳むと、 merge の後もその作業場を人が使っているときに、 誰も撃たないまま動かします。 畳まないなら、 閉じた後も作業場が残り、 畳む手番は結局残ります。 退けました。
      利点: pipe retire を撃つ手番を待たずに閉じられる
      欠点: 周ごとに PR で着地した便の数だけ forge へ問いを撃ち、 問いの数が撃たれた手でなく周の数に比例して forge の問いの上限を食う (DR6)
      欠点: 周が畳みまで撃つと、 merge の後もその worktree を人が使っている周に、 誰も撃たないまま入れ物を動かす。 畳みを撃たないなら、 閉じた後も worktree が残り、 畳む手番は結局残る
    verdict: rejected
    reason: "決め手は分析 (問いが周の数に比例し、 畳みの手番が残るか撃つ手なしに入れ物を動かす)。"
  - id: "OPT6"
    name: "何もしない"
    text: |
      land の終端も pipe retire も今のままにする。 決め手は分析 (着地した契約の閉じ方が取り下げしか無い)。
      （平易）land の終端も pipe retire も今のままにする案です。 口も字も変わらない点で勝ります。 けれども、 2 つの便の契約は着地したのに、 席が選べる閉じ方が「取り下げ」しか無く、 取り下げで閉じると着地した事実が台帳から消えます。 その契約へ分けた memo も、 器が閉じる条件 (全部が着地の印) を満たさず閉じません。 退けました。
      利点: 口も字も変わらない
      欠点: 2 つの便の契約は、 着地したのに席が選べる閉じ方が取り下げしか無く、 取り下げで閉じると着地の事実が台帳から消える (DR2)
      欠点: その契約へ分けた memo は、 自動の close の条件 (全部が着地の形) を満たさず閉じない (DR2)
    verdict: rejected
    reason: "決め手は分析 (着地した契約の閉じ方が取り下げしか無い)。"
  - id: "OPT7"
    name: "PR の merge の commit 自身の CI で照合する"
    text: |
      PR で着地した便は、 remote の main の先端でなく、 PR の merge の commit 自身の CI の結果で照合して閉じる。 決め手は分析 (着地の印の意味が経路で割れる)。
      （平易）PR を作った便を、 main の先端でなく、 PR の merge の commit 自身の CI の結果で確かめて閉じる案です。 他の人の commit で先端が赤いときも、 自分の merge の commit が緑なら閉じられる点で勝ります。 けれども、 押す経路の「CI 成功」の印は「その便を含む着地の後の main の先端が緑」を意味するので、 PR の経路だけ「自分の commit が緑」を意味すると、 同じ印が経路で別のことを指します。 新しい push で走行中の検査を打ち切る設定の repo では、 続けて merge された commit の検査が終わらず測れないことも残ります。 退けました。
      利点: 他人の commit で main の先端が赤いか結果がまだ無い周も、 自分の merge の commit が緑なら閉じられる (CSQ-N3 を負わない)
      利点: main への push ごとに CI が走る repo では、 PR の merge の commit にも自分の CI の run が付くので、 先端を待たずに測れる
      欠点: 押す経路の ci=success は「その便を含む着地の後の main の先端の CI が success」を指すので、 PR の経路だけ「自分の commit の CI」を指すと、 同じ着地の形の印が経路で別の事実を指す (DR5)
      欠点: 新しい push で走行中の run を打ち切る設定を持つ repo では、 続けて merge された PR の merge の commit の run が完了せず、 測れない周が残る
    verdict: rejected
    reason: "決め手は分析 (着地の印の意味が経路で割れる)。"
  - id: "OPT8"
    name: "remote を宣言しない repo は git の既定の remote に問う"
    text: |
      vessel 宣言が任意 key remote を持たない repo の PR で着地した便は、 clone の git の設定が既定とする remote (多くは origin) の main で照合する。 決め手は分析 (測る先が repo の宣言でなく clone ごとの git の設定になる)。
      （平易）repo の名乗りの設定が押す先を持たないときは、 手元の git が既定とする押す先 (多くは origin) の main で確かめる案です。 押す先を宣言しない repo の PR の便も閉じられ、 設定に項目を足さずに済む点で勝ります。 けれども、 測る先が repo の名乗った値でなく手元の clone ごとの git の設定になり、 同じ repo でも手元ごとに測る先が変わります。 これが選んだ案と分ける決め手です。 PR を作る 1 行は利用者が自由に書くので器が PR の出し先を知らず、 出し先と違う main を測れば閉じないことは、 選んだ案にも共通します。 退けました。
      利点: remote を宣言しない repo の PR で着地した便も閉じられ、 畳むだけにして契約が開いたまま残る行き止まりが無い (DR2)
      利点: vessel 宣言に key を足さずに済む
      欠点: --pr-cmd は任意の shell 行で、 器は PR をどの remote へ出したかを知らないので、 既定の remote の main が PR の merge された main と同じとは限らず、 違う main を測れば閉じない (not-ancestor)。 これは宣言の key remote の main で照合する OPT1 にも共通で (OPT1 の cons)、 2 つの案を分ける点ではない
      欠点: 照合の先が repo の名乗った値 (vessel 宣言・ADR-1010) でなく clone ごとの git の設定になり、 同じ repo でも clone ごとに測る先が変わる (C10)。 OPT1 と分ける決め手はこの点
    verdict: rejected
    reason: "決め手は分析 (測る先が repo の宣言でなく clone ごとの git の設定になる)。"
basis: [FR1050, FR1081, FR1090, FR1091, FR1092, FR1093, FR1096, AC1065, ADR-1008, ADR-1010, ADR-1045, ADR-1048, ADR-1078, ADR-1089]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「便」は契約 1 本を実装して取り込む 1 回の流れ、 「台帳」は仕事の約束 (契約) と裁定を記録する beads です。 便が main に着地すると、 器は取り込みの最後の手順 (land の終端) で台帳の契約を「着地で閉じた印」(着地の形) を付けて閉じます。 この印を書けるのは land の終端だけで、 席 (人と AI が話す session) が同じ印で閉じようとすると門が止めます。 ところが land の終端が閉じるのは、 remote (押す先) へ push して自動の検査 (CI) を確かめた便だけでした。 押す先を持たない repo の便と、 main を動かさずに PR を作って終わる便は、 着地しても契約を閉じる手段がありません。 この記録は、 land の終端が着地の印を書く経路を 3 つに広げます (要件書の FR1050 と FR1096)。 押す先を持たない repo の便は、 push も CI の確かめもせずに「CI の確かめなし」と書いて閉じます。 PR を作った便では、 land の終端の 3 つ目の経路として、 merge の後に撃たれた作業場を畳む器の口 (pipe retire) が、 merge と main の先端の CI を確かめてから閉じます。 どの経路も、 器が測った後にだけ印を書きます。 ただし押す先を宣言しない repo の PR の便は確かめる先が無く、 宣言と別の押す先へ PR を出した便は merge が宣言した押す先の main に入らないので、 どちらも閉じられず、 作業場を畳むだけの指定で片付け、 契約は開いたまま残ります。
approval:
  who: 持ち主
  date: 2026-09-29
  ruling: "t3-hub.74.60.1:20261004T0113Z-1（取り込みの裁定・器の記録は器の台帳の裁定 id を名指さない）"
  verbatim: "tsuzuri の台帳 t3-hub.74.60.1 の notes に在る（この file に写さない・器の記録は器の台帳の裁定 id を名指さない）"
  surface: R-8
consequences:
  - "この判断で良くなること 4 つと、 代わりに引き受けること 8 つです。 良くなるのは、 main に着地した契約と、 宣言した押す先へ PR を出した便の契約が閉じること、 印が器の確かめの後にだけ書かれること、 理由の頭の形が増えず印の意味もそろうこと、 PR の確かめが通らないときに同じ口を撃ち直すだけで済むことです。 引き受けるのは、 pipe retire が forge と network に依り、 merge の後に誰かが pipe retire を撃つまで契約が開いたまま残ること、 押す先の無い repo の便は CI で確かめないこと、 main の先端が赤いと自分に依らず閉じないこと、 版を跨ぐ字が増えること、 器の便の外の着地は今のまま印を持たないこと、 押す先を宣言しない repo の PR の便と、 宣言と別の押す先へ PR を出した便は閉じられず畳むだけになること、 merge されずに閉じた PR の作業場を畳むのに畳むだけの指定が要ること、 一度畳んだ PR の便は同じ口で着地の印に二度と届かないことです。"
  - "良い結果: main に着地した器の便は remote の有無に依らず、 PR で着地した器の便は宣言した remote へ PR を出した便で、 契約が着地の形で閉じ、 そこから分けた memo が自動の close まで進む"
  - "良い結果: 着地の形は器が測った事実 (main の歯の再実走・merge の祖先・先端の CI) の後にだけ書かれ、 席の着地の形の close を断る門に穴が開かない"
  - "良い結果: close の理由の頭と局面の出力の閉じた集合は増えず、 ci=success と tip= はどの経路でも同じ意味 (着地の後の main の先端が緑・着地した commit が先端でない) で読める"
  - "良い結果: PR で着地した便の照合が通らない周は何も書かずに理由の語を 1 つ出すので、 PR の merge か先端の CI を待って同じ口を撃ち直すだけで済む"
  - "代償: pipe retire が git と forge (PR の merge・先端の CI) に問う口になり、 network と forge の問いの上限に依る。 問うのは撃たれた周だけなので、 merge の後に launch の権能の手 (今は user) が pipe retire を撃つまで契約は開いたまま残る"
  - "代償: remote を持たない repo の便の着地の根拠は land の main の歯の再実走だけで、 CI の確かめを持たないことが理由の尾 ci=none に残る"
  - "代償: PR の経路は remote の main の先端の CI で照合するので、 merge の後に入った別の commit で先端が赤いか結果がまだ無い周は、 自分の変更に依らず閉じない (先端が緑になった後に撃ち直す)"
  - "代償: 版を跨ぐ面が増える (理由の尾の ci=none と PR の経路の tip=・pipe retire の理由の 6 語・畳むだけの指定 --fold-only)。 設計 doc と消費側の読み手が写す要がある"
  - "代償: 3 つの経路は器の便だけに掛かり、 器の便の外で着地した契約 (FR1092) の閉じは今のまま着地の形を持たない (ADR-1089 の代償のまま)"
  - "代償: vessel 宣言が remote を持たない repo の PR で着地した便は、 照合する remote が無く pipe retire が撃つたびに unmeasured で閉じない。 --pr-cmd が宣言と別の remote へ PR を出した便も、 merge の commit が宣言の remote の main に入らないので not-ancestor で閉じない。 どちらも出口は畳むだけの指定で worktree を畳むことで、 契約は開いたまま残り、 席が選べる閉じ方は着地の形でない形 (取り下げなど) だけになる (前者は畳む前に remote を宣言すれば閉じられるが、 squash の形で着地する便の main も push されるようになる)"
  - "代償: merge されずに閉じた PR の便の worktree は、 指定なしの pipe retire では not-merged で畳めず、 畳むだけの指定が要る (本 ADR の前は指定なしで畳めた)"
  - "代償: 畳んだ後の PR で着地した便 (畳むだけの指定で畳んだ便と、 本 ADR の前の pipe retire が畳んだ便) は、 worktree が元の場所に無いので同じ口が worktree-unready で断り、 着地の形の close に二度と届かない。 本 ADR の前に畳まれた PR で着地した便は本 ADR の射程の外で、 契約は開いたまま残る"
