  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録は他の ADR を置き換えず、 memo の 4 つの節を決めた ADR-1051 の昇格条件の節の中に引き金の行を足し、 器の台帳への書きを close の 1 種に限った ADR-1051 と、 前の棚卸しの印を消した ADR-1045 の線に従います。 依存の形は消した印の 1 つと判定の点が同じで、 審査の順番は経った時間で来るのでもう 1 つの印と同じ時間の線も持ちますが、 条件は memo 自身の行に置き、 古さを印として出さず、 出す先も違います。
