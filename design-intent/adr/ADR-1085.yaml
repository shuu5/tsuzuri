      利点: 器は判定で memo を閉じず台帳に書かない。 処置は席の手番のまま (DR4)
      利点: 席の作法の散文に頼らず、 門と知らせ直しが器の仕組みとして効く。 SessionStart の注入に 1 語も足さない (DR5)
      欠点: memo を書く人に引き金の行の形を覚えさせる。 器が読めない条件 (隣の project の段・持ち主の意向) は、 期日を見直しの日として書くしかない
      欠点: 既存の open な memo 19 本は引き金の行を持たず、 書き足すまでは審査だけが読む
      欠点: 周は FR1068 の契機でだけ回るので、 便が無く手動の 1 周も無い間は判じも審査も知らせもしない
      欠点: 判定の質は lens に依り、 誤った昇格（promote）や閉じる（close）の判定は席の処置の手番を増やす
      欠点: 審査の lens の消費の量は便の消費の記録に載らない (判定の event が回数を残す)
      欠点: 走査 1 つ・記録 2 つ (判定の file・event の種類)・rules 行 2 本・仕組み 1 つ (審査) と、 跨版の面（版を跨いで保つ約束） (引き金の行の形・notes の行頭 2 つ・通知の memo の要約の形) が増える
      欠点: 依存の形は判定点を依存に置く点で消した [MEMO-DUE] と同じで (ただし引き金の行ごとに判じ、 どれか 1 つが満ちれば満ちる)、 審査の順番は起票か前の判定からの経過で来る ([MEMO-STALE] と同じく時間の線を持つ)。 違いは条件を memo 自身の引き金の行に置くこと・経過を印として席へ出さないこと・出す面が作業記憶の復元の DATA (memo ごとの行) でなく、 既存の閉じた差し込み (FR1044 の便の終端の周の通知) に数と次の 1 本だけを載せて処置まで送り直すことで、 消した形との線はこの 3 つに頼る (DR5)
    verdict: adopted
    reason: "決め手は、 計算できる条件を毎周 LLM なしで読み、 引き金が満ちない memo を上限つきの LLM で意味から読み直し、 処置を席に残せること (分析)。"
  - id: "OPT2"
    name: "散文の昇格条件を毎周 LLM で全部判じる"
    text: |
      引き金の行を足さず、 周ごとに open な memo の全部の昇格条件の散文を lens に読ませ、 満ちたかを判じさせる。 決め手は分析 (消費が memo の数と周の数に比例し、 数えれば済む条件まで LLM が読む)。
      （平易）引き金の行を足さず、 回ごとに開いている memo 全部の散文の条件を審査役の AI に読ませて、 満ちたかを判じさせる案です。 書く人に新しい形を求めず、 どんな散文の条件も読め、 既存の 19 本もそのまま扱える点で勝ります。 けれども、 消費が memo の数と回の数の掛け算で伸び、 上限を置けば「毎回全部を判じる」前提が崩れます。 行の数や bead の状態や時刻のように数えれば済む条件まで AI が読むので、 同じ材料で判定が揺れます。 便を起こす回にも撃てば便の番と口座を奪い、 便を起こさない回だけにすれば毎回ではなくなるので退けました。
      利点: memo を書く人に新しい形を求めず、 散文のどんな条件も読める (DR1)
      利点: 既存の 19 本をそのまま扱える
      欠点: 消費が open な memo の数と周の数の積で伸び、 上限を置くと「毎周全部を判じる」前提が崩れる (DR3)
      欠点: 数えれば済む条件 ([再発] の行の数・bead の状態・時刻) まで LLM が読み、 同じ材料で判定が揺れる (DR2)
      欠点: 起こす便の在る周にも撃てば便の手番と口座を奪い、 起こす便が 0 の周だけにすると毎周ではなくなる (DR3)
    verdict: rejected
    reason: "決め手は分析 (消費が memo の数と周の数に比例し、 数えれば済む条件まで LLM が読む)。"
  - id: "OPT3"
    name: "期日だけを持たせる"
    text: |
      昇格条件に見直しの日付だけを持たせ、 過ぎた memo を知らせる。 条件は memo ごとの日付 1 つで、 消した棚卸しの印 (依存で決まる [MEMO-DUE]・器の全体の古さの閾値で決まる [MEMO-STALE]) のどちらとも違う。 決め手は分析 (日付は条件が満ちたかを映さず、 数えれば分かる条件も読まない)。
      （平易）昇格条件に見直しの日付だけを持たせ、 過ぎた memo を知らせる案です。 条件は memo ごとの日付 1 つで、 前の器が消した印 (待つ bead が全部閉じた memo の印と、 器の全体の日数の線を越えた memo の印) のどちらとも違う形です。 形が 1 つで判定も門も最も小さく、 AI を使わず消費が無い点で勝ります。 けれども、 同じことの再発や待っていた bead の完了で条件が早く満ちても日付まで知らせず、 満ちていなくても日付で知らせます。 memo の中身も台帳の状態も読まず、 数えれば分かる条件まで日付で近似することになるので退けました (選んだ案でも期日は 5 つの形の 1 つとして残ります)。
      利点: 形が 1 つで、 判定も門も最も小さい (DR2)
      利点: LLM を使わず消費が 0 (DR3)
      欠点: 条件が早く満ちても (同じ形の再発・待っていた bead の close) 日付まで知らせず、 満ちなくても日付で知らせる (DR1)
      欠点: memo の中身も台帳の状態も読まず、 数えれば分かる条件 (再発の行の数・待つ bead の状態) まで日付で近似する (DR2)
    verdict: rejected
    reason: "決め手は分析 (日付は条件が満ちたかを映さず、 数えれば分かる条件も読まない)。"
  - id: "OPT4"
    name: "席の作法の散文で「待ちの間に棚卸し」を求める"
    text: |
      器は何も足さず、 orchestrator の席の作法 (指示文や規則の散文) に、 便の無い間に open な memo の昇格条件を読み直すことを書く。 決め手は憲法 N2 (散文にだけ在る規則は規則として扱わない)。
      （平易）器は何も足さず、 席の作法の散文 (指示の文や規則の文章) に「便の無い間に開いている memo の条件を読み直す」と書く案です。 器の変更が無く、 約束も規則の行も増えず、 席の AI が散文の条件をそのまま読める点で勝ります。 けれども、 憲法 N2 は散文にだけ在る規則を規則として扱いません。 撃たれたかを誰も測れず、 席が忙しい時や文脈が詰まった時に抜け、 満ちた条件が届くかは結局 席の記憶に依ります。 読み直しの消費にも上限が無いので退けました。
      利点: 器の変更が 0 で、 跨版の面も rules 行も増えない
      利点: 席の LLM が散文の条件をそのまま読める (DR1)
      欠点: 散文にだけ在る規則で、 N2 は規則として扱わない。 撃たれたかを誰も測れない (DR5)
      欠点: 席が忙しい周や文脈の詰まった周に抜け、 満ちた条件が届くかは席の記憶に依る (DR1)
      欠点: 読み直しの消費に上限が無い (DR3)
    verdict: rejected
    reason: "決め手は憲法 N2 (散文にだけ在る規則は規則として扱わない)。"
  - id: "OPT5"
    name: "管理 tick で判じる"
    text: |
      周期で撃たれる管理 tick が台帳を読んで引き金を判じ、 合図の末尾に載せる。 決め手は現物 (tick は置き場の file だけを読み、 台帳も git も撃たない)。
      （平易）時計で定期的に動く管理 tick が台帳を読んで引き金を判じ、 席への合図の末尾に載せる案です。 便が無い間も時計で判じられ、 回が回らない間の穴が無く、 合図は既に席へ届く口なので新しい口が要らない点で勝ります。 けれども、 tick は置き場の file だけを読む作りで、 tick の動く環境には台帳を読む道具が無いと実測されており、 読めば毎回測れないになります。 同梱の読みには契約表 (git の木) が要り、 tick に git を撃たせることになります。 便を起こす仕組みが時計を持たない形の横に、 台帳を読む別の時計が並び、 審査役を起こす本数と口座の判断も 2 か所に割れるので退けました。
      利点: 便が無い間も時計で判じ、 周が回らない間の穴が無い (DR1)
      利点: 合図は既に席へ届く差し込みで、 新しい口を要らない
      欠点: tick の unit の環境には台帳の client が無く (実測)、 読めば毎回測れないになる (DR2)
      欠点: 同梱の読みには契約表 (git の木) が要り、 tick に git を撃たせることになる (DR2)
      欠点: dispatcher が周期の timer を持たない形 (ADR-1045 §2 (1)) の横に、 台帳を読む別の周期が並ぶ (DR5)
      欠点: 審査の lens を tick から起こすと、 本数と口座の判断が便の起動の周と 2 か所に割れる (DR3)
    verdict: rejected
    reason: "決め手は現物 (tick は置き場の file だけを読み、 台帳も git も撃たない)。"
  - id: "OPT6"
    name: "閉じる（close）の判定で器が memo を自動で閉じる"
    text: |
      審査が閉じる（close）と判じた memo を、 器が次の周に閉じる (close の理由に判定の file を書く)。 決め手は既存の決定と分析 (器の台帳の書きの意味を変え、 LLM の判定だけで task を捨てる)。
      （平易）審査役が閉じる（close）と判じた memo を、 器が次の回に自動で閉じる案です。 席の始末の手間が減り、 通知も早く消え、 書きの口は既存の close 1 つで済む点で勝ります。 けれども、 器が台帳へ書くのは着地の終わりの計算で決まる close だけで、 AI の判定で閉じるのは別の意味の書きになります (ADR-1045・ADR-1051)。 審査役の誤りで memo が黙って消え、 取り戻すには誰かが気付く必要があります。 閉じるか残すかは意味と価値の裁定で、 ADR-1053 は裁定を人 (席) に置き審査役に置かないので退けました。
      利点: 処置の手番が減り、 知らせの行も早く消える
      利点: 書きの口は既存の close の 1 種で、 新しい書きの種類は要らない
      欠点: 器の close は着地の終端の 1 か所 (計算で決まる close) に限られ、 LLM の判定で閉じる close は別の意味の書きになる (ADR-1045 §2・ADR-1051) (DR4)
      欠点: lens の誤りで memo が黙って消え、 取り戻すには誰かが気付く必要がある (DR1)
      欠点: 閉じるか残すかは意味と価値の裁定で、 ADR-1053 は裁定を人 (席) に置き lens に置かない (DR2)
    verdict: rejected
    reason: "決め手は既存の決定と分析 (器の台帳の書きの意味を変え、 LLM の判定だけで task を捨てる)。"
  - id: "OPT7"
    name: "常設の memo の型を持つ (bd の状態 pinned で全部の数えから外す)"
    text: |
      裁定の控えや方針の一覧のように昇格しない memo を bd の組み込みの状態 pinned にし、 起票の門・周の判定・審査・一覧・doctor の数えの全部から外す (pinned にした時に event を 1 行)。 台帳のグラフの溢れの数えが pinned を外す印 (ledger-form.md §12 の形 5) と同じ 1 つの印で済む。 決め手は裁定 id user 2026-09-28T07:47Z と憲法 C15。
      （平易）裁定の控えや方針の一覧のように昇格しない memo を、 bd の組み込みの状態 pinned (常設・閉じない) にし、 門・判定・審査・一覧・点検の数えの全部から外す案です。 控えを台帳に置いたまま通知の雑音にせず、 新しい形や label を作らず、 台帳のグラフの数えが既に使う印と同じ 1 つで済み、 隣の project で控えとして使われている memo 2 本も状態を変える 1 手で移せる点で勝ります。 けれども、 方針の一覧は決まりで、 置き場は ADR と設計書であって台帳ではありません (憲法 C15・C14)。 裁定の控えは台帳の問いとその裁定の行が持つので、 同じ裁定を 2 か所に持つことになります。 昇格しない memo は task ではなく memo としての仕事が無く、 pinned にすれば条件が満ちても知らされない memo を作れる抜け道になります。 持ち主も常設の memo の型を持たないと決めたので (裁定 07:47Z) 退けました。
      利点: 昇格しない控えを台帳に置いたまま、 知らせ直しの雑音にしない
      利点: 第 6 の引き金の形も別の label も作らず、 既存の組み込みの状態 1 つで表せる
      利点: 隣の project で昇格しない控えとして使われている memo 2 本を、 状態を変える 1 手で移せる
      欠点: 方針の一覧は規律で、 置き場は ADR と設計 doc (C14 の文書の面) であって台帳ではない (C15) (DR5)
      欠点: 裁定の控えは台帳の問い (FR1081) とその裁定の行 (FR1082) が持つので、 同じ裁定を 2 か所に持つことになる (DR5)
      欠点: 昇格しない memo は task でなく、 memo の型としての仕事が無い (C15)
      欠点: pinned にすれば判定から外れる抜け道になり、 条件が満ちても知らされない memo を作れる (DR1)
    verdict: rejected
    reason: "決め手は裁定 id user 2026-09-28T07:47Z と憲法 C15。"
basis: [FR1036, FR1044, FR1051, FR1068, FR1081, FR1082, FR1087, NFR1006, AC1057, ADR-1011, ADR-1045, ADR-1051, ADR-1053, ADR-1058]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「席」は器が立てる対話の AI の session (orchestrator)、 「便」は契約 1 本を実装して取り込むまでの 1 回の流れ、 「memo」は設計に上げる前の気付きを台帳に控えた bead です。 memo には「いつ設計に上げるか」を書く節 (昇格条件) がありますが、 散文なので器は読めず、 条件が満ちたかは席が覚えて読み直すしかありませんでした。 本 ADR は、 この節に器が読める引き金の行を 1 行以上書かせ、 形を 5 つ (同じことの再発・同じ file を触る契約・待っている bead の完了・期日・設計の行の着地) に決めます。 便を起こす仕組み (dispatcher) が回るたびに器が全部の memo を判じ、 満ちた memo を昇格の待ちにします。 引き金が満ちない memo は、 便を起こさない回に、 回ごとの本数と memo ごとの間隔の上限の内側で、 読むだけの審査役の AI に意味から読み直させます。 席が始末を付けるまで、 満ちた memo は一覧・通知・点検の行に、 審査の判定は一覧と通知に出し続けます。 引き金の行の無い memo の書き込みは、 台帳の書き込みの門が止めます (要件 FR1081 の 3 つ目の形)。 器は判定で memo を閉じず台帳にも書かず、 閉じない常設の memo の型も持ちません (要件 FR1087 を中心に FR1081・FR1044・FR1051 を支えます)。
