# 判断の記録 ADR-1085 — 器 scribe2 の判断の記録 ADR-0085 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1085
title: "memo の昇格条件は閉じた 5 形の引き金の行で器が周ごとに判じ、 満ちない memo は起こす便が 0 の周に読むだけの審査へ上限つきで掛け、 処置が付くまで知らせ直す — 器は審査の判定で memo を閉じず台帳に書かず、 常設の memo の型を持たない"
status: accepted
date: 2026-09-28
context: |
  memo (設計の前の控えの bead) の昇格条件は散文で、 条件が満ちたかを確かめる手は席の記憶しか無かった。 本 ADR は昇格条件の節に器が読める引き金の行を持たせて 5 つの形に閉じ、 dispatch の周 (FR1068 の契機の周) ごとに全部の open な memo を判じる。 引き金が満ちない memo は、 起こす便が 0 の周に rules 行の本数と間隔の内側で、 読むだけの審査の lens に意味から読み直させる。 満ちた memo は一覧と通知と doctor に、 審査の判定は一覧と通知に、 席が処置するまで出し続ける。 器は判定で memo を閉じず、 常設の memo の型も持たない。
  なぜこの判断が要るのかを、 経緯 (memo の形は決まったが、 昇格条件の中身は誰も機械で読まない)・事象 (開いている memo 19 本の条件は全部散文)・現物 (便を起こす回・通知・裏で撃つ審査役・書き込みの門は既に在る)・憲法と既存の決定の向き・裁定・射程 (要件書と設計書の分担) の 6 つで示します。
  CTX1 経緯 — memo（契約の前の覚え書き） の形は ADR-1051 で閉じたが、 昇格条件の中身を読む手は席の記憶だけ
  ADR-1051 §4 は memo を label intake:memo の 1 つで見分け、 本文に 4 つの節を持たせ (最後の節が昇格条件)、 節の欠けを doctor の台帳（作業の記録簿 (beads)）の形の行が数える。 昇格条件の節は行き先の 1 語 (要件 id・要 ADR・要 裁定) と散文で、 器は節が在るかだけを数え、 中身を読まない。 memo から契約への遷移は席の手番で、 器が memo を閉じるのは着地の終端で、 その memo から discovered-from で辿れる契約が全部閉じた時だけである。 条件が満ちたかを確かめる手は、 席 (orchestrator) が open な memo の散文を読み直す手番しか無い。 前の器の棚卸しは、 作業記憶の復元の DATA (seat rebrief の出力・/rebrief の skill が復元で読む) に 2 つの印を memo ごとの行で出していた (SessionStart の hook が注入したのは open・in_progress・blocked の件数の 1 行だけ)。 [MEMO-DUE] は blocks 依存を持ちその全部が closed の memo (判定点は memo ごとの依存) で、 [MEMO-STALE] は依存を持たず、 priority が rules 行の値以下で、 updated_at から rules 行の日数が経った memo (古さの閾値は器の全体の規則) である。 印は器が数え、 処置（memo への対応の手）は印を読んだ席が決めた。 これらは ADR-1045 §2 (2) の作業記憶の削除で読み手ごと消え、 ADR-1051 も古さの閾値を持たないと決めた。
  CTX2 事象 — open な memo 19 本の昇格条件は全部散文で、 器の読める行は 0 本
  2026-09-28 の起草の時点の本 repo の台帳 (791 本) で label intake:memo を持つ bead は 125 本、 そのうち open は 19 本 (106 本は closed) である。 19 本の昇格条件の節は全部散文で、 本 ADR の文法で読める引き金（契約へ上げる条件の行）の行は 0 本である (2 本は箇条の行頭「- 引き金: 再発 N」の形を満たすが、 値が 1 語で切れず読めない引き金になる)。 条件の形を草稿が読んで分けると (推定・1 本が 2 つの形を持つことがあり和は 19 を越える)、 同じ形がもう 1 回起きたら (再発) が 10 本、 持ち主の裁定か指示を待つものが 5 本、 別の契約の着地か同じ file を触る便に乗せるものが 3 本、 隣の project の段の進みを待つものが 2 本である。 notes に [再発] の行を持つ memo は 2 本、 discovered-from で契約から辿れる open な memo は 0 本、 状態 pinned の bead は 0 本である。 持ち主の指示 (裁定 id user 2026-09-28T04:20Z) は、 器が memo の昇格条件を自ら判じ、 起こす便の無い周に判定しに行き、 処置が付くまで orchestrator の席へ渡し続けることを求めた。
  CTX3 現物 — 周・知らせ・裏で撃つ lens（審査する使い捨て AI）・起票の門は既に在る
  dispatch の周は器の dispatcher（便を自動で起こす役） が FR1068 の契機 (便の終端・便を運ぶ process の退役・手動の 1 周・介入の印・回答と承認の記帳) でだけ回す周で、 周ごとに台帳を 1 回読み、 契約表の facts も 1 周に 1 回読み、 周期の timer を持たない (ADR-1045 §2 (1)・設計 dispatcher.md §5)。 運転手の終端の周で起こした便が 0 本かつ候補が 1 本以上なら、 orchestrator の席へ idle の 1 行を送る (FR1044 の閉じた差し込みの 1 つ・dispatcher.md §19)。 その末尾には、 台帳で開いたまま処置の無い落ちた便を毎周載せ、 処置 (close・release・行の直し) が付くまで同じ行を送り直す形が在る (§29・1 回きりの知らせが席の turn の途中で届かなかった実例から足した形)。 依存を待つ行へ先に撃つ事前審査の lens (§27 の行 aa) は、 1 周の本数の上限を rules 行に持って撃ち中を上限に数え、 裏に起こして周は終わりを待たない。 ただしこの lens は口座を選ばず起こす側の環境を継承し、 封じ込めの箱にも入れない (箱の片付けは作り手の process が死んだ箱を畳むので、 周が終わると裏の lens が殺されるため)。 lens の口は 1 本で、 契約の隣に置いた材料の file で雛形を切り替え、 settings を 1 つも読まない (ADR-1011)。 起票の門（台帳の書き込みを止める門）は memo の create に 4 節の本文を求める guard で、 command と本文の file だけを読む (ledger-form.md §3 の 9)。 管理 tick (ADR-1058) は置き場の file だけを読み、 台帳も git も撃たない (unit の環境に台帳の client が無い実測・seat-heartbeat.md §16)。
  CTX4 憲法と既存の決定の向き
  C15 は台帳をタスクと裁定の記帳先に限り、 規律を台帳に置かない。 C2 は選別と経路をそれぞれ 1 つの列挙の上の 1 関数にし、 新しい理由は列挙の 1 つの値として足す。 C14 は規律を文書 (憲法・ADR・SRS) とデータ (rules manifest) の 2 面に置く。 N2 は散文・記憶・会話にだけ在る規則を規則として扱わない。 C1 は規則の値を manifest の 1 file に置き、 C5 は rules 行の変更に user の裁定 id を求める。 C17.2 は走査・記録・rules 行・仕組みを足す前に、 消すものを名指すことを求める。 本 ADR が消すのは、 席が手で撃つ memo の棚卸し (open な memo の昇格条件の散文を読み直す手番) と、 散文だけの昇格条件である。 A1 は token の消費 (使う) に user の承認を求める。 ADR-1051 §4 は、 ADR-1045 §2 の dispatcher の着地を引いて、 器の台帳の書きを close の 1 種に限る。 ADR-1051 §4 は memo から契約への遷移を席の手番に置き、 古さの閾値を持たない。 ADR-1053 は計算できる判断を code に、 意味の判断を lens に、 裁定を人に置く。 同 ADR の射程は「便が受付から着地まで通る判断を 19 本に割」ったもので、 lens の verdict の語彙を 3 値に限るのはその便の審査の語彙であり、 便に属さない memo の審査は別の閉じた語彙を持ってよいと読む (解釈)。
  CTX5 裁定 — 指示・消費の承認・常設の memo の否定・推奨で進める常設の指示
  裁定 id user 2026-09-28T04:20Z は memo の列 (器が昇格条件を判じ、 起こす便の無い周に審査を掛け、 処置まで渡し続ける) を指示した。 裁定 id user 2026-09-28T07:27Z は審査の lens の token の消費を承認した (1 周に 2 本まで・1 本の memo は 24 時間に 1 回まで)。 裁定 id user 2026-09-28T07:47Z は常設の memo の型を持たないと決めた。 裁定 id user 2026-09-28T00:54Z は決めてほしいことを推奨で進める常設の指示で、 残りの分岐 (5 形の読み・処置の 4 形・通知の送り方・器が判定で閉じないこと) は台帳の設計の推奨のまま決めた。 逐語は台帳にだけ在る。
  CTX6 射程 — 要件書は 5 形の意味だけを持ち、 字面は設計 doc が持つ
  要件書 (SRS v0.28) は、 FR1087 に 5 形の意味と周の判定と審査と知らせを、 FR1081 (起票の門の 3 形) の (c) に deny (引き金の行を持たない memo の create と、 昇格条件の節を引き金の行の無い本文へ書き換える update) を、 FR1044 の便の終端の周の通知に起こす便が 0 の周の memo の要約を、 FR1051 の台帳の lint の項目に処置の付かない昇格（memo を契約へ上げること）の待ちの本数と最古の年齢を持ち、 scope の項は「memo の昇格条件と審査」である。 引き金の行の字面の文法と notes の行頭は ledger-form.md の改稿が、 通知の memo の要約の字面は dispatcher の設計 doc が持ち、 どちらも SRS には無い。 動かさないのは、 起動の列 (FR1068・memo は便を起こさない)・器の台帳の書き (着地の close の 1 種)・memo の 4 節の見出しと 4 象限・台帳 lint の既存の項目・SessionStart の注入・管理 tick の合図・事前審査の lens の本数と上限・便の審査の verdict の語彙である。
  （選択肢を測るものさし）この判断を評価する 5 本のものさしです。 満ちた条件が誰かの記憶に頼らず席に届くこと。 計算できる条件は器の code が 1 本の判定で毎回判じ、 意味を読む判断だけを審査役の AI に回すこと。 消費に上限があり、 便の番と口座を奪わないこと。 memo の始末は席の番のままで、 器の台帳への書きを増やさないこと。 決まりを散文でなく器の仕組みで持ち、 消した棚卸しの形 (復元の文に出す印) を戻さないことです。
  DR1｜満ちた条件が、 誰かが覚えていなくても orchestrator の席に届く (記憶に頼らない) CTX1・CTX2
  DR2｜計算できる条件は code が 1 つの列挙の上の 1 本の判定で毎周判じ、 意味を読む判断だけを lens に回す (判断の置き場) CTX3・CTX4
  DR3｜消費に上限があり、 便の手番と口座を奪わない (承認の内側で使う) CTX3・CTX5
  DR4｜memo の処置は席の手番のまま、 器の台帳の書きは着地の close の 1 種のまま CTX1・CTX4
  DR5｜規律は器の仕組みで持ち、 消した棚卸しの形 (復元の DATA に出す印) を戻さない CTX1・CTX4
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 昇格条件に 5 つの形の引き金の行を持たせ、 書き込みの門が引き金の無い memo を止め、 便を起こす回ごとに全部の memo を判じます。 満ちない memo は便を起こさない回に上限つきで審査役に読ませ (始末を待つものは除きます)、 始末が付くまで、 満ちた memo は一覧・通知・点検の行に、 審査の判定は一覧と通知に出し続けます。 器は判定で memo を閉じません。
  採用 — OPT1
  memo の昇格条件の節 SHALL 引き金の行を 1 行以上持ち、 形 SHALL 閉じた 5 つとする (FR1087) — 再発 (notes の再発の行〔[再発] で始まる行〕が値の数以上)・同梱 (閉じていない契約の行の write-set が値の path を持つ)・依存 (値の bead が closed)・期日 (周の時刻が値の UTC の年月日と時分を過ぎた)・着地 (値の設計 doc の行を設計 pointer に持つ bead が 1 本以上 closed)。 行の字面 SHALL「引き金: <形> <値>」(行頭の「- 」を許す・値は空白を含まない 1 語・後ろの字は読まない) とし、 字面の文法の正本は設計 ledger-form.md の改稿が持ち、 起票の門・周・pipe dispatch ls SHALL 同じ 1 つの読み手を引く。 引き金の行を持たない memo の create と、 昇格条件の節を引き金の行の無い本文へ書き換える update は、 FR1081 の (c) の形として起票の門が実行の前に台帳を読まずに断り、 5 形を告げる (門は席の道具の呼び出しにだけ掛かる)。 dispatch の周 (FR1068 の契機の周) SHALL 周の 1 回の台帳の読みと周が既に読む契約表で open な (closed でない・pinned と defer も含む) 全部の memo を判じ、 discovered-from で辿れる契約を持つ memo (昇格済み) を除き、 1 つでも満ちた memo を昇格（promote）の待ちとし、 読めない引き金を満ちないとして名指す。 満ちない memo のうち、 処置の待ちの memo を除き、 前の判定 (無ければ起票) から rules 行 memo.triage_interval_h (時間・値は user 裁定 id 付き) が過ぎたものを、 起こす便が 0 の周に限り、 撃ち中を含めて rules 行 memo.triage_per_round (本数・値は user 裁定 id 付き) の本数まで古い順に、 裏の器の process に渡す (周は待たない。 周は timer を持たないので、 審査も契機の周にだけ回る)。 その process SHALL FR1036 の便用の規則で口座を選び、 NFR1006 の箱の内側で読むだけの memo の審査の lens を撃ち、 判定 (昇格（promote）・close・keep・読めない出力は unparsed) と証拠と昇格なら設計のスケッチを置き場の file に、 event を 1 行書く。 器 SHALL 判定で memo を閉じず台帳に書かない。 処置の待ち SHALL 昇格の待ちと処置の無い昇格・close の判定とし、 処置 SHALL 昇格 (acceptance に設計 pointer を持つ契約へ書き直す)・close・引き金の行の書き直し・keep の記帳 (notes の [keep] で始まる行) の 4 つとする。 pipe dispatch ls SHALL memo の行 (引き金の成否・判定・年齢・前の判定の時刻) を出す。 起こす便が 0 の周の便の終端の周の通知 (FR1044 の閉じた一覧の 1 つ) SHALL open な memo の数・昇格の待ちの数・次の 1 本とその判定を名指し (字面は dispatcher の設計 doc が持つ)、 処置の待ちが在る周は候補が 0 本でも送る。 doctor の台帳の lint の項目 (FR1051) SHALL 処置の付かない昇格の待ちの memo の本数と最古の年齢を出す。 起動の列 (FR1068) は変えない。 常設の memo の型を持たない。 引き金の行の字面・5 形・[再発] と [keep] の行頭・通知の memo の要約の形 SHALL 跨版の面とする。
  （平易）memo の昇格条件の節には、 器が読める引き金の行を 1 行以上書きます。 行は「引き金: <形> <値>」で、 形は 5 つ (再発・同梱・依存・期日・着地) に閉じます。 行の頭の「- 」は許し、 値は空白を含まない 1 語で、 その後ろの字は器が読みません。 引き金の行の無い memo の起票と、 昇格条件の節を引き金の行の無い本文へ書き換える書き換え (前に引き金の行が在ったかは問いません) は、 台帳の書き込みの門が要件 FR1081 の 3 つ目の形として (席が自分の道具で撃つ書き込みだけを見て)、 台帳を読まずに止め、 5 つの形を告げます。 便を起こす仕組みが決まった契機で回るたびに、 1 回読んだ台帳とその回が既に読む契約表の上で閉じていない全部の memo (pinned や棚上げのものも含む) を判じ、 すでに契約へ上がったもの (discovered-from で契約から辿れるもの) を除いて、 1 つでも満ちた memo を昇格の待ちにします。 読めない引き金は満ちないとして名指します。 満ちない memo は、 始末を待つものを除き、 前の判定 (無ければ起票) から規則の行 memo.triage_interval_h の時間が過ぎたものだけを、 便を起こさない回に、 走っている分も含めて規則の行 memo.triage_per_round の本数まで古い順に、 裏の器の process に渡します (回は待ちません。 回は時計を持たないので、 審査も決まった契機の回にだけ回ります)。 その process は便用の選び方で口座を選び、 封じ込めの箱の中で読むだけの審査役を撃ち、 判定 (昇格（promote）・閉じる（close）・保つ（keep）、 読めない出力は unparsed) と証拠と、 昇格なら設計の下書きを置き場の file に、 出来事の記録を 1 行書きます。 器は判定で memo を閉じず、 台帳にも書きません。 始末 (昇格・close・引き金の行の書き直し・notes に [keep] で始まる行を足すこと) が要るのは、 昇格の待ちと、 始末の無い昇格・閉じるの判定です。 一覧 (pipe dispatch ls) には memo の行を、 便を起こさない回の通知の 1 行には memo の数・昇格の待ちの数・次の 1 本とその判定を出し (字面は設計書が持ちます)、 始末の要るものが在る回は候補が 0 本でも送ります。 点検 (doctor) の台帳の点検の項目 (要件 FR1051) には、 始末の付かない昇格の待ちの本数と最も古いものの年齢を出します。 便を起こす列は変えず、 常設の memo の型は持ちません。 引き金の行の字面・5 つの形・[再発] と [keep] の行頭・通知の memo の要約の形は、 版を跨いで保ちます。
  （理由）昇格条件が散文のままだと、 満ちたかを確かめる手は席の記憶しか無く、 開いている 19 本の条件は 1 本も器に読めませんでした。 そこで、 数えれば分かる条件 (再発の行の数・bead の状態・時刻・契約の触る file・行を指す bead の完了) を閉じた 5 つの形の行にして、 器の code が回ごとに判じます。 この計算は 1 回読んだ台帳と、 その回が既に読む契約表の上で済み AI を使わないので、 毎回全部の memo に撃てます。 形を開いたままにせず 5 つに閉じたのは、 書き込みの門と判定と一覧が 1 つの列挙の上の 1 本の読み手で字面を読み、 散文の抜け道を作らないためです (憲法 C2)。 引き金の満ちない memo は、 器が読めない条件 (隣の project の進みや持ち主の意向) を含めて審査役の AI に意味から読み直させ、 便を起こさない回に限って、 回ごとの本数と memo ごとの間隔を規則の行で縛りました。 持ち主が承認した消費 (裁定 07:27Z) の内側に留め、 便の番と口座を奪わないためです。 審査役の口座は便用の選び方に、 箱は封じ込めの要件に揃え、 箱を作る裏の器の process を審査の終わりまで残して、 回が終わっても審査役が殺されないようにしました。 判定で器が memo を閉じないのは、 器の台帳への書きを着地の終わりの計算で決まる close に限った既存の決定 (ADR-1045・ADR-1051) を守り、 閉じるかの判断を席に残すためです (ADR-1053)。 始末が付くまで通知を送り直すのは、 1 回きりの知らせが席の手の途中で届かなかった実例と同じ穴を塞ぐためです。 依存の形は判定の点を依存に置く点で前の器が消した印 ([MEMO-DUE]) と同じで、 審査の順番が経った時間で来る点ではもう 1 つの印 ([MEMO-STALE]) と同じ時間の線を持ちますが、 条件を memo 自身の行に置き、 古さを印として席へ出さず、 出す先も復元のときに読む memo ごとの行でなく既にある便の終わりの通知に数と次の 1 本だけなので、 消した棚卸しの形は戻しません。 常設の memo の型を持たないのは、 方針は ADR と設計書に、 裁定は台帳の問いに置くので、 昇格しない memo には仕事が無いからです (憲法 C15・裁定 07:47Z)。 走査と記録と規則の行と仕組みを足す代わりに、 席が手で撃っていた memo の棚卸しと、 散文だけの昇格条件を消します (憲法 C17.2)。 回は時計を持たず決まった契機でだけ回るので、 便が無く手動の 1 回も無い間は何もしないことを限界として受け入れ、 席は手動の 1 回で撃てます。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1087（claim）: FR1087 (memo の引き金と審査) の 5 形の意味・dispatch の周の判定・起こす便が 0 の周の審査 (本数と間隔は rules 行 2 本)・処置が付くまでの知らせを、 引き金の行の字面・処置の 4 形・知らせの送り方まで決めて主張する。 審査は処置の待ちの memo を除くので、 FR1087 の字面 (前の判定から間隔が過ぎた満ちない memo を審査する) より狭い。 5 形のうち着地は、 値の行を設計 pointer に持つ bead の close で近似して読む (CSQ-N5)。 行の字面の文法の正本は ledger-form.md の改稿、 通知の字面は dispatcher の設計 doc が持つ。
  FR1081（claim）: FR1081 (起票の門の 3 形) の (c) の形 — 引き金の行を持たない memo の create と、 昇格条件の節を引き金の行の無い本文へ書き換える update — を、 席の道具の呼び出しの command と本文の file だけを読んで実行の前に断り、 引き金の 5 形を告げる形で主張する。 (c) の update は、 書き換えた後の本文が昇格条件の見出しを持つ書きと読み、 見出しごと消す update は門を通して台帳 lint と周が名指す (CSQ-N4)。 deny の要件は FR1081 が持ち、 FR1087 はそれを引く。
  FR1044（claim）: FR1044 (席間の連絡・廃止) の閉じた差し込みの一覧のうち便の終端の周の通知で、 起こす便が 0 の周の 1 行が memo の要約 (open な memo の数・昇格の待ちの数・次の 1 本とその判定) も持つと主張する。 別の差し込みの口を作らず、 1 行の字面は dispatcher の設計 doc が持つ。
  FR1051（claim）: FR1051 (台帳の lint) の doctor の項目が、 処置の付かない昇格（promote）の待ちの memo の本数と最古の年齢も出すと主張する (AC1057 の doctor の行)。
  FR1036（implementation）: memo の審査の lens の口座を FR1036 の便用の規則で選ぶ実装。 規則そのものは変えない。
  NFR1006（implementation）: memo の審査の lens を封じ込めの箱の内側で撃つ実装 (封じ込めの外で走る器の子 process 0 本を保つ)。
  FR1068（rationale）: FR1068 の周は周期の timer を持たず契機でだけ回り、 起動の列は memo を持たない。 本 ADR の判定と審査がその周にだけ乗り、 列を変えない根拠である。
