  器の案の章の要約: 候補を 7 つ並べます。 閉じた 5 つの形の引き金の行を器が判じ、 残りを上限つきの審査に回す案 (選んだ案)、 散文の条件を毎回 AI で全部判じる案、 期日だけを持たせる案、 席の作法の散文で棚卸しを求める案、 管理 tick で判じる案、 閉じる（close）という判定で器が memo を自動で閉じる案、 閉じない常設の memo の型を持つ案です。
  器の専門語の説明: 本文に出てくる専門語 9 個を、 やさしい言葉で説明します。
  ・台帳（ledger）: task と裁定を記帳する bd (beads) の記録。 1 件を bead と呼ぶ。 規律は置かない (憲法 C15)。 器が台帳へ書くのは着地の終端の close だけ。
  ・引き金（trigger line）: memo の昇格条件の節に置く、 器が判じる 1 行。 形は閉じた 5 つ (再発・同梱・依存・期日・着地) で、 1 つでも満ちた memo は昇格の待ちになる (FR1087)。 引き金の行を持たない memo の create と、 昇格条件の節を引き金の行の無い本文へ書き換える update は起票の門が断る (FR1081)。 行の字面の文法は設計 doc が持つ。
  ・昇格（promotion）: memo を、 acceptance に設計 pointer を持つ契約へ書き直す処置 (判定の値は promote)。 器は自分では行わず、 引き金が 1 つでも満ちてまだ処置の無い memo を昇格の待ちとして、 起こす便が 0 の周の通知と doctor の台帳の lint の項目に出す (FR1087・FR1051)。
  ・memo（memo）: 台帳の bead のうち label intake:memo を持ち、 受入条件の設計 pointer を持たない覚え書き (契約にする前の段)。 本文に決まった 4 つの節を持ち (ADR-1051)、 起動の列に入らず (FR1068)、 昇格条件の節に引き金の行を持つ (FR1087)。 設計の中身を持つなら tracked な設計 doc への pointer を要る (FR1051)。
  ・処置（disposition）: 昇格の待ちと、 昇格か close の判定に席が付ける始末。 昇格・close・引き金の行の書き直し・keep の記帳 (notes の [keep] の行) の 4 つで、 付くまで知らせ直す。
  ・起票の門（ledger write gate）: 器の plugin を積む席の hook が、 席の道具の呼び出しの台帳への書きの command を実行の前に読んで断る門 (FR1081 の 3 形)。 memo の書き (その (c) の形) では command と本文の file だけを読み、 台帳は読まない。
  ・lens（lens）: 材料を読んで判定を返す headless の AI の process。 settings を読まず、 書きの道具の許しを渡されない。 口は 1 本で、 隣の材料の file で雛形を切り替える。 本 ADR の memo の審査の lens は、 引き金の満ちない memo を起こす便が 0 の周に読むだけで判じ、 判定は昇格 (promote)・close・keep の 3 つで、 器は判定で memo を閉じない。
  ・dispatcher（dispatcher）: 台帳から起動の列を導き、 便を起こし、 着地させる器の仕組み (FR1068)。 便の終端・手動の 1 周・介入の印などの契機でだけ回り、 周期の timer を持たない。
  ・跨版の面（cross-version surface）: 器の版が上がっても外から読まれる形を変えない約束。 変えるときは新しい ADR を要し、 歯が pin する。
