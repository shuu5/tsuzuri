      （平易）memo の昇格条件の節に「引き金: <形> <値>」の行を 1 行以上書かせ、 形を 5 つに決める案です。 5 つは、 notes に [再発] で始まる行が N 行たまったか (再発)、 まだ閉じていない契約がその file を触る予定か (同梱)、 待っている bead が閉じたか (依存)、 その日時を過ぎたか (期日)、 その設計書の行を指す bead が閉じたか (着地) です。 便を起こす仕組みが回るたびに、 1 回だけ読んだ台帳と、 その回が既に読む契約表の上で全部の memo を計算で判じ、 満ちた memo を昇格の待ちにします。 満ちない memo は、 始末を待つものを除き、 前の判定から規則の行の時間が過ぎたものだけを、 便を起こさない回に規則の行の本数まで、 読むだけの審査役 (口座は便用の選び方・封じ込めの箱の中) に読ませ、 判定を置き場の file と出来事の記録 1 行に残します。 始末が付くまで、 満ちた memo は一覧・便を起こさない回の通知・点検の台帳の項目に、 審査役の判定は一覧と通知に出し続け、 器は判定で memo を閉じません。 計算で済む条件を毎回 AI なしで読み、 引き金の満ちない memo を上限つきの AI で意味から読み直し、 始末を席に残せる点で勝ります。 代わりに、 書く人が形を覚える必要があり、 器が読めない条件 (隣の project の進み・持ち主の意向) は期日を見直しの日として書くしかなく、 既存の 19 本は書き足すまで審査だけが読み、 回が回らない間は何もせず、 審査役の判定の誤りは席の手間を増やし、 審査の消費の量は便の記録に載らず、 器の部品と版を跨ぐ約束が増えることを引き受けます。 また、 依存の形は判定の点を依存に置く点で前の器が消した印 ([MEMO-DUE]) と同じで、 審査の順番も経った時間で来るので、 消した形との違いは、 条件を memo 自身の行に置くこと・古さを印として出さないこと・出す先が復元のときに読む memo ごとの行でなく、 既にある便の終わりの通知に数と次の 1 本だけを載せることの 3 つに頼ります。
