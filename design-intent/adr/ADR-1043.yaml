consequences:
  - "この判断で良くなることと、代わりに引き受けることです。同じ木の周の主実測が record 1 本になり、形も規則も増えません。代わりに、git が無視する file（build の中間物など）のせいで gate を通った便を主実測が捕まえる機会が同じ木の周には無くなること（追跡していない file は gate の前提検査がもともと断ります）、同じ木の周には段ごとの秒の記録が残らないこと、前の決定記録の 1 文を部分的に置き換えることを引き受けます。"
  - "良い結果: 同じ木の周 (実測で 36 本中 27 本) の主実測が、 ①②④ の中央値 14.9 分から record 1 本の書き込みに縮む"
  - "良い結果: record の schema・rules 行・gate の段と順序は増えず、 変更は skip record の閉じた口に主実測の 1 つを足すことと、 木の比較を tmp worktree を切る前へ移すこと"
  - "良い結果: 木が違う周と tree の無い verdict の周の経路は不変 (全段撃つ) で、 main が未検査の木になる周は増えない (fail-closed)"
  - "代償: gate は便の worktree で撃ち、 主実測は切りたての worktree で撃つ (ADR-1021 §2.4)。 untracked と未 commit は gate の前提検査 (status --porcelain が空・verdict の tree はその木) が既に断るが、 ignore された file に依って gate を通った便を同じ木の周に主実測が捕まえる機会は無くなる (その面は main の CI の照合 FR1050 に残る)"
  - "代償: 同じ木の周は verify-main.jsonl に段ごとの record が並ばないので、 主実測の段ごとの秒の分布はその周から取れない (skip record は秒を持たない規則のまま)"
  - "代償: ADR-1021 §2.4 の「①②④ は従来どおり撃つ」を部分 supersede する (③の省き方の面と record の形の文は残る)"
