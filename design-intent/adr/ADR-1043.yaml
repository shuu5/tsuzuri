  器の案の章の要約: 候補を 6 つ並べます。同じ木なら全段を撃たず record 1 本にする案、今のまま検出線だけ省く案、write-set の照合だけ残す案、主実測をなくして gate の後は常に着地する案、主実測を着地の後に非同期で撃つ案、そして重い段だけ選んで省く案です。
  器の専門語の説明: 本文に出てくる専門語を、やさしい言葉で説明します。
  ・主実測（main check）: 便が main に着地した直後に、 着地した main の木 (追跡 file だけ) に対して gate と同じ検証を撃ち直すこと。 record は verify-main.jsonl に残る (ADR-1021 §2.4・設計 gate-cost.md §5)。
  ・同じ木の主実測（same-tree main check）: 着地する commit の木の sha が gate の verdict.json の tree と一致する周の主実測。 本 ADR では全段を撃たず record 1 本で残す。
  ・主実測の省略の record（main skip record）: 同じ木の周に verify-main.jsonl へ 1 本だけ書く record (kind=main skipped=main tree=<sha> reason=same-tree)。 どの木の測定を再現と見なしたかを木の sha で持つ。 既存の skip record と同じ形で schema は 1 のまま。
  ・木の sha（tree sha）: git が commit の中身 (追跡 file の集合) から計算する識別子。 中身が byte 単位で同じなら同じ値になる (content-addressed)。 gate は verdict.json の tree に、 主実測は着地する commit から取って比べる。
  ・4 段（four stages）: gate と主実測が撃つ順序: ① write-set 照合 → ② 共通 verify → ③ 検出線 → ④ 契約 verify (ADR-1009 §2.4 に ADR-1021 §2.4 が③を挿した順)。 本 ADR は順序を変えない。
