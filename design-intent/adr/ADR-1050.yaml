  器の案の章の要約: 候補を 7 つ並べます。3 つの資源を数えて受付と待ち合わせの両方を直す案、重い検査を着地の後へ回す案、同時本数の上限を人が決める値として新設する案、閾値を実測そのままの数字で書く案、混んだら走っている仕事を一時停止する案、箱に CPU の上限を付ける案、そして test 側の直しだけで足りるとする案です。
  器の専門語の説明: 本文に出てくる専門語を、やさしい言葉で説明します。
  ・硬い資源（hard resource）: 枯渇したときに host そのものを止めうる資源。 本 ADR の時点で memory と CPU の core と、 器が host に頼む scope の作成の 3 つ。 足りなくなっても遅くなるだけの資源とは、 受付で枠を取るかどうかで扱いが分かれる。
  ・job 1 つの値段（per-job thread price）: 実測の core 数を変異検査の並列度の上限で割った thread 数 (1 の床)。 器の pure 関数 1 本が出す実効値で、 受付は枠の core の項をこの値で割って数え、 受け付けた枠が job 数と対で行へ運ぶ。
  ・器の健康の遮断器（host health circuit breaker）: verify の行を撃つ前に走行可能な process と待ちの process を読み、 閾値と比べて空いている / 混んでいる / 測れないの 3 値を返す境界。 混んでいる周は待ち、 待ち切れなかった周は行を撃たずに INCONCLUSIVE で終える。 行為を止めうるので極性一覧に載る guard である。
  ・走行可能な process（runnable process）: CPU を待っているか実際に走っている process。 host の面の走行可能を運ぶ欄の分子から読む (総 process 数を運ぶ分母と取り違えない)。 遮断器はこの数を core あたりの倍率 × core 数と比べる。
  ・待ちの process（blocked process）: 割り込めない待ち (D 状態) に入った process。 host の面の待ちを運ぶ行から読む。 事故ではこの数が最大 52,412 に達し、 走行可能の山と対で host を止めた。
  ・core あたりの倍率（per-core multiplier）: 遮断器の閾値を組み立てる Int の rules 行 2 本 (走行可能 4・待ち 1)。 閾値は倍率 × 実測の core 数で、 絶対値を tracked の manifest に焼かないので core 数の違う host でも同じ意味を持つ。
