plain: |
  検証を並列で走らせる本数を決めるとき、いままでは「空いている memory」だけを見ていました。2026-09-20 に、memory は十分余っているのに開発 machine が 4 時間半ほぼ止まる事故が起きました。詰まったのは memory ではなく、CPU の芯（core）の数と、器が machine に頼んでいた「子 process を箱に入れてください」という依頼の処理でした。そこで、足りなくなると machine が止まる資源を memory だけでなく core と箱の依頼も含めた 3 つと考え直します。受付は core の数も見てから本数を配り、混んで 1 本に絞った回は、その 1 本が core を全部使わないように test の同時実行数も 1 にします。さらに、検証の 1 行を撃つ前に machine の混み具合を見て、混んでいれば空くまで待ちます。待っても空かなければ「判定できなかった」で終えます。「失敗した」ではないので、落ち着いてから測り直せます。
consequences:
  - "この判断で良くなることと、代わりに引き受けることです。machine 全体で走る test の数が core を超えなくなり、混んだ回に仕事が失敗で消えなくなる一方、見かけ上の同時並列は減り、混んだ machine では判定できなかった仕事がたまり、規則の行や仕組みがいくつか増えます。"
  - "良い結果: host 全体で同時に走る test の thread が core を超えるところで受付が止まる (枠の分母が測定値なので新しい宣言値は要らない)"
  - "良い結果: 縮退した周が job 1 かつ thread 1 になり、 混んだ host でいちばん太い行を撃つ形が消える"
  - "良い結果: 測れていない周に便が FAIL で終端しないので、 負荷が引いた後に同じ木を測り直せる (実装の成果が列から外れない)"
  - "良い結果: 閾値が core あたりの倍率なので、 core 数の違う host で同じ manifest が同じ意味になる"
  - "良い結果: 予防 (受付の枠) と待避 (遮断器) が別の面を塞ぐので、 片方が効かない周をもう片方が拾う"
  - "代償: rules 行 2 本と kind 2 つ・宣言の穴 1 つ・完了 enum の variant 1 つ・極性一覧の guard 1 つ・受付の閉じた理由 1 つが増える (極性一覧が増えるのは ADR-1021 の面で初めて)"
  - "代償: host 全体で同時に走る変異検査が実質 core 1 杯ぶんに収まるので、 6 本同時の見かけの並列は失われる (1 本あたりの所要は短くなり、 総 throughput はほぼ不変)"
  - "代償: 混んだ host では便が INCONCLUSIVE に溜まり、 起こし直しか再 gate の周が増える"
  - "代償: 遮断器は瞬間値を読むので、 短いスパイクでも待つ周が出る (平均値を読まないと決めた代償)"
  - "代償: 要件書の便の自動起動の条文は受付の枠を「host の memory の枠」と書いているので、 core の項を足した後は要件文と実装の語が食い違う (改稿は spec の編集の口を通る user の手番)"
