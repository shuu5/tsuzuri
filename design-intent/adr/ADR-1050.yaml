# 判断の記録 ADR-1050 — 器 scribe2 の判断の記録 ADR-0050 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1050
title: "core と器が host に頼む scope の作成も硬い資源で、 受付の枠は memory の 2 項と core の 1 項の min・行を撃つ前に器の健康を読んで混んだ周は待ち、 待てなかった周は FAIL でなく INCONCLUSIVE で終える (ADR-1021 §2.1 / §2.2 / §2.3 / §2.7 を部分 supersede・scope の作成の面は歯の道具箱が持ち本 ADR は機構を足さない)"
status: proposed
date: 2026-09-21
context: |
  ADR-1021 は「memory だけが硬い資源・CPU は溢れても遅くなるだけなので上限を持たない」と決め、 受付の枠を memory の 2 項だけで組んだ。 2026-09-20 の実測はその前提が偽であることを示した — memory が余ったまま host が 4.5 時間ほぼ凍り、 溢れたのは core と、 器が host に頼む scope の作成だった。 本 ADR は硬い資源を 3 つに読み替え、 受付の枠に core の項を足し、 行を撃つ前に器の健康を読む遮断器を置く。
  なぜこの判断が要るのかを、事故の実測と現物から説明します。memory は余っていたのに machine が 4 時間半止まり、その間に走っていた検証の記録は 1 件も出ていません。詰まりの直接の相手は machine の管理係で、そこへ送られた依頼の 99 % 以上は test 自身が出したものでした。いまの受付は memory しか見ず、器は machine の混み具合を 1 度も読みません。
  CTX1 実測 — memory が余ったまま host が 4.5 時間ほぼ凍った
  2026-09-20 の 4 時間半、 開発 host がほぼ応答を失った (数字の要旨・逐語と採取は台帳 s2-07l.504)。 走行可能な process（いま動ける状態で順番を待っている process） の 1 分平均は 8 から 19,459 を経て 68,816 へ上がり、 process 数は 2,655 から 76,145 へ、 待ち (D 状態) の process は最大 52,412 に達した。 10 分刻みの統計の採取そのものが何度も抜け、 cron も走れていない。 一方で memory は使用 30 % で、 kernel の OOM は 0 件・警告も 0 件だった。 同時刻に変異検査を持つ gate が 6 本同時に走り、 便の event は 4 時間 1 件も出ていない。 回復は介入なしの自然回復である。
  CTX2 出所の帰属 — 詰まったのは器が host に頼む scope の作成で、 その 99 % 超は歯が作っていた
  直接の詰まり先は user の session manager (systemd --user) である。 器は verify の 1 行ごとに transient な scope を頼み、 process ごとの probe でも 1 つ作る。 6 時間の記録に在る scope の event は 36.5 万件で、 出所を unit 名で分類すると 99 % 超が歯の toy 便と probe だった (実便の verify 行に帰属できた scope は 0 件)。 scope は slice 直下の平面にしか作れず入れ子を持たないので、 実物を撃つ歯が起こす process は、 その歯を走らせている gate の箱から構造的に外れる。 scope 1 本の作成は平常 10〜30 ミリ秒のところ、 6 gate が撃ち続けている間は 0.4〜1.8 秒まで延びた。
  CTX3 現物 — 受付は memory の 2 項だけを見て、 job ごとの thread の上限は gate 1 本の中でしか閉じない
  受付が配る枠は「いま空いている memory」と「受け付けたがまだ常駐していない分」の 2 項の min で、 どちらも memory の式である。 事故の host は後者が 39 job ぶんを許したので、 6 gate × 4 job = 24 枠が全部通った。 変異検査の内側の test に渡す thread は道具の側が core 数を job 数で割って出すので、 core 32 の host では gate 1 本 (job 4・thread 8) で 32 thread に達し、 それだけで core が満杯になる。 さらに待ちの上限を超えて縮退した周は job 1 になり、 同じ導出が core 数ぶんの thread を出す — 枠を配れないほど混んだ host で、 いちばん太い行を撃つ形である。
  CTX4 現物 — 器は host の健康を 1 度も読まない
  凍結の 4.5 時間、 器は撃った行が返らないまま走り続けた。 走行可能な process 数と待ちの process（外からの応答を待って止まっている process） 数は host の面に常に出ているが、 器がこの 2 面を読む口は 1 つも無い (器が host の面を読むのは受付と封じ込めの memory の 2 か所だけである)。 混んだ host でも同じ勢いで行を撃ち、 負荷で落ちた歯をそのまま赤に数えるので、 測れていない周に便が終端し、 実装の成果ごと列から外れる。
  CTX5 ADR-1021 の前提が偽だった面
  ADR-1021 §2.2 は scope に CPU の上限を付けない理由を「memory だけが硬い資源」と書き、 §2.3 の枠は memory の 2 項で閉じ、 §2.7 は「CPU の上限」を射程外に置いた。 事故はこの前提の一般化が偽であることを示した — memory が溢れなくても、 core と scope の作成が枯渇すれば host は止まる。 §2.1 が決めた「宣言 file の置ける穴は 2 つの閉じた集合」も、 job ごとの thread を器から行へ渡す口を持たないので、 導出が道具の側に残る原因になっている。
  CTX6 user の裁定と憲法の向き
  user の裁定 (要旨・逐語は台帳 s2-07l.504 の notes・裁定 id user 2026-09-20T15:23Z) は遮断器の閾値を比の形で出した — 走行可能が core 数の 4 倍を超えたとき、 待ちが core 数を超えたときを「混んでいる」とする。 あわせて本事故を繰り返さない直しを最優先で入れよと指示した。 憲法は、 閾値を裁定 id 付きの rules 行に持つこと (C1 / C5)、 宣言値と測定値と実効値を型で分け宣言値を測定なしに実効へ上げないこと (C10)、 環境変数を読まず裏口を作らないこと (C2.2)、 待つ実装を 1 つに限ること (C3.4)、 境界に極性を持たせること (C11.2)、 main を常に緑に保つこと (C12.6)、 足す前に消すものを名指すこと (C17)、 host 固有の値で分岐しないこと (N3) を求める。
  （選択肢を測るものさし）この判断を評価する 5 本のものさしです。足りなくなると machine を止める資源を数え漏らさないこと、締めるために人が決める新しい値を増やさないこと、混んだ回にかえって太い仕事を投げないこと、machine を測れていない回に仕事を失敗扱いで終わらせないこと、そして閾値が core の数が違う machine でも同じ意味になることです。
  DR1｜枯渇したときに host を止める資源を漏らさず、 受付の勘定に入れる CTX1 (memory は余っていた)・CTX2 (scope の作成が詰まった)・CTX3 (core の勘定が無い)
  DR2｜枠を締めるのに新しい宣言値を増やさない (分母は測定値で取る) 憲法 C1 / C5 / C10 / C17.2・CTX3 (core 数は host ごとに違う測定値)
  DR3｜混んだ周に速い側へ倒れない (縮退した行が太くならない) CTX3 (縮退した gate ほど core を広く使う)
  DR4｜host を測れていない周に便を終端させない CTX4・憲法 C12.6・裁定 (CTX6)・凍結中に赤へ倒れた過去の周
  DR5｜閾値が core 数の違う host を跨いで同じ意味を持つ CTX6 (裁定が比の形で出ている)・憲法 N3
decision: |
  選んだ案と、それが要件書のどの要件を支えるかを示します。受付が配る枠は memory の 2 項と core の 1 項のうちいちばん小さいものになり、混んだ回と測れない回はどちらも 1 本かつ同時実行数 1 になります。検証の 1 行を撃つ前には machine の混み具合を読み、混んでいれば待ち、待ち切れなければ撃たずに判定できなかったとして終えます。
  採用 — OPT1
  器 SHALL 枯渇で host を止めうる硬い資源を memory・CPU の core・器が host に頼む scope の作成の 3 つとし、 ADR-1021 §2.2 の「memory だけが硬い資源」を置き換える (箱に CPU の上限を付けない形そのものは不変である)。 受付 SHALL 配る枠を memory の 2 項と core の 1 項の min とし、 core の項 SHALL 実測の core 数を job 1 つの値段で割った本数から生きている札の job 数の和を引いた値 (0 の床) とする。 job 1 つの値段 SHALL 実測の core 数を rules 行 gate.mutants_jobs で割った thread 数 (1 の床) を返す pure 関数 1 本が出し、 core 数 SHALL 器が host の面から実測する (環境変数を読まない・C2.2)。 器 SHALL NOT 枠のために新しい宣言値の rules 行を足す (core 数は測定値・C10)。 受け付けた枠 SHALL job 数と thread 数を対で運び、 待ちの上限を超えて縮退した周と core 数を読めない周 SHALL どちらも job 1 かつ thread 1 とする (core 数ぶんの thread にしない)。 宣言 file の共通 verify と検出線が置ける穴 SHALL {base} と {jobs} と thread の穴の閉じた 3 つとし (ADR-1021 §2.1 の閉じた 2 つを置き換える)、 受付を通らない行 SHALL 1 で埋める。 thread の導出の正本 SHALL 器の 1 か所とし、 道具 SHALL 受けた値をそのまま変異検査へ渡すだけで core 数からの導出を持たない (渡されない周と数でない周の既定は 1)。 器 SHALL verify の行を撃つ前に host の健康を読む遮断器を持ち、 走行可能な process 数 (host の面の走行可能を運ぶ欄の分子) と待ちの process 数 (host の面の待ちを運ぶ行) を閾値と比べて「空いている」「混んでいる」「測れない」の閉じた 3 値を返す pure 関数 1 本で判じる (host の面を読む口は同じ置き場の 1 本で、 外から差し替える口 SHALL NOT 作らない)。 閾値 SHALL core あたりの倍率 × 実測の core 数とし、 倍率 SHALL rules 行 2 本 (host.runnable_per_core / host.blocked_per_core・kind は Int) が持ち、 値 SHALL 走行可能 4 ・ 待ち 1、 裁定 id SHALL user 2026-09-20T15:23Z・裁定日 SHALL 2026-09-20 とする (C5・絶対値を tracked の manifest に焼かない・N3)。 ちょうど閾値の周 SHALL NOT 混んでいるに数えない。 混んでいる周 SHALL 空くまで待ち、 待ち SHALL 完了 enum の variant 1 つで唯一の待機実装を通る (C3.4)。 待ちの上限 SHALL 既存の rules 行 gate.slot_wait_s を使い回し、 3 本目の値の線 SHALL NOT 足さない。 上限を超えた周 SHALL その行の process を起こさず、 記録に閉じた印を残し、 判定 SHALL 「箱の中で死んだ」の直後にその印を読んで閉じた理由 1 つで INCONCLUSIVE に倒す (赤が 1 行在っても INCONCLUSIVE とし、 FAIL で終端させない・印が無い周の判定順は変えない)。 どちらかの面を読めない周と数でない周 SHALL 待たずに行を撃ち、 記録に「測れない」の字面を残す (0 に潰さない・C10)。 本境界 SHALL 極性一覧に guard として載る (in-loop / fail-open・ADR-1014 §2.1)。 受付と封じ込め SHALL 従来どおり guard ではない (縮退するだけ)。 着地後の主実測 SHALL 同じ遮断器を通る。 scope の作成の面 SHALL 歯が実物を撃たない形が持ち、 器 SHALL NOT 本 ADR で scope の作成に新しい機構を足す。 器 SHALL NOT 同時に走る変異検査の本数の上限を新しい rules 行にする (便の同時本数の上限は ADR-1035 の行が持つ)。
  （平易）足りなくなると machine が止まる資源を、memory と CPU の芯の数と、器が machine に頼む箱の作成の 3 つとします。受付が配る本数は、空いている memory から出る数・まだ使われ始めていない分から出る数・core の数から出る数のうち、いちばん小さいものにします。1 本ぶんが使う test の同時実行数は、実際に測った core の数を上限の本数で割って器が決め、人が決める新しい設定は 1 つも足しません。混んで 1 本に絞った回と、core の数を読めなかった回は、どちらも 1 本かつ同時実行数 1 にします。この同時実行数は、宣言 file の差し込み口をもう 1 つ増やして器から検証の行へ渡し、道具の側は受け取った値をそのまま使うだけにします。検証の 1 行を撃つ前には、いま走れる process の数と待たされている process の数を読み、それぞれ core 1 つあたりの倍率（走れる側は 4 倍・待ち側は 1 倍）を掛けた数と比べます。ちょうどの値は混んでいるとしません。混んでいれば空くまで待ち、待つ時間の上限はすでに在る設定を使い回します。上限を超えた回はその行を撃たず、判定は「失敗」ではなく「判定できなかった」にします。どちらかの数を読めなかった回は待たずに進み、読めなかったことを記録に残します。この仕組みは行を撃つかどうかを左右するので、止める仕組みの一覧に載せます。着地後の検査も同じ 1 本を通ります。
  （理由）事故のとき memory は 3 割しか使われておらず、machine を止めたのは core と、箱を作ってもらう依頼の詰まりでした。ですから受付が memory しか数えないのは、数え漏らしです。core の数は machine ごとに違いますが実際に測れるので、人が決める新しい設定を足さずに枠の分母として使えます。混んだときに 1 本へ絞る従来の動きは、そのままだとその 1 本が core を全部使う形になっていたので、同時実行数も一緒に 1 に落とします。混み具合の閾値を core 1 つあたりの倍率で書くのは、判断がもともと「core の数の何倍か」という言い方で出ていて、そう書けば core の数が違う machine でも同じ意味になるからです。待ち切れなかった回を失敗にしないのは、凍った machine では仕事の中身を測れていないからで、失敗にすると出来上がっていた成果ごと列から外れてしまいます。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  NFR1006（claim）: 変異検査の並列度を並列の枠から配る形はそのままで、 枠の式に core の項を足す。 封じ込めの外で走る子 process 0 本の形と箱の大きさは変えない。
  FR1046（claim）: 枠が細い周・core 数を読めない周・host の健康を読めない周は、 どれも便を断らずに縮退する (前 2 つは job 1 かつ thread 1、 最後は待たずに進む)。
  FR1008（rationale）: 「1 本でも rc が 0 でなければ FAIL」の赤は走った行の赤を指す。 待ちの上限を超えた周は行を 1 本も撃たないので、 その周は赤を数える前段で INCONCLUSIVE に倒れる根拠を与える。
  FR1009（claim）: PASS を名乗らず INCONCLUSIVE とする既存の極性に、 host の健康を待ち切れなかった周を足す。 終端でないので同じ木を測り直せる。
  NFR1004（claim）: host の面が読めない周と数でない周は黙って既定へ倒さず、 「測れない」の字面を記録に残す。 受付の閉じた理由にも core 数を読めない周の variant を 1 つ足す。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、判断が最後に行き着く原則です。費用の測り方を決めた前の記録のうち、「memory だけが硬い資源」という前提と、受付の計算式と、宣言 file に置ける差し込み口の数と、CPU を扱わないとした範囲の 4 か所を置き換えます。箱の形や着地の順序など、他の部分は変えません。
  改訂状態: current
  置き換える ADR: ADR-1021
  置き換えられた: なし (現行)
  ADR-1021 のうち 4 か所を部分 supersede する。 (i) §2.2 の「CPU に上限を付けない (memory だけが硬い資源)」は「封じ込めの箱に CPU の上限を付けないことは不変だが、 その理由は CPU が硬くないからではない。 硬い資源は memory と core と scope の作成の 3 つで、 core は受付の枠と遮断器が守る」と読む (SHALL be read as)。 (ii) §2.3 の受付が配る枠「min(いま空いている分, まだ常駐していない分)」は「min(いま空いている分, まだ常駐していない分, core の項)」と読み、 同 §2.3 の「待ち切れなければ並列度 1 で進む」は「job 1 かつ thread 1 で進む」と読む。 受付の置き場・札の形と回収の判定・lock の実装・受付が guard でないことは変えない。 (iii) §2.1 の「宣言 file の共通 verify が置ける穴は {base} と {jobs} の閉じた集合」は「閉じた 3 つ ({base} と {jobs} と thread の穴)」と読み、 ADR-1010 §2.1 / §2.3 (2) への ADR-1021 の読み替えも同じ基準を 3 つ目の穴に掛ける。 同 §2.1 の「道具は値を持たない」は thread の値にも掛かる。 (iv) §2.7 射程外の「CPU の上限」は「封じ込めの箱に付ける CPU の上限は射程外のまま・受付の枠と遮断器が扱う core の勘定は本 ADR の内側」と読む。 ADR-1021 の他の文 (封じ込めの形と箱の 2 種・scope が殺された周の極性・main 実測の検出線の省略・着地の順序の原則・§2.7 が射程外に置いた swap の制御と host をまたぐ受付) は変えない。 ADR-1009 / ADR-1010 のうち ADR-1021 が読み替えなかった文・ADR-1014 §2.1 (guard の定義と極性一覧)・ADR-1035 (便の同時本数の上限は rules 行 1 本)・ADR-1043 (木が同じ主実測は record 1 本) は不変である。 歯が実物の scope を撃たない形 (同じ事故の 1 つ目の面) は設計 doc の歯の道具箱の節が持ち、 決定記録を要さない (本 ADR は関連として指すだけで、 決定に含めない)。
  照会終端 — PRIN-HARD-IS-WHAT-STOPS-THE-HOST
  硬い資源とは、 枯渇したときに host を止める資源である。 どれが硬いかは設計の見立てではなく実測が決め、 見立てが外れた面は前提ごと置き換える。
  本 ADR が「memory だけが硬い資源」を 3 つに読み替えたのはこの原則に行き着く (これ以上は遡らない照会終端)。
options:
  - id: "OPT1"
    name: "硬い資源（足りなくなると machine 全体が止まる資源）を memory と core と scope の作成の 3 つに読み替え、 受付の枠を 3 項の min にし、 行を撃つ前に器の健康の遮断器（machine が混んでいる間は検証を撃たずに待つ仕組み）を置く"
    text: |
      受付が job 1 つの値段（変異検査 1 本ぶんが使う test の thread 本数） (実測の core 数を並列度の上限で割った thread 数) を出し、 配る枠を memory の 2 項と core の 1 項の min にする。 受け付けた枠は job 数と thread 数を対で運び、 縮退と測れない周はどちらも 1 にする。 行を撃つ前に走行可能な process と待ちの process を core あたりの倍率（core 1 つあたり何本までを混雑とみなすかの係数）と比べ、 混んでいる周は空くまで待ち、 待ち切れなかった周は行を撃たずに INCONCLUSIVE で終える。 scope の作成の面は歯が実物を撃たない形が持ち、 本 ADR は機構を足さない。
      （平易）足りなくなると machine が止まる資源を、memory と CPU の芯の数と、箱を作ってもらう依頼の 3 つと考え直す案です。受付は memory の 2 つの見積りに加えて、core の数から何本ぶん走らせられるかも数え、いちばん小さい数だけ配ります。混んで 1 本に絞った回は、その 1 本の中の test の同時実行数も 1 にします。さらに検証の 1 行を撃つ前に machine の混み具合を読み、混んでいれば空くまで待ち、待ち切れなければ撃たずに判定できなかったとして終えます。箱の依頼が多すぎる問題そのものは、test 側の直しがすでに引き受けているので、ここでは新しい仕組みを足しません。
      利点: 受付が core を勘定に入れるので、 host 全体で同時に走る test の thread が core を超えるところで止まる
      利点: 枠の分母が測定値 (実測の core 数) なので、 新しい宣言値の rules 行が 1 本も要らない
      利点: 縮退した周が job 1 かつ thread 1 になり、 混んだ host でいちばん太い行を撃つ形が消える
      利点: 閾値が core あたりの倍率なので、 core 数の違う host で同じ manifest が同じ意味になる
      利点: 測れていない周に便が FAIL で終端しないので、 負荷が引いた後に同じ木を測り直せる
      利点: 受付の枠 (混み始めの予防) と遮断器 (混んだ後の待避) は別の面を塞ぐので、 片方が効かない周をもう片方が拾う
      欠点: rules 行 2 本と kind 2 つ・宣言の穴 1 つ・待ちの variant 1 つ・極性一覧の guard 1 つ・受付の閉じた理由 1 つが増える
      欠点: host 全体で同時に走る変異検査が実質 1 本ぶんの core に収まるので、 6 本同時の見かけの並列は失われる (1 本あたりの所要は短くなる)
      欠点: 混んだ host では便が INCONCLUSIVE に溜まり、 起こし直しか再 gate の周が増える
      欠点: 遮断器は瞬間値を読むので、 短いスパイクでも待つ周が出る
    verdict: adopted
    reason: "受付が job 1 つの値段（変異検査 1 本ぶんが使う test の thread 本数） (実測の core 数を並列度の上限で割った thread 数) を出し、 配る枠を memory の 2 項と core の 1 項の min にする。 受け付けた枠は job 数と thread 数を対で運び、 縮退と測れない周はどちらも 1 にする。 行を撃つ前に走行可能な process と待ちの process を core あたりの倍率（core 1 つあたり何本までを混雑とみなすかの係数）と比べ、 混んでいる周は空くまで待ち、 待ち切れなかった周は行を撃たずに INCONCLUSIVE で終える。 scope の作成の面は歯が実物を撃たない形が持ち、 本 ADR は機構を足さない。"
  - id: "OPT2"
    name: "変異検査を着地の後へ回す"
    text: |
      gate では変異検査を撃たず、 着地した後にまとめて測る。 同時に走る変異検査の本数が構造的に減る。
      （平易）重い検査を、変更を本線に載せる前ではなく載せた後にまとめて行う案です。同時に走る重い仕事そのものが減りますが、中身のない test が本線に入ってしまう時間ができ、後から問題が見つかった回の戻し方も要ります。混んだ machine で撃ち続ける問題も残ります。
      利点: gate の壁時計が大きく縮み、 同時に走る重い行そのものが減る
      利点: 受付にも遮断器にも手を入れずに、 事故の主因だった同時本数が下がる
      欠点: 歯が空虚なまま main に入る窓ができる (変異の生存を着地の前に測れない)
      欠点: 着地後に生存が出た周の戻し方が要る (main を常に緑に保つ形と噛み合わない)
      欠点: 混んだ host で行を撃ち続ける面はそのまま残る (凍結の下で便が赤に倒れる型は塞がらない)
    verdict: rejected
    reason: "gate では変異検査を撃たず、 着地した後にまとめて測る。 同時に走る変異検査の本数が構造的に減る。"
  - id: "OPT3"
    name: "host で同時に走る変異検査の本数の上限を rules 行で新設する"
    text: |
      「同時に走る gate は N 本まで」を宣言値の rules 行 1 本にし、 受付がその本数で断る。
      （平易）「同時に走らせてよい検査は N 本まで」という数字を、人が決める規則の行として新しく作る案です。事故の形をそのまま名指して止められますが、同じことは core の数を測れば分かるので、machine ごとに人の判断が要る数字が 1 つ増えるだけになります。core の数が違う machine では同じ数字が別の意味にもなります。
      利点: 事故の形 (6 本同時) をそのまま名指して止められる
      利点: 実装が小さい (数えて待つだけ)
      欠点: 宣言値が二重になる — 同じことを core の測定値が既に表せるのに、 host ごとに裁定の要る値の線が 1 本増える
      欠点: core 数の違う host で同じ値が別の意味になる (N3 の向き)
      欠点: job ごとの thread の導出が道具の側に残るので、 縮退した 1 本が core を広く使う形は塞がらない
    verdict: rejected
    reason: "「同時に走る gate は N 本まで」を宣言値の rules 行 1 本にし、 受付がその本数で断る。"
  - id: "OPT4"
    name: "遮断器の閾値を絶対値の rules 行にする"
    text: |
      事故の host で裁定が示した実値 (走行可能 128・待ち 32) を、 そのまま tracked の manifest に焼く。
      （平易）混み具合の閾値を、事故が起きた machine の実測値そのまま（走れる process 128・待ち 32）で書く案です。読む側は掛け算をせずに済みますが、core の数が違う machine では同じ設定が別の意味になります。もともとの判断も「core の数の何倍か」という言い方で出ているので、実測値を書くと言い方から 1 段遠くなります。
      利点: 読む側が掛け算を持たずに済む (行の値をそのまま比べる)
      利点: 裁定の実値がそのまま残る
      欠点: core 数の違う host で同じ manifest が別の意味になる (tracked の値に 1 つの host の形を焼く・N3)
      欠点: 裁定そのものが core 数との比で出ているので、 絶対値は裁定の字面から 1 段遠い
      欠点: host が増えるたびに行の改訂と裁定が要る
    verdict: rejected
    reason: "事故の host で裁定が示した実値 (走行可能 128・待ち 32) を、 そのまま tracked の manifest に焼く。"
  - id: "OPT5"
    name: "混んだ周は走っている process を一時停止する運用にする"
    text: |
      閾値を超えた周は、 走行中の変異検査の process に停止の signal を送って眠らせ、 空いたら再開する。
      （平易）混んできたら、すでに走っている検査の process に「いったん眠れ」と合図して止め、空いたら起こす案です。走っている最中にも効きますが、眠っていた時間が検査の時間切れ判定に混ざり、まだ生きている問題を時間切れとして数えてしまいます。他の仕事の process に手を出すことにもなります。
      利点: 走行中の周にも効く (受付は次の周からしか効かない)
      利点: 便を待たせずに host を空けられる
      欠点: 止めた時間が変異検査の時間切れの判定に入り、 生きている変異が時間切れとして数えられる (測定が嘘になる)
      欠点: 器が他の便の process に手を出すことになり、 便どうしの独立が壊れる
      欠点: 止めた process を確実に起こす責任が増え、 落ちた周に眠ったままの process が残る
    verdict: rejected
    reason: "閾値を超えた周は、 走行中の変異検査の process に停止の signal を送って眠らせ、 空いたら再開する。"
  - id: "OPT6"
    name: "scope に CPU の上限を付ける"
    text: |
      封じ込めの箱に memory の上限と並べて CPU の上限を付け、 行が使える CPU 時間そのものを頭打ちにする。
      （平易）子 process を入れる箱に、memory の上限と並べて CPU の上限も付ける案です。ただし今回詰まったのは CPU の取り合いではなく、順番待ちの process が積み上がったことでした。上限は 1 本ずつを遅くするだけで積み上がる本数は減らず、箱の依頼そのものの数も減りません。memory と違って足りなくなっても machine が process を止めてくれないので、「溢れたら死ぬのはその箱だけ」という形にもなりません。
      利点: 箱の形が 1 つ増えるだけで、 受付にも判定にも手を入れない
      利点: 行ごとの CPU の使用が確実に頭打ちになる
      欠点: 事故は CPU 時間の奪い合いではなく、 走行可能と待ちの process が積み上がったことで起きた — 上限は 1 本ずつを遅くするだけで、 積み上がる本数を減らさない
      欠点: memory と違って kernel が process を殺さないので、 「溢れたら死ぬのはその箱だけ」の形にならない
      欠点: scope の作成そのものの rate は 1 つも減らない (詰まりの直接の先は session manager である)
      欠点: 遅くなった行が箱の中で長く居座り、 受付の枠を握ったままになる
    verdict: rejected
    reason: "封じ込めの箱に memory の上限と並べて CPU の上限を付け、 行が使える CPU 時間そのものを頭打ちにする。"
  - id: "OPT7"
    name: "歯が実物の scope を撃たない形 (層 1) だけで足りるとする"
    text: |
      歯の道具箱に偽物を標準で置いて scope の作成の 99 % を消し、 受付にも判定にも手を入れない。
      （平易）test 側で本物の依頼を出さないようにする直しだけで十分とする案です。記録に残った依頼の 99 % 以上が test 由来だったので効果は大きいのですが、それを 0 にしても検査そのものが core を 6 倍に使う形は残ります。memory が余っていた以上、止まった原因は依頼の数だけでは説明が付きません。混んだ machine で撃ち続ける問題も残ったままです。
      利点: 事故の記録で最大の出所 (歯由来の scope 36 万件) が 0 になる
      利点: 規則の行が 1 本も増えず、 器の src を 1 行も触らない
      欠点: 歯の scope が 0 になっても、 変異検査そのものが core を 6 倍に使う形は残る (memory は余っていたので、 凍結は scope の rate だけでは説明が付かない)
      欠点: 混んだ host で行を撃ち続ける面が塞がらない (凍結の下で便が赤に倒れる型はそのまま)
      欠点: 同じ事故の 3 つの面のうち 1 つしか閉じない
    verdict: rejected
    reason: "歯の道具箱に偽物を標準で置いて scope の作成の 99 % を消し、 受付にも判定にも手を入れない。"
