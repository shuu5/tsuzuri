      （平易）宣言 file の 1 語を、 今ある「測らない」に「記す」と「止める」を足した 3 語にします。 受付は、 上限の読みと repo の材料の読みと許す命令の検査を鍵を取る前へ移して 1 回だけ撃ち、 撃つ命令を決める表の検査も鍵の前に撃ち、 鍵の中の判定はその結果を借りて宣言を読み直しません (表の行は今までどおり鍵の中で 2 回読み直します)。 受付は名乗りに関わらず材料を読む前の時点の前の状態 (commit) を控え、 「記す」か「止める」を名乗った消費側の作業では、 その木を一時的に用意して、 検査を通った歯の命令のうちテストの専用道具 (nextest) の命令だけを、 検査の段と同じ混み具合の遮断器に通して同じ囲い (memory の札は取らない) で 1 本ずつ撃ち、 撃ち終えたら木を片付けます。 専用道具の命令だけを撃つのは、 それだけが終わり方の数字で「歯が無い」「歯が落ちた」「build が落ちた」を分けて返すからです。 専用道具でない命令と、 歯の名を絞らない専用道具の命令と、 歯が無いときに落ちる旗を持たない専用道具の命令は撃たずに「測れなかった」とします。 撃たずに「該当する歯が無い」とするのは、 命令の全体を読み切れて (命令の全体が半角の英数字と少しの記号 (_ - . : = /) と半角の空白だけで書かれ、 部品と置き場の名指しが半角の空白で区切って 1 つずつで、 その名が - で始まらず、 歯が無ければ落ちる旗と、 歯の名のあとに添える試験の引数のほかに旗を持たない)、 部品が前の木の部品の一覧にそのまま書かれていて、 置き場だけが無いと確かめられた命令だけです。 確かめられない命令 (読み切れない命令、 部品の一覧の書き方が読めない repo の命令、 新しい部品を名指す命令を含みます) は撃って、 専用道具自身の答えに任せます。 撃った命令の結果は 4 通りに写します。 通ってしまった (前の木でも合格)、 該当する歯が無い、 落ちた、 測れなかった (build の失敗・途中で殺された・memory が溢れた・遮断器の待ちが上限を超えた) です。 木を用意できなかった周と、 撃った後に前の状態が動いていた周は、 全部を測れなかったとします。 通った作業では記録の置き場に控えた commit と命令ごとの結果を残し、 受付の 1 行に「前の木でも通った本数 / 命令の本数」を出し、 測れなかった命令があればその本数も添えます。 「記す」は結果を残すだけで受付の合否は変えず、 「止める」は通ってしまった命令か測れなかった命令が 1 本でもあれば既存の判定の 1 本で理由を 1 つ付けて断り、 便も記録の置き場も出来事の記録も作りません。 便を配る 1 周の判定では撃ちません。 「測らない」と名乗りの無い repo (本 repo を含む) は受付の結果が今までどおりで、 前の木は作りません。 利点は、 便を起こす前に実装役の費用を払わずに捕まえられ、 器の規則を増やさないことです。 代償は、 受付のたびに前の木を作って撃つ時間と memory と遮断器の待ちが載り、 それが同時本数の上限にも memory の枠にも数えられずに並びうること、 命令の単位でしか測れないこと、 専用道具でない命令と、 歯の名を絞らない専用道具の命令と、 確かめられずに撃った新しい部品や置き場を名指す命令は測れないに写ること、 結果が受付の時点の前の状態のもので作業の木を切るときの前の状態とは違いうること、 撃つ間に他の作業が着地して前の状態が動くと全部が測れなかったになり、 「止める」では正当な作業も断られて受付の撃ち直しを待つこと、 便を配る 1 周は止める判定を見ずに便を起こすことです。
      利点: 消費側の「検証は base で RED になる歯」が、 消費側の道具を増やさず、 便を起こす前に器の記録と断りになる (DR1・CTX3)
      利点: 断るか記すだけかは宣言の 1 語で選び、 器の行も schema も event の種類も増えない (DR2)
      利点: rc で歯の有無と落ち方を弁別できる nextest の行だけを撃ち、 他の行と build の失敗・signal を測れないに写し、 撃たずに決める不在は語の全体を読み切れ、 members の glob でない項の dir の package に --test の target が無いと決まる行だけに限り、 読み切れない行と解けない構造の行は撃つので (撃たずに決めた不在が base で緑 (rc 0) の行を含まないのは、 cargo の差し替えの無い木で、 読み切れる行に限ることで成り立つ)、 測れない周が緑にも落ちたにも倒れず、 deny は測れない周を断る側に倒す (DR3)
      利点: 撃つ口は gate の 1 関数の再利用で、 deny の断りは judge の 1 本に在り preflight と受付が同じ断りを出し、 build は入口の lock に載らず、 key の無い宣言と unmeasured の結果は 1 字も変わらない (断りの先後の入れ替わりは除く・DR4)
      欠点: 受付を撃つたびに、 名乗った契約 1 本につき base の木の用意と検証行の実走 (Rust なら target の無い木での cold build) が 1 回載り、 preflight も同じ実走を撃つ。 実走は入口の lock と同時本数の上限 (pipe.max_live) より前で admission の枠の外に在り、 host の memory を上限にした箱で受付の数だけ同時に走りうる (gate の便の本数は max_live が抑えるのと非対称)。 1 行ごとに gate と同じ健康の遮断器を通るので、 host が重い周は受付がその待ちの分だけ延び、 待ちの上限を超えた行とそれ以後の行は測れないになる (deny では断られる)。 lock の中の断りで断られた受付を撃ち直すと実走も繰り返される
      欠点: 粒度は検証行の単位で、 1 本でも base で緑なら deny は断る。 既存の族の接頭辞・外形 snapshot の歯・回帰を守る既存の歯を名指す行は base で緑と数えられる (消費側は新しい接頭辞で書き、 回帰の歯を共通の検証に置く運用が要る)
      欠点: nextest の行でない行 (cargo test・clippy・他の言語の test 走者・script・filter 語を持たない cargo nextest run の行〔test target を丸ごと撃つ行〕・cargo nextest run で書き出さない行〔timeout や env の前置きを持つ行〕) と --no-tests=fail を持たない nextest の行は撃たずに測れないになり、 deny ではどちらも断られる。 事前判定で読み切れない行と解けない構造の行が base に無い crate か test target を名指すと、 撃たれて cargo が落ち、 測れないになる (新しい crate や target の歯の行は deny で断られる)。 glob の members を展開して解く形は、 行の読み手に Cargo の glob と exclude の規則を足すので採らない。 読み切れる条件は行の字面だけを見て、 受付は base の木の cargo の差し替え (.cargo の config の alias・rust-toolchain の toolchain の path など) を読まないので、 それで cargo か cargo nextest が差し替えられる周は測れない側に倒れない可能性が残り、 撃たずに不在と決めた行も差し替えた木で撃てば rc 0 になりうる (限界・alias も path も偽の cargo を指す木で rc 0 を実測)。 読み切れる行でも引数の誤りの行 (撃てば rc 96・rc 2) は撃たずに不在と決まりうる (rc 0 にはならず、 便の木の gate が落とす)。 cargo 以外の言語の消費側は detect で本数を読むだけになる
      欠点: 結果は受付で測った sha のもので、 受付の後の審査の段で main が進むと spawn が決める便の base と違う。 便が main を追随すると gate はやり直すが、 base の実走は受付の 1 回のまま測り直さない (違いは記録の sha と spawn の event の base の突き合わせで弁別できる)。 実走の間に land などで HEAD が動いた周は全行が測れないになり、 deny の repo では契約の中身に関わらず断られ、 便が続けて land する時間帯ほど起きやすい。 撃った行は lock の前に読んだ行のもので、 lock の中の judge が作業木から読み直す行とは、 その間に設計 doc が書き換わると違いうる。 時間の上限は無く、 止まった行は受付を止め続ける
      欠点: dispatch の候補の判定は base を撃たないので deny の断りを見ずに便を起こし、 受付で断られた bead は Launched の印で止まり release を待つ
    verdict: adopted
    reason: "宣言の任意 key entrance-flip の値を unmeasured (現行) に detect と deny を足した閉じた 3 語にする。 受付は上限の読み・材料の読み・上限との突き合わせを入口の lock の前へ移して 1 周に 1 回撃ち、 撃つ行を決める行の生成と表の検査も lock の前に撃ち、 lock の中の judge は突き合わせの結果 (有効値と名乗りの語) を借りて宣言を読み直さない (行は今までどおり作業木から 2 回読み直す)。 材料の読みの前に名乗りに依らず HEAD の sha を読み、 detect か deny を名乗った宣言では、 その sha の木を state dir の一時 dir に detach した worktree として用意して、 契約の検証行のうち nextest の行 (nextest_read の読み方で filter 語を持つ行・読み手は既存の 1 本のまま広げない・共通の検証は撃たない) だけを、 gate の契約の検証行と同じ健康の遮断器を 1 行ごとに通して同じ閉じ込めの 1 関数・同じ箱 (admission の札は取らない) で 1 本ずつ撃ち、 撃ち終えたら木を片付ける。 nextest の行でない行と --no-tests=fail を持たない nextest の行は撃たずに測れないとする。 語の全体を読み切れる行 (行の全体が ASCII の英数字と _-.:=/ と space だけ・-p と --test が space で区切った旗と値で丁度 1 つずつ・値は - で始まらない・他の旗は --no-tests=fail と -- の後ろの libtest の引数だけ・= の形の -p と --test は不可) で、 -p の名が sha の木の members の glob でない項の dir の package と逐語で一致し、 その dir に --test の target が無いと決まる行だけを撃たずに不在とし、 他の行 (-p の無い行・読み切れない行・root の package・[workspace] の無い単一 crate・glob の members・新しい crate を名指す行を含む) は既定の crate を当てずに撃つ (該当 0 本は nextest の rc 4 が不在を返す)。 撃った行は 0 = base で緑・4 = 不在・100 = 落ちた・他 (101・signal・-1 を含む) = 測れない に写し、 oom_kill が 1 以上の行と、 遮断器が閉じた行とそれ以後の行も測れないとする。 木を用意できない周・置き場の解けない preflight の周・実走の後に読み直した HEAD の sha が違う周は全行を測れないとする。 受付の 1 行と preflight の行に entrance=green-on-base:<本数>/<行数> (行数は契約の検証行の全本数・測れない行があれば unmeasurable:<本数> を添える) を出し、 通った周は run dir に測った sha と行ごとの 4 値・rc・秒の記録を残す。 detect は記すだけで受付を変えず、 deny は base で緑か測れない行が 1 本以上あれば judge の判定関数 1 本が typed な理由 1 つで断り、 便も run dir も event も作らない。 dispatch の候補の判定では撃たない。 unmeasured と key の無い宣言は現行のとおり (本 repo は撃たない)。"
  - id: "OPT2"
    name: "gate の段で検証行を base の木でも撃つ"
    text: |
      便の木が在る gate で、 便の base の sha の木を用意し同じ検証行を撃つ。
      （平易）検査の段 (作業の後の木がある時点) で、 前の状態の木を用意して同じ命令を撃つ案です。 受付に何も足さず、 記録が検査の記録 1 か所に揃い、 作業の木を切ったときの実際の前の状態を測れ、 検査をやり直すたびに測り直せる (作業が最新に追随した後の前の状態も測れる) うえ、 撃つ前の状態が作業の前の状態に固まっているので撃つ間に最新が進んでも結果を捨てず、 前の状態で撃つ実走が便の同時本数の上限の内に収まり、 受付の読む順を変えることも、 検査だけ撃つ口が一時の木を書くことも要らない利点はあります。 しかし前の状態が同じ commit なら、 歯の差分を重ねない純粋な前の木で撃つ答えは受付で撃った場合と同じです。 便を起こして実装役を動かした後に答えを得ることになり、 「止める」の断りも作業の木と席の費用を払ってからになります。 受付より新しい前の状態を測れるのは、 審査の間や追随で最新が進んだ周だけです。
      利点: 受付に何も足さず、 記録が gate の verify の記録 1 か所に揃う
      利点: spawn の時点の便の実際の base を測り、 再 gate のたびに測り直せるので、 追随で base が移った後の base も測れる。 撃つ sha が便の base に固まっているので、 撃つ間に main が進んでも結果を捨てない
      利点: base の実走が gate の便の本数の上限 (pipe.max_live) の内に収まり、 受付の読みを lock の前へ移すことも、 preflight が一時の木を書くことも要らない
      欠点: base の sha が同じなら純粋な base の木での結果は受付と同じで、 便を起こして実装役を動かした後に答えを得る (実装役の費用を払ってから断る・CTX3)。 受付より新しい base を測れるのは、 審査の段や追随で main が進んだ周だけである
      欠点: deny の断りが Gated FAIL になり、 便の木と席の費用を払ってから断る
    verdict: rejected
    reason: "便の木が在る gate で、 便の base の sha の木を用意し同じ検証行を撃つ。"
  - id: "OPT3"
    name: "本 repo の入口の flip (test 差分を base に重ねて測る) を器に内蔵し、 消費側にも配る"
    text: |
      ADR-1054 OPT3 と同じ。 xtask の flip を器の口にして消費側の gate でも撃つ。
      （平易）本 repo が持つ入口の検査 (テストの差分だけを前の状態に重ねて落ちることを確かめる) を器の中に取り込み、 消費側にも配る案です。 歯 1 本の単位で測れて本 repo と同じ検査になる利点はありますが、 規模が大きく、 上限の読み先や消費側の配置の前提の設計が要ります。 消費側が求めているのは命令そのものを前の状態で撃つことで、 差分の重ね合わせではありません。
      利点: 歯の単位で RED を測れ、 粒度が検証行より細かい
      利点: 本 repo と消費側が同じ検査を持つ
      欠点: 規模が大きく、 上限の読み先と消費側の crate 配置の前提の設計が要る (ADR-1054 OPT3 が挙げた理由のうち時限でないものは今も同じ)
      欠点: 消費側が求める形は検証行そのものを base で撃つことで、 差分の重ね合わせではない (CTX1)
    verdict: rejected
    reason: "ADR-1054 OPT3 と同じ。 xtask の flip を器の口にして消費側の gate でも撃つ。"
  - id: "OPT4"
    name: "lens (AI の審査) に「この歯は base でも緑か」を判定させる"
    text: |
      gate の審査の材料に base の要約を足し、 lens が歯の空虚性を読む。
      （平易）AI の審査に「この歯は前の状態でも通るか」を読ませる案です。 器の検査の段に何も足さず、 歯の意味まで読める利点はありますが、 「前の状態で通るか」は実際に撃てば決まる計算の判断で、 意味の判断ではありません。 読んだ結果は毎回同じにならず、 記録にも同じ形で残りません。
      利点: 器の検証の段に何も足さず、 審査の材料だけで済む
      利点: 歯の意味 (何を測る歯か) まで読める
      欠点: 「base で緑か」は実走で決まる計算できる判断で、 意味の判断ではない (ADR-1053 の仕分け・計算できる判断は code)
      欠点: 読みの結果は再現せず、 記録にも同じ形で残らない (C10)
    verdict: rejected
    reason: "gate の審査の材料に base の要約を足し、 lens が歯の空虚性を読む。"
  - id: "OPT5"
    name: "何もしない (unmeasured の名乗りのまま)"
    text: |
      ADR-1054 の形のまま、 消費側の入口の RED（歯が最初は落ちること） は測らない。
      （平易）何もせず、 「測らない」の名乗りのままにする案です。 器の変更は 0 ですが、 消費側の台帳の決まり (歯は前の状態で落ちる) が機械にならず、 前の状態でも通る歯が通り続けます。 測らなかったことは残りますが、 測った結果はどこにも残りません。
      利点: 器の変更が 0
      欠点: 消費側の台帳の規則 (検証は base で RED になる歯) が機械にならず、 base でも緑の歯が通り続ける (CTX1)
      欠点: 測らなかったことは判定行に残るが、 測った結果はどこにも残らない
    verdict: rejected
    reason: "ADR-1054 の形のまま、 消費側の入口の RED（歯が最初は落ちること） は測らない。"
