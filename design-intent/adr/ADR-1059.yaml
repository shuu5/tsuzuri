# 判断の記録 ADR-1059 — 器 scribe2 の判断の記録 ADR-0059 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1059
title: "消費側の契約の検証行を受付で base の木でも撃ち、 base で緑のままの行の本数を記録に残す (断るか記すだけかは宣言の名乗りの語が選ぶ・ADR-1054 の値の集合を部分 supersede)"
status: accepted
date: 2026-09-24
context: |
  ADR-1054 は、 入口の flip (test 差分だけを base に当てて RED を確かめる検査) を撃つ手段を持たない Rust の消費側が、 宣言の任意 key で「測らない」と名乗れる欄を開けた。 名乗った消費側の便は入口の RED を測らないまま進む (ADR-1054 CSQ-N1)。 本 ADR は、 消費側の契約の検証行そのものを受付の段で base の木でも撃ち、 base でも緑のままの行の本数を記録に残す形と、 断るか記すだけかを宣言の名乗りの語が選ぶ形を決める。
  なぜこの判断が要るのかを、 実測と器の中身から説明します。 消費側 1 号で、 作業の前の状態でも通ってしまう歯を持つ作業が検査を通りました。 器の受付は host 全体の鍵を取ってから材料を読み、 判定して、 通った作業にだけ記録の置き場と出来事の記録を作ります。 断る周はどちらも作りません。 判定は受付・便を作らずに検査だけ撃つ口・便を配る 1 周の 3 か所が共有する 1 本です。 作業の前の状態 (base) は受付では決まらず、 受付の後の審査を経て作業の木を切るときに読み直されます。 検査の段は作業の後の木で、 歯の命令を 1 本ごとに host の混み具合の遮断器に通してから囲いの中で撃ち、 その囲いは命令の終わり方を数字 (rc) で返します。 歯の命令を前の状態で撃ったときの答えは、 前の状態が同じ commit なら受付で撃っても検査の段で撃っても同じなので、 実装役を動かす前の受付で撃つのが筋です。 消費側は「base で撃つ検査は要るか」に「要る」と答え、 止めるか記すだけかは宣言で選びたいと言っています。
  CTX1 実測 — 消費側（器を使う別の repo） 1 号で、 base でも緑の歯（違反を機械で止める検査）が gate を通った
  消費側 1 号の席の報告 (2026-09-22・要旨) — 台帳の規則は「検証は base で RED になる歯」だが、 器の gate は便の木で検証行が緑になることしか見ない。 base (便が分かれた元の commit の木) でも緑のままの歯を持つ便が gate を通った実例が在る。 消費側は xtask (本 repo だけが持つ開発用の道具) を持たないので、 本 repo の入口の flip をそのまま撃つことはできない。 消費側が求める形は「契約の検証行そのものを base の木（作業の前の状態の木）で撃つ」で、 test 差分を base に重ねて測る本 repo の flip とは別の形である (ADR-1054 CTX3)。
  CTX2 現物 — 受付・preflight・gate・dispatch・閉じ込めと base の所在
  受付（便にする前の検査）は host 全体の入口の lock (ADR-1019 §2.1) を取ってから、 上限の読み・材料の読み (base の tracked file の走査と宣言の読み・1 周に 1 回)・行の生成と表の検査・判定・作成を撃ち (judge は設計 doc の行を作業木から write-set の弁別と行の事実で 2 回読む)、 通った周だけ run dir を作って event を記す。 断る周は run dir も event も作らない。 判定 (judge) は受付・preflight・dispatch の候補の判定が共有する 1 本で (C2)、 その先頭の上限との突き合わせ (freeze) は HEAD の commit の宣言を読み直す。 材料は sha を持たない (tracked は index から、 本文は作業木から読む)。 preflight は judge を run dir も event も作らずに撃ち、 置き場が解けない周も通る。 受付と preflight は --repo に渡した木 (dispatch が起こす受付では anchor) の HEAD を読むが、 便の base は受付では決まらず、 受付の後の契約の審査 (lens) を経た spawn の初回の周が対象 repo の HEAD を読み直して決め、 event に記す。 gate は便の木で契約の検証行（歯を撃つ命令）を 1 行ごとに器の健康の遮断器 (health::pass・待ちの上限を超えた行とそれ以後の行は撃たずに閉じる) に通してから閉じ込めの 1 関数で 1 本ずつ撃ち、 行ごとの rc と秒を verify の記録に残す。 その関数は行を sh -c で撃ち、 子が signal で死ぬと rc は 128+N、 無い command は 127、 起動できない周は -1 になり、 箱の oom_kill の数を別に返す。 契約の検証行は穴を持たず、 admission (ADR-1021・host の memory と CPU の枠) の札を取らずに host の memory から予備を引いた箱で撃たれる (札を取るのは {jobs} を持つ共通の検証と検出線だけ)。 gate の便の本数は受付の同時本数の上限 (pipe.max_live) が抑える。 時間の上限は持たない。 便が main を追随する周は base が新しい sha に移り、 land は対象 repo の main を update-ref で進める。 closure の nextest の行の読み (nextest_read) は cargo nextest run で書き出し filter 語を持つ行だけを読み、 -p の無い行の crate を器自身の crate 名に倒す (本 repo の閉包のための既定値)。 ADR-1054 の名乗り (宣言の任意 key entrance-flip・値は unmeasured の 1 語) は受付と契約表の検査の NoEntranceRed の断りを外し、 契約表の検査の判定行（結果を 1 行で出す口）に entrance=unmeasured を出す。
  CTX3 何を捕まえるか — base の sha が同じなら結果は受付でも gate でも同じ
  歯 (test) は便の実装役が書くので、 base の木には便の新しい歯が無い。 検証行を base の木で撃つと、 base に既に在る通る歯に当たる行は rc 0 で「base で緑」になる。 消費側の実例 (CTX1) はこれである＝検証行が base の既存の緑の歯で満たされ、 便の実装が無くても通る行。 新しい歯だけを名指す行は、 歯が base に既に在る test binary に入るなら該当 0 本 (--no-tests=fail の nextest の rc 4)、 test target や crate ごと新しいなら base に無い target の断りになり、 どちらも「base で緑」ではない。 rc で歯の有無と落ち方を弁別できるのは nextest の行だけで (0 = 通った・4 = 該当 0 本・100 = 歯が落ちた・101 = build の失敗)、 cargo test は該当 0 本でも rc 0 を返し、 他の言語の test 走者や script は build・収集・file の不在も 1 や 2 などの rc で返す。 test 差分を base に重ねない限り、 base の sha が同じならこの結果は便の木が在る gate の段でも変わらない。 ただし便の base は受付の後の spawn で読み直されるので、 審査の段の間に main が進めば、 受付で測った base と便の base は違う。 それでも測る段は、 便を起こす前で実装役の費用を払わない受付が適し、 その費用は受付を撃つたびに base の実走 1 回である (dispatch の候補の判定には載せない・build は入口の lock の外で撃つ)。 便の木に歯が在る段で歯の単位まで測るのは入口の flip (差分の重ね合わせ・ADR-1054 OPT3) の領分である。
  CTX4 消費側の要望と憲法の向き
  消費側 1 号の席は「base で撃つ検査は要るか」に「要る」と答えた (2026-09-23・要旨)。 求める形は、 契約の検証行を base の木で撃ち、 1 本も落ちなければ記録に残し、 断るか通すかは消費側の宣言 (.vessel.toml の key) で選べること。 この形は契約の単位 (全行が base で緑のときだけ RED 無しと記す) で、 本 ADR は行の単位 (1 本でも base で緑なら数える) を採る (理由は decision)。 ADR-1010 §2.1 は宣言が値を持ち器の行は上限だけを持つと決め、 ADR-1047 / ADR-1054 は任意 key を宣言の側に置く分担を決めた。 断るか記すだけかを宣言の 1 語で選ぶ形はこの分担の延長で、 器の rules 行の追加でも憲法 C12.4 の昇格 (変異の生存の検出線を裁定 id で deny にする) でもない。 C10 は実測値を型で分け、 測っていない値を実測として通さない。 C2 は同じ仕事の口を 2 つ作らない。
  （選択肢を測るものさし）この判断を評価する 4 本のものさしです。 消費側の歯の命令そのものを前の状態で撃つこと、 止めるか記すだけかを宣言の側が選ぶこと、 終わり方の数字で歯の有無と落ち方を見分けられる命令だけを撃って結果の全部を 4 通りに写し、 測れない周を成功に倒さないこと、 そして命令を撃つ口は検査の段と同じ 1 つを使い、 止める判定は既存の判定の 1 本に置き、 便を配る 1 周では撃たず、 重い build を受付の鍵の中に入れず、 本 repo 自身の宣言と入口の検査と名乗りの無い repo の受付の結果は 1 字も変えないことです。
  DR1｜消費側の契約の検証行そのものを base の木で撃つ (test 差分を重ねる flip は内蔵しない・ADR-1054 OPT3 の規模と設計の前提の重さは今も同じ) CTX1・ADR-1054 OPT3 / supersession
  DR2｜断るか記すだけかは宣言の側が持ち、 器の規則の行は増やさない (宣言が値を持ち器は上限だけ) CTX4・ADR-1010 §2.1 / ADR-1047 / ADR-1054
  DR3｜測った結果は残し、 測れない周を成功に倒さない (rc で歯の有無と落ち方を弁別できる nextest の行だけを撃って rc の全域を base で緑・不在・落ちた・測れない の 4 値に写し、 他の行は撃たずに測れないとする) CTX2・CTX3・憲法 C10
  DR4｜検証行を撃つ口は gate と同じ 1 関数、 deny の判定は judge の 1 本に置き、 dispatch の候補の判定では撃たず、 build を入口の lock の中に入れず、 本 repo の宣言・入口の flip・key の無い宣言の受付の結果と 1 行は 1 字も変えない (lock の前へ移す読みによる断りの先後の入れ替わりは除く) CTX2・憲法 C2・ADR-1019 §2.1・ADR-1054 decision (key の無い宣言は現行・本 repo は key を持たない)
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 宣言 file の 1 語 (測らない / 記す / 止める) で消費側が選び、 記すか止めるかを選んだ作業では、 受付が鍵を取る前に材料を読んで表と許す命令を検査し、 その時点の前の状態の木を一時的に用意して、 テストの専用道具 (nextest) の命令だけを検査の段と同じ混み具合の遮断器に通して 1 本ずつ撃ち、 結果を 4 通り (前の木でも通った・該当する歯が無い・落ちた・測れなかった) に写して、 通った本数を受付の 1 行に出します。 専用道具でない命令と、 歯の名を絞らない命令と歯が無いときに落ちる旗を持たない専用道具の命令は撃たずに測れなかったとし、 撃たずに「該当する歯が無い」とするのは、 命令の全体を読み切れて、 部品の一覧にそのまま書かれた部品のテストの置き場を名指し、 それが前の木に無いと確かめられた命令だけで、 確かめられない命令は撃ちます。 止めるを選んだ場合は、 通った命令か測れなかった命令が 1 本でもあれば既存の判定の 1 本で断り、 便も記録の置き場も出来事の記録も作らず、 理由を断りの行と便を作らない検査の行に出します。
  採用 — OPT1
  宣言の任意 key entrance-flip の値 SHALL unmeasured・detect・deny の閉じた 3 語とし、 3 語とも ADR-1054 のとおり NoEntranceRed で断らず、 入口の flip の行との同居は矛盾として断る。 受付 SHALL 上限の読み・材料の読み・上限との突き合わせ (judge の freeze と同じ 1 本) を lock の前に 1 周に 1 回撃ち、 撃つ行を決める行の生成と表の検査も lock の前に撃ち、 lock の中の judge SHALL 突き合わせの結果 (有効値と名乗りの語) を借りて宣言を読み直さない (行は作業木から 2 回読み直す)。 受付と preflight SHALL 名乗りに依らず材料の読みの前に対象 repo の HEAD の sha を読み (出力は変えない)、 detect か deny を名乗った宣言の契約について、 その sha の木を state dir に detach した一時の worktree として用意し、 突き合わせを通った検証行のうち nextest の行 (nextest_read の行の選び方で filter 語を持つ行・読み手は 1 本〔C2〕) だけを、 gate の契約の検証行と同じ遮断器 (health::pass・1 行ごと)・閉じ込めの 1 関数・箱 (admission の札は取らない・時間の上限は持たない) で 1 本ずつ撃ち、 撃ち終えたら木を片付ける。 nextest の行でない行と --no-tests=fail (= で結んだ 1 語) を持たない nextest の行は撃たずに「測れない」とする。 撃たずに決める「不在」は、 読み切れる行 (行の全体が ASCII の英数字と _-.:=/ と space だけ・-p と --test が space で区切った旗と値で丁度 1 つずつ・値は - で始まらない・他の旗は --no-tests=fail と -- の後ろの libtest の引数だけ) で、 -p の名が sha の木の members の glob でない項の [package] の name と逐語で一致し、 その項の dir に --test の target (tests/<名>.rs・tests/<名>/main.rs・[[test]] の name・Cargo.toml は TOML で読み tests は symlink を辿る) が無いと決まる行だけとする (材料の tracked は借りない)。 他の行 SHALL 既定の crate を当てずに撃たれる。 撃った行 SHALL rc 0 = 「base で緑」・4 = 「不在」・100 = 「落ちた」・他 (101・signal・-1 を含む) = 「測れない」に写り、 oom_kill が 1 以上の行と、 遮断器が閉じた行とそれ以後の行は「測れない」とする。 木を用意できない周と置き場の解けない preflight の周は撃たずに、 実走の後の HEAD の sha が違う周は結果を捨てて、 全行を「測れない」とする。 受付の 1 行と preflight の行 SHALL entrance=green-on-base:<本数>/<行数> (行数は検証行の全本数) を持ち、 測れない行があれば unmeasurable:<本数> を添える。 通った周の受付 SHALL run dir に測った sha と行ごとの 4 値・rc・秒の記録を残す。 detect の契約 SHALL 受付の結果を変えない。 deny の契約 SHALL base で緑の行（元の木でも通ってしまう命令）か測れない行が 1 本以上あれば、 judge の判定関数 1 本の typed な理由 1 つ (本数と行ごとの 4 値) で断られ、 便・run dir・event SHALL NOT 作られず、 理由は受付の断りの行と preflight の refuse= (rc 1) に出る。 dispatch の候補の判定 SHALL NOT base の実走を撃たず、 結果を持たない judge は deny の断りを立てない。 unmeasured と key の無い宣言 SHALL base の木を用意せず、 受付の結果と 1 行も記録も変えない (断りの先後の入れ替わりは除く)。 本 repo の宣言 SHALL key を持たない。 契約表の検査の判定行の entrance= SHALL 名乗りの語を写す。 器 SHALL NOT test 差分の重ね合わせと歯の中身の読みを base の木で行う。
  （平易）宣言 file の 1 語は「測らない」「記す」「止める」の 3 つになります。 3 語とも先の記録のとおり入口の行の欠けでは断られず、 入口の検査の行と同居する矛盾は断られます。 受付は上限と材料の読みと許す命令の検査を鍵の前に 1 回撃ち、 撃つ命令を決める表の検査も鍵の前に撃ち、 鍵の中の判定はその結果を借りて宣言を読み直しません (表の行は鍵の中で 2 回読み直します)。 受付と便を作らずに検査だけ撃つ口は、 名乗りに関わらず材料を読む前の時点の前の状態 (commit) を控え、 「記す」か「止める」を名乗った消費側の作業ではその木を一時的に用意し、 検査を通った命令のうちテストの専用道具 (nextest) の命令だけを、 検査の段と同じ混み具合の遮断器に 1 本ごとに通して同じ口と囲い (memory の札は取らず、 時間の上限も持ちません) で 1 本ずつ撃ち、 撃ち終えたら木を片付けます。 専用道具でない命令と、 歯の名を絞らない専用道具の命令と、 歯が無いときに落ちる旗を持たない専用道具の命令は撃たずに「測れなかった」とします。 撃たずに「該当する歯が無い」とするのは、 命令の全体を読み切れて (命令の全体が半角の英数字と少しの記号 (_ - . : = /) と半角の空白だけで書かれ、 部品と置き場の名指しが半角の空白で区切って 1 つずつで、 その名が - で始まらず、 歯が無ければ落ちる旗と、 歯の名のあとに添える試験の引数のほかに旗を持たない)、 部品が前の木の部品の一覧にそのまま書かれていて、 置き場だけが無いと確かめられた専用道具の命令だけです。 ほかの専用道具の命令は撃ち、 歯が 0 本なら終わり方の数字 4 で「該当する歯が無い」になります。 撃った命令は、 終わり方の数字が 0 なら「通ってしまった」、 4 なら「該当する歯が無い」、 100 なら「落ちた」、 それ以外なら「測れなかった」に写し、 memory が溢れた命令と、 遮断器の待ちが上限を超えた命令とそれ以後の命令も「測れなかった」とします。 木を用意できない周と置き場の無い検査だけの周は撃たずに、 撃った後に前の状態が動いていた周は結果を捨てて、 全部を「測れなかった」とします。 受付の 1 行と検査だけの口の行には「前の木でも通った本数 / 命令の全本数」を出し (測れなかった命令があればその本数も添えます)、 通った作業では記録の置き場に控えた commit と命令ごとの結果と rc と秒を残します。 「記す」は合否を変えず、 「止める」は通ってしまった命令か測れなかった命令が 1 本でもあれば既存の判定の 1 本が理由を 1 つ付けて断り、 便も記録の置き場も出来事の記録も作らず、 理由は受付の断りの行と検査だけの口の断りの行に出ます。 便を配る 1 周の判定では撃たず、 撃っていない判定は止める断りを立てません。 「測らない」と名乗りの無い repo は前の木を作らず、 受付の結果も 1 行も記録も変わらず (読みを鍵の前へ移すことで断りの順が入れ替わる周を除きます)、 本 repo は名乗りを持ちません。 契約表の検査の結果の 1 行には名乗りの語をそのまま写します。 器は、 テストの差分の重ね合わせと歯の中身の読みを前の木では行いません。
  （理由）捕まえたいのは「前の状態でも通ってしまう歯の命令」で、 それは前の状態に既にある通る歯に命令が当たっている場合です。 テストの専用道具 (nextest) の命令なら、 新しい歯だけを名指す命令は前の木で「該当する歯が無い」か置き場ごと無いので、 通ってしまった命令と区別できます。 歯の差分を重ねない限り、 前の状態が同じ commit ならこの答えは検査の段で撃っても受付で撃っても同じなので、 実装役を動かす前の受付で撃ちます。 作業の木を切るときの前の状態は受付の後に読み直されるので違いうることは、 控えた commit を記録に残して見分けられるようにし、 代償として引き受けます。 重い build を受付の鍵の中に入れると他の受付を build の間ずっと止めるので、 材料の読みと表の検査を鍵の前へ移し、 許す命令の検査を通った命令だけを鍵の前に撃ちます (許されていない命令を host で撃たないため)。 止める判定を既存の判定の 1 本に置くのは、 受付と便を作らない検査の口が同じ断りを出すためです (同じ仕事の口を 2 つ作らない)。 専用道具の命令だけを撃つのは、 それだけが終わり方の数字で歯の有無と落ち方を分けて返すからです。 他の命令は build や収集の失敗も歯が落ちたのと同じ数字で返し、 該当する歯が 0 本でも 0 を返すものがあるので、 撃てば測れなかった命令を「落ちた」や「通ってしまった」に数えることになります。 撃たずに「該当する歯が無い」と決めるのを、 命令の全体を読み切れて部品の一覧から確かめられる命令だけに限り、 それ以外は撃って専用道具自身の答えに任せるのは、 撃たずに決めた答えが前の木でも通ってしまう命令を見逃さないためで、 この性質は、 Rust の道具 (cargo) を repo の設定で差し替えていない木で、 読み切れる命令に限ることで成り立ちます (読み切れない命令を撃たずに決めないためです)。 撃てば引数の誤りで測れなかったになる命令が撃たずに「該当する歯が無い」と決まることは残りますが、 それは通ってしまう命令ではなく、 検査の段も同じ誤りで落とします。 撃てるのは歯の名を絞る語と「歯が無ければ落ちる」旗を持つ専用道具の命令だけで、 それ以外は測れなかったとします。 撃った後に前の状態が動いていた周の結果を捨てるのは、 撃った命令と名乗りの語は撃った木から読んだものではなく、 動いた後ではそれらと対応しない木の実測を、 便の前の状態を測ったことにして通さないためです。 検査の段で撃つ案は、 作業の木の実際の前の状態を測れ、 撃つ間に最新が進んでも結果を捨てない利点はあるものの、 実装役を動かした後に答えを得ることになるので退けました。 本 repo の入口の検査 (差分の重ね合わせ) を取り込む案は規模が大きいうえに消費側が求める形と違い、 AI の審査に読ませる案は実際に撃てば決まることを読みで代えることになり結果が毎回同じ形で残らないので、 どちらも退けました。 何もしない案は測った結果がどこにも残りません。 消費側は「1 本も落ちなければ記す」という契約の単位の形を求めましたが、 台帳の決まりは命令ごとに前の状態で落ちることを求め、 契約の単位にすると新しい歯の命令 1 本が前の木でも通ってしまう命令を隠すので、 命令の単位を採ります。 本数と命令の本数を並べて出すので、 記すだけの消費側は契約の単位でも読めます。 止めるか記すだけかを宣言の 1 語に委ねるのは、 repo ごとの値は宣言が持ち器は上限だけを持つという分担 (ADR-1010 / ADR-1047 / ADR-1054) を守るためです。 測れなかった命令は「落ちた」にも「通った」にも倒さず、 「止める」ではそれを断る側に倒します。 「測らない」の欄を残すのは、 先の記録 (ADR-1054) が測らない消費側のためにその欄を保つと約束したからです。
