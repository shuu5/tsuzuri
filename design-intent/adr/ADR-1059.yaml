  器の案の章の要約: 候補を 5 つ並べます。 名乗りの語を 3 語に広げて受付で前の状態でも撃つ案、 検査の段で撃つ案、 本 repo の入口の検査を器に内蔵する案、 AI の審査に読ませる案、 何もしない案です。 却下した 4 案も利点を持ち、 それを含めて秤に掛けます。
  器の専門語の説明: 本文に出てくる 10 の専門語を、 やさしい言葉で説明します。
  ・入口の RED（entrance RED）: 契約の検証行 (歯を撃つ命令) を便の前の木 (base) で撃つと「不在」か「落ちた」に写ること (base で緑でも測れないでもないこと・写しは decision)。 台帳の規則「検証は base で RED になる歯」の機械の形。 本 repo では入口の flip が測り、 名乗った消費側では受付が nextest の検証行を base の木で撃って測る。
  ・base の木（base tree）: base (対象 repo の HEAD・受付と preflight では --repo に渡した木〔dispatch が起こす受付では anchor〕の HEAD) の sha を checkout した作業木。 本 ADR では受付と preflight が、 材料の読みの前に読んだ HEAD の sha の木を state dir の一時 dir に detach した worktree として用意し、 検証行を撃ち終えたら片付ける。 便の base (spawn が HEAD を読み直して決める) とは違いうる。
  ・base で緑の行（green-on-base line）: 契約の nextest の検証行を base の木で撃って rc 0 になった行。 該当の歯が無い周 (--no-tests=fail の nextest の rc 4・語の全体を読み切れ、 members の glob でない項の dir の package に -p と --test で名指した test target が base の木で無いと決まる行) は「不在」で、 これには含めない。 nextest の行でない行 (filter 語を持たない行と前置きのある行を含む) と --no-tests=fail を持たない nextest の行は rc 0 でも歯の有無を弁別できないので撃たずに「測れない」とする。 受付の 1 行の本数はこの行を数え、 deny の名乗りでは 1 本以上 (測れない行も同じ) で契約が断られる。
  ・判定行（judgement line）: 検査の結果を 1 行で出す形 (契約表の検査の docs= rows= findings= や entrance= の欄・受付の 1 行・preflight の行)。 本 ADR は受付の 1 行と preflight の行に entrance=green-on-base:<本数>/<行数> の欄を足す。
  ・名乗りの語（declared word）: 宣言の任意 key entrance-flip の値。 ADR-1054 の unmeasured に本 ADR が detect と deny を足し、 閉じた 3 語とする。 他の語・空・配列は断る。
  ・受付（intake）: 契約を読んで便を作る前に、 宣言・契約表・閉包などを検査し、 通れば run dir と event を作る段 (断る周は run dir も event も作らない)。 判定と作成を host 全体の入口の lock の中で撃つ。 本 ADR は上限の読み・材料の読み・表の検査・上限との突き合わせを lock の前へ移し、 名乗った契約の nextest の検証行を lock の前に base の木で撃つ。 preflight は同じ判定を便を作らずに撃つ口。
  ・契約の検証行（contract verify line）: 契約が持つ、 歯を撃つ command の 1 行。 gate は便の木で撃ち、 本 ADR では名乗った契約の受付が base の木でも撃つ。 宣言の共通の検証 (common-verify・検証行の箱が起こす側) は含まない。
  ・vessel 宣言（vessel declaration）: repo の根に置く .vessel.toml (宣言 file)。 許す command・共通の検証行・path の種別・名乗りなどを repo の側が持つ (ADR-1010 / ADR-1047 / ADR-1054)。
  ・消費側（consumer repo）: scribe2 の binary を導入して便を回す別の repo。 本 repo の xtask を持たない。 1 号は 2026-09-22 に受付を通った。
  ・歯（test (tooth)）: 違反を機械が止める仕組みのうち test / lint / CI gate を指す (憲法 C12・Rust の 1 framework)。 契約の検証行が撃つ対象で、 本 ADR で問題にするのは便の実装役が書く test。
