retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「便」は器が自動で進める 1 つの作業、 「消費側」は器を使う別の repo、 「台帳」は作業の記録簿、 「宣言 file」は repo が器に渡す設定 file (.vessel.toml) のことです。 題の「検証行」は歯 (自動テスト) を撃つ命令、 「受付」は作業を便にする前の検査です。 台帳の決まりでは、 歯は作業の前の状態 (base) では落ち、 作業の後で通るはずです。 ところが器の検査の段は、 作業の後で通ることしか見ていません。 先の記録 (ADR-1054) は、 それを確かめる道具を持たない消費側が「測らない」と名乗れる欄を開けました。 この記録は、 宣言 file に「記す」か「止める」と書いた消費側の作業について、 器が受付の時点で歯の命令のうちテストの専用道具 (nextest) の命令を作業の前の状態でも実際に撃ち (ほかの命令と、 歯の名を絞らない命令と歯が無いときに落ちる旗を持たない命令は撃たずに測れなかったと記し、 該当する歯が無いと確かめられる命令も撃ちません)、 前の状態でも通ってしまう命令の本数を残す形を決めます。 止めるか記すだけかは、 消費側が宣言 file の 1 語で選びます。 「測らない」のままの消費側と、 名乗りの無い repo (本 repo を含む) の受付の結果は今までどおりです (読む順を入れ替えるので、 断りの理由の出る順が入れ替わる周だけは除きます)。
approval:
  who: 持ち主
  date: 2026-09-24
  ruling: "t3-hub.74.60.1:20261004T0113Z-1（取り込みの裁定・器の記録は器の台帳の裁定 id を名指さない）"
  verbatim: "tsuzuri の台帳 t3-hub.74.60.1 の notes に在る（この file に写さない・器の記録は器の台帳の裁定 id を名指さない）"
  surface: R-8
consequences:
  - "この判断で良くなることと、 代わりに引き受けることです。 前の状態でも通ってしまう命令が便を起こす前に記録に残り、 止める選択もできます。 器の規則も宣言の形も出来事の種類も増えず、 本 repo 自身の宣言と入口の検査は変わりません。 代わりに引き受けることは 8 つです。 受付を撃つたびに前の状態の木を作って撃つ時間と disk と memory が載り、 同時本数の上限にも memory の枠にも数えられずに並び、 混み具合の遮断器の待ちも載りうること、 粗さが命令の単位であること、 選択が repo 単位であること、 結果が受付の時点の前の状態のもので、 作業の木を切るときの前の状態とは違いうることと、 撃つ間に前の状態が動くと全部が測れなかったになり、 止めるでは正当な作業も断られること、 記録と断りの理由の形が 1 つずつ増えること、 専用道具でない命令と、 歯の名を絞らない専用道具の命令と、 確かめられずに撃った新しい部品や置き場を名指す命令は測れないに写ること、 便を配る 1 周は止める判定を見ずに便を起こすこと、 時間の上限が無いことです。"
  - "良い結果: 名乗った消費側の契約で、 base でも緑のままの検証行が便を起こす前に記録に残り、 deny を名乗れば受付で断られ、 断りの理由は受付の断りの行と preflight の refuse= に同じ形で出る"
  - "良い結果: 器の規則の行も宣言の schema も event の種類も増えず、 本 repo の宣言・入口の flip・key の無い宣言の受付の結果は不変"
  - "良い結果: test 差分の重ね合わせを内蔵せずに、 消費側の「検証は base で RED になる歯」が便の前の機械の検査になる"
  - "代償: 受付を撃つたびに、 名乗った契約 1 本につき base の木の用意と検証行の実走 (Rust なら target の無い木での cold build) が 1 回載り、 preflight も同じ実走を撃つ。 実走は入口の lock と同時本数の上限 (pipe.max_live) より前で admission の枠の外に在り、 host の memory を上限にした箱で受付の数だけ同時に走りうる (gate の便の本数は max_live が抑えるのと非対称)。 1 行ごとに gate と同じ健康の遮断器を通るので、 host が重い周は受付がその待ちの分だけ延び、 待ちの上限を超えた行とそれ以後の行は測れないになる (deny では断られる)。 lock の中の断りで断られた受付を撃ち直すと実走も繰り返される"
  - "代償: 粒度は検証行の単位で、 1 本でも base で緑なら deny は断る (契約の単位ではない)。 既存の族の接頭辞・外形 snapshot の歯・回帰を守る既存の歯を名指す行は base で緑と数えられ、 消費側は新しい接頭辞で書き回帰の歯を共通の検証に置く運用が要る"
  - "代償: 名乗りは repo 単位で、 契約ごとに detect と deny を選ぶ形は持たない (ADR-1054 CSQ-N3 と同じ)"
  - "代償: 結果は受付で測った sha のもので、 受付の後の審査の段で main が進むと spawn が決める便の base と違い、 追随で gate はやり直しても base の実走は受付の 1 回のまま測り直さない。 違いは記録の sha と spawn の event の base を突き合わせれば弁別できる。 実走の間に land などで HEAD が動いた周は、 撃った行と名乗りの語が撃った sha の木から読んだものでないので対応が崩れ、 全行が測れないになり、 deny の repo では契約の中身に関わらず正当な契約も断られ (detect の repo では全行が unmeasurable と記される)、 便が続けて land する時間帯ほど起きやすい。 救済は受付の撃ち直しだけで、 dispatch が起こした bead は Launched の印で止まるので、 release の印 (FR1068 の既存の介入) の後の契機の周に撃ち直される。 撃った行は lock の前に読んだ行のもので、 lock の中の judge が作業木から 2 回読み直す行とは、 その間に設計 doc が書き換わると違いうる"
  - "代償: run dir の記録の形が 1 つ増え (受付の base 実走の記録・測った sha を持つ)、 受付の断りの理由の形も 1 つ増える (event の種類は増えない)。 行の読み手は既存の nextest_read の 1 本のまま広げないので closure の閉包の読みは変わらず、 = で結んだ -p・--test を持つ行は読み切れない行として撃つ。 読み手はその形を跨版で固定して持つ"
  - "代償: nextest の行でない行 (cargo test・clippy・他の言語の test 走者・base に無い script を撃つ行・filter 語を持たない cargo nextest run の行〔新しい test target を丸ごと撃つ行を含む〕・cargo nextest run で書き出さない行〔timeout や env の前置きを持つ行〕) と --no-tests=fail (= で結んだ 1 語) を持たない nextest の行は撃たずに測れないになる。 事前判定で読み切れない行と解けない構造 (members の glob でない項の dir の package でない crate・root の package・[workspace] の無い単一 crate・glob の members) の行が base に無い crate か test target を名指すと、 撃たれて cargo が落ちて測れないになる (glob の members を展開して解く形は、 読み手に Cargo の glob と exclude の規則を足すので採らない)。 読み切れる条件は行の字面だけを見て base の木の cargo の差し替え (.cargo の config の alias・rust-toolchain の toolchain の path など) を読まないので、 それで cargo か cargo nextest が差し替えられる周は測れない側に倒れない可能性が残り、 撃たずに不在と決めた行も差し替えた木で撃てば rc 0 になりうる (alias も path も偽の cargo を指す木で rc 0 を実測)。 読み切れる行でも、 撃てば引数の誤り (rc 96・rc 2) で測れないになる行は撃たずに不在と決まりうるが、 rc 0 にはならず、 便の木の gate も同じ誤りで落とす (限界)。 deny ではどれも断られ、 消費側は検証行を --no-tests=fail 付きで filter 語を持つ nextest の行で書く運用が要り、 cargo 以外の言語の消費側は detect で本数を読むだけになる"
  - "代償: dispatch の候補の判定は base を撃たないので deny の断りを見ずに便を起こし、 受付で断られた bead は Launched の印で止まり release を待つ"
  - "代償: base の実走は時間の上限を持たず、 止まった行はその受付を止め続ける (lock の外なので他の受付は止めない)。 preflight は置き場と対象 repo の .git に一時の木を書くようになり、 branch の木で撃てば受付と結果が違いうる。 置き場の無い preflight は全行が測れないになり、 deny の repo では契約の中身に関わらず断られる"
