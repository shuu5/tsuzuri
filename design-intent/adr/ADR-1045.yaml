  器の承認の欄: 設計 (planner)・planner・2026-09-18 起票 (planner 席の調査 role-injection §1〜§5 と prose-root-cause §1〜§4・拘束する constitution の版 0.4.6・C17 は ADR-1044 で proposed)。 発効は SRS の改訂 (/folio-architect) と rules 行 role.orchestrator の裁定 id (C5) の後・作成
  器の案の章の要約: 候補を 5 つ並べます。席を orchestrator 1 つにして自律機能を消し dispatcher に起動と着地を移す案、2 役割を残して文だけ削る案、作業記憶を器の機構でなく文書として残す案、役割を project の作法 file にだけ書く案、そして介入の印と観測を備えた dispatcher を先に作る案です。
  器の専門語の説明: 本文に出てくる専門語を、やさしい言葉で説明します。
  ・orchestrator（orchestrator）: 席の唯一の役割。 user と話し、 承認と裁定を受け取り (R-C7-1)、 契約・設計・落ちる歯 (実行できる acceptance) を書く。 実装はせず、 便の起動と着地は dispatcher に任せる。 前の名は planner。
  ・dispatcher（dispatcher）: 審査を通った契約の起動の列を台帳から導き、 依存・交差・受付を満たす便を起こし、 gate を通った便を land して merge する器の口 (ADR-1034・設計 dispatcher.md)。 本 ADR では周期の timer を持たず、 便の終端の直後・手動の 1 周・介入の印の直後に動く形。
  ・席の自律機能（seat autonomy machinery）: 席が自分を保つために器が持っていた仕組みの総称: 作業記憶の退避・復元・消費、 context の計測と cap guard、 管理 tick と cycle と tick の unit、 合図の backoff、 強制 cycle、 heartbeat、 statusline、 席間の連絡、 hook 集合の食い違いの検知。 本 ADR で削除する。
  ・SessionStart の注入（SessionStart injection）: Claude Code の session の開始・clear・圧縮の直後に hook が出す文。 圧縮のたびに原文が戻る唯一の経路で、 席ごとに内容を変えられ、 機械が測った値で穴を埋められる。 本 ADR で orchestrator は約 11 行、 runner は 0 行。
  ・/compact（compact）: Claude Code が会話の文脈を要約して短くする操作。 本 ADR では作業記憶の退避と復元の代わりで、 要約の後に SessionStart の注入が戻る。
  ・write-set guard（write-set guard）: PreToolUse の hook の 1 つ。 便の runner が編集できる path を契約の write-set の内側に限る (in-loop・FailClosed・C16)。 command guard (禁止 command の一覧・rules 行 runner.denied_commands) と共に runner に残す 2 枚。
  ・3 クラス（three classes）: 憲法 A1 の 消す / 出す / 使う。 実行前に user の承認を対話面で取り、 承認 event が逐語を運ぶ (C7.2)。 機械の面をほとんど持たないので、 orchestrator の注入に文で残す。
