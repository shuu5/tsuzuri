# 判断の記録 ADR-1045 — 器 scribe2 の判断の記録 ADR-0045 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1045
title: "席の役割は orchestrator 1 つで、 便の起動・着地・merge は器の dispatcher が行う (planner / 管理席の 2 役割と席の自律機能を廃止・SessionStart の注入は短い 1 本・session を跨ぐ記憶は台帳・runner には憲法の散文を注入しない)"
status: proposed
date: 2026-09-18
context: |
  席は 2 役割 (planner / 管理席) と、 それを保つための自律機能 (作業記憶の退避と復元・管理 tick・cap guard と強制 cycle・heartbeat・statusline・席間の連絡・hook 集合の食い違いの検知) を 1 週間で積み、 席 1 つの起動に 256 行 / 20,616 字を注入するに至った (うち憲法の全文が 74%)。 本 ADR は席の役割を orchestrator 1 つ (人と話す唯一の席) にし、 便の起動・着地・merge を器の dispatcher に移し、 席の自律機能を削除する。 session を跨ぐ記憶は台帳 (metadata / status / 依存) が構造で持ち、 文脈の圧縮は Claude Code の /compact で足りる。 SessionStart の注入は約 11 行に縮み、 runner には憲法の散文を 1 行も注入しない。
  なぜこの判断が要るのかを、現物の計測と 2 本の調査と裁定から説明します。席 1 つの起動で 256 行の文を注入し、その 4 分の 3 が憲法の全文でした。planner の指示文 14 行のうち、文でしか運べない役割の特性は 5 行だけで、7 行は管理席との中継や復元の手順でした。席を保つ機構（退避と復元、tick、guard、heartbeat、連絡）は 1 万行を超え、契約に溜まる文の 6 割は「機械が引ける事実の写し」と「門を黙らせる防御文」でした。無いのは、席を 1 つにして機構を消すという決定です。
  CTX1 現物 — 注入の量と中身 (調査 role-injection §2・verified)
  planner 席の起動 1 回で載る文は 256 行 / 20,616 字 (user の作法 file 52 行・project の作法 file 189 行・SessionStart の指示文 14 行 + 名乗り 1 行)。 うち憲法の規範文の生成区間が 117 行 / 10,617 字で、 注入全体の 52%・project の作法 file 単体の 74% を占める。 Claude Code の公式 docs は「長い作法 file は実際の指示を無視させる」「200 行以内」を名指しで書いており (同 §1.4)、 憲法の C 条文の大半は CI と hook が既に執行している (C4 = size gate・C5 = 裁定 id・C11 = lint・C12 = flip-check と snapshot・C13 = deny と予算・C16 = PreToolUse の guard) ので、 注入しても deny は 1 つも増えない。 planner の指示文 14 行の分類 (同 §2.4・母集団 14): (a) guard が既にやっている 1 行 / (b) 注入でしか運べない席の特性 5 行 / (c) skill か管理席の中継の手順 7 行 / (d) 憲法の pointer 3 行に混在。 管理席の指示文 10 行のうち 5 行は中継と報告の手順。 権能（権能 = 役割ごとに許された操作の閉じた一覧） 11 個のうち機械の面 (Bash の subcommand か path の種別) を持つのは 8 個で、 go / relay / edit-contract の 3 個は宣言だけ (role.rs の doc comment が自ら明記)。 最も効いている役割の特性は「planner の行に edit-code が無い」ことで、 これは文ではなく role guard が止めている。
  CTX2 現物 — 席が自分を保つために積んだ機構 (設計 doc 5 本と seat/ の現物)
  席の自律機能は設計 5 本に散る: 作業記憶の退避・復元・消費 (working-memory.md §5 の subcommand 3 つ・§12 の直命の表と現在地の DATA と hook・ADR-1018 / ADR-1031) / context の計測と cap guard・管理 tick と cycle・heartbeat・statusline (seat-autonomy.md §3・§8・§11 の tick の unit = ADR-1030・§14 の合図の backoff・§15 の窓ごとの閾値と強制 cycle) / 席の状態の打刻 (seat-state.md §2・§4) / hook 集合の digest の食い違いによる席の作り直し (consumer-sync.md §6) / 席間の連絡と復元の第一手を運ぶ指示文 (seat-roles.md §5)。 現物の大きさ (2026-09-18 main cc07cf6・verified): crates/scribe2/src/seat/ は 23 file 11,027 行で、 うち wm / tick / rebrief / externalize / consume / inject / meter の 7 系統が 7,215 行 (調査 §5)、 hook/seat_guard.rs 158 行、 e2e の歯は tests/e2e/seat/ の tick.rs 2,521 行 + wm.rs 1,719 行、 skill は ready-compaction / rebrief の 279 行。 rules 行は seat.context_cap_pct / seat.context_window_tokens / seat.tick_stale_s / seat.cycle_lock_ttl_s / seat.signal_backoff_s / seat.pointer_backoff_factor / seat.pointer_backoff_max_s / seat.cycle_settle_s / seat.cycle_poll_ms / seat.wm_directive_cap の 10 本と役割の行 role.planner / role.admin の 2 本。 削除できる規模は src 7,215 + 歯 4,240 + skill 279 ≒ 11,700 行以上 (core 43,859 行の 4 分の 1 強)。
  CTX3 調査 — なぜ席に機構と散文が溜まったか (prose-root-cause §1〜§3・role-injection §1)
  契約 5 本 25,208 字の分類 (prose-root-cause §1・母集団 5 本): repo から機械で引ける事実の写し 36% / 門と lens を黙らせる防御文 25% / test を撃てば分かる事実 15% / 人の意図 16% / 手順 8%。 散文が伸びた根は「同じ事実を設計 § → 契約表の行 → 台帳の acceptance → 契約 file の 4 か所に写す構造」で、 写しの食い違いを lens が指し、 planner が次の焼き直しで防御文を足す輪が 1 日ごとに回った (同 §2・防御行の字数は 09-10 → 09-16 で 6 倍)。 審査の非 PASS 54 件 (母集団 161 run) の型は、 契約の中の自己矛盾 18 / verify が done を測れない 18 / write-set の閉包の外 10 / § との不一致 7 / 材料不足 1 で、 「散文が足りない」型は 0。 runner の質問 20 件は 20 件とも write-set の閉包の話で、 「何を作るか分からない」は 0 (同 §3)。 席の側も同型で、 席が黙る・文脈が溢れる・口座が上限に当たる、 の 1 つ 1 つに機構 (tick・guard・cycle・backoff・強制の窓) を足してきた。 一方 Claude Code の仕組み (role-injection §1・verified): 作法 file は system prompt ではなく user message として届き、 途中で注入した文は圧縮で要約に飲まれ、 圧縮のたびに原文が戻るのは SessionStart の hook だけ。 plugin の hooks.json から system prompt 層へ書く正規の経路は無い。 したがって注入の強さは置き場所ではなく「短さ・席ごとの限定・機械が測った値で穴を埋める・圧縮で戻る」の 4 つから来る。
  CTX4 裁定 — 管理席を消し、 席の自律機能を消し、 注入を短くする
  user 裁定 2026-09-18T08:2xZ / 08:3xZ / 09:0xZ (対話面・逐語は台帳 s2-07l の notes) の要旨: (1) 管理席は要らず、 便の起動・着地・merge は器の dispatcher (ADR-1034 の向き・最小の形) が行う。 planner は orchestrator と改名し、 人と話す唯一の席として、 契約と設計と落ちる歯 (test) を書く。 (2) 席の自律機能は削除し、 文脈の圧縮は Claude Code の /compact で足りる。 session を跨ぐ記憶は台帳の構造 (metadata / status / 依存) が持ち、 session の開始で台帳の現在地を 1 行注入する。 (3) SessionStart の注入は orchestrator に約 11 行、 runner には憲法の散文を 1 行も注入せず、 write-set の guard と禁止 command の guard だけを PreToolUse に残す。 同じ日の先行の裁定 (ADR-1044 CTX3) は大整理を「削る側」で行う向きを示している。
  CTX5 憲法の向き
  C7 / R-C7-1 は承認を受け取る対話面をちょうど 1 つと定め、 C7.2 は承認 event が逐語を運ぶ。 A1 / A4.2 は 3 クラス (消す / 出す / 使う) と不可逆の操作の前に user へ聞くことを求め、 機械の面をほとんど持たない (人と話す席にだけ文で運ぶ価値がある)。 N2 / C1.2 は散文にしか無い規則を規則と認めず、 C14 は規律を文書と manifest の 2 面で持つ。 C2.2 / C3 は設定と状態の置き場を manifest と 1 つの DB に限る (席の退避物・直命の表・heartbeat の file は状態の置き場を増やしていた)。 C9 は席の停止の検知と再開を器に求め、 その面は管理 tick と cycle が担っていた = 本 ADR は C9 の解釈 (席 = orchestrator 1 つ・便の driver は dispatcher が起こし直す) を持つ (ADR を書く条件 1)。 C16 / C16.2 は in-loop の guard を要求し、 write-set guard・command guard・role guard がそれである。 C17 (ADR-1044・proposed) は機構を足す提案に先に消すものを名指させる = 本 ADR は「消す → dispatcher」の順を持つ。 憲法の順位 2 位は増殖の防止。
  （選択肢を測るものさし）判断を評価する 5 本のものさしです。人と話す席は 1 つであること、足すより先に消すこと、規則は文ではなく hook と manifest の面で持つこと、席と便の停止の検知と再開が人の手を要しないこと、そして session の開始で注入する文の行数を増やさないことです。
  DR1｜user と話し、 承認と裁定を受け取る席はちょうど 1 つで、 逐語は承認 event にだけ載る 憲法 C7 / C7.2 / rules 行 R-C7-1
  DR2｜足す前に消す: 機構を足す提案は先に消すものを名指し、 状態の置き場と rules 行を増やさない 憲法の順位「増殖の防止」/ C17 (ADR-1044) / C2.2 / C3
  DR3｜役割の規律は文ではなく、 hook (in-loop の guard) と manifest の行で持つ。 文で運ぶのは機械の面を持たない振る舞い (聞く・拒む) だけ 憲法 N2 / C1.2 / C14 / C16
  DR4｜席と便の停止の検知・再開・成果の保存に人の手を要しない (席 = orchestrator 1 つ・便 = dispatcher の driver) 憲法 C9 / SRS FR1068
  DR5｜session の開始で注入する文は席ごとに絞り、 orchestrator は約 11 行以内、 runner は 0 行。 機械が測った値で穴を埋め、 圧縮のたびに原文が戻る経路 (SessionStart) だけを使う 調査 role-injection §1.1 / §1.4 / §3・SRS FR1042
decision: |
  選んだ案と、それが要件書のどの要件を支えるかを示します。席の役割は orchestrator 1 つ、便の起動・着地・merge は器の dispatcher、席の自律機能は削除、SessionStart の注入は約 11 行、runner には憲法の散文を注入しません。残すのは write-set guard・command guard・role guard・3 クラスの承認 event・口座の選定と役割の実効の口座です。改稿後の配送構造（FR1030）、権能の行（FR1041）、dispatcher の起動と着地（FR1068）に対応します。
  採用 — OPT1
  (1) 役割: Role SHALL Orchestrator の 1 variant のみを持つ閉じた enum とし、 Admin SHALL 削除、 Planner SHALL Orchestrator に改名する。 rules 行 SHALL role.orchestrator の 1 本 (値 = answer / approve / go / edit-design-intent / edit-design-doc / edit-contract / edit-outside / edit-code〔tests/ の path 種別に限る〕・裁定 id 付き・C5) とし、 role.planner / role.admin SHALL 削除する。 Capability::Relay SHALL 削除し (機械の面が無く管理席の廃止で意味を失う)、 Launch / Merge SHALL 器の dispatcher だけが行う操作として orchestrator の行から外す (role guard が pipe run / pipe land を deny する形は不変)。 R-C7-1 の値 SHALL orchestrator の登録 row を持つ席とする。 orchestrator SHALL 人と話す唯一の席で、 契約・設計・落ちる歯 (実行できる acceptance) を書き、 実装 SHALL NOT 自分で行わない。 便の起動・着地・merge SHALL 器の dispatcher が行う: 台帳から起動の列 (依存が closed ∧ 設計 pointer が在る ∧ 現 sha の審査が PASS・dispatcher.md §2 の入力) を導き、 既存の intake の判定 (交差・受付・pipe.max_live) を通る便を起こし、 gate を通った便を land して merge する。 契機 SHALL 便の終端 (Landed / Failed / Stopped・便を運ぶ process の退役) の直後と、 手動の 1 周と、 介入の印の記録の直後の 3 つとし (契約が出来た直後の審査は intake の段が持ち、 別の契機にしない・設計 dispatcher.md §5)、 周期の timer SHALL NOT 持たない。 介入の印 (ADR-1034 §2 の first / hold / release) と dispatch ls SHALL 最初の便に含め、 rebrief の DATA への観測 SHALL 持たない ((2) の作業記憶の廃止に従う)。 契機と印のこの 2 文は SRS 版 0.18 の改訂 (2026-09-19) で設計 dispatcher.md に揃えて訂正した (proposed の間の訂正・supersede ではない)。
  (2) 席の自律機能 SHALL 削除する: 作業記憶の退避・復元・消費 (seat externalize / rebrief / consume・working-memory.md §5)、 直命の表と現在地の DATA と skill 起動の hook と自動退避 (同 §12・ADR-1031)、 context の計測と cap guard (seat meter / seat guard・seat-autonomy.md §3)、 管理 tick と cycle と tick の unit (seat tick / seat cycle・同 §3 / §8 / §11・ADR-1030)、 合図の backoff (同 §14)、 窓ごとの強制 cycle と強制 cycle の guard (同 §15)、 heartbeat (seat heartbeat)、 statusline (seat statusline・ADR-1029)、 席間の連絡の作法 (seat-roles.md §5・FR1044)、 hook 集合の digest の食い違いによる席の作り直し (consumer-sync.md §6)、 席の状態の打刻のうち読み手が消えるもの (UserPromptSubmit / Stop の Busy / Idle・seat-state.md §2・SessionStart の打刻は登録の条件として残る)、 skill ready-compaction / rebrief、 rules 行 seat.context_cap_pct / seat.context_window_tokens / seat.tick_stale_s / seat.cycle_lock_ttl_s / seat.signal_backoff_s / seat.pointer_backoff_factor / seat.pointer_backoff_max_s / seat.cycle_settle_s / seat.cycle_poll_ms / seat.wm_directive_cap と R-C9-1.forced-windows、 対応する極性一覧の行と外形 snapshot。 文脈の圧縮 SHALL Claude Code の /compact とし、 session を跨ぐ記憶 SHALL 台帳の構造 (metadata / status / 依存) とし、 器 SHALL NOT 退避物・直命の表・heartbeat・tick-stamp・強制の印の file を持たない (C3 / C2.2)。
  (3) 注入: orchestrator の SessionStart SHALL 約 11 行以内の生成文 (席の同一性 3 行 = 役割・target・anchor / 権能の行の値 / 台帳の現在地 1 行〔bd --readonly status 級の出力・実測 0.35 秒・rules 行 seat.ledger_timeout_s の内側〕、 憲法の効く部分 5 行 = 順位 / A1 / A4.2 と C7.2 / A2 と A3 / N1〜N3、 役割の特性 3 行 = 対話面の作法と信頼度〔C10〕/ 実装は自分でせず契約と歯を書く / 決定はしご〔C17・ADR-1044〕) とし、 行 SHALL 穴か出所 pointer を持つ行に限る (ADR-1022 §2.4 の規律は不変)。 runner SHALL 憲法の散文を 1 行も受けず、 PreToolUse の write-set guard と command guard だけを受ける (headless/runner.txt は便の task 記述であり注入ではない)。
  (4) 残すもの: write-set guard (C16)・command guard・role guard (権能の列から Relay を落とす)・PermissionRequest の一律 deny・3 クラスの承認 event (C7.2 / A1)・便用の口座選定と役割の実効の口座 (ADR-1036 / 0041 / 0042)・seat register / seat launch (orchestrator の起動と再起動の口・FR1059) SHALL 不変。
  (5) 順序 SHALL 「消す → dispatcher」とし、 削除の便が Landed に達する前に dispatcher の便 SHALL NOT 起こさない (C17)。
  (6) SRS SHALL /folio-architect の段で user が改訂し、 本 ADR は廃止候補を列挙するだけ: FR1023 (退避と復元の 9 作法) / FR1025 (context 計測) / FR1026 (cap guard) / FR1027 (打刻の合図) / FR1028 (cycle) / FR1029 (退避の合図) / FR1030 (2 役割 → orchestrator 1 役割 + dispatcher・改稿) / FR1038 (口座逼迫の退避の合図) / FR1040 (席の登録・1 役割へ改稿) / FR1041 (権能の行・role.orchestrator へ改稿) / FR1042 (指示文・約 11 行へ改稿) / FR1043 (queue の pointer) / FR1044 (席間の連絡) / FR1045 (権能の執行・管理席の例外を削る改稿) / FR1057 (host の宣言値・席に積む plugin dir の項目を見直す) / FR1059 (席の起動・役割 1 つへ改稿) / FR1060 (役割なしの起動) / FR1061 (導入先の同期・hook 集合の digest) / FR1062 (hook 集合の食い違いの作り直し) / FR1063 (statusline) / FR1064 (tick の unit) / FR1065 (直命の表) / FR1066 (作業記憶の hook 4 つ) / FR1067 (対話面の作法の行と 5 slot) / FR1068 (dispatcher・契機を tick から land 直後と契約直後へ改稿) / FR1070 (強制 cycle の印)。 発効 SHALL SRS の改訂と rules 行 role.orchestrator の裁定 id の後とし、 本 ADR SHALL それまで proposed のまま何も拘束しない。
  （平易）席の役割は orchestrator 1 つだけにします。人と話し、承認と裁定を受け取り、契約と設計と「落ちる test」を書く席です。便を起こす・着地させる・merge する仕事は器の dispatcher が台帳から読んで行い、周期の timer は持たず、便が終わった直後・手で 1 周を頼んだとき・順番を動かす印を書いた直後に動きます。席が自分を保つために積んだ仕組み（退避と復元、tick、上限の guard と強制 cycle、heartbeat、statusline、席どうしの連絡、hook 集合の食い違いの検知、それらの rules 行と skill）は消します。文脈が溢れたら /compact を使い、次の session は台帳を読めば続きが分かります。session の開始で注入する文は約 11 行で、実装役には憲法の文章を渡さず、書いてよい file と撃ってはいけない command だけを hook で止めます。残るのは write-set guard・command guard・role guard・3 クラスの承認 event・口座の選定です。順序は「消してから dispatcher」で、要件書の改訂は /folio-architect の段で user が行います。
  （理由）溜まった機構の根は「席が 2 つあり、片方がもう片方を見守り、席が自分の記憶を file で保つ」形そのものでした（CTX2 / CTX3）。席を 1 つにすれば中継と連絡が消え、記憶を台帳の構造に置けば退避と復元が消え、便の起動と着地を機械に渡せば見守りが消えます。注入の強さは置き場所でなく短さと席ごとの限定から来るので（CTX3）、注入は「文でしか運べない 5 行 + 憲法のうち聞く・拒むの 5 行 + 機械が埋める 3 行」だけにし、C 条文は既に CI と hook が執行しているので注入しません。実装役は 3 クラスの操作をせず裁定も持ち込まないので、憲法の文章は不要で、guard 2 枚で足ります。順番を動かす印と列を見る口は最初の便に含め、作業記憶の上に載っていた観測（rebrief の DATA）だけを消します（C17 の「足す前に消す」は作業記憶の側で満たします）。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1030（claim）: 便の配送構造 (改稿後): 席は orchestrator 1 役割で、 便の起動・着地・merge は器の dispatcher が持ち、 質問と判定は席を経由せず台帳と event log に載る。 改稿は /folio-architect の段。
  FR1041（claim）: 役割ごとの権能は rules 行 1 本 (role.orchestrator・裁定 id 付き) が持ち、 承認の記帳は R-C7-1 が名指す orchestrator の席の権能。 執行は role guard が同じ行を読む。
  FR1068（claim）: dispatcher は起動の列を台帳と審査の verdict から導き、 既存の intake の判定を通る便を起こし、 着地まで持つ。 契機は便の終端と手動の 1 周と介入の印の直後 (tick は消える・改稿)。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この ADR が版の系譜のどこに在るかと、判断が最後に行き着く原則です。作業記憶と tick の 3 本（ADR-1018 / 0030 / 0031）は丸ごと置き換え、配送構造と役割の 2 本（ADR-1016 / 0022）と dispatcher の 1 本（ADR-1034）は一部を置き換えます。行き着く原則は「人と話す席は 1 つ、記憶は台帳、便は機械」です。
  改訂状態: current (proposed)
  置き換える ADR: ADR-1018 (全部: 退避・復元・消費の subcommand と暫定行)・ADR-1030 (全部: tick の unit)・ADR-1031 (全部: 直命の表・現在地の DATA・skill の hook・自動退避)・ADR-1016 §2.1 (planner 1 席 + 管理席 N 席) / §2.3 (管理席の中継) を部分 supersede (§2.2 の typed な質問 record と §2.4 は不変)・ADR-1022 §2.1 (役割の enum の値 2 → 1) / §2.5 (R-C7-1 の値 = orchestrator) を部分 supersede (§2.2 の行・§2.3 の guard・§2.4 の生成文の規律・§2.7 は不変)・ADR-1034 の契機 (tick) を部分 supersede (列の入力と順序・起動条件・介入の印・land の直後の契機は不変・rebrief の DATA への観測は消える)。 ADR-1015 (席の状態の打刻) は読み手が消える分 (Busy / Idle) を部分 supersede し、 SessionStart の打刻は不変。 ADR-1029 (statusline) と ADR-1028 §2.4 (hook 集合の食い違いで席を作り直す) は本 ADR で消える機構の記録として置き換える。 ADR-1020 の開発 session 側 (上限の手前の退避と別口座での立て直し) は消え、 便の側 (上限で殺さず別口座で再開) は不変
  置き換えられた: なし (現行)
  憲法 (版 0.4.6) の C1〜C16 / A1〜A4 / N1〜N4 と、 ADR-1044 が proposed で加える C17 は不変で、 本 ADR は C9 の解釈 (席 = orchestrator 1 つ・便の driver は dispatcher) と R-C7-1 の値の変更を持つだけ。 ADR-1036 / 0041 / 0042 (口座の宣言と役割の実効の口座と便用の順序) は不変で、 orchestrator の席の口座はこれらで解ける。 ADR-1023 (契約の正本は設計 doc の契約表) と ADR-1019 (並列の便の排他) は不変で、 dispatcher はその判定を再利用する。 planner 席の調査 role-injection §4 の推奨 (憲法の生成区間を作法 file の外へ出す) は本 ADR の射程外で、 別の裁定と ADR に残す。
  照会終端 — PRIN-ONE-SEAT-LEDGER-MEMORY-MACHINE-RUNS (本 ADR)
  人と話す席は 1 つ。 session を跨ぐ記憶は台帳の構造が持ち、 便を起こし着地させるのは機械。 席が自分を保つための機構を器に足さない。
  本 ADR の判断はこの原則に行き着く (これ以上は遡らない照会終端)。 憲法 C7 (対話面は 1 つ)・C3 (状態は 1 つの DB)・C17 (足す前に消す) を、 席の配置の形で持ったものである。 文で運ぶのは機械の面を持たない振る舞い (聞く・拒む) だけで、 規律は hook と行が持つ。
options:
  - id: "OPT1"
    name: "席の役割は orchestrator 1 つ・席の自律機能は削除・便の起動と着地と merge は最小の dispatcher・SessionStart は約 11 行・runner には憲法を注入しない"
    text: |
      Role は Orchestrator の 1 variant (閉じた enum のまま)。 権能は answer / approve / go / edit-design-intent / edit-design-doc / edit-contract / edit-outside + tests/ に限った edit-code (落ちる歯 = 実行できる acceptance を書く)。 launch / merge は dispatcher (機械) が持ち、 relay は消える。 作業記憶・tick・guard・cycle・heartbeat・statusline・席間の連絡・hook 集合の検知は削除し、 /compact と台帳で代える。 順序は「消す → dispatcher」。
      （平易）人と話す席を 1 つだけにし、便を回す仕事は機械に渡し、席が自分を保つために積んだ仕組みを全部消す案です。文脈が溢れたら Claude Code の /compact を使い、次の session は台帳を読めば続きが分かるようにします。session の開始で注入する文は約 11 行に減り、実装役には憲法の文章を渡さず、書いてよい file と撃ってはいけない command だけを hook で止めます。
      利点: src 7,215 + 歯 4,240 + skill 279 ≒ 11,700 行と rules 行 10 本と skill 2 本が消え、 状態の置き場 (退避物・直命の表・heartbeat・tick-stamp・強制の印) が消える (DR2 / C2.2 / C3)
      利点: 人と話す席が 1 つになり、 中継 (planner ↔ 管理席) の手順 7 行と席間の連絡の経路が要らなくなる (DR1)
      利点: 注入は席の同一性 3 行 + 憲法の効く部分 5 行 + 役割の特性 3 行に縮み、 runner は 0 行 (DR5)。 残る規律は hook と行が持つ (DR3)
      欠点: 席の停止の自動検知と自動の立て直し (C9 の席の面) は消え、 orchestrator の再起動は user が器の口 (seat launch) を撃つ。 便の側は dispatcher の driver の起こし直しが担う
      欠点: SRS の FR 20 本超が廃止候補になり、 改訂は /folio-architect の段で user が行う (本 ADR は候補を列挙するだけ)
    verdict: adopted
    reason: "Role は Orchestrator の 1 variant (閉じた enum のまま)。 権能は answer / approve / go / edit-design-intent / edit-design-doc / edit-contract / edit-outside + tests/ に限った edit-code (落ちる歯 = 実行できる acceptance を書く)。 launch / merge は dispatcher (機械) が持ち、 relay は消える。 作業記憶・tick・guard・cycle・heartbeat・statusline・席間の連絡・hook 集合の検知は削除し、 /compact と台帳で代える。 順序は「消す → dispatcher」。"
  - id: "OPT2"
    name: "2 役割 (planner / 管理席) を残し、 指示文と憲法の注入だけを削る"
    text: |
      注入は 20 行に入る (調査 §2.4 の含意) が、 中継・報告・席間の連絡の 7 行と、 管理席が便を見守るための tick・heartbeat・cycle は残る。 CTX3 の輪 (席が黙る → 機構を足す) の根は 2 席の間の中継そのもので、 文を削っても機構は減らない。
      （平易）席は 2 つのまま、注入する文だけを短くする案です。手軽ですが、席どうしの中継と、席を見守る仕組みがそのまま残ります。溜まった仕組みの根は「席が 2 つあって、片方がもう片方を見守る」形そのものなので、文を減らしても仕組みは減りません。
      利点: code の変更が小さい (雛形 2 枚の書き換えだけ)・既存の ADR-1016 / 0022 の形を保つ
      欠点: 機構 11,700 行と rules 行 10 本が残る (DR2 に反する)・管理席の中継が残るので runner の質問と gate の判定は席を経由し続ける (ADR-1034 §1 の待ちが残る)
    verdict: rejected
    reason: "注入は 20 行に入る (調査 §2.4 の含意) が、 中継・報告・席間の連絡の 7 行と、 管理席が便を見守るための tick・heartbeat・cycle は残る。 CTX3 の輪 (席が黙る → 機構を足す) の根は 2 席の間の中継そのもので、 文を削っても機構は減らない。"
  - id: "OPT3"
    name: "作業記憶を器の機構でなく文書 (skill の散文と markdown の退避物) として残す"
    text: |
      前の版の形。 退避物は規則の置き場ではないと決めていた (作業記憶の語彙・N2) が、 pointer の無い命令行が暫定行として溜まり (ADR-1018 §2.2 の対策が要った)、 復元の brief の 5 slot (FR1067) が手順として指示文に載った。 台帳が metadata / status / 依存を構造で持つなら、 文書の退避物は台帳の写しになる。
      （平易）作業の記憶を器の仕組みでなく、文章の file として残す案です。前の版がこの形で、文章の中に「命令」が溜まって規則のように振る舞う問題が出ました。台帳が状態と依存を構造で持てば、文章の記憶はその写しになるだけです。
      利点: 器の code は要らない・/compact の要約より多くの文脈を運べる
      欠点: 散文の命令行が規則になる穴 (N2・台帳 s2-07l.176 の型)・台帳と退避物の 2 か所に状態を持つ (C3 / DR2)・写しの食い違いが lens の finding と防御文を生む (CTX3 の輪)
    verdict: rejected
    reason: "前の版の形。 退避物は規則の置き場ではないと決めていた (作業記憶の語彙・N2) が、 pointer の無い命令行が暫定行として溜まり (ADR-1018 §2.2 の対策が要った)、 復元の brief の 5 slot (FR1067) が手順として指示文に載った。 台帳が metadata / status / 依存を構造で持つなら、 文書の退避物は台帳の写しになる。"
  - id: "OPT4"
    name: "役割の規律を project の作法 file (CLAUDE.md) にだけ書き、 hook の注入も guard も持たない"
    text: |
      公式 docs (調査 §1.1 / §1.2・verified): 作法 file は system prompt の後ろの user message として届き、 遵守は保証されない (advisory)。 圧縮の後に原文が戻るのは SessionStart の注入だけで、 作法 file は project root の分しか戻らず、 席ごとに内容を変えられず、 機械が測った値 (target・権能の行・台帳の現在地) で穴を埋められない。 執行力は hook にしか無い (「hooks are deterministic」)。
      （平易）役割の決まりを project の作法 file に書くだけで済ませる案です。作法 file は「お願い」として届くもので守られる保証が無く、席ごとに内容を変えられず、機械が測った値を埋め込めません。文脈を圧縮した後に元の文がもう一度入るのは session 開始の hook だけです。止める力は hook にしか無いので、この案は弱すぎます。
      利点: 器の code が要らない・登録の無い session にも同じ文が載る
      欠点: 執行力が無い (DR3・C16 の in-loop guard を欠く)・席ごとに絞れず穴も埋まらない (DR5)・散文の規則になる (N2)・置き場所の強さの差は docs に定量が無い (「hook だから強い」とも言えないが、 作法 file は明確に弱い側)
    verdict: rejected
    reason: "公式 docs (調査 §1.1 / §1.2・verified): 作法 file は system prompt の後ろの user message として届き、 遵守は保証されない (advisory)。 圧縮の後に原文が戻るのは SessionStart の注入だけで、 作法 file は project root の分しか戻らず、 席ごとに内容を変えられず、 機械が測った値 (target・権能の行・台帳の現在地) で穴を埋められない。 執行力は hook にしか無い (「hooks are deterministic」)。"
  - id: "OPT5"
    name: "介入の印 (first / hold / release) と観測 (dispatch ls・rebrief の DATA) を備えた dispatcher を先に作り、 その後に席を減らす"
    text: |
      ADR-1034 §2 の全体像。 だが介入の印は「planner が列の順を動かす口」で、 orchestrator 1 席なら priority の書き換え (台帳) で足りる可能性が高く、 観測の DATA は rebrief (削除対象) に載せる設計だった。 先に機構を足すのは C17 と CTX4 の「削る側」に反する。 最小の dispatcher (台帳から ready の列を導き、 起こし、 着地させる) で始め、 印と観測は必要が実測で出たときに足す。
      （平易）便を回す機械に「順番を動かす印」と「いま何を待っているか見る画面」を最初から付ける案です。席が 1 つになれば順番は台帳の優先度で動かせ、見る画面は消す予定の仕組みの上に載っていました。先に足すのは「削る側」の向きに反するので、最小の形で始めて、要ると分かってから足します。
      利点: ADR-1034 の設計 (dispatcher.md §2〜§6) をそのまま使える・急ぐ便の扱いが最初から在る
      欠点: 消す前に足す (C17 / DR2 に反する)・印の記録 (DispatchMark) と観測の marker は削除対象の rebrief に依存する・orchestrator 1 席では priority で足りる見込み (実測なし・inferred)
    verdict: rejected
    reason: "ADR-1034 §2 の全体像。 だが介入の印は「planner が列の順を動かす口」で、 orchestrator 1 席なら priority の書き換え (台帳) で足りる可能性が高く、 観測の DATA は rebrief (削除対象) に載せる設計だった。 先に機構を足すのは C17 と CTX4 の「削る側」に反する。 最小の dispatcher (台帳から ready の列を導き、 起こし、 着地させる) で始め、 印と観測は必要が実測で出たときに足す。"
