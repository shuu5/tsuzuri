retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  席の役割を「人と話す席」1 つ（orchestrator）にし、便を起こす・着地させる・merge する仕事は器の dispatcher が台帳から読んで行います。席が自分を保つために積んだ仕組み（作業記憶の退避と復元、管理 tick、上限の guard と強制 cycle、heartbeat、statusline、席どうしの連絡、hook 集合の食い違いの検知）は消し、session を跨ぐ記憶は台帳の構造に置き、文脈の圧縮は Claude Code の /compact に任せます。session の開始で注入する文は約 11 行に縮み、実装役には憲法の文章を注入せず、書いてよい file と撃ってはいけない command を hook で止めるだけにします。消してから dispatcher を足す順で進めます。
consequences:
  - "この判断で良くなることと、代わりに引き受けることです。1 万行を超える機構と rules 行 10 本と skill 2 本が消え、人と話す席が 1 つになり、注入は約 11 行に縮み、便は着地の直後に次が起きます。代わりに、席の自動の立て直しが無くなること、要件書の 20 本超の改訂を user の手で行うこと、削除の便が着地するまで dispatcher を起こせないこと、消した後に「要る」と分かった機構は実測を添えて足し直すことを引き受けます。"
  - "良い結果: 消えるもの: src 7,215 行 (wm / tick / rebrief / externalize / consume / inject / meter) + hook/seat_guard.rs + 強制 cycle の guard + 歯 4,240 行 + skill 279 行 + rules 行 10 本と R-C9-1.forced-windows + role.planner / role.admin + Role::Admin / Capability::Relay + tick の unit + 極性一覧の行 + 外形 snapshot。 状態の置き場 (退避物・直命の表・heartbeat・tick-stamp・pointer-digest・強制の印) が消え、 C3 の「状態は 1 つの DB」に近づく"
  - "良い結果: 人と話す席が 1 つになり、 中継 (planner ↔ 管理席) と席間の連絡が消える。 承認・回答・go の記帳は orchestrator の席からだけ (R-C7-1・不変の形で値だけ変わる)"
  - "良い結果: 注入は 256 行 / 20,616 字 → 約 11 行 (+ 作法 file) に縮み、 席ごとに絞られ、 機械が測った値 (権能の行・台帳の現在地) で穴が埋まり、 /compact のたびに原文が戻る。 runner は 0 行で guard 2 枚だけ"
  - "良い結果: 便は便の終端の直後 (と手動の 1 周・介入の印の直後) に器が起こし、 gate を通れば器が land して merge する (ADR-1034 §1 の待ちと「同時 3 便」の散文が消える)。 残す guard (write-set / command / role) と承認 event と口座の選定は不変"
  - "代償: 席の停止の自動検知と自動の立て直し (管理 tick・cycle・口座逼迫の退避) は消える: orchestrator が黙る・文脈が溢れる・口座が上限に当たる周は user が /compact か seat launch (役割の実効の口座は ADR-1041 のまま解ける) を撃つ。 C9 の「席」の面は orchestrator 1 席に対して人の手を許す解釈 (人と話す席は人が起こす) とし、 便の driver の死亡は dispatcher が起こし直す (dispatcher.md §5)。 条文は変えない"
  - "代償: SRS の FR 26 本 (決定 (6) の列) が廃止か改稿の候補になり、 改訂は /folio-architect の段で user が行う。 それまで SRS と本 ADR は食い違い、 本 ADR は proposed で何も拘束しない"
  - "代償: 順序が「消す → dispatcher」なので、 削除の便が Landed に達するまで便の起動と着地は器の口 (pipe run / pipe land) を人が撃つ (前の版の admin の手順が一時的に戻る)。 削除の便そのものは write-set が大きく、 並列の便と交差しやすい (1 便 1 系統で切る)"
  - "代償: 消した機構のうち「要る」と実測で分かったもの (例: rebrief の DATA に在った起動の列の観測・context の計測) は、 C17 に従い先に消すものを名指した上で足し直す。 /compact の要約が台帳に無い文脈 (設計の途中の判断) を落とす risk は実測が無い (inferred)"
