consequences:
  - "この判断で良くなること 4 つと、 代わりに引き受けること 5 つです。 良くなるのは、 審査役が事実を確かめてから判定すること、 審査役が書けなくなること、 自動の記憶の分だけ口座で材料が変わらなくなること、 共通の検査の赤が早く直ることです。 引き受けるのは、 審査の時間と token が増えること、 共通の検査を 2 回撃つこと、 claude の版に依ること、 古い起動の行が 1 語の記録でしか見えないこと、 先回りの審査の判定を本番に写さないので本番の審査が毎回審査役を起こすことです。"
  - "良い結果: 審査役が呼び手・組み立ての場所・既存の歯を木の現物で確かめてから判定する"
  - "良い結果: 審査役は書けず、 読みは便の木に閉じるので、 main の作業場所を書き換える穴が閉じる"
  - "良い結果: 自動 memory の分について、 同じ契約は走る口座に依らず同じ材料で審査され実装される (口座の設定 dir の他の入力は着地の後に測る)"
  - "良い結果: 共通 verify の赤は runner の turn の中か終わりの門で直り、 gate の FAIL と便の捨て直しが減る"
  - "代償: 読む lens の 1 回の時間と token が増える"
  - "代償: 緑の便も終わりの門と gate で共通 verify を 2 回撃つ (中央値の和で約 137 秒)"
  - "代償: 道具と env の名は claude の版に従い、 実 binary の効きは着地の後に init の record で測り直すほかない"
  - "代償: 起動の雛形に残った書きの mode は審査を止めず、 便の記録の 1 語でだけ見える"
  - "代償: 先撃ちの判定は予想の木で出るので Reviewed へ写らず、 先撃ちが退役するまで契約の審査は毎回 lens を撃つ (先撃ちは別の ADR が畳む)"
