# 判断の記録 ADR-1102 — 器 scribe2 の判断の記録 ADR-0102 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1102
title: "器が起こす審査役は読みの道具だけを持ち、 契約の審査は審査の時点の HEAD の木の上で・先撃ちは予想の木の上で読み、 口座の自動 memory を読まない — runner には共通 verify の行を渡し、 終わりの門で器が撃った赤を同じ worktree で直させる (ADR-1011 が残した lens の起動形を決める)"
status: accepted
date: 2026-09-30
context: |
  器が起こす審査役 (lens) は、 「道具は無い」と言われて材料の字だけで判定する一方、 実際には編集を自動で承認する設定で main の作業場所を起点に起きていた。 実装役 (runner) は、 gate が必ず撃つ共通の検査を知らされていなかった。 本 ADR は、 審査役に読むだけの道具を渡して書く道具を持たせず、 契約の審査を審査する時点の repo の写しの上で、 先回りの審査を予想の写しの上で読ませ、 口座ごとの自動 memory を読ませないと決める。 あわせて runner に共通の検査の行を渡し、 runner の終わりに器がその行を撃って、 赤なら同じ作業場所で直させる。
  なぜこの判断が要るのかを 5 つから説明します。 便の失敗の根の多くが設計の側に在り、 code の事実が役に渡っていないという経緯・審査役は書けるのに「道具は無い」と言われ、 runner は共通の検査を知らないという現物・claude の道具と設定の効きの実測・決める範囲・憲法の条のこの記録での読み方です。
  CTX1 経緯 — 便の FAIL の根は設計の側で、 code の事実が役に渡っていない
  2026-09-28〜09-30 に起きた便 165 本のうち、 FAIL か判定できなかった 76 件を 1 件ずつ分けると、 73 件の根は設計の側に在った (設計が code の事実を誤ったか知らなかった 32・done の項目に落ちる歯が無い 24・設計の中の食い違い 9・書き足りなさ 8)。 審査役の誤りは 0 件で、 runner の誤りが主因の件は 2 件だった。 契約の審査で落ちた 46 件のうち約 21 件は code の事実 (呼び手・struct を組み立てる場所・既存の歯の pin・可視性) が要り、 gate で落ちた 30 件のうち 15 件は gate が必ず撃つ共通 verify の赤だった。 分析は epic s2-07l.736.33 の打ち手 0 (審査役の安全の穴と読みの道具（読むだけの道具）) と 2 (runner の終わりに器が done の門を撃つ) を最も効きが大きく小さいものに挙げた。
  CTX2 現物 — 審査役は書けるのに「道具は無い」と言われ、 runner は共通 verify を知らない
  lens の起動形は headless の build (runner と lens の唯一の構築点・ADR-1011) が組み、 permission mode は lens の flag の値を素通しする。 運用の lens の cmd は編集を自動で承認する mode を焼いており、 道具を絞る flag は渡っていない (ADR-1011 は lens の起動形を変えないと射程の外に残した)。 契約の審査の lens の cwd は anchor の main の作業木で、 先撃ちの lens も同じ。 先撃ちの材料は予想の base の木 (祖先の層を当てた一時の worktree) で組むが、 その木は lens を起こす前に外し、 Reviewed の段の使い回しの鍵は材料の digest と lens の cmd の字だけで、 lens が読んだ木を含まない。 契約の審査と gate の雛形は「tool が渡されていない」と書き、 2026-09-30 の lens 132 回のうち 126 回が 1 turn で終わった。 前提を無視して code を読んだ 6 回のうち 3 回は行番号つきで本物の欠陥を掘り出した。 runner の雛形は「契約の verify 行が緑になるまで直す」とだけ言い、 runner 28 本のうち xtask check を撃ったのは 5 本だった。 runner と lens には口座ごとの自動 memory（口座ごとの記憶） の索引が載り、 中身は口座で違う。
  CTX3 実測 — claude の道具の列・mode・env の効き
  claude 2.1.285 で、 空の設定 dir と無効な API key の起動 (課金なし・init の record だけ) と haiku の実 call 3 回で測った (2026-09-30)。 道具の列の flag に Read・Grep・Glob を渡すと、 init の道具は 3 つだけになり、 Write と Bash は無い。 許可の問いを誰にも出さない mode (dontAsk) で allow の規則を渡さない形では、 cwd の中の Read は通り、 cwd の外の Read と Grep は断られた。 allow の規則に Read を足すと cwd の外も読めた。 自動 memory を切る env を 1 にすると init の memory の path が消え、 0 と未設定では口座の設定 dir の下の path が載った。 settings を読まない flag だけでは自動 memory は切れない。 gate の共通 verify の行ごとの時間は、 record 570 件の中央値で flip-check 93 秒・workspace の nextest 35 秒・clippy 5 秒・xtask check 4 秒だった。
  CTX4 射程 — 審査役の起動形と runner の材料と終わりの門（実装後すぐの検査）を決め、 審査の段の位置は変えない
  決めるのは、 (1) 審査役の道具と mode と env の起動形、 (2) 契約の審査の cwd (審査の木（審査用の写し）)、 (3) 審査の雛形の前提の書き方、 (4) runner に共通 verify の行を渡す節、 (5) runner の終わりに器が撃つ終わりの門とその赤の渡し方。 変えないのは、 runner の起動形 (allowlist と plugin)、 gate の判定と撃つ行、 Gated の FAIL が終端であること、 審査の材料の組み手、 lens の cap と model と effort の行。 審査を列に入れる前の門へ移すこと、 逆引きの表、 done と歯の対応の欄は別の ADR が決める。 終わりの門は SRS の FR1006 の字を変えるので、 実装の行は SRS の追加 round の後に起こす。 ADR を書く条件のうち 1 (C16・C1・C2.2 の読み・CTX5)・3 (event の detail と run dir の記録の形)・4 (却下案を残す価値) に当たる。
  CTX5 憲法の読み — 終わりの門は事後の検証で編集の時の止めに足すもの・道具の列と mode は閉じた定数・自動 memory の env は子へ設定するだけ
  C16 (仕様からの逸れを編集の時に止め、 事後の検証で代えない) について: 終わりの門は runner の turn の後に撃つ事後の検証で、 編集の時の止め (write-set の hook と許可の要求の一律 deny) に足すものであって、 それを代えない。 hook と deny は本 ADR の後も runner の turn の中で効く。 C1 (規則の値は manifest の 1 file) について: lens の道具の列 Read・Grep・Glob と permission mode dontAsk は閾値ではない閉じた定数で、 manifest の行を持たない (xtask の env の読みの許す集合と同じ読み)。 runner の許可の上限を rules 行 runner.allowed_commands が持つのは、 それが repo ごとに変わりうる列だからで、 lens の道具の列は器の全 repo に共通の起動形の一部である。 lens の turn の上限と終わりの門の周の上限は閾値なので、 rules 行に置き、 値は user の裁定で決める。 C2.2 (env を直に読まない・新しい env の seam を作らない) について: 自動 memory を切る env は、 器が子の process へ設定するだけで自分では読まない。 口座の env と agent view の env と同じ置き方で、 新しい seam ではない。
  （選択肢を測るものさし）この判断を評価する 6 本のものさしです。 審査役が code の事実を確かめられること。 審査役が書けないこと。 同じ契約が口座に依らず同じ材料で扱われること。 runner の合格の条件を散文でなく器の仕組みで渡すこと。 判定の後に便を戻さないこと。 起動の値を運用の手書きに置かないことです。
  DR1｜審査役が判定の前に code の事実を木の現物で確かめられる CTX1・CTX2
  DR2｜審査役は書けない — 道具も mode も書きを持たず、 読みは便の木の中に閉じる CTX2・CTX3
  DR3｜同じ契約は走る口座に依らず同じ材料で審査され実装される (C10・本 ADR が閉じるのは自動 memory の分) CTX2・CTX3
  DR4｜runner の合格の条件は散文の注意でなく器の材料と器の測りで渡す (N2・C16) CTX1・CTX2
  DR5｜判定の段の後に便を戻さない — Gated の FAIL の終端と着地の列の数えを動かさない CTX4
  DR6｜起動形の値を運用の cmd の手書きに置かない (閾値でない閉じた定数は器の code・閾値は rules 行・CTX5) CTX2・CTX5
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 審査役は読むだけの道具で起き、 契約の審査は審査する時点の写しの上で読み、 先回りの審査は予想の写しの上で読んでその判定を本番に写さず、 自動の記憶は読みません。 runner は共通の検査の行を受け取り、 終わった直後に器が同じ行を撃って、 赤なら決めた回数まで同じ作業場所で直させます。 gate は今どおり全部の行を撃ちます。
  採用 — OPT1
  器 SHALL 審査役 (契約の審査・gate・先撃ちの lens) の claude を、 道具の列 Read・Grep・Glob と permission mode dontAsk を毎回渡し allow の規則を渡さない形で起こす。 lens は permission mode の引数を受けても値を使わず、 dontAsk でない値が渡された周は契約の file の dir に 1 語の記録 lens.ignored を残す (消費側ごとの起動の雛形は repo の外に在り、 断ると全部の審査が止まる)。 器が起こす claude (runner・lens・計測の refresh) は、 起動形を組む 1 関数が子の env で口座の自動 memory を毎回切り、 親の値を継承させない。 契約の審査は、 材料を組む前に対象 repo の HEAD の sha を読み、 先撃ちの判定を使い回さない周だけ、 その sha に detach した一時の worktree (審査の木) を材料の dir の外の run dir の直下に作って lens の cwd とし、 同じ path の前の周の木は先に外し、 判定を読んだ後に木を外し、 木の sha を審査の記録に残し、 作れない周は lens を撃たず INCONCLUSIVE にする。 先撃ちの lens は材料を組んだ予想の木を cwd にし、 lens が終わるまで木を外さず、 木の sha と種類 (祖先の層の無い actual か、 層を当てた forecast) を置き場に残し、 Reviewed は種類が actual で sha が審査の木と同じ判定だけを使い回す。 gate の lens の cwd は便の worktree のまま。 審査の雛形は、 読みの道具だけが在ること・cwd の外は読めないこと・材料に無い code の事実は木の現物で確かめること・穴を全部見てから判定することを書き、 道具が無いとは書かない。 器 SHALL runner の stdin の契約の直後に、 便の写しの共通 verify の行を gate と同じ 4 つの穴の埋め方 (base の sha・受付を通らない並列度 1・契約の verify 行の filter 語) で埋めた節を足し、 runner の雛形はその行を commit の後に全部撃って緑にしてから終えると読む。 器 SHALL runner の turn が rc 0 かつ commit 1 本以上で終わった周に、 gate と同じ撃ち手と受付で書きの範囲の検査・共通 verify・契約の検証行を便の worktree に撃ち (終わりの門)、 全行 rc 0 なら Implemented にし、 赤が在り測れなかった行が無く周が rules 行の上限に届かない周は同じ worktree・同じ base で runner を起こし直して赤い行と診断の抜粋の節を渡し、 周を使い切った周と測れなかった行が在る周は Implemented にして gate へ進める。 gate は終わりの門の結果を持ち越さず全行を撃ち、 Gated の FAIL は終端のまま。 lens の turn の上限と終わりの門の周の上限は rules 行が持ち、 値は SRS の追加 round で裁定を取る。 実装は設計 doc pipeline.md §64 の行 bg・§65 の行 bh・§66 (後の行)。
  （平易）審査役 (契約の審査・gate・先回りの審査) の claude は、 読むだけの道具 Read・Grep・Glob と、 許可の問いを誰にも出さない設定で毎回起こします。 許可の規則は渡さないので、 作業場所の外は読めません。 起動の行が許可の設定を渡しても、 その値は使いません。 許可の問いを出さない設定と違う値が渡されたときは、 便の記録に 1 語の file を残して古い起動の行を名指します。 器が起こす claude は、 口座ごとの自動の記憶を毎回切ります。 契約の審査は、 材料を組む前に対象の repo の最新の commit を読み、 それを一時の写しとして材料の置き場の外に取り出し、 その上で読ませ、 判定の後に写しを片付けます。 同じ場所に前の写しが残っていれば先に片付け、 写しを作れないときは審査をせず、 判定できなかったとします。 先回りの審査は、 材料を組んだ予想の写しの上で読ませ、 審査役が終わるまで写しを残します。 本番の審査は、 祖先の変更を当てていない写しで、 同じ commit を読んだ先回りの判定だけを使い回します。 審査の指示文は、 読む道具だけが在ること、 材料に無い code の事実は写しの現物で確かめること、 穴を全部見てから判定することを書きます。 runner には、 契約の直後に共通の検査の行を出発点の sha で埋めて渡し、 commit の後に全部撃って緑にしてから終えるよう読ませます。 runner が正常に終わり commit が在るときは、 器が gate と同じ検査を同じ作業場所で撃ち、 全部緑なら次の段へ進め、 赤なら決めた回数まで runner を起こし直して赤を渡し、 回数を使い切るか測れなかったときは gate へ進めます。 gate は今どおり全部の行を撃ちます。
  （理由）読むだけの道具を選んだのは、 前提を無視して code を読んだ審査役の半分が本物の欠陥を掘り出した一方で、 材料を束ねるやり方は上限で半分以上が落ちるからです。 許可の規則で読みを許さず道具の列で絞るのは、 実測で許可の規則が作業場所の外の読みまで開いたからで、 道具の列と許可の問いを出さない設定の組み合わせだけが、 読みを作業場所の中に閉じました。 契約の審査を出発点の写しの上で読ませるのは、 main の作業場所を書き換えられる穴を閉じ、 審査する契約と同じ出発点の code を読ませるためです。 自動の記憶を切るのは、 同じ契約が走る口座によって違う材料で扱われないためです。 runner に検査の行を渡すだけでなく器が終わりに撃つのは、 渡したかどうかではなく撃って緑かどうかが合格の条件で、 それは散文の注意では確かめられないからです。 赤を gate の後でなく runner の終わりで戻すのは、 判定を出した後に便を戻すと終わった便の数えと着地の列が動くからです。 先回りの審査の判定を本番に写さないのは、 予想の写しで読んだ code が、 祖先が着地した後の code と同じとは言えないからです。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1005（claim）: FR1005 (runner と lens の起動の 1 形・permission を毎回明示) の中で、 lens の permission を器の定数にし、 道具の列と自動 memory の切りを同じ構築点で毎回渡すと主張する。 1 形のままで、 第 2 の構築点は作らない。
  FR1049（claim）: FR1049 (intake の直後の契約の審査) の lens が契約と設計と要件を読むことは変えず、 cwd を審査の木にして材料に無い code の事実を木の現物で確かめさせると主張する。 判定の読みと Reviewed の終端は変えない。
  FR1009（claim）: FR1009 (gate の lens の判定と INCONCLUSIVE) は変えず、 gate の lens も同じ読みの起動形で diff の外の事実を確かめると主張する。
  FR1008（claim）: FR1008 (gate が verify の各行を実走する) は変えず、 gate は終わりの門の結果を持ち越さずに全行を撃つと主張する。
  FR1006（rationale）: FR1006 (runner の終わりの段) は rc 0 かつ commit 1 本以上なら Implemented と決めている。 終わりの門は赤の周に runner を起こし直すので FR1006 の字と食い違い、 SRS の追加 round で FR1006 を改めてから実装の行を起こす理由になる。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録は、 起動の形を 1 か所で組み設定を読まないと決めた ADR-1011 を置き換えず、 そこで決めずに残した審査役の起動の形を決めます。 原則は、 器は各役に合格の条件と判定に要る読みを渡し、 要らない権能は持たせず、 渡したかどうかは散文でなく器の仕組みで決まる、 です。
  改訂状態: current
  置き換える ADR: なし (新規)
  置き換えられた: なし (現行)
  置き換える ADR は無い。 ADR-1011 は器が起こす claude の起動形を 1 関数に置き settings を読まないと決め、 lens の起動形 (道具を絞るか) は射程の外に残した。 本 ADR はその残りを決め、 同じ 1 関数に道具の列と自動 memory の切りを足す。 ADR-1011 の restricted と settings の追加読込を渡さない決定と、 runner の allowlist と plugin の渡し方は不変。 ADR-1010 の共通 verify の宣言と写しの凍結も不変で、 本 ADR は写しの行を runner の本文と終わりの門でも読む。
  照会終端 — PRIN-GIVE-EACH-ROLE-ITS-PASS-CONDITIONS-AND-ONLY-THE-POWERS-IT-NEEDS
  器は各役に、 合格の条件と判定に要る読みを渡し、 役に要らない権能は持たせない。 渡したかどうかは散文でなく器の起動形と器の測りで決まる。
  本 ADR が allow の規則で読みを開く案・材料だけを広げる案・gate の赤を判定の後に戻す案・起動の mode を丸ごと絞る flag の案を退け、 読みの道具だけの起動形と審査の木と終わりの門を選んだのはこの原則に行き着く (これ以上は遡らない照会終端)。
options:
  - id: "OPT1"
    name: "審査役は読みの道具だけ・契約の審査と先撃ちは木の上で読む・runner に共通 verify の節（検査の行の一覧）と終わりの門"
    text: |
      lens は渡された permission mode の値を使わず、 器が dontAsk と道具の列 Read・Grep・Glob を毎回渡し、 allow の規則は渡さない。 dontAsk でない値が渡された周は便の記録に 1 語を残す。 器が起こす claude は自動 memory を読まない。 契約の審査は対象 repo の HEAD に detach した一時の worktree (審査の木) を cwd にし、 判定の後に外す。 先撃ちは材料を組んだ予想の木を cwd にし、 予想の判定は Reviewed に写さない。 雛形は道具と木を正直に書く。 runner の本文に共通 verify の行の節を足し、 runner の終わりに器が gate と同じ行を撃ち、 赤なら同じ worktree で runner を起こし直して赤を渡す。 決め手は分析 (FAIL の根と、 読んだ lens の半分が欠陥を掘り出した実測) と実測 (道具と mode の効き)。
      （平易）審査役には読むだけの道具 3 つだけを渡し、 許可の問いを誰にも出さない設定で起こし、 契約の審査は審査する時点の写しの上で、 先回りの審査は予想の写しの上で読ませ、 口座ごとの自動の記憶は読ませない案です。 runner には共通の検査の行を渡し、 終わった直後に器が同じ行を撃って、 赤なら同じ作業場所で直させます。 審査役は code を読めて書けず、 材料は口座で変わらず、 赤は gate の前に直ります。 代わりに、 読む審査役は時間と token が増え、 緑の便も共通の検査を 2 回撃ちます。
      利点: 審査役は木の中の code を読んで事実を確かめられる (DR1)
      利点: 書きの道具も shell も無く、 cwd の外は読めない (DR2)
      利点: 自動 memory を読まないので、 その分の材料が口座で変わらない (DR3)
      利点: runner は gate の撃つ行を渡され、 器が終わりに撃って赤を戻す (DR4)
      利点: 戻すのは判定の前の runner の turn の延長で、 Gated の終端は動かない (DR5)
      利点: 道具と mode の値は器の定数で、 運用の cmd の字が緩められず、 古い雛形でも審査は止まらない (DR6)
      欠点: 読む lens は 1 回の時間と token が増える (実測で時間はおよそ 2 倍・token の多くは cache の読み)
      欠点: 緑の便も終わりの門と gate で共通 verify を 2 回撃つ
      欠点: 道具と env の名は claude の版に従い、 器の歯は fake の argv と env しか測らない
      欠点: 起動の雛形が dontAsk でない値を渡し続けても審査は止まらないので、 古い雛形は 1 語の記録で見つけるほかない
      欠点: 先撃ちの判定を Reviewed に写さないので、 先撃ちが退役するまで契約の審査は lens を撃ち直す
    verdict: adopted
    reason: "決め手は分析 (FAIL の根と、 読んだ lens の半分が欠陥を掘り出した実測) と実測 (道具と mode の効き)。"
  - id: "OPT2"
    name: "allow の規則で Read と読みだけの git の Bash を許す"
    text: |
      棚卸しの案。 道具は絞らず、 lens に allow の規則で Read と git grep・git show・git log の Bash を許し、 書きの道具を deny の規則で外す。 決め手は実測 (allow の規則は cwd の外の読みを開く)。
      （平易）道具は絞らず、 許可の規則で読みと git の読みの命令を許し、 書く道具を禁止の規則で外す案です。 git の履歴も読める点で勝ります。 けれども実測では、 許可の規則に読みを足すと作業場所の外の file まで読めてしまいました。 許していない命令は承認の問いに倒れ、 人のいない審査役はそこで止まります。 禁止の規則を書き漏らすと書く道具が残ります。
      利点: git の履歴も読め、 base と HEAD を比べられる
      利点: 道具の列の flag に頼らない
      欠点: allow の規則は cwd の外の file も読ませる (DR2)
      欠点: Bash の語の allowlist の外は承認の問いへ倒れ、 無人の lens では止まる
      欠点: deny の規則の書き漏れで書きの道具が残りうる (DR2)
    verdict: rejected
    reason: "決め手は実測 (allow の規則は cwd の外の読みを開く)。"
  - id: "OPT3"
    name: "1 turn・材料だけのまま、 材料の組み手を広げる"
    text: |
      lens に道具を渡さず、 器が逆引きの結果や既存の歯の本文まで材料に束ねる。 決め手は分析 (材料の上限の中に逆引きの全部は収まらない)。
      （平易）審査役には道具を渡さず、 器が逆引きの結果や既存の検査の本文まで材料に束ねる案です。 1 回の費用が今と同じで、 何を読んだかが材料で決まる点で勝ります。 けれども、 外の材料は上限で今でも半分以上落ちています。 器が先に知っている事実しか届かず、 書ける設定の穴も残ります。
      利点: lens の 1 回の費用が今と同じ
      利点: 審査役が何を読んだかが材料で決まる
      欠点: 外の材料は上限で半分以上落ちている (DR1)
      欠点: 束ねる事実を器が先に知る必要があり、 知らない事実は届かない (DR1)
      欠点: 起動形の書きの穴は残る (DR2)
    verdict: rejected
    reason: "決め手は分析 (材料の上限の中に逆引きの全部は収まらない)。"
  - id: "OPT4"
    name: "gate の verify の赤を自動で runner へ戻す"
    text: |
      終わりの門を置かず、 gate の verify が赤の周に Gated を FAIL で終えずに runner を同じ worktree で起こし直す。 決め手は設計 pipeline.md §49 の却下 (判定の後に器が戻すと契約の赤を撃ち直し続ける形が作れる)。
      （平易）終わりの門を置かず、 gate の検査が赤のときに、 便を終わらせず runner を同じ作業場所で起こし直す案です。 共通の検査を 2 回撃たずに済む点で勝ります。 けれども、 判定を出した後に器が便を戻すことになり、 終わった便の数えと着地の列の読みが動きます。 設計はこの形を、 契約の赤を撃ち直し続ける形が作れるとして既に退けています。
      利点: 共通 verify を 2 回撃たずに済む
      利点: 撃つ場所が gate の 1 か所のまま
      欠点: 判定の段の後に戻すので、 終端の数えと着地の列の読みが動く (DR5)
      欠点: gate の lens を撃つ前後で戻る形が 2 つになる
    verdict: rejected
    reason: "決め手は設計 pipeline.md §49 の却下 (判定の後に器が戻すと契約の赤を撃ち直し続ける形が作れる)。"
  - id: "OPT5"
    name: "起動の mode を丸ごと絞る flag (restricted か bare) を渡す"
    text: |
      claude の restricted の mode か bare の mode で lens を起こす。 決め手は ADR-1011 の決定 (起動形を組む 1 関数は restricted を渡さない) と実測 (dontAsk と道具の列で cwd の外の読みは断られた・bare は OAuth を読まない)。
      （平易）claude の起動の mode を丸ごと絞る flag で審査役を起こす案です。 1 つの flag で道具と設定の読みが絞れ、 片方の mode は読みを作業場所の中に閉じることを文書で約束する点で勝ります。 けれども、 その mode は前の記録が「claude を起こす命令を組む関数は渡さない」と決めた flag です。 書く道具を持たない審査役なら止まりはしませんが、 読むだけの道具と許可の問いを出さない設定でも、 実測で同じ効きが得られたので、 前の記録を審査役のためだけに改めるほどの差がありません。 もう片方の mode は subscription の口座で起きません。
      利点: 1 つの flag で道具と設定の読みが絞れ、 restricted は読みを cwd に閉じることを文書で保証する
      利点: bare なら自動 memory と hook も同時に切れる
      欠点: restricted は書きの道具を持たない lens では承認の問いを生まないが、 ADR-1011 が起動形を組む 1 関数に渡さないと決めた flag で、 dontAsk と道具の列で実測上同じ効きが得られる以上、 その決定を lens のために部分 supersede するほどの差が無い (DR6)
      欠点: bare は subscription の口座で起きない
    verdict: rejected
    reason: "決め手は ADR-1011 の決定 (起動形を組む 1 関数は restricted を渡さない) と実測 (dontAsk と道具の列で cwd の外の読みは断られた・bare は OAuth を読まない)。"
basis: [FR1005, FR1006, FR1008, FR1009, FR1049, ADR-1010, ADR-1011]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「審査役」は契約や差分を読んで合否を返す Claude、 「runner」は契約を実装する Claude です。 審査役は「道具は無い」と言われて材料の字だけで判定していましたが、 実際には編集を自動で許す設定のまま、 main の作業場所を起点に起きていました。 runner は、 gate が必ず撃つ共通の検査を知らされていませんでした。 この記録は、 審査役には読むだけの道具 (Read・Grep・Glob) だけを渡し、 契約の審査は審査する時点の repo の写しの上で、 先回りの審査は予想の写しの上で読ませ、 口座ごとの自動の記憶を読ませないと決めます。 先回りの審査の判定は、 本番の審査に写しません。 runner には共通の検査の行を渡し、 runner が終わったら器がその行を撃って、 赤なら同じ作業場所で直させます。
