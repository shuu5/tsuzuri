  器の案の章の要約: 候補を 5 つ並べます。 読むだけの道具と審査用の写しと終わりの門を持つ案 (選んだ案) と、 選ばなかった 4 つです。 選ばなかった案は、 許可の規則で読みと git の読みを許す案・道具を渡さず材料を広げる案・gate の赤を自動で runner へ戻す案・起動の mode を丸ごと絞る案です。
  器の専門語の説明: 本文に出てくる専門語 5 個を、 やさしい言葉で説明します。
  ・読みの道具（read-only tools）: 器が審査役の claude に渡す道具の閉じた列 Read・Grep・Glob (本 ADR)。 書きの道具と shell を持たず、 許可の問いを誰にも出さない mode で cwd の外の読みは断られる。
  ・審査の木（review tree）: 審査役の lens の cwd になる一時の worktree (本 ADR)。 契約の審査では、 器が材料の前に読んだ対象 repo の HEAD の sha を run dir の直下に detach し、 判定の後に外す。 先撃ちでは、 材料を組んだ予想の木 (HEAD に祖先の層を当てた木) で、 lens が終わるまで外さない。
  ・自動 memory（auto memory）: claude が口座の設定 dir の下に cwd ごとに持つ記憶の索引で、 起動時に文脈へ載る (本 ADR)。 器が起こす claude は env で毎回切る。
  ・終わりの門（end gate）: runner の turn が rc 0 かつ commit 1 本以上で終わった直後に、 器が gate と同じ撃ち手で書きの範囲の検査・共通 verify・契約の検証行を便の worktree に撃つ段 (本 ADR)。 赤なら rules 行の周まで同じ worktree で runner を起こし直す。
  ・共通 verify の節（common verify section）: 器が runner の stdin の契約の直後に足す節で、 便の写しの共通 verify の各行を gate と同じ 4 つの穴の埋め方で埋めて並べる (本 ADR)。 runner は commit の後にその行を全部撃って緑にしてから終える。
