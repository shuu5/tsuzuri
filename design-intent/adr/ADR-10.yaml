# 判断の記録 ADR-10 — 相談の窓 consult（発効 2026-09-27・持ち主の裁定 user 2026-09-27T05:44Z・記帳先 = tsuzuri の台帳 t3-hub.1 notes）
# 討論の記録は docs/grill/2026-09-27-I-consult.md。憲法の条 P-16 の扱いは ADR-12（提案中）。
id: ADR-10
title: 相談の窓 consult を orchestrator から分けた使い捨ての窓として置き、相談は台帳に残し、結論は型付きの所見で渡し、窓の間を流れるのは id の 1 行だけにする
status: accepted
date: 2026-09-27
context: |
  持ち主は orchestrator の席を Opus 5.5 で動かすと決めた。全部の orchestrator を最上位の model で動かすと重すぎたためである。代わりに、込み入った設計の相談を別の窓で行い、その窓の model を自由に選べるようにしたいと要望した。既定は Fable である。
  前の世代の器には相談席が 1 日だけ在った。結論は相手の席へ文を送り、受けた席が手で台帳に写す形で、結論に型が無く、受けと処分の記録も無かった。持ち主はこの渡し方がうまくいかなかったと述べた。
  器には待ちの席へ固定の 1 行を送る口が在り、自由な文は送れない。
decision: |
  (1) 役割を 2 つにする（orchestrator と consult）。consult は別の窓で動き、持ち主と直に話す。model は持ち主が選び、既定は Fable とする。
  (2) 相談は台帳の bead として起こす。相談の窓が最初に読む材料は機械が束にして組む（問い・読む file の一覧・導出グラフの近傍・関係する裁定）。
  (3) 相談の窓は結論を型付きの所見として出す。欄は 結論・候補と採否・推奨・根拠の id・主張ごとの確かさ・持ち主に問うべき事・触る節点・使った model・読んだ束の要約値。出す口が欄を検め、欠けていれば受けない。
  (4) 相談の窓から orchestrator へ送るのは、所見の id を指す固定の 1 行だけ。中身は orchestrator が置き場の file から読む。考え中の席には送らず、停止の hook が拾う。
  (5) orchestrator は所見ごとに処分を宣言する（採る・一部採る・採らない と理由）。処分の無い所見は未反映の一覧に載る。採った所見は orchestrator が repo へ写す。
  (6) 承認は裁定面だけで受ける。相談の窓での会話は承認にならない。持ち主の承認が要る決定は、所見を材料に付けて裁定面の問いにする。
  (7) 窓は使い捨てにする。相談の途中の要点は控えに書き足し、model を替えるときは窓を起こし直して束と控えと前の所見から続ける。
  (8) 相談の窓の権能は 読む・repo の外の編集・所見を出す口 の 3 つ。repo の編集・台帳の直の書き・回答・承認・go・便の起動は持たない。repo の書き手は orchestrator の 1 席のままとする。
  (9) 器が対応するまでの当座は、持ち主が窓を手で開き、相談の窓は所見を同じ型と同じ置き場に書き、持ち主が orchestrator に 1 行で知らせる。
options:
  - id: a
    name: 使い捨ての窓と型付きの所見
    text: 決定 (1) から (9)。
    verdict: adopted
    reason: 前の世代の穴（型が無い・打鍵で渡す・手で写す・処分の記録が無い・材料が無い・承認の窓が割れる）を 1 つずつ塞ぎ、器に在る口を使い回せる。
  - id: b
    name: 相談の窓が自由な文を送る
    text: 前の世代と同じく、結論を相手の席の入力欄へ送る。
    verdict: rejected
    reason: 相手が考え中だと衝突し、長い文は崩れ、受け手が手で写す形に戻る。
  - id: c
    name: 相談を orchestrator の subagent にする
    text: orchestrator が別の model の subagent を起こして相談する。
    verdict: rejected
    reason: 持ち主が相談の相手と直に話せず、model を持ち主が選べない。
basis: [P-7, P-12, P-16, P-19, P-20, N-2, ADR-7]
retreat:
  kind: measure
  condition: 所見 10 本のうち処分の無いまま 7 日を越えたものが 3 本以上になったら、渡し方と処分の形を見直す問いを起こす。数えるのは t3:orchestrator 席。
plain: |
  設計の相談をするための別の窓を作ります。この窓の AI は自由に選べて、いつもは Fable です。
  相談の結論は、決まった形の file に書きます。元の窓へ送るのは「結論が届いた」の 1 行だけで、中身は元の窓が file から読みます。
  元の窓は、結論を採るか採らないかを必ず記録します。承認は今までどおり決定の画面だけで受けます。
  窓は使い捨てです。AI を替えたいときは窓を開き直せば、前の続きから相談できます。
  この記録はあなたの承認で発効しています。承認の記帳先は tsuzuri の台帳です。
approval:
  who: 持ち主
  date: 2026-09-27
  ruling: t3-hub.1（裁定 id = user 2026-09-27T05:44Z・notes に逐語）
  verbatim: ３．よい
  surface: R-8
note: 席ごとの model の名指しは要件書の制約 CON6 が持つ。憲法の条 P-16 の今の字（設計判断を下す席は最上位の model）とは食い違うので、改訂を ADR-12 で問う。ADR-12 の発効まで、t3 の orchestrator は最上位の model のままで動かす。
