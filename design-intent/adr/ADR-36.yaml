# 判断の記録 ADR-36 — 器 scribe2 の統合の評価基準 45 と進め方（持ち主の決め 2026-10-03・記帳先 = tsuzuri の台帳の memo t3-hub.74.54 の notes と問い t3-hub.74.54.1・.2 の notes）
# 起草は係 w108a（2026-10-04）。材料は drafts/w103a/w（criteria.md・adr-36-skeleton.md・retro.md）・drafts/w106a/w（baseline.md・criteria-g.md・impact.md）・drafts/w102a/w/refactor.md・頁 s2-scope-20261004 の第 2 版。承認の欄は席が埋めた。
id: ADR-36
title: 器 scribe2 の統合の完了は、評価基準 45 のうち門 32 が全部満ちた木で言い、どの基準もほかの門を幅の外へ下げて良くせず、器の行を 1 本ずつ流す間も tsuzuri の機能の行を止めない
status: accepted
date: 2026-10-03
context: |
  持ち主の求めは 2 つで、memo（t3-hub.74.54）の notes に在る（2026-10-03）。1 つ目は、器 scribe2 の統合の全容を確かめ、一緒に直す所を決め、統合の出来を測る評価基準を先に作ること。2 つ目は、統合と整理のために便の精度・速さ・費用を犠牲にしないこと（費用と精度と開発の速さの釣り合いを保ち、tsuzuri の全体で code を効率よく使えるように整理も同時に進める）と、tsuzuri を実行して比べる実験場を置くこと。実験場は判断の記録 ADR-37 に分ける。
  器の大きさ（main の追跡 file から）。本体 91,572 行・歯の行 126,833 行・歯 4,006 本・設計 md 31 本・判断の記録 html 112 本（提案中 22・器の code が引く 17）。切り替え（ADR-33）は済み、残りの統合の作業は 22 件で、行の本数の見込みは 30〜45。folio2 の統合は便 43・走り 61・落ち 18（gate の不合格 12 のうち 11 回は実装が字を整えた型）・約 2.1 日で、差の file の形に替えた後は大きさの規則の行の落ちが 16 走り中 11 回から 12 走り中 0 回になった。完了の線は除外の表の行 0 で見えたが、振る舞いの同一・費用・運用の線は無かった。
  係の案 32（統合の完了・振る舞い・規則・費用・運用・公開の群 a〜f）は、便の出来を目安の 1 つ（便の落ちの数）と便 1 本の書き込みでしか見ず、統合で便が遅く不正確になっても止まらない形だった。そこで便の出来の群 g の 15 を足した。
  基の値（器の便の記録を数え直した・差の file の形に替えた 10-01 以後の 117 走りと 91 便・2026-10-03 の 22 時台の UTC まで）。1 回目の着地 75.6%（68/90）・着地 1 本あたりの走り 1.30・偽の緑 1 件（着地の後の main の赤で退役した便が 1 本）・受付から着地 中央 27 分・実装済みから gate の判定まで 中央 359 秒（90% 615 秒）・重みつきの token は走り 1 回の中央 55.4 万と着地 1 本あたり 76.7 万・gate の最大のメモリ 26.6 ギガバイト（GB）。重みは入力 1・cache の書き 1.25・cache の読み 0.1・出力 5。本番の記録で見分けられる最小の差（片側 5%・検出力 80%）は、1 回目の着地の率が 40 便で 20.3 点・80 便で 16.4 点、token が 20 走りで 1.27 倍、gate の秒が 20 走りで 1.19 倍。席と係の token は着地 1 本あたり係 380 万・席 150 万で、便の 77 万の約 7 倍。大きさ L の行は 1 回目の着地が 6 本中 1 本。
  決めの在りか。頁の問い 2〜6 は台帳の問いに起こさず頁だけで問い、答え（2026-10-03 の 22 時 58 分 UTC）を memo の notes に逐語で残した（裁定 id は無い）。問い 3 本（基準の形・一緒に直す 6 つ・実験場）は台帳に起こし、どれも案 A に裁定された（裁定 id は承認の欄）。
  数えの注。問い（t3-hub.74.54.1）の字の「門 30・目安 15」は、答え 2 の前の係の案（1 日の書き込みを目安とした形）からの数えである。答え 2 で 1 日の書き込み（基準 D2）が門になり、下の 3 つ目の求めに応えて控えの memo の整理（基準 A6）を目安から門へ上げたので、この記録は門 32・目安 13 と数える（合わせて 45 は替わらない）。
  3 つ目の求め（memo の notes・2026-10-03 の 23 時 21 分 UTC）。tsuzuri の memo と器から移した memo を内容で照らして統合し整理することを、統合と同時に進める。開いた memo は 61 本（器から移した 45・folio2 から移した 7・tsuzuri の 9）で、移した時は字のまま写しただけで、内容の重なりを照らしていない。〔席の決め〕この求めに応えて基準 A6 を門にする。
decision: |
  (1) 基準と完了。統合の評価基準は 45 で、付表 (12) に置く。群 a〜f の 31（係の案 32 から便の落ちの数（基準 D6）を外し、群 g の 1 回目の着地・落ちの型・着地あたりの走りに置き換えた）と、群 g（便の出来）の 15 から便 1 本の書き込み（基準 G11）を基準 D1 と同じ 1 本に数えた 14 である。門は 32（満ちないと統合の完了と言わない）、目安は 13（測って記帳するが完了を止めない）。統合の完了は、門の全部が日に 1 度の全部の撃ち（ADR-34 の決定 (6)）の木で満ちた日に、測りの口 (11) の 1 行と記帳で示して言い、memo の notes に書いて持ち主に知らせる。測りが読めない日の基準は「まだ分からない」とし、満ちたと数えない。目安を門へ上げる時と基準の表を替える時は、新しい判断の記録で行う（この記録の本文は発効で封に凍る）。この記録が式を決めた値（決定 (4) の (エ) の幅）は、式で出した値を memo の notes に記帳して使う。
  (2) 釣り合いの掛け（全部の基準）。1 つの基準を良くするために、ほかの門を幅の外へ下げない。幅は付表の各門の目標の字（例 1.3 倍以内）である。幅の外へ下がった門は満ちていないと数え、下げた行を名指して記帳し、戻すか形を替える行を席が起こす。幅の内の下がりは記帳し、同じ基準が続く 2 つの窓で同じ向きに下がったら持ち主に問う。
  (3) 基の値と窓。基の値は上の事情の欄の 117 走りと 91 便で固め、器の入れ替えごとには替えない。基を替えるのは、差の file の形のような作法の替わりを持ち主が認めた時だけである。本番の門の窓は直近の N 便か N 走りで、N は付表の各基準の字（1 回目の着地 40 便・着地あたりの走り 40 着地・受付から着地 40 便・gate の秒 20 走り・token 20 走りと 20 着地）。「続く 2 つの窓」は、重ならない直近の窓とその前の窓である。窓は統合の行だけの窓と全部の便の窓の 2 つで数え、統合の行が N に満たない間は全部の便の窓を門とし、統合の行だけの窓は記帳する。数えは器の便の記録（便の dir・event の log・審査の判定・git の log・CI の run）から、係の数えの script（runs.py）と同じ式で出す。
  (4) 細目 4（問い（t3-hub.74.54.1）の推奨のとおり）。
  (ア) 1 回目の着地（基準 G1）。本番は「直近 40 便で 55% 以上」の粗い見張り（基の 75.6% から 40 便で見える最小の差 20 点を引いた値）とし、細かい比べは実験場（ADR-37 の形 B）の門にする（決めた仕事の 1 回目の着地の数が基を下回らない）。
  (イ) gate の秒（基準 G7）。器を書く便は器の検査が載って審査が長い（今 627 秒）ので、器を書く便の基は統合の初めの 10 便で別に決める。全部の便の基（359 秒）は器に触れない便で測る。
  (ウ) 席と係の token（基準 G14）は門にせず目安にし、基の 1.5 倍を越えた日は理由を記帳する。門にすると試作と確かめを削る向きの圧がかかり、精度を下げうるためである。
  (エ) 実験場の門の幅（基準 G1 の実験場の分・G6・G11 と D1・G12）は、実験場で同じ仕事を撃ったばらつきから決め直す。それまでは基の 1.2 倍を仮の幅とする。決め直しは ADR-37 の決定 (6) の最初の比べの後に席が行い、式と値を memo の notes に記帳して持ち主に知らせる。
  (5) 費用の門の読み（頁の問い 2 と 3・どれも案 A）。
  (ア) 便 1 本の書き込み（基準 D1 と G11）は門で、目標は器を本体の workspace に入れる前の値より増えないこと。基は器を本体に入れる行の前に実験場（ADR-37 の形 B と G）で測り、便ごとの書きの記録の行（ADR-37 の決定 (7)）の着地の後は本番の記録でも測る。
  (イ) 1 日の書き込み（基準 D2）も門で、目標は 7 日の平均で 1 日 1.5 テラバイト（TB）以下（規則の行 R-40 の線と同じ値）。日ごとの記録を置く行（v-wline-b）の着地までは測れないので「まだ分からない」とし、満ちたと数えない。R-40 の種（detect）と知らせの形は替えない。
  (ウ) 規則の行 R-5 の CI 5 分は、いちばん長い CI の役（job）の秒で読む（基準 D4 の門は 300 秒以下）。run の全体の秒は目安として記帳する。
  (6) 提案中の記録の受け直しの引き金（頁の問い 4・ADR-33 の決定 (8) の読みを替える）。ADR-33 の決定 (8) は、器の提案中の記録 17 本を「その記録を引く器の code を書き直す便を起こす時」に 1 本ずつ受け直すと決めた。この記録はその読みを、記録の決めの字が述べる振る舞いを替える行だけが受け直しの引き金になる、と替える。file を byte のまま移す・名を替える・記録が述べない測りや字だけを直す行は、その記録を引く file を書いても受け直さない。行ごとに、書く file が引く提案中の記録と、その振る舞いを替えるか否かの地図を、その行の設計（ノートの節）に書く。ADR-33 は封で凍っているので本文は替えず、決定 (8) のほかの字（code の注の id を書き換えない・引かない 5 本は資料のまま）はそのまま効く。統合の行で振る舞いを替えなかった記録が完了の前に残れば、その扱い（束ねて受け直すか、前提のまま資料にするか）を席が持ち主に問う。
  (7) 器の文書（頁の問い 5・合わせて直す候補（C8））。器の設計文書 31 本と判断の記録 112 本は凍った資料として残し（ADR-33 の決定 (2) の byte のまま運ぶ形を保つ）、器を直す新しい設計は tsuzuri の設計ノートと判断の記録に書く。器の振る舞いを替える行は凍った文書を直さず、新しい振る舞いをその行の節に書き、凍った文書の § を名指す。器の code の注が凍った文書の § を指す pointer は替えない。
  (8) 器を本体に入れた後の省き（頁の問い 6）。器の crate を本体の workspace に入れる行（v-join）の後、器の入力に触れない便では根の検査の器の段を省く。省く条件と全部を撃つ時は ADR-34 の決定 (1)〜(5) と同じ形（比べる基は送り先の main との合流の基・CI と日に 1 度の撃ちは全部）とする。器の組みの前の script（build.rs）の組み直しの合図は、器の中の直しだけに絞る（行 v-buildrs・v-join の前に置く）。ADR-34 の決定 (8) の見直しは、この形で行い、日に 1 度の全部の撃ちは残す。
  (9) 合わせて直す候補（問い（t3-hub.74.54.2）の案 A）。C4 は決定 (6)、C8 は決定 (7) で済む。残りの 6 つは次の行に乗せる。
  (ア) 候補（C1）は新しい行（v-keys）。tsuzuri の側の歯の段 1 本で、面が読む器の出力の鍵（doctor・席の tick の状態・口座の使用量の表示）と、面の段の event の語と、契約表の欄の写しの差が宣言した差だけであることを照らす。器の code を書かない分は今すぐ流せ、器の側の見本の歯は器の根の宣言の行（v-roots）の後に足す。
  (イ) 候補（C2）は、器の大きさ・lint・本体に入れる・器の照らしを移す行（v-size・v-lint・v-join・v-gates）の中で、根の検査が器を覆った後に器の xtask の同じ役の測りを消す。条件として、消す測りごとに、それを覆う根の歯の名を同じ行の完了の条件（done）に書く。
  (ウ) 候補（C3）は、行（v-join）の中で入れ子の検査の仕組み（約 1,900 行）を根の検査の器の段へ畳む。条件として、日に 1 度の全部の撃ちを残す。
  (エ) 候補（C5）は、行（v-join）の中で器の歯の実行の設定（同時に走らせない 52 本の群）を根の設定へ、部品（package）を名指す形で移す。
  (オ) 候補（C6）は、行（v-join）の中で器の錠の 2 版の部品を根の監査に足すか版を寄せ、監査の歯の一覧も同じ行で直す。ADR-33 の決定 (5) の承認の範囲の外の版が要れば持ち主に問う。
  (カ) 候補（C7）は、行（v-gates）の中で器の公開の走査の 2 つの一覧の語を根の一覧と照らし、根に無い語だけを根へ足してから器の 2 つを消す（語そのものは公開の file に書かない）。
  (10) 行の順と席の決め。推しの順は、名の衝突の解消（v-join-prep・着地済み）・入れ替えの門（v-swap）・組みの使い回しと上限（v-lane・v-lane-cap）・便ごとの記録の 2 行（ADR-37）・旗の行（v-flag-guard・v-flag-drop）・組み直しの合図（v-buildrs）・本体に入れる行（v-join・決定 (8) の省きと候補 C3・C5・C6 を乗せる）・器の根の宣言（v-roots）・lint と大きさ（v-lint・v-size・候補 C2 を乗せる）・器の照らしの移し（v-gates・v-ids・候補 C7 を乗せる）・書き込みの線（v-wline-b・v-wline-c）・写しの照らし（v-keys・候補 C1）ほか。器を書く便は器の根の宣言の行（v-roots）まで同時に 1 本（ADR-33 の決定 (12)）だが、その間も tsuzuri の機能の行は止めずに並べて流す〔席の決め〕。目安は 1 日 20 本以上の着地（基準 G9）で、器の便の待ちは基準 G8 に記帳する。大きさ L の行は置かず M 以下に割って置く〔席の決め〕。行の大きさとノートは置く時に席が決める（ADR-33 の決定 (14) のまま）。
  (11) 測りの口（ADR-37 の形 A の日ごとの数えと重ねる）。
  口 1（席の日ごとの数え・今日から撃てる・cargo を撃たない）。席の道具の置き場の script 1 本が、日に 1 度の全部の撃ちの後に 1 日 1 行を表に足す。中身は群 a〜f の数（除外の表の行・着地した行・受け直しの数・入れ子と錠・器の宣言だけの鍵・PATH の器と HEAD の木の照らし・CI の最長の役と run の全体の秒・全部の撃ちの歯の数・1 日の書き込み）と、ADR-37 の形 A の本番の数え（便の種と大きさの層ごとの便と着地の数・1 回目の着地・走りあたりと着地あたりの token・gate の秒・審査の不合格と INCONCLUSIVE・撃ち直し・main の赤・gate のメモリ・口座の待ち）で、群 g の本番の窓はこの行から読む。形 A の数えはこの口の群 g の半分であり、別の口を置かない。
  口 2（器の記録の行）。ADR-37 の決定 (7) の 2 行（便ごとの版の記録と便ごとの書きの記録）と、doctor に PATH の器の組み元の木と HEAD の木の照らしの行と 1 日の書き込みの線の行を足す小さい行（行 v-swap か v-wline-b に相乗り）。基準 B3・D1・D2・E2 と群 g の費用を本番の記録から読めるようにする。
  口 3（xtask の段）。xtask の check が統合の数（除外の行・入れ子・錠・器の宣言だけの鍵・提案中の記録を引く行）を 1 行で出す段を置く行（v-integ-gauge・大きさ M）。統合の間は detect（落とさない）で、完了の宣言の行で各数を 0 と断言する歯に替えて deny にし、戻りを止める。数え先が落ち着く行 v-join の後に置く。
  順は口 1 → 口 2 → 口 3。
  (12) 付表（基準 45・門 32・目安 13）。各行は「群の id・種・名・目標（今の値）」。測り方と根拠の正本は係の表（drafts/w103a/w/criteria.md と drafts/w106a/w/criteria-g.md）で、この付表と字が違えば付表が勝つ。
  ・（A1・門）規則の除外の表が空。除外の表の行の数が 0（今 4）。表は行の無い形で残す。
  ・（A2・門）段取りの行が全部着地。ADR-33 の決定 (14) の行とこの記録と ADR-37 で足す行が全部着地（今 6/14）。着地は件名の頭の便の id で照らす。
  ・（A3・門）提案中の記録 17 本の始末。17 本のどれも、受け直したか、引く code の行を 0 にして退役と記したか、決定 (6) の末の問い（統合の行で振る舞いを替えなかった記録の扱い）で扱いが決まった（今 0/17）。引き金は決定 (6)。
  ・（A4・門）入れ子と二重の錠が無い。器の workspace の宣言と錠が無く、根の部品の一覧（members）に器の crate が在り、入れ子の段は決定 (8) と候補（C3）の形に畳んだ記録が在る。
  ・（A5・門）器の宣言だけの鍵 6 つを、根の宣言へ移すか退役で退かせた（今 6）。鍵ごとの扱いは起草の前に持ち主に問う。
  ・（A6・門）memo の整理。開いた memo（器から移した 45・folio2 から移した 7・tsuzuri の 9）のうち、内容の重なりを整理していない物が 0。束ごとに、まとめたか、残す理由が付いているかを見る。器と folio2 の古い形だけの話の memo は、見送りか昇格で閉じている。測りは席の script で行う。
  ・（A7・目安）名を tsuzuri に揃える段（tz 化）を、するか・いつかの判断の記録が在る。
  ・（B1・門）器の歯が全部緑で減らない。落ち 0 で数が 4,006 以上。減る時は退役の行の id を記帳する。
  ・（B2・門）根の歯が全部緑。落ち 0。
  ・（B3・門）PATH の器が repo の器と同じ木。組み元の器の木と HEAD の器の木が同じ（器の code の着地から入れ替えまでを除く）。食い違いの最長を記帳する。
  ・（B4・門）入れ替えの門。入れ替えの門の行（v-swap）が着地し、器の code の便の後の入れ替えが手でなく門で済んだ回が 1 以上。
