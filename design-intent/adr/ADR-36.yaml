plain: |
  器（scribe2）を tsuzuri に入れ終えたと言える条件を、45 の物差しで決める記録です（推奨の案）。
  32 は「満たさないと完了と言わない」物差し、13 は「測って記録するだけ」の物差しです。前の案の 32 に、作業の流れ（便）が正しく・早く・安く片付くかを見る 15 を足しました。
  どれかを良くするために、ほかの物差しを決めた幅より悪くしてはいけません。幅の内でも、2 回続けて同じ向きに悪くなったら持ち主に問います。
  本番の記録だけでは細かい違いが見えないので、細かい比べは実験場（ADR-37）で行います。
  器の作業は 1 本ずつ流しますが、その間も tsuzuri の機能の作業は止めません。
  あわせて、記憶の装置の書き込み・CI の 5 分の読み方・承認前の決め事の承認し直し・器の文書の今後・器に触れない作業の検査の省き方も、推奨のとおり決めます。
