  FR1027（implementation）: FR1027 (管理 tick) の alarm の閉じた語 unsorted (局面の出力に未仕分けの発話が在る周・語の定義は FR1027 が持つ) を、 本 ADR の仕分け済みかの判定の結果から局面の出力を経て得る実装側 (alarm は局面の出力の読み手で自前の判定を持たない・FR1094)。 台帳も git も撃たず、 合図を送らない周の席には doctor の行だけが知らせる。
  FR1090（implementation）: FR1090 (局面の出力) の発話の部品 (ts・session・行き先だけで逐語を持たない・経路 gui の発話は session を持たないので部品の session は空) と、 仕分け済みの発話の行き先 (どの memo・どの裁定・会話) を、 本 ADR の仕分け済みかの判定から得る実装側。 発話 event か仕分けの event の記帳の直後の部分の書き直しの契機は、 本 ADR の発話の記帳の hook と仕分けの口の記帳である。 局面の出力の形と書き直しの形そのものは別の決定記録が持つ。
  FR1094（implementation）: FR1094 (局面の出力の読み手) の、 doctor の未仕分けの発話の行 (FR1088) と管理 tick の alarm の語 unsorted (FR1027) が、 局面の出力と同じ判定の結果 (本 ADR の仕分け済みかの判定の関数の結果) を使って自前の判定を持たず、 書きかけの出力を見ず、 古い出力を古いと示す実装側。 turn の終わりの判定は読み手の一覧に無く、 同じ関数を event log から直に撃つ (FR1088 の同じ入力に同じ結果)。
  NFR1005（implementation）: NFR1005 (hook の予算) の、 turn の終わりの判定の hook と発話の記帳の hook の呼出しを各 2.0 秒以内で event log の大きさに依らない読みだけに収める実装側。 turn の終わりの判定は台帳を読まず、 session の開始から後ろの event だけを読む (10 MB と 20 MB の fixture で読む byte が同じことを、 turn の終わりの判定の hook と発話の記帳の hook は AC1058、 発話の記帳と仕分けの記帳の直後の部分の書き直しは AC1060 が確かめる)。 読む量は session の開始から後ろの全部の席の event で長い session ほど伸びるので、 2.0 秒の予算は fixture の外で設計 doc が測る。
