  user の発話は、 3 つの仕分けのどれかで仕分け済みの記録を持つか、 未仕分けと数えて見せるかのどちらかにし、 席の判断で黙って消える発話を残さない。 仕分けの証拠は event に置き、 席へは番号を渡して中身は席が引く。
  本 ADR が記録だけの形・要望の別の種類・器が memo を書く形・チャットの平文の問い・重い問いだけの台帳・画面の server の直の書き・チャットだけの答えを退け、 3 つの仕分けと 1 度の止めと画面の答えの口と asked を採ったのはこの原則に行き着く (これ以上は遡らない照会終端)。 射程は user の発話の仕分けと席から user への問いで、 仕分けそのものの正しさ (要望か会話か) を器が判じることは射程の外に置く。
options:
  - id: "OPT1"
    name: "発話を要望・答え・会話の 3 つに仕分け、 未仕分けの発話（行き先の無い発話）を告げる turn の終わりを 1 度止め、 画面の答えは器の口 1 つで裁定にし、 問いに asked を持たせる"
    text: |
      発話 event に session と発話の経路 (chat＝対話の session・gui＝裁定面) を足し、 裁定の行に経路の欄を足して 5 欄にする。 発話の ts は器が発話ごとに一意に振る (同じ秒は秒より下の桁で分ける)。 要望と会話は仕分けの口が仕分けの event を 1 件記帳するだけで台帳を書かず (3 クラスの承認・runner への回答・go に使った発話も会話で、 承認 event と回答 event には結ばない)、 答えは bind か裁定面の答えの口の裁定 event で仕分け済みになる。 1 つの発話は複数の memo と問いへ仕分けてよい。 仕分け済みかは event だけを読む 1 つの関数が導き、 発話を記帳する対話の session (runner と lens を除く) で未仕分けの発話のうちまだ告げていないものが在る turn の終わりは、 turn の終わりの判定の hook が 1 度だけ止めてその session の未仕分けの発話の ts を全部並べ、 告げ済みだけなら止めず、 判定の入力を読めない周は止めずに読めないことを記帳する。 席は ts を名指して 1 件の逐語を読める。 画面の答えは器の口 1 つが標準入力で逐語を受け、 断る周は発話 event も書かず、 通る周は経路 gui の発話と bind と同じ書きを 1 周で行い、 席の道具の呼び出しとしての撃ちは器の hook の入口が断る。 台帳の問いは asked (seat・user) を持ち、 裁定 event が asked と問いの起票の時刻を持ち、 問いの起票が発話より後の結びを doctor が asked の値ごと (asked 無しは前後に依らず別) に数える。 決め手は分析 (OPT2〜OPT8 の欠点) と裁定 13:12Z・13:14Z・13:47Z (推奨の案を採る)。
      （平易）選んだ案です。 user の発話の記録に、 チャット (対話の session) か画面 (裁定面) かの経路を足し、 チャットの発話にはどの session で打たれたかも足し、 答えの行にも経路の欄を足します。 発話は 3 つの仕分けのどれかで仕分け済みにします。 要望は、 席が仕分けの口で開いた控え (memo) を名指し、 器が記録に 1 件足して結びます。 答えは、 台帳の問いへ結んで裁定にします。 会話は、 同じ口で台帳を変えずに仕分け済みにします (承認や go の返事に使った発話も会話です)。 発話の番号は器が 1 つずつ別に振り、 同じ秒の発話も分けます。 1 つの発話は複数の控えと問いへ仕分けてよく、 会話は他の仕分けを持つ発話には付けられず、 後から要望か答えを足すと会話の仕分けは外れます。 仕分け済みかどうかは記録だけを読む 1 つの関数が決め、 まだ告げていない未仕分けの発話が残ったまま席が turn を終えようとすると、 器が 1 度だけ止めて未仕分けの発話の番号を全部並べて口を告げます (中身は運ばず、 告げ済みの発話だけなら止めません)。 席は番号を名指して 1 件の中身を自分で読めます。 裁定面の答えは、 器の口 1 つが文を受けて画面の経路の発話として記録し、 同じ周に裁定にして番号を返します (空白だけの文や閉じた問いへの答えは何も記録せずに断ります)。 席が自分の道具でこの口を撃つことは器の hook の入口が止めます。 台帳の問いは問いのきっかけ (席が user の判断を求めたか、 user の先立つ指示や方針を受けるためか) の印を持ち、 答えの後で立てた問いの結びを器が印ごとに数えます。 良い点は、 発話が黙って落ちず、 器が台帳へ書く範囲も台帳の記録の種類も増えず、 中身を席へ押し込まず、 turn の終わりの判定が軽く、 チャットと画面が同じ形の裁定になって経路で分けて数えられ、 席が問うた後付けと正しい後付けを混ぜずに数えられることです。 代わりに、 裁定面の答えは信頼の線を下げ (席が起こした別の process や器の plugin を積まない session からは口を撃て、 席は任意の文を渡して答えを作れる)、 問いの印と仕分けの正しさは器が判じず、 turn が延び控えの置き場が増え (止めの理由を Claude Code がどう扱うかは未実測です)、 版を跨ぐ約束が増え、 止めの判定に要る記録を読めない回は止めずに通し、 合図を送らない席には定期の知らせの語が届かず doctor の行だけが知らせることを引き受けます。
      利点: 未仕分けの発話は turn の終わり・doctor・管理 tick の alarm に必ず出て、 席の判断で黙って落ちない (DR1)
      利点: 要望の結びも会話の仕分けも event 1 件で、 器は台帳を書かず、 台帳の記録 (bead) の種類も増えない。 発端（どこから来たか）の結びの正本は仕分けの event の 1 か所 (DR2)
      利点: 仕分け済みかは別の event から導き、 発話 event の欄を書き換えない。 turn の終わりに告げるのは ts の列だけで、 逐語は席が名指して引いたときだけ読む (DR3)
      利点: turn の終わりの判定は台帳を読まず、 session の開始から後ろの event だけを読むので、 event log の全体の大きさに依らない (読みの形は設計 doc) (DR4)
      利点: チャットの答えも裁定面の答えも同じ形の裁定の行と裁定 event になり、 行と記録の経路の欄で数えを分けられる (DR5)
      利点: 後付けの結び（後から立てた問いの結び）を asked の値ごとに分けて出すので、 席が user へ問うた問いの後付け (seat) と、 方針や問われる前の指示の正しい後付け (user) を混ぜない (DR6)
      利点: 消すもの (計測の結ばれない発話の欄・bind の結び済みの断りの広さ) を名指して足す (DR7)
      欠点: 画面の答えの口は、 逐語の信頼の線を画面の分だけ下げる。 器の hook の入口は器の plugin を積む session の道具の呼び出しの command の字面だけを見るので、 席が起こした子 process (常駐の server・script を経た撃ち) と器の plugin を積まない session からは撃て、 席は起こした server へ任意の字を渡して経路 gui の発話と裁定を作れる。 器はそれを経路で分けて数えるだけで止めない
      欠点: asked の値は席が問いの create で書くので、 席が後付けの問いを user と書けば seat の数えに出ない。 器は asked の正しさも、 仕分けの正しさ (要望を会話に仕分ける誤り) も判じない
      欠点: turn の終わりの止め（告げていない分で止める）は、 まだ告げていない未仕分けの発話が現れた turn の終わりごとに席の turn を 1 回ぶん延ばす。 告げ済みの ts の控えと session の開始の位置を state dir の session ごとの置き場に持つ (跨版でない置き場が 1 つ増える)。 止めの理由を Claude Code が transcript でどう扱うか (入力欄への差し込み〔FR1044〕と同じに扱わないか) は未実測 (AC1058 の歯は偽の hook の入力で撃つので Claude Code の扱いは測らない。 器が止めの理由を差し込みと数えないことだけを AC1019 と AC1058 が確かめ、 本物の session での確かめは設計 doc が置く)
      欠点: 跨版の面が増える: event kind 2 (UtteranceSorted・TurnEndUnjudged)・発話 event の key 2 (session・channel) と ts の秒より下の桁・裁定 event の key 3 (asked・question_ts・channel)・台帳の問いの metadata 1 (asked)・裁定の行の欄 1 (経路・4 欄の既存の行は対話の session と読む)・口 3 (utterance sort・utterance show・seat ruling answer)。 古い版の読み手は未知の kind と key を読めない
      欠点: turn の終わりの判定の入力 (event log・告げ済みの控え) を読めない周は止めずに通し (fail-open)、 読めないことを TurnEndUnjudged に記帳するだけなので、 その周の未仕分けの発話は doctor と局面の出力でしか見えない
      欠点: 管理 tick が合図を送らない席 (梯子の列が尽きた席・FR1078 で止めた席) には alarm の unsorted も届かず、 doctor の行だけが知らせる
    verdict: adopted
    reason: "決め手は分析 (OPT2〜OPT8 の欠点) と裁定 13:12Z・13:14Z・13:47Z (推奨の案を採る)。"
  - id: "OPT2"
    name: "記録だけにする (ADR-1083 と FR1082 のまま)"
    text: |
      発話は全部記帳し、 仕分けるかは席の判断に任せ、 計測は結ばれない発話の本数を別の欄に出すだけにする。 決め手は分析 (今日と同じ取りこぼしが残る) と裁定 13:12Z (3 つの仕分けの推奨を採る)。
      （平易）今の決定のまま、 発話は全部記録するが仕分けるかは席に任せ、 結ばれない発話の数を計測に出すだけにする案です。 器に新しい event の種類も口も足さず、 席の turn も止めず、 記録の使い道も狭いままで済む点で勝ります。 けれども、 要望を控えにするかは席の判断のままで、 しなかったことを誰も数えず、 2026-09-28 と同じ取りこぼしが残ります。 結ばれない数は会話と要望が混ざって取りこぼしの数と読めず、 どの発話がどの要望になったかも辿れないので退けました。
      利点: 器に新しい kind も口も hook の働きも足さず、 跨版の面が増えない
      利点: 席の turn は止められず、 user との往復が延びない
      利点: 仕分けの判定という新しい読み手を持たないので、 発話 event の使い道が ADR-1083 (4) のまま狭い
      欠点: 要望を bead にするかは席の判断のままで、 しなかったことを誰も数えず、 2026-09-28 と同じ取りこぼしが残る (DR1)
      欠点: 結ばれない発話の本数は会話と要望が混ざり、 取りこぼしの数として読めない (DR1)
      欠点: 発話から memo への辺を置く場所が無く、 どの発話がどの要望になったかを辿れない (DR1)
    verdict: rejected
    reason: "決め手は分析 (今日と同じ取りこぼしが残る) と裁定 13:12Z (3 つの仕分けの推奨を採る)。"
  - id: "OPT3"
    name: "要望を memo と別の種類の bead にする"
    text: |
      要望に仕分けた発話ごとに、 memo と別の label の bead (要望の記録) を台帳に起こし、 後で memo か契約へ上げる。 決め手は分析 (種類が増え、 memo との境目の判断がまた要る) と裁定 13:12Z。
      （平易）要望に仕分けた発話ごとに、 控え (memo) とは別の種類の記録を台帳に作る案です。 要望が台帳の中で独立に見え、 裁定面も台帳だけで一覧を出せ、 発話と要望の対を台帳の欄で辿れる点で勝ります。 けれども、 台帳の記録の種類が 1 つ増え、 要望と控えの境目の判断が席にまた要り、 要望ごとに記録が増えて台帳が膨らみ、 器が作るなら器の台帳の書きが広がり、 既存の控えに足すだけの要望にも別の記録が要るので退けました。
      利点: 要望が台帳の中で独立の記録として見え、 裁定面も台帳だけを読めば要望の一覧を出せる
      利点: 発話と要望の対が bead の欄に残り、 event log を読まずに辿れる
      利点: 要望の段と memo の段を別に数えられる
      欠点: 台帳の記録 (bead) の種類が 1 つ増え、 要望と memo の境目 (どこから memo に上げるか) の判断が席にまた要る (DR2)
      欠点: 要望ごとに bead が増えて台帳が膨らみ、 起こす書き手が器なら器の台帳の書きが close の外へ広がる (DR2)
      欠点: 1 つの発話が既存の memo に足すだけの要望でも、 別の bead を起こす手が要る (DR7)
    verdict: rejected
    reason: "決め手は分析 (種類が増え、 memo との境目の判断がまた要る) と裁定 13:12Z。"
  - id: "OPT4"
    name: "要望の仕分けで、 器が memo の metadata に発端を書く"
    text: |
      仕分けの口が発話を要望に仕分ける周に、 器が名指した memo の metadata へ発端 (発話の ts) を追記する。 決め手は分析 (器の台帳の書きが close と裁定の行の外の update へ広がる)。
      （平易）要望に仕分けるときに、 器が名指した控えの欄 (metadata) へ発端 (どこから来たか) の発話の番号を書き足す案です。 発端が台帳の控えに在り、 裁定面も席も台帳 1 か所を読めば辿れ、 仕分けの記録を足さずに済む点で勝ります。 けれども、 器が台帳へ書くのは land の終端の close と、 裁定の行と close だけという線を越えて、 欄の書き足しへ広がります。 入れ子の欄を合わせて書く道具が器に無く (外の依存を使わない約束)、 台帳の道具の書きが置き換えか合わせかも測っておらず、 席の別の書き足しとも競り、 発端の置き場が本文の節と欄の 2 つになるので退けました。
      利点: 発端が台帳の memo の欄に在り、 裁定面も席も台帳 1 か所を読めば辿れる
      利点: 仕分けの event を足さずに済む
      利点: memo を開けば、 どの発話から来たかがすぐ分かる
      欠点: 器の台帳の書きが、 land の終端の close と bind の裁定の行と close の外の update へ広がる (ADR-1045 §2・ADR-1051 の線) (DR2)
      欠点: 入れ子の JSON を併合して書く道具が器に無く (実行時の依存は 0 本・NFR1003)、 bd の metadata の書きが置換か併合かも実測されていない。 席が書く別の metadata の書きとも競る (DR2)
      欠点: 発端の置き場が memo の本文の 1 つ目の節 (人が読む写し) と metadata の 2 つになり、 どちらが正本かの判断が要る (DR7)
    verdict: rejected
    reason: "決め手は分析 (器の台帳の書きが close と裁定の行の外の update へ広がる)。"
  - id: "OPT5"
    name: "席はチャットの平文で問い、 答えの後に問いを起こして結ぶ (今の形のまま)"
    text: |
      席の問いを台帳に先に立てることを求めず、 user が答えた後に席が問いを起こして bind で結ぶ。 決め手は分析 (待っている問いが見えない) と裁定 13:14Z (席の問いは必ず台帳の問いにする推奨を採る)。
      （平易）席の問いを台帳に先に立てることは求めず、 席はチャットの平文で問い、 user が答えた後に問いを立てて結ぶ、 今の形のままの案です。 問いを立てるときの欄も門も足さず、 席の問い方が今のままで、 答えは今でも裁定の行になる点で勝ります。 けれども、 待っている問いが台帳に無く、 圧縮で消え、 数も年齢も裁定面の決定待ちの一覧にも出ず、 席が平文で問うたことと正しい後付けを分けて数えられないので退けました。
      利点: 問いの create に新しい欄も門も足さず、 席の問い方が今のまま
      利点: 答えは今でも bind で裁定の行になり、 裁定の証拠は変わらない
      利点: 問いを立てる手間が答えの後にしか要らず、 答えられなかった問いが台帳に残らない
      欠点: 待っている問いが台帳に無く、 圧縮で消え、 数も年齢も裁定面の決定待ちの一覧にも出ない (DR5)
      欠点: 席が平文で問うたことと正しい後付けを分けられず、 平文の問いを数えられない (DR6)
    verdict: rejected
    reason: "決め手は分析 (待っている問いが見えない) と裁定 13:14Z (席の問いは必ず台帳の問いにする推奨を採る)。"
  - id: "OPT6"
    name: "3 クラスと憲法の問いだけを台帳に立て、 ほかはチャットで問う"
    text: |
      重い問い (消す・出す・使う・憲法と閾値) だけを台帳の問いに立て、 軽い問いは平文で問う。 決め手は分析 (軽重の境目の判断がまた要る) と裁定 13:14Z。
      （平易）消す・出す・使うの操作と憲法や閾値の問いのような重い問いだけを台帳に立て、 軽い問いはチャットで問う案です。 台帳の問いが少なく、 user の決定待ちの一覧が重い問いだけになり、 軽い問いは速く済む点で勝ります。 けれども、 どの問いが重いかの判断が席にまた要り、 その誤りは誰も数えず、 軽い問いへの答えは台帳に残らず、 チャットと画面で同じ裁定になる形が一部の問いにしか効かないので退けました。
      利点: 台帳の問いの数が少なく、 user の決定待ちの一覧が重い問いだけになる
      利点: 軽い問いはチャットの往復で速く済む
      利点: 重い問いは必ず記録に残る
      欠点: どの問いが重いかの判断が席にまた要り、 境目の誤りは誰も数えない (DR6)
      欠点: 軽い問いへの答えは台帳に残らず、 チャットと画面で同じ裁定の行になる形が一部の問いにしか効かない (DR5)
    verdict: rejected
    reason: "決め手は分析 (軽重の境目の判断がまた要る) と裁定 13:14Z。"
  - id: "OPT7"
    name: "裁定面の server が scribe2 の台帳へ直に書く"
    text: |
      消費側の project が自分の台帳に対して今している形を scribe2 の問いにも広げ、 その server が scribe2 の問いの notes に裁定の行を書いて問いを close する。 決め手は分析 (画面の答えに器の口の断りも裁定 id の発行も記帳も効かない・ADR-1083 が退けた形に近い) と裁定 s2-07l.739.1:20260928T1347Z-1。
      （平易）別の project が自分の台帳に対して今している形を scribe2 の問いにも広げ、 裁定面の server が scribe2 の台帳の問いに答えの行を直に書いて問いを閉じる案です。 器に新しい口が要らず、 server が既に持つ書き方をそのまま使え、 答えがすぐ台帳に着く点で勝ります。 けれども、 画面の答えについては、 器の口の断り・裁定の番号の発行・発話と裁定の記録・経路の数えが効きません (席が起こした別の process の撃ちを止められないのは選んだ案も同じです)。 前の決定 (ADR-1083) が退けた「server だけが番号を出し、 器は発話を記録しない」形に近く、 画面の経路の裁定だけが器の外の番号と書きになり、 1 つの server が複数の repo の台帳へ書く形にもなるので退けました。
      利点: 器に新しい口を足さずに済む
      利点: 消費側の server が既に持つ書きの形をそのまま使える
      利点: 画面の答えがすぐ台帳に着く
      欠点: 画面の答えについて、 器の口の断り (空白だけ・閉じた問い・問いでない bead)・裁定 id の発行・発話 event と裁定 event の記帳・経路の数えが効かない (席が起こした子 process の撃ちを止められないのは OPT1 も同じ) (DR5)
      欠点: ADR-1083 が退けた形 (server だけが id を発行し器は発話を記録しない) に近く、 画面の経路の裁定だけが器の外の id と書きになる (DR5)
      欠点: 1 つの server が複数の repo の台帳へ書く形になり、 repo ごとの台帳の形の違いを server が持つ (DR7)
    verdict: rejected
    reason: "決め手は分析 (画面の答えに器の口の断りも裁定 id の発行も記帳も効かない・ADR-1083 が退けた形に近い) と裁定 s2-07l.739.1:20260928T1347Z-1。"
  - id: "OPT8"
    name: "scribe2 の問いは画面で答えさせず、 チャットだけで答える"
    text: |
      裁定面は scribe2 の問いを一覧に出すだけにし、 答えは user が scribe2 の対話の session で打つ。 決め手は分析 (チャットでも画面でも同じ裁定の行になる、 の裁定と食い違う) と裁定 s2-07l.739.1:20260928T1347Z-1。
      （平易）裁定面には scribe2 の問いを一覧で見せるだけにし、 答えは user が scribe2 のチャットで打つ案です。 「言葉は user が打った文だけ」という信頼の線が下がらず、 器に新しい口も門の断りも足さず、 偽の答えを作れる道も増えない点で勝ります。 けれども、 「チャットで答えても画面で答えても同じ裁定の行になる」という裁定 (2026-09-28T13:14Z) と食い違い、 user は一覧で問いを見てもその場で答えられず、 scribe2 のチャットへ移る手が要るので退けました。
      利点: 逐語は user が打った prompt だけ、 という信頼の線が下がらない
      利点: 器に新しい口も hook の断りも足さず、 ADR-1083 がそのまま立つ
      利点: 偽の発話を作れる経路が増えない
      欠点: 裁定 13:14Z の「チャットで答えても画面で答えても同じ裁定の行になる」と食い違う (DR5)
      欠点: user は一覧で問いを見ても、 その場で答えられず、 scribe2 のチャットへ移る手が要る (DR5)
    verdict: rejected
    reason: "決め手は分析 (チャットでも画面でも同じ裁定の行になる、 の裁定と食い違う) と裁定 s2-07l.739.1:20260928T1347Z-1。"
basis: [FR1022, FR1027, FR1044, FR1065, FR1078, FR1081, FR1082, FR1088, FR1089, FR1090, FR1091, FR1092, FR1094, NFR1003, NFR1005, AC1019, AC1058, AC1060, ADR-1004, ADR-1016, ADR-1031, ADR-1045, ADR-1051, ADR-1056, ADR-1077, ADR-1083, ADR-1084, ADR-1085]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「席」は器が立てる対話の AI の session、 「user」は器を使って決める人、 「台帳」は仕事と裁定を記録する beads、 「裁定面」は別の project が持つ、 user が裁定を書き込む画面です。 前の決定 (ADR-1083) で、 器は user が打った文 (発話) を一字一句全部記録し、 席から user への問いを台帳の決まった形 (台帳の問い) に立てて答えの文と結ぶことにしました。 けれども、 発話を要望として控え (memo) にするかは席の判断のままで、 しなかったことを誰も数えず、 席の問いの多くはチャットの平文の中だけに在り、 1 つの発話で複数の問いに答える形も、 裁定面で答える形もありませんでした。 本 ADR は、 user の発話を 要望・答え・会話 の 3 つのどれかに仕分けさせ (仕分けないものは未仕分けと数えて見せ)、 まだ告げていない未仕分けの発話が残ったまま席が turn (1 回の応答) を終えようとしたら器が 1 度だけ止めて未仕分けの発話の番号を全部告げること (告げ済みの発話だけなら止めません)、 席の問いに問いのきっかけの印 (asked) を持たせ、 答えの後に立てた問いの結びを器が印ごとに数える (seat の印の分が、 席がチャットだけで問うてから問いを立てた形です。 印は席が付け、 器は正しさを判じません) こと、 裁定面の答えを器の口 1 つで裁定として記録し、 答えの行と記録にチャットか画面かの経路を残すことを決めます。 その口は承認を受ける口ではありません。 要件 FR1088・FR1089 を支え、 FR1082・FR1065・FR1022・FR1044 の改訂の理由を持ち、 FR1081・FR1027・FR1090・FR1094・NFR1005 に実装の形を与え、 ADR-1083 の一部を置き換えます。 裁定面の答えを裁定と認めることは、 user が裁定 (2026-09-28T13:47Z) で決めました。 その代わり、 画面の答えについては「言葉は user が打った文だけ」という信頼の線を画面の分だけ下げます (席が起こした別の process や器の plugin を積まない session から撃てば答えを作れ、 器は経路で分けて数えるだけです)。
approval:
  who: 持ち主
  date: 2026-09-28
  ruling: "s2-07l.739.1:20260928T1347Z-1・s2-07l.739.1（器の台帳の id・器の記録の承認の欄が名指す・取り込みの裁定 t3-hub.74.60.1:20261004T0113Z-1）"
  verbatim: "器の台帳 s2-07l.739.1:20260928T1347Z-1・s2-07l.739.1 の notes に在る（この file に写さない）"
  surface: R-8
consequences:
  - "この判断で良くなること 4 つと、 代わりに引き受けること 9 つです。 良くなるのは、 どれにもならずに消える発話が無くなり未仕分けの発話が必ず見えること、 席の問いが台帳に残ってチャットでも裁定面でも同じ形の裁定の行になり経路で数えを分けられること、 1 つの発話で複数の問いに答え複数の控えの発端になれ、 器が台帳へ書く範囲は広がらないこと、 席がチャットだけで問うてから問いを立てた形を記録の前後で印ごとに数えられることです。 引き受けるのは、 裁定面の答えは信頼の線を下げ、 席が起こした別の process や器の plugin を積まない session からは口を撃てて答えを作れること、 問いの印と仕分けの正しさは席が決めて器は判じないこと、 版を跨ぐ約束が増えること、 turn が 1 回ぶん延び控えの置き場が増えること、 止めの判定に要る記録を読めない回は止めずに通し (読めなかったことは記録に残します)、 合図を送らない席には定期の知らせの語が届かず doctor の行だけが知らせること、 設計の文書を実装より先に書き換える要があること、 止めの判定が読む量は長い session ほど伸びること、 画面で 1 つの答えを複数の問いへ束で返すと同じ文の発話の記録が問いの数だけできること、 user が自分で開いた登録の無い session でも turn の終わりが止まることです。"
  - "良い結果: 要望・答え・会話のどれにもならずに消える発話が無くなり、 未仕分けの発話は turn の終わり・doctor・管理 tick の alarm に出る"
  - "良い結果: 席の問いが台帳に残って圧縮で消えず、 チャットでも裁定面でも同じ形の裁定の行になり、 行と記録の経路の欄で数えを分けられる"
  - "良い結果: 1 つの発話で複数の問いに答え、 複数の memo の発端になれる。 発端の結びの正本は仕分けの event の 1 か所で、 器の台帳の書きは広がらない"
  - "良い結果: 席が対話の session だけで問うてから問いを起こした形を、 字面の推測でなく問いの起票と発話の前後を asked の値ごとに分けて数える"
  - "代償: 画面の答えは信頼の線を画面の分だけ下げる。 席が起こした子 process (常駐の server・script を経た撃ち) と器の plugin を積まない session からは答えの口を撃てるので、 席は起こした server に任意の字を渡して経路 gui の発話と裁定を作れる。 器は経路で分けて数えるだけで止めない"
  - "代償: asked の値と仕分けの正しさは席が決め、 器は判じない。 後付けの問いを user と書けば seat の数えに出ず、 要望を会話に仕分ければ取りこぼしは残る (行き先の一覧で user が見る)"
  - "代償: 跨版の面が増える (kind 2 〔UtteranceSorted・TurnEndUnjudged〕・発話 event の key 2 と ts の秒より下の桁・裁定 event の key 3・裁定の行の欄 1・台帳の問いの metadata 1・口 3)。 古い版の読み手は未知の kind と key を読めない"
  - "代償: まだ告げていない未仕分けの発話が現れた turn の終わりごとに席の turn が 1 回ぶん延び、 告げ済みの ts の控えと session の開始の位置を持つ置き場が state dir に増える"
  - "代償: turn の終わりの判定の入力を読めない周は止めずに通し (fail-open)、 読めないことを記帳するだけなので、 その周の未仕分けの発話は doctor と局面の出力でしか見えない。 合図を送らない周の席には alarm の unsorted も届かない"
  - "代償: 設計 dialogue-surface.md §4・fleet-event-log.md §9・ledger-form.md §3 の 8 (b) (memo の本文の 1 つ目の節と memo の plan の口) を、 仕分けと答えの口の実装より先に書き換える要がある"
  - "代償: turn の終わりの判定が読む量は session の開始から後ろの全部の席の event で、 event log の全体の大きさには依らないが、 長い session ほど伸びる。 2.0 秒の予算 (NFR1005) は、 AC1058 の fixture (event log の全体の大きさだけが違う) の外で設計 doc が測る"
  - "代償: 答えの口は問い 1 つを受けるので、 裁定面で 1 つの答えを N 問へ束で返すと、 同じ逐語の発話 event が N 件できる (bind の 1 発話 n 問と非対称)"
  - "代償: turn の終わりの止めは、 器が発話 event を記帳する対話の session なら runner と lens のほかは全部に掛かるので、 user が自分で開いた登録の無い session でも turn の終わりが止まる"
