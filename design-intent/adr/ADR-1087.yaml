  置き換えられた: なし (現行)
  部分 supersede で、 ADR-1083 から置き換えるのは 7 点 — (a) 決定 (4) の「使い道は bind の写し元と到達点の計測の分類だけ」を、 それに仕分け済みかの判定・問いの起票との前後の比べ・局面の出力の発話の部品 (この 3 つは発話 event の ts と session と仕分けの event だけを読み、 逐語を読まない) と、 席が ts を名指して 1 件を読む口を足した使い道に。 「状態を持たず」は、 発話 event に状態の欄を持たせず仕分けを別の event から導く、 と読み直して保ち、 逐語を起動行・圧縮の直前の枠・合図・通知・一覧へ運ばない句は保って、 運ばない先に局面の出力・doctor の行・turn の終わりの止めの理由を足す。 (b) DR5 の「記録を席へ運ばず」と、 原則 PRIN-THE-OWNER-TYPES-THE-RULING の text の「席はその字を指して結ぶだけにする」「記録は裁定の写し元であって、 席へ運ぶ指示ではない」と note の「席へは id だけを返す」を、 席が仕分けの口を撃つことと、 席が自分で ts を名指して 1 件の逐語を引く読み (utterance show) を加えた形に (器から席へ逐語を押し込む経路は増やさない)。 (c) 決定 (3) の「その ts の発話が未だ結ばれず」(1 つの発話は 1 つの裁定にだけ結ぶ) の断りを、 同じ発話と同じ問いの組の断りに (1 つの発話は複数の問いへ結べる・裁定 id の n は 1 のまま・ts がちょうど 1 つの発話を指す条件は保つ)。 (d) 発話の経路が裁定面 (gui) の発話について、 DR1「裁定の字は持ち主が打った字だけで、 席はその字を打てない」と、 決定の頭の C7.2 の読み (器の hook が prompt の入口で記録した字) と、 原則の text の「持ち主が打った字を器が記録したもの」 (持ち主は本 ADR の語では user) と、 決定 (2) の発話 event の書き手が prompt の入口の hook だけであることを、 答えの口が標準入力で受けた字も逐語と読み、 その口を経路 gui の発話 event の 2 つ目の書き手とする形に (置き換えの裁定は 裁定 id s2-07l.739.1:20260928T1347Z-1。 経路 chat の書き手は hook だけのまま)。 (e) 決定 (3) の裁定の行の形 (裁定 id・問い・発話の ts・逐語の 4 欄) を、 発話の経路の欄を逐語の前に足した 5 欄に (裁定 id を 1 つ目の欄に、 逐語を最後の欄に置く順とその理由は保つ。 4 欄の既存の行は経路を対話の session と読む)。 (f) 決定 (1) の起票の門の 3 形のうち、 台帳の問いの create の形 (4 行と effect) を、 asked の欠けと値の外・label intake:memo の併せ持ち・親を名指して親の label を継がない指定を持たない書きも断る形に広げる (形の数と他の 2 形は変えない)。 (g) justifies FR1022 の note の「結ばれない発話の本数を別の欄に出す」 (到達点の計測の欄) を、 未仕分け・要望・会話の 3 欄に。 置き換えでなく足すだけなのは、 決定 (2) の発話 event の key session と channel (経路 gui に限らず全部の発話に)・決定 (3) の裁定 event の key asked と question_ts と channel・event kind UtteranceSorted と TurnEndUnjudged (turn の終わりの判定の入力を読めない周の記帳・actor は machine・key session と reason) で、 どれも任意の key と閉じた型の末尾の kind の追加なので event log の schema 番号は変えない (ADR-1004 §2.5)。 発話を指す ts は器が発話ごとに一意に振り、 同じ秒の発話を秒より下の桁で分ける (ADR-1083 が引き受けた同じ秒の 2 発話を結べない穴を塞ぐ・ts の形は設計 doc の fleet-event-log の key の表で、 秒までの旧い行はそのまま読む)。 裁定 event の欄は FR1082 が持ち、 機械の key の名の一覧の正本は以後本 ADR に在る。 保つのは、 UtteranceReceived と RulingReceived の kind と actor・bind の口と裁定 id の形・結びの口と答えの口が承認の受理面でなく承認 event を記帳しないこと (承認は R-C7-1 の対話面の口だけが受け、 ADR-1016 §2.3 の対話面を増やさない読みと ADR-1083 CTX6 の読みはそのまま)・裁定 id の実在と未反映の裁定 (決定 (5)(6))・台帳の問いの 4 行と effect。 問いの close の理由の字面 (ADR-1083 の「裁定」で始まる形) の正本は ADR-1089 に移り、 本 ADR は変えない。 ADR-1083 が退けた「裁定面の server だけが id を発行し器は発話を記録しない」形に近い、 裁定面の server が scribe2 の台帳へ直に書く形は本 ADR でも退ける (OPT7)。 裁定面への書き込みは器の裁定 event でない、 という ADR-1077 の読みは、 scribe2 の台帳の問いへの答えを答えの口へ渡した分についてだけ変わる。 答えの口の撃ちを断るのは器の hook の入口で、 ADR-1056 の起票の門には断りを足すだけで置き換えない。 ADR-1045 §2 (2) の直命の表の削除と、 ADR-1045 §2・ADR-1051 の器の台帳の書きの範囲 (land の終端の close と bind の裁定の行と close・答えの口は bind と同じ書き) は変えない。 ADR-1077 の裁定の指し示しの口と裁定面の記帳 id には触れない。
