  器の案の章の要約: 候補を 8 つ並べます。 3 つの仕分けと 1 度の止めと裁定面の答えの口と問いの印を置く案 (選んだ案)、 記録だけにする今の形、 要望を控えと別の種類の記録にする案、 要望に仕分けるときに器が控えの欄へ発端 (どこから来たか) を書く案、 席はチャットで問い答えの後に問いを立てる今の形、 重い問いだけを台帳に立てる案、 裁定面の server が scribe2 の台帳へ直に書く案、 scribe2 の問いはチャットだけで答える案です。
  器の専門語の説明: 本文に出てくる専門語 16 個を、 やさしい言葉で説明します。
  ・発話 event（utterance event）: user の打った字を逐語のまま残す event (kind UtteranceReceived・actor は human・発話を指す値は ts)。 本 ADR で key channel (発話の経路) を持ち、 経路 chat の行 (書き手は発話の記帳の hook) は key session も持ち、 経路 gui の行は session を持たない (発話の部品の session は空)。 ts は器が発話ごとに一意に振る (同じ秒は秒より下の桁で分ける)。 状態の欄を持たず、 仕分け済みかは別の event から導く。 使い道は裁定の行の写し元・計測の分類・仕分け済みかの判定・問いの起票との前後の比べ・局面の出力の発話の部品・席が ts を名指して 1 件を読む口だけ。
  ・発話の経路（utterance channel）: 発話 event (FR1082) の key channel が持つ閉じた 2 値 (対話の session・裁定面。 機械の値は chat と gui)。 対話の session (chat) は prompt を発話の記帳の hook が記帳したもの、 裁定面 (gui) は画面の答えを器の答えの口が標準入力で受けたもの。 裁定 event と裁定の行も経路を持ち、 計測は裁定 event を経路ごとに数え (FR1022)、 4 欄の既存の裁定の行は対話の session と読む。 選択式の問いを止めた周に告げる問いの経路 (ADR-1084) とは別。
  ・発話の仕分け（utterance sorting）: user の発話の行き先を決める閉じた 3 つの形 (SRS の語は 仕分け・FR1088)。 要望 (開いた memo へ発端として結ぶ・event kind UtteranceSorted の sorting=request)・答え (台帳の問いへ結んで裁定にする・裁定 event)・会話 (台帳を変えずに仕分け済みにする・sorting=chat。 3 クラスの承認・runner への回答・go に使った発話も会話で、 承認 event と回答 event には結ばない)。 要望と会話は仕分けの口 utterance sort が記帳し (actor は machine で人由来の数えに入らない)、 器は台帳を書かない。 仕分けが正しいかは器が判じない。
  ・未仕分けの発話（unsorted utterance）: 発話 event のうち、 仕分けの event も裁定 event の結びも持たないもの。 判定は event だけを読む 1 つの関数で、 turn の終わりの止めと局面の出力が同じ入力に同じ結果を出し、 doctor の行と管理 tick の alarm の語 unsorted は局面の出力の判定の結果を読む (FR1094)。
  ・turn の終わりの止め（turn-end stop）: 器が発話 event を記帳する対話の session (runner と lens を除く) で席の turn が終わる周に、 その session の未仕分けの発話のうち止めでまだ告げていないものが 1 つ以上在れば、 turn の終わりの判定の hook が 1 度だけ終わりを止め、 その session の未仕分けの発話の ts を全部並べて仕分けの口を告げること。 判定の入力を読めない周は止めずに TurnEndUnjudged を記帳する (fail-open)。 止めた周は、 登録された席の session なら idle を打たない。 告げ済みの未仕分けの発話だけの周は止めない。 入力欄への差し込み (FR1044) ではなく、 逐語は運ばない。
  ・答えの口（answer mouth）: 裁定面が台帳の問いへの答えを器に渡す器の口 (seat ruling answer)。 逐語を command の字面の外 (標準入力) で受け、 空白だけ・問いが閉じている・bead が問いでない周は発話 event も書かずに断り、 通る周は経路 gui の発話 event と bind と同じ書きを 1 周で行って裁定 id を 1 行返す。 bind と同じく裁定の行を書く口で、 承認の受理面でなく承認 event を記帳しない。 席の道具の呼び出しとしての撃ちは器の hook の入口 (起票の門とは別) が断るが、 席が起こした子 process の撃ちは門の外。
  ・裁定面（ruling surface）: 消費側の project が持つ、 user が裁定を書き込む画面と server (器の外の置き場・ADR-1077)。 面への書き込みは器の裁定 event でも承認 event でもないが、 本 ADR 以後、 scribe2 の台帳の問いへの答えを答えの口へ渡した分だけは器の裁定 event になる。 承認 event はどの分も受けない。
  ・裁定の行（ruling line）: 台帳の問いの notes に器の口 (bind と答えの口) だけが書く 1 行 (ADR-1083)。 本 ADR で裁定 id・問い・発話の ts・発話の経路・逐語の 5 欄にする。 裁定 id を 1 つ目の欄に、 逐語を最後の欄に置く (user の字の中の区切りの字で欄が割れない) のは ADR-1083 のまま。 4 欄の既存の行は経路を対話の session と読む。
  ・台帳の問い（ledger question）: 席から user への問いを記録する台帳の bead (label intake:question・ADR-1083)。 本 ADR で metadata asked を持ち、 label intake:memo を併せ持たず、 親を名指す create は親の label を継がない指定を持つ。 形は起票の門が検査する。
  ・asked（asked）: 台帳の問いの metadata の key (問いのきっかけ・値の意味は FR1089)。 閉じた 2 値 seat (席が user の判断を求めた問い) と user (user の先立つ指示や方針を受けるために席が起こした問い)。 欠けと値の外は起票の門が断る。 値の正しさは器が判じない。
  ・後付けの結び（late-raised binding）: 台帳の問いが、 結んだ発話より後に起票された結び。 doctor が asked の値ごとの件数と裁定 id で出し、 asked を持たない問いの結びは、 後付けか否かに依らず asked 無しとして別に数える。 asked が seat の分は席が対話の session だけで問うてから問いを起こした形 (FR1089)、 user の分は先立つ指示や方針を受けた後付け。
  ・裁定 event（ruling event）: bind か答えの口が問いと発話を結んだときに 1 件記帳する event (kind RulingReceived・ADR-1083)。 欄とその列挙は FR1082 が持ち、 本 ADR が機械の key asked・question_ts・channel を足して key の名の一覧の正本を持つ。 到達点の計測では承認の側に数え、 経路ごとに分ける。 承認 event とは別の kind。
  ・直命の表（directive table）: 前の器が user の発言を 1 件ずつ状態付きで持ち、 復元で席へ運んだ記録 (ADR-1031)。 ADR-1045 §2 (2) で消えた。 発話 event は状態の欄を持たず、 仕分け済みかは別の event から導き、 逐語を席へ押し込まないので、 これの復活でない。
  ・部品（part）: 局面の出力 (FR1090) が局面と手番を導く単位で、 閉じた 9 種 (発話・台帳の問い・memo・契約・開いた契約の最新の便・契約表の行・要件・epic・器の便でない着地の commit)。 本 ADR が触るのは発話の部品で、 ts・session・行き先だけを持ち逐語を持たない。
  ・発端（origin）: 部品を生んだ上流。 memo なら生んだ user の発話で、 その結びの正本は仕分けの event (sorting=request・FR1088)、 memo の本文の 4 つの節の 1 つ目は人が読む写し。 器の便でない着地の commit なら発端の trailer が名指す台帳の bead (FR1092)。
  ・起票の門（ledger write gate）: 器の plugin を積む席の hook が bd / bdw の書きに掛ける門 (ADR-1056)。 本 ADR で、 台帳の問いの create の asked の欠けと値の外・label intake:memo の併せ持ち・親を名指して親の label を継がない指定を持たない書きを断る形を足す。 command の字面だけを読み、 台帳を読まない。 答えの口の撃ちを断る器の hook の入口の判定とは別。
  器の頁の末: このページは、大もとの機械データ (正本) から自動で組み立てられています。構造は機械が自動で検査し、内容が元データに忠実かは独立のレビューで確かめます。
