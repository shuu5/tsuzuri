# 判断の記録 ADR-1087 — 器 scribe2 の判断の記録 ADR-0087 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1087
title: "user の発話は要望・答え・会話の 3 つに仕分け、 席の問いは台帳の問いにする — 仕分けの event・未仕分けの発話を告げる turn の終わりの 1 度の止め・裁定面の答えの口・問いの asked と後付けの数え (ADR-1083 の 7 点 〔発話の使い道と席へ運ばない線・結び済みの断り・裁定の行の形・問いの門・計測の欄と、 裁定面の経路について C7.2 の読み・DR1・決定 (2)・原則〕 を部分 supersede)"
status: accepted
date: 2026-09-28
context: |
  ADR-1083 は user の打った字を全部記帳し、 席の問いを台帳の問いに立てて答えの字を結ぶ形を決めた。 けれども要望になるべき発話を bead にするかは席の判断のままで、 しなかったことを誰も数えず、 席の問いの多くは平文のまま台帳に立たず、 1 つの発話で複数の問いに答える形も、 裁定面で答える形も無い。 本 ADR は、 発話を要望・答え・会話の 3 つのどれかに仕分けさせ、 まだ告げていない未仕分けの発話が在る turn の終わりを 1 度止めて告げ、 席の問いに問いのきっかけの印を持たせ、 画面の答えを器の口 1 つで裁定にする形を決める。
  なぜこの判断が要るのかを 7 つで示します。 経緯 (前の決定は user の文を全部記録し、 問いと答えを結ぶ口を置いたが、 記録の使い道を 2 つに閉じた)・事象 (要望が控えにならずに落ち、 席の問いはチャットの中だけで、 1 つの文で答えた複数の問いを結べない)・現物 (器の hook の口は 6 つで、 turn の終わりの hook は席を「空いた」と記録し、 定期の見回りは記録を全部読む)・隣の形 (別の project は自分の画面の答えを自分の台帳に書き、 チャットの文は席が控えへ手で写す)・前の器の直命の表との線・憲法の向き (裁定面の字も user の言葉と読むか、 承認を受ける面、 編集の時点で止める約束の読み方)・射程 (動かすものと動かさないもの) です。
  CTX1 経緯 — ADR-1083 は user の全 prompt を記帳し、 台帳の問い（台帳に立てる問い）と発話を結ぶ口を置いたが、 発話の使い道を結びと計測の分類に閉じた
  ADR-1083 は、 器の名を言う repo で器の plugin を積む対話の session に user が打った prompt を、 問いの有無に依らず event kind UtteranceReceived (actor が human・発話を指す値は ts) に逐語で記帳し (範囲は裁定 user 2026-09-28T09:04Z)、 席は口 seat ruling bind で台帳の問いと発話を結び、 器が裁定 id を発行して裁定の行（問いに書く答えの 1 行） (裁定 id・問い・発話の ts・逐語の 4 欄) と close と裁定 event（裁定を結んだ記録） (RulingReceived に key ruling と utterance) を書く形を決めた。 bind は、 その ts の発話がちょうど 1 つ在って未だ結ばれていない周だけ結ぶ。 決定 (4) は発話 event（人が打った字の記録） を直命の表（user の発言の旧い表）でないとし、 状態を持たせず、 使い道を bind の写し元と到達点の計測の分類 (結ばれない発話の本数を別の欄に出す) に閉じた。 DR1 は「裁定の字は持ち主が打った字だけで、 席はその字を打てない」 (持ち主は本 ADR の語では user) で、 発話 event の書き手は prompt の入口の hook だけである。 同じ ADR は、 消費側の裁定面（裁定を書く画面）の server だけが id を発行して台帳へ書き器は発話を記録しない案を、 scribe2 の user はその面を通らないことと、 器の門の働きが器の外の server の在否に依ることで退けた。 1 つ目の理由 (scribe2 の user はその面を通らない) は、 2026-09-28T13:14Z の裁定 (scribe2 の問いもその画面の決定待ちの一覧に並ぶ) で変わった。
  CTX2 事象 — 要望が bead にならずに落ち、 席の問いは平文のまま台帳に立たず、 1 つの発話で答えた複数の問いを結べない
  発話を要望として memo にするかは席の判断で、 しなかったことを誰も数えない。 2026-09-28 の実測では、 発話から bead への辺は器の台帳でも消費側の project の台帳でも 0 本で、 同じ日に、 消費側の席から頼まれていた整理が memo にならずに落ちた。 器の台帳の問いは全期間で 0 本 (2026-09-28 に初めて 1 本) で、 席から user への問いはチャットの平文の中にだけ在り、 圧縮で消え、 待っている問いの数も年齢も出ない。 FR1082 を実装しても結ぶ先は台帳の問いだけで、 要望の取りこぼしは残る。 user は 1 つの発話で 3 つの問いに答えることがあるが (2026-09-28T13:14Z の裁定がそれ)、 bind は結び済みの発話を断るので 2 つ目からは結べない。 user は問われる前に指示を出すことも多く、 問いを後から起こして結ぶ形は正しい後付けでもあるので、 後付けを全部数えると、 席が対話の session だけで問うてから問いを起こした形を測れない。
  CTX3 現物 — hook の口は 6 つで、 Stop の hook は idle を打ち、 管理 tick は event log を全部読み、 event の行は key を足せる
  器の plugin の hooks.json の hook は SessionStart・PreToolUse・PermissionRequest・UserPromptSubmit・Stop・PreCompact の 6 つで、 PostToolUse は無い。 UserPromptSubmit の hook は今は席の状態の打刻と群の合図の行だけで、 発話 event は仕様だけ (event の kind の閉じた型は 24 値で UtteranceReceived はまだ無い)。 Stop の hook は席の状態を idle と打刻し、 管理 tick はこの打刻を読んで黙った席に合図を送る。 管理 tick は周ごとに event log を全部読み (この host で 2026-09-28 に約 7.4 MB)、 台帳と git は撃たない。 hook の呼び出しは道具 1 回につき 2 回以内・各 2.0 秒以内で重い I/O を持たない (NFR1005)。 event の行は schema 1 の flat な JSON で、 任意の key を足す変更は同じ schema 番号のまま読め、 kind は閉じた型の末尾に足す (ADR-1004 §2.5)。 起票の門（台帳の書き込みを止める門） (ADR-1056) は席の道具の呼び出しの bd / bdw の command の字面だけを読み、 台帳を読まない (ADR-1085)。 memo の子に問いを起こすと label intake:memo を継ぐ (2026-09-28 の実測)。 器が台帳へ書くのは、 land の終端の close (ADR-1051) と、 bind の裁定の行と close (ADR-1083) だけである。
  CTX4 隣の形 — 消費側の project の 1 つは、 自分の画面の答えを自分の台帳の問いの notes に書き、 user の発話は席が memo に手で写す
  消費側の project の 1 つは、 画面で問いに答えると、 その server が自分の台帳の問いの notes に裁定の行を 1 行足して問いを閉じる (新しい bead は作らない)。 問いの bead そのものは、 その project の席が Bash から起こす。 server は自分の repo の台帳だけに書き、 その server は席が Bash から起こす常駐の process として走りうる。 チャットでの user の発話は、 席が memo の notes へ手で写すだけで、 どの bead へも辺を持たない。 user は 2026-09-28T13:14Z に、 席の問いを必ず台帳の問いにし、 チャットで答えても画面で答えても同じ裁定の行になる形を採り、 scribe2 の問いもその画面の決定待ちの一覧に並ぶ。 その画面から scribe2 の台帳の問いに答える口は器に無く、 FR1082 の末文は、 席が逐語を打って裁定 event を記帳する口を器は持たない、 と書いていた。
  CTX5 直命の表との線 — 仕分けの判定と名指しの読みは発話 event の新しい使い道で、 状態と運びの線を引き直す要がある
  ADR-1031 の直命の表は、 user の発言を 1 件ずつ状態 (有効か・閉じたか) 付きで event に持ち、 復元の DATA で逐語を席へ運んだ。 ADR-1045 §2 (2) はこれを消し、 ADR-1083 (4) は発話 event がその復活でない線を、 状態を持たないことと使い道を 2 つに閉じることで引いた。 仕分けには、 発話が仕分け済みかを判じる読み手 (turn の終わりの判定と局面の出力・その出力を読む doctor) と、 前の session の発話の中身を席が読む口が要る。 どちらも ADR-1083 (4) の使い道の外で、 黙って足すと廃止した表が戻ったと読まれる。 ADR-1083 の DR5 は「記録を席へ運ばず」、 原則の note は「席へは id だけを返す」と書く。 違いを決めるのは、 仕分け済みかが発話 event の欄の書き換えでなく別の event から導かれるか、 逐語が席の指示文・復元・合図・通知・一覧へ運ばれるか、 席へ押し込まれるか席が名指して引くか、 である。
  CTX6 憲法の向き — C7.2 の逐語を裁定面の答えにも読むか、 C7 の受理面、 C16 の編集の時点、 C2 の 1 つの関数、 C17.2 の消すもの
  C7 は承認をちょうど 1 つの対話面 (rules 行 R-C7-1) で受け、 C7.2 は受けた承認を user の逐語を運ぶ承認 event に記録する。 ADR-1016 §2.3 は承認の対話面を R-C7-1 のままとし、 対話面を増やさないと決めている。 ADR-1083 は、 裁定の行について C7.2 の逐語を器の hook が prompt の入口で記録した字と読み、 結びの口を承認の受理面と読まない (承認は便の承認 pipe approve が受ける) と決めた (ADR-1083 CTX6)。 裁定面 (消費側の project が持つ、 user が裁定を書き込む画面と server) への書き込みは、 これまで器の裁定 event でも承認 event でもなかった (ADR-1077)。 画面の答えを裁定にするには、 この逐語の読みを画面の字へ広げる要があり、 それは「逐語は user が打った prompt だけ」という信頼の線を画面の分だけ下げる (user は 2026-09-28T13:47Z にこれを認め、 裁定の行・裁定 event・計測に経路を区別して残す推奨を採った・裁定 id s2-07l.739.1:20260928T1347Z-1)。 C16 は仕様からの逸脱を編集の時点で止め、 後の確かめで代えない。 席の返答の平文は道具の呼び出しを経ずに user へ出るので、 出る前に止める hook は無い。 C2 は選択と除外と振り分けをちょうど 1 つの関数に置く。 C3 は host・口座・席・lease・退役の状態を 1 つの DB に置く (管理 tick の梯子の記録のような hook と tick の控えは席の置き場の file に在る・FR1027)。 C15 は台帳を task と裁定に限る。 C17.2 は記録・走査・仕組みを足す前に消すものを名指させ、 N2 は散文にしか無い規則を規則と認めない。 本 ADR は C7.2・C7・C16 の読みを決める (ADR を書く条件 1)。
  CTX7 射程 — 動かすのは発話の key・仕分けの event と口・turn の終わりの止め・名指しの読み・1 発話 n 問と裁定の行の経路の欄・裁定面の答えの口・問いの asked（問いのきっかけ） と数えの 7 つ
  動かすのは、 (1) 発話 event の key (session と発話の経路（字が来た道）)、 (2) 仕分けの event kind と仕分けの口と仕分け済みかの判定の関数、 (3) turn の終わりの止め、 (4) ts を名指して 1 件を読む口、 (5) bind の結び済みの断りを発話と問いの組に狭めることと、 裁定の行に発話の経路の欄を足して 5 欄にすること、 (6) 裁定面の答えの口（画面の答えを受ける口）と hook の入口の断り、 (7) 台帳の問いの metadata asked と起票の門の断り (親の label を継がない指定を含む) と裁定 event の key と doctor の asked の値ごとの数え、 の 7 つで、 doctor の行・計測の 3 欄が付く (doctor の未仕分けの行と管理 tick の alarm の語 unsorted は局面の出力の読み手・FR1094・FR1027)。 要件は SRS 版 0.29 の FR1088・FR1089 と FR1082・FR1065・FR1022・FR1044・FR1081 (a)・FR1027・FR1094 が持つ。 動かさないのは、 R-C7-1 の値と便の承認 (pipe approve・承認 event)、 裁定 id の形と n が 1 であること、 裁定の行の欄の順 (裁定 id が 1 つ目の欄で逐語が最後の欄)、 裁定 id の実在と未反映の裁定 (ADR-1083 の決定 (5)(6))、 裁定の指し示しの口と裁定面の記帳 id (ADR-1077)、 event log の schema 番号、 局面の出力の形 (別の決定記録)、 memo の局面と close の理由の文法 (問いの close の理由の字面を含め正本は ADR-1089・SRS は裁定の形〔FR1091〕と書く) である。 ADR を書く条件のうち 1 (C7.2・C7・C16 の読み)・3 (event の kind と key・裁定の行の欄・台帳の問いの metadata・口の形は版を跨ぐ)・4 (却下案を残す価値のある分岐) に当たる。
  （選択肢を測るものさし）この判断を測る 7 本のものさしです。 user の発話は 1 つ残らず仕分け済みになるか未仕分けと数えられ、 席の判断で黙って落ちないこと。 台帳の記録の種類を増やさず、 器が台帳へ書く範囲を広げないこと。 前の器の直命の表を戻さないこと。 文を打つ経路と turn の終わりを軽く保つこと。 チャットでも画面でも同じ裁定の行になり、 どちらの経路かを数えで分けられること。 席がチャットだけで問うてから問いを立てた形を、 字面の推測でなく記録の前後で数えること。 足すものを最小にし、 消すものを名指すことです。
  DR1｜user の発話は 1 つ残らず、 3 つの仕分けのどれかで仕分け済みになるか、 未仕分けと数えられ、 席の判断で黙って落ちない CTX2・CTX4
  DR2｜台帳の記録 (bead) の種類を増やさず、 器の台帳の書きを広げない (要望と会話で器は台帳を書かない・ADR-1045 §2・ADR-1051) CTX3・CTX6
  DR3｜直命の表を戻さない — 発話 event に状態の欄を持たせず、 逐語を席へ押し込まない (FR1065) CTX5
  DR4｜prompt と turn の終わりの経路を軽く保つ — 台帳を読まず、 event log の大きさに依らない (NFR1005) CTX3
  DR5｜チャットで答えても画面で答えても同じ裁定の行になり、 どちらの経路かを数えで分けられる CTX4・CTX6
  DR6｜席が対話の session だけで問うてから問いを起こした形を、 字面の推測でなく記録の前後で数える (C16・N2) CTX2・CTX6
  DR7｜足すものを最小にし、 消すものを名指す (C17.2) CTX6・CTX7
decision: |
  選んだ案と、 それが支える要件です。 user の発話は、 要望 (開いた控えを名指して結ぶ)・答え (台帳の問いへ結んで裁定にする)・会話 (台帳を変えずに仕分け済みにする) のどれかに仕分け、 要望と会話は器の記録に 1 件足すだけで台帳を書きません。 仕分け済みかどうかは 1 つの関数が決め、 まだ告げていない未仕分けの発話が残る turn の終わりは 1 度だけ止めて番号を全部告げ、 告げ済みの発話だけなら止めません。 席は番号を名指して前の発話の中身を自分で読めます。 1 つの発話で複数の問いに答えられ、 答えの行はチャットか画面かの経路の欄を持つ 5 欄になります。 裁定面の答えは器の口 1 つが受けて裁定にし (承認は受けず、 断るときは何も記録しません)、 席が自分の道具でその口を撃つことは器の hook の入口が止めます (席が起こした別の process からの撃ちは門の外です)。 台帳の問いは問いのきっかけの印を持ち、 答えの後で立てた問いを器が印ごとに数えます。 記録の使い道は広げますが、 中身を席へ押し込むことはしません。
  採用 — OPT1
  C7.2 の「user の逐語」は、 経路が裁定面 (gui) の裁定の行では答えの口が標準入力で受けた字とも読む (信頼の線を画面の分だけ下げる)。 答えの口は bind と同じく裁定の行を書く口で、 承認 event を記帳しない (承認は R-C7-1 の対話面だけ)。 C16 は平文の返答の中の問いを編集と読まず、 後から数える。 (1) 発話 event (UtteranceReceived) SHALL key channel (chat＝対話の session・gui＝裁定面) を持ち、 chat は key session も持つ。 ts は発話ごとに一意 (同じ秒は秒より下の桁で分ける)。 (2) 器 SHALL 発話を 3 つの仕分けのどれかで仕分け済みにする: 要望＝口 utterance sort <ts> --as request --memo <id> が開いた memo を名指す周に kind UtteranceSorted (actor は machine・key utterance・sorting・bead) を 1 件、 答え＝bind か答えの口の裁定 event、 会話＝同じ口の --as chat の UtteranceSorted (sorting=chat)。 要望と会話で器は台帳を書かない。 1 つの発話は複数の memo と問いへ仕分けてよく、 会話は他の仕分けを持つ発話に付けず断り、 後の要望か答えが会話を外す。 仕分け済みかは event だけを読む 1 つの関数 (C2) が導く。 (3) 発話 event を記帳する対話の session (runner と lens を除く) の turn の終わりに、 その session の未仕分けの発話のうちまだ告げていないものが在れば、 turn の終わりの判定の hook SHALL 1 度だけ止めて未仕分けの発話の ts を全部並べて仕分けの口を告げ (逐語は運ばない)、 登録された席の session なら idle を打たない。 告げ済みだけなら止めない。 判定は台帳を読まず event log の大きさに依らず、 入力を読めない周は止めずに TurnEndUnjudged を記帳する (告げ済みの控えは state dir・跨版でない)。 (4) 口 utterance show <ts> SHALL その発話の逐語を席へ返す。 (5) bind SHALL 同じ発話と同じ問いの組だけを結び済みで断り (id の n は 1)、 裁定の行 SHALL 5 欄 (裁定 id・問い・発話の ts・発話の経路・逐語) を持つ (4 欄の既存の行は経路を chat と読む)。 (6) 口 seat ruling answer --question <id> SHALL 逐語を標準入力で受け、 空白だけ・閉じた問い・bead が問いでない周は発話 event も書かずに断り、 通る周は gui の発話 event と bind と同じ書きを行い裁定 id を 1 行返す。 席の道具の呼び出しがこの口を撃つ command は器の hook の入口 (起票の門とは別) SHALL 実行の前に断る。 (7) 台帳の問いは metadata asked (閉じた 2 値 seat・user) を持ち、 起票の門 SHALL その欠けと値の外・label intake:memo の併せ持ち・親を名指しながら親の label を継がない指定を持たない create を断る。 裁定 event (RulingReceived) の key の名は bead・ruling・utterance・detail・asked・question_ts・channel (欄は FR1082)。 doctor SHALL 起票が発話より後の結びを asked の値ごと (asked 無しは前後に依らず別) の件数と裁定 id で出す (seat の分は対話の session だけで問うてから起こした問い)。 (8) doctor SHALL 未仕分けの発話の件数・最古の ts・要望と会話の件数を局面の出力から 1 行に出す (FR1094)。 発話 event は状態の欄を持たず、 逐語を指示文・復元・合図・通知・局面の出力・doctor・止めの理由へ運ばない。 計測の旧欄 (結ばれない発話の本数) SHALL 未仕分け・要望・会話の 3 欄に替わる。
  （平易）決めたことを、 読み方と 8 つにまとめます。 まず読み方として、 裁定面の答えについては、 器の口が受けた文も user の言葉と読みます (言葉は user が打った文だけ、 という信頼の線を画面の分だけ下げます)。 その口は結びの口と同じく答えの行を書く口で、 承認を受ける口ではなく、 承認の記録は書きません。 承認を受けるのは対話の面 1 つのままです。 また、 席の返答の平文の中の問いは編集と読まず、 後から数える線で見ます。 1 つ目、 user の発話の記録は、 チャット (対話の session) か画面 (裁定面) かの経路を持ち、 チャットの記録は session も持ちます。 発話の番号 (時刻) は器が発話ごとに 1 つずつ別に振り、 同じ秒の発話は秒より細かい桁で分けます。 2 つ目、 器は発話を 3 つの仕分けのどれかで仕分け済みにします。 要望は仕分けの口で開いた控えを名指して記録に 1 件足し (人の手の数えには入れません)、 答えは台帳の問いへの結びの記録で、 会話は同じ口で記録に 1 件足して台帳を変えずに仕分け済みにします (承認・実装役への回答・go に使った発話も会話で、 承認や回答の記録には結びません)。 要望と会話で器は台帳を書きません。 1 つの発話は複数の控えと問いへ仕分けてよく、 会話は他の仕分けを持つ発話に付けられず、 後の要望か答えが会話を外します。 仕分け済みかは記録だけを読む 1 つの関数が決め、 turn の終わりの判定と局面の出力が同じ結果を出し、 doctor は局面の出力を読みます。 3 つ目、 器が発話を記録する対話の session (実装役と審査役を除きます) で、 まだ告げていない未仕分けの発話が残る turn の終わりは、 turn の終わりの判定の hook が 1 度だけ止めて未仕分けの発話の番号を全部並べて口を告げ、 登録された席の session なら、 その周は席を「空いた」と記録しません。 告げ済みの発話だけが残る周は止めません。 判定に要る記録を読めない周は止めずに通し、 読めなかったことを記録に残します。 この止めは入力欄への差し込みではなく、 判定は台帳を読まず記録の全体の大きさに依りません (長い session ほど読む量は伸びます)。 4 つ目、 席は番号を名指して 1 件の中身を自分で読めます。 5 つ目、 結びの口は、 同じ発話と同じ問いの組だけを結び済みとして断り、 答えの行は 裁定の番号・問い・発話の番号・経路・言葉 の 5 欄になります (旧い 4 欄の行はチャットの経路と読みます)。 6 つ目、 裁定面の答えの口は文を標準入力で受け、 空白だけの文・閉じた問い・問いでない記録への答えは発話の記録も書かずに断り、 通るときは画面の経路の発話として記録して同じ周に裁定にし、 裁定の番号を 1 行で返します。 席が自分の道具でこの口を撃つことは器の hook の入口 (台帳の書き込みの門とは別) が止め、 席が起こした別の process からの撃ちは門の外です。 7 つ目、 台帳の問いは問いのきっかけ (seat か user) の印を持ち、 欠けや値の外、 控えの印との併せ持ち、 親を名指しながら親の印を継がない指定を持たない問いは台帳の書き込みの門が止めます。 裁定の記録の欄 (印・問いを立てた時刻・発話の番号・経路) は要件 FR1082 が持ち、 機械の欄の名 (問い・裁定の番号・発話の番号・言葉・印・問いを立てた時刻・経路) の正本はこの記録です。 答えの後で立てた問いの結びを doctor が印ごとの数と裁定の番号で出し、 印を持たない問いの結びは、 前後に依らず印無しとして別に数えます (seat の分は、 席がチャットだけで問うてから問いを立てた形)。 8 つ目、 doctor は未仕分けの発話の数・最古の番号・要望と会話の数を、 局面の出力と同じ判定の結果から 1 行に出し、 古い出力は古いと示します (定期の見回りの合図の unsorted の語も局面の出力から出ます)。 発話の記録は状態の欄を持たず、 中身を席の指示文や通知へ運びません。 計測の旧い欄 (結ばれない発話の数) は消え、 未仕分け・要望・会話の 3 つの欄に替わります。
  （理由）3 つの仕分けを採ったのは、 記録だけの形 (OPT2) では要望を控えにするかが席の判断のままで、 2026-09-28 のように頼まれた整理が黙って落ち、 それを数える者もいないからです (DR1)。 要望を別の種類にする形 (OPT3) は台帳の記録の種類を、 器が控えの欄を書く形 (OPT4) は器の台帳の書きを広げ (DR2)、 OPT4 は発端の置き場も 2 つにするので (DR7)、 仕分けの記録 1 件を発端の結びの正本にしました。 仕分けの判定と名指しの読みは前の決定の使い道の外ですが、 仕分け済みかを別の記録から導いて発話の記録に状態の欄を持たせず、 中身は席が自分で名指したときだけ読むので、 前の器の直命の表 (状態付きで席へ運んだ表) の復活ではありません (DR3)。 turn の終わりの止めは、 台帳を読まず session の開始から後ろの記録だけを読む形にし、 event log の全体の大きさに依らない読みにします (DR4)。 読む量は長い session ほど伸びるので、 hook の時間の予算 (NFR1005) に収まるかは設計 doc が測ります。 告げ済みの発話では止め直さないので、 同じ発話で turn を何度も延ばしません。 席の問いを台帳に立てるのは、 チャットの問いが圧縮で消え、 待っている数も年齢も見えないからで (OPT5・OPT6 の欠点)、 user は 2026-09-28T13:14Z にこの形を採りました。 後付けの結びを 1 つに数えると、 方針や問われる前の指示の正しい後付けまで混ざって測れなくなるので、 asked の値ごとに分けて出し、 seat の分を、 席がチャットだけで問うてから問いを立てた形として見ます (DR6)。 平文の問いは道具の呼び出しを経ずに user へ出るので編集の時点で止める手が無く (CTX6)、 字面で推し量る判定も持たずに (N2)、 問いの起票と発話の前後を後から数える線を置きます (DR6)。 裁定面の答えを器の口 1 つで受けるのは、 裁定面の server が台帳へ直に書く形 (OPT7) では画面の答えに器の口の断りも裁定の番号の発行も記帳も経路の数えも効かず、 チャットだけにする形 (OPT8) は 13:14Z の裁定と食い違うからで、 信頼の線を画面の分だけ下げることと、 答えの行・記録・計測に経路を区別して残すことは、 user が 2026-09-28T13:47Z (裁定 id s2-07l.739.1:20260928T1347Z-1) に認めました (DR5)。 その口は結びの口と同じく答えの行を書く口で、 承認の記録を書かないので、 憲法 C7 の承認を受ける 1 つの面は変わりません。 足すのは event の種類 2 つ (仕分けの記録と、 読めなかった回の記録)・欄・口 3 つで、 計測の旧い欄と結び済みの広い断りを消します (DR7)。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1088（claim）: FR1088 (発話の仕分け（発話の行き先を決めること）) の、 3 つの仕分けで発話を仕分け済みにすること (会話は台帳を変えずに仕分け済みにし、 3 クラスの承認・runner への回答・go に使った発話も会話として承認 event と回答 event には結ばない)・要望と会話の仕分けは仕分けの event 1 件で台帳を書かないこと (発端の結びの正本は仕分けの event)・1 つの発話を複数の memo と問いへ仕分けること・会話と他の仕分けの衝突の規則・仕分けの口の断り・仕分け済みかの判定が turn の終わりの判定と局面の出力で同じ入力に同じ結果になること (本 ADR はそれを 1 つの関数で実現し、 doctor は FR1094 の読み手として出力を読む)・器が発話 event を記帳する対話の session (runner と lens を除く) で、 その session の未仕分けの発話のうち止めでまだ告げていないものが在る turn の終わりを 1 度だけ止め、 その session の未仕分けの発話の ts を全部並べて仕分けの口を告げ、 登録された席の session なら idle を打たず、 告げ済みの未仕分けの発話だけの周は止めないこと・台帳を読まず event log の大きさに依らない判定と、 判定の入力を読めない周は止めずに読めないことを event に記帳すること (fail-open)・ts を名指した 1 件の逐語を席へ返す口・doctor の未仕分けの件数と最古の ts と要望と会話の件数の行の根拠。
  FR1089（claim）: FR1089 (席の問いの台帳化) の、 結ぶ周に FR1082 の裁定 event の欄を記帳すること (欄の列挙の正本は FR1082)・asked の閉じた 2 値 (seat＝席が user の判断を求めた問い・user＝user の先立つ指示や方針を受けるために席が起こした問い) と、 doctor が問いの起票が発話より後の結びを asked の値ごとの件数と裁定 id で出すこと (asked が seat の分は、 席が対話の session だけで問うてから問いを起こした形)・asked を持たない問いの結びを、 発話との前後に依らず doctor の行で asked 無しとして別に数えること・平文の問いを字面で探さず後から数える検出の線にすること (C16 の読み)・asked の欠けと値の外を起票の門 (FR1081 (a)) が断ることの根拠。
  FR1082（claim）: FR1082 (発話の記帳と裁定の結び) の改訂の根拠。 発話 event の session と発話の経路の key と、 発話を指す ts を器が発話ごとに一意に振り同じ秒を秒より下の桁で分けること (ADR-1083 が引き受けた同じ秒の 2 発話を結べない穴を塞ぐ)、 bind の結び済みの断りを発話と問いの組に狭めること (1 つの発話は複数の問いへ結べる・id の n は 1 のまま)、 裁定の行の 5 欄 (4 欄の既存の行は経路を対話の session と読む)、 裁定 event の欄 (問いの asked・問いの起票の時刻・発話の ts・発話の経路。 欄は FR1082 が持ち、 機械の key の名は本 ADR が持つ)、 裁定面の答えの口 (逐語を command の字面の外で受ける形として標準入力・空白だけと閉じた問いと問いでない bead の周は発話 event も書かずに断る・通る周は経路が裁定面の発話 event と bind と同じ書き・裁定 id の 1 行)、 答えの口が承認 event を記帳しないこと、 契機の「席の道具の呼び出しが答えの口の command を撃とうとするとき」に器の hook の入口が実行の前に断る独立の 1 文 (起票の門とは別・席が起こした子 process は門の外)、 末文を席の道具の呼び出しの口に限る書き直し。
