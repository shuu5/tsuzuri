  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 行き着く原則です。 ADR-1083 のうち、 発話の記録の使い道・記録を席へ運ばず席は字を指して結ぶだけという線 (席が撃つ仕分けの口と、 席が自分で引く読みを加える)・1 つの発話は 1 つの裁定にだけ結ぶ断り・裁定面の答えについての「字は user が打ったものだけ」の読みと記録の書き手・答えの行の欄 (4 欄から 5 欄へ)・問いの形を止める門・計測の欄の 7 点を置き換え、 記録の欄と種類は足すだけです。 承認を受ける面は 1 つのままです。 原則は、 user の発話は仕分け済みの記録を持つか未仕分けと数えられるかのどちらかにし、 黙って消える発話を残さない、 というものです。
