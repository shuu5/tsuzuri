consequences:
  - 言付け箱は、同じ機械の同じ利用者の process（席・席の係・便・ほかの project の席）が書け、書き手の証は無い。持ち主のほかの会話から窓へ Claude Code の言付けを送る道も閉じる。
  - 席の言付けは、持ち主が次に打つまで窓に渡らない（件数は状態の 1 行に出せる）。言付けを渡す hook は囲いの外で決まった 1 か所だけを読み、渡した印を書く。ADR-29 の守りの hook（読むだけで書かない）とは別の口とする。
  - 窓の知らせは、web や GitHub の code を読む窓の信用できない字を、確かめを飛ばす形で動く席へ運ぶ道を 1 つ増やす。席に届くのは中身の無い 1 行だけにし、中身は席が決めて読む。
  - Remote Control を繋いだ窓の会話の記録は、使わない窓の分も作り手（Anthropic）の server に置かれる。口座の移動で開き直すと、新しい口座の側にも置かれうる（I）。窓を閉じた後に一覧から消えるかは文書に無い（U）。前の口座の一覧には止まった印の会話が残りうる（I）。一覧の名は窓の名で、題は名に出ない。
  - 携帯（mobile）から窓の許可の形と model と念入りさを替えられ、写真や file を窓へ送れる。許可の形を替えて repo と器の記録に書けた穴は行（cs-root-edits）で塞いだ。
note: 起草は係 w184a（2026-10-05）。承認の欄の逐語と経路は、適用の script が台帳の問い t3-hub.88.1.3 と t3-hub.84.3 の notes の定型行から読んで入れた。
