# 判断の記録 ADR-57 — 席と相談の窓の言付けを決まった箱と知らせの形にし（窓は会話どうしの言付けを全部断る）、話す窓を起動の時から Remote Control に繋いで状態の 1 行を出す（持ち主の裁定 2026-10-05・記帳先 = tsuzuri の台帳の問い t3-hub.88.1.3 と t3-hub.84.3 の notes）
# 判断の記録 ADR-29 の決定 (3)・(7)・(8) の字のうち、この記録の決定 (1) が名指す字だけを置き換える（部分の置き換え・ほかの決定と字は効いたまま）。ADR-29 は封の一覧で本文が凍っているので本文は変えない（前例 ADR-29 の頭の注・ADR-53・ADR-54・ADR-55）。
# 判断の記録 ADR-55 の consequences の「言付けは改めか新しい記録で足す」「Remote Control と状態の 1 行は別の問いで決め、(ク) の次の文字で足せる」を受ける新しい記録。ADR-55 は封じてあるので字は替えない。
# 起草は係 w184a（2026-10-05）。材料は問い t3-hub.88.1.3 と t3-hub.84.3 の本文と、係 w183a の調べ（drafts/w183a/w/notes.md の 7 節）と、検証役 qv180 の攻め（drafts/qv180/w/attack-message-v2.md の M1〜M5・N1〜N4 と attack.md の S3・N1 は却下した乙の失う物に映した）と、係 w188a の行の試作（drafts/w188a/w/notes.md）。設定の列の字は、止めた係 w189a の原稿の (ケ)(コ)(サ) と照らした。
id: ADR-57
title: 席と相談の窓の言付けを決まった箱と知らせの形にし（窓は会話どうしの言付けを全部断る）、話す窓を起動の時から Remote Control に繋いで状態の 1 行を出す（ADR-29 の決定 (3)(7)(8) の部分の置き換え）
status: accepted
date: 2026-10-05
context: |
  言付け。今は、窓から席へは所見だけが届き、席から窓へ字を渡す口は無い（ADR-29 の決定 (8) は窓どうしの連絡を使わないと決めた）。Claude Code には会話（session）どうしの言付けの仕組みがあり、窓も席も受け口を開いている（V）。受け口の設定の値は、全部受ける・全部断る・全部止め置くの 3 つで、送り手を選んで通す値は無い（公式の文書・D）。窓は値を置いていないので、確かめを飛ばさない形の送り手（持ち主がほかで開いた会話と、Remote Control の先の会話）の言付けは、もう窓に届き、席の言付けは窓の端末の承認待ちで 5 分で捨てられる（D）。検証役（qv180）は、全部受ける形では、同じ機械のほかの project の席と便と、Remote Control を繋いだ間はほかの機械と外の置き場（cloud）の会話も、手すきの窓に turn を起こして窓の許しの中の事（repo と器の記録の読み・web・囲いの中の code）を頼めると攻めた（I）。窓→席の中継の 1 行に窓の字を載せると ADR-29 の決定 (1)(エ) の固定の 1 行を破り、席の受け口へ書く中継は確かめていない（U）とも攻めた。問い（t3-hub.88.1.3）は、窓は全部断り席の言付けを tsuzuri の箱から渡す甲・窓は全部受ける乙・作らない丙を問い、甲に裁定された。
  Remote Control。窓は今、持ち主の手の /rc で繋がり（V）、携帯（mobile）の app と web の一覧（claude.ai）に窓が出ないのは起動で繋いでいないからと読む（I）。状態の 1 行が出ないのは、窓が口座の設定を読まない制限の形（--restricted）で起き、起動の口の設定にも鍵が無いから（D）。繋いでいる間、窓の会話の記録（持ち主の字・窓の答え・道具の出力）は作り手（Anthropic）の server に置かれ、同じ口座に login した web の一覧と携帯の app から読めて話せる（公式の文書・D）。中継は手元から外へ向かう暗号の通信だけで、手元に入口を開けない（文書）。携帯から許可の形を替えると窓が repo と器の記録に書けた穴は、行（cs-root-edits）で塞いだ（V・着地済み）。問い（t3-hub.84.3）は、起動で話す窓を繋ぐ A・持ち主が /rc を打った窓だけ B・断る C を問い（どれも状態の 1 行は出す）、案 A に裁定された。検証役（qv180）は、状態の 1 行の口が囲いの外で窓の書ける file を読むと攻めた（S3）。
  判断の記録 ADR-55 は、口座の移動に付いてくる形と会話の印の hook を決め、ADR-29 の決定 (7) の設定の列に (ク)（会話の印の hook）を足した。言付けと Remote Control と状態の 1 行は、ADR-55 の結果の欄（consequences）で別の記録に回した。
decision: |
  (1) 置き換える字。ADR-29 の決定 (3) の「（board やスマホから開いても話す所は PC の端末）」を、「（話す所は PC の端末と、判断の記録 ADR-57 の決定 (4) で起動の時から繋ぐ Remote Control の先の同じ口座の携帯の app と web の一覧）」に置き換え、「持ち主が PC の端末で直に話す」の後に「席の字は、判断の記録 ADR-57 の決定 (2) の言付けの形でだけ話す窓に入る」を足す。ADR-29 の決定 (7) の起動の口の列に「話す窓だけ Remote Control の旗と窓の名（決定 (4)）」を足し、「設定は次を置く。」の列の末（判断の記録 ADR-55 が足した (ク) の後）に、次の (ケ)(コ) を足す。(ケ) 話す窓と問う窓の両方に、会話どうしの言付けの受け口を全部断る値（crossSessionInbound の refuse）と、言付けを送る道具（SendMessage）と会話の一覧の道具（ListAgents）の許可の断りと、言付け箱の dir への書きの道具（Edit）の断りを置き、持ち主の入力の hook の列の (ク) の印の hook の次に、席の言付けを渡す hook を置く（決定 (2)）。(コ) 両方の窓に、窓の作業場を渡す状態の 1 行の命令（tz consult statusline）を置く（決定 (4)）。ADR-29 の決定 (8) の「窓どうしの連絡は使わない。」を、「会話どうしの言付けの仕組みは使わない。席と窓の間の言付けは、判断の記録 ADR-57 の決定 (2)(3) の箱と知らせの形だけとする。」に置き換え、同じ決定の見張りが席に固定の 1 行で知らせる事柄に、窓の知らせ（決定 (3)）を足す。ほかの字（決定 (3) の窓の形と閉じ方と問う窓・決定 (7) のほかの項〔(カ) の窓どうしの口と囲いの外の命令の列を置かない字を含む〕・決定 (8) の所見の受けと見張りと、その後の部分の置き換えの字）は効いたまま。
  (2) 席から窓への言付け（問い（t3-hub.88.1.3）の甲）。窓は会話どうしの言付けを全部断る（受け口の値を全部断る形にし、言付けを送る道具と会話の一覧の道具を許可の断りに置く）。席の言付けは、新しい口（tzw consult tell）が、窓の作業場の外の窓の id ごとの言付け箱に、上限のある字の file を番号つきで置く（箱の置き場は作る行で決める）。窓が自分で箱に書く道は断る。殻の命令は囲いの書きの断りで、書きの道具は箱の dir の編集の断りで、窓の殻から言付けの口と渡しの口を撃つ事は守りの hook の席の口の列で断る。持ち主が打った時に撃たれる hook（持ち主の入力の hook）が、まだ渡していない言付けを「席からの言付け（承認でない・持ち主の字が先）」の頭つきで窓の文脈に足し、同じ字か頭と在りかを持ち主の画面にも出す（hook の足す字は、そのままでは持ち主の画面に出ないため）。箱は起動の時の窓の id（環境の窓の id）で選び、hook の入力の作業の dir は使わない。hook が落ちた時と箱が読めない時は渡さない側に倒し、渡した印は箱の横に置く。答え終わりの hook で窓を続けさせる形と、席が tmux で窓に字を打つ形は採らない（席が持ち主ぬきで話す窓を動かし、規則の行 R-38 の問う窓の上限の外で窓を使う道になる）。言付けは窓の許しを広げず、承認にも持ち主の字にもならない。「席から」の頭は書き手の証でない（同じ機械の同じ利用者の process は箱に書け、席の係も席の名で書ける）ので、言付けに権能を持たせない。hook の土台は判断の記録 ADR-55 の会話の印の hook と同じ形（囲いの外・決まった 1 か所だけを読む）とする。
  (3) 窓から席への知らせ。新しい口（tz consult note）が、窓の作業場の決まった dir に、閉じた種類（知らせ・席への問い）と短い字の file を番号つきで置く。席の見張りは、窓の id と番号と在りかだけの固定の 1 行で席に知らせ、窓の字は 1 行に載せない（ADR-29 の決定 (1)(エ) の固定の 1 行の字は効いたまま）。席は自分の読む口（窓の殻からは守りの hook の席の口の列で断る）で、種類と大きさと symlink でない事を検めてから読み、命令として撃たない。採るか決める結論は所見（欄と処分）でだけ受ける。知らせの中の「持ち主の言葉」は持ち主の字にならない。窓ごとに知らせの間を置く。1 行の届け方は、席の見張り（席が起こした process）が席の受け口に書く形を、作る行の初めに席が撃って確かめる（U・席が自分で起こした process からの言付けが止め置かれない決まりは、席に受け方の値が無い時だけ効き、席は群の席と便が共有する口座の設定を読む）。届かない時と、席の受け方に値が入った時は、今の見張りの終わりの固定の 1 行に倒し、届かない事を異常なしと扱わない。知らせは撤退の条件の数えに足す。
  (4) Remote Control と状態の 1 行（問い（t3-hub.84.3）の案 A）。読む根への書きの断り・窓の読む範囲の絞り・窓の環境の閉じた列の 3 つの行（cs-root-edits・cs-read-roots・cs-env-closed）の着地の後に、起動の口は、話す窓の argv の制限の形の旗の直後に、Remote Control の旗と窓の名（consult-cw<n>）を置く。問う窓は繋がない（画面が無く人が話さない）。話す窓と問う窓の共通の設定に状態の 1 行の命令（tz consult statusline）を置く。状態の 1 行の口は読むだけで、作業場の窓の控えと所見の数と束の要約値の頭と、Claude Code が渡す文脈の割合から 1 行を出す。この口は囲いの外で走り、窓が書ける作業場の file を読むので、字の中の制御の字を落とし、symlink を辿らない。繋いでいる間、窓の会話の記録は作り手（Anthropic）の server に置かれ、同じ口座の web の一覧（claude.ai）と携帯（mobile）の app から読めて話せる。問い（t3-hub.84.3）の裁定は、繋いでいる間に窓の会話の記録が作り手（Anthropic）の server に置かれる事の、条 A-1 の確認（外へ出す操作の確認）を兼ねる。この記録の承認の欄にその旨を書き、別の確認は取らない。言付けの受け方は決定 (2) の全部断る形で、繋いだ窓にも外の会話からの言付けは届かない。携帯で打った承認の字は承認にならない（承認は今までどおり決定の画面だけ）。開き直し（判断の記録 ADR-55 の決定 (3)(5)）は前の process を閉じてから同じ名で起こす（閉じる前に同じ会話を開くと、新しい窓に Remote Control が付かない）。起動の旗が制限の形の窓で繋がるか（U・窓の中の /rc は繋がった＝V）と、設定の状態の 1 行が対話の窓で描かれるか（U）は、作る行で新しい窓を開いて撃って確かめ、旗が効かなければ Remote Control の部分を落として起動の形を持ち主に問い直す（ADR-29 の決定 (7) の末の字）。
  (5) 測り方と行。起動の口の検めは、受け口の断りの値・送る道具と一覧の道具の断り・箱の dir の編集の断り・言付けを渡す hook・話す窓の Remote Control の旗と名・問う窓に Remote Control の旗が無い事（別名を含む）・状態の 1 行の命令の、欠けと違いを断る。言付けの口と知らせの口と状態の 1 行の口と hook の渡しと見張りの 1 行は、歯で測る。行はノート（surface-wave29b）に足し、この記録は行の名を指すだけとする（見込みの名・割りと字は作る係が決める）。受け口の断りの行（cs-inbound-refuse）・Remote Control の行（cs-remote）・状態の 1 行の字の行（cs-status-text）と口の行（cs-status-verb）・席から窓への言付けの行（cs-tell）・窓から席への知らせの行（cs-note）・席の受け口への届けが確かめで通った時の届けの行（cs-note-relay）。受け口の断りは、ほかの言付けの行と Remote Control の行より先に置く。会話の印の hook の file の扱い（行 cs-acct-mark）は、その行の版上げで持つ。開き直す窓（ADR-55 の決定 (5) の今の窓を含む）は、その時に着地している起動の口の argv と設定で起きる。要件 FR19 の字を同じ commit で改める（要件書の版上げ）。
options:
  - id: a
    name: 言付けは甲（窓は会話どうしの言付けを全部断り、席の言付けは tsuzuri の口の箱から持ち主が次に打つ時に渡す）、Remote Control は A（起動の時に話す窓を繋ぎ、状態の 1 行を出す）
    text: 決定 (1) から (5)。
    verdict: adopted
    reason: 席の言付けを置けるのは手元の PC で箱に書ける process だけになり、Remote Control の先と外の置き場（cloud）からは届かない。持ち主が打つまで窓は動かないので、席が持ち主ぬきで話す窓を使う道にならない。前に窓どうしの連絡を退けた 2 つの理由（席の承認待ちで 5 分で捨てられる・囲いの中から届かない）に当たらない。Remote Control は、外出中に board やチャットから開いた窓にも、口座の移動で開き直した窓にも携帯から届き、窓の題・所見の数・文脈の残りが窓の下で一目で分かる。言付けを全部断るので、繋いだ窓にも外の会話は届かず、2 つの決めが同じ向き（外へ開かない）になる。
  - id: b
    name: 窓は言付けを全部受け、席が Claude Code の言付けの道具で窓に送る（言付けの乙）
    text: 起動の口が受け口に全部受ける値を置き、席は窓の名に言付けの道具で送る。窓→席は決定 (3) と同じ形。
    verdict: rejected
    reason: 送り手を選べない。席の係・同じ機械のほかの project の席と便・持ち主のほかの会話と、Remote Control を繋いでいる間はほかの機械と外の置き場（cloud）の会話も、手すきの窓に turn を起こし、窓の許しの中の事（repo と器の記録を読む・web へ出る・囲いの中で code を撃つ）を頼める。席は規則の行 R-38 の上限に数わらない話す窓を動かせ、「頼まれた時だけ送る」は散文だけの決まりで機械では守られない。Remote Control と組むと、外の会話が窓を通して手元の file を読ませ、web へ出させる道ができる（I）。作る量が少なく、届いた言付けが窓の会話に残る利点はあるが、Remote Control を繋ぐ決定 (4) と逆の向きになる。
  - id: c
    name: 言付けを作らない（所見だけ・窓は全部断る）（言付けの丙）
    text: 受け口を全部断る値だけを置き、席→窓と窓→席の口を作らない。
    verdict: rejected
    reason: 席が窓に材料や台帳の知らせを渡せず、窓が途中の知らせと席への問いを送れない。持ち主の求め（席と窓のやり取り）に応えない。
  - id: d
    name: 持ち主が PC の端末で /rc と打った窓だけを Remote Control に繋ぐ（Remote Control の B）
    text: 起動の旗を置かず、状態の 1 行だけを出す（今と同じ繋ぎ方）。
    verdict: rejected
    reason: 外出中に board やチャットから開いた窓と、口座の移動で開き直した窓には携帯（mobile）から届かないことがある。開き直した窓に /rc が戻るかも確かめていない（U）。それでも持ち主の手で繋げるので、ADR-29 の決定 (3) の字の改めは要る。
  - id: e
    name: 窓で Remote Control を断る（Remote Control の C）
    text: 起動の口の設定に Remote Control を止める鍵を置き、状態の 1 行だけを出す。
    verdict: rejected
    reason: 携帯（mobile）から窓を使えず、持ち主の求め（携帯の一覧から窓を見て話す）に応えない。
basis: [ADR-29, ADR-55, FR19, R-38, A-1]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo の札（t3-hub.88.1）か後継の memo の notes に 1 件ごとに記帳する。数える材料は、言付け箱と渡した印と、窓の知らせの file と、見張りの 1 行と、起動の口の argv と設定と、窓の会話の記録と、持ち主の言葉。問う相手は持ち主。
    (1) 言付けが窓の model を操った例。席の言付けか箱の file によって、窓が持ち主の頼みに無い事をしたか、言付けを承認か持ち主の字として扱った事が 1 件でもあったら、言付けの形を問い直す（案 c を含む）。言付けの件数と、渡しの hook が渡さずに倒れた件数も数える。
    (2) 知らせが席の文脈を汚した例。窓の知らせの中身が見張りの 1 行に載ったか、席が中身を命令として撃ったか、知らせの中の「持ち主の言葉」を持ち主の字として扱った事が 1 件でもあったら、知らせの形を問い直す（案 c を含む）。知らせの件数と種類も数える。
    (3) Remote Control の先から窓の許可の形か model か念入りさが替えられた例と、外の会話の言付けが窓に届いた例。替えは持ち主が替えた物も 1 件ごとに数え、持ち主の手でない替えか、替えた形で窓が repo か器の記録に書けた事か、外の言付けの届きが 1 件でもあったら、Remote Control の部分を問い直す（案 d と e を含む）。携帯で打った字を承認として扱った事も同じに数える。
    (4) 起動の Remote Control の旗が制限の形の窓で繋がらないか、状態の 1 行が描かれないと分かったら、決定 (4) のとおりその部分を落として起動の形を問い直す。
    (5) 見張りから席の受け口への 1 行が届かないのに、見張りが倒れずに黙った例が 1 件でもあったら、席の受け口へ書く届け方を落とし、今の見張りの終わりの固定の 1 行の形へ戻す（決定 (3)）。
    (6) Remote Control で作り手（Anthropic）の server に置かれた窓の会話の記録に、外へ出してはならない字（資格・private な project の中身）が入った例が 1 件でもあったら、Remote Control の部分を持ち主に問い直す（案 d と e を含む）。この件は判断の記録 ADR-29 の撤退の条件 (6) の数えにも足す。
plain: |
  席と相談の窓のやり取りと、携帯（mobile）からの窓の使い方を決める記録です。
  席から窓へは、決まった箱に置いた短い言付けを、あなたが次に窓で打った時に窓へ渡し、あなたの画面にも出します。言付けは承認にもあなたの言葉にもなりません。ほかの会話からの言付けは窓で全部断ります。
  窓から席へは、窓が決まった形の短い知らせを置き、席には中身の無い 1 行だけが届きます。席は中身を自分で決めて読み、命令として撃ちません。結論は今までどおり所見で受けます。
  話す窓は、守りの行が入った後に、起動の時から Remote Control に繋ぎ、携帯の app と web の一覧（claude.ai）からも見て話せるようにします。その間、窓の会話の記録は作り手（Anthropic）の server に置かれます。窓の下には、窓の名・題・所見の数・文脈の残りの 1 行を出します。
  言付けが承認として扱われたり、Remote Control が繋がらなかったりしたら、形をあなたに問い直します。
