# 判断の記録 ADR-46 — code のグラフは tsuzuri の専用の機能として作り、code の読み取りは差し替えのきく外の道具に任せ、今在る code は最初に 1 度 git の記録から一括で入れる（持ち主の裁定 2026-10-04・記帳先 = tsuzuri の台帳の問い t3-hub.80.2・t3-hub.80.3 の notes）
# 起草は席（2026-10-04）。材料は係 w142a の出力（drafts/w142a/w/shapes.md 第 2 版・shapes-ref.md・shapes-lang.md）と w141a の実測（drafts/w141a/w/linkage.md）。
id: ADR-46
title: code のグラフは、節点と辺の型・名前・置き場・増分の更新・問いの口を tsuzuri の専用の機能として作り、関数と型の読み取りは差し替えのきく外の道具（構文で探す道具と言語ごとの索引）に任せ、今在る code は最初に 1 度 git の記録から一括で入れて以後は便の着地ごとに積む
status: accepted
date: 2026-10-04
context: |
  ADR-44 の目指す所 (G1・G2) は、設計の正本から着地の commit・code までを 1 つのグラフにつなぎ、便の着地ごとに器が code から積み上げる形である。導出グラフ（ADR-7）は git と code を読まず、commit・file・関数の節点を持たない。
  持ち主の方針（2026-10-04・memo（t3-hub.80）の notes）は、これから作る物を下から積み上げるので外の道具を芯にせず tsuzuri の中の専用の機能として作り、グラフの形は既存の実装（graphify と code-review-graph）を参考にすること。Rust では rust-analyzer を使うのに賛成で、TypeScript と Python でもグラフ化と code の検索を十全にすること。
  係の調べ（w142a・2026-10-04）。code-review-graph は構文の読み手（tree-sitter）だけで code を抽き、docs と code を結ばない。graphify は code を構文の読み手で、docs を言葉の機械（LLM）で抽き、その推しで docs と code を結ぶ。器の過去の試し（2026-09-08 と 09-30）では、名の一致で結ぶ graph 系の道具は行の網羅の問いに 10 問中 1〜3 問しか答えられなかった。
  測り（V）。構文で探す道具（ast-grep・器の ADR-1105 で採用済み）は Rust・TypeScript・Python の関数と型の範囲を内蔵の文法で読み、Rust の全木の関数 23,344 個を 0.38 秒で出す（組みも Cargo の依存も 0）。git の行ごとの記録（blame）と記録の札（trailer）で「関数 → それを書いた便と行と要件」を 6.2 万行あたり 1.6 秒で引け、tsuzuri で書いた部品の関数の頭の行の 97% は札を持つ着地の commit が最後に書いた。構文の読み手の部品を crate として入れると新しい crate が 7〜9 本増える。
  問い（t3-hub.80.3）と問い（t3-hub.80.2）は、どちらも案 A に裁定された（裁定 id は承認の欄）。
decision: |
  (1) 自前の芯。code のグラフの節点と辺の型・名前・置き場・増分の更新・問いの口は、tsuzuri の専用の機能として、導出グラフ（tsuzuri-core の graph）を伸ばして作る。
  (2) 節点と辺。節点に着地の commit・file・定義（関数と型）・歯を足す。辺は少なくとも、commit → bead（着地）・commit → 定義（その定義を最後に書いた）・行 → 定義（行の便が書いた定義）・歯 → 行の done と受入基準（確かめる）とする。辺には確からしさの段を持たせ、宣言（記録の札と行の欄）と測り（行ごとの記録・索引）を分ける。言葉の機械の推しは検査（床）の材料にしない。
  (3) 名前。定義の節点の名前は「path と入れ子と名と種類」で決め、同じ名の関数と型を 1 つに潰さない。持ち込んだ code の注の古い番号（folio2 と器の番号）を今の正本へ引く名前空間は、ADR-44 の段 1 で器の取り込みの段 3 の前に決める。
  (4) 読み取りの目。関数と型の範囲は、構文で探す道具（ast-grep）の言語ごとの規則の file で読む。呼び手と参照は、言語ごとの索引（Rust は rust-analyzer・TypeScript と Python は測って選ぶ）を任意の目として後で結ぶ。目は差し替えられる形にし、tsuzuri と器の crate の依存を増やさない。言語を足す時は、規則の file と言語の表の行を足して済む形を目指す（ADR-44 の決定 (4)）。
  (5) 置き場。正本は git・台帳・器の event log のままとし、code の層はそこから導く。別の database を持たない（条 P-20）。速さのために導いた物を置く時は、git から作り直せる形に限る。
  (6) 今在る code。最初に 1 度、git の行ごとの記録と記録の札から一括で入れ、以後は便の着地ごとに積む。札に結べない定義は「結びの無い定義」として数えて出す（条 P-7）。
  (7) 採らない物。言葉の機械の推しを結びの正本にすること・名前を小文字に潰すこと・repo の中の別の database・多数の道具の口の束・意味の近さの検索（embedding）。
options:
  - id: a
    name: グラフは自前・読み取りは差し替えのきく外の道具・今在る code は一括で入れる
    text: 決定 (1) から (7)。
    verdict: adopted
    reason: 依存を増やさず、3 言語とも規則の file で足せる見込みで、結びは言葉の機械の推しでなく行と記録の札の宣言で決まる（2 つの道具に無い強み）。一括の費用は秒の単位で、結べない定義を数えて見せられる。
  - id: b
    name: 構文の読み手の部品を入れて読み取りも自前
    text: 構文の読み手（tree-sitter）の crate と言語ごとの文法の crate を入れ、tsuzuri の中で読む。
    verdict: rejected
    reason: 新しい crate が 7〜9 本増え、条 A-3 の確認が要り、器の依存 0 本の要件（NFR1003）に外れる。
  - id: c
    name: 依存なしの自前の読み手
    text: 言語ごとに標準の library だけで読み手を書く。
    verdict: rejected
    reason: 依存は増えないが、言語ごとに読み手の code を書いて保つ手間が要り、TypeScript と Python の対応が遅れる。
  - id: d
    name: 便が触った所だけを積む
    text: 一括で入れず、着地の差分が触った定義だけを積む。
    verdict: rejected
    reason: 触らない code がいつまでもグラフに入らず、穴が見えない。
basis: [ADR-7, ADR-44, ADR-1105, FR2, P-7, P-20, R-2, A-3, NFR1003]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo（t3-hub.80）か後継の memo の notes に記帳する。問う相手は持ち主。
    (1) 一括で入れた後、tsuzuri の部品（crates）の定義のうち結びの無い定義が 10% を越えたら、結びの形（記録の札と行ごとの記録）を問い直す。
    (2) 言語の段で、構文で探す道具の規則が、試しの repo の拾いの物差しに 2 度続けて届かなければ、読み取りの目の選び（案 b・c）を問い直す。
    (3) 導いた物の置き場が、git から作り直した物と 1 度でも食い違ったら、置き場の形を問い直す。
plain: |
  code のつながりの図を、どう作るかを決める記録です。
  図の形（何を点にし、何を線にし、どう名前を付け、どこに置き、どう更新するか）は tsuzuri の中で自前で作ります。code から関数や型を読み取る所だけは、取り替えのきく外の道具に任せます。そうすると、依存を増やさずに Rust・TypeScript・Python に対応できる見込みです。
  今ある code は、最初に 1 度 git の記録からまとめて図に入れ、その後は作業が終わるたびに足します。どの作業が書いたか分からない関数は、数えて見えるようにします。
approval:
  who: 持ち主
  date: 2026-10-04
  ruling: t3-hub.80.3（裁定 id = t3-hub.80.3:20261004T1456Z-1・読み取りの置き場は案 A）と t3-hub.80.2（裁定 id = t3-hub.80.2:20261004T1456Z-1・今在る code の入れ方は案 A）・束 batch:20261004T1456Z-1・裁定面・notes に逐語
  verbatim: "すべて推奨で進めて良い"
  surface: R-8
consequences:
  - commit の節点の行（ADR-44 の段 2）が 合流の完了の門（H4）を満たす最初の行になる。
  - 定義の節点の行と言語の表の行は ADR-44 の段 4 に置く。TypeScript と Python の索引の道具は、試しの repo で測ってから消費側の repo ごとに条 A-3 で名乗る。
note: 起草は席。測りは係 w142a と w141a の出力（2026-10-04）による。
