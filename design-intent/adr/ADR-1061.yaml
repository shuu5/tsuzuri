  器の案の章の要約: 候補を 6 つ並べます。 契約の表の検査が検証の命令から導いて名乗り忘れを断る案、 導いた種を名乗りに自動で足して止める案、 実行の時点で命令を止める案、 名乗りの欄を必ず書かせるだけの案、 語の表を規則の行でなく code の表に置く案、 道具や land の送り出しまで材料にする案です。 却下した 5 案にも利点を並べ、 退けた決め手が user の決定か憲法か前の決定か分析かを各案に書きます。 自動で足す案は書き手の手戻りが無い点で、 実行の時点で止める案は実装役の命令まで覆う点で、 必ず書かせる案は仕組みが最小で済む点で、 code の表の案は値を後で変えるとき user の決定を待たずに済む点で、 送り出しまで見る案は実際に外へ出るかまで見る点で、 選んだ案に勝ちます。
  器の専門語の説明: 本文に出てくる専門語 19 個を、 やさしい言葉で説明します。 この記録で意味を決めた語は「クラスの語列表」と「クラスの導出」の 2 つで、 残りは器の側の言葉です。
  ・3 クラス（three classes）: user の承認を先に要する操作の 3 分類 (消す / 出す / 使う・憲法 A1)。 「出す」は public 化と外部送信で、 自 repo への push と PR 作成は含まない (A4.3・ADR-1008)。 「使う」は憲法 A4 の語釈で追加課金。 ADR-1049 の Context は session の起動を一般に「使う」と読み、 決定は席の群の常設の承認だけ。 設計 doc は「使う」を追加課金だけと書き、 便の起動への当てはめは未決 (本 ADR の射程外)。
  ・クラスの語列表（class command table）: クラスごとの command の語の並びを持つ manifest の rules 行 1 つ (本 ADR)。 各要素は先頭の 1 語がクラスの名で、 残りが語列。 語列は allowlist の上限の語で始まり、 禁じる語列を含まない。 値は裁定 id 付きの user 裁定でだけ変わる。
  ・クラスの導出（class derivation）: 契約表の行の verify 行をクラスの語列表に当てて得るクラスの集合 (本 ADR)。 命令の語列で決め、 宛先は解かない。 行の classes がこれを含まなければ契約表の検査が断る。 write-set と land の口は入力にしない。
  ・承認 event（approval event）: user の承認を器の出来事の記録に記す event (要求と受理の 2 種・逐語付き・C7.2)。 3 クラスを名乗る便はこれで止まり、 記した回答で再開する (SRS FR1015 / FR1016)。
  ・Blocked（blocked）: 便の段の 1 つ。 3 クラスを名乗る契約が spawn の手前で承認 event を待っている状態 (SRS FR1015 / FR1016)。 本 ADR は変えない。
  ・契約表（contract table）: tracked な設計 doc が末尾に持つ機械が読む表。 1 行が契約 1 本で、 契約の正本 (SRS FR1047・ADR-1023)。 表の検査は contracts check (docs PR の CI・事後の検査) と受付 (便を作る前) が同じ 1 本で撃つ。
  ・verify 行（verify line）: 契約が持つ検証の command 1 行。 gate が便の worktree で撃ち、 rc で合否を決める。 受付は先頭語の allowlist・形・禁じる語列の門を各行に掛ける。
  ・write-set（write-set）: 契約が宣言する、 編集してよい file の集合。 項目は 6 つの形 (素の file・dir・+ 新規・- 縮む面・~ 着地で消える file・= 置き場だけ) で、 どれも対象 repo の中の path を指す。 外への編集は編集の時点で止める (C16・SRS FR1020)。
  ・rules 行（rules row）: manifest に置く規則の値 1 行 (値・有効/無効・裁定 id・裁定時刻)。 執行する規則の値の置き場 (C1 / C14) で、 足すにも変えるにも user 裁定の id が要る (C5)。
  ・裁定 id（ruling id）: user 裁定を一意に指す id。 rules 行の ruling 欄が指す。 rules 行の変更 (C5)、 閾値変更 (A2)、 憲法改訂 (N4) が要求する。
  ・禁じる語列（denied command sequence）: 許す command の内側で撃ってはいけない語の並び (例 cargo mutants・git push --force)。 受付と command guard は禁じる側の rules 行と host の見張りの 3 行 (git・tmux・台帳) の和集合を同じ読み手 1 本で読み、 command guard は実行の前に、 受付は verify 行に掛ける。 contracts check・resume の組み直し・land の追随は禁じる側の rules 行 1 つだけを読む (ADR-1025・SRS FR1056)。
  ・allowlist（allowlist）: 器が runner に与える「実行してよい command 名の列」。 値は vessel 宣言が持ち、 許す側の rules 行が上限である (ADR-1010)。 現物の上限は cargo・git・bats。
  ・command guard（command guard）: hook が Bash の command を区切りごとに語に分け、 禁じる語列に当たるものを実行の前に deny する guard (ADR-1025)。 照合の関数は受付と共有する 1 本。
  ・受付（contract intake）: 契約を便にする前に器が撃つ検査の段。 契約表の検査を 1 行に撃ち、 通った契約だけが便になる。 断った周は便も記録も作らない。
  ・自 repo への PR（own-repo PR）: 自分の repo へ branch を push して PR を作る操作。 main を動かさず閉じられるので A4.3 で可逆と扱い、 3 クラスの「出す」に当たらない (ADR-1008)。 land の口で、 契約の verify 行ではない。
  ・vessel 宣言（vessel declaration）: 対象 repo の root の tracked file .vessel.toml。 allowlist・共通 verify・検出線の行・push 先の remote などを repo 自身が名乗る (ADR-1010)。 本 ADR の導出の入力ではない。
  ・runner（runner）: 契約 1 本を worktree で実装する headless の Claude process (SRS FR1004 / FR1005)。 便の中で撃つ Bash は command guard の領分で、 本 ADR の導出の外。
  ・gate（gate）: 便の成果物を独立に検証する機構。 契約の verify 行を便の worktree で撃ち、 審査役 (lens) と合わせて判定を出す (SRS FR1008 / FR1009)。
  ・対話面（dialogue surface）: user と器が承認や裁定をやり取りする面。 ちょうど 1 つ (C7)。 承認の記帳はその席からだけ受理される (ADR-1005)。 本 ADR は変えない。
