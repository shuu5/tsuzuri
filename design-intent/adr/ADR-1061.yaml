    text: |
      3 クラスの名を閉じた型 1 つにし、 クラスごとの command の語列を rules 行 1 つ (クラスの語列表（3 種の語の表）) に置く。 契約表の検査 (docs PR の CI と受付の同じ 1 本) が行ごとに verify 行を語列表の各要素に禁じる語列と同じ照合で当て、 当たったクラスの集合が行の classes に含まれなければ、 行番号・verify 行・語列付きで断る。 クラスは命令の語列 (名) で決め、 宛先は解かない。 止めるのは受付 (in-loop) で、 CI は事後の早い知らせである。 導出の入力は verify 行だけで、 write-set・land の口・宣言の行は入力にしない。 申告の口と承認の口は変えない。 決め手は裁定。
      （平易）契約の表を検査する仕組みが、 行ごとに検証の命令を規則の行 (クラスの語列表) の語に当て、 当たった種を行が名乗っていなければ断る案です。 検査は受付が撃って仕事を作る前に止め、 同じ 1 本が文書を直す段 (docs PR の CI) で先に知らせます。 種は命令の語の並び (名前) で決め、 送り先は調べません。 材料は検証の命令だけで、 触ってよい file の列、 自分の repo へ送り出す口、 repo が名乗る宣言の命令は材料にしません。 名乗る欄と許可の仕組みは変えません。 名乗り忘れを仕事を作る前に止め、 自分の repo への PR を取り違えず、 値は規則の行 1 つに在ります。 代わりに、 字面に現れない操作は見えず、 表の中身に user の決定が要り (2026-09-24T00:13Z に決まりました)、 git push のような広い語は自分の repo への送り出しにも当たります。 名前で決まる点は前の決定が退けた性質と同じで、 当たり過ぎは、 CI に止められて名乗りを書き足す手間と便ごとの許可の手間として引き受け、 表を狭く保って許可が形だけになるのを防ぎます。 決め手は user の決定です。
      利点: 名乗り忘れた行を受付 (便を作る前・in-loop・fail-closed) で止め、 同じ 1 本が docs PR の CI で事後に早く知らせる (DR1・DR3)
      利点: 自 repo への PR は入力に現れず宛先も判定しないので、 ADR-1008 の判定と承認の節約をそのまま保つ (DR2)
      利点: 値は rules 行 1 つに置かれ、 照合は禁じる語列と同じ 1 本で、 承認の関門と既存の承認の歯は変わらない (DR4・DR5)
      欠点: 字面に現れない操作 (runner が便の中で撃つ Bash・cargo や bats が起こす code の中の操作) は見えない
      欠点: 語列表の値に user 裁定が要る (値は裁定 id user 2026-09-24T00:13Z で決まった)。 判定は命令の語列 (名) で決まり、 ADR-1008 が seam の導出で退けた「可逆性でなく名前で止める」性質を verify 行の面で持つ。 照合は語の包含なので、 git push のように宛先を問わず広く当たる語列は、 自 repo への push を verify 行に書いた行にも承認を求める。 過検出の費用は docs PR の CI の赤とその PR での classes の書き足し (CI を経ない行は受付の断り) と便ごとの承認で、 承認が増えれば ADR-1008 が案 (i) で退けた摩耗 (承認が安く大量に要求されると儀式化し、 止まる機能が薄まる) が戻る
    verdict: adopted
    reason: "決め手は裁定。"
  - id: "OPT2"
    name: "導出したクラスを申告に自動で足して Blocked にする (断らない)"
    text: |
      契約表の検査は断らず、 受付か spawn が導出したクラスを行の classes に足した集合で承認の関門を判定する。 決め手は分析 (行が実際と食い違ったまま残り、 書き手が気づくのが承認の要求の時点になる)。
      （平易）検査では断らず、 導いた種を行の名乗りに自動で足してから、 仕事を始める前の関門で止める案です。 書き手の手戻りが無く、 名乗り忘れても許可なしでは始まらない利点があります。 けれども契約の正本である表の行が「3 クラスに当たらない」と書いたまま残り、 作業の記録や審査や人が読む名乗りと器の判定が食い違います。 書き手が気づくのも仕事を始める直前の許可の要求の時点で、 受付の断りも文書を直す段の知らせも出ません。 決め手は分析です。
      利点: 書き手の手戻りが無く、 名乗り忘れても承認なしでは起動しない (関門は fail-closed のまま)
      利点: 契約表の検査に断りの型を足さない。 過検出の費用が承認だけで、 CI の赤と classes の書き足しが無い
      欠点: 契約の正本の行 (FR1047) が「3 クラスを名乗らない」と書いたまま残り、 台帳・審査・人が読む classes と器の判定が食い違う
      欠点: 書き手が気づくのは spawn の手前の承認の要求の時点で、 受付の断りも docs PR の CI の知らせも出ない。 止まる位置は OPT1 の受付と同じく実行の前 (in-loop) なので、 差は正本の食い違いと気づく時点にある
    verdict: rejected
    reason: "決め手は分析 (行が実際と食い違ったまま残り、 書き手が気づくのが承認の要求の時点になる)。"
  - id: "OPT3"
    name: "verify 行の判定を実行の時点に置く (gate が verify 行を撃つ直前に照合を掛けるか command guard を広げ、 撃つ command を実行の時点で止める)"
    text: |
      hook の command guard に 3 クラスの語列を足して便の中で当たった command を止めるか、 gate が verify 行を撃つ直前に同じ照合を掛けて止める。 決め手は分析 (止まるのは便を作った後の便の中で、 実装に使った token と手戻りが出る。 verify 行に当たる分については、 結局は行に classes を書き足すので、 OPT1 が受付で先にする断りを token を使った後に遅れて行うのと同じになる。 gate の変種は既存の質問の経路 (pipeline-question.md §5 の A 系) に乗れず、 gate から質問の段へ移る遷移を新しく要する。 command guard の変種は乗せうるが、 今の command guard は deny しか返さない)。 runner が便の中で撃つ Bash の分は OPT1 では見えず、 command guard を広げる形は CSQ-N1 の後続の決定に残す。 本 ADR が退けるのは、 verify 行の判定を実行の時点に置く形である。
      （平易）命令を実行する時点で 3 クラスの語を当てて止める案です。 Bash の命令を実行の前に止める見張り (command guard) に語を足すか、 検査の段が検証の命令を撃つ直前に同じ当て方を掛けます。 実装役が便の中で撃つ命令まで覆え、 表の検査に手を入れずに済みます。 けれども止まるのは便の中で、 実装役が token を使った後 (検証の直前に掛ける形では実装を終えた後) になり、 手戻りも出ます。 検証の命令に当たる分は、 結局は行に 3 クラスを書き足すので、 選んだ案が仕事を作る前にする断りを、 token を使った後で遅れて行うのと同じです。 いまある問いの段の道 (便を止め、 契約の持ち主の席が行に 3 クラスを書き足し、 機械の回答を記して起こし直し、 起こす手前で人の許可を待つ道) に乗せれば、 許可を受ける口は増えません。 けれども当たる便ごとに、 止まる・書き足す・回答を記す・起こし直す・許可を待つという往復が起きます。 問いの段へ入れるのは実装役が問いを返して終えたときだけなので、 検証の直前に掛ける形はこの道に乗れず、 新しい移り方が要ります。 見張りに語を足す形は乗せうるものの、 いまの見張りは止めることしかできず、 止めた命令を問いへつなぐ形に変える手間が要ります。 見張りを広げる形では、 検証の命令は Claude の外で撃たれるので見張りが掛かりません。 実装役が便の中で撃つ命令の分は選んだ案では見えないので、 見張りを広げる形は後の決定に残します。 この記録が退けるのは、 検証の命令の判定を実行の時点に置く形です。 決め手は分析です。
      利点: runner が便の中で撃つ Bash も覆う (OPT1 の字面では見えない面)
      利点: 契約表の検査に手を入れない
      欠点: 止まるのは便の中で、 実装に token を使った後 (gate の変種では実装を終えた後) になる。 verify 行に当たる分については、 結局は行に classes を書き足すので、 OPT1 が受付で先にする断りを、 token を使った後の便の中で遅れて行うのと同じになる。 既存の質問の経路 (pipeline-question.md §5 の A 系) に入る口は、 runner が質問 record を付けて rc 76 で終えた周の spawn の 1 つだけである。 gate の変種は実装を終えた後の gate で止まるのでこの経路に乗れず、 gate から質問の段へ移る遷移を新しく要する。 command guard の変種は乗せうるが、 今の command guard は deny しか返さないので、 deny を質問 record へ導く形に変えないと、 先に聞く操作を「絶対にやらない」操作に変える。 経路に乗った周は、 orchestrator (契約の所有者の席) が行に classes を足し、 機械由来の回答を記して resume し (回答が無い周の resume は rc 3 で何も書かない)、 写しを行から取り直して spawn の手前の関門で Blocked になり、 承認の subcommand が承認 event を記す。 承認の口は増えない (回答は機械由来で、 user の言葉は承認 event にだけ載る・C7.2) が、 当たる便ごとに停止・書き足し・回答の記帳・写しの取り直し・再 spawn・Blocked・承認の往復が起きる
      欠点: command guard を広げる形では、 gate が撃つ verify 行は Claude の session の外で sh -c で撃たれ、 hook が掛からない (gate の直前の照合を足せば見えるが、 止まるのは同じく便の中である)
    verdict: rejected
    reason: "決め手は分析 (止まるのは便を作った後の便の中で、 実装に使った token と手戻りが出る。"
  - id: "OPT4"
    name: "classes を必須の key にし、 3 クラスに当たらない行にも明示の 1 語を書かせる"
    text: |
      契約表の行と契約 file の classes を必須にし、 空の代わりに「当たらない」を表す 1 語を書かせる。 決め手は裁定 (判定が書き手の申告のままで、 機械が決める形にならない)。
      （平易）3 クラスの欄を必ず書く欄にし、 当たらない行にも「当たらない」を表す 1 語を書かせる案です。 足す仕組みが最小で、 規則の行も user の決定も要らず、 書き手が行ごとに 3 クラスを考える機会が必ず生まれます。 けれども判定は名乗りのままで、 誤って「当たらない」と書いた行はそのまま通ります。 238 行すべてに書き足す手間が出るのに、 止められる名乗り忘れは増えません。 決め手は user の決定 (仕組みで守らせる) です。
      利点: 足す仕組みが最小で、 rules 行も裁定も要らない
      利点: 書き手が行ごとに 3 クラスを考える機会が必ず 1 回生まれる
      欠点: 判定は依然として申告で、 誤って「当たらない」と書いた行はそのまま通る (DR1)
      欠点: 既存の 238 行すべてに 1 語を書き足す手間が出るが、 止められる名乗り忘れは増えない
    verdict: rejected
    reason: "決め手は裁定 (判定が書き手の申告のままで、 機械が決める形にならない)。"
  - id: "OPT5"
    name: "語列の判定表を rules 行でなく code の閉じた表に置く"
    text: |
      クラスごとの語列を core の const の表に置き、 型で網羅させる。 決め手は憲法 (C1 / C14 は執行する規則の値を manifest に置くことを、 C5 は値の変更に裁定 id を求める)。
      （平易）種ごとの語の表を規則の行でなく、 器の code の中の閉じた表に置く案です。 値を後で変えるときに規則の行の決定を待たずに済み (今回の値は決定済みなので、 差はそこにだけ出ます)、 綴り違いを compile が捕まえる利点があります。 けれども器が執行する規則の値が規則の file の外に在ることになり、 値の変更が user の決定の印なしの code 変更で通ってしまいます。 憲法が求める「規則の値は規則の file 1 つ・変更には決定の印」を迂回し、 憲法の説明欄が書く「規則の行 + 判定の仕組み」の形からも外れます。 決め手は憲法です。
      利点: rules 行の裁定を待たずに実装を着地できる (今回の値は裁定済みなので、 差は値を後で変える周に出る)
      利点: 表の要素が型で閉じ、 綴り違いを compile が捕まえる
      欠点: 執行する規則の値が manifest の外に在り、 値の変更が裁定 id なしの code 変更で通る (C1 / C14 / C5 を迂回する)
      欠点: A4 の機構欄が書く「rules 行 + enforcer」の形から外れる
    verdict: rejected
    reason: "決め手は憲法 (C1 / C14 は執行する規則の値を manifest に置くことを、 C5 は値の変更に裁定 id を求める)。"
  - id: "OPT6"
    name: "道具や seam の使用、 land の push まで導出の入力にする"
    text: |
      verify 行に加えて、 --pr-cmd の文面や vessel 宣言の remote への push を入力にし、 外へ出る操作をすべて導く。 決め手は憲法 (A4.3) と ADR-1008 (自 repo への PR は可逆で「出す」ではない)。
      （平易）検証の命令に加えて、 PR を出す道具の文面や、 repo が名乗る送り先への送り出しまで材料にし、 外へ出る操作をすべて導く案です。 land が実際に repo の外へ出るかまで機械が見て、 送り先が他の repo を指すときも捕まえうる利点があります。 けれども自分の repo への branch の送り出しと PR 作成を「出す」と分類し、 便ごとに許可を消費します。 これは前の決定が廃止した形の持ち込みで、 憲法の「自分の repo への PR は取り消せる」に反します。 送り先の解決は道具の側に在り、 器が道具ごとの書き方を追いかけることにもなります。 決め手は憲法と前の決定です。
      利点: land が実際に repo の外へ出るかまで機械が見る
      利点: 宣言の remote が他 repo を指す周を捕まえうる
      欠点: 自 repo への branch の push と PR 作成を「出す」に分類し、 便ごとに承認を消費する (ADR-1008 が廃止した形の再導入・A4.3 に反する)
      欠点: 宛先の解決は道具の側に在り、 器が道具の方言を追う実装を抱え込む (ADR-1008 の却下案 (ii) の理由)
    verdict: rejected
    reason: "決め手は憲法 (A4.3) と ADR-1008 (自 repo への PR は可逆で「出す」ではない)。"
basis: [FR1001, FR1004, FR1005, FR1008, FR1009, FR1015, FR1016, FR1020, FR1047, FR1056, NFR1004, ADR-1005, ADR-1008, ADR-1010, ADR-1014, ADR-1023, ADR-1025, ADR-1049, ADR-1055]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「3 クラス」は、 取り消せないので先に人に聞く 3 種の操作 (消す / 出す / 使う) のことです。 器 (scribe2 の本体) は、 契約 (1 つの仕事の約束) が自分で「この仕事は 3 クラスに当たる」と名乗ったときだけ、 仕事を始める前に止まって人の許可を待っていました。 名乗り忘れた契約は、 検証の命令の中で repo の外へ送る操作を書いていても、 許可なしで進みます。 この記録は、 3 種の操作の名前を 1 つの閉じた型にし、 種ごとの命令の語の並びを規則の行 (rules 行) 1 つに置き、 契約の表を検査する仕組みが検証の命令をその語に当てて、 当たった種を契約が名乗っていなければ断る、 と決めます。 止めるのは契約を仕事にする前の検査 (受付) で、 同じ 1 つの関数が設計の文書を直す段 (docs PR の CI) でも先に知らせます。 導き出す材料は検証の命令だけで、 種は命令の語の並び (名前) で決め、 送り先は調べません。 触ってよい file の列や、 自分の repo へ PR を出す口は材料にしないので、 自分の repo への PR を「出す」と取り違えません。 契約が名乗る欄と、 人の許可を受け取る仕組みは変えません。 語の並びの中身は user が決め、 この記録は中身を決めません。
consequences:
  - "この判断で良くなることと、 代わりに引き受けることです。 名乗りを書き忘れた行でも、 検証の命令が表に当たれば仕事を作る前の検査 (受付) で止まり、 文書を直す段の CI が先に知らせます。 自分の repo への PR は材料に無いので許可を消費せず、 許可の仕組みと既存の test はそのまま効きます。 判定の値は規則の行 1 つに在って user の決定で変わり、 前の決定が書き手に預けた「名乗る作法」のうち、 検証の命令に現れる分だけを機械が引き受けます。 代わりに引き受けることは 6 つです。 実装役が便の中で撃つ命令や、 命令が起こす code の中の操作は見えません。 表の中身は user の決定 (2026-09-24T00:13Z) で決まりました。 出す = git push、 消す = git push --delete と git push -d、 使う = なしです。 値の正本は規則の行 1 つで (設計の文書の行はそれを載せる実装の契約です)、 この記録は値の正本になりません。 いまの表の行で当たるものは 0 本です。 撃ってよい命令の上限を広げるときは表も決め直します。 語の当て方は名前で決まり送り先を見ないので、 広い語は自分の repo への送り出しにも当たり、 そのときは CI に止められて名乗りを書き足す手間と、 便ごとの許可の手間になります。 器の中で上限の材料を組み立てる全部の箇所に欄が 1 つ増え、 憲法の説明欄の「次の版」の文は現物と食い違います。 repo が名乗る宣言の命令は材料の外に残ります。 PR を出す道具に他の repo へ送り出す道具を渡す穴 (前の決定が弱い点に挙げた例) も、 送り出しの口が材料の外なので開いたままです。"
  - "良い結果: classes を書き忘れた行でも、 verify 行が語列表に当たれば受付が便を作る前に止め、 docs PR の CI が先に知らせる。 関門の発火が書き手の善意から字面の照合へ移る"
  - "良い結果: 自 repo への PR は導出の入力に無いので承認を消費しない (ADR-1008 の効果を保つ)。 承認の口と申告の口は変わらず、 既存の承認の歯はそのまま効く"
  - "良い結果: 判定の値は rules 行 1 つに在り、 裁定 id で変わる。 照合は禁じる語列と同じ 1 本で、 2 本目の読み手を作らない。 ADR-1008 が書き手の規律に残した「起票時に classes を名乗る運用」のうち、 verify 行の字面に現れる分だけを機械が引き受ける。 C17.2 で消すものは、 pipe/land/finish.rs の注記「3 クラスの判定は契約の自己申告だけに効く」と、 pipeline.md §5.5 の「deny list は未着・enforcer は次の版」の文である。 pipeline.md §11 の後続の行「3 クラスの機械 enforcer」は、 --pr-cmd の分と runner の Bash の分へ狭める"
  - "代償: 字面に現れない操作は見えない。 runner が便の中で撃つ Bash (allowlist の git の中の push など) は command guard を広げる後続の決定が要り、 cargo や bats が起こす code の中の操作は審査と write-set の側に残る"
  - "代償: 語列表の値に user 裁定が要り (C5)、 値は裁定 id user 2026-09-24T00:13Z で決まった (publish git push ／ delete git push --delete・git push -d ／ consume 要素なし・値の正本は rules 行 1 つ (設計 doc の行はそれを載せる実装の契約)・本 ADR は値を SSOT にしない)。 値の検査は現物 (main e5da320) で成り立つ。 3 要素とも先頭語 git は runner.allowed_commands に在る。 受付が読む禁じる語列の和集合 (4 行・16 語列) のどれかを含む要素は無く、 git push --force と git push -f とは一部が重なるだけである。 契約表 238 行の verify 553 本で当たる行は 0 本である。 git push --delete か git push -d を書いた verify 行は git push の要素にも当たるので、 出すと消すの 2 つが導かれる。 値を広げる裁定は、 先に tracked な契約表の verify 行の母集団を測り (現物は 553 本・git と bats で始まる行 0 本・main e5da320)、 当たる既存の行には同じ PR で classes を書く。 runner.allowed_commands を広げる裁定は、 同じ PR で語列表を裁定し直す"
  - "代償: 判定は命令の語列 (名) で決まり宛先を解かないので、 ADR-1008 §2.2 が seam の導出で退けた「可逆性でなく名前で止める」性質を verify 行の面で持ち、 広い語列 (例 git push・裁定した出すの要素) は宛先を問わず当たる。 受け入れる理由は 3 つで、 過検出は docs PR の CI の赤とその PR での classes の書き足し (CI を経ない行は受付の断り)・便ごとの承認の費用に倒れ、 黙って通すことはないこと (fail-closed)、 裁定した値 (git で始まる 3 要素) は現物の母集団で当たる行が 0 本であること (cargo で始まる要素を足す裁定は先に 553 本と照合し直す)、 語列表の値を裁定で狭く保つことである。 承認が安く大量に要求されると儀式化して止まる機能が薄まる (ADR-1008 が案 (i) を退けた摩耗) ので、 値を狭く保つことがその備えになる。 照合は順序を問わない語の包含なので、 verify 行の引数の語が要素の語と一致しても当たる (例 git log --grep push が git push の要素に当たる)。 照合の 1 本は manifest の並びで最初の 1 件だけを返すので、 全件名指しには要素ごとに撃つ集約が要る。 広い要素が verify 行の自 repo への push に当たる周は、 A4.3 の可逆を「出す」に数える緊張を OPT6 と同じく持つ (OPT6 を退けた A4.3 の決め手は本案にも条件付きで当たる)。 差は、 OPT6 では land の全便に構造として起き、 本案では裁定した値の範囲の行だけ (現物 0 本) に起きることである。 宛先の弁別は ADR-1008 の却下案 (ii) と同じ理由でしない"
  - "代償: 上限の材料 (Ceiling) の組み立ての全箇所と契約表の検査の材料に欄が 1 つ増える。 A4 の機構欄の「enforcer は次の版」の文は現物と食い違うが、 条の文の改訂は A2 の手続きで本 ADR の射程外である。 禁じる語列の材料は contracts check・resume の組み直し・land の追随が 1 行、 受付が和集合の 4 行で、 CI を通った行が受付の禁じる語列で断られる差は残る (受付の方が広い＝fail-closed 側・本 ADR は揃えない)"
  - "代償: vessel 宣言の共通 verify と検出線の行は導出の外に残る (どの便にも撃つ行を便ごとの承認で覆えないため・現物はすべて cargo で始まる)。 宣言の側を断るかは別の決定に残す"
  - "代償: --pr-cmd に外向きの道具を渡す周は本 ADR の後も開いたままである。 ADR-1008 §3 Negative の実例 (classes を空にした契約が --pr-cmd に他 repo へ push する道具を渡す) は land の口が導出の入力の外なので塞がらず、 書き手の規律と後続の決定に残る"
