  関門は契約が何をするかで立ち、 何を名乗ったかでは立たない。 字面から導けるものは機械が導き、 名乗りは導出を狭められず広げることだけができる。
  本 ADR が自動で足す案・実行の時点で止める案・申告を必須にするだけの案・code の表に置く案・道具の使用から導く案を退け、 契約表の検査が verify 行から導いて名乗り忘れを断る形を選んだのはこの原則に行き着く (これ以上は遡らない照会終端)。
