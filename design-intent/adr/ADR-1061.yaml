  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録は前の決定を置き換えない追補です。 自分の repo への PR は「出す」ではなく、 PR を出す道具を使ったことから導かないと決めた前の決定 (ADR-1008) はそのまま守ります。 その決定が「判定の仕組みは次の版へ」と後に回した席のうち、 契約の検証の命令の分に座ります。 憲法の説明欄の「規則の行 + 判定の仕組み」には 1 つずつ当たります。 語の表は規則の行の側に、 禁じる語列と並ぶ「先に聞く」側の行として足し、 表の検査の導出が判定の仕組みの側です。 送り先は調べません。 許可の関門が読むのは名乗りのままで、 判定の面は 1 つのままです。 許可の受け取り方 (ADR-1005)、 禁じる語列と語を当てる関数 (ADR-1025)、 契約の正本は表の行であること (ADR-1023)、 席の口座の群の常設の承認 (ADR-1049) は変えず、 憲法の文も変えません。 この記録は発効前 (proposed) で、 受け入れが決まり (accepted)、 決まった表の中身が決定の印付きで規則の行に載るまで何も拘束しません。 原則は「関門は契約が何をするかで立ち、 何を名乗ったかでは立たない」です。
