  追補。 ADR-1008 のうち、 §2.1 の範囲の解釈 (自 repo への branch の push と PR 作成は A4.3 の可逆で「出す」ではない)・seam の使用からの導出の廃止・却下案 (ii) (--pr-cmd の文面や remote の URL から宛先を判定する形) の却下は不変である。 push 先が自 repo かの弁別は ADR-1008 §2.3 が決めない範囲に置いたもので、 本 ADR も宛先は判定しない。 §2.2 の MVP の形 (判定は契約の自己申告だけ・rules 行の deny list は未着) には、 §2.3 が次の版に置いた enforcer のうち verify 行の分が加わる。 A4 機構欄の「rules 行 + enforcer」には 1 対 1 で当たる。 クラスの語列表は rules 行の側に、 禁じる語列 (ADR-1025・その一部は既に 3 クラスの操作を拾う) と並ぶ先に聞く側の行として足す。 契約表の検査の導出が enforcer の側である。 承認の関門が読むのは classes のままで、 判定の面は 1 つのまま (ADR-1008 の Positive を保つ)。 ADR-1008 §3 Negative の予告 (enforcer を入れる周に land 側へ判定の材料を渡し直す設計) は、 verify 行の分については要らない (関門が classes を読むため)。 --pr-cmd の分 (CSQ-N6) を後続の決定で塞ぐ周には、 その予告がそのまま残る。 ADR-1005 (承認の受理面) と ADR-1025 (禁じる語列と照合の 1 本) と ADR-1023 (契約の正本は契約表の行) と ADR-1014 (極性一覧) は不変。 ADR-1049 (席の口座の群の常設の承認) も不変で、 本 ADR は supersede しない。 憲法の条文と A4 の機構欄は変えない。 クラスの語列表の値の裁定 (裁定 id user 2026-09-24T00:13Z) は出ており、 発効は本 ADR が accepted になり、 その値が裁定 id 付きで rules 行に載った後で、 それまで何も拘束しない。 accepted への移行と land は user の go (A1) で行う。
