# 判断の記録 ADR-1061 — 器 scribe2 の判断の記録 ADR-0061 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1061
title: "3 クラス (消す / 出す / 使う) は契約表の行の verify 行から rules 行の語列で導き、 名乗らない行を契約表の検査が断る — 申告の口と承認の口は変えず、 自 repo への PR は導出の入力に無い"
status: proposed
date: 2026-09-24
context: |
  取り消せない操作 (消す / 出す / 使う = 3 クラス) の前で器が人の承認を待つ関門は、 契約が自分で 3 クラスを名乗ったときにしか立たなかった。 名乗り忘れた契約は、 verify 行で repo の外へ push していても承認なしで通る。 本 ADR は、 3 クラスの名を閉じた型 1 つにし、 クラスごとの command の語列を manifest の rules 行 1 つに置き、 契約表の検査 (docs PR の CI と受付が撃つ同じ 1 本) が行の verify 行をその語列に当てて導いたクラスを行が名乗っていなければ断る、 と決める。 導出の入力は契約表の行の verify 行だけで、 write-set と land の口 (自 repo への push と PR) は入力にしないので、 自 repo への PR を「出す」と誤判定しない。 申告の口 (行の classes) と承認の口 (spawn の手前の Blocked と承認 event) は変えない。 語列の値は user の裁定で決まり、 本 ADR は値を決めない。
  なぜこの判断が要るのかを、 user の決定と監査と器の現物と前の決定から説明します。 user は、 器の決まりを文章の作法でなく仕組みで守らせる、 と決めました。 同じ日の監査は、 3 クラスの関門が契約の名乗りだけで立つことを 4 つの見方から指摘し、 器の現物でもそのとおりでした。 契約の 3 クラスの欄は書かなくてよい欄で、 空のときは関門が立たず、 いま表に在る 238 行のうち欄を書いた行は 0 行です。 検証の命令は器自身が撃つ命令で、 撃ってよい命令の上限は cargo・git・bats、 撃ってはいけない語の並び (禁じる語列) は「絶対にやらない」側の表だけです。 ∴ 検証の命令に git push を書いた契約は、 名乗らなければそのまま撃たれます。 憲法は、 3 クラスの前に許可を取ること、 merge・自分の repo への送り出し・依存を変えない code の変更は取り消せると扱うこと (自分の repo への branch の push と PR 作成をこの送り出しと読むのは前の決定 ADR-1008 の解釈です)、 規則の値を規則の file に置き変更には user の決定の印を付けること、 逸脱を編集の時点で止め、 後からの検査で止めの代わりにしないことを求めます。 前の決定 (ADR-1008) は、 PR を出す道具を使ったことから 3 クラスを導く形を、 取り消せるかどうかでなく道具の名前で止めていたとして廃止しました。 PR を出す道具の文面や送り先の URL から送り先を調べる案も退け、 名乗り間違いを捕まえる仕組みは次の版に回していました。 契約の字面のうち、 触ってよい file の列は自分の repo の中の変更だけを指し (着地で file を消す形も git から戻せます)、 便の中で実装役が撃つ命令や、 命令が起こす code の中の操作は字面に現れません。 「使う」は憲法の語釈では追加課金です。 前の決定 (ADR-1049) は口座を消費する session の起動を一般に「使う」と読み、 決めたのは席の群の常設の許可だけです (群の移動の決定 ADR-1055 も同じ読みです)。 設計の文書は「使う」を追加課金だけと書くので、 仕事の便を起こすことが当たるかは割れたままで、 この記録では決めません。
  CTX1 裁定と監査 — 承認の関門は名乗った契約にしか立たない
  2026-09-12 の user 裁定は、 器の規律を散文や字面の作法でなく構造と機械で守らせる、 という向きを定めた (要旨・逐語は台帳)。 同日の全体監査は、 3 クラス（先に聞く 3 種の操作） (消す / 出す / 使う) の関門が契約の自己申告だけで発火することを 4 つの見方から指摘した (台帳 s2-07l.167)。 main の現物で再現すると次のとおりである。 契約 file の classes は任意の key で既定は空である (pipe/contract.rs)。 承認の判定は classes が空でなく承認 event（人の許可の記録） が無いときだけ Blocked（人の許可待ちの段） を返す (pipe/approve.rs の判定)。 判定は唯一の起動口 (pipe/spawn.rs) の頭に在り、 spawn・resume・run の全経路を覆う。 land の PR の口の注記は「3 クラスの判定は契約の自己申告だけに効く」と書く (pipe/land/finish.rs)。 設計 doc は操作の中身から判定する enforcer を後続に置く (pipeline.md §5.5 と §11)。 tracked な設計 doc の契約表（設計 doc の契約の表） 238 行 (contracts check の rows・main e5da320) のうち classes を書いた行は 0 行である。 ∴ 名乗り忘れた契約には関門が一度も立たず、 承認 event を記す堅い後段が空回りしうる。
  CTX2 現物 — verify 行（検証の命令 1 行）は器が自分で撃つ command で、 git の中の push は通る
  契約の verify 行は、 gate（着地の前の検査） が便の worktree で sh -c で撃つ command である (契約表の行から生成した写しの値)。 受付（便にする前の検査）と契約表の検査は各行に形の門を掛け、 次の 6 つのどれかに当たる行を断る。 shell の包みや連結の文字を持つ、 空である、 先頭語が vessel 宣言（repo の宣言 file）の allowlist（撃ってよい命令名） (上限は rules 行（裁定つきの規則の行） runner（実装役の Claude）.allowed_commands = cargo・git・bats) に無い、 repo の外を指す語を持つ、 閉じた集合の外の穴 (波括弧の埋め字) を持つ、 禁じる語列（撃ってはいけない語）に当たる、 の 6 つである。 受付が読む禁じる語列は command guard（Bash の実行前の見張り） と共有する和集合の読み手 1 本で、 rules 行 runner.denied_commands (cargo mutants・cargo publish) と host の見張りの語列 3 行 (git push --force などの git・tmux・台帳) の 4 行を読む。 禁じる語列は「絶対にやらない」側の表で、 人に聞けば通してよい「先に聞く」側の表は manifest に 1 本も無い。 ∴ verify 行に git push を書いた行は、 classes が空のままこれらの門を通り、 gate がそのまま撃つ。 契約表の検査は contracts check (docs PR の CI) と受付が同じ関数 1 本 (check_table) を撃つ。 ただし禁じる語列の材料は、 受付が和集合の 4 行、 contracts check が runner.denied_commands の 1 行だけで、 受付の方が広い (resume の組み直しと land の追随も 1 行を読む)。 また、 手で書いた契約 file は受付が断るので、 すべての契約はこの 1 本を通る。 語列の照合は command guard・受付・host の見張りが共有する 1 本 (hook の matched) である。 母集団 (main e5da320) は、 契約表の verify 行 553 本はすべて cargo nextest で、 git や bats で始まる行は 0 本である。
  CTX3 憲法と既存の決定の向き
  A1 は 3 クラスの操作の前に対話面（人と器が話す窓口）で承認を取ることを、 A4.2 は取り消せない操作 (destroy・publish・追加課金) を先に聞くことを、 A4.3 は merge・自 repo への dispatch・依存なしの code 変更を A4.2 の目的で可逆と扱うことを求める。 A4 の機構欄は 3 クラスの判定を「rules 行 + enforcer」と書き、 MVP は契約の自己申告と rules 行の deny list、 enforcer は次の版とする (本 ADR は条文と機構欄を変えない)。 C1 と C14 は執行する規則の値を manifest 1 つに置くことを、 C5 は rules 行の追加と変更に user 裁定の id を要することを、 C16 は逸脱を編集の時点で止め、 事後の検査で止めの代わりにしないことを、 C17.2 は仕組みを足す前に消すものを名指すことを、 N2 は散文だけの規則を規則と扱わないことを求める。 器の極性一覧 (ADR-1014) は、 契約表の検査 (docs PR の CI) を事後 (post-hoc・fail-closed) に、 受付の断りを便を作る前 (in-loop・fail-closed) に分類する。 ADR-1008 は、 自 repo への branch の push と PR 作成を A4.3 の可逆として「出す」から外し、 seam (--pr-cmd) の使用からクラスを導く形を廃止した。 廃止の理由は、 それが操作の可逆性でなく道具の名前で止めていたことである (他 repo へ push する道具を渡しても自 repo へ PR を出す道具を渡しても同じ判定になる)。 同 ADR は判定の面を契約の自己申告 + rules 行の deny list のまま (deny list は未着) とした。 却下案 (ii) は、 --pr-cmd の文面や remote の URL から宛先 (自 repo か) を判定する enforcer を、 宛先の解決は道具の側に在り器が道具の方言を追うことになるとして退け、 判定の面を次の版の enforcer (A4 機構欄) へ置いた。 同 ADR の Negative は、 名乗り間違いを機械が捕まえられない例として、 classes を空にした契約が --pr-cmd に他 repo へ push する道具を渡せば器は止めずに通す、 を挙げ、 起票時に classes を名乗る書き手の規律に預けた。 本 ADR は、 同 ADR が次の版の enforcer に置いた席のうち、 契約の verify 行の分に座る。 ADR-1025 は禁じる語列を rules 行に置き、 同じ照合を command guard と受付の verify 行に掛けた。 ADR-1023 は契約の正本を設計 doc の契約表の行と決めた。
  CTX4 契約の字面が見せるものと見せないもの
  契約表の行は write-set（触ってよい file の列）・verify 行・classes などを持つ。 write-set の項目は 6 つの形を持つ。 素の file、 末尾 / の dir、 + (宣言した新規 file)、 - (縮む面)、 ~ (着地で消える file)、 = (置き場だけの file) で、 どれも対象 repo の中の path を指し、 受付と契約表の検査が形ごとに解けることを確かめる。 ∴ write-set の編集は対象 repo の中の code 変更で、 依存の変更でなければ A4.3 の可逆に当たり、 依存の変更は A3 の門 (cargo deny と依存の差分の検査) が別に持つ。 ~ は自 repo の tracked file を着地で消す宣言だが、 消えた file は git の履歴から戻せる。 憲法 A4 の語釈の「消す」(データ / repo / 履歴 / live 成果物の破壊) のどれにも当たらず (履歴は残り、 repo もデータも壊さず、 main 上の file は merge を戻せば戻る)、 A4.3 の可逆 (依存なしの code 変更) に当たるので、 A1 の「消す」に数えない。 これは本 ADR が置く解釈である (ADR-1008 は「消す」の範囲に触れていない)。 land の口は契約の外に在る。 push 先の remote と CI の判定を読む行は vessel 宣言が持ち、 --pr-cmd は pipe land を撃つ側が渡す CLI 引数である。 vessel 宣言の共通 verify と検出線の行も宣言の側に在り、 現物はすべて cargo で始まる。 契約の字面に現れないものが 2 つある。 runner が便の中で撃つ Bash (allowlist の git の中の push を含む) と、 cargo や bats が起こす code の中の操作である。 前者は command guard の領分、 後者は審査と write-set の領分である。 3 クラスの「使う」の正規の語釈は憲法 A4 の追加課金で、 本 ADR の語列表の「使う」はその語列だけを持つ。 allowlist の上限 (cargo・git・bats) に追加課金の command は無く、 今の母集団に当たる語列が無いので、 要素は 0 個で足りる。 ADR-1049 の Context は、 器が口座を消費する session を起こすことを一般に「使う」と読み、 決定は席の口座の群の常設の承認だけである (群の移動を A1 の「使う」とする ADR-1055 も同じ系譜)。 逆向きに pipeline.md §2 は、 runner と lens は定額の中で走り追加課金の口を持たない (「使う」= 追加課金だけ) と書く。 便の spawn の起動への当てはめは両者が割れたままで、 本 ADR では決めない (射程外・契約の verify 行に無いので語列の外)。
  （選択肢を測るものさし）この判断を評価する 5 本のものさしです。 関門が立つかを書き手の名乗りでなく契約の字面から機械が決めること、 自分の repo への PR を「出す」と取り違えず、 前の決定が退けた「道具の文面や送り先の URL から送り先を調べる形」を持ち込まないこと、 名乗り忘れを仕事を作る前の検査 (受付) で止め、 後からの検査を止めの代わりにせず、 判定の材料が読めないときは断る側へ倒すこと、 判定の値を規則の行 1 つに置いて user の決定で変え、 語を当てる関数は既存の 1 本を使うこと、 そして名乗る欄と許可を受け取る仕組みを変えずに、 足すものを最小にして消すものを名指すことです。
  DR1｜3 クラスの関門の発火を、 書き手の申告の有無でなく契約の字面から機械が決める CTX1 (裁定・監査)・CTX3 (A1 / A4.2 / N2)
  DR2｜自 repo への PR（自分の repo への PR） を「出す」と誤判定せず、 ADR-1008 の却下案 (ii) が退けた「--pr-cmd の文面や remote の URL から宛先を判定する形」を持ち込まない CTX3 (A4.3・ADR-1008)・CTX4
  DR3｜名乗り忘れを便を作る前 (受付・in-loop) で止め、 事後の検査 (docs PR の CI) は早い知らせに使って止めの代わりにせず、 判定の材料が読めない周は断る側へ倒す CTX2・CTX3 (C16・ADR-1014)・SRS NFR1004
  DR4｜判定の値は manifest の rules 行 1 つに置いて裁定 id（user の決定を指す印） で変え、 照合は既存の 1 本を使う (2 本目の読み手を作らない) CTX2・CTX3 (C1 / C14 / C5 / C2)
  DR5｜申告の口と承認の口は変えず、 足すものを最小にして消すものを名指す CTX1・CTX3 (C17.2・ADR-1005)
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 3 種の操作の名前を 1 つの閉じた型にし、 種ごとの命令の語の並びを規則の行 1 つ (クラスの語列表) に置きます。 表の各要素は撃ってよい命令の上限の内の語で始まり、 受付が読む禁じる語列の全体 (禁じる側の規則の行と host の見張りの 3 行) のどれもまるごと含みません (含む要素は受付が先に断るので、 当たる行が無いためです)。 契約の表の検査は、 行ごとに検証の命令を表の各要素に、 禁じる語列と同じ関数で当て、 当たった種の集まり (クラスの導出) が行の名乗りに含まれなければ、 行番号と命令と当たった語を付けて全部を名指して断ります。 種は命令の語の並び (名前) で決め、 送り先は調べません。 止めるのは仕事を作る前の検査 (受付) で、 文書を直す段の CI は先に知らせる役です。 名乗りが広い行は通します。 表の行が無い・読めない・切られているときも断ります。 材料は検証の命令だけで、 触ってよい file の列、 自分の repo へ送り出す口、 repo が名乗る宣言の命令は材料にしません。 名乗る欄と、 許可を待つ段と許可の記録は変えません。 要件書では、 3 クラスを名乗る契約が止まる要件 (FR1015) がこれで検証の命令が表に当たる契約すべてに届くこと (表が空なら何も変わりません)、 契約の不備を全部行番号付きで断る要件 (FR1001)・禁じる語列を検証の命令に当てる要件 (FR1056)・契約を表の 1 行だけから取る要件 (FR1047) が形の根拠になること、 読めない入力を黙って通さない要件 (NFR1004) がこの判定にも効くことを示します。
  採用 — OPT1
  器 SHALL 3 クラスの名を閉じた型 1 つ (消す = delete・出す = publish・使う = consume) で持ち、 契約表の行と契約 file の classes の受理集合をこの型から取る。 器 SHALL クラスごとの command の語列を manifest の rules 行 1 つ (クラスの語列表) に置き、 行の kind は規則の閉じた型の variant 1 つ、 値の各要素は先頭の 1 語がクラスの名で残りの語が語列とする。 rules の読み SHALL 各要素の語列の先頭語が runner.allowed_commands の値に在ることを確かめ、 要素の語列が禁じる語列を含む (禁じる語列の先頭語が要素の語列の先頭語と同じで、 残りの語がすべて要素の語列に在る) 値を断る。 ここでの禁じる語列は、 受付が読む和集合 (runner.denied_commands と host の見張りの語列 3 行・command guard と共有する読み手 1 本) とする (上限の外の先頭語の要素と和集合の語列を含む要素は、 受付が先に断るので当たる行が無く死に値になるため)。 禁じる語列と一部だけ重なる要素 (例 git push と git push --force) は通し、 禁じる側の断りが先に立った残りの行だけに当たる。 値は裁定 id 付きの user 裁定でだけ変わり (C5)、 本 ADR は値を決めない。 クラスの語列表は契約表の検査を撃つ全経路 (contracts check・受付・resume の組み直し・land の追随) が同じ行 id の 1 行を読む (land の追随だけは --rules の差し替えを受けず常に埋め込みの manifest を読む・禁じる語列と同じ差)。 契約表の検査 (contracts check と受付が撃つ同じ 1 本) SHALL 行ごとに各 verify 行を語列表の各要素に禁じる語列と同じ照合の 1 本で当て、 当たった要素のクラスの集合 (クラスの導出（字面から導いた 3 種）) を作り、 導出に在って行の classes に無いクラスを行番号・verify 行・当たった語列付きで全件名指して断る (契約表の検査の断りの型に variant 1 つ・受付は既存の契約表の断りとして便を作らない)。 止めるのは受付 (in-loop) で、 contracts check (docs PR の CI) は事後の早い知らせとし止めの代わりにしない。 classes が導出より広い行は通す (字面に現れない操作を書き手が名乗る余地を残す)。 語列表の行が無い・読めない・不発効の周 SHALL 断る側へ倒す。 クラス SHALL verify 行の命令の語列 (名) で決め、 宛先を解かない (ADR-1008 の却下案 (ii) の宛先の判定を持ち込まない)。 導出の入力 SHALL 契約表の行の verify 行だけとする (約束の行から受付が生成する verify は cargo nextest の固定形なので入力にしない)。 器 SHALL NOT write-set を入力にしない (項目の 6 形はどれも対象 repo の中の path を指し、 その編集は A4.3 の依存なしの code 変更か A3 の門が持つ依存の変更である。 ~ の着地での削除も git で戻せるので「消す」に数えない)。 器 SHALL NOT land の口 (vessel 宣言の remote への push と CI の判定を読む行・pipe land の CLI 引数 --pr-cmd) と vessel 宣言の共通 verify・検出線の行を入力にしない。 ∴ land の口での自 repo への branch の push と PR 作成は導出に現れず、 ADR-1008 の判定 (A4.3 で可逆・承認を前提としない) は不変である。 承認の口 (spawn の手前の Blocked・逐語の承認 event・承認の subcommand) と申告の口 (行の classes) SHALL 不変とする。 runner が便の中で撃つ command と、 verify 行が起こす code の中の操作は本 ADR の導出の射程外とする。
  （平易）3 種の操作の名前 (消す = delete・出す = publish・使う = consume) を 1 つの閉じた型で持ち、 契約の表の行と契約 file が名乗れる値をこの型から取ります。 種ごとの命令の語の並びは、 規則の file の行 1 つ (クラスの語列表) に置きます。 この行の種類は規則の閉じた型に 1 つ足し、 値の各要素は先頭の 1 語が種の名前で、 残りが語の並びです。 語の並びは撃ってよい命令の上限の内の語で始まり、 受付が読む禁じる語列の全体のどれもまるごと含みません。 値は user の決定の印が付いたときだけ変わり、 この記録は値を決めません。 契約の表の検査 (文書を直す段の CI と受付が撃つ同じ 1 本) は、 行ごとに検証の命令を表の各要素に、 禁じる語列と同じ関数で当て、 当たった種の集まり (クラスの導出) を作ります。 その集まりに在って行の名乗りに無い種があれば、 行番号と命令と当たった語を付けて全部を名指して断ります (検査の断りの種類に 1 つ足し、 受付は既存の表の断りとして仕事を作りません)。 止めるのは受付で、 CI は先に知らせる役です。 名乗りが導出より広い行は通します。 表の行が無い・読めない・切られているときは断ります。 材料は検証の命令だけです。 触ってよい file の列は材料にしません (項目の 6 つの形はどれも自分の repo の中の path を指し、 その変更は取り消せる code の変更か、 別の門が持つ依存の変更です。 着地で file を消す形も git から戻せるので「消す」に数えません)。 自分の repo へ送り出す口、 PR を出す口、 CI の結果を読む命令、 repo が名乗る宣言の命令も材料にしません。 ∴ 送り出す口での自分の repo への PR は導出に現れず、 前の決定 (取り消せる・許可を前提にしない) はそのままです。 種は検証の命令の語の並び (名前) で決め、 送り先は調べません。 許可を待つ段、 許可の記録、 許可の命令、 そして名乗る欄は変えません。 実装役が便の中で撃つ命令と、 検証の命令が起こす code の中の操作は、 この記録の導出の外です。
  （理由）user の決定は、 決まりを書き手の作法でなく仕組みで守らせることでした。 3 クラスの関門を名乗りだけで立てている限り、 名乗り忘れた契約には関門が一度も立たず、 許可を記録する堅い仕組みが空回りします。 検証の命令は器が自分で撃つ命令で、 契約の表の行にそのまま書かれているので、 撃つ前に字面から種を導けます。 導いた種を名乗りに足すのでなく断るのは、 契約の正本である表の行を実際と合わせるためです。 止めるのは仕事を作る前の検査 (受付) で、 文書を直す段の CI は後からの検査なので、 先に知らせる役に留めて止めの代わりにしません。 名乗りが広い行を通すのは、 字面に現れない操作を書き手が名乗れる余地を残すためです。 材料を検証の命令だけにしたのは、 触ってよい file の列は自分の repo の中の変更しか指さず、 憲法がそれを取り消せる変更と扱うからです。 自分の repo へ送り出す口は契約の外 (repo の宣言と、 land を撃つ側が渡す引数) に在り、 前の決定が取り消せると決めたので、 材料にしないことで取り違えが構造の上で起きません。 種は命令の語の並び、 つまり名前で決めます。 これは前の決定が PR の道具からの導出で退けた「取り消せるかでなく名前で止める」性質を、 検証の命令の面で持ちます。 それでも受け入れるのは、 当たり過ぎても黙って通さず、 文書を直す段の CI の赤とその場での名乗りの書き足し・便ごとの許可の手間に倒れること、 決まった 3 つの語 (どれも git で始まる) はいまの表で当たる行が 0 本であること、 表の値を user の決定で狭く保てることの 3 つからです。 許可が安く大量に求められると形だけになって止まる力が薄れる (前の決定が気にした摩耗) ので、 表を狭く保つことがその備えになります。 前の決定が退けたもう 1 つは、 PR の道具の文面や送り先の URL から送り先を調べる仕組みで、 この記録は送り先を調べません。 前の決定は判定の仕組みを次の版に置いており、 この記録はその席のうち検証の命令の分に座ります。 語の表を規則の行に置くのは、 憲法が執行する規則の値を規則の file 1 つに置き、 変更に user の決定の印を求めるからで、 憲法の説明欄が書く「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」の形にも合います。 語を当てる関数を禁じる語列と共有するのは、 同じ判定の読み手を 2 本にしないためです。 自動で足す案は正本が食い違ったまま残って書き手が許可の要求で初めて気づき、 実行の時点で止める案は、 検証の命令に当たる分では止まるのが仕事を始めた後になり、 当たる便ごとの行への書き足しと起こし直しと許可の往復を token を使った後で遅れて行うことになり (実装役が便の中で撃つ命令の分は、 見張りを広げる後の決定に残します)、 必ず書かせる案は名乗りのままで、 code の表の案は決定の印を迂回し、 送り出しまで見る案は自分の repo への PR を取り違えるので退けました。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1015（claim）: FR1015 は 3 クラスを名乗る契約が承認の段で Blocked に止まることを求める。 本 ADR の後、 verify 行が裁定された語列表に当たる行は名乗らなければ契約表の検査を通れないので、 そうした契約は必ず名乗り、 FR1015 の停止に届く (語列表の値が空なら何も起きない)。 FR1015 の文面と Blocked の形は変えない。
  FR1001（rationale）: FR1001 は契約の不備を全件・行番号付きで集めて拒否し、 便を作らないことを求める。 名乗り忘れの断りも同じ形 (全件・行番号・便を作らない) で契約表の検査に載せる根拠を与える。
  FR1056（rationale）: FR1056 は禁じる語列の判定を受付が verify 各行に掛けることを求める。 本 ADR は同じ照合の 1 本を、 「絶対にやらない」側の語列でなく「先に聞く」側の語列に掛ける。 照合の読み手を 2 本にしない根拠を与える。
  FR1047（rationale）: FR1047 は契約を契約表の 1 行だけから取ることを求める。 判定を行に置けば、 受付が便を作る前に止め、 同じ 1 本が docs PR の CI (contracts check) で早く知らせ、 手で書いた契約は既に断られるので、 すべての契約がこの判定を通る。
  NFR1004（claim）: 語列表の行が無い・読めない・不発効の周は、 導出を空として通さず断る。 不正な入力を黙って落とさない約束がこの判定にも効く。
