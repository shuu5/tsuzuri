    text: |
      区切りを引用した heredoc の本文は shell が展開しないので、 受け手の命令に依らず本文の行を segment に入れない。 決め手は実測 (撃たれる形の本文を通す)。
      （平易）区切りを引用した heredoc の本文は shell が展開しないので、 どの命令に渡すかに依らず本文を読まない案です。 規則が 1 つで済み、 sudo cat などの偽の止めも消える点で勝ります。 けれども、 bash に heredoc で渡す本文や、 cat の本文を pipe で bash に渡す形、 書いた file を後ろの行で撃つ形の git push を通してしまいます (今は止めています)。 引用した区切りは展開を止めるだけで、 受け手が本文を撃つかは決めません。 退けました。
      利点: 規則が 1 つで済み、 受け手の列を持たない
      利点: sudo cat や、 本文を heredoc で渡す bd create の偽陽性も消える
      欠点: bash に heredoc で渡す本文・cat の本文を pipe で bash に渡す形・書いた file を後ろの行で撃つ形の git push を通す (今は断っている)(DR2)
      欠点: 引用した区切り（本文を字のまま渡す印）は展開を止めるだけで、 受け手が本文を撃つかは決めない (DR3)
    verdict: rejected
    reason: "決め手は実測 (撃たれる形の本文を通す)。"
  - id: "OPT3"
    name: "受け手のそばに、 撃たない command の閉じた列を足す"
    text: |
      本文を shell に渡さない受け手の後ろに && や ; で続く撃たない command (git add・echo など) の閉じた列を足し、 それだけが続く行も本文を読まない。 決め手は分析 (列の中の命令も撃ちうる)。
      （平易）本文を shell に渡さない命令の後ろに続く、 撃たない命令 (git add や echo など) の一覧を足し、 それだけが続く行も本文を読まない案です。 本文を書いてすぐ add する定型も 1 回で通り、 通る形が多い点で勝ります。 けれども、 一覧の中の命令も hook や filter で撃ちえます (git add は設定の clean filter を撃ちます)。 一覧を足すたびに、 撃つか撃たないかの裁きも要ります。 退けました。
      利点: 本文を書いてすぐ add する定型も、 1 回の Bash で通る
      利点: 受け手だけの条件より、 通る形が多い
      欠点: 列の中の命令も hook や filter で撃ちうる (git add は設定の clean filter を撃つ)(DR2・DR3)
      欠点: 列を足すたびに、 撃つか撃たないかの裁きが要る (DR5)
    verdict: rejected
    reason: "決め手は分析 (列の中の命令も撃ちうる)。"
  - id: "OPT4"
    name: "単引用の字を、 全部の頭で字のまま読む"
    text: |
      単引用の中の字は shell が展開しないので、 頭の語に依らず語の割りに使わない。 決め手は実測 (単引用の字を code として撃つ受け手が在る)。
      （平易）単引用の中の字は shell が展開しないので、 どの命令でも字のまま読む案です。 規則が 1 つで済み、 一覧に無い命令の単引用でも偽の止めが消える点で勝ります。 けれども、 sh -c や python3 -c や awk の単引用の中の $(git push) を通してしまいます (今は止めています)。 頭の命令に依らないので、 単引用の中を shell や code として撃つ命令を見分けません。 退けました。
      利点: 規則が 1 つで済み、 data の頭の列を持たない
      利点: 列に無い data の命令の単引用でも、 偽陽性が消える
      欠点: sh -c・python3 -c・awk の単引用の中の $(git push) を通す (今は断っている)(DR2)
      欠点: 頭の語に依らないので、 単引用の字を shell や code として撃つ受け手を見分けない (DR3)
    verdict: rejected
    reason: "決め手は実測 (単引用の字を code として撃つ受け手が在る)。"
  - id: "OPT5"
    name: "包まれた gh を、 公開の動詞の語が見えるときだけ断る"
    text: |
      包まれた gh は、 後ろに公開の動詞 (create・merge・edit など) の語が見えるときだけ wrapped の印を付け、 見えないときは通す。 決め手は分析 (表の外を通す)。
      （平易）包まれた gh を、 後ろに公開の動詞 (create・merge・edit など) の語が見えるときだけ止め、 見えないときは通す案です。 読むだけの一覧を持たずに済み、 一覧に無い読むだけの動詞も通る点で勝ります。 けれども、 知らない並びや変数に入れた動詞、 gh api の書き込み (--input や -f) を通してしまい、 公開の動詞の一覧が漏れた周に公開の命令が黙って通ります。 退けました。
      利点: 読みだけの表を持たずに済む
      利点: 表に無い読みだけの動詞も通る
      欠点: 知らない並び・変数の動詞・gh api の書き (--input・-f) を通す (DR2・DR3)
      欠点: 公開の動詞の列が漏れた周に、 公開の命令が黙って通る (DR3)
    verdict: rejected
    reason: "決め手は分析 (表の外を通す)。"
  - id: "OPT6"
    name: "断りの経路に、 読みだけの gh の書き直しの句を足す"
    text: |
      印の読みは変えず、 解けない形の断りに添える書き直しの字 (断りの経路) に、 読みだけの gh の書き直しの句を足す。 決め手は分析 (経路は全部の断りの字で、 直した後は要らない)。
      （平易）読みは変えずに、 止めたときの断り文の書き直しの案内に、 読むだけの gh の書き直しの句を足す案です。 読み手の code を変えずに済み、 session が断り文から書き直し方を知れる点で勝ります。 けれども、 定型が止まるたびに session が書き直す手間は残ります。 断り文の案内は解けない形の全部の断りが共有する字で、 既存の test の字が 10 か所以上動きます。 退けました。
      利点: 読み手の code を変えずに済む
      利点: session が、 書き直しの形を断り文から知る
      欠点: 定型が断られるたびに、 session が書き直す手は残る (DR1)
      欠点: 経路は、 理由が解けない形の全部の断りが共有する字で、 既存の歯の字が 10 か所以上動く (DR5)
    verdict: rejected
    reason: "決め手は分析 (経路は全部の断りの字で、 直した後は要らない)。"
  - id: "OPT7"
    name: "公開の門の読み手だけで heredoc を読む"
    text: |
      共有の分割は変えず、 公開の印の読みだけが heredoc の本文を落とす。 決め手は分析 (同じ本文の偽陽性が他の門に残る)。
      （平易）命令を区切る共通の読みは変えず、 公開の門の読み手だけが heredoc の本文を落とす案です。 他の門の読みが変わらず、 直す範囲が公開の門の中で閉じる点で勝ります。 けれども、 同じ本文の tmux kill-server や git reset --hard を tmux や git の見張りが、 本文の bd の行を起票の門が、 今のまま止めます。 heredoc の読み手も 2 つになり、 経路を 1 本にする憲法の条に反します。 退けました。
      利点: 他の門の読みが変わらない
      利点: 直す範囲が、 公開の module の中で閉じる
      欠点: 同じ本文の tmux kill-server と git reset --hard を host-guard の tmux と git の種類が、 本文の bd の行を起票の門が、 今のまま断る (DR1)
      欠点: heredoc の読み手が 2 つになる (DR4・C2)
    verdict: rejected
    reason: "決め手は分析 (同じ本文の偽陽性が他の門に残る)。"
  - id: "OPT8"
    name: "data の頭の免除を、 pipe の先の頭だけで取り消す"
    text: |
      data の頭の segment の出力を pipe で受ける segment の頭が閉じた頭の列に無ければ、 その command の免除を取り消す。 ; と && の後ろの頭は見ない。 決め手は分析 (; と && の後ろの頭を見ないので ./f.sh が通る)。
      （平易）字を shell に渡さない命令の出力を pipe で受ける命令だけを見て、 それが一覧に無いときに免除を取り消す案です。 pipe の先の自作の script が撃つ形も閉じ、 ; や && の後ろの命令を一覧に縛らない点で勝ります。 けれども、 ; や && の後ろの命令を見ないので、 書いた file を ./f.sh で撃つ形や、 && の後ろの make -f が通ってしまいます (今は止めています)。 行の全部の命令を見る heredoc の条件と形も揃いません。 退けました。
      利点: pipe の先の自作の script が撃つ形も閉じる
      利点: ; と && の後ろの頭を列に縛らない
      欠点: ; と && の後ろの頭を見ないので、 書いた file を ./f.sh で撃つ形と、 && の後ろの make -f が通る (今は断っている)(DR2)
      欠点: 受け手の列 (全ての segment の頭を見る) と形が揃わず、 読みの形が 2 つになる (DR3・DR4)
    verdict: rejected
    reason: "決め手は分析 (; と && の後ろの頭を見ないので ./f.sh が通る)。"
  - id: "OPT9"
    name: "実行者の閉じた列 (denylist) が在るときだけ免除を取り消す"
    text: |
      同じ command に実行者 (bash・sh・zsh・dash・eval・source・.・xargs と、 -c か - を持つか引数を持たない python3・python) の segment が在るときだけ data の頭の免除を取り消し、 他の頭と並ぶ command は通す。 決め手は分析と orchestrator の裁定 2026-09-30 (列の外の実行者が通る)。
      （平易）字を命令として動かす命令の一覧 (bash・sh・eval・xargs・python3 -c など) を持ち、 それが行に在るときだけ免除を取り消す案です。 git や for と並ぶ行でも免除が効き、 整形の命令の一覧を持たずに済む点で勝ります。 けれども、 一覧の外で字を撃つ命令 (自作の script や make の recipe) が同じ行で撃つ形を新しく通してしまいます (今は止めています)。 撃つ命令は数え切れず、 一覧が漏れた周に撃たれる形が黙って通り、 止める側へ倒す向き (FailClosed) に反します。 分析と orchestrator の裁定で、 行の全部の命令を見る一覧 (allowlist) を選び、 退けました。
      利点: git や for など、 撃たない頭と並ぶ command でも免除が効く
      利点: 整形の頭の列を持たずに済む
      欠点: 列の外の実行者 (自作の script・make の recipe) が data の字を撃つ形を新しく通す (今は断っている)(DR2・C11.2)
      欠点: 撃つ頭は開いた集合で、 列が漏れた周に撃たれる形が黙って通る (DR3)
    verdict: rejected
    reason: "決め手は分析と orchestrator の裁定 2026-09-30 (列の外の実行者が通る)。"
basis: [FR1056, FR1072, FR1074, FR1076, FR1080, FR1081, NFR1004, NFR1005, ADR-1056, ADR-1078]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「門」は session が撃つ Bash の命令を撃つ前に読んで、 危ない形を止める器の見張りです。 外へ出す命令 (git の push や、 本文を GitHub へ出す gh の命令) を読む公開の門を全部の口座に配線した直後に、 外へ何も出さない 3 つの定型が全部の session で止まりました。 CI を待つ loop の中の読むだけの gh、 cat や python3 に渡す heredoc (命令の中に書く複数行の本文) の本文、 echo や printf の単引用の中の字です。 原因は 2 つで、 疑いの印が gh の動詞を見ないことと、 命令を区切る共通の読みが、 shell が命令として撃たない字を撃つ字と読むことです。 この記録は、 決まった一覧 (閉じた表と閉じた列) で言い切れる形だけを読みから外すと決めます。 1 つ目に、 読むだけの gh の一覧に当たる gh は疑いの印を受けません。 2 つ目に、 本文を shell に渡さない命令 (cat・tee と、 引数が無いか - 1 つだけの python3・python) しか無い行の、 区切りを引用した heredoc の本文は命令として読みません。 3 つ目に、 行の全部の命令が字を動かさない命令の一覧 (echo・grep・cat・head・cd など) に在り、 行のどこにも生きた置換が無いときだけ、 単引用の中の字を疑いの判じに使いません。 一覧から 1 つでも外れる形 (bash に渡す heredoc・sh -c の中・pipe の先の自作の script・sed の e・字を撃つ option を持つ命令など) は今のまま止めます。 代わりに、 今は偶然止めている撃ちのうち 2 つが新しく通ることを引き受けます。 python3 に渡す本文の中の撃ちと、 cat や echo で file に書いた字を後の呼び出しで撃つ形です (書いた file の中は、 もともと門が測らない所です)。 一覧の外の命令 (printf・sed・sudo cat・bd など) の偽の止めは残ります。
