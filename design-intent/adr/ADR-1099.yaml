  器の案の章の要約: 候補を 9 つ並べます。 決まった一覧に当たるときだけ読みから外し、 新しく通る撃ちを限界として名指す案 (選んだ案) と、 選ばなかった 8 つです。 選ばなかった案は、 区切りを引用した heredoc の本文を受け手に依らず読まない案・受け手のそばに撃たない命令の一覧を足す案・単引用の字を全部の命令で字のまま読む案・公開の動詞が見えるときだけ止める案・断り文に書き直しの句を足す案・公開の門だけで heredoc を読む案・pipe の先の命令だけで免除を取り消す案・字を命令として動かす命令の一覧 (denylist) で免除を取り消す案です。
  器の専門語の説明: 本文に出てくる専門語 8 個を、 やさしい言葉で説明します。
  ・共有の分割（shared splitter）: Bash の command を、 引用の外の改行と operator (; や && や pipe) で segment に切り、 引用を解いた語の列にして返す器の 1 本の読み。 台帳の門の module に在り、 7 か所 (host-guard の判定・起票の門・台帳のグラフの門・anchor の門・merge の門・live-row の門と公開の門が共有する読み手・公開の印の読み) が読む。 command guard の分割は別で、 引用を解かない。
  ・撃たない字（unexecuted text）: shell が command として撃たない字。 本 ADR が読みから外すのは、 本文を shell に渡さない受け手だけの command 行の区切りを引用した heredoc の本文と、 全ての頭が閉じた頭の列に在り生きた置換を持たない command の data の頭の segment の、 単引用 ($ 付きの単引用を含む) の中の字と、 引用の外か二重引用の中で逆斜線が逃がした字だけで、 閉じた列で言い切れない字は撃つ字として読む。
  ・引用した区切り（quoted delimiter）: heredoc の operator (<< か <<-) の後ろの区切りの語のうち、 単引用・二重引用・逆斜線のどれかを含むもの。 shell は本文の変数と command 置換を展開せずに字のまま受け手へ渡す。 展開を止めるだけで、 受け手が本文を撃つかは決めない。
  ・本文を shell に渡さない受け手（non-shell sink）: heredoc の本文を shell の command として撃たずに受け取る命令の閉じた列 cat・tee・python3・python (頭の語の basename)。 cat と tee は本文を字のまま書く。 python3 と python は heredoc の operator と redirect の外の引数が無いか - 1 つだけの周だけ列に入り、 本文を Python の program として撃つ (本文の中の os.system と subprocess の撃ちは限界として測らない)。 -c や script の path を持つ python3 は本文を shell に渡す program を撃てるので入れない。 command 行の全ての segment がこの列の命令で、 他の条件も満たす周だけ、 共有の分割は本文を segment に入れない。
  ・data の頭（data head）: 単引用の中の字を shell にも他の program にも渡さない命令の閉じた列 echo・grep・egrep・fgrep・cat・tee・jq。 この頭の segment だけ、 公開の門は撃たない字の $( と backtick を語を割る判じに数えない。 同じ command に閉じた頭の列の外の頭か、 生きた置換か process 置換が 1 つでも在れば取り消す。 字を撃つ option や読みを持つ頭 (GNU sed の e・rg の --pre・bash の printf の -v の配列の添字・bd の mail の委譲と edit の $EDITOR・bd へ委ねる bdw) は入れない。
  ・閉じた頭の列（closed head list）: data の頭の免除が効くための、 command の全ての segment の頭の語の閉じた列 (allowlist)。 data の頭 (echo・grep・egrep・fgrep・cat・tee・jq) と、 撃たない整形の頭 head・tail・wc・uniq・cut・tr と、 cd から成り、 どの頭も字を撃つ option を持たないことを確かめて入れる (sort は --compress-program があるので入れない)。 列の外の頭 (bash・sh・eval・xargs・python3・自作の script・make・git・for などの予約語) が 1 つでも在れば、 その command の全ての segment で免除を取り消す。 撃つ頭の列 (denylist) は持たない。
  ・wrapped の印（wrapped mark）: 公開の門の印の 1 つ。 頭の語が git でも gh でもない segment の細かい語に、 git と後ろの push か、 gh と後ろの公開の群の語が在るときに付き、 解けない形として断る (設計 vessel-hook.md §17)。 本 ADR で、 読みだけの閉じた表に当たる gh には付けない。
  ・読みだけの閉じた表（read-only table）: 外へ何も出さない gh の群と動詞の対の閉じた表 (pr の view・list・status・checks・diff、 issue の view・list・status、 release・gist・repo の view・list、 label の list) と、 api の GET の形 (対象 1 つと読みの flag だけ・method は大文字の GET ちょうど・短い flag の続け書きは知らない flag)。 器の定数で持ち、 表の外は今のまま wrapped の印を受ける。
