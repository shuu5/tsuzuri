# 判断の記録 ADR-1099 — 器 scribe2 の判断の記録 ADR-0099 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1099
title: "門の読み手は、 外へ出さないと閉じた表で言い切れる gh と、 shell が撃たないと閉じた列で言い切れる字だけを読みから外す — 読みだけの gh の表に当たる包まれた gh には wrapped の印を付けず、 本文を shell に渡さない受け手だけの command 行の、 区切りを引用した heredoc の本文を segment に入れず、 全ての頭が閉じた列に在り生きた置換を持たない command の data の命令の単引用の中の字と逆斜線が逃がした字を語の割りに使わない。 外れる形は今の読みのまま断り、 それでも新しく通る撃ちは限界として名指す (ADR-1078 の読みの補い・supersede なし)"
status: accepted
date: 2026-09-30
context: |
  host-guard の公開の門を全口座へ配線した直後に、 外へ何も出さない 3 つの定型 (CI を待つ loop の中の読みだけの gh・file に書く heredoc の本文・echo や printf の単引用の中の字) が全部の session で断られた。 原因は 2 つで、 wrapped の印が gh の動詞を見ないことと、 共有の分割が shell の撃たない字を撃つ字と読むことである。 本 ADR は、 閉じた表と閉じた列で言い切れる形だけを読みから外し、 言い切れない形は今のまま断り、 それでも新しく通る撃ちを限界として名指すと決める。
  なぜこの判断が要るのかを 6 つから説明します。 公開の門が命令をどう区切って読むかの経緯・配線の直後に 3 つの定型が止まった事象と 2 つの原因・撃たれる形も今は偶然止めている事実・読みが 1 本で字の出所が捨てられている事実・憲法の向き・この判断で動かす範囲です。
  CTX1 経緯 — 公開の門は、 共有の分割（命令を区切る共通の読み）が返す segment と、 その中の細かい語を読む
  ADR-1078 は host-guard (口座の設定から呼ばれる器の見張り・ADR-1056) の種類に公開 (publish) を足し、 外へ出す命令 (git の push と、 本文を出す gh の命令) の segment を撃つ前に読む形を決めた。 Bash の command は、 台帳の門の module に在る 1 本の分割が、 引用の外の改行と operator で segment に切り、 引用を解いた語の列にして返す。 この共有の分割を 7 か所 (host-guard の判定・起票の門・台帳のグラフの門・anchor の門・merge の門・live-row の門と公開の門が共有する読み手・公開の印の読み) が読む。 公開の門は、 頭の語が git でも gh でもない segment の細かい語も読み、 command 置換 ($( か backtick) を持つ語を割って、 git と後ろの push か、 gh と後ろの公開の群の語が在れば wrapped の印（包まれた公開の疑い）を付けて解けない形として断る (設計 vessel-hook.md §17。 割るのは実際に撃たれる command 置換を持つ語だけとする orchestrator の裁定 2026-09-28)。 ADR-1078 は sh -c の中と alias の push を測らない限界を、 設計 vessel-hook.md §17 は script の file の中を測らない限界を引き受けている。
  CTX2 事象 — 配線の直後に、 外へ何も出さない定型が 3 つの形で止まった (原因は 2 つ)
  公開の種類を全口座の hook へ配線した直後 (2026-09-29T23:15Z) に、 全部の session の定型が 3 つの形で断られた (2026-09-30 に、 main と同じ hook の code の binary へ payload を直に渡して実測)。 (1) CI を待つ loop と command 置換の中の読みだけの gh (x=$(gh pr view …)・for の本体と until の条件の gh pr checks・command 置換の gh api の GET など 10 形)。 (2) 区切りを引用した heredoc の本文の行 (cat で file に書く手順書・python3 に渡す script): 公開の門は本文の x=$(gh pr view 1) と git push の字を、 host-guard の tmux と git の種類は本文の tmux kill-server と git reset --hard を断る。 (3) echo と printf の単引用の中の $( か backtick を持つ字 (echo '$(git push)' など)。 報告された sed の式は、 省かれた字に $( か backtick を持っていたと推定する (報告の字だけでは通る・推定で未測)。 原因は 2 つある。 (1) は wrapped の印が、 gh の後ろに公開の群の語 (pr・issue・api など) が在るだけで、 動詞を見ずに付くこと。 (2) と (3) は共有の分割が heredoc を知らず、 引用を解くときに字の出所を捨てるので、 shell が撃たない字（命令として動かない字）を撃つ字と読むことである。
  CTX3 現物 — 撃たれる形も、 今は $( の字と本文の字で偶然断っている
  今の読みは撃たない字と撃つ字を分けないので、 撃たれる形も断っている (同じ実測)。 sh -c・python3 -c・awk の単引用の中の $(git push) と、 GNU sed の e の置換の中の $(git push) は wrapped の印で断られる。 echo と printf の単引用の $(git push) を、 pipe の先の bash・sh・xargs の sh -c・自作の script が撃つ形と、 file に書いて ./f.sh で撃つ形と、 file に書いた $(shell git push) を make -f で撃つ形も wrapped の印で断られる。 単引用の字を撃つ option や読みを持つ命令 (rg の --pre・sort の --compress-program・bash の printf の -v の配列の添字) と、 process 置換の >(bash) も、 字の中の $( を実際に撃ち (scratch で touch を撃って実測)、 今は wrapped の印で断られる。 bash に heredoc で渡す本文・cat の本文を pipe で bash に渡す形・書いた file を後ろの行の bash で撃つ形・.git/hooks の file へ書く形・python3 -c が stdin の本文を os.system で撃つ形の本文の git push origin main は、 行き先を解けない形で断られる。 python3 に heredoc で渡す本文の os.system の中の $(git push …) は wrapped の印で断られる。 ただし $( を持たない同じ撃ち方 (echo 'git push origin main' | bash・python3 の本文の subprocess.run の git push) は今も通る。 門はこれらの撃ちを測っておらず、 $( の字と本文の字で偶然断っている。
  CTX4 現物 — 読みは 1 本で、 字の出所は捨てられている
  共有の分割は 1 本 (C2) で、 heredoc を読む直しをそこに置けば 7 か所の読み手が同じ読みを受ける。 公開の門だけを直すと、 同じ本文の偽陽性が他の門に残る。 語の字がどの引用から来たか (字の出所) は、 分割が引用を解くときに捨てていて、 単引用と二重引用を分けられない。 runner の session と verify 行を読む command guard は、 引用を解かない別の分割で、 共有の分割を読まない。 解けない形の断りに添える書き直しの字 (断りの経路) は、 理由が解けない形の全部の断りが共有している。
  CTX5 憲法と既存の決定の向き (本 ADR の解釈)
  A1 の「出す」は push と公開を名指し、 公開は取り消せない。 C11 は境界ごとの失敗を極性で持ち、 host-guard は閉じる側 (FailClosed・NFR1004) で、 決められない形を通す向きに倒さない。 C2 は経路を 1 本にする。 C17 は足すものを最小にし、 消すものを先に名指す。 本 ADR が消すのは、 外へ何も出さない定型が断られるたびに、 session が Bash の呼び出しを分け直すか書き直す手である。 ADR-1078 の限界 (sh -c の中・alias) と §17 の限界 (script の file の中) は、 字面で撃つかどうかを決められない所を測らないと引き受けた線で、 本 ADR が読む ADR-1078 の線もこれであり、 本 ADR の限界もこの線に揃える。
  CTX6 射程 — 動かすのは読みの 3 つだけ
  動かすのは (1) 包まれた gh のうち読みだけの閉じた表（読むだけの gh の一覧）に当たる gh に wrapped の印を付けないこと、 (2) 共有の分割が、 本文を shell に渡さない受け手（本文を受ける命令）だけの command 行の、 区切りを引用した heredoc の本文を segment に入れないこと、 (3) 単引用の中の字と、 引用の外か二重引用の中で逆斜線が逃がした字を、 同じ command の全ての segment の頭が閉じた頭の列（字を動かさない命令の一覧）に在り、 生きた置換と process 置換を command のどこにも持たない周だけ、 data の頭（字を shell に渡さない命令）の segment の語の割りに使わないことの 3 つである。 (2) は共有の分割を読む全部の門に効く: host-guard の git と tmux の種類 (FR1056)・自分の設定の種類 (FR1072)・rm の種類 (FR1074)・台帳の種類 (FR1076)・公開の種類 (FR1080)・起票の門 (FR1081)・台帳のグラフの門・anchor の門・merge の門・live-row の門。 (1) と (3) は公開の門だけが読む。 閉じた頭の列には、 字を撃つ option や読みを持つ頭 (GNU sed の e・rg の --pre・sort の --compress-program・bash の printf の -v の配列の添字・bd の mail の委譲と edit の $EDITOR・bd へ委ねる bdw) を入れない。 動かさないのは、 印と解けない形の閉じた列と宣言順・判定の順・断りの字と経路・rules 行・記録の形・command 置換の中の cat の heredoc の値の読み・command guard の分割と照合・要件書である。 ADR-1078 の決定は変えず、 公開の segment とその中の語の読みを補う。 設計 vessel-hook.md §23 (契約表の行 o・o2) が実装する。 ADR を書く条件のうち 4 (却下案を残す価値) に当たる。
  （選択肢を測るものさし）この判断を評価する 5 本のものさしです。 外へ何も出さない定型を止めないこと。 今止めている撃たれる形を新しく通さないこと。 撃たないと言い切れない形は撃つ字として読むこと。 同じ本文を全部の門で同じに読むこと。 足すものを最小にし、 断りの字や規則の行や要件を変えないことです。
  DR1｜外へ何も出さない定型 (読みだけの gh・file に書く heredoc の本文・data の命令の引用の中の字) を断らない CTX2
  DR2｜今の読みが断る撃たれる形を、 新しく通さない (A1) CTX3・CTX5
  DR3｜撃たないと言い切れない形は、 撃つ字として読む (C11・NFR1004) CTX3・CTX5
  DR4｜同じ本文を全部の門で同じに読み、 読み手を 2 つにしない (C2) CTX4
  DR5｜足すものを最小にし、 断りの字・経路・rules 行・記録の形・要件を変えない (C17) CTX4・CTX6
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 読むだけの gh の一覧に当たる包まれた gh は疑いの印を受けず、 本文を shell に渡さない命令しか無い行の、 区切りを引用した heredoc の本文は命令の区切りに入らず、 行の全部の命令が字を動かさない命令の一覧に在り生きた置換が無いときだけ、 単引用の中の字と逆斜線が逃がした字が語の割りに使われません。 FR1080 (公開の字面の走査)・FR1081 (起票の門)・FR1056 (禁じる語列の拒否)・FR1072 (見張りの設定の編集の拒否)・FR1074 (rm の拒否)・FR1076 (台帳の破壊の拒否) への主張で、 NFR1004 (決められない形は止める) と NFR1005 (hook の時間の予算) を退行させない読みを添えます。
  採用 — OPT1
  門の読み手 SHALL、 外へ出さないと次の閉じた表で言い切れる gh と、 shell が撃たないと次の閉じた列で言い切れる字だけを読みから外し、 1 つでも外れる形は今の読みのまま断る。 (1) 公開の門 SHALL、 頭の語が git でも gh でもない segment の中の gh が、 -R か --repo とその値を読み飛ばした後に読みだけの表の群と動詞 (pr の view・list・status・checks・diff、 issue の view・list・status、 release と gist と repo の view・list、 label の list) を持つか、 api の後ろが対象 1 つ (graphql でない) と読みの flag (-q・--jq・-t・--template・--paginate・--slurp・-i・--include・--silent・--verbose・--cache・--hostname と、 値が大文字の GET ちょうどの -X と --method) だけのとき、 その gh に wrapped の印を付けない。 値を取る読みの flag は空白書きと長い名の = 書きだけを読み、 短い flag の続け書きは知らない flag と読む。 表の外の動詞・変数の動詞・知らない flag・書きの flag (-f・-F・--raw-field・--field・--input・-H・--header)・GET ちょうどでない method を持つ gh が 1 つでも在れば、 今のまま印を付ける。 (2) 共有の分割 SHALL、 command 行の heredoc が全て引用した区切りで、 全ての本文が区切りの行で閉じ、 本文と区切りの行を除いた全ての segment の頭の語が本文を shell に渡さない受け手 (cat・tee と、 heredoc の operator と redirect の外の引数が無いか - 1 つだけの python3・python) で heredoc の operator を持ち、 生きた command 置換と process 置換を持たない周だけ、 本文の行と区切りの行を segment に入れない。 pipe の先・; と && の後ろ・区切りの後ろの行に command が 1 つでも在れば今の読みのまま。 共有の分割を読む全部の門が同じ読みを受け、 分割の返りの型と呼び手は変えない。 (3) 共有の分割 SHALL 語ごとに、 単引用 ($ 付きの単引用を含む) の中の字と、 引用の外か二重引用の中で逆斜線が逃がした字を撃たない字と印し、 公開の門 SHALL segment の頭の語が data の頭 (echo・grep・egrep・fgrep・cat・tee・jq) の周だけ、 撃たない字の $( と backtick と process 置換を語を割る判じに数えない。 この免除は、 同じ command の全ての segment の頭の語が閉じた頭の列 (data の頭と、 head・tail・wc・uniq・cut・tr と、 cd) に在り、 生きた command 置換と process 置換を command のどこにも持たない周だけ効き、 1 つでも外れれば、 その command の全ての segment で取り消す。 列には字を撃つ option を持たない頭だけを置き、 sed・printf・rg・sort・bd・bdw と他の頭の周は今の割りのまま。 python3 と python の heredoc の本文の中の撃ちと、 受け手だけの行と閉じた頭の列だけの command で file に書いた字を後の呼び出しで撃つ形は、 読みから外れる限界として引き受ける。 印と解けない形の閉じた列と宣言順・判定の順・断りの字と経路・rules 行・記録の形・command guard の分割は変えない。 実装は設計 vessel-hook.md §23 (契約表の行 o・o2)。
  （平易）門の読み手は、 外へ出さないと決まった表で言い切れる gh と、 shell が撃たないと決まった一覧で言い切れる字だけを読みから外し、 1 つでも外れる形は今のまま止めます。 1 つ目に、 公開の門は、 先頭が git でも gh でもない命令の中の gh が、 -R か --repo とその値を読み飛ばした後に読むだけの一覧の群と動詞 (pr の view・list・status・checks・diff、 issue の view・list・status、 release と gist と repo の view・list、 label の list) を持つか、 api の後ろが対象 1 つ (graphql でない) と読むだけの flag だけのとき、 疑いの印 (wrapped) を付けません。 method の値は大文字の GET ちょうどだけを読むだけと見て、 短い flag の続け書き (-XPATCH など) は知らない flag と読みます。 一覧の外の動詞・変数に入れた動詞・知らない flag・書き込みの flag を持つ gh が 1 つでも在れば、 今のまま印を付けます。 2 つ目に、 命令を区切る共通の読みは、 行の heredoc が全て区切りを引用していて本文が閉じ、 本文を除いた全部の命令が本文を shell に渡さない命令 (cat・tee と、 引数が無いか - 1 つだけの python3・python) で、 どの命令も heredoc の記号を持ち、 生きた command 置換も process 置換も持たないときだけ、 本文と区切りの行を命令の区切りに入れません。 pipe の先や ; と && の後ろ、 区切りの後ろの行に命令が 1 つでも在れば、 今のまま読みます。 この読みは、 共通の読みを使う全部の門に同じく効きます。 3 つ目に、 共通の読みは単引用 ($ 付きの単引用も含む) の中の字と、 引用の外か二重引用の中で逆斜線が逃がした字に「撃たない字」の印を付けます。 公開の門は、 行の全部の命令が字を動かさない命令の一覧 (echo・grep・egrep・fgrep・cat・tee・jq と、 head・tail・wc・uniq・cut・tr と、 cd) に在り、 行のどこにも生きた command 置換と process 置換が無いときだけ、 字を shell に渡さない命令の周の、 その印の付いた $( と backtick と process 置換を疑いの判じに数えません。 一覧の外の命令 (bash・sh・eval・xargs・python3・自作の script・make・git など) が 1 つでも在れば、 行の全部で今のまま読みます。 字を撃つ option を持つ sed・printf・rg・sort・bd・bdw も一覧に入れません。 代わりに、 python3 に渡す本文の中の撃ちと、 受け手だけの行や一覧だけの行で file に書いた字を後の呼び出しで撃つ形は、 門の読みから外れる限界として引き受けます。 印の一覧・判定の順・断りの字・規則の行・記録の形・runner の見張りの読みは変えません。
  （理由）一覧に当たるときだけ読みを変えるのは、 今の読みが止めている撃たれる形 (bash に渡す heredoc・pipe の先の bash や自作の script・書いた file を同じ行で撃つ形・sh -c や python3 -c や awk の中・sed の e・rg の --pre や printf の -v などの字を撃つ option・process 置換) を止めたままにして、 止まっていた定型を通せるからです。 区切りを引用した heredoc の本文を受け手に依らず読まない案は、 bash に渡す本文の git push を通すので退けました。 引用は展開を止めるだけで、 撃つかどうかは受け手が決めるからです。 単引用の字を全部の命令で字のまま読まないのも同じ理由で、 sh -c や awk は単引用の中を撃ちます。 python3 を、 引数が無いか - 1 つだけのときだけ本文を shell に渡さない命令に数えるのは、 -c や script の path を持つ python3 は本文を shell に渡す program を撃てるからです。 単引用の字の免除を、 行の全部の命令が字を動かさない命令の一覧 (allowlist) に在るときだけ効かせるのは、 字を撃つ命令は数え切れず、 撃つ命令の一覧 (denylist) では一覧の外の自作の script や make が同じ行で撃つ形を通すからで、 heredoc の条件 (行の全部が受け手) と同じ形で止める側へ倒します (C11.2)。 一覧の命令が字を撃つ option を持てば黙って通るので、 一覧には撃つ option を持たないことを確かめた命令だけを入れ (sed・rg・sort・printf・bd・bdw は入れません)、 hook や filter を撃つ git add のような命令は入れません。 python3 に渡す本文の中の撃ちと、 file に書いた字を後の呼び出しで撃つ形は新しく通ります。 どちらも $( を持たない同じ撃ち方 (本文の中の subprocess の git push・書いた script を後で撃つ形) を今も通していて、 門が測っていない所を $( の字と本文の字で偶然止めていただけで、 本 ADR が読む ADR-1078 の線 (sh -c の中は測らない) と §17 の線 (script の file の中は測らない) と同じ所です。 python3 を本文を shell に渡さない命令に置くのは、 python3 に heredoc で script を渡す形が日常の定型で頻度が高いからです。 公開の動詞が見えるときだけ止める案は、 知らない並びや gh api の書き込みを通し、 止める側へ倒す向き (FailClosed) に反します。 heredoc の読みを共通の読みに置くのは、 同じ本文の偽の止めが公開の門のほかに tmux や git の見張りや起票の門にも出ていて、 読み手を 2 つにすると経路を 1 本にする条 (C2) に反するからです。 誤って止めた命令は書き直せば通りますが、 誤って通した公開は取り消せないので、 言い切れない形は撃つ字として読みます。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
