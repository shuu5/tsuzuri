  NFR1004（rationale）: 非退行の読み。 NFR1004 (fail-closed) は不正な入力を黙って落とさない。 本 ADR は閉じた表と閉じた列に当たる形だけを通し、 1 つでも外れる形 (閉じない本文・引用しない区切り・受け手の外の segment・引数を持つ python3・生きた command 置換・表の外の動詞・知らない flag・知らない頭・列の外の頭を持つ command) は今の読みのまま断るので、 読めない形を通す向きを持ち込まない。 新しく通る撃ちは、 門が今も測っていない経路 ($( を持たない同じ撃ち方は今も通る) の上に在り、 限界として名指す。
  NFR1005（rationale）: 非退行の読み。 NFR1005 (hook の予算) は hook の呼び出しに重い I/O を持たせない。 本 ADR の読みは command の字の読みだけで、 git と gh の子 process を足さない。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録はどの記録も置き換えず、 ADR-1078 (公開の門) の決定を変えずに読みを補います。 ADR-1078 が引き受けた限界 (sh -c の中・alias は測らない) と、 設計 §17 が引き受けた限界 (script の file の中は測らない) の線に、 python3 に渡す本文の中の撃ちと、 受け手だけの行と字を動かさない命令だけの行で file に書いた字を後の呼び出しで撃つ形を、 同じ線の限界として揃えます。 行き着く原則は「門は、 外へ出さないと閉じた表で言い切れる gh と、 shell が撃たないと閉じた列で言い切れる字だけを読みから外し、 言い切れないものは外へ出す命令や撃つ字として読む。 誤って止めた命令は書き直せば通るが、 誤って通した公開は取り消せない」です。
