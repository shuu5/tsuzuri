  surface: R-8
consequences:
  - "この判断で良くなること 4 つと、 代わりに引き受けること 7 つです。 良くなるのは、 CI を待つ定型が通ること、 本文を file に書く定型と python3 に script を渡す定型が全部の門で通ること、 字を動かさない命令だけの行の単引用の中の字で止まらなくなること、 bash や sh -c や同じ行の自作の script や字を撃つ option などで撃たれる形は今のまま止まり断りの字や要件が変わらないことです。 引き受けるのは、 python3 に渡す本文の中の撃ちを新しく通すこと、 cat や echo で file に書いた字を書く時点で読まなくなり後の呼び出しで撃つ形が門の外になること、 一覧の外の命令 (printf・sed・sudo cat・bd など) の heredoc と単引用の字と、 一覧の外の命令と並ぶ字では偽の止めが残ること、 受け手の後ろに命令を 1 つ足した行も今のまま読むこと、 空白を持つ --jq の値は止める側に倒れること、 runner の session の見張りは本文を今のまま見ること、 一覧に無い読むだけの動詞は今のまま止まることです。"
  - "良い結果: CI を待つ定型 (loop と command 置換の中の gh pr view・checks・list、 gh issue view、 gh api の GET) が公開の門を通る"
  - "良い結果: cat・tee だけの command 行で本文を file に書く定型と、 引数が無いか - 1 つだけの python3・python に script を渡す定型が、 共有の分割を読む全部の門 (host-guard の 6 種類・起票の門・台帳のグラフ・anchor・merge・live-row) で通る"
  - "良い結果: 全ての頭が閉じた頭の列に在り生きた置換を持たない command の data の命令 (echo・grep の仲間・cat・tee・jq) の単引用の中の $( と backtick で断られなくなる"
  - "良い結果: bash・sh・sh -c・python3 -c・awk・sed の e と、 同じ command の中で data の字を撃つ列の外の頭 (pipe の先の自作の script・./f.sh・make -f・rg の --pre・sort の --compress-program・printf の -v) と process 置換で撃たれる形は今のまま断り、 断りの字・経路・rules 行・記録の形・要件は変わらない"
  - "代償: python3 と python に program として渡す heredoc の本文の中の撃ち (os.system に渡す字の中の $( など) を、 本文を読まなくなる全部の門で新しく通す (今は断っている)。 受け手の列に python3 を置くのは、 python3 に heredoc で script を渡す形が session の日常の定型で頻度が高く、 本文の中の os.system と subprocess の撃ちは、 今も測らない script の file の中 (§17 の限界) と同じ所だからで、 $( を持たない subprocess の撃ちは今も通っている。 -c や script の path を持つ python3 は本文を shell に渡す program を撃てるので受け手に数えず、 今のまま本文を読む"
  - "代償: 受け手だけの行 (cat と tee の > file) と閉じた頭の列だけの command (echo の > file) で file に書いた字は、 書く時点で読まなくなり、 後の呼び出しで撃つ形は script の file の中の限界 (§17) へ移る。 .git/hooks の file や shell の rc file へ書く本文も同じ"
  - "代償: 受け手と data の頭の列の外の頭 (sudo cat・command cat・引数を持つ python3・本文を heredoc で渡す bd create) の heredoc と、 printf・bd・bdw・sed の単引用の中の $( と backtick と、 列の外の頭 (git・for など) と並ぶ data の命令の単引用の中の字は今のまま断り、 偽陽性が残る (報告された printf と sed の形はこの判断では直らない・回避は Bash の呼び出しを分けるか、 Write の道具で file に書く)"
  - "代償: 受け手の後ろに撃たない command を 1 つ足しただけの行 (本文を書いてすぐ git add する行) も、 今のまま本文を読む"
  - "代償: 読みだけの api の --jq の値が空白を持つと片が割れて位置の片が増え、 読みだけでない側 (断る側) に倒れる"
  - "代償: command guard (runner の session と verify 行の検査) の分割は heredoc の本文を今のまま見る"
  - "代償: 表に無い読みだけの動詞は今のまま断る。 表は器の定数で、 足すのは便の仕事になる"
