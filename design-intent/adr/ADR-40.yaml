# 判断の記録 ADR-40 — tsuzuri の開発を tsuzuri 自身の自己開発へ切り替える条件と、道具の上げの形（持ち主の裁定 2026-10-04・記帳先 = tsuzuri の台帳の memo t3-hub.74.60 と問い t3-hub.74.60.2）
# 起草は係 w114a（2026-10-04）。材料は drafts/w114a/w（selfdev.md・question-selfdev.md）。承認の欄の逐語は適用の script が --verbatim の file から入れる。
id: ADR-40
title: tsuzuri の道具 3 つ（器・床の tz・面の tz）は main の組みを門つきで上げて 1 手で戻せる形にし、8 つの条件（S1〜S8）が 7 日の窓と直近 40 便の窓で満ちた日に、tsuzuri の開発を tsuzuri 自身の自己開発へ切り替える
status: accepted
date: 2026-10-04
context: |
  持ち主の問い（2026-10-04・逐語は閉じた memo t3-hub.74.58 の notes）。統合が進み致命的な不具合なく開発できるようになったら、tsuzuri の開発を tsuzuri 自身による自己開発に切り替えられるか。
  今の事実（係 w114a の調べ・main 882e0298）。道具の組み元はもう tsuzuri だけである。便を流す器の binary は切り替え（ADR-33 の決定 (3) の 2 つ目の窓・2026-10-03T15:36Z）から tsuzuri の scribe2 の組み（2d807ef0）で、設計の床と面の tz は main の組み（cd630e59）。足りないのは上げの手である。器の上げは器の席の道具の手で、前の世代の控えは器の席の置き場に 11 世代在るが、着地した入れ替えの門の行（v-swap）の口は前の世代を残さない。PATH の器は main より器の code の commit 2 本遅れ、入れ替えの門そのものがまだ PATH で効かない。器への宣言の器の置き場（[[vessel]]）が host の面に無いので、門の口は宣言の無い断りで止まる。床と面の tz は席の手で組んで置き、tz の部品を書いた commit が 18 本後に在り、今の main で通る控えは 0 である。
  凍った元の repo を撃つ所（調べの時）。凍った folio2 の repo を配る面の server が 1 本・器の席の道具の 2 本の既定の repo・PATH の古い folio・切り替えの前に起こした生きた席 6 つ（tsuzuri の席 1・ほかの project の席 5）の起動の引数（--plugin-dir）が凍った器の repo の plugin の dir を指す。宣言（置き場 8 つの host の面の [[plugin]]）と口座の設定は凍った path を持たず、plugin の中身の 2 file は同じである。
  自己開発の前例（器の席の記録）。器は 9 月に自分の repo で自分を流し、走りの最中の入れ替えの事故（2026-09-27）と、便の運転手が途切れず入れ替えられない詰まり（器の memo s2-07l.738.42.12）と、受付の読みを替える便が入れ替えの前後で断られる型を経験した。
  問いは 1 本（t3-hub.74.60.2）で、案 A に裁定された（裁定 id は承認の欄）。切り替えの前に起こした席の起こし直しの時期は、別に問う。
decision: |
  (1) 定め。自己開発は、道具 3 つ（器・床の tz・面の tz）を tsuzuri の main の組みから門つきで上げ、上げた世代ごとの便の出来を測り、1 手で前の世代へ戻せる状態で、tsuzuri の便と設計の commit を回すことをいう。
  (2) 上げの形。
  (ア) 器。器の部品の本体（src）か錠を書いた便の着地の後の終端の周（器の process が 0 本の周）と、日に 1 度の全部の撃ち（ADR-34 の決定 (6)）の後に上げる。門は、その commit の CI と日に 1 度の撃ちが緑・器の process が 0 本・PATH の器と世代が違う、の 3 つで、上げた後に版の表示の commit が HEAD と同じ・doctor が rc 0・列の一覧の口が rc 0 であることを照らす。
  (イ) 床の tz。tz の部品が動いた日に 1 度、新しい組みと今の席の固定の版（pin）で、根と folio2 の design-intent に床の検査と導出の照らしを撃ち、rc と違反の行が同じ時だけ上げる（影の撃ち）。違えば上げずに違いを記帳する。
  (ウ) 面の tz。床の tz と同じ版を同時に上げ、写しの口（port）で読むだけの server を起こして頁が返ることを照らす。
  (3) 控えと戻し。道具ごとに前の 3 世代を残し、戻しは 1 手（名の替えか symlink の替え）にする。今の main で通らない控えは数えない。戻しの試し撃ちを道具ごとに 1 回記帳する。
  (4) 逃げ道。
  (ア) 器が壊れて自分の直しを着地させられない時は、控えへ戻し、戻した器で直しの便を流す。控えの全部が同じ欠けを持つか門そのものが壊れた時は、席が直しの差を写しで作って床と根の検査を撃ち、持ち主が端末で 1 回撃つ取り込みの script（ADR-33 の決定 (1) の merge の script と同じ形）で main へ入れ、memo に記帳する。
  (イ) 床の tz が壊れた時は、控えへ戻す。控えも通らない時は、床の判じを止めず「まだ分からない」で設計の commit を止めたまま、直しを tz の部品を書く便で流す（その便の gate は根の検査の folio の歯で床を測る）。
  (ウ) 面が壊れた時は、問いと答えを席の会話と台帳の notes で受ける。
  (5) 切り替えの条件。見張りの窓は、日に 1 度の全部の撃ちの 7 回（7 日）と直近 40 便の 2 つで、次の 8 つが両方の窓で満ちた日に切り替える。
  ・（S1）偽の緑が 0（ADR-36 の G2）。
  ・（S2）日に 1 度の全部の撃ちが 7 回続けて rc 0（ADR-36 の B1・B2）。
  ・（S3）PATH の器と HEAD の器の木の食い違いが 1 日以内（ADR-36 の B3・E2）。
  ・（S4）門での器の入れ替えが 3 回以上で、手での入れ替えが 0（ADR-36 の B4）。
  ・（S5）戻しの試し撃ちが器・床の tz・面の tz の各々で rc 0 を 1 回以上（ADR-36 の B5 を道具 3 つへ）。
  ・（S6）便の出来が ADR-36 の幅の内（1 回目の着地 G1・gate の秒 G7・便の token G10・gate のメモリ G13）。
  ・（S7）便ごとの世代の記録（行 xp-provenance・ADR-37 の決定 (7)）が全部の便に在る。
  ・（S8）凍った元の repo を撃つ道具が 0（ADR-36 の E1）。生きた process の起動の引数（--plugin-dir）が凍った器の repo を指す数も 0 に数える。
  満ちた日は memo（t3-hub.74.60）か後継の memo の notes に記帳して持ち主に知らせ、その日から席の手の上げを止める。最初の判じの前に、実験場の形 B の最初の比べ（ADR-37 の決定 (6)）を 1 周撃って群 g の基を持つ。
  (6) 足す行と順。
  (ア) 席の手。器への宣言の器の置き場（[[vessel]]）は、行（v-lane）と行（v-lane-cap）の着地の後の PATH の器の入れ替えと同じ時に置く（その入れ替えは門の口がまだ PATH に無いので、今の器の席の道具の形で最後の 1 回を手で撃つ）。床と面の tz の上げの script（影の撃ちつき）と戻しの script を席の道具に置く。
  (イ) 器の行。便ごとの版の記録（xp-provenance）と便ごとの書きの記録（xp-io-bytes）を ADR-37 の決定 (7) のとおり流す。器の自己更新の口が前の 3 世代を残して戻しの口を持つ行（v-swap-keep）と、終端の周の軸が上流の遅れだけでなく世代の差でも口を撃つ行（v-swap-gen）を足す。どちらも器の振る舞いを替えるので、ADR-39 の段 1（器の要件）の後に置き、要件の欄に器の要件を書く。器を書く便は器の根の宣言の行（v-roots）まで同時に 1 本（ADR-33 の決定 (12)）なので、器の列に並べ、推しは行（xp-provenance）の直後。
  (7) 凍った元の repo の始末。
  (ア) 済んだ物（2026-10-04・席の手・どれも消さずに移した）。凍った folio2 の repo を配る面の server を止めて配る一覧から外し、main の面を起こし直した（main の面の引数からも外れた）。器の席の道具 3 本（swap-binary.sh・mk-run.sh・launch.sh）を器の席の置き場の退役の dir（retired-20261004-selfdev）へ移した。PATH の古い folio を席の道具の置き場の退役の dir（retired-20261004-selfdev）へ移した。
  (イ) 残る物。切り替えの前に起こした生きた席 6 つの起動の引数が凍った器の repo の plugin の dir を指す。起こし直しの時期は別に問う。起こし直しの数が 0 になるまで、凍った器の repo の dir を動かさず消さない（動けば古い席の hook が撃てなくなる見込み）。
  (ウ) 凍った器の repo の台帳は、器の裁定 id を引く時に読むだけにする（ADR-39 の決定 (7)）。
options:
  - id: a
    name: 門と控えと世代の記録を揃え、8 つの条件（S1〜S8）が 2 つの窓で満ちた日に切り替える
    text: 決定 (1) から (7)。
    verdict: adopted
    reason: 器の 9 月の自己開発で起きた型（走りの最中の入れ替え・入れ替えられない詰まり・入れ替えの前後の受付の断り）を門と控えで防ぎ、不具合を世代へ結べる。切り替えまでの待ちは 1〜2 週の見込み。
  - id: b
    name: 今すぐ切り替える
    text: 席の手の上げを門の上げとみなし、今日から自己開発と呼ぶ。
    verdict: rejected
    reason: 戻しの控えが器にしか無く、床の tz が壊れると設計の commit が止まる。偽の緑を世代へ結べず、生きた席 6 つが凍った plugin の dir のまま残る。
  - id: c
    name: 席の手の上げのまま続ける
    text: 道具の上げを今の席の手のまま続け、切り替えを決めない。
    verdict: rejected
    reason: 道具の遅れ（器 2 本・tz 18 本）が続き、器の直しが効くまでの待ちが便の数に比例して増える。ADR-36 の基準（B3 と B4）が満ちない。
  - id: d
    name: 着地のたびに門なしで上げる
    text: 器の code の便が着地するたびに、器の process の数えと世代の照らしを置かずに入れ替える。
    verdict: rejected
    reason: 走りの最中の入れ替え（9 月の事故の型）と偽の緑の広がりを止められない。
basis: [ADR-18, ADR-33, ADR-34, ADR-35, ADR-36, ADR-37, ADR-39]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo（t3-hub.74.60）か後継の memo の notes に 1 件ごとに記帳する（日付・条件・値・窓）。問う相手は持ち主。
    (1) 切り替えの後 30 日の内に偽の緑が 1 件でも出たら、器の次の code の便を止め、席の手の上げへ戻して問う。
    (2) 同じ道具の戻しを 7 日に 2 回撃ったら、その道具の上げの門を見直す問いを出す。
    (3) 条件のどれかが 3 日続けて「まだ分からない」なら、測り方を問い直す。
plain: |
  便を流す道具・設計を検査する道具・画面の道具の 3 つを、tsuzuri 自身の最新の版から、決めた門を通った時だけ入れ替え、すぐ前の版へ 1 手で戻せるようにする記録です（推奨の案）。
  8 つの物差しが 1 週間と直近 40 便の両方で満ちたら、tsuzuri の開発を tsuzuri 自身で回す形に切り替えます。
  古い器と folio の repo を撃っていた道具は、今日のうちに外しました。古い器の plugin を読んでいる席 6 つの起こし直しは、時期を別に問います。
approval:
  who: 持ち主
  date: 2026-10-04
  ruling: t3-hub.74.60.2（裁定 id = t3-hub.74.60.2:20261004T0113Z-1・自己開発は案 A・席とのチャット・notes に逐語）
  verbatim: "１−７はすべて推奨で良い"
  surface: R-8
consequences:
  - 席の手の上げは条件が満ちる日まで続く。器の最後の手の入れ替えは行（v-lane）と行（v-lane-cap）の着地の後で、器への宣言の器の置き場を同じ時に置く。
  - 足す行は 4 本（xp-provenance・xp-io-bytes・v-swap-keep・v-swap-gen）と席の道具 2 本。行の大きさとノートは置く時に席が決める。
  - 条件（S8）は生きた席の起こし直しが済むまで満ちないので、切り替えの日は起こし直しの時期の答えにも依る。
  - 台帳の道具（bd）が壊れた時の逃げ道は、器の外の道具なのでこの記録の外に置く。
note: 起草 w114a（2026-10-04）。数は drafts/w114a/w の selfdev.md から。済んだ始末は席の知らせ（2026-10-04）による。持ち主の逐語は台帳の notes に在り、この下書きには書かない。
