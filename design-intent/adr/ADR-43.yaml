# 判断の記録 ADR-43 — 実験場の形 B に回す口座は、戻りの時期を問わず残りが 50% 以上の便の口座とし、本番の便の口座待ちか口座の 80% で周を止める（持ち主の裁定 2026-10-04・記帳先 = tsuzuri の台帳の問い t3-hub.77.17 の notes）
# 起草は席（2026-10-04）。承認の欄は問い t3-hub.77.17 の裁定。ADR-37 は封で本文が凍っているので、その決定 (3) をこの記録が替える（ADR-39 の決定 (1) と同じ形）。
id: ADR-43
title: 実験場の形 B に回す口座は、戻りの時期を問わず残りが 50% 以上の便の口座とし、本番の便が口座待ちになるか使う口座が 80% に届いたら、その周を止める
status: accepted
date: 2026-10-04
context: |
  ADR-37 の決定 (3) は、実験場の便に回す口座を「7 日の窓の戻り（reset）が 24 時間以内に来て、残りが 40% 以上の口座」の「使わなければ消える残り」だけとし、足りない週は撃たずに待つと定めた。目的は本番の便の枠を減らさないこと。
  2026-10-04T13:5xZ の測り直しでは、便の口座の 4 つのうち 2 つが 0%（戻りは 10-11）・2 つが 29% と 34%（戻りは 10-09）で、口座は空いていた。それでも決定 (3) に当たる口座は無く、最初の形 B（ADR-37 の決定 (6)）は早くて 10-08 まで撃てなかった。
  最初の形 B は、組みの使い回し（ADR-35）を tsuzuri の宣言で名乗る前の条件である。待つ間、便は冷えた木で組み続ける（便は 1 日 約 44 本）。空いた週に戻りを待つのは、本番の枠を守る目的には要らない待ちである。
  問い（t3-hub.77.17）は案 A に裁定された（裁定 id は承認の欄）。
decision: |
  (1) 替える決め。この記録は、封で凍った ADR-37 の決定 (3) を替える。ADR-37 の本文は替えない。ADR-37 のほかの決定（形・上限・8 本・隔ての手・最初の比べ・器の行・いつ撃つか・記帳）は替えない。
  (2) 使う口座。実験場の便に回すのは便の口座だけとする。撃つ前に席が口座の使用量を測り直し（fleet usage --fresh）、7 日の窓の残りが 50% 以上の口座だけを使う。戻りの時期は問わない。
  (3) 止め。周の途中で、本番の便が口座の待ちになった時か、実験に使う口座の 7 日の窓の使用が 80% に届いた時は、その周を止め、止めた時刻と使用量と済んだ便の数を記帳する。止めた周の残りは、決定 (2) を満たす口座が在る時に撃ち直す。
  (4) 上限。ADR-37 の決定 (2) の上限（形 B は 1 周で token 1 億以下・SSD 120 GB 以下・週に 1 周まで）はそのまま効く。
  (5) 席の決まりの外の例外は置かない。決定 (2) と (3) を満たさない周は撃たない。
options:
  - id: a
    name: 残りが 50% 以上の口座を使い、止めの条件で本番を守る
    text: 決定 (1) から (5)。
    verdict: adopted
    reason: 空いた週にすぐ撃てる。本番の便の枠は、口座待ちと 80% の 2 つの止めで守る。失うのは「消える残りだけを使う」守りの固さで、代わりに止めの条件が働く。
  - id: b
    name: ADR-37 の決定 (3) のまま待つ
    text: 戻りが 24 時間以内で残りが 40% 以上の口座の、消える残りだけを使う。
    verdict: rejected
    reason: 口座が空いていても戻りを待つので、最初の形 B が 10-08 ごろまで撃てず、組みの使い回しの名乗りもそれまで遅れる。
basis: [ADR-37, ADR-35, N-3]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo（t3-hub.77）か後継の memo の notes に 1 件ごとに記帳する。問う相手は持ち主。
    (1) 実験の周の間に本番の便が口座待ちになった回が 1 週に 2 回に達したら、使う口座の残りの下限（50%）を問い直す。
    (2) 実験の周のために、本番の便の口座の 7 日の窓が戻りの前に 100% に届いたら、この記録の形を問い直す。
plain: |
  便の出来を比べる実験（形 B）に、どの口座の使える量を回すかの決まりを替える記録です。
  前の決まりは「1 週の枠がもうすぐ戻る口座の、使わなければ消える分だけ」を使うもので、口座が空いていても戻りを待つ必要がありました。
  これからは、撃つ前に測り直し、残りが半分以上ある口座を使います。実験の途中で本番の作業が口座待ちになったり、使う口座が 8 割に届いたりしたら、実験を止めて記録します。
approval:
  who: 持ち主
  date: 2026-10-04
  ruling: t3-hub.77.17（裁定 id = t3-hub.77.17:20261004T1418Z-1・案 A・席とのチャット・notes に逐語）
  verbatim: "推奨のAでよい"
  surface: R-8
consequences:
  - 形 B の道具（係 w144a が作る・支度・安全の確かめ・撃ち・数え・片付け）の口座の選びの既定は、この記録の決定 (2) と (3) にする。
  - 最初の形 B は道具の確かめが済みしだい撃てる。組みの使い回しの名乗り（ADR-35 の決定 (7)）は ADR-37 の決定 (6) のとおり形 B の後に置く。
note: 起草は席。口座の数は 2026-10-04T13:5xZ の fleet usage --fresh の値（memo t3-hub.77 の notes）。
