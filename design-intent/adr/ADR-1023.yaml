  器の却下案の節の要約: 10 の案を退けました。 台帳を正本のままにする案は、 台帳が機械の読める形式を持たないので成り立ちません。 欄の一覧を文書に書く案は、 規則を文章に戻します。 別の記法を使う案は、 同じ種類のデータに 2 つ目の文法を足します。 構文を解析して「多めに」集める案は外部の部品が 1 つ増えます。 審査を人が回す案・任意にする案は、 飛ばせる門を門と呼ぶことになります。 後始末を席に残す案・台帳を閉じてから CI を見る案は、 ずれを目視に頼るか赤い着地を閉じます。 commit の末尾を正本にする案は、 直すのに歴史を書き換える必要が出ます。 要件の一覧の場所を器に固定する案や project の名前で処理を分ける案は、 形の違う project を門前払いにするか、 器が特定の相手を知ってしまいます。 契約の行ごとに書かせる案は同じ値を全行に写します。 契約の共通の決まりを各契約に手書きする案は、 先の記録がすでに退けています。 (設計 doc §11 の却下案と重なる案は同じ理由で退け、 設計に固有の残りは同 §11 だけが持ちます。)
  器の記録の出所（Trace）:
