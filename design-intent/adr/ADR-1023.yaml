    name: "契約の正本は設計 doc の契約表 1 行で、 器が契約 file を生成し、 審査の段を通してから実装役を起こし、 着地の終端まで器が持つ (write-set の閉包は機械が導出・consumer の要件面は宣言 file の任意 key・ADR-1004 §2.2 / §2.3・ADR-1010 §2.1・ADR-1016 §2.1 / §2.3・ADR-1018 §2.1・ADR-1019 §2.1 / §2.3 を部分 supersede)"
    text: |
      契約 1 本の正本は、 設計 doc の末尾にある「機械が読む区間」の表の 1 行です。 表の書き方は器がすでに読んでいる規則の file と同じ狭い TOML で、 表の種類を 1 つだけ足します。 行がどんな欄を持つかは文章ではなく器の型が正本で、 器がその一覧を 1 枚の file に描き出し、 その file と器の出力が食い違えば CI が落とします——同じ一覧を文章に写すと必ずずれるからです。 契約の名前は「設計 doc の名前 # 行の名前」で、 doc の名前は一度決めたら変えません (file を改名しても名前は残ります)。 表の置き場は 2 つ許します——設計 doc の中の区間と、 後で別の道具が作る単独の file です。 どちらかは file の拡張子で決め、 知らない拡張子は「たぶんこちら」と倒さず断ります。 表は「規律」ではなく「入力のデータ」です。
    verdict: adopted
    reason: "器の記録が採った決定（字は決定の欄・器の記録の §2）。文脈の要約: 便が 1 往復する間に、 器が構造として持っているのは受付の交差の判定・実装役の書ける範囲の見張り・実装後の審査・着地の順序だけで、 残りは席の判断と文章と手写しでした。 なかでも契約は同じ内容を 3 回写していました——設計 doc の文章、 台帳の受入条件の文章、 そして管理席が手で書く契約 file です。 写すたびに落ちが出て、 書ける範囲の抜けが 5 回、 設計そのものの穴が 2 回、 実装が終わってからの審査で初めて見つかりました。 台帳の側には、 設計の中身を持ったまま行き場のない memo が 40 本たまりました。 着地の後始末 (押す・CI の結果を確かめる・台帳を閉じる) も席の手順で、 「着地したのに閉じていない」「閉じたのに CI が赤」のずれを目で見て直していました。 加えて、 この器を別の project で使う段になって、 その project の要件の一覧がこの repo と同じ形とは限らないことが分かりました。 user は 3 つの論点を裁定し、 契約の正本を設計 doc の機械が読む表へ移し、 実装前の審査を必須とし、 着地の終端を器に持たせることを決めました。 この記録はその形を決めます。"
