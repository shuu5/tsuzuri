  ・外部の道具 (folio2・consumer 第 1 号) の計画役との擦り合わせ (2026-09-13・敵対検証を経た確定版・合意記号 G-a〜G-h): 欄の集合の正本は本器の型 → 導出した schema file (G-b)・表の意味検査は本器の編集時の 1 関数・導出物は同じ TOML subset で空は key 省略 (G-c)・着地の正本は本器の記録で読む口は trailer 1 つ・無ければ「まだ分からない」・自 repo への PR 形は恒久の穴 (G-d)・散文の門は user の裁定へ (G-e・§2.8)・移行は今の形で land してから移す (G-g)。 相手側の初稿は敵対検証を経て 12 点を撤回しており、 本 ADR は撤回後の形を採る。 同記録が「表の層は新規 1 本」とした点は、 ADR-1010 §2.1 の「第 2 の parser を作らない」が frozen で設計 doc §2 も同じ parser を採るため、 本 ADR は採らない (§2.1)。 相手の返答は材料であって裁定ではない。
