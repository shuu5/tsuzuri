    name: "書ける範囲の集合を構文木で求めて上界にする"
    text: |
      (D) 書ける範囲の集合を構文木で求めて上界にする。 却下: 外部の crate が 1 つ増え (A3)、 実行時の外部依存 0 の NFR1003 に触れる。 字面の下界 + 限界の歯 + 質問の record で足りる (§2.3)。 逆に「宣言だけ受けて検査しない」案は、 今日の実害 (抜けが受付を通る) をそのまま残す。
    verdict: rejected
    reason: "外部の crate が 1 つ増え (A3)、 実行時の外部依存 0 の NFR1003 に触れる。 字面の下界 + 限界の歯 + 質問の record で足りる (§2.3)。 逆に「宣言だけ受けて検査しない」案は、 今日の実害 (抜けが受付を通る) をそのまま残す。"
  - id: "E"
    name: "契約の審査を席の運用として人が回す、 または任意の段にする"
    text: |
      (E) 契約の審査を席の運用として人が回す、 または任意の段にする。 却下: 散文にしか無い規則になり (N2)、 編集時に止める条を後段の運用で代替する (C16)。 飛ばせる門は門ではない。 予算の超過も合格ではなく「測れなかった」に倒す (FR1009 と同じ極性)。 裁定 Q2 = must (2026-09-13)。
    verdict: rejected
    reason: "散文にしか無い規則になり (N2)、 編集時に止める条を後段の運用で代替する (C16)。 飛ばせる門は門ではない。 予算の超過も合格ではなく「測れなかった」に倒す (FR1009 と同じ極性)。 裁定 Q2 = must (2026-09-13)。"
  - id: "F"
    name: "着地の後始末を席の手順に残す、 または台帳を閉じてから CI を見る"
    text: |
      (F) 着地の後始末を席の手順に残す、 または台帳を閉じてから CI を見る。 却下: 前者はずれ (閉じ忘れ・赤いまま閉じた) を目視に頼り (N2)、 後者は赤い着地が閉じる (C12.6)。 CI を待たない案は「測れなかった」を成功に化かす (C10)。 台帳へ crate の依存で触る案は A3、 台帳の file を直読する案は形式が私物で壊れる。 裁定 Q3。
    verdict: rejected
    reason: "前者はずれ (閉じ忘れ・赤いまま閉じた) を目視に頼り (N2)、 後者は赤い着地が閉じる (C12.6)。 CI を待たない案は「測れなかった」を成功に化かす (C10)。 台帳へ crate の依存で触る案は A3、 台帳の file を直読する案は形式が私物で壊れる。 裁定 Q3。"
  - id: "G"
    name: "着地の事実の正本を commit の trailer (または台帳の notes) に置く"
    text: |
      (G) 着地の事実の正本を commit の trailer (または台帳の notes) に置く。 却下: trailer を正本にすると訂正に commit の書き換えが要り、 器の記録と二重になる。 台帳の notes は private で外から読めない。 両方を正本にする案は同じ事実に carrier を 2 つ作る。 擦り合わせ (2026-09-13・合意記号 G-d) で「正本は器の記録・trailer は読む口」に確定した (§2.5)。
    verdict: rejected
    reason: "trailer を正本にすると訂正に commit の書き換えが要り、 器の記録と二重になる。 台帳の notes は private で外から読めない。 両方を正本にする案は同じ事実に carrier を 2 つ作る。 擦り合わせ (2026-09-13・合意記号 G-d) で「正本は器の記録・trailer は読む口」に確定した (§2.5)。"
  - id: "H"
    name: "consumer の要件面を器の既定 path 1 つに固定する、 または宣言が無いとき既定で黙って動く fallback を持つ、 または consumer の名で分岐する"
    text: |
      (H) consumer の要件面を器の既定 path 1 つに固定する、 または宣言が無いとき既定で黙って動く fallback を持つ、 または consumer の名で分岐する。 却下: 固定は形式の違う consumer を fail-closed で全部断り採用できなくし (実測: consumer 第 1 号の要件面は YAML で本 repo と同じ file を持たない)、 黙る fallback は宣言し忘れが静かに効き (ADR-1010 §4 が同型の案を退けている)、 名での分岐は host 固有の値による分岐と同じ極性に触れる (N3)。 採るのは「任意 key + 拡張子で読み手を決める + 明示の既定 + 解けなければ断る」(§2.6)。
    verdict: rejected
    reason: "固定は形式の違う consumer を fail-closed で全部断り採用できなくし (実測: consumer 第 1 号の要件面は YAML で本 repo と同じ file を持たない)、 黙る fallback は宣言し忘れが静かに効き (ADR-1010 §4 が同型の案を退けている)、 名での分岐は host 固有の値による分岐と同じ極性に触れる (N3)。 採るのは「任意 key + 拡張子で読み手を決める + 明示の既定 + 解けなければ断る」(§2.6)。"
  - id: "I"
    name: "要件の一覧の path を契約の行ごとに書かせる"
    text: |
      (I) 要件の一覧の path を契約の行ごとに書かせる。 却下: 同じ値が repo の全行に写り、 1 か所を直し忘れると行ごとに検査先が食い違う。 repo に 1 つの値は repo の宣言 file が持つ (ADR-1010 §2.1 の「値は対象 repo の性質」の 2 例目・§2.6)。
    verdict: rejected
    reason: "同じ値が repo の全行に写り、 1 か所を直し忘れると行ごとに検査先が食い違う。 repo に 1 つの値は repo の宣言 file が持つ (ADR-1010 §2.1 の「値は対象 repo の性質」の 2 例目・§2.6)。"
  - id: "J"
    name: "契約の共通の決まりを契約側に手書きする (各契約に同じ規律の文を書く)"
    text: |
      (J) 契約の共通の決まりを契約側に手書きする (各契約に同じ規律の文を書く)。 却下: ADR-1009 §2.4 と ADR-1010 §2.1 が既に退けた形の再演で、 同文が契約の数だけ増える。 共通の規律は宣言 file と器が持ち、 契約表の行は「この便に固有の値」だけを持つ。
    verdict: rejected
    reason: "ADR-1009 §2.4 と ADR-1010 §2.1 が既に退けた形の再演で、 同文が契約の数だけ増える。 共通の規律は宣言 file と器が持ち、 契約表の行は「この便に固有の値」だけを持つ。"
basis: [FR1002, FR1004, FR1009, FR1012, FR1018, FR1020, FR1022, FR1031, FR1032, FR1039, FR1043, FR1046, FR1047, FR1048, FR1049, FR1050, FR1051, FR1052, FR1053, FR1054, FR1055, NFR1001, NFR1003, NFR1004, NFR1006, AC1020, AC1021, AC1022, AC1023, AC1024, AC1025, AC1026, ADR-1004, ADR-1008, ADR-1009, ADR-1010, ADR-1011, ADR-1013, ADR-1014, ADR-1016, ADR-1017, ADR-1018, ADR-1019, ADR-1021, ADR-1022]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  契約 1 本の正本は、 設計 doc の末尾にある「機械が読む区間」の表の 1 行です。 表の書き方は器がすでに読んでいる規則の file と同じ狭い TOML で、 表の種類を 1 つだけ足します。 行がどんな欄を持つかは文章ではなく器の型が正本で、 器がその一覧を 1 枚の file に描き出し、 その file と器の出力が食い違えば CI が落とします——同じ一覧を文章に写すと必ずずれるからです。 契約の名前は「設計 doc の名前 # 行の名前」で、 doc の名前は一度決めたら変えません (file を改名しても名前は残ります)。 表の置き場は 2 つ許します——設計 doc の中の区間と、 後で別の道具が作る単独の file です。 どちらかは file の拡張子で決め、 知らない拡張子は「たぶんこちら」と倒さず断ります。 表は「規律」ではなく「入力のデータ」です。
