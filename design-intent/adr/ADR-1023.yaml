# 判断の記録 ADR-1023 — 器 scribe2 の判断の記録 ADR-0023 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1023
title: "契約の正本は設計 doc の契約表 1 行で、 器が契約 file を生成し、 審査の段を通してから実装役を起こし、 着地の終端まで器が持つ (write-set の閉包は機械が導出・consumer の要件面は宣言 file の任意 key・ADR-1004 §2.2 / §2.3・ADR-1010 §2.1・ADR-1016 §2.1 / §2.3・ADR-1018 §2.1・ADR-1019 §2.1 / §2.3 を部分 supersede)"
status: accepted
date: 2026-09-13
context: |
  便が 1 往復する間に、 器が構造として持っているのは受付の交差の判定・実装役の書ける範囲の見張り・実装後の審査・着地の順序だけで、 残りは席の判断と文章と手写しでした。 なかでも契約は同じ内容を 3 回写していました——設計 doc の文章、 台帳の受入条件の文章、 そして管理席が手で書く契約 file です。 写すたびに落ちが出て、 書ける範囲の抜けが 5 回、 設計そのものの穴が 2 回、 実装が終わってからの審査で初めて見つかりました。 台帳の側には、 設計の中身を持ったまま行き場のない memo が 40 本たまりました。 着地の後始末 (押す・CI の結果を確かめる・台帳を閉じる) も席の手順で、 「着地したのに閉じていない」「閉じたのに CI が赤」のずれを目で見て直していました。 加えて、 この器を別の project で使う段になって、 その project の要件の一覧がこの repo と同じ形とは限らないことが分かりました。 user は 3 つの論点を裁定し、 契約の正本を設計 doc の機械が読む表へ移し、 実装前の審査を必須とし、 着地の終端を器に持たせることを決めました。 この記録はその形を決めます。
  記録時点 (2026-09-13) の現物: 便の一周の手順 15 のうち器が構造で持つのは 5 つ (受付の排他 FR1039・実装役の write-set guard FR1020・gate FR1009・着地の CAS と順序 FR1012 と ADR-1021 §2.5)。 契約は 3 段の写し (設計 doc の散文 → 台帳の受入条件の散文 → 契約 file の手写し) で、 write-set の落ち 5 例と設計の inline 2 件がそれぞれ別の段で生まれた。 台帳は open 57 件・うち memo 51 件で、 設計本文を持つ memo は 40 件。 契約 file は受付が --contract で受け取る手書きの入力 (ADR-1004 §2.3) で、 その parser が受理する array-of-tables は閉じた 2 種・空の配列を拒み・schema 版の印を必須とする。 契約 file の必須欄は 9 で、 設計 doc 側の欄との共通は 5 (1 対 1 ではない)。 台帳への口は復元の読み取り専用 1 点のみで write は無い (ADR-1018 §2.1 / §2.4)。 段の列に審査は無く、 受付の次は spawn。 着地は CAS で終わり終端を持たない。 対象 repo の宣言 file の key は必須 3 + 任意 1 (ADR-1010 §2.1・ADR-1021 §2.6)。 SRS の最大 id は FR1046 / AC1020 / NFR1006。 consumer 第 1 号の要件面は YAML で、 本 repo の design-intent/spec/srs.html に相当する file を持たない (既定 path を固定すると、 その repo の契約は全行が fail-closed で断られる)。 着地の後始末 (押す・CI の照合・記帳・close・binary の入れ替え) は管理席の手順の散文にしかない。
  憲法の向き: C15 は台帳を task と裁定だけに限り、 C15.2 は規律との結線を id の参照だけに限って欠落を lint で拒む。 C16 は逸脱を編集時に止め後段の検証で代替せず、 C16.2 は in-loop guard を極性一覧に載せる。 C2 は選択・除外・routing を 1 enum の 1 関数とし、 順序を宣言順から取り、 新しい理由を variant 1 つで表す。 C2.2 は env を読まず新しい env seam を作らない。 C3.4 は完了条件を 1 つの enum の値に限り、 待ちの実装を 1 つに限る。 C10 は宣言値・実測値・導出値・有効値を型で分け、 宣言値は実測を経てだけ有効になる。 C10.3 は配線の無い設定を CI が拒む。 C1 / C5 は規則の値を manifest の行に裁定 id 付きで持ち、 C1.2 は生成文書に手書きの規範文を 0 とする。 C14 は規律を文書と manifest の 2 面に限る (契約表はそのどちらでもない入力データであり、 ADR-1010 §2 の前置が宣言 file について、 ADR-1017 §2.3 が口座の行について採った読みと同じ)。 N3 は host 固有の値で分岐しない。 N2 は散文にしか無い規則を規則と扱わない。 N1 は回復不能な削除を拒む。 A3 は依存の増減に承認を要し、 A1 は「出す」を対話面の承認に掛ける。 user の裁定 (2026-09-13・対話面・planner 席): 要旨は decided-by のとおり。
decision: |
  §2.1 契約の正本は tracked な設計 doc の機械が読む表の 1 行。 欄の集合の正本は core の型で、 置き場は 2 形・読み手は拡張子で決める
  契約 1 本の正本は、 設計 doc の末尾にある「機械が読む区間」の表の 1 行です。 表の書き方は器がすでに読んでいる規則の file と同じ狭い TOML で、 表の種類を 1 つだけ足します。 行がどんな欄を持つかは文章ではなく器の型が正本で、 器がその一覧を 1 枚の file に描き出し、 その file と器の出力が食い違えば CI が落とします——同じ一覧を文章に写すと必ずずれるからです。 契約の名前は「設計 doc の名前 # 行の名前」で、 doc の名前は一度決めたら変えません (file を改名しても名前は残ります)。 表の置き場は 2 つ許します——設計 doc の中の区間と、 後で別の道具が作る単独の file です。 どちらかは file の拡張子で決め、 知らない拡張子は「たぶんこちら」と倒さず断ります。 表は「規律」ではなく「入力のデータ」です。
  器 SHALL 契約 1 本の正本を、 対象 repo の tracked な設計 doc が末尾に持つ機械が読む 1 区間 (marker 形は既存の憲法区間と同じ・設計 doc 1 本に区間は 0 か 1 つ) の表の 1 行とし、 台帳の受入条件と手書きの契約 file を正本から降ろす。 表の形式 SHALL rules manifest と同じ TOML subset (ADR-1004 §2.3) とし、 既存の 1 組の parser が受理する array-of-tables の列挙 (同 §2.3 決定文 3) に [[contract]] の 1 種を足す (C2「新しい理由は variant 1 つ」・ADR-1017 §2.3 が [[account]] で行った限定の広げ方と同じ形・§2.7 (iii))。 器 SHALL NOT 第 2 の parser を作る (ADR-1010 §2.1 の「reader は契約 file と同じ 1 組」は不変)。 設計 doc からの区間の抜き出し SHALL 行走査の薄い層が担い、 同じ parser に渡す。 空の配列の拒否・未知 key の拒否・必須 key の欠落と型違いを全件行番号付きで返す規定 SHALL 不変とし、 空の列 SHALL key の省略で表す。 欄の集合と値域の正本 SHALL core の型とし、 器の subcommand 1 つがそこから tracked な生成物 contracts/schema.toml を描き、 xtask SHALL その生成物と器の出力の差分 0 を測る (ADR-1014 §2.3 の門の形＝xtask は core に依存せず tracked 生成物を読む。 外形 snapshot ではなく tracked 生成物の drift 検査・FR1018・C14.2)。 本 ADR と設計 doc SHALL NOT 欄を列挙する (ADR-1013 §2.1・C1.2)。 契約 id SHALL <doc id>#<row id> (doc id = 設計 doc の file 名の stem・row id = 行の id・doc 内で一意) とし、 doc id SHALL append-only (改名は新 id の追加と旧 id の廃止として扱う)。 この id SHALL 台帳の pointer 行・commit の trailer (§2.5)・外部の道具の追跡表が共有する唯一の鍵とする。 置き場 SHALL 2 形 (設計 doc の .md の区間 / 表だけを持つ tracked な .toml 1 file の全文) を同じ読み手で受け、 読み手 SHALL path の拡張子で形を決め、 列に無い拡張子 SHALL typed に断る (fail-closed・NFR1004)。 schema 版の印 SHALL 両形の先頭に置く (ADR-1004 §2.5 の schema 版を持つ面に契約表の 2 形を足す。 形式と互換の扱いは不変)。 契約表 SHALL C14 の 2 面 (文書・manifest) のいずれでもない入力データとして扱い (規律の置き場にしない・ADR-1010 §2 の前置が宣言 file について、 ADR-1017 §2.3 が口座の行について採った C1 / C14 の読みと同じ)、 表の意味の検査 (検査の列は設計 doc §2 が持ち、 ここには写さない) SHALL 1 関数が持ち、 CI の入口 (全 doc・全件・行番号付き) と受付の入口 (1 行) が同じ関数を撃つ (C2)。 宣言 file との突合 (allowlist・制御文字・repo 外 path) SHALL 既存の受付の関数のままとし (ADR-1009 §2.2・ADR-1010 §2.3)、 2 つの関数は別の母集団を見る。 契約の本文を PUBLIC の tracked file へ置くこと SHALL A1 の「出す」に当たると判定する (write-set の path と要件 id と節は既に tracked な現物から読めるが、 題と done の文は台帳にしかない＝公開面の情報が増える・ADR-1017 §2.3 が公開面の情報を増やす変更で取った側の先例。 ADR-1010 §2.5 の「既に public な値の置き場が移るだけ」の論法は本件には用いない)。 本 ADR SHALL その判定だけを記録し、 承認 SHALL 対話面で得た approval event (C7 / C7.2・user の逐語を伴う) とする。 本 ADR 自身は契約表の行を 1 つも足さず、 最初の行を tracked な main へ着地させる便 SHALL その承認を先に得る (ADR-1017 §2.3 が「確認してから行う・本 ADR は行を足さない」の順序で置いた先例と同じ)。 2026-09-13 の裁定 Q1 は正本の置き場の裁定であり、 公開面の情報が増えることの承認とは別に扱う。
  §2.2 器が base の表から契約 file を生成する。 手書きの契約 file は受けず、 台帳は pointer 1 行と adapter 1 つに閉じ、 欠落は doctor の lint が名指す
  受付は「この設計 doc のこの契約」と台帳の番号と対象の repo を受け取り、 器が対象 repo の最新の main から表の行を読んで、 便の契約 file を作ります。 手で書いた契約 file を渡す口はなくします——残すと写しが元に戻るからです。 台帳の側に残るのは、 題・状態・裁定・そして設計 doc を指す 1 行だけです。 契約の直しは台帳ではなく設計 doc の PR で行い、 実装役の質問への回答で書ける範囲を広げる口は作りません。 器が台帳に触る口は 1 つにまとめ、 読みは読み取り専用、 書きは「閉じる」1 種だけです。 台帳が正しい形になっているかは、 器の点検 command の項目として数えます (件数と母数を同じ行に出します)。 CI は非公開の台帳に届かないので、 この点検は CI ではなく点検 command と管理の tick が担います。 すでに起票してある契約は今の形のまま流し、 新しい契約から切り替えます。
  受付 SHALL 入力を設計 pointer (設計 doc の path と契約 id・--design)・台帳 id・対象 repo とし、 base (対象 repo の HEAD) の tree から行を読んで便の契約 file を生成する。 器 SHALL NOT 手書きの契約 file を受ける引数 (--contract) を持つ (口の廃止は跨版の CLI 契約を壊す変更であり外形 snapshot が動く・C12.5)。 生成時に固定値を埋める欄 SHALL 導出値であって宣言値ではない (C10)。 生成された契約 file SHALL 既存の受付の検査 (ADR-1009 §2.2・ADR-1010 §2.3) の対象であり続ける (基準と極性は不変・対象が手書き入力から生成物へ移るだけ)。 台帳の bead SHALL 題・状態・裁定の記帳・設計 pointer 1 行の受入条件だけを持ち (C15)、 器 SHALL NOT 台帳の本文を契約の入力にする。 契約の改訂 SHALL 設計 doc の改訂 (PR) と再受付で行い、 器 SHALL NOT 回答が write-set を広げる口を持つ (写しは生成物であり手で直さない・C16・§2.7 (vi) (vii))。 回答 SHALL 逐語のまま実装役へ届く形と記録の型を変えない (FR1032・ADR-1016 §2.2 は不変で、 回答の効き目が「契約を変える」から「契約の読み方を補う」へ狭まる)。 器が台帳へ触る口 SHALL core の module 1 つ (ledger) に閉じ、 読み SHALL 読み取り専用の子 process・書き SHALL close 1 種だけとする (起票・受入条件の編集・裁定の記帳は席の仕事)。 台帳の binary の名 SHALL 定数・path SHALL PATH 解決とし、 env の seam を作らない (C2.2)。 台帳の子 process の待ち SHALL ADR-1018 §2.4 が規範として据え 同 §4 が予定行とした seat.ledger_timeout_s を使い、 第 2 の行を新設しない (C1・行 id の接頭辞は据え置く＝使い手が席の復元から器の終端へ広がるだけで、 改名は行の追加と廃止になる)。 器 SHALL NOT 台帳の binary を差し替える引数を持つ (歯は PATH に置いた偽の binary で代える・ADR-1017 §2.2 の CLI 引数の形は引数の面を増やすため採らない)。 復元の subcommand (ADR-1018 §2.4) SHALL 同じ module を通し、 第 2 の読み口を作らない (C2)。 台帳の binary を子 process で呼ぶこと自体の A3 の扱いは同 §2.4 が持ち、 本 ADR は write の範囲 (close 1 種) を 2026-09-13 の裁定 Q3 で受ける。 close SHALL 器の行為であり席の権能ではない (ADR-1022 §2.2 の権能の型に variant を足さない)。 器 SHALL 台帳の lint を doctor の項目 1 行として持ち (C3.2)、 設計 pointer が解けない open な契約と、 設計の中身を持つのに pointer を持たない memo を名指し、 件数と母集団を同じ行に出す (0 件と「測れていない」を弁別する)。 CI SHALL NOT 台帳の lint を撃つ (private な台帳に届かない)。 C15.2 の「欠落を lint が拒む」 SHALL doctor の項目と管理の tick の pointer 注入 (FR1043) で満たす読みとし、 本 ADR はその読みを記録する。 台帳の lint SHALL NOT guard として極性一覧に載る (行為を止めうる判定を返さない・ADR-1014 §2.1 の定義・計測を極性一覧に載せない ADR-1017 §2.2 に次ぐ 2 例目)。 memo の判定が台帳の本文の字面を入力にすること SHALL 限界として受け入れる (C3.3 は席の状態の判定入力の条であり、 ここでの判定は行為を止めない名指しである・ADR-1013 §2.3 の作法で限界を主張と同じ場所に置く)。 既に起票済みの契約 SHALL 今の形のまま流し、 本 ADR の land 以降に起票する契約から新しい形に切り替える (この分界が lint の母集団の起点になる)。
  §2.3 書いてよい file の集合は、 行が宣言した閉じた型から器が導く。 導出は下界であり、 その限界は歯が固定する
  行が「この閉じた一覧に値を 1 つ足す」と宣言したら、 器が対象 repo の最新の main を読んで、 その型を持つ file を集めます。 集め方は 4 つの形 (値を組み立てている所・網羅的な分岐の枝・件数を固定している所・一覧そのものの宣言) で、 文字の並びだけを見ます。 構文を解析する外部の部品は足しません。 読めない file や壊れた区間があれば、 通さずに断ります。 この集め方は「少なく見積もる」側で、 別名で書かれた形は拾えません。 拾えないことを歯 (test) で固定して、 限界を器の中に残します。 足りないときは、 足りない file を全部並べて断ります (1 つ目で止めません)。
  器 SHALL 行が宣言した閉じた型 (touches の列) と base の tree から、 その型を運ぶ source file の集合を導出する。 導出 SHALL 字面の走査で行い (4 つの面・pure 関数・I/O は呼び手・property 検査を掛ける面・C12.7)、 器 SHALL NOT 構文木の crate を足す (A3 の依存を増やさない側の決定であり、 実行時の外部依存 0 の NFR1003 に触れない)。 読めない file と区間の parse の失敗 SHALL 違反として扱う (fail-closed・NFR1004)。 導出の結果 SHALL 下界であることを型と歯に残し (別名で現れる形を拾わない)、 限界 SHALL 本 ADR と歯に明記する (ADR-1013 §2.3)。 導出した集合が write-set に含まれない周 SHALL 契約を断る既存の閉じた型 Refuse に variant 1 つ (WriteSetIncomplete) を足して断り (ADR-1019 §2.1 の交差の理由と同じ enum・同 §2.1 の交差の定義と拒否の関数は不変)、 足りない file を全部名指す (1 件目で止めない・FR1018 と同じ「全件・黙って落とさない」)。 閉包の不足の判定 SHALL 表の検査の境界 (§2.1 の 1 関数・極性一覧の表の検査の行) が持ち、 受付 SHALL その結果を Refuse の 1 variant として返す (判定の境界は 1 つ・返す enum も 1 つ・ADR-1019 §2.1 の関数 1 本に 2 つ目の判定を足さない)。 CI の入口と受付 SHALL 同じ導出関数を撃つ (C2・§2.1)。 下界の外に落ちた構築点 SHALL 実装役の質問 (FR1031) として出し、 直しは §2.7 (vii) のとおり設計 doc の改訂に落とす (運用の注意書きにしない・N2)。
  §2.4 受付の直後に契約の審査の段を置く。 飛ばす口は作らず、 測り切れない周は通さない
  受付を通った便は、 実装役を起こす前に審査役が 1 回読みます。 読むのは 3 つ——生成された契約 file、 その契約が実装する設計の節、 そして要件の本文です。 差分は渡しません (まだ何も書かれていないからです)。 判定は便の段として記録に残り、 合格でない便は実装役を起こしません。 審査を飛ばす引数や環境変数は作りません。 予算を超えて読み切れなかった周は「合格」ではなく「測れなかった」に倒し、 その便も起こしません。 直すときは設計 doc を直して PR を通し、 もう一度受け付けます。 承認が要る便 (消す・出す・使う や閾値に触れる便) の関門は、 これまでどおり実装役を起こす直前に置きます。
  器 SHALL 段の閉じた型に variant 1 つ (Stage::Reviewed) を足し、 その宣言順 SHALL 受付の段の直後とする (適用順は宣言順から取り、 順序を散文で書かない・C2・中間への挿入は ADR-1016 §2.2 に次ぐ 2 例目で ADR-1013 §2.2 の判別子順の歯が効く面・event の行は段の名を持つので schema 版は据置・ADR-1004 §2.1 の機構欄が写した段の件数は型の宣言に劣後する)。 器 SHALL 受付の直後に審査役を 1 回起こし (既存の 1 つの口に tracked な雛形を 1 枚足すだけで口を増やさない・起動形は ADR-1011 のまま)、 穴 SHALL 3 つ (生成した契約 file・設計の節の本文・要件の本文) に限り、 diff を渡さない。 判定 SHALL 既存の 3 値とし、 便の dir の file (実装後の審査の verdict と同型・一時 file から rename の atomic 書き) と段の event に残す。 spawn と resume の入口 SHALL 審査の段にあり、 判定が合格の便だけを実装役へ進め (FR1004 の文は変えない・順序は本 ADR と設計 doc が持つ)、 合格でない便 SHALL 終端とし、 live な便の定義 (ADR-1019 §2.1) の終端に「審査の段で verdict が合格でない」を足す (§2.7 (viii)・判定は段の網羅 match のままで、 新しい段の arm が compile で強制される)。 器 SHALL NOT 審査を飛ばす引数・環境の口を持つ (C16・N2: 飛ばせる門を作って運用で埋めない・口の不在を usage が断る)。 予算 (NFR1001) を超えた周 SHALL 合格ではなく「測れなかった」に倒す (FailClosed・FR1009 の極性)。 承認の関門 (契約が持つ class の印) SHALL 審査の後・実装役の起動の直前に置き (読むだけの段を先に通し、 ADR-1008 §2.2 の「spawn の手前で Blocked」の位置を動かさない)、 承認の対話面と逐語の記帳先 SHALL 不変 (ADR-1022 §2.5・FR1022)。 実装後の gate の 4 段 (ADR-1021 §2.6) SHALL 不変で、 本段はその前段ではなく受付の直後に立つ。
  §2.5 着地の終端 (押す・CI の照合・台帳の close) を器が持つ。 着地の事実の正本は器の記録で、 commit の trailer はそこからの導出面
  着地した便は、 そのあと器が 3 手を続けます——遠隔へ押す、 押した commit の CI の結果をその commit の id で確かめる、 台帳を 1 行の理由付きで閉じる。 CI が緑でなければ閉じません。 「結果を測れなかった」を緑と読み替えることもしません。 待ち時間の上限は規則の行に置き、 その行には裁定の印が付きます。 3 手はどれも便の記録に型付きで残ります。 「いつ何が着地したか」の正本はこの記録で、 commit の末尾に付ける 2 行 (どの契約か・どの要件か) は、 器が同時に書く写しです——外の道具が読む口はこの 2 行だけで、 2 行が無い commit は「まだ分からない」であって「まだ着地していない」ではありません。 途中で失敗した便は、 終端だけをやり直せます (何度撃っても同じ結果で、 着地そのものは巻き戻しません)。 器が自分の repo へ押すことは「出す」には当たりませんが、 それを理由に契約表を公開の場に置く判断 (§2.1) を素通りさせることはしません。
  器 SHALL 着地 (既存の CAS・ADR-1021 §2.5) の後に 3 手 (遠隔への push・着地 commit の CI の結果の照合・台帳の close) を持ち、 各手を既存の終端 event の detail で弁別する typed な記帳とする (event の schema 版は上げない・FR1012)。 CI の照合 SHALL 完了条件の閉じた型に 1 値 (Completion::CiResult) を足し、 唯一の待ちの実装だけが受ける (任意の述語を受ける入口を作らない・C3.4)。 結果 SHALL 既存の verdict と同型の閉じた 3 値の型で受け、 測れない周を成功に読み替えない (C10)。 待ちの上限 SHALL rules 行 1 本 (pipe.ci_wait_s・裁定 id 付き・C1 / C5) とし、 行が無い周 SHALL 規則の error とする (行は本 ADR ではなく契約が manifest に書く・ADR-1018 §4 の予定行と同じ扱いで、 C14.2 の相互参照は行が manifest に在って初めて成立する)。 成功でない周 SHALL NOT close する (FailClosed・記帳して非 0 で終わる・C12.6「main は常に緑」)。 器自身が撃つ子 process (遠隔の操作・forge の CLI・台帳の binary) SHALL runner の allowlist の対象外とする (allowlist は宣言が名乗ってよい上限であり runner に与える権限を縛る・ADR-1010 §2.2。 器が host の道具を子 process で呼ぶ先例は ADR-1017 §2.2・上限に語を足す C5 の裁定を要しない・宣言の command 行の検査は不変)。 forge の CLI を子 process として採ること SHALL A3 の対象とし (ADR-1017 §2.2 の HTTP client・ADR-1018 §2.4 の台帳の binary と同じ扱い・crate は増えず NFR1003 は不変)、 承認 SHALL 対話面で得た approval event とし、 器 SHALL NOT 承認の前に、 その子 process を write-set に持つ契約 (契約表の contract-source#d) を受け付ける。 CI の照合の 1 行 SHALL 器の既定を持ち、 宣言 file の任意 key (ci-cmd) が差し替える。 遠隔の名 SHALL 同じく任意 key (remote) から読み、 無ければ器の既定を使う (§2.6)。 終端が読む宣言の値 SHALL 受付が凍結した写しから読み、 その周の作業木の宣言を読み直さない (ADR-1010 §2.4・便の実装が宛先を書き換えて別の repo へ押す経路を塞ぐ)。 着地の事実の正本 SHALL 器の記録 (追記だけの 1 file・ADR-1004 §2.1) とし、 squash commit の末尾の trailer 2 行 (契約 id・要件 id) SHALL 器が同時に書く導出面として扱う (名は NAME 定数から導出・C2.2・既存の便 id の trailer と 1 組に統合し、 同じ事実に carrier を 2 つ作らない)。 外部の道具が読む口 SHALL trailer 1 つに限り、 trailer を持たない commit SHALL 「まだ分からない」と読む (「未着地」と区別する・trailer の導入前の commit と弁別できないため)。 自 repo への PR の形 (--pr-cmd) SHALL trailer も記録も持たない恒久の穴として明示する。 終端の再実行 SHALL 冪等な口 1 つ (pipe land --terminal-only・便を名指す) で行い、 着地そのもの SHALL NOT 巻き戻す (N1・退役は可逆な移動)。 着地 commit SHALL 便の記録の任意の項目として残し (ADR-1021 §2.6 の「記録は任意 field を足せる」に乗る)、 自分の版が古い周に起動を断るかは §2.8。 器が自動で push すること SHALL ADR-1008 §2.1 により「出す」ではない (自 repo への反映であり可視性を反転しない) が、 それを理由に §2.1 の判定を素通りさせない。 本 ADR が足す止め口 3 つ (表の検査・審査・終端) SHALL 生成される極性一覧に in-loop / FailClosed として載り (C11.2 / C16.2・ADR-1014 §2.1 の定義「行為を止めうる判定を返す境界」)、 同じ検査を CI の入口から撃つ周も境界は 1 つ＝行も 1 つとする。 行の依存宣言 SHALL 解決と輪の無さを数えるだけとし、 着地の順序 SHALL ADR-1021 §2.5 のまま (器は依存宣言で順序を強制しない)。
  §2.6 consumer の要件面は宣言 file の任意 key で受け、 読み手は拡張子で分ける。 宣言が無ければ器の既定、 既定も解けなければ断る
  契約の行は「どの要件のためか」を要件の id で持ち、 器は受付でその id が本当に在るかを測ります。 ところが要件の一覧の形は repo ごとに違います——この repo は HTML の見出しに id が付いていて、 別の repo は YAML の項目として id が並びます。 そこで、 対象の repo が自分の宣言 file の任意の項目で「私の要件の一覧はこの file」と名乗り、 器は file の拡張子で読み方を決めます。 名乗りが無ければ器の既定の file を見ます。 その既定も無い repo は、 検査を黙って飛ばすのではなく受け付けません。 repo の名前や機械の名前で処理を分けることはしません——分かれ道は「宣言された値」と「拡張子」だけです。 遠隔の名前と CI の確かめ方も同じやり方で名乗ります。 名乗った値は、 受付が「本当に在るか」を測ってから使います。 便の途中で値が書き換わらないよう、 受付の時点で写しに凍らせ、 終端もその写しを読みます。 この記録は「必要なこと」を決めるだけで、 実際に効くのは宣言を読む部分を触る契約が着地したときです。
  器 SHALL 契約表の要件 id の実在の検査先を、 対象 repo の宣言 file の任意 key 1 つ (requirements・宣言値) から取る。 本 ADR が足す任意 key の名と集合の正本 SHALL core の閉じた列 (と、 そこから描く生成物) とし、 本 ADR は要件面の path (requirements) と終端が読む値 (§2.5) を名指すだけで列を写さない (ADR-1013 §2.1。 未知 key の拒否・空の配列と空要素の拒否・不備の全件行番号付きの報告は ADR-1010 §2.1 のまま不変・§2.7 (iv))。 読み手 SHALL path の拡張子で形を決め (.html は id が anchor として在ることを見、 .yaml は id の欄が並ぶことを見る)、 列に無い拡張子 SHALL typed に断る (fail-closed・NFR1004)。 宣言が無い周 SHALL 器の既定の path を使い、 既定の path が base の tree に無い周 SHALL 契約を断る (明示の既定 + fail-closed であり、 検査を飛ばす fallback ではない・ADR-1010 §4 が退けた「宣言し忘れが黙って効く」形を採らない)。 code SHALL NOT consumer の名・repo の名・host 固有の値で分岐する (N3)。 分岐の入力 SHALL 宣言値と拡張子だけとする。 器 SHALL NOT 新しい env の seam を作る (C2.2・値は宣言 file から来る)。 宣言値 SHALL 受付の実在の実測を経て有効になる (C10 の宣言値 → 実測値 → 有効値)。 足した任意 key SHALL 他の宣言値と同じく受付が便ごとに写しへ凍結し、 終端 SHALL その写しを読む (ADR-1010 §2.4・便の実装が宛先を書き換えて別の repo へ押す経路を塞ぐ)。 任意 key SHALL 読み手と同じ便で足す (配線の無い設定を CI が拒む・C10.3)。 本 ADR SHALL 必要条件だけを与え、 十分条件 SHALL 宣言を読む module を write-set に持つ契約 (設計 doc の契約表の contract-source#d) の done が持つ (本 ADR の land だけでは consumer は受け付けられない。 記録時点の同行の done は要件面の解決を持たず、 その句と設計 doc §2 の検査先の記述は本 ADR と同じ便で本節へ揃える)。 器 SHALL NOT 契約の行ごとに要件面の path を持たせる (同じ値が全行に写る・§5 (I))。 器 SHALL NOT 押す宛先が自 repo であることを機械で弁別する (ADR-1008 §2.3 の射程外を動かさない・宣言は対象 repo の PR として review を通り、 凍結の写しが便の自己拡張を塞ぐ・残る限界は §4)。
  §2.7 ADR-1004 §2.2 / §2.3・ADR-1010 §2.1・ADR-1016 §2.1 / §2.3・ADR-1018 §2.1・ADR-1019 §2.1 / §2.3 を部分 supersede する
  先の記録は「台帳には触らない」「契約 file は受付が読む入力で、 欄の一覧は文書が持つ」「宣言 file の項目は必須 3 つ + 任意 1 つ」「管理席が merge する」「契約に書き足して再開する」「回答で書ける範囲を広げられる」「終わっていない便とは、 着地も失敗も停止もしていない便」と決めていました。 この記録はそれぞれを、 「台帳は 1 つの口から読み、 書くのは閉じるときだけ」「契約 file は生成物で、 欄の正本は器の型」「必須 3 つ + 任意はいくつでも (一覧の正本は器の型)」「管理席は着地を撃ち、 後始末は器が持つ」「設計 doc の表を直して land し、 受け付け直す」「回答は書ける範囲を広げない」「実装前の審査で不合格になった便も、 終わった便に数える」と読み替えます。 それ以外の文は変えません。 併せて、 先の記録が「次の決定に回す」と残していた「運用物を repo に置く場所」を、 契約に限って決めます (これは読み替えではなく、 残された宿題の充足です)。
  (i) ADR-1004 §2.2 の台帳の面「MVP 外。 event と契約は bead id を文字列で持つだけで、 台帳 (bd) の read / write を行わない」は、 本 ADR により「器は台帳を 1 つの adapter module から読み (読み取り専用の子 process)、 書くのは着地した便の close 1 種に限る。 起票・受入条件・裁定の write は持たない」と読む (SHALL be read as・§2.2・裁定 Q3)。 read の禁止は ADR-1018 が復元の 1 点に限って既に解いており、 本 ADR はそれを adapter module へ一般化する。 同 §2.2 の他の面と跨版の path と rc の語彙は不変。 (ii) ADR-1018 §2.1 の「台帳は bd --readonly を子 process で読み (C15・記録時点の台帳 adapter は MVP 外)」および「台帳への write は管理席の別の口」と、 同 ADR の supersedes が残した「write の禁止・台帳 adapter は MVP 外」は、 本 ADR により「同じ読み取り専用の子 process を adapter module が持ち、 復元の subcommand (同 §2.4 の読み口) もその module を通す (第 2 の読み口を作らない・C2)。 write は close 1 種だけ器が持つ」と読む。 同 §2.1 の「起票が要る項目は起票候補の行として出すに留める」と、 同 §2.4 の台帳 binary の A3 の承認と待ち上限の行は不変。 (iii) ADR-1004 §2.3 決定文 3 が受理する array-of-tables の列挙を [[contract]] へ広げる 1 点に限って supersede し (ADR-1017 §2.3 が [[account]] で行った形と同じ)、 同 §2.3 の契約 file の key 列は、 本 ADR により「欄の集合の正本は core の型と、 そこから描く tracked な生成物 contracts/schema.toml への pointer」に置き換えて読み、 契約 file は受付が読む手書きの入力から生成物になる (§2.2)。 標準ライブラリだけの scanner・未知 key の拒否・不備の全件行番号付きの報告は不変で、 読む file の母集団に設計 doc の機械が読む区間と表だけの tracked file が加わる。 rules manifest 側の規定 (行の形・裁定 id・埋め込み) は変えない。 (iv) ADR-1010 §2.1 の key の集合 (ADR-1021 §2.6 (iii) により「必須 3 + 任意 1」と読まれている) は、 本 ADR により「必須 3 + 任意 n。 任意 key の集合の正本は core の閉じた列」と読む (§2.6)。 未知 key の拒否・空の拒否・不備の全件報告・穴の形・「第 2 の parser を作らない」は不変。 (v) ADR-1016 §2.1 の管理席の仕事 (3)「planner の go の後に merge する」は、 本 ADR により「go の後に land を撃つ。 押す・CI を照合する・台帳を閉じるは器が持つ」と読む。 同 §2.1 の「便 SHALL pipeline (intake → spawn → gate → land) が運ぶ」の段の列は宣言順が正本 (ADR-1013 §2.1) で、 本 ADR が受付の直後に 1 段を挿す (§2.4)。 仕事 (1) (2) と「自分の手で実装するのは pipeline が回せない便だけ」は不変。 ADR-1022 §2.6 と ADR-1019 §2.3 が同じ仕事を「land する」と再述した文は字面のまま成立し、 supersede しない (両 ADR の「不変」は各 ADR 自身の射程の宣言である)。 席の手順に残るのは便を流す binary の入れ替えだけで、 それは §2.8。 (vi) 同 ADR-1016 §2.3 の「planner が契約に classes または裁定 id を書き足して resume し、 既存の承認関門を通す」は、 本 ADR により「planner が設計 doc の契約表の行に classes または裁定 id を書き足して land し、 再受付する (新しい便が承認関門を通る)」と読む (契約 file は生成物であり、 写しは凍結済みで同じ便には効かない・§2.2)。 承認関門そのもの・逐語の記帳先・FR1022 は不変。 (vii) ADR-1019 §2.3 の「回答で write-set を広げる周は、 広げた write-set で照合をやり直す」は、 本 ADR により「回答は write-set を広げない。 広げる必要が出た周は設計 doc の契約表を改訂して land し、 再受付する (照合は新しい受付が通常どおり行う)」と読む。 同 §2.3 の「手で merge する経路を持たない」は不変で、 回答の逐語の記帳は ADR-1016 §2.3 と C7.2 の領分のまま動かさない。 (viii) ADR-1019 §2.1 の終端の定義「段が Landed / Failed / Stopped のいずれか、 または Gated で verdict が FAIL」は、 本 ADR により「または審査の段で verdict が合格でない」を足して読む (§2.4・判定は段の網羅 match のままで、 新しい段の arm が compile で強制される)。 同 §2.1 の交差の定義・拒否の関数 1 本・便を止める口は不変。 併せて、 ADR-1009 §2.6 が「次の ADR 候補」として射程外に残した「運用物 (契約 file・runner の起動行・PR 本文) を repo tracked にする置き場 (PUBLIC 面の情報を増やすため A1 に掛かる)」(ADR-1010 §2.6 は同項を「ADR-1009 §2.6 のまま」と引き継ぐ) を、 契約 (契約表と、 そこから生成する契約 file) に限って本 ADR が充足する (supersede ではない・§2.1 の A1 の判定を伴う)。 実装役の起動行・PR 本文・便ごとの指示 file の置き場は引き続き決めない。 supersede しないもの (誤読を塞ぐために名指す): ADR-1013 §2.1 / §2.2 (本 ADR はその充足形)・ADR-1019 §2.1 の交差の定義と拒否の関数 (本 ADR は理由を 1 つ足し、 終端の定義に 1 項を足すだけ)・ADR-1021 §2.5 (着地の順序は不変で、 本 ADR は着地の後を足す)・ADR-1021 §2.6 のうち gate の 4 段 (i) と記録の任意 field (iv) (本 ADR の (iv) が置き換えるのは同 §2.6 (iii) の key の読みだけで、 §2.5 は同 (iv) に乗る)・ADR-1022 §2.1〜§2.5 (役割と権能と対話面) と §2.6 の再述・ADR-1009 §2.2 と ADR-1010 §2.3 (検査の基準と極性は不変で、 検査の対象が生成された契約 file になるだけ)・ADR-1009 §2.4 (共通 verify の形)・ADR-1011 (審査役の起動形は不変で、 雛形が 1 枚増えるだけ)・ADR-1008 §2.3 (push 先を機械が弁別しないことは射程外のまま・限界は §4)・ADR-1010 §2.1 の「第 2 の parser を作らない」(本 ADR は同じ parser の受理域を広げる・§2.1)。
  §2.8 射程外
  この記録が決めるのは「契約の正本と生成」「書ける範囲の導出」「審査の段」「着地の終端」「consumer の要件面の受け方」「台帳の形と点検」だけです。 設計 doc の文章そのものに掛ける門は、 この記録の決定ではありません——user がすでに裁定した論点で、 その裁定と実装の契約と要件の番号は設計 doc と擦り合わせの記録が持ち、 ここには写しません。 自分の版が古いときに起動を断るか、 表から台帳の項目を起票する口を作るか、 表の正本を別の道具の形式へ移す時期をいつにするかも、 別に決めます。
  次は本 ADR の決定ではない (MUST NOT be read as such): 設計 doc の散文に掛ける門 (規範の印を持つ文が出所の pointer を持ち数と単位を持たないことを測る床の置き場と、 その撤去の条件) — 本 ADR は決めず、 写さない。 裁定は対話面の user 裁定 (2026-09-13・裁定 id 付き) が既に持ち、 その記録・実装の契約 (設計 doc の契約表の (f) 行)・要件 id (v0.8 の FR1052 / AC1025) は設計 doc docs/design/contract-source.md §12 と外部の道具の planner との擦り合わせ記録 (同日・合意記号 G-e) が指す (数値一般の検査を退けた実測も同じ記録が持つ)。 便を流す binary の版が着地 commit より古い周に起動を断るか (本 ADR は記録に残すところまで・§2.5)。 契約表から台帳の項目を起票する口 (台帳への write の 2 種目・§2.2 の「close 以外は書かない」と矛盾させない)。 契約表の正本を外部の道具の設計ノートへ移す時期と、 その道具の採用そのもの (本 ADR は 2 つの置き場を同じ読み手で受けることだけを決める・§2.1。 移行は「今の形で land してから移す」順序 (合意記号 G-g) で、 移す周の変更は置き場の差し替え 1 点)。 審査の観点を rules 行にすること。 依存の宣言で器が着地の順序を強制すること (床は解決と輪の無さを数えるだけ・順序は ADR-1021 §2.5 の領分)。 CI の待ちが着地の直列性に与える影響の制御 (費用は §4・順序と待ちの上限の設計は同 §2.5 の後続)。 台帳に溜まった設計本文の memo を各設計 doc へ移す作業そのもの (lint が残りを名指すところまでが本 ADR)。 既に起票済みの契約の移行そのもの (§2.2 の分界は決めるが、 移行の手順は運用であって規則ではない)。 席の cycle と復元の作法 (ADR-1018 のまま)。 席の役割と権能の値 (ADR-1022 のまま・close は器の行為ゆえ権能を増やさない)。 runner / lens の雛形と権限 (ADR-1009 / ADR-1011 のまま・雛形 1 枚の追加は起動形を変えない)。 push 先が自 repo かを機械が弁別すること (ADR-1008 §2.3 の射程外のまま)。
  （器の記録の §3. SRS との関係 (正本は SRS)）
  この記録が仕える要件は、 契約の正本と生成・書ける範囲の導出・審査の段・着地の終端・台帳の点検の 5 本と、 その受入基準 4 本です。 これらは要件書の v0.8 で入ります (今の要件書は v0.7 で、 まだこの番号を持ちません)。 要件の文面はここには写しません。 既にある要件 (交差の排他・実装後の審査・質問と回答・実装役の起動) は変えません。 受付が要件 id の実在を測るので、 v0.8 が入るまで新しい形の受付は全行を断ります＝ v0.8 が先です。
  本 ADR が仕える要件は SRS v0.8 が正本である: FR1047 (契約の正本・§2.1)・FR1053 (契約 file の生成・§2.2)・FR1054 (設計 pointer の拒否・§2.2)・FR1048 (write-set の閉包・§2.3)・FR1055 (契約表の検査・§2.3)・FR1049 (契約の審査の段・§2.4)・FR1050 (land の終端・§2.5 / §2.6)・FR1051 (台帳の lint・§2.2)、 受入は AC1021 (表の検査と生成)・AC1022 (審査)・AC1023 (終端)・AC1024 (lint)・AC1026 (契約表の検査)。 これらの id は SRS v0.8 で入った (本 ADR より先に land・仕様編集の口から通した)。 本 ADR の JSON-LD は SRS の生成物へ anchor を張らない (SRS は生成器の出力で、 folio の逆 link を持てない)。 v0.8 は併せて範囲の行を改める (契約の正本と生成・審査の段・閉包の検査・着地の終端・台帳の lint を扱う側へ足し、 「台帳への write」の行を「close と 1 行の理由に限る」へ改める)。 設計 doc §12 の散文の門に対応する要件 id (FR1052 / AC1025・同じ v0.8) は §2.8 のとおり本 ADR の参照に含めない。 既存の要件との関係: FR1002 (契約は要件 id と設計 doc を pointer で持つ) の充足形が §2.1〜§2.2、 FR1012 (land の記帳) の充足形が §2.5、 FR1039 (受付の交差) の隣に不足を足すのが §2.3、 FR1018 (全件・黙って落とさない) が §2.1 / §2.3 の形、 NFR1004 (測れない周は断る) が §2.1 / §2.3 / §2.6 の極性の根拠、 NFR1003 (実行時の外部依存 0) が §2.3 で構文木の crate を採らない根拠、 NFR1001 (予算) が §2.4 の「測れなかった」の根拠。 不変の要件: FR1004 (実装役の起動・段の順序は本 ADR と設計 doc が持つ)・FR1009 (実装後の審査の極性)・FR1020 (書ける範囲の guard)・FR1022 (人由来の event は承認だけ・審査の verdict は機械由来)・FR1043 (管理の tick と pointer の注入・lint の行の届け先)・FR1031 / FR1032 (質問と回答)。 順序: 契約表の検査は要件 id の実在を測るので、 v0.8 の land が最初の契約 (表の parser と検査) の前提である (v0.8 の前に受け付けると全行が断られる)。 要件の文面・欄の名・型の variant の列・rules 行の値はここには写さない。
