  verbatim: "器の台帳 s2-07l.197 の notes に在る（この file に写さない）"
  surface: R-8
consequences:
  - "良い面は、 契約が 3 回写されなくなり (写しは器が作る生成物になり)、 書ける範囲の抜けと設計の穴が実装の前に出ること、 着地の後始末が目視から記録へ移ること、 そして別の project でも「宣言 1 行」で受け付けられるようになることです。 悪い面は、 型と行と段と止め口が増えること、 CI の結果を待つ間その project の次の着地が待たされること、 設計 doc の PR を通さないと契約を直せなくなること、 器の外にある門 (文書の検査) が手元でしか撃てないこと、 席が手で台帳を閉じる経路は今も止められないこと、 そして書ける範囲の導出が「少なく見積もる」側に留まることです。"
  - "Positive: 契約の正本が 1 つになり (設計 doc の行)、 台帳と便の契約 file は pointer と生成物になる (C15 の充足形・3 段の写しの drift 源が消える)。 書ける範囲の不足と設計の穴が受付と審査で止まる (C16 の in-loop・実装後の gate まで持ち越さない)。 着地の終端が typed な記帳になり、 「着地したのに閉じていない」「閉じたのに CI が赤」が記録で判定できる (FR1022 の人由来 event を増やさない・ADR-1022 §2.7 の向きの実例)。 外部の道具は trailer 1 つと tracked な生成物 (欄の schema) だけを読めばよく、 欄の追加は本器の版上げで済む (他 repo の判断記録に縛られない)。 consumer は宣言 file の任意 key だけで受け付けられ、 code は consumer ごとに分岐しない (N3)。 CI と受付が同じ関数を撃つので、 検査の 2 実装が生まれない (C2)。"
  - "Negative (受け入れるコスト): 閉じた型に variant が 5 つ (契約を断る理由に 2・段・完了条件・規則の種類に各 1)・止め口が 3 つ (極性一覧に 3 行)・rules 行 1 本・core の module が 5 つ (表・閉包・審査・台帳の adapter・台帳の lint)・雛形 1 枚・tracked な生成物 1 file・CI の job 1 つ増える (非 Rust 実行物の検出線が動く・ADR-1009 §2.5)。 着地は gate 済みの便を先に通す規律 (ADR-1021 §2.5) と CI の実時間の待ちが重なり、 1 便の待ちが後続の着地を塞ぐ (並列度の実効値が落ちる。 終端だけを別に撃てる冪等な口が逃げ道で、 順序と待ちの機構は後続設計)。 契約の小さな直しにも設計 doc の PR が要る (審査と CI を毎回通る・起こし直しの周は審査を再度通り、 承認の関門を通った後でも審査で止まりうる第 2 の門になる)。 便ごとに審査役の呼出しが 1 回増える (予算は既存の cap の内側・超過は「測れなかった」で落ちる)。 書ける範囲の導出は下界で、 別名の形は拾えない (拾わないことを歯で固定するが、 穴は残る＝質問と設計 doc の改訂で解く)。 席が手で台帳を閉じる経路は編集時に止まらない (器の subcommand ではないので ADR-1022 §2.3 の guard の対象外・post-hoc の lint が名指すだけ・C16 に対する限界として明記する)。 memo の判定が台帳の本文の字面を入力にする (C3.3 と擦れる・guard ではなく名指しに留まる形で受け入れる)。 押す先が自 repo かを機械は弁別しない (ADR-1008 §2.3 の射程外は動かさない。 宣言の写しを便ごとに凍結することで便の自己拡張だけを塞ぐ)。 自 repo への PR の形は trailer も記録も持たない恒久の穴で、 外部の道具では「まだ分からない」に留まる。 公開面に契約の題と done の文が出る (A1 の判定は §2.1)。 既に起票済みの契約は古い形のまま流れるので、 移行の間は 2 つの形が併存する (lint の母集団は本 ADR の land 以降)。 v0.8 の要件 id が SRS に入るまで、 本 ADR の参照と最初の契約は待つ。"
note: |
  器の元の file: scribe2/design-intent/decisions/ADR-0023-contract-source-is-the-design-document-table.html
  器の記録の頭: Status: accepted · Date: 2026-09-13 · version 0.4.6 (拘束する constitution の版) · C1 / C1.2 / C2 / C2.2 / C3.2 / C3.4 / C5 / C7 / C7.2 / C10 / C10.3 / C11.2 / C12.5 / C12.6 / C12.7 / C14 / C14.2 / C15 / C15.2 / C16 / C16.2 / N1 / N2 / N3 / A1 / A3 の適用を記録し、 ADR-1004 §2.2 (台帳は MVP 外) / §2.3 (契約 file の key 列) と ADR-1010 §2.1 (宣言 file の key は必須 3 + 任意 1) と ADR-1016 §2.1 (管理席が merge する) / §2.3 (契約に書き足して resume) と ADR-1018 §2.1 (台帳 adapter は MVP 外・write は管理席の別の口) と ADR-1019 §2.1 (終端の定義) / §2.3 (回答で write-set を広げる) を §2.7 で部分 supersede し、 ADR-1009 §2.6 が次の ADR 候補として残した射程外 (運用物の tracked な置き場・ADR-1010 §2.6 が同項を引き継ぐ) を契約に限って充足する · 要件は SRS v0.8 (FR1047 / FR1048 / FR1049 / FR1050 / FR1051 / FR1053 / FR1054 / FR1055 / AC1021〜AC1024 / AC1026) が正本
  器の記録の前置き: 本 ADR は IETF RFC 2119 および RFC 8174 / BCP 14 に定義される MUST / SHALL / SHOULD / MAY のキーワード解釈規約に従う。 ADR は決定時点の記録であり、 改訂は新しい ADR による supersede で行う。 本 ADR の §2 は user 裁定 (2026-09-13・論点 Q1〜Q3) を受けた決定で、 §3 は SRS v0.8 への pointer である。 本 ADR は要件の文面を持たない。 憲法の条文は動かさない (C15 / C15.2 / C16 / C16.2 / C2 / C3.4 / C10 の充足形の記録である)。 型・段・生成の形・検査の分割・歯の列は設計 doc docs/design/contract-source.md が契約の前に持ち、 本 ADR はそこへ pointer で委ねる (列挙を文書に写さない・ADR-1013 §2.1)。 発効: 本 ADR は rules 行の値を持たず (C1)、 CI の照合の待ちの上限は契約が裁定 id 付きで manifest に書く (行が manifest に在って初めて C14.2 の相互参照が成立する)。 本 ADR は A1 (§2.1) と A3 (§2.5) の判定を記録するだけで、 その承認は対話面で別に得る (承認の前に最初の契約表の行は着地せず、 forge の CLI を撃つ契約は受け付けない)。 accepted である (§2.1〜§2.6 の実装 bead は起票できる)。 §2.8 が名指す論点は本 ADR の決定ではない。
  器の機械の欄 version: 0.4.6 (拘束する constitution の版。 本 ADR は憲法の条文を動かさない)
  器の機械の欄 decided-by: user (2026-09-13) — 便の一周のうち器が構造で持つ範囲を問う 3 論点への裁定 (要旨: Q1 = 契約の正本を設計 doc の機械が読む契約表へ移し、 器が契約 file を生成する。 Q2 = 実装役を起こす前の契約の審査の段は must。 Q3 = 着地の終端に台帳の close を含め、 台帳への write は close と 1 行の理由に限る)。 逐語は台帳 s2-07l.197 の notes が原本で本 file には写さない (PUBLIC 面には出さない)。 外部の道具 (consumer 第 1 号) の planner との擦り合わせ (同日・確定版の返答・合意記号 G-a〜G-h) は §2.1 / §2.5 / §2.6 / §2.8 の材料であって裁定ではない
  器の機械の欄 stakeholders: Developer, AI Agent, External Reviewer
  器の機械の欄 supersedes: 次の文を部分 supersedeする (§2.7): (i) ADR-1004 §2.2 の面 3「MVP 外。 event と契約は bead id を文字列で持つだけで、 台帳 (bd) の read / write を行わない」を「器は台帳を 1 つの adapter module から読み (読み取り専用の子 process)、 書くのは着地した便の close 1 種に限る」と読む (read の禁止は ADR-1018 が復元の 1 点で既に解いており、 本 ADR はそれを adapter module へ一般化する)、 (ii) ADR-1018 §2.1 の「台帳は bd --readonly を子 process で読み (C15・記録時点の台帳 adapter は MVP 外)」および「台帳への write は管理席の別の口」と、 同 ADR の supersedes が残した「write の禁止・台帳 adapter は MVP 外」を「同じ読み取り専用の子 process を adapter module が持ち、 復元 (同 §2.4 の読み口) もその module を通す。 write は close 1 種だけ器が持つ」と読む、 (iii) ADR-1004 §2.3 決定文 3 が受理する array-of-tables の列挙を [[contract]] へ広げる 1 点に限って supersede し、 同 §2.3 の契約 file の key 列を「欄集合の正本は core の型と、 そこから描く tracked な生成物 contracts/schema.toml への pointer」へ置き換えて読む、 (iv) ADR-1010 §2.1 の key の集合 (ADR-1021 §2.6 (iii) により「必須 3 + 任意 1」と読まれている) を「必須 3 + 任意 n (任意 key の集合の正本は core の閉じた列)」と読む、 (v) ADR-1016 §2.1 の管理席の仕事 (3)「planner の go の後に merge する」を「go の後に land を撃つ (押す・CI の照合・台帳の close は器が持つ)」と読み、 同 §2.1 の pipeline の段の列 (intake → spawn → gate → land) は宣言順を正本として本 ADR が受付の直後に 1 段を挿す、 (vi) ADR-1016 §2.3 の「planner が契約に classes または裁定 id を書き足して resume し」を「planner が設計 doc の契約表の行に書き足して land し、 再受付する」と読む、 (vii) ADR-1019 §2.3 の「回答で write-set を広げる周は、 広げた write-set で照合をやり直す」を「回答は write-set を広げない」と読む、 (viii) ADR-1019 §2.1 の終端の定義「段が Landed / Failed / Stopped のいずれか、 または Gated で verdict が FAIL」に「または審査の段で verdict が合格でない」を足して読む (交差の定義と拒否の関数は不変)。 併せて、 ADR-1009 §2.6 が次の ADR 候補として射程外に残した「運用物 (契約 file・runner の起動行・PR 本文) を repo tracked にする置き場」(ADR-1010 §2.6 は同項を「ADR-1009 §2.6 のまま」と引き継ぐ) を、 契約 (契約表と、 そこから生成する契約 file) に限って本 ADR が充足する (supersede ではない)。 他の文は変えない
