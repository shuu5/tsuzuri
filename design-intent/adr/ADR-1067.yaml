consequences:
  - "この判断で良くなること 3 つと、 代わりに引き受けること 4 つです。 良くなるのは、 群の移動と再起動の後の起こし直しで会話が続き、 席が流れを組み直す手番と人が会話を探して開き直す手番が消えること、 器は記録を読まず複写せず置き場が共有かを判じないので machine 固有の値で分岐しない線が保たれること、 続きを拾う道が機械の復帰の 1 本のままで足すのは id の読み手 1 本と末尾の 1 語だけであることです。 引き受けるのは、 記録の置き場が口座を跨いで見えない machine では --resume 付きの起動を claude が断り、 打刻が進まないので次の周も同じ id で断られ続け、 人が席を起こすまで席が立たないこと (器は事前に判じず、 空で起こし直す逃げ道はこの記録では足しません)、 要件書の FR1038 / FR1059 の改訂を伴い前の決定の 1 節が置き換わること、 前の口座で作った会話の量 (context の消費) を新しい口座に持ち込むこと、 打刻の id が会話の id の形でないときは運ばないことです。"
  - "良い結果: 群の移動と再起動の後の起こし直しで会話が続き、 席が台帳と git から流れを組み直す手番と、 人が会話の id を探して resume を撃つ手番が消える"
  - "良い結果: 器は対話の記録を読まず複写せず、 記録の置き場が共有かを判じない。 host 固有の値で分岐しない線 (N3) と ADR-1049 の理由 1 / 3 はそのまま保たれる"
  - "良い結果: 復帰の道は機械の復帰の 1 本のまま。 足すのは打刻の sid の読み手 1 本と carry の 1 語で、 tick と群の段が同じ 1 本を呼ぶ"
  - "代償: 対話の記録の置き場が口座を跨いで見えない host では、 --resume 付きの起動を claude が断って席が立たない。 断られた周は session が始まらず打刻も進まないので、 次の周も同じ id で断られ続け、 人が席を起こすか打刻が変わるまで席は立たない (器は事前に判じず、 空で起こし直す枝は本 ADR では足さない・逃げ道は後続の決定)"
  - "代償: 要件 FR1038 / FR1059 の改訂 (v0.23) を伴い、 ADR-1049 の決定文の 1 節が本 ADR に置き換わる (ADR-1049 は frozen のまま・supersession の系譜で読む)"
  - "代償: 前の口座で作った会話の文脈 (context の消費) を新しい口座に持ち込む。 圧縮の直前の 1 枠と席の指示文は今まで通り出るので、 続きの拾い方は変わらない"
  - "代償: 打刻の sid が会話 id の形でない周 (古い打刻・手書きの fixture) は運ばない。 運ばれなかったことは起動行の末尾で分かり、 判定行に別の語は足さない"
