  器の承認の欄: 裁定 (user)・user・裁定 id user 2026-09-25T03:58Z (群の移動の後は会話を resume する、 会話を reset する意味が無い、 という方針の受諾。 要旨だけを写す。 逐語は非公開の作業記録簿 (台帳 s2-07l.628 の notes) に在る)・裁定済
  器の承認の欄: 設計 (orchestrator)・orchestrator・2026-09-25 草稿 v1 (設計 seat-heartbeat.md §7 形 3 / §8 と account-lifecycle.md §18 / §20 形 6 を正本に、 現物の口 (状態の打刻の行・起動の入力の carry・tick の起こし・群の段の起こし直し) の読みと合わせて形にした。 拘束する constitution の版 0.5.0)・作成
  器の案の章の要約: 候補を 4 つ並べます。 状態の打刻の最終行の会話の id を --resume で運ぶ案 (選んだ案・記録の file は複写せず、 続きを拾う道は機械の復帰のまま)、 運ばない案 (前の決定のまま)、 会話の記録の file を新しい口座の置き場へ複写する案、 --continue で最新の会話を開かせる案です。 却下した 3 案にも利点を並べ、 退けた決め手が現物か分析かを各案に書きます。 運ばない案は器が id も記録も扱わない点で、 複写する案は置き場が共有でない machine でも会話が続く点で、 --continue の案は打刻の id の読み手が要らない点で、 選んだ案に勝ります。
  器の専門語の説明: 本文に出てくる専門語 9 個を、 やさしい言葉で説明します。
  ・状態の打刻（state stamp）: 席の hook (SessionStart / UserPromptSubmit / Stop) が席の置き場の file に 1 行ずつ残す記録。 state (busy / idle)・event・ts と、 claude の session id (会話 id) を持つ。 管理 tick はこれを読んで黙りと変化を判じ、 本 ADR の起こし直しは最終行の会話 id を運ぶ。
  ・会話 id（conversation id）: claude が 1 つの会話 (session) に付ける id (UUID の形)。 --resume <id> で同じ会話の続きを開ける。 器は状態の打刻に残った字面だけを運び、 形が違う周は運ばない。
  ・機械の復帰（mechanical resumption）: 席を起こし直した周に、 台帳の行と git の現在地と圧縮の直前の 1 枠だけから直前の流れを組んで session の開始で出す道 (ADR-1049)。 本 ADR の後も復帰の道はこの 1 本で、 --resume は claude が会話を開く口に過ぎない。
  ・対話の記録（conversation record）: claude が口座の設定 dir の下の projects/<anchor> に置く会話の記録の file。 器は読まず、 複写せず、 置き場が口座を跨いで共有かも判じない (ADR-1049・本 ADR で不変)。
  ・移動の門（move gate）: 管理 tick の判定の列のうち、 群の今の口座と自席の登録 row の口座が違う周に、 退避 (/exit か dialog の Enter) か起こし直しを自席にだけ撃つ段 (seat-heartbeat.md §4 / §7)。 本 ADR の後の起こし直しは打刻の会話 id を --resume で運ぶ。
  ・群の今の口座（group effective account）: project の群の席が実際に使う口座。 host の根に群ごとに高々 1 件の記録で持つ (ADR-1049)。 起こし直しの席の口座はこの記録から決まり、 本 ADR はその起動行の末尾に会話 id を足す。
  ・管理 tick（management tick）: 席の外から周期で回り、 席が黙っていないかを見て続きを促す 1 行を注入する仕組み (ADR-1058)。 群の記録と自席の口座が違う周と、 窓が shell に戻った席の周に、 起こし直しを自席に撃つ (seat-heartbeat.md §7・SRS v0.23 FR1027)。 本 ADR の後はその起こしが会話 id を運ぶ。
  ・退避の合図（evacuation signal）: 移動の周に古い席の画面へ注入する 1 行 (作業記憶を台帳と git に残して /exit)。 本 ADR では変えない。 退避の後の起こし直しが打刻の会話 id を運ぶので、 退避で作業記憶を残す規律は今まで通りだが、 会話そのものは続く。
  ・起動行（launch line）: 器が登録 row の雛形と口座と anchor から導出して窓の shell へ差し込む 1 行 (SRS FR1059)。 末尾の carry (短い形の -c / -r・本 ADR の --resume <会話 id>) は起動の周に足し、 雛形には載せない。
  器の頁の末: このページは、大もとの機械データ (正本) から自動で組み立てられています。構造は機械が自動で検査し、内容が元データに忠実かは独立のレビューで確かめます。
