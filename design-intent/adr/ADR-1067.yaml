# 判断の記録 ADR-1067 — 器 scribe2 の判断の記録 ADR-0067 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1067
title: "席の起こし直しは打刻の会話 id を --resume で運ぶ — 群の移動と管理 tick の起こし直しは、 その席の状態の打刻の最終行の会話 id を起動行の末尾に --resume で渡して直前の会話の続きから始め、 対話の記録の file は複写せず、 復帰の道は機械の復帰の 1 本のまま (ADR-1049 の「対話の記録は運ばない」の節だけを supersede・要件 FR1038 / FR1059 の改訂を伴う)"
status: accepted
date: 2026-09-25
context: |
  ADR-1049 は群の移動を「新しい口座で新しい席を起こし、 対話の記録は運ばず、 復帰は機械の注入に任せる」と決め、 生きた対話を持ち越す案 (OPT3) を「記録の置き場の共有は host の設定で器の前提にできない・復帰の道が 2 本になる・器が対話の記録を読む口を持つ」の 3 つで退けた。 2026-09-25 の実測で、 群の移動と再起動の後の起こし直しは毎回まっさらな session を立て、 席は台帳と git から流れを組み直す手番を移動のたびに払い、 持ち主は「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」と裁定した (裁定 id user 2026-09-25T03:58Z)。 本 ADR は、 起こし直しが運ぶものを「その席の状態の打刻の最終行に hook が残した会話 id 1 つ」に限り、 起動行の末尾に --resume で渡すと決める。 対話の記録の file は複写せず、 器は記録を読まず、 復帰は機械の復帰の 1 本のまま (id が無い・形が違う周は今まで通り空で起こす)。 ADR-1049 の 3 つの理由は、 file を複写しない・器が記録を読まない・復帰の道は 1 本のままで、 どれも本 ADR には当たらない。 要件 FR1038 / FR1059 (v0.23) の改訂を伴う。
  なぜこの判断が要るのかを、 経緯・実測と裁定・器の今の部品・要件書との関係・これまでの決まり・この判断の範囲の 6 つから説明します。 前の決定 (ADR-1049) は、 群ごと別の口座へ移るときは新しい口座で新しい席を起こし、 会話の記録は運ばず、 続きは器が台帳と git と圧縮の直前の 1 枠から組み直すと決め、 会話を持ち越す案を 3 つの理由 (記録の置き場が共有かは machine の設定・続きを拾う道が 2 本になる・器が記録を読む) で退けました。 2026-09-25 の実測では、 群の移動と再起動の後の起こし直しはどの席でもまっさらな session を立て、 持ち主は席ごとに前の会話を探して手で開き直し、 「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」と裁定しました。 同じ日の別の裁定 (ADR-1066) は群の口座の移動を含めて器が完全に自律する方針を受諾しており、 起こし直しのたびに人が会話を探す手番はその方針に反します。 器の部品を見ると、 席の状態の打刻には既に会話の id が残っていて、 席を起こす入力は末尾に足す語 (carry) を持ち、 人が使う短い形はそれで --continue や --resume を渡しています。 見回り (管理 tick) の起こしと 1 周の群の手番の起こし直しは、 その語を空で撃っています。 会話の記録の file は claude が口座の設定 dir の下に置き、 この machine では口座を跨いで同じ場所を指していますが、 それは machine の設定であって器は読みません。 要件書では、 FR1038 が「会話の記録は運ばない」と書き、 FR1059 (席の起動) は起こし直しに何を運ぶかを書いていないので、 この判断は両方の改訂を伴います。 決まりの側では、 machine 固有の値で分岐しない・道は 1 本・状態は型で運ぶ・足すときに外す物を名指す、 が効き、 器は「記録が見えるか」を判じず id を渡すだけ、 足すのは打刻の id の読み手 1 本と末尾の 1 語、 外すのは前の決定の「運ばない」の 1 節だけ、 と読みます。 動かすのは起こし直しの 1 行の末尾 1 語だけで、 席の起動の他の全部・人が使う短い形・機械の復帰・群の移動の判定と記録・退避の合図・会話の記録の置き場は動かしません。
  CTX1 経緯 — 対話の記録（claude が残す会話の file）を運ばないと決めた前の決定と、 その理由 3 つ
  ADR-1049 は席の口座を project の群で持ち、 上限に当たった周は群単位で 1 回だけ移り先を決め、 新しい口座で新しい席を起こして復帰を機械の注入 (台帳の行・git の現在地・圧縮の直前の 1 枠) に任せると決めた。 生きた対話を持ち越して別の口座へ移る案 (OPT3) は、 (1) 対話の記録の置き場が共有かどうかは host の設定で、 器が前提にすると host 固有の値で分岐する (N3)、 (2) 復帰の道が 2 本になる (圧縮・異常終了は機械の復帰・移動だけ持ち越し)、 (3) 器が対話の記録を読む口を持つことになる、 の 3 つで退けられ、 決定は「対話の記録 SHALL NOT 運ばず」と書かれた。 要件 FR1038 はそれを「新しい口座で席を起こし直し (対話の記録は運ばない・ADR-1049)」と写した。
  CTX2 実測と裁定 — 起こし直しのたびに会話が消える
  2026-09-25 の実測で、 群の移動 (黒 1 → 黒 6) と host の再起動の後の起こし直しは、 どの席でもまっさらな session を立てた。 席は起こされるたびに台帳と git から直前の流れを組み直し、 持ち主は席ごとに前の会話の id を探して手で resume を撃った。 持ち主は「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」と裁定した (裁定 id user 2026-09-25T03:58Z・要旨だけを写す・逐語は非公開の作業記録簿に在る)。 同じ日の裁定 (2026-09-25T04:13Z・ADR-1066) は群の口座の移動を含めて器が完全に自律する方針を受諾しており、 起こし直しのたびに人が会話を探す手番はその方針に反する。
  CTX3 現物 — 打刻に会話 id（claude の session の名前） が既に在り、 起動の入力は末尾の語を受ける
  base 42062de で、 席の状態の打刻（席の hook が残す 1 行） (席の hook が SessionStart / UserPromptSubmit / Stop で置き場の file に 1 行ずつ残す記録) は state・event・ts に加えて sid (claude の session id・会話 id) を持つ。 席の起動の入力 (Launch) は carry (起動行（席を起こす 1 行の command）の末尾に足す語) を持ち、 席の短い形 -c / -r はこれで --continue / --resume <id> を渡す (account-lifecycle.md §18)。 管理 tick（席を周期で見る仕組み） の起こし (wake) と dispatch の群の段の起こし直し (relaunch) は carry を空で撃つ (seat-heartbeat.md §4 形 3・account-lifecycle.md §20 形 6)。 対話の記録の file は口座の設定 dir の下の projects/<anchor> に claude が置き、 この host では口座を跨いで同じ 1 dir を指す symlink になっているが、 それは host の設定であって器は読まない。 --resume <id> は claude 自身の口で、 器はそれを起動行の末尾に置くだけである。 打刻の sid の読み手は行 f (s2-07l.626) が state.rs に 1 本置き、 行 g (s2-07l.628) が群の段の relaunch にも同じ 1 本を渡す。
  CTX4 要件文との関係 — FR1038 と FR1059 の改訂
  SRS v0.22 の FR1038 は「新しい口座で席を起こし直し (対話の記録は運ばない・ADR-1049)」と書き、 FR1059 (席の起動) は起こし直しの周に何を運ぶかを書かない。 本 ADR は FR1038 の同じ節を「起こし直しは席の起動 (FR1059) で、 その席の状態の打刻の最終行の会話 id を --resume で運んで直前の会話の続きから始め、 対話の記録の file は複写しない」に改め、 FR1059 に「起こし直しの周は打刻の最終行の会話 id を起動行の末尾に --resume で運ぶ (会話 id の形でない周は運ばない・記録の file は複写しない)」を足す改訂 (v0.23) を伴う。 改訂は持ち主が spec の編集の口で行い、 本 ADR と同じ PR で land する。
  CTX5 憲法と既存の決定の向き (本 ADR の解釈)
  N3 (host 固有の値で code を分岐させない) は、 器が「記録の置き場が共有か」を判じて分岐する形を禁じる。 本 ADR は判じない — 器は id を渡すだけで、 記録が新しい口座から見えるかは claude が起動の周に決め、 見えない周は claude が resume を断って席が立たない (起動の結果の語は今の launch-unconfirmed / input-unknown のまま・器は記録を読みに行かない)。 C2 (経路は 1 本) は復帰の道を 2 本にしないことを求め、 本 ADR の復帰は機械の復帰（器が続きを組み直す道） (台帳・git・圧縮の直前の 1 枠から席の指示文を組む) の 1 本のままで、 --resume はその手前で claude が会話を開く口に過ぎない。 C3 (状態は型で運ぶ) と C10 (宣言値・実測値・導出値を分ける) から、 運ぶ id は打刻 (実測の記録) の字面だけで、 pane の字面や projects dir の走査からは取らない。 C17 (足すときに何を外すかを名指す) は、 本 ADR が足すのは打刻の sid の読み手 1 本と carry への 1 語で、 外すのは ADR-1049 の「運ばない」の 1 節だけと読む。 ADR-1065 (trust の印は席の起動が置く) と ADR-1066 (tick が判定を撃つ) は本 ADR の前提で不変。 ADR-1045 §2 (2) (席は自分を起こし直さない) は不変で、 運ぶのは起こす側 (tick・群の段) である。
  CTX6 射程 — 動かすのは起こし直しの起動行の末尾 1 語だけ
  動かすのは、 管理 tick の起こし (seat-heartbeat.md §7 形 3・行 f) と dispatch の群の段の起こし直し (account-lifecycle.md §20 形 6 の改め・§8・行 g) が起動行の末尾に置く carry を、 「空」から「打刻の最終行の sid が会話 id の形 (UUID) なら --resume <sid>・無い / 形が違う周は空」に変えることの 1 つ。 動かさないのは、 席の起動の他の全部 (役割・口座の解決・登録 row・trust の印・窓と入力欄の門・起動行の雛形)、 席の短い形 -c / -r (人が明示的に運ぶ口・今のまま)、 機械の復帰 (席の指示文の生成・圧縮の直前の 1 枠)、 群の移動の判定と記録 (ADR-1049・ADR-1066)、 退避の合図、 対話の記録の置き場 (器は触らない・読まない・複写しない)。
  （選択肢を測るものさし）この判断を評価する 4 本のものさしです。 起こし直しで会話が消えないこと (移動と再起動の後に人が会話を探して開き直す手番を無くす)。 machine の設定で分岐しないこと (器は記録の置き場が共有かを判じず、 記録を読まず、 複写しない)。 続きを拾う道は 1 本のままにすること (機械の復帰は変えず、 運ぶのは id 1 語だけ)。 運ぶ値は実測の記録から取ること (状態の打刻の最終行の id の字面だけを、 会話の id の形のときに限って運ぶ) です。
  DR1｜起こし直しで会話が消えない — 移動と再起動の後に人が会話を探して resume を撃つ手番を無くす (完全自律の裁定) CTX2 (実測と裁定)
  DR2｜host の設定で分岐しない — 器は記録の置き場が共有かを判じず、 記録を読まず、 複写しない (N3・ADR-1049 の理由 1 / 3 を守る) CTX1・CTX3・CTX5
  DR3｜復帰の道は 1 本 — 機械の復帰 (台帳・git・圧縮の直前の 1 枠) は変えず、 運ぶのは id 1 語だけ (C2・ADR-1049 の理由 2 を守る) CTX1・CTX5
  DR4｜運ぶ値は実測の記録から — 打刻の最終行の sid の字面だけを、 会話 id の形の周に限って運ぶ (C3・C10・fail-closed) CTX3・CTX5
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 席の起こし直し (群の移動の周の 1 周の群の手番と、 見回りが窓が shell に戻った席を起こす周) は、 その席の状態の打刻の最終行に残った会話の id を読み、 id の形 (UUID) なら席を起こす 1 行の末尾に --resume とその id を置いて起こし、 id が無い・形が違うときは今まで通り空で起こします。 id の読み手は打刻の部品に 1 本で、 見回りの起こしと群の手番の起こし直しが同じ 1 本を呼びます。 器は会話の記録の file を読まず、 複写せず、 記録の置き場が口座を跨いで共有かを判じません。 記録が新しい口座から見えるかは claude が起動のときに決め、 見えなければ席は立たず、 器は今までと同じ起動の結果の語で止まります。 続きを拾う道は機械の復帰 (台帳の行・git の現在地・圧縮の直前の 1 枠から席の指示文を組み、 session の開始で出す) の 1 本のままで、 --resume は claude が会話を開く口であって器の道ではありません。 運ぶ値は打刻の字面だけで、 画面の文字や記録の置き場の走査からは取りません。 席の登録 row の起動の雛形には --resume を載せず、 値は起こすときに末尾に足します。 人が使う短い形 (-c / -r)・退避の合図・群の移動の判定と記録・信じた印・席の指示文の生成は変えません。 前の決定 (ADR-1049) のうち「会話の記録は運ばない」の節・「持ち越しは要らない」のものさし・「続きは測り直して入れ直すもの」の原則の 3 つを置き換え、 他 (群・鍵・記録・移り先の決め方・新しい口座で新しい席を起こす・続きは機械の復帰) は保ちます。 要件書では、 FR1038 の「会話の記録は運ばない」を「起こし直しは席の起動で、 打刻の会話の id を --resume で運んで直前の会話の続きから始め、 記録の file は複写しない」に改める根拠になり、 FR1059 に「起こし直しのときは打刻の会話の id を末尾に --resume で運ぶ」を足す根拠になり、 見回り (FR1027) の起こし直しが運ぶ 1 語を決め、 席の登録 row (FR1040) の雛形の形は変えないことを主張します。
  採用 — OPT1
  席の起こし直し (群の移動の周の dispatch の群の段と、 管理 tick が窓が shell に戻った席を起こす周) SHALL その席の状態の打刻の最終行の sid を読み、 会話 id の形 (UUID) の周は起動行の末尾に --resume <sid> を置いて起こし、 sid が無い・形が違う周は空で起こす (今まで通り)。 読み手 SHALL 打刻の module に 1 本で、 tick の起こしと群の段の起こし直しが同じ 1 本を呼ぶ (C2)。 器 SHALL NOT 対話の記録の file を読まず、 複写せず、 記録の置き場が口座を跨いで共有かを判じない (N3) — 記録が新しい口座から見えるかは claude が起動の周に決め、 見えない周は席の起動の今の結果の語 (launch-unconfirmed / input-unknown) で止まる。 復帰 SHALL 機械の復帰 (台帳の行・git の現在地・圧縮の直前の 1 枠から席の指示文を組み session の開始で出す) の 1 本のままで、 --resume は claude が会話を開く口であって器の復帰の経路ではない。 運ぶ値 SHALL 打刻の字面だけで、 pane の字面や projects dir の走査から取らない (C3・C10)。 登録 row の起動の雛形 SHALL NOT --resume を載せない (雛形は口座と anchor の形だけ・値は起動の周に carry で足す)。 席の短い形 -c / -r・退避の合図・群の移動の判定と記録・trust の印・席の指示文の生成は変えない。 本 ADR SHALL ADR-1049 のうち、 決定の「対話の記録 SHALL NOT 運ばず」の節・DR3 (移動に生きた対話の持ち越しは要らない)・原則の「席の続きは運ぶものでなく測り直して入れ直すもの」の 3 つを置き換え (本 ADR の原則「運ぶのは会話 id 1 語・記録は運ばない」が代わる)、 他 (群・鍵・記録・移り先の 3 条件・新しい口座で新しい席を起こす・復帰は機械の注入・OPT3 の却下) は保つ。 要件 FR1038 / FR1059 (SRS v0.23) の改訂を伴い、 同じ PR で land する。
  （平易）席の起こし直し (群の移動の周の 1 周の群の手番と、 見回りが窓が shell に戻った席を起こす周) は、 その席の状態の打刻の最終行に残った会話の id を読み、 id の形 (UUID) のときは席を起こす 1 行の末尾に --resume とその id を置いて起こし、 id が無い・形が違うときは今まで通り空で起こします。 読み手は打刻の部品に 1 本で、 見回りの起こしと群の手番の起こし直しが同じ 1 本を呼びます (道は 1 本)。 器は会話の記録の file を読まず、 複写せず、 記録の置き場が口座を跨いで共有かを判じません (machine 固有の値で分岐しない)。 記録が新しい口座から見えるかは claude が起動のときに決め、 見えなければ席は立たず、 器は今までと同じ起動の結果の語で止まります。 続きを拾う道は機械の復帰 (台帳の行・git の現在地・圧縮の直前の 1 枠から席の指示文を組み、 session の開始で出す) の 1 本のままで、 --resume は claude が会話を開く口であって器の道ではありません。 運ぶ値は打刻の字面だけで、 画面の文字や記録の置き場の走査からは取りません。 席の登録 row の起動の雛形には --resume を載せず (雛形は口座と repo の形だけ)、 値は起こすときに末尾に足します。 人が使う短い形 (-c / -r)・退避の合図・群の移動の判定と記録・信じた印・席の指示文の生成は変えません。 前の決定 (ADR-1049) のうち「会話の記録は運ばない」の節・「持ち越しは要らない」のものさし・「続きは測り直して入れ直すもの」の原則の 3 つを置き換え、 他 (群・鍵・記録・移り先の決め方・新しい口座で新しい席を起こす・続きは機械の復帰) は保ちます。 要件書の FR1038 / FR1059 (版 0.23) の改訂を伴い、 同じ PR で land します。
  （理由）持ち主の決定は、 群の移動の後は会話を resume する、 会話を reset する意味が無い、 という方針の受諾でした。 2026-09-25 の実測で、 群の移動と再起動の後の起こし直しがどの席でもまっさらな session を立て、 持ち主が席ごとに前の会話を探して手で開き直したことが、 前の決定 (ADR-1049) の「運ばない」が完全自律の方針 (ADR-1066) の下では人の手番を残す証拠です。 打刻の id を --resume で運ぶ形にしたのは、 席の状態の打刻に既に会話の id が残っていて、 席を起こす入力が末尾に足す語を既に持ち、 人が使う短い形がそれで同じ口を使っているからで、 足すのは id の読み手 1 本と末尾の 1 語に閉じます。 記録の file を複写する案を退けたのは、 前の決定の 3 つの理由 (器が記録を読む・置き場が共有かで分岐する・道が 2 本になる) がそのまま当たるからで、 選んだ案にはどれも当たりません: 器は id を渡すだけで記録を読まず、 共有かを判じず、 続きを拾う道は機械の復帰のままです。 --continue に任せる案を退けたのは、 最新の会話が起こす席のものとは限らず、 打刻に在る実測の id より弱い出所に頼るからです。 運ばない案を退けたのは、 実測と決定がそれを否定したからです。 記録が新しい口座から見えない machine で、 claude が断り打刻が進まず人が起こすまで席が立たないことは、 器が事前に判じない (判じれば machine の設定で分岐する) 代償として引き受け (空で起こし直す逃げ道はこの記録では足しません)、 前の口座の会話の量を持ち込むこと・要件書の改訂を伴うこと・id の形でない打刻は運ばないことも代償として引き受けます。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1038（rationale）: FR1038 は群の移動の起こし直しを「新しい口座で席を起こし直し (対話の記録は運ばない・ADR-1049)」と書いていた。 本 ADR はその節を「起こし直しは席の起動 (FR1059) で、 打刻の最終行の会話 id を --resume で運んで直前の会話の続きから始め、 対話の記録の file は複写しない」に改める根拠を与える (裁定 2026-09-25T03:58Z・ADR-1049 の理由 3 つがどれも当たらない)。
  FR1059（rationale）: FR1059 は席の起動が起動行を導出し登録 row を先に書くことを求めるが、 起こし直しの周に何を運ぶかは書いていなかった。 本 ADR は「起こし直しの周は打刻の最終行の会話 id を起動行の末尾に --resume で運ぶ (会話 id の形でない周は運ばない・記録の file は複写しない)」を足す根拠を与える。
  FR1027（claim）: FR1027 (v0.23) は管理 tick が窓が shell に戻った席を席の起動 (FR1059) で起こし直すと書く。 本 ADR はその起こしが運ぶ 1 語 (打刻の sid) を決め、 tick の梯子・合図・口座の門は変えない。
  FR1040（claim）: FR1040 は席の登録 row が起動の雛形を持つと書く。 本 ADR は雛形に --resume を載せず、 値は起動の周に carry で足すと決めるので、 row の形は変わらない。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録は前の決定 1 つ (ADR-1049) を、 「会話の記録は運ばない」の節と「持ち越しは要らない」のものさしと「続きは測り直して入れ直すもの」の原則の 3 つに限って部分的に置き換えます (記録の file を複写する案の却下はそのまま保ちます)。 会話の記録の file を運ばない (複写しない・読まない) 点では前の決定と同じで、 運ぶのは打刻に残った会話の id 1 語です。 前の決定の 3 つの理由 (置き場の共有を器の前提にしない・続きを拾う道は 1 本・器は記録を読まない) はこの記録でも保たれます。 保つのは、 口座を持つ単位は群・群の宣言は machine の面・群のいま使う口座は machine の根の記録・移り先の決め方・新しい口座で新しい席を起こす・続きは機械の復帰・候補が無ければ移らない、 の全部です。 きっかけと判定の決定 (ADR-1055・ADR-1066)・見回りの決定 (ADR-1058)・信じた印の決定 (ADR-1065)・席は自分を起こし直さない (ADR-1045) は変えません。 この記録は受け入れ済み (accepted) で、 要件書の改訂 (版 0.23) と同じ PR で発効します。 原則は「起こし直しが運ぶのは会話の id 1 語で、 記録そのものは運ばない。 器は記録を読まず、 見えるかは開く側に任せる。」です。
  改訂状態: current
  置き換える ADR: ADR-1049
  置き換えられた: なし (現行)
  部分 supersede で、 置き換えるのは ADR-1049 の 3 つ — 決定の「対話の記録 SHALL NOT 運ばず」の節・DR3 (移動に生きた対話の持ち越しは要らない)・原則の「席の続きは運ぶものでなく測り直して入れ直すもの」 — で、 OPT3 (記録の file を複写して持ち越す) の却下はそのまま保つ。 本 ADR は対話の記録の file を運ばない (複写しない・読まない) 点では ADR-1049 と同じで、 運ぶのは打刻に残った会話 id 1 語である。 ADR-1049 の理由 3 つ (置き場の共有を器の前提にしない・復帰の道は 1 本・器は記録を読まない) は本 ADR でも保たれる。 保つのは、 口座を持つ単位は project の群・群の宣言は host の面・群の今の口座は host の根の記録・移り先の 3 条件・新しい口座で新しい席を起こす・復帰は機械の注入 (機械の復帰) に任せる・候補が無い周は移らない、 の全部。 ADR-1055 / ADR-1066 (契機と判定)・ADR-1058 (tick)・ADR-1065 (trust の印)・ADR-1045 §2 (2) (席は自分を起こし直さない) は不変。 発効は本 ADR が accepted になり FR1038 / FR1059 の改訂 (v0.23) が land した時点で、 同じ PR で land する。
  照会終端 — PRIN-CARRY-THE-ID-NOT-THE-RECORD
  起こし直しが運ぶのは会話の id 1 語で、 記録そのものは運ばない。 器は記録を読まず、 見えるかは開く側に任せる。
  本 ADR が記録の file を複写する案・--continue に任せる案・運ばない案を退け、 打刻の sid を --resume で渡す形にしたのはこの原則に行き着く (これ以上は遡らない照会終端)。
options:
  - id: "OPT1"
    name: "起こし直しは打刻の最終行の会話 id を --resume で運ぶ (記録の file は複写しない・復帰は機械の復帰のまま)"
    text: |
      管理 tick の起こしと dispatch の群の段の起こし直しが、 その席の状態の打刻の最終行の sid を読み、 会話 id の形 (UUID) なら起動行の末尾に --resume <sid> を置いて起こす。 sid が無い・形が違う周は今まで通り空で起こす。 読み手は state.rs の 1 本で、 tick と群の段が同じ 1 本を呼ぶ。 器は対話の記録の file を読まず複写せず、 記録が新しい口座から見えるかは claude が起動の周に決める。 機械の復帰 (席の指示文) は今まで通り session の開始で出る。 決め手は分析 (裁定を、 器に記録の読み手を足さず 1 語で満たす)。
      （平易）見回り (管理 tick) の起こしと 1 周の群の手番の起こし直しが、 その席の状態の打刻の最終行に残った会話の id を読み、 id の形 (UUID) なら席を起こす 1 行の末尾に --resume とその id を置いて起こす案です。 id が無い・形が違うときは今まで通り空で起こします。 読み手は打刻の部品に 1 本で、 見回りと群の手番が同じ 1 本を呼びます。 器は会話の記録の file を読まず複写せず、 記録が新しい口座から見えるかは claude が起動のときに決めます。 続きを拾う道 (機械の復帰・席の指示文) は今まで通り session の開始で出ます。 移動と再起動の後に会話が続き、 器は machine の設定で分岐せず、 道は 1 本のまま、 運ぶ値は実測の記録の字面だけ、 人が使う短い形と同じ末尾の 1 語で入力の形も変えません。 代わりに、 記録の置き場が口座を跨いで見えない machine では claude が起動を断り、 打刻が進まないので人が起こすまで席が立たないこと (空で起こし直す逃げ道は足しません)、 要件書の改訂を伴うこと、 前の口座で作った会話の量を新しい口座に持ち込むことを引き受けます。 決め手は分析で、 持ち主の決定を、 器に記録の読み手を足さず 1 語で満たす案でした。
      利点: 移動と再起動の後に会話が続き、 人が会話を探して resume を撃つ手番が消える (DR1)
      利点: 器は記録の置き場が共有かを判じず、 記録を読まず、 複写しない。 見えない周は claude が断り、 器は今の起動の結果の語で止まる (DR2)
      利点: 復帰の道は機械の復帰の 1 本のまま。 --resume は claude が会話を開く口で、 器の復帰の経路に 2 本目を足さない (DR3)
      利点: 運ぶ値は打刻 (hook が残した実測の記録) の字面だけで、 形が違う周は運ばない (DR4)
      利点: 席の短い形 -c / -r と同じ carry の 1 語で、 起動の入力の形を変えない (C17)
      欠点: 対話の記録の置き場が口座を跨いで見えない host では、 --resume 付きの起動を claude が断り、 打刻が進まないので次の周も同じ id で断られ、 人が起こすまで席が立たない (器は記録を読まないので事前に判じない・起動の結果の語は今の launch-unconfirmed / input-unknown のまま・空で起こし直す枝は足さない)
      欠点: 要件 FR1038 / FR1059 の改訂を伴う
      欠点: 前の会話をそのまま続けるので、 前の口座で作った文脈の量 (context の消費) を新しい口座に持ち込む
    verdict: adopted
    reason: "決め手は分析 (裁定を、 器に記録の読み手を足さず 1 語で満たす)。"
  - id: "OPT2"
    name: "運ばない (ADR-1049 のまま)"
    text: |
      起こし直しは今まで通りまっさらな session を立て、 復帰は機械の復帰だけに任せる。 決め手は現物 (2026-09-25 の実測と裁定)。
      （平易）起こし直しは今まで通りまっさらな session を立て、 続きは機械の復帰だけに任せる、 前の決定のままの案です。 器は id も記録も扱わず、 machine の設定に一切依らない点で勝ります。 けれども、 起こし直しのたびに会話が消え、 席が流れを組み直す手番と、 人が会話を探して開き直す手番を移動のたびに払います (2026-09-25 の実測)。 持ち主の決定 (会話を reset する意味が無い) にも反します。 決め手は現物です。
      利点: 器は id も記録も扱わず、 host の設定に一切依らない
      欠点: 起こし直しのたびに会話が消え、 席が流れを組み直す手番と、 人が会話を探して resume を撃つ手番を移動のたびに払う (2026-09-25 の実測) (DR1)
      欠点: 持ち主の裁定 (会話を reset する意味が無い) に反する (DR1)
    verdict: rejected
