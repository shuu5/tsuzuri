      利点: 打刻の sid の読み手が要らない
      欠点: 最新の会話は起こす席のものとは限らない (同じ anchor で開いた小さな session・別の席の会話に外れる)。 id を名指さない (DR4)
      欠点: 打刻に sid が在るのに使わず、 claude の走査に任せる (実測の記録より弱い出所) (DR4)
    verdict: rejected
    reason: "決め手は分析 (設計 seat-heartbeat.md §7 の却下)。"
