  - id: "OPT3"
    name: "対話の記録の file を新しい口座の置き場へ複写して起こす"
    text: |
      ADR-1049 OPT3 の形。 器が前の口座の projects dir から記録の file を新しい口座の置き場へ複写し、 起動行を再現する。 決め手は分析 (ADR-1049 の理由 3 つがそのまま当たる)。
      （平易）器が前の口座の置き場から会話の記録の file を新しい口座の置き場へ複写し、 起動の 1 行を再現する案です (前の決定の却下案と同じ形)。 置き場が共有でない machine でも会話が続く点で勝ります。 けれども、 器が会話の記録を読み書きする口を持つことになり、 記録の形 (claude の内部の形式) に依存します。 置き場が共有の machine では複写が二重になり、 器が「共有か」を判じて分岐することになります。 続きを拾う道も 2 本 (複写した記録と機械の復帰) になります。 決め手は分析です。
      利点: 置き場が共有でない host でも会話が続く
      欠点: 器が対話の記録を読み書きする口を持つことになり、 記録の形 (claude の内部形式) に依存する (DR2)
      欠点: 置き場が共有の host では複写が二重になり、 器が「共有か」を判じて分岐する (N3) (DR2)
      欠点: 復帰の道が 2 本になる (複写した記録と機械の復帰) (DR3)
    verdict: rejected
    reason: "決め手は分析 (ADR-1049 の理由 3 つがそのまま当たる)。"
  - id: "OPT4"
