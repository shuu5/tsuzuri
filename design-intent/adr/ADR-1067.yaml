  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「席」は人と AI が話す 1 つの session、 「口座」は席が使う Claude Code の login 単位、 「群」は同じ口座を共有する project のかたまり、 「起こし直し」は古い席を終えて同じ窓に席を立て直すことです。 前の決定 (ADR-1049) は、 群ごと別の口座へ移るときは新しい口座で新しい席を起こし、 それまでの会話 (対話の記録) は運ばず、 続きは器が台帳と git から組み直す (機械の復帰) と決めました。 会話を持ち越す案は、 記録の置き場が口座を跨いで共有かどうかは machine の設定なので器の前提にできない・続きを拾う道が 2 本になる・器が会話の記録を読むことになる、 の 3 つで退けられました。 2026-09-25 の実測では、 群の移動と再起動の後の起こし直しは毎回まっさらな session を立て、 持ち主が席ごとに前の会話を探して手で開き直し、 「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」と裁定しました。 この記録は、 起こし直しが運ぶものを「その席の状態の打刻 (席の hook が残す 1 行) に残った会話の id 1 つ」に限り、 席を起こす 1 行の末尾に --resume で渡すと決めます。 会話の記録の file は複写せず、 器は記録を読まず、 記録が新しい口座から見えるかは開く側 (claude) に任せ、 続きを拾う道は機械の復帰の 1 本のままです。 前の決定の 3 つの理由のうち、 「器が記録を読む」と「道が 2 本になる」は当たらず、 「置き場の共有を前提にする」は器が判じない形 (見えなければ開く側が断る) で避けます。 前の決定のうち「運ばない」の節と、 「持ち越しは要らない」のものさしと、 「続きは測り直して入れ直すもの」の原則の 3 つが、 この記録に置き換わります。 要件書の FR1038 / FR1059 (版 0.23) の改訂を伴い、 同じ PR で land します。
