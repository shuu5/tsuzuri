# 判断の記録 ADR-37 — 便の出来を比べる実験場（持ち主の決め 2026-10-03・記帳先 = tsuzuri の台帳の memo t3-hub.74.54 の notes と問い t3-hub.74.54.3 の notes）
# 起草は係 w108a（2026-10-04）。材料は drafts/w107a/w（design.md・cost.tsv・gaps.md・tasks.tsv・notes.md）と頁 s2-scope-20261004 の第 2 版の実験場の節。承認の欄は席が埋めた。
id: ADR-37
title: 便の出来は、本番の記録の日ごとの数えを常に回し、審査だけの再演・凍った写しでの 8 本の撃ち比べ・検査だけの再演を、替える行の前後にだけ消える残りの口座で撃って比べる
status: accepted
date: 2026-10-03
context: |
  持ち主の求めは memo（t3-hub.74.54）の notes に在り（2026-10-03）、器 scribe2 の統合と整理で便の精度・速さ・費用を犠牲にしないことと、tsuzuri を実行して比べる実験場を置くこと。統合の評価基準は ADR-36 に置き、この記録は比べる場の形を決める。
  本番の記録だけでは仕事の難しさが毎回違い、器・規則・整理の前と後を公平に比べられない。1 回目の着地の率は本番で 40 便を見て 20 点の差しか見えない。本番の gate の不合格と判定の決まらない物（INCONCLUSIVE）は 420 判定中 40（9.5%）で、10 点の差を言うには版ごとに約 200 便が要る。
  雑音（係 w107a の数え）。同じ契約の撃ち直し 6 組の、runner の token の対数の標準偏差の中央は 0.18（保守に 0.25）で、決めた 8 本を 2 回ずつ撃つ対の比べの 95% の幅は ±17% になる。
  器の隔ての手（器の code を読んだだけ・撃っていない）。置き場（state dir）は引数で別に持て、台帳は写しの中で別の台帳（db）として初めから作れ、着地の送り先は手元の空の repo（bare）と手元の CI の読みの命令にでき、器の binary は絶対の path と環境変数（SCRIBE2_BIN）で替えられ、model と effort は規則の file の引数（--rules）で替えられる。足りないのは、便ごとに「どの版で撃ったか」と「どれだけ書いたか」の記録と、口座の取り合いの見え方である。漏れの穴が 2 つ在る。写しの送り先（origin）が本番の repo の path を指すことと、追跡される台帳の設定の file（.beads/config.yaml）の同期の先（sync.remote）が非公開の台帳の置き場を名指すことである。
  費用の見込み（係 w107a の cost.tsv）。冷えた便 1 本の書き込みは 5.4 ギガバイト（GB）で、32 便では 173 GB。並びの木を使い回す 2 便目は 0.53〜2.92 GB。8 本を 2 版 2 回ずつ撃つ 1 周の token は約 9,500 万（本番の便の約 1 日分）・壁は 3.5〜4 時間。審査だけの再演は 1 周 160 回の審査役で約 1,900 万 token。
  問い（t3-hub.74.54.3）は案 A に裁定された（裁定 id は承認の欄）。
decision: |
  (1) 4 つの形。比べる場は次の 4 つの形の組み合わせとする。
  形 A（本番の数え）。常に回す。費用は 0。本番の便の記録を日に 1 度、便の種（差の file・core・面・境界・folio2・歯だけ・横断・器）と大きさの層ごとに数える（便と着地の数・1 回目の着地・走りあたりと着地あたりの token・壁・gate の秒・審査の不合格と INCONCLUSIVE・撃ち直し・main の赤・gate のメモリ・口座の待ち）。数えは ADR-36 の測りの口 1 の群 g の半分で、別の口を置かない。
  形 E（審査だけの再演）。審査役・model・審査の指示を替える前後に撃つ。本番の便の dir の契約と、着地か gate の時の木を材料に、過去に判定の付いた仕事（不合格 34 件・判定の決まらなかった 6 件・通った見本）を審査だけ撃ち直し、判定がぶれないか・見落とさないかを見る。
  形 B（凍った写しでの撃ち比べ）。器の便の流れ（runner・審査・gate・追随・着地）か組みを替える大きな行の前後だけに撃つ。tsuzuri の凍った写しで決めた 8 本の仕事を、2 つの版で 2 回ずつ撃つ（1 周 32 便・並びは 4 本まで）。言えるのは費用と速さの約 2 割の差と大きな精度の悪化までで、正しさの小さな差は形 A と E で見る。
  形 G（検査だけの再演）。組み立ての形だけを替える行の前後に撃つ。言葉の機械（LLM）を使わず、決めた木で検査を撃ち直し、時間・書き込み・結果を比べる。
  (2) 上限。形 E は 1 周で token 2,000 万以下と記憶の装置（SSD）への書き 2 ギガバイト（GB）以下。形 B は 1 周で token 1 億以下と SSD 120 GB 以下で、週に 1 周まで（壁は約 4 時間の見込み）。形 G は token 0 と SSD 60 GB 以下。周の途中で上限に届く見込みになったら、その周を止めて記帳する。
  (3) 口座。実験場の便に回す口座は、7 日の窓の戻り（reset）が 24 時間以内に来て、残りが 40% 以上の口座だけとし、その口座の「使わなければ消える残り」だけを使う。足りない週は撃たずに待つ。本番の便の枠を減らさない。撃つ前に席が口座の使用量を測り直して選ぶ。
  (4) 形 B の 8 本。種ごとに 1 本ずつ、過去に着地した行から選ぶ（着地した commit を正解として照らせる）。器（v-join-prep）・差の file（v-skip）・歯だけ（k-tz-parity）・core（r4-core-src）・folio2（r4-args-mark）・面（g-popup-app）・境界（k-tz-self）・横断（k-lint-rest）。予備は 3 本（v-retire・g-help-sweep・t-ci-shard）。仕事の組を替える時は記帳する。形 B の軽い形（試す版だけを 2 回撃ち、基は前の周の分布）は、前の周から器の版だけが替わる時に使ってよい。
  (5) 隔ての手。形 B と E と G は次の手で本番から隔てる。
  写しは起草の置き場（drafts）の下に周ごとに 1 つ作り、仕事ごとに base の commit から枝を切る。
  各 base の上に「実験の宣言」の commit を 1 つ載せる。器への宣言（.vessel.toml）を今の main の字に揃えて、送り先（remote）を写しの横の手元の空の repo（bare）に、CI の読みの命令（ci-cmd）を手元の script にする。台帳の設定の file（.beads/config.yaml）の同期の先（sync.remote）を外す（漏れの穴 2）。
  写しの送り先（origin）を外す（漏れの穴 1）。
  置き場（state dir）は本番の置き場と同じ親の下の別の dir にし（host の受付の札を本番と共有する）、実験の host の宣言は口座・plugin・起動の引数だけを書き、時計の仕掛け（tick）・口座の群・席の登録を書かない。写しの台帳は写しの中で初めから作り（接頭辞 xp）、便の bead の受け入れの欄（acceptance）に設計の pointer を書く。受付の断りは撃つ前に受付の下見（preflight）で見る。
  試す版は、列の起こし（dispatch）を絶対の path で撃ち、runner と審査役の命令の字を絶対の path にし、器の binary の環境変数（SCRIBE2_BIN）を合わせて選ぶ。model と effort は規則の file の引数（--rules）で選ぶ。
  撃つ前に、写しに送り先（origin）が無いこと・同期の先が無いこと・宣言の送り先が手元の path であることを確かめ、1 つでも違えば撃たない。
  終わったら、実験の置き場の event と便の dir から形 A と同じ式で数え、着地の正解と照らす。写しと置き場は退役の置き場へ移す（mv）。
  (6) 最初の比べ。入れ替えの門（v-swap）・並びの木（v-lane）・並びの上限（v-lane-cap）の 3 行が着地して PATH の器を入れ替えた後、tsuzuri の宣言で組みの使い回し（build-lanes）を名乗る前に、形 B を「使い回しなし」と「使い回しあり」の 2 版で撃つ。これで群 g の実験場の基（ADR-36 の決定 (4) の (エ) の幅の材料）と、使い回しの効き目を同時に取る。結果は ADR-35 の退きの条件 (1)（偽の緑）と (2)（書き込みの減り）の材料にもなる（その 2 つの判じ自体は本番の記録で行う）。書き込みは約 110 GB の見込み（なし 16 便で約 86 GB・あり 16 便で約 24 GB）。それまでは形 A だけを席が節目に撃つ。
  (7) 器に足す行。必須は 2 行。便ごとの版の記録（xp-provenance・大きさ S）は、便ごとに器の binary の組みの commit・claude の CLI の版・効いた model と effort（runner と審査役の各々）を event に記す。便ごとの書きの記録（xp-io-bytes・大きさ S〜M）は、便の囲いごとの正味の書きの byte を、囲いの使用量の行と便の費用の event に足す。測れない周は 0 と書かず「測れていない」と書く。2 行は 3 行（v-swap・v-lane・v-lane-cap）の後に流す。条件つきの 3 行は条件が来た時に起こす。口座の選びに host の根の走りを数える行（xp-host-live）は、実験と本番が同じ口座の窓を取り合う形で撃つ時に要り（実験だけの口座を回す時は要らない）、決定の口座の回し方（本番と同じ口座の消える残り）はこの形なので、最初の B の前に起こす。審査の model と effort を分ける規則の行（xp-lens-split）は、契約の審査と gate の審査、または runner と審査役の片方だけを替えて比べる時。実験の置き場の印で手元でない送り先と時計の仕掛けと群を断る行（xp-mark）は、実験場を席の道具でなく常設にする時。
  (8) 撃たない形。小さい合成の project で撃つ形（案 c）は、器の e2e の偽物の歯と測る物が重なり、tsuzuri の重い所を代表しないので今は撃たない。合流の後の「試験用の project」の要件（memo（t3-hub.69））の時に考え直す。本番の便の影の撃ち（案 d）は、費用が週に形 B の 1.3 周分で、仕事の組が固まらないので撃たない。
  (9) いつ撃つか。毎行は撃たない。
  ・最初の基の取りは決定 (6) の形 B。
  ・入れ替えの門の行（v-swap）は便の振る舞いを替えないので撃たない（形 A で見張る）。
  ・器の便の流れ（runner の指示・審査・gate・追随）を替える行は、入れ替えの前に試す版で形 B（審査だけなら形 E）を撃ち、入れ替えの後に形 A で 1 週を見る。旗の行（v-flag-guard・v-flag-drop）は見張りの口を替えるので、入れ替えの後に形 B を 1 周撃つ。
  ・組みを使い回す行（ADR-35）は決定 (6) で撃つ。組み直しの合図を絞る行（v-buildrs）は前後に形 G を撃つ。
  ・器を本体に入れる行（v-join）は前後に形 G を撃つ。
  ・着地済みの省きの行（v-skip・v-ci-split・v-daily）は、次の形 G の周の基に入れる。
  ・歯の束ねの残りの行は、全部の着地の後に形 G を 1 回撃つ。組みの虫取りの情報と歯の時間切れの行（debuginfo・r-dbg・r-nextest-timeout）は、着地の後に形 G を 1 回撃つ。
  ・規則の model と effort を替える時は、替える前に形 E を撃つ（runner の model なら形 B も）。
  ・claude の CLI の版が上がった週は形 A で見張り、揺れたら形 E を撃つ。
  ・合流の後の試験用の project の要件の案を起こす時に、案 c を考え直す。
  (10) 記帳。各周の形・版・仕事の組・数え・費用・使った口座の数は、memo（t3-hub.74.54）か後継の memo の notes に記帳し、ADR-36 の基準（1 回目の着地の実験場の分・受付から着地・便 1 本の書き込み・計算の秒・審査の一致率）の値として使う。
options:
  - id: a
    name: 本番の数えを常に回し、審査だけ・8 本の撃ち比べ・検査だけの再演を替える行の前後に撃つ
    text: 決定 (1) から (10)。
    verdict: adopted
    reason: 費用 0 の形 A で大きな変化を見張り、細かい比べだけを替える行の前後に置くので、費用が本番の約 1 日分の token と 1 日の書き込みの予算の 8% に収まる。同じ仕事を撃ち比べるので、費用と速さの 2 割の差と大きな精度の悪化を言える。
  - id: b
    name: 実験場を置かず、本番の記録を数えるだけ
    text: 形 A だけを回す。
    verdict: rejected
    reason: 統合と整理が便を遅く・高く・不正確にしても、本番で何十本も流した後でしか気付けない。
  - id: c
    name: 小さい合成の project で撃つ
    text: 実験のための小さい project を作り、決めた仕事を撃つ。
    verdict: rejected
    reason: 器の e2e の偽物の歯と測る物が重なり、tsuzuri の重い所（組み・歯・審査の材料の大きさ）を代表しない。合流の後の試験用の project の要件の時に考え直す。
  - id: d
    name: 本番の便の影を撃つ
    text: 本番の便と同じ仕事を、試す版でも並べて撃つ。
    verdict: rejected
    reason: 費用が週に形 B の 1.3 周分で、仕事の組が日ごとに替わり固まらない。
basis: [ADR-36, ADR-35, ADR-33, ADR-31, R-40, R-3]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo（t3-hub.74.54）か後継の memo の notes に 1 件ごとに記帳する（日付・形・材料・当たった条件）。問う相手は持ち主。
    (1) 形 B が 2 周続けて口座の窓の不足で撃てなければ、口座の決め（決定 (3)）か形を問い直す。
    (2) 形 B か E の撃ちが本番の便を待たせた（実験の周と重なる時間に、本番の便の口座の待ちが 30 分を越えた）ら、1 回でも撃ちを止めて問う。
    (3) 漏れ（本番の送り先への送り・本番の台帳への書き・実験による群の移しか時計の仕掛けの作り）が 1 回でも起きたら、実験場の撃ちを全部止めて記帳し、問う。
    (4) 周が上限（決定 (2)）を越えたら、その周を止めて上限を問い直す。
plain: |
  作業の流れ（便）が正しく・早く・安く片付いているかを、公平に比べる場（実験場）を決める記録です（推奨の案）。
  ふだんは本番の記録を毎日数えるだけで、費用はかかりません。
  審査役や model を替える前後は、過去の仕事の審査だけをやり直します。器の流れや組み立てを替える大きな作業の前後だけは、tsuzuri の凍った写しで決めた 8 本の仕事を、2 つの版で 2 回ずつ撃ち比べます。組み立ての形だけを替える作業は、検査だけを撃ち直します。
  使う口座は、近く戻る口座の「使わなければ消える残り」だけで、本番の作業の枠は減らしません。足りない週は撃ちません。
  写しが本番の repo や非公開の台帳に触れないように、送り先と台帳の設定を外してから撃ちます。
  最初の比べは、組み立ての使い回しを有効にする前に「なし／あり」で撃ちます。
approval:
  who: 持ち主
  date: 2026-10-03
  ruling: t3-hub.74.54.3（裁定 id = t3-hub.74.54.3:20261003T2312Z-1・実験場の形は案 A・席とのチャット・notes に逐語）
  verbatim: "推奨で進めて良い"
  surface: R-8
consequences:
  - 器に足す 2 行（便ごとの版の記録と書きの記録）は係（w109a）が試作し、3 行（v-swap・v-lane・v-lane-cap）の後に席が置く。
  - 最初の比べまでは、形 A だけを席が節目に撃つ。数えの式は係の数えの script（runs.py）。
  - 口座の窓の不足で撃てない週は、統合の行を止めずに形 A の見張りだけで進む（実験場の門は「まだ分からない」のまま）。
  - 条件つきの行のうち口座の選びの行（xp-host-live）は、決定 (3) の口座の回し方が本番と同じ口座を使う形なので、決定 (7) のとおり最初の形 B の前に起こす。問い（t3-hub.74.54.3）の技術の行は、この行の条件の向きを逆に書いていた（席の誤り・係の表 gaps.md の読みが正しい）。
note: 起草 w108a（2026-10-04）。数は drafts/w107a/w/cost.tsv・notes.md・runs.tsv から。持ち主の逐語は台帳の notes に在り、ここには書かない。
