  器の案の章の要約: 候補を 8 つ並べます。 置き場と写し方を約束にし写しに印の file を置く案 (選んだ案)、 何も足さず消費側に推させる今のままの案、 tmux の pane の変数が無いことを約束にする案、 plugin の置き場の path で見分ける案、 runner に消費側の plugin を積まない案、 席の側で環境変数を名乗る案、 runner の AI に環境変数を名乗らせる案、 印を作業場所の git の私有の dir に置く案です。
  器の専門語の説明: 本文に出てくる専門語 9 個を、 やさしい言葉で説明します。
  ・席の起動行（seat launch line）: 器が席 (対話する AI の session) を立てるときに tmux の窓へ差し込む 1 行。 環境変数と claude と plugin の枠を並べ、 pure な 1 関数が組む (ADR-1026)。 1 つ目の枠は anchor の下の生成 dir、 2 つ目以降は host の面の宣言。
  ・1 つ目の枠（first plugin slot）: 席の起動行で 1 つ目に積む plugin の dir。 anchor の下の生成 dir (名は core の定数 1 つ・今は plugin) を指す (ADR-1038)。 器の repo では器の plugin、 消費側ではその project の plugin で、 本 ADR で跨版の約束になる。
  ・消費側（consumer project）: 本 repo 以外で、 器の binary を入れて自分の契約で便を回す repo (ADR-1054)。 自分の plugin を anchor の下の plugin/ に置くと席に積まれ、 その名札と hook の 2 dir は runner にも写って積まれる。
  ・anchor（anchor）: 席の登録 row が持つ repo の checkout の path。 席の起動行はここへ cd し、 1 つ目の枠はここの下の生成 dir を指す。
  ・runner（runner）: 契約 1 本を worktree で実装する headless の Claude process (SRS FR1004 / FR1005)。 席ではなく使い捨て。 便ごとの plugin の写しから器の plugin と、 名の違う消費側の plugin を積む。
  ・lens（lens）: diff を読んで判定を返す headless の Claude process (SRS FR1009)。 plugin を 1 つも積まない。
  ・hook（hook）: Claude Code が道具の呼び出しや turn の終わりなどの節目に撃つ command。 plugin の hooks.json が宣言し、 読み込んだ plugin の置き場を受け取る。 器の hook と消費側の hook が同じ session に並んで積まれうる。
  ・印の file（runner mark）: 器が runner の plugin の写しの root に書く、 中身の空の file 1 つ。 名は NAME に -runner を付けた語。 消費側の hook は自分の plugin の置き場にこれが在るかで runner の中かを判じる。 器は書くだけで読まない。
  ・跨版の面（cross-version surface）: 器の版が上がっても外から読まれる形を変えない約束。 変えるときは新しい ADR を要し、 歯が pin する。 本 ADR では 1 つ目の枠・runner の写し・印の file の名と置き場と空の中身の 3 点。
