# 判断の記録 ADR-70 — 器の起草の置き場の掃除は、置き場の写しの下で印の file（CACHEDIR.TAG）を持つ作り直せる組みの置き場も、書きが古ければ消す
# 判断の記録 ADR-1096（器の ADR-0096 の写し）の決定のうち、消す dir の範囲（閉じた 8 つの名・git の木だけ）と「.git を持たない写しは消さずに数える」の字を部分で置き換える。ADR-1096 の本文は替えない（取り込みの決め・前例 ADR-69 の頭の注）。
# 起草は設計の席（2026-10-06）。材料は memo t3-hub.77.36 の本文と notes、係 w293a の notes（今の掃除の code と ADR-1096 の字の照らし・試作と歯と噛み）、席の一覧（drafts の下の印の dir 34 本・du）。
id: ADR-70
title: 器の起草の置き場の掃除は、置き場の直下の写し（git の木と .git を持たない写しの両方）の下で、直下に署名の合う印の file（CACHEDIR.TAG）を持ち追跡される file を持たない dir も、書きが rules 行の時間無ければ消す（判断の記録 ADR-1096 の消す範囲の部分の置き換え）
status: accepted
date: 2026-10-06
context: |
  器の起草の置き場の掃除（判断の記録 ADR-1096・器の設計 dispatcher.md §33）は、置き場の直下の子のうち .git を持つ木だけを測り、名が閉じた 8 つの列（target ほか）ちょうどの dir を、追跡される file を持たず書きが 6 時間（rules 行 seat.drafts_stale_h）無い時に消す。.git を持たない子は数えるだけで中を見ない（V・係 w293a が器の sweep.rs を読んだ）。
  起草の係の dir（drafts/w<n>/）は .git を持たず、係の組みの置き場（drafts/w<n>/target）はその下に在るので、掃除の外にある。古い試しの木の中の組みの置き場は名が target に字を足した別の名で、名の列に当たらず残る。2026-10-06 に / が 2 度目の満杯になり、持ち主の手で 約 400 GB を消した。その後の 1 時間あまりで空きは 329 GB から 223 GB に減り、置き場の下の印の dir は 34 本・約 186 GB（.git を持たない子の下 約 104 GB・木の中で名が列に無い物 約 85 GB）だった（V・席の du と係 w293a の照らし・木の中の物は追跡 file 0）。
  cargo の組みの置き場は直下に印の file（CACHEDIR.TAG・頭の 43 byte が署名 Signature: 8a477f597d28d172789f06886806bc55）を持つ。印は組みの道具が「作り直せる cache」と名乗る慣行の印で、言語の名の列より狭く確かである（D）。
  ADR-1096 の承認は、持ち主の裁定 user 2026-09-29T11:43Z（器の台帳 s2-07l.737.14 の notes・器の席の記帳は「掃除を席の起草の置き場へ広げ、書きが 6 時間無い中間 file を消す」推奨の是認）を、閉じた列の名の dir を git の木から消す狭めた種類への常設の承認と読んだ。同じ裁定は、写しそのものと退役の時の即時の削除を承認していない（ADR-1096 の承認の欄）。
decision: |
  (1) 消す範囲を足す。器の起草の置き場の掃除は、ADR-1096 の木の閉じた 8 つの名の dir に加えて、置き場の直下の子（.git を持つ木と、.git を持たない写しの両方）の下で、直下に署名の合う印の file（記号の link でない file・頭の 43 byte が署名の字）を持つ dir のうち、追跡される file を持たず（木の中は今と同じ追跡の一覧の 1 回で判じる・.git を持たない写しは追跡が無い）、自身と下の全 entry の書きの時刻（mtime）の最新が rules 行 seat.drafts_stale_h の線より前のものを消す。線と行を読めない周の振る舞いは ADR-1096 のまま。
  (2) 消さない物。写しそのもの・.git・追跡される file・印の無い dir・署名の違う印の dir・記号の link の先は消さず、辿らない。印を探す歩きは、印の dir の下と、.git を持つ入れ子の dir の下へ降りない（名の列の dir の掃きは ADR-1096 のまま）。便の木の掃除は替えない。
  (3) 量の線（判断の記録 ADR-1101）の候補は今のまま木の dir だけにし、この決定で足す dir を入れない（走っている係の組みの置き場を書きの線の内で消さない）。
  (4) 記録。掃除の標準エラーの 1 行は、足した範囲で 1 つ以上消した周だけ、末に消した数と消す前の大きさ（MiB に切り上げ）を足す。ほかの周の字と標準出力・event・rc は替えない。
  (5) 置き換える字。ADR-1096 の決定の「.git を持たない写し SHALL 消さずに数え」は「.git を持たない写しそのものは消さずに数え、その下の (1) の dir は消す」と読み、題の「消すのは置き場の git の木の閉じた 8 つの名の dir だけ」は「(1) の印の dir も消す」と読む。器の設計 dispatcher.md §33 の元の字は替えず、末に段を足す。
  (6) 承認の読み。裁定 user 2026-09-29T11:43Z は、席の起草の置き場の書きが 6 時間無い中間生成物（作り直せる産物）を器の掃除で消すことを是認した。この記録は、その裁定を (1) の種類 — 置き場の写しの下の、組みの道具が作り直せる cache と名乗る印の dir を、書きの線の後に消すこと — への常設の承認と読む。写しそのものと即時の削除は、今までどおり射程の外に置く。
  (7) 行。器の行（v-drafts-cache-sweep・ノート surface-wave29d）が作る。
options:
  - id: a
    name: 甲 — 写しの両方（木と .git を持たない写し）の下の古い印の dir を消す
    text: 決定 (1) から (7)。
    verdict: adopted
    reason: 係の組みの置き場と古い試しの木の中の組みの置き場（合わせて 約 186 GB）が、持ち主の手に頼らず書きの線の後に戻る。消すのは道具が作り直せると名乗った dir だけで、写しの試作と追跡 file は残る。
  - id: b
    name: 乙 — .git を持たない写しの下だけ
    text: 木の消しは 1 byte も替えない。
    verdict: rejected
    reason: 古い試しの木の中の名が列に無い組みの置き場（約 85 GB）が、掃除の外に溜まり続ける。
  - id: c
    name: 丙 — 名の列を広げる（target-* などの形）
    text: 閉じた 8 つの名に名の形を足す。
    verdict: rejected
    reason: 名は係ごとの慣行で決まり、列はいつも後追いになる。印は道具が書くので名に依らない。
  - id: d
    name: 丁 — 持ち主の手の消す script を続ける
    text: 器は替えず、席が消す script を作って持ち主が撃つ。
    verdict: rejected
    reason: 4 日で 2 度満杯になった（10-02・10-06）。席の削除は守りの hook が断るので、毎回持ち主の手が要る。
basis: [ADR-1096, ADR-1101, ADR-1081, N-1.1, A-1.1]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo（t3-hub.77.36）か後継の memo の notes に記帳する。窓の始まりは行（v-drafts-cache-sweep）の着地の commit の時刻である。問う相手は持ち主。
    (1) 足した範囲の消しが、作り直せない物（追跡されない試作の file・印を書いた道具の外の物）を 1 件でも失わせたら、範囲を (1) の前に戻すかを問い直す。
    (2) 走っている係が、消された組みの置き場の組み直しで予算か時間を越えた例が 1 件でも出たら、線の時間（seat.drafts_stale_h の値）を問い直す。
plain: |
  器は、席の試作の置き場の古い組みの産物を自動で消す掃除を持っていますが、消すのは git の写しの中の「target」などの決まった名の dir だけでした。係の作業 dir の下の組みの置き場や、名の違う置き場は掃除の外にあり、disk を 4 日で 2 度満たしました。
  この記録で、組みの道具が「作り直せる cache」と名乗る印の file を持つ dir も、6 時間書かれなければ消します。写しそのもの・追跡される file・印の無い dir は消しません。
  失うのは、6 時間止まっていた係が組みを作り直す時間（数分）だけです。
grill:
  when: 2026-10-06
  who: 起草係 w293a（AI・今の掃除の code と ADR-1096 の字を照らし、試作と歯 6 本と噛み 10 変異を撃った）
  where: 起草の置き場の w293a の notes.md の 2 節から 4 節
  summary: 失うのは、書きの線を越えて止まった係の組みの置き場の作り直しと、慣行から外れて印の dir に置かれた物（ADR-1081 と同じ種類の代償）である。印は組み立て中かの判じには使わず（ADR-1096 が退けた案と別）、消してよい物かの名の代わりに使い、組み立て中かは今と同じ書きの線で判じる。
approval:
  who: 持ち主
  date: 2026-09-29
  ruling: "s2-07l.737.14（器の台帳の id・裁定 user 2026-09-29T11:43Z・ADR-1096 の承認と同じ裁定の読みの広げ）"
  verbatim: "器の台帳 s2-07l.737.14 の notes に在る（この file に写さない）"
  surface: R-8
consequences:
  - 係の組みの置き場と、古い試しの木の中の名の違う組みの置き場が、便の終端の周ごとに書きの線の後に戻る。席が消す script を作り持ち主が撃つ手は要らなくなる。
  - 書きの線（6 時間）を越えて止まった係は、次の組みで置き場を作り直す。
  - 印の dir に慣行から外れて置かれた未追跡の物は、中身ごと失いうる。
  - 量の線（ADR-1101）は今のまま木の dir だけを数えるので、足した範囲の大きさは量の記録に数わらない。
note: 起草は設計の席。承認の欄の裁定は ADR-1096 と同じで、新しい裁定は取っていない（裁定の記帳の字が置き場の中間 file の消しを是認しているため・席の読み）。器の行（v-drafts-cache-sweep）の試作と歯と噛みと床は係 w293a（写しの下）と係 w295a（木の中の句・ADR の字の床の直し）。
