plain: |
  器（scribe2）を tsuzuri に持ち込む時の形と段取りを、あなたの 7 つの答え（全部推奨）で決めた記録です。
  器の履歴は commit の番号を保ったまま tsuzuri の scribe2/ に入れます。予行で、tsuzuri の検査も設計の検査も通りました。merge は、席が試した手順の script をあなたが端末で 1 回撃つ形です。
  ほかの project の便を止めるのは 2 回に分けて短くします。1 回目は merge を撃って送るまで、2 回目は器の歯が tsuzuri の検査に載った後の静かな時で、器の binary の出どころを替え、置き場を 1 つずつ戻します。
  器の昔の履歴に在る名前の字は書き換えずに持ち込み、走査の数が今と違えば script が止まります。器の外の部品 35 本は一覧のまま承認しました。元の器の repo は最後の commit を移り先の案内の 1 行にし、切り替えが済んだ後に読むだけにします。
  board が器の点検の口（doctor）を撃つ重さは、器に軽い読みの口を足して減らします。器のまだ承認していない判断の記録は資料のまま持ち込み、それを前提にした code を直す時に 1 本ずつ承認をもらい直します。持ち込んだ器の中で働いてしまう台帳の印は退かせ、器の AI への指示の file は tsuzuri の設定で読ませないようにします。
  まだ決めていない物（器の歯を便ごとに組む重さを省けるか、など）は帰結の欄に書きました。
  この記録はあなたの承認で発効しています。承認の記帳先は tsuzuri の台帳の問いです。
