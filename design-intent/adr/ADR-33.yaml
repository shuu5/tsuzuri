# 判断の記録 ADR-33 — 器 scribe2 の持ち込み（T）の形と段取り（持ち主の裁定 t3-hub.74.32〜t3-hub.74.38・記帳先 = tsuzuri の台帳の問いの notes）
# 判断の記録 ADR-18 の決定 (1)(2)(5)(7)、ADR-22 の決定 (7)、ADR-23 の決定 (7) が持ち込みの時に決めると残した物を決める。3 本の本文は封で凍っているので変えない。
# 起草は係 w90a（2026-10-03）。材料は起草 w81a の予行と行の割り（drafts/w81a/w/）・器の席の答え・問いの本文。承認の欄は席が埋める（下書きは欄を置かない）。
id: ADR-33
title: 器 scribe2 は番号を保つ merge で scribe2/ に持ち込み、止める窓を 2 つに分け、公開の履歴は書き換えず、依存 35 本を一覧で承認し、元の repo は移り先の 1 行と切り替えの後の凍結にし、器の提案中の記録は code を直す時に受け直す
status: accepted
date: 2026-10-03
context: |
  判断の記録 ADR-18 は合流の 3 段目の線と段取りを決め、器 scribe2 は器の束 E の実装の核の着地の後、全部の置き場（state dir）の便の列が空の時に持ち込むとした（決定 (2)）。公開の scribe2 の凍結の仕方はその時に持ち主に聞く（決定 (1)）、依存は持ち込みの時に一覧で 1 回承認を取る（決定 (5)）、別の台帳へ渡す閉じ方は持ち込みの前に決める（決定 (7)）とも書いた。判断の記録 ADR-22 の決定 (7) は器の履歴の形（番号を保つか移し替えるか）を予行で決めるとし、判断の記録 ADR-23 の決定 (7) は面の server が器の doctor を撃つ重さを器の持ち込みの段で問うとした。
  器の束 E の核は全部着地した（器の席の答え 2026-10-02）。席の起草（w81a）は、tsuzuri の main（5b1099ae）に器の main（38cbb667）を番号を保つ merge で scribe2/ に置いた写しで予行した。tsuzuri の検査（xtask の check）は rc 0（309 秒・歯 3,023 本・公開の走査の当たり 0）、床は席の固定の版（pin）の tz と木で組んだ tz の両方で違反 0。器の履歴に design-intent/anchors/ の commit は 0 で、path で履歴を読む tsuzuri の口が器の昔の commit を取り違える所も 0 だった。入れ子の器の workspace では、器の歯 3,952 本のうち 4 本が git の根の tsuzuri の宣言を器の宣言と読んで落ち、器の xtask の check の 4 つの門が根でないとして撃たれなかった。どちらも器の側で直して着地した（器の main 6f2135ef と bd94fe24）。
  tsuzuri の側の前の便も着地した。契約表の欄の写しを下の dir へ移して器への宣言に契約表と憲法の置き場の 2 行を書く便（t3-hub.74.30・持ち主の承認 t3-hub.74.29）と、tsuzuri の検査に入れ子の workspace の段を足す便（t3-hub.74.31・行 v-gate）である。
  器の席は次を答えた（2026-10-02〜03）。器の code の注の pointer が器の design-intent/decisions/ の file の名と設計文書の § の anchor を引くこと。器の code は判断の記録の状態の字を読まないこと。持ち込みの間は器の binary を入れ替えないこと。器の歯の導出は crate の dir の名で引くこと。器の台帳の閉じ方は器の code を足さずに済ませられること。
  器の main（38cbb667）の数。commit 1,630（GitHub の署名つき 1,003）・追跡 file 529 本 32.4 MB・器の錠の外の部品 35 本・状態の欄が提案中（proposed）の判断の記録 22 本（うち器の code が引く 17 本・135 か所）・公開の走査の当たりは最新の木 0・commit の本文 5 本・過去の file の版 56。
  席は持ち主に問い 7 つ（t3-hub.74.32〜t3-hub.74.38）を出し、持ち主は全部推奨の案で答えた（2026-10-03T00:57Z）。
decision: |
  (1) 器の履歴は commit の番号を保って持ち込む（ADR-22 の決定 (7) の決め・予行で 3 つの条件が満たされた・ADR-18 の決定 (3) のとおり）。merge は、1 本目の親を tsuzuri の main、2 本目の親を器の持ち込む commit（以下 T）とし、共通の祖先の無い履歴を許す指定で組み、中身は tsuzuri の木に T の木をそのまま scribe2/ の下へ読み込んだ物にする。merge の script は、親 2 本・scribe2/ の木が T の木と同じ・scribe2/ の外の差 0 を確かめ、床と公開の走査と tsuzuri の検査（入れ子の段が器の build・歯・clippy・器の xtask の check を撃つ）を通してから送る（push）。merge は便では入れず、席が予行した script を持ち主が端末で 1 回撃つ（folio2 の前例 t3-hub.67.28 の形。器の着地は親 1 つの squash で、席の端末から送ると、merge の commit の 1 本目の親との差〔器の木の全体の 32 MB〕が送りの見張りの読みの上限 8 MB を越える見込み）。〔席の決め〕
  (2) 器の design-intent/decisions/ の file の名と、器の設計文書の § の anchor は byte のまま運ぶ（器の code の注の pointer が引く・器の席の答え）。merge は器の木を byte のまま置き、後の行もこの名と anchor を替えない。器の設計文書は組み立ての材料で、tsuzuri の設計文書の検査の外に置く（ADR-18 の決定 (8)）。〔席の決め〕
  (3) 切り替えの窓を 2 つに分ける（裁定 t3-hub.74.32・案 A）。1 つ目の窓では、T の前に器の席が全部の置き場の列に止め（hold）を掛けて空にし、tsuzuri の持ち込みの便だけを流し、merge を撃って送るまでほかの project の便を止める。窓に入る前に PATH の器の binary を T の木から組んだ物にしておき（merge の後に scribe2/ から組む binary と同じ code）、窓の間は入れ替えない。ほかの置き場の止めを外す時は、席が器の席と決める（帰結の欄）。器の置き場の止めは、切り替えで器の列が tsuzuri へ移るまで外さない。2 つ目の窓では、器の歯が tsuzuri の検査と CI に載った後（入れ子の段の行 v-gate は着地済み・CI に器の門を足す行 v-ci の着地の後）の静かな時に、PATH の binary の出どころを tsuzuri の scribe2/ に替え（今の入れ替えの門で撃ち、前の世代を残す）、器の宣言の plugin の path（host.toml の 9 本）を書き換え、置き場を 1 つずつ戻して便を 1 本ずつ通す。
  (4) 器の公開の履歴に在る一覧の語（host の名・口座の名・ほかの project の名）は、履歴を書き換えずに持ち込む（裁定 t3-hub.74.33・案 A）。器の repo は既に公開で、新しく出る字ではない。merge の script は T の全履歴を tsuzuri の公開の走査と同じ規則と一覧の語で走査し、最新の木の当たりが 0 で、かつ履歴の当たりが今の数（commit の本文 5 本・過去の file の版 56）と同じ時だけ進み、違えば止まる。
  (5) 器の錠の外の部品 35 本（33 の名）を一覧のまま 1 回で承認する（裁定 t3-hub.74.34・案 A・ADR-18 の決定 (5) の器の分）。器の通常の依存は 0 で、歯だけが使う 2 本とその下である（insta・proptest）。tsuzuri の根の錠に無い名は 21（autocfg・bitflags・errno・fastrand・insta・linux-raw-sys・num-traits・ppv-lite86・proptest・rand・rand_chacha・rand_core・rand_xorshift・rustix・similar・tempfile・unarray・wasip2・wit-bindgen・zerocopy・zerocopy-derive）、版の違いを足した名と版の組で 25 で、使ってよい条件は全部、規則の行 R-2 の許しの一覧の内にある。R-2 の値は変えない。承認の範囲は器の main（38cbb667）の錠の 35 本で、T の錠に一覧の外の部品か条件の違う部品が在れば、その部品は承認の外とし、持ち込みの前に問う。監査は、入れ子の間は器の一覧での cargo deny（行 v-ci が CI に足す）、根の workspace に入れる行（v-join）の後は tsuzuri の根の監査の行（k-deny）で行う。
  (6) 器の元の repo は消さずに凍結する（裁定 t3-hub.74.35・案 A）。器の main の最後の commit を案内の file（README）の 1 行（開発は tsuzuri の scribe2/ へ移ったことと移り先）にし、その commit を T にする（持ち込んだ木と凍結した repo の木が同じになる）。T の後は器の main に commit を置かない。切り替えの 1 周（置き場ごとの便 1 本）が済んだ後に、GitHub で読むだけの保管（archive）にする。1 行の字は器の席が T を決める時に起こす。
  (7) 面の server が頁ごとに器の doctor を撃つ重さは、器に軽い読みの口を足す行で減らす（裁定 t3-hub.74.36・案 A・ADR-23 の決定 (7) の問いの答え）。行は持ち込みの後の器の行とし、器は別の process のまま撃つ（ADR-4 の決定 (2) の、道具どうしは出力の file で渡す形を保つ）。面の server が器の部品（lib）を同じ process で呼ぶ形は採らない。重さの測り直しは行を起草する時に席が撃つ。
  (8) 器の提案中（proposed）の判断の記録 22 本（器の ADR-0039・ADR-0040・ADR-0045〜0053・ADR-0056〜0058・ADR-0060〜0065・ADR-0098・ADR-0100）は、凍結した資料のまま持ち込む（裁定 t3-hub.74.37・案 A。席は問う前に、席の決めで足りる見込みと見ていた）。このうち器の code の注が引く 17 本（器の ADR-0039・ADR-0045・ADR-0046・ADR-0047・ADR-0048・ADR-0049・ADR-0050・ADR-0052・ADR-0056・ADR-0058・ADR-0060・ADR-0061・ADR-0062・ADR-0064・ADR-0065・ADR-0098・ADR-0100）、135 か所を、この記録で「器の code の前提（受け直し前）」と名指す。tsuzuri の判断の記録としては発効していない。その記録を引く器の code を書き直す便を起こす時に、席がその記録を 1 本ずつ持ち主に受け直してもらい（tsuzuri の判断の記録として承認を取り直す）、受け直すまでは前提として読むだけにする。器の code の注の id は凍結した元の記録の id のまま書き換えない（ADR-18 の決定 (5)）。code が引かない 5 本（器の ADR-0040・ADR-0051・ADR-0053・ADR-0057・ADR-0063）は資料のまま置く。
  (9) 持ち込んだ scribe2/ の中で tsuzuri の作業中に働く 2 つの file を止める（裁定 t3-hub.74.38・案 B）。台帳の置き場の印（.beads の 5 本）は退役の置き場（scribe2/retired/beads/）へ移す。AI への指示の file（scribe2/CLAUDE.md）は動かさず、tsuzuri の根の Claude Code の設定（.claude/settings.json の claudeMdExcludes）で読ませない。器の検査（器の xtask の check）が読む path は変えない。行は merge の後・切り替えの前の便 1 本（v-retire）。器の repo だけのほかの設定の file（CI の 2 本・器の宣言・器の Claude Code の設定・plugin の目録・台帳の書き口の script・toolchain・cargo の設定・nextest の設定ほか）は残し、根の workspace に入れる行（v-join）の時にまとめて見直す。
  (10) 持ち込んだ器の file を退かせる置き場は scribe2/ の下の退役の dir（scribe2/retired/）にする（folio2 の前例と同じ形・folio2/retired/）。消さない。〔席の決め〕
  (11) 器の開発の道具の部品の名（package の名・xtask）は、入れ子の間は替えない（名の衝突は根の workspace に入れる時だけ）。根に入れる前の行（v-join-prep）で、器の xtask の package の名と dir の名を同じ新しい名（scribe2-xtask）に揃え、器の cargo の設定の別名（scribe2/.cargo/config.toml の alias）を新しい名へ向ける。scribe2/ の中の字 cargo xtask（器の CI・指示の file・文書）は同じ意味のまま残る。dir の名も揃えるのは、器の歯の導出が -p の語を crate の dir の名と比べるため（器の席の答え）。ADR-18 の決定 (4) が変えない名（命令の名・trailer・state dir・plugin・環境変数）に、開発の道具の package の名は入らないと読む。〔席の決め〕
  (12) 器への宣言の入れ子の crate の根（crate-roots）に scribe2/crates/ を足すのは、(11) の名替えと根の workspace に入れる行（v-join）の後の便の行（v-roots）にする（席は器への宣言を直に書けない）。それまで器の追随の再 gate と着地の後の検出線は scribe2/ を見ないので、scribe2/ を書く便は同時に 1 本までにする（器の席の答え）。〔席の決め〕
  (13) 器の台帳の写しの規則（ADR-18 の決定 (7) の器の分）。閉じた履歴は器の台帳に読むだけで残す。開いた項は、器の席が切り替えの 1 周の後・凍結の前に整理し、器の古い repo と道具にだけ関わる memo は器の側で閉じ、器の code に残る memo だけを tsuzuri の台帳へ移す。tsuzuri の側の写しは folio2 の前例の形（題の頭に器から移した印と元の id・本文に元の id）にする。器の側は器の code を足さずに閉じる。まとめ役の memo を 1 本起こし、移す memo を「まとめた」とまとめ役の id で閉じ（移した先の id は notes に書く）、まとめ役の子の問いに ADR-18 の決定 (7) の持ち主の承認を裁定として結び、まとめ役をその裁定 id の「見送り」で閉じる。memo を「取り下げ」で閉じない（器の局面の出力が形の崩れ（close-kind-mismatch）にする）。〔席の決めと器の席の答え〕
  (14) 行の順。T の前は、契約表の欄の写しの移しと器への宣言の 2 行（着地済み）・行 v-gate（着地済み）・merge の script（席が予行し持ち主が撃つ）。T の後・切り替えの前は、除外の表に器の行を足す行（v-carry-ex）・CI に器の CI だけの門を足す行（v-ci）・(9) の行（v-retire）。切り替えの後は、器の効いているかの旗の行（v-flag-guard と v-flag-drop・条 N-3 の除外は持ち込みの着地から 30 日で外れていなければ持ち主に問い直す・ADR-19 の決定 (2)）・根の workspace に入れる行（v-join-prep と v-join）・(12) の行（v-roots）・R-10 と R-4 の除外を外す行（v-lint と v-size）・器の照らしを tsuzuri の検査へ移す行（v-ids と v-gates・ADR-19 の決定 (9)）。行の大きさとノートは置く時に席が決める。〔席の決め〕
options:
  - id: a
    name: 問い 7 つの推奨の束
    text: 決定 (1) から (14)。止める窓を 2 つ・履歴は書き換えない・依存は一覧で 1 回・元の repo は移り先の 1 行と切り替えの後の凍結・器に軽い読みの口・提案中の記録は資料のまま持ち込み code を直す時に受け直す・働く 2 つの file だけを止める。
    verdict: adopted
    reason: 持ち主が 7 つの問いの全部で推奨の案を選んだ（裁定 t3-hub.74.32〜t3-hub.74.38）。ほかの project を止める時間を merge の間に限り、壊れた時に merge と binary の入れ替えのどちらが原因かを分けられる。番号と署名を保ち、新しく公開に出る字を増やさない。器の検査を動かさずに働く 2 つを止め、持ち込みを遅らせない。
