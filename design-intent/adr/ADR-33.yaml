consequences:
  - 未決（入れ子の段の重さ）。持ち込みの後は、tsuzuri の便ごとに tsuzuri の検査の入れ子の段（行 v-gate・xtask の入れ子の module の nested.rs）が器の workspace を組んで撃つので、組みの書き込みと秒が増える（予行の木で入れ子の組み立て 27 秒・器の歯 202 秒・clippy 20 秒）。器の workspace は tsuzuri の crate に path の依存を持たない（器の席の確かめ・器の main b9729213）ので、器の木と根の組みの設定（toolchain・cargo の設定・根の nextest の設定）に触れない便では、入れ子の段を省いても失う物が無い見込みである。省くかは、予行で書き込みと秒を測ってから決める（memo t3-hub.77・1 日の書き込みの予算の線と照らす）。
  - 未決（入口の赤）。器の code を書く最初の便の前に、入口の赤（変更の前の木で落ちる歯）を何で測るかを決める。入れ子では器の 4 つの門（flip-check・rules-diff・deps-delta・main-provenance）が tsuzuri の根を測り、tsuzuri の宣言は入口の赤を測らない（器の席の答え）。器の照らしを移す行（v-gates）の範囲で決める。
  - 未決（1 つ目の窓の終わり）。決定 (3) の 1 つ目の窓で、ほかの置き場の止めを外す時（送りと tsuzuri の CI の緑の直後か、切り替えの前に要る便の着地の後か）は、席が器の席と決める（器の席の手順の案は送りと CI の緑の直後）。
  - 未決（器の側の閉じの裁定）。決定 (13) の器の側の閉じに使う ADR-18 の決定 (7) の持ち主の承認の裁定 id は、T の段取りの中で持ち主にもらう。
  - 未決（器の余地）。器の core の上限 82,000 行と 1 file の上限 1,500 行に対する余地（予行の木で 80,887 と 1,498）は T の直前に測り直す。器の code を書く最初の便が 1 file の上限を越えうる。
