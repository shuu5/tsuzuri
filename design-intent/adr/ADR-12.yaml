# 判断の記録 ADR-12 — 憲法の条 P-16 の改訂（提案中・発効していない）
# 討論の記録は docs/grill/2026-09-27-I-consult.md §6。反対側からの検証（A-2.3）の記録は docs/grill/2026-09-27-J-p16-amend-grill.md。
# 字（見出しと規範文）は持ち主が承認した（2026-09-27・記帳先 = tsuzuri の台帳 t3-hub.1）。3 本目の規範文の型と強さを持ち主に問い直してから、憲法を書き換えて凍結し、この記録を発効にする。
id: ADR-12
title: 条 P-16 を、席の model は要件書の制約で名指し、込み入った設計判断には持ち主が選んだ model の相談の窓を使える、という字に改める
status: proposed
date: 2026-09-27
context: |
  条 P-16 の今の字は「設計判断を下す席は、その時点で最上位の AI モデルで動かす」である。持ち主は、全部の orchestrator を最上位の model で動かすと重すぎたので、orchestrator は Opus 5.5 で動かすと決めた。代わりに相談の窓 consult の model を自由に選べるようにし、既定を Fable にする（ADR-10）。
  この運用は条 P-16 の今の字と食い違う。持ち主は「憲法が間違っているなら変える必要がある」と述べた。条 P-16 の撤退条件は、最上位の判定が割れるときに要件書の制約で名指す形へ退避することを既に認めている。
  重さの実測の値は席の手元に無い。重いという判断は持ち主の運用の判断による。
  反対側からの検証は、字を変えないと通らない致命的な穴は無いとし、条件を 3 つ挙げた。3 本目の規範文の型と強さを承認に含めること、要件書の制約 CON6 に相談の窓の念入りさを足すこと、撤退条件の数え方を直すことである。
decision: |
  (1) 条 P-16 の見出しを「席のモデルは名指しで決め、込み入った設計判断には相談の窓を使える」に改める。
  (2) 規範文 P-16.1 を「席ごとの AI モデルと念入りさは、要件書の制約で名指す。」に改める。
  (3) 規範文 P-16.2（道具の内側には最上位のモデルを求めない）は変えない。
  (4) 条 P-16 に 3 本目の規範文を足す。「込み入った設計判断では、持ち主が選んだモデルで動く相談の窓の所見を材料にできる。」型は 任意の機能（optional）、強さは 必須（must）とする案を持ち主に問う。意味は、相談の窓を使える状態に保つことを必須にし、使うかどうかは相談ごとに選ぶ、である。
  (5) 平易文と機構の注と撤退条件を新しい字に合わせる。平易文には、既定と選び方を名指せば名指しに当たること、席の model を下げる変更は判断の記録を要することを書く。憲法は第 1.1 版になり、凍結の基準を新しい版で足す。
  (6) 席ごとの名指しは要件書の制約 CON6 が持つ。orchestrator は Opus 5.5 で念入りさは xhigh。相談の窓は既定が Fable で、model と念入りさを持ち主が相談ごとに選ぶ。CON6 には、席の model を下げる変更は判断の記録を要することも書く。
  (7) 語彙表に「相談の窓」と「念入りさ」を足し、要件 FR19 の根拠に条 P-16 を足す。
options:
  - id: a
    name: 名指しにし、相談は使える形にする
    text: 決定 (1) から (7)。相談の窓を通すかは持ち主と orchestrator が相談ごとに決める。
    verdict: adopted
    reason: 持ち主の運用（orchestrator は軽い model・相談は選んだ model）をそのまま条文にでき、毎回の判断に相談を強いない。
  - id: b
    name: 込み入った設計判断は必ず最上位の model の所見を経る
    text: 判断の記録を起こす判断と憲法と規則の行の改訂は、相談の窓の所見が無ければ発効できない。
    verdict: rejected
    reason: 判断の記録は数日で 12 本起きていて、その全部に相談の窓を起こすことになり、持ち主が軽くしたかった重さが戻る。
  - id: c
    name: 条 P-16 を変えない
    text: t3 の orchestrator を最上位の model のままにする。
    verdict: rejected
    reason: 持ち主の決めた運用と食い違ったままになる。重さの実測の値は無いが、持ち主は全部の orchestrator を最上位にした運用を試した上で改めると決めている。
  - id: d
    name: 条文と閾値の改訂だけは所見を必ず経る
    text: 取り消しにくい改訂（A-2 の対象）に限って、相談の窓の所見を発効の条件にする。
    verdict: rejected
    reason: 条 A-2 が改訂の前に反対側からの独立の検証を既に課している。同じ下限を 2 重に置くことになる。
basis: [P-16, A-2, N-4, ADR-10]
grill:
  when: 2026-09-27
  who: 検証役（AI・Opus・独立の文脈・読み取りだけ）
  where: docs/grill/2026-09-27-J-p16-amend-grill.md
  summary: 8 論点を攻めた。総合は条件付きの支持で、字を変えないと通らない致命的な穴は無い。崩れたのは、下限が要件書へ移ること、制約 CON6 に相談の窓の念入りさが無いこと、撤退条件の数え方の 3 つ。設計席は処分を宣言し、決定 (4) から (7) と撤退条件に反映した。
retreat:
  kind: measure
  condition: この記録の発効の後に発効した最初の 10 本の判断の記録のうち、後から相談の窓の所見を受けて改められたものが 3 本以上になったら、案 b（必ず所見を経る）へ改めるかを持ち主に問う。改めた判断の記録は検証の欄か注に所見の id を書くので、数えは記録の欄から誰でも数え直せる。数えを出すのは t3:orchestrator 席で、確かめるのは持ち主。
plain: |
  憲法の「設計を決める席には一番賢い AI を使う」という決まりを改める提案です。
  新しい決まりは「どの席にどの AI を使うかは、要件書に名前で書く。込み入った設計の判断では、あなたが選んだ AI の相談の窓を使える」です。
  相談の窓を必ず通す形にはしません。通すかどうかは相談ごとに決めます。
  席の AI を軽いものへ下げるときは、理由を判断の記録に残します。
  字はあなたが承認済みです。3 本目の決まりの強さをあなたに確かめてから、憲法を書き換えます。
note: 提案中のあいだ憲法は変えない。発効のときに、条の改訂の欄（amends）と条の来歴（amended_by）と承認の欄を書き、第 1.1 版の凍結の基準を足す。t3 の orchestrator は、この記録の発効まで最上位の model のままで動かす。
