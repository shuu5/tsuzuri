# 判断の記録 ADR-12 — 憲法の条 P-16 の改訂（提案中・持ち主の承認の前・発効していない）
# 討論の記録は docs/grill/2026-09-27-I-consult.md §6。条文の改訂なので A-2 の手順（判断の記録と撤退条件を先に書く・反対側からの検証・持ち主の承認）を通す。
id: ADR-12
title: 条 P-16 を、席の model は要件書の制約で名指し、込み入った設計判断には持ち主が選んだ model の相談の窓を使える、という字に改める
status: proposed
date: 2026-09-27
context: |
  条 P-16 の今の字は「設計判断を下す席は、その時点で最上位の AI モデルで動かす」である。持ち主は、全部の orchestrator を最上位の model で動かすと重すぎたので、orchestrator は Opus 5.5 で動かすと決めた。代わりに相談の窓 consult の model を自由に選べるようにし、既定を Fable にする（ADR-10）。
  この運用は条 P-16 の今の字と食い違う。持ち主は「憲法が間違っているなら変える必要がある」と述べた。条 P-16 の撤退条件は、最上位の判定が割れるときに要件書の制約で名指す形へ退避することを既に認めている。
decision: |
  (1) 条 P-16 の見出しを「席のモデルは名指しで決め、込み入った設計判断には相談の窓を使える」に改める。
  (2) 規範文 P-16.1 を「席ごとの AI モデルと念入りさは、要件書の制約で名指す。」に改める。
  (3) 規範文 P-16.2（道具の内側には最上位のモデルを求めない）は変えない。
  (4) 条 P-16 に 3 本目の規範文を足す。「込み入った設計判断では、持ち主が選んだモデルで動く相談の窓の所見を材料にできる。」
  (5) 平易文と撤退条件を新しい字に合わせる。憲法は第 1.1 版になり、凍結の基準を新しい版で足す。
  (6) 席ごとの名指しは要件書の制約 CON6 が持つ（orchestrator は Opus 5.5・相談の窓の既定は Fable で持ち主が選ぶ）。
options:
  - id: a
    name: 名指しにし、相談は使える形にする
    text: 決定 (1) から (6)。相談の窓を通すかは持ち主と orchestrator が相談ごとに決める。
    verdict: adopted
    reason: 持ち主の運用（orchestrator は軽い model・相談は選んだ model）をそのまま条文にでき、毎回の判断に相談を強いない。
  - id: b
    name: 込み入った設計判断は必ず最上位の model の所見を経る
    text: 判断の記録を起こす判断と憲法と規則の行の改訂は、相談の窓の所見が無ければ発効できない。
    verdict: rejected
    reason: 判断のたびに相談の窓を起こすことになり、持ち主が軽くしたかった重さが戻る。
  - id: c
    name: 条 P-16 を変えない
    text: t3 の orchestrator を最上位の model のままにする。
    verdict: rejected
    reason: 持ち主の決めた運用と食い違ったままになる。
basis: [P-16, A-2, N-4, ADR-10]
retreat:
  kind: measure
  condition: 発効した判断の記録 10 本のうち、後から相談の窓の所見で覆ったものが 3 本以上になったら、案 b（必ず所見を経る）へ改めるかを持ち主に問う。数えるのは t3:orchestrator 席。
plain: |
  憲法の「設計を決める席には一番賢い AI を使う」という決まりを改める提案です。
  新しい決まりは「どの席にどの AI を使うかは、要件書に名前で書く。込み入った設計の判断では、あなたが選んだ AI の相談の窓を使える」です。
  相談の窓を必ず通す形にはしません。通すかどうかは相談ごとに決めます。
  この記録はまだ提案です。あなたの承認の後に発効し、憲法を書き換えます。
note: 提案中のあいだ憲法は変えない。承認の後に、条の改訂の欄（amends）と条の来歴（amended_by）と検証の欄（grill）を書き、第 1.1 版の凍結の基準を足す。t3 の orchestrator は、この記録の発効まで最上位の model のままで動かす。
