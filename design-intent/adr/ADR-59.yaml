# 判断の記録 ADR-59 — 席が起こす係（起草係・検証役・調べ係）を、tsuzuri の拡張の束（plugin）の係の型 3 本と規律の手引き（skill）と、係にだけ効く門（tz の判じ）で機械が持つ（持ち主の裁定 2026-10-05・記帳先 = tsuzuri の台帳の問い t3-hub.87.1 の notes）
# 起草は係 w200a（2026-10-05）。材料は memo t3-hub.87 と相談の窓（cw1）の所見（docs/consult/kept/cw1-4/work/ の 2 つの報告）と、係 w200a の試し（席の起草の置き場 w200a の try-hooks と w/notes.md）。
id: ADR-59
title: 席が起こす係を、拡張の束の係の型 3 本と規律の手引きと係にだけ効く門で機械が持つ
status: accepted
date: 2026-10-05
context: |
  席が起こす係（起草係・検証役・調べ係）の決まりは、席の頼みの文と、席の手元の手引き（24 KB・git の外）と、席の記憶にしか無い。条 N-2 から見て決まりでない。実際の失敗は 4 つ（V）。予算の越え（10 万に約 19 万・25 万に約 60 万）。圧縮で頼みを失い、同じ記録を 2 人が起草した。歯の段の file の決まり（判断の記録 ADR-32 の決定 (3)）を知らずに書いた。検査を最初の落ちで止まる形のまま撃ち、落ちを隠した。
  Claude Code は、拡張の束の門（hook）を係の道具の呼びにも撃ち、入力に係の id（agent_id）と型（agent_type）を付ける（公式の文書・D）。係の試し（V・3 回）で確かめた事。席が係を起こす呼びの前の門に、型と名と頼みが在る。後の門の結果に係の id が在る。係が終わる時に終わりの門（SubagentStop）が撃たれ、係の記録の path と最後の文が在る。拡張の束の型の手引きの欄の手引きは、係の文脈に前置きされる。拡張の束の型の定義は、門と権限の欄を無視する（公式・D）。
  席の係は名で呼び合う形（teammate）で起きる（席の記録に 410 本・V）。この形での型の字と終わりの事は U。
  器の門（drafts_guard・host_guard・role_guard）は、写しの置き場・memory の上の一時の置き場・破壊の命令を断るが、係の id を読まず、係と席を分けない（V）。
decision: |
  (1) 型。席が起こす係は、tsuzuri の拡張の束の型 3 本（drafter・verifier・researcher）のどれか。3 本は役割（書く・攻める・調べる）ごとの型で、条 N-5 の規範文 N-5.1 の「文書の型ごとの AI 係」に当たらないと読む。型の数は 3 を上限とし、歯が数える。足すのは判断の記録で。
  (2) 頼みの頭。係の名は起こしの名。頼みの頭は 4 行（予算・組み・対象・出す物）。起こしの門は、型の外・名の欠け・頭の欠けを、直した頭の見本を付けて断る。生きた係（終えの印の無い係）と対象が重なる起こしも断る。通した頼みは、起草の置き場の係の dir の頼みの file と係の札の file に書く。
  (3) 予算の数え方。係の予算は、係の記録の使用量の入力（input_tokens）と文脈の取り込み（cache_creation_input_tokens）と出力（output_tokens）の和を、応答の id で重ねずに足した数。文脈の読み直し（cache_read_input_tokens）は別の欄で出し、越えの判じに使わない。測りは 50・75・90% を越えた最初の 1 回だけ、残りを係に注ぐ。100% を越えた後は、係の門が自分の出力の dir への書きと席への知らせだけを通す（書き終えの段）。
  (4) 見分けと極性。係の見分けは型の字に頼らない。起こしの名と、起こしの結果の係の id を結ぶ。係の id の無い呼び（席）は、どの門も見ない。係の id が在っても結びの無い呼びは通し、起草の置き場に記帳する（fail-open・条 P-7 の「分からないと出す」）。結びの在る係の決まりの破りは断る（fail-closed）。その場で止める口は起こしの門と係の門（条 P-14）。終える前の門は後の確かめで、出す物・出力の path・席への知らせの欠けを、1 度目の終わりだけ止める。
  (5) 判じの置き場。判じは tz の Rust の口に置き、歯で測る。口は 5 つ（起こしの門・結びの口・係の門・測り・終える前の門・tzw hook の下の agent-spawn・agent-bind・agent-guard・agent-meter・agent-stop）。拡張の束の型の定義は門を持てないので、口は拡張の束の門の設定（hooks.json）に置く。どの口も、便の中では今の印で黙る。器の門はそのまま使い、重ねない。
  (6) 手引き。規律の手引き（agent-discipline）は、型の手引きの欄で前置きする。本文は 2,000 字以下。説明の欄は引き金だけ。各決まりの末に、止める門の名か「天井だけ」を書く。手引きの文は天井で、決まりの正本は門と歯（条 N-2）。席の手元の手引きの段は手引きの参照の file へ移し、移した後は頼みの文から指さない。
  (7) 行と測り。行はノート（surface-wave29b）に 3 本足す（起こしの門と結び → 測りと係の門と終える前の門 → 型と手引きと門の設定・歯は段の file・判断の記録 ADR-32 の決定 (3)）。U の 2 つ（名で呼び合う形の型の字と終わりの事）は、2 本目の行の着地の後に、席で係を 1 体起こして記帳を読み閉じる。終わりの事が終わりの門でないと分かれば、終える前の門の口をその事へ移す行を、この記録の範囲で足す。
options:
  - id: a
    name: 拡張の束に係の型と規律の手引きと係にだけ効く門（甲）
    text: 決定 (1) から (7)。
    verdict: adopted
    reason: 4 つの失敗のうち 3 つ（予算の越え・二重の起草・落ちを隠す検査の形）を機械で止め、席の呼びと解けない呼びを通すので席を止めない。器を待たずに tsuzuri の拡張の束と tz で完結し、判じを歯で測れる。
  - id: b
    name: Claude Code の中で走る新しい拡張（Claude Mods）で持つ（乙）
    text: tsuzuri の新しい拡張の道具の断りと 1 応答ごとの使用量と係の起こしの見張りで、係の門と予算を持つ。
    verdict: rejected
    reason: 予算は最も正確に測れる。けれど器が新しい拡張へ移る前（memo t3-hub.85）に係だけを移すと、仕組みが 2 つになる。事と口は版で変わり、拡張の働き手が 3 回落ちると全部が黙って外れる（D）。
  - id: c
    name: 器の便の形を係にも使う（丙）
    text: 係を器が子の process として起こし、契約と使用量の測りと終わりの門を当てる。
    verdict: rejected
    reason: 4 つ全部を止め、係ごとの SSD の書きも測れる。けれど器の変更が要り、便は同時に 1 本で、起草は契約の形でなく、席と話せない。文脈の使い回しが無く使用量も増える。
  - id: d
    name: 今のまま（丁）
    text: 決まりは席の頼みの文と手引きと記憶のまま。
    verdict: rejected
    reason: 費用は 0。4 つの失敗が残り、条 N-2 の穴のまま。
basis: [ADR-32, N-2, N-5, P-7, P-14, FR21]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo の札（t3-hub.87）か後継の memo の notes に記帳する。材料は、結びの無い呼びの記帳と、門の断りの行と、係の札の file の予算の欄。
    (1) 席の係で起こしの名と係の id が結べず、結びの無い呼びの記帳だけが増えて門が全部素通りになると分かったら、見分けの形を問い直す。
    (2) 結びの在る係の正しい作業を断った例が 1 日 3 回を越え、1 週で減らなければ、その門の口を外す行を置いて問い直す。
    (3) 置いてから 2 週で、予算の越えの率（係の札の file で 100% を越えた係の数の割合）が置く前より下がらなければ、手引きと門の形を問い直す。
plain: |
  席が起こす係（起草・検証・調べ）の決まりを、席の頼みの文や記憶でなく、門と型の定義で守る記録です。
  係は 3 つの型のどれかで起き、頼みの頭に予算と対象と出す物を書きます。同じ対象の係を 2 人起こす事は門が断ります。
  予算は新しく読み書きした量で数え、越えた係は結論を書く事と席への知らせだけができます。出す物の無いまま 1 度目には終われません。
  席自身の作業と、見分けられない係の呼びは止めません。見分けられない呼びは記帳し、後で数えます。
approval:
  who: 持ち主
  date: 2026-10-05
  ruling: t3-hub.87.1（裁定 id = t3-hub.87.1:20261005T0512Z-1・甲・配達の口・notes に逐語）
  verbatim: "これについては推奨で進めて良いが、例えば広い範囲の調査が必要なときはWF骨格を作っておいてそれを使ったほうがいい場合もあるよね？事実の検証も同様だ。ただしWFは下手に作ると大量のagentをたててトークンをいたずらに消費するのでそうならないような抑制や検証と逆にいつ必要かというトリガーとよく考える必要があるのでこの件は改めてよく検討した上で俺に聞いて"
  surface: R-8
consequences:
  - 席の道具の呼びごとに門の process が 2 本増える（係の id の無い入力は最初の判じで返す）。
  - 検証役の所見の置き場は、書いた係の dir から自分の dir へ替わる。
  - 席の頼みの文は、頭の 4 行と固有の頼みだけになる。
  - 汎用の部分（頼みの頭・測り・終える前の門）は、ほかの project の席も要る（目指す所 G3）。置いて効きを見た後に、器へ移す案を memo に書く。
  - この記録の範囲の後の行は、書ける path を自分の名の dir へ絞る残り・組みの札（同時 2 本・一時の置き場と組みの置き場を札が置く）・係の起こしの時の注ぎ（頼みの file の path と、memo t3-hub.74.59 で決まる憲法の要）。
note: 起草は係 w200a（2026-10-05）。承認の欄の逐語と経路は、適用の script が台帳の問い t3-hub.87.1 の notes の定型行から読んで入れた。
