consequences:
  - "この判断で良くなること 3 つと、 代わりに引き受けること 4 つです。 良くなるのは、 Wayland の端末を宣言でき、 欄の意味が混ざらず、 既存の行がそのまま読めることです。 引き受けるのは、 画面の番号の行を書き換えるときに古い欄を消す手間、 変数の名を器が閉じないこと、 key の列が跨版の約束になること、 X の画面の書き方が 2 通りになり表示面を持つ側が 2 つの欄を読むことです。"
  - "良い結果: Wayland の端末の画面の変数を host の面に宣言でき、 隣の project の表示面が席の手で値を持たずに端末を起こせる"
  - "良い結果: 画面の変数と日本語入力の変数が別の欄に分かれ、 どちらの欄の書き損じも欄の名と行番号つきで名指される"
  - "良い結果: 画面の番号だけを持つ既存の行はそのまま読め、 器に口も rules 行も増えない"
  - "代償: 画面の番号の欄を持つ行を Wayland の端末へ書き換えるときは、 画面の番号の欄を消して画面の変数を display-env へ移す手間が出る"
  - "代償: display-env の KEY の名は閉じず、 画面と関係の無い変数を書いても器は断らない"
  - "代償: 端末の表の key の列は閉じた 8 つの跨版の約束になり、 また足すときは新しい ADR が要る"
  - "代償: X の画面の DISPLAY は画面の番号にも display-env にも書け、 画面の宣言の書き方が 2 通りになり、 消費側は 2 つの欄を読む"
