  器の承認の欄: 設計 (orchestrator)・orchestrator・2026-09-28 草稿 v1 (端末の表の読み手と IME の env の形の検査を現物で読み、 隣の project の端末の試しの結果から画面の env の欄の形を決めた。 拘束する constitution の版 0.5.0)・作成
  器の案の章の要約: 候補を 6 つ並べます。 画面の env の欄を足して日本語入力の設定と同じ検査で受け、 画面の番号の欄と同じ行には書けなくする案 (選んだ案)、 日本語入力の設定の欄に画面の変数も書く案、 画面の番号の値の形で読み分ける案、 画面の番号の欄を列に変える案、 汎用の env の欄 1 つにまとめる案、 両方の欄を許して読み順を決める案です。
  器の専門語の説明: 本文に出てくる専門語 6 個を、 やさしい言葉で説明します。
  ・端末の表（device table）: host の面の表で、 端末 1 つにつき 1 行 (ADR-1076)。 必須の欄は名・ssh の宛先・Chrome の path・OS、 任意の欄は画面の番号・IME の env・専用の profile の dir と、 本 ADR の画面の env (画面の番号とは同じ行に書けない)。 器は形を検査するだけで値を使わない。
  ・画面の env（display env）: 端末の上で Chrome の窓を画面に出すための環境変数の組 (例: Wayland の WAYLAND_DISPLAY と XDG_RUNTIME_DIR)。 端末の表の欄 display-env が KEY=VALUE の文字列の列で持ち、 X の画面の DISPLAY も書ける。 画面の番号の欄と同じ行には書けない。
  ・画面の番号（display）: 端末の表の任意の欄 display の値 (例: :0)。 X の画面の DISPLAY を表す 1 つの値で、 Wayland の画面は表せない。 本 ADR で display-env を持たない行では跨版で保つ。
  ・IME の env（IME env）: 日本語入力を Chrome の窓で効かせるための環境変数の組。 端末の表の欄 ime-env が KEY=VALUE の文字列の列で持ち、 本 ADR の画面の env と同じ 1 つの関数で形を検査する。
  ・Wayland（Wayland）: Linux の画面の仕組みの 1 つで、 X の後継。 窓を開くには画面の名 (WAYLAND_DISPLAY) と実行時の dir (XDG_RUNTIME_DIR) の組が要り、 X の画面の番号 1 つでは足りない。
  ・host の面（host face）: state dir の host.toml。 host 固有の宣言値 (口座・plugin の場所・起動引数・群・tick の unit・端末) を持ち、 tracked の manifest と同じ読み手で検査される (FR1057・ADR-1026)。
