# 判断の記録 ADR-1080 — 器 scribe2 の判断の記録 ADR-0080 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1080
title: "端末の表の行は画面の env の欄 display-env を持てる — Wayland の端末は画面の番号 1 つでは表せないので、 KEY=VALUE の列を IME の env と同じ検査で受ける (ADR-1076 の閉じた 7 つの key を部分 supersede)"
status: accepted
date: 2026-09-28
context: |
  ADR-1076 は host の面に端末の表を足し、 画面は「画面の番号」の 1 値で宣言すると決めた。 これは X の画面しか表せず、 Wayland の端末は 2 つの環境変数の組が要る。 本 ADR は端末の表の行に任意の欄 display-env (KEY=VALUE の列) を足し、 IME の env と同じ検査で受け、 画面の番号の欄と同じ行には書けないようにする。
  なぜこの判断が要るのかを、 経緯 (端末の表の key は閉じた 7 つで、 画面は番号の 1 値)・事象 (Wayland の端末は環境変数 2 つの組が要る)・機序 (日本語入力の設定の欄が既に KEY=VALUE の列の検査を持つ)・憲法の向き・射程の 5 つで示します。
  CTX1 経緯 — 端末の表（持ち主の端末の一覧）の key は閉じた 7 つで、 画面は番号の 1 値 (ADR-1076)
  ADR-1076 は host の面（machine ごとの宣言） (host.toml) に端末の表を足し、 行の key を閉じた 7 つにした。 必須は名・ssh の宛先・Chrome の path・OS、 任意は画面の番号・IME の env (KEY=VALUE の文字列の列)・専用の profile の dir である。 読み手は未知の key を行番号つきで断る。 器は値を検査するだけで使わず、 表示面を持つ隣の project の席が値を読んで、 端末の Chrome を ssh 経由で起こす。
  CTX2 事象 — Wayland（新しい型の画面の仕組み） の端末は環境変数 2 つの組が要る
  隣の project が 2026-09-25 に試した端末は Wayland の画面で、 窓を開くのに WAYLAND_DISPLAY と XDG_RUNTIME_DIR の両方が要った。 画面の番号（X の画面の番号）の欄は 1 つの値で、 X の画面の DISPLAY しか表せない。 隣の project の表示面の最初の実物の端末がこの Wayland の端末なので、 その端末の宣言は本 ADR の着地を待っている。
  CTX3 機序 — IME の env（日本語入力の設定） の欄は既に KEY=VALUE の列の形の検査を持つ
  IME の env の欄は KEY=VALUE の文字列の列で、 読み手は 1 つの関数で各要素を最初の = で割り、 KEY の字種 (英大文字と数字と下線で先頭は数字でない)・VALUE が空でないこと・KEY の重複を行番号つきで 1 件ずつ断る。 断りの文は欄の名 ime-env を字面に持つので、 同じ形の欄を足すなら、 この関数に欄の名の引数を足して両方の欄から呼べる。
  CTX4 憲法と既存の決定の向き (本 ADR の解釈)
  N3 (host 固有の値で code を分岐させない) から、 画面の env（画面を開くための環境変数） も code に焼かず宣言にする。 N2 (散文にしか無い規則は規則として扱わない) から、 画面の番号の値の形で X と Wayland を読み分ける規則は宣言の形に無いので採らない。 C2 (同じ事実の読みは 1 本) から、 KEY=VALUE の列の検査は IME の env と共有する。 C17 (決定はしご) から、 既に在る検査の関数と表の読み手で足り、 口を足さない。
  CTX5 射程 — 動かすのは端末の表の key の列と、 KEY=VALUE の検査の欄の名だけ
  動かすのは (1) 端末の表の行が受ける key に任意の display-env を 1 つ足すこと (閉じた 8 つ)、 (2) KEY=VALUE の列の検査の関数が断りの文に欄の名を載せること (IME の env の断りの文は 1 字も変えない)、 (3) 画面の番号の欄と display-env を同じ行に書いた行を断ること だけである。 動かさないのは、 画面の番号の欄 (display-env を持たない行では跨版で保つ)・他の欄の形と検査・doctor の行 (名の列だけ)・表を host の面にだけ置く決まり・器が値を使わないこと・要件書である。
  （選択肢を測るものさし）この判断を評価する 5 本のものさしです。 Wayland の端末を宣言で表せること。 1 つの欄に 1 つの意味だけを持たせること。 既存の host の面を壊さないこと。 足すものを最小にすること。 どの欄を使うかの順を文章に置かないこと。
  DR1｜Wayland の端末を宣言で表せる — 画面の env を席の手や code に持たせない (N3) CTX2・CTX4
  DR2｜1 つの欄は 1 つの意味 — 画面の env と IME の env を混ぜない CTX1・CTX3
  DR3｜既存の host の面を壊さない — 画面の番号の欄を持つ行は跨版で同じに読める CTX1・CTX5
  DR4｜足すものを最小にする — 既に在る検査の関数を使い、 口を増やさない (C2・C17) CTX3・CTX4
  DR5｜読み順を散文に置かない — どの欄を使うかは宣言の形と読み手の断りで決まる (N2) CTX4・CTX5
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 端末の表の行は任意の欄 display-env を持て、 key の列は閉じた 8 つになります。 形の検査は日本語入力の設定と同じ 1 つの関数で行い、 画面の番号の欄は保ちますが、 同じ行に両方は書けません。
  採用 — OPT1
  端末の表の行 SHALL 任意の欄 display-env を持てる。 値は KEY=VALUE の文字列の配列で、 KEY は英大文字と数字と下線で先頭は数字でない・最初の = で割り VALUE は空でない・同じ KEY は重複しない (IME の env と同じ形)。 行の key の列 SHALL 閉じた 8 つ (必須の name・ssh・chrome・os と任意の display・ime-env・profile-dir・display-env) とし、 読み手は未知の key を今どおり行番号つきで断る。 KEY=VALUE の列の検査 SHALL IME の env と同じ 1 つの関数で行い、 断りの文は欄の名を名指して、 その欄の行番号で 1 件ずつ出す (IME の env の断りの文は変えない)。 画面の番号の欄 display SHALL display-env を持たない行では跨版で保ち、 display と display-env を両方持つ行 SHALL display-env の行番号で 1 件断る (X の画面の DISPLAY も display-env に書ける)。 器 SHALL 値を使わない。 doctor の host の行・表を host の面にだけ置く決まり・他の欄の形と検査・要件書は変えない。
  （平易）端末の表の行は、 任意の欄 display-env を持てます。 値は KEY=VALUE の文字列の列で、 KEY は英大文字と数字と下線 (先頭は数字でない)、 最初の = で割って VALUE は空でなく、 同じ KEY は重ねません。 行の key は閉じた 8 つになり、 未知の key は今どおり行番号つきで断ります。 形の検査は日本語入力の設定と同じ 1 つの関数で行い、 断りの文は欄の名と行番号を名指します (日本語入力の設定の断りの文は変えません)。 画面の番号の欄は display-env を持たない行では保ち、 両方を持つ行は display-env の行番号で断ります (X の画面の DISPLAY も display-env に書けます)。 器は値を使いません。 doctor の行・表を host の面にだけ置く決まり・他の欄・要件書は変えません。
  （理由）Wayland の端末は、 窓を開くのに画面の名と実行時の dir の 2 つの環境変数が要り、 画面の番号の 1 つの値では表せません。 表示面を持つ隣の project の最初の実物の端末がこの形なので、 宣言の形を足す必要があります。 日本語入力の設定の欄が既に KEY=VALUE の列を同じ形で検査しているので、 その関数に欄の名の引数を足して両方の欄から呼べば、 口も rules 行も増えません。 日本語入力の設定の欄や汎用の env の欄に混ぜると 1 つの欄が 2 つの意味を持ち、 値の形で読み分ける決まりは文章にしか残らず、 欄を列に変えると既存の面が読めなくなるので、 画面の env は専用の欄として足しました。 両方の欄を同じ行に許すと、 どちらを使うかの順が文章にしか残らないので、 両方を持つ行は断ります。 任意の欄 display-env は台帳の memo の推奨のままで、 両方の欄を断る形は memo の当初の推奨 (両方を許す) をこの分析で改めたものです。 どちらも、 決めることを推奨で進める持ち主の常設の指示の範囲で決めました。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1057（claim）: FR1057 (host 固有の宣言値は host の面 1 file だけから読み、 tracked の manifest と同じ読み手と同じ断り方で検査する) の宣言値のうち端末の表の欄を 1 つ足し、 同じ読み手と同じ断り方で検査すると主張する。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録は ADR-1076 の 1 条 (端末の表の key は閉じた 7 つ) だけを置き換え、 それ以外はそのまま保ちます。
  改訂状態: current
  置き換える ADR: ADR-1076
  置き換えられた: なし (現行)
  部分 supersede で、 置き換えるのは 1 条 — ADR-1076 の「端末の表の行の key は閉じた 7 つ (任意の欄は display・ime-env・profile-dir)」を「閉じた 8 つ (任意の欄に display-env を足し、 display と display-env は同じ行に書けない)」に改める。 ADR-1076 のそれ以外 (表を host の面にだけ置く・読み手の断り方・doctor の名の列・器は値を使わず消費側の読み方を決めない・画面の番号の欄の形) はそのまま保つ。
  照会終端 — PRIN-ONE-FIELD-ONE-MEANING
  1 つの欄には 1 つの意味だけを持たせ、 値の形で意味を読み分けない。
  本 ADR が「IME の env に混ぜる」「画面の番号の値の形で読み分ける」「汎用の env の欄」を退け、 画面の env を別の欄として同じ検査で受けたのはこの原則に行き着く (これ以上は遡らない照会終端)。 両方の欄を許す案は N2 (散文にしか無い規則) で退けた。
options:
  - id: "OPT1"
    name: "任意の欄 display-env (KEY=VALUE の列) を足し、 IME の env と同じ検査で受ける"
    text: |
      端末の表の行に任意の欄 display-env を足す。 値は KEY=VALUE の文字列の列で、 IME の env と同じ 1 つの関数で形を検査し、 断りの文には欄の名を載せる。 画面の番号の欄は跨版で保ち、 同じ行に画面の番号の欄と display-env を両方書いた行は断る (X の画面の DISPLAY も display-env に書ける)。 決め手は台帳の memo の推奨 (任意の欄 display-env) に、 両方の欄を断る分析 (DR5) を足したもの (常設の裁定 2026-09-28T00:54Z の範囲)。
      （平易）端末の表の行に、 画面を開くための環境変数の組を書く欄 display-env を足す案です。 値は KEY=VALUE の文字列の列で、 日本語入力の設定の欄と同じ関数で形を検査し、 断りの文には欄の名を載せます。 画面の番号の欄は保ちますが、 同じ行に両方を書いた行は断ります (X の画面の DISPLAY も display-env に書けます)。 Wayland の端末を 1 行で宣言でき、 1 つの行の画面の宣言は 1 つの欄だけになります。 代わりに、 X の画面は画面の番号にも display-env にも書けて表示面を持つ側が 2 つの欄を読むこと、 画面の番号の行を書き換えるときに古い欄を消す手間、 変数の名を器が閉じないことを引き受けます。
      利点: Wayland の端末の WAYLAND_DISPLAY と XDG_RUNTIME_DIR を 1 行の宣言で表せる (DR1)
      利点: 画面の env と IME の env が別の欄に分かれ、 欄の意味が混ざらない (DR2)
      利点: 画面の番号だけを持つ既存の行はそのまま読める (DR3)
      利点: 1 つの行の画面の宣言は 1 つの欄だけになり、 どちらを使うかの読み順が要らない (DR5)
      利点: 形の検査は既存の 1 関数に欄の名の引数を足して両方の欄から呼び、 口も rules 行も増えない (DR4)
      欠点: 画面の宣言の欄が 2 つ在り (X の DISPLAY は画面の番号にも display-env にも書ける)、 消費側は 2 つの欄を読み、 画面の番号の行を display-env へ書き換えるときは画面の番号の欄を消す手間が出る
      欠点: display-env の KEY の集合は閉じない (画面に要る変数の名を器は決めない) ので、 画面と関係の無い変数も書ける
      欠点: 端末の表の key の列は跨版の約束で、 足すには ADR が要る (本 ADR)
    verdict: adopted
    reason: "決め手は台帳の memo の推奨 (任意の欄 display-env) に、 両方の欄を断る分析 (DR5) を足したもの (常設の裁定 2026-09-28T00:54Z の範囲)。"
  - id: "OPT2"
    name: "IME の env の欄に画面の変数も書く"
    text: |
      IME の env の列に WAYLAND_DISPLAY と XDG_RUNTIME_DIR も並べる。 決め手は分析 (欄の意味が外れる)。
      （平易）日本語入力の設定の欄に、 画面の変数も並べて書く案です。 器の読み手を変えない点で勝ります。 けれども、 欄の名と中身の意味がずれ、 読み手も表示面を持つ側も意味で分けられないので退けました。
      利点: 器の読み手を変えない (DR4)
      欠点: 欄の名が「日本語入力の設定」なのに画面の変数を持ち、 読み手も消費側も意味で分けられない (DR2)
    verdict: rejected
    reason: "決め手は分析 (欄の意味が外れる)。"
  - id: "OPT3"
    name: "画面の番号の値の形で X と Wayland を読み分ける"
    text: |
      画面の番号が :0 の形なら DISPLAY、 それ以外なら WAYLAND_DISPLAY と読む。 決め手は分析 (散文にしか無い規則・XDG_RUNTIME_DIR を表せない)。
      （平易）画面の番号の欄の値が :0 の形なら X の DISPLAY、 それ以外なら Wayland の画面の名と読み分ける案です。 key を足さない点で勝ります。 けれども、 値の形で意味が変わる決まりは宣言の形に無く文章にしか残りません。 Wayland に要るもう 1 つの変数 (実行時の dir) も表せないので退けました。
      利点: key を足さない (DR4)
      欠点: 値の形で意味が変わる規則は宣言の形に無く、 散文にしか無い規則になる (N2・DR2)
      欠点: XDG_RUNTIME_DIR を表せず、 Wayland の端末を宣言しきれない (DR1)
    verdict: rejected
    reason: "決め手は分析 (散文にしか無い規則・XDG_RUNTIME_DIR を表せない)。"
  - id: "OPT4"
    name: "画面の番号の欄を KEY=VALUE の列に変える"
    text: |
      画面の番号の欄の値を文字列から KEY=VALUE の列へ変える。 決め手は分析 (跨版で既存の面が読めなくなる)。
      （平易）画面の番号の欄の値を、 1 つの文字列から KEY=VALUE の列に変える案です。 画面の欄が 1 つで済む点で勝ります。 けれども、 画面の番号を文字列で書いた既存の host の面が型の違いで丸ごと読めなくなるので退けました。
      利点: 画面の宣言の欄が 1 つで済む
      欠点: 画面の番号を文字列で書いた既存の host の面が、 型違いで面ごと読めなくなる (DR3)
    verdict: rejected
    reason: "決め手は分析 (跨版で既存の面が読めなくなる)。"
  - id: "OPT5"
    name: "汎用の env の欄 1 つに画面と IME の変数を全部書く"
    text: |
      端末の表に任意の欄 env を足し、 画面と IME の変数をまとめて持つ。 決め手は分析 (意味が広すぎる)。
      （平易）端末の表に汎用の env の欄を 1 つ足し、 画面と日本語入力の変数をまとめて書く案です。 次に別の用途の変数が要っても key を足さずに済む点で勝ります。 けれども、 日本語入力の設定の欄と役目が重なり、 1 つの欄が画面と日本語入力の 2 つの意味を持つので退けました。
      利点: 次に別の用途の変数が要っても key を足さずに済む
      欠点: IME の env の欄と役目が重なり、 1 つの欄が画面と日本語入力の 2 つの意味を持つ (DR2)
    verdict: rejected
    reason: "決め手は分析 (意味が広すぎる)。"
  - id: "OPT6"
    name: "両方の欄を許し、 両方在る行は消費側が display-env を使う"
    text: |
      画面の番号の欄と display-env を同じ行に書いても断らず、 両方在る行は消費側が display-env を先に使う。 台帳の memo の当初の推奨。 決め手は分析 (読み順が散文にしか無い規則になる)。
      （平易）画面の番号の欄と display-env を同じ行に書くのを許し、 両方在る行は表示面を持つ側が display-env を先に使う案で、 台帳の memo が最初に推した形です。 画面の番号の行に display-env を足すだけで移れる点で勝ります。 けれども、 どちらを使うかの順が宣言の形に無く文章にしか残らないうえ、 値の読み方は表示面を持つ側の領分で、 前の記録 (ADR-1076) が決めなかったところに踏み込むので退けました。
      利点: 画面の番号の行に display-env を足すだけで移れ、 画面の番号の欄を消す手間が無い
      欠点: どちらを使うかの読み順は宣言の形に無く、 器も強めず、 散文にしか無い規則になる (N2・DR5)
      欠点: 読み順を決めるのは消費側の領分で、 ADR-1076 が決めなかった値の読み方に踏み込む (ADR-1076 の値の使い方は消費側が決める)
    verdict: rejected
    reason: "決め手は分析 (読み順が散文にしか無い規則になる)。"
basis: [FR1057, ADR-1026, ADR-1076]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「host の面」は machine ごとの宣言を持つ file (host.toml)、 「端末の表」は持ち主の端末 1 つにつき 1 行の一覧です。 端末の表は画面を「画面の番号」の 1 つの値で宣言しますが、 これは X の画面しか表せません。 Wayland の画面の端末は、 窓を開くのに環境変数 2 つの組が要ります。 本 ADR は端末の表の行に任意の欄 display-env (KEY=VALUE の列) を足し、 日本語入力の設定の欄と同じ検査で受け、 画面の番号の欄と同じ行には書けないようにします (要件 FR1057 を支え、 ADR-1076 の閉じた 7 つの key を 8 つに改めます)。
approval:
