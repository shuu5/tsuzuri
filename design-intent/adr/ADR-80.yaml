    (1) 鍵（core_body_growth_7d）（器と tsuzuri の core の本体の和の 7 日の伸び・今の式・行）・向き 越える・閾値 80,000 行（同じ母集団の 2026-09-15 から後の 7 日の窓の最大 39,857 行の 2 倍を千の位に切り上げた値・今の 7 日は 27,349 行・H2）・窓 末の 7 日（この記録の発効の日から・日ごとに動かす） → 伸びが上限の時の最も速い週の 2 倍を越えた。上限の行を戻すか、整理を急ぐかを問う。
    (2) 鍵（waste_landed_7d）（夜の段が前の夜との差で名指した新しい物の数: (a)(b) の候補と、字句が全く同じ本文の組・名を替えた近い写しの組は数えない・件）・向き 越える・閾値 3 件・窓 行 （t-waste-nightly） の着地の日から 7 日（日ごとに動かす） → 便ごとの門と夜の分けか、門の道具を問い直す。
