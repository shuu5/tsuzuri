plain: |
  器（scribe2）と tsuzuri の中心の部品（core）には「全部で何行まで」という上限があり、超えると機械が着地を止めます。あなたの言葉（上限は無駄を足さないための物で、作り直しの最中は要る機能が読めないので完全に撤廃し、落ち着いてから整理で減らす）と、席の推しへの「それでよい」を、記録にします。
  1. 止めるもの: 器の core の上限（今 90,000 行・正しく数えて 89,546 行）と tsuzuri の core の上限（20,000 行）。値は持たず、行数を測って示すだけにします。関数の長さ・引数の数・1 file の長さ・行の幅などの「形」の上限は残します。
  2. 境界の部品の上限 316 行も止めます（core の上限を逃げる形を塞ぐための物なので）。席の推しの字の外なので、残すなら案 乙 です。
  3. 憲法: tsuzuri の憲法の条 P-22.1 が「core の総行数の上限」を名指しているので、その字を改めます（版 v1.8）。器の古い憲法は凍った資料なので替えません。
  4. 代わりに置くもの: (1) 毎日 core の行数を記録し、伸びを見せます（止めない・今ある 2 つの数えを読むだけ）。(2) 無駄の門: 同じ中身の関数は便ごとに測って新しく足した物を落とし、並んだ 2 便で入った物と名前だけ替えた写しは夜に拾って memo にします。テストだけが使う部品と使われない部品は、core の中だけで使う部品の印を狭めてコンパイラに落とさせ、外から見える部品は夜に 1 度索引で測って memo を起こします。今ある無駄（77 本と複製 3 組）は止めずに整理の材料にします。(3) 整理（refactor）の memo を機械が起こす引き金: ライン停止を解いた時・伸びが 1 週 3,000 行を下回った時・前の整理から 14 日、のどれか。
  5. 依存の足し: syn は試しの拾いが Python と同じで、より小さい （proc-macro2） だけで足りるので、syn でなく （proc-macro2） を xtask に足す案を推します。あなたの承認は syn の名指しだったので、（proc-macro2） の足しもこの承認で確かめます。
  6. 片付け: ADR-79 は退役させ、着地した縮め（一・二・三a・三b）は残します。穴を塞ぐ大きな便・縮め 四・上げの便・上げの門などは流しません。数え方の穴は「テストの印の次は mod」という小さな門で塞ぎます（ADR-79 の大きな式は使いません・選ぶなら案 戊）。
  失う物: code の大きさを機械が止める歯止めが無くなります。無駄でない新しい機能・長い説明・同じ事をする別の作りは伸び放題になり、整理は memo が起きるだけで、するかどうかはあなたと席が決めます。部品の印を狭める作業は、機械で直せる約 251 本の 1 便だけを今流し、残り（約 1,500 本・6 便以上）は落ち着いた後の整理に回すので、その間は使われない部品の一部を夜の測りでしか拾えません。
  決めてほしい事: (1) 案（推奨は甲）。(2) 境界の部品の上限 316 行も止めるか（推奨は止める・残すなら乙）。(3) 条 P-22.1 の字の改め。(4) 穴の塞ぎ方（推奨は小さな門・ADR-79 の式のままなら戊）。(5) 引き金と撤退の閾値の値。(6) （proc-macro2） を xtask の依存に足す事。
