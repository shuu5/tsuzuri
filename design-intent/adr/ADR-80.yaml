decision: |
  (1) 止める上限の範囲（行ごと）。止めるのは行数の総量の上限 3 つと、その名指し 1 つ: 器の R-C4-1（core の本体の総行数）・器の R-C4-5（境界の crate の本体の総行数）・tsuzuri の行 R-4 の core の総行数の字（tsuzuri の core 20,000 と器の core の名指し）・行 R-29（器の R-C4-5 の名指し）。R-C4-5 を止める訳: 行の注のとおり、R-C4-5 は判定を core の外へ押し出して core の上限から逃げる形を塞ぐ柵で、core の上限が無くなれば逃げる先が無い。境界の crate が判定を持たない事は、子 process を構築する file が 1 本だけの形の門（boundary-spawn）と審査が残って見る。R-C4-5 の停止は席の推し（notes 07:14Z は器の R-C4-1 と tsuzuri の core の上限を名指す）の外なので、案 乙 に並べ、plain に独立の 1 行で問う。
    残す上限（形と予算・総量の上限でない訳）: 器の R-C4-2 と行 R-4 の 1 module 1,500 行（1 file の大きさの形で、読む単位を縛る）・R-C4-3 と歯:source 1.0（比で、伸びを縛らない）・R-C4-4（関数の行 60・複雑度 15・引数 5）・（R-C4.line-width）（幅 120 の数え方）・行 R-2（依存の予算・条 A-3 の対象で上限の替えでない）・xtask の歯の群の行と段の本数の照らし （kfold-cap）（組み立ての時間の形）。設計ノート・契約の bead・memo・係・相談の窓・読みの量の上限の行は、code の行の総量の上限でないので替えない（持ち主の字は code の無駄の上限を名指す）。
