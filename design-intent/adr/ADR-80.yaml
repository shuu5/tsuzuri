  (4) 無駄の門（②）。無駄は 3 種: (a) 歯だけが呼ぶ本体の pub の item、(b) どこからも使われない pub の item（private と pub(crate) と pub(super) の物は rustc の dead_code が既に落とす）、(c) 同じ本文の関数（本文 3 行以上・字句が全く同じ 2 本目以降）。今在る無駄では落とさず、新しく足された物だけを見る。門の線は 1 回 wall 120 秒（見立て・I・便の verify の時間の予算の行は無い・H10）と最大の RSS が器の受付札 1 枚の箱（器の行 gate.job_memory_mb の 3072 MB・H10）で、線の内の物を便ごとの門に、外の物を夜の検出線に置く。索引は 1 回 40 秒だが 3,229 MiB で 3072 MB を越え、base と便の木の 2 回が要る（H6）ので、便ごとの門に置かない。
