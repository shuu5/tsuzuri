# 判断の記録 ADR-80 — 行数の総量の上限を止め、着地ごとの測り・新しい無駄の門・整理の引き金に置き替える（第 5 稿）
# 第 1 稿（係 w416a）と第 2 稿（係 w419a）は上限を上げる案（問い t3-hub.92.10.13 の答えの案 乙）の中身で、持ち主が承認の問い t3-hub.92.10.21 に道の替えで答えたので取り下げた。第 3 稿と第 4 稿は係 w420a（2026-10-07）。第 5 稿は係 w426a で、検証役 v423 の攻め 1 巡（直す 7・問う 12・よい 13）を入れた。数は写しの木 main 1a3120f1 で係の数えの写し（drafts/w426a/w/count426.py・式は drafts/w411a/w/count3.py をそのまま読む）を撃って取った。撃った命令と rc は drafts/w426a/w/notes.md。持ち主の承認の前（status proposed・承認の欄と攻めの欄は空）。条 P-22.1 の字を改めるので amends を持ち、条 A-2.3 の攻めを前に置く。
# 持ち主の裁定 t3-hub.92.10.24 で発効（2026-10-07・逐語「どちらも承認する」・推奨のとおり＝6 つの決めの全部）。引き金の規則の行は R-52。攻めの記録は発効の前の別の commit（463c59f4）で置いた。
id: ADR-80
title: 器と tsuzuri の core と器の境界の crate の行数の総量の上限を止めて数だけ出す検出線にし、着地ごとの本体の行の測り・便が新しく足した無駄だけを落とす門・整理の memo を機械で起こす引き金に置き替え、関数と file と行の幅の形の上限は残す
status: accepted
date: 2026-10-07
supersedes: ADR-79
context: |
  ADR-79 は器の core の上限 90000 を保って縮めの行で余地を作り、77-5 から後の受け方を 2 つ目の問い（t3-hub.92.10.13）に送った。答えは案 乙（外へ置ける物を外へ置き、残りの分だけ上げ、上げの口を重くする）で、その中身を第 1 稿と第 2 稿に書いた。承認の問い（t3-hub.92.10.21）に、持ち主は承認でも否でもなく道の替えで答えた（memo t3-hub.92.10 の notes 2026-10-07T07:12:45Z）。趣旨は、上限は無駄を足さないための物で、決定はしごの決まりが在れば要らず、作り直しの最中で要る機能が読めないので、上限は完全に撤廃し、ワークフロー（workflow）が落ち着いてから整理（refactor）で減らす、である。席は止める方向に賛成し、散文のはしごだけに戻さず ① 大きさは着地ごとに測って見せる（止めない）② 無駄を直に測る門 ③ 見直しの引き金を機械で置く・関数の行と引数と幅の形の上限は残す、を推し（同じ notes 07:14Z）、持ち主はそれを受けた（同じ notes 07:17:18Z）。外の library の syn は、明らかに使った方が良いなら足してよいと持ち主が言った（同じ notes 07:25:23Z・条 A-3.1 の条件付きの承認）。印 V は現物で照らした・D は導いた・I は見立て・U は分からない。
