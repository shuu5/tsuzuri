# 判断の記録 ADR-18 — 合流の 3 段目（scribe2 と folio2 の code の持ち込み）の線と段取り（発効 2026-09-29・持ち主の裁定 t3-hub.67.1〜.67.5・記帳先 = tsuzuri の台帳の問いの notes）
# 判断の記録 ADR-4 の決定 (3)(4) の 3 段目を具体にする。ADR-4 の決定は替えない。擦り合わせの記録は控え t3-hub.67 の notes（器の席と folio2 の席の答えと見立て）。
id: ADR-18
title: 持ち込みの後は器と folio を 1 つずつにして元の repo を凍結し、folio2 を先・scribe2 を後に、名を変えず、規則は除外の表で持って持ち込む
status: accepted
date: 2026-09-29
context: |
  判断の記録 ADR-4 は、v3（tsuzuri）が scribe2 の core と folio2 と面を 1 つの workspace に合流させ、順を憲法の最小版 → 面の実装 → code の持ち込みとした（決定 (3)(4)）。今は 2 段目（面の実装）の途中で、3 段目の「何を終えたら持ち込むか」の線と段取りが決まっていなかった。
  scribe2 と folio2 を同時に使っているのは tsuzuri だけで、2 つの道具の境目の穴（地図の節点と設計ノートの増殖・控え t3-hub.66）は tsuzuri で初めて見えた。持ち主は、器と folio2 の個別の直しを適切なところまで終えたら合流し、その後は tsuzuri の中で磨く形を求め、微妙な点が多いので擦り合わせを求めた。
  席は器の席と folio2 の席に答えを求め、3 つの席の案を束ねて 2 度見立てを受け、持ち主に問い 5 つ（t3-hub.67.1〜.67.5）を出した。制約 CON2 の判定点 3 つは記帳した（控え t3-hub.68・folio2 の台帳が名指した）。
decision: |
  (1) 持ち込みの後は、器も folio も tsuzuri の中の 1 つずつにする。scribe2 と folio2 の repo は消さずに凍結して保管する（folio2 の台帳の refs も消さない）。tsuzuri の repo は公開にした（2026-09-29・秘密の鍵と token を含まないことを席が履歴の全部で確かめた）ので、器と folio の改良は公開のまま続く。公開の scribe2 の凍結の仕方は、その時に持ち主に聞く。
  (2) 持ち込みの順は folio2 が先、scribe2 が後。folio2 は、tsuzuri の求めの便 203・204 と増殖の案の folio の側の 3 つ（判断の表 d39）の着地の後に持ち込む。持ち込む commit を決めたら folio2 への便はそこで止め、folio2 の木を丸ごと 1 つの sub-dir へ移す（folio は design-intent などを組み立ての材料に焼くため）。道具の切り替えは計画の等しさの確かめの行（pin と workspace の folio の出力が byte で同じ）の合格の後。scribe2 は、器の束 E の実装の核（局面の出力・close の理由の門・発話の event と答えの口）の着地の後で、全部の state dir の便の列が空の時に持ち込む。その前に器の側で口座の認証切れの判定と写しの表 4 つ（憲法の条・判断の記録の番号・台帳の prefix・名）を終え、作業用の複製で持ち込みを予行し、新旧の binary で歯を比べる。PATH の binary の入れ替えは今の入れ替えの門（走行中の driver が在れば断る）で撃ち、前の世代を残して戻せるようにし、8 つの器の宣言の plugin の path を書き換え、state dir ごとに便を 1 本通して確かめる。
  (3) 履歴は commit id を保って持ち込む（別の根として merge し sub-dir へ移す・ADR-4 の決定 (3)）。台帳の notes・commit の trailer・走行の記録・binary の世代が指す id は解けるまま残る。
  (4) 持ち込みの段では器の名（命令の名・commit の trailer の名・state dir の名・plugin の名・環境変数）を変えない。変えるのは、古い名と新しい名の両方を読む期間を持つ別の段にし、先に判断の記録を書く。
  (5) 持ち込む code への tsuzuri の規則（R-4・R-10・R-2）は、最初は除外の表で持ち、段ごとの便で外す。依存は持ち込みの時に一覧（folio は clap・yaml-rust2・vendor の archify・実行の時の node、器は器の依存）で 1 回、持ち主の承認を取る。持ち込んだ code と注の判断の記録・条・規則・要件の id は凍結した元の記録の id とし、付け替えは対応表と番号の便で行う。
  (6) 持ち込みの後、code を縛る憲法は tsuzuri の憲法だけにする。器と folio の code が名指す条ごとに写し先の対応表を作り、写らない条を足す案は 1 つずつ持ち主に聞く（条 A2）。閾値は今の値と裁定 id を引き継ぐ。folio2 の値域・部品目録・token は付け替えの便まで材料として凍結する。folio2 の憲法の、外の利用者で受入が通ってから自分を運ぶという条の趣旨は CON2 の記帳（t3-hub.68）で満たされたと読む。
  (7) 閉じた履歴は元の台帳に読むだけで残す。open の memo は、元の側で整理して本数を減らした後に、tsuzuri の台帳へ id を名指して移し、元の側は tsuzuri の id を名指して閉じる。別の台帳へ渡す close の形は、器が持ち込みの前に後継の判断の記録で足す。
  (8) 持ち込んだ repo の設計文書（folio2 の docs/design と design-intent・scribe2 の design-intent）は組み立ての材料として持ち込み、tsuzuri の設計文書の検査からだけ外す。
  (9) 公開の repo の守り: main へ送る前に host の名・tailnet の住所・口座の名札を探す走査を CI に入れる（計画の行）。台帳は別の非公開の repo のまま公開しない。
options:
  - id: a
    name: 1 つずつにして元は凍結・folio2 が先・名は変えない・規則は除外の表
    text: 決定 (1) から (9)。
    verdict: adopted
    reason: 同じ道具の正本を 2 つにしない。使う project の少ない folio2 で持ち込みを予行でき、器は形の変わる束を終えて静かな時に切り替えられる。名と規則を同じ段で変えると、壊れた時に原因を分けられない。3 つの席の推奨が一致し、持ち主は推奨を選び（t3-hub.67.2〜.67.4）、tsuzuri の公開を承認した（t3-hub.67.1・.67.5）。
  - id: b
    name: 元の repo も並べて育てる
    text: 持ち込みの後も scribe2 と folio2 の repo で開発を続ける。
    verdict: rejected
    reason: 直しが片方にしか入らない道が開き、器を使う project がどちらの形かを持つことになる。
  - id: c
    name: tsuzuri を非公開のまま、器の部分を公開の scribe2 へ片方向で写し続ける
    text: 器の改良の公開を写しで保つ。
    verdict: rejected
    reason: 写しの手と公開へ出る差分の走査が要る。持ち主は tsuzuri の公開を選んだ（t3-hub.67.1・.67.5）。非公開の CI の分の上限も外れる。
  - id: d
    name: 履歴を書き換えてから公開する
    text: 履歴の host の名・tailnet の住所・口座の名札を消してから公開する。
    verdict: rejected
    reason: commit id が全部変わり、台帳と走行の記録と CON2 の記帳が指す id が解けなくなる。履歴に秘密（鍵・token）は無く、持ち主はそれを条件に公開を承認した（t3-hub.67.5）。
basis: [P-1, ADR-4, CON2, R-4, R-10, R-2]
retreat:
  kind: ruling
  condition: folio2 の持ち込みで等しさの確かめが 2 回続けて通らないか、scribe2 の予行で歯が緑にならないことが 2 回続いたら、順か持ち込みの形を持ち主に問い直す。数えるのは tsuzuri の設計の席。
plain: |
  scribe2（器）と folio2 の中身を tsuzuri に持ち込む段取りを決めた記録です。
  持ち込んだ後は、器も folio も tsuzuri の中の 1 つだけにし、元の 2 つの repo は消さずに凍結して保管します。tsuzuri は公開にしたので、改良は公開のまま続きます。
  順は folio2 が先で、scribe2 が後です。folio2 は、いま頼んでいる直しが着地した後に木を丸ごと持ち込み、出力が同じだと確かめてから道具を切り替えます。scribe2 は、器の大きな改修が着地して全部の便が止まった静かな時に、予行してから切り替えます。
  持ち込む時は名前を変えず、tsuzuri の規則に合わない所は除外の一覧で持って少しずつ直します。外の部品は持ち込む時に一覧であなたの承認を取ります。
  この記録はあなたの承認で発効しています。承認の記帳先は tsuzuri の台帳の問いです。
