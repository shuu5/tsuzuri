  器の承認の欄: 設計 (orchestrator)・orchestrator・2026-09-20 起票 (guard の分類の現物と vessel 宣言の読み口の実測・拘束する constitution の版 0.5.0)。 発効は宣言の任意 key 3 本と guard の読み口が land した版・作成
  器の案の章の要約: 候補を 5 つ並べます。相手の repo の宣言 file に先頭一致の一覧を 3 つ足す案、同じ宣言をワイルドカードや正規表現で書けるようにする案、分類を器の規則の行に持つ案、置き方の違う相手の席に本体 code の編集を許す案、そして中身を見て言語を当てて自動で分類する案です。
  器の専門語の説明: 本文に出てくる専門語を、やさしい言葉で説明します。
  ・path の種別（path kind）: 編集先の file を分ける閉じた分類 (design-intent / 設計 doc / 歯 / code / 対象 repo の外)。 種別ごとに要る権能が 1 つ決まっていて、 編集面の guard は編集先の種別を引いてから席の権能と照らす。 分類は repo root からの相対 path の先頭一致だけで決め、 file の中身や名前の語彙では判定しない。
  ・vessel 宣言（vessel declaration）: 対象 repo の root に marker の隣として置く tracked な file (.vessel.toml)。 その repo が「許してよい command」「どの便でも撃つ検証」などを自分で名乗る宣言値で、 器はここに上限を掛けて便ごとに凍結する。 本 ADR はここに path の種別の宣言を 3 本足す。
  ・任意 key（optional key）: 宣言 file の key のうち、 書かなくてよいもの。 「無い」は key の不在で表し (書いた空配列は不備)、 書かない宣言は器の既定で動く。 既に検出線の行・要件面の path・push 先の remote・CI の行の 4 つが任意 key で、 本 ADR の 3 本も同じ形である。
  ・prefix の宣言（prefix declaration）: repo 相対の path の先頭一致で集合を表す書き方。 末尾に / を付けた項目はその dir の配下全部を指し、 付けない項目は file の完全一致を指す。 ワイルドカードも正規表現も持たない。 器の中では write-set の allowlist が同じ形を既に使っている。
  ・fail-closed（fail closed）: 解けない・読めない周に「通す」ではなく「止める」側へ倒す極性。 ここでは、 宣言が不正な周に現行の既定へ戻すのでなく、 全 file を code の種別として扱う (code の権能を持たない席は止まる)。 極性は型が持ち、 全 guard の一覧は器が生成する。
  ・anchor（anchor）: 席が仕える対象 repo の main checkout。 席の登録は役割と anchor を鍵に持ち、 guard は権能を解く最初の段で anchor を解く。 本 ADR の guard は、 この anchor の宣言 file を読んで種別を決める (新しい引数も env も要らない)。
  器の頁の末: このページは、大もとの機械データ (正本) から自動で組み立てられています。構造は機械が自動で検査し、内容が元データに忠実かは独立のレビューで確かめます。
