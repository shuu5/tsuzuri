# 判断の記録 ADR-1073 — 器 scribe2 の判断の記録 ADR-0073 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1073
title: "退避の猶予の起点は合図の記録 — 猶予は席が退避の合図を受けた時刻から数え、 群の記録が古い周も記録の無い群の周も合図が先で /exit は猶予の後 (ADR-1071 の起点の読みを部分 supersede)"
status: accepted
date: 2026-09-26
context: |
  ADR-1071 は退避を二段 (合図 → 猶予 → /exit) にし、 猶予の起点を群の記録の時刻に置いた。 群の記録が猶予より古いまま席がその群に入ると (群の宣言の編集・記録の無い群)、 猶予は最初から過ぎており合図なしで /exit が飛ぶ。 2026-09-26 の群の再編で 2 席がこの形で落ちた。 本 ADR は起点を「席に合図を書いた時刻」に改める。
  なぜこの判断が要るのかを、 経緯 (二段の退避と猶予の起点)・事象 (群の再編で 2 席が合図なしで即 /exit された)・機序 (起点が群の記録の時刻だと席が群に入った時刻を器が知らない)・これまでの決まり・この判断の範囲の 5 つから説明します。 前の決定 (ADR-1071) が防ごうとした「走行中の subagent を落とす」害が、 席が後から群に入る周にはそのまま残っていました。
  CTX1 経緯 — 二段の退避と猶予の起点 (ADR-1071・設計 §13)
  ADR-1071 は群が別の口座へ移った周の退避を二段にした。 古い席へまず退避の合図（移るための席への 1 行）の 1 行を送り、 rules 行 seat.move_grace_s (既定 1800 秒) の猶予を越えた周にだけ /exit を送る。 猶予の残りは 1 関数が「群の記録の時刻 + 猶予 − 今」で読み、 合図の記録（合図を送った印） (席の状態の dir の 1 行・群の記録の時刻) が同じ時刻を持てば合図を送り直さない。 tick の移動の門（移る周の tick の段）は「残りが無い → /exit」を先に判じ、 次に「送った → 待つ」、 残りは「合図を送る」の順。 群の段の続きの周（群の段の 2 周目以降）は群の記録（群の今の口座の控え） 1 つで残りを読み、 群の全席に一括で /exit を送るか送らないかを選ぶ。
  CTX2 事象 — 群の再編で 2 席が合図なしで即 /exit された
  2026-09-26T09:40Z に持ち主の求めで群の宣言を編集し、 置き場 2 つを Tier1 から Tier2 へ移した。 Tier2 の記録は前日の移動の時刻 (2026-09-25T02:19:50Z) のままだったので、 移した 2 席の tick は次の周で「残りが無い」と読み、 合図を送らず /exit を送って新しい口座で起こし直した (09:42Z・tick-last は decision=move が 2 周・合図の記録は前の群の時刻のまま)。 席が subagent を回していれば落ちていた形で、 ADR-1071 が防ごうとした害がそのまま残っていた。
  CTX3 機序 — 起点が群の記録の時刻だと、 席がその群に入った時刻を器が知らない
  群の記録の時刻は「群が移った時刻」であって「この席に合図を書いた時刻」ではない。 席が後からその群に入る周 (宣言の編集・記録の無い群 (種) に席が加わる周) は、 記録の時刻からの経過が席の実際の待ちと無関係になる。 同じ理由で、 席が入力欄の門や dialog で合図を受け取れなかった周の分だけ猶予が削られ、 合図の字面の「<秒> 秒の後に /exit」が席の側では守られない (合図が 20 分遅れれば残りは 10 分)。
  CTX4 憲法と既存の決定の向き (本 ADR の解釈)
  C2 (経路は 1 本) から、 猶予の判定と合図の記録の書き手・読み手は 1 関数のままで、 tick と群の段が同じ記録を読む。 C10 (宣言値・実測値・導出値を分ける) から、 猶予は rules 行の宣言値、 起点は器が合図を書いた実測の時刻、 残りは導出値で、 合図の記録に残りの秒を写さない。 C17 (決定はしご) から、 起点を 2 つ (記録の時刻と合図の時刻) 持って遅い方を採る形は 1 つで足りるので採らない。 N2 (散文の規則は規則でない) から、 再編のたびに記録を書き直す運用の手順は規則にならない。
  CTX5 射程 — 動かすのは猶予の起点・合図の記録の形・tick の分岐の順・群の段の続きの周の 4 か所
  動かすのは (1) 猶予の起点 (群の記録の時刻 → 合図の記録の時刻)、 (2) 合図の記録の形 (1 行に移り先・群の記録の時刻か種の印・書いた時刻の 3 つ)、 (3) tick の移動の門の分岐の順 (猶予 0 → /exit、 同じ移動の記録が在る → 残りで待つか /exit、 無い → 合図が先・記録の古さと種は分岐に入らない)、 (4) 群の段の続きの周 (席ごとに記録を読み、 残りの無い席にだけ /exit)。 動かさないのは、 合図の字面・rules 行の値と読み・手の語・判定の列の順・起こし直し・群の記録の形と書き手。
  （選択肢を測るものさし）この判断を評価する 4 本のものさしです。 合図の無い /exit を無くすこと (どの経路でその群に入った席も /exit の前に合図と猶予を持つ)。 猶予が席の実際に待てる時間であること (合図の字面の秒と器の /exit の時刻が揃う)。 限度を越えた口座で動き続ける時間の上限は保つこと (合図から猶予を越えた周は今どおり /exit)。 経路は 1 本のままであること (判定と記録の書き手・読み手はそれぞれ 1 関数で、 tick と群の段が同じ記録を読む)。
  DR1｜合図の無い /exit を無くす — どの経路でその群に入った席も、 /exit の前に必ず合図と猶予を持つ CTX2・CTX3
  DR2｜猶予は席が実際に待てる時間にする — 合図の字面の「<秒> 秒の後」と器の /exit の時刻を一致させる CTX3・CTX4
  DR3｜限度を越えた口座で動き続ける時間の上限は保つ — 合図から猶予を越えた周は今どおり /exit を送る CTX1・CTX4
  DR4｜経路は 1 本のまま — 猶予の判定と記録の書き手・読み手はそれぞれ 1 関数で、 tick と群の段が同じ記録を読む (C2・C17) CTX4・CTX5
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 合図の記録は 1 行 3 つの欄 (移り先の口座・群の記録の時刻か種の印・合図を書いた時刻) になり、 猶予の残りは合図を書いた時刻から数えます。 管理 tick の移動の門は「猶予 0 → /exit」「同じ移動の記録が在る → 残りで待つか /exit」「記録が無い → 合図が先」の順で判じ、 群の記録の古さと種は分岐に入りません。 群の段の続きの周は席ごとに記録を読みます。 支えるのは FR1038 (群の逼迫の通知と移動) の根拠と FR1027 (管理 tick) への主張です。
  採用 — OPT1
  器 SHALL 合図の記録 (席の状態の dir の move-signal) を 1 行 3 つの欄 — 移り先の口座・群の記録の時刻か種の印・合図を書いた時刻 (epoch 秒) — で持ち、 書き手 SHALL 1 関数、 読み手 SHALL 1 関数で、 3 つが揃わない行・書いた時刻が整数でない行・前の版の形の行は記録なしと読む。 「同じ移動」は移り先と群の記録の時刻の等値とする。 猶予の残り SHALL 合図を書いた時刻 + 猶予 − 今 が正ならその秒、 猶予 0 と越えた周は無し、 で、 群の記録の時刻は残りに入らない。 管理 tick（席を周期で見る仕組み） の移動の門 SHALL (a) 猶予 0 の周は今の形で /exit を送り、 (b) 同じ移動の記録が在る周は残りが在れば待ち (0 key・lock を取らない・file を書かない)、 無ければ lock の内側で /exit を送り、 (c) 記録が無い・別の移動・読めない周は入力欄が空なら合図を送り、 送れた周だけ今の時刻で記録を書く。 群の記録の古さと種は分岐に入らない。 群の段 SHALL 移動の周に送達を確認した席ごとに今の時刻で記録を書き、 続きの周は席ごとに記録を読んで同じ移動で残りの無い席にだけ /exit を 1 回送り、 残りが在る席と記録の無い席には送らない (記録の無い席は tick が合図する)。 合図の字面・rules 行 seat.move_grace_s・手の語・判定の列の順・群の記録の形と書き手は変えない。 本 ADR は ADR-1071 の「猶予の起点は群の記録の時刻」の読みを置き換え、 要件書は変えない (FR1038 / AC1041 の範囲)。
  （平易）器は合図の記録 (席の状態の dir の 1 行の file) に、 移り先の口座・群の記録の時刻か種の印・合図を書いた時刻の 3 つを持ちます。 書き手も読み手も 1 関数で、 3 つが揃わない行・時刻が整数でない行・前の版の形の行は「記録なし」と読みます。 「同じ移動」は移り先と群の記録の時刻が同じことです。 猶予の残りは「合図を書いた時刻 + 猶予 − 今」が正ならその秒で、 猶予 0 と越えた周は無し、 群の記録の時刻は残りに入りません。 管理 tick の移動の門は、 猶予 0 なら今の形で /exit、 同じ移動の記録が在れば残りが在る間は待ち (何も送らず lock も取らず file も書かない) 無ければ lock の内側で /exit、 記録が無い・別の移動・読めない周は入力欄が空なら合図を送り送れた周だけ今の時刻で記録を書きます。 群の記録の古さと種は分岐に入りません。 群の段は移動の周に送達を確認した席ごとに今の時刻で記録を書き、 続きの周は席ごとに記録を読んで残りの無い席にだけ /exit を 1 回送り、 残りが在る席と記録の無い席には送りません。 合図の字面・rules 行・手の語・判定の列の順・群の記録の形は変えません。 この記録は ADR-1071 の起点の読みを置き換え、 要件書は変えません。
  （理由）起点を合図の記録の時刻にするのは、 群の記録の時刻が「群が移った時刻」であって「この席に合図を書いた時刻」ではなく、 席が後から群に入る周や合図を受け取れなかった周に、 席の実際の待ちと無関係になるからです。 合図の記録に書いた時刻を持たせれば、 器が席に伝えた時刻を起点にでき、 記録が無い周は「まだ伝えていない」として必ず合図が先になります。 群の記録の書き直しの運用は散文の手順で規則にならず、 記録の意味 (移った時刻) も壊れます。 起点を 2 つ持って遅い方を採る形は、 記録が古い周には結局合図の時刻しか効かないので 1 つで足ります。 群の宣言の編集を器の口にする形は口が増え、 記録の無い群の周と合図が遅れた周の問題が残ります。 rules 行の値・合図の字面・手の語・判定の列の順を変えないのは、 直すのは起点の読みだけで、 二段の退避の形 (ADR-1071) はそのまま正しいからです。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1038（rationale）: FR1038 (群の逼迫の通知と移動) は移った群の古い席に退避の合図が届き新しい口座の席が起こされると書く。 本 ADR は「どの経路でその群に入った席も合図が先で /exit は猶予の後」の根拠と、 猶予の起点 (合図の記録の時刻) を与える。
  FR1027（claim）: FR1027 (管理 tick) の移動の周は打刻を読まず自席に退避を撃つ。 本 ADR はその周の 3 分岐の順を改め (猶予 0 → 記録の有無と残り → 合図)、 判定の列の順と打刻を読まない形は変えないと主張する。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録は ADR-1071 の「猶予の起点は群の記録の時刻」の読みだけを置き換え、 二段の退避・rules 行の値・合図の字面・合図の 1 回性・手の語は保ちます。 ADR-1066 の判定の置き場、 ADR-1067 の起こし直し、 ADR-1069 の移り先の鍵と予約も保ちます。 行き着く原則は「待つ時間は、 器が相手に伝えた時刻から数える。 伝えた記録が無ければ、 先に伝える」です。
  改訂状態: current
  置き換える ADR: ADR-1071
  置き換えられた: なし (現行)
  部分 supersede で、 置き換えるのは 1 つ — ADR-1071 の「猶予の起点は群の記録の時刻」の読み (合図の記録の時刻に改める) — で、 他は保つ。 保つのは、 ADR-1071 の二段の退避 (合図が先・/exit は猶予の後)・rules 行 seat.move_grace_s の値と読み・合図の字面・合図の 1 回性・手の語 (signal / wait)・打刻を読まない移動の門、 ADR-1066 の判定の置き場、 ADR-1067 の起こし直し、 ADR-1069 の移り先の鍵と予約、 の全部。
  照会終端 — PRIN-GRACE-STARTS-WHEN-THE-SEAT-IS-TOLD
  待つ時間は、 器が相手に伝えた時刻から数える。 伝えた記録が無ければ、 先に伝える。
  本 ADR が群の記録の時刻・記録の書き直しの運用・起点の 2 本立て・器の口の追加を退け、 合図の記録に書いた時刻を起点にしたのはこの原則に行き着く (これ以上は遡らない照会終端)。
options:
  - id: "OPT1"
    name: "起点を合図の記録の時刻にする — 記録に書いた時刻を持たせ、 無ければ必ず合図が先"
    text: |
      合図の記録を「移り先・群の記録の時刻か種の印・書いた時刻」の 3 つにし、 猶予の残りは「書いた時刻 + 猶予 − 今」で読む。 tick は同じ移動の記録が無ければ記録の古さに依らず合図を送り、 記録が在れば残りで待つか /exit を送る。 群の段の続きの周は席ごとに記録を読む。 決め手は分析 (起点が席の実測になる)。
      （平易）合図の記録に「いつ合図を書いたか」を持たせ、 猶予をその時刻から数える案です。 記録には移り先の口座・群の記録の時刻 (無ければ種の印)・書いた時刻の 3 つを書き、 同じ移動の記録が無ければ器は記録の古さに関係なく先に合図を送ります。 記録が在れば残りの秒で待つか /exit を送ります。 群の段の続きの周も席ごとに記録を読みます。 どの経路で群に入った席も合図と猶予を持ち、 猶予が席の実際の待ちと一致し、 上限は保たれ、 判定と記録は 1 関数ずつのままである点で勝ります。 代わりに、 前の版の記録は「無い」と読むので版の入れ替えの直後に合図が 1 回重なり、 群の段の判定が 1 席ずつになります。 分析で選びました。
      利点: どの経路でその群に入った席も /exit の前に合図と猶予を持つ (DR1)
      利点: 猶予が席の実際の待ちと一致し、 合図の字面の秒と器の /exit の時刻が揃う (DR2)
      利点: 合図から猶予を越えた周は今どおり /exit が届き、 上限は保たれる (DR3)
      利点: 判定・書き手・読み手は 1 関数ずつのままで、 rules 行も字面も変えない (DR4)
      欠点: 合図の記録の形が変わり、 前の版の記録は「無い」と読むので、 移行の周に合図が 1 回重なる (害なし)
      欠点: 群の段の続きの周が席ごとに記録を読む分、 群の段の判定が 1 席ずつになる
    verdict: adopted
    reason: "決め手は分析 (起点が席の実測になる)。"
  - id: "OPT2"
    name: "群の宣言を編集するたびに群の記録の時刻を今で書き直す運用"
    text: |
      器は変えず、 再編の手順に「先に移り先の記録を書き直す」を加える。 決め手は分析 (手順は規則でない)。
      （平易）器は変えず、 群の宣言を編集する手順に「先に移り先の記録の時刻を今で書き直す」を加える案です。 器に足すものが無い点で勝ります。 けれども、 散文にしか無い手順は規則として扱えず、 忘れれば同じ事故が起きます。 記録の時刻は「移った時刻」なので書き直すと履歴の意味が壊れ、 記録の無い群には書き直す記録がありません。 退けました。
      利点: 器に足すものが無い
      欠点: 散文にしか無い手順は規則として扱えず、 忘れれば同じ事故が起きる (N2・DR1)
      欠点: 記録の時刻は「移った時刻」で、 書き直すと履歴の意味が壊れる (C10)
      欠点: 記録の無い群 (種) には書き直す記録が無い (DR1)
    verdict: rejected
    reason: "決め手は分析 (手順は規則でない)。"
  - id: "OPT3"
    name: "群の記録の時刻と合図の記録の時刻の遅い方を起点にする"
    text: |
      起点を 2 つ持ち、 遅い方から猶予を数える。 決め手は分析 (1 つで足りる)。
      （平易）群の記録の時刻と合図の記録の時刻の 2 つを持ち、 遅い方から猶予を数える案です。 前の版の読みを残せる点で勝ります。 けれども、 記録が古い周は必ず合図の時刻が遅い方になり、 記録の時刻は起点に効きません。 2 つ持つ理由が無く、 判定の入力が 2 つになると tick と群の段の読みが揃いにくくなります。 退けました。
      利点: 前の版の読みを残せる
      欠点: 記録が古い周は必ず合図の時刻が遅い方になり、 記録の時刻は起点に効かない。 2 つ持つ理由が無い (C17・DR4)
      欠点: 判定の入力が 2 つになり、 tick と群の段の読みが揃いにくい (DR4)
    verdict: rejected
    reason: "決め手は分析 (1 つで足りる)。"
  - id: "OPT4"
    name: "群の宣言の編集を器の口にして、 口が記録を書き直す"
    text: |
      置き場を別の群へ移す口を器に足し、 その口が移り先の記録を今の時刻で書く。 決め手は分析 (口が増える)。
      （平易）置き場を別の群へ移す口を器に足し、 その口が移り先の記録を今の時刻で書く案です。 手順でなく器が守る点で勝ります。 けれども、 口が 1 つ増え (群の宣言の編集は今のところ host の面の file の編集だけで足りている)、 記録の無い群には書き直す記録が無いので種の周の事故は残り、 席が合図を受け取れなかった周の分だけ猶予が削られる問題も残ります。 退けました。
      利点: 手順でなく器が守る
      欠点: 口が 1 つ増え、 群の宣言の編集は今のところ host の面の file の編集だけで足りている (C17)
      欠点: 記録の無い群 (種) には書き直す記録が無く、 種の周の事故は残る (DR1)
      欠点: 席が合図を受け取れなかった周の分だけ猶予が削られる問題 (CTX3) は残る (DR2)
    verdict: rejected
    reason: "決め手は分析 (口が増える)。"
basis: [FR1027, FR1038, AC1041, ADR-1058, ADR-1066, ADR-1067, ADR-1069, ADR-1071]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「席」は人と AI が話す 1 つの session、 「群」は同じ口座の候補を共に使う project の集まり、 「退避の合図」は群が別の口座へ移った周に古い席へ送る 1 行、 「猶予」は合図から /exit までの待ち時間です。 前の決定 (ADR-1071) は退避を二段 (合図 → 猶予 → /exit) にしましたが、 猶予を「群の記録の時刻」から数えていました。 群の記録が古いまま席がその群に入ると (群の宣言を編集して置き場を移す・記録の無い群に席が加わる)、 猶予は最初から過ぎており、 合図なしで /exit が飛びます。 2026-09-26 の群の再編で 2 席がこの形で落ちました。 この記録は、 猶予を「その席に合図を書いた時刻」から数えると決めます。 合図の記録に書いた時刻を持たせ、 記録が無ければ器は必ず合図を先に送り、 /exit は合図の時刻 + 猶予 を越えた周にだけ送ります。
approval:
  who: 持ち主
  date: 2026-09-26
  ruling: "t3-hub.74.60.1:20261004T0113Z-1（取り込みの裁定・器の記録は器の台帳の裁定 id を名指さない）"
  verbatim: "tsuzuri の台帳 t3-hub.74.60.1 の notes に在る（この file に写さない・器の記録は器の台帳の裁定 id を名指さない）"
  surface: R-8
consequences:
  - "この判断で良くなること 3 つと、 代わりに引き受けること 3 つです。 良くなるのは、 どの経路で群に入った席も /exit の前に合図と猶予を持つこと、 猶予が席の実際の待ちと一致すること、 判定と記録の書き手・読み手が 1 関数ずつのままで rules 行も字面も変わらないことです。 引き受けるのは、 前の版の記録を「無い」と読むので版の入れ替えの直後に合図が 1 回重なること、 限度を越えた口座で動き続ける時間が「合図が届くまでの遅れ + 猶予」になること、 同じ群の席が別々の周に /exit を受けることです。"
  - "良い結果: 群の宣言の編集や記録の無い群への参加でその群に入った席も、 /exit の前に合図と猶予を持つ"
  - "良い結果: 猶予が席の実際の待ちと一致し、 合図の字面の「<秒> 秒の後」と器の /exit の時刻が揃う"
  - "良い結果: 猶予の判定と記録の書き手・読み手は 1 関数ずつのままで、 rules 行・合図の字面・手の語は変わらない"
  - "代償: 前の版の合図の記録は「無い」と読むので、 版の入れ替えの直後に移動中の席には合図が 1 回重なる (害なし)"
  - "代償: 席が合図を受け取れる状態になるまで猶予が始まらないので、 限度を越えた口座で動き続ける時間は「合図が届くまでの遅れ + 猶予」になる"
  - "代償: 群の段の続きの周は席ごとに記録を読むので、 同じ群の席が別々の周に /exit を受ける"
note: |
  器の元の file: scribe2/design-intent/decisions/ADR-0073-move-grace-counts-from-the-notice-mark.html
  器の表紙の頭: 設計判断記録 (ADR) scribe2 — 退避の猶予の起点
  器の表紙: 状態accepted選択肢4件 (OPT1–OPT4)結果良い 3 / トレードオフ 3版v0.1.0 / 2026-09-26
  器の表紙: 正当化する要件: SRS-SCRIBE2-MVP の FR1038・FR1027
  器の表紙: 想定読者: scribe2 の開発 session と user — 器の内部と Rust の専門知識は不要 (専門語はやさしい言葉を併記)
  器の承認の欄: 設計 (orchestrator)・orchestrator・2026-09-26 草稿 v1 (群の再編の直後に 2 席が合図なしで即 /exit された事象を現物 (猶予の 1 関数・合図の記録・tick の移動の門・群の段の続きの周) で再現し、 起点の読みを改めた。 持ち主の裁定は不要 (憲法の Ask-first の 3 クラスに当たらない・値の変更なし)。 拘束する constitution の版 0.5.0)・作成
  器の案の章の要約: 候補を 4 つ並べます。 起点を合図の記録の時刻にする案 (選んだ案)、 群の宣言を編集するたびに群の記録の時刻を書き直す運用の案、 群の記録の時刻と合図の記録の時刻の遅い方を起点にする案、 群の宣言の編集を器の口にして口が記録を書き直す案です。 選ばなかった 3 つは、 手順は規則でない・1 つで足りる・口が増えて種の周は残る、 という理由で退けました。
  器の専門語の説明: 本文に出てくる専門語 8 個を、 やさしい言葉で説明します。
  ・退避の猶予（move grace）: 群が別の口座へ移った席へ、 器が /exit を送るまでの待ち。 rules 行 seat.move_grace_s (整数の秒・既定 1800) が持つ。 本 ADR で起点は合図の記録に書いた時刻になる。 0 は待たない。
  ・合図の記録（notice mark）: 席の状態の dir に置く 1 行の file。 本 ADR で移り先の口座・群の記録の時刻か種の印・合図を書いた時刻の 3 つを持つ。 同じ移動の記録が在れば合図を送り直さず、 猶予はその時刻から数える。
  ・退避の合図（evacuation notice）: 群が別の口座へ移った周に古い席の入力欄へ注入する 1 行。 新しい subagent を起こさず今の作業に区切りをつけ作業記憶を残すよう案内し、 残りの秒を載せる。 字面は本 ADR で変えない。
  ・群の記録（group record）: host の群用 dir に群ごとに高々 1 つ置く file (口座・時刻・理由・前の口座)。 移動の周に器が書く。 本 ADR でその時刻は猶予の起点でなくなり、 同じ移動を見分ける鍵にだけ使う。
  ・群の種（group seed）: 群の記録がまだ無い群の今の口座 (宣言順で決まる)。 前の版は種の群の席を猶予なしで /exit していたが、 本 ADR では種でも合図が先になる。
  ・移動の門（move gate）: 管理 tick の判定の列のうち、 群の記録の口座と自席の登録 row の口座が違う周に自席へ退避か起こし直しを撃つ段 (ADR-1066)。 本 ADR で 3 分岐の順が「猶予 0 → 記録の有無と残り → 合図」になる。
  ・続きの周（continuation round）: 群の段 (便の終端の周) が、 移った後に shell へ戻らない席を見る周。 本 ADR で席ごとに合図の記録を読み、 残りの無い席にだけ /exit を送る。
  ・管理 tick（management tick）: 席の外から周期 (rules 行 1 本・既定 15 秒) で回り、 死んだ席を起こし直し、 移動の周に退避を撃ち、 黙った席へ合図を送り、 群の移動の判定を撃つ仕組み (ADR-1058・ADR-1066)。
  器の頁の末: このページは、大もとの機械データ (正本) から自動で組み立てられています。構造は機械が自動で検査し、内容が元データに忠実かは独立のレビューで確かめます。
