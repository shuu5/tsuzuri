  - id: c
    name: 乙 — 条 P-28 を廃止の状態にし、P-28 の次の番号の新しい条に契約の置き場を立てる
    text: 条 P-28 は status を廃止にして番号を空け、次の番号の新しい条に決定 (1)〜(3) の規範文を置く。条 P-5.1 は甲と同じに改める。
    verdict: rejected
    reason: 条の id の意味は 1 つのまま保てる。しかし残りのノートの廃止の決まり（P-28.1）と逃げ道の禁止（P-28.4）と上限（P-28.2）が条 P-28 の廃止と同時に消え、退けまでの間に R-31〜R-33 が規範文の無い規則として残る。塞ぐには新しい条に同じ字を写すことになり、甲の量に番号の替えが足される。甲は旧規範文の id の意味を替えずに字だけを改め、新しい字を P-28.6 以降に足すので、条 P-3.1 にも当たらない。
  - id: d
    name: 丙 — 条を改めず、契約を bead に置くのを読みで済ませる
    text: 条 P-28 と P-5.1 の字を替えず、この記録の決定で契約の置き場を bead と読む。
    verdict: rejected
    reason: 条 P-28.2 の上限と P-5.1 の「拘束するのは設計文書」が字のまま残り、契約が字の外に在ることを記録の散文だけが言う形になる（条 N-2.1）。条 A-2.2 は字の替わらない変更を改訂と扱わない。
  - id: e
    name: 丁 — 契約を bead にも置き、設計ノートも残して両方を書く
    text: 設計ノートの行を残し、bead にも同じ契約を写して器は bead を読む。
    verdict: rejected
    reason: 同じ契約を 2 つの面が持ち、人が両方を書く（条 P-2.4）。ノートの commit が残るので載せ替えの 81 回も設計の commit の 355 本も減らない。
  - id: f
    name: 戊 — 承認の前に移しの口まで流し、切り替えも急ぐ
    text: 器の移しの口の行を承認より先に流し、承認の日に切り替える。
    verdict: rejected
    reason: 移しの口は契約の正本を替えないので先に流すこともできるが、持ち主が乙か別の形を選ぶか、上限の値を替えると器の行が無駄になるか直しが要る。改めの前に流すのは、どの案でも要る preflight の口と終えの門と字の照らしの 3 本に限る。承認を待つ費えは移しの口の 6 本の便の待ちである（日数は測っていない・U）。
