  - 置く行は 12 本（承認の時の数え・切り替えの前の行が下の項の 11 本になり、数えは 17 本）。改めの前の 3 本（v-pf-contract・t-stop-preflight・v-pf-literal）、承認の後で切り替えの前の 6 本（v-bead-intake・v-bead-dispatch・v-bead-ledger・t-graph-bead・t-prose-bead・t-plan-cap）、最後のノートの廃止の後の退けの 2 本（v-table-retire・t-derive-retire）と、切り替えの設計の commit。
  - 決定 (6) が名指す承認の後に流す行は 6 本だが、移しの起草で足りない読みの口が見つかり、切り替えの前に着地させた行は 11 本（v-bead-intake・v-bead-dispatch・v-bead-ledger・t-graph-bead・t-prose-bead・t-plan-cap・t-code-bead・v-bead-reads・v-bead-precheck・v-bead-reads-b・v-bead-trailer）である（ノート（surface-v4a） の第 0.21 版と第 0.23 版・決定 (6) の字は替えない）。
  - 契約の git の履歴を失い、台帳（Dolt）の履歴が代わる。欄ごとの差を読む命令は U。folio の頁の契約の表は退けで消え、board が台帳から描く（t-graph-bead・切り替えの前に着地させ、board が bead の契約を描かない期間を作らない）。
  - 並ぶ間（移しの口の着地から退けまで）、器は契約表と bead の 2 形を読む。2 形を読む口は退けの行で 1 形に戻す。
  - 増殖の防止の機構は、設計ノートの数の床から、開いた契約の bead の本数・本文と acceptance の byte・計画の memo の本数の deny に移る。値は持ち主が決め、緩める時は条 P-28.3 と P-17.4 に従う。
  - 散文の門（R-16）の母集団は、設計ノートの節から契約の bead の本文へ移る。条 N-2 の機構の注は第 1.6 版で書き直す（amends の差の照らしの外・席が確かめる）。
  - 台帳の書きが日に約 36 件増える（I）。契約の書きは台帳の書きの包みを通し、錠と順は行（v-bead-intake） の起草の前に決める（決定 (9)）。
  - 反対側からの検証（条 A-2.3）は検証役（v322g）の 1 巡で、欄 grill に書いた（docs/grill/2026-10-06-ADR-74-grill.md）。
  - 上限の写しの規則の行は R-43（開いた契約の bead の本数・40 本）・R-44（bead の本文 64 KB と欄 acceptance 24 KB）・R-45（開いた計画の memo の本数・4 本）。値は持ち主の裁定（t3-hub.92.7.2）の推奨の値で、R-43 と R-44 の値の正本は行（v-bead-intake）が足す器の rules の行（決定 (3)）。
