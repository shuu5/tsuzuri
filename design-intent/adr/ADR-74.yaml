  when: 2026-10-06
  who: 検証役 v322g（AI・起草者と別の独立の文脈・読み取りだけ）
  where: docs/grill/2026-10-06-ADR-74-grill.md
  summary: 検証役 v322g が係 w320a の下書き（この記録・計画・持ち主への問い）を 1 巡攻めた。判じは直してから問う（番号つきの所見 27 件・重いと印した物 3 件・直す字 9 つ）。commit の数は合ったが、撃ち直しが同じ割合（4 割）で減るという主張は測りで否定され（範囲が設計の commit だけの載せ替えは 339 回のうち 81 回・24%）、撤退 (1) は初日に当たり、amends が P-28.4 の strength を落とし、失う物に散文の門（R-16）・章の上限（R-26）・計画だけの行の上限（R-33）・契約 id の重なりの照らしが無く、上限を bead の側へ移す削らない案が無い、と見た。係 w324a が数を測り直し、上限と照らしを bead の側の機械の縛りへ移す形を案 甲にして先に置き、旧 P-28.1〜P-28.5 の主題を同じ id に残して新しい字を P-28.6〜P-28.9 に新設し、撤退 (1) を物差し m1 と m2 に替え、断りの語と digest の測る口を字で名指した。直す字 9 つのうち 8 つを直し、残る 1 つ（bd の大きさ・1 回の書き・整形・錠）は決定 (9) に U として残した。ほかの所見で映さなかったのは 4-6（本文の字の escape は行 v-bead-dispatch の起草へ送る）。直した字は席が所見と照らした（D-10・2 巡目の検証役は置かない）。
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo（t3-hub.92.7）か後継の memo の notes に、撃った命令と数を記帳する。問う相手は持ち主。数は器の event log（fleet の events.jsonl）・台帳・main の git の log の完全な記録から出し、途中の記録を丸めない。窓は条件ごとに書く。今の数（2026-09-27 から 2026-10-06 の 10 日）を並べる。
    物差し（m1）（設計だけの載せ替え）: 窓の中の event の RunStage で detail が rebase: か stale: の物の範囲（<base>..<main>）を命令（git rev-list --first-parent <main> ^<base>）で開き、範囲の commit が全部、触る file が 設計ノートの dir（design-intent/design-note/）・contracts/・docs/design/patch/ だけの回を数える。今 83 回（rebase 81・stale 2）＝7 日あたり約 58 回。
    物差し（m2）（設計だけの commit）: 窓の中の main の first-parent の commit のうち、触る file が同じ 3 つの dir だけの本数。今 495 本＝7 日あたり約 346 本。
    物差し m3（載せ替えの率・記帳だけ）: stage Implemented で detail が rebase: の event の数 ÷ stage Implemented で detail の無い event の数。今 339/604（56%）。段（S4） が動かすのは（m1） の分だけで、着地の数に引きずられるので、撤退の閾値には使わない。
    (1) 窓 A＝最後の生きた設計ノートを廃止にした commit の時刻から 7 日。移しの間（切り替えから最後の廃止まで）の（m1） と（m2） は記帳するが、残りのノートの行の直しと廃止の commit を含み設計どおりなので数えに入れない。窓 A で（m1） が 6 回以上（今の 7 日あたりの約 1 割）か、名（m2） が 10 本以上（今の約 3%）なら、契約を bead に置く形がまだ main を動かしているので、形を問い直す（ADR-72 の撤退 (1) の D1 の部分を、数え方を名指して引き継ぐ）。
    (2) 窓 B＝切り替えの設計の commit の時刻から 14 日。器の event log の IntakeRefused で refuse が（contract-bead-unreadable） の event を、bead の id で重ねずに数える。3 本以上の bead に在ったら、bead の欄の形（決定 (1)）を問い直す。同じ窓で（contract-bead-both-forms） が 1 本でも在れば、移しの手順を問い直す。
    (3) 窓 C＝切り替えから退けの行の着地の後 7 日まで。審査の event の detail に器が書く「審査が読んだ材料の digest」と「写しの digest」が食い違う event が 1 件でも在ったら、写しの形（決定 (2)）を問い直す。
    (4) 切り替えから 21 日を過ぎても生きた設計ノートが残っていれば（folio の床の数え live-notes が 1 以上）、残りの行を bead へ移すか（契約 id が替わり条 P-3.1 に当たる）を問う。
    (5) 窓 B で（contract-open-cap） か（contract-bytes-cap） の断りが 5 回以上在ったら、条 P-28.3 と P-17.4 に従って上限の値を問い直す（形は問い直さない）。
plain: |
  便（AI が code を直す 1 回の仕事）ごとの約束（契約）を、git の設計ノートでなく台帳（bead の記録）に置くと、2026-10-06 に決めています（決め D1）。この記録は、そのために憲法の 2 か所を直す提案です。
  1. 設計ノートの増え方を上限で縛る条（P-28）を書き替えます。約束は台帳の bead に置き、設計ノートは新しく作りません。今の上限が守っていた事（数・大きさ・文の検査・番号の重なり）は、台帳の側の機械の検査に移して残します。残るノートは、全部済んで廃止するまで今の上限で縛ります。
  2. 「開発を縛るのは設計文書」という条（P-5.1）に、「それに従って台帳に置いた便の約束」を足します。
  器（便を流す道具）は、便を起こす時に台帳から約束を読んで便の置き場に写します。写した後に台帳が直されても、走っている便の約束は替わりません。
  得る物は、約束を書くだけの git の記録（10 日で 355 本）が main から無くなり、それだけが原因の便の載せ替え（10 日で 81 回・全部の約 4 分の 1）が無くなることと、席の設計の記録の道具を退けられることです。撃ち直しが 4 割減るわけではありません。
  失う物は、約束の git の履歴（台帳の履歴が代わります）・folio の頁の約束の表（board が台帳から描きます）・道具の行 6 本の手間・台帳の書きと読みが増えることです。
