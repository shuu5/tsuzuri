note: 起草は係 w320a・直しは係 w324a（2026-10-06）。改めの欄（amends） は憲法の写しの欄（条の title・tier・binds・statements.order と、規範文ごとの text・pattern・strength）の差と 1 対 1 に並べた。替えない欄は、P-28 の tier（always）・binds（both）・statements.order（共通の id P-28.1〜P-28.5 の並びは替わらない）、P-28.1・P-28.3・P-28.5 の 3 欄、P-28.2 の強さ（strength）（must）、P-28.4 の pattern（ubiquitous）と強さ（strength）（must-not）、P-5 の tier・binds と P-5.1 の pattern・強さ（strength）。P-28 の mechanism と plain と relations.rules（新しい写しの規則の行を足す）と、条 N-2 の mechanism の注は、第 1.6 版で席が書き直す（amends の差の照らしの外）。数は係 w324a が origin/main 8a7f32a7・器の event log（2026-10-06 20:11 まで）・台帳（bd list --all --json）で数えた値で、332・597 は ADR-72 の時点の値、5 分と 0.5〜2.1 GB と 64/150 は ADR-72 の値を測り直していない。上限の推奨値 40 本・64 KB・24 KB は、今の最大 29 本・49.3 KB・19.2 KB に余地を足した見立て。
