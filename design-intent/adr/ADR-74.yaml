# 判断の記録 ADR-20 を丸ごと置き換える（ADR-72 の決定 (9)）。部分の置き換えは決定 (8)。前の記録の本文は替えない。
# 起草は係 w320a・直しは係 w324a（2026-10-06・検証役 v322g の grill の所見による直し）。検証役 v322g の所見と直しの対応は docs/grill/2026-10-06-ADR-74-grill.md。
# 持ち主の裁定 t3-hub.92.7.2 で発効（2026-10-06・案 甲と推奨の上限の値の全部）。ADR-20 は status を retired・superseded_by を ADR-74 にした（決定 (8)）。
id: ADR-74
title: 便の契約の正本を台帳の bead（欄 acceptance に契約の行・本文に設計の節）に置き、条 P-28 の上限と照らし（数・大きさ・散文の門・id の重なり）を bead の側の機械の縛りへ移し、器は便を起こす時に bead から読んで写し、設計ノートは新しく作らず退けまで今の上限で縛る（条 P-28 と条 P-5.1 の改め・規則の行 R-26・R-27・R-31・R-32・R-33 は退けの行の着地で廃止）
status: accepted
date: 2026-10-06
supersedes: ADR-20
context: |
  持ち主は 2026-10-06 に決め D1（契約の正本を台帳の bead に移し、設計ノートを退ける）を推奨のとおり決めた（判断の記録 ADR-72 の決定 (2)・記帳 t3-hub.91.4 notes 2026-10-06 08:11）。ADR-72 の決定 (10) は、条 P-28 の改めと規則の行 R-26・R-27・R-31・R-32・R-33 の退けを段（S4）で条 A-2 の手続きで行い、条 P-2.1 と P-5.1 の読みも同じ記録で照らすと書く。この記録がそれである。
  今の流れ（V・code の現物）。席が設計ノートの契約表の行を書き、tz derive が contracts/<ノート>.toml を導き、席の設計の commit が main へ入れる。器の受付と preflight は bead の acceptance の pointer（design = <doc>#<id>）で base の木の行を読み、契約 file を便の置き場に書く（pipe/cli/intake.rs）。器は main が動けば中身を問わず走っている便を載せ替える（pipe/follow_step.rs・pipe/follow.rs）。tsuzuri は folio の床が設計ノートの数を上限の行 R-31〜R-33 で数え（folio2 の note.rs）、散文の門（行 R-16）を設計ノートの節に撃つ（folio2 の prose.rs）。
  測った数（V は係 w324a が 2026-10-06 に origin/main 8a7f32a7 と器の event log と台帳で数えた・D は前の記録の値の写し・I は見立て）。
  ・main の first-parent の 09-27 からの commit 1,237 本のうち、触る file が設計ノートと contracts と差の file（docs/design/patch）だけの commit は 495 本（40%・V）。うち差の file を含む物 140 本（段 S2 で止まる）・件名に直しを持つ物 112 本（V）。差の file を含まない 355 本が段（S4） で main から消える分で、仕事としては台帳の書き（日に約 36 件）へ移る（V と I）。
  ・器の載せ替え（event の RunStage・detail rebase:）は 09-27 から 339 回。各回の範囲（rebase:<base>..<main>）を命令（git rev-list --first-parent）で開くと、範囲の commit が全部「設計ノート・contracts・差の file だけ」だった回は 81 回（24%）、ほかの commit を 1 本でも含む回は 258 回（76%・V）。範囲に別の commit が在れば main はどのみち動くので、設計の commit が無ければ消える載せ替えは最大 81 回（24%）である。載せ替えの率（rebase の回 ÷ 初回の実装＝stage Implemented で detail の無い event 604 回）は今 56%（339/604・V）で、81 回が消えても約 43%（258/604・I＝時刻のずれを無視した数え）までしか下がらない。前の下書きの「同じ割合（4 割）で減る」と ADR-72 の「約半分」はこの測りで否定される。撃ち直しを本当に減らす梃子は段（S5）（main の差が便の write-set の閉包に触れない時の撃ち直しを省く・ADR-72 決定 (7)）である（I）。
  ・載せ替え 1 回は約 5 分・0.5〜2.1 GB（D・ADR-72）。消える 81 回は 10 日で約 6.8 時間・約 41〜170 GB の書きに当たる（I＝D の 1 回の値を掛けた数）。
  ・契約の bead は 567 本で closed 559・open 6・deferred 2（V・bd list --all --json）。同時に開いていた契約の bead の数の最大は 29 本（2026-10-04・V・created_at と closed_at から数えた）。今の上限（生きたノート 6 本以下×1 本 32 行以下）は開いた数を直に数えないが、置く前に効いて積もりを止めている（I）。生きた設計ノートは今 6 本で上限ちょうど（V）。
  ・契約表の行 566 本で、bead の本文に移る節の本文（goal）は中央 8.9 KB・9 割 21.7 KB・最大 49.3 KB、欄 acceptance に移る部分（goal・section・depends を除いた欄）は中央 4.0 KB・9 割 7.5 KB・最大 19.2 KB（V・tomllib で読んだ値を字にした長さの近似）。今の台帳で最も大きい本文は 17.8 KB（V）で、49 KB を bd が持てるかは試していない（U）。
  ・席の設計の commit の道具（commit-design.sh）は 2026-09-30 から 2026-10-06 までに 9 回書き直された（V・席の道具の置き場の退けた写しの数）。適用の script は 35 本在る（V・同じ置き場）。
  ・契約の審査の非 PASS 150 回のうち 64 回は字の照らしで決まる型（D・ADR-72）。これを減らすのは行（v-pf-literal）（器）で、どの案でも改めの前に流すので、この記録の改めの理由には数えない。置く前の preflight に commit と写しが要らなくなる利益も行（v-pf-contract） で改めの前に得られるので、改めの理由に数えない。
  条との食い違い。条 P-28 は設計ノートを中間の文書として上限で縛り、契約表の行をノートに置く前提で書かれている。条 P-5.1 は開発を拘束するのを設計文書（design-intent）だけと書く。契約を bead に置くと、拘束する契約が design-intent の外に在り、条 P-28 の上限（R-31〜R-33）と章の上限（R-26）と散文の門（R-16）と契約 id の照らしが届かない所に契約が置かれる。前文の「増殖の防止」に機構を付けたのが ADR-20 で、上限を捨てて移すとその機構が契約については 0 になる。条 P-2.1（設計文書の正本は YAML の 1 file）は設計文書の決まりで、契約を設計文書と呼ばない形にすれば字は替えずに合う（決定 (4)）。
decision: |
  (1) 契約の置き場。新しい便の契約は台帳の bead 1 本に置く。契約の行（欄 id・title・req・write-set・verify・size・growth・done・done-teeth・touches ほか、今の契約表の行の欄から section と depends と goal を除いた物）は、契約表の導出の形の [[contract]] の 1 行の字で、bead の欄 acceptance に置く。設計の節の本文は bead の本文（description）に置く。便の順は bead の依存（blocks）で持ち、欄 depends は使わない。器は acceptance に design = <doc>#<id> の行が在れば今の契約表を、[[contract]] の行が在れば bead を読み、両方を持つ bead は断りの語（contract-bead-both-forms） で断る。acceptance と本文は 1 回の bd update（--acceptance と --body-file を同じ命令に渡す）で書き、器は 1 回の bd show の読みから両方を取る。
  (2) 器の読み。器の受付は便を起こす時に bead を 1 回読み、契約の行に本文を goal として足した 1 行の toml を便の置き場に写し、契約の pointer をその写しの絶対 path にする（審査の材料・裁定の照らし・行の読み直しは今の table::read の 1 本で写しを読む）。写しの後に bead が替わっても走っている便の契約は替わらない。列外の鍵（審査の FAIL の後に起こし直すかの鍵）は、bd show の返す acceptance の字と本文の字を、字を整えずにそのまま繋いだ物の digest で、どちらかが替われば起き直る。器は審査の時に、審査が読んだ材料の digest と写しの digest を審査の event の detail に書く（撤退 (3) の測る口）。名が base に解けるか・大きさの上限の余地・ほかの便との交わりは、器が便を起こす時に撃ち直し、外れたら便を作らず設計係へ返す。bead を読めない時（toml として読めない・欄が欠ける・bd が答えない）は断りの語（contract-bead-unreadable） で断り、器の event log に受付の断り（IntakeRefused）として残す。
  (3) 上限と照らしの移し（削らない形）。条 P-28 の上限が守っていた物を、次の機械の縛りで bead の側に置く。値は規則の表の行に置き、持ち主が値を決める（この記録の問いで値を問う）。
  ・開いた契約の bead の本数（R-31 と R-32 が積もりを止めていた分）: 上限 40 本（推奨・今の最大 29 本の上）。器の受付と preflight が数え、越える置きは断りの語（contract-open-cap） で断る。値の正本は器の rules の行で、tsuzuri の規則の表に写しの行を足す（行 R-29 と同じ形）。持つ行は器の行（v-bead-intake）。
  ・bead ごとの本文と欄 acceptance の byte（R-26 の章の上限の分）: 本文 64 KB 以下・acceptance 24 KB 以下（推奨・今の最大 49.3 KB と 19.2 KB の上）。器の受付と preflight が数え、越える物は断りの語（contract-bytes-cap） で断る。持つ行は器の行（v-bead-intake）。本数と byte の 2 つで、毎周の台帳の読みの量も最大 40×88 KB に縛られる（I）。
  ・散文の門（R-16）: tz に散文の門を 1 つの file の字へ撃つ口を足し、契約の bead を作る・直す台帳の書きの門（起票の門・行 R-39 と同じ hook）と係の終えの門（行 t-stop-preflight）が、bead の本文の file に撃って落ちたら断る。持つ行は tsuzuri の行（t-prose-bead）。条 N-2 の機構の注は、第 1.6 版で「設計ノートの散文の門と、契約の bead の本文に撃つ散文の門（行 R-16）」に書き直す。
  ・契約 id の重なり（条 P-3.1）: 器の受付と preflight が、bead の契約の id が、契約表の全部の行（廃止のノートも含む）とほかの全部の契約の bead（閉じた物も含む）の id に無いことを照らし、在れば断りの語（contract-id-taken） で断る。持つ行は器の行（v-bead-intake）。退けの行（v-table-retire・t-derive-retire）は契約表の行の id の一覧を 1 file に凍結して残し、この照らしの母集団にする。
  ・計画だけの行（R-33）: 切り替えの後、契約になる前の計画は契約の bead でなく memo の bead に置く。開いた計画の memo の本数の上限 4（今の値のまま）を起票の門が数える。持つ行は tsuzuri の行（t-plan-cap）（memo の計画の印の形はその行の起草で決める・U）。
  ・計画のノートの名札（R-27）は、計画のノートが退けで無くなるので移す先が無い。退けの行で廃止にする。
  この縛りはどれも常の口で、「今回だけ」の口や無効化の旗を持たない（条 N-3.1）。値を緩める時は条 P-28.3 と P-17.4 に従う。
  (4) 条の改め（憲法 第 1.6 版）。条 P-28 は改めの欄（amends） のとおり、見出しを替え、規範文 P-28.2 を「設計ノートを退ける行が着地するまでのあいだ」の上限に、P-28.4 を bead の逃げ道も塞ぐ字に改め、P-28.6〜P-28.9（置き場・写し・bead の上限・置く前と起こす時の機械の照らし）を新設する。P-28.1・P-28.3・P-28.5 は字も段も強さ（strength） も替えない（残るノートの廃止の決まりと、上限を緩める手続きと、済んだノートの名指しは、そのまま bead の上限にも残るノートにも効く）。規範文の id の意味は替えない（条 P-3.1）。条 P-5.1 の字に、それに従って台帳の bead に置いた便の契約を足す。条 P-2.1 は替えない。契約は設計文書でなく台帳の記録で、正本は bead の 1 つ、便の置き場の写しは導出（条 P-2.3）と読む。この読みは条 P-5.1 の改めの字が持つ（条 N-2.1）。
  (5) 規則の行。R-31・R-32・R-33（ノートの数の上限）と R-26（ノートの章の上限）は、切り替えから退けまで今の値のまま deny で効き、条 P-28.2 の改めた字（退けの行が着地するまでのあいだ）がそれを名指す。退けの行（t-derive-retire）の着地の commit で R-26・R-27・R-31・R-32・R-33 を廃止の状態にする。切り替えの後はノートに行を足さないので、値は下げるだけで上げない。決定 (3) の上限の写しの行は、切り替えの設計の commit で持ち主の値の答えを裁定にして足す。
  (6) 段取り。改めの前に流す行は（v-pf-contract）（器）・t-stop-preflight（tsuzuri）・行（v-pf-literal）（器）で、どの案でも要り、契約の正本を替えない。承認の後に流す行は（v-bead-intake）・行（v-bead-dispatch）・行（v-bead-ledger）（器）と行（t-graph-bead）・行（t-prose-bead）・行（t-plan-cap）（tsuzuri）。切り替えの設計の commit は、この 6 本の着地と器の binary の入れ替えの後に、この記録（accepted・承認と grill の欄つき）・憲法 第 1.6 版・ADR-20 の status と superseded_by・決定 (3) の写しの規則の行を 1 つにする。条 P-28 の機構の注（mechanism）は、P-28.6〜P-28.9 を数える口が全部着地した後に版を上げるので、live: now のまま書ける。その日から新しい行は bead にだけ置き、ノートに行を足さない。生きたノートの行は着地まで今の形で流し、全部が着地したノートは条 P-28.1 で廃止にする。最後のノートの廃止の後に退けの行（v-table-retire・t-derive-retire）を流す。席の道具の commit-design.sh と適用の script と床の 6 本のうち契約のための物は、退けの行の着地の後に席の置き場で退ける（repo の外・N-1.1 に従い mv で残す）。
  (7) 移しの間の守りの時点。置き場の全部の行を読む口（審査の索引・table_rows ほか）は行（v-bead-ledger） の着地で bead の契約も読む。着地の時の rebase-stale-rows は main に入った行しか見ないので、bead の契約が着地で消えた path を名指しても着地の時には拾わず、便を起こす時の名の撃ち直し（決定 (2)）で拾う。守りの時点が着地から起こしへ移る。
  (8) 置き換える前の決定。ADR-20 を丸ごと置き換える（承認の時に ADR-20 の status を retired・superseded_by を ADR-74、この記録の supersedes を ADR-20 にする）。部分の置き換えは、ADR-16 の決定 (1) の「設計の参照だけなら契約」（acceptance に [[contract]] の行を持つ bead も契約に数える）と決定 (2) の「設計ノートに契約の行を置いた時に契約の bead を作る」（契約は bead に置く時に作る）、ADR-51 の決定 (1) の tz derive が契約表の導出物に近い仕様を束ねる出所（設計係の束〔段（S3）〕へ移す）、ADR-17 の設計ノートの行の辺（req は bead の契約の行、depends は bead の依存）、ADR-63 の決定 (1) の「設計の commit と受付」の段と決定 (5) の門の在りか（commit-design.sh）、器の ADR-1023 の「契約の正本は設計 doc の契約表 1 行」の字（審査と着地を器が持つ部分は残す）と ADR-1109 の契約表の置き場（退けの行 v-table-retire で外す）。ADR-60 の決定 (5) の規則の行（pipe.overlap_commute） は値も行も替えずに残す。前の記録の本文は替えない。
  (9) 承認の前に照らす事（v-bead-intake の起草の前・U）。bd が 64 KB の本文と 24 KB の acceptance を持てるか、1 回の bd update で acceptance と本文が 1 つの書きになるか、bd show が字を整えて返さないか（書いて読んで digest が同じか）、契約の書きを台帳の書きの包みに通す時の錠と順（問いを出した直後の書きの順）。行（v-bead-intake） の verify は、上限の大きさの bead を書いて読み、digest が同じことを歯で照らす。
options:
  - id: a
    name: 甲 — 条 P-28 を改めて契約を bead に置き、上限と照らしを bead の側の機械の縛りへ移す（削らない形）
    text: 決定 (1) から (9)。条 P-28 の上限・章の上限・散文の門・契約 id の照らし・計画だけの行の上限を、開いた契約の bead の本数・bead の本文と acceptance の byte・本文に撃つ散文の門・受付の id の照らし・計画の memo の本数へ移す。
    verdict: adopted
    reason: 得る物（測った数）。差の file を含まない設計の commit 355 本（10 日）が main から消え、その分の載せ替え 81 回（全部の 24%・10 日で約 6.8 時間・約 41〜170 GB の書き〔I〕）が消える。席の設計の commit の道（commit-design.sh は 7 日で 9 回書き直した・適用の script 35 本）が退く。撃ち直しの率は 56% から約 43% で、4 割減るのではない。失う物。契約の git の履歴（台帳の Dolt の履歴が代わる・欄ごとの差を読む命令は U）・folio の頁の契約の表（board が台帳から描く・t-graph-bead）・器の行 3 本と tsuzuri の行 2 本の追加の費え（v-bead-intake に断りの語 5 つ・t-prose-bead・t-plan-cap）・着地の時の rebase-stale-rows の守りが便を起こす時の撃ち直しへ移る（決定 (7)）・台帳の書きが日に約 36 件増え、毎周の台帳の読みが最大 40×88 KB 増える（I）。守りの機構は 0 にならない。
