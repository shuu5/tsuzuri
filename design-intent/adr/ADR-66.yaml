# 判断の記録 ADR-66 — 器の着地の確かめを、名乗った repo では path を固定した温かい作業木 1 本で撃つ
# 判断の記録 ADR-35 の決定 (6)（持ち主の裁定 t3-hub.77.15）のうち着地の確かめの分だけを、測りで決め直して置き換える（ADR-35 の本文は封で替えない）。
# 起草は係 w269a（2026-10-06）。材料は係 w268a の試作（器の行 v-verify-warm の差の file・歯と噛み）と係 w267a の測り。
id: ADR-66
title: 器の着地の確かめは、宣言の任意 key（build-lanes）を名乗った repo では path を固定した温かい作業木 1 本で錠の中で撃って畳まず、錠を取れない周と木を用意できない周は今の便ごとの木に倒す（判断の記録 ADR-35 の決定 (6) の着地の確かめの分を置き換える）
status: accepted
date: 2026-10-06
context: |
  持ち主の求め（2026-10-05・台帳の t3-hub.89・ローカルの検査を速くする・優先は速さ）。
  器の今の形。着地の後の主実測（着地の確かめ）は、着地ごとに便ごとの作業木（.worktrees/scribe2/verify/<run>）を切って依存から全部を組み、撃った後に木ごと畳む。列の着地の確かめも同じ本体を通る。判断の記録 ADR-35 の決定 (6) は、着地の確かめ・列の候補・着地の後の検出・base・床・審査の木を、並びを使わず今のまま組むと決めた。
  測り（係 w267a の写し・xtask の check の入れ子の前まで）。冷えた木は 362 秒、同じ path の木で中身だけを替えて撃ち直すと 187 秒（−48%）。木の中の target は約 5 ギガバイト（GB）で、冷えた主実測は着地ごとにそれを組み直す（10-05 の 1 回で 7.9 ギガバイト（GB）の書き）。10-05 の着地の後の丸ごとの確かめは 31 回・計 11,180 秒だった。
decision: |
  (1) 温かい木。器への宣言の任意 key（build-lanes）を真と名乗った repo では、単独の着地と列の着地の主実測を、path を固定した作業木（.worktrees/scribe2/verify/warm）1 本で撃つ。名乗りは着地した木の宣言で読み、並びと同じ key を使う。木は repo ごとの錠（verify/warm.lock）の中で使い、死んだ持ち主の錠だけを外す。
  (2) 中身の替え。木が在り作業木の印（.git の file）を持つなら、取り出しの命令（git checkout -f --detach）で中身を着地した木に替え、消しの命令（git clean -ffdx -e /target）で target の外の未追跡と無視の file を消し、木が clean な周だけそのまま撃つ。そうでない周は作業木を外して（git worktree remove --force）同じ path に切り直す。作業木の印の無い dir が path に在る周は替えを撃たない（上の repo の作業木を替えない）。
  (3) 倒し。錠を待ちの上限（rules の行 fleet.lock_retry_ms）の中で取れない周・木を用意できない周・名乗らない repo は、今の形（便ごとの木を切って撃ち、撃った後に畳む）で撃つ。温めは速さのためだけで、用意に失敗した周を測れない周にしない。
  (4) 撃った後。温かい木は畳まず錠だけを外す。材料が揃わない周も同じ。木の中の target は持ち続け、器の掃除（器の ADR-0081）と並びの上限（判断の記録 ADR-35 の決定 (5)）に数えない。
  (5) 替えない物。列の候補・着地の後の検出・base・床・審査の木は判断の記録 ADR-35 の決定 (6) のまま組む。撃つ行・段の順・記録の字・極性・同じ木の省きも替えない。
  (6) 置き換えの範囲。判断の記録 ADR-35 の本文は替えず、この記録がその決定 (6) のうち着地の確かめ（単独の着地と列の着地）の分だけを置き換える。判断の記録 ADR-35 の撤退の条件 (1) の偽の緑の数えに、温かい木で緑だった着地も入れる。
  (7) 効く時。器の行（v-verify-warm・ノート surface-wave29d）が着地しても、PATH の器の binary を入れ替えるまでは効かない。tsuzuri は並びの名乗りを既に持つので、入れ替えの後の最初の着地から効く。
options:
  - id: a
    name: 甲 — 着地の確かめだけを温かい固定の木で撃つ
    text: 決定 (1) から (7)。
    verdict: adopted
    reason: 着地ごとの確かめが約 3 分短くなり（−48%）、10-05 の回数で 1 日 約 5,400 秒の見込み。用意に失敗した周は今の形に倒すので測れない周は増えない。名乗りの key を並びと同じにしたので、並びの撤退（名乗りを外す）で温かい木も同時に止まる。
  - id: b
    name: 乙 — 今のまま毎回まっさらな木から組む
    text: 着地ごとに便ごとの木を切って依存から全部を組み、撃った後に畳む。
    verdict: rejected
    reason: 着地ごとに約 3 分と、target を組み直す数ギガバイト（GB）の書きを払い続ける。
basis: [ADR-35, FR1011, R-40]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、便の直列の詰まりの memo（t3-hub.89）か後継の memo の notes に記帳する。窓の始まりは器の行（v-verify-warm）の着地の後に器の binary を入れ替えた時刻である。問う相手は持ち主。
    (1) 温かい木で緑だった着地の後に、まっさらな所から撃つ検査（CI か日に 1 度の全部の撃ち）が同じ commit で赤を出したら、温めを止めて原因を調べる（宣言の名乗りを外す行か、温かい木だけを外す行を置くかを問う）。
    (2) 入れ替えの後 7 日の着地の後の主実測の秒の着地 1 回あたりの平均が、前の 7 日より 25% 以上減っていなければ、節約が出ていないと報告する。
plain: |
  便が main に入った後の確かめ（同じ検査の撃ち直し）を、毎回まっさらな作業場から組む形から、組み立てが温まった固定の作業場 1 つで撃つ形に替えます。測りでは 1 回 約 6 分が約 3 分になりました。
  作業場が使えないとき（ほかの着地が使っている・用意に失敗した）は今までどおり毎回まっさらな作業場で撃ちます。ほかの作業場（審査や候補の木）は替えません。
  失うのは、着地の後に「まっさらな所から組んで撃つ」確かめです。それは外の検査（CI）と日に 1 度の全部の撃ちに残ります。そちらが温かい作業場で通った commit を落としたら、温めを止めて調べます。
grill:
  when: 2026-10-06
  who: 起草係 w269a（AI・読みの範囲・試作と歯と噛みは係 w268a）
  where: 起草の置き場の w268a の notes.md の 2 節と 5 節と 6 節、w269a の notes.md
  summary: 失うのは着地の後のまっさらな所からの確かめだけで、外の検査と日に 1 度の全部の撃ちに残る。組みの古い残りによる偽の緑は撤退の条件 (1) で見張る。用意の失敗は今の形に倒すので測れない周は増えない。
approval:
  who: 持ち主
  date: 2026-10-06
  ruling: "t3-hub.89.21（裁定 id = t3-hub.89.21:20261006T0103Z-1・notes に逐語）"
  verbatim: "推奨でよい"
  surface: R-8
consequences:
  - 着地ごとの主実測が約 3 分短くなり、着地の番の待ちも同じだけ縮む。冷えた主実測の target の書きも減る見込み（測っていない）。
  - 着地の後のまっさらな所からの確かめは手元から消え、外の検査の CI（裁定 t3-hub.90.2 で札の閉じを待たない後追い）と日に 1 度の全部の撃ちだけに残る。組みの古い残りで偽の緑が出ると、後追いの検査が赤を出すまで気づかない。
  - 温かい木は 1 本の target（約 5 ギガバイト）を持ち続け、器の掃除と並びの上限に数えない。
  - 用意に倒れた周は記録に残らない（速さが黙って戻る）。撤退の条件 (2) の秒の比べで見る。錠を取れない周は今の秒のまま。
note: 起草は係 w269a。行の試作と歯と噛みは係 w268a。承認の欄の逐語と経路は、適用の script が台帳の問いの notes の定型行から読んで入れた。
