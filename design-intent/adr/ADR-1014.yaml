    verdict: rejected
    reason: "N2 / C1.2 / ADR-1013 §2.1 に反し、 必ず drift する。"
  - id: "D"
    name: "rules manifest に guard ごとの行を置き、 xtask がそれを読む"
    text: |
      (D) rules manifest に guard ごとの行を置き、 xtask がそれを読む。 却下: 極性は閾値でも裁定でもなく型の事実である。 manifest に写すと型と manifest の 2 面になり、 C14.2 の drift と同じ性質の穴を作る。
    verdict: rejected
