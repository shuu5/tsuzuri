  器の専門語の説明: 本文に出てくる専門語を、やさしい言葉で説明します。
  ・plugin の実体（plugin payload）: plugin.json (名乗り) と hooks.json (hook の一覧) と skills (復元と退避の作法) の 3 つ。 前 2 つは生成物で、 skills は tracked の実体。
  ・marketplace の source（marketplace source）: marketplace.json の plugins[].source。 install はこの dir を丸ごと cache へ写す。 本 ADR で repo 全体 (./) から生成 dir (./plugin) になる。
  ・生成 dir（generated plugin dir）: plugin の実体を置く dir (plugin/)。 置き場は core の定数 1 つが正本で xtask は tracked の core から読み、 gen-manifest が 3 file を生成し、 xtask check が tracked との drift 0 を測る。
  ・cache の写し（plugin cache copy）: plugin の install が marketplace の source を copy して作る複製。 hook の読み込みには使われない (実測・保証なし) が、 大きいと install が終わらない。
  ・再 install（reinstall）: marketplace の source が変わった後、 各口座 × project で plugin を入れ直すこと。 器は代筆しない (user 手番)。 古い install は doctor の導入先の行に古い root として出る。
