  器の案の章の要約: 候補を 5 つ並べます。先頭数本を 1 つの木にまとめて 1 回検査する案、今の 1 本ずつの形、追随の検査を撃たない案、先に着地して赤なら戻す案、先頭 k 本ごとの木を並列に検査する案です。
  器の専門語の説明: 本文に出てくる専門語を、やさしい言葉で説明します。
  ・着地の列（landing queue）: Gated ∧ verdict PASS の便の並び。 先に gate を通った便が先に着地する (ADR-1021 §2.5)。 順番の鍵は event log の replay で導く。
  ・候補の木（candidate tree）: main の先端に列の先頭から N 本を順に rebase して作る 1 つの worktree。 gate はこの木に対して 1 回撃つ。 rebase が衝突した便は積まず、 列から外れる。
  ・列を解く（dissolve the train）: 候補の木の gate が赤だった周に、 N 本の並びを捨てて先頭 1 本だけの既存の経路 (追随 → 再 gate) に戻すこと。 どの便が赤かの帰属はしない。
  ・検出線の持ち越し（carried detection line）: 便の diff の patch-id が前周の記録と同じなら、 前周の検出線 (変異の生存) の record を持ち越しの印付きで写して撃たないこと。 記録が無い・patch-id が違う周は撃つ。 持ち越した値は実測と型で区別する (C10)。
  ・patch-id（patch id）: git patch-id --stable が diff から計算する値。 行番号や base が変わっても diff の中身が同じなら同じ値になる。 衝突無しの rebase で便の diff が変わらなかったことを測る鍵。
  ・列の長さの上限（train max）: rules 行 land.train_max の値。 候補の木に積む便の数はこれ以下。 値は裁定 id 付きで manifest が持つ (C5)。
