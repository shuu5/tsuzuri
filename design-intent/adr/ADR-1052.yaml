retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  変異検査は、code をわざと少し壊した版（mutant）を 1 つずつ作り、test がそれを見つけられるかを確かめる仕組みです。いまは mutant を 1 つ作るたびに package の test を全部回していました。e2e の test しか持たない契約では、最初の 3 秒で答えが出ているのに e2e の test 全体を 44 秒かけて回し、混んで同時実行数が 1 に落ちた回は 6 分かかり、検査 1 本が 8 時間に及ぶこともありました。そこで、mutant ごとに回す test を「その契約が名指した test」と「package の単体の test」だけに閉じます。契約が名指した test の名前は器が契約から導き、宣言 file の 4 つ目の差し込み口で道具へ渡します。検査は gate の中に残るので、審査役はこれまでどおり生き残った mutant を材料にできます。代わりに、契約が名指していない e2e の test だけが見つけられる壊し方は「生き残り」として数えられるようになるので、その事実を記録の欄に残します。
consequences:
  - "この判断で良くなることと、代わりに引き受けることです。e2e の test しか持たない契約で mutant 1 つが 44 秒から数秒になり、混んで 1 に絞られた回でも数時間止まらなくなります。代わりに検査の範囲が狭まって生き残りが増えうること、差し込み口が増えて道具の入れ替えを伴うこと、mutant の test の道具が baseline と違うことを引き受けます。"
  - "良い結果: e2e の歯しか持たない契約で mutant 1 つが 44 秒から数秒になり、 gate 1 本の検出線が 12 分から数分になる (見込み・着地後に実測する)"
  - "良い結果: 縮退した周 (1 thread) でも e2e の直列の 6 分が消え、 縮退が便を数時間止めなくなる"
  - "良い結果: 検出線が gate の中に残り、 審査役は生存 mutant を材料にできる"
  - "良い結果: 歯の名の導出は受付の既存の 1 本で、 道具は値を持たない (thread と同じ形)"
  - "代償: 検出の母集団が狭まり、 契約が名指さない e2e の歯だけが捕まえる mutant は生存に数えられる (週次記録の生存は増えうる・記録の欄がその事実を運ぶ)"
  - "代償: 穴が 1 つ増え、 intake の閉じた集合・gate の置換・宣言 file の行・記録の外形が動き、 着地は道具 (PATH の binary) の入れ替えを伴う"
  - "代償: mutant の test の道具が nextest になり、 baseline (cargo test・全数) と道具が違う (timeout は baseline から導くので緩めに出る)"
