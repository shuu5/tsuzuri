# 判断の記録 ADR-1078 — 器 scribe2 の判断の記録 ADR-0078 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1078
title: "公開の直前に隣の private repo の識別子を止める — host-guard に 6 つ目の種類 publish を足し、 出ていく字面を同じ host の隣の private repo の閉じた 4 形の識別子で走査し、 可視性と remote の先端 は GitHub と git 自身に問う (ADR-1056 の閉じた 5 種類を部分 supersede)"
status: accepted
date: 2026-09-28
context: |
  公開の repo へ出る commit と本文に、 同じ host の private repo の内部の識別子が混じっても、 今は散文の手順と手の grep しか止めるものが無く、 CI は出た後に回る。 本 ADR は、 host-guard に公開の種類を足して撃つ前に走査する形と、 走査のための GitHub への問い合わせを外へ出してよい範囲とする解釈を決める。
  なぜこの判断が要るのかを、 危険 (公開の repo へ出る追加行が隣の repo の識別子を持ちうる)・今の守り (手順の文章と手の検索だけ)・機序 (出る経路は git と gh を通り、 公開か非公開かは GitHub だけが知る)・憲法と既存の決定の向き・この判断の範囲の 5 つから説明します。 動かすのは見張りの区分 1 つと、 器の着地の手順からの呼び出しと、 要件の改訂だけで、 既存の 5 つの区分と見張りの呼び出しの設定は変えません。
  CTX1 危険 — 公開の repo へ出る追加行が隣の private repo（群に並ぶ非公開の repo） の識別子を持ちうる
  同じ host に private repo と公開の repo が並び、 同じ session が両方の事実に触れるので、 公開の repo へ出る追加行が private repo の内部の事実 (repo の名など) を持ちうる。 push は取り消せない。 出た後の除去は本 ADR の外。
  CTX2 今の守り — 散文の手順と手の grep だけ
  公開の前に相手の可視性を測り差分を grep する手順と、 草稿の依頼文に毎回書く「隣の repo の事実を書かない」の 1 行は、 どちらも器の外の散文。 器の門 (契約表の検査・path の門・CI) はどれも隣の repo の識別子を測らず、 CI は push の後に回る。
  CTX3 機序 — 出る経路は Bash の git と gh を通り、 可視性は GitHub だけが知る
  公開の repo へ出る経路は、 手の push・gh の本文 (PR・issue・release・gist・api)・器の着地の push (FR1050) で、 どれも Bash の git と gh を通る。 host-guard（戻せない操作を止める見張り） (ADR-1056) は口座の設定を読む全 session の Bash の直前に呼ばれ、 置き場は --state-dir で、 host の面 (host.toml) が同じ host の repo の anchors を持つ。 repo が公開か非公開かは GitHub だけが知っていて、 手元の宣言は切り替えの後に古びる。
  CTX4 憲法と既存の決定の向き (本 ADR の解釈)
  N2 (散文にしか無い規則を規則として扱わない) から、 手の grep の手順は器の門に変える。 A1 (出す) は外への送信に持ち主の承認を求める。 走査のために GitHub へ送るのは 公開先の repo（出す先の repo） と群の anchor (実体が在り公開先の repo と別のもの) の owner/name と remote の先端 の問いで、 相手は既にそれを持つので新しい情報を出さない。 持ち主の裁定は 3 本 — 2026-09-27T17:39Z (器の仕組みで止める)・2026-09-27T22:21Z (GitHub への問いを A1 の許せる範囲とする・一般語の repo の名も除かない・着地の push も走査する)・2026-09-27T23:55Z (repo の名は区切った成分で照合し、 無害と裁定した字句の除外の一覧だけを除く)。 ADR-1056 は host-guard の種類を閉じた 5 つにし、 名前・event・flag・出力の形を跨版で足すだけとした。 vessel-hook の設計が anchor-guard を host-guard の 6 つ目にしなかった理由は「repo の置き場と印を解く材料を持たない」で、 公開の種類は repo の器の置き場を要らず --state-dir の host の面と git と gh だけで閉じるので、 その理由は当たらない。 C17.2 から、 手の走査の手順のうち識別子の 4 形（隣を指す 4 つの形）を見る部分は門が着地したら消す (依頼文の 1 行は、 門が測らない散文の事実の手当てとして残す)。
  CTX5 射程 — 動かすのは種類 1 つと着地の手順からの呼び出しと要件の改訂だけ
  動かすのは (1) host-guard の種類の閉じた enum の末尾に publish を足し、 rules 行 host_guard.publish を置くこと、 (2) 器の着地の手順が main に載せる前と push の前に同じ判定を呼ぶこと、 (3) 要件 FR1080 と AC1050 を置き、 FR1011 (main に載せる前の同じ走査)・FR1050 (着地の push の前の同じ走査)・NFR1005 (公開の segment（外へ出す命令） の周の締め切り 6 秒) と AC1023 を改めること。 同じ要件の改訂で FR1050 に列の先端の CI による close も足すが、 それは本 ADR の決定ではない (持ち主の裁定 2026-09-27T22:21Z)。 動かさないのは、 既存の 5 種類の判定・配線の hook 行 (matcher と timeout 10 秒)・出力の形・binary の不在の fail-open。 散文の事実 (件数・規則の名・関数の名)・Claude の外の push・sh -c の中の push・git と gh の alias・runner の session は測らない (限界)。
  （選択肢を測るものさし）この判断を評価する 5 本のものさしです。 出る前に止めること (公開の push は取り消せない)。 規則を文章に置かず、 どの session でも同じ判定にすること。 確かめられない値は止める側へ倒すこと。 足すものを最小にすること (既に在る見張りの口と呼び出しを使い、 依存を足さない)。 公開でない命令のときの見張りの時間を増やさないこと。
  DR1｜出る前に止める — 公開の push は取り消せない CTX1・CTX2
  DR2｜規則を散文に置かない — どの session でも同じ判定 (N2) CTX2・CTX4
  DR3｜偽の通過を作らない — 読めない値は止める側へ倒す (NFR1004) CTX3
  DR4｜足すものを最小にする — 既に在る host-guard の口と配線を使い、 依存を足さない (C17・NFR1003) CTX3・CTX4
  DR5｜公開でない周の hook の予算を増やさない (NFR1005) CTX3
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 判定の順は、 規則の行 (無ければ止め、 off なら調べない) → repo の全履歴を公開する命令 (問い合わせずに止める) → 命令の解読 (解けなければ止める) → 公開か非公開かの確認 (相手が非公開なら、 または隣が 0 なら通す) → 出ていく文字の検査です。 行き先・相手の最新・出ていく commit は git 自身に、 gh の相手は gh 自身に解かせます。 出ていく文字に、 隣の private repo の識別子 (repo の名・隣にあって相手の最新から辿れない commit などの id (7 桁以上に縮めた形も含む)・/ を含み隣にあって相手の最新に無い file の path・台帳の id) が 1 つでもあれば止め、 言い換えて出し直す道を示します。 支える要件は FR1080 (公開の字面の走査) で、 FR1011 (main に載せる前にも同じ走査)・FR1050 (着地の push にも同じ走査)・NFR1005 (公開の命令のときだけ 6 秒で締め切る) の改訂も主張します。
  採用 — OPT1
  器 SHALL host-guard の種類の閉じた enum の末尾に 6 つ目の種類 publish を足し、 rules 行 host_guard.publish (値は識別子の形の記号の閉じた列と、 無害と裁定した字句の除外の一覧〔字句の sha256 の digest の列で、 字句そのものは書かない〕) を置く。 publish の種類は Bash の公開の segment (git の push と、 gh の公開の動詞〔本文を出す動詞と repo の作成・編集〕) だけを同定し、 それ以外の segment では git と gh を撃たない。 判定の順は次のとおり。 (1) rules 行が無い周は fail-closed で断り (経路は裁定を添えて行を置く)、 enabled が false の周は publish の種類を撃たずに通す。 (2) repo の全履歴を走査なしに出す command (器の閉じた形の一覧〔可視性を public へ変える gh repo edit と gh api の書き・public の repo を作る gh repo create〕) は、 公開先の可視性と隣の数に依らず GitHub に問わずに断り、 経路は持ち主が行う。 (3) 行き先 (pushurl と insteadOf を当てた後の、 git が実際に押す URL)・remote の先端・出ていく commit は git 自身に (同じ語の列の dry-run と ls-remote で)、 gh の公開先の repo は gh 自身に解かせ、 解けない周 (同定できない形・変数の ref・--mirror・標準入力の本文・可視性の欄を解けない repo の編集の gh api・読めない字面) は隣が 0 の host でも断る。 (4) 公開先の repo と群の anchor (実体が在り公開先と別のもの) の owner/name を、 git が実際に押す URL か gh が解いた repo の、 host が gh の既定の host である URL の path の末尾 2 成分として同じ規則で導き (導けない repo の可視性は読めない可視性)、 可視性を GitHub に 1 本の問いで問い、 読めない可視性は公開先なら public・anchor なら private と読む。 群に公開先の外の anchor が無い host は問わない。 隣の private repo は、 その anchor のうち public と実測できないもの。 公開先が private と実測できた周と、 隣が 0 の周は通す。 (5) 出ていく字面 (commit の message・author と committer の名・patch の追加行と path・押す annotated tag の本文・押す ref の名・gh の本文の flag の値と本文の file) を隣の識別子の閉じた 4 形 (repo の名は字面と名をともに ASCII の英数字と _ の外の字で区切った成分の並びで大文字と小文字を区別せずに照合し、 一般語の名も除かず、 除外の一覧に digest が在る字句の中の当たりだけを数えない・7 桁以上の 16 進の語で、 隣の object の id かその接頭辞であり、 公開先の remote の先端から辿れない object id・/ を含み隣の tracked な path を / の境界で切った末尾と一致し公開先の remote の先端の tracked な path に無い path・隣の台帳の issue の id) で走査する。 字面が 8 MB を越える周と、 どの段でも締め切り 6 秒を越えた周は断る。 断りは理由ごとの経路を載せる (rules 行は裁定を添えて置く・識別子は件数と先頭 5 件と「隣の project」への言い換え・解けない形は書き直し・上限は分割・締め切りは撃ち直し・全履歴は持ち主)。 GitHub へ送るのは公開先の repo と (4) の anchor の owner/name と remote の先端の問いで、 これを A1 の許せる範囲とする。 器の着地も main に載せる前 (FR1011・当たる便は載せずに Failed、 判定できない便は載せずに Gated に留めて次の dispatch の周に撃ち直す) と push の前 (FR1050・当たる周は main が remote の先端に揃う〔3 クラスの承認〕まで以後の着地を止め、 判定できない周は次の着地の push の前に撃ち直す) に同じ判定を撃つ。 配線の hook 行 (matcher と timeout) は変えない。 要件は FR1080 と AC1050 を置き、 FR1011・FR1050・NFR1005 と AC1023 を改める (SRS v0.27)。
  （平易）器は見張り (host-guard) の区分の末尾に 6 つ目の「公開」を足し、 規則の行 host_guard.publish (識別子の形の一覧と、 無害と裁定した字句の除外の一覧〔字句そのものでなく指紋 (sha256 の digest) で持つ〕) を置きます。 見張りは外へ出す命令 (git の push と、 gh の本文を出す命令・repo を作る・編集する命令) だけを見分け、 それ以外の命令では git も gh も撃ちません。 判定の順は 5 段です。 1 段目: 規則の行が無ければ止め、 off なら何も調べずに通します。 2 段目: repo を公開に切り替える命令と公開の repo を作る命令 (器が形の一覧を持ち、 gh api で可視性を変える書きも含む) は、 相手の公開か非公開かや隣の数に依らず、 GitHub に問わずに止め、 その操作は持ち主が行います。 3 段目: 行き先・相手の最新・出ていく commit は git 自身に、 gh の相手は gh 自身に解かせ、 解けない形 (見分けられない形・変数の ref・--mirror・標準入力の本文・可視性の欄を解けない repo の編集・読めない文字) は隣が 0 の machine でも止めます。 4 段目: 相手と、 machine の宣言の群に並ぶ repo のうち実体が在り相手と別のものの owner と名を、 git が実際に押す先の URL (gh の相手は gh が解いた repo) から導き (GitHub の外の host からは導かず、 導けない repo は確かめられない扱い)、 公開か非公開かを GitHub に 1 回で確かめ、 確かめられないときは相手なら公開、 群の repo なら非公開と読みます。 群に相手の外の repo が無い machine は問い合わせません。 相手が非公開なら、 または隣の private repo が 0 なら通します。 5 段目: 出ていく文字 (commit の説明文・書いた人と commit した人の名・足した行と path・押す tag の説明・押す branch や tag の名・gh の本文と本文の file) に、 隣の repo の名 (ASCII の英数字と _ の外の字 〔- や . や / を含む〕 で区切った部分の並びで、 大文字と小文字を区別せず、 一般的な単語でも除かず、 除外の一覧に指紋が在る字句の中の当たりだけを除いて照合)・隣にあって相手の最新から辿れない commit などの id (7 桁以上に縮めた形も含む)・/ を含み、 隣の file の path を / の区切りで切った末尾と一致し、 相手の最新に無い path・隣の台帳の id が 1 つでもあれば止めます。 文字が 8 MB を越えるときと、 どの段でも 6 秒を越えたときも止めます。 止めるときは理由ごとの道を告げます (規則の行が無いなら裁定を添えて行を置く・識別子なら件数と先頭 5 件と「隣の project」と件数への言い換え・解けない形なら書き直し・上限なら分けて出す・締め切りなら撃ち直し・全履歴なら持ち主)。 GitHub へ送るのは 4 段目の repo の owner と名と、 相手の最新の問いだけで、 これを外へ出してよい範囲とします。 器が便を着地させるときも、 main に載せる前と push の前に同じ判定を撃ちます (push の前に当たったら、 持ち主が main を揃える〔着地した commit を捨てる 3 クラスの承認〕まで着地を止めます)。 見張りの呼び出しの設定は変えません。
  （理由）持ち主の裁定は、 器の仕組みで止めること (2026-09-27T17:39Z)、 GitHub への問い合わせを外へ出してよい範囲とし、 一般的な単語の名も除かず、 着地の push にも同じ走査を掛けること (2026-09-27T22:21Z)、 repo の名は区切った部分ごとに照合し、 無害と裁定した字句だけを除くこと (2026-09-27T23:55Z) でした。 公開の push は取り消せないので、 出た後に回る検査 (CI) では遅すぎます。 clone ごとの push 前の hook も撃つ前に止まり、 Claude の外や別名や sh -c の中や実装役の push まで拾いますが、 gh の本文を通らず、 clone ごとに置く必要があり、 --no-verify で外れます。 口座の設定から呼ばれる見張りなら、 口座の設定を読む session の命令の直前に同じ判定が掛かり、 手順の文章を覚えていなくても止まります (Claude の外・別名・sh -c の中・実装役の push は拾わない限界を引き受けます)。 公開か非公開かは GitHub だけが知っていて、 手元に書いた宣言や測って置いた値は切り替えの後に古びるので、 撃つたびに問い、 確かめられない値は止める側へ倒します。 GitHub へ送るのは相手と群の repo の owner と名と相手の最新の問いだけで、 相手が既に持っている情報です。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1080（rationale）: FR1080 (公開の字面の走査) の根拠を与える。 撃つ前に止めること、 可視性を GitHub に問い読めない値を止める側へ倒すこと、 識別子を閉じた 4 形に限ること、 一般語の repo の名も除かないこと (裁定 2026-09-27T22:21Z)、 repo の名を成分ごとに照合し除外の一覧の字句だけを除くこと (裁定 2026-09-27T23:55Z)、 GitHub への問い合わせを A1 の許せる範囲とすること (裁定 2026-09-27T22:21Z)。
  FR1050（claim）: FR1050 (land の終端) の着地の push にも FR1080 と同じ判定と上限を push の前に掛け、 当たる周は push も close もせずその push で出る便を Failed で終端させ、 main が remote の先端に揃うまで以後の着地を止め、 main を揃えるのは着地した commit を捨てる 3 クラスの承認とし、 判定できない周は push も close もせず次の着地の push の前に撃ち直す、 と主張する。 列の先端の CI による close は本 ADR の決定ではない。
  FR1011（claim）: FR1011 (land) は main に載せる前に FR1080 と同じ判定を撃ち、 当たる便 (読む上限を越える便を含む) は載せずに Failed、 判定できない便は載せずに Gated に留めて次の dispatch の周に撃ち直し、 候補の木で断った便 (Failed か Gated) より後ろの便は並びへ戻す、 と主張する (断った commit が main に残り、 後の便の push を連鎖して止めないため)。
  NFR1005（claim）: NFR1005 (hook の予算) は公開の segment の周だけ git と gh の問い合わせを数で縛らず、 出ていく字面を 8 MB まで読み、 締め切り 6 秒で縛り、 それ以外の周の予算 (git 1 回・2.0 秒) は変えない、 と主張する。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録は ADR-1056 の一部を置き換えます。 置き換えるのは 2 つで、 見張りの区分を 5 つに閉じた列の末尾に「公開」を足して 6 つにすること、 公開の命令のときに限り見張りの git の問い合わせ 1 回と 2.0 秒の縛りを 6 秒の締め切りに代えることです。 既存の 5 つの区分の判定・呼び出しの設定・出力の形・binary が無いときに通す扱い・健康診断 (doctor) の行の既存の列・名前などを版を跨いで足すだけとする決まりは保ち、 ADR-1056 の「印と anchor を解かない」は作業場所の印と anchor の意味で保ちます (公開の区分が読むのは machine の宣言の群の repo の列で、 判定を緩める鍵でなく隣を数える材料です)。 原則は「取り消せない公開は、 出る前に器が止める」です。
  改訂状態: current
  置き換える ADR: ADR-1056
  置き換えられた: なし (現行)
  部分 supersede で、 置き換えるのは 2 つ — (1) ADR-1056 の決定の「種類 SHALL 閉じた 1 enum」の 5 つの列を、 末尾に publish を足した 6 つに改める。 (2) ADR-1056 が NFR1005 に主張した host-guard の git の問い合わせ 1 回と 2.0 秒を、 公開の segment の周に限り、 数で縛らず締め切り 6 秒で縛る形へ改める。 ADR-1056 の「marker と anchor を解かない」は cwd の器の marker と anchor の意味で保ち、 publish の種類が読むのは --state-dir の host の面の群の anchor の列で、 判定を緩める鍵でなく隣の private repo を数える host の事実の入力である (読めない anchor は private と読む)。 保つのは、 既存の 5 種類の判定・配線の hook 行 (matcher と timeout 10 秒)・通す周と断る周の出力の形・binary の不在の fail-open・doctor の行の既存の列・名前と event と flag を跨版で足すだけとする規則の全部。
  照会終端 — PRIN-STOP-BEFORE-IT-LEAVES
  取り消せない公開は、 出る前に器が止める。
  本 ADR が CI の門・clone ごとの hook・可視性の宣言・周期の実測を退け、 撃つ直前の見張りで走査して読めない値を止める側へ倒したのはこの原則に行き着く (これ以上は遡らない照会終端)。
options:
  - id: "OPT1"
    name: "host-guard の 6 つ目の種類 publish"
    text: |
      公開の segment (git の push・gh の本文を出す動詞) だけを同定し、 出ていく字面（外へ出る文字）を同じ host の隣の private repo の閉じた 4 形の識別子で走査し、 当たれば実行の前に断る。 行き先と remote の先端と公開先の repo は git と gh 自身に解かせ、 可視性は GitHub に問う。 読めない可視性は公開先の repo なら public・隣なら private と読む。 repo の全履歴を走査なしに出す command は GitHub に問わずに断る。 決め手は持ち主の裁定 (2026-09-27T17:39Z・2026-09-27T22:21Z・2026-09-27T23:55Z)。
      （平易）見張りに 6 つ目の区分「公開」を足す案です。 見張りは外へ出す命令 (git の push と、 PR や issue などの本文を出す gh の命令・repo を作る・編集する命令) だけを見分け、 それ以外の命令では git も gh も撃ちません。 行き先と相手の最新と出ていく commit は git 自身に、 gh の相手は gh 自身に解かせ、 公開か非公開かは GitHub に問います。 確かめられないときは、 相手なら公開、 群の repo なら非公開と読んで止める側へ倒します。 出ていく文字に隣の private repo の 4 つの形の識別子が 1 つでもあれば止め、 repo を公開に切り替える・公開の repo を作る命令は問い合わせずに止めます。 撃つ前に止まり、 口座の設定を読む session に同じ判定が掛かり、 依存を足さない点で勝ります。 代わりに、 公開の命令では最大 6 秒待ち、 一般的な単語の名でも止まり、 文章の中の事実・別名 (alias)・sh -c の中・Claude の外・実装役 (runner) の session の push は調べません。 隣の repo が無い machine でも repo を公開に切り替える命令や解けない形は止まり、 GitHub へ名と相手の最新の問いを送り、 着地の push の前に当たると着地が止まります。 決め手は持ち主の裁定です。
      利点: 撃つ前に止まり、 出た後に気づく形にならない (DR1)
      利点: 口座の設定を読むどの session の Bash にも同じ判定が掛かる (DR2)
      利点: 読めない可視性・字面・締め切り越えは止める側へ倒す (DR3)
      利点: 既に在る口・配線・rules 行の形を使い、 依存を足さない (DR4)
      利点: 公開の segment でない周は git と gh を 0 回撃つ (DR5)
      欠点: 公開の周は GitHub へ問い合わせ、 最大で締め切りの 6 秒まで待つ (NFR1005 の改訂が要る)
      欠点: 一般語の repo の名も止めるので、 偽陽性の周は言い換えて出し直すか、 無害な字句を裁定で除外の一覧に足す手間が出る
      欠点: 散文の事実・alias・sh -c の中・Claude の外・runner の session の push は測らない
      欠点: 隣を持たない host でも、 全履歴を出す command と解けない形は断られ、 持ち主が手で行うか書き直す
      欠点: 公開の周ごとに GitHub へ名と remote の先端の問いを送り、 着地の push の前に当たると着地が止まる
    verdict: adopted
    reason: "決め手は持ち主の裁定 (2026-09-27T17:39Z・2026-09-27T22:21Z・2026-09-27T23:55Z)。"
  - id: "OPT2"
    name: "CI の門で走査する"
    text: |
      push の後に CI が出た commit を走査する。 決め手は分析 (出た後に回る)。
      （平易）公開の repo の検査 (CI) が、 出た commit を後から調べる案です。 見張りの時間を使わず、 どの経路で出た commit も同じ場で見られる点で勝ります。 けれども、 公開の repo では検査が回るときには既に出ていて、 止められません。
      利点: hook の予算を使わない (DR5)
      利点: どの経路で出た commit も同じ場で見る (DR2)
      欠点: 公開の repo では CI が回る時には既に出ていて、 止められない (DR1)
    verdict: rejected
    reason: "決め手は分析 (出た後に回る)。"
  - id: "OPT3"
    name: "git の pre-push hook を clone ごとに置く"
    text: |
      各 clone の git hook が push の前に走査する。 決め手は分析 (gh の本文を通らず、 clone ごとに置く必要がある)。
      （平易）clone ごとに、 git の push の前に動く hook を置いて調べる案です。 Claude の外の terminal の push も止められ、 clone の中の git push なら別名 (alias)・sh -c の中・実装役 (runner) の session・器の着地の push にも掛かる点で勝ります。 けれども、 clone ごとに置く必要があり、 他の project の hook と衝突し、 --no-verify で外れ、 gh の本文 (PR・issue・release) を通りません。
      利点: Claude の外の terminal の git push も止める (DR1)
      利点: clone の中の git push なら alias・sh -c の中・runner の session・器の着地の push にも掛かる (DR2)
      欠点: clone ごとの配置で、 他 project の hook と衝突し、 --no-verify で外れる (DR2)
      欠点: gh の本文 (PR・issue・release) を通らない (DR1)
    verdict: rejected
    reason: "決め手は分析 (gh の本文を通らず、 clone ごとに置く必要がある)。"
  - id: "OPT4"
    name: "host の面に公開 / 非公開を宣言する"
    text: |
      host.toml に repo ごとの可視性を書き、 hook はそれを読む。 決め手は分析 (宣言が古びる)。
      （平易）machine の宣言 (host.toml) に repo ごとの公開か非公開かを書き、 見張りはそれを読む案です。 GitHub へ問わないので外へ出す範囲の解釈が要らず、 速い点で勝ります。 けれども、 公開に切り替えた後に宣言が古び、 非公開と書いたまま公開にした repo へは調べずに通ってしまいます。
      利点: GitHub へ問わないので、 A1 の解釈が要らない
      利点: 公開の周も GitHub へ問わず待ちが短い
      欠点: 可視性を切り替えた後に宣言が古び、 private と書いたまま public にした repo へは走査なしに通る (DR3)
    verdict: rejected
    reason: "決め手は分析 (宣言が古びる)。"
  - id: "OPT5"
    name: "可視性を周期で測って置き場に置く"
    text: |
      管理 tick か doctor が可視性を測って置き場に書き、 hook はそれを読むだけにする。 決め手は分析 (測った値が古びる)。
      （平易）定期の見回りや健康診断が公開か非公開かを測って置いておき、 見張りはそれを読むだけにする案です。 見張りが問い合わせずに速く、 宣言より古びにくい点で勝ります。 けれども、 測ったときと push のあいだに公開へ切り替えると古い値で通り、 測る側と読む側の 2 本に分かれて足すものが増えます。
      利点: 公開の周も GitHub へ問わず待ちが短い
      利点: 宣言でなく実測なので、 OPT4 より古びにくい
      欠点: 測った周と push の間に可視性を切り替えると、 古い値で通る (DR3)
      欠点: 測る側と読む側の 2 本に分かれ、 足すものが増える (DR4)
    verdict: rejected
    reason: "決め手は分析 (測った値が古びる)。"
