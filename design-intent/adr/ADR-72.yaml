retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、epic（t3-hub.92）か後継の memo の notes に記帳する。窓の始まりは各段の着地の commit の時刻である。問う相手は持ち主。数は器の event log・台帳・git の log・日次の測り（eval_daily.py）の完全な記録から出す。
    (1) D1:段（S4）の着地から 7 日で、main の commit のうち設計の commit の割合が 40% 以上（今 596/1,183）か、rebase の撃ち直しが初回の実装の 40% 以上（今 56%）なら、契約を bead に置く形を問い直す。器が bead の契約を読めずに便が起きない周が 3 回在っても問い直す。
    (2) D2: 設計だけの行が 10 本着地した時点で、1 本目の着地率が 70% を下回るか、着地 1 本あたりの新しい量（設計係と便の和）の中央が段（S2）の前の 7 日の中央を越えたら、差の file を大きい行だけ戻すかを問い直す。
    (3) D3:段（S6）の着地から 30 日で、push ごとの CI なら push の時に見つかった落ち（汚れていない環境・依存の監査・写しの孤児）を日次の撃ちが後から見つけた件が 2 件か、host が撃てず日次の撃ちが 2 日続けて欠けたら、CI を戻すかを問い直す。
    (4) D4: 繋ぐ門の着地から 14 日で、起票した memo の処分に [再発] か辺が 1 件も無い（門が形だけ）か、門の断りが起票 10 本あたり 5 回を越えたら、門の作りを問い直す。
    (5) D5: 状態の門の着地から 7 日で、圧縮の後の文脈に作業中の bead の行が空か古い周が 1 度でも在るか、turn の終わりの門の止めが 1 日 10 回を越えたら、門の条件を問い直す。
    (6) D6: 直しの周の着地から 14 日で、gate の FAIL のうち 2 周以内に PASS に届いた割合が 50% を下回るか、直しの周の便の新しい量が起草からの全周（約 17 万 token）を越えた例が半分を越えたら、上限と戻し先を問い直す。
plain: |
  持ち主は 2026-10-06 に tsuzuri の仕事の流れを作り直すと決めました。決めは 6 つで、全部が席の推奨のとおりです。
  1. 契約（便 1 本ずつの約束）を git の設計ノートでなく台帳に置きます。設計の commit が減り、走っている便の撃ち直しも減ります。
  2. 起草の係は設計だけを書き、完成した code の差を書きません。小さい行から測って 1 週で全部に広げます。
  3. push ごとの CI をやめ、毎日 1 度の全部の撃ちに寄せます。
  4. memo を起こす時に、似た memo や関わる物を機械が出し、席が繋ぐか理由を書くまで門が止めます。
  5. 作業の計画と次の手を台帳に書き、圧縮の後に見えるようにし、古いままなら門が 1 度止めます。
  6. 審査で落ちた便を、同じ便の中で 2 回まで直させます。
  条文を替える所（設計ノートの上限の条）は、この記録では替えず、契約を台帳に移す段で持ち主の承認を取り直します。
  失うのは、契約の git の履歴・GitHub の上の検査・最初の着地率の一部（測って見張ります）です。
