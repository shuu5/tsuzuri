# 判断の記録 ADR-72 — 作り直し（v4） の決め D1〜D6（持ち主の決め・全部推奨）を写す
# 条文は替えない。条を替える決め（D1 の条 P-28 ほか）は段（S4）で条 A-2 の手続きを経て、別の判断の記録で改める。置き換える前の決定は決定 (9) が名指し、各段の着地で効く（前の記録の本文は替えない・前例 ADR-68 と ADR-70 の頭の注）。
# 起草は係 w310a（2026-10-06）。材料は頁の案（tobe.md の 1〜6 節）と食い違いの表（findings.md）、計画の正本（epic t3-hub.92 と子の段（S1〜S9））、memo t3-hub.91.4 の notes。
id: ADR-72
title: 作り直し（v4） — 契約を台帳へ・起草は設計だけ・push ごとの CI を止める・memo の繋ぐ門・作業の状態を台帳へ・便の中の直しの周
status: accepted
date: 2026-10-06
context: |
  2026-10-06 に持ち主は作業を止め、tsuzuri の流れを code から全部書き出させた（memo t3-hub.91.4・調べ係 5 体の区間の書き出し・食い違い 28 件）。書き出しを見て持ち主は 10 の指摘を出した（発話 2026-10-06T07:51:34.606Z）。(1) 圧縮の後に作業の文脈（計画・優先・memo と設計の統合）が残らない (2) 会話で分かった事が memo に入らず記憶にだけ入る (3) memo を既存の memo・issue・設計・code と繋ぎ、起票を細かく割り、係か hook か器で縛る (4) 起草を割り、グラフの束を設計係に渡して設計だけをさせる (5) 契約は雛形を埋めた形にし、欄は器の script が機械で検査して係に突き返す (6) 契約は bead で持てばよく、設計を main に入れる要が分からない (7) 試験と build の回し過ぎ (8) CI が要るか (9) 係と便の prompt の見直し (10) 決定はしごが守られているか。
  席は 8 つを事実どおり、2 つを一部ちがう（memo は設計の節点へ既に辺を持つ・試験の重ねは一部を既に削った）と答えた（頁の案 1 節）。測った数（V = code か記録を見た・D = 記録から）は次のとおり。
  ・圧縮の直前に器が残すのは席の最後の発言 1 つ。作業中の bead を出す欄（[RECENT-WIP]）は在るが、席が作業中（in_progress）を使わないので毎回空（V）。席の記憶は 131 件で、うち作業の決まりが 87 件（条 N-2.1 で規則として効かない）（V）。
  ・開いた memo 63 本のうち 57 本は設計の節点への辺を持つが、門が辺を求めず、memo どうし・code・便への辺は 0 本（V）。
  ・起草係 1 体が調べ・設計・差の file・噛み・床・適用の script・commit の文まで書き、予算の越えは 87% の係（中央 1.69 倍）・差の file 196 本（6.2 MB）・係の組みの置き場が SSD を約 400 GB 食った（D）。
  ・契約の審査の非 PASS 150 回のうち 64 回は字の照らしで決まる型（section-material-missing 62・歯の file が write-set の外 2）で、審査役（opus）が判じていた（V）。preflight は commit の木を読むので、置く前に撃つには回り道が要った（V）。
  ・09-27 からの main の commit 1,183 本のうち設計の commit が 596 本で、便の着地（544 本）より多い。main が動いた後の rebase の撃ち直しは 332 回（初回の実装 597 回の 56%）。xtask check は 1 回 約 5 分・0.5〜2.1 GB（V）。
  ・CI は main への push ごとに 11 本の job（xtask check の 8 割り・依存の監査 2・写しの孤児の照らし 1）を撃ち、着地を止めず見張るだけ。着地の門は同じ xtask check を着地の直前の木で撃つ（V）。
  ・gate の FAIL は便の終端で、起草から全周をやり直す（1 周 約 17 万 token・D）。終わりの門が赤い時だけ、実装役を同じ口座で 2 回まで起こし直す口が在る（V・器の規則の行 runner.end_gate_rounds）。
  ・決定はしごの標本 20 のうち守ったのは 9（D・係 w304v）。
  席は根を 3 つと読んだ。作業の状態と知識が会話と記憶に在って台帳のグラフに無い。起草が調べから事務までを 1 体に詰めている。契約を git の設計ノートに置くので契約 1 本ごとに main が動く。案は 9 段の流れ（今は 15 段）と決め D1〜D6 で、席は全部を推奨した（memo t3-hub.91.4 の notes 2026-10-06T08:03Z）。持ち主は 2026-10-06T08:08:35.348Z に D1〜D6 を全部推奨で決めた（記帳 t3-hub.91.4 の notes 2026-10-06T08:11Z）。この時点で判断の記録には写っていない。計画の正本は epic（t3-hub.92）と子の段（S1〜S9） で、頁は見る面にとどまる。
decision: |
  (1) 枠。tsuzuri の流れを 9 段（席が起きる・持ち主が話す・memo を繋ぐ・問題の把握・設計・機械の検査・問うて置く・便・周り）に作り直す（頁の案 3 節）。席の手は「memo を繋ぐ・設計係を起こす・持ち主に問うて置く」の 3 つに絞る。決め D1〜D6 を下の (2)〜(7) に 1 項ずつ置き、段（S1〜S9）（epic t3-hub.92 の子）で行に落とす。段と決めの対応は、段（S1）席の文脈（t3-hub.92.1）= D5・段（S2）設計だけの起草（t3-hub.92.2）= D2・段（S3）繋ぐ門と状態の門（t3-hub.92.5）= D4 と D5・段（S4）契約を bead に（t3-hub.92.7）= D1・段（S5）便の中の直しの周（t3-hub.92.8）= D6・段（S6）CI を止める（t3-hub.92.3）= D3 である。段（S7）審査役の prompt（t3-hub.92.9）は D1 と D2 の帰結（審査役は意味だけを見る）を受ける段、段（S8）はしごの縛り（t3-hub.92.4）は決定 (8) の決まりを縛る段、段（S9）雑の直し（t3-hub.92.6）は食い違いの表の残りを直す段で、どれも D1〜D6 の字の外の手を足す時はその段の行と問いで決める。順は引き金の依存で持つ（S1 →段（S3）・段（S9）／段（S2）→段（S4）→段（S5）・段（S7）／段（S6）と段（S8）は独り）。
  (2) D1 契約の正本を台帳の bead に移し、設計ノートを退ける（段（S4））。器の受付は便を起こす時に bead から契約を読み、run の dir に写す（今も run の dir に契約の file を書いているので、替えるのは読む出所だけ）。設計の節の本文は bead の本文に、契約は bead の欄に置く。preflight に契約の file を直に渡す口（--contract）と、機械で決まる字の照らし（節と done の字・歯の置き場）を足し、設計係は自分の作業の中で preflight を rc 0 まで撃ち、係の終えの門が同じ preflight を撃ち直して通らなければ係を止めて返す（AI を使わない）。名が base に解けるか・大きさの上限の余地・ほかの便との交わりは main が動けば替わるので、器が便を起こす時に撃ち直し、外れたら席を通さず設計係へ返す。git に残すのは長く効く決め（憲法・規則・要件・判断の記録）だけにし、設計ノート・tz derive の契約表・席の設計の commit の門（commit-design.sh）・適用の script・床の 6 本のうち契約のための物を退ける。移すまでは今の正本（設計ノートの契約表の行）のまま流す。
  (3) D2 起草係は設計だけを書く（段（S2））。起草係の型（drafter）の本文を設計係の本文（入力・出力・自己検査 5 項・状態 4 語）に置き換える。型の数 3 は替えない。設計係はグラフの束を読み、契約の雛形を埋める。code を書かず、組まない。差の file（完成した code）・噛み・適用の script・床の写し・係の終えの門の床の撃ち直しを止める。実装役の雛形（runner.txt）は、歯を先に書いて落ちるのを見る → 実装 → 確かめる → 自己検査 → 状態の語と記録の file の型にする（RED→GREEN の記録を返す）。まず小さい行から設計だけの行で測り（1 本目の着地率・token・秒）、2026-10-13 までに全部の行へ広げる。今日（2026-10-06）から起草係に差の file・噛み・適用の script を頼まない。
  (4) D3 push ごとの CI を止め、日に 1 度の全部の撃ち（日次の撃ち）に寄せる（段（S6））。CI の手順（.github/workflows/ci.yml）の push と変更の頼み（pull_request）の撃ちを止める。着地の終端から CI の見張り（close の後の CI の子・終端の語 ci:failure と ci:unmeasurable）を外す。日次の撃ち（ADR-34 の決定 (6)）に、依存の監査（cargo deny・根と scribe2）と写しの孤児の照らしを 1 段ずつ足す（割らずに撃つので和の照らしは 1 回で済む）。日次の撃ちが落ちたら memo が起きる今の仕組みはそのまま使う。
  (5) D4 memo の起票に「繋ぐ」門を足す（段（S3）の候補 1 と 3）。機械が候補（memo・契約・便・設計の節点・code の索引の file と関数）を出し、席が処分する（同じ問題は古い memo に [再発] を足し、関わる物は辺を張り、要らない物は理由を書く）。処分の欠けを門が断る。門は問いの起票の門（touches・not-relevant・要約値）と同じ作りにする。memo 専用の AI 係の型は作らない（条 N-5.1）。問題の把握の束（tz context を memo に広げ、memo の近傍・同じ file の契約と便の履歴と落ちた理由・code の事実を 1 file にする）も同じ段で置く。
  (6) D5 作業の状態を台帳の作業中の bead に置き、圧縮の後に出し、turn の終わりの門で古さを止める（段（S1）と段（S3）の候補 2）。席は手を付けた epic か memo を作業中（in_progress）にし、notes に決まった形の行（計画:・次の手:・優先:・未決:）を足す。器は圧縮の後の文脈の作業中の bead を出す欄（[RECENT-WIP]）にその行を出す。turn の終わりの門は、その turn で台帳か設計を書いたのに作業中の bead の行が古い時と、要望として結んだ発話の時刻を引く行が結び先の memo の notes に無い時に、1 度だけ止める（今の未仕分けの発話の門と同じ作り）。project の事実・持ち主の言葉・決めは台帳に置く。道具の使い方の罠は道具の案内と断りの字に置き（memo t3-hub.92.6.1）、席の自動の記憶は移しの後に切る（段（S1）・持ち主の決め 2026-10-06T08:16:48.774Z「そのうえで1と2は推奨で進めて」）。
  (7) D6 便の中の直しの周を入れ、gate の FAIL を終端にしない（段（S5））。gate の FAIL（重さ Critical と Important）で、同じ worktree の実装役を所見の表つきで続け、直した差だけを再審査する。上限は 2 周で、越えたら設計係へ返す。口は終わりの門の起こし直し（runner.end_gate_rounds）と同じ物を使う。段（S5）の memo の 2 つ目の候補（main の差が便の write-set の依存の閉包に触れない時の着地の前の撃ち直しを省く）は D6 の字の外なので、この記録では決めず、段（S5）の行の起草で測りと問いを置く。
  (8) 決まり（この作り直しの間）。各段は、足す物と同時に消す物を名指す（条 P-27.2）。消す物の無い足しは、段の memo の notes に理由を書く。code の直しは便で入れ、便の外で code を直に入れる道を使わない（条 N-3.1）。段が閉じたら epic（t3-hub.92）の notes に段の済みの 1 行（epic の本文の決まりの字の形・日時と着地の commit か bead）を足す。段ごとの消す物は、段（S1）= bd prime の既定の手引き・記憶の自動の書き、段（S2）= 差の file（docs/design/patch/）・噛み・適用の script・床の写し・係の終えの門の床の撃ち直し、段（S3）= 記憶に置いた事実と決めの行、段（S4）= 設計ノート・tz derive の契約表・席の設計の commit の門（commit-design.sh）・適用の script・条 P-28 の上限、段（S5）= 起草からの全周のやり直しの道、段（S6）= CI の 11 job・器の CI の見張り・終端の CI の語である（各段の memo の「消す物」の字）。
  (9) 置き換える前の決定。次の決定を、名指した段の着地の時に置き換える。前の記録の本文は替えず、その時に要れば前の記録の status と superseded_by を替える（承認の時に 4 欄を同時に置く決まり）。
  ・全部の置き換え: ADR-34 の決定 (5)「CI は全部を撃つ」（D3・段（S6））。ADR-34 の決定 (6) の日次の撃ちは残して足す。ADR-20（条 P-28 の新設と行 R-31・R-32・R-33）は、段（S4）で条 P-28 を改める判断の記録が丸ごと置き換える（D1）。この記録では ADR-20 を退役させない。
  ・部分の置き換え（D1・段（S4））: 器の ADR-1023 の「契約の正本は設計 doc の契約表 1 行」の字（審査と着地を器が持つ部分は残す）。器の ADR-1109 の契約表の置き場（設計 doc の dir と contract-tables の鍵）。ADR-16 の決定 (1) の「設計の参照だけなら契約」の判じと決定 (2) の「設計ノートに契約の行を置いた時に契約の bead を作る」の字。ADR-51 の決定 (1) の「tz derive が契約表の導出物の欄（context）に設計の層の近い仕様を束ねる」の出所（D4 の束へ移す）。ADR-17 の設計ノートの行の辺（req・depends）の出所。ADR-63 の決定 (1) の段の割りのうち「設計の commit と受付」の段と、決定 (5) の門の在りか（commit-design.sh）。
  ・部分の置き換え（D2・段（S2））: ADR-63 の決定 (4) の出す前の床（差の file を名指す係の床の記録 floor.tsv）。ADR-59 の決定 (1) の型 drafter の役「書く」を「設計を書く」に狭める（型の数と門は替えない）。ADR-60 の入口の排他の通す組は差の file を前提にするので、差の file を止めた後は通す組が生じない。決定 (5) の規則の行の値を残すか退けるかは段（S4）の記録で決める。
  ・部分の置き換え（D3・段（S6））: ADR-68 の決定 (2)（close の後に CI の子を起こす）。ADR-68 の決定 (3) の CI の success を待つ周は、CI を待つ代わりの受け皿（次の日次の撃ちの緑を待つか席へ返すか・どちらも host の緑の無い便を黙って閉じない・条 P-7）を段（S6）の器の行の起草で決める。ADR-68 の決定 (4) の尾 ci=* の形は新しい便で生じなくなり、読み手は残す。ADR-36 の基準 D4（CI の最長の役が 300 秒以下）と基準（F1）の CI の緑の読み替え（日次の撃ちで読むか）と規則の行 R-5 の「CI 5 分」は、段（S6）の行で条 P-17.1 の手続きと一緒に決める。
  (10) 条文。この記録は条の字を替えない（amends を持たない）。D1 が要る条 P-28 の改めと、規則の行 R-26・R-27・R-31・R-32・R-33 の退けは、段（S4）で条 A-2 の手続き（判断の記録と撤退の条件を先に書き、条 A-2.3 の敵対的な検証を添え、持ち主の承認〔逐語・日付・裁定 id〕を得てから版を上げる）と条 P-17.1 を経て改める。条 P-2.1 と P-5.1（設計文書の正本と拘束）の、契約を設計文書の外の bead に置く事との読みも、同じ段（S4）の記録で照らす。
options:
  - id: a
    name: 甲 — D1〜D6 を全部推奨のとおりにする
    text: 決定 (1) から (10)。
    verdict: adopted
    reason: 3 つの根（作業の状態が会話に在る・起草が 1 体に詰まる・契約 1 本ごとに main が動く）を全部直す。設計の commit がほぼ消えて main の動きと撃ち直しが約半分になり（見立て・設計の commit の割合から）、機械で決まる審査の落ち 64 回を AI から外し、gate の FAIL の全周のやり直し（約 17 万 token）を同じ便の中の直しに替える。
  - id: b
    name: 乙 — 契約は設計ノートに残し、設計の commit を束ねて減らす（D1 の退けた案）
    text: 今の正本のまま、設計の commit をまとめて置く。
    verdict: rejected
    reason: 契約が git に在る限り、置く前に preflight を撃つには commit の木が要り、main が動くたびに走っている便の撃ち直しが残る。束ねると置くまでの待ちが延びる。
  - id: c
    name: 丙 — 差の file を残すか、設計だけへ一度に替える（D2 の退けた案）
    text: 起草係が完成した code の差を書き続けるか、測らずに全部の行を一度に設計だけにする。
    verdict: rejected
    reason: 差を書く係は実質 2 度実装し、起草の重さが並列の天井になっている。一度に替えると、1 本目の着地率の下がり（今の 91% の多くは差を当てるだけの便による）を測れない。
  - id: d
    name: 丁 — push ごとの CI を残す（D3 の退けた案）
    text: CI の 11 job を今のまま撃つ。
    verdict: rejected
    reason: 着地の門が main に入る木そのものを入る前に撃ち、CI は見張るだけ。CI が足す 3 つ（汚れていない環境・依存の監査・写しの孤児）は 日次の撃ちで足りる。
  - id: e
    name: 戊 — memo の起票を AI の係に任せる（D4 の退けた案）
    text: memo を繋ぐ専用の係の型を足す。
    verdict: rejected
    reason: 条 N-5.1 が文書の型ごとの AI 係の増設を拒む。候補を出すのは機械、処分は席で足りる。
  - id: f
    name: 己 — 作業の状態を記憶と圧縮の要約に置き続ける（D5 の退けた案）
    text: 今のまま記憶（MEMORY.md）と Claude Code の要約に任せる。
    verdict: rejected
    reason: 圧縮で計画・優先・未決が消え、記憶の決まりは条 N-2.1 で規則として効かない。
  - id: g
    name: 庚 — gate の FAIL を終端のまま起草からやり直すか、周の上限を置かない（D6 の退けた案）
    text: 今のまま全周をやり直すか、同じ便の中で直しを何周でも続ける。
    verdict: rejected
    reason: 全周のやり直しは 1 周 約 17 万 token。上限の無い直しは、設計の誤りを実装役が直せないまま回り続ける。
