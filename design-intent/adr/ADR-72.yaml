  verbatim: "D1-6はすべて推奨で"
  surface: R-8
consequences:
  - 契約の git の履歴を失い、台帳（Dolt）の履歴が代わる。folio の頁の契約の表は board が台帳から描く形に替わる。
  - 設計係の 1 本目の着地率は下がる見込み（今の 91% の多くは差を当てるだけの便）。抑える手は、契約に決め（関数の署名・歯の名と断言・置き場・ほかの行との境目）を書かせる事・便の中の直しの周・大きい行だけ実装役を opus にする事・小さい行から測る事。
  - GitHub の上で走る唯一の撃ちが消え、host が壊れた日の検証は無くなる。日次の撃ちが落ちたら memo が起きる。
  - memo の起票と turn の終わりに、門の止めの手間が増える。
  - 席の手から、適用の script・床の 6 本・席の設計の commit の門（commit-design.sh）・設計ノートの版と上限の数え・係ごとの頼みの文の手書き（束と雛形が代わる）が消える。
  - 段（S4）まで、条 P-28 と設計ノートの上限は今のまま効く。D1 と D2 の着地までは、行の書きの罠（記憶から段（S2）の notes へ移した 56 件）が設計係に効く。
note: 起草は係 w310a。番号は design-intent/adr と起草の置き場の下書きを照らし、ADR-72 を名乗る物が無い事を確かめた（71 番は係 w297a の下書きが名乗る）。承認の欄の裁定は memo t3-hub.91.4 の notes の 2026-10-06T08:11Z の行で、逐語はその行の字の頭。持ち主の続きの発話（2026-10-06T08:16 の 2 つ・段（S1）と段（S2）を進める）はこの記録の承認に含めない。grill の欄は置かない（条文を替えない記録のため。条を替える段（S4）の記録で置く）。
