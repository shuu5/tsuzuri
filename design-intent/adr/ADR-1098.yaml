      墓標を口座の一覧の語 (credential=dead) で知らせ、 群は移さず、 人の再 login を待つ。 決め手は分析 (C9 を群の席で満たせない)。
      （平易）印を口座の一覧の語 (credential=dead) で知らせ、 群は移さずに人の login し直しを待つ案です。 群の移動の判定を変えずに済み、 口座の移り変わりが人の判断だけで起きる点で勝ります。 けれども、 群の席は人が気づいて login し直すまで止まり、 止まった席を人手なしに立て直す憲法の条を群の席で満たせません。 人が板か doctor を見るまで気づかれないので、 気づくまでの停止も消えません。
      利点: 群の移動の判定を変えずに済む
