      （平易）印のある口座を、 使用率が閾値以上の口座と同じ「群の逼迫」の値として判定に渡す案です。 判定の出力の型を変えずに済み、 群の逼迫の通知と doctor の表示の形をそのまま使える点で勝ります。 けれども、 窓も使用率も無い状態を窓の値に偽ることになり、 測った値と導いた値の型が混ざります。 「群の逼迫」の語の意味が割れ、 群の逼迫の通知が印でも出ます。
