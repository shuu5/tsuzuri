# 判断の記録 ADR-1098 — 器 scribe2 の判断の記録 ADR-0098 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1098
title: "口座の墓標は器が credential の file から 1 本の関数で判じ、 群は今の口座が墓標なら移動の判定の 1 本で移り、 管理 tick は墓標の席に合図を送らずに群の判定へ進む — 知らせは doctor と管理 tick の行の語で持ち、 席へ押し出す口は足さない (ADR-1058 の判定の列・ADR-1026 の credential を読まない句・ADR-1049 と ADR-1066 の移動の契機・ADR-1074 の予約の読みを部分 supersede)"
status: proposed
date: 2026-09-30
context: |
  口座の login が切れると、 口座の credential の file に使えない印 (墓標) が現れ、 その口座の席は止まる。 器の計測は墓標を名指すが、 doctor の行にも群の移動にも管理 tick の門にも結ばれておらず、 2026-09-29 に席が止まったまま人が気づくまで戻らなかった (量は台帳 memo s2-07l.737.2)。 本 ADR は、 墓標を file から判じる関数を 1 本にすること、 今の口座が墓標の群を群の逼迫と同じ手で移すこと、 墓標の席に合図を送らないこと、 知らせを doctor と管理 tick の行の語で持つことを決める。
  なぜこの判断が要るのかを 7 つから説明します。 鍵の file の印が計測にだけ名指されてどの判断にも結ばれていない経緯・印のせいで席が人の気づきまで止まった事象・群の移動の判定が測れなかった口座を群の逼迫と読まず移らない現物・周期の仕事が古い「作業中」の状態の記録で止まり口座の門が記録の無い周を通し起こし直しが印のある口座で起こす現物・doctor と口座の一覧が印と未計測を見分けない現物・憲法と前の記録の向き・動かす範囲です。
  CTX1 経緯 — 墓標は計測が名指すが、 どの判断にも結ばれていない
  口座の credential の file (Claude Code の私有の形) には、 claudeAiOauth.expiresAt が 0 の形が現れることがある。 これを墓標と呼び、 戻すのは user の再 login だけである (ADR-1017 の背景の実測)。 どの時に Claude Code がこの形を書くかは器の外の振る舞いで、 refresh に失敗した時と読むのは推測 (inferred) である。 器の計測 (SRS FR1033) は token を読む前に墓標を見て、 測れなかった理由 tombstone を記録し、 HTTP も refresh も撃たない。 前の設計 (台帳 s2-07l.420) は墓標を口座の一覧の語と管理 tick（席を見回る周期の仕事） の呼び鈴で名指す形を決めたが、 呼び鈴の送り先の口が ADR-1045 で消えたので超過として閉じ、 実装は 1 行も無い。 ADR-1026 は credential の失効の後の再 login を user の手番とし、 doctor が示すと書いたが、 doctor はそれを示す語を持たない。
  CTX2 事象 — 1 口座の墓標（再 login が要る印）で、 席が人の気づきまで止まった
  2026-09-29、 ある口座に墓標が置かれ、 その口座で立つ orchestrator の席が止まった。 墓標の記録の行の数と止まった長さは台帳 memo s2-07l.737.2 に在る (口座の特定と量は台帳にだけ置く)。 墓標の記録の時刻は、 その席の turn の始まりの打刻と一致した (orchestrator の実測)。 墓標の席の turn は終わりの打刻を打たずに落ちて Busy を残し、 管理 tick は 3600 秒より古い Busy を作業待ち (Idle) と読んで 1 時間ごとに合図を送り、 そのたびに hook の計測が墓標を記した (deduced)。 群の移動の判定（移すかを決める関数）はその周も移らないと答え、 doctor・alarm・席の知らせのどれにも出なかった。 持ち主は、 口座の板で認証の切れを見分けたいと問うた (2026-09-29・逐語は台帳)。
  CTX3 現物 — 群の移動の判定は、 測れなかった口座を逼迫と読まない
  群の移動の判定 (ADR-1066・1 本の関数) は、 群の今の口座の最新の実測の使用率が閾値の rules 行 3 本のどれか以上 (群の逼迫（使用率が閾値越え）) のときだけ移り、 測れなかった行は数えない (0 に読み替えない)。 墓標の今の口座は測れない行しか持たないので、 判定は移らないと答える。 判定は群の今の口座と席の口座を判定を撃つ回ごとに測るので、 墓標の口座も測られて測れなかった記録が増える。 移り先の候補の門は鮮度の窓 (300 秒) の内側の実測を読むので、 墓標の候補は墓標を記した回が最新になるまで外れず、 直前の実測から 300 秒は予約されうる。 先の群が予約を持つかの読み (ADR-1074) も同じ読みである。
  CTX4 現物 — 管理 tick は打刻で止まり、 口座の門（口座で合図を止める条件）は記録が無ければ開き、 起こし直しは群の今の口座で起こす
  管理 tick の判定の列 (ADR-1058) は、 登録の門 → 窓が shell か → 移動の門 → 状態の打刻 → 梯子 → 停止の記録の門 → 黙りの門 → 口座の門 → 入力欄の門 → 注入の順で、 群の移動の判定 (ADR-1066) は打刻を通った周にだけ撃つ。 最終行が Busy の席は黙りの初段 (1800 秒) の 2 倍より古く入力欄が空くまで止まるので、 墓標の席の周で群の判定が撃たれるのは最長 3600 秒の後である。 口座の門は計測の記録の鮮度の内側の最新値だけを読み、 記録が無い・古い周は通す (門は正の証拠でだけ閉じる) ので、 墓標の口座の席には合図が届く。 窓が shell に戻った席は、 群の今の口座 (記録 > 種) で打刻と梯子を読まずに起こし直す (SRS FR1059) ので、 群の今の口座が墓標なら墓標の口座で起こす。
  CTX5 現物 — 見える面は、 墓標と未計測を分けない
  doctor と口座の一覧 (account ls) の口座の行は 1 本の関数で組まれ、 credential= は file が在るか無いかの 2 値だけで、 墓標の口座も present と出る。 doctor の群の行の pressure= は墓標の今の口座で unmeasured、 席の status の reopens= も unmeasured で、 どちらも測っていないと死んでいるを分けない。 群の行は今の口座を current= で名指す。 墓標の語が出るのは計測の一覧 (fleet usage --show) の reason=tombstone だけで、 これは最新の計測の写しなので、 計測が撃たれるまで再 login の後も墓標のまま残る。 消費側の板はこれらの text の key を読む。 doctor の席の行は席の口座の label を持つ。 agent view と trust の読みの語は、 file が無い・読めない・形が違う周を unreadable と出して on や missing に潰さない (C11)。
  CTX6 憲法と既存の決定の向き (本 ADR の解釈)
  C9 は、 席が止まったら人手なしに検出し、 仕事を再開し、 成果を保つことを求める。 本 ADR は墓標で止まった席もこの止まった席に含めて読む。 C2 は判じ手を 1 本の関数にし、 新しい理由を 1 つの variant で表す。 C10 は測った値を出所つきで持ち、 測れないを別の値に読み替えない。 C17 は既に在る仕組みを使って足すものを最小にし、 C17.2 は先に消すものを名指す — 本 ADR が消すのは、 墓標に人が気づくまでの停止と、 墓標の席へ 1 時間ごとに届く合図と計測の記録と、 消費側が credential を自分で読んで判定を写す手である。 A1 の使うの承認は群の宣言の行 (候補の列) で、 移動の承認 event は宣言の逐語を持つ (ADR-1049)。 本 ADR は契機の種類に依らず同じ承認を読む。 ADR-1017 §2.2 は token をどの出力にも出さない。 ADR-1026 §2.2 は「器 SHALL NOT credential を読まず・書かず・代筆せず」と主語を器に置いて書き、 字のままでは口座を足す口の外の読みも縛る。 同じ節は「ls SHALL doctor の口座行 (台帳 s2-07l.233) と同じ関数の行に retired= と最新の実測行の要約 (event log を読むだけ・計測は撃たない) を足し、 判定を持たない (C10.2)」とも決めており、 ls の口座の行が credential=dead を出すことはこの句に触れる。 C3.2 の doctor は口座を照合する 1 つの口である。
  CTX7 射程 — 動かすのは 4 つの決定だけ
  動かすのは (1) 墓標の判定を credential の file を読む 1 本の関数にし、 語を present・missing・dead の 3 つにすること、 (2) 群の移動の判定の契機に墓標を 1 つ足し、 墓標の口座を測らず、 移り先と予約の候補から外すこと、 (3) 知らせを doctor と口座の一覧の口座の行と管理 tick の判定行の語で持つこと、 (4) 管理 tick が墓標の席の打刻と梯子を読まずに群の判定へ進んで合図を送らず、 窓が shell の席は群の今の口座が墓標なら起こす前に群の判定を撃つこと、 の 4 つである。 動かさないのは、 計測の理由と記録・event の種類と形・rules 行・群の記録と承認 event の形・群の行の欄・退避の合図と猶予と /exit と起こし直しの字面 (ADR-1067・ADR-1079)・便用と session 用の口座選定・park の区画の判定・極性一覧である。 要件書は持ち主の SRS の改訂の回に直し、 FR1038・FR1027・FR1058 の字の改訂と、 判定と語を名指す要件 1 つ (受入 1 つ) の追加と、 AC1041 と AC1018 に数を足すことを頼む。 設計 account-lifecycle.md §38 (契約表の行 ab・ac・ad) が実装し、 3 行とも SRS の改訂の後に起こす。 ADR を書く条件のうち 1 (C9 と A1 の読み) と 4 (却下案を残す価値) に当たる。
  （選択肢を測るものさし）この判断を評価する 6 本のものさしです。 印で止まった群の席を人の気づきを待たずに別の口座で続けること。 印の判定を 1 本の関数にし判じる時の実物を読むこと。 期限切れや読めない file では止めず移さないこと。 人と板が既に読む面で印と未計測を見分けられること。 口・規則の行・記録の種類・依存・欄を足さないこと。 鍵を出さず鍵の file に書かないことです。
  DR1｜墓標で止まった群の席を、 人の気づきを待たずに別の口座で続ける (C9) CTX2・CTX3・CTX4
  DR2｜墓標の判じ手を 1 本にし、 判じる時の実物を読む (C2・C10) CTX1・CTX5・CTX6
  DR3｜期限切れや読めない file では止めず移さない — 門は正の証拠でだけ閉じ、 期限の時刻で鳴らさない CTX1・CTX4
  DR4｜人と消費側の板が既に読む面で、 墓標を未計測と見分けられる (C3.2) CTX5・CTX6
  DR5｜足すものを最小にする — 口・rules 行・event・依存・極性・欄を足さない (C17) CTX6・CTX7
  DR6｜token を出さず、 credential に書かない (ADR-1017 §2.2・ADR-1026 §2.2) CTX6
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 印の判定は鍵の file を読む 1 本の関数で、 返す語は present・missing・dead の 3 つだけです。 群の移動の判定は移る理由を「群の逼迫」と「印」の 2 つで持ち、 印のある口座を測らず、 移り先と予約から外します。 周期の仕事は印のある席に合図を送らず、 判定行の理由を停止の記録の席なら今どおり heartbeat-off、 そうでなければ account-dead とし、 窓が shell に戻った群の席は起こす前に群の判定を撃ちます。 知らせは同じ 1 本の判定から出る語で、 doctor と口座の一覧の口座の行は dead、 周期の仕事の判定行は account-dead と出します。
  採用 — OPT1
  器 SHALL 口座の credential の墓標 (claudeAiOauth.expiresAt が 0) を、 口座の設定 dir の credential の file を読む 1 本の関数で判じる。 墓標の判じは計測 (SRS FR1033) の token の読みと同じ 1 本で、 関数は閉じた語 present・missing・dead だけを返す。 file が無ければ missing、 墓標と読めれば dead、 それ以外 (期限切れ・読めない・形が違う・token が無い) は present とする。 関数は計測を起こさず、 file に書かず、 token をどの出力にも出さない。 器が credential を読むのは計測とこの判定の 2 つに限り、 口座を足す口は credential を読まず書かない。 群の移動の判定 (ADR-1066) SHALL 契機を閉じた 2 値 (群の逼迫・墓標) で持ち、 群の今の口座が墓標なら群の逼迫と同じ予約・群の記録・承認 event (群の宣言の逐語)・退避の合図・猶予・/exit・起こし直しで移る。 判定 SHALL 墓標の口座を測らず、 移り先の候補と予約の読みから外す。 先の群の今の口座が墓標なら、 その群も予約を持つ。 event の種類と形・記録の形・承認の逐語は変えず、 契機を記録しない。 管理 tick SHALL 登録 row の口座が墓標の周、 状態の打刻と梯子の記録を読まずに群の判定 (鮮度の窓に 1 回まで) へ進み、 移った周は同じ周の移動の門が退避を撃ち、 移らない周は合図を送らず、 判定行の理由は停止の記録の席なら今どおり heartbeat-off、 そうでなければ account-dead とする。 窓が shell の周は、 群の今の口座が墓標なら起こす前に同じ群の判定を撃ち、 群の今の口座 (移った周は移り先) で起こす。 file は周ごとに読むので、 墓標でなくなった次の周から今の列に戻る。 知らせ SHALL 同じ 1 本の判定から出る語 (doctor と口座の一覧の口座の行は credential=dead・管理 tick の判定行は理由 account-dead) の 2 か所で持ち、 群の行の欄と席へ押し出す口は足さない。 rules 行・event・口・依存・極性一覧は足さない。 実装は設計 account-lifecycle.md §38 (契約表の行 ab・ac・ad)。
  （平易）器は、 口座の鍵の file の期限の値が 0 の印を、 口座の設定 dir の鍵の file を読む 1 本の関数で判じます。 印の読み方は計測と同じ 1 本で、 関数は present (在る)・missing (無い)・dead (印) の 3 語だけを返します。 file が無ければ missing、 印と読めれば dead、 期限切れ・読めない・形が違う・鍵が無いといったそれ以外は present です。 関数は計測を起こさず、 file に書かず、 鍵を出しません。 器が鍵の file を読むのは計測とこの判定の 2 つだけで、 口座を足す口は読みも書きもしません。 群の移動の判定は、 移る理由を「群の逼迫 (使用率の閾値越え)」と「印」の 2 つで持ち、 今の口座に印がある群も群の逼迫と同じ予約・群の記録・承認の記録 (群の宣言の文)・退避の合図・猶予・/exit・起こし直しで移ります。 判定は印のある口座を測らず、 移り先と予約の候補から外します。 先の群の今の口座に印があれば、 その群も予約を持ちます。 移る理由は記録に書きません。 周期の仕事は、 席の口座に印がある周は状態の記録と合図の間隔の記録を読まずに群の判定 (鮮度の窓に 1 回まで) へ進み、 移った周は同じ周の移動の門が退避を撃ちます。 移らない周は合図を送らず、 判定行の理由は、 合図を止める記録 (停止の記録) の在る席なら今どおり heartbeat-off、 そうでなければ account-dead です。 窓が shell に戻った周は、 群の今の口座に印があれば起こす前に同じ群の判定を撃ち、 群の今の口座 (移った周は移り先) で起こします。 鍵の file は周ごとに読むので、 login し直した次の周から今の並びに戻ります。 知らせは同じ 1 本の判定から出る語 (doctor と口座の一覧の口座の行は credential=dead・周期の仕事の判定行は account-dead) の 2 か所で持ち、 群の行の欄と席へ押し出す口は足しません。
  （理由）鍵の file を読む 1 本の関数を選んだのは、 計測の記録は測った時の写しで、 login し直した後も古い死を見せ、 測られていない口座の印を出せないからです。 file を読めば判じる時の実物になり、 計測と同じ印の読み方を共有するので判じ手は 1 本のままです。 読めない file を present に入れるのは、 present が「file が在り印と読めない」までしか言わないので読めない file を入れても偽にならず、 agent view と trust の語のように判断の前提を潰す形と違って、 門を閉じ群を移すのを確かな印の dead に限るためです。 印のある群を移すのは、 群を移す手 (予約・記録・承認・退避・起こし直し) が群の逼迫のために既に在り、 移す手そのものを足さずに済むからで、 知らせるだけでは人が気づくまで席が止まります。 印を群の逼迫に含めないのは、 窓の値を偽ると測った値と導いた値が混ざるからです。 印のある席に合図を送らないのは、 印の席は合図を読めず、 送るたびに落ちる turn と計測の記録が 1 時間ごとに増えるからです。 印のある席で状態の記録を読まずに群の判定へ進むのは、 印の席の最後の状態の記録が「作業中」のまま残り、 読んでから進むと群の判定が最長 3600 秒遅れるからです。 窓が shell に戻った群の席で起こす前に群の判定を撃つのは、 起こし直しは群の今の口座で起こすので、 判定を待つと印の口座で起こして席が login の画面で止まり、 後の判定で移っても退避の合図と /exit が届かないかもしれないからです。 群の行の pressure= に dead を出さないのは、 群の行の current= と口座の行の credential= で既に引け、 使用率の値の欄に印の語を混ぜると欄の意味が割れるからです。 期限切れを present にするのは、 門を確かな印でだけ閉じ、 期限の時刻での誤報を避けるためです。 知らせを既存の行の語に置くのは、 印のある席は合図を読めず、 新しい口と語の一覧と欄を足さずに人と板が見る面で見分けられるからです。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1038（claim）: FR1038 (群の逼迫の通知と移動) の契機と候補の門の側。 本 ADR は、 群の今の口座が墓標の群も群の逼迫と同じ移り先の決め方と記録と承認と退避と起こし直しで移り、 墓標の口座を測らず、 移り先と予約の候補から外し、 先の群の今の口座が墓標ならその群も予約を持つと主張する。 FR1038 の字 (閾値のどれか以上の群について移る・候補は鮮度の内側の実測を持ち閾値未満) に墓標の契機と候補の門を書き足すことと、 判定と語を名指す要件 1 つ (受入 1 つ) を足すことは、 持ち主の SRS の改訂の回である。
  FR1027（claim）: FR1027 (管理 tick) の判定の列の側。 本 ADR は、 登録 row の口座が墓標の席には合図を送らず (判定行の理由は停止の記録の席なら今どおり heartbeat-off、 そうでなければ account-dead)、 その席は状態の打刻の門で止めずに群の移動の判定へ進み、 窓が shell の群の席は群の今の口座が墓標なら起こす前に判定を撃つと主張する。 FR1027 の送る条件は必要条件の列なので送らない条件の追加とは矛盾しないが、 条件の並びの正本を ADR-1058 とする字を本 ADR へも向けるのは SRS の改訂の回である。
  FR1058（rationale）: FR1058 (口座の登録・退役・復帰) は、 口座を足す口が credential を読まず書かないと決める。 本 ADR はその口の振る舞いを変えず、 器が credential を読むのを計測と墓標の判定の 2 つに限る根拠に使う。 FR1058 の平易の層の「器は credential を読みも書きもしない」を口座を足す口に閉じた字へ直すのは SRS の改訂の回である。
  FR1033（rationale）: FR1033 (口座残量の計測) は、 読めない回を理由つきで測れなかったと記録し、 0 に読み替えない。 本 ADR はその墓標の読みを判定の 1 本として共有し、 群の移動の判定が墓標の口座を測らないだけで、 計測の理由・記録の形・計測の口は変えない。
  FR1059（rationale）: FR1059 (席の起動) は、 起こし直しの口座を、 置き場が群に属する周は群の今の口座に決める。 本 ADR は窓が shell の周に、 起こす前に群の判定を撃つだけで、 口座の決め方は変えない (移った周は群の今の口座が移り先になる)。
  FR1078（rationale）: FR1078 (heartbeat の実効の値) は、 実効の値が off の席の判定行に理由 heartbeat-off を出すと決める。 本 ADR は account-dead をその後ろに置き、 off の席の理由の語を変えない。
  FR1044（rationale）: FR1044 (席の入力欄への差し込みの閉じた一覧) は変えない。 墓標の群の移動が差し込むのは既存の退避の合図と /exit と起こし直しの行だけで、 墓標を知らせる新しい差し込みは足さない。 移り先の無い周は、 既存の群の断りの 1 行が墓標の席へ 1 回届く (入力欄の門を通った周だけ・同じ実測に 2 度は送らない)。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録は ADR-1058・ADR-1026・ADR-1049・ADR-1066・ADR-1074 を一部だけ置き換えます。 置き換えるのは、 周期の仕事の判定の並び、 器が鍵の file を読まないとした句の読む主体と一覧が判定を持たないとした句、 群を移す理由と移り先の候補の門 (印のない口座だけを移り先にする)、 判定が印の口座を測らないこと、 判定を撃つ周、 予約を持つ群の読みです。 原則は、 器が確かに読める停止の印は人の気づきを待たずに既に在る立て直しの経路へ結び、 知らせは人が既に読む面の語で持ち、 確かでない兆しでは止めず移さない、 です。
  改訂状態: current
  置き換える ADR: ADR-1058, ADR-1026, ADR-1049, ADR-1066, ADR-1074
  置き換えられた: なし (現行)
  部分 supersede。 ADR-1058 からは、 判定の列の口座の門を「記録が無い・古い周は通す」のまま、 登録 row の口座が墓標の席は状態の打刻と梯子を読まずに群の判定へ進み、 停止の記録の門の後で合図を送らない形に改める (列の他の条件と順は不変)。 ADR-1026 からは、 §2.2 の「器 SHALL NOT credential を読まず・書かず・代筆せず」(主語は器) のうち読まない句を、 読まない主体を口座を足す口に閉じ、 器が読むのを計測と墓標の判定の 2 つに限る形に改める。 同じ節の「ls SHALL … 判定を持たない (C10.2)」の句も、 ls の口座の行が判定の 1 本の関数の語 credential= (dead を含む) を写す形に改める (判定は 1 本の関数が持ち、 ls は語を写す)。 書かない・代筆しない・login を待たない・retired= と実測行の要約は不変。 ADR-1049 と ADR-1066 からは、 移動の契機（群を移す理由）を群の逼迫だけから群の逼迫と墓標の 2 値に広げ、 移り先の候補の門に墓標でないことを足し、 判定が墓標の口座を測らず、 管理 tick が判定を撃つ周に窓が shell で群の今の口座が墓標の周 (起こす前) を足す (記録・承認・退避・起こし直し・lock と鮮度の窓は不変)。 ADR-1074 からは、 予約を持つ群を逼迫した群から契機を持つ群へ改める。 ADR-1017・ADR-1067・ADR-1079 は置き換えない。
  照会終端 — PRIN-A-CERTAIN-STOP-MARK-JOINS-THE-EXISTING-RECOVERY
  器が確かに読める停止の印は、 人の気づきを待たずに既に在る立て直しの経路へ結び、 知らせは人が既に読む面の語で持つ。 確かでない兆し (期限の時刻・読めない file) では止めず移さない。
  本 ADR が計測の記録から読む案・移さずに知らせるだけの案・逼迫に含める案・席へ押し出す案・語を 4 つにする案・門を今のままにする案・unreadable を足す案・群の行に dead を出す案を退け、 file の 1 関数と群の移動と doctor と管理 tick の語を選んだのはこの原則に行き着く (これ以上は遡らない照会終端)。
options:
  - id: "OPT1"
    name: "file の 1 関数で墓標を判じ、 群を移し、 墓標の席に合図を送らず、 doctor と管理 tick の行の語で知らせる"
    text: |
      credential の file を読み計測の墓標の読みを使う 1 本の関数が present・missing・dead を返す。 群の移動の判定は墓標の口座を測らず、 今の口座が墓標なら群の逼迫と同じ予約・記録・承認 event・退避・起こし直しで移り、 墓標の口座を移り先と予約から外す。 管理 tick は墓標の席の打刻と梯子を読まずに群の判定へ進み、 合図は送らない。 窓が shell の席は、 群の今の口座が墓標なら起こす前に群の判定を撃つ。 知らせは同じ 1 本の判定から出る語 (doctor と口座の一覧の口座の行は credential=dead・判定行は account-dead) で持ち、 群の行は今の欄のまま (current= と credential= で引ける)。 決め手は分析 (移す仕組みと見える面は既に在り、 移す手そのものは足さない)。
      （平易）鍵の file を読み、 計測と同じ印の読み方を使う 1 本の関数が present・missing・dead を返す案です。 群の移動の判定は印のある口座を測らず、 今の口座に印があれば群の逼迫と同じ予約・記録・承認の記録・退避の合図・起こし直しで移り、 印のある口座を移り先と予約から外します。 周期の仕事は印のある席の状態の記録と合図の間隔の記録を読まずに群の判定へ進み、 合図は送りません。 窓が shell に戻った席は、 群の今の口座に印があれば起こす前に群の判定を撃ちます。 知らせは同じ 1 本の判定から出る語 (口座の行は credential=dead・判定行は account-dead) で持ち、 群の行は今の欄のままです。 代わりに、 期限の内に無効にされた鍵は捉えず、 群の外の席と park の区画の席は再 login まで止まり、 印の席の終了は猶予の上限を待ち (login の画面で止まった席には合図も /exit も届かないかもしれない)、 鍵の file を読む回数が増える (周期ごとに席の口座 1 つ・判定の周に候補の全口座・doctor と一覧は全口座) ことと、 判定済みの窓の内側と移り先の無い群では窓が shell の群の席を印の口座で起こすことを引き受けます。
      利点: 移り先が在る群の席は墓標から十数分で別の口座で会話を続ける (login の画面で止まった席を除く・CSQ-N4) (DR1)
      利点: 判じ手は計測の墓標の読みと同じ 1 本で、 判じる時の file を読む (DR2)
      利点: 期限切れと読めない file は present で、 門も移動も墓標の正の証拠でだけ動く (DR3)
      利点: 板と doctor が墓標を 1 語で見せ、 板は判定を写さない (DR4)
      利点: rules 行・event・口・依存・極性・群の行の欄は増えない (DR5)
      利点: 関数は閉じた語だけを返し、 token を出さず書かない (DR6)
      欠点: 期限の内に無効にされた token (HTTP 401) は file が墓標にならず捉えない
      欠点: 群の外の席と park の区画の席は移らず、 再 login まで止まる
      欠点: 墓標の席は退避の合図に応えられないので、 /exit は猶予の上限 (300 秒) の後になり、 login の画面で止まった席には合図も /exit も届かないかもしれない
      欠点: credential の file を読む回数が増える (管理 tick の周ごとに登録 row の口座 1 つ・群の判定を撃つ周に測る集合と候補の全口座・doctor と口座の一覧は全口座)
      欠点: 鮮度の窓の内側で判定済みの周と移り先の無い群では、 窓が shell の群の席を墓標の口座で起こす
    verdict: adopted
    reason: "決め手は分析 (移す仕組みと見える面は既に在り、 移す手そのものは足さない)。"
  - id: "OPT2"
    name: "死を計測の記録から読む"
    text: |
      最新の計測の回の測れなかった理由 tombstone を墓標と読み、 file は読まない。 決め手は分析 (記録は測った時の写しで、 doctor と口座の一覧は計測を撃たない)。
      （平易）印を、 最新の計測の回の「測れなかった理由 tombstone」から読み、 鍵の file は読まない案です。 計測のほかで鍵の file を読まずに済み、 計測が HTTP の結果を記録するように広がれば無効にされた鍵も同じ読みで拾える点で勝ります。 けれども、 記録は測った時の写しなので計測が撃たれるまで古く、 login し直した後も死と読み、 測られていない口座の印は出ません。 記録は置き場ごとに割れ、 doctor と口座の一覧は計測を撃たないので読める記録が無いこともあります。
      利点: credential の file を計測のほかで読まずに済む
      利点: 計測が HTTP の status を記録するように広がれば、 401 も同じ読みで拾える
      欠点: 計測が撃たれるまで古く、 再 login の後も死と読み、 測られていない口座の死は出ない (DR2)
      欠点: 置き場ごとの記録に割れ、 doctor と口座の一覧は計測を撃たないので読める記録が無いことがある (DR2・DR4)
