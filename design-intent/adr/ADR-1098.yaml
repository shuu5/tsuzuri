  - id: "OPT6"
    name: "語を 4 つにして期限切れも名指す"
    text: |
      判定の語を ok・expired・dead・missing にし、 期限の過ぎた token も expired として出す。 決め手は分析 (期限切れは Claude Code が使う時に refresh する一時の形)。
      （平易）判定の語を ok・expired・dead・missing の 4 つにし、 期限の過ぎた鍵も expired として出す案です。 鍵の file の状態を細かく見せられ、 期限の近さを板で追える点で勝ります。 けれども、 期限切れは Claude Code が使う時に自分で更新する一時の形で、 期限の時刻を根拠にした知らせは誤報の源として前の裁定が退けています。 既存の語 present を割るので、 板の読み方も変わります。
      利点: file の状態を細かく見せられる
      利点: 期限の近さを板で追える
      欠点: 期限の時刻を根拠にした知らせは false alarm の源で、 前の裁定が退けた (DR3)
      欠点: 既存の語 present を割り、 消費側の板の読みが変わる (DR4)
    verdict: rejected
    reason: "決め手は分析 (期限切れは Claude Code が使う時に refresh する一時の形)。"
  - id: "OPT7"
    name: "合図の門を今のままにする"
    text: |
      管理 tick の判定の列を変えず、 墓標の席にも合図を送り、 群の判定は打刻を通った周にだけ撃つ。 決め手は分析 (無駄な turn が続き、 群の判定が最長 3600 秒遅れる)。
      （平易）周期の仕事の判定の並びを変えず、 印のある席にも合図を送り、 群の判定は状態の記録を通った周にだけ撃つ案です。 判定の並びと理由の語を変えずに済み、 login し直した後の最初の合図が人の手なしに席の続きを促す点で勝ります。 けれども、 印のある席に 1 時間ごとに合図が届き、 そのたびに落ちる turn と計測の記録が増えます。 最後の状態の記録が「作業中」のままなので、 印のある席の周の群の判定は最長 3600 秒遅れます。
      利点: 判定の列と理由の語を変えずに済む
      利点: 再 login の後の最初の合図が、 人の手なしに席の続きを促す
      欠点: 墓標の席に 1 時間ごとに合図が届き、 そのたびに落ちる turn と計測の記録が増える (DR5)
      欠点: 最終行の Busy のせいで、 墓標の席の周の群の判定が最長 3600 秒遅れる (DR1)
    verdict: rejected
    reason: "決め手は分析 (無駄な turn が続き、 群の判定が最長 3600 秒遅れる)。"
  - id: "OPT8"
    name: "読めない file に 4 つ目の語 unreadable を足す"
    text: |
      file が在るのに読めない・JSON でない・形が違う周を present でなく unreadable と出す (agent view と trust の読みと同じ形)。 決め手は分析 (present は「file が在り墓標と読めない」までしか言わず、 unreadable で決まる判断が無い)。
      （平易）鍵の file が在るのに読めない・形が違う周を、 present でなく 4 つ目の語 unreadable と出す案です。 agent view と trust の読みの語と形が揃い、 読めない file を板で見分けて人が早く見に行ける点で勝ります。 けれども、 agent view と trust の語は判断の前提の値なので、 読めないを on や missing に潰すと偽の値になりますが、 present は「file が在り印と読めない」までしか言わないので、 読めない file を入れても偽になりません。 門を閉じ群を移すのは dead だけで、 unreadable の語で決まる判断が無く、 既存の試験の期待も動きます。
      利点: agent view と trust の読みの語の形と揃い、 読めない file を板で見分けられる
      利点: 読めない file の口座を人が早く見に行ける
      欠点: agent view と trust の語は判断の前提の値なので読めないを on や missing に潰すと偽の値になるが、 credential の present は「file が在り墓標と読めない」までしか言わないので、 読めない file を入れても偽にならない (C11 は破れない)
      欠点: 門を閉じ群を移すのは dead だけで、 unreadable の語で決まる判断が無く、 既存の fixture の期待も動く (DR5・C17)
    verdict: rejected
    reason: "決め手は分析 (present は「file が在り墓標と読めない」までしか言わず、 unreadable で決まる判断が無い)。"
  - id: "OPT9"
    name: "doctor の群の行の pressure= に dead を出す"
    text: |
      群の今の口座が墓標なら、 群の行の pressure= を unmeasured でなく dead にする。 決め手は分析 (current= と口座の行の credential= で既に引ける)。
      （平易）群の今の口座に印があれば、 doctor の群の行の pressure= を unmeasured でなく dead にする案です。 群の行 1 行だけで印で移る群と移れない群が見え、 板が口座の行を引かずに済む点で勝ります。 けれども、 群の行の current= と口座の行の credential= で既に引けるので、 足すのは既に在る事実の写しになります。 pressure= は使用率の値の欄で、 印の語を混ぜると欄の意味が割れます。
      利点: 群の行 1 行だけで、 墓標で移る群と移れない群が見える
      利点: 板が口座の行を引かずに済む
      欠点: 群の行の current= と口座の行の credential= で既に引け、 足すのは既に在る事実の写しになる (DR5・C17)
      欠点: pressure= は使用率の値の欄で、 墓標の語を混ぜると欄の意味が割れる (DR4)
    verdict: rejected
    reason: "決め手は分析 (current= と口座の行の credential= で既に引ける)。"
basis: [FR1027, FR1033, FR1038, FR1044, FR1058, FR1059, FR1078, AC1018, AC1041, ADR-1017, ADR-1026, ADR-1045, ADR-1049, ADR-1058, ADR-1066, ADR-1067, ADR-1069, ADR-1074, ADR-1079]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「席」は人と AI が話す session、 「口座」は席が使う Claude の契約 1 つ、 「群」は同じ口座をまとめて使い、 口座を移るときは一緒に移る席のまとまりです。 口座の login が切れると、 口座の鍵の file (credential) に「もう使えない」という印 (墓標) が現れ、 その口座で動く席は止まります。 器の計測はこの印を見つけていましたが、 doctor の表示にも、 群を別の口座へ移す判定にも、 黙った席に合図を送る周期の仕事 (管理 tick) にも結ばれておらず、 2026-09-29 に席が止まったまま人が気づくまで戻りませんでした (止まった長さは台帳の memo に在ります)。 この記録は、 印を鍵の file から読む関数を 1 本にし、 今の口座に印がある群を使用率の閾値越え (群の逼迫) と同じ手で別の口座へ移し、 印のある席には合図を送らず、 知らせは doctor と周期の仕事の既存の行の語で出すと決めます。 まだ要件書の改訂を待つ提案の段です。
consequences:
  - "この判断で良くなること 5 つと、 代わりに引き受けること 8 つです。 良くなるのは、 印のある群の席が移り先が在れば十数分で別の口座で続くこと (login の画面で止まった席を除く)、 2 か所が同じ 1 本の判定から出る語で印を見せること、 1 時間ごとの無駄な合図と印の口座を測る記録が止まること、 印のある口座が移り先にならず、 窓が shell の群の席は判定の周に移り先が在れば移り先の口座で起こされること、 規則の行・記録の種類・口・依存・欄を足さないことです。 引き受けるのは、 期限の内に無効にされた鍵を捉えないこと、 群の外の席と区画の席は再 login まで止まること、 印の席の終了は猶予の上限を待つこと、 login の画面で止まった席には合図も /exit も届かないかもしれないこと、 便や session 用の口座選びは閉じないこと、 鍵の file を読む回数が増えること、 読めない file は present と出ること、 判定済みの窓の内側と移り先の無い群では窓が shell の群の席を印の口座で起こすことです。"
  - "良い結果: 今の口座が墓標で移り先が在る群の席は、 判定の窓と猶予と tick の周期を足した十数分のうちに別の口座で会話を続ける (login の画面で止まった席を除く・CSQ-N4)"
  - "良い結果: doctor と口座の一覧の口座の行と管理 tick の判定行が、 同じ 1 本の判定から出る語 (口座の行は dead・判定行は account-dead) で墓標を見せ、 板は語を読むだけで判定を写さない"
  - "良い結果: 墓標の席へ 1 時間ごとに届いていた合図と、 それが起こす落ちる turn と、 判定が墓標の口座を測って増やしていた計測の記録が止まる"
  - "良い結果: 直前に測れた墓標の口座も、 移り先と予約の候補にならない。 窓が shell の群の席は、 判定を撃つ周に移り先が在れば移り先の口座で起こす"
  - "良い結果: rules 行・event の種類・口・依存・極性一覧・群の行の欄は増えない。 足すのは、 判定の関数 1 本・理由の値 1 つ (契機の閉じた 2 値 MoveCause とそれを返す move_cause)・測る前に墓標の口座を外す門の条件・管理 tick の打刻を読まない枝と合図を送らない早い戻り・起こす前の群の判定・群の判定の入力の形 (Front でなく anchor と rules の行と時刻)・語 2 つ (credential= の dead と理由の account-dead)"
  - "代償: 期限の内に無効にされた token (HTTP 401) は file が墓標にならず捉えない。 区別には計測の event の形の変更が要る"
  - "代償: 群の外の席と park の区画の席は移らず、 再 login まで止まる (知らせは doctor の口座の行と判定行だけ)"
  - "代償: 墓標の席は退避の合図の turn を終えられないので、 /exit は猶予の上限 (rules 行 seat.move_grace_s) の後になる"
  - "代償: login の画面で止まった席には、 入力欄の門が通らず退避の合図も /exit も届かないかもしれない (未測)"
  - "代償: 便用と session 用の口座選定の前計測の鮮度の内側に居る墓標の口座は選ばれうる (本 ADR は群の候補と予約だけを閉じる)"
  - "代償: credential の file を読む回数が増える (管理 tick の周ごとに登録 row の口座 1 つ・群の判定を撃つ周に測る集合と候補の全口座・doctor と口座の一覧は全口座)"
  - "代償: 読めない file と形の違う file は present と出る (墓標と読めたときだけ dead)"
  - "代償: 鮮度の窓の内側で既に判定を撃った周と移り先の無い群では、 窓が shell の群の席を墓標の口座で起こし、 席は login の画面で待つ"
note: |
  器の元の file: scribe2/design-intent/decisions/ADR-0098-credential-tombstones-move-the-group-and-close-the-heartbeat-gate.html
  器の表紙の頭: 設計判断記録 (ADR) scribe2 — 口座の墓標の判定と群の移動
  器の表紙: 状態proposed選択肢9件 (OPT1–OPT9)結果良い 5 / トレードオフ 8版v0.3.0 / 2026-09-30
  器の表紙: 正当化する要件: SRS-SCRIBE2-MVP の FR1038・FR1027・FR1058・FR1033・FR1059・FR1078・FR1044
  器の表紙: 想定読者: scribe2 の開発 session と user — 器の内部と Rust の専門知識は不要 (専門語はやさしい言葉を併記)
  器の承認の欄: 設計 (orchestrator)・orchestrator・2026-09-30 草稿 v2 (credential の読みと計測・群の移動の判定・管理 tick の判定の列と起こし直し・doctor の口座と群の行の現物を読み、 ADR-1017・ADR-1026・ADR-1049・ADR-1058・ADR-1066・ADR-1074・ADR-1079 の決定と照らした。 論点 4 つは持ち主の常設の裁定 (決めてほしいことは推奨で進める) の下で推奨を採り、 v2 は fidelity の審査と設計の敵対 review の findings を orchestrator が裁いた結果を写す。 本件に固有の user の裁定 id は無く、 rules 行を足さないので C5 の裁定 id も要らない。 拘束する constitution の版 0.5.0)・作成
  器の案の章の要約: 候補を 9 つ並べます。 鍵の file を読む 1 本の関数で印を判じ、 群を移し、 印のある席に合図を送らず、 doctor と周期の仕事の行の語で知らせる案 (選んだ案) と、 選ばなかった 8 つです。 選ばなかった案は、 印を計測の記録から読む案・移さずに知らせるだけの案・印を群の逼迫に含める案・席の画面へ知らせを押し出す案・語を 4 つにして期限切れも名指す案・合図の門を今のままにする案・読めない file に 4 つ目の語を足す案・群の行に dead を出す案です。
  器の専門語の説明: 本文に出てくる専門語 7 個を、 やさしい言葉で説明します。
  ・口座の墓標（credential tombstone）: 口座の credential の file の期限の値 (expiresAt) が 0 の状態。 戻すのは user の再 login だけ (ADR-1017 の背景の実測)。 どの時に Claude Code がこの値を書くかは器の外の振る舞いで、 refresh の失敗の時と読むのは推測。 本 ADR の判定の語では dead。 計測は測れなかった理由 tombstone で記録する。
  ・群の逼迫（group pressure）: 群の今の口座の鮮度の内側の実測が、 窓ごとの閾値 (5 時間窓・7 日窓・モデル別窓の rules 行 3 本) のどれか以上である状態 (SRS FR1038)。 本 ADR の移動の契機の 1 つで、 墓標はこれに含めない。
  ・移動の契機（move cause）: 群の移動の判定が群を移す理由の閉じた 2 値 (本 ADR)。 群の今の口座が使用率の閾値を越えた (群の逼迫) か、 群の今の口座が墓標か。 どちらでも移り先の決め方・記録・承認・退避・起こし直しは同じ。
  ・群の移動の判定（group move judgement）: 群の今の口座を読み、 移る契機が在れば移り先を 1 回決めて群の記録と承認 event を書く 1 本の関数 (ADR-1066)。 便の終端の周と管理 tick が同じ 1 本を呼ぶ。 本 ADR で、 墓標の口座を測らない。
  ・群の予約（group reservation）: 群ごとに周ごと導く、 その群が次に移る口座 (ADR-1069・ADR-1074)。 本 ADR で、 予約を持つのは移る契機を持つ群になり、 墓標の口座は予約されない。
  ・管理 tick（management tick）: 席ごとの周期の仕事 (ADR-1058)。 黙った席へ合図を送り、 死んだ席を起こし直し、 群の移動の判定を撃つ。 本 ADR で、 口座が墓標の席には合図を送らず、 判定行の理由を停止の記録の席なら今どおり heartbeat-off、 そうでなければ account-dead とし、 群の今の口座が墓標の席は起こす前に群の判定を撃つ。
  ・口座の門（account gate）: 管理 tick の判定の列の 1 つ (ADR-1058)。 席の口座の計測の記録が群の逼迫の閾値以上なら合図を送らない。 記録が無い・古い周は通す。 墓標の判定は本 ADR が門とは別の位置 (打刻の前と停止の記録の門の後) に置く。
