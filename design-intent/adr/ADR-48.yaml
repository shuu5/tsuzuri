# 判断の記録 ADR-48 — 実験場の形 B の最初の 1 周は、使い回しなし 1 回とあり 2 回の 24 便を、便の全部の段の書きの和で SSD 220 GB を上限に撃つ（持ち主の裁定 2026-10-04・記帳先 = tsuzuri の台帳の問い t3-hub.77.18 の notes）
# 起草は係 w161a（2026-10-05）。材料は係 w144a の形 B の道具（drafts/w144a/w/xp/）・検証役 qv150 の攻め（drafts/qv150/w/attack.md）・問いの本文。ADR-37 と ADR-43 は封で本文が凍っているので、その決定の一部をこの記録が替える（ADR-43 の決定 (1) と同じ形）。承認の欄は問い t3-hub.77.18 の裁定。
id: ADR-48
title: 実験場の形 B の最初の 1 周（組みの使い回しを名乗る前の比べ）は、8 本の仕事を使い回しなしの版で 1 回・ありの版で 2 回の 24 便で撃ち、SSD の書きの上限を便の全部の段の和で 220 GB とする
status: accepted
date: 2026-10-04
context: |
  ADR-37 の決定 (6) は、組みの使い回し（ADR-35）を tsuzuri の宣言で名乗る前に、形 B を「使い回しなし」と「使い回しあり」の 2 版で撃つと決め、書き込みを約 110 ギガバイト（GB）と見込んだ。形 B の 1 周は決定 (1) で 8 本を 2 版 2 回ずつの 32 便、上限は決定 (2) で記憶の装置（SSD）の書き 120 GB 以下である。ADR-43 の決定 (4) は、その上限がそのまま効くと書いた。
  測り直し（2026-10-04・検証役 qv150 と席）。本番の便 18 本の全部の段（実装の AI・gate・終わりの門・着地の確かめ・列の候補）の書きは 1 便 平均 14.7 GB で、ADR-37 の決定 (6) の見込みは組みの列 1 回分（1 便 5.4 GB）だけを数えていた。便の費用の記録（RunCost）は便の書きの約 7 割しか持たない（終わりの門・着地の確かめ・列の候補が抜ける・ADR-49）。仕事の組は決定 (4) の範囲で、歯の束ねの後の木に種ごとに選び直した（席・記帳済み）。実験に近い 1 便（main が動かないので再 gate なし）で数えた見込みは、決めどおりの 32 便で 258 GB と上限の約 2.1 倍、使い回しなし 1 回とあり 2 回の 24 便で 184 GB、ありの 2 回だけの 16 便で 110 GB。token はどの形も上限 1 億の内（32 便で約 7,900 万）。host は今も規則の行 R-40 の線（7 日の平均で 1 日 1.5 テラバイト（TB））を 1 日 約 0.9 TB 越えていて、7 日の平均への上乗せは 24 便で 1 日 約 26 GB、32 便で約 37 GB になる。
  席の読み。使い回しを名乗った後に撃つ版は「あり」なので、名乗りの後の比べの物差し（群 g の基・ADR-36 の決定 (4)）は「あり」の 2 回の撃ちから取る（ADR-37 の決定 (6) は版を書いていない・この読みは memo に記帳する）。「なし」の 2 回目は、物差しに使わない版の揺れだけを測る。
  問い（t3-hub.77.18）は案 E に裁定された（裁定 id は承認の欄）。
decision: |
  (1) 替える決め。この記録は、封で凍った ADR-37 の決定 (6)（最初の比べ）の撃つ便の数と、決定 (2) の形 B の記憶の装置（SSD）の上限のうち最初の比べの周に掛かる分と、ADR-43 の決定 (4)（ADR-37 の決定 (2) の上限がそのまま効く）のうち同じ周に掛かる分を替える。ADR-37 と ADR-43 の本文は替えない。ほかの決定（ADR-37 の 4 つの形・token の上限・週に 1 周・8 本の選び・隔ての手・器の行・いつ撃つか・記帳と、ADR-43 の口座の選びと止め）と、2 周目より後の形 B の上限は替えない。
  (2) 便の数。最初の比べは、ADR-37 の決定 (4) の範囲の 8 本の仕事を、使い回しなしの版で 1 回、使い回しありの版で 2 回撃つ（24 便）。
  (3) 上限。最初の比べの周の SSD の書きの上限は 220 GB とする。数える書きは便の全部の段（実装の AI・gate と列の候補の検証・終わりの門・着地の確かめ）の和で、ADR-49 の器の読みの口と同じ式（費用の event の実装の AI の書きと、便の作業の dir の 3 つの記録の書きの欄の和）で数える。囲いの外の書きは ADR-49 の決定 (3) のとおり数えない。口の着地の前は、席の見張りの道具が同じ式で数える。周の途中で上限に届く見込みになったら（見張りは、和が上限の 95% の 209 GB に届いた時か、終わった便が 4 本以上で、それから見込んだ和が上限を越えた時）、ADR-37 の決定 (2) のとおりその周を止めて記帳する。
  (4) そのまま効く物。token の上限（1 周で 1 億以下）・週に 1 周・ADR-43 の口座の選び（7 日の窓の残りが 50% 以上の便の口座）と止め（本番の便の口座待ち・使う口座の 80%）は替えない。
options:
  - id: a
    name: なし 1 回とあり 2 回の 24 便・上限 220 GB
    text: 決定 (1) から (4)。
    verdict: adopted
    reason: 物差しの幅（ありの 2 回・同じ週）と、同じ仕事で比べる組 8 つ（書きの減りは揺れ 約 5% に対し 約 25% なので言える・古い組みの残りで落ちるはずの検査が通る偽の緑の照らしも 8 組）を残し、書きは決めどおりの 32 便より 74 GB 少ない。失うのは使い回しなしの 2 回目で、物差しに使わない版の揺れと、比べる組の半分。
  - id: b
    name: 決めどおり 32 便・上限 300 GB
    text: ADR-37 の決定 (6) のまま 2 版を 2 回ずつ撃ち、上限だけを 300 GB に替える。
    verdict: rejected
    reason: 比べる組が 16 になり token と壁の差も少し言いやすくなるが、書きは 24 便より 74 GB 多く、95% の止めとの余白が薄い。
  - id: c
    name: 16 便ずつ 2 週
    text: 1 週に 1 回ずつ撃ち、各週の上限を 150 GB にする。
    verdict: rejected
    reason: 2 週の合計の書きは 32 便とほぼ同じで、物差しの幅に週の違い（道具の版など）が混ざり、来週の形 B の枠（週に 1 周）を取る。
  - id: d
    name: ありの 2 回だけ・上限 130 GB
    text: 使い回しありの 2 回の 16 便だけを撃ち、なしの側は本番の便の記録で比べる。
    verdict: rejected
    reason: 同じ仕事での比べと偽の緑の照らしを失い、使い回しの効きに仕事の混ぜ方の差が混ざる。
  - id: e
    name: 撃たない
    text: 形 B を撃たず、使い回しも名乗らない。host の書きが線の下に戻ったら問い直す。
    verdict: rejected
    reason: 使い回しを本番に入れる前の比べ（ADR-37 の決定 (6)）が撃てず、名乗りも本番の便 1 本の書きの減りの見込み（約 19%）も来ない。
basis: [ADR-37, ADR-43, ADR-35, ADR-36, ADR-49, R-40]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo（t3-hub.77）か後継の memo の notes に 1 件ごとに記帳する。問う相手は持ち主。
    (1) 最初の比べの周が上限（220 GB か token 1 億）で止まり、使い回しありの 2 回の 8 本が揃わなかったら、残りの撃ち方（足りない便だけを撃つか・上限を替えるか）を問う。
    (2) 使い回しありの 2 回の書きの差（揺れ）が、なしとありの書きの差（効き）の半分を越え、8 組で効きを言えなかったら、なしの 2 回目を足す（決めどおりの 32 便）かを問う。
plain: |
  組み立ての使い回しを本番で使い始める前に撃つ、比べの実験の 1 回目のやり方を決める記録です。
  測り直すと、決めていた 32 本の撃ちは、記憶の装置（SSD）への書きが上限 120 GB の約 2 倍になりました。前の見込みは、作業の一部の書きしか数えていなかったためです。
  そこで 1 回目だけ、使い回しなしを 1 回・使い回しありを 2 回の 24 本にして、書きの上限を作業の全部の段の合計で 220 GB にします。失うのは、後の比べの物差しに使わない「なし」の 2 回目です。2 回目より後の実験の上限は今のまま 120 GB です。
approval:
  who: 持ち主
  date: 2026-10-04
  ruling: t3-hub.77.18（裁定 id = t3-hub.77.18:20261004T2037Z-1・案 E・束 batch:20261004T2037Z-1・裁定面・notes に逐語）
  verbatim: "すべて推奨で承認する"
  surface: R-8
consequences:
  - 形 B の道具（係 w144a）の見張りは、上限 220 GB と、終わりの門・着地の確かめ・列の候補の書きを足した全部の段の和で止める（席と係の手・持ち主に問わない）。
  - 群 g の基と幅を使い回しありの 2 回から取る読みは、memo（t3-hub.77）に記帳する。ADR-36 の決定 (4) の (エ) の決め直しの材料になる。
  - 2 周目より後の形 B（ADR-37 の決定 (1) の 32 便と、決定 (4) の軽い形の 16 便）の上限は ADR-37 の決定 (2) の 120 GB のまま。全部の段で数えるとどちらも 120 GB を越える見込みなので、最初の比べの段ごとの書きを測った後、2 周目を撃つ前に席が便の数か上限を持ち主に問う（この記録は決めない）。
  - 使い回しの名乗り（ADR-35 の決定 (7)）は、ADR-37 の決定 (6) のとおり最初の比べの後に置く。
note: 起草は係 w161a。数は問いの本文（係 w144a の測りと検証役 qv150 の数え直し・2026-10-04）による。
