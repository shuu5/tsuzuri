# 判断の記録 ADR-1076 — 器 scribe2 の判断の記録 ADR-0076 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1076
title: "host の面は端末の表 [[device]] を持つ — 名・ssh の宛先・Chrome の path・OS を必須に、 画面の番号・IME の env・専用の profile の dir を任意にして host の面にだけ宣言し、 器は形を検査して doctor に名の列を出すだけで値は使わない"
status: accepted
date: 2026-09-26
context: |
  表示面を持つ別の project の席は、 持ち主の端末の Chrome を ssh 経由で起こして画面を操作する。 そのための端末の値は host ごとに違い code に焼けないので、 今は席が手で持っている。 本 ADR は host の面 (host.toml) に端末の表を 1 つ足し、 器の読み手が形を検査し、 doctor が宣言の名を名乗る形を決める。 器は ssh も Chrome も撃たない。
  なぜこの判断が要るのかを、 経緯 (host 固有の値は host の面だけが持つ)・事象 (表示面を持つ project の席が端末の値を手で持っている)・機序 (今の読み手は未知の表を面ごと断る)・これまでの決まり・この判断の範囲の 5 つから説明します。 群の表と tick の表が、 host の面にだけ置ける表の先例です。
  CTX1 経緯 — host 固有の値は host の面（machine ごとの宣言）だけが持つ (ADR-1026・FR1057)
  ADR-1026 は host 固有の宣言値を state dir の host の面 (host.toml) 1 file だけが持ち、 tracked の manifest と同じ読み手と同じ断り方で検査すると決めた (要件 FR1057)。 その後、 群の表 (ADR-1049) と tick の unit の表 (ADR-1064) が host の面にだけ置ける表として足された。 表ごとに受ける key の閉じた列を持ち、 未知の key と未知の表は行番号つきで断る。
  CTX2 事象 — 表示面を持つ project の席が端末の値を手で持っている
  表示面を持つ別の project の席は、 持ち主の端末の Chrome を ssh 経由で窓だけのモードで起こし、 画面の遠隔操作の口 (CDP（Chrome の遠隔操作）) で操作する。 そのための値 (ssh の宛先・Chrome の path・画面の番号・日本語入力の env・専用の profile の dir・OS) は端末ごとに違う。 同じ profile の既存の process が窓を開くと env が効かない実測 (2026-09-25) があり、 専用の profile（Chrome の別の保存場所） の dir も要る。 今は host の面に端末の表（持ち主の端末の一覧）が無く、 席が値を手で持っている。
  CTX3 機序 — 今の読み手は未知の表を面ごと断る
  host の面に端末の表を人が書き足すと、 今の読み手は未知の表として面ごと読めないと判じ、 口座・群・tick の宣言まで効かなくなる。 表を足すには読み手の表の列に 1 つ足すしかない。 読み手の本体の file は 1481 行で、 1 file の上限 (1500 行) の余地が 19 行しか無い。
  CTX4 憲法と既存の決定の向き (本 ADR の解釈)
  N3 (host 固有の値で code を分岐させない) から、 端末の値は code に焼かず宣言にする。 C2 (同じ事実の読みは 1 本) から、 host の面の読み手は 1 つで、 端末の表もその読み手が読む。 C17 (決定はしご) から、 器は値を読むだけで ssh も Chrome も撃たない (使い方は消費側の設計の範囲)。 CON1002 (公開面に host 固有の値を載せない) から、 表は host の面にだけ置け、 doctor は値を出さない。
  CTX5 射程 — 動かすのは host の面の表の列と doctor の host の行だけ
  動かすのは (1) host の面が受ける表に端末の表を 1 つ足すこと (欄と検査は本 ADR が決める)、 (2) doctor の host の面の行の末尾に端末の名の列を出すこと。 動かさないのは、 既存の表の形と検査・rules 行・init の写し (本文のまま写る)・席の起動と tick・validate の宣言の数の行。
  （選択肢を測るものさし）この判断を評価する 4 本のものさしです。 host 固有の値は宣言にすること (code にも席の手にも持たせない)。 読み手は 1 つにすること (端末の表も同じ断り方で検査する)。 器は宣言の形だけを守ること (値を使う口は足さない)。 公開面と file の上限を守ること (表は host の面にだけ・doctor は名だけ・本体の増分は余地に収める)。
  DR1｜host 固有の値は宣言にする — 端末の値を code にも席の手にも持たせない (N3) CTX2・CTX4
  DR2｜読み手は 1 つ — 端末の表も host の面の読み手が同じ断り方で検査する (C2・FR1057) CTX1・CTX3
  DR3｜器は宣言の形だけを守る — 値を使う口 (ssh・Chrome) は器に足さない (C17) CTX4・CTX5
  DR4｜公開面と上限を守る — 表は host の面にだけ・doctor は名だけ・読み手の本体の増分は上限の余地に収める (CON1002・C4) CTX3・CTX4
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 端末の表の必須の欄は名・ssh の宛先・Chrome の path・OS、 任意の欄は画面の番号・日本語入力の設定の列・専用の保存場所です。 読み手は形と名の一意を行番号つきで検査し、 tracked の manifest に置いた表は断ります。 doctor は host の行に名の列を出します。 支えるのは FR1057 (host 固有の宣言値は host の面 1 file だけから同じ読み手で読む) への主張です。
  採用 — OPT1
  host の面 SHALL 端末の表を受け、 行は 0 以上、 必須の欄は name (host の面で一意・空白を含まない 1 語)・ssh (ssh の宛先・空白を含まない 1 語)・chrome (端末の上の Chrome の path・空でない)・os (閉じた 3 語 linux / macos / windows)、 任意の欄は display (画面の番号・空でない)・ime-env (KEY=VALUE の文字列の配列・KEY は英大文字と数字と下線で先頭は数字でない・最初の = で割り VALUE は空でない・同じ KEY は重複しない)・profile-dir (端末の上の専用の profile の dir・空でない) とする。 host の面の読み手 SHALL 未知の key・欠けた必須の欄・形に外れる値・name の重複を行番号つきで 1 件ずつ断り、 tracked の manifest に置いた表 SHALL 1 表 1 件で断る。 表の組み立てと検査 SHALL 読み手の兄弟 module（読み手の隣の file） に置き、 読み手の本体の増分は表の登録と呼びだけにする。 doctor SHALL 表を持つ host の host の面の行の末尾に端末の名の列 (宣言順・欄の値は書かない) を出し、 表の無い host の行は変えない。 器 SHALL 端末の値を使わない (ssh と Chrome を撃つ口を足さない)。 既存の表の形と検査・rules 行・init の写し・validate の宣言の数の行は変えない。 要件書は変えない (FR1057 の範囲)。
  （平易）host の面は端末の表を受けます。 行は 0 以上で、 必須の欄は名 (host の面で一意・空白の無い 1 語)・ssh の宛先 (空白の無い 1 語)・Chrome の path (空でない)・OS (linux・macos・windows の 3 語) です。 任意の欄は画面の番号 (空でない)・日本語入力の設定 (KEY=VALUE の文字列の列・KEY は英大文字と数字と下線で先頭は数字でない・VALUE は空でない・同じ KEY は重ねない)・専用の保存場所 (空でない) です。 読み手は、 未知の key・欠けた必須の欄・形に外れる値・名の重複を行番号つきで 1 件ずつ断り、 tracked の manifest に置いた表は 1 表 1 件で断ります。 組み立てと検査は読み手の隣の file に置き、 本体には表の登録と呼びだけを足します。 doctor は表を持つ host の host の行の末尾に端末の名の列を出し、 表の無い host の行は変えません。 器は端末の値を使いません。 要件書は変えません。
  （理由）持ち主の裁定は、 host の面に端末の表を足し、 読み手の閉じた key の列で読み、 doctor に 1 行出す、 の受諾でした。 端末の値は host ごとに違うので、 code に焼かず宣言にします。 host 固有の宣言は host の面 1 file だけが持つ決まりなので、 端末の表もそこに置き、 同じ読み手が同じ断り方で検査します。 今の読み手は未知の表を面ごと断るので、 表を足さないまま人が書き足すと口座や群の宣言まで効かなくなります。 器は値の使い方 (ssh で Chrome を起こす) を持たず、 使い方は消費側の設計に任せます。 doctor に値を出さないのは、 path に空白が入りうることと、 ssh の宛先を出力へ広げないためです。 読み手の本体の file は上限の余地が小さいので、 組み立てと検査は隣の file に置きます。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1057（claim）: FR1057 (host 固有の宣言値は host の面 1 file だけから読み、 tracked の manifest と同じ読み手と同じ断り方で検査する) の宣言値に端末の値を加える。 本 ADR は端末の表を同じ読み手が同じ断り方で読み、 tracked の面では断ると主張する (裁定 2026-09-26T15:16Z)。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録は何も置き換えません。 host の面の読み手と断り方 (ADR-1026)・群の表 (ADR-1049)・tick の表 (ADR-1064) はそのまま保ち、 host の面が受ける表を 1 つ足すだけです。 行き着く原則は「器は場所を宣言させ、 そこへ行くのは使う者に任せる」です。
  改訂状態: current
  置き換える ADR: なし (新規)
  置き換えられた: なし (現行)
  supersede は無い。 ADR-1026 の host の面の読み手と断り方、 ADR-1049 の群の表、 ADR-1064 の tick の表はそのまま保ち、 host の面が受ける表を 1 つ足すだけである。
  照会終端 — PRIN-DECLARE-DO-NOT-DRIVE
  器は場所を宣言させ、 そこへ行くのは使う者に任せる。
  本 ADR が「消費側の repo に持つ」「器の外の file」「器が Chrome を起こす口」を退け、 端末の値を host の面の宣言と検査だけにしたのはこの原則に行き着く (これ以上は遡らない照会終端)。
options:
  - id: "OPT1"
    name: "host の面に端末の表を足し、 器は検査と doctor の名の列だけ"
    text: |
      host の面に端末の表を足す。 必須の欄は名・ssh の宛先・Chrome の path・OS (3 語)、 任意の欄は画面の番号・IME の env (KEY=VALUE の列)・専用の profile の dir。 読み手が形と名の一意を行番号つきで検査し、 doctor は host の行に名の列を出す。 決め手は持ち主の裁定 (15:16Z)。
      （平易）host の面に端末の表を足す案です。 必須の欄は名・ssh の宛先・Chrome の path・OS (linux・macos・windows の 3 語)、 任意の欄は画面の番号・日本語入力の設定 (KEY=VALUE の列)・専用の保存場所です。 器の読み手が形と名の一意を行番号つきで検査し、 doctor は host の行に端末の名の列だけを出します。 端末の値が宣言になり、 既存の読み手と同じ断り方で検査され、 器に口は増えず、 値は host の面の外へ出ません。 代わりに、 消費側が値を読む形はこの記録では決まらず、 読み手の本体の file の余地がほぼ無くなります。 持ち主の裁定で選びました。
      利点: 端末の値が宣言になり、 席が手で持たなくてよい (DR1)
      利点: 既存の host の面の読み手と同じ断り方で検査される (DR2)
      利点: 器に足す口は無く、 値の使い方は消費側が決める (DR3)
      利点: 表は host の面にだけ置け、 doctor は値を出さない (DR4)
      欠点: 消費側が値を読む形 (host の面を直に読むか、 読み出しの口を足すか) は本 ADR では決まらない
      欠点: 読み手の本体の余地が 1 行台まで減り、 次の表は兄弟 module への移動が先に要る
    verdict: adopted
    reason: "決め手は持ち主の裁定 (15:16Z)。"
  - id: "OPT2"
    name: "消費側の repo の宣言 (.vessel.toml) に持つ"
    text: |
      表示面を持つ project の repo の宣言に端末の値を書く。 決め手は分析 (端末は host 固有)。
      （平易）表示面を持つ project の repo の宣言に、 端末の値を書く案です。 器の host の面を触らない点で勝ります。 けれども、 端末は host 固有で repo の宣言ではなく、 tracked の file に host 固有の値が載ります。 同じ host の他の project と端末の宣言を共有することもできません。 退けました。
      利点: 器の host の面を触らない
      欠点: 端末は host 固有で repo の宣言でなく、 tracked の file に host 固有の値が載る (DR4)
      欠点: 同じ host の他の project と端末の宣言を共有できない (DR1)
    verdict: rejected
    reason: "決め手は分析 (端末は host 固有)。"
  - id: "OPT3"
    name: "器の外の file に持つ"
    text: |
      host の面とは別の file に端末の値を置き、 消費側がそれを読む。 決め手は分析 (宣言が 2 か所になる)。
      （平易）host の面とは別の file に端末の値を置く案です。 器の読み手を触らない点で勝ります。 けれども、 host 固有の宣言が 2 か所になり、 「host の面 1 file だけ」という要件から外れます。 形の検査が無いので、 書き損じが消費側で使う時まで見えません。 退けました。
      利点: 器の読み手を触らない
      欠点: host 固有の宣言が 2 か所になり、 FR1057 の「host の面 1 file だけ」から外れる (DR2)
      欠点: 形の検査が無く、 書き損じが消費側の実行の時まで見えない (DR2)
    verdict: rejected
    reason: "決め手は分析 (宣言が 2 か所になる)。"
  - id: "OPT4"
    name: "器が端末の値で Chrome を起こす口を持つ"
    text: |
      器の口が ssh で端末の Chrome を起こし、 消費側はその口を呼ぶ。 決め手は分析 (器の範囲を越える)。
      （平易）器の口が ssh で端末の Chrome を起こし、 消費側はその口を呼ぶ案です。 消費側が起こし方を書かなくてよい点で勝ります。 けれども、 表示面の起こし方は消費側の設計の範囲で、 器が持つと外部の process を撃つ口が増えます。 端末ごとの差 (OS・日本語入力) の扱いも器に入ります。 退けました。
      利点: 消費側が起こし方を書かなくてよい
      欠点: 表示面の起こし方は消費側の設計の範囲で、 器が持つと外部の process を撃つ口が増える (DR3)
      欠点: 端末ごとの差 (OS・IME) の扱いが器に入り、 N3 の境界が曖昧になる (DR1)
    verdict: rejected
    reason: "決め手は分析 (器の範囲を越える)。"
basis: [FR1057, ADR-1026, ADR-1049, ADR-1064, CON1002]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「席」は人と AI が話す 1 つの session、 「host の面」は machine ごとの宣言を持つ file (host.toml)、 「端末」は持ち主が画面を見る別の machine です。 表示面を持つ別の project の席は、 持ち主の端末の Chrome を ssh 経由で窓だけのモードで起こし、 その画面を外から操作します。 そのための値 (ssh の宛先・Chrome の場所・画面の番号・日本語入力の設定・専用の保存場所・OS) は端末ごとに違い、 code に焼けません。 今は host の面に置き場が無く、 席が手で持っています。 この記録は、 host の面に端末の表を 1 つ足し、 器の読み手が形を検査し、 doctor が宣言した端末の名を名乗る形を決めます。 器は値を読むだけで、 ssh も Chrome も撃ちません。 持ち主は 2026-09-26 にこの形を裁定しました。
