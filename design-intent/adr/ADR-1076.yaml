  器の案の章の要約: 候補を 4 つ並べます。 host の面に端末の表を足し器は検査と doctor の名の列だけにする案 (選んだ案)、 消費側の repo の宣言に持つ案、 器の外の file に持つ案、 器が端末の値で Chrome を起こす口を持つ案です。 選ばなかった 3 つは、 端末は host 固有で repo の宣言でない・宣言が 2 か所になる・器の範囲を越える、 という理由で退けました。
  器の専門語の説明: 本文に出てくる専門語 6 個を、 やさしい言葉で説明します。
  ・host の面（host face）: state dir の host.toml。 host 固有の宣言値 (口座・plugin の場所・起動引数・群・tick の unit・本 ADR の端末) を持ち、 tracked の manifest と同じ読み手で検査される (ADR-1026・FR1057)。
  ・端末の表（device table）: host の面の表で、 端末 1 つにつき 1 行。 名・ssh の宛先・Chrome の path・OS が必須、 画面の番号・IME の env・専用の profile の dir が任意。 本 ADR で足す。
  ・専用の profile（dedicated profile）: Chrome の設定と履歴の置き場を端末の既定と分けた dir。 既存の process と同じ profile では窓を開いても env が効かないので、 表示面の窓はこれで起こす。
  ・IME の env（IME env）: 日本語入力を Chrome の窓で効かせるための環境変数の組 (例: 入力方式の module の名)。 端末の表では KEY=VALUE の文字列の列で書く。
  ・CDP（Chrome DevTools Protocol）: Chrome を外から操作し、 画面や DOM を取る口。 消費側の席が表示面の窓を操作するのに使う。 器は使わない。
  ・読み手の兄弟 module（sibling module）: host の面の読み手の本体と同じ dir に置く別の file。 本体の file の行数の上限を守るため、 表の組み立てと検査をここに置く (群の名の検査が先例)。
