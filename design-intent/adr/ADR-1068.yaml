  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録は前の決定 4 つを部分的に置き換えます。 ADR-1058 からは「待ち = 最初の待ち × 倍率 ^ 段・上限を超えたら送らない・規則の表の 4 行 (周期 60 秒)」の節だけを (列と 3 行・周期 15 秒・黙ったと判じる長さ 30 分に代わります)、 ADR-1049 と ADR-1055 と ADR-1066 からは移り先の「便も使っておらず」の条件 (ADR-1066 では「呼んだ側の置き場の便で判じる」の文と「3 条件は変えない」の結果) を、 ADR-1049 からはさらに「便に口座を渡す選び方は群の候補の口座の全部を外す」(設計 doc が「いま使う口座だけ」に絞った形を追認) を置き換え、 他は保ちます。 保つのは、 ADR-1058 の見回りを戻す 3 つの機構・判定の順・変化の測り方・梯子の記録・書けなければ送らない規則・口座の門、 ADR-1049 の群・宣言・記録・新しい口座で新しい席を起こす・候補が無ければ移らない、 ADR-1055 の契機 2 系統と鍵と 3 段、 ADR-1066 の判定の置き場と契機、 の全部です。 起こし直しが会話の id を運ぶ決定 (ADR-1067)・便の終端を契機に起こす決定 (ADR-1034)・周期の timer を持たず席は自分を起こし直さない決定 (ADR-1045) は変えません。 この記録は受け入れ済み (accepted) で、 要件書の改訂 (版 0.24) と同じ PR で発効します。 原則は「人が裁定した値は式に畳まず列のまま持つ。 条件は重ならないよう 1 か所に置き、 印を失った便は列が拾う。」です。
