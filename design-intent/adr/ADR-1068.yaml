      利点: 足すのは rules 行 1 本と読み手 1 本・外すのは行 2 本と条件 1 つ・起こす argv と閉じた型は不変 (DR4)
      欠点: 式の 1 行で表せた待ちを列の値で持つので、 列を変える周は裁定 id つきの rules 行の改訂になる (値の改訂は今も裁定・C5)
      欠点: 稼働中の便の口座へ移った直後は、 その便と席が同じ口座を使う (便は止めず口座も替えない・上限に当たれば便は上限停止の経路で別口座へ・FR1035)
      欠点: 要件 FR1027 / FR1038 / FR1068 と AC1018 / AC1038 / AC1041 の改訂を伴い、 ADR-1058 / ADR-1049 / ADR-1055 の各 1 節が本 ADR に置き換わる
    verdict: adopted
    reason: "決め手は現物 (3 つの裁定と 2026-09-25 の実測)。"
  - id: "OPT2"
    name: "今のまま (式・3 条件・4 種)"
    text: |
      ADR-1058 の式と rules 行 4 本、 ADR-1049 / ADR-1055 の 3 条件、 FR1068 の 4 種を保つ。 決め手は現物 (3 つの裁定がどれも否定する)。
      （平易）式・3 条件・4 種のまま何も変えない案です。 要件も決定も動かさない点で勝ります。 けれども、 待ちの列が 40・80・160・320・640・1,280 分で持ち主の裁定 (切りの良い列) に反し、 動いている便の口座を候補から外すので便が多い machine ほど移り先が無くなり (他の repo の便は見えない非対称も残ります)、 追随の後に運び手が抜けた便を誰も拾わず列の鍵を持ったまま止まります (2026-09-25 の実測)。 決め手は現物で、 3 つの裁定がどれも否定します。
      利点: 要件も ADR も動かさない
      欠点: 待ちの列が 40・80・160・320・640・1,280 分で、 持ち主の裁定 (切りの良い列) に反する (DR1)
      欠点: 稼働中の便の口座を候補から外すため、 便が多い host ほど移り先が無くなる。 他の repo の便は見えない非対称も残る (DR2)
      欠点: 追随の後に driver が抜けた便を誰も拾わず、 列の鍵を持ったまま止まる (2026-09-25 の実測) (DR3)
    verdict: rejected
    reason: "決め手は現物 (3 つの裁定がどれも否定する)。"
  - id: "OPT3"
    name: "式のまま初段と係数を変えて列に近づける"
    text: |
      初段 30 分・係数 2 で 30 → 60 → 120 → 240 → 480 → 960 分 とし、 rules 行 4 本を保つ。 決め手は分析 (裁定の列は等比でない)。
      （平易）式のまま、 最初の待ちを 30 分・倍率を 2 にして 30 → 60 → 120 → 240 → 480 → 960 分 とし、 規則の表の 4 行を保つ案です。 行数と式の実装を動かさない点で勝ります。 けれども、 裁定の列 (30 分 → 1 時間 → 3 時間 → 6 時間 → 12 時間 → 24 時間) は等比でなく式では表せず、 列を変えたいたびに「式で表せるか」を判じることになります。 決め手は分析です。
      利点: rules 行の数と式の実装を動かさない
      欠点: 裁定の列 (30 分 → 1 時間 → 3 時間 → 6 時間 → 12 時間 → 24 時間) は等比でなく、 式では表せない (DR1)
      欠点: 列を変えたい周に毎回「式で表せるか」を判じることになる (DR1)
    verdict: rejected
    reason: "決め手は分析 (裁定の列は等比でない)。"
  - id: "OPT4"
    name: "追随の後の便は 4 種目 (regate) の枝を広げて拾う"
    text: |
      regate の枝を「regate または追随で Implemented へ戻され、 その後 gate を通っていない便」に書き換え、 種目は 4 つのまま。 決め手は現物 (裁定 2026-09-25T16:12Z が 5 種目として並べる形を選んだ)。
      （平易）追随の後の便を、 regate で戻された便を拾う 4 種目の枝を「regate または追随で実装済みへ戻り、 その後 gate を通っていない便」に広げて拾い、 種目は 4 つのままにする案です。 要件の種目の数が変わらない点で勝ります。 けれども、 設計の枝 (regate の読み手と追随の読み手) は 2 本なのに要件は 1 種で、 枝と種目が 1 対 1 でなくなります。 追随の記帳と regate の記帳は別の口が書くので、 1 種に畳むと出所が読めなくなります。 決め手は現物で、 持ち主の裁定が 5 種目として並べる形を選びました。
      利点: 要件の種目の数が変わらない
      欠点: 設計の枝 (regate の読み手と追随の読み手) が 2 本なのに要件は 1 種で、 枝と種目が 1:1 でなくなる (DR4)
      欠点: 追随の記帳と regate の記帳は別の口 (pipe follow と pipe regate) が書くので、 1 種に畳むと出所が読めなくなる (C10) (DR4)
    verdict: rejected
    reason: "決め手は現物 (裁定 2026-09-25T16:12Z が 5 種目として並べる形を選んだ)。"
  - id: "OPT5"
    name: "移り先の除外を保ち、 便用の口座選定の除外を外す"
    text: |
      群の移り先は 3 条件のまま、 便用の口座選定が群の今の口座を外す規則 (ADR-1049) を外す。 決め手は分析 (持ち主の整理と逆)。
      （平易）群の移り先の 3 条件は保ち、 便に口座を渡す選び方が群のいま使う口座を外す既存の規則のほうを外す案です。 群のいま使う口座でも便が起きるので、 便に渡せる口座が増える点で勝ります。 けれども、 移り先に選ばれた口座で新しい便が起き、 席と便が同じ口座を食い合います。 持ち主の整理 (新しい便だけ禁止) と逆で、 動いている便の口座を外す非対称も残ります。 決め手は分析です。
      利点: 群の今の口座でも便が起きるので便用の候補が増える
      欠点: 移り先に選ばれた口座で新しい便が起き、 席と便が同じ口座を食い合う。 持ち主の整理 (新規の便だけ禁止) と逆 (DR2)
      欠点: 稼働中の便の口座を候補から外す非対称 (他の repo の便は見えない) が残る (DR2)
    verdict: rejected
    reason: "決め手は分析 (持ち主の整理と逆)。"
