  器の案の章の要約: 候補を 5 つ並べます。 列で持ち・移り先の条件を 2 つにし・追随で戻った便を 5 種目として起こす案 (選んだ案・3 つを 1 つの決定で)、 今のまま (式・3 条件・4 種) の案、 式のまま最初の待ちと倍率を変えて列に近づける案、 追随の後の便を 4 種目 (regate) の枝を広げて拾う案、 移り先の除外は保って便に口座を渡す選び方の除外のほうを外す案です。 却下した 4 案にも利点を並べ、 退けた決め手が現物か分析かを各案に書きます。 今のままの案は要件も決定も動かさない点で、 式のままの案は規則の表の行数と式の実装を動かさない点で、 4 種目を広げる案は要件の種目の数が変わらない点で、 便の除外を外す案は便に渡せる口座が増える点で、 選んだ案に勝ります。
  器の専門語の説明: 本文に出てくる専門語 10 個を、 やさしい言葉で説明します。
  ・梯子の列（signal ladder）: 管理 tick の打刻の合図の待ちを段ごとに並べた、 空でない昇順の秒の列 (rules 行 1 本・既定は 30 分 → 1 時間 → 3 時間 → 6 時間 → 12 時間 → 24 時間)。 段 n の待ちは列の n 番目で、 列を越えた段は送らない。 席に変化があれば先頭へ戻る。
  ・黙りの初段（silence threshold）: 管理 tick が席を「黙っている」と判じる、 最後の打刻からの経過の閾値 (rules 行 1 本・既定 30 分)。 梯子の列の先頭とは別の値で、 既定が同じでも同じ実体ではない。
  ・管理 tick（management tick）: 席の外から周期 (rules 行 1 本・既定 15 秒) で回り、 席が黙っていないかを見て続きを促す 1 行を注入し、 群の移動の判定を撃つ仕組み (ADR-1058・ADR-1066)。 本 ADR は合図の待ちの出所を式から梯子の列に変える。
  ・打刻の合図（stamp signal）: 管理 tick が黙った席の入力欄へ注入する、 台帳の現在地から続きを進めるよう促す 1 行 (ADR-1058)。 待ちは梯子の列の段で決まる。
  ・群の今の口座（group effective account）: project の群の席が実際に使う口座。 host の根に群ごとに高々 1 件の記録で持つ (ADR-1049)。 移動の周はこの記録を書き換え、 便用の口座選定はこの口座を候補から外す。
  ・便用の口座選定（run account selection）: 便を起こす周に器が口座を選ぶ規則 (FR1036)。 宣言のどの群の今の口座も候補から外す (設計 account-lifecycle.md §23・ADR-1049 は候補の全部だった) ので、 群の移り先に選ばれた口座では新しい便が起きない。
  ・終端でない段の便（live run）: 着地・失敗・停止のどれにも達していない便。 本 ADR の後は、 その便が使う口座も群の移り先の候補に入り、 便は止めず口座も替えない。
  ・追随（follow）: land の前に、 便の base より進んだ main へ worktree の branch を rebase して gate をやり直すこと (FR1034)。 追随の記帳の後に driver が抜けた便は、 本 ADR の後は dispatcher が 5 種目として起こし直す。
  ・所有者の印（driver ticket）: 便を運ぶ器の process が置き場に残す札。 Absent (無い)・Dead (process が退役)・Live (生きている)・Unreadable (読めない) の 4 状態で、 dispatcher は Absent | Dead の便だけを起こし直す。
  ・regate（regate）: gate の判定が FAIL の Gated の便を、 裁定の逐語つきで同じ worktree の Implemented へ 1 段戻す器の口 (FR1077)。 戻された便を拾う枝 (FR1068 の regate の種目) は本 ADR で変えない。
  器の頁の末: このページは、大もとの機械データ (正本) から自動で組み立てられています。構造は機械が自動で検査し、内容が元データに忠実かは独立のレビューで確かめます。
