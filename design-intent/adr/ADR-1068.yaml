  FR1027（rationale）: FR1027 (v0.23) は合図の間隔を「初段 (40 分) から 2 倍ずつ・24 時間を超える段では送らず・rules 行 4 本」と書いていた。 本 ADR はそれを「梯子の列 (rules 行 1 本の空でない昇順の秒の列) の順・列が尽きた段では送らず・rules 行 3 本 (周期・黙りの初段・梯子の列)」に改める根拠を与える (裁定 2026-09-25T14:39Z)。
