retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「席」は人と AI が話す 1 つの session、 「便」は契約 1 本を実装から着地まで運ぶ 1 回の走り、 「口座」は席や便が使う Claude Code の login 単位、 「群」は同じ口座を共有する project のかたまり、 「見回り (管理 tick)」は席の外から周期で席を見て続きを促す仕組みです。 前の決定 3 つを、 2026-09-25 の実測と 3 つの裁定に合わせて部分的に置き換えます。 1 つ目: 見回りが黙った席に送る「続きを促す 1 行」の待ちは、 これまで「最初の待ち × 倍率 ^ 段」の式と規則の表の 4 行で決めていました (ADR-1058)。 持ち主は 30 分 → 1 時間 → 3 時間 → 6 時間 → 12 時間 → 24 時間 → 停止 の切りの良い列にしたいと裁定したので、 式をやめて列そのものを規則の表の 1 行 (秒の列) で持ち、 倍率と上限の 2 行を退役し、 周期を 15 秒にします。 2 つ目: 群ごと別の口座へ移るとき、 移り先は「他の群が使っておらず、 便も使っておらず、 残りが線を越えていない候補の先頭」でした (ADR-1049・ADR-1055)。 持ち主は「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」と整理したので、 「便も使っておらず」を外します。 新しい便がその口座で起きないことは、 便に口座を渡す選び方が群のいま使う口座を候補から外す既存の規則 (設計 doc が決めた形で、 前の決定 ADR-1049 では群の候補の口座の全部を外していました) で満たされます。 前の決定 ADR-1066 も「便が使っていない」の条件を前提にしていたので、 その文だけを置き換えます。 3 つ目: gate を通った便が着地の順番待ちで main に追いつき (追随)、 段が「実装済み」に戻った後に運び手が抜けると、 誰も拾わずに列の鍵を持ったまま止まりました (実測 2 時間 40 分)。 その便を、 持ち主の印を持たない便を起こし直す種目の 5 つ目として足します。 要件書の FR1027 / FR1038 / FR1068 と AC1018 / AC1038 / AC1041 (版 0.24) の改訂を伴い、 同じ PR で land します。
