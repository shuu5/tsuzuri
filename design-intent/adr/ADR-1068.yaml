consequences:
  - "この判断で良くなること 3 つと、 代わりに引き受けること 4 つです。 良くなるのは、 続きを促す 1 行の待ちが裁定の列そのものになり規則の表を読めば分かること (周期 15 秒で初手の合図と移動の判定も早く回ります)、 群の移り先の候補に動いている便の口座も入り便が多い machine でも移り先が無くならないこと (新しい便がその口座で起きないことは便に口座を渡す選び方が保ちます)、 追随の後に運び手が抜けた便を次の周で列が起こし直し列の鍵を持ったまま止まる穴が塞がること (足すのは読み手 1 本で、 起こす口と型は変わりません) です。 引き受けるのは、 列を変えるときは裁定の印つきの規則の表の改訂になり式の 1 行より値が多いこと (列の長さを変えれば送る本数の上限も変わります)、 動いている便の口座へ移った直後は便と席が同じ口座を使うこと (便は止めず口座も替えず、 上限に当たれば便は上限停止の道で別口座へ移ります)、 要件書の 3 つの要件と 3 つの受入基準の改訂を伴い前の決定 3 つの各 1 節が置き換わること、 追随の後にもう 1 度 gate を通った便と追随の記帳を持たない便は今まで通り起こさないことです。"
  - "良い結果: 打刻の合図の待ちが裁定の列そのもの (30 分 → 1 時間 → 3 時間 → 6 時間 → 12 時間 → 24 時間 → 停止) になり、 rules 行を読めば列が分かる。 周期 15 秒で初手の合図と移動の判定が早く回る"
  - "良い結果: 群の移り先の候補に稼働中の便の口座も入り、 便が多い host でも移り先が無くならない。 新しい便がその口座で起きないことは便用の口座選定が保つ"
  - "良い結果: 追随の後に driver が抜けた便を次の周で列が起こし直し、 列の鍵を持ったまま止まる穴が塞がる。 足すのは読み手 1 本で、 起こす口と型は不変"
  - "代償: 列を変える周は裁定 id つきの rules 行の改訂になる (式の 1 行より値が多い)。 列の長さを変えれば合図の上限も変わる"
  - "代償: 稼働中の便の口座へ移った直後は、 便と席が同じ口座を使う。 便は止めず口座も替えず、 上限に当たれば便は上限停止の経路 (FR1035) で別口座へ移る"
  - "代償: 要件 FR1027 / FR1038 / FR1068 と AC1018 / AC1038 / AC1041 の改訂 (v0.24) を伴い、 ADR-1058 / ADR-1049 / ADR-1055 の各 1 節が本 ADR に置き換わる (3 つは frozen のまま・supersession の系譜で読む)"
  - "代償: 追随の後にもう 1 度 gate を通った便は起こさない (最新の Gated が追随より後ろ)。 追随の記帳を持たない Implemented の便も今まで通り触らない"
