  FR1036（claim）: FR1036 (便用の口座選定・v0.24) は宣言された群の今の口座を候補から外す (群の候補の他の口座は除かない・設計 §23 の形)。 本 ADR はその規則を変えず、 群の移動の「新しい便がその口座で起きない」をこの規則に委ねると主張する。
