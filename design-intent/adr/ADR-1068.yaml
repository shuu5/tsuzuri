# 判断の記録 ADR-1068 — 器 scribe2 の判断の記録 ADR-0068 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1068
title: "合図の梯子は列で持ち、 群の移り先は終端でない段の便が使う口座も候補にし、 追随で戻った便も列が起こし直す — 管理 tick の合図の待ちは rules 行 1 本の秒の列 (係数と上限の行は退役)、 群の移動の判定は稼働中の便の口座を候補から外さず便用の口座選定が群の今の口座を外し、 追随で Implemented へ戻って所有者の印を失った便は dispatcher の 5 種目として resume で起こす (ADR-1058 の backoff の式と rules 行 4 本・ADR-1049 / ADR-1055 の移り先の「便が使っていない」の条件を部分 supersede・要件 FR1027 / FR1038 / FR1068 と AC1018 / AC1038 / AC1041 の改訂を伴う)"
status: accepted
date: 2026-09-26
context: |
  ADR-1058 は打刻の合図の待ちを「初段 × 係数 ^ 段・上限で打ち切り」の式と rules 行 4 本で決め、 ADR-1049 / ADR-1055 は群の移り先を「他の群が使っていない ∧ 便が使っていない ∧ 閾値未満の候補の先頭」と決めた。 2026-09-25 の実測と裁定で、 持ち主は合図の待ちを切りの良い列 (30 分 → 1 時間 → 3 時間 → 6 時間 → 12 時間 → 24 時間 → 停止) にしたいと裁定し (2026-09-25T14:39Z)、 群の移動では「稼働中の便は移動を妨げず、 移り先に選ばれた口座で新しい便が起きないことだけが要る」と整理して live 便の除外を外すと裁定し (2026-09-25T15:19Z)、 着地の列で追随した後に driver が抜けた便を dispatcher が拾わずに 2 時間 40 分止まった実測から、 その便を所有者の印を持たない再開の 5 種目として足すと裁定した (2026-09-25T16:12Z)。 本 ADR はこの 3 つを 1 つの決定として書き、 式を列に、 移り先の条件を 2 つに、 再開の種目を 5 つにする。 要件 FR1027 / FR1038 / FR1068 と AC1018 / AC1038 / AC1041 (v0.24) の改訂を伴う。
  なぜこの判断が要るのかを、 経緯 (待ちの式)・実測と裁定 1 (列で持ちたい)・経緯と裁定 2 (移り先の条件)・実測と裁定 3 (追随の後の便)・器の今の部品・これまでの決まり・この判断の範囲の 7 つから説明します。 見回り (管理 tick) が黙った席に送る続きを促す 1 行の待ちは、 前の決定 (ADR-1058) が「最初の待ち × 倍率 ^ 段」の式と規則の表の 4 行 (周期・最初の待ち・倍率・上限) で決め、 要件書はそれを「40 分から 2 倍ずつ、 24 時間を超えたら送らない (最大 6 本)」と写しました。 2026-09-25 に持ち主は、 その列 (40・80・160・320・640・1,280 分) は読みにくく、 30 分 → 1 時間 → 3 時間 → 6 時間 → 12 時間 → 24 時間 → 停止 の列にしたいと裁定しました。 この列は等比でないので式では表せず、 列そのものを規則の表の 1 行で持つことになります。 群の移り先については、 前の決定 (ADR-1049・ADR-1055) が「他の群が使っておらず、 便も使っておらず、 残りが線を越えていない候補の先頭」と決め、 実装はそれを「この repo の動いている便が使う口座を除く」と持ちました (他の repo の便は見えない、 という非対称つき)。 同じ日に持ち主は群の排他を確かめ、 「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」と整理して除外を外すと裁定しました。 新しい便がその口座で起きないことは、 便に口座を渡す選び方が群のいま使う口座を外す既存の規則で満たされます。 3 つ目は実測です。 gate を通った便が着地の順番待ちで main に追いつき (追随)、 段が実装済みに戻った後、 flag の無い再開 (1 段だけ進める道具) は設計どおり抜けますが、 その便を拾う枝が器の起こし直し (運び手が死んだ便・合格の Gated・regate で戻された便) に無く、 2 時間 40 分止まりました。 regate で戻された便を拾う枝と同じ型の穴なので、 同じ絞りで 5 種目として足すと持ち主が裁定しました。 器の部品を見ると、 待ちは見回りの部品が式で計算し、 移り先は 1 周の群の手番が動いている便の口座を外し、 起こし直しは 3 つの枝を持ち、 起こす command は 1 本です。 決まりの側では、 裁定した値は規則の表が印つきで持つ・宣言値と導出値を分ける・足すときに外す物を名指す・道は 1 本、 が効きます。 動かすのは、 待ちの出所・移り先の条件・起こし直しの枝の 3 か所だけで、 見回りの判定の順・変化の測り方・移動の判定の契機と鍵と記録・便に口座を渡す選び方・列の鍵・起こす command と型は動かしません。
  CTX1 経緯 — 合図の待ちの式と rules 行 4 本 (ADR-1058)
  ADR-1058 は管理 tick（席を周期で見る仕組み） を戻し、 打刻の合図（続きを促す 1 行）の待ちを「待ち = 初段 × 係数 ^ 段」の式で伸ばし、 次の待ちが上限を超える段では送らないと決め、 値を rules 行 4 本 (周期 60 秒・初段の待ち 2,400 秒・係数 2・上限 86,400 秒) で持つと書いた。 初段の待ちの行は黙りの閾値と梯子の先頭と Busy の古さの 3 役を兼ねた。 要件 FR1027 (v0.23) はこれを「初段 (40 分) から 2 倍ずつ伸ばし、 次の待ちが 24 時間を超える段では送らず (合図は最大 6 本)」と写した。 実装 (行 e〜h・2026-09-25 着地) は式のとおりで、 40 分 → 80 分 → 160 分 → 320 分 → 640 分 → 1,280 分 の 6 本になる。
  CTX2 実測と裁定 1 — 待ちは切りの良い列で持ちたい
  2026-09-25 の群の移動で、 席の起こし直しの初手の合図と管理 tick の間隔を持ち主と詰めた周に、 持ち主は式の 2 倍の列 (40・80・160・320・640・1,280 分) は読みにくく、 30 分 → 1 時間 → 3 時間 → 6 時間 → 12 時間 → 24 時間 → 停止 の列にしたいと裁定した (2026-09-25T14:39Z・要旨)。 式で表せない列なので、 係数と上限の 2 行を退役し、 列そのものを持つ rules 行 1 本 (秒の列) に替える。 黙りの閾値は列の先頭と同じ 30 分だが別の行のままで、 周期は 60 秒から 15 秒にする (同じ裁定・tick は打刻の file 1 つと梯子の記録 1 つを読むだけで、 15 秒でも負荷は測れない程度と判じた)。
  CTX3 経緯と裁定 2 — 移り先の「便が使っていない」の条件
  ADR-1049 と ADR-1055 は群の移り先を「他の群が使っていない ∧ 便が使っていない ∧ 閾値未満の候補の先頭」と決めた。 実装 (行 l・s2-07l.618) は「便が使っていない」を 1 周の置き場の終端でない段の便（まだ終わっていない便）が使う口座の除外として持ち、 他の repo の便は見えないという非対称を抱えた。 2026-09-25 に持ち主が群の排他を確かめた周に、 「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」と整理し、 除外を外すと裁定した (2026-09-25T15:19Z・要旨)。 新しい便がその口座で起きないことは、 便用の口座選定（便に口座を渡す選び方） (FR1036) が群の今の口座（かたまりがいま使う口座）を候補から外すことで既に満たされ、 走行中の便は止めず口座も替えない。 その除外は ADR-1049 では「群の候補の口座の全部」だったが、 設計 account-lifecycle.md §23 (行 l・s2-07l.618) が「群の今の口座だけ」に絞った (ADR を経ていない)。 ADR-1066 §04 は「便が使っていない」を呼び手の置き場の live 便で判じると決め、 §05 は移り先の 3 条件を不変とした。
  CTX4 実測と裁定 3 — 追随（main に追いつくこと）の後に driver が抜けた便を列が拾わない
  gate を通った便は着地の列で main に追随し (rebase・衝突の周は runner が解く)、 段が Implemented に戻る。 flag の無い再開 (pipe resume の 1 段進め) はそこで抜ける設計で、 その便を拾う枝が dispatcher の起こし直しの候補 (driver が死んだ便・PASS の Gated・regate（裁定つきで 1 段戻す口） で戻された便) に無く、 誰も gate を撃たないまま列の鍵も持ち続けた (2026-09-25 の実測 2 時間 40 分・後続は 90 分の待ちを丸ごと食った・台帳 s2-07l.633)。 regate で戻された便を拾う枝 (FR1068 の 4 種目・s2-07l.593) と同じ型の穴なので、 同じ絞りで「追随で最新の gate の後に Implemented へ戻され、 その後 gate を通っていない便」を 5 種目として足すと持ち主が裁定した (2026-09-25T16:12Z・要旨・4 種目を広げる案でなく 5 種目として並べる形)。
  CTX5 現物 — 式の置き場・移り先の判定・起こし直しの枝
  main 230719a で、 tick の待ちは seat/tick.rs の Pace (stale_s・factor・max_s) が式で計算し、 群の移り先は pipe/dispatch/group.rs の target_of が 1 周の置き場の終端でない段の便の口座 (inflight_by_account) を候補から外し、 dispatcher の起こし直しは pipe/dispatch.rs の revivals が 3 枝 (driver が死んだ便・PASS の Gated ∧ 札 Absent | Dead・regate で戻された Implemented ∧ 札 Absent | Dead) を持ち、 起こす argv は resume --run <id> --drive の 1 本である。 追随の記帳は pipe/follow.rs (接頭辞 rebase・rebase-conflict・rebase-stale-rows) に在り、 regate の記帳の読み手 (最新の Gated より後ろに regate の記帳が在るか) は pipe/regate.rs に在る。 埋め込みの rules manifest は 70 行 68 種で、 seat.tick_interval_s / seat.tick_stale_s / seat.pointer_backoff_factor / seat.pointer_backoff_max_s の 4 行を持つ。
  CTX6 憲法と既存の決定の向き (本 ADR の解釈)
  C5 (裁定は値に印を持つ) から、 列の値と周期の値は rules 行が裁定 id つきで持ち、 SRS は形 (空でない昇順の秒の列・列の長さが合図の上限) だけを決める。 C10 (宣言値・実測値・導出値を分ける) から、 段 n の待ちは列の n 番目の宣言値で、 式の導出値は持たない。 C17 (足すときに何を外すかを名指す) から、 列の行 1 本を足して係数と上限の 2 行を退役し (行数は 70 → 69)、 移り先の条件を 3 つから 2 つに減らし、 起こし直しの枝を 1 つ足すが起こす argv と型は増やさない。 C2 (経路は 1 本) から、 5 種目の読み手は regate の読み手と同じ形の pure な 1 本で、 起こす口は既存の resume --drive の 1 本のまま。 ADR-1034 (便の終端を契機に起こす)・ADR-1045 §2 (2) (周期の timer を持たない・席は自分を起こし直さない)・ADR-1066 (tick が群の移動の判定を撃つ・§04 の live 便の文だけ本 ADR が置き換える)・ADR-1067 (起こし直しは会話 id を運ぶ) は本 ADR の前提。
  CTX7 射程 — 動かすのは式・条件・枝の 3 か所だけ
  動かすのは (1) 打刻の合図の待ちの出所 (式 → 列・rules 行 4 本 → 3 本・周期 60 秒 → 15 秒)、 (2) 群の移り先の候補の規則 (3 条件 → 2 条件)、 (3) dispatcher の起こし直しの枝 (3 枝 → 4 枝・要件では 4 種 → 5 種) の 3 つ。 動かさないのは、 tick の判定の列の順 (ADR-1058)・変化の digest・梯子の記録の形・黙りの閾値の行・群の移動の判定の契機と lock と記録と承認 event (ADR-1049 / ADR-1055 / ADR-1066)・便用の口座選定の除外 (ADR-1049)・列の鍵と着地の順序 (pipeline.md §36)・flag の無い pipe resume (席の道具)・追随と衝突の起こし直しの記帳の字面・起こす argv と Revive / WaitReason / Stage / EventKind の型。
  （選択肢を測るものさし）この判断を評価する 4 本のものさしです。 待ちは人が読める列で持つこと (式の導出値でなく、 裁定の値をそのまま規則の表の 1 行に置く)。 動いている便は群の移動を妨げないこと (選ばれた口座で新しい便が起きないことは、 便に口座を渡す選び方が既に満たすので、 重なる条件を持たない)。 持ち主の印を失った便は列が起こし直すこと (追随で実装済みに戻った便を regate の枝と同じ絞りで拾い、 gate から着地まで同じ運び手で進める)。 足す口も型も増やさないこと (列の行 1 本と読み手 1 本を足し、 行 2 本と条件 1 つを外し、 起こす command と閉じた型は変えない) です。
  DR1｜待ちは人が読める列で持つ — 式の導出値でなく、 rules 行 1 本の宣言値の列 (裁定の値をそのまま持つ・C5・C10) CTX1・CTX2・CTX6
  DR2｜稼働中の便は群の移動を妨げない — 移り先に選ばれた口座で新しい便が起きないことは便用の口座選定が既に満たす (持ち主の整理・同じ目的の条件を 2 か所に持つと片方だけが動く型の穴になるので重複する条件を持たない・C17) CTX3・CTX6
  DR3｜所有者の印（便を運ぶ process の札）を失った便は列が起こし直す — 追随で Implemented へ戻った便を regate の枝と同じ絞りで拾い、 gate から着地まで同じ driver で進める (完全自律の裁定・ADR-1066 の方針) CTX4・CTX6
  DR4｜足す口も型も増やさない — 列の行 1 本と読み手 1 本を足し、 行 2 本と条件 1 つを外し、 起こす argv と閉じた型は不変 (C2・C17) CTX5・CTX6・CTX7
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 見回りが送る続きを促す 1 行の待ちは、 規則の表の 1 行 (空でない昇順の秒の列・既定は 30 分 → 1 時間 → 3 時間 → 6 時間 → 12 時間 → 24 時間) が持ち、 段 n の待ちは列の n 番目で、 列を越えた段は送りません (送る本数の上限は列の長さ)。 席に変化があれば列の先頭へ戻ります。 倍率と上限の 2 行は退役し、 黙ったと判じる長さ (既定 30 分) と周期 (既定 15 秒) の行は残ります (規則の表は 70 行から 69 行へ)。 見回りの判定の順・変化の測り方・梯子の記録の形は変えません。 群の移り先は「他の群のいま使う口座でなく、 残りが線を越えていない候補の先頭」の 2 条件とし、 動いている便が使う口座は候補から外しません。 移った後に新しく起きる便は、 便に口座を渡す選び方が群のいま使う口座を外すことで止まり、 動いている便は止めず口座も替えません。 移動の判定の契機・鍵・記録・承認の記録・退避・起こし直しは変えません。 器の起こし直しには、 「段が実装済みで、 いちばん新しい gate の後に追随の記帳 (main に追いついた記録・衝突の起こし直しの記録) があり、 その後に gate も着地も無く、 持ち主の印が無いか印の process が退役した便」を候補に足し、 読み手は regate の読み手と同じ形の 1 本、 起こす command は既存の 1 本 (resume の flag つき) です。 追随の後にもう 1 度 gate を通った便・追随の記帳を持たない実装済みの便・印が生きている便と読めない便は起こしません。 要件 FR1068 の「印を持たなくても起こし直す便」は 5 種 (回答が記帳された質問中・承認が記帳された承認待ち・合格の Gated・regate で戻された便・追随で戻された便) に閉じ、 列の鍵と閉じた型は変えません。 前の決定のうち、 ADR-1058 の「式と規則の表の 4 行」の節、 ADR-1049 / ADR-1055 / ADR-1066 の移り先の「便も使っておらず」の条件、 ADR-1049 の「便に口座を渡す選び方は群の候補の全部を外す」(設計 doc が「いま使う口座だけ」に絞った形を追認) を置き換え、 他は保ちます。 要件書では、 FR1027 (見回り) の待ちを列に改める根拠、 FR1038 (群の移動) の移り先の条件を 2 つに改める根拠、 FR1068 (便の自動起動) に 5 種目を足す根拠になり、 FR1036 (便に口座を渡す選び方) と FR1077 (regate) は変えないことを主張します。
  採用 — OPT1
  管理 tick の打刻の合図の待ち SHALL rules 行 seat.pointer_ladder_s (空でない昇順の秒の列・裁定 id つき・既定は 1800 / 3600 / 10800 / 21600 / 43200 / 86400) が持ち、 段 n の待ち SHALL 列の n 番目とし、 列を越えた段 SHALL NOT 送らない (合図の上限は列の長さ)。 席に変化があれば段 SHALL 列の先頭へ戻る。 rules 行 seat.pointer_backoff_factor と seat.pointer_backoff_max_s SHALL 退役し、 seat.tick_stale_s (黙りの初段・既定 1800) と seat.tick_interval_s (既定 15) SHALL 残る (行数は 70 → 69・種は 68 → 67)。 tick の判定の列の順・変化の digest・梯子の記録の形 (ADR-1058) SHALL 変えない。 群の移り先 SHALL 「他の群の今の口座でない ∧ 閾値未満の候補の先頭」の 2 条件とし、 終端でない段の便が使う口座 SHALL NOT 候補から外さない。 移った後に新しく起きる便 SHALL 便用の口座選定 (FR1036・除外は群の今の口座だけ＝設計 §23 の形を本 ADR が追認し ADR-1049 の「候補の全部」を置き換える) が群の今の口座を候補から外すことで止まり、 走行中の便 SHALL NOT 止めず口座も替えない。 移動の判定の契機・lock・記録・承認 event・退避・起こし直し (ADR-1049 / ADR-1055 / ADR-1066 / ADR-1067) SHALL 変えない。 dispatcher の起こし直し SHALL 「段が Implemented ∧ 最新の Gated より後ろに追随の記帳 (接頭辞 rebase・rebase-conflict・rebase-stale-rows) が在り ∧ その後ろに Gated / Landed が無く ∧ 所有者の印が Absent | Dead」の便を候補に足し、 読み手 SHALL regate の読み手と同じ形の pure な 1 本とし、 起こす argv SHALL 既存の resume --drive の 1 本とする。 追随の後にもう 1 度 gate を通った便・追随の記帳を持たない Implemented の便・印が Live | Unreadable の便 SHALL NOT 起こさない。 要件 FR1068 の所有者の印を持たない再開の種目 SHALL 5 つ (回答が記帳された Questioned・承認が記帳された Blocked・PASS の Gated・regate で戻された便・追随で戻された便) に閉じ、 列の鍵・turn_skipping・Revive / WaitReason / Stage / EventKind の型 SHALL NOT 変えない。 本 ADR SHALL ADR-1058 の「待ち = 初段 × 係数 ^ 段・上限で打ち切り・rules 行 4 本 (周期 60 秒)」の節と、 ADR-1049 / ADR-1055 / ADR-1066 の移り先の「便が使っていない」の条件 (ADR-1066 §04 の「呼び手の置き場の live 便で判じる」の文と §05 の「3 条件不変」を含む) と、 ADR-1049 の便用の除外「群の候補の口座の全部」(今の口座だけ・設計 §23) を置き換え、 他は保つ。 要件 FR1027 / FR1038 / FR1068 と AC1018 / AC1038 / AC1041 (SRS v0.24) の改訂を伴い、 同じ PR で land する。
  （平易）見回り (管理 tick) が黙った席に送る続きを促す 1 行の待ちは、 規則の表の 1 行 (空でない昇順の秒の列・裁定の印つき・既定は 30 分 → 1 時間 → 3 時間 → 6 時間 → 12 時間 → 24 時間) が持ち、 段 n の待ちは列の n 番目で、 列を越えた段は送りません (送る本数の上限は列の長さ)。 席に変化があれば列の先頭へ戻ります。 倍率と上限の 2 行は退役し、 黙ったと判じる長さ (既定 30 分) と周期 (既定 15 秒) の行は残ります (規則の表は 70 行から 69 行へ)。 見回りの判定の順・変化の測り方・梯子の記録の形は変えません。 群の移り先は「他の群のいま使う口座でなく、 残りが線を越えていない候補の先頭」の 2 条件で、 動いている便が使う口座は候補から外しません。 移った後に新しく起きる便は、 便に口座を渡す選び方が群のいま使う口座を外すことで止まり、 動いている便は止めず口座も替えません。 移動の判定の契機・鍵・記録・承認の記録・退避・起こし直しは変えません。 器の起こし直しには「段が実装済みで、 いちばん新しい gate の後に追随の記帳があり、 その後に gate も着地も無く、 印が無いか印の process が退役した便」を足し、 読み手は regate の読み手と同じ形の 1 本、 起こす command は既存の 1 本です。 追随の後にもう 1 度 gate を通った便・追随の記帳を持たない実装済みの便・印が生きている便と読めない便は起こしません。 要件 FR1068 の「印を持たなくても起こし直す便」は 5 種に閉じ、 列の鍵と閉じた型は変えません。 前の決定のうち、 ADR-1058 の「式と規則の表の 4 行」の節と、 ADR-1049 / ADR-1055 / ADR-1066 の移り先の「便も使っておらず」の条件と、 ADR-1049 の「便に口座を渡す選び方は群の候補の全部を外す」(設計 doc の「いま使う口座だけ」の形を追認) を置き換え、 他は保ちます。 要件書の FR1027 / FR1038 / FR1068 と AC1018 / AC1038 / AC1041 (版 0.24) の改訂を伴い、 同じ PR で land します。
  （理由）持ち主の 3 つの裁定は、 続きを促す 1 行の待ちを切りの良い列で持つこと、 動いている便は群の移動を妨げず選ばれた口座で新しい便が起きないことだけを求めること、 追随の後に運び手が抜けた便を 5 種目として起こし直すこと、 の受諾でした。 待ちを式でなく列で持つのは、 裁定の列が等比でなく式では表せないからで、 式のまま近づける案は裁定の値を持てません。 裁定した値は規則の表が印つきで持ち、 宣言値と導出値を分ける決まりから、 段の待ちは列の n 番目の宣言値そのもので、 導出は持ちません。 移り先の「便も使っておらず」を外すのは、 持ち主が「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」だけを求め、 それは便に口座を渡す選び方が群のいま使う口座を外す既存の規則 (設計 doc の形・前の決定は候補の全部) で既に満たされているからで、 同じ目的の条件を 2 か所に持つと片方だけが動く型の穴になります (ものさし 2)。 便の側の除外を外す案は持ち主の整理と逆で、 席と便が同じ口座を食い合います。 追随の後の便を 5 種目として足すのは、 2026-09-25 の実測 (2 時間 40 分止まり、 後続が 90 分の待ちを丸ごと食った) が regate の枝と同じ型の穴を示し、 同じ絞り (最新の gate より後ろの記帳・その後に gate も着地も無い・印が無いか退役) で拾えるからです。 4 種目を広げる案を退けたのは、 設計の枝 2 本と要件の種 1 つが 1 対 1 でなくなり、 別の口が書く記帳の出所が読めなくなるからです。 足すのは規則の表の行 1 本と読み手 1 本で、 外すのは行 2 本と条件 1 つ、 起こす command と閉じた型は変えないので、 足すときに外す物を名指す決まりと道は 1 本の決まりに沿います。 列を変えるときの改訂の重さ・移った直後に便と席が同じ口座を使うこと・要件書と前の決定 3 つの各 1 節の置き換え・追随の後に gate を通った便は起こさないことは、 代償として引き受けます。
