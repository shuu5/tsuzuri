      （平易）続きを促す 1 行の待ちを規則の表の 1 行 (空でない昇順の秒の列・既定は 30 分 → 1 時間 → 3 時間 → 6 時間 → 12 時間 → 24 時間) で持ち、 倍率と上限の行を退役し、 周期を 15 秒にする案です。 群の移り先は「他の群のいま使う口座でなく、 残りが線を越えていない候補の先頭」の 2 条件にし、 動いている便の口座は外さず、 移った後に新しく起きる便は便に口座を渡す選び方が群のいま使う口座を外すことで止めます。 器の起こし直しには「追随でいちばん新しい gate の後に実装済みへ戻り、 その後 gate を通っていない便 (印が無いか退役)」の枝を足し、 既存の command で起こします。 待ちの列が裁定の値そのもので式を読み解かなくてよく、 移り先の候補が増え、 追随の後に運び手が抜けた便を次の周で拾い、 足すのは規則の表の行 1 本と読み手 1 本だけで起こす command と型は変わりません。 代わりに、 列を変えるときは裁定の印つきの改訂になること、 動いている便の口座へ移った直後は便と席が同じ口座を使うこと、 要件書の改訂を伴い前の決定の各 1 節が置き換わることを引き受けます。 決め手は現物 (3 つの裁定と 2026-09-25 の実測) です。
