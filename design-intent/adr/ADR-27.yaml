# 判断の記録 ADR-27 — project board の作り直し（tab と地図をなくし、上の固定の帯と窓と吹き出しと 5 列の pipeline と epic ごとの一覧にする）（発効 2026-10-01・持ち主の裁定 t3-hub.52.160.1:20261001T1423Z-1・記帳先 = tsuzuri の台帳の問い t3-hub.52.160.1 の notes）
# 判断の記録 ADR-7 の決定 (3)(5)(7)(8)(10) と ADR-16 の決定 (5) の字のうち、決定 (1) が名指す字だけを置き換える（部分の置き換え・ほかの決定と字は効いたまま）。ADR-7 と ADR-16 は封の一覧で本文が凍っているので本文は変えない（前例 ADR-24・ADR-26）。
# 持ち主の使ってみての声と席の調べは台帳の memo t3-hub.52.160 の description と notes（逐語は notes）。見本と論点の頁は設計の席の提案の置き場の board-v2（mock.html・points.html 第 3 版・data.js）。
id: ADR-27
title: project board は tab と地図をなくして 1 枚の画面にし、上の固定の帯と押すと開く窓と札の click の吹き出しと、Blocked と Queued を分けた 5 列の pipeline と epic ごとの一覧を、窓の幅の 3 段で並べ、短い題を起票の時に台帳に置く
status: accepted
date: 2026-10-01
context: |
  持ち主は 2026-10-01 に project board を使ってみての声を席に伝えた（memo t3-hub.52.160・逐語は notes）。要約は次の 7 つである。(ア) 使わない表示がある（地図の tab・口座の履歴と口座の「詳しく」・台帳の「詳しく」）。(イ) 4 つの tab の切り替えが重く、特に質問に答えた後に home へ戻るのが手間で、質問は終わったら消える窓がよい。(ウ) 席からの知らせと次の一手は上の固定の帯に小さく出し、やる事があれば押すと窓が開く形がよい。(エ) 席と口座も帯に小さく入れ、時計のようにいつでも見られる所に置きたい。(オ) pipeline と台帳の open と memo の一覧が最も使うので、開いてすぐ見えるよう広く取りたい（今は scroll が要る）。(カ) pipeline の札は幅を抑え、列に在る長さと起票からの経過・Blocked と Queued の区別と待つ相手・切れない短い題が要り、hover の card は情報が増えず下の札を隠すので、click で開いて × か外の click で閉じ、個別の頁へ飛べる形がよい。(キ) pipeline と一覧を相互に作用させ、一覧が縦に長くなりすぎない畳み方が要る。持ち主は同じ日に、PC の画面分割で 2 つの board を並べて使う事と、スマホでの形も考えてほしいと足した。承認の後（2026-10-01T14:29Z）に持ち主は、見本を画面分割で狭くすると pipeline が消えたと名指した。席が調べると、PC の画面分割では画面の倍率で窓 1 枚が 640〜768 画素になり、見本の境の 760 画素ではスマホの形に入って 5 列の pipeline が消えていた（席の見立て）。席は境を下げて見本を直し、601〜960 画素で 5 列が保たれることを確かめた。
  席の調べ（2026-10-01T09:25Z・今の板）。札の電文（/api/pipeline）は段・回数・理由・口座・段を決めた時刻・CI だけを持ち、段は Queued と Blocked を分けて持つが板は 1 列にまとめる。台帳の一覧の電文（/api/ledger）は id・種類・題・状態・更新の時刻・親・label だけを持ち、起票の時刻・依存の相手・本文の概要を持たない。run の段の流れ（審査・実装・gate の始まりと終わり）と run の歴と、Queued のまだ起きない理由も電文に無い。一覧の段の字は器の局面の出力から読むが、その出力がまだ無いので全部「まだ分からない」になっている。
  地図の中の 1 つの bead のつながりの頁（近傍の図）は、帯と形と色と縁と光らせ方を地図のグラフと同じ関数で描き（面の crate の mapview の around と graph）、近傍の段数と hub の閾値は中核の crate の around が規則の行 R-20 の値で持つ。問いの起票の門（要件 FR4）と導出グラフの床（要件 FR2・FR3）も同じ近傍とグラフを使う。hover の card は account board の札と記号だけの要素にも使う（今回の声は project board の分で、account board に同じ帯の形を使うかは別に問う）。
  器の席の答え（2026-10-01・memo t3-hub.52.160 の notes）。一覧の段と待ちの理由と待つ相手は器の局面の出力（fleet/lifecycle.json）から、run の段の流れは器の event log（fleet/events.jsonl）の 3 つの event（RunCreated・RunStage・RunDone）から、gate の内訳は便の dir の 2 つの file（verdict.json・review.json）から読める。器の Blocked は台帳の依存でなく、便の段が 3 つの級の承認を待つ局面（run-blocked）である。依存で待つ契約は局面（contract-queued）の理由（dependency）で、相手の欄（links.on）にまだ閉じていない相手だけが入る。理由（overlap）は相手の欄（links.runs と links.on）を持ち、理由（reserved）の相手は今は欄に無い。短い題は付帯の欄（metadata）の鍵（short）に置き、付け直しは台帳の書きの道具（bdw）で行う。器の局面の出力の全部の書き直しは、器の行が入るまで読む側から周期で撃つ形を器の席が勧めた（下限 300 秒・値は器の規則の行で器が持ち主に問う）。
  席の係が見本（mock.html）と論点の頁（points.html 第 3 版）を作り、5 つの幅（1600・1366・960・800・390 画素）で横の scroll が 0 で、960 と 800 で頁の縦の scroll が 0 で、console の誤りが 0 であることを測った。持ち主は論点の 1 番（Q1・並べ方）に案 A（横並び）と答え、残りの 1 番の 2（Q1b）・1 番の 3（Q1c）・2〜7 番（Q2〜Q7） の全部を推奨のとおりにすると答えた（問い t3-hub.52.160.1）。
decision: |
  (1) ADR-7 と ADR-16 の字のうち、次の字だけをこの記録の決定に置き換える。(ア) ADR-7 の決定 (3) の地図（圧縮・一覧・グラフ・表の面と、その切り替えの tab 列と、グラフの wheel と drag）を消す。帯と形と色と縁と凡例と近傍の段数と光らせ方の字は、決定 (2) の個別の頁と決定 (7) の吹き出しと一覧の印に使い続ける。(イ) ADR-7 の決定 (5) の 4 列を決定 (6) の 5 列と読む。(ウ) ADR-7 の決定 (7) の project board の「orchestrator と口座」の block を決定 (3) の帯と決定 (4) の窓と読み、稼働の記録は 24 時間の帯と直近 3 時間の細い帯だけにする。(エ) ADR-7 の決定 (8) の project board の「詳しく」を消し、指標を決定 (8) の一覧の見出しと読む。(オ) ADR-7 の決定 (10) の hover の card を、project board の pipeline の札と一覧の行では決定 (7) の click の吹き出しと読む（圧縮された cell は地図と一緒に無くなる）。(カ) ADR-16 の決定 (5) の「左端に控えの列」と「4 列」と「まとめ（epic）は地図と台帳の頁に出す」を、決定 (6) と決定 (8) と読む。ADR-16 の決定 (5) の要修正の行と、Queued と Blocked の札は設計の参照を持つ契約の bead だけで epic は板に出さない字は効いたままとする。ADR-7 と ADR-16 のほかの字と、account board の形は変えない。
  (2) 消す物は、project board の地図の tab（圧縮・一覧・グラフ・表・設計の木・台帳の木の 6 面）・口座の履歴と口座の「詳しく」・台帳の「詳しく」とする。地図の中の 1 つの bead のつながりの頁（近傍の図と run の時間軸）だけは、札と一覧の行の吹き出しの口から開く個別の頁として残す。
  (3) project board は tab と頁の切り替えをなくし、1 枚の画面にする。上の固定の帯に、次の一手・やる事の数（質問・止まった run・抜けの検査の 3 つで、1 以上の物だけ色をつける）・席からの最新の知らせの 1 行・席と口座（席の状態・直近 3 時間の動きの細い帯・今の口座の 5 時間と 7 日の残り）・抜けの検査の印・時計・設定（⚙）を置く。
  (4) 質問・止まった run・知らせ・席と口座・抜けの検査は、帯の印を押すと開く窓にする。窓は × と外の click と取り消しの鍵（Esc）で閉じる。質問の窓は 1 問ずつ出し、答えを送ると次の問いへ進み、全部に答えると閉じる。束の承認と方針の欄は質問の窓の下の段に置く。席と口座の窓は 24 時間の稼働の帯と残りの詳しい値を出す。
  (5) 帯の下の全部の高さを、台帳 open の一覧と pipeline の 2 つの面に使う。頁そのものは scroll せず、それぞれの面の中だけが scroll する（スマホの形を除く）。並べ方は窓の幅で自動に 3 段に替え、host と端末の種類では分けない。幅 1200 画素以上は横並び（左に一覧・右に pipeline）、601〜1199 画素 は縦積み（上に pipeline の 5 列・下に一覧・帯は詰め、狭い時は 2 段にし、pipeline の面の中だけを横に scroll させて 5 列を保つ）、600 画素以下はスマホの形（帯は 2 段・pipeline は 5 つの段の小さな札（tile）を押して 1 段ずつ開き、既定で開くのは札の在る段のうち一番急ぐ段・一覧は pipeline の下へ続けて頁は縦に scroll する・吹き出しは下からの板（sheet）・窓は全画面）とする。境の値は規則の行 R-35 が持つ。スマホの形の境を 600 画素にするのは、持ち主が見本を画面分割で狭くすると pipeline が消えたと名指し（2026-10-01T14:29Z）、席が調べると PC の画面分割は画面の倍率で窓 1 枚が 640〜768 画素になり、760 画素の境ではスマホの形に入って 5 列が消えていたからである（席は見本を直して 601〜960 画素で 5 列を確かめた）。面の受入 12 条（要件 NFR1・規則の行 R-23）の測りの幅に、真ん中の段の 960 と 700 を足す（締める向き）。
  (6) pipeline の板は Blocked・Queued・Running / Gated・止まり（Questioned と Failed と Stopped）・着地 の 5 列とし、着地の列は直近 12 時間の着地を出す（規則の行 R-36）。Blocked の列は相手を待っている物で、器の局面（run-blocked・相手は持ち主の承認）と、局面（contract-queued）のうち理由が依存（dependency）・重なり（overlap）・予約（reserved）の物（相手は欄 links.on と links.runs）とする。Queued の列は局面（contract-queued）のそのほかの理由の物とし、理由の語を平易な字で出す。控え（memo）は板に出さず一覧に出す。札は幅を抑え、短い題と段ごとの要の 1 行を出す。要の 1 行は、Blocked は待つ相手と待ちの長さ、Queued は列に在る長さと起票からの経過（列に在る長さが 30 分を越えると注意の色・規則の行 R-37）、Running / Gated は今の段と何回目の run と経過と口座、止まりは止まった理由の短い字と run の回、着地は着地の時刻と CI の結果とする。
  (7) 札と一覧の行は click で吹き出しを開き、× と外の click と取り消しの鍵（Esc）で閉じ、hover では開かない。吹き出しは、どの段も題の全体・概要・id・種類・epic・設計の行・起票の時刻と経過・個別の頁への口を出し、段ごとに次を足す。Blocked は待つ相手の一覧（相手の段つき・押すと相手の札へ）と待つ理由、Queued は列に入った時刻とまだ起きない理由、Running / Gated は段の流れ（審査 10 分 → 実装 22 分〜 の形）、止まりは理由の全文と run の歴（各回の結果）と次の手の button、着地は着地の commit と CI の結果。
  (8) 台帳 open の一覧は epic ごとの組にし、組の頭の 1 行に進みの棒と段ごとの数を出す。行は 1 行の短い題で、題の全体は吹き出しで出す。既定で開く組は、pipeline で動いている epic と open の子を持つ epic だけで、ほかは畳む。一覧の epic の組を選ぶと pipeline の札がその epic だけ濃くなり、札を選ぶと一覧の行に印が付く。台帳の指標は一覧の見出しの小さな数と図に縮める。記号の見方・表示先・初心者と経験者の切り替えは、帯の設定（⚙）の中に置く。
  (9) 短い題は、bead ごとに 1 つ、台帳の道具（bd）の付帯の欄（metadata）の鍵（short）に置く（全角 14 字前後を目安とする）。席は起票の時に書き（席の起票の手順に足す）、今開いている bead には席が付け直す。面は読むだけで書かない。置いていない bead は、今の題から機械で作る（便は契約の行 id・ほかは題の「—」の前）。器が自分で起こす bead にも短い題を置くかは、器の席と決める。
  (10) 面の server の電文に、bead の起票の時刻・依存の相手（相手の id と段）・本文の概要・短い題と、run の段の流れと run の歴と、Queued のまだ起きない理由を足す。一覧の段と Queued のまだ起きない理由（器の閉じた 11 語）と Blocked の相手（欄 links.on と links.runs）は器の局面の出力（fleet/lifecycle.json）の局面と理由と相手の欄から、run の段の流れと歴は器の event log（fleet/events.jsonl）の 3 つの event（RunCreated・RunStage・RunDone）から、gate と審査の内訳は便の dir の 2 つの file（verdict.json・review.json）から読む（器の席の答え・context）。理由（reserved）の相手が局面の出力の欄に載るまでと、読めない間は、面はその欄を「まだ分からない」と出し、知らない局面の語と理由の語も「まだ分からない」に倒す（閉じた列で持たない）。局面の出力の全部の書き直しは、器の行が入るまで tsuzuri の側から周期で撃つ（器の席の勧めの下限 300 秒）。導出グラフと近傍の口と床（tz graph --check）と問いの起票の門は変えない。要件 FR14・FR16 と範囲の節（scope）と受入 AC18 と要件 NFR1・規則の行 R-23 は、問いの触れる先（touches）に無いが、この決め（論点の 5 番〔Q5〕ほか）の帰結として改めた。地図だけが読む口を消すかは契約の行で決める。
options:
  - id: a
    name: 見本（board-v2）の推奨の全部
    text: 決定 (1) から (10)（論点の 1 番〔Q1〕は横並び・ほかの論点は推奨の案）。
    verdict: adopted
    reason: 持ち主の 7 つの声の全部に応え、見本の 5 つの幅の測りで横の scroll が 0 で、画面分割の幅でも頁を scroll せずに 2 つの面が見える。持ち主は論点の 1 番（Q1）に案 A と答え、残りの全部を推奨のとおりにすると答えた（t3-hub.52.160.1）。
  - id: b
    name: スマホでは pipeline と一覧を下の 2 つの button で切り替える
    text: 幅 600 画素以下では、pipeline と一覧をそれぞれ全画面にし、下の 2 つの button で切り替える（論点の 1 番の 2〔Q1b〕の案 B）。
    verdict: rejected
    reason: それぞれが全画面を使えるが切り替えが要り、持ち主が重いと言った tab の切り替えと同じ手間が残る。スマホはふとした時に様子を見て質問に答える使い方が多いと見て、段ごとの数が一目で見える案 A を推した。
  - id: c
    name: 画面分割の幅でも横並びを保ち、一覧を左の細い帯に畳む
    text: 幅 601〜1199 画素 でも横並びのままにし、一覧を左の細い帯に畳んで押すと開く（論点の 1 番の 3〔Q1c〕の案 B）。
    verdict: rejected
    reason: pipeline の列は広く取れるが、最も使う一覧が既定で隠れる。横並びのままだと 5 列が 1 列 100 画素ほどに潰れる。
  - id: d
    name: 短い題を今の題から機械だけで作る
    text: 台帳は変えず、便は行の名、ほかは題の「—」の前を切って短い題にする（論点の 3 番〔Q3〕の案 B）。
    verdict: rejected
    reason: 例えば「memo folio2 から移した項 f2-648.236 — 違反の名札の残り…」が「memo folio2 から移した項 f2-648.236」になり、中身が分からない。機械で作る形は、短い題を置いていない bead の補いにだけ使う。
  - id: e
    name: 着地の列は今日（日本の日）の分
    text: 着地の列を今のまま日本の日の今日の着地にする（論点の 4 番〔Q4〕の案 A）。
    verdict: rejected
    reason: 日付が変わった直後に列が空になり、夜中に着地した物が見えなくなる。
  - id: f
    name: 声で触れていない物を消す
    text: 記号の見方・表示先・初心者と経験者の切り替え・台帳の指標のどれかを消す（論点の 5 番〔Q5〕の案 B）。
    verdict: rejected
    reason: 持ち主はどれも使っていないとは言っていない。設定（⚙）の中と一覧の見出しに縮めれば、帯の下の高さを取らない。
  - id: g
    name: 質問を窓の中に縦に並べる
    text: 全部の問いを窓の中に縦に並べて出す（論点の 6 番〔Q6〕の案 B）。
    verdict: rejected
    reason: 1 問ずつの方が今どれに答えているかで迷わない。問いの多い日は窓の下の段の束の承認を使える。
  - id: h
    name: 一覧の組を全部畳む
    text: 一覧の epic の組を既定で全部畳み、押した組だけ開く（論点の 7 番〔Q7〕の案 B）。
    verdict: rejected
    reason: 一覧は最も短くなるが、開いてすぐ今動いている所が見えない。
  - id: i
    name: 2 つの面を縦に積む
    text: 全画面でも上に pipeline、下に一覧を置く。
    verdict: rejected
    reason: 持ち主は論点の 1 番（Q1）に横並びを選んだ（2026-10-01T09:36Z・memo t3-hub.52.160 の notes）。縦積みは画面分割の幅（決定 (5)）だけで使う。
basis: [P-2, P-19, N-2, N-5, N-7, NFR1, AC9, R-23, FR2, FR3, FR4, FR5, FR6, FR10, FR11, FR12, FR13, FR14, FR16, R-20, ADR-7, ADR-16]
produced: [R-35, R-36, R-37, AC18]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo（t3-hub.52.160）の notes（作り直しの契約の行の bead が在ればその notes）に 1 件ごとに記帳する。問う相手は持ち主。
    (1) 作り直しの最後の行の着地の後 14 日の内に、持ち主が消した表示（地図・口座の履歴と口座の「詳しく」・台帳の「詳しく」）のどれかが要ると 1 度でも言ったら、その表示を戻すかを問い直す。
    (2) 着地の後、席が browser の runner で幅 640・768・960・1100 画素（高さ 800 画素）の 4 つを撃ち、帯と 2 つの面が頁を scroll せずに見えない（頁の縦の scroll が 0 でないか、どちらかの面の高さが 200 画素を切る）測りが 1 つでも出たら、論点の 1 番の 3（Q1c）の案 B と比べて問い直す。
    (3) 着地の後 14 日の内に、席が起こした open の bead のうち短い題（付帯の欄 metadata の鍵 short）を持たない物が、ある時点で 3 本を越えたら、起票の手順（決定 (9)）を問い直す。
    (4) 着地の後に、run の段の流れ・Queued のまだ起きない理由・Blocked の相手のどれかが器から読めない（「まだ分からない」が 7 日続く）と分かったら、吹き出しのその欄（決定 (7)）を問い直す。
plain: |
  project の画面を、使ってみての声に合わせて作り直します。
  使っていなかった地図と、口座の履歴と、台帳の「詳しく」は消します。1 つの項目のつながりを見る頁だけは、札を押して開く「個別の頁」として残します。
  tab をなくして 1 枚の画面にし、上の固定の帯に次の一手・やる事の数・最新の知らせ・席と口座・時計を小さく出します。質問などは帯を押すと窓が開き、質問は 1 問ずつ答えて、全部答えると窓が閉じます。
  帯の下は全部、台帳の一覧と pipeline に使います。窓の幅が広ければ横に並べ、画面を分けた幅では縦に積み（狭い時は pipeline だけ横に scroll）、スマホでは段を押して 1 つずつ開きます。
  pipeline は、相手（あなたの承認やほかの便）を待っている便（Blocked）と順番を待つ便（Queued）を分けた 5 つの列にし、着地は直近 12 時間の分を出します。札は押すと吹き出しが開き、題の全体や待っている相手などを出します。
  札の題は、項目を作る時に席が短い題を台帳に書いておきます。
  この記録はあなたの承認で発効しています。承認の記帳先は tsuzuri の台帳の問いです。
