# 判断の記録 ADR-61 — 席の係の群（検証の群）を、置く前の試しの実の数で直した上限と引き金で置き、判断の記録 ADR-59 の決定 (2)(3)(4) に群の例外を足す（調べの群は置かない）
# 判断の記録 ADR-59 は封じてあるので本文は替えず、この記録で決定 (2)(3)(4) に群の例外を足す。
# 起草は係 w210a（2026-10-05）、検証役 qv187 の攻めを受けて係 w213a が直し、照らし直しの検証役 qv188 を受けて係 w217a が直した。材料は問い（t3-hub.87.2）の本文（裁定された版）と、群の試し g1 の計画と結果（席の測り）と、試しの係の出力。
id: ADR-61
title: 席の係の群（検証の群）を、置く前の試しの実の数で直した上限と引き金で置き、判断の記録 ADR-59 の決定 (2)(3)(4) に群の例外を足す（調べの群は置かない）
status: accepted
date: 2026-10-05
context: |
  持ち主は問い（t3-hub.87.2）に乙で裁定した（裁定 id = t3-hub.87.2:20261005T0639Z-1）。乙は、広い調べと事実の検証の手順を判断の記録 ADR-59 の規律の手引きの参照の file に書き、群の係の数と使用量を門が機械で断る形で、流れの道具（Workflow）の台本（script）は作らない。推奨の行は、置く前の試しの実の数で上限と引き金を直してから行を置くと書いた。試し（群の試し g1・2026-10-05）が済んだ。試しは型ごとに 1 件である。
  量は席の測りで数えた（係の記録の使用量を応答の id で重ねずに足した・V）。新しい量は判断の記録 ADR-59 の決定 (3) の和（入力と文脈の取り込みと出力）、読み直しは文脈の読み直しの量。
  係 1 体の量。新しい係 1 体の起こしの 1 歩は新しい量 約 2 万（頭の文脈が冷えていれば 約 4 万）で、短い頼みの係 4 体（反証役 3 体と地図の係）の 1 体の実の量は新しい量 約 9〜14 万・読み直し 約 130〜230 万だった（V）。残りは読んだ資料の取り込みと出力で、仕事に付いて動く。試しの前の係ごとの上限（地図の係 4 万・反証役 6 万）は、地図の係では最初の 1 歩で、反証役では仕事の途中（実の量の 約 4〜7 割の所）で尽きる。係の自己申告は 2 体とも実の量より少なかった（地図の係は 4 万の内と申告して実は 約 12.5 万・攻めの係は 約 26 万と申告して実は 約 32.6 万・V）。
  検証の群。題は、器の入口の排他を緩める問いの下書きの初版への攻め。1 体の検証役は、新しい量 約 40.6 万・読み直し 約 479 万・壁 約 20.5 分で、致命 1・要直し 9・軽い 4 を出した。群（全文の攻めの係 1 体と、攻めが判じられなかった主張を資料ごとに 6・5・3 に束ねた反証役 3 体）は、新しい量 約 65.8 万（1 体の 約 1.6 倍）・読み直し 約 1,296 万（約 2.7 倍）・壁 約 23.8 分で、致命 1（同じ所）・要直し 8・軽い 12 を出した。1.6 倍は群の攻めの係（約 32.6 万）が 1 体（約 40.6 万）より少なく出た時の値で、攻めが 1 体と同じ量なら 約 1.8 倍、反証役が上限いっぱいなら 約 2.2 倍になる（見立て）。攻めが判じられなかった主張 14 のうち 13 を反証役が判じた（真 5・一部 8・偽 0）。1 体が出さなかった数の直しが 2 つ（器の行の便 1 本の書きは 約 22 ギガ（GB）・追随の後の 2 回目の検査は 1 回目の 約 6 倍を書く）と、1 体が粗く見ていた数の精密化が 1 つ（重なりのための順の決まりの組の時間 90.1 時間のうち意味の依存を除いた分は 63.0 時間）出た。1 体だけが出した所は数えていない（分からない（U））。反証役 3 体は、新しい量 約 9.1〜13.6 万（和 約 33.2 万）・読み直し 約 132〜226 万（和 約 541 万）。席の照らし直し 4 件の外れは 0。試しの割りでは、器の記録の 1 本の file（器の event log）を 2 体の束が読んだ。
  攻めの係の分からない（U）の主張は、試しで初めて、攻めの係が別の一覧の file（各行に id・主張・判じられない訳・資料の path）に書いた。過去の攻めの出力はこの一覧を持たず、引き金に当たる件数は数えられない（U）。
  調べの群。題は開発の速さの基の線の測り（材料 約 8.9 メガ（MB））。1 体の調べ係は新しい量 約 24.0 万・壁 約 12 分で終えた。群は地図の係（新しい量 約 12.5 万・読み直し 約 140 万・壁 約 5.8 分）の後で席が止めたので、得（待ちの時間）は測っていない（U）。今の調べ係 7 体の新しい量（約 13〜24 万）で群の 7 体が働けば合計は 約 91〜168 万で、上限 50 万の止める線（45 万）に地図の後の調べ係の途中で届き、1 体の 約 3.8〜7.0 倍になる（見立て）。割りは path で重ならない 4 つにできたが、同じ表を 3 体が別の path の写しとして読み、中身は重なった。
decision: |
  (1) 群。群は、席が 1 つの返事で並べて起こす、判断の記録 ADR-59 の型の係の組である。群に入れる型は検証役だけとする（調べの群は置かない・(3)）。群の係の頼みの頭は、ADR-59 の決定 (2) の 4 行に 5 行目「群: <群 id> <i>/<k>」を足す。席は群を起こす前に、起草の置き場の群の id の dir に計画の file を置く。計画の file は、群の型・対象・下書きの種類・攻めの係の名・係ごとの割り（主張の id の列と読める path の列）と係ごとのモデルと、在れば、この群の id を本文に名指した問いの持ち主の裁定 id を持つ。攻めの係は、同じ dir に分からない（U）の主張の一覧の file（各行に id・主張・判じられない訳・資料の path）を書く。起こしの門は計画の file と一覧の file を読んで判じる。群の係は続けず、段ごとに新しい係を起こす。
  (2) 検証の群の値。引き金は門が数える字で、一覧の file の行が 3 以上、かつ計画の file の下書きの種類が閉じた列（問いの本文・判断の記録・消す行・緩める問い）の 1 つの時。種類の字が下書きに合うかは席の天井とする。全文を読む攻めの係は今のまま 1 体で、ADR-59 の頭の予算だけを持ち、群の上限に入れない。足すのは反証役 3 体まで。1 体の割りの主張は 6 まで（試しの最大）で、一覧の行が 18 を越える時は群を起こさない（下書きを割って攻め直すか、1 体の道に戻る。割った下書きは同じ対象なので、群は 7 日に 1 つの塊だけで、ほかの塊は 1 体の道か持ち主の裁定で）。係ごとの上限は新しい量 15 万・読み直し 250 万、群の上限は新しい量 45 万・読み直し 750 万。止める線は、群の合計がどちらかの欄で上限の 9 割（40.5 万・675 万）に届いた時で、そこから新しい群の係を起こさない。反証役は 1 つの返事で並べて起こすので、止める線は起こしを止めず、撤退の数えに使う。最悪は、走る係が自分の上限まで働き、書き終えの分（1 体 約 1 万・見立て）が足された値で、新しい量 約 48 万。読み直しの最悪は測っていない。割りの主張の id の和は一覧の行の全部と同じにする（席は主張を選ばない）。割りの主張の id は係どうしで重ならない（1 つの主張は 1 体だけが持つ）。読む path の重なりは測りの口が数えて記帳し、断らない。値は規則の表の行にしない。規則の表の欄の決まりの除外（AI の費用は測る仕組みが別で凍結できず、実地の試験で初めて値を決める）に当たるためで、判断の記録 ADR-59 の型の数と同じ形である。値を替えるのは判断の記録で、歯が値を数える。
  (3) 調べの群は置かない。問い（t3-hub.87.2）の調べの群の形（7 体・新しい量 50 万・引き金 300 キロ（KB））は使わない。大きな調べは 1 体ずつのままで、予算の 100% に届いた調べ係は、書き終えの段で調べた所と残りの path を出す物に書く。席は残りを新しい 1 体に頼む（止めた係は続けない）。新しい 1 体は、前の係に終えの印が付いた後に起こす（付く前は ADR-59 の決定 (2) の対象の重なりで断られうる。名で呼び合う形の係の終えの印は U）。
  (4) 門が断る物。起こしの門は、5 行目の欠けか字の誤り・計画の file か一覧の file の欠けか形の誤り・検証役のほかの型・引き金に届かない群・一覧の行が 18 を越える群・i が k を越えるか k が 3 を越える起こし・1 体の割りの主張が 6 を越える起こし・同時に生きた群の係が 3 を越える起こし・頭の予算が係ごとの上限を越える起こし・起こしの呼びのモデルが計画の file の値と違うか欠けた起こし（規則の表の行 D-1）・群の合計が止める線に届いた後の起こし・割りの主張の id の重なり・割りの主張の和と一覧の行の全部との違い（欠けも余りも）・同じ対象の群が 7 日の内に在る起こしを断る。7 日の断りは、計画の file の裁定 id が台帳の問いの notes の裁定の定型行に在り、その問いの本文がこの群の id を名指せば通す。照らせない時は断る。問い（t3-hub.87.1）と問い（t3-hub.87.2）とこの記録の裁定の問いの裁定 id は数えない。群の合計が読めない時は新しい群の係を断る（群は席が選んで起こす物で、断っても 1 体の道が残る）。係の門は、群の係が読みの道具（Read）で割りの path の外を読む事と、群の係の係を起こす道具（Agent）の呼び（入れ子）を断る。命令（Bash）と検索（Grep・Glob）の道具の読みは断らない。起こしの門は、席の流れの道具（Workflow）の呼びを全部断り、断りの理由に、流れの道具で係を起こすには持ち主に問う事を名指す。流れの道具を群に使うかは、別の問いの裁定と判断の記録で決める。終える前の門は、群の係の出力の主張の表の行に、確かさの印か証拠の path か命令が欠けていれば、1 度目の終わりを止める。
  (5) 数えるだけの物と天井だけの物。群の中で同じ path を 2 体が読みの道具で読んだ数と、割りの読む path の重なりは、測りの口が記帳し、断らない。命令と検索の道具の読みは数えにも入らず、席の天井とする。段の順と 7 日の窓の残りも席の天井とする。7 日の例外で、裁定が群の起こしを許したか（答えの向き）は門が読めず、席の天井とする。群の id の名指しは語として（前後が英数字でない）照らす。一覧の file を攻めの係が書いた事は席の天井とする（門は書き手を見ない）。
  (6) 量の判じ。上限と止める線は、測りの口（ADR-59 の決定 (5) の agent-meter）の記録だけで判じ、係の自己申告で判じない。
  (7) 判断の記録 ADR-59 への例外。ADR-59 の本文は替えない。(ア) 決定 (2) の「生きた係と対象が重なる起こしを断る」は、同じ群の係どうしでは対象が同じでも断らず、代わりに割りの主張の id の重なりを断る（この記録の決定 (4)）。群の外の生きた係との重なりは今のまま断る。(イ) 決定 (3) の「読み直しは越えの判じに使わない」は、群の係では読み直しも判じに使い、どちらかの欄が 100% を越えた群の係は書き終えの段に入る。50・75・90% の注ぎも両方の欄で数える。(ウ) 決定 (4) の「係の id の無い呼び（席）はどの門も見ない」に、起こしの門が席の流れの道具の呼びを見て断る形（この記録の決定 (4)）を足す。席の係を起こす道具の呼びは、ADR-59 の決定 (2) のまま起こしの門が見る。
  (8) 偽の確信の防ぎ。群の係は、どの主張にも確かさの印（確かめた（V）・記録から（D）・見立て（I）・分からない（U））と、証拠の path か命令を付ける（(4) の終える前の門）。席は群の終わりに、問いの本文か判断の記録の概要と推奨が頼る主張の全部と、記録から（D）の主張 1 件以上と、確かめた（V）の主張 2 件以上を照らし直す。外れが 1 件でも在れば群の全部の主張を下げ、席が照らし直すまで問いと判断の記録の材料にしない。全文を読む攻めの係は残す（繋ぎ方の誤りは、論を見ない反証役には見えない）。
  (9) 手引きと行。手順は規律の手引き（agent-discipline）の参照の file に書く（ADR-59 の決定 (6)）。行は ADR-59 の行（測りの口の行と、型と手引きと門の設定の行）の後に、ノート（surface-wave29b）か、その余地が無ければ後継のノートに足す。
options:
  - id: a
    name: 甲 — 試しの前の値のまま置く
    text: 問い（t3-hub.87.2）の推奨の値（調べの群 7 体・新しい量 50 万・引き金 300 キロ（KB）、検証の群の足す分 18 万・反証役 1 体 6 万）で置く。
    verdict: rejected
    reason: 係ごとの上限が試しの係の実の量の 約 3〜7 割で、どの反証役も仕事の途中で書き終えの段に入り、地図の係は最初の 1 歩で入る。調べの群は試しで止める線に届く見込みだった。
  - id: b
    name: 乙 — 検証の群だけを試しの数で直して置き、調べの群は置かない
    text: 決定 (1) から (9)。
    verdict: adopted
    reason: 検証の群は試し 1 件で、1 体の 約 1.6 倍の新しい量（上限いっぱいなら 約 2.2 倍）で、攻めが判じられなかった主張の 13/14 を判じ、1 体が出さなかった数の直しを 2 つと精密化を 1 つ出した。調べの群は得を測る前に止め、量は 約 3.8〜7.0 倍の見込みで、1 体に収まらない題での得は測っていない。1 体ずつ続ければ、足す量は起こしの 1 歩（約 2 万）と、前の係の途中の物を読む分（測っていない）で済む。
  - id: c
    name: 丙 — 検証の群を直し、調べの群を縮めて置く
    text: 決定 (1)(2)(4)〜(9) に、調べの群を足す。引き金は、計画の file が名指す同じ対象の調べ係の札が終えの印を持ち、測りの口の新しい量が頭の予算の 100% に届いた事。形は地図の係 1 体（新しい量 15 万・読み直し 160 万）と調べ係 2 体（各 新しい量 15 万・読み直し 250 万）で、群の上限は新しい量 45 万・読み直し 660 万、合わせは席が持つ。
    verdict: rejected
    reason: 引き金は 1 体が越えた後なので、残りの仕事を同じと見ると、1 体を足す道より、地図の係 1 体（試し 約 12.5 万）と起こしの 1 歩 1 つ（約 2 万）の 約 14.5 万 多い（見立て）。得は並べて待ちを縮める事だけで、試しでは測れていない。地図と割りの読みの門の部品が増える。
  - id: d
    name: 丁 — 群を置かない
    text: 判断の記録 ADR-59 のまま、1 体ずつ。
    verdict: rejected
    reason: 費用は 0。検証で判じられない主張が残る（試しでは、群の中では 14 のうち 13 を反証役が判じ、1 体が出さなかった数の直しが 2 つ出た）。
basis: [ADR-59, FR21, N-2, P-7, P-14, P-16, D-1]
produced: [FR22, AC22]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo の札（t3-hub.87）か後継の memo の notes に記帳する。群の 1 回は、起こしの門が通した係が 1 体以上在る群の id 1 つ。窓は、群の起こしの門の行の着地から、5 回目の群の終わりか 28 日の早い方まで。
    (1) 窓の中で、(8) の照らし直しで外れが 1 件以上在った群が 2 回以上になるか、測りの口の記録で群の合計がどちらかの欄の止める線に届いた群が 2 回以上になれば、群の 5 行目を断る行を置いて 1 体に戻し、持ち主に知らせる。届いた時から、席は行の着地を待たずに群を起こさない（天井）。試しの群の新しい量は止める線の 約 82% だった。
    (2) 窓の中で、同じ対象の調べ係が 2 体続けて予算の 100% に届いた対象（係の札の file の予算の欄と測りの口の記録で数える）が 2 つ以上になれば、調べの群を置くかを持ち主に問い直す。
    (3) 窓の終わりに、群の回数・各群の 2 欄の合計・反証役が判じた分からない（U）の主張の数を数えて報告する。これは撤退でなく報告である。
plain: |
  席が検証の係を何体か並べて起こす形（群）を、置く前の試しで測った量に合わせて決めた記録です。
  検証の攻めが判じられない主張を 3 つ以上残した時だけ、反証役を最大 3 体足します。1 体ずつの上限と群の合計の上限は門が測って断り、係の自己申告には頼りません。反証役は読みの道具では割り当ての外を読めませんが、命令での読みは止めません。
  調べの群は、試しで得を測る前に止め、費用が 約 4〜7 倍の見込みだったので、今は置きません。1 体に収まらない調べが続いたら改めて問います。
  席が流れの道具で係を起こす呼びは、門が全部断ります。
  照らし直しの外れか、止める線（上限の 9 割）への届きが 2 回あれば、群をやめて 1 体に戻します。
grill:
  when: 2026-10-05
