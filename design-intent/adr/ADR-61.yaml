consequences:
  - 検証の群 1 回は、攻めの係に足して新しい量で最大 約 48 万（試しでは 約 33.2 万）を使う。読み直しは上限 750 万（最悪は測っていない・書き終えの段の応答も文脈を読み直すので越えうる）。
  - 群の係の頼みの頭は 5 行になる。群の外の係は 4 行のまま。
  - 攻めの係は、群を起こす前に分からない（U）の主張の一覧の file を書く。一覧の無い攻めの後には群を起こせない。一覧の行が 18 を越える攻めの後も群を起こせず、下書きを割って攻め直すか 1 体の道に戻る。割った下書きは同じ対象なので、群は 7 日に 1 つの塊だけで、ほかの塊は 1 体の道か持ち主の裁定で進める。
  - 反証役は読みの道具では割りの path の外を読めない。命令と検索の道具の読みは止めず、数えにも入らない。割りの外の証拠が要る主張は、分からない（U）のまま要る path を書いて返し、席が次の手を決める。
  - 調べの群が無いので、1 体に収まらない調べは 1 体ずつ続けて起こし、壁の時間は縮まない。足す量は起こしの 1 歩（約 2 万）と、前の係の途中の物を読む分（測っていない）。
  - 席の流れの道具の呼びは、持ち主の頼みが在っても起こしの門が断る（前の問いの答えは、頼みの無い時の呼びを断るとした）。流れの道具で係を起こすには、別の問いで裁定を取る。
  - 行は ADR-59 の行の後に置くので、着地までは群を使えない。
  - 要件書の要件 FR21 の生きた係の重なりと予算の数えに群の例外の句を足し、要件 FR22 と受入 AC22 を足す。
note: 起草は係 w210a（2026-10-05）、検証役 qv187 の攻めを受けて係 w213a が直し、照らし直しの検証役 qv188 を受けて係 w217a が直した。承認の欄の逐語と経路と日付は、適用の script が台帳の問いの notes の定型行と裁定 id の時刻から読んで入れた。
