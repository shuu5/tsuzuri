  器の承認の欄: 裁定 (user)・user・外の道具 rust-analyzer と ast-grep 0.45.3 の採用 (憲法 A3) は裁定 user 2026-09-30T22:13Z 項 index-tools、 rules 行の値は 項 index-cap (index.cap_mb = 2048) と 項 index-timeout (index.timeout_s = 600・上限を越えた周に器が自分の作った索引を古い順に消すことの承認を含む・憲法 A1)。 台帳の問い s2-07l.736.33.4 の裁定 s2-07l.736.33.4:20260930T2213Z-1 に結び、 SRS の追加 round (版 0.33) で accepted にした。 逐語は台帳にだけ在る・裁定済
  器の承認の欄: 設計 (orchestrator)・orchestrator・2026-09-30 草稿 v1 (字面の閉包・名指しの読み手・受付と起動の列の 1 行の検査・審査の材料・受付札・裏で起こす形・vessel 宣言の任意 key・行の欄・toolchain を現物で読み、 便 165 本の FAIL / INCONCLUSIVE 76 件の分類と、 索引の道具の試し (問い 74・採点 53・正解の site 249・base 32 本・道具 8 つ) と照らした。 推奨の採用は 裁定 user 2026-09-28T00:54Z (決めてほしいことは推奨で進める、 の常設の指示) の適用で、 逐語は台帳にだけ在る。 外の道具を採ること (憲法 A3)・rules 行 index.cap_mb と index.timeout_s の値 (C5)・索引の置き場を消すこと (A1) は常設の指示に含めず、 SRS の追加 round で持ち主の裁定 id を取る。 拘束する constitution の版 0.5.0)。 2026-10-01 v2: 索引の道具の試しの監査のやり直し (使い方の誤り 2 つを直し、 行と関数単位の 2 つで数え、 新しく作った 10 問で確かめた) の数字に直した。 決定は変えない・作成
  器の案の章の要約: 候補を 5 つ並べます。 外の道具の索引を器が読む案 (選んだ案) と、 選ばなかった 4 つです。 選ばなかった案は、 既製の code の graph を採る案・器の字の一致の走査を広げる案・構文木の部品を器に足す案・compiler に仮の編集を当てる試し撃ちを本命にする案です。
  器の専門語の説明: 本文に出てくる専門語 6 個を、 やさしい言葉で説明します。
  ・code の索引（code index）: vessel 宣言が名乗る外の道具が commit の木から作った SCIP と構文の役の一致を、 器が自前の読み手で読んで state dir に置く平らな表 (本 ADR)。 1 行 1 occurrence で、 導出値であり真実の置き場ではない。
  ・逆引きの表（reverse lookup table）: 契約表の行が触る型と節が名指す型と関数を項目に、 参照・呼び手・literal・pattern・歯・可視性の連鎖・その項目を touches に持つ行の 7 列を件数と母集団つきで並べた表 (本 ADR)。 審査の材料に入る。
  ・索引の鍵（index key）: code の木の鍵と、 索引の宣言の字を並べた字の digest (本 ADR)。 同じ鍵の索引は作り直さない。
  ・構文の役（syntax role）: occurrence が literal・pattern・呼び出し・import・再輸出・test・doc の link・文字列の取り込み・可視性のどれに当たるかを表す閉じた 9 語 (本 ADR)。 どの構文がどの役かは言語ごとの規則の file が持つ。
  ・索引の閉包（index closure）: 字面の閉包と同じ 3 形 (literal の構築・match の arm・variant の構築) を、 字の代わりに索引が解いた symbol で数えた file の集合 (本 ADR)。 受付と行の審査だけが撃ち、 CI は撃たない。
  ・code の事実の欄（code facts field）: 契約表の行の任意の欄 code-facts。 要素は列と項目と値の 1 組で、 行の審査・受付・起動の列が各々の commit の索引で測り、 違えば断るか待たせる (本 ADR)。
  器の頁の末: このページは、大もとの機械データ (正本) から自動で組み立てられています。構造は機械が自動で検査し、内容が元データに忠実かは独立のレビューで確かめます。
