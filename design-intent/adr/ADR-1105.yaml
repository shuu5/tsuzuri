  who: 持ち主
  date: 2026-09-30
  ruling: "s2-07l.736.33.4・s2-07l.736.33.4:20260930T2213Z-1（器の台帳の id・器の記録の承認の欄が名指す・取り込みの裁定 t3-hub.74.60.1:20261004T0113Z-1）"
  verbatim: "器の台帳 s2-07l.736.33.4・s2-07l.736.33.4:20260930T2213Z-1 の notes に在る（この file に写さない）"
  surface: R-8
consequences:
  - "この判断で良くなること 4 つと、 代わりに引き受けること 6 つです。 良くなるのは、 触る物の使われ方を表で読めること、 別名や自分の型の短縮の書き方の越しの不足が並ぶ前に止まること、 名乗った事実が便を起こす時点で測られること、 器の依存が増えず言語を足すのが宣言だけで済むことです。 引き受けるのは、 外の道具を入れる手番、 code が変わるたびの作り直しの費用、 設定の file と文字列の流れが索引の外に在ること、 CI を通った行が後で断られうること、 名乗らない事実は測られないこと、 規則の一部を測り直す要があることです。"
  - "良い結果: 設計者と審査役が、 触る型と関数の使われ方を件数と母集団つきの表で読める"
  - "良い結果: 別名や Self の構築の越しに型を組む file の不足が、 列に並ぶ前 (行の審査) と便を起こす前 (受付) に止まる"
  - "良い結果: 設計に名乗った code の事実が、 便を起こす時点の main でまだ正しいかを器が測る"
  - "良い結果: 器の binary に依存を足さず、 言語を足すのは宣言と規則の file だけで済む"
  - "代償: 外の道具 2 つを host に入れて版を固定し、 A3 の裁定を取る手番が要る"
  - "代償: code を変える着地 1 本ごとに索引を作り直す時間と memory を使う (増分が無い)"
  - "代償: toml と文字列を経由する流れは索引の外で、 表は母集団で見せるだけになる"
  - "代償: 索引の閉包は CI に無く、 CI を通った設計の行が行の審査と受付で断られる"
  - "代償: 名乗らなかった事実は測られず、 設計の時点で知らなかった事実は表を読んで初めて見える"
  - "代償: 規則のいくつかは試しの落ちを見てから足したので、 新しい問いで測り直して見直す"
