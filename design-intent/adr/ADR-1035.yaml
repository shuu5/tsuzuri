  器の案の章の要約: 候補を 5 つ並べます。規則の表に最大値を持つ案、いまの launcher の変数を正式にする案、数の上限を持たず memory の枠だけで絞る案、host の宣言 file に手書きする案、そして dispatcher の hold の印で本数を絞る案です。
  器の専門語の説明: 本文に出てくる専門語を、やさしい言葉で説明します。
  ・同時走行の最大値（live run cap）: host で同時に走る便 (live な便) の本数の上限。 rules 行 pipe.max_live が値を持ち、 受付が起動の前に数えて断る。 走行中の便は止めない。
  ・live な便（live run）: 終端でない段の便。 終端 = Landed / Failed / Stopped と Gated で verdict が FAIL (ADR-1019 §2.1) に、 契約の審査の段 (ADR-1023) の Reviewed で verdict が PASS でない、 を足した現物の弁別。 intake の交差と同じ 1 関数が弁別する。
  ・受付（contract intake）: 必須 field・verify の形・write-set の余地・live 便との交差を通った契約だけが便になる段 (intake)。 本 ADR で live の本数の上限がここに加わる。 変異検査の並列の枠 (host の memory で数える別の実体) とは別。
  ・rules 行（rules row）: manifest (rules/manifest.toml) の 1 行。 id・閉じた種別・値・有効 flag・裁定 id・裁定日を持ち、 器は実行時にここからだけ値を読む (憲法 C1 / C5)。
