# 判断の記録 ADR-56 — 形 B の最初の比べの残りは、使い回しありの 9 便を先に撃ち、なしは 1 便だけを最後に撃つ。token の上限だけを 1.3 億に上げ、SSD の書きの上限 220 GB は替えない（持ち主の裁定 2026-10-05・記帳先 = tsuzuri の台帳の問い t3-hub.77.19 の notes）
# 判断の記録 ADR-48 の決定 (2) と決定 (4) の字のうち、この記録の決定 (1) が名指す字だけを最初の比べの周に限って置き換える（部分の置き換え・ほかの決定と字は効いたまま）。ADR-48 は封の一覧で本文が凍っているので本文は変えない（前例 ADR-48 が ADR-37 と ADR-43 を替えた形）。
# 起草は係 w187a（2026-10-05）。材料は問い t3-hub.77.19 の本文・係 w179a の調べ（drafts/w179a/w/notes.md の 7〜11 節）・検証役 qv181 の攻め（drafts/qv181/w/attack.md）。承認の欄は問い t3-hub.77.19 の裁定。
id: ADR-56
title: 形 B の最初の比べ（組みの使い回しを名乗る前の比べ）の残りは、使い回しありの 9 便を先に撃ち、使い回しなしは 1 便だけを最後に撃つ。token の上限だけをこの周に限って 1.3 億に上げ、SSD の書きの上限 220 GB は替えない（ADR-48 の決定 (2) と (4) の部分の置き換え）
status: accepted
date: 2026-10-05
context: |
  判断の記録 ADR-48 は、形 B の最初の比べの周を、8 本の仕事を使い回しなしで 1 回・ありで 2 回の 24 便とし（決定 (2)）、SSD の書きの上限を便の全部の段の和で 220 GB（決定 (3)）、token の上限を 1 周で 1 億（決定 (4)）とした。
  周は 2026-10-04 の夜に起こし、席の見張りの道具が 2026-10-05 の朝（協定世界時 00 時 49 分）に止めた。書きの見込み 223 GB が上限 220 GB を越えたため（決定 (3) の「見込んだ和が上限を越えた時」の字どおり）。済んだのは 24 便中 9 便（使い回しあり 7・なし 2）で、使い回しありの 2 回がそろった仕事（物差し）は 8 本中 0 本。止めた時の周の和は書き 108.3 GB・token 56,961,850（前の止めの引き継ぎの見込み 6 GB・600 万を含む）。止めで記録に入らなかった審査の token は、会話の記録の和で 1,462,117。ADR-48 の撤退の条件 (1) に当たる。
  残りの 15 便を全部撃つと、書きは約 238〜249 GB で上限を越え、token は約 0.97〜1.17 億で 1 億の 95% の止めを越える見込み。token の多くは、使い回しなしの 1 便（仕事 cs-server）の実装の AI が 1 便で 1,932 万を使った外れで、元は、長い検査を背景で撃ち直し、その出力の file を約 3 秒おきに読み直して待った事（待ちが 92%・係 w179a が会話の記録を数えた）。使い回しありの 7 便では、この外れは出ていない（最大 811 万）。
  見張りは、走っている便を、もう使った分でなく群の平均で数えていた（止めの直前の見込みは低く出ていた）。
  問い（t3-hub.77.19）は 5 つの案を持ち主に問い、案 C に裁定された（裁定 id は承認の欄）。
decision: |
  (1) 替える決め。この記録は、封で凍った ADR-48 の決定 (2)（24 便）と、決定 (4) のうち token の上限（1 周で 1 億以下）を、最初の比べの周に限って替える。ADR-48 の本文は替えない。ほかの決定（決定 (3) の SSD の書きの上限 220 GB と数える式と止めの形、決定 (4) の週に 1 周と口座の選びと止め）と、ADR-48 が替えていない ADR-37 と ADR-43 の決定と、2 周目より後の形 B の上限は替えない。
  (2) 便。最初の比べの周の残りは、使い回しありの版の残りの 9 便（1 回目の 4 便と 2 回目の 5 便）と、使い回しなしの版の 1 便（仕事 c-sum-two）の 10 便とする。使い回しありの 9 便を先に撃ち、なしの 1 便は、ありの 9 便が全部済んだ後に撃つ。なしの残りの 5 便（仕事 cs-server・t-seatcopy・t-seathook・g-list-hover・c-held-stage）は撃たない。済んだ 9 便は撃ち直さない。
  (3) 上限。token の上限は、この周に限って 1.3 億とし、95% の止めは 1.235 億。SSD の書きの上限は ADR-48 の決定 (3) の 220 GB（95% の止め 209 GB）のまま。和は止める前の周の全部を引き継いで数える。書きは 108.3 GB、token は記録の 56,961,850 に、止めで記録に入らなかった審査の 1,462,117 を足した 58,423,967 から始める（どちらも上限の側へ倒す）。
options:
  - id: a
    name: 案 C・ありの 9 便を先に撃ち、なしは 1 便だけを最後に・token の上限だけ 1.3 億
    text: 決定 (1) から (3)。
    verdict: adopted
    reason: 決めた SSD の書きの上限の内で、物差し（ありの 2 回）を 8 本全部取れる。書きの見込みは約 195〜197 GB で、95% の止めまで約 7〜14 GB。揺れで止めに届くとしても、ほぼ最後のなしの 1 便の間なので、失うのはその 1 便。token の見込みは約 8,460 万で、外れが 1 回出ても 95% の止めに届かない。token の上限は SSD を増やさない。同じ仕事でなしとありを比べる組は 8 から 3 に減る。
  - id: b
    name: 案 A・ここで締める
    text: これ以上撃たない。
    verdict: rejected
    reason: 物差しが 0 本で、名乗りの前に比べを撃ち直す要が残り（少なくともありの 9 便・約 80 GB）、それまで名乗りが止まる。
  - id: c
    name: 案 B・上限を 2 つとも上げて全部撃つ（書き 270 GB・token 1.25 億）
    text: 残りの 15 便を全部撃ち、なしの仕事（cs-server）の便を最後に撃つ。
    verdict: rejected
    reason: 比べる組は 8 つそろうが、書きは約 238〜249 GB で決めた 220 GB を 18〜29 GB 越え、案 C より約 42〜52 GB 多い。
  - id: d
    name: 案 D・案 C と同じ便で、上限を何も替えない
    text: token の上限を 1 億のまま、案 C の 10 便を撃つ。
    verdict: rejected
    reason: token の 95% の止めまでの余白が約 1,200 万で、外れ（約 2,000 万）がありの 9 便のどれかに 1 回出れば止まり、走っている便も止まって物差しがまた欠ける。
  - id: e
    name: 案 E・残りを来週に撃つ
    text: 残りの 15 便を来週の形 B の枠で撃つ。
    verdict: rejected
    reason: ありの 2 回の組の 8 本中 7 本が週をまたぎ、物差しに週の違い（実装の AI の版・host の込み）が混ざる（ADR-48 が 2 週に割る案を退けた理由と同じ）。上限の決め直しも要り、名乗りが 1 週遅れる。
  - id: f
    name: ありの 9 便だけ
    text: なしの便を 1 本も撃たず、ありの残りの 9 便だけを撃つ（撤退の条件 (1) の「足りない便だけ」の字の形）。
    verdict: rejected
    reason: 書きは約 186 GB と案 C より約 10 GB 少ないが、同じ仕事でなしとありを比べる組が 2 つ（片方はありが冷えた 1 便目）に減る。
basis: [ADR-48, ADR-37, ADR-43, ADR-49, ADR-35]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo（t3-hub.77）か後継の memo の notes に 1 件ごとに記帳する。問う相手は持ち主。
    (1) この周が止めの線（書きか token の 95% の止め・見込みの止め・口座の止め・壁）で止まり、使い回しありの 2 回の 8 本がそろわなかったら、それ以上は撃たず、残りの撃ち方を問う。この記録の下で上限を 2 度は替えない。
    (2) この周で token の外れ（1 便の token が、その周の同じ版の済んだ便の中央の値の 5 倍を越える便）が 2 回出たら、止めの線に届いたかに関わらず、名乗りの前に、外れの元を塞ぐ直しと比べの token の数え直しを問う。
    (3) ありの 2 回の 8 本がそろい、同じ仕事の組（3 つ）で、なしとありの書きの差が、ありの 2 回の書きの差の 2 倍を越えなかったら、なしの便を後で足すかを問う（後の週に足すと週の違いが混ざる）。
plain: |
  組み立ての使い回しを本番で使い始める前の比べの実験が、記憶の装置（SSD）への書き込みの見込みが上限を越えたため途中で止まりました。済んだのは 24 本中 9 本で、後の比べの物差しにする「使い回しありで同じ仕事を 2 回」の組は 1 つもそろっていません。
  そこで残りは、使い回しありの 9 本を先に撃ち、使い回しなしは 1 本だけを最後に撃ちます。なしの残りの 5 本は撃ちません。書き込みの上限 220 GB はそのままにし、AI の使用量（token）の上限だけを、この回に限って 1 億から 1.3 億に上げます。1 本だけ使用量が 8 倍に跳ねた便があったので、それがもう 1 回起きても止まらない余白を取るためです。使用量の上限を上げても書き込みは増えません。
  失うのは、なしとありを同じ仕事で比べる組の一部（8 組が 3 組になる）です。
approval:
  who: 持ち主
  date: 2026-10-05
  ruling: t3-hub.77.19（裁定 id = t3-hub.77.19:20261005T0123Z-1・案 C・束 batch:20261005T0123Z-1・配達の口・notes に逐語）
  verbatim: "どちらも推奨で進めて"
  surface: R-8
consequences:
  - 席の見張りの道具は、見込みの止めで、走っている便を、もう使った分（記録に入った書きと走っている囲いの今の書き・記録に入った token）と群の見込みの大きい方で数える（止めが早まる側だけの直し・席と係の手・持ち主に問わない）。止めを緩める直し（見込みの止めで走っている便を済ませる形・token の見込みを中央の値で数える形）は入れない。
  - なしの 1 便は群の済んだ便が無いので、見込みの下の端では残りを 0 と数える（今の道具の形のまま）。その便の書きは走っている間の使った分と 95% の止めで数わる。
  - 撃ち直しは、並びの木の組みの置き場が器の掃除（書き込みの無い 6 時間で消す）で消える前に起こし、ありの 2 便を冷えた組みから始めない。
  - 外れの元（実装の AI が長い検査を背景で撃ち直し、出力の file を読み直して待つ癖）は本番の便でも起きうるので、塞ぐ案を器の memo に起こす（この記録は決めない）。
  - 2 周目より後の形 B の上限は ADR-37 の決定 (2) の 120 GB と token 1 億のまま。名乗り（ADR-35 の決定 (7)）は ADR-37 の決定 (6) のとおり最初の比べの後に置く。
note: 起草は係 w187a。数は問いの本文（係 w179a の調べと検証役 qv181 の数え直し・2026-10-05）による。
