consequences:
  - "良い面は、 変異検査が上限 4 で最大およそ 4 倍速くなること、 memory が溢れても席や他の便が死なないこと、 別の project の便とも枠を分け合えること、 着地後の実測から変異検査 1 周ぶんが消えること、 そして 1 本ぶんの memory の値を実測で更新していけることです。 悪い面は、 host の systemd に依ること (無ければ 1 本ずつ)、 受付の置き場という host 単位の物が 1 つ増えること、 規則の行が 5 つ、 宣言 file の鍵が 1 つ、 記録の項目が増えることです。 止める仕組みの一覧は増えません。"
  - "Positive: 変異検査の壁時計が実効 jobs ぶん縮む (上限 4 で最大およそ 4 倍・実測は契約で取る)。 memory の溢れが scope の内側に閉じ、 席・他の便・他の project の process は kernel の OOM で選ばれにくい ({jobs} 行の合計は受付が守り、 それ以外の箱の合計は便の同時本数〔§2.7〕が守る)。 受付が project をまたぐので、 複数 project の便が同じ host で同時に走っても合計が守られる。 main 実測から検出線 1 周 (実測 75 分) が消える。 peak_mb の測定が溜まり、 gate.job_memory_mb を宣言値から測定値へ置き換える材料になる (C10)。 縮退 (並列度 1) は従来の費用と同じで、 実装役の箱の溢れ (§2.2・理由付きの終端) と着地後の実測の「測れなかった」(main-unmeasured・変更は main に載ったまま) 以外のどの失敗も便を止めない。"
  - "Negative (受け入れるコスト): systemd-run と cgroup v2 の user 委譲に依る (無い host は封じ込めなし・並列度 1・記録に残る)。 host 単位の置き場 (<NAME>-host/slots/) が state dir の外に 1 つ増え、 state dir の親を揃える運用が前提になる。 rules 行 5 つ・RuleKind 5 variant・宣言 file の鍵 1 つ (detection-verify) と穴 1 つ ({jobs})・verify.jsonl / verify-main.jsonl の任意 field 8 種 (kind jobs peak_mb confined reason slot skipped tree)・verdict.json の field 1 つ (tree)・完了 enum の variant 1 つ (SlotFree) が増える。 極性一覧は増えない (封じ込めも受付も guard ではない)。 main 実測の record を別 file に書き始める。 受付の測定は `MemAvailable` に依るので、 host の他の process が急に memory を使った周は scope の上限が守る (受付は追わない)。 `gate.job_memory_mb` の初期値は宣言値で、 実測が溜まるまで並列度が保守的に出る。 検出線を main 実測で省くので、 gate と main 実測の「同じ順序・同じ関数」は条件付きになる (ADR-1009 §2.4 の部分 supersede・§2.6)。 host の予約分を守る箱は「行が予約分まで食う」周にだけ効き、 その周は測れなかったに倒れる (§2.2)。"
