# 判断の記録 ADR-30 — board の概要の出し分け・個別の頁の詳細の表示・短い題の上限と起票の門・「測れていない」の直し（発効 2026-10-03・持ち主の裁定 t3-hub.76.1〜t3-hub.76.6 の 6 つ〔どれも末尾は :20261003T0057Z-1〕・記帳先 = tsuzuri の台帳の問い t3-hub.76.1〜t3-hub.76.6 の notes・発端は memo t3-hub.76）
# 判断の記録 ADR-7 の決定 (4)(9)(11) と ADR-27 の決定 (2)(7)(8)(9)(10) の字のうち、この記録の決定 (1) が名指す字だけを置き換える（部分の置き換え・ほかの決定と字は効いたまま）。ADR-7 と ADR-27 は封の一覧で本文が凍っているので本文は変えない（前例 ADR-27 決定 (1)・ADR-29 決定 (1)）。
# 席の調べ（今の形の在りか・台帳の数・写しの board の画面の測り）と 6 つの問いの材料は memo t3-hub.76 の notes。
id: ADR-30
title: board の概要は表示の型の 1 つを全文で出して長ければ畳み、個別の頁を本文と記録まで見せる詳細の表示にし、短い題に字数の上限と起票の門を置き、台帳が替わっていない間は最後に読めた中身を出す
status: accepted
date: 2026-10-03
context: |
  持ち主は 2026-10-02 に project board の改善を席に求めた（memo t3-hub.76・逐語は notes）。要約は次の 7 つである。(ア) 吹き出しの概要（非エンジニア向けとエンジニア向け）を、初心者の表示の型（mode）では非エンジニア向けだけ、経験者ではエンジニア向けだけにし、board の全体の決まりにする。(イ) 吹き出しの概要は途中で切らずに全文を載せ、長すぎる時は畳んで押すと開く。(ウ) 個別の頁を詳細の表示にし、頭に概要、その下につながり、さらにその下に bead の本文を畳んで見やすい形で載せる。(エ) 待っている相手の欄が長い題で崩れる物がある。続けて 3 つを足した。(オ) 台帳の一覧の行に pointer を載せたら、吹き出しは出さずに板の対応する札を強めて見せる（押して強める今の形は、Blocked の列で吹き出しと重なる）。(カ) 一覧の段の字の頭に板と同じ段の印を付けて対称にする。(キ) 時々中身が「測れていない」になって何も出ない理由。
  席の調べ（2026-10-02T23:2xZ〜2026-10-03T00:1xZ・main 5b1099ae の木と台帳の全部と、写しの board を読むだけで起こした画面の測り）。今の吹き出しの概要は 1 つだけで、本文の「### 観測」の次の行か最初の行を 120 字で切った字である。2 つの概要を並べるのは個別の頁と質問の窓の card で、hover の card は非エンジニア向けを先に 1 つ出す。どの面も表示の型で出し分けていない。概要の読みは 3 つに割れていて、契約の bead 81 本（本文が見出しの行「## 概要」「## 技術」の形）は個別の頁で「要約なし」になる。台帳の 480 本のうち 2 つの概要を持つのは 343 本・片方だけ 13 本・どちらも無い 124 本で、開いた memo 23 本はエンジニア向けを持たない。非エンジニア向けの長さは真ん中が 109 字（200 字を越えるのは 356 本のうち 44 本）、エンジニア向けは真ん中が 253 字（200 字を越えるのは 343 本のうち 207 本）。
  個別の頁は頭と概要・つながり・run の時間軸の 3 つの段で、本文と台帳の記録（notes）を出す段は無い。本文と記録を読む 1 本の引きの口（GET /api/ledger/<id>）は既に在る。面に本文の書式（Markdown）の描き手は無く、台帳の本文が使う形は見出し・箇条・番号・等幅の字だけである（表・囲いの code・太字・link は 0）。
  短い題は付帯の欄（metadata）の鍵（short）の字か、無ければ題から機械で作り、字数の上限も省きの印も無い。機械の短い題が 71 字の時、待っている相手の口が 4 行の高さになり、id の字が 43 画素から 19〜20 画素に潰れた（写しの board の測り）。持ち主の求めの時（2026-10-02T23:2xZ）は、開いた bead 26 本のうち短い題を持つのは 1 本だった（前の決め ADR-27 決定 (9) の「席は起票の時に書く」が守られなかった）。席が開いた bead の全部に短い題を置いた後も、tsuzuri の閉じた bead の 94 本と、同じ面が配る器の台帳の 1,031 本のうち 936 本と folio2 の台帳の 303 本のうち 87 本は、機械の短い題が 20 字を越える。
  「測れていない」の元（code の字から）。面の server の台帳の読みが 1 回 5 秒を越えて落ちると、server は最後に終えた読みに「無し」を置き、台帳の印が同じ間は読み直さない。台帳が次に書かれるまで読まず、最後に読めた中身が 60 秒より古くなると中身が「測れていない」になる（規則の行 R-21 の持ち回しの決まりどおりの動き）。台帳の読みは重い時 25 秒（計算は約 1 秒で残りは記憶装置の待ち）、軽い時 0.7 秒だった（席の測り）。読みの落ちは記録に残らない。
  席は 6 つの閉じた問い（Q1〜Q6）を推奨つきで出し、持ち主は全部に推奨と答えた（裁定 t3-hub.76.1〜t3-hub.76.6）。
decision: |
  (1) 前の判断の字のうち、次の字だけをこの記録の決定に置き換える。ほかの字は効いたまま。
  (ア) ADR-7 決定 (4) の card の順の「概要（非エンジニア向けとエンジニア向け）」は、決定 (2) の表示の型の 1 つの概要と読む。
  (イ) ADR-7 決定 (9) の「初心者と経験者の mode を持つ」に、決定 (2) の概要の出し分けを足して読む。
  (ウ) ADR-7 決定 (11) の「台帳の要約の欄」は、決定 (7) の 2 つの形（本文の定型行か見出しの下の字）と読む。「面は写すだけ」と「要約の無い節点は床が数える」は効いたまま。
  (エ) ADR-27 決定 (2) の個別の頁（近傍の図と run の時間軸）は、決定 (4) の詳細の表示と読む。
  (オ) ADR-27 決定 (7) の吹き出しの「概要」は、決定 (3) の形と読む。
  (カ) ADR-27 決定 (8) の「札を選ぶと一覧の行に印が付く」に、決定 (8) の逆の向き（一覧の行の hover の印）を足し、一覧の行と組の頭に決定 (9) の段の印を足す。
  (キ) ADR-27 決定 (9) の「全角 14 字前後を目安とする」は、決定 (5) の上限と読む。「席は起票の時に書き」は決定 (6) の門で守る。器が自分で起こす bead を器の席と決める字は効いたまま。
  (ク) ADR-27 決定 (10) の電文の「本文の概要」は、決定 (3) の読み（吹き出しを開いた時に 1 本の引きの口から読む）に替える。電文のほかの欄は効いたまま。
  (2) 概要の出し分け（board の全部の面の決まり）。概要を出す全部の面（吹き出し・個別の頁・質問の窓の card・hover の card）は、初心者の表示の型では非エンジニア向けの概要だけを、経験者の表示の型ではエンジニア向けの概要だけを出す。字は切り捨てず、長い時は規則の行 R-19 の字数で畳んで開ける形で出す。表示の型の側の概要が無い時は、もう一方の概要をどちら向けかの印つきで出し、両方無い時は本文の頭の 1 行を「本文から」の印つきで出す（第 1 問の案 A）。印の語は面の語の辞書に置き、面は字を作らない（要件 FR15 の「写すだけ」）。もう一方の概要は個別の頁にだけ、概要の下に畳んで置き、押すと開く（第 2 問の案 A）。質問の窓の card と吹き出しと hover の card は表示の型の 1 つだけを出す。
  (3) 吹き出しの概要は切らずに全文を出し、規則の行 R-19 の字数（200 字）を越える時は頭の字と「…」で畳み、押すと全文を開き、もう 1 度押すと畳む（第 3 問の案 A）。開く bead が替われば畳んで始める。字は吹き出しを開いた時に 1 本の引きの口（GET /api/ledger/<id>）から読み、読めるまでは「まだ分からない」と出す。面の server の口は増やさない。
  (4) 個別の頁は詳細の表示とし、上から 頭と概要（表示の型の 1 つの全文と、その下に畳んだもう一方の概要）・つながり（近傍の図）・本文（台帳の本文を見出し・箇条・番号・段落・等幅の字の形で描く）・記録（台帳の notes）・run の時間軸 の順に置く。本文と記録は表示の型によらず閉じて始め、開き閉じはその browser に覚える（第 4 問の案 A）。本文と記録は 1 本の引きの口から読む。本文の書式（Markdown）の描き手は面の中に自前で持ち、外の部品を足さない（規則の行 R-25）。描けない形（表・囲いの code など）は字のままの段にし、字を HTML として読まない。設計の節点（file の行）は本文と記録の段を出さない。
  (5) 置いた短い題と機械で作る短い題は、規則の行 R-19 の字数（20 字）を越えれば、頭の字と「…」で 20 字に切る。吹き出しの待っている相手の口の id の字は縮めない。
  (6) 起票の門（第 5 問の案 A）。席が台帳の道具（bd）か書きの包み（bdw）の作る命令（create）で bead を置く時、付帯の欄（metadata）の鍵（short）が無いか空か規則の行 R-19 の字数を越えれば、問いの起票の門（tz hook question-gate）が断る（規則の行 R-39・編集の時点で止める）。門は今の hook の中に置き、hook の数は替えない。器が自分で起こす bead は器の席と決める（ADR-27 決定 (9) のまま）。
  (7) 2 つの概要の読み。bead の本文に定型行（「概要 = 」と「技術 = 」で始まる行）が在ればその行の残りを、無ければ見出しの行（「## 概要」と「## 技術」）の下の次の見出しまでの字を、その bead の 2 つの概要とする。導出グラフと問いの card と吹き出しは同じ関数で読む。
  (8) 台帳 open の一覧の行にマウスの pointer を載せると、板の対応する札に hover の印（選びの輪より薄い）を付け、離すと外す。吹き出しは出さず、押すと吹き出しを開く形は今のまま。pointer の種類がマウスでない画面（指で触る画面）は印を出さない（窓の幅では分けない）。印は hover の card でないので、規則の行 R-20 の「hover の card を出さない」に当たらない。
  (9) 台帳 open の一覧の行の段の字（Blocked・Running など）と、組の頭の段ごとの数の頭に、板の札と同じ段の印（状態の記号の部品）を付ける。
  (10) 「測れていない」の直し（第 6 問の案 A）。面の server の台帳の読みは、台帳の置き場（store）の印が最後に読めた時の印と同じ間は、台帳の道具（bd）を撃たずに最後に読めた中身を新しい中身として返し、落ちた読みの結果を持たない。変化の見張りの読みの待ちは 30 秒とし（口の要求の読みは 5 秒のまま）、待つ間は最後に読めた中身と古さを出す。規則の行 R-21 の値（15 秒で注意の印・60 秒で「測れていない」）と字は替えない。判断の記録 ADR-23 決定 (4) の口の台帳の読み（印が違えば見張りを待たず自分で読む）は効いたまま。
options:
  - id: a
    name: 推奨の全部（表示の型の 1 つを全文で出し、個別の頁を詳細にし、短い題に上限と門を置き、持ち回しの秒を替えずに直す）
    text: 決定 (1) から (10)（6 つの問いの全部で案 A）。
    verdict: adopted
    reason: 持ち主の 7 つの求めの全部に応え、面の server の口と面の外の部品を増やさない。持ち主は 6 つの問いの全部に推奨と答えた（裁定 t3-hub.76.1〜t3-hub.76.6）。
  - id: b
    name: 2 つの概要を並べたまま、表示の型で順だけ替える
    text: 吹き出しと個別の頁と質問の窓の card に 2 つの概要を並べたまま、表示の型の側を先に出す。
    verdict: rejected
    reason: 持ち主の求め（表示の型の 1 つだけを出し、board の全体の決まりにする）に合わない。吹き出しが縦に伸びる。
  - id: c
    name: 概要の全文を面の server の bead の事実の口に載せる
    text: 吹き出しの概要の全文を、bead の事実の口（今は 120 字で切った 1 行）に全部の bead の分だけ載せる。
    verdict: rejected
    reason: 口の電文（今は約 165 KB）が tsuzuri の台帳で約 295 KB 増える見積もりで、台帳が替わるたびに全部の頁が読み直す。吹き出しを開いた時に 1 本だけ読めば足りる。
  - id: d
    name: 短い題は 20 字の切りだけにし、起票の門を置かない
    text: 機械の短い題と置いた短い題を 20 字で切るだけにし、起票の時に書く決まりは席の手順で守る（第 5 問の案 B）。
    verdict: rejected
    reason: 前の決め（席の手順で書く）は一度守られず、開いた bead の短い題が欠けたまま残った。切りだけでは「…」で切れた題が増え、元の字が読めない札が残る。
  - id: e
    name: 持ち回しの秒を 60 秒から 300 秒に延ばす
    text: 規則の行 R-21 の「測れていない」までの秒を 300 秒にする（第 6 問の案 B）。
    verdict: rejected
    reason: 決定 (10) の後は、台帳が替わっていない間の中身は印で同じと分かるので正しく、替わった時も重い時の 25 秒の読みは 60 秒の内に終わる。秒を延ばすと古い中身を長く見せるだけになる。
basis: [P-2, P-14, N-2, FR4, FR5, FR6, FR10, FR14, FR15, R-19, R-20, R-21, R-25, ADR-7, ADR-23, ADR-27]
produced: [R-39, AC20]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo t3-hub.76（作る行の bead が在ればその notes）に 1 件ごとに記帳する。問う相手は持ち主。
    (1) 決定 (2) の行の着地の後 14 日の内に、持ち主がもう一方の概要を吹き出しか質問の窓の card で見たいと 1 度でも言ったら、もう一方の概要の口の置き場（第 2 問）を問い直す。
    (2) 決定 (3) の行の着地の後 14 日の内に、持ち主が吹き出しの畳みが長い・短いと 1 度でも言ったら、規則の行 R-19 の 200 字（第 3 問）を問い直す。
    (3) 決定 (2) の行の着地の後、席が 7 日ごとに open の bead を数え、経験者の表示の型で印つきの代わり（もう一方の概要か本文の頭の 1 行）を出す bead が半分を越える数えが 2 度続いたら、起票の時に 2 つの概要を書かせる門を問う。
    (4) 決定 (6) の門の行の着地の後 14 日の内に、門が席の起票を断った事が 10 度を越えるか、門のために席の手順が止まった事を席が 2 度記帳したら、門を注意だけにする形（第 5 問の案 C）を問い直す。席が起こした open の bead のうち短い題を持たない物が 1 本でも見つかったら、門の穴として持ち主に問う。
    (5) 決定 (10) の行の着地の後、席が重い時（組み立てが重なる時）に board を開いて 3 度見て、「測れていない」が 1 度でも出たら、規則の行 R-21 の秒（第 6 問）を問い直す。
plain: |
  board の説明（概要）の出し方と、個別の頁と、短い題と、時々中身が出なくなる事を直します。
  概要は、初心者の見せ方では非エンジニア向けだけを、経験者の見せ方ではエンジニア向けだけを出します。これは board の全部の所の決まりです。その側の概要が無い時は、もう一方を印つきで出します。もう一方の概要は、個別の頁でだけ畳んで見られます。
  吹き出しの概要は途中で切らずに出し、200 字を越える時だけ畳んで、押すと全文が開きます。
  個別の頁は詳しい頁にし、上から概要・つながり・本文・記録の順に並べます。本文と記録は閉じて始まり、押すと見出しや箇条書きの形で読めます。
  短い題は 20 字までにし、長い題は「…」で切ります。席が短い題の無い項目を作ろうとすると、機械が止めます。
  台帳の一覧の行にマウスを載せると、板の対応する札に印が付きます。一覧の段の字にも、板と同じ印を付けます。
  時々「測れていない」になるのは、重い時に台帳の読みが 1 度落ちると、台帳が次に書かれるまで読み直さなかったからです。台帳が替わっていない間は最後に読めた中身を出すように直します。60 秒と 15 秒の決まりは替えません。
  作る便は、機械の確かめ（歯）の置き方を決め直した後に起こします。
  この記録はあなたの承認で発効しています。承認の記帳先は tsuzuri の台帳の問いです。
