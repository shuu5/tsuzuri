note: 逐語は問い t3-hub.76.1〜t3-hub.76.6 の notes（6 つの問いに同じ発話を結んだ・求めの逐語は memo t3-hub.76 の notes）。同じ commit で、判断の記録の封（anchors/adr-seals.yaml）に ADR-30 の行を足し（tz check --freeze-adrs）、要件書を第 0.26 版にして要件 FR4・FR5・FR6・FR10・FR15 を改めて受入 AC20 を足し、語彙表に 3 語（表示の型・2 つの概要・短い題）を足し、規則の行 R-19 の値に吹き出しの概要の畳みと短い題の字数を足し、規則の行 R-39（起票の短い題の門）を足して条 P-14 の relations に結ぶ。ADR-7 と ADR-27 の本文は封で凍っているので変えず、置き換えはこの記録の決定 (1) だけが持つ。作る行は、歯の置き方の作り直しの決め（memo t3-hub.77）の後に、その新しい決まりで起こす（行の割りの案は memo t3-hub.76 の notes）。決定 (6) の門の行は、席の起票の手順（作る命令に短い題を渡す）を替えた後に着地させる。
