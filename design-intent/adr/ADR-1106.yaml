  verbatim: "器の台帳 s2-07l.742.1・s2-07l.742.1:20261001T0124Z-1 の notes に在る（この file に写さない）"
  surface: R-8
consequences:
  - "この判断で良くなること 4 つと、 代わりに引き受けること 6 つです。 良くなるのは、 正当な作業が PR なしでその作業だけ通れること、 AI の席が字を渡す口では許しを作れず許可から user の言葉をたどれること、 検査の 2 つの読み手が同じ値を読むこと、 効いている許可と使った検査が見えることです。 引き受けるのは、 置き場の改ざんを不可能にはできないこと、 user が何に「よい」と言ったかまでは測れないこと、 本体の入れ替えの手番、 最初は 1 行の 2 つの読み手だけに効くこと、 runner の消費はまだ縛らないこと、 撃ち直しは今の手のままであることです。"
  - "良い結果: 正当な作業が上限に当たったとき、 PR も binary の入れ替えも無く、 その bead の便だけが user の許した値で gate を通れる"
  - "良い結果: 席が逐語を渡す口では許しを作れず、 許可は裁定 id から user の逐語へたどれる"
  - "良い結果: gate の照合と lens が同じ値を読み、 pipe gate・pipe land・pipe resume に --rules を渡す応急の形が無くなる (列の手動の 1 周に渡す --rules は本 ADR の断りの外で、 扱いは後継の決定が持つ)"
  - "良い結果: 効いている許可と、 許可の値を使った gate の周が、 一覧と event で見える"
  - "代償: 置き場は AI と同じ OS の user が書けるので改ざんは不可能にならず、 器が持つのは普通の口の閉じ・跡・一覧まで (それ以上は別の OS の user か署名が要る)"
  - "代償: 問いの後に user が別の話題で言った「よい」を結ぶ形と、 user が問いの本文を読んだかは測れない (発話に値の数字を求める照合を次の手として残す)"
  - "代償: event の kind を足すので、 最初の許可の前に PATH の binary を入れ替える手番が要る"
  - "代償: MVP は gate の 2 つの読み手だけで、 契約の審査・先撃ち・行の審査・memo の lens と、 ほかの作業ごとの 6 行は後の行に残る (行を対象に足すには、 その行の読み手と SRS FR1111 の直しを足す後継の決定が要る)"
  - "代償: runner の消費は縛らず (R-C6-1 は表示だけ・turn の上限は無い)、 動機に一番効く守りは同じ epic の次の設計を待つ"
  - "代償: 許可の記帳は便を自動で測り直さず、 撃ち直しは席の今の手のまま"
