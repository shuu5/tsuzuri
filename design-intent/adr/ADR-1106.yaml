# 判断の記録 ADR-1106 — 器 scribe2 の判断の記録 ADR-0106 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1106
title: "上限の許可 — user の発話に結んだ裁定を器が照らしてから、 rules 行が名指す消費の上限を bead 1 つに限り有限の値へ上げる記録を event log に持ち、 その bead の gate の照合と lens だけが読む"
status: accepted
date: 2026-10-01
context: |
  器の消費の上限は、 user が見ていない間に token が大量に使われないための既定の守りである。 正当な作業が上限に当たったとき、 今は manifest を PR で上げて戻すか、 写しの manifest を --rules で渡すしかない。 前者は重くほかの作業の上限も緩め、 後者は誰が許したかを確かめず、 記録も残らず、 lens に届かない。 本 ADR は、 user の発話に結んだ裁定を器が照らしてから、 名指された上限の行を bead 1 つに限って有限の値へ上げる記録 (上限の許可) を event log に 1 件書き、 その bead の gate の照合と lens だけがその値を読み、 期限・着地・取り消しで切れると決める。 上限を外す形は持たない。 新しい rules 行 2 本の値は、 持ち主の裁定 id (user 2026-10-01T01:05Z 項 permit-rows・user 2026-10-01T01:24Z 項 permit-max-h) と共に manifest に置くと決める。
  なぜこの判断が要るのかを 4 つから説明します。 今日の便が上限に当たり、 今の 2 つの手ではその作業だけに絞れなかった経緯・作業 1 つを縛る上限の行が 7 行で、 1 つの値を 2 つの process が別々に読んでいる現物・user の許しを器が確かめる今の仕組みとその穴・憲法をどう読み何を決めるかという範囲です。
  CTX1 経緯 — 正当な作業が上限に当たったとき、 今の 2 つの手はどちらも作業 1 つに絞れない
  2026-10-01 の便は、 verify が全部緑のまま、 gate の予算の照合で diff 215431 byte が cap 150000 (rules 行 gate.token_cap) を超えて Gated INCONCLUSIVE に止まった。 user が一時の上げを許し、 席は写しの manifest を --rules で渡して撃ち直した。 gate の照合は写しで通ったが、 lens は別の process で cap を読み直し (lens の起動の行は --rules を持たない)、 埋め込みの 150000 で再び断った。 着地の権能を持たない席は、 列の手動の 1 周に写しの --rules を渡す形しか持たず、 列は渡された道具を起こす便の全部へ写すので、 起こされうる契約 7 本を hold にしてから回した。 前例の一時の上げは、 manifest を上げる PR・binary の入れ替え・戻す PR の対 (2 組) で、 上げている間はほかの便の上限も緩む。 同じ契約の撃ち直し (追随・再 gate・新しい便) は同じ大きさの diff を何度も gate に掛けるので、 上限に当たった契約は撃ち直しのたびに同じ上限に当たる。 同じ便の消費の 4 値の和は約 6,531 万 token で検出線 R-C6-1 の 2,500 万を越えたが、 pipe show が超過の 1 行を出すだけで便は止まらない。
  CTX2 現物 — 作業 1 つの消費だけを縛る上限は 7 行で、 gate.token_cap の読み手は 2 つの process に割れている
  rules manifest の 85 行は、 便か bead 1 つの消費を縛る 7 行 (gate.token_cap・R-C6-1・review.same_kind_stop・pipe.follow_retries・pipe.land_wait_s・pipe.ci_wait_s・gate.slot_wait_s)、 host と群で分け合う 18 行 (1 つを上げるとほかの作業の取り分が減る)、 構造の 20 行 (C4・C13・C12 の門と台帳の形で、 CI は main の manifest で測る)、 上限でない 40 行に分かれる。 gate.token_cap は、 gate の予算の照合 (gate と追随の再 gate) と、 gate が起こす lens・契約の審査の lens・先撃ちの lens・行の審査の lens・memo の lens が別々に読む。 R-C6-1 は pipe show の表示だけが読む。 runner の起動には消費の上限の読み手が無く、 turn の上限の rules 行も無い。 便 524 本のうち消費の 4 値の和が 2,500 万以上は 13 本 (2.5 %) で、 gate の予算の照合で止まった形は verdict の写し 545 本のうち 5 本 (bead 4 つ・撃ち直しで上書きされるので下界) だった。
  CTX3 現物 — user の許しを確かめる仕組みのうち、 席が字を渡せないのは発話の記帳と裁定の結びだけで、 そこにも穴が 3 つ在る
  承認の口 pipe approve は、 席が渡した逐語が空でないことしか確かめず、 発話 event（人が打った字の記録） と照らさない (fleet record も便の形の kind を actor human で書ける)。 発話の記帳の hook は prompt が model に読まれる前に逐語を書き、 seat ruling bind は記帳済みの発話と開いた台帳の問い（台帳に立てる問い）を結んで逐語を event から写すので、 普通の口では席が字を渡せない。 ただし、 席の Bash が器の hook の発話の記帳の枝を直に撃つ形を止める guard が見当たらず (穴 1)、 event log は席の権能 edit-outside の内側の file で (穴 2)、 どの発話を結ぶかは席が選ぶ (穴 3)。 裁定面の答えの口は経路 gui の発話を書くが、 承認の受理面ではない (C7・ADR-1087)。 --rules の差し替えは渡した file を丸ごと読み、 pipe gate は役割の guard の表に無く、 どの manifest を読んだかを event に残さない。 置き場は AI と同じ OS の user が書けるので、 改ざんを不可能にはできない。
  CTX4 射程 — 許可を値の宣言でなく実行時の記録として読み、 対象の線・照合・単位・置き場・読み手・見え方を決める
  C1 は規則の値を manifest 1 file に置き、 実行時はそこからだけ読むと定める。 本 ADR は、 許可を値の宣言でなく、 承認 event が便ごとに 3 クラス操作を開けるのと同じ実行時の記録として読み、 許可の値を manifest の値の宣言でなく裁定を出所に持つ実行時の記録として、 manifest の値と別の型で持つ (C10)。 C5 により、 新しく足す rules 行 2 本は新しい裁定 id（裁定を指す番号） を要る。 C7・C7.2・A1 により、 上げの許しは対話面（承認を受ける唯一の窓口）の chat の経路の裁定に限り、 subscription の窓の token の消費も A1 の「使う」に入る側で読む。 A2 により、 構造の上限 (C4・C13) は作業ごとの許可の対象にしない。 C6.2 は便が R-C6-1 を越えたら器が止めると書くが現物は表示だけで、 停止は同じ epic の次の設計が持つ (推奨で進める既定の裁定 user 2026-09-28T00:54Z の適用)。 上限を外す (上限なし) 形は持たない (裁定 user 2026-10-01T00:38Z)。 要望は、 user が問いに短く許すと答えるだけで作業 1 つの上限が上がり、 設定 file の書き換えも binary の作り直しも要らない形である。 ADR を書く条件のうち 1 (C1・C7・C10 の解釈)・3 (event の kind と形・run dir の写し・rules 行の kind・跨版)・4 (却下の分岐) に当たる。
  （選択肢を測るものさし）この判断を評価する 6 本のものさしです。 既定の上限を守りとして残し、 ほかの作業の上限を動かさないこと。 user の許しを器が記録済みの言葉で確かめ、 AI の席が字を渡す口では許しを作れないこと。 許しを作業 1 つに結び、 同じ作業の撃ち直しのたびに user を呼ばず、 自然に切れること。 設定の書き換えも本体の作り直しも要らず、 検査の 2 つの読み手に同じ値が届くこと。 いつ誰の言葉で上げたかが後から見えること。 記録の置き場を 1 つに保ち、 足す前に消す物を名指すことです。
  DR1｜既定の上限を、 見ていない間の大量消費を止める守りとして残し、 ほかの作業の上限を動かさない CTX1・CTX2
  DR2｜user の許しを器が記帳済みの発話で確かめ、 席が字を渡して許しを作れない形にする CTX3・CTX4
  DR3｜許しを作業 (契約) 1 つに紐づけ、 同じ契約の撃ち直しのたびに user を呼ばず、 期限か着地で自然に切れるようにする CTX1
  DR4｜設定 file の書き換えと binary の作り直しを要らない形にし、 gate の照合と lens の 2 つの読み手に同じ値を届ける CTX1・CTX2
  DR5｜作成と使用を event と一覧に出し、 いつ誰の言葉で上げたかを後から引けるようにする CTX1・CTX3
  DR6｜真実の置き場を event log 1 つに保ち (C3)、 足す物の前に消す物を名指す (C17.2) — event の kind と形 1 つ・口 1・rules 行 2・RuleKind の分けの match 1・run dir の写し 1・hook の断り 1 を足し、 上げて戻す PR の対と、 pipe gate・pipe land・pipe resume に --rules を渡す応急の形を消す CTX1・CTX4
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 席が問いに bead・行・値・期限を字のまま書いて user に聞き、 user が chat で答えた言葉を問いに結びます。 器は、 行・値・期限・裁定とその言葉・作業の着地を 10 の項目で確かめてから、 その作業 1 つの許可を記録に 1 件残します。 その作業の検査だけが許可の値を読み、 ほかの作業は設定の値のままです。
  採用 — OPT1
  器 SHALL 消費の上限の rules 行のうち rules 行 pipe.permit_rows が名指す行だけを、 bead 1 つに限って manifest の値より大きい有限の整数へ上げる記録 (上限の許可) を、 event log の新しい kind LimitPermitted の 1 件で持ち、 manifest の値は変えない。 許可の値は manifest の値の宣言でなく、 裁定を出所に持つ実行時の記録として、 manifest の値と別の型で持つ (C1・C10 の読み)。 上限を外す形は持たない。 名指せる行は許可の読み手を持つ行 (予算 cap の rules 行) に閉じ (ほかの行 id を名指す値は manifest の読みが断る・SRS FR1017)、 rules 行 pipe.permit_rows の値は gate.token_cap 1 行で、 host と群で分け合う上限と構造の上限 (C4・C13) は対象にしない。 許可の口 pipe permit は bead・行・値・期限・裁定 id を受けて次を上から照らし、 1 つでも外れる周は何も書かずに、 最初に外れた照合の理由の語で rc 1 で断る: 行が対象の列に在る (rule-not-listed)・値が manifest の値より大きい (not-raise)・裁定 id が問い id の形で裁定 event が在る (no-ruling)・裁定 event が引く発話 event が在り actor が human (no-utterance)・発話の経路が chat で発話の session が対象 repo の対話面の席 (orchestrator) の会話 id (状態の打刻の file の最後の行) と同じ (not-surface・打刻の file が無いか空でない行を持たない周と、 file の最後の行の会話 id が空か会話 id の形でない周も断る)・発話が問いの起票より後 (before-question)・期限が今より後で発話の時刻から rules 行 pipe.permit_max_h の内側 (bad-until)・同じ裁定 id か同じ発話を引く許可がまだ無い (reused)・問いの本文が bead と行と値を字のまま持つ (not-stated)・bead の便がまだ Landed に達していない (landed)。 許可の記帳の周は、 照らす前に event log・manifest・台帳・その席の状態の打刻を読み、 どれかが読めない周 (file は在るが開けない・打刻の file の最後の行が打刻の形 (会話 id の欄の値を除いた行の形) でない・ほかの置き場 (event log・台帳) の行の形が壊れている・manifest の読みが断る) は照合の順に関わらず何も書かずに rc 2 で止まる。 取り消しは行が対象の列に在るかだけを照らし、 読むのは event log と manifest だけで、 効いている許可が無い周も書く (SRS FR1110)。 席が字を渡す承認 (pipe approve・fleet record) と裁定面の答えは根拠にしない。 口の権能は既存の approve に数える。 event は bead と detail を持ち、 detail は閉じた key の列 (rule・value・until・ruling、 取り消しは rule と revoked) で、 actor は machine、 schema の版は 1 のまま。 許可を読むのは名指された bead の便の gate の予算の照合と gate が起こす lens だけで、 gate は lens を起こす前に効く cap と出所の 1 行を run dir に毎周写し、 lens はその写しが在る周だけそれを読む。 その gate の照合とその gate が起こす lens の外の読み手 (ほかの bead の便・host 全体の読み・CI の門・契約の審査と先撃ちと行の審査と memo の審査の lens) はすべて manifest の値を読み、 許可の値が manifest の値以下の周も manifest の値を読む。 許可は、 期限・bead の便の Landed・同じ bead と行の新しい記帳・取り消し (裁定を要らない) のどれかで切れ、 同じ bead と行の最新の記帳がその許可自身である周だけ効く (新しい記帳が先に切れても古い許可へ戻らない)。 作成は event と口の 1 行に、 使用は Gated の段の event の detail と verdict の記録 (行・効いた値・裁定 id) に出て、 許可は状態の語と共に pipe show に、 効いている許可は pipe dispatch ls に出る。 前段として、 席の道具の呼び出しが器の hook の subcommand を直に撃つ形・state dir の event log を書く形・pipe gate と pipe land と pipe resume に --rules を渡す形を、 器の hook の入口が実行の前に断る (列の手動の 1 周に渡す --rules と、 その写しで起きた便の読みは本 ADR の断りの外とし、 扱いは後継の決定が持つ)。 古い binary は未知の kind を断るので、 最初の許可の前に PATH の binary を入れ替える。 rules 行 pipe.permit_rows と pipe.permit_max_h の値は manifest が裁定 id (user 2026-10-01T01:05Z 項 permit-rows・user 2026-10-01T01:24Z 項 permit-max-h) と共に持つ (C1・C5)。
  （平易）器は、 設定 (manifest) の値は変えずに、 名指された消費の上限の行を作業 (bead) 1 つに限って、 設定より大きい有限の値へ上げる記録 (上限の許可) を、 記録の file (event log) に 1 件残します。 上限を外す形は持ちません。 最初に上げられるのは、 検査役に渡す量の上限 1 行だけで、 ほかの作業と取り合う上限や構造の上限は上げられません。 許可の口は、 行が上げてよい行か・値が設定より大きいか・裁定が在るか・その裁定が引く user の言葉の記録が在るか・その言葉が承認を受ける席の今の会話の chat で打たれたか・問いより後の言葉か・期限が今より後で発話の時刻から決まった時間 (設定の行) の内か・同じ言葉を 2 度使っていないか・問いの本文に bead・行・値が字のまま書いてあるか・作業がまだ着地していないか、 を順に確かめ、 1 つでも外れたら何も書かずに理由の語で断ります。 記録の file・設定・台帳・席の状態の打刻のどれかが読めないときは、 何も書かずに止まります。 AI の席が字を渡す承認の記録は根拠にしません。 許可の値を読むのは、 その作業の検査の予算の照合と、 その検査が起こす検査役だけで、 検査は効く値と出所を便の置き場に写して検査役に渡します。 ほかの作業・ほかの審査役・CI は設定の値のままです。 許可は、 期限・作業の着地・新しい記帳・取り消しで切れ (設定の値が許可の値以上に上がったときも効きません)、 作成と使用は記録と一覧に出ます。 先に、 AI の席が器の見張りの口 (hook) を直に撃つ形・記録の file を書く形・検査と着地と再開の 3 つの command に写しの設定を渡す形を、 器が止めます (列の手動の 1 周に渡す形はこの判断の外で、 後の判断が扱います)。 新しい 2 つの設定の行の値は、 持ち主の裁定 id と共に設定 (manifest) が持ちます。
  （理由）記録の file に置いたのは、 真実の置き場を 1 つに保ち、 作成と使用を同じ順序で残すためです。 設定の値を上書きしないのは、 値の宣言の置き場を 1 つに保つ憲法の線を守り、 許可を承認と同じ実行時の記録として読むためです。 根拠を chat の言葉に結んだ裁定に限るのは、 憲法が承認を受ける面を対話面 1 つに限っているからで (C7)、 別の画面 (裁定面) の答えはその面の外です。 便の承認の記録は AI の席が字を渡せるので、 根拠になりません。 単位を作業 1 つにしたのは、 同じ約束の撃ち直し (追随・再 gate・新しい便) が同じ大きさの差分に何度も当たるので、 便ごとに許すと撃ち直すたびに user を呼ぶからです。 検査役へ便の置き場の写しで値を渡すのは、 今日の便で、 検査と検査役が別の process で値を読み直し、 その場で渡した設定が検査役に届かなかったからです。 上限を外す形を持たないのは、 見ていない間の大量消費を防ぐ動機とぶつかり、 問いに数を書かせることで user が数を見て許せるからで、 持ち主の裁定です。 構造の上限を許可の対象から外したのは、 その変更が憲法の別の手続きを求め、 CI が設定の値で測るからです。 user の言葉に値の数字を求めないのは、 短く許すと答えるだけで済む形を求めた要望に反するからで、 その穴は次の手として残します。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1110（claim）: FR1110 (上限の許可の記帳) が本 ADR の許可の口を要件にする。 照合の列と理由の語・取り消し・上限なしを持たないことの正本は FR1110 (SRS の版 0.34 で足した)、 対象の列の閉じの読みの正本は FR1017。
  FR1111（claim）: FR1111 (上限の許可の効き) が、 許可の値を名指された bead の gate の照合と gate が起こす lens だけが読み、 ほかは manifest の値を読むことを要件にする (SRS の版 0.34 で足した)。
  FR1112（claim）: FR1112 (hook の subcommand と event log の書きと規則の差し替えの遮断) が本 ADR の前段の 3 形の断りを要件にし、 列の手動の 1 周 (pipe dispatch) に渡す --rules を断りの外と書く (SRS の版 0.34 で足した)。
  FR1009（claim）: FR1009 (lens の verdict) の「予算 cap」を、 上限の許可がその bead の便の gate と gate が起こす lens に効く周はその許可の値 (効いている cap) と読むと主張する (字の直しは SRS の版 0.34)。
  NFR1001（claim）: NFR1001 (lens 予算) の目標値 0.15M token は既定の値として変えず、 上限の許可が効く gate の lens の周はこの目標の外とし (lens に渡す diff の上限が許可の値)、 測りの記録に効いた許可の値と裁定 id を足すと主張する (字の直しは SRS の版 0.34)。
  FR1041（claim）: FR1041 (権能の所在) の承認の記帳の権能に、 許可の口を数えると主張する。 新しい権能の名は足さず、 行 role.orchestrator は変えない (字の直しは SRS の版 0.34)。
  FR1082（rationale）: FR1082 (発話の記帳と裁定の結び) の字は変えない。 許可は FR1082 が記帳した発話と結んだ裁定だけを根拠にし、 1 つの発話を複数の問いへ結べる FR1082 の形の上で、 許可の側で 1 対 1 に絞る。
  FR1016（rationale）: FR1016 (承認の再開) と承認 event の形は変えない。 承認 event の逐語は pipe approve で席が渡す字で、 発話 event と照らさないので、 許可の根拠にしない。
  FR1017（claim）: FR1017 (rules manifest) が値の宣言の唯一の置き場であることを保つ。 許可は manifest の値を上書きした形にせず、 新しい rules 行 2 本は FR1017 の loader が読み、 pipe.permit_rows がほかの行 id を名指す値はその読みが断る (許可の値は manifest の値と別の型で、 実行時の記録として読む・C1・C10 の読み・SRS の版 0.34 で FR1017 に字を足した)。
  NFR1004（rationale）: NFR1004 (fail-closed) を保つ。 許可の記帳は読めない store (event log・manifest・台帳・席の状態の打刻) の周を、 取り消しは event log か manifest を読めない周を rc 2 で止め、 古い binary は未知の kind を malformed として断るので、 黙って落とす記録は出ない。 gate は event log を読めない周に許可の値へ倒さずに rc 2 で止まり、 verdict を書かない。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録はどの記録も置き換えません。 設定の値の置き場は変えず、 発話の記録と裁定の結びをそのまま根拠に使い、 承認を受ける面を 1 つに限る読みを上げの許しにも当て、 記録の file に種類を 1 つ足します。 原則は、 守りの上限は既定のまま残し、 上げるのは器が確かめられる user の言葉に結んだ、 作業 1 つ・有限の値・切れ目のある記録だけにする、 です。
  改訂状態: current
  置き換える ADR: なし (新規)
  置き換えられた: なし (現行)
  supersede は無い。 C1 の manifest 1 file の値の宣言は変えず、 許可を承認 event と同じ実行時の記録として足す。 ADR-1083 と ADR-1087 の発話の記帳と裁定の結びをそのまま根拠に使い、 承認の経路を C7 の対話面に限る ADR-1005 の読みを上げの許しにも当てる。 ADR-1004 の event log (追記だけの JSONL 1 file) に kind を 1 つ足し、 schema の版は 1 のまま。 ADR-1021 の gate の費用の測りは変えず、 期限の上限は ADR-1035 と同じく rules 行 1 本で持つ。 ADR-1093 の host の面に裁定つきの例外を置く型は、 作業ごとの許可には採らない。
  照会終端 — PRIN-RAISE-ONE-LIMIT-FOR-ONE-WORK-ONLY-ON-A-RULING-THE-VESSEL-CAN-CHECK
  守りの上限は既定のまま残し、 上げるのは器が確かめられる user の言葉に結んだ、 作業 1 つ・有限の値・切れ目のある記録だけにする。
  本 ADR が manifest の上げ戻し・--rules の正式化・event log の外の置き場・承認 event と裁定面の答えを根拠にする形・上限なし・構造の上限の上げ・便 1 本ごとの許可・発話に値の数字を求める照合を退けたのは、 この原則に行き着く (これ以上は遡らない照会終端)。
options:
  - id: "OPT1"
    name: "発話に結んだ裁定を器が照らし、 event log の上限の許可（作業 1 つだけの上限上げ）を名指された bead の gate と lens だけが読む"
    text: |
      席が台帳の問いに bead・行・値・期限を字のまま書いて user に聞き、 user が chat で答えた発話を seat ruling bind で問いに結ぶ。 席が許可の口に bead・行・値・期限・裁定 id を渡すと、 器は閉じた 10 の照合を上から照らし、 通る周だけ event log に許可の event を 1 件書く。 その bead の便の gate の照合と lens だけが許可の値を cap に読む。 決め手は現物の読み (CTX2・CTX3)。
      （平易）席が問いに「この bead の、 この上限を、 この値まで、 この時刻まで」と字のまま書いて user に聞き、 user が chat で答えた言葉を問いに結びます。 器は行・値・期限・裁定とその言葉・作業の着地を 10 の項目で確かめてから許可を記録に 1 件残し、 その作業の検査だけが許可の値を読みます。 上げが効くのは作業 1 つで、 AI の席が字を渡す口では許しを作れず、 設定も本体も触らず、 検査の 2 つの読み手に同じ値が届き、 作成と使用が一覧に出ます。 代わりに、 置き場の改ざんを不可能にはできず、 user が何に「よい」と言ったかまでは測れず、 最初の許可の前に本体の入れ替えが要り、 最初に効くのは検査役に渡す量の上限 1 行の 2 つの読み手だけです。
      利点: 上げが効くのは bead 1 つで、 ほかの便・host 全体の読み・CI の門は manifest の値のまま (DR1・DR3)
      利点: 根拠は hook が記帳した発話と結びの口が書いた裁定 event（裁定を結んだ記録） だけで、 席が逐語を渡す口を根拠にしない (DR2)
      利点: manifest も binary も触らず、 gate の照合と lens の両方に run dir の写しで同じ値が届く (DR4)
      利点: 作成と使用が event・判定の文・pipe show・pipe dispatch ls に出て、 裁定 id から逐語を引ける (DR5)
      利点: 置き場は event log 1 つで、 上げて戻す PR の対と、 pipe gate・pipe land・pipe resume に --rules を渡す応急の形を消せる (DR6)
      欠点: 置き場は AI と同じ OS の user が書けるので改ざんを不可能にはできず、 跡と一覧で見せるまでになる
      欠点: 問いの後に user が別の話題で言った「よい」を結ぶ形と、 user が問いの本文を読んだかは測れない
      欠点: event の kind を足すので、 最初の許可の前に PATH の binary の入れ替えが要る
      欠点: MVP は gate.token_cap の 2 つの読み手だけで、 契約の審査・先撃ち・行の審査・memo の lens は manifest の値のままで、 ほかの作業ごとの行を対象に足すには読み手を足す後継の決定が要る
    verdict: adopted
    reason: "決め手は現物の読み (CTX2・CTX3)。"
  - id: "OPT2"
    name: "manifest を PR で上げ、 着地の後に戻す (今の前例)"
    text: |
      上げる PR・binary の入れ替え・戻す PR の対で、 上限を一時に上げる。 決め手は前例の重さと効く範囲 (CTX1)。
      （平易）今の前例どおり、 設定の値を上げる PR を出し、 本体を入れ替え、 着地の後に戻す PR を出す案です。 新しい仕組みが要らず、 値の変更が裁定つきで設定に残り、 どの検査も同じ値を読む点で勝ります。 けれども、 便 1 本のために PR 2 本と本体の入れ替えが要って重く、 上げている間はほかの作業の上限も緩み、 戻し忘れを器が止めません。
      利点: 新しい仕組みが要らず、 値の変更は C5 の裁定 id つきで manifest に残る
      利点: CI の門と受付と gate が同じ値を読む
      欠点: PR 2 本と binary の入れ替えが要り、 便 1 本のためには重い (DR4)
      欠点: 上げている間はほかの便の上限も緩む (DR1・DR3)
      欠点: 戻し忘れを器が止めない (DR3)
    verdict: rejected
    reason: "決め手は前例の重さと効く範囲 (CTX1)。"
  - id: "OPT3"
    name: "--rules の写しを正式の口にする"
    text: |
      席が写しの manifest を書いて pipe gate や列の 1 周に --rules で渡す今の応急の形を、 そのまま正式の手にする。 決め手は今日の実測 (CTX1・CTX3)。
      （平易）今日の応急の形 (写しの設定を書いて、 command にその場で渡す) を、 そのまま正式の手にする案です。 すでに在って足す code が無く、 その command 1 つにだけ効き、 設定を変えずに済む点で勝ります。 けれども、 誰が許したかを器が確かめず、 どの設定を読んだかも残らず、 別の process で動く検査役には届きません。 列の手動の 1 周に渡すと起こす便の全部へ写り、 作業 1 つに絞れません。
      利点: 今すでに在り、 足す code が無い
      利点: command 1 つにだけ効き、 manifest を変えずに済む
      欠点: 誰が許したかを器が確かめず、 どの manifest を読んだかも記録に残らない (DR2・DR5)
      欠点: 読み手が 2 つの process に割れていて、 lens に届かない (DR4)
      欠点: 列の 1 周に渡すと起こす便の全部へ写り、 作業 1 つに絞れない (DR3)
    verdict: rejected
    reason: "決め手は今日の実測 (CTX1・CTX3)。"
  - id: "OPT4"
    name: "許可を event log の外 (host の面か state dir の別 file) に置く"
    text: |
      host の面 (host.toml) に作業ごとの例外の表を置く (ADR-1093 の型)、 または state dir に許可の file を足す。 決め手は真実の置き場の数 (CTX4)。
      （平易）許可を、 host ごとの設定の面に例外の表として置くか、 状態の置き場に別の file を足して置く案です。 host の面には裁定つきの例外を置いた前例が在り、 記録の file の形を変えずに済む点で勝ります。 けれども、 host の面に作業の id が毎日出入りすることになり、 どちらの形でも記録の file と真実が 2 か所に分かれ、 作成と使用の順序が食い違いえます。
      利点: host の面には裁定つきの例外を置いた前例が在る
      利点: event log の形を変えない
      欠点: host の面は host 固有の値の面で、 作業の id が毎日出入りし、 期限と着地で切る読み手を面の読みに足すことになる (DR6)
      欠点: どちらも event log と真実が 2 か所になり、 作成と使用の順序が log と食い違いうる (DR6)
    verdict: rejected
    reason: "決め手は真実の置き場の数 (CTX4)。"
  - id: "OPT5"
    name: "承認 event か裁定面の答えを根拠に加える"
    text: |
      pipe approve が書く承認 event、 または裁定面の答えの口が書く経路 gui の裁定を、 許可の根拠に加える。 決め手は根拠の偽れなさと承認の受理面 (CTX3・CTX4)。
      （平易）便の承認の記録や、 別の画面 (裁定面) から来た答えも、 許可の根拠に加える案です。 照らす項目が少なく、 user が chat を開かずに許せる点で勝ります。 けれども、 承認の記録の言葉は AI の席が渡す字なので、 AI が許しを作れてしまいます。 裁定面は承認を受ける面ではなく、 承認を受ける面を 2 つにするのは憲法を変える側の話です。
      利点: 承認 event は便の不可逆操作の承認と同じ形で、 足す照合が少ない
      利点: 裁定面から答える user は、 対話の session を開かずに許せる
      欠点: 承認 event の逐語は席が渡す字で発話 event と照らさないので、 席が許しを作れる (DR2)
      欠点: 裁定面の答えの口は承認の受理面でなく (C7・ADR-1087)、 対話面を 2 つにする読みは憲法の改訂の側にある (DR2)
    verdict: rejected
    reason: "決め手は根拠の偽れなさと承認の受理面 (CTX3・CTX4)。"
  - id: "OPT6"
    name: "上限を外す (上限なし) 形も許す"
    text: |
      有限の値への上げに加えて、 bead 1 つの上限をまるごと外す許可も持つ。 決め手は持ち主の裁定 user 2026-10-01T00:38Z (CTX4)。
      （平易）数の上げだけでなく、 その作業の上限をまるごと外す許可も持つ案です。 要る大きさが読めない作業でも 1 度の許しで済む点で勝ります。 けれども、 見ていない間の大量消費を防ぐという動機と真っ向からぶつかり、 問いに数を書かないので user が数を見て許す形になりません。 持ち主はこの形を持たないと裁定しました。
      利点: 要る大きさが読めない作業でも、 1 度の許しで撃ち直しを止めない
      欠点: 見ていない間の大量消費を防ぐという動機と真っ向からぶつかる (DR1)
      欠点: 問いの本文に数を書かせないので、 user が数を見て許す形にならない (DR2)
    verdict: rejected
    reason: "決め手は持ち主の裁定 user 2026-10-01T00:38Z (CTX4)。"
  - id: "OPT7"
    name: "構造の上限 (C4・C13) も作業ごとに上げる"
    text: |
      file の行数や CI の時間などの構造の上限の行も、 bead 1 つに限って上げられるようにする。 決め手は A2 と CI の測り方 (CTX2・CTX4)。
      （平易）file の行数や CI の時間など、 構造の上限も作業ごとに上げられるようにする案です。 そうした作業も同じ 1 つの口で許せる点で勝ります。 けれども、 構造の閾値を変えるのは憲法が grill と裁定を求める事項で、 作業ごとの許しでは代えられません。 また CI は main の設定で測るので許可が CI に効かず、 受付と CI の判定が食い違うだけになります。
      利点: 構造の上限に当たる正当な作業も、 同じ 1 つの口で許せる
      欠点: 構造の閾値の変更は A2 の grill と裁定 id を要る事項で、 作業ごとの許しで代えられない (DR2)
      欠点: CI の門は main の manifest で測るので許可が CI に効かず、 受付の余地と CI の門が食い違うだけになる (DR4)
    verdict: rejected
    reason: "決め手は A2 と CI の測り方 (CTX2・CTX4)。"
  - id: "OPT8"
    name: "許可を便 1 本ごとに結ぶ"
    text: |
      許可の単位を bead でなく便 1 本にし、 その便が終わったら切る。 決め手は撃ち直しの回数 (CTX1)。
      （平易）許可を作業 (bead) でなく、 便 1 本ごとに結ぶ案です。 効く範囲がもっと狭く、 便が終わればそれで切れる点で勝ります。 けれども、 同じ約束の撃ち直し (追随・再 gate・新しい便) は同じ大きさの差分に何度も当たるので、 撃ち直すたびに user を呼ぶことになります。
      利点: 効く範囲が bead より狭い (DR1)
      利点: 便の終わりで切れるので、 期限を置かなくても切れ目が在る (DR3)
      欠点: 同じ契約の撃ち直し (追随・再 gate・新しい便) は同じ大きさの diff に何度も当たるので、 撃ち直しのたびに user を呼ぶ (DR3)
    verdict: rejected
    reason: "決め手は撃ち直しの回数 (CTX1)。"
  - id: "OPT9"
    name: "user の発話に値の数字を含めることを求める"
    text: |
      許可の口が、 結んだ発話の逐語に許可の値の数字が在ることも照らす。 決め手は要望との釣り合い (CTX3・CTX4)。
      （平易）許可の口が、 結んだ user の言葉の中に許可の値の数字が在ることまで確かめる案です。 問いの後に別の話題で言った「よい」を結ぶ穴を詰められる点で勝ります。 けれども、 user が許すたびに数字を打つことになり、 短く許すと答えるだけで済む形を求めた要望に反します。 この穴を詰める次の手として残します。
      利点: 問いの後に user が別の話題で言った「よい」を結ぶ形 (穴 3 の残り) を詰められる (DR2)
      欠点: user が許すたびに値の数字を打つことになり、 短く許すと答えるだけで済む形を求めた要望に反する (CTX4)
    verdict: rejected
    reason: "決め手は要望との釣り合い (CTX3・CTX4)。"
basis: [FR1009, FR1016, FR1017, FR1041, FR1081, FR1082, FR1083, FR1110, FR1111, FR1112, NFR1001, NFR1004, ADR-1004, ADR-1005, ADR-1021, ADR-1035, ADR-1083, ADR-1087, ADR-1093]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「便」は 1 件の仕事の約束 (bead) を実装して main に入れる 1 回の流れ、 「上限」は 1 回の検査に渡す量などの数の守りです。 上限は、 user が見ていない間に token が大量に使われないための守りなので、 ふだんはそのまま残します。 けれども正当な作業が上限に当たったとき、 今は設定を PR で上げて戻すか、 写しの設定をその場で渡すしかなく、 前者は重くてほかの作業も緩み、 後者は誰が許したかが残らず、 検査役 (lens) にも届きませんでした。 この記録は、 user が chat で答えた言葉を器が確かめてから、 その作業 1 つだけ上限を有限の値まで上げる記録 (上限の許可) を残し、 期限か着地で自然に元へ戻すと決めます。 上限を外す形は持ちません。
