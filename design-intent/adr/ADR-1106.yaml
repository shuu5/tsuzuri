  器の専門語の説明: 本文に出てくる専門語 7 個を、 やさしい言葉で説明します。
  ・上限の許可（limit permit）: 消費の上限の rules 行のうち rules 行 pipe.permit_rows が名指す、 許可の読み手を持つ 1 行 (予算 cap の行) を、 bead 1 つに限って manifest の値より大きい有限の値へ上げる記録 (本 ADR)。 event log の kind LimitPermitted の 1 件で (取り消しは同じ kind で detail が revoked の別の記帳)、 対話の session の経路の発話に結んだ裁定 id を要り、 期限・bead の着地・同じ bead と行の新しい記帳・取り消しで切れ、 値が manifest の値以下になった周も効かない。 口は pipe permit。
  ・裁定 id（ruling id）: user の裁定を一意に指す id。 器の結びの口が発行する問い id の形などの閉じた形を持ち、 台帳の問いの notes の裁定の行が持つ (SRS FR1082・FR1083)。 本 ADR の許可の口は問い id の形だけを受ける。
  ・発話 event（utterance event）: user が対話の session へ打った prompt を、 model に読まれる前に器の hook が逐語のまま残す event (actor は human・発話の経路を持ち、 対話の session の分は session も持つ)。 裁定面の答えを答えの口が受けて残す分も在る (SRS FR1082)。
  ・裁定 event（ruling event）: 器の結びの口 seat ruling bind か答えの口が台帳の問いと発話 event を結んだときに 1 件書く event (actor は human・問いの id・裁定 id・発話の ts・発話の経路・問いの起票の時刻を持つ)。 便の不可逆操作の承認 event とは別の kind。
  ・対話面（dialogue surface）: user と器が承認をやり取りする、 ちょうど 1 つの面 (C7)。 rules 行 R-C7-1 が名指す orchestrator の席が持つ。 本 ADR の許可は、 この席の session の発話に結んだ裁定だけを受ける。
  ・台帳の問い（ledger question）: 席から user への問いを記録する台帳の bead (label intake:question)。 本文の 4 行と metadata の effect を持つ (SRS FR1081)。 上げの問いは effect が operation で、 本文に bead・行・値・期限を字のまま書く。
  ・発話の経路（utterance channel）: 発話 event・裁定 event が持つ、 字が来た道の閉じた 2 値 (対話の session と裁定面・SRS FR1082)。 event の機械の値は chat と gui で、 本 ADR の許可は chat (対話の session) の経路だけを受ける。
