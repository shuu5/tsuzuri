plain: |
  この記録で「器」は scribe2 の本体、 「見張り (host-guard)」は危ない操作を実行の直前に止める器の口、 「隣の private repo」は同じ machine の宣言に並ぶ非公開の repo、 「host の面」は置き場 (state dir) ごとに 1 つ置く、 git で追跡しない宣言の file です。 見張りは、 公開の repo へ出る文字に隣の private repo の名の一部が混じると止めますが、 持ち主が無害と裁定した語の中の当たりは数えません。 ADR-1078 はその語の一覧を、 公開の repo に載る規則の行が、 語を sha256 に掛けた指紋 (digest) の列で持つと決めていました。 短い語の指紋は、 候補の語を同じく指紋にして突き合わせれば当て直せるので、 語を足せば、 一覧に在る語と、 そこから隣の repo の名の一部が読めてしまいます。 ただし、 この repo の規則の行にはまだ除外の語が 1 つも無く、 指紋を計算する実装もありません。 この記録は、 起きた漏れへの対処でなく、 除外を 1 つ足す前に置き場を変える先回りの判断です。 一覧を host の面の「公開の除外の表」へ語のまま移し、 各行に裁定の番号 (裁定 id) を持たせ、 番号の欄が無いか空の行を持つ面は読むときに断ると決めます。 置き換えるのは ADR-1078 のうち、 除外の一覧の置き場と形だけです。
