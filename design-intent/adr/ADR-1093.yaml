consequences:
  - "この判断で良くなること 3 つと、 代わりに引き受けること 6 つです。 良くなるのは、 公開の repo から除外の語も指紋も消えること、 裁定の番号の欄を欠く除外が黙って効かないこと、 器に指紋を計算する実装を足さずに済むことです。 引き受けるのは、 除外の変更が PR の差分と CI の門に現れず台帳の裁定だけが記録を持つこと、 置き場ごとの面に同じ行が要ること、 番号が台帳で解けるかは測らず中身のある偽の番号の行も効くこと、 1 行の欠けで面を読む口が丸ごと止まること、 問いを操作で済む問いとして立てることを強制する門が無いこと、 公開の面から語を読めないのは台帳の同期先が公開でないという前提に依ることです。"
  - "良い結果: PUBLIC な repo の tracked な file から除外の字句も digest も消え、 公開の字句を hash しても隣の repo の名の成分は読めない (字句が残る台帳の同期先は公開の面でないという前提の上で・CSQ-N6)"
  - "良い結果: 裁定 id の欄が無いか空の行を 1 行でも持つ面は読みで断られるので、 欄を欠く除外が黙って効くことは無い (id が台帳の裁定に解けるかは測らない・CSQ-N3)"
  - "良い結果: 照合は字句の比較になり、 器に digest (sha256) を計算する実装を足さずに済む"
  - "代償: 表が tracked でないので、 除外の変更は PR の差分と CI の門に現れず、 変更の記録は台帳の裁定 (裁定 id と裁定 event) だけが持つ"
  - "代償: host の面は置き場 (state dir) ごとの 1 file なので、 置き場が複数の host では各面に同じ行を置く。 行を欠く面は除外が少ない側 (断る側) に倒れ、 公開の側には倒れない"
  - "代償: 読みが確かめるのは裁定 id の欄の有無と空だけで、 id が台帳の裁定に解けるかは測らない (FR1083 が数えるのは追跡された file の字面だけ)。 欄に中身のある偽の id を持つ行は除外として効き、 host の面を書ける者は裁定なしに除外を足して当たりを外せる"
  - "代償: 除外の表の 1 行で裁定 id の欄が欠けるだけで、 host の面全体が在るが読めない host の面になり、 計測・口座の選定・管理 tick・doctor・席の起動・公開の字面の走査が typed に止まる (FR1057 の極性)。 安全な側に倒れるが、 止まる範囲は除外の外に及ぶ"
  - "代償: 問いの effect は起票する者が選び、 除外の表の行を求める問いを operation で立てることを強制する門は無い。 document で立てれば FR1084 が未反映の裁定と数え、 その裁定を引く契約を待たせる (安全な側に倒れる)"
  - "代償: 除外の字句は台帳の問いと裁定の行 (逐語の欄) にも残る。 公開の面から字句を読めないのは、 台帳の同期先が公開の面でないという前提の上でだけ成り立つ"
note: |
  器の元の file: scribe2/design-intent/decisions/ADR-0093-publish-exclusions-sit-verbatim-in-the-host-face.html
  器の表紙の頭: 設計判断記録 (ADR) scribe2 — 公開の除外の表
  器の表紙: 状態accepted選択肢5件 (OPT1–OPT5)結果良い 3 / トレードオフ 6版v0.1.0 / 2026-09-29
  器の表紙: 正当化する要件: SRS-SCRIBE2-MVP の FR1080・FR1057
  器の表紙: 想定読者: scribe2 の開発 session と user — 器の内部と Rust の専門知識は不要 (専門語はやさしい言葉を併記)
  器の承認の欄: 裁定 (user)・user・持ち主の裁定 2026-09-29T05:46Z (除外の一覧を host の面へ字句のまま移す)・持ち主の裁定 2026-09-29T04:37Z (公開情報の扱いは推奨で進める)。 表の on-disk の形 (表の名と key の閉じた列) は本 ADR の決定が持ち、 SRS には無い。 読みの断り・rules 行の要素の断り・除外の字句の照合の単位・行を求める問いの effect は SRS v0.30 (FR1057・FR1080・glossary 識別子の 4 形) が持つ。 どちらも orchestrator がこの範囲で推奨のまま決めた。 憲法の条文は動かさないので改訂の裁定は要らない。 逐語は台帳にだけ在る (記録は memo s2-07l.738.13)・裁定済
  器の承認の欄: 設計 (orchestrator)・orchestrator・2026-09-29 草稿 v1 (ADR-1078 と ADR-1026 の決定、 SRS v0.30 の FR1080・FR1057・FR1084 と AC1050、 今の rules 行 host_guard.publish の値と読み手の札を読み、 除外の要素がまだ 0 で digest を計算する実装も無いことを確かめた。 拘束する constitution の版 0.5.0)・同日 v2 (fidelity の review を反映し、 拒む行を持つ面の波及・照合の単位・問いの effect・表の名と key・台帳に残る字句の前提を足した)・作成
  器の案の章の要約: 候補を 5 つ並べます。 host の面の表に語のまま置く案 (選んだ案) と、 選ばなかった 4 つです。 選ばなかったのは、 今のまま指紋の列を規則の行に置く案、 語のまま規則の行に置く案、 除外を持たない案、 machine だけが持つ秘密の値 (salt) を混ぜた指紋を規則の行に置く案で、 当て直せる・そのまま公開になる・無害な公開が毎回止まる・規則の行が machine ごとの値になる、 がそれぞれの決め手です。
  器の専門語の説明: 本文に出てくる専門語 7 個を、 やさしい言葉で説明します。
  ・公開の除外の表（publish exclusion table）: host の面の表 [[publish-exclusion]] で、 隣の private repo の名の当たりを数えない無害な字句を持つ (FR1080・本 ADR)。 key は phrase (字句) と ruling (裁定 id) の 2 つだけで、 字句のまま持ち、 tracked な file に書かない。 裁定 id の欄が無いか空の行を持つ面は読みで断られる (FR1057)。 口座選定の除外 (FR1036) とは別。
  ・host の面（host manifest）: manifest の host の面。 state dir の 1 file が host 固有の宣言値 (口座・plugin の場所・起動引数・群の表・公開の除外の表 など) を持ち、 tracked の manifest と同じ読み手で読まれる。 rules 行は置けない。 拒む行を 1 つでも持つ面は在るが読めない面で、 面を読む口が止まる (FR1057・ADR-1026)。
  ・隣の private repo（neighbor private repo）: host の面の群の表の行 (群と park の区画) が持つ anchor のうち、 実体が在り、 公開先の repo と別の repo で、 public と実測できないもの (可視性を読めない repo を含む・群の表の行を持たない host では 0・FR1080)。
  ・識別子の 4 形（identifier forms）: 隣の private repo を指す閉じた 4 つ — repo の名 (出ていく字面と名を ASCII の英数字と _ の外の字で区切った成分の並びで、 大文字と小文字を区別せずに照合し、 一般語の名も除かない)・object id・tracked path・台帳 id (FR1080・ADR-1078)。 一覧は publish の種類の rules 行が持つ。 repo の名の当たりのうち、 公開の除外の表の字句を同じ区切りで切った成分の並びと大文字と小文字を区別せずに一致する区間の中の当たりだけを数えない。
  ・裁定 id（ruling id）: user の裁定を一意に指す id (FR1082)。 台帳の問いの notes の裁定の行が持つ。 本 ADR では公開の除外の表の各行が ruling の欄に持ち、 欄が無いか空の行を持つ面は読みで断られる (id が台帳に解けるかは測らない)。
  ・未反映の裁定（unreflected ruling）: effect が document の閉じた台帳の問いの裁定 id のうち、 main の追跡された file が 1 つも引かないもの (FR1084)。 effect が operation の裁定は数えない。 公開の除外の表の行を求める問いは operation で立てるので数えず、 document で立てれば数えて、 その裁定を引く契約を待たせる。
  ・digest（digest）: 字句を sha256 に掛けて得る 16 進 64 字の値。 字句そのものは読めないが、 候補の字句を同じく hash して突き合わせれば当て直せる。 ADR-1078 は除外の一覧をこの形で rules 行に置いた。
