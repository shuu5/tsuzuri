# 判断の記録 ADR-17 — 導出グラフの辺に設計ノートの行の 2 型を足す（発効 2026-09-28・持ち主の裁定 t3-hub.65:20260928T1228Z-1・記帳先 = tsuzuri の台帳の問い t3-hub.65 の notes）
# 判断の記録 ADR-7 の決定 (2)（面の土台は 1 つの導出グラフ）は効いたままで、この記録はその辺の型に設計ノートの行の 2 型を足す。実装の行は設計ノート surface-wave14d に在る。
id: ADR-17
title: 導出グラフの辺の型に、設計ノートの行から要件への req と、行から先に要る行への depends の 2 型を足す
status: accepted
date: 2026-09-28
context: |
  判断の記録 ADR-7 の決定 (2) は、導出グラフの節点に設計文書の 11 種と設計ノートの行を置き、辺を設計文書の 17 型と台帳の 4 型と結びの 6 型と走行の 3 型（閉じた 30）とした。設計ノートの行は、folio2 の側の判断の記録（folio2 の repo の 32 番）で folio の索引の節点になり、第 13 波 d の設計ノートの行で地図に載った。
  folio の索引は、行の欄 req と depends を辺の型 req（行 → 要件）と depends（行 → 先に要る行）としても出す（main の写しの実測で req 327 本・depends 94 本）。中核はこの 2 型を契約の辺の型に持たないので組まずに数え、地図と近傍で行が要件にも他の行にもつながらない。
  2 型を組むと、ADR-7 の決定 (2) の「設計文書の 17 型」と閉じた 30 の字と合わなくなる。席はこの字を改めてよいかを問い t3-hub.65 で持ち主に出し、持ち主は同じ日に推奨の案 A を選んだ。
decision: |
  (1) 導出グラフの辺の型に、設計ノートの行の 2 型 req（行 → 要件）と depends（行 → 先に要る行）を足す。閉じた一覧は、設計文書の 17 型・設計ノートの行の 2 型・台帳の 4 型・結びの 6 型・走行の 3 型の 32 型になる。
  (2) 2 型の出所は folio の索引の辺の行で、tsuzuri は設計文書の YAML を走査しない。型の順は索引の辺の型の一覧の順にそろえる。
  (3) 判断の記録 ADR-7 の決定 (2) の辺の字は、この記録の決定 (1) で読み替える（ADR-7 の本文は書き替えない）。設計ノート surface の 18 節の辺の型の一覧に 2 型の行を足す。
options:
  - id: a
    name: 2 型を足して 32 型にする
    text: 決定 (1) から (3)。
    verdict: adopted
    reason: 行を節点に載せても線が無いと、その行がどの要件のためのものか、どの行の後に流すのかが地図で追えない。索引に既に在る辺を写すだけで足りる。持ち主は推奨の案 A を選んだ（t3-hub.65）。
  - id: b
    name: 字を改めず、設計ノートの行を線の無い節点のままにする
    text: ADR-7 の決定 (2) の閉じた 30 を保ち、設計ノートの行の辺を組む計画の行を外す。
    verdict: rejected
    reason: 行が要件にも他の行にもつながらず、地図で追えない。持ち主は案 A を選んだ（t3-hub.65）。
basis: [P-7, ADR-7]
retreat:
  kind: measure
  condition: 地図の圧縮の面で 2 型の線が 40 の上限の中の見える箱を増やして読みにくくなったと持ち主か席が数えたら、線の出し方（既定で隠すか）を問い直す。数えるのは tsuzuri の設計の席。
plain: |
  地図に載っている設計ノートの行（契約の 1 行 1 行）から、その行が拠る要件への線と、先に要る行への線を引きます。
  地図の土台を決めた記録（ADR-7）は線の種類を「設計文書の 17 型」と数で書いていたので、この記録で 2 型を足します。ADR-7 の本文はそのまま残し、この記録で読み替えます。
  この記録はあなたの承認で発効しています。承認の記帳先は tsuzuri の台帳です。
approval:
  who: 持ち主
  date: 2026-09-28
  ruling: t3-hub.65（裁定 id = t3-hub.65:20260928T1228Z-1）・board の質問の頁・notes に逐語
  verbatim: 推奨で進めて
  surface: R-8
note: 設計ノート surface-wave14d の辺の行（便 t3-hub.52.94）がこの記録の決定 (1) と (2) を実装する。要件書は型の数を書かないので直さない。
