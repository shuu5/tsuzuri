consequences:
  - "この判断で良くなること 3 つと、 代わりに引き受けること 3 つです。 良くなるのは、 裏の subagent が猶予の間に終われ席は合図で新しい subagent を起こすのを止められること、 限度を越えた口座で動き続ける時間は猶予が上限で打刻を失った席も猶予の後に必ず /exit が届くこと、 合図の字面・猶予の判定・記録の書き手が 1 関数ずつで見回りと群の段が同じものを使うことです。 引き受けるのは、 猶予の間は限度を越えた口座で席が動き続けること (file 1 つと行 1 本が増える)、 席の作法は案内で器が強制できないこと、 合図の送達が断られた周は次の周に送り直すので届くのが数周遅れうることです。"
  - "良い結果: 群が移った周に席が裏で走らせる subagent は猶予の間に終われ、 席は合図で新しい subagent を起こすのを止められる"
  - "良い結果: 限度を越えた口座で席が動き続ける時間は猶予の値が上限で、 打刻を失った席も猶予の後に必ず /exit が届く"
  - "良い結果: 合図の字面・猶予の判定・記録の書き手が 1 関数ずつで、 管理 tick と群の段が同じ合図と同じ記録を使う"
  - "代償: 猶予の間 (既定 30 分) は限度を越えた口座で席が動き続ける。 席の状態の dir に file が 1 つ、 rules 行が 1 本増える"
  - "代償: 席の作法 (合図を受けたら新しい subagent を起こさない) は案内で、 器は強制できない。 従わない席は猶予の後の /exit で今と同じ害を受ける"
  - "代償: 合図の送達が入力欄の門で断られた周は次の周に送り直すので、 合図が席に届くのは最大で数周遅れる"
note: |
