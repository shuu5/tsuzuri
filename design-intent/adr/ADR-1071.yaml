  器の案の章の要約: 候補を 5 つ並べます。 合図が先・/exit は猶予の後・合図は席ごとの記録 1 つで移動につき 1 回とする案 (選んだ案)、 席が「作業中」の札を自分で書き見回りが待つ案、 器を変えず subagent の出力を file に落とす案、 見回りが subagent の有無を process の木で読む案、 猶予を群の段の起動の待ちの窓で持つ案です。 選ばなかった 4 つは、 自己申告の穴・損失が毎回・見えない・意味が別、 という理由で退けました。
  器の専門語の説明: 本文に出てくる専門語 9 個を、 やさしい言葉で説明します。
  ・退避の猶予（move grace）: 群が別の口座へ移った周から、 器が古い席へ /exit を送るまでの待ち。 rules 行 seat.move_grace_s (整数の秒・既定 1800) が持ち、 起点は群の記録の時刻。 0 は待たない。
  ・退避の合図（evacuation notice）: 群が別の口座へ移った周に古い席の入力欄へ注入する 1 行。 新しい subagent を起こさず今の作業に区切りをつけ作業記憶を残すよう案内し、 残りの秒を載せる。 字面は 1 関数で、 群の段と管理 tick が同じものを送る。
  ・合図の記録（notice mark）: 席の状態の dir に置く 1 行の file (群の記録の時刻)。 同じ時刻の記録が在れば管理 tick は合図を送り直さない。 書き手は 1 関数で、 群の段と管理 tick が書く。
  ・群の記録（group record）: host の群用 dir に群ごとに高々 1 つ置く file (口座・時刻・理由・前の口座)。 移動の周に器が書く。 本 ADR はその時刻を猶予の起点にする。
  ・移動の門（move gate）: 管理 tick の判定の列のうち、 群の記録の口座と自席の登録 row の口座が違う周に自席へ退避か起こし直しを撃つ段 (ADR-1066)。 本 ADR で退避は合図 → 待つ → /exit の 3 分岐になる。
  ・続きの周（continuation round）: 群の段 (便の終端の周) が、 移った後に shell へ戻らない席を見る周。 これまで /exit を 1 回送っていたが、 本 ADR で猶予の内側の周は送らない。
  ・管理 tick（management tick）: 席の外から周期 (rules 行 1 本・既定 15 秒) で回り、 死んだ席を起こし直し、 移動の周に退避を撃ち、 黙った席へ合図を送り、 群の移動の判定を撃つ仕組み (ADR-1058・ADR-1066)。
  ・subagent（subagent）: 席 (claude) が Agent tool で起こす下請けの agent。 background で走り、 席の turn は完了を待たずに終わる。 claude の process の内側で走るので process の木には現れない。
  ・手の語（move word）: 管理 tick の判定行の move= に載る閉じた語 (launch / exit / enter)。 本 ADR で signal / wait を末尾に足す。
