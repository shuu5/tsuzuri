# 判断の記録 ADR-50 — 器の binary を便ごとに留め、走る便は最後まで同じ版で走らせ、入れ替えの門は留めた便を数えない（持ち主の裁定 2026-10-04・記帳先 = tsuzuri の台帳の問い t3-hub.74.50.2.1 の notes）
# 起草は係 w161a（2026-10-05）。材料は係 w149a の起草（drafts/w149a/w/notes.md の 4 節・rows_w149a.py の行 v-pin と v-pin-swap・questions.md の Q1）と器の memo t3-hub.74.50.2。承認の欄は問い t3-hub.74.50.2.1 の裁定。
id: ADR-50
title: 器の binary は便の受付で便ごとに留め（hard link で中身は写さない）、同じ便の実装の AI・審査役・着地の後の検出・起こし直しは留めた版で撃ち、入れ替えの門は留めた便の process を数えず、器をいつでも入れ替えられる形にする
status: accepted
date: 2026-10-04
context: |
  器の口（vessel update）の入れ替えの門（行 v-swap・ノート surface-wave27a）は、host のどこかで器の process が生きている周の入れ替えを断る。1 本の便の中で器の版が混ざる危うさを防ぐためである。そのため器の直しが着地しても、走っている便が 1 本でも在る間は入れ替えられず、直しが効くまで待つ。2026-10-04 は 70 分待ち、その間は席が新しい便を止めた。器の直しの便は 1 日に数本着地し、そのたびに列が止まるか、直しが効かないまま次の便が審査される。
  器の置き場の面（event log ほか）は、版をまたいで読み書きする形で決めてある（ADR-1004）。器の binary は約 8.4 メガバイト（MB）で、install の置き場と器の置き場は同じ file system に在る。
  器は環境の値も自分の実行 file の在りかも読まない決まりなので、自分の実行 file は install の記録（ADR-1028）の path と版の表示の照らしで知る。
  問い（t3-hub.74.50.2.1）は案 A に裁定された（裁定 id は承認の欄）。問いは、入れ替えの門の安全の考え方を替えるので、席が判断の記録を起こすとした。
decision: |
  (1) 留め。器は便の受付の後、最後に入れた器の binary（install の記録の path の file で、版の表示が自分と同じ物）を、便の作業の dir の下に hard link で置く。中身は写さない（記憶の装置（SSD）の書きは 0）。照らしが合わない周は留めを置かず、その便は留めの無い便として扱う。
  (2) 撃つ版。同じ便の実装の AI と審査役の命令（最初の語が器の名の時）・着地の後の検出の子・便の起こし直しは、留めた binary を撃つ。列の新しい便の起こしは、いつも PATH の器で撃つ（留めた便の起こし直しの driver が、古い版で新しい便を起こさない）。
  (3) 入れ替えの門。入れ替えの門は、host の器の process を、留めた便の物・留めの無い便の物・解けない物の 3 つに分け、留めた便の物だけの周は断らない。留めの無い便の物と解けない物は今までどおり数えて断る（測れない物を 0 本と読まない・条 P-7）。
  (4) 版の並び。同じ時に古い版の便と新しい版の便が並ぶ。置き場の面は版をまたいで読み書きする形（ADR-1004）のままとし、1 本の便の中では版を混ぜない（今の門が防いでいる危うさを、留めが同じだけ防ぐ）。
  (5) 片付け。live でない便の留めは、器の掃除が今の掃除の決まり（条 N-1）の内で片付け、古い世代の中身を溜めない。
  (6) 行と順。留めの行（v-pin）を先に、門の行（v-pin-swap）を後に流す。門の行の着地と 1 度の入れ替えの後は、留めの行の前に起きた便が残る間だけ待つ。終端の周の軸の自動の入れ替えを live の周に広げることは、この記録の外とする（組みの置き場が要り、SSD の書きに響く）。
options:
  - id: a
    name: 便ごとに留める
    text: 決定 (1) から (6)。
    verdict: adopted
    reason: 入れ替えの待ちが 0 になり、1 本の便の中で版が混ざる危うさは今の門と同じだけ防げる。hard link なので SSD の書きは増えない。ほかの project の席にも同じに効く。
  - id: b
    name: 器が新しい便を止めて自分で入れ替える
    text: 器が新しい便の起こしを止め、driver が 0 本になった時に自分で入れ替える。
    verdict: rejected
    reason: 席の手は要らないが、入れ替えの待ちと、待つ間の列の止まりは残る。
  - id: c
    name: 今のまま
    text: 席が新しい便を止め（hold）、走る便が終わるまで待って入れ替える。
    verdict: rejected
    reason: 器の直しの着地のたびに列が止まるか、直しが効かないまま次の便が審査される。
basis: [ADR-1004, ADR-1028, P-7, N-1]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、器の memo（t3-hub.74.50.2）か後継の memo の notes に 1 件ごとに記帳する。問う相手は持ち主。
    (1) 1 本の便の記録に器の版が 2 つ出たら（便ごとの版の記録の組みの commit が便の中で違ったら）、1 回でも留めの形を問い直す。
    (2) 古い版の便が新しい版の便の記録を読めずに止まったら（版をまたぐ読みの断り）、1 回でも版の並びを問い直す。
    (3) 2 つの行の着地の後の 2 週で、器の直しの着地から入れ替えまでの待ちが 30 分を越えた回が 2 回に達したら、門の数え方を問い直す。
plain: |
  作業の仕組み（器）の直しを、走っている作業を止めずに入れ替えられるようにする記録です。
  今は、作業が 1 本でも走っていると器を入れ替えられず、直しが効くまで待ちます（10 月 4 日は 70 分）。
  これからは、作業を始める時にその時の器を作業ごとに留めておき（中身は写さないので記憶の装置への書きは増えません）、その作業は最後まで同じ版で走ります。新しい作業は新しい器で始まり、器はいつでも入れ替えられます。
approval:
  who: 持ち主
  date: 2026-10-04
  ruling: t3-hub.74.50.2.1（裁定 id = t3-hub.74.50.2.1:20261004T2037Z-1・案 A・束 batch:20261004T2037Z-1・裁定面・notes に逐語）
  verbatim: "すべて推奨で承認する"
  surface: R-8
consequences:
  - 器の 2 行（留めの v-pin・門の v-pin-swap）を置く。起草は係 w149a（drafts/w149a/w/rows_w149a.py）で、試作はこれから。器を書く便は同時に 1 本までなので、鎖で 1 本ずつ流す。
  - 器の版の照らしは、器の芯の部品が自分の版の表示の 1 行目を組める形に寄せる要がある見込み（試作で確かめる）。
  - 実験場の版の選び（器の binary の環境の値で凍った器を撃つ形）は、install の記録の path と版が合わない周に留めを置かないので替わらない見込み。試作で確かめる。
note: 起草は係 w161a。待ちの分の数は器の memo（t3-hub.74.50.2）の notes と問いの本文による。
