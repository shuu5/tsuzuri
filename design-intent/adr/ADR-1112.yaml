  器の案の章の要約: 候補を 7 つ並べます。 管理 tick のついでに測って host 共有の置き場に記し、 doctor の行と席への 1 行で示す案 (選んだ案) と、 選ばなかった 6 つです。 選ばなかった案は、 drive 自身が数える書き込みの量 (SMART) を外部の道具で読む案・再起動を kernel の起動ごとの id (boot_id) で見分ける案・測るだけの専用の定期の仕組み (timer) を足す案・記録を器の出来事の記録 (event log) へ書く案・越えたことを席の入力欄へ差し込む案・越えた日に器が台帳へ memo を起こす案です。
  器の専門語の説明: 本文に出てくる専門語 13 個を、 やさしい言葉で説明します。
  ・書き込みの検出線（write detection line）: host の面が宣言した block 装置の 1 日の書き込みを比べる、 rules 行 4 本 (平均の線・1 日の線・窓の日数・持ち主の段の連続日数) の組 (本 ADR)。 検出線 (越えても止めない線) の 1 つで、 越えても作業は止めず、 器の記録と doctor の行と席の 1 行で示す。
  ・管理 tick（management tick）: 席ごとに systemd の user の timer が周期 (rules 行 seat.tick_interval_s) で撃つ器の 1 周 (SRS FR1027・ADR-1058)。 黙った席へ打刻の合図を送るかを判じる。 本 ADR は、 判定の後の返りを捨てる区画に書き込みの標本を足す。
  ・host の面（host face）: state dir の 1 file (host.toml) で、 host 固有の宣言値を持つ manifest の面 (ADR-1026)。 rules 行は置けない。 本 ADR は、 書き込みを測る装置の表 [[write-budget]] (名と stat file の path) を足す。
  ・host の根（host root）: state dir の親の下の host 用 dir で、 同じ host の全部の置き場が共有する (受付札と群の置き場が在る・ADR-1049)。 state の真実は置かない (C3)。 本 ADR は、 装置ごとの書き込みの記録をここに置く。
  ・block 装置（block device）: kernel が block 単位で読み書きする記憶装置 (NVMe の drive など)。 kernel は装置ごとに起動から書いた区の数 (512 byte 単位) を装置ごとの stat file の 7 列目に出し、 再起動で 0 に戻る。 本 ADR は host の面の表が名指す装置だけを測る。
  ・rules 行（rules row）: manifest に置く規則の値 1 行 (値・有効か無効か・裁定 id・裁定日)。 足すにも変えるにも裁定 id が要る (C5)。 本 ADR は書き込みの検出線の行を 4 本足す。
  ・裁定 id（ruling id）: user の裁定を一意に指す id。 本 ADR の値の裁定は時刻の形 user 2026-10-03T02:42Z で、 逐語は本 repo の外の台帳にだけ在る。
  ・doctor（doctor）: 全 host の版・口座・退役・rules 行を照らす 1 コマンド (C3.2)。 module ごとに key=値 の行を出し、 消費側の板は key の名で読む。 本 ADR は書き込みの行 write-budget: を足す。
  ・追加文脈（additional context）: 席の UserPromptSubmit の hook が、 turn の始めに席の AI へ添える文。 入力欄への差し込みとは別で、 群の逼迫の 1 行の前例が在る。 本 ADR は越えた周だけ装置ごとに 1 行を足す。
  ・持ち主の段（owner stage）: 書き込みの検出線を越えた閉じた日が、 rules 行が持つ日数 (値 3) 続いた状態 (本 ADR)。 doctor と席の行に owner=yes が載り、 持ち主向けの札は消費側の板が出す。
  ・消費側の板（consumer board）: 器を使う側が持ち主に見せる、 器の外の表示面。 器の doctor と tick status の行を key の名で読む前例を持つ。 本 ADR の owner=yes を読んで持ち主向けの札を出すのはこの板である。
  ・partial（partial day）: 再起動か長い標本の穴で一部の書き込みが欠けた日の値で、 実際の量の下限 (本 ADR)。 完全な測りの値 (measured) と語で分け、 下限の和だけで線を越えた日は越えと数える (C10)。
  ・unmeasured（unmeasured day）: 標本が 1 つも無かった日 (本 ADR)。 記録には written=- と書き、 0 と書かない (C10)。 窓にこの日を含む平均は値の在る日の和を窓の日数で割った下限 (窓の全日がこの日なら unmeasured) で、 越えの連続はこの日で止まる。
