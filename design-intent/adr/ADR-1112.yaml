  surface: R-8
consequences:
  - "この判断で良くなること 6 つと、 代わりに引き受けること 7 つです。 良くなるのは、 手の読みが doctor の 1 行に置き換わること、 越えた回に席へ 1 行が出て持ち主の段の印も載ること、 作業と既存の出力が変わらないこと、 測れない日と欠けた日を測った値と混ぜないこと、 値と装置が決まった置き場に在って新しい仕組みが増えないこと、 書き込みを減らす手の効きを同じ物差しで見られることです。 引き受けるのは、 持ち主へ直に届ける口が無いこと、 管理 tick の無い host では測れないこと、 日の境目の前後が少し隣の日へ寄ること、 再起動の日が欠けて下限の値になること、 host 共有の置き場に file が 2 つ増えること、 越えが続く間は席の turn ごとに 1 行が載ること、 線を越えても器は書き込みを減らさないことです。"
  - "良い結果: 装置ごとの 1 日の書き込み・窓の平均・続いた越えの日数が doctor の 1 行に出て、 持ち主と席が stat file を手で読んで割り算する使い捨ての読みを置き換える (C17.2 の消すもの)"
  - "良い結果: 越えた周は席の追加文脈に装置ごとの 1 行が出て、 黙った席も次の合図の turn で読める。 持ち主の段に届いた行は owner=yes を持ち、 消費側の板が key で読んで持ち主向けの札を出せる"
  - "良い結果: 作業は止まらない。 管理 tick・gate・着地・doctor の rc と既存の行の字は変わらず、 表の無い host では doctor の外形も 1 byte も変わらない"
  - "良い結果: 測れない日と欠けた日は unmeasured と partial (下限) で残り、 測った値と混ざらない (C10)。 下限の和だけで線を越えた日は越えとして立つので、 欠けが越えを隠さない"
  - "良い結果: 線の値は裁定つきの rules 行 4 本に在り (C1・C5)、 装置は host の面の値で、 code は host の値で分岐しない (C10.2・N3)。 新しい依存・timer・常駐の process・verb・差し込みの種類・台帳の書き口は増えない"
  - "良い結果: ADR-1111 (変異検査を 1 日 1 回に間引いた判断) のような書き込みを減らす手の効きを、 同じ物差しで日ごとに見られる"
  - "代償: 器から持ち主へ直に届ける口は無い。 持ち主は doctor の行か席の行か消費側の板の札を見るまで知らず、 板が key を読む形に合わせるまで持ち主向けの札は出ない"
  - "代償: 管理 tick の無い host と tick が止まっている間は測れず、 その日は partial か unmeasured になる (専用の timer を足さない代償)"
  - "代償: 日の境目は UTC の日付が変わった最初の標本で、 境目の前後の書き込みは最大で周期の 2 倍ぶん隣の日へ寄る"
  - "代償: 再起動の日は停止の前の最後の標本の後の書き込みが欠けて partial (下限) になる。 再起動の後の最初の読みが前の boot の最後の読み以上だと減りで見分けられず、 前の読みの分だけ少なく数える (前の boot がごく短いときだけ・boot_id を読まない代償)"
  - "代償: host の根に装置ごとの on-disk の file が 2 つ増え、 schema=1 の跨版の形を持つ。 装置を替えた周は stat-mismatch の間は数が動かず、 人が装置の dir を退避する (N1.2)"
  - "代償: 越えが続く間は、 席の turn ごとに装置ごとの 1 行 (約 40 token) が追加文脈に載る"
  - "代償: 器は線を越えても書き込みを減らさない。 減らす手 (変異検査の回数・一時の木の置き場など) は別の判断で、 本 ADR は効きを測る物差しだけを足す"
