# 判断の記録 ADR-1112 — 器 scribe2 の判断の記録 ADR-0112 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1112
title: "書き込みの検出線 — 器は host の面が宣言した block 装置の 1 日の書き込みを管理 tick の周で測って host の根に記し、 書き込みの検出線 (7 日平均・1 日・持ち主の段の連続日数) と比べて doctor の行と席の 1 行で示し、 作業は止めない"
status: accepted
date: 2026-10-03
context: |
  host の NVMe の書き込みは起動からの累計の実測で 1 日約 4.9 TB に達し、 今の速さのままなら記憶装置の寿命は約 230 日と推される。 器にはこの量を測って知らせる口が無く、 持ち主と席は手で読んで割り算している。 本 ADR は持ち主の値の裁定 (裁定 id user 2026-10-03T02:42Z) に沿い、 器が管理 tick の周に相乗りして装置ごとの 1 日の書き込みを host の根に記し、 7 日平均・1 日・続いた日数の線と比べて doctor の行と席の 1 行で示すと決める。 測れない日と欠けた日は 0 と書かず、 作業は止めない。 SRS では FR1113 (書き込みの検出線) と AC1090 がこの約束を持つ。
  なぜこの判断が要るのかを 5 つで示します。 host の記憶装置の書き込みの実測と寿命の見込み、 持ち主の値の裁定、 器に在るものと無いもの、 要件書に合う要件が無いこと、 憲法の向きとこの記録が動かす範囲です。
  CTX1 実測 — host の NVMe の書き込みは 1 日約 4.9 TB で、 今の速さなら寿命は約 230 日と推す
  host には NVMe の drive が 2 台在り、 書き込みの多い 1 台は起動からの累計 (kernel が装置ごとに出す書いた区の数) で約 8.2 日に約 39.7 TB、 1 日の平均で約 4.9 TB だった (2026-10-03 の実測)。 もう 1 台は約 0.2 TB だった。 drive の定格の書き込み量 (TBW) の見込みと照らすと、 今の速さのままなら残りの寿命は約 230 日と推す (推定で、 実測ではない)。 ADR-1111 は変異検査 (検出線) を着地ごとから 1 日 1 回に間引いたが、 書き込みのうちどれだけがどの仕事から来るかは分けて示しておらず、 間引いた効きを日ごとに測る物差しも器に無い。
  CTX2 裁定 — 7 日の平均で 1 日 1.5 TB 以下・1 日 3 TB を越えた日も知らせる・持ち主へは 3 日続けて越えた時だけ・作業は止めない
  持ち主は 2026-10-03T02:42Z に host の書き込みの値を裁定した (裁定 id（持ち主の決定を指す印） user 2026-10-03T02:42Z・裁定日 2026-10-03)。 要旨は 4 点 — 7 日の平均で 1 日 1.5 TB 以下を線にする・1 日に 3 TB を越えた日も知らせる・持ち主へ知らせるのは 3 日続けて越えた時だけ・越えても作業は止めない。 逐語は本 repo の外の台帳にだけ在り、 本 file には写さない。 器の仕組みを置くこと・測り方・示す口・3 日続けての数え方・装置が複数ある host の扱いは、 持ち主の常設の裁定 (決めてほしいことは推奨で進める) の下で orchestrator が推奨を採った。
  CTX3 現物 — 器に書き込みを測る口は無く、 使い回せる周・置き場・口は在る
  器には block 装置（記憶装置）の書き込みを読む code が無く、 持ち主と席は装置の stat file を手で読んで割り算している。 使い回せるものは在る。 管理 tick（席を見回る定期の周） は席ごとに rules 行（裁定つきの規則の行） seat.tick_interval_s (15 秒) の周で撃たれ、 判定の後に返りを捨てる区画を持つ (ADR-1108 の全部の書き直しも同じ区画)。 host の根（host 共有の置き場）は state dir の親の下で置き場を跨いで 1 つで、 管理 tick が群の判定を host の lock の内で撃つ前例を持つ (ADR-1066)。 fleet の store の lock は pid と起動時刻で死んだ lock を回収する。 host の面（host 固有の宣言）は tick の宣言の表 [[tick]] と端末の表 [[device]] (ADR-1076) を持ち、 rules 行は置けない。 doctor（器の状態を照らす口） は module ごとに 1 行を足す形で、 消費側の板（器の外の表示の画面） (器の外の表示面) は doctor と tick status の行を key の名で読む前例を持つ。 席の hook は UserPromptSubmit の追加文脈（AI への添え書き）に群の逼迫の 1 行を出す前例を持つ。 入力欄への差し込みは SRS FR1044 が閉じた列で、 器が持ち主へ直に届ける口は無く、 器が台帳に issue を起こすのは初期化の 1 か所だけである。
  CTX4 SRS — 既存の要件は host の装置の書き込みを測らない
  SRS の FR1027 (管理 tick) の仕事の列に書き込みの標本は無く、 NFR1006 (host の資源) は封じ込めの外の子 process と検証の行の並列度の約束で、 書き込みの量は測らない。 FR1044 (差し込みの閉じた列) は動かさない。 器が host の装置の書き込みを測って示す要件は、 新しい FR1113 (書き込みの検出線（書き込み量を比べる線）) と AC1090 が持つ。
  CTX5 憲法の向きと本 ADR の射程
  C1 は規則の値を manifest の rules 行に持つことを求めるので、 線の値 2 つだけでなく窓の 7 日と持ち主の段（持ち主に知らせる段）の 3 日も rules 行にする。 C5 は rules 行を裁定 id なしに足すことを断る。 C3 は host ごとの dir に状態の真実を置かないことを求める。 本 ADR の記録は装置の累計 (真実は kernel の数) から取った出所つきの実測で、 host・口座・席・lease・退役の状態を持たず、 消えても判定は測っていない側に倒れるだけなので、 host の根に置く (群の今の口座を同じ根に実効の記録として置いた ADR-1049 の前例)。 C10 は宣言値と出所つきの実測を型で分けるので、 測れない日と再起動で欠けた日を 0 や完全な値と書かない。 C10.2 と N3 は host 固有の値を manifest にだけ置き code が分岐しないことを求めるので、 装置は host の面の値にし、 code は装置の名から path を組まない。 C15 は台帳を task と裁定だけに使う。 C17.2 は足す前に消すものを名指すことを求め、 本 ADR が消すのは手で撃つ使い捨ての読みである。 本 ADR は ADR を書く条件のうち 1 (C3 と C10 の読み)・3 (記録の on-disk の形と host の面の表と rules 行)・4 (却下案を残す価値のある分岐) に当たる。
  （選択肢を測るものさし）この判断を評価する 5 本のものさしです。 書き込みが線を越えた日と続いた日数を手の読みに頼らずに知ること。 越えても作業を止めないこと。 測っていないものを測ったと数えないこと。 新しい依存・定期の仕組み・常駐の process・入口・差し込みの種類・台帳の書き口を増やさないこと。 線の値と装置を決まった置き場に置き、 code が host ごとの値で分かれないことです。
  DR1｜兆しを早く見せる — 書き込みが線を越えた日と続いた日数を、 持ち主と席が手の読みに頼らずに知る CTX1・CTX2
  DR2｜作業を止めない — 越えても管理 tick・gate・着地の rc と字を変えない (裁定の 4 点目) CTX2
  DR3｜測っていないものを測ったと数えない — 測れない日と欠けた日を 0 や完全な値と書かない (C10) CTX5
  DR4｜増やさない — 新しい依存・timer・常駐の process・verb・差し込みの種類・台帳の書き口を足さず、 在る周と面を使い回す (C17・A3・FR1044) CTX3・CTX4
  DR5｜値の置き場を守る — 線の値は裁定つきの rules 行に、 装置は host の面に置き、 code は host の値で分岐しない (C1・C5・C10.2・N3) CTX5
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 host ごとの宣言の file に、 測る記憶装置の名と、 kernel が書いた量を出す file の場所を 1 行ずつ書きます。 器は管理 tick の周のついでにその file を読み、 host 共有の置き場の記録を、 鍵を握って 1 回だけ進めます。 線は規則の行 4 本 (平均の線・1 日の線・窓の 7 日・持ち主へ知らせる 3 日) で、 越えたかの判定は 1 本の関数が持ち、 doctor の行と席への 1 行がそれを呼びます。 照会する要件は 4 つで、 書き込みの検出線の要件 (FR1113) と管理 tick の要件 (FR1027) はこの記録が支える側、 差し込みの閉じた列 (FR1044) と hook の予算 (NFR1005) は今の約束をそのまま保つ側です。
  採用 — OPT1
  器 SHALL host の面 (host.toml) の新しい表 [[write-budget]] (0〜n 行・key は name〔1 語・面で一意〕と stat〔block 装置の stat file の絶対 path・形は /sys/block/<device>/stat〕・host の面にだけ置け、 tracked の面の表と形の誤りは行番号つきで断る) が名指す装置ごとに、 UTC の 1 日の書き込みを測る。 表の無い host では何も読まず書かない。 測る周 SHALL 管理 tick の周への相乗り (判定の後の返りを捨てる区画) とし、 host の根で fleet の store の lock の内で 1 回だけ記録を進め (rules 行 seat.tick_interval_s の間隔の内の周は、 記録の日が今と同じ UTC 日のときだけ lock を取らずに抜け、 日付が進んだ周は間隔の内でも日を閉じる)、 新しい timer・常駐の process・verb を足さない。 記録 SHALL host の根の write-budget/<name>/ の 2 file (今日の 1 行と、 閉じた日の追記の log・どちらも schema=1) とし、 書き込みは stat file の 7 列目 (書いた区の数・512 byte 単位) の差から取る。 累計が減った周 (再起動) を含む日・周期の 2 倍を越えて標本が空いたまま日付が進んだ境目の前後の日・記録の無い周に開いた日は partial (下限)、 標本の無い日は written=- (unmeasured) と書き、 どちらも 0 と書かない。 面の stat が記録の stat と違う周は数を動かさず probe=stat-mismatch を書く。 rules 行 SHALL 4 本 — host.write_avg_gb (1500)・host.write_day_gb (3000)・host.write_avg_days (7)・host.write_owner_days (3)・単位は 10^9 byte と日・裁定 id user 2026-10-03T02:42Z (行ごとに項の語で分ける)・裁定日 2026-10-03。 判定 SHALL 1 本の関数とし、 閉じた日の越えを「その日が 1 日の線を越えた、 またはその日で終わる窓の 1 日平均が平均の線を越えた」とし、 昨日から遡って続く越えの日数 (越えない日と値の無い日で止まり、 欠けた日は下限の値で判じる) が host.write_owner_days 以上なら持ち主の段とし、 装置ごとに独立に判じて和を取らない。 下限の値だけで線を越えた日は越えと数える。 doctor SHALL 表の行ごとに 1 行 write-budget: を出し、 key は name・today・yesterday・avg・days・over・streak・owner・cap・sampled・probe で、 持ち主の段の行は owner=yes を持つ (持ち主向けの札は消費側の板が key で読んで出す)。 席の hook SHALL UserPromptSubmit の追加文脈に、 over が - でない周だけ装置ごとに 1 行を出す。 本 ADR SHALL NOT 作業を止めない — 管理 tick・gate・着地・doctor の rc と既存の行の字を変えず、 入力欄に差し込まず (FR1044 の列は不変)、 台帳に memo を起こさず、 持ち主へ直に届ける口を足さず、 code は装置の名から path を組まず host の値で分岐しない (N3)。
  （平易）host ごとの宣言の file (host.toml) に、 新しい表 [[write-budget]] を足します。 1 行が記憶装置 1 つで、 名 (name) と、 kernel が書いた量を出す file の場所 (stat・/sys/block/<device>/stat の形の絶対 path) を書きます。 表は host ごとの宣言の file にだけ置け、 形の誤りは行番号つきで断ります。 表の無い host では器は何も読まず書きません。 器は管理 tick の周の判定の後のついでにこの file を読み、 host 共有の置き場の記録を、 鍵 (fleet の store の lock) を握った内で 1 回だけ進めます。 同じ日のうち間隔の内の回は鍵を取らずに抜け、 日付が変わった回は間隔の内でも日を閉じるので、 置き場ごとの管理 tick が同じ読みを重ねません。 記録は host 共有の置き場の write-budget/<name>/ の file 2 つ (今日の 1 行と、 閉じた日の追記の log・どちらも schema=1) で、 書き込みは file の 7 列目 (書いた区の数・512 byte 単位) の差から取ります。 再起動で累計が減った日・読みが周期の 2 倍を越えて空いたまま日付が変わった境目の前後の日・記録の無いところから始めた日は下限の値と書き、 1 回も読めなかった日は written=- と書いて、 どちらも 0 とは書きません。 宣言の file の場所が記録の場所と違う回は数を動かさず、 違いを probe=stat-mismatch と書きます。 線は規則の行 4 本 (平均の線 1,500 GB・1 日の線 3,000 GB・窓の 7 日・持ち主へ知らせる 3 日・持ち主の裁定 id つき) です。 越えたかの判定は 1 本の関数が持ち、 閉じた日が 1 日の線を越えたか、 その日で終わる 7 日の平均が平均の線を越えたら、 その日を越えた日と数えます。 昨日から遡って越えた日が 3 日続いたら持ち主の段とし、 越えていない日と値の無い日 (測れない日) で数えを止めます。 欠けた日は下限の値で越えたかを判じます。 装置が複数あれば装置ごとに別々に判じ、 足し合わせません。 下限の値だけで線を越えた日も越えと数えます。 doctor は表の行ごとに 1 行 write-budget: を出し (key は name・today・yesterday・avg・days・over・streak・owner・cap・sampled・probe)、 持ち主の段の行は owner=yes を持ちます。 持ち主向けの札は器の外の表示の画面がこの key を読んで出します。 席の hook は、 越えた回だけ装置ごとに 1 行を席の AI への添え書きに出します。 作業は止めません。 管理 tick・gate・着地・doctor の戻り値と既存の行の字は変えず、 入力欄に差し込まず、 台帳に memo を起こさず、 持ち主へ直に届ける口を足さず、 code は装置の名から場所を組み立てず host ごとの値で分かれません。
  （理由）管理 tick に相乗りするのは、 席ごとに 15 秒の周が既に在り、 判定の後に返りを捨てる区画と、 host 共有の置き場で鍵を握って 1 回だけ撃つ前例が揃っているからで、 新しい定期の仕組みや常駐の process を足さずに済みます。 測る元を kernel の累計にするのは、 標準の file を読むだけで依存も管理者の権限も要らないからで、 drive 自身の数え (SMART) は外部の道具と権限が要り、 依存を足すことに当たります。 装置を host ごとの宣言の file に書くのは、 host 固有の値を宣言の file にだけ置き code が host の値で分かれないという憲法 C10.2 と N3 に従うためで、 場所を書けば歯 (test) は一時の file を指せます。 記録を host 共有の置き場に置くのは、 装置が host に 1 つで置き場ごとに割れないためです。 記録は装置の累計から取った出所つきの実測で、 消えても判定が測っていない側に倒れるだけなので、 host ごとの dir に状態の真実を置かないという憲法 C3 に触れません。 測れない日と欠けた日を 0 と書かずに別の語で残すのは、 測っていない 0 を測った 0 に混ぜないという C10 の線を保つためで、 下限の値だけで越えた日を越えと数えるので、 欠けが越えを隠しません。 線の値・窓の日数・続いた日数を規則の行にするのは、 規則の値を 1 つの置き場に裁定 id つきで持つという C1 と C5 に従うためです。 知らせを doctor の行と席への添え書きに置くのは、 持ち主と席と器の外の表示の画面が既に読む面だからです。 入力欄への差し込みは要件書が閉じた列に新しい種類を足すことになり、 台帳の memo は台帳を task と裁定だけに使う C15 に触れます。 足す代わりに消すのは、 持ち主と席が手で撃つ使い捨ての読みです (C17.2)。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1113（claim）: FR1113 (書き込みの検出線) の側。 本 ADR は、 host の面の表が名指す block 装置ごとに UTC の 1 日の書き込みを host の根に記し、 rules 行 4 本の線と比べて doctor の行と席の追加文脈の 1 行で示し、 測れない日と欠けた日を 0 と書かず、 作業を止めないと主張する。 受け入れの基準は AC1090 が持つ。
  FR1027（claim）: FR1027 (管理 tick) の周の側。 本 ADR は、 管理 tick の周が判定の後の区画で書き込みの記録を lock の内で 1 回だけ進める契機を兼ねると主張する。 FR1027 の判定の列・合図の条件と順・tick の rc と字は書き込みの記録の成否に依らない。
  FR1044（rationale）: FR1044 (差し込みの閉じた列) を変えない。 席への 1 行は UserPromptSubmit の hook の追加文脈で、 入力欄への差し込みではない (群の逼迫の 1 行と同じ口)。 越えたことを入力欄へ差し込む案は、 この閉じた列に新しい種類を足すことになるので退けた。
  NFR1005（rationale）: NFR1005 (hook の予算) を保つ。 席の hook が足す読みは host の面と装置ごとの小さい file 2 つだけで、 子 process も git も撃たず、 重い I/O を足さない。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録はどの ADR も置き換えません。 管理 tick に仕事を 1 つ足し、 host ごとの宣言の file に表を 1 つ、 host 共有の置き場に dir を 1 つ足すだけで、 管理 tick の判定・既存の表・群の記録・1 日 1 回の変異検査 (ADR-1111) は変えません。 原則は、 止めない兆しは既に在る周で測って人と席が既に読む面の語で示し、 新しい依存・周期・届け口は足さず、 測れなかった分は測れなかったと書く、 です。
  改訂状態: current
  置き換える ADR: なし (新規)
  置き換えられた: なし (現行)
  supersede は無い。 本 ADR は管理 tick の周に仕事を 1 つ足すが、 ADR-1058 の判定の列・合図の条件と順・tick の rc と字は変えない。 ADR-1026 と ADR-1064 と ADR-1076 の host の面には表を 1 つ足すだけで、 既存の表 ([[tick]]・[[device]]) の欄と読みは変えない。 ADR-1049 の host の根には dir を 1 つ足すだけで、 群の記録と受付札は変えない。 ADR-1111 (日次の検出) は変異検査の回数を決めたもので、 本 ADR は書き込みを測って示すだけで回数も gate も変えない。
  照会終端 — PRIN-SHOW-NON-BLOCKING-WEAR-SIGNS-ON-EXISTING-FACES-AND-NAME-WHAT-WAS-NOT-MEASURED
  止めない兆しは、 既に在る周で測り、 人と席が既に読む面の語で示す。 新しい依存・周期・届け口は足さず、 測れなかった分は測れなかったと書く。
  本 ADR が drive の SMART の読み・boot_id の読み・専用の timer・event log への記録・入力欄への差し込み・台帳の memo を退け、 管理 tick に相乗りして host の根に記し doctor の行と席の追加文脈の 1 行で示す形を選んだのは、 この原則に行き着く (これ以上は遡らない照会終端)。
options:
  - id: "OPT1"
    name: "管理 tick に相乗りして装置の累計から 1 日の書き込みを host の根に記し、 書き込みの検出線と比べて doctor の行と席の追加文脈の 1 行で示す"
    text: |
      host の面の新しい表が名指す block 装置の stat file を、 管理 tick の判定の後の区画で読み、 host の根の記録を fleet の store の lock の内で 1 回だけ進める。 線は rules 行 4 本で、 判定の 1 本の関数を doctor と席の hook が呼ぶ。 決め手は在る周・置き場・面・口を使い回せることと、 測れない日を語で分けられること (CTX3・CTX5)。
      （平易）host ごとの宣言の file に書いた記憶装置ごとに、 kernel が出す書いた量の累計を管理 tick の周のついでに読み、 1 日 (UTC) の書き込みを host 共有の置き場に記します。 規則の行 4 本の線と比べ、 doctor の行と、 越えた回だけ席への 1 行で示します。 手の読みが要らなくなり、 黙った席も次の合図の turn で読め、 作業と既存の出力を変えず、 測れない日と欠けた日を別の語で残して下限の値だけで越えた日も越えと数え、 新しい依存や仕組みを足さず、 値と装置を決まった置き場に置く点で勝ります。 代わりに、 管理 tick の無い host や tick が止まった間は測れないこと、 持ち主へ直に届ける口が無く持ち主向けの札は器の外の表示の画面を待つこと、 ごく短い起動の後の再起動は見分けられずその分を少なく数えること、 host 共有の置き場に版の違いをまたぐ形の file が 2 つ増えることを引き受けます。
      利点: 装置ごとの 1 日の書き込みと続いた越えの日数が doctor の 1 行に出て、 手の読みが要らなくなる (DR1)
      利点: 越えた周は席の追加文脈に 1 行が出て、 黙った席も次の合図の turn で読める (DR1)
      利点: 管理 tick・gate・着地・doctor の rc と既存の行の字を変えない (DR2)
      利点: 測れない日と欠けた日を unmeasured（測れなかった日） と partial（欠けを含む下限の値） で残し、 下限の和だけで越えた日は越えと数える (DR3)
      利点: 新しい依存・timer・常駐の process・verb・差し込みの種類・台帳の書き口を足さない (DR4)
      利点: 線の値は rules 行 4 本に、 装置は host の面に在り、 code は host の値で分岐しない (DR5)
      欠点: 管理 tick の無い host と tick が止まっている間は測れず、 その日は partial か unmeasured になる (DR1)
      欠点: 器から持ち主へ直に届ける口は無く、 持ち主向けの札は消費側の板が owner=yes を読んで出すまで出ない (DR1)
      欠点: 再起動の後の最初の読みが前の boot の最後の読み以上だと減りで見分けられず、 その分だけ少なく数える (DR3)
      欠点: host の根に装置ごとの file が 2 つ増え、 跨版の形 (schema=1) を持つ
    verdict: adopted
    reason: "決め手は在る周・置き場・面・口を使い回せることと、 測れない日を語で分けられること (CTX3・CTX5)。"
  - id: "OPT2"
    name: "drive の SMART の書いた量を読む"
    text: |
      NVMe の drive が自分で数える書いた量と摩耗の割合を、 外部の道具 (smartctl や nvme-cli) で読む。 決め手は依存と権限 (CTX3・CTX5)。
      （平易）NVMe の drive が自分で数えている書いた量と摩耗の割合 (SMART) を、 外部の道具で読む案です。 drive 自身の累計なので再起動を跨いでも欠けず、 寿命の割合も同じ読みで取れる点で勝ります。 けれども、 管理者の権限 (root) と外部の道具が要り、 依存する OSS を足すこと (持ち主の承認が要る A3) に当たります。 道具と drive の種類ごとに出力の形も違い、 読み手の形が増えます。
      利点: drive 自身の累計なので再起動を跨いでも欠けない (DR3)
      利点: 寿命の割合も同じ読みで取れる (DR1)
      欠点: root の権限と外部の道具が要り、 依存 OSS の追加 (A3) に当たる (DR4)
      欠点: 道具と drive の種類ごとに出力の形が違い、 読み手の形が増える (DR4)
    verdict: rejected
    reason: "決め手は依存と権限 (CTX3・CTX5)。"
  - id: "OPT3"
    name: "再起動を boot_id で見分ける"
    text: |
      標本ごとに kernel の boot_id を記し、 変わった周を再起動と見分ける。 決め手は読む path の数と得られる精度 (CTX3)。
      （平易）読みの 1 回ごとに kernel の起動ごとの id (boot_id) を記し、 変わった回を再起動と見分ける案です。 起動してすぐ再起動して累計の減りが見えない場合も見分けられる点で勝ります。 けれども、 読む場所と記録の欄がもう 1 つずつ増えるのに、 得られるのは 1 回の読みぶんの精度だけです。 止まる前の最後の読みの後に書いた分はどちらの案でも欠けるので、 再起動の日はどちらでも下限の値になります。
      利点: 前の boot がごく短く累計の減りが出ない再起動も見分けられる (DR3)
      欠点: 読む path がもう 1 つ増え、 記録の欄も増える (DR4)
      欠点: 得は 1 標本ぶんの精度だけで、 停止の前の最後の標本の後の書き込みはどちらでも欠け、 再起動の日はどちらでも partial になる (DR3)
    verdict: rejected
    reason: "決め手は読む path の数と得られる精度 (CTX3)。"
  - id: "OPT4"
    name: "書き込みを測る専用の timer unit を足す"
    text: |
      管理 tick と別に、 書き込みを測るだけの systemd の timer unit を host に足す。 決め手は unit の種類と口の数 (CTX3)。
      （平易）管理 tick と別に、 書き込みを測るだけの systemd の定期の仕組み (timer) を host に足す案です。 席の無い host でも測れ、 測る間隔を管理 tick と別に決められる点で勝ります。 けれども、 仕組みの種類が増え、 書く口・外す手・doctor の照らし合わせも増えます (憲法 C17 は、 足す前に既に在るもので足りるかを問うことを求めます)。 席ごとに 1 組と決めた管理 tick の仕組み (ADR-1030) とも別の形を持ちます。
      利点: 席の無い host でも測れる (DR1)
      利点: 測る周期を管理 tick と別に決められる
      欠点: unit の種類が増え、 書く口・撤去・doctor の照合も増える (C17) (DR4)
      欠点: 席ごとに 1 組の tick の unit (ADR-1030) と別の形を持つ (DR4)
    verdict: rejected
    reason: "決め手は unit の種類と口の数 (CTX3)。"
  - id: "OPT5"
    name: "標本と閉じた日を event log へ書く"
    text: |
      標本と閉じた日を、 置き場の event log に event として追記する。 決め手は置き場の数と量 (CTX3)。
      （平易）測った値と閉じた日を、 器の出来事の記録 (event log) に追記する案です。 今の追記の形と読み手を使え、 記録が憲法 C3 の言う 1 つの置き場に近い点で勝ります。 けれども、 出来事の記録は器の作業記録の置き場ごとに在るので、 host に 1 つの記憶装置の記録が置き場の数に割れます。 15 秒の周なら 1 日に約 5,760 行が足され、 記録が肥えて読む口が遅くなります。
      利点: 既存の追記の形と読み手を使える
      利点: 記録が C3 の言う 1 つの置き場に近い (DR3)
      欠点: event log は state dir ごとに在り、 host に 1 つの装置の記録が置き場の数に割れる (DR3)
      欠点: 15 秒の周なら 1 日約 5,760 行が足され、 event log が肥えて読む口が遅くなる (DR4)
    verdict: rejected
    reason: "決め手は置き場の数と量 (CTX3)。"
  - id: "OPT6"
    name: "越えたことを席の入力欄へ差し込んで知らせる"
    text: |
      越えた周に、 席の入力欄へ 1 行を差し込んで知らせる。 決め手は SRS FR1044 の閉じた列 (CTX3・CTX4)。
      （平易）越えた回に、 席の入力欄へ 1 行を差し込んで知らせる案です。 黙った席でも turn を起こして届き、 人の目に見える形で出る点で勝ります。 けれども、 入力欄への差し込みは要件書の FR1044 が種類を閉じた列で、 新しい種類を足すには要件書の改訂と ADR が要ります。 越えが続く間は差し込みが繰り返され、 席の作業の turn を使います。
      利点: 黙った席でも turn を起こして届く (DR1)
      利点: 対話面の席に人の目に見える形で出る (DR1)
      欠点: 入力欄への差し込みは FR1044 が閉じた列で、 新しい種類を足すには SRS の改訂と ADR が要る (DR4)
      欠点: 越えが続く間は差し込みが繰り返され、 席の作業の turn を使う (DR2)
    verdict: rejected
    reason: "決め手は SRS FR1044 の閉じた列 (CTX3・CTX4)。"
  - id: "OPT7"
    name: "越えた日に器が台帳へ memo を起こす"
    text: |
      持ち主の段に届いた日に、 器が台帳に memo を 1 件起こす。 決め手は C15 と台帳の書き口 (CTX3・CTX5)。
      （平易）持ち主へ知らせる段に届いた日に、 器が台帳 (beads) に memo を 1 件起こす案です。 持ち主と席が台帳で追え、 席が見落としても残る点で勝ります。 けれども、 台帳は task と裁定だけを持つと憲法 C15 が決めており、 測った記録は器の記録が持つものです。 器が台帳に issue を起こすのは初期化の 1 か所だけなので、 新しい書き口も要ります。
      利点: 持ち主と席が台帳で追え、 席が見落としても残る (DR1)
      欠点: 台帳は task と裁定だけを持ち (C15)、 実測の記録は器の記録が持つ (DR3)
      欠点: 器が台帳に issue を起こすのは初期化の 1 か所だけで、 新しい書き口が要る (DR4)
    verdict: rejected
    reason: "決め手は C15 と台帳の書き口 (CTX3・CTX5)。"
basis: [FR1027, FR1044, FR1113, NFR1005, NFR1006, AC1090, ADR-1026, ADR-1030, ADR-1049, ADR-1058, ADR-1064, ADR-1066, ADR-1076, ADR-1108, ADR-1111]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「席」は器が動かす開発の AI の session、 「管理 tick」は器が席を 15 秒ごとに見回る定期の周です。 host の NVMe の記憶装置は、 起動からの累計の実測で 1 日約 4.9 TB を書いており、 今の速さのままなら寿命は約 230 日と推されます。 けれども器にはこの量を測る仕組みが無く、 持ち主と席は手で読んで割り算しています。 この記録は持ち主の値の裁定に沿い、 器が管理 tick の周のついでに装置ごとの 1 日の書き込みを測って host 共有の置き場に記し、 7 日の平均 (1 日 1.5 TB)・1 日 (3 TB)・続いた日数 (3 日) の線と比べて、 器の状態を照らす口 (doctor) の 1 行と席への 1 行で示すと決めます。 測れなかった日と一部が欠けた日は 0 と書かず、 別の語で残します。 線を越えても作業は止めません。 要件書 (SRS) では、 書き込みの検出線の要件 (FR1113) と受け入れの基準 (AC1090) がこの約束を持ちます。
