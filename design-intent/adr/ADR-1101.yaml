  verbatim: "器の台帳 s2-07l.737.27 の notes に在る（この file に写さない）"
  surface: R-8
consequences:
  - "この判断で良くなること 4 つと、 代わりに引き受けること 5 つです。 良くなるのは、 量が上限に近く保たれること、 組み立て中の物を壊さないこと、 仕組みが増えず言語に依らないこと、 越えたままと測れない物が名指されることです。 引き受けるのは、 越えた周に 6 時間より新しい産物も消えうること、 掃除の時間が延びること、 上限が state dir ごとであること、 同じ file を 2 度数えうること、 知らせが席へ押し出されないことです。"
  - "良い結果: 写しの数に依らず、 起草の置き場の build と依存の置き場の合計が上限に近く保たれる (組み立て中の分を除く)"
  - "良い結果: 組み立て中の窓の内の置き場は消えないので、 走っている組み立てを壊さない"
  - "良い結果: 消す仕組みと lock は 1 つのままで、 測りは言語と道具に依らない (mtime と lstat だけ)"
  - "良い結果: 越えたままの周と測れない木は、 掃除の行と doctor の行で名指される"
  - "代償: 上限を越えた周には、 書きの線より新しくても窓の外の置き場が消え、 席が戻ると組み立てを作り直す。 席の指示文は量の線を告げない"
  - "代償: 終端の周ごとに候補の全部の entry を歩く時間が掃除に足される"
  - "代償: 上限は state dir ごとで、 同じ disk の state dir の数だけ量が積まれる"
  - "代償: hard link は entry ごとに数え、 使用量より大きく出る (消しは候補の外に出ない)"
  - "代償: 知らせは掃除の行と doctor の行だけで、 席へは押し出さない。 越えたままが続く周が見えたら、 管理 tick の合図に出すかを別に決める"
