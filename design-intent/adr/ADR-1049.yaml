  器の専門語の説明: 本文に出てくる専門語を、やさしい言葉で説明します。
  ・project の群（project group）: 席の口座を持つ単位。 名・置き場の列・候補の口座 label の順の列を host の面が宣言し、 群の中の席はどの置き場からでも同じ口座に居る。 置き場が project ごとに分かれていても同じ群に入れられる。
  ・群の今の口座（group effective account）: 器が host の根に書く実効値 (群ごとに高々 1 件)。 宣言の候補の列 (宣言値) とは file も型も別で、 記録が無い周は候補の先頭が種になる (憲法 C10)。
  ・便用の除外（run-purpose exclusion）: 便用の口座選定の候補から、 便の置き場の席の登録 row が持つ口座と、 宣言されたすべての群の候補の口座を外すこと。 次の選定から効き、 走行中の便は止めない。
  ・常設の承認（standing approval）: 憲法 A1 の「使う」に当たる操作のうち、 宣言そのものを user の承認と見なし、 以後の 1 回ごとは承認の event を記すだけで足りるとする形。
  ・機械の復帰（mechanical resumption）: 席を起こし直した周に、 台帳の行と git の現在地と圧縮の直前の 1 枠だけから直前の流れを組んで session の開始で出す道。 対話の記録は運ばない。
