retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  席（人と話す開発 session）がどの口座で立つかを、project 1 つずつでなく「project のかたまり（群）」ごとに決めます。どの project を同じかたまりにし、どの口座を候補にするかは、この machine に 1 つだけ在る宣言 file に書きます。いまそのかたまりがどの口座に居るかは、器が別の記録に書きます（人が書く宣言と、器が書く現状を分けます）。便（自動で走る実装の仕事）には、かたまりの候補になっている口座を 1 つも渡しません。口座が上限に近づいたら、かたまりごと別の口座へ移りますが、生きている対話を運ぶのではなく、新しい口座で新しい席を立てて、続きは器が台帳と git から組み直して渡します。移り先の候補が 1 つも無い回は、無理に移らず user に知らせます。
consequences:
  - "この判断で良くなることと、代わりに引き受けることです。複数の project の席が 1 つの口座にまとまって一斉に移れる一方、移るたびに対話の文脈は器が戻せるぶんだけになり、記録の置き場が 1 つ増え、便が使える口座はかたまりの候補のぶんだけ減ります。"
  - "良い結果: 複数の置き場の席が 1 つの口座にまとまり、 上限が来た周に群ごと一斉に移れる (要求 2 / 3)"
  - "良い結果: 席の口座と便の口座が host 全体で交わらない (要求 4 が 1 つの規則になる)"
  - "良い結果: 圧縮・移動・異常終了の 3 つが同じ 1 本の復帰を通る (実装が 1 本で済む)"
  - "良い結果: 段ごとに止められ、 最初の段は宣言と点検の行と除外だけで契機を持たない"
  - "代償: 移動のたびに、 対話の文脈は機械が戻せるぶんしか残らない (運ばないと決めた代償)"
  - "代償: host の根に実効の記録という置き場が 1 つ増える (宣言と分ける代償・状態の真実は台帳のまま)"
  - "代償: 便が使える口座が群の候補のぶんだけ減る (口座の総数が少ない host では便が待つ周が増えうる)"
  - "代償: 要件書の口座選定と席の起動の条文は「役割の口座」の語で書かれているので、 群の語へ改稿するまで要件文と決定の語が食い違う (改稿は spec の編集の口を通る user の手)"
