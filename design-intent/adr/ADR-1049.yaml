# 判断の記録 ADR-1049 — 器 scribe2 の判断の記録 ADR-0049 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1049
title: "席の口座を持つ単位は project の群で、群の宣言は host の面の 1 表・群の今の口座は host の根の記録 (役割 → 口座の ADR-1036 と役割の実効の記録の ADR-1041 を単位ごと置き換え・便用の選定は群の候補の口座を host 全体で外し・移動は新しい口座で新しい席を起こして機械の復帰に任せる・候補が無い周は移らず通知・初期化の口と鍵の欄は後続の ADR)"
status: proposed
date: 2026-09-20
context: |
  席の口座は project ごとの置き場に閉じていて、 複数の project の席を同じ口座にまとめる宣言も、 上限に当たった周にまとめて別の口座へ移す口も無い (実測 2026-09-19 = 席の口座が上限に当たり人が手で移した)。 本 ADR は口座を持つ単位を project の群に決め、 群の宣言と群の今の口座を host の面に置き、 便用の選定は群の候補の口座を host 全体で外し、 移動は新しい席を起こして機械の復帰に任せる形にする。 契機 (拍) と初期化の口と鍵の欄は本 ADR では決めない。
  なぜこの判断が要るのかを、実測と現物と user の要求から説明します。席の口座が上限に当たって人が手で移した回が実際に在り、いま器には「どの project をまとめて同じ口座に置くか」を書く場所も、まとめて移す口もありません。前に決めた「役割ごとに 1 口座」は、役割が 1 つになった時点で分け方として働かず、しかも code には 1 行も入っていません。
  CTX1 実測 — 席の口座が上限に当たり、 人が手で別の口座へ移した
  2026-09-19 に席の口座が窓の上限に当たり、 user が手で別の口座へ移した (経緯の逐語は台帳 s2-07l.491 の notes)。 席が自分で判断して進む度合いを上げるほど、 上限で黙って止まる席は増える。 いまの器には、 止まった席を別の口座で立て直す口はあっても、 止まる前に移す判断も、 複数の project の席をまとめて移す単位も無い。
  CTX2 現物 — 在るもの (口座の宣言・使用率の計測・閾値の行 1 本・便用の除外・口座を指定した起動)
  口座 label の宣言は host の面 (state dir の host の manifest 1 file) の口座の表が持ち、 tracked の面と同じ loader・同じ 3 値 (無い = 0 宣言 / 読めた / 在るのに読めない = typed に止まる)・同じ拒否の形 (未知 key・型違い・両面の重複を行番号付きで全件) で読む (ADR-1026 §2.1・SRS FR1057)。 口座ごとの窓の使用率は計測されて event log に残り、 session 用の閾値の rules 行が 1 本在る。 便用の口座選定は、 便の置き場 (anchor) の席の登録 row が持つ口座だけを候補から外す (置き場を共有する他の vessel の席の口座は候補に残す)。 席は口座を指定して起こせる。
  CTX3 現物 — 無いもの (群の宣言・群単位の移動・host 全体の除外)、 および ADR-1036 / ADR-1041 が code に 1 行も無いこと
  群の宣言・群単位の移動・移動の契機・host 全体での除外は、 どれも器に無い。 さらに ADR-1036 が決めた役割 → 口座の宣言 file と ADR-1041 が決めた役割の実効の記録は、 設計 doc と語彙には在るが code には 1 行も無い (実測 = その file 名は設計 doc にしか現れない)。 その 2 本が前提にしていた軸も残っていない — 席の役割は orchestrator の 1 つになり、 宣言と実効の記録を比べて席を移していた管理 tick は削除された (ADR-1045 §2 (2))。 つまり「役割ごとに 1 口座」は、 役割が 1 つになった時点で単位として働かない。
  CTX4 要求 — user の 4 点と、 全口座が等価に交換できること
  user の要求 (要旨・逐語は台帳 s2-07l.491 の notes) は 4 点である。 (1) 席の口座が上限に近づいたら自動で別の口座へ移す (2) 複数の project の席を同じ口座に置ける (3) project の群（同じ口座にまとめて置く project のかたまり）を作り、 群ごとに別の口座へまとめて置き、 上限が来たら群が一斉に同じ別の口座へ移る (4) 席の居る口座は便に使わない。 加えて、 全口座の設定は同一で等価に交換できることが前提である。 裁定は「実装の仕方は推奨の方法で」であり、 推奨は「移動 = 新しい口座で新しい席 + 機械の復帰」「段は宣言と点検 → 通知 → 自動の移動」であった。
  CTX5 重い所 — 生きた対話を別の口座へ運ぶこと
  要求 (1) の実装で唯一重いのは「生きた対話 session をそのまま別の口座へ移す」ことである。 対話の記録は口座ごとの置き場の下に在るので、 持ち越しには file の複写と起動行の再現が要る。 この host では全口座の置き場が 1 つの実体を共有しているため複写なしで持ち越せるが、 それは器の外の host の設定であって器が前提にできる形ではない (N3 = host 固有の値で分岐しない)。
  CTX6 憲法の向き
  C3 は状態の真実を 1 つの置き場に持ち host ごとの dir に真実を置かないことを、 C5 は rules 行の追加・変更に裁定 id を、 C10 は宣言値と実効値を型で分け昇格は測定を通すことを、 C10.3 は配線されていない設定を CI が拒むことを、 C17 は決定はしごと「足す前に消すものを名指す」ことを、 A1 は「使う」に当たる操作の承認を、 N3 は host 固有の値で分岐しないことを求める。 口座を消費する session を器が起こすことは A1 の「使う」に当たる。
  （選択肢を測るものさし）この判断を評価する 5 本のものさしです。口座を持つ分け方が 1 つに決まること、席の口座と便の口座が重ならないこと、移るのに生きた対話を運ばなくて済むこと、人が書く宣言と器が書く現状を分けて読み手の無い宣言を足さないこと、そして段階ごとに止められることです。
  DR1｜口座を持つ単位が 1 つに決まり、 同じ単位の席がどの置き場からでも同じ口座に揃う CTX4 の要求 (2) / (3)・CTX3 (役割は単位として働かない)
  DR2｜席の口座と便の口座が host 全体で交わらない CTX4 の要求 (4)・CTX2 (いまの除外は便の置き場の席だけ)
  DR3｜移動が「生きた対話の持ち越し」を要らない (復帰の道は 1 本) CTX5・憲法 N3・圧縮 / 移動 / 異常終了が同じ復帰を通る
  DR4｜宣言値と実効値を型と file で分け、 読み手の無い宣言を足さない 憲法 C10 / C10.3 / C17.2
  DR5｜段で止められる (宣言と点検 → 通知 → 自動の移動) CTX4 の裁定・DR4 (段ごとに読み手が揃う)
decision: |
  選んだ案と、それが要件書のどの要件を支えるかを示します。かたまりの宣言は machine ごとの宣言 file に 1 表として置き、いまの口座は別の記録が持ち、便の候補からはかたまりの候補口座を全部外し、移動は新しい席と器による続きの組み直しで行います。
  採用 — OPT1
  器 SHALL 席の口座を持つ単位を project の群 (名・置き場の列・候補の口座 label の順の列) とし、 群の宣言 SHALL host の面 (state dir の host の manifest 1 file) の表 1 つが持ち、 tracked の面には置けない (宣言は host に 1 か所・別の宣言 file を作らない)。 読み手 SHALL 既存の host の面の loader と同じ 3 値・同じ拒否の形をそのまま使い、 宣言 SHALL 宣言値のまま扱う。 器 SHALL 群の今の口座を実効値として host の根 (state dir の親の下の host 用 dir・受付札と同じ導き方・環境変数を読まない) の記録 1 件 (群ごとに高々 1 件) で持ち、 宣言とは file も型も分け (C10)、 記録が無い周 SHALL 宣言の候補の先頭を種とし、 記録が在るのに読めない周 SHALL typed に止まる。 便用の口座選定 SHALL 宣言のどの群の候補の口座も host 全体で候補から外し (次の選定から効き、 走行中の便は止めない)、 便の置き場の席の登録 row の除外 SHALL 残す。 便用の並べ順と 1 口座あたりの上限を置かないこと (ADR-1027 / ADR-1042) SHALL 変えない。 移動の判定 SHALL 群単位で host の lock の内側で 1 回だけ行い、 移り先 SHALL 他の群が使っていない ∧ 便が使っていない ∧ 閾値未満の候補の先頭とし、 候補が無い周 SHALL 移らず user へ通知する (妥協の移動を作らない)。 移動 SHALL 新しい口座で新しい席を起こすことで行い、 対話の記録 SHALL NOT 運び、 復帰 SHALL 機械の注入 (台帳の行・git の現在地・圧縮の直前の 1 枠) に任せる。 群の宣言 SHALL A1 の「使う」の常設の承認（1 回の承認で以後は都度聞かずに済む形）とし、 移動の周 SHALL 承認 event を 1 件記す。 段 SHALL 3 つ = 群の宣言と点検の 1 行と便用の除外 / 閾値越えの通知だけ / 自動の移動、 とし、 通知と移動の契機 SHALL 別の決定記録に委ね、 本 ADR SHALL NOT 契機を決める。 閾値 SHALL 5 時間窓 85 ・ 7 日窓 95 ・ モデル別窓 95 の rules 行とし (値と裁定 id は既に在る裁定の引き継ぎ・C5)、 行を足すのは通知の段の便とする。 器 SHALL NOT 本 ADR で導入の口・consumer の規則の写しの廃止・外部 API の鍵の欄を決める (後続の決定記録・C17 の 1 記録 1 決定)。
  （平易）席の口座を持つ分け方を「project のかたまり」にします。かたまりの名前・入る project の置き場・候補の口座の並びは、この machine に 1 つだけ在る宣言 file に表 1 つとして書き、読み方も断り方も既に在る読み手をそのまま使います。いまどの口座に居るかは、器が machine の共通の場所に別の記録として書きます（人が書く宣言と、器が書く現状は file も型も分けます）。便に口座を渡すときは、宣言されたどのかたまりの候補口座も外します。移るときは、かたまり単位で 1 回だけ移り先を決め、他のかたまりが使っておらず、便も使っておらず、上限に届いていない候補の先頭へ移ります。候補が 1 つも無い回は移らず user に知らせます。移動は新しい口座で新しい席を立てることで行い、対話の記録は運ばず、続きは器が台帳と git と圧縮直前の 1 枠から組み直します。かたまりの宣言そのものを user の常設の承認とし、移った回ごとに承認の記録を 1 件残します。進め方は 3 段階（宣言と点検の行と便からの除外／上限越えの通知だけ／自動で移る）で、通知と移動のきっかけは別の記録に委ねます。
  （理由）要求は「複数の project の席を同じ口座に」「かたまりごとに別の口座へ、上限が来たら一斉に」「席の口座は便に使わない」の 3 つで、どれも「口座を持つ分け方」を 1 つ決めれば満たせます。役割はもう 1 つしか無いので分け方として使えず、置き場ごとでは散ってしまうので、かたまりが残ります。移り先を 1 回だけ、かたまり単位で、鍵を掛けた内側で決めれば、同じ口座に席が殺到する事故は構造として起こりません。生きた対話を運ぶ道は、対話の記録の置き場が machine の設定に依っているので器の基準にはできず、圧縮のあとも異常終了のあとも同じ「器が組み直す」道を通せば実装は 1 本で済みます。人が書く宣言と器が書く現状を file も型も分けるのは、宣言をそのまま現状だと思い込まないためで、読む側の無い欄は足しません。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1057（claim）: 群の宣言は host 固有の宣言値の 1 種で、 host の面 1 file だけから、 tracked の面と同じ読み手・同じ拒否の形で読む。 file が無い host は 0 群として続き、 在るのに読めない host は typed に止まる。
  FR1036（claim）: 便用の除外に「宣言された群の候補の口座」を置く。 役割が 1 つになった後の「役割の口座 (宣言値)」の単位を群に決めるのが本 ADR で、 便用の並べ順と session 用の規則は変えない。
  FR1059（rationale）: 席の起動が口座を解く順に群の今の口座を置く根拠を与える。 解く順の実装は自動の移動の段の便で、 本 ADR は記録の置き場と型だけを決める。
  NFR1004（claim）: 壊れた群の宣言と読めない記録は黙って既定へ倒さず、 行番号付きで全件名指して typed に止まる。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、判断が最後に行き着く原則です。「役割ごとに 1 口座」を決めた記録と「役割ごとの現状の口座」を決めた記録を、分け方ごと置き換えます。便に渡す口座の並べ方を決めた記録は変えません。
  改訂状態: current
  置き換える ADR: ADR-1026, ADR-1036, ADR-1041
  置き換えられた: なし (現行)
  ADR-1036 は全部 (宣言の単位・宣言 file の置き場と形・席の起動が宣言を先に読む順・便用の除外・宣言の書き換えの口・点検の行) を本 ADR が置き換える。 別の宣言 file は作らず、 宣言は host の面の表 1 つになり、 単位は役割でなく群になる。 ADR-1041 は単位 (役割 → 群)・記録の置き場と形・選び直しの除外・便用の除外・相談席の写し (相談席は ADR-1045 で削除済み) を置き換え、 管理 tick の軸は ADR-1045 §2 (2) で削除済みである。 ADR-1041 のうち席の起動で閾値未満の候補が無い周の扱い (妥協の起動) は本 ADR では決め直さず据え置く — 本 ADR が作らないと決めるのは群の移動の妥協である。 ADR-1026 は §2.1 の host の面の表の集合に群の表を足す部分と、 §2.3 の席の起動が口座を解く順に群の今の口座を差し込む部分だけを置き換え、 host の面の置き場・読み手・拒否の形・口座の登録と退役と一覧の口は変えない。 ADR-1027 と ADR-1042 (便用の並べ順・1 口座あたりの上限を置かないこと) は不変で、 本 ADR が替えるのは候補の集合だけである。 ADR-1021 §2.3 の host 用 dir の導き方と ADR-1045 (役割は 1 つ・管理 tick の削除) は不変である。
  照会終端 — PRIN-CONTEXT-IS-REBUILT-NOT-CARRIED
  席の続きは運ぶものではなく、 測り直して入れ直すものである。 運ばなければ保てない続きは、 そもそも席が持ってはいけない。
  本 ADR の「移動 = 新しい席 + 機械の復帰」はこの原則に行き着く (これ以上は遡らない照会終端)。
options:
  - id: "OPT1"
    name: "口座を持つ単位を project の群にし、 宣言は host の面の 1 表・今の口座は host の根の記録・移動は新しい席 + 機械の復帰（続きを人でなく器が組み立て直すこと）"
    text: |
      群 (名・置き場の列・候補の口座 label の順の列) を host の面の表 1 つで宣言し、 群の今の口座（その群の席がいま実際に使っている口座）は host の根の記録 1 件 (群ごとに高々 1 件) が実効値として持つ。 便用の選定は宣言のどの群の候補の口座も host 全体で外す。 上限に当たった周は群単位で 1 回だけ移り先を決め、 新しい口座で新しい席を起こして復帰は機械の注入に任せる。
      （平易）project をいくつかのかたまりに分け、かたまりごとに「この口座を順に使う」という候補の並びを宣言します。宣言は人が書き、いまどの口座に居るかは器が別の記録に書きます。便にはかたまりの候補口座を渡しません。上限が近づいた回は、かたまり単位で 1 回だけ移り先を決め、新しい口座で新しい席を立てて、続きは器が組み直します。
      利点: 要求 (2) / (3) が単位 1 つで満たされ、 置き場が project ごとに分かれていても同じ群に入れられる
      利点: 要求 (4) が「宣言された候補の口座を便用から外す」1 つの規則になる
      利点: 移動の判定が host で 1 回・群単位・lock の内側に閉じるので、 同じ口座へ席が殺到する型が構造で消える
      利点: 圧縮・移動・異常終了が同じ 1 本の復帰を通る (実装が 1 本)
      利点: 宣言値 (候補の列) と実効値 (今の口座) が file も型も分かれる (C10)
      欠点: host の根に実効の記録という置き場が 1 つ増える
      欠点: 移動のたびに、 対話の文脈は機械が戻せるぶんしか残らない
      欠点: 便が使える口座が群の候補のぶんだけ減る (今の口座 1 つだけを外す案は OPT7・却下)
    verdict: adopted
    reason: "群 (名・置き場の列・候補の口座 label の順の列) を host の面の表 1 つで宣言し、 群の今の口座（その群の席がいま実際に使っている口座）は host の根の記録 1 件 (群ごとに高々 1 件) が実効値として持つ。 便用の選定は宣言のどの群の候補の口座も host 全体で外す。 上限に当たった周は群単位で 1 回だけ移り先を決め、 新しい口座で新しい席を起こして復帰は機械の注入に任せる。"
  - id: "OPT2"
    name: "役割 → 口座の宣言を残す (ADR-1036 の形のまま単位を役割にする)"
    text: |
      host の根に役割ごとの宣言 file を置き、 役割ごとに 1 口座を持つ。
      （平易）前に決めた「役割ごとに 1 口座」をそのまま残す案です。書き直しは要りませんが、役割は 1 つになったので、全部の project の席が同じ 1 口座に集まることしか表せません。「かたまりごとに別の口座」という要求が書けず、そもそも code には 1 行も入っていません。
      利点: 既に決定記録と設計 doc と語彙が在る (書き直しが要らない)
      欠点: 役割は orchestrator の 1 つになったので、 単位として働かない (全 project の席が 1 口座に集まる = 要求 (3) の「群ごとに別の口座」が表せない)
      欠点: 宣言と実効を比べて席を移していた管理 tick が削除済みで、 移す軸が無い
      欠点: code に 1 行も無いので「残す」の中身が無い (実測)
    verdict: rejected
    reason: "host の根に役割ごとの宣言 file を置き、 役割ごとに 1 口座を持つ。"
  - id: "OPT3"
    name: "生きた対話を持ち越して別の口座へ移すのを基準の道にする"
    text: |
      対話の記録を複写し起動行を再現して、 同じ対話のまま別の口座で続ける。
      （平易）生きている対話をそのまま別の口座へ持ち越すのを基準の道にする案です。文脈は 1 つも落ちませんが、対話の記録の置き場が共有されているかどうかは器の外の設定なので、それを当てにすると machine ごとの事情で動きが変わることになります。続きを戻す道も 2 本に分かれます。
      利点: 文脈が 1 つも落ちない
      利点: この host では置き場が共有されているので複写すら要らない
      欠点: 置き場が共有かどうかは器の外の host の設定で、 器が前提にすると host 固有の値で分岐することになる (N3)
      欠点: 復帰の道が 2 本になる (圧縮・異常終了は機械の復帰・移動だけ持ち越し)
      欠点: 器が対話の記録を読む口を持つことになる (いまは 1 つも持たない)
    verdict: rejected
    reason: "対話の記録を複写し起動行を再現して、 同じ対話のまま別の口座で続ける。"
  - id: "OPT4"
    name: "群の宣言を持たず、 席が起きるたびに選定へ落とす"
    text: |
      席の口座は起動のたびに session 用の選定で決める。 宣言も記録も持たない。
      （平易）かたまりの宣言を持たず、席を立てるたびにその場で空いている口座を選ぶ案です。いちばん小さくて済みますが、同じかたまりのはずの席がばらばらの口座に散り、席が立っていない間はその口座が便に取られます。
      利点: 置き場も表も増えない (いちばん小さい)
      欠点: 同じ群のはずの席が別々の口座に散る (要求 (2) / (3) を満たさない)
      欠点: 便用の除外（便に渡してはいけない口座を候補から外すこと）が「いま席が居る口座」だけになり、 席が起きていない周は便に取られる (要求 (4) が周ごとに破れる)
      欠点: 上限が来た周に群が一斉に移れない
    verdict: rejected
    reason: "席の口座は起動のたびに session 用の選定で決める。 宣言も記録も持たない。"
  - id: "OPT5"
    name: "妥協の移動 — 候補が無い周も閾値以上の口座へ群を移す"
    text: |
      移り先の候補が 1 つも無い周も、 いちばん余裕のある口座へ群を移して席を立てる。
      （平易）移り先の候補が 1 つも無い回でも、いちばん余裕のある口座へかたまりごと移してしまう案です。席は止まりませんが、上限に当たっている口座へ移すだけなので止まる席が増え、移った先で便と口座が重なります。
      利点: 席が止まらない
      欠点: 上限に当たっている口座へ群ごと移すので、 止まる席が増えるだけで解決しない
      欠点: 移った先で便と口座が交わる (要求 (4) が破れる)
      欠点: 「移った」という実効値が残るので、 次の周の判定が汚れる
    verdict: rejected
    reason: "移り先の候補が 1 つも無い周も、 いちばん余裕のある口座へ群を移して席を立てる。"
  - id: "OPT6"
    name: "初期化の口・consumer の rules の写しの廃止・外部 API の鍵の欄を同じ ADR に畳む"
    text: |
      導入を 1 command にする口 (host の面を作る口と置き場ごとの面を作る口・差分だけ出す形) と、 consumer が規則の写しを持たない形と、 外部 API の鍵を名乗る欄を、 本 ADR で一緒に決める。
      （平易）かたまりの話と一緒に、導入を 1 コマンドにする口や、相手の repo が規則の写しを持たない形や、外部 API の鍵を名乗る欄まで、この 1 本で決めてしまう案です。まとまりは良くなりますが、1 つの記録が独立した 3 つの決定を抱えることになり、あとから片方だけ直せません。鍵の欄は読む側がまだ無いので、いま足すと「配線されていない設定」になります。別の記録へ送ります。
      利点: host の面と置き場の面を分ける話が 1 本にまとまる
      利点: 鍵の欄は 1 表で足りる
      欠点: 1 つの決定記録が 3 つの独立した決定を持つことになる (後から片方だけ改訂できない)
      欠点: 鍵の欄は読み手を持たないので、 いま決めて足すと配線されていない設定になる (C10.3)
      欠点: 導入の口は本 ADR の群とは独立に決められる (依存が無い)
    verdict: rejected
    reason: "導入を 1 command にする口 (host の面を作る口と置き場ごとの面を作る口・差分だけ出す形) と、 consumer が規則の写しを持たない形と、 外部 API の鍵を名乗る欄を、 本 ADR で一緒に決める。"
  - id: "OPT7"
    name: "便用の除外を群の今の口座だけにする (候補の列の残りは便に開ける)"
    text: |
      便用の候補から外すのは「その群がいま居る口座」1 つだけとし、 記録が無い周は候補の先頭 1 つを外す。 候補の列の残りは便が使える。
      （平易）便に渡さない口座を、かたまりの候補ぜんぶではなく「いまそのかたまりが居る 1 つ」だけに絞る案です。user の言い方にいちばん近く、便が使える口座もほとんど減りません。ただし便は口座を上限いっぱいまで使う側なので、候補の残りを便が先に使い切ってしまい、いざ移りたい回には移り先がどれも上限に近い、ということが起こります。つまり候補の列が逃げ道として働かなくなります。便に回せる量と逃げ道の広さは、候補をいくつ書くか（user が書く宣言）で調整できるので、この案で取り戻す必要はありません。加えて、外す口座を「器が書いた現状の記録」から決めることになるので、その記録が読めない回に何を外すかが決まりません。
      利点: user の要求 (4)「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」の字面にいちばん近い
      利点: 便が使える口座が群ごとに 1 つしか減らないので、 便の容量が落ちない
      欠点: 移り先になる候補を便が先に使い切る (実測 = 便用の選定の上限は 100 % の定数で、 便は口座を上限まで使う側の規則である。 一方で移り先の条件は閾値未満〔5 時間窓 85 ・ 7 日窓 95 ・ モデル別窓 95〕なので、 群が移りたい周には候補が全部閾値を越えている見込みが高い) ＝候補の列が逃げ道として働かない
      欠点: 便の容量と逃げ道の釣り合いは、 候補の列の長さ (user が書く宣言値) で選べる。 この案で取り戻す必要が無い
      欠点: 除外の規則が実効の記録の読みに依存する。 本 ADR は読めない記録を typed に止めると決めたので、 記録が読めない周の便用の除外が「止まる」か「黙って広がる」かの二択になり、 typed に決まらない (宣言値だけを読む OPT1 にはこの周が無い)
    verdict: rejected
    reason: "便用の候補から外すのは「その群がいま居る口座」1 つだけとし、 記録が無い周は候補の先頭 1 つを外す。 候補の列の残りは便が使える。"
