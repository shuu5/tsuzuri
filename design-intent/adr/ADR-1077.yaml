  surface: R-8
consequences:
  - "この判断で良くなること 3 つと、 代わりに引き受けること 4 つです。 良くなるのは、 待っている席が書き込みの直後に知ること、 送る行に入る外からの値が記帳 id 1 語だけで好きな文を運ぶ経路が戻らないこと、 考え中の席の作業を割らないことです。 引き受けるのは、 口の実装の前に要件書の改訂が要ること、 器が裁定の中身も記帳 id の実在も確かめないこと、 考え中の席への知らせは消費側の仕組みに頼ること、 記帳 id の形の中の短い語は運べて別の席からも撃てることです。"
  - "良い結果: 待っている席は、 裁定面の書き込みの直後に「裁定が届いた」の 1 行を受け、 次の合図まで待たない"
  - "良い結果: 送る行に入る外からの値は閉じた文字種の記帳 id 1 語だけで、 任意の文を運ぶ経路は戻らない。 注入の口の不在の歯も残る"
  - "良い結果: 送達は管理 tick と同じ 1 本で、 考え中の席の turn を割らない"
  - "代償: 要件の改訂 (持ち主の /folio-architect) が口の実装の前に要る"
  - "代償: 器は裁定の中身も記帳 id の実在も確かめず、 逐語を席へ届けるのは消費側の hook の読みに任せる"
  - "代償: 考え中の席には送らないので、 その時の知らせは消費側の停止の hook の経路に頼る"
  - "代償: 記帳 id の形の中の短い語は運べ、 口は別の席の process からも撃てる (撃ち手は確かめない)"
