# 判断の記録 ADR-1077 — 器 scribe2 の判断の記録 ADR-0077 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1077
title: "待ちの席へ裁定の指し示しを送る狭い口を開ける — seat deliver は裁定面の記帳 id 1 つだけを受け、 指し示しの雛形の 1 行を管理 tick と同じ門で待ちの席へ送り、 送る行に入る外からの値は記帳 id だけにする (ADR-1045 の注入の口の削除を部分 supersede)"
status: accepted
date: 2026-09-27
context: |
  別の project の裁定面が持ち主の裁定を書き込んでも、 待っている席は次の管理 tick の合図まで気づかない。 ADR-1045 は席の入力欄へ任意の文を送る口 (seat inject) を消した。 本 ADR は、 裁定面の記帳 id 1 つだけを受けて指し示しの雛形の 1 行を送る狭い口を開け、 送る行に入る外からの値を 1 語に絞る形を決める。
  なぜこの判断が要るのかを、 経緯 (好きな文を送る口は以前に消した)・事象 (待っている席は裁定の書き込みに気づかない)・機序 (好きな文を運ぶ口は席どうしの連絡の経路になる)・憲法と既存の決定の向き・この判断の範囲の 5 つから説明します。 送る仕組みそのもの (入力欄の確かめ・送達の窓) は消えずに残っていて、 定期の合図・席の起動・群の通知・便の終わりの通知が使っています。
  CTX1 経緯 — ADR-1045 は席の入力欄へ任意の文を送る口を消した
  ADR-1045 は席の役割を orchestrator の 1 つにし、 席が自分を保つために積んだ機構を消した。 消えたものの列の inject 系統には注入の口（任意の文を送る口） (seat inject・任意の文を席の入力欄へ送る subcommand) が在り、 不在は歯が測る。 送達の機構そのもの (入力欄の門・送達の窓・Enter の再送) は残り、 ADR-1058 が戻した管理 tick（席を周期で見る仕組み） と、 席の起動と群の通知と便の終端の周の通知が内側で使う。 要件 FR1044 は、 器から席の入力欄への差し込みを列に挙げた用途に限る。
  CTX2 事象 — 待っている席は裁定の書き込みに気づかない
  消費側の project は、 持ち主が裁定を書き込む画面と server (裁定面（裁定を書く画面）) を持つ。 書き込みの後、 席が待っているなら「裁定が届いた」と 1 行知らせたい。 今は外から撃てる口が無く、 待っている席は管理 tick の黙りの初段 (最後の打刻から既定 30 分) か梯子の今の段まで気づかず、 梯子の列が尽きた席と heartbeat を止めた席には合図が来ない。 席が考え中なら、 席の停止の hook が未読を拾う経路で足りる (消費側の設計)。
  CTX3 機序 — 任意の文を運ぶ口は席どうしの連絡の経路になる
  任意の文を受ける口は、 別の席の process からも撃てるので、 ADR-1045 が消した席間の連絡の経路を名前だけ変えて戻すことになる。 送る行に入る外からの値が閉じた文字種の 1 語 (裁定面の記帳 id) だけなら、 運べるのは短い識別子までで、 席が受け取るのは「どこを読めばよいか」の指し示しになる。 それでも識別子の形の中の短い語は運べ、 口は別の席の process からも撃てる。
  CTX4 憲法と既存の決定の向き (本 ADR の解釈)
  C17 (決定はしご) から、 送達は既に在る 1 本 (入力欄の門・送達の窓) を使い、 門を二重に持たない。 N2 (散文にしか無い規則を規則として扱わない) から、 「記帳 id だけを送る行に入れる」は口の引数の閉じた列と記帳 id の文字種の検査で構造として守り、 注意書きに頼らない。 ADR-1058 の管理 tick と同じ門 (打刻の最終行が idle・入力欄が空) を通すので、 考え中の席の turn を割らない。
  CTX5 射程 — 動かすのは口 1 つと要件の限定句だけ
  動かすのは (1) seat の subcommand に裁定の指し示し（裁定が届いた知らせ）の口を 1 つ足すこと、 (2) 要件 FR1044 の差し込みの用途の列に裁定の指し示しを 1 つ足し、 新しい要件 FR1079 と受入基準 AC1049 を置くこと。 雛形は届いたことの指し示しだけで続きの指示を持たないので、 FR1044 の「台帳の現在地から続きを進めるよう促す差し込みは打刻の合図だけ」は保つ。 動かさないのは、 注入の口 seat inject の不在 (戻さない)・送達の機構・管理 tick と群の通知の差し込み・席の起動・裁定の逐語の置き場 (消費側)。 同じ要件の改訂で FR1044 の列に既存の便の終端の周の通知も足すが、 それは本 ADR の決定ではない (持ち主の裁定 2026-09-27T00:59Z)。
  （選択肢を測るものさし）この判断を評価する 4 本のものさしです。 待っている席が書き込みの直後に知ること。 席どうしの連絡の経路を戻さないこと (送る行に入る外からの値を口の形で絞る)。 考え中の席の作業を割らないこと (定期の合図と同じ確かめを通す)。 足すものを最小にすること (既に在る送達の 1 本を使い、 確かめを二重に持たない)。
  DR1｜待っている席は書き込みの直後に知る — 次の合図まで待たせない CTX2
  DR2｜席どうしの連絡の経路を戻さない — 送る行に入る外からの値を構造で絞る (N2) CTX1・CTX3
  DR3｜考え中の turn を割らない — 管理 tick と同じ門を通す CTX2・CTX4
  DR4｜足すものを最小にする — 既に在る送達の 1 本を使い、 門を二重に持たない (C17) CTX4・CTX5
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 口が受けるのは置き場・宛先の席・裁定面の記帳 id 1 つ (と歯のための道具の差し替え) だけで、 送る行に入る外からの値は記帳 id だけです。 記帳 id は ASCII の英数字と 4 つの記号だけの 1 語に閉じます。 登録が在り、 状態の記録の最後が待ちで、 入力欄が空いている席にだけ、 決まった形の 1 行を 1 回送ります。 条件に合わないときは 1 文字も送らずに理由の語で断ります。 支えるのは FR1079 (裁定の指し示し) の根拠と、 FR1044 (席間の連絡の廃止) への主張です。
  採用 — OPT1
  器 SHALL seat の subcommand に裁定の指し示しの口を 1 つ持つ。 口の引数は置き場・宛先の席・裁定面の記帳 id 1 つ (と歯のための道具の差し替え) の閉じた列で、 送る行に入る外からの値は記帳 id だけとし (ほかの引数は送る行に入らない)、 記帳 id は ASCII の英数字と 4 つの記号 (ピリオド・ハイフン・下線・コロン) だけの、 長さの上限の中の 1 語に閉じる。 口 SHALL 管理 tick と同じ入力欄の門と待ちの条件 (登録 row が在り、 打刻の最終行が idle で、 入力欄が空) を通った時にだけ、 記帳 id を指し示しの雛形に入れた 1 行 (裁定が届いた旨の指し示し・裁定の逐語と続きの指示は持たない) を 1 回送って結果を 1 行で返し、 条件の外は 1 key も送らず typed な理由の語で断る (断りの形の列の正本は FR1079)。 器は撃ち手・裁定面の書き込みの有無・裁定の中身を確かめない。 注入の口 seat inject は戻さず、 その不在の歯は残す。 本 ADR は ADR-1045 の「消えるもの」の列の inject 系統のうち口 (subcommand) の削除を、 記帳 id だけを送る行へ入れる口に限って置き換え、 要件は FR1044 の差し込みの用途の列に裁定の指し示しを足し FR1079 と AC1049 を置く (SRS v0.26)。
  （平易）器は席の口の 1 つとして、 裁定の指し示しの口を持ちます。 口が受けるのは置き場・宛先の席・裁定面の記帳 id 1 つ (と、 歯のために画面の道具を差し替える引数) だけで、 送る行に入る外からの値は記帳 id だけです。 記帳 id は ASCII の英数字と 4 つの記号 (ピリオド・ハイフン・下線・コロン) だけの、 長さに上限のある 1 語に閉じます。 口は、 定期の合図と同じ入力欄の確かめと待ちの条件 (登録が在り、 状態の記録の最後が待ちで、 入力欄が空) を通った時にだけ、 記帳 id を決まった形に入れた 1 行 (裁定が届いたことの指し示し・裁定の文そのものと続きの指示は持たない) を 1 回送り、 結果を 1 行で返します。 条件の外は 1 文字も送らずに理由の語で断り、 断る形の一覧は要件 FR1079 が持ちます。 器は、 誰が撃ったか・裁定が本当に書かれたか・裁定の中身を確かめません。 以前に消した好きな文を送る口は戻さず、 それが消えたことを測る歯も残します。 要件書は、 席の入力欄への差し込みの列に裁定の指し示しを足し、 新しい要件 FR1079 と受入基準 AC1049 を置きます。
  （理由）持ち主の裁定は、 送る前の確かめを通す薄い包みの形 (2026-09-26) と、 口を開けて用途を「裁定が届いた」の 1 行の指し示しだけに限ること (2026-09-27) でした。 待っている席は、 放っておくと次の定期の合図まで裁定に気づかず、 持ち主との対話が止まります。 好きな文を運ぶ口は別の席からも撃てるので、 以前に断った席どうしの連絡の経路を名前だけ変えて戻すことになります。 そこで口の引数を閉じた列にし、 送る行に入る外からの値を閉じた文字種の記帳 id 1 語に絞ります。 撃ち手は絞らないので、 運べる量を 1 語にすることがこの口の守りです。 注意書きに頼らないのは、 散文にしか無い規則を規則として扱わない、 という憲法の条に沿うためです。 送達は既に在る 1 本を使い、 定期の合図と同じ確かめを通すので、 確かめを二重に持たず、 考え中の席の作業を割りません。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1079（rationale）: FR1079 (裁定の指し示し) の根拠を与える。 待っている席に書き込みの直後に知らせること、 送る行に入る外からの値を閉じた文字種の記帳 id に絞って運べる量を 1 語にすること、 管理 tick と同じ門を通すこと (裁定 2026-09-27T00:51Z)。
  FR1044（claim）: FR1044 (席間の連絡の廃止) の差し込みの用途の列に裁定の指し示しを 1 つ足しても、 送る行に入る外からの値は閉じた文字種の記帳 id 1 語だけで任意の文を運ばず、 雛形は届いたことの指し示しだけで続きの指示を持たないので「台帳の現在地から続きを進めるよう促す差し込み」にも当たらない、 と主張する。 絞るのは運べる量で、 撃ち手は絞らない。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録は ADR-1045 の一部を置き換えます。 置き換えるのは「消えるもの」の列の inject 系統のうち口の削除だけで、 それを記帳 id だけを送る行へ入れる口に限って改めます。 好きな文を運ぶ注入の口は戻しません。 ADR-1045 の席の役割と席間の連絡の作法の削除、 ADR-1045 §2 (2) の削除のうち ADR-1058 が戻さなかった分 (この記録が置き換える口の削除を除く)、 ADR-1058 の定期の合図はそのまま保ちます。 行き着く原則は「席には、 どこを読めばよいかだけを知らせ、 中身は運ばない」です。
  改訂状態: current
  置き換える ADR: ADR-1045
  置き換えられた: なし (現行)
  部分 supersede で、 置き換えるのは 1 つ — ADR-1045 の「消えるもの」の列の inject 系統のうち口 (subcommand) の削除 — を、 記帳 id だけを送る行へ入れる口に限って改める。 任意の文を運ぶ注入の口は戻さない。 保つのは、 ADR-1045 の席の役割 (orchestrator の 1 つ)・§2 (2) の席間の連絡の作法の削除・§2 (2) の削除のうち ADR-1058 が戻さなかった分の全部 (本 ADR が置き換える口の削除を除く) と、 ADR-1058 の管理 tick の門と合図の全部。
  照会終端 — PRIN-POINT-DO-NOT-CARRY
  席には、 どこを読めばよいかだけを知らせ、 中身は運ばない。
  本 ADR が「任意の 1 行の口」「tick を待つ」「server が tmux を直に撃つ」を退け、 送る行に入る外からの値を記帳 id 1 語に絞って運べる量を 1 語までにしたのはこの原則に行き着く (これ以上は遡らない照会終端)。
options:
  - id: "OPT1"
    name: "裁定面の記帳 id だけを受ける狭い口"
    text: |
      seat deliver は置き場・宛先の席・裁定面の記帳 id 1 つ (ASCII の英数字と 4 つの記号だけの 1 語) を受け、 送る行には記帳 id だけを入れ、 指し示しの雛形の 1 行を、 登録 row が在り打刻の最終行が idle で入力欄が空の席へ既存の送達の 1 本で送る。 形の外の記帳 id・登録の無い宛先・考え中の席・入力欄に文字の在る席は 0 key で断る。 決め手は持ち主の裁定 (2026-09-27T00:51Z)。
      （平易）裁定面の記帳 id を 1 つだけ受ける口を開ける案です。 記帳 id は ASCII の英数字と 4 つの記号だけの 1 語で、 送る行に入る外からの値はこれだけです。 口は記帳 id を決まった形の 1 行に入れ、 登録が在り、 状態の記録の最後が待ちで、 入力欄が空いている席にだけ、 既に在る送達の 1 本で送ります。 形の外の記帳 id・登録の無い宛先・考え中の席・入力欄に文字の在る席は 1 文字も送らずに断ります。 待っている席が書き込みの直後に知り、 好きな文は運べず、 定期の合図と同じ確かめを通ります。 代わりに、 要件書の改訂が先に要り、 裁定の中身を席へ届けるのは消費側の仕組みの読みに任せ、 記帳 id の形の中の短い語は運べて別の席の process からも撃てます。 持ち主の裁定で選びました。
      利点: 待っている席は書き込みの直後に 1 行で知る (DR1)
      利点: 送る行に入る外からの値は閉じた文字種の記帳 id 1 語だけで、 任意の文を運ぶ引数が無い (DR2)
      利点: 管理 tick と同じ門を通り、 考え中の席には送らない (DR3)
      利点: 送達の機構は既に在る 1 本で、 足すのは口と記帳 id の検査だけ (DR4)
      欠点: 要件 FR1044 の限定句を改めるので、 要件の改訂 (持ち主の手) が先に要る
      欠点: 裁定の逐語を席へ届けるのは消費側の hook の読みで、 器は内容を確かめない
      欠点: 記帳 id の形の中の短い語は運べ、 口は別の席の process からも撃てる (絞るのは運べる量で、 撃ち手は絞らない)
    verdict: adopted
    reason: "決め手は持ち主の裁定 (2026-09-27T00:51Z)。"
  - id: "OPT2"
    name: "任意の 1 行を送る口 (消した注入の口を戻す)"
    text: |
      宛先と任意の文を受けて送る口を足す。 決め手は分析 (席間の連絡の経路が戻る)。
      （平易）宛先と好きな文を受けて送る口を足す案で、 以前に消した口を戻す形です。 消費側が文を自由に選べ、 既に在る入力欄の確かめと送達の 1 本も使える点で勝ります。 けれども、 別の席の process から好きな文を送れるので、 以前に断った席どうしの連絡の経路が戻ります (撃つ側は選んだ案と同じで、 違いは運べる量です)。 消えたことを測る歯と要件の趣旨を、 名前だけ変えて迂回する形にもなります。 退けました。
      利点: 消費側が文を自由に選べる
      利点: 既に在る入力欄の門（送る前の確かめ）と送達の 1 本を使える (DR3・DR4)
      欠点: 別の席の process から任意の文を送れ、 ADR-1045 が消した席間の連絡の経路が戻る (撃ち手は OPT1 と同じで、 違いは運べる量) (DR2)
      欠点: 不在の歯と要件の趣旨を名前だけ変えて迂回する形になる (DR2)
    verdict: rejected
    reason: "決め手は分析 (席間の連絡の経路が戻る)。"
  - id: "OPT3"
    name: "口を持たず、 管理 tick の合図で拾う"
    text: |
      器は何も足さず、 待っている席は次の打刻の合図で台帳と書き込みを読み直す。 決め手は分析 (待ちが長い)。
      （平易）器は何も足さず、 待っている席は次の定期の合図で書き込みを読み直す案です。 器にも要件にも足すものが無く、 新しい口が無いので連絡の経路も一切増えない点で勝ります。 けれども、 黙ったと判じる長さ (最後の記録から既定 30 分) か合図の間隔の今の段まで気づかず、 合図を送り尽くした席と合図を止めた席には合図が来ないので、 持ち主との対話が止まります。 退けました。
      利点: 器にも要件にも足すものが無い
      利点: 新しい口を足さず、 連絡の経路が一切増えない (DR2)
      欠点: 黙りの初段 (最後の打刻から既定 30 分) か梯子の今の段まで気づかず、 梯子の列が尽きた席と heartbeat を止めた席には合図が来ないので、 持ち主との対話が止まる (DR1)
    verdict: rejected
    reason: "決め手は分析 (待ちが長い)。"
  - id: "OPT4"
    name: "裁定面の server が tmux を直に撃つ"
    text: |
      消費側の server が send-keys で席の pane へ直に 1 行を送る。 決め手は分析 (門を二重に持つ)。
      （平易）消費側の server が、 席の画面へ直に 1 行を送り込む案です。 器を触らない点で勝ります。 けれども、 入力欄の確かめ・送れたかの確かめ・記録を消費側が二重に持つことになり、 考え中の席の作業を割る事故を器が防げません。 器の外からの送り込みは要件の列の外で、 消えたことを測る歯でも測れません。 退けました。
      利点: 器を触らない
      欠点: 入力欄の門・送達の確かめ・記録を消費側が二重に持ち、 考え中の turn を割る事故を器が防げない (DR3・DR4)
      欠点: 器の外の差し込みは要件の列の外で、 不在の歯でも測れない (DR2)
    verdict: rejected
    reason: "決め手は分析 (門を二重に持つ)。"
basis: [FR1044, FR1079, AC1049, ADR-1045, ADR-1058]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「席」は人と AI が話す 1 つの session、 「裁定面」は別の project が持つ、 持ち主が裁定を書き込む画面と server です。 持ち主が裁定を書き込んでも、 待っている席は次の定期の合図まで気づきません。 器は以前、 席の入力欄へ好きな文を送る口 (seat inject) を消し、 席どうしが連絡し合う経路を断ちました。 この記録は、 裁定面が裁定に付けた識別子 (裁定面の記帳 id) を 1 つだけ受けて「裁定が届いた」の決まった形の 1 行を送る狭い口 (seat deliver) を開け、 送る行に入る外からの値をその 1 語だけにする形を決めます。 送る前の確かめは定期の合図と同じで、 考え中の席には送りません。 この記録は要件 FR1079 (裁定の指し示し) の根拠になり、 FR1044 (席間の連絡の廃止) の差し込みの列に 1 つ足しても好きな文は運ばず、 続きを促す差し込みにも当たらない (短い語は運べ、 撃ち手は絞らない) ことを主張し、 ADR-1045 の注入の口の削除を一部だけ置き換えます。 持ち主は 2026-09-27 に口を開けることを裁定しました。
