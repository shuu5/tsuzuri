  器の承認の欄: 設計 (orchestrator)・orchestrator・2026-09-27 草稿 v2 (消した注入の口と不在の歯と要件の限定句を現物で読み、 送る行に入る外からの値を閉じた文字種の 1 語に絞る形を決めた。 拘束する constitution の版 0.5.0)・作成
  器の案の章の要約: 候補を 4 つ並べます。 裁定面の記帳 id だけを受ける狭い口 (選んだ案)、 好きな 1 行を送る口 (消した口を戻す案)、 口を持たず定期の合図で拾う案、 裁定面の server が画面の送り込みを直に撃つ案です。 選ばなかった 3 つは、 席どうしの連絡の経路が戻る・待ちが長い・確かめを二重に持ち考え中の作業を割る事故を器が防げない、 という理由で退けました。
  器の専門語の説明: 本文に出てくる専門語 6 個を、 やさしい言葉で説明します。
  ・裁定の指し示し（ruling pointer）: 外の裁定面が裁定を書いたことを、 裁定面の記帳 id だけを入れた指し示しの雛形の 1 行で待ちの席へ知らせる差し込み。 逐語と続きの指示は運ばない (FR1079)。
  ・裁定面（ruling surface）: 消費側の project が持つ、 持ち主が裁定を書き込む画面と server (器の外の置き場)。 書き込みの後に器の口を撃ち、 面が裁定に付けた識別子 (裁定面の記帳 id) を渡す。 記帳 id は器の裁定 id (裁定 event の時刻) とは別で、 器はこの面を持たない。
  ・入力欄の門（input gate）: 送る前に席の入力欄を読み、 人の打ちかけや読めない時は 1 key も送らない器の仕組み。 管理 tick・群の通知・便の終端の周の通知・本 ADR の口が同じ 1 本を使う。
  ・状態の打刻（state stamp）: 席の hook が書く状態の行 (考え中 Busy / 待ち Idle)。 最終行が Idle の席だけが待ちの席で、 本 ADR の口はそこへだけ送る。
  ・注入の口（inject mouth）: ADR-1045 が消した seat inject (任意の文を席の入力欄へ送る subcommand)。 本 ADR でも戻さず、 不在は歯が測る。
  ・管理 tick（management tick）: 席の外から周期で回り、 黙った待ちの席に打刻の合図を送り、 死んだ席を起こし直す仕組み (ADR-1058)。
