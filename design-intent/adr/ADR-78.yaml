    text: 決定 (1)〜(10)。
    verdict: adopted
    reason: 公式が main の文脈を守るために推す手（subagent に調べを出す・返りを絞る・SessionStart の compact の hook・PostCompact の記録・hook で前処理・teams より軽い道）を順に使い、型を足さず（条 N-5.1）、決めと採否を席に残す（条 P-19.2）。失う物は、走っている係への途中の配りを読む時（U）、teams を切る時の失う物（L1〜L9・teammate の mailbox の自動の配り・宛先 team-lead と名簿・結びの道の替わり・既定の system prompt・背景で外れる道具・測りの続き・teams の入り口・持ち主の求めの前半ほか・design.md §3.5）、席が code を自分で読んで気づく機会、行 15 本の手間と裁定 4 本。
  - id: b
    name: 乙 — 案 A（器へ寄せる機械の行だけ・調べと照らしは席のまま）
    text: notes の時刻・検査・当て・同期・道具の移しだけを入れ、席の読みと係の返りは替えない。
    verdict: rejected
    reason: 席の文脈を最も埋める自前の読み 17.4% と係の出す物の読み 12.0% と返りの二重の届きが残り、圧縮の回数があまり減らない（r385 §3 案 A の失う物・I）。
  - id: c
    name: 丙 — 案 C（設計の席と流しの席の 2 つに分ける）
    text: 便の起動と止め・失敗の調べ・器の入れ替えを新しい流しの席へ。
    verdict: rejected
    reason: 役割を 1 つに畳んだ器の判断の記録 ADR-0045 §2 (1) を覆し、席の間の連絡と雛形と行を増やす（増殖）。撤退の (1) と (2) が越えた時の退きの道として残す。
  - id: d
    name: 丁 — agent teams を主にする（teams の案 丙・teammate のまま・共有の task list を使う）
    text: 共有の仕事の一覧の印（CLAUDE_CODE_ENABLE_TODO_TOOLS=1）で Task の道具を入れ、仲間の手空きの hook（TeammateIdle）で返りの形を検め、係の cache の時間の設定（subagentPromptCacheTtl）を 1h にする。
    verdict: rejected
    reason: 持ち主の裁定（t3-hub.92.10.2:20261007T0251Z-1・teams の案 甲）で選ばなかった。実験の機能で既定 off・同じ process の中の仲間（in-process teammate）は resume で戻らない（公式 agent-teams.md:476）・skills の予載が効かない（agent-teams.md:279）・token が多い。lead が圧縮でチーム（team）を見失う #23620 は公式でない issue（r390 I1）だが、teams を残す限り面が残る。tsuzuri の係は席とだけ話すので teammate どうしの話しを使わない（D）。
  - id: e
    name: 戊 — 並べる調べを Workflow か係の中の fan-out で束ねる
    text: 席か調べ係が多数の読むだけの agent を 1 回で起こし（扇の起こし・fan-out）、まとめを 1 通で受ける。
    verdict: rejected
    reason: Workflow は途中で人の入力を取れず 1 回で 46 の Opus の暴走の報告が在る（#66023・公式でない）。係の中の扇の起こしは子の token が係の測りの外に出て（agent_meter は係の記録だけを読む）、再帰の暴走（#68619）の面を開く。撤退の (2)・(3) が越えた時に、入れ子の測りを足して問い直す。
  - id: f
    name: 己 — 自動の圧縮の閾値を上げるか下げる
    text: 圧縮の閾値の印（CLAUDE_AUTOCOMPACT_PCT_OVERRIDE）を替えて圧縮の回数か質を動かす。
    verdict: rejected
    reason: 上げれば長い文脈の劣化（r390 S9）に寄り、下げれば回数が増える。回数は入ってくる量の結果なので、量を減らす手を先にする（D）。区切りは引き継ぎの線（行 B6）で持つ。
  - id: g
    name: 庚 — teams を残し、係だけを subagent で起こす（teams の案 乙・起こしの呼びごとに isolation を付ける）
    text: チーム機能の印（CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS）は 1 のまま、名付きの Agent の呼びごとに作業木の隔て（isolation）を付けて係を subagent で起こし、付けを門で検める（行 B2）。係の本文の足し（行 B1）は甲と同じく要る。
    verdict: rejected
    reason: 持ち主の裁定（t3-hub.92.10.2:20261007T0251Z-1・teams の案 甲）で選ばなかった。持ち主の求めの字（teams を使える形を残す）に沿うが、係ごとに一時の worktree を作って消す手間と disk が掛かり、係の cwd が既定の branch の写しになり席の HEAD と違い得る（公式 sub-agents.md:317）。定義の頭（frontmatter）の隔ての欄では teammate になるのを止めない（sub-agents.md:927）ので、呼びごとに付ける決まりを門で持つ要が在る。teams の自動の配りと名簿は残るが係はそれを使わない（D）。
  - id: h
    name: 辛 — 根の CLAUDE.md の Compact instructions の生成（第 1 稿の行 B7）と、係の定義の CLAUDE.md を外す欄（omitClaudeMd）を足す
    text: tz derive が規則の行の字から根の CLAUDE.md（Compact instructions の節だけ）を生成し、3 つの agent の定義に omitClaudeMd を足す。
    verdict: rejected
    reason: B7 は消す artifact を名指せず条 P-27.2 の must に当たる（v394 F16）。omitClaudeMd は根の CLAUDE.md だけでなく口座と project と local の CLAUDE.md を全部外す（公式 sub-agents.md:315）ので持ち主の口座の CLAUDE.md も係に載らなくなり、チーム機能（teams）が on の間は teammate に効かない（v394 F6）。返りと再注入の行（B1 と B4）で入ってくる量を先に減らしてから、撤退 (8) で問い直す。
basis: [P-4, P-7, P-13, P-15, P-16, P-17, P-19, P-27, N-2, N-5.1, R-1, R-41, R-43, R-45, D-1, D-2, D-5, D-10, D-12, D-13, ADR-59, ADR-61, ADR-73, ADR-77, R-46, R-47, D-14]
produced: [R-48, R-49, R-50, R-51]
grill:
  when: 2026-10-07
  who: 検証役 v394（AI・起草者と別の独立の文脈・読み取りだけ・公式の頁の原文を逐語で照らした）
  where: docs/grill/2026-10-07-ADR-78-grill.md
  summary: 検証役 v394 が係 w392a の第 1 稿を 1 巡攻めた。判じは懸念つきで通す（直す 13・持ち主に問う 3・通る 5）。重い物は、チーム機能を切る設定がその場で効くのに係の終わりの門がチームの宛先への知らせを要る事（切るのは B1 の後に限る）・席の process の起動の日の誤りと効いていない plugin の commit 6 本（/reload-plugins で当て、照らす口を行 B16 にした）・走っている係への途中の知らせの字の誤り・持ち主の求めとの食い違い（持ち主に問い、裁定で甲）。係 w395a・w396a・w401a が直した。
retreat:
  kind: measure
  condition: |
    数えは ADR-77 の行 77-8（tz の日次の測り）の欄 measure の項へ移す（鍵の名はこの欄のまま・77-8 の起草の材料に名指す）。移すまでは tsuzuri の設計の席が、係の設計の file（drafts/w395a/w/design.md）§6 の path を解いた字の命令で数え、memo（t3-hub.92.10）か後継の memo の notes に撃った命令と数を記帳する。移した後は tz が鍵で数えて越えを出し（条 P-4.3）、手の数えの字を消す。席の transcript の path はチームの設定（team の config の leadSessionId）から解くが jsonl の在りかは分からない（U）ので、plugin の当ての照らし（行 B16）が plugin の印の file（`<置き場>/.seat/plugin-head`）に書く transcript_path を読む。B16 の着地までは、席が自分の hook の入力に載る transcript_path を notes に 1 度写す。数える物は完全な記録から出し、途中の記録を丸めない。窓の長さは 24 時間か、席の transcript の 25.37 時間。問う相手は持ち主。各行は 鍵・向き・閾値・窓 の形で書く（条 P-4.2）。向きは 越える・下回る・前の窓より下がらない のどれか。
    (1) 鍵（auto_compact_24h）（席の自動の圧縮の回数・基準 12 回 / 25.37 時間）・向き 越える・閾値 5 回（7 日の日ごとの値の中央で判じる）・窓 段 1 の着地と設定の替えから 7 日 → 案 C（選択肢 丙）を含めて分け方を問い直す。
    (2) 鍵（turn_kinds_ge5_ratio）（tool を持つ turn のうち主の種類が 5 種以上の割合・基準 51%）・向き 越える・閾値 35%・窓 段 1 の着地から 7 日 → 器へ移す行の範囲と知らせの束ね（選択肢 戊）を問い直す。
    (3) 鍵（agent_return_chars_per_agent）（係 1 体あたりの返りの字・第 1 稿の基準 2,952 字は teammate の知らせの道の値なので、係を subagent に替える前の 1 日に、チーム機能（teams）のまま撃つ道と試しの係 1 体を subagent で起こした道の両方で基準を取り直し、前後で違う式を比べない）・向き 越える・閾値 800 字・窓 B1 の着地から 7 日 → 返りの形の門と R-51 を問い直す。
    (4) 鍵（seat_self_read_share）（動いた時間のうちの席の自前の読みの割合・基準 17.4%）・向き 越える・閾値 10%・窓 段 1 の着地から 7 日 → 席の読みを知らせでなく止める門を問い直す。
    (5) 鍵（agent_tokens_per_agent_24h）（1 日の係の使った量の、使った量の file の在る係 1 体あたり・基準 2026-10-06 の 89 体・18,210,945 token・1 体あたり 204,618 token・使った量の file（usage.json）の無い係は数えない）・向き 越える・閾値 基準の 1.5 倍・窓 段 1 の着地から 7 日ごと → 調べを係へ出す費えと R-48 を問い直す。
    (6) 鍵（spawn_cap_refused_24h）（起こしの門が R-48 で断った数）・向き 越える・閾値 1 日 10 回・窓 数の門（行 B2）の着地から 7 日 → R-48 の値を問い直す。
    (7) 欠番（第 1 稿の途中の答えの失いの鍵は、機械の出所が無いので落とした）。
    (8) 鍵（compact_instructions_needed）（自動の圧縮の回数（M-a・基準 12 回 / 25.37 時間）と圧縮の後の立て直しの割合（M-g・基準 12.9%）のどちらも下がらない窓）・向き 前の窓より下がらない・閾値 基準（B1 と B4 の着地の前の同じ長さの窓）・窓 B1 と B4 の着地から 7 日 → 根の CLAUDE.md の Compact instructions の生成と CLAUDE.md を外す欄（omitClaudeMd・選択肢 辛）を問い直す。
plain: |
  AI の席（司令塔）が一人で何でもやっていて、頭の中（文脈）がすぐ一杯になり、25 時間に 12 回も「要約して詰め直し（圧縮）」が起きていました。持ち主は「司令塔は話す・決める・承認するだけにし、機械的な手は道具（器）へ、調べと照らしは既存の係へ」という案 B を選びました。この記録は、それを Claude Code の公式の仕組みに沿って入れる形を決めます。
  1. 係の報告を 1 通にします。今は係が終わる時に同じ中身を 2 回（自分で送る報告と、自動の終わりの知らせ）届けていて、届いた字の半分近くが重なりでした。報告は「状態・要点 3 行・出した file の場所」の 5 行にし、門で形を検めます。
  2. あなたは teammate（チーム機能の仲間）の機能も十全に使えることを求めましたが、10 月 7 日に「チーム機能を切る」案を選びました。係は標準の「背景の係（subagent）」で起こします。失う物は 9 つあります（自動の途中の配り・チームの名簿・係に乗る既定の指示ほか）。切るのは、門と手引きの替えが入り、あなたの /reload-plugins で当たり、係が誰も動いていない時に限ります。
  3. 圧縮の後に「終えたが採否の済んでいない係」の一覧を自動で出し、圧縮の回数と要約を記録します。文脈が大きくなり係が誰も動いていない時は、新しい session へ引き継ぐ区切りを、次の入力の時に知らせます（止めはしません）。
  4. 係の数の上限、係が係を起こすことの禁止、頼みの書き方の型を、門で守らせます。
  5. 設計の当てと commit、bead の起票、時刻打ち、検査を、司令塔の手から道具へ移します。
  6. 司令塔は 10 月 6 日に起きた後の道具の直し 6 本を読み込んでいません。あなたの /reload-plugins で当たります。当たったかを道具が知らせる口も足します。
  決めてほしい値は 4 つです: 動く係の上限（推奨 5・設計係 2）、引き継ぎの区切り（推奨 35 万 token）、司令塔の 1 回の読みの知らせの線（推奨 30 KB）、報告の上限（推奨 5 行・600 字）。
approval:
  who: 持ち主
  date: 2026-10-07
  ruling: "t3-hub.92.10.7（裁定 id = t3-hub.92.10.7:20261007T0338Z-1・notes に逐語）"
  verbatim: "承認する"
  surface: R-8
note: |
  第 3 稿の起草は係 w401a（2026-10-07）。第 2 稿（係 w396a）に、持ち主の teams の裁定（t3-hub.92.10.2:20261007T0251Z-1・案 甲）を写し（context の H8・決定 (2)(3)(4)(9)(10) の分かれの字・選択肢 甲・丁・庚・plain の 2）、写しの床の違反を字の直しで消した。決めの中身（行 B1〜B16 の形・値の推奨・撤退の鍵）は替えていない。行の id は B1〜B16 の仮の名（B7 は欠番）で、席が契約の行の id に替える。
  名の 2 つの列: 選択肢の名（甲〜辛）と teams の案の名（甲・乙・丙）は別の列である。teams の案 甲は選択肢 甲の中身、乙は選択肢 庚、丙は選択肢 丁に当たる。
  床に合わせた字の直し: 語彙に無い英字の語は「日本語（原語）」の形にした。D-2 の言い換えの「SendMessage で重ねない」は語彙に無い英字の語に当たるので「知らせ（SendMessage）で重ねない」にした（要の写しは 5,965 byte）。当ての時は、規則の表に R-48〜R-51 を足し、条 P-7・P-13・P-16 の relations.rules に R-51・R-49 と R-50・R-48 を足し、D-12 の refs に R-48 を足す（どれも写しで床が求めた）。
  写しの照らし（撃った命令と rc は drafts/w401a/w/notes.md）: 写しの床は rc 2・違反 0・まだ分からない 4（R-48〜R-51 の裁定の欄の未記入）。D-2・D-5・D-12 を替えた写しでは、まだ分からない が 7（D-2・D-5・D-12 の裁定の欄の未記入を足す）。
