# 判断の記録 ADR-34 — 器 scribe2 の持ち込みの後、入れ子の入力に触れない便では tsuzuri の検査の入れ子の段を省き、この host で日に 1 度全部を撃つ（持ち主の裁定 t3-hub.74.39・記帳先 = tsuzuri の台帳の問いの notes）
# 判断の記録 ADR-33 の帰結の欄の「未決（入れ子の段の重さ）」を決める。ADR-33 の本文は封で凍っているので変えない。
# 起草は係 w94a（2026-10-03）。材料は予行 w92a（drafts/w92a/w/notes.md）・検証役 qv92 の結論（案 1′）・問い t3-hub.74.39 の本文。承認の欄は席が埋める（下書きは欄を置かない）。
id: ADR-34
title: 器 scribe2 の持ち込みの後、入れ子の入力に触れない便では tsuzuri の検査の入れ子の段を省き、この host で日に 1 度全部を撃つ（器の crate を根の workspace に入れる行までの手当て）
status: accepted
date: 2026-10-03
context: |
  判断の記録 ADR-33 は器 scribe2 を番号を保つ合流（merge）で scribe2/ に持ち込むと決め、帰結の欄に「未決（入れ子の段の重さ）」を残した。tsuzuri の検査（xtask の check）の最後の段（行 v-gate・xtask の nested の module）は、根の直下の入れ子の workspace ごとに組み（build）・歯（nextest）・clippy・入れ子の xtask の check を撃つ。持ち込みの後は、器に触れない便でもこの段が毎回撃たれる。
  予行（係 w92a・tsuzuri の main に器の main を番号を保って合流させた写しの木）の数。器の便の木は便ごとに新しい作業木（worktree）で、組みの置き場の環境変数も無いので、入れ子の段は検査のたびに冷えた 4 段を払う。壁の時計で 207 秒・演算の装置（CPU）で 458 秒・書き込み 4.74 ギガ（GB）（取り消された分を引いた正味 2.35 ギガ（GB））。根の検査の全部は約 270 秒から 430 秒に延び、正味の書き込みは約 4.8 から 7.2 ギガ（GB）に増える。便 1 本で検査は 2〜3 回撃たれる（作業の席・門・着地の確かめ）。器の歯 4,004 本は全部緑だった。揺れる器の歯 1 本（混んだ時の着地後の検出の歯）が 1 度落ち、単独の 5 回は緑だった。
  検証役（qv92・cargo を撃たず、code の行と探りで確かめた）。入れ子の 4 段の結果を替えうる scribe2/ の外の物は、toolchain の版の固定 と cargo の設定と段そのもの（rust-toolchain・rust-toolchain.toml・.cargo/・xtask/src/・xtask/Cargo.toml）と、環境変数と host の道具である。器の門が git で読むのは scribe2/ の下だけで、上への path 30 か所も全部 scribe2/ の内である。根の部品の定めと錠と clippy の設定（Cargo.toml・Cargo.lock・clippy.toml）と nextest の設定は、器の workspace の結果を替えない。比べる基は送り先の main（origin/main）との合流の基（merge-base）にする。local の main は器の着地の確かめの木で squash の後に進むので使わない。名の一覧で差を見ると改名の元の名を落とすので、差は静かな形の終了の値で見る。
  2026-09-26〜10-03 に着地した便 410 本のうち、この集合に触れた便は 20 本（4.9%）だった。席は持ち主に問い（t3-hub.74.39）を出し、持ち主は推奨の案 A で答えた（2026-10-03T08:25Z）。
decision: |
  (1) 省く形（行 v-skip・ノート surface-wave27a）。tsuzuri の検査の入れ子の段は、入れ子の workspace を数えた 1 行の後、段が数えた dir ごとに省くかを判じる（dir の名を scribe2 と字で決め打たない）。比べる基（base）は HEAD と送り先の main（origin/main）の合流の基（merge-base）とする。base から作業木までの差（index と作業木の直しを含み、改名は消すと足すに割る）と、未追跡（untracked）の file のうち除外の一覧（.gitignore）の外の物が、その dir の入れ子の入力に 1 つも触れなければ、その dir の 4 段を撃たない。差は git の差（diff）の静かな形（--quiet）の終了の値で見る。
  (2) 入れ子の入力は 6 つ（<dir>/・rust-toolchain・rust-toolchain.toml・.cargo/・xtask/src/・xtask/Cargo.toml）。dir の下と、toolchain の版の固定 の 2 つと、cargo の設定の dir と、xtask の段そのものの 2 つである。一覧は xtask の code の定数が持ち、歯が字で固定する。規則の行は足さない。根の部品の定めと錠と clippy の設定（Cargo.toml・Cargo.lock・clippy.toml）と nextest の設定は入れない（器の workspace の結果を替えない）。
  (3) 全部を撃つ時。根が git の木の根でない時・base を読めない時（送り先の main の印が無い・共通の祖先が無い）・base から HEAD までに自分の commit が無い時（送り先の main そのものの木）・全部を撃たせる環境変数（TSUZURI_CHECK_NESTED_ALL）が在る時（値を問わない）。この環境変数は全部を撃たせる向きだけで、省かせる向きの口は置かない（条 N-3）。
  (4) 省いた時も dir ごとに 1 行を出す（省いた事と base の頭 12 字）。全部を撃つ時は理由を 1 行で出す。数えた 1 行（nested workspaces=）は今のまま出す。入れ子の workspace が無い木（今の main）では判じを呼ばず、出す行も撃つ物も替わらない。
  (5) CI は全部を撃つ。CI の手順（ci.yml）の検査の役（job check）の環境に全部を撃たせる環境変数（TSUZURI_CHECK_NESTED_ALL）を置く（変更の頼み（PR）の木は送り先の main との差で省けてしまうため）。器の共通の確かめ（.vessel.toml の common-verify）には置かない。
  (6) 日に 1 度の全部の撃ち。この host で日に 1 度、送り先の main の木で、全部を撃たせる環境変数（TSUZURI_CHECK_NESTED_ALL）を置いて tsuzuri の検査の全部を撃つ。置き場は host の利用者の時計の仕掛け（systemd --user の timer）とし、組みの置き場は作業木の外の 1 か所に置いて温かく保つ。落ちた時は席への memo を起こし、通った時は日付と終了の値を記録の file に 1 行足す。撃つ仕掛け（timer の定義と撃つ script）は repo の file にして行で置き、散文だけの決まりにしない（条 N-2）。host の固有の値（repo の path・組みの置き場）は仕掛けを入れる時の設定に置き、code の分かれ道にしない。行は置き場を入れる時に席が起こし、持ち込み（T）の前に着地させる。〔席の決め・案 a の中の置き場〕
  (7) 失う物は 3 つで、0 ではない。(ア) host の道具と設定のずれ（git・tmux・nextest・rustup の版・$CARGO_HOME と祖先の .cargo の設定）は、別の機械の CI では見つからない。今は次の便の門で見つかる所が、遅くとも 1 日後の全部の撃ちで見つかる形に替わる。(イ) 時刻で落ちる型（器の歯は日付の字を 289 か所持つ）は、着地の後の CI で見つかる。今は門で全部の便が止まるが、省くと便は着地を続け、CI の落ちの bead が積もる。(ウ) 混んだ時だけ揺れる歯をこの host で見る回数が減る（無関係な便が器の揺れる歯で落ちることも減る）。
  (8) この省きは、器の crate を根の workspace に入れる行（v-join）までの手当てである。v-join の行で入れ子の段が無くなる時に、省きの module と環境変数と日に 1 度の撃ちを畳むか見直す。
  (9) CI の時間。今の CI の 1 回（直近の 3 回）は 223〜235 秒で、検査の役の最長は 218〜231 秒（その中の検査の段は 106〜194 秒・残りは用意）。今は検査の役の 8 つが、歯の 8 分の 1 のほかに、根の clippy 2 つと面の組み立てを同じ commit で 8 度ずつ撃っている。持ち込みの後は入れ子の組みと clippy と器の xtask の check も 8 度ずつ足され、最長の役は約 380〜630 秒の見込みで、規則の行 R-5 の検出線（CI 5 分）を越える。持ち込み（T）の前に、歯でない段（根の clippy 2 つ・面の組み立て・入れ子の build と clippy と器の xtask の check）を割り（partition）の役に 1 つずつ振り分けて CI の 1 回に 1 度ずつ撃ち、歯だけを 8 つに分ける行（v-ci-split）を置く。同じ commit の同じ段は、どの役で撃っても同じ結果なので、失う物は無い。割りの無い手元の撃ちは今のまま全部の段を撃つ。持ち込みの後の最初の CI 3 回の役の最長を測り（行 v-ci の確かめ）、R-5 の線と照らす。〔席の決め〕
  (10) 行 v-skip と行 v-ci-split と決定 (6) の日に 1 度の撃ちの行は、持ち込み（T）の前に着地させる。今の main に入れ子の workspace は無いので、v-skip の着地の時に振る舞いは替わらない。〔席の決め〕
options:
  - id: a
    name: 省く形と日に 1 度の全部の撃ち（案 1′）
    text: 決定 (1) から (10)。入れ子の dir ごとに、送り先の main との合流の基からの差（作業木と未追跡を含む）が入れ子の入力 6 つに触れなければ省き、1 行を出す。base が読めない・自分の commit が 0・環境変数が在る時は全部。CI は環境変数で全部。日に 1 度の全部の撃ちは host の利用者の時計の仕掛けで撃つ。
    verdict: adopted
    reason: 持ち主が問い（t3-hub.74.39）で推奨の案 A を選んだ。code が原因の落ちは見落とさず、host のずれも 1 日以内に見つけ、便の約 95% で検査 1 回あたり壁 約 207 秒・正味 約 2.35 ギガ（GB）を浮かす。1 日約 51 便・検査 2〜3 回として正味で 1 日 約 230〜340 ギガ（GB）で、規則の行 R-40 の予算の線（1 日 1.5 テラ（TB））の 15〜23% にあたる。日に 1 度の全部の撃ちの足しは 1 回 207 秒・正味 約 2.35 ギガ（GB）以下。
  - id: b
    name: 省かない（案 B）
    text: 今の作りのまま、全部の便の検査で入れ子の段を撃つ。
    verdict: rejected
    reason: 器に触れない便が約 95% で、その便の検査ごとに冷えた入れ子の 4 段（207 秒・正味 2.35 ギガ（GB））を払い続ける。揺れる器の歯で無関係な便が落ちる。
  - id: c
    name: 省くだけ（案 C）
    text: 案 a の省く形だけを置き、日に 1 度の全部の撃ちは置かない。
    verdict: rejected
    reason: 入れ子の入力に触れる便が来るまで（予行の数で 20 便に 1 本・日をまたぐことがある）、host の道具と設定のずれをこの host で見ない。
  - id: d
    name: 入れ子の入力の印（hash）で見分ける
    text: 器の木の印・根の 4 つの file の中身・道具の版・割りの字から印を作り、入れ子の 4 段が通った時に木の外の置き場へ印の file を書き、同じ印が在れば省く（予行の案 2）。
    verdict: rejected
    reason: 木の外の状態が合否を左右し、commit と木から読める事だけで判じる監査に合わない。印の置き場の掃除の決まりも要る。
  - id: e
    name: 器の門が便の書く範囲（write-set）で見分ける
    text: 便の契約の書く範囲に入れ子の入力が無ければ、器が tsuzuri の確かめに省く旗を渡す（予行の案 3）。
    verdict: rejected
    reason: 器の code の直しと判断の記録が要り、器への頼みの列に並ぶ。省かせる向きの旗を器から渡す口になる（条 N-3）。
  - id: f
    name: 日に 1 度の撃ちを器の着地後の検出線に置く
    text: tsuzuri の器への宣言に着地後の検出線の行（detection-verify）を足し、日次の間引き（規則の行 detection.daily_min_s・86400 秒）に乗せて全部を撃つ。
    verdict: rejected
    reason: 着地が起こす形で、着地の無い日は撃たず、器の検出の範囲の外の差だけの日は撃たずに進む。宣言の行に環境変数を書けないので、全部を撃たせる別の口（旗）が要る。検出線では終了の値 1 も測れた周として記し、落ちても board の札・memo・bead のどれも出ないので、席に届かない。
  - id: g
    name: 日に 1 度の撃ちを GitHub の定時の撃ち（cron）に置く
    text: tsuzuri の CI の手順に定時の起こし（schedule）を足し、日に 1 度全部を撃つ。
    verdict: rejected
    reason: 別の機械で撃つので、失う物 (ア) の host の道具と設定のずれを見つけない（裁定の「この host で」に合わない）。
  - id: h
    name: 器に日に 1 度の撃ちの口を頼む
    text: 器に、宣言した命令を日に 1 度撃って落ちを札と memo で知らせる口を足してもらう。
    verdict: rejected
    reason: 器の code と判断の記録が要り、器への頼み（着地の確かめを温かい木で・落ちた便の組みを残す）の後に並ぶので、持ち込み（T）の前に間に合わない。ほかの project も使いたくなった時に改めて頼む（帰結の欄）。
basis: [ADR-33, ADR-18, ADR-22, ADR-31, P-1, P-23, N-2, N-3, R-5, R-40]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、持ち込みの epic t3-hub.74 の notes に 1 件ごとに記帳する（日付・材料・当たった条件）。問う相手は持ち主。
    (1) 入れ子の段を省いた便の後に、日に 1 度の全部の撃ちか CI で、入れ子の入力の一覧の外の物が原因の入れ子の落ちが 1 度でも見つかったら、その物を一覧に足す行を起こす。一覧に足せない物（木の外の物）なら、省く形を問い直す。
    (2) 日に 1 度の全部の撃ちが 2 日続けて撃たれないか、host のずれで 2 日続けて落ちたら、省く形を問い直す。
    (3) CI の役の最長が 900 秒を越えた回（器の ci:unmeasurable）が、決定 (9) の手当ての後にも在れば、CI の割りの形を問い直す。
    (4) 着地した便のうち入れ子の入力に触れた便が、7 日で 30% を越えたら、省く形の得を測り直して問い直す。
plain: |
  器（scribe2）を tsuzuri に持ち込んだ後の検査の重さを減らす決めです。あなたの答え（案 A）で決めました。
  持ち込んだ後は、tsuzuri の作業 1 本ごとの検査に器の検査（組み立て・テスト 4,004 本・lint・器自身の検査）が加わり、1 回あたり約 3.5 分と、記憶の装置（SSD）への書き込み約 2.4 ギガ（GB）が足されます。作業の約 95% は器にも器の検査結果を左右するファイルにも触れません。
  その作業では器の検査を省きます。省いたときも 1 行の記録を出します。比べる相手が分からないとき・CI のときは、省かずに全部を撃ちます。
  そのかわり、このパソコンで 1 日 1 回、器の検査を全部撃ちます。落ちたら席に知らせが届きます。
  省いても、コードの変化が原因の不具合はこれまでどおり見つかります。違いは、パソコンのツールや設定のずれ・時刻で落ちる不具合・混んだときだけ落ちるテストが、見つかる場所と時期だけです。
  この形は、器を tsuzuri の部品の一覧に入れる作業（v-join）までの一時の手当てです。
  この記録はあなたの承認で発効しています。承認の記帳先は tsuzuri の台帳の問いです。
approval:
  who: 持ち主
  date: 2026-10-03
  ruling: t3-hub.74.39（裁定 id = t3-hub.74.39:20261003T0825Z-1・器に触れない便で入れ子の段を省き host で日に 1 度全部を撃つ案 A・席とのチャット・notes に逐語）
  verbatim: "先程の質問はAで"
  surface: R-8
consequences:
  - 未決（日に 1 度の撃ちの行）。決定 (6) の撃つ仕掛け（host の利用者の timer の定義と撃つ script・作業木の外の組みの置き場・落ちた時の memo の書き口・記録の file）を置く行は、席が置き場の細部（memo の書き口と、器の席の掃除との兼ね合い）を決めてから起こし、持ち込み（T）の前に着地させる。
  - 未決（器の build.rs の組み直し）。器の build.rs は根の追跡 file の全部と git の HEAD と index を組み直しの合図に出すので、入れ子を撃つ便では根の file の直しや commit のたびに器の 2 crate を組み直す（予行で温かい木でも正味 1.44 ギガ（GB）・約 12 秒）。省く形はこれを省いた便で避けるだけで、入れ子を撃つ便には残る。器への任意の頼みか、持ち込みの後の tsuzuri の便で直す。
  - 未決（CI の入れ子の組みの控え）。CI の組みの控え（rust-cache）が根の target の下の入れ子の置き場を控えるか、控えの大きさがどれだけ増えるかは、CI に器の門を足す行（v-ci）の確かめで測る。決定 (9) の見込みの幅はこれに依る。
  - 未決（規則の行 R-5）。決定 (9) の振り分けの後も、持ち込みの後の CI の役の最長が検出線の 5 分を越えるなら、R-5 の値か CI の割りの数を持ち主に問う（検出線は止めない線のまま）。
  - 器に日に 1 度の撃ちの口を頼むのは、ほかの project も同じ撃ちを要る時に改めて考える（案 h）。
note: 起草 w94a。数は予行 w92a（tsuzuri の main 59fe9ec1 に器の main 6853db51 を番号を保って合流させた写しの木 aaba030d）と、検証役 qv92 の結論（案 1′）と、問い t3-hub.74.39 の本文と、CI の直近の 3 回（main eb74bdf5・5c8fe2b4・645d50c2 の push の回）による。同じ commit で、判断の記録の封（anchors/adr-seals.yaml）に ADR-34 の行を足す（tz check --freeze-adrs）。ADR-33 の本文は封で凍っているので変えず、帰結の欄の「未決（入れ子の段の重さ）」の決めはこの記録が持つ。逐語は問い t3-hub.74.39 の notes。
