# 判断の記録 ADR-1037 — 器 scribe2 の判断の記録 ADR-0037 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1037
title: "run 無しの裁定も承認 event として器が持つ (event kind RulingReceived・逐語は detail・裁定 id は器が打つ ts・書き手は対話面の席の口 1 つ・manifest の裁定 id との突合は doctor)"
status: accepted
date: 2026-09-16
context: |
  憲法 C7.2 は受け取った承認をすべて逐語付きの承認 event として持てと言うが、 便 (run) の無い裁定 (rules 行の値・閾値・方針) は台帳の散文にしか無く器の event は 0 件だった。 run を持たない event kind を 1 つ足し、 対話面の席の口 1 つで書き、 rules 行の裁定 id と突合できるようにする。
  なぜこの判断が要るのかを、実測と現物から説明します。器の記録に承認の event が 1 件も無く、その日の裁定はすべて台帳の散文にだけ在りました。既存の承認 event は便の id を必ず要り、便の無い裁定を書く口がありません。一方で便を持たない記録の種類は既に 5 つ在り、規則の表には裁定 id の形も在ります。
  CTX1 承認 event が器に 0 件で、 裁定は台帳の散文にしか無い
  管理席の実測 (2026-09-16 03:35Z・母集団 = event log の全 kind の件数) で ApprovalRequested と ApprovalReceived は 0 件、 pipe report も human_events=0。 同日の user 裁定 (rules 行の値・憲法 A2 の閾値・口座選定の方針) はすべて台帳の acceptance / notes の散文にだけ在る。 憲法 C15.2 (rule を変える PR と台帳項目は裁定 id（その裁定を指す時刻の印） を参照) は満たすが、 C7.2 (受け取った承認はすべて逐語付きの承認 event) は満たしていない。
  CTX2 現物 — 承認 event は run を必須に持ち、 run の無い裁定を書く口が無い
  EventKind::ApprovalReceived (actor = human) は在り、 pipe approve --words と fleet record で書けるが、 どちらも run と bead を要る形である。 run が立つ前に対話面（user と話す唯一の席） (planner の席・rules 行 R-C7-1) で受ける裁定 (契約の rules 行の値・A2 の閾値・方針) を記す口は無い。 run を持たない event kind は既に 5 つ在る (口座残量 2・席の登録・口座の退役と復帰・schema 版は 1 のまま・ADR-1017 の口座残量と ADR-1026 の登録と退役の前例) ので、 run の有無は kind ごとに決まる形が現物である。 直命の表 (ADR-1031 §2.1・FR1065) も run を持たず逐語を運ぶ kind として設計されている。
  CTX3 裁定 id の形は manifest の行に既に在る
  rules 行の ruling 欄は「user <UTC の時刻>」の形 (例 = 分までの ts) で裁定を名指す。 裁定が event に無いと、 この id が指す先 (逐語) が台帳の散文にしか無く、 憲法 C14.2 の向き (文書と manifest の drift を機械が見る) の裁定版が無い。 CI は private な台帳と host の event log に届かないので、 突合は doctor の面 (FR1051 の台帳 lint と同じ置き場) になる。
  CTX4 憲法の向き
  C7 は承認を対話面 1 つ (R-C7-1) を通して受け、 C7.2 は受け取った承認をすべて逐語付きの承認 event として記録する。 本 ADR は C7.2 の「承認」を、 A2 の user ruling と C5 の裁定 id が指す裁定を含むと読む解釈の記録である (憲法の条文は動かさない・解釈が要る変更は ADR を書く条件)。 C5 は rules 行の変更に裁定 id を要する。 C15 は台帳を task と裁定だけに使う (裁定の記帳先は台帳でよいが、 C7.2 の event はそれとは別に要る)。 C3 は状態を 1 つの DB (event log) に置く。 N1 は不可逆な削除をしない (append-only の log に偽の run id を書いて後から消す形は取れない)。 ADR-1004 §2.5 は schema の非互換な変更で版を上げる (kind の追加は既存の行をすべて読める側)。
  （選択肢を測るものさし）判断を評価する 4 本のものさしです。受けた裁定を便の有無で漏らさないこと、既存の承認 event の意味と読み手を変えないこと、書き手を対話面の席の口 1 つに限ること、規則の表の裁定 id と突き合わせられることです。
  DR1｜受け取った裁定はすべて逐語付きの event になる (run の有無で漏らさない) 憲法 C7.2 / SRS FR1041
  DR2｜既存の承認 event (run の不可逆操作の承認・FR1015 / FR1016) の意味と読み手を変えない SRS FR1015 / FR1016 / ADR-1016 §2.2 / §2.3 / ADR-1004 §2.5
  DR3｜書き手は対話面の席の口 1 つ (R-C7-1 の役割の席からしか書けない・偽の run id を要らない) 憲法 C7 / N1 / SRS FR1041
  DR4｜rules 行の裁定 id と event が突合できる (裁定 id は 器が打つ ts・突合は doctor が読むだけ) 憲法 C5 / C14.2 の向き / C10.2 (doctor は判定しない)
decision: |
  選んだ案と、それが要件書のどの要件を支えるかを示します。便を持たない裁定の記録の種類を 1 つ足し、対話面の席の口 1 つで書き、印は器が打った時刻にします。到達点の計測ではこれを承認と同じ側に数え、doctor が規則の表の裁定 id と突き合わせて名指します。
  採用 — OPT1
  本 ADR は C7.2 の「承認」に裁定 (A2 / C5) を含めて読む。 その上で器 SHALL 便を持たない裁定を承認 event として持つ = EventKind に RulingReceived (actor = human・run を持たない kind・bead と rule は任意の key・detail = user の逐語で空なら 1 byte も書かない・schema 版 1 のまま・既存の行はすべて読める) を末尾に足し、 裁定 id SHALL 器が打った event の ts とする。 器 SHALL この kind を対話面の席の口 1 つ (seat ruling add --state-dir S --target T --words <逐語> [--bead B] [--rule ID]) からだけ書き、 T の登録 row の役割が rules 行 R-C7-1 の役割でない周は typed に断り、 seat ruling ls で逐語付きに列挙する。 pipe report SHALL rulings の件数を出し、 人由来 event のうち承認と見なす kind を ApprovalReceived と RulingReceived の 2 つとする。 doctor SHALL manifest の ruling 欄が user <ts> の形の行ごとに、 同じ分の ts を持つ RulingReceived の有無を読んで名指し (母集団と対・判定しない)、 CI は撃たない。 既存の ApprovalReceived (run の不可逆操作の承認) と ApprovalRequested の意味・読み手・resume の経路 SHALL NOT 変わらない。 planner の雛形 SHALL 「裁定を受けた turn の中で seat ruling add を撃つ」の 1 行 (pointer 付き・規範文 0) を持つ。
  （平易）便の無い裁定は、便を持たない記録の種類「裁定を受けた」として器に残します。user の言葉をそのまま持ち、空なら書きません。書けるのは user と話す席の口 1 つだけで、印は器が打った時刻です。到達点の計測では承認と同じ側に数え、doctor は規則の表の裁定 id ごとに同じ時刻の記録が在るかを読んで名指します。一覧の口で逐語付きに並べられます。突き合わせは doctor が読むだけで CI では撃ちません。既存の承認 event（要求と受領）の意味は変えず、planner の手引きに「裁定を受けた周にその口を撃つ」の 1 行を足します。
  （理由）憲法は受けた承認をすべて逐語付きの event として持てと言い、実測ではその event が 0 件でした。既存の承認 event は便の承認のために便 id を要り、そこを緩めると意味と読み手が混ざります。便を持たない記録の種類は既に在り、同じ形で 1 つ足せば既存を壊さずに済みます。印を器が打つ時刻にすれば、規則の表の裁定 id と同じ形になり、doctor が突き合わせて名指せます。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1041（claim）: 承認の記帳が R-C7-1 の対話面の役割の権能であることを、 run 無しの裁定にも同じ口で通す (役割は FR1040 の登録 row から解き、 違えば断る)。
  FR1067（claim）: planner の雛形に「裁定を受けた turn で口を撃つ」の 1 行を pointer 付きで足す = 対話面の作法の行が 1 本増える (契約表の行 h)。
  FR1022（claim）: 到達点の計測で人由来 event のうち承認と見なす kind に RulingReceived を足す。 「approval 以外が 0 件」の免除集合が 1 kind から 2 kind になる = 指標の意味を広げる変更であって、 裁定を書いても 0 件が保たれるのはその広げ方による。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この ADR が版の系譜のどこに在るかと、判断が最後に行き着く原則です。既存の決定記録は置き換えず、便の承認と直命の記録はそのままです。設計 doc の「便 id は必須」の記述だけを、記録の種類ごとの規則に読み替えます。
  改訂状態: current
  置き換える ADR: なし (新規)
  置き換えられた: なし (現行)
  本 ADR は現行。 既存の ADR を置き換えない。 ADR-1016 §2.2 / §2.3 の承認 (run の Blocked からの再開・逐語は承認 event にだけ載る) と ADR-1031 §2.1 の直命の表 (user の発言の記録) はそのまま。 裁定は直命 (発言) とは別の kind で、 直命を閉じる記録が持つ裁定 id (FR1065) は本 ADR の event の ts を指せる。 設計 fleet-event-log.md §3 の「run は必須」の記述は kind ごとの規則に読み替える (現物の前例に合わせる)。
  照会終端 — PRIN-EVERY-RULING-IS-AN-EVENT
  user から受け取った承認と裁定は、 便の有無に関わらず、 逐語を持つ event として器の 1 つの log に残す。 台帳や散文は event の写しであって正本ではない。
  本 ADR の判断はこの原則に行き着く (これ以上は遡らない照会終端)。
options:
  - id: "OPT1"
    name: "run を持たない event kind RulingReceived を 1 つ足し、 対話面の席の口 seat ruling add が書く"
    text: |
      EventKind の末尾に RulingReceived (actor = human・run と bead は kind の規則で run 無し・bead と rule は任意・detail = 逐語で空なら書かない・schema 版 1 のまま) を足す。 書く口は seat ruling add --target T --words <逐語> [--bead B] [--rule ID] の 1 つで、 T の登録 row の役割が R-C7-1 の役割でなければ typed に断る。 裁定 id は器が打った event の ts。 pipe report は rulings=<n> を出し、 人由来 event のうち承認と見なす kind に RulingReceived を足す。 doctor は manifest の ruling 欄が user <ts> の形の行ごとに同じ分の ts の RulingReceived が在るかを読んで名指す (判定しない)。
      （平易）記録の種類に「裁定を受けた」を 1 つ足します。便の id は持たず、user の言葉をそのまま持ち、空なら書きません。書けるのは user と話す席の口 1 つだけで、その席でなければ断られます。印は器が打った時刻です。到達点の計測では承認と同じ側に数え、doctor は規則の表の裁定 id ごとに同じ時刻の記録が在るかを読んで名指します。
      利点: C7.2 が run の無い裁定にも成立し、 rules 行の裁定 id が指す逐語を器から引ける
      利点: 既存の ApprovalReceived (run の承認) の意味・読み手・FR1016 の再開の経路を 1 字も変えない
      利点: run 無しの kind（便に属さない記録の種類） の前例 (口座残量・登録・退役) と同じ読み手の形で、 schema 版を上げない
      欠点: EventKind の variant と key (rule) が増え、 literal 構築点・件数 pin・property の生成器・snapshot が契約に載る
      欠点: 裁定を受けた turn で口を撃つ作法が planner の雛形に 1 行増える (撃ち忘れは doctor の名指しで見える)
      欠点: manifest の古い裁定 id (分が曖昧な形) は突合の母集団に入らず、 doctor は skipped の件数で数えるだけになる
    verdict: adopted
    reason: "EventKind の末尾に RulingReceived (actor = human・run と bead は kind の規則で run 無し・bead と rule は任意・detail = 逐語で空なら書かない・schema 版 1 のまま) を足す。 書く口は seat ruling add --target T --words <逐語> [--bead B] [--rule ID] の 1 つで、 T の登録 row の役割が R-C7-1 の役割でなければ typed に断る。 裁定 id は器が打った event の ts。 pipe report は rulings=<n> を出し、 人由来 event のうち承認と見なす kind に RulingReceived を足す。 doctor は manifest の ruling 欄が user <ts> の形の行ごとに同じ分の ts の RulingReceived が在るかを読んで名指す (判定しない)。"
  - id: "OPT2"
    name: "ApprovalReceived の run を任意にし、 run 無しの承認も同じ kind で書く"
    text: |
      既存の kind の run 必須を緩め、 run の無い行を承認として読む。
      （平易）既存の承認 event の便 id を任意にする案です。記録の種類は増えませんが、便の操作の承認と値の裁定が 1 つの種類に混ざり、古い読み手が壊れた行と読みます。
      利点: kind を増やさない
      欠点: 「run の不可逆操作の承認」(FR1015 / FR1016・resume の経路が読む) と「値や方針の裁定」が 1 つの kind に混ざり、 読み手が run の有無で分岐する
      欠点: 旧い読み手は run の無い ApprovalReceived を malformed と読む。 旧い読み手が読めない点は kind の追加 (未知の kind と未知の key) でも同じで、 違いは既存 kind の意味と読み手を動かさずに済むかどうか
    verdict: rejected
    reason: "既存の kind の run 必須を緩め、 run の無い行を承認として読む。"
  - id: "OPT3"
    name: "fleet record に bead 名義の偽の run id を渡して ApprovalReceived を書く"
    text: |
      口を足さず、 run id の欄に bead id や印を入れて既存の口で書く。
      （平易）既存の口に偽の便 id を渡して書く案です。器を変えずに済みますが、消せない記録に作り物の id が残り、便の数が狂います。
      利点: 器の変更が無い
      欠点: append-only の log に捏造の run id が残り、 N1 で消せない
      欠点: replay が偽の run を便として数える (report の runs が汚れる)
    verdict: rejected
    reason: "口を足さず、 run id の欄に bead id や印を入れて既存の口で書く。"
  - id: "OPT4"
    name: "台帳の notes を裁定の正本とし、 event は持たない (現行)"
    text: |
      裁定は台帳の散文に書き、 rules 行は裁定 id で台帳を指す。
      （平易）今の形です。台帳の散文に裁定を書き、規則の表が裁定 id で台帳を指します。運用は回っていますが、憲法が求める逐語付きの event が無く、id の指す先を機械が確かめられません。
      利点: 既に運用されている
      欠点: 憲法 C7.2 (承認 event) に反する。 台帳は規律を持たない (C15) が、 逐語の唯一の置き場が台帳では器から引けない
      欠点: 裁定 id の指す先を機械が確かめられない
    verdict: rejected
    reason: "裁定は台帳の散文に書き、 rules 行は裁定 id で台帳を指す。"
  - id: "OPT5"
    name: "裁定の逐語を rules manifest の行に持つ"
    text: |
      manifest の ruling 欄に逐語を書き、 event を持たない。
      （平易）規則の表の行に逐語を書く案です。裁定と値が同じ行に並びますが、公開されている file に user の言葉を写すことになり、値を持たない裁定の置き場もありません。
      利点: 裁定と値が同じ行に在る
      欠点: tracked で公開の manifest に user の逐語を写す (本 repo は公開面で、 口座名や user の逐語を tracked file に書かない制約に反する)
      欠点: 値を持たない裁定 (方針・却下) の置き場が無い
    verdict: rejected
    reason: "manifest の ruling 欄に逐語を書き、 event を持たない。"
basis: [FR1015, FR1016, FR1022, FR1040, FR1041, FR1051, FR1065, FR1067, ADR-1004, ADR-1016, ADR-1017, ADR-1026, ADR-1031]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  user から受けた「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」を、便（pipeline の 1 走行）が無くても器の記録に逐語で残します。記録の種類を 1 つ足し、書けるのは user と話す席（対話面）の口 1 つだけにします。裁定の印（id）は器が打った時刻で、規則の表の裁定 id と突き合わせられるようにし、突き合わせは doctor が読んで名指します。
