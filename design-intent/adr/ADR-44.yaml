# 判断の記録 ADR-44 — tsuzuri の目指す所（設計から code までを 1 つのグラフにつなぎ、便の着地ごとに器が下から積み、ほかの project でも最初から十全に動く）と、合流の残り・器の宿題・目指す所を進める 5 段の順（持ち主の裁定 2026-10-04・記帳先 = tsuzuri の台帳の memo t3-hub.80 と問い t3-hub.80.1・t3-hub.80.5 の notes）
# 起草は席（2026-10-04）。材料は係 w140a（棚卸し）・w141a（つながりの実測）・w142a（目指す形・言語の計画）・w143a（席の記憶の仕分け）の出力と、tailnet の頁「目指す所のすり合わせ」。承認の欄は問い t3-hub.80.1 と t3-hub.80.5 の裁定。
id: ADR-44
title: tsuzuri は、設計の正本から台帳の bead・着地の commit・code までを 1 つのグラフにつなぎ、便の着地ごとに器が code から下へ積み上げ、Rust・TypeScript・Python のどの project でも最初から十全に動くことを目指し、合流の残りと器の宿題と目指す所を 5 段の順で進める
status: accepted
date: 2026-10-04
context: |
  持ち主は 2026-10-04 に、tsuzuri の目指す所を 3 つの発話で示した（memo（t3-hub.80）の notes に逐語）。1 つ目は、器の運用で出た宿題（便の流れの妥当性・台帳のグラフの正確さ・bead の一生）が一部しか解けないまま合流したという見立て。2 つ目は、設計 → bead → code のつながりが切れていて、AI が仕様と憲法と code を結んで設計の品質を上げられていないという見立てと、設計から実装までのグラフ化を便ごとに code から積み上げる器の機能にするという目指す所。3 つ目は、ほかの project でも最初から十全に動くことで、席が記憶に書いて避けている失敗を器の構造が起こさせない形に上げること。続く発話で、TypeScript と Python でもグラフ化と code の検索を十全にし、その対応を計画することを足した。
  係 4 つの調べ（2026-10-04）は次を数えた。閉じた契約の bead 418 本は、件名と記録の札（trailer）で着地の commit に 100% 結び、契約 421/422 が行を通って要件に届く。一方、導出グラフ（ADR-7）には commit・file・関数の節点が 0 で、memo 0/88・epic 0/13 が設計の節点に結ばれず、実装の AI（runner）の指示に要件の本文が 0/472 しか渡らない。器から移した宿題 48 本のうち 32 本が開いたままで、器が自分に掛けていた門の多くは tsuzuri の宣言で名乗られていない。席の記憶 101 本のうち 76 本はほかの project でも起きる失敗で、64 本は記憶だけで守っている。
  今の要件書の目的 GOAL2（全体像を見落とさない）は「台帳と設計文書と走行が 1 つの図に結ばれる」までで、commit と code を含まない。
  問い（t3-hub.80.1）と問い（t3-hub.80.5）は、どちらも案 A に裁定された（裁定 id は承認の欄）。
decision: |
  (1) 目指す所は 3 つ。
  (ア) グラフ（G1）。設計の正本（憲法の条・規則の行・要件と受入基準・判断の記録・設計ノートの契約の行）→ 台帳の bead（memo・問い・契約・epic）→ 着地の commit → code（file・関数と型・歯）を 1 つのグラフにつなぐ。席・実装の AI・審査役は、そのグラフから「この code を縛る仕様と条は何か」「この仕様を実装する code はどこか」を引いて材料にする。
  (イ) 下からの積み上げ（G2）。そのグラフを、便が着地するたびに器が code から下へ積み上げる。
  (ウ) ほかの project（G3）。ほかの project でも最初の日から十全に動く。Rust・TypeScript・Python のどの repo でも、グラフ化と code の検索（名・呼び手・参照・全文）ができる。席が記憶に書いて手で避けている失敗のうち、ほかの project でも起きる物は、器の構造（hook の断り・門・既定値・雛形・lint）が起こさせない形に上げる。
  (2) 要件書の目的。要件書の次の版で、目的 GOAL2 の字を (ア) と (イ) の形に広げ、新しい目的 GOAL5 として (ウ) を足す。
  (3) 席の記憶の上げ。席は、ほかの project でも起きる再発防止を記憶だけで終わらせず、器の構造へ上げる行を置く。上げる順は係（w143a）の表の束の上位 10 から始め、上げた束の記憶は消すか縮める。
  (4) 言語。Rust（今）→ TypeScript（型つきの画面の書き方（TSX）を含む）→ Python の順に足す。器を 1 度だけ「言語の表」と「確かめの形の閉じた列」を読む形に替え、後は宣言と規則の file だけで言語を足せる形を目指す。どの段も、まず試しの小さな repo（drafts の下）で測ってから器の行を起こす。言語ごとの「十全」の合格の物差しと閾値は、段 4 の前に持ち主に問う。
  (5) 順。次の 5 段で進める。
  (段 0) すぐ・小さい物。局面の出力が tsuzuri の置き場で測れない 8 種の直し・導出グラフの不変条件の 3 番（g-3）の違反の原因・席の hook の置き場を凍った元の repo から tsuzuri へ切り替え・実験場の形 B と組みの使い回し（SSD）。
  (段 1) 土台の決め。この記録と ADR-45・ADR-46 を置く。code の節点の名前と名前空間を、器の取り込みの段 3（ADR-39）の前に決める（古い pointer を引ける形にする）。
  (段 2) 合流の残りと土台。取り込みの段 3 と 4・契約の行に done と歯の欄・行から条と判断の記録への辺の型・memo と epic から設計への辺・commit の節点。
  (段 3) AI に届ける。runner と審査役の材料を、グラフの近傍（要件の本文・判断の記録・条・受入基準・触る code の過去の行）から組む。器の門（ADR-45）を、先に要る物を済ませて名乗る。
  (段 4) code の層と言語。関数と型の節点（ADR-46）・器の言語の表・TypeScript と Python の試しの repo。
  並べて進める物: (3) の記憶の上げ（段 0 から）・取り込みの段 5 と自己開発の上げ方（ADR-40）。
  (6) 記帳。段の進みと (3) の上げた束は、memo（t3-hub.80）か後継の memo の notes に記帳する。
options:
  - id: a
    name: 目的を広げて足し、5 段の順で進める
    text: 決定 (1) から (6)。
    verdict: adopted
    reason: 目指す所が型付きの目的の字になり、後の行が目的に結ばれる（条 P-1・N-2.1）。順は、作り直しを避ける順（名前空間を取り込みの段 3 の前に決める）と、効きの大きい順（便の失敗の 96% が設計の側・runner に要件の本文が渡っていない）を両方満たす。
  - id: b
    name: 目的は替えず、memo のまま進める
    text: 目指す所を memo の本文と会話にだけ置く。
    verdict: rejected
    reason: 目指す所が型付きの字にならず、すり合わせの結果が会話に残るだけになる。
  - id: c
    name: グラフを合流の残りより先にする
    text: 段 2〜4 を、取り込みの段 3 と 4 より先に流す。
    verdict: rejected
    reason: 取り込みの段 3 の後に、code の節点の名前と古い pointer の名前空間を作り直す見込みになる。
basis: [GOAL2, GOAL1003, FR2, P-1, N-2, ADR-7, ADR-36, ADR-39, ADR-40]
produced: [GOAL5]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo（t3-hub.80）か後継の memo の notes に記帳する。問う相手は持ち主。
    (1) 段 3 の行の着地の後の 2 週で、本番の 1 回目の着地の率（ADR-36 の基準 G1）が着地の前の 2 週より下がったら、AI に届ける材料の形を問い直す。
    (2) (3) で上げた束の失敗が、上げた後にもう一度起きたら、その束の構造の形を問い直す。
    (3) 言語の段で、試しの repo の合格の物差しに 2 度続けて届かなければ、その言語の読み取りの道具の選びを問い直す。
plain: |
  tsuzuri が目指す所と、そこへ進む順番を決める記録です。
  目指す所は 3 つです。設計（憲法・規則・要件・判断の記録）から作業・commit・code までを 1 つのつながりの図にし、AI がその図から関係する仕様と code を引けるようにすること。その図を、作業が終わるたびに機械が code から積み上げること。ほかの project（Rust・TypeScript・Python）でも最初の日から十分に動き、AI が覚えて避けている失敗を機械の仕組みで起こさせないことです。
  順番は 5 段です。小さな直し → 土台を決める → 合流の残りと図の土台 → AI に材料を届ける → code の層と言語の対応、です。
approval:
  who: 持ち主
  date: 2026-10-04
  ruling: t3-hub.80.1（裁定 id = t3-hub.80.1:20261004T1456Z-1・目指す所の目的は案 A）と t3-hub.80.5（裁定 id = t3-hub.80.5:20261004T1456Z-1・5 段の順は案 A）・束 batch:20261004T1456Z-1・裁定面・notes に逐語
  verbatim: "すべて推奨で進めて良い"
  surface: R-8
consequences:
  - 要件書の次の版で GOAL2 の字を広げ、GOAL5 を足す（決定 (2)）。
  - 合流の完了の基準に 3 つの宿題の門を足す決めは ADR-45、code のグラフの形は ADR-46 に置く。
  - 段 0 の 4 つは、どれも次の行か席の手で始める。
note: 起草は席。数は係 w140a・w141a・w142a・w143a の出力（drafts/<係>/w/）による。
