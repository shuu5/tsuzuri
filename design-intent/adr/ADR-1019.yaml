    reason: "器の記録が採った決定（字は決定の欄・器の記録の §2）。文脈の要約: 便を何本か同時に流すと、 2 本が同じ file を触っていたときに、 後から着地する便が main に追いつこうとして衝突します。 いまの器は衝突した便を「失敗」で止め、 その worktree を畳む口もありません。 user は「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」と問い、 planner の提案 (入口で重なりを排他し、 起きたら実装役に解かせ、 人は質問への回答でだけ関わる) を採り、 「本当に両方が働くかの歯は必須」と裁定しました。 この記録はその形を決めます。"
  - id: "A"
    name: "衝突した便は planner が契約を切り直す"
    text: |
      (A) 衝突した便は planner が契約を切り直す。 却下 (部分採用): 意味を知る側が構造で切り直す強みは、 採用案でも「解けない周は質問で planner に戻る」(§2.2) と「上限到達後は切り直して再 intake」(§2.4) として残る。 すべての衝突を planner に戻す形は planner が律速になり並列を上げるほど悪化する (ADR-1016 §1 の実測と同型)。 採用案の口座枠のコスト (起こし直しごとの turn) と planner の待ち時間を秤に載せ、 機械が解ける衝突 (追随の rebase) は機械に解かせる側を採る。
    verdict: rejected
    reason: "意味を知る側が構造で切り直す強みは、 採用案でも「解けない周は質問で planner に戻る」(§2.2) と「上限到達後は切り直して再 intake」(§2.4) として残る。 すべての衝突を planner に戻す形は planner が律速になり並列を上げるほど悪化する (ADR-1016 §1 の実測と同型)。 採用案の口座枠のコスト (起こし直しごとの turn) と planner の待ち時間を秤に載せ、 機械が解ける衝突 (追随の rebase) は機械に解かせる側を採る。"
  - id: "B"
    name: "管理席が worktree を手で merge して land する"
    text: |
      (B) 管理席が worktree を手で merge して land する。 却下: gate 分離を破り (審査の後に人が編集)、 C16 (逸脱を edit time で止める) に反する。 席の仕事は 3 つのまま (§2.3)。
    verdict: rejected
    reason: "gate 分離を破り (審査の後に人が編集)、 C16 (逸脱を edit time で止める) に反する。 席の仕事は 3 つのまま (§2.3)。"
  - id: "C"
    name: "入口の排他だけを持ち、 衝突時の解消経路を持たない"
    text: |
      (C) 入口の排他だけを持ち、 衝突時の解消経路を持たない。 却下: 回答で write-set が広がる周 (s2-07l.133) と dir 単位の write-set が別 file を触る周に衝突が残り、 Failed の worktree が溜まる。
    verdict: rejected
    reason: "回答で write-set が広がる周 (s2-07l.133) と dir 単位の write-set が別 file を触る周に衝突が残り、 Failed の worktree が溜まる。"
  - id: "D"
    name: "全便を直列に流す"
    text: |
      (D) 全便を直列に流す。 却下: 並列性がゼロで user の目的 (速度) に反する。 直列は「同時に流さない」という管理席の運用であって §2.1 の mode ではない (§2.5)。 直列でも回答で範囲が広がる周の衝突は残る。
    verdict: rejected
    reason: "並列性がゼロで user の目的 (速度) に反する。 直列は「同時に流さない」という管理席の運用であって §2.1 の mode ではない (§2.5)。 直列でも回答で範囲が広がる周の衝突は残る。"
  - id: "E"
    name: "衝突を器が 3-way merge の道具で自動解決する"
    text: |
      (E) 衝突を器が 3-way merge の道具で自動解決する。 却下: 意味の衝突 (同じ関数を別々に直した) は道具で解けず、 道具が「解けた」と言う周を器は疑えない。 採用案でも誤った解決は gate が判定する点は同じだが、 解く主体が契約を読んだ runner であり、 解けない周を質問として人に返せる (道具には返す口が無い)。
    verdict: rejected
    reason: "意味の衝突 (同じ関数を別々に直した) は道具で解けず、 道具が「解けた」と言う周を器は疑えない。 採用案でも誤った解決は gate が判定する点は同じだが、 解く主体が契約を読んだ runner であり、 解けない周を質問として人に返せる (道具には返す口が無い)。"
basis: [FR1004, FR1010, FR1011, FR1014, FR1030, FR1031, FR1032, FR1034, NFR1004, ADR-1009, ADR-1014, ADR-1016, ADR-1018, CON1002]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  便を受け付ける入口で、 まだ終わっていない便が触る file と重なる契約は断ります。 「終わっていない」とは、 着地も失敗も停止もしておらず、 審査で不合格にもなっていない便のことです。 断る理由は「契約を断る理由の一覧」(閉じた一覧) に足し、 判定は 1 本の関数です。 重なりの判定は path の集合の共通部分で、 dir はその配下の file を含みます。 放置された便が邪魔なら、 その便を 1 本だけ止める口で外します。 断られた契約は、 重なる便が終わってから出し直します。
approval:
  who: 持ち主
  date: 2026-09-12
  ruling: "s2-07l.143（器の台帳の id・器の記録の承認の欄が名指す・取り込みの裁定 t3-hub.74.60.1:20261004T0113Z-1）"
  verbatim: "器の台帳 s2-07l.143 の notes に在る（この file に写さない）"
  surface: R-8
consequences:
  - "良い面は、 便を並べても人の手番が「質問に答える」だけに収まること、 衝突が失敗ではなく実装役の 1 turn として処理されること、 衝突や不合格で止まった便を畳めるようになることです。 悪い面は、 実装役の起こし直しの分だけ口座の枠を使うこと、 入口の排他で契約が断られて出し直しの手間が増えること、 write-set を dir で広く取った契約ほど排他に掛かりやすいこと、 止める仕組みの一覧が 2 行増えることです。"
  - "Positive: 並列の便で人の手番が回答 1 種類に閉じる (ADR-1016 §2.3 の形を保つ)。 衝突が段の記帳 (rebase-conflict: を prefix に持つ RunStage) として残り、 回数が replay から読める。 契約単位の拒否が閉じた enum になり、 これまで散文だった理由 (git repo でない・同じ秒の再 intake) も variant として数えられる。 retire の前提が広がり、 Failed と gate FAIL の worktree が溜まらない (N1.2)。 放置された便を 1 本だけ外す口 (pipe stop --run) ができる。"
  - "Negative (受け入れるコスト): 起こし直しは runner の turn を増やし口座の枠を使う (上限は §2.4・枠の自律制御は s2-07l.142)。 排他は dir 単位ゆえ、 同じ dir の別 file を触るだけの契約も断られうる (出し直しは管理席の運用)。 symlink を解かないので、 実体が同じ file を別名で持つ 2 契約は入口で見逃す (編集時の guard が実体名で塞ぎ、 Bash の git 経路は既知の穴のまま)。 rules 行 1 つ・prompt template の節 1 つ・拒否理由の enum 1 つ (variant 2 つ + 既存の散文理由の分)・event の detail の prefix 1 種・極性一覧の行 2 つ・subcommand の flag 2 つ (stop --run・land / resume の --runner)・終端の detail 3 種 (rebase-abort-failed / rebase-dirty / follow-unmeasured) が増える。 ADR-1016 §2.2 の 2 文を読み替える (§2.6)。 Implemented の下位状態 (衝突からの起こし直し待ち) を detail の文字列 prefix で持つ (既存の rebase-empty と同じ形・C3.3 の向きとの緊張は受け入れる・段の variant を増やすと replay と fleet の閉じた enum を跨版で動かすため)。 並列 2 本の実地試験 (台帳 s2-07l.143) で追随と枠の減りを実測してから契約を流す。"
