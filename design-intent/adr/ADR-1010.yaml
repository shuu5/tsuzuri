  - id: "iv"
    name: "便の worktree の .vessel.toml を runner / gate が直接読む"
    text: |
      案 (iv) 便の worktree の .vessel.toml を runner / gate が直接読む: 却下。 利点は写しが要らないこと。 しかし worktree は便の実装が書き換える面であり、 実装が宣言に sh を足せば (上限の内なら) 自分の gate をその値で通せる。 intake で凍結した写しを読む形 (§2.3) なら、 便の中で宣言を変えてもその便には効かない。 ∴ 写しを読む。
    verdict: rejected
    reason: "利点は写しが要らないこと。 しかし worktree は便の実装が書き換える面であり、 実装が宣言に sh を足せば (上限の内なら) 自分の gate をその値で通せる。 intake で凍結した写しを読む形 (§2.3) なら、 便の中で宣言を変えてもその便には効かない。 ∴ 写しを読む。"
  - id: "v"
    name: "manifest に上限を置かず、 宣言だけで決める"
    text: |
      案 (v) manifest に上限を置かず、 宣言だけで決める: 却下。 利点は器の manifest から allowlist の行が消えて最も薄くなること。 しかし宣言に bash や python -c を書けば器はそれを許すことになり、 「実装役が実行しうる command の宇宙」を広げる判断が repo 側の PR だけで通る。 それは「使う」に近い判断であり、 器の manifest で裁定 id 付きにだけ広がる形 (C5) にする。 C1 の「規則は manifest」もこの上限が担う。 ∴ 上限を残す (§2.2)。
    verdict: rejected
    reason: "利点は器の manifest から allowlist の行が消えて最も薄くなること。 しかし宣言に bash や python -c を書けば器はそれを許すことになり、 「実装役が実行しうる command の宇宙」を広げる判断が repo 側の PR だけで通る。 それは「使う」に近い判断であり、 器の manifest で裁定 id 付きにだけ広がる形 (C5) にする。 C1 の「規則は manifest」もこの上限が担う。 ∴ 上限を残す (§2.2)。"
  - id: "vi"
    name: "宣言が無い repo では manifest の値で動かす (fallback)"
    text: |
      案 (vi) 宣言が無い repo では manifest の値で動かす (fallback): 却下。 利点は既存の toy repo の歯が宣言無しで動き続けること。 しかし fallback は「宣言し忘れ」を「Rust の共通 verify が黙って効く」に化けさせ、 別の言語の repo で cargo を撃って赤くなる (原因が manifest の側にあることが便の外から見えない)。 ADR-1009 §2.2 が採った「動かしてから黙って詰まるより最初に大きく落ちる」極性に反する。 ∴ 宣言が無い repo では intake が rc 1 で断り、 gate.common_verify 行は廃止して fallback の口を構造から消す (§2.2)。
    verdict: rejected
    reason: "利点は既存の toy repo の歯が宣言無しで動き続けること。 しかし fallback は「宣言し忘れ」を「Rust の共通 verify が黙って効く」に化けさせ、 別の言語の repo で cargo を撃って赤くなる (原因が manifest の側にあることが便の外から見えない)。 ADR-1009 §2.2 が採った「動かしてから黙って詰まるより最初に大きく落ちる」極性に反する。 ∴ 宣言が無い repo では intake が rc 1 で断り、 gate.common_verify 行は廃止して fallback の口を構造から消す (§2.2)。"
basis: [FR1001, FR1004, FR1005, FR1008, FR1019, FR1024, ADR-1004, ADR-1009]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  決めることは 6 つです。 宣言は目印の隣の file に置く、 器の規則 file は「宣言が名乗ってよい上限」だけを持つ、 便を受け付けるときに宣言を読んで上限と突き合わせ便ごとに凍結する、 実装役と審査は凍結した写しを読む、 器自身と練習用 repo にも宣言を置く、 そして今回決めない範囲、 です。
approval:
  who: 持ち主
  date: 2026-09-10
  ruling: "t3-hub.74.60.1:20261004T0113Z-1（取り込みの裁定・器の記録は器の台帳の裁定 id を名指さない）"
  verbatim: "tsuzuri の台帳 t3-hub.74.60.1 の notes に在る（この file に写さない・器の記録は器の台帳の裁定 id を名指さない）"
  surface: R-8
consequences:
  - "良い点は、 Rust でない repo を器に載せられること、 便が自分の権限を広げられないこと、 値の変更がその repo の PR として審査されること、 器の規則 file が「何を許しうるか」の裁定だけに純化することです。 弱い点は、 新しい言語の repo を載せるたびに上限の裁定が 1 回要ること、 宣言の中身が妥当かを機械が見ないこと、 直前の便で足した行を 1 本消す手戻りがあることです。"
  - "Positive: 対象 repo が自分の道具を宣言できるので、 器の manifest を触らずに別の言語の repo を載せられる (設計 §7「pipe は言語を知らない」が manifest 経由の内蔵からも解放される)。 Effective の値が便ごとに凍結され、 かつ verify 行が argv 1 本に限られるので、 便の実装が宣言を書き換えても自分の allowlist と共通 verify は変わらず、 宣言を変える PR も上限と制御文字の禁止の内でしか値を動かせない (自己拡張の閉塞: 1 便では変えられず、 2 便でも上限の外へは出られない)。 宣言の変更が対象 repo の PR として lens と CI の review を通る (器の manifest を直す C5 の手続きより、 変更が「どの repo の何を変えたか」として残る)。 manifest は「宣言が名乗れる上限」という裁定の面に純化し、 repo ごとの値を抱えない。 C10 の Declared → Effective の昇格が、 型と intake の突合という実体を持つ最初の面になる。"
  - "Negative: 新しい言語の repo を載せる最初の 1 回は上限の裁定 (C5) を要する——意図した摩擦だが、 摩擦である。 宣言の中身 (共通 verify が test を撃つか・空虚でないか) は機械が判定しない (§2.6・lens と人の review の領分)。 直前の便で足した rules 行 1 本と RuleKind の variant 1 つを廃止する手戻りが生じる (型・manifest・裁定 id の 3 点を揃える 1 PR)。 宣言を変える PR 自身の gate には変更後の値が効かない (次の便から)——足した／消したのいずれも、 その PR は旧い共通 verify で審査される。 道具を消す PR は land 後の main 実測が旧い行を新しい main に当てて main-red を残しうるので、 宣言だけの便 → 道具を外す便の 2 段に割る。 verify 行の粒度は argv 1 本であり、 包みも連結 (&& / |) も書けない——記録時点の e2e の契約 verify 行 9 本 (true / test / printf と連結) は上限と制御文字の外にあり、 実装の便は toy repo 側の script file + tmp manifest で上限を広げる形へ歯を書き直す。 rules 行の存在を assert する既存の歯 1 本も同じ PR で書き換える。 対象 repo の tracked file が 1 つ増える (repo 側の責務)。 toy repo を作る歯は宣言の commit が 1 手増える。"
