# 判断の記録 ADR-1010 — 器 scribe2 の判断の記録 ADR-0010 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1010
title: "runner の allowlist と gate の共通 verify の値は対象 repo の vessel 宣言が持ち、 manifest は上限を持つ (ADR-1009 §2.1 / §2.4 の値の置き場を部分 supersede)"
status: accepted
date: 2026-09-10
context: |
  前の記録 (ADR-1009) は、 実装役が実行してよい command の一覧と、 どの便にも共通の検証を、 器 (scribe2) 自身の規則 file に置きました。 ところがその値は「相手の repo が何であるか」で決まるものです。 Rust でない repo を器に載せる日に、 器の規則 file を直さないと動かない形になっていました。
  ADR-1009 §2.1 は allowlist の正本を manifest の rules 行 runner.allowed_commands (初期値 ["cargo", "git"]) と定め、 §2.4 は共通 verify の正本を rules 行 gate.common_verify (初期値 = flip check + done の定義 4 本) と定めた。 両行は 2026-09-10 に manifest へ land した (kind RunnerAllowedCommands / GateCommonVerify・値の形は List)。
  この 2 つの値は器の規則ではなく対象 repo の性質である。 共通 verify の行は Rust repo の道具 (cargo xtask flip-check・cargo nextest・cargo clippy・cargo deny) を名指し、 allowlist も同じ道具から成る。 設計 doc pipeline §7 は「pipeline が Rust 固有の検査を内蔵する形は採らない (toy repo は Rust でないことがある)」と定め、 ADR-1009 §4 案 (v) も同じ理由で Rust 固有の検査の内蔵を退けた。 しかし値を器の manifest に置く形は、 manifest 経由で同じ内蔵を作っていた——器で別の言語の repo を開発するには、 器の manifest を C5 の手続きで書き換えるか、 その repo 向けの行を器に足し続けるしかない。 前者は対象 repo の都合で器の規則が揺れ、 後者は器が対象 repo の一覧を抱える。
  憲法の面から見ると、 C1 は「規則の値は repo 内の manifest 1 file」と定め、 C10 は「宣言値・出所つき実測値・導出値・有効値を型で区別し、 宣言値は実測を経てだけ有効値になる」と定め、 C14 は「manifest は執行される規則の正本」と定める。 「相手の repo が何を実行するか」は器の規則というより相手についての宣言値であり、 既に所属の目印 .vessel (marker) が name と version をその形で持っている (SRS FR1019 / FR1024・ADR-1004 §2.2 面 1)。 ∴ 置き場を決め直す必要があり、 本 repo の作法「schema・on-disk 形式を決める便は ADR を先に書く」と「憲法条の解釈が要る便は ADR を書く」の両方に当たる。 選択肢は 2 つ (器の manifest のまま / 対象 repo の宣言へ) で、 選択が「器と repo のどちらが値を所有するか」という価値観に依存するため user 裁定を仰いだ (2026-09-10・推奨案を採用)。
decision: |
  決めることは 6 つです。 宣言は目印の隣の file に置く、 器の規則 file は「宣言が名乗ってよい上限」だけを持つ、 便を受け付けるときに宣言を読んで上限と突き合わせ便ごとに凍結する、 実装役と審査は凍結した写しを読む、 器自身と練習用 repo にも宣言を置く、 そして今回決めない範囲、 です。
  本 ADR は C1 / C10 / C14 の適用を記録する。 憲法本文は書き換えない。 C1 の読みは次のとおり: 器の規則は「宣言が名乗れる command の上限」(manifest の行に在る) と「宣言が無い repo では便を起こさない」(型に在る: 有効値は宣言からしか作れず、 有効値の無い便は起こせない——C6 の Budget と同型で、 bool の行は持たない) である。 対象 repo が何を実行し何を共通に検証するかはその repo についての宣言値 (C10 の Declared) であって器の規則値ではない——marker の name / version と同じ類であり、 契約 file が既に verify (gate が実走する command 行) と write-set (guard が執行する path 集合) を manifest の外に持っていることと同型である (C1 の "rule value" は rules 行の field を指し、 器が読むあらゆる入力を指さない)。 自己ホストの周も宣言は C14 の "documents" ではなく契約と同類の入力データであり、 規律を宣言に書く口ではない。 宣言値は intake の突合 (実測) を経てだけ有効値 (Effective) になる (C10)。 manifest は執行される規則の正本のまま (C14)。 rules manifest からは行を 1 本消す (C5・裁定 id = 本 ADR)。
  §2.1 宣言 file — marker の隣に置く
  目印 .vessel そのものには手を付けません。 前の版と共有する固定の形だからです。 その隣に .vessel.toml という file を置き、 「実装役が使ってよい command」と「どの便にも共通の検証」をその repo が自分で名乗ります。
  vessel 宣言は対象 repo の root の tracked file .vessel.toml である (MUST)。 marker .vessel は変えない (MUST NOT change): marker は跨版 面 1 (ADR-1004 §2.2・要件カタログ R-O3) として版番号に依らず固定され、 読み手は 2 行厳格 (行数違いは Absent = hook が黙る側へ倒れる) で実装されている。 marker に行を足すと、 前の版と現在の版の両方の hook が「誰も名乗っていない」と読み、 write-set guard が黙って外れる——安全側と逆へ倒れる。 ∴ 宣言は別 file に置く。
  宣言の形は契約 file と同じ TOML subset (ADR-1004 §2.3・section を持たない flat な key・値は文字列と 1 行の文字列配列・reader は契約 file と同じ 1 組で第 2 の parser を作らない) とする (MUST)。 key は 3 つですべて必須: schema (整数・初期値 1)、 allowed-commands (command 名の配列・実装役が実行してよいもの)、 common-verify (command 行の配列・どの便にも共通の検証・{base} は便の base に置換される唯一の穴)。 配列は空を受けず、 要素の空文字も受けない (manifest の List と同じ理由: 「規則が無い」を空で表せると書き間違いが空の allowlist を効かせる)。 未知 key は拒む。 未知の schema も不備である (跨版は marker と違い黙らず rc 1 へ倒す)。 不備は全件集めて行番号付きで返す (契約 file と同じ・FR1001)。
  §2.2 manifest は上限を持ち、 共通 verify の行は廃止する
  器の規則 file にある「実装役が使ってよい command」の行は残しますが、 意味を「どの repo の宣言も、 この範囲の中でしか名乗れない」という上限に変えます。 上限を広げるには人の裁定が要ります。 「共通の検証」の行は器の規則 file から消します。 repo ごとに違う値を器が持つ理由が無いからです。
  rules 行 runner.allowed_commands (kind RunnerAllowedCommands) は残し、 意味を上限 (ceiling) に変える (MUST): どの vessel 宣言の allowed-commands も、 この行の要素の部分集合でなければならない。 値は変えない (記録時点 ["cargo", "git"])。 上限を広げる (例: 別の言語の repo を載せるために uv や pytest を足す) には C5 の手続き (裁定 id 付きの diff) を要する——これは意図した摩擦である: 実装役が実行しうる command の宇宙を広げるのは「使う」に近い判断であり、 器の manifest でだけ広がる形にする。 包み (sh / bash / python -c 等) を上限に載せないことは ADR-1009 §3 の散文であって機構を持たない (N2 により規則とは数えない)。 上限の変更を止める機構は C5 (裁定 id 付きの diff を CI が要求する) だけであり、 包みの検査を measure として置くかは §2.6 の候補に留める。
  rules 行 gate.common_verify と kind GateCommonVerify は廃止する (MUST remove・C5・裁定 id = 本 ADR)。 器が「Rust repo 向けの共通 verify」を持ち続けると、 宣言の無い repo でそれが黙って効く fallback の口になる (§4 案 (vi))。 RuleKind は閉じた enum なので variant の除去は型・manifest 行・裁定 id の 3 点が 1 PR に揃う形で行う (ADR-1009 §3 と同じ)。 廃止の実装は本 ADR の後の便に置く (本 ADR は docs のみ)。
  §2.3 intake が宣言を読み、 上限と突合し、 便ごとに凍結する
  便を受け付けるとき、 器は repo の宣言を読んで「上限の中に収まっているか」「検証の各行の先頭が宣言した command か」「repo の外を指していないか」を確かめ、 通ったものをその便の置き場に写して凍結します。 宣言が無い・空・上限の外なら、 その場で断って便を起こしません。 便が自分の実装の中で宣言を書き換えても、 自分の権限は広がりません。
  intake は --repo の repo の HEAD commit の tree から .vessel.toml を読む (MUST・git show HEAD:.vessel.toml 相当)。 作業ツリーの file は読まない (MUST NOT): untracked・未 commit の宣言は review を経ていない値であり、 intake が読む値は常に commit 済み (= PR として lens と CI を通った値) に限る。 読めない・不在・不備ありは rc 1 で拒み、 event を書かない (ADR-1009 §2.2 と同じ極性)。 読んだ値は C10 の Declared として型で持ち、 次の突合 (実測) を経て Effective へ昇格する: (1) allowed-commands の各要素が manifest の上限 runner.allowed_commands に含まれる。 (2) common-verify の各行が空白区切りの argv 1 本であること: 先頭 command (第 1 語) が宣言の allowed-commands に含まれ、 行が shell の制御文字 (; & | ` $ ( ) < > 引用符・改行) を含まず、 repo の外の path (絶対 path・home の短縮記号) を含む語を持たず、 穴は {base} だけである。 制御文字の禁止が要るのは、 gate と land が verify 行を sh -c の 1 行として実行するため、 先頭語の検査だけでは cargo --version; env の形で任意の command が第 2 語以降に乗るからである (先頭語の allowlist は connective を禁じてはじめて境界になる)。 (3) 契約の verify 各行にも (2) と同じ検査を、 判定の基準を宣言の allowed-commands (上限ではない) として掛け、 ただし契約行は穴を持たない ({base} も不可・gate は契約行に置換をしない) (ADR-1009 §2.2 の「runner.allowed_commands の外」は本 ADR で「宣言の allowlist の外」に読み替える)。 1 件でも外れれば rc 1 で拒む (MUST・全件を集めて報告)。 突合の結果は出所付きの実測値 (C10 の Measured: 値 + 出所 = 読んだ commit の sha・宣言 file の path・上限行の id) を経て Effective になる。 型名は gate の測定値 Measured と衝突させない。
  突合を通った Effective の値は <state_dir>/pipe/<run>/vessel.toml へ写す (MUST・契約 file を contract.toml へ写すのと同じ形)。 以後の段 (spawn・runner・gate・land・resume) はこの写しだけを読み、 対象 repo や worktree の .vessel.toml を読み直さない (MUST NOT)。 これにより、 便の実装が worktree の宣言を書き換えてもその便の権限と共通 verify は変わらない (自己拡張の閉塞)。 宣言を変える PR は通常の便として lens と CI の review を受け、 land した後に intake した便から効く。 event log の record 形は変えない (跨版の契約・ADR-1004 §2.5)——凍結は写し file で行い、 event に新しい field を足さない。
  §2.4 runner・gate・land は凍結した写しを読む
  実装役を起こすときは、 器が凍結した写しから「使ってよい command」を組んで渡します。 審査 (gate) と取り込み (land) は、 同じ写しの「共通の検証」を、 契約の検証の前に撃ちます。 写しを渡さずに実装役を起こすことはできません。
  runner は --vessel <file> を必須 flag として受け (MUST・lens の --contract と同じ fail-closed 極性・無ければ claude を起動せず rc 1)、 その写しの allowed-commands の各要素を Bash(<cmd>:*) の形で --allowedTools に渡す。 --setting-sources project と PermissionRequest hook の一律 deny は ADR-1009 §2.1 のまま不変。 runner は manifest を読まない (MUST NOT)——上限との突合は intake で済んでおり、 runner が読む値は Effective だけである。 spawn の --runner seam は placeholder {vessel} を写しの path へ置換する (既存の 6 つの穴に 1 つ足す・置換の規律は不変)。
  gate と land の機械検証は、 順序を変えず (① write-set の照合 → ② 共通 verify → ③ 契約 verify・ADR-1009 §2.4)、 ② の行を manifest でなく写しの common-verify から取る (MUST)。 {base} の置換は共通 verify 行に対して行い (ADR-1009 §2.4 が決めた形・記録時点の gate にはまだ無く、 実装の便で新設する)、 契約行には行わない。 verify.jsonl の record 形・verify.stderr.log の診断は不変。 lens は Bash を撃たないので宣言を読まない (不変)。
  §2.5 自己ホストと toy repo
  器自身の repo にも同じ宣言を置きます。 中身は、 これまで器の規則 file にあった値 (cargo と git・flip check と done の定義 4 本) をそのまま移したものです。 練習用の小さな repo (toy repo) を作る歯も、 目印と一緒に宣言を commit します。
  本 repo の root に .vessel.toml を置き (MUST)、 allowed-commands は廃止前の runner.allowed_commands の値、 common-verify は廃止する gate.common_verify の値をそのまま写す (値は変えない・変異検出線の cargo xtask mutants-diff --base {base} は ADR-1009 §2.3 のとおり実装の便で末尾に足す)。 宣言を tracked にする理由は marker とは違う: 読み手は intake だけで worktree に写る必要は無いが、 intake が HEAD の tree から読む (§2.3) ので commit されていない宣言は存在しないのと同じである。 本 repo に .vessel.toml を足しても public 面の情報は増えない (同じ 5 行 + 2 語は既に tracked な manifest 行として public であり、 置き場が移るだけ) ので A1 の「出す」に当たらない。 toy repo を作る歯は宣言も commit する。 toy repo の宣言は Rust を含まない (例: allowed-commands = ["git"]・common-verify は git だけで書ける 1 行) ——これが「pipe は言語を知らない」ことの歯になる。
  §2.6 射程外
  宣言の中身が妥当か (たとえば test を撃たない共通の検証を名乗っていないか) を機械が判定することや、 契約 file や起動 command の置き場、 上限の値そのものの変更は、 ここでは決めません。
  次は本 ADR の決定ではない (MUST NOT be read as such): 宣言の意味的な妥当性の機械判定 (例: 自己ホストの宣言が done の定義 4 本を含むかを xtask check の検出線で測る案・別便の候補)、 上限 runner.allowed_commands の値の変更 (C5 の裁定)、 運用物 (契約 file・runner の起動行) の repo tracked な置き場 (ADR-1009 §2.6 のまま・A1 に掛かる)、 宣言を vessel init が生成すること (宣言は repo が書く tracked file であり、 器が値を推測して書くと宣言でなくなる)、 SRS への要件の追加 (「宣言の無い repo では便を起こさない」「宣言は上限の内」に対応する FR は記録時点の SRS に無く、 spec/ の改訂は別便で user が folio-architect を起動して行う)、 上限に包みが載っていないことを測る xtask check の measure (§2.2・候補)、 verify 行を sh を介さず argv で起動する実装 (制御文字の禁止で同じ境界を得るため、 本 ADR は起動形を変えない)、 marker .vessel の形式改訂 (跨版 面 1・R-O3)、 憲法条文の改訂 (A2)。
