  器の記録の出所（Trace）:
  出所は、 利用者の裁定と、 目印の読み手・宣言の読み手・規則 file の現状を実際に測った結果です。
  ・裁定: 2026-09-10 に user が「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」について、 器の manifest のままにする案と対象 repo の宣言へ移す案を比較した推奨 (宣言へ) を採用した。 本 repo は public のため逐語・席や台帳の識別子・host 名は本 file に載せない (出所は日付で指す)。
  ・実測 (marker): .vessel の読み手は 2 行 (name= / version=) の厳格 parse で、 行数違い・key 違い・順序違いはすべて Absent (hook が黙る側) へ倒れる (2026-09-10・記録時点の実装)。 SRS FR1019 / FR1024 が marker を名指し、 ADR-1004 §2.2 が跨版 面 1 として固定する。
  ・実測 (reader): 契約 file の reader は section を持たない flat な TOML subset で、 値の受理集合を manifest と共有する (第 2 の parser を作らない)。 宣言 file は契約 file と値の受理集合 (scalar / list / elements / quoted_once) を共有する。 key の集合と schema の型 (整数) が違うため契約の parse 関数そのものは使わない (契約側は整数を「文字列でない」で拒む)。 manifest 側の list は空配列と空要素を既に拒む。
  ・実測 (gate / land): verify 行は sh -c の 1 行として実行される (記録時点の gate と land の実装)。 先頭語だけの allowlist 検査では第 2 語以降に任意の command が乗るため、 §2.3 の制御文字の禁止を置いた (lens review 2026-09-10・critical)。 gate の placeholder 置換は記録時点で lens の cmd に対してだけ在り、 {base} の置換は共通 verify 行の新設として実装の便に置く。
  ・実測 (manifest): 記録時点の rules 行は runner.allowed_commands = ["cargo", "git"] と gate.common_verify (flip check + done の定義 4 本の 5 行) で、 いずれも 2026-09-10 の便で land した。 両行を読む実装は記録時点でまだ無い (型と行だけが在る) ので、 廃止の実装は消す面が小さい。
  ・先行記述: 設計 doc の pipeline §5.1 / §5.2 / §5.3 / §6 / §8・vessel-hook §2・rules-manifest §4 と vocabulary (allowlist / 共通 verify) は manifest を正本とする読みで land していた。 本 ADR は同じ PR でそれらを改訂する。
  ・拘束条件: C1 (規則は manifest 1 file)・C2 (規則を 1 つに閉じる)・C5 (裁定 id 付き diff)・C10 (宣言値は実測を経て有効値)・C11 (極性は型)・C14 (manifest は執行される規則の正本)。 ADR-1004 §2.2 / §2.3 / §2.5・ADR-1009。 要件は SRS FR1001 (契約の受理) / FR1004 / FR1005 / FR1008 / FR1019 / FR1024。
  ・記録した日: 2026-09-10。
