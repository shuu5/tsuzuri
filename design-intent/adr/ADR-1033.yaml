  器の案の章の要約: 候補を 4 つ並べます。数え方の修正と I/O 面の分離を両方やる案、上限を上げる案、判定の側を新しい crate へ出す案、crate を分けずに削る案です。どれも core を減らせますが、成長を止めたまま機械で境界を決められるのは 1 つだけです。
  器の専門語の説明: 本文に出てくる専門語を、やさしい言葉で説明します。
  ・core（core crate）: 型・閉じた enum・判定の純関数・file の読み書きを持つ crate (crates/NAME・lib vessel)。 子 process を撃つ関数を持たない。
  ・境界 crate（boundary crate）: tmux / git / claude / curl / cargo / systemd / sh を子 process として起こす関数と binary を持つ crate (crates/NAME-boundary)。 core に依存し core からは見えない。
  ・in-file の歯（in-file tests）: src の .rs の末尾に cfg(test) の属性で置かれた test。 R-C4-3 (歯 / src の比) が数える側。
  ・純移動（pure move）: 関数や型の本文を変えずに file や crate の間で動かす変更。 器が名と本文の hash で証明し lens には要約を渡す (pipeline.md 5.3 節)。
  ・抜け穴（loophole）: 上限や検査の意図をすり抜けて形だけ通す変更。 境界 crate の上限は「core から押し出して逃げる」抜け穴を塞ぐ。
