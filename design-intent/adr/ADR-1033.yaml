consequences:
  - "この判断で良くなることと、代わりに引き受けることです。余地が 3 倍に戻り境界が lint で決まる一方、中身を変えない移動の便が数本要り、境界 crate の上限は移した後の実測で確定します。"
  - "良い結果: 上限を動かさずに core の余地が戻り、 契約を受付のために割る手作業が消える"
  - "良い結果: 「何が I/O か」が lint (core の Command::new = 0) で決まり、 境界が散文に戻らない"
  - "良い結果: 境界 crate の関数は「引数 → 子 process → 生の結果」だけを返す形になり、 判定は core の純関数に残る (歯は stub で撃てる)"
  - "代償: 純移動の便が 6 本ほど要り、 その間 core と境界の use の path が動く (追随の周が増える)"
  - "代償: 境界 crate の上限 R-C4-5 の初期値は宣言値で、 移動の最後の便で実測して確定するまで有効値ではない (C10)"
