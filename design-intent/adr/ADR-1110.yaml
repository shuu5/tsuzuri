  - "良い結果: 名乗った file の無い周・読めない周と、 在る宣言が壊れて読めない周は claude を起こさず、 直す物を evidence が名指す INCONCLUSIVE になり、 測れていない 0 が PASS に混ざらない"
  - "良い結果: 既定の path が const DEFAULT_CONSTITUTION 1 つに集まり、 lens は測る列を files から受けて Fixed の周も既定の 1 本を files から得る (C2・句の const は雛形の字の写しで path としては読まない)"
  - "代償: 古い binary は constitution を未知の key として宣言全体を断る。 消費側が key を書くのは、 その host の binary を key を知る版に入れ替えた後で、 着地の知らせにこの順を書く"
