note: |
  器の元の file: scribe2/design-intent/decisions/ADR-0110-the-constitution-place-is-declared-by-the-vessel-key-and-replaces-the-default.html
  器の表紙の頭: 設計判断記録 (ADR) scribe2 — 憲法の置き場の宣言
  器の表紙: 状態accepted選択肢6件 (OPT1–OPT6)結果良い 4 / トレードオフ 7版v0.1.0 / 2026-10-02
  器の表紙: 正当化する要件: SRS-SCRIBE2-MVP の FR1009・NFR1001
  器の表紙: 想定読者: scribe2 の開発 session と user — 器の内部と Rust の専門知識は不要 (専門語はやさしい言葉を併記)
  器の承認の欄: 設計 (orchestrator)・orchestrator・2026-10-02 草稿 v4 (lens の測りと頼みの文の句・vessel 宣言の任意 key の読み手・rev を名指して宣言を読む口の先例を main e02b1c68 の現物で読み、 fidelity の審査の指摘と設計 §48 の改訂を反映した)。 照会は消費側の置き場の席で、 判断の出所は memo s2-07l.738.42.9 の 2026-10-02T02:3xZ の判断。 拘束する constitution の版 0.5.0・作成
  器の案の章の要約: 候補を 6 つ並べます。 設定 file の書かなくてよい項目 constitution で file の一覧を名乗り、 既定を置き換え、 依頼文の 1 句を差し替える案 (選んだ案) と、 選ばなかった 5 つです。 選ばなかった案は、 項目を既定に足す案・repo の側が docs/constitution.md を置く案 (生成した写し・正本を名指す数行・symlink のどれでも)・依頼文の雛形に差し込み口を足す案・器が憲法の本文を依頼文に差し込む案・項目に dir やワイルドカードを書ける案です。
  器の専門語の説明: 本文に出てくる専門語 9 個を、 やさしい言葉で説明します。
  ・vessel 宣言（vessel declaration）: 対象 repo が器に自分の形 (許す command・共通 verify・path の種別・契約表の置き場など) を名乗る tracked file .vessel.toml (ADR-1010)。 読み手は未知の key を宣言全体の不備として断る。
  ・任意 key（optional key）: vessel 宣言の key のうち書かなくてよいもの。 書かない宣言は器の既定で動く。 本 ADR は constitution を足す。
  ・lens（lens）: 便の差分を観点ごとに読んで PASS・FAIL・INCONCLUSIVE の verdict を返す審査の段 (SRS FR1009)。 器が claude を起こして撃ち、 観点の 1 つが憲法 (constitution) である。
  ・頼みの文（prompt）: 器が雛形を埋めて lens に渡す文。 diff の審査の雛形は lens.txt で、 観点の行が憲法の置き場を名指す。
  ・雛形の hash（template hash）: 雛形の file の中身から計る値で、 --print-version に載る。 変わると binary の入れ替えの後に全部の行の審査の記録が撃ち直しになる。
  ・INCONCLUSIVE（inconclusive）: lens と gate の verdict の 3 値の 1 つで、 測れない周に PASS を名乗らない答え (SRS FR1009)。 本 ADR の周では evidence が直す物を名指す。
  ・閉じた 3 値（closed three values）: 宣言の読みが返す答えを 3 つに限った型 (本 ADR の ConstitutionFiles は Fixed・Declared・Unreadable)。 読めない周に専用の答え (Unreadable) が在り、 既定 (Fixed) と区別して返せる (倒さないことは歯で測る)。
  ・跨版（cross-version）: 器の版と消費側の宣言の版が違っても、 壊れ方が決まっていること。 古い binary は新しい key を未知の key として宣言全体を断る。
  ・消費側の置き場（consumer repo）: 器の repo の外で、 器を使って便を走らせる対象 repo。 憲法の正本の形は置き場ごとに違いうる。
