# 判断の記録 ADR-1110 — 器 scribe2 の判断の記録 ADR-0110 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1110
title: "憲法の置き場 — vessel 宣言の任意 key constitution が repo 相対の file の列を名乗って既定の docs/constitution.md を置き換え、 lens は名乗った file を 1 本ずつ §47 の 3 値で測り、 頼みの文の憲法の path の句をその列に差し替える"
status: accepted
date: 2026-10-02
context: |
  lens は起こす前に木の docs/constitution.md を測るが (設計 gate-cost §47)、 この path は器が自分の repo の作り方 (憲法から生成する写し) を決め打ちしたもので、 憲法の正本を別の形の file で持つ消費側の置き場は、 写しか正本を名指す file を 1 つ足さないと diff の審査を通れない。 本 ADR は、 vessel 宣言の任意 key constitution が repo 相対の file の列を名乗り、 その列が既定を置き換え、 lens はその列を 1 本ずつ測って頼みの文の 1 句を差し替えると決める。 key を書かない repo の prompt と雛形の hash は 1 byte も変わらない。
  なぜこの判断が要るのかを 4 つで示します。 器が今、 審査役を起こす前に docs/constitution.md の有無を測り、 依頼文もその場所を名指していること。 その場所は器の repo の作り方 (生成した写し) の決め打ちで、 憲法の正本を別の形で持つ repo が現れたこと。 repo が自分の形を設定 file で名乗る口と、 項目を「足す」と「置き換える」の 2 つの先例。 憲法の向きと、 この記録が動かす範囲です。
  CTX1 現物 — lens（審査役の AI） は起こす前に木の docs/constitution.md を 3 値に測り、 頼みの文（審査役への依頼文）もその path を名指す (§47)
  設計 gate-cost §47 で、 lens は diff の審査の周に限り、 claude を起こす前に --worktree の木の docs/constitution.md を 在る・無い・読めない の 3 値に測る (中身は読まない)。 無い周と読めない周は claude を起こさず、 rc 0 で置く物か直す物を名指す INCONCLUSIVE（判定できず） の 1 行を返す。 path は lens.rs の private な定数 1 つで、 雛形 lens.txt の観点の行は憲法を「起動 cwd の生成 file docs/constitution.md」と書く。 判定の順は 材料の分岐 → stdin の diff → cap → 測り → prompt で、 契約の審査と memo の段は測らない。 §47 は別の path を名乗る宣言の key を見送り、 消費側の置き場（器を使う別の repo）には docs/constitution.md (全文・正本を名指す数行・symlink のどれか) を置かせ、 別の path を要る消費側が現れたら ADR を立てて足すと却下に書いた。
  CTX2 正本の形 — 器の repo の docs/constitution.md は生成の写しで、 正本を別の形の file で持つ消費側の置き場が現れた
  器の repo の憲法の正本は design-intent/spec/constitution.html の機械層で、 docs/constitution.md は cargo xtask gen-claude-md の生成物である (ADR-1046)。 つまり docs/constitution.md という path は、 器が自分の repo の作り方を決め打ちしたものになる。 憲法の正本を md でない別の形の file で持ち、 md の写しを作らない消費側の置き場が現れ、 §47 の形のままでは、 正本と別に写しか正本を名指す file を 1 つ置かないと diff の審査の gate が通らない (memo s2-07l.738.42.9)。 §47 の却下が残した条件が満ちた。
  CTX3 宣言の口と先例 — vessel 宣言（repo の設定 file）の任意 key（書かなくてよい項目） には「足す」と「置き換える」の両方の先例が在る
  vessel 宣言 (.vessel.toml) は、 対象 repo が自分の形を器に名乗る tracked file で (ADR-1010)、 読み手は未知の key を宣言全体の不備として断る。 任意 key には、 既定に足す先例 (契約表の置き場の contract-tables・ADR-1109) と、 書けば既定を置き換える先例 (path の種別の key・ADR-1047) が在る。 名指した rev の宣言を読み、 既定だけの周・key の在る周・読めない周を閉じた 3 値（3 つに限った答え）で返す口には、 契約表の置き場の読み TablePlaces の先例が在る。 新しい key は、 古い binary が未知の key として断るので、 跨版（版の違いをまたぐ）の形を持つ。
  CTX4 憲法の向きと本 ADR の射程
  C10 は宣言値と導出値を型で分け、 その読み (ADR-1047) では、 在って読めない宣言を既定に倒さない。 §47 は同じ C10 から、 測れていない観点の 0 を測った 0 に混ぜない線を引いた。 C2 は名前を 1 つの定数から導くことを求める。 FR1009 は lens の不在・cap の超過・parse できない出力・3 値の外の verdict の周に PASS を名乗らず INCONCLUSIVE とし、 NFR1001 は lens 1 本の材料に上限を置く。 雛形 lens.txt の hash は --print-version に載り、 雛形を変えると binary の入れ替えの後に全部の行の審査の記録が撃ち直しになる。 本 ADR が動かすのは、 宣言の key 1 つ・それを読む口 1 つ・lens が測る file の列・頼みの文の 1 句の差し替えの 4 つである。 ADR を書く条件のうち 1 (C10 の読み)・3 (宣言の key と跨版の形)・4 (却下案を残す価値のある分岐) に当たる。
  （選択肢を測るものさし）この判断を評価する 5 本のものさしです。 憲法の在りかは repo が名乗ること。 書かない repo の依頼文と雛形の指紋を 1 byte も変えないこと。 憲法の写しを repo にも依頼文にも重ねないこと。 名乗った file が無い・読めない回と、 在る設定が壊れて読めない回を、 「違反 0」にも既定にも倒さないこと。 古い本体と新しい設定が出会ったときの壊れ方を名指すことです。
  DR1｜出所 — 憲法の在りかは対象 repo の事実で、 repo が自分の宣言で名乗る (器が自分の repo の作り方を決め打ちしない) CTX2・CTX3
  DR2｜無変更 — key を書かない repo の prompt と雛形の hash（雛形の指紋） は 1 byte も変わらず、 行の審査の記録を撃ち直させない CTX1・CTX4
  DR3｜写しを重ねない — 正本の写しを置き場にも prompt にも重ねない (C2・NFR1001) CTX2・CTX4
  DR4｜fail-closed — 名乗った file の無い周・読めない周と、 在る宣言が壊れて読めない周を、 測れていない 0 にも既定にも倒さない (C10・FR1009) CTX1・CTX4
  DR5｜跨版 — 古い binary と新しい key が出会ったときの壊れ方を名指す CTX3
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 設定 file の項目 constitution は repo の中の file の場所の一覧で、 字を英数字と . _ / - に限り、 dir・親へ上る段・絶対の場所・home の略記は断ります。 書いた一覧は既定の docs/constitution.md の代わりになります。 器は設定を 3 つに限った答え (既定の 1 本・書いた一覧・読めない) で読み、 設定が在って壊れている回は、 項目を書いたかによらず「読めない」です。 審査役は commit 済みの設定を読んで、 一覧の file を 1 本ずつ在る・無い・読めないに測ります。 file が無い・読めない回と設定が読めない回は、 審査役を起こさずに「判定できず」を返して直す物を名指します。 書いた repo だけ依頼文の 1 句を差し替え、 書かない repo の依頼文は変えません。 支える要件は 2 つで、 どちらも向きを保つ側です。
  採用 — OPT1
  器 SHALL vessel 宣言の任意 key constitution を持つ。 値 SHALL repo 相対の file の path の配列 (書いた順) で、 各項目の字 SHALL 英数字と . _ / - に閉じる。 配列でない値・空か空白だけの項目・絶対 path・home の短縮記号・.. の段・末尾 / の項目 (dir は名乗れない)・閉じた字の外の字を持つ項目 SHALL key の行番号を名指す宣言の不備とする。 同じ path の重複は不備にしない。 宣言の schema SHALL 1 のままとする。 名乗った列 SHALL 既定の docs/constitution.md を置き換え、 既定に足さない。 器 SHALL 名指した rev の木の宣言から閉じた 3 値 ConstitutionFiles (Fixed・Declared・Unreadable) を返す口を 1 つ持つ: 宣言 file の無い周・key の無い宣言と、 git show が理由によらず落ちる周 (repo でない dir のほか、 git の無い環境・safe.directory の拒否・HEAD の無い repo・名乗った key があっても既定を測る・TablePlaces と同じ読み) は Fixed、 key を持つ宣言は Declared、 在って parse が落ちる宣言は key の有無によらず Unreadable (既定に倒さない)。 files SHALL Fixed が既定の 1 本、 Declared が書いた順のまま 2 度目以降の同じ path を除いた列 (並べ替えない)、 Unreadable が無しとする。 既定の path SHALL optional_keys.rs の pub な const DEFAULT_CONSTITUTION 1 つに置く。 lens SHALL 測る列を files から受け、 Fixed の周も既定の 1 本を files から得る (§47 の CONSTITUTION_FILE を測りの入力に使わない)。 差し替える句の const は雛形の字の写しで、 path としては読まない。 lens SHALL diff の審査の腕でだけ、 材料の分岐 → stdin の diff → cap の後に --worktree の HEAD の宣言を読む (作業ツリーの宣言は読まない・cap を超える周は読まずに今どおり)。 Unreadable の周は claude を起こさず rc 0 で evidence が constitution declaration unreadable: .vessel.toml の INCONCLUSIVE を返す。 ほかの周 SHALL files を書いた順に §47 の 3 値で測り、 先頭から最初に在るでない file で止まって、 無いなら §47 形 3・読めないなら §47 形 4 の evidence の path をその file にした INCONCLUSIVE を claude を起こさずに返し、 全部が在る周だけ prompt を組む。 Declared の周 SHALL 雛形の中にちょうど 1 回在る句「（起動 cwd の生成 file `docs/constitution.md`）」を「（木の file `<path>`）」 (複数は ・ で並べる・files の順) に差し替えてから埋め、 埋めた後の全置換にしない (diff の本文の同じ句を書き換えない)。 Fixed の周の prompt と雛形の hash SHALL 1 byte も変わらない。 契約の審査と memo の段 SHALL 今どおり測らず、 宣言も読まない。 本 ADR SHALL NOT 雛形 lens.txt・gate の判定と撃ち直し・verdict.json の key 列・--print-version の key 列と値・契約表の置き場の key を変える。 器の repo SHALL key を書かない。
  （平易）repo の設定 file に、 書かなくてよい項目 constitution を足します。 値は repo の中の file の場所の一覧 (書いた順) で、 字は英数字と . _ / - に限ります。 一覧でない値・空か空白だけの項目・絶対の場所・home の略記・親へ上る段・/ で終わる項目 (dir)・限った字の外の字は、 key の行番号を名指して断ります。 同じ場所を 2 度書いても断らず、 書いた順のまま 2 度目以降を除いて 1 度だけ測ります。 設定の版 (schema) は 1 のままです。 書いた一覧は既定の docs/constitution.md の代わりになり、 既定には足しません。 器は、 名指した版の設定を 3 つに限った答えで返す口を 1 つ持ちます。 書いていない・設定 file が無い回と、 git が理由によらず設定を読めない回 (repo でない dir のほか、 git の無い環境・safe.directory の拒否・HEAD の無い repo。 項目を書いていても同じ) は既定の 1 本、 書いてある回は書いた一覧、 設定が在って壊れている回は項目を書いたかによらず「読めない」です。 既定の場所は 1 つの定数 (DEFAULT_CONSTITUTION) だけに置き、 審査役は測る一覧をこの口から受けて、 書いていない回も既定の 1 本をこの口から得ます。 差し替える句を持つ定数は雛形の字の写しで、 場所としては読みません。 審査役は差分の審査の回だけ、 差分が上限の内に収まった後で commit 済みの設定を読みます。 読めない回は審査役を起こさずに「判定できず」を返して .vessel.toml を名指し、 ほかの回は一覧の file を書いた順に在る・無い・読めないに測り、 最初に在るでない file で止まってその file を名指す「判定できず」を返します。 全部が在る回だけ依頼文を組み、 書いてある回は雛形に 1 回だけ在る句「（起動 cwd の生成 file `docs/constitution.md`）」を「（木の file `<場所>`）」 (複数は ・ で並べる) に差し替えてから埋めます (差分の本文の同じ句は書き換えません)。 書いていない回の依頼文は 1 byte も変えず、 lens.txt は変えないので、 どの回も雛形の指紋は変わりません。 契約の審査と memo の段は今どおり測りません。 gate の判定と撃ち直し、 記録 (verdict.json) や版表示 (--print-version) の項目、 契約表の置き場の key は変えません。 器の repo はこの項目を書きません。
  （理由）憲法の在りかを repo の設定で名乗らせるのは、 それが repo ごとの事実だからで、 器が自分の repo の作り方 (生成した写し) を決め打ちすると、 正本を別の形で持つ repo に写しか正本を指す file を置かせることになります。 項目を既定に足さず置き換えるのは、 足す形では既定の写しを持たない repo が審査を通れず、 消すべき写しが残るからで、 契約表の置き場と向きが逆なのはこのためです。 依頼文は雛形を変えずに埋める前の 1 句だけ差し替えるので、 書かない repo の依頼文と雛形の指紋は変わらず、 本体の入れ替えで全部の行の審査の記録が撃ち直しになりません。 本文を依頼文に入れないので、 審査役の読む量の上限も食いません。 在る設定が壊れた回や無い file を既定や「違反 0」に倒さず「判定できず」で止めるのは、 測れていない 0 を測った 0 に混ぜないという前の設計 (§47) と憲法 C10 の線を保つためです。 git show が理由によらず落ちる回 (repo でない dir のほか、 git の無い環境・safe.directory の拒否・HEAD の無い repo) を、 項目を書いていても既定の 1 本にする (契約表の置き場の読みと同じ) のは、 repo でない dir の木の測りを今のまま保つためです。 その回は、 既定の写しが無ければ docs/constitution.md を名指して写しを誘い、 古い写しが在れば既定の句で審査役を起こす危険が残りますが、 gate の木は器が git で作った worktree なので、 そこで git が落ちる回は gate のほかの行も落ちるため、 受け入れます。 字を限るのは、 差し込んだ字が雛形の差し込み口や記号を作らないようにするためで、 dir や glob を断るのは、 在る・無い・読めないが file 1 本ごとに決まるようにするためです。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1009（rationale）: FR1009 (lens の verdict) の列挙 (lens 不在・cap 超過・parse 不能・3 値の外) の外の周を、 同じ向き (PASS を名乗らず INCONCLUSIVE) で足す。 足すのは 3 つの周 (在る宣言が壊れて読めない周・名乗った file の無い周・読めない周) で、 §47 の 2 つの周と同じく claude を起こさない INCONCLUSIVE の 1 行とし、 gate の判定と撃ち直しは変えない。 SRS の FR1009 に条件を足すかは本 ADR の範囲外である。
  NFR1001（rationale）: NFR1001 (lens 予算) を保つ。 憲法の本文を prompt に差し込まず、 path の句を差し替えるだけなので、 lens の材料の byte は今と同じである。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録はどの ADR も置き換えません。 前の設計 (§47) が「別の場所が要る repo が現れたら ADR を立てて足す」と残した見送りを実らせ、 §47 の測り方と順の位置はそのまま使います。 設定 file の ADR-1010 には項目を 1 つ足すだけで、 契約表の置き場の ADR-1109 とは向きだけが逆です。 器の repo の憲法の置き方 (ADR-1046) は変えず、 器の repo はこの項目を書きません。 原則は ADR-1047 のもので、 repo の形はその repo の事実なので repo に名乗らせ、 名乗らない回は器の既定で動き、 名乗りが読めない回は最も厳しい側へ倒す、 です。
  改訂状態: current
  置き換える ADR: なし (新規)
  置き換えられた: なし (現行)
  supersede は無い。 本 ADR は、 設計 gate-cost §47 の却下が「別の path を要る消費側が現れたら ADR を立てて足す」と残した見送りを実らせる。 §47 の測りの 3 値と evidence の形と判定の順の位置は変えず、 測る file を名乗りの列に広げる。 ADR-1010 の vessel 宣言には任意 key を 1 つ足すだけで、 必須の key と schema の版は変えないので supersede しない。 ADR-1109 の contract-tables とは独立で、 向きだけが逆である (足すでなく置き換える)。 ADR-1046 の器の repo の憲法の置き場 (正本は constitution.html の機械層・docs/constitution.md は生成の写し) は変えず、 器の repo は key を書かずに既定のままとする (既定を替えるのは器の repo の憲法の形が変わるとき)。
  照会終端 — PRIN-CONSUMER-DECLARES-ITS-OWN-SHAPE (ADR-1047)
  対象 repo の形 (どの dir が何か) は、 その repo の事実である。 器は種別と上限と極性を持ち、 値はその repo に名乗らせる——名乗らない周は器の既定で動き、 名乗りが読めない周は最も厳しい側へ倒す。
  本 ADR が既定に足す形・消費側が置く docs/constitution.md・雛形の穴・本文の差し込み・dir や glob の名乗りを退け、 既定を置き換える任意 key と閉じた 3 値の読みを選んだのは、 ADR-1047 のこの原則に行き着く (これ以上は遡らない照会終端)。 憲法の在りかは repo の事実なので repo が名乗り、 名乗らない repo (宣言 file が無い・key が無い) は器の既定 (docs/constitution.md) で動く。 原則の「名乗りが読めない周は最も厳しい側へ倒す」を本 ADR が当てるのは宣言が在って壊れた周だけで、 その周は既定に倒さず INCONCLUSIVE で止まる。 git show が理由によらず落ちる周は宣言の中身に届かないので、 TablePlaces と同じく既定で動く (残る危険と受け入れる理由は CSQ-N7)。
options:
  - id: "OPT1"
    name: "vessel 宣言の任意 key constitution が file の列を名乗り、 既定を置き換え、 頼みの文の 1 句を差し替える"
    text: |
      vessel 宣言に任意 key constitution (repo 相対の file の path の配列・字は英数字と . _ / - に閉じる) を足し、 名乗った列が既定の docs/constitution.md を置き換える。 名指した rev の宣言を閉じた 3 値で読む口を 1 つ置き、 lens は cap の後に --worktree の HEAD の宣言を読んで列を 1 本ずつ §47 の 3 値で測り、 key の在る周だけ頼みの文の憲法の path の句を埋める前に列へ差し替える。 決め手は repo の形を repo が名乗る先例と、 写しを作らせない向き (CTX2・CTX3)。
      （平易）repo の設定 file (vessel 宣言) に、 書かなくてよい項目 constitution を足します。 値は repo の中の file の場所の一覧で、 字を英数字と . _ / - に限り、 書いた一覧が既定の docs/constitution.md の代わりになります。 審査役は commit 済みの設定を読み、 一覧の file を 1 本ずつ在る・無い・読めないに測って、 全部が在る回だけ依頼文の「憲法はどこか」の句を一覧に差し替えて審査役を起こします。 どんな形の正本も写しを作らずに名指せ、 書かない repo の依頼文と雛形の指紋は 1 byte も変わらず、 測れない回は直す物を名指して「判定できず」になり、 字を限るので差し込んだ字が依頼文の差し込み口や記号を作らず、 本文を依頼文に入れないので審査役の読む量の上限も食いません。 代わりに、 古い本体は新しい項目を知らずに設定全体を断ること、 契約表の置き場の項目 (足す) と向きが逆になること、 名乗った file が憲法かは器が確かめず木の外の file は名乗れないこと、 設定を壊すと項目の有無によらず直すまで審査が止まること、 dir や glob を書けず複数の file は並べて書くこと、 git が設定を読めない回は項目を書いていても既定を測ることを引き受けます。
      利点: 正本をどんな形の file で持つ置き場も、 宣言 1 行で正本の file を lens の観点に名指せ、 写しを作らずに済む (DR1・DR3)
      利点: key を書かない repo の prompt と雛形の hash は 1 byte も変わらず、 行の審査の記録が撃ち直しにならない (DR2)
      利点: 名乗った file の無い周・読めない周と、 在る宣言が壊れて読めない周は claude を起こさず、 直す物を evidence が名指す INCONCLUSIVE になる (DR4)
      利点: 字を閉じるので、 差し込んだ字が雛形の穴や backtick を作らない
      利点: 本文を prompt に入れないので、 材料の byte は今と同じで cap を食わない (DR3)
      欠点: 宣言の key が 1 つ増え、 古い binary は key を未知として宣言全体を断る (DR5)
      欠点: 任意 key の向きが contract-tables (足す) と逆になり、 key ごとに足すか置き換えるかが分かれる
      欠点: 中身は読まないので、 名乗った file が憲法かは置いた席が負い、 木の外の file は名乗れない
      欠点: 宣言を持つ置き場は key の有無によらず、 宣言を壊すと直すまで diff の審査の gate が全部 INCONCLUSIVE で止まる (DR4)
      欠点: dir と glob は名乗れず、 正本が複数 file の置き場は file を列で並べて書く
      欠点: git show が理由によらず落ちる周は、 名乗った key があっても既定の docs/constitution.md を測る
    verdict: adopted
    reason: "決め手は repo の形を repo が名乗る先例と、 写しを作らせない向き (CTX2・CTX3)。"
  - id: "OPT2"
    name: "key が既定に足す (contract-tables と同じ向き)"
    text: |
      key の列を既定の docs/constitution.md に足し、 既定と列の両方を測る。 決め手は既定の写しを持たない置き場の扱い (CTX2)。
      （平易）項目に書いた一覧を既定の docs/constitution.md に足し、 両方を測る案で、 契約表の置き場の項目と同じ向きです。 項目ごとの向きが揃って覚えやすく、 設定 1 行で既定の測りを外せない点で勝ります。 けれども、 既定の写しを持たない repo は既定の測りで落ちて審査を通れず、 結局写しを作らせることになり、 書いた repo にも消すべき写しが残ります。
      利点: 任意 key の向きが契約表の置き場の key と揃い、 key ごとの意味を覚える手間が減る
      利点: 宣言 1 行で既定の docs/constitution.md の測りを外せない
      欠点: 既定の写しを持たない置き場は既定の測りで落ちて審査を通れず、 写しを作らせることになる (DR1・DR3)
      欠点: key を書いた置き場にも、 消すべき既定の写しが残る (DR3)
    verdict: rejected
    reason: "決め手は既定の写しを持たない置き場の扱い (CTX2)。"
  - id: "OPT3"
    name: "消費側が正本から docs/constitution.md を作る (生成した写し・正本を名指す数行・symlink のどれでも・器は変えない)"
    text: |
      宣言の key を足さず、 消費側の置き場が §47 の置き場の決まりのまま、 木に docs/constitution.md を置く (正本から生成した写し・正本を名指す数行・symlink のどれでもよい)。 決め手は木に残る決め打ちと頼みの文の呼び方 (CTX1・CTX2)。
      （平易）器は変えず、 repo の側が前の設計 (§47) の決まりのまま、 木に docs/constitution.md を置く案です。 置き方は、 正本から生成した写し・正本を名指す数行・symlink のどれでもよい。 器の変更が無く、 設定の項目も版の違いの壊れ方も増えず、 今の本体のままで通る点で勝ります。 けれども、 相手の木に器の決め打ちの場所 (docs/constitution.md) の file が 1 つ増えて残り、 依頼文は今も憲法を「起動 cwd の生成 file」と呼んで正本を名指しません。 写しで作る形では、 正本と写しの食い違いを見張る面も増えます。
      利点: 器の変更が 0 で、 宣言の key も跨版の壊れ方も増えない (DR5)
      利点: §47 の置き場の決まりのまま、 今の binary で通る
      欠点: 消費側の木に器の決め打ちの path (docs/constitution.md) の file が 1 つ増えて残る (DR1)
      欠点: 頼みの文は今も憲法を「起動 cwd の生成 file」と呼び、 正本を名指さない (DR1)
      欠点: 写しで作る形では、 正本と写しの食い違いを見張る面も増える (DR3)
    verdict: rejected
    reason: "決め手は木に残る決め打ちと頼みの文の呼び方 (CTX1・CTX2)。"
  - id: "OPT4"
    name: "雛形 lens.txt に穴 {constitution} を足して埋める"
    text: |
      句の差し替えでなく、 雛形の観点の行に穴を足し、 既定の周も key の周も同じ埋めで組む。 決め手は雛形の hash (CTX4)。
      （平易）句を差し替えるのでなく、 依頼文の雛形 lens.txt の観点の行に差し込み口 {constitution} を足して埋める案です。 差し替える句を雛形の外に持たずに済み、 憲法の置き場が雛形の中で差し込み口として見え、 既定の回も項目の回も同じ埋め方で組める点で勝ります。 けれども、 雛形が 1 字でも変わると雛形の指紋が変わり、 本体の入れ替えの後に全部の行の審査の記録が撃ち直しになります。 項目を書かない repo の雛形も変わります。
      利点: 差し替えの句を雛形の外の定数に持たず、 憲法の置き場が雛形の中で穴として見える
      利点: 既定の周も key の周も同じ 1 走査の埋めで組めて、 分岐が 1 つ減る
      欠点: 雛形 lens.txt の hash が変わり、 binary の入れ替えの後に全部の行の審査の記録が撃ち直しになる (DR2)
      欠点: key を書かない repo の雛形も 1 字変わる (DR2)
    verdict: rejected
    reason: "決め手は雛形の hash (CTX4)。"
  - id: "OPT5"
    name: "器が憲法の本文を読んで prompt に差し込む"
    text: |
      file の path を名指すのでなく、 器が名乗った file の本文を読んで頼みの文に差し込む (§47 の却下と同じ形)。 決め手は cap と写しの重なり (CTX4)。
      （平易）file の場所を名指すのでなく、 器が憲法の本文を読んで依頼文に差し込む案です (前の設計 §47 でも退けた形)。 審査役が木を読みに行かなくても憲法の中身が確実に依頼文に在り、 審査役の読みの道具の届き方に依らない点で勝ります。 けれども、 本文の分だけ審査役 1 本の読む量の上限 (NFR1001) を食い、 審査役は木を読めるのに本文の写しを依頼文に重ねます。 項目を書かない repo の依頼文も変わります。
      利点: lens が木を読みに行かずに、 憲法の中身が確実に prompt に在る
      利点: lens の読みの道具の届き方に依らない
      欠点: 材料の byte が cap (NFR1001) を食う (DR3)
      欠点: lens は木を読めるのに、 本文の写しを prompt に重ねる (DR3)
      欠点: 頼みの文の中身が変わり、 key を書かない repo でも prompt が変わる (DR2)
    verdict: rejected
    reason: "決め手は cap と写しの重なり (CTX4)。"
  - id: "OPT6"
    name: "key の項目に dir や glob を名乗れるようにする"
    text: |
      key の項目に dir (その下の file の全部) や glob を書けるようにし、 当たる file を憲法として測る。 決め手は測りの 3 値の単位 (CTX1)。
      （平易）項目に dir (その下の file の全部) やワイルドカード (glob) を書けるようにする案です。 正本が複数 file の repo は 1 項目で短く書け、 正本の file が増えても設定を書き直さずに済む点で勝ります。 けれども、 在る・無い・読めないの測りが file 1 本ごとに決まらなくなります。 正本が複数 file なら、 file を一覧で並べて書けば足ります。
      利点: 正本が複数 file の置き場は、 1 項目で短く書ける
      利点: 正本の file が増えても、 宣言を書き直さずに済む
      欠点: 在る・無い・読めないの 3 値が file 1 本ごとに決まらなくなる (DR4)
      欠点: 正本が複数 file なら、 file を列で名乗れば足りる
    verdict: rejected
    reason: "決め手は測りの 3 値の単位 (CTX1)。"
basis: [FR1009, NFR1001, ADR-1010, ADR-1046, ADR-1047, ADR-1109]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「便」は契約 1 本を実装して main へ入れる 1 回の走り、 「審査役 (lens)」は便の差分を観点ごとに読んで判定する AI です。 観点の 1 つは「憲法に反していないか」で、 器は審査役を起こす前に、 木の docs/constitution.md が在るかを測っています。 けれども、 この場所は器が自分の repo の作り方 (憲法から生成した写し) を決め打ちしたもので、 憲法の正本を別の形の file で持つ repo は、 写しか正本を指す file をもう 1 つ置かないと審査を通れません。 この記録は、 repo が自分の設定 file に「憲法はこの file」と書けるようにし、 書いた repo では器がその file を測って、 審査役への依頼文の「憲法はどこか」の句をその file に差し替えると決めます。 書いた file は既定の docs/constitution.md の代わりになり、 書かない repo の依頼文は 1 字も変わりません。 測れない回は、 要件 FR1009 と同じ向きで、 合格を名乗らずに「判定できず」を返します。 憲法の本文は依頼文に入れないので、 審査役 1 本の読む量の上限 (NFR1001) も食いません。
