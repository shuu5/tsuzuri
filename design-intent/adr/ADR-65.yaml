# 判断の記録 ADR-65 — gate の共通 verify は同じ便の終わりの門の緑を同じ木と base で持ち越し、着地列の窓は CAS を過ぎた便を列に数えない
# 器の判断の記録 ADR-1102（器の ADR-0102 の写し）の却下の 1 項（gate が門の緑を持ち越して撃ち直さない）と要件 FR1008 の主張を、測り直して置き換える（ADR-1102 の本文は封で替えない）。
# 起草は係 w264a（2026-10-05）。材料は調べ係 rs4 の 10-05 の記録の測りと、係の試作（差の両順の当たり・歯と噛み）。
id: ADR-65
title: gate の共通 verify は同じ便の終わりの門が同じ木と base で全行を緑で撃った周に撃たずに持ち越し、着地列の窓は自分の squash が local main に在る便を列に数えない（器の判断の記録 ADR-1102 の却下の 1 項と要件 FR1008 の主張を置き換える）
status: accepted
date: 2026-10-05
context: |
  便 1 本は同じ xtask の check を 2 度から 3 度撃つ。runner の終わりに器が撃つ終わりの門（中央 166 秒）と、直後の gate の共通 verify（中央 177 秒・gate の時間の 87%）と、着地の主実測である。10-05 の 83 便で gate の共通 verify は計 19,905 秒だった（調べ係 rs4 の記録）。門と gate は同じ便の写しの共通 verify の行を、同じ worktree の同じ木で撃つ。器の設計（pipeline.md の 66 節の却下）は持ち越しを、節約が約 137 秒で gate が独立に測る性質が弱まるとして退け、gate の時間が問題になったら測り直して決めると書いた。今の中央は 177 秒で、器の判断の記録 ADR-1102 は要件 FR1008 を替えずに gate が全行を撃つと主張している。
  席の設計の commit は着地列の窓（land-window）が開くまで待つ。窓は、CAS の後に主実測（平均 361 秒）を撃っている便も列に数える。CAS の後は main に自分の squash が載り anchor も揃え済みで、主実測は自分の squash の木を自分の worktree で測り、push は main を押して remote の先へ進んだ main を受けるので、席の commit がその間に main に積まれても器に損は無い。CAS の前に積むと追随をやり直す。
decision: |
  (1) gate の持ち越し（器の行 v-gate-carry・ノート surface-wave29d）。終わりの門は撃つ前に worktree が clean なら木の sha を読み、緑の周だけ要約の行に撃った木と base を足す。gate は、門の最後の要約が緑で、その木が gate の木と、その base が gate の base と同じ周に限り、共通 verify の段を撃たず、verify の記録の末に持ち越した木と記録の在りかを名指す skip の record を 1 本置く。write-set の段と契約の verify と lens は gate が今のとおり撃つ。記録が無い・読めない・緑でない・木か base が違う周は今のとおり全部撃つ。着地の主実測と候補の木の検査は替えない。
  (2) 要件 FR1008 の shall と plain に (1) の但し書きを足す（要件書の版を上げる）。
  (3) 着地列の窓（器の行 v-window-cas・同じノート）。窓の列の判定から、自分の trailer を持つ squash が local main の祖先に在る便（CAS を過ぎて主実測と終端の間の便）を外す。追随中の便と CAS の前の便と未 push の main の判定（origin の上の merge が未 push の squash と分岐しない守り）と、行の字と rc は替えない。local main に積むだけの撃ち手（席の設計の commit の道具）は、列と追随中の欄が空の行で進める。
  (4) 置き換えの範囲。器の判断の記録 ADR-1102 の本文は替えず、この記録がその却下の 1 項（gate が門の緑を持ち越して撃ち直さない）と、要件 FR1008 の主張（gate は門の結果を持ち越さずに全行を撃つ）を置き換える。
options:
  - id: a
    name: 甲 — 門の緑を同じ木と base で持ち越し、窓は CAS を過ぎた便を数えない
    text: 決定 (1) から (4)。
    verdict: adopted
    reason: 便ごとに約 3 分の待ちと 1 回分の組みの書きが消え、席の設計の commit が主実測の間に入れる。物差しは門も gate も便の写しの凍った共通 verify で、runner の申告を持ち越すのではない。失うのは同じ木の 2 度目の撃ち（揺れる歯を 2 度測る機会と、門の後の host で測り直すこと）だけで、木と base の一致で結ぶ。
  - id: b
    name: 乙 — 今のまま
    text: 門と gate が同じ木を 2 度撃ち、窓は主実測の間の便も数える。
    verdict: rejected
    reason: 10-05 だけで約 5.5 時間の撃ち直しと、席の commit の待ち（commit から main まで上から 1 割 229 秒・最大 1,830 秒）が続く。
  - id: c
    name: 丙 — 門を外し gate だけで撃つ
    text: runner の終わりの門をやめ、gate の 1 回だけにする。
    verdict: rejected
    reason: 門は赤の周に runner を同じ worktree で起こし直して直させる輪を持つ（器の設計の 66 節）。外すと gate の落ちが増え、便ごと撃ち直す。
basis: [ADR-1102, FR1008, P-4, P-6, P-7, P-9]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、便の直列の詰まりの memo（t3-hub.89）か後継の memo の notes に記帳する。7 日の窓の始まりは持ち越しの行（v-gate-carry）の着地の commit の時刻である。問う相手は持ち主。
    (1) verify の記録に持ち越しの skip の record（kind と skipped が共通 verify の段の語）を持つ便が、着地の主実測か候補の木の検査で赤になった周が 7 日に 1 度でも在れば、持ち越しを外す行を置くかを問う。
    (2) 持ち越しの行（v-gate-carry）の着地の後の 7 日で、gate（Implemented から最初の Gated まで）の中央が 120 秒を下回らなければ、節約が出ていないと報告する。
    (3) 窓の行（v-window-cas）の着地の後の 7 日で、CAS を過ぎた便の後に席の設計の commit が main に入り、その便の終端が push の失敗か CI の測れない終端になった周が 2 度在れば、窓の替えを外すかを問う。
plain: |
  作業の便は、終わりに器が同じ検査（約 3 分）を 2 度続けて撃っていました。1 度目と同じ中身（木）で緑だったときは、2 度目を撃たずに 1 度目の結果を記録つきで使います。中身が違う・記録が読めないときは今までどおり撃ちます。
  席が設計の変更を入れる前の待ちも短くします。便が main に載った後の確かめの最中なら、席の変更が後ろに積まれても器は困らないので、その便は待ちの数に入れません。
grill:
  when: 2026-10-05
  who: 起草係 w264a（AI・試作と読みの範囲）
  where: 起草の置き場の w264a の notes.md の 3 節と 7 節
  summary: 失うのは同じ木の 2 度目の撃ちだけで、木と base の一致で結ぶ。持ち越しの証は置き場の file に在り、便の写しと同じ信頼の境に立つ（新しい種類の穴は開けない）。窓の替えは未 push の判定を残す。
approval:
  who: 持ち主
  date: 2026-10-05
  ruling: "t3-hub.89.18（裁定 id = t3-hub.89.18:20261005T2354Z-1・notes に逐語）"
  verbatim: "推奨でよい"
  surface: R-8
consequences:
  - 便ごとに gate の共通 verify の撃ち（中央 177 秒）と組みの書きが消える。門と gate と着地の主実測のうち、同じ木の xtask の check は門の 1 回になりうる（主実測は gate の木と着地の木が同じ周を今も省く）。
  - 揺れる歯は同じ木で 1 度しか測られない。揺れて落ちる gate の撃ち直しも消える。
  - 席の設計の commit は、着地の便が CAS を過ぎた後なら主実測を待たずに入れる。その時は席の push が便の squash を先に origin へ載せ、便の着地の記帳の main の欄は席の commit の sha になりうる。
note: 起草は係 w264a。承認の欄の逐語と経路は、適用の script が台帳の問いの notes の定型行から読んで入れた。
