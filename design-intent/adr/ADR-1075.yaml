# 判断の記録 ADR-1075 — 器 scribe2 の判断の記録 ADR-0075 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1075
title: "逼迫の門のモデル別窓は役割の model の窓だけを数える — 5 時間窓と 7 日窓は今のまま全部、 モデル別 7 日窓は群の席の役割の model の行だけで逼迫を判じる (ADR-1055 と ADR-1069 の窓の読みを部分 supersede)"
status: accepted
date: 2026-09-26
context: |
  口座が上限に近いかは 3 つの窓 (5 時間・7 日・model ごとの 7 日) で判じる。 今の門は model ごとの窓を「どの model でも」数えるので、 席を Opus で走らせても Fable の窓が埋まった口座は上限扱いのまま、 移り先にも使えず、 今の口座なら移動を起こす。 本 ADR は model ごとの窓を席の役割の model の窓だけに絞り、 移り先の並べ方 (ADR-1069 の残量の鍵) と同じ読みに揃える。
  なぜこの判断が要るのかを、 経緯 (門は 3 窓の全部を閾値で断る)・事象 (席の既定を Opus に替えても Fable の窓で群が止まる)・機序 (判定の関数が model の名を見ずに数える)・これまでの決まり・この判断の範囲の 5 つから説明します。 移り先の並べ方 (ADR-1069 の残量の鍵) は既に役割の model の窓だけを読んでいて、 門と並べ方とで読みが食い違っていました。
  CTX1 経緯 — 門は 3 窓の全部を閾値で断る (ADR-1055・ADR-1069)
  ADR-1055 は群の逼迫（口座が上限に近いこと）を 5 時間窓・7 日窓・モデル別窓のいずれかが閾値の rules 行の値以上である状態と決めた。 ADR-1069 は移り先の門（移り先に使える条件）も 3 窓の全部を閾値で断り、 実データのモデル別の行は Fable だけなので Fable が 95 以上の口座は候補に入らないと書いた。 同じ ADR-1069 の残量の鍵（候補を並べる物差し）は、 モデル別窓（model ごとの 7 日枠）を役割の model（席の既定の model） (rules 行 seat.model.<役割>) の行だけで読む。 門と鍵とで、 モデル別窓の読みが食い違っている。
  CTX2 事象 — 席の役割の既定を Opus に替えても、 Fable の窓で群が止まる
  2026-09-26、 持ち主は orchestrator の既定の対を opus / xhigh に替えると裁定した (設計 seat-roles.md §28)。 同じ日の実測で、 口座 6 つのうち 5 つの Fable の窓が 95 以上で、 そのうち 4 つは 7 日窓が 50 から 92 だった (口座名は台帳)。 usage API（使用率を返す外部の口） は Fable の窓しか返さない。 今の門のままでは、 席が Opus で走る群もこの 4 口座を移り先にできず、 今の口座なら逼迫と読んで移動や断りを起こす。
  CTX3 機序 — 門の 1 関数は model の名を見ずにモデル別窓の行を数える
  逼迫の判定は 1 つの pure な関数 (口座の最新の実測の行を窓の閾値と比べ、 どれかが閾値以上なら越えた窓の最大の 1 つ) で、 群の移動の判定・移り先の門・先の群の逼迫・席の turn の 1 行・管理 tick の口座の門（上限の席を促さない条件）の 5 か所が呼ぶ。 モデル別窓の行は model の名を持つのに、 関数は名を読まない。 役割の model の集合を読む関数 (群の置き場の席の登録 row の役割ごとの rules 行の表示名) は既に在り、 鍵だけが使っている。
  CTX4 憲法と既存の決定の向き (本 ADR の解釈)
  C2 (同じ事実の読みは 1 本) から、 モデル別窓をどの model で読むかは門と鍵で 1 つにし、 役割の model の集合を読む既存の関数を門でも使う。 C17 (決定はしご) から、 新しい rules 行も新しい計測も足さず、 既に在る集合を判定の関数へ渡すだけにする。 C1 (既定を出さない) から、 役割の行が無い周は集合を空に読み替えず、 今の typed な止まり方 (判定は読めない・予約は行なし) に倒す。 ADR-1058 の口座の門は「閾値を越えた口座」とだけ書き窓を名指さないので、 同じ関数を通して本 ADR に従う。
  CTX5 射程 — 動かすのはモデル別窓の読みと、 呼び手が渡す集合だけ
  動かすのは (1) 判定の関数がモデル別 7 日窓を役割の model の表示名の集合に在る行だけで数えること (集合が空ならモデル別窓を数えない)、 (2) 役割 1 つの model を読む関数を 1 つに切り出すこと、 (3) 5 つの呼び手が判じる群 (tick は自席の役割) の集合を渡すこと。 動かさないのは、 5 時間窓と 7 日窓の読み・閾値の rules 行 3 本と値・残量の鍵・予約の規則 (ADR-1069・ADR-1074)・便用の口座選定 (ADR-1042)・usage の計測と実測の行の形・event の種類。
  （選択肢を測るものさし）この判断を評価する 4 本のものさしです。 席を走らせる model の上限だけが群を止めること (使わない model の窓は移動を起こさない)。 門と並べ方のモデル別窓の読みを 1 つにすること。 使う model の上限は今のまま守ること (役割の model の窓が閾値以上の口座は断る)。 足すものを最小にすること (新しい rules 行・計測・状態を足さない)。
  DR1｜席を走らせる model の上限だけが群を止める — 使わない model の窓は移動を起こさない CTX2・CTX3
  DR2｜門と鍵のモデル別窓の読みは 1 つ — 役割の model の集合を読む関数を両方が使う (C2) CTX1・CTX4
  DR3｜使う model の上限は今のまま守る — 役割の model の窓が閾値以上の口座は門で断る (ADR-1069 の差し戻しへの答えを保つ) CTX1・CTX5
  DR4｜足すものを最小にする — 新しい rules 行・計測・状態を足さず、 既に在る集合を渡すだけ (C17) CTX3・CTX4
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 判定の関数は役割の model の名の集合を受け、 model ごとの 7 日窓は名が集合に在る行だけを閾値と比べます。 5 時間窓と 7 日窓は今のまま全部比べます。 呼び手は判じる群の集合を渡し、 管理 tick は自席の役割 1 つの集合を渡します。 支えるのは FR1038 (群の逼迫の通知と移動) の根拠と FR1027 (管理 tick) への主張です。
  採用 — OPT1
  逼迫の判定の関数 SHALL 役割の model の表示名の集合を受け、 モデル別 7 日窓の実測の行は model の名 (閉じた表で読んだ表示名) が集合に在る行だけを閾値と比べ、 集合が空ならモデル別窓を数えない。 5 時間窓と 7 日窓 SHALL 集合に依らず今のまま全部を閾値と比べる。 役割 1 つの model (rules 行 seat.model.<役割> の表示名) を読む関数 SHALL 1 つで、 役割の model の集合を読む既存の関数はそれを登録 row ごとに呼ぶ。 群の移動の判定・先の群の逼迫・席の turn の 1 行 SHALL 判じる群の集合を渡し、 移り先の門 SHALL 群ごとの集合を渡し、 管理 tick の口座の門 SHALL 自席の役割 1 つの集合 (行が無い周は空＝門は正の証拠でだけ閉じる) を渡す。 群の移動の判定は集合を読めない周に逼迫を測らず読めないと判じ、 席の turn の 1 行は出さない。 閾値の rules 行と値・残量の鍵・予約の規則・便用の口座選定・usage の計測と実測の行の形・event の種類は変えない。 本 ADR は ADR-1055 の「モデル別窓のいずれか」と ADR-1069 の「門は 3 窓の全部」のモデル別窓の読みを置き換え、 要件書は変えない (FR1038 / AC1041 の範囲)。
  （平易）逼迫を判じる関数は、 役割の model の名の集合を受けます。 model ごとの 7 日窓の実測の行は、 名が集合に在る行だけを閾値と比べ、 集合が空なら model ごとの窓は数えません。 5 時間窓と 7 日窓は集合に依らず今のまま全部比べます。 役割 1 つの model を読む関数は 1 つで、 集合を読む既存の関数はそれを登録 row ごとに呼びます。 群の移動の判定・先の群の逼迫・席の turn の 1 行は判じる群の集合を、 移り先の門は群ごとの集合を、 管理 tick の口座の門は自席の役割 1 つの集合 (行が無い周は空) を渡します。 群の移動の判定は集合を読めない周に逼迫を測らず読めないと判じ、 席の turn の 1 行は出しません。 閾値の行と値・残量の鍵・予約の規則・便用の口座選定・計測と実測の行の形・event の種類は変えません。 この記録は ADR-1055 と ADR-1069 のモデル別窓の読みを置き換え、 要件書は変えません。
  （理由）持ち主の裁定は、 群の逼迫の門のモデル別窓を役割の model の集合の行だけで数える、 の受諾でした。 席は役割の model で走るので、 群を止める理由になる上限はその model の窓と、 model に依らない 5 時間窓と 7 日窓です。 移り先の並べ方は既に役割の model の窓だけを読んでいて、 門だけがどの model の窓も数えていました。 同じ事実の読みを 1 つにするため、 並べ方が使う集合の関数を門でも使います。 モデル別窓を門から外す形は、 役割の model の窓が埋まった口座を通してしまうので採りません。 起動の実物で数える形は読みが 2 つになるので採りません。 集合を読めない周は空に読み替えず、 今の typed な止まり方に倒します。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1038（rationale）: FR1038 (群の逼迫の通知と移動) は逼迫した群が別の口座へ移ると書く。 本 ADR は、 逼迫を席の役割の model の上限で判じる根拠 (使わない model の窓で群を止めない・門と鍵の読みを揃える) を与える (裁定 2026-09-26T15:52Z)。
  FR1027（claim）: FR1027 (管理 tick) の口座の門と群の判定の周は同じ判定の関数を呼ぶ。 本 ADR はその周が自席の役割の model の窓だけを読み、 計測を起こさない形と判定の列の順は変えないと主張する。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録は ADR-1055 の「モデル別窓のいずれか」と ADR-1069 の「門は 3 窓の全部」のうち、 モデル別窓の読みだけを置き換えます。 測る契機・通知の形・閾値の値・残量の鍵・門の他の条件・予約の導き・口座の門の位置は保ちます。 行き着く原則は「止まる理由は、 自分が使うものの上限だけ」です。
  改訂状態: current
  置き換える ADR: ADR-1055, ADR-1069
  置き換えられた: なし (現行)
  部分 supersede で、 置き換えるのは 2 つ — ADR-1055 の群の逼迫の定義の「モデル別窓のいずれか」と、 ADR-1069 の門の「3 窓の全部 (モデル別 7 日窓はどの model でも)」 — のモデル別窓の読みだけで、 他は保つ。 保つのは、 ADR-1055 の測る契機 (便の終端の周と席の hook の 2 系統)・通知の形・閾値の値、 ADR-1069 の残量の鍵・門の他の条件・予約の導き (ADR-1074 の改めを含む)・予約を記録しないこと、 ADR-1058 の口座の門の位置と計測を起こさない形、 の全部。
  照会終端 — PRIN-MEASURE-WHAT-YOU-RUN-ON
  止まる理由は、 自分が使うものの上限だけ。
  本 ADR が「どの model の窓も数える」「モデル別窓を門から外す」「起動の実物で数える」を退け、 モデル別窓を役割の model の窓に絞ったのはこの原則に行き着く (これ以上は遡らない照会終端)。
options:
  - id: "OPT1"
    name: "モデル別窓は役割の model の窓だけを数える"
    text: |
      判定の関数に役割の model の表示名の集合を渡し、 モデル別 7 日窓は model の名が集合に在る行だけを数える。 5 時間窓と 7 日窓は今のまま全部数える。 呼び手は判じる群の集合 (tick は自席の役割 1 つ) を渡す。 決め手は持ち主の裁定 (15:52Z)。
      （平易）判定の関数に、 群の席の役割の model の名の集合を渡す案です。 model ごとの 7 日窓は、 名が集合に在る行だけを閾値と比べます。 5 時間窓と 7 日窓は今のまま全部比べます。 席が Opus で走る群は Fable の窓で止まらず、 7 日窓に余裕のある口座へ移れます。 門と並べ方が同じ集合を読み、 役割の model が Fable の群は今のまま Fable の窓で断られます。 足すのは関数の引数 1 つと、 役割 1 つの model を読む関数 1 つです。 代わりに、 usage API が Opus の窓を返さない間は Opus の群の門が 5 時間窓と 7 日窓だけで判じ、 呼び手と既存の歯の fixture が動きます。 持ち主の裁定で選びました。
      利点: 席を Opus で走らせる群は Fable の窓で止まらず、 7 日窓に余裕のある口座へ移れる (DR1)
      利点: 門と鍵が同じ集合でモデル別窓を読む (DR2)
      利点: 役割の model が Fable の群は今のまま Fable の窓で断る (DR3)
      利点: 足すのは関数の引数 1 つと役割 1 つを読む関数 1 つで、 rules 行も計測も増えない (DR4)
      欠点: usage API が Opus の窓を返さない間は、 Opus の群のモデル別窓は空で、 門は 5 時間窓と 7 日窓だけで判じる
      欠点: 判定の関数の呼び手 5 つと既存の歯の fixture (モデル別窓の名) が動く
    verdict: adopted
    reason: "決め手は持ち主の裁定 (15:52Z)。"
  - id: "OPT2"
    name: "現状維持 — どの model のモデル別窓も数える"
    text: |
      門は今のまま 3 窓の全部を閾値で断る。 決め手は分析 (役割の既定を替えた意味が群に届かない)。
      （平易）門を今のまま、 どの model の窓も閾値で数える案です。 器に足すものが無い点で勝ります。 けれども、 席を Opus に替えても Fable の窓が埋まった口座は移り先にならず、 今の口座なら移動を起こします。 門と並べ方とでモデル別窓の読みが食い違ったまま残ります。 退けました。
      利点: 器に足すものが無い
      欠点: 席を Opus に替えても Fable の窓が埋まった口座は移り先にならず、 今の口座なら移動を起こす (DR1)
      欠点: 門と鍵とでモデル別窓の読みが食い違ったまま残る (DR2)
    verdict: rejected
    reason: "決め手は分析 (役割の既定を替えた意味が群に届かない)。"
  - id: "OPT3"
    name: "モデル別窓を門から外す"
    text: |
      門は 5 時間窓と 7 日窓だけで判じ、 モデル別窓は鍵にだけ使う。 決め手は分析 (使う model の上限を守れない)。
      （平易）門は 5 時間窓と 7 日窓だけで判じ、 model ごとの窓は並べ方にだけ使う案です。 判定の関数の入力が変わらない点で勝ります。 けれども、 役割の model の窓が閾値以上の口座を門が通してしまい、 前の決定の差し戻し (Fable の窓が高い口座が選ばれないか) への答えを失います。 usage API が Opus の窓を返すようになった周にも、 Opus の上限を守れません。 退けました。
      利点: 判定の関数の入力が変わらない
      欠点: 役割の model の窓が閾値以上の口座を門が通す。 ADR-1069 の差し戻し (Fable の窓が高い口座が選ばれないか) への答えを失う (DR3)
      欠点: usage API が Opus の窓を返すようになった周に、 Opus の上限を守れない (DR3)
    verdict: rejected
    reason: "決め手は分析 (使う model の上限を守れない)。"
  - id: "OPT4"
    name: "席の登録 row の model (起動の実物) で数える"
    text: |
      役割の既定でなく、 席の登録 row に残る起動の model の名でモデル別窓を選ぶ。 決め手は分析 (読みが 2 つになる)。
      （平易）役割の既定でなく、 席の登録 row に残る起動の model の名で窓を選ぶ案です。 手で model を替えた席の実物に合う点で勝ります。 けれども、 役割の既定と起動の実物が食い違う周に、 門と並べ方とで読みが 2 つになります。 登録 row の model は起動の 1 回の値で、 席の中の切り替えは届かないので、 実物とも限りません。 退けました。
      利点: 手で /model を替えた席の実物に合う
      欠点: 役割の既定と起動の実物が食い違う周に、 門と鍵とでモデル別窓の読みが 2 つになる (DR2)
      欠点: 登録 row の model は起動の 1 回の値で、 席の中の切り替えは届かないので実物とも限らない
    verdict: rejected
    reason: "決め手は分析 (読みが 2 つになる)。"
basis: [FR1027, FR1038, AC1041, ADR-1042, ADR-1055, ADR-1058, ADR-1069, ADR-1074]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  この記録で「器」は scribe2 の本体、 「席」は人と AI が話す 1 つの session、 「群」は同じ口座の候補を共に使う project の集まり、 「逼迫」は口座が上限に近いこと、 「役割の model」は席の役割ごとの既定の model です。 口座が上限に近いかは 3 つの窓 (5 時間・7 日・model ごとの 7 日) で判じます。 今の門は model ごとの窓を「どの model でも」数えるので、 持ち主が席の既定を Opus に替えても、 Fable の窓が埋まった口座は上限扱いのまま移り先にならず、 今の口座なら移動を起こします。 同じ日の実測では、 口座 6 つのうち 4 つが Fable の窓は 95 以上なのに 7 日窓には余裕がありました。 この記録は、 model ごとの窓を席の役割の model の窓だけに絞り、 移り先の並べ方 (残量の鍵) と同じ読みに揃えると決めます。 5 時間窓と 7 日窓は今のまま全部数えます。 持ち主は 2026-09-26 にこの形を裁定しました。
