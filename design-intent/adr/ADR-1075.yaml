  surface: R-8
consequences:
  - "この判断で良くなること 3 つと、 代わりに引き受けること 3 つです。 良くなるのは、 Opus で走る群が Fable の窓の埋まった口座へも移れること、 門と並べ方の読みが 1 つになること、 役割の model が Fable の群は今のまま守られることです。 引き受けるのは、 usage API が Opus の窓を返さない間は Opus 固有の上限が見えないこと、 判定の関数の呼び手と既存の歯の fixture が動くこと、 役割の行を欠く規則の写しでは群の判定が逼迫を測る前に読めないと判じることです。"
  - "良い結果: 席を Opus で走らせる群は、 Fable の窓が埋まっていても 7 日窓に余裕のある口座へ移れ、 今の口座も Fable の窓だけでは逼迫と読まれない"
  - "良い結果: 門と鍵が同じ役割の model の集合でモデル別窓を読み、 読みが 1 つになる"
  - "良い結果: 役割の model が Fable の群は今のまま Fable の窓で断られ、 使う model の上限は守られる"
  - "代償: usage API が Opus の窓を返さない間、 Opus の群の門は 5 時間窓と 7 日窓だけで判じる (Opus 固有の上限は見えない)"
  - "代償: 判定の関数の呼び手 5 つと、 モデル別窓の名を決め打ちした既存の歯の fixture が動く"
  - "代償: 役割の行を欠く規則の写しでは、 群の移動の判定が逼迫を測る前に読めないと判じる (今は逼迫でない周は留まると判じていた)"
