  器の承認の欄: 設計 (orchestrator)・orchestrator・2026-09-26 草稿 v1 (実測の口座の窓と門の 1 関数の現物を照らし、 門の窓の読みを改めた。 拘束する constitution の版 0.5.0)・作成
  器の案の章の要約: 候補を 4 つ並べます。 モデル別窓を役割の model の窓だけ数える案 (選んだ案)、 今のままどの model の窓も数える案、 モデル別窓を門から外す案、 席の登録 row に残る起動の model で数える案です。 選ばなかった 3 つは、 役割の既定を替えた意味が群に届かない・使う model の上限を守れない・読みが 2 つになる、 という理由で退けました。
  器の専門語の説明: 本文に出てくる専門語 7 個を、 やさしい言葉で説明します。
  ・モデル別窓（per-model window）: 口座の使用率のうち、 model ごと (Fable など) に 7 日で数える枠。 usage API は今 Fable の枠だけを返す。 本 ADR で、 門は役割の model の枠だけを数える。
  ・役割の model（role model）: 席の役割ごとの既定の model で、 rules 行 seat.model.<役割> が値を持つ。 群の役割の model の集合は、 群の置き場の席の登録 row の役割ごとの行の表示名。
  ・逼迫（pressure）: 口座の実測の窓のどれかが閾値の rules 行の値以上であること。 本 ADR で、 5 時間窓と 7 日窓は全部、 モデル別窓は役割の model の枠だけを数える。
  ・移り先の門（candidate gate）: 群の移り先の候補に課す条件 (今の口座でない・他の群の今の口座でない・退役中でない・鮮度の内側の実測を持ち逼迫でない) (ADR-1069)。 逼迫の読みは本 ADR に従う。
  ・残量の鍵（headroom key）: 7 日窓と役割の model の枠の残量の小さい方が大きい順 → 7 日窓の reset が早い順 → 宣言順 (ADR-1069)。 本 ADR で変えない。
  ・口座の門（account gate）: 管理 tick が席を促す前に、 登録 row の口座の新しい実測が逼迫なら促さない条件 (ADR-1058)。 計測は起こさない。 本 ADR で、 自席の役割の model の枠だけを数える。
  ・usage API（usage API）: 口座ごとの使用率 (5 時間窓・7 日窓・モデル別窓) を返す外部の口。 器は既存の計測の 1 本でこれを撃ち、 鮮度の内側では撃ち直さない。
