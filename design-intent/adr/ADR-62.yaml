# 判断の記録 ADR-62 — 追随の載せ替えで、便の自分の差の file のうち中身の替わらない物の更新の時刻を載せ替えの前の値へ戻し、追随の撃ち直しで cargo が組み直す物を main の差の分だけにする（判断の記録 ADR-35 の前提の穴を埋め、ADR-37 の決定 (1) と (9) の形 B の条件をこの行について読む）
# 判断の記録 ADR-35 と ADR-37 は封じてあるので本文は替えず、この記録に足す。
# 起草は係 w219a（2026-10-05）。材料は係 w215a の調べ（席の写し drafts/w215a/w/seat-copy-of-findings.md と同じ dir の pairs.json・closure.json・est.py・try-mtime）。検証役 qv189 の攻め（drafts/qv189/attack.md）の直しを係 w223a が入れた。
id: ADR-62
title: 追随の載せ替えで、便の自分の差の file のうち中身の替わらない物の更新の時刻（mtime）を載せ替えの前の値へ戻し、追随の撃ち直しで cargo が組み直す物を main の差の分だけにする（器の行 v-follow-mtime・形 B は撃たず形 G と形 A で測る）
status: accepted
date: 2026-10-05
context: |
  追随（main が進んだ時に便の木を main の先端へ載せ替えること）の後の 2 回目の gate は、1 回目より書きが多い。追随の前後で gate を 2 度測れた 29 対で、増え（2 回目の全段の書き − 1 回目の全段の書き）は 1 回あたり平均 3.81 ギガ（GB）・中央 3.06 GB・和 110.6 GB だった（記録から）。1 回目の共通の検査（xtask check）の書きは中央 0.52 GB である。撃ち直しは日に 9〜20 回（10-02 と 10-03 に 9・10-04 に 20・10-05 は 08 時（協定世界時）までに 14）で、増えは日に 34〜76 GB になる。
  元は 2 つ在る。① main で入った中身の差が根の要の crate（boundary・core・contract・folio を受け、surface と xtask と歯の束が受ける）に触れ、根をほぼ全部組み直す（29 対のうち 24 対は main の差だけで組み直しの集合が boundary を含む）。中身が替わるので避けられない。② 載せ替えの命令（git rebase --onto <main> <base>）は、まず main の木を取り出してから便の commit を当て直すので、便の自分の差の file を中身が同じのまま書き直し、更新の時刻を新しくする（確かめた・小さな repo で git 2.43）。器の便（自分の差が scribe2/ の下）は、これで入れ子の器を全部組み直す（15 対・共通の検査の入れ子の段で 1.76 GB・契約の検査の入れ子の段で中央 1.44 GB）。ただし 15 対のうち 14 対は行 v-buildrs の前の木で、HEAD の替わりも入れ子の合図だった。v-buildrs の後の木では、自分の差の file の書き直しだけが合図に当たる（code から）。v-buildrs の後の木を持つ対は便（t3-hub.74.62）の 1 対だけで、その増え 5.58 GB は、main の差が boundary か core に触れるほかの 12 対（4.15〜6.30 GB）と同じ幅に在る（記録から）。② だけで入れ子が組み直る事の記録の支えは、この 1 対である。
  判断の記録 ADR-35 は、並びの木を使い回す前提に「cargo は file の更新の時刻で新しさを見る・git の取り出しは中身の替わる file だけを書く」を置いた。取り出し（checkout）はそのとおりだが、載せ替えは中身の替わらない便の自分の差の file も書く。組みの置き場（target）は 1 回目と同じ所で、追随は並びの効きを受けない（確かめた・code）。行（build-lanes）の着地の後の 3 対も、前の同じ型の対と同じ重さだった（記録から・3 対だけ）。
  器の組みの前の script（build.rs）の組み直しの合図は、行 v-buildrs の後、器の追跡の file を 1 本ずつ名指す（build/rerun.rs）。合図が file の列なので、file の時刻を戻せば入れ子は組み直らない。根の build.rs のうち 3 本は dir を合図にする（boundary の src/server/routes・surface の src/project と src/pages と style と vocab・folio の vendor/archify の 6 dir）。cargo は dir の合図では、dir 自身と下の項目の時刻の最大を見る（cargo の source から）。載せ替えは、書き直した file の親の dir の時刻を新しくする（確かめた）。
  cargo の中身の hash で新しさを決める旗（-Z checksum-freshness）は、今の 1.98.1 では夜ごとの版（nightly）だけに在り、安定の版では使えない（席が確かめた）。手元の git 2.43 には、木の外で commit を当て直す命令（git replay）が無い（確かめた）。
  判断の記録 ADR-37 の決定 (1) は、形 B（凍った写しでの撃ち比べ）を器の便の流れ（runner・審査・gate・追随・着地）か組みを替える大きな行の前後に、形 G（検査だけの再演）を組み立ての形だけを替える行の前後に当てる。決定 (9) は、器の便の流れを替える行に入れ替えの前の形 B を課し、組みを使い回す行（ADR-35）は決定 (6) で撃ち、組み直しの合図を絞る行（v-buildrs）には前後の形 G を課した。形 B の道具は、仕事と回ごとに受付の元の repo（anchor）を分けるので、main は便の自分の着地でしか動かず、追随が起きない（記録から）。形 B の 1 周の書きは、本番の便の書きの中央 9.55 GB から 約 200〜240 GB の見込みで、決定 (2) の上限 120 GB に収まらない。2026-10-05 の形 B の 1 周目も、上限の見込みで止めた（記録から）。
  一般の多人数の開発の現場でも同じ弱点は起きる（持ち主の問い返し t3-hub.77.23 に答えて、出し直しの問い t3-hub.77.24 の本文に書いた）。人の手元の機械では載せ替えのたびの組み直しを時間の損として受け入れ、機械が人ごとに分かれるので記憶の装置（SSD）の摩耗は問題にされない。毎回まっさらに取り出す CI では全部の file の時刻が新しくなるので、定番の組みの溜め（rust-cache）は自分の repo の crate を溜めず、時刻を最後の commit の時刻へ戻す道具（git-restore-mtime）を足す現場もある（この記録の決定と同じ型）。大きな会社は中身の指紋で組みを溜める仕組み（Bazel・Buck2・sccache）で時刻に頼らない。main の先へ載せて検査し直す事は merge queue でも行う。tsuzuri が違うのは、1 台の SSD に AI の作業が集まり、載せ替えと検査の回数が人のチームより多く、1 回に数 GB 書く事で、人のチームでは時間の損で済む物が SSD の寿命の問題になる。
decision: |
  (1) 約束。追随の載せ替えが通った周に、便の自分の差（記録した base から載せ替えの前の先端までの差）の path のうち、載せ替えの前と後で、作業木の file の byte の指紋（filter を通さない git hash-object の値）と木の上の型（mode）が同じで、木の上で普通の file である物は、file の更新の時刻を載せ替えの前の値（ナノ秒まで）へ戻す。中身の byte が同じ file では、追随は cargo から見えない。中身・型・path・時刻の組が載せ替えの前と同じになるので、rustc が書く、読んだ file の列（dep-info）と、build.rs が名指す組み直しの合図（rerun-if-changed）の file は、その file を載せ替えの前と同じ姿で見る。木の上の中身の指紋（blob）は、作業木の byte が属性の定め（.gitattributes）の改行（eol）の設定や filter で替わる周を見ないので、前の篩にだけ使う。
  (2) 控えと条件。控え（path・時刻・型・blob・作業木の byte の指紋）は、載せ替えの命令の直前に、木が clean な周だけ取る。差の path は改名を割って読み（改名は元の path の消しと先の path の足しに分ける）、木に無い path（消した file）は控えない。戻すのは、載せ替えの後も木が clean で、型と blob と作業木の byte の指紋が控えと同じで、葉が symlink でなく、途中の dir に symlink を挟まない path だけとする。中の印の commit の項（submodule）は控えない。時刻を書いた後に作業木の byte の指紋を 1 度照らし直し、違えばその file の時刻を今の時刻にする（照らしと書きの間にほかの process が file を書いた周を閉じる）。
  (3) 測れない周は戻さない側に倒す。控えか照らしで git や file の読みが 1 つでも落ちた周は、1 file も戻さない。1 file の時刻を書けない時は、その file を新しい時刻のまま残す（組み直す側）。戻しのどの失敗も、追随の結末（rc・記帳する出来事・detail の字）を替えない。
  (4) 戻さない物。main の差だけの file（控えに無い）・同じ file に両方の差が当たり中身が替わった file・型だけが替わった file・改名の先で中身が替わった file・dir の時刻。dir の時刻は、dir を合図にする根の build.rs の 3 本・6 dir でも戻さない（dir の時刻を戻すと、dir の中の file の消しを隠しうる）。戻さないので、便の自分の差がこの 6 dir の下に在ると、その crate の build.rs が余分に走って下流を組み直すが、これは組み直す側の振れで、偽の合格の向きでない。29 対の見込みへの響きは 0 GB である（減りの在る対は、この 6 dir の下に自分の差を持たない）。衝突の周は今のまま中止して前の先端へ戻し、時刻は戻さない。
  (5) 置き場と記録。控えと戻しは、着地の追随（land.rs の rebase_onto）と口の追随（pipe follow）が共有する載せ替えの 1 段（follow_step.rs の関数 rebase）の中に置く。載せ替えの後の rebase-empty と既着地の道は、段の結末と記帳の字を今のまま替えない（戻しが撃たれても結末に効かない）。戻した file の数・篩で外した数とその理由の種・測れずに倒した周を、便の dir の記録の file に追随ごとに 1 行書く（置き場は pipe/<run>/follow-mtime.jsonl）。この file を書けない時も追随の結末を替えない。出来事の種別・段・detail の字・stdout の字・規則の行・子の環境変数は足さず替えない。器を使うほかの project の便にも同じく効き、名乗りの key は置かない（約束が中身の同じ file だけに限るので）。
  (6) 行。器の行を 1 本置く（名の案 v-follow-mtime・大きさ M の見込み）。書く file は、新しい部品の file の置き場（scribe2/crates/scribe2/src/pipe/follow_mtime.rs）に控えと戻しと記録の 1 行と歯・scribe2/crates/scribe2/src/pipe/follow_step.rs（関数 rebase の中の呼び）・scribe2/crates/scribe2/src/pipe/land.rs（関数 rebase の呼びに記録の file の置き場を渡す分）・scribe2/crates/scribe2/src/pipe/mod.rs（mod の 1 行）・scribe2/docs/design/pipeline.md（節を 1 つ足す）とする。歯は fixture の repo で載せ替えを撃ち、次の周を押さえる。自分の差だけの file は戻る。main の差だけの file は戻らない。同じ file に両方の差が当たる周は戻らない。改名は、中身が同じなら先の path が戻り、main が元の file を直した周は戻らない。中身が戻る差（main が同じ字の直しを先に持ち、載せ替えで一度 main の字を経て同じ中身に戻る file）は戻る。main が .gitattributes で改行（eol）の設定を替え、blob が同じで作業木の byte が替わる file は戻らない。戻した数と外した数が便の dir の記録の file に 1 行で残る。ほかに、型だけが替わる file・symlink・木が clean でない周を戻さない歯を足す。衝突の周の今の歯は替えない。行は判断の記録 ADR-33 の決定 (12) の、器を書く便の 1 本の列に入る。
  (7) 形 B の読み。判断の記録 ADR-37 の決定 (1) は追随と組みを替える行に形 B を当てるが、形 B の写しは仕事と回ごとに受付の元の repo（anchor）を分け、main が動かず追随が起きないので、この行の効きも壊れ方も形 B に出ない。この行は追随の結果の木と判じ（衝突・rebase-empty・既着地・出来事・gate と審査）を替えず、組みの合図だけを替えるので、決定 (9) の組み直しの合図を絞る行（v-buildrs）の項に倣い前後の形 G を当てる。ADR-35 の項（決定 (9) の「組みを使い回す行は決定 (6) で撃つ」）は、使い回しを名乗る前の基の取りで、この行には当たらない。入れ替えの前に形 G を 1 周撃つ。過去の追随の対から器の便 1 対と根の便 1 対を選ぶ。器の便の対は、木が行 v-buildrs の build.rs を持つ対（今の記録では便（t3-hub.74.62）だけ・後に着いた対が在ればそれも可）から選ぶ。それより前の木では HEAD の替わりも入れ子の合図なので、試す版でも入れ子が組み直り、偽の不合格になる。対ごとに、版ごとに同じ温かい組み（載せ替えの前の木を冷えた所から組み、1 回目の検査まで撃った物）から今の版と試す版の追随と 2 回目の検査を撃ち、検査の結末（rc）が全部同じで、器の便の対の増えが、選んだ対の式の見込みの減り（74.62 なら 2.85 GB）の半分以上減る事を確かめてから入れ替える。決定 (5) の記録の file の数も併せて記帳する。入れ替えの後は形 A（本番の数え）で 7 日を測る（撤退の欄）。
  (8) 効く時。器の行の着地の後、PATH の器の binary を入れ替えた時から効く。
options:
  - id: a
    name: 甲 — 今のまま
    text: 何も替えない。
    verdict: rejected
    reason: 追随の撃ち直しの増え（日に 34〜76 GB）のうち、中身の同じ file の書き直しが起こす分（見込みで日に 15〜32 GB）を払い続ける。
  - id: b
    name: 乙 — 載せ替えで中身の同じ file の時刻を戻し、形 G と形 A で測る
    text: 決定 (1) から (8)。
    verdict: adopted
    reason: 29 対に当てた見込みで、増えの 43%（1 回あたり平均 1.62 GB・29 対で 47.1 GB）が消え、日に 15〜32 GB 減る。減りは器の便に寄り、器の便 15 対の増えは平均 5.17 GB から 約 2.16 GB（−58%）、根の便 14 対は平均 2.36 GB から 約 2.23 GB（−6%）の見込みである。中身（作業木の byte）・型・path・時刻の組を載せ替えの前と同じに戻すだけなので、cargo の追う合図の上では、組みの成果が中身の違う file から来る形を作らない。変える所は共有の載せ替えの 1 段だけで、測れない周は今の振る舞いに倒れる。
  - id: c
    name: 丙 — 乙に入れ替えの前の形 B を足す
    text: 決定 (1) から (6) と (8) に、判断の記録 ADR-37 の決定 (1) と (9) の字どおり、入れ替えの前の形 B を足す。
    verdict: rejected
    reason: 形 B の道具は仕事と回ごとに受付の元の repo（anchor）を分けるので、main は便の自分の着地でしか動かず追随が起きず、この行の効きと壊れ方を見る材料が出ない。1 周の書きは、本番の便の書きの中央 9.55 GB から 約 200〜240 GB の見込みで、上限 120 GB の内では撃ち切れない（2026-10-05 の形 B の 1 周目は上限の見込みで止めた）。週に 1 周で口座の窓を待つので、置くのが遅れる間も日に 15〜32 GB を払い続ける。形 G は同じ木で追随を撃ち直せ、検査の結末の一致（偽の合格の見張り）と書きを直に比べられる。
  - id: d
    name: 丁 — 並びの組みを差分の溜め（incremental）無しにする
    text: 根の組みの設定の差分の溜め（incremental）を切るか、器が子の cargo の環境で切る。
    verdict: rejected
    reason: 見込みは乙の後の残り（1 回あたり 2.19 GB）に、組みの置き場の差分の溜め（incremental）の割合（未測）を掛けた物で、日に 10〜22 GB は見立てにとどまる。実装役の組みが遅くなる（未測）。切り替えると並び 4 本で 1 本 3〜5 GB の組み直しが出る。撃つ前に試しの写しで有り無しを測る事が要る。乙と別の効きなので、乙の 7 日の後に残りを見て改めて問う。
  - id: e
    name: 戊 — 追随を着地した前の便の並びへ移す
    text: 追随の時に、main の先端に近い組みを持つ並び（着地した前の便の並び）へ便を移して組む。
    verdict: rejected
    reason: 乙の後で 29 対のうち 2 対・和 3.8 GB しか減らず、日に 1〜3 GB である。根の要の crate に触れる便はどの並びでも組み直し、器の便は入れ子を足す。
  - id: f
    name: 己 — cargo に中身の hash で新しさを見させる
    text: cargo の旗（-Z checksum-freshness）で、file の時刻でなく中身の hash で新しさを決める。
    verdict: rejected
    reason: 今の 1.98.1 では夜ごとの版（nightly）だけの旗で、安定の版の組みでは使えない。安定の版に入った時に、乙を外す行と共に改めて考える。
  - id: g
    name: 庚 — 木の外で載せ替え、木は reset --keep で動かす
    text: 載せ替えを便の木の外（一時の木か、木を使わない当て直し）で撃ち、便の木は前の先端から新しい先端への git reset --keep で動かす。取り出しと同じく中身の替わる file だけを書くので、時刻を戻さずに済む。
    verdict: rejected
    reason: 手元の git 2.43 には木を使わない当て直しの命令（git replay）が無い。一時の木で撃つと追随ごとに木 1 本を取り出す書きが足され、衝突の後始末の場所が便の木から一時の木へ移る。木を使わない当て直しを器に書くと、git の載せ替えの振る舞い（改名の読み・既に main に在る commit の落とし）を器が持ち直すことになり、rebase-empty と既着地の道を今のまま保つ約束が重くなる。乙は今の載せ替えの後に 1 段を足すだけで済む。
basis: [ADR-35, ADR-37, ADR-49, ADR-33, R-40]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、memo（t3-hub.77・SSD の負荷）か後継の memo の notes に記帳する。問う相手は持ち主。数えは判断の記録 ADR-49 の便の書きの数え（段ごとと和）と、便の作業の dir の検証の記録（verify.jsonl）の追随の前後の gate の対で、係（w215a）の調べと同じ式（増え = 2 回目の全段の書き − 1 回目の全段の書き）とする。器の便は、共通の検査の入れ子の段を撃ち、main の差が scribe2/ に触れない対とする。対ごとに、決定 (5) の記録の file（戻した数・外した数とその理由の種・倒した周）を併せて記帳する。
    (1) 偽の合格。入れ替えの後、追随の後の再 gate が合格した便で、着地の確かめ・列の候補の木・main の CI のどれかが赤になったら、席はその便の再 gate の木（同じ commit）を、冷えた組みの所で同じ検査で 2 度撃ち直す。同じ歯が 2 度とも落ち、その歯が再 gate の温かい組みでは通っていた事が 1 度でも在れば、それを偽の合格と数え、器の binary を前の版へ戻し、この行を外す行を置いて原因を問う。撃ち直しが通るか、落ちる歯が 2 度で違う時は偽の合格に数えず、赤の原因を別に記帳する。
    (2) 効き。入れ替えから 7 日で、器の便の対の契約の検査の入れ子の段の増え（2 回目 − 1 回目）の中央が 0.3 GB を越えていれば問い直す（前の器の便 15 対は全部 0.60 GB 以上で、戻しが効けば 約 0 になる見込み）。この数は main の差の混ざり方によらない。器の便の対が 7 日で 5 に満たなければ窓を 14 日に延ばし、それでも 5 に満たなければ数えだけを記帳する。
    (3) 報告（撤退でない）。器の便の対の増えの平均を、線 3.67 GB（前の器の便 15 対の平均 5.17 GB から、見込みの減り 58% の半分（29%）を引いた値）と並べて記帳する。main の差が surface だけの対は戻しが全く効かなくても 約 3.0 GB で線を下回り、根の組みが重くなる行が窓に入ると効いても線を越えうるので、この平均では判じない。同じ 7 日の全部の対の増えの平均と中央を、前の 29 対の平均 3.81 GB・中央 3.06 GB と並べ、器の便と根の便に分けて記帳する。乙の後の見込みは、器の便 約 2.16 GB・根の便 約 2.23 GB で、どちらも 約 2.2 GB なので、全部の対の平均の見込みも便の混ざり方によらず 約 2.2 GB である。追随の撃ち直しの日ごとの書きも、前の日に 34〜76 GB と並べる。
    (4) 置き換え。cargo の安定版に中身の指紋で新しさを決める仕組み（今の -Z checksum-freshness・build の fingerprint の設定）が入り、tsuzuri の道具の版がそれを使えるようになったら、その仕組みに置き換え、この行の時刻の戻しを外す行を置く（席が版の上げの時に照らす）。
plain: |
  作業の途中で本線（main）が進むと、器は作業の場所を本線の先へ載せ替えて検査をやり直します。今の載せ替えは、作業で直した file を中身が同じでも書き直すので、組み立ての道具（cargo）が「直された」と見て、器の部品を全部組み直します。
  これからは、載せ替えの後に中身が前と同じ file だけ、更新の時刻を前の値へ戻します。道具からは何も起きていないように見え、本線から入った変更の分だけを組み直します。見込みでは、やり直しの書き込みが 1 日 15〜32 ギガ（GB）減ります。
  中身（作業木の byte）が少しでも違う file は戻さず、確かめられない時も戻しません。古い部品で検査を通す道は、cargo が追わない入力を本線が替えた時などに理屈の上で残るので、入れる前に同じ材料で今の版と比べ、入れた後も 7 日測り、1 度でも出たら元に戻します。
approval:
  who: 持ち主
  date: 2026-10-05
  ruling: t3-hub.77.24（裁定 id = t3-hub.77.24:20261005T0955Z-1・1（推奨のとおり置き、形 B は撃たず形 G と 7 日で測る）・配達の口・notes に逐語）・前の問い t3-hub.77.23（裁定 id = t3-hub.77.23:20261005T0947Z-1・問い返し・一般の現場の扱いを足して t3-hub.77.24 で出し直した）
  verbatim: "推奨で進めて良い"
  surface: R-8
consequences:
  - 器の便の追随の後の組みでは、器の binary に焼く build 元の commit（BUILD_COMMIT）が載せ替えの前の先端の値のまま残る。値は最後に合図が走った時の先端のまま残る形を、行（v-buildrs）が既に受けている。
  - 根の build.rs のうち 3 本（boundary の src/server/routes・surface の src/project と src/pages と style と vocab・folio の vendor/archify）は dir を合図にする。cargo は dir の合図では下の項目と dir 自身の時刻の最大を見る（cargo の source から）。載せ替えは書き直した file の親の dir の時刻を新しくする（確かめた）。なので便の自分の差がこの 6 つの dir の下に在ると、時刻を戻しても build script が走り、その crate から下を組み直す。29 対では減りの在る対がこの dir に触れておらず、見込みは替わらない。これから先、この 6 dir の下を直す根の便では減りが 0 になる。後で根の便の減りを取りに行く時は、項目の名の列（readdir）が前後で同じ dir に限って時刻を戻せば、dir の中の消しを隠さない。
  - 載せ替えは今どおり file を書き、file の変わりの時刻（ctime）は新しくなり、番号（inode）は替わる事も替わらない事もある（確かめた）。cargo はこれを見ない。これで新しさを見る道具は今どおり組み直す側に倒れる。
  - 古い部品で検査を通す道は、理屈の上で 2 つ残る。main が替えた、cargo の追わない入力（rerun-if-changed の無い build script の読み・追わない proc-macro の file の読みなど）は、今は自分の差の file の書き直しが自分の crate を組み直させ、偶然に隠している。tracked な 2 つの file の時刻の前後で新しさを見る道具（make の形）は、戻した file と main の差の file の前後を、載せ替えの前とも後とも違う並びで見る。tsuzuri の xtask・scribe2・crates にはどちらも見当たらない（grep で）。形 G と撤退 (1) で見張る。
  - 控えの path は base から前の先端までの正味の差なので、便の commit の中で直して戻した file（正味 0）を載せ替えが書き直しても戻らない。衝突で中止した周（pipe follow の rebase --abort）も前の先端の byte に戻るので同じ照らしで戻せるが、この行では戻さない。どちらも減りの取りこぼしで、安全な側である。
  - 器の行 1 本が、器を書く便の 1 本の列（判断の記録 ADR-33 の決定 (12)）を 1 回使う。
  - 形 G の 1 周は token 0 で、器 1 対・根 1 対の 2 対を、版ごとに同じ温かい組み（冷えた所からの組み 約 5.4 GB と 1 回目の検査）から撃つので、記憶の装置（SSD）の書きは 約 45 GB の見込み（上限 60 GB の内・見立て）である。減りが 0 の見込みの対照の 1 対を足すと 約 60〜70 GB で上限を越えうるので、この周では撃たない。周の途中で上限に届く見込みになれば、判断の記録 ADR-37 の決定 (2) のとおり止めて記帳する。
  - 減りの見込みは、組み直しの集合ごとの 2 回目の検査の書きの型（群の中央）から出した見立てで、乙を撃って測った値ではない。器の便の見込みは行（v-buildrs）の後の木で ② だけが入れ子の合図に当たる事を前提にし、その記録の支えは便（t3-hub.74.62）の 1 対だけである。日に 15〜32 GB は、撃ち直しのうち器の便の割合が標本と同じ 52%（15/29）である事を前提にし、減りの 96% は器の便から来る（器の便の撃ち直し 1 回で 約 3 GB）。形 G と 7 日の数えで確かめる。
  - 丁（差分の溜めを切る案）は乙の 7 日の後の残りを見て問う。cargo の中身の hash の旗が安定の版に入れば、この行を外す行を考える。
note: 起草は係（w219a）で、2026-10-05 に書いた。検証役（qv189）の攻めの直しを係（w223a）が同じ日に入れた。数は係（w215a）の調べの記録（pairs.json・closure.json）と式（est.py）から写し、器の便と根の便への分けは同じ式を群ごとに足した。小数は 2 桁か 1 桁に丸めた。承認の欄の逐語と経路と日付は、適用の script が台帳の問いの notes の定型行と裁定 id の時刻から入れる。
