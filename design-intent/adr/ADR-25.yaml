# 判断の記録 ADR-25 — 規則の行 R-4 の数える範囲（本体の置き場 src だけ）（発効 2026-09-30・持ち主の裁定 t3-hub.67.47:20260930T0626Z-1・記帳先 = tsuzuri の台帳の問い t3-hub.67.47 の notes）
# 反対側からの検証（A-2.3）は検証役 qv43。前例は判断の記録 ADR-19（同じ数える対象の欄に行の幅の数え方を足した・裁定 t3-hub.67.19）。
id: ADR-25
title: 規則の行 R-4 の大きさの上限は、workspace の部品の本体の置き場（src）の下だけを数える
status: accepted
date: 2026-09-30
context: |
  規則の行 R-4 は大きさの上限（core の総行数 20,000・1 module 1,500 行・歯と source の行数比 1.0・関数の粒度）を持つ。値は器（scribe2）の行（R-C4-1〜R-C4-4）の写しで、数える対象の欄（population）は core の crate と行の幅の数え方（判断の記録 ADR-19）だけを書き、1 module と比に検査の code のどこまでを入れるかを書いていなかった。
  検査の code は 2 か所に在る。本体の file の中（行頭 #[cfg(test)] から後の区間）と、src の外の置き場 tests/ である。数（main 09d898f6・幅 120 字の数え方・検証役 qv43 が出し直した）は、tsuzuri の 5 つの部品で本体 47,328 行・file の中の検査 1,564・tests/ 106,460（tests/ で 1,500 行を越える file 1 本）、持ち込んだ folio（今は除外の表で数えない）で本体 29,242・file の中の検査 5,048・tests/ 41,424（越え 1 本）、これから持ち込む scribe2 で本体 73,592・file の中の検査 34,623・tests/ 65,906（越え 16 本・最大 3,685 行）。本体の file はどれも 1,500 行の内。
  手本の器は、部品ごとの本体の置き場（crates/*/src）の source の file（.rs）だけを数え、file の中の行頭 #[cfg(test)] から後を検査、その前を本体とし（名が tests.rs か _tests.rs で終わる file は丸ごと検査）、比は全部を合わせた 1 つで比べ、src の外の tests/ は数えない。器の便の受付（走らせる前の余地の検査）も crates/<部品>/src/ だけを測る。器の設計の文書も、この形を今の形とし、母集団を広げるかを裁定の材料として残している。
  数える段（xtask の check で行数を測り、越えたら落とす）を置く前に範囲を字にする要があり、範囲の決め方で今の code と持ち込みの後の code が上限の内か外かが変わる。席は持ち主に 3 つの案（A 本体の置き場だけ・B tests/ も両方・C 1 file の上限だけ tests/ にも）を問うた（t3-hub.67.47）。持ち主は案 A を選び、後段として、scribe2 と folio2 の完全な統合の後に歯が無駄に大きくなっていないかを整理し、今後肥大しない仕組みも考えると答えた（席が memo t3-hub.67.48 に控えた）。
decision: |
  (1) 規則の行 R-4 の大きさの上限のうち core の総行数・1 module の行数・歯と source の行数比は、workspace の部品の本体の置き場（src）の下の source の file（.rs）だけを数える。本体の置き場の外の検査の置き場（tests/）は数えない（案 A・t3-hub.67.47）。関数の粒度（関数の行・複雑度・引数）はこの決めの外で、lint で見る。
  (2) 歯と source の行数比は、数える部品の全部の検査の区間の和と本体の和を合わせた 1 つの比で比べる。部品ごとには比べない（部品ごとだと xtask が 1.19 で越える）。
  (3) 1 module の行数は、検査の区間も含めた file の全体で数える。core の総行数は本体だけを数える（器と同じ）。
  (4) 組み立ての手順の file（build.rs）は数えない。
  (5) 数えるのは workspace の部品で、除外の表（carry-exclusions.toml）が名指す持ち込みの code（今は folio2/crates/folio/）は、その表の行が消えるまで数えない。判断の記録 ADR-18 の決定 (5) の表の扱いを字にするだけで、表は変えない。
  (6) 検査の区間は、file の行頭の検査の印（#[cfg(test)]）の最初の行から末尾で、その前を本体とする。名が検査の名（tests.rs か _tests.rs）で終わる file は丸ごと検査の区間とする（器と同じ）。行の幅の数え方は判断の記録 ADR-19 の決定 (1) のまま。
  (7) 規則の行 R-4 の数える対象の欄に (1)〜(6) の字を足し、裁定の欄に t3-hub.67.47 の裁定 id を足し、裁いた時の欄（ruled_at）を今回の時（2026-09-30T06:26Z）にする。値（20,000・1,500・1.0・関数の粒度）と種類と段は変えない。案 A は値を変えず、測っていなかった範囲を字にするだけなので、緩めでも締めでもないと読む。それでも前例（判断の記録 ADR-19・t3-hub.67.19）に倣い、条 P-22.3 が名指す条 A-2 の手続き（A-2.3 の反対側からの検証と判断の記録）を通す。
  (8) 測る所は 2 つに分かれる。器の便の受付（走らせる前の余地の検査）は crates/<部品>/src/ だけを測り、repo の根の直下の xtask/ と入れ子の folio2/ は測らない。この 2 つは tsuzuri の xtask の check の数える段だけが測り、受付で測られない分の越えは便を走らせ終えた後の check で落ちる。
  (9) 後に起こす便: 数える段を置く行（k-size-base・ノート surface-wave24a）。除外の表の R-4 の行を消す行（k-size-folio）の着地で、数える段は folio も数える。scribe2 の持ち込みの後も同じ範囲で数える。
options:
  - id: a
    name: 本体の置き場（src）の下だけを数える（案 A）
    text: 決定 (1)〜(9)。検査の置き場（tests/）は数えず、比は全部を合わせた 1 つ、1 module は file の全体、組み立ての手順の file（build.rs）は数えず、除外の表の code は行が消えるまで数えない。
    verdict: adopted
    reason: 今のどの code も上限の内で、数える段をすぐ置け、持ち主の手間も直しの便も 0。器の今の形と同じで、器の受付の測りとも揃う。弱みは、tsuzuri の検査の code の 98.6% が数えの外になり比（0.033）が上限の 30 分の 1 でほぼ縛らないことと、tests/ の file の大きさを直接縛る決まりが無いこと（関数の粒度の lint が着地すれば関数ごとには縛る）。弱みは持ち主の後段（統合の後の整理と肥大させない仕組み）と撤退の条件で受ける。
  - id: b
    name: tests/ も 1 file の上限と比の両方に入れる（案 B）
    text: 本体の置き場（src）の下と検査の置き場（tests/）の下の source の file（.rs）を数え、1 module の上限と歯と source の行数比の両方に入れる。
    verdict: rejected
    reason: tsuzuri の比が 2.28 で越え（scribe2 1.37・folio 1.59）、上限の内に戻すには検査の code を約 60,700 行（tests/ の約 57%）削るか、比の上限を 2.29 以上に緩める別の決めが要る。実際には締めで、釣り合わない。
  - id: c
    name: 1 file の上限だけ検査の置き場（tests/）にも掛け、比は本体の置き場（src）の下だけで比べる（案 C）
    text: 検査の置き場（tests/）の下の source の file（.rs）にも 1 module の 1,500 行を掛け、比は本体の置き場（src）の下だけで比べる。
    verdict: rejected
    reason: 大きな検査の file を読みやすく保てるが、今の tsuzuri で割る便 1 本、folio を数える時に 1〜2 本、scribe2 の持ち込みで 16 本の割りが続く。器の受付は tests/ を測らないので、越えは便を走らせ終えた後の検査で落ちやり直しになる。
basis: [R-4, P-22, A-2, ADR-18, ADR-19]
grill:
  when: 2026-09-30
  who: 検証役 qv43（AI・Opus・起草者と別の独立の文脈・読み取りだけ）
  where: docs/grill/2026-09-30-O-r4-range-grill.md
  summary: 検証役 qv43 が問いの下書きを読むだけで攻め（commit・台帳・src の編集なし）、tsuzuri の main 09d898f6 と器の main 7416928c の数を器の式で出し直した。問いの数と手続きの読み（案 A は緩めでも締めでもない・前例 ADR-19 に倣う）は正しく、重い抜けは 1 つ（範囲の答えが器の code にも効くのに器の数が無い）で、席が問いの本文に器の数を足した。ほかに、器と同じ範囲という小さな言い過ぎ（器の受付は crates/<c>/src/ だけを測る）と、案 A に埋まった決め 4 つを字にすることを求め、どちらもこの記録の決定 (2)〜(5) と (8) に入れた。論点ごとの結果と反映した所は検証の記録に在る。
retreat:
  kind: measure
  condition: 次のどれかが起きたら、持ち主に問い直す。(a) scribe2 と folio2 の code の持ち込みと統合（合流の 3 段目・判断の記録 ADR-18）が終わった（持ち主の後段・memo t3-hub.67.48。問い直すのは、歯が無駄に大きくなっていないかの整理と、今後肥大させない仕組みと、この範囲の字）。(b) tests/ の伸びが見張りで見えた（見張りは memo t3-hub.67.48 の候補。置かれるまでは席が持ち込みの段ごとに数える。起草の値は、tsuzuri の部品の tests/ の行数が 2026-09-30 の 106,460 行の 1.5 倍を越えるか、tests/ で 1,500 行を越える file が 2026-09-30 の 1 本から増える。問い直すのは案 C か見張りの形）。数えるのは tsuzuri の設計の席で、行数は幅 120 字の数え方で誰でも数え直せる。
plain: |
  code の大きさの決まり（1 つの file は 1,500 行まで・検査の code は本体の code の行数まで）で、検査の code をどこまで数えるかを決めた記録です。
  あなたの答えのとおり、数えるのは各部品の本体の置き場（src）の下だけにしました。別の置き場（tests/）に在る検査の code は数えません。比は全部の部品を合わせて 1 つで比べ、1 つの file は中の検査の区間も含めて数え、組み立ての手順の file（build.rs）は数えず、持ち込んだ code は除外の表の行が消えるまで数えません。上限の値は変えていません。
  検査の code の大半が数えの外になるので、scribe2 と folio2 の統合が終わった後に、検査の code が無駄に大きくなっていないかを整理し、今後大きくしない仕組みを考えます（あなたの後段の答え）。それより前でも検査の code の伸びが見えたら、あなたに問い直します。
  この記録はあなたの承認で発効しています。承認の記帳先は tsuzuri の台帳の問いです。
approval:
  who: 持ち主
  date: 2026-09-30
  ruling: t3-hub.67.47（裁定 id = t3-hub.67.47:20260930T0626Z-1）・board の質問の頁・notes に逐語
  verbatim: これについてはとりあえずAで進めるが、将来的にテストが無駄に大きくなっていないかのリファクタリング作業をscribe2とfolio2の完全な統合ができてから行って整理する。その際に、今後testが肥大しない仕組みも同時に考えたい。
  surface: R-8
note: 逐語は問い t3-hub.67.47 の notes の字。後段（統合の後の整理と肥大させない仕組み）は memo t3-hub.67.48 に控えた。
