note: |
  器の元の file: scribe2/design-intent/decisions/ADR-0041-role-effective-account-is-one-host-record-and-moves-only-under-pressure.html
  器の表紙の頭: 設計判断記録 (ADR) scribe2 — 役割の実効の口座
  器の表紙: 状態accepted選択肢7件 (OPT1–OPT7)結果良い 4 / トレードオフ 4版v0.1.0 / 2026-09-17
  器の表紙: 正当化する要件: SRS-SCRIBE2-MVP の FR1038・FR1059・FR1036
  器の表紙: 想定読者: scribe2 の開発 session (planner / admin) と user — fleet と席の内部構造の専門知識は不要 (専門語はやさしい言葉を併記)
  器の承認の欄: 裁定 (user)・user・2026-09-17T05:50Z (逐語は台帳 s2-07l.418) と 2026-09-17T06:10Z (逐語は台帳 s2-07l.436)・裁定済
  器の承認の欄: 設計 (planner)・planner・2026-09-17 起票 (docs/design/seat-roles.md §17 / §18・契約表の行 k / l・台帳 s2-07l.436)・作成
  器の案の章の要約: 候補を 7 つ並べます。実効の口座を host の根の記録 1 件に持ち逼迫した周にだけ移る案、余裕が戻れば宣言へ戻る案、器が宣言 file 自体を書き換える案、除外だけ直して記録を持たない案、記録を各 project の event に持つ案、候補が無い周は断る案、host に常駐する監視 process を置く案です。
  器の専門語の説明: 本文に出てくる専門語を、やさしい言葉で説明します。
  ・実効の口座（effective role account）: その周に役割の席が実際に使う口座。 実効の記録の口座、 宣言の口座 (記録が無い周の種)、 役割単位で 1 回選び直した口座の順に 1 関数で解く。 席の起動・立て直し・管理 tick の比較・便用の除外が同じ解き方を読む。
  ・実効の記録（effective role record）: 役割の実効の口座を器が host の根に書く記録 (役割ごとに高々 1 件・role と口座 label と ts と妥協の理由)。 宣言の file とは別で、 書き換える周は前の記録を消さずに履歴の側へ移す。
  ・妥協の起動（compromise launch）: 閾値未満の候補が無い周に、 閾値以上でも当たっていない口座、 それも無ければ他の役割と同居の口座で席を立てること。 理由 (over-threshold / shared-with-role) が記録と席の指示文に出て、 席は作業を止めて user の裁定を待つ。
  ・逼迫度（pressure）: 口座の数える窓のうち最大の使用率。 session 用の選定は逼迫度が最小 (余裕が最大) の口座を選び、 窓の全量に達した口座は「当たっている」として候補にしない。
  ・host の根（host root）: state dir の親の下の host 用 dir (<親>/<NAME>-host/)。 受付の枠 (ADR-1021)・役割の口座の宣言 (ADR-1036)・実効の記録がここに在り、 env を読まずに state dir から導く。
  器の頁の末: このページは、大もとの機械データ (正本) から自動で組み立てられています。構造は機械が自動で検査し、内容が元データに忠実かは独立のレビューで確かめます。
