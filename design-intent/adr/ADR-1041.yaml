# 判断の記録 ADR-1041 — 器 scribe2 の判断の記録 ADR-0041 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1041
title: "役割の実効の口座は host の根の記録 1 件が持ち、 逼迫した周にだけ余裕が最大の口座へ役割ごと移る (宣言は初期値の種で宣言へは戻らない・候補が無い周も妥協の口座で席を立てて user の裁定を待つ・consult は planner の口座を読む・ADR-1036 の DR3 を supersede)"
status: accepted
date: 2026-09-17
context: |
  役割の席が実際に使う口座を、 host の根の実効の記録 (役割ごとに高々 1 件・器が書く) が持つ。 記録の口座が使える間は居続け、 宣言の口座に余裕が戻っても戻らない。 記録が無い周は宣言を種にし、 記録の口座が逼迫した周にだけ役割単位で 1 回、 余裕が最大の口座を選び直す。 閾値未満の候補が無い周も断らず、 妥協の口座で席を立てて理由を記録と席の指示文に出す。
  なぜこの判断が要るのかを、現物と user の裁定から説明します。いまは宣言の口座が使えない周に、席が 1 つずつ別々に移り先を選びます。その結果、同じ役割の席が別々の口座へ散り、候補が尽きて席が立たないことが実際に起きました。user は、同じ役割の席は揃って移り、移った先に居続け、候補が無くても席は立てると裁定しました。
  CTX1 現物 — 使えない周の選定は席ごとで、 除外は「自席以外の全登録 row の口座」
  ADR-1036 と seat-roles.md §15 (2) は、 宣言の口座が使えない周に席ごとに session 用の選定（席を起こす口座を残量から選ぶ規則）へ落ちる。 その選定 (crates/scribe2/src/seat/cycle/relaunch.rs の choose) は除外集合を「自席 (同じ役割と anchor) 以外の全登録 row の口座」で作る。 同じ役割の他 project の席も除外に入るので、 先に移った席の口座が後続の席の候補から外れる。
  CTX2 実測 — 同じ役割の席が別々の口座へ散り、 候補が尽きて席が立たない
  (a) 同じ役割の他 project の席が先に移った口座は後続の席の候補から外れるので、 同じ役割の席が別々の口座へ散る = ADR-1036 の「役割の口座を host で揃える」が逼迫時に崩れる。 (b) 席の数が口座の数に近づくと候補が尽き、 選定が no-account を返して席が立たない (実測 2026-09-17・planner の席の立て直しが連続で断られた・口座名は台帳が原本で本 file には写さない・CON1002)。 席が立たない間は対話面が無く、 user は進め方を裁定することもできない。
  CTX3 user の裁定 — 役割ごと揃って移る・移った先に居続ける・候補が無くても席は立てる
  裁定 id = user 2026-09-17T05:50Z (逐語は台帳 s2-07l.418) と user 2026-09-17T06:10Z (逐語は台帳 s2-07l.436)。 逐語は台帳が原本で本 file には写さない (CON1002)。 要旨: (1) 役割の口座は project をまたいで共有し、 上限が来たら同じ役割の席は同時に同じ別の口座へ移る。 (2) 移った先には、 そこが逼迫するまで居続ける (宣言の口座に余裕が戻っても戻らない)。 移る先は余裕が最大の口座。 (3) 閾値未満の候補が無い周も席は必ず立て、 妥協で立った席は作業を止めて user の裁定を待つ。 全口座が上限に当たっている周だけは従来どおり断る。 (4) 走行中の便は止めない。 (5) consult の席は planner の口座を使う。 狙い = 便が使える口座が増える・席の管理と予算の見通しが単純になる・行き来の cycle を減らす。
  CTX4 host の根（同じ host の全 project が共有する置き場）と、 宣言値と実効値を型で分ける向き
  state dir は project ごとに分かれうる (ADR-1036 CTX2 の実測) ので、 実効の口座を state dir の中に置くと別の state dir の project に届かない。 host の根 (<state_dir の親>/<NAME>-host/) は ADR-1036 の宣言 file と受付札が既に使う project 横断の置き場で、 env を読まずに state dir から導く。 宣言 file は人が書く宣言値で、 器が実測から決めた口座は実効値の側である (憲法 C10 は両者を型で分ける)。 憲法の向き = C10・C2 (選定と除外は 1 関数・順序は宣言順)・C2.2 (env を読まない)・C9 (席が止まったら人手なしで再開する)・C9.2 (口座を窓の終わりまで使い切る)・N1 / N1.2 (消さない・退役は可逆な move)。
  CTX5 現物 — 席用と便用は選ぶ順序が別で、 選定の純関数は閾値を入力で受ける
  選定の純関数 (crates/scribe2/src/fleet/select.rs) は用途で順序が分かれる: session 用は逼迫度（数える窓のうち最大の使用率）が最小 (= 余裕が最大) の口座、 便用は reset が最も早い口座から使い切る (ADR-1027)。 当たっている口座 (窓の全量) と測れない口座はどちらの用途でも候補にならず、 session 用だけが閾値 (R-C9-1) 以上の口座も外す。 閾値は入力の 1 項目なので、 閾値に窓の全量を渡せば「当たっていない中で余裕が最大」を同じ関数が返す。
  （選択肢を測るものさし）判断を評価する 5 本のものさしです。同じ役割の席が同じ口座に揃うこと、移るのは逼迫した周だけで行き来しないこと、席は必ず立って妥協は隠さず user に渡すこと、人が書いた宣言と器が決めた口座を分けること、既存の経路と純関数を変えないことです。
  DR1｜同じ役割の席は、 project をまたいで常に同じ口座に揃う (実効の口座は役割単位で 1 つ・同じ役割の席どうしで候補を削り合わない) user 裁定 2026-09-17T05:50Z (台帳 s2-07l.418) / ADR-1036 DR1
  DR2｜移るのは実効の口座が逼迫した周だけ。 移った先に居続け、 宣言へは戻らない (行き来の cycle を作らない)。 移る先は余裕が最大の口座 user 裁定 2026-09-17T06:10Z (台帳 s2-07l.436) / SRS FR1038 / FR1036 の session 用の順序
  DR3｜席は必ず立つ (全口座が当たっている周を除く)。 妥協で立った事実は隠さず、 理由を閉じた語で記録と席の指示文に出し、 進め方は user が裁定する user 裁定 2026-09-17T06:10Z / 憲法 C9 / C7 / C3.3
  DR4｜人が書いた宣言 (宣言値) と器が決めた口座 (実効値) を file と型で分け、 記録は消さない 憲法 C10 / N1 / N1.2
  DR5｜席を動かす経路は既存の tick の軸と立て直しのまま。 選定の純関数とその入力の型を変えず、 常駐 process を持たず、 走行中の便を止めない 憲法 C2 / ADR-1034 (契機は tick) / ADR-1036 DR4 / ADR-1027
decision: |
  選んだ案と、それが要件書のどの要件を支えるかを示します。役割の実効の口座は、実効の記録、宣言の種、役割単位の 1 回の選び直しの順に 1 関数で解きます。候補が無い周は 2 段の妥協で席を立て、理由を記録と席の指示文に出します。
  採用 — OPT1
  器 SHALL 役割の実効の口座（その周に役割の席が実際に使う口座）を 1 関数で解き、 その順は (1) host の根の実効の記録 (役割ごとに高々 1 件) が在りその口座が使える (ADR-1036 の意味 = 宣言済み・退役でない・最新の実測が在り・session 用の閾値未満) 周はそれ (宣言の口座に余裕が戻っても記録の口座に居続ける)、 (2) 記録が無い周は宣言 (roles.toml) の口座が使えればそれを記録に書いて使う (宣言 = 初期値の種)、 (3) どちらも使えない周だけ役割単位で 1 回選び直して記録を書き換える、 とする。 器 SHALL 実効の記録を host の根 (<state_dir の親>/<NAME>-host/・宣言 file と受付札と同じ導き方・env を読まない) の下の dir 1 つに役割ごとの file 1 つで持ち (schema = 1・項目 = role・口座 label・ts・妥協の理由・宣言 file と同じ TOML subset の reader と同じ拒否形)、 宣言 file とは file も型も分け (宣言 = 人が書く宣言値・記録 = 器が書く実効値・C10)、 記録が在るのに読めない周は typed に止める (FailClosed)。 記録の書きは席を起こす口 (seat launch と立て直し) だけが行い、 lock の下で読み直し → 在って使えればそれを読むだけ → でなければ決めて一時 file → rename (先に書いた席が勝ち、 後続の席は読むだけ = 同じ役割の席は同じ口座へ揃う)、 前の記録は上書きせず履歴の側へ rename してから書く (N1 / N1.2)。 (3) の選び方 SHALL session 用の既存の順序 (逼迫度が最小 = 余裕が最大) であり、 便用の順序 (reset の早い順に使い切る・ADR-1027) とは用途の分岐で分かれたままとする。 (3) の除外 SHALL 他の役割の実効の口座 (記録が無い役割は宣言の口座) と他の役割の登録 row の口座だけであり、 同じ役割の席の口座は除外しない。 選定の純関数とその入力の型は変えない。 (3) で閾値未満の候補が無い周 SHALL NOT 断る: (i) 同じ除外のまま当たっていない口座の中で逼迫度が最小の口座、 (ii) それも無ければ他の役割の口座との同居も候補に入れて逼迫度が最小の口座、 の順で席を立て、 その周は妥協の理由を閉じた 2 値 (over-threshold / shared-with-role) で実効の記録と launch / relaunch の記録の行に載せ、 SessionStart の席の指示文 (雛形の穴 1 つ) に「妥協の口座で立った = 作業を止めて対話面で user の裁定を待つ」の行を出す。 妥協の理由を持つ記録は (1) の「居続ける」に当たらず、 席を起こす周ごとに (3) を解き直す。 当たっていない測れた口座が 1 つも無い周だけは従来どおり断る。 妥協でない周の他の役割との同居は不可のままとする。 管理 tick SHALL ADR-1036 の軸 1 本のまま比較の相手を宣言の口座から実効の口座に替え、 記録を読むだけで書かず、 口座の逼迫の軸は閾値つきの選定 (同じ除外) が候補を返す周にだけ退避の合図を注入し (走っている席を妥協の口座へ動かす cycle を作らない = 妥協の起動は席が止まっている周にだけ起こる)、 候補を返さない周は退避の合図の代わりに妥協の通知 (作業を止めて対話面で user の裁定を求める) を 1 回だけ注入する (既に立っている席にも同じ裁定を効かせる・同じ席・同じ口座・同じ窓の間は繰り返さず、 1 回の弁別は注入の記録で行い、 繰り返さない周は閉じた理由 1 つの noop)。 器 SHALL NOT 常駐 process を持つ (ADR-1034)。 便用の選定の除外 SHALL 便の repo の登録 row の口座 ∪ 全役割の宣言の口座 ∪ 全役割の実効の口座であり、 次の選定から効く (走行中の便は止めず、 移った先の口座で走っている便はそのまま走り切る)。 consult の席 SHALL planner の実効の口座を読む (consult 用の宣言の行も記録も持たず、 役割 → 口座の解決の 1 関数の中で consult を planner に写す)。 宣言の書き換えの口 (account reassign) SHALL 宣言を書き換えた周にその役割の実効の記録を履歴の側へ move する (人の 1 手で全席が移る ADR-1036 の口を保つ = 次に席を起こす周が新しい宣言を種にする)。 doctor SHALL 役割の口座の 1 行に役割ごとの実効の口座と妥協の理由を足す (読むだけ・判定しない)。 実効の記録の書きと退役 SHALL NOT A1 の承認を要する (宣言の書き換えと同じ扱い・ADR-1036 の読み)。 妥協の周に席が作業を続けるかは user の裁定による。 本 ADR は ADR-1036 の DR3 の全部 (使えない周は席ごとに選定に落ちる・余裕が戻れば宣言へ戻る) と、 決定の句「宣言が在り口座が使える周はその口座で起こし、 使えない周だけ選定に落ちる」、 その選定の除外 (自席以外の全登録 row の口座)、 管理 tick の比較の相手、 便用の除外を supersede し、 宣言 file の形と置き場・--account の食い違いの断りの型・理由の閉じた 3 値・選定の純関数・R-C9-1・登録 row の鍵は変えない。
  （平易）役割の席が使う口座は、host に 1 か所だけ在る記録が決めます。記録の口座が使える間はそこに居続け、宣言の口座は記録がまだ無いときの最初の種にだけ使います。記録の口座が逼迫したら、最初に気づいた席が役割を代表して余裕が最大の口座を選び、記録を書き換えます。前の記録は消さずに履歴へ移します。候補から外すのは他の役割の口座だけです。使える口座が無いときも、まず閾値を超えていても上限には当たっていない口座、それも無ければ他の役割と同居する口座で席を立て、その理由を記録と席の指示文に出して user の裁定を待たせます。便は全役割の口座を次の選定から外し、走っている便は止めません。consult の席は planner の口座を使います。
  （理由）user は、同じ役割の席が揃って移り、移った先に居続け、候補が無くても席は立てると裁定しました。席ごとに選ぶと口座が分かれて互いを候補から外し合うので、決めるのを役割につき 1 回にして全 project から読める host の根に置きます。宣言へ戻る形は窓が開くたびに全席の起こし直しを生むので採りません。席が立たないと対話の窓口が消え、user が進め方を決められないので、妥協してでも席を立て、妥協の事実を隠さず席に知らせます。どこまで口座を使うかは user の判断だからです。人が書いた宣言は器が上書きせず、選定の純関数も変えません。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1038（claim）: 立て直しの口座は実効の口座 (記録 → 宣言の種 → 役割単位で 1 回の選び直し → 妥協の 2 段) で決まり、 候補が無い周も席が立つ。 FR1038 の句の改訂は ADR-1036 と同じ user の /folio-architect の周。
  FR1059（claim）: 席の起動の口座の決め方も同じ 1 関数を通る。 --account の食い違いは実効の口座と比べる。
  FR1036（claim）: session 用の選定の除外が「他の役割の口座」に、 便用の除外が「登録 row + 全役割の宣言と実効の口座」に変わる。 席用 (余裕が最大) と便用 (reset の早い順) の順序は別のまま。 選定の純関数は不変。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この ADR が版の系譜のどこに在るかと、判断が最後に行き着く原則です。ADR-1036 の「宣言の口座が使えない周は席ごとに選定に落ち、余裕が戻れば宣言へ戻る」を、host の根の記録 1 件に居続ける形に置き換えます。宣言の file と書き換えの口、選定の純関数はそのままです。
  改訂状態: current
  置き換える ADR: なし (新規)
  置き換えられた: なし (現行)
  本 ADR は現行。 ADR-1036 を部分 supersede する: DR3 の前半 (逼迫したら席ごとに選定に落ちる) と後半 (余裕が戻れば宣言へ戻る) の両方、 決定の句「宣言が在り口座が使える周はその口座で起こし、 使えない周だけ session 用の選定に落ちる」(→ 実効の記録が先・宣言は種)、 その選定の除外 (自席以外の全登録 row の口座・ADR-1026 §2.3 由来 → 他の役割の口座だけ)、 管理 tick の比較の相手 (宣言の口座 → 実効の口座)、 便用の除外 (登録 row + 宣言の口座 → それに全役割の実効の口座を足す)、 --account の食い違いの比較の相手 (宣言 → 実効の口座)、 account reassign の効き方 (宣言の書き換え → それに実効の記録の退役を足す)。 ADR-1020 §2.4 の決定の句「候補なしの周 SHALL 立て直さず typed な理由を記帳し、 次の tick で選び直す (席を 0 口座で起こさない)」(設計 account-autonomy.md §5 も同じ) を部分 supersede する: 当たっていない測れた口座が在る周は妥協の起動で席を立て、 1 つも無い周だけ現行のまま。 同じ §2.4 の「閾値以上の間は退避の合図を注入する」は、 選び直しの候補が在る周に限り、 無い周は妥協の通知 1 回に置き換える。 SRS FR1044 が並べる tick の合図の名 (打刻・退避) に妥協の通知が加わる。 ADR-1036 の宣言 file の形と置き場・理由の閉じた 3 値・doctor の 1 行の既存の項目、 選定の純関数 (ADR-1020 §2.2 / ADR-1027 §2.2 の順序)・R-C9-1・登録 row の鍵と書き手・退役の可逆 move・役割の権能 (ADR-1022) は現行のまま。 SRS FR1036 / FR1038 / FR1044 / FR1059 の句は ADR-1036 と同じ user の /folio-architect の周で改訂する。
  照会終端 — PRIN-ROLE-ACCOUNT-IS-ONE-EFFECTIVE-RECORD
  役割に効く実効値 (いま使う口座) は役割単位で 1 回だけ決めて host に 1 か所だけ記録し、 同じ役割の席はそれを読む。 決め直すのは逼迫した周だけで、 人が書いた宣言は器が上書きしない。 決められない周は席を止めずに妥協の事実を user に渡す。
  本 ADR の判断はこの原則に行き着く (これ以上は遡らない照会終端)。
options:
  - id: "OPT1"
    name: "実効の口座を host の根の実効の記録 1 件 (役割ごと・器が書く) に持ち、 逼迫した周にだけ役割単位で 1 回選び直す。 候補が無い周は妥協の口座で立てる"
    text: |
      役割の実効の口座を 1 関数で解く: 実効の記録が在りその口座が使えればそれ (居続ける)、 記録が無い周は宣言の口座が使えればそれを記録に書いて使う (宣言 = 初期値の種)、 どちらも使えない周だけ役割単位で 1 回 session 用の順序 (余裕が最大) で選び直して記録を書き換える (前の記録は履歴へ move)。 除外は他の役割の口座だけ。 閾値未満の候補が無い周は、 当たっていない中で余裕が最大の口座、 それも無ければ他の役割の口座との同居も入れて余裕が最大の口座で席を立て、 妥協の理由を記録と席の指示文に出す。 consult は planner の記録を読む。
      （平易）host に 1 か所だけ「この役割はいまこの口座」という記録を器が持ちます。同じ役割の席は全部それを読むので、いつも同じ口座に揃います。その口座が逼迫したら、最初に気づいた席が役割を代表して余裕が最大の口座を選び、記録を書き換えます。元の口座に余裕が戻っても戻りません。使える口座が見つからないときも、いちばんましな口座で席を立て、席に「妥協で立った」と知らせて user の裁定を待たせます。
      利点: 同じ役割の席が常に同じ口座に揃い、 席が占める口座が役割の数で頭打ちになる (便が使える口座が増える)
      利点: 移るのは逼迫した周だけで、 宣言との行き来の cycle が無い
      利点: 席が必ず立つので対話面が残り、 妥協の周の進め方を user が裁定できる
      利点: 人が書く宣言は器が触らず、 選定の純関数も変えない (閾値の入力と除外集合の作り方だけで妥協の段を表せる)
      欠点: host の根に器が書く記録が 1 種類増え、 reader・lock・退役の move・doctor の項目・席の指示文の穴・歯が契約に載る
      欠点: 同じ役割の席が 1 つの口座に集まるので、 その口座の窓の減りが速くなる
      欠点: 宣言と実効の口座が長く食い違いうる (宣言は種でしかない)。 人が戻したい周は宣言の書き換えの口を撃つ 1 手が要る
      欠点: 妥協の周は閾値以上の口座や他の役割と同居の口座で席が走る (作業は止まり、 user の裁定待ちになる)
    verdict: adopted
    reason: "役割の実効の口座を 1 関数で解く: 実効の記録が在りその口座が使えればそれ (居続ける)、 記録が無い周は宣言の口座が使えればそれを記録に書いて使う (宣言 = 初期値の種)、 どちらも使えない周だけ役割単位で 1 回 session 用の順序 (余裕が最大) で選び直して記録を書き換える (前の記録は履歴へ move)。 除外は他の役割の口座だけ。 閾値未満の候補が無い周は、 当たっていない中で余裕が最大の口座、 それも無ければ他の役割の口座との同居も入れて余裕が最大の口座で席を立て、 妥協の理由を記録と席の指示文に出す。 consult は planner の記録を読む。"
  - id: "OPT2"
    name: "移り先を記録するが、 宣言の口座に余裕が戻れば宣言へ戻る (ADR-1036 DR3 の後半を残す)"
    text: |
      解決の順を宣言 → 移り先の記録 → 選定にし、 宣言の口座が使える周は常に宣言が勝つ。
      （平易）人が決めた口座を常に優先する案です。宣言どおりに戻るので分かりやすい一方、口座の窓が開くたびに全席が退避と起こし直しを通って戻り、また逼迫して移る、という行き来が起きます。
      利点: 宣言と実効の口座の食い違いが短い (余裕が戻れば宣言どおりになる)
      欠点: 窓が開くたびに全 project の席が退避と立て直しを通って戻る = 行き来の cycle が役割の席の数だけ増える (user の裁定は「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」)
      欠点: 戻った直後の宣言の口座は閾値の近くに居やすく、 すぐまた移る
    verdict: rejected
    reason: "解決の順を宣言 → 移り先の記録 → 選定にし、 宣言の口座が使える周は常に宣言が勝つ。"
  - id: "OPT3"
    name: "器が宣言 file (roles.toml) 自体を移り先の口座で書き換える"
    text: |
      逼迫を見た席が ADR-1036 の書き換えの口と同じ手順で宣言の行を移り先に書き換え、 全席が宣言を読んで移る。
      （平易）新しい記録を持たず、宣言そのものを器が書き換える案です。仕組みは増えませんが、人が決めた値と器が測って決めた値が同じ file で混ざり、どちらが書いた値か分からなくなります。
      利点: 置き場と reader が増えない (ADR-1036 の file と口だけで済む)
      欠点: 宣言値を器の実測で上書きする = 宣言値と実効値を型で分ける憲法 C10 に反する
      欠点: 人が決めた口座が file から消え、 妥協の理由のような器の側の項目を宣言 file に持ち込むことになる
    verdict: rejected
    reason: "逼迫を見た席が ADR-1036 の書き換えの口と同じ手順で宣言の行を移り先に書き換え、 全席が宣言を読んで移る。"
  - id: "OPT4"
    name: "選定の除外から同じ役割の席を外すだけで、 記録は持たない"
    text: |
      除外集合の作り方だけを変え、 使えない周は従来どおり席ごとに選定を撃つ。
      （平易）候補の削り合いだけを直す案です。席が立たない問題は減りますが、席が 1 つずつ別の時刻に選ぶので、その時々の残量で選ぶ口座が変わり、同じ役割の席が別々の口座へ散ります。
      利点: 変更が除外集合の 1 か所で済み、 新しい file を持たない
      欠点: 席ごとに別の周の実測で選ぶので、 同じ役割の席が別々の口座へ散る (user の裁定の「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」にならない)
      欠点: 席が占める口座が役割の数で頭打ちにならず、 便が使える口座が減る
    verdict: rejected
    reason: "除外集合の作り方だけを変え、 使えない周は従来どおり席ごとに選定を撃つ。"
  - id: "OPT5"
    name: "実効の口座を各 state dir の event log の event に持つ"
    text: |
      口座を決めた席が自分の state dir の event log に event を 1 件積み、 他の席は replay で読む。
      （平易）既に在る記録の仕組みに載せる案です。追記だけで履歴も残りますが、記録の置き場は project ごとに分かれうるので、別の置き場を使う project の席には届きません。
      利点: append のみの既存の store に載り、 履歴が自然に残る
      欠点: state dir が project ごとに分かれた host では、 別の state dir の席に届かない (ADR-1036 CTX2 の実測と同じ穴)
      欠点: host 横断の値を project の state に置くことになり、 ADR-1036 が host の根へ寄せた向きの逆
    verdict: rejected
    reason: "口座を決めた席が自分の state dir の event log に event を 1 件積み、 他の席は replay で読む。"
  - id: "OPT6"
    name: "閾値未満の候補が無い周は席を起こさず断る (現行)"
    text: |
      選定が候補なしを返した周は 1 key も送らず、 次の tick で選び直す。
      （平易）いまの形です。逼迫した口座で席を走らせずに済みますが、席が立たないので対話の窓口も消え、user が「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」を決める場所が無くなります。
      利点: 閾値以上の口座を席が消費しない。 器の変更が無い
      欠点: planner の席が立たない間は対話面が無く、 裁定も便の起動も止まる (実測 2026-09-17)
      欠点: どの口座をどこまで使うかは user の予算の判断なのに、 器が黙って「使わない」側に倒している
    verdict: rejected
    reason: "選定が候補なしを返した周は 1 key も送らず、 次の tick で選び直す。"
  - id: "OPT7"
    name: "host 常駐の process が逼迫を監視して全席を同時に移す"
    text: |
      host に 1 つ常駐する process が役割の口座の残量を監視し、 逼迫したら移り先を選んで全 project の席を一斉に動かす。
      （平易）host に常駐して監視する process を置く案です。全席が本当に同時に移りますが、常駐 process を持たない方針と食い違い、ADR-1034 と ADR-1036 で既に退けた形です。
      利点: 移し替えが即時で、 project ごとの tick を待たない
      欠点: 常駐 process を持たない向き (ADR-1034 の契機は tick と land・ADR-1036 OPT5 の却下) と食い違う
      欠点: 席を動かす手が tick の外にもう 1 本増え、 退避の合図の除外 (FR1029) と立て直しの 3 条件を 2 か所で持つことになる
    verdict: rejected
    reason: "host に 1 つ常駐する process が役割の口座の残量を監視し、 逼迫したら移り先を選んで全 project の席を一斉に動かす。"
basis: [FR1029, FR1036, FR1038, FR1044, FR1059, ADR-1020, ADR-1021, ADR-1022, ADR-1026, ADR-1027, ADR-1034, ADR-1036, CON1002]
retreat:
  kind: ruling
  condition: "持ち主に問う: 器のこの判断を替えるか。替える時は、この記録の本文を直さず、後継の判断の記録を立てて替える（取り込みの決め）。"
plain: |
  役割の席が使う口座は、host に 1 か所だけ在る記録が決めます。同じ役割の席はどの project からでもその記録を読んで同じ口座を使い、その口座が逼迫したときにだけ、役割ごとまとめて余裕が最大の口座へ移ります。宣言の口座は最初の 1 回の種で、余裕が戻っても戻りません。使える口座が見つからないときも席は必ず立て、その旨を席に知らせて user の裁定を待たせます。
