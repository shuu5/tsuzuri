# 判断の記録 ADR-52 — 発端の trailer の無い器の便でない commit に、後の commit の本文の追認の札で発端を結ぶ（持ち主の裁定 2026-10-05・記帳先 = tsuzuri の台帳の問い t3-hub.80.31 の notes）
# 起草は席（2026-10-05）。材料は係 w158a の比べと試作（drafts/w158a/w/questions.md・notes.md・rows_e.py）と、検証役 qv161・qv166 の攻め。承認の欄は問い t3-hub.80.31 の裁定。
id: ADR-52
title: 発端の trailer も器の便の trailer も持たない器の便でない commit には、切り替えの線より後の発端の trailer を持つ commit の本文の追認の札で発端を結べ、結んだ番号は本文の発端と同じに台帳で照らす（ADR-1088 の決定 (7) の部分 supersede）
status: accepted
date: 2026-10-05
context: |
  ADR-1088 の決定 (7) は、main に入る器の便でない commit に発端の trailer を求め、線より後の commit で発端の trailer も器の便の trailer も無ければ、その commit の部品を局面の出力の外れ（misfit）に数えると決めた。要件 FR1092 が同じ事を持つ。
  10-01 に席が main へ入れた設計の commit 9 本（55c5bcd2〜62a2f8fd）は、器の決まりは在ったが、席の commit の道具がまだ発端の trailer を求めていなかった間に入ったので、trailer を持たない。commit の本文は後から書き替えられないので、9 本は外れのまま残り、席への知らせ（alarm=owned）が 10-01 から鳴り続けている（10-04T22:24Z の出力の commit の外れ 9 と owned 9 はちょうどこの 9 本）。合流の門（ADR-45）の「commit の照らしの外れ 0」も満ちない。
  9 本とも、作業の memo（t3-hub.52.160）の記録（notes）が sha を名指している（8 本は本文にも番号が在る）。
  問い（t3-hub.80.31）は案 E に裁定された（裁定 id は承認の欄）。
decision: |
  (1) 追認の札。発端の trailer を持つ器の便でない commit は、本文に追認の札（名は NAME から導き本 repo では Scribe2-Adopts・値は 40 字の sha と台帳の bead の番号を空白で区切って 1 本以上）を置ける。局面の出力の全部の書き直しは、切り替えの線より後の main の commit からこの札を読む。
  (2) 結ぶ相手。札は、発端の trailer を持つ commit の札だけを読み、40 字の sha が同じ commit で、本文に発端の trailer も器の便の trailer も無いものにだけ結ぶ。sha の一部だけの一致は結ばない。
  (3) 判じ。結んだ番号は本文の発端と同じに判じる。台帳に無い番号は外れ（source-unresolved）とし、照らしから外す commit は作らない。札は足すだけで減らないので、誤った番号を結んだ commit はこの口では直せない。そのため札を置く前に、sha と番号を git と台帳と局面の出力で照らす（読むだけの段）。
  (4) 替えない物。器の merge の門と main の出所の検査（main-provenance）は札を読まない。発端の trailer を求める入口の決まりと、ADR-1088 の決定 (7) のほかの句は替えない。
  (5) 行と順。器の札の行（v-adopt・ノート surface-wave29a）がこの記録を実装する。10-01 の 9 本の札は、札の行を置く設計の commit の本文に置き、行の着地と器の入れ替えの後の全部の書き直しで 9 本が解ける。入れ替えの前に起きた古い版の器が書き直す周は札を読まないので、その周だけ 9 本が外れに戻る。
options:
  - id: e
    name: 後の commit の追認の札で発端を結ぶ
    text: 決定 (1) から (5)。
    verdict: adopted
    reason: 数えから 1 本も外さず、9 本に本物の発端を結ぶ。照らしを外さず台帳で照らす一般の口なので、条 N-3.1（無効化の旗・今回だけの口を足さない）に当たらない。9 本の番号は作業の memo の記録から決まり、席が選ぶ番号は無い。
  - id: a
    name: 席の旗で線を引く
    text: 全部の書き直しの口に旗を足し、外れの数と anchor と main の系譜を照らして通った時だけ、ここより前の commit を照らさない線を 1 度だけ記帳する。
    verdict: rejected
    reason: 撃つ時の main までの全部（main 61106965 で 248 本）を照らしから外し、9 本の発端は記録されない。人が 1 度だけ撃って照らしを範囲で外す旗は条 N-3.1 に当たり、条 N-3 の除外の記録が要る。
  - id: b
    name: 宣言の鍵で線を引く
    text: A の線を器の宣言の任意の鍵で引く。
    verdict: rejected
    reason: A と同じく線より前の全部を外し、条 N-3.1 に当たる。線を引く時を選べず、数も照らせない。
  - id: c
    name: 残して目標の字を直す
    text: 器を替えずに 9 本を残し、ADR-45 の門の目標の字を直す。
    verdict: rejected
    reason: 9 本が窓の無い外れとして残り、alarm=owned が鳴り続けて新しい遅れを知らせる力を失う。
  - id: e2
    name: git の note で結ぶ
    text: 9 本に git の note で発端を付ける。
    verdict: rejected
    reason: note は上書きで黙って替わり、門を通らず、既定の fetch に入らない。
basis: [ADR-1088, FR1092, ADR-45, N-3, N-4, P-7]
retreat:
  kind: measure
  condition: |
    数えるのは tsuzuri の設計の席で、器の memo（t3-hub.74.50.4）か後継の memo の notes に 1 件ごとに記帳する。問う相手は持ち主。
    (1) 札が誤った発端を結んだ例（結んだ番号がその commit の作業の記録と食い違う）が 1 件でも出たら、後継の記録で札の読みを止めるかを問う。
    (2) 札を置く前の照らしを通らずに札が main に入った例が 1 件でも出たら、札を入口の門で照らす形を問う。
plain: |
  発端の札（どの台帳の記録のための変更かを示す行）を付け忘れて main に入った古い commit に、後の commit から本物の発端を結べるようにする記録です。
  10 月 1 日に入った設計の commit 9 本がこれに当たり、外れとして数え続けられ、席への知らせが鳴りやみませんでした。
  これからは、後の commit の本文に「この commit の発端はこの番号」と書く札を置けば、器がそれを読んで台帳で照らし、外れを解きます。数えから外す commit は作りません。
approval:
  who: 持ち主
  date: 2026-10-05
  ruling: t3-hub.80.31（裁定 id = t3-hub.80.31:20261004T2239Z-1・案 E・裁定面・notes に逐語）
  verbatim: "推奨で進めて"
  surface: R-8
consequences:
  - 器の版を跨ぐ面（trailer の名）が 1 種（Adopts）増える。足すだけなので条 N-4 の非互換ではない。
  - 後から結ぶ口は 9 本の後も使える。札は入口の門で照らされず消せないので、置く前の読むだけの照らし（係 w158a の check-adopts.py）を席の手順に置く。
  - 今の tsuzuri で入口で発端の trailer を求めるのは、席の commit の道具と席の merge の command に掛かる門だけで、CI の出所の検査はまだ撃っていない。
  - 器の設計 doc case-lifecycle.md の外れの表は、取り込みの後は直していない（10-03 から 0 commit）ので直さない。札の行（v-adopt）の節が新しい振る舞いを書く。
note: 起草は席。数は係 w158a と検証役 qv166 が main 61106965 と 10-04T22:24Z の局面の出力で数えた。
