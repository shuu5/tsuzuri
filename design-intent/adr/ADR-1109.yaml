options:
  - id: "OPT1"
    name: "vessel 宣言の任意 key で置き場を既定に足し、 表を数える読み手を全部 1 つの列挙の関数（表の file を選ぶ）に通す"
    text: |
      対象 repo の vessel 宣言に任意 key contract-tables (repo 相対の dir か file の項目の配列) を足し、 既定 (設計 doc の dir の直下の markdown) との和を契約表の置き場とする。 契約表の検査・宣言済みの新規 file・runner の節・局面の出力の行・live-row の門・台帳の形の検査・受付の生成を 1 つの列挙の関数に通し、 各読み手は自分が読む commit の宣言を読む。 契約表の検査は何にも当たらない項目と doc id（表の file の名） の重なりを名指し、 受付は置き場の外を指す pointer を断る。 決め手は repo の形を repo が名乗る先例と、 写しがずれた現物 (CTX1・CTX4)。
      （平易）repo の設定 file (vessel 宣言) に、 書かなくてよい項目 contract-tables を足します。 値は repo の中の dir か file の一覧で、 dir はそのすぐ下の .md か .toml の file を、 file はその 1 つを指し、 既定 (設計 doc の dir のすぐ下の markdown) に足されます。 表を数える読み手は全部 1 つの関数を通り、 それぞれ自分が読む commit の設定を読みます。 表の検査は何にも当たらない項目と file の名の重なりを名指し、 受付は置き場の外を指す契約を断ります。 表をどこに置く repo でも 1 行で見張りに表を見せられ、 書かない repo の表の数え方は今と同じで、 読み手の範囲が揃い、 設定で設計 doc の表を外せず、 受付の断りが入った後は走る便の行が門の守る範囲に在ります。 代わりに、 古い本体は新しい項目を知らずに設定全体を断るので、 相手は本体を入れ替えてから書く順が要り、 読み手ごとに設定を読む手間が増えます。 項目を書かない repo では門の守る範囲が直下の markdown だけに狭まり、 受付の断りが入るまでの間はその外の行を門も受付も止めません (器の repo と隣の project の両方で、 外れる表は 0 本)。 設定を変える commit の中の表の変更は、 変更の前の設定で測ります。
      利点: 表の在りかを器が決め打ちせず、 どんな配置の repo も宣言 1 行で見張りの側に表を見せられる (DR1)
      利点: key を書かない repo の検査の数え方は 1 本も変わらず、 本 repo は 30 本のまま (DR2)
      利点: 表を数える見張りの読み手が全部同じ列を見るので、 検査と門と局面の出力の範囲が揃う (DR3)
      利点: key は既定に足すだけなので、 宣言で設計 doc の表を検査の外へ出せない (DR4)
      利点: 読めない宣言は既定に倒さず、 何にも当たらない項目と doc id の重なりを検査が名指す (DR5)
      利点: 宣言は PR と審査を通る tracked file で、 作業ツリーの一時の状態を読まない (DR1)
      利点: 受付の断りの着地の後は、 走っている便の行が置き場の中に在るので、 門は置き場だけを見て足りる (DR7)
      欠点: 宣言の key が 1 つ増え、 古い binary は key を未知として宣言全体を断る (DR6)
      欠点: 各読み手が自分の commit の宣言を読む費用 (git の子 process 1 回) が増える
      欠点: 消費側は key を書く 1 手間を負い、 書く前に host の binary を入れ替える順が要る (DR6)
