  器の案の章の要約: 候補を 10 個並べます。 設定 file の書かなくてよい項目で表の置き場を既定に足し、 表を数える読み手を全部 1 つの関数に通す案 (選んだ案) と、 選ばなかった 9 つです。 選ばなかった案は、 contracts/ の toml を器が決め打ちで数える案・台帳の開いた契約が指す file だけを読む案・読み手ごとに置き場の一覧を持つ案・中身の印で表を見分ける案・設計 doc の編集の範囲を名乗る既存の項目を流用する案・項目にワイルドカード (glob) を許す案・項目が既定を置き換える案・走る便の行を守る門だけ今の広い範囲を残す案・受付で断らずに門が走る便の指し先を守る案です。
  器の専門語の説明: 本文に出てくる専門語 11 個を、 やさしい言葉で説明します。
  ・契約表の置き場（contract table places）: 契約表を持つ tracked file の集合 (本 ADR)。 既定は設計 doc の dir (docs/design/) の直下の markdown で、 vessel 宣言の任意 key contract-tables が dir (その直下の .md か .toml の file) か file を足す (置き換えない)。 表を数える器の読み手は全部この集合を読む。
  ・列挙の関数（enumeration function）: path の列と宣言の項目の列から、 契約表の置き場に入る file だけを入力の順のまま 1 度ずつ返す器の 1 つの関数 (本 ADR)。 項目が無ければ既定の置き場だけを返す。
  ・vessel 宣言（vessel declaration）: 対象 repo が器に自分の形 (許す command・共通 verify・任意の確かめ・path の種別など) を名乗る tracked file .vessel.toml (ADR-1010)。 key の集合は core の閉じた列が持ち、 読み手は未知の key を宣言全体の不備として断る。
  ・任意 key（optional key）: vessel 宣言の key のうち書かなくてよいもの。 書かない宣言は器の既定で動く。 本 ADR は contract-tables を足す。
  ・doc id（doc id）: 契約 id の前半で、 表の file 名から拡張子を除いた名 (ADR-1023 §2.1)。 契約 id は doc id と行 id の組なので、 置き場が増えても置き場の中で重なってはならない。
  ・跨版（cross-version）: 器の版と消費側の宣言の版が違っても、 壊れ方が決まっていること。 古い binary は新しい key を未知の key として宣言全体を断る。
  ・live-row の門（live-row gate）: 走っている便の契約の行の字を、 編集と commit の時点で止める hook の判定 (設計 vessel-hook §15・C16)。 本 ADR の後は契約表の置き場の file だけを比べ、 宣言を読めない周は .md と .toml の file を全部比べる。
  ・局面の出力（case-position output）: 器が案件の部品 (契約の行・要件など) ごとの局面・手番・理由を導いて、 state dir ごとに 1 つ書く file (ADR-1088・SRS FR1090)。 全部の書き直しは main の契約表と SRS と vessel 宣言を読む。
  ・契約表の検査（contract table check）: 契約表の全行に、 受付と同じ write-set の閉包の導出や設計 pointer の解決などを回し、 違反する行を file と行で名指して非 0 で止める器の口 contracts check (SRS FR1055)。 CI が撃ち、 判定行は表の file の数 docs と行の数 rows を持つ。
  ・受付（contract intake）: 契約を便にする前に器が撃つ検査の段 (SRS FR1048・FR1053・FR1054)。 設計 pointer で base の表から 1 行を読み、 通った契約だけが便になる。
  ・設計 doc（design doc）: 要望を SRS の要件に結び、 契約が複数出る元になる tracked markdown (docs/design/ の下)。 末尾に契約表の区間を 0 か 1 つ持てる (ADR-1023 §2.1)。
