# 判断の記録 ADR-1109 — 器 scribe2 の判断の記録 ADR-0109 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1109
title: "契約表の置き場 — 既定 (設計 doc の dir の直下の markdown) に、 対象 repo の vessel 宣言の任意 key contract-tables が名乗る dir か file を足し、 契約表を数える器の読み手を全部 1 つの列挙の関数に通し、 受付は置き場の外を指す pointer を断る (ADR-1023 §2.1 の表の在りかの句を部分 supersede)"
status: accepted
date: 2026-10-02
context: |
  器の中で契約表を数える見張りの読み手は「表がどこに在るか」を 2 通りに決め打ちし、 表を設計 doc の dir の外の toml に置く repo では、 契約表の検査・局面の出力・走っている便の行を守る門・台帳の形の検査が表を見ない。 本 ADR は、 契約表の置き場を、 既定 (設計 doc の dir の直下の markdown) と、 その repo の vessel 宣言の任意 key contract-tables が名乗る dir か file の和とし、 表を数える読み手を全部 1 つの列挙の関数に通し、 受付は置き場の外を指す pointer を断ると決める。 key を書かない repo の数え方は今と同じだが、 走っている便の行を守る門は既定の置き場だけを守るように狭まる。
  なぜこの判断が要るのかを 6 つで示します。 器の中に表の在りかの決め方が 3 通りあり、 表を数える見張りはそのうち 2 つを使っていること。 1 行を指して読む入口は場所を問わず、 表を数える見張りの側だけが在りかを決め打ちしていること。 表を toml に置く隣の project で、 見張りが表を 0 本と数えたという照会。 repo が自分の形を設定 file で名乗る口と、 項目を「足す」と「置き換える」の 2 つの先例。 表の形は決まっていたのに、 toml の表の在りかは決まっていなかったこと。 憲法の向きと、 この記録が動かす範囲です。
  CTX1 現物 — 「表がどこに在るか」の定義が器の中に 3 通りあり、 表を数える見張りはそのうち 2 つを使う
  契約表を読む器の読み手は、 表の在りかを 3 通りに定めている (main a6d4234c の現物)。 (1) 設計 doc（設計を書いた文書） の dir (docs/design/) の直下の markdown: 契約表の検査（表の全行を調べる口）とその名の衝突の予想・宣言済みの新規 file (契約表の検査と受付（便を受け入れる口）の材料の両方)・runner に渡す「ほかの行の touches」節が 1 つの関数で読み、 局面の出力（案件の今を書いた file）の行の読み手と台帳の形の検査は同じ絞り方を自前の写しで持つ。 (2) 設計 doc の dir の下の全部 (深さを問わず markdown か toml): live-row の門（走る便の行を守る門）だけが持ち、 設計 vessel-hook §15 がこの範囲を名乗る。 (3) 表の形の中身を持つ tracked file (場所を問わない): 行の審査の表の見分けと code の木の鍵が持つ。 表を数える見張りが使うのは (1) と (2) で、 (3) は中身で見分ける行の審査の側の定義として本 ADR の後も残る。 本 repo では 3 つが同じ 30 本 (全部が直下の markdown) を指し、 契約表の検査は docs=30 rows=478 と数える。 設計 doc の dir の下の toml と入れ子の dir は 0 本で、 表を持つ tracked file は設計 doc の dir の外に 0 本なので、 違いは見えていなかった。
  CTX2 現物 — 1 行を pointer で引く口は場所を問わず、 表を数える見張りの側だけが在りかを決め打ちする
  設計 pointer (表の file の path と契約 id の対) で 1 行を引く口は、 file の拡張子だけを見て形を決める (markdown は末尾の区間・toml は全文・ADR-1023 §2.1 の 2 形)。 受付の生成は pointer の doc を HEAD から読むだけで在りかを照らさず、 受付・preflight・列の候補・起動の列の事前の検査・行の審査・resume の取り直しがこの 1 本を呼ぶので、 表をどこに置いても便は起きて通る。 表の在りかを決め打ちするのは、 表を全部数える見張りの側 (契約表の検査・局面の出力・live-row の門・台帳の形の検査) だけである。 本 repo の contracts/schema.toml は欄の生成物 ([[field]] の表) で、 契約表の読み手は [[contract]] と [[promise]] のほかの表を断る。
  CTX3 消費側の症状 — 表を toml に置く隣の project で、 見張りが表を 0 本と数える
  契約表を contracts/ の toml に置く隣の project から、 局面の出力が契約の行と要件の部品を「表を読めない」と出し、 契約表の検査が docs=0 rows=0 と数え、 live-row の門が走っている便の行の書き換えを止めないと照会があった (台帳 memo s2-07l.738.42.2・2026-10-01)。 3 つとも、 CTX1 の (1) と (2) の定義の帰結として説明がつく。 同じ帰結として、 受付の名指しの実在の照らしが toml の行の新規 file を宣言済みと読まないこと、 名の衝突の予想が toml の行を見ないこと、 runner の「ほかの行の touches」節が toml の行を載せないことも導ける (器の code からの導きで、 その repo の code は読んでいない)。 2026-10-02 に数えると、 その repo の設計 doc の dir の下には、 直下の toml も入れ子の dir の表も 0 本だった。
  CTX4 宣言の口と先例 — repo の形は vessel 宣言（repo の設定 file）が名乗り、 任意 key（書かなくてよい項目） には「足す」と「置き換える」の先例が在る
  vessel 宣言 (.vessel.toml) は、 対象 repo が自分の形を器に名乗る tracked file で (ADR-1010)、 任意 key の集合は core の閉じた列が正本である (ADR-1023 §2.7 (iv))。 宣言の読み手は 1 本で、 未知の key を宣言全体の不備として断る。 path の種別の 3 key (ADR-1047) は repo 相対の prefix の配列で、 glob と正規表現を持たず、 書けば既定の分類を置き換える。 crate-roots の key (設計 contract-source §62) は固定の根に項目を足す。 宣言を名指した commit で読む口と、 既定だけの周・key の在る周・読めない周を閉じた 3 値で返す型にも先例が在る。 新しい key は、 古い binary が未知の key として断るので、 跨版（版の違いをまたぐ）の形を持つ。
  CTX5 予告されていた穴 — 表の 2 形は決まっていたが、 toml の表の在りかは決まっていない
  ADR-1023 §2.1 は、 契約の正本を対象 repo の tracked な設計 doc が末尾に持つ機械が読む表の 1 行とし、 表の形を 2 つ (設計 doc の区間・表だけを持つ tracked な toml の全文) と決め、 読み手は拡張子で形を決めるとした。 けれども、 toml の表をどの dir に置くかは決めていない。 設計 contract-source §47 は、 契約表の検査の母集団に導出物の在りかを足すこと (在りかは消費側の宣言) を後続に残し、 前提の移行の仕事が取りやめで閉じた後も、 その 1 行だけが残っていた。
  CTX6 憲法の向きと本 ADR の射程
  C2 は選択と除外を 1 つの関数で行い、 新しい理由を enum の 1 値で足すことを求める。 C10 は宣言値と導出値を型で分け、 その読み (ADR-1047) では読めない宣言を既定に倒さない。 C16 は逸脱を編集の時点で止める。 C17 は足す前に消すものを名指すことを求める。 NFR1004 は不正な入力を黙って落とさない。 本 ADR が動かすのは、 契約表の置き場（表を置いてよい file）の定義・それを名乗る宣言の key・表を数える読み手の列挙・live-row の門の範囲・置き場の検査・受付が置き場の外の pointer を断ることの 6 つである。 1 行を pointer で引く口・表の 2 形と拡張子で形を決める読み手・契約 id の形・行の審査の中身による見分け・path の種別の key は動かさない。 SRS の字の直しは別の round が持つ。 ADR を書く条件のうち 1 (C2・C10 の読み)・3 (宣言の key と跨版の形)・4 (却下案を残す価値のある分岐) に当たる。
  （選択肢を測るものさし）この判断を評価する 7 本のものさしです。 表の在りかは repo が名乗ること。 書かない repo の数え方を 1 本も変えないこと。 表を数える読み手が全部同じ 1 つの決め方を使うこと。 設定 1 行で検査の範囲を狭められないこと。 読めない設定や打ち間違いを黙って「表 0 本」にしないこと。 古い本体と新しい設定が出会ったときの壊れ方を名指すこと。 走っている便の行を、 表がどこに在っても編集の時点で止めることです。
  DR1｜出所 — 表の在りかは対象 repo の事実で、 repo が自分の宣言で名乗る (器の code にも規則の行にも決め打ちしない) CTX3・CTX4
  DR2｜無変更 — key を書かない repo の検査の母集団は 1 本も変わらない CTX1・CTX4
  DR3｜1 つの定義 — 表を数える読み手は全部同じ 1 つの関数を通る (写しはずれる・C2) CTX1・CTX6
  DR4｜狭められない — 宣言 1 行で器の検査の母集団を狭められない CTX4・CTX6
  DR5｜fail-closed — 読めない宣言・何にも当たらない項目・打ち間違いを、 黙って「表 0 本」にしない (C10・NFR1004) CTX3・CTX6
  DR6｜跨版 — 古い binary と新しい宣言が出会ったときの壊れ方を名指す CTX4
  DR7｜守り — 走っている便の行は、 表がどこに在っても編集の時点で止まる (C16) CTX2・CTX3・CTX6
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 表の置き場は、 既定 (設計 doc の dir のすぐ下の markdown) と、 repo の設定 file の項目 contract-tables が名乗る dir か file の和で、 項目は足すだけで既定を置き換えません。 表を数える読み手は全部 1 つの関数を通り、 それぞれ自分が読む commit の設定を読み、 設定を読めない回は既定に倒さずに止まるか厳しい側に倒れます。 走る便の行を守る門も同じ置き場だけを守るので、 項目を書かない repo では門の範囲が狭まります。 表の検査は、 何にも当たらない項目と file の名の重なりを名指します。 受付は置き場の外を指す契約を断り、 その断りは相手の repo が項目を書いた後に入れます。 支える要件は 7 つです。 要件書の字は、 FR1047・FR1055・FR1090 を最初の行の前の改訂で、 FR1053・FR1054 を受付の断りの行の前の改訂で直し、 FR1051 は揃えるだけです。
  採用 — OPT1
  器 SHALL 契約表の置き場を、 既定 (設計 doc の dir の直下の markdown・今の母集団) と、 対象 repo の vessel 宣言の任意 key contract-tables が名乗る項目の和とする。 key の値 SHALL repo 相対の項目の配列で、 末尾が / の項目はその dir の直下の、 拡張子が .md か .toml の file を、 ほかの項目はその path と等しい 1 file を指す。 宣言 SHALL NOT glob と正規表現を持つ。 key SHALL 既定に足し、 置き換えない。 key を書かない宣言と宣言 file を持たない repo SHALL 今と同じ母集団を持ち、 宣言の schema SHALL 1 のままとする。 項目の不備 (空・絶対 path・home の短縮記号・.. の段) SHALL key の行番号を名指す宣言の不備とする。 器 SHALL 契約表を数える全部の読み手 (契約表の検査とその名の衝突の予想・宣言済みの新規 file・runner の「ほかの行の touches」節・局面の出力の行・live-row の門・台帳の形の検査・受付の生成) を 1 つの列挙の関数に通し、 局面の出力の行の読み手と台帳の形の検査が持つ定義の写しと、 live-row の門の別の定義 (設計 doc の dir の下の全部) を消す。 各読み手 SHALL 自分が読む commit の宣言を読む (検査・宣言済みの新規 file・受付・台帳の形・門は HEAD、 runner の節は便の base、 局面の出力は main の sha)。 宣言を読めない周 SHALL 既定に倒さない: 検査は今と同じ rc 2、 局面の出力は declaration の語で止まって書き直さず、 台帳の形は unreadable の 1 行、 門は拡張子が .md か .toml の file を全部比べる側に倒し、 受付は置き場の外と同じ断りにする。 key を書かない repo の live-row の門 SHALL 既定の置き場だけを守る。 契約表の検査 SHALL 宣言した項目のうち tracked な file に 1 つも当たらない項目と、 置き場の file 名の stem (doc id) の重なりを名指して非 0 で止める。 受付の生成と、 それを呼ぶ全部の口 (受付・preflight・列の候補・起動の列の事前の検査・行の審査・resume の取り直し) SHALL pointer の file が置き場に無い契約を doc を読む前に typed に断り、 走っている便の行が置き場の中に在ることを受付で成り立たせる。 この断り SHALL 消費側が key を名乗り、 走っている便のうち置き場の外を指す便が 0 本と数えた後に着地する。 本 ADR は ADR-1023 §2.1 の「tracked な設計 doc が末尾に持つ表の 1 行」を「契約表の置き場の表の 1 行」と読み替える。 本 ADR SHALL NOT 1 行を pointer で引く口・表の 2 形と拡張子で形を決める読み手・契約 id の形・行の審査の中身による見分け・path の種別の key を変える。
  （平易）表の置き場は、 既定 (設計 doc の dir のすぐ下の markdown) と、 repo の設定 file の書かなくてよい項目 contract-tables に書いた dir か file の和です。 項目は repo の中の相対の場所の一覧で、 / で終わる項目はその dir のすぐ下の .md か .toml の file を、 ほかの項目はその 1 file を指します。 ワイルドカードは持たず、 既定を置き換えず、 書かない repo の表の数え方は今と同じで、 設定の版も上げません。 空・絶対の場所・home の略記・親へ上る段を書いた項目は、 項目の行を名指して断ります。 表を数える読み手 (表の検査・宣言済みの新しい file・runner に渡す節・案件の今を書く file・走る便の行を守る門・台帳の形の検査・受付) は全部 1 つの関数を通り、 今ある写しと門だけの別の決め方は消します。 そのため、 項目を書かない repo では、 走る便の行を守る門が設計 doc の dir の下の全部でなく、 既定の置き場 (すぐ下の markdown) だけを守るように狭まります。 読み手はそれぞれ自分が読む commit の設定を読み、 読めない回は既定に倒しません。 表の検査は、 何にも当たらない項目と、 拡張子を除いた file の名の重なりを名指して止めます。 受付は、 置き場の外を指す契約を、 文書を読む前に断ります。 この断りは、 相手の repo が項目を書き、 置き場の外を指す走る便が 0 本になってから入れます。 1 行を指して読む入口・表の 2 つの形・契約の名の形・行の審査の見分け方・編集の範囲の項目は変えません。
  （理由）表の在りかを repo の設定で名乗らせるのは、 それが repo ごとの事実だからで、 器が決め打ちすると次の配置の repo に効かず、 この repo の生成物を表と読み違えます。 項目を既定に足すだけにするのは、 設定 1 行で検査の範囲を狭められないようにするためで、 表を持たない markdown は 0 行と数えるので既定を外す必要がありません。 読み手を全部 1 つの関数に通すのは、 写しは必ずずれ、 現に門だけが別の決め方を持って検査と範囲が食い違っているからで、 選び方を 1 つの関数に置く憲法の線にも沿います (中身で見分ける行の審査の決め方は、 場所を問わないので残します)。 門を同じ決め方に狭めてよいのは、 受付の断りが入った後は走る便の行が置き場の中に在り、 狭めて外れる表が器の repo と隣の project の両方で 0 本だと数えた (2026-10-02) からで、 断りが入るまでの隙で守りから外れる行も同じ数え方で 0 本です。 門を走る便の指し先で守る形は、 編集のたびに便の記録を読む重さが要り、 表の検査が見ない場所に契約の正本を置けてしまいます。 読めない設定を既定に倒さず、 何にも当たらない項目と名の重なりを名指すのは、 黙って表 0 本に落ちる道を残さないためです。 台帳の指し先や中身の印で見分ける案は、 台帳に記録の無い行や印の打ち間違いを数えから落とし、 ワイルドカードは新しい部品が要るのに、 先頭の一致と完全な一致で足ります。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1047（claim）: FR1047 (契約の正本) の「tracked な設計 doc の契約表の 1 行」を、 契約表の置き場 (tracked) の契約表の 1 行と読むと主張する。 欄の形と 1 行だけから取る形は変えない (字の直しは最初の行の前の SRS の round)。
  FR1055（claim）: FR1055 (契約表の検査) の母集団を契約表の置き場の全 tracked な表とし、 何にも当たらない宣言の項目と doc id の重なりも名指して非 0 で止めると主張する (字の直しと受入の足しは最初の行の前の SRS の round)。
  FR1090（claim）: FR1090 (局面の出力) の入力の「main の設計 doc の契約表」を、 main の先端の vessel 宣言が名乗る契約表の置き場の表と読むと主張する。 宣言を読めない周は declaration の語で止まり書き直さない (字の直しは最初の行の前の SRS の round)。
  FR1054（claim）: FR1054 (設計 pointer の拒否) の解決しない理由に、 pointer の file が契約表の置き場に無いことを足すと主張する (字の直しは受付の断りの行 cg の前の SRS の round)。
  FR1051（rationale）: FR1051 (台帳の lint) の、 解決できる設計 pointer を持たない open な契約を名指す形を保ち、 台帳の形の検査が数える表を同じ置き場に揃える (字は揃えるだけ)。
  FR1053（rationale）: FR1053 (契約 file の生成) の、 記録した base の表から行を読んで契約 file を生成する形を保つ。 読む file は契約表の置き場の file で、 「base の設計 doc」を「base の契約表の置き場の file」とする字の直しは行 cg の前の SRS の round が持つ。
  NFR1004（rationale）: NFR1004 (fail-closed) を保つ。 読めない宣言を既定に倒さず、 何にも当たらない項目と doc id の重なりを名指し、 黙って「表 0 本」に落とす経路を残さない。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
