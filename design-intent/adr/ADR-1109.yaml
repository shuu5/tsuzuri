      欠点: 表の定義が 2 本に戻り、 検査と門の範囲がまた食い違う (DR3)
      欠点: 受付が通さない場所の行を、 門だけが守る形になる (DR3)
      欠点: 受付の断りの着地の後は、 走っている便の行は置き場の中に在るので、 広い範囲は守る行を増やさない (DR7)
      欠点: 器の repo と隣の project の両方で、 門を狭めて外れる表は 0 本である (2026-10-02 に数えた)
    verdict: rejected
    reason: "決め手は定義の数と受付の断り (CTX1・CTX2)。"
  - id: "OPT10"
    name: "受付で断らず、 live-row の門を走っている便の pointer で守る"
    text: |
      受付は置き場の外を指す pointer も今どおり通し、 live-row の門は、 置き場でなく、 走っている便の設計 pointer が指す file を全部守る。 決め手は契約の正本の在りかと門の費用 (CTX1・CTX2)。
      （平易）受付は置き場の外を指す契約も今どおり通し、 走る便の行を守る門は、 置き場でなく、 走っている便が指している file を全部守る案です。 受付の挙動が変わらず置き場の外を指す今の便も止まらず、 設定を変えている間や、 門を狭めてから受付の断りが入るまでの間にも走る便の行を守れる点で勝ります。 けれども、 表の検査や案件の今を書く file が見ない場所に契約の正本を置けてしまい、 表の決め方が 2 本に戻ります。 また、 門は markdown か toml を編集するたびに便の記録を読んで走っている便の指し先を集めることになり、 1 回の編集の手間が設計の見積で 10 ms 未満から 150 ms 前後に重くなります。
      利点: 受付の挙動が変わらず、 置き場の外を指す既存の便も止まらない
      利点: 宣言を変えている間も、 走っている便の行を守れる (DR7)
      利点: 門を狭める行から受付の断りの行までの隙も無い (DR7)
      欠点: 契約表の検査と局面の出力が見ない場所に契約の正本を置けてしまい、 表の定義が 2 本に戻る (DR3・DR5)
      欠点: 門は markdown か toml を編集するたびに便の記録 (event log) を読んで走っている便の pointer を集めるので、 1 回の編集の費用が設計 vessel-hook §15 の見積で 10 ms 未満から 150 ms 前後に上がる
    verdict: rejected
    reason: "決め手は契約の正本の在りかと門の費用 (CTX1・CTX2)。"
