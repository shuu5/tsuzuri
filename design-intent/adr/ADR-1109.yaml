  - "代償: key を書かない repo の live-row の門は、 設計 doc の dir の下の toml と入れ子の dir の表を守らなくなる (器の repo と隣の project の両方で該当 0 本・2026-10-02 に数えた)。 そこに表を置く repo は key で名乗る"
  - "代償: 行 cd (門を狭める) から行 cg (受付の断り) までの間、 key を書かない repo の設計 doc の dir の下の toml と入れ子の dir の表を指す走っている便の行は、 門も受付も止めない (器の repo と隣の project の両方で 0 本・2026-10-02 に数えた。 隣の project の contracts/ の行は今も門の外なので、 その間に減る守りは無い)"
  - "代償: 宣言を変える commit と同じ commit の表の変更は、 変更の前の宣言で測る。 便が走っている間に宣言から置き場を外すと、 門はその置き場の行を守らない (宣言の変更そのものは便の審査と gate か user の手を通る)"
