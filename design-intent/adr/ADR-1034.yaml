plain: |
  便を起こす仕事を、planner と管理席の中継から器へ移します。契約が出来た直後に審査し、通った契約は自動で列に入り、依存と write-set の交差と受付を満たしたものから器が起こします。順番は planner の印 first、契約の priority、起票順で決め、管理席は質問と判定の中継と着地だけを担います。
