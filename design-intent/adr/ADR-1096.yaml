      （平易）組み立ての道具が置く印 (cargo の lock file など) の有無で、 組み立て中かを判じる案です。 組み立て中かを道具の印から直に読め、 時間の設定の値が要らない点で勝ります。 けれども、 印は言語と道具ごとに違い、 器が言語ごとの知識を持つことになります。 cargo の lock file は組み立ての後も残るので、 在っても組み立て中とは限りません。 退けました。
      利点: 組み立て中かを道具の印で直に読める
      利点: 時間の値 (rules 行) が要らない
      欠点: 印は言語と道具ごとに違い、 器が言語ごとの知識を持つことになる (DR5)
      欠点: cargo の lock file は組み立ての後も残るので、 在ることは組み立て中を意味しない (DR3)
    verdict: rejected
    reason: "決め手は分析 (言語に依り、 印は組み立ての後も残る)。"
