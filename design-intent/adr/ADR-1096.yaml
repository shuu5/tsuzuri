    name: "席の退役の時に起草の置き場を即座に消す"
    text: |
      seat retire の周に、 その席の起草の置き場の中間生成物 (または置き場ごと) を消す。 決め手は裁定の範囲と分析。
      （平易）席を退役させた周に、 その席の起草の置き場の産物を即座に消す案です。 使い終えた席の分を時間を待たずに取り戻せ、 書きの判じが要らない点で勝ります。 けれども、 持ち主の承認は退役の時の即時の削除を含みません。 さらに退役は登録の記録を 1 件足すだけで、 同じ場所の席は起こし直されえます。 退役しないまま使われなくなった席の分も残り続けます。 退けました。
      利点: 使い終えた席の分を、 書きの時間を待たずに取り戻せる
      利点: 書きの判じが要らない
      欠点: 裁定は退役の時の即時の削除を承認していない (DR2)
      欠点: seat retire は登録の event を 1 件足すだけで、 同じ target の席は起こし直されうる (退役は置き場の終わりを意味しない)
      欠点: 退役しないまま使われなくなった席の分は残り続ける (DR1)
