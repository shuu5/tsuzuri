      利点: 席ごとの周期なので、 取り戻しが早い
      欠点: 大きい build の置き場の走査を 15 秒ごとの周期に載せ、 tick の予算を食う (DR7)
      欠点: 掃除の撃ち口と lock が 2 つになる (DR4・C17)
