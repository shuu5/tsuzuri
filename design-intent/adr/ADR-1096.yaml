  - id: "OPT3"
    name: "Claude Code の一時 dir を器が掃く"
    text: |
      写しの今の置き場 (session ごとの一時 dir) を器が探して掃く。 決め手は分析 (別の道具の内側の path で、 器は知らない)。
      （平易）写しの今の置き場 (session ごとの一時 dir) を器が探して掃く案です。 席の作法を変えずに、 今溜まっている場所をそのまま掃ける点で勝ります。 けれども、 その path は別の道具が決める内側の形で、 user 名と uid を含み、 器は環境変数も home も読みません。 道具の版で形が変わっても器は気付けず、 host の値を code か公開の file に持つことになります。 退けました。
      利点: 席の作法を変えずに、 今溜まっている場所をそのまま掃ける
      利点: 指示文に行を足さずに済む
      欠点: path は別の道具が決める内側の形で、 user 名と uid を含み、 器は環境変数も home も読まない (DR5・C2.2)
