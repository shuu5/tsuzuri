  器の案の章の要約: 候補を 9 つ並べます。 器が起草の置き場を持ち、 指示文の穴で場所を渡し、 同じ掃除が書きの線つきで写しを掃く案 (選んだ案) と、 選ばなかった 8 つです。 選ばなかった案は、 今のまま人が消す案・一時 dir を器が掃く案・退役の時に即座に消す案・席ごとの周期 (管理 tick) で掃く案・道具の印で組み立て中かを判じる案・写しごと消す案・場所を字で説明して穴を足さない案・2 つ目の掃除を足す案です。
  器の専門語の説明: 本文に出てくる専門語 6 個を、 やさしい言葉で説明します。
  ・起草の置き場（seat drafts area）: 席ごとに器が持つ、 試作のための repo の写しを置く dir (state dir の seat/<潰した target>/drafts/・本 ADR)。 器は dir を作らず、 席の指示文の 12 行目が絶対 path を渡し、 席の git が写しを作る。 器の掃除は写しの中の書きが止まった中間生成物だけを消し、 写しは消さない。
  ・起草の木（draft tree）: 起草の置き場の直下の子のうち .git (file か dir) を持つ dir (git の worktree か clone)。 掃除はこの木ごとに追跡を 1 回判じる。 .git を持たない子は木にせず、 消さずに数える (nogit)。
  ・書きの線（write cutoff）: 今から rules 行 seat.drafts_stale_h の時間を引いた時刻。 起草の木の列の名の dir は、 その dir 自身と下の全 entry の mtime の最新がこの線より前のときだけ消える。 線以後の entry が 1 つでも在れば残る。 便の木には掛けない。
  ・中間生成物（intermediates）: build や test や依存の取り込みが作る dir のうち、 器が対応する言語の決まった名を持つもの (target、 node_modules、 .venv、 __pycache__、 .mypy_cache、 .pytest_cache、 .ruff_cache、 .expo の閉じた 8 つ・ADR-1081)。 commit した木と toolchain と lock file から作り直せる。 本 ADR で、 起草の木の中の書きが止まったものも掃除の対象になる。
  ・席の指示文（seat brief）: 器が session の開始・clear・圧縮の後のたびに、 役割ごとの雛形と rules 行から生成して席へ渡す文 (FR1042・ADR-1022 §2.4)。 行は穴か出所 pointer を持つ行に限る。 本 ADR で 12 行になり、 12 行目が起草の置き場の path を穴で渡す。
  ・運転手の終端の周（driver terminal round）: 便を段から段へ運ぶ器の process (運転手) が、 pipe の run・resume・land・stop・retire の subcommand を終えて段を記帳した後の 1 周 (設計 dispatcher.md §5)。 時計では撃たれない。 掃除はこの周に 1 回撃つ。
