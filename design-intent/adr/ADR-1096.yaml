# 判断の記録 ADR-1096 — 器 scribe2 の判断の記録 ADR-0096 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1096
title: "席の起草の置き場は器が持ち、 書きが rules 行の時間無い中間生成物を運転手の終端の周の同じ掃除で消す — 置き場は state dir の席の置き場の子で、 席の指示文の 12 行目が新しい穴でその path を渡す。 消すのは置き場の git の木の閉じた 8 つの名の dir だけで、 木の写しと退役の即時の削除は射程の外 (ADR-1081 の射程と承認の読み・ADR-1045 §2 (3) の行の構成・ADR-1022 §2.4 の穴を部分 supersede)"
status: accepted
date: 2026-09-29
context: |
  器の掃除は、 便が終わった作業場所 (worktree) から作り直せる build と依存の置き場を消すが、 席 (人と AI が話す session) が試作のために作る repo の写しは見ない。 写しは別の道具の一時 dir に置かれ、 組み立ての産物が溜まって host の disk を満たした。 本 ADR は、 席ごとの起草の置き場を器の state dir の下に持ち、 席の指示文でその場所を渡し、 同じ掃除が同じ周・同じ lock で、 置き場の写しから書きが一定の時間無い build と依存の置き場だけを消すと決める。
  なぜこの判断が要るのかを 6 つから説明します。 掃除が便の作業場所だけを見る経緯・席の写しの産物が溜まって disk を満たした事象・一時 dir と席の置き場と書きの時刻の性質・憲法の向き (消す承認の範囲と、 作り直せる物の読み)・席の指示文の行と穴の決まり・この判断で動かす範囲です。
  CTX1 経緯 — 器の掃除は便の作業場所だけを見て、 席の作業場所は見ない
  ADR-1081 は、 運転手 (便を段から段へ運ぶ器の process) の終端の周ごとに、 live でないと測れた便の worktree から、 名が閉じた 8 つの列 (target、 node_modules、 .venv、 __pycache__、 .mypy_cache、 .pytest_cache、 .ruff_cache、 .expo) に在り追跡されている file を持たない dir を消すと決めた。 母集団は置き場の記録を持つ便の木だけで、 置き場ごとの lock の中で撃ち、 残すのは stderr の 1 行だけである。 席 (人と AI が話す session) が試作のために作る repo の写しは、 便の記録を持たないので母集団に入らない。 ADR-1081 は、 裁定 user 2026-09-28T04:46Z を「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」への A1 の常設の承認と読み、 その範囲の外を消さないこと (DR7) を決めた。
  CTX2 事象 — 席の起草の写しの build の置き場が溜まり、 disk を満たした
  席は起草の係 (subagent) ごとに repo の写しを作って試作を組み立て、 写しごとに build の置き場ができる。 写しの置き場は Claude Code の session ごとの一時 dir で、 器も人も消さない。 2026-09-29、 消費側の席で写しの build の置き場が溜まって host の disk を満たし、 持ち主の承認で手で消した (量は台帳の memo s2-07l.737.14 にだけ在る)。 組み立てを最初からやり直す費用は小さい (同じ memo)。 本 repo でも、 席が切った worktree が anchor の .worktrees の下に 19 本在り、 そのうち 1 本の target は 1.1 GB で、 最新の書きは 6 時間より前だった (2026-09-29 の実測)。 持ち主は、 席の起草の置き場（席の試作の置き場）の書きが 6 時間無い中間生成物（作り直せる産物）を器の掃除で消してよいと裁定した (裁定 user 2026-09-29T11:43Z・逐語は台帳)。
  CTX3 機序 — 一時 dir は別の道具の内側の形で、 器は席の置き場を既に持ち、 組み立て中の置き場は書きが続く
  Claude Code の一時 dir の path は、 別の道具が決める内側の形で、 user 名と uid を含む。 器は環境変数も home も読まない (C2.2) ので、 その path を知らない。 一方、 器は state dir の下に席ごとの置き場 (seat/<潰した target>/) を既に持ち、 圧縮の直前の 1 枠などを置いている (FR1042 の前例)。 席の退役 (seat retire) は event を 1 件足すだけで、 席の置き場を動かさない。 組み立てと依存の取り込みは、 走っている間は置き場の file と dir の mtime (最後に書いた時刻) を動かし続ける。 test の走行や読むだけの使用は mtime を動かさない。 cargo の lock file のような道具ごとの印は、 言語に依り、 組み立ての後も残る。 席の指示文（席への最初の案内）は session の開始・clear・圧縮の後のたびに器が注入する唯一の経路で、 雛形の穴を機械が測った値で埋める (FR1042)。
  CTX4 憲法の向き (本 ADR の解釈)
  A1 は「消す」という種類の操作の前に user の承認を要る。 本 ADR は、 裁定 user 2026-09-29T11:43Z を、 狭めた種類 — 閉じた列の名の dir を、 席の起草の置き場の git の木から、 書きが rules 行の時間無いものだけ、 運転手の終端の周（運転手の一区切りの後）ごとに消すこと — への A1 の常設の承認と読む。 同じ裁定は、 退役の時に即座に消すことと木の写しそのものを消すことを承認していないので、 本 ADR はそれを射程の外に置く。 N1 は器の管理する物を戻せない形で消すことを断れと言う。 本 ADR は ADR-1081 の読み (列の名の dir は慣行として作り直せる置き場で、 戻せない削除に当たらない) を同じ種類の物に広げるだけで、 慣行から外れて列の名で置かれた未追跡の物を失う代償も同じく引き受ける。 A4.2 は不可逆な操作の前に user に聞けと言う。 本 ADR は ADR-1081 と同じく、 消す物は作り直せる置き場なので不可逆に当たらないと読み、 そのうえで A1 の承認は裁定の RulingReceived の event に記録されている (周ごとの承認の event は要らない)。 C17.2 に沿い、 足す rules 行 1 本と走査の範囲が消すのは、 disk が満ちるたびに持ち主や席が撃つ写しの手の掃除 (OPT2) である。 C5 から、 書きの時間は rules 行の値で持ち、 裁定 id を持つ。 C17 から、 2 つ目の消す仕組みと 2 つ目の lock を足さず、 既存の掃除の関数に書きの線（消してよい古さの線）を 1 つ足す。 N2 と CON1002 から、 一時 dir の path や host の値を code と tracked な file に書かない。 CON1005 から、 削除の口 (subcommand) は足さない。 掃除は終端の周の副作用のまま。
  CTX5 指示文の枠 — 行の構成は ADR-1045、 穴は ADR-1022、 印と器の在処は ADR-1090
  ADR-1045 §2 (3) は orchestrator の SessionStart の注入を約 11 行以内とし、 席の同一性 3 行・憲法の効く部分 5 行・役割の特性 3 行に分けた。 SRS FR1042 は、 行の構成と行数の上限の正本を ADR-1045 に置く。 ADR-1022 §2.4 は、 雛形の穴を権能の行の値と席の識別子に限った (台帳の現在地の穴は ADR-1045 §2 (3) が足した)。 ADR-1090 は印を → 器の SSOT: にし、 指示文に器の repo の在処 (絶対 path) と器の名の字を書かないと決め、 自分の射程では穴の列 (5 つ) と行数 (11) を変えないとした。 雛形の穴は core の列と xtask の写しの 2 面に在り、 歯が穴の数 5 を pin し、 e2e が行数 11 を 10 か所で pin する。 雛形の pointer は、 rules 行を名指せば manifest にその行が在ることを、 ADR を名指せばその file が在ることを、 歯が要る。
  CTX6 射程 — 動かすのは 4 つだけ
  動かすのは (1) 掃除の母集団に席の起草の置き場の git の木を足すこと、 (2) 起草の木（置き場の git の写し）にだけ書きの線 (今から rules 行の時間を引いた時刻) を掛けること、 (3) 書きの時間の rules 行を 1 本足すこと、 (4) 席の指示文に 1 行と穴を 1 つ足すこと。 動かさないのは、 消す名の閉じた 8 つの列、 追跡の判じ、 lock の名と取り方、 撃つ周 (運転手の終端の周だけ・管理 tick と手動の 1 周は撃たない)、 便の母集団と生死の判定、 退役の move、 席の登録と退役、 印と pointer の分類、 前の 11 行の字、 rules 行 host_guard.git、 event の kind、 要件書。 設計 dispatcher.md §33 (契約表の行 ah) と seat-roles.md §31 (行 y) が実装する。 ADR を書く条件のうち 1 (N1 と A1 の読みを広げる) と 3 (state dir の下の新しい置き場の形) に当たる。
  （選択肢を測るものさし）この判断を評価する 7 本のものさしです。 disk を器が取り戻すこと。 承認が許した種類だけを消すこと。 組み立て中の置き場を消さないこと。 足すものを最小にすること。 host と道具に依らないこと。 席に場所が確かに届くこと。 重い走査を周期に載せないことです。
  DR1｜disk を器が取り戻す — 席の起草の写しの build の置き場も、 人の気付きと手に頼らない CTX2
  DR2｜承認の範囲に閉じる — 消すのは裁定が許した種類 (書きが時間無い中間生成物) だけで、 退役の即時の削除と木の写しは消さない (A1) CTX2・CTX4
  DR3｜作業中の組み立てを消さない — 書きが続いている置き場は残す CTX3
  DR4｜足すものを最小にする — 2 つ目の消す仕組みと lock を足さず、 rules 行は書きの時間の 1 本だけ (C5・C17) CTX1・CTX4
  DR5｜host と道具に依らない — 別の道具の内側の path に頼らず、 言語ごとの印を判じに使わない (N2・CON1002) CTX3・CTX4
  DR6｜席に場所が確かに届く — 席が置き場の path を自分で組み立てずに使える (FR1042) CTX3・CTX5
  DR7｜重い走査を周期に載せない — 写しの走査は既存の終端の周の 1 回に置き、 15 秒ごとの管理 tick には載せない CTX1・CTX3
decision: |
  選んだ案と、 それが要件書のどの要件を支えるかを示します。 起草の置き場は state dir の席の置き場の子で、 席の指示文の 12 行目がその path を渡し、 運転手の一区切りの後の掃除が、 置き場の git の写しから書きの止まった産物だけを消します。 支えるのは FR1042 (席の指示文)・FR1068 (便の自動起動の周)・FR1030 (配送構造) への主張で、 NFR1006 (host の資源) に理由を与え、 FR1056 (危ない command の拒否) を壊さないことを示します。
  採用 — OPT1
  器 SHALL 席ごとの起草の置き場を state dir の seat/<潰した target>/drafts/ に持つ (席の置き場の子・器は dir を作らず席の git が作る)。 席の指示文は役割の特性に 1 行を足して 12 行とし、 その行は新しい穴でその席の起草の置き場の絶対 path を受け、 起草の写しをそこに git の worktree か clone で置くことと、 器が消す物と消さない物を告げ、 出所 pointer は本 ADR と rules 行と設計 doc を指す (穴は 6 つ・値の時間は書かない)。 器 SHALL 運転手の終端の周の掃除 (ADR-1081 の 1 関数・同じ lock・便の木の後) で、 置き場の全部の席の起草の置き場の直下の子のうち .git を持つ dir を起草の木とし、 木ごとに git ls-files の 1 回で追跡を判じ、 名が閉じた 8 つの列に在り追跡されている file を持たない dir のうち、 その dir 自身と下の全 entry (symlink は辿らない) の mtime の最新が、 今から rules 行 seat.drafts_stale_h (値 6・単位は時間・裁定 user 2026-09-29T11:43Z) の時間を引いた線より前のものだけを消す。 線以後の entry を 1 つでも持つ dir と、 mtime か dir を読めない entry を持つ dir SHALL 残す (後者は失敗に数える)。 .git を持たない写し SHALL 消さずに数え、 木の写しそのもの・追跡されている file・.git SHALL NOT 消さない。 席の退役 SHALL NOT 起草の置き場を消す契機にしない。 行を読めない周 SHALL 起草の木を 1 本も撃たない (既定値に倒さない)。 掃除の stderr の 1 行は、 起草の置き場が在る周だけ末尾に drafts= (dir を消した起草の木の数か no-rule) と nogit= を足し、 起草の置き場が無い周の字と stdout・event・rc は変えない。 管理 tick と手動の 1 周は掃除を撃たない。 本 ADR は、 裁定 user 2026-09-29T11:43Z を、 この種類 — 閉じた列の名の dir を、 席の起草の置き場の git の木から、 書きが rules 行の時間無いものだけ、 終端の周ごとに消すこと — への憲法 A1 の常設の承認と読み、 ADR-1081 の N1 の読み (列の名の dir は慣行として作り直せる置き場) を同じ種類の物へ広げる。 実装は設計 dispatcher.md §33 (契約表の行 ah) と seat-roles.md §31 (行 y)。
  （平易）器は席ごとの起草の置き場を、 state dir の下の席の置き場の子 (drafts) に持ちます。 dir は器が作らず、 席の git が写しを作るときに作ります。 席の指示文には役割の特性の行を 1 本足して 12 行にし、 その行は新しい穴でその席の起草の置き場の場所 (絶対 path) を受け取り、 試作の写しをそこに git の worktree か clone で置くこと、 器が消す物と消さない物を告げます。 運転手の一区切りの後の掃除は、 便の作業場所を掃いた後に同じ鍵の中で、 全部の席の起草の置き場の直下の、 .git を持つ写しを 1 本ずつ見ます。 名の決まった 8 種の dir のうち、 追跡されている file を持たず、 その dir と下の全部の file と dir (symlink は辿りません) の最後に書いた時刻が、 今から設定の値 seat.drafts_stale_h (6 時間) を引いた時刻より前のものだけを消します。 新しい書きが 1 つでも在る dir と、 時刻を読めない物を持つ dir は残します。 .git を持たない写しは消さずに数え、 写しそのもの・追跡されている file・.git は消しません。 退役は消す契機にしません。 設定の値を読めないときは起草の置き場を掃きません。 掃除の 1 行には、 起草の置き場が在るときだけ、 産物の dir を 1 つ以上消した写しの数 (設定の値を読めない周は no-rule の語) と、 .git を持たない写しの数を足します。
  （理由）置き場を器の state dir の下に置くのは、 器が既に席ごとの置き場を持ち、 別の道具の一時 dir の path は器が知らない形で、 host の値を公開の file に書けないからです。 場所を穴で渡すのは、 席に席の名の潰し方と state dir の解き方を任せると、 誤ったときに写しが掃かれない場所へ散るからです。 掃除を新しく作らず今の関数に「書きの線」を 1 つ渡すのは、 消す仕組みと鍵を 2 つにしない (C17) ためで、 便の作業場所には線を掛けないので、 便の掃除は今と同じに動きます。 書きの時刻で判じるのは、 組み立てと依存の取り込みは走っている間ずっと置き場に書き続け、 その性質はどの言語の道具にも共通だからです。 道具の印は言語に依り、 組み立ての後も残ります。 時間を設定の値にするのは、 値の変更に持ち主の裁定を要らせるため (C5) です。 写しそのものと退役の時の即時の削除を行わないのは、 持ち主の承認 (裁定 user 2026-09-29T11:43Z) が書きの止まった中間生成物だけを許したからで、 写しには作り直せない試作が在りえます。 撃つのを運転手の一区切りの後に限るのは、 大きい置き場の走査を 15 秒ごとの周期に載せないためです。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1042（claim）: FR1042 (席の指示文の注入) は、 指示文を席の同一性・憲法の pointer・役割の特性・台帳の現在地の 4 群とし、 行の構成と行数の上限は ADR-1045 が正本だと述べる。 本 ADR は ADR-1045 §2 (3) を部分 supersede して役割の特性に 1 行を足して 12 行とし、 機械が解いた値 (起草の置き場の path) で新しい穴を埋めると主張する。 雛形の外に手書きの規範文を持たないことと、 C 条文を注入しないことは変えない。 FR1042 の字は land の後も ADR-1045 を指したまま残り、 12 行の正本は ADR-1045 から本 ADR へ supersede の鎖で辿る (FR1042 の字を直すのは持ち主の SRS の改訂の回)。
  FR1068（claim）: FR1068 (便の自動起動) は終端の段の周に列の 1 周を撃つ。 本 ADR は、 同じ周の同じ掃除の 1 手の母集団に席の起草の置き場の写しを足すだけで、 列・順序・契機は変えないと主張する (ADR-1081 と同じ位置・空きを作ってから次の便を起こす)。
  FR1030（claim）: FR1030 (配送構造) は便の起動と着地を席でなく器が行うと決める。 本 ADR は写しの掃除も席の手でなく器の運転手の周に置き、 席に掃除の手順を渡さない (席に渡すのは置き場の場所だけ) と主張する。
  NFR1006（rationale）: NFR1006 (host の資源) の目標は封じ込めの外で走る器の子 process 0 本と並列度で、 disk は数えない。 本 ADR は label の趣旨 (host の資源を守る) に disk の側から理由を与えるだけで、 目標の文は変えない。 足す仕事は運転手の process の中の git ls-files の子 (木ごとに 1 回・席の起草の木の本数だけ子が増える) と std の fs の読みと削除で、 land や retire が既に撃つ git と同じ種類の短い子である。
  FR1056（rationale）: 非退行の読み。 FR1056 (禁じる語列の command の拒否) は席と runner の Bash が撃つ禁じる語列を断る。 本 ADR は rules 行 host_guard.git の git clean -f を変えず、 掃除は git clean を撃たない。 席の手が消す対象を絞れない操作は、 今どおり断られる。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この記録が版の系譜のどこに在るかと、 判断が最後に行き着く原則です。 この記録は ADR-1081・ADR-1045・ADR-1022 を一部だけ置き換えます。 置き換えるのは、 掃除の対象を便の作業場所に限る範囲と承認の読みの範囲、 指示文の行の構成 (役割の特性 3 行・約 11 行)、 雛形の穴の範囲です。 消す名の列・鍵・撃つ周・印と参照の見分け方はそのまま保ちます。 行き着く原則は「器が人と AI の作業場所から承認の下で消してよいのは、 慣行として作り直せると名で分かる物のうち、 書く手が止まったと測れた物だけで、 作業場所そのものは消さない」です。
  改訂状態: current
  置き換える ADR: ADR-1081, ADR-1045, ADR-1022
  置き換えられた: なし (現行)
  部分 supersede。 ADR-1081 からは、 掃除の母集団を live でないと測れた便の木に限る射程 (決定の母集団・CTX5 の射程・DR7 の承認の読みの範囲) を、 席の起草の置き場の git の木へ書きの線つきで広げる。 消す名の閉じた列・追跡の判じ・lock・撃つ周・N1 の読み・git clean を撃たないこと・host_guard.git・便の木に書きの線を掛けないことは不変。 ADR-1045 からは §2 (3) の注入の行の構成 (役割の特性 3 行・約 11 行以内) を、 役割の特性 4 行・12 行に置き換える。 席の同一性 3 行・憲法の効く部分 5 行・C 条文を注入しないこと・runner に注入しないことは不変。 ADR-1022 からは §2.4 の「穴は権能の行の値と席の識別子」に、 席の起草の置き場の path を足す。 雛形の経路・行は穴か出所 pointer の行に限ること・xtask の検査の 3 項は不変。 ADR-1090 の決定 (印の字・参照を全部分類すること・指示文に器の repo の在処と器の名の字を書かないこと) は変えない。 足す穴の値は state dir の席の置き場で器の repo の在処ではなく、 tracked な雛形には穴の字だけが載る (anchor の穴と同じ形)。 ADR-1090 が不変とした穴の列と行数は ADR-1090 の射程の中の不変で、 本 ADR が動かす。
  照会終端 — PRIN-SWEEP-ONLY-WHAT-STOPPED-BEING-WRITTEN
  器が人と AI の作業場所から承認の下で消してよいのは、 慣行として作り直せると名で分かる物のうち、 書く手が止まったと測れた物だけで、 作業場所そのものは消さない。
  本 ADR が一時 dir を掃く案・退役の時に即座に消す案・道具の印で判じる案・写しごと消す案・2 つ目の掃除を足す案を退け、 器の置き場に写しを集めて書きの線つきで同じ掃除に掛けたのはこの原則に行き着く (これ以上は遡らない照会終端)。
options:
  - id: "OPT1"
    name: "器が state dir の下に起草の置き場を持ち、 指示文の穴で場所を渡し、 同じ掃除が書きの線つきで写しを掃く"
    text: |
      席ごとの起草の置き場を state dir の seat/<潰した target>/drafts/ に置き (器は dir を作らない)、 席の指示文の 12 行目がその絶対 path を新しい穴で渡す。 運転手の終端の周の掃除が、 便の木の後に同じ lock の中で、 置き場の直下の .git を持つ写しを木として、 閉じた 8 つの名で追跡されている file を持たず、 自身と下の全 entry の mtime の最新が rules 行の時間より前の dir だけを消す。 決め手は裁定 user 2026-09-29T11:43Z と分析 (同じ関数・同じ lock・値は 1 本)。
      （平易）器が state dir の下に席ごとの起草の置き場を持ち、 席の指示文の 12 行目がその場所を渡し、 運転手の一区切りの後の掃除が同じ鍵の中で、 置き場の git の写しから書きの止まった産物だけを消す案です。 消すのは名の決まった 8 種の dir のうち、 追跡されている file を持たず、 その dir と下の全部の file と dir の最後に書いた時刻が設定の時間 (6 時間) より前のものだけです。 1 つでも新しい書きが在れば残します。 写しの産物を人の手に頼らず取り戻し、 承認の範囲だけを消し、 組み立て中を消さず、 消す仕組みと鍵は 1 つのまま、 増える値は 1 本だけ、 道具と host に依らず、 席は場所を確かに受け取る点で勝ります。 代わりに、 読むだけの使用は書きに数えず、 判じと消しの間に始まった組み立ては落ちうり、 便を走らせない project の席は掃かれず、 指示文の行は門ではなく、 指示文が 12 行になります。 持ち主の裁定と分析で選びました。
      利点: 写しの build の置き場が、 終端の周ごとに器の手で取り戻される (DR1)
      利点: 消すのは裁定の種類 (書きが時間無い中間生成物) だけで、 木の写しと追跡されている file と .git を持たない写しは残る (DR2)
      利点: 書きの線以後の entry を 1 つでも持つ dir は残るので、 組み立て中の置き場は消えない (DR3)
      利点: 消す仕組みと lock は ADR-1081 の 1 つのままで、 足す値は書きの時間の rules 行 1 本だけ (DR4)
      利点: 置き場は器の state dir の下で、 mtime は言語と道具に依らない (DR5)
      利点: 席は指示文の穴で path を受け取り、 潰し方や state dir を自分で解かない (DR6)
      利点: 走査は既存の終端の周の 1 回に載り、 管理 tick の周期は変わらない (DR7)
      欠点: 読むだけの使用 (test の走行など) は書きに数えないので、 組み立てずに時間が過ぎた置き場も消え、 次の組み立てで作り直す (数分・正しさは変わらない)
      欠点: 書きの判じと消しの間に組み立てが始まる競合は排他でなく、 その組み立ては落ちうる (撃ち直せば戻る)
      欠点: 便を走らせない置き場 (終端の周が来ない project) の席の起草の置き場は掃かれない
      欠点: 指示文の 1 行は案内で、 席が一時 dir や anchor の下に写しを置くことは止めない
      欠点: 指示文が 12 行になり、 穴の列が 6 つになる (core と xtask の写しと行数の pin を同じ便で動かす)
    verdict: adopted
    reason: "決め手は裁定 user 2026-09-29T11:43Z と分析 (同じ関数・同じ lock・値は 1 本)。"
  - id: "OPT2"
    name: "今のまま — 満ちたら人が手で消す"
    text: |
      器には何も足さず、 disk が満ちたら持ち主か席が手で写しの build の置き場を消す。 決め手は実測 (消費側の席で disk が満ちた)。
      （平易）器には何も足さず、 disk が満ちたら持ち主か席が手で写しの産物を消す案です。 器に消す手を足さず、 何を消すかを人が毎回見て決められる点で勝ります。 けれども、 満ちるまで誰も気付かず、 消費側の席で実際に disk が満ちました。 手の掃除は文章にしか無い手順で、 満ちるたびに繰り返すことになります。 退けました。
      利点: 器に消す手を足さず、 承認の読みを広げる必要が無い
      利点: 何を消すかを人が毎回見て決められる
      欠点: 満ちるまで誰も気付かず、 消費側の席で disk が満ちた (DR1)
      欠点: 手の掃除は文章にしか無い手順で、 満ちるたびに繰り返す (DR1・N2)
