plain: |
  planner と admin の役割ごとの口座を、project ごとではなく host に 1 か所だけ宣言します。席を起こすときと起こし直すときはその口座を先に使い、使えないときだけ選定に落ちます。便（pipeline の 1 走行）は宣言の口座を候補から外し、残りの口座（退役中・使い切った・測れないものを除く）を使います。口座を移すときは宣言を書き換える 1 手で、各 project の管理 tick が次の周に席を移します。
