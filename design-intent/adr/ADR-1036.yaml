# 判断の記録 ADR-1036 — 器 scribe2 の判断の記録 ADR-0036 の写し（取り込みの段 2・判断の記録 ADR-39・係 w139a の mk_adr.py が器の HTML から組んだ）
id: ADR-1036
title: "役割ごとの口座は host の根の宣言 1 か所が持ち、 全 project の席の起動・立て直し・便の除外がそれを読む (planner / admin の口座を host で統一・逼迫時は宣言の書き換え 1 手で全席が移る・ADR-1026 §2.3 と ADR-1027 の除外を部分 supersede)"
status: accepted
date: 2026-09-16
context: |
  planner と admin の役割 → 口座の対応を、 project ごとの state dir でなく host の根の宣言 file 1 つに置く。 席の起動と立て直しはその口座を先に使い、 逼迫している周だけ選定に落ちる。 便用の選定はその口座を host 全体で候補から外す。 移し替えは宣言を書き換える口 1 つで、 各 project の管理 tick が次の周に席を移す。
  なぜこの判断が要るのかを、user の直命と現物から説明します。user は planner と admin の口座を全 project で揃えたいと述べました。いまは役割と口座の対応が project ごとの置き場に閉じ、host 全体で宣言する口も、逼迫したときに一括で移す口もありません。host には project をまたぐ置き場が既に 1 つ在ります。
  CTX1 user の直命 — planner と admin の口座を全 project で揃える
  2026-09-16 13:5xZ に user は別 project の対話面で、 planner と admin の口座をすべての project で同じ口座に揃えて運用したい、 余裕が無くなれば他の口座へ移す仕組みは在る、 揃えた方が管理しやすく残りの口座を pipeline に遠慮なく使える、 そのための器の仕組みが無いので必要である、 と直命した (逐語と口座名は台帳 s2-07l.418 が原本で本 file には写さない・CON1002・relay は別 project の planner)。 揃える理由は 2 つ = 管理のしやすさと、 席の口座を固定すれば残りの口座を便に全部使えること。
  CTX2 現物 — 役割 → 口座は project ごとの state dir に閉じ、 host 全体の宣言が無い
  口座の宣言は state dir の host の manifest (host.toml・ADR-1026 §2.1) に在り、 席の口座は seat launch の --account か session 用の選定 (ADR-1026 §2.3・FR1059) で決まって登録 row (FR1040) に写る。 state dir は project ごとに分かれうる (記録時点の実測 = scribe2 と ほかの project は同じ state dir、 folio2 は別の state dir) ので、 「planner はこの口座」という対応は project ごとに手で揃える運用になり、 host 全体で 1 か所に宣言する口が無い。 便用の選定の除外は便の repo (anchor) の登録 row の口座だけ (account-autonomy.md §14・行 k) で、 他 project の席の口座は候補に入る。
  CTX3 現物 — 逼迫時に全 project の席を一括で別口座へ移す口が無い
  席を別口座へ移すのは seat launch --account の手作業か、 管理 tick の立て直し（席を退避させて同じ窓に起こし直すこと） (FR1038・口座の窓が閾値以上の周に退避の合図 → session 用の選定で別口座) だけで、 「planner の口座を別の口座へ」を host の全 project に効かせる 1 手が無い。 hook 集合の食い違い (FR1062) は「退避の合図 → 同じ target に同じ口座で立て直し」の経路を既に持つ = 口座を変えて同じ経路を通せば移し替えになる。
  CTX4 host の根（同じ host の全 project が共有する置き場）には project をまたぐ置き場が既に在る
  受付の枠 (ADR-1021 §2.3・gate-cost.md §3.2) は state dir の親の下の host 用 dir (<親>/<NAME>-host/) を project 横断の置き場として使い、 env を読まずに state dir から導く。 役割 → 口座の宣言はこの根に置けば、 どの state dir から起動した器も同じ 1 file を読む。 C10.2 の「manifest」は ADR-1026 §2.1 が tracked の面と host の面の 2 面を合わせた 1 つの文法と読んだので、 host の根の file は host の面の host 横断の部分 (同じ reader・同じ拒否形) であって manifest の外の第 3 の置き場ではない。 憲法の向き = C10.2 (host 固有の値は manifest にだけ・宣言値と実効値を型で分ける C10)・C3 (状態は 1 つの DB・宣言は状態ではない)・C2.2 (env を読まない)・C9.2 (口座を窓の終わりまで使い切る)・N1 (不可逆な削除をしない)。
  （選択肢を測るものさし）判断を評価する 4 本のものさしです。対応は host に 1 か所だけ宣言すること、席の口座を固定した分だけ便が残りの口座を全部使うこと、逼迫したら宣言でなく選定に落ちて余裕が戻れば宣言へ戻ること、移し替えは宣言の書き換え 1 手で席は既存の経路で動くことです。
  DR1｜役割 → 口座の対応は host で 1 か所に宣言し、 全 project の席がそれを読む (project ごとに揃える手作業を無くす) user 直命 2026-09-16 13:5xZ (台帳 s2-07l.418) / 憲法 C10.2
  DR2｜席の口座を固定した分、 便用の選定は残りの口座を全部使う (席の口座は host 全体で便の候補から外す) user 直命「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」/ 憲法 C9.2 / ADR-1027 §2.1
  DR3｜逼迫したら宣言でなく選定に落ちる (余裕が無い口座で席を起こさない)。 余裕が戻れば宣言へ戻る user 直命「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」/ SRS FR1038 / ADR-1020 §2.4
  DR4｜移し替えは宣言の書き換え 1 手で、 席を動かすのは各 project の管理 tick の既存の経路 (常駐 process を持たない・宣言値と実効値を分ける) 憲法 C10 / C3 / SRS FR1062 (同じ経路) / ADR-1034 (契機は tick・常駐しない)
decision: |
  選んだ案と、それが要件書のどの要件を支えるかを示します。host の根の宣言 file を席の起動・起こし直し・便の候補の除外・管理 tick が読みます。宣言の口座が使える周はそれを使い、使えない周だけ選定に落ちます。移し替えは宣言を書き換える口 1 つで、席は各 project の tick が動かします。
  採用 — OPT1
  器 SHALL host の根 (<state_dir の親>/<NAME>-host/・受付の枠と同じ置き場・env を読まない) に役割 → 口座の宣言 file roles.toml を 1 つ持ち (schema = 1・行 = role と account の 2 項目・役割ごとに高々 1 行・manifest の host の面の一部として host.toml と同じ reader と同じ拒否形で読み・無ければ 0 行として続き・在るのに読めなければ typed に止め・state dir の host.toml に同じ表が在れば未知の表として断る = 宣言は host に 1 か所)、 seat launch と立て直し SHALL その役割の宣言が在り口座が使える (host の面に宣言済み・退役でない・最新の実測が在り・session 用の閾値未満) 周は選定の純関数を撃たずにその口座で起こし、 使えない周だけ session 用の選定に落ちて理由を閉じた型で記帳し、 --account が宣言と違う周は typed に断る。 便用の選定 SHALL 宣言の口座を host 全体で候補から外す (便の repo の登録 row の除外に加える)。 管理 tick SHALL 登録 row の口座が宣言と違い ∧ 宣言の口座が使える席に、 退避の合図と同じ除外 (退避物が在る周・cycle が走っている周は注入しない) の下で、 hook 集合の食い違いと同じ経路 (退避の合図 → 同じ target に宣言の口座で立て直し) で席を移す。 器 SHALL 宣言の書き換えを口 1 つ (account reassign) で行い (読み → 検査 → 一時 file → rename・宣言済みで退役でない label だけ)、 常駐 process を持たず、 各 project の tick が次の周に席を移す。 宣言の書き換え SHALL NOT A1 の承認を要する (消す・出す・使うのどれでもなく、 口座の消費は席の起動と同じ・裁定は台帳)。 doctor SHALL 宣言の有無と役割ごとの口座を 1 行で出す (読むだけ・判定しない)。 宣言 SHALL 宣言値（人が書いた値 (まだ確かめていない)）であり、 登録 row の口座が実効値である (C10)。 本 ADR は ADR-1026 §2.3 の「口座は --account か選定の純関数」を宣言が先に来て --account はそれと一致する周だけ通る形に、 ADR-1027 §2.1 と account-autonomy.md §14 の便用の除外を「便の repo の登録 row + host の根の宣言の口座」に部分 supersede し、 選定の純関数・R-C9-1・登録 row の鍵・退役の口は変えない。
  （平易）役割ごとの口座は host の根の宣言 file 1 つが持ち、同じ表を project の設定 file に書くと断られます。席を起こすとき・起こし直すときは、宣言の口座が使える（宣言済み・退役していない・残量が測れていて・閾値未満）ならそれを使い、使えなければ選定に落ちて理由を記録します。宣言の書き換えは承認の要る操作ではなく、doctor が宣言の有無と役割ごとの口座を 1 行で示します。宣言と違う口座の指定は断られます。便は宣言の口座を host 全体で候補から外します。管理 tick は宣言と違う口座で走っている席を、宣言の口座に余裕があれば既存の経路で移します。宣言の書き換えは器の口 1 つで、常駐する process は持ちません。
  （理由）user は口座の対応を全 project で揃え、席の口座を固定した分だけ残りの口座を便に使い切りたいと述べました。対応を project ごとに写すと食い違いが生まれるので、host に 1 か所だけ置き、そこを席の起動・起こし直し・便の除外の全部が読みます。逼迫した口座で席を起こさないために、余裕が無い周は従来の選定に落とします。席を移す経路は hook の食い違いで既に在る「退避 → 同じ窓に起こし直し」を再利用し、常駐 process を増やしません。
  この判断が正当化する要件 (cross-doc 照会 → SRS-SCRIBE2-MVP)
  FR1036（claim）: 便用の除外集合に host の根の宣言の口座が加わる。 FR1036 の「便用は席の登録 row を持つ口座を除く」の句は user の /folio-architect の周で「持ち主の言葉（器の台帳の notes に在る・この file に写さない）」に改める (ADR-1034 / ADR-1035 と同じ前例)。
  FR1059（claim）: 席の起動の口座の決め方に「役割の宣言」が先頭に加わり、 --account はそれと一致する周だけ通る。 FR1059 の「口座を引数か session 用の口座選定で決め」の句の改訂も同じ周。
  FR1038（claim）: 立て直しの口座は宣言が使える周は宣言、 逼迫の周は従来どおり FR1036 の session 用の選定 = 「余裕が無くなったら他の口座に移す」の器の形。 FR1038 の「FR1036 で選んだ別の口座で session を立て直して」の句は「役割の口座 (使える周) か FR1036 で選んだ別の口座で」に改める (同じ周)。
  FR1040（claim）: 登録 row の口座 label は宣言から導いた実効値 (C10) として書き、 鍵 (役割, anchor) と row の書き手 3 つは不変。
  照会先: SRS-SCRIBE2-MVP — SRS: 設計 → 契約 → 実装 → 検証 → land を、 人の手を借りずに 1 本通す器（MVP）
  （版の系譜と原則）この ADR が版の系譜のどこに在るかと、判断が最後に行き着く原則です。ADR-1026 の「席の口座は選定で決める」と ADR-1027 の「便は席の登録 row の口座を外す」を、宣言が先に来る形に部分的に置き換えます。選定の純関数や登録 row の鍵はそのままです。
  改訂状態: current
  置き換える ADR: なし (新規)
  置き換えられた: なし (現行)
  本 ADR は現行。 ADR-1026 §2.3 の「口座は --account (有効な口座でなければ断る) か選定の純関数」を「役割の宣言が在り使える周はそれ (--account は一致する周だけ通る)・無い周は --account か選定」の形に、 ADR-1027 §2.1 の便用の候補 (席の登録 row の口座を外す) を「登録 row + host の根の宣言の口座を外す」形に、 それぞれ部分 supersede する。 選定の純関数 (ADR-1020 §2.2 / ADR-1027 §2.2 の順序)・R-C9-1・登録 row の鍵と書き手 (ADR-1022 §2.1 / ADR-1026 §2.3)・口座の口 4 つ (ADR-1026 §2.2)・退役の可逆 move は現行のまま。 SRS FR1036 / FR1038 / FR1059 の句は user の /folio-architect の周で改訂する。
  照会終端 — PRIN-DECLARE-ONCE-PER-HOST
  host 全体に効く対応 (役割 → 口座) は host に 1 か所だけ宣言し、 project の席はそれを読んで実効値を記録する。 同じ対応を project ごとに写さない。
  本 ADR の判断はこの原則に行き着く (これ以上は遡らない照会終端)。
options:
  - id: "OPT1"
    name: "host の根の宣言 file 1 つ (役割 → 口座) を席の起動・立て直し・便の除外・管理 tick が読む"
    text: |
      <親>/<NAME>-host/ に役割 → 口座の宣言 file を 1 つ置く (role と account の 2 項目の行・役割ごとに高々 1 行・host.toml と同じ reader と拒否形・無ければ 0 行・読めなければ止める)。 seat launch と立て直しは、 その役割の宣言が在り口座が使える (宣言済み・退役でない・測れていて session 用の閾値未満) 周はその口座を使い、 使えない周だけ session 用の選定に落ちて理由を記帳する。 --account が宣言と違う周は typed に断る。 便用の選定は宣言の口座を host 全体で候補から外す (便の repo の登録 row の除外に加えて)。 管理 tick は「登録 row の口座 ≠ 宣言 ∧ 宣言の口座が使える」席に FR1062 と同じ経路 (退避の合図 → 同じ target に宣言の口座で立て直し) で移す。 宣言の書き換えは器の口 1 つ (account reassign) で、 読み → 検査 → 一時 file → rename。
      （平易）host に 1 つだけ「この役割はこの口座」という宣言 file を置きます。席を起こすとき・起こし直すときは、その口座に余裕があればそれを使い、余裕が無ければ従来どおり選定で別の口座を選びます。便はその口座を host 全体で候補から外します。宣言と違う口座で席を起こそうとすると断られます。口座を移すときは宣言を書き換える 1 手で、各 project の管理 tick が次の周に「退避 → 同じ窓に新しい口座で起こし直し」の既存の経路で席を移します。
      利点: 宣言が 1 か所で、 全 project の席と便が同じ 1 file を読む (project ごとの手作業と食い違いが消える)
      利点: 席の口座が固定されるので便用の候補が「宣言の口座以外の全部」に広がり、 並列が口座の窓で痩せない
      利点: 移し替えが宣言の書き換え 1 手で、 席を動かす経路は既存の立て直し (FR1062 の型) を再利用する
      欠点: host の根に読む file が 1 つ増え、 その reader と拒否形・doctor の行・歯が契約に載る
      欠点: 宣言の口座が逼迫して選定に落ちた席は、 余裕が戻る周にもう 1 回退避と立て直しを通って宣言へ戻る (cycle が 1 回増える)
      欠点: SRS FR1036 / FR1038 / FR1059 の文面 (席の登録 row の除外・口座の決め方・立て直しの口座) の改訂が user の /folio-architect の周に要る
    verdict: adopted
    reason: "<親>/<NAME>-host/ に役割 → 口座の宣言 file を 1 つ置く (role と account の 2 項目の行・役割ごとに高々 1 行・host.toml と同じ reader と拒否形・無ければ 0 行・読めなければ止める)。 seat launch と立て直しは、 その役割の宣言が在り口座が使える (宣言済み・退役でない・測れていて session 用の閾値未満) 周はその口座を使い、 使えない周だけ session 用の選定に落ちて理由を記帳する。 --account が宣言と違う周は typed に断る。 便用の選定は宣言の口座を host 全体で候補から外す (便の repo の登録 row の除外に加えて)。 管理 tick は「登録 row の口座 ≠ 宣言 ∧ 宣言の口座が使える」席に FR1062 と同じ経路 (退避の合図 → 同じ target に宣言の口座で立て直し) で移す。 宣言の書き換えは器の口 1 つ (account reassign) で、 読み → 検査 → 一時 file → rename。"
  - id: "OPT2"
    name: "各 project の state dir の host.toml に同じ役割 → 口座の行を置く"
    text: |
      host.toml の文法に役割 → 口座の行を足し、 project ごとに同じ内容を書く。
      （平易）各 project の設定 file に同じ行を書く案です。新しい置き場は要りませんが、project ごとに同じ行を写す手作業と食い違いが残り、user の言う「1 か所」になりません。
      利点: 新しい置き場を持たない (host.toml の reader だけが変わる)
      欠点: 「1 か所」にならない = project ごとに同じ行を写す手作業と食い違いが残る (user の直命の逆)
      欠点: 便用の除外を host 全体で揃えるには、 結局どこか 1 か所を読む必要がある
    verdict: rejected
    reason: "host.toml の文法に役割 → 口座の行を足し、 project ごとに同じ内容を書く。"
  - id: "OPT3"
    name: "tracked の rules manifest の役割の行 (role.planner / role.admin) に口座 label を持たせる"
    text: |
      権能を持つ rules 行に口座 label の欄を足し、 repo の manifest が役割 → 口座を持つ。
      （平易）repo に入っている規則の表に口座を持たせる案です。読み手は 1 本で済みますが、口座の名前は host ごとに違う値で、公開されている repo に置くべきものではありません。
      利点: 読み手が rules 行の 1 本で済む
      欠点: 口座 label は host 固有の値で、 tracked の manifest に置くのは憲法 C10.2 に反する (ADR-1026 §2.1 が host の面へ外した向きの逆)
      欠点: repo は公開面なので口座の対応を増やす変更は A1 の対象になり、 host ごとに違う値を 1 つの tracked file に持てない (N3)
    verdict: rejected
    reason: "権能を持つ rules 行に口座 label の欄を足し、 repo の manifest が役割 → 口座を持つ。"
  - id: "OPT4"
    name: "seat launch --account と席の登録 row の手作業のまま (現行)"
    text: |
      器は変えず、 planner が project ごとに --account で揃え、 移し替えは席ごとに手で起こし直す。
      （平易）いまの形です。器を変えずに済みますが、揃える規則が手作業に残り、project が増えるたびに食い違います。他 project の席の口座が便に使われて席が逼迫することも続きます。
      利点: 器の変更が無い
      欠点: 揃える規則が散文と手作業に残り (N2)、 project が増えるたびに食い違う
      欠点: 便用の除外が便の repo の席だけで、 他 project の席の口座が便に使われて席が逼迫する
    verdict: rejected
    reason: "器は変えず、 planner が project ごとに --account で揃え、 移し替えは席ごとに手で起こし直す。"
  - id: "OPT5"
    name: "host 常駐の process が全 project の席を監視して移す"
    text: |
      host に 1 つ常駐する process を置き、 宣言の変更を検知して各席を止めて起こし直す。
      （平易）host に常駐して席を監視し移す process を置く案です。移し替えは即時ですが、常駐 process を持たない方針と食い違い、席を止める経路が退避を通らず作業記憶を失います。
      利点: 移し替えが即時で、 project ごとの tick を待たない
      欠点: 常駐 process を持たない向き (ADR-1034 の契機は tick と land・ADR-1030 の tick 単位) と食い違い、 監視の 2 本目になる
      欠点: 席を動かす手が tick の外にもう 1 本増え、 退避の合図の除外 (FR1029) と立て直しの 3 条件を 2 か所で持つことになる
    verdict: rejected
    reason: "host に 1 つ常駐する process を置き、 宣言の変更を検知して各席を止めて起こし直す。"
