# 語彙 — 正本（folio init の雛形・語は利用者が足す）
terms:
  - {id: vessel, term: 器, en: vessel, short: 便を起こし席を立てて記録を残す仕組み（scribe2 の本体）, def: 便（1 回の作業）を起こし、席（AI の作業席）を立て、記録（record）と台帳を持つ仕組み。v3 では folio（設計の正本と床）と合流する。}
  - {id: surface, term: 面, en: surface, short: 人か席が見て操作する画面の層, def: 器が配る画面の層。v3 では裁定面と表示面の 2 つを 1 つの表示 server と契約 1 本で持つ。}
  - {id: ruling-surface, term: 裁定面, en: ruling surface, short: 台帳を見せて持ち主の裁定を受け取る画面, def: 台帳の便の一覧と中身を持ち主に見せ、裁定の逐語を受け取って裁定 id を機械が発行し台帳へ記帳する画面。}
  - {id: stage-surface, term: 表示面, en: stage surface, short: 席が命令で制御する menu の無い browser の画面, def: 席が命令（この URL を出せ・viewport をこう・reload）を送り、持ち主の browser がそのとおりに描く画面。app ごとに表示の仕組みを作らず器が 1 つだけ持つ。}
  - {id: contract, term: 契約, en: contract, short: server と client の間で守る決まりの型, def: 表示 server と client の間の口（URL・要求と応答の JSON の形・event の形）を 1 か所に書いた型付きの決まり。client を作り分けても契約は 1 本のまま。}
  - {id: bakeoff, term: 比較試作, en: bake-off, short: 同じ画面を複数の技術で作って測り比べる小さな試し, def: server と契約を固定し、同じ 2 画面を複数の client の技術で作り分けて、決めた物差しで測り比べる試し。結果は設計ノートに数値で残し、試作そのものは採用しない。}
  - {id: display-server, term: 表示 server, en: display server, short: 面を配り命令を中継する 1 つの server, def: 面の file を配り、台帳の読み書きと表示面への命令の中継を行う 1 つの server。持ち主の browser と席の headless の目の 2 種の client が繋がる。}
  - {id: consult-window, term: 相談の窓, en: consult window, short: orchestrator の文脈を汚さないために分けた、自由な調べと検証の場, def: 持ち主か席が開く別の窓（持ち主が直に話す窓と席が問う話さない窓）。1 つの議題に限らず、窓ごとの作業場の囲いの中で実験と web の調べができる。repo と台帳は書かず、結果を型付きの所見と添え物で席に渡し、席が採るかと保存するかを選ぶ。承認は受けない。}
  - {id: thinking-effort, term: 念入りさ, en: effort, short: AI が 1 つの応答にかける考えの深さの設定, def: 席を起こすときに model と一緒に選ぶ設定。深いほど時間と口座の消費が増える。席ごとの値は要件書の制約が名指す。}
  - {id: design-note, term: 設計ノート, en: design note, short: memo と発話を契約へ移す中間の文書, def: 便 1 本ずつの約束（契約表の行）と、まだ約束になっていない計画だけの行を書く YAML の文書。中身を要件・判断の記録・ほかの設計ノートへ移したとき、または全部の契約表の行が着地したとき、後継を名指して廃止の状態にし、置き場の直下に残す（条 P-28）。}
  - {id: live-note, term: 生きた設計ノート, en: live design note, short: 状態が下書きか発効の設計ノート, def: 状態が下書き（draft）か発効（effective）の設計ノート。廃止（retired）と見本（example）は数えない。本数とノートごとの行の数と計画だけの行の合計に、規則の表の行で上限を置く（条 P-28）。}
  - {id: note-retired, term: 廃止, en: retired, short: 文書を消さずに状態でやめた印を付けること, def: 設計ノートや判断の記録の状態の 1 つ。後継を名指し、置き場の直下に消さずに残す。状態を戻せば戻るので、条 N-1.2 の可逆な移動に当たる（条 P-3.2）。}
  - {id: display-mode, term: 表示の型, en: mode, short: 初心者と経験者の 2 つの見せ方, def: board の見せ方の 2 つ。初心者は説明の注釈と非エンジニア向けの概要を、経験者は経験者向けの 1 行とエンジニア向けの概要を出す。選んだ型は URL とその browser に残す。}
  - {id: two-summaries, term: 2 つの概要, en: summaries, short: 非エンジニア向けとエンジニア向けの 2 つの説明, def: 節点ごとの 2 つの説明。設計文書は plain の欄、台帳は bead の本文の定型行か見出しの下の字に置き、面は表示の型の 1 つを写す。}
  - {id: short-title, term: 短い題, en: short title, short: 一覧と札と待つ相手の欄に出す、字数に上限のある題, def: bead ごとに台帳の付帯の欄（metadata）の鍵（short）に置く題。席は起票の時に書き、無ければ面が題から機械で作る。上限の字数を越えれば切って「…」を付ける。}
  - {id: seat-state, term: 席の状態, en: seat state, short: 席が動いているか止まっているか・何を待っているか・健やかか, def: 席が動いているか止まっているか、何を待っているか、健やかかの 3 つだけを指す。器の席の状態の型（SeatState）の値と、席の打刻の file（tick と heartbeat）と、台帳の決まった形の行（裁定の行と配達の印の行）が持つ値で、席の出力の字や画面の描画は含まない。条 P-20 の 5 つ目の規範文が使う。}
  - {id: held, term: 留め置き, en: held, short: 依存でない理由で人の手が入るまで器が起こさない契約の状態, def: board の段の 1 つ（Held）。依存の相手は済んだが、席が理由を付けて器の止めの印で止めたか、器の受付が断った契約で、人の手（席が印を外すか、契約か設計の行を直すか）が入るまで器が起こさない。Blocked と同じ列に印で分けて出す（判断の記録 ADR-42）。}
