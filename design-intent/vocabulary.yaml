  - {group: 憲法と規則の表の本文に出る識別子, words: [token, run, guard, lint, anchor, macro, derive, shell, expect, unsafe, must-use, CI, allow, source, module, YAML, database, TSV, dir, cache, profile, sonnet, opus, manifest, variant, enum, unwrap, panic, todo, unimplemented, unreachable, process, exit, slice, dbg, stdout, stderr, print, clippy, forbid, nextest, insta, mutants, snapshot, KNOWN-RED, fixture, PreToolUse, SessionStart, brief, Budget, Precheck, Declared, Measured, Derived, Effective, tmux, capture, env, loopback, bind, serve, agent, lens, skill, self-host, async, library, deny, detect, in-loop, post, fail-closed, fail-open, write-set, next, doctor, derive, inject, check, ceiling, gate, event, status, kind, live, id, ADR, PR, main, git, RESEARCH-ponytail, base, HEAD, KB, MB, p50, link, e2e, user, relay, orchestrator, planner, runner, consult, seat, host, label, anchors, accounts, state, plugin, launch, arg, group, marker, declaration, template, symlink, commit, squash, trailer, rc, Invocation, spawn, Outcome, SeatState, Completion, migrate, watchdog, lane, K1, K2, K3, Verdict, tokio, std, thread, channel, hyperfine, proc-macro, feature, full, profile, debug, line-tables-only, dev, release, target, wasm32, csr, Trunk, dist, index, html, js, css, png, svg, jsonl, toml, yaml, md, sha256, RFC, EARS, SHALL, MUST, SHOULD, IF, THEN, WHEN, WHERE, WHILE, delta, ins, del, data-delta-id, docs, design, spec, srs, adr, research, decisions, vocabulary, rules, constitution, ceiling, graph, intake, index, north, star], why: 憲法の規範文・平易文・機構の注・規則の表の内容欄に出る code の語と道具の名（前の版の 2 憲法から持ち込んだ語を含む）}
  - {group: 技術の名, words: [Rust, TypeScript, JavaScript, HTML, CSS, JSON, wasm, Leptos, Dioxus, Yew, Svelte, React, Vite, cargo, npm, trunk, node, podman, serde, SSE, iframe, URL, viewport, reload, DPR, UA, browser, headless, menu, server, client, spike, scribe2, scribe3, folio2, toolchain, build, event, record, app, hook, SDK, GUI, CLI, tailnet, localhost, API, Claude, Code, code, compile, compiler, design, framework, harness, host, merge, review, risk, s3, scribe, SPA, v3, workspace, bakeoff-surface, contract, md, csr, install, clean, crate, test, core, deny, DOM, runner, unmaintained, Leptos, cargo, boundary, scribe-boundary, host-init, M3, xtask, init, doctor, v1.0, v0.1, CDP, Chrome, ssh, tunnel, mode, ThinkPad, Firefox, OpenSSH, Windows, WebSocket, IME, native, console, scroll, navigate, screenshot, PC, v0.4, host, click, local, remote, tsuzuri, tz, t3, tsuzuri-constitution, prefix, PATH, GitHub, chancery, projects, tick, unit, docroot, publish, crates], why: 判断の記録と設計ノートの本文に出る製品名・言語名・code の語}
