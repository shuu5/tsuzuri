    type: prose
    title: 行 t-ruling-one — board の答えの口と束の口が器の答えの口を撃ち、取り消しの口と番号の決めと配達の読みが器の行も読む（memo t3-hub.92.6・作り直し v4 の段 S9・設計だけの行）
    body: |
      done と verify の対応。1 つ目から 11 項目は verify の 2 行目（新しい歯の file rone の歯）が測る。12 項目から 14 項目は verify の 3 行目（直す歯の file rsid.rs）、15 項目から 18 項目は verify の 4 行目から 7 行目、19 項目から 23 項目は verify の 8 行目（直す歯の file server_ask.rs）、24 項目から 30 項目は verify の 9 行目から 15 行目、31 項目は verify の 16 行目（ruling.rs の mod tests の lib の歯）が測る。1 行目の clippy は done に載せない守り。xtask の check は共通 verify が撃つので行の verify に書かない。depends は v-ruling-batch（この行の code が器の --batch と 6 欄の行に依る・並べられない）。

      直し（係 w360a・契約の審査の FAIL の所見）。直す歯の列を main ffc52b6e の木で数え直し、所見が名指した歯（rsid.rs の batch::accept と ruling::line の歯・server_ask.rs の 5 本の歯・ruling.rs の mod tests）を全部この節の直す歯の表に入れ、歯ごとの期待値の字を書いた。質の所見で struct Answer を消し（器の program と置き場は accept の組 Vessel の 1 つの引数）、ItemOutcome の縮めは面の client の crate に及ぶので範囲の外に置いた（訳は範囲の外の段）。HTTP の歯の aown.rs は答えを受付の前の照らしで断る周だけを撃つので直さない（= の項）。

      在りか（main の ffc52b6e の字）。差の file は無い（設計だけの行・決め D2）。board の答えの口は crates/tsuzuri-boundary/src/server/ruling.rs の fn accept（161-207 行・next_id で id を発行し bdw で notes に定型行を足して close）、束の口は server/batch.rs の fn accept（71-131 行）と fn write_rows（161-197 行）と fn line（217-222 行）。応答の組みは server/routes/ruling.rs の post_ruling と server/routes/batch.rs の post_batch。書きの持ち物は server/mod.rs の fn writer_of（351-366 行）と struct Shared（162 行から）。子の撃ちは server/proc.rs の fn run（107 行から・標準入力は空）。取り消しの読みは crates/tsuzuri-contract/src/surface.rs の fn ruling_lines と latest_ruling と pending_reopen と revocable（245-299 行）。配達の読みは crates/tsuzuri-core/src/delivery.rs の fn gui_line（77 行から）と fn said（221 行から）。

      なぜ。席の決め（memo t3-hub.92.6 の notes 2026-10-06T11:04Z）で、裁定の書き手を器の答えの口の 1 本に寄せる。器の形は発話の分から id を作り、発話 event と裁定 event を書き、器の doctor と局面の出力が読む。今は台帳に器の形と board の形の 2 通りが並ぶ。決定はしご。既に在るか: 器の答えの口は board のための gui の口として在り、旗 --batch を受ける（前の行 v-ruling-batch・main ffc52b6e で着地済み）。配達の読みは器の gui の行を既に読む（行 t-ruling-gui）。board は受付の前の照らし（空の逐語・開いた問い・版・A-1・重なり）と配達と印と取り消しと方針をそのまま持ち、書きだけを器の口に替える。新しい口と無効化の旗は足さない（条 N-3.1）。

      取り消しの口（席の決まり D-8・黙って削らない）。器に取り消しの口は無い（seat/ruling.rs の口は bind と answer と ls だけ）。勧めの案は board の POST /api/revoke を残し、器の行も読める形にする。今のまま器の行を読まないと、器が書いた裁定は latest_ruling が拾わず取り消しが全部 StaleVersion で断られ、口が黙って死ぬ。消す案は使われた数 0 の口と歯の file rvk.rs（1201 行）を消せるが、持ち主が答えを取り消す道が無くなるので後ろに置く。取り消しの id の重なり: 器の id は発話の分と番号 1 なので、board の next_id が notes の定型行だけで数えると同じ分の器の行と同じ id を出す。next_id は器の行の id も数える。答え直しの id の重なりは前の行 v-ruling-batch の番号の決めが避ける。

      形（server/ruling.rs）。
      - fn answer_argv（置き場の path と repo の path と問い id と束の id の Option を受け、器の答えの口の 3 語 seat と ruling と answer に --repo <repo> --state-dir <置き場> --question <問い> を続けた 9 語に、束が在れば末に --batch <束> の 2 語を足した列を返す・program の名は含めない）を足す。新しい struct は足さない（器の program と置き場は、型の別名 pub type Vessel<'a> = (&'a OsStr, Option<&'a Path>) の組 1 つの引数で accept に渡す・質の所見の struct Answer の縮め）。
      - fn accept の引数を（要求・台帳の出所・Writer・器の program と置き場の組 Vessel・受付の時刻）の 5 つにする（6 つにすると clippy の too_many_arguments〔閾値 5・deny・allow と expect の例外は禁止〕で verify の 1 行目が落ちる・便 t3-hub.92.6.4-20261006T150504Z の実装役の問いの答え）。受付の前の照らし（空の逐語・読み直し・開いた問い・版）は今のまま。置き場が None なら Outcome::NoStateDir（503 の字 ruling-state-dir・何も撃たない・照らしの断りの後に判じるので 404 と 409 の歯は替わらない）。在れば器の program を answer_argv の列で、cwd を repo、標準入力を逐語の byte、上限を WRITE_TIMEOUT で 1 回撃つ。rc 0 なら stdout の前後の空白を除いた字を、答えた問いの id と字 : と分の字（14 字の YYYYMMDDTHHMMZ の形・数字 8 字と T と数字 4 字と Z）と字 - と 1 字以上の数字を繋いだ形かで照らし、その形の時だけ RulingId にし、形でないか RulingId になれなければ Outcome::IdShape（500 の字 ruling-id-shape）。RulingId::new の id_shape は字 not-an-id も受けるので、形の照らしは id_shape に頼らずこの関数の中で撃つ（契約の審査の goal-done-contradiction の所見の直し）。rc 0 でなければ Outcome::AnswerFailed（502 の字 ruling-answer）にし、標準エラーに 1 行（tz surface serve と器の答えの口が落ちた事と問い id と proc の Failed の word の字・逐語は書かない）を書く。配達の thread の起こしと Recorded の応答は今のまま（裁定 id は器の返した字）。
      - 消す物: fn line（572-577 行）と Outcome の AppendFailed と CloseFailed。fn accept の中の LedgerWrite の AppendNotes と CloseItem の組みと字『reason(&id, None)』の呼び（ruling.rs の字『reason(&id,』は reopen の 1 か所だけ残る）。module の doc の受付の順の 4 と 5 を器の答えの口の撃ちに直す。
      - 残す物: fn next_id（取り消しの行の id・定型行の id に加えて、notes の行ごとに tsuzuri-core の graph::build の bind_line が問いの id で Some を返す行の id も取られた id に数える）、fn escape と revoke_line と reason と policy_reason（取り消しと方針が使う）、LINE_PREFIX、Writer と bdw（印と取り消しと方針の書き）。
      形（server/proc.rs）。fn run の撃ちを標準入力の byte を受ける共通の形に割り、pub fn run_input（program・引数・cwd・標準入力の byte・上限）を足す。標準入力は pipe にし、別の thread で書き切って閉じる。fn run は空の標準入力の今の振る舞いのまま。
      形（server/batch.rs）。fn accept の引数を ruling::accept と同じ 5 つ（組 Vessel を含む）にし、置き場が None なら Outcome::NoStateDir（503 の字 ruling-state-dir）。束の id は今の next_batch_id で発行し、next_batch_id は台帳の字が今の字（BATCH_PREFIX と id と ID_END・見本 『束 = batch:20260928T0441Z-1・』）を持つ時に加えて、縦線の欄の形（前後の空白 1 つずつで囲んだ縦線・id・前後の空白 1 つずつで囲んだ縦線・見本 『 | batch:20260928T0441Z-1 | 』）を持つ時も数を増やす。行ごとの裁定 id の next_id の発行と fn write_rows を、要求の順に行ごとに器の答えの口を answer_argv の束つきの列と行の逐語で撃つ fn answer_rows に替える。rc 0 で裁定 id に読めた行は Written、落ちた行とそれより後の撃たない行は Unwritten（器の答えの口は notes の書きの後の落ちを途中の止まりとして標準エラーに出すので、board は落ちた行の器の 1 行を標準エラーに写す）。fn line と notes の束の欄の字の組みと字『reason(id,』の呼びは消す（batch.rs の数 0）。BATCH_PREFIX の定数は残す。module の doc の受付の順の 6 から 8 を直す。
      形（server/mod.rs と routes）。struct Shared に欄 scribe2（config の scribe2）と欄 state_dir（config の state_dir）を足し、routes/ruling.rs と routes/batch.rs が accept に渡す。Outcome の新しい腕の応答（NoStateDir は 503 と字 ruling-state-dir・AnswerFailed は 502 と字 ruling-answer）を足し、AppendFailed と CloseFailed の腕を消す。Writer には欄を足さない（置き場の妥協: Writer を字で組む歯の file dretry.rs と bvdsweep.rs と bvrread.rs と epolq.rs を書かないため）。
      形（tsuzuri-contract の surface.rs）。fn ruling_lines は、定型行に加えて、notes の行を前後の空白 1 つずつで囲んだ縦線で割って 5 欄以上在り、1 つ目の欄のコロンの前の字が 2 つ目の欄と同じ行（器の結びの行）も、id は 1 つ目の欄・question は 2 つ目の欄・revokes は無しの裁定の行として notes の順に読む。latest_ruling と pending_reopen と revocable は ruling_lines を使うので替えない。
      形（tsuzuri-core の delivery.rs）。fn gui_line は 5 つ目の欄（splitn の 5 つ目）が字 batch: で始まり縦線の区切りを持つ時、区切りの前を束の id、後を逐語の欄として返す（返す組に束の id の Option を足す・私有の fn なので歯は替わらない）。fn said は、器の行の裁定 id か束の id が ids に在れば Said を足す。module の doc に 6 欄の束の行の 1 文を足す。

      偽の器（直す歯の file の共通の形）。server_ask.rs と server_batch.rs の recorder、eretry.rs と bhalf.rs と fserve.rs の偽の器の script は、引数の頭の 3 語が seat と ruling と answer の回に、標準入力を記録の置き場の <名>.<回>.stdin に書き、--question の値（9 番目の引数）の問い id に字 :20260928T0441Z-1 を足した字を 1 行出して rc 0 で終える（落とす回の印の file の回は今のまま rc 1・記録の置き場に file junk が在れば字 not-an-id を出す）。配達の回の記録と落としは今のまま。だから board の答えの裁定 id は、server_ask.rs の問い fx-ask.3 では字『fx-ask.3:20260928T0441Z-1』である。

      直す歯（main ffc52b6e の木を grep で数えた）。行が替える口（ruling::accept と batch::accept の引数・ruling::line と batch::line の消し・答えと束の口の書き手）を使う歯の file は 7 本（tests の 6 本と src の ruling.rs の mod tests）で、直す歯は 26 本・消す歯は 2 本。
      - teeth3 の rsid.rs（3 本を直し 1 本を消す）。rsid_writes_split_id は消す（273 行の ruling::accept と 295 行の batch::accept の close の理由の割りは器の結びが書き、前の行の歯 vrbatch_answer_writes_the_batch_row が測る）。rsid_policy_not_ruling は 407 行の ruling::line の呼びを字『裁定 id = fx-r.1:20260928T0441Z-1・問い = fx-r.1・逐語 = はい』に替え、ほかの断言は今のまま。rsid_src_text は ruling.rs の字『reason(&id,』の数を 2 から 1 に、batch.rs の字『reason(id,』の数を 1 から 0 に替える。rsid_own_names_clean は歯の数を 7 から 6 に替える。
      - teeth3 の server_ask.rs（7 本を直し 1 本を消す）。server_ask_id_counts_up_in_same_minute（387 行）は board が答えの id を発行しなくなるので消す（番号の決めは前の行の歯 vrbatch_bind_numbers_past_a_taken_id と rone_next_id_sees_vessel_ids が測る）。server_ask_ruling_writes_twice（344 行）は、裁定 id が字『fx-ask.3:20260928T0441Z-1』・偽の器の 1 回目の argv が答えの口の 9 語・標準入力が字 減らしてよい・cwd が repo・偽の bdw は配達の印の 1 回だけ（wait は bdw の 1 回）、と断言する形にし、分の断言を外す。server_ask_write_failures_are_502（466 行）は、偽の器の 1 回目を落とすと 502 と本文の字『ruling-answer』と偽の器 1 回と偽の bdw 0 回、記録の置き場に junk を置くと 500 と本文の字『ruling-id-shape』と偽の bdw 0 回、の 2 周にする（bdw の 2 回目を落とす周は消す）。server_ask_verbatim_is_one_line（505 行）は、偽の器の 1 回目の argv が 9 語（改行が argv に無い）で、記録した標準入力の byte が要求の逐語（一行目・改行・二行目と空白と逆斜線 1 字と空白と字 逆斜線・改行）の byte と一致する形にする（notes の追記の字の断言は外す・逃がしは器の JSON の字が持つ）。server_ask_guards_write_nothing（534 行）は、守りの後に偽の bdw も偽の器も 0 回、同じ Origin の要求の後に偽の器が 2 回（答えと配達）で偽の bdw が印の 1 回、にする。server_ask_delivers_only_with_seat_and_state_dir（586 行）は、両方在る server で偽の器 2 回・2 回目の argv が配達の 8 語（seat と deliver と --state-dir と state dir と --target と tsuzuri:0.1 と --ruling と裁定 id）・偽の bdw の 1 回目が印の行、席の target だけ無い server で 200 と偽の器 1 回と偽の bdw 0 回、state dir の無い 2 つの server（no-state と neither）で 503 と本文の字『ruling-state-dir』と偽の器も偽の bdw も 0 回、にする。server_ask_failed_delivery_stays_200_with_stderr_line（704 行）は、落とす回を偽の器の 2 回目（配達）にし、200 と偽の器 2 回と偽の bdw 0 回（印を置かない）と NOT_TAKEN の 1 行を断言する。server_ask_repo_and_state_bytes_unchanged（755 行）は偽の bdw 1 回と偽の器 2 回にする。server_ask_refusals_write_nothing と questions の歯と no_new_dependencies は替えない。
      - ruling.rs の mod tests（629 行から・lib の歯・2 本を直す）。server_ask_next_id_skips_taken は line の呼びの 2 つを字で組んだ定型行（裁定 id = fx.1:20260927T1034Z-1・問い = fx.1・逐語 = x の形）に替え、答えの -3 は今のまま。server_ask_line_prefix_is_graph_ruling は line の断言を revoke_line の断言に替え、revoke_line（id fx.1:20260927T1034Z-2・問い fx.1・取り消す fx.1:20260927T1034Z-1・逐語 はい と改行と それで）が字『裁定 id = fx.1:20260927T1034Z-2・問い = fx.1・取り消す = fx.1:20260927T1034Z-1・逐語 = 』で始まり、改行を逆斜線と n の 2 字にした逐語で終わると断言する。verify の 16 行目が撃つ。
      - teeth3 の server_batch.rs（8 本を直す）。writes_rows_in_order と own_verbatim_or_batch_verbatim は、行の数を n として偽の器が n 回の答え（argv の末に --batch と応答の束の id・標準入力は行の逐語）と 1 回の配達、偽の bdw が印の n 回、と断言する（追記と閉じるの argv の断言を外す）。id_counts_up_in_same_minute は 1 つ目の束の応答から器の束の行（問い id・問い id・発話の ts・gui・束の id・逐語の JSON の字を縦線の欄で繋いだ 6 欄）を組んで偽の bd の notes に足し、2 つ目の束の id の番号 2 を断言する（板が束の id を発行し続けるので残す）。write_failure_is_502_with_done_rows は落とす回を偽の器の 2 回目にし、1 行目が Written・2 行目と 3 行目が Unwritten・偽の器 2 回・偽の bdw 0 回、偽の器の 1 回目を落とす周は全部 Unwritten と偽の器 1 回にする。delivers_once_per_batch は、席の target だけ無い server で 200 と偽の器 n 回と偽の bdw 0 回、state dir の無い server で 503 と字『ruling-state-dir』と何も撃たない、配達を落とす回を n+1 回目にして偽の bdw 0 回、にする。guards_write_nothing と repo_and_state_bytes_unchanged は偽の bdw を印の数に、偽の器を答えの数と配達の 1 回の和にする。fixture_shape_and_no_new_dependencies は 879 行の batch::line の断言を消す。refusals_write_nothing は替えない。
      - teeth2 の eretry.rs（3 本を直す）。read_retries_then_writes は accept に偽の器と置き場を渡し、偽の bdw の argv が空で偽の器の argv が答えの口の 9 語の 1 つだけと断言し、258 行の ruling::line の組みを消す。束の撃ち直しの助けの batch::accept も新しい引数にする。deliver_after_reply は偽の器の門の待ちを配達の回（引数の頭が seat と deliver）だけにし、応答の時に偽の bdw 0 回、門の後に印の 1 回、偽の器の argv が答えと配達の 2 つと断言する。refusal_logged は引数だけを替える。
      - teeth1 の bhalf.rs（2 本を直す）。step_k_of_n は落とす回を偽の器の s 回目（s は 1 から 3）にし、行の結果は s より前の行が Written・残りが Unwritten、偽の器の argv は頭の s 行の答えの列、偽の bdw は 0 回と断言する（row_argvs と Unclosed の腕を外す）。resend_rest は 1 つ目の束で偽の器の 2 回目を落とし（fx-h.1 だけ Written）、台帳を fx-h.1 が closed で notes に器の束の行を持つ形に置き直し、残りの 2 行を送り直すと束の id は batch_id(2)、行の結果は 2 つとも Written で裁定 id は偽の器の出した字と断言する（kept の batch::line の組みを器の束の行の字に替える）。wire_words は替えない（ItemOutcome を替えない）。
      - teeth2 の fserve.rs（1 本を直す）。batch_refusal_logs_once は落とす回を偽の器の 3 回目（2 行の答えの後の配達）にし、偽の器の argv が 2 行の答えと配達の列、偽の bdw が 0 回（行ごとの追記と閉じるの 4 回を外す）と断言する。fserve の deliver を直に呼ぶ歯は替えない。
      直さない着地済みの file（どれも = の項・行の verify が緑のままを測る）。teeth1 の aown.rs（答えの口は 409 と 403 の断りの周だけを撃ち、断りは置き場の判じの前）・teeth3 の rvk.rs（Writer と revoke と定型行の読みは替えない）・teeth2 の fdlv.rs（BATCH_PREFIX の照らし）・中核の rgui.rs と teeth1 の fdlv.rs と fdlt.rs と fmark.rs。答えの口を撃つほかの歯の file（teeth3 の mqask.rs の 404・teeth6 の server_coalesce.rs の 404・teeth2 の iclose.rs の読めない本文）は置き場の判じの前の断りだけを撃つので書かず verify にも足さない。

      歯の file（rone.rs）。頭は //! の 2 行（接頭辞 rone_ と、board の答えと束の口が器の答えの口を撃ち、取り消しと番号と配達の読みが器の行も読む歯である事）の次の行に #![cfg(test)] を置く。組み方は着地済みの teeth2 の eretry.rs に倣う（server を立てず accept を受付の時刻 NOW（1790570490・分の字 20260928T0441Z）で直に撃つ・偽の bd は作業場の out.json を出す script・偽の bdw と偽の器は回ごとに argv を NUL で区切って記録する）。偽の器は上の偽の器の共通の形で、作業場に file fail.<問い id> が在る問いは何も出さず rc 1。
      - fixture の台帳は bead 3 本（a1-q.1・a1-q.2・a1-q.3・どれも status open・label intake:question・notes は空）。要求の版の要約値は着地済みの歯と同じく open_questions の card の digest から組む。
      - 歯 rone_answer_argv_words から rone_batch_stops_at_the_failed_row の 7 本は 1 つ目から 7 つ目の項を見る（Writer の delivery は None）。
      - 歯 rone_batch_id_sees_vessel_rows と rone_next_id_sees_vessel_ids は純関数を字の見本で撃つ。器の結びの行の見本は a1-q.1:20260928T0441Z-1 ｜ a1-q.1 ｜ 2026-09-28T04:41:30.000Z ｜ gui ｜ と二重引用符で囲んだ字 よい（全角の ｜ は半角の縦線 1 つを前後の空白 1 つずつで囲んだ字を表す）。束の行の見本は経路の後に ｜ batch:20260928T0441Z-1 を挟んだ 6 欄。
      - 歯 rone_revocable_reads_vessel_rows は status closed の問い a1-q.1 の LedgerItem を組み、取り消しの定型行は revoke_line で組む（取り消す id は a1-q.1:20260928T0441Z-1・取り消しの行の id は a1-q.1:20260928T0441Z-2）。
      - 歯 rone_said_reads_the_batch_row は tsuzuri_core::delivery の said と undelivered を、問い a1-q.3 の notes に束の行の見本を 1 行持つ台帳の字で撃つ。

      大きさ。write-set の src の file はどれも上限 1500 行に余地が大きい（ruling.rs 690 行・batch.rs 222 行・mod.rs 480 行・proc.rs 190 行・surface.rs 395 行・delivery.rs 388 行）ので growth の欄は無い。

      範囲の外。取り消しの口の振る舞い（行を足して開き直す・器の裁定 event は残る）、方針の口（policy.rs）、配達と印と起動の掃き、面の client（tsuzuri-surface の ask.rs と batch.rs・要求と応答の型は替えない）、器の書き手（前の行）。ItemOutcome（surface.rs の 354 行）の縮め: この行の後に board が出す行の結果は Written と Unwritten だけで、Unclosed はこの行で出なくなり、Skipped と Refused は今も board の src のどこも出さない。縮めは要るが、面の client の残りの行の型 Left と字 UNCLOSED と歯の file bhalfpanel.rs と batchpanel.rs と契約の形の歯 cform_surface.rs に及ぶので、この行の後の別の行に置く（行の割りは席が決める）。要件 FR6 の、答えは面の server が id を発行し notes に定型行を追記する字は、席がこの行を置く commit で器の答えの口が id を発行し器の行を書く字に直す。
  - n: 5
    type: prose
    title: 行 v-after-land — 着地の後に anchor で宣言の命令を撃つ器の鍵（memo t3-hub.92.6・設計だけの行）
    body: |
      在りか。差の file は無い（設計だけの行・作り直し v4 の決め D2）。便は器の src 10 file（うち新しい file 1 本）と器の e2e の 3 file（歯の子 module cilast.rs と、助け floor_rules の可視性だけを広げる pipe/dispatch.rs と、usage の字を固定する snapshot 1 本）と器の設計の文書 1 file を書く。write-set の = の 2 file（e2e の pipe.rs と main.rs）は verify の 5 行目と 6 行目の filter が当たる着地済みの歯の置き場で、書かない。宣言の鍵の名と読み手と外へ渡す口を scribe2/crates/scribe2/src/pipe/declaration/optional_keys.rs に、Declared の欄と parse の読みと measure の照らしの 1 行ずつを親 declaration.rs に足す（optional_keys.rs の module の doc の足し方のとおり）。着地の後の撃ちは新しい子 module scribe2/crates/scribe2/src/pipe/land/after_land.rs に置き、親 land.rs に doc の 1 行と pub(in crate::pipe) mod after_land; の 1 行を足し（step.rs から引くので、着地後の検出の口 detection の land.rs の 101〜102 行と同じ形）、起こしの 1 行を land/finish.rs の fn finish に足す。子の口の旗は pipe/cli/step.rs と pipe/cli/args.rs、案内の字は pipe/cli.rs の usage と help.rs の form に足す。待ちの上限つきの撃ちは床の検査の 1 本（pipe/dispatch/floor.rs の fn run と fn resolve と enum Ran と行の id の const ROW・今は fn と enum が pub(super) で const が私有）を可視性だけ pub(in crate::pipe) に広げて使い回す。depends は空（器のほかの行と触る file が交わっても器が overlap で順に流す）。

      なぜ。係の門の行や tz の導出を替える行の着地の後、hook の tz（plugin/bin/tzw が解く anchor の target/debug/tz）が古い版のまま残り、席が手で anchor で組み直していた（memo t3-hub.92.6・memo t3-hub.87.36.6）。器には着地の後に repo の命令を撃つ口が無い（宣言の鍵の列 DECLARED_KEYS の 29 本に無い・optional_keys.rs の 13〜43 行）。だから repo が宣言で名指す命令を、器が着地のたびに anchor で撃つ鍵が要る。決定はしご。要るか: 要る（上）。既に在るか: 宣言の 1 行を便の外で封じ込めの中に待ちの上限つきで撃つ形は床の検査（宣言の鍵 floor-check・floor.rs の fn judge と fn run）に在り、着地の後に子 process を待たずに起こす形は着地後の検出の口（finish.rs の fn spawn_detection が spawn_self で子 pipe land --run 便の id --detection-only を起こし、語 detection:spawned か detection:unspawned を 1 件記す形・step.rs の fn settled_port の分岐と fn detection_only）に在る。この行は 2 つをそのまま組み、新しい rules 行と event の種類を足さない。

      形（宣言）。鍵の名は after-land（値は字の配列・配列の層が空の配列と空の字を断るのは今のまま）。optional_keys.rs に const AFTER_LAND_KEY（字 after-land）と読み手 after_land_of（contract_tables_of と同じ形で、配列でない値は鍵の名と行の番号を名指す不備・Option の列と行の番号を返す）を足し、DECLARED_KEYS と OPTIONAL_KEYS の列の末（run_cap::PATHS_KEY の直後）に 1 行ずつ足す。親 declaration.rs の Declared に欄 after_land を、parse に読みの 1 行を足す。照らし: optional_keys.rs に fn check_after_land を置き、宣言の行ごとに親の fn unfit を穴なし（Holes::None・契約の verify と同じ）で撃ち、当たった行を鍵の名 after-land と行と理由の不備にする。親の Sourced::measure は検出線の照らしの直後にこれを 1 行で呼ぶ（受付と表の検査も同じ measure を通るので、外の行を持つ宣言は全部の便で断られる＝共通 verify と同じ扱い）。外へ渡す口: pub fn after_land_at(repo, ceiling) は HEAD の宣言を Sourced::read と measure で上限と突き合わせ、通った周だけ列を書いた順で返す（鍵の無い宣言は空の列）。TerminalFacts に欄 after_land（照らす前の列・空なら起こさない印）を足し、fn terminal_facts が埋める。歯 declaration_kind_passes_declarations_without_cargo_and_keeps_the_schema の DECLARED_KEYS の断言の末に after-land を足し、その字の鍵の本数の句に 1 本足す。

      形（起こし・finish.rs の fn finish）。fn terminal が返した後、局面の出力の書き直しの前に after_land::spawn を 1 度呼ぶ（終端の結末と rc と stdout は替えない・fn spawn_detection は終端の前に呼ばれるが、after-land は終端の後に置く）。spawn は次の順で判じる: terminal_facts を fn terminal と同じく entry.repo で読み、TerminalFacts の after_land が空か宣言を読めない周は何もせず行も書かない。着地した sha が anchor の refs/heads/main と違う周（列の着地の先頭でない便と、着地の後に main が進んだ周）は何もしない（main の先端の便が撃つので重ねない）。anchor が揃わなかった周（AnchorSync が Synced でない）は語 after-land:anchor-skipped の 1 行だけ書く。それ以外は fn spawn_detection と同じ argv の組み（land と --run と便の id と旗と --state-dir と --repo・在れば --rules）で旗を --after-land にした子を spawn_self で起こし、起こせた周は after-land:spawned、起こせなかった周は after-land:unspawned の 1 行を書く。子は待たない。

      形（子・after_land.rs の fn fire と step.rs の fn after_land）。旗 --after-land は値を持たない switch で、fn detection_only の今の分岐に倣う: fn settled_port の --detection-only の分岐の後に --after-land の分岐を 1 つ足し、fn after_land は resolve に前提の段 Landed だけを渡し（他の段は何も書かずに rc 1）、着地した sha は super::land::landed_sha で記録から読み、読めない周は何も撃たず断る（HEAD の今の sha に読み替えない・fn detection_only と同じ断り）。子は rules の禁じる語列と上限（step.rs の fn requirements_of と同じ Ceiling の組み）で after_land_at を撃ち、断られた周は after-land:unreadable の 1 行を書いて終える。通った列を 1 行目から順に、床の検査の fn judge と同じ組みで撃つ: 頭の語を floor の fn resolve で PATH から解き（解けない周は after-land:n:unfireable）、confine.rs の fn unit_name に着地した sha と段の語 after-land と行の番号を渡した名で Wrap（Limit::HostReserve・Caps::embedded）に包み（包めない周も unfireable）、cwd は anchor、process group は新しく、待ちの上限は rules 行 floor.timeout_s の秒（床の検査と同じ、宣言の 1 行を器が便の外で撃つ時の上限・新しい rules 行は持ち主の裁定が要るので足さない）で floor の fn run を撃ち、scope を片付ける。rules は親が渡した --rules の file か、無ければ埋め込みを crate::rules::read で読み（親の fn finish の局面の書き直しと同じ読み）、読んだ manifest に行 floor.timeout_s が無い周は床の fn judge と同じく撃たずに after-land:1:unfireable を書く（埋め込みの値へ落とさない・床と同じ断り）。結果は行ごとに 1 件、after-land:n:rc=数（終わった周）か after-land:n:timeout（越えた周・group ごと止める）を書く。rc が 0 でない行と timeout と unfireable の後は続く行を撃たない（後の行は前の行の組みに依る）。子は stdout に run=便の id after-land=最後の語 の 1 行を出して rc 0 で終える。行はどれも RunDone の段 Landed の detail で、頭は after-land:（終端の頭 terminal: と検出の頭 detection:（detection.rs の DETAIL_HEAD）と別・tsuzuri の board は頭 terminal: の行だけを読む）。EventKind と終端の語の列（TERMINAL_TOKENS）と close の理由の形は替えない。

      案内。pipe/cli.rs の usage と help.rs の form の land の段の今の字『[land: --terminal-only|--detection-only]』の --detection-only の直後に |--after-land を足して『[land: --terminal-only|--detection-only|--after-land]』にする（2 つの字は同じに替える・FORM と生きた usage の一致は着地済みの歯 cli_help_pages_match_the_live_form_and_every_subcommand が測り、FORM の行は幅の歯 cli_help_text_is_ascii_and_fits_the_width の外）。生きた usage の字は着地済みの歯 pipe_external_form（tests/e2e/pipe.rs の 561 行・素の usage と stop と --no-review の断りの出力を 1 つに繋ぐ）が insta の snapshot tests/e2e/snapshots/e2e__pipe__pipe_external_form.snap で固定し、usage の 1 行目はその 5・16・26 行の 3 か所に出るので、便はその 3 行の land の段も同じ字に替える（snapshot は 34 行のまま）。案内の字を足す 2 つの口を固定する物を数えると、この snapshot 1 本（3 行）と一致の歯 1 本だけで、lib と境界の crate の src の snapshot は pipe の usage を持たず、幅 100 の歯は FORM の行を測らず、help.rs の tests module の歯 5 本は表の名と欄と see の path と見出しと役の見本だけを測り、歯 pipe_command_all_subcommands_round_trip_and_unknown_tokens_are_none は語が usage に在るかだけを測り、pipe/closure.rs の同じ snapshot の名は toy の fixture の字である。args.rs の ALLOWED_LAND の末の Allowed::switch の --detection-only の直後に Allowed::switch の --after-land を足す。step.rs の fn settled_port に --detection-only の次の分岐を足す（上の形（子））。器の設計の文書 contract-source.md の 5 節の末に、鍵 after-land の 1 段（撃つ条件・上限・語の列・止めない）を足す。

      歯。宣言の歯 1 本目は optional_keys.rs の tests module の今の助け with（allowed-commands が git だけ）で書く。歯 declaration_after_land_reads_a_list_and_refuses_other_values は鍵の無い宣言の欄が値なし、2 項の配列の宣言の欄が 2 項と行の番号 4 であることと、値が字・真偽・整数の 3 つの宣言が鍵の名 after-land と行の番号 4 を持つ不備で断られることを断言する。歯 declaration_after_land_lines_must_fit_the_allowlist は助け with を使わない（with の allowed-commands は git だけなので、cargo publish の行は禁じる語列より先に頭の語 cargo が allowed-commands の外の Unfit::Command で断られ、禁じる語列の句が測られない・fn unfit は頭の語を禁じる語列より先に照らす）。親の tests module の助け body と measured_with の形のとおり、allowed-commands が git と cargo の 2 語で common-verify が git diff --quiet の 1 行の宣言の本文に after-land の 1 行を足した字を、上限の命令 git と cargo・禁じる語列 cargo publish の Ceiling（欄 row は CEILING_ROW・classes は空）で照らし、HEAD の宣言を読む代わりに Declared::parse と Sourced の measure を撃つ見本で、git の 2 行の宣言が通って列が順のまま返ることと、頭の語 sh の行・記号 ; を持つ行・穴 {base} を持つ行・cargo publish の行の 4 つの宣言（ほかの欄は正しい見本と同じ）がどれも after-land を含む不備で断られ、cargo publish の行の不備は Unfit::Denied の理由の字 禁じる語列 cargo publish に当たる を持つことを断言する（after_land_at の本体は Sourced::read と measure の 2 呼びだけで、git の読みは着地済みの歯が測る）。e2e の助け after_land_decl（宣言の末に after-land の行を足して add と commit する・親 tests/e2e/pipe/land.rs の fn ci_watch_off と同じ書き）は子 module cilast.rs に置く（親 land.rs は 4104 行で、preflight の余地の物差し〔1 file 1500 行〕では余地が 0 行なので書かない・cilast.rs は 97 行で余地 1398 行）。e2e の歯 3 本は子 module cilast.rs に、歯 vcicut_land_closes_without_a_ci_child と同じ fixture（repo_with_state・fake_terminal_json に cilast.rs の定数 FAILED・write_contract・gated_pass・land_extra に偽 bd の --bd と --rules）で書き、助けを 2 本足す。after_land_rows は cilast.rs の terminal_rows と同じく親の landed_details を頭 after-land: で濾した列を返す。wait_after_land は after_land_rows のうち子の答えの行（after-land:n:rc= か after-land:n:timeout か after-land:n:unfireable）が n 件に届くまで 100 ミリ秒ごとに読み直し、上限は cilast.rs に新しく置く定数 AFTER_LAND_WAIT_S（60 秒・gate.rs の e2e の CHILD_WAIT_S とは別の名）で、届かない周は届いた所までの列を返す（歯の断言が落ちる）。子は待たない形なので、片付け（clean）は wait_after_land の後に撃つ。e2e の見本の rules（pipe.rs の ceiling_rules・fn write_rules_capped が手で組む manifest）は行 floor.timeout_s を持たない。同じ働きの助けは e2e の pipe/dispatch.rs の fn floor_rules（2906 行・ceiling_rules に台帳の待ちと stop の猶予の 2 行を足した dispatch_rules の写しの末に、行 floor.timeout_s の塊〔kind FloorTimeoutS・enabled true・ruling と ruled_at は字 t と d〕を上限の秒で足した file の path を返す）に在るので、新しい助けは書かず、その fn の可視性だけを私有から pub(super) に広げ（行は増えない）、cilast.rs から super::super::dispatch::floor_rules で上限 60 秒を渡して引く（足された 2 行は land の読みに触らない）。歯 valand_land_fires_the_declared_lines_in_the_anchor と歯 valand_failed_line_keeps_the_landing_and_stops は land の --rules にこの path を渡し（親は同じ path を子へ渡す）、歯 valand_no_key_fires_nothing は ceiling_rules のまま撃つ（子を起こさない）。歯 valand_land_fires_the_declared_lines_in_the_anchor は宣言 git tag valand-mark と git tag valand-second の 2 行、歯 valand_failed_line_keeps_the_landing_and_stops は git rev-parse --verify -q refs/heads/valand-none と git tag valand-mark の 2 行、歯 valand_no_key_fires_nothing は助けを呼ばない fixture。歯 valand_failed_line_keeps_the_landing_and_stops は歯 vcicut_land_closes_without_a_ci_child と同じく偽 bd の log（FakeTerminal の bd_log）の argv を 4 行で断言する。tag の sha は anchor で親 pipe.rs の助け git で rev-parse を撃ち、着地した sha（cilast.rs の助け landed_sha）と比べる。e2e の歯が比べる字は、land の stdout の terminal=closed と、Landed の行の after-land:spawned と after-land:1:rc=0 と after-land:2:rc=0 と after-land:1:rc=1 と、偽 bd の argv の close と --reason と landed <sha> host=green である。cilast.rs の頭の doc の接頭辞の句（接頭辞 vcioff_ と vcicut_）に valand_ を足す。噛みは撃たない（作り直し v4 の決め D2）。

      done と verify の対応。1 つ目と 2 つ目の項は verify の 2 行目、3 つ目は 3 行目、4〜6 つ目は 4 行目（e2e の歯 valand_）、7 つ目は 5 行目（歯 pipe_external_form）、8 つ目は 6 行目が測る。1 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので verify に書かない。入口の赤は、main の器が鍵 after-land を知らない鍵として断り旗 --after-land も無いので、2 行目と 4 行目が落ちる（3 行目は DECLARED_KEYS を伸ばした後に断言を直さなければ落ちる）。断言の字を直す着地済みの歯は、DECLARED_KEYS の列の断言 1 本と、usage の字の snapshot（e2e__pipe__pipe_external_form.snap の 3 行）を持つ歯 pipe_external_form の 1 本の 2 本である（EventKind の数・rules 行の数・終端の語の列は替えない・一致の歯 cli_help_pages_match_the_live_form_and_every_subcommand は FORM と usage を同じ字に替えれば直さずに緑）。直し: 契約の審査（便 t3-hub.92.6.5 の判定 FAIL）が、usage を固定する snapshot が write-set に無く共通 verify の e2e が落ちることと、助け with の allowed-commands が git だけで cargo publish の行が禁じる語列でなく頭の語で断られることを見つけたので、snapshot と pipe/dispatch.rs を write-set に入れ、歯の数の句を数え直し、2 本目の宣言の歯を allowed-commands に cargo を持つ組みで測る形にし、e2e の rules の助けを在る floor_rules に寄せた。宣言の鍵の欄は契約表の欄の写し contracts/field-schema/schema.toml に無いので、その写しは替えない。

      範囲の外。main-red と main-unmeasured の便と終端だけの撃ち直し（--terminal-only）と受け入れの周と着地後の検出の口（--detection-only）は after-land を起こさない（main の先端の次の緑の着地が撃つ・人は子の口を名指して撃てる）。board の serve の tz は host の置き場なので宣言に書かず席の手順に残す（条 N-7.1）。tsuzuri の根の宣言に鍵を書くのは行 t-after-land-decl。器の持ち込んだ宣言 scribe2/.vessel.toml は替えない。
  - n: 6
    type: prose
    title: 行 t-after-land-decl — 根の宣言で hook の tz を着地ごとに組み直す（memo t3-hub.92.6・設計だけの行）
    body: |
      在りか。差の file は無い（設計だけの行・作り直し v4 の決め D2）。便は根の .vessel.toml に注 2 行と鍵の 1 行を足し、xtask の歯の段 1 本 xtask/tests/aland.rs を新しく書く（群に module を足さないので xtask/tests/teeth1/kfold.rs の表 GROUPS は替えない）。depends は行 v-after-land。並べられない訳: 器が鍵 after-land を知らない間は宣言ごと断り、全部の便の受付と終端が止まる。席は v-after-land の着地の後に anchor の器の binary を入れ替えてから、この行の便を置く（受付は base の木の宣言を読み、終端は着地した木の宣言を読むので、この行の便の着地から鍵が効く）。

      なぜ。hook の tz は plugin/bin/tzw が anchor の target/debug/tz を解く（plugin/bin/tzw の 10〜15 行）ので、tz の導出や門を替える行の着地の後に組み直さないと、hook と席の門が古い版のまま動く（memo t3-hub.92.6・席は今日も t-stop-preflight の着地の後に手で組み直した）。命令は repo の相対の cargo の 1 行だけで host の値を持たない（条 N-7.1）。頭の語 cargo は根の宣言の allowed-commands の内で、禁じる語列（cargo mutants・cargo publish）に当たらず、記号と穴と絶対 path を持たない（器の fn unfit の照らしを通る形）。board の serve の tz は host の置き場なので宣言に書かず、席の手順に残す。

      形（.vessel.toml）。鍵 ci-watch の行の直後に次の 3 行を足す（節は二重引用符を書けないので配列の 1 項の囲みを省いた。戻し方: 角括弧の中の字を二重引用符で囲む）。 # 着地の後に anchor で撃つ命令（器の任意 key after-land・器の行 v-after-land）。hook の tz（plugin/bin/tzw が解く target/debug/tz）を着地のたびに main の先端に組み直す。 # board の serve の tz は host の置き場なので書かない（席の手順で入れ替える・条 N-7.1）。 after-land = [cargo build -q -p tsuzuri-boundary --bin tz] 歯が比べる字は 3 行目の『after-land = [cargo build -q -p tsuzuri-boundary --bin tz]』（項を二重引用符で囲んだ形）。

      歯（xtask/tests/aland.rs・xtask/tests/rcoff.rs と同じ組み・外の依存を使わない・頭の doc の次の行が #![cfg(test)]）。定数 LINE に 3 行目の字（項を二重引用符で囲んだ形）を置き、照らしの関数 key_lines は宣言の字から、前後の空白を除いて頭が after-land の行を全部返す。歯 aland_root_declaration_builds_the_hook_binary は根の .vessel.toml を読み、key_lines が LINE の 1 行だけであることと、字 schema = 1 の行の数が 1 であることを断言する。歯 aland_one_clause_changes_are_found は、正しい見本（schema = 1 と LINE の 2 行）で key_lines が LINE の 1 行を返し、正しい見本から 1 句だけ替えた 4 つの見本（項に cargo build -q -p xtask を足して 2 項・旗 -q を外す・LINE の行を 2 つにする・LINE の行を外す）で key_lines の答えが正しい見本の答えと違うことを断言する。名の照らし: 接頭辞 aland_ と 2 本の名は xtask/tests/filter-words.txt の語を含まない（tz_ を避けて名に字 tz を使わない）。

      done と verify の対応。2 つの項はどちらも verify の 2 行目（歯 aland_）が測る。1 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので verify に書かない。入口の赤は、根の .vessel.toml に after-land の行が無いので 1 つ目の項の歯が落ちる。着地済みの歯で .vessel.toml を読むもの（xtask の scopeon・vroots・ixon・rcoff・teeth1 の vcij と vlanes）は鍵ごとの行か字 schema = 1 の数を見るだけで、足す 3 行に当たらない。

      範囲の外。席の commit の門と eval-daily の tz の pin の外しと board の serve の tz の入れ替えは席の手順（repo の外）。器の宣言の鍵の読みと撃ちは行 v-after-land。
  - n: 7
    type: prose
    title: 行 ag-drafter-marks — 設計係の型と手引きの参照の file に、done の印の決まりと契約の file の置き場の決まりの 4 行を足す（memo t3-hub.92.7・作り直し v4 の段 S4・設計だけの行）
    body: |
      在りか。差の file は無い（設計だけの行・決め D2）。便は 3 file を書き、3 file を置き場だけで名指す。設計係の型 plugin/agents/drafter.md に 2 行の字を足し、手引きの参照の file plugin/skills/agent-discipline/reference.md に 2 行を足し、新しい歯の段の file crates/tsuzuri-boundary/tests/agmrk.rs（接頭辞 agmrk_）を足す。着地済みの歯の file crates/tsuzuri-boundary/tests/agref.rs と群 teeth6 の module crates/tsuzuri-boundary/tests/teeth6/agpl.rs と crates/tsuzuri-boundary/tests/ageff.rs は書かず、verify の 3〜5 行目が撃つので置き場だけで名指す。手引き plugin/skills/agent-discipline/SKILL.md・調べ役と検証役の型・群の main.rs・xtask の kfold の表・Cargo.toml は書かない（新しい歯は段の file・tests の直下の file は cargo が自ら拾う）。

      なぜ。行 v-pf-literal（ノート surface-v4a の節 23）は、器の preflight が、done の項が全角の二重鉤括弧の印で囲んだ字が審査の材料の節に無い項を断る（断りの名 section-literal）。行 t-stop-preflight（同じノートの節 24・着地済み）は、係の終える前の門が出す物の dir の子 contract の直下の .toml の file を preflight --contract で撃ち直す。この 2 つは設計係が自分で従う決まりだが、型と手引きに字が無く、席が係への頼みの文に毎回書いている。判断の記録 ADR-63 の決定 (2) は席の起草の決まりの文を手引きの参照の file だけに置くと決め、節 23 と節 24 の範囲の外の段は、この字を型と手引きに置くのを席に残した。この行がその字を置く。行 v-pf-literal はほかのノートの行なので depends に書かず、便の bead の依存で席が持つ（1 つ目の参照の行が名指す断りを器が持つ前に着地させない）。

      消す物。決まりの文が型と手引きに入るので、席の頼みの文の同じ決まりの段は要らなくなる（頼みは参照の file を名指す）。走査・記録・規則の行は足さない。

      足す 4 行の字（どれも改行を含まない・1 つ目と 3 つ目は全角の二重鉤括弧の始まりと終わりの 2 字を字のまま持つ。done はこの 2 行を、印の字を含まない前と後の部分の字だけを印で囲んで名指し、入れ子にしない）。
      - 1 つ目（名 self-check・型の file）: 節の字は done で全角の二重鉤括弧『』の印で囲む。
      - 2 つ目（名 output-contract・型の file）: 契約の file（contract/<行 id>.toml）。行ごとに 1 file を、出す物の dir の子 contract の直下に置く。終える前の門が file ごとに preflight --contract で撃ち直す。
      - 3 つ目（名 ref-mark・参照の file）: done の項が節の字を言う時は、その字を全角の二重鉤括弧『』の印で囲んで書き、同じ字を節の本文に書く（preflight の断り section-literal が照らす）。印を節の字の外に使わない。
