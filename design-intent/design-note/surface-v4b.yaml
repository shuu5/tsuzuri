      範囲の外と後の行。起こしの口を寄せる残りの 1 つは、引数の無い長い形 seat launch の既定の target が登録 row を見ず repo の dir 名と役割名で作る事（seat/cli.rs の fn launch_defaults 562-595 行と fn default_target 597-600 行・短い形 fn short_defaults は登録 row を先に見る）で、後の行（係の plan.md の割り方の 2 行目・host-init.md の 5 節の既定の改め）にする。持ち主の手の起こし（口座の切り替えの script で起こす形・tmux の復元の script）は repo の外なので行に入れず、席への問いに置く。窓の名のずれ（automatic-rename ほか）は判じに入れない（記録の跡が無い）。要件 FR1042 の字「役割の記録が無ければ注入せず」は指示文の注入の字で、ずれの 1 行は指示文でない事実の 1 行なので替えなくてよいが、席がこの行を置く commit で 1 句足すかを決める（係の notes に案）。

