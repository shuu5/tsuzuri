      - fn memo_texts(ledger) は台帳の一覧の字（graph::build の read_ledger と同じ読み）から、label に intake:memo を持つ bead だけを開閉を問わず、id から題と改行と本文（description）をつないだ字への写し（BTreeMap）にする。字が空か JSON の配列でなければ空の写し。
