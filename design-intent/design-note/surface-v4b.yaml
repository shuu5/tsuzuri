        在りか（main の 997b4948 の字）。差の file は無い（設計だけの行・決め D2）。判定の語は scribe2/crates/scribe2/src/pipe/dispatch/memo.rs の enum Word（50-74 行・Promote・Close・Keep・Unparsed の 4 値と const ALL）。verdict の file の形は struct Verdict（77-107 行・fn to_line が 4 key verdict・at・evidence・sketch を書き、fn parse が 4 key 全部と ALL の語を要る）。lens の出力の読みは pipe/dispatch/memo_lens.rs の fn verdict_of（148-165 行・promote・close・keep の外は unparsed・sketch は promote の時だけ）、呼びは 124 行。MemoJudged の event の detail は語の字だけ（189 行）。審査の材料は fn material_of（205-221 行・memo の description と notes と引き金の読みと辿れる契約）。席の手番の読みは fleet/lifecycle_mark.rs の fn verdict_unhandled（840-856 行・853 行の列が Promote と Close）で、呼び手は fleet/lifecycle.rs の 690 行（局面の unjudged）と ledger/mod.rs の 244 行（自動の閉じの除き）。雛形は headless/lens-memo.txt（22 行・JSON の形は 7 行・keep の定義は 14 行）。

        なぜ。memo は 82 本が溜まる向きで（係 w303r の調べ）、同じ課題の memo を 1 本に寄せる判定の語が無い。keep は理由の型を持たないので、席は keep の memo を毎回読み直す。決定はしご。既に在るか: 判定の語の閉じた enum と verdict の file と event が在るので、語 1 つと key 2 つを足すだけで、新しい event・口・旗を足さない（条 N-3.1）。

        形（memo.rs）。
        - enum Word に Merge（字 merge）を Close と Keep の間に足し、ALL を 5 値にする（宣言順 Promote・Close・Merge・Keep・Unparsed）。
        - 定数 KEEP_WHY（字 no-material・wait-row・wait-owner の 3 つ・この順）を足す。no-material は材料が足りない、wait-row は契約表の行か便の着地を待つ、wait-owner は持ち主の決めを待つ。
        - struct Verdict に欄 into（merge の行き先の memo の id）と why（keep の理由の型）を足す（どちらも String・使わない語の時は空）。fn to_line は 4 key の後に、into が空でない時だけ key into を、why が空でない時だけ key why を書く。fn parse は 4 key を今のとおり要り、into と why は在れば文字列で読み、無ければ空にする（着地済みの 4 key の verdict の file を読める・triage の歯の見本 waiting.rs の 2119 行は 4 key のまま）。Verdict の組みは memo_lens.rs の 2 か所と、grep で数えた歯の組みが 0 件。
        形（memo_lens.rs）。
        - fn verdict_of は引数に memo の id を足し、語の列に merge を足す。merge の時、JSON の into が 1 字以上で、どの字も ASCII の英数字か - か . か _ で、memo の id と違わなければ into を写し、そうでなければ unparsed（evidence は into が行き先の memo の id の形でない旨の字）。keep の時、why が KEEP_WHY の 1 つなら写し、そうでなければ unparsed（evidence は why が 3 つの型のどれでもない旨の字）。sketch は今のとおり promote の時だけ。124 行の呼びに memo を渡す。
        - fn material_of は末に見出し ## ほかの開いた memo と、台帳の開いた memo（is_memo・status が closed でない・自分を除く・台帳の順）の行を 1 本ずつ、- と空白と id と空白と description の 1 行目を繋いだ字で足す（無い時は（無い））。行き先は lens がこの列から選ぶ。辿れない契約は今のとおり持たない（waiting.rs の 1261 行の照らし）。
        - MemoJudged の detail は語の字のまま（merge の時も merge だけ・into は verdict の file が持つ）。
        形（lifecycle_mark.rs）。853 行の列に Word::Merge を足す（merge の判定は席が 2 本の memo を寄せる手番）。fn の doc の promote か close の字を promote・close・merge に直す。ledger/mod.rs の自動の閉じは unjudged の memo を閉じないので、merge の判定の memo も席の処置まで閉じない（替える code は無い）。
        形（lens-memo.txt）。JSON の形の行に key into と why を足し、merge の定義（課題が別の開いた memo と同じで 1 本に寄せられる・into にほかの開いた memo の列の id を書く・evidence に同じと言える根拠を書く）を close と keep の間に足す。into の説明を merge の周だけ書く形で、why の説明を keep の周だけ 3 つの型から 1 つ書く形で、sketch の説明の行の後に足す。keep の定義の文の字それが揃う引き金を 1 つ書くは 1 度のまま残し（vlask_ の歯が数える）、外の読みの上限の文と頭の 1 行（headless_lens_memo_ の歯が照らす字）は替えない。
        直す着地済みの歯の見本。keep の JSON を返す偽 lens の見本は why を持たないと unparsed になるので、tests/e2e/pipe/dispatch/waiting.rs の 1164・1248・1272・1320・1963 行の 5 つの見本の JSON に why no-material を足す（grep で数えた・1164 行の歯は語 keep を断言する・ほかの 4 つは語を断言しないが同じ形に揃える）。verdict の file を直に置く見本（883・2119 行）は 4 key のまま読める。lib の verdict_unhandled_ の歯 3 本（lifecycle_mark.rs の 1223-1270 行）は語 merge を持たないので替えない。

        歯の module（vmmerge.rs）。置き場は着地済みの e2e の module scribe2-boundary/tests/e2e/pipe/dispatch/waiting.rs の子 module で、waiting.rs の末に mod vmmerge; の 1 行を足す（use super::* で親の助け memo_repo・fake_bd・unmet_memos・dispatch_rules・memo_lens_cmd・memo_lens・place_file・string_pairs・pair_of・judged_lines を使う・着地済みの歯 pipe_dispatch_memo_lens_writes_the_last_json_line_as_the_verdict_and_one_event（1141 行）と同じ組み方）。頭は //! の 2 行。scribe2 の e2e は tsuzuri の群の表 GROUPS（xtask/tests/teeth1/kfold.rs）の外なので表は替えない。
        - 歯 vmmerge_merge_writes_the_target・vmmerge_merge_without_a_fit_target_is_unparsed・vmmerge_keep_carries_one_of_three_reasons・vmmerge_keep_without_a_reason_is_unparsed: 見本ごとに memo を unmet_memos の新しい id で台帳に置き、memo_lens_cmd の新しい名で撃つ。1 つ目から 4 つ目の項。
        - 歯 vmmerge_material_lists_the_other_open_memos: 台帳に unmet_memos の s2-m.1 と s2-m.2 と、status closed の s2-m.3 を置き、s2-m.1 を撃って置き場の material を読む。5 つ目の項。
        lib の歯（lifecycle_mark.rs の mod tests と memo.rs の mod tests）。
        - 歯 vmmerge_unhandled_counts_a_merge（lifecycle_mark.rs）: 着地済みの助け ledger_json・bead_json・judged_line で、開いた memo m-merge と m-keep に語 merge と keep の行を置く。6 つ目の項。lifecycle_mark.rs は 1403 行で上限の余地は 97 行。
