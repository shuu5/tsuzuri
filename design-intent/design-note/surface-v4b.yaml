      - 歯 sdrift_session_start_names_the_registered_target: role_place の見本に registered で dold:dwin と見本の repo を積み、named_tmux の dnow:dwin の PATH で session-start を --pane STUB_PANE と --rules と --bd を付けて撃つ。rc 0・after_header の行がずれの 1 行の 1 つだけ・inject_lines が撃つ前より 2 行増え、後の行の what_of が session-start-drift・その行の字が seat の欄の dnow_dwin を持つ。
      - 歯 sdrift_session_start_stays_silent_without_a_drift: 見本を 2 つ作る。1 つ目は registered の anchor を git_repo で作った別の repo にし、2 つ目は registered の target を dold:dother にする。どちらも dnow:dwin の PATH で同じく撃ち、after_header の行は 0・inject_lines は 1 行だけ増えその what_of は session-start-header。
