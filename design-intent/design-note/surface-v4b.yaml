    body: |
      在りか。差の file は無い（設計だけの行・決め D2）。便は 5 file を書く。中核の crates/tsuzuri-core/src/memo_gate.rs（335 行）に下書きの題と本文の読み・似た memo・code の候補・判じの材料の型を足す。境界の crates/tsuzuri-boundary/src/hook/question_gate.rs（155 行）の fn answer に本文の file の読みと code の層の読みを足す。crates/tsuzuri-boundary/src/cli/code.rs（224 行）の fn gather から file の一覧と定義の stream を読む 2 つの撃ちを pub(crate) の fn read_layer(repo, sg) に切り出し、gather はそれを呼ぶ（tz code の出力は替えない）。歯は新しい段の file crates/tsuzuri-boundary/tests/msim.rs（接頭辞 msim_）に置き、着地済みの crates/tsuzuri-boundary/tests/mlnk.rs は判じの呼びと MemoDraft の字を新しい形に合わせるだけ直す。depends は空（着地済みの行 t-memo-link-gate はノート surface-v4a の行）。未着地の行 t-code-bead（ノート surface-v4a・memo t3-hub.92.7）も cli/code.rs を書くので、器が交わりの待ちで順に流す。どちらが先でも、この節は gather を役（file の一覧と定義の stream の読み）で名指すので字は当たる。

