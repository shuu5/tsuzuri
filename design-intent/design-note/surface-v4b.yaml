      ずれの判じ（seat/role.rs に pub fn drifted_row を 1 本足す・fn registration_of_target の隣）。引数は replay の State と anchor の字と今の target。今の target に登録 row が在れば None。無ければ、鍵ごとに最新へ畳んだ登録 row のうち、anchor の字が引数の字と等しく、target の最初の : より後の字（窓の名）が今の target の窓の名と等しく、target が今の target と違う row を、seq が最大の 1 つ返す（無ければ None）。anchor の字は呼び手が Path の display の字で渡す（登録 row の anchor と同じ作り）。窓の名が違う row と anchor が違う row はずれと読まない（同じ repo で別の窓に開いた claude と、同じ置き場の別の project の席に、ずれの行を出さない）。

