    title: 行 v-ruling-batch — 器の答えの口が束の id を受けて 6 欄の裁定の行を書き、裁定の行の読みが 6 欄を読み、結びの口が取られた裁定 id の番号を飛ばす（memo t3-hub.92.6・作り直し v4 の段 S9・設計だけの行）
    body: |
      done と verify の対応。1 つ目から 10 番目の項は verify の 2 行目（新しい歯の module vrbatch の歯）が測る。11 番目は verify の 4 行目（着地済みの snapshot の歯 seat_usage_external_form・snapshot の file を書き替える）、12 番目と 13 番目は verify の 3 行目（着地済みの seat_ruling_bind_ と seat_ruling_answer_ の歯の全部・12 番目は使い方の字を断言する歯の字を直す）、14 番目は verify の 5 行目（lib の close_reason の mod tests の歯 ruling_row_）が測る。1 行目の clippy は done に載せない守り。xtask の check は共通 verify が撃つので行の verify に書かない。

      直し（契約の審査の便 t3-hub.92.6.3 の FAIL・木 997b4948 の所見・係 w354a）。前の形は結びの口 seat ruling bind に --batch を持たせず、書き済みの判じを行の字の一致にしていたので、--batch つきの答えが close か裁定 event の段で途中で止まった後の結び直し（答えの口の partial utterance=<ts> の 1 行が告げる口）は 5 欄の行を組んで notes の 6 欄の行と合わず、番号 1 の id の字が notes に在るので番号 2 に進み、開いた問いには 2 つ目の notes の行と番号 2 の close を書き、閉じた問いは closed で断って裁定 event を書けなかった。この形は結びの口も旗 --batch を受けて答えの口と同じ 6 欄の行を組み、答えの口の途中の止まりの 1 行は束の id を受けた周に束の id を名指し、結び直しは同じ束の id を --batch に渡して一周閉じる。書き済みの判じは行の字の一致（束の欄を含む）のまま。試す番号に上限の数を置かず、取られた番号の集まりの数で止まる（下の番号の項）ので、上限を越えた周と断りの語は無い。

      在りか（main の 0da12ada の字）。差の file は無い（設計だけの行・決め D2）。器の書き手は scribe2/crates/scribe2/src/seat/ruling.rs の fn bind（131-171 行・書き済みの判じは 155 行）と fn answer（193-212 行・結びの失敗は全部 Partial(ts) にする 211 行）で、行の字は fn row_of（124-126 行）が組む 5 欄（裁定 id ｜ 問い id ｜ 発話の ts ｜ 経路 ｜ 逐語の JSON の字）。番号は定数 COUNT（110 行・常に 1）と fn ruling_id（114-120 行）。口の引数は seat/cli.rs の ALLOWED_RULING（108-114 行）と fn ruling_bind（402-423 行・--batch を読まない）と fn ruling_answer（428-450 行）、答えの口の途中の止まりの 1 行は 448 行で、doc（427 行）は seat ruling bind で結び直せると書く。使い方の字は cli.rs の 22 行と help.rs の 352 行の 2 か所（同じ字）。口の形の字は docs/design/fleet-event-log.md の 14 節の約束 1（299 行・bind）と docs/design/dialogue-surface.md の 11 節の約束 1 と約束 2 の (b)（180 行と 191 行・answer）。裁定の行の読みは ledger/close_reason.rs の fn ruling_row（218 行から・欄を半角の縦線で割り 4 欄か 5 欄だけを読む）。引用の索引の束の欄は ledger/citation.rs の fn bundles_of（204 行から・最初と最後の欄の間の欄で字全体が batch: の形の欄を拾う）で、この関数は替えない。ここの全角の ｜ は半角の縦線 1 つを前後の空白 1 つずつで囲んだ字を表す。歯と code の字は半角で書く。

      なぜ。席の決め（memo t3-hub.92.6 の notes 2026-10-06T11:04Z）で、裁定の書き手を器の答えの口の 1 本に寄せ、board の書き手を退ける（後の行 t-ruling-one）。board の束の口は束の id を行に書くので、器の行に束の欄が無いと束の答えを器へ寄せられない。決定はしご。既に在るか: 器の引用の索引は行の中ほどの欄の batch: を既に拾う（bundles_of）ので、束の欄は経路の後・逐語の前の 1 欄にする。読みの文法は 1 つ足すだけで、新しい event と新しい口は足さない（条 N-3.1・旗 --batch は答えの口と結びの口の任意の旗で、無効化の旗でない）。番号の決め: 器の裁定 id は発話の分から作り番号は常に 1 なので、board の取り消しの口（POST /api/revoke・節 4）で開き直した問いに同じ分で答え直すと前の裁定と同じ id になり、配達の印と取り消しの読みが前の裁定と混ざる。これを避けるために結びが notes の字を見て番号を進める。結び直しの一周: 束の id は発話 event に無い（detail は逐語だけ）ので、結び直しが束の欄を組むには呼び手が束の id を渡すほかない。別の形（書き済みの判じを束の欄を除いた欄の一致に緩め、結びの口に --batch を足さない）は close と裁定 event の段を閉じるが、notes の追記の前で止まった周（追記の失敗・台帳や event log を読めない）の結び直しが束の欄の無い 5 欄の行を書いて束を落とすので採らない。

      形（seat/ruling.rs）。
      - struct Bind に欄 batch（Option の字・束の id）を足す。fn row_of は batch が Some の時、経路の欄と逐語の欄の間に束の欄を挟んだ 6 欄（裁定 id ｜ 問い id ｜ 発話の ts ｜ 経路 ｜ 束の id ｜ 逐語の JSON の字）を組み、None の時は今の 5 欄のまま。Bind の字の組みは cli.rs の fn ruling_bind と fn ruling_answer の 2 か所（どちらも --batch の値を置く）と ruling.rs の mod tests を grep で数えて全部直す。fn answer は args の batch をそのまま bind に渡す（今の ..*args の組み）。断りの順と語は替えない。
      - 番号: fn bind は ruling_id が返す番号 1 の id の末の 1 を除いた字（幹）を取り、notes の字の中で幹の直後に続く ASCII の数字の最長の並びを 10 進で読んだ番号の集まり（取られた番号・読めない並びは数えない）を作る。番号 n を 1 から順に、n の id の行（row_of で組んだ字・束の欄を含む）が notes の行に在ればその n で書き済みとし（今の written と同じ・撃ち直しで同じ id）、無くて n が取られた番号なら n を 1 増やし、どちらでもない最初の n を使う。集まりは有限なので n は集まりの数に 1 を足した数を越えずに止まり、試す n に別の上限の数を置かない（notes の行の数を上限にすると 1 行に 3 つの id を持つ notes で番号 4 へ進めない）。定数 COUNT は消し、fn ruling_id は今の 2 引数の形で番号 1 の id を返すまま（答えの口の SAMPLE_TS の照らしと lib の歯 seat_ruling_id_ が使う）にし、module の doc と ruling_id の doc の常に 1 の字を直す。
      形（seat/cli.rs と help.rs）。ALLOWED_RULING に value(--batch) を足す。fn ruling_answer と fn ruling_bind は --batch を任意の空でない値として読み、照らしの関数 1 本で、値が字 batch: で始まり、その後が 1 字以上で、どの字も ASCII の英数字か - か . か _ でなければ使い方の誤り（refused_usage・rc 1・偽の bd も発話も撃たない）にする。使い方の字は結びの口の form を 『--utterance TS [--batch B] [--bd B]』 に、答えの口の form を 『--question ID [--batch B] [--bd B] (stdin: WORDS)』 にし、cli.rs の 22 行と help.rs の 352 行と snapshot の file e2e__seat__seat_usage_external_form.snap を同じ字に直す。着地済みの歯 seat_ruling_bind_is_in_the_usage_and_the_help_page_and_add_is_not（e2e の seat/ruling.rs の 477 行と 480 行）の字も 『|ruling bind --repo R --state-dir S --question ID --utterance TS [--batch B] [--bd B]|』 に直す。
      - 答えの口の途中の止まりの 1 行は、束の id を受けた周だけ utterance=<ts> の後に batch=<束の id> を挟む（字 seat ruling: partial utterance= と発話の ts と字『 batch=batch:20261006T0100Z-1 question=s2-q1』を繋いだ形）。束の無い周の字は今のまま（着地済みの歯 seat_ruling_answer_event_failure_is_partial_and_bind_finishes_the_same_utterance と seat_ruling_answer_notes_failure_is_partial_and_keeps_the_utterance_without_a_close が字の全部を断言する）。結びの口の 1 行の字は替えない（呼び手が --batch を渡している）。fn ruling_answer の doc の結び直しの字に --batch を足す。
      形（ledger/close_reason.rs）。fn ruling_row は、欄の数が 6 で 5 つ目の欄（前後の空白を剥いだ字）が字 batch: で始まる行を、5 つ目の欄を飛ばした 5 つの欄（id・question・ts・route・verbatim は 1 つ目から 4 つ目と 6 つ目の欄）の RulingRow として読む。5 つ目の欄が batch: で始まらない 6 欄の行は今と同じく None。struct RulingRow は替えない。doc の欄の数の字を直す。
      形（docs）。dialogue-surface.md の 11 節の約束 1 に [--batch B] と 6 欄の行の 1 文を、約束 2 の (b) に束の周の batch=<束の id> と結び直しに同じ束を --batch で渡す 1 文を足す。fleet-event-log.md の 14 節の約束 1 の口の形に [--batch B] と、束の id を受けると 6 欄の行を組む 1 文を足す。

      歯の module（vrbatch.rs）。置き場は着地済みの e2e の module scribe2-boundary/tests/e2e/seat/ruling.rs の子 module で、ruling.rs の末に mod vrbatch; の 1 行を足す（use super::* で親の private の助け Fake・FAKE_BD・open_question・show_json・answered_id・row_of・定数 TS_A と ANSWER_WORDS を使う）。頭は //! の 2 行（接頭辞 vrbatch_ と、器の答えと結びの口の束の欄と裁定の行の読みと番号と途中の止まりの結び直しの歯である事）。助けの shrink（審査の質の所見）: 着地済みの助け Fake::answer（ruling.rs の 984 行）と Fake::bind（147 行）を、足す引数の列を受ける fn answer_with と fn bind_with に割り、answer と bind は空の列で呼ぶ 1 行にする。vrbatch.rs は撃ちの組みを写さず、answer_with と bind_with に --batch と束の値を渡す。
