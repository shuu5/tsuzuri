      - struct Seen は判じの材料で、欄 graph（Graph の参照）・memos（memo_texts の写し）・code（Option の CodeGraph・読んでいなければ None）を持ち、fn of(graph) は memos が空で code が None の材料を返す。fn judge(drafts, seen) は今の judge の graph を seen に替える。
      - 1 つの下書きの判じの順。metadata が object でなければ Deny の metadata、touches が空なら Deny の no-touches。次に読めない元を集める（設計か台帳が読めていなければ design か ledger、欄 text が None なら body、欄 text が code の語を持ち seen の code が None なら code）。1 つでも在れば Unknown の unread（ids は natural_cmp の順）。touches にグラフに無い id が在れば Deny の unknown-id。候補は memo_needs と similar と code_needs の和。memo_needs の数が gate::NEEDS_CAP を越えるか、code_needs の数が CODE_CAP を越えれば Unknown の too-many（似た memo は SIMILAR_CAP で切るので越えない・touches を絞っても減らない候補で too-many にしない）。処分は今の touches と links と not-relevant の鍵に、metadata の CODE_KEY の id の列を足した和。処分の無い候補が在れば Deny の undisposed。digest は touches のうちグラフに在る id と候補の和を natural_cmp の順に並べた束の digest_of の値（code の候補はグラフの節点でないので digest_of が飛ばす）。似た memo も code の候補も無ければ fn memo_digest と同じ値。code の候補を touches に書くとグラフに無い id で unknown-id になる（code の処分は CODE_KEY か not-relevant）。
