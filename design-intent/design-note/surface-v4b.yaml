      形（memo_gate.rs）。
      - 定数。SIMILAR_MIN は 30（似ている比の下限・百分率）、SIMILAR_CAP は 5（似た memo の候補の上限）、CODE_CAP は 10（code の候補の上限）、CODE_SPREAD は 3（1 つの名を定義する file の数の上限）、CODE_KEY は字 code（関わる code を名指す metadata の鍵）。
