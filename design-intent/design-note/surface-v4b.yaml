  - n: 13
    type: prose
    title: 行 v-launch-row-target — 引数の無い長い形の seat launch の既定の target を、短い形と同じく鍵の登録 row から先に引く（memo t3-hub.92.1 の候補 5 の 2 行目・作り直し v4 の段 S1・設計だけの行）
    body: |
      done と verify の対応。1 つ目から 3 つ目の項は verify の 2 行目（新しい歯の module rowtgt の歯）が測る。4 つ目と 5 つ目は verify の 3 行目（着地済みの seat_launch_default_ の歯の全部・4 つ目はそのうち順を入れ替える 1 本）、6 つ目は verify の 4 行目（着地済みの init_seat_ の歯の全部）、7 つ目は verify の 5 行目（着地済みの seat_launch_short_form_ の歯の全部・登録 row の読みを 1 本の助けに寄せるので守りに置く）が測る。1 行目の clippy は done に載せない守り。xtask の check は共通 verify が撃つので行の verify に書かない。

      在りか（main の 0da12ada の字）。差の file は無い（設計だけの行・決め D2）。長い形の口 fn launch_of（seat/cli.rs 543-554 行）は --state-dir・--role・--target のどれかが無い時に fn launch_defaults（562-593 行）へ渡す。launch_defaults の target は 576 行で、明示の --target が無ければ anchor（--anchor か cwd の repo の根）から fn default_target（597-600 行・repo の dir 名と役割名を : で繋ぐ）で作り、登録 row を読まない。短い形の fn short_defaults（676-704 行）は明示の --target が無い時、event log を読んで replay し、fn registration_of_key（seat/role.rs 340-342 行・鍵は役割と anchor の字）の row の target を先に引き、log を読めない時は fn refused_before_launch（cli.rs 726-734 行）で reason=log-unreadable と断る。init の 9 段目 fn launch_seat（init.rs 665 行から）は fn registered（init.rs 133-143 行・同じ鍵の row が 1 件でも在るか）が真なら子を撃たず skip するので、子の引数の無い seat launch は鍵の row が無い時にだけ走る。

      なぜ。持ち主の席を起こし直す口は今 2 つに割れている。短い形 seat <label> は登録 row の target へ起こすが、口座の label を名指す要る。引数の無い seat launch は口座を自分で解くが、target を repo の dir 名と役割名で作るので、登録の target の session 名が repo の dir 名と違う席（節 10 のずれの実例の席）では、登録と違う窓へ起こし、登録 row の target を書き替える。この行で引数の無い seat launch が登録の窓へ起こすので、起こし直しの口は 1 語になる（判断の記録 ADR-1063 の原則・入口の 1 語・残りは器が既に在る置き場から導く）。決定はしご。要るか: 要る（節 10 の範囲の外と後の行に名指した残りの 1 つ）。既に在るか: row の読みは短い形に在る。新しい口・新しい旗・無効化の旗は足さない（条 N-3.1）。消す物の名指しは無い。

      形（seat/cli.rs）。fn short_defaults の 678-686 行の row の読み（read_all と replay と registration_of_key と log-unreadable の断り）を、置き場と役割と断りの行に載せる target を受けて登録 row の Option を返す 1 本の fn key_row に寄せ、short_defaults と launch_defaults の両方がそれを呼ぶ（読みの道は 1 本・短い形の判定と字は 1 字も替えない）。launch_defaults は、明示の --target が在ればそれを使い log を読まない（今のまま）。無い時は、今と同じく default_target の字を作って missing の判じに使い（repo の外・dir 名が : を含む等で作れない時は今と同じ defaults-unresolved の missing=--target・row が在っても読まない）、fn launch_place で置き場と anchor を解いた後に key_row を引き、row が在ればその target を、無ければ default_target の字を使う。launch_place の手前の断りの行は今と同じ default_target の字を載せる（row を読む前なので）。読めない時の断りの行は key_row が default_target の字を載せて作る。見本の置き場（出所 git-config）の字は次のとおりで、これを『読めない時の断りの 1 行』と呼ぶ（末の 2 語は着地済みの歯の助け provenance が置き場と字 git-config から作る字と同じ）。
      seat launch: refused reason=log-unreadable target=anchor_orchestrator source=git-config state_dir=<置き場の path>
      この行は cycle の fn render_launched が作る今の断りの形（字の作りを足さない）。doc の注（launch_of・launch_defaults・default_target の 3 つ）の既定の字を、row が先で無い時だけ dir 名と書き替える。cli.rs は 807 行で 1500 行の上限の余地は足りる。

      形（docs/design/host-init.md の 5 節）。60 行の字、--target は repo の dir 名と役割名、を、同じ鍵（役割と anchor）の登録 row の target を先に引き、row が無い時（init の 9 段目が子を撃つ唯一の時）だけ repo の dir 名と役割名、に替え、log を読めない時は log-unreadable で断る事を 1 文で足す。61 行の短い形との切り分けの字は替えない。

      歯の module（rowtgt.rs）。置き場は着地済みの e2e の module scribe2-boundary/tests/e2e/seat/launch.rs の子 module で、launch.rs の頭の use の後に mod rowtgt; の 1 行を足す（launch.rs は 1888 行なので欄 growth に 1 行を書く・着地済みの子 module hook/session/wipst.rs と同じ組み方・use super::* で launch.rs の助け launch_default_place・launch_default_run・launch_default_assert_launched と定数 DEFAULT_REPO・LAUNCH_TMUX_ARGS を使い、seat.rs の助け acct_rows・provenance・stdout_of・stderr_of・rc_of と定数 RC_REFUSED を使う）。頭は //! の 2 行（接頭辞 rowtgt_ と、引数の無い seat launch の既定の target が鍵の登録 row を先に引く歯である事）。字は契約から組む（実装の助けを使わない）。
      - 歯 rowtgt_bare_launch_reuses_the_registered_row_target: 引数の無い形と --role orchestrator だけの形の 2 つの周ごとに launch_default_place の見本を作り、見本の repo を cwd に launch_default_run で --target other:win を付けて起こして row を書き、続けてその周の引数で撃つ。launch_default_assert_launched に target other:win と出所 git-config を渡す（rc 0・成立の 1 行・登録 row の最後・has-session -t =other の呼び）。acct_rows の数は 2。
      - 歯 rowtgt_row_of_another_anchor_is_not_read: launch_default_place の見本の置き場に、vessel::seat::role::register で役割 orchestrator・anchor は見本の dir の下の字 elsewhere の path・target other:win・口座 l1・launch は空・sid と model は無しの row を積み（着地済みの歯 init_seat_copies_the_child_refusal_word_and_skips_after_registration の row の積み方と同じ）、引数無しで撃つ。launch_default_assert_launched に target anchor:orchestrator と出所 git-config を渡す。
      - 歯 rowtgt_unreadable_log_refuses_before_any_key: launch_default_place の見本の置き場の fleet/events.jsonl の file を退けて同じ path に dir を作り（read_all が読めない形）、引数無しで撃つ。rc は RC_REFUSED・stdout は空・stderr は『読めない時の断りの 1 行』の末の 2 語を provenance で組んだ字と一致・見本の dir の LAUNCH_TMUX_ARGS の file は無い。

      4 つ目の項の歯（seat/launch.rs の seat_launch_default_explicit_flags_win_over_the_defaults・1837-1846 行）。今は --target other:win の起こしの後に --state-dir だけの起こしで target anchor:orchestrator を測るので、この行の後は 1 つ目の起こしの row の target other:win が勝って落ちる。2 つの起こしの順を入れ替える（--state-dir だけで anchor:orchestrator の row を書いた後に --target other:win で起こし other:win を測る・明示の --target が登録 row に勝つ事も測る形になる）。行の数は増やさない。doc の注の (1) の字は替えない。

      数えた残り（main の 0da12ada の字・grep）。長い形の既定に当たる呼びは e2e の launch_default_run の 7 か所（launch.rs 1828・1840・1843・1866・1879・1882 行）と、init の 9 段目の子（init.rs 668 行）と、init の歯の seat launch --account a1（main.rs 1284 行）。row を書いた後に既定の target を測るのは 1843 行の 1 か所だけで、4 つ目の項で直す。1866・1879・1882 行の周は断りの周で row が無い。init の子と main.rs 1284 行は同じ鍵の row が無い時にだけ走る（1284 行の前の init の子は no-account で row を書かずに断る）ので、target は今と同じ。ほかの e2e の seat launch の呼び（launch.rs の launch_group_run・seat.rs 1174 行・seat/account.rs 627 行ほか）は --target を明示するので読みを通らない。数を pin する歯（案内の幅・snapshot・kfold の GROUPS）は動かない（usage の字を替えず・kfold の GROUPS は scribe2 の e2e を持たない）。init の歯は row が在れば子を撃たないので、row の読みが足されても 9 段目の行は替わらない（判断の記録 ADR-1063 の init の段の字のまま）。

      判断の記録 ADR-1063 との照らし。ADR-1063 は引数の無い形に限り target を repo の dir 名から解く既定に読み替えた。この行は row の無い時（init が子を撃つ唯一の時）をそのまま残し、row の在る時だけ短い形と同じ読みを足す。明示の引数は既定に勝ち、長い形の 3 つが全部在る時の判定と断りの字は替えない。
  - n: 14
    type: prose
    title: 行 v-follow-fix — 着地の追随の再 gate の審査役の FAIL を、gate の段と同じ直しの周に入れる（memo t3-hub.92.8・設計だけの行）
    body: |
      在りか。差の file は無い（設計だけの行・作り直し v4 の決め D2）。便は器の src 2 file（pipe/cli/run.rs・pipe/cli/resume.rs）と、器の e2e の歯の新しい module 1 file（tests/e2e/pipe/land/flfix.rs）と、その親 tests/e2e/pipe/land.rs の mod の 1 行と、器の設計の文書 scribe2/docs/design/pipeline.md を書く。pipe/land.rs と pipe/follow.rs と pipe/spawn.rs は替えない。tests/e2e/pipe/land/rebase.rs と tests/e2e/pipe/spawn.rs は verify の 3 行目と 4 行目の filter が当たる着地済みの歯の置き場で、書かないので置き場だけの項にする。depends は行 v-after-land（同じノート）。並べない訳: v-after-land の便が pipe/land.rs と着地の終端の stdout の行を今書いているので、この行の歯は v-after-land の着地の後の land の戻りの字で書く。

      なぜ。行 v-gate-fix（ノート surface-v4a の節 9・main f18209d1）は gate の段の審査役の FAIL を直しの周に入れたが、着地の追随の再 gate（pipe/land.rs の fn follow_main の regated・812 行）は範囲の外に置いた。そのため便 t3-hub.92.9.2 と t3-hub.92.7.6 は、追随の再 gate で審査役だけが FAIL を返し（verify は全部緑）、Gated の FAIL の終端になって、席が新しい便で全周をやり直した。同じ差に 1 周目の gate は PASS・再 gate は FAIL で、審査役の判定は揺れる。

      範囲の外に置いた訳と、それを越える形。再 gate は pipe/land.rs の fn land の中の試行の輪（fn turn_round と fn attempt）の奥に在り、land.rs は 1449 行で上限 1500 の余地が 51 行しかない。land の中で runner を起こし直すと、着地の列の番（turn:taken）と候補の木の束ね（pipe/train.rs）を握ったまま実装役の長い turn を挟む。一方、runner の字は land の口に既に在る（pipe/land.rs の struct Land の欄 runner と、pipe/cli/step.rs の fn land_run が --runner を flag で読む）ので、runner が無いことは訳でない。この行は land の中を替えず、land の外の呼び手（pipe/cli/run.rs）で land を包む。land は再 gate の FAIL で、段 Gated の detail verdict:FAIL を記帳し（gate の fn settle）、verdict.json を FAIL にして rc 1 で返る（fn follow_main の Follow::Stopped）。これは gate の段の FAIL と同じ形なので、行 v-gate-fix の fn fix_due と fn mark_fix と fn gate_fixing をそのまま使える。

      形（輪・pipe/cli/run.rs）。fn land_fixing(args, id, runner, manifest, policy) を置く（引数 5 つ）。land_run を撃つ前に verdict_of で便の verdict が PASS かを読み、PASS でない周は land_run の戻りをそのまま返す（Gated の FAIL の便を resume した周に直しの周へ入らない）。PASS の周は land_run を撃ち、rc が RC_REFUSED で fix_due が Round(n) の周は、mark_fix で段 Implemented の detail gate-fix:<n> を 1 件記帳し、stdout の行に run=<id> gate-fix=<n>/<上限> を足し、launch(args, id, runner, policy, &[Stage::Implemented]) と ride_out_rate_limit と gate_fixing を順に撃ち、どれかが rc 0 でなければそこまでの行とその rc で返り、rc 0 なら land_run から繰り返す。Exhausted(v) の周は stdout の行の末に run=<id> gate-fix=exhausted:<v> を足し、land の rc 1 のまま返る。Off の周と rc が RC_REFUSED でない周は land の戻りをそのまま返す。各段の out と err は fn closing と fn chain_noting と同じ畳み方で段の順に積む。fn run_all は land_run の代わりに land_fixing を呼び、runner は Some(runner.as_str()) を渡す。

      形（resume・pipe/cli/resume.rs）。Gated の枝の INCONCLUSIVE でない腕は land_run の代わりに land_fixing を呼び、runner は flag(args, --runner) の字を渡す（--runner の無い周は fix_due が Off を返し、今の 1 回の land と同じ）。印の記帳の後に runner が起きる前に driver が死んだ便は、段が Implemented で最後の RunStage が直しの印なので、今の fn gate_or_finish_fix の枝が runner を起こしてから gate_fixing へ入る（替えない）。その後の着地は列が PASS の Gated の便として resume を起こす今の経路が持つ。pipe land の 1 段だけの口（pipe/cli/step.rs）は替えない。

      周の上限は共有する。直しの周の数えは fn fix_rounds が便の event の段 Implemented の detail gate-fix: の記帳を数える 1 本で、gate の段の周と再 gate の周を分けない。訳は 3 つ。審査役は同じ契約と同じ base..HEAD の全部の差を同じ雛形で判じるので、どちらの周も同じ直しである。判定が揺れる便で別に数えると、1 便の実装役の起こし直しが 2 倍の上限まで伸び、席へ返す手番が遅れる。別の rules 行を足すと行と kind の数の pin（埋め込み manifest の行数 117・kind の母集団 102・外形の snapshot）が動き、この行の write-set が 4 file 増える。

      形（器の設計の文書）。pipeline.md の §73 の範囲の外の段の land の追随の再 gate の句を、pipe run と pipe resume の着地は fn land_fixing が同じ直しの周に入れ、pipe land の 1 段だけの口は輪を持たない、の字に直し、§73 の末に上の形と上限の共有の訳を足す。

      歯（tests/e2e/pipe/land/flfix.rs・接頭辞 flfix_）。親 tests/e2e/pipe/land.rs の mod の並びに mod flfix; の 1 行を足す。助けは module の中に置く: 行 runner.gate_fix_rounds を値で持つ rules の file を書く助け、呼びの印の file に 1 行ずつ足して呼びの数を数え、呼びの数に応じて FAIL か PASS を返す偽 lens、stdin を run ごとの file に写し毎回違う 1 行を足して commit する偽 runner（行 v-gate-fix の歯 gfix_ の偽 runner と同じ形・同じ字を書くと 2 回目の commit が空で Failed に倒れる）。main を進める commit は検出線の面（pipe/land.rs の DETECTION_SCOPE）に触れる path に置き、再 gate を省く形（regate=skipped）に倒さない。1 本目の歯 flfix_regate_fail_restarts_the_runner_and_lands、2 本目 flfix_rounds_are_shared_with_the_gate_stage（gate の段の直しの周は pipe resume の Implemented の便の撃ちで 1 度使う）、3 本目 flfix_zero_rounds_name_exhausted_without_a_runner、4 本目 flfix_single_land_and_a_failed_verdict_stay_outside。歯は振る舞い（rc・stdout の行・event の記帳・偽の道具の呼びの数）で測り、source の字を照らさない。

      done と verify の対応。1 つ目から 4 つ目と 7 つ目の項は verify の 2 行目（歯 flfix_）、5 つ目は 3 行目（着地済みの追随の歯 pipe_land_rebase_・新しい周の口を通らない pipe land の歯の守り）、6 つ目は 4 行目（着地済みの歯 gfix_）が測る。7 つ目は pipe run の経路（fn run_all の land_fixing）を測る（検証係 v363 の所見で足した）。1 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので verify に書かない。入口の赤は、main の器の着地の段が直しの周を持たないので 2 行目の 1 本目から 3 本目と 7 つ目の項の歯が落ちる（4 本目は今の振る舞いのまま緑）。動く着地済みの歯は 0 本である。e2e の歯が --rules に渡す一時の manifest（tests/e2e/pipe.rs の write_rules_capped と ceiling_rules・tests/e2e/pipe/dispatch.rs の dispatch_rules）は行 runner.gate_fix_rounds を持たず fix_due が Off を返すので、pipe run と pipe resume を撃つ着地済みの歯の 22 か所はどれも今の振る舞いのままで、再 gate の FAIL を作る着地済みの歯 5 本は pipe land・Gated の FAIL・pipe regate の口を撃つ（新しい周の口を通らない・検証係 v363 が照らした）。値 0 の行は今の振る舞いを保たない（stdout の末に字 gate-fix=exhausted:0 を足す）ので、今の振る舞いを保つのは行の無い manifest か --runner を渡さない撃ちである。噛みは撃たない（決め D2）。

      数えと大きさ。器の src の file の行の数（main e7d40c76）は run.rs 332（見込み +45）・resume.rs 351（見込み +3）で、上限 1500 に収まる。e2e の親 land.rs には mod の 1 行を足すので growth に 1 行を置く。

      範囲の外。pipe/land.rs の中の試行の輪と列の番と候補の木（pipe/train.rs）は替えない。列の候補の積みの中で後ろの便の再 gate が落ちる形（train の Dissolved）は今の経路のまま。追随の後に起こし直した runner の質問 record が commit を持つ周の Failed（pipe/spawn.rs の fn settle_question）は、この行で替えない（割り方は起草係 w362a の notes）。
