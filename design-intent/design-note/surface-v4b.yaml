       registered=dold:dwin next=tmux rename-session -t dnow dold
      理由の字・route の字・ほかの理由の断りは 1 字も替えない（着地済みの歯 hook_role_guard_route_unregistered_names_seat_register は登録の無い席で撃つので、末の字は足されない）。
      形（docs/design/seat-roles.md の 5 節）。47 行の字「登録の無い席は 0 byte（断りも出さない）」に、同じ anchor で窓の名が同じ登録 row が在る時はずれの 1 行だけを出すことと、権能の門の断りの末の字を 1 文で足す。

