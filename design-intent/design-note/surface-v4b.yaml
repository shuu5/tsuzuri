審査で落ちた行 t-ruling-one を直し（直す歯の file 7 本・直す歯 26 本・消す歯 2 本を数え直して歯ごとの期待値の字を節 4 に書き、struct Answer を消した・係 w360a）、行 v-review-material-refuse の done の二重鉤括弧の字のうち節 11 に無い 7 つ（歯の期待値の字）の印を鉤括弧に替えた（器の preflight の section-literal の断りの直し・席）。第 0.13 版（2026-10-06）は契約の審査で 2 度目に落ちた行 t-ruling-one の節 4 の答えの口の stdout の照らしを、RulingId の id_shape に頼らず問いの id と分の字と番号の形で照らす字にした（席）。第 0.14 版（2026-10-06）は便 t3-hub.92.9.2 の gate の FAIL（審査役の所見 3 つ）を受け、行 v-review-material-refuse の節 11 の字を 3 か所直した（本体の呼び手が無くなる fn requirements_text を review.rs の末の tests module の助けへ移し本体の途中に行頭の #[cfg(test)] を置かない・既定の toy の FR4 の本文の行を字「縦 1 本を通す。」と名指す・vrmiss.rs の頭の //! を 2 本にする・席）。第 0.15 版（2026-10-06）は便 t3-hub.92.6.4 の実装役の問い（accept の引数 6 つは clippy の too_many_arguments の閾値 5 で落ちる）に答え、行 t-ruling-one の節 4 の ruling::accept と batch::accept の引数を、器の program と置き場を型の別名 Vessel の組 1 つにした 5 つの字に直した（実装役の commit の形を採る・席）。第 0.16 版（2026-10-06）は memo t3-hub.92.8（作り直し v4 の段 S5・持ち主の決め D6）の器の行 v-follow-fix（着地の追随の再 gate で審査役だけが落とした便を、pipe run と pipe resume の着地の段で同じ worktree の直しの周に入れる・上限は rules 行 runner.gate_fix_rounds を gate の段と共有・節 14・depends は v-after-land）を足した。起草は係 w362a。席は検証係 v363 の所見（動く着地済みの歯は 0 本・pipe run の経路を測る歯が無い）を受け、done の 7 つ目の項と歯 flfix_run_regate_fail_restarts_the_runner_and_lands を足した。

sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      持ち主は 2026-10-06 に、tsuzuri のワークフローを作り直すと決めた（決め D1〜D6 は全部推奨・memo t3-hub.91.4 の notes 2026-10-06 08:11・発話 2026-10-06T08:08:35.348Z の逐語の頭「D1-6はすべて推奨で」）。D1 は契約の正本を台帳の bead に移して設計ノートを退ける。D2 は起草係を設計だけにし、差の file・噛み・適用の script を止める。D3 は main への push ごとの CI を止め、日に 1 度の全部の撃ち（xtask daily）に寄せる。D4 は memo の起票に繋ぐ門を置く。D5 は作業の状態を台帳の作業中の bead に置き、turn の終わりの門で古さを止める。D6 は gate の FAIL を終端にせず、便の中で 2 周まで直す。

      置き場。作業中の計画の正本は台帳の epic t3-hub.92 と、子の段の memo（S1〜S9）である。このノートはノート surface-v4a の続きで、その段の行を D1 の着地まで置く仮の置き場で、D1 の着地の後に廃止する。行は差の file を持たない設計だけの行で、便の実装役が契約の節の字から書く（D2）。
