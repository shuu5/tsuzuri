  - n: 3
    type: prose
    title: 行 f-gate — 問いの起票の門（tz hook question-gate）
    body: |
      なぜ。要件 FR4（問いの起票の門・近傍の処分の宣言）は、席が問いを台帳に置こうとしたとき、門（PreToolUse の guard）が、問いが touches を 1 つ以上持ち、touches の各節点から根拠と影響の各 1 段の近傍のうち、種類が条・規則行・発効した判断の記録・要件の 4 つの節点（次数が 30 を越える hub は除く）の全部に処分（touches か not-relevant）が宣言され、束の要約値が今の版と一致するときだけ通し、通さないときは処分の無い id を全部名指し、処分の要る節点が 30 を越える問いは まだ分からない として通さず touches を絞った問いに分けさせることを求める。受入 AC6 は 4 通り（1 段の近傍の 4 種の節点のうち hub を除く節点に処分の無い id が 1 つ在れば deny してその id を列挙・全部処分すれば allow・束の要約値が古ければ deny・処分の要る節点が 30 を越えれば まだ分からない で断る）を tests/fixtures/guard/question-4/ の fixture で見て、hub と 4 種の外の節点が名指されないことを見る。この絞りは持ち主の裁定 t3-hub.55.2（裁定 id = t3-hub.55.2:20260927T2233Z-1）で srs の字を改めたもの（要件 FR4 の note）。傘の行 f（設計ノート surface-base）の done (1) にあたる。席の設定（plugin の hooks.json の PreToolUse・matcher Bash）へ門を入れるのは、裁定 t3-hub.55.3（裁定 id = t3-hub.55.3:20260927T2233Z-1）で、この行の着地の後の行 f-gate-install が行う。この行は plugin の dir を書かない。配達の hook（f-deliver）と届いていないの印（f-undelivered）と、premises に方針の id を持つかの検査（要件 FR8）は、この行の外。
      在りか（main 1c26a6f で確かめた）。中核の crate の lib.rs は doc の注と pub mod の 8 行（account・delivery・graph・ledger・next_step・pipeline・question・seat）で、doc はどの関数も file も子 process も時計も触らないと書く。中核の graph の module（src/graph/mod.rs）の pub struct Inputs（pub な欄 design_index・ledger・events の 3 つの &str）と pub fn build（&Inputs を受け Graph を返す）は、設計の索引の字の行を、5 列（id・種類の語・file・要約値・題・タブ区切り）なら節点、3 列（端・端・型の語）なら辺と読み、行頭が番号記号の行と空の行を捨て、字が空か列の数か種類の語の合わない行が在れば出所 Design を読めないとする。節点の種類の語は契約の型の crate の graph の module の NodeKind の serde の語で、Article が 条、Rule が 規則行、Adr が 判断の記録、Req が 要件、Nfr が 非機能要件、Ac が 受入基準、Goal が 目的、Norm が 規範文。辺の型は設計文書の 17 型（basis・goals・rules・adrs・refs・verify.ac・verifies ほか）で、ほかの型の辺の行は数えて捨てる。台帳の字は bd の一覧の JSON の配列で、字が空か配列として読めなければ出所 Ledger を読めないとし、読めれば bead ごとに節点（要約値は無し・題は 36 字に切る）を作り、dependencies の parent-child ほか 4 型を辺にし、label intake:question の bead の metadata の touches の id へ型 touches の辺を引く。event log の字が空なら出所 Runs を読めないとする。pub struct Graph の pub な欄は nodes（Vec の GraphNode）・edges（Vec の GraphEdge・欄 from・to・edge_type）・unread（Vec の Source・読めない出所を Design・Ledger・Runs の順に積む）ほかで、pub fn node（id の &str を受け Option の &GraphNode）・degrees（BTreeMap の &str と usize・節点ごとの隣の数で、同じ隣は辺が何本でも 1、自分へ戻る辺と端の節点の無い辺は数えず、辺の無い節点は表に無い）・status（&GraphNode を受け Option の String・bead は状態の字・走行は段の字・ほかは無し）が在る。Source は閉じた 3 つで serde の語は design・ledger・runs。GraphNode の pub な欄は id・kind・file・digest（Option の String・設計の索引の 8 字）・title ほか。設計の索引は判断の記録の状態（proposed・accepted・retired）の欄を持たない（5 列・席の folio の graph --print の出力で確かめた）。中核の question の module の pub fn touches（serde_json の &Value を受け Vec の String）は、metadata（object か、object を JSON にした字）の鍵 touches の字 1 つか字の配列を読み、空の字を除く。中核の delivery の module の pub fn block は serde_json の Map と Value で hook の答えの JSON を組む（同じ組み方を使う）。中核の crate の直接依存は serde と serde_json と契約の型の crate。契約の型の crate の ledger の module の pub const QUESTION_LABEL（字 intake:question）と pub fn fnv1a64（&[u8] を受け u64・初期値 0xcbf29ce484222325・乗数 0x100000001b3）と、LedgerItem の digest（16 字の 16 進の小文字に畳む）、graph の module の pub fn natural_cmp（2 つの &str を受け Ordering・数字の並びは数として比べる）を使う（書かない）。
      在りか（境界の crate・main 1c26a6f で確かめた）。Cargo.toml の直接依存は契約の型の crate と中核の crate だけで（xtask の歯 skeleton_boundary_std_only_and_bin_tz が見る）、境界は JSON を自分で読めないので、hook の入力と metadata の JSON を読む判じと答えの JSON を組むことは中核の gate に置く。lib.rs は doc の注（境界は面の server と席の hook と問いの起票の門を置き、行ごとに 1 文）と pub mod の 6 行（acct・accthb・cli・hook・server・stage）。src/hook/mod.rs は doc の 1 行（行 f-stop で停止の hook を置く）と pub mod stop の 1 行。src/hook/stop.rs（行 f-stop・この行は書かない）は pub const USAGE、pub struct Args（欄 repo・bd・bdw）、pub fn parse（&[&str] を受け Result の Args と String・--名 値 か --名=値 を読み、--repo が無い・知らない旗・同じ旗が 2 度・空の値を断る）、pub fn run（&[&str] を受け u8・0 か 1）を持ち、repo の下の .git が file（git の worktree）なら黙る。src/main.rs の fn main は引数（先頭を除く）の &str の slice を match し、腕は surface と serve の残りを fn serve に、graph の残りを cli の graph の run に、hook と stop の残りを hook の stop の run に渡し、ほかを腕 _ の fn usage（使い方の誤り・rc 1）に渡して、rc の u8 を ExitCode にする。module の doc は tz の口ごとに 1 行を持ち、最後の行が tz hook stop。server の ledger の module の pub const BD（字 bd）・BD_ARGS（--readonly・list・--all・--limit・0・--json の 6 語）・BD_TIMEOUT（5 秒）と pub struct Source の pub fn new（repo と program）と text_alone（Option の String・cwd を repo にして program を BD_ARGS で撃ち、起動できない・rc が 0 でない・UTF-8 でない・5 秒を越える、のどれでも None）。server の design の module の pub const FOLIO（字 folio）・DESIGN_DIR（字 design-intent）・FOLIO_ARGS（graph・--print・--dir の 3 語）・FOLIO_TIMEOUT（5 秒）と pub struct Design の pub fn new（repo と program）と text（Option の String・cwd を repo にして program を FOLIO_ARGS と repo の下の design-intent の path で撃ち、同じ 4 つの形で None）。この行はこの 2 つの module を書かず、名と値をそのまま使う。
      形（門が見る呼び出し・中核の gate の drafts と segments）。席は問いを bdw の create で置く（label intake:question・親は --parent・名指した節点は metadata の touches）。drafts（payload の &str を受け Vec の Draft）は、Claude Code の PreToolUse の hook の入力（標準入力の JSON の object）の鍵 tool_name が字 Bash で、鍵 tool_input の object の鍵 command が字のときだけ command を読み、ほかは空を返す。command を segments で一続きの語の列に分け、一続きごとに、頭の代入の語（等号を持ち、等号の前が空でなく英数字と下線だけの語）を飛ばした最初の語の、最後の斜線の後の字が bd か bdw で、その後の語のどれかが字 create と同じで、label の旗の値をコンマで分けて前後の空白を除いた語のどれかが intake:question のものを、問いの起票の下書き（Draft）として command の順に拾う。label と metadata の旗は、その一続きの最初の語（bd か bdw）より後の全部の語から読む。label の旗は、語 --labels・--label・-l の次の語と、--labels= か --label= か -l= で始まる語の等号の後の字と、2 つのハイフンで始まらず -l で始まり 3 字目が等号でない 3 字以上の語の -l の後の字で、何度在っても全部を見る。Draft（Debug と Clone と PartialEq と Eq・pub な欄 metadata = Option の String）の metadata は、語 --metadata の次の語（次の語が無ければ数えない）か --metadata= で始まる語の等号の後の字で、何度在っても最後の値、無ければ無し。segments（&str を受け Vec の Vec の String）の分け方は器（scribe2）の起票の門と同じにする（計画 3 節の席の決めの、器と揃える）。引用符の外では、空白の字で語を切り、セミコロン・アンパサンド・縦棒・改行で語と一続きを切り、逆斜線は次の 1 字をそのまま語に足す。一重引用符の中は次の一重引用符まで字のまま。二重引用符の中は次の二重引用符までで、逆斜線は次の 1 字をそのまま語に足す。引用符だけの空の語も 1 語に数える。閉じない引用符は command の終わりまで続く。語の無い一続きは捨てる。変数の展開・command の置換・here document・sh -c の中・@ で始まる file の形は解かない（字面のまま読み、JSON の object として読めない metadata は下の (1) で止まる）。
      形（判じ方・中核の gate の judge と needs）。judge（&[Draft] と &Graph を受け Gate）は下書きを順に見て、最初に通さなかった下書きの答えを返し、全部が通れば Allow（下書きが 0 なら Allow）。下書きごとに次の順で見る。(1) metadata の字が在って JSON の object として読めないなら Deny の metadata。字が無ければ空の object として (2) へ。(2) object を question の touches に渡した id が 0 なら Deny の no-touches。(3) グラフの unread に Design か Ledger が在れば Unknown の unread で、ids はその出所の語（unread の順・runs は数えない）。設計の索引が読めなければ 4 種の節点が無く、台帳が読めなければ hub の次数（台帳の touches の辺も数える）と台帳の id が決まらないので、通さない（要件 FR3 と同じく、読めなければ まだ分からない）。event log は読まない（走行の節点は 4 種の外で、走行の辺は設計の節点の次数に入らない）。(4) touches の id のどれかが node で引けなければ Deny の unknown-id で、ids はその id。(5) needs（&Graph と touches の &[String] を受け Vec の String）で処分の要る節点の列 R を組む。R は、touches の id ごとに、両端の節点がグラフに在り自分へ戻らない辺の相手の端の id のうち、節点の種類が KINDS の 4 つ（Article・Rule・Adr・Req）のどれかで、degrees の値が HUB_DEGREE（30）以下のものの和。処分は touches の id と、metadata の鍵 not-relevant の object の鍵のうち値が字で前後の空白を除いて空でないもので、not-relevant が object でなければ処分は touches だけ。R のうち処分の無い id を処分の無い列とする。(6) R の数が NEEDS_CAP（30）を越えれば Unknown の too-many で、ids は処分の無い列、digest は今の束の要約値。(7) 処分の無い列が空でなければ Deny の undisposed で、ids はその列、digest は今の束の要約値。(8) metadata の鍵 digest の値が字で今の束の要約値と同じでなければ（鍵が無い・字でないを含む）Deny の stale で、ids は空、digest は今の束の要約値。(9) ほかは通す。どの ids も重ねずに natural_cmp の順に並べる。(1) から (4) の答えの digest は無し。止めるときに名指す処分の無い id は、近傍を組んだ後の (6) と (7) で全部を出し、(8) では処分の無い id が無い。hub は処分の要る節点から除くだけで、touches に hub を名指した問いはその隣から R を組む。種類は 4 つの語のとおりに読み、非機能要件・受入基準・目的・規範文ほかの設計の節点と台帳と走行の節点は R に入らない。設計の索引は判断の記録の状態を持たないので、門は判断の記録の節点を状態によらず 4 種に数える（発効していない判断の記録は処分を求めすぎる側に倒れる・問いについては閉じる側に倒す計画 3 節の席の決め・今の main の索引の判断の記録 15 のうち proposed は ADR-1 の 1 つ）。
      形（定数・中核の gate）。pub const HUB_DEGREE（usize・30・次数がこれを越える節点が hub）・NEEDS_CAP（usize・30・処分の要る節点がこれを越える問いは まだ分からない）・KINDS（NodeKind の 4 つの配列・Article・Rule・Adr・Req の順）・NOT_RELEVANT（&str・字 not-relevant）・DIGEST（&str・字 digest）。metadata の鍵の名は、着地済みのグラフの組み立てと question の touches が読む touches と、要件 FR4 の処分の語 not-relevant と、束の要約値の digest の 3 つ（器〔scribe2〕の台帳は問いの metadata の鍵を決めていない）。bd の create の --metadata は JSON の字をそのまま bead の metadata に置くので、3 つの鍵は問いの bead に残り、touches の辺は着地済みのグラフの組み立てがそのまま読む。
      形（束の要約値・中核の gate の bundle_digest）。bundle_digest（&Graph と touches の &[String] を受け String）の束は、touches の id のうち node で引けるものと needs の R の和。束の id を重ねずに natural_cmp の順に並べ、1 節点 1 行で、id・節点の digest（無ければ空の字）・status の値（無ければ空の字）・題の 4 つをタブ 1 つでつなぎ、行を改行 1 つでつなぎ（末尾に改行を足さない）、UTF-8 の byte を fnv1a64 で畳んで 16 字の 16 進の小文字にする（着地済みの LedgerItem の digest と同じ畳み方）。束の外の節点（hub・4 種の外・台帳の外の節点）が変わっても値は変わらず、束に節点が増えるか、束の節点の要約値か状態か題が変われば変わる。設計文書は束の要約値の出所を決めていないので、門の答えを出所にする。席は undisposed か stale で止められた答えの字の要約値を metadata の digest に写して置き直す（問いを置くには少なくとも 2 度撃つ）。
      形（型と答えの字・中核の gate の Why と Gate と output）。Why は閉じた 8 つ（Args・Metadata・NoTouches・Unread・UnknownId・TooMany・Undisposed・Stale）で Debug と Clone と Copy と PartialEq と Eq を持ち、pub const ALL（この順の 8 つ）と pub fn word（self を受け &'static str・順に args・metadata・no-touches・unread・unknown-id・too-many・undisposed・stale）が在る。Gate は Allow と、欄 why = Why・ids = Vec の String・digest = Option の String を持つ Deny と Unknown で、Debug と Clone と PartialEq と Eq を持つ（歯は Gate の値を assert_eq で比べる）。judge は Unknown を unread と too-many だけに、Deny をほかの 5 つの語だけに使う（args は境界が組む）。output（&Gate を受け Option の String）は Allow で None、Deny と Unknown で JSON の object 1 つの字を返す。鍵は hookSpecificOutput だけ、その中の鍵は hookEventName（字 PreToolUse）と permissionDecision（字 deny）と permissionDecisionReason の 3 つ。理由の字は、Deny なら字「問いの起票の門は止める（」、Unknown なら字「問いの起票の門は まだ分からない（」、続けて理由の語と全角の閉じ括弧、ids が在れば空白と字「id =」と各 id の前に空白 1 つ、digest が在れば空白と字「要約値 =」と空白と値、最後に空白と字「次の一手 =」と空白と理由ごとの 1 文（字は実装が決め、空でなく、字「id =」と字「要約値 =」を含まない）。Claude Code の hook の決まりでは、rc 0 で標準出力が空の hook は決めを持たず、呼び出しはふつうの許可の流れを通り、rc 0 の標準出力の JSON の permissionDecision の deny は呼び出しを止めて理由を席に返す。permissionDecision の allow は許可の仕組みを飛ばすので、門は allow を出さない（通すことは止めないことで、器の起票の門と許可の設定はそのまま効く）。受入 AC6 の allow は judge の Allow と標準出力の 0 byte で、deny は Deny、まだ分からない は Unknown で見る。
      形（境界の入口）。tz hook question-gate --repo <dir> [--bd <program>] [--folio <program>]。src/hook/mod.rs に pub mod question_gate の 1 行と doc の 1 文を足し、子 module question_gate（src/hook/question_gate.rs）に次を置く。pub const USAGE（使い方の 1 行の字・字 tz hook question-gate を含む）。pub struct Args（pub な欄 repo = PathBuf・bd = OsString・folio = OsString・Debug と Clone と PartialEq と Eq）。pub fn parse（&[&str] を受け Result の Args と String）は stop の parse と同じ読み方で、--repo が無い・知らない旗・同じ旗が 2 度・空の値を断り、省いた bd と folio は着地済みの BD と FOLIO の字。pub fn graph（&Args を受け中核の Graph）は、repo と bd の Source の text_alone と、repo と folio の Design の text を並べて撃ち（std の thread の scope・待ちは 1 本分の 5 秒の上限まで）、読めない方を空の字にして、event log を空の字にした Inputs を中核の build に渡す。pub fn answer（&Args と payload の &str を受け Option の String）は、中核の drafts が空なら子 process を 1 本も撃たずに None を返し、空でなければ graph を 1 度組んで judge と output の値を返す。pub fn run（&[&str] を受け u8）は、標準入力を全部読み（読めなければ空の字）、parse の誤りか repo が dir でないときは、drafts が空なら標準エラーに字 tz hook question-gate と誤りと USAGE を書いて 1 を返し（Claude Code の決まりで rc 1 は止めない誤りで、呼び出しはそのまま進む）、空でなければ Deny の args（ids は空・digest は無し）の output の字を標準出力に 1 行で書き、標準エラーに同じ字 tz hook question-gate と誤りと USAGE を書いて 0 を返す（門の引数の誤りは問いの起票だけを断り、ほかの Bash は素通しにする・計画 3 節の席の決め）。どちらも子 process を撃たない。引数が正しければ answer が Some ならその字を標準出力に 1 行で書いて flush し、0 を返す（書けなければ標準エラーに 1 行を書いて 0）。rc 2 は使わない。停止の hook と違い、repo が git の worktree でも黙らない（器が便の runner に写す plugin でも門が効く・計画 4 節の行の字）。hook は file を書かない（台帳は bd の読み取りの口・設計の索引は設計の道具の子 process）。main.rs は fn main の match に、hook と question-gate と残り rest の slice を hook の question_gate の run に渡す腕を 1 つ、腕 _ より前に足し、module の doc に tz hook question-gate の 1 行を足す。境界の lib.rs は doc の注に行 f-gate の 1 文だけを足し、中核の lib.rs は pub mod gate の 1 行と doc の 1 文だけを足す。
      着地済みの歯（直すものは無い・直さずに通るもの・中核と境界と xtask の tests と src の cfg(test) を grep で確かめた）。hbconf_main_parse_fills_the_rest_with_new（tests/hbconf.rs・=）は main.rs の字に Config::new が在り、Config と空白と開き波括弧の字の数と ..Config::new の字の数が等しいことを見る（足す腕と doc の行はどちらの字も持たない）。hbconf のほかの歯は server の mod.rs と config.rs と 9 つの歯の file の fn config を読む（この行は書かず、新しい歯の file は fn config を持たない）。fstop_usage_errors_are_one（tests/fstop.rs・=）は tz を引数 hook だけ・hook と nope・hook と stop・stop の --bd の空の値・stop の知らない旗・stop の --repo が file で撃ち、rc 1 と空の標準出力を見る（足す腕は第 2 の引数が question-gate のときだけ当たるので、この 6 つは今のまま腕 _ か stop の腕に落ちる）。fstop の残りの歯は stop の module の関数と tz hook stop を撃つ（stop.rs と hooks.json を書かない）。中核の fstop_plugin_stop_entry は plugin の plugin.json と hooks.json を読む（書かない）。kcli の歯は tz graph を撃つ（graph の腕を変えない）。server_ の歯は tz surface serve を撃つ（serve の腕を変えない）。brand_path_written_once_in_contract と shb_wire_takes_direction_only は契約と境界と面の src の全部の file の、二重引用符で囲んだ口の path の字を数える（この行は口の path を書かない）。中核の fmark_delivery_is_pure と acctcore と csled の同じ形の歯は、自分の module の file の字だけを読む（gate.rs を読まない）。中核の graph・gview・question の歯は build・degrees・touches を呼ぶだけで、この行はそれらを変えない。xtask の skeleton_ の歯は Cargo.toml と Cargo.lock を読む（触らない）。中核と境界の lib.rs と src/hook/mod.rs の字を読む歯と、tests/fixtures の dir を列挙する歯は無い。
      測り方（fixture）。新しい dir の tests/fixtures/guard/question-4/ に 3 つの file を置く。index.tsv は設計の索引の形で、頭に番号記号の注の行を持ち、節点の行は FR4（要件・srs.yaml・要約値 aaaa0004・題 問いの起票の門）・FR3（要件・srs.yaml・aaaa0003・不変条件の数え方）・NFR2（非機能要件・srs.yaml・aaaa0102・読みの速さ）・AC6（受入基準・srs.yaml・aaaa0006・問いの起票 4 通り）・GOAL2（目的・srs.yaml・aaaa0002・全体像を見落とさない）・P-14（条・constitution.yaml・aaaa0014・判断を代行しない）・ADR-2（判断の記録・adr/ADR-2.yaml・aaaa0202・面の技術を今決めない）・ADR-7（判断の記録・adr/ADR-7.yaml・aaaa0207・面の模型）と、R-1 から R-30 の 30 行（規則行・rules.yaml・要約値 bbbb0001 から bbbb0030・題 規則の行 1 から 規則の行 30）。辺の行は、FR4 から P-14 へ basis・FR4 から GOAL2 へ goals・FR4 から ADR-2 と ADR-7 へ adrs・FR4 から AC6 へ verify.ac・AC6 から FR4 へ verifies・FR4 から R-1 へ rules・FR4 から FR3 と NFR2 へ refs の 9 行と、ADR-7 から R-1 から R-30 へ rules の 30 行。ledger.json は bd の一覧の形の 2 つの bead で、fx-q（題 問いの門の fixture の根・epic・open）と fx-q.1（題 先の問い・task・open・label intake:question・metadata の touches が FR4 の配列・fx-q への parent-child の依存）。よって FR4 の隣は P-14・GOAL2・ADR-2・ADR-7・AC6・R-1・FR3・NFR2・fx-q.1 の 9 つ、ADR-7 の隣は FR4 と R-1 から R-30 の 31 で hub、R-1 の隣は FR4 と ADR-7。cases.json は JSON の object（鍵 note と cases）で、cases の 4 つの組の欄は name・touches・not-relevant（id と理由の 1 句の字の object）・digest（字 current なら歯が bundle_digest の値に替える）・want（allow・deny・unknown）・why（理由の語か null）・ids。組 one-undisposed は touches が FR4、not-relevant が P-14・R-1・FR3、digest が current、want が deny、why が undisposed、ids が ADR-2。組 all-disposed は not-relevant に ADR-2 も足し、want が allow、why が null、ids が空。組 stale は組 all-disposed と同じ処分で digest が 16 字の 0、want が deny、why が stale、ids が空。組 too-many は touches が ADR-7、not-relevant が FR4、digest が current、want が unknown、why が too-many、ids が R-1 から R-30 の 30 個（R の数は FR4 を含めて 31）。理由の 1 句の字は一重引用符も二重引用符も持たない。
      測り方（中核の歯）。新しい歯の file は中核の crate の tests/qgate.rs で、名を qgate_ で始める（中核の crate は serde_json を直に持つので、歯は fixture の JSON と答えの JSON を読める）。歯は組ごとに metadata の JSON（touches・not-relevant・digest の 3 つの鍵）を字にし、command を字 bdw create --parent=fx-q --labels=intake:question --metadata= と一重引用符で囲んだその字と空白と題の字にし、payload（鍵 tool_name が字 Bash・鍵 tool_input の鍵 command がその字）を JSON の字にして drafts と judge に渡す。done (3) の除いたグラフは index.tsv の字から ADR-7 と R-30 と rules の行だけを除いて組み、done (4) と (5) の変えた下書きとグラフも同じ組み方で歯の中で作る（done (4) の ledger と index の空は build に渡す字を空にする）。done (5) の歯は束を needs で組み、節の定めの行を自分で組んで fnv1a64 で畳み、index.tsv か ledger.json の字を 1 か所だけ変えて組み直したグラフで値を比べる。done (6) の segments の 3 つの command と答えは、(a) 字 a・空白・一重引用符で囲んだ b と空白と c・空白・二重引用符で囲んだ d と逆斜線つきの二重引用符と e・空白・f と逆斜線つきの空白と g・セミコロン・h・縦棒・i・アンパサンド 2 つ・j で、答えは一続き 4 つ（a と b 空白 c と d 二重引用符 e と f 空白 g の 4 語・h・i・j）、(b) 字 x と空白と空の一重引用符で、答えは x と空の字の 2 語の一続き 1 つ、(c) 字 p と空白と閉じない一重引用符の後の q 空白 r で、答えは p と q 空白 r の 2 語の一続き 1 つ。done (6) の drafts の 6 つの形と答えの metadata の列は（どれも歯が tool_name が Bash の payload の command に入れる・J は組 one-undisposed の metadata の JSON の字）、(a) bdw create --parent=fx-q --labels=intake:question --metadata= と一重引用符で囲んだ J と題 → J、(b) /usr/local/bin/bdw create --parent fx-q -l intake:question --metadata と空白と一重引用符で囲んだ J → J、(c) BEADS_ACTOR=seat bd create --label a,intake:question --metadata= と二重引用符で囲み中の二重引用符に逆斜線を付けた J → J、(d) bdw create -lintake:question --parent fx-q と題 → 無しの 1 つ、(e) bdw create --labels intake:question --metadata=a --metadata=b → 字 b、(f) cd /r と 2 つのアンパサンドと (a) とセミコロンと (e) → J と字 b の 2 つをこの順。7 つの空の payload は、tool_name が Edit で tool_input の command が (a) の字・JSON でない字・command が ls -la・label が intake:memo の create・bdw update fx-q.1 --add-label=intake:question・echo bdw create --labels=intake:question・tool_input の command が数 1。done (7) の歯は Why の ALL を順に回し、ids の空と 2 つ・digest の無しと有りの組で Deny と Unknown を組んで output を読む。qgate_pure_module は gate の 6 つの pub fn を fn の型の定数に入れて引数と返りを pin し、5 つの pub const の値と、CARGO_MANIFEST_DIR から読んだ src/gate.rs の字を見る（着地済みの fmark_delivery_is_pure と同じ 5 つの字・doc の注も含めて file のどこにもこの 5 つの字を書かない）。
      測り方（境界の歯）。新しい歯の file は境界の crate の tests/qgate.rs で、名を qgate_ で始める。境界の歯は serde_json を持たないので、JSON の中身は中核の歯が見て、境界の歯は tz の標準出力の字を、同じ字から中核の関数（drafts・build・judge・output・bundle_digest）で組んだ値の字と比べる。qgate_parse_args は question_gate の 4 つの pub fn を fn の型の定数に入れて引数と返りを pin する。場は着地済みの tests/fstop.rs と同じ形で、CARGO_TARGET_TMPDIR の下に歯ごとの作業場（repo の dir と記録の dir）を置き、偽の bd は受けた引数を記録の file に 1 行足してから ledger.json の字を出す script（落とす場は rc 1）、偽の設計の道具は同じく引数を記録してから index.tsv の字を出す script で、tz は CARGO_BIN_EXE_tz を hook question-gate と --repo と偽の 2 つの program の path の旗で撃ち、payload を標準入力に書いて閉じる。done (9) の節の引数は、偽の bd が BD_ARGS の 6 語、偽の設計の道具が FOLIO_ARGS の 3 語と repo の下の design-intent の path。done (9) の作業場は repo の下に .git という名の file を置く（git の worktree の形でも門が答える）。payload の字は歯の中で組む（metadata の JSON の二重引用符と逆斜線は payload の JSON の字の中で逆斜線を付ける）。done (11) の 6 つの payload は done (6) の空の 7 つから数 1 の command を除いたもの。done (13) の ls の payload は command が ls -la の Bash。
      filter の語（着地済みの行と第 3 波から第 9 波の行と表示面の行の verify の語・この行の接頭辞 qgate_ は並べない・113 語）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・nsum_・hcard_・ntime_・ptitle_・ncard_・hsym_・smore_・lcard_・aaround_・hruling_・sxaxis_・plimit_・bport_・fstop_・nsumw_・fmark_・fserve_・cadopt_・tipx_・hcsess_・hcproj_・sesplit_・mstore_・athr_・qblock_・wsteady_・gsum_・nstall_・pfold_・uword_・cround_・cgdom_・csled_・lhome_・shb_・ghb_・nact_・aord_・mtree_・rhold_・wstrip_・flight_・qkey_・stage_term_・stage_cdp_・pwhole_ で、新しい歯の名から先頭の qgate_ を除いた字は、このどれも部分の字として含まない（例 qgate_hook_output・qgate_question_label・qgate_graph_unread・qgate_tz_binary・qgate_stage_x は不可）。着地済みの verify の filter のうち歯の名そのもの（hbconf_main_parse_fills_the_rest_with_new ほか）と server_ で始まる接頭辞（server_read_ ほか）と stage_ で始まる接頭辞は、並べた語を部分の字として含むので、並べた語で足りる。名は中核が qgate_pure_module・qgate_fixture_four_cases・qgate_hub_and_cap_edges・qgate_reasons_in_order・qgate_digest_definition・qgate_segments_and_drafts・qgate_output_shape・qgate_own_names_clean、境界が qgate_parse_args・qgate_bin_names_undisposed・qgate_bin_silent_when_disposed・qgate_bin_other_calls_spawn_nothing・qgate_bin_unread_is_unknown・qgate_bad_args_close_drafts_only・qgate_own_names_clean（どの語も含まない）。
      依存と順。depends は空。行 f-stop（t3-hub.55.5・36ea325）は着地済みで、境界の src/hook の dir と main.rs の hook と stop の腕を置いた（main で確かめた）。表示面の行 i-1（c43cae0）も着地済みで、境界の lib.rs に pub mod stage を足した（計画 5 節の i-1 は f-gate の前の順を満たす）。中核の lib.rs は行 f-mark（着地済み）の後。計画 5 節の順 boundary の main.rs と lib.rs と hook/mod.rs は f-stop → i-1 → f-gate → f-deliver → i-5 → k-parity で、f-deliver と i-5 はこの行の後に流す（f-deliver は hook/mod.rs と main.rs に 1 行ずつ足し、i-5 は main.rs に腕を足す）。行 f-gate-install（plugin/hooks/hooks.json の PreToolUse・matcher Bash と hook の timeout）はこの行の着地の後。行 e-signal（問いの合図）の合図はこの行が書かない。
      依存は足さない。Cargo.toml と Cargo.lock は触らない（中核の crate は serde_json を既に直に持ち、境界の crate は標準 library と workspace の中の 2 つの crate だけのまま）。契約の型の crate と面の crate と server の module と plugin の dir は書かない。

