    title: 目的
    body: |
      台帳の一覧と未反映の一覧の、器（scribe2）の局面の出力の着地までのつなぎの行 2 つ。
      g-ledger-kind は台帳の一覧の項（kit の item と staged_item）の種類の語と open の問いの赤を、地図の節点と同じ読み（epic・memo・問い・契約の順・label intake:memo と intake:question）にする。
      その読み bead_kind は中核の導出グラフから契約の crate へ移し、中核と面が同じ 1 つの fn を引く。状態の語は open の問いを答え待ち、open の memo をまだ分からない（語の辞書の memo 専用の鍵）にし、ほかは bd の status の語のまま。
      memo の局面は器の局面の出力が決め、tsuzuri は判じない（後の行 c-ledger-lc が状態の語の fn を局面の読みに替える）。
      c-unref-now は中核の未反映の一覧を 3 種とも「まだ分からない」にし（後の行 c-unref-lc が局面の出力の読みに替える）、project board の未反映の一覧は局面の出力がまだ無いの理由を出し、
      account board の projects の表は 3 種とも「まだ分からない」の project の未反映の数を数えない（見本と同じ字 ―）。電文の型と口と server は変えない。
