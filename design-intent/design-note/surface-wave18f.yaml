      試作（main bc5d92a の写しに 2 行を当てた木）。verify の nextest の行（xtask を除く 19 行）が全部通り、xtask の check が通った。この行の git diff は 19196 byte（9 file）。噛み: 3 種とも Unknown でも数えると unow_card_not_counted が、理由の字を台帳の字に戻すと unow_list_reason が、memo を読めた 0 件にすると harest_kinds_from_one_list・stats_30_matches_fixture・stats_unreadable_ledger_is_no_ledger が落ちる。
