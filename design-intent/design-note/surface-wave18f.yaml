  - n: 3
    type: prose
    title: 行 g-ledger-kind — 台帳の一覧の項の種類と状態の語を地図と同じ読みにする
    body: |
      在りかの main は bc5d92a（計画 surface-plan v0.70）。この行は台帳の一覧の項（kit の item と staged_item）の右の字の種類の語と状態の語と印の赤を、地図の節点の種類と同じ読みにする。
      なぜ。持ち主の指摘（記帳 t3-hub.1・user 2026-09-28T22:5xZ）と席の点検（2026-09-29・行 c-ledger-stage の着地の後の画面）で、台帳の一覧は memo と問いの bead を○ 未着手 · task と出す。本物の台帳（bd）の memo と問いは issue_type が task で、label intake:memo と intake:question で分かれるのに、一覧は種類の語に issue_type の字をそのまま出し、状態の語を bd の status だけで決めるため。地図の節点は同じ bead を label で memo と問いに分ける（見本 mock v3 の beads の帯の種類 epic・task・memo・question）。memo の局面（処置の待ちか・問いの待ちか・形の崩れか）は器（scribe2）の局面の出力が決め、tsuzuri は判じない（要件 FR13・器の局面の出力の着地で後の行 c-ledger-lc が替える）ので、open の memo はまだ分からないと出す。open の問いは持ち主の答えを待つので答え待ちと出す。
      在りか・契約の crate（write-set）。crates/tsuzuri-contract/src/ledger.rs の pub struct LedgerRow は欄 id・kind・title・status・updated_at・parent・labels を持ち、欄 kind は bd の issue_type の字（BdLine の fn into_item が kind に issue_type を写す）。pub const QUESTION_LABEL は字 intake:question、MEMO_LABEL は字 intake:memo で、impl LedgerRow は fn is_question・is_memo・is_policy を持つ。契約の crate の graph の module の NodeKind は serde の名 epic・task・memo・question の 4 つの枝 Epic・Task・Memo・Question を持つ。
      在りか・中核（write-set）。crates/tsuzuri-core/src/graph/build.rs の pub(crate) fn bead_kind(issue_type, labels) は、issue_type が epic なら Epic、label intake:memo を持てば Memo、label intake:question を持てば Question、ほかは Task を返し（この順）、build.rs は契約の crate の MEMO_LABEL と QUESTION_LABEL をこの fn のためだけに use する。fn add_ledger と中核の ledger の module（src/ledger/mod.rs の use crate::graph::build の bead_kind と read_ledger）がこの fn を呼ぶ。中核の歯 tests/graph.rs の graph_bead_kind_follows_the_order は 4 つの行（k は issue_type epic と label intake:memo・k.1 は task と label intake:question と intake:memo・k.2 は task と label intake:question・k.3 は feature）で節点の種類が Epic・Memo・Question・Task と見る。中核の歯 tests/nsum.rs は build.rs の字を読む（置き場だけの =）。
      在りか・面（write-set）。面の crate は契約の crate にだけ依存する（中核を呼べない）。src/kit.rs の pub fn item(row) は open を status の open か in_progress、alert を row.kind が view の QUESTION_KIND（字 question）かつ status が open、aside を format!(字 {} {} · {}, mark.glyph, mark.word, row.kind)（mark は view の fn mark(status)）にする。pub fn staged_item は段が在れば aside を format!(字 {} · {}, s.word, row.kind) にする。src/view.rs の pub fn mark(status) は open を ○ 未着手 st-open、in_progress を ◐ 作業中、blocked を ⊘ 止まり、deferred を ◌ 先送り、closed を ● 閉じた、ほかを ? 知らない状態 にする。地図の種類の語は src/mapview/band.rs の pub fn kind_key(kind) が閉じた表 KINDS から引く語の辞書の鍵（Epic は k:epic・Task は k:契約・Memo は k:memo・Question は k:問い）で、vocab.json の english の label は epic・task・memo・question。
      在りか・語の辞書（write-set）。vocab.json の rephrase の鍵 gap_unknown（見落としの検査の 3 値の 3 つ目）の label は字 まだ分からない。面の歯 frame.rs の frame_no_heading_words_in_code は、src の file（vocab.rs を除く）に語の辞書の ascii でない label を引用符で囲んだ字が在れば落ちる（試作で memo の語を直に書くと落ちた）。
      在りか・fixture と着地済みの歯（write-set）。tests/fixtures/ledger/board-8.jsonl の 8 行は issue_type に question（bm.5・bm.4・bm.6）と memo（bm.2）の字を使い label を持たない。面の歯 frame.rs の frame_item_shape_follows_status は、この fixture を server の読みで組んだ全部の行で aside が行の欄 kind の字で終わることと、bm.5 の alert が真で bm が偽と見る。面の歯 tests/lstg.rs（行 c-ledger-stage）の fn row(id, kind, status) は labels を空にし、fn lr の zz.3 は row(zz.3, memo, open) で、lstg_list_items は節の板の body の aside の 5 つ目を ○ 未着手 · memo と見る。
      形（契約）。(a) ledger.rs に use crate::graph::NodeKind と pub fn bead_kind(issue_type: &str, labels: &[String]) -> NodeKind（中核の fn と同じ本文と順・doc に中核の地図の節点と面の台帳の一覧の項が同じこの 1 つの読みを引くと書く）を置き、impl LedgerRow の頭に pub fn node_kind(&self) -> NodeKind（bead_kind に欄 kind と labels を渡す）を足す。電文の形は変えない。
      形（中核）。(b) build.rs の fn bead_kind を消し、use の行 tsuzuri_contract::ledger の MEMO_LABEL と QUESTION_LABEL を pub(crate) use tsuzuri_contract::ledger::bead_kind に替える（add_ledger と ledger/mod.rs の use は字を変えずに通る）。
      形（面）。(c) view.rs に use tsuzuri_contract::graph::NodeKind と use crate::vocab の vocab を足し、fn mark の後に pub const MEMO_OPEN_KEY（字 memo_unknown）と pub fn row_mark(row: &LedgerRow) -> Mark を置く。row_mark は (row.node_kind(), status) が (Question, open) なら印 ◷・語 答え待ち・class st-open、(Memo, open) なら印 ?・語は vocab() の term(MEMO_OPEN_KEY) の label（無ければ鍵の字）・class st-open、ほかは mark(status)。doc に memo の局面は器の局面の出力が決め tsuzuri は判じず、後の行 c-ledger-lc がこの fn だけを局面の読みに替えると書く。(d) kit.rs の use を graph の GraphDoc と NodeKind・view の self と Fetched・crate::vocab の label にし（QUESTION_KIND を外す）、pub fn kind_word(row) -> String（label(mapview::band::kind_key(row.node_kind()))）を置く。item の alert は row.node_kind() が Question かつ status が open、印と語は view::row_mark(row)、aside は印と語と kind_word(row)。staged_item の aside は段の字と kind_word(row)。Item の欄 aside の doc の例に ◷ 答え待ち · question を足す。(e) vocab.json の rephrase の gap_unknown の後に鍵 memo_unknown（label まだ分からない・plain は memo の局面は器の出力が決め、tsuzuri は判じず、未着手とは違う 3 行・internal は open の memo の状態の語で c-ledger-lc までのつなぎ）を足す。
      形（fixture と歯）。(f) board-8.jsonl の bm.2 に label intake:memo、bm.4・bm.5・bm.6 に label intake:question を行の末に足す（字の作法は空白の無い ,labels の形）。地図と同じ読みでも 4 行の種類の語は question と memo のままなので、frame_item_shape_follows_status は字を変えずに通る。(g) lstg.rs の use に MEMO_LABEL を足し、lr の zz.3 を issue_type task と label intake:memo の open の行にし、lstg_list_items の 5 つ目の期待を ? まだ分からない · memo に直す。
      変わらない行と読む順と落ちる時（歯で測らず、この行の差分で持つ）。電文 LedgerRow の欄と server の台帳の読みは変えない（種類の読みは面が欄 kind と labels から引く）。view.rs の questions・ledger_groups・kind_rank（欄 kind の字 question と memo で問いの一覧と組と並べを決める読み）と mark は変えない。語の辞書に鍵が無いときの memo の語は鍵の字（面は落ちない）。
      決めた幅（起草の決め・席の決め 2026-09-29）。(h) 読みを 1 つにするため中核の fn を契約の crate へ移し、中核は use で使う（読みを 2 つ置いて歯で一致を見る形は採らない）。(i) 状態の語は open の問いと open の memo だけを替え、作業中・閉じたなどは bd の status の語のまま。(j) 答え待ちは語の辞書に無い字で、印 ◷ と class st-open は既存の字（style.css を書かない）。(k) memo の語は語の辞書の memo 専用の鍵から引く（gap_unknown を借りない）。(l) 段の在る項（板の札の在る bead）は段の字のまま、種類の語だけを替える。
      着地済みの歯（面の crate の tests と中核の tests を grep で確かめた）。kit.rs を読む cadl・itemlink・hsblock・hsderive、view.rs を読む gjst、board-8.jsonl を読む lhome・lcard・ledgerblock・board_min・frame、build.rs を読む中核の nsum、語の辞書の全部の鍵を読む frame・hsym・helpfig・gfresh・nstall・nextact と vocab.json を読む gwv・gfix・hspk は、期待の字が変わらない（試作で通った・置き場だけの =）。中核の graph_bead_kind_follows_the_order は同じ 4 つの行の期待のまま通る（置き場だけの =）。write-set の外で kit の item か Item の欄を使う着地済みの面の歯（grep で確かめた・main bc5d92a）は batchpanel・bhalfpanel・gcoach・hruling・hwstore・mapview・mstore・mtree・nodepage・rvknode・uword で、どれも置き場だけの = に入れて verify で撃つ（第 0.2 版で足した）。hruling は fixture の ledger-questions.json の問いの項を askpage::hist_rows に通し、返る項が入れた項と同じかを見る（item の種類の語や alert を固定の字と比べない）。試作の木（main bc5d92a に 2 行を当てた木）で、この 11 file の歯 91 本が直さずに通った。fixture の board-8.jsonl（形 (f) で label を足す）を読む歯は、repo の全部の crate（契約・中核・境界・面）の tests と src と xtask を grep で確かめると（main bc5d92a）、面の board_min・ledgerblock・frame・lhome・lcard の 5 file だけで、どれも置き場だけの = に在る。境界の crate と中核の crate と xtask に読み手は無い（境界の歯が読む台帳の fixture は ledger/bd-list-8.json と ledger/min-5.jsonl で、この行は書かない）。
      測り方。新しい歯は面の crate の tests/lkind.rs に置き、名を lkind_ で始める（4 本・lkind_bead_kind_order・lkind_row_mark・lkind_items・lkind_names_clean）。filter の語（main bc5d92a の contracts の verify の filter の語 264 を、ほかの語を部分の字として含まない 190 語に畳んだ語と、同じノートのもう 1 つの行の接頭辞 unow_・この行の接頭辞 lkind_ は並べない・191 語）は aaround_・accept_・acchold_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・aface_・afocus_・alean_・aord_・aown_・apop_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadl_・cadopt_・cadq_・cdorm_・cfsplit_・cg9_・cgdom_・cmark_・contract_form_・cround_・csled_・cspk_・ctick_・cupd_・cupdlist_・denv_・dnedge_・dngrp_・dnrow_・dnskip_・ecache_・epolq_・eretry_・flight_・fmark_・fprem_・frame_・fserve_・fstop_・fxpre_・g3g7_・gapspage_・gatt_・gbnote_・gcoach_・gfix_・gfresh_・ghb_・gjst_・glabel_・gnav_・gpface_・gpill_・gpulse_・graph_・gsum_・gtuck_・gview_・gwv_・hacols_・harest_・hasplit_・hbconf_・hbmark_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hdchip_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hshist_・hspage_・hspk_・hsym_・hthr_・http_・hwstore_・iclose_・ilink_・jcount_・jrun_・kcli_・kindlab_・klink_・ksum_・launch_・lcard_・ledgerblock_・lhome_・lidle_・lresume_・lsnap_・lspark_・lstg_・lstore_・mapview_・mkeys_・mlink_・mstore_・mtips_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・nxorg_・parts_・pci_・pclosed_・pfold_・pgz_・pipe_・plimit_・pmisfit_・pmore_・pquest_・pqueue_・project_・ptitle_・punmap_・pwhole_・qblock_・qgate_・qkey_・question_・rbusy_・relay_・rhold_・runsdoc_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・stbp_・stcli_・steady_・sttgt_・sxaxis_・ticker_・tipx_・tkad_・tlic_・topbar_・topfit_・tz_・urpanel_・uword_・wstrip_・unow_ で、新しい歯の名は、このどれも部分の字として含まない（接頭辞 lkind_ も、どの語にも含まれず、どの語も含まない）。歯の file は同じ 191 語を const FILTERS に持つ。
      試作（main bc5d92a の写しに 2 行を当てた木）。verify の nextest の行（xtask を除く 22 行）が全部通り、xtask の check が通った。この行の git diff は 21766 byte（8 file）。噛み: 種類の語を欄 kind の字に戻すと lkind_items と lstg_list_items が、段の項の種類の語を戻すと lkind_items が、row_mark の memo の枝を外すと lkind_row_mark・lkind_items・lstg_list_items が、問いの枝を外すと lkind_row_mark と lkind_items が、MEMO_OPEN_KEY を gap_unknown に替えると lkind_row_mark が、alert を欄 kind の字 question で決めると lkind_items が、bead_kind の memo と問いの順を入れ替えると lkind_bead_kind_order が落ちる。
      依存と順。depends は空（同じノートの行 c-unref-now がこの行の後に流れる）。計画の依存 c-ledger-stage（便 t3-hub.52.104）は着地済み。書く file のうち core/graph/build.rs は計画 5 節の鎖で c-updated（着地済み）の後、計画だけの行 c-map-lc の前。surface/kit.rs と view.rs は c-ledger-stage（着地済み）と g-jst（着地済み）の後、c-ledger-lc と c-ev-kind の前。vocab.json は g-wins-vocab（着地済み）の後。ほかのノートの行との順は便の bead の依存で持つ（席が付ける）。
      範囲の外。view.rs の問いの一覧と組と並べの読み（欄 kind の字）・epic の状態の語・memo と問いの局面の語（後の行 c-ledger-lc）・地図の面・電文と server。
  - n: 4
    type: prose
    title: 行 c-unref-now — 未反映の代用を外し 3 種とも「まだ分からない」にする
    body: |
      在りかの main は bc5d92a（計画 surface-plan v0.70）。この行は未反映の一覧の代用（open の memo を全部未反映と数える）を外し、器（scribe2）の局面の出力を読む後の行 c-unref-lc まで、3 種とも「まだ分からない」を返す。
      なぜ。要件 FR13（srs 第 0.16 版・持ち主の裁定 t3-hub.63.1・判断の表 d36）は、未反映の一覧を器の局面の出力が席の手番とする 3 つ（局面が処置の待ちか形の崩れの memo・未仕分けの発話・裁定の反映待ち）にし、tsuzuri は自分で判じず、局面の出力がまだ無い間は「まだ分からない」と出すと決めた。今の実装は open の memo を全部未反映と数える代用で、行き先が計画か判断の記録に在る memo まで未反映に見える（席の点検 2026-09-29）。受入 AC12 の局面の出力の fixture で 3 つの数と id を見る歯は、局面の出力を読む後の行 c-unref-lc が持つ。
      在りか・中核（write-set）。crates/tsuzuri-core/src/ledger/unreflected.rs の pub struct Unreflected は欄 memos・rulings・requests（どれも Reading<Vec<UnreflectedItem>>）を持ち、fn get と fn unknown（UnreflectedKind::ALL の順の Unknown の種類）を持つ。pub fn unreflected(ledger, now) は pub(crate) fn of_beads(read(ledger) の結果, now) を返し、of_beads は台帳が読めれば open の memo（種類 Memo で is_open）を作った時刻の古い順の Known の一覧にし、裁定と要望は Unknown にする。src/ledger/stats.rs の fn stats は unreflected::of_beads(Some(&beads), now) の値から unreflected_kinds（Known の種類ごとの件数・ALL の順）・unreflected（その和）・unreflected_unknown（fn unknown）を組む。境界の server の board.rs の fn unreflected は中核の unreflected を電文 UnreflectedList に写し、口 /api/unreflected が返す（書かない）。
      在りか・面（write-set）。src/project/ledger.rs の pub fn unref_list は、口の電文の 3 種が全部 Unknown なら Body::Unmeasured(UNREF_UNKNOWN) を返し、pub const UNREF_UNKNOWN の字は server が台帳を読めないので、未反映の一覧はまだ分からない（代用を外すと台帳が読めても 3 種とも Unknown になり、字が事実と合わない）。src/account/projects.rs の pub fn unref_of(project) は台帳が Known なら Some(unref_count(s))（数は s.unreflected・Unknown の種類の名）、Unknown なら None で、DOM の unref_view は None なら数の欄に NONE_MARK（字 ―）を出し、Some なら数と、Unknown の種類が在れば測れていないの印を出す。並べの位 unref_rank は None を後ろにし、unref_class は None で class を on にしない。見本 mock v3 の account/index.html も未反映の数が null なら字 ― を出す。
      在りか・fixture と着地済みの歯（write-set）。tests/fixtures/ledger/stats-30.json の expected は unreflected 3・unreflected_kinds memo 3・unreflected_unknown ruling と request で、欄 unreflected_memos に open の memo 3 つの id と題と年齢を持つ。中核の歯 tests/stats.rs の stats_30_matches_fixture は stats を expected と比べ、stats_unreflected_memos_oldest_first は unreflected_memos を見る。tests/harestcore.rs の harest_kinds_from_one_list と harest_fixtures_agree は memo の件数 3・1・0 を見る。境界の歯 tests/server_view.rs の server_view_unreflected_matches_core は口の memos が Known で空でないと見る。面の fixture（acct-doc.json・ledger-stats.json・metrics-body.json）は電文の形の見本で、memo を Known で持つ電文は後の行 c-unref-lc の後も在りうる形なので替えない。
      形（中核）。(a) unreflected.rs の頭の doc を、どれが席の手番かは器の局面の出力が決め tsuzuri は判じない（要件 FR13）・局面の出力を読む行 c-unref-lc までは 3 種とも「まだ分からない」を返す（代用は外した）に替え、use の graph の NodeKind と super の Bead と read を外す。(b) unreflected(_ledger, _now) は台帳の字と時刻を読まず pub(crate) fn not_yet() を返し、not_yet は 3 つの欄を全部 Reading::Unknown にする（of_beads を消す）。(c) stats.rs の呼びを unreflected::not_yet() に替える（unreflected_kinds は空・unreflected は 0・unreflected_unknown は 3 種の全部になる）。
      形（fixture と中核と境界の歯）。(d) stats-30.json の expected を unreflected 0・unreflected_kinds 空・unreflected_unknown memo と ruling と request にし、使わなくなる欄 unreflected_memos を外す。(e) stats.rs の歯 stats_unreflected_memos_oldest_first を消す（open の memo を古い順に並べる振る舞いが無くなる）。(f) harestcore.rs の (1) の doc と期待を 3 つの台帳で件数も和も 0・unknown は 3 種の全部・memos は Unknown に直し、(2) の stats-30 の期待を空にする。(g) server_view.rs の server_view_unreflected_matches_core は口の 3 種が全部 Unknown と見て、中核の値と電文の字の一致と設計の道具を撃たないことはそのまま見る。
      形（面）。(h) project/ledger.rs の UNREF_UNKNOWN の字を、未反映は器（scribe2）の局面の出力から読むが、その出力がまだ無いので、未反映の一覧はまだ分からない、に替える。(i) account/projects.rs の use に契約の stats の UnreflectedKind を足し、unref_of の Known の腕を s.unreflected_unknown の数が UnreflectedKind::ALL の数より小さいときだけにし、ほかは None（doc に 3 種とも「まだ分からない」なら数えない字 ― と書く）。DOM の unref_view と sum_view は替えない。
      変わらない行と読む順と落ちる時（歯で測らず、この行の差分で持つ）。電文の型（UnreflectedList・LedgerStats・UnreflectedKind）と口と server は変えない。memo の指標（MemoStats の open・昇格待ち・直近 7 日・年齢）は今のまま数える。account board の台帳の表（account/ledger.rs の c-un の cell）と project board の指標の段の未反映の chip は替えない（席の決め 2026-09-29・画面で食い違いが見えたら後の行）。見出しの和 Σ は今のまま（3 種とも「まだ分からない」の行は部分の和の印を持つ）。
      決めた幅（起草の決め）。(j) 数えない字は見本の null と同じ字 ―（NONE_MARK）で、読めない種類の 2 段目は出さない（unref_view が None で早く返す）。(k) 1 種でも読めた project は今までどおり数える（c-unref-lc の後の形）。(l) 理由の字は台帳の読みでなく局面の出力の無さを言う（3 種とも Unknown の電文は、つなぎの間は台帳が読めても読めなくても同じ）。
      着地済みの歯（面の crate の tests を grep で確かめた）。projects.rs を読む hacols・acctproj・hcproj・hasplit・harest・gatt・projmore、project/ledger.rs を読む unrefpanel・kindlab・cadl・hsblock・lcard・lhome・lstg、src の全部を読む frame は、期待の字が変わらない（試作で通った・置き場だけの =）。hacols の unref_of の期待（proj-a は Some・台帳 Unknown の 2 行は None）は acct-doc の proj-a が memo を Known で持つので変わらない。
