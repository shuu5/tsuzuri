    title: 目的
    body: |
      席が問いを bdw で置いた後の board への合図を、Claude Code の PostToolUse の hook で自動にする。合図は自分の repo の boardport の board の口 POST /api/surface/questions へ 1 本だけ送り、board が見つからない・届かない時も席の作業を止めない。
      器の runner の印の在る session では撃たない。
      あわせて、project board の台帳の block の未反映の数を、3 種とも まだ分からない の時は 0 でなく数えない字 ― にし、account board の表と字を揃える。
