  - n: 3
    type: prose
    title: 行 e-signal-send — 問いの起票の後に board へ合図を送る hook
    body: |
      在りかの main は 0121631（計画 surface-plan 第 0.84 版）で、節の字は行 f-gate-install と行 e-signal（どちらもノート surface-wave21d・便は置いたが未着地）の着地の後の字に書く。計画 9 節の計画だけの行 e-signal-send を契約の行にする。承認は計画の裁定を継ぐ。拠りは要件 NFR2（問いの合図から画面の知らせまでの速さ）と規則の行 R-21（合図ありで 200 ミリ秒以内・合図なしでも周期の読みで拾う）と、席の決め（2026-09-29・行 e-signal の起草の問い）の、行 e-signal は合図の口と見張りの起こしだけを持ち送り手を置かず、hook で送る形は後の行にする、の字。
      なぜ。行 e-signal の後、問いを置いた席は自分の board の口 POST /api/surface/questions へ本文 QuestionNudge を手で送る 2 手目が要る。送り忘れると問いは見張りの周期の読み（約 1.5 秒）まで画面に出ない。この行は 2 手目を Claude Code の hook にして、席の手順から外す。
      今の在りか（この行は書かない）。行 f-gate-install の着地の後の plugin/hooks/hooks.json は鍵 hooks の下に鍵 PreToolUse と Stop を持つ。PreToolUse は matcher Bash の要素 1 つで、hook は type command・timeout 10・command は次の 10 語（二重引用符は $CLAUDE_PLUGIN_ROOT/scribe2-runner の全体と 2 つの $CLAUDE_PROJECT_DIR に付く）。語は [ と -e と $CLAUDE_PLUGIN_ROOT/scribe2-runner と ] と || と $CLAUDE_PROJECT_DIR/target/debug/tz と hook と question-gate と --repo と $CLAUDE_PROJECT_DIR。Stop は行 f-stop の字のまま。plugin/.claude-plugin/plugin.json は鍵 name（字 tsuzuri）・version（字 0.1.0）・description（停止の hook と問いの起票の門を言う字）の 3 つ。中核の歯 tests/gins.rs（行 f-gate-install が足す）の歯 gins_pretool_bash_entry は hooks の鍵の列を PreToolUse と Stop の 2 つと見る。
      行 e-signal の着地の後の境界の crate: src/server/events.rs の pub const NUDGE_PATH は字 /api/surface/questions、pub const NUDGED は字 nudged。src/server/routes/nudge.rs の口は POST と NUDGE_PATH の Exact の key で、守り guarded（頭 Origin が在って Host と違えば 403 origin・大きすぎれば 413・本文が契約の QuestionNudge として読めなければ 400 bad-body）の後に Hub の nudge を撃ち、状態 202 と本文 NUDGED を返す。読むだけの server でも受け、台帳に在る id かは見ない。契約の crate の surface の pub struct QuestionNudge は pub な欄 question（型 ledger の BeadId・英数字と点と - と _ の字だけ）を持つ。
      着地済みの境界の crate の在りか（使うだけ・書かない）: src/hook/mod.rs は pub mod question_gate と stop を持つ（lib.rs は pub mod hook）。src/main.rs の fn main は引数の頭の hook と question-gate の腕で hook の question_gate の run を呼び、知らない頭は使い方を出して rc 1。src/acct.rs の pub const GIT は字 git、pub const BOARD_ARGS は config と --get と tsuzuri.boardport の 3 語、pub fn board_port は字の前後の空白を除いて 1 から 65535 の数だけを Some にする。src/stage/url.rs の pub const TAILNET は字 tailscale、STATUS_ARGS は status と --json、pub fn self_hosts は status の Self の DNSName の名・その短い名・TailscaleIPs の住所の字・127.0.0.1 と localhost の順の列（同じ字は 1 度・名が読めなければ None）。src/stage/json.rs の pub fn member（object の一番上の段の鍵の値の字）・items（配列の要素の字）・unquote（字の値を戻す）・escape（字を JSON の字にする）は std だけで書かれている（境界の crate は serde に直に依存しない）。src/server/proc.rs の pub fn capture は program を cwd と引数で撃ち、上限の時間の内に rc 0 で終われば標準出力を返し、ほかは None（子 process は止める）。中核の crate の gate の pub fn drafts は Claude Code の hook の入力の tool_name が Bash のとき tool_input の command を一続きに分け、bd か bdw の create で label に intake:question を持つものを下書きに拾う（門と同じ読み）。
      Claude Code の hook の決まり（この repo の外の事実・Claude Code の hooks の文書）。PostToolUse の hook は、matcher が道具の名に当たる呼びが成功して終わった後に撃たれ、入力に tool_name・tool_input・tool_response を持つ。Bash の tool_response は鍵 stdout・stderr・interrupted・isImage の object。Bash の command が 0 でない rc で終わった呼びは PostToolUse でなく PostToolUseFailure を撃つ（この行は PostToolUseFailure を足さない）。command の hook の async が真なら、Claude Code は hook の process を起こしてすぐ先へ進み、終わりを待たず、timeout も効かせず、hook の rc と標準エラーを席に見せない。PostToolUse の rc 2 は呼びを止めずに標準エラーを席に見せるだけで、ほかの rc は止めない誤り。
      形（hooks.json）。鍵 hooks に鍵 PostToolUse を足し（鍵の並びは PostToolUse・PreToolUse・Stop・PreToolUse と Stop の字は変えない）、値を要素 1 つの配列にする。その要素は matcher（字 Bash）と hooks（要素 1 つの配列）で、その要素は type（字 command）と command と async（真）の 3 つの鍵で、timeout は置かない。command の字（歯の const COMMAND）は、[ と -e と、二重引用符で囲んだ $CLAUDE_PLUGIN_ROOT/scribe2-runner と、] と || と、二重引用符で囲んだ $CLAUDE_PROJECT_DIR の直後に /target/debug/tz、hook と question-signal と --repo と、二重引用符で囲んだ $CLAUDE_PROJECT_DIR を、この順に空白 1 つで並べた字（門の command の question-gate を question-signal に替えた字）。plugin.json は description の字の末に、合図の hook は問いを置いた後に自分の board へ合図を送る、の 1 文を足す（鍵と name と version は変えない）。中核の歯 tests/gins.rs は歯 gins_pretool_bash_entry の hooks の鍵の列の期待の 1 行だけを PostToolUse と PreToolUse と Stop の 3 つに替える（ほかの字は変えない）。
      形（境界の crate）。新しい src/hook/question_signal.rs（pub な module）に次の pub な item を置く。pub const USAGE（字 usage: tz hook question-signal --repo <dir>）・pub const CREATED（bd の create が標準出力に書く起票の行の印・語 Created と issue の後にコロンと空白 1 つ）・pub const WAIT（git と tailnet の道具の待ちの上限・2 秒）・pub const REACH（1 つの住所への接続と読み書きの待ちの上限・500 ミリ秒）。pub fn parse(rest: &[&str]) -> Result<PathBuf, String>（--repo と値の 2 つか --repo= で始まる 1 つだけを受け、空の値とほかの形は Err）。pub fn question(payload: &str) -> Option<BeadId>（gate の drafts が空なら None・tool_response の stdout を stage の json で読み、行ごとに CREATED の後の最初の語を BeadId の new に渡し、最初に Ok になった id）。pub fn places(status: Option<&str>, port: u16) -> Vec<SocketAddr>（self_hosts の列のうち住所として読める字の順の後に 127.0.0.1 を 1 度・status が無いか読めなければ 127.0.0.1 だけ）。pub fn send(addr: SocketAddr, body: &str, wait: Duration) -> Result<u16, String>（TcpStream の connect_timeout と読み書きの timeout を wait にし、要求を 1 本書いて応答を終わりまで読み、状態の行の 2 つ目の語の数を返す）。pub fn signal(repo: &Path, git: &OsStr, tailnet: &OsStr, payload: &str) -> Result<Option<(SocketAddr, u16)>, String>（下の送り方）。pub fn run(rest: &[&str]) -> u8（標準入力を全部読み、parse の Err は使い方を標準エラーに書いて rc 1、ほかは signal を GIT と TAILNET で撃ち、Err なら標準エラーに 1 行を書き、rc 0）。src/hook/mod.rs に pub mod question_signal と doc の 1 行を足し、src/main.rs の fn main に引数の頭 hook と question-signal の腕（hook の question_signal の run を呼ぶ）と doc の 1 行を足す。
      送り方（signal）。question が None なら子 process を撃たずに Ok で None。在れば、git を引数 -C と repo と BOARD_ARGS で cwd を repo にして WAIT まで撃ち、board_port が読めなければ字 tsuzuri.boardport を含む Err。次に tailnet の道具を STATUS_ARGS で WAIT まで撃ち（読めなくても続ける）、places の順に send で本文（QuestionNudge の電文・例 鍵 question に id）を送る。要求は 1 行目が POST と NUDGE_PATH と HTTP/1.1、頭は Host（住所と port）・Content-Type（application/json）・Content-Length（本文の byte の数）・Connection（close）の 4 行だけで、Origin は付けない（口の守りは Origin の無い要求を同じ出所と見る）。最初に応答を読めた住所で止め、状態が 202 なら Ok でその住所と 202、ほかの状態なら字 状態 と数を含む Err。どの住所にも繋がらなければ最後の住所の Err。送るのは 1 回の呼びで 1 本だけ（起票の行が幾つ在っても最初の id・口の合図は見張りの 1 周にまとまる）。hook は file を書かない。
      board の在りか（決めた幅）。port は repo（CLAUDE_PROJECT_DIR）の追跡されない git config の tsuzuri.boardport で、行 i-4 の board の URL と account board の port の引きと同じ鍵（新しい登録の file を作らない・server は file を書かない決まりのまま）。住所は、面の server の bind が loopback か tailnet の住所だけ（条 N-6）なので、tailnet の道具の status の Self の TailscaleIPs の住所を順に、最後に 127.0.0.1 を試す（名の引きの DNS に頼らない）。host の名・住所・port の値は code と追跡される file に書かず、実行の時に読む（行 D-4）。
      どの呼びで何が撃たれるか（歯で測らず、この行の差分と節で持つ）。席（印の無い plugin の根）では、Bash の道具の呼びが成功して終わるたびに sh と tz が async で起こされ、席は待たない。問いの起票でない command は tz が標準入力を読むだけで子 process を撃たずに終わる。問いの起票（bd か bdw の create で label intake:question・門を通って rc 0 で終わった呼び）で、stdout に起票の行が在るときだけ git と tailnet の道具を 1 度ずつ撃ち、合図を 1 本送る。Bash でない道具の呼びと、rc が 0 でない Bash の呼び（PostToolUseFailure）では撃たない。器の runner（器が写す plugin の根に印 scribe2-runner が在る）では印の検査が真で tz を撃たない（行 f-gate-install と同じ形・runner の tz は組みかけか無い）。
      落ちた時に席の作業を止めない形か。async なので、どの落ちでも席は待たず、rc と標準エラーは席に見えない。tz が無ければ sh が rc 127、古い tz は使い方を出して rc 1、boardport が無い・tailnet の道具が無い・board が落ちている・届かない・断った場は標準エラーに 1 行を書いて rc 0。最も長い場でも git と tailnet の道具の 2 秒ずつと住所ごとの 500 ミリ秒の和で終わる（async の hook には Claude Code の timeout が効かないので、上限は hook 自身が持つ）。合図が落ちても、問いは行 e-watch-steady の見張りの周期の読み（約 1.5 秒）で画面に出る。
      歯の組み方（新しい境界の歯 tests/qsig.rs・接頭辞 qsig_）。入力の読みと送り先の列は関数を直に撃つ。送りは作業場（CARGO_TARGET_TMPDIR の下の qsig）に置く sh の script（撃たれると引数を 1 行ずつ記録の file に足し、決めた字を出して決めた rc で終わる）を偽の git と偽の tailnet の道具にし、127.0.0.1 の空き port の受け手（要求を 1 本読んで記録し、決めた状態の code と本文 nudged で答える thread）か、実物の server（Config::new・偽の bd は字 [] を出す・行 e-signal の歯 esig と同じ組み方）に向ける。status の住所は文書用の住所 192.0.2.9 と 2001:db8::9（どこにも届かない）で、本物の tailnet の住所・host の名は書かない。hooks.json は stage の json の member・items・unquote で読む（境界の歯は serde_json を使わない）。tz の口の歯は Cargo の CARGO_BIN_EXE_tz を、PATH を偽の git と偽の tailscale だけの dir にして撃つ。hooks.json の command の sh の振る舞いは、字が等しいことを確かめた COMMAND を sh -c で撃って見る。
      着地済みの歯（全部の crate の tests と src と xtask で、plugin の hooks.json と plugin.json・src/hook/mod.rs・src/main.rs・question_gate・中核の gate の drafts の字を grep した）。書く file の字を読むか tz の hook の口を撃つ歯は、中核の gins（行 f-gate-install・hooks.json・書く）と fstop（hooks.json と plugin.json）、境界の fstop（tz hook stop の口）・fpremhook（門の口）・qgate（門の口）・hbconf（main.rs の字）。書かない 5 つの file を置き場だけの = で持ち、着地済みの filter の語で verify で撃つ。gate の drafts を使うほかの歯（中核の qgate と fprem）は drafts を書かないので持たない。
      filter の語。main 0121631 の contracts の verify の filter の語 279 のどれも、接頭辞 qsig_ と 8 つの歯の名に部分の字として含まれず、接頭辞と名もどの語にも含まれない（確かめた）。
      依存と順。depends は空（同じノートの行 g-unref-dash と書く file が重ならない）。計画 5 節の鎖 plugin/hooks/hooks.json の f-stop → f-gate-install（ノート surface-wave21d・中核の歯 tests/gins.rs を足す）→ e-signal-send で、口の NUDGE_PATH と NUDGED は行 e-signal（ノート surface-wave21d）が足すので、この行は 2 つの行の着地の後に流す（順は便の bead の依存で持つ・席が付ける）。鎖 boundary/main.rs と boundary/hook/mod.rs は f-gate（着地済み）→ e-signal-send → f-deliver（計画だけの行）の順。境界の歯 qgate と fstop・fpremhook・hbconf と中核の歯 fstop を置き場だけの = で持つほかの行とは、器の交差の断りが同時に流さない。
      範囲の外。PostToolUseFailure と、bd の create の --json や --silent の出力（起票の行を出さない形・合図を送らず周期の読みが拾う）。台帳に無い id の断り（口の側）。ほかの project の board への合図（自分の repo の boardport だけ）。起票の行の字が bd の版で変わったときの読み（CREATED の字を 1 か所で持つ）。合図の送りの記録と画面の表示。
      着地の後に効く時（歯で測らず、席の作業で持つ）。着地の後に席が restart.sh で anchor の target/debug/tz を組み直し、hooks.json は session の起動の時に読まれるので、席の次の起こし直しから合図の hook が効く。
  - n: 4
    type: prose
    title: 行 g-unref-dash — 3 種とも分からない未反映の数を ― にする
    body: |
      在りかの main は 0121631（計画 surface-plan 第 0.84 版）で、節の字は行 c-abs-time（ノート surface-wave21a・便は置いたが未着地・行 g-ledger-group-kind の後）の着地の後の字に書く。計画に無い新しい行で、承認は計画の裁定を継ぐ。拠りは要件 FR13（未反映）と、席の実画面の点検（2026-09-29）で見つけた project board と account board の字の不揃い。
      なぜ。行 c-unref-now（着地済み）で、中核は未反映の 3 種（memo・ruling・request）を器の局面の出力が来るまで全部 まだ分からない にし、指標の電文 LedgerStats の unreflected は 0、unreflected_unknown は 3 種の全部になった。account board の各 project の表は、面の account/projects.rs の fn unref_of が台帳の Known で 3 種とも分からない時に None を返し、欄を数えない字 ―（NONE_MARK）にする。ところが project board の台帳の block は、上段の箱の未反映の数と未反映の段の見出しの数に 0 を出し、上段の箱は 0 の隣に測れていないの印も出す。0 は数えた値に見え、印と食い違う。見本 mock v3 の account の頁も未反映の数が null の時は字 ― を出す。見本 mock v3 の project の頁は、台帳が読めれば未反映の一覧の長さを数に出し（null の場は無い）、台帳が無ければ block 全体を 台帳なし（測れていない）にするので、3 種とも分からない時の数の字は見本に無い。この行は account board の表の字に揃える。
      今の字（c-abs-time の着地の後の src/project/ledger.rs・この行が書く）。pub const NONE は字 ―（数の無い項の字・行 g-ledger）。pub struct Unref は pub な欄 count（u32・電文の数そのまま）と unknown（Vec<&str>・分からない種類の名を kind_name の字で）を持ち、derive は Debug・Clone・PartialEq・Eq、impl は無い。fn content の組みは Unref の count に unreflected を、unknown に unreflected_unknown の各種類の kind_name を入れる（変えない）。impl Metrics の pub fn text は Part の Unref と UnrefCount の腕で count の数の字を返す。pub fn unref_chip(count: u32) は count 0 に class chip num unref-n z を、ほかに chip num unref-n を返す（変えない）。mod dom（wasm の target のときだけ）の fn box_view は上段の 4 つの箱を組み、数の字は m.text(part) で、箱の印は part が Part の Unref で m.unref.unknown が空でない時に state_icon(UNKNOWN) を数の後に置き、箱の class は Unref で count が 1 以上なら l4un on、ほかは l4un。fn unref_view は未反映の段の details の見出しに、段の名と、class が unref_chip(m.unref.count) の span の中身に m.unref.count と、分からない種類ごとの chip（name_label の見出しと state_icon(UNKNOWN)）を並べる。段の中の一覧は unref_list の結果で、3 種とも分からない時は UNREF_UNKNOWN の字と測れていないの印（行 c-unref-now）。
      形。impl Unref を足し、pub fn text(&self) -> String（unknown の数が UnreflectedKind の ALL の数より少なければ count の数の字、ほかは NONE の字）と pub fn partial(&self) -> bool（unknown が空でなく、その数が ALL の数より少ない時だけ真）を置く。Metrics の text の Part の Unref と UnrefCount の腕は Some(self.unref.text()) にする。fn box_view の箱の印の条件は part が Part の Unref で m.unref.partial() の時だけにする。fn unref_view の見出しの数の span の中身を m.unref.text() にする（class は unref_chip(m.unref.count) のまま）。module の doc に、3 種とも分からなければ数えない字 ― にし、1 種でも分かれば数に測れていないの印を添える、の 1 行を足す。
      画面の字（歯で測らず、この行の差分で持つ）。3 種とも分からない時、上段の箱は字 ― だけで印を添えず、class は l4un（count は 0）。未反映の段の見出しは段の名と字 ― の chip（class に z）と、分からない 3 種の chip（今のまま）。段の中は今のまま UNREF_UNKNOWN の字と印。1 種か 2 種が分からない時は今のまま数と印、どれも分かる時は今のまま数だけ。account board の表・account board の台帳の tab・未反映の一覧の口・電文の形・中核の数え方は変えない。
      歯の組み方（新しい面の歯 tests/udash.rs・接頭辞 udash_）。Unref の関数は値を組んで直に撃つ。Metrics は行 g-ledger の fixture ledger-stats.json の組 filled（ほかの欄は変えず、unreflected と unreflected_unknown だけを替える）を Reading の Known で包んだ電文を、content に Screen の initial と描く時の今 1791676800（歯 ledgerblock と同じ今）で渡して組む。DOM は wasm の target でしか組めないので、src の字の mod dom 以降を読んで式の字を見る。
      着地済みの歯（全部の crate の tests と src と xtask で、src/project/ledger.rs の字・project の ledger の Unref・Metrics・Part の Unref と UnrefCount・unref_chip・l4un を grep した）。src/project/ledger.rs の字を読む面の歯は absface（行 c-abs-time が足す）・cadl・hsblock・kindlab・lcard・lhome・lstg・unrefpanel（kindlab は fn unref_view の分からない種類の chip の字を見る・変えない）、Metrics の text と Unref の欄を見る面の歯は ledgerblock（組 empty の count 0 と 3 種の unknown を見るが text の Unref は見ない）。この 9 の file を置き場だけの = で持ち、着地済みの filter の語で verify で撃つ。account の面の Unref を組む歯（acctproj・acctled・hacols・harest・unow）は、この行が Unref の欄と derive と account の面の字を変えないので持たない。
      filter の語。main 0121631 の contracts の verify の filter の語 279 のどれも、接頭辞 udash_ と 3 つの歯の名に部分の字として含まれず、接頭辞と名もどの語にも含まれない（確かめた）。
      依存と順。depends は空（同じノートの行 e-signal-send と書く file が重ならない）。計画 5 節の鎖 surface/project/ledger.rs の c-abs-time（ノート surface-wave21a）→ g-unref-dash で、この行は c-abs-time の着地の後に流す（順は便の bead の依存で持つ・席が付ける）。歯 lhome は行 g-ledger-group-kind（ノート surface-wave21b）が書き、歯 absface は行 c-abs-time が足すので、2 つの行の着地の後に流す。同じ歯を置き場だけの = で持つほかの行とは、器の交差の断りが同時に流さない。c-abs-time の後の src/project/ledger.rs の余白（1 file 1500 行の上限）はこの行の足す約 20 行より大きい。
      範囲の外。account board の台帳の tab（面の account/ledger.rs の LedRow の fn numbers と DOM の未反映の欄・3 種とも分からない時も count の数と印を出す・notes の席の問い）。未反映の数え方と器の局面の出力の読み（行 c-unref-lc）。未反映の段の中の一覧の字と種類の chip。

