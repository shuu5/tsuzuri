      形。新しい file src/askwin.rs に、局面 Phase（Empty・Walk・Done）と phase、1 問ずつ出す問い own_ids（ほかの project の問いを外す）、今の問い current（選んだ問いが答えていなければそれ・ほかは頭から最初の答えていない問い）、あとで later（後ろへ巡る・ほかに無ければ None）、残りの数 left、題 title（答えを待つ質問 と残りの数）、点の class dot_class（qd・cur・ok）と定数 ADVANCE_MS（650）・DONE_MS（1200）・DONE_KEY・LATER_KEY・FOLDS を置く。wasm の枝の frame は窓の積みを受け、題の横の点で問いを選び、1 問は src/project/ask.rs に足した one_view（block と同じ card_view・答えの状態は問いの id ごと・Recorded の outcome で recorded を呼ぶ）で描き、記録の 650 ms 後に答えた問いに数え、全部に答えたら 1200 ms 後に窓が Ask のままなら閉じ、あとでの次が無ければ閉じる。下の段は畳んだ details の ほかの project の質問（読むだけ）・まとめて承認・全体への指示 で、src/project/batch.rs と policy.rs に pub fn inner を足し block の view も inner を描く。src/wins.rs の draw は窓の積みを受け、Ask の腕は askwin の frame を返す。src/lib.rs に pub mod askwin。stylesheet は質問の塊の末（つながりの塊の前）に点・全部答えた・あとで・下の段の規則と 600 px 以下の点の大きさを足す。語の辞書の rephrase の末に ask_done・ask_later・ask_others を足す。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done (1) は verify の 1 行目。done (2) は verify の 2 行目。done (3)〜(10) は verify の 3 行目（歯の file tests/bvaskw.rs・filter bvaskw_）の歯 bvaskw_one_at_a_time_in_order・bvaskw_advance_after_send・bvaskw_later_wraps・bvaskw_close_when_none_left・bvaskw_dots_and_title・bvaskw_batch_policy_below・bvaskw_words_and_rules・bvaskw_dom_wiring_text。done (11) は verify の 4 行目（鎖の前の行の歯の file tests/bvwins.rs）。fixture は tests/fixtures/surface/question-list.json（読むだけ）。verify の最後の 2 行は done の項を持たない。

      構造の連鎖。書き替える歯は行 g-win-parts の tests/bvwins.rs の bvwins_draw_wiring_text の 1 本（Ask の腕の字と doc）。src/project/ask.rs の one_view は着地済みの歯 qkey_dom_text の断る字（mod dom の中の .number と now の引数）を持たず、番号は一覧から target_number で読む。ask.rs は 1,047 行から 1,084 行（上限 1,500 の余地 416）。今の質問の頁と block は替えない（頁を外すのは g-one-screen-a）。

      試作と噛み。試作の起点は 9334f053、試作の commit は写し drafts/w66a の b696f00e。書く file は write-set の中で閉じる（git diff --name-only が write-set の 10 と同じ）。試作の木で面の全部の歯 798 本と clippy と xtask の surface-build と check（2941 本・wasm の target の clippy を含む）が緑。変異 3 つと clippy の変異 1 つで歯が落ちることを見た（log w/bite.log・k10 頭でなく末から探す → bvaskw_one_at_a_time_in_order ほか・k11 あとでが今の問いに留まる → bvaskw_later_wraps・k12 Empty と Done を入れ替える → bvaskw_close_when_none_left・k13 使わない束縛 → clippy の rc 101）。done (1) は 9334f053 の木で verify の 1 行目が rc 1。席の積みの木の最後の commit e5082775（11 行の全部）で xtask の check が rc 0（2,988 本）。

