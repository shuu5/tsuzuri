    title: 行 g-list-head — 一覧の見出し（種類・探す・指標の小さな数と図）
    body: |
      在りか。差の file docs/design/patch/g-list-head.patch は、行 g-list-groups の試作の commit b446e9bc（積みの木の 505537b9 の上）に試作の commit e1514ac5 を載せて切った（3 file・git diff 20,684 byte）。席の積みの木（写し drafts/s26b・branch stack2・main 62a2f8fd の上に第 26 波 b の 11 行を g-win-frame → g-topbar → g-win-parts → g-ask-win → g-pop → g-pop-flow → g-pop-why → g-pipe-cards → g-list-groups → g-list-head → g-unref-lc の順に 1 行 1 commit で積んだ木）でも、この行は bbf09e75 の上の commit c89dff9b で、差の file はその 2 つの間の差と同じ字（20,876 byte）。

      なぜ。判断の記録 ADR-27 の決定 (8) は、台帳の指標を一覧の見出しの小さな数と図に縮めると決めた。見本 board-v2 の一覧の見出しは、種類の切り替え（すべて・便・memo・問い）と探す欄（短い題・題の全体・id）と小さな数（便・memo・問い・純減 24h）と 14 日の図を持ち、絞りが効く間は合う行の在る組だけを開いて出す。

      形。module ledgerlist に、種類の値 Kind と表 KINDS・置き字 SEARCH_HINT・字 NO_MATCH と KPI_UNKNOWN・純粋な関数 filtering・row_matches・filtered・kpi_text・kpi を足す。指標は口 /api/metrics の電文を台帳の block の stats で読み、純減は台帳の block の net の字、図は台帳の block の spark と spark_svg（14 日の created と closed）を使う。DOM は見出しの関数 head_line（小さな数と図・種類の button・探す欄）を一覧の頭に置き、種類と探す字を signal で持つ。一覧は絞った組を描き、絞りが効いている間は組の開き閉じの記録に依らず組を開く。合う行が無ければ NO_MATCH の 1 行。stylesheet の末に ll-head ほかの class の塊を足す。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。(1) は verify の 1 行目。(2) から (6) は歯の file bvkpi の 5 本（verify の 3 行目）。(7) は verify の 4 行目（bvlist は書かないので write-set に置き場だけの = で置く）。clippy の行と xtask の check は差の全部を見る。

      構造の連鎖。書くのは src/ledgerlist.rs と style.css と新しい歯 bvkpi だけ。台帳の block（src/project/ledger.rs）の関数は呼ぶだけで書かない。前の行の歯 bvlist の DOM の断言の字（組の開き閉じの読み）は、絞りの印を前に足した後も字のまま含まれる。

      試作と噛み。試作の起点は b446e9bc。書く file は write-set の中で閉じる（差の file の数 3）。clippy（host と wasm）と xtask の check（鎖の 3 行目の木で workspace の歯 2,988 本）が緑。噛みは変異 8 つ（空白だけの探す字で絞る・大文字小文字を区別・題の全体を探さない・短い題を探さない・合わない組も出す・問いの数に memo・読めない時の字・絞りの間も畳む）で、どれも bvkpi の歯が落ちた（rc 100）。席の積みの木の最後の commit e5082775（11 行の全部）で xtask の check が rc 0（2,988 本）。

      流す時と順。depends は g-list-groups（この行の差はその試作の上に切った）。後の g-unref-lc はこの行の差の上に切った。

      範囲の外。台帳の block の指標の段（上段の 4 数・主な指標・burndown・memo の段）を外して見出しへ縮め切ることは、着地済みの歯 ledgerblock・bvmore・lcard・cadl が段の表と DOM の字を断言しているので、この行では書かない（notes の席への問い）。
