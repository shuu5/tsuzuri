sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      判断の記録 ADR-27（project board の作り直し）の第 2 段を流す。第 1 段（ノート surface-wave26a・地図と口座の履歴と詳しくを消し、bead の事実と器の局面の出力を読む口を足し、pipeline の板を 5 列にした）の上に、面を 1 枚の画面に組み直す。上の固定の帯（次の一手・やる事の 3 つの数・最新の知らせ・席と口座の状態・時計・設定・ADR-27 決定 (3)）、窓（止まった run・知らせ・席と口座・抜けの検査・質問は 1 問ずつ・決定 (4)）、札と一覧の行の吹き出し（題の全体・概要・待つ相手・列に入った時刻・段の流れと run の歴・起きない理由・決定 (7)）、細い札の 5 列の板（決定 (6)・Queued の 30 分の注意は規則の行 R-37）、epic ごとの組にした台帳 open の一覧と見出し（決定 (8)）、幅の 3 段（規則の行 R-35）を置き、tab と質問の頁と抜けの検査の頁を消して、help と語の辞書と stylesheet を掃き、受入の 4 つの幅（要件 NFR1・受入 AC9・規則の行 R-23）に合わせる。見た目と振る舞いの見本は持ち主が承認した board-v2 の見本（席の作業場の proposals/board-v2）。
