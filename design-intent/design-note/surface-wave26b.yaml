      在りか。起点は行 g-win-frame の試作の commit 6cba15ef（main 62a2f8fd の上・写し drafts/w66a）。差の file docs/design/patch/g-topbar.patch は、その上に載せた試作の commit 383e7e21 との git diff --no-color --full-index で write-set の書く file の 5 だけを切った（45,393 byte）。6cba15ef の木で git apply --check が rc 0、試作の木で git apply --reverse --check が rc 0。main 62a2f8fd の木には当たらない（行 g-win-frame の着地の後に当てる）。席の積みの木（写し drafts/s26b・branch stack2・main 62a2f8fd の上に第 26 波 b の 11 行を g-win-frame → g-topbar → g-win-parts → g-ask-win → g-pop → g-pop-flow → g-pop-why → g-pipe-cards → g-list-groups → g-list-head → g-unref-lc の順に 1 行 1 commit で積んだ木）でも、この行は 584e8953 の上の commit b0f9d7ad で、差の file はその 2 つの間の差と同じ字（45,393 byte）。

      なぜ。判断の記録 ADR-27 決定 (3) は上の固定の帯に、次の一手・やる事の数（質問・止まった run・抜けの検査の 3 つで 1 以上の物だけ色）・席からの最新の知らせの 1 行・席と口座（席の状態・直近 3 時間の細い帯・今の口座の 5 時間と 7 日）・抜けの検査の印・時計・設定（⚙）を置くとする。見本 board-v2 の帯（id bar・renderTodo と renderClock）の字と class に合わせる。見本はやる事の数の 0 の札を出さないが、決定 (3) の字（1 以上の物だけ色）に従い 3 つを常に出して 0 と分からない数は色を付けない（見本と ADR-27 の食い違いは ADR-27 が勝つ）。

      形。新しい file src/topbar.rs に、帯が開く窓の名 Win（Ask・Stalled・Notices・Seat・Gaps・Legend・Dest）と、次の一手の pill（lead と lead_win・電文 /api/next の lead と件数・なしと判じなかったと読めない口は窓を開かない）と、やる事の 3 つの数（counts・質問と止まった run は次の一手の電文の件数・抜けは導出グラフ /api/graph の抜けありの判定の数・1 以上は chip org と chip red と chip amb・0 と分からない数は chip zero）と、知らせの 1 行（notice_line・この project の最新の 1 つと件数・電文はほかの project の分も持つが数えない）と、席と口座の印（seat_bar・状態と から の時刻と tick と heartbeat の字・直近 3 時間の区間の SVG・口座の名と 5 時間と 7 日の窓の割合と棒の class・席の block の関数 drawn・rects・strip_svg・bar_class・short を使う）と、抜けの検査の印（gaps_mark・gp f・gp u・gp p）と、設定の中の口 GEAR を置く。wasm の枝は帯 view（Bar に窓の積み・表示の型・project の名・戻る手・表示の型を選ぶ手を受ける）で、印を押すと窓を開き、設定の一覧は外の click と取り消しの鍵（g-win-frame の closes）で畳む。src/lib.rs に pub mod topbar。stylesheet は上端の帯の塊の末（頁の枠の前）に帯の規則と、帯の詰め方（1199 以下は口座を短い字に・760 以下は 2 段・600 以下は押せる高さ 40 px）を足す（760 は見た目の詰め方で規則の値にしない・計画の第 2 版の 9）。語の辞書の rephrase の末に bar_stall・bar_gaps・bar_recent・bar_gear・seat_acct を足す。読む口は今のまま（/api/next・/api/notices・/api/seat・/api/graph）。帯を頁に置き今の header を替えるのは 1 枚の画面への切り替えの行。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done (1) は verify の 1 行目。done (2) は verify の 2 行目。done (3)〜(11) は verify の 3 行目（歯の file tests/bvbar.rs・filter bvbar_）の歯 bvbar_lead_from_next・bvbar_three_counts_colored_when_positive・bvbar_notice_latest_and_count・bvbar_usage_two_windows・bvbar_strip_three_hours・bvbar_seat_state_and_tick・bvbar_gaps_mark・bvbar_words_and_rules・bvbar_dom_wiring_text。fixture は tests/fixtures/surface/next-step.json・seat-card.json・invariants.json（読むだけ）。verify の最後の 2 行は done の項を持たない。

      構造の連鎖。新しい module は crate の根の topbar で、src/project の下に置かない（build.rs が block として列挙するため）。席の block の関数と定数（project::seat の card・drawn・rects・strip_svg・bar_class・short・Span）と、次の一手の関数（project::next の step・unjudged・key・UNJUDGED_KEY）と、知らせの関数（project::notice の doc・OWN_UNREAD・NONE_LINE）と、抜けの検査の関数（project::gaps の checks）は読むだけで書かない。着地済みの歯 tests/topbar.rs（今の header の時刻）は替えない。

