      在りか。差の file docs/design/patch/g-list-groups.patch は、積みの木（第 26 波 b の帯と窓と吹き出しと札の 8 行を main 62a2f8fd に積んだ木）の行 g-pipe-cards の試作の commit 505537b9 に、試作の commit b446e9bc を載せて切った（10 file・git diff 51,556 byte・差の file 52,196 byte）。新しい file は crates/tsuzuri-surface/src/ledgerlist.rs（418 行）と歯 tests/bvlist.rs。style.css は積みの木で 1,252 行で、この行で 1,276 行になる。src/project/ledger.rs は 1,251 行から 1,201 行に縮む。席の積みの木（写し drafts/s26b・branch stack2・main 62a2f8fd の上に第 26 波 b の 11 行を g-win-frame → g-topbar → g-win-parts → g-ask-win → g-pop → g-pop-flow → g-pop-why → g-pipe-cards → g-list-groups → g-list-head → g-unref-lc の順に 1 行 1 commit で積んだ木）でも、この行は 505537b9 の上の commit bbf09e75 で、差の file はその 2 つの間の差と同じ字（52,196 byte）。

      なぜ。判断の記録 ADR-27 の決定 (8) は、台帳 open の一覧を epic ごとの組にし、組の頭の 1 行に進みの棒と段ごとの数を出し、行を 1 行の短い題にし、既定で開く組を pipeline で動いている epic と open の子を持つ epic だけにすると決めた。見本は持ち主が承認した board-v2 の見本の台帳 open の一覧（組の頭の tog・名・id・進みの棒・段の数・open の数、行の種類の札・短い題・右の字）。

      形。新しい module ledgerlist（lib.rs に pub mod を 1 行）が一覧を持つ。純粋な関数は facts（口 /api/beads の本文を id の表に）・short_of・home（id の階層のいちばん近い epic の祖先）・row_rank・groups・content で、組の型 Lgroup（key・epic・name・closed・total・counts・rows と live・open_default・pct）と行の型 Lrow（id・kind・short・title・right・rank）を持つ。台帳の行は口 /api/ledger、札は口 /api/pipeline、短い題と起票の時刻は口 /api/beads から読む。札の無い行の右の字の頭は語の辞書の鍵 pf_created（行 g-pop の吹き出しの起票の欄と同じ語）の見出しで、見出しの字を src に書かない（歯 frame_no_heading_words_in_code）。DOM（wasm の target だけ）は組の開き閉じを kit の Folds を入れた signal で頁の一生の間だけ持ち、頭の tog の click で開き閉じを替える。短い題は節点の頁への link で、題の全体を title に置く（行の click で吹き出しを開くのは後の行）。台帳の block の一覧の段（Tier の List）は 2 つの枝とも ledgerlist の view を描き、前の一覧の DOM の関数 list_view と group_view を消す。前の一覧の純粋な関数 body・staged_body・group_cards は件数と着地済みの歯のために残し、DOM は呼ばない。stylesheet の末に ll- で始まる class の塊を足す。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。(1) は verify の 1 行目。(2) から (7) は歯の file bvlist の 6 本（verify の 3 行目）。(8) は lhome・lstg・cadl・absface・parts・frame の 6 行（frame は書かないので write-set に置き場だけの = で置く）。clippy の行と xtask の check（wasm の target の clippy と面の組み立てを含む）は差の全部を見る。

      構造の連鎖。書き替える着地済みの歯は 5 file。lhome と lstg と cadl は一覧の段の DOM の字（list_view と staged_body と group_cards の呼び）を断言していたので、一覧の段が ledgerlist の view を描く字に替える。absface は今を渡す字の在りかを ledgerlist の content の呼びに替える。parts は src の口の字のうち /api/beads の字が src/ledgerlist.rs に 1 度だけ在ることを足す（block の外の口の字の列は替えない）。src/project/pipeline.rs と kit.rs と view.rs は書かない。

      試作と噛み。試作の起点は積みの木の 505537b9。書く file は write-set の中で閉じる（試作の commit の差の file の数と差の file の file の数が同じ 10）。cargo clippy（host と wasm の target）と xtask の check（鎖の 3 行目の木で workspace の歯 2,988 本）が緑。噛みは変異 9 つ（札だけの組を開かない・Landed の列も数える・閉じた epic の組も出す・短い題を使わない・外の組を頭に・祖先を親だけ・一覧の段に前の一覧・右の字の頭を鍵の字のまま・見出しの字を src に）で、どれも bvlist か frame の歯が落ちた（rc 100）。席の積みの木の最後の commit e5082775（11 行の全部）で xtask の check が rc 0（2,988 本）。

      流す時と順。depends は g-pipe-cards（席の積みの順・吹き出しと札の鎖の最後の行も style.css を書くので、その着地の後に流す）。同じ鎖の g-list-head と g-unref-lc はこの行の差の上に切ったので、この行の着地の後に流す。

      範囲の外。行の click の吹き出し（行 g-pop と後の選びの行）・epic の組の選びと札の濃さ（行 g-select）・一覧の見出しの絞りと指標（行 g-list-head）・局面の語（行 g-unref-lc）・台帳の block の指標の段の上段と主な指標と burndown と memo の段の縮め。
