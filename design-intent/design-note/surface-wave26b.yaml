    title: 行 g-win-frame — 帯の印が開く窓の枠
    body: |
      在りか。main 62a2f8fd。差の file docs/design/patch/g-win-frame.patch は、起草 w66a が main 62a2f8fd に試作の commit（写し drafts/w66a の 6cba15ef）を載せ、git diff --no-color --full-index で write-set の書く file の 5 だけを切った（19,879 byte）。main の木で git apply --check が rc 0、試作の木で git apply --reverse --check が rc 0。席の積みの木（写し drafts/s26b・branch stack2・main 62a2f8fd の上に第 26 波 b の 11 行を g-win-frame → g-topbar → g-win-parts → g-ask-win → g-pop → g-pop-flow → g-pop-why → g-pipe-cards → g-list-groups → g-list-head → g-unref-lc の順に 1 行 1 commit で積んだ木）でも、この行は 62a2f8fd の上の commit 584e8953 で、差の file はその 2 つの間の差と同じ字（19,879 byte）。

      なぜ。判断の記録 ADR-27 決定 (4) は、質問・止まった run・知らせ・席と口座・抜けの検査を帯の印を押すと開く窓にし、窓は × と外の click と取り消しの鍵（Esc）で閉じるとする。決定 (5) と規則の行 R-35 は幅 600 px 以下で窓を全画面にする。決定 (7) と規則の行 R-20 は吹き出しも × と外の click と Esc で閉じるので、閉じる判定を 1 つの純粋な関数にして吹き出しの行（g-pop）も使う。見本 board-v2 の窓（openModal・drawModal・closeModal・topModal）は窓の中から別の窓を開くと前の窓を積み、‹ 戻る で戻る。

      形。新しい file src/widgets/modal.rs に、押しの型 Hit（X・Outside・Inside・Key の 4 つ・Key は鍵の字と変換の途中か）と、閉じる判定 closes（X と Outside と変換の途中でない Escape で真）と、窓の積み Stack（open・back・close・top・can_back）と、幅の字 width_style と、定数 ESC・FULL_MAX_PX（600）・SCRIM・CLASSES・CLOSE_KEY・BACK_KEY・BACK_MARK を置く。wasm の枝に窓の積みの状態 WinCtx と中身 Frame（幅・題・本文）と層 layer（window の keydown で取り消しの鍵・幕そのものの click で外・頂の窓だけを描く・戻る口は can_back の時だけ）を置く。変換の途中の Escape は仮名漢字の変換を取り消す鍵なので閉じない（見本に無い足し・答えの欄の書きかけを消さない）。src/widgets/mod.rs に pub mod modal と doc の 1 行。stylesheet は coach mark の塊の後に窓の塊（id scrim と class modal・mh・mb・mh の中の back と x の規則と、600 px 以下の media の規則で全画面）を足す。語の辞書の rephrase の末に mclose（窓を閉じる）と mback（戻る）を足す。× の語を見本の 閉じる にしないのは、着地済みの歯 frame_no_heading_words_in_code が src の中の語の辞書の語の字を断り、src/widgets/coach.rs が字 閉じる を持つから。層を頁に置くのは 1 枚の画面への切り替えの行（g-one-screen-a）で、この行では board.rs を書かない（今の頁は替わらない）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done (1) は verify の 1 行目。done (2) は verify の 2 行目（面の clippy）。done (3)〜(8) は verify の 3 行目（歯の file tests/bvwin.rs・filter bvwin_）の歯 bvwin_close_on_esc_outside_x・bvwin_stack_back_to_previous・bvwin_width_style・bvwin_classes_in_stylesheet・bvwin_words_in_vocab・bvwin_dom_wiring_text。verify の最後の 2 行（xtask の surface-build と check）は wasm の枝の組み立てと repo の全部の歯を撃つ（done の項は持たない）。

      構造の連鎖。新しい module は widgets の下の modal だけで、ほかの module はまだ使わない（帯の行 g-topbar・窓の中身の行 g-win-parts・質問の窓の行 g-ask-win・吹き出しの行 g-pop が使う）。着地済みの歯で stylesheet の class と src の class の字を照らす frame_classes_are_in_stylesheet は、この行の class を src の字の class でなく定数で持つので数えない（歯 bvwin_classes_in_stylesheet が照らす）。語の辞書の全部の鍵を回る着地済みの歯（hsym・helpfig・nstall・frame_no_heading_words_in_code）は緑のまま。

      試作と噛み。試作の main は 62a2f8fd、試作の commit は写し drafts/w66a の 6cba15ef。書く file は write-set の中で閉じる（git diff --name-only が write-set の 5 と同じ）。試作の木で面の全部の歯 774 本と clippy と xtask の surface-build と check（2917 本）が緑。変異 3 つと clippy の変異 1 つで、done の各項が落ちることを見た（log w/bite.log・k1 変換の途中でも閉じる → bvwin_close_on_esc_outside_x・k2 外から開いても前の窓を閉じない → bvwin_stack_back_to_previous・k3 全画面の規則を消す → bvwin_classes_in_stylesheet・k13 歯の file に使わない束縛 → clippy の rc 101）。done (1) は main の木で verify の 1 行目が rc 1。席の積みの木の最後の commit e5082775（11 行の全部）で xtask の check が rc 0（2,988 本）。

      流す時と順。depends は空。鎖の後の行 g-topbar・g-win-parts・g-ask-win はこの行の試作の commit を起点に差を切った。吹き出しの行 g-pop の係（w66b）はこの行の試作の commit 6cba15ef から始め、閉じる判定 closes と押しの型 Hit を使う。席はどの行も style.css か vocab.json を書く第 26 波 b の 11 行を g-win-frame → g-topbar → g-win-parts → g-ask-win → g-pop → g-pop-flow → g-pop-why → g-pipe-cards → g-list-groups → g-list-head → g-unref-lc の順に 1 本の木に積み、depends もこの順の 1 本の鎖にした。

      範囲の外。窓の層を頁に置くこと（g-one-screen-a）・窓の中身（g-win-parts・g-ask-win）・吹き出し（g-pop）・幅の 3 段の配置（g-layout）・Safari の変換の途中の keyCode 229 の判じ（今の質問の欄の keydown は持つが、この行の層は is_composing だけを見る）。
