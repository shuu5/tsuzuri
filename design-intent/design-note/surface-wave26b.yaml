    type: prose
    title: 行 g-pop — 札と一覧の行の吹き出し
    body: |
      在りか。起点は席の積みの木（写し drafts/s26b・branch stack2・main 62a2f8fd の上に第 26 波 b の 11 行を g-win-frame → g-topbar → g-win-parts → g-ask-win → g-pop → g-pop-flow → g-pop-why → g-pipe-cards → g-list-groups → g-list-head → g-unref-lc の順に 1 行 1 commit で積んだ木）の前の行 g-ask-win の commit 5b3694c8。差の file docs/design/patch/g-pop.patch は、その上のこの行の commit e35751f6 との git diff --no-color --full-index で write-set の書く file の 7 だけを切った（56,947 byte）。5b3694c8 の木で git apply --check が rc 0、e35751f6 の木で git apply --reverse --check が rc 0。係 w66b の試作（起点 6cba15ef・試作の commit aae47359）の差を席が積みの木に当て直したもので、file ごとの足す行と消す行は係の差と同じ（替わったのは前の行の足しと並ぶ所の前後の字と位置だけ）。main 62a2f8fd の木には当たらない（前の行 g-ask-win の着地の後に当てる）。

      なぜ。判断の記録 ADR-27 決定 (7)（札と一覧の行は click で吹き出しを開き、× と外の click と Esc で閉じ、hover では開かない・どの段も題の全体・概要・id・種類・epic・設計の行・起票の時刻と経過・個別の頁への口・段ごとの欄）と決定 (5)（600 画素以下は吹き出しを下からの板）。見本は持ち主が承認した board-v2 の popHTML と placePop と openPop と closePop。

      形。新しい file src/widgets/pop.rs に、吹き出しの欄の組み（関数 pop が Src〔bead の事実・台帳の行・板の札・局面の出力の部品・グラフ〕から Pop〔頭の短い題・題の全体・概要・段・欄の列・次の手〕を組む）と、待つ相手の読み（wait_on）と epic の読み（epic_of）と設計の行（row_pointer）と、開閉（toggle）と外の click の判定（hit_of）と置き場（place）を純粋な関数で置き、層の DOM（PopCtx と PopLayer）は wasm の target だけに置く。閉じる判定は窓の枠の widgets::modal の closes と Hit を使い、2 つ目を書かない。口の印は属性 data-pop-card と data-pop-row（値は bead の id）で、外の click の判定と置き場の口の探しが引く。src/board.rs の App は PopCtx を context に置き、層 PopLayer を CardLayer の後に頁に 1 つ置く。bead の事実の口の path の字 /api/beads は面の src に直に書けない（着地済みの歯 parts の口の字の決まり）ので、契約の crate の ledger.rs に定数 FACTS_PATH を足し、pop.rs の BEADS_PATH はそれを引く。style.css は窓の塊の後に吹き出しの塊（#pop・#popscrim・9 class・600 px 以下の media）を足し、vocab.json は rephrase の末に 18 語（pop_close・pop_page・pop_unknown・pf_ の 13・pnext_ の 2）を足す。札と行に口を付けるのは後の行（g-pipe-cards と選びの行）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done (1) は verify の 1 行目（差の file の当たり）。done (2) は 2 行目（面と契約の clippy）、done (3) は 3 行目（wasm の target の clippy・層の DOM は wasm の枝だけに在る）。done (4)〜(14) は 4 行目（歯の file tests/bvpop.rs・filter bvpop_）の歯 bvpop_common_rows_in_order・bvpop_unknown_fields_marked・bvpop_blocked_targets_with_stage・bvpop_queued_since・bvpop_stop_reason_full・bvpop_landed_time_ci・bvpop_toggle_and_outside・bvpop_place_right_left_below・bvpop_classes_in_stylesheet・bvpop_word_keys・bvpop_dom_wiring_text。done (15) は 5〜6 行目（着地済みの歯の file ごとに 1 行・口の path の字の決まりと見出しの語と class の決まり）。最後の 2 行（xtask の surface-build と check）は done の項を持たない。

      構造の連鎖。消す歯は無い。書き替える着地済みの歯も無い（parts.rs と frame.rs は字を替えずに緑・口の字を契約の定数から引くので parts の決まりに合う）。契約の crate の足しは定数 1 つだけで、電文の形と snapshot は替えない。窓の枠の行の部品（closes・Hit・FULL_MAX_PX）を use する。

      試作と噛み。試作の起点は 6cba15ef、試作の commit は aae47359。書く file は write-set の中で閉じる（git diff --name-only 6cba15ef aae47359 が write-set の 7 と同じ）。試作の木で面と契約の歯が全部緑、clippy（host と wasm の target）と xtask の surface-build と check が rc 0。変異は鎖の最後の試作の木（30de4099・この行の字を後の行が替えていない所）で 11 当て、done (4)〜(14) の各項が少なくとも 1 つで落ちた（nextest の落ちは rc 100・変異の後は file の字を元に戻した・対照は変異の前と後の撃ちの rc 0・撃った歯の file は bvpop と parts と frame と hsderive で、落ちたのは毎回 bvpop の歯だけ）。(p1) COMMON_KEYS の epic と設計の行の順を入れ替える → bvpop_common_rows_in_order・done (4)。(p2) 待つ相手の台帳で閉じた相手を外す filter をいつも真に → bvpop_blocked_targets_with_stage・done (6)。(p3) 起票の欄を時刻 0 に → bvpop_unknown_fields_marked・done (5)。(p4) toggle をいつも開くに → bvpop_toggle_and_outside・done (10)。(p5) GAP_PX を 10 に → bvpop_place_right_left_below・done (11)。(p6) 600 px 以下の幕を display none に → bvpop_classes_in_stylesheet・done (12)。(p7) Questioned の次の手を run の記録に → bvpop_stop_reason_full・done (8)。(p8) CI の欄をいつもまだ分からないに → bvpop_landed_time_ci・done (9)。(p9) board.rs の層の行を消す → bvpop_dom_wiring_text・done (14)。(p10) 列に入った時刻の欄をいつもまだ分からないに → bvpop_queued_since・done (7)。(p11) 語の辞書の鍵 pop_unknown の名を替える → bvpop_word_keys・done (13)。席の積みの木の最後の commit e5082775（11 行の全部）で xtask の check が rc 0（2,988 本）。

      流す時と順。depends は g-ask-win（席の積みの順・帯と窓の鎖の 4 行も style.css と vocab.json と widgets/mod.rs を書くので、その鎖の最後の行の着地の後に流す・閉じる判定は鎖の頭 g-win-frame の closes と Hit を use する）。後の行 g-pop-flow・g-pop-why・g-pipe-cards がこの行の commit の上に鎖で続く。

      範囲の外。札と一覧の行に口を付けること（g-pipe-cards と選びの行）、段の流れと run の歴（g-pop-flow）、起きない理由と待つ理由（g-pop-why）、窓を開くと吹き出しを閉じること（1 枚の画面への切り替えの行）、止まりの次の手の regate と止める（器の命令で面は撃たない）、吹き出しの scroll に付いて置き直すこと。
  - n: 8
    type: prose
    title: 行 g-pop-flow — 吹き出しの run の段の流れと歴
    body: |
      在りか。起点は席の積みの木（写し drafts/s26b・branch stack2・main 62a2f8fd の上に第 26 波 b の 11 行を g-win-frame → g-topbar → g-win-parts → g-ask-win → g-pop → g-pop-flow → g-pop-why → g-pipe-cards → g-list-groups → g-list-head → g-unref-lc の順に 1 行 1 commit で積んだ木）の前の行 g-pop の commit e35751f6。差の file docs/design/patch/g-pop-flow.patch は、その上のこの行の commit 1f6dba5c との git diff --no-color --full-index で write-set の書く file の 6 だけを切った（31,634 byte）。e35751f6 の木で git apply --check が rc 0、1f6dba5c の木で git apply --reverse --check が rc 0。係 w66b の試作（起点 aae47359・試作の commit 6a963467）の差を席が積みの木に当て直したもので、file ごとの足す行と消す行は係の差と同じ（替わったのは前の行の足しと並ぶ所の前後の字と位置だけ）。main 62a2f8fd の木には当たらない（前の行 g-pop の着地の後に当てる）。

      なぜ。判断の記録 ADR-27 決定 (7)（Running / Gated は段の流れ〔審査 10 分 → 実装 22 分〜 の形〕・止まりは run の歴〔各回の結果〕・着地は着地の commit）と決定 (10)（run の段の流れと歴は器の event log の RunCreated・RunStage・RunDone から読む）。見本は stepsHTML と histTable。

