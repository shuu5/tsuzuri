    title: 行 g-unref-lc — 一覧の局面と手番の平易な字
    body: |
      在りか。差の file docs/design/patch/g-unref-lc.patch は、行 g-list-head の試作の commit e1514ac5（b446e9bc と積みの木の 505537b9 の上）に試作の commit 0ffc898d を載せて切った（6 file・git diff 26,084 byte）。src/project/ledger.rs は 1,201 行から 1,247 行になる（上限 1,500）。計画 surface-plan の 9 節の計画だけの行 g-unref-lc を同じ id の契約の行にする。席の積みの木（写し drafts/s26b・branch stack2・main 62a2f8fd の上に第 26 波 b の 11 行を g-win-frame → g-topbar → g-win-parts → g-ask-win → g-pop → g-pop-flow → g-pop-why → g-pipe-cards → g-list-groups → g-list-head → g-unref-lc の順に 1 行 1 commit で積んだ木）でも、この行は c89dff9b の上の commit e5082775 で、差の file はその 2 つの間の差と同じ字（26,468 byte）。

      なぜ。計画の行 g-unref-lc は、未反映の memo の項に器の局面の語と手番を平易な語で添え、2 つの board で同じ語（行 g-kind-label の辞書）を使い、epic と memo と問いの局面を一覧に出す（板には出さない・判断の記録 ADR-27 の決定 (6)）と決めていた。局面の語の読みは第 1 段の口 /api/cases（器の局面の出力の部品）が運ぶ。器の局面の語と手番の正本は器の case-lifecycle の 2 節と 3 節。

      形。台帳の block（src/project/ledger.rs）の行 g-kind-label の関数の隣に、鍵の接頭 PHASE_KEY と TURN_KEY・字の鍵 UNKNOWN_WORD_KEY・関数 plain_word・phase_text・表 UNREF_PHASES・関数 kind_phase_text を足す（account board も同じ module から引ける）。語の辞書 vocab.json の rephrase の塊の末に、局面の 8 語と手番の 6 語の鍵を足す（局面 question-open の見出しは、code の字の答え待ちとぶつからないよう答えの待ちにした）。module ledgerlist の行 Lrow に欄 phase を足し、純粋な関数 phases（口 /api/cases の本文の memo と question の部品を id の表に）・with_phases（memo と問いの行に字を置く）・unref_head（見出しの未反映の数と title）を足す。DOM は局面の出力の口を契約の crate の定数 case の PATH で読み、行の右の字の前に局面の字、見出しの小さな数の後に未反映の数を出す。stylesheet の末に ll-ph と ll-unref の塊を足す。前の行の歯 bvkpi の DOM の断言の 1 行（絞った組の字）を、局面の字を置いた後の字に替える。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。(1) は verify の 1 行目。(2) から (6) は歯の file bvuphase の 5 本（verify の 3 行目）。(7) は verify の 4 行目と 5 行目（frame は書かないので write-set に置き場だけの = で置く）。clippy の行と xtask の check は差の全部を見る。

      構造の連鎖。account board の未反映の表の見出しは今の kind_label のままで、局面の字を添える呼びはこの行では足さない（同じ辞書の関数は台帳の block に在る）。語の辞書の見出しは code の字に直に書かない（歯 frame_no_heading_words_in_code）。src/project/pipeline.rs・kit.rs・view.rs と契約の crate は書かない。

      試作と噛み。試作の起点は e1514ac5。書く file は write-set の中で閉じる（差の file の数 6）。clippy（host と wasm）と xtask の check（この行の木で workspace の歯 2,988 本）が緑。噛みは変異 8 つ（知らない語を語のまま・手番を出さない・memo の局面に misfit が無い・契約の部品も使う・便の行にも局面・読めない間は空の字・見出しに手番が無い・行の局面を描かない）で、どれも bvuphase の歯が落ちた（rc 100）。席の積みの木の最後の commit e5082775（11 行の全部）で xtask の check が rc 0（2,988 本）。

      流す時と順。depends は g-list-head（この行の差はその試作の上に切った）。

      範囲の外。epic の行の局面（一覧の組の頭）・未反映の block の 3 つの見出しの語の替え・前の一覧のつなぎ（kit の staged_item と view の row_mark）を外すこと・account board の表に局面の字を添えること。

