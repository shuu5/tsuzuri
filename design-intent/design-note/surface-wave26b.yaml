      なぜ。判断の記録 ADR-27 決定 (4) は止まった run・知らせ・席と口座・抜けの検査を窓にし、席と口座の窓は 24 時間の稼働の帯と残りの詳しい値を出すとする。決定 (1) の (ウ) は稼働の記録を 24 時間の帯と直近 3 時間の細い帯だけにする。決定 (8) は記号の見方・表示先・初心者と経験者の切り替えを設定（⚙）の中に置く（切り替えは行 g-topbar が設定の一覧に置いた）。見本 board-v2 の stalledModal・noticeModal・seatModal・gapsModal・legendModal・destModal の幅と題に合わせる。

      形。新しい file src/wins.rs に、窓の幅と題の語の鍵 frame_of（質問 760・止まった run 720・知らせ 600・席と口座 760・抜けの検査 600・記号の見方 560・表示先 520）と、止まった run の窓の中身 stalled（pipeline の口の止まりの列の札を段を決めた時刻の新しい順に・題は台帳の一覧の題の全体・段の字は stage_word・経過は age_at・個別の頁は node_href・読めなければ測れていない・無ければ STALLED_NONE）を置き、wasm の枝の draw が窓の名ごとに中身を組む。知らせ・席と口座・抜けの検査・記号の見方・表示先は今の block の中身を窓で描く: src/project/notice.rs・legend.rs・gaps.rs・stage.rs に pub fn inner（見出しの無い本文）を足し、block の view も inner を描く（頁の形は替えない）。表示先の inner は作った時に 1 回読む。src/project/seat.rs に WIN_SPAN（24 時間）と inner を足し、src/project_dom/seat.rs は view と inner が同じ本文の関数 body に幅と停止の切り替えの状態を渡す（seat_view と strip_view は替えない）。窓の中の幅の button は stylesheet の規則 .mb .spanbar で出さない。質問の窓はこの行では今の質問の block（ask の view）を描く（1 問ずつは行 g-ask-win）。src/lib.rs に pub mod wins。stylesheet は窓の塊の末に止まった run の窓の規則（stc・stc-h・stc-r・stc-b・mb の中の sm）と spanbar の規則を足す。

