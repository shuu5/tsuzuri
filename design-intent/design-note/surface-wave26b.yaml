        req: ["FR5"]
        section: "3"
        write-set: ["+crates/tsuzuri-surface/src/widgets/modal.rs", "crates/tsuzuri-surface/src/widgets/mod.rs", "crates/tsuzuri-surface/style.css", "crates/tsuzuri-surface/vocab.json", "+crates/tsuzuri-surface/tests/bvwin.rs"]
