      lint（席の決め 2026-09-30 の確かめ）。58 file は境界の package の歯になり、境界の manifest の [lints] の workspace = true で workspace の lint の表（行 k-lint-tests の着地の後は unused_must_use・unwrap_used・panic・todo・unimplemented・exit・dbg_macro の 7 つ）に掛かる。歯の crate の根は行 k-lint-folio-tests の #![cfg(test)] を持つので、根の clippy.toml の歯の範囲の例外（allow-unwrap-in-tests ほか 5 つ）が歯の全部に効く。試作で、行 k-lint-tests の前の表（5 つ）・unwrap_used と panic を足した表・folio の根の一覧 DENY の 13 と indexing_slicing を 58 file の歯の根に置いた形の 3 つで、cargo clippy -p tsuzuri-boundary --tests -- -D warnings の違反は 58 file に 0 だった。main 33a14df9 の写し（7 つの表と行 k-lint-folio の [lints] の試作）と main 79d3b930 の写し（行 k-lint-folio の着地の [lints]）の clippy -D warnings も rc 0。除外の表 carry-exclusions.toml の R-4 の行の path（folio2/crates/folio/）は替えない（R-10 の行は行 k-lint-folio が消した）。

      今の字（main 79d3b930）。58 file はどれも子の処理で env! の CARGO_BIN_EXE_folio の binary を撃ち、57 file は repo の根の代わりに folio2/ を fn repo_root などの Path::new(env!(CARGO_MANIFEST_DIR)).join(../..) で引き、17 file は yaml_rust2 を直に使い、anchor・floor_cases・init の 3 file は src/sha256.rs と src/yaml.rs を #[path] で取り込む（yaml の取り込みに dead_code の expect の属性 1 行）。parts.rs は build.rs を #[path] で取り込み、関数 parts_catalog を直に呼ぶ歯 4 本を持つ。check.rs は folio の binary の --help で命令の一覧を読む歯 2 本（retired_render_help_does_not_list_render・p1_commands_closed_list）と、binary に render と --check を渡す歯 1 本を持ち、help.rs は binary の --help を fn help(&[]) で読む。modules.rs の層の表は main（層 5）を持ち、歯は宣言の集合に main を足す。folio の src/lib.rs（82 行）は mod sha256; と mod yaml; を私的に宣言し、module の doc の 1〜2 行目は crate の外へ公開するのは入口 entry の 1 つだけと書き、3〜4 行目は下の lint の一覧を残すわけ（行 k-lint-folio）を書く。folio の src/main.rs は lint の属性（行 k-lint-folio-deny・添字は行 k-lint-folio-idx-b）と fn main（入口を撃ち、標準出力を flush して終了 code を返す）の 28 行。folio の manifest は autotests の行も表 [[test]] も持たず、末尾は行 k-lint-folio の [lints] と workspace = true で、境界の manifest は表 [[test]] を持たない。xtask の歯 retire.rs の MOVED は 15 対（行 k-tz-drop の後）で歯は 3 本、klintf.rs の歯 klintf_src_roots_lint_attrs が見る根は src/lib.rs・src/main.rs・build.rs の 3 つ（歯の fn の中の for の配列・module の doc の 2 行目と一覧 DENY の doc の 1 行目は字 3 つの根 を持つ）で、klintf_ の歯は 4 本。3 行の着地は、folio の歯の置き場と境界の manifest と xtask の歯 retire.rs を書かなかった（main 33a14df9 と同じ字）。

      構造の連鎖（grep で全部・今の字）。字 CARGO_BIN_EXE_folio を持つ code は 58 file だけ（folio の歯のほかの 6 file と tsuzuri の crate と xtask に無い・境界の歯の字 folio は偽の program の名・folio2/docs の記録と退役した歯 2 本の字は範囲の外）。folio の src/main.rs を名指すのは、xtask の歯 klintf.rs の for の配列と、歯 modules.rs の層の表と宣言の足しと、移した対の一覧（この行が足す）だけ。src の sha256.rs と yaml.rs を #[path] で取り込むのは 3 file だけで、build.rs を取り込むのは parts.rs と constitution_enums.rs（folio の package に残す）だけ。folio の lib が歯だけに公開する 3 つ（yaml_rust2・sha256・yaml）を使うのは、この行の後の 20 file（yaml_rust2 の 17 と、sha256 と yaml の 3）だけ。入口 folio::entry::run を歯の中で撃つのは歯 fdrop・tzpar・tzent と、この行の後の check.rs と help.rs。歯の file の行の大きさの歯 f89_schema_teeth_are_split_and_under_the_cap（schema_docs.rs）が器の式で見る tests/schema.rs は置き換えの後も 700 行（字の数を 120 で割って切り上げた数の和・上限 700 のちょうど）、schema_docs.rs は 1,183 行（上限 1,200）で、置き換えで増えない。

      器の穴の 5 点（入れ子の crate）。(1) 器は folio2/ の重なりを見ないので、書く file が重なる行を depends に置く（下の流す時と順の段）。(2) 行数（wc -l・main 79d3b930 の写し）: folio の src/lib.rs は 6 行増え（82 行から 88 行）、src の file は 61 から 60 で合計は 33,420 行から 33,398 行（src/main.rs の 28 行が退く）。folio の歯の置き場は parts.rs から 1 file（parts_catalog.rs）を分け、ほかは字の置き換え。folio は除外の表の R-4 の行で大きさの数えの外。(3) 構造の連鎖は上の段。(4) verify の行は、folio の package の歯を -p folio、境界の package の歯を -p tsuzuri-boundary、xtask を -p xtask で名指す。器の受付の歯の置き場の照らしは、-p <crate> --test <名> を crates/<crate>/tests/<名>.rs で引くので、境界の package の歯になった 58 file の行は -p folio の行と同じく照らしの外になる（歯の file は write-set の dir の項目 folio2/crates/folio/tests/ が持つ）。(5) 着地の後に、席が xtask の check と nextest を手で 1 回撃つ。

      試作と噛み。起草 w49a が main 7a81444d に 4 行の試作（k-tz-drop と k-tz-self は起草 w42a の着地の字の patch・k-lint-folio-deny は起草 w43b・k-lint-folio-idx-a は起草 w47a の写しの commit〔klintf.rs は起草の鎖の字〕）を重ねた写しで試作し、main 3c614352 に 2 行の試作を重ねた写しに当て直した（上の在りかの段）。書く file は write-set の中で閉じる（差分の path は、folio の歯の置き場の 60 file〔書いた 59 と新しい parts_catalog.rs〕・manifest 2・folio の src/lib.rs・移した src/main.rs の 1 対・xtask の歯 2 の 66）。diff は、main 3c614352 の写しで git の移動を見つける形（git diff の既定・器の gate と同じ）の 117,122 byte、見つけない形（--no-renames）の 119,199 byte（gate の上限 150,000 の内・712 行足して 341 行消す・足す行のうち 234 は境界の manifest の表 [[test]] 58）。大きさは M（差分の多くは manifest の表と 58 file の字の置き換えで、判定を変える字は歯 4 本の読み先と parts の分けだけ）。xtask の check（分けない全部）は、main 7a81444d と 3c614352 の 2 つの写しのどちらでも rc 0（歯 2,915 本・うち境界の package の歯になった folio の歯 58 file の 918 本と、folio の package の歯 7 file の 25 本・5〜8 分）。w48b の 2 行と行 k-lint-tests の代わりを重ねた 3 つ目の写しでも、xtask の check は rc 0（歯 2,914 本）で、diff は 117,213 byte（--no-renames で 119,352 byte）。verify の行は 3 つの写しで緑（f2ret_ 5・klintf_ 5〔w48b の 2 行を重ねた写しでは 4・行 k-lint-folio-idx-b が歯 klintf_idx_module_deny を外す〕・skeleton_ 9・check_canonical_design_intent_passes 1・p1_commands_closed_list 1・retired_render_ 2・f192_ 4・f125_ 7・anchor_ 3・境界の parts_ 21・folio の parts_catalog の parts_ 4・p106_ 2 本・clippy は rc 0）。変異 15（folio の src/main.rs を元の path に戻す・境界の manifest から歯 gate の表を消す・folio の manifest から autotests の行を消す・歯の名に filter の語 graph_・klintf の根の一覧に src/main.rs を戻す・folio2 の置き場の規則の表に知らない節・lib の入口に口 render を戻す・命令の一覧の歯が tz の binary の --help を読む・歯 init の src/init.rs の path を戻す・lib の sha256 の 16 進を大文字に・歯 parts_catalog の部品目録の置き場を 1 段浅く・歯 modules の層の表に main を戻す・境界の開発の依存に yaml-rust2・移した歯 hello に clippy の len_zero・移した歯 gate の repo の根を戻す）を main 7a81444d の写しで 1 つずつ当て、done の歯（f2ret_folio_binary_retired・f2ret_folio_tests_named_once・f2ret_files_moved_to_retired・f2ret_own_names_clean・klintf_src_roots_lint_attrs・check_canonical_design_intent_passes・p1_commands_closed_list・retired_render_subcommand_is_unrecognized・retired_render_help_does_not_list_render・f192_the_command_list_carries_the_same_texts・f125_・anchor_・parts_・p106_layers_cover_every_module・skeleton_boundary_std_only_and_bin_tz・clippy・xtask の check の歯 gate）は、どれも少なくとも 1 つの変異で落ちた（噛みの log は起草の係の dir の bite-tzt.log と results-tzt.json・folio の組み立てを壊す変異は数えない）。main 33a14df9 に行 k-lint-folio-idx-a・idx-b・k-lint-folio の試作を重ねた 4 つ目の写しでも、verify の行と xtask の check（歯 2,914 本）は rc 0 で、同じ変異 15 は全部噛んだ（bite-tzt-33a14df9.log）。その写しの diff は 117,055 byte（--no-renames で 118,984 byte・709 行足して 329 行消す）。main 79d3b930（3 行の着地の後）に当て直した 5 つ目の写しでも、verify の行（klintf_ は 4 本）と xtask の check（歯 2,914 本）は rc 0 で、同じ変異 15 は全部噛んだ（klintf の根の変異は for の配列の形・bite-tzt-79d3b930.log）。その写しの diff は 117,973 byte（--no-renames で 119,902 byte・711 行足して 331 行消す）で、差分の path は同じ 66。

      filter の語。verify の新しい語 retired_render_・f125_・anchor_ と、新しい歯の名から f2ret_ を除いた字 folio_binary_retired と folio_tests_named_once は、main 7a81444d の契約表の verify の最後の字 346 語（同じノートの k-tz-drop の節の一覧の 331 語に、後に置いた行の語を足した集合）のどれとも、どちらの向きの部分の字としても重ならない（同じ字の語を除く）。f2ret_・klintf_・skeleton_・check_canonical_design_intent_passes・p1_commands_closed_list・f192_・parts_・p106_ は着地済みか置いた行の語。parts_catalog.rs の 4 本は parts.rs から名を替えずに分けた歯で、verify は着地済みの語 parts_ で撃つ。

      流す時と順。depends の 6 行は全部着地済みで、k-tz-drop（folio の src の entry.rs・lib.rs と歯 check.rs・help.rs・init.rs・modules.rs と xtask の歯 retire.rs を書いた・口 inject と serve の歯を先に退けた）・k-tz-self（folio の binary を退ける前に、面の server と問いの門と tz graph の索引の読みの既定を tz 自身にした）・k-lint-folio-deny（folio の src/main.rs と lib.rs と歯 anchor・floor_cases・init・parts と klintf.rs を書いた）の 3 行と、k-lint-folio-idx-a（main 8a347565・src/sha256.rs の module の属性と、この行が書く歯 graph・graph_notes・parts・bundle・vocab を verify で撃ち、klintf.rs を書いた）・k-lint-folio-idx-b（main 1fc76265・folio の src の 23 file と lib.rs の lint の一覧と klintf.rs）・k-lint-folio（main 79d3b930・folio の manifest に [lints] を足し、除外の表の R-10 の行と klint.rs を書いた）。着地済みの行 k-lint-tests（xtask/tests/retire.rs に #![cfg(test)] を置き、表に unwrap_used と panic を足した）の字には当ててある。この行の後、folio の歯の verify は -p tsuzuri-boundary で撃つ（folio の package に残る歯は 7 file）。

      席の手（行にしない）。この行の着地の後は main から folio という名の binary を組めない。席の置き場の pin 留めの folio は着地の後も撃てるので、設計の commit の門（schema・check・derive・build の 4 つ）と面の server の起こし直しの --folio と PATH の folio を tz の pin へ切り替えるのは、次の pin の更新より前に行う（判断の記録 ADR-18 の決定 (2) の等しさの確かめの後）。手順は起草の係の dir の seat-switch.md。

      採らなかった案。歯の file を境界の crates/tsuzuri-boundary/tests/ へ git で移す形は、歯の中の材料の相対の path（folio2/tests/fixtures ほか 57 file）と、歯の file の path を名指す着地済みの歯（klintf_test_roots_cfg_test・f89_schema_teeth_are_split_and_under_the_cap）と、除外の表の path を全部替え、持ち込んだ木の外に folio の歯が出る。境界の開発の依存に yaml-rust2 を足す形は、境界は外の依存を持たないの決め（骨組みの歯 skeleton_boundary_std_only_and_bin_tz と、境界の依存の列を字で見る着地済みの歯 6 本）を緩める。folio の binary を残して歯だけ tz を撃つ形は、判断の記録 ADR-8 の決定 (1) に反する。

      範囲の外。着地済みの行の字（k-join-folio・t-carry-retire・k-tz-drop・k-lint-folio-tests ほかの verify の -p folio --test <名> の行と、k-tz-entry の write-set の素の path folio2/crates/folio/src/main.rs）は、この行の後は撃てないか元の path に無いが替えない（前例は k-tz-drop の節の範囲の外の段）。根の Cargo.toml の profile の注（folio の歯は folio の binary を子の処理で撃つ）の字は替えない（opt-level 2 は folio の lib に効き、tz の binary の中の folio の code も同じ）。CI（nextest の --workspace）と xtask の check の段は替えない。持ち込んだ木の材料（folio2/design-intent と folio2/docs）の folio の binary を名指す字。tz の知らない subcommand の断りの字。席の道具の切り替え（上の席の手）。
  - n: 19
    type: prose
    title: 行 m-doctor-hold — 器の doctor の出力の持ち回しの上限だけを 60 秒にする
    body: |
      在りかの main は 754442db（このノートの 16 行が置かれ、行 k-tz-tests〔便 t3-hub.74.4〕が走っている）。起草 w50a が main 754442db の写しで試作した。書く file は境界の server の seat（src/server/seat.rs）と、着地済みの歯の file 3 つ（tests/eheld.rs・tests/server_seat.rs・tests/server_acct.rs）と、新しい歯の file tests/mdoch.rs。

      なぜ。判断の記録 ADR-26（持ち主の裁定 t3-hub.52.156:20260930T1120Z-1 と t3-hub.52.157:20260930T1120Z-1・案 A）の決定 (2) の行。判断の記録 ADR-23 の行の全部と行 m-big-copies の着地の後も、面の server の頁 1 枚の 300 秒の平均が規則の行 R-34 の 20% を越えた回が残った。器の doctor の撃ちは頁の 300 秒に 71〜85 本で、doctor だけの上限を 60 秒にした試作（起草 w36a の試作 B・この行と同じ形）は、並べた測りで doctor の計算を 1.2〜2.8 ポイント減らし、打ち切った台帳の読みまで数える組で頁の全体を 28.0% から 24.9% にした。使用量の読み（usage）と規則の行の読み（rules get）の計算は頁の 0.1〜0.2 ポイントで、延ばしても減らないので 30 秒のままにする（ADR-26 の却けた案 d）。これだけでは越えた回を 20% の内に戻せず、残りは器の側の直し（ADR-26 の決定 (4)・器の席は doctor の入口で event log を 1 回だけ読む便を器の側で起こすと答えた・出所は問い t3-hub.52.157 の notes）で扱う。

      形。src/server/seat.rs の pub const SLOW_HOLD の直後に pub const DOCTOR_HOLD（Duration の 60 秒・doc は doctor の出力を持ち回す長さ）を足し、pub fn ceiling を 3 つの腕に分ける（頭が DOCTOR_ARGS なら DOCTOR_HOLD、USAGE_ARGS なら SLOW_HOLD、ほかは HOLD）。SLOW_HOLD の値は 30 秒のままで、その doc を、残量の出力と境界の acct の規則の行の読み（rules get）を持ち回す長さの字にする。module の doc の 10 行目と fn ceiling の doc の字を、doctor は DOCTOR_HOLD（60 秒）・usage は SLOW_HOLD（30 秒）の字にする。境界の acct の fn held_rule（rules get を印の無い鍵で SLOW_HOLD の間持つ）と、fn read_held（頭ごとの ceiling(head) を表に渡す）と、doctor の入力の印（fn input_marks・ADR-23 の決定 (2) のまま・event log を含むので器の event の書きの後の要求では上限の内でも撃ち直す）と、表の Held と読めなかった読みの FAILED_HOLD（5 秒と上限の短い方）は変えない。src の足しは unwrap・expect・panic・todo・unimplemented・dbg・exit を使わない。依存と口の電文の形は変えない。

      開示（ADR-26 の決定 (3)・歯は測らない）。doctor の印の外の入力（tmux と起動の管理と口座の dir の file と plugin と git）の変化と、doctor の語の打刻が無いと読めないの変わりは、上限の 60 秒を過ぎた後の最初の頁の読み直しで面に出る。遅れる面の字は、account board の次の移り先と移り先の候補と候補が門で落ちた理由と休止中の席の列、席の card の群の行（断りと逼迫の欄）と anchor で、写す字は変えない。

      今の字（main 754442db）。src/server/seat.rs の 47〜48 行は、doc の字 doctor と残量の出力を持ち回す長さ（入力の印が動けば、この中でも撃ち直す）。と pub const SLOW_HOLD の 30 秒の定義で、210〜217 行の pub fn ceiling は、頭が DOCTOR_ARGS か USAGE_ARGS なら SLOW_HOLD、ほかは HOLD を返す 1 つの腕（if head == DOCTOR_ARGS || head == USAGE_ARGS）。276〜284 行の pub fn read_held は held.get(&key, &input_marks(seat, head), ceiling(head), || { seat.shoot(head) }) で表に渡す。境界の src/acct.rs の 374〜382 行の fn held_rule は、鍵に rules get の引数を置いて self.held.get(&key, &[], SLOW_HOLD, || { ... }) で持つ（本体は字 SLOW_HOLD を 1 度持つ・doc の行は本体の外）。acct.rs は字 DOCTOR_HOLD を持たない。着地済みの歯で字 SLOW_HOLD を持つのは tests/eheld.rs（import と歯 eheld_vessel_marks_by_head の 292〜295 行・ceiling(&DOCTOR_ARGS) を SLOW_HOLD と比べる 294 行だけがこの行で赤になる）と tests/server_seat.rs（import と歯 server_seat_holds_outputs_five_seconds の 507 行の失敗の文 doctor と usage は {SLOW_HOLD:?} 持つ）と tests/server_acct.rs（歯 server_acct_holds_five_seconds の 717 行の注）の 3 つで、ほかの歯の file は持たない。2 つの歯 server_seat_holds_outputs_five_seconds と server_acct_holds_five_seconds は 5 秒の後の読みだけを見るので、この行の後も通る。

      着地済みの歯の書き替え。tests/eheld.rs は seat の import に DOCTOR_HOLD を足し（2 行のまま）、294 行を assert_eq!(ceiling(&DOCTOR_ARGS), DOCTOR_HOLD); にする。tests/server_seat.rs は import に DOCTOR_HOLD を足し、507 行の失敗の文を doctor は {DOCTOR_HOLD:?}・usage は {SLOW_HOLD:?} 持つ にする（5 秒の後の読みの数えは変えない）。tests/server_acct.rs は 717 行の注を、doctor は DOCTOR_HOLD の間、usage と rules get は SLOW_HOLD の間持つ字にする。どの file も行の数は変えない（server_acct.rs は 1369 行のまま）。

