  - n: 3
    type: prose
    title: 行 e-reason-id — 問いを閉じる理由の裁定 id の後ろを半角の空白で区切り、方針は 裁定 policy:<id> で閉じる
    body: |
      在りかの main は 09d898f6。この節の今の字と試作の数は起草の main 922314b0 のもの（行 k-tz-entry の着地で、この行が書く server_batch.rs と置き場の server_ask.rs の字が変わるので、便はその着地の後の main に当て直す）。書く file は境界の crate の server の ruling.rs と batch.rs と policy.rs と、新しい歯の file の rsid.rs と、着地済みの歯の file の server_batch.rs・bhalf.rs・rvk.rs・epolq.rs（期待の argv の字だけ）。第 0.2 版の行（方針の閉じを範囲の外に置いた形）に、器の席の 2 つ目の答えの方針の閉じの形を足した直し。

      なぜ。器（scribe2）の席の答え（2026-09-30T05:1xZ）。器の close の理由の読み手（器の main 09197b21 の ledger/close_reason.rs の pub fn read）は、前後の空白を除き Unicode の空白で割った 1 語目を 9 つの頭と照らし、頭が 裁定 なら 2 語目だけを裁定 id の形（問い id の形 <問い id>:<年月日 T 時分 Z>-<n>・batch: の形・policy: の形）で読み、3 語目から後は読まない。tsuzuri の束の受付（batch.rs の fn accept）は問いを 裁定 <id>・束 <束の id> で閉じ、取り消し（ruling.rs の fn reopen）は問いを 裁定 <id>・取り消す = <前の id> で開き直す。空白で割ると 2 語目は id と字 ・ と次の語の頭をつないだ字になり、問い id の形の裁定 id は値の形の外に落ちる（数の欄が 1・束 のような字になる）。方針の受付（policy.rs の fn accept）は方針の問いを 方針 <方針の id> で閉じ、1 語目が 9 つの頭の外に落ちる。器が局面の出力（lifecycle.json・器の束 E の W4）へ切り替えた後に、tsuzuri が閉じた問いが misfit と判じられないように、器の読み手を変えずに解ける形へ直す。器の席の 2 つ目の答え（2026-09-30）は、方針の閉じには器の頭を足さず、裁定 policy:<方針の id> の形にするとした（器の close_reason.rs〔main 918b9180〕は裁定 id の形として policy:<字> と batch:<字> を既に受ける・const RULING_POLICY と fn is_ruling_id）。

      形。ruling.rs に pub const REASON_HEAD（字 裁定）と pub fn reason（裁定 id と続きの字の Option を受け、続きが無ければ 裁定 <id>、在れば 裁定 <id> <続き>・区切りは半角の空白 1 つ）を置き、1 問の裁定の close（fn accept）・取り消しの開き直し（fn reopen・続きは 取り消す = <前の id>）・束の close（batch.rs の fn accept・続きは 束 <束の id>）の 3 か所の理由をこの fn で組む。方針の問いの close（policy.rs の fn accept）は、ruling.rs の pub const POLICY_MARK（字 policy:）と pub fn policy_reason（裁定 policy:<方針の id>）で組む。方針の id は今までどおり <方針の問いの id>:<分>-1 で、notes の 方針 id = の行も変えない。新しく書く理由は 裁定 <id>・裁定 <id> 束 <束の id>・裁定 <id> 取り消す = <前の id>・裁定 policy:<方針の id> の 4 形で、1 問の形の字は今と同じ。続きの字（束 の語と束の id・取り消す = と前の id）は今のまま残す（器の読み手は読まないが、台帳を人が読む時の手がかり）。notes の定型行（裁定 id = <id>・問い = … の形と、その欄の終わりの字 ・）は変えない。新しい歯の file rsid.rs は crate の根に #![cfg(test)] を置き（規則 R-10 の lint の行が統合の歯の crate の根に置く形・歯の中の unwrap と panic は clippy の allow-*-in-tests で許す）、src の足しは unwrap・expect・panic・todo・exit・dbg を使わない。

      方針を承認に数えない（要件 FR8）。方針の閉じの頭が 裁定 になっても、tsuzuri の承認の数えは close の理由を読まない。問いの頁の block これまでの決定（面の project の askpage の fn rulings）は、範囲の札の label（契約の ledger の LedgerRow の is_policy・頭 policy-scope:）で方針の問いを外す。効いている裁定と取り消しの判じ（契約の surface の latest_ruling・revocable）と配達（中核の delivery の undelivered）と導出グラフの裁定の節点は、notes の 裁定 id = の行だけを読み、方針の問いの notes の 方針 id = の行は方針の節点になる。この読みが close の理由の形に依らないことを歯 rsid_policy_not_ruling が測る。後で close の理由を承認として読む読み手を足すなら、2 語目の頭の POLICY_MARK で方針を見分ける（器の席の答えの勧め）。

      前の形の読み。tsuzuri の中で close の理由を読むのは、中核の graph の check の fn landed（頭が landed か 着地 の理由だけを着地と読む）と、中核の pipeline の fn closed_reason（閉じた契約 bead の札の段の理由の字・空白の続きを 1 つに畳んだ頭の字）の 2 つだけで、どちらも裁定 id を引かない。そのため、前の形で閉じた台帳の行（起草の時の台帳の export の写し .beads/issues.jsonl で、閉じた問いの理由は束の形 47 本・1 問の形 32 本・方針の形 2 本）も今どおり読め、取り消しも同じに受ける（歯 rsid_old_form_revokes）。台帳の前の行は書き換えない。

      今の字（main 922314b0）。ruling.rs の fn accept は理由を format! の字 裁定 {id} で、fn reopen は format! の字 裁定 {id}{ID_END}{REVOKES}{} と req.ruling で、batch.rs の fn accept は format! の字 裁定 {id}{ID_END}束 {batch} で、policy.rs の fn accept は format! の字 {TITLE} {id}（TITLE は字 方針）で組む（ID_END はどの file も字 ・ の const）。着地済みの歯は、server_batch の fn row_argvs が 裁定 {ruling}・束 {batch} を、bhalf の fn row_argvs が 裁定 {ruling}・束 {batch_id} を、rvk の fn reopen_argv が 裁定 {id}・取り消す = {revokes} を、epolq の fn three が 方針 {POLICY_ID} を期待の argv に組み、epolq_all_writes_three は 3 回目の argv の 3 語目を字 --reason=方針 {POLICY_ID} と比べる。この行でどれも新しい形に書き換える。rvk の rvk_reopen_argv_and_wire と契約の crate の cform_ledger と snapshot の ledger.json は、LedgerWrite の argv と電文の形を字の見本で見るだけで server の理由を見ないので、前の形の見本のまま変えない。1 問の close を見る server_ask と eretry の期待の字 裁定 {id} は変わらない（server_ask_ruling_writes_twice と eretry_read_retries_then_writes は、1 問の理由の字が変わる変異で落ちる）。server_batch の fn row_argvs を使う歯のうち server_batch_id_counts_up_in_same_minute と server_batch_own_verbatim_or_batch_verbatim は notes の追記の argv だけを比べ、close の理由を見ない。着地済みの歯 dretry_spawns_use_pace と fserve_words_and_deliver は ruling.rs と batch.rs の字を読むが、この行の字（reason・policy_reason・REASON_HEAD・POLICY_MARK）は数えない。

      器の読み手での確かめ。器の main 46205eaa（close の理由の読み手は 918b9180 と同じ字で、それが引く is_bead_id と epoch_of も 09197b21 から変わっていない）の close_reason.rs を起草の場の外の一時の crate に写し、台帳の接頭辞 t3 で掛けた。新しい 3 形（裁定 t3-hub.59.28:20260930T0215Z-1・同じ id に 束 batch:20260930T0215Z-1 を続けた形・別の id に 取り消す = <前の id> を続けた形）は Form::Ruling でそれぞれの id を返し、裁定 policy:t3-hub.62:20260928T1050Z-1 は接頭辞が在っても無くても Form::Ruling で policy:t3-hub.62:20260928T1050Z-1 を返した。前の束と取り消しの形は Defect::Value(Head::Ruling) を、前の方針の形 方針 t3-hub.62:20260928T1050Z-1 は Defect::UnknownHead を返した。写した読み手の in-file の歯 7 本も緑。器の file は書いていない。

      決めた幅（起草の決め）。(a) 区切りは器の勧めの半角の空白 1 つ（器の読み手は全角の空白でも割るが、勧めの字に揃える）。(b) 理由を組むのは ruling.rs の 2 つの fn（reason と policy_reason）に寄せ、batch.rs と policy.rs はそれを呼ぶ（頭と区切りと印を 2 か所に書かない）。(c) 方針の閉じの理由に続きの字は付けない（方針の範囲は notes の 方針 id = の行と label に在る）。(d) policy.rs の const TITLE（字 方針）は方針の問いの題に残る。

      試作と噛み（起草 w46a）。main 922314b0 の写しにこの行を当てた木で撃った。書く file は write-set の書く file の 8 で閉じる（試作の diff 31,026 byte・足し 541 行・消し 15 行・src の増えは ruling.rs が 22 行・batch.rs が 0 行・policy.rs が 0 行）。xtask の check は rc 0（歯 2,936 本）。変異 13（理由の区切りを字 ・ にする・束の close を前の字の形に戻す・取り消しの開き直しを前の字の形に戻す・続きの無い理由の末に空白を足す・理由の頭を別の字にする・束の close が束の id を落とす・1 問の close が理由を自前で組む・歯の file に filter の語を含む歯を足す・方針の閉じを前の字 方針 <id> に戻す・方針の閉じが印を落とす・方針の印を別の字にする・台帳の読みが方針の問いを見分けない・配達の読みが方針の行も裁定と数える）で、done の各歯が少なくとも 1 つの変異で落ちた。

      filter の語。新しい接頭辞 rsid_ は、main 4ad0b18f の contracts の verify の filter の語（322 語・畳んで 247 語）のどれとも部分の字として重ならず、どの filter の語も rsid_ を含まない。main 922314b0 で足された filter の語はこの行の rsid_ だけ。

      filter の語の一覧（main 4ad0b18f の contracts の verify の filter の語を畳んだ 247 語・空白で区切る）。歯 rsid_own_names_clean は、この一覧を歯の file の const に字のまま写し、語の数 247 を断言してから照らす。一覧は次のとおり。 aaround_ abss_ abst_ accept_ acchold_ account_ acctcore_ acctdoc_ accthb_ accthome_ acctled_ acctlook_ acctpcore_ acctproj_ acctsess_ acctwin_ acctwire_ aface_ afocus_ alean_ aord_ aown_ apark_ apop_ areread_ askcard_ athr_ batchpanel_ bhalf_ board_min_ bport_ brand_ btuck_ cadl_ cadopt_ cadq_ cdorm_ cexcl_ cfsplit_ cg9_ cgdom_ cishard_ cmark_ cnote_ cnret_ contract_form_ cround_ csled_ cspk_ ctick_ cupd_ cupdlist_ denv_ dnedge_ dngrp_ dnrow_ dnskip_ dretry_ dstg_ ecache_ eheld_acct_ eheld_design_ eheld_held_ eheld_marks_ eheld_vessel_ elazy_ epolq_ eretry_ esig_ evkind_ f123_ f159_ f212_ f2ret_ fdlt_ fdlv_ flight_ fmark_ fprem_ frame_ fserve_ fstop_ fundl_ fxpre_ g3g7_ gacct_ gapspage_ gatt_ gbnote_ gchip_ gcoach_ gext_ gfix_ gfresh_ ghb_ gins_ gjst_ glabel_ gmret_ gmretw_ gnav_ gpface_ gpill_ gpulse_ graph_ gsum_ gtuck_ gview_ gwv_ hacols_ harest_ hasplit_ hbconf_ hbmark_ hbon_ hbpost_ hbproc_ hbroute_ hcard_ hcled_ hcnx_ hcproj_ hcsess_ hdchip_ hfig_ hnunk_ hook_ hruling_ hsblock_ hsderive_ hshist_ hspage_ hspk_ hsym_ hthr_ http_ hwstore_ iclose_ ilink_ inject_ jcount_ jrun_ kcli_ kdeny_ kg9_ kindlab_ klink_ ksum_ lateface_ launch_ lcard_ ledgerblock_ lgrp_ lhome_ lidle_ lkind_ lresume_ lsnap_ lspark_ lstg_ lstore_ mapview_ mkeys_ mlink_ mqask_ mqface_ mstore_ mtips_ mtree_ nact_ nbatch_ ncard_ nextstep_ nodepage_ nstall_ nsum_ nsumw_ ntc_ ntime_ nxact_ nxorg_ parts_ pci_ pclosed_ pfold_ pgsw_ pgz_ pipe_ pkac_ pkview_ plimit_ pmisfit_ pmore_ popapp_ pquest_ pqueue_ project_ ptitle_ pubfp_ pubscan_ punmap_ pwhole_ qblock_ qgate_ qkey_ qsig_ question_ rbusy_ relay_ rhold_ runsdoc_ rvk_ saxis_ sclosed_ seatblock_ seatcard_ server_ sesplit_ sgrace_ shb_ skeleton_ smore_ stage_ stats_ stbp_ stcli_ steady_ sthr_ stnfy_ stskill_ sttgt_ sxaxis_ tgall_ tgown_ ticker_ tipx_ tkad_ tlic_ topbar_ topfit_ tz_ udacct_ udash_ unow_ urpanel_ uword_ wstrip_

      流す時と順。depends は k-tz-entry（席の決め 2026-09-30・tz 化を先に進める）。行 k-tz-entry は、この行が書く server_batch.rs と、この行の置き場の server_ask.rs を書くので、この行はその着地の後の main に当て直してから流す（重なる file は、その着地の後の字に当てる）。行 k-lint-tests も境界の crate の tests/ の dir を書くので、この行と同時には流れず（器の交差の断り）、後に着地する方が当て直す。器の局面の出力の切り替え（器の束 E の W4）より前に着地させる。この行の後に同じ ruling.rs・batch.rs・policy.rs を書く行は、この行の着地の後に当て直す。

      範囲の外。台帳に在る前の形の理由の書き換え。器の読み手の変更。notes の定型行の形。close の理由を承認として読む新しい読み手。

  - n: 4
    type: prose
    title: 行 k-tz-entry — folio の口を tz の subcommand にする入口
    body: |
      在りかの main は 4ad0b18f（ノート surface-wave24a 第 0.1 版・計画 surface-plan の 9 節の計画だけの行 k-parity を割った最初の行）。起草 w42a が main 4ad0b18f の写しで試作した。起草の後の main 922314b0 までに動いたのは設計文書だけ（ノート surface-wave24a の 1 行目 e-reason-id と計画 surface-plan 第 1.17 版）で、試作の差分はそのまま当たる。書く file は write-set の 19（folio の src の main.rs と新しい entry.rs と lib.rs・folio の歯 modules・境界の新しい src/cli/folio.rs と cli/mod.rs と lib.rs と main.rs・境界の manifest と根の錠・xtask の src/main.rs・新しい歯 tzent・境界の依存の列を見る着地済みの歯 7 file）。

      なぜ。要件 FR17 と判断の記録 ADR-8 の決定 (1)〜(6) は、人が打つ binary を tz の 1 つにし、folio の 11 の口（check・schema・derive・ceiling・init・parts・face・figure・build・intake・hello）を同じ名の tz の subcommand にし、引数と終了 code（合格 0・不合格 1・まだ分からない 2）を folio の口のままにし、graph を tz graph に吸収し、inject を持たず、folio の crate を library として残すと決めた。持ち込んだ folio（行 k-join-folio で根の workspace の member）は binary の入口 main.rs の中に命令の読みと印字を持ち、tz から呼べる入口が無い。この行が入口を lib に出し、tz の口を渡す。folio の歯を tz へ移すこと・folio の binary の退役・inject と serve の退役・設計の索引の読みの既定を tz 自身にすることは後の行（4 節の範囲の外）。

      形（folio の lib の入口）。folio の src/main.rs を git の移動で src/entry.rs にし、module の宣言 60 を新しい src/lib.rs へ移す（pub は entry の 1 つだけ・ほかは crate の中）。entry.rs の fn main を pub fn run にする。run は引数の列（頭は命令の名）と、標準出力と標準エラーの書き先（&mut dyn Write の 2 つ）を受け、終了 code を u8 で返す。印字の macro 53 は、書き先へ 1 行を書き書けなければ黙る macro say に替える（閉じた pipe で落ちない）。命令の読みは clap の try_parse_from で、読みの誤りと --help は clap の render の字（色を付けない）を、use_stderr が真なら標準エラーへ・偽なら標準出力へ書き、clap の exit_code を返す（誤り 2・--help 0・前の folio の binary と同じ code）。図の道具の書き出しの後始末 figure::sweep は run の終わりに撃つ（前の fn main と同じ）。床の口の違反と要約の行の向き（--emit-amends と --emit-rulings では標準エラー・ほかは標準出力）は、前の closure の代わりに fn emit が持つ。entry.rs は crate の module を use crate の括り書きで名指す。新しい src/main.rs は folio::entry::run を std::env::args_os と標準出力と標準エラーで撃ち、返った code で終わるだけ（folio という名の binary の退役は後の行）。serve.rs の直接の印字 5 は変えない（serve は tz へ渡さない）。folio の file に rustfmt を掛けない（行 k-join-folio の節の決め）。

      形（tz）。境界の新しい src/cli/folio.rs に、口の名の閉じた一覧 NAMES（要件 FR17 の字の順の 11）と、索引の旗 INDEX_FLAGS（--print・--digest・--summary）と、索引の旗と混ぜない tz graph の旗 GRAPH_FLAGS（--check・--design・--repo・--bd・--folio・--state-dir・--project）と、fn run（命令の名 tz と口の名と引数の列で folio::entry::run を撃ち、標準出力と標準エラーへ書く）・fn is_index（索引の旗を 1 つでも持つ）・fn graph（GRAPH_FLAGS の名〔--名 と --名=値 の名〕が在れば標準エラーに 1 行と tz graph の使い方を書いて 1・無ければ口 graph を run）を置く。境界の main.rs の口の振り分けに腕を 2 つ足す（graph の腕の前に、is_index の真の graph を fn graph へ・stage の腕の後に、NAMES の名を fn run へ）。cli/mod.rs に pub mod folio と doc の 1 行、lib.rs と main.rs の module の doc に 1 行ずつ足す。境界の manifest の依存に folio の path（../../folio2/crates/folio）と注の 1 行を足し、根の錠の tsuzuri-boundary の dependencies に folio の 1 行が入る（外の部品の名は増えない・folio の clap と yaml-rust2 が tz の binary に入る・判断の記録 ADR-21 の承認の内）。面の crate は境界を開発の依存でだけ持つので、wasm の組みに folio は入らない。

      名の衝突と graph の吸収。tz の今の subcommand は surface・graph・hook・stage の 4 つで、11 の口の名とは重ならない。graph は吸収の形を次にする: 索引の旗を 1 つでも持つ tz graph は folio の graph の口へ渡し（引数・出力・終了 code は folio graph のまま・--dir の既定も folio の design-intent）、持たない tz graph は今の口（旗なし・--check・--design・--repo ほか）のまま。2 つを混ぜた引数は使い方の誤り 1。判断の記録 ADR-8 の決定 (3) の索引だけの眺めは今の tz graph --design のまま。面の server と問いの門と tz graph の設計の読み（境界の server の design の FOLIO_ARGS の字 graph --print --dir と、要約の graph --print --summary --dir と、裁定の書き出しの check --emit-rulings --dir）は、同じ引数の字で tz を撃てる形になる（読みの既定の program を tz 自身にするのは後の行）。

      字（断りと usage）。tz の知らない subcommand（inject・serve を含む）は今の断りのまま、標準エラーの 1 行目が字 tz: subcommand で rc 1（inject は判断の記録 ADR-8 の決定 (4)・serve は同じ決定 (5) と要件 FR17 の面の便の決め）。混ぜた tz graph の断りは字 tz graph: 索引の旗（--print・--digest・--summary）と <旗> は混ぜない の 1 行と tz graph の使い方の行。clap の usage の行の命令の名は、tz の口では tz（run の頭の引数）、folio の binary では folio（argv の頭）。そのほかの出力の字（例えば床の要約の行の頭の字 folio check: 不合格（違反 1・ や、口の断りの字 folio derive:）は folio の口のままで、byte の一致（要件 FR17・受入 AC14）は行 k-tz-parity の歯が見る。前の folio の binary は端末へ色付きの誤りの字を出したが、入口は色を付けない（pipe の字は前と同じ）。

      usage の行の字（clap 4 の形）。口の --help の標準出力と、clap の読みの誤りの標準エラーの usage の行は、tz の口では Usage: tz <口の名> で始まり（<口の名> の後に空白と引数の説明が続く）、folio の binary と lib の入口 folio::entry::run では Usage: folio <口の名> で始まる。混ぜた tz graph の断りの使い方の行は usage: tz graph で始まる（頭は小文字）。done の「半角のコロンの 1 字」は字 : のことで、done の字にはコロンと空白の並びを書けないのでこう書く。

      folio の歯の modules。folio の歯 tests/modules.rs（便 106）は区切りの宣言を src/main.rs から読み、src の file の名と層の表を比べるので、この行で書き替える: 層の表の層 5 に entry と lib を足し、宣言を src/lib.rs から読み（pub mod の行も数える）、宣言の集合に lib と main を足し、接頭辞の無い区切りの名を数える file を lib にする（module の doc の 2 行も直す）。層が上がる辺の凍結した一覧は変わらない（entry は層 5 で、名指す区切りは全部それより下か同じ層）。folio のほかの歯は src/main.rs を読まない（grep で確かめた）。

