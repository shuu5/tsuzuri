    type: prose
    title: '行 k-lint-tests-face — 面の crate の統合の歯の crate の根に #![cfg(test)] を置く'
    body: |
      在りかの main は 214118b4 に同じノートの行 k-lint-base を当てた木。起草 w43a が main 4ad0b18f の写しで試作した。書く file は面の crate の tests/ の直下の 139 の .rs と、xtask の歯の file klint.rs。

      なぜ。根の clippy.toml の歯の範囲の例外（allow-unwrap-in-tests ほか 5 つ）は、#[test] の関数と cfg(test) の中にだけ効き、統合の歯の file の #[test] の外の手（fixture を組む関数など）には効かない。そこで R-10 の unwrap・expect・panic・添字・print は歯の file で 2,182 か所に当たる（行 k-lint-base の節）。器（scribe2）は手ごとに理由つきの #[expect] を 310 置いたが、tsuzuri の歯の file は 279 あり手が多い。統合の歯の crate は cfg(test) の時だけ組まれるので、crate の根の頭に #![cfg(test)] を置いても組まれる code は変わらず、clippy は crate の全部を cfg(test) の中と読み、歯の範囲の例外が手にも効く（写しの歯の file 1 つで 46 か所が 0 になり、全部の根に置くと tsuzuri の歯の R-10 は 2,182 から unreachable 5 と unsafe 1 の 6 になった）。歯の範囲の例外は lint の設定（clippy.toml）が宣言し（条 P-24.3 の後半）、#![cfg(test)] はその file が歯であることを書くだけで lint を黙らせる属性ではない。

      割り方。全部の根の差分は 177,025 byte で審査の上限（150,000 byte）を越えるので、面の crate の 139（この行・87,767 byte）と、残りの 139 と表の足し（行 k-lint-tests・91,493 byte）に割る。この行は表を変えない。

      形。各 file の頭の字 //! で始まる行の続きの直後に #![cfg(test)] の 1 行を足す（起草 w43a の add-cfg-test.py・既に持つ file は触らない）。xtask の歯の file に歯 klint_test_roots_cfg_test と一覧 SWEPT（crates/tsuzuri-surface の 1 つ）を足す。歯は根の members のうち SWEPT に在り除外の表の R-10 の行が名指さない member の tests/ の直下の .rs と tests/<dir>/main.rs を見て、頭の //! の行の続きの直後の行が #![cfg(test)] でその行が 1 つだけであることを見る。write-set は面の crate の tests/ を dir の形（字 / で終わる項目）で書く（139 の file を並べない・tests/snapshots と fixtures は書かない）。

      今の字（main 4ad0b18f）。面の crate の tests/ の直下の .rs は 139 で、どれも #![cfg(test)] を持たない。harness を切った歯（[[test]] の harness = false）は workspace に無い（cfg(test) が立たない歯の crate は無い）。

      試作と噛み。行 k-lint-base の上に当てた木で、歯 klint_ の 7 本が緑（統合の歯の crate は cfg(test) の時だけ組まれるので、歯の本数は変わらない見込み・3 行を積んだ木の歯は 2,936 本）。3 行を積んだ木で xtask の check は rc 0。書く file は write-set の中で閉じる。変異（歯の根から #![cfg(test)] を外す・2 度書く・SWEPT を空にする・歯の名に filter の語 lstore_）で、done の各歯が落ちた。

      流す時と順。depends は k-lint-base（歯の file klint.rs を足す行）。行 k-lint-tests がこの行の後。この行の着地の後に面の crate へ歯の file を足す行は、頭に #![cfg(test)] を置く（歯が名指して落とす）。起草済みで着地の前の行が面の歯の file を足すなら、その行の起草者に 1 行の足しを頼む。

      範囲の外。表への lint の足し（行 k-lint-tests）。folio の歯の file（k-lint-folio）。

