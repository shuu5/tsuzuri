      今の数（k-lint-rest の節と同じ測り）。歯でない code の直接の print は 103（println 32・eprintln 71）。境界 74（stage/cli.rs 27・cli/graph.rs 13・hook/deliver_tool.rs 7・hook/stop.rs 5・hook/deliver.rs 4・main.rs 4・server/ruling.rs 4・hook/question_gate.rs 2・hook/question_signal.rs 2・server/mod.rs 2・cli/folio.rs 1・server/routes の batch.rs と revoke.rs と ruling.rs 1 ずつ）・xtask 28（main.rs 19・pubscan.rs 6・accept.rs 3）・面 1（main.rs の host の入口）。どれも println か eprintln（改行の無い print と eprint は無い）。歯の print は歯の範囲の例外（clippy.toml の allow-print-in-tests と歯の crate の根の cfg(test)）で 0。build.rs の cargo の指示の println は clippy の print の lint が見ない。持ち込んだ folio の src は 0。

      形（出力の手）。境界の crate に新しい module の file src/out.rs を置き、pub fn emit と pub fn emit_err（引数は字 line の &str・本体は println か eprintln の 1 行で字の後に改行）を、属性 expect(clippy::print_stdout, reason = 境界の crate の標準出力をこの 1 関数に閉じるための例外) と expect(clippy::print_stderr, reason = 境界の crate の標準エラーをこの 1 関数に閉じるための例外) の複数行の形（#[expect( の行・lint の行・reason の行・)] の行の 4 行・reason の字は二重引用符で囲む）で置く。lib.rs の pub mod hook の次に pub mod out を足す。境界の lib の 13 の module は use crate::out::{emit, emit_err} か使う片方を use の並びの順の位置に足し、main.rs は use tsuzuri_boundary::out::emit_err を足す。xtask は main.rs の fn exit_code の前に fn emit_err（reason = xtask の標準エラーをこの 1 関数に閉じるための例外）を置き、accept.rs と pubscan.rs は use crate::emit_err を足す。面の main.rs は host の入口の fn main の前に、cfg(not(target_arch = wasm32)) の fn emit_err（reason = 面の crate の host の入口の標準エラーをこの 1 関数に閉じるための例外）を置く。

      形（呼び）。println!(中身) は emit(…)、eprintln!(中身) は emit_err(…) にする（出す字は変えない）。中身が波括弧の無い字だけなら字をそのまま渡し、字が波括弧 1 組の名だけ（例 line・e・text）か、波括弧 1 組の字と式 1 つなら、その名か式の参照を渡し（stage/cli.rs の console の event は既に &str なので参照を足さない）、ほかは &format!(中身) を渡す。作り替えた呼びだけを rustfmt の形にする（file の全体を整えない・着地の file の多くは rustfmt の形でない）。ただし stage/cli.rs の board の port が読めない行は、歯 stbp_wiring が 1 行の字で数えるので 1 行のまま（emit(&format!( と字と )); を 1 行に並べる）。境界の歯 stbp.rs の fn stbp_wiring の一覧の該当の 1 行の字を、println!( の頭と ); の尾から emit(&format!( の頭と )); の尾に替える（ほかの字と歯の名は変えない）。hook の答えを標準出力へ書く std::io::stdout の lock と writeln は print の macro でないので変えない。

      形（表と歯）。根の Cargo.toml の [workspace.lints.clippy] の dbg_macro の次に print_stdout と print_stderr を deny で足す。xtask/tests/klint.rs の一覧 ENABLED を 14 にし（dbg_macro の次に print_stdout と print_stderr）、一覧 HANDS（file・関数・lint の 4 組）と fn rs_files（dir の下の .rs を下の dir も path の順）と歯 klint_print_hands を歯 klint_test_roots_cfg_test の後に足す。歯は根の members の 6 つの dir の src の下の .rs の字 println と !( の並びと eprintln と !( の並び（歯の file の中では concat で組み、字のまま書かない）を数え、(file・lint) の列を HANDS と比べ、HANDS の各関数の行（pub を除いた字が fn 名 と (line の並び）の直前の 4 行を見る。klint_own_names_clean の fn の数の断言を 7 から 8 にする。

      doc と注の行（試作の字のまま）。crates/tsuzuri-boundary/src/lib.rs は、1 行 『//! 行 k-lint-print で出力の手（`out`・標準出力と標準エラーへ書く 2 つの関数）を置く。』 を置く（doc と注の行は +1 行・既存の行の末に継ぎ足さない）。crates/tsuzuri-boundary/src/out.rs は、4 行 『//! 境界の crate の出力の手（行 k-lint-print）: 標準出力と標準エラーへ書くのはこの 2 つの関数だけ（器の境界の main の emit と同じ形）。』・『//! どちらも字の後に改行を 1 つ足して書く。lint の例外は各関数の理由を持つ expect の属性だけ（条 P-24.3）。』・『/// 標準出力へ 1 行を書く（字の後に改行）。』・『/// 標準エラーへ 1 行を書く（字の後に改行）。』 を置く（doc と注の行は +4 行・既存の行の末に継ぎ足さない）。crates/tsuzuri-surface/src/main.rs は、1 行 『/// host の入口の出力の手（行 k-lint-print）: 標準エラーへ 1 行を書く（字の後に改行）。面の crate が書くのはこの関数だけ。』 を置く（doc と注の行は +1 行・既存の行の末に継ぎ足さない）。xtask/src/main.rs は、1 行 『/// xtask の出力の手（行 k-lint-print）: 標準エラーへ 1 行を書く（字の後に改行）。xtask が書くのはこの関数だけ。』 を置く（doc と注の行は +1 行・既存の行の末に継ぎ足さない）。xtask/tests/klint.rs は、3 行 『/// 出力の手の在りか（file・関数・lint）: 直接の print の macro はこの 4 つの関数の中だけに在る（行 k-lint-print）。』・『/// dir の下の字 .rs で終わる file（path の順・下の dir も）。』・『// 各関数の直前の 4 行は、理由を持つ expect の属性（#[expect( ・lint の行・reason = の行・)] ）。』（頭の空白 4） を置く（doc と注の行は +3 行・既存の行の末に継ぎ足さない）。 置き場所は、lib.rs の行は行 e-stage-target の //! の行の次、out.rs の 2 行は file の頭で 2 つの /// の行は各関数の属性の直前、面と xtask の main.rs の行は fn emit_err の属性の直前、klint.rs の 2 つの /// の行は const HANDS と fn rs_files の直前で、注の 1 行は歯 klint_print_hands の中の HANDS の各関数の直前の行を見る for の直前。

      今の字（main 48f293f6 に k-lint-rest を当てた木）。表の clippy は unwrap_used・expect_used・panic・todo・unimplemented・unreachable・exit・dbg_macro・allow_attributes・allow_attributes_without_reason で、ENABLED は 12。境界の lib.rs の module は acct・accthb・audit・cli・hook・server・stage・stagecall の 8 つ。stbp.rs の fn stbp_wiring は stage/cli.rs の println の 1 行の字を 1 度数える。境界の歯 stterm・stcdp・stlaunch・strelay・stnfy は別の module（terminal.rs・cdp.rs・launch.rs・relay.rs・notify.rs）に print の字が無いことを見る（この行は書かない・出力の手の名 emit は print の字を持たない）。dstg.rs の fn serve は子の標準エラーの字 tz surface serve と http の住所の行を読む（main.rs の emit_err が同じ字を書く）。

      試作と噛み。main 43bf9055 の写しに行 k-lint-rest とこの行を積んだ木（この行の 23 file で閉じる・試作の diff 49,224 byte）で、xtask の check（分けない全部）は rc 0（歯 2,918 本が緑・clippy の 2 段が緑・361 秒）。変異 7 と対照 2（起草 w52a の bite.py と bite-print.json・bite-print-P3-P5.json・bite-print-P5.json）で、表から print_stderr を外すと歯 klint_workspace_table が落ち、境界の hook/stop.rs の emit_err の呼びを eprintln に戻すと歯 klint_print_hands が落ち（どれも rc 100）、同じ変異で clippy の print_stderr の段も落ち（rc 101 と字 use of eprintln）、out.rs の emit_err の reason の行を消すと歯 klint_print_hands が落ち、一覧 HANDS から xtask の組を外して長さを 3 にしても同じ歯が落ち、stage/cli.rs の board の port の行を 3 行に包むと歯 stbp_wiring が落ち、歯の名に filter の語 graph を足すと歯 klint_own_names_clean が落ちた（どれも rc 100）。対照（変異なしの klint_ と stbp_）は rc 0。

      filter の語。歯の名 klint_print_hands の接頭辞 klint_ は着地済みの語で、klint_ を除いた字 print_hands は main 43bf9055 の契約表の verify の最後の字の 357 語と xtask/tests/filter-words.txt の 325 語のどれも含まない。verify の語 klint_ と stbp_ は着地済みの語。

      流す時と順。depends は k-lint-rest（根の Cargo.toml と歯 klint.rs と xtask の main.rs を書く）。この行の後、tsuzuri の member と folio の src に print の macro を書く行は、clippy の段と歯 klint_print_hands で落ちる（出力は emit か emit_err を呼ぶ）。起草済みで着地の前の行が境界か xtask の src に print を書くなら、席が起草者に知らせる。slice の添字を直して表に indexing_slicing を足す後の行は、stage/cli.rs と xtask の main.rs と pubscan.rs が重なるのでこの行の後。

      範囲の外。slice の添字と R-4 の関数の粒度（後の行）。folio の根の lint の一覧を消すこと（表が R-10 の全部を持った後の行）。hook の標準出力の writeln。歯の print。

