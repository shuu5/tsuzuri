    title: 行 m-big-copies — account board の大きな字を要求ごとに写さない
    body: |
      判断の記録 ADR-23 の決定 (1)〜(5) の後の残りの、server の使う記憶の量（RSS）の直し。中核の account の project の ProjectTexts の欄 events と ledger と、host の HostTexts の欄 events を Option<Arc<str>> にする（fixture の JSON の字か null は、account の mod.rs に足す pub(crate) fn shared_text が String で読んで Arc に替え、欄の無い形は serde の default で None・serde の rc の機能を足さない）。境界の server の ledger の Source は、読めた台帳の字を Arc<str> で持ち、合流の読み（Coalesce）の結果・最後に読めた字（欄 last）・最後に終えた読みの結果（欄 latest）・Got の欄 text は同じ確保を分け合う。Source の text は今までどおり String を返し、Form の kick には String を写して渡し、口の board の Texts の欄 ledger も今までどおり String に写す。境界の acct の Acct は欄 logs（event log の path → 読む前に取った印〔server の events の stamp・更新時刻と長さ〕と字）を持ち、fn log は印が前の読みの前に取った印と同じなら file を読まず前の Arc を返し、違えば読み直して置く。project の字の events と host の字の events は fn log で読み（同じ state dir の anchor と引数の state dir は 1 つの字）、集めの終わりに、その集めで読まなかった state dir の字を放す。台帳の字は Got の Arc のまま project の字に渡すので、読み解きの持ち回し（行 c-acct-parse）の字の比べは、同じ確保なら字を比べない（Arc の等しさは確保が同じなら中身を見ない）。電文と口の形と依存は変えない。

      なぜ。調べ役の測り（席の記帳）で、面の server の RSS は頁を開いた 300 秒で 0.7 GB から 1.2〜1.7 GB に伸び、同じ binary を MALLOC_ARENA_MAX=2 で起こすと 0.41 GB で平らだった（glibc の thread ごとの arena が、放した大きな確保を抱える）。起草の時の口 /api/account の 1 回は、群の宣言の state dir ごとの event log（8 本・合わせて約 15.1 MB・最大 8.2 MB）と引数の state dir の event log を file から読み直し、anchor ごとの台帳の字（8 本・合わせて約 38.1 MB・最大 11.8 MB）を持ち回しと Got から写していた。集めの scope の thread と口の接続の thread がそれぞれ確保して放すので、arena ごとに抱える。

      起草の測り（試作の release と main 4ad0b18f の release を loopback の別の port で同じ時に並べ、--read-only --bdw /bin/false・客は project board の home の頁と同じ口を知らせの種類で読み直す・区間は R-34 と同じ・RSS は閉じた後の終わりの値）。(a) 2 本（器の event log の書き 1.8 行/分）: RSS 1191 MB → 850 MB、頁の 300 秒の server 自身 2.6% → 2.1%（子を足した和 13.0% → 12.4%）。(b) 4 本（1.5〜3.2 行/分・4 本が同時に読むので CPU は相対だけ）: MALLOC_ARENA_MAX 無しで 1234 MB → 750 MB、起こしの道具の今の環境と同じ MALLOC_ARENA_MAX=2 で 414 MB → 266 MB、server 自身 3.0% → 2.4%・3.6% → 2.3%。(c) 口 1 つだけを 7 秒ごとに 300 秒読んだ 4 本: /api/account で 797 MB → 311 MB、/api/next で 62 MB → 26 MB（大きな確保の元は account board の読み）。どの回も閉じた後の 120 秒は 0.1%。

      依存と順。depends は無い。同じノートの行 k-tz-entry（tests/server_acct.rs の依存の歯の字）と k-lint-tests（3 つの crate の tests/ を dir の形で書き、歯の crate の根に #![cfg(test)] を足す）が、この行の書く歯の file と重なる。この行の着地済みの歯の file の替えは字の型の合わせだけ（server_acct.rs は fixture の組みの 3 行で行の数は同じ）なので、どちらが先でも当て直しは小さい。新しい歯の file tests/mbig.rs は頭の説明の直後に #![cfg(test)] を置く（k-lint-tests が先でも後でも根の形が合う・k-tz-entry の tzent.rs と同じ形）。歯でない code に unwrap と panic を書かない。台帳の読みの束ねや doctor の上限の行（持ち主の答え待ち）が後で acct.rs と ledger.rs を書くなら、この行の後に当て直す。

      範囲の外と費用。印（更新時刻と長さ）が同じまま字だけが替わる書きは読み直さない（知らせの見張りの印と同じ形・器の event log は追記だけ）。台帳が動いた周の bd の出力の読み（proc の capture）・読めるかの確かめ（parse_bd）・読み解き（Parsed::of）の大きな確保と、口の board の Texts への写し（/api/next など・起草の測りで小さい）と、event log を要る欄だけの型で読む形は変えない（後の行の候補・計画だけの行にしない）。RSS の一番大きな手は起こしの道具の MALLOC_ARENA_MAX=2（repo の外・席が 2026-09-30 に当てた）で、この行はその上でも減らす。

      今の字（main 4ad0b18f）。中核の src/account/project.rs の ProjectTexts は #[derive(Debug, Clone, Default, PartialEq, Eq, Deserialize)] で、欄 events と ledger は Option<String>。src/account/host.rs の HostTexts の欄 events も Option<String>。境界の src/acct.rs の fn gather は anchor ごとに ProjectTexts の events を read(&events_log(dir)) で、host の events を read(&events_log(&self.state_dir)) で要求ごとに読み、Kept は (Option<String>, Option<String>, Arc<Parsed>)。src/server/ledger.rs の Source は欄 shared に Coalesce<String>・last に (Option<String>, Instant)・latest に Option<Option<String>> を持ち、Got の欄 text は Option<String>。src/server/board.rs の gather_held は Texts の ledger に Got の text を渡す。着地済みの歯 lsnap と rhold は Got の text を String と比べ、server_acct と中核の acctpcore・athr・cdorm・cspk・pclosed・plimit・pquest・punmap・sclosed は ProjectTexts か HostTexts の events と ledger に String を置く。この行はそれらの字を Arc に替える（into か map(Into::into)・歯の数と名は変えない）。

      試作と噛み。main 4ad0b18f の写しで、xtask の check（公開の走査・build・nextest の全部・clippy・面の組み立て）が rc 0（nextest 2934 本）。書く file は write-set と一致し（差分の file 18 個・新しい歯の file 1 個）、差分は 36558 byte（+366 −47 行）。tests/server_acct.rs は 1368 行のまま（上限 1500 の余地が大きさの見込みより小さいので growth 5）。変異 10 個を 1 つずつ当てて名指した歯を撃ち、done の歯は全部どれかの変異で落ちた（M1（印が同じでも event log を読み直す）と M4（project の event log を要求ごとに file から読む）で mbig_log_kept、M2（印が動いても読み直さない）で mbig_log_moved、M3（読まなかった state dir の字を放さない）で mbig_log_released、M5（見張りの読みの字を got ごとに写す）と M6（最後に読めた字を got ごとに写す）で mbig_got_shared、M7（shared_text が字を捨てる）と M8〜M10（ProjectTexts の ledger と events・HostTexts の events の欄の既定を外す）で mbig_texts_read_json）。
  - n: 10
    type: prose
    title: '行 k-lint-folio-tests — 持ち込んだ folio の統合の歯の crate の根に #![cfg(test)] を置く（lint の表の行を待たない）'
    body: |
      在りかの main は 044cd9f9 に同じノートの行 k-tz-entry を当てた木。起草 w43b が main 7ea3a2d3 の写しで試作した。書く file は write-set の 2（folio の tests/ の直下の .rs の全部〔main 7ea3a2d3 で 65〕と、xtask の新しい歯の file klintf.rs）。

      なぜ。持ち込んだ folio への規則の行 R-10 は除外の表 carry-exclusions.toml の R-10 の行（裁定 t3-hub.67.4:20260929T0058Z-1）で外していて、行を消すのは folio の違反を直し終えた行 k-lint-folio（判断の記録 ADR-18 の決定 (5)〔持ち込む code への規則は最初は除外の表で持ち、段ごとの便で外す〕のとおり・持ち主の承認済みで新しい問いは要らない）。folio の歯の file の unwrap（905）と panic（121）は歯の手（#[test] の外の fn）に在り、根に #![cfg(test)] を置くと歯の手も clippy の歯の中の扱いに入って 0 になる（行 k-lint-tests と同じ形・clippy 1.98.1 では根の clippy.toml が無くても 0 で、行 k-lint-base の後は根の clippy.toml の歯の範囲の例外も効く）。行 k-tz-tests は folio の歯の 58 の file を境界の crate の [[test]] にして境界の lint の表で見るので、この行が先に在れば k-tz-tests は 58 の根に #![cfg(test)] を足す分を持たない。lint の表の行（k-lint-base・k-lint-tests-face・k-lint-tests）の鎖を待たないため、この行は lint の表も clippy.toml も歯の file klint.rs も書かない（#![cfg(test)] は clippy.toml が無くても害が無い）。

      形（歯の根）。folio の tests/ の直下の .rs の全部の頭の字 //! の行の続きの直後に行 #![cfg(test)] を足す（folio の tests/ に dir は無い）。folio の歯 f89_schema_teeth_are_split_and_under_the_cap は歯の file tests/schema.rs の大きさ（行ごとに字の数を 120 で割って切り上げた数〔1 より小さければ 1〕の和）を 700 以下と見る。main 7ea3a2d3 でちょうど 700 なので、足した行 #![cfg(test)] の直後の空の行を 1 つ消す（字は変えない）。

      形（歯）。xtask の新しい歯の file klintf.rs は外の依存を使わず、repo の根からの相対の path で字を読む。頭の //! の行の続きの直後に #![cfg(test)] を置く（行 k-lint-tests の歯 klint_test_roots_cfg_test が xtask の歯の根を見る）。歯 klintf_test_roots_cfg_test は folio の tests/ の直下の .rs と tests/<dir>/main.rs の形を見る。歯 klintf_own_names_clean は下の filter の語の一覧を const FILTER_WORDS に字のまま持ち、語の数 331 を断言してから、歯の名から klintf_ を除いた字が語を含まないことを見る（着地済みの歯 stcli_own_names_clean と同じ形）。歯は 2 つ。

      今の字（main 7ea3a2d3）。folio の歯の根は 65 で、どれも #![cfg(test)] を持たない。xtask の tests/ に klintf.rs は無く、字 klintf_ を名に持つ歯は無い。repo に clippy.toml と .clippy.toml は無い（根にも folio2/ の下にも）。行 k-tz-entry は folio の歯 tests/modules.rs の頭の //! の行を書き替える（この行は書き替えた後の行の続きの直後に足す）。

      lint の表の行との順。この行は鎖のどの行とも file が重ならず、どちらが先に着地しても落ちない（起草 w43b が両方の順の木を撃った）。(a) この行が先: 行 k-lint-base の歯 klint_members_follow_carry_table は folio の manifest に字 [lints で始まる行が無いことを求め、この行は manifest を書かない。行 k-lint-tests の歯 klint_test_roots_cfg_test は xtask の歯の根 klintf.rs の頭の #![cfg(test)] を見て緑。(b) 鎖が先: 根の clippy.toml の歯の範囲の例外が folio の歯の手にも効き、歯 klint は folio を見ないまま（除外の表の R-10 の行が名指す member）。folio の明示の lint の表（folio で違反 0 の 7 つ・この行の後の木で clippy.toml が無くても 7 つを deny で撃って rc 0）はこの行に入れない。行 k-lint-base の done (5)（folio の manifest は字 [lints で始まる行を持たない）と歯 klint_members_follow_carry_table に重なり、この行が先に着地すると行 k-lint-base の gate が落ち、後なら歯の file klint.rs を書くことになるので、鎖の後の folio の直しの行に入れる。

      clippy が読む設定。clippy は環境変数 CLIPPY_CONF_DIR が無い時、crate の manifest の dir から上へ最初に見つけた clippy.toml か .clippy.toml を読む。folio の manifest の dir folio2/crates/folio から根までの間に file は無いので、行 k-lint-base の後は folio も根の clippy.toml を読む（行 k-lint-base の done (3) が member の dir と根までの間に file を置かないことを見る）。

      filter の語。接頭辞 klintf_ は main 7ea3a2d3 の 331 語のどれとも部分の字として重ならず（どちらの向きも）、今の木の歯の名に字 klintf_ を持つものは無い。着地済みの語 klint_ は字 klintf_ の部分の字でない。

      試作と噛み。main 7ea3a2d3 の写しで、歯 klintf_ の 2 本が緑、folio の歯 1,185 本が緑（本数は変わらない）、clippy の 2 段が緑、xtask の check（分けない全部）は rc 0（歯 2,931 本）。試作の diff は 51,254 byte（66 file）。変異（folio の歯の根から #![cfg(test)] を外す・use の行の後へ動かす・2 度書く・//! の行との間に空の行を置く・見る置き場を src にする・歯の名に filter の語 graph_・一覧から語を 1 つ外す）で done の歯 klintf_ が落ち、tests/schema.rs に空の行を 1 つ戻すと歯 f89_ が落ちた（起草 w43b の bite-folio1a.py と results-folio1a.json）。lint の 3 行の試作（起草 w43a）の上にこの行を当てた木で、歯 klint_ の 7 本と klintf_ の 2 本と clippy の全部が緑。

      器の穴の 5 点（入れ子の crate）。この行の write-set は器の検出線（crates/・根の Cargo.toml・Cargo.lock・rules/・.vessel.toml）に触れないので、着地の後の追随の再 gate は省かれる。(1) 器は folio2/ の重なりを見ないので、folio の歯の file を書く行とは depends で並べる（下の段）。この行は folio の src も pub な API も書かないので、folio に依る境界の crate を書く行（e-reason-id・k-tz-parity・m-big-copies・k-tz-self）の gate の結果を変えず、同時に流してよい。(2) folio の src を書かない（src の 1 file の行数と crate の合計は変わらない・歯の file は 1 行ずつ増え tests/schema.rs は増えない）。(3) 構造の連鎖は無い（klintf.rs を読む file は無い）。(4) verify の folio の歯は -p folio を名指す。(5) 着地の後に席が xtask の check と nextest を手で 1 回撃つ。

      流す時と順。depends は k-tz-entry だけ（folio の歯 tests/modules.rs を書く・器は folio2/ の重なりを見ない）。tz 化の鎖の行 k-tz-drop の前に置く（k-tz-drop の depends にこの行を足す）: k-tz-drop は folio の歯の file（check.rs・help.rs・init.rs・modules.rs ほか）を書き、足す歯の file fdrop.rs は頭に #![cfg(test)] を置く。この行の後に folio の tests/ へ歯の file を足す行は頭に #![cfg(test)] を置く（歯 klintf_test_roots_cfg_test）。

      filter の語の一覧（起草の時の main 7ea3a2d3 の契約表の verify の最後の字・331 語・空白で区切る）。歯 klintf_own_names_clean は、この一覧を歯の file の const に字のまま写し、語の数 331 を断言してから照らす。一覧は次のとおり。 aaround_ aaround_src_ask_fold_embeds abss_ abst_ accept_ acchold_ account_ acctcore_ acctcore_pure_and_no_new_dependencies acctdoc_ acctframe_ accthb_ accthome_ acctled_ acctlook_ acctpcore_ acctproj_ acctsess_ acctwin_ acctwire_ acctwire_back_part_before_header acctwire_back_steps aface_ afocus_ afocus_src_links_and_scroll alean_ aord_ aown_ apark_ apop_ areread_ askcard_ askcard_page_frame_and_nav athr_ batchpanel_ batchpanel_page_frame_two_columns bhalf_ board_min_ bport_ brand_ brand_path_written_once_in_contract btuck_ cadl_ cadopt_ cadq_ cdorm_ cexcl_ cfsplit_ cg9_ cgdom_ cishard_ cmark_ cnote_ cnret_ contract_form_ cround_ csled_ cspk_ ctick_ cupd_ cupdlist_ denv_ dnedge_ dngrp_ dnrow_ dnskip_ dretry_ dstg_ ecache_ ecache_handle_wiring_text eheld_acct_ eheld_design_ eheld_held_ eheld_marks_ eheld_vessel_ elazy_ epolq_ eretry_ esig_ evkind_ f123_ f159_ f212_ f2ret_ fdlt_ fdlv_ flight_ fmark_ fprem_ frame_ frame_home_blocks_in_order_and_map_page frame_one_module_per_block fserve_ fstop_ fstop_usage_errors_are_one fundl_ fxpre_ g3g7_ gacct_ gapspage_ gapspage_page_frame_and_nav gatt_ gbnote_ gchip_ gcoach_ gext_ gfix_ gfresh_ gfresh_boards_text ghb_ gins_ gjst_ glabel_ gmret_ gmretw_ gnav_ gpface_ gpill_ gpulse_ gpulse_boards_text gquestion_ graph_ gsum_ gtuck_ gview_ gwv_ hacols_ harest_ hasplit_ hbconf_ hbconf_config_moves_to_config_rs hbconf_main_parse_fills_the_rest_with_new hbmark_ hbon_ hbpost_ hbpost_mod_rs_drops_post_fns hbproc_ hbroute_ hbroute_mod_rs_keeps_only_events hcard_ hcled_ hcnx_ hcproj_ hcsess_ hdchip_ hfig_ hnunk_ hook_ hruling_ hsblock_ hsblock_dispatch_by_list hsblock_ids_match_consts hsblock_kit_holds_shared hsderive_ hsderive_consts_match_note hshist_ hspage_ hspage_snaps_match_files hspk_ hsym_ hthr_ http_ hwstore_ iclose_ iclose_handle_wiring_text ilink_ inject_ jcount_ jrun_ kcli_ 