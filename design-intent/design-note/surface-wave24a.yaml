  - n: 20
    type: prose
    title: 行 k-size-folio — 除外の表の R-4 の行を消し、大きさの数えの段に持ち込んだ folio を数えさせる
    body: |
      在りかの main は 48f293f6。起草 w51a が main 48f293f6（行 k-lint-folio と k-tz-tests の着地の後）の写しで試作した。書く file は write-set の 5（除外の表・xtask の src/size.rs と歯の file carry.rs・folio の src の note.rs と lineage.rs）。

      なぜ。判断の記録 ADR-18 の決定 (5)（持ち込む code への tsuzuri の規則は最初は除外の表で持ち、段ごとの便で外す）と除外の表の R-4 の行の removed_by の字 k-size-folio（裁定 t3-hub.67.4:20260929T0058Z-1）のとおり、行を消す（持ち主の承認済みで新しい問いは要らない）。判断の記録 ADR-25 の決定 (9) は、この行の着地で数える段（行 k-size-base）が folio も数えると書く。

      規則を弱めない（席の決め）。除外の表の R-4 の行が外していたのは、持ち込んだ folio への規則の行 R-4 の 4 つ（1 module の行数・関数の粒度・歯と source の行数比と、中核の crate でない folio には効かない core の総行数）。行を消すと、xtask の check の大きさの数えの段が folio の src を数え始める（強まる向き）。関数の粒度は workspace の lint の表にまだ無く（一覧 ENABLED は unused_must_use・unwrap_used・panic・todo・unimplemented・exit・dbg_macro の 7 つ）、tsuzuri の 5 つの member にも folio にも効いていないので、行を消しても緩む物は無い。この行の後、歯 klint_members_follow_carry_table の R-4 の守り（除外の表の R-4 の行の path が根の members の dir を名指す間は一覧 ENABLED が R-4 の lint を持たない）は名指す行が無く何も見ないので、表に R-4 の lint（too_many_lines・cognitive_complexity・too_many_arguments）を足す後の行は、folio（行 k-lint-folio から表を継ぐ）を含む 6 つの member の違反を直してから足す。clippy の既定で効く too_many_arguments（閾値 7）は今も folio を含む全部に効いている。

      計画との違い。行 k-lint-base の 6 節の段の並びは、folio の関数の粒度の直しの最後の行 k-size-folio が R-4 の行を消すと書いた。R-4 の数える範囲の裁定（ADR-25）の後に数える段（行 k-size-base）が先に着地し、関数の粒度の lint は表に無いので、この行は先に R-4 の行を消して数えを folio に効かせ、関数の粒度は表に足す後の行が folio も含めて直す順にする（ADR-18 の決定 (5) の段ごとの外しのまま・新しい問いは要らない）。

      今の数（xtask の check の数えの段の事実の字）。main 48f293f6 は file-lines=1280/1500・core-lines=7109/20000・test-src-ratio=1825/47732（約 3.8%・folio を数えない）。この行を当てた木は file-lines=1280/1500（面の crate の project/ledger.rs のまま）・core-lines=7109/20000（folio は中核の crate でない）・test-src-ratio=6745/76534（約 8.8%）で、上限の内（越えの直しは要らない）。folio の src は 60 file（本体 28,802・検査の区間 4,919）で、大きい file は face_constitution.rs 1,230・graph.rs 1,207・check.rs 1,206・note.rs 1,143・findings.rs 1,134（行の重みの数え・1 module の上限 1,500 までの余地は最も大きい file で 270）。

      表の扱い（行の無い表を残す・席の決め）。除外の表の file carry-exclusions.toml は退役させず、行の無い表として残す。器（scribe2）の持ち込みの段が同じ表に行を足す（ADR-18 の決定 (5) の R-4・R-10・R-2 と、ADR-19 の決定 (2) の条 N-3・歯の file carry.rs の一覧 CARRIED の注）。退役させると、読み手の size.rs と klint.rs と carry.rs と、行 R-4 の population の字（除外の表 carry-exclusions.toml が名指す持ち込みの code は、その表の行が消えるまで数えない・歯 ksize_limits_match_rule_r4 が照らす）を全部書き替え、持ち込みの時に戻すことになる。表の file は R-4 の行（見出しと 5 つの鍵の 6 行と前の空の行）を消し、頭の注の 2 行の後に次の 1 行を足す（3 行の file）。 # 今は行が無い（持ち込んだ folio の行は k-join-folio・k-lint-folio・k-size-folio が消した）。器の持ち込みの段が行を足す。

      読み手（行の無い表で）。carry.rs の fn parse_table は行の無い表で空の列を返し、歯 cexcl_lock_drops_encoding（表に R-2 の行が無い）と cexcl_refuses_bad_rows（試しの行は FOLIO_PATH・RULING・SCOPE_R10 の字で、木の dir folio2/crates/folio は在る）は変えずに通る。size.rs の fn r4_paths は空の列を返し、fn counted は根の members の 6 つの全部を数える。klint.rs の fn excluded_paths は R-10 にも R-4 にも空の列を返し、歯 klint_members_follow_carry_table と klint_test_roots_cfg_test は 6 つの全部を見る（行 k-lint-folio の後と同じ）。klint.rs は書かない（R-4 の守りは器の持ち込みで R-4 の行が戻れば効く一般の形のまま）。行 R-4 の population の字と ADR-25 の字は一般の字のまま成り立つので変えない。

      形（歯）。xtask/tests/carry.rs の歯 cexcl_table_rows は、表を読んだ行の列が空であることを断言し（落ちたら列を字にして出す）、表の行の確かめ fn judge_rows を空の列に当てる。R-4 の行の scope の字の定数 SCOPE_R4 は読み手が無くなるので消す（残すと dead_code の警告で clippy の段が落ちる）。xtask/src/size.rs の歯 ksize_population_follows_carry は、数える member の断言の列を根の members の順の 6 つ（crates/tsuzuri-surface と xtask の間に folio2/crates/folio）にする。test の fn の名と数は変えない（carry.rs は 5・size.rs は 7）。

      形（folio の 2 つの理由の字）。folio の src の note.rs の fn check_section（引数 9）と lineage.rs の fn verify_pair（引数 8）の属性 expect(clippy::too_many_arguments) の reason の字 関数の粒度は規則の行 R-4 の除外の表が持つ（行 k-size-folio が直す） は、この行の後は偽（表は持たず、この行は直さない）なので、2 つとも字 引数は規則の行 R-4 の 5 以下を越え、too_many_arguments を workspace の lint の表に足す後の行が直す に替える。関数は直さない。R-4 の引数の閾値 5 は clippy.toml にまだ無く、too_many_arguments を表に足す後の行が 6 つの member の違反と一緒に直す（2 つの関数を既定の閾値 7 の内に縮めても、閾値 5 でまた直すことになる）。

      今の字（main 48f293f6）。除外の表は R-4 の 1 行（path folio2/crates/folio/・scope 大きさの上限（1 module の行数・関数の粒度・歯と source の行数比）・ruling t3-hub.67.4:20260929T0058Z-1・removed_by k-size-folio）と頭の注の 2 行。carry.rs の歯 cexcl_table_rows は、表の行の（規則・removed_by）の列を（R-4・k-size-folio）の 1 つと、path を FOLIO_PATH・ruling を RULING・scope を SCOPE_R4 と照らす。size.rs の歯 ksize_population_follows_carry は数える member を crates/tsuzuri-contract・crates/tsuzuri-core・crates/tsuzuri-boundary・crates/tsuzuri-surface・xtask の 5 つと断言する。note.rs と lineage.rs の 2 つの属性の reason は上の前の字。

      構造の連鎖（git grep で全部）。字 carry-exclusions を持つ file は、根の Cargo.toml（注は R-10 の行と行 k-lint-folio だけを書き、器の検出線の file なので書かない）・xtask/src/size.rs・xtask/tests/carry.rs・xtask/tests/klint.rs・design-intent の rules.yaml と ADR-25 と 2 つのノートと 2 つの契約表。字 k-size-folio を持つ設計の外の file は、除外の表と carry.rs と folio の note.rs と lineage.rs（この行が全部書く）。

      行数（wc -l・試作の木）。除外の表 3 行（9 行から）・size.rs 466 行・carry.rs 639 行・note.rs 1,140 行・lineage.rs 859 行。試作の diff は 3,934 byte（5 file・5 行足して 20 行消す）。

      試作と噛み。main 48f293f6 にこの行を当てた木（起草 w51a の写し）で、verify の 3 つの歯の行は rc 0（cexcl_ 5 本・ksize_ 7 本・clippy）、xtask の check（分けない全部）は rc 0（歯 2,917 本・436 秒・数えの段の事実は file-lines=1280/1500 core-lines=7109/20000 test-src-ratio=6745/76534）。書く file は write-set の 5 で閉じる。変異 6（除外の表に R-4 の行を戻す・除外の表の file を脇へ動かす・folio の src の face_constitution.rs に注の行を 300 足して 1,530 行にする・note.rs の check_section の expect から理由を外す・lineage.rs の verify_pair の expect を消す・除外の表に R-10 の行を足す）を 1 つずつ当て、done の 4 つの歯（cexcl_table_rows・ksize_population_follows_carry・ksize_tree_within_limits・clippy）はどれも少なくとも 1 つの変異で落ちた（clippy の段は出力に lint の名 allow_attributes_without_reason と too_many_arguments が在る）。対照として、face_constitution.rs の 300 行の足しに R-4 の行を戻すと歯 ksize_tree_within_limits は rc 0（folio が数えに入るのはこの行から）、R-10 の行の足しでは歯 ksize_population_follows_carry と ksize_tree_within_limits は rc 0（数える member を変えるのは R-4 の行だけ）（起草 w51a の bite-w51a.py と results-ksf.json・results-ctl.json）。

