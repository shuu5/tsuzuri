  note: 'ノート surface-wave23b（32 行の全部が着地・規則の行 R-32 の上限）の続き。承認は発効した計画 surface-plan の持ち主の裁定（t3-hub.56:20260927T2259Z-1）を継ぐ。第 0.1 版（2026-09-30）は目的と空の契約表だけを置いた（行は起草の後に足す）。 第 0.2 版（2026-09-30）は、1 行目 e-reason-id（境界の crate の server・S・depends は空）と 3 節を足した（起草 w46a の字を、席が main ea06f7a3 に当てた）。計画だけの行ではないので規則の行 R-33 は書かない。第 0.3 版（2026-09-30）は、2 行目 k-tz-entry（folio の lib の入口と tz の 11 の口と索引の graph・M）と 3 行目 k-tz-parity（口ごとの tz と folio の一致の歯・受入 AC14・S）と 4 節と 5 節を足した。計画 surface-plan の 9 節の計画だけの行 k-parity を割った行で、残りの行（folio の歯の tz への移しと binary の退役・inject と serve の退役・索引の読みの既定）は後に足す。起草 w42a が main 922314b0 の写しで試作し、変異を当てて歯が落ちることを見た。 第 0.4 版（2026-09-30）は、2 行目 k-tz-entry の depends を空にし 4 節の流す順の字を直した（1 行目 e-reason-id との重なりは、tz 化を先に進めるため k-tz-entry を先に流し e-reason-id を後にする・e-reason-id の depends は、その行の直しの版で置く）。 第 0.5 版（2026-09-30）は、4〜6 行目（k-lint-base〔根の Cargo.toml の workspace の lint の表と clippy.toml と member の manifest と xtask の歯 klint・M〕・k-lint-tests-face〔面の crate の統合の歯の crate の根の cfg(test) の属性・M・depends は k-lint-base〕・k-lint-tests〔残りの根と表の unwrap_used と panic・M・depends は k-lint-tests-face〕）と 6〜8 節を足した。持ち込んだ folio に規則の行 R-10 と R-4 を当てる段（計画 surface-plan の 6 節の後の行 k-lint-folio と k-size-folio の前）で、tsuzuri の全体に規則の行 R-10 の lint の機構を置く最初の 3 行。規則の行 R-4 の数えの段の行は、R-4 の数える範囲の持ち主の答えの後に置く。計画だけの行ではないので規則の行 R-33 は書かない。起草 w43a が main 4ad0b18f の写しで試作し、main 214118b4 に当てた。 第 0.6 版（2026-09-30）は、1 行目 e-reason-id の title・req・write-set・verify・done・depends と 3 節を直した（器の席の 2 つ目の答えで、方針の問いの閉じを器の頭を足さない 裁定 policy:<方針の id> の形にする。policy.rs と歯 epolq を write-set に、要件 FR8 を req に足し、方針を承認に数えないことを測る歯を足した。depends は第 0.4 版の席の決めどおり k-tz-entry にし、節の流す時と順と在りかの main の字をそれに合わせた）。大きさは変えない（起草 w46a の字を、席が main 09d898f6 に当てた）。 第 0.7 版（2026-09-30）は、7 行目 m-big-copies（account board の読みが state dir ごとの event log を印が動いた時だけ読み、台帳と event log の字を要求をまたいで写さずに分け合う・server の使う記憶の量〔RSS〕の直し・判断の記録 ADR-23 の後の残り・中核の account と境界の acct と台帳の読み・M）と 9 節を足した。起草は main 4ad0b18f の写しで行い、試作で歯を撃ち、直しを戻して歯が落ちることを見た。 第 0.8 版（2026-09-30）は、行 k-tz-entry・k-tz-parity・e-reason-id の歯 tzent_own_names_clean・tzpar_own_names_clean・rsid_own_names_clean が照らす filter の語の一覧を 4 節と 3 節に字で置き、3 行の done に、歯の file がその一覧を字のまま持ち語の数を断言することを足した（便 t3-hub.52.146 の審査が、歯が 14 語しか照らさず done の 325 語を測らないとして FAIL にした・一覧が節に無く便が語を集められなかった）。 第 0.9 版（2026-09-30）は、行 k-tz-entry と k-tz-parity の節の #![cfg(test)] の置き方に、頭の説明の行の続きのすぐ次の行に置き間に空の行を挟まないことを足した（行 k-lint-tests の歯が見る形・起草 w42a の見つけ）。 第 0.10 版（2026-09-30）は、8 行目 k-lint-folio-tests〔持ち込んだ folio の統合の歯の crate の根の cfg(test) の属性と、xtask の新しい歯の file klintf.rs・M・depends は k-tz-entry〕と 10 節を足した。除外の表の R-10 の行を消す行 k-lint-folio の前の最初の行で、lint の表の行 k-lint-base〜k-lint-tests を待たず、tz 化の鎖の行 k-tz-drop の前に置く。計画だけの行ではないので規則の行 R-33 は書かない。起草 w43b が main 7ea3a2d3 の写しで試作し、main 044cd9f9 に当てた。第 0.11 版（2026-09-30）は、9 行目 k-tz-drop（folio の口 inject と serve の退役・folio2/retired/ への git の移動・M）と 10 行目 k-tz-self（設計の索引の読みの既定を tz 自身に・S）と 11 節と 12 節を足した。計画 surface-plan の 9 節の計画だけの行 k-parity を割った行の 3 つ目と 4 つ目で、残りの k-tz-tests（folio の歯の tz への移しと folio の binary の退役）は後に足す。起草 w42a が main 214118b4 の写しに行 k-tz-entry の差分を重ねて試作し、変異を当てて歯が落ちることを見て、main 044cd9f9 に当てた。 第 0.12 版（2026-09-30）は、行 k-tz-entry の done (1)(4)(5) の usage の行の字を clap 4 の現物の形（Usage の直後にコロン）に直し、4 節に usage の行の字を置いた（便 t3-hub.52.146 の 2 度目の審査が literal-mismatch で FAIL にした）。 第 0.13 版（2026-09-30）は、11 行目 k-size-base〔xtask の check の大きさの数えの段・M・depends は空〕と 13 節を足した。規則の行 R-4 の数える範囲は持ち主の裁定 t3-hub.67.47:20260930T0626Z-1（案 A・本体の置き場 src だけ）と判断の記録 ADR-25 で決まり、同じ commit で R-4 の数える対象の欄に字を足した。計画だけの行ではないので規則の行 R-33 は書かない。起草 w43a が main 4ad0b18f の写しで試作し、起草 w43b が main 44f7f5e0 の写しで直して撃ち直し、main f2574fb9 に当てた。 第 0.14 版（2026-09-30）は、12 行目 k-lint-folio-deny〔持ち込んだ folio の lib と binary と build.rs の根の R-10 の lint の crate の属性と、添字の外の違反の直し・M・depends は k-lint-folio-tests と k-tz-drop〕と 14 節を足した。除外の表の R-10 の行を消す行 k-lint-folio の前の、folio の src の直しの最初の行で、添字は後の 2 行が直す。計画だけの行ではないので規則の行 R-33 は書かない。起草 w43b が main db4ea60e の写しで試作し、main db4ea60e に当てた。第 0.15 版（2026-09-30）は、行 k-tz-entry の着地（main db4ea60e）の字に合わせて、行 k-tz-parity・k-tz-drop・k-tz-self の節の在りかと試作と噛みと今の字の段を直し、k-tz-drop の形の段を着地の entry.rs の字に合わせた（契約表の行の字は替えない・起草 w42a が着地の写しに 3 行を当て直して撃った）。 第 0.16 版（2026-09-30）は、行 k-tz-self の write-set に verify で撃つだけの着地済みの歯 kcli.rs と hbconf.rs を、行 k-lint-folio-deny の write-set に verify の歯 modules.rs を、置き場だけの = で足した（器の受付が便 t3-hub.52.153 を teeth-outside-write-set で断った）。 第 0.17 版（2026-09-30）は、13 行目 k-lint-folio-idx-a〔持ち込んだ folio の src の 6 file の添字の 114 か所の直しと、6 file の頭の lint を deny にする module の属性・M・depends は k-lint-folio-tests と k-lint-folio-deny〕と 15 節を足した。除外の表の R-10 の行を消す行 k-lint-folio の前の、folio の添字の直しの 1 つ目の行で、残りの 23 file の 93 か所と lint の一覧への足しは後の行 k-lint-folio-idx-b が持つ。計画だけの行ではないので規則の行 R-33 は書かない。起草 w47a が main 19ff39fa の写しで試作し、main 77530015 に当てた。 第 0.18 版（2026-09-30）は、行 k-lint-tests の題の根の数を 139 から 140 にし、8 節の在りかと書く file と形と今の字を着地の後の main 3c614352 の木に合わせた（xtask の tests/ の 7 つ目の file klintf.rs は頭の行を既に持つので書かない・klint.rs は頭の行を持たないのでこの行が足す・境界の crate の 79 のうち着地した行の 5 つは既に持つ）。便 t3-hub.52.148 の審査が、節に klintf.rs の材料が無いと判じられなかった（section-material-missing）。done と write-set と verify は替えない。 第 0.19 版（2026-09-30）は、14 行目 k-lint-folio-idx-b〔持ち込んだ folio の src の残りの 23 file の添字の 93 か所の直しと、folio の 3 つの根の lint の一覧への clippy::indexing_slicing の足しと、行 k-lint-folio-idx-a の 6 file の module の属性とその歯を外すこと・M・depends は k-lint-folio-idx-a と k-lint-folio-deny〕と 16 節、15 行目 k-lint-folio〔除外の表の R-10 の行を消し、folio の manifest に [lints] の workspace = true を足し、根の一覧は残し、除外の表の R-4 の行の間は表に R-4 の lint を置かない守りを歯 klint に足す・S・depends は k-lint-folio-idx-b と k-lint-tests〕と 17 節を足し、行 k-lint-base の done (5) と行 k-lint-tests の done (2) の字を R-10 の行を消した後も成り立つ形に直した。除外の表の R-10 の行を消すまでの最後の 2 行で、判断の記録 ADR-18 の決定 (5) のとおり持ち主の承認済み。計画だけの行ではないので規則の行 R-33 は書かない。起草 w48b が main 7a81444d の写しで試作し、main 43ff66a0 の写しで撃ち直し、main 43ff66a0 に当てた。 第 0.20 版（2026-09-30）は、16 行目 k-tz-tests〔持ち込んだ folio の歯のうち folio の binary を撃つ 58 file を、file を置いたままtz の binary を撃つ境界の package の歯にし、folio の src/main.rs を folio2/retired/ へ git の移動で退役させて folio という名の binary を無くす・M・depends は k-tz-drop・k-tz-self・k-lint-folio-deny・k-lint-folio-idx-a・k-lint-folio-idx-b・k-lint-folio〕と 18 節を足した。計画だけの行 k-parity を割った 5 行の最後の行で、同じ commit で計画 surface-plan の 9 節から k-parity を消し、規則の行 R-33 の値を 10 行 以下から 9 行 以下に下げた（条 P-28・裁定 t3-hub.66.3）。起草 w49a が main 7a81444d の写しで試作し、main 33a14df9 に当てた。 第 0.21 版（2026-09-30）は、18 節（行 k-tz-tests）の在りか・形・今の字・構造の連鎖・行数・試作と噛み・流す時と順の字を、行 k-lint-folio-idx-a・k-lint-folio-idx-b・k-lint-folio の着地の後の main 79d3b930 の木に合わせて直した（xtask の歯 klintf.rs の根の for の配列と、module の doc と一覧 DENY の doc の字 3 つの根 を 2 つの根 にすることを書き、folio の src/main.rs は 28 行・置き換えの後の字 CARGO_BIN_EXE_tz は 120 か所とした・契約表の行は替えない・起草 w49a）。 第 0.22 版（2026-09-30）は、行 k-tz-tests の 18 節の xtask の歯 retire.rs の MOVED の doc の直しを 3 行の字で名指した（2 行目の k-tz-drop の対の範囲を 12〜15 番目に替え、3 行目に行 k-tz-tests の 1 対を足す）。便 t3-hub.74.4 の gate が、2 行目の末に字を継ぎ足した形を contract-fit で落とした。契約表の行は替えない。 第 0.23 版（2026-09-30）は、17 行目 m-doctor-hold〔面の server の器の doctor の出力の持ち回しの上限だけを 60 秒にし、使用量の読みと規則の行の読みは 30 秒のままにする・境界の server の seat と着地済みの歯 eheld・server_seat・server_acct の字と新しい歯 mdoch・S・depends は空〕と 19 節を足した。判断の記録 ADR-26（持ち主の裁定 t3-hub.52.156:20260930T1120Z-1 と t3-hub.52.157:20260930T1120Z-1・案 A）の決定 (2) の行で、同じ commit で ADR-26 を発効の形で置いた。計画だけの行ではないので規則の行 R-33 は書かない。起草 w50a が main 754442db の写しで試作し、変異を当てて歯が落ちることを見て、main 754442db に当てた。 第 0.24 版（2026-09-30）は、行 k-tz-tests の 18 節の形（xtask の歯）の段の次に doc と注の行の字の段を足し、形の段が足す・直すと書く 9 file の doc と注の行を起草の試作の字のまま名指した（便 t3-hub.74.4 の gate が 2 度目も、lib.rs と check.rs と retire.rs の doc の足しを既存の行の末への継ぎ足しで縮めた形を contract-fit で落とした・契約表の行は替えない・起草 w49a）。 第 0.25 版（2026-09-30）は、18 行目 k-size-folio〔除外の表の R-4 の行を消して表を行の無い形で残し、xtask の check の大きさの数えの段に持ち込んだ folio の src を数えさせ、folio の 2 つの関数の引数の expect の属性の理由の字を替える・S・depends は k-lint-folio と k-size-base〕と 20 節を足し、行 k-size-base の done (4) と行 k-lint-folio の done (1) の字をR-4 の行を消した後も成り立つ形に直した。除外の表の最後の行を消す行で、判断の記録 ADR-18 の決定 (5) のとおり持ち主の承認済み。計画だけの行ではないので規則の行 R-33 は書かない。起草 w51a が main 48f293f6 の写しで試作し、main 48f293f6 に当てた。 第 0.26 版（2026-09-30）は、19 行目 k-lint-rest〔workspace の lint の表に unsafe_code〔forbid〕と expect_used・unreachable・allow_attributes・allow_attributes_without_reason を足し、歯でない code の expect 24 と歯の unreachable 5 と unsafe 1 と契約の歯の allow の属性 1 を直す・M・depends は空〕と 20 行目 k-lint-print〔直接の print 103 を crate ごとの出力の手 emit と emit_err に寄せ、表に print_stdout と print_stderr を足し、xtask の歯 klint_print_hands を置く・M・depends は k-lint-rest〕と 21 節と 22 節を足した。規則の行 R-10 を表に全部入れるまでの残りの行の最初の 2 行で、判断の記録 ADR-18 の決定 (5) と条 P-24 の機構のとおり持ち主の承認済み。計画だけの行ではないので規則の行 R-33 は書かない。起草 w52a が main 43bf9055 の写しで試作し、main f58f342f に当てた。 第 0.27 版（2026-09-30）は、行 k-lint-rest に欄 growth を足した（server_acct.rs 5・home.rs 5・project/ledger.rs 20）。3 file は上限 1500 行までの余地が大きさ M の見込み 300 行より小さく、便 t3-hub.74.6 が器の事前の点検 cap-headroom で止まった。試作の伸びは 0・0・9 行。節と done と write-set は替えない。'

sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      持ち込んだ folio を tsuzuri の 1 つの binary tz の下に入れ（要件 FR17・受入 AC14・判断の記録 ADR-8・計画だけの行 k-parity を割った行）、持ち込んだ code に tsuzuri の規則（R-4・R-10）を当て、持ち込んだ木の中の床を見張る。あわせて、面の server の軽さ（規則の行 R-34・判断の記録 ADR-23 の撤退の条件）とメモリ（RSS）の直しの行を置く。

      1 行目 e-reason-id（境界の crate の server の ruling と batch・歯 rsid）は、面の server が問いを閉じる理由と開き直す理由を、裁定 id の後ろを半角の空白 1 つで区切る形（裁定 <id> 束 <束の id>・裁定 <id> 取り消す = <前の id>）にする。器の close の理由の読み手は空白で割った 2 語目だけを裁定 id と読むので、今の形（id の直後に字 ・）では裁定 id が値の形の外に落ちる（器の席の答え 2026-09-30）。器の局面の出力の切り替えより前に着地させる。
  - n: 2
    type: contract-table
    title: 契約表
    rows:
      - id: e-reason-id
        title: 面の server が問いを閉じる理由と開き直す理由を、裁定 id の後ろを半角の空白 1 つで区切る 裁定 <id> 束 <束の id> と 裁定 <id> 取り消す = <前の id> の形にし、方針の問いは 裁定 policy:<方針の id> で閉じて、器の close の理由の読み手が 2 語目を裁定 id と読めるようにする（方針は承認に数えないまま・境界の crate の server の ruling と batch と policy だけ）
        req: ["FR6", "FR7", "FR8"]
