    type: prose
    title: 行 k-lint-base — 規則の行 R-10 の lint の機構を置き、R-10 と R-4 を tsuzuri と持ち込んだ folio に当てる段を並べる
    body: |
      在りかの main は 214118b4。起草 w43a が main 4ad0b18f の写しで試作した（この行が書く file は 4ad0b18f から 214118b4 まで変わっていない）。書く file は write-set の 10（根の Cargo.toml と新しい clippy.toml・tsuzuri の 5 つの member の manifest・面の歯 wstrip.rs・xtask の新しい歯の file klint.rs と filter の語の写しの file filter-words.txt）。

      なぜ。条 P-24.1 は規則の行 R-10 の書き方を workspace の lint で deny にすると言い、条 P-22.1 は規則の行 R-4 の上限を CI が実測して落とすと言う。どちらも機構は M1（まだ無い）で、tsuzuri は R-10 の lint も R-4 の数えも置いていない（行 k-join-folio の 30 節）。持ち込んだ folio への 2 つの規則は除外の表 carry-exclusions.toml の R-4 と R-10 の行（裁定 t3-hub.67.4:20260929T0058Z-1）で外していて、外す行は k-size-folio と k-lint-folio（計画 surface-plan の 6 節）。表の行を消すには、先に tsuzuri の全体に機構が要る。

      今の数（main 4ad0b18f・clippy 1.98.1・器の clippy.toml と同じ閾値と歯の範囲の例外・R-10 と R-4 の関数の粒度の lint を警告で撃ち、字の位置で重ねない数・起草 w43a の measure.sh と count-lints2.py）。全部で 4,759。tsuzuri の 5 つの member（契約・中核・境界・面の crate と xtask）の歯でない code は、R-10 が 266（slice の添字 160・直接の stderr 63・直接の stdout 32・expect 11）、関数の粒度が 47（行 38・引数 5・複雑度 1 と build.rs の行 3）。統合の歯の file は、R-10 が 2,182（expect 1,490・panic 553・添字 128・unwrap 5・unreachable 5・unsafe 1）、関数の粒度が 283（複雑度 146・行 124・引数 13）。持ち込んだ folio の歯でない code は R-10 が 280・関数の粒度が 115（起草 w33a の見積りと同じ）、歯の file は R-10 が 1,491・関数の粒度が 63。unused_must_use・todo・unimplemented・exit・dbg_macro は全部の member で 0。R-4 の関数の粒度でない 3 つ（1 module の行数・core の総行数・歯と source の比）は、器の xtask の数え方（crate の src の中だけ）なら今の木で上限の内。

      段の並び（起草の決め）。R-10 の lint は、tsuzuri の 5 つの member で違反が 0 になった lint から順に、根の 1 つの表 [workspace.lints] に deny（unsafe_code と R-4 の 3 つは forbid）で足す。直す行と表に足す行は同じ行にする。持ち込んだ folio は、除外の表に R-10 の行が在る間は表を継がない（歯が表の行を読んで member ごとに見る・表に読み手ができる）。順は、(1) この行（違反 0 の 5 つ・clippy.toml・歯）→ (2) k-lint-tests-face と (3) k-lint-tests（統合の歯の crate の根に #![cfg(test)] を置き unwrap_used と panic を足す）→ 後の行（起草していない）: 直接の print を 1 つの出力の手（理由つきの expect の属性・器の境界の main の emit と同じ形）に寄せ expect と unreachable と unsafe と allow の属性を直して print_stdout・print_stderr・expect_used・unreachable・unsafe_code・allow_attributes・allow_attributes_without_reason を足す行（約 110 か所・M）、slice の添字を直して indexing_slicing を足す行（中核 66・面 52・境界と xtask 42・M の 2〜3 行）、引数を 5 以下にして clippy.toml に引数の閾値を足し too_many_arguments を足す行（18・folio の 32 は folio の dir の clippy.toml で既定のままにする）、関数の行と複雑度を直して too_many_lines と cognitive_complexity を足す行（165 と 147・歯の関数が多い・群ごとに 6〜10 行）。tsuzuri の表が全部そろった後に、folio の R-10 の直し（統合の歯の根 65 の #![cfg(test)]・添字 208・print 61 ほか・3〜4 行）の最後の行 k-lint-folio が除外の表の R-10 の行を消して folio に表を継がせ（R-4 の lint を除いた写し）、folio の関数の粒度の直し（178・6〜8 行）の最後の行 k-size-folio が R-4 の行を消す。R-4 の関数の粒度でない 3 つを xtask の check で数える段は後の行で、R-4 の数える範囲（1 module と歯と source の比に tests/ の下を入れるか）の持ち主の答えの後に置く。その段も除外の表の R-4 の行を読んで folio を数えず、行が消えると数える。

      今の数を上限にして片方向に下げる形（ratchet）を採らない理由。(a) 数の上限は、今の違反をその数まで許す新しい仕組みで、条 N-3.1 の例外の仕組みに近く（条 P-25.4 が歯に禁じる落ちたままの台帳と同じ形）、R-4 の上限を 0 から今の数へ緩めるので条 P-22.3 の A-2 と持ち主の裁定が要る。(b) 器の便は design-intent/ を書かない見込み（器の path の種別の宣言で design-intent/ は設計意図・今までの契約の行の write-set に design-intent/ の下は無い）なので、規則の表に値を置く条 P-28 の R-31〜R-33 の運びでは、直す便と同じ commit で値を下げられず、席の後の commit まで緩みが残る。(c) lint ごとの数を数える段は clippy の JSON の読みと 2 度目の clippy を要り、CI の時間（規則の行 R-5 の 5 分の近く）を延ばす。代価は、表に入る前の lint の違反が直すまでの間に増えうること（今の M1 のまま）と、表に足す行の着地の前に別の行が同じ lint の違反を足すとその行が門で落ちること（直しの行は小さく、着地の main で数え直す）。

      条 N-3.1 との関係。この段の並びは例外の仕組みを足さない。表に入った lint は全部の tsuzuri の member に deny で効き、無効化の旗も今回だけの口も無い。表に入っていない lint は、条 P-24 と P-22 の機構がまだ無い M1 の残りで、この行が足す例外ではない。持ち込んだ folio の外しは、持ち主の承認済みの除外の表の行で、歯がその行を読むだけで行を足さない。歯の範囲の例外は条 P-24.3 の後半のとおり lint の設定（clippy.toml の 5 つ）で宣言し、code の例外は条 P-24.3 の前半のとおり理由を持つ expect の属性だけにする（allow の属性を禁じる lint は後の行が足す）。

      形（表）。根の Cargo.toml の [workspace.dependencies] の後に [workspace.lints.rust]（unused_must_use を deny）と [workspace.lints.clippy]（todo・unimplemented・exit・dbg_macro を deny）を足し、注の 3 行に拠りと段の並びと folio の外しを書く。tsuzuri の 5 つの member の manifest に [lints] と workspace = true を足す。folio の manifest は変えない。

      形（clippy.toml）。根に置く。鍵は too-many-lines-threshold（60）・cognitive-complexity-threshold（15・どちらも R-4 の値の写し）と、allow-unwrap-in-tests・allow-expect-in-tests・allow-panic-in-tests・allow-indexing-slicing-in-tests・allow-print-in-tests（歯の範囲の例外・R-10 の 5 つの書き方）。引数の閾値は置かない。too_many_arguments は clippy の既定で効く lint で、閾値 5 を置くと今の違反 50（tsuzuri 18・folio 32）で xtask の check の clippy が落ちるため、直す行が足す。器の clippy.toml の allow-useless-vec-in-tests は R-10 の書き方でなく既定の lint を歯で緩めるので置かない。clippy は member の dir から上へ最初の clippy.toml を読むので、member の dir と根までの間に別の file を置かない（歯で見る）。

      形（歯）。xtask/tests/klint.rs は外の依存を使わず repo の根からの相対の path で字を読む。一覧 MAP は表に置いてよい 18 の lint（R-10 の 13・条 P-24.3 の 2・R-4 の 3）と表と level と拠りの語を持ち、R-10 の語の集合を rules の file の行 R-10 の value と照らす。一覧 ENABLED は今の表の lint で、表に足す行がこの一覧も直す（xtask の骨組みの歯の直接依存の一覧と同じ運び）。filter の語は起草の時の main の 325 語を file xtask/tests/filter-words.txt に 1 行 1 語で写し、この行の歯が読む（後の行の歯も読んでよい）。面の歯 wstrip_release_profile_keys の見出しの閉じた一覧に workspace.lints.clippy と workspace.lints.rust を足す（歯の名とほかの字は変えない）。

      今の字（main 4ad0b18f）。根の Cargo.toml の見出しは workspace・workspace.package・workspace.dependencies・profile.release・profile.dev.package.folio の 5 つで、[workspace.lints] と clippy.toml は無い。どの member の manifest も [lints] を持たない。lint の属性は、folio の src の #![allow(dead_code)] 3 つと #[allow(…)] 4 つ・契約の歯の tests/common/mod.rs の #![allow(dead_code)]・folio の歯の 5 つの file の #[allow(dead_code)] 8 つ。xtask の check の clippy の段は clippy --workspace --all-targets -- -D warnings と面の wasm の 1 段で、manifest の [lints] を読む（CHECK_STEPS は変えない）。

      試作と噛み。main 4ad0b18f の写しに当てた木で、歯 klint_ の 6 本と wstrip_ の 3 本が緑、clippy の 2 段が緑。この行と次の 2 行を積んだ木で xtask の check（分けない全部）は rc 0。書く file は write-set の 10 で閉じる（試作の diff 21,817 byte）。変異（表から dbg_macro を外す・todo を warn にする・表 rustdoc を足す・関数の閾値を 70 にする・useless-vec の例外を足す・中核の dir に clippy.toml を置く・folio に表を継がせる・xtask の継ぎを外す・R-10 の語を替える・R-4 の数を最初の 1 つで読む・歯の名に filter の語 graph_・面の歯の見出しから lint の表を外す・契約の crate の src に todo を置いて clippy を撃つ）で、done の各歯と clippy の段が落ちた（起草 w43a の bite.py と results-lint3.json）。

      filter の語。接頭辞 klint_ は main 4ad0b18f の 325 語のどれとも部分の字として重ならず、今の木の歯の名に字 klint_ を持つものは無い。wstrip_ は着地済みの語。

      流す時と順。depends は空。行 k-lint-tests-face がこの行の後（depends）。R-4 の数えの段の後の行も filter の語の file を読むのでこの行の後。この行の後、tsuzuri の member に todo・unimplemented・exit・dbg_macro の書き方と使わない must-use の値を足す行は clippy の段で落ちる（今どの行も使っていない）。

      範囲の外。表に足していない lint の違反の直し（後の行）。R-4 の 1 module・core の総行数・歯と source の比の数え（後の行・R-4 の範囲の持ち主の答えの後）。folio の lint（k-lint-folio）。器の core と境界の crate の上限（規則の行 R-4 と R-29 が名指す器の行・器の code は tsuzuri に無い）。条 P-24.4 と P-24.5（型の柵・審査が見る）。憲法の条 P-22 と P-24 の機構の欄 live の M1 は、最後の行の着地の後に席が直す。

