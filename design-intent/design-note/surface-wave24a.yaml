    type: prose
    title: 行 k-lint-folio-deny — 持ち込んだ folio の根に R-10 の lint の crate の属性を置き、添字の外の違反を直す
    body: |
      在りかの main は db4ea60e（行 k-tz-entry は着地済み）。起草 w43b が main db4ea60e に同じノートの行 k-lint-folio-tests と k-tz-drop の試作を当てた写しで試作した。書く file は write-set の 20（folio の build.rs と src の 13 file と歯の file 5 と、xtask の歯の file klintf.rs）。ほかに verify の歯 modules.rs を置き場だけの = で持つ。

      なぜ。持ち込んだ folio への規則の行 R-10 は除外の表 carry-exclusions.toml の R-10 の行（裁定 t3-hub.67.4:20260929T0058Z-1）で外していて、行を消すのは folio の違反を直し終えた行 k-lint-folio（判断の記録 ADR-18 の決定 (5)〔持ち込む code への規則は最初は除外の表で持ち、段ごとの便で外す〕のとおり・持ち主の承認済みで新しい問いは要らない）。起草の写しで R-10 の lint を folio に撃つと、歯でない code の違反は添字（clippy::indexing_slicing）207 と、この行が直す 31（build.rs の expect 5 と print_stderr 3・src の expect 5 と unreachable 1・理由の無い allow の属性 src 9 か所と歯 8 か所〔lint allow_attributes と allow_attributes_without_reason の重なりを除いた在りかの数〕）。歯の手の unwrap と panic は行 k-lint-folio-tests の後は歯の中の扱いで 0。添字は後の 2 行（範囲の外の段）が直し、この行は添字の外を全部直して、直した lint が戻らないよう folio の根で deny にする。

      形（crate の属性）。folio の manifest に lint の表は置かない。行 k-lint-base の歯 klint_members_follow_carry_table は除外の表の R-10 の行が名指す member の manifest に字 [lints で始まる行が無いことを求め（k-lint-base の done (5)）、cargo は [lints] の workspace = true と自前の lint を混ぜられない。代わりに folio の 3 つの根（src/lib.rs・src/main.rs・build.rs）の頭の字 //! の行の続きの直後に、行 #![forbid(unsafe_code)] と、13 の lint を deny にする属性を置く。一覧（順のとおり）は unused_must_use・clippy::unwrap_used・clippy::expect_used・clippy::panic・clippy::todo・clippy::unimplemented・clippy::unreachable・clippy::exit・clippy::dbg_macro・clippy::print_stdout・clippy::print_stderr・clippy::allow_attributes・clippy::allow_attributes_without_reason。lib.rs の属性は lib と lib の単体の歯に、main.rs は binary に、build.rs は組み立ての script と、build.rs を mod build として取り込む歯 tests/constitution_enums.rs と tests/parts.rs のその module に効く。歯の crate（tests/ の下）には属性が効かないので、allow の属性の無さは字で見る（下の歯 klintf_no_allow_attrs）。行 k-lint-folio は除外の表の R-10 の行を消す時にこの属性を外して manifest を [lints] の workspace = true にし、歯 klintf_src_roots_lint_attrs を直す。

      直し（build.rs）。fn main は Result<(), String> を返し、環境変数の読みと導出と OUT_DIR への書きの失敗を map_err と ? で Err にする（cargo が組み立ての失敗として字を出す）。eprintln と std::process::exit と expect を持たない。導出の fn（derive・constitution_enums・constitution_fields・tool_files）は変えない。

      直し（src）。ceiling_src.rs の reads の doc の探しは let-else で Err（字 reads の doc <id> が documents に無い）。entry.rs の命令 ceiling の --out の取り出しは let-else で、無ければ標準エラーに字 folio ceiling: --gate の外では --out が要る を書いて 2 を返す（clap が --gate の外で --out を求めるので、ふだんは通らない）。findings.rs は 3 か所の expect を、所見 file を読めていない時と最上位が表でない時に理由を足して返す形にする（判定は今と同じ）。adr.rs の単体の歯の unreachable!() は panic!（歯の中の panic は clippy の歯の扱いで数えない）。

      直し（allow の属性・条 P-24.3）。例外は理由を持つ expect の属性だけ。src の 9 か所は、expect の lint が当たらない 1 か所（note.rs の check_one の too_many_arguments・引数は既定の閾値 7 の内）を消し、残り 8 か所を理由を持つ expect にする（もとから cfg_attr(not(test), allow(…)) の 2 か所〔adr.rs の floor_num・floor.rs の derive〕は cfg_attr の中を expect にし、lib の単体の歯で dead_code が当たらない module の属性 2 か所〔constitution_enums.rs・rules.rs〕は cfg_attr(not(test), expect(…)) の形にする・expect が満たされないと lint unfulfilled_lint_expectations で落ちるので）。関数の粒度の 2 か所（note.rs の check_section・lineage.rs の verify_pair）の理由は、除外の表の R-4 の行が在る間は直さない（行 k-size-folio）。歯の 8 か所は、取り込んだ src/sha256.rs の item を全部使う 3 か所（anchor.rs・floor_cases.rs・init.rs）を消し、残り 5 か所を理由を持つ expect にする。

      形（歯）。xtask の歯の file klintf.rs に歯を 2 つ足し、filter の語の一覧を起草の時の main の字に替える。歯 klintf_src_roots_lint_attrs は 3 つの根の頭の //! の行の続きの後の字が行 #![forbid(unsafe_code)] と、const DENY の 13 の lint の #![deny( の属性（一覧の順に 1 行に 1 つ・行頭に空白 4 つ・行の間は字 , ）で始まって行 )] で閉じ、字 #![deny( を 1 つだけ持つことを見る。歯 klintf_no_allow_attrs は folio の build.rs と src/ と tests/ の下（下の dir も辿る）の字 .rs で終わる file のどの行も字 allow( を含まないことを見る。歯 klintf_own_names_clean は下の一覧を const FILTER_WORDS に字のまま持ち、語の数 340 と test の fn の数 4 を断言する。

      今の字（main db4ea60e に行 k-lint-folio-tests と k-tz-drop の試作を当てた木）。folio の 3 つの根は lint の属性を持たない。build.rs の fn main は () を返し、expect 5 と eprintln 3 と std::process::exit 3 を持つ。字 allow( を持つ行は src 9 と歯 8。歯の file klintf.rs の歯は 2 つ（k-lint-folio-tests の done (2)）で、filter の語は 331 語。

      構造の連鎖（grep で全部）。歯 tests/constitution_enums.rs と tests/parts.rs は build.rs を #[path] で mod build として取り込む（build.rs の属性と fn main の形がその module に効く・緑を確かめた）。歯 tests/anchor.rs・floor_cases.rs・init.rs は src/sha256.rs と src/yaml.rs を #[path] で取り込む（src の 2 file はこの行で書かない）。src の catalog.rs・constitution_enums.rs・figure.rs は build.rs が OUT_DIR に書く file を include! で取り込む（file の名は変えない）。歯 tests/modules.rs は src の .rs の字から区切りの辺を読み（頭の属性の字 clippy:: は区切りの名でない・歯 p106_ の 2 本が緑）、行 k-tz-drop の歯 tests/fdrop.rs は lib.rs の字に mod inject と mod serve が無いことを見る（この行は mod の行を書かない）。klintf.rs を読む file は無い。

      行数（wc -l・試作の木）。この行は build.rs に 34 行足して 27 行消し（差し引き 7 行増えて 604 行）、src の 13 file に 107 行足して 31 行消す（lib.rs と main.rs は属性と説明の字で 18 行と 17 行増える・最も長い src の file は note.rs の 1,140 行と findings.rs の 1,134 行）。歯の 5 file は 2〜3 行ずつ増える。folio は除外の表の R-4 の行で大きさの数えの外（行 k-size-folio が消す）。

      試作と噛み。main db4ea60e に行 k-lint-folio-tests と k-tz-drop の試作を当てた写しで、歯 klintf_ の 4 本が緑、cargo clippy -p folio --all-targets -- -D warnings が rc 0、xtask の check（分けない全部）は rc 0（歯 2,921 本・230 秒）。試作の diff は 31,306 byte（20 file・283 行足して 94 行消す）。変異（lib.rs の deny から lint を 1 つ外す・main.rs の forbid を外す・build.rs の deny の 2 つの lint の順を替える・main.rs の //! の行と属性の間に空の行・lib.rs に 2 つ目の deny・歯 anchor.rs に allow の属性・src の stamp.rs に cfg_attr の allow・歯の名に filter の語 graph_・一覧から語 ksize_ を外す・歯を 1 つ足す）で done の歯 klintf_ が落ち、entry.rs に expect を戻す・build.rs に eprintln・adr.rs の歯の panic を unreachable に戻す・main.rs に println・floor.rs の expect から理由を外す・lineage.rs の expect を allow に戻すで clippy の段が落ちた（出力に lint の名が在る・起草 w43b の bite-fla.py と bite-fla2.py と results-fla.json と results-fla2.json）。build.rs の属性を use の行の後へ動かすと folio の組み立てが落ちる（xtask の歯の組み立ては境界の crate を通して folio を組む）。

      filter の語。接頭辞 klintf_ は着地済みの行 k-lint-folio-tests の verify の語で、足す歯の名から klintf_ を除いた字 src_roots_lint_attrs と no_allow_attrs は main db4ea60e の 340 語のどれも含まない。p106_ は着地済みの語。

