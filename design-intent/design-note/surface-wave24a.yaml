sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      持ち込んだ folio を tsuzuri の 1 つの binary tz の下に入れ（要件 FR17・受入 AC14・判断の記録 ADR-8・計画だけの行 k-parity を割った行）、持ち込んだ code に tsuzuri の規則（R-4・R-10）を当て、持ち込んだ木の中の床を見張る。あわせて、面の server の軽さ（規則の行 R-34・判断の記録 ADR-23 の撤退の条件）とメモリ（RSS）の直しの行を置く。

      1 行目 e-reason-id（境界の crate の server の ruling と batch・歯 rsid）は、面の server が問いを閉じる理由と開き直す理由を、裁定 id の後ろを半角の空白 1 つで区切る形（裁定 <id> 束 <束の id>・裁定 <id> 取り消す = <前の id>）にする。器の close の理由の読み手は空白で割った 2 語目だけを裁定 id と読むので、今の形（id の直後に字 ・）では裁定 id が値の形の外に落ちる（器の席の答え 2026-09-30）。器の局面の出力の切り替えより前に着地させる。
