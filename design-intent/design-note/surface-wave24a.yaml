    title: 行 k-tz-tests — 持ち込んだ folio の歯を tz の binary を撃つ境界の歯にし、folio の binary を退役させる
    body: |
      在りかは main 79d3b930 の木（depends の 6 行は全部着地済み・行 k-tz-drop〔9 行目・11 節〕は main 81bbee3c、k-tz-self〔10 行目・12 節〕は main 3c614352、k-lint-tests〔6 行目・8 節〕は main 43ff66a0、k-lint-folio-deny〔12 行目・14 節〕は main 04646ac7、k-lint-folio-idx-a〔13 行目・15 節〕は main 8a347565、k-lint-folio-idx-b〔14 行目・16 節〕は main 1fc76265、k-lint-folio〔15 行目・17 節〕は main 79d3b930 で着地）。起草 w49a が main 7a81444d に 4 行（k-tz-drop と k-tz-self は起草 w42a の着地の字の試作・k-lint-folio-deny は起草 w43b・k-lint-folio-idx-a は起草 w47a）の試作を重ねた写しで試作し、着地に合わせて 4 度当て直した。main 3c614352 の写し（ぶつかったのは歯 check.rs の p1_commands_closed_list の doc の 1 行と、xtask の歯 retire.rs の MOVED の doc の 2 行）、同じ main に起草 w48b の 2 行と行 k-lint-tests の代わりの試作を重ねた写し（folio の manifest の末尾〔k-lint-folio が足す [lints] の後ろにこの行の表 [[test]] を置く〕と src/lib.rs の module の doc）、main 33a14df9 に k-lint-folio-idx-a・k-lint-folio-idx-b・k-lint-folio の試作を重ねた写し（着地した k-lint-folio-deny の歯 anchor・floor_cases・init・parts の dead_code の expect の属性は 1 行の形で、この行の取り込みの置き換えと parts の分けをその字に合わせた・xtask の歯 klintf.rs と folio の src/lib.rs の doc は起草の鎖の字で当てた）、3 行の着地の後の main 79d3b930 の写し（ぶつかったのは folio の src/lib.rs の module の doc〔着地の k-lint-folio の字の 3〜4 行目〕と xtask の歯 klintf.rs〔着地の字の for の配列〕の 2 file で、どちらも着地の字に手で当てた・下の形の段はその字で書く）。書く file は write-set の 8 で、folio の歯の置き場 folio2/crates/folio/tests/ の下では、folio の binary を撃つ 58 file と歯 modules.rs を書き、新しい歯の file parts_catalog.rs を足す（ほかの 5 file〔constitution_enums・deps・face_labels・face_style・fdrop〕は書かない）。xtask の src/main.rs は置き場だけの =（verify の skeleton_ の行が撃つ骨組みの歯の置き場）。

      なぜ。判断の記録 ADR-8 の決定 (1) は、人が打つ binary を tz の 1 つにし、folio という名の command を持たないとした（要件 FR17・受入 AC14・計画だけの行 k-parity を割った 5 行の最後の行）。判断の記録 ADR-18 の決定 (2)（道具の切り替えは、pin と workspace の folio の出力が byte で同じことを確かめた後）と (5)（持ち込む code への規則は段ごとの便で外す）と合わせ、持ち主の承認済みで新しい問いは要らない。行 k-tz-entry の後、tz の 11 の口と索引の旗の tz graph は folio の lib の入口 folio::entry::run を撃ち、行 k-tz-drop が口 inject と serve を退け、行 k-tz-self が設計の索引の読みの既定を tz 自身にした。folio の binary は入口を撃つだけの src/main.rs で、撃つのは folio の歯（58 file が子の処理で撃つ）と席の道具だけになる。cargo は統合の歯に同じ package の binary の path（env! の CARGO_BIN_EXE_<名>）だけを渡すので、tz を撃つ歯は tz を持つ境界の package の歯でなければならない。そこで歯の file は置いたまま境界の package の歯にし、folio の binary を退役させる。

