    title: '行 k-lint-tests — 残りの統合の歯の crate の根に #![cfg(test)] を置き、表に unwrap_used と panic を足す'
    body: |
      在りかの main は 3c614352（前の行 k-lint-base と k-lint-tests-face は着地済み）。起草 w43a が main 4ad0b18f の写しで試作した。書く file は根の Cargo.toml と、契約・中核・境界の crate の tests/ の直下の .rs のうち頭の行を持たない 11・49・74 と、xtask の tests/ の 6 つの歯の file（6 つとも頭の行を足し、klint.rs は歯の直しも）。

      なぜ。行 k-lint-tests-face の節のとおり。この行で tsuzuri の 5 つの member の統合の歯の crate の根の全部（285・main 3c614352）が #![cfg(test)] を持ち、歯の file の unwrap と panic が 0 になる。歯でない code の unwrap と panic は今 0 なので、表に unwrap_used と panic を deny で足す。

      形。各 file の頭の //! の行の続きの直後に #![cfg(test)] を足す。xtask の歯の file klint.rs（行 k-lint-base が足した）は頭の行を持たないので、この行が足す（歯の直しと同じ file）。根の Cargo.toml の [workspace.lints.clippy] の頭に unwrap_used と panic を deny で足し、歯の一覧 ENABLED を 7 つにする。歯 klint_test_roots_cfg_test の一覧 SWEPT を消し、除外の表の R-10 の行が名指さない全部の member を見る。write-set は 3 つの crate の tests/ を dir の形で、xtask の 6 つの file を名で書く。

      今の字（main 3c614352）。統合の歯の crate の根は契約 11・中核 49・境界 79・面 139・xtask 7 の 285。頭の行を持たないのは契約 11・中核 49・境界 74・xtask 6 の 140 で、これがこの行の書く根。境界の 79 のうち、着地した行が足した mbig.rs・rsid.rs・tzent.rs・tzpar.rs・tzself.rs の 5 つは //! の行の続きの直後に #![cfg(test)] を既に持つ（この行は書かない・write-set の dir の形が覆う）。xtask の tests/ の直下の字 .rs で終わる file は carry.rs・cishard.rs・deny.rs・klint.rs・klintf.rs・retire.rs・tlic.rs の 7 つ。klintf.rs（行 k-lint-folio-tests が足した歯の file・main 66e18159）は //! の行の続きの直後の行が #![cfg(test)] で、その行を 1 つだけ持つので、この行は書かず write-set にも置かない（done (2) の歯はこの file も見て、今の字のままで満たす）。残りの 6 つ（klint.rs を含む）は頭の行を持たない。面の 139 は全部持つ（行 k-lint-tests-face）。表は unused_must_use・todo・unimplemented・exit・dbg_macro。契約の歯の tests/common/mod.rs は歯の crate の根でない module で、根の #![cfg(test)] が覆う（この行では書かない）。

      試作と噛み。前の 2 行の上に当てた木で、歯 klint_ の 7 本が緑、clippy の 2 段が緑、3 行を積んだ木で xtask の check は rc 0。試作の diff は 91,493 byte。変異（境界の歯の根から #![cfg(test)] を外す・中核の歯の根の #![cfg(test)] を use の行の後へ動かす・表から unwrap_used を外す・ENABLED から panic を外す・境界の歯の根から #![cfg(test)] を外して clippy を撃つ）で、done の各歯と clippy の段が落ちた。

      流す時と順。depends は k-lint-tests-face。同じノートの行 e-reason-id は境界の crate の tests/ に新しい歯の file rsid.rs を足し、server_batch.rs と bhalf.rs を書く。e-reason-id が先に着地すれば、この行はその根にも #![cfg(test)] を足す（done は着地の時の木の全部の根を見る・write-set の dir の形がその file を覆う）。この行が先なら、e-reason-id の新しい file の頭に #![cfg(test)] が要る。この行の着地の後に tsuzuri の member へ歯の file を足す行は頭に #![cfg(test)] を置き、歯でない code に unwrap と panic を書く行は clippy の段で落ちる（起草済みで着地の前の行が在れば、席が起草者に知らせる）。

