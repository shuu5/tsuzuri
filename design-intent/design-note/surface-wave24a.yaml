      席の決め（規則を弱めない・案 A）。folio の manifest に [lints] の workspace = true を足す（ほかの 5 つの member と同じ形・節は workspace = true の 1 行だけ）。folio の 3 つの根の lint の一覧は残す。workspace の lint の表は行 k-lint-tests の後も unused_must_use・unwrap_used・panic・todo・unimplemented・exit・dbg_macro の 7 つで、一覧が持つ expect_used・unreachable・indexing_slicing・print_stdout・print_stderr・allow_attributes・allow_attributes_without_reason と unsafe_code の forbid を持たないため、一覧を消すと folio の lib と binary と build.rs の規則が弱まる。一覧を消す行は、表が一覧の全部を持った後に別に置く。この行で folio に新しく効くのは、表の 7 つが folio の統合の歯の crate（tests/ の根・どれも頭に #![cfg(test)] を持ち、根の clippy.toml の歯の範囲の例外が unwrap と panic を外す）に効くことと、unused_must_use が folio の歯の組み立てにも効くこと（lib と binary と build.rs は一覧で既に deny）。

