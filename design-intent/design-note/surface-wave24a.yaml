tipx_dom_text tkad_ tlic_ topbar_ topfit_ tz_ tzent_ tzpar_ udacct_ udash_ unow_ urpanel_ uword_ wsteady_ wstrip_

      今の字（行 k-tz-entry の着地の main db4ea60e）。folio の src/entry.rs は 762 行で、lib の入口 pub fn run（引数の列と書き先 out と err を受け、終了 code を u8 で返す）と fn dispatch と fn code を持ち、enum Command は口 14（check・inject・parts・face・figure・build・derive・intake・hello・ceiling・schema・graph・init・serve）で、dispatch はその 14 の腕を持つ。use crate の括り書きは inject と serve の名を持つ。src/lib.rs は module の宣言 61（pub mod entry と、inject と serve を含む 60）を持つ。歯 tests/check.rs の CLOSED はこの 14 の字（742 行目から）。歯 tests/modules.rs の層の表は inject を層 3、serve を層 5 に置く。歯 tests/help.rs は serve の説明の歯 1 本（49 行目から）と、命令の一覧の歯の口の列 face・check・serve（73 行目）を持つ。xtask の歯 tests/retire.rs の MOVED は 11 対。行 k-lint-folio-tests の着地の後は、folio の歯の crate の根が #![cfg(test)] を持ち、歯の file の行の番号は 1 つ増える。

      流す時と順。depends は行 k-tz-entry（2 行目）と行 k-lint-folio-tests（8 行目・folio の歯の crate の根に #![cfg(test)] を置く行・この行の前に置く）だけ（席の決め 2026-09-30）。器の入れ子の crate の穴で危ないのは、folio2/ だけを書く便が、同時に走る根の crate の便の使う folio の API を替えて着地する時だけ。この行が替えるのは口 inject と serve で、行 k-tz-entry の後の根の crate（境界）は folio の lib の入口 folio::entry::run だけを使い、inject と serve を名指さない（境界の cli の folio の NAMES に無い）ので、根の crate を書くほかの行と並べてよい。書く file が重なる先の行 k-lint-tests（6 行目・xtask/tests/retire.rs）とは、器の重なりの断りが同時に流さず、後に着地する方が前の字に当て直す。着地の後は、席が xtask の check と nextest を手で 1 回撃つ（器の穴の間の手の 5 点の 5 つ目）。行 k-tz-self（10 行目）とは書く file が重ならず、並べてよい。行 k-tz-tests（案・folio の歯を tz へ移し folio の binary を folio2/retired/ へ退役させる）はこの 2 行の後に置く。

      採らなかった案。消す形（前の案）は、憲法の条 N-1.2（退役は可逆な移動としてのみ行う）に反する。serve を lib に残して tz に出さない形は、撃つ所の無い非公開の module が dead code の警告で clippy -D warnings を落とし、歯 tests/serve.rs は folio の binary を子の処理で撃つので行 k-tz-tests で書き直しが要る。決めを後へ送る形は、この行の write-set（serve の分の 5 項）が決まらない。

      範囲の外。持ち込んだ木の字で 2 つの口を名指すもの（folio2/design-intent の要件 FR7〔srs.yaml の 300〜310 行目・build と serve〕と inject の要件〔同 287〜298 行目〕・srs の順序図 fig-tech の serve の節点と辺・憲法の条 N-6.1 と P-14・規則の表の行 R-2・判断の記録 ADR-12 と ADR-16・語彙の 102 行目の命令と旗の群・相談の行き先 inject〔intake.yaml と folio の src の intake.rs の定数 INJECT_TARGET〕・folio の歯の材料 folio2/tests/fixtures/floor_base の srs.yaml と ADR-9・folio2/docs の下の記録）は替えない。どれも持ち込んだ木の材料で、code を縛るのは tsuzuri の憲法だけ（判断の記録 ADR-18 の決定 (6)）。tsuzuri の憲法の条 N-6.1（design-intent/constitution.yaml の 699 行目・配信と表示 server の接続先）は folio serve が無くても誤りにならず（表示 server の tz surface serve を縛る）、直すなら憲法の改訂になる。folio の歯の材料 folio2/tests/fixtures/inject の 5 本は移さない（xtask の歯 f2ret_no_tool_names_under_folio2 の残す一覧 KEPT が名指し、戻す道で歯 tests/inject.rs と組む）。folio の src の schema.rs の module の doc の比べの字 inject.rs（生成区間の型）は、移した先で読めるので替えない。着地済みの行 k-join-folio と t-carry-retire の verify の字（-p folio --test inject の inject_ と f159_ の行）と、t-carry-retire の write-set の素の path folio2/crates/folio/tests/inject.rs は、この行の後は撃てないか元の path に無いが、着地した行の字は替えない（前例。器の契約表の検査は docs/design/ の下の区間の行だけを読み、folio の口 check は write-set の path の実在を見ない）。folio の歯を tz へ移し folio の binary を退役させること（後の行 k-tz-tests）。設計の索引の読みの既定を tz 自身にすること（同じノートの行 k-tz-self）。

  - n: 12
    type: prose
    title: 行 k-tz-self — 設計の索引の読みの既定を tz 自身にする
    body: |
      在りかは行 k-tz-entry（2 行目・4 節）の着地の後の木（着地は main db4ea60e・行 k-tz-drop とは書く file が重ならず、その着地の前でも後でも当たる）。起草 w42a が main 214118b4 に行 k-tz-entry の差分を重ねた写しで試作し、着地の main db4ea60e の写しに当て直した。書く file は write-set の 7 で、境界の crate の中だけ（ほかに verify で撃つだけの着地済みの歯 kcli.rs と hbconf.rs を置き場だけの = で持つ）。

      なぜ。面の server（tz surface serve）と問いの門（tz hook question-gate）と tz graph は、設計の索引と要約と裁定の書き出しを、引数 --folio の program を子の処理で撃って読む（境界の server の design の FOLIO_ARGS の字 graph --print --dir・SUMMARY_ARGS・RULINGS_ARGS の check --emit-rulings --dir）。--folio を省いた既定は folio という名の program（PATH から探す）で、plugin の問いの門（plugin/hooks/hooks.json の tz hook question-gate --repo）は --folio を渡さない。行 k-tz-entry の後、tz は索引の旗の tz graph と口 check を folio と同じ引数の字で受けるので、既定を撃っている tz 自身にすれば folio という名の program が無くても読める（後の行 k-tz-tests が folio の binary を退役させる前に要る・要件 FR17）。

      形。境界の cli の folio（行 k-tz-entry の file）に pub fn program(value: Option<&str>) -> OsString を足す: Some の値はそのまま、None は std::env::current_exe の path、自身の path が読めなければ境界の server の design の FOLIO（字 folio）。境界の src/main.rs の起動の引数の読みは、program の列（bd・bdw・scribe2 の既定を上書きする組の列）から config.folio と folio の組を外し、列の後に config.folio = tsuzuri_boundary::cli::folio::program(folio); の 1 行と注を足す（--tz の既定と同じ決め・行 e-stage-target）。src/hook/question_gate.rs の引数の読みの欄 folio を folio: crate::cli::folio::program(folio), にし、src/cli/graph.rs の引数の読みの欄 folio を folio: super::folio::program(folio), にする（graph の Args の欄 folio の型を String から OsString に替える）。どちらも use の FOLIO を外す。server の design.rs の FOLIO の doc を、server の Config::new の既定と、自身の path が読めない時の名である字に直す（Config::new の既定の値は変えない・着地済みの歯 hbconf_new_fills_defaults はそのまま）。main.rs の module の doc の --folio の既定の字を直す。引数の名 --folio と FOLIO_ARGS の字は変えない（引数の名を替えるのは別の行）。

      着地済みの歯 qgate。境界の歯 tests/qgate.rs の qgate_parse_args は --repo だけの引数の既定の欄 folio を FOLIO と比べるので、比べる値を tsuzuri_boundary::cli::folio::program(None) にし、use から FOLIO を外す（ほかの字は変えない）。

      字（新しい歯 tzself が比べる字）。tz graph --design の標準出力の頭の字は、節点の列の頭 {nodes:[{id: の並び（鍵の字を二重引用符で囲む形・空白なし）。main.rs の server の既定の代入の字は config.folio = tsuzuri_boundary::cli::folio::program(folio); で、外した program の列の字は (&mut config.folio, folio)。question_gate.rs の呼びの字は folio: crate::cli::folio::program(folio), で、graph.rs の呼びの字は folio: super::folio::program(folio), 。新しい歯の file tests/tzself.rs は、頭の //! の行の続きの直後の行に #![cfg(test)] を 1 つ置く（空の行を挟まない・行 k-lint-tests の歯 klint_test_roots_cfg_test が見る形）。境界の src に足す字は unwrap・expect・panic・todo・exit・dbg を使わない。

      試作と噛み。main 214118b4 に行 k-tz-entry の差分を重ね、行 k-tz-drop とこの行を当てた木で撃ち、変異 5（program の既定を folio の名に戻す・tz graph の既定を folio の名に・server の既定を folio の名に・問いの門の既定を folio の名に・歯の名に filter の語）で、done の各歯が少なくとも 1 つの変異で落ちた。PATH を空にした tz graph --design は、既定の tz 自身で rc 0、--folio folio で rc 2 だった。着地の main db4ea60e の写しに行 k-tz-parity と k-tz-drop と一緒に当て直した時にぶつかったのは境界の src/cli/folio.rs の頭（着地の字は module の doc の字と use の行が違う）だけで、doc の 1 行と、use の行 std::ffi::OsString と crate::server::design::FOLIO と、fn run の後の fn program を、着地の字の中に足した。書く file は write-set の 7 で閉じる（diff 20,550 byte）。xtask の check（分けない全部）は rc 0（歯 2,927 本）。verify の nextest の行は緑（tzself_ 4・qgate_ 7・kcli_ 11・hbconf_ 4 本）。歯の file の字は替わらないので、変異は撃ち直さない。

      filter の語。新しい接頭辞 tzself_ は、行 k-tz-drop の 11 節の filter の語の一覧の 331 語（main 7ea3a2d3 の契約表の verify の最後の字）のどれとも、どちらの向きの部分の字としても重ならない。歯 tzself_own_names_clean が照らす語はその一覧の 331 語（歯の file の const に字のまま写し、数 331 を断言する）。qgate_・kcli_・hbconf_ は着地済みの語。

      今の字（行 k-tz-entry の着地の main db4ea60e）。境界の cli の folio は、use の行（std::io::Write と super::graph）と、NAMES・INDEX_FLAGS・GRAPH_FLAGS・INDEX_USAGE と、fn run・is_index・graph を持つ。main.rs は cli の folio を use で名指さず、口の振り分けの腕で tsuzuri_boundary::cli::folio の path を書く。main.rs の起動の引数の読みは --tz の既定を current_exe で埋め、--folio は program の列（bd・folio・bdw・scribe2）の組で上書きする。question_gate.rs と cli/graph.rs は既定を folio.unwrap_or(FOLIO) で埋め、use crate::server::design の括り書きに Design と FOLIO を持つ。

      流す時と順。depends は行 k-tz-entry（2 行目）だけ（席の決め 2026-09-30）。この行は境界の crate の中だけを書き、folio の API を替えないので、folio2/ を書く行（行 k-tz-drop〔9 行目〕ほか）と並べてよい。書く file が重なる先の行 k-lint-tests（6 行目・crates/tsuzuri-boundary/tests/qgate.rs・crates/tsuzuri-boundary/tests/tzself.rs）とは、器の重なりの断りが同時に流さず、後に着地する方が前の字に当て直す。後の行 k-tz-tests（案）はこの行と行 k-tz-drop の後に置く（folio の binary を退役させる前に、索引の読みの既定が tz 自身になっている）。

      範囲の外。席の道具（面の server の起こし直しの script の --folio の値・設計の commit の門・PATH の folio）の切り替え（席の手）。引数の名 --folio を替えること。
  - n: 13
    type: prose
    title: 行 k-size-base — xtask の check に規則の行 R-4 の大きさの数えの段を置く
    body: |
      在りかの main は f2574fb9（行 k-lint-base は着地済み）。起草 w43a が main 4ad0b18f の写しで試作し、起草 w43b が R-4 の数える範囲の裁定の後に main 44f7f5e0 の写しで直して撃ち直した。書く file は xtask の新しい src/size.rs と src/main.rs。

      なぜ。条 P-22.1 は規則の行 R-4 の上限（core の総行数・module の行数・歯と source の行数比・関数の粒度）を CI が実測する deny の門として持つと言うが、tsuzuri は数えていない。関数の粒度は clippy の lint（行 k-lint-base の段の並び）が見るので、この行は残りの 3 つを xtask の check の段で数える。数える範囲は持ち主の裁定 t3-hub.67.47:20260930T0626Z-1（案 A）と判断の記録 ADR-25 で決まり、行 R-4 の population の欄が字で持つ。

      数え方（R-4 の population の字・ADR-25 の決定 (1)〜(6)・器の xtask の check_sizes と同じ）。数える file は、根の members のうち除外の表 carry-exclusions.toml の R-4 の行が名指さない member の src の下の .rs の全部（src の外の tests/ と build.rs は数えない）。行の重みは字数を幅 120 で割って切り上げた数（1 以上）。file の本体は行頭が #[cfg(test)] の最初の行より前、検査の区間はその行から末尾で、名が tests.rs か _tests.rs で終わる file は丸ごと検査の区間。1 module は検査の区間も含めた file 全体の行数を 1,500 と比べる。中核の crate（crates/tsuzuri-core）の src の本体の和を 20,000 と比べる。歯:source は数える file の全部の検査の区間の和と本体の和を、歯 × 100 が本体 × 100 以下かで比べる（数える部品の全部を合わせた 1 つの比・器と同じ整数の比べ）。

      測る所（ADR-25 の決定 (8)）。器の便の受付（走らせる前の余地の検査）は crates/<部品>/src/ だけを測るので、xtask/src の file と folio2/ の file はこの段だけが測る。受付で測られない分の越えは、便を走らせ終えた後の check のこの段で落ちる。

      今の数（main 44f7f5e0 にこの行を当てた木・この行の段の事実の字）。file-lines=1280/1500（面の crate の project/ledger.rs）・core-lines=7109/20000・test-src-ratio=1808/47603（約 3.8%）。持ち込んだ folio は数えない（除外の表の R-4 の行・行 k-size-folio が消す）。

      形。xtask の新しい module size は、上限の定数 4 つ（CORE_MAX・MODULE_MAX・RATIO_PCT・WIDTH）と const LIMITS と、fn split・fn judge・fn measure と、根の Cargo.toml の members と除外の表の R-4 の行の読みを持つ。R-10 の書き方（unwrap・expect・panic・添字・print）を歯でない code に書かない。fn check は公開の走査の後、cargo の段の前に size::measure(root) を撃ち、Ok なら事実の 1 行を出し、Err なら落ちた段の字を出して rc 1 を返し、後の段を撃たない。module の doc と fn check の doc に 1 文ずつ足す。歯 ksize_limits_match_rule_r4 は、上限の定数を行 R-4 の value の字と、数え方を population の範囲の字（done (3) の 6 つの字）と照らす。歯 ksize_own_names_clean は下の filter の語の一覧を歯の module の const FILTER_WORDS に字のまま持ち、語の数 339 を断言してから照らす（着地済みの歯 stcli_own_names_clean と同じ形）。器の core の上限（R-4 の器の core・R-29 の器の境界の crate）は、器の code が tsuzuri に無い間は数えない。

      今の字（main 44f7f5e0）。xtask の src/main.rs の fn check は、変数 TSUZURI_CHECK_PARTITION の読み・公開の走査（pubscan::run(root)）・for step in CHECK_STEPS の cargo の段・面の組み立ての順。着地済みの歯 pubscan_wiring は fn check の字で走査が for step in CHECK_STEPS より前であることを見て、歯 cishard_ の 2 本は CHECK_STEPS と fn step_args を見る（この行は CHECK_STEPS と fn step_args を変えない）。行 R-4 の population の字は、同じ commit でこのノートの版と一緒に足した範囲の字を持つ。

      試作と噛み。main 44f7f5e0 に同じ commit の R-4 の範囲の字とこの行を当てた木で、歯 ksize_ の 7 本・pubscan_・cishard_ が緑、xtask の check（分けない全部）は rc 0（歯 2,947 本）。書く file は write-set の 2 で閉じる（試作の diff 23,196 byte）。変異（core の上限を 20,001 にする・印を行頭でなくても読む・重みを切り捨てる・比の上限を見ない・除外の表を読まない・落ちても段を撃つ・file の上限をちょうどで落とす・1 module の上限を 1,000 にする・歯の名に filter の語 tz_ と klintf_・R-4 の population から tests/ と build.rs の字と比の範囲の字を外す・filter の語の const から語を 1 つ外す）で、done の各歯が落ちた（起草 w43b の bite-size2.py と results-size2.json）。

      filter の語。接頭辞 ksize_ は main 44f7f5e0 の 339 語のどれとも部分の字として重ならず（どちらの向きも）、今の木の歯の名に字 ksize_ を持つものは無い。pubscan_ と cishard_ は着地済みの語。

      filter の語の一覧（起草の時の main 44f7f5e0 の契約表の verify の最後の字・339 語・空白で区切る）。歯 ksize_own_names_clean は、この一覧を歯の module の const に字のまま写し、語の数 339 を断言してから照らす。一覧は次のとおり。 aaround_ aaround_src_ask_fold_embeds abss_ abst_ accept_ acchold_ account_ acctcore_ acctcore_pure_and_no_new_dependencies acctdoc_ acctframe_ accthb_ accthome_ acctled_ acctlook_ acctpcore_ acctproj_ acctsess_ acctwin_ acctwire_ acctwire_back_part_before_header acctwire_back_steps aface_ afocus_ afocus_src_links_and_scroll alean_ aord_ aown_ apark_ apop_ areread_ askcard_ askcard_page_frame_and_nav athr_ batchpanel_ batchpanel_page_frame_two_columns bhalf_ board_min_ bport_ brand_ brand_path_written_once_in_contract btuck_ cadl_ cadopt_ cadq_ cdorm_ cexcl_ cfsplit_ cg9_ cgdom_ check_canonical_design_intent_passes cishard_ cmark_ cnote_ cnret_ contract_form_ cround_ csled_ cspk_ ctick_ cupd_ cupdlist_ denv_ dnedge_ dngrp_ dnrow_ dnskip_ dretry_ dstg_ ecache_ ecache_handle_wiring_text eheld_acct_ eheld_design_ eheld_held_ eheld_marks_ eheld_vessel_ elazy_ epolq_ eretry_ esig_ evkind_ f123_ f152_ f159_ f192_ f212_ f2ret_ f89_ fdlt_ fdlv_ fdrop_ flight_ fmark_ fprem_ frame_ frame_home_blocks_in_order_and_map_page frame_one_module_per_block fserve_ fstop_ fstop_usage_errors_are_one fundl_ fxpre_ g3g7_ gacct_ gapspage_ gapspage_page_frame_and_nav gatt_ gbnote_ gchip_ gcoach_ gext_ gfix_ gfresh_ gfresh_boards_text ghb_ gins_ gjst_ glabel_ gmret_ gmretw_ gnav_ gpface_ gpill_ gpulse_ gpulse_boards_text gquestion_ graph_ gsum_ gtuck_ gview_ gwv_ hacols_ harest_ hasplit_ hbconf_ hbconf_config_moves_to_config_rs hbconf_main_parse_fills_the_rest_with_new hbmark_ hbon_ hbpost_ hbpost_mod_rs_drops_post_fns hbproc_ hbroute_ hbroute_mod_rs_keeps_only_events hcard_ hcled_ hcnx_ hcproj_ hcsess_ hdchip_ hfig_ hnunk_ hook_ hruling_ hsblock_ hsblock_dispatch_by_list hsblock_ids_match_consts hsblock_kit_holds_shared hsderive_ hsderive_consts_match_note hshist_ hspage_ hspage_snaps_match_files hspk_ hsym_ hthr_ http_ hwstore_ iclose_