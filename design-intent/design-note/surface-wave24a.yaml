      在りかの main は f58f342f に同じノートの行 k-lint-rest を当てた木。起草 w52a が main 43bf9055 に k-lint-rest の試作を積んだ写しで試作した。書く file は write-set の 23（根の Cargo.toml・境界の src の lib.rs と新しい out.rs と main.rs と 13 の module・境界の歯 stbp.rs・面の src/main.rs・xtask の src の main.rs と accept.rs と pubscan.rs・xtask の歯 klint.rs）。

