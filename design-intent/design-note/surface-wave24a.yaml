  - n: 3
    type: prose
    title: 行 e-reason-id — 問いを閉じる理由の裁定 id の後ろを半角の空白で区切る
    body: |
      在りかの main は ea06f7a3（起草の main 4ad0b18f から、この行が書く file を確かめてから当てる）。書く file は境界の crate の server の ruling.rs と batch.rs と、新しい歯の file の rsid.rs と、着地済みの歯の file の server_batch.rs・bhalf.rs・rvk.rs（期待の argv の字だけ）。

      なぜ。器（scribe2）の席の答え（2026-09-30T05:1xZ）。器の close の理由の読み手（器の main 09197b21 の ledger/close_reason.rs の pub fn read）は、前後の空白を除き Unicode の空白で割った 1 語目を 9 つの頭と照らし、頭が 裁定 なら 2 語目だけを裁定 id の形（問い id の形 <問い id>:<年月日 T 時分 Z>-<n>・batch: の形・policy: の形）で読み、3 語目から後は読まない。tsuzuri の束の受付（batch.rs の fn accept）は問いを 裁定 <id>・束 <束の id> で閉じ、取り消し（ruling.rs の fn reopen）は問いを 裁定 <id>・取り消す = <前の id> で開き直す。空白で割ると 2 語目は id と字 ・ と次の語の頭をつないだ字になり、問い id の形の裁定 id は値の形の外に落ちる（数の欄が 1・束 のような字になる）。器が局面の出力（lifecycle.json・器の束 E の W4）へ切り替えた後に、tsuzuri が閉じた問いが misfit と判じられないように、器の読み手を変えずに解ける形へ直す（器の勧めの形）。

      形。ruling.rs に pub const REASON_HEAD（字 裁定）と pub fn reason（裁定 id と続きの字の Option を受け、続きが無ければ 裁定 <id>、在れば 裁定 <id> <続き>・区切りは半角の空白 1 つ）を置き、1 問の裁定の close（fn accept）・取り消しの開き直し（fn reopen・続きは 取り消す = <前の id>）・束の close（batch.rs の fn accept・続きは 束 <束の id>）の 3 か所の理由をこの fn で組む。新しく書く理由は 裁定 <id>・裁定 <id> 束 <束の id>・裁定 <id> 取り消す = <前の id> の 3 形で、1 問の形の字は今と同じ。続きの字（束 の語と束の id・取り消す = と前の id）は今のまま残す（器の読み手は読まないが、台帳を人が読む時の手がかり）。notes の定型行（裁定 id = <id>・問い = … の形と、その欄の終わりの字 ・）は変えない。

      前の形の読み。tsuzuri の中で close の理由を読むのは、中核の graph の check の fn landed（頭が landed か 着地 の理由だけを着地と読む）と、中核の pipeline の fn closed_reason（閉じた契約 bead の札の段の理由の字・空白の続きを 1 つに畳んだ頭の字）の 2 つだけで、どちらも裁定 id を引かない。効いている裁定と取り消しの判じ（契約の crate の surface の pub fn latest_ruling・pending_reopen・revocable）と配達（中核の delivery）と導出グラフの裁定の節点は、問いの notes の定型行だけを読み、close の理由を読まない。そのため、前の形で閉じた台帳の行（起草の時の台帳の export の写し .beads/issues.jsonl で、閉じた問いの理由は束の形 47 本・1 問の形 32 本）も今どおり読め、取り消しも同じに受ける（歯 rsid_old_form_revokes）。台帳の前の行は書き換えない。

      今の字（main 4ad0b18f）。ruling.rs の fn accept は理由を format! の字 裁定 {id} で、fn reopen は format! の字 裁定 {id}{ID_END}{REVOKES}{} と req.ruling で、batch.rs の fn accept は format! の字 裁定 {id}{ID_END}束 {batch} で組む（ID_END はどちらの file も字 ・ の const）。着地済みの歯は、server_batch の fn row_argvs が 裁定 {ruling}・束 {batch} を、bhalf の fn row_argvs が 裁定 {ruling}・束 {batch_id} を、rvk の fn reopen_argv が 裁定 {id}・取り消す = {revokes} を期待の argv に組み、この行で字 ・ を半角の空白に書き換える。rvk の rvk_reopen_argv_and_wire と契約の crate の cform_ledger と snapshot の ledger.json は、LedgerWrite の argv と電文の形を字の見本で見るだけで server の理由を見ないので、前の形の見本のまま変えない。1 問の close を見る server_ask と eretry の期待の字 裁定 {id} は変わらない（server_ask_ruling_writes_twice と eretry_read_retries_then_writes は、1 問の理由の字が変わる変異で落ちる）。server_batch の fn row_argvs を使う歯のうち server_batch_id_counts_up_in_same_minute と server_batch_own_verbatim_or_batch_verbatim は notes の追記の argv だけを比べ、close の理由を見ない。着地済みの歯 dretry_spawns_use_pace と fserve_words_and_deliver は ruling.rs と batch.rs の字を読むが、この行の字（reason と REASON_HEAD）は数えない。

      器の読み手での確かめ。器の main 3908279b（close の理由の読み手と、それが引く is_bead_id と epoch_of は 09197b21 から変わっていない）の close_reason.rs を起草の場の外の一時の crate に写し、台帳の接頭辞 t3 で掛けた。新しい 3 形（裁定 t3-hub.59.28:20260930T0215Z-1・同じ id に 束 batch:20260930T0215Z-1 を続けた形・別の id に 取り消す = <前の id> を続けた形）は Form::Ruling でそれぞれの id を返し、前の束と取り消しの形は Defect::Value(Head::Ruling) を返した。写した読み手の in-file の歯 7 本も緑。器の file は書いていない。

      決めた幅（起草の決め）。(a) 区切りは器の勧めの半角の空白 1 つ（器の読み手は全角の空白でも割るが、勧めの字に揃える）。(b) 理由を組むのは ruling.rs の 1 fn に寄せ、batch.rs はそれを呼ぶ（束の close の理由の頭と区切りを 2 か所に書かない）。(c) 方針の受付（policy.rs の fn accept）が方針の問いを閉じる理由 方針 <id> は、器の 9 つの頭の外（器の読み手は Defect::UnknownHead）だが、器の席の答えが名指しておらず、頭を 裁定 にすると方針を承認として数えない決まり（要件 FR8）と食い違いうるので、この行では変えない（範囲の外）。

      試作と噛み（起草 w46a）。main 4ad0b18f の写しにこの行を当てた木で撃った。書く file は write-set の書く file の 6 で閉じる（試作の diff 23,578 byte・足し 417 行・消し 10 行・src の増えは ruling.rs が 13 行・batch.rs が 0 行）。xtask の check は rc 0（歯 2,934 本）。変異 8（理由の区切りを字 ・ にする・束の close を前の字の形に戻す・取り消しの開き直しを前の字の形に戻す・続きの無い理由の末に空白を足す・理由の頭を別の字にする・束の close が束の id を落とす・1 問の close が理由を自前で組む・歯の file に filter の語を含む歯を足す）で、done の各歯が少なくとも 1 つの変異で落ちた。

      filter の語。新しい接頭辞 rsid_ は、main 4ad0b18f の contracts の verify の filter の語（322 語・畳んで 247 語）のどれとも部分の字として重ならず、どの filter の語も rsid_ を含まない。

      流す時と順。depends は空。器の局面の出力の切り替え（器の束 E の W4）より前に着地させる。この行の後に同じ ruling.rs か batch.rs を書く行は、この行の着地の後に当て直す。

      範囲の外。方針の問いを閉じる理由（policy.rs の 方針 <id>・器の席に頭を照らしてから別の行で決める）。台帳に在る前の形の理由の書き換え。器の読み手の変更。notes の定型行の形。

  - n: 4
    type: prose
    title: 行 k-tz-entry — folio の口を tz の subcommand にする入口
    body: |
      在りかの main は 4ad0b18f（ノート surface-wave24a 第 0.1 版・計画 surface-plan の 9 節の計画だけの行 k-parity を割った最初の行）。起草 w42a が main 4ad0b18f の写しで試作した。起草の後の main 922314b0 までに動いたのは設計文書だけ（ノート surface-wave24a の 1 行目 e-reason-id と計画 surface-plan 第 1.17 版）で、試作の差分はそのまま当たる。書く file は write-set の 19（folio の src の main.rs と新しい entry.rs と lib.rs・folio の歯 modules・境界の新しい src/cli/folio.rs と cli/mod.rs と lib.rs と main.rs・境界の manifest と根の錠・xtask の src/main.rs・新しい歯 tzent・境界の依存の列を見る着地済みの歯 7 file）。

      なぜ。要件 FR17 と判断の記録 ADR-8 の決定 (1)〜(6) は、人が打つ binary を tz の 1 つにし、folio の 11 の口（check・schema・derive・ceiling・init・parts・face・figure・build・intake・hello）を同じ名の tz の subcommand にし、引数と終了 code（合格 0・不合格 1・まだ分からない 2）を folio の口のままにし、graph を tz graph に吸収し、inject を持たず、folio の crate を library として残すと決めた。持ち込んだ folio（行 k-join-folio で根の workspace の member）は binary の入口 main.rs の中に命令の読みと印字を持ち、tz から呼べる入口が無い。この行が入口を lib に出し、tz の口を渡す。folio の歯を tz へ移すこと・folio の binary の退役・inject と serve の退役・設計の索引の読みの既定を tz 自身にすることは後の行（4 節の範囲の外）。

      形（folio の lib の入口）。folio の src/main.rs を git の移動で src/entry.rs にし、module の宣言 60 を新しい src/lib.rs へ移す（pub は entry の 1 つだけ・ほかは crate の中）。entry.rs の fn main を pub fn run にする。run は引数の列（頭は命令の名）と、標準出力と標準エラーの書き先（&mut dyn Write の 2 つ）を受け、終了 code を u8 で返す。印字の macro 53 は、書き先へ 1 行を書き書けなければ黙る macro say に替える（閉じた pipe で落ちない）。命令の読みは clap の try_parse_from で、読みの誤りと --help は clap の render の字（色を付けない）を、use_stderr が真なら標準エラーへ・偽なら標準出力へ書き、clap の exit_code を返す（誤り 2・--help 0・前の folio の binary と同じ code）。図の道具の書き出しの後始末 figure::sweep は run の終わりに撃つ（前の fn main と同じ）。床の口の違反と要約の行の向き（--emit-amends と --emit-rulings では標準エラー・ほかは標準出力）は、前の closure の代わりに fn emit が持つ。entry.rs は crate の module を use crate の括り書きで名指す。新しい src/main.rs は folio::entry::run を std::env::args_os と標準出力と標準エラーで撃ち、返った code で終わるだけ（folio という名の binary の退役は後の行）。serve.rs の直接の印字 5 は変えない（serve は tz へ渡さない）。folio の file に rustfmt を掛けない（行 k-join-folio の節の決め）。

      形（tz）。境界の新しい src/cli/folio.rs に、口の名の閉じた一覧 NAMES（要件 FR17 の字の順の 11）と、索引の旗 INDEX_FLAGS（--print・--digest・--summary）と、索引の旗と混ぜない tz graph の旗 GRAPH_FLAGS（--check・--design・--repo・--bd・--folio・--state-dir・--project）と、fn run（命令の名 tz と口の名と引数の列で folio::entry::run を撃ち、標準出力と標準エラーへ書く）・fn is_index（索引の旗を 1 つでも持つ）・fn graph（GRAPH_FLAGS の名〔--名 と --名=値 の名〕が在れば標準エラーに 1 行と tz graph の使い方を書いて 1・無ければ口 graph を run）を置く。境界の main.rs の口の振り分けに腕を 2 つ足す（graph の腕の前に、is_index の真の graph を fn graph へ・stage の腕の後に、NAMES の名を fn run へ）。cli/mod.rs に pub mod folio と doc の 1 行、lib.rs と main.rs の module の doc に 1 行ずつ足す。境界の manifest の依存に folio の path（../../folio2/crates/folio）と注の 1 行を足し、根の錠の tsuzuri-boundary の dependencies に folio の 1 行が入る（外の部品の名は増えない・folio の clap と yaml-rust2 が tz の binary に入る・判断の記録 ADR-21 の承認の内）。面の crate は境界を開発の依存でだけ持つので、wasm の組みに folio は入らない。

      名の衝突と graph の吸収。tz の今の subcommand は surface・graph・hook・stage の 4 つで、11 の口の名とは重ならない。graph は吸収の形を次にする: 索引の旗を 1 つでも持つ tz graph は folio の graph の口へ渡し（引数・出力・終了 code は folio graph のまま・--dir の既定も folio の design-intent）、持たない tz graph は今の口（旗なし・--check・--design・--repo ほか）のまま。2 つを混ぜた引数は使い方の誤り 1。判断の記録 ADR-8 の決定 (3) の索引だけの眺めは今の tz graph --design のまま。面の server と問いの門と tz graph の設計の読み（境界の server の design の FOLIO_ARGS の字 graph --print --dir と、要約の graph --print --summary --dir と、裁定の書き出しの check --emit-rulings --dir）は、同じ引数の字で tz を撃てる形になる（読みの既定の program を tz 自身にするのは後の行）。

      字（断りと usage）。tz の知らない subcommand（inject・serve を含む）は今の断りのまま、標準エラーの 1 行目が字 tz: subcommand で rc 1（inject は判断の記録 ADR-8 の決定 (4)・serve は同じ決定 (5) と要件 FR17 の面の便の決め）。混ぜた tz graph の断りは字 tz graph: 索引の旗（--print・--digest・--summary）と <旗> は混ぜない の 1 行と tz graph の使い方の行。clap の usage の行の命令の名は、tz の口では tz（run の頭の引数）、folio の binary では folio（argv の頭）。そのほかの出力の字（例えば床の要約の行の頭の字 folio check: 不合格（違反 1・ や、口の断りの字 folio derive:）は folio の口のままで、byte の一致（要件 FR17・受入 AC14）は行 k-tz-parity の歯が見る。前の folio の binary は端末へ色付きの誤りの字を出したが、入口は色を付けない（pipe の字は前と同じ）。

      folio の歯の modules。folio の歯 tests/modules.rs（便 106）は区切りの宣言を src/main.rs から読み、src の file の名と層の表を比べるので、この行で書き替える: 層の表の層 5 に entry と lib を足し、宣言を src/lib.rs から読み（pub mod の行も数える）、宣言の集合に lib と main を足し、接頭辞の無い区切りの名を数える file を lib にする（module の doc の 2 行も直す）。層が上がる辺の凍結した一覧は変わらない（entry は層 5 で、名指す区切りは全部それより下か同じ層）。folio のほかの歯は src/main.rs を読まない（grep で確かめた）。

      境界の着地済みの歯の依存の列。境界の manifest の節 dependencies の鍵の列を字で読んで tsuzuri-contract と tsuzuri-core の 2 つと比べる着地済みの歯が 7 本在る（tests/iclose.rs の iclose_handle_wiring_text・server_acct.rs の server_acct_no_new_dependencies・server_acctwire.rs の acctwire_no_new_dependencies・server_ask.rs の server_ask_no_new_dependencies・server_batch.rs の server_batch_fixture_shape_and_no_new_dependencies・server_hb.rs の server_hb_no_new_dependencies・server_seat.rs の server_seat_no_new_dependencies・どれも面の server の行が外の依存を足さないことを見る）。この行は 7 本の比べる列の字だけを folio・tsuzuri-contract・tsuzuri-core にする（歯の名とほかの字は変えない・7 file の多くは rustfmt の既定の形でないので rustfmt を掛けない）。folio は workspace の member で、面の server の行が外の依存を足さないことの意味は変わらない。verify にはこの 7 本の歯を着地済みの filter の語で置く。

      xtask の骨組みの歯。const DIRECT_DEPS の crates/tsuzuri-boundary の行を folio・tsuzuri-contract・tsuzuri-core にし（doc に 1 行）、歯 skeleton_boundary_std_only_and_bin_tz の節 dependencies の鍵の列を同じ 3 つにする（外の依存が無いこと・target ごとの節が無いこと・binary の名 tz の確かめは変えない・doc の字を直す）。

      試作と噛み。main 4ad0b18f の写しにこの行と行 k-tz-parity を当てた木で撃った。書く file は write-set の 19 で閉じる（試作の diff 104,425 byte・git の移動の検出の無い形・entry.rs は 755 行）。xtask の check（分けない全部）は rc 0（歯 2,941 本・うち folio の歯 1,185 本・clippy の 2 段・面の組み立て）。verify の nextest の行は tzent_ 6・skeleton_ 9・p106_ 2 本と、着地済みの歯の 7 つの filter の行が緑。変異 12（口の腕を消す・口の名 hello を inject に替える・命令の名を folio のまま渡す・inject も渡す・索引の graph の腕を消す・混ぜの断りを消す・--名=値 の名を読まない・clap の誤りを標準出力へ・床の要約を process の標準出力へ・骨組みの一覧から folio を外す・依存の歯の列から folio を外す・歯の名に filter の語）と、層の表の変異 3（entry の行を消す・宣言を main.rs から読む・entry を層 1 に置く）と、境界の manifest の依存の folio の行を後ろへ動かす変異（7 本の着地済みの歯の 1 本ずつに当てた）で、done の各歯が少なくとも 1 つの変異で落ちた（噛みの log は起草の係の dir の bite.log と results.json）。

      filter の語。新しい接頭辞 tzent_ と、folio の歯の p106_ は、main 4ad0b18f の契約表の verify の最後の字 325 語のどれとも、どちらの向きの部分の字としても重ならない（filter の語を集める script で確かめた）。歯の名の字は、接頭辞を除いて 325 語のどれも含まない（parts_・inject_・graph_ を含む名を避けた）。skeleton_ は着地済みの語。

      今の字（main 4ad0b18f）。folio の src/main.rs は 776 行で、module の宣言 60・clap の Cli と Command（口 14）・fn main（run の後に figure::sweep）・fn proposed_refused と fn proposed_check と fn run（印字の macro 53）を持つ。境界の main.rs の口の振り分けは surface serve・graph・hook の 5 つ・stage の腕と、どれにも当たらない時の usage の字 subcommand の腕。境界の manifest の依存は tsuzuri-contract と tsuzuri-core の 2 つ。xtask の DIRECT_DEPS の境界の行は tsuzuri-contract と tsuzuri-core。

      流す時と順。depends は同じノートの先の行 e-reason-id（1 行目・書く file の crates/tsuzuri-boundary/tests/server_ask.rs・crates/tsuzuri-boundary/tests/server_batch.rs が重なる）。その行の着地の後に流し、重なる file は着地の後の字に当て直す。計画 5 節の鎖の boundary の main.rs と lib.rs の最後の行（k-parity）に当たり、鎖の前の行は全部着地済み。このノートのほかの行（起草 w43a の規則 R-4 と R-10 の機構・w45a の面の server の直し）が folio の src か境界の main.rs・lib.rs・manifest・xtask の src/main.rs を書くなら、席が便の bead の依存で順を持つ（器は write-set の重なる行を同時に流さない）。行 k-tz-parity はこの行の後（depends）。新しい歯の file tests/tzent.rs の頭の説明の直後に #![cfg(test)] を置く（起草 w43a の規則 R-10 の機構の行が歯の crate の根に置く形・その行の write-set に無い新しい歯の根はこの行の側で持つ）。

      範囲の外。口ごとの出力の byte の一致の歯（行 k-tz-parity）。folio の歯を folio の binary から tz へ移し folio という名の binary を無くすこと・inject と serve を folio の lib から退役させること・設計の索引の読みと問いの門と tz graph の --folio の既定を tz 自身にすること（どれも後の行・起草 w42a の notes の行の案）。席の道具（設計の commit の門・面の server の起こし直し・配信の組み直し）が tz の口を撃つ形への切り替え（席の手）。

  - n: 5
    type: prose
    title: 行 k-tz-parity — folio の口ごとの tz と folio の一致の歯
    body: |
      在りかの main は 4ad0b18f に同じノートの行 k-tz-entry（2 行目・4 節）を当てた木。起草 w42a が試作した。書く file は受入 AC14 の fixture tests/fixtures/tz/parity/cases.tsv と、境界の新しい歯の file tests/tzpar.rs の 2 つ。

      なぜ。要件 FR17 の verify は口ごとに folio と tz の終了 code と出力の一致を見ると決め、受入 AC14 は同じ fixture を folio と tz に渡して終了 code と出力を比べる（fixture tests/fixtures/tz/parity/）と決めた。行 k-tz-entry の歯は口の名と渡しを見るが、口ごとの byte の一致は見ない。

      形（比べる 2 つ）。片方は tz の binary（境界の歯が撃てる binary）。もう片方は folio の lib の入口 folio::entry::run で、folio の binary が撃つのと同じ入口を、頭の命令の名 folio と書き先の Vec で歯の process の中で撃つ（folio の binary は境界の歯から撃てず〔cargo は歯に同じ package の binary だけを渡す〕、後の行で退役するので、入口と比べる）。case ごとに撃つ側ごとの空の作業場を 2 つ作り、引数の字の {F} を持ち込んだ folio の置き場 folio2 の path に、{T} を側ごとの作業場の path に替える。比べるのは、入口の終了 code と case の期待の code・tz の rc と入口の code・標準出力と標準エラーの字・撃った後の 2 つの作業場の下の file の相対の path と byte の表。出力の字は 2 つだけ替えてから比べる: 作業場の path は側ごとに違うので字 {T} に戻し、clap の usage の行の命令の名は tz の側の字 Usage: tz（空白まで）を Usage: folio（空白まで）に替える（行 k-tz-entry の節の usage の字）。

      形（fixture）。cases.tsv は 1 行 1 case で、口の名・case の名・期待の終了 code・引数の字をタブで区切る（井桁で始まる行は注）。材料は folio の歯の材料（folio2/design-intent と folio2/tests/fixtures）だけを使い回し、tsuzuri の置き場は読まない（器の便の途中の置き場の字で case が揺れない）。case は 23: check の 5（folio2/design-intent の合格 0・fixture check/dup-key の不合格 1・fixture check/missing-file のまだ分からない 2・--polarity の 0・知らない旗 --no-such-flag の 2）、schema の 1（--check の 0）、derive の 2（作業場へ --write の 0・無い置き場の --check の 2）、ceiling の 2（--gate は撃つ場所が作業ツリーの一番上でないので 2・--faces の無い --check の 2）、init の 1（作業場へ骨格を書く 0）、parts の 2（--print の 0・--check の 2）、face の 2（作業場へ index の面を --write の 0・無い出力先の --check の 2）、figure の 1（無い文書の 2）、build の 1（face の fixture の --check の 2）、intake の 1（--print の 0）、hello の 2（無い置き場の 0・folio2/design-intent の 0・印の置き場は作業場）、graph の 3（--print・--digest・--print --summary の 0）。口の名は NAMES の 11 と graph の全部を持つ。撃つ場所は歯の crate の dir（cargo の歯の cwd）。

      形（歯）。歯は口の組ごとに 4 本（床と導出と天井・面と図と配信・始まり・索引）に分け、nextest が並べて撃つ。fixture の形の歯と、歯の名の歯を足して 6 本。check --proposed（標準入力を読む）は case に無い（入口は process の標準入力を読むので、歯の process の中で渡せない・tz は標準入力をそのまま渡す）。

      試作と噛み。main 4ad0b18f に行 k-tz-entry とこの行を当てた木で撃った。書く file は write-set の 2 で閉じる（試作の diff 17,628 byte）。tzpar_ の 6 本は緑（xtask の check の中で、床と導出と天井の組 5.2 秒・面と図と配信の組 3.4 秒・索引 0.3 秒・始まり 0.2 秒）。xtask の check は行 k-tz-entry の節の数のとおり rc 0。変異 8（fixture から hello を落とす・tz が標準エラーを標準出力へ書く・床の不合格の期待を 0 にする・tz が --summary を落とす・部品の検査の期待を 0 にする・tz の init が作業場に余分な file を書く・usage の命令の名を戻さない・歯の名に filter の語）で、done の各歯が少なくとも 1 つの変異で落ちた。

      filter の語。新しい接頭辞 tzpar_ は、main 4ad0b18f の契約表の verify の最後の字 325 語のどれとも、どちらの向きの部分の字としても重ならない。歯の名の字は、接頭辞を除いて 325 語のどれも含まない。

      流す時と順。depends は同じノートの行 k-tz-entry（入口 folio::entry::run と NAMES と tz の口を使う）。書く file は行 k-tz-entry と重ならない。新しい歯の file tests/tzpar.rs の頭の説明の直後に #![cfg(test)] を置く（行 k-tz-entry の節と同じ）。

      範囲の外。席の道具の切り替えの前の、道具の pin（外の固定の folio）と tz の口の出力の byte の比べ（判断の記録 ADR-18 の決定 (2)・席の手）。check --proposed の byte の一致。

