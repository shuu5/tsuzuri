      器の穴の 5 点（入れ子の crate）。この行の write-set は器の検出線（crates/・根の Cargo.toml・Cargo.lock・rules/・.vessel.toml）に触れないので、着地の後の追随の再 gate は省かれる。(1) 器は folio2/ の重なりを見ないので、書く file が重なる行を depends で並べる（下の段）。この行は folio の pub な API（entry::run）の形を変えないので、folio に依る境界の crate を書く行（e-reason-id・k-tz-parity・m-big-copies・k-tz-self）とは同時に流してよい。(2) 行数は上の段。(3) 構造の連鎖は上の段。(4) verify の folio の歯と clippy は -p folio を名指す。(5) 着地の後に席が xtask の check と nextest を手で 1 回撃つ。

      流す時と順。depends は k-lint-folio-tests（歯の file klintf.rs と、folio の歯の根の全部を書く）と k-tz-drop（entry.rs・lib.rs・歯 init.rs を書く）。行 k-tz-entry は着地済み。行 k-lint-tests は歯の file klint.rs を書き、この行は klint.rs を書かないので重ならない。行 k-size-base は xtask の src を書き、重ならない。後で folio の歯を境界の crate へ動かす行 k-tz-tests は、この行が書く歯の 5 file（anchor.rs・constitution_enums.rs・floor_cases.rs・init.rs・parts.rs）と、歯 klintf_ の見る置き場（folio の tests/）に重なるので、置く時に depends にこの行を足し、歯 klintf_no_allow_attrs の見る置き場を動かした先に直す。

      範囲の外。添字の直し（folio の src の 29 file・207 か所・後の 2 行 k-lint-folio-idx-a と k-lint-folio-idx-b。a が graph.rs・floor.rs・sha256.rs・parts.rs・ceiling_src.rs・vocab.rs の 114 か所、b が残りの 23 file の 93 か所を直して clippy::indexing_slicing を一覧に足す）。除外の表の R-10 の行を消し、属性を manifest の [lints] の workspace = true に替え、歯 klint の除外の member の見方を直す行 k-lint-folio。関数の粒度（規則の行 R-4・行 k-size-folio）。
