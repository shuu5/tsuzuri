    type: prose
    title: 行 k-lint-folio-idx-a — 持ち込んだ folio の src の 6 file の添字を直し、6 file の頭で lint を deny にする
    body: |
      在りかの main は 77530015。起草 w47a が main 19ff39fa に、同じノートの行 k-lint-folio-tests と k-tz-drop と k-lint-folio-deny の試作（起草 w43b の写しの 3 つの commit）を当てた写しで試作した。書く file は write-set の 7（folio の src の 6 file と xtask の歯の file klintf.rs）で、置き場だけの 5（= の folio の歯の file・verify の行が撃つ）は書かない。

      なぜ。持ち込んだ folio への規則の行 R-10 は除外の表 carry-exclusions.toml の R-10 の行（裁定 t3-hub.67.4:20260929T0058Z-1）で外していて、行を消すのは folio の違反を直し終えた行 k-lint-folio（判断の記録 ADR-18 の決定 (5)〔持ち込む code への規則は最初は除外の表で持ち、段ごとの便で外す〕のとおり・持ち主の承認済みで新しい問いは要らない）。行 k-lint-folio-deny の後の folio の違反は添字（clippy::indexing_slicing）だけで、src の 29 file に 207 か所（起草の写しで lint を -W で撃って数えた・歯の中は根の clippy.toml の allow-indexing-slicing-in-tests で数えない）。この行は多い側の 6 file（graph.rs 40・floor.rs 18・sha256.rs 16・parts.rs 14・vocab.rs 13・ceiling_src.rs 13・合わせて 114）を直し、残りの 23 file の 93 か所と lint の一覧への足しは後の行 k-lint-folio-idx-b が持つ。

      形（module の属性）。lint の一覧（folio の 3 つの根の #![deny( の属性・歯 klintf_src_roots_lint_attrs の const DENY）に clippy::indexing_slicing を足すと、まだ直していない 23 file が落ちるので、この行は一覧を書かない。代わりに直した 6 file の頭の字 //! の行の続きの直後に module の属性の行 #![deny(clippy::indexing_slicing)] を置き、直した file に添字が戻れば clippy が落ちるようにする（属性は module とその下の item に効く）。sha256.rs は歯 tests/anchor.rs・floor_cases.rs・init.rs が #[path] で取り込むので、その歯の crate の中の module にも同じ属性が効く（添字は無いので緑）。歯の中（#[cfg(test)] の下と #[test] の fn）は根の clippy.toml の allow-indexing-slicing-in-tests が今までどおり外す。行 k-lint-folio-idx-b が一覧に lint を足す時に、6 file の属性と歯 klintf_idx_module_deny と一覧 IDX_DONE を外す。

      直しの決め（共通）。添字と範囲の切り出しを、iterator（zip・skip・take・take_while・enumerate・peekable の next_if）と、Option を返す get と get_mut・split_first・split_at_checked・配列と slice の pattern に替える。範囲の内が前の条件で決まっていた所は、同じ条件を Option の形で読むだけで、判定と出力の字は変えない（folio の歯の全部が緑）。範囲の外の位置で panic していた所（ふだん通らない道）は、何もしないか None を返す形にした（floor.rs の block_item・graph.rs の cut と meta_id・ceiling_src.rs の観点の読む節の集め）。unwrap・expect・panic・unreachable は足さない。関数の形（引数と戻り）は、graph.rs の private な Index の node・edge・field の 3 つの fn の種類の引数だけを替える。

      直し（file ごと）。sha256.rs（16）は、語の列 W を組む所を新しい fn schedule にし、直前の 16 語の窓 [u32; 16] を配列の pattern で 16 語前・15 語前・7 語前・2 語前に割り、rotate_left と定数の位置 15 への書きで回す（定数の位置の添字は clippy が数えない）。fn compress は定数 K と W を zip で読み、fn digest の末尾の詰め（残り・0x80・0 の詰め・bit の長さの 8 byte）は iterator を chain で並べて 128 byte の配列へ zip で書き、as_chunks の 64 byte の block を 1 つか 2 つ撃つ。vocab.rs（13）は、英字の語の fn words を chars の peekable と next_if で伸ばして末尾の字 - と字 . を trim_end_matches で落とし、台帳 id の形の fn is_ledger_id を as_bytes の slice の pattern（頭の 3 字と 4 字以上）で読み、括弧の中身の fn glosses を slice の split_first で進めて、次の括弧で割る新しい fn next_bracket（position と split_at_checked）で開きと閉じを読む。parts.rs（14）は、面のタグの fn scan_tags と様式の class の fn css_classes の while の添字の読みを get にし、字が続く限り進める 7 か所を新しい fn run_end（from から述語に合う字の数を足した位置・b の外なら from のまま）にする。ceiling_src.rs（13）は、観点の読む最上位の節を集める所を、doc の組が無ければ足してから iter_mut の find で読む形にし、節で切る fn cut_sections の行の持ち主を、行を 1 度だけ zip で読み、節の後の注釈と空行の連なりの数を持って、次の節の頭で次の節へ、節でない行か file の末で直前の節へ寄せる形にする（規則 3 の字のまま）。節を残すかは keep の get で読む closure kept_section にする。floor.rs（18）は、id の形を取る fn ids_in の位置 i の字を get で読み、数の続きと切り出しを skip と take の closure（digits と span）にし、括弧ごとに落とす fn drop_marked_items の閉じを get と enumerate の find_map で探して中を get で切り、一覧の項の fn block_item の最初の行を get_mut で書き換え、名つきの導出 fn derive_for の表でない床の行を match の腕で組む。graph.rs（40）は、節点の種類と辺の型を、閉じた一覧 NODE_KINDS と EDGE_TYPES の定数の位置の字のまま渡し（Index の node・edge・field の引数を位置の数から字 &'static str に替え、表 RELATIONS・SRS_SECTIONS・SRS_FIELDS の欄も同じ字にする・定数の位置の添字は組み立ての時に範囲を見る）、block の終わりの fn block_end を skip と take_while に、引用符を跳ばす fn skip_quoted と流れの形の fn drop_pairs と fn flow_value を get と ends_with と strip_prefix に、行の逐語の Scan の fn file と fn note を get にし、節点 1 つの fn cut は行の番号の列を peekable の next_if で読んで持ち主の印を新しい fn mark（範囲の外は何もしない）で書き、末尾の空行を Vec の pop_if で落とす。meta の id の fn meta_id は get の範囲で切る。

