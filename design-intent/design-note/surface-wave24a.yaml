  note: ノート surface-wave23b（32 行の全部が着地・規則の行 R-32 の上限）の続き。承認は発効した計画 surface-plan の持ち主の裁定（t3-hub.56:20260927T2259Z-1）を継ぐ。第 0.1 版（2026-09-30）は目的と空の契約表だけを置いた（行は起草の後に足す）。 第 0.2 版（2026-09-30）は、1 行目 e-reason-id（境界の crate の server・S・depends は空）と 3 節を足した（起草 w46a の字を、席が main ea06f7a3 に当てた）。計画だけの行ではないので規則の行 R-33 は書かない。第 0.3 版（2026-09-30）は、2 行目 k-tz-entry（folio の lib の入口と tz の 11 の口と索引の graph・M）と 3 行目 k-tz-parity（口ごとの tz と folio の一致の歯・受入 AC14・S）と 4 節と 5 節を足した。計画 surface-plan の 9 節の計画だけの行 k-parity を割った行で、残りの行（folio の歯の tz への移しと binary の退役・inject と serve の退役・索引の読みの既定）は後に足す。起草 w42a が main 922314b0 の写しで試作し、変異を当てて歯が落ちることを見た。

sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      持ち込んだ folio を tsuzuri の 1 つの binary tz の下に入れ（要件 FR17・受入 AC14・判断の記録 ADR-8・計画だけの行 k-parity を割った行）、持ち込んだ code に tsuzuri の規則（R-4・R-10）を当て、持ち込んだ木の中の床を見張る。あわせて、面の server の軽さ（規則の行 R-34・判断の記録 ADR-23 の撤退の条件）とメモリ（RSS）の直しの行を置く。

      1 行目 e-reason-id（境界の crate の server の ruling と batch・歯 rsid）は、面の server が問いを閉じる理由と開き直す理由を、裁定 id の後ろを半角の空白 1 つで区切る形（裁定 <id> 束 <束の id>・裁定 <id> 取り消す = <前の id>）にする。器の close の理由の読み手は空白で割った 2 語目だけを裁定 id と読むので、今の形（id の直後に字 ・）では裁定 id が値の形の外に落ちる（器の席の答え 2026-09-30）。器の局面の出力の切り替えより前に着地させる。
