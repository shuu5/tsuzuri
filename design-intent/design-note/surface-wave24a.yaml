    type: prose
    title: 行 k-tz-drop — folio の口 inject と serve を退役させる
    body: |
      在りかは行 k-tz-entry（2 行目・4 節・着地は main db4ea60e）と行 k-lint-folio-tests（8 行目・10 節）の着地の後の木。folio の歯の crate の根は頭の //! の行の続きの直後の行に #![cfg(test)] を持ち、移す歯の file tests/inject.rs と tests/serve.rs の頭にも在る（移す先でもそのまま）。起草 w42a が main 214118b4 に行 k-tz-entry の差分を重ねた写しで試作し、着地の main db4ea60e の写しに当て直した（どちらの写しにも行 k-lint-folio-tests の #![cfg(test)] は無い）。書く file は write-set の 16 で、持ち込んだ folio の crate（folio2/crates/folio）と退役の置き場 folio2/retired/ と xtask の歯 tests/retire.rs だけ（境界は書かない）。

      なぜ。要件 FR17 は inject を tz に持たず、serve の要否を面の便で決めるとした。判断の記録 ADR-8 の決定 (4) は inject を tz inject として残さない。決定 (5)（ADR-8.yaml の 16 行目）は serve の要否を面の便で見て、要らなければ退役する（可逆）とし、決めを面の便（席）に預けている。持ち主に問うのは ADR-8 の撤退の条件（同 35〜37 行目・面の便で inject か serve の代わりが要ると分かったら、口を tz に足すかを問う）だけで、この行はその条件に当たらないので問いを出さない。席の測り（2026-09-30）では、席の道具で folio serve を撃つ所は 0（設計の commit の門は folio の schema・check・derive・build の 4 つを撃ち、画面の server の起こし直しと測りの script が撃つのは tz surface serve）で、持ち主の読む設計の頁は folio build の出力の dir を tailnet-serve が配る。行 k-tz-entry の後、tz の 11 の口（境界の cli の folio の NAMES）と索引の旗の tz graph は folio の lib の入口 folio::entry::run を撃ち、inject と serve は tz の知らない subcommand で断る。folio の lib にはまだ 2 つの口が残り、folio の binary（後の行 k-tz-tests で退役させる）からだけ撃てる。folio の歯を tz へ移す行 k-tz-tests の前に、tz に無い 2 つの口を lib から退役させる（移す歯が撃てない口を持たないように）。

      退役の形。憲法の条 N-1.2（退役は可逆な移動としてのみ行う）と、計画 surface-plan の判断の表の行 d47（裁定 t3-hub.67.45:20260930T0040Z-1・folio2 の repo だけの設定の file 11 本を folio2/retired/ の下へ git の移動で退役させた）の前例に合わせ、folio の src/inject.rs・src/serve.rs・tests/inject.rs・tests/serve.rs を消さずに git の移動（git mv）で folio2/retired/ の下へ移す。置き方は前例と同じく folio2/ からの相対の path をそのまま写す（folio2/crates/folio/src/serve.rs は folio2/retired/crates/folio/src/serve.rs に移し、ほかの 3 本も同じ形）。file の名は替えない。前例で名を替えたのは道具が名で探す CLAUDE.md・.vessel・rust-toolchain.toml・.gitignore だけで、cargo は package の外の .rs を拾わない（根の workspace の members は folio2/crates/folio を名指し、folio2/retired/ の下に Cargo.toml は無い）。write-set は移す元を ~（着地で消える file）、移す先を +（新しい file）で書く（前例の行 t-carry-retire と同じ。器の write-set の - は着地の後も残る縮む file の印なので、移す元には使わない）。xtask の歯 tests/retire.rs の移した対の一覧 MOVED（前からの 11 対）の後ろに 4 対（元は folio2/crates/folio/ の下・先は folio2/retired/crates/folio/ の下・src の inject.rs と serve.rs、tests の inject.rs と serve.rs の順）を足して 15 対にし、MOVED の doc の数と f2ret_files_moved_to_retired の断りの字の数を 15 にし、doc に行 k-tz-drop の 1 行を足す（この歯は folio2/retired/ の下の file が MOVED の移した先だけであることを見るので、足さないと落ちる）。

      戻す道と代わり。口を戻すなら、folio2/retired/crates/folio/ の下の 4 本を git の移動で元の path へ戻し、この行の entry.rs・lib.rs と歯の直しを git の履歴から戻す。それまでの間も、席の置き場の pin 留めの folio の binary と folio2 の元の repo は 2 つの口を持ったまま撃てる。頁の配信の代わりは tailnet-serve start --dir <頁の dir>（tailnet の住所を自分で解き、loopback も通す）。

      形（inject の分）。folio の src/entry.rs の enum Command の変種 Inject（doc の 1 行と、旗の組 mode の属性の 1 行と、旗 5 つ）と、fn dispatch の腕 Command::Inject（終わりは code(outcome.verdict)）を消し、use crate の括り書きの行 init, inject, mentions, parts, から inject を外す。src/lib.rs の module の宣言の行 mod inject を消し、src/inject.rs（CLAUDE.md の生成区間の注入）と歯 tests/inject.rs を退役の置き場へ移す。歯 tests/init.rs の f152_the_skeleton_runs_every_command_without_hand_edits から、注入の段（便 159・CLAUDE.md を置かずに inject --write と --check を撃ち、生成区間の印と条の id を見る 17 行と空の行）を消す（ほかの口の段は変えない）。

      形（serve の分）。enum Command の変種 Serve（doc の 1 行と旗 3 つ）と腕 Command::Serve を消し、use の括り書きから serve を外す。src/lib.rs の行 mod serve を消し、src/serve.rs（loopback と tailnet の配信）と歯 tests/serve.rs を退役の置き場へ移す。歯 tests/help.rs の f192_serve_help_names_loopback_and_the_tailnet（49 行目から）を消し、f192_the_command_list_carries_the_same_texts の口の列（73 行目の face・check・serve）を face と check の 2 つにし、module の doc の 3 番の字を退役の 1 行にする。

      形（共通）。src/entry.rs の module の doc の 1 行目から字 と便 2 の `folio inject` を外し、2 行目の字 ほかを持つ。 の後に 2 つの口の退役の 1 文を足す（2 行目の続きの字は次の行へ送る）。use crate の括り書きは入れ子の括り（phase の After と Flag）を持つので、名を外すのは inject と serve の 2 語だけにし、行の形は変えない（folio の file に rustfmt を掛けない）。歯 tests/check.rs の p1_commands_closed_list の閉じた一覧 CLOSED（742 行目からの 14 の字）を 12（check・parts・face・figure・build・derive・intake・hello・ceiling・schema・graph・init）にし、doc に退役の 1 行を足す。歯 tests/modules.rs の層の表 LAYERS から inject（層 3）と serve（層 5）の 2 行を消す（層が上がる辺の凍結した一覧には 2 つの口の対が無い）。clap の知らない subcommand の断りの字は、標準エラーの 1 行目の字 error: unrecognized subcommand と、単引用符で囲んだ口の名（例 'inject'）の並び。folio の --help の命令の一覧で見る古い字 4 つは、見本 3 面・本便で生成器を持つのは・design-intent の正本 7 file の形を検査し・tailnet の内側だけで見せる。

      新しい歯 fdrop。folio の package の歯 tests/fdrop.rs（頭の //! の行の続きの直後の行に #![cfg(test)] を 1 つ・空の行を挟まない・行 k-lint-folio-tests の歯 klintf_test_roots_cfg_test が見る形）は、folio の binary を撃たず、lib の入口 folio::entry::run を歯の process の中で撃つ（書き先は Vec・頭の命令の名は folio）。そのため行 k-tz-tests が folio の binary を退役させても folio の package に残る。歯 fdrop_no_inject と fdrop_no_serve は口ごとに 1 本で、退役の置き場は crate の dir から ../../retired/crates/folio で引く。

      床の見張り。持ち込んだ木の置き場 folio2/design-intent の床は、folio の歯 check_canonical_design_intent_passes（tests/check.rs）がその場で撃って見張る（計画 surface-plan 第 1.17 版の 6 節）。この行は tests/check.rs を書くので、この歯を verify に置き、done に写しでなくその場を撃つことと終了 code 0 を書く。この行は folio2/design-intent の字を替えず、folio の口 check は憲法の条の mechanism を型の値としてだけ読む（folio の src の check.rs の 223 行目の live の読みと 878 行目の欄の型の照らし）ので、inject と serve を名指す条が残ってもこの歯は落ちない（試作の xtask の check で緑）。

      器の入れ子の crate の穴。器は repo の根の直下の crates/ だけを source の根と見るので、この行の file は器の受付の余地の検査と閉包と検出線から外れる（器の設定の crate-roots の直しの着地まで）。write-set には構造の連鎖（enum の変種と振り分けの腕を持つ entry.rs・module の宣言を持つ lib.rs・移す src の 2 つと歯の 2 つとその移す先・口を撃つ歯と口の名を並べる歯の全部・移した対を並べる xtask の歯）を grep で全部書いた（folio の src で inject と serve の module を名指すのは entry.rs と lib.rs だけ・歯で口 inject と serve を撃つか並べるのは inject.rs・serve.rs・init.rs・help.rs・check.rs・modules.rs だけ）。verify の行は -p folio と -p xtask を名指す。この行は folio の src の file を縮めるだけで（着地の main db4ea60e の写しの試作で、entry.rs は 762 行から 705 行・lib.rs は 65 行から 63 行になり、src の file は 63 から 61 に減って合計は 34,028 行から 33,224 行になる）、1 file 1500 行の上限と crate の合計を増やさない（growth 0）。着地の後の木で wc -l を撃ち直す。xtask の tests/retire.rs は 17 行増える。根の crate を書く行と並べてよい理由と着地の後の手は、下の流す時と順の段。

      試作と噛み。main 214118b4 に行 k-tz-entry の差分を重ね、この行と行 k-tz-self を当てた木で撃ち、変異 12（inject を口 init の別名で戻す・歯の file tests/inject.rs を元の path に戻す・serve を別名で戻す・src/serve.rs を元の path に戻す・口 init の名を替える・置き場 folio2/design-intent の規則の表に知らない節を足す・口 schema が 1 を返す・命令の説明に古い字・層の表に serve を戻す・歯の名に filter の語・退役の置き場の src/serve.rs を消す・退役の置き場の tests/inject.rs を消す）で、done の各歯が少なくとも 1 つの変異で落ちた（噛みの log は起草の係の dir の bite2.log と results2.json）。着地の main db4ea60e の写しに行 k-tz-parity と k-tz-self と一緒に当て直した時にぶつかったのは entry.rs の 3 か所（module の doc の 1〜2 行目の字・use crate の括り書きが入れ子の括りを持つ形・腕 Command::Inject と Command::Serve の終わりが fn code を呼ぶ形）で、形の段の字をそれに合わせた（歯の file の字は替えない）。書く file は write-set の 16 で閉じる。diff は git の移動を見つける形（git diff の既定）で 24,349 byte、見つけない形（--no-renames）で 159,441 byte。器の gate は git diff <範囲> を撃ち（git の既定で移動を見つける・移した path は畳む）、lens に渡る diff は前の数で、上限 150,000 byte の内。xtask の check（分けない全部）は rc 0（歯 2,927 本）。verify の nextest の行は緑（fdrop_ 3・p1_commands_closed_list 1・check_canonical_design_intent_passes 1・f152_ 3・f192_ 4・p106_ 2・f2ret_ 3 本）。歯の file の字は替わらないので、変異は撃ち直さない。

      filter の語。新しい接頭辞 fdrop_ と、使う folio の歯の名 p1_commands_closed_list・check_canonical_design_intent_passes と接頭辞 f152_・f192_・p106_ は、下の一覧の 331 語のどれとも、どちらの向きの部分の字としても重ならない（同じ字の語を除く・歯の名は inject_ を含む名を避けた）。f2ret_ は着地済みの語。

      filter の語の一覧（main 7ea3a2d3 の契約表の verify の最後の字・331 語・空白で区切る）。歯 fdrop_own_names_clean と、行 k-tz-self の歯 tzself_own_names_clean は、この一覧を歯の file の const に字のまま写し、語の数 331 を断言してから照らす（着地済みの歯 stcli_own_names_clean と同じ形）。一覧は次のとおり。 aaround_ aaround_src_ask_fold_embeds abss_ abst_ accept_ acchold_ account_ acctcore_ acctcore_pure_and_no_new_dependencies acctdoc_ acctframe_ accthb_ accthome_ acctled_ acctlook_ acctpcore_ acctproj_ acctsess_ acctwin_ acctwire_ acctwire_back_part_before_header acctwire_back_steps aface_ afocus_ afocus_src_links_and_scroll alean_ aord_ aown_ apark_ apop_ areread_ askcard_ askcard_page_frame_and_nav athr_ batchpanel_ batchpanel_page_frame_two_columns bhalf_ board_min_ bport_ brand_ brand_path_written_once_in_contract btuck_ cadl_ cadopt_ cadq_ cdorm_ cexcl_ cfsplit_ cg9_ cgdom_ cishard_ cmark_ cnote_ cnret_ contract_form_ cround_ csled_ cspk_ ctick_ cupd_ cupdlist_ denv_ dnedge_ dngrp_ dnrow_ dnskip_ dretry_ dstg_ ecache_ ecache_handle_wiring_text eheld_acct_ eheld_design_ eheld_held_ eheld_marks_ eheld_vessel_ elazy_ epolq_ eretry_ esig_ evkind_ f123_ f159_ f212_ f2ret_ fdlt_ fdlv_ flight_ fmark_ fprem_ frame_ frame_home_blocks_in_order_and_map_page frame_one_module_per_block fserve_ fstop_ fstop_usage_errors_are_one fundl_ fxpre_ g3g7_ gacct_ gapspage_ gapspage_page_frame_and_nav gatt_ gbnote_ gchip_ gcoach_ gext_ gfix_ gfresh_ gfresh_boards_text ghb_ gins_ gjst_ glabel_ gmret_ gmretw_ gnav_ gpface_ gpill_ gpulse_ gpulse_boards_text gquestion_ graph_ gsum_ gtuck_ gview_ gwv_ hacols_ harest_ hasplit_ hbconf_ hbconf_config_moves_to_config_rs hbconf_main_parse_fills_the_rest_with_new hbmark_ hbon_ hbpost_ hbpost_mod_rs_drops_post_fns hbproc_ hbroute_ hbroute_mod_rs_keeps_only_events hcard_ hcled_ hcnx_ hcproj_ hcsess_ hdchip_ hfig_ hnunk_ hook_ hruling_ hsblock_ hsblock_dispatch_by_list hsblock_ids_match_consts hsblock_kit_holds_shared hsderive_ hsderive_consts_match_note hshist_ hspage_ hspage_snaps_match_files hspk_ hsym_ hthr_ http_ hwstore_ i