  - n: 3
    type: prose
    title: 行 e-reason-id — 問いを閉じる理由の裁定 id の後ろを半角の空白で区切る
    body: |
      在りかの main は ea06f7a3（起草の main 4ad0b18f から、この行が書く file を確かめてから当てる）。書く file は境界の crate の server の ruling.rs と batch.rs と、新しい歯の file の rsid.rs と、着地済みの歯の file の server_batch.rs・bhalf.rs・rvk.rs（期待の argv の字だけ）。

      なぜ。器（scribe2）の席の答え（2026-09-30T05:1xZ）。器の close の理由の読み手（器の main 09197b21 の ledger/close_reason.rs の pub fn read）は、前後の空白を除き Unicode の空白で割った 1 語目を 9 つの頭と照らし、頭が 裁定 なら 2 語目だけを裁定 id の形（問い id の形 <問い id>:<年月日 T 時分 Z>-<n>・batch: の形・policy: の形）で読み、3 語目から後は読まない。tsuzuri の束の受付（batch.rs の fn accept）は問いを 裁定 <id>・束 <束の id> で閉じ、取り消し（ruling.rs の fn reopen）は問いを 裁定 <id>・取り消す = <前の id> で開き直す。空白で割ると 2 語目は id と字 ・ と次の語の頭をつないだ字になり、問い id の形の裁定 id は値の形の外に落ちる（数の欄が 1・束 のような字になる）。器が局面の出力（lifecycle.json・器の束 E の W4）へ切り替えた後に、tsuzuri が閉じた問いが misfit と判じられないように、器の読み手を変えずに解ける形へ直す（器の勧めの形）。

      形。ruling.rs に pub const REASON_HEAD（字 裁定）と pub fn reason（裁定 id と続きの字の Option を受け、続きが無ければ 裁定 <id>、在れば 裁定 <id> <続き>・区切りは半角の空白 1 つ）を置き、1 問の裁定の close（fn accept）・取り消しの開き直し（fn reopen・続きは 取り消す = <前の id>）・束の close（batch.rs の fn accept・続きは 束 <束の id>）の 3 か所の理由をこの fn で組む。新しく書く理由は 裁定 <id>・裁定 <id> 束 <束の id>・裁定 <id> 取り消す = <前の id> の 3 形で、1 問の形の字は今と同じ。続きの字（束 の語と束の id・取り消す = と前の id）は今のまま残す（器の読み手は読まないが、台帳を人が読む時の手がかり）。notes の定型行（裁定 id = <id>・問い = … の形と、その欄の終わりの字 ・）は変えない。

      前の形の読み。tsuzuri の中で close の理由を読むのは、中核の graph の check の fn landed（頭が landed か 着地 の理由だけを着地と読む）と、中核の pipeline の fn closed_reason（閉じた契約 bead の札の段の理由の字・空白の続きを 1 つに畳んだ頭の字）の 2 つだけで、どちらも裁定 id を引かない。効いている裁定と取り消しの判じ（契約の crate の surface の pub fn latest_ruling・pending_reopen・revocable）と配達（中核の delivery）と導出グラフの裁定の節点は、問いの notes の定型行だけを読み、close の理由を読まない。そのため、前の形で閉じた台帳の行（起草の時の台帳の export の写し .beads/issues.jsonl で、閉じた問いの理由は束の形 47 本・1 問の形 32 本）も今どおり読め、取り消しも同じに受ける（歯 rsid_old_form_revokes）。台帳の前の行は書き換えない。

      今の字（main 4ad0b18f）。ruling.rs の fn accept は理由を format! の字 裁定 {id} で、fn reopen は format! の字 裁定 {id}{ID_END}{REVOKES}{} と req.ruling で、batch.rs の fn accept は format! の字 裁定 {id}{ID_END}束 {batch} で組む（ID_END はどちらの file も字 ・ の const）。着地済みの歯は、server_batch の fn row_argvs が 裁定 {ruling}・束 {batch} を、bhalf の fn row_argvs が 裁定 {ruling}・束 {batch_id} を、rvk の fn reopen_argv が 裁定 {id}・取り消す = {revokes} を期待の argv に組み、この行で字 ・ を半角の空白に書き換える。rvk の rvk_reopen_argv_and_wire と契約の crate の cform_ledger と snapshot の ledger.json は、LedgerWrite の argv と電文の形を字の見本で見るだけで server の理由を見ないので、前の形の見本のまま変えない。1 問の close を見る server_ask と eretry の期待の字 裁定 {id} は変わらない（server_ask_ruling_writes_twice と eretry_read_retries_then_writes は、1 問の理由の字が変わる変異で落ちる）。server_batch の fn row_argvs を使う歯のうち server_batch_id_counts_up_in_same_minute と server_batch_own_verbatim_or_batch_verbatim は notes の追記の argv だけを比べ、close の理由を見ない。着地済みの歯 dretry_spawns_use_pace と fserve_words_and_deliver は ruling.rs と batch.rs の字を読むが、この行の字（reason と REASON_HEAD）は数えない。

      器の読み手での確かめ。器の main 3908279b（close の理由の読み手と、それが引く is_bead_id と epoch_of は 09197b21 から変わっていない）の close_reason.rs を起草の場の外の一時の crate に写し、台帳の接頭辞 t3 で掛けた。新しい 3 形（裁定 t3-hub.59.28:20260930T0215Z-1・同じ id に 束 batch:20260930T0215Z-1 を続けた形・別の id に 取り消す = <前の id> を続けた形）は Form::Ruling でそれぞれの id を返し、前の束と取り消しの形は Defect::Value(Head::Ruling) を返した。写した読み手の in-file の歯 7 本も緑。器の file は書いていない。

      決めた幅（起草の決め）。(a) 区切りは器の勧めの半角の空白 1 つ（器の読み手は全角の空白でも割るが、勧めの字に揃える）。(b) 理由を組むのは ruling.rs の 1 fn に寄せ、batch.rs はそれを呼ぶ（束の close の理由の頭と区切りを 2 か所に書かない）。(c) 方針の受付（policy.rs の fn accept）が方針の問いを閉じる理由 方針 <id> は、器の 9 つの頭の外（器の読み手は Defect::UnknownHead）だが、器の席の答えが名指しておらず、頭を 裁定 にすると方針を承認として数えない決まり（要件 FR8）と食い違いうるので、この行では変えない（範囲の外）。

      試作と噛み（起草 w46a）。main 4ad0b18f の写しにこの行を当てた木で撃った。書く file は write-set の書く file の 6 で閉じる（試作の diff 23,578 byte・足し 417 行・消し 10 行・src の増えは ruling.rs が 13 行・batch.rs が 0 行）。xtask の check は rc 0（歯 2,934 本）。変異 8（理由の区切りを字 ・ にする・束の close を前の字の形に戻す・取り消しの開き直しを前の字の形に戻す・続きの無い理由の末に空白を足す・理由の頭を別の字にする・束の close が束の id を落とす・1 問の close が理由を自前で組む・歯の file に filter の語を含む歯を足す）で、done の各歯が少なくとも 1 つの変異で落ちた。

      filter の語。新しい接頭辞 rsid_ は、main 4ad0b18f の contracts の verify の filter の語（322 語・畳んで 247 語）のどれとも部分の字として重ならず、どの filter の語も rsid_ を含まない。

      流す時と順。depends は空。器の局面の出力の切り替え（器の束 E の W4）より前に着地させる。この行の後に同じ ruling.rs か batch.rs を書く行は、この行の着地の後に当て直す。

      範囲の外。方針の問いを閉じる理由（policy.rs の 方針 <id>・器の席に頭を照らしてから別の行で決める）。台帳に在る前の形の理由の書き換え。器の読み手の変更。notes の定型行の形。

