  note: 'ノート surface-wave23b（32 行の全部が着地・規則の行 R-32 の上限）の続き。承認は発効した計画 surface-plan の持ち主の裁定（t3-hub.56:20260927T2259Z-1）を継ぐ。第 0.1 版（2026-09-30）は目的と空の契約表だけを置いた（行は起草の後に足す）。 第 0.2 版（2026-09-30）は、1 行目 e-reason-id（境界の crate の server・S・depends は空）と 3 節を足した（起草 w46a の字を、席が main ea06f7a3 に当てた）。計画だけの行ではないので規則の行 R-33 は書かない。第 0.3 版（2026-09-30）は、2 行目 k-tz-entry（folio の lib の入口と tz の 11 の口と索引の graph・M）と 3 行目 k-tz-parity（口ごとの tz と folio の一致の歯・受入 AC14・S）と 4 節と 5 節を足した。計画 surface-plan の 9 節の計画だけの行 k-parity を割った行で、残りの行（folio の歯の tz への移しと binary の退役・inject と serve の退役・索引の読みの既定）は後に足す。起草 w42a が main 922314b0 の写しで試作し、変異を当てて歯が落ちることを見た。 第 0.4 版（2026-09-30）は、2 行目 k-tz-entry の depends を空にし 4 節の流す順の字を直した（1 行目 e-reason-id との重なりは、tz 化を先に進めるため k-tz-entry を先に流し e-reason-id を後にする・e-reason-id の depends は、その行の直しの版で置く）。 第 0.5 版（2026-09-30）は、4〜6 行目（k-lint-base〔根の Cargo.toml の workspace の lint の表と clippy.toml と member の manifest と xtask の歯 klint・M〕・k-lint-tests-face〔面の crate の統合の歯の crate の根の cfg(test) の属性・M・depends は k-lint-base〕・k-lint-tests〔残りの根と表の unwrap_used と panic・M・depends は k-lint-tests-face〕）と 6〜8 節を足した。持ち込んだ folio に規則の行 R-10 と R-4 を当てる段（計画 surface-plan の 6 節の後の行 k-lint-folio と k-size-folio の前）で、tsuzuri の全体に規則の行 R-10 の lint の機構を置く最初の 3 行。規則の行 R-4 の数えの段の行は、R-4 の数える範囲の持ち主の答えの後に置く。計画だけの行ではないので規則の行 R-33 は書かない。起草 w43a が main 4ad0b18f の写しで試作し、main 214118b4 に当てた。 第 0.6 版（2026-09-30）は、1 行目 e-reason-id の title・req・write-set・verify・done・depends と 3 節を直した（器の席の 2 つ目の答えで、方針の問いの閉じを器の頭を足さない 裁定 policy:<方針の id> の形にする。policy.rs と歯 epolq を write-set に、要件 FR8 を req に足し、方針を承認に数えないことを測る歯を足した。depends は第 0.4 版の席の決めどおり k-tz-entry にし、節の流す時と順と在りかの main の字をそれに合わせた）。大きさは変えない（起草 w46a の字を、席が main 09d898f6 に当てた）。 第 0.7 版（2026-09-30）は、7 行目 m-big-copies（account board の読みが state dir ごとの event log を印が動いた時だけ読み、台帳と event log の字を要求をまたいで写さずに分け合う・server の使う記憶の量〔RSS〕の直し・判断の記録 ADR-23 の後の残り・中核の account と境界の acct と台帳の読み・M）と 9 節を足した。起草は main 4ad0b18f の写しで行い、試作で歯を撃ち、直しを戻して歯が落ちることを見た。 第 0.8 版（2026-09-30）は、行 k-tz-entry・k-tz-parity・e-reason-id の歯 tzent_own_names_clean・tzpar_own_names_clean・rsid_own_names_clean が照らす filter の語の一覧を 4 節と 3 節に字で置き、3 行の done に、歯の file がその一覧を字のまま持ち語の数を断言することを足した（便 t3-hub.52.146 の審査が、歯が 14 語しか照らさず done の 325 語を測らないとして FAIL にした・一覧が節に無く便が語を集められなかった）。 第 0.9 版（2026-09-30）は、行 k-tz-entry と k-tz-parity の節の #![cfg(test)] の置き方に、頭の説明の行の続きのすぐ次の行に置き間に空の行を挟まないことを足した（行 k-lint-tests の歯が見る形・起草 w42a の見つけ）。 第 0.10 版（2026-09-30）は、8 行目 k-lint-folio-tests〔持ち込んだ folio の統合の歯の crate の根の cfg(test) の属性と、xtask の新しい歯の file klintf.rs・M・depends は k-tz-entry〕と 10 節を足した。除外の表の R-10 の行を消す行 k-lint-folio の前の最初の行で、lint の表の行 k-lint-base〜k-lint-tests を待たず、tz 化の鎖の行 k-tz-drop の前に置く。計画だけの行ではないので規則の行 R-33 は書かない。起草 w43b が main 7ea3a2d3 の写しで試作し、main 044cd9f9 に当てた。第 0.11 版（2026-09-30）は、9 行目 k-tz-drop（folio の口 inject と serve の退役・folio2/retired/ への git の移動・M）と 10 行目 k-tz-self（設計の索引の読みの既定を tz 自身に・S）と 11 節と 12 節を足した。計画 surface-plan の 9 節の計画だけの行 k-parity を割った行の 3 つ目と 4 つ目で、残りの k-tz-tests（folio の歯の tz への移しと folio の binary の退役）は後に足す。起草 w42a が main 214118b4 の写しに行 k-tz-entry の差分を重ねて試作し、変異を当てて歯が落ちることを見て、main 044cd9f9 に当てた。 第 0.12 版（2026-09-30）は、行 k-tz-entry の done (1)(4)(5) の usage の行の字を clap 4 の現物の形（Usage の直後にコロン）に直し、4 節に usage の行の字を置いた（便 t3-hub.52.146 の 2 度目の審査が literal-mismatch で FAIL にした）。 第 0.13 版（2026-09-30）は、11 行目 k-size-base〔xtask の check の大きさの数えの段・M・depends は空〕と 13 節を足した。規則の行 R-4 の数える範囲は持ち主の裁定 t3-hub.67.47:20260930T0626Z-1（案 A・本体の置き場 src だけ）と判断の記録 ADR-25 で決まり、同じ commit で R-4 の数える対象の欄に字を足した。計画だけの行ではないので規則の行 R-33 は書かない。起草 w43a が main 4ad0b18f の写しで試作し、起草 w43b が main 44f7f5e0 の写しで直して撃ち直し、main f2574fb9 に当てた。 第 0.14 版（2026-09-30）は、12 行目 k-lint-folio-deny〔持ち込んだ folio の lib と binary と build.rs の根の R-10 の lint の crate の属性と、添字の外の違反の直し・M・depends は k-lint-folio-tests と k-tz-drop〕と 14 節を足した。除外の表の R-10 の行を消す行 k-lint-folio の前の、folio の src の直しの最初の行で、添字は後の 2 行が直す。計画だけの行ではないので規則の行 R-33 は書かない。起草 w43b が main db4ea60e の写しで試作し、main db4ea60e に当てた。第 0.15 版（2026-09-30）は、行 k-tz-entry の着地（main db4ea60e）の字に合わせて、行 k-tz-parity・k-tz-drop・k-tz-self の節の在りかと試作と噛みと今の字の段を直し、k-tz-drop の形の段を着地の entry.rs の字に合わせた（契約表の行の字は替えない・起草 w42a が着地の写しに 3 行を当て直して撃った）。 第 0.16 版（2026-09-30）は、行 k-tz-self の write-set に verify で撃つだけの着地済みの歯 kcli.rs と hbconf.rs を、行 k-lint-folio-deny の write-set に verify の歯 modules.rs を、置き場だけの = で足した（器の受付が便 t3-hub.52.153 を teeth-outside-write-set で断った）。 第 0.17 版（2026-09-30）は、13 行目 k-lint-folio-idx-a〔持ち込んだ folio の src の 6 file の添字の 114 か所の直しと、6 file の頭の lint を deny にする module の属性・M・depends は k-lint-folio-tests と k-lint-folio-deny〕と 15 節を足した。除外の表の R-10 の行を消す行 k-lint-folio の前の、folio の添字の直しの 1 つ目の行で、残りの 23 file の 93 か所と lint の一覧への足しは後の行 k-lint-folio-idx-b が持つ。計画だけの行ではないので規則の行 R-33 は書かない。起草 w47a が main 19ff39fa の写しで試作し、main 77530015 に当てた。 第 0.18 版（2026-09-30）は、行 k-lint-tests の題の根の数を 139 から 140 にし、8 節の在りかと書く file と形と今の字を着地の後の main 3c614352 の木に合わせた（xtask の tests/ の 7 つ目の file klintf.rs は頭の行を既に持つので書かない・klint.rs は頭の行を持たないのでこの行が足す・境界の crate の 79 のうち着地した行の 5 つは既に持つ）。便 t3-hub.52.148 の審査が、節に klintf.rs の材料が無いと判じられなかった（section-material-missing）。done と write-set と verify は替えない。'

sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      持ち込んだ folio を tsuzuri の 1 つの binary tz の下に入れ（要件 FR17・受入 AC14・判断の記録 ADR-8・計画だけの行 k-parity を割った行）、持ち込んだ code に tsuzuri の規則（R-4・R-10）を当て、持ち込んだ木の中の床を見張る。あわせて、面の server の軽さ（規則の行 R-34・判断の記録 ADR-23 の撤退の条件）とメモリ（RSS）の直しの行を置く。

      1 行目 e-reason-id（境界の crate の server の ruling と batch・歯 rsid）は、面の server が問いを閉じる理由と開き直す理由を、裁定 id の後ろを半角の空白 1 つで区切る形（裁定 <id> 束 <束の id>・裁定 <id> 取り消す = <前の id>）にする。器の close の理由の読み手は空白で割った 2 語目だけを裁定 id と読むので、今の形（id の直後に字 ・）では裁定 id が値の形の外に落ちる（器の席の答え 2026-09-30）。器の局面の出力の切り替えより前に着地させる。
  - n: 2
    type: contract-table
    title: 契約表
    rows:
      - id: e-reason-id
        title: 面の server が問いを閉じる理由と開き直す理由を、裁定 id の後ろを半角の空白 1 つで区切る 裁定 <id> 束 <束の id> と 裁定 <id> 取り消す = <前の id> の形にし、方針の問いは 裁定 policy:<方針の id> で閉じて、器の close の理由の読み手が 2 語目を裁定 id と読めるようにする（方針は承認に数えないまま・境界の crate の server の ruling と batch と policy だけ）
        req: ["FR6", "FR7", "FR8"]
        section: "3"
        write-set: ["crates/tsuzuri-boundary/src/server/ruling.rs", "crates/tsuzuri-boundary/src/server/batch.rs", "crates/tsuzuri-boundary/src/server/policy.rs", "+crates/tsuzuri-boundary/tests/rsid.rs", "crates/tsuzuri-boundary/tests/server_batch.rs", "crates/tsuzuri-boundary/tests/bhalf.rs", "crates/tsuzuri-boundary/tests/rvk.rs", "crates/tsuzuri-boundary/tests/epolq.rs", "=crates/tsuzuri-boundary/tests/server_ask.rs", "=crates/tsuzuri-boundary/tests/eretry.rs", "=crates/tsuzuri-boundary/tests/dretry.rs", "=crates/tsuzuri-boundary/tests/fserve.rs", "=crates/tsuzuri-boundary/tests/aown.rs", "=crates/tsuzuri-boundary/tests/areread.rs"]
        verify: ["cargo nextest run -p tsuzuri-boundary --test rsid --no-tests=fail rsid_", "cargo nextest run -p tsuzuri-boundary --test server_batch --no-tests=fail server_batch_", "cargo nextest run -p tsuzuri-boundary --test bhalf --no-tests=fail bhalf_", "cargo nextest run -p tsuzuri-boundary --test rvk --no-tests=fail rvk_", "cargo nextest run -p tsuzuri-boundary --test epolq --no-tests=fail epolq_", "cargo nextest run -p tsuzuri-boundary --test server_ask --no-tests=fail server_ask_", "cargo nextest run -p tsuzuri-boundary --test eretry --no-tests=fail eretry_", "cargo nextest run -p tsuzuri-boundary --test dretry --no-tests=fail dretry_", "cargo nextest run -p tsuzuri-boundary --test fserve --no-tests=fail fserve_", "cargo nextest run -p tsuzuri-boundary --test aown --no-tests=fail aown_", "cargo nextest run -p tsuzuri-boundary --test areread --no-tests=fail areread_", "cargo run -q -p xtask -- check"]
        size: S
        done: (1) 境界の server の ruling の pub const REASON_HEAD は字 裁定 で、pub fn reason は、続きが None なら 裁定 fx-r.1:20260928T0441Z-1 を、続きが 束 batch:20260928T0441Z-1 なら 裁定 fx-r.1:20260928T0441Z-1 束 batch:20260928T0441Z-1 を、id fx-r.1:20260928T0441Z-2 で続きが 取り消す = fx-r.1:20260928T0441Z-1 なら 裁定 fx-r.1:20260928T0441Z-2 取り消す = fx-r.1:20260928T0441Z-1 を返し、3 つとも空白で割った 1 語目が 裁定 で 2 語目が渡した裁定 id そのもの。前の束と取り消しの形（id の直後に字 ・）は、2 語目が字 ・ を含み、どちらの id とも違う（歯 rsid_reason_forms） (2) 偽の bd と偽の bdw（配達の先は無し）で、受付の時刻 1790570490 に、1 問の裁定の受付 ruling の pub fn accept は Recorded（裁定 id fx-r.1:20260928T0441Z-1）を返して bdw を 2 回撃ち、2 回目の argv は close・fx-r.1・--reason=裁定 fx-r.1:20260928T0441Z-1 の 3 語。束の受付 batch の pub fn accept（問い fx-r.2 と fx-r.3）は束の id batch:20260928T0441Z-1 で bdw を 4 回撃ち、行ごとの結果は Written（裁定 id は <問い>:20260928T0441Z-1）で、行ごとの 2 回目の argv は close・問いの id・--reason=裁定 <行の裁定 id> 束 batch:20260928T0441Z-1 の 3 語。どの理由も空白で割った 2 語目が行の裁定 id（歯 rsid_writes_split_id） (3) 閉じた問い fx-r.4（close_reason は前の形 裁定 fx-r.4:20260928T0100Z-1・束 batch:20260928T0100Z-1）と fx-r.5（新しい形 裁定 fx-r.5:20260928T0100Z-1 束 batch:20260928T0100Z-1）のどちらでも、その裁定の取り消し ruling の pub fn revoke は Recorded（id は <問い>:20260928T0441Z-1・reopened_only は偽）を返し、bdw の 2 回目の argv は reopen・問いの id・--reason=裁定 <新しい id> 取り消す = <前の id> の 3 語で、理由の 2 語目は新しい id（歯 rsid_old_form_revokes） (4) ruling の pub const POLICY_MARK は字「policy:」で、pub fn policy_reason は id fx-r.9:20260928T0441Z-1 に 裁定 policy:fx-r.9:20260928T0441Z-1 を返す。作った id を fx-r.9 と出す偽の bdw で、方針の受付 policy の pub fn accept（範囲 all）は Recorded（方針の id fx-r.9:20260928T0441Z-1）を返して bdw を 3 回撃ち、1 回目は create で、3 回目の argv は close・fx-r.9・--reason=裁定 policy:fx-r.9:20260928T0441Z-1 の 3 語で、理由の 2 語目は字「policy:」と方針の id をつないだ字（歯 rsid_policy_close） (5) 閉じた方針の問い fx-r.9（label は intake:question と policy-scope:all・close_reason は 裁定 policy:fx-r.9:20260928T0441Z-1・notes は 方針 id = の行 1 本）と閉じた問い fx-r.1（close_reason は 裁定 fx-r.1:20260928T0441Z-1・notes は 裁定 id = の行 1 本）の台帳で、境界の台帳の読み parse_bd は fx-r.9 を方針の問い（is_policy が真）と、fx-r.1 を方針でない問いと読み、契約の surface の latest_ruling は fx-r.9 の notes に None を、fx-r.1 の notes にその裁定 id を返し、revocable は fx-r.9 の方針の id に偽を、fx-r.1 の裁定 id に真を返し、中核の delivery の undelivered は fx-r.1 の裁定 1 つだけを返す。2 つの理由の 2 語目は、方針の方だけが字「policy:」で始まる（歯 rsid_policy_not_ruling） (6) ruling.rs は字 reason(&id, を 2 度、batch.rs は字 reason(id, を 1 度、policy.rs は字 policy_reason(&id) を 1 度持ち、ruling.rs と batch.rs のどちらも字 {id}{ID_END}束 と字 {id}{ID_END}{REVOKES} を持たず、policy.rs は字 {TITLE} {id} を持たない（歯 rsid_src_text）。rsid.rs の歯の名は 7 本とも rsid_ で始まり、3 節の filter の語の一覧の 247 語（main 4ad0b18f の contracts の verify の filter の語を畳んだ字）のどれも部分の字として含まず、歯の file はその 247 語を字のまま持って数 247 を断言する（歯 rsid_own_names_clean） (7) 書き換えた着地済みの歯が通る（server_batch の fn row_argvs と bhalf の fn row_argvs が束の close の理由を 裁定 <行の裁定 id> 束 <束の id> で、rvk の fn reopen_argv が開き直しの理由を 裁定 <id> 取り消す = <前の id> で、epolq の fn three と epolq_all_writes_three が方針の close の理由を 裁定 policy:<方針の id> で組む・epolq_all_writes_three・epolq_scope_one・epolq_step_k_of_3・epolq_root_pick・epolq_refusals_write_nothing・server_batch_writes_rows_in_order・server_batch_write_failure_is_502_with_done_rows・bhalf_step_k_of_n・bhalf_resend_rest・rvk_writes_line_then_reopens・rvk_retry_reopens_only）。置き場だけの = の歯の全部も通る（xtask の check）
        depends: ["k-tz-entry"]

      - id: k-tz-entry
        title: folio の crate に lib の入口（引数の列と標準出力と標準エラーの書き先を受けて終了 code を返す）を置いて folio の binary はそれを撃つだけにし、tz の 11 の subcommand（check・schema・derive・ceiling・init・parts・face・figure・build・intake・hello）と索引の旗を持つ tz graph を同じ引数で入口へ渡す（inject と serve は渡さない・境界の直接依存に folio を足す・folio の src の main と新しい entry と lib・境界の cli の folio と main と mod と lib・境界の manifest と錠・xtask の骨組みの歯・新しい歯 tzent）
