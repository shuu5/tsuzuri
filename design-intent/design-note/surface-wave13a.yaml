      project board と account board が人に見せる時刻を全部日本時間にする面の crate の行 1 つ。
      時差は view の定数 1 つ（UTC に 9 時間を足す固定・browser の時間帯を読まない）に置き、時刻の字と日の境の決めは 1 つの純粋な関数を通す。
      字の印は Z と UTC から JST に替え、pipeline の Landed（今日）の今日と履歴の時刻の同じ日は日本の日で決め、稼働の記録の目盛は日本時間の時刻に置く。
      記録の id の中の UTC の字と電文の epoch 秒は変えない。中核と境界と契約の crate と外の依存は変えない。
