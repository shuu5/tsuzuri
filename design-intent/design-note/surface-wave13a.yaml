  - n: 3
    type: prose
    title: 行 g-jst — board が人に見せる時刻を日本時間にする
    body: |
      在りかの main は 54b8fad（計画 surface-plan は第 0.35 版・面の crate と fixture の字は 71a0780 と同じで、この節の字はその code の値・その後に着地した行 c-pipe-queue と e-idle は中核と境界の crate だけを書き、その後の 2 つの commit はノートと計画だけ）。
      なぜ。持ち主の裁定 t3-hub.52.28（裁定 id = t3-hub.52.28:20260928T0107Z-1・案 A・計画 surface-plan の 10 節の d13）は、面が人に見せる時刻を全部日本時間（UTC に 9 時間を足す固定）にし、字の印も JST にし、今日も日本の日にし、記録の id（裁定 id の中の UTC）は記録の鍵なので変えないと決めた（見本 mock v3 の UTC の表示を変える決め）。今の本番の 2 つの board は見本（docs/design/mock3 の ui.js の関数 hm と hmd は getUTCHours と字 Z・spanTicks は epoch の tick の倍数・acct.js の Landed の今日は toISOString の UTC の日）の写しのまま UTC で出し、持ち主は方針の欄の指示（2026-09-28）で同じ指摘を 2 度目にした。計画 surface-plan の 9 節の計画だけの行 g-jst（大きさ M・依存なし）を起草して置く。
      在りか・時刻の字を組む所（main の面の crate の src を grep で確かめた・2 つの board の全部）。字を組む関数は次の 5 つだけで、ほかの所は全部それを呼ぶ。src/view.rs（write-set・lib.rs の 23 行目 pub mod view;）の pub fn clock（epoch 秒を 86400 で割った日と余りの秒から字 2026-09-27 07:39:00 UTC の形・日は私的な fn civil_from_days）と pub fn clock_short（今との差が向きを問わず 20 時間以内なら字 12:53Z、越えれば UTC の月日と空白を前に足した字 09-26 12:53Z）。src/project/seat.rs（write-set）の pub fn hm（clock の字の 11 から 16 に字 Z・字 09:50Z）と pub fn hmd（at と now を 86400 で割った数が同じなら hm、違えば clock の字の 5 から 10 の月日と空白と hm）。src/project/askpage.rs（write-set）の pub fn ruling_text（server の形の id の UTC の時分を字 13:00Z の形で返す）。
      在りか・呼ぶ所（書かない file は字が変わらず、出す字が日本時間になる）。project board: src/board.rs の fn top の最終の記録（title に clock・chip に clock_short）、src/project/ask.rs の Outcome の line（字 記録した と裁定 id と字 · と clock）、src/project/seat.rs の top の since（hm）と hist の履歴の時刻（hmd）、src/project/ledger.rs の burn_card の出所（字 時点 と hm）と詳しくの月日（clock の字の 5 から 10）、src/seatpill.rs の card の種類（字 ◷ と hmd と字 から）。account board: src/account/board.rs の fn updated_chip（clock と clock_short）、src/account/home.rs の group_view の since（hmd）と acct_card の窓の戻る時刻（字 ↻ と hmd）と mv_row の移動の時刻（hmd）、src/account/projects.rs の nx_card と pcnt_card の出所（字 ◷ と hm）と led_card の出所（字 時点 と hm・account の ledger の表も使う）と orch_card の種類と grp_card の値（字 ◷ と hmd と字 から）、src/account/session.rs の run_card（字 ◷ と hmd と字 から）と axis_labels（seat の span_ticks）。経過の字（12m・3h・2d・秒）と戻るまでの字（seat の until）は時刻でない。節点の頁の run の時間軸（timeline.rs）と地図の頁は時刻を出さない。
      在りか・日の境と目盛。src/project/pipeline.rs（write-set）の pub fn landed_today は、段 Landed の札の今から経過を引いた時刻が、今を含む UTC の日の始まり（私的な const DAY の 86400 の倍数）以上なら真で、pub fn columns の Landed の列を今日の着地だけにする（行 g-pipe-today・文書の字は今日（UTC））。seat の hmd は UTC の日で同じ日を決める。seat の pub fn span_ticks は窓の始まりを tick で切り上げた epoch 秒（tick の倍数）から tick ごとに目盛を置き（6 を越えれば 1 つおき・92 を越える位置は落とす）、字は hm から trim_end_matches で字 Z を落とした字（24h の幅は UTC の 0・6・12・18 時）。view の clock_short は日でなく 20 時間で決める（見本の hmd と同じ）。
      在りか・変えない所。記録の id の中の UTC の字（境界の src/server/ruling.rs の pub fn minute が組む裁定 id の分・字 20260927T0739Z の形、run の id の時刻の札）と、それを読む面の timeline の run_bead と askpage の ruling_text の id の形の判じ、電文の時刻（契約の型の crate の EpochSecs の epoch 秒）、中核と境界と契約の crate。語の辞書の internal の字（裁定の id の形と run id の形の UTC の分と秒）は記録の id の形を言うので変えない。
