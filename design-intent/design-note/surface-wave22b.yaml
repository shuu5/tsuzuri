  - n: 3
    type: prose
    title: 席の「見て」の知らせを 2 つの board に出す（行 i-11）
    body: |
      在りか: 在りかの main は 2bfee06（計画 surface-plan v0.84）に、行 i-open-mark と i-10（ノート surface-wave21c・便 t3-hub.59.19 と t3-hub.59.20）と行 e-signal（ノート surface-wave21d・便 t3-hub.52.120）と行 g-ledger-group-kind（ノート surface-wave21b・便 t3-hub.52.119）の着地の後の字に書く。4 つの行が書く file（boundary/stage の cli.rs・mod.rs・notify.rs・server の events.rs・mod.rs・routes/nudge.rs・面の view.rs）の字はその着地の後の字で、ここに書く字はその上に足す字。契約の crate tsuzuri-contract の lib.rs の pub mod notice（新）と surface.rs、境界の crate tsuzuri-boundary の main.rs と lib.rs の pub mod server の config.rs・mod.rs・routes/notices.rs（新）と pub mod stage の notify.rs、面の crate tsuzuri-surface の project/notice.rs（新・build.rs が src/project の file から pub mod notice と列挙 Module の変種 Notice を生成する）・account/mod.rs・account/board.rs・account/notices.rs（新）・pages/home.rs・view.rs・vocab.json。crate の外からは tsuzuri_contract::notice・tsuzuri_boundary::stage::notify・tsuzuri_surface::project::notice・tsuzuri_surface::account::notices。

      なぜ: 持ち主の裁定 t3-hub.59.5 で、席の「見て」は窓を前に出さず知らせだけを出す。行 i-10 の tz stage notify は表示先の端末へ notify-send の知らせを撃つが、端末に届かない時も、持ち主が端末の知らせを見逃した時も、board を開けば最新の「見て」が分かる必要がある（要件 FR16・判断の記録 ADR-15 の決定 (6)）。器の event に知らせの行は無い（器の答え・計画 6 節）。器の dispatcher.md の §29 の行 ad（idle の行の末の pending=）は未処置の終端の数で、席の「見て」の題と頁を持たないので材料にしない。材料は i-10 が知らせごとに書く project ごとの最新の 1 つの記録で、server と面はそれを読むだけ（制約 CON3）。

      記録（i-10 の着地の後の字）: 置き場は環境の XDG_STATE_HOME が絶対の path ならその下、ほかは絶対の HOME の下の .local/state の下の、const DIR の字 tsuzuri/notify の下の <project の名>.json。中身は鍵 at・project・title・url の順の 1 行の JSON の object と改行（fn render）で、fn read が読み（読めなければ None）、fn save が同じ dir の一時の file（名 .notify.<process の id>）から rename で置き換える。project の名は tz stage の cli の pub fn project（--repo を canonicalize した path の最後の名）。

      形 — 記録の dir の読み（stage/notify.rs に足す・名の形を決めるのはこの file だけ）:
      - pub fn dir(xdg_state_home: Option<&OsStr>, home: Option<&OsStr>) -> Option<PathBuf>: 今の fn path の置き場の決め（相対の値と空の値は捨てる）を切り出した fn で、base.join(DIR) を返す。pub fn path は Some(dir(xdg_state_home, home)?.join(format!(project と EXT))) に替える（返す path は今と同じ）。pub const EXT: &str は字 .json。
      - dir の表（歯 ntc_dir_files_gather）: (/x/state, /home/u) は /x/state/tsuzuri/notify、(x/state, /home/u) と (None, /home/u) は /home/u/.local/state/tsuzuri/notify、(x/state, u) と (None, None) は None。この 3 つの Some の組で path(…, proj-a) は dir の下の proj-a.json。
      - pub fn files(dir: &Path) -> io::Result<Vec<PathBuf>>: dir の下の、名が . で始まらず、EXT より長く EXT で終わる file（dir は数えない）の path を名の順に返す。dir が無ければ Ok の空、ほかの読めない dir は Err。一時の file は名が . で始まるので数えない。
      - pub fn gather(dir: &Path) -> io::Result<(Vec<Record>, Vec<String>)>: files の各 file を fn read で読み、読めてかつ中の project が file の名から EXT を除いた字と同じ記録を集め、ほかはその名を unread に（名の順）足す。記録は at の新しい順、同じ at は project の名の順。dir が無ければ 2 つとも空、読めない dir は Err。
      - 歯 ntc_dir_files_gather の置き場: 記録 proj-a（at 1790000100・題 頁 a）・proj-b（at 1790000200・題 頁 b）・proj-c（at 1790000100・題 頁 c）を fn save で書き、proj-d.json（鍵 at と project だけの欠けた記録）・proj-e.json（中の project が proj-x の記録）・.notify.77（一時の file）・proj-g.txt・.json・dir proj-h.json を置く。files は proj-a.json・proj-b.json・proj-c.json・proj-d.json・proj-e.json の 5 つ、gather の記録は proj-b・proj-a・proj-c の順、unread は proj-d と proj-e。

      形 — 契約（contract/notice.rs・新）: pub const PATH: &str は字 /api/notices。pub struct Notice { pub at: EpochSecs, pub project: String, pub title: String, pub url: String }。pub struct Notices { pub at: EpochSecs（組んだ時刻）, pub project: String（この board の project の名）, pub latest: Vec<Notice>（project ごとの最新の 1 つ・at の新しい順・同じ at は名の順）, pub unread: Vec<String>（記録の file は在るが読めない project の名・名の順）}。どちらも Debug・Clone・PartialEq・Eq・Serialize・Deserialize を derive し、欄の名のまま JSON に写る。contract/surface.rs の列挙 ChangeKind の最後に変種 Notice（kebab-case の字 notice）を足し、ChangeKind::ALL を 6 つ（Seat・Runs・Design・Ledger・Account・Notice の順）にする。

      形 — 境界の server:
      - server/config.rs の Config に pub notify: Option<PathBuf>（席の「見て」の知らせの記録の dir）を足し、Config::new は None で埋める。main.rs の fn serve は parse の後に config.notify を notify::dir(env の XDG_STATE_HOME, env の HOME) にする（tz stage notify と同じ環境の字で引く・起動の引数は足さない）。
      - server/mod.rs の Shared に notify: Option<PathBuf> を足して Config の値を写し、Server::bind の板の印の閉じた関数に、記録の dir が在れば notify::files の Ok の file を kinded(ChangeKind::Notice, …) で足す（dir が無いか読めなければ足さない）。印が動いた周に変化の知らせ（SSE）は event board-changed を data の kinds が notice の字で送る（行 c-ev-kind の種類の読みのまま）。
      - routes/notices.rs（新・1 口 1 file・build.rs が口の列に足す）: GET と path の完全一致 /api/notices。Shared の notify が None なら 503 と本文の字 no-notify-dir（pub const NO_DIR）、notify::gather が Err なら 503 と字 notify-unread（pub const UNREAD）、ほかは 200 で Notices（at は今の時刻・project は cli::project(--repo の path) の Ok か空の字・latest は gather の記録を同じ順で Notice に写した列・unread は gather の名の列）。file は書かず、子 process を撃たない。
      - 歯 ntc_route_reads_records の置き場: repo の dir の名 proj-kiri。dir を置く前は 200 と空の 2 つの列。記録 proj-kiri（at 1790000400・題 設計の頁を見て）と proj-b（at 1790000300・題 地図を見て）を fn save で書き、proj-z.json に字 not json を書いた後は、latest が proj-kiri・proj-b の順・unread が proj-z だけ。URL はどれも http://srv-a.tailnet.invalid:8120/?board=<project の名>。

      形 — 面の project board（project/notice.rs・新）: pub const BLOCK は id notice・見出しの鍵 notice・class panel。pub const PATH は字 /api/notices（契約の PATH と同じ字）、PATHS は [PATH]、FOLDS は空。pub fn doc は読みの結果を Notices に読み（まだ読まない は NOT_READ・読めない は pub const REASON・電文として読めない は pub const BAD_BODY の理由）、pub fn href(url) は http:// か https:// で始まる URL だけを Some で返し、pub fn line(notice, now) は pub struct Line { project, title, href, when }（when は view の clock_short(at, now)・20 時間の内は HH:MM JST・越えたら MM-DD HH:MM JST）を返す。pub fn content は、電文の unread に自分の project の名が在れば pub const OWN_UNREAD の測れていない、latest に自分の名の知らせが在ればその Line、無ければ pub const NONE_LINE（字 席からの知らせはまだ無い）の空を返す。DOM は wasm の target のときだけ: section の中に ul class items の li 1 つで、題は href が在れば a（target は付けない＝同じ tab）で無ければ字だけ、後に span class small muted num の時刻。
      - 歯 ntc_own_block の電文: board の project は proj-kiri。知らせ proj-b（at 1790000400・題 地図を見て・URL http://srv-a.tailnet.invalid:8121/?page=map）と proj-kiri（at 1790000300・題 問いを見て・URL https://srv-a.tailnet.invalid:8120/?page=ask）。組んだ時刻 1790000460 の電文で Line の when は 23:18 JST、組んだ時刻が 2 日後なら 09-21 23:18 JST。href の 6 つの URL は上の 2 つと javascript:alert(1)・file:///etc/passwd・//srv-a.tailnet.invalid/・空の字で、Some は上の 2 つだけ。

      形 — 面の account board（account/notices.rs・新）: pub const BLOCK は id notices・見出しの鍵 notices・class panel。pub use で project の notice の PATH を写す（account の下の file は /api/ の字を持たない決まりのまま）。pub fn content は project の notice の doc と line を使い、読めなければ測れていない、latest と unread が両方空なら pub const NONE_LINE（字 どの project の席からも知らせはまだ無い）の空、ほかは pub struct Rows { lines: 電文の順の Line の列, unread: 電文の unread }。pub fn unread_line は空の列に None、名の列に字 知らせの記録が読めない project と、コロンと空白と、名を・で継いだ字を返す（例 proj-y と proj-z）。DOM は ul class items に 1 行ずつ li（b の project の名・題の link・時刻）で、link の target は windows の win_name(project の名)（その project の窓で開く・前に出す命令は撃たない）、unread が在れば最後に li class small muted の 1 行。account/board.rs の block_view は id notices を notices::view に振る。
      - 歯 ntc_all_block の電文: proj-b（at 1790000400・題 地図を見て・http の URL）と proj-kiri（at 1790000300・題 問いを見て・URL ftp://x）と unread proj-z。Line は proj-b（23:20 JST）と proj-kiri（href 無し・23:18 JST）の順。

      形 — 置き場と種類: pages/home.rs の home の頁の左の列は notice・next・pipe・ledger・legend の順（右の列は orch のまま）。account/mod.rs の page(Tab::Home) の段は、STACK の段（notices）・HGRID の段（nxall・winsp）・STACK の段（groups・allowance・moves）の順で、account の module の file は board.rs・cards.rs・heartbeat.rs・home.rs・ledger.rs・mod.rs・notices.rs・projects.rs・session.rs・windows.rs。view.rs の RELOAD_KINDS は 13 行で、最後に (notice::PATH, [ChangeKind::Notice]) を足す（知らせの口は記録の file だけを読む）。vocab.json の rephrase に鍵 notice（label 席からの知らせ）と notices（label 各 project の席からの知らせ）を鍵 next_all の後に足す（plain と internal は記録の置き場と口を書く）。見本 mock v3 にこの 2 つの block は無い（見本の頁を直さない）。

      着地済みの歯の期待を直す字（この行が書く）: 契約の tests/snapshots/surface.json の surface::ChangeKind は seat・runs・design・ledger・account・notice の 6 語。面の tests/frame.rs の home の列の期待は notice・next・pipe・ledger・legend と orch。tests/acctframe.rs の home の段の期待は (stack, notices)・(hgrid, nxall と winsp)・(stack, groups と allowance と moves)、block の表の頭に (notices::BLOCK, notices, notices, panel, notices)、account の file の名に notices.rs。tests/hsderive.rs の表に (notice, [/api/notices], []) を nodearound の後に足す。tests/snapshots/pages/home.json と tests/snapshots/acctframe.json は上の段と列の字。

      決めた幅: (a) 材料は i-10 の記録だけで、§29 の行 ad の pending= は読まない。(b) 口は 1 つで、project board と account board が同じ電文を読む（project board は自分の名の 1 つ・account board は全部）。account の電文（AccountDoc）には足さない（行 c-abs-time などが書く account の契約と重ねない）。(c) 自分の project の名は記録を書く tz stage notify と同じ cli::project で引く（書き手と読み手の名が割れない）。(d) 記録の dir は起動の引数でなく server の環境から引く（席と server が同じ HOME で動く前提・i-10 と同じ前提）。(e) 更新は新しい種類 notice で送る（ほかの口を読み直さない）。(f) 題は i-10 が検めた字を写すだけで、link にするのは http と https の URL だけ。(g) 置き場は project board の home の左の列の頭と account board の home の頭の段（見本に無い block・持ち主が最初に見る所）。(h) 窓を前に出す・起こす命令は持たない（持ち主の裁定 t3-hub.59.5）。古い知らせを消す・既読にする口は持たない。

      歯で測らず、この行の差分で持つ字: 板の印の閉じた関数の中の順（Runs・Design・Seat・Account の後に Notice）。Line の DOM の組み（ul と li と span の class）。account の link の target の値が win_name の字であること（歯は字 win_name(&l.project) の在ることだけを見る）。main.rs の USAGE は変えない。

      依存と順: 便の順は i-open-mark（t3-hub.59.19）→ i-10（t3-hub.59.20）→ この行（notify.rs を書く・歯 stnfy・stcli・sttgt を置き場だけの = で持つ）、e-signal（t3-hub.52.120・server/mod.rs を書く）→ この行、g-ledger-group-kind（t3-hub.52.119・view.rs を書く）→ この行、c-abs-time（t3-hub.52.121・歯 gjst を書く）→ この行。どれも別のノートの行なので、ノートの depends は空にし、順は便の bead の依存で持つ（席が付ける）。

      読み手の grep: 書く src の file と fn（Config・Server::bind・notify の fn・ChangeKind・RELOAD_KINDS・project と account の頁の枠・vocab.json・account の file の列）を、契約・中核・境界・面の 4 つの crate の tests と src と xtask で grep した。字を読む歯と server を立てる歯と頁の枠の歯を全部 = と verify に入れた（境界 35・契約 3・中核 1・面 26）。xtask の accept は vocab.json を実行の時に読むが check では撃たない。

      範囲の外: 器の event と器の CLI は撃たない。表示先の端末への知らせ（i-10）と表示先の設定の画面（i-8）は変えない。知らせの記録を書く口は持たない（書き手は tz stage notify だけ）。

