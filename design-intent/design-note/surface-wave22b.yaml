      表示面の行 1 つ（契約・境界・面の crate）。
      i-11 は、席が tz stage notify で出した「見て」の知らせ（行 i-10 が project ごとの最新の 1 つを追跡されない XDG の state の dir に書く記録）を、境界の server の読みの口 GET /api/notices で読むだけで渡す（制約 CON3）。
