    body: |
      表示面の行 2 つ（境界の crate の boundary/stage の下だけ）。
      i-7 は表示先の設定（層 B・どの project をどの PC に出すか）の置き場 $XDG_CONFIG_HOME/tsuzuri/stage.toml（無ければ ~/.config/tsuzuri/stage.toml）を、自前の小さな読み手と rename の書きで扱う module target を置く。
      設定は全体の既定と project ごとの上書きと、表示先の端末ごとに初めて窓を起こした印を持つ。tz stage target の show・set --project・set --all・clear --project で読み書きし、置く値は層 A（器の host の面の [[device]]）に在る名だけを受ける。
      --to を省いた tz stage は今の project の名で設定を引き、印が無ければ窓を起こしてよいと渡して起こしたら印を書く。値が無ければ席の目と URL に落ち、値が層 A に無ければ名指して断る。
      i-board-ports は board の頁の上の click・入力・key の断りを、群の宣言の anchor ごとの project board の port（account board の電文の ProjectRow.board と同じ出所）で配るほかの project の board にも広げ、port が読めない project は名指して出す。
      器の host の面・server・面・契約の crate と外の依存は変えない。窓を前に出す・動かす語は持たない。
