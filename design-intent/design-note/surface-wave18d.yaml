    title: 行 i-7 — 表示先の設定（層 B）と tz stage target の口
    body: |
      在りかの main は f3556d3（計画 surface-plan v0.57）。境界の crate tsuzuri-boundary の lib.rs の pub mod stage の下の file（crate の外からは tsuzuri_boundary::stage::<名>）。この行はノートの 2 行の前の行（後の行 i-board-ports はノートの depends で後に流す）。cli.rs と mod.rs と着地済みの歯の file は今の main の字（行の番号は main の字の番号）で言う。
      なぜ。表示先は 2 層で持つ（計画の 3 節・判断の記録 ADR-15 の決定 (1)(2)(6)）。層 A = どの PC が在るか（器の host の面の表 [[device]]・器の答え S2-1〜S2-5）、層 B = どの project をどの PC に出すか。持ち主の裁定 t3-hub.59.1（裁定 id = t3-hub.59.1:20260928T0120Z-1）は表示先を設定として持ち、setup の skill か席との対話で最初に決め、いつでも変えられる形を採り、t3-hub.59.7（裁定 id = t3-hub.59.7:20260928T0249Z-1）は持ち主が閉じた窓を開き直さない形を採った。置き場は tsuzuri 自前の追跡されない 1 つの file（計画の 3 節の席の決め・退けた置き場は計画の 9 節の行 i-7 の字）。今の tz stage は --to を要り（cli.rs の 218 行の字 に --to が無い）、層 B は無い。
      在りか・cli.rs（write-set・今の main で 618 行・pub mod cli）。pub const USAGE（31 行・字 usage: tz stage で始まる 1 行・--to <端末の名> は要る旗）・const COMMON（55 行・7 つの旗 --to・--repo・--ssh・--scribe2・--git・--tailnet・--chrome）・pub enum Verb（One・Run・Open）・pub struct Call（78 行・pub な欄 verb・to〔String〕・repo・ssh・scribe2・git・tailnet・chrome）・pub fn parse（201 行・共通の旗は 1 度ずつ・--to が無ければ 218 行の Err）・pub fn lines（245 行）・pub fn seat_refusal・pub fn on_board（283 行）・pub fn lock（291 行・端末ごとの錠 tzst-<名>.lock を mode 0600 で開き wait まで取りに行く）・pub fn browser_resource・pub fn run（393 行・parse の後に url の board で自分の board を組み、stage を撃って最後に URL の行を出す）・fn stage（431 行・席の中の open を断り、face で端末の行を引き、open は fn open へ、ほかは relay の reach で端末か席の目へ繋ぎ、端末の窓は tunnel の window に字 false を渡して起こさない）・fn face（462 行・git の scribe2.statedir で state dir を引き、器の validate --state-dir が rc 0 で返った後にだけ terminal の read_face で host の面を読み、terminal の lookup で --to の行を引く）・fn open（488 行・錠を持って窓を 1 回だけ起こす）・fn drive（545 行）・fn shoot（559 行）。mod.rs（write-set・17 行）は 10 の pub mod（cdp・cli・json・launch・pipe・relay・terminal・tunnel・url・ws）。
      使う物（この行は書かない・確かめた）。terminal の pub fn names（host の面の字を受け [[device]] の名の Vec）と lookup と read_face と pub const FACE（字 host.toml）。tunnel の pub enum Window（Page の欄 resource と launched・Absent）と Tunnel の pub fn window（url と may_open の bool を受け、Chrome が答えなければ may_open の時だけ窓を 1 回起こし、起こした時の Page の launched は真）と pub fn user_dir。relay の pub struct Eyes の pub fn open（chrome と base と url と timeout を受け Eyes と Session の組）と reach。acct の GIT・GIT_ARGS。中核の crate の account の pub fn project_name（anchor の字の最後の段・account の電文の ProjectRow の name の出所・境界の acct.rs の doc_read が同じ関数で比べる）と account::host の pub fn declaration（群の宣言 [[account-group]] の name と anchors を読む）。std の fs と OpenOptionsExt の mode と rename。外の依存は足さない。
      形（target.rs・新しい file・pub mod target）。module の doc（置き場・2 段と印・自前の読み手・rename の書き・窓を前に出す語を持たない）。pub const DIR・FILE・DEFAULT・PROJECT・SHOWN・HEAD（done の項 1 の字）。pub struct Targets（derive は Debug・Clone・Default・PartialEq・Eq・pub な欄 default・projects・shown）。pub enum Origin（Default・Project・pub fn word）。impl Targets に pub fn effective・set_project・set_all・clear_project。pub fn path（XDG_CONFIG_HOME が絶対の path ならその下、ほかは絶対の HOME の下の .config の下・XDG の決まりどおり相対の値は捨てる）。pub fn shaped（空でなく引用符と逆斜線と字 = と制御の字を含まない名・書く字に逃がしの字を持たず、read が 1 行を最初の = で鍵と値に割っても名が割れないための形。書ける名は読める＝render と save が書いた file を load が断らない）。私的な fn quoted。pub fn read（空の行と井桁で始まる行は飛ばす・表は [project] と [shown] だけで 1 度ずつ・根の鍵は default だけ・[project] は引用符で囲んだ名 = 引用符で囲んだ名・[shown] は引用符で囲んだ名 = 数字だけの epoch 秒・同じ鍵の 2 度は断る）。pub fn render（HEAD の行・既定・空行と [project] の表・空行と [shown] の表の順・空の表は書かない・BTreeMap の順）。pub fn load（NotFound は空の Targets・ほかの読めない誤りと形の誤りは path を名指す）。pub fn save（dir を create_dir_all で作り、同じ dir の一時の file〔字 . と FILE と . と process の id〕を消してから create_new と mode 0600 で開いて書き sync_all し、rename で置き換える・落ちれば一時の file を消す）。pub fn mark（load し直して印が無い時だけ足して save・書いた時だけ真）。pub fn known（層 A の名に無ければ在る名を空白で並べて断る）。
      節の表（read の 10 の形の外れた字と Err の字・歯 sttgt_read_render）: 表 [other] の 1 行は 1 行目: 知らない表 [other]。根の鍵 color は 1 行目: 知らない鍵 color。引用符の無い default の値 term-a は 1 行目: 値 term-a は引用符で囲んだ名でない。default の 2 行は 2 行目: 鍵 default が 2 度ある。[project]・[shown]・[project] の 3 行は 3 行目: 表 [project] が 2 度ある。[project] の下の引用符の無い鍵 proj-b は 2 行目: 鍵 proj-b は引用符で囲んだ名でない。[project] の下の同じ鍵 p の 2 行は 3 行目: 鍵 p が 2 度ある。[shown] の下の値 -1 は 2 行目: 値 -1 は epoch 秒の数でない。[shown] の下の引用符で囲んだ 1 は 2 行目の同じ断り（値の字は引用符ごと）。等号の無い行 default は 1 行目: 鍵 = 値 の形でない。
      形（cli.rs）。module の doc に 4 行（--to を省いた撃ちは project の名で設定を引き、初めて見せる時だけ窓を起こしてよいと渡して印を書く・値が無ければ席の目と URL・層 A に無ければ断る・tz stage target の 4 つの口）を足す。use に std::time の SystemTime と UNIX_EPOCH、中核の declaration と project_name、relay の Eyes、target と Targets を足す。USAGE の --to を角括弧で囲み、旗 [--config <path>] と、改行と tz stage target の使い方の 1 行を足す。COMMON を 8 つにし字 --config を足す。Call の to を String の Option にし、欄 config（PathBuf の Option）を足す。parse は --to を要らなくし（218 行の Err を外す）、config を読む。lines の前に pub enum Aim・pub fn aim・pub fn project（canonicalize した repo の path を project_name に渡し、shaped でなければ断る）・pub fn config_path（--config が在ればその path・無ければ target の path に環境の XDG_CONFIG_HOME と HOME を渡す）・pub enum Setting・pub struct TargetCall（derive は Debug・Clone・PartialEq・Eq）・pub fn parse_target（--all は値の無い旗・受ける旗は --project・--repo・--scribe2・--git・--config・旗でない字は端末の名）・pub fn show・私的な fn setting（設定を load し、face_text の後に層 A の名を読み、show は群の宣言の anchor の project の名と repo の project の名を重ねずに並べ、set は known の後に save、clear は無い上書きを断る）を置く。run は最初の字が target なら parse_target と setting を撃つ（URL の行は出さない）。fn face を fn face_text（repo と scribe2 と git を受け、validate の後の host の面の字を返す・断りの字は今のまま）に替える。stage は face_text の後に、--to が在れば Named、無ければ config_path の設定を load して aim を撃ち、Unset なら open は断り、ほかは Eyes の open で席の目に落ちた旨の 1 行を出して drive する。名が決まれば terminal の lookup で行を引き、open は今の fn open へ。初めて見せる時（Chosen の first）は端末の錠を持ち、設定を読み直して印がまだ無い時だけ tunnel の window に字 first を渡し、Page の launched が真なら target の mark に私的な fn now（epoch 秒）を渡して印を書き、その旨の 1 行を出す。Named と first が偽の時は今のとおり窓を起こさない。
      節の表（parse_target の読み・歯 sttgt_parse_target_table）: show は Show。set --project proj-a term-b は Project(proj-a, term-b)。set term-a --all は All(term-a)。clear --project=proj-a は Clear(proj-a)。この 4 つの repo は字 .・scribe2 は字 scribe2・git は字 git・config は None。show --repo /r --scribe2 /f/s2 --git /f/git --config /c/s.toml はその 4 つの値。断り（Err の字の頭）: 空の列は target の命令が無い（show・set・clear）。drop は知らない target の命令 drop。set term-a と set --all --project p term-a は target set の形でない。clear --all は target clear の形でない。show --to term-a は target は旗 --to を受けない。set --all --all term-a は --all が 2 度ある。clear --project は --project の値が無い。
      変わらない行と読む順と落ちる時（歯で測らず、この行の差分で持つ）。変わらない: --to を渡した撃ち（端末の窓を起こさない・設定を読まない）・open の錠と窓の起こし方と頁を作る 1 回・席の中の open の断り・board の頁の断り・URL の行・lines・one・lock・browser_resource・main.rs の口の振り分け（字 stage の後を cli の run に渡すまま）。読む順: run は target の口でなければ今のとおり board を組んでから stage を撃ち、stage は face_text の validate を設定の読みより先に撃つ（層 A を読めなければ設定を読まない）。target の口は設定の load を face_text より先に撃つ（壊れた設定は器を撃たずに断る）。落ちる時: 設定の file が無ければ空の設定（show は 無し を並べ、--to を省いた撃ちは席の目に落ちる）・設定の形が外れれば path を名指して断る（黙って既定へ落とさない・条 P-7）・層 A から消えた名は名指して断る・印の書きが落ちれば撃ちの Err（窓は起きたまま）。
      決めた幅（起草の決め）。(a) 読み手と書き手は自前で、書式は TOML の小さな部分（表 2 つ・鍵は引用符の名・値は引用符の名か数）に限る（外の依存を足さない・計画の 9 節の字）。(b) project の名は repo の dir の名（中核の project_name・account の電文の ProjectRow の name と同じ出所）。canonicalize するので字 . の repo も dir の名になる。(c) show の project ごとの行は、群の宣言の anchor の project と repo の project を並べる（account board と同じ宣言）。(d) 初めて見せる窓は、同時の撃ちで 2 度起こさないよう open と同じ端末の錠の中で印を読み直す。(e) 印は窓を起こした時だけ書き、消さない。tz stage open が窓を起こした時は印を書かない（計画の 9 節の字は --to を省いた撃ちの印だけを言う・席の問い）。(f) 値が無い時の席の目は i-4 の落ちる先と同じ Eyes（URL の行も同じ）で、出力の 1 行で表示先を board の問いで持ち主に問うことを言う（問いの起票はこの行の外）。(g) 知らせ（i-10）はまだ無いので、印が在って窓の無い端末は今の Absent の 1 行と URL の行を出す。
      着地済みの歯（grep で確かめ、試作で撃った）。stcli（write-set）: stcli_shape_and_consts は Call を欄ごとに分けて型を見る（to と config の型を直す）・stcli_parse_table は --to の無い列を断りの表（refusals の 20）に持つ（読める列の表へ移し断りを 19 にする）・fn plain と stcli_parse_table の Call の字 full は Call を字で組む（to を Some に・config の None を足す）・stcli_source_guards は cli.rs の字（createTarget が 1 度・窓を前に出す語が無い）と src の下の全部の file の createTarget と mod.rs の字 pub mod cli; を見る（直さずに通る）。strelay と stlaunch は mod.rs の pub mod の行を字で見る（= で持ち直さずに通る）。stterm・stcdp・stdenv は terminal.rs と cdp.rs だけを読むので write-set に入れない。
      測り方・歯（tests/sttgt.rs・新しい file）。使う item は tsuzuri_boundary::stage::cli の Aim・Setting・TargetCall・aim・project・config_path・parse_target・show、stage::target の DEFAULT・DIR・FILE・HEAD・Origin・PROJECT・SHOWN・Targets・path・read・render・load・save・mark・known・shaped、stage::terminal の FACE。偽の器と git と tailnet の道具は sh の script で、tz の binary は CARGO_BIN_EXE_tz。fixture の tests/fixtures/stage/stage-target.toml は偽の名だけ（term-a・term-b・proj-b）。試作（main に当てた）で 10 本と着地済みの歯が通り、噛みを見た（相対の XDG_CONFIG_HOME を受ける・知らない表を黙って飛ばす・set --all が上書きを残す・mode 0644・印をいつも書き直す・層 A に無い値を黙って使う・印を見ずにいつも初めてにする・set の形を問わない・層 A に無い名も置く・値の無い open を席の目に落とす・起こしても印を書かない、でそれぞれ名指した歯が落ちる）。
      filter の語（main f3556d3 の contracts の verify の filter の語 243 を、ほかの語を部分の字として含まない 169 語に畳んだ語と、計画の後の行 g-gz の接頭辞 pgz_ と、同じノートのもう 1 つの行の接頭辞 stbp_・この行の接頭辞 sttgt_ は並べない・171 語）は aaround_・accept_・acchold_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadl_・cadopt_・cadq_・cdorm_・cfsplit_・cgdom_・cmark_・contract_form_・cround_・csled_・cspk_・ctick_・denv_・dnedge_・dngrp_・dnrow_・dnskip_・ecache_・epolq_・flight_・fmark_・fprem_・frame_・fserve_・fstop_・fxpre_・g3g7_・gapspage_・gbnote_・gcoach_・gfix_・gfresh_・ghb_・gjst_・glabel_・gnav_・gpface_・gpill_・gpulse_・graph_・gsum_・gtuck_・gview_・hacols_・harest_・hasplit_・hbconf_・hbmark_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hdchip_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hshist_・hspage_・hspk_・hsym_・hwstore_・iclose_・ilink_・kcli_・kindlab_・klink_・launch_・lcard_・ledgerblock_・lhome_・lidle_・lresume_・lsnap_・lspark_・lstg_・lstore_・mapview_・mkeys_・mlink_・mstore_・mtips_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・nxorg_・parts_・pci_・pclosed_・pfold_・pipe_・plimit_・pmisfit_・pmore_・pquest_・pqueue_・project_・ptitle_・punmap_・pwhole_・qblock_・qgate_・qkey_・question_・relay_・rhold_・runsdoc_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・stcli_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_・pgz_・stbp_ で、新しい歯の名から先頭の sttgt_ を除いた字は、このどれも部分の字として含まない（例 sttgt_tz_x・sttgt_pipe_x は不可）。歯の file は同じ 171 語を const FILTERS に持つ。
      依存と順。depends は空。後の行 i-board-ports（同じノート）は cli.rs を書くのでノートの depends で後に流す。計画の 5 節の鎖は boundary/stage/cli.rs が i-5（着地済み）→ i-7 → i-board-ports → i-10、boundary/stage/mod.rs が i-1 → i-3 → i-2 → i-4 → i-5（着地済み）→ i-7 → i-10。いま走る・待つ便は boundary/stage と歯 stcli・strelay・stlaunch を書かない（lint で確かめた）。
      範囲の外。ほかの project の board の頁の断り（後の行 i-board-ports）。知らせ（i-10）と board の知らせ（i-11）。2 つの board の設定の画面と server の口（i-8・server と面は設定の file を書かない）。setup の skill（i-9）。層 A の書き（器の memo s2-07l.727）。main.rs の module の doc の --to の字（口の振り分けは変えない・k-parity で main.rs を書く時に直す）。
  - n: 4
    type: prose
    title: 行 i-board-ports — ほかの project の board の頁の上でも click・入力・key を断る
    body: |
      在りかの main は f3556d3（計画 surface-plan v0.57）。境界の crate tsuzuri-boundary の lib.rs の pub mod stage の下の file（crate の外からは tsuzuri_boundary::stage::<名>）。この行はノートの 2 行の後の行で、前の行 i-7 の着地の後に流す（ノートの depends）。cli.rs は前の行 i-7 が書いた後の字に書くので、cli.rs の在りかは名で言い、行の番号は url.rs と今の main の字だけで言う。
      なぜ。board の頁の上では click・入力・key を断る（判断の記録 ADR-15 の決定 (7)・board は見せるだけ）。行 i-5 は自分の board（port が自分の boardport で host がこの host のどの形でもよい頁）だけを断り、ほかの project の board の port は後の行とした（席の決め・行 i-5 の起草の問い Q1・2026-09-28・ノート surface-wavei4 の字）。同じ host のほかの project の board も持ち主の画面で、席が撃つ click や入力で持ち主の操作に見える変化を起こさないために、守りをそれらにも広げる。
      在りか・url.rs（write-set・今の main で 164 行・pub mod url）。module の doc（1〜6 行）・use（8〜14 行・std の OsStr と OsString と Path と Duration、super の json、crate の acct、server の proc）・pub const TAILNET・STATUS_ARGS・LOOPBACK・pub fn self_name・pub fn self_hosts・pub fn board_url（68 行）・pub struct Board（74 行・pub な欄 url・hosts・port）・impl Board の pub fn holds（82 行・parts の port が自分の port で host が hosts に在る）・pub fn board（88 行・tailnet の道具の status と git の -C <repo> config --get tsuzuri.boardport〔acct の BOARD_ARGS〕で自分の board を組む）・pub fn line（114 行）・pub fn origin・私的な fn parts。
      在りか・cli.rs（write-set・前の行 i-7 の後の字）。pub fn on_board（Command と頁と Board を受け、click・type・key の命令で board の holds が真なら真）・fn stage（face_text の後に表示先を決め、drive を席の目に落ちた 2 か所と端末の頁の 1 か所の計 3 か所で撃つ）・fn drive（Session と命令の列と Board を受け、命令ごとに shoot）・fn shoot（click・type・key は Session の今の頁の URL を読み、on_board が真なら撃たずに断る・断りの字は board の頁 <頁> の上では <命令> を断る〔判断の記録 ADR-15 の決定 (7)・board は見せるだけ〕）。
      使う物（この行は書かない・確かめた）。中核の account::host の pub fn declaration（群の宣言 [[account-group]] の anchors・複数の行の配列も読む）と account の pub fn project_name。境界の acct の pub const BOARD_ARGS と pub fn board_port（字を 1 から 65535 の u16 に読む）。境界の acct の Acct の doc_read は同じ宣言の anchor ごとに同じ git の引数で port を引き、account board の電文の ProjectRow.board に置く（この行は同じ引き方を url に置き、server を撃たない）。server の proc の capture。
      形（url.rs）。module の doc に 2 行（守りを群の宣言の anchor ごとの project board の port のほかの board にも広げる・host の形は自分の board と同じ列）を足す。use に中核の declaration と project_name を足す。impl Board に pub fn holds_any（parts の port が自分の port か ports に在り、host が hosts に在る）を足す。Board の欄と holds は変えない。pub struct Ports（derive は Debug・Clone・Default・PartialEq・Eq・pub な欄 ports と unread）と pub fn ports（群の宣言の全部の群の anchors を宣言の順に同じ字を 1 度だけ集め、anchor ごとに proc の capture で git に -C と anchor と BOARD_ARGS を渡し、board_port で読めれば同じ port を 1 度だけ ports に、読めなければ project_name を unread に足す）を置く。
      形（cli.rs）。module の doc に 2 行（断りを url の ports のほかの board にも広げ、port が読めない project は名指して出す）を足す。on_board は on_boards に空の slice を渡す 1 行にし、その後に pub fn on_boards（私的な fn guarded と Board の holds_any）と私的な fn guarded（click・type・key の命令か）を置く。stage は face_text の後に、命令の列に guarded の命令が在る時だけ url の ports に host の面の字と git と repo と TIMEOUT を渡し、unread の project ごとに字 project <名> の board の port が読めない（その board の頁の上の断りは広げない）の 1 行を出して、ports を drive の 3 か所に渡す（guarded の命令が無ければ空の Vec で git を撃たない）。drive と shoot に引数 ports（u16 の slice）を足し、shoot の断りの判定を guarded と on_boards にする（断りの字は今のまま）。
      節の表（holds_any・歯 stbp_holds_any・Board は port 4801）: 頁 http://srv-a.tailnet.invalid:4801/x は holds と holds_any の空の ports で真・ports 在りで真。http://srv-a:4802/ と https://192.0.2.7:4803/p?q=1 と http://[2001:db8::7]:4802/ と http://localhost:4803/ は holds で偽・ports 在りで真。http://127.0.0.1:4804/ と http://other.tailnet.invalid:4802/ と http://srv-a:80/ と file:///fake/x.html はどれも偽。
      節の群の宣言と偽の git（歯 stbp_ports_read）。host の面は schema の 1 行と 3 つの [[account-group]]（grp-a の anchors は /fake/anchors/proj-a と /fake/anchors/proj-b の 1 行の配列・grp-b は /fake/anchors/proj-a と proj-c と proj-d の複数の行の配列・grp-c は anchors 無し）。偽の git は 2 つ目の引数の末が proj-a なら 4802、proj-b なら 4803、proj-c なら port でない字 x を返し、ほかは rc 1。
      変わらない行と読む順と落ちる時（歯で測らず、この行の差分で持つ）。変わらない: Board の欄と holds と board と URL の行・on_board の値（自分の board だけ）・断りの字・navigate と reload と scroll と wait ほかの命令は断らない・open と --to を省いた撃ちの表示先の決め（前の行 i-7）。読む順: face_text の validate の後に port を引き（層 A と同じ host の面の字を読む）、命令を撃つ前に全部の port を読み終える。落ちる時: port の読めない project は名指す 1 行を出してその board の断りを広げず（自分の board と読めた board の断りは残す）、撃ちは止めない。群の宣言が無ければ自分の board だけの守り（今のまま）。
      決めた幅（起草の決め）。(a) port の出所は account board の電文そのものでなく、電文と同じ引き方（群の宣言の anchor と git の tsuzuri.boardport）を tz stage が自分で撃つ。account board の server の口を読むと server の住所と port を tz stage が知る要が生じ、server が止まっていると守りが消えるため。(b) 引くのは click・入力・key を撃つ列の時だけ（navigate と screenshot ほかの撃ちに git を足さない）。(c) 読めない port は断りの一覧として名指し、撃ちは止めない（計画の 9 節の字・広げない側へ黙って倒さない）。(d) host の形は自分の board と同じ列（同じ host の board だけ・ほかの host の同じ port は断らない）。
      着地済みの歯（grep で確かめ、試作で撃った・= で持つ）。stcli は on_board と Board と cli.rs の字（createTarget・窓を前に出す語・CLAUDECODE）を見る（直さずに通る）。sttgt（前の行 i-7 の歯）は cli.rs の字 tunnel.window(&board.url, first) ほかを見る（直さずに通る）。strelay は Board を欄ごとに分ける（欄を変えないので通る）。
      測り方・歯（tests/stbp.rs・新しい file）。使う item は tsuzuri_boundary::stage::cdp の Command、stage::cli の on_board と on_boards、stage::url の Board・Ports・ports・self_hosts。偽の git は sh の script で argv を file に足す。試作（main に前の行 i-7 の試作を当てた土台）で 5 本と着地済みの歯が通り、噛みを見た（ほかの port を見ない・同じ anchor を 2 度撃つ・移動も board の上で断る・撃つ前の断りが自分の board だけ・読めない project を名指さない、でそれぞれ名指した歯が落ちる）。
      filter の語（main f3556d3 の contracts の verify の filter の語 243 を、ほかの語を部分の字として含まない 169 語に畳んだ語と、計画の後の行 g-gz の接頭辞 pgz_ と、同じノートのもう 1 つの行の接頭辞 sttgt_・この行の接頭辞 stbp_ は並べない・171 語）は aaround_・accept_・acchold_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadl_・cadopt_・cadq_・cdorm_・cfsplit_・cgdom_・cmark_・contract_form_・cround_・csled_・cspk_・ctick_・denv_・dnedge_・dngrp_・dnrow_・dnskip_・ecache_・epolq_・flight_・fmark_・fprem_・frame_・fserve_・fstop_・fxpre_・g3g7_・gapspage_・gbnote_・gcoach_・gfix_・gfresh_・ghb_・gjst_・glabel_・gnav_・gpface_・gpill_・gpulse_・graph_・gsum_・gtuck_・gview_・hacols_・harest_・hasplit_・hbconf_・hbmark_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hdchip_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hshist_・hspage_・hspk_・hsym_・hwstore_・iclose_・ilink_・kcli_・kindlab_・klink_・launch_・lcard_・ledgerblock_・lhome_・lidle_・lresume_・lsnap_・lspark_・lstg_・lstore_・mapview_・mkeys_・mlink_・mstore_・mtips_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・nxorg_・parts_・pci_・pclosed_・pfold_・pipe_・plimit_・pmisfit_・pmore_・pquest_・pqueue_・project_・ptitle_・punmap_・pwhole_・qblock_・qgate_・qkey_・question_・relay_・rhold_・runsdoc_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・stcli_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_・pgz_・sttgt_ で、新しい歯の名から先頭の stbp_ を除いた字は、このどれも部分の字として含まない（例 stbp_tz_x・stbp_pipe_x は不可）。歯の file は同じ 171 語を const FILTERS に持つ。
      依存と順。depends は i-7（同じノート・cli.rs を書き、この行の歯の = の sttgt.rs を足す）。計画の 5 節の鎖は boundary/stage/cli.rs が i-5（着地済み）→ i-7 → i-board-ports → i-10、boundary/stage/url.rs が i-4（着地済み）→ i-board-ports（i-5 と i-10 は使うだけ）。いま走る・待つ便は boundary/stage と歯 stcli・strelay を書かない（lint で確かめた）。
      範囲の外。account board の port（account board は project board と同じ server が出すので、その port は自分の board の port）。ほかの host の board。器の host の面の書き。断りの字の替え。

