  - n: 3
    type: prose
    title: 行 t-qgate-tidy — 歯の file qgate.rs の作業場の .git を drop の守りで消す
    body: |
      在りかの main は 71a0780（計画 surface-plan v0.33）。この節の字はその code の値。
      なぜ。着地済みの歯の file crates/tsuzuri-boundary/tests/qgate.rs（行 f-gate・問いの起票の門の hook の歯・接頭辞 qgate_）の作業場の組み Place::new は、作業場ごとに repo の dir に .git の file（1 行）を書き、消さない。歯が作る 6 つの作業場（undisposed・disposed・others・bd-fails・folio-fails・bad-args）の .git の file は、器（scribe2）の走行の worktree ごとの target/ の下の CARGO_TARGET_TMPDIR（target/tmp）の qgate の下に、次の走らせの Place::new が root を消すまで残り、最後の走らせの後はずっと残る。2026-09-28 に退役した走行の target/ 29 個を消すとき、rm の守りは target/ に残る .git（その時は歯 fstop の空の .git の dir・行 t-fstop-tidy で直した）を理由に断った（計画 surface-plan の 2 節）。qgate の .git は dir でなく file だが、同じ target/tmp の下に残る後始末の漏れなので、同じ drop の守りで消す（席の決め・計画の 9 節の行 t-qgate-tidy・拠る要件は着地済みの行 f-gate と同じ FR4）。この行は片付けで、何も止めない。
      在りか（tests/qgate.rs・write-set・main 71a0780 で確かめた・558 行）。私的な struct Place（欄 root・repo・log・どれも PathBuf・248〜252 行）のPlace::new(name)（255 行）は、root を CARGO_TARGET_TMPDIR の下の qgate/<name> にし、先に fs::remove_dir_all で root を消し（誤りは捨てる）、repo と log の dir を作り、repo の .git に字 gitdir とコロンと空白と字 /nonexistent/qgate と改行の file を書き（263 行・字 fs::write(repo.join で始まる行）、root に fixture の guard/question-4 の ledger.json と index.tsv の写しを書き、偽の bd と偽の設計の道具 folio（受けた引数を log の <名>.log に 1 行足してから写しを出す sh・私的な fn script が権限 755 で置く）を root に置いて、欄 3 つの Place を返す。.git を書くのは、問いの起票の門の hook（src/hook/question_gate.rs・module の doc）が停止の hook と違い repo が git の worktree でも黙らないことを、.git が file の repo で見るため（門の hook の src は .git を読まない）。Place を作る歯は 5 本で、qgate_bin_names_undisposed が名 undisposed、qgate_bin_silent_when_disposed が disposed、qgate_bin_other_calls_spawn_nothing が others、qgate_bin_unread_is_unknown が bd-fails と folio-fails の 2 つ（loop の周ごとに作って周の終わりに drop）、qgate_bad_args_close_drafts_only が bad-args。qgate_parse_args と qgate_own_names_clean は作業場を作らない。どの歯も作業場を持ったまま終わり、Place には Drop が無いので、.git の file は歯の後も残る（試作の target/tmp/qgate の下で find が .git を 6 つ数えた）。
      在りかの補い（qgate.rs のほかの字・確かめた）。qgate_bin_names_undisposed（392〜411 行）は repo の path と byte の一覧（私的な fn tree）を撃つ前に取り、tz の hook question-gate を --repo と偽の --bd と --folio で撃って、rc 0・標準出力が期待の字・偽の bd と偽の設計の道具の記録が 1 行ずつ・repo の一覧が撃つ前と同じ、を見て終わる。qgate_own_names_clean は CARGO_MANIFEST_DIR の tests/qgate.rs を読み、字 #[test] の行の次の fn の名を集めて数が 7 で、名から qgate_ を除いた字が const FILTER_WORDS（113 語）のどれも含まないことを見る。字 impl Place { は main の file に 1 度だけ在り（254 行・Place の impl の頭）、字 Tidy と字 fs::write(&git は main の file に無い。歯の file の use は std::ffi::OsString・std::fs・std::io::Write・std::os::unix::fs::PermissionsExt・std::path の Path と PathBuf・std::process の Command と Output と Stdio と、境界と中核の crate の item（std::panic::catch_unwind は path で書いてよい）。workspace の Cargo.toml の profile は release だけを書き（行 g-strip）、test の panic は巻き戻し。
      形。tests/qgate.rs に私的な struct Tidy（名の無い 1 つの欄の PathBuf・doc は drop で path を消す守り）と impl Drop を足す。drop は fs::symlink_metadata が dir を返せば fs::remove_dir_all、ほかは fs::remove_file を撃ち、結果を捨てる。Place に私的な欄 _git（型 Tidy・名の頭の下線で読まない欄の警告を出さない）を足し、Place の doc に、作業場が drop されると守りが repo の .git を消す旨を足す。Place::new は repo の .git の path を束ね（let git）、Tidy(git.clone()) を束ねてから、その path に今と同じ字の .git の file を書き（fs::write(&git と同じ字）、返す Place の欄 _git にその Tidy を入れる。作業場の組みの途中（.git を書いた後の写しの書きか script）で panic しても、束ねた Tidy が巻き戻しで .git を消す。qgate_bin_names_undisposed の最後の assert の後に、(a) repo の .git の path を取って作業場を drop し、symlink_metadata が Err、(b) std::panic::catch_unwind に閉包（Place::new(undisposed) を撃ち、repo の .git が file であることを assert し、panic する）を渡して結果が Err、その後に同じ path の symlink_metadata が Err、(c) CARGO_MANIFEST_DIR の tests/qgate.rs の字のうち字 impl Place { の最初の位置より後の字で、字 Tidy(git.clone()) の最初の位置が字 fs::write(&git の最初の位置より前、を足す（(c) の字の探し方は問わない・例 字 impl Place { で split した 2 つ目の字の find）。歯の前半の見方、ほかの fn・定数・FILTER_WORDS・fixture は変えない。新しい test の属性の fn は足さない。repo と log の dir と bd・folio・ledger.json・index.tsv は残してよい（.git でない・次の走らせの Place::new が消す）。
      限り。drop は panic の巻き戻しでは撃たれるが、process が kill で止められたとき（nextest の時間切れの kill ほか）と abort では撃たれない。そのときは次の走らせの Place::new が root を消す。閉包の panic は標準エラーに panic の行を書く（test の出力は nextest が捕まえ、通った歯では出さない）。(b) の閉包は歯の fn の中で同じ名の作業場を作り直すので、歯の fn の中の順（drop の後）でだけ撃つ。
      着地済みの歯（確かめた）。qgate.rs の 7 本は verify の qgate_ で全部撃つ。qgate_bin_names_undisposed は見方を足すだけで、前半の見方は変えない。ほかの 6 本は Place の欄を足しても直さずに通る（欄 _git を読む歯は無い・Place を struct の字で組む字は Place::new の中だけ）。境界の crate のほかの歯で .git を作るのは tests/fstop.rs の歯 fstop_worktree_stays_quiet だけで、drop の守りは着地済み（この行は fstop.rs を触らない）。中核と契約と面の crate の歯と xtask の歯に .git を作るものは無い（tests と src を grep で確かめた）。src/hook/question_gate.rs は読むだけで変えない。
      測り方。verify は cargo nextest run -p tsuzuri-boundary --test qgate --no-tests=fail qgate_（7 本）と xtask の check。この行は新しい歯の名を足さない（名の見張りは着地済みの qgate_own_names_clean のまま）。試作（main の写しに当てた）で 7 本が通り、走らせの後に CARGO_TARGET_TMPDIR の下の qgate の置き場に .git が 1 つも無いことを find で確かめ、Tidy を欄に入れずに捨てる（std::mem::forget）と qgate_bin_names_undisposed が drop の後の assert で落ちて .git が 6 つ残り、Tidy を束ねる字を .git を書く字の後に置くと (c) の assert で落ちることも同じ写しで確かめた。
      依存と順。depends は空。計画の 5 節の鎖に tests/qgate.rs を書く行は無い（f-gate は着地済み）。同じノートの行 e-seat-hbmark とは書く file も置き場だけの = の file も重ならないので並べて流す。これから qgate.rs を write-set（置き場だけの = を含む）に持つ行とは、器が同時に流さないので、順は便の bead の依存で持つ。外の依存は足さず、境界の src・Cargo.toml・fixture は触らない。歯の file の行数は試作で 558 → 604。
  - n: 4
    type: prose
    title: 行 e-seat-hbmark — 席の card の印に停止の記録を足し、印が動いたら持ち回しの中でも集め直す
    body: |
      在りかの main は 71a0780（計画 surface-plan v0.33）。この節の字はその code の値。
      なぜ。project board の席の block の停止の切り替え（着地済みの行 e-seat-hb と g-seat-hb・持ち主の裁定 t3-hub.52.29 の案 A）は、境界の POST /api/seat/heartbeat（src/server/routes/seathb.rs と src/accthb.rs の accept_own）が器（scribe2）の CLI の seat heartbeat <on|off> を 1 回撃ち、器が返してから 200 を返す。器は off で席の dir に停止の記録 heartbeat-off を置き（一時の file から rename）、on で消す。面は 200 の後に全部の口を読み直す（面の src/account/heartbeat.rs の 437 行の crate::net::reload_all）。ところが境界の server は席の card の材料（器の 3 つの出力と file の字）を 5 秒持ち回し（src/server/seat.rs の const HOLD・Seats の fn texts）、5 秒の中の読みは集め直さない。席の card の heartbeat は器の seat tick status の出力の席の行の字 heartbeat= の値（中核の src/seat.rs の fn card が on を真・off を偽に読む）で、器はその値を停止の記録の在る無しから出すので、切り替えの前 5 秒の中に口 /api/seat が読まれていれば、切り替えの後の読み直しは前の heartbeat を返し、席の block の on/off の字と button の向きが古いまま残る。さらに席の card の変化の印（Seat::marks）は state.jsonl と tick-last だけで heartbeat-off を含まないので、停止の記録が動いても変化の知らせ board-changed が出ず、面は次の変化（器の管理 tick の周ごとの tick-last の書き）まで読み直さない。印に heartbeat-off を足し、印の file が動いたら持ち回しの中でも集め直す（席の決め・計画の 9 節の行 e-seat-hbmark・事前の点検 d の見つけ・拠る要件は FR12 の停止の表示と NFR2 の器の変化は 5 秒以内に面へ届く）。
      在りか（src/server/seat.rs・write-set・main 71a0780 で確かめた・232 行）。pub struct Seat は pub な欄 program（OsString）・state_dir（PathBuf）・target（String）・cwd（PathBuf）を持ち、derive は Debug と Clone と PartialEq と Eq。pub fn seat_dir は席の名のコロンを下線に替えた名が path の 1 区切りになれば（空でなく・斜線を含まず・点で始まらない）state_dir の下の seat の下のその名、ならなければ None。pub fn marks（80〜85 行・doc は状態の記録と合図の最後の判定）は seat_dir が在れば [dir の下の STATE_LOG, dir の下の TICK_LAST]、無ければ空の列（pub const STATE_LOG は state.jsonl・TICK_LAST は tick-last・42〜43 行）。pub struct Seats（173〜180 行）の欄は私的な target・seat（Option<Seat>）・held（Mutex<Option<(Instant, SeatTexts)>>）で、pub fn marks は seat が在れば Seat::marks、私的な fn texts（220〜231 行）は held の Instant の elapsed が HOLD（pub const・5 秒・39 行）未満なら持ち回しの字の clone を返し、ほかは Seat::gather（3 つの出力を並べて撃ち file を読む）の字を今の Instant と一緒に held に入れて返す（lock を持ったまま集めるので、集めるあいだは次の要求を待たせる）。pub fn card と pub fn known は texts の字で中核の card を組み、口 /api/seat（src/server/routes/seat.rs）と次の一手の口がそれを呼ぶ。module の doc は 3 つの出力と file の読みを 5 秒持ち回す旨を書く（8 行）。use は std の ffi・path・sync::Mutex・thread・time の Duration と Instant と、契約と中核の item と super::ledger::capture。
      在りかの補い（読むだけの file・確かめた）。src/server/mod.rs の Server::bind_with は起動で Seats::marks を 1 度取り（195 行・let seat_marks）、変化の見張り Hub::start に渡す閉包が、周ごとに走行の印・設計の印・seat_marks・account board の印の一覧をつないだ列を返す（207〜213 行）。src/server/events.rs の Hub::watch_board はその列を POLL（500 ミリ秒）ごとに撃ち直し、file ごとの pub fn stamp（fs::metadata の更新時刻と長さ・無ければ None・57〜60 行）が前の周と違えば board-changed を 1 件送る。一覧に載ったまま無い file は None の印として数えるので、無い file が現れても消えても変化になる。src/acct.rs は pub const HEARTBEAT_OFF（字 heartbeat-off・53 行・doc は席の dir の下の合図の休みの印で変化の印にだけ使う）を持ち、account board の印（Acct::marks）は orchestrator の席の dir の state.jsonl と tick-last と heartbeat-off を持つ（347 行）。lib.rs は pub mod acct と pub mod server を持ち、server の mod.rs は pub mod events と pub mod seat を持つ。acct.rs は server::seat の const と Seat を use する（crate の中の use の往き来は組める）。面の src/view.rs の RELOAD_EVENTS は ledger-changed と board-changed の 2 つで、どちらも全部の口を読み直す。器の seat tick status の席の行は欄 target・last・age・healthy・heartbeat・step・next を持ち、heartbeat の値は席の dir に heartbeat-off が在れば off、無ければ on（器の src/seat/tick.rs）。
      形。(a) Seat::marks は seat_dir の下の [STATE_LOG, TICK_LAST, HEARTBEAT_OFF] の 3 つを返す（順はこのまま・HEARTBEAT_OFF は crate::acct の const を use し、seat.rs に同じ字の const を足さない・doc は状態の記録と合図の最後の判定と停止の記録）。(b) Seats の held を（集めた Instant・集める前に取った印・SeatTexts）にする（印は Seat::marks の file ごとの super::events::stamp の列・私的な型の別名でよい）。texts は lock を取った後、集める前に Seat::marks の印を取り、held が在り elapsed が HOLD 未満でその印が今の印と同じなら持ち回しの字を返し、ほかは gather して（今の Instant・取った印・字）を held に入れて返す。印を集める前に取るので、集める途中の変化は次の読みで集め直す。(c) module の doc の持ち回しの文に、変化の印の file（state.jsonl・tick-last・heartbeat-off）の更新時刻と長さが集めた時と違えば 5 秒の中でも集め直す旨を足す。HOLD の値・3 つの出力の撃ち方と argv・gather・card・known・Seats::new・Seats::marks と Seats::card の形は変えない。停止の切り替えの口（routes/seathb.rs と accthb.rs）と mod.rs と events.rs は変えない。切り替えの後の board-changed は、器が停止の記録を置き終えて口が 200 を返した後、見張りが次の周（500 ミリ秒以内）で印の変化を見て送る（口から Hub を直に撃たない）。200 の後の面の読み直しは、印が動いているので集め直した今の heartbeat を受ける。
      決めた幅。印は更新時刻と長さで、同じ長さで同じ時刻の書き換えは見分けない（変化の見張りの印と同じ決まり）。集め直しは印が動いたときだけで、器の出力（tick status・doctor・usage）だけが変わり file が動かない間は今のとおり 5 秒まで前の字を返す。印の 3 つの file の stat は要求ごとに lock の中で撃つ（器の子 process は撃たない）。state.jsonl と tick-last の動き（器の管理 tick の周ごと）でも 5 秒の中で集め直すので、器の出力の撃ちは印の動きごとに 1 組増えうる（同じ動きで見張りが送る board-changed の後の読み直しは、集め直した後の印と同じなので持ち回しを返す）。account board の読み（src/acct.rs の Acct の持ち回し・5 秒）は変えない。account board の切り替えの後に account board の口が前の字を返しうる件はこの行の外（席への申し送り）。
      着地済みの歯（確かめた）。tests/server_seat.rs（548 行・接頭辞 server_seat_ の 10 本）は直さずに通る。server_seat_holds_outputs_five_seconds は 5 秒の中の 2 回の読みで器が argv の頭ごとに 1 回、HOLD と 300 ミリ秒の後の読みでもう 1 回ずつ撃たれることを見る（印の file を動かさないので今の決まりのまま当たる）。server_seat_state_files_send_board_changed は state.jsonl と tick-last の書き換えで 5 秒以内に board-changed が届くことを見る。ほかの 8 本の読みは 1 回か、作業場ごとに 1 回。歯の file の私的な struct Place（fn new・seat_dir・fail・slow・calls・config・serve_with・serve・expected_texts）と fn wait_event と fn seat_card はそのまま使い、足さない。着地済みの歯 tests/hbconf.rs は server_seat.rs の fn config の本文を読むので、fn config は変えない。src/server/events.rs の単体の歯（server_src_watch_rereads_without_marks・server_read_watch_board_sends_on_marks）と src/server/ledger.rs の server_src_marks_are_two_files は Seat の印を使わない（読むだけ）。境界のほかの歯で席の target を渡して server を立てるのは tests/epolq.rs だけで、口 /api/seat と次の一手の口を撃たず偽の器が撃たれないことを見る（集める道は変わらない）。
      測り方。verify は cargo nextest run -p tsuzuri-boundary --test server_seat --no-tests=fail hbmark_（新しい 3 本）と、同じ file の server_seat_（着地済みの 10 本）と xtask の check。新しい歯は server_seat.rs の末尾に足し、名は接頭辞 hbmark_ で始める（hbmark_marks_name_three_files・hbmark_off_file_sends_board_changed・hbmark_card_follows_off_file）。歯の file の use に tsuzuri_boundary::acct::HEARTBEAT_OFF と server::seat の Seat を足す。停止の記録を置くか消し、偽の器の out-tick の字の席の行の heartbeat の語を替える私的な補いの fn（test でない・名の頭は hbmark_）を置いてよい。main 71a0780 の contracts の verify の filter の語 207（ほかの語を部分の字として含まない語に畳んで 137）のどれも新しい名に含まれず、接頭辞 hbmark_ もどの語も含まない（近い語 shb_・ghb_・fmark_・cmark_・server_seat_ も含まない・試作の lint で確かめた）。試作（main の写しに当てた）で 3 本と着地済みの 10 本が通り、印から heartbeat-off を外すと 3 本とも落ち、印を見ずに 5 秒持ち回すと hbmark_card_follows_off_file が停止の記録の後の読みの heartbeat で落ちることを同じ写しで確かめた。
      依存と順。depends は空。計画の依存の字 g-seat-hb（切り替えの button）と口の e-seat-hb は着地済み。計画の 5 節の鎖（boundary/server/seat.rs は e-seat-hbmark → c-seat-grace）で、この行が先。これから src/server/seat.rs か tests/server_seat.rs を write-set（置き場だけの = を含む）に持つ行（計画だけの行 c-seat-grace ほか）とは器が同時に流さないので、順は便の bead の依存で持つ。同じノートの行 t-qgate-tidy とは書く file も置き場だけの = の file も重ならないので並べて流す。src/acct.rs は読むだけで、その pub const HEARTBEAT_OFF を use する（acct.rs を書く計画の行 a-lean と c-acct-spark が const の名か値を変えるなら、その行がこの use も直す）。外の依存は足さず、Cargo.toml・mod.rs・events.rs・routes・契約と中核と面の crate・fixture は触らない。events.rs の module の doc の 1 文（便 e-seat は席の状態の file〔state.jsonl と tick-last〕の印を板の印に足す）は heartbeat-off を名指さないまま残る（範囲の外・席への申し送り）。行数は試作で seat.rs 232 → 242・server_seat.rs 548 → 649。

