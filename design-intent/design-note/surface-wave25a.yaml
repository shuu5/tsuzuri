  - n: 3
    type: prose
    title: 行 r4-core-tests — 中核の歯の関数の粒度の違反 35 を差の file で直し、r4-args-mark の 6 つの属性を外す
    body: |
      在りか。main ca8bca7b。差の file docs/design/patch/r4-core-tests.patch は、起草 w57a が main ca8bca7b に試作の commit（写し drafts/w57a-p の dd677c21）を載せ、git diff --no-color --full-index で write-set の書く file の 20 だけを切った。main の木で git apply --check が rc 0、試作の木で git apply --reverse --check が rc 0。試作の関数の中身は main bec78d34 の写しで撃った物と同じ（間の main の違いは design-intent だけ）。

      なぜ。規則の行 R-4 の関数の粒度（関数 60 行 以下と複雑度 15 以下と引数 5 以下）を歯にも当てる行の 1 つ（割りと拠りは 1 節・判断の記録 ADR-25 の決定 (1) と条 P-22.1 と条 P-24.3 のとおりで新しい問いは要らない）。中核の歯（src の外の tests/ の 20 file）の違反を 0 にし、中核の全部の target を 3 つの lint の -D で撃つ。中核の src の cfg(test) の区間の違反は 0。

      形。20 file の 31 の関数の違反 35（行 13・複雑度 16・引数 6）を、長い歯の関数の末か中ほどの塊を直後の新しい関数へ字のまま移して割る（足す関数 27・移す塊の字下げは替えない形を第一にし、tests/qgate.rs の fn output_cases と tests/plimit.rs の fn pipes_1125 と fn pipes_1200 に移す塊だけ字下げが 8 浅い）。引数の違反の 6 関数（acctpcore.rs の fn seat_card・athr.rs の fn pressure・csled.rs と nsum.rs の fn sum_line・pci.rs と pclosed.rs の fn card）は、行 r4-args-mark の expect の 4 行を消し、関係のある引数を組（tuple）に束ねて頭の引数の位置の pattern で受け（本体の行は替えない）、呼ぶ所は束ねた引数を括弧で囲む（長くなった呼びは rustfmt の既定の形で 1 引数 1 行に折る）。移した行で字を替えたのは athr.rs の let n_p の呼びの 1 行だけ。字の正本は差の file で、足す関数の頭と移す行と doc の行と形を替えた行の全部を持つ。歯の名（#[test] の fn の名）と #[test] の属性と、歯が比べる字と数と順は替えない（着地済みの行の done が歯の名を名指す）。足す関数はどれも private で #[test] を持たず、割った元の関数の直後に置く。書く file に rustfmt と cargo fmt を撃たない（ほとんどは rustfmt の形でなく、撃つと差の外の行が替わる）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done (1) は verify の 1 行目（git apply --reverse --check・差の hunk が全部木に在れば rc 0、当てる前の木では rc 1）で測る。done (2) は verify の 2 行目（clippy）で測る。done (3)〜(6) は verify の 3〜22 行目の nextest の撃ち（file ごとに 1 行・歯の名の filter は置かない）で測る。verify の最後の行の xtask の check は repo の全部の歯と床を撃つ（done の項は持たない）。

      verify の clippy の形。cargo clippy -p tsuzuri-core --all-targets --no-deps に旗 -D warnings と 3 つの lint の -D を渡す。--all-targets は中核の lib と歯の crate の全部と lib の cfg(test) の区間を撃ち、--no-deps は中核だけに旗を当てる。6 つの属性を外し忘れれば満たされない expect として -D warnings が落とす。

      構造の連鎖。足す関数と形を替える関数は file の中で private で、ほかの file から呼ばれない（歯の crate は file ごとに別の crate）。どの file も 1,500 行の内（最大 tests/fdlt.rs の 653 行）。

      試作と噛み。差の file の噛みは、当てる前の main の木で verify の 1 行目が rc 1（done (1) の項）。噛みと xtask の check は写しの commit aaaa34e8（このノートの 4 行の試作を順に積んだ木）で撃った。書く file は write-set の中で閉じる（写しの commit b206e32f から a8279571 への git diff --name-only が write-set の 20 と同じ）。cargo run -q -p xtask -- check は rc 0（分けない全部）で、中核・契約・folio・境界の 4 package の全部の target を R-4 の 3 つの lint の -W で撃つと、中核と契約と folio の在りかの診断は 0（残りは境界の歯の 72・このノートの行 r4-boundary-tests-a と r4-boundary-tests-b が直す）。変異は 6 つで、done の各項が少なくとも 1 つで落ちた（clippy の落ちは rc 101 と lint の名で、nextest の落ちは rc 100 で数え、nextest の rc 101〔組み立ての誤り〕は数えない・変異の後は file の字を元に戻した・対照は変異の前の xtask の check の rc 0）。(c1) tests/qgate.rs を試作の前の字（この行の前の写しの commit の字）に戻す → その file を撃つ clippy の verify の行が rc 101（lint too_many_lines か cognitive_complexity の -D で落ちた）・done (2) の項。(c2) tests/pci.rs の fn card の前に行 r4-args-mark の expect の 4 行を戻す → その file を撃つ clippy の verify の行が rc 101（lint unfulfilled_lint_expectations の -D で落ちた）・done (2) の項。(c3) tests/acctcore.rs の足す関数 fn unread_seat の本体の頭に assert!(false, ＂噛み＂) の 1 行を挿す → その file を撃つ nextest の verify の行が rc 100（歯が落ちた）・done (3) の項。(c4) tests/g3g7.rs の足す関数 fn fixture_holds_rows の本体の頭に assert!(false, ＂噛み＂) の 1 行を挿す → その file を撃つ nextest の verify の行が rc 100（歯が落ちた）・done (4) の項。(c5) tests/pclosed.rs の足す関数 fn events_cs4 の本体の頭に assert!(false, ＂噛み＂) の 1 行を挿す → その file を撃つ nextest の verify の行が rc 100（歯が落ちた）・done (5) の項。(c6) tests/qgate.rs の足す関数 fn output_cases の本体の頭に assert!(false, ＂噛み＂) の 1 行を挿す → その file を撃つ nextest の verify の行が rc 100（歯が落ちた）・done (6) の項。

      流す時と順。depends は空（24a の行はこのノートの外で、全部が着地した後にこのノートを置く）。このノートのほかの行と書く file は重ならない。範囲の外。src の本体と build.rs（ノート surface-wave24a の本体の行が直した）。境界の crate の歯（このノートの 7〜8 節の行）と面の crate の歯（後の行）。根の Cargo.toml の workspace の lint の表への R-4 の 3 つの lint の足しと、24a の行 r4-folio-src-a と r4-folio-src-b が置いた module の属性と歯 klintf_r4_module_deny を消すこと（最後の表の行）。clippy.toml。
