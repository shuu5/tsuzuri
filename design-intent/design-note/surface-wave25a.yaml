      在りかの main は 36934ac4。差の file docs/design/patch/r4-boundary-tests-a.patch は、起草 w57b が main ca8bca7b に行 r4-boundary-tests-a と b の試作を載せた commit（写しの fe9f7c54）から、この行の書く 19 file だけを git diff --no-color --full-index で切った（23,619 byte・19 file・main ca8bca7b で git apply --check が rc 0、試作の木で git apply --reverse --check が rc 0）。書く file は write-set の 19（境界の crate の歯の file）で、差はこの 19 file に閉じる。差の file は main が差の触れる file を動かすと当たらなくなるので、席は置く直前に当たるかを撃ち直す。

      なぜ。規則の行 R-4 の関数の粒度（関数 60 行 以下と複雑度 15 以下と引数 5 以下）を歯にも当てる直しの 1 行（1 節の目的のとおり・判断の記録 ADR-25 の決定 (1) と条 P-22.1 と条 P-24.3・新しい問いは要らない）。境界の crate の歯の違反 72（31 file・引数 0）を 2 行に割り、この行は 19 file を持つ（残りは行 r4-boundary-tests-b）。境界の歯に行 r4-args-mark の expect の属性は無い。今の数（main bec78d34・clippy 0.1.98・根の clippy.toml の閾値で 3 つの lint を -W で撃った・ca8bca7b まで歯の file は動いていない）は、この行の 19 file の違反 37（行 21・複雑度 16・引数 0）・関数 31・file 19。

      形。31 の関数（どれも #[test] の fn）を、関数の本体の最上位の文の切れ目に呼びの行と新しい private な関数の頭を差し込んで割る（足す関数 33・それぞれ頭の直前に /// の doc の行 1 行・移す行は字のまま、その場に残る）。後半が前半の束縛を使う所は引数で渡し、evkind.rs は 4 つの path を元の let と同じ形の tuple の 1 つの引数に束ねる。形を替えた所は、pgz.rs の表 cases を 5 件目の後で 2 つに分けた所（配列を vec! と extend に）と、pmisroute.rs の use の 1 行（足す関数が受信の口を値で受ける型の名 Subscription を足す）だけ。#[test] の行と次の fn の行（歯の名）は替えず、#[test] の fn を足さない（中核の歯が境界の fdlt.rs・gextw.rs・pmisroute.rs の #[test] の次の行から歯の名を読んで数える）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done (1) は verify の 1 行目（git apply --reverse --check）、done (2) は 2 行目（clippy の撃ち）、done (3) から (6) は 3 行目から 21 行目（歯の file ごとの nextest・done の file の順・filter の語は置かない）で測る。verify の最後の行（xtask の check）は workspace の全部の歯と大きさの数えを撃つ（done には名指さない）。clippy の行は cargo clippy -p tsuzuri-boundary に 19 の --test と --no-deps を渡し、名指した歯の crate と組みに入る境界の lib と build.rs だけを撃つ（--tests と --all-targets を使わない・境界の package の [[test]] が組む folio の歯は撃たない）。

      構造の連鎖（grep で全部）。足す関数はどれも歯の crate の中の private な関数で、ほかの file から呼ばれない。境界の src は書かない。中核の歯 fdlt_own_names_clean・gext_names_clean・pmisfit_own_names_clean は歯の名の数と接頭辞を照らし、試作の木で緑（xtask の check が撃つ）。ほかにこの行の file の字を読む着地済みの歯は無い。書く file はどれも tests/ の下で、器の受付の余地の検査（1 file 1,500 行）は crate の src の下だけを見るので当たらず、欄 growth は置かない。

      試作と噛み。試作の木（main ca8bca7b に a と b の試作・写しの fe9f7c54）で、verify の git apply の行と clippy の行が rc 0、歯の file の nextest は本数が前の木と同じで緑、xtask の check（分けない全部）は rc 0（verify の 37 行を 1 本ずつ撃ち全部 rc 0・w/verify2.log）。噛み（main bec78d34 に folio の本体の行 b と c の試作を載せた前の写しで撃った・歯の file の字は同じ・w/bite-a.log）は変異 23 を 1 つずつ当て、どれも名指した歯を落とした（file ごとに最初に足した関数の本体の頭に落ちる断言を 1 行挿す変異 19 は、その歯の file を rc 100 で落とした・境界の fdlt.rs と gextw.rs と pmisroute.rs の #[test] の fn の名の接頭辞を替える変異 3 は中核の名の歯 fdlt・gext・pmisfit を rc 100 で落とした・dstg.rs を割る前の字に戻す変異 1 は clippy の行を rc 101 で落とした）。verify の 1 行目は main ca8bca7b（差を当てる前）で rc 1。

      範囲の外。境界の歯の残り（行 r4-boundary-tests-b）。境界の package の [[test]] が組む folio の歯（このノートの folio の歯の行）。中核と契約と面の歯。根の Cargo.toml の表と一覧 ENABLED と clippy.toml（後の表の行）。境界の src。depends は空（書く file はこのノートのほかの行と重ならない）。境界の歯は持ち込んだ folio に依るので、ノート surface-wave24a の r4-folio-src-b と r4-folio-src-c の着地の後に流す（このノートは 24a の全部の着地の後に置かれる）。

