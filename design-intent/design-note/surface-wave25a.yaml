      規則の行 R-4 の関数の粒度（関数 60 行 以下・複雑度 15 以下・引数 5 以下）を、tsuzuri の member の歯（src の外の tests/ と、src の cfg(test) の区間）にも当てる。本体（src と build.rs）の直しは、ノート surface-wave24a の行 r4-args-mark・r4-core-src・r4-boundary-src・r4-surface-src・r4-folio-src-a・r4-folio-src-b・r4-folio-src-c が済ませた。判断の記録 ADR-25 の決定 (1)（行数の 3 つは src の下だけを数え、関数の粒度はこの決めの外で lint で見る）と条 P-22.1（関数の粒度の上限を CI が実測する deny の門として持つ）と条 P-24.3（lint の例外は理由を持つ expect の属性だけ・歯の範囲の例外は lint の設定で宣言するが、clippy.toml に 3 つの lint の歯の範囲の鍵は無い）のとおり、歯の関数も同じ閾値で縛る。歯の行は crate ごとに違反を関数を割って直し（歯の名の #[test] の fn の名は替えない・着地済みの行の done が名指す）、行 r4-args-mark が歯に置いた expect の属性を外す。最後の行で、根の Cargo.toml の workspace の lint の表に too_many_arguments・too_many_lines・cognitive_complexity を forbid で足し、xtask の歯 klint の一覧を合わせる。
