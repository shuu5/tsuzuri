      在りかの main は 36934ac4。差の file docs/design/patch/r4-boundary-tests-b.patch は、起草 w57b が main ca8bca7b に行 r4-boundary-tests-a と b の試作を載せた commit（写しの fe9f7c54）から、この行の書く 12 file だけを git diff --no-color --full-index で切った（37,601 byte・12 file・main ca8bca7b で git apply --check が rc 0、試作の木で git apply --reverse --check が rc 0）。書く file は write-set の 12（境界の crate の歯の file）で、差はこの 12 file に閉じる（置き場だけの = の tests/hbconf.rs は verify の行が撃つ・書かない）。差の file は main が差の触れる file を動かすと当たらなくなるので、席は置く直前に当たるかを撃ち直す。

      なぜ。規則の行 R-4 の関数の粒度（関数 60 行 以下と複雑度 15 以下と引数 5 以下）を歯にも当てる直しの 1 行（1 節の目的のとおり・判断の記録 ADR-25 の決定 (1) と条 P-22.1 と条 P-24.3・新しい問いは要らない）。境界の crate の歯の違反 72（31 file・引数 0）を 2 行に割り、この行は 12 file を持つ（残りは行 r4-boundary-tests-a）。境界の歯に行 r4-args-mark の expect の属性は無い。今の数（main bec78d34・clippy 0.1.98・根の clippy.toml の閾値で 3 つの lint を -W で撃った・ca8bca7b まで歯の file は動いていない）は、この行の 12 file の違反 35（行 23・複雑度 12・引数 0）・関数 29・file 12。

      形。29 の関数（うち #[test] でない手の関数 8〔server_acct.rs の impl Place の lay と expected・server_seat.rs と stcli.rs と stnfy.rs と strelay.rs の new・stcli.rs と strelay.rs の serve〕）を、関数の本体の最上位の文の切れ目に呼びの行と新しい private な関数の頭を差し込んで割る（足す関数 33・それぞれ頭の直前に /// の doc の行 1 行・impl の中の new と lay と expected は同じ impl の関連の関数に割る）。後半が前半の束縛を使う所は引数で渡し、rvk.rs は (old, id) の組、server_batch.rs は (d2, d3, d4) の組を tuple の 1 つの引数に束ねる。形を替えた所は、server_batch.rs と stcli.rs の表の歯の表を分けた所（server_batch.rs は for の表を vec! と chain に、stcli.rs は 3 つに分けて関数の鎖 parse_more → parse_last → parse_refusals でつなぐ）と、入れ子の中を抜いた 3 つの塊（server_acct.rs の unknown_rows は字下げが 4、stcli.rs と strelay.rs の respond は 8 減る・respond は今の頁などを値で受けて値で返す）だけ。#[test] の行と次の fn の行（歯の名）は替えず、#[test] の fn を足さない。fn config（歯 hbconf が本体の字を読む）は触らない。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done (1) は verify の 1 行目（git apply --reverse --check）、done (2) は 2 行目（clippy の撃ち）、done (3) から (6) は 3 行目から 14 行目（歯の file ごとの nextest・done の file の順・filter の語は置かない）で測る。done (7) は 15 行目（歯 hbconf）で測る。verify の最後の行（xtask の check）は workspace の全部の歯と大きさの数えを撃つ（done には名指さない）。clippy の行は cargo clippy -p tsuzuri-boundary に 12 の --test と --no-deps を渡し、名指した歯の crate と組みに入る境界の lib と build.rs だけを撃つ（--tests と --all-targets を使わない・境界の package の [[test]] が組む folio の歯は撃たない）。

      構造の連鎖（grep で全部）。足す関数はどれも歯の crate の中の private な関数で、ほかの file から呼ばれない。境界の src は書かない。着地済みの歯 tests/hbconf.rs の hbconf_teeth_fill_the_rest_with_new が server_batch.rs と server_seat.rs の fn config の本体の字を読む。ほかにこの行の file の字を読む着地済みの歯は無い。書く file はどれも tests/ の下で、器の受付の余地の検査（1 file 1,500 行）は crate の src の下だけを見るので当たらず、欄 growth は置かない（stcli.rs は前から 1,500 行を越える・1,746 → 1,813）。

      試作と噛み。試作の木（main ca8bca7b に a と b の試作・写しの fe9f7c54）で、verify の git apply の行と clippy の行が rc 0、歯の file の nextest は本数が前の木と同じで緑、xtask の check（分けない全部）は rc 0（verify の 37 行を 1 本ずつ撃ち全部 rc 0・w/verify2.log）。噛み（main bec78d34 に folio の本体の行 b と c の試作を載せた前の写しで撃った・歯の file の字は同じ・w/bite-b.log）は変異 14 を 1 つずつ当て、どれも名指した歯を落とした（file ごとに最初に足した関数の本体の頭に落ちる断言を 1 行挿す変異 12 は、その歯の file を rc 100 で落とした・server_batch.rs の fn config の ..Config::new( の .. の後に空白を入れる変異 1 は歯 hbconf を rc 100 で落とした・stcli.rs を割る前の字に戻す変異 1 は clippy の行を rc 101 で落とした）。verify の 1 行目は main ca8bca7b（差を当てる前）で rc 1。

      範囲の外。境界の歯の残り（行 r4-boundary-tests-a）。境界の package の [[test]] が組む folio の歯（このノートの folio の歯の行）。中核と契約と面の歯。根の Cargo.toml の表と一覧 ENABLED と clippy.toml（後の表の行）。境界の src。depends は空（書く file はこのノートのほかの行と重ならない）。境界の歯は持ち込んだ folio に依るので、ノート surface-wave24a の r4-folio-src-b と r4-folio-src-c の着地の後に流す（このノートは 24a の全部の着地の後に置かれる）。

