    title: 行 c-note-stale — tz graph --check に全部の行が着地した設計ノートの行を出す
    body: |
      在りかの main は f925e4e（計画 surface-plan 第 0.72 版）。試作は main bc5d92a（計画 第 0.70 版）で撃ち、bc5d92a から f925e4e までの差（着地した行 g-ledger-kind と、設計ノート surface-wave18f・surface-wave20c と計画）はこの行の書く file と歯に当たらず、f925e4e に 2 行を当てた木でも verify の歯が通る。 中核の crate tsuzuri-core の src/graph/check.rs（pub mod graph の pub mod check）と、境界の crate tsuzuri-boundary の src/server/board.rs と src/cli/graph.rs を書く。同じノートの行 k-g9-count の着地の後に、その着地した字に足す（下の 在りか の字は k-g9-count の節の形・着地の後に便の起動の前に当て直す）。

      なぜ。持ち主の裁定 t3-hub.66.1（判断の表 d38・設計ノートの一生を規則にする・吸収して退役し状態 retired で置き場に残す・退役の忘れを名指す）の 退役の忘れを名指す 手。全部の契約表の行が着地したのに退役していない設計ノートは、地図と索引に済んだ行を残し続ける（条 N-1 の増殖の防止）。最初は数えるだけで落とさない（folio の後継の欄の先を広げる変更の着地まで）。

      決めた幅（設計ノートの状態は読まない）。folio（pin 1c7f927）の索引は設計ノートそのものを節点にせず、設計ノートの行の節点（種類 設計ノートの行・id は文書 id と行 id を井桁でつないだ字）を状態を問わず全部のノートから出し、索引の表にも要約の JSON（欄 id・kind・file・line・title・plain・eng）にも状態の欄は無い（判断の表 d39 の folio の側の 索引の状態の欄 は未着地）。tsuzuri は設計文書の YAML を走査しない（計画 3 節の席の決め）。そのため、この行は状態を読まず、全部の行が着地した設計ノートを名指す。今の main で状態が retired のノートは 0 なので、名指す組は状態が effective のままの組と同じ。状態の読みは、folio の索引の状態の欄の着地と folio の pin を上げる席の commit の後の行（g-map-retired と同じ commit か、その後）で足す。それまでは退役したノートも名指しうる。

      決めた幅（着地の読み）。器の局面の出力（lifecycle.json）の着地までのつなぎとして、便の bead の閉じた理由を読む（器の席の答え 2026-09-29・席の決め 2026-09-29）。着地した bead は、状態が closed で、閉じた理由の前の空白を除いた字が LANDED の 2 つの字のどちらかで始まり、その後が字の終わりか空白か全角の丸括弧の開きの bead。2 つの字は、器が着地の後に書く landed（landed と commit と ci=success の形・今の台帳で 168 本）と、器の着地の前に席が手で閉じた古い便の bead の 着地（着地と空白と commit の形 35 本と、着地と全角の丸括弧の開きの形 1 本の 36 本・どれも design = の pointer を持ち、landed だけを読むと漏れていた 10 本の設計ノート surface-base・surface-board・surface-wave3a・3b・4・5a・5b・7・8a・8b の行を指す）。大文字と小文字は区別し（Landed は数えない）、頭の後の字が英数字かほかの字なら数えない（landedx・着地点 は数えない）。bead と設計ノートの行は、今のグラフの design の辺（bead の acceptance の design = の pointer の行が指す行の節点・行の節点が在るときだけ組む）で結ぶ。行は、着地した bead から design の辺を受け、開いた bead（中核の BeadAttr::is_open・closed と tombstone でない）から design の辺を受けないとき着地した行。猶予は置かない（detect は落とさないので、最後の行の着地の直後から名指す・猶予の値は落とす側の後の行で持ち主に諮る）。1 か所で差し替わる形: 着地の述語は私的な fn landed の 1 つで、局面の出力の着地の後の行（c-map-lc か局面を読む後の行）がそこを替える。

      在りか（中核・write-set・今の main の字）。check.rs の use は std の BTreeMap と BTreeSet・serde の Serialize・契約の board::Reading と graph の EdgeType と NodeKind・ledger の MEMO_LABEL・super の Graph と Source。私的な fn pairs（Graph と EdgeType を受け、その型の辺の from と to の組の Vec を返す）と、pub fn unsummarized・pub fn unfielded_mentions（床の値・不変条件でない・この 2 つの後に単体の歯の mod tests）。使う物（この行は書かない）: build.rs の pub(crate) fn read_ledger（台帳の字を pub(crate) struct BdBead の Vec に読む・空か JSON の配列でなければ None）と BdBead の pub(crate) な欄 id（String）と status・close_reason（どちらも Option の String）。mod.rs の Graph の pub な欄 nodes・edges・beads（id から BeadAttr）と pub fn is_read、BeadAttr の pub fn is_open。グラフの design の辺は from が bead の id、to が設計ノートの行の id。

      形（中核）。module の doc に 1 行（全部の契約表の行が着地した設計ノートは床の値で landed_notes が名指す）を足す。use に super::build の BdBead と read_ledger を足す。mod tests の前に pub const LANDED（&str の 2 つの配列・landed と 着地）と私的な fn landed（BdBead の参照を受け bool）と pub fn landed_notes を置く。landed_notes は、設計の出所か台帳の出所が読めないか、read_ledger が None なら Unknown。読めたら、着地した bead の id の組と、pairs の Design の辺を作り、種類が NoteRow の節点ごとに id を最初の井桁で文書 id と行 id に分け（井桁の無い id は数えない）、文書 id ごとに全部の行が着地した行かを束ね、全部が着地した文書 id を字の順・重複なしの列にして Known で返す。

      形（境界）。board.rs の pub struct Floors に pub な欄 landed（Reading の String の Vec）を足し、pub fn built_floors は landed_notes に組んだ Graph と Texts の欄 ledger の字を渡した値を入れる。cli/graph.rs に pub const LANDED_HEAD と pub const LANDED_UNKNOWN と pub fn landed_line（列が空なら LANDED_HEAD と空白と 0、在れば LANDED_HEAD と空白と数と全角の丸括弧で囲んだ中黒つなぎの文書 id・違反の行と同じ形）を足す。fn check は本文だけで名指した id の対の行の次に、landed が Known なら landed_line の行を標準出力へ、Unknown なら標準エラーへ、ほかのまだ分からないの行と同じ頭（井桁と空白とまだ分からないとコロンと空白）の後に LANDED_UNKNOWN を続けた行を出す。Design の枝の Floors の landed は Unknown。終了 code は overall の値のまま。file の頭の doc の --check の項に 2 行足す。

      字の形（書き手と読み手）。行は人が読むだけで、読み手の code は無い。文書 id は folio の設計ノートの meta の id（file 名の stem）で、中黒と全角の丸括弧を含まない。

      直す着地済みの歯。--check の標準出力を字で pin し、設計の索引と台帳が読める場の期待に、要約の行の直前の 全部の行が着地した設計ノート 0 の行を足す（どの場の索引にも、着地した bead の指す設計ノートの行は無い・歯 ksum と kcli と g3g7w の索引は設計ノートの行の節点を持たず、歯 kg9 の nt#r1 を指す bead は無い）。kcli（fn kcli_check_all_read_is_unknown・kcli_check_cut_line_names_k1・kcli_check_no_state_is_two・違反の行の後で要約の行の前）、ksum（fn ksum_check_names_bare の場 names と full・ksum_unread_goes_to_stderr の場 unread・場 no-bd は台帳が読めないので足さない）、kg9（fn kg9_check_names_pairs の場 names と linked・kg9_unread_goes_to_stderr の場 unread・場 no-bd は足さない）、g3g7w（要約の行の字を返す私的な fn summary の字の頭にその行を足す・場 no-bd の fn は要約の行を字で比べない）。

      測り方・歯（tests/cnote.rs・新しい file）。使う item は tsuzuri_boundary::cli::graph の LANDED_HEAD・LANDED_UNKNOWN・landed_line、server::board の Texts・built・built_floors（と Floors の欄 landed）、tsuzuri_contract::board::Reading、tsuzuri_core::graph::check の LANDED と landed_notes。場は CARGO_TARGET_TMPDIR の下の cnote の dir に歯ごとに作る。偽の設計の道具はどの引数にも索引の file を cat する（要約と裁定の書き出しは読めない）。節点の行は 5 列（id・種類・file・要約値 8 字・題）で、種類の字は条・規範文・要件・規則行・設計ノートの行、辺の行は 3 列（端・端・型）。索引の字の頭は歯 kcli と同じ見出しの 2 行（井桁で始まる節点の見出しと辺の見出し）。
      節の索引。節点 12（どれも設計ノートの行・file は design-note/<文書 id>.yaml・要約値は 00000001 から 00000012・題は見本の行）: na#r1・na#r2・nb#r1・nc#r1・nd#r1・ne#r1・ne#r2・nf#r1・ng#r1・井桁の無い nh-1（file design-note/nh.yaml）・ni#r1・nj#r1。辺は無い。
      節の台帳（epic の x と、どれも x の子で issue_type task の 13 本・acceptance は design = contracts/<文書 id>.toml#<行 id> の 1 行）。x.1 は closed・閉じた理由 landed 1111111 ci=success・na#r1。x.2 は closed・landed 2222222 ci=success・na#r2。x.3 は closed・吸収 nb は nz へ・nb#r1。x.4 は closed・頭に空白 2 つと語の間に空白 3 つと 2 つの landed 4444444 ci=success・nc#r1。x.5 は closed・landed 5555555 ci=success・ne#r1。x.6 は open・ne#r2。x.7 は closed・landed 7777777 ci=success・nf#r1。x.8 は open・nf#r1。x.9 は closed・landedx 9999999 ci=success・ng#r1。x.10 は closed・landed 1010101 ci=success・contracts/nh.toml#1（節点 nh#1 は無い）。x.11 は closed・landed 1111011 ci=success・contracts/zz.toml#r1（節点は無い）。x.12 は closed・着地（便 ni の見本）・ni#r1。x.13 は closed・着地点を見直す・nj#r1。event log は RunCreated の 1 行（run x.1-20260927T000000Z・bead x.1・stage Intake）。
      名指しの計算。na は 2 行とも着地、nc は頭の空白を除いた字が landed と空白で始まり着地、ni は 着地 と全角の丸括弧の開きで始まり着地、nb は閉じた理由の頭が 2 つの字のどちらでもない、nd は bead が無い、ne は r2 を開いた x.6 が指す、nf は r1 を着地した x.7 と開いた x.8 が指す、ng は landed の後が英字 x、nj は 着地 の後が字 点、nh-1 は井桁が無く数えない。まだ分からないの数 3 は g-3・g-7（書き出しが読めない）と g-9 で、違反は 0（open の task の x.6 と x.8 は pointer の行を 1 つ持つ・全部の bead は根の x へ着く・走行は x.1 を持つ）。

      試作（main に k-g9-count とこの行を当てた土台）で cnote の 5 本と着地済みの歯 kcli・ksum・kg9・g3g7w が通り、噛みを見た（開いた bead の見張りを外す・閉じた状態を見ない・着地の頭を数えない・頭の後の字を見ない・頭の前の空白を除かない・読めない行を出さない・着地の行を出さない、でそれぞれ名指した歯が落ちる）。実の main の design-intent と台帳で撃った --check は 全部の行が着地した設計ノート 59 の行を出す（設計ノートの行を持つノート 62 のうち、開いた便の bead の在る surface-wave13h と、便の bead の無い傘の行を持つ surface-base〔行 e と f〕と surface-board〔行 g・h・i・j・k〕は名指さない）。

