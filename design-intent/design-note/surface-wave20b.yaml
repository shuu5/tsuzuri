  - n: 3
    type: prose
    title: 行 k-g9-count — tz graph --check に本文だけで名指した id の対の行を出す
    body: |
      在りかの main は f925e4e（計画 surface-plan 第 0.72 版）。試作は main bc5d92a（計画 第 0.70 版）で撃ち、bc5d92a から f925e4e までの差（着地した行 g-ledger-kind と、設計ノート surface-wave18f・surface-wave20c と計画）はこの行の書く file と歯に当たらず、f925e4e に 2 行を当てた木でも verify の歯が通る。 境界の crate tsuzuri-boundary の src/server/board.rs（pub mod server の pub mod board）と src/cli/graph.rs（pub mod cli の pub mod graph）を書く。

      なぜ。中核の床の関数 crates/tsuzuri-core/src/graph/check.rs の pub fn unfielded_mentions（Graph の参照と、要約の字を読めたかの bool を受け、String の組の Vec の tsuzuri_contract::board::Reading を返す・行 c-g9・着地済み）は、設計の節点の本文で名指した設計文書の id のうち欄にも辺にも無い対（不変条件 g-9 の detect の数）を名指すが、呼ぶ所が中核の歯 cg9 の中だけで、tz graph --check に出ない。g-9 は 2 周の実測の後に落とす側へ替える（計画の後の行 c-g9-deny）ので、その前に --check の出力で数を見られるようにする（席の決め 2026-09-29・g-9 は detect の間は数えるだけで落とさない・要件 FR3 の 名指した id は欄にも在る）。今の main の design-intent で撃つと対は 16 で、同じ見方の数（行 c-g9 の起草の測り）と合う。

      在りか（write-set・今の main の字）。board.rs の pub fn built（Texts の参照を受け Graph を返す）は私的な fn summed（Graph と、add_summary の返りの bool の組を返す）の組の 1 つ目を返し、pub fn built_bare（Graph と String の Vec の Reading の組を返す・行 k-sum-count）は summed の組と中核の check::unsummarized の値を返す。use は tsuzuri_contract::board の PipelineBoard と Reading、tsuzuri_core::graph の self・Graph・Inputs・Invariant ほか。cli/graph.rs の pub const BARE_HEAD（字 要約の無い節点）・pub const BARE_UNKNOWN（字 要約の無い節点（要約か設計の索引か台帳が読めない））・pub fn bare_line、私的な fn run（Doc と Check の枝で board::built_bare を呼び、Design の枝で Reading::Unknown を渡す）と私的な fn check（引数 invariants・outside・bare を受け、違反の行を標準出力、まだ分からないの行を標準エラーに出した後、要約の行の前に、bare が Known なら bare_line の行を標準出力へ、Unknown なら標準エラーへ井桁と空白とまだ分からないの頭の字とコロンと空白の後に BARE_UNKNOWN を続けた行を出し、要約の行 tz graph --check と全角の丸括弧の中の違反とまだ分からないの数を出して overall の終了 code を返す）。use は crate::server::board の self・Sources・Texts。

      形（board.rs）。pub struct Floors（derive は Debug・Clone・PartialEq・Reading は Eq を持たないので Eq は付けない）を置き、pub な欄 bare（Reading の String の Vec・中核の unsummarized の値）と unfielded（Reading の String の組の Vec・中核の unfielded_mentions の値）を持つ。pub fn built_floors（Texts の参照を受け Graph と Floors の組を返す）は summed の組の Graph と bool を 2 つの床の関数に渡す。built と built_bare と ほかの fn の外形と値は変えない（built_bare の doc の tz graph --check が使う の字だけを外す）。

      形（cli/graph.rs）。pub const UNFIELDED_HEAD は字 本文だけで名指した id の対、pub const UNFIELDED_UNKNOWN は字 本文だけで名指した id の対（要約か設計の索引が読めない）。pub fn unfielded_line は、列が空なら UNFIELDED_HEAD と空白と 0、在れば UNFIELDED_HEAD と空白と数と、全角の丸括弧で囲んだ、本文を持つ節点の id と矢印 → と名指した id をつないだ字の中黒つなぎ（列の順のまま）。fn run の Doc と Check の枝は board::built_bare の代わりに board::built_floors を呼び、Design の枝は 2 つの欄が Unknown の Floors を渡す（出さない）。fn check は引数 bare の代わりに floors（Floors の参照）を受け、要約の無い節点の行の次に、unfielded が Known なら unfielded_line の行を標準出力へ、Unknown なら標準エラーへ、要約の無い節点と同じ頭の後に UNFIELDED_UNKNOWN を続けた行を出す。終了 code は overall の値のまま（対の数で変えない）。use に board の Floors を足す。file の頭の doc の --check の項に 2 行足す。

      字の形（書き手と読み手）。対の行は人が読むだけで、読み手の code は無い（口 /api/graph の電文にも出さない）。id は folio の索引の id（設計ノートの行は文書 id と行 id を井桁でつないだ字）で、区切りの矢印 → と中黒・と全角の丸括弧はどれも ASCII でなく、folio の id の文法の外の字。井桁を含む id の見本 nt#r1 を (1) と (2) の見本に入れる。

