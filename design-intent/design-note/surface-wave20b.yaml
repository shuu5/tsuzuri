      CLI の小さな行 2 つ（どれも S・detect の数を tz graph --check に出すだけで落とさない）。
      k-g9-count は境界の server の board に床の値の組 Floors と fn built_floors を置き、tz graph --check が要約の無い節点の行の次に、中核の unfielded_mentions の対（設計の節点の本文で名指した id のうち欄にも辺にも無い対・不変条件 g-9 の detect の数）の数と対を 1 行で出す。
      c-note-stale は中核の check に fn landed_notes を置き、tz graph --check が対の行の次に、全部の契約表の行が着地した設計ノートの数と文書 id を 1 行で出す。着地は器の局面の出力の着地までのつなぎとして便の bead の閉じた理由の頭の語 landed を読み、設計ノートの状態は folio の索引に無いので読まない。
      どちらも読めなければ標準エラーにまだ分からないの 1 行を出し、終了 code は変えない。契約の crate と外の依存は変えない。
