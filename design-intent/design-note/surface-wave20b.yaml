      読み手の grep（契約・中核・境界・面の crate の tests と src と xtask を、字 server::board と board:: の fn の名と cli::graph と built_bare と BARE_ と graph --check と --check で探した）。board.rs の item を使う src は cli/graph.rs と server/mod.rs と routes の around・graph・graphview・metrics・next・pipeline・unreflected（どれも外形の変わらない fn を呼ぶ）、歯は dnskipw（cli::graph の design_view）・g3g7w・kcli・ksum。--check を撃つ歯は g3g7w・kcli・ksum だけで、xtask と面と契約の crate は使わない。口の読みを撃つ着地済みの歯 server_read・nsumw と dnskipw は期待を直さず、置き場だけの = で持って verify で撃つ。口の読みの歯 server_view は、走行を待つ便 c-unref-now（ノート surface-wave18f）が書くので持たない（この行は server_view が撃つ口の fn を変えない）。
