# 設計ノート — 欄の決まり（folio init の雛形・生成区間は folio schema --write が書く）
meta: {id: design-note-schema, version: 1, date: 2026-09-24, decided_by: [ADR-1], owner: 持ち主, author: 未記入}
# folio:schema:begin — 生成区間・手で直さない・正本は実装の定数（folio schema --write が書く）
schema:
  floor_note: 以下の欄は床の実装の定数からの導出物である（生成区間）。型も値も床の定数と違わないことを folio check が数える（判断の記録の欄の決まりと同じ）。変えるときは床の実装の定数を直し、folio schema --write で書き直す。
  path_base: repo-root
  path_base_note: 本 file と設計ノートの中の path（fixture・parts.json・導出物）は repo の根からの相対で書く。
  date_format: ^\d{4}-\d{2}-\d{2}$
  doc:
    required: [meta, sections]
    optional: [figures, sources]
    sources: {in_ref_population: false}
    doc_note: 1 設計ノート = YAML 1 file。節（sections）の並びが本文。外部への参照（報告 HTML 等）は sources に置き、参照 id の母集団に入れない（in_ref_population = false）
  doc_meta:
    required: [id, title, version, status, generated, profile]
    optional: [approval, supersedes, superseded_by, note]
    id_pattern: ^[a-z][a-z0-9-]*$
    id_note: 文書 id（doc id）= file 名の stem。append-only＝改名は「新しい id + 旧 id の廃止（status retired・superseded_by）」で表し、番号や名を再利用しない。契約 id は「<doc id>#<row id>」の形で、前半がこの id（器 scribe2 の契約表と同じ形）
    version_pattern: ^v[0-9]+\.[0-9]+$
    status_enum: [draft, effective, retired, example]
    effective_status: [effective, retired]
    approval_required_when: effective_status
    status_note:
      draft: 未承認・拘束力なし（承認欄は空でよい）
      effective: 発効（承認欄に持ち主の逐語・日付・裁定 id・対話面が必須）
      retired: 廃止（superseded_by 必須・承認欄を持つ）
      example: 見本（拘束力なし・承認欄を持たない・凍結 anchor の材料）
    supersede_note: 後継（superseded_by）の先は、同じ置き場の設計ノートの id のほか、要件の id と判断の記録の id を指せる。先の種類は字の形で読み分け、頭が FR か NFR で後ろが半角の数字なら要件書の要件の節（requirements）か非機能要件の節（nonfunctional）の id、頭が ADR- で後ろが半角の数字なら判断の記録（adr/）の id、ほかは設計ノートの id とする（設計ノートの id は英小字で始まるので重ならない）。床は先の実在を数え、無ければつながりの違反、自分自身を指せば形の違反とし、先の状態は数えない。前（supersedes）は設計ノートの id だけを指す。設計ノートでない file の path は入れない。面は廃止の行の後継のリンクを先の種類の面（要件書の面の要件の場所・判断の記録の面・設計ノートの面）へ張り、要件と判断の記録の先が解けなければリンクを張らず「まだ分からない」を添える
    profile_enum: [design-note]
    profile_note: 密度 profile は 1 行（見せ方だけを持つ・拘束の旗を置かない）。文書の種類による違いは節の型で表す
    approval: {required: [who, date, ruling, verbatim, surface], surface_enum: [R-8]}
    approval_note: effective_status の文書にだけ必須（approval_required_when）。承認者の値域・裁定 id の形は判断の記録の欄の決まり（adr/schema.yaml）と同じ定数を床が持つ。持ち主との対話面（R-8）を通っていない記録に承認欄を置かない
  section:
    required: [n, type, title]
    optional: [body, rows, note]
    n_rule: {start: 1, order: ascending, append_only: true, gaps_allowed: true}
    n_note: 節番号（§N の N）。folio2 の自前の決まり（判断の記録と要件書には無い）。契約表の行の section 欄はこの n を指す（見出しの字面ではない）。器（scribe2）の設計文書の「## N.」と同じ意味
    type_enum:
      - prose
      - parts-table
      - ports-table
      - fields-table
      - teeth-table
      - contract-table
      - row-index
      - row-plan
      - decision-table
    type_note: 節の型の閉じた一覧（裁定は meta.type_enum_ruling）。
    by_type:
      prose:
        required: [body]
        forbid: [rows]
        prose_gate_rules_row: R-16
        body_note: 散文。規範の印を持つ文の門（同じ文に参照 id・数と単位を持たない）は rules 行 R-16 の値（印・「禁止」の直後の文字・単位）と population（母集団の除外・文の区切り）が持ち、ここには写さない
      parts-table:
        required: [rows]
        row: {required: [id, name, role], optional: [ref, note]}
        row_note: 部品の表。role = その部品が何をするか（1 行）。ref = 参照 id（条・要件・rules 行・判断の記録）の一覧
      ports-table:
        required: [rows]
        row: {required: [id, name, input, output, refuses], optional: [ref, note]}
        refuses_none_marker: なし
        row_note: 口の表（命令・関数・接点）。refuses = 何を断るか（黙って飛ばさない）。断らない口は refuses_none_marker の値を書く（空にしない）
      fields-table:
        required: [rows]
        row: {required: [id, name, need, shape], optional: [enum, note]}
        need_enum: [required, optional]
        shape_enum: [text, list, number, bool, table]
        row_note: 欄の表（folio2 自身の型付きデータの欄を記述する節）。need / shape の値域は folio2 の自前（契約表の外部の欄の決まりとは別物＝器の値域を写したものではない）
      teeth-table:
        required: [rows]
        row: {required: [id, name, red_when, fixture], optional: [ref, note]}
        row_note: 歯の表（検査・test）。red_when = 何を壊せば落ちるか（1 文）。fixture = 固定の材料の path（凍結 anchor・repo の根からの相対）。要件書の受入基準の red_test と同じ形
      contract-table:
        required: [rows]
        section_ref_type: prose
        section_ref_note: 行の section 欄は同じ文書の節番号 n を指し、その節は prose の型であること（folio2 側の導出の成立条件 = 節の body の逐語を goal へ写すため。器 scribe2 は「節が在り本文が非空」だけを見る＝folio2 が導出のために足す条件で、器の受付を狭めない）
        rows_note: 契約表。行の欄の集合と値域は本 file に書かない＝schema.contract_table.external_schema が指す器（scribe2）の導出 file をそのまま読む
      row-index:
        required: [rows]
        row: {required: [id, doc], optional: []}
        place: plan-note
        region:
          begin: '# folio:rows:begin — 生成区間・手で直さない・正本は置き場の契約表（folio derive --write が書く）'
          end: '# folio:rows:end'
        row_note: 行の索引（生成区間）。行は置き場の設計ノートの契約表の行の id（id）と所属の文書 id（doc）だけで、file 名の順・表の中の順に並ぶ。器の欄（題・大きさ・依存）は写さない。行は rows の下の印 region.begin と region.end の間に folio derive --write が書き（契約表の導出物と同じ回・全部か無しか）、folio check と folio derive --check が同じ関数で導き直して比べ、食い違えば違反とする。置けるのは規則の表の欄 key が place の閾値の行（計画の名札の行）が名指す計画のノートだけで、ほかのノートに在れば名札の行の有無に関わらず違反
      row-plan:
        required: [rows]
        row: {required: [id, what], optional: [depends, ruling, note, size, files]}
        lists: [depends, files]
        place: plan-note
        row_note: 計画だけの行（人が書く・まだ契約の行の無い計画の行）。節の中の並びが計画の順で、depends は中身の依存だけを書く（同じ file を書く行の直列は器が持つ）。lists の欄は字の一覧、ほかの欄は字。size と files は契約の行ができるまで運ぶ手書きの写しで、床は形だけを見て値を器の語と照らさない。id は計画のノートの中で一意で、行の索引に在れば違反（契約の行を書いたら人の節から外す）。depends の id は行の索引か計画だけの行に在ること。置き場の決まりは行の索引と同じ
      decision-table:
        required: [rows]
        row: {required: [id, text, ruling], optional: []}
        row_note: 判断の表（人が書く・どの設計ノートにも置ける）。置くのは台帳に記録の在る判断（持ち主の裁定か、台帳に記帳した席の裁定）で、行の ruling は決定の欄（判断の記録の欄の決まり adr/schema.yaml の ruling_fields）として床が裁定 id の形を数える。台帳に記録の無い判断は散文に残り、床の外
  contract_table:
    external_schema:
      owner: scribe2
      path: contracts/schema.toml
      format: toml
      reader_expects: {head: schema = 1, rows_key: field, row_fields: [name, need, shape]}
      value_domains: from-file
      known_values: {need: [required, optional, conditional], shape: [text, list]}
      unknown_value: まだ分からない
    external_schema_note: 器（scribe2）が自分の型（pipe/table.rs の定数）から導出した生成物で、欄の一覧と need / shape の値域の正本（value_domains = from-file）。folio2 はこれを読んで契約表の節の欄を登録し、欄の一覧を自分の型にも散文にも持たない＝reader_expects は読み手の期待する形であって正本ではない。need / shape で folio2 が判定に使えるのは意味を知る値の写し known_values（正本は crates/folio/src/floor_note.rs の EXTERNAL_NEED と EXTERNAL_SHAPE）だけ。欄の追加は器の版上げで足り、器が値域を広げたら folio2 の便で known_values に足す（どちらも判断の記録は要らない）。file が読めない・期待する形でない・known_values の外の値が在るときは「まだ分からない」（unknown_value）
    reads: [design-doc-contract-table, external-schema-file]
    never_reads: [per-run-contract-file]
    reads_note: folio2 が読むのは設計文書の中の契約表（scribe2 では docs/design の [[contract]] の区間）と外部の欄の決まりの file だけ。便ごとの契約 file（run dir の contract.toml）は読まない（scribe2 planner の助言 2026-09-16・形が変わる途中）
    row_id: {pattern: '^[a-z][a-z0-9-]*$', owner: folio2, scope: own-id-space}
    row_id_note: 行の id は文書内で一意・append-only。この形は folio2 が所有する文書の id 空間の解決の範囲で folio2 が自前に持つもので、器の値域（器は「文書内で一意」だけを言う）を写したものではない。文書 id と同じ形（ハイフン可）
    semantic_check_owner: scribe2
    semantic_check_note: 行の id の一意・要件の欄が要件書に実在・節の欄が同じ文書に実在し本文が非空・依存の解決と輪の無さ・検証の欄の形・触る型の閉包が書き込み範囲に収まること、は器（scribe2）の 1 つの関数（編集時・黙って飛ばさない）が持つ。folio2 は持たない（要件書 scope_m1.not_build）。ただし 1 本のノートの中の契約表の行 id の重なりは、索引の id の一意として床が種類 索引の節点 の違反に数える
    folio_check: [yaml-form, derived-diff-zero, own-id-space]
    folio_check_note: 契約表について folio2 が持つ検査は 3 つだけ = 正本の形（重複キー・未知の欄・欄の非空）/ 導出物の差分 0（事後の検出）/ folio2 が所有する文書の id 空間の解決（母集団は広げない）。このうち導出物の差分 0（derived-diff-zero）は、配信の組み立て（folio build）から切り離した独立の命令 folio derive --check が数える。folio check と folio build はこの検査を回さない
  derived:
    format: toml-subset
    extension: .toml
    granularity: one-file-per-doc
    head: schema = 1
    array: contract
    row_fields: external_schema の field の name をそのまま + goal
    goal: 行の section が指す節の body の逐語を単一行に写す（各行を trim し空行を落とし空白 1 つで繋ぐ・引用符と逆斜線は escape しない）
    section_value_shape: text
    empty_list: omit-key
    empty_list_note: 器の読み手は空の配列を拒む（緩めない）ので、空の一覧は key ごと省いて表す。YAML 正本の側では空の一覧（depends が空 等）を書いてよく、導出器が省く
    value_grammar: [text, list-of-text, number, bool]
    placement: 消費側の repo に版管理で置く。path は消費側が宣言する（拡張子 .toml・全文を同じ parser に渡す）
    check: {command: folio derive --check, verdict_on_diff: nonzero, stage: post}
    derived_note: 器は統合先（main）へ着地した後の受付からしか新しい表を読まない（正本の改訂 → 取り込みの要求 → 着地 → 再受付）。契約 file の読み手は共有の scalar の読み手で escape を解かず複数行の値も扱わない（scribe2 contract-source.md §2・実測 2026-09-16）＝goal の単一行化と section を文字列で出す（section_value_shape）のはそのため。面の生成器も様式の file も呼ばず、導出物の置き場（--out）は消費側が宣言する（既定なし）。値に二重引用符・逆斜線・改行が在る行は、escape しない形では書けないので導出せず「まだ分からない」とする
  landing:
    source_of_truth: scribe2 の記録（record）
    read_port: 統合先の commit（squash）の本文の末尾の印（trailer・契約 id と要件 id・器が書く）
    trailer_name_source: {owner: scribe2, derived_from: 器の名前の定数, unreadable: まだ分からない}
    verdict_values: {used: [着地, まだ分からない], never: [未着地]}
    verdict_cases:
      - {when: 印が在る, verdict: 着地（印の commit の要約値（sha）を添える）}
      - {when: 印が無い, verdict: まだ分からない}
      - {when: 自分の repo への取り込みの要求で終わる形（印も記録も持たない）, verdict: まだ分からない（恒久）}
      - {when: 印の名か commit が読めない, verdict: まだ分からない}
    forbidden_wording: 未着地
    landing_note: 「未着地」は出さない（印の不在は未着地と弁別できないため）。印の名は器の名前の定数から導出され、folio2 は名を手で持たない（trailer_name_source）。他の repo の要件 id・契約 id・便の id は参照 id の床の母集団に入れず、出所付きの測定値として扱う
  index:
    node_fields_ref: design-intent/graph.yaml node
    node_kinds_ref: design-intent/graph.yaml node_kinds
    edge_fields_ref: design-intent/graph.yaml edge
    edge_types_ref: design-intent/graph.yaml edge_types
    index_note: 機械が読む id の索引は、設計文書の正本から毎回組み直す導出物として口 folio graph --print が出す（2026-09-22 着地・実装 crates/folio/src/graph.rs）。索引は節点（設計文書の中で id を持つ行）と辺（両端の節点の id と型）を持ち、節点と辺の欄と、節点の種類と辺の型の閉じた一覧の正本は実装の型付きの定数（crates/folio/src/graph.rs）で、その写しは索引の欄の決まり design-intent/graph.yaml の生成区間に在る＝この節はその置き場を指すだけで写しを持たない。索引の中身そのものは版管理に置かず、中身を席へ届ける経路は器の役割の注入が持つ
  figures:
    spec: 図の道具（archify）の型付き記述（JSON の 5 型の欄の決まりそのまま）
    entry: {required: [id, type, caption, spec], optional: [refs, note]}
    type_enum_ref: design-intent/preview/parts.json figure_type_enum
    body_classes_ref: design-intent/preview/parts.json figure_body_classes
    semantic_attrs: keep
    viewer_chrome: discard
    network_commands: forbid
    skill_listing: forbid
    retry_record: ledger
    figures_note: 図の正本は設計ノートの figures 節に型付き記述で置き、別 file にも散文にも持たない。図の本体の意味の属性は捨てず（semantic_attrs = keep）、閲覧の仕掛けは捨て（viewer_chrome = discard）、意味を表す class は部品目録に載り色・字の大きさ・線の太さは design token で塗る（body_classes）。道具の通信する命令は使わず（network_commands = forbid）、AI 向けの説明（skill）として載せない（skill_listing = forbid）。図の対＝設計ノートの図は、非エンジニア向けの手順図（専門の言葉を使わず「誰が・どの順で・何をして・だめならどうなるか」）と、エンジニア向けの順序図（命令の名・旗・終了コード・file 名をそのまま）を対で置く。見本は design-note/figures.yaml。これは書き方の指針であり床は数えない
  guards:
    in_loop: []
    post: [yaml-form, derived-diff-zero, own-id-space, prose-gate, prose-mentions]
    polarity_list_feed: true
    guards_note: 設計ノートの編集を編集の時点で止める仕掛け（in-loop）は folio2 側に 1 本も無い（器 scribe2 の受付は別 repo の guard で、folio2 の設計ノートの編集を止めない）。post の検査は編集時に止めることの代わりにしない。post のうち derived-diff-zero は folio derive --check が数える（事後の検出で、編集の時点で止める仕掛けの代わりにしない）。
# folio:schema:end
