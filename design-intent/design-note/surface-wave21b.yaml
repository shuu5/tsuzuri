  - n: 3
    type: prose
    title: 行 g-ledger-group-kind — 台帳の一覧の組と並べと問いの一覧を地図と同じ種類の読みにする
    body: |
      在りかの main は b5c24c8（計画 surface-plan v0.78・行 g-nav の着地の後）。この行は面の view.rs の台帳の一覧の組と並べ（fn ledger_groups・sort_children・kind_rank）と問いの一覧（fn questions）を、欄 kind の字でなく地図の節点と同じ種類の読み（契約の crate の LedgerRow の fn node_kind）で決める。
      なぜ。本物の台帳（bd）の問いと memo は issue_type が task で、label intake:question と intake:memo で分かれる。行 g-ledger-kind（ノート surface-wave18f・着地済み）は台帳の一覧の項の種類の語と状態の語をこの読みにしたが、一覧の組と並べと問いの一覧は欄 kind の字 question と memo のままにした（その行の範囲の外・席の決め 2026-09-29）。そのため今は、open の問いが問いの一覧（view の Board の欄 questions）に入らず台帳の一覧の組の下に契約と同じ位で混ざり、memo は契約と同じ位で並ぶ。拠りは持ち主の指摘（記帳 t3-hub.1・user 2026-09-28T22:5xZ）と席の決め（2026-09-29・起草 w18f の点検で見つけた）。
      在りか・面の view.rs（write-set）。今の main の view.rs は pub const QUESTION_KIND（字 question・doc は問いの bead の種類）と pub const EPIC_KIND（字 epic・doc は epic の bead の種類）を持ち、pub fn questions(rows) は欄 kind が QUESTION_KIND で status が open の行を更新時刻の昇順（同じ時刻は fn id_order の順）で返す。pub fn ledger_groups(rows) は欄 kind が EPIC_KIND の行を組の頭にして id_order で並べ、欄 kind が EPIC_KIND でも QUESTION_KIND でもない行を id の階層（fn ancestors と parent・a.1 の親は a）でいちばん近い epic の祖先の組の下に置き、祖先の無い行を最後の頭の無い組（epic が None・行が在るときだけ）に置く。組の下の順は私的な fn sort_children が私的な fn kind_rank(kind: &str)（字 task は 0・memo は 1・ほかは 2）の位と id_order で決める。ledger_groups の doc は question は問いの一覧が持つので入れないと書く。pub fn board(rows) は Board の欄 questions に questions、欄 groups に ledger_groups を置き、Screen の fn after_read は一覧の口の電文（LedgerList）を読んで board を組む。use の塊は契約の graph の NodeKind と ledger の LedgerRow を既に持つ（行 g-ledger-kind が NodeKind を足した）。QUESTION_KIND と EPIC_KIND を読む字は、4 つの crate（契約・中核・境界・面）の tests と src と xtask の src のどこにも view.rs のほかに無い（grep で確かめた）。
      在りか・契約の crate（書かない）。crates/tsuzuri-contract/src/ledger.rs の pub fn bead_kind(issue_type, labels) は、issue_type が epic なら Epic、label intake:memo を持てば Memo、label intake:question を持てば Question、ほかは Task を返し（この順）、LedgerRow の pub fn node_kind は欄 kind と labels をこの fn に渡す。返る枝はこの 4 つだけなので、issue_type の feature・bug・chore と、label の無い issue_type question と memo の行は Task になる。
      在りか・読み手（書かない）。面の src で Board の欄 questions を読む字は無い（grep で確かめた）。問いの頁の block 答えを待つ質問は口 /api/questions の電文を読み、その口の中核の読み（crates/tsuzuri-core/src/question.rs の fn is_open_question）は label intake:question を持ち status が closed でも tombstone でもない bead を問いにする。Board の欄 groups は面の src/project/ledger.rs の fn count（組の下の行の数と頭の epic の数の和）・fn staged_body と body（閉じた行を出さない一覧の中身）・私的な fn epic_title（指標の epic の題）が読む。kit の fn item と staged_item は一覧の項を作り、open の問いの行に印 ◷ と語 答え待ちと赤（欄 alert）を付ける（行 g-ledger-kind）。
      在りか・fixture と着地済みの歯（write-set と置き場だけの =）。tests/fixtures/ledger/board-8.jsonl の 8 行は、bm.5・bm.4・bm.6 が issue_type question と label intake:question、bm.2 が issue_type memo と label intake:memo を持つ（行 g-ledger-kind が label を足した）。面の歯 board_min.rs の board_min_ledger_outside_epic_goes_last は、この fixture の最初の行 bm.5 の写しの id を zz.1 に、欄 kind を task にした行と、3 行目 bm の写しの id を am にした行を足し、組の頭が am・bm・頭の無い組の順で、am の組の下が無く、頭の無い組の下が zz.1 だけと見る（写しは label intake:question を持ったまま）。面の歯 lhome.rs の fn row(id, kind, status) は labels を空にし、節の台帳 LH（fn lh・15 行）は ea.3・ec.2・z.2 を欄 kind の字 memo、qq.1 を字 question で持つ（label は無い）。lhome_groups_rules は LH の body が 4 つの組（頭 ea の下 ea.1・ea.3、頭 eb の下は無し、頭 ed の下 ed.1、頭の無い組の下 z.2）と一致すると見て、lhome_empty_and_count は LH の count を Known の 14 と見る。面の歯 lstg.rs の節の台帳 LR の zz.3 は既に issue_type task と label intake:memo の行（行 g-ledger-kind）。
      fixture の board-8.jsonl の 8 行（file の行の順・id・issue_type・status・label）: bm.5・question・open・intake:question／bm.2・memo・open・intake:memo／bm・epic・in_progress・無し／bm.10・task・open・無し／bm.4・question・open・intake:question／bm.1・task・in_progress・無し／bm.3・task・closed・無し／bm.6・question・closed・intake:question。bm の組の下は、今の読みでも node_kind の読みでも bm.1・bm.3・bm.10・bm.2 の順で、一覧の中身（閉じた行を出さない）は bm.1・bm.10・bm.2、件数は 5。
      節の台帳 LH（lhome.rs の fn lh・15 行・id・欄 kind の字・status・label はどれも無し）: ea・epic・open／ea.1・task・open／ea.2・task・closed／ea.3・memo・in_progress／eb・epic・in_progress／eb.1・task・closed／ec・epic・closed／ec.1・task・closed／ec.2・memo・closed／ed・epic・closed／ed.1・task・blocked／ed.2・task・closed／z.1・task・closed／z.2・memo・open／qq.1・question・open。形 (f) の fn real を通すと、字 memo の 3 行（ea.3・ec.2・z.2）は issue_type task と label intake:memo、字 question の 1 行（qq.1）は issue_type task と label intake:question になり、ほかの 11 行はそのまま。
      形（面）。(a) view.rs の pub const QUESTION_KIND と EPIC_KIND を消す。(b) fn questions の filter を r.node_kind() == NodeKind::Question かつ status が open にする（並べは変えない）。(c) fn ledger_groups の組の頭を r.node_kind() == NodeKind::Epic の行にし、組の下に置く行を node_kind が Epic でも Question でもない行にする（祖先の決めと頭の無い組は変えない）。(d) fn sort_children は kind_rank に a.node_kind() と b.node_kind() を渡し、fn kind_rank(kind: NodeKind) -> u8 は Task を 0・Memo を 1・ほかを 2 にする。(e) questions・ledger_groups・sort_children・kind_rank の doc を、種類は地図の節点と同じ読み（LedgerRow の node_kind）で決め、問いは問いの一覧が持つので台帳の一覧に入れず、組の下は契約・memo の順と書き直す。
      形（歯と fixture）。(f) lhome.rs の use に MEMO_LABEL と QUESTION_LABEL を足し、fn real(row) -> LedgerRow（欄 kind の字 memo の行を issue_type task と label intake:memo に、字 question の行を issue_type task と label intake:question にし、ほかの行はそのまま返す）を置き、fn lh の 15 行を real に通す。lhome の期待の字は変えない。(g) board_min.rs の board_min_ledger_outside_epic_goes_last で、写しの zz.1 の labels を空にする 1 行（と注の 1 行）を足す。期待の字は変えない。(h) 新しい歯の file tests/lgrp.rs を足す（測り方）。
      変わらない行と読む順と落ちる時（歯で測らず、この行の差分で持つ）。電文 LedgerRow と契約の fn bead_kind と node_kind・server の台帳の読み・kit の item と staged_item と view の row_mark・project/ledger.rs は変えない。fixture の board-8.jsonl は書かない。label の無い issue_type question と memo の行は、地図の節点と同じく契約（Task）として台帳の一覧に入る。
      決めた幅（起草の決め）。(i) 問いは台帳の一覧から外したまま（問いの一覧が持つ）にし、読みだけを替える。理由は 3 つ。1 つ目、ledger_groups の doc の決まり（問いは問いの一覧が持つ）を本物の台帳の形でも成り立たせる直しで、決まりそのものは変えない。2 つ目、open の問いは project board では問いの頁の block 答えを待つ質問に出て、その口の読みも同じ label intake:question なので、1 つの問いが 1 つの一覧に出る。3 つ目、fixture の board-8.jsonl を読む着地済みの歯（board_min・frame・lhome・ledgerblock・lcard）の期待の字（一覧の下 bm.1・bm.10・bm.2、件数 5）がそのまま保たれる（問いを入れる形は、試作で board_min・frame・ledgerblock・lhome の 4 file の歯 7 本と lgrp の 2 本を落とした）。(j) 問いの一覧の status は今の字（open だけ）のまま。(k) 並べの位のほか（2）は、node_kind が組の下に Task と Memo しか返さないので使われないが、NodeKind の枝が多いので残す。issue_type の feature・bug・chore の行は契約として task と同じ位で id の順に並ぶ（今の main では位 2 で memo の後）。(l) fixture の board-8.jsonl は書かない。label を既に持ち、node_kind の読みでも今の読みでも種類が同じ（bm.4・bm.5・bm.6 は問い、bm.2 は memo）なので、読み手の期待は変わらない。issue_type を task に替えると、項の種類の語が行の欄 kind の字で終わると見る frame_item_shape_follows_status の期待を書き直すことになり、この行の目的の外。(m) 歯の中で欄 kind の字 memo と question を label 無しで持つ行は、lhome の LH の 4 行だけを本物の台帳の形（issue_type task と label）に替える（新しい読みでは label の無い字は契約になり、qq.1 が一覧に入るため）。期待の字を替えるより節の表 T の意味（memo と問い）を保つ。(n) board_min の写し zz.1 は label も外して契約の行にする（歯の注の意図 = epic の外の task を保つ）。
      着地済みの歯（どこを grep したか）。4 つの crate（契約・中核・境界・面）の tests と src と xtask の src を、この行が書く item と file の字（QUESTION_KIND・EPIC_KIND・view::questions・ledger_groups・kind_rank・sort_children・view::board・Board・EpicGroup・after_read・Screen・staged_body・ledger::body・ledger::count・ledger::content と panel・src/view.rs・board-8.jsonl）と、面の src の dir を読む歯（read_dir）で探した（main b5c24c8）。読み手は面の crate の tests だけで、書く 2 file（board_min・lhome）のほかは次の 11 file で、どれも置き場だけの = に入れて verify で撃つ（直さずに通る・試作で撃った）。frame（fixture の画面の一覧と src の全部の字）・lcard（fixture の画面で指標を組む）・ledgerblock（fixture の画面の count と body と指標）・lstg（段つきの一覧と src の全部の字）・parts（画面の after_read と body と src の全部の字）・gjst（view.rs の字）・kindlab・aord・gatt（src の全部の字）・cadl と hacols（Screen の initial で指標を組む）。境界の歯 brand.rs と shb.rs は面の src の全部の字から口の path を引用符で囲んだ字だけを数え、境界の jrun.rs は面の src の pages と mapview と account の字だけを読むので、この行の字と交わらない（= に入れない）。中核と契約と xtask に読み手は無い。
      測り方。新しい歯は面の crate の tests/lgrp.rs に置き、名を lgrp_ で始める（4 本・lgrp_questions_follow_labels・lgrp_groups_follow_node_kind・lgrp_screen_real_ledger・lgrp_names_clean）。台帳の行は歯の中で組み（題は 題・親は無し）、bead の id の接頭辞は fx-g・fx-e・fx-m・fx-z・fx-s。
      節の台帳 LQ（5 行・id・issue_type・status・label・更新時刻）: fx-g.1・task・open・intake:question・20／fx-g.2・task・open・intake:question・10／fx-g.3・task・closed・intake:question・5／fx-g.4・question・open・無し・1／fx-g.5・task・open・intake:memo と intake:question・2。
