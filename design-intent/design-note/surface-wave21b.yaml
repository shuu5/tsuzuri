    title: 目的
    body: |
      台帳の一覧の組と並べと問いの一覧を、欄 kind の字（bd の issue_type）でなく地図の節点と同じ種類の読み（契約の crate の LedgerRow の node_kind）で決める、面の crate の行 1 つ。
      本物の台帳の問いと memo は issue_type が task で、label intake:question と intake:memo で分かれる。行 g-ledger-kind は一覧の項の種類の語と状態の語をこの読みにしたが、組と並べと問いの一覧は欄 kind の字 question と memo のままなので、open の問いが問いの一覧に入らず台帳の一覧に契約と同じ位で混ざり、memo は契約と同じ位で並ぶ。
      直しは、問いの一覧と組の頭と組の下に置く行と並べの位を node_kind で決めること。問いは今の決まりのとおり台帳の一覧に入れない（問いの頁の口も同じ label で問いを読む）。電文と server と fixture の board-8.jsonl と kit の項は変えない。
