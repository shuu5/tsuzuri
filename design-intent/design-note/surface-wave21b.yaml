      filter の語（main b5c24c8 の contracts の verify の filter の語 272 を、ほかの語を部分の字として含まない 197 語に畳んだ語）は歯の file の const FILTERS に持ち、新しい歯の名はどの語も部分の字として含まない（接頭辞 lgrp_ も、どの語にも含まれず、どの語も含まない）。
      試作（main 93389e3 を置き場へ git clone した木に当てて commit し、行 g-nav の着地の後の b5c24c8 へ rebase した木・差分は同じ字）。verify の nextest の行（xtask を除く 14 行）が全部通り、xtask の check が通った。この行の git diff は 16857 byte（4 file・view.rs は 19 行を足し 19 行を消す）。噛み: 問いの一覧を欄 kind の字 question で決めると lgrp_questions_follow_labels と lgrp_screen_real_ledger が、台帳の一覧から外す行を欄 kind の字で決めると lgrp_groups_follow_node_kind・lgrp_screen_real_ledger・lhome_groups_rules・lhome_empty_and_count が、並べの位を欄 kind の字で決めると lgrp_groups_follow_node_kind が、lhome の LH の行を real に通さないと lhome_groups_rules と lhome_empty_and_count が、board_min の写しの label を残すと board_min_ledger_outside_epic_goes_last が落ちる。組の頭を欄 kind の字 epic で決める戻しは落ちない（issue_type epic の読みは node_kind でも同じ）。
      依存と順。depends は空（ノートの行は 1 つ）。計画の依存 g-ledger-kind（便 t3-hub.52.116）は着地済み。view.rs は計画 5 節の鎖で g-jst と g-ledger-kind と c-ev-kind（便 t3-hub.52.118・着地済み）の後で、この行の字は c-ev-kind の着地の後の字（RELOAD_KINDS と fn path_kinds・reloads・changed_kinds を持つ字）に当てた。面の歯 lhome.rs は計画 5 節の鎖で g-ledger-kind（置き場だけの =・着地済み）の後、c-ledger-lc の前。ほかのノートの行との順は便の bead の依存で持つ（席が付ける）。
