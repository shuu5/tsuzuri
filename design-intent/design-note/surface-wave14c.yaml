    body: |
      在りかの main は 7ea0462（計画 surface-plan v0.45）。起草は 49ebfc2 で始め、第 1 版を 14b5a61 で確かめ、席の直し（引数を束ねて lint の許しの属性を外す・card を付ける関数を hover に 1 つだけ置き、ask.rs と askpage.rs の私的な写しを消す・外した要素の card の層を閉じる）を入れた第 2 版を 7ea0462 で確かめた（14b5a61 から 7ea0462 までに面の crate で変わったのは account の下と project の policy.rs と歯 hasplit・gpface・hdchip・hshist ほかで、この行の file と使う物と歯の file と fixture の字は同じ）。
      なぜ。要件 FR14 は hover の card を 4 行（1 行 36 字）と「詳しく」とし、card を出す要素の 1 つを頁を持つ節点の札とする。見本の問いの頁（docs/design/mock3/ask.html）の qcard の頭は、題を a の要素（class t と nl・data-key に問いの key）にし、ui.js の cardContent の節点の枝が節点の card（題・種類と帯と状態・id と要約・出所）を出す。同じ頁の これまでの決定 の段（id hist）は ui.js の itemNode で行を組み、題の a の要素（class ttl と nl）に data-key の問いの key を、右の小さい字の決定の時刻の a の要素（class nl）に data-key の決定の key を持たせ、どちらも同じ節点の枝の card を出す。本番の問いの card（src/project/ask.rs）の題と、段の行（src/project/askpage.rs）の題と決定の link は、着地済みの行 g-ask-focus と g-hist-ruling が節点の頁への link にしたが、card を持たない。着地済みの行 g-card-node は電文の節点 1 つから card を組む共有の関数 card_of を widgets の nodecard に置き、行 g-card-adopt-a が pipeline の札と次の一手の質問の題に使った。この行は同じ card_of で問いの頁の 3 か所（問いの card の題・段の行の題・段の行の決定の link）に節点の card を付ける。card の層は widgets の hover の attach が要素への pointer の入りで出し、出で猶予の後に消すが、DOM を組み直して外した要素からは出の事件が来ないので、この行が問いの card の題の a を組み直すと、出ていた card が残りうる。そこでこの行は attach に要素の後始末を足してその要素の出した card の層を閉じ、Option の card を付ける共有の関数 attach_some を hover に置く。
      在りか・ask.rs（write-set・724 行・build.rs が生成する pub mod で crate::project::ask・結合試験は tsuzuri_surface::project::ask）。host の部分は use に std の BTreeMap を持たず、crate::widgets::hover の clip（19 行）を use する。pub struct Card（143〜158 行・問いの card の中身・derive は Debug・Clone・PartialEq・Eq・Hash・pub な欄 number・id の BeadId・title・a1・posted_at・summary・reason・recommend・touches・blocking・digest）は widgets の hover の Card と同じ名の別の型。pub fn listed（218 行・Fetched の参照を受け Card の Vec・body が Filled ならその列・ほかは空）と pub fn card（題は hover の clip で 36 字に切る）と、鍵つきの一覧の鍵 pub fn card_key（番号を 0 にした中身）が在る。wasm の target のときだけの pub fn view（415 行）は dom::view を返し、mod dom（421 行・字 mod dom { は file に 1 度）の use は super の名の列・crate::frame の Mode と node_href・crate::project::nodearound の Embeds と embeds・crate::project の Body・body_view・fold・section・unmeasured・crate::vocab の label・crate::widgets::help の HelpCtx。dom の view（482 行）は口 PATH を crate::net::read で読み、形の Memo shape （outline）と card の列の Memo cards（listed）を作り、Filled の形で leptos の For（each は cards の値・key は card_key）の子ごとに draft と、Memo の number（target_number）を作って card_view(c, d, number, on, tick, current, places) を呼ぶ。card_view（引数 7 つ・card・d・number・target・tick・mode・places）は配置の表 LAYOUT の部分ごとに part_view（引数 7 つ・slot・card・d・number・tick・mode・places）を呼び、part_view の Part::Head の腕は番号の span と、class t の a の要素（href は node_href に問いの id と mode の値を渡す閉包・中は data-t の span の題）と A-1 の印と経過の chip を描く。card の DOM は鍵が同じなら一覧を読み直しても残る（行 g-keyed）ので、子を作った時に決めた値は後の読みで替わらない。
      在りか・askpage.rs（write-set・265 行・crate::project::askpage）。host の部分は use に std の BTreeMap・契約の graph の EdgeType と GraphDoc・super の Body と Item ほかを持つ。pub fn ruling_links（118 行・グラフの口の読みを wire の decode で電文に読み、型 answers の辺の to から from のBTreeMap）・pub struct HistEntry（134 行・derive は Debug・Clone・PartialEq・Eq・pub な欄 item の kit の Item と ruling の String の Option）・pub fn hist_rows（140 行・Item の slice とグラフの口の読みを受け、項ごとに答えた決定の id を添えた HistEntry の Vec）・pub fn body（台帳の一覧の読みを受け Body の Item の Vec）。wasm の target のときだけの pub fn view（178 行）はグラフの口を crate::net::read(super::map::PATH) で読み（184 行）、台帳の一覧の口の読みの中身が Filled のとき、graph の with で hist_rows(&items, g) の値の行を hist_li(entry, mode) に渡して並べる（219〜223 行・中身の閉包はグラフの読みにも従うので、グラフが替われば段の行を組み直す）。wasm の target のときだけの私的な fn hist_li（239 行・HistEntry と mode の閉包を受ける）は li に印の span と、class ttl の a の要素（href は node_href・中は class nid の span の id と data-t の span の題）と、class aside の span の中の決定の a の要素（href は node_href に決定の id・中は ruling_text の字）か状態の字を描く。
      在りか・hover.rs（write-set・386 行・src/widgets/hover.rs・widgets の mod.rs の 7 行 pub mod hover・host でも組む）。host の部分は pub fn place（63 行）・keeps・clip（83 行）と pub struct Card（94 行・pub な欄 title・kind・value・src と more・derive は Debug・Clone・PartialEq・Eq・Default で Hash を持たない）と pub fn card_class・over_shows・leaves（126 行）。131 行の字 pub use dom::{CardLayer, Delegate, HoverCtx, attach, delegate};（wasm の target のときだけ）が再出しで、wasm の target のときだけの mod dom（134 行）の use は std の Duration・leptos・web_sys と、super の Card・GRACE_MS・Point・Rect・Size・card_class・keeps・over_shows・place と crate::vocab の label。pub struct HoverCtx（156 行・derive は Clone と Copy・頁の App が context に 1 つ置く）は私的な欄に、出ている card と置いた左上と pointer と出の記録 leaving と、card を出すたびと消すたびに 1 足す番号 seq（163 行・StoredValue の u64）を持ち、私的な fn show（211 行・seq に 1 足して card を出す）・leave（233 行・猶予の後に seq が同じで出の記録が在れば消す）・hold（266 行）・hide（270 行・seq に 1 足して消す）を持つ。pub fn attach（280 行・web_sys の Element と Card を受け、use_context の HoverCtx が無ければ何もせず、在れば要素に pointerenter で show を、pointerleave で leave を呼ぶ listener を付けて forget する）は要素の後始末を持たない。pub struct Delegate と pub fn delegate（307 行）と、層の要素を描く CardLayer（359 行・on_cleanup で層の要素を外す・364 行）が続く。
      使う物（この行は書かない・確かめた）。widgets の nodecard（src/widgets/nodecard.rs・host でも組む・lib.rs の 25 行 pub mod widgets と widgets/mod.rs の 8 行 pub mod nodecard）の pub fn card_of（180 行・GraphDoc の参照と id の &str を受け、電文の節点を前から見て id の同じ最初の節点の card か None）。widgets の hover の pub struct Card（上の在りか・この行は Card の欄と card の層の出し方を変えない）。project の map（src/project/map.rs・crate::project::map）の pub const PATH（字 /api/graph）と pub fn doc（35 行・NotRead に NOT_READ・Failed に map の REASON・電文として読めない本文に NO_CONTENT の Err）。通信の crate::net::read は同じ path の読みを頁の block の間で 1 つの signal に分ける（問いの頁ではつながりの図とこれまでの決定が既にグラフの口を読む）。頁の枠の src/board.rs は provide_context(HoverCtx::default()) と CardLayer を持つ（73 行と 89 行）ので、問いの頁の要素に attach を付ければ card は出る。fixture の値（tests/fixtures/surface の下・触らない）は、graph-doc.json の節点 34 のうち t3.q10（question・題 開いた問い・台帳の属性の status open）・t3.q2（question・題 閉じた問い・closed）・t3.q2#r（ruling・題 おすすめどおり・型 answers の辺で t3.q2 へ）で、card_of の値は順に kind が question · beads · open・question · beads · closed・あなたの決定 · beads · 状態なし、value が id と空白と 要約なし、src が .beads/issues.jsonl。question-list.json の card は qa.2 と qa.10 で電文に無く、ledger-questions.json の行は lq.2・lq.10・lq.9・lq.3・lq.4（これまでの決定は lq.2・lq.9・lq.10）で電文に無い。
      形（host の部分・ask.rs）。module の doc に、題の link にグラフの口の電文から引いた問いの節点の hover の card を付ける（電文に無い問いは付けない・行 g-card-adopt-b）1 行を足す。use に std の BTreeMap と crate::widgets::nodecard の card_of を足し、hover の use を self と clip にする。pub fn node_cards（graph の &Fetched と cards の &[Card] を受け BTreeMap<String, hover::Card>）は、super::map::doc(graph) が Err なら空、Ok なら card の列を前から見て card_of(&doc, id) が Some のものを id の字の鍵で集める。ask の Card と card と listed ほかの既存の値は変えない。
      形（host の部分・askpage.rs）。module の doc に、行の題と答えた決定の link に節点の hover の card を付ける（行 g-card-adopt-b）1 行を足す。use に crate::widgets::hover の Card と crate::widgets::nodecard の card_of を足す。pub fn hist_cards（entries の &[HistEntry] と graph の &Fetched を受け BTreeMap<String, Card>）は、map の doc が Err なら空、Ok なら行ごとに項の id と決定の id（Some のとき）を並べ、card_of が Some のものを集める。ruling_links と hist_rows と HistEntry は変えない。
      形（hover.rs）。host の部分に pub fn unmount_hides（要素の出した card の番号 shown と層の今の番号 now の u64 を受け、shown が 0 でなく now と同じとき真・番号 0 はまだ出していない要素）を leaves の後に置き、再出しの行を pub use dom::{CardLayer, Delegate, HoverCtx, attach, attach_some, delegate}; にする。mod dom の use に std の sync の Arc と atomic の AtomicU64 と Ordering と、super の unmount_hides を足す。HoverCtx に私的な fn release（self と shown の u64 を受ける）を hide の前に置き、seq の try_get_value が Some で unmount_hides(shown, now) が真のときだけ hide を呼ぶ（頁を閉じて context の値が先に捨てられていても panic しない）。attach は Arc の AtomicU64 の shown（0 で始まる）とその写し mine を作り、pointerenter の閉包で show の後に seq の今の値を mine に store し、2 つの listener の forget の後に on_cleanup(move || ctx.release(shown.load(Ordering::Relaxed))) を置く（CardLayer と同じ作法・要素を持つ反応の範囲が捨てられるとき、つまり DOM を組み直して要素を外すときに呼ばれる・leptos の on_cleanup の閉包は Send と Sync を要り、listener の閉包と番号を分け合うので Arc の atomic で持つ）。wasm の target のときだけの pub fn attach_some（web_sys の Element と Card の Option を受け、返りは無し）は Some なら attach を呼び、None なら何もしない（directive の形 use:attach_some で使う・見本も節点が引けなければ card を出さない）。pointer の入りと出と猶予と置き場の決まりと、Delegate と CardLayer は変えない。
      形（DOM・ask.rs の mod dom）。use に super の node_cards・crate::project の map と、字 use crate::widgets::hover::{self, attach_some}; を足す。私的な struct Live（derive は Clone と Copy・欄 nb の Memo の usize と、欄 node の Memo の hover の Card の Option）を置き、1 本の card の、一覧を読み直すと動く値（番号と題の節点の card）を束ねる。view は cards の Memo の後にグラフの口を crate::net::read(map::PATH) で読み、Memo の nodes（cards と graph の with で node_cards(g, v) の値）を作る。For の子は今の番号の Memo を名 nb で作り、id の写しの key と Memo の node（nodes の with で m.get(&key).cloned()）を作って、card_view(c, d, Live { nb, node }, on, tick, current, places) を呼ぶ。card_view と part_view は今の引数 number（Memo の usize）を live（Live）に替え、引数は 7 つのまま（article の id は anchor(live.nb.get())・番号の span は live.nb.get()）。part_view の Part::Head の腕は、問いの id と投稿の時刻と題の写しを取り、題の a の要素を閉包 link（呼ぶたびに id と題を写し、class t の a に href=move || node_href(&id, mode()) と use:attach_some=live.node.get() を付け、中は data-t の span の題）にして、番号の span の後に {link} で置く（node の値が替わったときだけ a を組み直し、番号と A-1 の印と経過の chip とほかの部分と答えの欄は組み直さない）。引数を Live に束ねるのは、card_view と part_view が引数 8 つになって粒度の lint（clippy の too_many_arguments）に触れるのを、lint の許しの属性で黙らせずに避けるためで（憲法の条 P-22.2 は粒度の lint を allow の属性で黙らせない）、欄の名 nb は着地済みの歯 qkey_dom_text が mod dom に断る字 .number を含まない。
      形（DOM・askpage.rs）。view の Filled の腕の行は、graph の with の中で entries = hist_rows(&items, g) と cards = hist_cards(&entries, g) を取り、行を hist_li(entry, &cards, mode) に渡して collect_view する。hist_li は引数 cards（&BTreeMap<String, Card>）を足し、本文の use に字 use crate::widgets::hover::attach_some; を足して、題の a（class ttl・href=href）に use:attach_some=card（項の id の card の写し）を、決定の a（href は今の node_href の閉包）に use:attach_some=cards.get(&rid).cloned() を付ける。li と 2 つの a の中身と class aside の span の並びは変えない。card を付ける私的な関数は置かない（下の決めた幅 (f)）。
      決めた幅（起草の決めと席の直し）。(a) card は card_of の値そのまま（見本の節点の枝と同じく、題・種類と帯と状態・id と要約・出所）。問いの card の中の字（題の 36 字の切り・概要・理由・推奨）は card に写さない。(b) 電文に無い id と、グラフの口がまだ読めていない・読めない間は card を付けない（見本も節点が引けなければ card を出さない・空の card を出さない）。(c) 問いの card の DOM は一覧を読み直しても残るので、題の a は card ごとの Memo の node に従って組み直す（グラフの口が問いの一覧より後に読めても、後から card が付く・値が同じなら組み直さない）。段の行は今もグラフの読みで組み直すので、組むときの値を付ける。(d) まとめて承認の行の題（src/project/batch.rs）は見本も card を持たないので付けない。(e) 見本の card の経験者向けの行（種類の内部の名と要約の出所）は出さない（行 g-card-adopt-a と同じ）。(f) Option の card を付ける関数は hover の pub fn attach_some 1 つにし、ask.rs と askpage.rs に私的な写しを置かない。block ごとに同じ 5 行の写しを持つと、付け方の直し（この行の後始末のような）が写しの数だけ要り、写しの間でずれるので、写しの増殖を防ぐ（着地済みの account の projects.rs と home.rs の私的な attach_some を寄せるのは計画の行 g-attach-acct）。(g) 後始末で閉じるのは、外した要素の出した card の番号が層の今の番号と同じときだけ（後から別の要素が出した card と、猶予の後に既に消えた card には触らない・一度も出していない要素の番号は 0）。(h) 引数は Live に束ね、lint の許しの属性を付けない（上の形・憲法の条 P-22.2）。
      着地済みの歯（面の crate の tests を grep で確かめ、試作で撃った・どれも直さずに通る）。ask.rs の字を読む歯: afocus_src_links_and_scroll（mod dom の後に anchor( と card_class( と node_href( と focus( と target_number( と get_element_by_id( と scroll_into_view_with_bool(true) と、class t の a の開きの字が在り、file に class t の span が無い・askpage.rs の view にも同じ種類の字）・qkey_dom_text（mod dom に <For と card_key と outline と listed が在り、字 let list = move || から section(BLOCK の前に <For が在り collect_view() が無く、mod dom に字 .number と now: が無く、Part::Head => から Part::Summary => の前に字 href=move || が在る）・aaround_src_ask_fold_embeds（view の頭の embeds() と Part::Around の腕の字）・qblock_chip_after_touches と qblock_vocab_and_icon（Part::Around の腕と STOP の字）・askcard_no_offscreen_storage_names（2 つの file に保存の口の名が無い）。hover.rs の字を読む歯: cround_dom_text（hover.rs の DOM の部分に字 pub struct Delegate・pub fn delegate() -> Delegate・pub fn show(self・pub fn leave(self・&web_sys::MouseEvent・pub fn attach( が在り、Delegate の show と leave の中の字と、再出しの字 pub use dom::{ から次の }; までに CardLayer・Delegate・HoverCtx・attach・delegate が在る）。この行は Delegate を変えず、再出しの列に attach_some を足すだけ。askpage.rs の字を読む歯: hruling_src_row_links（字 pub fn view( より後に hist_rows( と map::PATH と class ttl の a の開きの字が在って item_view( が無く、class aside の span の開きの後の最初の ruling_text( の前の最後の a の開きから ruling_text( までに node_href( が在り </a> が無い）。この行は Part::Head の腕に字 href=move || を残し、mod dom に字 .number と now: を書かず（Live の欄の名は nb）、決定の a の use:attach_some を href の後に置き（node_href( は a の開きと ruling_text( の間に残る）、Part::Around の腕を変えない。値を見る askcard_ と qkey_ と hruling_ と afocus_ のほかの歯は、この行が変えない関数の値を見る。src の全部か block の file を歩く歯（frame_classes_are_in_stylesheet・frame_no_heading_words_in_code・steady_details_use_fold_record・parts_paths_distinct_in_block_modules・hsderive_consts_match_note・gjst_src_one_offset_no_utc_marks）は、この行がclass の字・見出しの語の字・details の要素・記録の関数を呼ぶ所・引用符で囲んだ /api/ の字・PATHS と FOLDS・時差の字を足さないので、期待が動かない（xtask の check で撃つ）。試作（scratchpad の main 7ea0462 の写しに同じノートの 2 行を入れた木）で、xtask の check（workspace の build・歯の全部 0 本・clippy の host と面の wasm の target・surface-build）が rc 0 で通った。
      測り方・歯（tests/cadq.rs・新しい file）。使う item は契約の crate の board の Reading・graph の GraphDoc・ledger の BeadId（pub fn new）と LedgerList（pub な欄 rows）・question の QuestionList（pub な欄 cards）・wire、tsuzuri_surface::project の Body と ask（pub な Card と pub fn listed と node_cards）と askpage（pub な HistEntry〔pub な欄 item と ruling〕と pub fn body と hist_rows と hist_cards）、tsuzuri_surface::view の Fetched、widgets の hover の Card と pub fn unmount_hides と、nodecard の card_of。歯は fixture の字を CARGO_MANIFEST_DIR から ../../tests/fixtures/surface/ の下の graph-doc.json と question-list.json と ledger-questions.json として読み、id を替えた一覧は wire の decode で読んだ値の id の欄に BeadId を代入し、wire の encode で本文に戻して ask の listed と askpage の body に渡す。電文にならない読みは NotRead と Failed と字 {} の Body。cadq_dom_wiring は src/project/ask.rs と src/project/askpage.rs の字を読み、字 mod dom { より後（ask）と字 pub fn view( より後（askpage）と、2 つの file の全部の字を見る（DOM は wasm の target のときだけ組むので字で見る・作法 3）。cadq_cleanup_closes は unmount_hides の値を見て、src/widgets/hover.rs の字 mod dom { より後の attach・release・attach_some の本文の字と、file の再出しの行を見る（後始末が走ることは wasm の DOM でしか見られないので、閉じるかの決まりは host の関数で、呼ぶ所は字で見る）。cadq_names_stay_apart は tests/cadq.rs の字を読み、test の属性の行の次の fn の名を全部集め、名の数が 5 以上であることと done (6) を見る。試作で、直しを 1 つ戻すと名指しの歯が落ちることを確かめた。node_cards の選びを空にすると cadq_title_cards_rules が、hist_cards から決定の id を外すと cadq_hist_cards_rules が、問いの題の a か決定の a の use:attach_some を外すか part_view に許しの属性を戻すと cadq_dom_wiring が、attach の on_cleanup を外すか pointerenter の閉包の番号の store を外すか unmount_hides の 0 の断りを外すと cadq_cleanup_closes が落ちる。
      filter の語（main 7ea0462 の contracts の verify の filter の語 231 を、ほかの語を部分の字として含まない 157 語に畳んだ語と、計画の後の行 g-gz の接頭辞 pgz_ と、同じノートのもう 1 つの行の接頭辞 cadl_・この行の接頭辞 cadq_ は並べない・159 語）は aaround_・accept_・acchold_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadopt_・cdorm_・cgdom_・cmark_・contract_form_・cround_・csled_・cspk_・ctick_・denv_・dnedge_・dnrow_・dnskip_・ecache_・epolq_・flight_・fmark_・fprem_・frame_・fserve_・fstop_・fxpre_・gapspage_・gbnote_・gfix_・gfresh_・ghb_・gjst_・glabel_・gnav_・gpface_・gpill_・gpulse_・graph_・gsum_・gtuck_・gview_・hacols_・harest_・hasplit_・hbconf_・hbmark_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hdchip_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hshist_・hspage_・hspk_・hsym_・iclose_・ilink_・kcli_・klink_・launch_・lcard_・ledgerblock_・lhome_・lidle_・lresume_・lsnap_・lspark_・lstore_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・parts_・pclosed_・pfold_・pipe_・plimit_・pmisfit_・pmore_・pquest_・pqueue_・project_・ptitle_・punmap_・pwhole_・qblock_・qgate_・qkey_・question_・relay_・rhold_・runsdoc_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・stcli_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_・pgz_・cadl_ で、新しい歯の名から先頭の cadq_ を除いた字は、このどれも部分の字として含まない（例 cadq_pipe_x・cadq_frame_x・cadq_ncard_x は不可）。歯の file は同じ 159 語を const FILTERS に持つ。畳んだ語で足りる（着地済みの filter のうち歯の名そのものと、server_ と stage_ で始まる接頭辞は、並べた語を部分の字として含む）。名は done に書いた cadq_title_cards_rules・cadq_hist_cards_rules・cadq_dom_wiring・cadq_cleanup_closes・cadq_names_stay_apart（どれも並べた語を含まない）。
      依存と順。depends は空（計画の依存の字 g-card-node は着地済みの行で、その card_of を使う）。この行は面の src/project/ask.rs と askpage.rs と src/widgets/hover.rs を書き、面の歯 askfocus・qkey・aaround・askcard・qblock・hruling・cround を置き場だけの = で持つ。同じノートの行 g-card-adopt-c は、この行が hover に置く attach_some を kit と台帳の block で使うので、ノートの depends でこの行の後に走る（書く file も = の file も重ならない）。計画の 5 節の鎖は、ask.rs が g-ask-around（着地済み）→ c-q-blocking（着地済み）→ g-keyed（着地済み）→ この行 → g-tick-adopt → f-undelivered、askpage.rs が e-policy-q（着地済み）→ g-hist-ruling（着地済み）→ g-jst（着地済み）→ この行、hover.rs が g-card-around（着地済み）→ この行。計画だけの行 g-tick-adopt と f-undelivered はこの行の後に ask.rs を書き、計画の行 g-attach-acct（account の私的な attach_some を寄せる）はこの行の attach_some を使うので、どれも順は便の bead の依存で持つ。main 7ea0462 で着地していない行（c-acct-spark・c-dn-edges・c-dn-unknown・c-limit-resume・c-seat-tick・g-pipe-memo・g-pipe-misfit・h-acct-rest・h-acct-spark・h-look・t-fx-prefix・g-pipe-memo は計画だけの行）の write-set とは、置き場だけの = を含めて重ならない。外の依存は足さず、Cargo.toml・vocab.json・style.css・fixture・nodecard.rs・map.rs・board.rs・kit.rs・batch.rs・account の下は触らない。src の行数は試作で ask.rs 724 → 761・askpage.rs 265 → 288・hover.rs 386 → 420（上限 1500 から遠い）。
      範囲の外。まとめて承認の行の題の card（見本も持たない）。問いの card の投稿の時刻の chip の経験者だけの注釈と経過の毎秒の書き直し（後の行 g-tick-adopt）。card の層の出し方（pointer の入りと出・猶予・置き場）は変えない（足すのは外した要素の後始末だけ）。着地済みの account の projects.rs と home.rs の私的な attach_some を hover の attach_some に寄せること（計画の行 g-attach-acct・この行は account の下を触らない）。
  - n: 4
    type: prose
    title: 行 g-card-adopt-c — 台帳の epic の行と抜けの検査の名指しの節点の card
    body: |
      在りかの main は 7ea0462（計画 surface-plan v0.45）。起草は 49ebfc2 で始め、第 1 版を 14b5a61 で確かめ、席の直し（引数を束ねて lint の許しの属性を外す・card を付ける関数を hover に 1 つだけ置き、kit の一覧の 1 項に card を受けて gaps.rs の私的な写しを消し、台帳の一覧の項にも card を付ける・外した要素の card の層を閉じる）を入れた第 2 版を 7ea0462 で確かめた（14b5a61 から 7ea0462 までに面の crate で変わったのは account の下と project の policy.rs と歯 hasplit・gpface・hdchip・hshist ほかで、この行の file と使う物と歯の file と fixture の字は同じ）。
      なぜ。要件 FR14 は hover の card を 4 行（1 行 36 字）と「詳しく」とし、card を出す要素の 1 つを頁を持つ節点の札とする。見本の HOME の block 台帳（docs/design/mock3/index.html の ledgerBlock）の epic の進みの行（class ep の div）は、epic の題を a の要素（class nl・data-key に epic の key）にし、ui.js の cardContent の節点の枝が節点の card を出す。見本の抜けの検査の頁（gaps.html）は名指しの項を ui.js の itemNode で組み、題の a の要素（class ttl と nl）に data-key を持たせ、同じ節点の card を出す。本番の epic の進みの行（src/project/ledger.rs の epic_view）は、着地済みの行 g-ledger-card が題を節点の頁への link にしたが card を持たない（その節の出さない物に、epic の行の card は後の行 g-card-node と g-card-adopt の分と書いた）。本番の抜けの検査の名指し（src/project/gaps.rs）は、着地済みの行 g-link-items が電文の節点に在る id を kit の一覧の 1 項 item_view のlink にしたが card を持たない。この行は着地済みの行 g-card-node の card_of で、この 2 か所と、台帳の block の一覧（epic の下の task と memo・kit の一覧の 1 項 item_view で描く）の項の題に節点の card を付ける。見本の台帳の block は一覧を持たないが、要件 FR14 は card を出す要素を頁を持つ節点の札とするので、一覧の項も節点の札として card を持つ（席の直し）。
      在りか・ledger.rs（write-set・1175 行・build.rs が生成する pub mod で crate::project::ledger・上限 1500 に近い file の 1 つ）。host の部分の use は crate::widgets::hover の Card（21 行）を持ち、std の BTreeMap を持たない。pub struct EpicBar（461 行・derive は Debug・Clone・PartialEq・Eq・pub な欄 id の String・title の String の Option・closed と total と pct の u32）と pub struct Metrics（derive は Debug・Clone・PartialEq・pub な欄 epics の EpicBar の Vec ほか）、pub fn content（551 行・指標の口の読みと Screen の参照を受け Body の Metrics・Filled は panel の値）と pub fn panel（572 行・LedgerStats の参照と Screen の参照を受け Metrics・EpicBar を組むのはここだけ）。配置の表 LAYOUT は項 Epics を段 More（class gmore の詳しく）に置く。wasm の target のときだけの pub fn view（831 行）は context の画面の状態の signal を dom::view に渡す。mod dom（839 行）の use は super の名の列・crate::frame の frame と Mode・crate::project の Body・UNKNOWN・fold・item_view・section・state_icon・unmeasured・crate::view の Fetched と Screen・label・crate::widgets::help の HelpCtx・hs・shows_internal・crate::widgets::hover::attach（854 行）。dom の view（856 行）は指標の口と未反映の口を読み、中身の閉包 body は Filled の Metrics の m で LAYOUT の段ごとに tier_view(*tier, parts, &m, screen, unref) を呼ぶ（874 行）。tier_view（引数 5 つ）は段 Main・Burn・More・Unref の 4 か所で line_view(*p, m) を呼び、line_view（991 行・Part と Metrics の参照を受ける）の Part::Epics の腕（1004 行）は m の epics を epic_view で描き、見出しと class lep の div に置く。epic_view（1117 行・EpicBar の参照を受ける）は class ep の div に、a の要素（href は frame の node_href に id と mode・中は class nid の span の id と空白と data-t の span の題）と、class bar と class meta num の span を置く。中身の閉包は指標の口と画面の状態に従って段の全部を組み直す。一覧の段（Tier::List）は、中身の閉包の Unmeasured と Empty の腕（894 行）と tier_view の Tier::List の腕で list_view(screen) を呼び、私的な list_view（1140 行・画面の状態の signal を受ける）は画面の状態を body に渡した値（Group の Vec）が Filled なら groups.iter().map(group_view)（1145 行）で描き、group_view（1153 行・Group の参照を受ける）は epic の項（head）を kit の item_view(epic, None) で、下の項（children）を item_view(c, None) で描く。pub struct Group（94 行）は pub な欄 head（kit の Item の Option）と children（Item の Vec）を持つ。
      在りか・gaps.rs（write-set・320 行・crate::project::gaps）。host の部分の use は std の BTreeMap・契約の graph の GraphDoc・InvariantCheck・Verdict・wire・super の Body・Item・NOT_READ・node_item・crate::frame の Block・crate::view の Fetched。pub struct Gaps（185 行・derive は Debug・Clone・PartialEq・Eq・pub な欄 tiles・rows と found の String の鍵と kit の Item の値の BTreeMap）、私的な fn doc（192 行）、pub fn body（206 行・Filled の Gaps の found は、一覧の行の名指しの id のうち kit の node_item が Some のもの）。wasm の target のときだけの mod dom（234 行）の use は super の BLOCK・Body・Gaps・Item・Row・Tile・body・mark_class・summary_tip と crate::project の body_view・fold・item_view・map・unmeasured と label と crate::widgets::help の expert_tip・h1・hs。row_view（255 行・Row と found の参照を受ける）は名指しの id を found で引き、在れば kit の item_view(item, None)（264 行）、無ければ class ttl の span の中の class nid の span の id の li を描く。filled（292 行・Gaps を受ける）は Gaps を欄に割り、行ごとに row_view(r, &found) を呼ぶ。view（307 行）はグラフの口を map の PATH で読み、中身の閉包が body の値で頁を組み直す。
      在りか・kit.rs（write-set・280 行・src/kit.rs・project の mod.rs が kit を再公開し crate::project の path で引く・host でも組む）。host の部分は pub struct Item（50 行・pub な欄 shape・alert・id・title・aside）と pub fn node_item（80 行・GraphDoc の参照と id を受け、電文の節点の項か None）ほか。162 行の字 pub use dom::{body_view, fold, item_view, section, state_icon, unmeasured};（wasm の target のときだけ）が再出しで、mod dom（166 行）の use は std の RefCell・leptos と、super の ALERT_STYLE・Body・Folds・Item・UNKNOWN・state_class・state_key、crate::frame の Block・Mode・node_href、crate::vocab の label、crate::widgets::help の HelpCtx と h2。pub fn item_view（259 行・Item の参照と番号の usize の Option を受け AnyView）は番号か印の span と、class ttl の a の要素（href は私的な mode_of の mode で node_href・中は class nid の span の id と空白と data-t の span の題）と class aside の span の li を描き、card を付けない。kit の item_view を呼ぶのは ledger.rs の group_view の 2 か所と gaps.rs の row_view の 1 か所だけで（grep で確かめた）、project の nodearound の mod dom は同じ名の私的な item_view（721 行・card と mode の閉包を受ける）を持ち、kit のものを使わない。
      在りか・着地済みの歯で、この行が字の期待を直す 2 つ（write-set）。tests/itemlink.rs の ilink_shared_row_links（143 行）は、kit.rs の mod dom の中に今の item_view の宣言の行そのままの字（146 行の decl）が在ることと、その本文の class ttl の a と node_href ほかの字を見る。tests/lhome.rs の lhome_list_draws_body（166 行）は、ledger.rs の mod dom の字 fn list_view( から次の 4 つの空白の字下げの閉じ波括弧の行までに字 screen.with(body) と map(group_view) が在ることと、mod dom に字 Tier::List => list_view(screen) と screen.with(count) が在ることを見る。どちらもこの行が引数を足す関数の宣言と呼びの字そのものを見るので、この行は宣言の行の字と 2 つの字の期待だけを新しい字に直し、ほかの assert と歯の名は変えない。lhome_list_draws_body の期待を直すのは、一覧の組の項に card を渡すために、list_view がグラフの口の読みを受け（字 list_view(screen) が list_view(screen, graph) に替わる）、組を card の表と一緒に group_view に渡す（字 map(group_view) が map(|g| group_view(g, &cards)) に替わる）からで、古い字を残すために src の形をねじ曲げることはしない（席の決め）。
      使う物（この行は書かない・確かめた）。widgets の nodecard の pub fn card_of（180 行）と widgets の hover の pub struct Card（94 行・Hash を持たない）と、wasm の target のときだけの pub fn attach（280 行・頁の card の層の context が無ければ何もしない・着地済みの ledger.rs の mod dom が burn の段に use する）と pub fn attach_some（web_sys の Element と Card の Option を受け、Some なら attach を呼び None なら何もしない・hover.rs の再出しの列に在る・同じノートの行 g-card-adopt-b が hover.rs に足すので、この行はノートの depends で b の後に走る）、project の map の pub const PATH と pub fn doc、crate::net::read（同じ path の読みを頁の block の間で 1 つの signal に分ける・HOME の頁では pipeline と次の一手の block が既にグラフの口を読み、抜けの検査の頁の読みは gaps だけ）、frame の Mode と node_href、widgets の help の HelpCtx。頁の枠の src/board.rs は provide_context(HoverCtx::default()) と CardLayer を持つ（73 行と 89 行）。fixture の値（触らない）は、graph-doc.json の節点 t3（epic・題 tsuzuri の面・台帳の属性の status open・card_of の kind は epic · beads · open・value は t3 と空白と 要約なし）と、ledger-stats.json の組 filled の epics（bm の 1 / 4 と zz.9 の 2 / 3・どちらも電文に無い）と、invariants.json（節点 0・判定 g-2 の名指しは台帳の接頭辞の 2 つの id・g-10 は n-1 から n-25・歯は g-2 の名指しを fx-g.9 と fx-g.15 に替えて使い、台帳の接頭辞の id を新しい歯の字に書かない）。
