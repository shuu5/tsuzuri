sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      要件 FR14 の hover の card を、頁を持つ節点の札のうちまだ card の無い 4 か所に付ける面の行 2 つ。
      card はグラフの口（/api/graph）の電文から widgets の nodecard の card_of で引く（題・種類と帯と状態・id と要約・出所）。電文に無い id と、グラフの口が読めない間は付けない。
      g-card-adopt-b は問いの頁の、答えを待つ質問の card の題と、これまでの決定の段の行の題と答えた決定の link に付ける。問いの card の DOM は一覧を読み直しても残るので、題の link だけを節点の card に従って組み直す。
      組み直しで外れた要素からは pointer の出の事件が来ないので、g-card-adopt-b は hover の attach に要素の後始末を足し、その要素の出した card がまだ出ていれば層を閉じる。
      g-card-adopt-c は台帳の block の epic の進みの行の題と一覧の項の題と、抜けの検査の頁の名指しの項の題に付ける。台帳の block の段の全部はグラフの読みに従わせない。
      card を付ける関数は hover の attach_some 1 つにし、一覧の 1 項は kit の item_view 1 つにする（block ごとの私的な写しを置かない）。
      語の辞書・stylesheet・契約と中核と境界の crate・外の依存は変えない。
