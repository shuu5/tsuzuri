  - n: 3
    type: prose
    title: 行 c-pipe-queue — 器の読める設計 pointer の無い task を Queued と Blocked の札にしない
    body: |
      在りかの main は 2dda25f（行 c-pipe-unmapped〔便 t3-hub.52.72〕は 014eb8e で着地済みで、この節の字はその後の code の値・判断の記録 ADR-16 と要件書 第 0.14 版と計画 第 0.32 版も 2dda25f に在る・中核の crate の字は 3e2e875 から変わっていない）。
      なぜ。持ち主の裁定 t3-hub.60（裁定 id = t3-hub.60:20260928T0904Z-1）と t3-hub.52.71（裁定 id = t3-hub.52.71:20260928T0904Z-1）〔束 batch:20260928T0904Z-1・どちらも案 A〕で発効した判断の記録 ADR-16 の決定 (5) は、pipeline の板の Queued / Blocked の札を設計の参照を持つ契約の bead だけにし、epic は板に出さないとする（要件 FR10 の第 0.14 版の字も同じ）。決定 (1) は bead の種類を器（scribe2）と同じ 2 つの印（控えの印 = label intake:memo・設計の参照 = acceptance の design = の行）で決め、設計の参照だけなら契約とする。中核の板は今、走行を 1 つも持たない open の task の bead の全部を Queued か Blocked の札にし acceptance を見ないので、設計の参照の無い task（器が流さない）が Queued の列に何時間も残った（2026-09-28 の持ち主の指摘・ADR-16 の context）。計画 surface-plan の 9 節のこの行の字のとおり、読みは器の列の受付（dispatch）の pointer の読みと同じにし、器が流せる契約だけを走行の無い札にする。設計の参照の無い open の task（器の台帳の形の判定では控えの印も設計の参照も無い形の崩れ）を板の 4 列の下の要修正の行に出すのは、後の行 c-pipe-misfit と g-pipe-misfit（計画 surface-plan 第 0.32 版の 9 節の行）で、この行は札にしないだけで、この行の歯は形の崩れを見ない。
      在りか・器の読み（器の repo の main fc76ebf の source で確かめた・器の repo は読むだけ）。器の pipe の dispatch の candidates の module の pub(super) fn is_input は、status が字 open で acceptance の前後の空白を除いた字が空でなく label intake:memo を持たない bead を列の入力にする。pub(super) fn pointer_of は acceptance の各行の前後の空白を除いた字のうち器の定数 DESIGN_KEY（字 design と空白と等号と空白）で始まる最初の行の残りを、前後の空白を除いて table の pub fn parse_pointer に通し、読めなければ待ちの理由 NoDesignPointer で便にしない（後の行は見ない）。parse_pointer は字を井桁で分けてちょうど 2 つの部分（path と行 id）になり、path の拡張子が md か toml（Rust の std::path::Path の extension）で、行 id が空でなく空白の char を含まないときだけ読める（path の file の stem が空でないことも見るが、Path の extension が在れば stem は空でない）。2026-09-28 に読んだ台帳の pointer の行は、この repo の 138 本が全部 design = contracts/<ノート>.toml#<行 id> の形、ほかの 2 つの project の台帳は design = docs/design/<file>.md#<行 id> の形（板は project ごとの server が出すので md の形も契約として読む・器の台帳の 2 本の読めない行の bead は閉じている）。
      在りか・中核（main 2dda25f で確かめた）。crates/tsuzuri-core/src/lib.rs の 14 行目は pub mod ledger; で 16 行目は pub mod pipeline;。src/ledger/mod.rs（write-set）の src/ledger/mod.rs の pub(crate) struct Bead（derive は Debug・Clone・PartialEq・Eq）は pub(crate) な欄 id・kind（NodeKind）・status・title・description・created・updated・closed・close_reason・parent・blockers を持ち、欄 acceptance と bd の種類の字は無い。impl Bead の is_open（status が closed でも tombstone でもなく、閉じた時刻が今以前でない）・open_at・has_open_blocker（blocks の先に台帳の open の bead が在る）。pub(crate) fn read（台帳の字を受け Option の Vec の Bead）は crate::graph::build の read_ledger で BdBead の列を読み、tombstone を落とし、bead_kind で種類を決めて Bead を struct の式で組む（src の下で Bead を組むのはこの read だけ・grep で確かめた・Bead は pub(crate) なので tests の下では組めず、欄を足しても壊れる式は無い）。lib の歯は 176 行の stats_epoch_secs_reads_rfc3339 と 185 行の stats_read_drops_tombstones_and_reads_parent_and_blocks（read の tombstone・親・blocks・更新時刻を見る）。src/graph/build.rs（置き場だけの =）は pub const POINTER_PREFIX（&str・字 design と空白と等号と空白）と、pub(crate) struct BdBead の欄 issue_type（Option の String）・labels（Option の String の Vec）・acceptance_criteria（Option の String・serde の alias で欄の名 acceptance も読む）と、pub(crate) fn bead_kind（issue_type が字 epic なら Epic、label intake:memo〔契約の型の ledger の MEMO_LABEL〕なら Memo、label intake:question〔QUESTION_LABEL〕なら Question、ほかは Task・この順に決める）を持つ。graph の add_ledger は acceptance の行（末の CR を除く）のうち POINTER_PREFIX で始まる行を節点の pointers に集め、不変条件 g-2（open の契約は pointer の行をちょうど 1 つ持つ）が数える（どの行も変えない）。
      在りか・板（src/pipeline.rs・write-set）。src/pipeline.rs の pub fn board（台帳の字・event log の字・今を受け pub struct Board〔pub な欄 board の PipelineBoard と unmapped の u32〕）は crate::ledger の read で読んだ bead の列を pub(crate) fn of_inputs に渡す（台帳が読めなければ None）。of_inputs は event log が読めなければ札を Unknown にして返し、読めれば event を log の順に読み、欄 run を持つ event のうち種類 RunCreated の最初の 1 件で走行を作り、作った走行の event ごとに口座の札を読み、種類が pub const STAGE_EVENTS（RunCreated・RunStage・RunDone・QuestionRaised）の event で段を決める最後の event を替える（detail の字の全体が pub const RETIRED〔字 retired〕の RunStage は替えない・行 c-pipe-unmapped）。札は bead の最初の RunCreated の順に 1 枚で、いちばん新しい走行の最後の event を pub fn stage_of に通し、問いの後の読みと閉じた bead の読み替えを当て（None なら欄 unmapped に 1 足す）、走行の札の後に、台帳の bead を台帳の順に見て、種類が NodeKind::Task でない・is_open が偽・走行を持つ（bead ごとの走行の表に在る）bead を飛ばし、残りの全部を runs 0・段 Blocked（has_open_blocker が真）か Queued・段の理由と口座と経過は None の札にして足す（今は acceptance を見ない）。台帳が読めなければ走行の無い札は作らない。module の頭の doc の 6 行目は、走行を 1 つも持たない open の契約は Blocked か Queued の札にする。の字。memo の bead（label intake:memo）は bead_kind で Memo、問い（label intake:question）は Question、epic は Epic なので、今も種類 Task でなく走行の無い札にならない（pointer を持っていても）。
      在りか・走行の無い札を読むほかの所（確かめた）。crate::next_step の私的な fn stalled_run は of_inputs の札のうち段が STALLED_STAGES（Failed と Stopped）の札だけを数え、走行の無い札（Queued と Blocked）は使わない。account board の run の 4 列（account の project の run_counts と run_counts_of）と session の表（session_lines）は event log の走行だけを読み、板の札を使わない。境界の server の口 /api/pipeline（src/server/board.rs の pub fn pipeline）は中核の board の欄 board をそのまま返す。面は電文の札を列に並べるだけで、札を足しも外しもしない。
      形（src/ledger/mod.rs）。Bead に pub(crate) な欄 acceptance（String・doc は acceptance の字で、bd の欄 acceptance_criteria か別名 acceptance の字のまま・無ければ空・行 c-pipe-queue）を足し、read は BdBead の acceptance_criteria の値（無ければ空の字）を置く。ほかの欄と is_open・open_at・has_open_blocker と read の tombstone の落としは変えない。
      形（src/pipeline.rs）。私的な fn dispatchable（acceptance の &str を受け bool）を足す。acceptance の各行の前後の空白を除いた字のうち POINTER_PREFIX で始まる最初の行を取り、その残りの前後の空白を除いた字を井桁で分けて、ちょうど 2 つの部分になり、前の部分を std::path::Path に通した extension が toml か md で、後の部分（行 id）が空でなく空白の char を含まないとき真にし、ほか（そういう行が無い・最初のそういう行が形に合わない）は偽にする（器の受付と同じ読みで、最初の行が形に合わなければ後の行は見ない）。POINTER_PREFIX は crate::graph::build から use で引き、字を 2 つ目に書かない。of_inputs の走行の無い札の飛ばしの条件に、dispatchable が偽の bead を足す（種類 Task で is_open が真で走行を持たず dispatchable が真の bead だけが札）。段の決め（Blocked か Queued）・札の欄の値・札の順（走行の札の後に台帳の順）と、stage_of・走行の札・閉じた bead の読み替え・runs_of は変えない。module の頭の doc の 6 行目の文を、走行を 1 つも持たない open の契約は acceptance に器の読める設計 pointer の行を持つ task の bead だけを Blocked か Queued の札にする（読みは器の列の受付と同じ dispatchable・pointer の無い task は器が流さないので札にしない・行 c-pipe-queue）の旨の 2 行に書き替える。
      形（fixture と着地済みの歯の組）。tests/fixtures/pipeline/pipeline.json（write-set）の台帳の fx-pl.13 の行（blocks の先が fx-pl.14）に欄 acceptance_criteria（字 design = contracts/fx.toml#pl-13）を、fx-pl.14 の行に欄 acceptance_criteria（字 design = contracts/fx.toml#pl-14）を足し、memo の fx-pl.m の行の前に fx-pl.17 の行（題 走行も設計 pointer も無い task・status open・issue_type task・created_at 2026-09-26T00:00:00Z・parent fx-pl・欄 acceptance_criteria は無し）を足し、欄 note の fx-pl.13 と fx-pl.14 の文に pointer を持つ旨を足し、fx-pl.17 は走行も pointer も無い open の task で札にならない旨の 1 文を足す。event log・期待の札・unmapped（1・fx-pl.12 の Merging）・now（1790474400）は変えない。fixture の台帳のほかの task（fx-pl.1 から fx-pl.12 と fx-pl.16）は走行を持つので pointer を足さない。tests/pclosed.rs（write-set）の fn ledger の cs.12（status open・走行無し）の bead の値に欄 acceptance_criteria（字 design = contracts/pc.toml#cs-12）を足す（ほかの 9 本と event log と期待は変えない）。
      決めた幅（起草の決め）。(a) pointer の読みは器の受付と同じにし、器の台帳の形の判定（ledger/form.rs の設計の参照の印・行の頭が design と空白と等号で始まれば形を問わない）とも中核の graph の不変条件 g-2 の数え（行の頭が POINTER_PREFIX で始まる行）とも合わせない（札は器が流せる契約だけに出す・計画のこの行の字）。そのため、設計の参照の印は持つが器が読めない行の task（例 字 design = x.txt#a）は、札にならず、器の台帳の形の判定（行の頭が design と空白と等号で始まれば設計の参照の印が在る）でも形の崩れにならない（2026-09-28 の 3 つの台帳の open の bead には 0 本・計画のこの行の字に従う席の決め）。(b) path が指す契約表の file と行が在るかは見ない（器の受付の後の段の検査で、板の入力に契約表は無い）。(c) 走行を持つ bead の札は pointer によらず今のまま（走行が在れば器が流した契約）。(d) status が in_progress の task も is_open が真なので、pointer を持てば今のまま Queued か Blocked（器の is_input は status open だけを列に入れるが、板は今の決まりを変えない）。(e) Blocked の判じの blocks の先は pointer を問わない（今のまま）。(f) 札にしない pointer の無い task は unmapped に数えない（unmapped は走行の段の数）。(g) bd の種類 decision の task は区分の外（ADR-16 の決定 (1)）だが、この行は種類の字を読まず、pointer を持つ decision は今のまま札になる（器の is_input も種類を見ない・2026-09-28 の 3 つの台帳に decision は 0 本）。(h) 次の一手と account board の run の 4 列と session の表は走行の無い札を使わないので変わらない。
