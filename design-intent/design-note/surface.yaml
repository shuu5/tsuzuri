        section: "8"
        write-set: ["crates/tsuzuri-core/src/lib.rs", "+crates/tsuzuri-core/src/ledger/mod.rs", "+crates/tsuzuri-core/src/ledger/metrics.rs", "+crates/tsuzuri-core/src/ledger/unreflected.rs", "+crates/tsuzuri-core/src/next_move.rs", "+crates/tsuzuri-core/tests/ledger.rs", "+tests/fixtures/ledger/judge/", "design-intent/rules.yaml"]
        verify: ["cargo nextest run -p tsuzuri-core --no-tests=fail ledger_"]
        size: M
        done: (1) 判定の 5 値と未反映の 3 種が fixture の期待と一致 (2) 閾値は rules 行 3 本から読み code に数が無い (3) 次の一手の 7 種の順が snapshot で pin される (4) 作業中の数と最古が出力に無い
        depends: [c]
      - id: e
        title: 面の server（台帳の読み・裁定と束と方針の受付・承認の event・SSE・bdw 経由の 1 経路の書き）
        req: [FR6, FR7, FR8, FR9, NFR2]
        section: "9"
        write-set: ["crates/tsuzuri-boundary/src/lib.rs", "+crates/tsuzuri-boundary/src/server/mod.rs", "+crates/tsuzuri-boundary/src/server/ledger.rs", "+crates/tsuzuri-boundary/src/server/ruling.rs", "+crates/tsuzuri-boundary/src/server/events.rs", "+crates/tsuzuri-boundary/src/server/graph.rs", "+crates/tsuzuri-boundary/tests/server.rs", "+tests/fixtures/surface/batch-3.yaml", "+tests/fixtures/surface/batch-a1.yaml", "+tests/fixtures/surface/stale-version.yaml"]
        verify: ["cargo nextest run -p tsuzuri-boundary --no-tests=fail server_"]
