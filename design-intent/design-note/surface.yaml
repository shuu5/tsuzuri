# 設計ノート surface — 面の模型（部品・口・歯・節点・辺・不変条件・契約の型・器に頼む口）。判断の記録 ADR-3・ADR-5・ADR-7・ADR-8 の実装の便の土台。発効 2026-09-26・持ち主の裁定 user 2026-09-26T14:37Z・記帳先 = t3-hub.1 notes。
# 便の契約表は v0.3 で設計ノート surface-base（便 a〜f）と surface-board（便 g〜k）へ移した（章の上限 12）。導出物は contracts/surface-base.toml と contracts/surface-board.toml。
meta:
  id: surface
  title: 面の便 — 契約の型・導出グラフ・面の server・2 つの board・席の hook・表示面を便の列で運ぶ
  version: v0.10
  status: effective
  generated: 2026-09-26
  profile: design-note
  approval:
    - {who: 持ち主, date: 2026-09-26, ruling: t3-hub.1（裁定 id = user 2026-09-26T14:37Z・notes に逐語）, verbatim: よい, surface: R-8}
  note: 持ち主の承認（2026-09-26T14:37Z）で effective（v0.1）。v0.7（2026-09-29）= 口の表の行 question-nudge の断り（台帳に無い id）を外しただけ（合図は台帳の見張りを起こすだけで書かず、台帳に無い id の合図は印の動かない周なら何もしない・台帳を読んで断ると席の 2 手目が bd の読みの上限まで待つ・行 e-signal〔ノート surface-wave21d〕の起草の席の決め）。決定と契約表の行は変えない。 v0.6（2026-09-28）= 18 節の辺の型に設計ノートの行の 2 型（req・depends）の行を足した（判断の記録 ADR-17・持ち主の裁定 t3-hub.65:20260928T1228Z-1）。v0.2（2026-09-27）= 器の seat deliver の着地に合わせた直しだけ（§3 の裁定と束の出力・§20 に記帳 id の形・§21 の器の口 3 行）で、決定と契約表の行は変えない。crate の名は判断の記録 ADR-4 決定 (1) の 6 つに tsuzuri- の接頭辞を付けたもので、scribe2 と folio2 の code の持ち込み（ADR-4 決定 (3)）はこの骨格へ入る。 v0.3（2026-09-27）= 章の上限 12（folio2 の ADR-21 決定 (3)・面の生成器の MAX_CHAPTERS）に収めるため、便の散文（旧 §5〜§15）と契約表（旧 §16）を字を変えずに設計ノート surface-base（便 a〜f）と surface-board（便 g〜k）へ移した。§ の番号は再利用しない（旧 §5〜§16 は欠番）。決定は変えない。 v0.4（2026-09-27）= 不変条件 g-12 の役を器の event の形に合わせた直しだけ（器の QuestionRaised は問いの id を持たず、作業役の問いは台帳の bead にしない＝scribe2 の席の回答・行は surface-base の c-g12）。 v0.5（2026-09-28）= 方針の記帳先の替え（判断の記録 ADR-16 の決定 (4)・行 e-policy-q の着地）に合わせ、節点 n-policy の役と記帳 id の形の方針の字を直しただけ。決定と契約表の行は変えない。第 0.8 版（2026-09-29）は、不変条件 move-grace の赤の条件を、群の記録の時刻から数える式から器の欄 grace_left= の写しに直した（要件 FR12 と受入 AC11 の直しに合わせた）。 第 0.9 版（2026-10-05）は、ノート surface-wave29a の行 c-commit-node に合わせ、17 節に節点の種類 commit の行を足して 21 にし、18 節に辺の型 landed の行を足して 33 にした（判断の記録 ADR-46 の決定 (2)・ADR-47 の決定 (9)）。 第 0.10 版（2026-10-05）は、ノート surface-wave29a の行 k-commit-count・c-memo-touch・f-row-basis に合わせ、18 節の touches の行の元を問い・memo・epic にし、設計ノートの行の欄 basis の辺を書き、landed の行に床の値の句を足した（判断の記録 ADR-44 の段 2・ADR-45 の門 H4）。

sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      裁定面（project board と account board）と表示面を、判断の記録 ADR-7 と ADR-5 の決定のとおりに Rust の wasm と同期の server で作る。
      便は契約表の行 1 つずつで、器が導出物を読んで受け付け、審査と実装と検査を経て着地する。
      mock v3 は見本であり、見本で測った受入の 12 条を歯にして本番の面が同じ物差しで数えられる形にする。
  - n: 2
    type: parts-table
    title: 部品
    rows:
      - {id: contract, name: 契約の型の crate（tsuzuri-contract）, role: server と面と hook が共有する電文と板の型。serde だけに依存し、面の側に写しを持たない, ref: [ADR-3, ADR-4, ADR-7]}
      - {id: core, name: 中核の crate（tsuzuri-core）, role: 導出グラフ・不変条件・近傍・台帳の指標・次の一手の純粋な関数。file も network も触らない, ref: [ADR-4, ADR-7]}
      - {id: boundary, name: 境界の crate（tsuzuri-boundary）, role: 面の server・台帳の読みと bdw 経由の書き・器の state と event の読み・席の hook・端末の Chrome の駆動・tz の口, ref: [ADR-4, ADR-5, ADR-8]}
      - {id: surface, name: 面の crate（tsuzuri-surface）, role: Leptos の csr の wasm。project board と account board の描画。論理は core に寄せ DOM と SSE だけを持つ, ref: [ADR-3, ADR-7]}
      - {id: xtask, name: xtask, role: trunk の組み立てと検査の入口。器の allowed-commands を cargo のままにする, ref: [ADR-4]}
      - {id: ledger, name: 台帳（beads）, role: 問い・裁定・方針・受けの正本。server は bdw 経由でしか書かない, ref: [P-19, ADR-7]}
      - {id: vessel-state, name: 器の state と event, role: tick-last・heartbeat-off・move-signal・群の記録・events.jsonl。面は読むだけ, ref: [N-2, ADR-7]}
  - n: 3
    type: ports-table
    title: 口（server の URL と tz の subcommand）
    rows:
      - {id: ledger-list, name: 台帳の一覧, input: 無し（絞りは URL の引数）, output: bead の一覧（id・種類・題・状態・更新時刻）, refuses: なし, ref: [FR13]}
      - {id: ledger-item, name: bead の中身, input: bead の id, output: 本文と notes と近傍の材料, refuses: 無い id, ref: [FR6]}
      - {id: graph-around, name: 近傍, input: 節点の id と段数と畳み, output: 根拠の側と影響の側の節点と辺（hub は畳んで総数を出す）, refuses: 無い id・段数の外, ref: [FR2, FR5]}
      - {id: graph-check, name: 不変条件の検査（tz graph --check）, input: 置き場と台帳と state dir, output: 違反の id と次の 1 手・3 値の判定, refuses: なし（読めなければ「まだ分からない」）, ref: [FR3]}
      - {id: events, name: 面の event（SSE）, input: 無し（Last-Event-ID で再開）, output: SeatState・QuestionPosted・RulingRead・RunStage の流れ, refuses: なし, ref: [FR9, NFR2]}
      - {id: state, name: 面の状態, input: 無し, output: 席の状態・次の一手・最終更新, refuses: なし, ref: [FR11]}
      - {id: question-nudge, name: 問いの合図, input: 問いの bead の id, output: 受領, refuses: 無し（合図は台帳の見張りを起こすだけで書かない）, ref: [FR6]}
      - {id: ruling, name: 裁定の受付, input: 問いの id と見た版の要約値と逐語, output: 記帳 id（形は §20 の ruling-id）と記帳時刻, refuses: 逐語が空・無い id・古い版・A-1 の印を持つ問いに個別の逐語が無い, ref: [FR6, FR7]}
      - {id: ruling-batch, name: 束の受付, input: 問いの id の列と束の逐語と個別の逐語, output: 束の id（形は §20 の ruling-id）と行ごとの結果, refuses: A-1 の印を持つ問いを含む・古い版・空の束, ref: [FR7]}
      - {id: policy, name: 方針の受付, input: 範囲と逐語, output: 方針の id, refuses: 逐語が空, ref: [FR8]}
      - {id: pipeline-board, name: pipeline の板, input: 無し, output: 4 列の札（契約 bead・走行の回数・段の理由・口座・経過）, refuses: なし（state dir が読めなければ走行だけ「まだ分からない」）, ref: [FR10]}
      - {id: account-board, name: account board の data, input: 時点（省けば今）, output: 群と口座・session の表・各 project の指標・次の一手, refuses: なし, ref: [FR11, FR12, FR13]}
      - {id: heartbeat, name: 停止の切り替え, input: 席の target と off か on, output: 器の CLI の結果, refuses: 知らない target（面は file を書かない）, ref: [FR12]}
      - {id: stage, name: 表示面の命令, input: 端末の名と命令（navigate・viewport・reload・click・入力・key・scroll・待ち）, output: 通し番号と結果（screenshot・DOM・console）, refuses: 知らない端末・知らない命令, ref: [FR16]}
      - {id: tz-folio, name: folio の口の subcommand, input: folio2 の口と同じ引数, output: 同じ出力と終了 code, refuses: folio2 の口と同じ, ref: [FR17]}
  - n: 4
    type: teeth-table
    title: 歯（壊すと落ちる自動の検査・受入の 12 条を含む）
    rows:
      - {id: batch-3, name: 3 問の束, red_when: 裁定 id が別々でない・束の id が違う・notes の末尾の行が無い・event が無い, fixture: tests/fixtures/surface/batch-3.json, ref: [AC1]}
      - {id: batch-a1, name: A-1 の印は束に入らない, red_when: A-1 の印を含む束が通るか台帳の byte が変わる, fixture: tests/fixtures/surface/batch-a1.json, ref: [AC2]}
      - {id: stale-version, name: 古い版は書かない, red_when: 古い版の要求で 1 byte でも書くか取り消しで問いが open に戻らない, fixture: tests/fixtures/surface/stale-version.json, ref: [AC3]}
      - {id: hub-cut, name: hub は広げない, red_when: 子 619 の hub が展開されるか光る節点が 20 を超える, fixture: tests/fixtures/graph/hub-619.json, ref: [AC4]}
      - {id: unruled, name: 裏付けの無い accepted, red_when: 裁定の行の無い accepted の記録を名指さないか、台帳が読めないのに合格が出る, fixture: tests/fixtures/graph/unruled.json, ref: [AC5]}
      - {id: question-gate, name: 問いの起票の門, red_when: 処分の無い id が在るのに allow が出るか、名指しの id の列が欠ける, fixture: tests/fixtures/guard/question-3.json, ref: [AC6]}
      - {id: runs-5, name: 走行の節点, red_when: 走行の節点が 5 つでない・板の札が 1 つでない・問いの無い Questioned を名指さない, fixture: tests/fixtures/graph/runs-5.json, ref: [AC7]}
      - {id: no-state, name: state dir が読めない, red_when: 走行以外の種類まで「まだ分からない」になるか、走行が 0 件と出る, fixture: tests/fixtures/graph/no-state.json, ref: [AC8]}
      - {id: accept-12, name: 面の受入 12 条, red_when: はみ出し・重なり・横 scroll・hover の欠け・語彙外の見出し・散文 300 字超・page error・文の予算・id 無し・URL に残らない切り替え・逐語の混入・外部の library のどれかが 1 でも出る, fixture: tests/fixtures/surface/accept-12.json, ref: [AC9, NFR1]}
      - {id: seat-health, name: 席の健康, red_when: stale な tick で応答なしが出ない・heartbeat-off で停止が出ない・切り替えで state dir の byte が変わる, fixture: tests/fixtures/account/seat-health.json, ref: [AC10]}
      - {id: move-grace, name: 退避までの残り秒, red_when: 残り秒が器の seat tick status の欄 grace_left= の写しでない（面か server が数える）・起こし直した席に出る, fixture: tests/fixtures/account/move-grace.json, ref: [AC11]}
      - {id: ledger-judge, name: 台帳の判定と未反映, red_when: 判定の 5 値か未反映の 3 種の数が期待と違う・要約の無い節点が名指されない, fixture: tests/fixtures/ledger/judge.json, ref: [AC12]}
      - {id: stage-argv, name: 端末の起動, red_when: 起動の引数か CDP の命令の列が snapshot と違う・届かない端末が配信に落ちない, fixture: tests/fixtures/stage/terminals.toml, ref: [AC13]}
      - {id: tz-parity, name: tz と folio の一致, red_when: 口のどれかで終了 code か出力が folio2 と違う, fixture: tests/fixtures/tz/parity.json, ref: [AC14]}
  - n: 17
    type: parts-table
    title: 導出グラフの節点の種類（閉じた一覧・21・判断の記録 ADR-7 決定 (2) と ADR-46 決定 (2)）
    rows:
      - {id: n-folio, name: 設計文書の 11 種, role: 条・規範文・規則行・目的・要件・非機能要件・受入基準・制約・登場人物・出力・判断の記録（索引の欄の決まり graph.yaml の node_kinds の写し・正本は folio の実装の定数）, ref: [FR2]}
      - {id: n-note-row, name: 設計ノートの行, role: id を持つ行（部品・口・欄・歯・契約表の行）。id は <文書 id>#<行 id>。文書そのものは節点にしない, ref: [FR2]}
      - {id: n-epic, name: epic, role: 台帳の epic（根と束）, ref: [FR2]}
      - {id: n-task, name: task（契約）, role: acceptance に設計の pointer 行を持つ bead。memo の label を持たない, ref: [FR2, FR10]}
      - {id: n-memo, name: memo, role: label intake:memo を持つ bead。昇格先の無い memo は未反映に数える, ref: [FR2, FR13]}
      - {id: n-question, name: question（問い）, role: label intake:question を持つ bead（席が置く問い）。touches と premises を metadata に持つ, ref: [FR2, FR4, FR6]}
      - {id: n-ruling, name: あなたの決定（裁定）, role: 問いの bead の notes の定型行から導く。裁定 id は server が発行, ref: [FR2, FR6]}
      - {id: n-receipt, name: orchestrator の受け, role: 問いの bead の notes の「受け」の定型行から導く, ref: [FR2, FR9]}
      - {id: n-policy, name: 全体への指示（方針）, role: "方針 1 つにつき根の直下の閉じた問い（label intake:question と policy-scope:<範囲>）の notes の方針 id の行と、今までの memo「方針」の notes の定型行（読むだけ）から導く（判断の記録 ADR-16 の決定 (4)・行 e-policy-q）", ref: [FR2, FR8]}
      - {id: n-run, name: run（走行）, role: 器の event log の RunCreated から導く。属性（段・理由・verdict・審査・費用・時刻）は辺にしない, ref: [FR2, FR10]}
      - {id: n-commit, name: commit（着地の commit）, role: 器の event log の RunDone の札 sha の 40 字の小文字の 16 進から導く。id はその 40 字・題は頭の 8 字。git を読まない（判断の記録 ADR-47 の決定 (2)・行 c-commit-node）, ref: [FR2]}
  - n: 18
    type: parts-table
    title: 導出グラフの辺の型（閉じた一覧・33 + 候補 1・判断の記録 ADR-7 決定 (2) と ADR-17 と ADR-46 決定 (2)）
    rows:
      - {id: e-folio, name: 設計文書の 17 型, role: in-article・relations.articles・relations.reqs・relations.rules・relations.sections・amended_by・article・refs・basis・goals・rules・adrs・verify.ac・verifies・figures・produced・amends（graph.yaml の edge_types の写し）, ref: [FR2]}
      - {id: e-note-rows, name: 設計ノートの行の 2 型, role: req（行 → 要件）・depends（行 → 先に要る行）（folio の索引の辺の行の写し・folio2 の判断の記録 ADR-32）。行の欄 basis（行 → 根拠の条・規範文・規則行・判断の記録）は設計文書の型 basis の辺になる（行 f-row-basis）, ref: [FR2]}
      - {id: e-beads, name: 台帳の 4 型, role: parent-child・blocks・relates-to・discovered-from（bd の依存の種類のうち使う 4 つ）, ref: [FR2]}
      - {id: e-design, name: design, role: 契約 → 設計ノートの行。正本 = bead の acceptance の pointer 行, ref: [FR2, FR10]}
      - {id: e-ruled-by, name: ruled_by, role: 判断の記録・規則行・発効した文書 → 裁定。正本 = 承認欄の型付きの 2 欄（台帳 id と裁定 id）。「裁定 → 変えた節点」は逆向きとして導き書かない, ref: [FR2, FR3]}
      - {id: e-answers, name: answers, role: 裁定 → 問い。正本 = notes の定型行（server が書く）, ref: [FR2, FR6]}
      - {id: e-touches, name: touches, role: 問い・memo・epic → 任意の節点。正本 = bead の metadata の閉じた key（席が問いを置くとき・memo と epic は行 c-memo-touch）, ref: [FR2, FR4]}
      - {id: e-premises, name: premises, role: 問い → 方針。正本 = metadata, ref: [FR2, FR8]}
      - {id: e-source, name: source, role: memo → 裁定か走行。正本 = metadata（器が memo の plan に写す）, ref: [FR2]}
      - {id: e-run-of, name: run_of, role: 走行 → 契約 bead。正本 = run id の前半（器の event RunCreated）, ref: [FR2, FR10]}
      - {id: e-raised, name: raised, role: 走行 → 問い。正本 = 器の event QuestionRaised と問いの bead の metadata source, ref: [FR2, FR10]}
      - {id: e-ran-by, name: ran_by, role: 走行 → 口座。口座は節点にせず走行の属性の札で出す（正本 = SeatSpawned の account）, ref: [FR2, FR10]}
      - {id: e-landed, name: landed, role: 着地の commit → 契約 bead。正本 = 器の event log の RunDone の札 sha と run id の前半（行 c-commit-node）。着地で閉じた契約（閉じた理由の頭が landed か着地・問い t3-hub.80.11 の裁定）のうち landed の辺を受けない数は tz graph --check の床の値（行 k-commit-count・判断の記録 ADR-45 の門 H4）, ref: [FR2, FR3]}
      - {id: e-promoted-to, name: promoted_to（候補）, role: memo → 昇格先（設計の行か契約）。正本は未定（metadata の key の候補）。型の名と正本は便 c で決める, ref: [FR13]}
  - n: 19
    type: parts-table
    title: 不変条件（閉じた一覧・12・tz graph --check が 3 値で数える）
    rows:
      - {id: g-1, name: 辺の両端が実在する, role: 片端の無い辺は違反。読めない出所の辺は「まだ分からない」, ref: [FR3]}
      - {id: g-2, name: open の契約は設計の行をちょうど 1 つ指す, role: pointer が解けない・2 つ以上・無い契約は違反, ref: [FR3]}
      - {id: g-3, name: 発効した記録は裁定の行を持つ, role: accepted の判断の記録と規則行は ruled_by を持ち、先の bead の notes にその裁定の行が在る, ref: [FR3]}
      - {id: g-4, name: 問いは処分を持つ, role: touches を 1 つ以上持ち、見た版から要約値が変われば古い印, ref: [FR3, FR4]}
      - {id: g-5, name: 孤児 0, role: 全 bead が根から parent-child で届く。未着地の契約行はどれかの bead に指される, ref: [FR3]}
      - {id: g-6, name: 輪 0, role: blocks に循環が無く parent-child は木, ref: [FR3]}
      - {id: g-7, name: 宙に浮いた裁定 0, role: 裁定は問い（answers）か発効した記録（ruled_by の先）のどちらかに結ばれる, ref: [FR3]}
      - {id: g-8, name: memo と契約の重なり 0, role: memo の label と pointer 行の両方を持つ bead は違反。両方とも無い open の bead は g-2 が数える（便 c の契約の審査で重なりを解いた・2026-09-27）, ref: [FR3]}
      - {id: g-9, name: 名指した id は欄にも在る, role: 本文で名指した id が欄か辺に無ければ数える（規則行 R-17 と同じ・detect から 2 周の実測の後に deny）, ref: [FR3]}
      - {id: g-10, name: id の族が互いに素, role: 設計文書・設計ノートの行・台帳・走行の 4 族の id が repo 内で一意, ref: [FR3]}
      - {id: g-11, name: 走行は契約を 1 つ持つ, role: run_of をちょうど 1 つ持ち、先の bead が在る（宙に浮いた走行 0）, ref: [FR3, FR10]}
      - {id: g-12, name: Questioned の走行は問いを持つ, role: その走行の中に答えの無い QuestionRaised が在る（問いは走行の id と何番目かで決まり台帳の bead にしない・surface-base の行 c-g12）, ref: [FR3, FR10]}
  - n: 20
    type: fields-table
    title: 契約の型（契約の型の crate に置く型の一覧・便 b）
    rows:
      - {id: surface-event, name: 面の event（SeatState・QuestionPosted・RulingRead・RunStage の閉じた enum）, need: required, shape: table}
      - {id: surface-state, name: 面の状態（席の状態・次の一手・最終更新）, need: required, shape: table}
      - {id: question-nudge, name: 問いの合図（問いの bead の id）, need: required, shape: text}
      - {id: ruling-request, name: 裁定の要求（問いの id・見た版の要約値・逐語）, need: required, shape: table}
      - {id: ruling-response, name: 裁定の応答（裁定 id・記帳時刻）, need: required, shape: table}
      - {id: ruling-id, name: "記帳 id の形（ASCII の英数字と . - _ : だけの 1 語・64 byte 以下）", need: required, shape: text, note: "1 問の裁定は <問い bead id>:<UTC の年月日 T 時分 Z>-<n>（例 t3-hub.5:20260926T1437Z-1）・束は batch:<同じ時刻>-<n>・方針は、方針 1 つごとに作る閉じた問いの id を使う問い id の形（<方針の問い bead id>:<同じ時刻>-1・行 e-policy-q の後・今までの memo の方針の行は policy:<同じ時刻>-<n>）。器の seat deliver の id-shape（ASCII の英数字と . - _ : の 64 byte 以下）を通る形で、server だけが発行する。討論 B §8.1 の @ と # を使う形は id-shape で断られるので採らない。面の外で席が記帳する裁定（今の「user <UTC の分>Z」）は面ができるまでの形として残す"}
      - {id: batch-request, name: 束の要求（問いの id の列・束の逐語・個別の逐語）, need: required, shape: table}
      - {id: batch-response, name: 束の応答（束の id・行ごとの結果）, need: required, shape: table}
      - {id: item-outcome, name: 行ごとの結果（書いた・飛ばした・断った）, need: required, shape: text}
      - {id: policy-request, name: 方針の要求（範囲・逐語）, need: required, shape: table}
      - {id: ledger-write, name: 台帳への書き（AppendNotes・CloseItem・CreateChild の閉じた enum・bdw の argv を組む）, need: required, shape: table}
      - {id: graph-node, name: グラフの節点（id・種類・所属 file・要約値・題 36 字）, need: required, shape: table}
      - {id: graph-edge, name: グラフの辺（from・to・型）, need: required, shape: table}
      - {id: pipeline-card, name: pipeline の札（契約 bead・走行の回数・段・段の理由・口座・経過）, need: required, shape: table}
      - {id: account-board, name: account board の data（群と口座・session の行・project の指標・次の一手）, need: required, shape: table}
      - {id: next-move, name: 次の一手（閉じた 7 種）, need: required, shape: text}
      - {id: ledger-judge, name: 台帳の判定（順調・停滞・滞り・積み増し・台帳なし）, need: required, shape: text}
  - n: 21
    type: ports-table
    title: 器に頼む口と読む file（面は書かない・器の版上げで足すものは note に）
    rows:
      - {id: v-tick-last, name: 席の合図の健康（読む）, input: 席の置き場の tick-last（ts と decision と reason）, output: healthy か stale（now − ts ≤ 2 × seat.tick_interval_s）, refuses: なし（無ければ「まだ分からない」）, ref: [FR12]}
      - {id: v-heartbeat-off, name: 席の停止（読む）, input: 席の置き場の heartbeat-off（ts）, output: 停止中か, refuses: なし, ref: [FR12]}
      - {id: v-move-signal, name: 退避の合図（読む）, input: 席の置き場の move-signal（群の記録の ts）と rules 行 seat.move_grace_s, output: 退避までの残り秒, refuses: なし, ref: [FR12]}
      - {id: v-group-record, name: 群の記録（読む）, input: groups/<群>.account と history, output: 今の口座・移った時刻・理由・前の口座, refuses: なし, ref: [FR12]}
      - {id: v-events, name: 器の event log（読む）, input: fleet/events.jsonl と pipe/<run>/events.jsonl, output: 走行の属性・席の状態・承認の event, refuses: なし（読めなければ走行だけ「まだ分からない」）, ref: [FR10]}
      - {id: v-heartbeat-cli, name: 停止の切り替え（撃つ）, input: 器の CLI（scribe2 seat heartbeat off か on か status と --state-dir と --target）, output: 器の結果, refuses: 知らない target, ref: [FR12], note: 在る（scribe2 席の回答 2026-09-26）。面は file を書かない}
      - {id: v-deliver, name: "待ちの席へ 1 行（撃つ）", input: "器の CLI（scribe2 seat deliver と --state-dir と --target と --ruling <記帳 id>）", output: "rc 0 = 届いた（stdout に target と ruling と consumed）・rc 1 = 断りか未確認と理由の 1 語（stderr）・rc 2 = 器の event log が読めない", refuses: "理由の閉じた 13 語（id-empty・id-shape・id-long・state-dir・store・no-row・busy・state-missing・state-unreadable・no-rule・pane-missing・input-busy・input-unknown）。busy は停止の hook の経路へ回し、input-busy は周期の読みで撃ち直し、未確認は撃ち直さず、どれも裁定から 2 分で席の受けが無ければ面に「席に届いていない」", ref: [FR9], note: "着地 = scribe2 main bed08a9（scribe2 の要件書 FR79 と受入 AC49・判断の記録 ADR-0077・設計 seat-heartbeat.md §15）。送る行は「scribe2 seat: 裁定 <記帳 id> が届いた（在りかは裁定面の記帳）」の固定の 1 行で、自由な文は送れない。席の UserPromptSubmit の hook がこの行を見て台帳から逐語を注入する（便 f）。器は撃ち手と書き込みの有無と裁定の中身を確かめない"}
      - {id: v-device, name: 端末の一覧（読む）, input: 器の宣言（host の面）の端末の行（名・ssh の宛先・Chrome の場所・画面の環境・入力の環境・専用の profile・OS）, output: 端末の名で引ける行, refuses: 知らない名, ref: [FR16], note: 器の版上げで足す行。scribe2 の台帳の memo s2-07l.658（昇格は持ち主の裁定・host の面の表が増えるので判断の記録の条件）}

