        depends: [b, c, d]
      - id: f
        title: 席の hook（裁定の配達と停止の hook の 2 経路）と問いの起票の門（近傍の処分の宣言）
        req: [FR4, FR9]
        section: "10"
        write-set: ["crates/tsuzuri-boundary/src/lib.rs", "+crates/tsuzuri-boundary/src/hook/mod.rs", "+crates/tsuzuri-boundary/src/hook/deliver.rs", "+crates/tsuzuri-boundary/src/hook/stop.rs", "+crates/tsuzuri-boundary/src/hook/question_gate.rs", "+crates/tsuzuri-boundary/tests/hook.rs", "+tests/fixtures/guard/question-3/"]
        verify: ["cargo nextest run -p tsuzuri-boundary --no-tests=fail hook_"]
        size: M
        done: (1) 問いの起票 3 通り（deny と id の列挙・allow・古い要約値で deny） (2) 待ちの席へ配達の 1 行・考え中の席は停止の hook が続けさせる (3) 裁定から 2 分で受けが無ければ面の状態に「届いていない」
        depends: [e]
      - id: g
        title: project board（問いの card・地図の 4 面・近傍・次の一手・pipeline の板・orchestrator と口座・台帳の指標・「?」と hover）
        req: [FR1, FR5, FR6, FR10, FR11, FR12, FR13, FR14]
        section: "11"
        write-set: ["crates/tsuzuri-surface/src/lib.rs", "+crates/tsuzuri-surface/src/project/mod.rs", "+crates/tsuzuri-surface/src/project/ask.rs", "+crates/tsuzuri-surface/src/project/map.rs", "+crates/tsuzuri-surface/src/project/pipeline.rs", "+crates/tsuzuri-surface/src/project/home.rs", "+crates/tsuzuri-surface/src/widgets/mod.rs", "+crates/tsuzuri-surface/src/widgets/hover.rs", "+crates/tsuzuri-surface/src/widgets/help.rs", "+crates/tsuzuri-surface/tests/project.rs", "+crates/tsuzuri-surface/index.html", "+crates/tsuzuri-surface/style.css"]
        verify: ["cargo nextest run -p tsuzuri-surface --no-tests=fail project_"]
        size: L
        done: (1) 節点の形と帯の class が snapshot で pin される (2) card の順（題・概要・理由・推奨・答え・つながり）が pin される (3) 4 面の切り替えと段数と畳みが URL に残る (4) hover の置き場と猶予が browser の runner で通る (5) 論理は中核の関数の呼び出しだけで面の crate に判定の分岐が無い
        depends: [e]
      - id: h
        title: account board（HOME・session の表・各 project の tab・新しい窓と「戻る」・停止の切り替え・退避までの残り秒）
        req: [FR1, FR11, FR12, FR13]
        section: "12"
        write-set: ["crates/tsuzuri-surface/src/lib.rs", "+crates/tsuzuri-surface/src/account/mod.rs", "+crates/tsuzuri-surface/src/account/home.rs", "+crates/tsuzuri-surface/src/account/session.rs", "+crates/tsuzuri-surface/src/account/project.rs", "+crates/tsuzuri-boundary/src/server/account.rs", "+crates/tsuzuri-surface/tests/account.rs", "+tests/fixtures/account/seat-health/", "+tests/fixtures/account/move-grace/"]
        verify: ["cargo nextest run -p tsuzuri-surface --no-tests=fail account_", "cargo nextest run -p tsuzuri-boundary --no-tests=fail account_"]
        size: L
        done: (1) 3 つの tab と並べ方と 3 つの幅が URL に残る (2) 新しい窓の名と「戻る」の 3 段 (3) tick が stale なら応答なし・heartbeat-off なら停止・切り替えは器の CLI の argv だけで state dir の byte 不変 (4) 残り秒が「記録の時刻 + 猶予 − 今」で起こし直した席には出ない
        depends: [g]
      - id: i
        title: 表示面（端末の一覧から ssh で Chrome を専用の profile の app mode で起こし CDP を tunnel で操作する・届かない端末は配信に落とす）
        req: [FR16]
        section: "13"
        write-set: ["crates/tsuzuri-boundary/src/lib.rs", "+crates/tsuzuri-boundary/src/stage/mod.rs", "+crates/tsuzuri-boundary/src/stage/terminal.rs", "+crates/tsuzuri-boundary/src/stage/cdp.rs", "+crates/tsuzuri-boundary/src/stage/relay.rs", "+crates/tsuzuri-boundary/tests/stage.rs", "+tests/fixtures/stage/terminals.toml"]
        verify: ["cargo nextest run -p tsuzuri-boundary --no-tests=fail stage_"]
        size: L
        done: (1) 起動の引数（専用の profile・app mode・入力の環境）が snapshot と一致 (2) CDP の命令の列が snapshot と一致 (3) ssh で届かない端末の行は配信に落ちる (4) 端末の値は code に無く器の宣言の行から読む
        depends: [b]
      - id: j
        title: 受入 12 条の測定（browser の runner・全画面 × 2 幅 × 2 mode・1 件でも落ちる）
        req: [NFR1, NFR3]
        section: "14"
        write-set: ["+crates/tsuzuri-surface/tests/accept.rs", "+tests/fixtures/surface/accept-12/", "+xtask/src/accept.rs", "xtask/src/main.rs"]
        verify: ["cargo nextest run -p tsuzuri-surface --no-tests=fail accept_"]
        size: M
        done: (1) 12 条それぞれに 1 件仕込んだ fixture で違反 1 が出る (2) 現物の全画面で 12 条とも 0 (3) 結果が report に残る (4) 面の crate の依存が rules 行 R-2 の別枠の予算に収まる
        depends: [g, h]
      - id: k
        title: tz の口（folio の口を同じ名の subcommand に・graph は tz graph に吸収・inject は持たない・終了 code と出力の一致）
        req: [FR17]
        section: "15"
        write-set: ["crates/tsuzuri-boundary/src/lib.rs", "+crates/tsuzuri-boundary/src/main.rs", "+crates/tsuzuri-boundary/src/cli/mod.rs", "+crates/tsuzuri-boundary/src/cli/folio.rs", "+crates/tsuzuri-boundary/tests/tz.rs", "+tests/fixtures/tz/parity/"]
        verify: ["cargo nextest run -p tsuzuri-boundary --no-tests=fail tz_"]
        size: M
        done: (1) 11 の口で終了 code と出力が folio2 と一致 (2) tz graph --design が設計の索引だけを出す (3) tz inject が無い (4) folio という名の binary が workspace に無い
        depends: [a]
  - n: 17
    type: parts-table
    title: 導出グラフの節点の種類（閉じた一覧・20・判断の記録 ADR-7 決定 (2)）
    rows:
      - {id: n-folio, name: 設計文書の 11 種, role: 条・規範文・規則行・目的・要件・非機能要件・受入基準・制約・登場人物・出力・判断の記録（索引の欄の決まり graph.yaml の node_kinds の写し・正本は folio の実装の定数）, ref: [FR2]}
      - {id: n-note-row, name: 設計ノートの行, role: id を持つ行（部品・口・欄・歯・契約表の行）。id は <文書 id>#<行 id>。文書そのものは節点にしない, ref: [FR2]}
      - {id: n-epic, name: epic, role: 台帳の epic（根と束）, ref: [FR2]}
      - {id: n-task, name: task（契約）, role: acceptance に設計の pointer 行を持つ bead。memo の label を持たない, ref: [FR2, FR10]}
      - {id: n-memo, name: memo, role: label intake:memo を持つ bead。昇格先の無い memo は未反映に数える, ref: [FR2, FR13]}
      - {id: n-question, name: question（問い）, role: 席が置く問いの bead。touches と premises を metadata に持つ, ref: [FR2, FR4, FR6]}
      - {id: n-ruling, name: あなたの決定（裁定）, role: 問いの bead の notes の定型行から導く。裁定 id は server が発行, ref: [FR2, FR6]}
      - {id: n-receipt, name: orchestrator の受け, role: 問いの bead の notes の「受け」の定型行から導く, ref: [FR2, FR9]}
      - {id: n-policy, name: 全体への指示（方針）, role: 根の直下の memo「方針」の notes の定型行から導く, ref: [FR2, FR8]}
      - {id: n-run, name: run（走行）, role: 器の event log の RunCreated から導く。属性（段・理由・verdict・審査・費用・時刻）は辺にしない, ref: [FR2, FR10]}
  - n: 18
    type: parts-table
    title: 導出グラフの辺の型（閉じた一覧・30 + 候補 1・判断の記録 ADR-7 決定 (2)）
    rows:
      - {id: e-folio, name: 設計文書の 17 型, role: in-article・relations.articles・relations.reqs・relations.rules・relations.sections・amended_by・article・refs・basis・goals・rules・adrs・verify.ac・verifies・figures・produced・amends（graph.yaml の edge_types の写し）, ref: [FR2]}
      - {id: e-beads, name: 台帳の 4 型, role: parent-child・blocks・relates-to・discovered-from（bd の依存の種類のうち使う 4 つ）, ref: [FR2]}
      - {id: e-design, name: design, role: 契約 → 設計ノートの行。正本 = bead の acceptance の pointer 行, ref: [FR2, FR10]}
      - {id: e-ruled-by, name: ruled_by, role: 判断の記録・規則行・発効した文書 → 裁定。正本 = 承認欄の型付きの 2 欄（台帳 id と裁定 id）。「裁定 → 変えた節点」は逆向きとして導き書かない, ref: [FR2, FR3]}
      - {id: e-answers, name: answers, role: 裁定 → 問い。正本 = notes の定型行（server が書く）, ref: [FR2, FR6]}
      - {id: e-touches, name: touches, role: 問い → 任意の節点。正本 = bead の metadata の閉じた key（席が問いを置くとき）, ref: [FR2, FR4]}
      - {id: e-premises, name: premises, role: 問い → 方針。正本 = metadata, ref: [FR2, FR8]}
      - {id: e-source, name: source, role: memo → 裁定か走行。正本 = metadata（器が memo の plan に写す）, ref: [FR2]}
      - {id: e-run-of, name: run_of, role: 走行 → 契約 bead。正本 = run id の前半（器の event RunCreated）, ref: [FR2, FR10]}
      - {id: e-raised, name: raised, role: 走行 → 問い。正本 = 器の event QuestionRaised と問いの bead の metadata source, ref: [FR2, FR10]}
      - {id: e-ran-by, name: ran_by, role: 走行 → 口座。口座は節点にせず走行の属性の札で出す（正本 = SeatSpawned の account）, ref: [FR2, FR10]}
      - {id: e-promoted-to, name: promoted_to（候補）, role: memo → 昇格先（設計の行か契約）。正本は未定（metadata の key の候補）。型の名と正本は便 c で決める, ref: [FR13]}
  - n: 19
    type: parts-table
    title: 不変条件（閉じた一覧・12・tz graph --check が 3 値で数える）
    rows:
      - {id: g-1, name: 辺の両端が実在する, role: 片端の無い辺は違反。読めない出所の辺は「まだ分からない」, ref: [FR3]}
      - {id: g-2, name: open の契約は設計の行をちょうど 1 つ指す, role: pointer が解けない・2 つ以上・無い契約は違反, ref: [FR3]}
      - {id: g-3, name: 発効した記録は裁定の行を持つ, role: accepted の判断の記録と規則行は ruled_by を持ち、先の bead の notes にその裁定の行が在る, ref: [FR3]}
      - {id: g-4, name: 問いは処分を持つ, role: touches を 1 つ以上持ち、見た版から要約値が変われば古い印, ref: [FR3, FR4]}
      - {id: g-5, name: 孤児 0, role: 全 bead が根から parent-child で届く。未着地の契約行はどれかの bead に指される, ref: [FR3]}
      - {id: g-6, name: 輪 0, role: blocks に循環が無く parent-child は木, ref: [FR3]}
      - {id: g-7, name: 宙に浮いた裁定 0, role: 裁定は問い（answers）か発効した記録（ruled_by の先）のどちらかに結ばれる, ref: [FR3]}
      - {id: g-8, name: 4 象限の違反 0, role: memo の label と pointer 行の両方在る・両方無い bead は違反（epic と裁定の bead は除く）, ref: [FR3]}
      - {id: g-9, name: 名指した id は欄にも在る, role: 本文で名指した id が欄か辺に無ければ数える（規則行 R-17 と同じ・detect から 2 周の実測の後に deny）, ref: [FR3]}
      - {id: g-10, name: id の族が互いに素, role: 設計文書・設計ノートの行・台帳・走行の 4 族の id が repo 内で一意, ref: [FR3]}
      - {id: g-11, name: 走行は契約を 1 つ持つ, role: run_of をちょうど 1 つ持ち、先の bead が在る（宙に浮いた走行 0）, ref: [FR3, FR10]}
      - {id: g-12, name: Questioned の走行は問いを持つ, role: raised の先の問いが在り、QuestionAnswered が在れば問いは closed, ref: [FR3, FR10]}
  - n: 20
    type: fields-table
    title: 契約の型（契約の型の crate に置く型の一覧・便 b）
    rows:
      - {id: surface-event, name: 面の event（SeatState・QuestionPosted・RulingRead・RunStage の閉じた enum）, need: required, shape: table}
      - {id: surface-state, name: 面の状態（席の状態・次の一手・最終更新）, need: required, shape: table}
      - {id: question-nudge, name: 問いの合図（問いの bead の id）, need: required, shape: text}
      - {id: ruling-request, name: 裁定の要求（問いの id・見た版の要約値・逐語）, need: required, shape: table}
      - {id: ruling-response, name: 裁定の応答（裁定 id・記帳時刻）, need: required, shape: table}
      - {id: batch-request, name: 束の要求（問いの id の列・束の逐語・個別の逐語）, need: required, shape: table}
      - {id: batch-response, name: 束の応答（束の id・行ごとの結果）, need: required, shape: table}
      - {id: item-outcome, name: 行ごとの結果（書いた・飛ばした・断った）, need: required, shape: text}
      - {id: policy-request, name: 方針の要求（範囲・逐語）, need: required, shape: table}
      - {id: ledger-write, name: 台帳への書き（AppendNotes・CloseItem・CreateChild の閉じた enum・bdw の argv を組む）, need: required, shape: table}
      - {id: graph-node, name: グラフの節点（id・種類・所属 file・要約値・題 36 字）, need: required, shape: table}
      - {id: graph-edge, name: グラフの辺（from・to・型）, need: required, shape: table}
      - {id: pipeline-card, name: pipeline の札（契約 bead・走行の回数・段・段の理由・口座・経過）, need: required, shape: table}
      - {id: account-board, name: account board の data（群と口座・session の行・project の指標・次の一手）, need: required, shape: table}
      - {id: next-move, name: 次の一手（閉じた 7 種）, need: required, shape: text}
      - {id: ledger-judge, name: 台帳の判定（順調・停滞・滞り・積み増し・台帳なし）, need: required, shape: text}
  - n: 21
    type: ports-table
    title: 器に頼む口と読む file（面は書かない・器の版上げで足すものは note に）
    rows:
      - {id: v-tick-last, name: 席の合図の健康（読む）, input: 席の置き場の tick-last（ts と decision と reason）, output: healthy か stale（now − ts ≤ 2 × seat.tick_interval_s）, refuses: なし（無ければ「まだ分からない」）, ref: [FR12]}
      - {id: v-heartbeat-off, name: 席の停止（読む）, input: 席の置き場の heartbeat-off（ts）, output: 停止中か, refuses: なし, ref: [FR12]}
      - {id: v-move-signal, name: 退避の合図（読む）, input: 席の置き場の move-signal（群の記録の ts）と rules 行 seat.move_grace_s, output: 退避までの残り秒, refuses: なし, ref: [FR12]}
      - {id: v-group-record, name: 群の記録（読む）, input: groups/<群>.account と history, output: 今の口座・移った時刻・理由・前の口座, refuses: なし, ref: [FR12]}
      - {id: v-events, name: 器の event log（読む）, input: fleet/events.jsonl と pipe/<run>/events.jsonl, output: 走行の属性・席の状態・承認の event, refuses: なし（読めなければ走行だけ「まだ分からない」）, ref: [FR10]}
      - {id: v-heartbeat-cli, name: 停止の切り替え（撃つ）, input: 器の CLI（seat heartbeat off か on と target）, output: 器の結果, refuses: 知らない target, ref: [FR12], note: command の名は scribe2 席に確認中。面は file を書かない}
      - {id: v-deliver, name: 待ちの席へ 1 行（撃つ）, input: 器の配達の口（deliver_within を包む口）と席の target と 1 行, output: 届いたか, refuses: 席が考え中（停止の hook に回す）, ref: [FR9], note: 新設の口。器の側の起票は scribe2 席に確認中}
      - {id: v-device, name: 端末の一覧（読む）, input: 器の宣言（host の面）の端末の行（名・ssh の宛先・Chrome の場所・画面の環境・入力の環境・専用の profile・OS）, output: 端末の名で引ける行, refuses: 知らない名, ref: [FR16], note: 器の版上げで足す行。scribe2 席に確認中}

