  - n: 3
    type: prose
    title: 行 v-hold-why — 止めの口の理由と観測の口の止めの行と待ちの知らせの重なりの欄の名（判断の記録 ADR-42 の器の行の 1 本目）
    body: |
      差は 27b の器の行の差の上で切った。積みの木 ae47433a（main に 27b の 29 本の差と xp-host-runs の直しを重ねた席の木）の上に試作を載せ、ae47433a から 22346cc4 までを切った（58,420 byte）。27b の器の行（xp の 5 行・v-brief-const・v-brief-meter）の着地を待つのは席の止めで行う（27b は別のノートなので depends に書けない）。

      在りか。差の file docs/design/patch/v-hold-why.patch は、積みの木 ae47433a とその上に試作を載せた木 22346cc4（写し drafts/w132a の branch fix-w136a）との差（15 file・+230 −50）。差の触れる file のうち main と積みの木で字が違う file（27b の器の行の足し）でも差の hunk はその足しと離れていて、床の写し main 5fabb6b7 に 3 行の差を順に当てると rc 0。

      なぜ。判断の記録 ADR-42 の決定 (4)(5)(8)。器の止めの印（hold）は理由の字を持たず、止めの理由は席の台帳の notes にだけ在った。理由の正本を器の止めの印の行の欄 detail の 1 つにし、release で印を外すと効いている理由も一緒に消える形にする。器の待ちの知らせ（idle）の末尾の重なりの待ちの欄の名 held は、新しい状態の留め置き（Held）と同じ語根で取り違えるので、名を overlap に替える（数と file の並びの形は替えない）。この欄の読み手は器の中だけで、知らせの字を組む関数（pipe/dispatch/facts.rs の line）と器の e2e の歯 6 か所（notify.rs の 2 つの断言と seat/tick.rs の 4 つの否定の断言）。tsuzuri の crates と plugin の差し込みと席の script には無い（係の notes の表）。器の設計文書 dispatcher §4・§6・§26 は凍ったまま（ADR-36 の決定 (7)）で、この節が新しい振る舞いを書く: §4 の印は typed な欄 mark のまま判定に使い、理由は detail の自由文で判定に使わない（C3.3 を守る）。§6 の観測の口は今の行の字を替えずに行を足す。§26 の知らせの字の held は overlap と読み替える。

      形。 - 口: pipe dispatch hold BEAD --reason WORDS（--reason は器の stop と regate と同じ字 REASON_FLAG・pipe dispatch の許す引数に足した）。印の名を解いた後、印を書く前に dispatch.rs の why_of が受けを決め、断る周は cli.rs が refused の 1 行（rc 1）で返り、印を書かない。通る周は mark が detail を emit_mark に渡す（emit_mark は detail の引数を足しただけ・ほかの欄は替えない）。 - 畳み: candidates.rs の marks_of が、First と Hold の印の行の detail の頭が定数 WHY_PREFIX（字 reason と半角のコロン）の時だけ bead ごとの理由の map（Marks の欄 why）に入れ、そうでない First と Hold と Release は外す。entry_of は WaitReason::Hold に欄 why（印の理由・判定に使わない）を載せる。render は why を書かない（reason=hold と半角のコロンと印の時刻のまま）。 - 観測: listing が件数の行の位置に、候補の理由が Hold の件ごとの止めの行（hold_line・書き出しは定数 HOLD_LINE の [DISPATCH-HOLD]）を、事前審査の行と束の行の前に差す。依存が開いた bead に付けた止めは、理由が依存なので止めの行を出さない（器の判定の順は依存が先・ADR-42 の決定 (2)）。 - 使い方: dispatch の usage の字に --reason WORDS（hold は要る）を足し、pipe の使い方の行と help の FORM に [dispatch hold: --reason WORDS（要る）] の括りを足した（外形の snapshot の 3 行も同じ）。 - 知らせ: facts.rs の line の 4 つの字 held を overlap に替え、doc の字を合わせた（seat/tick.rs の注 1 行も）。 - 着地済みの歯の止めの撃ち（e2e の notify.rs 3・pipe/dispatch.rs 2・waiting.rs 2・terminal.rs 2 の 9 か所）に理由を足し、seat/tick.rs の e2e の否定の断言 4 つの字を overlap に替えた。refused.rs の歯の見本の Hold に欄 why を足した。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜3 番目の項は verify の 3 行目（器の lib の歯 vhold_ の 3 本・在りかは pipe/dispatch.rs の歯の区間）、4 と 5 番目の項は 4 行目（器の e2e の歯 vhold_ の 2 本・在りかは e2e の pipe/dispatch/terminal.rs）、6 番目の項は 5 行目（着地済みの器の e2e の歯 pipe_notify_facts_ の 2 本・在りかは e2e の notify.rs）、最後の 7 番目の項は 6 行目で測る。verify の 1 行目（差の hunk が全部木に在る）と 2 行目（器の clippy）は命令の rc で測る守り。pipe の使い方と help の FORM の字は外形の snapshot の歯（6 行目の入れ子の nextest）が測る。

      構造の連鎖（木 22346cc4 で grep）。WaitReason::Hold の構築は entry_of の 1 か所と歯 2 つ（dispatch.rs と refused.rs の見本）。Marks の構築は marks_of の 1 か所。emit_mark の呼び手は mark の 1 か所、mark の呼び手は cli.rs の queued の 1 か所。器の止めの口を撃つ着地済みの歯は e2e の 4 file の 9 か所で全部に理由を足した。知らせの字の held の読み手は上の 7 か所で全部を直した。器の file の行の上限（1500・幅で数える）: 書く src の file の最大は pipe/dispatch.rs の 1443（試作の後）。

      入口の赤。積みの木 ae47433a には名に vhold_ を持つ歯が 1 本も無いので、verify の 3 行目と 4 行目は --no-tests=fail で落ちる。着地済みの歯 pipe_notify_facts_ の 2 本は、この差の e2e の字（overlap）を積みの木の src（held）で撃つと落ちる（下の噛みの facts の 2 つ）。

      試作と噛み。写し drafts/w132a で書く file は write-set の中で閉じる（15 file）。verify の 2〜5 行目は rc 0。入れ子の clippy（cwd scribe2/・入れ子の置き場・--workspace --all-targets -- -D warnings）は 3 行の各先端で rc 0（係 w136a）。席が 27b の差と 28a の 8 行の差を重ねた積みの木で根の xtask check（入れ子の build・nextest・clippy・器の check を含む）を撃ち、rc 0（根の歯 3277 本・器の歯 4079 本）。係は噛みの木（先端に、印の file が無ければ全部効かない変異の枝を足した木・差の file に入れない）で、印なしの nextest --workspace --no-fail-fast を入れ子の置き場（target は nested/scribe2・cwd は scribe2/）で 1 回撃ち、4079 本のうち 4078 本が通った。落ちた 1 本は xtask の歯 check_passes_on_workspace で、理由は噛みの枝の関数が持つ印の file の絶対 path（paths-clean と private-clean の 2 つ・先端の字には無い）だけ。 噛みは 3 行の先端に、印の file に書いた変異の名だけを効かせる枝を足した木（差の file に入れない・組み直さずに変異を切り替える）で、句ごとに 1 つの変異を入れて名指しの歯を撃った。この行は 28 の変異（lib 14・e2e 14）が全部 rc 100 で、落ちた断言はどれもその句の字（done の項ごとに 1 番目 6・2 番目 6・3 番目 2・4 番目 7・5 番目 5・6 番目 2・6 番目の 2 つは知らせの字を held に戻す変異で、積みの木の src の字と同じ）。印なしの対照（lib の 8 本と e2e の 6 本）は rc 0。残りの 4 句（1 番目の項の理由の無い hold も印としては効く・2 番目の項の理由なしは detail なしで通す・3 番目の項の行の字の形と理由の無い候補は立たない）にも後から 7 つの変異（lib）を入れ、どれも名指しの歯が rc 100 で落ちた（係 w134a）。理由の無い hold を印の表に入れない変異は初め rc 0（歯の空振り・断言が印の種だけを見ていた）だったので、歯 vhold_marks_keep_the_reason_of_the_last_hold_only の断言を印の種と時刻（理由の無い hold の時刻）の組で見る形に直し、rc 100 になった。この 7 つの対照（lib の 6 本）は rc 0。

      範囲の外。局面の出力への理由の足し（行 v-hold-case）。受付の断りの理由（行 v-refuse-why）。board の段と札（board の行）。器の設計文書の書き換え。席の包みの script と起草の守りと memory を理由つきの止めに替える手（着地の後の席の手）。
  - n: 4
    type: prose
    title: 行 v-hold-case — 局面の出力の契約の部品の止めの理由と時刻と止めの直後の書き直し（判断の記録 ADR-42 の器の行の 2 本目）
    body: |
      差は 27b の器の行の差の上で切った。積みの木 ae47433a（main に 27b の 29 本の差と xp-host-runs の直しを重ねた席の木）の上に試作を載せ、22346cc4 から cfb81a4f までを切った（23,031 byte）。27b の器の行（xp の 5 行・v-brief-const・v-brief-meter）の着地を待つのは席の止めで行う（27b は別のノートなので depends に書けない）。

      在りか。差の file docs/design/patch/v-hold-case.patch は、行 v-hold-why の試作の木 22346cc4 とその上に試作を載せた木 cfb81a4f（写し drafts/w132a の branch fix-w136a）との差（9 file・+172 −18）。行 v-hold-why の差を当てた木にそのまま当たる（差の触れる file は 27b の器の行の差が触れない）。

      なぜ。判断の記録 ADR-42 の決定 (5)(6)。board は器の局面の出力（fleet/lifecycle.json）だけを読み、止めは契約の部品の局面 contract-queued・理由 hold で出るが、理由の字も止めた時刻も持たず（since は書き手が前の出力から継ぐかこの書きの時刻）、止めの口は列の 1 周も全部の書き直しも撃たないので、止めた直後は board に出なかった。受付の断りの部品も、列の理由が admission の周は since を持たなかった。器の設計文書 case-lifecycle §5.2（契約の種類の欄）・§12・§21（答えの口の後に切り離した子で全部の書き直しを起こす形）は凍ったまま（ADR-36 の決定 (7)）で、この節が新しい振る舞いを書く: §5.2 の契約の欄は pointer に任意の why を足す（無ければ鍵を書かない・出力の版は 1 のまま・読み手は欠けた鍵を値なしと読む）。§21 の切り離した子の形を止めの口にも使う。

      形。 - 型: fleet/phase.rs の Judged（列の判定 1 件）に欄 why（止めの印の理由）を足し、candidates.rs の judged_of が WaitReason::Hold の why を渡す。case/mod.rs の Extra::Contract に欄 why を足す。 - 部品: phase.rs の contract_part が、列の理由が定数 HOLD（字 hold）の契約の since を判定の値の字（印の時刻）に、why を判定の why にし、ほかの理由は since も why も持たない。refusal_of の 1 つ目の枝（列の理由が admission）は、同じ名の断りの記録が在ればその時刻を since にする（名が替わって記録がまだ無い周は書き手が継ぐ）。 - 出力: fleet/lifecycle.rs の extra_pairs が why の在る部品だけ鍵 why を書き、part_of が鍵 why を読む（部分の書き直しは出力を読んで書き直すので、契約の部品の why はこの読みと書きで残る）。閉じた契約（ledger/phase.rs）と歯の見本の構築は why を持たない。 - 口: cli.rs の queued が、理由つきの止めの印を書けた周に rewrite_after_hold を呼び、--repo を渡された周だけ自分の binary の子 fleet lifecycle write --state-dir S --repo R（--bd と --rules はそのまま）を process group 0・入出力を捨てて起こし、待たずに返る（口の rc と字は替えない・起こせない周は何もしない＝次の契機が拾う・seat/cli.rs の rewrite_later と同じ形・起こす記述は Invocation で Command::new を書かない）。 - 着地済みの歯の Extra::Contract の構築 4 か所（ledger/phase.rs の歯・lifecycle_partial.rs の見本・e2e の seat/tick.rs）に why を足した。

