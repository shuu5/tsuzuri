    title: 行 c-held-stage — 段 Held と局面の出力の欄 why
    body: |
      在りか。差の file docs/design/patch/c-held-stage.patch は 席の積みの木 ae47433a（main c9e6f915 に 27b の 29 行の試作の差を重ねた木・写し drafts/w101a-l1 の枝 seat-27b-v3） と、その上に試作を載せた木 1f19a6d2（写し drafts/w133a の枝 p-hdst）との差。差は 27b の board の行の差の上で切った（27b の行 g-sum-pick〜g-node-excerpt ほかが pop.rs・style.css・vocab.json・node.rs を書く）。27b の board の行の着地を待つのは席の止めで行う（27b の行は別のノートなので depends に書けない）。

      なぜ。判断の記録 ADR-42 決定 (1)(2)。席の止め（器の止めの印 hold）と器の受付の断りは、今の board では Queued の列に出て、止めた事が見えない。段を型に足すと、列・札・一覧・account board の段の字が同じ 1 つの分類から決まる。blocked の定義（ADR-27 決定 (6)）は替えない。

      形。 - 契約の src/board.rs: Stage に Held（Blocked の次・ALL は 9）、column で Held は Blocked の列。 - 契約の src/case.rs: CasePart に任意の欄 why（serde の既定・None は電文に書かない）。 - 中核の src/case.rs: 部品の欄 why を任意の字の欄として読む関数 loose（鍵が無いか null は None・型が違えば部品を落とす）。 - 中核の src/pipeline.rs: 定数 HOLD（字 hold）・queued_of は HOLD を Held に・phase_of は contract-refused を Waiting の Held に・module の注。 - 面の網羅の match に Held の腕を足す（account/session.rs の段の字 Held・widgets の runflow.rs は Blocked と Queued と同じ何もしない腕・widgets の pop.rs と keyline.rs はこの行では Queued と同じ表示〔次の行が替える〕）。 - 着地した歯の書き替え: 契約の teeth1/cform_board.rs（段の数 8 を 9）と snapshots/board.json（Held の 1 行）・中核の teeth1/bvqcol.rs（理由 hold の札を Held）と teeth1/bvlc.rs（contract-refused の 2 か所を Held）と teeth2/stats.rs（fixture に出る段の集合から Held を除く）・面の teeth4/pipe.rs（fixture の Held の札の数は 0）。契約の部品を字で組む歯 6 本（契約 cform_case・中核 bvcase・面 bvcols・bvpop・bvuphase・bvwhy）は why の 1 行を足すだけ。 - 新しい歯の段 crates/tsuzuri-core/tests/hdst.rs（接頭辞 hdst_・7 本）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜6 番目の項は verify の 4 行目（歯 hdst_held_in_closed_stages・hdst_seat_hold_is_held・hdst_intake_refusal_is_held・hdst_partner_reasons_stay_blocked・hdst_self_clearing_reasons_stay_queued・hdst_unreadable_cases_no_held・hdst_why_optional_field）、7 番目と 8 番目の項は 5〜15 行目（歯 contract_form_board_closed_lists・contract_form_board_snapshot_matches・bvcform_snapshot_matches・bvcase_fields_copied_from_fixture・bvlc_waiting_contract_with_runs・bvlc_runless_from_parts・bvqcol_since_and_reason_from_case・stats_pipeline_matches_fixture・bvcols_lines_from_pop_wait・bvpop_blocked_targets_with_stage・bvuphase_rows_get_phase・bvwhy_queued_why_from_case・pipe_columns_order_and_cards_sorted_by_elapsed）、最後の 9 番目は 16 行目で測る。verify の 1〜3 行目は命令の rc で測る守りで、done の項にしない。

      構造の連鎖（試作の木で grep）。Stage を網羅する match は面の 4 か所（session.rs の stage_word・runflow.rs の with_runs・pop.rs の stage_facts・keyline.rs の key_line）で、全部をこの差が書く。CasePart を字で組む所は中核の case.rs と歯の 6 本で、全部をこの差が書く。境界の server は CasePart を型の名だけで使う（試作の木で境界の歯 teeth1〜teeth4 の 532 本が緑）。

      試作と噛み。試作は写し drafts/w133a（席の積みの木 ae47433a（main c9e6f915 に 27b の 29 行の試作の差を重ねた木・写し drafts/w101a-l1 の枝 seat-27b-v3） から）で、差の file は 29,609 byte・21 file・新しい file 1・+249 −18。書く file は write-set の中で閉じる（差の名の一覧と同じ）。入口の赤は r-hdst（05ab91a5・スタブの型と定数）で hdst の 7 本のうち 5 本が rc 100（Blocked と Queued のまま の守り 2 本は今の振る舞いなので緑）。句ごとの噛みは 16（段の閉じた列 3・席の止め 3・受付の断り 2・Blocked と Queued のまま 2・読めない時 1・why の読み 5） で、どれも名指しの歯が rc 100 で落ち、対照は rc 0（bites.tsv）。verify の clippy と歯の行は試作の木で rc 0。根の xtask の check は係が撃たない（席が積みの木で撃つ）。

      範囲の外。札の印と吹き出しと個別の頁（後の行）。器の止めの口と局面の出力の欄 why と since を書く側（同じノートの器の行）。
  - n: 8
    type: prose
    title: 行 g-held-col — 列の見出しの内訳と札の印と要の 1 行
    body: |
      在りか。差の file docs/design/patch/g-held-col.patch は行 c-held-stage の試作の木 1f19a6d2 と、その上に試作を載せた木 32d248bf（写し drafts/w133a の枝 s-hdcol・係 w133a の木 b33ddc8f に係 w135a が列の見出しの数の字の形の直しを入れた）との差。差は 27b の board の行の差の上で切った（27b の行 g-sum-pick〜g-node-excerpt ほかが pop.rs・style.css・vocab.json・node.rs を書く）。27b の board の行の着地を待つのは席の止めで行う（27b の行は別のノートなので depends に書けない）。

      なぜ。判断の記録 ADR-42 決定 (3)(7)。留め置きは Blocked と同じ列にまとめて出し、札の印で席の止めと受付の断りを分ける（Blocked の札は印を持たない）。

      形。 - widgets の keyline.rs: 定数 HOLD（字 hold・中核の写し）・型 HeldBy（Seat と Intake）・表 HELD_MARKS（止めた者・印の語の鍵・class）・関数 held_by（段 Held の札だけ・理由 hold は席・ほかは受付）・key_line の Held の腕（印の語と中黒と経過）。段の名は project の pipeline.rs に書かない決まり（着地した歯 pipe_stage_column_from_contract）なので、止めた者の判じは keyline.rs に置いた。 - project の pipeline.rs: Kcard に欄 held・kcard が held_by で置く・関数 count_text（Blocked の列は内訳で、字は Blocked の数と中黒〔U+00B7〕と Held の数を空白を挟まずにつなぐ・例 2·8）・列の見出しと札の meta の DOM。 - style.css: 印の 3 つの規則（.kcard .m .hdm と .hd-seat と .hd-intake）。 - vocab.json: col_block の字と注・hm:seat と hm:intake。 - 着地した歯の書き替え: teeth1/bvcull.rs（Kcard の欄の一覧に held）と teeth1/bvfive.rs（col_block の字）。 - 新しい歯の段 crates/tsuzuri-surface/tests/hdcol.rs（接頭辞 hdcol_・6 本）。スマホの段の tile の数は列の札の全部のまま（tile の字は語の辞書の col_block の字で Blocked / Held に替わる）。

      数の字の形（係 w135a の画面の測り）。空白を挟む形（2 / 8）は列の見出しの中で空白で折れ、幅 1280 と 960 で 2 行・700 で 3 行に割れた（係 w134a）。斜線の形（2/8）は折れないが、8 件中 2 の分数と読まれうる。内訳は札の要の 1 行（印の語 · 経過）と同じ中黒（U+00B7）で、空白を挟まずにつなぐ（2·8）。数字と中黒の並びは折れ目を持たない。区切りを正符号にした形（2+8）と、語と数を対にした形（B2·H8）は幅が足りず、1280 で語 Blocked が語の中で折れた。試しの state dir の板を幅 1280・960・700・601・390 で開くと、中黒の形の数の字はどの幅でも 1 行・横の scroll は 0・ほかの 4 列の見出しの高さと語の行の数は今の木と同じで、1280 と 960 では Blocked の列の見出しの語も語の中で折れない（見出しの高さは 42 から 35 で Running / Gated の列と同じ）。700 と 601 では 5 列の全部の見出しの語が語の中で折れる（今の板の形から・見出しの箱の幅 100 と 88 に、点と語 Blocked と ? の button と隙間だけで 90 を要し、数の字の 1 桁と隙間を置けない）ので、この行の範囲の外。数が 2 桁（12·3）になると 1280 でも語 Blocked が語の中で折れる（斜線の形も同じ・数の字は 1 行のまま）。ほかの合わせ列（Running / Gated・Questioned / Failed / Stopped）の数は札の数の 1 つの数字で、内訳も同じ span（class cnt num）と同じ字の太さと大きさのまま置く。幅 600 以下の段の tile は列の札の全部の数を出し、語 Blocked / Held の末が切れるが、Running / Gated などの合わせ列の tile も前からの形なので、この行では替えない。style.css と語の辞書の col_block の注（数は Blocked / Held の内訳）はこの直しで替えない。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜6 番目の項は verify の 4 行目（歯 hdcol_held_by_reason・hdcol_card_mark_in_blocked_column・hdcol_count_breakdown・hdcol_key_line_mark_and_age・hdcol_vocab_and_marks・hdcol_css_and_dom_text）、7 番目の項は 5 行目と 6 行目（歯 bvcull_card_hover_values_gone・bvfive_column_words_in_vocab）、最後の 8 番目は 7 行目で測る。

      試作と噛み。試作は写し drafts/w133a（席の積みの木 ae47433a（main c9e6f915 に 27b の 29 行の試作の差を重ねた木・写し drafts/w101a-l1 の枝 seat-27b-v3） から）で、差の file は 19,506 byte・7 file・新しい file 1・+277 −10。書く file は write-set の中で閉じる（差の名の一覧と同じ）。入口の赤は r-hdcol（c5edf1af・スタブの型と関数）で hdcol の 6 本とも rc 100（直した歯を載せた枝 r3-hdcol 291b34be でも 6 本とも rc 100）。句ごとの噛みは 15（係 w133a・直しの前の木）と直しの 2（中黒を斜線に替える・中黒の前後に空白を挟む、のどちらでも hdcol_count_breakdown が rc 100・係 w135a） で、どれも名指しの歯が rc 100 で落ち、対照は rc 0（bites.tsv）。verify の clippy と歯の行は試作の木で rc 0。根の xtask の check は係が撃たない（席が積みの木で撃つ）。

      範囲の外。吹き出しの欄と個別の頁（後の行）。account board の形と台帳の指標と次の一手は替えない。
  - n: 9
    type: prose
    title: 行 g-held-pop — 吹き出しの留め置きの 4 つの欄
    body: |
      在りか。差の file docs/design/patch/g-held-pop.patch は行 g-held-col の試作の木 32d248bf と、その上に試作を載せた木 9f067d32（写し drafts/w133a の枝 s-hdpop・試作 866eb931 の載せ直し・差の字は係 w133a の差と同じ）との差。差は 27b の board の行の差の上で切った（27b の行 g-sum-pick〜g-node-excerpt ほかが pop.rs・style.css・vocab.json・node.rs を書く）。27b の board の行の着地を待つのは席の止めで行う（27b の行は別のノートなので depends に書けない）。

      なぜ。判断の記録 ADR-42 決定 (7)。吹き出しは止めた者（席か器の受付）・理由（席の止めは理由の字・受付の断りは断りの名と 1 行の理由）・止めた時刻と経過・解く条件を出し、理由の欄が無い時はまだ分からない。

      形。 - widgets の pop.rs: 表 HELD_KEYS（pf_held_by・pf_held_why・pf_held_at・pf_held_until）と HELD_WORDS（止めた者ごとの止めた者の鍵と解く条件の鍵）・関数 held_why（局面の出力の契約の部品の欄 why）・refusal_text（この行では断りの名の字のまま・次の行が平易な字にする）・held_facts（4 つの欄・個別の頁も使う）・stage_facts の Held の腕は held_facts・with_why の Queued の腕から Held を外す（留め置きの札に起きない理由を足さない）。 - vocab.json: 欄の語の鍵 4 つと hb:seat・hb:intake・hu:seat・hu:intake。 - 新しい歯の段 crates/tsuzuri-surface/tests/hdpop.rs（接頭辞 hdpop_・6 本）。受付の断りの札は Queued の起きない理由（今は表に無い語でまだ分からない）を出さなくなり、断りの名と why を出す（係 w131a の案の wait_of の直しは要らない）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜6 番目の項は verify の 4 行目（歯 hdpop_seat_hold_facts・hdpop_intake_refusal_facts・hdpop_missing_why_and_since_unknown・hdpop_other_stages_no_held_facts・hdpop_with_why_leaves_held・hdpop_vocab_words）、最後の 7 番目は 5 行目で測る。

      試作と噛み。試作は写し drafts/w133a（席の積みの木 ae47433a（main c9e6f915 に 27b の 29 行の試作の差を重ねた木・写し drafts/w101a-l1 の枝 seat-27b-v3） から）で、差の file は 15,184 byte・3 file・新しい file 1・+283 −2。書く file は write-set の中で閉じる（差の名の一覧と同じ）。入口の赤は r-hdpop（f55aa908・空の表と空の関数）で hdpop の 6 本のうち 5 本が rc 100（ほかの段は欄なし の 1 本は今の振る舞いなので緑）。句ごとの噛みは 12 で、どれも名指しの歯が rc 100 で落ち、対照は rc 0（bites.tsv）。verify の clippy と歯の行は試作の木で rc 0。根の xtask の check は係が撃たない（席が積みの木で撃つ）。

      範囲の外。断りの名の平易な字（次の行）。個別の頁（後の行）。
  - n: 10
    type: prose
    title: 行 g-held-name — 受付の断りの名の平易な字
    body: |
      在りか。差の file docs/design/patch/g-held-name.patch は行 g-held-pop の試作の木 9f067d32 と、その上に試作を載せた木 55e3feb6（写し drafts/w133a の枝 s-hdnm・試作 cff524e5 と係 w134a の bvlex の表の直し 8d44c8bb の載せ直し・差の字は係 w134a の差と同じ）との差。差は 27b の board の行の差の上で切った（27b の行 g-sum-pick〜g-node-excerpt ほかが pop.rs・style.css・vocab.json・node.rs を書く）。27b の board の行の着地を待つのは席の止めで行う（27b の行は別のノートなので depends に書けない）。

      なぜ。判断の記録 ADR-42 決定 (7) の受付の断りは断りの名の平易な字と 1 行の理由。断りの名は器の pipe/refuse.rs の REFUSALS の 27 語（write-set-overlap・teeth-outside-write-set・cap-headroom ほか）で、名のままでは持ち主に意味が届かない。

      形。 - widgets の pop.rs: 表 REFUSALS（27 語の写し・面の crate は器に依存しない）と鍵の頭 REFUSAL_HEAD（字 rf と半角のコロン）・refusal_text を表の語なら語の辞書の字に替える（詳細の後ろは外す・表に無い名は名のまま）。 - vocab.json: 27 の鍵（label は平易な字・plain は解き方の 1〜2 行・internal は器の型の名）。 - 行 g-held-pop の歯の段 hdpop.rs の受付の断りの理由の字 2 か所を平易な字（定数 PLAIN）に直す。 - 新しい歯の段 crates/tsuzuri-surface/tests/hdnm.rs（接頭辞 hdnm_・3 本・27 語を字で持つ）。 - 着地済みの歯の群 teeth2 の bvlex.rs: 表 KEY_PREFIXES（接頭辞と字をつないで語の辞書を引く口）に字 rf と半角のコロンを足し、型を 5 から 6 の配列にする（鍵 rf の 27 語は src の字の literal で引かれず REFUSAL_HEAD に名をつないで組むので、足さないと着地済みの歯 bvlex_keys_named_in_src が落ちる・群の module の file だけを書き main.rs は書かない）。器が断りの名を足したら、面は名のままで出し、この表と歯に足すのは後の行。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜3 番目の項は verify の 4 行目（歯 hdnm_refusal_names_in_vocab・hdnm_refusal_text_plain・hdnm_pop_reason_starts_plain）、4 番目の項は 5 行目（歯 hdpop_intake_refusal_facts・hdpop_missing_why_and_since_unknown）、5 番目の項は 6 行目（歯 bvlex_keys_named_in_src・bvlex_prefix_sites_in_src・着地済みの歯の群 teeth2 の bvlex_ の 5 本を撃つ）、最後の 6 番目は 7 行目で測る。

      試作と噛み。試作は写し drafts/w133a（席の積みの木 ae47433a（main c9e6f915 に 27b の 29 行の試作の差を重ねた木・写し drafts/w101a-l1 の枝 seat-27b-v3） から）で、差の file は 17,836 byte・5 file・新しい file 1・+290 −6。書く file は write-set の中で閉じる（差の名の一覧と同じ）。入口の赤は r-hdnm（11ccf2c4・空の表）で hdnm の 3 本とも rc 100。句ごとの噛みは 7（表 KEY_PREFIXES から字 rf と半角のコロンを外すと bvlex_keys_named_in_src が rc 100 の 1 つを含む・係 w134a） で、どれも名指しの歯が rc 100 で落ち、対照は rc 0（bites.tsv）。verify の clippy と歯の行は試作の木で rc 0。根の xtask の check は係が撃たない（席が積みの木で撃つ）。

      範囲の外。dispatch ls の受付の断りの字と器の 1 行の理由の字（器の側）。
  - n: 11
    type: prose
    title: 行 g-held-page — 個別の頁の留め置きの段
    body: |
      在りか。差の file docs/design/patch/g-held-page.patch は行 g-held-name の試作の木 55e3feb6 と、その上に試作を載せた木 12ba4239（写し drafts/w133a の枝 s-hdpage・試作 9da9d1cc の載せ直し・差の字は係 w133a と w134a の差と同じ）との差。差は 27b の board の行の差の上で切った（27b の行 g-sum-pick〜g-node-excerpt ほかが pop.rs・style.css・vocab.json・node.rs を書く）。27b の board の行の着地を待つのは席の止めで行う（27b の行は別のノートなので depends に書けない）。

      なぜ。判断の記録 ADR-42 決定 (7)。吹き出しを閉じた後も、個別の頁で止めた理由と解く条件を読めるようにする。組みは吹き出しの held_facts を使い 2 本目を書かない。

      形。 - project の node.rs: 定数 HELD_HEAD（鍵 nb_held）と HELD_CLASS（nheld）・関数 held_rows（中心の bead の札が段 Held の時だけ pop の held_facts）・held_text（値の字）。DOM は板と局面の出力の口（吹き出しと同じ 2 つの読み）から札と部品を読み、頭と概要の後に見出しと欄の表（class facts）を 1 段で置く（関数 held_of と held_view・view の関数の行の数の上限 60 を越えないよう分けた）。 - style.css: .nheld の 1 行。 - vocab.json: nb_held。 - 新しい歯の段 crates/tsuzuri-surface/tests/hdpage.rs（接頭辞 hdpage_・4 本）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜4 番目の項は verify の 4 行目（歯 hdpage_held_rows_same_as_pop・hdpage_not_held_no_section・hdpage_held_text_values・hdpage_dom_and_words）、最後の 5 番目は 5 行目で測る。

      試作と噛み。試作は写し drafts/w133a（席の積みの木 ae47433a（main c9e6f915 に 27b の 29 行の試作の差を重ねた木・写し drafts/w101a-l1 の枝 seat-27b-v3） から）で、差の file は 13,296 byte・4 file・新しい file 1・+190 −7。書く file は write-set の中で閉じる（差の名の一覧と同じ）。入口の赤は r-hdpage（c7be451e・空の定数と関数）で hdpage の 4 本のうち 3 本が rc 100（段を出さない の 1 本は今の振る舞いなので緑）。句ごとの噛みは 5 で、どれも名指しの歯が rc 100 で落ち、対照は rc 0（bites.tsv）。verify の clippy と歯の行は試作の木で rc 0。根の xtask の check は係が撃たない（席が積みの木で撃つ）。

      範囲の外。頁の段の開き閉じ（畳まない 1 段）。

