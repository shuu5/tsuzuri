      構造の連鎖（木 cfb81a4f で grep）。Judged の構築は judged_of の 1 か所と歯の見本 1 つ。Extra::Contract の構築は phase.rs と ledger/phase.rs と歯の 3 か所、読みは lifecycle.rs の part_of、書きは extra_pairs。refusal_of の呼び手は contract_part の 1 か所。rewrite_after_hold の呼び手は queued の 1 か所。器の file の行の上限（1500・幅で数える）: 書く src の file の最大は fleet/lifecycle.rs の 1468（試作の後）。

