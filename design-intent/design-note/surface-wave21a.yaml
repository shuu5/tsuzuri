sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      面は知らせのたびに口を読み直し、同じ本文なら置かない。ところが pipeline の板と台帳の指標と未反映の一覧の電文は、server が組む時の今の時刻から作る値（札の経過の秒・指標の時点と日の end・memo と未反映の年齢）を持つので、何も変わらない読み直しでも字が変わり、block を毎回組み直す。
      この行 1 つで、それらの値を今の時刻に依らない絶対の時刻（epoch 秒）に替え、経過と年齢は面の時計の今から引いて数える。日ごとの 14 本は日本の日で切る。
      席の card と account board の電文の時刻（組んだ時刻・区間の to・退避までの残り秒ほか）は、seat の file が留めの便 c-limit-resume と重なるので、後の計画だけの行 c-abs-seat に残す。
