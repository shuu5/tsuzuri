  - n: 3
    type: prose
    title: 行 c-abs-time — 時刻から作る値を絶対の時刻で送る（pipeline と未反映と指標の組）
    body: |
      在りかの main は 8f8eeb8（計画 surface-plan 第 0.81 版）で、この行は行 g-ledger-group-kind（ノート surface-wave21b・便 t3-hub.52.119）の着地の後の字に書く。計画 9 節の計画だけの行 c-abs-time を、計画の字（起草で M を越えるなら pipeline と未反映と指標の組と、席と account の組に割る）のとおり 2 つに割り、前の組（pipeline と未反映と指標）をこの契約の行にする。後の組（席の at と to・account の時点と日の end ほか）は計画だけの行 c-abs-seat として 9 節に残す。承認は計画の裁定を継ぐ。拠りは見本（docs/design/mock3 の ui.js の data-since を 1 秒ごとに書き直す形）と要件 NFR2。
      なぜ。面は知らせ（SSE）のたびに口を読み直し、同じ本文なら置かない（通信の module net.rs と view の決め方・便 g-steady）。ところが今の電文は server が組む時の今の時刻から作る値を持つので、台帳も event も変わらない読み直しでも本文の字が毎回変わり、block を毎回組み直す。この行の組の値は次の 5 つ。pipeline の札の欄 elapsed_s（中核の pipeline.rs が今から段を決めた最後の event の ts を引いた秒）。未反映の 1 件の欄 age_s（契約の UnreflectedRow と中核の UnreflectedItem・今は c-unref-now の後で 3 種とも まだ分からない なので作る手は無い）。指標の時点 at（中核の ledger/stats.rs の fn of_beads が今そのものを置く）。日ごとの 14 本の end（今から 0〜13 日を引いた時刻で、秒ごとに動く）。memo の年齢の中央値の欄 age_p50_days（open の memo の作った時刻から今までの日数の中央値で、秒ごとに動く・計画の字に無く、起草で見つけた）。
      形（契約）。board.rs の PipelineCard の欄 elapsed_s: Option<u64> を since: Option<EpochSecs>（段を決めた最後の event の時刻）に替える。stats.rs の UnreflectedRow の欄 age_s を created: Option<EpochSecs>（作った時刻）に、MemoStats の欄 age_p50_days: Option<f64> を created_p50: Option<EpochSecs>（open の memo の作った時刻の中央値）に替え、DayCount の欄 end と LedgerStats の欄 at は名と型を変えず doc を新しい意味にする。account board の未使用の型 AccountBoard の SessionRow の欄 elapsed_s は触らない。
      形（中核）。pipeline.rs の札の since は、段を決めた最後の event の欄 ts の字を fn epoch_secs で読んだ時刻（今を引かない・走行の無い札は None）。next_step.rs の止まっている走行の対象は min_by_key(|c| (c.since.is_none(), c.since))（段を決めた時刻のいちばん早い札・時刻の無い札は後・今までの経過のいちばん長い札と同じ）。ledger/stats.rs に pub const DAY_OFFSET_S: u64 = 9 * 60 * 60（日の境の時差・面の view.rs の JST_OFFSET と同じ 32400）と pub fn day_end(t)（t を含む日本の日の 23 時 59 分 59 秒 = ((t + DAY_OFFSET_S) / DAY + 1) * DAY - DAY_OFFSET_S - 1）を足す。fn of_beads の 14 本は last = day_end(now) から 1 日ずつ引いた end を持ち、数える窓は end の 1 日前の秒より後から end.min(now) まで（今日の本は今の時刻まで・今より後に閉じた記録は数えない）。時点 at は読めた bead の作った・更新・閉じた時刻のうち今以下の最大（1 つも無ければ 0）。memo は open の memo の作った時刻を f64 にして同じ分位の関数 percentile で中央値を取り、切り捨てて created_p50 に置く。ledger/unreflected.rs の UnreflectedItem の欄 age_s を created に替え、境界の server/board.rs の fn list はその欄をそのまま写す。
      形（面）。project/pipeline.rs の Kcard の欄 elapsed_s を since に替え、pub fn age_at(since: Option<EpochSecs>, now: EpochSecs) は now.saturating_sub(since) を fn age に渡す（時刻が無ければ NO_AGE）。pub fn kcard(card, rows, now) と pub fn ci_shown(card, now) と pub fn stages(fetched, now) は今を受け、CI の語は今までの経過が CI_MARK_S（600）以下の間だけ出す。landed_today は since の日本の日が今の日本の日と同じか。列の中の並びは since の新しい順（時刻の無い札は後）。mod dom の fn view は電文を読んだ時刻の Memo を外し、let clock = move || tick.get();（net の ticker の 1 秒の時計）を渡し、fn kcard_view は age_at(since, clock()) を書き直す。project/ledger.rs に pub fn days_since(at, now)（今までの日数・今より後は 0）を足し、pub fn content(fetched, screen, now) と pub fn panel(s, screen, now) と pub fn unref_list(fetched, now) は今を受け、memo の年齢は created_p50 から、未反映の年齢は created から数える。mod dom は組む時に content(f, s, crate::net::now()) と unref_list(&unref.get(), crate::net::now()) と stages(p, crate::net::now()) を撃つ。
      決めた幅。日の境は日本の日にした（今は今から 24 時間ずつの窓）。理由は 3 つ。今の時刻に依らない end は暦の日の境のほかに無い。面の burndown の hover の card は end を日本時間の月日（clock(d.end) の 5 字目から 10 字目）で出すので、日の最後の秒の end は月日の字と窓が合う（今の窓は月日の字と 1 日の中の時刻でずれる）。見本の ledger.js の窓（今から 24 時間ずつ）とは今日の本が今の時刻までになる所が違う。時点 at は台帳の最後の記録の時刻にした（面の hover の出所の行の 時点 HH:MM の字は、台帳がその時刻から変わっていないことを示す）。経過と年齢は面の時計の今から引くので、持ち主の端末と server の時計の差がそのまま入る（今より後の時刻は 0 にする）。経過の字は s・m・h・d の粒で、差は 60 秒未満の s の粒でだけ見える。持ち回しの古さの頭 X-Tz-Read-Age（15 秒の判定）は時計の差を入れないために秒で送る今の形のまま（計画 3 節の席の決め）。札の meta の経過は 1 秒の時計で書き直すが、CI の語の 10 分と Landed の列の今日と、memo と未反映の年齢の字は、block を組む時（板か台帳の一覧か地図の本文が変わった時）の今で決める（1 秒の時計に繋ぐと block を毎秒組み直すので繋がない）。
      在りか（grep した所）。4 つの crate の src と tests と xtask で、欄の名 elapsed_s・age_s・age_p50_days、fn の名 age_at・ci_shown・kcard・stages・unref_list・landed_today・content・panel、fixture の名 stats-30.json・pipeline/pipeline.json・ledger-stats.json・pipeline-board.json・metrics-body.json を grep した。書く歯は、欄の字で札か 1 件を組む歯（契約の cform_board・cform_stats、中核の pci・pclosed・pmisfit・pquest・pqueue・punmap、境界の server_view、面の cmark・gfix・gjst・lstg・pcimark・pclosed・pipe・tkad・unrefpanel・kindlab）と、今を受ける fn を呼ぶ歯（面の cadl・cadopt・hacols・kcardlink・lcard・ledgerblock・unow）と、面の ledger.rs の字を見る歯（lhome・lstg）。歯の中の経過の値は描く今から引いた時刻に替え、期待の字は変えない。置き場だけの = は、書き替える fixture を読む着地済みの歯（中核の stats と harestcore・面の pfold）。fixture は、stats-30.json の期待の指標（時点・日の 14 本・memo）を中核の数え方で数え直して note に 1 文を足し、pipeline.json と pipeline-board.json の elapsed_s を今から引いた since に、ledger-stats.json と metrics-body.json の age_p50_days を created_p50 に替える。
      account board の fixture（この行は書かない）。write-set の外の fixture tests/fixtures/account/acct-doc.json は、project proj-a の台帳の指標の memo に欄 age_p50_days（5.5）を持ったまま残る（その字は後の行 c-abs-seat が替える）。読む歯は、4 つの crate（契約・中核・境界・面）の src と tests と xtask で fixture の名 acct-doc を grep して拾った。契約の acctdoc、中核の acctpcore・athr・harestcore、面の acctframe・accthb・accthome・acctled・acctproj・acctsess・acctwin・aord・bport・hacols・harest・hcard・hcled・hcnx・hcproj・hcsess・hdchip・hnunk・hspk・hthr・ledspark・projmore・sxaxis・ticker・unow の 29 の歯で、どれも fixture を電文の読み（契約の wire::decode・中身は serde_json::from_str）で AccountDoc に読む。src と xtask と境界の crate には読む所が無い。hacols と unow は write-set に、harestcore は置き場だけの = にすでに在るので、残りの 26 の歯と fixture acct-doc.json を置き場だけの = に足し、26 の歯を verify に足した。MemoStats の欄の字（age_p50_days・awaiting_promotion）を持つほかの fixture（stats-30.json・ledger-stats.json・metrics-body.json・契約の snapshot の stats.json）はこの行が書き、それらを読む歯は全部 write-set か = に在る（同じ範囲で grep した）。
      型が知らない欄。契約の MemoStats と、それを持つ LedgerStats・ProjectRow・AccountDoc と、包みの Reading（known と unknown の札を外に付ける enum）は serde の deny_unknown_fields を持たない（契約の crate で持つのは seathb.rs の SeatHeartbeatRequest だけ）。よって電文の読みは、型が知らない欄 age_p50_days を断らずに捨てる。欄 created_p50 は Option<EpochSecs> なので、欠けると serde の既定で None になる。面で MemoStats の欄を読むのは project board の ledger.rs の memo の段だけで、account の module は読まないので、acct-doc.json から描く account board の字は変わらない。欄を捨てることと None になることと account board の字が変わらないことは歯で測らず、この行の差分と型で持つ（fixture を AccountDoc として読めることは、足した歯が fixture を読む所で見る）。
      依存と順。depends は空。計画の 5 節の鎖で同じ file を書く行は、契約の board.rs の c-pipe-misfit と c-pipe-ci（どちらも着地済み）の後、面の pipeline.rs の g-tick-adopt（着地済み）の後。後の計画だけの行 g-pipe-memo（面の pipeline.rs）・c-unref-lc（中核の unreflected.rs）・g-unref-lc（面の ledger.rs）・c-next-effect（中核の next_step.rs）・c-ledger-lc（中核の pipeline.rs）と、割った後の組の c-abs-seat はこの行の後に流す。行 g-ledger-group-kind（ノート surface-wave21b・便 t3-hub.52.119）は面の view.rs と歯 lhome・board_min と新しい歯 lgrp を書き、この行が書く面の歯 lcard・ledgerblock・lstg・gjst・kindlab・cadl・hacols を置き場だけの = で持つので、この行はその着地の後に流し、その後の字に書く（順は便の bead の依存で持つ・この行は view.rs を書かず、歯 lhome の直しは ledger.rs の一覧の DOM の字を見る 1 か所だけ）。着地した g-nav（面の board.rs・frame.rs・nodearound.rs と歯 pgsw・gcoach）とは書く file も = の file も重ならない。
      歯で測らず、この行の差分で持つ。契約の doc の字。中核の next_step.rs の並びの鍵の替え（止まっている走行の対象の歯は着地済みの中核の stats の next.json の歯が見る）。面の hover の card の値の行の経過の字が組んだ時の字であること。src の行数は、契約の board.rs 248・stats.rs 168・中核の pipeline.rs 611・next_step.rs 193・ledger/stats.rs 288・面の pipeline.rs 876・ledger.rs 1251（どれも M の余白を足しても上限 1500 の内）。
      範囲の外。席の card の at（組んだ時刻）と区間の to（最後の区間の今）と窓の from・account board の電文の at と退避までの残り秒 move_left_s と休止中の席の経過（後の行 c-abs-seat・seat の file は留めの便 c-limit-resume と重なる・account board の fixture acct-doc.json の memo の欄の字もその行で替える）。account board の project の行の指標（LedgerStats）はこの行の数え方になるが、account board の電文の at が今のままなので本文は c-abs-seat まで毎回変わる。問いの投稿の時刻（すでに絶対の時刻）。持ち回しの古さの頭。block を 1 分ごとに組み直して CI の語の 10 分と今日の着地を知らせ無しでも替える形（後の行で要れば）。

