      節の台帳 LH（行の id・種類・状態の 15 行）。ea（epic・open）・ea.1（task・open）・ea.2（task・closed）・ea.3（memo・in_progress）・eb（epic・in_progress）・eb.1（task・closed）・ec（epic・closed）・ec.1（task・closed）・ec.2（memo・closed）・ed（epic・closed）・ed.1（task・blocked）・ed.2（task・closed）・z.1（task・closed）・z.2（memo・open）・qq.1（question・open）。表 T（LH の画面の body の組）。4 つの組で、順に、頭 ea と下の項 ea.1・ea.3、頭 eb と下の項なし、頭 ed と下の項 ed.1、頭なし（epic の外）と下の項 z.2。頭と下の項はどれも、LH の同じ id の行を project の item に渡した値と同じ（ed の頭は塗った印）。閉じた epic ec の組は出さない。question の qq.1 は今と同じく一覧に入らない。LH の画面の count は Known の 14（view の ledger_groups の組ごとの下の行の数と epic の頭の数の和・閉じた行を含む）。LH2 は 3 行 ec（epic・closed）・ec.1（task・closed）・z.1（task・closed）で、画面の body は Empty の NO_OPEN、count は Known の 3。
