  - n: 3
    type: prose
    title: 行 c-next-stall — 次の一手の止まっている走行と、判じなかった なし
    body: |
      なぜ。持ち主の指摘（t3-hub.1（裁定 id = user 2026-09-28T00:4xZ）の逐語）: 次の一手が止まった run ばかりで、質問が出ない。調べると、見本と要件に反する所が 2 つ在る。1 つ目。中核は段が Questioned の走行を止まっている走行に数えるが、見本（docs/design/mock3 の acct.js の stoppedRuns・判断の記録 ADR-7 の承認 user 2026-09-26T07:51Z）は Questioned の走行を除き（見本の字「Questioned は質問の側」）、語の辞書の鍵 nx_c の internal も「Questioned を除く止まった段」と言う。数えると、板の札の段が Questioned の走行（段を決める最後の event が QuestionRaised の走行・fixture の next.json の組 0 の nx1.2）は止まっている走行にも数えられ、規則の行 R-24 の順で止まっている走行が質問より先に当たり、大きい箱が「止まっている run」になって「質問・答える」が出ない。2 つ目（2026-09-28T01:1xZ に live の /api/next で見た）。台帳の読みが間に合わない間、止まっている走行と束の承認と質問が判じなかった（not-judged）のに、なしが当たり（hit）lead がなしになり、大きい箱は「orchestrator が動いている / 待っている」を出した。要件 NFR2 は「読めないときは 0 件でなく「測れていない」と出す」と決め、語の辞書の鍵 nx_g の internal は「上の 6 つが全部 0」をなしの条件と言う。中核は、判じた種類のどれも当たらなければ判じなかった種類が在ってもなしを当て、着地済みの歯 stats_next_step_matches_fixture がそれを pin している（台帳が読めなければなしは当たる）。この行は 2 つを直し、project board の大きい箱が判じなかったなしを測れていないの箱で出すようにする。拠る = 持ち主の指摘と見本と、要件 FR11（閉じた 7 種を優先順に判じ 1 つを大きく出す）と要件 NFR2 と規則の行 R-24（順は変えない）。
      在りか・中核（main d927a57 で確かめた・next_step.rs と pipeline.rs と fixture の next.json と seat-inputs.json と next-step.json は 2bc9aa0 から変わっていない）。crates/tsuzuri-core/src/next_step.rs（write-set・crate::next_step）は、pub const STALLED_STAGES（Stage の 3 つの配列・Questioned と Failed と Stopped）・pub const BATCH_MIN（usize の 2）・私的な struct Found（件数と対象の id）・私的な fn stalled_run（読めた bead の Option と event log の字と今を受け Found の Option・台帳か event log が読めなければ None・pipeline の of_inputs の札のうち段が STALLED_STAGES に在り bead が open の札を数え、対象は経過のいちばん長い札の bead）・fn question（open の問いを数え、対象は作った時刻のいちばん古い問い・台帳が読めなければ None）・fn batch（問いの一覧が読めなければ None・A-1 の印の無い open の問いが BATCH_MIN 本以上ならその数）・fn check（種類と Found の Option を受け NextCheck・None は NotJudged・件数 0 は Miss・ほかは Hit）・fn seat_found（席の card が無いか状態が unknown なら None）・pub fn next_step（台帳の字と event log の字と今を受け NextStep・席の card 無し）・pub fn next_step_seat（同じ 3 つと席の card の Option を受け NextStep）・私的な fn judge を持つ。judge は NextMove の ALL の順になしのほかの 6 種を判じ（発効待ちは材料が無くいつも None）、6 種のどれかが Hit ならなしを Miss・どれも Hit でなければなしを Hit にし（件数 0・対象無し）、lead を並びで最初に Hit の種類（どれも無ければなし）にする。契約の型（この行は書かない）: NextMove（限度と移動・応答なし・止まっている走行・束の承認・質問・発効待ち・なし の 7 つと宣言の順の ALL）、CheckResult（Hit・Miss・NotJudged）、NextCheck（pub な欄 kind・result・count の u32・target の BeadId の Option）、NextStep（pub な欄 checks の NextCheck の Vec・lead の NextMove）、SeatCard（serde で読める）。電文の形は変えない（8 つ目の種類は足さず、要件 FR11 の閉じた 7 種のまま）。
      在りか・中核の pipeline（置き場だけの =・この行は書かない・確かめた）。crates/tsuzuri-core/src/pipeline.rs の段を決める event は STAGE_EVENTS の 4 種（RunCreated・RunStage・RunDone・QuestionRaised）で、閉じた表 stage_of は RunDone を Landed・QuestionRaised を Questioned・RunCreated を Running・RunStage の Reviewed と Gated で detail が verdict の FAIL か INCONCLUSIVE で始まれば Failed・RunStage の Gated を Gated・Reviewed で PASS を Running・Spawned と Implemented を Running にし、ほかは表に無い段（札を作らず数える）にする。板は Stopped の札を作らない（file の頭の doc の字）。
      呼ぶ所（この行は書かない・確かめた）。境界の src/server/routes/next.rs の口 /api/next は、席の card が読めれば src/server/board.rs の next_seat（next_step_seat）、読めなければ next（next_step）の値を返す。中核の src/account/project.rs は台帳の字の在る project の ProjectRow の next を next_step_seat の値の Known にする（account board の HOME と project の表が読む・第 7 波の着地済みの行 c-acct-thr が同じ file を書いた後も同じ）。
      形・中核。STALLED_STAGES を Stage の 2 つの配列（Failed と Stopped）にする（doc は Questioned は質問の側・見本の stoppedRuns と語の辞書の nx_c と同じ）。止まっている走行の数え方のほか（bead が open・対象は経過のいちばん長い札）は変えない。pub const NO_INPUT（NextMove の 1 つの配列・発効待ち）を足し、doc に、この版の入力に材料が無く判じない種類で、なしの判じから外すこと、後の行 c-next-effect が発効待ちを判じるときに外すことを書く。なしの結果を次の 3 つにする。なしのほかの種類のどれかが Hit なら Miss。どれも Hit でなく、NO_INPUT に無い種類のどれかが NotJudged なら NotJudged。ほかは Hit。件数 0 と対象無しと、lead の決め方（並びで最初に Hit の種類・無ければなし）は変えない。next_step と next_step_seat の引数と返りは変えない。next_step の doc のなしの字（判じた種類のどれも当たらないときに当たる・だから大きく出す 1 つはいつも在る）を新しい決まりに直す（大きく出す 1 つはいつも在るが、なしを判じなかったときの lead のなしは測れていないの意味）。
      決まりの幅（席の決め・発効待ちだけを外す案を採った・ほかの 2 案は起草の notes）。後の行 c-next-effect が発効待ちを判じるとき NO_INPUT から外し、以後はなしのほかの 6 種が全部判じられてどれも当たらないときだけなしが当たる。発効待ちを今 NO_INPUT で外すのは、この版の中核が発効待ちの材料を持たず、外さなければ席の card が在っても なしがどの入力でも当たらなくなるため（なしの Hit の枝を歯で試せなくなる）。席の card が無いか状態が unknown のときの限度と移動と応答なしは読めない種類で、外さない（席が限度かもしれないのになしとは言わない・席を持たない project は なしの代わりに測れていないを出す）。
      形・fixture（tests/fixtures/pipeline/next.json・write-set）。now は 1790474400（2026-09-27T02:00:00Z）で 4 組。組 0（止まっている走行）の台帳は nx1（epic）・nx1.1（open の task・Gated で落ちた契約）・nx1.2（open の task・問いで止まった契約）・nx1.3（閉じた task）・nx1.q（open・label intake:question・作った時刻 2026-09-27T00:05:00Z）で、event log は nx1.3 の RunCreated と RunStage Reviewed（verdict:FAIL）、nx1.1 の RunCreated（00:00:00Z）と RunStage Gated（00:10:00Z・verdict:FAIL）、nx1.2 の RunCreated と QuestionRaised（00:05:00Z）。期待の止まっている走行を件数 2・対象 nx1.2 から件数 1・対象 nx1.1 に直し（nx1.2 の段は Questioned で数えない）、組の名の字を直す（Failed の open の契約・Questioned の契約は質問の側で数えない）。組 2（なし）は台帳に open の問いも走行の止まった契約も無く、席の card の無い next_step では限度と移動と応答なしを判じないので、期待のなしを hit から not-judged に直し、組の名の字と file の頭の note の字をそれに合わせる。組 1（質問）と組 3（event log が読めない）はどちらも質問が当たるのでなしは miss のままで、期待は変えない。
