    type: prose
    title: 行 e-seat-hb — project board の自分の席の停止の切り替えの口
    body: |
      なぜ。持ち主は project board からも heartbeat（器の管理の合図）を止める・戻すことを求め（2026-09-28 の指摘・問いの bead の概要に在る）、その範囲を t3-hub.52.29（裁定 id = t3-hub.52.29:20260928T0107Z-1）の案 A に決めた。案 A は、project board 用の新しい口を足して本文を向きだけにし、server は自分の --repo の project の席だけを止める。account board の口 POST /api/account/heartbeat はそのまま残す。止めるのは合図だけで、死んだ席の起こし直し・移動の退避・群の判定は動き続ける（語の辞書の鍵 hb_dlg_scope の字と同じで、器の側の振る舞い・この行は変えない）。見本（判断の記録 ADR-7 の承認 user 2026-09-26T07:51Z で確定した docs/design/mock3）の project board は、block「orchestrator と口座」の合図の行に account board と同じ切り替えの button を持つ（ui.js の tkhbHTML・openHB・hbCmd・index.html の renderSeat が tkhbHTML を呼ぶ）。今の面にはその button を受ける口が無い。この行は口だけを置き、面の button と確かめの段は同じノートの次の行 g-seat-hb が置く。要件 FR12 の字（停止の切り替えは器の CLI を撃ち、面は state dir の file を書かない）と受入 AC10 の字（停止の切り替えは器の CLI の argv だけを記録し state dir の byte は不変）を、この口でも守る。
      在りか（main の f47356e で確かめた・第 7 波の着地済みの行 c-acct-thr が境界の acct.rs と契約の型の account.rs を書いた後の字で、この節が使う名と形はその前の 2bc9aa0 と同じ・境界の受付）。境界の crate の src/accthb.rs（lib.rs の pub mod accthb・host の code）の pub fn accept（acct の &Acct と本文の &str を受けて、状態の数と本文の字の組 (u16, String) を返す）は、本文を契約の型の account の HeartbeatRequest（pub な欄 project の String と to の Heartbeat）に wire の decode で読み（読めなければ 400 と字 bad-body）、私的な fn anchor で群の宣言（acct の host_state_dir の下の host.toml を中核の account の host の declaration で読んだ群の anchors を、群の順と配列の順に並べた列）のうち最後の区切りの名が project と同じ最初の anchor を引き（無いか project が空なら 404 と字 no-project）、acct の state_dir（git に -C と anchor と config --get scribe2.statedir を渡した 1 行・落ちるか空なら None）で state dir を引き（引けなければ 404 と字 no-seat）、器に doctor と --state-dir と state dir を撃ち（落ちる・rc が 0 でない・5 秒で返らない・UTF-8 でないなら 502 と字 vessel-failed）、境界の acct の pub fn orchestrator_target（doctor の出力と anchor を受け、行の頭が seat: で役 role が orchestrator で anchor の欄が同じ path〔末尾の斜線を除いて同じ字〕の最初の行の target）で席を引き（無ければ 404 と字 no-seat）、器に seat heartbeat と on か off と --state-dir と state dir と --target と席を 1 回撃ち（失敗は 502 と字 vessel-failed）、200 と契約の型の account の HeartbeatResponse（pub な欄 target の String と to）の電文を返す。file は書かない。pub const HEARTBEAT_ARGS（[&str; 2]・seat と heartbeat）・BAD_BODY・NO_PROJECT・NO_SEAT・VESSEL_FAILED（字 bad-body・no-project・no-seat・vessel-failed）と pub fn word（Heartbeat を字 on か off に）が在る。子 process は server の ledger の capture で撃ち、器の program は acct の scribe2、cwd は acct の cwd、待ちの上限は server の seat の SCRIBE2_TIMEOUT（5 秒）。境界の acct の pub struct Acct の pub fn new（器・git・bd の program と state dir と cwd の 5 つを受ける・どれも Into で受ける）と pub fn host_state_dir・state_dir・scribe2・cwd は pub で、歯が直に組める。
      在りか（口と守り）。口は src/server/routes の下に 1 口 1 file で置き、組み立ての script（build.rs）が dir の file の名から列挙 Route（名は file の名・名の byte の順）を生成する（判断の記録 ADR-13・build.rs と route.rs は書かない・口の列の file も無い）。routes/heartbeat.rs の const ROUTE（server の中だけの可視性の Entry）は key に method POST と Match の Exact の契約の型の account の HEARTBEAT_PATH（字 /api/account/heartbeat）を持ち、handle の私的な fn は、server の mod.rs の私的な fn guarded（Origin の頭が在って Host の頭と host と port が違えば 403 と字 origin・本文が http の BODY_MAX の 65536 byte を越えれば 413 と字 too-large・UTF-8 でないか閉包が None なら 400 と字 bad-body・通れば閉包の返す値）に本文をそのままの字で返す閉包を渡し、Shared の欄 acct（server の Acct・起動の引数に state dir が無ければ None）が None なら 404 と accthb の NO_PROJECT、在れば accept の組を、200 なら http の Response の json、ほかは Response の text で返す。Shared の欄 sources の欄 ledger（server の ledger の pub struct Source）の pub な欄 repo（PathBuf）は起動の引数 --repo の字のまま（main.rs は canonicalize しない・routes/project.rs が同じ欄を読む）。server は Acct を state dir が在るときだけ作り、その host_state_dir は起動の引数の state dir、cwd は --repo。子の module は親の非公開の item と Shared の欄を crate::server の path で使える（routes/heartbeat.rs が同じ形）。列挙 Route の pub fn name と key、server の route の pub struct Key（pub な欄 method と path・pub fn matches）と pub enum Match（Exact と Prefix）、server の pub struct Config（pub fn new と pub な欄 bd・state_dir・scribe2 ほか）と pub struct Server（pub fn bind_with が Config と git の program を受ける・local_addr・run）は pub で、歯が直に使う。
      在りか（契約の型）。契約の型の crate の lib.rs は file の module の pub mod の行を手で書く（今は account・board・graph・ledger・project・question・runs・seat・stats・surface の 10 個・ほかに lib.rs の中に本文を書いた pub mod wire が在る）。account の Heartbeat は On と Off の閉じた 2 値で serde の rename_all lowercase で字 on と off に読み書きし、derive に Copy を持つ。依存は serde（derive つき）と serde_json で、wire の pub fn encode と decode が在る。境界の crate は serde に直接依存しない（読みは wire の decode）。
      形（契約の型）。新しい file の src/seathb.rs を足し、lib.rs の seat の行と stats の行の間に pub mod seathb の 1 行を足す。seathb.rs は pub const PATH（&str・字 /api/seat/heartbeat）と pub struct SeatHeartbeatRequest（pub な欄 to の account の Heartbeat だけ・derive は Debug・Clone・Copy・PartialEq・Eq・Serialize・Deserialize・serde の deny_unknown_fields を付け、欄 to のほかの鍵を持つ本文を読まない）を持つ。応答の型は足さず、account の HeartbeatResponse をそのまま使う。to が Off の要求の電文の字は、開き波括弧・引用符で囲んだ to・コロン・引用符で囲んだ off・閉じ波括弧（空白なし）。account の HeartbeatRequest の project を空にして使い回さず新しい型にするのは、本文の project の字が撃つ席を選ぶと読める形を口に残さないため（project を持つ本文は deny_unknown_fields で 400 になる）。seathb.rs の doc には引用符で囲んだ /api/ の字を書かない（PATH の定義の 1 か所だけ）。
      形（境界）。accthb.rs に pub fn accept_own（acct の &Acct・repo の &std::path::Path・本文の &str を受けて (u16, String) を返す）を足す。本文を SeatHeartbeatRequest に wire の decode で読めなければ 400 と BAD_BODY を返し、git も器も撃たない。群の宣言の anchor を accept と同じ列（群の順・配列の順）で見て、repo と同じ dir を指す最初の anchor を引く。同じ dir とは、anchor の字の path と repo の両方を canonicalize できればその 2 つの path が等しいこと、どちらかができなければ anchor の字の Path と repo の Path が等しいこと（Path の等しさは区切りごとに比べるので、末尾の斜線の有無を問わない）。引けなければ 404 と NO_PROJECT を返し、git も器も撃たない。引いた anchor は宣言に書かれた字のまま（canonicalize した path でも repo の字でもなく）acct の state_dir と orchestrator_target に渡す（accept が名で引いた anchor の字を渡すのと同じで、git と器が受ける argv が 2 つの受付で同じになる）。引けた anchor から先は accept と同じ順（state dir・doctor・orchestrator_target・seat heartbeat を 1 回）と同じ断りと同じ 200 の電文で進む。accept の引数と返りと振る舞いは変えない（anchor を引いた後の順を 2 つの受付で分ける私的な関数に割ってよい・名は問わない）。module の doc に 2 つ目の受付と、裁定 t3-hub.52.29 を書く。名で引かず dir で引くのは、群の宣言に最後の名の同じ anchor が 2 つ在るとき（下の作業場の work の proj-a と other の proj-a）にも、この board の --repo の席だけを止めるため（名で引く accept は宣言の順で最初の同じ名の anchor を選ぶ）。
      形（口）。新しい file の src/server/routes/seathb.rs を足す（列挙 Route の名 seathb）。const ROUTE の key は method POST と Match の Exact の契約の型の seathb の PATH（口の file に引用符で囲んだ /api/ の字を書かない）。handle の私的な fn は routes/heartbeat.rs と同じ形で、guarded に本文をそのままの字で返す閉包を渡し、Shared の acct が None なら 404 と accthb の NO_PROJECT、在れば accept_own に acct と Shared の sources の ledger の repo と本文を渡し、200 なら Response の json、ほかは Response の text で返す。file の doc に口の path と行 e-seat-hb を書く。server の mod.rs は module の doc の字だけを直す（POST を受ける口の列に /api/seat/heartbeat を足し、routes の下に置く POST の口の数を 5 にする）。mod.rs の code の行は変えず、doc にも引用符で囲んだ /api/ の字・字 fn post_・字 HEARTBEAT_PATH を書かない。口 /api/account/heartbeat（routes/heartbeat.rs）は変えない。
      断りの字の決め。この口の断りの字は accept と同じ 4 語と guarded の 3 語だけ（400 bad-body・404 no-project・404 no-seat・502 vessel-failed・403 origin・413 too-large）。404 の no-project は、この board の --repo が群の宣言に無いか、state dir が起動の引数に無いときに出る。面の着地済みの応答の出し方（surface の account の heartbeat の outcome）は同じ 4 語を字に替えるので、次の行 g-seat-hb は応答の出し方を変えずに使える。
      着地済みの歯（直すものは無い・直さずに通るもの・3 つの crate の tests と src の cfg(test) を grep で確かめた）。server_hb_ の 10 本（tests/server_hb.rs）は accept を直に撃ち、群の宣言と doctor の出力と git の出力を作業場に置いた偽の器と偽の git で、状態の数と本文・argv の列・state dir の byte・直接依存の名を見る。この行は accept の引数と返りと順と断りを変えないので通る（verify で撃つ）。hbroute_ の 8 本（tests/hbroute.rs）のうち、hbroute_all_names_follow_dir は Route の ALL の名の列と dir の file の名の列が同じことを見る（file を足せば両方に seathb が載る）。hbroute_keys_cover_twelve_gets は 12 の GET の鍵が在ることだけを見て多い分を許す。hbroute_keys_never_overlap は同じ method の鍵の対が重ならないことを見る（POST の Exact の /api/seat/heartbeat は、ほかの POST の Exact の /api/ruling・/api/batch・/api/policy・/api/account/heartbeat と字が違い、GET の Exact の /api/seat とは method が違う）。hbroute_build_script_writes_paths は生成の字に dir の全部の file の path の属性つきの mod の宣言が名の順に在ることを見る（名 seathb は seat と unreflected の間）。hbroute_mod_rs_keeps_only_events は mod.rs の引用符で囲んだ /api/ の字が /api/surface/events だけで、字 fn route( と fn around( と fn account( が無いことを見る。hbpost_ の 3 本（tests/hbpost.rs）のうち、hbpost_four_posts_in_route_all は 4 つの POST の口が名と鍵で在ることだけを見て多い分を許し、hbpost_mod_rs_drops_post_fns は mod.rs に字 fn post_ruling・fn post_batch・fn post_policy・fn post_heartbeat・HEARTBEAT_PATH が無いことを見る。hbconf_config_moves_to_config_rs は mod.rs に字 mod config; と pub use self::config::Config; が在り字 pub struct Config が無いことを見る。この行の mod.rs の直しは doc の字だけで、どの字も足さず消さないので、この 3 つも通る（verify で hbroute_ と hbpost_ を撃つ）。boundary の brand_path_written_once_in_contract は 3 つの crate の src の引用符で囲んだ /api/project の字だけを数え、contract の acctdoc_paths_once_in_account_module は契約の型の crate の src の引用符で囲んだ /api/account と /api/account/heartbeat の字だけを数える（seathb.rs はどれも持たない）。surface の parts_paths_distinct_in_block_modules は面の crate の src だけを読む（この行は面を書かない）。boundary の tests/server_acctwire.rs の acctwire_post_heartbeat と acctwire_post_without_state_dir は口 /api/account/heartbeat を撃つ（その口と accept は変えない）。server_ask_guards_write_nothing と server_batch_ の 405 の見張りが POST を撃つ path（/api/questions・/api/ledger・/api/ruling/x・/・/api/batch/x・/api/policy/x・/api/batches）に /api/seat/heartbeat は無い。hbconf_teeth_fill_the_rest_with_new は決めた 9 つの歯の file の fn config だけを読む（tests/shb.rs はその列に無いが、shb の server の組みも Config::new と残りの欄の埋めで書く）。contract_form_ の snapshot は歯が並べた型の見本だけを見る（seathb の型は載せない・計画の作法 6）。契約の型の crate の lib.rs の字を読む歯は無い。
      測り方。新しい歯は境界の crate の tests/shb.rs に置き、名を shb_ で始める。作業場は歯ごとに CARGO_TARGET_TMPDIR の下に作る（行 D-4・path は実行の時に組む）。偽の器と偽の git は server_hb の歯と同じ形の sh の script（実行の権限つき）で、受けた argv を作業場の log の下に 1 回 1 行で足す。器は argv の 1 つ目が doctor なら out の下の、字 doctor- と --state-dir の値の最後の区切りの名をつないだ名の file の字を出し（file が無ければ rc 1）、seat なら --state-dir の値の下の seat の下の、席の名のコロンを下線に替えた名の dir を作って、向きが off なら字 ts=1790510400 と改行の heartbeat-off を置き、on なら消して rc 0 で返る。作業場の rc と crash の下に、字 doctor- か hb- と state dir の最後の区切りの名をつないだ名の印が在れば、rc 3 で返るか自分を KILL で落とす。git は -C の次の path の末尾の斜線を除いた最後の区切りの名の file を作業場の git の下から出す（file が無ければ rc 1）。偽の bd は空の配列の字を出す。
      作業場の字（歯が頼る値）。dir は repo（群の宣言に無い）・files（index.html を 1 つ）・work の下の proj-a（その下に inner）・proj-b・proj-c・proj-d・other の下の proj-a・states の下の state-h・state-a・state-b と、作業場の根に置く、work の proj-a を指す symlink の link-a（byte の比べの 4 つの dir の外）。state-h の下の host.toml は、群 g-a の anchors に work の proj-a と、末尾に斜線を付けた work の proj-b をこの順に、群 g-b の anchors に other の proj-a・work の proj-c・work の proj-d をこの順に持つ（口座は acct-1 の 1 つ）。out の下の doctor-state-a は 4 つの席の行（頭は字 seat: と空白）をこの順に持つ（role=pipeline で anchor が work の proj-a で target が proj-a:1.1 の行・role=orchestrator で anchor が other の proj-a で target が proj-z:0.1 の行・role=orchestrator で anchor が work の proj-a に斜線を足した字で target が proj-a:0.1 の行・role=pipeline で anchor が work の proj-d で target が proj-d:1.1 の行）。doctor-state-b は role=orchestrator で anchor が work の proj-b で target が proj-b:0.1 の行を持つ。git の下の proj-a は前後に空白の付いた state-a の path、proj-b は state-b の path、proj-d は state-a の path で、proj-c の file は無い（git が落ちる）。state-a と state-b の下の席の dir（proj-a_0.1・proj-a_1.1・proj-z_0.1・proj-b_0.1）に state.jsonl と tick-last を置く（中身は byte の比べにだけ使う）。
      歯の組。shb_wire_takes_direction_only は PATH の字、to が Off の値の電文の字（上の形の段の字）、値 on の字の読み、読めない 9 つの本文（空の字・開き波括弧だけ・空の配列・空の object・引用符で囲んだ off だけ・値 OFF・値 pause・値が真偽の true・値 off に鍵 project と値 proj-a を足した object）と、CARGO_MANIFEST_DIR の親から 3 つの crate の src の下の rs の file を全部読んで引用符で囲んだ /api/seat/heartbeat の在りかを見る。shb_route_listed は Route の ALL の名 seathb と名 heartbeat の key と Key の matches を見る。shb_own_anchor_by_path は done (3) の 5 つの repo（work の proj-a に off と on の 2 回・inner と .. をつないだ path・link-a・other の proj-a・work の proj-b）を撃ち、other の proj-a では同じ作業場の accept に名 proj-a の本文を渡した組とも比べる。shb_same_steps_as_named_body は 8 組ごとに log を消してから accept_own を撃ち、log を読んで消してから accept を撃ち、組と 2 つの log を比べる。shb_refusals_before_vessel の 10 の本文は、上の 9 つと、値 off に鍵 target と値 evil:9.9 と鍵 state_dir と値 /tmp/evil を足した object。shb_vessel_failures_are_502 は印の 4 つ（doctor の rc と crash・hb の rc と crash）と doctor-state-a の file を消した場合と、器の program に在らない path を渡した Acct を撃つ。shb_bytes_only_vessel_file は repo と work と other と states の下の全部の path と byte の一覧を比べる。shb_http_guard_and_reply は server を同じ process の thread で 127.0.0.1 の 0 番に立て（Config::new に repo と bind と files を渡し、bd と state dir と器の program を残りの欄の埋めの前に置き、bind_with に偽の git を渡す）、素の TCP で要求を撃つ。Origin の 3 つは http と別の host と server の port・http と 127.0.0.1 と server の port に 1 を足した port・字 null。大きい本文は値 off に鍵 pad と x の 65536 字を足した object。通る 4 つの本文は値 off（Origin の頭を server の住所で付ける）・値 on・開き波括弧だけ・値 off に鍵 project と値 proj-b を足した object（この 3 つは Origin の頭なし）で、server の応答ごとに、同じ作業場の Acct（state-h・work の proj-a を cwd）で accept_own を撃った組と比べる。4 つの後に値 off の本文をもう 1 度撃ち、応答が HeartbeatResponse（target proj-a:0.1・to off）に読め、偽の器の最後の argv が seat heartbeat off と --state-dir と state-a の path と --target proj-a:0.1 の行であることも見る。state dir の無い server は同じ Config から state dir を除いて立てる。shb_own_names_clean は自分の file の字を読む。時間を競う歯は無い（待ちは器の 5 秒の上限の中で、偽の器は眠らない）。
      filter の語（着地済みの行の verify の filter の語 49・第 3 波の行の接頭辞 17・第 4 波 3・第 5 波 11・第 6 波 5・第 7 波 9・第 8 波のほかの行 12・この行の接頭辞 shb_ は並べない・106 語）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・qgate_・hcard_・ntime_・ptitle_・ncard_・hsym_・smore_・lcard_・aaround_・hruling_・sxaxis_・plimit_・bport_・fstop_・nsum_・nsumw_・fmark_・fserve_・cadopt_・tipx_・hcsess_・hcproj_・sesplit_・mstore_・athr_・qblock_・wsteady_・gsum_・nstall_・pfold_・uword_・cround_・cgdom_・csled_・lhome_・ghb_・nact_・aord_・mtree_ で、新しい歯の名から先頭の shb_ を除いた字は、このどれも部分の字として含まない（例 shb_server_x・shb_project_x・shb_accept_x・shb_hook_x は不可）。main の f47356e の contracts の verify の filter の語 121（ノート surface-wave7 の 9 行の分を含む）は、どれもこの列の語のどれかを部分の字として含む（確かめた）。名の例（どの語も含まない）は shb_wire_takes_direction_only・shb_route_listed・shb_own_anchor_by_path・shb_same_steps_as_named_body・shb_refusals_before_vessel・shb_vessel_failures_are_502・shb_bytes_only_vessel_file・shb_http_guard_and_reply・shb_own_names_clean。
      依存と順。依存する行は無い（accept と guarded と Route の生成は着地済み）。同じノートの次の行 g-seat-hb がこの行の seathb の PATH と SeatHeartbeatRequest を使う。第 7 波の行 c-acct-thr は着地済み（main の c36fcc7・境界の acct.rs と契約の型の account.rs を書いた）で、この行はどちらも書かず、使う Acct の pub fn（new・host_state_dir・state_dir・scribe2・cwd）と orchestrator_target と account の Heartbeat・HeartbeatResponse の形はその着地で変わっていない（f47356e で確かめた）。第 7 波の行（main のノート surface-wave7 の 9 行・6 行は着地済み）と、計画 v0.8 の 4 節の第 8 波のほかの行の書く file に、accthb.rs・server の mod.rs・routes の下の新しい file・契約の型の lib.rs と seathb.rs は無い（main の f47356e と第 8 波の起草で確かめた）。第 7 波の着地した歯（athr_・qblock_・cadopt_・tipx_・mstore_・hcproj_）は、この行の書く file の字を読まない（grep で確かめた）。契約の型は新しい module に置くので、計画 5 節の contract/account.rs と contract/seat.rs の並びには入らない。
      依存は足さない。Cargo.toml・build.rs・route.rs・routes/heartbeat.rs・acct.rs・契約の型の account.rs は触らない。
  - n: 9
    type: prose
    title: 行 g-seat-hb — project board の席の block の停止の切り替え
    body: |
      なぜ。見本（判断の記録 ADR-7 の承認 user 2026-09-26T07:51Z で確定した docs/design/mock3）の project board は、block「orchestrator と口座」の合図の行（tick の健康と heartbeat）に、account board と同じ停止の切り替えの button（class btn hbbtn・字は語の鍵 hb_to_off か hb_to_on）を持ち、押すと撃つ CLI の字と効く範囲の字を見せる確かめを経て撃つ（ui.js の tkhbHTML・openHB・hbCmd と、index.html の renderSeat が tkhbHTML を呼ぶ所）。面の project board にはこの button が無い（着地済みの行 g-seat-more の節が、切り替えの button と確かめの段を後の行 g-seat-hb に回した）。持ち主は project board からも止める・戻すことを求め、範囲を t3-hub.52.29（裁定 id = t3-hub.52.29:20260928T0107Z-1）の案 A に決めた（project board 用の新しい口で本文は向きだけ・server は自分の --repo の project の席だけを止める・account board の口はそのまま）。口は同じノートの前の行 e-seat-hb が置く。この行は、account board の着地済みの切り替え（行 h-hb の heartbeat の module）の純粋な関数と確かめの段の DOM を使い回し、送り先だけを e-seat-hb の口に替えて、席の block に button と段を置く。止めるのは合図だけで、死んだ席の起こし直し・移動の退避・群の判定は動き続ける（段が語の鍵 hb_dlg_scope の字で見せる）。要件 FR12（停止の切り替えは器の CLI を撃ち、面は state dir の file を書かない）と、要件 NFR2 の読めないときは測れていないの決め（heartbeat が読めない card には button を出さない・account board と同じ）に拠る。
      流す順（計画 v0.8 の 5 節のとおり）。この行は第 7 波の行 g-seat-split（ノート surface-wave7）の着地の後に流す（src/project_dom/seat.rs と tests/sesplit.rs はその行が足す）。計画 5 節の seat.rs の並びは g-seat-split → g-seat-hb → g-jst → c-seat-tick → c-seat-grace → c-seat-group → g-seat-thr で、この行は g-seat-split の後で 2 つの file を最初に書く。g-seat-split の歯（tests/sesplit.rs）は 2 つの file の字を値で固めず、宣言の並びと名の在りかと details の数の下限だけを見るので、後の行が 2 つの file に名と字を足しても落ちない（ノート surface-wave7 の v0.3 の g-seat-split の節）。この行は tests/sesplit.rs を書かない（write-set の = は verify の --test の置き場だけ）。席は流す前に main で、src/project_dom/seat.rs と tests/sesplit.rs が在ることを確かめる。
      在りか（g-seat-split の着地の後の字・その行の done が見る字と、main の f47356e で確かめた字・seat.rs は 2bc9aa0 から変わっていない）。面の crate の src/project/seat.rs（block の module・crate::project::seat・host でも組む）は、BLOCK（id orch）・PATH（/api/seat）・PATHS（PATH だけ）・FOLDS（seat:hist と seat:more）と、pub struct Top（pub な欄 state・icon_class・key・label_class・since・tick〔Reading の Sign〕・heartbeat〔Reading の &str・on か off〕・derive は Debug と Clone と PartialEq）と pub fn top（&SeatCard を受けて Top を返す）と、pub struct Seat（欄 top・strips・low・band・hist・more）と pub fn content（&Fetched を受けて Body の Seat を返す・本文を SeatCard に読めれば Filled）ほかの host の値を持ち、末尾に wasm の target のときだけの pub fn view（本文は dom::view() だけ）と、wasm の target のときだけの属性と path の属性（../project_dom/seat.rs）つきの mod dom の宣言が在る。src/project_dom/seat.rs（wasm の target のときだけ組む・module の path は crate::project::seat::dom・中の use super が seat を指す）は、use の行（super から BLOCK・Top・Seat・Span・content ほか）と const HOURGLASS と、行の頭から始まり行の頭の閉じ波括弧で閉じる 16 の関数（search・pick・view・unknown・text_or_unknown・sign_view・seat_view・band_view・big_icon・top_view・strip_view・window_view・low_view・hist_row・hist_view・more_view・pub は view だけ）を持つ。pub fn view() -> AnyView は crate::net::read(PATH) の読みと幅の RwSignal を作り、読みが変わるたびに組み直す閉包で content の中身を seat_view（中身と幅の signal を受ける）に渡す。seat_view は top_view（Top を受ける）を呼び、top_view は大きい記号と語と「から」の div と、class tkrow の div の中の class tkhb の span（tick の健康の span と heartbeat の span）を組む。tests/sesplit.rs（g-seat-split の歯）は sesplit_decl_in_seat・sesplit_dom_file_holds_view・sesplit_host_names_kept・sesplit_details_moved・sesplit_own_names_clean の 5 本で、seat.rs の mod dom の宣言の 3 行の並びと、g-seat-split の節が並べた 2 つの名の列（中の名は src/project_dom/seat.rs に字下げの無い宣言の行が在り、fn view のほかは src/project/seat.rs に無い・外の名は src/project/seat.rs に列の数以上在る・宣言の行は種の語 const・static・fn・struct・enum・impl・mod と名で見る）と、seat.rs に字 <details と view! が無く src/project_dom/seat.rs に <details が 2 つ以上在ることを見る。名が在ることと無いことと数の下限だけを見るので、後の行が 2 つの file に名と字を足しても落ちない（2 つの file の字を値で固める歯は無い）。
      在りか（account board の切り替え・main の f47356e で確かめた・heartbeat.rs と session.rs と accthb.rs は 2bc9aa0 から変わっていない）。面の crate の src/account/heartbeat.rs（account の mod.rs の pub mod heartbeat・host でも組む）は、host の pub な物として、定数 BUTTON（字 btn hbbtn）・CMD（字 cmd）・LEAD_KEY（hb_dlg_lead）・SCOPE_KEY（hb_dlg_scope）・CANCEL（やめる）・FIRE（撃つ）と応答の字、契約の型の account の HEARTBEAT_PATH の pub use、fn word・opposite・button_key・command（撃つ字 scribe2 seat heartbeat と向きと --target と席の名・state dir は出さない）・request_body（project と向きの HeartbeatRequest の電文の字）・heartbeat_of・toggle（account の電文の session の行から Toggle）、pub struct Toggle（pub な欄 project・target・now・to・fn button_key・command・request_body・derive は Debug と Clone と PartialEq と Eq）、Panel と fn panel、Outcome と fn outcome（200 は撃った向き・404 no-project と no-seat・400 bad-body・502 vessel-failed は決まった字・ほかは状態の数・届かなければ届かない）、SendState・RowState（fn can_press・reply_line）・Event・fn step・starts を持つ。wasm の target のときだけの mod dom は pub use で States（project の名を鍵にした RowState の RwSignal の BTreeMap）と fn button（Toggle と States を受け、class BUTTON と data-hb と disabled の button を組む）と fn below（Toggle と States を受け、開いていれば確かめの段〔私的な fn confirm・class stack の div に語の鍵 2 つの字と class CMD の pre の撃つ字とやめると撃つの button〕、応答の後は応答の 1 行を組む）を出し、撃つと私的な fn submit が本文 Toggle の request_body を crate::net::post(HEARTBEAT_PATH, body) で送り、outcome で応答を段の字にして、200 なら crate::net::reload_all() で口を全部読み直す。dialog の要素は使わない。account board の session の表（src/account/session.rs）が heartbeat::button( と heartbeat::below( を呼ぶ（この行は session.rs を書かない）。契約の型の seat の SeatCard は pub な欄 target（String）と heartbeat（Reading の真偽・真が on）を持つ。同じノートの行 e-seat-hb が契約の型の crate に seathb の module（pub const PATH と、pub な欄 to の account の Heartbeat だけを持ち deny_unknown_fields の pub struct SeatHeartbeatRequest）を置く。stylesheet（style.css）には .tkhb .hbbtn の規則と class btn・primary・cmd・small・muted・row・stack の規則が在り、語の辞書（vocab.json）に鍵 hb_to_off・hb_to_on・hb_dlg_lead・hb_dlg_scope が在る（着地済みの歯 accthb_panel_texts が見る・この行は 2 つとも書かない）。
      形（heartbeat の module）。host に次を足す。pub use で契約の型の seathb の PATH を名 SEAT_HEARTBEAT_PATH で出す。pub fn seat_toggle（&SeatCard を受けて Toggle の Option を返す）は、card の target が空の字でなく heartbeat が Known のときだけ、project を空の字、target を card の target、now を Known の真なら On・偽なら Off、to を now の逆にした Toggle を返す。project を空の字にするのは、席の card が project の名を持たず、e-seat-hb の口は本文に project を持たず server が自分の --repo の project を引くため（States の鍵にだけ使い、1 つの board に席の block は 1 つ）。pub enum Dest（Account と Seat・送り先の口・derive は Debug と Clone と Copy と PartialEq と Eq）と、Dest の pub fn body（self と &Toggle を受けて String を返す）を足し、Account なら Toggle の request_body、Seat なら to だけの SeatHeartbeatRequest を wire の encode した字を返す。wasm の target のときだけの DOM は、今の fn below の本文を pub fn below_to（Dest・Toggle・States をこの順に受けて AnyView を返す）に移し、確かめの段と送りに Dest を渡す。fn below（引数と返りは今のまま）の本文は below_to(Dest::Account, t, states) の呼びだけにする。送りは Dest の body で本文を作り、Account なら crate::net::post(HEARTBEAT_PATH, body)、Seat なら crate::net::post(SEAT_HEARTBEAT_PATH, body) で送る（2 つの呼びの字をこのまま 1 度ずつ書く・着地済みの accthb_request_body が前の字を見る）。応答の出し方と、200 の後の reload_all と、送る間に押せないことは今のまま。mod dom の pub use に below_to を足す。button は変えない。module の doc に project board の席の block の使い方を足す。heartbeat.rs には doc にも /api/ の字と localStorage・sessionStorage・cookie の字を書かない（着地済みの accthb_no_dialog_and_no_storage と acctframe_path_from_contract_and_no_storage が file の全部の字を見る）。撃つ字は account board と同じ command のまま（見本の hbCmd は --state-dir と state dir の字を挟むが、面は state dir を知らず〔席の card に無い〕、account board の着地した字と歯 accthb_panel_texts も --state-dir を出さない）。撃つ字の --target は席の card の target の写しで、server が撃つ席は e-seat-hb の決めのとおり doctor の orchestrator の席の行の target（account board と同じ作り・ふつう同じ席）。
      形（席の block）。src/project/seat.rs の host の部分は、Top に pub な欄 toggle（Toggle の Option・停止の切り替え・行 g-seat-hb）を足し、fn top で seat_toggle に card を渡した値を入れ、use の行に account の heartbeat の Toggle と seat_toggle を足すだけにする（BLOCK・PATH・PATHS・FOLDS と、wasm の target のときだけの pub fn view と mod dom の宣言の行は変えない）。seat.rs の doc と comment にも字 view! と <details を書かない（歯 sesplit_details_moved が seat.rs の全部の字を見る）。src/project_dom/seat.rs は、use の行に crate::account::heartbeat の module と Dest と States を足し（呼びは heartbeat:: を頭に付けて書く）、pub fn view() -> AnyView の本文で幅の signal の隣に States の RwSignal を 1 つ作り（字 States = RwSignal::new( を含む形・読みの閉包の外に作るので、200 の後の読み直しで block を組み直しても段の応答の字が残る）、seat_view と top_view にその signal を渡す引数を足す。top_view の本文で、Top の toggle が Some のときだけ heartbeat::button( の呼びで button を組んで class tkhb の span の中の heartbeat の span の後に置き、heartbeat::below_to(Dest::Seat, の呼びで段を組んで class tkrow の div の後に置く（toggle が None なら button も段も出さない）。16 の関数の名と順と、pub fn view() -> AnyView { の字と、more_view・hist_view・strip_view ほかの本文は変えない。details の要素・記録の関数 fold の呼び・class の字の literal・引用符で囲んだ /api/ の字・見出しの語の literal は足さない（button と段の class は heartbeat の module の定数と既存の字）。200 の後の reload_all で口 /api/seat を読み直すが、境界の server は席の card の材料を 5 秒持ち回し（境界の server の seat の HOLD）、席の card の変化の印（境界の server の seat の marks）は席の dir の state.jsonl と tick-last だけで heartbeat-off を含まないので、block の heartbeat の語と button の向きは、しばらく前の値のことがある。撃った結果は段の応答の字（止めた・戻した）ですぐ見え、その字は States に残る。印と持ち回しの直しは境界の server の seat.rs の仕事で、この行の外。
