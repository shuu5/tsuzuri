sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      持ち主の 2026-09-28 の指摘と裁定を写す第 8 波の後半。
      次の一手が質問を上げただけの走行を止まった走行に数えず、判じなかった種類が在るときの「なし」を測れていないにし（c-next-stall）、一覧の小さい行に次の手の link と質問の経過を出す（g-next-rows・裁定 t3-hub.52.30）。
      bead の概要と技術の行を電文の節点の要約に写し、要約の無い節点を床で数え（c-summary-ledger・裁定 t3-hub.52.27）、ホームの台帳の一覧から閉じた項目を外す（g-ledger-home・裁定 t3-hub.52.31）。
      account board の口座を名の自然な順に並べ退役の口座を外し（h-acct-order・裁定 t3-hub.53.14）、project board に自分の席だけの heartbeat の口と切り替えを足す（e-seat-hb・g-seat-hb・裁定 t3-hub.52.29）。
      外の依存は足さない。どの行も計画 surface-plan の 4 節の行と同じ file と依存を持つ。
