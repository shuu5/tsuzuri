    body: |
      なぜ。持ち主の指摘（t3-hub.1（裁定 id = user 2026-09-28T00:4xZ）に逐語で記帳）は、次の一手の block に止まっている run しか出ず、質問が在っても目に入らないというもの。持ち主の裁定 t3-hub.52.30（裁定 id = t3-hub.52.30:20260928T0107Z-1・束 batch:20260928T0107Z-1・案 A）は、規則の行 R-24 の 7 種の順と大きく出す 1 つは変えず、一覧の小さい行でも当たっている行にはその種類の次の手の link（答える ほか）を付け、質問の行には経過の時間を出すと決めた。要件 FR11 は 7 種を優先の順に判じて 1 つを大きく出すと言い、一覧の行の出し方は決めない。見本 mock v3（判断の記録 ADR-7 の承認で確定・repo の写しは docs/design/mock3）の index.html の関数 nextItems と nextHTML は、大きい箱に最初に当たった 1 つを出し、残りを ul の nxlist の li（当たった行は class on）に並べ、li の値の span（class v small）に、質問の行は字 ◷ と、いちばん長く待つ open の問い（acct.js の nextAt の行の字「いちばん長く待つ質問」・ui.js の openQuestions は posted_at の古い順の列で、その先頭）の posted_at からの経過（ui.js の durMs）を出す。見本の一覧の行は link を持たず、link を足すのは裁定の案 A の足し。本番の一覧の行（src/project/next.rs の mod dom の row_view）は値の span に件数か「―」か測れていないの印だけを出し、link も経過も無い（main で確かめた）。この行は、当たった行に link を、当たった質問の行に経過を足す。大きい箱と 7 種の順と一覧の並びは変えない。
      在りか（main d927a57 で確かめた・計画の 5 節の順でこの行より先に流す第 7 波の行 g-card-adopt-a〔ノート surface-wave7・t3-hub.52.33〕は着地し、next.rs に足した物は下に書く）。src/project/next.rs（write-set・crate::project::next・build.rs が生成する project の block の module・着地済みの行 g-next と第 3 波の g-next-act が書いた）の host の部分は、pub const BLOCK（id next）・PATH（字 /api/next）・PATHS（PATH だけ）・FOLDS（空）・REASON・KEYS（7 種と語の鍵 nx_a から nx_g の表・語の鍵の引用符で囲んだ字は file に 1 度ずつ）・MISS（字 ―）・NONE_LINE と、link の字の 6 つ（PIPE_LINK は字 run を見る ›・ACCOUNT_LINK は account board を見る ›・SESSION_LINK は session を見る ›・BATCH_LINK は まとめて承認 ›・ANSWER_LINK は 答える ›・GAPS_LINK は orchestrator に任せる（見るだけ） ›）・pub fn key・pub enum Mark（Count の u32・Miss・Unmeasured）・pub struct Row（pub な欄 kind の契約の NextMove・key の &'static str・class の &'static str〔Count なら on・ほかは off〕・mark の Mark・derive は Debug・Clone・PartialEq・Eq）・pub struct Link（pub な欄 href の String と text の &'static str・derive は同じ）・pub struct Big（欄 target の String の Option を含む）・pub struct Next（big と rest の Row の Vec）・pub fn step・pub fn body・pub fn content（Fetched の参照を受け kit の Body の Next）・pub fn next（契約の NextStep の参照を受け Next・rest は NextMove の ALL の順から lead を除いた 6 行）・pub fn row（NextMove と NextCheck の参照の Option を受け Row）・pub fn big・pub fn action（NextMove と対象の id の &str の Option と frame の Mode を受け Link の Option・限度と移動は account の tab_href の Home・応答なしは Session・束の承認は問いの頁の href と字 # と batch の BLOCK の id・質問は対象が在れば node の answer_href、無ければ問いの頁の href・発効待ちは抜けの検査の頁の href・止まっている走行となしは None）・pub fn window_of（限度と移動と応答なしは account の windows の ACCOUNT_WIN・ほかは None）。file の頭の use に super の Body・NO_CONTENT・NOT_READ・batch・pipeline が在り、pipeline の BLOCK の id は字 pipe。wasm の target のときだけの mod dom（字 mod dom { は file に 1 度）の view は口 PATH を crate::net::read で読み、mode の closure（context の HelpCtx の mode か、無ければ URL の query の Mode::from_query）を作り、Filled の Next を next_view に渡す。next_view は big_view と、rest を row_view に渡した li の列を ul（class nxlist）に置く。big_view は Big の link か action の値を a（class btn primary・target は window_of の値）で描く。row_view（引数は Row だけ）は li（class は Row の class・data-nx は Row の key）の中に hs と span（class v small）を置き、span の中に Count なら span（class num）の数、Miss なら MISS、Unmeasured なら測れていないの印を描く。Row を組むのは row だけで、Row を struct の字で組む歯は無い（src と tests を grep で確かめた）。着地済みの第 7 波の行 g-card-adopt-a は next.rs に pub struct BigTitle と pub fn big_title を足し、mod dom の view でグラフの口を map の PATH で読み、Filled の腕で big_title の値を next_view に渡し、next_view がそれを big_view に渡した（row_view と Row と row と action と window_of は変えていない・main d927a57 の字で確かめた）。同じ第 8 波の行 c-next-stall（この行の depends・起草の file で確かめた）は next.rs に pub const UNJUDGED_KEY（字 st_unknown）と pub const UNJUDGED_LINE と pub fn unjudged（NextStep の参照を受け bool・lead がなしで checks のなしの結果が NotJudged のときだけ真・なしの check が電文に無ければ偽）を足し、next の大きい箱を unjudged が真のときだけ測れていないの箱にする（一覧の rest と row と big と action は変えない）。この行はこの 2 つの行の後の字に書き、2 つの行の足した字と値は変えない。
      使う物（この行は書かない・確かめた）。src/project/ask.rs（置き場だけの =・crate::project::ask・host でも組む）の pub const PATH（字 /api/questions）、pub fn cards（Fetched の参照を受け、Result の契約の QuestionCard の Vec と &'static str の理由を返す・NotRead に NOT_READ・Failed に ask の REASON・cards が Unknown の電文に CARDS_UNKNOWN・QuestionList として読めない本文に UNREADABLE）と pub fn age（今の EpochSecs と posted_at の EpochSecs を受け String・経過の分が 60 未満なら分の数と字 m、48 時間未満なら時間の数と字 h と 2 桁の分〔分が 0 なら時間の数と字 h だけ〕、それ以上は日の数と字 d・見本の durMs と同じ）。どれも ask.rs の mod dom より前に在る。問いの頁の束の block（src/project/batch.rs）も問いの一覧の口を crate::net::read(ask::PATH) の字で読む（着地済みの歯 batchpanel_paths が batch.rs と policy.rs の字を見る）。契約の QuestionCard は pub な欄 id の BeadId（as_str で字）と posted_at の EpochSecs を持つ（中核の question の module は bead の作られた時刻、読めなければ更新時刻、どちらも無ければ 0 を置く）。着地済みの第 7 波の行 c-q-blocking は QuestionCard に serde の default の付いた欄 blocking（String の Vec）を足し、ask.rs の Card と mod dom を書いたが、cards と age の名と引数と返りは変えていない（main d927a57 で確かめた）。この行は QuestionCard を struct の字で組まず、歯は fixture の字を decode する。frame の Mode（Beginner と Expert・key は字 beginner と expert）と pub fn href（頁と Mode を受け String）、node の pub fn answer_href（id の &str と Mode を受け、字 ?page=ask&id= と id を URL の形にした字と字 &mode= と鍵をつないだ String）は着地済み。通信（src/net.rs・wasm の target のときだけ）の pub fn read（&'static str の path を受け ReadSignal の Fetched）は同じ path の読みを頁で 1 つの signal に分け、pub fn now（EpochSecs）は今の時刻。
      電文と対象（確かめた）。中核の next_step の質問の判じ（着地済み）は、台帳の open の問いの数を件数に、作られた時刻のいちばん古い問いの id を target に置く。口 /api/questions の card は同じ台帳の open の問いで、posted_at の古い順（同じなら id の順）に並ぶ。見本の経過の問い（open の問いの posted_at の古い順の先頭）と同じ問いを、面は電文の target の id で問いの一覧から引くだけで、並べ直しも選び直しもしない（作法 7・面に判定を書かせない）。問いの一覧が読めない、まだ読んでいない、target が無い、一覧に target の card が無いときは経過を出さず、今のとおり件数だけを出す。
      形（host の部分）。Row に pub な欄 target（String の Option・電文の NextCheck の target の字の写し）を足す（欄の順は問わない）。row は check の target を字にして置き、ほかの欄の決め方は変えない。pub fn row_link（Row の参照と Mode を受け Link の Option）は、mark が Count の行だけに link を返し、止まっている走行は大きい箱の Big の link と同じ Link（href は字 # と pipeline の BLOCK の id・字 PIPE_LINK）、ほかの種類は action に種類と Row の target と mode を渡した値（なしは None）を返す。当たらない行と測れていない行は None。pub fn waited（Row の参照と Fetched の参照と EpochSecs を受け String の Option）は、種類が質問で mark が Count で target が Some のときだけ、ask の cards の Ok の列から id の字が target と同じ card を探し、在れば字 ◷（U+25F7・見本の nx_e の小さい値の字）と空白と ask の age に今と card の posted_at を渡した字をつないだ字を返し、ほかは None を返す。Row の kind と key と class と mark の値、Big と Next と big と action と window_of の値は変えない（着地済みの歯 nextstep_ と nxact_ が見る）。
      形（DOM・mod dom の中・字は次のとおりに決め、歯 nact_dom_wiring がこの字で見る）。view は問いの一覧の口を crate::net::read(ask::PATH) の字で読み（mod dom の use の書き方は問わない）、その signal と mode の closure を next_view に渡し、next_view はそれを row_view に渡す（引数の足し方は問わない）。row_view は li の中の値の span（class v small）の中に、今の mark の描きの後へ、waited の値が Some なら空白と span（class num）の中の経過の字を、row_link の値が Some なら空白と a（href は Link の href・target は window_of の値・中は Link の text）を置く。waited は読みの signal の with の中で今（crate::net::now）と呼び、row_link は mode の closure の値で呼ぶ（どちらも closure の中で呼び、mode と読みが替われば描き直す・呼び方の字は問わない）。新しい class と語の鍵と引用符で囲んだ /api/ の字は足さない（class の num と v と small は stylesheet に在る・着地済みの歯 nextstep_keys_in_vocab_and_classes_in_stylesheet が見る）。style.css の #next .nxlist li は flex の横並びで、値の span は右に寄る。link の字は折り返せる字で、列の幅（150px 以上）で横にはみ出さない。
      出さない物。大きい箱の中身と link と、規則の行 R-24 の順と、一覧の並び（NextMove の ALL の順から lead を除く）は変えない。一覧の行の件数は消さない（見本の質問の行は経過だけを出すが、本番は件数の後に経過を足す・件数は着地済みの歯 nextstep_rest_in_declared_order_without_lead が見る Row の mark の値のまま）。一覧の行に hover の card は付けない（見本も持たない）。経過の毎秒の書き直しはしない（後の行 g-tick-adopt が次の一手の質問の経過を 1 秒の時計で書き直す・この行の経過は読みの signal が替わった時に今の時刻で組む）。大きい箱の質問の経過（見本も出さない）と、account board の HOME の次の一手の並びの行の link は出さない。
      問いの一覧の口の読み。この行で project board の HOME の頁の次の一手の block が口 /api/questions を読む（境界の server の口は着地済みで、問いの頁の ask と束の block が既に読む）。net の read は同じ path の読みを頁に 1 つの signal で分けるので、口を読むのは頁に 1 度で、変化の知らせの合図で読み直す。経過の材料を電文 NextCheck の欄に足す形は取らない。取れば契約の stats の module と snapshot、中核の next_step.rs（第 8 波の行 c-next-stall が書く file）、NextCheck を struct の字で組む着地済みの歯（面の tests/next.rs の fn check・tests/accthome.rs の fn step ほか）が write-set に入り、ほかの行の書く file に重なるため。
      着地済みの歯（直すもの）。無い。
      着地済みの歯（直さずに通る・write-set の外・tests の下の全部を grep で確かめた）。nextstep_ の歯（tests/next.rs）は fixture の 4 組の Big の key と class と what と link、rest の key と class と mark の組、7 種の語の鍵の引用符で囲んだ字が next.rs に 1 度ずつであること（nextstep_keys_one_table_in_declared_order）、組の中身と字 nxlist・act・btn・primary・v・small・num の class が stylesheet に在ること、BLOCK と PATH と body の形と面の crate の直接依存の名（nextstep_landed_shape_and_no_new_deps）を見る。この行は Row の既存の欄の値を変えず、欄を 1 つ足すだけで（歯は Row を struct の字で組まない）、語の鍵の字と class を足さない。nxact_ の歯（tests/nextact.rs）は action と window_of の値と、next.rs の字 mod dom { より後に action( と window_of( と use_context::<HelpCtx>() と Mode::from_query( が在り、mod dom より前に pub fn action( と pub fn window_of( が在ることを見る（big_view の action と window_of の呼びは残り、row_link は mod dom より前に在って action を呼ぶ）。c-next-stall の面の nstall_ の歯（tests/nstall.rs・この行より先に着地する・起草の名は nstall_unjudged_box）は unjudged と next の大きい箱の値と、一覧の 6 行の class と mark を見る（この行は Row に欄を足すだけで class と mark と大きい箱の値を変えない・起草の file の done で確かめた）。cadopt_ の歯（着地済みの g-card-adopt-a の tests/cadopt.rs）は next.rs の字 mod dom { より後の big_title(&next.big, g) と map::PATH と node_href( と big_view の a の字と、Big と big_title の値を見る（この行は変えない）。parts_paths_distinct_in_block_modules と境界の brand_path_written_once_in_contract は src の引用符で囲んだ /api/ の字を数える（この行は ask の PATH の名で読み、字を足さない）。hsderive_consts_match_note は next の PATHS が PATH だけで、PATHS の行が字を持たないことを見る（この行はほかの module の口を読む所を PATHS に数えない・g-card-adopt-a の map の PATH の読みと同じ）。steady_details_use_fold_record は block の file の details の tag と畳みの記録の数を見る（この行は details を足さない）。frame_classes_are_in_stylesheet と frame_no_heading_words_in_code は src の全部を歩く。この行は class の字を足さず、足す literal（format の字 ◷ と空白と波括弧の対）は語の辞書の非 ASCII の見出しの語と同じ字でない（語の辞書の label に字 ◷ を持つ語は無い・vocab.json を読んで確かめた）。batchpanel_ と askcard_ と afocus_ と aaround_ の歯は ask.rs と batch.rs と policy.rs の字と値を見る（この行は書かない）。account の home.rs と projects.rs は next の big と key を使い、tests/accthome.rs は next の NONE_LINE を使う（変えない）。tests/snapshots の頁の写しは頁の枠と block の並びだけを持つ（変えない）。
      測り方。新しい歯は tests/nact.rs に置き、名を nact_ で始める。歯は fixture の字を CARGO_MANIFEST_DIR から ../../tests/fixtures/surface/ の下の next-step.json と question-list.json として読む。next-step.json は wire の decode で組の名から NextStep の map にし、組の字を next の content に渡した Filled の Next の rest から行を取る（着地済みの nextact.rs と同じ読み）。fixture の値は、組 stalled が lead stalled-run で、一覧の nx_e が hit・count 3・target nx.2、組 not-judged が lead batch-approval で、一覧の nx_b が miss、nx_c が not-judged、nx_e が hit・count 5・target nq.1、組 question が lead question で一覧の行の target は全部 null、組 nothing が lead nothing。歯の中の電文は、契約の NextStep と NextCheck を struct の字で組む（着地済みの nextstep_copies_lead_without_judging と同じ組み方・NextCheck の欄は kind・result・count・target）。6 種が当たる電文は lead を NextMove の Nothing にし、限度と移動・応答なし・束の承認・発効待ちは target なし、止まっている走行は count 2 と target nx.7、質問は count 3 と target nq.4、束の承認は count 4 とする（なしの check は置かない）。waited の行は row に NextMove の Question と、count 2 と target の字の NextCheck（Hit か Miss）を渡して作り、止まっている走行の行は NextMove の StalledRun で作る。question-list.json の card は 2 つで、qa.2 の posted_at は 1790488800、qa.10 の posted_at は 1790494200。今 1790492700 は qa.2 から 3900 秒（65 分）、1790748000 は qa.2 から 259200 秒（72 時間）、1790494440 は qa.10 から 240 秒。cards が Unknown の本文は、契約の QuestionList の cards を Reading の Unknown にした値を wire の encode で字にする（QuestionList は欄 cards だけで、第 7 波の足しは無い）。nact_dom_wiring は CARGO_MANIFEST_DIR から src/project/next.rs の字を読み、字 mod dom { で前と後に分けて done (4) の字を探す。DOM が組めることは xtask の surface-build で見る。自分の名の歯は tests/nact.rs の字を読み、test の属性の行の次の fn の名を全部集め（着地済みの nxact_own_names_clean と同じ読み方）、名の数が 5 以上であることと done (6) を見る。fixture は足さない。
      filter の語（着地済みの行と第 3 波から第 8 波の行の verify の語・この行の接頭辞 nact_ は並べない・106 語）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・qgate_・nsum_・hcard_・ntime_・ptitle_・ncard_・hsym_・smore_・lcard_・aaround_・hruling_・sxaxis_・plimit_・bport_・fstop_・nsumw_・fmark_・fserve_・cadopt_・tipx_・hcsess_・hcproj_・sesplit_・mstore_・athr_・qblock_・wsteady_・gsum_・nstall_・pfold_・uword_・cround_・cgdom_・csled_・lhome_・shb_・ghb_・aord_・mtree_ で、新しい歯の名から先頭の nact_ を除いた字は、このどれも部分の字として含まない（例 nact_nextstep_x・nact_nxact_x・nact_frame_x・nact_stage_x は不可）。名は done に書いた nact_row_carries_target・nact_row_link_rules・nact_waited_rules・nact_dom_wiring・nact_own_names_clean（どの語も含まない）。
      依存。depends は同じノートの前の行 c-next-stall（計画 v0.7 の 4 節の依存と、同じノートに置く組）。c-next-stall は中核の next_step.rs で止まっている走行の段から Questioned を除き、面の next.rs の next の大きい箱に測れていないの箱を足す。この行は c-next-stall の作る名を使わないが、同じ next.rs を書くので、その後の字に書く（中核の next_step.rs は書かない・電文に足さないので、計画の 5 節の next_step.rs の列の g-next-rows〔電文に足すときだけ〕は当たらない）。この行の歯は一覧の rest と row と action の値と、面の fixture の next-step.json と question-list.json だけを見る。c-next-stall は next-step.json を置き場だけで書かず、rest と row の決め方を変えない（その起草の file で確かめた）ので、この行の歯の値は c-next-stall の後でも同じ。next.rs は計画の 5 節の順で g-card-adopt-a → c-next-stall → g-next-rows → g-tick-adopt → f-undelivered と書く（g-card-adopt-a は別のノートの行なので depends に書かない）。ask.rs は置き場だけで中身を書かない（ask.rs を書いた第 7 波の行 c-q-blocking は着地した）。Cargo.toml・vocab.json・style.css・fixture・ask.rs・batch.rs・board.rs は触らない。
  - n: 5
    type: prose
    title: 行 c-summary-ledger — 台帳の bead の 2 行の概要を節点に写し、要約の無い節点を床が名指す
    body: |
      なぜ。要件 FR15 は、節点ごとの概要（非エンジニア向けとエンジニア向け）を設計文書の plain の欄と台帳の要約の欄に置き、面は写すだけで生成せず、要約の無い節点は床が数えるとし、確かめ方を要約の無い節点 1 つの fixture で床が 1 件を名指すこととする（受入基準 AC12 の後半の、要約の無い節点が名指される）。着地済みの行 c-summary-design（t3-hub.52.25・main bf21e14）は電文の節点（契約の型の graph の pub struct GraphNode・pub な欄 id・kind・file・digest・title・line・plain・eng で、line は u32 の Option、plain と eng は String の Option、3 つとも serde の default）に欄 line・plain・eng と、folio の要約の字を設計の節点に写す中核の関数 add_summary を置き、着地済みの行 c-summary-wire（t3-hub.52.26・main 2bc9aa0）は server と tz graph がその字を読んで add_summary に渡す形にした。台帳の bead の節点は file を持たないので add_summary が触らず、build も 3 つの欄を無しで組むので、bead の節点の概要は電文でいつも null のまま（確かめた）。持ち主の裁定 t3-hub.52.27（裁定 id = t3-hub.52.27:20260928T0049Z-1・逐語は台帳の問いの notes）は推奨の案 A を選び、bead の description の行頭が「概要 = 」の行を plain に、「技術 = 」の行を eng に写す（問いの bead が既に持ち、中核の question が問いの card に読む形と同じ）、便の bead は契約の行の題を写す、どちらも無い bead は要約なしとして床が数え、画面は題だけを出し、これから作る bead には 2 行を書く運びにする、と決めた。この行は、description の 2 行の写しを中核の build に置き、要約の無い節点を名指す床の関数を中核の不変条件の module に置く。裁定の、便の bead は契約の行の題を写す、は席の運び（席が便の bead を台帳に置くとき、その description に行頭が「概要 = 」の行と「技術 = 」の行を書く・席の決め）で満たし、この行の build は便の bead の 2 行もほかの bead と同じ決まりで plain と eng に写す（便の bead に別の決まりを持たない）。
      この行が持たないもの。契約の行の題を設計ノートか contracts の file から読んで便の bead の節点に写す code は、この行に入れない（席の決め・裁定の題の写しは上の席の運びで満たす）。契約の行の題は設計ノート（design-intent/design-note の YAML）とその導出物（contracts の下の toml）にしか無く、中核の build が受ける 3 つの字（設計の索引・台帳の一覧・器の event log）にも、add_summary が受ける folio の要約の字にも無い（確かめた・席の folio 0fb780e の graph の --print と --print --summary は設計文書の 11 種の節点だけを出し、設計ノートの行を出さず、題を 36 字で切る・中核の build は設計ノートの行の節点と design の辺をまだ組まない）。中核は file を読まず、境界が設計ノートか contracts の file を読むのは計画 surface-plan の 3 節の席の決め（設計ノートの行の材料は folio の索引に載るのを待つ・条 P-2）に反するので、この行はどちらもしない。便の bead（acceptance に字「design = 」で始まる行を持つ task）は、description に 2 行を持たなければ（運びの前に置いた便の bead など）、この行の後も要約なしのままで、床が名指す。床の名指しを tz graph --check の出力と面に出す配線もこの行は持たない（この行の関数を呼ぶのは歯だけ・後の行）。面の表示（一覧の要約・節点の頁の 2 つの箱・card）は行 g-summary が持つ。受入基準 AC12 の前半（判定の 5 値と未反映の 3 種の数）もこの行は持たず、この行は受入基準 AC12 の全部を満たしたとは言わない。
      在りか（中核の graph・main d927a57 で確かめた・中核の src/graph の下と tests/nsum.rs は c-summary-design〔main bf21e14〕の後に変わっていない・その後の着地で中核を書いたのは、f-stop の歯 fstop.rs と、c-q-blocking〔t3-hub.52.37・main 90f9833〕の question.rs と歯 qblock.rs と、c-acct-thr〔t3-hub.53.17・main c36fcc7〕の account の下と歯 athr.rs と acctpcore.rs だけ）。中核の crate の src/graph/mod.rs は pub mod around・build・check・view と、pub use の build と around と view（どれも関数）と check の Invariant と Verdict と check を持ち、pub struct Inputs（欄 design_index・ledger・events の 3 つの &str）と pub struct Graph（pub な欄 nodes の GraphNode の Vec・edges・unread の Source の Vec・skipped・beads・runs・derive は Debug・Clone・Default・PartialEq・Serialize）と、Graph の pub fn is_read（Source を受け bool・unread に無ければ真）と、pub enum Source（Design・Ledger・Runs）と Source の pub fn kinds（Design は契約の型の NodeKind の ALL の先頭の 11・Ledger は Epic・Task・Memo・Question・Ruling・Receipt・Policy・Runs は Run）を持つ。契約の型の NodeKind の ALL（20）の先頭の 11 は、条・規範文・規則行・目的・要件・非機能要件・受入基準・制約・登場人物・出力・判断の記録（Article から Adr）で、その後に NoteRow・Epic・Task・Memo・Question・Ruling・Receipt・Policy・Run が続く。src/graph/build.rs は pub fn build（&Inputs を受け Graph）と pub fn add_summary（&mut Graph と &str を受け bool）と pub const DESIGN_KINDS（11）・POINTER_PREFIX（字「design = 」）・TYPED_LINES と、台帳の 1 本を読む pub(crate) の struct BdBead（欄 id・title・description・status・issue_type・labels・notes・acceptance_criteria〔serde の alias で鍵 acceptance も読む〕・metadata・parent・時刻の 3 つ・dependencies で、description と notes と acceptance_criteria は Option の String）を持つ。build は設計の索引の節点（file を持つ）を先に積み、私的な fn add_ledger で bead ごとに節点（種類は pub(crate) の fn bead_kind が epic・memo・問い・task の順に決める・file と digest は無し・題は契約の型の title36）を積み、notes の定型行（字「裁定 id = 」「受け id = 」「方針 id = 」で始まる行）から裁定・受け・方針の節点を導き、event log の RunCreated から走行の節点を積む。build.rs の 4 か所の GraphNode の組みはどれも line と plain と eng を無しにする。add_summary は、読めた要約の字の行のうち id と file の字が同じ行の在る節点（file を持つ節点）の 3 つの欄だけを写し、file の無い台帳と走行の節点を触らない。build.rs の頭の注は、節点の行と 2 つの概要は組まず、build の後に add_summary が folio の要約の字から写す、と言う。build.rs の字は std::fs と std::process と SystemTime を持たない（着地済みの歯 nsum_core_reads_no_files が見る）。
      在りか（問いの本文の読み・この行は書かない）。中核の crate の src/question.rs（lib.rs の pub mod question・host の code）は pub const PLAIN_PREFIX（字「概要 = 」）と ENG_PREFIX（字「技術 = 」）と pub fn typed（description の &str と頭の字の &str を受け Option の String）を持つ。typed は description を行に割り、行の末尾の CR を除き、行頭が頭の字の最初の行の残りの前後の空白を除いた字を返し、その字が空か頭の行が無ければ None を返す（同じ頭の 2 つ目の行は読まず、行頭が空白の行は頭の行でない）。pub fn list（台帳の字を受け QuestionList）は open の問い（label intake:question を持ち状態が closed でも tombstone でもない bead）の card の欄 plain と eng を、typed に PLAIN_PREFIX と ENG_PREFIX を渡した値にする（着地済みの歯 question_ が見る）。question.rs は graph の build の BdBead と read_ledger を use している。build.rs から question の typed と 2 つの定数を use しても、同じ crate の 2 つの module の間の use なので組める。着地済みの行 c-q-blocking（t3-hub.52.37・main 90f9833）は question.rs に pub const BLOCKS_TYPE と card の欄 blocking の組みを足したが、typed と 2 つの頭の字と list の plain と eng の決まりは変えていない（main で確かめた）。
      在りか（不変条件の module）。src/graph/check.rs は pub enum Verdict（Pass・Violation の id の列・Unknown）・pub struct Invariant・pub const INVARIANTS（g-1 から g-12 の 12）と UNMEASURED（g-3・g-7・g-9）・pub fn check（&Graph を受け Invariant の Vec）と pub const QUESTIONED（字 Questioned・g-12 の私的な判じが読む走行の段の名）と、私的な判じの関数と、file の中の歯 graph_rules_follow_the_id_list と graph_on_loop_finds_only_loops を持ち、use は std の collections の BTreeMap と BTreeSet・serde の Serialize・契約の型の graph の EdgeType と NodeKind・契約の型の ledger の MEMO_LABEL・super の Graph と Source。12 本は設計ノート surface の不変条件の閉じた一覧で、この行は 13 本目を足さない（要約の無い節点は違反の判定でなく数えて名指す値で、tz graph --check の終了 code に入れない）。契約の型の crate の src/board.rs の pub enum Reading（Known と Unknown・derive は Debug・Clone・PartialEq と serde）は中核の ledger の unreflected が既に使う。
      在りか（配線・着地済み・この行は書かない）。境界の crate の src/server/board.rs の私的な fn built は build の後に add_summary を撃ち（返りの bool は使わない）、pub fn graph（不変条件を数えて GraphDoc）と view と around がその値を使い、src/cli/graph.rs の tz graph の旗なしと --check と --design は board の graph を通る。build が bead の節点に概要を写せば、口 /api/graph の電文の nodes と、/api/graph/view と /api/around の本文の節点と、tz graph の電文に bead の plain と eng が載る（境界の crate は書かない）。
      形（build.rs）。私的な fn add_ledger が bead の節点を組むとき、plain を bead の description（無ければ空の字）の PLAIN_PREFIX の行の字、eng を ENG_PREFIX の行の字にし、line は無しのままにする。決まりは中核の question の typed と同じ（typed と 2 つの頭の定数を use して呼んでも、同じ決まりを書いてもよい・歯は値で見る）。bead の種類（epic・task・memo・question）と状態（closed を含む）によらず写す。notes の定型行から導く裁定・受け・方針の節点と、走行の節点と、設計の索引の節点の組みは今のまま（3 つの欄は無し）。build の引数と返り、add_summary、ほかの関数と定数は変えない。頭の注の、節点の行と 2 つの概要は組まない、の文は、台帳の bead の概要は build が description の 2 行から写し、設計の節点の行と概要は add_summary が写す、の形に直してよい（字の歯は無い）。build.rs に std::fs・std::process・SystemTime の字を足さない。
      形（check.rs）。pub const SUMMARY_KINDS（契約の型の NodeKind の 15 の配列・NodeKind の ALL の先頭の 11 の設計文書の種類をその順に、続けて Epic・Task・Memo・Question）と pub fn unsummarized（g の &Graph と summary の bool を受け、契約の型の board の Reading の String の Vec を返す）を足す。summary は、呼ぶ側が設計の索引の要約の字を読めたか（add_summary の返りの値）を渡す。決まり。g の unread に Source の Design か Ledger が在るか、summary が偽なら Unknown（設計の節点の概要か台帳が測れていないので、0 件とも名指しとも言わない・要件 NFR2 と条 P-7）。そうでなければ Known で、列は g の節点のうち種類が SUMMARY_KINDS に在り、plain と eng のどちらも空でない字を持たない（無しか空の字）節点の id を、字の順（Rust の String の比べの順）に 1 度ずつ並べた列（同じ id の節点が 2 つ在っても 1 度）。空白だけの字の扱いは決めない（歯は見ない）。数えない種類は 5 つ。裁定と受けと方針は bead の notes の定型行の 1 行から導く節点で、題がその行そのもので、設計文書の plain の欄も台帳の要約の欄も持たない。走行は器の event log から導く節点で、どちらの欄も持たない。設計ノートの行（NoteRow）はまだ組まない（後の行 c-dn-rows が組むときに数えるかを決める）。RULES・INVARIANTS・UNMEASURED・QUESTIONED・check・Verdict・Invariant と file の中の歯は変えない。check.rs の頭の注に 1 行足してよい。check.rs に std::fs・std::process・SystemTime の字を足さない。
      足す名。この行が足す名（check.rs の SUMMARY_KINDS と unsummarized・歯の file tests/csled.rs と接頭辞 csled_）は、base のどの crate の src と tests と xtask にも無い（確かめた）。
      着地済みの歯（直すもの）。無い（この行は tests の下の着地済みの file を書かない）。tests/nsum.rs は、build の 3 つの欄と build.rs の字を見る歯を持つので、置き場だけの = で write-set に置き（中身は変えない・宣言を審査の材料に載せる）、verify で撃つ。
      着地済みの歯（直さずに通るもの・全部の crate の tests と src の中の歯を grep で確かめた）。build を撃つ歯と、口と tz graph の電文を中核の値と比べる歯のうち、台帳の bead の description に行頭が「概要 = 」か「技術 = 」の行を持つ字を渡すものは、この行の歯のほかに無い。行頭が 2 つの頭の字の行を持つ fixture は tests/fixtures/surface の question-2.json と question-batch.json の 2 つだけで、それを読む歯（中核の tests/question.rs と着地済みの c-q-blocking の tests/qblock.rs・境界の tests/server_ask.rs と server_batch.rs と fserve.rs）は問いと束と裁定の口と中核の question の関数を撃ち、graph の口と tz graph を撃たず build を呼ばない（server_batch と中核の fmark は graph の build の定数 TYPED_LINES を読むだけ）。中核の tests/nsum.rs の nsum_build_leaves_fields_empty は、tests/fixtures/graph/real の design-index.tsv と tests/fixtures/ledger/bd-list-8.json と tests/fixtures/graph/real/events.jsonl の build の全部の節点の 3 つの欄が無しであることを見る。bd-list-8.json の 8 本の bead はどれも行頭が 2 つの頭の字の行を持たないので（確かめた）、この行の後も全部無し。nsum_fills_matching_nodes・nsum_missing_keys_are_null・nsum_unreadable_changes_nothing の台帳の字は bead t-1 の 1 本（description なし）で、t-1 の 3 つの欄は無しのまま。nsum_core_reads_no_files は build.rs の字に std::fs・std::process・SystemTime が無いことを見る（この行は足さない）。ほかの nsum_ の歯は契約の型の電文と snapshot と add_summary を見て、この行は変えない。中核の tests/graph.rs・gquestion.rs・gview.rs と、build.rs と check.rs の中の歯 graph_ は、build の節点の数と種類と id と辺と属性と不変条件の判定を見て 3 つの欄を読まず（tests/fixtures/graph の 6 つの台帳の fixture と tests/fixtures/ledger の台帳の fixture も行頭が 2 つの頭の字の行を持たない・確かめた）、この行は判定の関数を変えない。境界の tests/nsumw.rs・server_read.rs・server_view.rs・server_coalesce.rs・kcli.rs は、口と tz graph の電文を、同じ字で中核の build（と add_summary）を撃った値と比べるので両側が同じ関数を通り、使う台帳の fixture（bd-list-8.json ほか）は行頭が 2 つの頭の字の行を持たない。kcli の歯は check の INVARIANTS と UNMEASURED を読み、この行は変えない。面の歯は tests/fixtures/surface の電文を decode するだけで build を呼ばない。xtask の歯 skeleton_direct_deps_match_list と中核の acctcore_pure_and_no_new_dependencies は Cargo.toml（後者は中核の src/account の下の字も）を読み、この行は書かない。中核の src/graph/check.rs の字を読む着地済みの歯は無い（この行の歯 csled_floor_shape_and_pure が初めて読む）。
      節の字（歯の中で組む・fixture の file は足さない・台帳の JSON の字は serde_json の json! で組む）。IDX1 はタブ区切りの 5 列の 1 行で FR1・要件・srs.yaml・00000000・面は 2 つ。EV1 は JSON の object の 1 行（鍵 kind の値 RunCreated・鍵 run の値 t-2-20260928T010000Z）。LED は bead 8 本の JSON の配列で、どの bead も鍵 id・title（字 題）・issue_type・status・labels（字の配列）を持つ。q-1 は task・open・labels は intake:question・description は字「前置きの字」と改行と「概要 = やさしい説明」と改行と「技術 = かたい説明」と改行と「概要 = 2 つ目の概要（取らない）」をつないだ字・notes は字「裁定 id = q-1:20260928T0100Z-1・問い = q-1・逐語 = はい」と改行と「受け id = r-1・受けた」と改行と「方針 id = p-1・方針の行」をつないだ字（build はこの 3 行から裁定の節点 q-1:20260928T0100Z-1 と受けの節点 r-1 と方針の節点 p-1 を導く）。t-2 は task・open・labels は空・description は「技術 = 技術だけの行」・acceptance_criteria は「design = contracts/surface-wave6.toml#c-summary-wire」。m-3 は task・open・labels は intake:memo・description は字「概要 = 」と空白 2 つと「memo の説明」と空白 2 つと CR と改行と「残り」をつないだ字。e-4 は epic・open・labels は空・description は「概要 = epic の説明」。t-5 は task・closed・labels は空・description は「概要 = 閉じた bead の説明」。t-6 は task・open・labels は空・description は「第 8 波。契約 = contracts/surface-wave6.toml#c-summary-wire。」・acceptance_criteria は t-2 と同じ字。t-7 は task・open・labels は空・description は空白 1 つと「概要 = 行頭に空白」と改行と「技術 = 」（頭の後に字が無い）をつないだ字。t-8 は task・open・labels は空・鍵 description を持たない。
      表 T1（G1 の節点の line・plain・eng）。FR1 は 3 つとも無し。q-1 は line 無し・plain やさしい説明・eng かたい説明。裁定の節点 q-1:20260928T0100Z-1 と受けの節点 r-1 と方針の節点 p-1 は 3 つとも無し。t-2 は line 無し・plain 無し・eng 技術だけの行。m-3 は line 無し・plain memo の説明・eng 無し。e-4 は line 無し・plain epic の説明・eng 無し。t-5 は line 無し・plain 閉じた bead の説明・eng 無し。t-6 と t-7 と t-8 と走行の節点 t-2-20260928T010000Z は 3 つとも無し。G1 の節点はこの 13 個（設計の 1・bead の 8・裁定と受けと方針の 3・走行の 1）。
