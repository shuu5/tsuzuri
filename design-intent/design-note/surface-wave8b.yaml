      IDX2 はタブ区切りの 5 列の 2 行で FR1・要件・srs.yaml・00000000・面は 2 つ と FR2・要件・srs.yaml・00000000・地図の面。SUM2 は同じ鍵の順の 2 行で、FR1・要件・srs.yaml・2・面は 2 つ・plain 画面は 2 つです。・eng null と、FR2・要件・srs.yaml・9・地図の面・plain null・eng 地図は 4 面とする。LED2 は bead 3 本の配列で、q-1 は task・open・labels は intake:question・description は「概要 = やさしい説明」・notes は LED の q-1 と同じ字、t-2 は task・open・labels は空・description は「技術 = 技術だけの行」、x-3 は task・open・labels は空・description は「第 8 波。」・acceptance_criteria は LED の t-2 と同じ字。EV2 は JSON の object の 1 行（kind RunCreated・run x-3-20260928T010000Z）。G2 の節点は FR1・FR2・q-1・裁定の節点 q-1:20260928T0100Z-1・受けの節点 r-1・方針の節点 p-1・t-2・x-3・走行の節点 x-3-20260928T010000Z の 9 つで、概要の在るのは FR1（plain）・FR2（eng）・q-1（plain）・t-2（eng）。done (6) で足す節点は、種類 NoteRow の id surface-wave6#c-summary-wire と、種類 Policy の id policy:20260928T0100Z-1 の 2 つ（どちらも file と digest と 3 つの欄は無し）。
      fixture の値（workspace の根の tests/fixtures/surface/question-2.json・読むだけで書かない・確かめた）。bd の一覧の形の JSON の配列で bead 3 本。fx-ask.3 は issue_type task・status open・labels は intake:question と A-1:scope・description は字「前置きの字」と改行と「概要 = 画面の色を 2 つに減らしてよいか」と改行と「技術 = style.css の変数を 5 から 2 へ」と改行と「理由 = 見分けの負担を減らす」と改行と「推奨 = 減らす」と改行と「概要 = 2 行目の概要（取らない）」をつないだ字・notes は「見本の notes の 1 行」。fx-ask.2 は task・in_progress・labels は intake:question・description は「定型の無い本文」・notes なし。fx-ask.1 は task・closed・labels は intake:question・description は「概要 = 閉じた問いの概要」・notes は「裁定 id = fx-ask.1:20260924T0200Z-1・問い = fx-ask.1・逐語 = はい」。中核の question の list の card は fx-ask.2 と fx-ask.3 の 2 つ（閉じた fx-ask.1 は出さない）。
      測り方。新しい歯は中核の crate の tests/csled.rs に置き、名を csled_ で始める。名は done に書いた csled_typed_lines_on_beads・csled_same_as_cards・csled_later_steps_keep_fields・csled_floor_shape_and_pure・csled_floor_names_one・csled_floor_rules・csled_own_names_clean。fixture は workspace の根（CARGO_MANIFEST_DIR の 2 つ上）から読み、check.rs と build.rs の字は CARGO_MANIFEST_DIR の src/graph の下から読む。done (3) の近傍は tsuzuri_core の graph の around（graph の mod.rs の pub use・引数は &Graph と中心の id の &str と段の u8 と契約の型の graph の Fold・返りは AroundDoc の Option・段 1 は範囲 1 から 3 の内）で、列 0 の行は AroundDoc の rows のうち欄 col が 0 の行（欄 node は g の節点の clone）。done (6) の節点の足し替えと欄の書き替えは、G2 の clone の nodes を歯の中で変える。done (5) と (6) の add_summary の返りは真であることも見る。done (4) の SUMMARY_KINDS は、NodeKind の ALL の先頭の 11 に Epic・Task・Memo・Question をつないだ列と比べる。
      filter の語（着地済みの行と第 3 波から第 8 波の行の verify の語・この行の接頭辞 csled_ は並べない・106 語）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・qgate_・hcard_・ntime_・ptitle_・ncard_・hsym_・smore_・lcard_・aaround_・hruling_・sxaxis_・plimit_・bport_・fstop_・nsum_・nsumw_・fmark_・fserve_・cadopt_・tipx_・hcsess_・hcproj_・sesplit_・mstore_・athr_・qblock_・wsteady_・gsum_・nstall_・pfold_・uword_・cround_・cgdom_・lhome_・shb_・ghb_・nact_・aord_・mtree_ で、新しい歯の名から先頭の csled_ を除いた字は、このどれも部分の字として含まない（例 csled_question_cards・csled_graph_nodes・csled_stage_line は不可）。契約の file（main d927a57・第 7 波のノート surface-wave7 の導出物を含む）の verify の行の filter の語（server_read_ など長い語を含む 121 の字）は、どれもこの列の語のどれかを部分の字として含む（その contracts で確かめた）。
      依存。depends は空（着地済みの行 c-summary-design〔t3-hub.52.25・main bf21e14〕の GraphNode の 3 つの欄と add_summary を使い、c-summary-wire〔t3-hub.52.26・main 2bc9aa0〕の配線に載る・main で確かめた）。計画 surface-plan v0.8 の 5 節の core/graph/build.rs の順は c-summary-design → c-summary-ledger → c-dn-rows → c-updated で、この行は c-dn-rows の作る物を使わない。core/graph/check.rs の順は席の決めで c-summary-ledger → c-g3g7 → c-g9（後の 2 行は待ち・計画の 4 節と 5 節に check.rs を足すのは席）。第 7 波（main のノート surface-wave7 の 9 行）と第 8 波のほかの行で build.rs・check.rs・nsum.rs を書く行は無い（確かめた）。外の依存は足さず Cargo.toml は触らない（中核は serde と serde_json と契約の型の crate を直に持ち、歯も使える）。
  - n: 6
    type: prose
    title: 行 g-ledger-home — HOME の台帳の一覧に閉じた bead を出さない
    body: |
      なぜ。持ち主は project board の HOME の block「台帳」の下に、閉じた bead まで台帳の全部が並ぶことを指摘した（2026-09-28・逐語の抜きは問いの本文）。見本 mock v3（判断の記録 ADR-7 の承認で確定した仕様・repo の写しは docs/design/mock3）の台帳の block（index.html の ledgerBlock）は、上段の 4 数・burndown・memo の段・未反映の畳み・epic の畳み・詳しくだけで、bead の一覧を持たない（確かめた）。本番の block（src/project/ledger.rs）は、配置の表 LAYOUT の最後の段 Tier の List で、台帳の全部の bead（閉じた物も）を epic の組ごとに並べる（便 g-min と g-frame の一覧の名残り）。持ち主の裁定 t3-hub.52.31（裁定 id = t3-hub.52.31:20260928T0105Z-1・逐語は台帳の問いの notes）は、推奨の案（一覧の段を消す）も畳みの案も取らず、一覧は残してよいが閉じた物は表示しない、閉じた物も含む全件は地図の方に出す機能を持たせる、open の bead や epic は HOME ですぐ見られる方が全体像をつかみやすい、と決めた。見本との差（一覧の段を残すこと）はこの裁定による。この行は、一覧の段に閉じた bead の行を出さない（畳みに入れるのでなく出さない）。
      この行が持たないもの。閉じた bead を含む全件の見方は、地図に設計と台帳の 2 つの木の全体図を足す後の行 g-map-tree が持つ（持ち主の裁定 t3-hub.52.32（裁定 id = t3-hub.52.32:20260928T0107Z-1）・閉じた項目は既定で畳む）。この行はその行を待たず、depends に書かない（今も地図の圧縮の面の beads の帯は状態で節点を落とさず、閉じた bead の札も出す・mapview の compact.rs は状態で絞らない・確かめた）。指標の段（上段の 4 数・主な指標の行・burndown の閉じた数の棒・memo の段・詳しくの epic の進みの棒の閉じた数と全体の数・未反映の数と一覧）は口 /api/metrics と /api/unreflected の電文から組み、一覧の中身の関数 body を読まないので、閉じた bead の数をこれまでどおり数えて出す（この行は変えない）。block の見出しの件数の chip（関数 count）も閉じた bead を数えたまま変えない（見出しの数は台帳の件数で、一覧に出す行の数ではない）。問いの頁の block ask と、account board の台帳の表は変えない。
      在りか（面・main 2bc9aa0 で確かめ、main d927a57 で確かめ直した・ledger.rs は着地済みの行 g-ledger-card〔t3-hub.52.22・main 20601db〕の後に変わっていない・view.rs と kit.rs は行 g-title〔main d348cc6〕の後に変わっていない）。src/project/ledger.rs は build.rs が生成する pub mod で crate::project::ledger の path で使え、wasm の target のときだけの pub fn view と file の終わりの mod dom のほかは host でも組む。host の部分は BLOCK（id ledger・見出しの鍵 ledger_block・class panel）・PATH（/api/ledger）・METRICS_PATH・UNREF_PATH・PATHS・FOLDS（ledger:more と ledger:unref の 2 つ）・EMPTY（字「台帳に bead は無い」）・OUTSIDE（字「epic の外」）・NONE・pub struct Group（pub な欄 head の Item の Option と children の Item の Vec・derive は Debug・Clone・PartialEq・Eq・epic の外の組は head が None）・Part と Tier と LAYOUT（7 段・最後の段は Tier の List に項 Part の List の 1 つ）と layout・指標の型と関数（Metrics・content・panel・stats・metrics・burn_card ほか）・pub fn count（&Screen を受け Reading の usize・台帳が読めれば、組ごとの下の行の数と epic の頭の 1 の和）・pub fn body（&Screen を受け Body の Group の Vec）・未反映の一覧の定数と関数。body は今、画面の台帳が読めなければ Body の Unmeasured の LEDGER_UNREAD、読めて組が 0 なら Empty の EMPTY、ほかは Filled で、画面の台帳の一覧の組ごとに head を epic の行の item、children を下の行の全部の item にする（閉じた行も）。ledger.rs の頭の use は、契約の型の board の LedgerJudge と Reading・stats の型・wire と、super（crate::project）の Body・Item・LEDGER_UNREAD・NO_CONTENT・NOT_READ・item と、crate::view の Fetched・Screen・clock ほかで、契約の型の ledger の LedgerRow は今は use していない。
      在りか（画面の状態・src/view.rs・この行は書かない）。pub struct Screen（欄 board の Reading の Board と updated_at）・pub struct Board（欄 questions と groups の EpicGroup の Vec）・pub struct EpicGroup（欄 epic の LedgerRow の Option と children の LedgerRow の Vec）・Screen の pub fn initial（board は Unknown）と pub fn after_read（Fetched の参照と時刻を受け、口の本文の LedgerList の rows が Known なら board を Known の pub fn board の値にする）・pub fn ledger_groups（LedgerRow の slice を受け EpicGroup の Vec）。ledger_groups は、種類が epic の行を id の順（pub fn id_order・点で区切った段ごとに数なら数の大小）に組の頭にし、種類が epic でも question でもない行を、id の階層（a.1 の親は a）でいちばん近い epic の祖先の組の下に置き、下の行を task・memo・ほかの種類の順と id の順に並べ、epic の祖先の無い行を最後の組（epic が None）に入れ、その組は行が在るときだけ足す。ledger.rs の私的な関数 epic_title（詳しくの epic の進みの棒の題を引く）は Screen の board の groups を読み、body を読まないので、閉じた epic の棒の題も今のまま引ける。
      在りか（一覧の 1 項・src/kit.rs・project の mod.rs が glob で再公開・この行は書かない）。pub struct Item（pub な欄 shape・alert・id・title・aside）と pub fn item（契約の &LedgerRow を受け Item・状態が open か in_progress なら印の class に fill を付けず、ほかは付ける・aside は状態の印と語と種類）と pub const LEDGER_UNREAD。
      電文（契約の型の crate の src/ledger.rs・この行は書かない）。pub struct LedgerRow（pub な欄 id の BeadId・kind・title・status の String・updated_at の EpochSecs〔u64〕・parent の BeadId の Option・labels の String の Vec・derive は Debug・Clone・PartialEq・Eq と serde）と pub struct LedgerList（欄 rows の Reading の LedgerRow の Vec）。状態の字は bd の語のまま（面の project の legend の BD_STATUSES は open・in_progress・blocked・deferred・closed の 5 つ）で、bd が消した bead（状態 tombstone）は境界の server の台帳の読み（src/server/ledger.rs）が電文に入れる前に落とす（確かめた）。
      DOM（wasm の target のときだけの mod dom・この行は書かない）。view は、指標の電文が読めれば LAYOUT の段を順に tier_view で描き、読めなければ段 Top の箱と測れていないの 1 行と段 List の list_view を描く（段 List の腕の字は Tier::List => list_view(screen)）。list_view は screen.with(body) の値を、Filled なら組ごとに group_view で class items の ul に描く（字 map(group_view)）。group_view は head が在れば item_view、無ければ OUTSIDE の字の行を描き、その後に class nest の li の中の ul に下の項を描く（下の項が 0 でも ul は描く）。block の見出しの件数の chip は view の extra が screen.with(count) の Known の数を出す。details の要素と記録の関数の呼びは段 More と段 Unref の 2 つだけ。
      形（host の部分・ledger.rs）。pub const CLOSED（&str・字 closed・一覧に出さない状態の字）と pub const NO_OPEN（&str・字「閉じていない bead は無い」・残る組が 0 のときの 0 件の 1 行）と pub fn listed（契約の型の ledger の &LedgerRow を受け bool・行の欄 status が CLOSED と同じ字なら偽、ほかは真）を足す。body は、画面の台帳が読めない（Unmeasured の LEDGER_UNREAD）と、読めて組が 0（Empty の EMPTY）の 2 つは今のまま。組が在れば、組ごとに下の行のうち listed が真の行だけを item にし（順は今のまま）、epic の組は、epic の行が listed で真か、残る下の項が 1 つ以上在るときだけ残し、頭を今と同じく epic の行の item にする。閉じた epic の下に閉じていない項が在るとき、その項を今の組に置いたまま出すため、閉じた epic の頭の行はそのときだけ残る（item の印の塗りと aside の閉じたの語で、閉じた epic と分かる）。epic の外の組は、残る下の項が 1 つ以上在るときだけ残す。組の順は今のまま。残る組が 0 なら Empty の NO_OPEN を返す（台帳に行が無いときの EMPTY と分ける・要件 NFR2 の 0 件と測れていないの区別は今のまま）。count と epic_title と指標の関数と、Group の型と、body と count の引数と返りは変えない。ledger.rs の頭の use に契約の型の ledger の LedgerRow を足す。足す定数と関数は、wasm の target のときだけの属性の行と pub fn view の宣言の行の間に置かず、mod dom より前の host の部分に置く。足す字（doc と注を含む）に、字 mod dom と空白と開き波括弧の並び・記録の関数の名 fold と開き丸括弧の並び・字 <details・字 pub fn view() を書かない（着地済みの歯 lcard_dom_wiring と urpanel_src_fold_and_read は字 mod dom { の最初の所から後を読み、steady_details_use_fold_record は file の全部の fold と開き丸括弧の並びと <details の数を数え、urpanel_src_fold_and_read は字 pub fn view() の最初の所の位置を見る）。module の頭の注の一覧の段の文は、閉じた bead を出さない形に直してよい（字の歯は無い）。
