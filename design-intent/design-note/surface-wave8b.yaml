  - n: 7
    type: prose
    title: 行 h-acct-order — account board の口座の自然な順と退役の口座の隠し
    body: |
      なぜ。持ち主の指摘（2026-09-28・HOME の口座ごとの残りの表を口座の名の普通の順にし、退役の口座は外してほしい）を行にする前に、どの表に効かせるかを問うた。持ち主の裁定 t3-hub.53.14（裁定 id = t3-hub.53.14:20260928T0107Z-1・束 batch:20260928T0107Z-1・案 A）は、account board の全部の表（HOME の口座 × 窓・口座の一覧・群の候補など）で口座を名の自然な順（名の末尾の数を数として比べ、数が 2 の口座は 10 の口座より前）に並べ、退役の口座は出さない（出すのは移動の履歴のように過去を示す所だけ）と決めた。要件 FR12 は、群が今の口座 1 つと候補の集合を持ち、器の値を写して出すと言い、口座の並びは決めない。見本 mock v3（判断の記録 ADR-7 の承認で確定・repo の写しは docs/design/mock3）は退役の口座を印つきで出す。account/index.html の口座 × 窓の arows は電文の口座の宣言の順（B.accounts）で並べ、退役の口座の行の窓の欄に語 retired と退役の時刻を出し、session の表の口座の並べ（関数 sessRow を呼ぶ枝の SORT が account）も同じ宣言の順で見出しを置き、acct.js の rankAt は群の候補を、門を通る候補（残りの多い順）の後に門で落ちる候補（宣言の順）を置く順に並べ、退役の候補に落ちた理由の字 退役 を付ける。裁定はこの見本を変える決めで（問いの理由に、承認済みの見本は退役の口座を印つきで出すと書いた）、この行では裁定が見本に勝つ。本番の電文 AccountDoc の accounts は器の宣言の順で届き、面はその順で並べ、HOME の口座 × 窓の表は退役の口座の行の窓の欄に語 retired を出す（main で確かめた）。
      在りか（main d927a57 で確かめた・起草の base の 2bc9aa0 の後に着地した第 7 波のうち、c-acct-thr〔t3-hub.53.17・main c36fcc7〕が契約の account.rs と fixture に閾値と知らせの欄を足し、h-cards-proj〔t3-hub.53.15・main 550176b〕が account の projects.rs に card を足し、g-mode-store〔t3-hub.52.36・main 8f61c3a〕が account の board.rs を書いた・この行が書く mod.rs と tests/accthome.rs と、置き場だけの home.rs と mapview の mod.rs は変わっていない）。契約の型（この行は書かない）: pub struct AccountDoc（derive は Debug・Clone・PartialEq・Serialize・Deserialize・pub な欄はこの順に at・accounts の Reading の AccountRow の Vec・caps の WindowCap の Vec〔窓ごとの閾値・口座の名を持たない〕・groups の Reading の GroupCard の Vec・moves の Reading の MoveRow の Vec・notices の Reading の GroupNotice の Vec〔群の逼迫の知らせと移動の断りの行・器の event の写し・変種 Pressure と Refused はどちらも欄 account の String を持つ〕・projects・sessions・dormant）、pub struct AccountRow（pub な欄 label の String・retired の bool・occupant・model・usage）、pub struct GroupCard（pub な欄 row の board の GroupRow・since・previous・recorded・members・refused）、GroupRow（pub な欄 group と account の String・candidates の String の Vec・next_account・remaining・注釈は候補は集合）、MoveRow（at・group・from の String の Option・to）。Reading は Known に値を持つか Unknown。面の src/account/mod.rs（write-set・crate::account・host でも組む）の host の部分は、pub mod heartbeat・home・ledger・projects・session・windows と wasm の target のときだけの pub mod board、pub use の PATH（契約の account の PATH・字 /api/account）、selects・Tab・tab_href・tab_url・HeaderPart・TOP・BADGE・HEADER・BRAND・page_title・UPDATED_KEY・UPDATED_CLASS・TabLink・tab_links・Row・TabPage・HGRID・page・pages・UNREAD・BAD_BODY、pub fn doc（Fetched の参照を受け、Result の AccountDoc と &'static str の理由を返す・NotRead に project の NOT_READ・Failed に UNREAD・AccountDoc として読めない本文に BAD_BODY・本文は wire の decode で読む）、pub fn pending・need_count・stuck_count・NEED_MARK・badge・snapshot と、wasm の target のときだけの mod dom（section_view と fold_view・どちらも口を crate::net::read(PATH) で読む）。面の src の中で電文 AccountDoc を読む所は mod.rs の doc の 1 つだけで（字 decode::<AccountDoc> は src に 1 度・grep で確かめた）、account の block はどれも doc を通して電文を受ける: home の pub fn content（super::doc の値を pub fn home に渡す）と、session と ledger と projects の pub fn content（どれも super::doc の値を table に渡す）と、wasm の target のときだけの account の board の App（header の数の印の Memo を fetched.with(doc) で組む）と home と windows の mod dom（doc で project の行を引く）。面の src/mapview/mod.rs（置き場だけの =・crate::mapview・host でも組む・lib.rs の pub mod mapview は target の cfg で囲まない）の pub fn natural（2 つの &str を受け std の Ordering を返す）は、字を前から比べ、両方が数字の並びに当たるとその並びを頭の 0 を除いた桁の数、次に字の順で比べ、ほかは字で比べ、最後まで同じなら字の順で決める（着地済みの歯 mapview_natural_order が ADR-2 は ADR-10 より前・FR14 は FR2 より後・x01 は x1 より前ほかを見る・地図の圧縮と一覧の面が id の並べに使う）。面の src/account/home.rs（置き場だけの =・この行は書かない）の pub fn home（AccountDoc の参照を受け Home）は accounts の行を電文の順に pub fn acct_row で口座 × 窓の行（pub struct AcctRow・欄 label・occupant・cells・card）にし、retired が真の行は occupant を Occupant の Retired・cells を Cells の Retired にし、groups の GroupCard ごとに pub fn group_view で群の枠（pub struct GroupView・欄 candidates は row の candidates の写し・今の口座の窓の使った割合は accounts から今の口座の label の行を引く）を組み、group_more の doctor の行は candidates を字 , でつなぐ。moves は電文の順のまま pub fn moves で初めの 8 行と畳む残りにする（pub struct Moves・欄 shown と folded は MvRow の Vec・MvRow の欄 from は String）。pub fn content（Fetched の参照を受け Home）は super::doc の値を home に渡す。session の表（src/account/session.rs・この行は書かない）の Sort の Account の並べは、private の fn account_heads が電文の accounts の順の口座を見出しにし、accounts に無い口座の行はその後に行の順で見出しを足し（占有は測れていない）、行の無い見出しは table が出さない（pub enum Head の変種 Account は欄 label と occupant・pub struct Group は欄 head と rows・pub struct Table は欄 groups ほか・pub fn content は Fetched の参照と Sort を受け kit の Body の Table）。projects と ledger の表は口座を並べない（projects の口座の欄は席の口座の値で、着地済みの h-cards-proj の群の見出しの card の pub fn grp_card は群の candidates の数を字にするだけ・この行の後は退役の名を除いた数になる）。各 project の行の席（ProjectRow の欄 seat の SeatCard）の欄 group の候補の列は、account board のどの表も出さないので触らない（確かめた）。
      fixture の値（workspace の根の tests/fixtures/account/acct-doc.json・この行は触らない・確かめた）。accounts は Known の 3 行で、acct-1（retired 偽・occupant Tier1）・acct-2（retired 偽・occupant Tier2）・acct-3（retired 真・occupant null・usage unknown）の順。groups は Known の 2 つで、Tier1（account acct-1・candidates は acct-1 と acct-2・next_account acct-2）と Tier2（account acct-2・candidates は acct-2・refused の字 acct-3:retired）。moves は Known の 2 行で、1 行目は group Tier1・from acct-2・to acct-1。sessions は 4 行で、account は順に acct-1・acct-1・acct-1・null。着地済みの行 c-acct-thr（main c36fcc7）はこの fixture に欄 caps（3 行）と notices（Known の 2 行・Tier2 の acct-2 の断りと Tier1 の acct-2 の逼迫の知らせ）を足し、accounts と groups と moves と sessions の値は変えていない（main で確かめた・契約の歯 acctdoc_fixture_roundtrip が数を見る）。
      形。mod.rs の host の部分に pub fn arrange（AccountDoc を受け AccountDoc を返す）を置き、受けた値の accounts と groups の中だけを書き替えて返す（AccountDoc と AccountRow と GroupCard を struct の字で組まない・着地済みの c-acct-thr が AccountDoc に足した欄 caps と notices は受けた値のまま通す）。accounts が Known なら、retired が真の行を除き、残りを label を mapview の natural で比べた順に並べる（並べは安定で、natural は同じ字でだけ Equal を返す）。groups が Known なら、どの GroupCard の row の candidates も、accounts が Known のときは retired が真の行の label と同じ名を除き（accounts に無い名は残す）、natural の順に並べる。accounts が Unknown なら退役か分からないので除かずに並べるだけにする。pub fn doc は、本文を wire の decode で AccountDoc に読めたとき、その値を arrange に通して返す（理由の 3 つと読みの決めは変えず、doc の中の字 decode::<AccountDoc> は今のまま 1 つ残す）。関数の中の書き方（sort_by か sort_by の key か・retain か filter か）は問わない。電文を読む所が doc の 1 つなので、HOME の 4 つの block・session と台帳と各 project の表・header の数の印・開いている窓の block は、どれもこの 1 か所で並べ直した電文を受ける。
      どこに効くか。HOME の口座 × 窓の表は自然な順で、退役の口座の行は出ない。群の枠の候補の並び（ul の cands2）と詳しくの doctor の行の字 accounts= の後の列は自然な順で、退役の名を持たない。session の表の口座の並べの見出しは自然な順になる（accounts に無い口座の見出しは今のとおり後ろに行の順で足す）。移動の block の行（過去の記録）は電文の順と字のまま、退役の口座の名も出す。知らせと断りの行（電文の notices・器の event の写しで過去の記録）も受けた値のまま通し、欄 account の口座の名を書き替えない（今は面のどの block もまだ描かない・描くのは後の行 h-thr-home）。口座を値として持つ欄（群の今の口座と前の口座と次の移り先・session の行の口座・各 project の表の席の口座・移動の from と to）は、別の物（群・session・席・記録）の今か過去の事実なので書き替えない。器の門は退役の口座を移り先にしないので、退役の口座が群の今の口座や session の口座に在ることは器の宣言の上では起きない。在れば、その群の枠の窓の使った割合は、口座の行が除かれているので字 ― になる（home の group_view の今の決まり・書き替えない）。
      作法 7 との合い方。面は並べと隠しの材料に電文の欄だけを使う（口座の名の label と、退役の真偽の retired）。退役は器が決めて電文が運ぶ値で、面は判じない（着地済みの home の acct_row も同じ retired の値で行の出し方を分けている）。自然な順は数や状態を作らず、並べの順を決めるだけで、面の既存の関数 natural を使う。面が出す数と字は電文の欄のまま（表の行を減らすだけで、新しい数を出さない）。よって作法 7（面に判定を書かせない）に合う。電文と中核と境界は変えない。
      出さない物。退役の口座を出し直す切り替えと、退役の数の印は作らない。home.rs の退役の行の出し方（Occupant の Retired と Cells の Retired と card の語 retired）は、home を退役の行を持つ電文で直に呼ぶ純粋な関数の決まりとして残す（着地済みの歯 accthome_accounts_on_fixture と accthome_accounts_rules と hcard_ の歯がその値を見る）。board の読みの道はどれも doc を通るので、画面には出なくなる。project board の席の block（口 /api/seat の電文 SeatCard）は account board でないので変えない。
      着地済みの歯（直すもの・tests/accthome.rs）。accthome_unmeasured_per_block は、fixture の本文を home の content に渡した値が fixture を decode して home の home に渡した値と等しいことを見る（字 assert_eq!(content(&Fetched::Body(fixture_text())), fixture_home()) の 1 行）。content は doc を通るので、fixture の退役の acct-3 の行が消え、この比べが落ちる。右辺を home::home(&account::arrange(fixture())) に替える（account は file の頭の use に tsuzuri_surface の account の self として在る）。ほかの行と、ほかの accthome_ の歯は変えない。
      着地済みの歯（直さずに通る・write-set の外・tests の下の全部を grep で確かめた）。accthome_ のほかの歯と hcard_ の歯（tests/hcard.rs）と sxaxis_ と ticker_ と bport_ と accthb_ と lspark_（tests/ledspark.rs）と pmore_（tests/projmore.rs）の歯は、fixture を wire の decode で直に読んで home や acct_card ほかに渡し、doc を通らない（退役の acct-3 の行の値は今のまま見える）。着地済みの h-cards-proj の hcproj_（tests/hcproj.rs）の歯も fixture を decode して projects の関数に直に渡し、doc を通らない（fixture の群の候補は退役の名を持たないので grp_card の候補の数も変わらない）。acctwin_ の歯は windows の body に fixture の本文を渡すが、body は account の pending を返すだけで、doc が Ok なら中身はまだ無いの理由になり、arrange を通しても同じ。acctsess_unmeasured_until_read は fixture の本文を session の content に Sort の Account と渡した表が、decode した fixture の table と等しいことを見る。違いは accounts の acct-3 だけで、acct-3 の口座の session の行は無く、行の無い見出しは table が出さないので、2 つの表は同じ。acctproj_content_reads_the_doc は projects の content の表の sort と行の順（0・2・1）と測れていないの理由を見る（projects の表は accounts と candidates を使わない）。acctled_ の歯の ledger の content と table の比べは projects の台帳だけを使う（変わらない）。acctframe_blocks_unmeasured_until_read は doc の fixture の値が Ok であることと理由の 4 つを、acctframe_blocks_per_tab_and_module は mod.rs の字 mod dom { より前に字 view! が無いこと（この行は host の関数だけを足す）を、acctframe_path_from_contract_and_no_storage と acctwin_no_storage_and_wasm_wiring は src/account の下の file に字 /api/ と localStorage と sessionStorage と cookie が無いことを見る（足さない）。acctframe_badges_ の歯は decode した fixture の badge を見る（badge は projects と sessions だけを使う）。acctframe_snapshot_matches_file は枠の値の字を見る（変えない）。mapview_natural_order は natural の値を見る（この行は mapview を書かない）。frame_classes_are_in_stylesheet と frame_no_heading_words_in_code と parts_ の歯は src の全部を歩く（この行は class と日本語の literal と /api/ の字を足さない）。契約の acctdoc_ の歯と中核の acctcore_ と acctpcore_ の歯は面を読まない。
      測り方。新しい歯は tests/aord.rs に置き、名を aord_ で始める。歯は fixture の字を CARGO_MANIFEST_DIR から ../../tests/fixtures/account/acct-doc.json として読み、wire の decode で AccountDoc にする。電文 D は decode した値の写しの accounts の Known の列を、acct-1 の行の写しの label を acct-10 に替えた行・acct-3 の行・acct-2 の行・acct-1 の行の順の列に置き替え、groups の Known の 1 つ目（Tier1）の row の candidates を acct-10・acct-3・acct-2・acct-9 の列にし、moves の Known の 1 行目の from を acct-3 にして作る（型を struct の字で組まず、decode した値の写しの欄に代入する）。期待の値も D の写しの欄に代入して作り、arrange の値と assert_eq で比べる（AccountDoc の PartialEq で全部の欄を比べる）。doc と home の content と session の content には、D と、D の sessions の account を替えた写しを wire の encode で字にした Body を渡す。aord_one_place は CARGO_MANIFEST_DIR から src の下の全部の .rs を歩いて字を読み（着地済みの frame_ の歯の sources と同じ歩き方）、done (4) を見る。自分の名の歯は tests/aord.rs の字を読み、test の属性の行の次の fn の名を全部集め、名の数が 5 以上であることと done (7) を見る。fixture は足さない。
      filter の語（着地済みの行と第 3 波から第 8 波の行の verify の語・この行の接頭辞 aord_ は並べない・106 語）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・qgate_・nsum_・hcard_・ntime_・ptitle_・ncard_・hsym_・smore_・lcard_・aaround_・hruling_・sxaxis_・plimit_・bport_・fstop_・nsumw_・fmark_・fserve_・cadopt_・tipx_・hcsess_・hcproj_・sesplit_・mstore_・athr_・qblock_・wsteady_・gsum_・nstall_・pfold_・uword_・cround_・cgdom_・csled_・lhome_・shb_・ghb_・nact_・mtree_ で、新しい歯の名から先頭の aord_ を除いた字は、このどれも部分の字として含まない（例 aord_accthome_x・aord_account_x・aord_mapview_x・aord_frame_x は不可）。名は done に書いた aord_arrange_rules・aord_doc_reads_arranged・aord_blocks_follow・aord_one_place・aord_names_stay_apart（どの語も含まない）。
      依存は足さない。depends は空。書く file は 1 か所の関数を置く src/account/mod.rs と、期待を直す tests/accthome.rs と新しい tests/aord.rs だけで、第 7 波の行の write-set（main のノート surface-wave7 の 9 行・h-cards-proj の account の projects.rs・h-cards-sess の session.rs・g-mode-store の account の board.rs と surface の board.rs ほか・c-acct-thr の契約と中核と境界と fixture・e-watch-steady の境界の events.rs と歯）とも、第 8 波のほかの行の write-set とも重ならない（確かめた）。着地済みの c-acct-thr が AccountDoc に足した欄は、arrange が struct の字で組まず、歯が電文の全部を PartialEq で比べるので、そのまま通る。着地済みの h-cards-proj の card と、まだ着地していない h-cards-sess（session.rs の行に run と project と席の card を足す行）の card は、doc を通した電文を受けるが、どちらも電文の accounts と退役の真偽と群の candidates の並びを読まない（h-cards-proj の grp_card が candidates の数を読むだけ・h-cards-sess の card はその行の節で確かめた）ので、h-cards-sess がこの行の前に着いても後に着いても acctsess_unmeasured_until_read と aord_blocks_follow と hcsess_ の歯は通る。同じ波の c-next-stall は tests/acctsess.rs の別の歯 acctsess_vocab_style_and_deps の期待を直すだけで、この行が拠る acctsess_unmeasured_until_read を変えない。同じ波の g-map-tree は mapview の mod.rs に木の module の宣言を足すが natural は変えない（その行の起草で確かめた）ので、置き場だけの = のこの行とどちらが先に着いても通る。tests/accthome.rs は計画 v0.8 の 5 節の歯 accthome の列（h-acct-order → g-jst → h-thr-home → h-cards-nx → h-acct-spark）の頭に在り、後の行と同じ時に流さない。計画の 4 節はこの行の file を account の home.rs と session.rs（見込み）としたが、電文を読む所が account の mod.rs の doc の 1 つなので、この行は mod.rs だけを書き、home.rs と session.rs は書かない（5 節の session.rs の列の h-acct-order〔書くとき〕は当たらない）。Cargo.toml・vocab.json・style.css・fixture・home.rs・session.rs・mapview の mod.rs は触らない。
