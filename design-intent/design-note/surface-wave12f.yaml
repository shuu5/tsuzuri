  - n: 3
    type: prose
    title: 行 e-marks — 台帳の印を store の manifest の中身と journal の長さにし、印の動かない読み直しを 60 秒にする
    body: |
      在りかの main は 43e8ba4（変化の見張りを書いた行 e-watch-steady〔418b673〕と、ledger.rs を書いた行 e-hold〔076666a〕は着地済みで、この節の字はその後の code の値・bac6854 の後の commit の code の書きは tests/fstop.rs と束の受付〔src/server/batch.rs・routes/batch.rs・tests/bhalf.rs・tests/server_batch.rs〕と契約の型と面の crate だけで、3 行の書く file と = の file に触れていない）。
      なぜ。bd は --readonly の読みでも台帳の store の .beads/embeddeddolt/<db>/.dolt/noms/LOCK に排他の錠（flock）を取る。面の server は、変化の見張り（Hub）の 5 秒ごとの読み直しと、印が動いた時の読みと、台帳を読む GET の口ごとに、bd の読み（bd --readonly list --all --limit 0 --json）を続けて撃つ。器の席の 2026-09-28 の測りでは、器の台帳の錠は 15 秒の間の 209 回の見本の 209 回で取られていて、器の台帳の門の読みが時間切れ（ledger-timeout）になった（門の 1 回の読みが錠を 2.4 秒待った・門の上限は 6 秒）。今の印の .beads の issues.jsonl と interactions.jsonl は、器の着地の close が素の bd close で jsonl の書き出しを飛ばすので動かないことがあり、それが印の動かない 5 秒ごとの読み直しの理由。席はつなぎとして、ほかの project の読むだけの board を止めた。直しは 3 行（同じノート・この順に流す）＝e-marks（印を読みでは動かない store の値にし、印の動かない読み直しを 60 秒の安全の網にする）・e-snap（GET の口は bd を撃たず見張りの読みの字を返す）・e-idle（SSE の受け手が 0 人の間は印の動かない読み直しをせず、受け手が付いた周で 1 回読む）。拠りは席の決め（計画 surface-plan の 3 節・欠陥の直しなので持ち主の問いを置かない）と、計画の行 e-snap と e-idle が拠る持ち主の重いという指摘（t3-hub.1 の user 2026-09-28T00:4xZ・00:59Z・01:06Z）。要件 NFR2（器の event と台帳の変化は 5 秒以内に面へ届き、合図の無いときは周期の読みで 1.5 秒以内）と規則の行 R-21。
      実物の形（2026-09-28 に席が測った・名は書かない）。この repo の台帳の store は .beads/embeddeddolt の下の db の dir 1 つ（名は台帳の prefix）で、その .dolt/noms の下に manifest（148 byte・字は版と形式と lock と根の hash と gc の世代と table の名と chunk の数をコロンでつないだ 1 行で、table の名は journal の本体の名）・journal の本体（名は字 v を 32 字・dolt の chunk journal の定まった名・34574035 byte）・journal.idx（journal の索引）・LOCK（0 byte）と、名が nbs_manifest_ で始まる書き替えの途中の file が在る。台帳の写し（scratchpad）に bd --readonly list --all --limit 0 --json を 1 本撃つたびに、manifest は同じ中身のまま別の file から置き替わり（inode が替わる）、journal の本体と journal.idx は長さを変えずに更新時刻だけが動いた（器の席の測りの、読みでは動かない、は更新時刻では成り立たない）。実物の台帳を stat と md5 だけで 90 秒見た（0.2 秒ごと・その間の書きは 0 回・面の server の読みは続いていた）ところ、変わった回は 277 回で、更新時刻は毎秒動き、journal.idx の長さは 1131390 と 1137955 を行き来し、動かなかったのは journal の本体の長さ（34574035 のまま）と manifest の中身だけだった。journal は追記の file で、書きごとに長さが伸びる（書きの側は器の席の測り・書きごとに manifest と journal が動く・に拠る。写しに bd の書きを撃つのは席の守りが断った）。試作（3 行を入れた server を台帳の写しと本物の bd で 25 秒動かした）では、印を manifest の中身と journal の本体の長さにすると bd の読みは起動の 1 回と受け手が付いた周の 1 回だけで、GET の口 10 本は 0 回だった。印を更新時刻にすると、受け手 0 人でも 15 秒に 8 回読んだ（見張りの読みが自分の印を動かし、次の周でまた読む・読みが続くので錠が取られ続ける）。
      在りか・見張り（src/server/events.rs・write-set・409 行）。crates/tsuzuri-boundary/src/lib.rs の pub mod server; と src/server/mod.rs の pub mod events; と pub mod ledger; で公開の module。pub const POLL（500 ミリ秒）・REREAD（5 秒・doc は印が動かなくても読み直す間隔〔取りこぼしを拾う〕）・KEEPALIVE（15 秒）と、pub struct Timing（derive は Debug と Clone と Copy と PartialEq と Eq・pub な欄は poll と reread の 2 つ）と、pub const TIMING（欄は POLL と REREAD）と、pub fn stamp（&Path を受け、file の更新時刻と長さの組の Option）を持つ。pub struct Hub（derive は Default・私的な欄 subscribers と seq）の pub fn start（Source と板の印の一覧の関数を受け Arc<Hub>）は、本文の Hub::watch(source.marks(), move || source.read(), TIMING) で台帳の見張りを始め、pub fn watch_board で板の印の見張りを始める。pub fn watch（印の file の PathBuf の Vec と、読みの関数 FnMut() -> R〔R は PartialEq と Send と static の寿命〕と、Timing を受け Arc<Hub>）は、最初の印（私的な fn stamps・file ごとの stamp）と最初の読みを戻る前に取り、thread で私的な fn watch を回す。fn watch は poll ごとに、Hub が落ちていれば戻り、印を取り直し、印が前と同じで最後に読んだ時から reread より短ければ次の周へ行き、そうでなければ印を置き替えて読んだ時刻を今にして読み、読みの値が前と同じなら次の周へ、違えば値を置き替えて全員に ledger-changed を送る（私的な struct Watch の欄は marks・seen・read_at・last）。Hub::watch を撃つ所は start の本文と lib の歯 2 本だけ（境界の crate の src と tests を grep で確かめた・acct.rs とほかの module は撃たない）なので、この行の後の本番の code で Hub::watch を撃つ所は無い。#[cfg(test)] の lib の歯は server_src_watch_marks_trigger_reread（Timing の poll 20 ミリ秒・reread 60 秒・印の file 2 つのうち後の file は初めは無い）・server_src_watch_rereads_without_marks（poll 20 ミリ秒・reread 150 ミリ秒）・server_read_watch_board_sends_on_marks・server_min_hub_sends_to_each_subscriber で、Timing を struct の字で組むのは前の 2 本だけ（境界の crate の tests と src を grep で確かめた）。server_src_watch_marks_trigger_reread の今の手順と値は、watch の後に subscribe し、読みは最初の 1 回、読みの中身を替えて 200 ミリ秒の後も 1 回で知らせ無し、後の印の file を作ると知らせ 1 件で 2 回（その後 200 ミリ秒は 2 件目無し）、前の印の file の長さを替えると 5 秒以内に 3 回で、その後 200 ミリ秒は 3 回のまま知らせ無し。
      在りか・台帳の読み（src/server/ledger.rs・write-set・307 行）。pub struct Source（derive は Debug と Clone・pub な欄 repo〔PathBuf〕と bd〔OsString〕と、私的な欄 shared・last・hold・PartialEq は repo と bd だけを比べる）の pub fn new（repo の impl Into<PathBuf> と bd の impl Into<OsString> を受け Source を返す）と、pub fn marks（&self を受け PathBuf の Vec）は repo の .beads の issues.jsonl と interactions.jsonl の path をこの順に返し、中身は読まない。pub fn read（&self を受け、契約の型の crate の board の Reading<Vec<LedgerRow>> を返す・Reading は腕 Known(T) と Unknown の enum で derive は Debug と Clone と PartialEq・変化の見張りの読み・持ち回さない）は合流の読みで bd を撃ち、読めなければ Unknown。lib の歯は server_src_marks_are_two_files（Source::new の値の marks の 2 つの path を見る・この行は marks を変えない）・server_src_unstartable_bd_is_unknown・server_min_epoch_secs_reads_rfc3339・server_min_parse_refuses_broken_lines の 4 本。module の doc の 5 行目は字 .beads の issues.jsonl は変化の印（更新時刻と長さ）として見るだけで、中身は読まない。src/server/mod.rs の Server::bind_with は Hub::start に Sources の ledger の clone と板の印の関数を渡す（この行は mod.rs を書かない）。
      形（src/server/ledger.rs）。pub const STORE_DIR（&str・字 embeddeddolt・doc は repo の .beads の下の store の dir で、その下が db ごとの dir）・NOMS（&str・字 .dolt/noms）・MANIFEST（&str・字 manifest・中身を印にする）・JOURNAL（&str・字 v を 32 字・doc は dolt の chunk journal の定まった名で、長さを印にする）と、pub enum Mark（done (2) の形・doc は、Store が db ごとの NOMS の path と manifest の中身と journal の長さで、bd の読みは store の file の更新時刻を動かすので更新時刻を見ないこと、Files が store の無いときの marks の 2 file の更新時刻と長さ）を足す。Source に pub fn stores（repo の .beads の下の STORE_DIR の dir を読み、entry ごとに NOMS を足した path のうち、その下の MANIFEST が file のものを path の順に並べる・dir が読めなければ空・db の dir の名は呼ぶたびに dir を読んで決め、字に書かない）と、pub fn mark（stores が空なら Files〔marks の file ごとの events の stamp〕、空でなければ Store〔stores の path ごとに、その path と、MANIFEST の file の byte の全部の Option と、JOURNAL の file の長さの Option〕）を足す。marks と read とほかの fn の字は変えない。module の doc の 5 行目の文を、変化の印は store の manifest の中身と journal の長さで、store が無ければ issues.jsonl と interactions.jsonl の更新時刻と長さ（jsonl の中身は読まない）の旨に書き替える（行 e-marks）。manifest の読みは 148 byte ほどの file を 500 ミリ秒ごとに 1 度読むだけで、錠の file LOCK には触らない（dolt は manifest を別の名の file に書いてから rename で置き替えるので、書きかけは見えない）。
