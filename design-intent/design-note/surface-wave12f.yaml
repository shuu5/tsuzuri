sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      境界の server が台帳の bd を撃つ回を減らし、器の台帳の錠を空ける 3 行。
      台帳の変化の印を、読みでは動かず書きごとに動く store の値（manifest の中身と journal の本体の長さ）にし、印の動かない読み直しを 60 秒の安全の網にする（store が無ければ今の jsonl の印と 5 秒・e-marks）。
      台帳を読む GET の口は bd を撃たず、変化の見張りが最後に終えた読みの字を返す（読みの途中ならその終わりを待つ・落ちたときの持ち回しと頭は今のまま・e-snap）。
      SSE の受け手が 0 人の間は印の動かない読み直しをせず、受け手が付いた周で 1 回読む（e-idle）。
      電文の型と面の crate と外の依存は変えない。
