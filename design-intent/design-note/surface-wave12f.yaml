    type: prose
    title: 行 e-idle — 受け手が 0 人の間は印の動かない読み直しをせず、付いた周で 1 回読む
    body: |
      在りかの main は 43e8ba4（この節の字は、その code に同じノートの前の行 e-marks〔events.rs と ledger.rs〕と e-snap〔ledger.rs と coalesce.rs と mod.rs〕の形を足した値）。
      なぜ。bd は --readonly の読みでも台帳の store の .beads/embeddeddolt/<db>/.dolt/noms/LOCK に排他の錠（flock）を取る。面の server は、変化の見張り（Hub）の 5 秒ごとの読み直しと、印が動いた時の読みと、台帳を読む GET の口ごとに、bd の読み（bd --readonly list --all --limit 0 --json）を続けて撃つ。器の席の 2026-09-28 の測りでは、器の台帳の錠は 15 秒の間の 209 回の見本の 209 回で取られていて、器の台帳の門の読みが時間切れ（ledger-timeout）になった（門の 1 回の読みが錠を 2.4 秒待った・門の上限は 6 秒）。今の印の .beads の issues.jsonl と interactions.jsonl は、器の着地の close が素の bd close で jsonl の書き出しを飛ばすので動かないことがあり、それが印の動かない 5 秒ごとの読み直しの理由。席はつなぎとして、ほかの project の読むだけの board を止めた。直しは 3 行（同じノート・この順に流す）＝e-marks（印を読みでは動かない store の値にし、印の動かない読み直しを 60 秒の安全の網にする）・e-snap（GET の口は bd を撃たず見張りの読みの字を返す）・e-idle（SSE の受け手が 0 人の間は印の動かない読み直しをせず、受け手が付いた周で 1 回読む）。拠りは席の決め（計画 surface-plan の 3 節・欠陥の直しなので持ち主の問いを置かない）と、計画の行 e-snap と e-idle が拠る持ち主の重いという指摘（t3-hub.1 の user 2026-09-28T00:4xZ・00:59Z・01:06Z）。要件 NFR2（器の event と台帳の変化は 5 秒以内に面へ届き、合図の無いときは周期の読みで 1.5 秒以内）と規則の行 R-21。 この行は、誰も見ていない board の server の読み直しを止める（ほかの project の読むだけの board の server は持ち主が頁を開いていない間も動く）。受け手 0 人の間も GET の口は見張りの字を返す（行 e-snap）ので、印は見続けて字を新しく保つ。計画の行 e-idle の字（受け手が 0 人の間は 5 秒ごとの読み直しを止め、印は見続け、受け手が付いたら 1 回読む）どおりで、行 e-marks の後は store の印の 60 秒の読み直しも止める。
      在りか（src/server/events.rs・write-set・main で 409 行・行 e-marks の試作の後で 449 行）。pub struct Hub（derive は Default・私的な欄 subscribers〔std の mpsc の Sender<String> の Vec を Mutex で包む〕と seq）の pub fn subscribe（&self を受け Receiver<String> を返す）は Sender を列に足す。私的な fn send は列のうち送れた Sender だけを残す（受け手の Receiver が落ちた Sender は次の知らせで外れる）。pub fn stream（書き手と &Hub を受ける）は subscribe の後に頭を書き、KEEPALIVE（15 秒）ごとの注釈の行か知らせの frame を書き続け、書けなくなると戻る（戻ると Receiver が落ちる）ので、閉じた接続を server が知るのは次の書きの時。台帳の見張りの私的な fn watch の周（行 e-marks の後）は、Hub が落ちていれば戻り、印の値を取り直し、値が前と同じで最後に読んだ時から読み直しの間隔（store の印で前の読みが Known なら STORE_REREAD の 60 秒・ほかは REREAD の 5 秒）が過ぎていなければ次の周へ行き、そうでなければ読む。受け手の数は見ない。subscribe を撃つのは stream と、lib の歯 server_src_watch_marks_trigger_reread・server_src_watch_rereads_without_marks・server_min_hub_sends_to_each_subscriber と、tests/wsteady.rs（let rx = hub.subscribe(); の値を私的な fn received〔引数は Receiver<String> の参照〕に渡す）と、tests/lstore.rs の lstore_watch_intervals（grep で確かめた）。Hub::watch を撃つのは lib の歯 2 本だけ（行 e-marks の後の start は Hub::watch_ledger を撃つ・acct.rs とほかの module は撃たない・grep で確かめた）。知らせの frame の字は、私的な fn send が組む id: <seq> と改行、event: <名> と改行、data: <JSON> と改行 2 つの字で、pub fn ledger_changed（at の u64 を受ける）の JSON は欄 at だけの object（lib の歯 server_min_hub_sends_to_each_subscriber は seq 1・at 7 の字 id: 1 と event: ledger-changed と data: {at を 7 とする object} の 3 行を見る）。
      形（src/server/events.rs）。Hub に私的な欄 live（Arc<()>・Default で作る）を足し、pub struct Subscription（私的な欄 rx の Receiver<String> と、live の clone を持つ私的な欄・doc は受け手の 1 人で Receiver として読み、落ちれば受け手の数から外れる）と、Target が Receiver<String> の std の ops の Deref の impl を足す。subscribe は今と同じく Sender を列に足し、Receiver と live の clone を持つ Subscription を返す。pub fn listeners（落ちていない Subscription の数・live の strong の数から 1 を引いた数）を足す。見張りの周は、周の頭で Hub の弱い参照を上げて listeners を読み（上がらなければ戻る）、印の値が前と違うか、受け手が 1 人以上で前の周は 0 人だった（付いた周）か、受け手が 1 人以上で読み直しの間隔が過ぎたときに読む（受け手 0 人の間は印の動かない読み直しをしない）。前の周の受け手の在り無しは周の状態に持ち（起こした時は 0 人）、Hub::watch と Hub::watch_ledger の両方の loop に当てる。stream・ledger_changed・board_changed・send と板の見張り（watch_board・stat だけで bd を撃たない）は変えない。module の doc に、受け手（Subscription）が 0 人の間は印の動かない読み直しをせず、0 人から 1 人以上になった周で 1 回読む旨の文を足す（行 e-idle）。
      決めた幅（起草の決め）。(a) 受け手の数は落ちていない Subscription の数で数える（stream が戻ると落ちる）。閉じた接続を server が知るのは次の書き（KEEPALIVE の 15 秒か知らせ）なので、最後の受け手が去ってから最大 15 秒ほどは読み直しが続く。(b) 付いた周の読みは 0 人から 1 人以上になった周だけ（2 人目では読まない）で、印の周と重なれば 1 回。(c) 受け手 0 人の間も印は 500 ミリ秒ごとに見て、動けば読む（GET の口が返す見張りの字を新しく保つ・行 e-snap）。store の印は書きごとに動くので、store の置き方では受け手 0 人の間も台帳の変化は印の周と読みの時間で GET の口の字に入る。(d) store の無い置き方で、器の素の bd close（jsonl を書き出さない）が受け手 0 人の間に在ると、GET の口の字は次に受け手が付くか印が動くまで古い。また受け手 0 人の間に見張りの読みが落ちると、次に印が動くか受け手が付くまで読み直さない（GET の口は最後に読めた字を 60 秒まで返して頭を付け、その後は測れていない）。面は知らせの接続を開いてから口を読む（g-reads）ので、面が開いている間は受け手が居て、付いた周の読みと 5 秒の読み直しは今のまま（面へ届く値は今と同じ）。この振る舞いは計画の行 e-idle の字（持ち主の裁定 t3-hub.56:20260927T2259Z-1 で承認した計画・拠りは持ち主の重いという指摘と規則の行 R-21）どおりで、受け手 0 人の間の GET の口の古さを規則の行 R-21 の値の字がどう数えるかは席への問い（notes）に置いた（規則の字は直さない）。(e) 板の見張りは変えない。(f) Hub::watch（印の file の見張り・lib の歯が使う）も同じ決まりにする（見張りの loop は 1 つ）。
      着地済みの歯（境界の crate の tests と src を grep で確かめ、試作で撃った）。期待が変わるのは done (4) の 2 本（どちらも受け手を足した直後の読みの回か知らせを見る・直さないと試作で落ちた）。直さずに通る歯。lib の server_src_watch_rereads_without_marks（受け手を足してから中身を替える・付いた周の読みか印の動かない読み直しの知らせを 1 秒以内に受け、その後の読み直しの回も見る）・server_min_hub_sends_to_each_subscriber（Subscription の Deref で try_recv を撃ち、私的な欄 subscribers の数は今のまま）・server_read_watch_board_sends_on_marks（板の見張り）、wsteady_（subscribe の返りを Deref で Receiver の参照に渡す・板の見張り）、lstore_（受け手を足してから数える）、lsnap_（受け手を足さず、印の動きの読みだけを使う）、server_src_marks_change_within_1500ms（付いた周の読みと印の読みは同じか隣の周で、変化 1 回に知らせ 1 件のまま）、行 e-snap が直した server_coalesce・server_min・server_ask・rhold の歯（印の動きの読みを待つ・受け手を足さない・write-set に置き場だけの = で持ち verify で撃つ）。板の見張りと Hub::watch_board は変えないので、板の見張りを見るほかの歯も直さずに通る（xtask の check で撃つ）。verify の --lib の filter は src の単体の歯にも当たるので、events.rs の lib の歯を server_src_watch_（2 本）と名で撃つ（server_src_ は ledger.rs に、server_min_ は ledger.rs と files.rs と http.rs にも当たる）。試作（scratchpad の main の写しに 3 行を入れた木）で、境界の crate の歯の全部（300 本・4 回）と clippy（all-targets・-D warnings）が通り、新しい歯は e-snap の後の code では組めない（listeners と Subscription が無い）。試作で events.rs は 493 行（1 file 1500 行の上限と S の余白 100 行の内）。
      測り方・歯。新しい歯は境界の crate の tests/lidle.rs に置き、名を lidle_ で始める。使う item は tsuzuri_boundary::server::events の Hub と Timing（Hub::default は derive の Default・Timing の欄は pub）と、tsuzuri_boundary::server の Config と Server。lidle_watch_idle_then_attach の印の file は作業場の file 1 つで、1 行を足した字を隣の file に書いてから rename で置き替えて動かす（1 度の書きの途中で更新時刻と長さが別々に見え、見張りが 2 回読む揺れを避ける・試作で 1 度見た）。lidle_live_reads_on_attach の server は Config::new（repo の PathBuf と 127.0.0.1:0 の SocketAddr と面の file の置き場の PathBuf）に pub な欄 bd（OsString）の偽の bd を足して Server::bind（Result<Server, StartError>）で立て、local_addr で port を知り、run を thread で回す（state_dir と seat は既定の None で、器の CLI と設計の道具は撃たない）。口 /api/surface/events は std の TcpStream に要求の字を書き、2 秒を上限に 1 byte 以上を読み、接続は歯の終わりまで閉じない。自分の名の歯は tests/lidle.rs の字を読み、test の属性の行の次の行の fn の名を全部集める。
      filter の語（main 43e8ba4 の contracts の verify の filter の語 193 を、ほかの語を部分の字として含まない 129 語に畳んだ語と、計画の後の行 g-gz の接頭辞 pgz_ と、同じノートの行 e-marks の接頭辞 lstore_と行 e-snap の接頭辞 lsnap_・この行の接頭辞 lidle_ は並べない）は aaround_・accept_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadopt_・cgdom_・cmark_・contract_form_・cround_・csled_・denv_・ecache_・flight_・fmark_・frame_・fserve_・fstop_・gapspage_・gfresh_・ghb_・glabel_・gnav_・graph_・gsum_・gtuck_・gview_・hacols_・hbconf_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hspage_・hsym_・iclose_・ilink_・kcli_・klink_・launch_・lcard_・ledgerblock_・lhome_・lspark_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・parts_・pclosed_・pfold_・pipe_・plimit_・pmore_・pquest_・project_・ptitle_・punmap_・pwhole_・qblock_・qgate_・qkey_・question_・relay_・rhold_・runsdoc_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・stcli_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_・pgz_・lstore_・lsnap_ で、新しい歯の名から先頭の lidle_ を除いた字は、このどれも部分の字として含まない（例 lidle_server_x・lidle_stage_x・lidle_flight_x は不可・filter の語 server_ は surface-base の行が --test を付けずに撃つ）。畳んだ語で足りる（着地済みの filter のうち歯の名そのものと server_ で始まる接頭辞と stage_ で始まる接頭辞は、並べた語を部分の字として含む）。名は done に書いた lidle_listeners_count・lidle_watch_idle_then_attach・lidle_live_reads_on_attach・lidle_own_names_clean（どれも並べた語を含まない）。自分の名の歯は、並べた語を file の中の定数の配列に持つ。
      依存と順。depends は e-snap（同じノートの前の行・e-snap は e-marks の後）。events.rs は e-marks が先に書き、tests/server_src.rs は e-marks が = で持ち e-snap が書き、tests/lstore.rs は e-marks、tests/lsnap.rs と tests/rhold.rs と tests/server_coalesce.rs と tests/server_min.rs と tests/server_ask.rs は e-snap が先に書く（ノートの depends と便の bead の依存で持つ）。tests/wsteady.rs を書いた行 e-watch-steady は着地済み。計画の後の行のうち events.rs を書く行（c-ev-kind・e-signal）と、この行の書く file と = の file を持つ行は、器が同時に流さないので便の bead の依存で順を持つ（この行を先に流す）。計画の 5 節の鎖は、boundary/server/events.rs が e-watch-steady（着地済み）→ e-marks → e-idle → c-ev-kind → e-signal、歯 tests/server_src.rs が e-marks（=）→ e-snap → e-idle。外の依存は足さず、ledger.rs・mod.rs・coalesce.rs・契約の型の crate・面の crate・fixture は触らない。

