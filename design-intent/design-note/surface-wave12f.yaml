      測り方・歯。新しい歯は境界の crate の tests/lstore.rs に置き、名を lstore_ で始める。使う item は tsuzuri_boundary::server::events の Hub・POLL・REREAD・STORE_REREAD・TIMING・Timing・stamp と、tsuzuri_boundary::server::ledger の JOURNAL・MANIFEST・Mark・NOMS・STORE_DIR・Source と、tsuzuri_boundary::server の Config と Server と、tsuzuri_contract::board::Reading（server と events と ledger は pub mod・Hub と Source と Mark と Timing は pub・Timing の欄は pub）。server を立てる形（src/server/config.rs と mod.rs の今の値）。pub struct Config（derive は Debug と Clone と PartialEq と Eq）の pub fn new は repo の PathBuf と bind の SocketAddr と files の PathBuf を受け、pub な欄 bd（OsString・既定は ledger::BD）・state_dir（Option<PathBuf>・既定 None）・folio（OsString・既定は PATH の上の名 folio）・bdw・seat（Option<String>・既定 None）・scribe2（OsString・既定は PATH の上の名 scribe2）を既定で埋める。pub fn Server::bind（&Config を受け Result<Server, StartError> を返す）は listener を開き、変化の見張りの最初の読みを取って戻り、pub fn local_addr（io の Result<SocketAddr>）で port を知り、pub fn run（self を受け戻らない）を歯が thread で回す。state_dir と seat が None なら、起こしても器の CLI と設計の道具は撃たない（この歯は設計の口も撃たない）。作業場は CARGO_TARGET_TMPDIR の下に歯ごとに作り、偽の bd は sh の script（撃たれるたびに記録の file に 1 行を足し、作業場に置いた字の file を cat する・字は別の名で書いてから rename で置く）。store は repo の .beads/embeddeddolt/<db>/.dolt/noms に done (2) の 3 つの file を置く。更新時刻だけの動きは、JOURNAL と journal.idx を追記の形で開いて std の File の set_modified で 5 秒先にし、MANIFEST を同じ字の別の名の file（nbs_manifest_1）から rename で置き替え、journal.idx を字 idx-longer に書き替える。lstore_watch_intervals の受け手は、後の行 e-idle（受け手が 0 人から付いた周で 1 回読み、受け手 0 人の間は印の動かない読み直しをしない・e-idle の後は subscribe の返りが Receiver でなく受け手の型になる）の後も同じ値で通るように、測る前に足し、let で束ねて型を書かず、数え終わるまで落とさない（読みの回の 2 回以下はそのため・1000 ミリ秒の窓で、読み直し 150 ミリ秒の名目は 7 回ほど）。lstore_live_journal_moves の server は Config::new（repo と 127.0.0.1:0 と面の file の置き場）に欄 bd の偽の bd を足して Server::bind で立て、口 /api/surface/events を std の TcpStream で開いて字 retry: 1000 まで読み、接続を歯の終わりまで開いたまま、2 秒待ってから数えの基を取る（同じ理由・付いた周の読みは印の周 500 ミリ秒と偽の bd の 1 回で終わる）。偽の bd の字の替えは fixture の字の最初の status open を closed にした字。自分の名の歯は tests/lstore.rs の字を読み、test の属性の行の次の行の fn の名を全部集める。
      filter の語（main 43e8ba4 の contracts の verify の filter の語 193 を、ほかの語を部分の字として含まない 129 語に畳んだ語と、計画の後の行 g-gz の接頭辞 pgz_ と、同じノートの行 e-snap の接頭辞 lsnap_と行 e-idle の接頭辞 lidle_・この行の接頭辞 lstore_ は並べない）は aaround_・accept_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadopt_・cgdom_・cmark_・contract_form_・cround_・csled_・denv_・ecache_・flight_・fmark_・frame_・fserve_・fstop_・gapspage_・gfresh_・ghb_・glabel_・gnav_・graph_・gsum_・gtuck_・gview_・hacols_・hbconf_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hspage_・hsym_・iclose_・ilink_・kcli_・klink_・launch_・lcard_・ledgerblock_・lhome_・lspark_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・parts_・pclosed_・pfold_・pipe_・plimit_・pmore_・pquest_・project_・ptitle_・punmap_・pwhole_・qblock_・qgate_・qkey_・question_・relay_・rhold_・runsdoc_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・stcli_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_・pgz_・lsnap_・lidle_ で、新しい歯の名から先頭の lstore_ を除いた字は、このどれも部分の字として含まない（例 lstore_server_x・lstore_stage_x・lstore_pipe_x は不可・filter の語 server_ は surface-base の行が --test を付けずに撃つ）。畳んだ語で足りる（着地済みの filter のうち歯の名そのものと server_ で始まる接頭辞と stage_ で始まる接頭辞は、並べた語を部分の字として含む）。名は done に書いた lstore_values_and_dirs・lstore_mark_ignores_mtime・lstore_watch_intervals・lstore_live_journal_moves・lstore_own_names_clean（どれも並べた語を含まない）。自分の名の歯は、並べた語を file の中の定数の配列に持つ。
      依存と順。depends は空（計画の 9 節に無い欠陥の直しの行）。同じノートの行 e-snap（ledger.rs と tests/server_src.rs と tests/rhold.rs を書く）と e-idle（events.rs と tests/server_src.rs を書き、tests/wsteady.rs と tests/rhold.rs を = で持つ）はこの行の後に流す（ノートの depends と便の bead の依存で持つ）。events.rs を書いた行 e-watch-steady と ledger.rs を書いた行 e-hold は着地済み。計画の後の行のうち events.rs を書く行（c-ev-kind・e-signal）と、tests/rhold.rs か tests/server_src.rs を書く行は、器が同時に流さないので便の bead の依存で順を持つ（この行を先に流す）。計画の 5 節の鎖は、boundary/server/events.rs が e-watch-steady（着地済み）→ e-marks → e-idle → c-ev-kind → e-signal、boundary/server/ledger.rs が e-hold（着地済み）→ e-marks → e-snap。外の依存は足さず、Cargo.toml・契約の型の crate・中核と面の crate・mod.rs・acct.rs・fixture は触らない。
  - n: 4
    type: prose
    title: 行 e-snap — GET の口は bd を撃たず、見張りの最後の読みの字を返す
    body: |
      在りかの main は 43e8ba4（読みの合流の便 e-coalesce と持ち回しの行 e-hold〔076666a〕と、mod.rs を書いた行 e-idle-close〔cd3bfee〕と e-cache は着地済みで、この節の字はその後の code の値に、同じノートの前の行 e-marks の形を足した値）。
      なぜ。bd は --readonly の読みでも台帳の store の .beads/embeddeddolt/<db>/.dolt/noms/LOCK に排他の錠（flock）を取る。面の server は、変化の見張り（Hub）の 5 秒ごとの読み直しと、印が動いた時の読みと、台帳を読む GET の口ごとに、bd の読み（bd --readonly list --all --limit 0 --json）を続けて撃つ。器の席の 2026-09-28 の測りでは、器の台帳の錠は 15 秒の間の 209 回の見本の 209 回で取られていて、器の台帳の門の読みが時間切れ（ledger-timeout）になった（門の 1 回の読みが錠を 2.4 秒待った・門の上限は 6 秒）。今の印の .beads の issues.jsonl と interactions.jsonl は、器の着地の close が素の bd close で jsonl の書き出しを飛ばすので動かないことがあり、それが印の動かない 5 秒ごとの読み直しの理由。席はつなぎとして、ほかの project の読むだけの board を止めた。直しは 3 行（同じノート・この順に流す）＝e-marks（印を読みでは動かない store の値にし、印の動かない読み直しを 60 秒の安全の網にする）・e-snap（GET の口は bd を撃たず見張りの読みの字を返す）・e-idle（SSE の受け手が 0 人の間は印の動かない読み直しをせず、受け手が付いた周で 1 回読む）。拠りは席の決め（計画 surface-plan の 3 節・欠陥の直しなので持ち主の問いを置かない）と、計画の行 e-snap と e-idle が拠る持ち主の重いという指摘（t3-hub.1 の user 2026-09-28T00:4xZ・00:59Z・01:06Z）。要件 NFR2（器の event と台帳の変化は 5 秒以内に面へ届き、合図の無いときは周期の読みで 1.5 秒以内）と規則の行 R-21。 この行は GET の口の bd の読みを消す。面は変化の知らせのたびに登録した口を全部読み直す（面の net.rs の reload_all）ので、今は見張りの読みの直後に GET の口の読みが続き、錠を続けて取る。計画の 3 節の席の決め（e-snap は便 e-coalesce の読み終えた字は持ち回さないを覆すが、見張りは印を 500 ms ごとに見るので要件 NFR2 の値は守られる）に拠る。
      在りか・合流（src/server/coalesce.rs・write-set・111 行）。src/server/mod.rs の pub mod coalesce; で公開の module。pub const GRACE（1 秒）と pub struct Coalesce<T>（私的な欄 running・clone は同じ場を分け合う・new と Default と Clone と Debug）の impl<T: Clone> の pub fn share（&self と待つ上限の Duration と、読みの関数 FnOnce() -> Option<T> を受け、Option<T> を返す）は、走っている読みが在ればその終わりを上限まで待って同じ結果（越えたら None）を返し、無ければ読みを撃って結果を返し、待っていた呼びにも同じ結果を渡す。読みが終われば結果は持ち回さない。私的な struct Flight（欄 result と done の Condvar）と Lead（落ちる時に場を空けて待つ側を起こす）を持つ。歯 server_coalesce_wait_is_limit_plus_one_second と server_coalesce_share_within_one_place が share を見る。
      在りか・台帳の読み（src/server/ledger.rs・write-set・main で 307 行・同じノートの行 e-marks の後）。pub const BD_TIMEOUT（5 秒）と BD_WAIT（BD_TIMEOUT に GRACE を足した 6 秒）と READ_HOLD（60 秒）。pub struct Source の私的な欄は shared（Coalesce<String>）・last（最後に読めた字と読んだ時刻の組を Arc と Mutex で包んだ値）・hold。pub fn got（&self を受け pub struct Got〔derive は Debug と Clone と PartialEq と Eq・pub な欄 text は Option<String>・stale は std の time の Instant の Option〕を返す）は私的な fn fresh の合流の読みを撃ち、読めれば text に読めた字と stale に None、落ちれば stale に最後に読めた時刻（一度も読めていなければ Source::new の時刻）と、text にその時刻から hold より短い間だけ最後に読めた字を返す（行 e-hold）。pub fn text は got の text、pub fn read（変化の見張りの読み）は fresh の字を parse_bd で読み、落ちれば Unknown（持ち回さない）。fresh は shared の share に BD_WAIT と、pub fn text_alone（新しい子 process で bd を撃つ）の字のうち parse_bd か中核の台帳の読みが Known の字だけを通し、通れば last に置く関数を渡す。
      在りか・使う所（確かめた・src/server/mod.rs のほかはこの行が書かない file）。src/server/mod.rs（write-set・324 行）の Server::bind_with は Sources（src/server/board.rs の pub struct・欄 ledger・design・runs）の欄 ledger を Source::new(&config.repo, &config.bd) にし、Hub::start に sources.ledger.clone() を渡す。台帳を読む GET の口は、src/server/routes の ledger.rs・item.rs・questions.rs が sources.ledger.got() を、metrics.rs・pipeline.rs・next.rs・graph.rs・graphview.rs・around.rs・unreflected.rs が board.rs の Sources::gather_held（中で self.ledger.got()）を撃ち、どれも応答を mod.rs の私的な fn aged に通す（stale が Some なら頭 X-Tz-Read-Age に最後に読めた時からの秒）。item.rs は台帳が読めなければ状態 503 と字 ledger-unknown。watched にしない Source は今のまま bd を撃つ。account board の project ごとの読み（src/acct.rs の Source::new(anchor, bd) と got・口 /api/account）・tz graph --check（src/cli/graph.rs の Source::new と gather）・停止の hook と問いの起票の門（src/hook の stop.rs と question_gate.rs の text_alone）・裁定と束と方針の受付（src/server の ruling.rs・batch.rs・policy.rs の text_alone）。台帳を読む GET の口を撃つのは面（面の crate の net.rs）だけで、境界の crate の cli と hook と、器（scribe2 の repo）の code は口を撃たない（grep で確かめた）。mod.rs の doc の 10〜13 行目は、同じ時に届いた要求が台帳の読みと設計の索引の読みを 1 本の子 process で分け合い、分け合うのは起動で作る 1 つの Source と Design とその clone で、台帳の読めた字は次の読みが落ちたときだけ READ_HOLD まで返して頭を付け、裁定の受付は合流しない旨の字。
      形（src/server/coalesce.rs）。Coalesce の impl<T: Clone> に pub fn join（done (1) の形・doc は、走っている読みが在ればその終わりを上限まで待って同じ結果を Some で返し〔越えたら Some(None)〕、無ければ新しい読みを始めずに None を返す）を足す。待ちは share の今の待ちと同じ（Flight の結果が置かれるまで Condvar で上限まで待つ・私的な fn に分け合ってよい）。share の振る舞いと module の doc の今の文は変えず、doc に join の 1 文を足す。
      形（src/server/ledger.rs）。Source に私的な欄 latest（最後に終えた合流の読みの結果・読めた字か None・一度も終えていなければ外の None・Arc と Mutex で包み clone と分け合う）と watched（bool・Source::new は偽）を足し、pub fn watched（watched を真にした Source）と pub fn is_watched を足す。fresh の share に渡す関数は、今の last の置き方のまま、読みの結果（通った字か None）を latest に置く。got は、watched なら bd を撃たず、shared の join に BD_WAIT を渡して走っている読みが在ればその結果、無ければ latest の結果、latest が一度も置かれていなければ fresh の結果を字にし、その後は今の got と同じ（字が在れば stale の None・無ければ last から持ち回し）。watched でなければ今のまま fresh を撃つ。read と text_alone と marks と mark は変えない（見張りの読みはいつも bd を撃つ）。text は got の text のまま。PartialEq は今のまま repo と bd だけを比べる（watched を比べない）。module の doc に、watched の Source の got と text は bd を撃たず最後に終えた読み（変化の見張りの読み）の結果を返し、読みが走っていればその終わりを待って同じ結果を返す旨の文を足す。
      形（src/server/mod.rs）。Server::bind_with の Sources の欄 ledger を Source::new(&config.repo, &config.bd).watched() にする（Hub::start に渡す clone も watched と latest を写すので、見張りの読みが latest を置き、GET の口の got がそれを返す）。doc の 10〜13 行目を、同じ時に届いた要求は設計の索引の読みを 1 本の子 process で分け合い、台帳の GET の口は bd を撃たず起動で作る 1 つの Source（Source::watched）とその clone が変化の見張りの最後の読みの字を返し、見張りが読みの途中ならその終わりを待って同じ字を返し（行 e-snap）、見張りの読みが落ちたときは最後に読めた字を READ_HOLD まで返して頭 READ_AGE_HEADER を付け（行 e-hold）、裁定の受付は合流しない旨に書き替える。fn handle・guarded・refusal・aged・json と、字 /api/surface/events と、ほかの行が歯で見る字（mod config;・pub use self::config::Config;・http::no_bytes(・files::respond(・fn guarded<・const READ_TIMEOUT の行・READ_AGE_HEADER・fn aged(）は変えない。
      決めた幅（起草の決め）。(a) watched の印で server の Source だけを替え、account board と tz graph --check と hook の読みは今のまま（それぞれ見張りを持たない）。(b) GET の口は読みの途中の見張りを BD_WAIT（6 秒）まで待ち、越えれば読めない扱いで last から持ち回す（今の合流の待ちと同じ）。(c) latest が一度も置かれていない watched の Source の got は読む（server は起動で見張りの最初の読みを取るので、口には届かない）。(d) 見張りの読みが落ちると、GET の口は最後に読めた字を 60 秒まで返し頭 X-Tz-Read-Age を付ける（行 e-hold の決まりのまま）。見張りの知らせ（読めたから読めないへ、読めないから読めたへ変わるたびに ledger-changed）は変えない。(e) 裁定と束と方針の受付は今のまま新しい子 process で読み直す。受付の書きの後の面の読み直し（面の reload_all）は、見張りが印の動きを拾って読む（印の周の 500 ミリ秒と読みの時間・試作の偽の bd では 1 秒未満）までは書く前の字を返し、見張りの読みが変われば ledger-changed が面にもう 1 度読み直させる（受付の後に見張りを起こす形は ruling.rs と batch.rs と policy.rs を書くので、この行はしない・席への問いは notes に置いた）。(f) 便 e-coalesce の歯の 読み終えた字は持ち回さない の期待を覆す（計画の 3 節の席の決め）。設計の索引の読み（folio）は今のまま口ごとに合流して撃つ（この行の外）。(g) 読めた字には今のまま頭を付けない。見張りの最後の読みの後に印が動いていなければ、store の置き方では台帳は書かれていない（印は書きごとに動く）ので、字は受けた時の台帳と同じで、面の最終更新（頭が無ければ受けた時刻）の意味は変わらない。store の無い置き方で印の動かない書き（素の bd close）の後は、今の見張りと同じく次の 5 秒の読み直しまで古い。
      着地済みの歯（境界の crate の tests と src を grep で確かめ、試作で撃った）。期待が変わるのは done (5)〜(7) の 9 本で、どれも印を動かさずに偽の bd の字を替えた後の GET の口の字か、GET の口の bd の回を見る（直さないと試作で落ちた）。直さずに通る歯。server_src_lists_eight_from_bd・bd_failures_are_unknown（起動の読みの字を返す）・marks_change_within_1500ms（知らせを受けてから一覧を撃つ・知らせの前に見張りが latest を置く）・rereads_every_5s_without_marks（同じ）、server_read・server_view・nsumw・server_seat の歯（起こした後に偽の bd の字を替えない）、server_batch_id_counts_up_in_same_minute（Q2 の notes を替えた後に /api/questions で Q3 の digest を引く・Q3 の card は替わらないので同じ字）、fserve と rhold の Source の歯と rhold_acct_ledger_held と server_acct の歯（watched でない Source）、kcli（cli の Source）、mod.rs の字を読む 5 本（上の形の字を残す）、lstore_（見張りの読みだけを数える）。verify の --lib の filter は src の単体の歯にも当たるので、ledger.rs の lib の 4 本（server_src_marks_are_two_files・server_src_unstartable_bd_is_unknown・server_min_epoch_secs_reads_rfc3339・server_min_parse_refuses_broken_lines）を名で撃つ（server_src_ は events.rs に、server_min_ は files.rs と http.rs にも当たる・coalesce.rs と mod.rs に lib の歯は無い）。試作（scratchpad の main の写しに行 e-marks とこの行を入れた木）で、境界の crate の歯の全部（296 本・4 回）と clippy（all-targets・-D warnings）が通り、新しい歯は e-marks の後の code では組めない（join と watched が無い）。試作で ledger.rs は 404 行・coalesce.rs は 124 行・mod.rs は 325 行（1 file 1500 行の上限と M の余白 300 行の内）。
      測り方・歯。新しい歯は境界の crate の tests/lsnap.rs に置き、名を lsnap_ で始める。使う item は tsuzuri_boundary::server::coalesce::Coalesce（pub mod と pub struct・pub fn new）と、tsuzuri_boundary::server::ledger の Got と JOURNAL と MANIFEST と NOMS と STORE_DIR と Source（行 e-marks の pub な item）と、tsuzuri_boundary::server の Config と Server と、契約の型の crate の board の Reading（腕 Known(T) と Unknown・derive は Debug と Clone と PartialEq）と、ledger の LedgerList（pub な欄 rows は Reading<Vec<LedgerRow>>・行の本数は Known の Vec の長さ）と、pub mod wire の pub fn decode（電文の字を型へ）。Source::new は repo の impl Into<PathBuf> と bd の impl Into<OsString> を受ける。Config と Server の形は、Config::new が repo の PathBuf と bind の SocketAddr と files の PathBuf を受け、pub な欄 bd と folio と scribe2（OsString）と state_dir（Option<PathBuf>）を struct の更新の形で替え、Server::bind（&Config を受け Result<Server, StartError>）の値の local_addr で port を知り、run を thread で回す。偽の bd は sh の script で、撃たれるたびに記録の file に 1 行を足し、作業場に slow の file が在れば 1 秒眠り、down の file が在れば rc 1、無ければ置いた字の file を cat する。1 本の台帳の字は fixture の 1 本目の bead の object だけを持つ配列（歯 server_coalesce_no_carry_over が 1 本に絞る字と同じ作り）。server は Config::new（repo と 127.0.0.1:0 と面の file の置き場）に、欄 bd の偽の bd と欄 folio と scribe2 の無い path と欄 state_dir の None を足して Server::bind で立てる。GET は std の TcpStream に字 GET と path と HTTP/1.1 と頭 Host の要求を書いて接続が閉じるまで読む。server を立てる 2 本は、起こす前に repo の .beads/embeddeddolt/t3/.dolt/noms に MANIFEST（字 5:__DOLT__:aaaa:bbbb:0000:vvvv:10）と JOURNAL（字 0123456789）を置く（見張りの印は store の値で、読めていれば印の動かない読み直しは 60 秒ごとなので、口の bd の回を数える間に周期の読みが入らず、後の行 e-idle の後も同じ値で通る）。見張りの読みを始めるのは JOURNAL に 1 byte を足すこと（長さだけが 1 度動く）。bd の回は記録の file の行の総数。自分の名の歯は tests/lsnap.rs の字を読み、test の属性の行の次の行の fn の名を全部集める。
      filter の語（main 43e8ba4 の contracts の verify の filter の語 193 を、ほかの語を部分の字として含まない 129 語に畳んだ語と、計画の後の行 g-gz の接頭辞 pgz_ と、同じノートの行 e-marks の接頭辞 lstore_と行 e-idle の接頭辞 lidle_・この行の接頭辞 lsnap_ は並べない）は aaround_・accept_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadopt_・cgdom_・cmark_・contract_form_・cround_・csled_・denv_・ecache_・flight_・fmark_・frame_・fserve_・fstop_・gapspage_・gfresh_・ghb_・glabel_・gnav_・graph_・gsum_・gtuck_・gview_・hacols_・hbconf_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hspage_・hsym_・iclose_・ilink_・kcli_・klink_・launch_・lcard_・ledgerblock_・lhome_・lspark_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・parts_・pclosed_・pfold_・pipe_・plimit_・pmore_・pquest_・project_・ptitle_・punmap_・pwhole_・qblock_・qgate_・qkey_・question_・relay_・rhold_・runsdoc_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・stcli_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_・pgz_・lstore_・lidle_ で、新しい歯の名から先頭の lsnap_ を除いた字は、このどれも部分の字として含まない（例 lsnap_server_x・lsnap_stage_x・lsnap_graph_x は不可・filter の語 server_ は surface-base の行が --test を付けずに撃つ）。畳んだ語で足りる（着地済みの filter のうち歯の名そのものと server_ で始まる接頭辞と stage_ で始まる接頭辞は、並べた語を部分の字として含む）。名は done に書いた lsnap_join_starts_nothing・lsnap_watched_source_reads_once・lsnap_routes_call_no_bd・lsnap_routes_wait_for_read・lsnap_own_names_clean（どれも並べた語を含まない）。自分の名の歯は、並べた語を file の中の定数の配列に持つ。
      依存と順。depends は e-marks（同じノートの前の行・ledger.rs を先に書き、tests/server_src.rs と tests/rhold.rs を置き場だけの = で持ち、この行の歯が使う store の item を足す）。同じノートの後の行 e-idle（tests/server_src.rs を書き、tests/lsnap.rs と tests/rhold.rs と tests/server_coalesce.rs と tests/server_min.rs と tests/server_ask.rs を置き場だけの = で持つ）はこの行の後に流す（ノートの depends と便の bead の依存で持つ）。mod.rs を書いた行 e-hold・e-idle-close・e-cache は着地済み。計画の後の行 a-lean は mod.rs を書き、自分の repo の台帳を server の watched の Source と分け合うので、この行の後に流す。この行の書く file と = の file を持つほかの行（例 mod.rs の c-ev-kind・tests/server_ask.rs と tests/hbroute.rs を = で持つノート surface-wave12d の行 e-revoke・tests/rhold.rs か tests/server_coalesce.rs を書く行・mod.rs の字を読む歯の file を書く行）は、器が同時に流さないので便の bead の依存で順を持つ。計画の 5 節の鎖は、boundary/server/mod.rs が e-cache（着地済み）→ e-snap → a-lean → c-ev-kind、boundary/server/ledger.rs が e-hold（着地済み）→ e-marks → e-snap、boundary/server/coalesce.rs が e-snap。外の依存は足さず、events.rs・board.rs・routes の file・acct.rs・契約の型の crate・面の crate・fixture は触らない。
