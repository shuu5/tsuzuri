      決めた幅（起草の決め）。(a) 印に更新時刻を使わない（上の実物の形・更新時刻で見ると見張りの読みが自分の印を動かす）。journal.idx も使わない（読み手の間で長さが行き来する）。(b) manifest は中身を、journal は長さを見る（journal は追記・manifest は長さがほぼ一定で字が替わる）。gc で journal が table の file へ畳まれても manifest の中身が替わるので拾う。(c) store の在り無しは周ごとに dir を読んで決める（server を起こした後に store ができても消えても、次の周から印の種類が替わり、値が違うので 1 回読む）。db の dir が 2 つ以上なら全部を印にする。(d) 60 秒の読み直しは前の読みが Known のときだけ（落ちた読みの後は 5 秒で読み直し、面の読み込み不良の注意の印〔最後に読めた時から 15 秒〕より前に戻れる・面が知らせの接続を開いている間の値で、受け手 0 人の間の読み直しは同じノートの行 e-idle が止める）。(e) store の無い置き方（組み込みでない bd）は今の jsonl の印と 5 秒のまま。(f) 規則の行 R-21 の値（台帳の変化は 5 秒以内・合図なしは周期の読み 500 ms ごとで 1.5 秒以内）の字は変えない（store の印は書きごとに動き、見張りは印を 500 ミリ秒ごとに見て読むので、60 秒は取りこぼしの網でしかない）。(g) 見張りの読みの数はこの行、GET の口の読みは同じノートの行 e-snap、受け手の居ない間の読み直しは行 e-idle が持つ。account board の project ごとの台帳の読み（src/acct.rs）は計画の後の行 a-lean が同じ store の印を使う（この行は acct.rs を書かない）。
