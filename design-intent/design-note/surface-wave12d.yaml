      依存と順。depends は空（中身の依存は無い・計画の 9 節の note の 依存 = なし）。計画の 5 節の鎖は、境界の server/ruling.rs が f-mark-serve（着地済み）→ e-revoke → e-approval-event、契約の ledger.rs が e-hold（着地済み）→ e-revoke、面の project/node.rs が g-title → g-summary（着地済み）→ e-revoke、契約の surface.rs は e-revoke と c-ev-kind を同時に流さない（待ちの解けた方を先に）。この行はほかに、契約の歯 contract_form と snapshot（5 節の c-graph-fold → c-updated → c-abs-time の鎖の file）と、面の vocab.json（g-jst が col_land の注で書く）と、置き場だけの = の境界の歯 hbroute.rs（mod.rs を書く後の行 e-cache・a-lean・e-snap も = で持つ）・fserve.rs・server_ask.rs と面の歯 gsum.rs・ptitle.rs・nodepage.rs・frame.rs・parts.rs（c-ev-kind が書く）・hsderive.rs・helpfig.rs・hsym.rs を持つ。器は走行中の行と write-set が重なる行（置き場だけの = も）を断るので、これらの行との順は便の bead の依存で持つ（待ちの解けた方を先に流す・この行の後の行はこの行が足した ReopenItem の腕と snapshot の 5 行と鍵 revoke を保つ）。ノート surface-wave12e の e-batch-partial（便 t3-hub.52.73）は契約の surface.rs を書き契約の歯 contract_form を置き場だけの = で持つ行で、main 7d633b6 で着地した。この行はその後の code で起草し、試作もその上で撃った（着地したので便の依存は要らない・この行の足す字は RulingResponse の後で、ItemOutcome の字は変えない）。計画の 9 節の行 e-policy-q（判断の記録 ADR-16 の決定 (4)）は契約の ledger.rs と歯 contract_form と snapshot をこの行と共に持つので、e-policy-q の便がこの行の便に依存する（席の決め・この行の側は何も足さない）。このノートの行はこの 1 つだけ。外の依存は足さず、Cargo.toml・fixture（tests/fixtures の下）・style.css・mod.rs・build.rs・ask.rs・net.rs・nodearound.rs・中核の crate は触らない。

