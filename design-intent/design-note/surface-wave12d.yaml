sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      持ち主が答えた決定を画面から取り消せるようにする境界と契約と面の 1 行。
      境界の server に POST の口 /api/revoke を足す。受けたら、問いの notes の末尾に前の裁定の id を名指す取り消しの行（新しい裁定の id と逐語つき）を足し、問いを bdw reopen で open に戻す。台帳の行は何も消さない。受けるのは、名指した裁定がその問いの効いている最後の裁定で、問いが閉じているときだけ（ほかは 409）。開き直しだけが落ちた撃ちは、同じ要求の撃ち直しで行を足さず開き直しだけを撃ち、応答でそう言う。
      面は決定の頁（種類があなたの決定の近傍の頁）の頭の button の枠に、理由の欄と取り消すの button を、同じときだけ出す（撃ち直しは同じ button を押す）。
      中核の crate と外の依存は変えない。承認の event（器の event log）は書かない。
