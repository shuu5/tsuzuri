    body: |
      在りかの main は 59a0c02（計画 v0.27・code は行 e-batch-partial〔便 t3-hub.52.73〕の着地の commit 7d633b6 と同じ。28410a8 の後の code の commit は表示面の stage〔境界の src/stage と歯 stlaunch〕と中核の pipeline〔src/pipeline.rs と歯 pquest と punmap〕と歯 fstop の片付け〔行 t-fstop-tidy・境界の tests/fstop.rs〕と e-batch-partial〔契約の surface.rs の ItemOutcome に変種 Unclosed と Unwritten・境界の server の batch と面の batch と歯 bhalf ほか〕で、この行の file のうち変わったのは契約の surface.rs の ItemOutcome の所だけ・この節の字はその code の値）。行の拠りは持ち主の裁定 t3-hub.52.60（裁定 id = t3-hub.52.60:20260928T0441Z-1・束 batch:20260928T0441Z-1・推奨の案 A）と計画 surface-plan の 3 節の判断の表の行 d32。
      なぜ。要件 FR7 は、取り消しは新しい裁定が前の id を名指して問いを open に戻す（消さない）と求めるが、今の境界の server に取り消しの口は無く、裁定の受付（ruling の accept）は open の問いしか受けない。持ち主の裁定 t3-hub.52.60 は案 A = 決定の頁（節点の頁で、種類の見出しが あなたの決定〔語の鍵 k:裁定〕の頁）の頭に理由の欄と 取り消す の button を置き、出すのはその決定がその問いの最新の決定で問いが答え済み（closed）のときだけ、とした。見本 mock v3 に置き場は無い（問いの頁の これまでの決定 の各行の時刻の link が決定の頁へ行く）。取り消しで戻るのは台帳だけで、席がもう始めた作業は自動では戻らない（席は取り消しの裁定を配達で知らされて止めるか戻す・この行の外）。要件 FR9 のうち、取り消しの行を席へ配る分（配達の口と停止の hook）はこの行が今の経路をそのまま使う。承認の event（器の RulingReceived）は行 e-approval-event と同じく器の口の答え待ちで、この行は書かない。
      在りか・受付（src/server/ruling.rs・write-set・境界の crate の src/server/mod.rs の行 pub mod ruling;）。module の頭の doc は受付の順の 1 から 6 の番号の列で終わる。pub const PATH（字 /api/ruling）・SCRIBE2・LINE_PREFIX（字 裁定 id = と末の空白 1 つ）・WRITE_TIMEOUT（30 秒）・DELIVER_TIMEOUT（10 秒）・NOT_TAKEN と私的な const ID_END（字 ・）を持つ。pub struct Delivery（pub な欄 program・state_dir・target）と pub struct Writer（pub な欄 repo・bdw・delivery の Option）と pub enum Outcome（Recorded の RulingResponse・Refused の Refusal・LedgerUnknown・IdShape・AppendFailed・CloseFailed の RulingId）を持つ。pub fn accept（&RulingRequest・&Source・&Writer・EpochSecs を受け Outcome）は、逐語が空白だけなら Refused の EmptyVerbatim、台帳を Source の text_alone（合流しない新しい子 process の読み）で読み直して中核の question の open_questions に通し、読めなければ LedgerUnknown、open の問いに無ければ UnknownQuestion、要約値が要求の seen_digest と違えば StaleVersion、pub fn next_id（問いの id・notes・分の字を受け、notes の行頭が LINE_PREFIX の行の id の列に無い最小の数 n の RulingId の for_question〔問いの id とコロンと分とハイフンと n〕を返す・形に収まらなければ Err）が Err なら IdShape、私的な fn write（bdw を LedgerWrite の argv と cwd repo と WRITE_TIMEOUT で撃ち rc 0 なら真）で AppendNotes（行は pub fn line の字 裁定 id = <id>・問い = <問いの id>・逐語 = <escape した逐語>）が落ちれば AppendFailed、CloseItem（理由は字 裁定 と空白と id）が落ちれば CloseFailed、Writer の delivery が Some なら pub fn deliver（台帳を読み直し、中核の delivery の marked で印が在れば撃たず、器を deliver_argv〔seat deliver --state-dir --target --ruling の 8 語〕で 1 度撃ち、rc 0 なら 問いの notes に mark_line の経路 配達の口 の印を AppendNotes で足す）を 1 件の Pending で呼び、Recorded（RulingResponse の ruling と recorded_at に受付の時刻）を返す。pub fn escape は逆斜線を逆斜線 2 つ・改行を逆斜線と n・復帰を逆斜線と r にし、pub fn minute は epoch 秒を UTC の年月日 T 時分 Z の字にする。file の #[cfg(test)] の lib の歯は server_ask_minute_is_utc・server_ask_escape_one_line・server_ask_next_id_skips_taken・server_ask_line_prefix_is_graph_ruling（src/server/http.rs の lib の歯 server_ask_http_ の 2 本も同じ filter に当たる）。
      在りか・口（build.rs と src/server/routes と src/server/mod.rs）。境界の crate の build.rs は src/server/routes の下の拡張子 rs の file の名（英小文字で始まり英小文字と数字と下線だけ）を byte の順に並べ、名ごとの path の属性と mod の宣言と、変種の名（先頭と下線の後を大文字にし下線を外す）の列挙 Route と pub const ALL と pub fn name・key と pub(in crate::server) fn entry を OUT_DIR の routes.rs に書き、mod.rs の私的な mod routes が include で取り込み、pub use self::routes::Route で出す。口の file は pub(in crate::server) const ROUTE の Entry（欄 key の Key〔method の字と path の Match〕と handle の関数）を持つ（例 routes/ruling.rs は Key の method POST と Match の Exact の ruling の PATH で、本文を guarded で読み ruling の accept の Outcome を 200・refusal・503 ledger-unknown・500 ruling-id-shape・502 ledger-append・502 ledger-close と空白と id に写す）。mod.rs の私的な fn guarded（Origin が Host と違えば 403 origin・本文が上限を越えれば 413 too-large・読めない本文は 400 bad-body）と fn refusal（Refusal の http_status と RefusalResponse）と fn json と fn aged は、routes の file が子の module なので使える（routes/ruling.rs と同じ use crate::server::{Shared, events, guarded, json, refusal}）。route の fn dispatch は Route の ALL を宣言の順に見て最初に当たる口を呼ぶ。routes/item.rs は method GET と Match の Prefix の私的な const PREFIX（字 /api/ledger/）で、残りの字を BeadId にして（読めなければ 400 id-shape）Source の got の字を ledger の item（parse_bd の Known の中から id の同じ LedgerItem）に通し、200 の LedgerItem の電文・404 no-item・503 ledger-unknown を返す（aged を通る）。mod.rs の module の doc は POST を受ける口を /api/ruling・/api/batch・/api/policy・/api/account/heartbeat・/api/seat/heartbeat と、POST の 5 つの口と書く（この行は mod.rs を書かない・決めた幅 (i)）。
      在りか・台帳の読み（src/server/ledger.rs・読むだけ）。pub struct Source の pub fn text_alone は bd を BD_ARGS（--readonly list --all --limit 0 --json）で新しい子 process として撃ち（走っている読みを分け合わず、最後に読めた字も置かない）、rc 0 の UTF-8 の字を返す。pub fn parse_bd は bd の出力の JSON の配列を契約の BdLine の列として読み、状態 tombstone を飛ばし、updated_at を RFC 3339 の epoch 秒に読めない bead が 1 本でも在れば全体を Unknown にし、読めれば Known の LedgerItem の列（row の id・kind〔issue_type〕・title・status・updated_at・parent・labels と description と notes）を返す。pub use の capture（program と argv と cwd と上限）を ruling が使う。
      在りか・契約の型（crates/tsuzuri-contract/src/lib.rs の行 pub mod ledger; と pub mod surface;）。ledger.rs の LedgerWrite（derive は Debug・Clone・PartialEq・Eq・Serialize・Deserialize・serde の tag op・rename_all kebab-case）は AppendNotes（id・line）・CloseItem（id・reason）・CreateChild（parent・title・child_type・description）の 3 つで、doc は server の書きはこの 3 つだけで、どれも bdw を経る。argv は update と id と --append-notes= に行、close と id と --reason= に理由、create と --parent= と --type= と --description= と -- と題。pub fn creates_child。LedgerItem の pub fn digest は id・題・状態・本文・notes を改行でつないだ字の FNV-1a の 64 bit で、状態と notes が変われば変わる（開き直した問いに古い画面から答えると accept が StaleVersion で断る）。LedgerRow の pub fn is_question は label が QUESTION_LABEL（字 intake:question）を含むか。surface.rs の RulingId は ASCII の英数字と . - _ : だけの 64 byte 以下の 1 語（先頭は英数字・空白は読めない）で、pub fn for_question・for_batch・for_policy・as_str を持つ。RulingRequest（question・seen_digest・verbatim）・RulingResponse（ruling・recorded_at）・Refusal（EmptyVerbatim・UnknownQuestion・StaleVersion・A1NeedsOwnVerbatim・A1InBatch・EmptyBatch の閉じた 6 つ）と pub fn http_status（StaleVersion は 409・UnknownQuestion は 404・ほかは 400）と RefusalResponse（reason）。BeadId はコロンを持てない（. - _ だけ）。
      在りか・契約の歯（tests/contract_form.rs・write-set）。fn ledger_writes は LedgerWrite の見本 5 つ（AppendNotes 2・CloseItem 1・CreateChild 2）を返し、fn forms の form の ledger::LedgerWrite がそれを snapshot に並べる。contract_form_ledger_write_argv は見本ごとに wildcard の腕の無い match で変種の字（append-notes・close-item・create-child）を集め、argv が空でなく先頭が BDW でなく、-- の前に notes を置き換える旗が無く、子を作る書きだけが create を撃ち親を 1 つ持ち、旗の位置の語が値つきの -- の旗であることを見て、最後に変種の数が 3 であることを見る（変種を足すと match が網羅でなくなり組めない）。contract_form_snapshot_matches は tests/snapshots/contract_form.json と字で比べ、違えば今の字を CARGO_TARGET_TMPDIR の contract_form.json に書いて落ちる。contract_form_roundtrip_all_types・contract_form_ids_refuse_bad_shape ほかの 8 本が filter contract_form_ に当たる。
      在りか・中核（読むだけ・書かない）。crate::delivery の pub fn undelivered は台帳の字の label intake:question の bead（状態 tombstone のほか・open も含む）の notes の、行頭が pub const RULING_PREFIX（字 裁定 id = と末の空白 1 つ）の行の id のうち、同じ notes に行頭が 配達 = でその id の印の無いものを Pending（question と ruling）の列にして Known で返す。crate::graph::build の pub const TYPED_LINES の先頭は（字 裁定 id = と末の空白 1 つ・NodeKind の Ruling）で、notes の定型行ごとに id の節点（種類 Ruling・題は行の頭 36 字）を 1 つ作り、bead が問いなら裁定の節点から問いへの型 Answers の辺を足す。crate::question の open_questions は状態 closed と tombstone の問いを外す。bd の命令の一覧に reopen（閉じた issue を開き直す）が在り、器の hook の歯は bdw reopen <id> --reason <字> を撃つ形を持つ。bdw は読みの allowlist の外の命令を書きとして錠の下で bd に渡す（ReopenItem の argv は bdw の書きの 1 回）。
      在りか・面（crates/tsuzuri-surface・直接依存は tsuzuri-contract だけ・DOM は wasm の target だけ）。src/project/node.rs（組み立ての script が生成する crate::project::node・host でも組む）は pub const BLOCK・PATHS（空）・FOLDS（空）・NO_SUMMARY・NO_SRC・SUMMARY_KEYS・SUMMARY_NONE と pub struct Head（欄 shape・alert・kind_key・band・state・id・title・src・answer）と pub fn center・head・summary・answer_href・kept_subject を持ち、Head の answer は中心が open の問いのとき真。mod dom の fn view は nodearound の source の読み（Source の欄 search と read の ReadSignal の Fetched と状態の数の組）から、PageSubject の Effect と、読みごとに組み直す content の closure（head と center が在れば head_view と 2 つの概要の箱）を組み、私的な fn head_view（Head と mode を受ける）は div class nhead の中の最後に answer の a class btn sm primary（語の鍵 answer_here）を置く。nodearound の pub fn state（&Fetched と状態の数を受け PageState）と pub enum PageState（NotRead・NotFound・Unread・Doc の AroundDoc）は host にも在る。crate::net（wasm だけ）の pub fn read_path（String の Signal を受け、path が空なら読まず、path が替わったときと知らせの合図と reload_all で読み直す）・pub async fn post（path と本文を受け、状態の数と本文の字の Option）・pub fn reload_all。crate::project::ask（host）の pub fn can_send（字と送っている間か・空白だけか送っている間は偽）と pub fn outcome（状態の数と本文の字の Option を受け Outcome・200 は RulingResponse を読んで Recorded、409 は Stale、ほかは RefusalResponse の refusal_text と状態の数の Refused、届かなければ Refused の 口に届かない）と pub enum Outcome の pub fn line・keeps_text・answer_open・reloads （名と引数と返りを使うだけ・ask.rs は書かない）。crate::view の Fetched（NotRead・Failed・Body の String）は host に在る。語の辞書は vocab.json の欄 english と rephrase の和集合で、鍵 own_words の label は あなたの言葉（原文のまま）、k:裁定 の label は あなたの決定、answer_here の label は 質問の頁で答える。style.css に class answer・btn・small の規則が在る。
      形（契約の型）。ledger.rs: LedgerWrite に変種 ReopenItem { id: BeadId, reason: String } を CreateChild の後に足し（doc は閉じた bead を open に戻す・取り消しの行 e-revoke）、argv の腕を字 reopen・id の字・字 --reason= と理由の 3 語にし、enum の doc を server の書きはこの 4 つだけで、どれも bdw を経て、どれも消さない、の旨にし、pub const ITEM_PATH（&str・字 /api/ledger/・doc は GET の 1 本の引きの口の path の頭で後に bead の id を付け、routes/item.rs と同じ字）を足す。surface.rs: module の doc に取り消しの要求と応答と判じる関数の 1 行を足し、use を crate::ledger::{BeadId, LedgerItem} にし、RulingResponse の後に pub const REVOKE_PATH・RULING_LINE・QUESTION_FIELD・REVOKES・VERBATIM・CLOSED_STATUS と私的な const FIELD_END（字 ・）と pub struct RevokeRequest・RevokeResponse と、私的な struct Line（裁定の行の id と問いの欄と取り消す欄の字）と私的な fn ruling_lines（notes の裁定の行を notes の順に読む・欄は逐語の欄より前だけ）と、それを使う pub fn latest_ruling・pending_reopen・revocable を done (2) (3) の値で足す（行の末の復帰を除いてから頭を見る・revocable は server の受付と面の button が同じ関数で判じる）。RulingResponse と ItemOutcome ほかの今の型は変えない（ItemOutcome は着地済みの e-batch-partial の 5 変種のまま）。
      形（境界）。ruling.rs: module の doc の番号の列の後に空の doc の行を 1 つ置いてから取り消しの段落（口 POST /api/revoke・fn revoke・同じ順で受け閉じる代わりに開き直す・取り消せるのは閉じた問いの効いている最後の裁定だけ・何も消さない）を足す（空の行が無いと clippy の doc_lazy_continuation が -D warnings で落ちる・試作で確かめた・段落は開き直しだけが落ちた撃ちの撃ち直しの 1 文も持つ）。use に契約の QUESTION_FIELD・REVOKES・RevokeRequest・RevokeResponse・VERBATIM・pending_reopen・revocable と ledger の parse_bd を足す。pub enum Revoked と pub fn revoke と私的な fn reopen を fn write の前に、pub fn revoke_line（字 LINE_PREFIX・新しい id・ID_END・QUESTION_FIELD と問いの id・ID_END・REVOKES と前の id・ID_END・VERBATIM と escape した逐語）を fn escape の前に置く。revoke の順は、(1) 逐語が空白だけなら Refused の EmptyVerbatim、(2) text_alone の字を parse_bd に通し Known でなければ LedgerUnknown、row の id が要求の question と同じで is_question の LedgerItem が無ければ Refused の UnknownQuestion、(3) revocable が偽なら Refused の StaleVersion、(4) pending_reopen（問いの notes・要求の question と ruling）が Some なら、その id を RulingId に読み（読めなければ IdShape）、行を足さず fn reopen に reopened_only 真で渡す（要求の逐語は書かない）、(5) ほかは next_id（問いの id・その notes・minute(now)）が Err なら IdShape、AppendNotes（行は revoke_line・逐語は要求の字）が落ちれば AppendFailed、通れば fn reopen に新しい id と reopened_only 偽で渡す。fn reopen（要求・Source・Writer・id・now・reopened_only を受け Revoked）は ReopenItem（理由は字 裁定 と空白と id と ID_END と REVOKES と前の id）を撃ち、落ちれば ReopenFailed の id、通れば Writer の delivery が Some のときだけ id の 1 件の Pending で deliver を呼び（deliver は印が在れば撃たない）、Recorded（RevokeResponse の ruling に id・recorded_at に now・reopened_only）を返す。accept と next_id と line と deliver と deliver_argv と LINE_PREFIX の字は変えない。routes/revoke.rs（新）: 頭の doc は POST /api/revoke の 1 行、ROUTE は Key の method POST と Match の Exact の契約の REVOKE_PATH、本文を guarded で RevokeRequest に読み、ruling の revoke の Revoked を done (8) の状態の数と本文に写す（Recorded は RevokeResponse の電文の 200）（字の /api/ を直に書かない）。mod.rs と build.rs と routes のほかの file は書かない。
      形（面）。node.rs の host の部分: module の doc に決定の頁の取り消しの 4 行（撃ち直しは同じ button を押す、を含む）を足し、use に契約の ledger の BeadId・ITEM_PATH・LedgerItem と surface の RevokeRequest・RulingId・revocable と wire と crate::view::Fetched を足し、pub struct Revoke と pub fn revoke_target・item_path・shows_revoke・revoke_body を done (11) (12) の値で足す（revoke_target は中心の行の種類が Ruling でなければ None、id を RulingId に読み、最初のコロンの前の字を BeadId に読む・近傍の行の問いの行には頼らない）。mod dom: use に leptos の ev と task の spawn_local と契約の REVOKE_PATH・RulingId と super の Revoke・item_path・revoke_body・revoke_target・shows_revoke と crate::project::ask の Outcome・can_send・outcome と crate::view::Fetched を足す。私的な struct Draft（text の String・sending の bool・outcome の Outcome の Option の ArcRwSignal・Clone）と type Drafts（裁定の id と Draft の組の Vec の StoredValue）と fn draft（ask の同じ名の fn と同じ形）を置く。view の中で mode の後に、読みの PageState が Doc なら revoke_target の値を持つ Memo target と、target の問いの item_path（的が無ければ空の字）を String の Signal の derive で渡した crate::net::read_path の読み item と、Drafts を作り、content の head_view の呼びに target の値ごとの fn revoke_view の AnyView の Option を渡す。head_view は 3 つ目の引数 revoke の AnyView の Option を受け、{answer} の後に {revoke} を置く。fn revoke_view（Revoke・item の ReadSignal・Draft を受け AnyView）は、item の Fetched で shows_revoke が真で Draft の outcome が None か answer_open のときだけ div class answer の中に textarea（rows 2・aria-label と placeholder は語の鍵 own_words の label・prop:value と on:input で Draft の text）と button（type button・class btn・data-term revoke・can_send が偽なら disabled・字は語の鍵 revoke の label・on:click で fn submit）を出し、outcome が在れば div class small と role status に Outcome の line を出す。fn submit は can_send が偽なら何もせず、sending を真にして revoke_body を crate::net::post の REVOKE_PATH へ送り、ask の outcome の値で keeps_text が偽なら text を空にし、outcome を置き sending を偽にし、reloads なら reload_all を呼ぶ。ask の outcome は 200 の本文を RulingResponse として読み、RevokeResponse の電文は鍵 ruling と recorded_at を同じ字で持ち、契約の型は知らない鍵を断らない（serde の既定・RulingResponse に deny_unknown_fields は無い）ので Recorded になる（面は reopened_only を出さない）。開き直しだけが落ちた 502 は Refused で欄の字を残し読み直さないので button は残り、頁を読み直しても shows_revoke が pending_reopen で真なので、持ち主が同じ button をもう一度押すことが撃ち直しになる。Ctrl と Enter で送る鍵の判定は持たない。vocab.json: 欄 rephrase の鍵 answer_here の後に鍵 revoke を足す（label は 取り消す、plain は この決定を取り消す と、中黒で始まる 理由をあなたの言葉で書いてから押す・記録は消えず、取り消しの行が足される の 2 行と、→ で始まる question は未回答に戻り、答え直せる の 1 行、internal は 裁定の行（取り消す = 前の id）を notes に足し、bd reopen）。PATHS と FOLDS と BLOCK と Head と head と head の answer の決めは変えない。
