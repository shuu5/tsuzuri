      なぜ。持ち主の裁定 t3-hub.77.28 の推奨は、面の server の新しい口 /api/host がその場で読み、変化の種類 Host を今の SSE に 1 つ足す形（database に新しく書かない・条 P-20）。kernel の file は更新時刻と長さが動かないので、今の板の印の見張り（更新時刻と長さ）では見えない。そこで局面の出力の中身の見張り（Cases の watch）と同じ形の見張りを足し、受け手が居る周だけ読んで、組んだ時刻を除く電文が前に送った周と違う時だけ host の種類を送る。受け手が居ない周は読まず、前の中身を忘れる（規則の行 R-34 の頁を開いていない時）。

      形。読む file は、根からの相対の kernel の 6 本（proc/loadavg・sys/devices/system/cpu/online・proc/pressure の cpu と memory と io・proc/meminfo）と、自分の cgroup（proc/self/cgroup の、0 と 2 つのコロンで始まる行）の親の dir の下の子の dir ごとの memory.current と memory.max（席と便の scope は同じ親の下に並ぶ・名を code に焼かない）と、state dir の host.toml の書きの測りの表の行の stat と wear の path。根は本物では / で、歯は一時の dir に写しの木を置いて根を替える（with_root）。装置の path は表から読み、code に焼かない（条 N-7）。書きの速さは装置ごとに前の読み（区の数と読んだ ms と速さ）を控え、前の読みから RATE_GAP（5 秒）に満たない読みは前の速さを返す（口の要求と見張りの読みが続いても揺れない）。見張りの間 HOST_POLL は 10 秒（規則の行 R-21 の 5 秒は器の event と台帳の変化の値で、host の値の周期はこの行の定数）。面の読み直しの表には host の口を host の種類だけで読む行を足す。表に無い口（相談の窓の一覧など）は今までどおり全部の種類で読み直すので、相談の窓を開いた頁は host の値が動く周に一覧を読み直す（表に行を足すのは範囲の外）。

      軽さ。読みの 1 周は kernel の file 6 本と scope の dir（この host で約 90）の file 2 本ずつと装置の stat と摩耗の記録で、調べ係 rs1 が kernel の 9 本を 1 周 約 0.18 ms の CPU と測った（V）。scope の file はそれより多いので、着地の後に席が規則の行 R-34 の測り（面の server の読みを変える行の着地ごと）を撃ち、頁 1 枚と頁を開いていない時の値を便の bead の notes に記帳する。

