    type: contract-table
    title: 契約表
    rows:
      - id: t-run-cap-off
        title: tsuzuri の器への宣言 .vessel.toml から、器を書く便を同時に 1 本までにする床の任意 key run-cap と run-cap-paths の 2 行とその注 3 行を外し、名乗りの行 t-run-cap-on の歯の file を外す（判断の記録 ADR-64 の決定 (2)・観る 1 回の後に席が便の bead を起こす・差の file）
        req: ["FR1068"]
        section: "3"
        patch: docs/design/patch/t-run-cap-off.patch
        write-set: [".vessel.toml", "~xtask/tests/onevd.rs", "+xtask/tests/rcoff.rs"]
        verify: ["git apply --reverse --check docs/design/patch/t-run-cap-off.patch", "cargo clippy -p xtask --all-targets --no-deps -- -D warnings", "cargo nextest run -p xtask --test rcoff --no-tests=fail rcoff_"]
        size: S
        done: (1) git apply --reverse --check docs/design/patch/t-run-cap-off.patch が rc 0（差の file の hunk が全部木に在る・verify の 1 行目） (2) 根の .vessel.toml の行のうち字 run-cap を含む行（key の行と注の行）は 0 行で、key schema の行 schema = 1 は 1 行だけ在る（歯 rcoff_root_declaration_names_no_vessel_cap） (3) key schema と build-lanes の正しい 2 行の見本は字 run-cap を含む行を返さず、それに 1 句だけ足した 5 形（末に run-cap = 1・末に値が scribe2/ の 1 項目の配列の run-cap-paths の行・末に run-cap を名指す注の行・前に空白を持ち = の前後に空白の無い run-cap=2・build-lanes の行の前に run-cap = 1）は、どれも足した 1 行だけを前後の空白を除いた字で返す（歯 rcoff_one_clause_additions_are_found）
        done-teeth: ["1:@1", "2:@3", "3:@3"]
