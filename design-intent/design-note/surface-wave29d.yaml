sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      判断の記録 ADR-64（器の crate の根を名乗る行 v-roots を v-join を待たずに流し、v-roots の着地の後に追随の撃ち直しを 1 回見てから器を書く便の同時 1 本の床を外し、穴は塞ぐまで席の門で守る・持ち主の裁定 t3-hub.87.38 の案 1 と t3-hub.87.39 の甲）の行と、同じ束で裁定した 2 つの問いの行と、書き込みの検出線の器の行を置く。

      行の見込み。行 t-run-cap-off は ADR-64 の決定 (2) の床を外す行で、席は決定 (3) の観る 1 回を確かめて記帳するまで、この行の便の bead を起こさない（観た後に起こす）。問い t3-hub.87.37（係の token を減らす次の手・撃ち比べ）の係の effort の行と、問い t3-hub.77.28（host の負荷と SSD の負荷を project の board に出す）の行と、memo t3-hub.77.16 の書き込みの検出線の器の行 v-wline-b と v-wline-c は、後の係が足す。

      穴を塞ぐ行 v-scope-paths と t-scope-on と、床を入れた行 v-one-vessel と t-run-cap-on はノート surface-wave29c に在る。depends は同じノートの行だけを書けるので、ほかのノートの行との順は便の bead の依存と hold で持つ。行ごとの節は、行を足す適用が節の末に足す。1 本の契約表は 32 行まで（規則の行 R-32）。歯の置き方は判断の記録 ADR-32 の決定 (3) のとおりで、新しい歯は段の file で足し、群の main.rs と kfold.rs は畳みの行だけが書く。
