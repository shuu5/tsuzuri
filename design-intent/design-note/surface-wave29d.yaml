  - n: 3
    type: prose
    title: 行 t-run-cap-off — 器への宣言から器を書く便の同時 1 本の床を外す（判断の記録 ADR-64 の決定 (2)(3)）
    body: |
      在りか。差の file docs/design/patch/t-run-cap-off.patch（6,669 byte）は、main 996f81b5（行 v-roots の着地 785543ae の後）と、その上の試作の commit ef41740e（tree 71c4622f・写しは drafts の try-w258a の branch w258a・係 w258a）の差（3 file・+63 −52）。係 w254a が main 4522db99 で切った差を、v-roots の着地の後の main に当て直して切り直した（.vessel.toml の blob の字が替わっただけで、hunk の字は同じ）。.vessel.toml の末の注 3 行と run-cap = 1 と run-cap-paths の 1 行を外し、着地した段の file xtask/tests/onevd.rs（行 t-run-cap-on の歯）を消し、段の file xtask/tests/rcoff.rs（群の main.rs と kfold.rs は書かない）を足す。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 項目は verify の 1 行目、2 項目と 3 項目は 3 行目の nextest（--test rcoff の rcoff_）が測る。2 行目の clippy は歯の file の lint。歯の file xtask/tests/onevd.rs が木に無いことは、1 行目の逆向きの当たりが測る（消す hunk の逆は file を作るので、file が在ると当たらない）。

      依存と順。depends は書かない。この行は器の code を書かないので、器を書く便の数に入らない。流す時機は判断の記録 ADR-64 の決定 (2)(3) で、席は決定 (3) の観る 1 回を確かめ、便の直列の詰まりの memo（t3-hub.89）の notes に記帳してから、この行の便の bead を起こす（toml の depends は時機を持てず、起票の後に hold を置くと起票と hold の間に起こされる隙が在る）。同じ .vessel.toml を書く未着地の行 t-scope-on（ノート surface-wave29c・constitution の行の後に 3 行を足す）と、器の行 v-scope-paths（.vessel.toml を書かない）とは、main 996f81b5 の一時の index に単独と全部の順で当てて同じ木になる（係 w258a の commute.log）。どれが先に着地してもよい。

      なぜ。判断の記録 ADR-63 の決定 (13) は、器を書く便を同時に 1 本までにする床を宣言の 2 つの鍵に置き、外す時も行で外すとした。判断の記録 ADR-64 は外す時機を、v-roots の着地の後に追随の撃ち直しを 1 回観た時にした。器は 2 つの鍵を任意の鍵として読むので、鍵の無い宣言は床の無い形で、器の受付を止めない。

      形。.vessel.toml の build-lanes = true の行の後の 5 行（注 3 行と鍵 2 行）を外し、file の末は build-lanes = true の行になる。行 t-run-cap-on の歯 onevd_ は 2 つの鍵の在ることを断言するので、鍵を外すと落ちる。その歯の file を消し（write-set の ~）、外したことを断言する歯を足す。

      歯と噛み。段の file xtask/tests/rcoff.rs は、字 run-cap を含む行を注の行も数えて拾う。後の行が宣言の注で run-cap の名を引くと、この歯が落ちるので、宣言の注で run-cap を名指さない（行 t-scope-on の注も書かない）。宣言の file の字を照らすのは、宣言の鍵の在る無しは器の振る舞い（受付と列の待ち）でしか見えず、それを測るには器の binary と live な便が要るためである。噛みは句ごとに 8 変異（宣言の末に run-cap = 1 の行・run-cap-paths の行・注の 1 行を戻す・schema の行を 2 度書く・拾いを注でない行に絞る・key の名の完全一致にする・前後の空白を除かない・最後の行だけを見る）で、名指しの歯が全部 rc 100（係 w254a の bite.tsv・歯の file の blob eae2b0fa は係 w258a の切り直しでも同じ）。

      範囲の外。器の code（run-cap を読む器の行 v-one-vessel の部品）は替えず、ほかの project も使える任意の鍵として残る。要件 FR1068 は器の dispatcher の振る舞いを書くので替えない。穴を塞ぐ行 v-scope-paths と t-scope-on はノート surface-wave29c に在り、塞ぐまでの席の門は判断の記録 ADR-64 の決定 (4) が持つ。
  - n: 4
    type: prose
    title: 行 ag-effort-high — 起草係の型の考える量の段を high に下げる撃ち比べ（plugin/agents/drafter.md の頭の欄 effort・台帳の問い t3-hub.87.37 の裁定・差の file）
    body: |
      在りか。差の file docs/design/patch/ag-effort-high.patch（5,742 byte）は、main 4522db99 と試作の木（写しは drafts の try-w255a の branch r1 の commit c676f961・係 w255a）の差で、型の file plugin/agents/drafter.md の頭の 1 行と、新しい段の file crates/tsuzuri-boundary/tests/ageff.rs の 2 file。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。depends は空。

      なぜ。持ち主は 2026-10-05 に台帳の問い t3-hub.87.37 で案 1（推奨）を選んだ（裁定 id t3-hub.87.37:20261005T2102Z-1）。調べ係 rs2 の測りでは、器の M の行の起草係 2 体の新しい量（89.5 万と 94.9 万）のうち output が 29% と 25% で、output の字の 69% と 73% が考える量（thinking）だった。output は次の呼びで文脈に戻るので新しい量に 2 度数わり、考える量の分は新しい量の 3〜4 割の見立てになる。係の型は今は段の欄を書いておらず、席の段 xhigh を継ぐ。段を下げた時の質への効きは測られていないので、戻せる撃ち比べとして起草係の型だけを high に下げ、次の起草 2〜3 本の新しい量と審査の通り（gate の PASS と FAIL・指摘の数）を xhigh の起草の行と比べ、質が落ちたら戻す行で xhigh に戻す。調べ役と検証役は事実の照らしと攻めの質を先に守るので xhigh のまま。

      形。drafter.md の頭の model の行の直後に、欄 effort を値 high で 1 行足す。researcher.md と verifier.md は替えない。Claude Code（2.1.289）の plugin の係の型の読み手は頭の欄 effort を読み、値は low・medium・high・xhigh・max か整数で、外れた値は警告して捨てる。plugin の型で無視される欄（permissionMode・hooks・mcpServers）に effort は入らない（調べ係 rs2 の notes の 5 節と係 w255a が binary の字で確かめた）。着地済みの歯 agpl_ の型の照らしは頭の name・description・model・skills だけを見て、ほかの欄を断らないので、欄を足しても緑のまま（試作の木で 5 本が緑・器の共通 verify が撃つ）。

      done と verify の対応。1 番目の項は verify の 1 行目、2 番目と最後の 3 番目の項は 3 行目（新しい段の file tests/ageff.rs の歯 ageff_）で測る。2 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので verify に書かない。欄 done-teeth は番号つきの項ごとに歯を名指し、1 番目は verify の 1 行目（@1）、2 番目と 3 番目は新しい段の file の歯の名。入口の赤は、main の drafter.md に欄が無いので 2 番目の項の歯が落ち、3 番目の項の歯も欄を崩す見本が今の file と同じになって落ちる（3 行目が rc 100）。

      歯と噛み。新しい歯は段の file tests/ageff.rs の 1 本で足し、群の main.rs と module は書かない（判断の記録 ADR-32）。型の定義は Claude Code が係を起こす時に読む設定の字で、歯から係を起こして段を測れないので、歯は頭の欄の字を照らす。欄は頭の --- の間だけで数え、本文の末へ動かした見本で頭の外の字を数えない事を測る。否定の見本は今の file から句を 1 つだけ崩す。噛みは係が撃った（変異 11 と対照 1・変異は全部 rc 100・表は係 w255a の notes.md の 2 節）。

      U と範囲の外。段を下げて考える量がどれだけ減るか（I）と、審査の通りへの効き（U）は、この行の後の起草で席が測る。比べの基と判じの物差しは席の手元の表で持ち、契約の行にしない。戻す行は drafter.md の欄の値を xhigh に替え、歯 ageff_ の望む値の表の値と否定の見本の値を入れ替える（歯の名は替えない）。席の段と調べ役と検証役の段、code の意味の道（rust-analyzer）は替えない（同じ問いの案 2 は選ばれていない）。
  - n: 5
    type: prose
    title: 行 h-host-core — host の負荷と書きの電文の型と中核の読みと注意の線（規則の行 R-42）
    body: |
      done と verify の対応。1 つ目の項は verify の 1 行目、2 つ目から最後の項は 3 行目（段の file crates/tsuzuri-core/tests/hload.rs・接頭辞 hload_）で測る。2 行目の clippy は lint の落ちが無いことを命令の rc で測る守りで、done の項にしない。xtask の check は器の共通 verify が撃つので verify に書かない。

      在りか。差の file docs/design/patch/h-host-core.patch（30,213 byte・git diff --full-index・5 file・足す 742 行）は、main 4522db99 に同じ commit の規則の行 R-42 を足した土台の commit 81c319c8 と、試作の commit 24a4b0c6（写しは起草の置き場の try-w257a・係 w257a）の差。新しい file は契約の型の crates/tsuzuri-contract/src/host.rs（103 行）と中核の crates/tsuzuri-core/src/hostload.rs（307 行）と段の file crates/tsuzuri-core/tests/hload.rs（329 行）で、2 つの lib.rs は module の行と中核の頭の doc の 1 行を足すだけ。土台の木で git apply --check、試作の木で git apply --reverse --check がどちらも rc 0。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      なぜ。持ち主の裁定 t3-hub.77.28（裁定 id t3-hub.77.28:20261005T2102Z-1・案 1・推奨どおり）は、host の負荷と SSD の負荷を project の board の帯の印と窓と account board の HOME の block に出し、摩耗は root の timer が書く file から読み、色の線は新しい規則の行に置くとした。行は 5 つと器の行 1 つに割り、この行は電文の型と、字を値にする中核の純粋な関数と、注意の線の判じを持つ（中核は file も子 process も時計も触らない）。判じは 1 つの関数 over だけに置き（条 P-21）、server も面も判じ直さない。線の値は同じ commit で足す規則の行 R-42 で、中核の定数がそれを写し、歯が規則の表の行の字を読み直して比べる（前例は規則の行 R-37 と面の定数 QUEUED_WARN_S の歯）。値の正本が規則の表の字なので、振る舞いでなく字で照らす。

      形。電文 HostDoc は組んだ時刻・負荷（1・5・15 分の load の 100 倍と動いている cpu の数）・詰まり（PSI の cpu の some と memory の full と io の full の avg10 と avg60 の % の 100 倍）・メモリ（全体と使える量と swap の全体と空きの byte）・上限を持つ scope（埋まりの多い順に 5 つまで）・装置（host の面の書きの測りの表の順・書きの速さ byte/s と摩耗）・線を越えた測り（Load・Io・Memory の順）。値は整数で持ち、浮動小数を電文に置かない（型が等しさを持てる）。読めない材料はその欄だけ Unknown（条 P-7）。摩耗は表の行が記録の path（key wear）を持たなければ欄が無く、持って読めなければ Unknown。摩耗の記録は root の timer が 1 日 1 度 smartctl -j -a の JSON を誰でも読める file に書く物で（持ち主が入れる・repo の外）、その path は host の面に置く（条 N-7）。今の器は表の key を name と stat に閉じているので、key wear を器が受ける行は別の器の行 v-wear-key で、それが着地するまで持ち主は key を書かない。書きの速さは境界が前の読みとの差を rate で導いて渡す。表の読みは中核の account の host.rs と境界の端末の表の読みと同じ自前の行の読みで、TOML の部品を足さない（条 P-26）。

