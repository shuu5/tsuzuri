  - n: 3
    type: prose
    title: 行 t-run-cap-off — 器への宣言から器を書く便の同時 1 本の床を外す（判断の記録 ADR-64 の決定 (2)(3)）
    body: |
      在りか。差の file docs/design/patch/t-run-cap-off.patch（6,669 byte）は、main 996f81b5（行 v-roots の着地 785543ae の後）と、その上の試作の commit ef41740e（tree 71c4622f・写しは drafts の try-w258a の branch w258a・係 w258a）の差（3 file・+63 −52）。係 w254a が main 4522db99 で切った差を、v-roots の着地の後の main に当て直して切り直した（.vessel.toml の blob の字が替わっただけで、hunk の字は同じ）。.vessel.toml の末の注 3 行と run-cap = 1 と run-cap-paths の 1 行を外し、着地した段の file xtask/tests/onevd.rs（行 t-run-cap-on の歯）を消し、段の file xtask/tests/rcoff.rs（群の main.rs と kfold.rs は書かない）を足す。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 項目は verify の 1 行目、2 項目と 3 項目は 3 行目の nextest（--test rcoff の rcoff_）が測る。2 行目の clippy は歯の file の lint。歯の file xtask/tests/onevd.rs が木に無いことは、1 行目の逆向きの当たりが測る（消す hunk の逆は file を作るので、file が在ると当たらない）。

      依存と順。depends は書かない。この行は器の code を書かないので、器を書く便の数に入らない。流す時機は判断の記録 ADR-64 の決定 (2)(3) で、席は決定 (3) の観る 1 回を確かめ、便の直列の詰まりの memo（t3-hub.89）の notes に記帳してから、この行の便の bead を起こす（toml の depends は時機を持てず、起票の後に hold を置くと起票と hold の間に起こされる隙が在る）。同じ .vessel.toml を書く未着地の行 t-scope-on（ノート surface-wave29c・constitution の行の後に 3 行を足す）と、器の行 v-scope-paths（.vessel.toml を書かない）とは、main 996f81b5 の一時の index に単独と全部の順で当てて同じ木になる（係 w258a の commute.log）。どれが先に着地してもよい。

      なぜ。判断の記録 ADR-63 の決定 (13) は、器を書く便を同時に 1 本までにする床を宣言の 2 つの鍵に置き、外す時も行で外すとした。判断の記録 ADR-64 は外す時機を、v-roots の着地の後に追随の撃ち直しを 1 回観た時にした。器は 2 つの鍵を任意の鍵として読むので、鍵の無い宣言は床の無い形で、器の受付を止めない。

      形。.vessel.toml の build-lanes = true の行の後の 5 行（注 3 行と鍵 2 行）を外し、file の末は build-lanes = true の行になる。行 t-run-cap-on の歯 onevd_ は 2 つの鍵の在ることを断言するので、鍵を外すと落ちる。その歯の file を消し（write-set の ~）、外したことを断言する歯を足す。

      歯と噛み。段の file xtask/tests/rcoff.rs は、字 run-cap を含む行を注の行も数えて拾う。後の行が宣言の注で run-cap の名を引くと、この歯が落ちるので、宣言の注で run-cap を名指さない（行 t-scope-on の注も書かない）。宣言の file の字を照らすのは、宣言の鍵の在る無しは器の振る舞い（受付と列の待ち）でしか見えず、それを測るには器の binary と live な便が要るためである。噛みは句ごとに 8 変異（宣言の末に run-cap = 1 の行・run-cap-paths の行・注の 1 行を戻す・schema の行を 2 度書く・拾いを注でない行に絞る・key の名の完全一致にする・前後の空白を除かない・最後の行だけを見る）で、名指しの歯が全部 rc 100（係 w254a の bite.tsv・歯の file の blob eae2b0fa は係 w258a の切り直しでも同じ）。

      範囲の外。器の code（run-cap を読む器の行 v-one-vessel の部品）は替えず、ほかの project も使える任意の鍵として残る。要件 FR1068 は器の dispatcher の振る舞いを書くので替えない。穴を塞ぐ行 v-scope-paths と t-scope-on はノート surface-wave29c に在り、塞ぐまでの席の門は判断の記録 ADR-64 の決定 (4) が持つ。
