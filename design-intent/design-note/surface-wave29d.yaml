    body: |
      在りか。差の file docs/design/patch/v-wline-c.patch（15,683 byte）は、main 4522db99 に行 v-wline-b の差を当てた試作の commit 9025565d（tree 0b0626fa）と、その上の試作の commit 65c42760（tree d01ea84a・写しは drafts の try-w256a の branch w256a-c・係 w256a）の差（器の 2 file・足す 231 行・消す 1 行）。字を書き替える file は器の crates/scribe2/src/hook/mod.rs（838 → 866 行）と歯の tests/e2e/hook/group.rs（493 → 695 行）。土台の木で git apply --check、試作の木で git apply --reverse --check がどちらも rc 0。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      なぜ。書き込みの線を越えている間は、席が prompt を受けるたびに知らせの 1 行を席の文脈に添える（器の設計 write-budget.md §7・持ち主の線は行 v-wline-b の節）。入力欄へは何も送らない（差し込みの閉じた列 FR1044 を増やさない）。黙った席にも次の heartbeat の合図の turn で届く。

      形。hook/mod.rs の dispatch の UserPromptSubmit の枝で、群の段の行（group の lines）の後ろに私有の関数 write_budget_lines を 1 つ呼ぶ。--pane が空でない周だけ行 v-wline-b の判定の 1 本 judge を置き場・--rules・今で撃ち、over が - でない表の行（day・avg・day,avg・no-rule）ごとに、頭が write-budget とコロンで key が name・over・today・yesterday・avg・streak・owner の順の値と定型の文（器は作業を止めない・持ち主への札は owner=yes の周に消費側の板が出す）を持つ 1 行を宣言順に stdout へ足し、出した行ごとに同じ mod.rs の record と record_lines で注入の記録 1 行（who hook:user-prompt-submit・what write-budget・when UserPromptSubmit）を残す。行 v-wline-b の file は書き換えない。越えない周・表の無い置き場・読めず越えの値が無い周・pane の無い呼び出しは 0 byte で、SessionStart の brief には足さない。

      done と verify の対応。1 番目の項は verify の 1 行目、2 番目から 5 番目の項は 3 行目（接頭辞 prompt_write_budget_ の 4 本）、6 番目の項は 4 行目と 5 行目（変わらない群の歯 2 本）で測る。verify の 2 行目（器の 2 crate の clippy）は lint の落ちが無いことを命令の rc で測る守りで、done の項にしない。xtask の check は器の共通 verify が撃つので verify に書かない。

      歯と噛み。歯は群の歯の fixture（偽 tmux の席・群の面）に表を足し、記録を設計 §4 の形で歯が組んで置く。歯の接頭辞は設計の hook_write_budget_ でなく prompt_write_budget_ にした（ほかの行の verify の filter の語 hook_ を部分の字として含めない・器の審査で 3 度落ちた所の 3 つ目）。send-keys の数は、呼び出しを 1 行ずつ log に残す偽 tmux で数える。base で RED の理由は機能不在（base の hook は書き込みの行を出さない＝2 番目と 4 番目の項と、3 番目と 5 番目の項の対照が落ちる）。噛みは係が撃った（hook の変異 4・全部 rc 100・名指しの歯 1 本ずつ・書き戻した後の status は空）。pane を見ない変異と over の - も出す変異で 3 番目の項、注入の記録を残さない変異と行を群の行の前に置く変異で 2 番目の項の歯が落ちた。

      依存と順。depends は v-wline-b（この行の code が行 v-wline-b の判定の 1 本 judge と判定の値 Verdict を呼ぶので並べられない）。器の code を書く行なので器の列（同時 1 本）に入る。着地の後に PATH の器の binary を入れ替える（席の hook は PATH の binary）。

      範囲の外。入力欄への差し込み（FR1044 の改訂が要る）。越えた日に器が台帳へ memo を起こす口（設計 §8 の却下）。
