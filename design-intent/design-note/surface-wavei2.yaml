  - n: 3
    type: prose
    title: 行 i-1b — 端末の一覧の読みに画面を開く env の欄 display-env を足す
    body: |
      なぜ。要件 FR16 は、席が端末の一覧（器の宣言の行・名・ssh の宛先・Chrome の場所・画面の環境・入力の環境・専用の profile・OS）から端末の名で命令するとする。判断の記録 ADR-15 の決定 (1) は、どの PC が在るか（層 A）を器の host の面の端末の表 [[device]] に置く。器の答え S2-2（2026-09-28・台帳 t3-hub.59 の notes）は、display を X の DISPLAY としてだけ読み、Wayland の画面の端末は器が欄 display-env を足すまで範囲の外とした（器の memo s2-07l.726）。器はこの欄を着地させ（器の判断の記録 ADR-0080・器の設計 host-init.md の 17 節）、2026-09-28 に PATH の器の binary が 8dd964f に入れ替わった（scribe2 --version の字 8dd964f937d6・この binary の validate が display-env を知る）。いま着地済みの行 i-1 の読み手は display-env を閉じた集合の外の key として断るので、器が受ける Wayland の端末の行を tsuzuri が断る。この行は、計画 surface-plan（v0.14）の 9 節の計画だけの行 i-1b のとおり、読み手の閉じた key の集合に display-env を足し、display と display-env を両方持つ行を端末の名と key を名指して断る。起動の env に組むのは後の行 i-2 で、この行は読みと断りだけを持つ。
      器の形（器 main 8dd964f の crates/scribe2/src/rules/device.rs と rules/manifest.rs で確かめた・器の歯は接頭辞 host_device_display_env_ の 3 本）。器の KEYS は 8 つ（name・ssh・chrome・os・display・ime-env・profile-dir・display-env の順・必須は name・ssh・chrome・os のまま）。display-env の値は 1 行の字の配列で、要素はどれも KEY=VALUE（最初の = で分け、VALUE の中の = は VALUE に残る）。検めは ime-env と同じ 1 つの関数 env_pairs で、KEY は空でなく英大文字と数字と下線だけで先頭が数字でなく、VALUE は空でなく、同じ KEY の 2 度を断る。器の Device は display_env（KEY と VALUE の組の列・宣言の順・欄が無ければ空）を持つ。display と display-env を両方持つ行は、display-env の行の番号で 1 件、字 display と display-env は同じ行に書けない（DISPLAY は display-env に書く）で断る（X の画面も display-env の要素 DISPLAY=:0 で書ける）。空の配列は ime-env と display-env のどちらも、器の読み手が字 配列が空である で断る。器は値を読んで形を守るだけで使わない。席は PATH の器の binary（8dd964f）の scribe2 rules validate --state-dir で次を確かめた。下の節の字の fixture から表 account-group の 2 行を除いた本文は rc 0（account-group の行は器の必須の anchors と accounts を持たないので、fixture の全体は器の validate が断る・行 i-1 からの形でこの行は変えない）。その本文の term-a の display の行の後に要素 DISPLAY=:0 の display-env の行を足すと rc 1 で上の両方の断りの 1 件だけ、空の配列の display-env の行を足すと rc 1 で空の配列の断りの 1 件だけ。display の値を字 wayland-1 にした本文は rc 0（器は display の値の形を見ない・X の形でない display を断るのは tsuzuri の読み手だけで、行 i-1 と器の答え S2-2 のまま）。
      在りか（main cbaa244 で確かめた・行 i-1 の着地 c43cae0 の後に src/stage/terminal.rs と tests/stterm.rs と fixture を書いた commit は無い）。src/stage/terminal.rs は 261 行で、pub const HEADER（字 [[device]]）・pub const FACE（字 host.toml）・pub const KEYS（[&str; 7]・字 name・ssh・chrome・os・display・ime-env・profile-dir の順）・pub enum Os（Linux・Macos・Windows と ALL と word）・pub struct Terminal（pub な欄 name・ssh・chrome・os・display〔Option の String〕・ime_env〔Vec の String と String の組〕・profile_dir の 7 つ・derive は Debug と Clone と PartialEq と Eq）と、私の fn rows・entry・quoted・row_name・refuse・x_display・ime_pairs・check と、pub fn names・lookup・read_face を持つ。fn check の Err の字は fn refuse が組む 1 行で、字 端末 と引いた名と字 の と、断った key を角括弧 1 組で囲んだ字と、理由と、末の字（器の host の面の [[device]] の行を直す）をつなぐ。fn check は引いた行を次の順で検める。行ごとに、= の無い行は字 は = の無い行、KEYS の外の key は字 は端末の行の欄でない（器の閉じた集合の外・欄を足さない）、同じ key の 2 度は字 が 2 度在る、ime-env でない key の値が引用符 1 組で囲んだ空でない字でなければ字 の値 V は引用符 1 組で囲んだ空でない字でない。その後に ssh・chrome・os の欠け（字 が無い）、ssh の空白か字 - の頭、os の語、display の X の形（字 : の後に 10 進の数字・後ろに字 . と数字が続いてもよい）でない値（理由の字は の値 V は X の DISPLAY の形でない（Wayland の画面の環境は器の欄 display-env を待つ））、profile-dir の欠け、ime-env の形（fn ime_pairs が 1 行で閉じた角括弧の中のコンマで分けた引用符 1 組の字の列を KEY=VALUE に分け、外れれば理由の字 の値 V は 1 行で閉じた KEY=VALUE の字の配列でない（KEY は英大文字と数字と下線で先頭が数字でない・VALUE は空でない・KEY は 1 度だけ））。tests/stterm.rs は 370 行で、test の属性の付いた fn の stage_term_ の 10 本（shape_and_words・reads_fixture_rows・names_in_order・reads_face_file・unknown_or_twice_refused・profile_dir_required・display_x_only・value_forms_refused・pure_reader・own_names_clean）と、const FILTER_WORDS（[&str; 111]）・const FORMS（[(&str, &str, &str); 14]・1 つ目は display の行 display = :0〔値は引用符で囲む〕を display-env の行〔要素 A=1 の配列〕に替え角括弧で囲んだ display-env を待つ）・fn fixture・fn edited（fixture の字の最初の一致を替え、一致が最後の [[device]] の見出しより前に在ることを見る）・fn term_a と fn term_b（7 つの欄の struct の字）・const LOOKUP・fn refused・fn workdir を持つ。stage_term_shape_and_words は KEYS が 7 つの字にちょうど等しいことを、stage_term_display_x_only は X の形でない 6 つの display の値の Err が字 term-a と字 display-env を含むことを、stage_term_value_forms_refused は FORMS の各通りの Err が名と角括弧で囲んだ名指しの字を含み KEYS のほかの key を角括弧で囲んだ字を含まないことを、stage_term_own_names_clean は名の数が 10 であることを見る。fixture の tests/fixtures/stage/terminals.toml は 21 行で、term-b の行は name・ssh・chrome・os・profile-dir の 5 行（値は term-b・me@term-b・/fake/bin/chrome・linux・/fake/profile-b）。main の workspace で、字 terminals.toml と字 stage::terminal を持つ歯の file は tests/stterm.rs だけ（grep で確かめた・行 i-3 の tests/stcdp.rs と src/stage の cdp.rs・json.rs・ws.rs は terminal を使わない）。要件書の受入 AC13 の red_test はこの fixture を名指し、端末の行 2 つ（ssh の届く行と届かない行）を持つとする（この行は行の数を変えない）。
      形（境界・src/stage/terminal.rs）。file の頭の doc の 1 行目に、行 i-1b で画面を開く env の欄 display-env を足した旨を足す。KEYS を [&str; 8] にし、末に字 display-env を足す（器と同じ順）。私の const ENV_KEYS（[&str; 2]・字 ime-env と display-env・値が 1 行で閉じた KEY=VALUE の字の配列の key）を置く。Terminal の末に pub な欄 display_env（Vec の String と String の組・宣言の順）を足し、struct の doc に display と display-env は同じ行に無い旨を足す。fn ime_pairs を fn env_pairs に改名し（中身は変えない・doc を ime-env と display-env の値にする）、ime-env と display-env の両方の形をこれで見る（器と同じく 1 つの関数）。行ごとの検めの、引用符 1 組で囲んだ空でない字を求める key を、ENV_KEYS の外の key にする。os の語の検めの後に、行が display の行と display-env の行を両方持てば（display-env の値の形と空の配列かどうかによらず）、断った key を display-env とし、理由の字 は display と同じ行に書けない（画面は 1 つの欄で書く・X の画面も display-env に DISPLAY=:0 の形で書ける・器と同じ断り）の Err を返す。display の X の形でない値の理由の字の括弧の中を（Wayland の画面は display の行を除き、欄 display-env に KEY=VALUE の組で書く）に替える（字 display-env を含むまま・角括弧で囲んだ display-env は含まない）。ime-env の検めの後に display-env の形を env_pairs で見て、外れれば断った key を display-env とし、ime-env と同じ理由の字の Err を返す（ime-env の Err の字は 1 字も変えない）。Ok の Terminal の display_env は、欄が無ければ空の列。空の配列も ime-env と同じく空の列に読む（器の validate は空の配列を面ごと断る・行 i-5 がその rc 0 を読む前に確かめる・歯は display のない行の空の配列を見ない）。names と、lookup の名の引きと、知らない名と同じ名の 2 行の Err と、read_face は変えない。席の下書きで terminal.rs は 277 行（増え 16 行・大きさ S の 1 file の見積り 100 の内・受付の上限 1500 から遠い）。
      lookup の読み方（行 i-1 の (e) に 2 つを足した全部の順）。行ごとに = の無い行・KEYS の外の key・同じ key の 2 度・ENV_KEYS の外の key の値の形、の 4 つ。次に ssh・chrome・os の欠け、ssh の形、os の語、display と display-env の両方（この行）、display の X の形、profile-dir の欠け、ime-env の形、display-env の形（この行）。両方の断りを display の X の形より前に置くのは、X の形でない display と display-env を両方持つ行に、display の形を直す手でなく display の行を除く手を示すため。両方の断りが display でなく display-env を角括弧で囲むのは、器が display-env の行で断るのと同じにし、行 i-1 の決まり（Err は断った key だけを角括弧で囲む）を保つため（理由の字の中の display は角括弧で囲まない）。display-env の中身が画面の変数（DISPLAY・WAYLAND_DISPLAY など）を持つかは見ない（器も見ない・起動の env を組む行 i-2 が扱う）。要素の中にコンマを持つ値（例 VALUE にコンマ）は、器の読み手は引用符の内側のコンマとして 1 つの要素に読むが、この読み手は ime-env と同じくコンマで分けて形の外として断る（読み違えずに断る側・行 i-1 と同じく歯は見ない）。
      節の字（fixture）。tests/fixtures/stage/terminals.toml の term-b の行の os の行と profile-dir の行の間に、key display-env の 1 行（値は 1 行の配列で、引用符で囲んだ 2 つの要素 WAYLAND_DISPLAY=wayland-1 と XDG_RUNTIME_DIR=/fake/run-b をこの順に持つ）を足し、ほかの行は変えない（22 行になる・名も宛先も path も偽物で、どの host の値でもない・行 D-4）。term-a は X の画面の行（display）、term-b は画面を開く env の行（display-env）になり、後の行 i-2 が起動の env の 2 つの組み方を同じ fixture で snapshot にできる。受入 AC13 の 2 行（term-a を届く行、term-b を届かない行として偽の ssh の rc で決める）は変わらない。節の term-b の Terminal は name term-b・ssh me@term-b・chrome /fake/bin/chrome・os Linux・display None・ime_env 空・profile_dir /fake/profile-b・display_env は WAYLAND_DISPLAY と wayland-1 の組と XDG_RUNTIME_DIR と /fake/run-b の組をこの順。節の term-a の Terminal は行 i-1 の節の term-a の値に display_env 空を足したもの。
      節の表（done (5) の 10 通り・どれも fixture の term-b の display-env の行を丸ごと次の 1 行か 2 行に替える・どれも Err は角括弧で囲んだ display-env を名指す）。(1) 値を、角括弧で囲まず引用符で囲んだ字 WAYLAND_DISPLAY=wayland-1 にする（配列でない）。(2) 値を、要素を引用符で囲まない配列 [WAYLAND_DISPLAY=wayland-1] にする。(3) 要素 WAYLAND_DISPLAY だけの配列（= が無い）。(4) 要素 wayland_display=wayland-1 だけの配列（KEY が小文字）。(5) 要素 9W=wayland-1 だけの配列（KEY の先頭が数字）。(6) 要素 WAYLAND_DISPLAY= だけの配列（VALUE が空）。(7) 要素 =wayland-1 だけの配列（KEY が空）。(8) 要素 WAYLAND_DISPLAY=wayland-1 と WAYLAND_DISPLAY=wayland-2 の配列（同じ KEY の 2 度）。(9) 要素 WAYLAND_DISPLAY=wayland-1 の配列の閉じの角括弧を除く（1 行で閉じない）。(10) 元の display-env の行を 2 行続けて書く（同じ key の 2 度・理由の字 が 2 度在る）。
      着地済みの歯（行 i-1 の tests/stterm.rs は write-set で、4 か所だけを直す）。stage_term_shape_and_words の KEYS の期待は 7 つの字の配列で、KEYS が [&str; 8] になると型が合わず組めないので 8 つの字にする。fn term_a と fn term_b の struct の字は欄 display_env が無いと組めないので足す（term-a は空・term-b は節の 2 つの組・term-b の組は fixture の新しい行から来る）。FORMS の 1 つ目は、display-env が閉じた集合に入ると要素 A=1 の配列の display-env の行が Ok に読めて落ちるので、key を下線の字 display_env にして閉じた集合の外の key の断りを残す（字 [display_env] は字 [display-env] と別の字で、KEYS のどの key を角括弧で囲んだ字も含まない）。直さずに通る歯。stage_term_display_x_only は、X の形でない display の理由の字が字 display-env を含むままで通り、term-b の Ok は新しい term_b と比べる。stage_term_profile_dir_required は term-b の profile-dir の行を除いた本文で字 term-b と字 profile-dir を含む Err を待ち、display-env の形の検めは profile-dir の欠けより後なので同じ Err になる。stage_term_unknown_or_twice_refused が足す 2 つ目の term-a の行は display-env を持たない。stage_term_names_in_order と stage_term_reads_face_file は名と file の字だけを見る。stage_term_pure_reader の 6 つの字はこの行の直しに無い。stage_term_own_names_clean の 10 の名はこの行で変わらない。席の下書き（repo の外の写しで、rustc 1.98 の edition 2024 で lib と歯を組み、clippy-driver を警告を誤りにして撃った）で、stage_term_ の 10 本と denv_ の 5 本が通り、denv_ の歯は main の terminal.rs では組めない（欄 display_env が無い）ことを確かめた。xtask の check は build と歯の全部と clippy（全部の target・警告を誤りにする）と面の wasm の clippy を撃つ。傘の行 i の verify の filter の語 stage_ は stage_term_ の歯を選び、denv_ の歯を選ばない（傘は器に流さない行）。tests/brand.rs の brand_path_written_once_in_contract は src の下の引用符で囲んだ /api/ の字を見て、この行は足さない。xtask の skeleton_ の歯は Cargo.toml と Cargo.lock を読み、この行は触らない。
      測り方。新しい歯の file は境界の crate の tests/stdenv.rs で、名を denv_ で始める（名は denv_key_and_pairs_read・denv_x_screen_as_env・denv_both_refused・denv_pair_forms_refused・denv_own_names_clean の 5 つ）。fixture は CARGO_MANIFEST_DIR の 2 つ上の tests/fixtures/stage/terminals.toml を読む。直した本文は、fixture の字にちょうど 1 つ在る字（term-b の display-env の行か、term-a の display の行）を字の置き換えで直して組み、歯はその字が fixture にちょうど 1 つ在ることを見る。期待の Terminal は歯が struct の字で組む（8 つの欄）。Err の字は部分の字で見て、字の全体と順は見ない。key の名指しは角括弧で囲んだ字で見て、同じ Err が KEYS の 8 つのうちほかの key を角括弧で囲んだ字を含まないことも見る。denv_own_names_clean は tests/stdenv.rs の字を読み、test の属性の行の次の fn の名を全部集め、下の filter の語を空白で区切った 1 つの字の定数（concat で組む）と照らす。
