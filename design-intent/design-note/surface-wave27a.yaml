  - n: 3
    type: prose
    title: 行 cs-types — 相談の窓の型と中核の骨
    body: |
      在りか。差の file docs/design/patch/cs-types.patch は main 5b1099ae（判断の記録 ADR-29 を発効させた木）に試作の commit 8747a2da（写し drafts/w83a・branch main）を載せて切った（9 file・30,418 byte・+810 −0）。契約の crate に module consult を足し、中核の crate に module consult と 4 つの子の module（finding・lines・quota・launch）を頭の注 1 行だけで置く。子の中身は後の行 cs-finding・cs-lines・cs-quota・cs-argv が書く。

      なぜ。判断の記録 ADR-29 は相談の窓を tsuzuri の plugin の機能として作り直し、所見の欄に話題と添え物を足し（決定 1 のウ）、台帳の相談の行の起こし手と経路の語を閉じた列にし（決定 4 と 8）、処分を採る・一部採る・採らない と添え物ごとの保存にした（決定 9）。後の 11 行（命令・hook・server・面）が同じ型を引くので、型を先に 1 つの行で置く。

      形（要約・字は差の file）。(a) id の形。窓 WindowId は cw と 1 以上の数、所見 FindingId は窓の id と - と 1 以上の数、頼み RequestId は rq- と UTC の分の字（minute_ok・14 字）と - と 1 以上の数で、どれも頭の 0 を断り、電文では字（serde の try_from と into）。窓の名 name は consult-cw<n>（tmux の窓・作業場の dir・--name）、退いた作業場の名 retired_name は retired-consult-cw<n>。どの id も器の引用の形（<bead id>:<分>-<n>・batch:・policy:・user と時刻）に当たらない（字 : を持たない）。(b) 閉じた語。trait Word（ALL・word・from_word）を形 Form・起こし手 Starter・経路 Via・採否 Verdict・窓の状態 WindowState に持たせる。語は台帳の行と一覧に出す日本語の字で、電文の字は英小文字。候補の採否 Adoption（adopted・rejected）と確かさ Confidence（verified・deduced・inferred・uncertain）と添え物の種類 AttachmentKind（report・program・result）は電文の語だけを持つ。(c) 所見の file の形は JSON。窓が書く草稿 FindingDraft は 12 欄（DRAFT_FIELDS の順に topic・model・bundle_digest・conclusion・options・recommendation・basis・claims・ask_owner・touches・attachments・sandbox_denials）で、所見 Finding はそれに所見の口が埋める id・window・date を足した 15 欄。どちらも知らない鍵を断る（deny_unknown_fields・flatten は deny と組めないので欄を 2 つの struct に書く）。(d) board の口の電文。口の path は PATH（/api/consult）・UNRECEIVED_PATH（/api/consult/unreceived）・REQUEST_PATH（/api/consult/request）。頼み ConsultRequest（topic は省ける・form・model）・未受け ConsultUnreceived（findings と requests の id の列）・席の問う窓の数 SeatQuota（today・live）・一覧 ConsultBoard（windows・findings・requests・quota の 4 つの段がそれぞれ Reading）。

      保存の写し先（処分の口の --into に合わせる）。保存する添え物の写し先は、写し先の木の根からの相対の path だけを kept_path（KEPT_DIR の docs/consult/kept と所見の id と添え物の path）で決める。どの木の根に写すかは型に持たせず、後の行 cs-show の処分の口が引数 --into <木の根>（省けば --repo）で受ける（tsuzuri の席は設計の写しの木を渡し、公開の走査は席の commit の門が持つ）。添え物の path は作業場からの相対（行 cs-finding が形を検め、作業場の下に実在するかは所見の口が確かめる）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 つ目から 6 つ目の項は verify の 3 行目（cwty_ の 7 本）、最後の項は 4 行目（xtask の check・歯の全部を撃つ）。done の項は歯が測る物だけにした。verify の 1 行目（git apply --reverse --check）は差の file の hunk が全部木に在ることを、2 行目（cargo clippy -p tsuzuri-contract -p tsuzuri-core --all-targets --no-deps -- -D warnings）は clippy の落ちが無いことを、命令の rc で測る守りで、done の項にしない。

      構造の連鎖（main 5b1099ae で grep）。consult の名の module は契約と中核の crate に無い。足すのは lib.rs の pub mod の 1 行ずつ（契約は case の次・中核も case の次）と中核の lib.rs の頭の注の 1 行だけで、ほかの file の字は替えない。契約の lib.rs の id_shape と IdError は使わない（窓と所見の id は数の欄を持つ型にした）。

      試作と噛み。写しの main 5b1099ae の上の試作で、契約と中核の crate の clippy（--all-targets --no-deps・-D warnings）が rc 0、歯 cwty_ の 7 本が通る。xtask の check は rc 0（workspace の歯 3,030 本・size は file-lines 1348/1500・core-lines 7145/20000）。噛みは変異 7 つ（頭の 0 を通す・分の字の Z と T を見ない・経路の語 完了 を替える・所見の id の区切りを替える・所見の未知の鍵を通す・草稿の欄の名を替える・保存の dir を替える）で、7 本の歯のどれも少なくとも 1 つの変異で落ちる（対照の撃ちは全部通る・どの変異も rc 100）。歯の名から接頭辞を除いた字は、main の契約表の verify の filter の語 403 のどれも含まない。

      流す時と順。depends は空。同じノートの行 cs-finding・cs-lines・cs-argv はこの行の骨の file を書き替えるので、この行の後（波 1）。

      範囲の外。所見の欄の検め・台帳の行の字・数え・起動の組みの中身（後の 4 行）。tz consult の命令と hook と server の口と面（後の行 cs-open から cs-pop）。board の一覧の材料の読みと時刻の換え（行 cs-server）。
  - n: 4
    type: prose
    title: 行 cs-finding — 所見の欄の検め
    body: |
      在りか。差の file docs/design/patch/cs-finding.patch は、main 5b1099ae に行 cs-types の試作 8747a2da を載せた木（行 cs-types の着地の見立て）に試作の commit 01643b92（写し drafts/w83a）を載せて切った（4 file・13,094 byte・+305 −1）。中核の src/consult/finding.rs の骨の注 1 行を中身に替え、fixture の dir tests/fixtures/consult/finding-2/ に complete.json と missing.json を足す。

      なぜ。判断の記録 ADR-10 決定 (3) は所見の欄（結論・候補と採否・推奨・根拠の id・主張ごとの確かさ・持ち主に問うべき事・触る節点・使った model・読んだ束の要約値）を出す口が検め、欠けていれば受けないと決め、ADR-29 決定 (1) のウが話題と添え物を足し、決定 (8) が所見の口に添え物が作業場の下に在ることを確かめさせる。受入 AC16 は欄を 1 つ欠いた所見と揃った所見の 2 つ（fixture finding-2）で断りを見る。撤退の条件 (3) の材料として、囲いに断られて困った事の欄 sandbox_denials を足す（空の列でよい）。

      形（要約・字は差の file）。check（草稿の字を受け、FindingDraft か断り Refusal を返す）。順は (a) JSON の object でなければ NotObject、(b) DRAFT_FIELDS の順に、鍵が無い・null・空白だけの字の欄の名を集めて 1 つでも在れば Missing（列の欄は空の列でも欠けでない）、(c) 知らない鍵を字の順に集めて Unknown、(d) serde で読めなければ Shape（serde の理由の字）、(e) 候補が 2 未満か採る候補が 1 つでなければ Options、(f) 添え物の path が path_ok でなければ Path（その path の字）。path_ok は、空・/ で始まる・~ で始まる・/ で切った段に .. が在る・制御の字・逆斜線・字「・」・字「、」を断る（字「・」と「、」は台帳の処分の行の区切り）。断りの字（Display）は、欠けた欄 と半角のコロンと空白と名の列（, と空白で区切る）・知らない欄 と同じ形・所見の草稿が JSON の object でない・欄の形が違う と理由・候補は 2 つ以上で採る（adopted）のは 1 つ・添え物の path が作業場からの相対でない と path。中核は file を触らないので、添え物が作業場の下に実在するか（canonicalize）は後の行 cs-answer の所見の口が確かめる。

      fixture。complete.json は 12 欄が揃った草稿（題 fx-hub.7・候補 a を採り b を採らない・主張 2・添え物 work/report.md と work/probe.py・ask_owner と sandbox_denials は空の列）。missing.json は complete.json から bundle_digest の行だけを除いた字。host の path と口座の名を書かない。後の行 cs-answer の歯もこの 2 つを読む。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 つ目から 6 つ目の項は verify の 3 行目（cwfnd_ の 6 本）、最後の項は 4 行目（xtask の check・歯の全部を撃つ）。done の項は歯が測る物だけにした。verify の 1 行目（git apply --reverse --check）は差の file の hunk が全部木に在ることを、2 行目（cargo clippy -p tsuzuri-core --all-targets --no-deps -- -D warnings）は clippy の落ちが無いことを、命令の rc で測る守りで、done の項にしない。

      構造の連鎖。finding.rs は行 cs-types が骨（頭の注 1 行）で置き、中身はこの行だけが書く。使う型は契約の consult の Adoption・DRAFT_FIELDS・FindingDraft だけ。check と path_ok と Refusal を呼ぶ所は今の木に無い（後の行 cs-answer が呼ぶ）。

      試作と噛み。試作の木（main 5b1099ae と行 cs-types とこの行）で中核の crate の clippy（--all-targets --no-deps・-D warnings）が rc 0、歯 cwfnd_ の 6 本が通る。xtask の check は rc 0（workspace の歯 3,036 本）。噛みは変異 7 つ（欠けの字を空白で見ない・欠けの理由の字を替える・知らない鍵を通す・採る候補 2 つを通す・.. の段を通す・uncertain を断る・欠けの列を逆にする）で、6 本の歯のどれも少なくとも 1 つで落ちる（どの変異も rc 100・対照は全部通る）。

      流す時と順。depends は cs-types（骨の file と型）。同じ波の行 cs-lines・cs-argv と書く file が重ならない。

      範囲の外。所見の file を書く口と番号の増やし方と作業場の下の実在の確かめ（行 cs-answer）。所見を読む口と処分（行 cs-show）。
  - n: 5
    type: prose
    title: 行 cs-lines — 台帳の相談の行の字と置き場
    body: |
      在りか。差の file docs/design/patch/cs-lines.patch は、main 145db064（行 cs-types と cs-argv が着地した木）に試作の commit d047da07（写し drafts/w93a・係 w83a の試作 745ad5f8 の差に第 0.11 版と第 0.15 版の直しを足した）を載せて切った（2 file・41,963 byte・+1200 −1）。中核の src/consult/lines.rs の骨の注 1 行を中身に替える。

      なぜ。判断の記録 ADR-29 決定 (4) は、相談の bead を起こさず、台帳の型付きの行（頭が相談の で始まる閉じた 6 つ）で記帳し、置けるのは memo と根の bead だけで、開いた問い（版の要約値が notes を含む）と契約の bead に置かないと決めた。決定 (8) は見張りが固定の 1 行を出して席を起こすと決めた。器の席の答え（memo t3-hub.75）の注意 (a) は行の本文に器の引用の形（user と時刻・batch: ・policy: ・問いの id と分と数の並び）を書くと裁定の引用として数えられること、(b) は memo の notes の 8192 byte の上限、(c) は memo の notes が memo の審査の材料になること。この行は字と置き場を純な関数にし、書く口（後の行）が同じ関数を引く。

      行の字の段（6 つの見本・render の字）。

      相談の頼み = rq-20261003T1412Z-1・題 = t3-hub.75・形 = 話す・model = fable・起こし手 = 持ち主の button・時刻 = 20261003T1412Z

      相談の開き = cw3・形 = 話す・題 = 題なし・起こし手 = 持ち主のチャット・発話 = 20261003T1410Z・model = fable・念入りさ = xhigh・結果 = 開いた・時刻 = 20261003T1412Z

      相談の所見 = cw3-1・窓 = cw3・題 = t3-hub.75・時刻 = 20261003T1530Z

      相談の受け = cw3-1・経路 = 見張り・時刻 = 20261003T1530Z

      相談の処分 = cw3-1・採否 = 一部採る・理由 = 前提の 1 つが古い・保存 = work/report.md・不保存 = work/a.py、work/b.csv・時刻 = 20261003T1602Z

      相談の閉じ = cw3・起こし手 = 席・所見 = 2・時刻 = 20261003T1800Z

      形（要約・字は差の file）。(a) Line は 6 つの variant（Request・Open・Finding・Receipt・Disposal・Close）。開きの起こし手 By は Seat・Chat（発話の分の字）・Button（頼みの id）、受けた物 Subject は所見か頼み。render は頭と「 = 」と主の id の後に「<名> = <値>」の欄を「・」で区切って並べ、時刻は分の字（前に user を付けない）。自由な字（題・model・念入りさ・理由）は free で整え（字「・」を「／」に・制御の字を空白に・前後の空白を除く・題と model と念入りさは WORD_MAX の 40 字・理由は REASON_MAX の 80 字）、題が空なら NO_TOPIC の 題なし、保存と不保存の path の列は字「、」でつなぎ空なら NONE の なし。最後に cited が真なら書かずに LineError::Cited。read は render の逆で、render が書く欄を全部見て（頼みの行は起こし手が持ち主の button の時だけ・所見の行は窓が所見の id の窓の時だけ読む）、欄が 1 つでも欠ければ読まない。scan は notes の行ごとに read する。(b) cited は、字「:」の後に分の字と字「-」と数字（裁定 id の形）・字 batch: ・字 policy: ・字 user と空白の後に数字・導出グラフの TYPED_LINES の 3 つの頭（行頭に限らず字の中）・配達の印の頭 MARK_PREFIX のどれかで真。行は相談の で始まるので TYPED_LINES の行頭の照らしに当たらない。頼みの id は字「:」を持たないので当たらない。器の注意 (a) の 4 形（裁定 id の形・batch: ・policy: ・user と時刻）を断り、許すのは裸の bead id だけ。裸の bead id（t3-hub.75.1 のように字「:」と分と数の無い問いの id）は、器の席の答え（器の引用の読みは <問い id>:<分>-<n> まで揃った字だけ）のとおり引用に数えないので、題の欄に開いた問いの id をそのまま書く（置き替えない）。(c) home_of（台帳の LedgerItem の列・題・足す字）。根 root_of は種類 epic・親が無い・closed でない bead の id の自然な順で最初（境界の server/policy.rs の root_epic と同じ決まりを中核に置く）。題が台帳の bead なら、その bead から親を上へたどり（題が memo ならその memo）最も近い label intake:memo の bead に置く。たどりは台帳の bead の数を越えたら止める。memo の notes の byte と足す字の byte と 1（改行）の和が NOTES_MAX の 8192 を越えれば根に置き、足す字は Home::line で末に ・memo = <memo の id>（notes が満ちた）を足した字。根の notes の長さは見ない（器の席の答え Q-V3・notes の上限は器の rules 行 memo.notes_max_bytes の memo だけで、epic と契約には無い）。断りは根の epic が無い時の HomeError::NoRoot だけ。(d) unreceived（行の列・作業場に在る所見の id の列）は ConsultUnreceived を返す。(e) notice（事象・tz の解き方の命令の字）は次の固定の 1 行の段の字を返す。

      固定の 1 行の段（tz の解き方の命令の字が /x/tzw の時）。

      相談: 窓 cw3 の所見 cw3-1 が届いた（/x/tzw consult show cw3-1 --via 見張り）・「/x/tzw consult watch」を背景で置き直す

      相談: 窓 cw4 の所見 cw4-2 が届いた（/x/tzw consult show cw4-2 --via 完了）

      相談: 頼み rq-20261003T1412Z-1 が届いた（/x/tzw consult open --request rq-20261003T1412Z-1 --by button）・「/x/tzw consult watch」を背景で置き直す

      相談: 問う窓 cw4 が所見なしで止まった（/x/tzw consult launch cw4 --again）・「/x/tzw consult watch」を背景で置き直す

      相談: 話す窓 cw3 が閉じられた（/x/tzw consult close cw3 --by chat）・「/x/tzw consult watch」を背景で置き直す

      相談: 見張りが上限で終わった・「/x/tzw consult watch」を背景で置き直す

      器の席の答え。Q-V2: 器の入力の時の hook が席の文脈へ器が記録した発話の時刻の 1 行（scribe2 utterance と ts）を出すので、持ち主のチャットで開く窓の開きの行の 発話 = はその時刻を分の字にして書く（逐語は器の utterance show の口で引ける）。Q-V3: notes の上限は memo だけなので、memo が満ちる行は根に置く形のまま（根では断らない）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 つ目から 9 つ目の項は verify の 3 行目（cwlin_ の 9 本）、最後の項は 4 行目（xtask の check・歯の全部を撃つ）。done の項は歯が測る物だけにした。verify の 1 行目（git apply --reverse --check）は差の file の hunk が全部木に在ることを、2 行目（cargo clippy -p tsuzuri-core --all-targets --no-deps -- -D warnings）は clippy の落ちが無いことを、命令の rc で測る守りで、done の項にしない。

      構造の連鎖。lines.rs は行 cs-types が骨で置き、中身はこの行だけが書く。使うのは契約の consult の id と語と minute_ok・graph の natural_cmp・ledger の BeadId と LedgerItem（is_memo）と、中核の delivery の MARK_PREFIX と graph::build の TYPED_LINES（どれも今の pub の名・替えない）。lines の名を呼ぶ所は今の木に無く、後の行 cs-quota（Line と By）・cs-open・cs-watch・cs-show・cs-close・cs-server・cs-hooks が呼ぶ。

      試作と噛み。main 5c8fe2b4 にこの行の差だけを当てた木 85f5b49c と、行 cs-finding の差の後に当てた木 9e04386d（写し drafts/w93a）で、中核の crate の clippy（--all-targets --no-deps・-D warnings）が rc 0、歯 cwlin_ の 9 本が通る。xtask の check は 11 行の差を全部当てた最後の木 8214cef7 で rc 0（workspace の歯 3,104 本・size は file-lines 1348/1500・core-lines 8367/20000・test-src-ratio 7069/82463・今の main 61c2a443 に着地していない行の差を順に当てた木の crates と tests と xtask の字は 8214cef7 と同じ）。係 w83a の噛みは変異 8 つ（処分の頭を替える・撃ち直しの印の値を替える・中黒を替えない・裁定 id の尾の - を見ない・分の字を見ない・memo でなく問いへ置く・受けた所見を未受けにする・完了の行にも置き直しを足す）で、9 本の歯のどれも少なくとも 1 つで落ちる。第 0.11 版の直し（便 t3-hub.75.5 の審査の vacuous-assert に答える・係 w93a）は 3 つ。1 つ目は、否定の見本を 6 つの見本の行から 1 つだけを替えた形にした（前の欄の足りない行の見本は id の rq-1 が形でなく、read が欄を見る前に断っていた）。2 つ目は、read が見ていなかった頼みの起こし手と所見の窓の欄を見るようにした。3 つ目は、根の 3 つの条件を測る見本（id の自然な順で根より前に在る閉じた epic・親の無い task・親の在る epic）を足した。その噛みは変異 12 で、どれも直した歯で落ちる（rc 100・対照は全部通る）。変異は、6 つの頭のそれぞれで欠けた欄を既定の値で埋める 6 つ・頼みの起こし手と所見の窓を見ない 2 つ・知らない頭を頼みと読む・時刻を既定の値で埋める・根の 3 つの条件を 1 つずつ外す 3 つ。前の歯では、前の read にも当たる 10 の変異のうち 9 つが通った（空振り・時刻の変異だけが落ちた）。

      句の型の照らし（第 0.15 版・便 t3-hub.75.5 の 2 度目の審査の vacuous-assert に答える・係 w93a）。done の句を型（順・1 度だけと重ねない・縁と既定と空・だけ）に分け、句を崩す変異（順を替える・重ねる・縁を 1 ずらす・既定に倒す・だけの絞りを外す）を 55 撃ち、直した歯で 55 が名指しの歯で落ちた（rc 100・対照は全部通る）。前の歯では落ちない見立て（src と歯を読んだ見立て・前の歯では撃っていない）の変異が 18 で、その句の見本を足して直した（受けの無い頼み 3 つを台帳の順 2・10・1 に置き、2 度の頼みの行と受けた頼みを足す・所見を cw2-1 と cw10-1 と重なりで置く・台帳だけに在る所見・持ち主のチャットの開き・裁定 id の形から 1 字だけ替えた引用でない字 3 つ・6 つの見本の行の時刻の断り・memo の下の memo と自然な順の根 fx-r9 と fx-r10・上限の値 8192 そのもの・経路 hook と一覧の所見の行の置き直し）。歯の fn の数と名は替えない。src は替えない。xtask の check は main 145db064 に着地していない行の差を 11 行の順に当てた木 2b4b6fe6 で rc 0（workspace の歯 3,121 本・size は file-lines 1348/1500・core-lines 8367/20000・test-src-ratio 7069/82743）。

      流す時と順。depends は cs-types。同じ波の行 cs-finding・cs-argv と書く file が重ならない。後の行 cs-quota がこの行の Line を読む。

      範囲の外。台帳に行を書く口（bdw の AppendNotes を撃つ命令と server の口は後の行）。台帳の bd の字から LedgerItem への読み（境界の今の読みを後の行が使う）。memo が閉じているかの照らし（置かない理由が決まっていない・notes の未確か）。
  - n: 6
    type: prose
    title: 行 cs-argv — 起動の argv と設定の組みと検め
    body: |
      在りか。差の file docs/design/patch/cs-argv.patch は、main 5b1099ae に行 cs-types の試作 8747a2da を載せた木に試作の commit c77fdc1d（写し drafts/w83a・行 cs-finding と cs-lines の試作の上・書く file は重ならない）を載せて切った（3 file・32,008 byte・+808 −1）。中核の src/consult/launch.rs の骨の注 1 行を中身に替え、fixture tests/fixtures/consult/launch-argv.yaml を足す。

      なぜ。判断の記録 ADR-29 決定 (5)(6)(7) は、起動の口が席の環境を継ぎ、器と tsuzuri の plugin を渡さず、制限の形・許可を聞かない形・道具の閉じた列・MCP の断り・読む根の足しと書きの断り・私用の短い temp・囲いの設定で窓を起こし、起動の口の argv と設定を歯で測ると決めた。受入 AC19 は、組んだ argv と設定を fixture と比べ、plugin の置き場の旗を足した形と囲いの設定を 1 つ欠いた形で落ちることを見る。旗と鍵の名は検証役 qv44a の報告 3 の実測の字（Claude Code 2.1.288）。

      読む根を絞る理由（ADR-29 決定 (7) の「器の state」の読み・ADR の字は替えない）。決定 (7) の読む根の足しは repo と台帳と器の state を名指す。器の state を state dir の丸ごとと読むと、(i) state dir の accounts の下の全口座の資格の file が Read の道具から読め、(ii) 囲いの書きの断りに state dir を置くとその下の作業場（席の drafts の下の窓の dir）も覆う。そこで「器の state」を器の出力の読み場所（state dir の fleet と pipe）と読む狭める側の読みを採り、accounts は資格の断り（sandbox.credentials.files）と Read の断り（permissions.deny）に置く。台帳は囲いの中で bd を撃てない（LOCK を書けない・計画の撃った確かめ）ので、束の台帳の写し（行 cs-open）で読む。殻の命令は囲いの中でも state dir の残りを読める（書けない）。

      形（要約・字は差の file）。(a) 材料 Launch は 形・窓の id・作業場 W・repo R・state dir S・読む根のうち在る dir の列・解いた tz の path T・uid・model・念入りさ・束に問いが在るか。path は「/」で始まる絶対 path、uid は 10 進の字。read_roots は R と S/fleet と S/pipe（在る dir だけを渡すのは後の行 cs-launch）。(b) argv は、問う窓だけ頭に -p と問いの指示、続けて --restricted・--permission-mode dontAsk・--tools（TOOLS の Read,Grep,Glob,Bash,Edit,Write,WebSearch,WebFetch）・--disallowedTools mcp__*・--strict-mcp-config・読む根ごとの --add-dir・--settings と設定の JSON の字（file にしない）・--model・--effort・--name consult-cw<n>、末に問う窓は --output-format json、話す窓は最初の指示の位置の引数（束に問いが在れば bundle/question.md も読ませる）。program の名 PROGRAM は claude で argv に含めない。(c) 設定 settings の全部は fixture の settings の字（置き字の W・R・S・T・U を囲いを省いた形で書くと、permissions は allow が WebSearch・WebFetch・Edit(//W/**) で deny が Read(//S/accounts/**)・Read(//R/.beads/.env)、sandbox は enabled 真・autoAllowBashIfSandboxed 真・allowUnsandboxedCommands 偽・failIfUnavailable 真・filesystem.denyWrite が読む根の列・credentials.files が CREDENTIALS の 5 つと S/accounts と R/.beads/.env と /tmp/claude-U の 8 つを mode deny・network.allowedDomains が DOMAINS の 6 つ、env は UV_CACHE_DIR・PIP_CACHE_DIR が W/.venv の下・CARGO_HOME が W/target/cargo-home・npm_config_cache が W/node_modules/.npm-cache、hooks は PreToolUse の matcher * に命令 timeout 4 T consult guard || exit 2 と timeout 10）。Edit の許しは絶対 path の頭に「/」を 1 つ足した //<path> の形（qv44a の報告 2）。(d) 環境。env は窓の id の TZ_CONSULT_ID と私用の temp の CLAUDE_CODE_TMPDIR の 2 つ。話す窓の tmux の -e の閉じた列 TALK_ENV は CLAUDE_CONFIG_DIR・PATH・TZ_CONSULT_ID・CLAUDE_CODE_TMPDIR、問う窓が席の環境から外す ASK_DROP は TMUX・TMUX_PANE。private_tmp は /tmp/tzc- と作業場の path の FNV-1a 64（契約の ledger の fnv1a64）の 16 進の頭 6 字（15 byte・Claude Code の 30 byte ほどの縛りの内）。(e) audit（argv と材料）は欠けと広い許しの名の列を返し、空なら起こしてよい。見るのは、FORBIDDEN の 5 つの字（--plugin-dir・--dangerously-skip-permissions・bypassPermissions・--mcp-config・--append-system-prompt）が argv の字の頭か末に無いこと、旗の次の字（許可の形・道具の列・MCP の断り・窓の名・model・念入りさ）、--restricted と --strict-mcp-config と --settings、-p と --output-format json が問う窓にだけ在ること、--add-dir の値が read_roots と材料の読む根の両方に在ること、設定の SANDBOX_FIXED の 4 つの値、ABSENT の 4 つの鍵（excludedCommands・allowUnixSockets・allowAllUnixSockets・permissions の defaultMode）が無いこと、許すドメインが DOMAINS の部分で空でないこと、書きの断りが読む根を全部持つこと、資格の断りが 8 つを mode deny で持つこと、許しが WebSearch・WebFetch・作業場の Edit の部分で前の 2 つを持つこと、Read の断りの 2 つ、env の 4 つの鍵が作業場の下、守りの hook の matcher と命令。(f) PLUGIN_VERSION は 0.2.0（plugin.json の version は後の行 cs-plugin が 0.2.0 に上げ、同じ字の歯を置く・workspace の Cargo の版は動かさない）、VERSION_ENV は TZ_PLUGIN_VERSION、version_ok は置かれた字が PLUGIN_VERSION と同じかだけを見る。(g) brief は束の手引き bundle/brief.md の字（窓の id と解いた tz の path の answer と bundle の口・作業場の決まり・web・台帳の写し・notes.md・草稿の 12 欄と欄の決まり・sandbox_denials・承認を受けない）。

      fixture（JSON の字・JSON は YAML でもあるので名は .yaml のまま）。置き字 /W（作業場）・/R（repo）・/S（state dir）・/T（解いた tz）と uid の U で host の path を書かない。話す窓（cw3・問いなし）と問う窓（cw4・問いあり）の inputs と argv（設定の字の所は <settings>）と環境の 2 つの組、talk_env・ask_drop、settings の全部。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 つ目から 7 つ目の項は verify の 3 行目（cwarg_ の 7 本）、最後の項は 4 行目（xtask の check・歯の全部を撃つ）。done の項は歯が測る物だけにした。verify の 1 行目（git apply --reverse --check）は差の file の hunk が全部木に在ることを、2 行目（cargo clippy -p tsuzuri-core --all-targets --no-deps -- -D warnings）は clippy の落ちが無いことを、命令の rc で測る守りで、done の項にしない。

      構造の連鎖。launch.rs は行 cs-types が骨で置き、中身はこの行だけが書く。使うのは契約の consult の DRAFT_FIELDS・Form・WindowId と ledger の fnv1a64 と serde_json の json! と Value（どれも今の pub）。launch の名を呼ぶ所は今の木に無い（後の行 cs-open が brief を、cs-launch が argv・settings・env・audit・version_ok を呼ぶ）。

      試作と噛み。試作の木で中核の crate の clippy（--all-targets --no-deps・-D warnings）が rc 0、歯 cwarg_ の 7 本が通る。xtask の check は積み直した最後の木 60d2c916 で rc 0（workspace の歯 3,057 本）。噛みは変異 7 つ（囲いが起きない時も起こす・断る旗を見ない・資格の断りの欠けを見ない・広い許しを見ない・excludedCommands を見ない・temp の path を長くする・手引きの所見の口を解いた tz の path でなくする）で、7 本の歯のどれも少なくとも 1 つで落ちる（どの変異も rc 100・対照は全部通る）。

      流す時と順。depends は cs-types。同じ波の行 cs-finding・cs-lines と書く file が重ならない。

      範囲の外。窓を実に起こす口（tmux と claude -p・在る読む根の選び・proc の印・行 cs-launch）。守りの hook の口 tz consult guard の中身（行 cs-answer）。plugin.json の版と tz の解き方 tzw（行 cs-plugin）。対話の窓での囲いの実の効き（着地の後の席の手の確かめ）。
  - n: 7
    type: prose
    title: 行 cs-quota — 席が自分で開く問う窓の数え
    body: |
      在りか。差の file docs/design/patch/cs-quota.patch は、main 5b1099ae に行 cs-types と cs-finding と cs-lines の試作を載せた木（745ad5f8）に試作の commit 60d2c916（写し drafts/w83a・行 cs-argv の試作 c77fdc1d の上・書く file は重ならない）を載せて切った（2 file・8,212 byte・+193 −1）。中核の src/consult/quota.rs の骨の注 1 行を中身に替える。

      なぜ。判断の記録 ADR-29 決定 (10) と規則の行 R-38 は、席が自分で開く問う窓を同時に 1 本・1 日（UTC の日）3 本までとし、持ち主の言葉（skill か button）で開く窓と止まって撃ち直した窓は数えず、越える時は起動の口が断り、席は決定の画面で持ち主に問うと決めた。数えるのは起動の口で、台帳の相談の行の起こし手で見分ける（R-38 の note）。

      形（要約・字は差の file）。LIVE_MAX は 1、DAY_MAX は 3、REFUSAL は字 R-38 の上限（同時 1 本・1 日 3 本）で断った・決定の画面で持ち主に問う。count（台帳の相談の行の列・今の分の字・process の印が生きている窓の列）は SeatQuota を返す。今日の数は、開きの行（行 cs-lines の Line::Open）のうち起こし手が席（By::Seat）・形が問う・結果が開いた・撃ち直しでない行で、時刻の頭 8 字が今の分の字の頭 8 字と同じ物の数。今の数は、起こし手が席で形が問うで結果が開いた行の窓（撃ち直しの行も）を重ねずに集め、渡した生きている窓の列に在る物の数（生きているかは後の行 cs-launch と cs-close が proc の印で判じて渡す）。admit（数・撃ち直しか）は、撃ち直しなら通し、今の数が LIVE_MAX 未満で今日の数が DAY_MAX 未満なら通し、ほかは REFUSAL で断る。開きを数えるのは結果が開いた行だけ（落ちた行は断りで開かなかった窓と起動の失敗の窓で、R-38 の 1 本に数えない）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 つ目から 5 つ目の項は verify の 3 行目（cwquo_ の 5 本）、最後の項は 4 行目（xtask の check・歯の全部を撃つ）。done の項は歯が測る物だけにした。verify の 1 行目（git apply --reverse --check）は差の file の hunk が全部木に在ることを、2 行目（cargo clippy -p tsuzuri-core --all-targets --no-deps -- -D warnings）は clippy の落ちが無いことを、命令の rc で測る守りで、done の項にしない。歯 cwquo_values_match_rule_r38 は rules の file の id: R-38, の行を 1 つ探して value の字を比べる（前例 bvland.rs の R-36 の照らし）。

      構造の連鎖。quota.rs は行 cs-types が骨で置き、中身はこの行だけが書く。使うのは契約の consult の Form・SeatQuota・WindowId と、行 cs-lines の By と Line。歯は行の字を組んで lines::scan で読む。quota の名を呼ぶ所は今の木に無い（後の行 cs-launch と cs-close と cs-server が呼ぶ）。

      試作と噛み。試作の木で中核の crate の clippy（--all-targets --no-deps・-D warnings）が rc 0、歯 cwquo_ の 5 本が通る。xtask の check は積み直した最後の木 60d2c916 で rc 0（workspace の歯 3,057 本）。噛みは変異 5 つ（話す窓も数える・日の境を月にする・生きていない窓も数える・同時 1 本を通す・1 日の上限を 4 にする）で、5 本の歯のどれも少なくとも 1 つで落ちる（どの変異も rc 100・対照は全部通る）。

      流す時と順。depends は cs-lines（Line と By）。行 cs-lines の着地の後の波。

      範囲の外。数えを撃って断る口と標準エラーの 1 行と開きの行の結果（行 cs-launch）。一覧と board の今日の数と今の数（行 cs-close と cs-server）。

  - n: 8
    type: prose
    title: 行 v-gate — xtask の check に入れ子の workspace の段
    body: |
      在りか。差の file docs/design/patch/v-gate.patch は main afa65b32 に試作の commit 61fa0932（写し drafts/w84a・branch main）を載せて切った（2 file・21,632 byte・+405 −2）。xtask の src/main.rs に module nested の宣言と fn check の最後の段の呼びを足し、新しい xtask/src/nested.rs に入れ子の workspace の段（見つけ・1 行・段の列・撃ち）と歯 vnest_ の 7 本を置く。

      なぜ。判断の記録 ADR-18 は器 scribe2 を folio2 の後に tsuzuri へ持ち込み、元の repo を凍結すると決め（決定 (1)(2)）、ADR-22 の決定 (7) は器の履歴を番号を保つ merge で持ち込む形を予行の 3 つの条件で決めた。器の木は scribe2/ の下に、自分の Cargo.toml（行 [workspace]）と錠と xtask を持つ入れ子の workspace のまま置かれる。根の workspace に入れる後の行までの間、tsuzuri の門（xtask の check・器の common-verify・CI の 8 つの job）は器の code を組まず、器の歯も撃たない。持ち込んだ後に器の code を書く便が器の歯を通らずに着地しないよう、入れ子の間も器の build・歯・clippy・器の xtask の check を tsuzuri の xtask の check の段で撃つ。今の main に入れ子は無いので、段は数えた 0 の 1 行だけを出す。器を持ち込む merge の木で初めて scribe2/ を撃つ。

      形（要約・字は差の file）。(a) 見つけ方。根の直下の dir のうち、Cargo.toml の行の前後の空白を除いた字が [workspace] に等しい行を持つ dir を、名の字の順（byte の順）に並べる。下の dir は見ない。節 [workspace.package] だけの manifest と注の行は数えない。(b) 1 行。段の頭に、字 xtask check: と空白に続けて summary の字（0 なら nested workspaces=0・在れば nested workspaces=1 dirs=scribe2 の形）を標準エラーへ出す。(c) 段の列。dir ごとに STEPS の 4 段（cargo build --workspace・cargo nextest run --workspace・cargo clippy --workspace --all-targets -- -D warnings・cargo xtask check）を、その dir を cwd にして順に撃つ。引数は根の段と同じ main.rs の step_args で作るので、環境変数 TSUZURI_CHECK_PARTITION の字が在れば nextest の段にだけ同じ --partition の字が付く（CI の 8 つの job は入れ子の歯も同じ割りで分ける）。cargo xtask check は入れ子の workspace の .cargo/config.toml の alias（器は run -q -p xtask --）で引く。(d) 組み立ての置き場。入れ子の段は環境変数 CARGO_TARGET_DIR を、根の target（その変数の字・相対なら根から・無いか空なら根の下の target）の下の nested と dir の名の path にして撃つ。根と器の xtask は package の名が同じ xtask で、同じ置き場に組むと binary の target/debug/xtask を取り合うため。置き場は根の target の下なので版管理の外のまま。(e) 落ち方。最初に落ちた段の rc を返し、後の段と後の dir を撃たない（根の段と同じ）。入れ子の dir を読めなければ段を撃たずに rc 1。面の組み立てが落ちたら入れ子の段を撃たない。cargo の binary は根の段と同じ環境変数 CARGO の字。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 つ目の項は verify の 1 行目、2 つ目の項は 2 行目、3 つ目から 9 つ目の項は 3 行目（vnest_ の 7 本）、10 個目の項は 4 行目（ksize_ の 7 本）、最後の項は 5 行目。

      構造の連鎖（main afa65b32 で grep）。module の名 nested は xtask に無い。xtask の src/main.rs の fn check を読む着地済みの歯は ksize_check_wiring（size.rs・走査 → 数え → cargo の段の順と数えの後の return 1;）と pubscan_wiring（pubscan.rs・走査が cargo の段より前）で、cishard_ の歯は const PARTITION_ENV と step_args と CHECK_STEPS を読む。この行はそれらの字を替えない（fn check の末で return rc; を 1 行足し、最後の式 rc を nested::run(root, &cargo, part) に替え、doc の注を 2 行足すだけ）。xtask の出力の手は main.rs の emit_err の 1 つ（歯 klint_print_hands が src の print の macro の数を数える）なので、nested は crate::emit_err で書き、print の macro を書かない。step_args は main.rs のまま nested が crate::step_args で引く。xtask/tests の歯は nested.rs を読まない。

      試作と噛み。写しの main afa65b32 の上の試作で、xtask の clippy（--all-targets --no-deps・-D warnings）が rc 0、歯 vnest_ の 7 本と xtask の歯の全部（68 本）が通る。xtask の check は rc 0（490 秒・入れ子の段は字 nested workspaces=0 の 1 行だけ・workspace の歯 3,030 本・size は file-lines 1348/1500・core-lines 7129/20000・test-src-ratio 7069/78519）。噛みは変異 10（字 [workspace を含む行を全部数える・字の順を逆にする・入れ子の歯に partition を渡さない・入れ子の clippy から --all-targets を抜く・置き場を dir の名で分けない・0 の時も dirs= を足す・環境変数の置き場を読まない・cargo を起動できない時に 0 を返す・面の組み立てが落ちても入れ子を撃つ・歯の名に filter の語 gate_ を入れる）で、7 本の歯のどれも少なくとも 1 つの変異で落ちる（対照の撃ちは全部通る・どの変異も rc 100）。歯の名から接頭辞を除いた字は下の filter の語 409 のどれも含まない。

      merge の木の確かめ。器を持ち込む予行の merge の木（tsuzuri main 5b1099ae に器 main 38cbb667 を番号を保つ merge で scribe2/ に置いた木 6524ab4d・起草 w81a の写し）にこの差を当てた枝で xtask の check を 2 回撃った。割り count:3/8（入れ子で落ちる器の歯 4 本を含まない割り）は rc 0（99 秒）で、段は字 nested workspaces=1 dirs=scribe2 の 1 行を出し、scribe2/ で build・歯 495 本（ほかの割りの 3,457 本は撃たない）・clippy・器の xtask の check を撃って全部通った（段の 57 秒）。器の xtask の check は 4 つの門（paths-clean・private-clean・non-rust-exec・prose-gate）を n/a(not-a-repo-root) と出して黙る。割り count:1/8（落ちる 1 本 contract_names_declared_real_table_has_zero_findings を含む割り）は入れ子の歯の段で 495 本のうち 1 本が落ちて rc 100（132 秒）で、段は落ちた段の字を出し、後の clippy と器の xtask の check を撃たない。落ちる器の歯 4 本は割り 1・2・7 に在り、割り 3・4・5・6・8 に無い（どれも git の根の宣言を器の宣言と読む歯で、器の側の直しを待つ正しい落ち）。

      filter の語の一覧（起草の時の main afa65b32 の契約表の verify の最後の字 403 語と、ノート surface-wave27a の 5 行の 5 語〔cwarg_・cwfnd_・cwlin_・cwquo_・cwty_〕と、docs/design/vessel-keys.md の行の 1 語〔fsch_〕の 409 語・字の順）。aaround_ aaround_src_ask_fold_embeds abss_ abst_ accept_ acchold_ account_ acctcore_ acctcore_pure_and_no_new_dependencies acctdoc_ acctframe_ accthb_ accthome_ acctled_ acctlook_ acctpcore_ acctproj_ acctsess_ acctwin_ acctwire_ acctwire_back_part_before_header acctwire_back_steps aface_ afocus_ afocus_src_links_and_scroll alean_ anchor_ aord_ aown_ apark_ apop_ areread_ askcard_ askcard_page_frame_and_nav athr_ batchpanel_ batchpanel_page_frame_two_columns bhalf_ board_min_ bport_ brand_ brand_path_written_once_in_contract btuck_ bvacc_ bvafix_ bvaskw_ bvbar_ bvcase_ bvcform_ bvcols_ bvcroute_ bvcull_ bvdsweep_ bvfact_ bvfive_ bvfront_ bvfroute_ bvhelp_ bvkpi_ bvland_ bvlay_ bvlc_ bvlcw_ bvlex_ bvlist_ bvmore_ bvmpage_ bvnav_ bvopen_ bvpop_ bvqcol_ bvqhist_ bvqsrv_ bvrread_ bvsel_ bvsettle_ bvshed_ bvstep_ bvsweep_ bvtrim_ bvunref_ bvuphase_ bvuroute_ bvwhy_ bvwin_ bvwins_ bvwurl_ cadl_ cadopt_ cadq_ cdorm_ cexcl_ cfsplit_ cg9_ cgdom_ check_canonical_design_intent_passes cishard_ cmark_ cnote_ cnret_ contract_form_ cround_ csled_ cspk_ ctick_ cupd_ cupdlist_ cwarg_ cwfnd_ cwlin_ cwquo_ cwty_ denv_ dnedge_ dngrp_ dnrow_ dnskip_ dretry_ dstg_ ecache_ ecache_handle_wiring_text eheld_acct_ eheld_design_ eheld_held_ eheld_marks_ eheld_vessel_ elazy_ epolq_ eretry_ esig_ evkind_ f123_ f125_ f142_ f152_ f159_ f174_ f181_ f185_ f190_ f192_ f212_ f2ret_ f76_ f89_ f98_ f99_ face_ fdlt_ fdlv_ fdrop_ flight_ fmark_ fprem_ frame_ frame_home_blocks_in_order_and_map_page frame_one_module_per_block fsch_ fserve_ fstop_ fstop_usage_errors_are_one fundl_ fxpre_ g3g7_ gacct_ gapspage_ gapspage_page_frame_and_nav gate_ gatt_ gbnote_ gchip_ gcoach_ gext_ gfix_ gfresh_ gfresh_boards_text ghb_ gins_ gjst_ glabel_ gmret_ gmretw_ gnav_ gpface_ gpill_ gpulse_ gpulse_boards_text gquestion_ graph_ gsum_ gtuck