  title: 第 27 波 a — 相談の窓 consult の作り直し（判断の記録 ADR-29）の行と、後で足す行
  version: v0.15
  status: effective
  generated: 2026-10-03
  profile: design-note
  approval:
    - {who: 持ち主, date: 2026-10-02, ruling: t3-hub.75.1（裁定 id = t3-hub.75.1:20261002T2238Z-1・席とのチャット・notes に逐語）・t3-hub.75.2（裁定 id = t3-hub.75.2:20261002T2258Z-1・席とのチャット・パッケージ の形は乙）, verbatim: 4.これは微妙だ。相談といっても例えば新しい技術のスクラッチ実験とかデータの検証のためにプログラムを組むとかはできるべきだ。それがそのプロジェクトを汚さない形であるようにしてほしい。調査レポートなども作れるべきで、ただしそれを直接プロジェクト内に保存するのではなく、orchestratorに渡して保存するかどうか選ばせる形だ 5.常にweb調査もできるべき。上記の通りスクラッチ昨日は残さないと上質な調査は不可能だ それ以外は推奨で良い あと、consultは以前は一つの議題についての相談に特化していた気がするが、そのようにむやみに限定するのではなく、もっとorchestratorのコンテキストを汚さないために分離しているだけの自由な調査検証の場として作って。一つ話終わったからすぐに閉じるわけではない。途中でclearして別の話題について検証して結果をorchestratorに渡す、みたいな運用もあり得るし、なんならconsult窓が複数もあり得る／乙でよいだろう, surface: R-8}
  note: ノート surface-wave26b（32 行の全部が着地・同じ commit で廃止）の後。承認は判断の記録 ADR-29 の持ち主の裁定（t3-hub.75.1:20261002T2238Z-1 と t3-hub.75.2:20261002T2258Z-1）。第 0.1 版（2026-10-03）は目的と、相談の窓の第 1 の波の行 cs-types・cs-finding・cs-lines・cs-argv・cs-quota を置いた。 第 0.2 版（2026-10-03）は、器 scribe2 の持ち込みの前の行 v-gate（xtask の check の最後に入れ子の workspace の段・判断の記録 ADR-18 の決定 (2) と ADR-22 の決定 (7)）を足した。 第 0.3 版（2026-10-03）は、判断の記録 ADR-31 の行 r-dbg・r-nextest-timeout（dev の debuginfo を行の表だけ・nextest の歯の時間切れ・節 9〜10）を足した（新しいノートを置くと生きたノートが 7 本になり規則の行 R-31 の上限 6 本を越えるので、このノートに置いた・席の決め）。 第 0.4 版（2026-10-03）は、判断の記録 ADR-32（段の束ね・群の上限 1 万行・持ち主の裁定 t3-hub.77.7）の 6 行 t-fold-xtask〜t-fold-folio と行ごとの節 11〜16 を足した（起草 w87a と w89a・差を切った main e16524a9）。6 行は 1 本ずつ流す。 第 0.5 版（2026-10-03）は、行 t-fold-contract〜t-fold-folio の verify の 3 行目に行の crate の clippy（--all-targets --no-deps と -D warnings）を足し、done にその項を足し、節 12〜16 の頭に done と verify の対応と、lint の期待（群の 1 crate でも expect が満たされること）の段を書いた（審査の見立てに答える・起草 w89a・write-set と差の file は替えない）。 第 0.6 版（2026-10-03）は、行 t-fold-core〜t-fold-folio の差の file と write-set と節 13〜16 を、ほかの crate を名指す字を直した fold2.py で main 0f46006c から切り直した物に替え、節に「ほかの crate を名指す字」の段を足した（審査の literal-mismatch に答える・起草 w89a）。 第 0.7 版（2026-10-03）は、段の束ねの行 t-fold-core〜t-fold-folio の done から歯でなく命令が測る項（差の当たり・crate の clippy）と歯が測らない句（fn の名を替えない）を外して節へ移し、節の頭の done と verify の対応を書き直した（便 t3-hub.77.10 の 2 度目の審査の vacuous-assert・verify と差の file は替えない）。 第 0.8 版（2026-10-03）は、相談の窓の行 cs-types〜cs-quota の done から歯でなく命令が測る項（差の当たり・crate の clippy）を外して節へ移し、節の done と verify の対応を書き直した（第 0.7 版の段の束ねの行と同じ形・verify と差の file は替えない）。 第 0.9 版（2026-10-03）は、相談の窓の第 2 の波の行 cs-open・cs-launch・cs-answer・cs-watch・cs-show・cs-close（tz consult の命令の骨と open と bundle・起こす口・所見の口と窓の守り・見張り・読む口と処分・一覧と閉じ・節 17〜22）を足した（試作は係 w85a・今の main の上で第 1 の波の 5 つの差の後に当たることと行ごとの歯は係 w93a が確かめた・done は第 0.8 版の形で歯が測る項と最後の xtask の check の項だけ）。 第 0.10 版（2026-10-03）は、器 scribe2 の持ち込みの前の行 v-skip（xtask の check の入れ子の段を、入れ子の入力に触れない dir では省いて 1 行を出し、CI は全部を撃つ・節 23）を足した（判断の記録 ADR-34・持ち主の裁定 t3-hub.74.39・試作は係 w94a・done は第 0.8 版の形で歯が測る項と最後の xtask の check の項だけ）。 第 0.11 版（2026-10-03）は、便 t3-hub.75.5（cs-lines）の審査の vacuous-assert に答えた。行 cs-lines の差を直して main 5c8fe2b4 の上で切り直し、done の 1 つ目と 6 つ目の項と節 5 を直した（read が頼みの起こし手と所見の窓を見る・否定の見本は 1 つだけを替えた形・根の 3 つの条件の見本）。同じ型の空振り（否定の見本が測りたい句より前の別の理由で断られる）を除くため、行 cs-open・cs-launch・cs-answer・cs-watch・cs-close の差の歯の file を直して切り直し、節の在りかと試作と噛みの段を直した（起草 w93a・verify と write-set と depends は替えない）。 第 0.12 版（2026-10-03）は、器 scribe2 の持ち込みの前の 2 行を足した。行 v-ci-split は割りの在る xtask の check で歯でない段を表の役だけで撃ち、歯だけを分ける（決定 (9)・節 24）。行 v-daily は日に 1 度の全部の撃ちの task daily と systemd --user の .service と .timer の雛形を置く（決定 (6)・節 25）（判断の記録 ADR-34・試作は係 w94a・done は第 0.8 版の形で歯が測る項と最後の xtask の check の項だけ）。 第 0.13 版（2026-10-03）は、行 v-daily を直し、行 v-ci-split-teeth（節 26）を足した。v-daily の続く落ちは、記録の memo が open か in_progress で、[再発] の行を足した後の notes が 8192 byte 以下の時だけ足す。閉じた・台帳に無い・読めない・満ちる時は、足さずに前の memo の id を本文に書いた新しい memo を起こす（memo の状態は bdw --readonly show の JSON を台帳の読みの型で読む・xtask に tsuzuri-contract の依存を足す・done に 2 項・差の file を v-ci-split の後で切り直した）。v-ci-split-teeth は、句ごとの噛みの前の歯で着地する行 v-ci-split の歯 vsplit_ を、歯の file だけを替えて強める（割りの字の否定の見本を 1 句ずつ崩した 6 つ・ほかの役の段を撃たない腕の字・試作は係 w94a）。 第 0.14 版（2026-10-03）は、行 v-daily の節の在りかの段の歯の数の字を、差の file の歯の数（vdaily_ の 11 本）に合わせた（便 t3-hub.74.42 の審査の goal-done-contradiction・done と verify と差の file は替えない）。 第 0.15 版（2026-10-03）は、便 t3-hub.75.5（cs-lines）の 2 度目の審査の vacuous-assert（done の 8 つ目の項の台帳の順を 1 つの見本では測れない）に答えた。句の型（順・1 度だけと重ねない・縁と既定と空・だけ）の照らしを、行 cs-lines の全部の項と行 cs-quota・cs-open〜cs-close の歯に広げた。行 cs-lines・cs-open・cs-launch・cs-answer・cs-watch・cs-show・cs-close の差の歯の file を直し、cs-launch と cs-close は src も直した。差は main 145db064 の上で切り直し、done の 36 か所と 7 つの節を直した（起草 w93a・verify と write-set と depends は替えない・cs-quota は空振りが無く替えない）。

sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      判断の記録 ADR-29（相談の窓 consult の作り直し・持ち主の裁定 t3-hub.75.1 と t3-hub.75.2）の作る行と、後で足す行（同じ波に置く別の判断の記録の行）を流す。相談の窓は、席の文脈を汚さないために分けた自由な調べと検証の場で、tsuzuri の plugin の機能（skill /tsuzuri:consult と tz consult の命令）として作る（決定 (2)(3)）。形は持ち主が直に話す窓と席が背景で起こす問う窓の 2 つで、同じ起動の口・口座・基本ソフトの囲い・所見の口・受け方を通る（決定 (3)(5)(7)(8)）。計画は 16 行（型と中核の純な関数・tz consult の命令・席の hook・board の server の口と面・plugin）で、この版は第 1 の波の 5 行（型・所見の欄の検め・台帳の相談の行と置き場・席が自分で開く問う窓の数え・起動の argv と設定の組みと検め）と第 2 の波の 6 行（tz consult の命令の骨と open と bundle・起こす口・所見の口と窓の守り・見張り・読む口と処分・一覧と閉じ）を置く。残りの行（hook・server・面・plugin）と後で足す行は起草の後に足す。受入 AC16 は行 cs-finding と後の行の歯で、AC19 は行 cs-argv と cs-launch の歯で測り、囲いの実の効き（作業場の外と repo へ書けない）は着地の後に席の手で問う窓と話す窓の両方で撃って確かめる。当座の手順 docs/consult/ は命令の口が着地した後に席の設計の commit で退かせる（決定 (1) のク）。後で足す行のうち、判断の記録 ADR-31（開発の組みの書き込みと CPU を減らす・持ち主の memo t3-hub.77）の行 r-dbg・r-nextest-timeout を第 0.3 版で足した（開発の組みの debuginfo を行の表だけにする・nextest の歯の時間切れ・試作は係 w86a・差の file の形・生きたノートを増やさないためにこのノートに置く）。 後で足す行のうち、判断の記録 ADR-34（器 scribe2 の持ち込みの後に入れ子の段を省く形・持ち主の裁定 t3-hub.74.39）の行 v-skip を第 0.10 版で足した（入れ子の入力に触れない便では入れ子の段を省き、CI と host の日に 1 度の撃ちで全部を撃つ・試作は係 w94a・差の file の形・生きたノートを増やさないためにこのノートに置く）。 同じ判断の記録 ADR-34 の行 v-ci-split と v-daily を第 0.12 版で足した（CI の歯でない段を割りの役に 1 つずつ振る・host の日に 1 度の全部の撃ちの仕掛け・試作は係 w94a・差の file の形・持ち込み（T）の前に着地させる）。
  - n: 2
    type: contract-table
    title: 契約表
    rows:
      - id: cs-types
        title: 相談の窓の型を契約の crate に置き、中核の crate に consult の骨（所見の検め・台帳の行・数え・起動の組みの 4 つの module の頭の注だけ）を置く（窓と所見と頼みの id の形・閉じた語・所見の file の形・board の口の電文・保存の写し先の相対の path・判断の記録 ADR-29・差の file）
        req: ["FR19"]
        section: "3"
        write-set: ["+crates/tsuzuri-contract/src/consult.rs", "crates/tsuzuri-contract/src/lib.rs", "+crates/tsuzuri-contract/tests/cwty.rs", "crates/tsuzuri-core/src/lib.rs", "+crates/tsuzuri-core/src/consult/mod.rs", "+crates/tsuzuri-core/src/consult/finding.rs", "+crates/tsuzuri-core/src/consult/lines.rs", "+crates/tsuzuri-core/src/consult/quota.rs", "+crates/tsuzuri-core/src/consult/launch.rs"]
        verify: ["git apply --reverse --check docs/design/patch/cs-types.patch", "cargo clippy -p tsuzuri-contract -p tsuzuri-core --all-targets --no-deps -- -D warnings", "cargo nextest run -p tsuzuri-contract --test cwty --no-tests=fail cwty_", "cargo run -q -p xtask -- check"]
        size: M
        done: (1) 窓の id は字 cw と頭の 0 の無い 1 以上の 10 進の数の字だけを読み（cw12 を読み、cw0・cw・cw01・w1・cw1x・cw-1・CW1 と末に空白の在る字を断る）、名の字は consult-cw12 と retired-consult-cw12、所見の id は窓の id と字 - と 1 以上の数の字だけを読む（cw3-1 を読み、cw3-0・cw3・cw3-01・cw0-1・cw3-1-2・cw3- ・-1 を断る）（歯 cwty_window_ids_read_and_refuse） (2) 頼みの id は字 rq- と UTC の分の字（数字 8 字・T・数字 4 字・Z の 14 字）と字 - と 1 以上の数の字だけを読み（rq-20261003T1412Z-1 を読み、Z の欠け・数が 0・分に数字でない字・数の欠け・rq の後の - の欠け・数の後の字を断る）、分の字の小文字の z を断る（歯 cwty_request_ids_read_and_refuse） (3) 閉じた語は、形が 話す・問う、起こし手が 席・持ち主のチャット・持ち主の button、経路が 見張り・完了・hook・一覧、採否が 採る・一部採る・採らない、窓の状態が 生きている・止まった・閉じた・退いた の順で、どの語も値へ戻り、知らない語は None、電文の字は英小文字の語（partial・done・button・ask）、確かさの probable と添え物の種類の image を電文で断る（歯 cwty_words_closed） (4) 所見と草稿と頼みと未受けと窓の一覧の電文は往復で同じ値に戻り（一覧の 4 つの段が Unknown の電文も）、所見の電文の id と window は字 cw3-1 と cw3、候補の採否と主張の確かさと添え物の種類は字 adopted と verified と report、未受けの電文は鍵 findings と requests の id の字の列（歯 cwty_wire_roundtrip と cwty_board_roundtrip） (5) 所見と草稿と候補と主張と添え物の電文は知らない鍵を断り、草稿の電文は鍵 id を断り、窓の id が cw0 の所見を断る（歯 cwty_unknown_keys_refused） (6) 草稿の欄の名の列 DRAFT_FIELDS は 12 で草稿の電文の鍵と同じ集まり、所見の電文の鍵はそれに id と window と date を足した集まり、保存の写し先 kept_path は字 docs/consult/kept と所見の id と添え物の path を / でつないだ相対の path（歯 cwty_draft_fields_and_kept_path） (7) cargo run -q -p xtask -- check が rc 0
        depends: []

      - id: cs-finding
        title: 窓が書く所見の草稿の欄を中核で検める（12 欄の欠けの名の列・知らない鍵・候補は 2 つ以上で採るのは 1 つ・確かさの閉じた 4 語・添え物の path は作業場からの相対・fixture finding-2・受入 AC16 の断り・差の file）
        req: ["FR19"]
        section: "4"
        write-set: ["crates/tsuzuri-core/src/consult/finding.rs", "+crates/tsuzuri-core/tests/cwfnd.rs", "+tests/fixtures/consult/finding-2/complete.json", "+tests/fixtures/consult/finding-2/missing.json"]
        verify: ["git apply --reverse --check docs/design/patch/cs-finding.patch", "cargo clippy -p tsuzuri-core --all-targets --no-deps -- -D warnings", "cargo nextest run -p tsuzuri-core --test cwfnd --no-tests=fail cwfnd_", "cargo run -q -p xtask -- check"]
        size: M
        done: (1) check は fixture tests/fixtures/consult/finding-2/complete.json を読み（題は fx-hub.7・候補 2・添え物 2）、missing.json を欠けた欄の名の列が bundle_digest の 1 つだけの断りにし、その断りの字は 欠けた欄 と半角のコロンと空白と bundle_digest（歯 cwfnd_fixture_complete_and_missing） (2) DRAFT_FIELDS の 12 欄のどれも、鍵を除く・null にする・字の欄を空白だけにすると、その欄の名 1 つだけの欠けの断りになり、topic と sandbox_denials の 2 つを除くと名の列はこの順（歯 cwfnd_each_field_missing_named） (3) 知らない鍵 id と score は字の順の名の列の知らない欄の断り、JSON の object でない字（[]・x・空・null・3）は object でない断り、basis を字にした草稿は形の断り（歯 cwfnd_unknown_and_not_object） (4) 候補が 1 つ・採る候補が 2 つ・採る候補が 0 の草稿は候補の断りで、採る候補が 1 つなら候補が 2 つでも 3 つでも読む（歯 cwfnd_options_one_adopted） (5) 主張の確かさは verified・deduced・inferred・uncertain の 4 語をそれぞれの値に読み、probable・Verified・空の字は形の断り（歯 cwfnd_confidence_four_words） (6) path_ok は work/report.md・a.py・work/x/y.csv・work/..x/a を通し、空・/ で始まる・.. の段（../x・work/../../x・work/..）・~ で始まる・逆斜線・字「・」・字「、」・改行を含む path を断り、check はその path の字を持つ path の断りにする（歯 cwfnd_attachment_paths） (7) cargo run -q -p xtask -- check が rc 0
        depends: [cs-types]

      - id: cs-lines
        title: 台帳の相談の 6 つの行の字と読みと置き場を中核に置く（頭は相談の頼み・開き・所見・受け・処分・閉じ・自由な字の整え・器の引用の形と定型行の頭の断り・memo か根だけに置き notes の 8192 byte の溢れは根へ・未受けの計算・席への固定の 1 行・判断の記録 ADR-29 決定 (4)(8)・差の file）
        req: ["FR19"]
        section: "5"
        write-set: ["crates/tsuzuri-core/src/consult/lines.rs", "+crates/tsuzuri-core/tests/cwlin.rs"]
