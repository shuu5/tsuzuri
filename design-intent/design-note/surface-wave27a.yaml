    - {who: 持ち主, date: 2026-10-02, ruling: t3-hub.75.1（裁定 id = t3-hub.75.1:20261002T2238Z-1・席とのチャット・notes に逐語）・t3-hub.75.2（裁定 id = t3-hub.75.2:20261002T2258Z-1・席とのチャット・パッケージ の形は乙）, verbatim: 4.これは微妙だ。相談といっても例えば新しい技術のスクラッチ実験とかデータの検証のためにプログラムを組むとかはできるべきだ。それがそのプロジェクトを汚さない形であるようにしてほしい。調査レポートなども作れるべきで、ただしそれを直接プロジェクト内に保存するのではなく、orchestratorに渡して保存するかどうか選ばせる形だ 5.常にweb調査もできるべき。上記の通りスクラッチ昨日は残さないと上質な調査は不可能だ それ以外は推奨で良い あと、consultは以前は一つの議題についての相談に特化していた気がするが、そのようにむやみに限定するのではなく、もっとorchestratorのコンテキストを汚さないために分離しているだけの自由な調査検証の場として作って。一つ話終わったからすぐに閉じるわけではない。途中でclearして別の話題について検証して結果をorchestratorに渡す、みたいな運用もあり得るし、なんならconsult窓が複数もあり得る／乙でよいだろう, surface: R-8}
  note: ノート surface-wave26b（32 行の全部が着地・同じ commit で廃止）の後。承認は判断の記録 ADR-29 の持ち主の裁定（t3-hub.75.1:20261002T2238Z-1 と t3-hub.75.2:20261002T2258Z-1）。第 0.1 版（2026-10-03）は目的と、相談の窓の第 1 の波の行 cs-types・cs-finding・cs-lines・cs-argv・cs-quota を置いた。

sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      判断の記録 ADR-29（相談の窓 consult の作り直し・持ち主の裁定 t3-hub.75.1 と t3-hub.75.2）の作る行と、後で足す行（同じ波に置く別の判断の記録の行）を流す。相談の窓は、席の文脈を汚さないために分けた自由な調べと検証の場で、tsuzuri の plugin の機能（skill /tsuzuri:consult と tz consult の命令）として作る（決定 (2)(3)）。形は持ち主が直に話す窓と席が背景で起こす問う窓の 2 つで、同じ起動の口・口座・基本ソフトの囲い・所見の口・受け方を通る（決定 (3)(5)(7)(8)）。計画は 16 行（型と中核の純な関数・tz consult の命令・席の hook・board の server の口と面・plugin）で、この版は第 1 の波の 5 行（型・所見の欄の検め・台帳の相談の行と置き場・席が自分で開く問う窓の数え・起動の argv と設定の組みと検め）を置く。残りの行（命令・hook・server・面・plugin）と後で足す行は起草の後に足す。受入 AC16 は行 cs-finding と後の行の歯で、AC19 は行 cs-argv と後の起こす口の行の歯で測り、囲いの実の効き（作業場の外と repo へ書けない）は着地の後に席の手で問う窓と話す窓の両方で撃って確かめる。当座の手順 docs/consult/ は命令の口が着地した後に席の設計の commit で退かせる（決定 (1) のク）。
