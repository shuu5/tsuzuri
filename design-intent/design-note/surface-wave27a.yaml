    body: |
      done と verify の対応（節の頭）。1 つ目の項は verify の 1 行目（git apply --reverse --check・歯でなく命令が測る）・2 つ目の項は verify の 2 行目（歯 kfold_groups_declare_every_module_once）・3 つ目の項は verify の 2 行目（歯 kfold_test_names_unique_in_each_crate）・4 つ目の項は verify の 3 行目（clippy・歯でなく命令が測る）・5 つ目の項は verify の 4 行目（群ごとの nextest・filter なし）・6 つ目の項は verify の 5 行目（filter cfsplit_）・7 つ目の項は verify の 6 行目（filter fxpre_contract_）・8 つ目の項は verify の 7 行目（filter contract_form_）・9 つ目の項は verify の 8 行目（xtask の check・歯でなく命令が測る）。1 つ目の項（差の当たり）と clippy の項と最後の項（xtask の check）は歯でなく命令の rc が測る。

      在りか。差の file docs/design/patch/t-fold-contract.patch は、main e16524a9（行 r-dbg と r-nextest-timeout の着地の後で、行 v-gate の commit を含む・v-gate の着地の前）に前の行 t-fold-xtask の差を当てた commit bb486178 の上で、席の道具 seq.sh（fold2.py と fixups.py・群の上限 10,000 行）を撃った commit d3285b98 から切った（19,206 byte・git diff -M）。差の file の数は、移すだけで中身を 1 字も替えない file 4・移して path の字か手直しを持つ file 9・足す file 1・移さずに字を書き替える file 3。席は置く直前の main の写しで seq.sh を撃って差を切り直す。行 t-fold-xtask の着地（main d6ad7ded）の後の木にも、行 t-fold-contract からこの行までの差は順に当たる（係 w89a が index に当てて確かめた）。

      なぜ。判断の記録 ADR-32（段の束ね）。tests/ の 1 file を 1 つの実行 file に組む形は、lib を 1 行替えるたびに歯の実行 file の全部を link し直し SSD を書く。着地した歯を crate ごとの群（1 万行まで・main.rs は module の行だけ）にまとめ、新しい行の歯は今までどおり tests/ の直下の 1 本（段）で足す。

      形。この行の群は crates/tsuzuri-contract/tests/teeth1。群は tests/<群>/main.rs（頭の //! の 2 行の直後に #![cfg(test)]・空の行・mod の行を名の順）と tests/<群>/<元の stem>.rs。module の file の中身は、移した file を名指す path の字の書き換え（fold2.py が workspace の歯の全部で当てる）と下の手直しのほか替えない。歯の名は nextest で <stem>::<fn> になる。xtask の歯 kfold_ の表 GROUPS は fold2.py が木の群と module の数で書き直す。手直し: 共通の手 tests/common/ は群 teeth1 の下へ移し、各 file の行 mod common; を use crate::common; に替える。重なる 3 つの名（contract_form_snapshot_matches と contract_form_roundtrip_all_types は cform_ の 6 本・contract_form_closed_lists は 4 本）は、名の頭 contract_form_ の後に群の字（surface・ledger・graph・board・stats・seat）と下線を挟む（例 contract_form_board_snapshot_matches）。cfsplit.rs は群の dir を返す fn group_dir を足して cform_ の file と common と自分を群の dir で読み、2 つ以上の群に在る名は群の字を挟んだ名で照らす。fxpre.rs の一覧の 2 つの file の名に群の dir の字を足す。xtask の kfold.rs の末に fn test_fns・fn rs_under と歯 kfold_test_names_unique_in_each_crate を足す。

      lint の期待。共通の手 tests/teeth1/common/mod.rs の 5 行目の #![expect(dead_code, reason = …)] は差で替えない（移すだけ）。群 teeth1 の 1 crate では、cform_ の 6 つとほかの module の use の和が共通の手の 13 の item（const AT・fn bead・fn ruling・struct Samples・trait Form と 3 つの trait の fn・fn form・fn snapshot_text・fn snapshot_matches・fn roundtrip_all・fn distinct）を全部使い、expect の行を消して clippy を撃っても dead_code は 1 つも出ない（rc 0）。それでも期待は満たされ、expect の行を置いたままの clippy も rc 0 になる。期待を満たすのは struct Samples の 2 つの欄 name と values で、どちらも trait Form の impl（同じ期待の下の code）の中だけで読まれる。欄と item ごとに expect を置いて撃つと、欄 name と values の 2 つの期待は満たされ、ほかの 13 の item と impl の 4 つ（impl と 3 つの fn）の期待は満たされないと報される（rustc と clippy 1.98.1・試作の木で撃った）。期待の外の歯から 2 つの欄を読む 1 本を足すと、common/mod.rs の 5 行目に満たされない期待の lint が出て clippy が落ちる（下の噛み）。ほかの移す file の lint の属性は頭の #![cfg(test)] だけ。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      構造の連鎖。移す file を名指す path の字はほかの crate の歯にも在り、差はその file も書く（write-set の ~ と + の対のほかの項目）。群の main.rs は畳みの行だけが書く。まだ着地していない行（ノート surface-wave27a の cs-types・cs-finding・cs-lines・cs-argv・cs-quota と、着地の印を持たない古い行）の write-set と verify が名指す歯の file は、どれも今の木に無い新しい file で、この差は動かさない（係 w89a の照らし）。

      試作と噛み。試作の木（commit d3285b98）で、差の当たりが rc 0、verify の行のうち xtask の check を除く 5 行が全部 rc 0（kfold_ 2 本・群 teeth1 の歯 43 本・cfsplit_ 6 本・fxpre_contract_ 1 本・contract_form_ 21 本）。 足した clippy の行（verify の 3 行目）は同じ木で rc 0（移した file を touch してから撃った・群 teeth1 を clippy-driver が組んだことを -v で見た）。 6 行を全部当てた木（commit 5cad5dad）で cargo run -q -p xtask -- check を 1 回撃って rc 0（224 秒・歯 3,036 本が全部緑・clippy の段 cargo clippy --workspace --all-targets -- -D warnings と面の wasm の clippy が rc 0・size は file-lines 1348/1500・入れ子の段は字 nested workspaces=0）。途中の木では xtask の check を撃っていない。歯の fn の名は main e16524a9 と同じ（契約 43・core 324・境界 587・面 847・folio 946・xtask は kfold_ の 2 本が増えて 34・契約の 16 か所の名替えのほか消えた名も増えた名も無い）。噛みの後に書き戻した木の対照の撃ちは全部緑。 噛みは変異 4（どれも rc 100）: cform_board の名 contract_form_board_snapshot_matches を群 stats の名と同じにする（kfold_test_names_unique_in_each_crate が落ちる）・同じ名を元の名へ戻す（1 か所だけでは重ならないので一意の歯は通り、cfsplit_test_names_floor が落ちる）・cfsplit の fn group_dir を tests/ の直下へ戻す（cfsplit_ の 4 本が落ちる）・fxpre の一覧の cform_surface の群の字を外す（fxpre_contract_tests_hold_none が落ちる）。 clippy の行の噛み: 群 teeth1 の cform_board.rs に Samples の欄 name と values を読む歯を 1 本足すと、verify の 3 行目の clippy が common/mod.rs の 5 行目に満たされない期待の lint を出して rc 101 で落ち、書き戻すと rc 0。

      範囲の外。新しい行の歯の置き方（段）と畳みの行の置き方は起草の守りと席の手が持つ。klintf と klint の根の重複の退役・自分の名の照らしの寄せは別の行。着地した行の verify の字（--test の旧い名）と差の file は歴史として残し書き換えない（判断の記録 ADR-32 の決定 (9)）。

