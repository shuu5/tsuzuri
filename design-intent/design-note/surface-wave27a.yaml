    title: 行 cs-watch — 席の背景の見張り
    body: |
      在りか。差の file docs/design/patch/cs-watch.patch は、行 cs-open の試作 c57c60ff の木に行 cs-launch と cs-answer の試作を載せた木に試作の commit ebd39c5b（写し drafts/w85a・書く file は重ならず cs-open の木でも当たる）を載せて切った（2 file・20,306 byte・+493 −7・第 0.11 版で歯の file を、第 0.15 版で歯の fileを直し、main 145db064 に着地していない前の行の差を 11 行の順に当てた木の上で切り直した）。行 cs-open が骨で置いた境界の watch.rs を中身に替え、歯の file を足す。

      なぜ。判断の記録 ADR-29 決定 (8) は、席が相談の見張りを背景に常に 1 本置き、開いている窓の作業場の新しい所見と台帳の受けの無い頼みが現れると固定の 1 行を出して終わり、待ちの席を起こすと決めた。見張りは背景の命令の時間の上限いっぱいで待ち、上限で終わった時も置き直す。見張りは生きている印を置き、停止の hook は印の無い時に見張りを置くよう席を続けさせる（hook は後の行 cs-hooks）。決定 (5) は所見の無いまま process の無い問う窓を止まったとし、席が束から撃ち直すと決めた（見張りもその 1 行を出す）。受入 AC16 は揃った所見を置いた作業場で見張りが 1 行を出すことを見る。

      形（要約・字は差の file）。(a) 引数は --max <秒>（1 以上・既定 MAX の 7080 秒＝Bash の道具の背景の上限 7200 秒より 2 分短く）と共通の旗だけ。(b) 生きている印は起草の置き場の consult-watch.alive。更新時刻が FRESH（90 秒）の内なら ALREADY の 1 行（相談 と半角のコロンと空白と 見張りはもう居る）を出して rc 0 で終わる（印を替えない）。(c) 台帳を bd で読み（読めなければ印を置かずに rc 2）、印の字（pid = <pid>・始まり = <分> と改行）を書く。(d) 輪は、scan が事象を返せばその固定の 1 行、上限を越えれば中核の notice の上限の 1 行で終わる。間は TICK（5 秒・上限の残りまで）眠り、TOUCH（30 秒）ごとに印を書き直し、Source::mark（store の印・store が無ければ .beads の 2 file の更新時刻と長さ）が前と違えば台帳を読み直す（落ちれば標準エラーに 1 行で前の読みのまま）。終わりで印の字が自分の字なら消す。(e) scan は退いていない窓の所見の id を集めて中核の unreceived に渡し、受けの無い所見（経路 見張り）、受けの無い頼み、閉じの行の無い問う窓で最後の process の印が在って生きておらず所見の無い窓（止まった）、閉じの行の無い話す窓で最後の印の pane の pid が生きていない窓（閉じられた）の順に最初の 1 つ。行の字は中核の lines の notice（命令の頭は tzw）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 つ目から 5 つ目の項は verify の 3 行目（cwwat_ の 5 本）、最後の項は 4 行目（xtask の check・歯の全部を撃つ）。done の項は歯が測る物だけにした。verify の 1 行目（git apply --reverse --check）は差の file の hunk が全部木に在ることを、2 行目（cargo clippy -p tsuzuri-boundary --all-targets --no-deps -- -D warnings）は clippy の落ちが無いことを、命令の rc で測る守りで、done の項にしない。

      構造の連鎖。watch.rs は行 cs-open が骨で置き、中身はこの行だけが書く。使うのは中核の lines（Event・Line・notice・unreceived）、境界の server の ledger の Mark と Source（今の pub の名・替えない）、行 cs-open の共通の手。alive_path・fresh・scan と定数 ALIVE・FRESH・TOUCH・TICK・MAX・ALREADY は pub（後の行 cs-hooks が印の新しさを見る）。

      試作と噛み。main 5c8fe2b4（行 cs-types が着地）に行 cs-finding から cs-watch までの差を契約表の順に当てた木 e47e6b8c（写し drafts/w93a）で境界の crate の clippy（--all-targets --no-deps・-D warnings）が rc 0、歯 cwwat_ の 5 本が通る。xtask の check は 11 行の差を全部当てた最後の木 8214cef7 で 1 回だけ撃って rc 0（workspace の歯 3,104 本・size は file-lines 1348/1500・core-lines 8367/20000・test-src-ratio 7069/82463・今の main 61c2a443 に着地していない行の差を順に当てた木の crates と tests と xtask の字は 8214cef7 と同じ）で、行ごとの木では撃っていない。第 0.11 版の直し（否定の見本が測りたい句より前の別の理由で断られる空振りを除く・係 w93a）は、鍵 tsuzuri.draftsdir の欠けの見本を台帳の読める形に戻して断りの字を照らし、所見の無い生きている問う窓と話す窓を足した（前は台帳も消えたままで、止まった窓の判じの見本の生きている窓は所見も持っていた）。その噛みは変異 2（鍵が無ければ temp の dir を置き場にする・生きているかを見ない）で、どれも直した歯で落ち（rc 100・対照は全部通る）、前の歯では鍵の変異が通った（空振り・生きているかを見ない変異は前の歯でも別の歯 cwwat_finding_line_once で落ちた）。次の噛みは直す前の差で、係 w85a の写しの木 ebd39c5b で撃った。噛みは変異 5 つ（経路の語を替える・頼みを見ない・生きている印を見ない・台帳をいつも読み直す・上限 0 を通す）で、5 本の歯のどれも少なくとも 1 つで落ちる（どの変異も rc 100・対照は全部通る）。歯は作業場の file を直に書き（所見は fixture complete.json の草稿に id と時刻を足した JSON）、tz consult watch を短い上限で撃つ（歯の全部で 11 秒ほど）。

      句の型の照らし（第 0.15 版・便 t3-hub.75.5 の 2 度目の審査の vacuous-assert に答える・係 w93a）。done の句を型（順・1 度だけと重ねない・縁と既定と空・だけ）に分け、句を崩す変異（順を替える・重ねる・縁を 1 ずらす・既定に倒す・だけの絞りを外す）を 26 撃ち、直した歯で 26 が名指しの歯で落ちた（rc 100・対照は全部通る）。前の歯では落ちない見立て（src と歯を読んだ見立て・前の歯では撃っていない）の変異が 2 で、その句の見本を足して直した（最後の process の無い問う窓（前の印は生きている）・受けた所見を持つ止まった問う窓）。歯の fn の数と名は替えない。src は替えない。xtask の check は main 145db064 に着地していない行の差を 11 行の順に当てた木 2b4b6fe6 で rc 0（workspace の歯 3,121 本・size は file-lines 1348/1500・core-lines 8367/20000・test-src-ratio 7069/82743）。

      流す時と順。depends は cs-open（共通の手と骨）と cs-finding（歯が check と fixture を使う）。同じ波の行 cs-launch・cs-answer・cs-show と書く file が重ならない。depends の確かめ（係 w93a・第 0.9 版の差・歯の file を直す前）は、main 19407588 に depends を辿った行 cs-types・cs-finding・cs-lines・cs-argv・cs-open の差とこの行の差だけを当てた木 6ae93f49 で、境界の crate の clippy と歯 cwwat_ の 5 本が通る。

      範囲の外。印の無い時に席の hook が拾う形（行 cs-hooks）。skill が見張りを背景で置く手順（行 cs-plugin）。
