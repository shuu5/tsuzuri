    body: |
      在りか。差の file docs/design/patch/v-ci-split-teeth.patch は、main 26a2b9ad に main の行 v-ci-split の差を当てた木 14e64954 に、歯の file だけを替えた commit を載せた木 7fd346fe（写し drafts/w94a）との差で切った（1 file・4,931 byte・+67 −30）。xtask/tests/vsplit.rs の歯 vsplit_unknown_key_refused と vsplit_check_wiring を強め、字の順を見る助けの関数 in_order を足す。src は替えない。

      なぜ。判断の記録 ADR-34 の決定 (9) の行 v-ci-split は、句ごとの噛み（起草の共通の守りの 2026-10-03 の決め）の前の歯で着地する。その歯では、done の句を見ない変異 9 つが通る（行 v-ci-split の差を当てた木で撃った）。通るのは、割りの字の頭 count: と区切り / と k と N の数と 1 ≤ k の 5 つと、ほかの役の段を撃たない腕（面の組み立て・cargo の段・fn turn・入れ子の段）の 4 つである。割りの字の否定の見本 8 は、頭と / と N の 3 句が同時に欠け、どの句を外した変異でも別の理由で断られる。腕は判じの呼びの字だけを見ていた。歯だけを替える行で強める。

      形（要約・字は差の file）。(a) vsplit_unknown_key_refused は、正しい見本（鍵 cargo build --workspace の count:1/8 と、鍵 surface-build の count:7/8 で撃つ）を先に断言し、表に無い鍵は鍵だけが違う形、割りの字は count:7/8 から句の 1 つだけを外した 6 つ（1/8・count:7-8・count:x/8・count:7/y・count:0/8・count:9/8）にする。(b) vsplit_check_wiring は、fn check の面の組み立ての腕 Ok(false) => 0,、fn cargo_step の Ok(false) => return 0,、fn turn の match spread::turn(key, part) { と Ok(spread::Turn::Run) => Ok(true), と spread::line(key, owner, n) と Ok(false)、入れ子の段の 4 つの腕を、字の順と 1 度ずつで見る（助けの関数 in_order）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 つ目から 2 つ目の項は verify の 3 行目（vsplit_ の 6 本・名指すのは強めた 2 本で、ほかの 4 本は行 v-ci-split の done のまま）、最後の項は 4 行目（xtask の check・歯の全部を撃つ）。done の項は歯が測る物だけにした。verify の 1 行目（git apply --reverse --check）は差の file の hunk が全部木に在ることを、2 行目（cargo clippy -p xtask --all-targets --no-deps -- -D warnings）は clippy の落ちが無いことを、命令の rc で測る守りで、done の項にしない。

      構造の連鎖（木 14e64954 で grep）。xtask/tests/vsplit.rs は行 v-ci-split が置いた歯の file で、ほかの行は書かない。歯の名は替えず、vsplit_ の 6 本のまま。助けの関数 in_order は test の fn でないので、群に束ねても歯の名は重ならない。読む src（main.rs・nested.rs・spread.rs）の字は行 v-ci-split の差のままで、この行の木の xtask の下は試作の木 30df5a38 と同じ字。

      試作と噛み。木 7fd346fe で verify の 3 行（差の当たり・clippy・歯 vsplit_ の 6 本）が rc 0。xtask の歯の全部（88 本）が通る。xtask の check は行 v-daily の差も当てた木 a36dfc72 で 1 回撃って rc 0（150 秒・workspace の歯 3,078 本）。噛みは done の句ごとに 1 つずつ当てた変異 24 で、強めた歯ではどれも rc 100 で名指しの歯がその句の断言で落ちる。着地する前の版の歯（木 14e64954）では同じ 24 のうち 9 が通る（句と歯の断言と変異と rc の 2 つの表は起草の notes）。歯の名は main 26a2b9ad の契約表の verify の filter の語 423（行 v-ci-split の vsplit_ を除く）と群の module の名 372 のどれとも部分の字で重ならない。

      流す時と順。depends は v-ci-split（その行の歯の file を書き替える）。差は v-ci-split の差を当てた木の上で切り、行 v-daily とは書く file が重ならない。決定 (10) の T の前に着地させる。

      範囲の外。src の振る舞い（行 v-ci-split の字のまま）。ほかの行の歯の空振りの探し。

