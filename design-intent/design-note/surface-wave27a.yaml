    title: 行 cs-finding — 所見の欄の検め
    body: |
      在りか。差の file docs/design/patch/cs-finding.patch は、main 5b1099ae に行 cs-types の試作 8747a2da を載せた木（行 cs-types の着地の見立て）に試作の commit 01643b92（写し drafts/w83a）を載せて切った（4 file・13,094 byte・+305 −1）。中核の src/consult/finding.rs の骨の注 1 行を中身に替え、fixture の dir tests/fixtures/consult/finding-2/ に complete.json と missing.json を足す。

      なぜ。判断の記録 ADR-10 決定 (3) は所見の欄（結論・候補と採否・推奨・根拠の id・主張ごとの確かさ・持ち主に問うべき事・触る節点・使った model・読んだ束の要約値）を出す口が検め、欠けていれば受けないと決め、ADR-29 決定 (1) のウが話題と添え物を足し、決定 (8) が所見の口に添え物が作業場の下に在ることを確かめさせる。受入 AC16 は欄を 1 つ欠いた所見と揃った所見の 2 つ（fixture finding-2）で断りを見る。撤退の条件 (3) の材料として、囲いに断られて困った事の欄 sandbox_denials を足す（空の列でよい）。

      形（要約・字は差の file）。check（草稿の字を受け、FindingDraft か断り Refusal を返す）。順は (a) JSON の object でなければ NotObject、(b) DRAFT_FIELDS の順に、鍵が無い・null・空白だけの字の欄の名を集めて 1 つでも在れば Missing（列の欄は空の列でも欠けでない）、(c) 知らない鍵を字の順に集めて Unknown、(d) serde で読めなければ Shape（serde の理由の字）、(e) 候補が 2 未満か採る候補が 1 つでなければ Options、(f) 添え物の path が path_ok でなければ Path（その path の字）。path_ok は、空・/ で始まる・~ で始まる・/ で切った段に .. が在る・制御の字・逆斜線・字「・」・字「、」を断る（字「・」と「、」は台帳の処分の行の区切り）。断りの字（Display）は、欠けた欄 と半角のコロンと空白と名の列（, と空白で区切る）・知らない欄 と同じ形・所見の草稿が JSON の object でない・欄の形が違う と理由・候補は 2 つ以上で採る（adopted）のは 1 つ・添え物の path が作業場からの相対でない と path。中核は file を触らないので、添え物が作業場の下に実在するか（canonicalize）は後の行 cs-answer の所見の口が確かめる。

      fixture。complete.json は 12 欄が揃った草稿（題 fx-hub.7・候補 a を採り b を採らない・主張 2・添え物 work/report.md と work/probe.py・ask_owner と sandbox_denials は空の列）。missing.json は complete.json から bundle_digest の行だけを除いた字。host の path と口座の名を書かない。後の行 cs-answer の歯もこの 2 つを読む。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 つ目の項は verify の 1 行目、2 つ目の項は 2 行目、3 つ目から 8 つ目の項は 3 行目（cwfnd_ の 6 本）、9 つ目の項は 4 行目。

      構造の連鎖。finding.rs は行 cs-types が骨（頭の注 1 行）で置き、中身はこの行だけが書く。使う型は契約の consult の Adoption・DRAFT_FIELDS・FindingDraft だけ。check と path_ok と Refusal を呼ぶ所は今の木に無い（後の行 cs-answer が呼ぶ）。

      試作と噛み。試作の木（main 5b1099ae と行 cs-types とこの行）で中核の crate の clippy（--all-targets --no-deps・-D warnings）が rc 0、歯 cwfnd_ の 6 本が通る。xtask の check は rc 0（workspace の歯 3,036 本）。噛みは変異 7 つ（欠けの字を空白で見ない・欠けの理由の字を替える・知らない鍵を通す・採る候補 2 つを通す・.. の段を通す・uncertain を断る・欠けの列を逆にする）で、6 本の歯のどれも少なくとも 1 つで落ちる（どの変異も rc 100・対照は全部通る）。

      流す時と順。depends は cs-types（骨の file と型）。同じ波の行 cs-lines・cs-argv と書く file が重ならない。

      範囲の外。所見の file を書く口と番号の増やし方と作業場の下の実在の確かめ（行 cs-answer）。所見を読む口と処分（行 cs-show）。
  - n: 5
    type: prose
    title: 行 cs-lines — 台帳の相談の行の字と置き場
    body: |
      在りか。差の file docs/design/patch/cs-lines.patch は、main 5b1099ae に行 cs-types の試作 8747a2da を載せた木に試作の commit 745ad5f8（写し drafts/w83a・行 cs-finding の試作 01643b92 の上・書く file は重ならない）を載せて切った（2 file・37,120 byte・+1088 −1）。中核の src/consult/lines.rs の骨の注 1 行を中身に替える。

      なぜ。判断の記録 ADR-29 決定 (4) は、相談の bead を起こさず、台帳の型付きの行（頭が相談の で始まる閉じた 6 つ）で記帳し、置けるのは memo と根の bead だけで、開いた問い（版の要約値が notes を含む）と契約の bead に置かないと決めた。決定 (8) は見張りが固定の 1 行を出して席を起こすと決めた。器の席の答え（memo t3-hub.75）の注意 (a) は行の本文に器の引用の形（user と時刻・batch: ・policy: ・問いの id と分と数の並び）を書くと裁定の引用として数えられること、(b) は memo の notes の 8192 byte の上限、(c) は memo の notes が memo の審査の材料になること。この行は字と置き場を純な関数にし、書く口（後の行）が同じ関数を引く。

      行の字の段（6 つの見本・render の字）。

      相談の頼み = rq-20261003T1412Z-1・題 = t3-hub.75・形 = 話す・model = fable・起こし手 = 持ち主の button・時刻 = 20261003T1412Z

      相談の開き = cw3・形 = 話す・題 = 題なし・起こし手 = 持ち主のチャット・発話 = 20261003T1410Z・model = fable・念入りさ = xhigh・結果 = 開いた・時刻 = 20261003T1412Z

      相談の所見 = cw3-1・窓 = cw3・題 = t3-hub.75・時刻 = 20261003T1530Z

      相談の受け = cw3-1・経路 = 見張り・時刻 = 20261003T1530Z

      相談の処分 = cw3-1・採否 = 一部採る・理由 = 前提の 1 つが古い・保存 = work/report.md・不保存 = work/a.py、work/b.csv・時刻 = 20261003T1602Z

      相談の閉じ = cw3・起こし手 = 席・所見 = 2・時刻 = 20261003T1800Z

      形（要約・字は差の file）。(a) Line は 6 つの variant（Request・Open・Finding・Receipt・Disposal・Close）。開きの起こし手 By は Seat・Chat（発話の分の字）・Button（頼みの id）、受けた物 Subject は所見か頼み。render は頭と「 = 」と主の id の後に「<名> = <値>」の欄を「・」で区切って並べ、時刻は分の字（前に user を付けない）。自由な字（題・model・念入りさ・理由）は free で整え（字「・」を「／」に・制御の字を空白に・前後の空白を除く・題と model と念入りさは WORD_MAX の 40 字・理由は REASON_MAX の 80 字）、題が空なら NO_TOPIC の 題なし、保存と不保存の path の列は字「、」でつなぎ空なら NONE の なし。最後に cited が真なら書かずに LineError::Cited。read は render の逆で、scan は notes の行ごとに read する。(b) cited は、字「:」の後に分の字と字「-」と数字（裁定 id の形）・字 batch: ・字 policy: ・字 user と空白の後に数字・導出グラフの TYPED_LINES の 3 つの頭（行頭に限らず字の中）・配達の印の頭 MARK_PREFIX のどれかで真。行は相談の で始まるので TYPED_LINES の行頭の照らしに当たらない。頼みの id は字「:」を持たないので当たらない。器の注意 (a) の 4 形（裁定 id の形・batch: ・policy: ・user と時刻）を断り、許すのは裸の bead id だけ。裸の bead id（t3-hub.75.1 のように字「:」と分と数の無い問いの id）は、器の席の答え（器の引用の読みは <問い id>:<分>-<n> まで揃った字だけ）のとおり引用に数えないので、題の欄に開いた問いの id をそのまま書く（置き替えない）。(c) home_of（台帳の LedgerItem の列・題・足す字）。根 root_of は種類 epic・親が無い・closed でない bead の id の自然な順で最初（境界の server/policy.rs の root_epic と同じ決まりを中核に置く）。題が台帳の bead なら、その bead から親を上へたどり（題が memo ならその memo）最も近い label intake:memo の bead に置く。たどりは台帳の bead の数を越えたら止める。memo の notes の byte と足す字の byte と 1（改行）の和が NOTES_MAX の 8192 を越えれば根に置き、足す字は Home::line で末に ・memo = <memo の id>（notes が満ちた）を足した字。根の notes の長さは見ない（器の席の答え Q-V3・notes の上限は器の rules 行 memo.notes_max_bytes の memo だけで、epic と契約には無い）。断りは根の epic が無い時の HomeError::NoRoot だけ。(d) unreceived（行の列・作業場に在る所見の id の列）は ConsultUnreceived を返す。(e) notice（事象・tz の解き方の命令の字）は次の固定の 1 行の段の字を返す。

      固定の 1 行の段（tz の解き方の命令の字が /x/tzw の時）。

      相談: 窓 cw3 の所見 cw3-1 が届いた（/x/tzw consult show cw3-1 --via 見張り）・「/x/tzw consult watch」を背景で置き直す

      相談: 窓 cw4 の所見 cw4-2 が届いた（/x/tzw consult show cw4-2 --via 完了）

      相談: 頼み rq-20261003T1412Z-1 が届いた（/x/tzw consult open --request rq-20261003T1412Z-1 --by button）・「/x/tzw consult watch」を背景で置き直す

      相談: 問う窓 cw4 が所見なしで止まった（/x/tzw consult launch cw4 --again）・「/x/tzw consult watch」を背景で置き直す

      相談: 話す窓 cw3 が閉じられた（/x/tzw consult close cw3 --by chat）・「/x/tzw consult watch」を背景で置き直す

      相談: 見張りが上限で終わった・「/x/tzw consult watch」を背景で置き直す

      器の席の答え。Q-V2: 器の入力の時の hook が席の文脈へ器が記録した発話の時刻の 1 行（scribe2 utterance と ts）を出すので、持ち主のチャットで開く窓の開きの行の 発話 = はその時刻を分の字にして書く（逐語は器の utterance show の口で引ける）。Q-V3: notes の上限は memo だけなので、memo が満ちる行は根に置く形のまま（根では断らない）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 つ目の項は verify の 1 行目、2 つ目の項は 2 行目、3 つ目から 11 番目の項は 3 行目（cwlin_ の 9 本）、最後の項は 4 行目。

      構造の連鎖。lines.rs は行 cs-types が骨で置き、中身はこの行だけが書く。使うのは契約の consult の id と語と minute_ok・graph の natural_cmp・ledger の BeadId と LedgerItem（is_memo）と、中核の delivery の MARK_PREFIX と graph::build の TYPED_LINES（どれも今の pub の名・替えない）。lines の名を呼ぶ所は今の木に無く、後の行 cs-quota（Line と By）・cs-open・cs-watch・cs-show・cs-close・cs-server・cs-hooks が呼ぶ。

      試作と噛み。試作の木で中核の crate の clippy（--all-targets --no-deps・-D warnings）が rc 0、歯 cwlin_ の 9 本が通る。xtask の check は積み直した最後の木 60d2c916 で rc 0（workspace の歯 3,057 本）。噛みは変異 8 つ（処分の頭を替える・撃ち直しの印の値を替える・中黒を替えない・裁定 id の尾の - を見ない・分の字を見ない・memo でなく問いへ置く・受けた所見を未受けにする・完了の行にも置き直しを足す）で、9 本の歯のどれも少なくとも 1 つで落ちる（どの変異も rc 100・対照は全部通る・歯が 9 本なので変異は 8 つ）。

      流す時と順。depends は cs-types。同じ波の行 cs-finding・cs-argv と書く file が重ならない。後の行 cs-quota がこの行の Line を読む。

      範囲の外。台帳に行を書く口（bdw の AppendNotes を撃つ命令と server の口は後の行）。台帳の bd の字から LedgerItem への読み（境界の今の読みを後の行が使う）。memo が閉じているかの照らし（置かない理由が決まっていない・notes の未確か）。
  - n: 6
    type: prose
    title: 行 cs-argv — 起動の argv と設定の組みと検め
    body: |
      在りか。差の file docs/design/patch/cs-argv.patch は、main 5b1099ae に行 cs-types の試作 8747a2da を載せた木に試作の commit c77fdc1d（写し drafts/w83a・行 cs-finding と cs-lines の試作の上・書く file は重ならない）を載せて切った（3 file・32,008 byte・+808 −1）。中核の src/consult/launch.rs の骨の注 1 行を中身に替え、fixture tests/fixtures/consult/launch-argv.yaml を足す。

      なぜ。判断の記録 ADR-29 決定 (5)(6)(7) は、起動の口が席の環境を継ぎ、器と tsuzuri の plugin を渡さず、制限の形・許可を聞かない形・道具の閉じた列・MCP の断り・読む根の足しと書きの断り・私用の短い temp・囲いの設定で窓を起こし、起動の口の argv と設定を歯で測ると決めた。受入 AC19 は、組んだ argv と設定を fixture と比べ、plugin の置き場の旗を足した形と囲いの設定を 1 つ欠いた形で落ちることを見る。旗と鍵の名は検証役 qv44a の報告 3 の実測の字（Claude Code 2.1.288）。

      読む根を絞る理由（ADR-29 決定 (7) の「器の state」の読み・ADR の字は替えない）。決定 (7) の読む根の足しは repo と台帳と器の state を名指す。器の state を state dir の丸ごとと読むと、(i) state dir の accounts の下の全口座の資格の file が Read の道具から読め、(ii) 囲いの書きの断りに state dir を置くとその下の作業場（席の drafts の下の窓の dir）も覆う。そこで「器の state」を器の出力の読み場所（state dir の fleet と pipe）と読む狭める側の読みを採り、accounts は資格の断り（sandbox.credentials.files）と Read の断り（permissions.deny）に置く。台帳は囲いの中で bd を撃てない（LOCK を書けない・計画の撃った確かめ）ので、束の台帳の写し（行 cs-open）で読む。殻の命令は囲いの中でも state dir の残りを読める（書けない）。

      形（要約・字は差の file）。(a) 材料 Launch は 形・窓の id・作業場 W・repo R・state dir S・読む根のうち在る dir の列・解いた tz の path T・uid・model・念入りさ・束に問いが在るか。path は「/」で始まる絶対 path、uid は 10 進の字。read_roots は R と S/fleet と S/pipe（在る dir だけを渡すのは後の行 cs-launch）。(b) argv は、問う窓だけ頭に -p と問いの指示、続けて --restricted・--permission-mode dontAsk・--tools（TOOLS の Read,Grep,Glob,Bash,Edit,Write,WebSearch,WebFetch）・--disallowedTools mcp__*・--strict-mcp-config・読む根ごとの --add-dir・--settings と設定の JSON の字（file にしない）・--model・--effort・--name consult-cw<n>、末に問う窓は --output-format json、話す窓は最初の指示の位置の引数（束に問いが在れば bundle/question.md も読ませる）。program の名 PROGRAM は claude で argv に含めない。(c) 設定 settings の全部は fixture の settings の字（置き字の W・R・S・T・U を囲いを省いた形で書くと、permissions は allow が WebSearch・WebFetch・Edit(//W/**) で deny が Read(//S/accounts/**)・Read(//R/.beads/.env)、sandbox は enabled 真・autoAllowBashIfSandboxed 真・allowUnsandboxedCommands 偽・failIfUnavailable 真・filesystem.denyWrite が読む根の列・credentials.files が CREDENTIALS の 5 つと S/accounts と R/.beads/.env と /tmp/claude-U の 8 つを mode deny・network.allowedDomains が DOMAINS の 6 つ、env は UV_CACHE_DIR・PIP_CACHE_DIR が W/.venv の下・CARGO_HOME が W/target/cargo-home・npm_config_cache が W/node_modules/.npm-cache、hooks は PreToolUse の matcher * に命令 timeout 4 T consult guard || exit 2 と timeout 10）。Edit の許しは絶対 path の頭に「/」を 1 つ足した //<path> の形（qv44a の報告 2）。(d) 環境。env は窓の id の TZ_CONSULT_ID と私用の temp の CLAUDE_CODE_TMPDIR の 2 つ。話す窓の tmux の -e の閉じた列 TALK_ENV は CLAUDE_CONFIG_DIR・PATH・TZ_CONSULT_ID・CLAUDE_CODE_TMPDIR、問う窓が席の環境から外す ASK_DROP は TMUX・TMUX_PANE。private_tmp は /tmp/tzc- と作業場の path の FNV-1a 64（契約の ledger の fnv1a64）の 16 進の頭 6 字（15 byte・Claude Code の 30 byte ほどの縛りの内）。(e) audit（argv と材料）は欠けと広い許しの名の列を返し、空なら起こしてよい。見るのは、FORBIDDEN の 5 つの字（--plugin-dir・--dangerously-skip-permissions・bypassPermissions・--mcp-config・--append-system-prompt）が argv の字の頭か末に無いこと、旗の次の字（許可の形・道具の列・MCP の断り・窓の名・model・念入りさ）、--restricted と --strict-mcp-config と --settings、-p と --output-format json が問う窓にだけ在ること、--add-dir の値が read_roots と材料の読む根の両方に在ること、設定の SANDBOX_FIXED の 4 つの値、ABSENT の 4 つの鍵（excludedCommands・allowUnixSockets・allowAllUnixSockets・permissions の defaultMode）が無いこと、許すドメインが DOMAINS の部分で空でないこと、書きの断りが読む根を全部持つこと、資格の断りが 8 つを mode deny で持つこと、許しが WebSearch・WebFetch・作業場の Edit の部分で前の 2 つを持つこと、Read の断りの 2 つ、env の 4 つの鍵が作業場の下、守りの hook の matcher と命令。(f) PLUGIN_VERSION は 0.2.0（plugin.json の version は後の行 cs-plugin が 0.2.0 に上げ、同じ字の歯を置く・workspace の Cargo の版は動かさない）、VERSION_ENV は TZ_PLUGIN_VERSION、version_ok は置かれた字が PLUGIN_VERSION と同じかだけを見る。(g) brief は束の手引き bundle/brief.md の字（窓の id と解いた tz の path の answer と bundle の口・作業場の決まり・web・台帳の写し・notes.md・草稿の 12 欄と欄の決まり・sandbox_denials・承認を受けない）。

      fixture（JSON の字・JSON は YAML でもあるので名は .yaml のまま）。置き字 /W（作業場）・/R（repo）・/S（state dir）・/T（解いた tz）と uid の U で host の path を書かない。話す窓（cw3・問いなし）と問う窓（cw4・問いあり）の inputs と argv（設定の字の所は <settings>）と環境の 2 つの組、talk_env・ask_drop、settings の全部。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 つ目の項は verify の 1 行目、2 つ目の項は 2 行目、3 つ目から 9 つ目の項は 3 行目（cwarg_ の 7 本）、最後の項は 4 行目。

      構造の連鎖。launch.rs は行 cs-types が骨で置き、中身はこの行だけが書く。使うのは契約の consult の DRAFT_FIELDS・Form・WindowId と ledger の fnv1a64 と serde_json の json! と Value（どれも今の pub）。launch の名を呼ぶ所は今の木に無い（後の行 cs-open が brief を、cs-launch が argv・settings・env・audit・version_ok を呼ぶ）。

      試作と噛み。試作の木で中核の crate の clippy（--all-targets --no-deps・-D warnings）が rc 0、歯 cwarg_ の 7 本が通る。xtask の check は積み直した最後の木 60d2c916 で rc 0（workspace の歯 3,057 本）。噛みは変異 7 つ（囲いが起きない時も起こす・断る旗を見ない・資格の断りの欠けを見ない・広い許しを見ない・excludedCommands を見ない・temp の path を長くする・手引きの所見の口を解いた tz の path でなくする）で、7 本の歯のどれも少なくとも 1 つで落ちる（どの変異も rc 100・対照は全部通る）。

      流す時と順。depends は cs-types。同じ波の行 cs-finding・cs-lines と書く file が重ならない。

      範囲の外。窓を実に起こす口（tmux と claude -p・在る読む根の選び・proc の印・行 cs-launch）。守りの hook の口 tz consult guard の中身（行 cs-answer）。plugin.json の版と tz の解き方 tzw（行 cs-plugin）。対話の窓での囲いの実の効き（着地の後の席の手の確かめ）。
  - n: 7
    type: prose
    title: 行 cs-quota — 席が自分で開く問う窓の数え
    body: |
      在りか。差の file docs/design/patch/cs-quota.patch は、main 5b1099ae に行 cs-types と cs-finding と cs-lines の試作を載せた木（745ad5f8）に試作の commit 60d2c916（写し drafts/w83a・行 cs-argv の試作 c77fdc1d の上・書く file は重ならない）を載せて切った（2 file・8,212 byte・+193 −1）。中核の src/consult/quota.rs の骨の注 1 行を中身に替える。

      なぜ。判断の記録 ADR-29 決定 (10) と規則の行 R-38 は、席が自分で開く問う窓を同時に 1 本・1 日（UTC の日）3 本までとし、持ち主の言葉（skill か button）で開く窓と止まって撃ち直した窓は数えず、越える時は起動の口が断り、席は決定の画面で持ち主に問うと決めた。数えるのは起動の口で、台帳の相談の行の起こし手で見分ける（R-38 の note）。

      形（要約・字は差の file）。LIVE_MAX は 1、DAY_MAX は 3、REFUSAL は字 R-38 の上限（同時 1 本・1 日 3 本）で断った・決定の画面で持ち主に問う。count（台帳の相談の行の列・今の分の字・process の印が生きている窓の列）は SeatQuota を返す。今日の数は、開きの行（行 cs-lines の Line::Open）のうち起こし手が席（By::Seat）・形が問う・結果が開いた・撃ち直しでない行で、時刻の頭 8 字が今の分の字の頭 8 字と同じ物の数。今の数は、起こし手が席で形が問うで結果が開いた行の窓（撃ち直しの行も）を重ねずに集め、渡した生きている窓の列に在る物の数（生きているかは後の行 cs-launch と cs-close が proc の印で判じて渡す）。admit（数・撃ち直しか）は、撃ち直しなら通し、今の数が LIVE_MAX 未満で今日の数が DAY_MAX 未満なら通し、ほかは REFUSAL で断る。開きを数えるのは結果が開いた行だけ（落ちた行は断りで開かなかった窓と起動の失敗の窓で、R-38 の 1 本に数えない）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 つ目の項は verify の 1 行目、2 つ目の項は 2 行目、3 つ目から 7 つ目の項は 3 行目（cwquo_ の 5 本）、最後の項は 4 行目。歯 cwquo_values_match_rule_r38 は rules の file の id: R-38, の行を 1 つ探して value の字を比べる（前例 bvland.rs の R-36 の照らし）。

      構造の連鎖。quota.rs は行 cs-types が骨で置き、中身はこの行だけが書く。使うのは契約の consult の Form・SeatQuota・WindowId と、行 cs-lines の By と Line。歯は行の字を組んで lines::scan で読む。quota の名を呼ぶ所は今の木に無い（後の行 cs-launch と cs-close と cs-server が呼ぶ）。

      試作と噛み。試作の木で中核の crate の clippy（--all-targets --no-deps・-D warnings）が rc 0、歯 cwquo_ の 5 本が通る。xtask の check は積み直した最後の木 60d2c916 で rc 0（workspace の歯 3,057 本）。噛みは変異 5 つ（話す窓も数える・日の境を月にする・生きていない窓も数える・同時 1 本を通す・1 日の上限を 4 にする）で、5 本の歯のどれも少なくとも 1 つで落ちる（どの変異も rc 100・対照は全部通る）。

      流す時と順。depends は cs-lines（Line と By）。行 cs-lines の着地の後の波。

      範囲の外。数えを撃って断る口と標準エラーの 1 行と開きの行の結果（行 cs-launch）。一覧と board の今日の数と今の数（行 cs-close と cs-server）。

