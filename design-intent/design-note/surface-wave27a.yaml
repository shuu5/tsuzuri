  - n: 10
    type: prose
    title: 行 r-nextest-timeout — 歯の時間切れ（止まった歯を止まったと報せる）
    body: |
      在りか。差の file docs/design/patch/r-nextest-timeout.patch は main f3730538 の上の試作（係 w86a の写し・branch w86a-proto の commit d3564cc5・行 r-dbg の試作の commit 2cf411a6 の上）から切った。書く file は新しい .config/nextest.toml と xtask/tests/ntmo.rs の 2 つで、差はこの 2 つに閉じ、main f3730538 の木にもそのまま当たる（git apply --check が rc 0）。

      なぜ。nextest の設定の file が無く、歯の時間切れが無い。便 t3-hub.74.31 の着地の前の xtask の check で、歯 face_note_escapes_values_from_the_source が図の描き手（node の renderer）の待ちで 30 分止まった。今の歯の最長は host の load によって 26〜62 秒（boundary の歯 site と badge）なので、300 秒（約 5 倍）で止めても性能を削らない。判断の記録 ADR-31 の決定 (2)。

      形。.config/nextest.toml は注 2 行と、見出し profile.default と、slow-timeout の 1 行（inline の表で period は 60s・terminate-after は 5）だけ。並びの数・再試行・落ちた時の止め方は nextest の既定のまま。nextest は 60 秒を越えた歯を SLOW と報せ、5 回目（300 秒）で歯の process group を止めて TIMEOUT の落ちにする（子の node も止まる）。歯の file xtask/tests/ntmo.rs は、頭の //! の 2 行のすぐ次の行に #![cfg(test)] を置き、repo の根（xtask の manifest の dir の 1 つ上）からの相対で設定を読み、注と空の行を除いた行を字のまま断言する歯 ntmo_slow_timeout_is_sixty_seconds_five_times を 1 本持つ。接頭辞 ntmo_ は main f3730538 の契約表の verify の filter の語（409 語）のどれとも部分の字として重ならない。字の正本は差の file。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done (1) は verify の 1 行目、(2) は 2 行目、(3) と (4) は 3 行目（歯 ntmo_slow_timeout_is_sixty_seconds_five_times）、(5) は 4 行目で測る。

      構造の連鎖。nextest は repo の根の .config/nextest.toml を自分で読むので、歯の全部の撃ち（xtask の check の nextest の段・CI の 8 つの job）に効く。xtask の check の段の並びと CI の partition の字は替えない。

      試作と噛み。試作の木で verify の 4 行が全部 rc 0（xtask の check は pub-scan と size と lint の歯を含めて緑・歯 3,027 本）。その check で歯 f163_note_approval_list_builds_one_sign_per_item が 60 秒を越えて SLOW と報され、61.7 秒で緑のまま通った（報せるだけで止めない形の実の確かめ）。噛みは 4 つの変異で撃ち、どれも歯が落ちた（rc 100）: period を 120s に替える・terminate-after を 4 に替える・行 retries = 0 を足す・file を退かせる。

      範囲の外。歯ごとの時間切れの上書き（overrides）・再試行（retries）・並びの数（test-threads）・CI の別の profile。歯の束ね（係 w87a の行）。

  - n: 11
    type: prose
    title: 行 t-fold-xtask — xtask の歯を群へ畳み、群の照らしの歯を足す
    body: |
      在りか。差の file docs/design/patch/t-fold-xtask.patch は、main e16524a9（行 r-dbg と r-nextest-timeout の着地の後で、行 v-gate の commit を含む・v-gate の着地の前）の上で、席の道具 seq.sh（fold2.py と fixups.py・群の上限 10,000 行）を撃った commit bb486178 から切った（15,290 byte・git diff -M）。差の file の数は、移すだけで中身を 1 字も替えない file 3・移して path の字か手直しを持つ file 5・足す file 2・移さずに字を書き替える file 0。席は置く直前の main の写しで seq.sh を撃って差を切り直す。

      なぜ。判断の記録 ADR-32（段の束ね）。tests/ の 1 file を 1 つの実行 file に組む形は、lib を 1 行替えるたびに歯の実行 file の全部を link し直し SSD を書く。着地した歯を crate ごとの群（1 万行まで・main.rs は module の行だけ）にまとめ、新しい行の歯は今までどおり tests/ の直下の 1 本（段）で足す。

      形。この行の群は xtask/tests/teeth1。群は tests/<群>/main.rs（頭の //! の 2 行の直後に #![cfg(test)]・空の行・mod の行を名の順）と tests/<群>/<元の stem>.rs。module の file の中身は、移した file を名指す path の字の書き換え（fold2.py が workspace の歯の全部で当てる）と下の手直しのほか替えない。歯の名は nextest で <stem>::<fn> になる。xtask の歯 kfold_ の表 GROUPS は fold2.py が木の群と module の数で書き直す。手直し: xtask の群 teeth1 の main.rs は module の行 kfold を klint の前に足す。retire.rs の歯 f2ret_folio_tests_named_once は、folio の tests/ の直下の .rs（段）と main.rs を持つ dir（群）の両方を歯の単位として数え、2 つの manifest の test の項の path を単位の根（段は tests/<名>.rs・群は tests/<名>/main.rs）と照らす形に書き直す（今の木に folio の群は無いので、段だけで今までどおり緑・群は行 t-fold-folio が作る）。use の行は std::path の Path と PathBuf の 2 つにする。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 項目目は verify の 1 行目、kfold_ の項目は verify の 2 行目、群の歯の項目は群ごとの nextest の行（filter なし）、書き直した置き場の歯の項目はその filter の行、最後の項目は verify の 5 行目（xtask の check）。

      構造の連鎖。移す file を名指す path の字はほかの crate の歯にも在り、差はその file も書く（write-set の ~ と + の対のほかの項目）。群の main.rs は畳みの行だけが書く。まだ着地していない行（ノート surface-wave27a の cs-types・cs-finding・cs-lines・cs-argv・cs-quota と、着地の印を持たない古い行）の write-set と verify が名指す歯の file は、どれも今の木に無い新しい file で、この差は動かさない（係 w89a の照らし）。

      試作と噛み。試作の木（commit bb486178）で、差の当たり（前の commit の木で git apply --check・行の木で --reverse --check）が rc 0、verify の行のうち xtask の check を除く 3 行が全部 rc 0（群 teeth1 の歯 33 本・kfold_ 1 本・f2ret_folio_ 2 本）。 6 行を全部当てた木（commit 5cad5dad）で cargo run -q -p xtask -- check を 1 回撃って rc 0（224 秒・歯 3,036 本が全部緑・workspace の clippy と面の wasm の clippy が緑・size は file-lines 1348/1500・入れ子の段は字 nested workspaces=0）。途中の木では xtask の check を撃っていない。歯の fn の名は main e16524a9 と同じ（契約 43・core 324・境界 587・面 847・folio 946・xtask は kfold_ の 2 本が増えて 34・契約の 16 か所の名替えのほか消えた名も増えた名も無い）。噛みの後に書き戻した木の対照の撃ちは全部緑。 噛みは変異 3（どれも rc 100）: 群 teeth1 の main.rs から行 mod ntmo; を消す・表 GROUPS の xtask の群の module の数を 9 から 8 へ（この 2 つで kfold_groups_declare_every_module_once が落ちる）・f2ret の歯の単位から群（main.rs を持つ dir）を外す（f2ret_folio_tests_named_once が落ちる）。

      範囲の外。新しい行の歯の置き方（段）と畳みの行の置き方は起草の守りと席の手が持つ。klintf と klint の根の重複の退役・自分の名の照らしの寄せは別の行。着地した行の verify の字（--test の旧い名）と差の file は歴史として残し書き換えない（判断の記録 ADR-32 の決定 (9)）。

