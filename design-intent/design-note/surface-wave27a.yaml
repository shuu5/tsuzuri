    title: 行 cs-launch — 窓を起こす口
    body: |
      在りか。差の file docs/design/patch/cs-launch.patch は、行 cs-open の試作 c57c60ff の木に試作の commit 3f9aa735（写し drafts/w85a）を載せて切った（2 file・34,710 byte・+883 −7・第 0.11 版で歯の file を、第 0.15 版で歯の file と srcを直し、main 145db064 に着地していない前の行の差を 11 行の順に当てた木の上で切り直した）。行 cs-open が骨で置いた境界の src/consult/launch.rs を中身に替え、歯の file を足す。

      なぜ。判断の記録 ADR-29 決定 (3) は 2 つの形（話す窓は席の tmux の session に持ち主の見ている窓を替えずに開く・問う窓は席の背景の命令として非対話の claude -p）が同じ起動の口を通ると決め、決定 (5) は席の環境を継ぎ tmux の窓には -e の閉じた列（口座の置き場・PATH・窓の id・私用の temp）だけを渡すと決め、決定 (6)(7) は器と tsuzuri の plugin を渡さず制限の形と囲いの設定で起こし、起動の口の argv と設定を歯で測ると決めた。決定 (10) と規則の行 R-38 は席が自分で開く問う窓を同時 1 本・1 日 3 本までとし、起動の口が断ると決めた。受入 AC19 は起動の口の argv と設定を fixture と比べ、囲いの実の効きは着地の後に席の手で確かめる。

      形（要約・字は差の file）。(a) 順は、位置の引数 1 つ（窓の id）と値を取らない --again と --dry-run を読み、版を照らし（rc 1）、置き場と窓の控えを読み、材料 material（作業場・repo・state dir は canonicalize した絶対 path・読む根は在る dir だけ・uid は作業場の持ち主・tz は tz 自身の path・束に question.md が在るか）で中核の argv と audit を撃つ。--dry-run は program の名 claude と argv を 1 行ずつ出して終わる（欠けが在れば rc 1・台帳も読まない）。(b) 台帳を読み、閉じの行の在る窓は断る（rc 1・行なし）。起こし手が席で形が問うなら、生きている窓（退いていない窓のうち最後の process の印が在る窓）を渡して中核の quota の count と admit を撃ち、断りは REFUSAL の字で rc 1（行なし）。(c) start は、audit の欠け・私用の temp（無ければ mode 0700 で作り、在れば symlink でない持ち主の uid の 0700 の dir でなければ断る）・起こしの順に撃ち、どれかが落ちたら開きの行を結果 落ちた で書いて rc 1。起こせたら process の印（k は最後の印 + 1）を書き、開きの行を結果 開いた で書く。開きの行は根（題を渡さない home_of）に置き、題が器の引用の形を含めば題なしにする。起こし手の添えは控えの発話（チャット）と頼み（button）。(d) 話す窓は環境の TMUX_PANE で session の名を tmux display-message に問い、new-window -d -t <session>: -n consult-cw<n> -c <作業場> と TALK_ENV の順の -e（中核の env の 2 つと席の環境の CLAUDE_CONFIG_DIR と PATH・席の環境に無い名は渡さない）と -P -F WINDOW_FORMAT と -- claude と argv を撃ち、出力の window id と pane の pid を印に置く。標準出力は 窓 cw<n> を開いた（tmux の窓 consult-cw<n>）。(e) 問う窓は claude を cwd 作業場・標準出力 .consult/ask-<k>.json・標準エラー .consult/ask-<k>.err・process group を分けて起こし、ASK_DROP を外し中核の env の 2 つを置く。印の pid は子の pid。子の終わりを ASK_LIMIT（6600 秒）まで待ち、越えたら group ごと止める。起こす前に無かった所見ごとに中核の notice の経路 完了 の 1 行を、無ければ止まった窓の 1 行を出す（命令の頭は tzw）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 つ目から 6 つ目の項は verify の 3 行目（cwlch_ の 6 本）、最後の項は 4 行目（xtask の check・歯の全部を撃つ）。done の項は歯が測る物だけにした。verify の 1 行目（git apply --reverse --check）は差の file の hunk が全部木に在ることを、2 行目（cargo clippy -p tsuzuri-boundary --all-targets --no-deps -- -D warnings）は clippy の落ちが無いことを、命令の rc で測る守りで、done の項にしない。

      構造の連鎖。launch.rs は行 cs-open が骨で置き、中身はこの行だけが書く。使うのは中核の launch（ASK_DROP・Launch・PROGRAM・TALK_ENV・VERSION_ENV・argv・audit・env・private_tmp・read_roots・version_ok）と lines（By・Event・Line・WORD_MAX・cited・free・notice）と quota（admit・count）、境界の server の ledger（KILL・capture・stop_with）と行 cs-open の consult の共通の手（どれも今の pub の名・替えない）。material と TMUX と WINDOW_FORMAT と ASK_LIMIT は pub（行 cs-close が TMUX を使う）。

      本物の tmux と claude を撃たない歯。偽の tmux（受けた argv を記録し、display-message に session の名 seat-s を、new-window に @7 と 4242 を答える）と偽の claude（argv と環境と pid を記録し、印の file が在れば findings/cw1-1.json を置く）を PATH の頭に置いて撃つ。tz に渡す環境の TMUX と TMUX_PANE は偽の字で、動いている tmux の server に触れない。囲いの実の効き（作業場の外と repo へ書けない）は撃たない（着地の後に席の手で問う窓と話す窓の両方で確かめる）。

      試作と噛み。main 5c8fe2b4（行 cs-types が着地）に行 cs-finding から cs-launch までの差を契約表の順に当てた木 7a9a0f96（写し drafts/w93a）で境界の crate の clippy（--all-targets --no-deps・-D warnings）が rc 0、歯 cwlch_ の 6 本が通る。xtask の check は 11 行の差を全部当てた最後の木 8214cef7 で 1 回だけ撃って rc 0（workspace の歯 3,104 本・size は file-lines 1348/1500・core-lines 8367/20000・test-src-ratio 7069/82463・今の main 61c2a443 に着地していない行の差を順に当てた木の crates と tests と xtask の字は 8214cef7 と同じ）で、行ごとの木では撃っていない。第 0.11 版の直し（否定の見本が測りたい句より前の別の理由で断られる空振りを除く・係 w93a）は、--dry-run を撃つ前に台帳の写しを消す見本にした（前は --dry-run が台帳を読んでも通った）。その噛みは変異 1（--dry-run でも台帳を読む）で、どれも直した歯で落ち（rc 100・対照は全部通る）、前の歯では通った（空振り）。次の噛みは直す前の差で、係 w85a の写しの木 3f9aa735 で撃った。噛みは変異 6 つ（話す窓の -d を落とす・問う窓に TMUX を残す・検めの欠けでも起こす・R-38 を数えない・--dry-run でも起こす・temp の mode を緩く見る）で、6 本の歯のどれも少なくとも 1 つで落ちる（どの変異も rc 100・対照は全部通る）。

      句の型の照らし（第 0.15 版・便 t3-hub.75.5 の 2 度目の審査の vacuous-assert に答える・係 w93a）。done の句を型（順・1 度だけと重ねない・縁と既定と空・だけ）に分け、句を崩す変異（順を替える・重ねる・縁を 1 ずらす・既定に倒す・だけの絞りを外す）を 18 撃ち、直した歯で 18 が名指しの歯で落ちた（rc 100・対照は全部通る）。前の歯では落ちない見立て（src と歯を読んだ見立て・前の歯では撃っていない）の変異が 3 で、その句の見本を足して直した（閉じの行の在るほかの窓・数えるのは席の問う窓だけ・process の印の死んだ窓を数えない）。歯の fn の数と名は替えない。src は launch.rs も直した（問う窓の前の所見を子を起こす前に数える・子が速く所見を置く時の競りを除く）。xtask の check は main 145db064 に着地していない行の差を 11 行の順に当てた木 2b4b6fe6 で rc 0（workspace の歯 3,121 本・size は file-lines 1348/1500・core-lines 8367/20000・test-src-ratio 7069/82743）。

      流す時と順。depends は cs-open（共通の手と骨）と cs-quota（admit と count）。同じ波の行 cs-answer・cs-watch・cs-show と書く file が重ならない。depends の確かめ（係 w93a・第 0.9 版の差・歯の file を直す前）は、main 19407588 に depends を辿った行 cs-types・cs-lines・cs-argv・cs-quota・cs-open の差とこの行の差だけを当てた木 ef2eefeb で、境界の crate の clippy と歯 cwlch_ の 6 本が通る。

      範囲の外。plugin の tzw が TZ_PLUGIN_VERSION と TZ_WRAPPER を置くこと（行 cs-plugin）。窓を閉じる口と私用の temp を消すこと（行 cs-close）。見張りの止まった窓と閉じられた話す窓の拾い（行 cs-watch）。
  - n: 19
    type: prose
    title: 行 cs-answer — 所見の口と窓の守り
    body: |
      在りか。差の file docs/design/patch/cs-answer.patch は、行 cs-open の試作 c57c60ff の木に行 cs-launch の試作を載せた木に試作の commit a8dc2dcc（写し drafts/w85a・書く file は cs-launch と重ならず cs-open の木でも当たる）を載せて切った（5 file・23,729 byte・+505 −14・第 0.11 版で歯の file を、第 0.15 版で歯の fileを直し、main 145db064 に着地していない前の行の差を 11 行の順に当てた木の上で切り直した）。行 cs-open が骨で置いた境界の answer.rs と guard.rs を中身に替え、中核に consult の子の module guard を足す（中核の consult/mod.rs に pub mod の 1 行と頭の注の 1 行）。

      なぜ。判断の記録 ADR-29 決定 (8) は所見の口が欄を検め（ADR-10 決定 (3)）、所見の file を作業場の決まった dir に書き、添え物が作業場の下に在ることを確かめると決め、決定 (4) は相談の窓が台帳を書かないと決めた。決定 (7) は守りの hook を道具の名の閉じた列と所見の口の検めに減らし、落ちても断る形で撃つと決めた。受入 AC16 は欄を 1 つ欠いた所見（fixture finding-2 の missing.json）の断りと、揃った所見の file を見る。

      形（要約・字は差の file）。(a) answer は位置の引数 1 つ（草稿の file・cwd からの path）を受け、窓の id を環境の TZ_CONSULT_ID から読み（無いか形でなければ rc 1）、cwd の窓の控えの id が同じでなければ断る。草稿を中核の finding の check で検め、断りは Refusal の字（Display）を標準出力に 1 行出して rc 1。添え物は作業場の path に足して canonicalize し、canonicalize した作業場の下の file でなければ 添え物が作業場の下の file でない と path を出して rc 1。所見は Finding::new（id・今の分）を JSON にして findings/ の一時の名に書き、所見の名へ hard link（既に在る名は上書きしない・在れば番号を進める）してから一時の名を消す。番号 k は findings の窓の所見の最大 + 1。標準出力は 所見 <id> を置いた。台帳は書かない。(b) 中核の guard の judge（hook の入力の字）は、JSON の object でない・道具の名が字でない入力を断り、道具の名が launch の TOOLS の 8 つに無ければ断り、Bash なら tool_input の dangerouslyDisableSandbox が真なら断り、命令を gate の segments で一続きの語に分け、語の中の空白でも切った語の並びに 字 consult と SEAT_VERBS の口の並びが在れば 窓から tz consult <口> は撃てない（所見は answer・束は bundle）で断る。answer と bundle は通す。(c) 境界の guard は引数を取らず（在れば断る）、標準入力の全部を judge に渡し、通すなら何も出さずに rc 0、断るなら標準エラーに 相談の窓の守り と理由の 1 行を書いて DENY（rc 2・Claude Code の PreToolUse の断り）。file を書かない。起動の設定の命令 timeout 4 <tz> consult guard || exit 2 で、落ちても時間切れでも断る側に倒れる。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 つ目から 6 つ目の項は verify の 3 行目（cwans_ の 6 本）、最後の項は 4 行目（xtask の check・歯の全部を撃つ）。done の項は歯が測る物だけにした。verify の 1 行目（git apply --reverse --check）は差の file の hunk が全部木に在ることを、2 行目（cargo clippy -p tsuzuri-core -p tsuzuri-boundary --all-targets --no-deps -- -D warnings）は clippy の落ちが無いことを、命令の rc で測る守りで、done の項にしない。

      構造の連鎖。answer.rs と guard.rs は行 cs-open が骨で置き、中身はこの行だけが書く。中核の consult/mod.rs は行 cs-types が置いた 4 つの pub mod の並びに guard の 1 行を足し、頭の注の launch の 1 行に guard の在りかを足す（ほかの字は替えない）。使うのは中核の finding の check、launch の ID_ENV と TOOLS、gate の segments（今の pub の名・替えない）、契約の Finding・FindingDraft・FindingId・WindowId と wire、行 cs-open の共通の手。

