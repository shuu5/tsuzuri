      流す時と順。depends は空。書く file は xtask/src/main.rs と新しい nested.rs だけで、同じノートの行 cs-types・cs-finding・cs-lines・cs-argv・cs-quota と重ならない。器を持ち込む merge（席が書き持ち主が撃つ script）の前に着地させる（merge の木の xtask の check が器の歯を撃つため）。merge の木では器の歯 4 本（git の根の宣言を器の宣言と読む歯・2 本は requirements の path を入れ子から読めない歯）が落ちるので、器の側の直しが器の main に入るまで merge の木の xtask の check は落ちる。その間は merge を撃たない。

      範囲の外。CI の job の割りと時間（入れ子の歯の分で job ごとに延びる・規則の行 R-5 の CI 5 分は検出線・job の数か入れ子の job の分けは後の行で決める）。入れ子の insta と cargo deny（後の行 v-ci）。器の xtask の check の 4 つの門（paths-clean・private-clean・non-rust-exec・prose-gate）が入れ子で n/a(not-a-repo-root) になる穴と、器の PR だけの門と main-provenance（器の席への問いと後の行）。根の workspace に入れる形（器の xtask の名替えと member の読み・後の行）。.vessel.toml の crate-roots（後の行）。
  - n: 9
    type: prose
    title: 行 r-dbg — 開発の組みの debuginfo を行の表だけにする
    body: |
      在りか。差の file docs/design/patch/r-dbg.patch は main f3730538 の上の試作（係 w86a の写し・branch w86a-proto の commit 2cf411a6）から切った。書く file は根の Cargo.toml と crates/tsuzuri-surface/tests/wstrip.rs の 2 つで、差はこの 2 つに閉じる。

      なぜ。歯の実行 file は tests/ の 1 file ごとに lib と依存と std の debuginfo を丸ごと入れて作られ、dev の既定の full の debuginfo が大半を占める。main f3730538 の歯の全部の組み（cargo nextest run --workspace --no-run）は 23.6 GB で、core の lib に注を 1 行足すと 20.6 GB を書き直した（係 w86a の測り）。行の表だけにすると、0 からの組みは 10.6 GB・lib 1 行は 8.9 GB・組みの CPU は 3 割減る。panic と歯の落ちの file と行、RUST_BACKTRACE の各段の file と行は残り、抜けるのは debugger の変数と型だけ（tsuzuri と器と hook と skill に debugger を使う所は 0）。器 scribe2 は同じ値をもう使っている。判断の記録 ADR-31 の決定 (1)。

      形。根の Cargo.toml の末（段 profile.dev.package.folio の後）に空の行と注 2 行と段 profile.dev を足し、中身は debug の 1 行（値は line-tables-only）だけ。test の profile は dev を継ぐので歯の組みにも効く。段 profile.dev.package.folio（opt-level 2）と段 profile.release（strip）は替えない。歯 wstrip_release_profile_keys は、見出しの一覧の期待に profile.dev を足し、関数の末に段 profile.dev の中身が 1 行だけであることの断言（注 1 行と assert_eq の 1 行）を足す。字の正本は差の file。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done (1) は verify の 1 行目、(2) は 2 行目、(3) と (4) は 3 行目（歯 wstrip_release_profile_keys）、(5) は 4 行目で測る。

