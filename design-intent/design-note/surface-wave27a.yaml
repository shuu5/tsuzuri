    title: 行 cs-show — 読む口と処分
    body: |
      在りか。差の file docs/design/patch/cs-show.patch は、行 cs-open の試作 c57c60ff の木に行 cs-launch・cs-answer・cs-watch の試作を載せた木に試作の commit 4eae5b24（写し drafts/w85a・書く file は重ならず cs-open の木でも当たる）を載せて切った（3 file・34,519 byte・+819 −14・第 0.15 版で歯の file だけを直し、main 145db064 に着地していない前の行の差を 11 行の順に当てた木の上で切り直した）。行 cs-open が骨で置いた境界の show.rs と dispose.rs を中身に替え、歯の file を足す。

      なぜ。判断の記録 ADR-29 決定 (8) は、席が所見を読む口で読み、読んだ口が経路の語つきの相談の所見と相談の受けの行を台帳に置くと決めた。決定 (9) と ADR-10 決定 (5) は、処分を所見ごとに採る・一部採る・採らない と理由に、添え物ごとの保存する・しないを足して宣言し、保存すると決めた添え物は席が repo の決まった置き場へ写して commit すると決めた。決定 (5) は所見が全部処分された後に作業場を退きの置き場へ移す（消さない）と決めた。決定 (4) は所見から先の行を話題の bead から上へたどった memo か根に置くと決めた。受入 AC16 は台帳の 2 行が 1 度だけ置かれることを見る。

      形（要約・字は差の file）。(a) show は位置の引数 1 つ（所見の id か頼みの id）と --via（見張り・完了・hook・一覧）を受ける。所見は作業場か退いた作業場の findings/<所見 id>.json を契約の Finding に読み、台帳に同じ id の相談の所見の行が無ければ行（題と所見の時刻）を、相談の受けの行が無ければ行（経路と今の分）を、所見の題の置き場（home_of）に足す。題は字 なし と空と器の引用の形を含む字なら題なし。出力は render の行の列（所見の頭の行・結論・推奨・候補・主張・根拠・持ち主に問う・触る節点・束の要約値・囲いの断り・添え物の種類と作業場の絶対 path と注）。頼みは台帳の頼みの行の題・形・model・時刻の行と、開く命令（tzw consult open --request <id> --by button）の行を出し、台帳を書かない（受けの行は open --request が書く）。(b) dispose は位置の引数 1 つ（所見の id）と --verdict（採る・一部採る・採らない）と --reason と何度でも受ける --keep と --drop と --into（写し先の木の根・省けば repo）を受ける。順は、添え物の選び（添え物の全部がちょうど 1 度ずつ keep か drop・所見に無い path を断る）、台帳を読み受けの行の無い所見と処分の行の在る所見を断り、処分の行の字を render で確かめ（整えて空の理由・区切りの字を持つ path を断る）、写し先 kept_path が 1 つでも在ればどれも写さずに断り、保存の添え物を写し、処分の行を所見の題の置き場に足す。標準出力は 処分を記した と写した path（木の根からの相対）の列。(c) retire は、作業場が在り、窓に閉じの行が在り、作業場の所見の全部に処分の行が在れば、作業場を retired-consult-cw<n> へ rename する（在れば断る・消さない）。dispose は自分の処分の行を足した行の列で retire を撃ち、退かせれば 退いた と path の行を足す（行 cs-close の close も同じ retire を撃つ）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 つ目から 5 つ目の項は verify の 3 行目（cwshw_ の 5 本）、最後の項は 4 行目（xtask の check・歯の全部を撃つ）。done の項は歯が測る物だけにした。verify の 1 行目（git apply --reverse --check）は差の file の hunk が全部木に在ることを、2 行目（cargo clippy -p tsuzuri-boundary --all-targets --no-deps -- -D warnings）は clippy の落ちが無いことを、命令の rc で測る守りで、done の項にしない。

      構造の連鎖。show.rs と dispose.rs は行 cs-open が骨で置き、中身はこの行だけが書く。使うのは中核の lines（Line・Subject・WORD_MAX・cited・free・render）、契約の consult（Finding・FindingId・RequestId・Verdict・Via・WindowId・Word・kept_path）と wire、行 cs-open の共通の手。show の finding_path・read_finding・topic_of・render と dispose の retire は pub（行 cs-close と後の server の行が使う）。

      試作と噛み。今の main 19407588 に行 cs-types から cs-show までの差を契約表の順に当てた木 172a1594（写し drafts/w93a）で境界の crate の clippy（--all-targets --no-deps・-D warnings）が rc 0、歯 cwshw_ の 5 本が通る。xtask の check は 11 行（cs-types から cs-close）の差を全部当てた最後の木 a34e433d で 1 回だけ撃って rc 0（workspace の歯 3,104 本・size は file-lines 1348/1500・core-lines 8355/20000・test-src-ratio 7069/82451）で、行ごとの木では撃っていない。差の file を切った試作の commit は係 w85a の写しの 4eae5b24 で、次の噛みもその木で撃った（差の file は 1 字も替わらない）。噛みは変異 5 つ（受けの行を何度も書く・結論の字を替える・保存の写しを空にする・重なりを通す・処分の無い所見が在っても退かせる）で、5 本の歯のどれも少なくとも 1 つで落ちる（どの変異も rc 100・対照は全部通る）。歯は所見を fixture complete.json の草稿に id と時刻 20261003T1500Z を足した JSON で直に置き、偽の bdw が受けた行を台帳の写しに積み直して撃つ。

      句の型の照らし（第 0.15 版・便 t3-hub.75.5 の 2 度目の審査の vacuous-assert に答える・係 w93a）。done の句を型（順・1 度だけと重ねない・縁と既定と空・だけ）に分け、句を崩す変異（順を替える・重ねる・縁を 1 ずらす・既定に倒す・だけの絞りを外す）を 35 撃ち、直した歯で 35 が名指しの歯で落ちた（rc 100・対照は全部通る）。前の歯では落ちない見立て（src と歯を読んだ見立て・前の歯では撃っていない）の変異が 5 で、その句の見本を足して直した（ほかの所見の行だけの台帳での最初の show・処分の時刻を撃つ前と後の分で挟む・ほかの所見の受けの行だけの台帳での断り・在る file の --into・3 つの所見の最後を処分した時の退かせ）。歯の fn の数と名は替えない。src は替えない。xtask の check は main 145db064 に着地していない行の差を 11 行の順に当てた木 2b4b6fe6 で rc 0（workspace の歯 3,121 本・size は file-lines 1348/1500・core-lines 8367/20000・test-src-ratio 7069/82743）。

      流す時と順。depends は cs-open（共通の手と骨）と cs-finding（歯が check と fixture を使う）。同じ波の行 cs-launch・cs-answer・cs-watch と書く file が重ならない。depends の確かめ（係 w93a）は、main 19407588 に depends を辿った行 cs-types・cs-finding・cs-lines・cs-argv・cs-open の差とこの行の差だけを当てた木 da2d2aea で、境界の crate の clippy と歯 cwshw_ の 5 本が通る。後の行 cs-close が retire を使う。

      範囲の外。保存した写しの commit（席の設計の commit・docs/consult/kept/ は design-doc-paths の docs/consult/ の下）。窓の閉じ（行 cs-close）。board の一覧の処分の無い所見（行 cs-close の list と後の server の行）。
  - n: 22
    type: prose
    title: 行 cs-close — 一覧と閉じと退かせ
    body: |
      在りか。差の file docs/design/patch/cs-close.patch は、行 cs-open から cs-show の試作を積んだ木に試作の commit 516c554c（写し drafts/w85a）を載せて切った（3 file・31,020 byte・+733 −14・第 0.11 版で歯の file を、第 0.15 版で歯の file と srcを直し、main 145db064 に着地していない前の行の差を 11 行の順に当てた木の上で切り直した）。行 cs-open が骨で置いた境界の list.rs と close.rs を中身に替え、歯の file を足す。

      なぜ。判断の記録 ADR-29 決定 (3) は窓を持ち主が閉じ、持ち主が閉じると言った時は席が起動の口で閉じると決め、決定 (5) は窓を閉じた後も作業場を残し、所見が全部処分された後に退きの置き場へ移す（消さない）と決め、一覧が所見の無いまま process の無い問う窓を止まったと出すと決めた。決定 (9) は処分の無い所見と席に届いていない頼みを tz consult の一覧に出すと決め、決定 (10) と規則の行 R-38 の数え（今日の数と今の数）を一覧に出す。決定 (8) は見張りが無い間の拾いの 1 つを一覧とした（席は show --via 一覧 で受ける）。

      形（要約・字は差の file）。(a) list は値を取らない --json と共通の旗だけを受け、台帳を読み（読めなければ rc 2）、board（作業場と台帳の行と今の分）を組む。窓ごと（退いた窓も）に、id・控えの形と題・状態（退いた作業場なら 退いた、閉じの行が在れば 閉じた、最後の process の印の pid が在れば 生きている、ほかは 止まった）・最後の結果 開いた の開きの行の時刻・所見の数・処分の行の無い所見の数。処分の無い所見ごとに題と届いた時刻（所見の時刻）と受けた時刻（受けの行）。受けの無い頼みごとに題と時刻。数は中核の quota の count（生きている窓を渡す）。時刻は分の字を epoch_of で epoch 秒にする（RFC 3339 の形に直して server の clock の epoch_secs で読む・形でない字は None）。--json は電文 ConsultBoard（4 つの段はどれも Known）、無ければ text の人の読む行。台帳を書かない。(b) close は位置の引数 1 つと --by（seat・chat・button）を受け、退いていない作業場の窓の控えが無ければ断り、閉じの行の在る窓を断る。最後の process の印に tmux の window id が在れば、tmux display-message で窓の名を問い、consult-cw<n> と同じ時だけ kill-window を撃つ（違えば標準エラーに 1 行で撃たない）。私用の temp（作業場の canonicalize した path の private_tmp）は symlink でない作業場の持ち主の uid の dir だけを消す。閉じの行（起こし手・作業場の所見の数・今の分）を根に足し、行 cs-show の retire を撃つ。標準出力は 窓 cw<n> を閉じた と、退かせた時は 退いた と path。問う窓の子は止めない。

      一覧の字の段（歯 cwcls_list_states_and_text の 7 行・今日の開きの行 2 本と生きている席の問う窓 1 つ）。
      窓 cw1・形 問う・題 fx-c.2・状態 生きている・所見 1・未処分 1
      窓 cw2・形 問う・題 題なし・状態 止まった・所見 0・未処分 0
      窓 cw3・形 話す・題 題なし・状態 閉じた・所見 1・未処分 0
      窓 cw4・形 話す・題 題なし・状態 退いた・所見 0・未処分 0
      窓 cw5・形 話す・題 題なし・状態 止まった・所見 0・未処分 0
      受けの無い頼み rq-20261003T1412Z-1・題 題なし
      席の問う窓: 今日 2・今 1（規則の行 R-38 の上限 同時 1・1 日 3）

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 つ目から 5 つ目の項は verify の 3 行目（cwcls_ の 5 本）、最後の項は 4 行目（xtask の check・歯の全部を撃つ）。done の項は歯が測る物だけにした。verify の 1 行目（git apply --reverse --check）は差の file の hunk が全部木に在ることを、2 行目（cargo clippy -p tsuzuri-boundary --all-targets --no-deps -- -D warnings）は clippy の落ちが無いことを、命令の rc で測る守りで、done の項にしない。

      構造の連鎖。list.rs と close.rs は行 cs-open が骨で置き、中身はこの行だけが書く。使うのは行 cs-launch の TMUX と行 cs-show の retire、中核の launch の private_tmp と quota（DAY_MAX・LIVE_MAX・count）と lines（Line・Subject・unreceived）、契約の consult の一覧の電文の型（ConsultBoard・FindingRow・RequestRow・SeatQuota・WindowRow・WindowState）と wire、境界の server の clock の epoch_secs と ledger の capture（今の pub の名・替えない）。list の board・text・epoch_of・state_of と close の kill_named・drop_tmp は pub（後の server の行 cs-server が board を使う見込み）。

      試作と噛み。main 5c8fe2b4（行 cs-types が着地）に行 cs-finding から cs-close までの差を契約表の順に当てた木 8214cef7（写し drafts/w93a）で境界の crate の clippy（--all-targets --no-deps・-D warnings）が rc 0、歯 cwcls_ の 5 本が通る。xtask の check は 11 行の差を全部当てた最後の木 8214cef7 で 1 回だけ撃って rc 0（workspace の歯 3,104 本・size は file-lines 1348/1500・core-lines 8367/20000・test-src-ratio 7069/82463・今の main 61c2a443 に着地していない行の差を順に当てた木の crates と tests と xtask の字は 8214cef7 と同じ）で、行ごとの木では撃っていない。第 0.11 版の直し（否定の見本が測りたい句より前の別の理由で断られる空振りを除く・係 w93a）は、閉じた窓の見本に tmux の窓を持つ話す窓 cw2 を足し（前の見本 cw1 は tmux の窓を持たず、閉じの検めを外しても tmux に届かなかった）、2 つの位置の引数の 2 つ目を在る窓にし、受けた頼みとその受けの行を一覧の見本に足した（一覧の字の段の 7 行は替わらない）。その噛みは変異 4（tmux の窓を持つ窓では閉じの検めを外す・位置の引数の最初を取る・最後を取る・受けた頼みも一覧に出す）で、どれも直した歯で落ち（rc 100・対照は全部通る）、前の歯では 4 のうち 3 つが通った（空振り・最初を取る変異は前の歯でも落ちた）。次の噛みは直す前の差で、係 w85a の写しの木 516c554c で撃った。噛みは変異 6 つ（生きている窓を止まったと見る・分の字の秒を替える・名を照らさずに kill-window・閉じの行を退かせの材料にしない・閉じた窓をまた閉じる・temp の symlink を辿る）で、5 本の歯のどれも少なくとも 1 つで落ちる（どの変異も rc 100・対照は全部通る）。歯は偽の tmux（受けた argv を記録し、窓の名を置き場の file の字で答える）を撃ち、本物の tmux を撃たない。

      句の型の照らし（第 0.15 版・便 t3-hub.75.5 の 2 度目の審査の vacuous-assert に答える・係 w93a）。done の句を型（順・1 度だけと重ねない・縁と既定と空・だけ）に分け、句を崩す変異（順を替える・重ねる・縁を 1 ずらす・既定に倒す・だけの絞りを外す）を 35 撃ち、直した歯で 35 が名指しの歯で落ちた（rc 100・対照は全部通る）。前の歯では落ちない見立て（src と歯を読んだ見立て・前の歯では撃っていない）の変異が 12 で、その句の見本を足して直した（窓の数の順（cw10）・閉じたと生きているの先後・退いたと閉じたの先後・最後の開いた行の時刻・同じ頼みの行の 2 度・最後の process の印の窓・中に file の在る私用の temp・閉じの行の時刻の縁・名の照らしの否定・処分した所見の数・ほかの窓の閉じの行・--by button の写像）。歯の fn の数と名は替えない。src は list.rs も直した（一覧の受けの無い頼みは同じ頼みの行が 2 度在っても 1 つ）。xtask の check は main 145db064 に着地していない行の差を 11 行の順に当てた木 2b4b6fe6 で rc 0（workspace の歯 3,121 本・size は file-lines 1348/1500・core-lines 8367/20000・test-src-ratio 7069/82743）。

      流す時と順。depends は cs-launch（TMUX）と cs-show（retire）。cs-open と cs-quota はその前に在る。depends の確かめ（係 w93a・第 0.9 版の差・歯の file を直す前）は、main 19407588 に depends を辿った行 cs-types・cs-finding・cs-lines・cs-argv・cs-quota・cs-open・cs-launch・cs-show の差とこの行の差だけを当てた木 0bbcd4d2 で（cs-answer と cs-watch を当てずに）、境界の crate の clippy と歯 cwcls_ の 5 本が通る。

      範囲の外。board の server の一覧の口（行 cs-server が board を使って組む）。窓の中の exit で閉じられた話す窓の拾い（行 cs-watch の 1 行で席が close --by chat を撃つ）。
  - n: 23
    type: prose
    title: 行 v-skip — 入れ子の段を省く形（判断の記録 ADR-34）
    body: |
      在りか。差の file docs/design/patch/v-skip.patch は main eb74bdf5 に試作の commit 46fe4fec（写し drafts/w94a・branch main）を載せて切った（4 file・23,957 byte・+538 −1）。xtask の src/nested.rs に子の module skip の宣言と fn run の判じの 5 行と doc の注を足し、新しい xtask/src/nested/skip.rs に判じ（入力の一覧・base・差・行）を、新しい xtask/tests/vskip.rs に歯 vskip_ の 11 本を置き、.github/workflows/ci.yml の job check の env に注 1 行と値の 1 行を足す。

      なぜ。判断の記録 ADR-34（持ち主の裁定 t3-hub.74.39）。器 scribe2 を持ち込んだ後、tsuzuri の検査の入れ子の段（行 v-gate）は、器に触れない便でも検査のたびに冷えた 4 段（予行で壁 207 秒・正味の書き込み 2.35 GB）を払う。着地した便の約 95% は入れ子の入力に触れない。入力に触れない便では段を省き、CI と host の日に 1 度の撃ちで全部を撃つ。持ち込み（T）の前に着地させる。

      形（要約・字は差の file）。(a) 判じは段が数えた dir ごと（dir の名を字で決め打たない）。(b) 入力は dir の下（dir の名と /）と定数 SHARED の 5 つ（rust-toolchain・rust-toolchain.toml・.cargo/・xtask/src/・xtask/Cargo.toml）。(c) base は git merge-base HEAD origin/main（定数 BASE_REF）。根で git rev-parse --show-toplevel を撃ち、その dir が根と同じ dir（canonicalize で比べる）でなければ全部を撃つ。merge-base が落ちれば全部、git rev-list --count base..HEAD の字が 0 なら全部。(d) 差は git -C 根 --literal-pathspecs diff --quiet --no-renames base -- 入力 の rc（0 は差なし・1 は差あり・ほかは全部を撃つ）と、git -C 根 --literal-pathspecs ls-files --others --exclude-standard -z -- 入力 の出力が空でないか。(e) 環境変数 TSUZURI_CHECK_NESTED_ALL（定数 FORCE_ENV）が在れば、git を読まずに全部を撃つ（値を問わない・省かせる向きの口は無い）。(f) fn run は数えた 1 行（今のまま）の後に、fn select で dir の列を全部を撃つ dir に絞って同じ名 dirs に置き直し、判じの行を dir ごとに 1 行ずつ出し、絞った列で今の段の列を組む。入れ子の dir が無ければ判じを呼ばない。(g) ci.yml の job check の env に、注の行と、TSUZURI_CHECK_NESTED_ALL を二重引用符で囲んだ 1 にする行を、TSUZURI_CHECK_PARTITION の行の次に足す。

      今の字（判じの行・字は skip.rs の fn line と fn decide）。省いた時は、字 xtask check と半角のコロンと空白に続けて、nested s2: 省いた（base 0123456789ab からの差が入れ子の入力に触れない） の形。全部を撃つ時は nested s2: 全部を撃つ（理由） の形で、理由は次の 6 つ。根が git の木でない。根が git の木の根でない。base を読めない（merge-base HEAD origin/main）。base と頭 12 字に続けて から HEAD までに自分の commit が無い。base と頭 12 字に続けて からの差が入れ子の入力に触れる。TSUZURI_CHECK_NESTED_ALL が在る。git を起動できない時と diff の rc が 0 と 1 でない時も、その理由の字で全部を撃つ。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 つ目から 11 つ目の項は verify の 3 行目（vskip_ の 11 本）、最後の項は 4 行目（xtask の check・歯の全部を撃つ）。done の項は歯が測る物だけにした。verify の 1 行目（git apply --reverse --check）は差の file の hunk が全部木に在ることを、2 行目（cargo clippy -p xtask --all-targets --no-deps -- -D warnings）は clippy の落ちが無いことを、命令の rc で測る守りで、done の項にしない。

      構造の連鎖（main eb74bdf5 で grep）。xtask に module の名 skip は無い。nested.rs を読む着地済みの歯は nested.rs の vnest_ の 7 本で、どれも替わらない。vnest_check_runs_last は main.rs を読み、この行は main.rs を替えない。vnest_run_zero_and_missing_cargo は git の木でない一時の dir で run を撃ち、判じは理由 根が git の木でない（CI では環境変数の理由）で全部を撃つので、cargo を起動できない時の rc 1 は替わらない。vnest_own_names_clean は nested.rs の test の fn を 7 つと数え、この行は nested.rs に歯を足さない。ci.yml を読む着地済みの歯は cishard_matrix_covers_every_partition（job check の行・shard の列・TSUZURI_CHECK_PARTITION の env の行と ci.yml の中の 1 度・run の行 1 つ）で、足す 2 行はこの字を替えない（注の行は TSUZURI_CHECK_PARTITION の字を持たない）。klint_print_hands は src の print の macro を数え、skip.rs は print の macro を書かない（行は nested.rs が crate::emit_err で出す）。klint_test_roots_cfg_test は tests の直下の .rs の頭の //! の続きの直後の行が #![cfg(test)] であることを見る。skip.rs は crate:: の名を使わない module で、歯の file は #[path] でそれを読む。歯の git は fixture の一時の repo に閉じ、家と system の git の設定を読まない（環境変数 GIT_CONFIG_GLOBAL と GIT_CONFIG_NOSYSTEM）。

      試作と噛み。試作の木で verify の 4 行が全部 rc 0。xtask の clippy（--all-targets --no-deps・-D warnings）が rc 0、歯 vskip_ の 11 本と vnest_ の 7 本が通る。xtask の check は rc 0（342 秒・入れ子の段は字 nested workspaces=0 の 1 行だけで判じの行は出ない・workspace の歯 3,061 本・size は file-lines 1348/1500・core-lines 7542/20000・test-src-ratio 7069/79615）。噛みは変異 11（一覧から xtask/src/ を抜く・差を足しと直しと改名の新しい側だけにする〔--diff-filter=AMR〕・未追跡を数えない・自分の commit 0 を見ない・環境変数を読まない・省く dir を残す・.gitignore の除きを外す・base を local の main にする・根が木の根かを見ない・判じの行を出さない・ci.yml の env の行を消す）で、どの変異も rc 100 で、11 本の歯のどれも少なくとも 1 つの変異で落ちる（対照の撃ちは全部通る）。噛ませる 4 つの場合（入力に触れた時・改名した時・未追跡の file・自分の commit 0）は、それぞれ変異 1・2・3・4 で落ちる。歯の名は main eb74bdf5 の契約表の verify の filter の語 420 と群の module の名 372 のどれとも部分の字で重ならない。

      流す時と順。depends は空。書く file は xtask/src/nested.rs（行 v-gate が置いた・着地済み）と新しい 2 file と .github/workflows/ci.yml（ほかに ci.yml を書く行 t-ci-shard・k-join-folio・k-deny は着地済み）で、同じノートの着地していない行と重ならない。器の持ち込み（T）の前に着地させる。今の main に入れ子の workspace は無いので、着地の時に検査の出す行と撃つ物は替わらない。

      範囲の外。日に 1 度の全部の撃ちの仕掛け（host の利用者の timer の定義と撃つ script・落ちた時の memo・後の行・ADR-34 決定 (6)）。CI の時間の手当て（ADR-34 決定 (9)・持ち込みの後に測ってから）。器の build.rs の組み直し（ADR-34 の帰結）。v-join の後の畳み（ADR-34 決定 (8)）。
  - n: 24
    type: prose
    title: 行 v-ci-split — 歯でない段を割りの役に振る（判断の記録 ADR-34 の決定 (9)）
    body: |
      在りか。差の file docs/design/patch/v-ci-split.patch は、main 61c2a443 に行 v-skip の差を当てた木 66c5e483 に試作の commit を載せた木 63e62551（写し drafts/w94a・branch w94b）との差で切った（4 file・18,130 byte・+361 −19）。新しい xtask/src/spread.rs に段の振り分けの表と判じを、新しい xtask/tests/vsplit.rs に歯 vsplit_ の 6 本を置き、xtask の src/main.rs と src/nested.rs の段の撃ちの前に判じを足す。

      なぜ。判断の記録 ADR-34 の決定 (9)。今は CI の検査の役の 8 つが、歯の 8 分の 1 のほかに、根の clippy 2 つと面の組み立てを同じ commit で 8 度ずつ撃つ。器の持ち込み（T）の後は入れ子の build と clippy と器の xtask の check も 8 度ずつ足され、最長の役が規則の行 R-5 の線（CI 5 分）を越える見込み。同じ commit の同じ段はどの役で撃っても同じ結果なので、歯でない段を役に 1 つずつ振り、歯だけを 8 つに分ける。決定 (10) で T の前に着地させる。

      形（要約・字は差の file）。(a) 段の鍵は頭の字（cargo か nested）と段の引数を空白でつないだ字で、--partition から後は除く（面の組み立ては字 surface-build）。(b) 表 TABLE は鍵と役の番号（0 はどの役でも撃つ・1〜8 は 8 つに割った時の役）。番号 0 は歯（根と入れ子の nextest）と根の build。歯でない 6 段は役に 1 つずつ。(c) 環境変数 TSUZURI_CHECK_PARTITION が count:k/N なら、番号 0 でない段は役 ((番号 − 1) を N で割った余り) + 1 だけが撃つ（N が 8 なら番号のまま・ほかの N でもどの段もちょうど 1 度）。ほかの役は字 xtask check と半角のコロンと空白に続けて 段 鍵 は割りの役 m/N が撃つ の 1 行を出して撃たない。(d) 割りの無い撃ち（手元・器の便の門）は全部の段を撃つ。(e) 表に無い鍵は割りの在る無しに依らず 1 行を出して check を rc 2 で止める（段を足す時は表にも足す・手元の撃ちでも落ちる）。(f) main.rs の fn check の cargo の段の中身を fn cargo_step に移し（行の字は判じの 5 行のほかは元のまま）、判じは fn turn（spread::turn の結果を撃つ・撃たない・rc 2 にする）。面の組み立ては match の中で撃つ。nested.rs は段の列の繰り返しの頭で同じ fn turn を呼ぶ。

      振り分けの釣り合い（V は CI の直近 3 回・I は見込み）。役ごとの job の秒の平均（V）は 1 が 184・2 が 205・3 が 216・4 が 217・5 が 183・6 が 199・7 が 163・8 が 206。今どの役も撃つ歯でない段は根の clippy 16 秒・wasm の clippy 7.5 秒・面の組み立て 約 42 秒（V・役 4 の log）で、和 約 65.5 秒。歯の秒の軽い役へ重い段を振った（面の組み立て → 7・入れ子の clippy → 5・入れ子の build → 1・入れ子の xtask の check → 6・根の clippy → 2・wasm の clippy → 8・歯の重い 3 と 4 には振らない）。T の前の見込み（I）は役の最長 約 156 秒（今 217〜231 秒）。T の後は入れ子の歯の組みと 8 分の 1 が全部の役に 約 60〜140 秒足され、振った入れ子の段（build 約 15〜40・clippy 約 20〜60・xtask の check 約 15〜30 秒）を足して、役の最長 約 220〜320 秒（I）。nextest の割りは歯の数と順で替わるので、釣り合いは表の番号を替える行で直す。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 つ目から 6 つ目の項は verify の 3 行目（vsplit_ の 6 本）、最後の項は 4 行目（xtask の check・歯の全部を撃つ）。done の項は歯が測る物だけにした。verify の 1 行目（git apply --reverse --check）は差の file の hunk が全部木に在ることを、2 行目（cargo clippy -p xtask --all-targets --no-deps -- -D warnings）は clippy の落ちが無いことを、命令の rc で測る守りで、done の項にしない。

      構造の連鎖（木 66c5e483 で grep）。xtask に module の名 spread は無い。main.rs を読む着地済みの歯は vnest_check_runs_last（fn check の cargo の段の繰り返し・surface_build(root)・nested::run の順と、面と入れ子の間の return rc; と、最後の式）、ksize_check_wiring と pubscan_wiring（走査 → 数え → cargo の段の繰り返しの順と return 1;）、cishard_matrix_covers_every_partition（const PARTITION_ENV の字）で、この行はどの字も替えない。nested.rs を読む着地済みの歯は vskip_run_wiring（fn run の判じの 5 つの字の順と行を出す for）で、この行は段の列の繰り返しの中に判じを足すだけで字を替えない。spread.rs は crate:: の名を使わない module で、歯の file は #[path] でそれを読む。fn check と fn cargo_step は clippy の関数の行の上限 60 の内。

      試作と噛み。木 63e62551 で verify の 3 行（差の当たり・clippy・歯 vsplit_ の 6 本）が rc 0。xtask の歯の全部（88 本）が通る。xtask の check は 3 行（v-skip・この行・v-daily）を当てた最後の木 d228f5b6 で 1 回撃って rc 0（139 秒・workspace の歯 3,076 本・入れ子の段は字 nested workspaces=0 の 1 行）。同じ木で割り count:7/8 を置いた撃ちは rc 0 で、歯は 8 分の 1（376 本）だけを撃ち、根の clippy と wasm の clippy は役 2/8 と 8/8 が撃つの 1 行ずつを出して撃たず、面の組み立ては撃った。噛みは変異 9（surface-build の番号を 3 に替える・番号 0 の判じを 1 にする・役の式をずらす・割りの無い時にほかの役と返す・表に無い鍵を 0 と読む・鍵に --partition を残す・面の組み立ての判じを外す・入れ子の判じを外す・表に無い段の rc を 0 にする）で、どの変異も rc 100 で、6 本の歯のどれも少なくとも 1 つの変異で落ちる（対照は全部通る）。噛みは歯の名を filter の語に重ならない名へ替える前に撃ち、名替えは歯の名の 2 つだけを替えた。歯の名は main 61c2a443 の契約表の verify の filter の語 421 と群の module の名 372 のどれとも部分の字で重ならない。

      流す時と順。depends は v-skip（nested.rs の同じ fn run を書き、差は v-skip の差の後の木で切った）。後の行 v-daily が main.rs を書くので、v-daily はこの行に depends を置く。決定 (10) で T の前に着地させる。

      範囲の外。CI の ci.yml（役の数と env は替えない）。入れ子の歯の組みを 1 つの役に寄せる形（nextest の archive）。T の後の役ごとの秒の測り（行 v-ci の確かめ）。
  - n: 25
    type: prose
    title: 行 v-daily — 日に 1 度の全部の撃ち（判断の記録 ADR-34 の決定 (6)）
    body: |
      在りか。差の file docs/design/patch/v-daily.patch は、main 26a2b9ad に main の行 v-ci-split の差を当てた木 14e64954 に試作の commit を載せた木 75d8bcc9（写し drafts/w94a・branch w94c）との差で切った（7 file・43,762 byte・+997 −3）。新しい xtask/src/daily.rs に日に 1 度の全部の撃ちの task daily を、新しい xtask/tests/vdaily.rs に歯 vdaily_ の 11 本を、新しい xtask/systemd/ の下に systemd --user の .service と .timer の雛形を置き、xtask の src/main.rs に module の宣言と task の腕と fn daily_task と usage の字を足し、直接依存の一覧（歯 skeleton_direct_deps_match_list が読む DIRECT_DEPS）の xtask に tsuzuri-contract を足す。xtask/Cargo.toml に tsuzuri-contract の path の依存を 1 行（と注 1 行）足し、Cargo.lock の xtask の依存の列に 1 行足す（外の部品は増えない）。

      なぜ。判断の記録 ADR-34 の決定 (6)。入れ子の入力に触れない便は入れ子の段を省くので、host の道具と設定のずれをこの host で見る所が日に 1 度の全部の撃ちになる。置き場は host の利用者の timer（席の決め）。撃つ仕掛けを repo の file と歯で持ち、散文だけの決まりにしない（条 N-2）。決定 (10) で T の前に着地させる。

      形（要約・字は差の file）。(a) timer は毎日（OnCalendar=daily・30 分の揺らぎ・止めていた日の分は次に起きた時に 1 度）.service を起こす。.service は cargo run -q --manifest-path で撃つ写しの xtask の task daily を撃つ（Type=oneshot・時間切れ 2 時間・PATH は %h の下と系の dir）。(b) host の値（撃つ写しの置き場・記録の file・出力の file・台帳の作業木・memo の親・組みの置き場 CARGO_TARGET_DIR・bdw が撃つ bd）は入れる時の drop-in の Environment に置き、雛形と code は替えない（条 N-2）。(c) task daily は撃つ写しの根（xtask の manifest の dir の親）で git fetch -q origin +refs/heads/main:refs/remotes/origin/main と git checkout -q --detach refs/remotes/origin/main を撃ち、nice -n 10 で cargo run -q -p xtask -- check を環境変数 TSUZURI_CHECK_NESTED_ALL=1 を置いて撃つ（出力は出力の file に書き直す）。check を撃つ binary は前の日の写しの xtask で、check そのものは今の origin の main の木で組み直される。(d) 記録の file に 1 撃ち 1 行（UTC の分の時刻・sha の頭 12 字・落ちた段か check・rc・秒・memo の id か - か failed）を足す。(e) 落ちた時、記録の最後の行が落ちで memo の id を持てば、台帳の作業木で bdw --readonly show <id> --json を撃ち（bd の READ の素通し・台帳を書かない）、その字を台帳の読みと同じ型（tsuzuri-contract の BdLine と wire）で読む。id の bead 1 本だけで status が open か in_progress で（in_progress は席が手を付けている memo で、そこに足す方が見落としにくく重ねて起こさない）、[再発] の行を足した後の notes（区切りの改行 1 byte を含む）が 8192 byte（定数 NOTES_MAX・器の rules 行 memo.notes_max_bytes の値）以下の時だけ、bdw update <id> --append-notes で [再発] の行を足す。閉じた（open と in_progress のほかの status）・台帳に無い（bd が rc 1）・読めない・満ちる時は足さずに、知らせを落とさない側へ倒して新しい memo を起こし、本文の出所の節に前の memo の id を書く。そうでなければ本文の file（出所・観測・候補・昇格条件の 4 節・引き金は 再発 2・path は file の名だけ）を書き、bdw create で memo を起こす（親は drop-in の値・type task・priority 3・label intake:memo・親の label を継がない・metadata の short・silent で id を受ける・題は memo と日付と sha）。bdw は台帳の作業木を cwd に撃つ（錠は bdw の flock）。(f) rc は check の rc（落ちた段の rc）。記録を書けなければ通りの撃ちも rc 1。

      memo の書き口（調べ・notes.md）。bdw は bd の書きを flock で直列にする薄い包みで、tsuzuri の LedgerWrite も同じ旗の形で撃つ。起票の門（hook）は Claude の道具の呼びにだけ掛かり、timer の process には掛からない。器の ADR-0112 は器が台帳に memo を起こす口を退けたが、この口は tsuzuri の判断の記録 ADR-34 の決定 (6) が置く tsuzuri の側の口である。続く落ちは同じ memo に足し、毎日 memo を増やさない。足し先が閉じた後や notes が満ちた後は、閉じた memo に書き足さず、新しい memo に前の memo の id を書いてつなぐ。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 つ目から 11 つ目の項は verify の 3 行目（vdaily_ の 11 本）、最後の項は 4 行目（xtask の check・歯の全部を撃つ）。done の項は歯が測る物だけにした。verify の 1 行目（git apply --reverse --check）は差の file の hunk が全部木に在ることを、2 行目（cargo clippy -p xtask --all-targets --no-deps -- -D warnings）は clippy の落ちが無いことを、命令の rc で測る守りで、done の項にしない。

      構造の連鎖（木 14e64954 で grep）。xtask の直接依存の一覧（main.rs の DIRECT_DEPS）は名を足す便が直す決まりで、この行は xtask の列に tsuzuri-contract を足す（tsuzuri-boundary が既に tsuzuri-contract に依るので、xtask が組む crate は Cargo.lock の閉包で前後とも 40 で増えない・外の部品の名は増えない・規則の行 R-25 は面の crate の上限で当たらない）。xtask/Cargo.toml は行 v-skip の入れ子の入力（SHARED）に在るので、この行の便の check は入れ子の段を全部撃つ（今の main に入れ子の workspace は無い）。xtask に module の名 daily と task daily は無い。main.rs を読む着地済みの歯（vnest_check_runs_last・ksize_check_wiring・pubscan_wiring・cishard_・行 v-ci-split の vsplit_check_wiring）は fn check と const の字を見るだけで、この行は fn main の腕と usage の字と新しい fn だけを足し、それらの字を替えない。klint_print_hands は src の print の macro を数え、daily.rs は print の macro を書かない（記録の行は main.rs の fn daily_task が emit_err で出す）。daily.rs は crate:: の名を使わない module で、歯の file は #[path] で読み、偽の cargo と偽の bdw を一時の dir の shell の script で置く。歯の git は家と system の git の設定を読まない。

      試作と噛み。木 75d8bcc9 で verify の 4 行が rc 0（xtask の check は行 v-ci-split-teeth の差も当てた木 a36dfc72 で 1 回・rc 0・150 秒・workspace の歯 3,078 本）。xtask の歯の全部（99 本）が通る。噛みは done の句ごとに、その句を見ない変異を 1 つずつ当てた（変異 43・句と歯の断言と変異と rc の表は起草の notes）。どの変異も rc 100 で、名指しの歯がその句の断言で落ちる（対照は全部通る）。否定の見本は正しい見本から句の 1 つだけを外した形にした（旗の欠け・2 度の旗・知らない引数・値の欠け・空の値はどれも 4 つの旗の全部の引数から 1 つだけを替え、open_memo の None の見本は id を返す見本から最後の行・rc・memo の字の 1 つだけを替え、appendable の偽の見本は真の見本から句の 1 つだけを替えた）。変異 2 本を 1 本目と読む（first-of-many）は初めの見本で通った。2 本の見本の字の末に閉じの角括弧が 1 つ多く、JSON でない理由で先に偽になっていた。見本を直して落ちるようにした。歯の名は main 26a2b9ad の契約表の verify の filter の語 423（この行の vdaily_ を除く）と群の module の名 372 のどれとも部分の字で重ならない。

      置き場と大きさの見込み（I）。撃つ写しは作業木の外の固定の dir（起草の置き場 drafts の下にしない・器の掃除が 6 時間で target を消す）。写しは 約 0.2〜0.5 GB（T の後は器の履歴が足される）、組みの置き場は根 約 4.4 GB と入れ子 約 2.1 GB の 約 6.5 GB を温かく保つ。日ごとの書きの正味は、根の温かい check と入れ子の組み直し（器の build.rs が HEAD の替わりで 2 crate を組み直す・約 1.44 GB）と歯の一時 file で 約 2〜4 GB（冷えた撃ちなら 約 7 GB）。

      流す時と順。depends は v-ci-split（main.rs を書き、差は main 26a2b9ad に v-ci-split の差を当てた木 14e64954 の上で切った）。行 v-ci-split-teeth とは書く file が重ならず、どちらの順で当てても同じ木になる。決定 (10) で T の前に着地させる。入れ方（drop-in と systemctl --user）は席の手で、行の外（notes.md）。

      範囲の外。入れる手（雛形を ~/.config/systemd/user/ へ写す・drop-in・enable）。記録の file を board に出す形。器に日に 1 度の口を足す形（ADR-34 の案 h）。
