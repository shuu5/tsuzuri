sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      project board の上端の帯の nav の link と題の link を左の button で押したとき、文書を読み直さずに頁を替える、面の crate の行 1 つ。
      今は押すたびに browser が文書を読み直し、js と wasm と stylesheet を取り直し、知らせの接続を張り直し、帯と頁の口を全部読み直す。
      直しは、link の href と同じ URL を履歴に積み、頁を signal にして頁の枠だけを組み直し、戻ると進むは popstate で URL から頁と mode を戻す。
      頁を替える時は、節点の頁の block が分ける読みを捨てて、次に組む block が今の URL で読み直す。href は残し、修飾の鍵つきの押しと今と同じ頁への押しは browser の既定のまま。
