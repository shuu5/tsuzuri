  - n: 3
    type: prose
    title: 行 h-thr-home — HOME の閾値の印と逼迫の強調と断りの理由と知らせの行を電文の写しから描く
    body: |
      在りかの main は b8beec2（計画 surface-plan 第 0.62 版）。面の crate tsuzuri-surface の src/account/home.rs（pub mod account の pub mod home・今の main で 1102 行）と、着地済みの歯 tests/accthome.rs。ノートの 2 行の前の行で、後の行 g-attach-acct（home.rs の私的な attach_some を消す）はこの行の着地の後に流す（ノートの depends）。
      なぜ。要件 FR12 は、使用量の閾値（窓ごとの cap）と逼迫の印と、移り先の候補が門で落ちた理由を、器の rules 行と event と doctor の値を写して出し、面も server も閾値を持たず判じないと言う（規則の行 R-22・持ち主の裁定 t3-hub.53.8）。行 c-acct-thr（着地済み）は電文 AccountDoc に欄 caps（WindowCap の Vec・窓の名と器の rules 行の id と cap の Reading）と欄 notices（GroupNotice の Vec の Reading・器の event GroupPressureNotified と GroupMoveRefused の欄の写し・at の新しい順）を足した。画面はまだ描かない（home.rs の module の doc の 6 行目の字「逼迫の印（見本の上限の字と強調の class）・候補ごとの門で落ちた理由は出さない（未決・R-22）」と着地済みの歯 accthome_no_pressure_marks が HOME に字 hot と cap と refused が無いと見る）。見本 mock v3（docs/design/mock3/account/index.html）の HOME は、口座 × 窓の棒に閾値の線（span の class cap・left は閾値の百分率）、群の枠の窓の段（見出し・窓ごとに使った割合と / 閾値・強調の class hot）、移動の段に逼迫の行（印 !・群・口座・窓・使った割合 ≥ 閾値・語 GroupPressureNotified）と断りの行（印 ×・群・口座・語 GroupMoveRefused と理由）を出す。見本は強調を使った割合と閾値の比べで決めるが、器の答え（計画の 3 節・2026-09-28）は、逼迫の印は event GroupPressureNotified の行そのもので、候補ごとの門の結果は器のどこにも無く断りの理由の語は no-candidate だけと言う。よってこの行は印を電文の notices の行から描き、比べの式を持たない。
      器の知らせの意味（器の repo の src/hook/group.rs の fn decide と src/pipe/dispatch/group.rs・c-acct-thr の節と同じ）。逼迫の知らせは群の今の口座が逼迫でない周に、群の測る口座（今の口座と群の置き場の席の口座）のうち閾値を越えた口座ごとに 1 行書かれ、欄 account は今の口座と違ってよい。移動の断りは今の口座が逼迫で移り先が無い周に 1 行書かれる。
      在りか・home.rs（write-set）。pub struct Pw（欄 window・short・used）・pub struct GroupView（欄 name・account・recorded・since・previous・pressure・members・candidates・next_account・next・limited・more）・fn usage_of・pub fn group_view（&GroupCard と口座の列の Option と &AccountDoc を受ける）・pub struct AcctRow・pub fn acct_row・pub struct MvRow（欄 at・group・from・to）・pub fn mv_card・pub struct Moves（欄 shown・folded・more）・pub const SHOW_MV（8）・pub fn mv_row・pub fn moves（MoveRow の slice と今を受け Moves）・pub struct Home（欄 next・groups・accounts・moves）・pub fn home・pub fn content。mod dom（wasm の target だけ）の fn group_card は窓の段を span の class pw で描き、fn meter（WindowRow の Option）は棒に閾値の線を置かず、fn mv_li は移動の記録だけを描く。字 remaining と c-occ は home.rs に無い。
      形（home.rs・model）。module の doc の 6 行目を、閾値の印と逼迫の強調と断りの理由と移動の段の知らせの行は電文の caps と notices から描き面は使った割合と閾値を比べない（便 h-thr-home・R-22）・候補ごとの門で落ちた理由は器が出さないので群の断りの理由の語だけを出す、の 2 行に替える。use に GroupNotice と WindowCap を足す。pub fn cap_of（caps の中で欄 window が窓の名に等しい最初の行の cap が Known ならその値・行が無いか Unknown なら None）・pub fn caps（WINDOWS の順の cap_of）・pub fn notice_at（Pressure と Refused の欄 at）・私的な fn notice_group・pub fn latest_notices（notices が Known なら群の名が同じ行のうち at がその最大に等しい行を電文の順に・Unknown か群の行が無ければ空）を足す。Pw に pub な欄 cap（字 / と cap_of の値・None なら字 / ?）と hot（その群の latest_notices に欄 window がその窓の名の Pressure の行が在れば真）を、GroupView に pub な欄 refused（その群の latest_notices の最初の Refused の行の reason・無ければ None）を足す。MvRow に pub な欄 kind（pub enum MvKind・Moved と Pressure の String と Refused の String）を足し、mv_row は kind を Moved にする。pub fn notice_row は知らせの行を MvRow にする（at は hmd の字・group は欄のまま・from は欄 account・to は空の字・Pressure の kind は short の窓の字と空白と used と字 %・空白・≥・空白と cap・Refused の kind は reason）。pub fn history は移動の記録と知らせの行を at の大きい順に並べ（安定の並べで、同じ at は移動の記録が先・それぞれ電文の順）、moves と同じ畳み（私的な fn fold・初めの SHOW_MV 行と残りと字 +残りの数）にする。moves は fold を使う形にし値は変えない。Home に pub な欄 caps（home は caps の値・content の本文が読めない枝は空）を足し、欄 moves は moves が Unknown なら MOVES_UNREAD、moves が Known で notices が Known の空でない列なら history、それ以外は今のまま（moves が空なら NO_MOVES の空・在れば moves）にする。
      形（home.rs・mod dom）。窓の段の span の class は hot なら字 pw hot・偽なら pw で、使った割合の後に span の class cap num の中に欄 cap の字を置く（見出しの語の鍵 used は変えない・着地済みの歯 acctlook がその字を見る）。群の枠の次の移り先の段（div の class glab）の末に、refused が在れば span の class why の中に字 GroupMoveRefused と空白と理由の語を置く。口座 × 窓の段は Home の caps を読み、fn acct_row_view は caps の slice を受け、窓の i 番目の棒に caps の i 番目を渡し、fn meter（WindowRow の Option と u64 の Option）は値が在れば棒の中に span の class cap（style は字 left: と値と %・値の替えはしない）を置く。fn mv_li は kind が Moved なら今の形（私的な fn moved_li・hover の card と印 →）、Pressure なら li に印 !（span の class ic pressure）と時刻と群と口座と字と span の class sub の字 GroupPressureNotified、Refused なら印 ×（span の class ic refused）と時刻と群と口座と span の class sub の字 GroupMoveRefused と空白と理由の語を描く（知らせの行は hover の card を持たない・見本と同じ）。stylesheet の class は見本の写しの時に在る（.meter .bar .cap・.pw .cap・.pw.hot・.mv .ic.pressure・.mv .ic.refused・.why・確かめた）ので style.css と語の辞書は書かない。
      節の値（歯が組む入力・fixture は tests/fixtures/account/acct-doc.json の今の main の字・at は 1790510400）。fixture の caps は five_hour 85・seven_day 95・seven_day_model 95、notices は Refused（at 1790509800・群 Tier2・口座 acct-2・理由 no-candidate）と Pressure（at 1790508600・群 Tier1・口座 acct-2・窓 five_hour・used 100・cap 85・sent 1）、moves は Tier1 の acct-2 から acct-1（at 1790503200）と Tier2 の無しから acct-2（at 1790460300）。群 Tier1 の今の口座 acct-1 の 5h は 42%、Tier2 の今の口座 acct-2 の 5h は 100% で、Tier2 は閾値 85 を越えても行が無いので強調しない。組 K は caps が seven_day_model（rule r-m・Known 300）と five_hour（rule r-5・Unknown）の 2 行。列 M1 は、どの行も口座 acct-9 で、Pressure（at 500・Tier2・seven_day_model・used 10・cap 95）・Pressure（500・Tier2・seven_day・1・95）・Refused（500・Tier2・x-word）・Pressure（400・Tier1・seven_day・99・95）・Refused（300・Tier1・old-word）・Pressure（600・Tier9・five_hour・99・85）の順（使った割合が閾値より小さい行でも強調する）。列 M2 は Refused（100・Tier1・old-word）の後に Pressure（200・Tier1・five_hour・50・85）。N1 は Pressure（at 1790510340・Tier1・acct-9・seven_day_model・used 97・cap 95・sent 1）、N2 は Refused（at 1790510400・Tier2・acct-9・no-candidate）。history の表は fixture の moves と Refused（at 1790503200・Tier2・acct-9・w）と N1 の 2 行で、shown の群と kind は Tier1 と Pressure の字 model 97% ≥ 95・Tier1 と Moved・Tier2 と Refused の字 w・Tier2 と Moved。fixture の home の moves の shown の表は、at の字 20:50 JST・Tier2・from acct-2・to 空・Refused の字 no-candidate、20:30 JST・Tier1・acct-2・空・Pressure の字 5h 100% ≥ 85、19:00 JST・Tier1・acct-2・acct-1・Moved、07:05 JST・Tier2・―・acct-2・Moved の 4 行。
      節の DOM の字の表（歯 hthr_dom_wiring・mod dom の後の字でそれぞれ 1 度）。span class=cap style=format!(left:{c}%) の閉じた span（字の中の二重引用符は歯の file が持つ）・if p.hot { pw hot } else { pw }・span class=cap num の中の {p.cap}・span class=why の中の format!(GroupMoveRefused {r})・span class=ic pressure aria-hidden=true の中の !・span class=ic refused aria-hidden=true の中の ×・span class=sub の中の GroupPressureNotified・span class=sub の中の format!(GroupMoveRefused {reason})・meter(w, caps.get(i).copied().flatten())。
      節の比べの字の 10 語（歯 accthome_no_pressure_formula が home.rs に無いと見る）。>= cap・> cap・<= used・< used・used_pct >・used_pct <・used >・used <・c-occ・remaining。
      変わらない行と読む順と落ちる時（歯で測らず、この行の差分で持つ）。変わらない: 次の一手の段・口座 × 窓の窓の欄と 7 日の線と測った時刻・群の枠の見出しと今の口座と project の chip と候補の列と詳しくの段・移動の記録の行の字と hover の card・電文と server と中核と契約の型・語の辞書と stylesheet。落ちる時: caps に窓の行が無いか読めない窓は字 / ? で線を置かない。notices が読めない電文は強調も断りの理由も知らせの行も出さず、移動の段は今のまま。
      決めた幅（起草の決め）。(a) 強調と断りの理由は群の最も新しい知らせの組（群の名が同じ行の at の最大に等しい行）だけから出す。古い行（前の周の逼迫や解けた断り）を画面に残さないためで、器は同じ実測に 2 度知らせない（同じ群・口座・窓で前の知らせより後に新しい実測が無い周は送らない）ので、最も新しい組が器の今の言い分に近い。強調は知らせの口座を問わない（知らせの口座は群の測る口座のどれかで、今の口座と違ってよい・枠の窓の段の使った割合は今の口座の値のまま）。(b) 閾値の線の位置は閾値の値の百分率のまま（見本の meter と同じ）。(c) 知らせの行の窓の字は short の字（5h・7d・model）。(d) 知らせが在る電文の移動の段は移動の記録と知らせを 1 つの列にする（見本の mvli と同じ）。
      着地済みの歯（grep で確かめ、試作で撃った）。accthome は write-set で直す（accthome_moves_fold の fixture の行と、見張りの accthome_no_pressure_marks の名と中身・ほかの歯は直さずに通る）。hcard は hcard_move_on_fixture が MvRow を struct の字で組むので write-set で直す（欄 kind の 1 行と use の 1 語・ほかの hcard_ の歯は mv_card と moves の値を見て直さずに通る）。acctlook は home.rs の窓の段の見出しの語の鍵 used の字を見るので置き場だけの = で持つ。hcnx は home.rs の mod dom の use の字と fn nx_row_view と fn group_card の字を見るので = で持つ（この行は use を替えない）。aord は aord_blocks_follow が fixture の電文から組んだ HOME の移動の段の頭の行の from を見るので write-set で直す（知らせの行が頭に来るので、kind が Moved の最初の行を見る）。home.rs を読むほかの歯（hnunk・hspk・ntime・smore・tipx・acctframe）は home の関数の値か frame を見て、この行の足す欄と関数を読まない（試作で通った）。
      測り方・歯（tests/hthr.rs・新しい file）。使う item は tsuzuri_surface::account::home の GroupView・MOVES_UNREAD・MvKind・NO_MOVES・cap_of・caps・history・latest_notices・notice_row・home・content と、tsuzuri_surface::project::Body と tsuzuri_surface::view::Fetched、tsuzuri_contract::account の AccountDoc・GroupNotice・WindowCap、board の Reading、wire の decode（どれも pub）。歯の名 hthr_ は、main b8beec2 の contracts の verify の filter の語 248 のどれも部分の字として含まない（試作で確かめた）。
      依存と順。depends は空（ノートの前の行）。計画の 5 節の鎖は surface/account/home.rs が h-next-unknown（着地済み）→ h-acct-spark（着地済み）→ h-thr-home → g-attach-acct（ノートの depends で順を持つ）。着地済みの c-acct-thr（電文の caps と notices）の後の行。いま走る・待つ便と起草中の行（w18f・w19a・w19c・w19d）は home.rs と歯 accthome・acctlook・hcnx・hthr を書かない（起草の指示の write-set で確かめた）。
      範囲の外。候補ごとの門で落ちた理由（器が出さない・器の memo s2-07l.725 が着地したら写す行を起こす）。project board の席の逼迫の印（行 g-seat-thr）。電文と server の読み。
  - n: 4
    type: prose
    title: 行 g-attach-acct — account board の私的な attach_some を widgets の pub fn に寄せる
    body: |
      在りかの main は b8beec2（計画 surface-plan 第 0.62 版）。面の crate tsuzuri-surface の src/account/projects.rs（今の main で 1225 行）と src/account/home.rs（前の行 h-thr-home の着地の後の字）。この行はノートの 2 行の後の行で、h-thr-home の着地の後に流す（ノートの depends・どちらも home.rs を書く）。home.rs の在りかは名で言い、行の番号は今の main の projects.rs の字だけで言う。
      なぜ。行 g-card-adopt-b（着地済み）は widgets/hover.rs に pub fn attach_some（要素の web_sys::Element と Card の Option を受け、Some なら同じ file の pub fn attach に渡す・use:attach_some の directive の形の口）を置き、project board の面はそれを use で引く。account board の projects.rs と home.rs は同じ中身の私的な fn attach_some を 1 つずつ持つ（第 15 波 f の起草の調べ・今の main で確かめた）。同じ口の写しを消して 1 つに寄せ、増殖を防ぐ（席の決め 2026-09-28）。hover.rs の attach は要素の反応の範囲が捨てられるときに、その要素の出した card を閉じる後始末（on_cleanup で層の release）を持つので、寄せた後も account board の card はその決まりで閉じる（私的な写しも同じ attach を呼んでいたので振る舞いは変わらない）。
      在りか・projects.rs（write-set）。mod dom（wasm の target だけ）の use の行 use crate::widgets::hover::{Card, attach};（814 行）と、私的な fn attach_some（916〜921 行・doc の 1 行・el と card の Option を受け Some なら attach に渡す）。directive の字 use:attach_some= は群の見出しの chip（926 行）と行の 2 欄（1040・1041 行）と畳んだ行の 2 つ（1093・1094 行）の 5 度。Card は fn head_view の引数の型にも使う。
      在りか・home.rs（write-set・h-thr-home の後の字）。mod dom の use の行 use crate::widgets::hover::{Card, attach}; と、私的な fn attach_some（doc の 1 行・中身は projects.rs と同じ）。directive の字 use:attach_some= は群の project の chip の 1 度。mod dom の中で Card を使うのは私的な fn attach_some の引数の型だけ。
      形。projects.rs は use の行を use crate::widgets::hover::{Card, attach, attach_some}; に替え、私的な fn attach_some と doc の 1 行と後の空の行を消す。home.rs は use の行を use crate::widgets::hover::{attach, attach_some}; に替え（Card は使わなくなる）、私的な fn attach_some と doc の 1 行と後の空の行を消す。directive の字と呼ぶ所は変えない。
      変わらない行（歯で測らず、この行の差分で持つ）。hover.rs・projects.rs と home.rs の model の部分と DOM の組み・card の中身・語の辞書と stylesheet。
      着地済みの歯（grep で確かめ、試作で撃った）。hcproj の hcproj_dom_wiring は projects.rs の DOM の部分に私的な fn attach_some の宣言の形（空白を除いた字 fnattach_some(el:web_sys::Element,card:Option<Card>)）と、その中身が attach(el,card) を持つことを見るので write-set で直す。hcnx の hcnx_dom_wiring は home.rs の mod dom の use の字（空白を除いた字 usecrate::widgets::hover::{Card,attach}; か {attach,Card};）と同じ宣言の形と中身を見るので write-set で直す。cadq と cadl は project board の file（ask.rs・askpage.rs・ledger.rs・kit.rs・gaps.rs）と hover.rs だけを読み、この行の書く file を読まないので write-set に入れない（試作で通った）。
      測り方・歯（tests/gatt.rs・新しい file）。歯は src の下の rs の file を dir の名の順に全部読み（std の fs の read_dir）、字を数える。歯の名 gatt_ は、main b8beec2 の contracts の verify の filter の語 248 のどれも部分の字として含まない（試作で確かめた）。
      依存と順。depends は h-thr-home（同じノート・home.rs を書く）。計画の 5 節の鎖は surface/account/projects.rs が h-acct-rest（着地済み）→ g-kind-label（着地済み）→ g-attach-acct、surface/account/home.rs が h-thr-home → g-attach-acct（ノートの depends で順を持つ）。着地済みの g-card-adopt-b（pub fn attach_some）の後の行。起草中の行 c-unref-now（w18f）が account の project の未反映の数を書く file の見込みに projects.rs が在れば重なる（起草の notes に書いて席に預ける）。
      範囲の外。hover.rs と project board の面。account board の cards.rs・session.rs・ledger.rs・board.rs（字 fn attach_some を持たない・確かめた）。

