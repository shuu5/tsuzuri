    body: |
      account board の面の行 2 つ（面の crate の src/account の home.rs と projects.rs と面の歯だけ）。
      h-thr-home は HOME の口座 × 窓の棒に閾値の印を、群の枠の窓の段に閾値の字と逼迫の強調を、次の移り先の段に移動の断りの理由の語を、移動の段に逼迫の知らせと移動の断りの行を足す。
      値は電文の caps（器の rules 行の窓ごとの閾値の写し）と notices（器の event GroupPressureNotified と GroupMoveRefused の写し）から読み、強調と断りの理由は群の最も新しい知らせの組だけから出す。面は使った割合と閾値を比べない。
      g-attach-acct は account board の 2 つの file の私的な fn attach_some を消し、widgets/hover.rs の pub fn attach_some を use で引いて使う。card の後始末の決まりは hover の attach が持つ。
      電文と server と中核と契約の crate と語の辞書と stylesheet と外の依存は変えない。
