  - n: 3
    type: prose
    title: 行 h-next-unknown — なしを判じなかった次の一手を account board で測れていないに出す
    body: |
      なぜ。行 c-next-stall（着地済み・第 8 波のノート surface-wave8b）は、中核の next_step の なし の判じを、判じた種類のどれも当たらず判じなかった種類も無いときだけ当てる形にした（判じなかった種類が在れば なし の結果は NotJudged で、lead は並びで最初に Hit の種類・どれも Hit でなければ Nothing）。project board の次の一手の大きい箱は、lead が Nothing で なし の結果が NotJudged の電文を測れていないの箱で出す（面の project の next の module の unjudged と UNJUDGED_KEY と UNJUDGED_LINE・着地済み）。account board は同じ電文を今も (g) 次の一手なし と出し、することが無いと言い切ってしまう（要件 NFR2 は、読めないときに 0 や無しでなく測れていないと出すと決める）。見本の account board（docs/design/mock3/acct.js の関数 nextAt）は、判じた種類が 1 つも無い project を top の unknown（語の鍵 st_unknown の語・順位 7 で並びの末尾・なしの 6 の後ろ）にし、HOME の行（account/index.html の nxrows）と各 project の表の要対応の欄（関数 projTable の c-need）に 測れていない と出す。計画 surface-plan の 4 節の行 h-next-unknown（依存 c-next-stall・着地済み）は、この なしを判じなかった電文も読めない project と同じ測れていないの字と後ろの順にすると決めた。要件 FR11 は次の一手を閉じた 7 種で判じて account board の HOME に各 project の次の一手を並列に出すと決め、NFR2 は測れていないの出し方を決める。
      在りか（main bbc8126 で確かめた）。面の src/lib.rs の pub mod account と pub mod project、account の mod.rs の pub mod home と pub mod projects で、どちらも host でも組み、結合試験から tsuzuri_surface の account の home と account の projects の path で use で引ける。
      home.rs（write-set）。pub const UNKNOWN_KEY（&str・字 st_unknown）・pub const NONE（&str・字 ―）・pub struct NxMark（pub な欄 kind・glyph・class）・pub struct NxRow（pub な欄 project・group・lead は NextMove の Option・key は &'static str・line は String・marks は NxMark の Vec・class は &'static str・card は hover の Card・derive は Debug・Clone・PartialEq・Eq）。private の fn rank（&Reading の NextStep を受け usize）は Known なら lead の NextMove の ALL の中の位置、Unknown なら ALL の数。pub fn marks（&Reading の NextStep を受け 6 つの NxMark）は MARK_KINDS の順に、電文にその種の check が在れば Hit は nxm on・Miss は nxm off・NotJudged は nxm na、無いか Unknown なら nxm na。pub fn nx_row(row: &ProjectRow, at: EpochSecs) -> NxRow は、Known なら lead に電文の lead、key に project の next の key に lead を渡した鍵、line に big に lead とその種の check を渡した値の what、Unknown なら lead は None・key は UNKNOWN_KEY・line は NONE、marks は marks、class は lead が Nothing か None なら nxrow dim・ほかは nxrow、card は account の projects の nx_card(row, at)。pub fn next_all(doc: &AccountDoc) -> Vec<NxRow> は電文の projects を rank で安定に並べ（同じ位は電文の順）、nx_row に電文の at と渡す。host の部分の use に project の next の big と key が在る。
      projects.rs（write-set）。pub struct Need（pub な欄 lead は NextMove の Option・key は &'static str・sev は &'static str・line は String の Option・derive は Debug・Clone・PartialEq・Eq）。pub fn need(project: &ProjectRow) -> Need は、Known なら lead に電文の lead・key に next_key に lead を渡した鍵・sev に pub fn sev に lead の Some を渡した値・line に big の what の Some、Unknown なら lead と line は None・key は crate::project の state_key に UNKNOWN を渡した鍵（st_unknown）・sev は sev に None を渡した値（lo）。pub fn sev は Nothing と None に lo を返す。pub fn need_rank(project: &ProjectRow) -> usize は Known なら lead の ALL の中の位置、Unknown なら ALL の数。pub fn table(doc: &AccountDoc, sort: PSort, mode: Mode) -> Table は並べ方 PSort の Need のとき電文の projects の位置を need_rank で安定に並べ、見出しの無い 1 つの束にする（pub struct Table の pub な欄 groups は Group の Vec・Group の pub な欄 rows は ProjLine の Vec・ProjLine の pub な欄 name と need と cards・RowCards の pub な欄 need）。pub fn row_cards の need は pub fn nx_card(project: &ProjectRow, at: EpochSecs) -> Card に行と電文の at を渡した値で、nx_card の title は名と字 · と、need の lead が Some なら字 ( と key の末尾の 1 字と字 ) と空白と語、None なら語（st_unknown の語 測れていない）、kind は語の鍵 next_all の語（各 project の次の一手）と字 · と、a から f の 6 種のうち checks の結果が Hit の種の末尾の 1 字と need の lead が Nothing の Some なら字 g を空白でつないだ字（無ければ ―）、value は need の line（無ければ ―）、more は 6 種の順に字 ( と末尾の字と字 ) と空白と語と空白と、Hit なら字 · と big の what・Miss なら字 なし・NotJudged か check が無ければ ―。nx_card は need を呼ぶので、この行が need を直すと nx_card の値も直る（nx_card の本体は書かない）。host の部分の use に project の next の big と key（名 next_key で）が在る。
      account の mod.rs（書かない）の pub fn need_count は電文の next が Known で lead が Nothing でない project を数える（HOME の tab の数と各 project の tab の印・判じなかった なしは lead が Nothing なので今も数えない・見本の nNeed も unknown を数えない）。
      組み手（面の src/project/next.rs・この行は書かない・pub mod project の pub mod next で host でも組む）。pub fn unjudged(step: &NextStep) -> bool は lead が Nothing で、checks の中で種が Nothing の最初の check が在りその結果が NotJudged のときだけ真（check が無ければ偽）。pub const UNJUDGED_KEY（字 st_unknown）・pub const UNJUDGED_LINE（字 まだ判じていない種類があり、することが無いとは言えない）・pub const NONE_LINE（字 orchestrator が動いている / 待っている）。語の辞書（vocab.json・書かない・確かめた）の語は st_unknown が 測れていない・nx_g が 次の一手なし・next_all が 各 project の次の一手・nx_a が 限度 / 移動・nx_b が 応答なし・nx_c が 止まっている run・nx_d が 束の承認・nx_e が 質問・nx_f が 発効待ち。
      電文と fixture（crates/tsuzuri-contract と tests/fixtures/account/acct-doc.json・書かない・確かめた）。NextStep の pub な欄は checks（NextCheck の Vec・欄 kind・result・count・target）と lead、CheckResult は Hit・Miss・NotJudged、NextMove の ALL は LimitOrMove・Unresponsive・StalledRun・BatchApproval・Question・AwaitingEffect・Nothing の 7 つ。fixture の電文の at は 1790510400、projects は proj-a（group Tier1・next Known・lead question・checks は limit-or-move と unresponsive と stalled-run と nothing が miss、batch-approval と awaiting-effect が not-judged、question が hit で count 1 と target proj-a.7）・proj-b（group Tier2・next Unknown）・proj-c（group Tier1・next Unknown）の順。歯の電文 U と M は proj-a の行の写しの checks の結果と lead を歯の中で替えて組む（U は c-next-stall の決まりで中核が返す形と同じ・束の承認が NotJudged で当たりが無いので なし が NotJudged）。
      形。home.rs と projects.rs の host の部分の use の project の next に unjudged と UNJUDGED_LINE を足す。home の rank は、Known で unjudged が偽なら今のまま lead の位置、unjudged が真か Unknown なら ALL の数にする。nx_row は、Known で unjudged が真なら lead を None・key を UNKNOWN_KEY・line を UNJUDGED_LINE の字にし（marks と card は今のまま電文から組む・class は lead が None なので nxrow dim）、ほかは今のまま。projects の need は、Known で unjudged が真なら lead を None・key を state_key に UNKNOWN を渡した鍵・sev を sev に None を渡した値・line を UNJUDGED_LINE の字の Some にし、need_rank は unjudged が真なら ALL の数にする。line を ― でなく UNJUDGED_LINE にするのは、project board の測れていないの箱と同じ理由の字を出すため（読めない project の line は今のまま）。足す字は両方の file で合わせて 30 行ほどで、home.rs と projects.rs は受付の上限 1500 行の内に留まる。DOM（mod dom）と nx_card・gproj_card・row_cards・marks・sev・judge_rank・table の本体は書かない（DOM は need の lead が None の行に測れていないの印を出し、nx_row の lead が None の行に state_icon の unknown と st_unknown の語を出す・着地済みの字のまま）。
      着地済みの歯（直さずに通る・write-set の =）。tests/accthome.rs の accthome_next_all_order_rule は fixture の proj-a の写し（nothing の結果が miss）の lead を替えた行と proj-b の写しで並べを見るので、unjudged はどの行でも偽で値は変わらない。accthome_next_row_line_and_marks は checks に nothing が Hit の行と、lead が Nothing で checks の空の行（nothing の check が無いので unjudged は偽）を見る。accthome_no_pressure_marks は home.rs の字に語 hot・spark・measured_at・c-occ・remaining・refused と cap を二重の引用符で囲んだ字が無いことを見る（足す名 unjudged と UNJUDGED_LINE は含まない）。tests/acctproj.rs の acctproj_need_order は proj-a の写しの lead を替えた行と Unknown の行の need_rank と need の並べを見る（nothing の結果が miss なので値は変わらない）。書く file の外で直さずに通る歯: hcproj と hcnx（fixture の行と、nothing が Hit の行と、lead が question で checks の空の行の card を見る・どれも unjudged が偽）・acctframe の badge の歯（need_count は書かない）・nstall（project の next の module・書かない）。
      測り方。新しい歯は面の crate の tests/hnunk.rs に置き、名を hnunk_ で始める。fixture の電文は tests/fixtures/account/acct-doc.json を契約の型の wire の decode で読み（書かない）、U と M は歯の中で proj-a の行の写しから組む。card の値は tsuzuri_surface の account の projects の nx_card を撃った値と比べ、時刻の字を字で固めない。自分の名の歯は tests/hnunk.rs の字を読み、test の属性の行の次の fn の名を全部集め、名の数が 4 以上であることと done (5) を見る。
      filter の語（着地済みの行の verify の filter の語・この行の接頭辞 hnunk_ は並べない・ほかの語を部分の字として含む語は省いた）は aaround_・accept_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・board_min_・bport_・brand_・btuck_・cadopt_・cgdom_・cmark_・contract_form_・cround_・csled_・denv_・ecache_・flight_・fmark_・frame_・fserve_・fstop_・gapspage_・gfresh_・ghb_・glabel_・gnav_・graph_・gsum_・gtuck_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hfig_・hook_・hruling_・hsblock_・hsderive_・hspage_・hsym_・iclose_・ilink_・kcli_・klink_・lcard_・ledgerblock_・lhome_・lspark_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・parts_・pclosed_・pfold_・pipe_・plimit_・pmore_・pquest_・project_・ptitle_・pwhole_・qblock_・qgate_・qkey_・question_・rhold_・runsdoc_・saxis_・sclosed_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_ で、新しい歯の名から先頭の hnunk_ を除いた字は、このどれも部分の字として含まない。名は done に書いた hnunk_home_row_unmeasured・hnunk_home_order_last・hnunk_projects_need_unmeasured・hnunk_names_clean（どれも並べた語を含まない）。
      依存と順。depends は無い（行 c-next-stall は着地済み・行 h-cards-nx〔b229dd9〕と h-cards-proj も着地済み）。走行中の行とは write-set が置き場だけの = を含めて重ならない（main bbc8126 の contracts で確かめた）。g-fresh（ノート surface-wave11a）は面の net.rs・lib.rs・board.rs・account の board.rs と fresh.rs と、= で hcproj.rs ほかの歯を持ち、この行は hcproj.rs を持たない。g-closed-mark（t3-hub.52.68・bbc8126 で着地）は project の pipeline.rs、e-sess-closed と c-pipe-questioned と e-cache（ノート surface-wave11b）は中核と境界の file で、どれも重ならないので便の bead の依存は要らない。計画の 5 節の鎖では home.rs は h-next-unknown → h-thr-home → h-acct-spark（h-cards-nx は着地済み）、projects.rs は h-next-unknown → h-sort-hist → h-acct-cols で、後の行はこの行の着地の後に流す（器は同じ file の行を直列にする）。外の依存は足さない。

