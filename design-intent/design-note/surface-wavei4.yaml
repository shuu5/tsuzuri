age open --to term-a は rc 0 で、標準出力の行は字 端末 term-a の表示面の Chrome に頁の窓を 1 つ開いた と節の URL の行の 2 つで、偽の端末の Chrome が受けた要求の行と websocket の字は節の頁を作る 7 つの字とこの順に同じで（Target.createTarget はちょうど 1 度）、偽の ssh の argv の記録は 1 回（歯 stcli_open_makes_one_page） (13) 偽の端末の Chrome が答えない時、tz stage navigate --to term-a --url 節の開発中の app の URL は rc 1 で、標準出力は 2 行で、1 行目は字 端末 term-a と字 tz stage open を含み、2 行目は節の URL の行で、偽の端末の Chrome が受けた要求の行は GET /json/version の 1 つだけで、偽の ssh の argv の記録は 1 回で、窓を起こす回の印の file は無い（歯 stcli_navigate_keeps_closed） (14) 歯が場の一時の dir の user_dir の dir と字 term-a の lock を持つ間に撃った tz stage open --to term-a は、1 秒の間は偽の ssh を撃たず、歯が錠を放すと rc 0 で、撃ってから 1 秒より後に返り、標準出力の行は字 端末 term-a の表示面の窓は在る（起こさない）と節の URL の行の 2 つ（歯 stcli_open_waits_for_lock） (15) user_dir は場の一時の dir に、その下の名 tzst-u と /proc/self の持ち主の uid の dir を Ok で返してその権限の下 9 bit は 0700 で、歯がその権限を 0755 にした後の user_dir も同じ path を Ok で返して 0700 に置き直し、その path を場の作業場への symlink に替えると Err でその字は path の字と字 symlink を含み、その時に撃った tz stage open --to term-a は rc 1 で、標準出力は path の字を含む 1 行と節の URL の行の 2 行で、偽の ssh は撃たれず、path を空の file に替えた user_dir も Err（歯 stcli_private_dir_checks） (16) src/stage/cli.rs の字は字 Target.createTarget をちょうど 1 度持ち、4 つの crate（境界・中核・契約・面）の src の下の rs の file で字 createTarget を持つのは cli.rs だけで、cli.rs は bringToFront・activateTarget・setWindowBounds・json/new・json/activate・Runtime.evaluate・remote-debugging-port・unsafe のどれも含まず、src/stage の cdp.rs・json.rs・launch.rs・pipe.rs・relay.rs・terminal.rs・tunnel.rs・url.rs・ws.rs は字 CLAUDECODE を含まず、mod.rs は pub mod cli; をちょうど 1 度、tunnel.rs は節の version の宣言の字をちょうど 1 度持つ（歯 stcli_source_guards） (17) この行は Cargo.toml と Cargo.lock と src/lib.rs と src/server の下と src/stage の cdp.rs・json.rs・launch.rs・terminal.rs・pipe.rs・relay.rs・url.rs と fixture と着地済みの歯の file を書かず、tunnel.rs には use の 2 行の直し（io の ErrorKind と unix の fs の MetadataExt）と pub fn user_dir とその doc と pub fn version とその doc だけを、ws.rs には file の頭の //! の doc の Socket の send の使い手の 1 行を 2 行に替える直しだけを足し、着地済みの歯は直さずに全部通る（stcdp の 16 本と stlaunch の 16 本と xtask の check が撃つ全部）（歯 stage_cdp_window_never_raised と stage_cdp_no_script_port と launch_source_guards と xtask の check） (18) tests/stcli.rs の test の属性の付いた fn の名はちょうど 17 で、どれも stcli_ で始まり、名から先頭の stcli_ を除いた字は、節に並べた filter の語と行 i-4 の接頭辞 relay_ のどれも部分の字として含まない（歯 stcli_own_names_clean（自分の file の字を読んで全部の名を見る））
