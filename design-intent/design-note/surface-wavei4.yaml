      決定はしご（条 P-27）と試し。要るか: 要る（要件 FR16 の命令の口と守り）。既に在るか: 起動と tunnel（launch・tunnel）・CDP の session（cdp）・席の目と URL（relay・url）・端末の行（terminal）・子の process（proc）・git の鍵（acct）は在るので使い回し、口と守りと錠だけを足す。標準 library で足りるか: 足りる（file の錠は std の File の lock と try_lock・base64 の戻しは 20 行ほど・境界の crate の std だけの歯のまま）。席の下書き（repo の外の写しの workspace で、cargo の offline の build と nextest と clippy〔全部の target・警告を誤りにする〕と xtask の check を撃った）で、i-4 と i-5 を当てた木の境界の crate の歯 315 本が全部通り、clippy が警告 0 で、xtask の check が通り、stcli と strelay と stcdp と stlaunch の 61 本を 5 回続けて撃って落ちないことを確かめた。本物の端末の Chrome の Target.createTarget で窓が出ることと、本物の器の scribe2 validate の口はこの server で確かめていない（notes）。

