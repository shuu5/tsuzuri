sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      席が持ち主の端末の Chrome を起こして画面を見せる表示面（要件 FR16・判断の記録 ADR-5 と ADR-15）の 4 つ目と 5 つ目の部品を、境界の crate の module stage に置く（i-4・i-5）。
      i-4 は、ssh で届かない端末の落ちる先として、この server の側の headless の Chrome を pipe の口で起こして席の目にし（子 module relay と pipe）、board の URL を実行の時に組む（子 module url）。
      i-5 は、tz の入口に tz stage の腕を足し、命令の口と tz stage run と持ち主の tz stage open を置き、器の検め・席の中の撃ちの断り・board の頁の上の入力の断り・窓の錠・出力の最後の URL の 1 行を守る（子 module cli）。
      窓を前に出す・動かす命令は持たない。外の依存は足さない。表示先の設定と初めて見せた印（i-7）・board の設定の画面（i-8）・知らせ（i-10）は後の行。
