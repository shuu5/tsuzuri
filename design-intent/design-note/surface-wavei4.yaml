      測り方。新しい歯の file は境界の crate の tests/strelay.rs（席の下書きで 835 行）で、名を relay_ で始める（名は done の 13）。端末の Terminal は CARGO_MANIFEST_DIR の 2 つ上の tests/fixtures/stage/terminals.toml の字を src/stage/terminal.rs の lookup で引く。使う item は tsuzuri_boundary の stage の cdp（Command・Session・HISTORY）・json・launch（tunnel_argv）・pipe（Pipe）・relay（全部）・terminal・url（全部）で、lib.rs の pub mod stage と mod.rs の pub mod の行で外から見える。Reach と Eyes は Session を持つので型を書いた fn の値は型の別名で束ねる。done (5) の権限は std の os の unix の fs の PermissionsExt の mode の下 9 bit で見る。done (9) は /proc の下の pid の stat が無いか状態が Z（親の無い子は init が片付ける）になるのを 2 秒まで待つ。done (10) の時間は std の time の Instant で撃つ前後を数え、上の限りだけを見る。done (11) は src/stage の file の字を注釈ごと読む（字 print と ! は歯の中でつないで組む）。done (13) は自分の file の字を読み、test の属性の行の次の fn の名を集め、下の filter の語を空白で区切った 1 つの字の定数（concat で組む・語の数 125）と照らす。整える時は cargo fmt を crate の全体に撃たない（main は rustfmt の既定で整っておらず、write-set の外の着地済みの file まで書き換わる）。rustfmt に渡すのは新しい file の path だけにする（着地済みの file の mod.rs に渡すと子の module の file まで辿り、cdp.rs などの着地済みの file も既定で整っていないので、書く行だけを周りの字の形に合わせる）。
      filter の語（main 7d633b6 の contracts の全部の verify の filter の語 189 のうち、ほかの語を部分の字として含まない最小の語・125 語・この行の接頭辞 relay_ は並べない）は aaround_・accept_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadopt_・cgdom_・cmark_・contract_form_・cround_・csled_・denv_・ecache_・flight_・fmark_・frame_・fserve_・fstop_・gapspage_・gfresh_・ghb_・glabel_・gnav_・graph_・gsum_・gtuck_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hspage_・hsym_・iclose_・ilink_・kcli_・klink_・launch_・lcard_・ledgerblock_・lhome_・lspark_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・parts_・pclosed_・pfold_・pipe_・plimit_・pmore_・pquest_・project_・ptitle_・punmap_・pwhole_・qblock_・qgate_・qkey_・question_・rhold_・runsdoc_・saxis_・sclosed_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_ で、新しい歯の名から先頭の relay_ を除いた字は、このどれも部分の字として含まない。字 pipe_ は pipeline の行の filter の語なので、歯の名に字 pipe と下線の並びを置かない。contracts の verify の filter の語に字 relay を含む語は無い。
      依存と順。depends は空（依存の行 i-2・i-3・i-1・i-1b はほかのノートの着地済みの行で、depends は同じノートの中の行しか引けない）。同じノートの行 i-5 がこの行の後に流れる（i-5 の depends）。計画の 5 節の鎖では boundary/stage/mod.rs は i-1 → i-3 → i-2 → i-4 → i-5 → i-7 → i-10、boundary/stage/url.rs は i-4（i-5 と i-10 は使うだけ）、boundary/stage/cdp.rs は i-3 → i-4（pipe を採れば）→ j-runner で、この行は pipe を採るので cdp.rs を書く。この行と i-5 は mod.rs を書き、tests/stcdp.rs は i-5 が置き場だけの = で持つので、i-5 はこの行の着地の後に流し、順は便の bead の依存で持つ。器は走行中の行と write-set が重なる行（置き場だけの = 同士も）を断るので、ほかの行との順も便の bead の依存で持つ。main 7d633b6 の contracts の行のうち、この行の write-set と = を含めて重なるのは着地した行 i・i-1・i-3・i-2 だけ。外の依存は足さない。src の file の大きさ（席の下書きを rustfmt で整えて数えた）は relay.rs 232 行・pipe.rs 91 行・url.rs 180 行、cdp.rs は 291 行から 356 行、mod.rs は 11 行から 15 行（大きさ M の余白 300 の内・受付の上限 1500 から遠い）。
      決定はしご（条 P-27）と試し。要るか: 要る（要件 FR16 の届かない端末の URL と席の目・受入 AC13 の落ちる先）。既に在るか: 子の process を group で撃って止める部品（proc の capture と stop_with）・0700 の dir（tunnel の socket_dir）・JSON の切り出し（json）・CDP の session（cdp）・port の読み（acct の BOARD_ARGS と board_port）は在るので使い回し、pipe の運び手と落ちる先と URL だけを足す。標準 library で足りるか: 足りる（pipe は std の process と mpsc と thread・fd の写しは sh の 1 行・境界の crate の std だけの歯 skeleton_boundary_std_only_and_bin_tz のまま）。席の下書き（repo の外の写しの workspace で、cargo の offline の build と nextest と clippy〔全部の target・警告を誤りにする〕を撃った）で、main 7d633b6 にこの行だけを当てた木で境界の crate の歯 298 本が全部通り、clippy が警告 0 で、strelay の 12 本を続けて撃って落ちないことを確かめた（xtask の check は i-5 を足した木で撃った・notes）。本物の Chrome の pipe の口と headless の起こしはこの server で確かめていない（notes）。
  - n: 4
    type: prose
    title: 行 i-5 — tz の口の配線と守り
    body: |
      なぜ。要件 FR16 は、席が端末の一覧から端末の名で命令し、navigate・viewport・reload・click・入力・key・scroll・待ちと screenshot・DOM・console を行い、窓を起こすのは表示先の端末に初めて見せる時と持ち主が tz の口か board の button で頼んだ時だけで（持ち主が閉じた窓は開き直さない）、board の頁の上では click・入力・key を断り、ssh で届かない端末には board の URL を渡すとする。判断の記録 ADR-15 の決定 (6) は窓を前に出さず動かさず、開き直すのは持ち主が頼んだ時だけとし、決定 (7) は board の頁の上では見せるだけにして click・入力・key の命令を歯で断り、任意の JavaScript を撃つ口を持たないとする。着地した行 i-1〜i-3・i-1b と同じノートの行 i-4 の後も、tz の入口に stage の腕は無く、部品を命令の口と守りにつなぐ所が無い（下の在りか）。この行は計画 surface-plan（v0.25）の 9 節の計画だけの行 i-5 と 3 節の席の決め（tz stage open の守り・行 i-2 の起草で出た問いの決めの (1) と (3)）のとおりそれを置く。表示先の設定と --to を省いた撃ち（行 i-7）・board の設定の画面と開く button（行 i-8）・知らせ（行 i-10）は後の行。
      拠る裁定と席の決め。持ち主の裁定 t3-hub.59.3（裁定 id = t3-hub.59.3:20260928T0127Z-1・案 B）は開発中の app の上では click と入力もしてよく、board の origin の上では見せるだけにして click・入力・key の命令を歯で断るとした。t3-hub.59.5（裁定 id = t3-hub.59.5:20260928T0126Z-1）は窓を前に出さず知らせだけを出すとした。t3-hub.59.7（裁定 id = t3-hub.59.7:20260928T0249Z-1・案 B）は持ち主が閉じた窓は開き直さず、開くのは持ち主が tz の口か board の button で頼んだ時だけとした。逐語は各問いの notes に在る。計画の 3 節の席の決めは、tz stage open を環境変数 CLAUDECODE が 1 の時に断る（Claude Code の Bash の道具が子の process に渡す値・器の memo s2-07l.723 の席の役の環境変数が着地したらその判定に替える）とし、行 i-2 の起草の問いの決めの (1) で、端末で Chrome が動いていて頁の窓が無い時は tz stage open が頁の target を 1 つ作り（Target.createTarget を撃つのはこの口だけ）、(3) で同時の撃ちで窓が 2 つになる穴の錠をこの口に置くとした。席の決め（2026-09-28・i-4 と i-5 の起草の問い）: board の頁の上の断りは url の Board の holds で見る（port が自分の boardport で host がこの host のどの形でも自分の board・住所で開いても click を通さない・ほかの project の board の port は後の行）。錠は、ほかの口座が先に作れる共有の temp_dir の名に置かず、tunnel の socket の dir を置く口座ごとの 0700 の dir（tunnel の user_dir・socket_dir と同じ 0700 の作りと置き直し）の中に置き、その dir を断れば錠も名指して断る。器の答え S2-1 と S2-3 は、読む前に器の scribe2 validate --state-dir の rc 0 を確かめ、自分の anchor の state dir の host.toml だけを読むとした。条 N-3 により端末の値を上書きする旗は持たず、撃つ program の差し替えの旗だけを持つ。
      在りか（main 7d633b6 で確かめた）。境界の crate の src/main.rs（129 行）の fn main の match は字 surface serve・graph・hook stop・hook question-gate の 4 つの腕と、ほかを使い方の誤りにする腕を持ち、字 stage の腕は無い。src/stage/mod.rs は行 i-4 の後に pub mod cdp・json・launch・pipe・relay・terminal・tunnel・url・ws を持ち（i-4 の write-set）、cli.rs は無い。src/stage/tunnel.rs（231 行・行 i-2）の Tunnel の私の fn の get が /json/version と /json/list を撃ち、window（URL と may_open を受ける）は Chrome が答えなければ may_open の時だけ窓を 1 回起こし、動いている Chrome に頁が無ければ may_open によらず窓を足さずに Absent の 1 行を返す（その字は字 tz stage open で開く旨を含む）。/json/version の本文を外に渡す pub な口は無い。src/stage/ws.rs の file の頭の doc は、字を運ぶ Socket の send を使うのは cdp の Session だけとする。行 i-4 は relay の reach（端末に届かなければ席の目の Eyes と Session と落ちた旨の line）・relay の CHROME・url の board と line と origin と TAILNET・cdp の Session の url（Page.getNavigationHistory の今の URL）を置く（同じノートの前の行）。src/acct.rs は pub const GIT（字 git）と GIT_ARGS（字 config・--get・scribe2.statedir）を持つ。src/stage/terminal.rs は pub fn read_face（state dir の下の host.toml の字）と lookup（名が無ければ在る名を字 ・ でつないで名指す Err）を持つ。src/server/proc.rs の capture は標準入力を空に、標準エラーを捨て、rc 0 で timeout の内に返った標準出力だけを Some で返す。std の File の lock と try_lock（toolchain 1.98.1 で stable）は排他の file の錠で、File を閉じると放れる。main の workspace の rs の file に字 createTarget を持つのは、それを断る歯の tests/stcdp.rs と tests/stlaunch.rs の字だけ（grep で確かめた）。
      形（src/stage/cli.rs・新しい file）。pub const USAGE（字 usage: tz stage と命令の語の選び肢と --to と命令の旗と --repo と program の旗 5 つを並べた 1 行）・SEAT_ENV（字 CLAUDECODE）・VALIDATE_ARGS（字 validate と --state-dir）・TIMEOUT（10 秒・子の process と接続の待ち）・LOCK_WAIT（30 秒）・NEW_PAGE（字 Target.createTarget）と私の const FAIL（1）と POLL（50 ミリ秒）。pub enum Verb（derive は Debug・Clone・PartialEq・Eq）と pub struct Call（同じ derive・欄 verb の Verb・to の String・repo の PathBuf・ssh と scribe2 と git と tailnet と chrome の OsString）。pub fn one（命令の語の &str と旗の名と値の組の配列を受け Result の Command と Option の PathBuf の組と String）は、命令ごとに決まった旗だけを受け（navigate は --url・viewport は --width・--height・--scale・--mobile・click は --x・--y・type は --text・key は --key・scroll は --x・--y・--dy・wait は --ms・screenshot は --out・reload と dom と console は無し）、知らない命令は字 知らない命令 と語、ほかの旗は命令の語と字 は旗 と旗の名、2 度の旗は旗の名と字 が 2 度、欠けた旗は旗の名を含む Err にする。--x・--y・--width・--height・--scale は u32、--dy は i32、--ms は u64、--mobile は字 true か false で、外れれば旗の名を含む Err。navigate の --url は字 http:// か https:// で始まり空白と制御の字を持たない字だけで（javascript: と file: の URL で script と端末の file を運ばない）、外れれば字 --url を含む Err。screenshot は Command の Screenshot と --out の path を返す。私の fn pairs は旗の列を、字 --名 値 か 字 --名=値 の組にし、字 -- で始まらない字は字 旗でない字 と字、値の無い旗は旗と字 の値が無い、空の値は旗の名と字 の値が空 の Err にする。pub fn parse（tz stage の後の引数の &str の配列を受け Result の Call と String）は、最初の字を命令の語とし（無ければ字 命令が無い の Err）、残りの組のうち --to・--repo・--ssh・--scribe2・--git・--tailnet・--chrome を共通の旗として 1 度ずつ受け（2 度は Err）、--to が無ければ字 --to を含む Err、語が run と open なら共通の旗のほかの旗を語と字 は旗 と旗の名の Err にし、ほかは one に渡す。省いた --repo は字 .、program の既定は ssh・scribe2・acct の GIT・url の TAILNET・relay の CHROME。端末の値（display・profile-dir・port ほか）を上書きする旗は無い。pub fn lines（標準入力の字を受け Result の命令の組の Vec と String）は行ごとに前後の空白を除き、空の行を飛ばし、ほかの行を json の items で配列にして、どの要素も引用符で囲んだ字なら unquote して命令の語と旗の列にし、one と pairs に渡す（配列でない・字でない要素・空の配列・run と open の語・共通の旗は、行の番号と字 行目 を含む Err）。
      pub fn seat_refusal（Option の &OsStr を受け Option の String）は、値が字 1 の時だけ、字 tz stage open と、席から撃たない旨と、SEAT_ENV の字と、持ち主が素の端末か board の button で撃つ旨を含む Some を返す。pub fn on_board（&Command と頁の URL の &str と url の &Board を受け bool）は、命令が Click か Type か Key で、Board の holds が頁の URL に真の時だけ真（自分の boardport で host がこの host のどの形でも）（navigate・reload・scroll・viewport・wait・screenshot・dom・console は board の上でもしてよい・判断の記録 ADR-15 の決定 (7)）。pub fn lock（base の &Path と端末の名の &str と wait の Duration を受け Result の File と String・base は tunnel の user_dir の dir）は、名が空でなく字 . で始まらず英数字と - と _ と . だけの時に、base の下の file の名 tzst- と名と字 .lock を、作ってよく書き換えない形で mode 0600 で開き、try_lock を POLL ごとに wait まで撃ち、取れれば File を返し、取れなければ字 端末 と名と、ほかの tz stage open が窓を開いている旨を含む Err を返す（名の形の外れと開けない file も Err）。pub fn browser_resource（/json/version の本文の &str を受け Option の String）は鍵 webSocketDebuggerUrl の字が字 ws:// で始まり、その後の最初の斜線から後の path が字 /devtools/browser/ で始まる時だけ Some。私の fn unbase64 は字 = の詰めの付いた標準の base64 を byte に戻す。
      pub fn run（tz stage の後の引数を受け u8）の順。(a) parse の Err は標準エラーに字 tz stage と Err と USAGE を書いて 1 を返す。run の命令は標準入力を読み切って lines に通し、Err は同じく標準エラーに書いて 1 を返す（URL を組む前・端末に触れる前に断る）。(b) url の board（tailnet・git・repo・TIMEOUT）で board の URL を組み、Err は標準出力にその 1 行を書いて 1 を返す（URL を組めないので最後の行は無い）。(c) ここから後は、どの終わり方でも標準出力の最後の行に url の line を書く（Err はその前の 1 行）。open なら std の env の var_os の SEAT_ENV を seat_refusal に渡し、Some なら断る（器の検めも ssh も撃たない）。(d) git を字 -C・repo・GIT_ARGS で撃って自分の anchor の state dir を引き（無ければ repo と字 scribe2.statedir を含む Err）、器の scribe2 を VALIDATE_ARGS とその state dir で撃ち、rc 0 で返らなければ scribe2 の program と字 validate --state-dir と state dir と字 rc 0 を含む Err にして host の面を読まない。rc 0 なら terminal の read_face で host.toml を読み lookup で --to の行を引く（Err はそのまま）。(e) base は tunnel の user_dir に std の env の temp_dir を渡した口座ごとの 0700 の dir（tunnel の dir・席の目の profile の dir・錠の file の置き場・Err はそのまま断る）。open なら下の open の流れ。ほかは relay の reach（ssh・chrome・端末・base・board の URL・TIMEOUT）で、Terminal なら window に board の URL と may_open の偽を渡し（行 i-7 の着地までは窓を起こさない）、Absent ならその 1 行を Err にし、Page なら cdp の Session の open で繋ぐ。Eyes なら line を先に 1 行書き、その Session を使う（席の目の最初の頁は board の URL）。(f) 命令を順に撃ち、Click・Type・Key の前は Session の url で今の頁の URL を読み（読めなければその Err で断る・閉じる側）、on_board が真なら字 board の頁 と頁の URL と字 の上では と命令の語と字 を断る と ADR-15 の決定 (7) を名指す Err にして撃たない。撃った命令の出力は、Screenshot は応答の result の data を unbase64 で戻して --out の path に書き、字 済み screenshot と path と byte の数と字 byte の 1 行、Dom は応答の result の result の value を unquote した字と字 済み dom の行、Console は run の前から後に増えた event のうち method が Runtime.consoleAPICalled か Log.entryAdded の字をそのまま 1 行ずつと字 済み console の行、ほかは字 済み と命令の語の 1 行。どの命令の Err もその後の命令を撃たず、字 命令の語 とコロンの後に Err を置いた字にする。終わりに Session を閉じる。rc は Err が無ければ 0、在れば 1。
      open の流れ（持ち主が窓を開く）。lock（base・端末の名・LOCK_WAIT）を取り、錠を持ったまま、tunnel の socket_dir と Tunnel の open（届かなければその Err・席の目に落ちない・持ち主は最後の行の URL を開ける）で tunnel を張り、window に board の URL と may_open の真を渡す。Page で launched が真なら字 端末 と名と字 に表示面の窓を起こした、偽なら字 端末 と名と字 の表示面の窓は在る（起こさない）の 1 行。Absent（Chrome は動いているが頁の窓が無い）なら、Tunnel の version の本文の browser_resource の path に ws の Socket の connect で繋ぎ、cdp の message の id 1・NEW_PAGE・params の url に board の URL の JSON の字を 1 度だけ送り、id 1 の応答を待って（誤りの応答は Err）閉じ、window に may_open の偽を渡し直し、Page なら字 端末 と名と字 の表示面の Chrome に頁の窓を 1 つ開いた の 1 行、Absent ならその 1 行を Err にする（作り直さない）。錠は File の drop で放れる。窓を前に出す・動かす語（bringToFront・activateTarget・setWindowBounds・json/activate）と json/new は持たない。Target.createTarget は持ち主の頼みの時だけ、動いている Chrome に頁が無い時に 1 度だけ撃ち、判断の記録 ADR-15 の決定 (6) の撃たない新しい窓の命令は席の命令の語彙（cdp の steps）の話で、この口は持ち主の tz stage open（席の中の撃ちは断る）だけが通るので持ち主の裁定 t3-hub.59.7 の頼んだ時は開くにあたる（計画の 3 節の席の決め）。
