  - n: 3
    type: prose
    title: 行 i-4 — 届かない端末と席の目
    body: |
      なぜ。要件 FR16 は、ssh で届かない端末には board の URL を渡すだけにし、席は server 側の headless Chrome を自分の目にするとし、受入 AC13 は偽の ssh と偽の Chrome で、届かない端末で返る URL の行と席の目の落ちる先を見るとする（fixture は端末の行 2 つの tests/fixtures/stage/terminals.toml）。判断の記録 ADR-15 の決定 (5) は ADR-5 の決定 (3) を置き換え、ssh で届かない端末には tailnet の中の board の URL を渡すだけにし、席はその端末の browser を操作せず、URL の host の部分は実行の時に組み版管理に載る file に書かず、server 側の headless Chrome は席の目（screenshot・DOM・console）として残し、画面を配信する窓は作らないとする。着地した行 i-1・i-1b・i-3・i-2 の後も、端末に届かない時の落ちる先と、board の URL を組む部品は境界の crate に無い（下の在りか）。この行は計画 surface-plan（v0.25）の 9 節の計画だけの行 i-4 のとおりそれを置く。tz の口の配線と守り（行 i-5）・表示先の設定（行 i-7）・知らせ（行 i-10）はこの行の部品を使う後の行。
      拠る裁定と技術の決め。持ち主の裁定 t3-hub.59.4（裁定 id = t3-hub.59.4:20260928T0123Z-1）は、ssh の届かない端末（スマホ）は URL を渡すだけにし席はその browser を操作せず、配信の窓は次の版の候補とした。t3-hub.53.1（裁定 id = user 2026-09-27T22:18Z）は board の URL を anchor の追跡されない git config の tsuzuri.boardport の port で組むとし、この行は同じ鍵を読む。器の答え S2-5 はスマホを層 A の [[device]] の外とした。逐語は各問いの notes に在る。技術の決め（席の決め・notes）。席の目の Chrome の口は --remote-debugging-pipe にする。計画の字が起草で比べるとした 127.0.0.1 の TCP の port（--remote-debugging-port）は、この server のほかの口座の process からも繋げて席の目の Chrome を操れる（見積りの T3 と同じ理由）うえ、cdp の Session は unix socket にしか繋がないので、TCP を採っても運び手は足す。pipe は子の fd 3 と fd 4 だけで話し、口座の外から届かない。std の Command は fd 3 と fd 4 を子に渡せず unsafe の pre_exec も使わないので、PATH の sh の -c の 1 行で子の標準入出力を fd 3 と fd 4 に写してから Chrome を exec する。pipe の上では browser の段に繋がるので、最初の頁の target に Target.attachToTarget の flatten の形で付き、その後の message の頭に鍵 sessionId を足す。host の名は tailnet の道具の status の JSON の Self の DNSName（名で引き、住所を使わない・末の点を除いて小文字）から、port は git の -C anchor config --get tsuzuri.boardport から実行の時に読み、どちらも code と版管理に載る file に書かない（行 D-4）。席の決め（2026-09-28・i-4 と i-5 の起草の問い Q1）: 自分の board とみなすのは、port が自分の boardport で、host がこの host のどの形（tailnet の名・その短い名・Self の TailscaleIPs の住所・127.0.0.1・localhost）でもよい頁とする（住所で開いた自分の board でも click を通さない）。ほかの project の board と account board の port はこの行の範囲の外で、席が account の電文の board の port から読む後の行を計画に足す。
      在りか（main 7d633b6 で確かめた）。境界の crate の src/stage/mod.rs は 11 行で、doc の 4 行と空の行と pub mod cdp・json・launch・terminal・tunnel・ws の 6 行（この順）だけを持ち、src/stage の下に relay.rs・pipe.rs・url.rs は無い。src/stage/cdp.rs（291 行・行 i-3）の pub struct Session の欄は socket（ws の Socket）・next・events・timeout の 4 つで、pub fn は steps・message と Session の open・run・events・close の 6 つ（歯 stage_cdp_no_script_port がこの 6 つの名の列を字で固める）で、Session の私の fn の call・await_event・read は socket の send と wait と recv を撃つ。file の頭の doc は、撃てるのは steps の列だけで session は行 i-2 が張る 0700 の dir の中の unix socket に繋ぐとする。src/stage/ws.rs（318 行）は pub const MAX_MESSAGE（usize・67108864）と Socket の send・recv・close と pub(crate) の wait を持つ。src/stage/json.rs は pub fn escape・member・items・unquote を持つ。src/stage/tunnel.rs（231 行・行 i-2）は pub fn socket_dir（base の下に名 tzst- と process の id と字 - と時刻の nanosecond の dir を 0700 で作る）と pub struct Tunnel の open（ssh の program の &OsStr・&Terminal・dir の &Path・timeout を受け、撃てない・ssh が先に終わる・timeout を越える、はどれも端末の名を含む Err で、子を止めて dir を消す・doc はどの Err も端末に届かなかった印で行 i-4 が落ちる先へ行くとする）と method の socket と window を持つ。src/stage/launch.rs は pub fn tunnel_argv（字 -N から ssh の宛先までの 13 語）を持つ。src/server/proc.rs は pub const KILL（字 kill）と pub fn capture（program・args・cwd・timeout を受け、rc 0 で timeout の内に返った標準出力だけを Some で返す）と pub fn stop_with（子の process group へ kill -KILL を送って子を待つ）を持つ。src/acct.rs は pub const BOARD_ARGS（字 config・--get・tsuzuri.boardport）と pub fn board_port（前後の空白を除いた字が 10 進の数字だけで 0 でない u16 の時だけ Some）を持ち、lib.rs の pub mod acct で crate の中から使える。main の workspace の rs の file に字 tailscale・remote-debugging-pipe・Target.getTargets・Target.attachToTarget・Page.getNavigationHistory は無い（grep で確かめた）。fixture の term-a と term-b はどちらも ssh の宛先を持ち（届くかどうかは宣言の欄に無い）、届くかどうかは偽の ssh の rc で決める。
      形（src/stage/pipe.rs・新しい file）。pub struct Pipe（欄は外に見せない・子の標準入力の ChildStdin・読みの thread からの受け手・session の id の Option の String）。関連関数 new（ChildStdin と ChildStdout を受け Pipe）は読みの thread を起こし、thread は子の標準出力を BufReader で読み、ws の MAX_MESSAGE に 1 を足した byte までの read_until で NUL までを 1 つの message とし、末の NUL を除いた UTF-8 の字を渡す（0 byte で終われば渡さずに終わり、NUL で終わらないか上限を越えた字と UTF-8 でない字と読みの誤りは Err を 1 つ渡して終わる）。method の join（&mut self と session の id の &str）は session の id を置く。send（&mut self と字の &str を受け Result の unit と String）は、session の id が在り字が字 { で始まれば、字 { の直後に鍵 sessionId と json の escape の id の組とコンマを足し、末に NUL を付けて書いて flush する（書けなければ字 pipe へ書く を含む Err）。recv（&mut self と timeout の Duration を受け Result の Option の String と String）は受け手の recv_timeout で、字は Some、時間切れは字 時間切れ の Err、thread が終わって受け手が空なら None。close（self を受け Result の unit と String）は標準入力を閉じて Ok（Chrome は pipe の終わりで終わる）。
      形（src/stage/cdp.rs の直し）。私の enum Link（変種 Ws は ws の Socket・Pipe は pipe の Pipe）と、その私の fn の send（Ws は Socket の send・Pipe は Pipe の send）・recv（残りの Duration を受け、Ws は Socket の wait の後に recv・Pipe は Pipe の recv）・close を足し、Session の欄 socket を欄 link（Link）に替え、open は Link の Ws で包み、call と read と close は link を撃つ（ws の上の振る舞いは変えない）。pub const HISTORY（&str・字 Page.getNavigationHistory・script を撃たない決まった method）。Session の関連関数 attach（pipe の Pipe と timeout の Duration を受け Session）は Link の Pipe で包み、next を 1 にする（付くのは relay の Eyes の open）。method の url（&mut self を受け Result の String と String）は HISTORY を params の空の object で撃ち、応答の result の currentIndex を usize に読み、result の entries の配列のその番の要素の url を unquote した字を返す（どれか読めなければ字 Page.getNavigationHistory を含む Err）。行 i-5 の board の頁の上の入力の断りがこれを使う。file の頭の doc に行 i-4 の 2 行（2 つ目の運び手の attach と、頁の今の URL の読みの url と決まった 1 つの method の HISTORY）を足す。命令の語彙 Command と steps と message は変えない。
