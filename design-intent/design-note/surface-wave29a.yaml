      - prompt_of の引数の契約の本文を、本文と goal の組にする。契約の審査の腕は design_hole の字を contract_prompt に渡す（cap の照合も穴の字もこの字・contract_prompt は替えない）。diff の審査の腕は goal を使わない。
      - dispatch は state の字と契約 file の goal（Contract の欄 goal）を渡す。
      - 歯の区間の helper prompt_of は goal に空を渡す（着地済みの歯の字と断言は替えない）。module の doc に 1 段を足す。
      - 雛形 lens-contract.txt は替えない。lens の版の 1 行（--print-version）は雛形の hash を持つので版の字も替わらず、行の審査の記録の使い回し（器の review_ref.rs）は前の判定をそのまま写す（判定の材料は替わらないので写してよい）。
      - 比べの決め（実の材料で測った）。比べは byte で、前後の空白も改行も寄せない。624 便で、byte の比べ・前後の空白を剥がす比べ・空白の並びを 1 つに寄せる比べの 3 つとも同じ 622 便が同じ字になり、寄せて増える便は 0（寄せる理由が無く、寄せると違いを隠す側に倒れる）。goal の字は 624 便とも改行を持たない。同じでない 2 便: 1 つは md の契約表の行（docs/design/vessel-keys.md#v-field-schema・goal は行の title の 368 byte・節の本文は 11,048 byte）。もう 1 つは便 t3-hub.21-20260927T112128Z（行 contracts/surface-board.toml#g-gaps）で、受付の後に base の節に 1 文（204 byte・問いの頁の歯の file を write-set に入れる文）が足されて goal と違い、審査役がその違いを literal-mismatch の FAIL で捕まえた。違う周を本文のまま渡すのは、この違いが審査の材料だから。
