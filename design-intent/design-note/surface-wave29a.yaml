      - 歯: cwarg.rs の use の列（cs-gh-read の後の字）から ASK_DROP を外して BASE_ENV・keep_only・window_env を足し、歯 cwarg_matches_fixture の ask_drop の照らしをbase_env と talk_keep の照らしに替え、その次に歯 cwarg_window_env_is_closed を足す。cwlch.rs は偽の claude が受けた環境の全部（/proc の environ）を記録する 1 行を足し、席の番兵と助けの関数を歯 cwlch_talk_argv_and_env の前に足し、その歯の -e の期待を 7 つと包みに替え、その次に歯 cwlch_talk_env_runs_closed を、歯 cwlch_ask_child_env_and_lines の次に歯 cwlch_ask_env_closed を足す。歯が落ちた時に席の環境の値を出さないよう、環境は名を先に比べる。module の doc は替えない（同じ file を書くほかの行の差と当たりを分ける）。

      ほかの行との当たり（一時の index の git apply --cached）。同じ 5 file を書いた行 cs-cred-links は 24d43a19 で着地済みで、この差はその後の main に切った（cs-cred-links の着地の前の main 03d28f85 の上でも、cs-gh-read の後に cs-cred-links とこの差をどちらの順で当てても当たった）。cs-gh-read の差の無い木には当たらない（cwarg.rs の use の行）。所見 cw1-3 の status line と Remote Control の差（行は未だ無い）は、cs-cred-links の着地で fixture の 4 行目が当たらなくなった（この行に依らない）。その差の fixture を除く file は cs-gh-read の後でこの差とどちらの順でも当たり、fixture の hunk はこの差の hunk と行が離れている（main 03d28f85 の上では fixture を含めて両順で当たった）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 番目の項は verify の 1 行目、2 番目と 3 番目の項は 3 行目（中核の歯の束 teeth3 の歯 cwarg_・在りかは cwarg.rs）、4 番目から 6 番目の項は 4 行目（境の歯の束 teeth5 の歯 cwlch_・在りかは cwlch.rs）、最後の 7 番目の項は 3 行目と 4 行目（着地済みの cwarg_ の 9 本と cwlch_ の 7 本）で測る。verify の 2 行目（clippy・中核と境の 2 つの crate）は done の項に載せない守り。29a の第 0.14 版から、xtask の check は器の共通 verify が gate の各段で verify の行の前に撃つので verify に書かない。欄 done-teeth は書かない。

      入口の赤。歯の file と fixture を試作の字にし、2 つの launch.rs を cs-gh-read の後の字に戻して、歯が呼ぶ新しい名だけを今の振る舞いの字で足した木（BASE_ENV は空・window_env は今の話す窓の -e の 4 つの選び・keep_only は空の字）で、verify の 3 行目は rc 100（cwarg_matches_fixture・cwarg_window_env_is_closed の 2 本が落ち、残りの 9 本は通る）、4 行目は rc 100（cwlch_talk_argv_and_env・cwlch_talk_env_runs_closed・cwlch_ask_env_closed の 3 本が落ち、残りの 7 本は通る）。

      試作と噛み。写し drafts/w177a で書く file は write-set の中で閉じる（5 file）。verify の 2 行目から最後の行までは rc 0。根の xtask の check も rc 0。噛みは句ごとに変異を当て、名指しの歯を 1 本の範囲で撃った。振る舞いの変異は環境の印で切り替える 1 つの木に、定数の字の変異は 1 つずつ組んだ木に当て、15 の句（閉じた列の名だけ・列の順・窓の id と私用の temp は中核の値・席に無い名は置かない・包みは環境を空にする・包みは tmux の置く 5 つを残す・包みは名で置き直す形・問う窓は環境を空にする・問う窓に閉じた列を置く・話す窓の -e は閉じた列・話す窓は env -S で包む・包みは渡した名を置き直す・席の TERM は渡さない・問う窓に tmux の名を置かない・定数と fixture の字）に 17 の変異を当てて、名指した歯の全部が rc 100（組み立ての失敗の rc 101 は 0）。印なしの対照と使わない印の対照は rc 0。話す窓の実の tmux の振る舞い（global の環境が -e の後も届くこと・env -S の包みで閉じた列と tmux の置く名だけが残ること・-e の TERM が tmux の TERM に勝つこと）は独立の socket の tmux 3.6b の模型で確かめた。

