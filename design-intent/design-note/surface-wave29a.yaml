    title: 行 cs-root-edits — 相談の窓の書きの道具を読む根から断る（判断の記録 ADR-29 の決定 (7)(イ)・検証役 qv180 の指摘 M2）
    body: |
      在りか。差の file docs/design/patch/cs-root-edits.patch は、main 24d43a19（行 cs-cred-links の着地の後・code と fixture の字は試作の土台の写しの commit 3e1f65fe と byte で同じ）に試作の commit 06ac94ac（写し drafts/w170a の branch edits）を載せた木との差（3 file・5,324 byte・+63 −3）。差は行 cs-cred-links の差の後でだけ当たり、書く file の 3 つ（中核の consult/launch.rs・歯の束 teeth3 の cwarg.rs・fixture）がその行と重なるので、depends は着地した cs-cred-links。拠りは判断の記録 ADR-29 の決定 (7)(イ)（書けるのは作業場の下だけで、読む根は囲いの書きの断りにも置く）と要件 FR19 の shall（相談の窓は repo と台帳を書かない）と、検証役 qv180 の指摘 M2（memo t3-hub.86 の囲いの土台の穴）。決定の字の内の直しで、持ち主の問いは要らない。

      なぜ。窓の書きの道具（Edit・Write）を止めているのは、許可を聞かない形（dontAsk）と、作業場の編集だけの許しの 2 つで、囲いは殻の命令にだけ掛かり、守りの hook は Bash でない道具の行き先を見ない。--restricted は --add-dir の dir を file の道具の働く dir に数え（claude --help の字）、Claude Code の文書（code.claude.com の permission-modes の頁）は、許可の形 acceptEdits の自動の許しは働く dir と足した dir に効くと書き、許可の形は端末の Shift+Tab と Remote Control の画面で替えられると書く。持ち主は窓 cw1 で Remote Control を繋いだので、この道は開いている。

      確かめ（係 w176a・試しの dir）。drafts の下に偽の repo と偽の state dir（fleet・pipe・accounts）と作業場を置き、起動の口と同じ旗（--restricted・--tools の閉じた列・--add-dir の 3 つ・--settings）と同じ形の設定で、claude -p（版 2.1.289）を作業場で撃ち、作業場と偽の repo と偽の fleet へ Write させた。許可の形 acceptEdits では 3 つとも聞かずに書け、dontAsk では偽の repo と偽の fleet の 2 つが断られた（作業場は書けた）。設定の deny に読む根の 3 つの Edit(/<根>/**) を足して acceptEdits で撃つと、偽の repo と偽の fleet への Write と、偽の repo の file への Edit が、許可の設定の断りで止まった（作業場は書けた）。本物の repo と器の置き場は使っていない。

      形。 - 中核: 私用の fn denied_reads の頭に、材料の読む根 roots（--add-dir と囲いの denyWrite と同じ列・在る根だけ）の各々の Edit(/<根>/**) を roots の順に置き、fn の doc に 2 行を足す。settings の deny と検めの audit_permissions はこの列を使うので、その 2 か所の字は替えない（同じ file を書くほかの行の差と当たりを分ける）。Claude Code の文書（permissions の頁）は、Edit の規則は file を書く道具の全部に効き、字 Write と字 NotebookEdit の path の規則は照らさず起動で警告すると書き、許可の形の頁は deny の規則はどの許可の形でも止めると書く。よって書きの断りは字 Edit だけで置く。
      - fixture: deny の頭（Read(//S/accounts/**) の前）に Edit(//R/**)・Edit(//S/fleet/**)・Edit(//S/pipe/**) の 1 行を足す。
      - 歯: cwarg.rs に歯 cwarg_denies_edits_under_read_roots と助けの fn strings_of を歯 cwarg_hides_account_dirs_and_credential_reads の次に足し、歯 cwarg_audit_refuses_each_missing_key の deny の数を 19、歯 cwarg_hides_account_dirs_and_credential_reads の実体の無い材料の deny の数を 17 にする。module の doc と use の列は替えない。

      ほかの行との当たり。置き済みの行 cs-gh-read と、起草中の行 cs-env-closed（係 w177a の試作 85daefe2）と cs-read-roots（係 w182a の試作 27d79bba）は、同じ 3 file を書く。土台の木（写しの commit 3e1f65fe）の一時の index で、4 つの差（cs-env-closed は自分の土台の cs-gh-read の後）をどの順で当てても全部当たり、同じ木になる（git apply --cached・6 つの順）。この行の差の逆の当たりは、ほかの差のどれを後に当てても rc 0。4 つを当てた木で clippy（中核と境）と歯 cwarg_ の 14 本と cwlch_ の 10 本が rc 0（係 w176a）。cs-env-closed と cs-read-roots の差が置く前に替われば照らし直す。

      範囲の外。Remote Control を断る鍵（disableRemoteControl）と session どうしの言付けの門（crossSessionInbound・検証役 qv180 の指摘 M3・持ち主は席と窓の言付けを求めた）・作業場と読む根の外の path（--restricted が file の道具を働く dir に閉じる）・殻の命令の書き（囲いの denyWrite が既に止める）・束の手引き（bundle/brief.md）の字・開いている話す窓への効き（起こし直すまで前の設定のまま）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

