差の file の形・depends は無い〔write-set の交差が無い〕）を足した。 第 0.11 版（2026-10-05）は、判断の記録 ADR-44 の決定 (1) の G3 と ADR-45 の門 H1 の前の器の行 v-atk-names（契約の審査の対応の表で、欄 done-teeth の検証行の番号の歯 @k の項に審査役が書いた歯の名を、k 本目の検証行が選ぶ名なら宣言の歯の内に数える・行 v-notes-head の便の契約の審査の 1 度目の倒れの直し・比べと試作と噛みは係 w157a・差の file の形・器を書く便は同時に 1 本まで）を足した。 第 0.12 版（2026-10-05）は、判断の記録 ADR-45 の門 H6 と H7 の器の行 v-ci-last（着地の終端が、CI の待ちが最後に読んだ答えで分けて読み直さず、push の後の remote の追跡の ref が着地の sha の子孫で着地の sha でない周はその commit の CI で照合する・器の memo t3-hub.74.49.6 の道 1 と道 2・列の 1 周が終端だけの撃ち直しを子で起こす形は要らないと決めて行にしない・起草と試作と噛みは係 w159a・差の file の形・depends は v-red-close・器を書く便は同時に 1 本まで）を足した。 第 0.13 版（2026-10-05）は、持ち主の裁定（問い t3-hub.80.10〜80.13・束 batch:20261004T2037Z-1）の後のグラフの土台の 2 便目の 4 行（k-commit-count・c-memo-touch・v-row-basis・f-row-basis）と行の節（18〜23 節）を足し、承認の列に 4 行目（ADR-47 の承認と 3 つの問いの裁定・逐語は台帳の問いの notes の字）を足し、3 節の ADR-47 の字を発効に合わせた（試作と噛みは係 w146a・差の file の形・差を切った main は dd950b03・欄 done-teeth は書かない）。 第 0.14 版（2026-10-05）は、未着地の行 10 本（v-closed-runs・v-red-close・v-review-dedup・v-scope-empty・v-atk-names・v-ci-last・k-commit-count・c-memo-touch・v-row-basis・f-row-basis）の verify から末の行 cargo run -q -p xtask -- check を外し、節の done と verify の対応の段と試作の段の字を合わせた（器の共通 verify と同じ行で、gate が同じ木で 2 度撃っていた・done と差の file は替えない・走っている行 v-drafts-env と着地済みの行は替えない）。 第 0.15 版（2026-10-05）は、判断の記録 ADR-50（持ち主の裁定 t3-hub.74.50.2.1:20261004T2037Z-1・案 A）の器の行 v-pin（便の受付で最後に入れた器の binary を同じ版の時だけ便の dir に hard link で留め、同じ便の実装役と審査役と --run の子は留めを撃ち、新しい便は PATH の器で起こす・depends は書く file の重なる未着地の v-closed-runs と v-atk-names）（器の memo t3-hub.74.50.2・起草は係 w149a・試作と噛みは係 w162a・差の file の形・器を書く便は同時に 1 本まで）を足した。 第 0.16 版（2026-10-05）は、器の memo t3-hub.74.49.10（席が昇格と判じた・判断の記録 ADR-45 の門 H6）の器の行 v-scratch-held（器の in-file の歯の一時 dir の助け 4 本〔pipe の fixture の scratch・account と consumers の scratch・live の place〕が作った dir を歯の thread の終わりに消す・depends は書く file の重なる v-pin・起草と試作と噛みは係 w164a・差の file の形・器を書く便は同時に 1 本まで）を足した。 第 0.17 版（2026-10-05）は、判断の記録 ADR-45 の門 H6 の器の行 v-adopt（局面の出力が、発端の trailer を持つ後の commit の本文の追認の札 Scribe2-Adopts で、発端の trailer も器の便の trailer も持たない commit に発端を結ぶ・器の memo t3-hub.74.50.4・持ち主の問いの推奨 E の形・比べと試作と噛みは係 w158a・検証役 qv161 の攻め・差の file の形・depends は書く file の重なる v-red-close・器を書く便は同時に 1 本まで・裁定 t3-hub.80.31:20261004T2239Z-1）を足した。 第 0.18 版（2026-10-05）は、判断の記録 ADR-44 の決定 (3)・束 B05 の器の行 v-self-match（host の見張りに種類 self-match と rules 行 host_guard.self_match を足し、型が撃った shell 自身の command 行に当たる pgrep と pkill の -f の待ちと止めと型の字の決まらない呼びを断る・持ち主の裁定 t3-hub.80.6:20261004T2037Z-1（案 A）・depends は書く file の重なる未着地の v-scope-empty・起草は係 w148a と w152a・試作と噛みは係 w166a・差の file の形）を足した。 第 0.19 版（2026-10-05）は、判断の記録 ADR-49（持ち主の裁定 t3-hub.80.22:20261004T2037Z-1・案 A）の器の行 v-run-write（pipe show の値の無い旗 --write が、便 1 本の装置への書きを費用の event の source runner の語と run dir の 3 つの record の撃った行から段ごとと和の 1 行で出し、event log の形は替えない・depends は無い〔write-set の交差が無い〕・起草は係 w154a・試作と噛みは係 w168a・差の file の形・器を書く便は同時に 1 本まで）を足した。 第 0.20 版（2026-10-05）は、判断の記録 ADR-51（持ち主の裁定 t3-hub.80.7:20261004T2037Z-1・案 A）の決定 (4) の最初の 2 行 f-ctx-build（folio の新しい module context が設計ノートの行 1 本の近い仕様の塊を組む純関数・依存を足さない）と k-ctx-cli（tz の口 context・depends は f-ctx-build）〔ほかの行と write-set の交差は無い〕（係 w150a の 3.0 の順と深さ・試作と噛みと測りは係 w171a・差の file の形・器の側は替えない）を足した。 第 0.21 版（2026-10-05）は、判断の記録 ADR-29 の決定 (7)(ウ) の行 cs-cred-claude（相談の窓の囲いの資格の file の列に Claude の口座の資格の file を足し、読む道具の断りにも同じ file の Read を置く・memo t3-hub.86 の候補 1・決定の字を替えない直しで持ち主の問いは要らない・depends は空・起草と試作と噛みは係 w170a・差の file の形）を足した。 第 0.22 版（2026-10-05）は、判断の記録 ADR-53（持ち主の裁定 t3-hub.84.1・案 A・ADR-29 の決定 (7)(エ) の部分の置き換え）の行 cs-gh-read（相談の窓の殻の命令のネットワークの許しの閉じた列に GitHub の読むだけの配り元 2 つ raw.githubusercontent.com と codeload.github.com を足し、ほかの GitHub の名と広い形を検めが断ることを歯で測る・depends は同じ file を書く cs-cred-claude・起草と試作と噛みは係 w172a・差の file の形）を足した。 第 0.23 版（2026-10-05）は、判断の記録 ADR-29 の決定 (7)(ウ) の行 cs-cred-links（state dir の accounts の symlink の先を起動の時に解いて囲いと読む道具の両方から隠し、資格の file の閉じた列の全部を読む道具の断りにも置く・memo t3-hub.86 の行 cs-cred-claude の試作で見つけた穴の 2 つ・決定の字を替えない直しで持ち主の問いは要らない・depends は同じ file を書いて着地した cs-cred-claude・同じ file を書く置き済みの cs-gh-read は ADR-53 の決定 (4) でこの行の着地まで留め置くので depends に置かない・起草と試作と噛みは係 w170a・main 03d28f85 への当て直しと床は係 w176a・差の file の形）を足した。 第 0.24 版（2026-10-05）は、判断の記録 ADR-29 の決定 (7)(イ) の行 cs-root-edits（読む道具の断りの頭に、起動の口が --add-dir で渡す読む根の各々への書きの道具の断り Edit(/<根>/**) を置き、検めが欠けを断る・許可の形を acceptEdits に替えると読む根へ聞かずに書けた穴〔検証役 qv180 の指摘 M2・係 w176a が試しの dir で確かめた〕を塞ぐ・決定の字の内で持ち主の問いは要らない・depends は同じ file を書いて着地した cs-cred-links・同じ file を書く cs-gh-read と cs-env-closed と cs-read-roots とはどの順でも当たる・起草と試作と噛みと床は係 w176a・差の file の形）を足した。 第 0.25 版（2026-10-05）は、判断の記録 ADR-29 の決定 (5) の閉じた列の行 cs-env-closed（相談の窓の問う窓の子は席の環境を空にして閉じた列〔TALK_ENV の 4 つと HOME・SHELL・LANG〕だけを持ち、話す窓は tmux の -e で同じ列を渡して claude を env -S で包み、tmux の server の環境を継がず tmux の置く端末の 5 つだけを残す・席が決定 (5) の席の環境を継ぐを口座を継ぐと読み、閉じた列を両方の形の窓に当てると決めた〔決定と要件の字は替えない・持ち主の問いは要らない〕・memo t3-hub.86 の候補 3・depends は同じ cwarg.rs の use の行を書く cs-gh-read・調べは係 w173a・起草と試作と噛みは係 w177a・差の file の形）を足した。 第 0.26 版（2026-10-05）は、判断の記録 ADR-54（持ち主の裁定 t3-hub.86.1・案 A・ADR-29 の決定 (7) の部分の置き換え）の行 cs-read-roots（相談の窓の起動の口の設定に作業場と読む根の外の読みを断る鍵を真で置き、囲いの読みの戻しを道具の置き場の閉じた列と解いた tz だけにし、検めが外れた形と囲いの file の仕切りを外す鍵を断り、束の手引きに読める範囲と込み入った殻の命令の撃ち方の 2 行を足す・memo t3-hub.84 の候補 1 を載せた・depends は同じ file を書いて着地した cs-cred-links・置き済みの cs-gh-read と cs-root-edits とはどの順でも当たる・起草と試作と噛みと床は係 w182a・差の file の形）を足した。

sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      判断の記録 ADR-44（目指す所と 5 段）の段 0（すぐ・小さい物）・段 1（土台の決め）・段 2（合流の残りと土台）の行を置く。ADR-45 の群 H の門（グラフの正確さ・commit の節点・一生の測りほか）を測れる形にする行と、ADR-46 の code のグラフの土台の行を含む。
      行ごとの節は、行を足す適用が節の末に足す。1 本の契約表は 32 行まで（規則の行 R-32）。
      器の共通 verify（.vessel.toml の common-verify・cargo run -q -p xtask -- check）は、gate の各段（終わりの門・gate と列の候補・着地の確かめ）で verify の行の前に撃たれ、runner にも共通 verify の節で渡る。行の verify には同じ行を書かない（第 0.14 版で未着地の行 10 本から外した・同じ木で 2 度撃つ重ねは便 t3-hub.80.19 で 1 段に約 5 分と約 0.5〜0.6 GB の書き）。
  - n: 2
    type: contract-table
    title: 契約表
    rows:
      - id: c-g3-bindline
        title: 導出グラフの台帳の読みと外の台帳の読みが、器の結びの口が問いの notes に足す 5 欄の裁定の行（区切りは空白と縦棒と空白）も、条件を満たす時だけ裁定の定型行として読む（判断の記録 ADR-7 決定 (4)・ADR-44 の段 0・ADR-45 の門 H3・差の file）
        req: ["FR2", "FR3"]
        section: "4"
        write-set: ["crates/tsuzuri-core/src/graph/build.rs", "+crates/tsuzuri-core/tests/g3bl.rs", "=crates/tsuzuri-core/tests/teeth1/g3g7.rs", "=crates/tsuzuri-core/tests/teeth2/graph.rs"]
