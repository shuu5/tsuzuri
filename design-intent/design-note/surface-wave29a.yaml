      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 2〜6 番目の項は verify の 3 行目（新しい歯の file crates/tsuzuri-core/tests/g3bl.rs の 5 本・項の順と歯の順は同じ）、7 番目の項は 4〜6 行目（着地済みの歯・在りかは build.rs の歯の区間と teeth1/g3g7.rs と teeth2/graph.rs）、最後の 8 番目の項は 7 行目で測る。verify の 1 行目と 2 行目は命令の rc で測る守り。

      構造の連鎖（木 7f767bd2 で grep）。typed_lines の呼び手は add_typed と outside と lib の歯の 3 か所で、全部に bead の id を渡した。in_ruling_grammar は pub の関数のまま読むだけ。

      実の記録での測り。写しの tz で、器の repo を外の台帳として渡した tz graph --check（--project）は違反 0 で、不変条件の 3 番は合格（残りは 7 番の文法の外の id の裁定 56 と 9 番の機構なしの まだ分からない）。係 w145a の写しの測り（g3sim.py）でも 240 から 0。

