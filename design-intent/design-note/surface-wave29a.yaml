  - n: 21
    type: prose
    title: 行 v-row-basis — 器の契約表の任意の欄 basis
    body: |
      在りか。差の file docs/design/patch/v-row-basis.patch は、木 b512fea4 と、その上に試作を載せた木 8e62f7de との差（6 file・+53 −11・12,282 byte）。前の版の差（器の下の 5 file）に、根の欄の写し contracts/field-schema/schema.toml の basis の塊を足した。着地済みの行 t-teeth-col の歯 dtcol_copy_matches_the_vessel_schema が、写しの頭の 1 行の後ろと器の生成物 scribe2/contracts/schema.toml を byte で比べるため（器の生成物だけを替えた前の版の差を 4 本とも当てた木 0b32a65c で、xtask check がこの歯で rc 100）。前の 2 行とは file が重ならず、main dd950b03 の上にも単独で当たる。

      なぜ。判断の記録 ADR-44 の段 2（契約の行から条と判断の記録への辺の型）。持ち主の裁定（問い t3-hub.80.13・案 A）は、行の根拠を器の契約表の任意の欄 basis で持つ形。設計の道具は契約表の行の欄を根の欄の写し（正本は器の欄の列 FIELDS）だけで照らし、写しに無い欄を断る。器は欄を読んで運ぶだけで照らさない（id の実在は設計の道具の床が数える・行 f-row-basis）。
      本文の名指しを型付きの辺にする案は採らない。本文の名指しは不変条件の 9 番（名指した id は欄にも在る）が既に数えており、辺にすると同じ名指しを 2 度数える。

      形。器の src/pipe/table.rs の欄の列 FIELDS の末に basis（任意・字の配列）を足し、ContractRow に欄 basis（字の列）を足した。src/pipe/table/parse.rs の typed が list_of で読む。行の構築の 2 か所（src/pipe/contract.rs と src/pipe/table/check.rs の歯の見本）に空の basis を足した。欄の生成物 scribe2/contracts/schema.toml と根の欄の写し contracts/field-schema/schema.toml の code-facts の塊の次に、同じ basis の塊（name・need は optional・shape は list）を足した（写しの頭の 1 行の注は替えない）。src/pipe/table.rs の歯の区間の着地済みの歯 3 本の欄の数（20 を 21・任意 13 を 14）と宣言順の一覧（末に basis）と doc の字を合わせた。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。1 番目の項は verify の 1 行目。2 番目の項は 3 行目（器の lib の歯 vbasis_ の 1 本・在りかは src/pipe/table/parse.rs の歯の区間）。3 番目の項は 4 行目（字が替わる着地済みの器の lib の歯 3 本・在りかは src/pipe/table.rs の歯の区間）。4 番目の項は 5 行目（着地済みの器の e2e の歯・在りかは e2e の pipe/contracts.rs）。最後の 5 番目の項は 6 行目（着地済みの根の歯 dtcol_・在りかは crates/tsuzuri-boundary/tests/dtcol.rs）。2 行目の器の clippy は命令の rc で測る守りで、done に載せない。第 0.14 版から、xtask の check は器の共通 verify（.vessel.toml の common-verify）が gate の各段で verify の行の前に撃つので verify に書かない。

      構造の連鎖（木 8e62f7de で grep）。ContractRow の構築は typed の 1 か所と歯の見本 2 か所で、全部に欄を足した。欄の数と宣言順を断言する着地済みの器の歯は src/pipe/table.rs の 3 本で全部を直した（器の nextest の全部を印なしで撃って見つけた）。欄の生成物の写しを byte で比べる根の歯は dtcol.rs の 1 本（4 本を当てた木で xtask check を撃って見つけた）。欄の写しを読む根の歯（行 f-row-basis の rowbasis.rs と folio2 の tz の歯の 7 file）は、写しを丸ごと見本の置き場へ写すか basis の塊を除いてから足すので、塊の有無で替わらない。欄の列 FIELDS の読み手（器の contracts schema・契約表の検査の欄の照らし）は列をそのまま回すので替えない。器の file の行の上限（1500・幅で数える）: src/pipe/table/check.rs は 1455 行、src/pipe/table.rs は 1274 行（growth の欄）。

      入口の赤。main dd950b03 には名に vbasis_ を持つ歯が無いので verify の 3 行目は --no-tests=fail で落ちる。この差の着地済みの器の lib の歯 3 本の字（欄 21）は、main の src（欄 20）で撃つと欄の数で落ちる。

      試作と噛み。書く file は write-set の中で閉じる（6 file）。4 本を全部当てた木 50e9af00 で verify の 1〜6 行目と xtask check が rc 0（xtask check は入れ子の器の build と nextest 4089 本と clippy と器の check を含む）。噛みは 4 つの変異（行の basis を読まない・欄の列から basis を外す・器の生成物の basis の塊を外す・根の欄の写しの basis の塊を外す）が全部 rc 100 で名指した歯が落ち、対照は rc 0（木 50e9af00 で撃った）。

      範囲の外。器の binary の入れ替え（席の手・23 節）。器が basis の id を照らすこと（照らすのは設計の道具の床）。生成する契約 file への写し。
  - n: 22
    type: prose
    title: 行 f-row-basis — 設計の道具の辺 basis と床と導出
    body: |
      在りか。差の file docs/design/patch/f-row-basis.patch は、木 8e62f7de と、その上に試作を載せた木 50e9af00 との差（7 file・+203 −9・17,377 byte）。folio2/ と境界の新しい歯の file だけを書き、前の 3 行とは file が重ならず、main dd950b03 の上にも単独で当たる。

      なぜ。判断の記録 ADR-44 の段 2 と持ち主の裁定（問い t3-hub.80.13・案 A）。設計ノートの契約表の行の欄 basis を、行から根拠の id への辺にし、導出グラフに届ける。辺の型は設計文書の型の basis（判断の記録の根拠の欄と同じ型・閉じた一覧は替えない）。

      形。
      - 索引（folio2/crates/folio/src/graph.rs）。辺の欄の表 EDGE_FIELDS の design-note の列を req・depends・basis にし、notes() が行の欄 basis を EDGE_TYPES の 9 番目（basis）の辺にする。辺の欄は要約値の外なので行の要約値は替わらない。
      - 床（src/note.rs）。check_contract_rows が欄 basis の id を参照 id の母集団（条・規範文・規則行・判断の記録・要件の全部の id）で解く（resolve_ids）。欄が器の欄の写しに無い周は今のとおり契約表の欄が器の導出 file に無いで断る。
      - 導出は今の形のまま欄の写しの順で欄を運ぶ（差なし）。
      - 索引の欄の決まりの区間（folio2/design-intent/graph.yaml の生成区間）と凍結の anchor（tests/fixtures/schema/graph-region.txt）と要約値の写し（node-digest.py の辺の欄の一覧）と歯 f95_ の定数（区間の byte 7379 と sha256）を合わせた。
      - 歯 crates/tsuzuri-boundary/tests/rowbasis.rs は folio2 の凍結の土台 floor_base の写しに git の 1 commit を置き、根の欄の写しから basis の塊を除いた後に、塊を末に足した file（足さない file）で tz を撃つ。写しが塊を持つ木（行 v-row-basis の後）でも持たない木でも、見本は同じ字になる。見本の行 a の欄 basis は流れの形の [ADR-4, P-10]（無い id の見本は [ADR-4, ADR-99]）。
      - 字。歯 rowbasis_floor_resolves_basis_ids の違反の 1 行は [note] design-note/example.yaml: §6 の行 a の basis[1]: id「ADR-99」が実在しない。歯 rowbasis_floor_needs_the_field_in_the_vessel_schema の違反の 1 行は [note] design-note/example.yaml: §6 の行 a: 契約表の欄「basis」が器の導出 file に無い。歯 rowbasis_derive_carries_basis_to_the_table が比べる導出の写しの行は basis = [ADR-4, P-10] の字の値を二重引用符で囲んだ 1 行（空白は = の前後とカンマの後ろだけ）。索引の行は id とタブと先の id とタブと型の字（例 example#a とタブと ADR-4 とタブと basis）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。1 番目の項は verify の 1 行目。2〜5 番目の項は 3 行目（新しい歯の file rowbasis.rs の 4 本・項の順と歯の順は同じ）。最後の 6 番目の項は 4 行目（定数の字が替わる着地済みの歯 f95_ の 3 本・在りかは folio2/crates/folio/tests/tz4/schema_docs.rs）。2 行目の clippy は命令の rc で測る守りで、done に載せない。第 0.14 版から、xtask の check は器の共通 verify（.vessel.toml の common-verify）が gate の各段で verify の行の前に撃つので verify に書かない。

      構造の連鎖（木 50e9af00 で grep）。EDGE_FIELDS の読み手は索引の辺の組みと欄の決まりの区間の生成の 2 か所。resolve_ids の呼び手に 1 か所を足した。folio2 の file の行の上限: src/graph.rs は 1225 行（growth の欄）・src/note.rs は 1201 行。

      入口の赤。木 8e62f7de には歯の file rowbasis.rs が無いので verify の 3 行目は --no-tests=fail で落ちる。

      試作と噛み。書く file は write-set の中で閉じる（7 file）。4 本を全部当てた木 50e9af00 で verify の 1〜5 行目が rc 0。噛みは 10 の変異（索引が basis の辺を組まない・辺の型を adrs に・辺の欄の一覧から basis を外す・床が basis を要件だけの母集団で解く・床が basis を解かない・凍結の anchor を元の字へ・床の欄の照らしが basis を写しの外でも通す・導出が basis を運ばない・欄の決まりの区間を元の字へ・区間の byte の定数を前の値へ）が全部 rc 100 で名指した歯が落ち（最後の変異は f95_ の 3 本を全部落とした）、対照は rc 0（木 50e9af00 で撃った）。

      範囲の外。設計ノートの行への basis の書き足し（席の手・23 節）。board の近傍に辺を出す画面の直し。
