    body: |
      在りか。差の file docs/design/patch/cs-read-roots.patch は、main 68d3bf98 に行 cs-cred-links の差を当てた木（写しの commit 3b957e62）に試作の commit 27d79bba（写し drafts/w182a）を載せた木との差（3 file・12,289 byte・+152 −5）で、cs-cred-links の着地の後の main 24d43a19 にも当たる（書く 3 file は 3b957e62 と byte で同じ）。書く file は中核の consult/launch.rs と歯の束 teeth3 の cwarg.rs と fixture の 3 つ（境の歯の束 teeth5 の cwlch.rs と cwopn.rs は verify が撃つ置き場だけ）。設定の permissions の塊と fixture の deny の塊の字が cs-cred-links の字を文脈に持つので、depends は cs-cred-links（24d43a19 で着地）。拠りは判断の記録 ADR-54（持ち主の裁定 t3-hub.86.1・案 A）と要件 FR19 と受入 AC19 の字（要件書の版上げで同じ commit に置く）。

      なぜ。相談の窓の殻の命令（囲いの中の Bash の道具とその子）は、今、home の下のほぼ全部（ほかの project・Claude Code の会話の記録・資格の file の閉じた列の外の資格らしき file）を読める（memo t3-hub.86 の調べ・係 w173a の囲いの模型）。窓は web の道具でどの URL へも字を出せる。ADR-54 は、Claude Code の鍵 permissions.blockReadsOutsideWorkingDirectories（v2.1.257 から。読む道具は作業場と読む根の外を全部の許可の形で断り、囲いが有効なら殻の命令にも /home・/root・/mnt・/media・/srv ほかを断り、作業場と --add-dir の読む根と session の一時の置き場と git の設定と Claude Code が要る置き場の一部だけを戻す）を真で置き、home の下の道具の置き場の閉じた列と解いた tz を囲いの読みの戻し sandbox.filesystem.allowRead に置くと決めた。囲いの file の仕切りを外す鍵 sandbox.filesystem.disabled を置くと読みの断りが殻の命令に届かない（Claude Code の文書）ので、検めが断る。解いた tz を戻すのは、ほかの project の窓では tz が読む根の外（tsuzuri の写しの組み）に在り、所見の口を撃てなくなるから。

      形。 - 中核: launch.rs の CREDENTIALS の次（FORBIDDEN の前）に、道具の置き場の閉じた列 TOOL_READS（[&str; 7]・字は ~/.cargo/bin・~/.rustup・~/.local/bin/uv・~/.local/bin/uvx・~/.local/bin/claude・~/.local/share/uv/python・~/.local/share/claude の順）を doc の 2 行と共に足す。置かない鍵の列 ABSENT を [&str; 5] にして末に /sandbox/filesystem/disabled を足し、doc の 1 行に仕切りを外す鍵の訳を足す。私用の fn allowed_reads（TOOL_READS の順に材料の tz を足した列）を denied_reads の次に足す。settings は permissions の deny の次に鍵 blockReadsOutsideWorkingDirectories を true で、sandbox の filesystem の denyWrite の次に allowRead を allowed_reads で置く。私用の fn audit_reads（鍵が真でなければ欠けの名 /permissions/blockReadsOutsideWorkingDirectories を、allowRead が allowed_reads の JSON と字も順も同じでなければ欠けの名 /sandbox/filesystem/allowRead を 1 つずつ足す）を audit_permissions の次に足し、audit は audit_permissions の後に呼ぶ。束の手引き brief の字に 2 行を足す（作業場の行の次に読める範囲の行・work/ の行の次に込み入った殻の命令の行・字は差の file と done の 3 番目の項）。
      - fixture: launch-argv.yaml の settings の permissions に鍵を足し、sandbox の filesystem を 4 行の塊にして allowRead（7 つの字と置き字 /T）を足す（+6 −2）。
      - 歯: cwarg.rs の歯 cwarg_tmp_and_version の次（歯 cwarg_brief_text の前）に、型 ReadEdit と定数 BLOCK と ALLOW_READ と助けの fn allow_read と read_edits（外れた形の 12）と、歯 cwarg_blocks_reads_outside_roots と cwarg_brief_names_reads_and_scripts を足す（字は差の file）。use の列と module の doc は替えない（同じ file を書く並ぶ行の差と当たりを分ける）。歯 cwarg_matches_fixture は字を替えない。

      ほかの行との当たり。同じ file を書く置き済みの行 cs-gh-read（ADR-53 で留め置き）と cs-root-edits（書きの道具を読む根から断る）の差とこの差は、cs-cred-links の着地の後の木の上で、どの順で先に当てても後の差が当たり、当てた後の木は同じ（git apply --cached・係 w182a が確かめた）。問う窓の環境を閉じた列にする並ぶ行（係 w177a の試作）の差とも、cs-gh-read の差の後で、どの順でも当たる。4 つの差を重ねた木で clippy と歯 cwarg_・cwlch_・cwopn_ が緑。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 番目の項は verify の 1 行目、2 番目から 4 番目の項は 3 行目（中核の歯の束 teeth3 の歯 cwarg_・在りかは cwarg.rs）、最後の 5 番目の項は 3 行目（着地済みの cwarg_ の 8 本）と 4 行目と 5 行目（境の歯の束 teeth5 の着地済みの歯 cwlch_ と cwopn_・在りかは cwlch.rs と cwopn.rs・字を替えないので write-set に置き場だけの = で置いた・cwopn_ は束の brief.md を中核の brief と比べる）で測る。verify の 2 行目（clippy）は done の項に載せない守り。29a の第 0.14 版から、xtask の check は器の共通 verify が gate の各段で verify の行の前に撃つので verify に書かない。欄 done-teeth は書かない。

      入口の赤。歯の file と fixture だけを試作の字にした木（launch.rs は行 cs-cred-links の差を当てた字）で、verify の 3 行目は rc 100（cwarg_blocks_reads_outside_roots・cwarg_brief_names_reads_and_scripts・cwarg_matches_fixture の 3 本が落ち、残りの 8 本は通る）。

      試作と噛み。写し drafts/w182a で書く file は write-set の中で閉じる（3 file）。verify の 2 行目から最後の行までは rc 0。根の xtask の check（根の歯 3,323 本・入れ子の scribe2 は差が入力に触れないので省かれた）も rc 0。噛みは句ごとに変異を当て、名指しの歯を 1 本の範囲で撃った。変異は環境の印で切り替える 1 つの木に当て（列の定数の変異は列を読む fn の中で替えた）、23 の句（鍵を真で持つ・話す窓と問う窓の両方・allowRead を持つ・列の 7 つの字・file ごと・この順・7 つだけ・その後に解いた tz を 1 つ・材料の tz で末が替わる・鍵の欠けと偽を断る・字の true を断る・allowRead の欠けと外れを断る・順の替えと 2 度を断る・欠けを断る・足しを断る・欠けの名は 1 つだけ・検めが断る・file の仕切りを外す鍵を断る・読める範囲の 1 行・殻の命令の 1 行・ちょうど 1 度・行の字・1 行の全部として）に 24 の変異を当てて全部 rc 100（組み立ての失敗の rc 101 は 0）。設定と列の変異と tz を足さない変異の 9 つは fixture の歯 cwarg_matches_fixture も rc 100。印なしの対照と使わない印の対照は rc 0。

      範囲の外。問う窓が席から継ぐ環境変数（memo t3-hub.86 の候補の 3 つ目・別の行）・資格の覆いの列（替えない）・窓が道具の大きな結果の file を読み返せない事（訳は口座の置き場の読みの断り・ADR-54 の consequences）・着地の後の窓の確かめ（ADR-54 の決定 (4)・席の手）・当座の手順の指示文 docs/consult/brief.md（窓は読まない）。
