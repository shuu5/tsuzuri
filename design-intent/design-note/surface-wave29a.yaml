    type: prose
    title: 行 v-notes-head — 起票の門の notes の頭の時刻（判断の記録 ADR-44 の決定 (3)・束 B03）
    body: |
      在りか。差の file docs/design/patch/v-notes-head.patch は、main 21cb093d に試作の commit を載せた木 3f160b87（写し drafts/w152a の branch w152a2）との差（3 file・17,784 byte・+189 −10・main 0ee9c0da の上で切った差と byte で同じ）。器の行 3 本の最初の行で、差は main の上で切った。

      なぜ。判断の記録 ADR-44 の決定 (3)（ほかの project でも起きる再発防止を器の構造へ上げる）・束 B03（係 w143a の仕分けの 2 番）。台帳の notes の頭の時刻（例 [席 YYYY-MM-DDTHH:MMZ]）は記帳の事実で、照合の材料になる。席は見込みの時刻（10 分の形 HH:MxZ を含む）と日本時間に Z を付けた字を書き、記憶の記録だけで 7 度と 1 度直した。席の会話の記録では、頭に Z の時刻を持つ note の書き 124 件のうち 43 件が書いた時より先の時刻だった（09-30〜10-03・先の量は 60 秒未満 10・5 分未満 18・5 分以上 15・係 w148a の実測）。誤りは全部が先の向きで、過去の向きの誤りは記録に無い。器の起票の門の notes の段は notes の本文を読む門で、本文の頭の時刻を器の時計と比べられる。器の設計文書 ledger-form.md §18 は凍ったまま（判断の記録 ADR-36 の決定 (7)）で、この節が新しい振る舞いを書く。 §18 の notes の段は、裁定の行と読めない書きに続く 3 つ目の断りを持つ。

      形。 - 読み: notes.rs に head_time と token_at を足す。頭の行は本文の最初の空でない行の頭の空白を除いた字で、字 [ で始まり字 ] を持つ時だけ読む。札は [ と最初の ] の間。時刻の字は札の中で最初に現れる字か、札に無ければ ] の直後の空白を除いた頭の字で、形は 5 つ（YYYY-MM-DDTHH:MMZ・秒の形 HH:MM:SSZ・小数秒の形 HH:MM:SS と字 . と数字 1 字以上と Z・10 分の形 HH:MxZ〔M は数字 1 字・x は字 x〕・時の形 HH:xxZ）。下の端は分の形が秒 00、10 分の形が分 M0 と秒 00、時の形が分 00 と秒 00、秒の形がその秒（小数は捨てる）で、日付と時刻は器の fleet::epoch_of に秒までの形で渡す（暦の外は時刻の字と読まない）。Z の無い字・日付と時刻の間が空白の字・日本時間の印・日付だけの字は読まない（ほかの席の台帳の頭の大半がこの形で、時間帯の分からない字を比べない・台帳 12 本の 4,000 余りの頭）。
      - 判定: judge に引数 now（UNIX 秒）を足し、裁定の行 → 読めない書き → 頭の時刻の順で、読めた本文のどれかの頭の下の端が now より大きい周に、語 notes-head-future（定数 HEAD_FUTURE）で断る。閾値を持たない（下の端が今より後だけ）ので rules 行を足さない。
      - 断りの字（既存の形の理由の段）: notes の頭の時刻 <時刻の字> が今の UTC <器の format_utc の字> より先 — 頭の時刻は書く直前に date -u +%Y-%m-%dT%H:%MZ の値で書く（見込みの時刻や日本時間の字に Z を付けない）。
      - 時計: ledger_guard.rs の decide が notes::judge に crate::seat::state::now_secs() を渡す（1 行）。module の doc の notes の段の文に頭の時刻を足す。
      - 経路の字を date の形にしたのは、門が本文を書き換えると通す周に 1 byte も書かない約束（LedgerDecision::Allow）を破り、器の hook に道具の入力を書き換える出力が無いから。
      - notes.rs の歯の区間に固定の時計 NOW（2026-10-05T00:10:30Z の秒）を置き、着地済みの歯の helper の judge の呼びに渡す（着地済みの歯の断言の字は替えない）。
      - e2e の hook/guards.rs の NOTES_NEXT を 3 つにする（語 notes-head-future の案内は字 date -u +%Y-%m-%dT%H:%MZ）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 番目の項は verify の 1 行目（差の hunk が全部木に在る）、2〜4 番目の項は 3 行目（器の lib の歯 vnhead_ の 3 本・在りかは hook/ledger_guard/notes.rs の歯の区間）、最後の 5 番目の項は 4 行目（器の e2e の歯 vnhead_ の 1 本・在りかは e2e の hook/guards.rs）で測る。verify の 2 行目（器の clippy）と 5 行目（xtask の check）は done の項に載せない守り（歯の名で測る項でないので、審査の対応の表で歯の無い項になる・第 0.6 版の便の契約の審査）。欄 done-teeth は書かない（入れ子の器の歯は器が選ぶ行を解けないので、書くなら項ごとに撃つ verify の行の番号になる。その形では、審査役が done の項の字が名指す歯の名を対応の表に書き、器がそれを宣言の歯の外の項目に数えて審査を INCONCLUSIVE に倒す・第 0.5 版の行 v-notes-head の便 t3-hub.80.19-20261004T182144Z の契約の審査）。

      構造の連鎖（木 0ee9c0da で grep）。notes::judge の呼び手は ledger_guard.rs の decide の 1 か所。decide の呼び手は hook/mod.rs の pre_tool_use と歯 1 本（host_guard_tests.rs の hook_notes_ruling_decide_reads_the_three_mouths・字は替えない）。NOTES_NEXT の読み手は e2e の assert_notes_deny の 1 か所。器の trigger.rs が数える notes の [再発] と [keep] の行（札の直後の時刻を持つ形）は、先の時刻の書きだけを断られる。器の file の行の上限（1500・幅で数える）: 幅 120 で数えて notes.rs は 229 行から 392 行・ledger_guard.rs は 904 行から 905 行。

      入口の赤。lib の歯は src の notes.rs の歯の区間に在るので、main の木では verify の 3 行目の filter に当たる歯が 0 本で rc 4（--no-tests=fail）。e2e の歯の file hook/guards.rs だけを試作の字にした main の木で、verify の 4 行目が rc 100（頭が 2999 年の note を通し、断りの rc 2 の断言で落ちる）。

      試作と噛み。写し drafts/w152a で書く file は write-set の中で閉じる。verify の 2 行目から最後の前の行までは rc 0（器の clippy・器の lib の歯 vnhead_ の 3 本・器の e2e の歯 vnhead_ の 1 本）。根の xtask の check は rc 0（3 行を全部当てた木 2cb62054〔main 0ee9c0da の上〕で根の歯 3281 本・入れ子の器の歯 4089 本・器の clippy・器の xtask check まで。main 21cb093d に積み直した木 065b9ce3 で入れ子の 4 段〔build・歯 4092 本・clippy・器の xtask check〕も rc 0）。噛みは句ごとに 1 つの変異を当てた木で名指しの歯を 1 本の範囲で撃ち、8 つの句（先だけを断る・10 分の形の下の端・Z の付いた字だけ・頭の行だけ・札の直後も読む・経路の字・段の順・時計を渡す）に 11 の変異を当てて全部 rc 100。書き戻した後の対照は rc 0。

      範囲の外。過去の向きの時刻（古すぎる頭）の断り・日本時間の印の字の換算・同じ本文の 2 度目の書きの断り（冪等の鍵）・席の手の時刻の置き字と sed の埋め（続けてよい・埋めた字は通る）・要件書の FR1081 の字の足し（席が決める）・器の設計文書の書き換え。
  - n: 10
    type: prose
    title: 行 v-accept-ptr — preflight の --placed が bead の acceptance の pointer を照らす（判断の記録 ADR-44 の決定 (3)・束 B04）
    body: |
      在りか。差の file docs/design/patch/v-accept-ptr.patch は、main 21cb093d に試作の commit を載せた木 143da301（写し drafts/w152a の branch w152a2）との差（5 file・20,283 byte・+201 −10・main 0ee9c0da の上で切った差と byte で同じ）。差は前の行 v-notes-head の差を当てた木の上で切った（器を書く便は同時に 1 本まで・判断の記録 ADR-33 の決定 (12)・depends の鎖）。

      なぜ。判断の記録 ADR-44 の決定 (3)・束 B04（係 w143a の仕分けの 4 番）。器の dispatch は bead の acceptance の design = の行（字 design と空白と = と空白）だけを契約の pointer と読み、本文の字は読まない。席は便の bead を acceptance の行なしで置き、dispatch が 1 本も起こさなかった（2 度・9 本で約 40 分）。器の pipe preflight は --design を引数で受けて bead の acceptance を読まないので、置いた後の照らしで気づけなかった。この行は preflight に、置いた bead の acceptance の照らしを足す。受付の judge は替えない（dispatch は acceptance から --design を作るので受付では食い違わず、dispatch の列と受付の判定を 2 本にしない）。器の設計文書 contract-source.md §21 は凍ったまま（判断の記録 ADR-36 の決定 (7)）で、この節が新しい振る舞いを書く。 §21 の preflight は、値の無い flag --placed と、acceptance の 1 行と preflight だけの断りの名 acceptance-pointer を持つ。
      照らしを flag の周だけにした理由: 着地済みの歯 pipe_intake_ruling_ の 2 本（引用の無い周と ruling-check の無い周）は preflight が台帳を 1 度も読まないことを断言し、ほかの 4 本は行を指す bead を持たない偽の台帳で末尾 ok を断言する。いつも照らす形はこの 6 本の断言を替える。また席は置く前の行を、在るほかの bead の id を借りて preflight で照らす（借りた bead はほかの行を指す）ので、いつも照らす形は置く前の照らしに毎回 1 件の断りを出し、席が断りを読み捨てる決まりを要る。flag の周だけにすると、置いた後の照らしだけが台帳を読む。

      形。 - 読み手: pipe/dispatch/candidates.rs の pointer_of を pub(in crate::pipe) にし（字は替えない）、pipe/dispatch.rs に pub(in crate::pipe) use の 1 行を足す（candidates は private の子 module）。form.rs の pointer_text は design = の後の空白を問わず dispatch と読みが違うので使わない。
      - flag: preflight.rs に定数 PLACED（字 --placed）を pub(super) で置き、pipe/cli/args.rs の ALLOWED_PREFLIGHT の末に Allowed::switch(PLACED) を足す（未知の引数の断りの外にする）。読みは値なし flag の 1 本の読み手 present。
      - 判定: preflight.rs に閉じた enum Accepted（Matched・Refused と理由の字・Unmeasured と語）と純関数 accepted を足す。台帳の issue の列から id が --bead と同じ 1 件を引き、無ければ Refused（bead <id> が台帳に無い — 行に置いた bead の id を --bead に渡す）。acceptance を pointer_of に掛けて無ければ Refused（bead <id> の acceptance に design = の行が無い — bdw update <id> --acceptance と一重引用符で囲んだ design = <--design の字> で足す〔dispatch は acceptance の design = の行だけを契約の pointer と読む〕）。置き場か行 id が --design と違えば Refused（bead <id> の acceptance は design = <pointer> で --design <字> と違う — 行に合う bead を渡すか acceptance を直す）。同じなら Matched。
      - 台帳の読み: acceptance_of が rules の待ち上限（timeout_of）と read_ledger（--bd か既定の client・cwd は --repo）で読み、行の無い周と読めない周は Unmeasured（語 ledger）。preflight の本体を crate::seat::ledger::one_read の区間で包み（本体は関数 checked へ移す）、裁定 id の判定の台帳の読みと同じ 1 回の出力を分ける。
      - 描き: 純関数 acceptance_lines が照らしを（事実の行・断りの行）の対にする。render に引数 placed を足し、事実の行は done-teeth= の行の次、断りの行は judge の断りの行の後に 1 行で置き、末尾の件数と rc に数える（judge が broken の周は broken のまま）。材料を読めない周と行を引けない周（tailed の早い断り）は照らしを撃たない。module の doc の stdout の行の列に 2 つの行を足す。
      - e2e の pipe/intake.rs: 既存の偽の台帳の helper（ruling_bd と ruling_rules と ruling_repo）を借り、3 件の偽の台帳と --placed を渡す helper と歯 1 本を足す。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 番目の項は verify の 1 行目（差の hunk が全部木に在る）、2 と 3 番目の項は 3 行目（器の lib の歯 vaccpt_ の 2 本・在りかは pipe/cli/preflight.rs の歯の区間）、4 番目の項は 4 行目（器の e2e の歯 vaccpt_ の 1 本・在りかは e2e の pipe/intake.rs）、最後の 5 番目の項は 5 行目と 6 行目（着地済みの器の e2e の歯 pipe_preflight_ の 4 本と pipe_intake_ruling_ の 11 本・在りかは同じ file・断言の字は替えない）で測る。verify の 2 行目（器の clippy）と 7 行目（xtask の check）は done の項に載せない守り（歯の名で測る項でないので、審査の対応の表で歯の無い項になる・第 0.6 版の便の契約の審査）。欄 done-teeth は書かない（入れ子の器の歯は器が選ぶ行を解けないので、書くなら項ごとに撃つ verify の行の番号になる。その形では、審査役が done の項の字が名指す歯の名を対応の表に書き、器がそれを宣言の歯の外の項目に数えて審査を INCONCLUSIVE に倒す・第 0.5 版の行 v-notes-head の便 t3-hub.80.19-20261004T182144Z の契約の審査）。

