差の file の形・depends は無い〔write-set の交差が無い〕）を足した。 第 0.11 版（2026-10-05）は、判断の記録 ADR-44 の決定 (1) の G3 と ADR-45 の門 H1 の前の器の行 v-atk-names（契約の審査の対応の表で、欄 done-teeth の検証行の番号の歯 @k の項に審査役が書いた歯の名を、k 本目の検証行が選ぶ名なら宣言の歯の内に数える・行 v-notes-head の便の契約の審査の 1 度目の倒れの直し・比べと試作と噛みは係 w157a・差の file の形・器を書く便は同時に 1 本まで）を足した。 第 0.12 版（2026-10-05）は、判断の記録 ADR-45 の門 H6 と H7 の器の行 v-ci-last（着地の終端が、CI の待ちが最後に読んだ答えで分けて読み直さず、push の後の remote の追跡の ref が着地の sha の子孫で着地の sha でない周はその commit の CI で照合する・器の memo t3-hub.74.49.6 の道 1 と道 2・列の 1 周が終端だけの撃ち直しを子で起こす形は要らないと決めて行にしない・起草と試作と噛みは係 w159a・差の file の形・depends は v-red-close・器を書く便は同時に 1 本まで）を足した。 第 0.13 版（2026-10-05）は、持ち主の裁定（問い t3-hub.80.10〜80.13・束 batch:20261004T2037Z-1）の後のグラフの土台の 2 便目の 4 行（k-commit-count・c-memo-touch・v-row-basis・f-row-basis）と行の節（18〜23 節）を足し、承認の列に 4 行目（ADR-47 の承認と 3 つの問いの裁定・逐語は台帳の問いの notes の字）を足し、3 節の ADR-47 の字を発効に合わせた（試作と噛みは係 w146a・差の file の形・差を切った main は dd950b03・欄 done-teeth は書かない）。

