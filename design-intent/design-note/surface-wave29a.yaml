    title: 持ち主の裁定と席の手
    body: |
      持ち主の裁定（束 batch:20261004T2037Z-1・4 問とも推奨の案・承認の列の 4 行目・逐語は台帳の問いの notes）。
      - 問い t3-hub.80.10: 判断の記録 ADR-47（名前の形と名前空間）は案 a で発効（ADR-47 の承認の欄）。
      - 問い t3-hub.80.11: ADR-45 の門 H4 の「閉じた契約」は、着地で閉じた契約（閉じた理由の頭が landed か着地）と読む。ADR-45 の本文は替えず、測りの口（ADR-36 の決定 (11)・ADR-45 の決定 (3)）の notes に読みを記帳する。行 k-commit-count の床の値はこの読み。
      - 問い t3-hub.80.12: memo と epic の touches の欠けは、まず touches の無い open の memo と epic の数を測って見せるだけにし、2 周の実測の後に起票の門にするかを決める。
      - 問い t3-hub.80.13: 契約の行の根拠は器の契約表の任意の欄 basis で持つ（行 v-row-basis と f-row-basis の形）。

      席の手（行の着地の後）。
      - 行 v-row-basis と f-row-basis の両方の着地の後に、器の binary を入れ替え（器が欄 basis を読む）、tz の pin を入れ替え（床が basis を解く）、その後に生きたノートの行に basis を書き足す（行ごとの根拠の判断の記録と条）。どちらかの入れ替えの前に書くと、器の表の読みか床が断る。
      - 行 c-memo-touch の着地の後に、open の memo と epic の metadata に touches を書き足し、touches の無い open の memo と epic の数を測り始める（書き足しの前の数と、2 周の数を記帳する）。
      - 行 k-commit-count の着地の後に、測りの口に床の値（着地の commit の無い着地した契約の数と id）を記帳する。

      後の行。touches の無い open の memo と epic の数を床の値に出す行（問い t3-hub.80.12 の案 A が言う数えを機械にする・それまでは席の手の数え）。ADR-44 の段 4 の file・定義・歯の節点（電文の名 file・def・tooth）と辺（wrote・implements・tests）・名前空間の規則の関数（ADR-47 の決定 (6)）・古い pointer の引き（ADR-47 の決定 (7)・取り込みの段 3 の後）。
  - n: 24
    type: prose
    title: 行 v-pin — 便ごとに器の binary を留め、同じ便の子は留めを撃つ（判断の記録 ADR-50 の決定 (1)(2)(5)・器の memo t3-hub.74.50.2 の候補 1 の前半）
    body: |
      在りか。差の file docs/design/patch/v-pin.patch は、main dd950b03 にノート 29a の未着地の器の行 6 本（v-drafts-env・v-closed-runs・v-red-close・v-review-dedup・v-scope-empty・v-atk-names）の差の file をこの順に当てた木 d44c4e01 に試作の commit を載せた木 93cb095f（写し drafts/w162a の branch w162a-pin）との差（12 file・40,911 byte・+469 −14）。main はその後 4a20678f へ進み、scribe2/ の下の差は v-drafts-env の着地だけ（その差の file を当てた木と同じ木）。差は素の main（4a20678f）・未着地の 5 本の各段の後・行 v-ci-last と v-row-basis と置く前の v-commit-line の差の後のどの木にも当たり、この差の後にも 8 本の差は全部当たる（係が一時の index で撃った）。書く file が file の名で重なる行は v-drafts-env（pipe/mod.rs・pipe/sweep.rs）・v-closed-runs（pipe/dispatch.rs）・v-atk-names（pipe/review.rs）の 3 本で、v-drafts-env は着地したので depends は残りの 2 本。拠りは 判断の記録 ADR-50（持ち主の裁定 t3-hub.74.50.2.1:20261004T2037Z-1・束 batch:20261004T2037Z-1・案 A）。

      なぜ。器の口 vessel update の入れ替えの門 busy は、host のどこかで器の process が 1 本でも生きていれば断る。便が途切れない周は 0 本の時が来ないので、着地した器の直しは、席が新しい便の起こしを hold で止め走る便の終わりを待つまで効かない（10-04 は着地 14:15Z から入れ替え 15:25Z まで 70 分・その間の便は古い器で審査された）。門そのものは要る。走る便の途中で PATH の器が替わると、古い版の driver が新しい版の実装役と審査役を起こし、1 本の便の中で版が混ざる。そこで版を便ごとに留め、同じ便の子は留めた版を撃つ。PATH の器はいつ替えても走る便に効かず、新しい便から新しい版で走る。門をこの留めに合わせて緩めるのは次の行 v-pin-swap。

      形（要約・字は差の file）。
      - 新しい module の pipe/pin.rs が留めの全部を持つ。留めの path は置き場の pipe の下の便 id の dir の下の bin の下の器の名（名は器の名の定数から導く・憲法 C2.2）。
      - 置き（関数 link と note）。pipe run の受付の後（cli/run.rs の run_all・driver の札の後・審査の前）に 1 回。event log の最後の InstallRecorded の path の file を hard link で置き（中身は写さない＝SSD の書き 0・tsuzuri の置き場と PATH の器は同じ file system）、置いた file を --version で撃った 1 行目が自分の版の行と字で同じ周だけ残す。照らすのは置いた後の留めなので、照らしの間に PATH の器が入れ替わっても別の版を留めない。置かない周は bin の dir を残さず理由の語（no-install・unreadable・cross-device・other-version）を stderr の 1 行に出し、便は今までどおり PATH の器で走る。器は env も HOME も /proc の自分の実行 file も読まないので、自分の実行 file は InstallRecorded と版の行の照らしで知る。
      - 版の行。器の core の name.rs に関数 version_line（器の名・core の package の版・BUILD_COMMIT の 1 行）を足し、境界の --version と doctor の 2 行目（関数 render_version）はこの 1 本を返す。今の字は替わらない（core と境界の package の版はどちらも 0.1.0）。留めの照らしと --version が同じ 1 本を読むので、版の行の書き方がずれて留めが黙って外れることが無い。
      - 読み 3 つ。関数 head は実装役の命令（spawn.rs）と審査役の命令（gate.rs の gate の lens と review.rs の審査の lens・穴を埋めた後）の頭の器の名を留めの path に替える。起こしの 1 本 spawn_self は argv に --run と便 id を持つ子（起こし直しの resume と着地後の検出の land）を関数 program（留めが在れば留め）で起こす。自分の呼ばれ方の関数 myself は関数 launcher を通り、呼ばれ方が留めの形なら器の名に戻す（留めた便の起こし直しで起きた driver が、列の 1 周で新しい便や memo の審査や索引の組み立てを古い版で起こさない）。
      - 片付け。器の掃除の便の木の段（sweep.rs の sweep_runs）が live でない便の bin の dir を消し、sweep の行に pins= と消した数を足す（消した数が 0 の周は足さない）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 番目の項は verify の 1 行目、2〜4 番目の項は 3 行目（器の lib の歯 vpin_ の 3 本・在りかは pipe/pin.rs の歯の区間）、5〜8 番目の項は 4 行目（器の e2e の歯 vpin_ の 4 本・在りかは e2e の pipe/pin.rs）、9 番目の項は 5 行目（器の境界の bin の歯 version_line_ の 2 本・在りかは境界の main.rs）、10 番目の項は 6 行目（在りかは pipe/dispatch.rs）、最後の 11 番目の項は 7 行目（器の e2e の歯 pipe_sweep_ の 21 本・在りかは e2e の pipe/stop.rs で write-set に置き場だけの = で置いた）で測る。verify の 2 行目（器の clippy）は done の項に載せない守り。第 0.14 版から、xtask の check は器の共通 verify（.vessel.toml の common-verify）が gate の各段で verify の行の前に撃つので verify に書かない。欄 done-teeth は書かない。

      構造の連鎖（木 93cb095f で grep）。spawn_self の呼び手は 5 つで、argv に --run を持つのは起こし直し（dispatch/revive.rs の revive_of が組む resume）と着地後の検出（land/finish.rs が組む land）の 2 つ。列の新しい便（dispatch.rs の start の run）・memo の審査（dispatch/memo_triage.rs の dispatch memo-lens）・索引の組み立て（dispatch/candidates.rs の index build）は --run を持たず、myself で起きる。myself のほかの呼び手（pipe/cli.rs の局面の書き直しの子・seat/cli.rs・hook/group.rs）も便に結ばれず、launcher の戻しだけを受ける。実装役の命令の起動口は spawn.rs の spawn の 1 本（起こし直しと口座の乗り換えも同じ 1 本）で、審査役の命令は gate.rs の decide（追随の再 gate と regate も同じ 1 本）と review.rs の decide の 2 か所。行の審査（review_ref.rs）と memo の審査（dispatch/memo_lens.rs）の lens は便に結ばれないので替えない。sweep の行の字を字で見る着地済みの歯（e2e の pipe/stop.rs の pipe_sweep_）は留めの無い置き場で撃つので字は替わらない。

      器の file の行の上限（1500・幅 120 で数える）。pipe/review.rs が 1481 行から 1483 行（余地 17）・pipe/dispatch.rs が 1463 行から 1465 行・pipe/mod.rs が 1377 行から 1378 行・pipe/spawn.rs が 1355 行から 1357 行・pipe/gate.rs が 993 行から 995 行・pipe/sweep.rs が 391 行から 395 行・pipe/cli/run.rs が 168 行から 170 行・name.rs が 34 行から 40 行・境界の main.rs が 540 行から 542 行・新しい pipe/pin.rs が 240 行。大きい file には呼びの 1〜2 行だけを足し、本体は pin.rs に置いた。

      入口の赤。木 d44c4e01 では verify の 3 行目の filter に当たる歯が 0 本で rc 4。e2e の pipe.rs と pipe/pin.rs だけを試作の字にした木 d44c4e01 で verify の 4 行目は rc 100（4 本とも落ちる・留めの行が無い・PATH の器で撃たれる・留めの形の呼ばれ方の子が自分を撃つ・sweep の行に pins が無い）。

      試作と噛み。写し drafts/w162a で書く file は write-set の中で閉じる（12 file）。verify の 2 行目から最後の行までは rc 0。根の xtask の check は 2 行を当てた木 2058d6a8 で rc 0（入れ子の 4 段の器の build・歯の全部 4127 本・clippy・器の xtask check を含む）。噛みは句ごとに 1 つの変異を当てた木で名指しの歯を 1 本の範囲で撃ち、28 の変異（event log を読めない置き場は unreadable・InstallRecorded の無い置き場は no-install・最後の InstallRecorded が勝つ・1 行目が同じ周だけ残す・hard link（lib と e2e）・置かない周は bin の dir を残さない・EXDEV は cross-device・head は留めの file が在る便だけ・head は名だけの語だけ・head は後ろの字を替えない・--run の子は留めを撃つ・印は字 --run・留めの無い便は自分の呼ばれ方・留めの形の呼ばれ方は器の名・留めの形は pipe の dir の下・自分の呼ばれ方は launcher を通す・受付が留める（e2e 2 本）・skipped の行の字・runner は留めを撃つ・gate の lens は留めを撃つ・審査の lens は留めを撃つ・掃除は live でない便の留めを消す・消すのは file ごと・sweep の行に pins=・版の行の形・境界の --version は core の 1 本）が全部 rc 100（組み立ての失敗の rc 101 は 0）。書き戻した後の対照は rc 0。

      安全。留めた便の driver と子は古い inode のまま走り、PATH の器の入れ替え（cargo install の置き換え）は留めの inode を替えない。留めの無い便（この行の前に起きた便・置けなかった便）は今までどおり PATH の器で走り、次の行の門が数え続ける。同じ file system でない置き場は写さず語 cross-device で留めない（便は PATH の器で走り門が数える＝今と同じ待ち）。留めは掃除が live でない便から消すので、古い世代の inode は走る便が無くなった後に残らない。event log の読み書きの互換の危うさは次の行の節に書く。

      範囲の外。門 busy を留めに合わせて緩めること（行 v-pin-swap）。便の claude の hook（plugin の命令は PATH の器を撃つ）を留めること。PATH の器の世代と最新の着地の差を doctor に出すこと（器の memo の候補 3）。終端の周の軸 sync が live の便の在る周にも入れ替えること。

      ほかの project で。器の名・置き場・event log の InstallRecorded だけを読み、tsuzuri の字を持たない。Rust でない repo の便も同じ（留めるのは器の binary で、repo の道具ではない）。
  - n: 25
    type: prose
    title: 行 v-scratch-held — 器の歯の一時 dir の助け 4 本が作った dir を歯の thread の終わりに消す（器の memo t3-hub.74.49.10・判断の記録 ADR-45 の門 H6）
    body: |
      在りか。差の file docs/design/patch/v-scratch-held.patch は、main 4a20678f（行 v-drafts-env の着地 c9b49361 と 29a 第 0.14 版の後）に試作の commit 2 つ（cf668165 と ad3793cc）を載せた木 ad3793cc（写し drafts/w164a-src の branch w164a）との差（5 file・9,474 byte・+128 −4）。main b3b7a7a4（29a 第 0.15 版・行 v-pin を置いた）は code を替えないので同じ差が当たる。差は 29a の未着地の器の行 8 本（v-closed-runs・v-red-close・v-review-dedup・v-scope-empty・v-atk-names・v-ci-last・v-row-basis・v-pin）の差をこの順に当てた木にも当たる（一時の index に当てて git apply --cached --check で照らした）。depends は v-pin（pipe/mod.rs が交差する・v-pin の hunk は pipe/mod.rs の頭の mod の 1 行だけで、差は v-pin の差の前でも後でも当たる）。ほかの未着地の行とは write-set が file の名で交差しない。

      なぜ。器の memo t3-hub.74.49.10（席が昇格と判じた・判断の記録 ADR-45 の門 H6 の便の一生の閉じ）。2026-10-04T21:21Z に /tmp の直下は 600,004 entry（10-02 は 357,154）で、頭の語は pipe-mutant- 478,578・account-consumers- 61,649・account-stage- 30,214・xphost- 1,058（10-04 から）だった（係 w164a の読むだけの測り・直下の stat だけ）。この 4 つの名を作るのは器の in-file の歯の助け 4 本（pipe/mod.rs の fixture の scratch・account/mod.rs と account/consumers.rs の歯の局所の scratch・pipe/live.rs の歯の局所の place）で、どれも名に pid を持ち、作る前に同じ名を消すが歯の後には消さない。nextest は歯ごとに process を替えるので、歯 1 本ごとに dir が 1 つ残る。main 4a20678f の木で器の lib の歯を全部撃つと、空の TMPDIR の直下に 200 本が残った（pipe-mutant- 184・account-consumers- 7・xphost- 6・account-stage- 3・この 4 本の名だけ）。tsuzuri の xtask の check は入れ子の段で器の lib の歯を全部撃つので、gate の各段・席・係の写しのどこで撃っても 1 回ごとに約 200 本が残る（CI は GitHub の runner で host の外）。10-04 の直近 24 時間の /tmp の直下の増え 38,317 のうち 93.3% がこの 4 本の名だった。OS の tmpfiles は /tmp の 30 日より古い entry だけを消す。

      形。
      - pipe の fixture に、作った dir を歯の thread の thread_local の列に預ける口 held を置く。列の包み Held は drop で dir を再帰で消し、列は thread の終わりに drop される（libtest は歯 1 本を 1 thread で走らせる・panic で終わった thread も同じ）。器の e2e の main.rs の TmpDir の held（設計 gate-cost.md §17・行 h）と同じ形で、std だけを使い、依存も env も rules 行も足さない。
      - scratch は PathBuf を返したまま、作った dir を held に預けて返す。呼ぶ所（器の lib の約 32 file）の字は 1 字も替えない。account/mod.rs と account/consumers.rs の歯の局所の scratch は作った dir を、pipe/live.rs の歯の局所の place は置き場の根（返す path の親）を、同じ口に預ける。頭の語と名の形は替えない。
      - 歯の共通の測り made_in_thread を fixture に置く。渡した作り手を別の thread で撃ち、返った dir に file を置けたか・join の後に dir が無いか・path を返し、測った後の dir は呼んだ歯の thread にも預ける（助けが預け損ねた周も歯の終わりに消える・預けるのは在る無しを測った後で、預け直しが測りを隠さない）。
      - 歯は新しい file pipe/scratch_tests.rs（名で test の file・pipe/mod.rs に cfg(test) の mod の行）に 3 本、account/mod.rs・account/consumers.rs・pipe/live.rs の歯の区間に 1 本ずつ置く。歯は自分の dir（隣に置く dir を含む）も全部 held に預けるので、通った周も落ちた周も /tmp に dir を残さない。

      比べた形。
      - 返す型を包みに替える: 呼ぶ所の約 200 か所が動く（§17 の (4) と同じ理由）。
      - gate の囲いが便ごとの TMPDIR を渡す（memo の候補 1）: 便の dir の path は 84〜87 字で器の e2e の tmux の socket の path が 107 字を越え、pipe retire は作業木を可逆に移すだけで便の dir を消さず、判断の記録 ADR-0004 の D-4（置き場を env で渡さない）の読みが要り、gate の外（席・係）を覆わない。席の決めで今は行にしない。
      - 歯の終わりに手で消す: panic した歯が残す。
      - 落ちた歯の dir だけ残す: drop の側では panic を分けられない（thread_local の destructor は thread の終わりに走り、その時 std の panicking は偽）。§17 の形（落ちても消す）に揃える。

      値と決定はしご。要るか: 要る（1 日に約 3.8 万ずつ増える）。既に在るか: 形は器の e2e の held に在るが e2e の crate の中で、lib からは使えない。lib の fixture は同じ前提（歯は 1 本 1 thread）の thread_local（STUB）を既に持つ。新しい rules 行・manifest の値・env は無い。今 /tmp に在る dir は消さない。

      範囲の外。tsuzuri の歯の助け crates/tsuzuri-boundary/src/server/events.rs の marks（頭の語 tz-events-・増えの 1.1%・席の決めで別の行にせず memo の notes に残す）・器の e2e の make_tmp_dir の残り（歯の後に背景の子 process が置き場へ書く形・増えの 3.7%）・ほかの project の歯の一時 dir・memo の候補 1・今 /tmp に在る dir の片付け・guard の無い一時 dir の助けを断る lint。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 番目の項は verify の 1 行目（差の hunk が全部木に在る）、2〜4 番目の項は 3 行目（器の lib の歯 vschd_ の 3 本・在りかは pipe/scratch_tests.rs）、5〜7 番目の項も 3 行目（同じ filter の 3 本・在りかは account/mod.rs・account/consumers.rs・pipe/live.rs の歯の区間）で測る。verify の 2 行目（器の clippy）は done の項に載せない守り（歯の名で測る項でないので、審査の対応の表で歯の無い項になる・29a の第 0.6 版の便の契約の審査）。29a の第 0.14 版から、xtask の check は器の共通 verify（.vessel.toml の common-verify）が gate の各段で verify の行の前に撃つので verify に書かない。欄 done-teeth は書かない（29a の第 0.7 版の器の行と同じ形）。

      構造の連鎖（木 4a20678f で grep）。scratch を歯が起こした thread の中で呼ぶ所は 0 か所（pipe/queue.rs の await-wake は歯の thread で作り、書き手の thread へ渡すだけ）。set_current_dir を呼ぶ歯は 0 本。字のままの scratch の名 135 のうち 2 本以上の歯が使う名は 0（cargo test の 1 process の中で歯が並ぶ周に、ある歯の drop がほかの歯の dir を消さない）。器の e2e は lib の fixture を使わない（crate が違う）。器の file の行の上限は幅 120 で数えて pipe/mod.rs が 1,377 行から 1,417 行・account/mod.rs が 1,120 行から 1,128 行・account/consumers.rs が 655 行から 663 行・pipe/live.rs が 341 行から 353 行・新しい pipe/scratch_tests.rs が 56 行（名で test の file なので core-lines に数わらない）。

      入口の赤。lib の歯は試作の file に在るので、木 4a20678f では verify の 3 行目の filter に当たる歯が 0 本で rc 4（--no-tests=fail・1,341 本を飛ばした）。歯と held と made_in_thread を試作の字にし、助け 4 本を base の字（預けない）に戻した木 4e753e36 で、3 行目は rc 100（6 本とも落ち、落ちた断言は join の後は無い・thread の後は無い・panic の後も無い・join の後は根が無い）。その木でも歯は空の TMPDIR に dir を残さなかった（0 本）。

      試作と噛み。写し drafts/w164a-src で書く file は write-set の中で閉じる。verify の 1〜3 行目は rc 0（差の当たり・器の clippy・器の lib の歯 vschd_ の 6 本）。器の lib の歯を全部撃つと（1,347 本・全部緑）空の TMPDIR の直下に残る entry は 0（base の木 4a20678f では 1,341 本で 200）。木 cf668165 で、入れ子の段（cwd scribe2/）の 4 つ（器の build・器の歯 4,098 本・器の clippy --workspace・器の xtask check）が rc 0、根の xtask の check が rc 0（根の歯 3,296 本・入れ子の器の歯 4,098 本・器の xtask check の ok まで・器の数え file-lines 1499/1500・core-lines 83936/90000）。撃った後の TMPDIR に残ったのは器の e2e の 7 本と tsuzuri の tz-events の 1 本だけ（範囲の外）で、この行の 4 本の名は 0。歯の測りを直した木 ad3793cc（歯の字だけの直し・在る無しを測ってから歯の thread に預ける）では、器の clippy（verify の 2 行目の形と入れ子の --workspace の形）・器の lib の歯 vschd_ の 6 本・器の lib の歯の全部（残りは 0）を撃ち直した。入れ子の nextest と根の xtask の check は木 ad3793cc で撃ち直していない（gate の共通 verify が撃つ・SSD の書きの上限のため・席の決め）。噛みは句ごとに 1 つの変異を当てた木で名指しの歯を 1 本の範囲で撃った（16 の変異）。木 ad3793cc で撃った 9 本: 再帰で消さない（2 番目の項）・預け先を別の thread にする置き場の変異（2・5・6・7 番目の項の 4 本）・預け先を process の static にする（3 番目の項）・panic の hook で預けを捨てる（3 番目の項）はどれも rc 100。同じ hook の変異で panic でない thread の歯は rc 0（3 番目の項の句は panic の時だけを噛む）。drop の側で panic 中は消さない変異は rc 0 で、振る舞いを替えない（thread_local の destructor は thread の終わりに走り、その時 std の panicking は偽）。木 cf668165（歯の測りの直しの前）で撃ち、測り方の替わらない 7 本は撃ち直していない（席の決め）: 預けない（2 番目の項）・同じ名の 2 回目で消さない（4 番目の項の空の句）・頭の語で隣も消す（4 番目の項の隣の句）・同じ名を 2 回預けた周の預けない（4 番目の項の無い句）・account と consumers と live の預けない（5〜7 番目の項）はどれも rc 100。書き戻した木の対照は rc 0。
  - n: 26
    type: prose
    title: 行 v-adopt — 後の commit の追認の札で、発端の trailer の無い commit に発端を結ぶ（判断の記録 ADR-45 の門 H6・器の memo t3-hub.74.50.4）
    body: |
      在りか。差の file docs/design/patch/v-adopt.patch は、main e4a6d844 にノート 29a のほかの器の行 7 本（v-accept-ptr・v-drafts-env・v-closed-runs・v-red-close・v-review-dedup・v-scope-empty・v-atk-names）の差の file をこの順に当てた木 dd443cf0 に試作の commit を載せた木 37e347d3（写し drafts/w158a の branch e）との差（6 file・20,315 byte・+192 −40）。差は素の main（ef8a9b13）にも、7 本と v-ci-last の差を当てた後の木にも当たり、差を当てた後にほかの 8 本の差もどの順でも当たる（係が一時の index で撃った）。書く file のうち pipe/land.rs だけが行 v-red-close の書く file と重なるので、depends は v-red-close の 1 行。

      なぜ。判断の記録 ADR-45 の門 H6（便と commit の一生の閉じ）の目標の 1 つは commit の照らしの外れ 0。局面の出力は、切り替えの線（tsuzuri の置き場では 10-01T14:31:30Z・main 463313da）より後の器の便でない commit を、発端の trailer も器の便の trailer も無ければ misfit commit-no-trailer に数え、misfit には窓を掛けない。10-01 14:48〜20:47Z の席の設計の commit 9 本（55c5bcd2・ef01b1fc・2ced0b45・bdade353・a0ff5635・3478f0fa・772a76c7・10e99124・62a2f8fd）は、器の決まり（発端の trailer）は在ったが席の設計の commit の道具がまだそれを求めていなかった間に push され、本文を直せない。9 本は手番 seat の閾値越えとして owned に数えられ、管理 tick が alarm=owned を出し続ける（器の memo t3-hub.74.50.4）。9 本とも作業の memo t3-hub.52.160 の notes が sha を名指し（8 本は本文にも台帳の記録の id が在る）、発端は分かっている。

      比べ（決定はしご・持ち主の裁定の id は 29a のこの版の note に在る）。要るか: 要る。既に在るか: 発端の trailer の読みと台帳での判じ（lifecycle_mark.rs の commit_of と phase_main.rs の commit の部品）は在り、無いのは後から発端を結ぶ札の読みだけ。数えから外す線（commit-check の線・旗か宣言の鍵）と門 H6 の目標の直しより先に、数えを減らさずに外れを解く形を置く（削らない案を先に）。数えから外す線は、人が 1 度だけ撃って照らしを範囲で外す口なので条 N-3.1（無効化の旗・今回だけの口を足さない）に当たり、採るには条 N-3 の除外の判断の記録が要る（前例 ADR-19 の決定 (2)）。札は照らしを外さず台帳で照らす一般の口なので N-3.1 に当たらない。git の note で結ぶ形は、上書きで黙って替わり、門を通らず、既定の fetch に入らないので取らない。

      形。
      - fleet/lifecycle_mark.rs: commit の読みの群（bead の引き・read_commits・commit 1 本の読み）を子の module commits へ移し、read_commits を同じ名で再輸出する（呼び手の use は替えない）。file は 1494 行から 1460 行。
      - fleet/lifecycle_mark/commits.rs（新しい file）: 移した群に、札の読みと当てを足す。commit 1 本の読みは札の行（key の後に sha と 1 本以上の id）を集め、新しい関数 commits_of が、発端の trailer を持つ commit の札だけを古い順に集め、発端の trailer も器の便の trailer も持たない commit の sources に、sha が同じ札の id を古い札から順に入れる。read_commits は git log の字を commits_of に渡す。
      - pipe/land.rs: 追認の札の語幹 ADOPTS_TRAILER（字 Adopts）と key の関数 adopts_key（finish の trailer_key で器の名から導く・pub(crate)）を、器の便の trailer の定数の次に足す。
      - ledger/phase_main.rs: Commit の欄 sources の doc に、札が結んだ id も入ることを書く（code は替えない）。
      - e2e: fleet.rs に mod adopt の 1 行を足し、新しい fleet/adopt.rs に歯を置く（親の Life の helper を使い、key は core の導出と独立に組む）。
      - 替えないもの: 器の merge の門と main の出所の検査の code（どちらも本文の発端の trailer と run: の行だけを数え、札の行を読まない）・commit の部品の判じ（phase_main.rs の commit_part）・器の便の commit の結び・row の着地の読み・event の表・窓と owned の数え。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 番目の項は verify の 1 行目（差の hunk が全部木に在る）、2 番目の項は 3 行目（器の lib の歯 vadopt_ の 1 本・在りかは fleet/lifecycle_mark/commits.rs の歯の区間）、3 番目の項は 4 行目（器の e2e の歯 vadopt_ の 1 本・在りかは e2e の fleet/adopt.rs）、4 番目の項は 5 行目（着地済みの lifecycle_mark_ の 13 本・在りかは fleet/lifecycle_mark.rs）、最後の 5 番目の項は 6 行目（着地済みの器の e2e の fleet_lifecycle_ の 10 本・在りかは e2e の fleet.rs）で測る。verify の 2 行目（器の clippy）は done の項に載せない守り。第 0.14 版から、xtask の check は器の共通 verify（.vessel.toml の common-verify）が gate の各段で verify の行の前に撃つので verify に書かない。欄 done-teeth は書かない。

      構造の連鎖（木 37e347d3 で grep）。read_commits の呼び手は fleet/lifecycle.rs の gather の 1 か所で、再輸出で use の字は替わらない。Commit の sources を読むのは phase_main.rs の commit の部品（外れの語と links の source）だけで、器の便の commit の結び（ties）は run と contracts だけを読むので、札で結んだ commit は結びに入らない。trailer_key の呼び手に adopts_key が 1 つ増える。器の file の行の上限（1500・幅 120 で数える）は fleet/lifecycle_mark.rs が 1494 行から 1460 行・pipe/land.rs が 1415 行から 1425 行・ledger/phase_main.rs が 424 行から 425 行・新しい commits.rs が 120 行。e2e の file は上限の測りの外。

      入口の赤。lib の歯は src の fleet/lifecycle_mark/commits.rs の歯の区間に在るので、木 dd443cf0 では verify の 3 行目の filter に当たる歯が 0 本で rc 4（--no-tests=fail）。e2e の fleet.rs と fleet/adopt.rs だけを試作の字にした木 dd443cf0 で、verify の 4 行目は rc 100（札が名指した commit が commit-no-trailer の misfit のまま・断言「札が台帳に在る id を結ぶ」）。

      試作と噛み。写し drafts/w158a で書く file は write-set の中で閉じる（6 file）。verify の 2 行目から最後の行までは rc 0（器の clippy・器の lib の歯 vadopt_ の 1 本・器の e2e の歯 vadopt_ の 1 本・着地済みの lifecycle_mark_ の 13 本・器の e2e の fleet_lifecycle_ の 10 本）。入れ子の 4 段（器の build・歯の全部 4,119 本・clippy・器の xtask check は ok の 1 行で file-lines=1500/1500〔上限の file は書かない pipe/confine.rs〕・core-lines=84341/90000）と根の xtask の check は試作の木 37e347d3 で rc 0（根の歯 3,296 本・host と wasm の clippy・面の組み立て・入れ子の器の歯 4,119 本）。噛みは句ごとに 1 つの変異を当てた木で名指しの歯を 1 本の範囲で撃ち、11 の句（札を当てる・札は発端の trailer を持つ commit から読む・自分の発端の trailer を持つ commit には結ばない・器の便の trailer を持つ commit には結ばない・sha は 40 字の全部が同じ時だけ・同じ sha の札は全部の id を足す・id は古い札から順に足す・札の key で読む・key の語幹は Adopts・札の id は sha の後の全部・全部の書き直しの読みが札を当てる）に 16 の変異を当てて全部 rc 100（組み立ての失敗の rc 101 は 0）。書き戻した後の対照は rc 0（vadopt_ の lib と e2e）。

      本物の写しでの試し。tsuzuri の置き場の event log と出力の写し（/tmp の下・10-04T20:13Z）・台帳の読むだけの写しを返す偽の bd・main e4a6d844 の写しで試作の器（入れ子の段で組んだ binary）を撃った。写しの main を発端の trailer だけを持つ commit へ進めた書き直しで、commit の misfit は 9 本（全部 commit-no-trailer）。その上に 9 本の札を本文に持つ commit（字は係の commit-msg-e.txt の第 2 版・札の id は後で作業の memo を先に置く形に替えたが、どの id も台帳に在り判じは同じ）を積んだ書き直しで、commit の misfit は 0 本・9 本は窓の外で出力から外れ・札の commit は発端 t3-hub.80 で commit-landed・owned は 7（写しの時点の残りは契約表の行で bead の無い row-unbeaded の 7 本・今の出力〔10-04T21:36Z〕では row-unbeaded は 0 で、owned 9 がちょうどこの 9 本）。本物の置き場と repo には書いていない。

      着地の後の席の手。札はこの行を置く設計の commit の本文に置く（9 本の札・字は係の commit-msg-e.txt）。古い版の器は札の行を読まずに飛ばすので、着地の前に main に在っても害はない。着地と PATH の器の入れ替えの後の全部の書き直しで 9 本は commit-landed に移り、窓の外なので出力から外れる。入れ替えの後も古い版の器（入れ替えの前に起きた便）が全部を書き直す周は札を読まないので、9 本はその周だけ commit-no-trailer に戻り、since はその周の時刻になる（すぐには owned に数えない）。札は後から消せず、台帳に無い id を 1 本でも書くとその commit は source-unresolved に固定されるので、席は置く前に sha と id を git と台帳と出力で照らす（係の check-adopts.py・読むだけ）。席は check-misfits.py after で commit の外れ 0 を確かめる。

      線の後の測り。照らしから外れる commit は無い。trailer の無い新しい commit は札で結ばれるまで commit-no-trailer、台帳に無い発端（札で結んだ id を含む）は source-unresolved、event log に無い便の trailer は run-trailer-unknown のまま数える（2 番目と 3 番目の項）。

      失う物。数えは 1 本も減らない。後から結ぶ口は 9 本の後も残る。結べるのは発端の trailer を持つ commit が台帳に在る id を名指した時だけだが、札そのものは入口で照らされない（tsuzuri で入口に発端の trailer を求めるのは席の設計の commit の道具と席の merge の command に掛かる hook の門だけで、CI の main の出所の検査はまだ撃っていない・行 v-gates へ回す）。誤った札は外れ（source-unresolved か commit-no-trailer）として見え続け、黙って消えはしない。器の跨版の面（trailer の名）が 1 つ増える。

      範囲の外。数えから外す線（commit-check の線）・宣言の任意の鍵・git の note・sha を名指す受け入れの event（器の memo の候補 2）・契約表の行で bead の無い row-unbeaded の 7 本（別の手）・器の設計文書 case-lifecycle.md の書き換え（取り込みの後は直していない〔10-03 から 0 commit〕ので直さない・席の決め・この節が新しい振る舞いを書く）・要件 FR1092 の字と判断の記録（持ち主の裁定の後に、この行を置く設計の commit で席が置く・字の案は係の questions.md）。

      ほかの project で。main の git と全部の書き直しの口だけを読み、tsuzuri の字を持たない（key は器の名から導く）。trailer の門を後から置いた project は、門の前の commit に後の commit の札で発端を結べる。
  - n: 27
    type: prose
    title: 行 v-self-match — host の見張りの自分に当たる待ちと止め（判断の記録 ADR-44 の決定 (3)・束 B05）
    body: |
      在りか。差の file docs/design/patch/v-self-match.patch は、main 61106965 に試作の commit を載せた木 ccce0746（写し drafts/w166a の branch w166a-r）との差（12 file・49,975 byte・+432 −26）。差は main 6f1db744（v-closed-runs の着地の後・この 12 file に触れない）にも、その時に未着地の 29a の器の行 8 本（v-red-close・v-review-dedup・v-scope-empty・v-atk-names・v-ci-last・v-row-basis・v-pin・v-scratch-held）の差をこの順に当てた各段の後にも当たり、この差を先に当てた木にも 8 本の差は当たる（v-ci-last は前の行 v-red-close の差の後だけ・係が一時の index で撃った）。書く file が file の名で重なる未着地の行は v-scope-empty（e2e の seat.rs・hunk は離れている）だけで、depends はその 1 本。拠りは持ち主の裁定 t3-hub.80.6:20261004T2037Z-1（束 batch:20261004T2037Z-1・案 A）と、要件書 第 0.33 版で要件 FR1056 の shall と plain に足した字（この種類は型が自分に当たる形と字の決まらない形だけを断り、ほかは通し、次の手を告げ、intake の verify の判定に掛けない）。

      なぜ。判断の記録 ADR-44 の決定 (3)（ほかの project でも起きる再発防止を器の構造へ上げる）・束 B05（係 w143a の仕分けの 3 番）。pgrep -f と pkill -f は型を process の command 行の全体に当て、撃った shell の command 行も型の字を持つので、型が自分の字に当たる形だと待ちが終わらず（2 度・1 日余り回った）、pkill -f は自分の shell を止める（1 度）。器の席でも同じ型が 1 度。席の会話の記録（11 日・Bash の撃ち 58,069）では、この形に当たる撃ちが 217 件（pkill -f 13 件）で、記憶を書いた後の 20 時間でも 4 件（係 w148a の実測・起草の判じ）。席は記憶だけで守っていた。器の host の見張り（host-guard・口座の設定から host の全部の会話に掛かる）はこの形を断る口を持たない。器の設計文書 vessel-hook.md §11 は凍ったまま（判断の記録 ADR-36 の決定 (7)）で、この節が新しい振る舞いを書く。§11 の種類は 7 つになる。新しい rules 行は持ち主の裁定 t3-hub.80.6:20261004T2037Z-1 による。

      形。 - 子 module: hook/host_guard/self_match.rs を足す（publish と同じく親の Subject と Refusal と verb_of を使う・子 process を撃たず fs も読まない）。
      - 段（levels・opening・closing）: command 行を、単引用符の外の置換と subshell（$( と逆引用符と丸括弧の開きの対）の本文で段に分ける。外の段には中の無い対（$() と逆引用符 2 つと ()）だけを残し、中の字を外の segment の語に混ぜない。二重引用符の中の丸括弧の開きは字で、閉じは引用符の外の丸括弧の入れ子を数え、引用符の中と逆斜線の次の字を数えない（閉じない本文は末まで）。
      - 呼び（calls・call_of・read_args・bundle）: 段ごとに起票の門の分割 segments で切り、segment の頭の制御の語 10 個と NAME=value を読み飛ばし、親の verb_of（launcher と path を剥ぐ）の動詞が pgrep か pkill なら後ろの語を getopt の形で読む。値を取る短い字は d・g・G・O・P・q・s・t・u・U・F・r、長い名は --delimiter・--pgroup・--group・--older・--parent・--session・--signal・--terminal・--euid・--uid・--pidfile・--runstates・--cgroup・--ns・--nslist・--queue（procps-ng 4.0.4 の pgrep と pkill の --help で値を取る flag の全部）。
      - 判じ（verdict・named・own）: 逆引用符か名の前の $ を持てば解けない、角括弧・丸括弧・波括弧・^・逆斜線・$ を持つか型の字が command 行に字のまま無ければ決めない（通す）、| で割ったどれかの枝が字と . と .* と .+ だけなら自分に当たる。
      - judge: 段の全部の full の呼びが 0 なら行を読まずに通す。在れば行 host_guard.self_match を読み、無い・列でない周は no-row で断り、enabled が false の周は通す。行の語列を順に見て、頭の語と同じ動詞の full の呼びの型が自分に当たる形か解けない形なら、hit をその語列にして断る（編集系の道具の周は command 行が空で呼びが無い）。
      - 親: host_guard.rs に定数 SELF_MATCH_ROW と pub mod self_match と Kind::SelfMatch（語 self-match・宣言の末）を足し、KINDS を 7 つ・as_str と row と route とjudge_kind の腕・module と Kind の doc の 6 値を 7 値にする。経路の字は「待つ相手の pid を取って kill -0 <pid> で待つか、型の 1 字を [] で囲む（例 pgrep -f '[m]erge'）— -f の型は自分の command 行にも当たる」。
      - 行: rules/manifest.toml の行 host_guard.publish_read_bytes の後ろに、注の段と行 host_guard.self_match（kind HostGuardDeniedCommands・value は 2 語列 pgrep -f と pkill -f・enabled true・ruling user 2026-10-04T20:37Z 問い t3-hub.80.6・ruled_at 2026-10-04）を置く。command guard（hook/command.rs の denied_of）と intake（pipe/cli/intake.rs の denied_rows）は語列の 3 行を id（WORD_ROWS）で読み kind では読まないので、この行は runner の verify の照合にも intake の判定にも掛からない。rules/mod.rs の HostGuardDeniedCommands の doc を行が 4 つの字に直す。
      - doctor: account/wire.rs の ROW_KINDS を 6 つ（SelfMatch を末）にし、doc の 5 つと /5 を 6 つと /6 にする。e2e の seat/account.rs の GUARD_NO_ROWS とhelper の guard_rules（行 host_guard.self_match を足す）と期待の字 4 か所、seat.rs の HOST_GUARD_BARE、snapshot e2e__seat__seat_doctor_external_form.snap を合わせる。
      - 行の数: e2e の rules/embedded.rs の埋め込みの行数を 111 にし（理由の字の頭に行 v-self-match の +1）、snapshot e2e__rules__rules_external_form.snap の rows=110 の 2 か所を 111 にする。
      - 歯: self_match.rs の歯の区間に lib の歯 vselfm_ の 3 本。host_guard_tests.rs の歯 host_guard_kind_slice_is_the_six_kinds_in_declaration_order を host_guard_kind_slice_is_the_closed_kinds_in_declaration_order に名替えして 7 つの列にする（足す行は 0）。e2e の hook/guards.rs に歯 1 本（経路の字を字のまま断言し、main の木でも組み立てが通る）。

      判じの決め。断るのは字だけで自分に当たると決まる形と字の決まらない形だけで、決められない形は通す（要件 FR1056 の字）。型の字が command 行に字のまま無い型（逆斜線で字を外した語・引用符を継いだ語）は、撃った shell の command 行に同じ字が無いので通す。? は直前の 1 字を 0 か 1 字にし、自分の字の . と ? の2 字を覆えないので、? を持つ枝は自分に当たる形に数えない。. でない字の後の繰り返しを持つ枝は、自分の字に当たるかが後ろの字で替わるので決めない。角括弧などを持つ型は自分に当たる形も在る（丸括弧で包んだ字だけの型）が、字だけでは決めず通す（要件の字の「ほかの型は通し」・経路の [] の囲みを止めない）。pgrep の -A（撃った shell と祖先を外す）・-x・-v・-P などで自分を選ばなくなる呼びも、型が自分の command 行に当たるので断る（要件の字は型で判じる）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 番目の項は verify の 1 行目、2〜4 番目の項は 3 行目（器の lib の歯 vselfm_ の 3 本・在りかは hook/host_guard/self_match.rs の歯の区間）、5 番目の項は 5 行目（器の lib の歯 host_guard_kind_slice_ の 1 本・在りかは hook/host_guard_tests.rs）、6 番目の項は 4 行目（器の e2e の歯 vselfm_ の 1 本・在りかは e2e の hook/guards.rs）、7 番目の項は 6 行目（器の e2e の着地済みの歯 host_guard_doctor_ の 4 本・在りかは e2e の seat/account.rs・doctor の読めない周の 1 本は字を替えずに撃つ）と 7 行目（器の e2e の着地済みの歯 seat_doctor_external_form・在りかは e2e の seat.rs と snapshot）、最後の 8 番目の項は 8 行目（在りかは e2e の rules/embedded.rs）と 9 行目（在りかは e2e の rules.rs・字を替えないので write-set に置き場だけの = で置いた・snapshot は書く）で測る。verify の 2 行目（器の clippy）は done の項に載せない守り。29a の第 0.14 版から、xtask の check は器の共通 verify（.vessel.toml の common-verify）が gate の各段で verify の行の前に撃つので verify に書かない。欄 done-teeth は書かない。

      構造の連鎖（木 ccce0746 で grep）。KINDS の読み手は judge と歯 1 本（host_guard_tests.rs）と器の xtask の enum-slices の測り。Kind の網羅の match は as_str・row・route・judge_kind の 4 つ。ROW_KINDS の読み手は doctor の 1 行を組む 1 か所。SELF_MATCH_ROW の読み手は Kind::row と self_match の judge（器の xtask のrules-wired は const の使用で読み手を数える）。doctor の host-guard の行を字で見る歯は e2e の seat/account.rs の 4 本と seat.rs の HOST_GUARD_BARE を読む歯とsnapshot 1 つ。埋め込みの行数を数える歯は rules/embedded.rs の 1 本と rules.rs の rules_external_form の snapshot。同じ裁定の行を数える歯（rules/embedded.rs のhost_guard の 4 行）と manifest の末尾の 14 行を数える歯（rules.rs）は、行の置き場（host_guard.publish_read_bytes の後ろ）と別の裁定 id で動かない。器の門 rules-diff（新しい行が base の別の行の裁定を使うと new-row-reuses-ruling）は、base の manifest と並べた写しで violations=0（裁定を base の別の字に替えると violations=1）。器の file の行の上限（1500・幅 120 で数える）: host_guard.rs は 951 行から 962 行・host_guard_tests.rs は 1493 行のまま（余地 7 で growth 1）・wire.rs は 463 行から 464 行・rules/mod.rs は 926 行から 927 行・新しい self_match.rs は 369 行（歯の区間を含む）。

      入口の赤。lib の歯は src の self_match.rs の歯の区間に在るので、main の木（b3b7a7a4・scribe2/ の下は 61106965 と同じ）では verify の 3 行目の filter に当たる歯が 0 本で rc 4（--no-tests=fail）。e2e の歯の file hook/guards.rs だけを試作の字にした main の木で、verify の 4 行目が rc 100（pgrep -f の待ちを通し、断りの rc 2 の断言で落ちる）。

      試作と噛み。写し drafts/w166a で書く file は write-set の中で閉じる（12 file）。verify の 2 行目から最後の行までは rc 0。根の xtask の check は木 ccce0746 で rc 0（根の歯 3308 本・入れ子の器の build・歯 4096 本・clippy --workspace・器の xtask check まで・器の file-lines は 1499/1500）。main 6f1db744 に差を当てた木（係の branch w166a-m）でも verify の 1 行目から最後の行までは rc 0。噛みは句ごとに 1 つの変異を、環境の印で切り替える 1 つの木に当て、名指しの歯を 1 本の範囲で撃ち、40 の句（制御の語の後の頭・NAME=value の後の頭・動詞 pkill・launcher と path を剥ぐ・--full・値を取る字より前の f だけ・大文字の F は値を取る・短い flag の値・長い flag の値・-- の後は非 flag・flag の順・$( の段・逆引用符の段・( の段・単引用符の中は開かない・二重引用符の中の ( は字・段の中の字を外の段に混ぜない・閉じの丸括弧の入れ子・閉じの引用符・判じを決めない字・字のまま在る型だけ・どれかの枝・? を持つ枝・繰り返しは . の直後だけ・逆引用符は解けない・名の前の $・$_・$ の後の数字は決めない・行の語列の動詞の呼びだけ・行が無い周・列でない行・enabled false・full の呼びだけ・full の呼びが無い周は行を読まない・当たらない型は通す・種類の語・行 id・判定の腕・経路の字・doctor の欄）に 40 の変異を当てて全部 rc 100（組み立ての失敗の rc 101 は 0）で、どれも句の見本の断言で落ちた。印なしの対照と使わない印の対照は rc 0。

      範囲の外。ps と grep の自己一致（ps aux | grep x）・sh -c と bash -c の引数の中（器の照合は interpreter の引数を解かない・ADR-0025 §2.6）・script の file の中・killall・-A などで自分を選ばなくなる呼びを通すこと（要件 FR1056 の字の足しが要る）・角括弧などを持つ型の判じ・GNU の長い名の略し（--ful など）・席の hook の command guard への足し・器の設計文書の書き換え。

      ほかの project で。pgrep と pkill は procps の道具で言語に依らない。型の判じは command 行の字だけで、host の名も project の字も持たない。host-guard は口座の設定から host の全部の会話に掛かるので、どの project の会話でも同じ形で断る。
  - n: 28
    type: prose
    title: 行 v-run-write — 便 1 本の装置への書きを段ごとと和の 1 行で読む口（判断の記録 ADR-49 の決定 (2) と (3)）
    body: |
      在りか。差の file docs/design/patch/v-run-write.patch は、main 6c950383（29a 第 0.17 版・行 v-adopt を置いた・行 v-closed-runs の着地 6f1db744 の後）に試作の commit 3 つ（3388a691・f89640e0・10631ccb）を載せた木 10631ccb（写し drafts/w168a の branch w168a-r）との差（6 file・37,686 byte・+553 −6）。試作は main 8c82ef7c の上で書いて噛み（branch w168a・木 65ed015a）、6c950383 へ載せ替えた（write-set の 6 file は 2 つの main で同じ字で、差は byte で同じ）。main ca39cd67（29a 第 0.18 版・行 v-self-match を置いた）は 6c950383 から code を替えないので同じ差が当たる。差は main ca39cd67 と、29a の未着地の器の行 10 本（v-red-close・v-review-dedup・v-scope-empty・v-atk-names・v-ci-last・v-row-basis・v-pin・v-scratch-held・v-adopt・v-self-match）の差をこの順に当てた木のどの段の後にも当たる（一時の index に当てて git apply --cached --check で照らした・8c82ef7c の上では着地前の v-closed-runs を頭に足した 9 本でも当たった）。depends は無い: write-set の 6 file は、29a の未着地の行の write-set と file の名で交差しない（e2e の新しい歯の file は pipe.rs でなく gate.rs の子 module に置き、v-pin の書く pipe.rs と交差しない）。

      なぜ。判断の記録 ADR-49（持ち主の裁定 t3-hub.80.22:20261004T2037Z-1・案 A）の決定 (2) と (3)。便 1 本の装置への書きは、器の読みの口 1 本（pipe show の旗 --write）が、費用の event（RunCost）の実装の AI（source runner）の書きと、便の作業の dir の 3 つの記録（終わりの門 end-gate.jsonl・gate と列の候補 verify.jsonl・着地の確かめ verify-main.jsonl）の書きの欄 write_bytes から、段ごとの値と和を 1 行で出す。今の費用の event の書き（runner と lens）は、10-04 の 23 便で測れている書きの 72.6% だけを持つ（係 w154a・検証役 qv156）。着地済みの本番の 25 便（係 w163a の照らしの列）では、費用の event の和が 263.2 GB、式の和が 378.5 GB（0.695）。抜けは終わりの門・着地の確かめ・列の候補で、どれも run dir の record の欄にだけ在る。ADR-36 の基準 D1 と G11（便 1 本の書き込み）はこの口の和で測り、席の見張り（ADR-48 の決定 (3)）も同じ式で数える。

      形。
      - 読みの関数（新しい module pipe/report/written.rs・pipe report の消費の数えの隣・report.rs には子の module の宣言と再輸出の 2 行と module の doc の 1 文を足す）: 置き場と便 id と event の列を受け、4 段の値と和を返す。値は閉じた 3 値（数・測れない・記録が無い）で、行の字は 10 進・字 unmeasured・字 - の 3 形にし、0 と測れないを融合しない（器の憲法 C10）。
      - runner の段: 便の source runner の消費の event の detail の語 write:<10 進> の和（行 xp-io-bytes の語）。語が無いか数でない event が 1 つでも在る周と、便の SeatSpawned の数より消費の event が少ない周（runner が走り中・止めた・6 値の揃わない終わりで消費の event を書かなかった周）は測れない。source lens の語は同じ gate の周の verify.jsonl の行の和の写しなので足さない（2 度数えない）。source review は書きを持たない。
      - record の段: verify.jsonl（gate の全部の周と列の候補・列の後ろの便の契約 verify の行は印 train を持たないので段を分けない）・end-gate.jsonl・verify-main.jsonl（着地の確かめと着地後の検出）の撃った行（欄 secs を持つ行・gate の record の書きの和と同じ選び）の欄 write_bytes の和。撃たない行（write-set の照合・撃たなかった段・終わりの門の要約の行）は数えない。file の無い段は記録が無い。
      - 和: 測れない段が 1 つでも在れば測れない・4 段とも記録が無ければ字 -・ほかは記録の無い段を 0 として足す。
      - 口（pipe/cli/show.rs と pipe/cli/args.rs）: pipe show の受ける旗の列に値の無い旗 --write を 1 つ足し、旗の在る周だけ、ほかの行の後に 1 行を足す。行の字は、字 write と半角のコロンの後に空白を挟んで runner=・verify=・end-gate=・main=・total=・uncounted=worktree,land-git,reviewer-claude の 6 語。uncounted の 3 語は ADR-49 の決定 (3) が数えない物として名指す囲いの外の書き（作業木の作り・着地の git・審査役の claude の囲い）。読むだけで、event log と run dir に書かない。

      event log の形と互換。費用の event の key・source の閉じた 3 値・欄 detail の語は替えず、kind も key も足さない。record の file の形も替えない。新しい記録の file も置かない（ADR-49 の決定 (2)）。旗の無い pipe show の出力は 1 byte も替えない（着地済みの外形の歯 pipe_record_show_external_form の snapshot を書き替えない）。旗にしたのは、旗の無い出力に行を足すと、その snapshot が gate の record の在る便で落ちるから。終わりの門と着地の確かめの file の名は書き手の私有の const（pipe/spawn.rs と pipe/land/verify.rs）で、読みの module は同じ字の const を持つ（書き手の file を write-set に入れると、spawn.rs を書く未着地の v-pin と交差する）。名の食い違いは e2e の歯（toy の便を着地まで通し、書き手の置いた 3 つの file を拾う）が測る。

      本番の置き場での照らし（係 w168a・読むだけ）。試作の binary の pipe show --write を、本番の置き場（state dir の pipe/<便>/ と fleet/events.jsonl）の着地済みの 25 便（係 w163a の check/prod-landed.tsv の列）に撃ち、係 w163a の見張りの道具 xpev.run_write の値と便ごと・段ごとに byte で照らした: 125 の値が全部同じ（verify は道具の gate と train の和・口の main の字 - の 1 便は道具の 0）。和は口も道具も 378.45 GB で、ADR-49 の退きの条件 (2) の食い違いは 0。撃った時（2026-10-04T22:3xZ）の置き場の全部の便 630 本では、和が数の便は 30 本（10-04T09:42Z より後に作った便 33 本のうち起こしの無い 3 本を除く全部・全部着地済み）で、どれも道具と段ごとに同じだった。ほかは字 -（起こしの無い便 143 本）か字 unmeasured（行 xp-io-bytes の前の便 457 本・語 write: を持たない）。strace で見た口の撃ちは、置き場に書きの syscall を 1 つも撃たず、置き場で開いたのは event log と run dir の repo の札と detection の dir と 3 つの record の読み（全部 O_RDONLY）だけだった。

      範囲の外。pipe report に置き場の全部の便の和の行を足すこと。審査役（lens と行の審査）の claude の囲いそのものの書きを記録へ写すこと（量は測っていない）。6 値の揃わない runner の終わりの書きを記録へ残すこと（今は runner の段を測れないと出す）。席の見張りと日ごとの数えの script をこの口へ移すこと（席の手・ADR-49 の帰結）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 番目の項は verify の 1 行目（差の hunk が全部木に在る）、2〜6 番目の項は 3 行目（器の lib の歯 vrunw_ の 5 本・在りかは pipe/report/written.rs の歯の区間）、7〜9 番目の項は 4 行目（器の e2e の歯 vrunw_ の 3 本・在りかは e2e の pipe/gate/written.rs）、最後の 10 番目の項は 5 行目（着地済みの e2e の歯 1 本・在りかは e2e の pipe/gate.rs）で測る。verify の 2 行目（器の clippy）は done の項に載せない守り。29a の第 0.14 版から、xtask の check は器の共通 verify が gate の各段で verify の行の前に撃つので verify に書かない。欄 done-teeth は書かない（29a の第 0.7 版の器の行と同じ形）。

      構造の連鎖（木 6c950383 で grep）。pipe show の受ける旗の列は pipe/cli/args.rs の ALLOWED_SHOW の 1 か所で、旗の閉じた列を数で pin する歯は無い（allowed_of を名指す歯は 0）。pipe の usage の字（pipe/cli.rs）と help の頁（help.rs の pipe の flags）は subcommand ごとの旗を全部は並べない（末の [flags]・--fold-only や --placed も無い）ので替えない。e2e の歯の子 module の宣言は gate.rs の頭の mod の列と module の doc の 1 か所。器の file の行の上限 1,500 に対し、report.rs は 184 行から 190 行・show.rs は 132 行から 141 行・args.rs は 240 行から 241 行・新しい report/written.rs は 346 行（本体 180 行・歯の区間 166 行）。

      入口の赤。main 8c82ef7c に e2e の歯の file 2 つ（gate.rs の mod の行と gate/written.rs）だけを足した木 291ecbfd（器の src は main のまま）で、verify の 3 行目は filter に当たる歯が 0 本で rc 4（--no-tests=fail・1,341 本を飛ばした・lib の歯は新しい module の中に在る）、4 行目は rc 100（3 本とも落ち、落ちた断言は旗の在る周の rc 0・字は pipe の未知の引数 --write の断り）。

      試作と噛み。写し drafts/w168a で書く file は write-set の中で閉じる。載せ替えた木 10631ccb で verify の 1〜5 行目を字のまま撃って全部 rc 0（差の当たり・器の clippy・器の lib の歯 vrunw_ の 5 本・器の e2e の歯 vrunw_ の 3 本・着地済みの外形の歯 1 本・1 行目は差の file を係の置き場から当てた）。噛みは句ごとに 1 つの変異を当て、名指しの歯を 1 本の範囲で撃った（変異を env の印で切り替える 1 つの木を lib と e2e で 1 度ずつ組み、印ごとに撃った・印の無い対照は rc 0）。変異 42 を 46 の句に当て、全部が rc 100 で、落ちた断言は全部その句の断言だった（2 番目の項 6・3 番目 9・4 番目 10・5 番目 7・6 番目 3・7 番目 4・8 番目 3・9 番目 3・10 番目 1）。9 番目の項の end-gate と main の入れ替えの変異は、歯が record に行を足す前の形では toy の便の 2 段がどちらも 0 で rc 0 だったので、歯が 3 つの file に違う byte の撃った行を足す形に直し、9 番目の項の 3 つの変異を撃ち直して rc 100 を見た。木 65ed015a（main 8c82ef7c の上）で、入れ子の段（cwd scribe2/）の 4 つ（器の build・器の歯 4,100 本を --no-fail-fast で・器の clippy --workspace・器の xtask check）が rc 0。木 10631ccb（main 6c950383 の上）で根の xtask の check が rc 0（根の歯 3,308 本・入れ子の器の歯 4,107 本・器の xtask check の ok まで・器の数え core-lines 84262/90000・file-lines 1499/1500〔最大の file はこの行の外〕）。
  - n: 29
    type: prose
    title: 行 f-ctx-build — 設計ノートの行の近い仕様の塊を組む純関数（判断の記録 ADR-51 の決定 (1) と (4)）
    body: |
      在りか。差の file docs/design/patch/f-ctx-build.patch は、main 6016bd77（29a 第 0.19 版・行 v-run-write を置いた）に試作の commit 1 つを載せた木（写し drafts/w171a の branch w171a の 1 つ目の commit）との差（4 file・31,805 byte・+783 −0）。新しい module folio2/crates/folio/src/context.rs（774 行・本体 494 行・歯の区間 280 行）と、lib.rs の module の宣言 1 行と、entry.rs の公開の関数 context（7 行）と、層の表 tests/teeth1/modules.rs の 1 行。依存は足さない（std と既存の yaml-rust2 の読み手だけ）。

      なぜ。判断の記録 ADR-51（持ち主の裁定 t3-hub.80.7:20261004T2037Z-1・案 A）の決定 (1) は、設計の層の近い仕様（要件の本文・判断の記録の決定・条の規範文・規則の行・受入基準）を行ごとに束ね、名指しで引けない id は 1 つの塊として出して黙って落とさない（条 P-7）とした。決定 (4) は、近い仕様を組む純関数と tz の口を先に作り、今の契約で実の字を測り直してから器の行を起こすとした。この行はその純関数で、塊の順と深さは係 w150a の案（drafts/w150a/w/notes.md の 3.0 節）のまま。帰結の 2 つ目（同じ組み手を tz の口にも出す）は次の行 k-ctx-cli が持つ。

      形。
      - 組みの関数 blocks（読んだ木だけの純関数）: 正本 4 種の木と、行の欄 req と欄 basis（在れば・行 f-row-basis）と名指しを拾う字（題・section の節の本文・done を改行でつないだ字）を受け、塊の字を返す。置き場を読むのは関数 build だけ。
      - 名指しの拾い: 欄 req・欄 basis・字の順に見つけた順で並べる。字の id は refs.rs の id_end（条・規範文・要件書の 5 種・規則行）と link.rs の adr_end（判断の記録）で拾う（正規表現は使わない）。種は id の頭の字で決める。
      - 塊の順: 要件（要件書の受入基準の節の外の id・種の字は索引の節点の種類の字 目的・要件・非機能要件・制約・登場人物・出力）→ 判断の記録 → 規則行 → 条 → 受入基準 → 引けない id。同じ種は見つけた順。塊の頭は字「- 」と id と空白と種の字（引けない id の塊は字「- 引けない id」）、本文の行は頭に空白 2 つ、空の行は書かない。
      - 本文: 要件は題の行と、器の requirements.txt と同じ字（text が在れば text・無ければ when と字「 — 」と shall・when も無ければ shall・空白の連なりを 1 つに畳む）の行。受入基準は題の行。規則行は what と字「 = 」と value と全角の括弧の中の字「条 」と article の 1 行（value の無い行は what と括弧）。条は題の行と、名指した規範文（条を名指せば全部）の id と空白と規範文の行。判断の記録は題の行と、決定の全文か名指した項の行。
      - 深さ: 欄 req の要件から、その basis の条と、その要件を verifies に持つ受入基準までの 2 段。ほかの名指し（字の名指しと欄 basis）は名指した id の本文だけの 1 段。判断の記録の basis は辿らない。
      - 判断の記録の項: 字 ADR-n の後に字「の」を挟んでもよい字「決定」と、半角か全角の括弧で囲んだ項の番号（3 桁まで）の列が続く名指しは、その項だけ。項の間の字は「と」「・」「、」と空白と間の無い並び、字「〜」と「から」は範囲。項は決定の字の行頭の項の印から次の行頭の項の印の前までの行（項の前の行は落とす）。字「決定」の無い名指し・項の番号の続かない字「決定」・欄 basis の id・行頭の項を持たない決定（器から持ち込んだ番号 4 桁の判断の記録の行中の項の形を含む）は決定の全文。同じ記録を全文と項で名指せば全文。
      - 引けない id: 正本に無い id・条に無い規範文・行頭の項を持つ決定に無い項（字 ADR-n と空白と字「決定」と空白と半角の括弧の項の番号）を、要件書・判断の記録・規則行・条の順に 1 行ずつ末の 1 塊に並べる。名指した規範文が全部無い条と名指した項が全部無い記録は塊を出さない。
      - 置き場の読み（関数 build）: 名指し <ノート>#<行> を受け、置き場の design-note の下の <ノート>.yaml の契約表の行と、section の値と n が等しい散文の節の本文と、置き場の constitution.yaml・rules.yaml・srs.yaml と adr の下の ADR-*.yaml（名の byte 順・id は file の名の stem）を読む。名前空間は渡された置き場の 1 つだけ（根の design-intent を渡せば folio2 の同じ名の file を混ぜない・w150a の cases の 4 番の誤り）。断りは閉じた 2 値（Refusal の Row と Canon）で、Row は名指しの形の誤り（空の部分・ノートの名に字「/」か頭の字「.」）とノートか行が無い（終了 code 1）、Canon は正本かノートが読めない（2・まだ分からない）。
      - 入口（entry.rs）: 公開の関数 context は置き場と名指しを受け、Ok は塊の字、Err は終了 code と理由の 1 行を返す（関数 build と Refusal の split を呼ぶだけ）。clap の命令の一覧には足さない（folio の命令の閉じた一覧 12 と、着地済みの歯 p1_commands_closed_list と、folio2 の憲法 P-1 の機構の注を替えない）。tz の口 context は次の行 k-ctx-cli が足す。

      範囲の外。器が便に渡すこと（契約表の導出物の欄 context・器の欄の読み・審査役の穴は後の行 v-ctx-field・f-ctx-derive・v-ctx-lens）。憲法の規範文の全部の写しを契約の審査に渡すこと（ADR-51 の決定 (3)・器の行）。code の層の塊（後段の行 c-ctx-code）。判断の記録の承認の欄の字（ADR-51 の決定 (1) は決定の字を名指す）。規則行の article の条の規範文を辿ること（名指し 1 段のまま）。塊の byte の上限（runner は全部・審査役は器の行が塊ごとに収める）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 番目の項は verify の 1 行目（差の hunk が全部木に在る）、2〜6 番目の項は 3 行目（folio の lib の歯 fctx_ の 5 本・在りかは context.rs の歯の区間）、最後の 7 番目の項は 4 行目（着地済みの folio の歯 p106_ の 2 本・在りかは tests/teeth1/modules.rs）で測る。verify の 2 行目（folio の clippy）は done の項に載せない守り。29a の第 0.14 版から、xtask の check は器の共通 verify が gate の各段で verify の行の前に撃つので verify に書かない。欄 done-teeth は書かない。

      構造の連鎖（木 6016bd77 で grep）。区切りの宣言は lib.rs の mod の列（名の順・constitution_enums の次）。層の表 LAYERS は名の順で層 3 の bundle の次に context を足す（context が名指す区切りは floor_note・graph・link・refs・verdict・yaml で、どれも層 3 以下・entry は層 5 で context を名指す）。歯から入口 entry を名指すと context から上の層への辺になり p106_edges_point_down が落ちる（試作で 1 度見た）ので、歯は関数 build と Refusal の split を直に撃つ。graph.rs の NODE_KINDS と refs.rs の SRS_ID_SECTIONS・RULE_SECTIONS は読むだけで替えない。folio の file の行の上限 1,500 に対し context.rs は 774 行・entry.rs は 743 行から 750 行・lib.rs は 70 行から 71 行。

      入口の赤。main 6016bd77 に層の表の 1 行だけを足した木（branch red-f）で、verify の 3 行目は filter に当たる歯が 0 本で rc 4（--no-tests=fail・180 本を飛ばした）、4 行目は rc 100（p106_layers_cover_every_module は宣言が無い context で、p106_edges_point_down は context.rs を読めないで落ちた）。

      試作と噛み。写し drafts/w171a で書く file は write-set の中で閉じる。木で verify の 1〜4 行目を字のまま撃って全部 rc 0。噛みは句ごとに 1 つの変異を当て、句の歯を 1 本だけ撃った（変異を env の印 W171A_MUT で切り替える 1 つの木を 1 度だけ組み、印ごとに撃った・印の無い対照は rc 0）。変異 51 を当て、全部が rc 100 で、どれも 1 本だけ撃った歯が落ちた（2 番目の項 13・3 番目 15・4 番目 3・5 番目 10・6 番目 10・7 番目は試作の途中の自然な噛み 1）。表は drafts/w171a/w/bite/bites.tsv。

      測り（ADR-51 の決定 (4) の最初の 1 歩・係 w171a の notes の 3 節）。試作の tz context で 29a の 23 行（着地 12・未着地 11）を組むと、塊の byte は着地の行で中央値 18,388（4,020〜36,500）・未着地の行で中央値 12,691（3,509〜36,010）。種ごとの和は受入基準 162,456 byte（109 塊・器の要件の受入基準が長い）と判断の記録 171,119 byte（48 塊・項の無い名指しで全文を出した記録は最大 19,661 byte）が大半。w150a の cases の設計の層の 7 件のうち、欠けた字が塊に入るのは 1・3・8・9 の全部と 4 の決定の項（4 の承認の裁定 id は入らない）で、10 の条 P-7 と 11 の条 P-13・P-2 の規範文と前例の行は入らない（10 は ADR-51 の決定 (3) の憲法の全部の写しが持つ）。
  - n: 30
    type: prose
    title: 行 k-ctx-cli — tz の口 context（判断の記録 ADR-51 の決定 (4) と帰結）
    body: |
      在りか。差の file docs/design/patch/k-ctx-cli.patch は、行 f-ctx-build の差を当てた木（写し drafts/w171a の branch w171a の 1 つ目の commit）に試作の commit 1 つを載せた木との差（4 file・12,069 byte・+242 −0）。新しい module crates/tsuzuri-boundary/src/cli/context.rs（68 行）と、cli/mod.rs の module の宣言と doc の 2 行と、main.rs の腕と doc の 2 行と、新しい歯の file tests/kctx.rs（170 行）。

      なぜ。判断の記録 ADR-51 の帰結の 2 つ目（同じ組み手を tz の口にも出し、席と係が起草の時に近い仕様を引けるようにする・落ちの多くは起草の側で器の材料だけでは起草の前に効かない）と決定 (4)（純関数と tz の口が着地した後に今の契約で測り直す）。測り直しの口もこの口を撃つ。

      形。
      - 口: tz context --row <ノート>#<行> [--dir <dir>]。旗は字「--名 値」と字「--名=値」の 2 形で、--row は要り、--dir は省ける（省けば撃った dir からの相対の design-intent・根で撃てば根の名前空間）。空の値・2 度の旗・知らない引数・--row の無い周は使い方の誤りで、標準エラーに字「tz context」と半角のコロンと空白と理由の字の 1 行と使い方の行を書いて 1。
      - 組みは folio の lib の入口 folio::entry::context（行 f-ctx-build）を撃つだけで、塊の字は 1 字も替えずに標準出力へ出す（末の改行は 1 つ・out.rs の emit）。入口の断りは終了 code（名指しの誤りとノートか行が無い 1・正本が読めない 2）をそのまま返し、標準エラーに字「tz context」と半角のコロンと空白と入口の理由の字を書く（out.rs の emit_err）。書かない。
      - 入口の振り分け（main.rs）: 腕 context を consult の次に足す。folio 由来の 11 の口の表 NAMES（cli/folio.rs）には足さない（着地済みの歯 tzent_names_are_the_eleven_mouths の 11 と要件 FR17 の字を替えない）。

      範囲の外。器の受付の宣言の口（後段の行 v-ctx-decl）。tz の help の頁。塊の byte の上限。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 番目の項は verify の 1 行目（差の hunk が全部木に在る）、2〜5 番目の項は 3 行目（境界の package の歯 kctx_ の 4 本・在りかは tests/kctx.rs・tz の binary を撃つ）で測る。verify の 2 行目（clippy）は done の項に載せない守り。xtask の check は器の共通 verify が撃つので verify に書かない。欄 done-teeth は書かない。

      構造の連鎖（f-ctx-build の後の木で grep）。tz の subcommand の振り分けは main.rs の 1 か所の match で、口の一覧を数で pin する歯は folio 由来の NAMES だけ（cli/folio.rs・歯 tzent_）。tz の使い方の行 USAGE（main.rs）は surface serve の行だけで subcommand を並べないので替えない。cli/mod.rs の module の宣言は名の順（context・folio・graph）。境界の file の行の上限 1,500 に対し main.rs は 234 行から 236 行・cli/mod.rs は 6 行から 8 行・新しい cli/context.rs は 68 行。

      入口の赤。f-ctx-build の木に歯の file tests/kctx.rs だけを足した木（branch red-k）で、verify の 3 行目は rc 100（4 本とも落ち、落ちた断言は tz の知らない subcommand の断り tz: subcommand と使い方の行）。

      試作と噛み。写し drafts/w171a で書く file は write-set の中で閉じる。木で verify の 1〜3 行目を字のまま撃って全部 rc 0。噛みは f-ctx-build と同じ 1 つの木（env の印 W171A_MUT・tz の binary は歯の process の env を継ぐ）で、句ごとの変異 11 を当て、全部が rc 100 で、どれも 1 本だけ撃った歯が落ちた（2 番目の項 2・3 番目 1・4 番目 5・5 番目 3）。
  - n: 31
    type: prose
    title: 行 cs-cred-claude — 相談の窓の囲いと読む道具から Claude の口座の資格の file を隠す（判断の記録 ADR-29 の決定 (7)(ウ)・memo t3-hub.86 の候補 1）
    body: |
      在りか。差の file docs/design/patch/cs-cred-claude.patch は、main 6016bd77 に試作の commit 413e4a8d（写し drafts/w170a）を載せた木との差（3 file・7,451 byte・+74 −7）。書く file は中核の consult/launch.rs と歯の束 teeth3 の cwarg.rs と fixture の 3 つ（境の歯の束 teeth5 の cwlch.rs は verify が撃つ置き場だけ）で、発効のノートの未着地の行の write-set に同じ file は無く、depends は空。拠りは判断の記録 ADR-29 の決定 (7)(ウ)（GitHub と ssh と git の資格の類の file を囲いから見えなくする）と memo t3-hub.86 の候補 1（検証役 qv169 の攻めと席の確かめ）。

      なぜ。相談の窓の囲いが見えなくする資格の file は、閉じた列 CREDENTIALS の 5 つ（~/.config/gh・~/.ssh・~/.git-credentials・~/.config/git/credentials・~/.cld-env）と、state dir の accounts・repo の台帳の鍵・共有の temp の 3 つで、読む道具の断りは accounts と台帳の鍵の 2 つ。Claude の口座の資格の file ~/.claude/.credentials.json（口座の置き場を替えない Claude Code が読む token・この host に在る）はどちらにも無い。窓は web の道具でどの URL へも出られる（決定 (7)(オ)）ので、信用できない字に操られた窓が資格を読んで外へ出しうる。Claude の口座の資格は決定 (7)(ウ) の資格の類に入り、決定の字を替えない直しなので持ち主の問いは要らない。

      形。 - 中核: launch.rs に私用の定数 CLAUDE_CREDENTIALS（字 ~/.claude/.credentials.json）を足し、CREDENTIALS を 6 つ（末が CLAUDE_CREDENTIALS）にする。settings は囲いの credentials の files を CREDENTIALS から組むので、files は 9 行になる（~/.cld-env の行の次）。permissions の deny に字 Read(~/.claude/.credentials.json) を末に足す（3 つ・Claude Code の許しの規則の字で ~/ は home の下）。検めの audit_permissions の求める字にも同じ字を足す（audit_sandbox は CREDENTIALS から組むので字を替えない）。
      - fixture: launch-argv.yaml の files に ~/.cld-env の行の次の 1 行と、deny の末の 1 つを足す。
      - 歯: cwarg.rs に歯 cwarg_hides_the_claude_credentials を足し、cwarg_audit_refuses_each_missing_key の列の数を files 8 から 9・deny 2 から 3 にする。use に CREDENTIALS を足す。module の doc に 1 行（Claude の口座の資格の file を囲いと読む道具の両方から隠し、どちらを欠いても検めが断ることを見る）を足す。

      窓の Claude Code が動き続けるわけ。囲いは殻の命令（Bash の道具とその子）にだけ掛かり、Claude Code の本体の process は囲いの外で口座の置き場（CLAUDE_CONFIG_DIR・話す窓は tmux の -e で継ぐ）から資格を読む。窓の口座の置き場は state dir の accounts の下で、囲いから見えないまま窓が動くことは相談の窓 cw1 の所見 cw1-1 の探りで確かめた。~/.claude/.credentials.json を覆っても本体の読みは替わらない。読む道具の断りは窓の道具の呼びにだけ効き、本体の資格の読みに効かない。在らない path の覆いは起動を止めない（cw1-1 で ~/.git-credentials は在らないまま窓が動いた）。

      ~/.claude の下のほかの物を足さない理由。projects（会話の記録）・history.jsonl・file-history・paste-cache は private の中身だが資格でなく、決定 (7)(ウ) の外で、読む根の絞り（memo t3-hub.86 の候補 2・持ち主に問う）で扱う。shell-snapshots と session-env は Claude Code の Bash の道具が囲いの中で読みうる置き場で、覆うと殻の命令が壊れうる。settings.json などの設定は資格でない。この行は資格の file 1 つだけを足す。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 番目の項は verify の 1 行目、2 番目と 3 番目の項は 3 行目（中核の歯の束 teeth3 の歯 cwarg_・在りかは cwarg.rs）、最後の 4 番目の項は 3 行目（着地済みの cwarg_ の 5 本）と 4 行目（境の歯の束 teeth5 の着地済みの歯 cwlch_ の 6 本・在りかは cwlch.rs・字を替えないので write-set に置き場だけの = で置いた・tz consult launch の argv は中核の argv と同じ字で比べる）で測る。verify の 2 行目（clippy）は done の項に載せない守り。29a の第 0.14 版から、xtask の check は器の共通 verify が gate の各段で verify の行の前に撃つので verify に書かない。欄 done-teeth は書かない。

      入口の赤。歯の file と fixture だけを試作の字にした main の木（launch.rs は main の字）で、verify の 3 行目は rc 100（cwarg_hides_the_claude_credentials・cwarg_matches_fixture・cwarg_audit_refuses_each_missing_key の 3 本が落ち、残りの 5 本は通る）。

      試作と噛み。写し drafts/w170a で書く file は write-set の中で閉じる（3 file）。verify の 2 行目から最後の行までは rc 0。噛みは句ごとに 1 つの変異を、環境の印で切り替える 1 つの木に当て、名指しの歯を 1 本の範囲で撃ち、13 の句（囲いの列に在る・mode が deny・読む道具の断りに在る・断りの字が同じ・囲いの列を除くと断る・断りを除くと断る・allow の mode を断る・同じ頭の別の字を断る・欠けの名は 1 つだけ・囲いの列に 1 つだけ・断りに 1 つだけ・断りの順・囲いの列の順）に 13 の変異を当てて全部 rc 100（組み立ての失敗の rc 101 は 0）。検めが列を除いた設定を断る句の 2 つは cwarg_audit_refuses_each_missing_key でも rc 100。印なしの対照と使わない印の対照は rc 0。

      範囲の外。state dir の accounts の symlink の先（口座の置き場の実体）の資格の file・ほかの資格の file の読む道具の断り・~/.claude の下のほかの物（上の段）・窓の読みの絞り（候補 2）・問う窓の環境の絞り（候補 3）。
  - n: 32
    type: prose
    title: 行 cs-gh-read — 相談の窓の殻の命令のネットワークに GitHub の読むだけの配り元 2 つを足す（判断の記録 ADR-53・ADR-29 の決定 (7)(エ) の部分の置き換え）
    body: |
      在りか。差の file docs/design/patch/cs-gh-read.patch は、main d4024496 に行 cs-cred-claude の差を当てた木（写しの commit fb3e62e5）に試作の commit ba908703（写し drafts/w172a）を載せた木との差（3 file・4,515 byte・+48 −5）で、cs-cred-claude の着地の後の main 4b0fa8b8 にも当たる。書く file は中核の consult/launch.rs と歯の束 teeth3 の cwarg.rs と fixture の 3 つ（境の歯の束 teeth5 の cwlch.rs は verify が撃つ置き場だけ）。同じ 3 file を書いた行 cs-cred-claude（4b0fa8b8 で着地）を depends に置く。拠りは判断の記録 ADR-53（持ち主の裁定 t3-hub.84.1・案 A）と要件 FR19 の字（要件書の版上げで同じ commit に置く）。

      なぜ。相談の窓の殻の命令が外へ出られる先は、閉じた列 DOMAINS の package の配り元 6 つ（pypi.org・files.pythonhosted.org・crates.io・index.crates.io・static.crates.io・registry.npmjs.org）だけで、GitHub にだけ在る OSS の code を窓で取り寄せて試せない（相談の窓 cw1 の所見 cw1-2 で github.com と 2 つの配り元が囲いに断られた）。ADR-53 は、読むだけの配り元 2 つ（file を 1 本ずつ配る raw.githubusercontent.com と source の圧縮 file を配る codeload.github.com）だけを足し、GitHub の本体と書きの口と release の添え物の配り先と広い形は許さないと決めた。許しは名だけで絞る（repo では絞れない）。

      形。 - 中核: launch.rs の DOMAINS の型を [&str; 6] から [&str; 8] にし、末に raw.githubusercontent.com と codeload.github.com をこの順で足す。DOMAINS の doc の 1 行（殻の命令のネットワークに許す package の配り元）を、許すドメインが package の配り元 6 つと GitHub の読むだけの配り元 2 つで拠りが判断の記録 ADR-53 であることを書く 2 行に替える（字は差の file）。設定 settings は許しを DOMAINS から組み、検め audit_sandbox は許しが DOMAINS の部分で空でないことを見る（どちらも DOMAINS を読むので code の字は替えない・許しの外の名は今の決まりのまま断る）。
      - fixture: launch-argv.yaml の settings の allowedDomains の 1 行の末（registry.npmjs.org の次）に 2 つの字を足す（行の数は替わらない）。
      - 歯: cwarg.rs の use の列に DOMAINS を足し（rustfmt の形で 2 行の折り返しが替わる）、歯 cwarg_matches_fixture は字を替えない。歯 cwarg_allows_github_read_only を歯 cwarg_audit_refuses_wide_sandbox の次（歯 cwarg_hides_the_claude_credentials の前）に、行 cs-gh-read を名指す doc の 1 行と共に足す（字は差の file）。断る名の 9 つは字のまま github.com・api.github.com・uploads.github.com・gist.githubusercontent.com・objects.githubusercontent.com・release-assets.githubusercontent.com・githubusercontent.com・*.githubusercontent.com・*.github.com。module の doc は替えない（同じ file を書く後の候補の行 cs-cred-links の差と当たりを分ける）。

