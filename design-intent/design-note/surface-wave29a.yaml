    type: prose
    title: 行 cs-cred-links — 相談の窓の囲いと読む道具から口座の置き場の実体と資格の file の全部を隠す（判断の記録 ADR-29 の決定 (7)(ウ)・memo t3-hub.86）
    body: |
      在りか。差の file docs/design/patch/cs-cred-links.patch は、main 03d28f85（行 cs-cred-claude の着地の後）に試作の commit 3f2d9d6a（写し drafts/w170a の branch l176）を載せた木との差（5 file・21,986 byte・+273 −29）。書く file の 3 つ（中核の consult/launch.rs・歯の束 teeth3 の cwarg.rs・fixture）は着地した行 cs-cred-claude と重なり、差はその行の差の後でだけ当たるので、depends は cs-cred-claude。拠りは判断の記録 ADR-29 の決定 (7)(ウ)（資格の file を囲いから見えなくする）と、memo t3-hub.86 の行 cs-cred-claude の試作で係 w170a が見つけた穴の 2 つ。

      なぜ（穴の 1 つ目）。state dir の accounts の子は器の口座の置き場で、器はそれを home の下の実体の dir への symlink にしてよい（器の account の module・退役は accounts/.retired の下へ同じ形で移る）。囲いは accounts の dir を空の tmpfs で覆うが、覆うのは dir の中の名だけで、symlink の先の実体（口座の資格の file と、その古い写しを持つ dir）は実体の path から読める。bwrap で同じ形の模型（無害な file）を撃つと、覆った path からは読めず実体の path からは読めた。Claude Code の文書（code.claude.com の sandboxing と settings と permissions の頁）は、囲いの credentials.files の deny は denyRead と同じ読みの断りで、Linux では項目はその名で照らし、指す先では照らさないと書き、読む道具の断りは頼んだ path か解いた先が規則に当たれば効くと書く。親の dir の規則が子の symlink の先に及ぶとは書かない。

      なぜ（穴の 2 つ目）。囲いは Bash の道具とその子だけに掛かり、Claude Code の文書は denyRead の項目は Read の道具を止めないと書く。資格の file の閉じた列 CREDENTIALS のうち読む道具の断りに在るのは行 cs-cred-claude の 1 つだけで、ほかの 5 つ（~/.config/gh・~/.ssh・~/.git-credentials・~/.config/git/credentials・~/.cld-env）は窓の Read と Grep と Glob の道具から読める。窓は web の道具でどの URL へも出られるので、どちらの穴も資格が外へ出る道になる。どちらも決定 (7)(ウ) の字を替えない直しで、持ち主の問いは要らない。

      形。 - 中核: 材料 Launch に欄 account_dirs（state dir の accounts の symlink の先・境が起こす時に解く・字の順で重なりなし）を足す。私用の fn hidden（囲いから見えなくする path の列・CREDENTIALS・accounts・account_dirs・台帳の鍵・共有の temp の順）と denied_reads（読む道具の断りの列・accounts・account_dirs の各々の Read(/<path>/**)・台帳の鍵・CREDENTIALS の各々の Read(<path>) と Read(<path>/**) の順）を足し、settings と検めの audit_sandbox と audit_permissions がこの 2 つを使う（行 cs-cred-claude の Read(~/.claude/.credentials.json) の 2 か所は denied_reads に入る）。資格の file には file か dir かの別を持たないので 2 つの字を置く（文書の例は dir に /** を付け、/** の無い字が dir の中に効くかを書かない）。
      - 境: consult/launch.rs に pub fn account_dirs を足し、material が state の canonical の path で呼ぶ。accounts と accounts/.retired を読み、子のうち symlink の物だけを、canonicalize で解けた先は canonical の path、解けない先は read_link の字を親の dir に継いだ path にし、並べて重なりを除く。dir が無ければ飛ばし、ほかの読めない dir と entry と link は UNKNOWN（rc 2）で断る。module の doc に 2 行を足す。
      - fixture: inputs に account_dirs（置き字 /A の 2 つ）を足し、files と deny を合わせる。
      - 歯: cwarg.rs の launch が account_dirs を読み、cwarg_hides_account_dirs_and_credential_reads を足し、cwarg_audit_refuses_each_missing_key の列の数を files 11・deny 16 にする。cwlch.rs の材料に空の account_dirs を足し、cwlch_account_links_are_hidden と cwlch_unreadable_accounts_refuse を足す（助けの fn put_accounts）。2 つの module の doc に 1 行ずつ足す。

      解けない先と読めない置き場の決め（条 P-7）。解けない link（先が無い・輪）は飛ばさず、link の字の path で覆う（在らない path の覆いは起動を止めない・相談の窓 cw1 の所見 cw1-1・後で先が作られても覆いが効く）。accounts が無い時は隠す実体が在らないので空の列（決めた結果で、分からないのではない）。accounts か accounts/.retired か entry か link が読めない時は、隠す物を決められないので起こさずに断り、断った dir と次の手を名指す（P-7.1 と P-7.3）。accounts の子のふつうの dir は accounts の覆いの中なので足さない。

      窓の Claude Code が動き続けるわけ。囲いは殻の命令にだけ掛かり、Claude Code の本体は囲いの外で口座の置き場から資格を読む。窓の口座の置き場（CLAUDE_CONFIG_DIR）は accounts の下の名で継がれ、殻の命令が読む置き場（shell-snapshots など）もその名の path なので、既に accounts の覆いの中に在る（覆いの後も窓が動くことは cw1-1 で確かめた）。実体を覆っても本体の読みは替わらず、読む道具の断りは窓の道具の呼びにだけ効く。

      ほかの行との当たり。置き済みで未着地の行 cs-gh-read（判断の記録 ADR-53）は、書く file の 3 つ（中核の consult/launch.rs・cwarg.rs・fixture）がこの行と重なる。ADR-53 の決定 (4) は、この続きの行の着地まで cs-gh-read の便を留め置くと決めたので、先に着地するのはこの行で、この行の depends に cs-gh-read を置かない（cs-gh-read の便の bead がこの行の便の bead に依存する）。2 つの差は main 03d28f85 の上で、一時の index に git apply --cached でどちらの順に当てても後の差が当たり、同じ木になる。この行の差の後に cs-gh-read の差を当てた木で、cs-gh-read の差の逆の当たりと、clippy（中核と境）と歯 cwarg_ の 10 本と cwlch_ の 8 本が rc 0（係 w176a）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 番目の項は verify の 1 行目、2 番目と 3 番目の項は 3 行目（中核の歯の束 teeth3 の歯 cwarg_・在りかは cwarg.rs）、4 番目と 5 番目の項は 4 行目（境の歯の束 teeth5 の歯 cwlch_・在りかは cwlch.rs）、最後の 6 番目の項は 3 行目と 4 行目（着地済みの歯）で測る。verify の 2 行目（clippy）は done の項に載せない守り。29a の第 0.14 版から、xtask の check は器の共通 verify が gate の各段で verify の行の前に撃つので verify に書かない。欄 done-teeth は書かない。

      入口の赤。2 つの src を行 cs-cred-claude の差の後の字（main 03d28f85 の字と同じ）に戻し、材料の欄 account_dirs だけを足した木（中核は欄を読まず、境は空の列を渡す）で、verify の 3 行目は rc 100（cwarg_hides_account_dirs_and_credential_reads・cwarg_matches_fixture・cwarg_audit_refuses_each_missing_key の 3 本が落ち 6 本が通る）、4 行目は rc 100（cwlch_account_links_are_hidden と cwlch_unreadable_accounts_refuse の 2 本が落ち 6 本が通る）。

      試作と噛み。写し drafts/w170a で書く file は write-set の中で閉じる（5 file）。verify の 2 行目から最後の行までは、試作の commit 3f2d9d6a で撃ち直して rc 0（係 w176a・main の動きの行 k-ctx-cli が境の crate を書いたため）。根の xtask の check（根の歯 3,312 本・入れ子の scribe2 は差が入力に触れないので省かれた）は、係 w170a が試作 07cb4078 の木で撃って rc 0。入口の赤と噛みは、係 w170a が main d4024496 に行 cs-cred-claude の差を当てた木の上の試作 07cb4078 で撃った（書く 5 file の base の字は main 03d28f85 と byte で同じで、差の file も同じ）。噛みは句ごとに 1 つの変異を、環境の印で切り替える 1 つの木に当て、名指しの歯を 1 本の範囲で撃ち、24 の句（囲いに実体を置く・断りに実体を置く・資格の path の断り・資格の下の全部の断り・実体の断りの字・実体の mode・検めが囲いの実体を求める・検めが断りの実体を求める・検めが資格の path の断りを求める・検めが allow の実体を断る・実体を 1 つずつ・材料の全部を求める・実体なしは足さない・断りの順・囲いの順・退役の dir を見る・解けた先は canonical・解けない先は link の字・ふつうの dir を足さない・字の順で重なりなし・退役が読めない時に断る・accounts が読めない時に断る・断りの rc 2・断りの次の手の字）に 24 の変異を当てて全部 rc 100（組み立ての失敗の rc 101 は 0）。印なしの対照と使わない印の対照は 4 本の歯とも rc 0。

