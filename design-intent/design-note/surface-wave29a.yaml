    title: 行 cs-env-closed — 相談の窓が持つ環境を閉じた列だけにする（判断の記録 ADR-29 の決定 (5)・memo t3-hub.86 の候補 3）
    body: |
      在りか。差の file docs/design/patch/cs-env-closed.patch は、main 24d43a19 に行 cs-gh-read の差を当てた木（写しの commit bda51a5c）に試作の commit 50f0e694（写し drafts/w177a の branch r2）を載せた木との差（5 file・20,484 byte・+260 −41）。書く file は中核の consult/launch.rs と境の consult/launch.rs と歯の束 teeth3 の cwarg.rs と歯の束 teeth5 の cwlch.rs と fixture の 5 つ。cwarg.rs の use の行を行 cs-gh-read の差も書くので depends に置く（cs-gh-read の差の無い木には当たらない）。拠りは判断の記録 ADR-29 の決定 (5) と要件 FR19 の字（どちらも替えない）と memo t3-hub.86 の候補 3（係 w173a の調べ）。

      なぜ。問う窓（席の子の claude -p）は席の環境から TMUX と TMUX_PANE の 2 つ（ASK_DROP）だけを外して全部を継ぐので、席の session の名乗り（CLAUDECODE・CLAUDE_CODE_SESSION_ID ほか）・窓どうしの連絡の token と socket（CLAUDE_CODE_MESSAGING_TOKEN・CLAUDE_CODE_MESSAGING_SOCKET）・資格の file を指す名・席の機能の旗・SSH_AUTH_SOCK・DBUS_SESSION_BUS_ADDRESS が窓と窓の殻の命令へ渡る（係 w173a が名だけを見た）。話す窓は tmux の -e で閉じた 4 つ（TALK_ENV）を渡すが、tmux の新しい窓は tmux の server の global の環境も継ぐので、SSH_AUTH_SOCK・DBUS_SESSION_BUS_ADDRESS・systemd の名・XDG_RUNTIME_DIR ほかが窓に届く（独立の socket の tmux 3.6b の模型で確かめた・-e では global の名を消せない）。席は決定 (5) の「起動の口は席の環境を継いで窓を起こす」を、口座（口座の置き場の環境変数）を継ぐことと読み、閉じた列の決めを問う窓にも、話す窓が tmux の server から継ぐ分にも当てると決めた（決定と要件の字は替えない・持ち主の問いは要らない）。

      閉じた列。窓の環境は、TALK_ENV の 4 つ（CLAUDE_CONFIG_DIR・PATH・TZ_CONSULT_ID・CLAUDE_CODE_TMPDIR・決定 (5) の閉じた列の口座の置き場と PATH と窓の id と私用の temp）と、窓の Claude Code と殻が動くのに要る席の 3 つ BASE_ENV（HOME・SHELL・LANG）だけで、話す窓は tmux が窓に置く 5 つ PANE_ENV（TERM・TERM_PROGRAM・TERM_PROGRAM_VERSION・TMUX・TMUX_PANE）を残す。足す名の要るわけ。HOME は Claude Code の囲いの path の ~/ を解く字（資格の file の覆いの ~/.ssh ほかが HOME の下を指す）と殻の道具の home。SHELL は Claude Code が Bash の道具の殻を選ぶ字（無いと PATH の zsh を先に選びうる）。LANG は日本語の字を扱う道具の locale（無いと C の locale で字を byte として扱う）。PANE_ENV は話す窓の端末の字（TERM が無いと画面を描けない・TERM_PROGRAM と版は Claude Code の端末の見分け・TMUX と TMUX_PANE は tmux の中の扱い）で、tmux がその窓に置く値を残し、席の値は渡さない。足さない名。USER と LOGNAME（使う道具は passwd から引ける）・席の TERM と色の名（話す窓は tmux の字・問う窓は端末を持たない）・EDITOR ほかの見た目の名・席の機能の旗と session の名乗りと連絡の token・SSH_AUTH_SOCK・DBUS_SESSION_BUS_ADDRESS・XDG_RUNTIME_DIR・systemd の名。

      形。 - 中核: launch.rs の ASK_DROP を BASE_ENV に替え、env の次に PANE_ENV と window_env（TALK_ENV と BASE_ENV の順の名と値の組・窓の id と私用の temp は env の値・ほかは呼ぶ側が渡す席の値・値の無い名は置かない）と keep_only（env の -S の字・頭の -i の後に、渡した名と PANE_ENV の名を名ごとに NAME=${NAME} の形で置き直す）を足す。TALK_ENV の字は替えない。
      - 境: 話す窓は window_env の組を -e で渡し、-- の後を env -S と keep_only の字と claude と argv にする（tmux は env の -S の字の中の名を -e と tmux の置いた値で解く・GNU coreutils の env）。問う窓は子の環境を空にして window_env の組だけを置く（ASK_DROP の外しと env の 2 つの置きを替える）。module の doc の 3 行を 4 行に替え、use の列から ASK_DROP・TALK_ENV・env を外して keep_only と window_env を足し、program の名 ENV（env）を足す。
