      試作と噛み。写し drafts/w152a で書く file は write-set の中で閉じる。verify の 2 行目から最後の前の行までは rc 0（器の clippy・器の lib の歯 vaccpt_ の 2 本・器の e2e の歯 vaccpt_ の 1 本と着地済みの pipe_preflight_ の 4 本と pipe_intake_ruling_ の 11 本）。根の xtask の check は rc 0（3 行を全部当てた木 2cb62054〔main 0ee9c0da の上〕で根の歯 3281 本・入れ子の器の歯 4089 本・器の clippy・器の xtask check まで。main 21cb093d に積み直した木 065b9ce3 で入れ子の 4 段〔build・歯 4092 本・clippy・器の xtask check〕も rc 0）。噛みは句ごとに 1 つの変異を当てた木で名指しの歯を 1 本の範囲で撃ち、8 つの句（dispatch と同じ読み手・行 id まで比べる・bead を id で引く・断りを数える・読めない周は事実・--placed の周だけ読む・事実の行の字・経路の字）に 9 の変異を当てて全部 rc 100。書き戻した後の対照は rc 0。

