      - Turn に欄 closed（stderr の 1 行）を足し、pipe/cli.rs の round_err が stderr に出す。行の字は closed-runs folded=n failed=n live=n ids=列か字 -（畳んだ便か畳めなかった便か亡骸が在る周だけ）。Turn を組む 2 か所（candidates.rs と hook/utterance.rs の歯）に欄 closed の None を足す。
