      なぜ。判断の記録 ADR-45 の門 H6 は、main を赤にした便の squash を閉じる口を求める。着地の口は main を進めた後の主実測が赤でも巻き戻さず Failed main-red を残す。その squash は後の便の push で remote に載り、先端の CI が success でも、その便の契約を着地の形で閉じる器の口が無い（終端だけの撃ち直しの前提の段は Landed だけ・pipe/cli/step.rs）。tsuzuri では 10-02 に 1 回起き（t3-hub.52.180・squash は今の remote の main の祖先に在る）、席は取り下げの形で閉じた。台帳は着地した契約を取り下げと記し、着地の記録にも載らない。同じ道の裏返しに、列の先頭が着地させた便の driver が番待ちの後の 1 回の読みを過ぎてから主実測を撃ち直し、Landed の後に Failed main-red を記帳した件が在る（器の memo t3-hub.74.49.3・tsuzuri の event logでは 0 件）。どちらも便の終わりの段が 1 つに定まらない穴で、直す file も重なる（land.rs と land/finish.rs）。

      形。
      - 記帳の口: fleet/store.rs の条件付きの追記の条件 NotStopped（emit と regate が段の記帳に使う 1 本）の判じに、追記する event の段を渡し、最後の段が Landed の便に段が Landed でない event を足す周を新しい断り StoreError の Landed で断る（Stopped の後の断りの隣・lock の中の判じ）。Landed の後の正しい記帳（終端の push と ci と close の RunDone と retire の RunStage）は段が Landed なので通る。pipe/mod.rs の emit は替えない。tsuzuri の event log の便 623 本にこの条件で断られる過去の記帳は 0 件。
      - 着地の口: land.rs の試行は、追随で main が替わっていないことを確かめた後、squash の前に settled_in_train で段を読み直し、終端なら Settled で返る（番待ちの直後の読みと同じ道・Landed なら already-landed の行）。
      - 終端だけの撃ち直し: cli/step.rs の terminal_only は前提の段に Failed を足し、Failed の便を新しい adopt へ渡す。adopt は最後の Failed の RunStage（detail が字 retired の retire の記帳を除く）の detail が main-red か main-unmeasured の周だけ受け、宣言の remote の main の先端を retire.rs の read_tip（ls-remote と fetch と object の確かめ）で読み、先端の祖先から本文に run の行を持つ squash を landed_squash_of（今の 1 本）で探す。在れば段 Landed の RunDone（detail は sha:squash main:先端 adopted）を 1 件積み、終端を新しい PushTip の値 Adopted で撃つ。受けない周は stdout の 1 行 run=便 id adopt=語（not-red・no-remote・not-on-remote）と rc 1 で何も書かない。event log と宣言と remote を読めない周は rc 2。Landed の便の今の道は settle に移して字を替えない（撃ち直しの行に受け入れの周だけ adopted=squash が入る）。
      - 終端: land/finish.rs の terminal は、PushTip の Adopted の周に push を撃たず、先端が squash を祖先に持つかを今の Behind と同じ照らしで確かめ、CI を先端で照合し、閉じの理由を今の Behind と同じ landed squash ci=success tip=先端 の形にする。CI が success でない周は今の終端の語で止まり bead は開いたまま（Landed の記帳は残り、次の撃ち直しは Landed の今の道になる）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 番目の項は verify の 1 行目（差の hunk が全部木に在る）、2 番目の項は 3 行目（器の lib の歯 vredc_ の 1 本・在りかは fleet/store.rs の歯の区間）、3〜5 番目の項は 4 行目（器の e2e の歯 vredc_ の 3 本・在りかは e2e の pipe/land/redclose.rs）、6 番目の項は 5 行目（着地済みの器の lib の歯 pipe_stop_driver_append_if_ の 1 本・同じ store.rs）、7 番目の項は 6 行目（着地済みの器の e2e の歯 pipe_land_already_landed_ の 3 本・在りかは e2e の pipe/land.rs）、最後の 8 番目の項は 7 行目（着地済みの器の e2e の歯 pipe_replay_ の 5 本・在りかは e2e の pipe/land/order.rs で、書かない file なので write-set に置き場だけの = で置く）で測る。verify の 2 行目（器の clippy）は done の項に載せない守り（歯の名で測る項でないので、審査の対応の表で歯の無い項になる・29a の第 0.6 版の便の契約の審査）。第 0.14 版から、xtask の check は器の共通 verify（.vessel.toml の common-verify）が gate の各段で verify の行の前に撃つので verify に書かない。欄 done-teeth は書かない（29a の第 0.7 版の 3 行と同じ形）。

      構造の連鎖（木 b91c8841 で grep）。append_if に条件 NotStopped を渡すのは pipe/mod.rs の emit（段の記帳の全部）と pipe/regate.rs の regate の記帳の 2 か所で、条件の判じの足しは呼び手を替えない（Landed の便の regate も断られる）。StoreError を match する読み手（hook/utterance.rs と fleet/lifecycle_line.rs）は残りの腕を持ち、網羅の match は無い。settled_in_train の呼び手は await_turn の後の 1 か所に試行の 1 か所が足される。PushTip を match する所は finish.rs の terminal の 3 か所で、全部に Adopted の腕を足した。terminal の呼び手は着地の列の終端と step.rs の settle の 2 か所。read_tip と RemoteTip は pipe の中に見える範囲のまま使う。器の file の行の上限は幅 120 で数えて fleet/store.rs が 1394 行から 1433 行（余地 106・growth 40）・pipe/land.rs が 1410 行から 1415 行（余地 90・growth 6）・pipe/land/finish.rs が 695 行から 704 行・pipe/cli/step.rs が 459 行から 543 行。

      入口の赤。lib の歯は src の fleet/store.rs の歯の区間に在るので、木 b91c8841 では verify の 3 行目の filter に当たる歯が 0 本で rc 4（--no-tests=fail）。e2e の歯の file だけを試作の字にした木 b91c8841（src は前の木の字）で、verify の 4 行目が rc 100（3 本とも落ちる）。

      試作と噛み。写し drafts/w153a で書く file は write-set の中で閉じる。verify の 2 行目から最後の行までは rc 0（器の clippy・器の lib の歯 vredc_ の 1 本と着地済みの pipe_stop_driver_append_if_ の 1 本・器の e2e の歯 vredc_ の 3 本と着地済みの pipe_land_already_landed_ の 3 本と pipe_replay_ の 5 本）。入れ子の器の歯は 2 行を当てた木で 4103 本が全部緑。根の xtask の check は木 d2b9ffe9 で rc 0。噛みは句ごとに 1 つの変異を当てた木で名指しの歯を 1 本の範囲で撃ち、12 の句（Landed の後の Landed でない段を断る・Landed の記帳は通す・段なしの記帳も断る・squash の前に段を読み直す・Failed を受ける・retire の記帳を読み飛ばす・push を撃たない・受け入れの印で積む・先端の CI の照合を名指す・remote の main の祖先を見る・main-red か main-unmeasured だけ・remote の無い repo は断る）に 12 の変異を当てて全部 rc 100。書き戻した後の対照は rc 0（vredc_ の lib と e2e・pipe_stop_driver_append_if_・pipe_land_already_landed_・pipe_replay_）。

