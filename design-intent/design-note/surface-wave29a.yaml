      構造の連鎖（木 0ee9c0da で grep）。preflight の呼び手は pipe/cli.rs の pipe preflight の 1 か所、render の呼び手は preflight の 1 か所。ALLOWED_PREFLIGHT の読み手は allowed_of の 1 か所。pointer_of の呼び手は candidates.rs の 2 か所と memo.rs の 2 か所（字と振る舞いは替えない）。read_ledger と one_read と timeout_of は seat/ledger.rs の既存の口で、裁定 id の判定（intake/ruling.rs の load）と同じ引数で読む。器の file の行の上限（1500・幅 120 で数える）: preflight.rs は 222 行から 362 行・args.rs は 245 行から 246 行・dispatch.rs は 1446 行から 1447 行（余地 54 で growth 1）。

