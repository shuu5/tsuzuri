      入口の赤。launch.rs を土台の字に戻し、歯と fixture だけを試作の字にした木で、verify の 3 行目は rc 100（cwarg_denies_edits_under_read_roots・cwarg_matches_fixture・cwarg_audit_refuses_each_missing_key・cwarg_hides_account_dirs_and_credential_reads の 4 本が落ち、残りの 6 本は通る）、4 行目は rc 0（8 本が通る）。

