  - n: 8
    type: prose
    title: 行 v-anchor-missing — 器の doctor が dir の無い anchor の登録 row と置き場の anchor の数えの元の row を名指す（判断の記録 ADR-44 の段 0）
    body: |
      在りか。差の file docs/design/patch/v-anchor-missing.patch は、main b4b816a6 と、その上に行 t-hook-drop の試作とこの行の試作を載せた木 3c211a5d（写し drafts/w151a-p の branch p-w151a）との、この行の書く 5 file の差（24,236 byte・5 file・新しい file 0・+159 −22）。行 t-hook-drop と書く file が重ならないので、main b4b816a6 と main 0ee9c0da に単独で当たる（git apply --check）。

      なぜ。器の局面の出力（fleet/lifecycle.json）は、置き場の登録 row の anchor（別の置き場を名乗る anchor を除く）と書き直しの repo を数え、2 つ以上なら 8 種の部品を理由 multi-anchor で測れないと名乗り、管理 tick の全部の書き直しを撃たない（器の設計 case-lifecycle.md 20 節 約束 1・在らない path の anchor も数える）。tsuzuri の置き場では、改名の前の anchor（dir が無い）の登録 row が退役されずに残り、出力が multi-anchor を名乗り続けた。doctor は突合の行で missing=1 と出すが、どの row を退けばよいかを名指さないので、席は event log を replay して row を探し、seat retire で手で直した（2026-10-04・係 w145a の調べ 1.2 節）。判断の記録 ADR-44 の G3（席が記憶で避けている失敗を構造へ上げる）として、doctor が元の row を名指す。数えの規則と局面の出力の形は替えない。

      形。
      - 器の lib の fleet/lifecycle_mark.rs: 関数 census_others（pub(crate)）を足す。置き場の登録 row（replay の後の鍵ごとの最新）のうち、anchor が別の置き場を名乗らず（names_other が偽）、正規化した字が repo の正規化した字と違う row を鍵の順に返す。census_anchors はこれを使い、1 本でも在れば Many、無くて repo が別の置き場を名乗れば Foreign、ほかは One（前の BTreeSet の数えと同じ 3 値・doctor が名指す row と数えの元を 1 つにする）。import の BTreeSet を外し Registration を足す。
      - 器の lib の seat/role.rs: 定数 ANCHOR_MISSING（字 anchor-dir=missing）と CENSUS_HEAD（字 anchor-census と半角のコロン）・関数 anchor_missing（std::fs::metadata が NotFound の周だけ真・権限などで読めない周は在ると読む）・with_anchor_words（行と row を鍵の順で対にし、在らない row の行の末尾に空白と ANCHOR_MISSING を足す）・census_line（pub・census_others が空なら None、在れば 1 行）を足す。doctor_lines は登録 row の行に heartbeat と tick の 2 項目を足した直後に with_anchor_words を通す（tick-unit の語はその後・着地済みの e2e の歯が tick-unit の語で終わる行を見るので前に置いた）。doctor_lines の引数は 5 つのまま（器の clippy の too-many-arguments の閾値 5）。
      - 数えの行の字: anchor-census: reason=multi-anchor missing=<target を , でつないだ字か -> present=<同じ形>。理由の語は局面の出力の定数 UNMEASURED_MULTI_ANCHOR の字。target は鍵（役割と anchor の字）の順。
      - 席の行の例: seat: role=orchestrator anchor=/x/old-name target=old:design account=a model=Opus default=Opus/xhigh paths=default heartbeat=on tick=absent anchor-dir=missing（--unit-dir の周はこの後に tick-unit の語）。
      - 器の binary の scribe2-boundary/src/main.rs: doctor の置き場の段で、seat::role::doctor_lines の直後に、--repo の値と replay の値がそろう周だけ census_line を撃って足す（1 行）。--repo の無い周は数えない（cwd を repo と読むと別の dir を数えて誤った Many を出す）。doc の 2 行を足す。
      - 器の e2e の tests/e2e/seat/register.rs: 在らない anchor（/repo・/repo/a・/repo/b）の席の行を字で見る着地済みの歯 3 本（seat_register_model_shows_in_the_doctor_rows_with_dash_for_none・seat_role_doctor_paths_names_default_declared_and_invalid_per_anchor・seat_defaults_doctor_adds_the_row_default_or_names_why_it_cannot）の期待の字に語を足す（定数 GONE_TAIL）。歯 vanc_doctor_names_the_gone_anchor_row_and_the_census と助け census_doctor を足す。snapshot e2e__seat__seat_doctor_external_form.snap の席の行に語を足す。
      - 語の鍵を anchor= でなく anchor-dir= にした理由: 同じ行の鍵 anchor= が既に path を持ち、tsuzuri の読み手（中核の seat.rs・account の host.rs と project.rs）は鍵の最初の値を読む。同じ鍵を 2 度置くと、最後の値を読む読み手で path が字 missing に化ける。

      歯（接頭辞 vanc_）。
      - 器の lib の歯 vanc_census_line_names_the_rows_outside_the_repo（seat/role.rs の歯の区間）: 置き場・repo の dir・在る dir（git の設定なし）・別の置き場を名乗る repo（git の設定 scribe2.stateDir が別の在る dir）・在らない 2 つの path の row で、数えの行を比べる。全部の row の見本は字 anchor-census: reason=multi-anchor missing=v:z,v:a present=v:present（在らない 2 つの row の anchor の順と target の字の順を逆にして鍵の順を測る）。否定の見本はそこから 1 句だけ外した組（repo の row だけ・在らない row だけ・在る row だけ・別の置き場を名乗る row だけ）。
      - 器の lib の歯 vanc_rows_mark_only_the_anchor_that_is_gone: 在る dir と在らない path の 2 row の行に、在らない row の行だけ語が付き、在る row の行は替わらない。
      - 器の e2e の歯 vanc_doctor_names_the_gone_anchor_row_and_the_census（PATH は /usr/bin と /bin・台帳の client を引かない）: repo の dir と在らない path の 2 row を seat register で積み、--repo つきの doctor の席の行と突合の行の直後の行を見て、--repo の無い doctor と seat retire の後の doctor を見る。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 番目と 2 番目の項は verify の 3 行目（器の lib の歯 vanc_census_line_names_the_rows_outside_the_repo と vanc_rows_mark_only_the_anchor_that_is_gone）、3 番目の項は 4 行目（着地済みの器の lib の歯 anchor_census_counts_the_registered_anchors_of_the_place・anchor_census_leaves_out_the_anchors_of_other_places・anchor_census_names_a_repo_of_another_place_foreign・census_anchors の書き替えの守り）、4 番目の項は 5 行目（器の e2e の歯 vanc_doctor_names_the_gone_anchor_row_and_the_census）、最後の 5 番目の項は 6 行目（xtask の check・入れ子の段の nextest が、書き替えた着地済みの e2e の歯 3 本と snapshot の歯 seat_doctor_external_form と、tick-unit の語で終わる行を見る着地済みの歯 seat_unit_doctor_names_present_absent_and_foreign_per_row を撃つ）で測る。verify の 1 行目と 2 行目は命令の rc で測る守り。

      構造の連鎖（木 3c211a5d で grep）。census_anchors の呼び手は fleet/lifecycle.rs の gather と fleet/lifecycle_partial.rs の tick_full で、引数と 3 値は替えない。census_line の呼び手は main.rs の 1 か所、with_anchor_words は doctor_lines の 1 か所。doctor の席の行を字で見る e2e は seat/register.rs の 4 か所（書き替えた）・seat.rs の snapshot（書き替えた）・seat.rs の tick-unit の語で終わる 2 か所（語を tick-unit の前に置いたので替えない）・seat.rs の tick の語の読み（語で読むので替えない）。器の file の行の上限（1500・幅 120 で数える）: fleet/lifecycle_mark.rs は前後とも 1494（growth 1）、seat/role.rs は 556 から 646。器の xtask の check は core-lines 83552/90000・boundary-lines 301/316・file-lines 1499/1500（最大の file はこの行の外）。

      試作と噛み。写し drafts/w151a-p（main b4b816a6 の上に行 t-hook-drop の試作）で書く file は write-set の中で閉じる（5 file）。入れ子の段（置き場 <target>/nested/scribe2・cwd scribe2/）で clippy --workspace --all-targets -- -D warnings は rc 0、nextest --workspace は 4081 本が全部通り、器の cargo xtask check は rc 0。verify の 2〜5 行目を字のまま根で撃って rc 0（lib の vanc_ 2 本・anchor_census_ 3 本・e2e の vanc_ 1 本）。根の xtask の check（入れ子の段を含む）は rc 0（根の歯 3277 本と入れ子の器の歯 4081 本が全部通り、入れ子の clippy と器の cargo xtask check も rc 0）。噛みは句ごとに 1 つの変異（17 = lib の vanc_ 12・e2e の vanc_ 3・lib の anchor_census_ 2）を当て、どれも名指しの歯が rc 100 で落ち、落ちた断言はその句の字。印なしの対照は rc 0（3 本）。seat retire の後に数えの行が消える句は、退役を読む replay（着地済み）の道なので変異を当てていない。

      範囲の外。局面の出力の形（unmeasured の項は part と reason のまま・tsuzuri の読み手を替えない）と数えの規則。dir の無い anchor の row の自動の退役。器の設計文書（凍ったまま・この節が新しい振る舞いを書く）。doctor の help の字（doctor は help の外）。
  - n: 9
    type: prose
    title: 行 v-notes-head — 起票の門の notes の頭の時刻（判断の記録 ADR-44 の決定 (3)・束 B03）
    body: |
      在りか。差の file docs/design/patch/v-notes-head.patch は、main 21cb093d に試作の commit を載せた木 3f160b87（写し drafts/w152a の branch w152a2）との差（3 file・17,784 byte・+189 −10・main 0ee9c0da の上で切った差と byte で同じ）。器の行 3 本の最初の行で、差は main の上で切った。

      なぜ。判断の記録 ADR-44 の決定 (3)（ほかの project でも起きる再発防止を器の構造へ上げる）・束 B03（係 w143a の仕分けの 2 番）。台帳の notes の頭の時刻（例 [席 YYYY-MM-DDTHH:MMZ]）は記帳の事実で、照合の材料になる。席は見込みの時刻（10 分の形 HH:MxZ を含む）と日本時間に Z を付けた字を書き、記憶の記録だけで 7 度と 1 度直した。席の会話の記録では、頭に Z の時刻を持つ note の書き 124 件のうち 43 件が書いた時より先の時刻だった（09-30〜10-03・先の量は 60 秒未満 10・5 分未満 18・5 分以上 15・係 w148a の実測）。誤りは全部が先の向きで、過去の向きの誤りは記録に無い。器の起票の門の notes の段は notes の本文を読む門で、本文の頭の時刻を器の時計と比べられる。器の設計文書 ledger-form.md §18 は凍ったまま（判断の記録 ADR-36 の決定 (7)）で、この節が新しい振る舞いを書く。 §18 の notes の段は、裁定の行と読めない書きに続く 3 つ目の断りを持つ。

      形。 - 読み: notes.rs に head_time と token_at を足す。頭の行は本文の最初の空でない行の頭の空白を除いた字で、字 [ で始まり字 ] を持つ時だけ読む。札は [ と最初の ] の間。時刻の字は札の中で最初に現れる字か、札に無ければ ] の直後の空白を除いた頭の字で、形は 5 つ（YYYY-MM-DDTHH:MMZ・秒の形 HH:MM:SSZ・小数秒の形 HH:MM:SS と字 . と数字 1 字以上と Z・10 分の形 HH:MxZ〔M は数字 1 字・x は字 x〕・時の形 HH:xxZ）。下の端は分の形が秒 00、10 分の形が分 M0 と秒 00、時の形が分 00 と秒 00、秒の形がその秒（小数は捨てる）で、日付と時刻は器の fleet::epoch_of に秒までの形で渡す（暦の外は時刻の字と読まない）。Z の無い字・日付と時刻の間が空白の字・日本時間の印・日付だけの字は読まない（ほかの席の台帳の頭の大半がこの形で、時間帯の分からない字を比べない・台帳 12 本の 4,000 余りの頭）。
      - 判定: judge に引数 now（UNIX 秒）を足し、裁定の行 → 読めない書き → 頭の時刻の順で、読めた本文のどれかの頭の下の端が now より大きい周に、語 notes-head-future（定数 HEAD_FUTURE）で断る。閾値を持たない（下の端が今より後だけ）ので rules 行を足さない。
      - 断りの字（既存の形の理由の段）: notes の頭の時刻 <時刻の字> が今の UTC <器の format_utc の字> より先 — 頭の時刻は書く直前に date -u +%Y-%m-%dT%H:%MZ の値で書く（見込みの時刻や日本時間の字に Z を付けない）。
      - 時計: ledger_guard.rs の decide が notes::judge に crate::seat::state::now_secs() を渡す（1 行）。module の doc の notes の段の文に頭の時刻を足す。
      - 経路の字を date の形にしたのは、門が本文を書き換えると通す周に 1 byte も書かない約束（LedgerDecision::Allow）を破り、器の hook に道具の入力を書き換える出力が無いから。
      - notes.rs の歯の区間に固定の時計 NOW（2026-10-05T00:10:30Z の秒）を置き、着地済みの歯の helper の judge の呼びに渡す（着地済みの歯の断言の字は替えない）。
      - e2e の hook/guards.rs の NOTES_NEXT を 3 つにする（語 notes-head-future の案内は字 date -u +%Y-%m-%dT%H:%MZ）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 番目の項は verify の 1 行目（差の hunk が全部木に在る）、2〜4 番目の項は 3 行目（器の lib の歯 vnhead_ の 3 本・在りかは hook/ledger_guard/notes.rs の歯の区間）、最後の 5 番目の項は 4 行目（器の e2e の歯 vnhead_ の 1 本・在りかは e2e の hook/guards.rs）で測る。verify の 2 行目（器の clippy）と 5 行目（xtask の check）は done の項に載せない守り（歯の名で測る項でないので、審査の対応の表で歯の無い項になる・第 0.6 版の便の契約の審査）。欄 done-teeth は書かない（入れ子の器の歯は器が選ぶ行を解けないので、書くなら項ごとに撃つ verify の行の番号になる。その形では、審査役が done の項の字が名指す歯の名を対応の表に書き、器がそれを宣言の歯の外の項目に数えて審査を INCONCLUSIVE に倒す・第 0.5 版の行 v-notes-head の便 t3-hub.80.19-20261004T182144Z の契約の審査）。

