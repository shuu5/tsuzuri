    body: |
      在りか。差の file docs/design/patch/v-review-dedup.patch は、main 58de8850 に試作の commit を載せた木 abaab2d7（写し drafts/w155a の branch w155a）との差（2 file・16,493 byte・+138 −6）。試作は main 14739c69 の上で作って 58de8850 へ積み直した（scribe2/ の下は同じ字で、差は byte で同じ・main 0e3102a0 も scribe2/ の下は同じ字）。ノート 29a のほかの器の行（v-notes-head・v-accept-ptr・v-drafts-env・v-closed-runs・v-red-close）の差の file の書く file と重ならない。

      なぜ。判断の記録 ADR-44 の段 3（AI に届ける）の前の 1 歩（係 w150a の調べの要約 2 と 9・4 節の表の 1 行目）。器の契約の審査（受付の直後の段 Reviewed）は、雛形 lens-contract.txt の穴 contract に契約の goal を、穴 design に材料 design.txt（出所の 1 行と設計の節の本文）を埋める。tsuzuri の契約表は導出物の toml で、行の goal が節の本文の全部（器の設計 contract-source.md の 47 節の 6）なので、同じ字が prompt に 2 度載る。便の記録の 624 便（2026-10-05 の pipe の下・受付の審査の材料の全部）のうち 622 便で design.txt の本文が契約の goal と byte で同じで、2 度目の字は 1 便の中央値 9,235 byte・p90 23,483・最大 58,450（合計 7,598,137 byte）。審査の上限 gate.token_cap（150,000 byte）の中で core（契約・節・要件・約束の行・done の項目）がこの字を食い、その残りに収める base の要約と外の材料（write-set の外の名指しの塊）が削られる。今の器の lens では 194 便の外の材料が切り詰めか落としを受け、9 便が base の要約の段を落とした。 判定の材料は替わらない（同じ字を 2 度読ませないだけ）ので、持ち主に問わない席の決め（係 w150a の 5 節）。

      形。
      - lens.rs に定数 SAME_GOAL（字は （本文は契約の goal と同じ字・上の契約の goal を節の本文として読む））と関数 design_hole を足す。design_hole は材料を最初の改行で出所の 1 行と後ろに割り、後ろが契約の goal で始まりその直後が改行か材料の末なら、goal の字を SAME_GOAL の 1 行に替えた字を返す（出所の 1 行と、goal の後ろの改行から後は 1 字も替えない）。goal が空の周と違う周は材料のまま返す。
      - prompt_of の引数の契約の本文を、本文と goal の組にする。契約の審査の腕は design_hole の字を contract_prompt に渡す（cap の照合も穴の字もこの字・contract_prompt は替えない）。diff の審査の腕は goal を使わない。
      - dispatch は state の字と契約 file の goal（Contract の欄 goal）を渡す。
      - 歯の区間の helper prompt_of は goal に空を渡す（着地済みの歯の字と断言は替えない）。module の doc に 1 段を足す。
      - 雛形 lens-contract.txt は替えない。lens の版の 1 行（--print-version）は雛形の hash を持つので版の字も替わらず、行の審査の記録の使い回し（器の review_ref.rs）は前の判定をそのまま写す（判定の材料は替わらないので写してよい）。
      - 比べの決め（実の材料で測った）。比べは byte で、前後の空白も改行も寄せない。624 便で、byte の比べ・前後の空白を剥がす比べ・空白の並びを 1 つに寄せる比べの 3 つとも同じ 622 便が同じ字になり、寄せて増える便は 0（寄せる理由が無く、寄せると違いを隠す側に倒れる）。goal の字は 624 便とも改行を持たない。同じでない 2 便: 1 つは md の契約表の行（docs/design/vessel-keys.md#v-field-schema・goal は行の title の 368 byte・節の本文は 11,048 byte）。もう 1 つは便 t3-hub.21-20260927T112128Z（行 contracts/surface-board.toml#g-gaps）で、受付の後に base の節に 1 文（204 byte・問いの頁の歯の file を write-set に入れる文）が足されて goal と違い、審査役がその違いを literal-mismatch の FAIL で捕まえた。違う周を本文のまま渡すのは、この違いが審査の材料だから。
      - 後ろの行（予想の印）。行の審査（先撃ち）の材料は、節の本文の後ろに予想の印の行（未着地の祖先の行・予想の base の断り）を足す（器の review.rs の stage と review_ref.rs の note_of）。design_hole は goal の後ろの改行から後を替えずに残すので、先撃ちの材料でも本文だけが 1 行になる。受付の審査の便の材料は印を持たない（624 便で 0）。
      - design.txt の file と中身は替えない。design.txt は先撃ちの材料の鍵（review_ref.rs の digest）・列外の鍵（dispatch の candidates.rs）・受付の焼き直しの物差し（intake.rs）が読み、要件 FR1049 は lens に渡した節の本文の写しを便の記録に残すと言う。替えるのは lens が claude に渡す prompt の字だけ。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 番目の項は verify の 1 行目（差の hunk が全部木に在る）、2〜5 番目の項は 3 行目（器の lib の歯 vrdup_ の 4 本・在りかは headless/lens.rs の歯の区間）、最後の 6 番目の項は 4 行目（器の e2e の歯 vrdup_ の 1 本・在りかは e2e の headless/lens.rs）で測る。verify の 2 行目（器の clippy）は done の項に載せない守り（歯の名で測る項でないので、審査の対応の表で歯の無い項になる・29a 第 0.6 版の便の契約の審査）。第 0.14 版から、xtask の check は器の共通 verify（.vessel.toml の common-verify）が gate の各段で verify の行の前に撃つので verify に書かない。欄 done-teeth は書かない（29a 第 0.6 版の決め・入れ子の器の歯は器が選ぶ行を解けない）。

      構造の連鎖（木 58de8850 で grep）。prompt_of の呼び手は dispatch の 1 か所と歯の区間の helper の 1 か所（着地済みの歯 8 本はこの helper を通る）。contract_prompt の呼び手は prompt_of の 1 か所。Contract の欄 goal は pub。e2e の helper（contract_in・material_in・run_lens・fake_claude）と外形の snapshot lens_contract_prompt_external_form（節の本文が goal と違う fixture）は替えない。器の file の行の上限（1500・幅 120 で数える）: lens.rs は 幅 120 で数えて 1019 行から 1136 行（余地 364）。e2e の file は上限の外（数えるのは crates の src だけ）。

      入口の赤。lib の歯は src の lens.rs の歯の区間に在るので、main の木では verify の 3 行目の filter に当たる歯が 0 本で rc 4（--no-tests=fail）。e2e の歯の file headless/lens.rs だけを試作の字にした main 14739c69 の木（写しの branch w155a-red・scribe2/ の下は 58de8850 と同じ字）で、verify の 4 行目は rc 100（goal の字が 2 度載り、同じ字の 1 行が無い）。

      試作と噛み。写し drafts/w155a で書く file は write-set の中で閉じる（2 file）。verify の 2〜4 行目は rc 0（器の clippy・器の lib の歯 vrdup_same_goal_body_becomes_one_line_in_the_hole・vrdup_body_off_by_one_clause_stays_whole・vrdup_note_lines_after_the_goal_stay・vrdup_cap_counts_the_one_line_and_the_room_goes_to_outside の 4 本・器の e2e の歯 vrdup_lens_child_puts_one_line_for_the_same_goal の 1 本）。入れ子の 4 段（器の build・歯 4,086 本・clippy・器の xtask check）は xtask と同じ引数と置き場（target/nested/scribe2）と cwd（scribe2/）で、nextest を --no-fail-fast にして試作の木 d7817054 で rc 0（器の xtask check は ok の 1 行で file-lines=1499/1500・core-lines=83574/90000・test-src-ratio=44200/93983）。 根の xtask の check は main 58de8850 に積み直した最後の木 abaab2d7 で rc 0（根の歯 3,296 本・host と wasm の clippy・面の組み立て・入れ子の 4 段で器の歯 4,086 本）。 噛みは句ごとに 1 つの変異を当てた木で名指しの歯を 1 本の範囲で撃ち、12 の句（同じ字なら 1 行にする・出所の 1 行を残す・1 行の字・design.txt を替えない・頭の空白を寄せない・末の空白を寄せない・改行で切れる所だけ・goal が空なら外さない・出所の行の後ろだけを比べる・後ろの行を残す・cap は 1 行の字で数える・lens の子は契約の goal を渡す）に 17 の変異を当てて全部 rc 100（cap の句は歯の断言を締めた後の木 abaab2d7 で撃ち直して rc 100）。書き戻した後の対照は rc 0（変異と歯の表は係の bites.tsv）。

      効きの見込み（624 便の受付の審査の材料に、今の器の lens（PATH の binary）と試作の lens を偽の claude で撃ち、claude に渡る prompt を測った・係の real-summary.txt）。core の byte は中央値 25,220 から 16,166・p90 55,461 から 31,699・最大 123,134 から 64,684 に減る。外の材料が切られない 429 便では prompt が中央値 8,205 byte・p90 22,681・最大 39,750（合計 4,621,706 byte）短くなる。切られている便では空いた byte に外の材料が入り、外の材料の切りが起きる便は 194 から 182（切りが無くなる便 12・新しく切られる便 0）、切り詰めの名は 822 から 747、落とした名は 22,818 から 21,626、base の要約の段を落とす便は 9 から 1 になる。外の材料は 1 便の中央値 75 KB・最大 977 KB（係 w150a）なので、空く 9 KB では多くの便の切りは残る（残りの収めは段 3 の近傍の行の話）。cap 越えの INCONCLUSIVE は前も後も 0。

      範囲の外。runner の prompt（runner は契約の写しを受け、設計の節を別に受けない）。gate の審査役（diff の雛形は穴 design を持たない）。md の契約表の行（goal は行の title で本文と違う）。雛形の字の替え。材料の file design.txt の中身の替え。近傍の材料（段 3 の後の行・係 w150a の 4 節）。
  - n: 15
    type: prose
    title: 行 v-scope-empty — 作り手の死んだ空の scope を管理 tick が止める（判断の記録 ADR-45 の門 H6・ADR-44 の G3）
    body: |
      在りか。差の file docs/design/patch/v-scope-empty.patch は、木 08aca306（main 0e3102a0 に 29a の器の行 5 本 v-notes-head・v-accept-ptr・v-drafts-env・v-closed-runs・v-red-close の差の file をこの順に当てた木）に試作の commit を載せた木 45654e4a（写し drafts/w156a の branch w156a）との差（5 file・21,057 byte・+256 −4）。差は main 0e3102a0 の素の木にも、5 本の差の前にも後にも当たる（5 本の書く file と交差しない）。後の main 273fb394（行 v-review-dedup の適用と v-notes-head の着地の後）にも、残りの差 5 本（v-accept-ptr・v-drafts-env・v-closed-runs・v-red-close・v-review-dedup）の前にも後にも当たる。depends は無い（29a のどの行とも write-set が file の名で交差しない）。

      なぜ。判断の記録 ADR-45 の門 H6（便の一生の閉じ）。10-04T18:36Z に、host の user の systemd に器の scope 41 本が active のまま残っていた（10-03T22:21Z〜10-04T18:32Z の作り・全部 TasksCurrent 0・MemoryCurrent 0・MemoryPeak 0・cgroup の populated 0・CollectMode は inactive-or-failed・作り手の pid は全部死んでいる・係 w154a の読むだけの測り）。席は 10-04 に 38 本を手で止めたが、10-04T19:23Z にまた 4 本が残っていた（同じ形・17:41Z〜18:57Z の作り・10-03T22:21Z からの約 21 時間で 42 本＝1 時間に約 2 本）。名は全部 器の名-s2-kill-<時刻>-common-2-<pid>-2 で、場所の s2-kill-<時刻> は器の e2e の歯（pipe/spawn/question.rs の pipe_resume_kill_at_implemented_resumes_to_landed_in_new_process と pipe_resume_kill_dead_owner_lock_does_not_block_resume）が bead s2-kill で起こす便 id、段 common と番号 2 は gate の共通 verify の 1 行目（record の 2 番・toy の git rev-parse --verify）、pid は歯が process group ごと SIGKILL した pipe run、末尾の 2 はその process の 3 つ目の unit 名。歯は Implemented の記帳を見た直後に group を殺すので、gate の囲いの systemd-run --scope の起動の途中が当たる。器の合流（10-03）の後は tsuzuri の xtask の check の入れ子の段が器の e2e をこの host で撃ち、便の gate・終わりの門・列の候補・着地の確かめと係の確かめのどれでも残る。本番の便も driver が囲いの起動の途中で殺されれば同じ形で残る。

      残る理由。--collect は終わった unit を畳む旗で、active のままの unit には効かない。空になった scope を systemd が止めない形は systemd の既知の形（cgroup が空になった知らせが届かない scope が空のまま active に残る）で、作り手が死んだ後は器の誰も片付けない。止める口 pipe stop の片付け（作り手の死んだ scope に kill と reset-failed）は空の scope の段を替えない: 10-04T12:40Z に pipe stop が 1 回撃たれた（RunStopped が在る）後も、その前に作られた空の scope は残っていた。

      形。
      - 新しい module の pipe/confine/empty.rs（confine.rs は幅 120 で数えて 1,499 行で上限 1,500 なので本体を置かない・confine.rs には pub mod empty の 1 行だけ）。選びは、止める口の選び reap_targets（器の名で始まる・段の語 seat を外す・作り手の pid が生きた集合に無い）が残す unit のうち、systemctl --user show <unit>.scope -p TasksCurrent --value の答えが rc 0 で前後の空白を除いた字がちょうど 0 の unit だけ（empty_targets・show を撃つ口を引数に受ける・empty_from が答えを読む）。口 stop_empty_scopes は、一覧（confine の list_scopes）を 1 回引き、作り手の生死（confine の alive_creators・読めない作り手は生きている側）で選び、選んだ unit に systemctl --user stop --no-block <unit>.scope を 1 回ずつ撃つ。一覧を測れない周（道具が無い・rc 非 0）は何も撃たない。kill は撃たない（空の scope は止めれば inactive になり、--collect が畳む）。systemctl の綴りは confine の定数 SYSTEMCTL の 1 つ。
      - seat/tick.rs: 登録 row を持つ target の周（event log と manifest を読めた周）の、書き込みの測り（write_budget の sample）の後に、口を 1 回撃ち、返りは捨てる（判定行・rc・stderr・event log は替えない・書き込みの測りと同じ置き方）。module の doc に 1 段を足す。
      - e2e の seat.rs: 着地済みの tick の歯の置き場の helper 2 つ（tick_shims と move_shims）の偽の bin に、呼出を 1 行ずつ file（定数 TICK_SCOPE_CALLS の名 scope-calls）に残して何も出さず rc 0 で返る偽の systemctl を足す（両方とも host の PATH を後ろに持つので、足さないと着地済みの tick の歯 152 本が本物の systemctl を撃つ）。新しい e2e の file seat/empty_scope.rs の mod の行と module の doc の 1 行を足す。

      比べた形。 - 旗 --collect だけ（今の形）: active の unit を畳まない。 - 行の終端の片付けに stop を足す: 作り手が殺された周は片付けを撃つ者が居ない・verify 行ごとに systemctl の撃ちが 1 本増え、終端の撃ちの本数を pin する歯が落ちる。 - 止める口 pipe stop の片付けに stop を足す: 撃つ周が稀（10-04 は 1 回）で残りが溜まる・片付けの列を pin する着地済みの歯を書き替える。 - scope に RuntimeMaxSec を置く: 席の箱と runner の長さに合う値が無く、値は manifest の新しい rules 行と持ち主の裁定が要り、残りは上限の時間まで残る。 - 歯の側だけで止める（殺す歯を systemd-run の無い PATH で撃つ）: 本番の driver が殺された周の残りを止めない。 - 列の終端の掃除（pipe/sweep.rs）に足す: 終端の verb は器の e2e の多くの歯が本物の PATH で撃ち、掃除の行の字を等しさで見る着地済みの歯と止める口の一覧の回数を見る歯が host の残りの数で揺れる。 → 管理 tick が空の scope だけを止める形が、生きた process を 1 本も触らず、作り手の死んだ全部の残りを周期で畳み、着地済みの片付けの形を替えない。

      値と決定はしご。要るか: 要る（席の手の片付けの後も 1 時間に約 2 本の速さで増える）。既に在るか: 一覧（list_scopes）・作り手の生死（alive_creators）・選び（reap_targets）・綴り（SYSTEMCTL）は在り、そのまま使う（本文を替えない）。無いのは中の task の数の照らしと止める撃ちの 2 つだけ。閾値は持たない: 選びは事実の 3 つ（作り手の死・段の語・task がちょうど 0）だけで、作り手の生きた scope は起動の途中でも選ばれず、死んだ作り手は scope へ process を移せないので、時間の閾値も manifest と rules の行も要らない（器の宣言も rules 行も足さない）。消す物は席の手の片付け（照らしの script と名ごとの stop の列）。

      作り手の生死と段の語で選ぶ理由。作り手の生きた unit は起動の途中（systemd-run が自分を scope へ移す前で TasksCurrent が 0 に見える窓）でありうる。席の箱は作り手が起動の直後に終わる（器の設計 account-lifecycle.md §32 形 2）ので、起動の途中の席の箱を止めないよう段の語 seat を外す（止める口の選びと同じ外し）。登録 row の無い target の tick の周は撃たない（着地済みの歯が登録 row の無い置き場へ host の PATH のまま tick を撃つ・e2e の seat.rs の assert_tick_mouth）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 番目の項は verify の 1 行目（差の hunk が全部木に在る）、2 番目の項は 3 行目（器の lib の歯 vscpe_ の 1 本・在りかは pipe/confine/empty.rs の歯の区間）、3〜5 番目の項は 4 行目（器の e2e の歯 vscpe_ の 3 本・在りかは e2e の seat/empty_scope.rs・偽の systemctl は撃たれた引数を 1 行ずつ残す）で測る。verify の 2 行目（器の clippy）は done の項に載せない守り（歯の名で測る項でないので、審査の対応の表で歯の無い項になる・29a の第 0.6 版の便の契約の審査）。第 0.14 版から、xtask の check は器の共通 verify（.vessel.toml の common-verify）が gate の各段で verify の行の前に撃つので verify に書かない。欄 done-teeth は書かない（29a の第 0.7 版の器の行と同じ形）。

      構造の連鎖（木 08aca306 で grep）。tick の周の systemctl の撃ちは今は無い（tick の unit の有効化と撤去 seat/tick/install.rs は install と uninstall の verb だけ）。tick を撃つ e2e は seat.rs と seat/tick.rs だけで、登録 row の在る周の PATH は tick_shims か move_shims の偽の bin を頭に持つ（seat/tick.rs の full_path_without_bd も tick_shims の bin を頭に持つ）。unit の歯の置き場（seat.rs の unit_place）は偽の bin の systemctl を自分の記録の偽で上書きし、install と uninstall の verb だけを撃つ。pipe の歯の道具箱の偽の systemctl（e2e の main.rs の toolbox_path）は tick を撃たない。confine の reap_targets・list_scopes・alive_creators は子の module から使い、本文を替えない。器の file の行の上限は幅 120 で数えて confine.rs が 1,499 行から 1,500 行（上限ちょうど・growth 1）・seat/tick.rs が 1,283 行から 1,290 行・新しい pipe/confine/empty.rs が 105 行。

      入口の赤。lib の歯は src の pipe/confine/empty.rs の歯の区間に在るので、木 08aca306 では verify の 3 行目の filter に当たる歯が 0 本で rc 4（--no-tests=fail）。e2e の歯の file と seat.rs だけを試作の字にした木 08aca306（src は前の木の字）で、verify の 4 行目が rc 100（3 本とも落ちる・tick が一覧を撃たない）。

      試作と噛み。写し drafts/w156a で書く file は write-set の中で閉じる。verify の 2 行目から最後の行までは rc 0（器の clippy・器の lib の歯 vscpe_ の 1 本・器の e2e の歯 vscpe_ の 3 本）。入れ子の段（cwd scribe2/）で器の clippy --workspace は rc 0・器の歯 4107 本が全部緑（木 45654e4a）。根の xtask の check は木 45654e4a で rc 0（根の歯 3296 本・入れ子の器の歯 4107 本・器の xtask check の ok まで・器の数え file-lines 1500/1500・core-lines 84240/90000）。噛みは句ごとに 1 つの変異を当てた木で名指しの歯を 1 本の範囲で撃ち、21 の句（作り手が生きた unit・段の語 seat・名が器の名で始まらない・名の pid の欄が数でない・答え 2・答え [not set] と空・show の rc 1・show を起動できない・show を撃つ範囲・tick が口を撃つ・止める語 stop・--no-block・task がちょうど 0 の 1 本だけ・生きた作り手に show を撃たない・show の字・tick の外形が対照と同じ・event log の byte・一覧の rc 1・登録 row の無い target・tick_shims の偽・move_shims の偽）に 21 の変異を当てて全部 rc 100（組み立ての失敗の rc 101 は 0）。段の語・器の名・pid の欄・一覧の rc の 4 変異は、使い回す confine の reap_targets と listed_from に当てた。tick_shims と move_shims の偽の 2 変異は偽の記録の行き先を替える形（偽を外す形は本物の systemctl を撃つので当てない）。 書き戻した後の対照は rc 0（vscpe_ の lib と e2e）。

      範囲の外。今残る空の scope の片付け（席の手・行の着地の前に撃てる）。殺す歯が囲いの起動の途中を当てないこと（歯は今のまま・残りは tick が畳む）。止める口 pipe stop の行の scopes= の数が空の scope を畳めたと数えるかの照らし。doctor に残りの数の行を足すこと。作り手が死に中に process の残る scope（孤児）を tick が畳むこと（kill は止める口 pipe stop の役のまま）。

      ほかの project で。器の名・systemctl の一覧と show・作り手の pid の生死だけを読み、tsuzuri の字を持たない。host の置き場がいくつでも、作り手の死んだ空の器の scope を同じ形で畳む（scope は host の user の manager に 1 つ）。
  - n: 16
    type: prose
    title: 行 v-atk-names — 契約の審査の対応の表で、宣言の歯 @k の項に k 本目の検証行が選ぶ歯の名を内に数える（判断の記録 ADR-44 の決定 (1) の G3・ADR-45 の門 H1 の前）
    body: |
      在りか。差の file docs/design/patch/v-atk-names.patch は、main 273fb394 にノート 29a のほかの器の行 5 本（v-accept-ptr・v-drafts-env・v-closed-runs・v-red-close・v-review-dedup）の差の file を順に当てた木 e80728fb に試作の commit を載せた木 86e803ba（写し drafts/w157a の branch w157a）との差（3 file・21,284 byte・+139 −15）。書く 3 file は 5 本の差のどれも触らず、main 273fb394 の木と byte で同じなので、差は素の main にも同じに当たる（git apply --check rc 0）。29a 第 0.10 版の行 v-scope-empty の差（main 3d43114b）も 3 file に触らず、6 本の差を当てた木にも当たる。

      なぜ。判断の記録 ADR-44 の決定 (1) の G3（ほかの project でも起きる失敗を器の構造へ上げる）と ADR-45 の門 H1（器の宣言の鍵 teeth-check を tsuzuri で名乗る前に要る直し）。行 v-notes-head の便の契約の審査が、置く前の照らし（preflight・席の歯の欄の門）を全部通った後に 2 度倒れた。1 度目（便 t3-hub.80.19-20261004T182144Z・29a 第 0.5 版）は INCONCLUSIVE kind unparsed で、evidence は対応の表の欠け（無い番号 3 から 6 と形の合わない項目 4 件）。行は欄 done-teeth を入れ子の器の歯なので検証行の番号の歯 @k で書き、done の項の字は歯の名を持っていた。審査役は名の方を表に書き、器（review/items.rs の holes）はそれを宣言の歯 @k の外に数えた。evidence の本文は差の文脈・名・歯の断言・段の順が全部合うと書いていた。2 度目（第 0.6 版・欄を外した後）は FAIL vacuous-assert で、欄のために足した器の clippy の項と xtask の check の項が歯の名を持たない項として残った。 器の設計 contract-source.md の 66 節（凍った文書・判断の記録 ADR-36 の決定 (7)・この節が新しい振る舞いを書く）の形 1 は @k を k 本目の検証行の全体と決め、形 6 は表の歯が宣言の歯の外なら形の合わない項目に数えると決める。k 本目の行が選ぶ歯の名は、その行の全体の中の 1 本なので宣言の外でない。今の holes は字の等しさだけで照らし、この読みを落としていた。

      比べ（決定はしご）。候補は 4 つ。(a) holes が @k の宣言を、k 本目の行が選ぶ歯の名も内と読む。(b) 審査の雛形の項目の段が、@k の項は字 @k を書けと言う。(c) 受付か preflight が、done の項の字の歯の名が宣言の歯に無い行を断る。(d) 受付か preflight が、欄の無い契約の done の項で歯の名を持たない項を名指す。
      - (a) 要る（1 度目の形は、入れ子の crate や名の歯を gate が解けない置き場で欄を書く project のどれでも起きる）。既に無い（holes は字の等しさだけ）。既存で足りる（選ぶの述語 selects は受付の照らしと gate の段 ① が既に名の歯に使う 1 本で、借りるだけ・要素の読みも parse_element の 1 本）。1 行で閉じる（3 file）。審査を緩めない（字 - の項は歯の無い項目のまま・表の欠けの判定も残る・広がるのは @k の項の、その行が撃つ歯の名だけ）。1 度目の便の表（審査役が 3 から 6 番目の項に歯の名・ほかの項に @1・@2・@5 を書いた表）を今の holes に通すと記録の evidence と同じ字（無い番号 3 から 6 と形の合わない項目 4 件）、試作の holes に通すと揃った表（歯の無い項目 0）になる（係の写しで撃った）。
      - (b) 雛形の項目の段は既に宣言の歯から選べと言い（items.rs の DECLARED_TOOTH）、項の行に宣言の歯 @3 を添えていたのに審査役は名を書いた。字を強めるのは散文の規律で、器は効きを測れない（設計 64 節の却下と同じ）。nextest の形でない行の @k の項には (a) が効かないので、その残りに効く候補だが、今の項目の行と先撃ちの鍵を替えるだけの見返りが無い（照らしの表の残り 1 項）。入れない。
      - (c)(d) 器の設計 contract-source.md の 27 節（持ち主の裁定 2026-09-18・受付は契約の散文の goal と done を走査しない・字面の走査を別の面へ移さない）に外れる。preflight は受付と同じ判定の口なので同じ。done の字の書き方（「（歯 名）」）は tsuzuri の起草の型で、ほかの project の字を持たない。入れない。
      - 2 度目の形。done の項目は、外した実装で観測が変わる約束（落ちる歯を持つ）と、器の 4 つの仕組みだけが測る構造の制約（仕組みの歯 !）に分かれる（66 節の形 0）。器の clippy と xtask の check は 4 つの仕組みでなく、66 節の形 1 は読み手の無い形の検証行で測る項を @k で書くと決めるので、欄の無い契約ではその項を書く形が無く、done に載せないのが今の決まりで、2 度目は起草の誤り。tsuzuri の宣言が teeth-check を名乗ると、足した行と done を替えた行に欄が要り、欄の無い行は設計の PR の契約表の検査（席の着地の口の歯の欄の門が拾う語 done-teeth-missing）で止まる。欄を持つ行の clippy と xtask の項は @k で通る（1 度目の便の表でも 1・2・7 番目の項は @k で揃っていた）。この行は teeth-check を名乗る前に要る 1 歩で、2 度目の形は名乗りで閉じる。

      形。
      - items.rs に関数 declares を足し、holes の引数に検証行 verify を足す。declares は、表の歯が番号の宣言の歯と字で等しい（印 = の有無は問わない・今のまま）か、その番号の要素を parse_element で読んだ検証行の番号の歯 Line(k) の k 本目の検証行が、印 = を剥がした表の歯を selects（core の crate の名は gate と同じ name.rs の NAME）で選ぶ時に真。名の歯と既存の歯と仕組みの歯は字の照らしのまま。module の doc に 1 段を足す。
      - review.rs の Items を 3 つ組（項目の数・宣言の歯・検証行）にし、Reviewed の段は契約の検証行（Contract の欄 verify）を、行の審査の読み口 read_lens は審査の材料の契約の写しから Contract::load で読んだ検証行を渡す（読み関数 verify_of・読めない周は宣言の歯を読めない周と同じ INCONCLUSIVE）。read_lens の引数と呼び手 review_ref.rs は替えない。
      - 着地済みの歯 done_teeth_review_lens_tooth_outside_the_declared_is_misshaped の helper の holes の呼びに空の検証行の引数を 1 つ足す（断言の字は替えない）。
      - 項目の材料 items.txt・雛形・判定の 4 形・review.json の key・event の字は替えない。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 番目の項は verify の 1 行目（差の hunk が全部木に在る）、2〜4 番目の項は 3 行目（器の lib の歯 vatk_ の 3 本・在りかは review/items.rs の歯の区間）、5・6 番目の項は 4 行目（器の e2e の歯 vatk_ の 2 本・在りかは e2e の pipe/review.rs）で測る。verify の 2 行目（器の clippy）は done の項に載せない守り。第 0.14 版から、xtask の check は器の共通 verify（.vessel.toml の common-verify）が gate の各段で verify の行の前に撃つので verify に書かない。欄 done-teeth は書かない（この行の着地と binary の入れ替えの前は入れ子の器の行に欄を書かない）。

      構造の連鎖（木 86e803ba で grep）。holes の呼び手は review.rs の tip の 1 か所と歯の区間の helper の 1 か所。Items を組むのは Reviewed の段（review）と read_lens の 2 か所、読むのは read_outcome・tip・lens_outcome・decide。read_lens の呼び手は review_ref.rs の 1 か所（替えない）。selects と Tooth と parse_element は pub(crate) で、ほかの行の touches の型を新しく名指さない。器の file の行の上限（1500・幅 120 で数える）: review.rs は 1469 行から 1481 行・items.rs は 158 行から 240 行（growth に宣言）。e2e の file は上限の測りの外。

      入口の赤。lib の歯は src の items.rs の歯の区間に在るので、木 e80728fb では verify の 3 行目の filter に当たる歯が 0 本で rc 4（--no-tests=fail）。e2e の歯の file pipe/review.rs だけを試作の字にした木 e80728fb で、verify の 4 行目は rc 100（2 本とも、選ぶ名を書いた表の PASS が INCONCLUSIVE に倒れて落ちる）。

      試作と噛み。写し drafts/w157a で書く file は write-set の中で閉じる（3 file）。verify の 2〜4 行目は rc 0（器の clippy・器の lib の歯 vatk_names_the_kth_line_selects_are_inside・vatk_lines_that_select_no_name_keep_only_the_literal・vatk_named_and_kept_teeth_stay_literal の 3 本・器の e2e の歯 vatk_intake_counts_a_name_the_line_selects・vatk_row_review_counts_a_name_the_line_selects の 2 本）。入れ子の 4 段（器の build・歯 4,113 本・clippy・器の xtask check・xtask と同じ置き場と cwd で nextest を --no-fail-fast にして）と根の xtask の check（根の歯 3,296 本・host と wasm の clippy・面の組み立て・入れ子の 4 段まで）は試作の木 86e803ba で rc 0（器の xtask check は ok の 1 行で file-lines=1499/1500・core-lines=84221/90000）。噛みは句ごとに 1 つの変異を当てた木で名指しの歯を 1 本の範囲で撃ち、14 の句（@k の行が選ぶ名を内に数える・選ばない名は外・nextest の形でない行は名を選ばない・k は 1 から数える・本数の外の k は名を選ばない・= を剥がして照らす・--exact の行は等しい名だけ・ほかの番号の @k は広げない・名の歯は広げない・既存の歯は広げない・@k の項の - は歯の無い項目のまま・欄の無い契約は今のまま・Reviewed の段は契約の検証行を渡す・行の審査の読み口は写しの検証行を渡す）に 16 の変異を当てて全部 rc 100。書き戻した後の対照は rc 0。

      照らし。新しい読みは holes の外れの判定を狭めるだけ（今の外れ かつ k 本目の行が選ばない）なので、今まで揃った表が欠けに倒れる行と、受付・preflight・表の検査で断られる行は作らない（受付と preflight と表の検査の code は替えない）。欄 done-teeth を持つ契約表の行 20（器の設計の行 17 と 29a 第 0.5 版の 3 行・読んだ行は main の契約表の全部と 29a 第 0.5 版の 961）の項 200 のうち @k の項は 39 で、k 本目の行が nextest の形の項は 27、項の字が k 本目の行の選ぶ歯の名を持つ項は 17（29a 第 0.5 版の 14 と器の行 2 本の 3）。この 17 項は審査役が名を書くと今は表の欠けに倒れ、試作では揃う。残りは 1 項（器の設計の行 bz の 7 番目・xtask の check の行の @k で項の字が歯の名を持つ・nextest の形でない行は名を解けない）。

      限り。@k の行が nextest の形でない行（ほかの言語の test の撃ち手・門の command）の項は、今のまま字の @k だけを内に数える（器の名の読み手が nextest の形だけ・66 節の限界）。器の言語の表（判断の記録 ADR-44 の段 4）で selects が読む形を足すと、この読みも同じ 1 本でそのまま広がる。審査役が k 本目の行の選ぶ字の偽の名を書いても内に数える（字の @k を書いた周と同じ測り・名の在りかは gate の段 ① の名の歯の測りの側）。

      範囲の外。雛形の項目の段の字（候補 (b)）・受付と preflight の done の字の走査（候補 (c)(d)）・tsuzuri の宣言 .vessel.toml の teeth-check の名乗り（門 H1 の別の行・この行の着地と binary の入れ替えの後）・宣言の crate-roots への scribe2/crates/ の足し・器の設計文書の書き換え。
  - n: 17
    type: prose
    title: 行 v-ci-last — 着地の終端は CI の待ちが最後に読んだ答えで分け、push が押した commit で照合する（器の memo t3-hub.74.49.6・判断の記録 ADR-45 の門 H6 と H7・ADR-44 の決定 (1) の G3）
    body: |
      在りか。差の file docs/design/patch/v-ci-last.patch は、main e4a6d844 にノート 29a のまだ着地していない器の行 7 本（v-accept-ptr・v-drafts-env・v-closed-runs・v-red-close・v-review-dedup・v-scope-empty・v-atk-names）の差の file を順に当てた木 bf1feb39 に試作の commit を載せた木 94948518（写し drafts/w159a の branch w159a）との差（7 file・35,776 byte・+290 −31）。差は行 v-red-close の差を当てた後の木（7 本の途中の 09f6e4ef・1701b87d・fd9039f7 と 7 本の後の bf1feb39）と、main e4a6d844 に行 v-red-close の差だけを当てた木 7e5945af に当たる。素の main e4a6d844 と、行 v-red-close の前の木には当たらない（終端の push の塊と e2e の pipe/land.rs の mod の行の文脈が行 v-red-close の字）。書く file は行 v-red-close の write-set と 3 つ交わる（land/finish.rs・e2e の pipe/land.rs・置き場だけの e2e の pipe/land/order.rs）ので depends は v-red-close だけ（ほかの 29a の行とは file の名で交わらない）。器を書く便は同時に 1 本まで。

      なぜ。判断の記録 ADR-45 の門 H6（bead の一生の閉じ）と H7（器の宿題の始末・器の memo t3-hub.74.49.6 とまとめた 47.6・期日 2026-10-14）、ADR-44 の決定 (1) の G3（席の手で避けている失敗を器の構造へ上げる）。着地の終端が CI の緑の便を terminal:ci:unmeasurable で止め、bead が開いたまま残る。tsuzuri の置き場の event log（09-24T12:29Z〜10-04T20:16Z・25,096 行）で、終端の push の 409 回のうち 23 回（ほかは ci:success 386・ci:failure 0）。23 回を push から ci:unmeasurable までの秒と器の版で分けた。
      - 20 回は今の code に無い道。09-27 の 7 回（900 秒）は列の先端でない便が自分の sha の CI を上限まで待った形で、器の直し s2-07l.720（待たずに止める）の後の 13 回（0 秒・09-27T22:07Z〜09-28T03:09Z）も同じ便の形。器の直し s2-07l.688（先端の CI で照合する PushTip の Behind・09-28T05:08Z）の後は 0 回。
      - 2 回（09-30 の t3-hub.67.46 と t3-hub.52.152・どちらも 900 秒）は今も code に在る道 2。着地の番は便が Landed を記した時に空き、終端の push はその後なので、後の便が追随と squash を push の前に済ませると、push は後の便の commit まで押し、forge は push の先端にだけ CI の run を作る。自分の sha には run が無く、上限まで待って止まった。後の便の squash の commit の時刻が自分の push の時刻より前か同じ秒だったのはこの 2 回だけ（後の便が自分の sha の上へ rebase した回は 30 回で、残りの 28 回は squash が push の後）。forge の run は先端の commit に success で在り、席が手で閉じた。
      - 1 回（10-02 の t3-hub.52.199・push から 328 秒）は今も code に在る道 1。待ちは満ちた（forge の run は 02:45:05Z に success）が、終端はその後に CI をもう 1 回読み、その 1 回が測れずに（rc が 0 でない形）ci:unmeasurable に止まった。
      10-02T02:45Z の後の着地の 101 回では 0 回。どちらの道も、着地が混む時と forge の読みが一時に落ちる時にまた起きる。席は 23 回を手の script で閉じてきた（ほかの project の席はこの手を持たない）。

      比べ（決定はしご）。器の memo の候補は 3 つ。A 待ちが最後に読んだ答えを返し終端は読み直さない（memo の候補 1）。C push の後に押した先端を読み、自分の sha と違えば先端の側で照合する（まとめた 47.6 の候補 1）。B 終端が ci:unmeasurable で止まり bead が開いた Landed の便に、列の起こす側の 1 周が終端だけの撃ち直しを子で起こす（回数の上限つき・memo の候補 3・席の手の script を器へ移す形）。
      - A 要る（道 1 が今の code に在り 1 回起きた）。既に無い（待ちは解けたかだけを答え、答えを捨てる）。既存で足りる（待ちの loop は唯一の待機実装の 1 本のまま、観測の局所状態に答えを載せて返すだけ・述語の口も 2 本目の loop も足さない）。CI の読みが着地ごとに 1 回減る。
      - C 要る（道 2 が今の code に在り 2 回起きた）。既存で足りる（先端の側で照合する道は PushTip の Behind として在り、終端だけの撃ち直しが main の今の先端で側を選ぶ読みも在る）。読むのは push の後の remote の追跡の ref（git は push が押した値に揃える）で、local の main は読まない（push の後に main を進めた便がまだ押していない commit を照合しない）。追跡の ref が自分の sha の子孫で自分の sha でない時だけ側を替えるので、読めない repo（remote を名でなく URL で宣言した repo）と子孫でない形は今の終端のまま。
      - B 要らない。23 回の全部が A と C と器の前の直しで閉じる道で、B だけが拾う形（CI が rules 行 pipe.ci_wait_s の 900 秒より長い・forge の読みが上限の間ずっと落ちる）は 409 回で 0 回。拾う口は既に在る: 器の列の 1 周は止まった終端を席へ知らせ（idle の行の pending）、席は決着の権能 settle で pipe land --run <便> --terminal-only を撃てる（ほかの project の席も同じ）。B は回数の上限に新しい rules 行（持ち主の裁定）と列の 1 周の読みと子の起こしを足し、撃ち直しごとに上限まで待つ。A と C の着地の後に CI が緑の便の ci:unmeasurable が 1 回でも出たら、その形で B を問い直す（memo の引き金の再発 1 と同じ）。

      形。
      - 待ち（fleet/wait.rs）。1 周分の観測の局所状態 Glance に欄 ci（CiRead の Option）を足す。Completion の CiResult の周は 1 周の観測で CI を 1 回だけ読み（ci_read）、success か failure で満ち、答えを観測に載せる（満ちの判じは今の ci_now の Some と同じ）。is_met の CiResult の腕は LandTurn と同じく 1 周の観測へ委ねる。loop は private の watch の 1 本にし、満ちた周の観測か上限の周の最後の観測を返す。wait はそれを Ok と Err（Timeout）に写すだけ（外形と全部の呼び手は替えない）。新しい公開の口 ci_wait（Completion と上限を受けて CiRead を返す・CiResult でない値は Unmeasured）を足し、fleet の再輸出に 1 語足す。ci_now と ci_read は替えない。歯 vcil_ の 2 本は同じ file の歯の区間に足す。
      - 終端（pipe/land/finish.rs の terminal）。CI の照合を wait の後の ci_now の読み直しから ci_wait の答えへ替え、success は ci:success、failure は ci:failure、pending と unmeasured は ci:unmeasurable に写す（終端の 7 値・event の詞・close の理由の形は替えない）。push の塊の後に、受け入れ（PushTip の Adopted・行 v-red-close）でない周だけ新しい関数 pushed_past を撃ち、remote の追跡の ref refs/remotes/<remote>/main を rev-parse --verify -q で読んで、自分の sha でなく自分の sha が祖先の時だけその sha を返す。返った周は渡された側（Tip でも Behind でも）を先端の sha つきの Behind に替え、今の Behind の道（祖先の照らし・先端の CI・close の理由の tip=）をそのまま通す。import は ci_now と CiRun を ci_wait と CiRead へ替える。
      - e2e の歯（新しい pipe/land/cilast.rs・親の pipe/land.rs に mod の 1 行と module の doc の 1 句）。偽 CI は fake-ci.sh の差し替え、push の前後に main を動かすのは親の偽 git の口（shim_path と run_pipe_with_path）。
      - 着地済みの歯の書き替え（断言の数だけ）。e2e の pipe/land/order.rs の pipe_terminal_ci_poll_first_check_is_before_the_sleep の偽 CI の呼び出しを 2 回から 1 回へ・同じ file の pipe_terminal_ci_poll_interval_bounds_the_ci_calls の doc の読み直しの句を外す・e2e の pipe/land/retire.rs の pipe_train_terminal_every_run_checks_the_tip_ci_and_closes の偽 CI の呼び出しを 6 回から 3 回へ（読み直しの 1 回が消える分）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 番目の項は verify の 1 行目（差の hunk が全部木に在る）、2・3 番目の項は 3 行目（器の lib の歯 vcil_ の 2 本・在りかは fleet/wait.rs の歯の区間）、4〜7 番目の項は 4 行目（器の e2e の歯 vcil_ の 4 本・在りかは e2e の pipe/land/cilast.rs）、8 番目の項は 5 行目（着地済みの pipe_terminal_land_ の 7 本・e2e の pipe/land/order.rs）、9 番目の項は 6 行目（着地済みの pipe_terminal_ci_poll_ の 4 本・同じ order.rs）、10 番目の項は 7 行目と 8 行目（着地済みの pipe_train_terminal_ と pipe_train_tip_close_ の 1 本ずつ・e2e の pipe/land/retire.rs）、最後の 11 番目の項は 9 行目（着地済みの pipe_replay_ の 5 本・order.rs）で測る。行 v-red-close の受け入れの道（PushTip の Adopted）は push の後の読みを撃たないだけで、その歯 vredc_ の file e2e の pipe/land/redclose.rs は置く時の base に無い（受付の事前の点検が置き場だけの = を解けない）ので verify に置かない（試作の木では vredc_ の 3 本が緑）。verify の 2 行目（器の clippy）は done の項に載せない守り。第 0.14 版から、xtask の check は器の共通 verify（.vessel.toml の common-verify）が gate の各段で verify の行の前に撃つので verify に書かない。欄 done-teeth は書かない。

      構造の連鎖（木 94948518 で grep）。fleet::wait を呼ぶ file は 9 つ（pipe の stop・cli・cli/resume・ratelimit・health・admission・queue と fleet の usage・wait.rs の pid_gone）で、Completion の CiResult を組むのは終端の 1 か所だけ（ci_wait へ移った）。ほかの完了条件の満ちと周期と Timeout は替わらない。pipe の cli の land-window は待ちの後に窓を読み直すが、解けた直後に閉じた窓を clear と言わない設計の再評価なので替えない。ci_now の呼び手は wait.rs の歯だけになる（公開の口と fleet の再輸出は残す）。Glance を組むのは wait.rs の中の 4 か所と歯の 5 か所で、全部に欄を足した。PushTip の値は足さず、terminal の中の match 2 つの腕も替えない（受け入れを見る matches! が 1 つ増える）。先端を知る所は列の land_train と終端だけの撃ち直しの側の選びに、終端の push の後の読みが 1 つ足される（器の設計 §53 の行の約束の先端を知るのは land_train の 1 か所は、§58 の撃ち直しの側の選びで既に 2 か所になっている）。terminal の呼び手は着地の finish（単独の着地と列）と step.rs の終端だけの撃ち直しの 1 か所（Landed の道と行 v-red-close の受け入れの道が通る）の 2 か所で、呼び手は替えない。器の file の行の上限（1500・幅 120 で数える）: fleet/wait.rs は 1237 行から 1304 行・pipe/land/finish.rs は 704 行から 718 行（どちらも growth に宣言）・fleet/mod.rs は 1119 行のまま。e2e の file は上限の測りの外。

      入口の赤。lib の歯は src の fleet/wait.rs の歯の区間に在るので、木 bf1feb39 では verify の 3 行目の filter に当たる歯が 0 本で rc 4（--no-tests=fail）。e2e の歯の 4 file（cilast.rs・pipe/land.rs・order.rs・retire.rs）だけを試作の字にした木 bf1feb39（src は前の木の字）で、verify の 4 行目が rc 100（4 本のうち vcil_terminal_closes_on_the_read_the_wait_saw と vcil_terminal_checks_the_commit_the_push_carried の 2 本が terminal=ci:unmeasurable の rc 1 で落ちる・残りの 2 本は今の終端でも同じ答えの否定と裏の見本）。

      試作と噛み。写し drafts/w159a で書く file は write-set の中で閉じる（7 file）。verify の 2 行目から最後の行までは rc 0（器の clippy・器の lib の歯 vcil_ の 2 本・器の e2e の歯 vcil_ の 4 本と着地済みの 18 本・e2e の pipe::land の全部 199 本）。根の xtask の check は木 94948518 で rc 0（根の歯 3,296 本・host と wasm の clippy・面の組み立て・入れ子の 4 段〔器の build・器の歯 4,123 本・器の clippy・器の xtask check の ok の 1 行で core-lines=84327/90000・file-lines=1500/1500〕まで）。噛みは句ごとに 1 つの変異を当てた木で名指しの歯を 1 本の範囲で撃ち、11 の句（待ちの口は満ちた周の答えを返し読み直さない・failure の答えでも満ちる・上限の周は pending を unmeasured に畳まない・上限の周は最初でなく最後の周の答え・終端は待ちの答えで分け読み直さない・push が押した子孫の commit で照合する・押した commit は追跡の ref で読み local の main を読まない・押した commit は push の後に読む・子孫でない commit では照合しない・自分の sha の周は渡された側のまま・押した commit で照合した close の理由は tip= を持つ）に 13 の変異（終端の読み直しは書き替えた着地済みの歯 2 本でも撃つ）を当てて全部 rc 100。書き戻した後の対照は rc 0（vcil_ の lib と e2e）。

      範囲の外。B（終端だけの撃ち直しを列の 1 周が子で起こす形・回数の上限の rules 行）。rules 行 pipe.ci_wait_s と pipe.ci_poll_s の値。着地の番を終端の push の後まで持つ形（47.6 の候補 2・列の待ちが push と CI の待ちの分だけ延びる）。remote を URL で宣言した repo の追跡の ref の代わりの読み（ls-remote・今の終端のまま）。終端だけの撃ち直しの側の選び（step.rs・今のまま）。既に席が手で閉じた 23 本の bead。器の設計文書 contract-source.md の書き換え。

      ほかの project で。宣言の remote と ci-cmd と git の追跡の ref だけを読み、tsuzuri の字を持たない。remote を名で宣言した repo（git の既定の fetch の refspec）で道 2 が閉じ、URL で宣言した repo は今の終端のまま（道 1 はどの repo でも閉じる）。
