  - n: 5
    type: prose
    title: 行 c-commit-node — 着地の commit の節点と辺 landed と、着地の commit の無い着地した契約の床の値
    body: |
      在りか。差の file docs/design/patch/c-commit-node.patch は、行 c-g3-bindline を当てた木 7f767bd2 と、その上に試作を載せた木 905d1179（写し drafts/w146a の branch rows3）との差（14 file・+437 −24・33,808 byte）。行 c-g3-bindline と同じ file（中核の build.rs）を書き、差はその足しの上で切ったので c-g3-bindline の後（depends）。

      なぜ。判断の記録 ADR-46 の決定 (2)（節点に着地の commit を足し、辺 commit → bead を組む）と ADR-45 の門 H4。導出グラフは commit の節点を持たず、閉じた契約が着地の commit に結ぶかを測れない。器の event log の走行の終わり（RunDone）の detail は、着地した便では札 sha と半角のコロンの後ろに着地の squash の commit の名（40 字）を、札 main と半角のコロンの後ろに着地の後の main の先の名を持つ。この札から組めば git を読まずに済む（ADR-46 の決定 (5)・正本は器の event log）。名の形は ADR-47 の決定 (2)。
      実の記録での測り（席の台帳と器の event log・2026-10-05・係 w146a）。commit の節点 421・辺 landed 421。床の値（着地の commit の無い着地した契約）は 0。閉じた理由を問わずに数えると 4（取り下げで閉じ中身を別の便の commit に載せた契約 1・設計の行を指さない閉じた task 3）で、ADR-45 の門 H4 の「閉じた契約」の読みは持ち主への問い（席が起票した問い・その裁定の後に行 k-commit-count を置く）。

      形。
      - 契約の型（tsuzuri-contract の src/graph.rs）。節点の種類の閉じた列の末に Commit（電文の字 commit）を足して ALL を 21 個に、辺の型の閉じた列の末に Landed（電文の字 landed・着地の commit → 契約 bead）を足して ALL を 33 個にした。module の doc に 1 行。
      - 中核の組み（tsuzuri-core の src/graph/build.rs）。定数 RUN_DONE（字 RunDone）・SHA_TAG（字 sha と半角のコロン）・SHA_LEN（40）・SHA_TITLE（8）と、関数 landed_sha（detail をカンマと空白で切り、頭が札の切れの残りがちょうど 40 字の 0〜9 と a〜f の時だけ返す）。add_runs の末で add_commits を呼ぶ。add_commits は event log の行のうち種類が RunDone で、札の名が在り、走行の節点が在る行について、名ごとに 1 度 commit の節点（id は名・題は頭の 8 字・更新の時刻は行の ts・file と要約値と行と平易文と英語は持たない）を足し、走行の契約 bead（run id の前半・関数 run_bead）が在れば、名と bead の組ごとに 1 度 landed の辺を足す。
      - 出所（src/graph/mod.rs）。走行の記録の種類を Run と Commit の 2 つにした（event log が読めない周は commit も まだ分からない）。
      - 床の値（src/graph/check.rs）。関数 unlanded_contracts（グラフと台帳の字）は、台帳か走行の記録が読めない周と台帳の字が読めない周は まだ分からない。読めた周は、台帳の bead のうち閉じた理由が着地の述語（今の関数 landed・頭が landed か着地で、続きが無いか空白か全角の括弧）に当たり、グラフの種類が task で、commit の節点からの landed の辺を受けない bead の id を、字の順に並べる。tz graph --check に出すのは行 k-commit-count。
      - 面（tsuzuri-surface）。種類の表 src/mapview/band.rs の KINDS に Commit（帯 pipeline・語 k:commit）を足して 21 行、線の形 src/mapview/graph.rs の line_style で Landed を点線（RunOf と RanBy と同じ組）、語の辞書 vocab.json の english の節に k:commit と e:landed の 2 項を足した。
      - 着地済みの歯の書き換え。contract の snapshot graph.json（種類の列に commit・型の列に landed）・cform_graph.rs（21 と 33）・core の teeth1/dnedge.rs（33）・teeth2/graph.rs（読めない走行の まだ分からない の種類が run と commit）・surface の teeth4/mapgraph.rs（点線の型に Landed・型の数 33・種類の数の字 21 個）・teeth4/mapview.rs（21 行と commit の行）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 2〜10 番目の項は verify の 4 行目（新しい歯の file crates/tsuzuri-core/tests/cmtnode.rs の 9 本・項の順と歯の順は同じ）、11 番目の項は 5〜9 行目（着地済みの歯）、最後の 12 番目の項は 10 行目で測る。verify の 1 行目（差の hunk が全部木に在る）と 2・3 行目（clippy と wasm の clippy）は命令の rc で測る守り。

      構造の連鎖（木 905d1179 で grep）。NodeKind::ALL と EdgeType::ALL の数を断言する歯は上の着地済みの歯の 6 file で全部を直した。GraphNode の構築は add_commits の 1 か所を足しただけ。Source::kinds の読み手は unknown_kinds の 1 か所。unlanded_contracts の呼び手はこの行では歯だけ（境界の呼び手は行 k-commit-count）。書く src の file の最大は tsuzuri-core の graph/check.rs の 842 行（上限 1500）。

      入口の赤。木 7f767bd2 には歯の file cmtnode.rs が無いので verify の 4 行目は --no-tests=fail で落ちる。着地済みの歯は main の src で撃つと閉じた一覧の数（20 と 32）で落ちる。

      試作と噛み。写し drafts/w146a で書く file は write-set の中で閉じる（14 file）。木 905d1179 で verify の 1〜10 行目が全部 rc 0（xtask check は歯 3290 本が全部通り・入れ子の器は差が触れないので省いた）。噛みは 1 つずつ変異を当てて名指しの歯を --test 1 本の範囲で撃ち、16 の変異が全部 rc 100 で落ちた（電文の字を替える・landed の辺を足さない・大文字の 16 進を許す・40 字以上を許す・種類 RunDone を見ない・走行の節点の有無を見ない・同じ名の節点を重ねる・更新の時刻を持たない・出所の種類から commit を外す・床の値が着地の述語を見ない・種類 task を見ない・走行の記録の読めなさを見ない・辺の元を走行で数える・種類の表の帯を beads に・landed を実線に・語の辞書の e:landed を外す）。対照（書き戻した後の同じ撃ち）は rc 0。

      範囲の外。tz graph --check の行（行 k-commit-count）。file と定義と歯の節点（ADR-44 の段 4）。git の記録から commit を読むこと（ADR-46 の決定 (5)）。器の event log の札の形の変更（器の finish の書き手は替えない）。
  - n: 6
    type: prose
    title: 行 t-teeth-col — 契約表の欄の写しを器の今の版に揃え、設計ノートの行の欄 done-teeth を契約表へ写す（判断の記録 ADR-45 の門 H1 の 1 歩目）
    body: |
      在りか。差を切った main は b4b816a6。起草 w147a が main b4b816a6 の写しで試作した。書く file は write-set の 2（欄の写し 1・新しい歯の file 1）。差の file docs/design/patch/t-teeth-col.patch が字の正本（試作の差 12,783 byte）。

      なぜ。判断の記録 ADR-45 の門 H1 は、器が自分に掛けていた門の鍵 6 つの働きを tsuzuri で効かせることを求める。その 1 つ teeth-check（契約表の行が done の番号つきの項目ごとの歯を欄 done-teeth で名指し、器が表の検査・受付・gate の段 ① で照らす・器の設計 contract-source.md の 66 節・器の要件 FR1047 と FR1105）は、行が欄 done-teeth を書けることが先に要る。tsuzuri の契約表の行は設計ノートの契約表の節に書き、tz derive が contracts/<ノート>.toml へ写す。契約表の行の欄の集合と形は、tz（folio）が自分の型に持たず、根の写し contracts/field-schema/schema.toml を読んで決める（床の定数 EXTERNAL_PATH・欄の決まり design-note/schema.yaml の contract_table.external_schema・床の check_external_row と導出の derive_row が同じ写しの欄の列を読む）。写しは器の 2026-09-26 の版（scribe2 fd39667）の 18 欄で、器の今の欄の正本 FIELDS（scribe2/crates/scribe2/src/pipe/table.rs）の 20 欄より欄 done-teeth と code-facts が少ない。今の床は、行が欄 done-teeth を書くと 契約表の欄「done-teeth」が器の導出 file に無い で落ち、導出は 欄「done-teeth」が器の導出 file に無い で止まる（係 w147a の試し）。

      形（写し）。根の写しの 2 行目から後を、同じ repo の器の生成物 scribe2/contracts/schema.toml（器の命令 scribe2 contracts schema の出力・器の歯が core の FIELDS と byte で照らす）の 2 行目から後と byte で同じにする。足すのは欄 growth の塊の後の 2 つの塊（鍵 name の値 done-teeth と code-facts・鍵 need の値 optional・鍵 shape の値 list）の 10 行。頭の 1 行（注）は、写した元の字を 同じ repo の scribe2/contracts/schema.toml と日付 2026-10-05 に替える（器の版の commit の字を持たない）。

      形（folio）。folio の src と欄の決まりは替えない。床の欄の照らし（note.rs の check_external_row）と導出（derive.rs の derive_row と field_line）は写しの欄の列をそのまま読み、list の欄は文字列の一覧だけを受け、要素を書いた順のまま二重引用符で囲んで写す。欄の決まり design-note/schema.yaml の注は、欄の追加は器の版上げで足り判断の記録は要らないと書く（便 120 の先例）。folio の歯の材料の写し folio2/contracts/schema.toml（18 欄）は、行 v-field-schema の決めのとおり動かさない。

      形（歯）。新しい歯の file crates/tsuzuri-boundary/tests/dtcol.rs（段・群の main.rs を書かない・判断の記録 ADR-32）。頭の //! の行の続きのすぐ次の行に #![cfg(test)] を置く。置き場は CARGO_TARGET_TMPDIR の下の dtcol/<名> に歯ごとに作り、置き場で git init する（版管理の根を置き場にする。無いと tz は置き場を包む repo の根の写しを読み、置き場の写しを見ない）。5 つ目の項の歯が見る字は 行 b: 欄「done-teeth」が list の形でない（導出の断り）、7 つ目の項の歯が見る字は 行 a: 欄「done-teeth」が list（文字列の一覧） の形でない（床の断り）。7 つ目の項の歯の置き場は床の見本 floor_base の写しに根の写しを置いて git の add と commit を撃つ（床は commit の無い置き場を まだ分からない と読む）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done (1) は verify の 1 行目、(2) は 2 行目、(3)〜(7) は 3 行目（歯 dtcol_ の 5 本）、(8) は 4 行目（着地済みの歯 fsch_ の 3 本）、(9) は 5 行目。

      構造の連鎖。根の写しを読む物は、tz の床（tz check）と導出（tz derive）・着地済みの歯 fsch_ の 3 本（folio2/crates/folio/tests/tz4/resolve.rs・写しの中身の字を比べず形だけを見る）・この行の歯 dtcol_ の 4 つ。器は写しを読まず、欄を自分の binary の FIELDS から読む（PATH の器 0f6c2884 の scribe2 contracts schema は 20 欄を出し、toml の契約表の欄 done-teeth を読んで形を照らす・係 w147a の試し）。今の導出物は、どの行も 2 欄を持たないので 1 byte も変わらない（試作の木の tz derive --check が 一致 89・差分 0、tz check が rc 0）。この行の後、器の行が core の FIELDS と器の生成物を替えると、歯 dtcol_copy_matches_the_vessel_schema がその行の xtask の check で赤になるので、その行が同じ差で根の写しも写し直す（write-set に根の写しを置く）。席が新しい欄を設計ノートに書くのは、PATH の器を入れ替えて scribe2 contracts schema がその欄を出した後（器の設計 §66 形 8 の読み手が先の順）。

      試作と噛み。main b4b816a6 の写しに差を当てた木で、歯 dtcol_ の 5 本と fsch_ の 3 本が緑、clippy の行が rc 0。差の前の写し（18 欄）では歯 dtcol_ の 5 本が全部赤。書く file は write-set の 2 で閉じる。変異 9（写しの頭の行から写した元の path を外す・写しの約束の欄 place を抜く・2 欄の塊の順を替える・写しから欄 code-facts を抜く・欄 done-teeth の形を text にする・derive が一覧の要素を並べ替える・derive が list の欄の字 1 つを一覧として写す・derive が写しに無い欄を飛ばす・床が list の欄の字 1 つを受ける）で、名指した歯が rc 100 で落ちた（係 w147a の bite.py と bites.tsv）。 xtask の check（分けない全部）は試作の木で rc 0（2026-10-04T15:31〜15:36Z・workspace の歯 3,286 本が緑・入れ子の scribe2 は base b4b816a6 からの差が入れ子の入力に触れないので省いた）。

      filter の語。接頭辞 dtcol_ は main b4b816a6 の契約表の verify の filter の語 480 語のどれとも部分の字として重ならず、今の木の歯の名に字 dtcol を持つものは無い。歯の名 5 つは 480 語のどれも部分に持たない。

      流す時と順。depends は空。着地の後、席は設計ノートの行に欄 done-teeth を書ける（PATH の器は 20 欄を読む）。宣言 teeth-check の名乗りと席の設計の着地の口の門は、この行の後の別の手（係 w147a の notes の手順）。

      範囲の外。vessel 宣言の teeth-check と crate-roots・席の起草の型・器の code・導出グラフの歯の辺（判断の記録 ADR-46 の段 4）・欄 code-facts を使う行（器の宣言 index-scip と index-roles の名乗りの後）。

  - n: 7
    type: prose
    title: 行 t-hook-drop — tsuzuri の根の plugin の暫定の SessionStart を外す（判断の記録 ADR-38 決定 (6)(7)）
    body: |
      在りか。差の file docs/design/patch/t-hook-drop.patch は、main b4b816a6 と、その上に試作を載せた木 47204781（写し drafts/w151a-p の branch p-w151a）との差（14,258 byte・3 file・新しい file 0・+111 −171）。main 0ee9c0da（27b と 28a の廃止を戻した commit・書く file は替わらない）にも git apply --check で当たる。

      なぜ。判断の記録 ADR-38 決定 (6) は、器の行 v-brief-const が器の入れ替えで効くまでの暫定として、tsuzuri の根の plugin の SessionStart に要の写し contracts/seat/brief.txt を出す hook を置き（行 t-seathook・ノート surface-wave27b・着地済み）、決定 (6) の最後の文で、器の入れ替えの後に印が全部の席で効くと確かめた後の行で消すと決めた。器の binary は今、語 vessel と seat-constitution と --project と根の dir に rc 0 で答え（2026-10-05・係 w145a の調べ）、暫定の hook は撃たれても何も出さない。tsuzuri の席は t3:orchestrator の 1 つだけ。外すと決定 (7) のずれ（並びの hook の出力の順が決まらない）が閉じる。ADR-38 の本文は封のまま。

      前提（節に書く・審査は撃たない）。器の binary が上の問いに rc 0 で答えること。器を古い binary へ戻すと要の写しは出なくなるので、戻す時はこの行の差を逆に当てる。

      形。
      - plugin/hooks/hooks.json: 鍵 SessionStart と、その要素（matcher なしの 1 つ・hook は type command と timeout 10 の 1 つ）を消す。ほかの 5 つの鍵（PostToolBatch・PostToolUse・PreToolUse・Stop・UserPromptSubmit）の字は替えない。
      - crates/tsuzuri-core/tests/teeth2/gins.rs（着地した歯の module の書き替え・群 teeth2 の main.rs は書かない）: 歯 gins_pretool_bash_entry の event の鍵の一覧から SessionStart の 1 行を消すだけ。
