        done: (1) next の pub fn action（NextMove と対象の id の Option の &str と Mode を受けて Option の Link を返す・wasm の target に限らない）は、2 つの mode と 7 種で節の表の href と字を返し、止まっている走行となしに None を返し、pub fn window_of（NextMove を受けて Option の &'static str）は限度と移動と応答なしに account の windows の ACCOUNT_WIN を、ほかの 5 種に None を返す（歯 nxact_） (2) action の href は井桁より前の字を読み直すと同じ行き先に戻る（限度と移動と応答なしは account の selects が真で Tab の from_query が Home と Session、束の承認と質問は PageId の from_query が Ask、発効待ちは Gaps、質問の対象の id は frame の param の id の値を decode した字、どれも Mode の from_query が渡した mode）（歯 nxact_） (3) Big は pub な欄 target（Option の String）を持ち、着地済みの fixture の next-step.json の組 question で nq.4・stalled で nx.7・nothing で None、ほかの欄の値は今と同じ（歯 nxact_ と、直さずに通る着地済みの歯 nextstep_big_matches_each_fixture_set と nextstep_copies_lead_without_judging） (4) next.rs の mod dom は HelpCtx の context の mode を読み、大きい箱の link を Big の link か action の値から、今と同じ class act の div と class btn primary の a の要素（target は window_of の値が在るときだけ）で描く（歯 nxact_ が next.rs の字を読む・DOM は xtask の surface-build で組めることで見る） (5) link の字の 5 つの定数は節の字で、語の辞書の日本語の見出しの語のどれとも同じ字でなく（歯 nxact_ と着地済みの frame_no_heading_words_in_code）、next.rs の字の引用符で囲んだ nx_ の鍵は 1 度ずつのまま（着地済みの歯 nextstep_keys_one_table_in_declared_order が直さずに通る） (6) xtask の surface-build と check が通り、着地済みの歯はこの行の write-set の外の file を直さずに全部通り、足す外の依存は 0 本（xtask の check） (7) tests/nextact.rs の test の属性の付いた fn の名はどれも nxact_ で始まり、名から先頭の nxact_ を除いた字は、節に並べた filter の語のどれも部分の字として含まない（歯 nxact_ が自分の file の字を読んで全部の名を見る）
