  - n: 3
    type: prose
    title: 行 g-link-map — 地図の札と一覧の行の題を節点の頁への link にする
    body: |
      なぜ。節点の頁（行 g-node・着地済み）が在るのに、地図の頁の圧縮の面の札と一覧の面の行は字だけで、押しても節点の頁へ移れない（gap の調べの 0 節の 1）。見本は、圧縮の面の札（map.html の 34〜36 行の tag）・条の札の頭と規範文の子（47〜48 行）・一覧の面の行の題（97 行）を、どれも節点の頁への a の要素にする。src/mapview/compact.rs の 309 行と list.rs の 330 行の doc の「節点の頁はまだ無いので link にしない」は行 g-node の着地の後は古い。要件 FR5 の地図は圧縮・一覧・グラフ・表の 4 面を持ち、近傍は節点の頁が描くので、地図の面から節点の頁へ移れることがこの行の目的。
      在りか（着地済み・HEAD 03435c3 で確かめた）。
      frame。src/frame.rs の pub fn node_href（引数は節点の id の &str と Mode・返りは String・wasm の target に限らない・271 行）は、字 ?page=node&id= と、id を mapview の encode で %XX にした字（英数字と - と _ と . と ~ のほか全部）と、字 &mode= と mode の key をつないだ字を返す。Mode は frame の pub enum（Beginner と Expert・derive は Debug・Clone・Copy・PartialEq・Eq・pub const ALL・from_query は query の mode が expert なら Expert でほかは Beginner・host でも組む）。PageId は frame が pub use で再公開する生成の列挙（src/pages の file の名から build.rs が生成・変種 Node が在る）で、from_query は query の page の値が同じ id の頁（無い値と知らない値は Home）を返す。
      節点の頁の id の読み。src/project/nodearound.rs の pub fn id_of（引数は URL の query の &str・返りは Option の String・mapview の param で %XX と + を戻し、空なら無し・host でも組む・74 行）。節点の頁の 2 つの block はこの id で口を読む。
      compact.rs（322 行）。host の items は TAG_TITLE_MAX・cut30・Tag（pub な欄 id・title・class・shape・alert・id は節点の id）・Article（tag と規範文の id の Vec の norms）・Lane・Cards・BandBox（class と、出す順の id の全部を返す ids）・tag・compact（GraphDoc の参照を受けて 7 つの帯の BandBox の Vec を返す）・article_of。wasm の target のときだけの mod dom（215 行から・字 mod dom は file に 1 度）に pub fn view（引数は GraphDoc の参照・返りは AnyView）と、非公開の box_view・cards_view・tag_head（引数は Tag の参照・返りは AnyView・印と id の span と題の span の 2 つを返す）・tag_view（div の要素に札の class を付けて tag_head を包む・319 行）が在る。条の札（279 行）は div（class は art7 と帯の class）の中に tag_head の呼びを直に置き、規範文の子（275 行）は kids の div の中の span（字は規範文の id）。帯の札と beads の種類の行の札と条の見つからない規範文の札は tag_view で描く。
      list.rs（347 行）。host の items は BAND_PARAM ほかの鍵・NO_STATE・NO_GIST・Sort・Query（from_search）・Row（pub な欄 id・title・shape・alert・band・kind・state・id は節点の id）・PairNote・Listing（rows ほか）・pair_ends・state_rank・listing（GraphDoc の参照と Query の参照を受けて Listing を返す）ほか。mod dom（236 行から・字 mod dom は file に 1 度）に pub fn view（引数は GraphDoc の参照と URL の query の RwSignal の String・返りは AnyView）と非公開の row_view（引数は Row の参照・331 行）が在り、行の題は span（class の値 ttl・339 行）の中の span（data-t）。
      呼び手。compact の view と list の view を呼ぶのは src/project/map.rs の mod dom の中身の closure だけ（compact の view は電文だけ・list の view は電文と search を渡す・確かめた）。map.rs は行 g-map-keys の write-set なので、この行は 2 つの view の名と引数と返りを変えない。
      今の mode。board.rs の App が context に置く widgets の help の HelpCtx（wasm の target のときだけの pub struct・derive は Debug・Clone・Copy・pub な欄 open と mode・mode は RwSignal の Mode）に在る。同じ読みの関数が src/project/nodearound.rs の pub fn mode_of（wasm の target のときだけ・221 行で再公開・引数は URL の query の RwSignal の String・返りは Mode を返す Copy と Send と Sync の関数・HelpCtx が無ければ URL の query の mode）で、節点の頁の近傍の block はこれで link に mode を残す（465・481・593 行）。mapview の current（wasm の target のときだけ・今の URL の query の字）も在る。
      stylesheet と語。style.css（見本の ui.css の写し）に .tag・.tag .tid・.tag .tt・.art7・.art7 > a・.art7 > a .tid・.art7 > a .tt・.art7 .kids a・.items.rows .rowb .ttl の規則が在り（397〜419 行）、a の要素の既定は color inherit と下線なし（52 行）。class の tag・tid・tt・art7・kids・ttl は stylesheet に在る。この行は新しい class と語の鍵を足さない。
      形。
      圧縮の面。tag_view の要素を div から a にし、開きの tag の字を <a class=t.class.clone() href= で始める（class の次に href を書く・札の class の値は今と同じ・歯がこの並びの字を読む）。中身は今の tag_head の呼びのまま。条の札は tag_head の呼びを a で包み、字 {tag_head(&a.tag)}</a> を 1 行に書く（見本の .art7 > a）。規範文の子は span をやめて a にし、字 {id}</a> を 1 行に書く（見本の .kids a）。href はどれも frame の node_href に節点の id（札は Tag の id・子は norms の id）と今の mode を渡した字。tag_head の名と引数（Tag の参照）は変えない。309 行の doc から字「節点の頁はまだ無い」を外す。
      一覧の面。row_view の題の span（class の値 ttl）を a にし、開きの tag の字を、字 <a class= と引用符で囲んだ ttl と空白と href= で始める。見本の class は ttl と nl の 2 つだが、着地済みの近傍の一覧の行（nodearound.rs の 601 行）と同じ ttl だけにする（stylesheet の nl は注釈の箇条の ul.nl の規則だけで、a には効かない）。href は Row の id と今の mode を node_href に渡した字。id の span（class の値 nid）は a の外のまま（見本と同じ）。330 行の doc から字「節点の頁はまだ無い」を外す。
      今の mode の読み方は問わない。例は、一覧の面は view の引数の search を nodearound の mode_of に渡し、圧縮の面は view が search を持たないので HelpCtx を use_context で受け、無ければ mapview の current の字を Mode の from_query に渡す。mode の切り替えで href が今の mode に揃うよう、href は mode を読む closure にしてよい。mod dom の中の非公開の関数（box_view・cards_view・tag_view・row_view）の引数に mode の関数を足してよい。
      host の items（Tag・Article・Lane・Cards・BandBox・Row・Listing・tag・compact・listing ほか）は変えず、mod dom の中と 2 つの doc の字だけを書く。
      着地済みの歯（直すものは無い）。compact.rs と list.rs を名指して字を読む着地済みの歯は tests/mapview.rs の mapview_classes_and_keys_exist だけ（crates の tests の下を grep で確かめた）。これは map.rs と mapview の下の 7 つの file の、字 class= と引用符で始まる所の class の名を集め、全部が stylesheet の class に在ることと、tabs・band・art7・kids・tag・tid・tt・subh・cards7・filters・items・rows・rowb・nid・ttl・meta・bchip・gist・none・mx・mxwrap・mxlist・pair・pairnote・path・bn・shape・empty・open-q の 29 の名が集まることを見る。この行は compact.rs の class の字（tid・tt・kids・cards7・subh・empty ほか）を残し、list.rs の ttl の字は span から a に移るだけで 1 つ残るので、集まる名は変わらない（tag は Tag の class の値から、art7 は歯が自分で足す）。
      mapview_ のほかの歯（mapview_compact_bands_and_tags_in_order・mapview_unread_band_is_unmeasured_and_zero_band_is_empty・mapview_list_filters_and_sorts・mapview_every_tag_and_row_shows_id・mapview_query_keeps_view_and_filters ほか）は host の compact・listing・BandBox の ids・Tag と Row の欄の値を見るので、host の items を変えないこの行では直さずに通る。src の全部を歩く frame_no_heading_words_in_code（語彙の日本語の語を引用符で囲んで直に書かない）と frame_classes_are_in_stylesheet（src の class の字が stylesheet に在る）は、この行が語の字も新しい class も足さないので通る。引用符で囲んだ /api/ の字を足さないので parts_paths_distinct_in_block_modules も通る。mapview の下の file は block の module でないので、steady_・hsblock_・hsderive_ の歯は読まない。tests/snapshots の頁の写しは頁の枠と block の並びだけを持ち、DOM の中身を持たない。
      測り方。新しい歯は tests/maplink.rs に置き、名を mlink_ で始める。着地済みの行と、この波の行の verify の filter の語は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_ と、この波の mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_ の 66 で、新しい歯の名から先頭の mlink_ を除いた字は、このどれも部分の字として含まない（例 mlink_graph_x・mlink_mapview_x・mlink_project_x は不可・着地済みの行の filter に当たると、その行の歯の置き場が write-set の外に増える）。名の例（どの語も含まない）は mlink_hrefs_open_same_id・mlink_compact_tags_are_anchors・mlink_list_title_is_anchor・mlink_names_stay_apart。
      mlink_hrefs_open_same_id は tests/fixtures/surface/graph-doc.json（着地済み・今は 34 節点で、id にシャープの記号を持つ surface-board と g-map をシャープでつないだ id と t3.q2 と r をシャープでつないだ id が在る・確かめた・この行は触らない）を契約の型の GraphDoc に読み、compact の全部の箱の ids と、listing に Query の from_search の空の字を渡した行の id の全部を集め（空でないことだけを見る・数を持たない）、各 id と Mode の ALL の各値で node_href の字を作り、done (1) の 3 つを比べる（シャープの記号が %23 にならなければ id_of が切れた id を返して落ちる）。
      src の字の歯は CARGO_MANIFEST_DIR から src/mapview/compact.rs と list.rs を読み、字 mod dom の最初の所から後の字と file の全部の字で done (2) と (3) の在る無しを見る（DOM は wasm の target のときだけなので host では撃てない・DOM が組めることは xtask の surface-build で見る）。自分の名の歯は tests/maplink.rs の字を読み、test の属性の行の次の fn の名を全部集め（行 hs-blocks の hsblock_own_names_clean と同じ読み方）、名の数が 4 以上であることと done (5) を見る。fixture は足さない。
      依存は足さない。Cargo.toml と vocab.json と style.css と src/project/map.rs は触らない。
  - n: 4
    type: prose
    title: 行 g-link-graph — グラフの面の節点から節点の頁へ移る
    body: |
      なぜ。地図の頁のグラフの面（src/mapview/graph.rs）の節点は、押すと強調が固定されるだけで節点の頁へ移れない（gap の調べの 1.3 節の (c)）。見本は、固定の帯に節点の頁への link（ui.js の 762〜765 行の hlPin・語の鍵 open_node と字 ›）、節点を 2 回押すとその頁へ（789 行）、節点に focus が在るときの Enter と Space でその頁へ（1086 行・既定の動きを止める）を持ち、狭い幅の一覧の行も節点の頁への link にする（map.html の 180〜182 行の itemNode・ui.js の 601 行）。stylesheet は 760 px 以下で .gpanel の .gtools と .gzoom と .pinbar を隠し（style.css の 607 行）、.nb-chain は狭い幅（338 行からの 760 px 以下の規則）でだけ出す（273 行と 354 行）ので、狭い幅では一覧の行の link だけが節点の頁への道になる。着地済みの節点の頁の近傍の block（src/project/nodearound.rs）は固定の帯の link と 2 回押すを既に持つ（465 行と 484 行）。語の辞書の lg_hover の注釈は既に「2 回押す = その頁へ」と書く（vocab.json の 789 行）。
      在りか（着地済み・HEAD 03435c3 で確かめた）。
      graph.rs（1474 行）の host の部分は、配置・線・拡大・光らせ方・固定の移り方（pub fn pin_next と pub enum PinAction）・固定の帯の値（Highlight の bar が返す PinBar・欄 id・basis・impact・depth）・狭い幅の一覧（pub fn chain が返す ChainBand の Vec・ChainBand の rows は ChainRow で、ChainRow は pub な欄 id・title・shape・alert・kids を持つ）・数の行・凡例の純粋な関数と、pub fn node_svg（節点の箱の字・g の要素の class の値 node・data-key に id・tabindex 0）。441〜442 行の node_svg の doc に字「箱は link にしない（節点の頁は後の便）」が在る。
      wasm の target のときだけの mod dom（1070 行から・字 mod dom は file に 1 度）の pub fn view（引数は URL の query の RwSignal の String・返りは AnyView・1128 行）は、HelpCtx を use_context で受けて経験者の行の出し分けの関数を作り（1130〜1134 行・HelpCtx が無ければ URL の query の mode）、非公開の panel（引数は GraphView・固定の RwSignal の Option の String・拡大の StoredValue・経験者の関数・1221 行）を呼ぶ。panel は、window の keydown で Escape の固定の解除（1275 行）、図の div（class の値 gzoom・1388〜1391 行）に wheel・pointerdown・pointermove・pointerup・pointercancel・mouseover・mouseout・focusin・click の受け取り、固定の帯の中身の closure（1360〜1375 行・固定中の語と id と数の span と「解除」の button）を持つ。非公開の node_key（event の的に最も近い g.node の data-key）が節点の id を返す。非公開の chain_view（引数は ChainBand の Vec・1448 行）の行は li の中の span（class の値 ttl・1463 行）で、1447 行の doc に字「節点の頁はまだ無いので link にしない」が在る。
      呼び手。graph の view は src/project/map.rs の mod dom だけが呼ぶ（引数は search・map.rs は行 g-map-keys の write-set）。view の名と引数と返りは変えない。
      語と class。語の鍵 open_node は語の辞書（vocab.json）の rephrase の欄に在り（語は「頁へ」・確かめた）、nodearound.rs の 484 行が label で引く。class の btn と sm（.btn と .btn.sm の規則・style.css の 94 行と 579 行）と ttl は stylesheet に在り、どれも今の graph.rs の字にも在る。frame の node_href・Mode・PageId と nodearound の id_of と mode_of と widgets の help の HelpCtx は、行 g-link-map の節に書いた形（frame.rs・nodearound.rs・widgets は触らない）。web-sys の feature に KeyboardEvent と MouseEvent が在る（Cargo.toml・確かめた）。
      file の割り（器の受付の上限の余地・確かめた）。graph.rs は 1474 行で、器の受付は 1 module の上限 1500 行に対する余地 8 行が S の見込み 100 行に足りないとして、この行を断った（2026-09-28 の dispatch の cap-headroom）。そこでこの行は、wasm の target のときだけの mod dom の中身（1070 行の開き波括弧の次から file の末尾の閉じ波括弧の前まで・約 400 行）を、字を変えずに（字下げを 1 段外すだけ）新しい file src/mapview/graph/dom.rs へ移し、graph.rs では mod dom の doc と wasm の target のときだけの属性の行を残して、その次の行を mod dom の宣言の行（mod dom と ;）にする（graph.rs は mod.rs でない file なので、子の module の file は src/mapview/graph/dom.rs に置く）。dom の module の path は crate::mapview::graph::dom のままなので、中の use super の行と pub use dom::view の行はそのまま使える。graph.rs は縮むだけ（write-set の印 -）。移した字の class の字は、着地済みの歯 mapview_classes_and_keys_exist が決まった file の列（src/project/map.rs・src/mapview の mod.rs・band.rs・compact.rs・list.rs・table.rs・graph.rs・around.rs）から集めて stylesheet と比べるので、この行はその列に src/mapview/graph/dom.rs を足す（tests/mapview.rs を write-set に入れる・ほかの期待は変えない）。graph.rs を名指して読むほかの 2 つの歯（mapgraph_path_and_no_new_dependency の引用符の /api/graph/view の字が 1 度と 4 つの字の無いこと・parts_paths_distinct_in_block_modules の graph の PATH の字の在りか）は、PATH の定数が graph.rs の host の部分（23 行）に残るので直さずに通る。
      形。
      host の部分に pub fn opens_node（引数は KeyboardEvent の key の値の &str・返りは bool・wasm の target に限らない）を置き、字 Enter と空白 1 字（Space の key の値）でだけ真を返す（見本の 1086 行と同じ 2 つ）。
      view は今の mode を返す関数を作り、panel に渡す。読み方は問わない（例は HelpCtx の mode・無ければ URL の query の mode・nodearound の mode_of でもよい）。経験者の行の出し分けはその mode から導いてよい（help の shows_internal）。
      固定の帯。「解除」の button の前に a の要素を置く。開きの tag の字は、字 <a class= と引用符で囲んだ btn sm と空白と href= で始め、href は固定した節点の id と今の mode を node_href に渡した字、中身は label に鍵 open_node を渡した語と空白と字 ›（nodearound.rs の 484 行と同じ形）。
      図の div に on:dblclick の受け取りを足し、node_key が節点の id を返せば window の location の href を node_href の字にする（nodearound.rs の 462〜467 行と同じ）。on:keydown の受け取りを足し、opens_node が key の値で真で node_key が節点の id を返せば、既定の動き（Space の scroll）を止めてから同じく node_href の字へ移る。節点の外の key と、Enter と Space でない key では何もしない。Escape の window の受け取りは変えない。受け取りは図の div に置く（keydown は focus の在る g.node から図の div へ上がる）。
      狭い幅の一覧の行は、題の span（class の値 ttl）を a にし、開きの tag の字を、字 <a class= と引用符で囲んだ ttl と空白と href= で始め、href は行の id と今の mode を node_href に渡した字にする（nodearound.rs の 601 行の近傍の一覧の行と同じ形）。chain_view と panel の引数に mode の関数を足してよい。
      441〜442 行の node_svg の doc から字「節点の頁は後の便」を、1447 行の chain_view の doc から字「節点の頁はまだ無い」を外す（箱の字は link にせず、2 回押すか Enter と Space で移る、と書き直してよい）。node_svg と svg の返す字は変えない。host の関数の名と引数と返りは、opens_node を足すほかは変えない。
      着地済みの歯（直すものは 1 つ・mapview_classes_and_keys_exist の file の列に graph/dom.rs を足す・上の段）。graph.rs を名指して字を読む着地済みの歯は、tests/mapgraph.rs の mapgraph_path_and_no_new_dependency・tests/mapview.rs の mapview_classes_and_keys_exist・tests/parts.rs の parts_paths_distinct_in_block_modules の 3 つ（crates の tests の下を grep で確かめた）。mapgraph_path_and_no_new_dependency は、graph.rs に引用符で囲んだ /api/graph/view の字が 1 度だけ在ることと、4 つの字（.len() as・retain(・shown =・total =）が無いことと、面の crate の直接依存が契約の型の crate だけであることを見る。この行は /api/ の字を足さず、足す字にこの 4 つを書かない（例えば変数の名 shown と total を使わない）。mapview_classes_and_keys_exist は graph.rs の class の字を集めて stylesheet と比べ（この行が足す字の class は btn と sm と ttl で、どれも在る）、parts_paths_distinct_in_block_modules は graph の PATH の字が src に 1 度だけで graph.rs に在ることを見る。
      host の値を見る歯。mapgraph_ のほかの歯（layout・svg・node_svg・kids_badge・border・Zoom・highlight・pin_next・chain・count_line・legend・doc の値）と nodepage_ の歯（graph の highlight と line_style と LineStyle を使う）は、この行が host の関数の値を変えないので直さずに通る。mapgraph_kids_badge_and_ids_in_every_box が数える、g の要素の class の値 node で始まる箱の字の数 8 も変わらない。frame_no_heading_words_in_code と frame_classes_are_in_stylesheet は、語「頁へ」を直に書かず label で引き、新しい class を足さないので通る。mapview の下の file は block の module でないので、steady_・hsblock_・hsderive_ の歯は読まない。
      測り方。新しい歯は tests/graphnav.rs に置き、名を gnav_ で始める。着地済みの行と、この波の行の verify の filter の語は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_ と、この波の mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_ の 66 で、新しい歯の名から先頭の gnav_ を除いた字は、このどれも部分の字として含まない（例 gnav_graph_x・gnav_mapgraph_x・gnav_topbar_x・gnav_paragraph_x は不可・着地済みの行の filter に当たると、その行の歯の置き場が write-set の外に増える）。名の例（どの語も含まない）は gnav_enter_space_decide・gnav_hrefs_open_same_id・gnav_dom_wires_open・gnav_chain_rows_are_anchors・gnav_names_stay_apart。
      gnav_hrefs_open_same_id は tests/fixtures/surface/graph-view.json（着地済み・今は 8 節点・この行は触らない）を契約の型の GraphView に読み、全部の節点の id（空でないことだけを見る・数を持たない）と Mode の ALL の各値で node_href の字を作り、done (2) の 3 つを比べる。src の字の歯は CARGO_MANIFEST_DIR から src/mapview/graph/dom.rs を読んで done (3) を、graph.rs と dom.rs を合わせた字で done (4) を、2 つの file の字で done (7) を見る（DOM と事件の受け取りは wasm の target のときだけなので host では撃てない・組めることは xtask の surface-build で見る）。自分の名の歯は tests/graphnav.rs の字を読み、名の数が 5 以上であることと done (6) を見る。fixture は足さない。
      依存は足さない。Cargo.toml と vocab.json と style.css と src/project/nodearound.rs は触らない。
  - n: 5
    type: prose
    title: 行 g-map-keys — 地図の頁の面の tab を左右の矢印の key で切り替える
    body: |
      なぜ。地図の頁の 4 つの tab（圧縮・一覧・グラフ・表）は押すと切り替わるが、key では切り替わらない（gap の調べの 1.3 節）。tab は選んだ tab だけが tabindex 0 でほかは -1（見本の map.html の 218 行・本番の src/project/map.rs の 88 行も同じ）なので、Tab の key では選んでいない tab に focus が移らず、矢印の key が tab の間を動く唯一の手になる。見本（map.html の 289〜295 行）は、tab の keydown で右の矢印は次の面・左の矢印は前の面（端は反対の端へ回る）へ移り、既定の動きを止め、履歴に積み（show の push）、移った tab に focus を移す。要件 FR5 の「切り替えと段数と畳みは URL に残す」は、key で切り替えても押したときと同じく URL の query の view に残る。
      在りか（着地済み・HEAD 03435c3 で確かめた）。
      src/project/map.rs（116 行）は block の module。host の items は BLOCK（id map・見出しの鍵 map・class panel）・PATH（/api/graph）・PATHS（PATH の 1 つ）・FOLDS（空）・REASON・doc・body で、wasm の target のときだけの pub fn view（引数なし・返りは AnyView・51〜54 行）と mod dom（58 行から・字 mod dom は file に 1 度）が在る。mod dom の view は、URL の query の RwSignal を mapview の current で作り、window の popstate で読み直し、View の ALL の順に tab の button（role tab・id は字 tab- と面の name・aria-selected と tabindex は今の面かどうかで真と 0・偽と -1）を描き、押すと mapview の navigate に with_view の字を渡して履歴に積む（85 行・push は真）。map.rs は今、prevent_default と focus の字を持たない。
      src/mapview/mod.rs の pub enum View（Compact・List・Graph・Table・derive は Debug・Clone・Copy・PartialEq・Eq・Hash・host でも組む）は、pub const ALL（この順の 4 つ）・name（URL の値 compact・list・graph・table）・from_query（無い値と知らない値は Compact）を持つ。同じ file の pub fn with_view（引数は query の &str と View・返りは String・host でも組む）と、wasm の target のときだけの pub fn navigate（引数は RwSignal の String・字を変える FnOnce・push の bool）と current（今の URL の query の字）が在る。mapview の mod.rs はこの行で触らない。
      web-sys の feature に KeyboardEvent・HtmlElement・Document・Element が在り（面の crate の Cargo.toml・確かめた）、KeyboardEvent の key と prevent_default、HtmlElement の focus、document の get_element_by_id が使える。JsCast の dyn_into は web_sys の wasm_bindgen の path で graph.rs と nodearound.rs が既に使う。
      形。
      host の部分に pub fn tab_step（引数は今の面の View と key の値の &str・返りは Option の View・wasm の target に限らない）を置く。字 ArrowRight は View の ALL の次の面（Table の次は Compact）、字 ArrowLeft は前の面（Compact の前は Table）を返し、ほかの字は無しを返す（見本の 293 行と同じ 2 つの key・上下の矢印と Home と End は扱わない）。
      mod dom の各 tab の button に on:keydown の受け取りを足す。URL の query の今の面（View の from_query）と key の値を tab_step に渡し、Some なら既定の動きを止め（prevent_default）、押したときと同じく navigate に with_view の字を渡して履歴に積み（push は真）、id が字 tab- と移った面の name の要素を HtmlElement にして focus を移す。無しなら何もしない（Tab の key の focus の移りを止めない）。受け取りを tablist の div に置いてもよい（歯は mod dom の中の字を見るだけ）。
      BLOCK・PATH・PATHS・FOLDS・REASON・doc・body と、view の名と引数と返りは変えない。map.rs に details の要素・記録の関数の fold の呼び（前が英数字と下線と点でない字 fold と開き丸括弧）・引用符で囲んだ /api/ の字・新しい class・語彙の日本語の語の字を足さない（下の段の着地済みの歯がそれぞれを見る）。
      着地済みの歯（直すものは無い）。map.rs の字と定数を見る着地済みの歯（crates の tests の下を grep で確かめた）。mapview_classes_and_keys_exist（map.rs の class の字を集めて stylesheet と比べ、語の鍵 map と views が辞書に在ることを見る）・mapview_landed_shape_and_body（BLOCK の 3 つの値・PATH・body と doc の値・面の crate の直接依存の名が契約の型の crate だけ）・hsderive_consts_match_note（map の PATHS が PATH の 1 つで FOLDS が空・PATHS の行に引用符が無い・FOLDS の行が在る）と hsderive_module_returns_consts・hsblock_ の Module の歯（BLOCK）・frame_one_module_per_block（map.rs に字 id と引用符で囲んだ map が在る）・steady_details_use_fold_record（map.rs の details の数と記録の呼びの数が FOLDS の数 0 と同じ）・parts_paths_distinct_in_block_modules（引用符で囲んだ /api/graph が src に 1 度だけで map.rs に在る）・parts_ の 3 値の歯（map の BLOCK の id・body・REASON）・frame_blocks_without_data_are_unmeasured（map の body）・frame_no_heading_words_in_code と frame_classes_are_in_stylesheet（src の全部）。この行は host の定数と関数を変えず、足す字に上の字を書かないので、どれも直さずに通る。tests/snapshots/pages の map.json は頁の枠と block の並びだけを持ち、DOM の中身を持たない。
      測り方。新しい歯は tests/mapkeys.rs に置き、名を mkeys_ で始める。着地済みの行と、この波の行の verify の filter の語は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_ と、この波の mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_ の 66 で、新しい歯の名から先頭の mkeys_ を除いた字は、このどれも部分の字として含まない（例 mkeys_graph_x・mkeys_mapview_x・mkeys_frame_x は不可・着地済みの行の filter に当たると、その行の歯の置き場が write-set の外に増える）。名の例（どの語も含まない）は mkeys_arrows_wrap_around・mkeys_dom_wires_arrows・mkeys_names_stay_apart。
      mkeys_arrows_wrap_around は tab_step を done (1) の 8 つの組と、4 つの面と 9 つの字の組で撃って値を比べる。src の字の歯は CARGO_MANIFEST_DIR から src/project/map.rs を読み、字 mod dom の最初の所から後の字で done (2) の 4 つの字の在ることを見る（DOM は wasm の target のときだけなので host では撃てない・組めることは xtask の surface-build で見る）。自分の名の歯は tests/mapkeys.rs の字を読み、名の数が 3 以上であることと done (4) を見る。fixture は足さない。
      依存は足さない。Cargo.toml と vocab.json と style.css と src/mapview/mod.rs は触らない。
  - n: 6
    type: prose
    title: 行 g-link-kcard — pipeline の板の札を節点の頁への link にする
    body: |
      なぜ。要件 FR10 は「板と近傍図と問いの card が同じ id で連動する」と書く。見本の札（ui.js の 541〜549 行の kcardHTML）は、契約 bead の節点の頁への a の要素（class は kcard と nl・href は bead の頁）で、coach の 3 つ目（ui.js の 1115 行）は「札に指を置くと中身、押すと詳しい頁へ。」と書く。本番の札（src/project/pipeline.rs の 437 行）は div で、hover の card は付くが、押しても動かない。札を契約 bead と同じ id の節点の頁への link にし、hover の card はそのまま残す。要件 FR14 の「card を出すのは頁を持つ節点の札・圧縮された cell・記号だけの要素の 3 種だけ」の、頁を持つ節点の札に札が当たるようになる。
      在りか（着地済み・HEAD 03435c3 で確かめた）。
      pipeline.rs（448 行）は block の module。host の items は BLOCK（id pipe・見出しの鍵 pipeline・class panel）・PATH（/api/pipeline）・PATHS・FOLDS（空）・REASON・UNKNOWN_REASON・RUN_KEY・SHOW・QUERY_KEY・SOURCE・NO_AGE・NO_ACCOUNT・Lane・LANES・lane・Lead・Kcard・Column・age・cards・body・landed_today・content・title_of・columns・kcard・open_columns・with_open。pub struct Kcard（derive は Debug・Clone・PartialEq・Eq）は pub な欄 id（String）・title（Option の String）・state・lead・age・class（&'static str の kcard か kcard why-stop）・hover（widgets の hover の Card）を持つ。pub fn kcard（引数は契約の型の PipelineCard の参照と LedgerRow の slice・返りは Kcard）は、Kcard の id を札の contract（契約 bead の id）の字にする（257 行）。pipeline.rs は use で crate の frame を self と Block で取り込んでいる（13 行）。
      wasm の target のときだけの pub fn view（引数なし・返りは AnyView・319〜321 行）と mod dom（325 行から・字 mod dom は file に 1 度）。mod dom の view は net の now を content に渡し（371 行）、非公開の search が今の URL の query を返す（348 行）。非公開の kcard_view（引数は Kcard の参照・419〜447 行）は、div の要素（class は札の class・use:attach に札の hover の card の clone）の中に t と m の 2 つの div を描き、列の描き（column_view・392 行）が札ごとに呼ぶ。札の中に button などの押せる要素は無い。
      widgets の hover の attach（wasm の target のときだけ・pub fn・引数は web_sys の Element と Card・返りは無し）は、要素に pointerenter と pointerleave の受け取りを付けるだけで、要素の種類を問わない（div でも a でも同じ・use:attach の directive の形で使う）。stylesheet の .kcard は display block（style.css の 179 行）で、a の要素の既定は color inherit と下線なし（52 行）。frame の node_href・Mode・PageId と nodearound の id_of と widgets の help の HelpCtx は、行 g-link-map の節に書いた形（frame.rs・nodearound.rs・widgets は触らない）。
      形。
      host の部分に pub fn card_href（引数は Kcard の参照と frame の Mode・返りは String・wasm の target に限らない）を置き、frame の node_href に札の id と mode を渡した字を返す（札の id は契約 bead の id なので、近傍と問いの card と同じ id の頁へ行く）。
      kcard_view の外側の要素を div から a にし、開きの tag の字を <a class=card.class href= で始め（class の次に href を書く・歯がこの並びの字を読む）、use:attach=card.hover.clone() を同じ要素に残す（hover の card の中身と付け方は変えない）。href は card_href に札と今の mode を渡した字。今の mode の読み方は問わない（例は HelpCtx を use_context で受け、無ければ search の字を Mode の from_query に渡す）。mod dom の中の非公開の関数（board_view・column_view・kcard_view）の引数に mode の関数を足してよい。見本の class の nl は足さない（stylesheet の nl は注釈の箇条の ul.nl の規則だけ・札の class の値は着地済みの歯が kcard と kcard why-stop で比べる）。
      Kcard の class と hover の値・kcard と columns と content の名と引数と返り・mod dom の view の net の now を content に渡す 2 つの字（crate::net::now() と content(p, l, now)）は変えない。pipeline.rs に details の要素・記録の関数の fold の呼び・引用符で囲んだ /api/ の字・段の名（字 Stage と 2 つのコロンと変種の名）・新しい class・語彙の日本語の語の字を足さない（下の段の着地済みの歯がそれぞれを見る）。
      着地済みの歯（直すものは無い）。pipeline.rs と Kcard を見る着地済みの歯（crates の tests の下を grep で確かめた）。tests/pipe.rs の pipe_ の 13 本は、host の関数の値（列の順と class・札の id の並び・pipe_titles_from_ledger_cut_to_36 の札の class の値 kcard why-stop と kcard・pipe_hover_card_rows の hover の 4 行と 36 字・経過の字・今日の着地）と、pipeline.rs の字（pipe_stage_column_from_contract は字 .column() が在り、字 Stage と 2 つのコロンと変種の名が無いこと・pipe_view_passes_net_now は字 mod dom から後に crate::net::now() と content(p, l, now) が在ること）と、面の crate の直接依存の名の列（pipe_landed_shape_and_no_new_deps）と、札の class が stylesheet に在ること（pipe_keys_in_vocab_and_classes_in_stylesheet）を見る。この行は host の値を変えず、Kcard に欄を足さず（tests の下に Kcard を struct の字で組む所は無い・確かめた）、2 つの字を残すので、13 本は直さずに通る。
      ほかの歯。hsderive_consts_match_note（pipeline の PATHS が PATH の 1 つで FOLDS が空・PATHS の行に引用符が無い）と hsderive_module_returns_consts・hsblock_ の Module の歯（BLOCK）・frame_one_module_per_block（pipeline.rs に字 id と引用符で囲んだ pipe が在る）・steady_details_use_fold_record（details の数と記録の呼びの数が FOLDS の数 0 と同じ）・parts_paths_distinct_in_block_modules（引用符で囲んだ /api/pipeline が src に 1 度だけで pipeline.rs に在る）・parts_ の 3 値の歯（pipeline の BLOCK の id・body・REASON）・tests/next.rs の nextstep_ の歯（pipeline の BLOCK の id が pipe）・frame_blocks_without_data_are_unmeasured（pipeline の body）・frame_no_heading_words_in_code と frame_classes_are_in_stylesheet（src の全部）。この行はどれの見る字も値も変えないので、直さずに通る。
      測り方。新しい歯は tests/kcardlink.rs に置き、名を klink_ で始める。着地済みの行と、この波の行の verify の filter の語は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_ と、この波の mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_ の 66 で、新しい歯の名から先頭の klink_ を除いた字は、このどれも部分の字として含まない（例 klink_pipe_x・klink_stage_x・klink_seatcard_x は不可・着地済みの行の filter に当たると、その行の歯の置き場が write-set の外に増える）。名の例（どの語も含まない）は klink_card_opens_same_id・klink_dom_anchor_keeps_hover・klink_names_stay_apart。
      klink_card_opens_same_id は tests/fixtures/surface/pipeline-board.json（着地済み・今は 12 札・この行は触らない）を契約の型の PipelineBoard に読み（札の Reading は Known）、各札を kcard に空の slice で渡して組んだ札と Mode の ALL の各値で card_href の字を作り、done (1) の 4 つを比べる（札が空でないことだけを見る・数を持たない）。src の字の歯は CARGO_MANIFEST_DIR から src/project/pipeline.rs を読み、字 mod dom の最初の所から後の字と file の全部の字で done (2) の在る無しを見る（DOM は wasm の target のときだけなので host では撃てない・組めることは xtask の surface-build で見る）。自分の名の歯は tests/kcardlink.rs の字を読み、名の数が 3 以上であることと done (4) を見る。fixture は足さない。
      依存は足さない。Cargo.toml と vocab.json と style.css と widgets は触らない。
  - n: 7
    type: prose
    title: 行 g-link-items — 一覧の 1 項を節点の頁への link にする
    body: |
      なぜ。見本の itemNode（mock3 の ui.js の 597 行から 603 行）は、一覧の 1 項を、印と、id と題を包んだ節点の頁への link にし、抜けの検査の頁（gaps.html の 24 行）の名指しもこの形で出す。本番の一覧の 1 項（kit の item_view）は id と題を字で出すだけで、台帳の一覧（epic とその下の項）とこれまでの決定の項から、行 g-node が足した節点の頁（?page=node&id=）へ行けない。抜けの検査の頁の名指しは id の字だけで、印も題も無い（gaps.rs の 230 行）。
      在りか（着地済み・HEAD 03435c3 で確かめた）。src/kit.rs（255 行）の pub struct Item（pub な欄 shape・alert・id・title・aside・derive は Debug・Clone・PartialEq・Eq）と pub fn item（台帳の行 LedgerRow から Item）は wasm の target に限らない。wasm の target のときだけの mod dom の pub fn item_view（引数 item の &Item と number の Option の usize・返りは leptos の AnyView・237 行）は li の要素を 1 つ組み、印（number が在れば class nb の番号）と、class ttl の span の中の class nid の span（id）と data-t の span（題）と、class aside の span（aside）を並べる。item_view を呼ぶのは src/project/ledger.rs の 870 行と 882 行（epic と下の項）と src/project/askpage.rs の 106 行（これまでの決定）の 3 か所で、どれも number に None を渡す。frame の pub fn node_href（id の &str と Mode を受けて、page が node・id は %XX にした id・mode は Mode の鍵の query の String を返す）、mapview の pub fn shape_class（GraphDoc の参照と GraphNode の参照を受けて、字 shape と帯の class と、状態が open でも in_progress でもなければ末尾に fill をつないだ String を返す）と pub fn open_question（同じ引数で bool・種類が question で状態が open）は、どれも wasm の target に限らない。HelpCtx（widgets の help の pub struct・wasm の target のときだけ・pub な欄 open と mode の RwSignal）は board.rs の App が provide_context で置く。src/project/gaps.rs（278 行）の checks は口の本文を GraphDoc に読んで invariants を返し、body は Gaps（欄 tiles と rows・Row の named は id の String の Vec）を組み、mod dom の row_view は名指しの id を 1 つずつ li の要素（class ttl の span の中の class nid の span）で描く。GraphDoc の nodes は GraphNode（欄 id・kind・file・digest・title・題は中核の crate が 36 字に切り済み）の Vec、beads は id から BeadAttr（欄 kind・status・labels・pointers・touches）への BTreeMap。
      形。kit.rs に pub fn node_item（GraphDoc の参照と id の &str を受けて Option の Item を返す・wasm の target に限らない）を mod dom の外に足す。電文の節点に id が在れば、Item の shape は mapview の shape_class の値、alert は mapview の open_question の値、id と title は節点の id と題、aside は空の字にし、無ければ None を返す。project の mod.rs は kit を glob で再公開しているので crate::project::node_item の path でも使える。mod dom の item_view は宣言の行（引数と返り）を変えず、題の所の class ttl の span を class ttl の a の要素に替える（中の class nid の span と data-t の span はそのまま）。href は frame の node_href に項の id と mode を渡した値で、mode は use_context で受けた HelpCtx の mode の signal の値、context が無いときは今の URL の query を Mode の from_query で読んだ値（mode を切り替えると href も変わる）。組む要素は今と同じ li の 1 つで、印と番号と aside の描き方は変えない。kit.rs の pub use dom の行（body_view・fold・item_view・section・state_icon・unmeasured）は変えない。gaps.rs は、口の本文を GraphDoc に読む所を 1 つの関数にまとめ（まだ読んでいない・読めない・電文の型として読めないの理由は今と同じ NOT_READ・REASON・UNREADABLE）、checks はその invariants を返す外形のままにし、Gaps に pub な欄 found（id の String から Item への BTreeMap）を足す。body は Filled のとき、rows の各行の named の id ごとに node_item を呼び、Some の id だけを found に入れる（rows と tiles の値と、Empty と Unmeasured の値は今と同じ）。mod dom の row_view は、名指しの id が found に在れば kit の item_view（number は None）で、無ければ今の li の字で描く（電文の節点に無い id は頁が無いので link にしない）。gaps.rs は節点の列を自分でたどらない。節点の引きを kit の node_item に置くのは、着地済みの歯 gapspage_reads_graph_and_copies_verdicts が gaps.rs の字に .nodes・.edges・.beads・.runs が無いこと（面が判定を数え直さない決まり）を見るからで、node_item は表示の印と題を id で引くだけで判定を数えない。
      着地済みの歯の直し。無い（この行は tests の下の着地済みの file を書かない）。
      直さずに通る着地済みの歯（write-set の外・tests の下を grep で確かめた）。tests/hsblock.rs の hsblock_kit_holds_shared は kit.rs に 15 の定義の字（pub struct Item と空白・pub fn item と開き丸括弧など）と、wasm の target のときだけの mod dom の行の後に 4 つの空白と pub fn の後に section・state_icon・unmeasured・body_view・item_view・fold と開き丸括弧が続く字と、pub use dom の行の字が在ることを見る。この行は mod dom の外に node_item を足し、item_view の本文だけを変えるので崩さない。tests/hsderive.rs の hsderive_fold_forms_joined は kit.rs に FOLD_KEYS の字が無く fold_keys の宣言の字が在ることを見る（この行は触らない）。tests/gapspage.rs は、gaps.rs の字に map::PATH が在り、.nodes・.edges・.beads・.runs と引用符で始まる /api/ の字と保存の口の名が無いこと（gapspage_reads_graph_and_copies_verdicts・この行は gaps.rs の code にも doc にもこの 4 つの字を書かない）、gaps.rs の class の字が gtiles・gtile・gi・ok・ng・unknown・n・gitem・ttl・aside・body・items・panel を含み stylesheet に在ること（gapspage_classes_and_keys_exist・この行は無い id の li と summary の class ttl と aside の字を残す）、rows の順と開きと named の id の列と more（gapspage_rows_order_and_open・gapspage_named_cut_at_twenty）、測れていないと 0 本の理由（gapspage_unmeasured_never_pass）、fixture の形（gapspage_fixture_shape_and_size・checks の外形は変えない）を見る。tests/steady.rs の steady_details_use_fold_record は gaps.rs の details の数と記録を呼ぶ所の数が 1 で鍵が gaps の形であることを見る（この行は details と記録の呼びを足さず、記録の関数の名と開き丸括弧の並びを doc にも書かない）。tests/frame.rs の frame_item_shape_follows_status（kit の item の値）・frame_classes_are_in_stylesheet（src の class の字・a の要素の class ttl は stylesheet に在る）・frame_no_heading_words_in_code（日本語の見出しの語を字で書かない）、tests/parts.rs の parts_paths_distinct_in_block_modules（引用符の /api/ の字を足さない）、tests/askcard.rs の askcard_rulings_from_ledger_fixture と tests/ledgerblock.rs の ledgerblock_unmeasured_and_list_unchanged（Item の値は変えない）も通る。頁の snapshot（tests/snapshots/pages）は頁の枠の値だけを持ち、DOM を持たないので変わらない。
      並べて走る行との取り合い。同じ波の行 g-unref-panel は ledger.rs を、行 g-ask-focus は askpage.rs を書く。どちらも item_view を今と同じ 2 つの引数で呼ぶので、この行との着地の順に依らず組める。g-ask-focus はこれまでの決定の段の n 番目の li の要素を選んで光らせるので、この行は item_view が項ごとに li の要素を 1 つだけ組む形を保つ（done (3)）。
      測り方。新しい歯は tests/itemlink.rs に置き、名を ilink_ で始める。名の例は ilink_node_row_from_doc・ilink_gaps_rows_found・ilink_shared_row_links・ilink_gaps_src_uses_row・ilink_own_names_clean。電文は着地済みの tests/fixtures/surface/invariants.json（節点 0 の GraphDoc）を読み、歯の中で節点と台帳の属性を足して組む（新しい fixture の file を置かない）。足す節点は t3-hub.9（種類 task・題 契約の行・状態 open）・q.1（種類 question・題 色を決める・状態 open）・t3-hub.20（種類 task・題 閉じた契約・状態 closed）・FR1（種類 要件・題 面は 2 つ・台帳の属性なし）で、node_item の値は順に、shape が 「shape band-beads」 で alert が偽、「shape band-beads」 で真、「shape band-beads fill」 で偽、「shape band-srs fill」 で偽、id と title は足した節点の id と題、aside は空の字。t3-hub.15（節点に無い）は None。その電文の body の found の鍵は t3-hub.9 の 1 つ（行 g-2 の named は t3-hub.9 と t3-hub.15・行 g-10 の n-1 から n-20 は節点に無い）で値は node_item の値、着地済みの fixture のままの電文の body の found は空で、どちらも tiles と rows は同じ invariants を gaps の tiles と rows に渡した値と同じ（歯が比べる）。字の歯は CARGO_MANIFEST_DIR から src/kit.rs と src/project/gaps.rs を読む。kit.rs は、mod dom の中に item_view の宣言の行（4 つの空白・pub fn item_view・開き丸括弧・item: &Item, number: Option<usize>・閉じ丸括弧・矢印・AnyView・開き波括弧の並び）が在り、その本文（宣言の行から、次の 4 つの空白と閉じ波括弧だけの行まで）が class ttl の a の要素の開きの字を持ち、class ttl の span の要素の開きの字を持たず、li の要素の開きの字（小なりと li）がちょうど 1 つであることと、mod dom の字（wasm の target のときだけの mod dom の行から file の終わりまで）が node_href と開き丸括弧・use_context::<HelpCtx>() ・Mode::from_query と開き丸括弧の字を持つことを見る（mode を引く小さな関数を mod dom の中に分けてもよい）。gaps.rs は mod dom の中に item_view と開き丸括弧の字と found の字が在ることを見る。DOM の振る舞いは host で撃てないので、xtask の surface-build（trunk の wasm の組み立て）が通ることで組めることを見る。
      filter の語。着地済みの行の verify の filter の語（contracts の 3 つの契約の file の verify の行から数えた・確かめた）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hook_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・hbproc_・hbconf_・hbroute_・hbpost_・hsblock_・hspage_・hsderive_ の 49 で、同じ波の行の接頭辞（この行の ilink_ を除く）は mlink_・gnav_・mkeys_・klink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_ の 16。新しい歯の名から先頭の ilink_ を除いた字は、この 65 のどれも部分の字として含まない（例 ilink_graph_x・ilink_project_x・ilink_frame_x は不可）。歯 ilink_own_names_clean は tests/itemlink.rs の字を読み、test の属性の行の次の fn の名を全部集めて見る（着地済みの hsblock_own_names_clean と同じ読み方）。
      依存は足さない。Cargo.toml と vocab.json と style.css は触らない。
  - n: 8
    type: prose
    title: 行 g-ask-focus — 問いの card の題の link と、URL の id で名指した問いへ寄せる
    body: |
      なぜ。見本の ask.html は card の題を節点の頁への link にし（24 行）、card ごとに id（字 q と 0 から数えた位置・23 行）を置き、URL の ?id= で名指した問いの card を光らせて画面の中へ寄せ、card が無ければ（答え済み）これまでの決定の段を開いてその行を光らせる（87 行から 94 行）。本番の問いの頁は題が字だけ（ask.rs の 455 行）で、card に id が無く、?id= を読まない。節点の頁の答えへの link（node の answer_href）と、同じ波の行 g-next-act の質問の link は ?id= を付けて問いの頁を開くが、今は名指しの card が分からない。
      在りか（着地済み・HEAD 03435c3 で確かめた）。src/project/ask.rs（601 行）: pub struct Card（欄 number（1 から）・id（BeadId）・title・a1・posted_at・summary・reason・recommend・touches・digest）、pub fn body（Fetched の参照から Body の Card の Vec・電文の順に番号 1 から）。wasm の target のときだけの mod dom の view（413 行）が口 PATH を net の read で読み、card_view（438 行）が class qcard の article の要素（data-q に id）を組み、part_view の Head の腕が class t の span の中に題を置く（455 行）。畳む段はつながりの 1 つ（記録の鍵は字 ask:around とコロンと id）。src/project/askpage.rs（119 行）: pub const OPEN（偽）・pub fn rows・rulings・count・pub fn body（Fetched の参照から Body の Item の Vec・label intake:question を持つ closed の bead を id の自然な順に）。wasm の target のときだけの pub fn view が台帳の口（ledger の PATH）を net の read で読み、段を class fold panel と id hist の details の要素にし、記録の呼びの鍵は ask:hist で初めの値は OPEN（111 行）、項は kit の item_view（number は None）で class items の ul の要素の中に並べる。kit の item_view は項ごとに li の要素を 1 つ組む（HEAD の形・同じ波の行 g-link-items もこの形を保つと節に書いた）。frame の pub fn param（query の &str と鍵の &str から Option の &str）と node_href、mapview の pub fn decode（%XX と + を戻す）は、どれも wasm の target に限らない。project の node の pub fn answer_href（id の &str と Mode から、page が ask・id は %XX にした id・mode の query）が節点の頁の答えの link を組む。style.css に規則 .qcard.target（光らせる縁）と変数 --panel-2 が在る（確かめた）。web-sys の feature は Document・Element ほかで、ScrollIntoViewOptions は無い（Cargo.toml を触らないので、寄せ方は Element の scroll_into_view_with_bool に真を渡す形＝要素の上端を画面の上端へ寄せる）。
      形（ask.rs）。wasm の target に限らない pub const FOCUS_KEY（字 id）・pub fn focus（query の &str を受けて Option の String・frame の param の FOCUS_KEY の値を mapview の decode で戻した字・無いか空なら None）・pub fn anchor（番号の usize を受けて String・字 q の後に番号から 1 を引いた数・番号 1 は q0＝見本の 0 から数える id）・pub fn card_class（bool を受けて &'static str・真は qcard と target の 2 語を空白でつないだ字・偽は qcard）・pub fn target_number（Card の slice と id の &str を受けて Option の usize・id の字が同じ card の番号）を足す（どれも mod dom より前に置く・今の file は wasm の target のときだけの view と mod dom が終わりに在る）。mod dom の card_view は article の要素の class を card_class（card の id が焦点の id と同じか）の値に、id を anchor の値にし、data-q はそのまま。Head の腕の題は class t の a の要素（href は frame の node_href に card の id と mode・mode は HelpCtx の context の mode の signal、無ければ今の URL の query を Mode の from_query で読んだ値）にし、中の data-t の span は変えない。view は頭で今の URL の query（window の location の search）から focus を 1 度読む。焦点が在るときは、一覧が Filled になって target_number が番号を返した最初の 1 度だけ、request_animation_frame の後に document の get_element_by_id（anchor の値）の要素を scroll_into_view_with_bool(true) で寄せる（1 度きりの印は StoredValue の bool）。
      形（askpage.rs）。wasm の target に限らない pub fn opens（Fetched の参照と Option の &str を受けて bool・OPEN が真か、焦点の id が body の Filled の項の id に在れば真）・pub fn focus_index（Item の slice と id の &str を受けて Option の usize・0 から数えた位置）・pub fn row_selector（usize を受けて String・「#hist ul.items > li:nth-child(」 と位置に 1 を足した数と閉じ丸括弧をつないだ字・hist は BLOCK の id から引く）・pub const HIGHLIGHT（字 「background:var(--panel-2)」・見本の 93 行の色）を足す（どれも wasm の target のときだけの pub fn view より前に置く・今の file は view が終わりに在る）。view は ask の focus で焦点を読み、段の記録の呼びは鍵の字 ask:hist を今の形（記録の関数の名と開き丸括弧の直後に引用符で囲んだ鍵と to_string）のまま、初めの値を opens に今の読みと焦点を渡した値にする（記録に値が無い間は、焦点の項が一覧に在れば開く・持ち主が開き閉じした後は記録の値）。焦点の項が一覧に在るときは、最初の 1 度だけ request_animation_frame の後に document の query_selector（row_selector の値）の要素に set_attribute で style の HIGHLIGHT を置き、scroll_into_view_with_bool(true) で寄せる。焦点の id は問いの bead の id だけを見る（裁定の id から問いを引くのはグラフの口を読む後の行に残す）。
      変えないもの。ask の PATHS・FOLDS・Card・LAYOUT・body の値と、askpage の PATHS・FOLDS・OPEN・BLOCK・body の値。2 つの file に details の要素と記録の呼びを足さず、記録の関数の名と開き丸括弧の並びを doc にも書かない。保存の口の名（localStorage・sessionStorage と、字 cookie）を code にも doc にも書かない。
      直さずに通る着地済みの歯（write-set の外・tests の下を grep で確かめた）。ask.rs と askpage.rs の字を読む歯は tests/askcard.rs の askcard_no_offscreen_storage_names（保存の口の名が無い）だけ。tests/askcard.rs のほかの歯は Card と Item と理由の値（askcard_fixture_cards_text・askcard_layout_order・askcard_rulings_from_ledger_fixture の OPEN が偽と BLOCK の 3 つの値・askcard_empty_is_not_unmeasured ほか）を見て、この行は変えない。tests/steady.rs の steady_details_use_fold_record（2 つの file の details と記録の呼びが 1 つずつ・鍵の字）、tests/hsderive.rs の hsderive_consts_match_note（ask の PATHS は 2 つ・FOLDS は ask:around の形・askpage の PATHS は空・FOLDS は ask:hist）、tests/parts.rs の parts_paths_distinct_in_block_modules（ask.rs の引用符の /api/ の字は PATH と RULING_PATH の 2 つのまま・askpage.rs は 0）と parts_ledger_lists_read_three_values、tests/frame.rs の frame_classes_are_in_stylesheet（足す class の字 t は stylesheet の .qcard .head .t に在る・target は関数の値）と frame_no_heading_words_in_code（足す字は ASCII だけ）、tests/batchpanel.rs（batch.rs と policy.rs の字を読み、ask の PATH の値だけを使う）も通る。
      測り方。新しい歯は tests/askfocus.rs に置き、名を afocus_ で始める。名の例は afocus_id_param_read・afocus_card_anchor_class・afocus_target_card_number・afocus_rulings_fold_opens・afocus_src_links_and_scroll・afocus_own_names_clean。focus の 4 つの例は、「?page=ask&id=nq.4&mode=beginner」 で nq.4、「?page=ask&mode=expert&id=e.2%3A20260927T0000Z-1」 で e.2:20260927T0000Z-1、「?page=ask&mode=beginner」 で None、「?page=ask&id=&mode=beginner」 で None。着地済みの fixture の tests/fixtures/surface/question-list.json の card は番号 1 の qa.2 と番号 2 の qa.10（着地済みの frame_blocks_without_data_are_unmeasured が見る値）、tests/fixtures/surface/ledger-questions.json のこれまでの決定の項は lq.2・lq.9・lq.10 の順（askcard_rulings_from_ledger_fixture が見る値・lq.3 は台帳の行に在るが決定の項に無い）。row_selector の 1 の値は 「#hist ul.items > li:nth-child(2)」、HIGHLIGHT の値は 「background:var(--panel-2)」。字の歯は CARGO_MANIFEST_DIR から src/project/ask.rs と askpage.rs を読み、ask.rs の mod dom の中に anchor と開き丸括弧・card_class と開き丸括弧・frame::node_href と開き丸括弧・get_element_by_id と開き丸括弧・scroll_into_view_with_bool(true) の字が在り、class t の a の要素の開きの字が在り、class t の span の要素の開きの字が無いこと、askpage.rs の wasm の target のときだけの pub fn view の宣言の行（file の終わりの近く・mod dom は無い）から file の終わりまでの字に、opens と開き丸括弧・row_selector と開き丸括弧・query_selector と開き丸括弧・set_attribute と開き丸括弧・HIGHLIGHT・scroll_into_view_with_bool(true) の字が在ることを見る（関数の定義の字は数えない範囲を読む）。DOM の振る舞いは host で撃てないので、xtask の surface-build が通ることで組めることを見る。
      filter の語。着地済みの行の verify の filter の語（contracts の 3 つの契約の file の verify の行から数えた・確かめた）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hook_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・hbproc_・hbconf_・hbroute_・hbpost_・hsblock_・hspage_・hsderive_ の 49 で、同じ波の行の接頭辞（この行の afocus_ を除く）は mlink_・gnav_・mkeys_・klink_・ilink_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_ の 16。新しい歯の名から先頭の afocus_ を除いた字は、この 65 のどれも部分の字として含まない（例 afocus_question_x・afocus_askcard_x・afocus_frame_x は不可）。歯 afocus_own_names_clean は tests/askfocus.rs の字を読み、test の属性の行の次の fn の名を全部集めて見る。
      依存は足さない。Cargo.toml と vocab.json と style.css は触らない。
  - n: 9
    type: prose
    title: 行 g-next-act — 次の一手の大きい箱の行き先の link
    body: |
      なぜ。見本の index.html（192 行から 203 行）の次の一手の大きい箱は、種類ごとに行き先の button を持つ（限度と移動は account board・応答なしは席の窓・束の承認は問いの頁の束の block・質問は問いの頁の最も古い card・発効待ちは抜けの検査の頁）。本番は止まっている走行の block「pipeline」への link だけを持つ（next.rs の 176 行から 182 行）。要件 FR11 は次の一手を「優先順に判じ 1 つを大きく出す」とし、出した 1 つから次の手の頁へ移れるようにする。判定は変えない（面は電文の lead と checks を写すだけ）。
      在りか（着地済み・HEAD 03435c3 で確かめた）。src/project/next.rs（260 行）: pub struct Link（pub な欄 href の String と text の &'static str・derive は Debug・Clone・PartialEq・Eq）、pub struct Big（pub な欄 kind・key・class・what_class・what・link（Option の Link））、pub fn big（NextMove と Option の &NextCheck から Big・止まっている走行だけ link が在り、字は PIPE_LINK・href は井桁と pipeline の BLOCK の id）、pub fn next・row・content・step・body。wasm の target のときだけの mod dom の big_view（232 行）が、link が在れば class act の div の中に class btn primary の a の要素で描く。NextCheck（契約の型の stats）の欄は kind・result・count・target（Option の BeadId・Display で字になる）。big を呼ぶ src は account の home.rs（143 行）と projects.rs（176 行）で、どちらも what の欄だけを使う。行き先の関数（どれも pub・wasm の target に限らない）: account の pub fn tab_href（Tab と Mode から、board が account・tab は Tab の id・mode の query・Tab は Home・Session・Projects）、frame の pub fn href（PageId と Mode から、home は mode だけ・ほかは page と mode の query）、project の node の pub fn answer_href（id の &str と Mode から、page が ask・id は %XX にした id・mode の query・節点の頁の答えの link と同じ）、batch の BLOCK の id（字 batch・問いの頁の右の列の block の section の id）。account の tab_href の字は、frame の ACCOUNT_URL（「戻る」の段が新しい窓で開く account board の URL）に tab と mode を足した字。account の windows の pub const ACCOUNT_WIN（字 tz-account・wasm の target に限らない）は account board が自分の窓に付ける名で、board.rs の「戻る」がこの名で窓を探す。
      形。Big に pub な欄 target（Option の String・電文の対象の id の字）を足し、big はその値を埋める（ほかの欄の値と big の引数と返りは変えない）。wasm の target に限らない pub fn action（NextMove と対象の id の Option の &str と Mode を受けて Option の Link）と、link の字の 5 つの pub const を足す（mod dom より前に置く）。表（mode が beginner のときの href の字・expert は末尾の mode の値が expert）: 限度と移動 = account の tab_href に Tab の Home と mode で 「?board=account&tab=home&mode=beginner」・字 ACCOUNT_LINK（「account board を見る ›」）。応答なし = tab_href に Tab の Session と mode で 「?board=account&tab=session&mode=beginner」・字 SESSION_LINK（「session を見る ›」）。止まっている走行 = None（大きい箱は今の Big の link を使う）。束の承認 = frame の href に PageId の Ask と mode の字に井桁と batch の BLOCK の id をつないだ 「?page=ask&mode=beginner#batch」・字 BATCH_LINK（「まとめて承認 ›」）。質問 = 対象の id が在れば node の answer_href（対象 nq.4 で 「?page=ask&id=nq.4&mode=beginner」・対象 e.2:x で 「?page=ask&id=e.2%3Ax&mode=beginner」）、無ければ frame の href に PageId の Ask と mode（「?page=ask&mode=beginner」）・字 ANSWER_LINK（「答える ›」）。発効待ち = frame の href に PageId の Gaps と mode（「?page=gaps&mode=beginner」）・字 GAPS_LINK（「orchestrator に任せる（見るだけ） ›」）。なし = None。字は見本の button の字に倣う（束の承認・質問・発効待ちは見本と同じ字、限度と移動と応答なしは本番の行き先の名）。mod dom の view は HelpCtx の context の mode の signal（無ければ今の URL の query を Mode の from_query で読んだ値）を読み、big_view は Big の link が在ればそれを、無ければ action に Big の kind と target と mode を渡した値を、今と同じ class act の div と class btn primary の a の要素で描く（mode を切り替えると href も変わる）。wasm の target に限らない pub fn window_of（NextMove を受けて Option の &'static str）を mod dom より前に足し、限度と移動と応答なしは ACCOUNT_WIN、ほかは None を返す。a の要素は window_of の値が在るときだけ属性 target にその値を持つ（account board の窓が開いていればその窓で、無ければ新しい窓で開く・要件 FR1 の account board の名前つきの窓を 1 つに保つ・project board の窓を account board に替えない）。7 種の語の鍵の字（引用符で囲んだ nx_ の鍵）は表 KEYS の外に書かない。質問の link の先の card の名指しは同じ波の行 g-ask-focus が読む（この行はその行に依らず href の字だけを組む）。
      直さずに通る着地済みの歯（write-set の外・tests の下を grep で確かめた）。tests/next.rs の 7 本: nextstep_big_matches_each_fixture_set（big の link は組 stalled だけで、question と not-judged は None・what と class は今の値・この行は big の link を変えない）、nextstep_copies_lead_without_judging（big の限度と移動の link は None・what は 「nx.9 · 1 件」）、nextstep_rest_in_declared_order_without_lead と nextstep_nothing_set_leads_nx_g と nextstep_unreadable_is_unmeasured（row と body と content の値）、nextstep_keys_one_table_in_declared_order（next.rs の字の引用符の nx_ の鍵は 1 度ずつ・この行は action を NextMove の変種で書く）、nextstep_keys_in_vocab_and_classes_in_stylesheet（組の class）、nextstep_landed_shape_and_no_new_deps（BLOCK・PATH・body の外形と依存）。どの歯も Big と Link を struct の字で組まない（Link は tests/next.rs が 2 つの欄の struct の字で組むので、Link には欄を足さない）。tests/accthome.rs と tests/acctproj.rs（account の home と projects が big の what を使う）、tests/frame.rs の frame_blocks_without_data_are_unmeasured と tests/parts.rs の parts_pending_blocks_unmeasured_for_all_three（next の body の理由）、tests/hsderive.rs（next の PATHS と FOLDS）、tests/steady.rs（next.rs の details と記録の呼びは 0 のまま）、parts_paths_distinct_in_block_modules（引用符の /api/ の字を足さない）、frame_classes_are_in_stylesheet（class の字を足さない）、frame_no_heading_words_in_code（5 つの字は見出しの語と同じ字でない・確かめた）も通る。
      測り方。新しい歯は tests/nextact.rs に置き、名を nxact_ で始める。名の例は nxact_links_per_kind・nxact_links_keep_mode・nxact_big_carries_target・nxact_src_uses_action・nxact_texts_not_headings・nxact_own_names_clean。action の歯は 2 つの mode と 7 種で上の表の Link の値（href と字の定数）を比べ、対象の id が無い質問と e.2:x の質問も見て、window_of の 7 種の値（限度と移動と応答なしは字 tz-account の ACCOUNT_WIN・ほかは None）を比べる。読み直しの歯は各 href の井桁より前の字を、account の selects と Tab の from_query、PageId の from_query、frame の param の id を mapview の decode で戻した字、Mode の from_query に渡す。Big の target の歯は着地済みの fixture の tests/fixtures/surface/next-step.json の 4 つの組を content で読む。字の歯は CARGO_MANIFEST_DIR から src/project/next.rs を読み、mod dom の中に action と開き丸括弧・window_of と開き丸括弧・use_context::<HelpCtx>() ・Mode::from_query と開き丸括弧の字が在ることを見る。見出しの語の歯は vocab の全部の鍵の語のうち ASCII でないものと 5 つの定数の字が同じでないことを見る。DOM の振る舞いは host で撃てないので、xtask の surface-build が通ることで組めることを見る。
      filter の語。着地済みの行の verify の filter の語（contracts の 3 つの契約の file の verify の行から数えた・確かめた）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hook_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・hbproc_・hbconf_・hbroute_・hbpost_・hsblock_・hspage_・hsderive_ の 49 で、同じ波の行の接頭辞（この行の nxact_ を除く）は mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_ の 16。新しい歯の名から先頭の nxact_ を除いた字は、この 65 のどれも部分の字として含まない（例 nxact_account_x・nxact_nextstep_x・nxact_question_x は不可）。歯 nxact_own_names_clean は tests/nextact.rs の字を読み、test の属性の行の次の fn の名を全部集めて見る。
      依存は足さない。Cargo.toml と vocab.json と style.css は触らない。
  - n: 10
    type: prose
    title: 行 g-unref-panel — 台帳の block の未反映の一覧の段
    body: |
      なぜ。要件 FR13 は「design-intent に未反映のもの（昇格先の無い memo・処分の宣言の無い裁定・反映されていない要望）は一覧で出す」とし、要件 NFR2 は読めないときは「0 件でなく「測れていない」と出す」とする。見本は台帳の block の終わりに畳める段（id unref・最初は開く）を置き、見出しに数と種類の chip、中に id・題・種類・年齢・次の 1 手の 5 列の一覧を 20 件まで出し、超える分を残りの数の 1 行にする（index.html の 78 行と 79 行・ledger.js の 80 行から 90 行）。口 GET /api/unreflected（境界の crate の src/server/routes/unreflected.rs・便 e-view）は在るが、面にそれを読む module が無く、台帳の block は未反映の数と分からない種類の chip だけを出す（ledger.rs の 794 行から 808 行）。
      在りか（着地済み・HEAD 03435c3 で確かめた）。契約の型の stats の pub struct UnreflectedList（欄 memos・rulings・requests・どれも Reading の UnreflectedRow の Vec）と UnreflectedRow（欄 id の String・title の String・age_s の Option の u64＝年齢の秒）、UnreflectedKind（Memo・Ruling・Request・ALL はこの順）。電文の字は、Reading が鍵 known で包んだ値か字 unknown（契約の crate の tests/snapshots/contract_form.json の stats::UnreflectedList の 3 つの例・1 つ目は memos が known の 2 行・rulings と requests が unknown）。中核の crate の ledger の unreflected.rs（55 行から）は memos を年齢の古い順（作った時刻の早い順・時刻の無い memo は後ろ）に並べ、rulings と requests をいつも Unknown にする。src/project/ledger.rs（890 行）: pub const PATH（/api/ledger）・METRICS_PATH（/api/metrics）・PATHS（29 行・この 2 つ）・FOLDS（32 行・ledger:more）、pub fn age（Option の f64 の日数から字・無しは ―・1 日未満は丸めた時間と h・10 日未満は小数 1 桁と d・それ以上は丸めた整数と d）、UNREF_KINDS（UnreflectedKind と名 memo・ruling・request の表）と pub fn kind_name、pub struct Unref（欄 count と unknown・指標の電文の写し）、LAYOUT（段 Unref に項 UnrefCount の 1 つ）。wasm の target のときだけの pub fn view（631 行・引数なし・context の画面の状態の signal を mod dom の view に渡す）と mod dom（639 行から）。mod dom の view は METRICS_PATH を net の read で読み（654 行）、指標が Filled のとき LAYOUT の段を tier_view で順に描き、Unmeasured のとき段 Unref は何も描かない。段 Unref は line_view の UnrefCount の腕が class lcap の div に見出し（hs と鍵 unref）と数（class chip num）と分からない種類の chip（class lchips の中）を描く。「詳しく」は記録の鍵 ledger:more の details の要素 1 つ。語の辞書に鍵 unref（語は design-intent に未反映）・u_kind・u_age・u_next・nx_promote・nx_declare・nx_reflect・col_title（語は 題）・gap_unknown（語は まだ分からない）が在り、stylesheet に class fold・lep・lchips・ulist・urow・hrow・u-id・u-t・u-n・unref-n・z・mono・chip・num・small・muted の規則が在る（確かめた・見本の u-k と u-a は stylesheet に規則が無いので使わない）。net の read は同じ path を 1 つの signal で分け合い、登録した口を頁を開いたときと知らせの合図で読み直す。
      置き場の判断（src/project に新しい file を置かない）。判断の記録 ADR-13 の後、組み立ての script（build.rs）は src/project の下の mod.rs でない .rs の file をどれも列挙 Module の変種にし、生成の impl がその file の BLOCK・PATHS・FOLDS と wasm の target のときだけの view を名指す（確かめた）。block でない部品だけの file を置けば、この 4 つが無くて組み立てが落ちる。block にすれば、frame_one_module_per_block が頁の block の id と Module の block の id の 1 対 1 を見るので頁の列に新しい block を載せることになり（頁の snapshot も変わる）、hsderive_module_returns_consts が Module の ALL の全部を 13 の表で引くので表の外の module で落ちる。未反映の一覧は台帳の block の中の 1 つの段で、block ではない。src/project の外に新しい module を置く形（lib.rs に pub mod の行を足す）も、段の描きは台帳の block の中から呼ぶので ledger.rs を書くことは変わらず、file が 1 つ増えるだけになる。よって一番小さく正しい形は、電文の読みと行の組みの純粋な関数と段の DOM を ledger.rs に足すこと（ledger.rs はこの波でこの行だけが書く）。
      形（host でも組む値と関数）。ledger.rs に pub const UNREF_PATH（字 /api/unreflected・契約の型の UnreflectedList）を足し、PATHS を PATH・METRICS_PATH・UNREF_PATH（定数の名で書く）、FOLDS を ledger:more と ledger:unref にする。pub const UNREF_OPEN（真・段は最初は開く）・UNREF_MAX（20）・UNREF_REASON（字 「未反映の一覧の口が読めない（server にまだ無い・届かない・知らせが切れた）」）・UNREF_UNKNOWN（字 「server が台帳を読めないので、未反映の一覧はまだ分からない」）・UNREF_EMPTY（字 「未反映のものは無い」）・UNREF_NEXT（UnreflectedKind と次の 1 手の語の鍵の表・Memo は nx_promote・Ruling は nx_declare・Request は nx_reflect）を置く。pub struct UnrefRow（pub な欄 id・title の String・kind（種類の名の &'static str）・age（年齢の字）・next（語の鍵の &'static str）・derive は Debug・Clone・PartialEq・Eq）と pub struct UnrefList（pub な欄 rows（UnrefRow の Vec）・more（Option の usize）・unknown（種類の名の Vec）・同じ derive）を置く。pub fn unref_list（Fetched の参照を受けて Body の UnrefList）は、まだ読んでいないで Unmeasured の NOT_READ、読めないで Unmeasured の UNREF_REASON、電文として読めない本文で Unmeasured の NO_CONTENT を返す。電文が読めたら、UnreflectedKind の ALL の順に、Known の行を電文の順のまま UnrefRow にし（id と題は電文の字・kind は kind_name・age は age_s を 86400 で割った f64 を age に渡した字・age_s が無ければ age の無しの字・next は UNREF_NEXT の鍵）、Unknown の種類の名を unknown に並べる。3 種が全部 Unknown なら Unmeasured の UNREF_UNKNOWN、行が 0 で unknown も空なら Empty の UNREF_EMPTY、ほかは Filled で、rows は先頭から UNREF_MAX まで、more は行の数が UNREF_MAX を越えれば越えた数（越えなければ None）。面は行を並べ直さず、未反映の見分けと数え方を持たない（電文の行と数を写すだけ）。pub fn more_line（usize を受けて String・字 ほか と空白と数と空白と 件）と pub fn unref_chip（u32 を受けて &'static str・0 は chip・num・unref-n・z の 4 語を空白でつないだ字・1 以上は z の無い 3 語）を置く。足す値と関数は wasm の target のときだけの pub fn view より前に置く（mod dom は file の終わりのまま）。LAYOUT・Part・Tier・UNREF_KINDS・Unref・Metrics・content・stats・metrics・count・body の値と外形は変えない。
      形（DOM・wasm の target のときだけ）。pub fn view（引数なし・use_context で画面の状態を受ける字）は変えない。mod dom の view の頭で UNREF_PATH を crate::net::read で読み（METRICS_PATH の読みと並べる）、その signal を段 Unref の描きへ渡す。段 Unref は、今の class lcap の div の代わりに、class fold と lep・id unref の details の要素 1 つ（prop:open=open と on:toggle=toggle・記録の呼びは鍵 ledger:unref の字と to_string・初めの値は UNREF_OPEN）を描く。summary には今の見出し（hs と鍵 unref）と、数（指標の電文の unref の count・class は unref_chip の値）と、今の分からない種類の chip（class lchips の中）を置く。中身は unref_list の値で、Unmeasured は kit の unmeasured、Empty は class small muted の div に字、Filled は、行が在れば class ulist の div に見出しの行（class urow hrow の div・中は字 id と、語 col_title と、hs の u_kind・u_age・u_next の 5 つの span）と、行ごとに class urow の div（中は class u-id mono の a の要素で id・href は frame の node_href に id と mode、class u-t の span で題、span で種類の名、class num の span で年齢の字、class u-n の span で next の語）を並べ、more が在れば class small muted の div に more_line の字、unknown の種類ごとに class small muted の div に種類の名と測れていないの記号と語 gap_unknown を描く。mode は HelpCtx の context の mode（無ければ今の URL の query を Mode の from_query で読んだ値）。見本の memo の行の hover の card（節の見出しの有無）は電文に見出しの欄が無いので置かず、id を節点の頁への link にする。段の描きの関数の名と置き場は問わない（歯は下に書いた字だけを見る）。ledger.rs に足す定数は、wasm の target のときだけの属性の行と pub fn view の宣言の行の間に置かない。
      着地済みの歯の直し（この行の write-set の中）。tests/hsderive.rs の hsderive_consts_match_note は 13 の module の PATHS と FOLDS を値で比べ、ledger の行は 2 つの path（/api/ledger・/api/metrics）と鍵 ledger:more の 1 つ（48 行）、別の比べで ledger の PATHS が PATH と METRICS_PATH の並び（60 行）であることを見る（確かめた）。この 2 か所を、3 つの path（/api/ledger・/api/metrics・/api/unreflected）と 2 つの鍵（ledger:more・ledger:unref）、PATH・METRICS_PATH・UNREF_PATH の並びに替える。ほかの 12 の module の期待と hsderive.rs のほかの歯（hsderive_module_returns_consts・hsderive_fold_forms_joined・hsderive_drops_old_copy・hsderive_own_names_clean）は変えない。
      直さずに通る着地済みの歯（write-set の外・tests の下を grep で確かめた）。tests/steady.rs の steady_details_use_fold_record は ledger.rs の details の要素の数と記録を呼ぶ所の数と FOLDS の数が同じで鍵の字の集合が FOLDS と同じことを見る（この行の後は 2 と 2 と 2・details の開きの字はどれも prop:open=open と on:toggle=toggle を持ち、属性の open を持たない・記録の関数の名と開き丸括弧の並びを doc に書かない）。steady_fold_key_forms は fold_keys が着地済みの 6 つの形を含むことと通す字と断る字の判定だけを見る（ledger:unref が増えても変わらない）。tests/hsblock.rs の hsblock_kit_holds_shared は fold_keys の数が各 module の folds の数の和と同じことを見る（数の字を持たない）。hsblock_dispatch_by_list は ledger.rs の wasm の target のときだけの属性の行のすぐ次の行が引数なしの pub fn view の宣言で、その本文が use_context で画面の状態を受けて dom の view に渡すことを見る（この行は pub fn view を変えない）。tests/parts.rs の parts_paths_distinct_in_block_modules は、Module の paths の全部と graph の PATH が互いに違い、各 path の引用符の字が src に 1 度だけで、それを PATHS に持つ module の file に在ることを見る（/api/unreflected の字は面の src で ledger.rs に 1 度だけ・ledger の PATHS に在る）。tests/ledgerblock.rs（LAYOUT の値・Part の鍵・未反映の数と分からない種類・content と stats と metrics の理由・BLOCK と PATH と METRICS_PATH の値・依存）と、tests/frame.rs の frame_blocks_without_data_are_unmeasured（ledger の metrics と body）と frame_classes_are_in_stylesheet（足す class の字は stylesheet に在る）と frame_no_heading_words_in_code（足す日本語の字は見出しの語と同じ字でない・確かめた）、tests/parts.rs の parts_pending_blocks_unmeasured_for_all_three も通る。
      測り方。新しい歯は tests/unrefpanel.rs に置き、名を urpanel_ で始める。名の例は urpanel_rows_from_wire・urpanel_cut_at_twenty・urpanel_unknown_kinds_and_reasons・urpanel_consts_paths_folds・urpanel_keys_and_classes・urpanel_src_fold_and_read・urpanel_own_names_clean。電文は歯の中で契約の型の値を組んで wire の encode で字にする（新しい fixture の file を置かない）。組 A: memos が Known の 2 行（t3-hub.9・題 [memo] 控え・age_s 604800 と、t3-hub.10・題 [memo] 時刻の無い控え・age_s 無し）・rulings と requests が Unknown で、rows は（t3-hub.9・[memo] 控え・memo・7.0d・nx_promote）と（t3-hub.10・[memo] 時刻の無い控え・memo・―・nx_promote）、more は None、unknown は ruling と request。組 A は同じ値を鍵 known と字 unknown で書いた電文の字（歯の中の字の literal）からも読む。組 B: memos が Known の 25 行（m-1 から m-25・age_s 3600）・rulings が Known の 1 行（r-1・age_s 無し）・requests が Unknown で、rows は m-1 から m-20 の 20 行（年齢の字 1h・next は nx_promote）、more は 6、unknown は request、more_line の 6 は 「ほか 6 件」。組 C: 3 種が Known の 1 行ずつ（memos の m-1・age_s 3600、rulings の r-1・age_s 950400、requests の q-1・age_s 無し）で、rows は m-1・r-1・q-1 の順、種類の名は memo・ruling・request、年齢の字は 1h・11d・―、next は nx_promote・nx_declare・nx_reflect、more は None、unknown は空。3 種が全部 Known の 0 行の電文は Empty の UNREF_EMPTY、全部 Unknown は Unmeasured の UNREF_UNKNOWN、Fetched の NotRead と Failed と字 not json と字 {} は NOT_READ・UNREF_REASON・NO_CONTENT・NO_CONTENT。定数の歯は PATHS が UNREF_PATH を含み FOLDS が ledger:unref を含むこと（数と並びは直した hsderive_consts_match_note が見る）。字の歯は CARGO_MANIFEST_DIR から src/project/ledger.rs を読み、mod dom の中に read(UNREF_PATH)・unref_list と開き丸括弧・記録の関数の名と開き丸括弧の直後に引用符で囲んだ ledger:unref が続く字・UNREF_OPEN・node_href と開き丸括弧・class fold lep の details の開きの字・id unref・class ulist・class urow hrow・class urow・class u-id mono・class u-t・class u-n の字が在ることを見る。DOM の振る舞いは host で撃てないので、xtask の surface-build が通ることで組めることを見る。
      filter の語。着地済みの行の verify の filter の語（contracts の 3 つの契約の file の verify の行から数えた・確かめた）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hook_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・hbproc_・hbconf_・hbroute_・hbpost_・hsblock_・hspage_・hsderive_ の 49 で、同じ波の行の接頭辞（この行の urpanel_ を除く）は mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_ の 16。新しい歯の名から先頭の urpanel_ を除いた字は、この 65 のどれも部分の字として含まない（例 urpanel_ledgerblock_x・urpanel_stats_x・urpanel_parts_x は不可）。歯 urpanel_own_names_clean は tests/unrefpanel.rs の字を読み、test の属性の行の次の fn の名を全部集めて見る。
      依存は足さない。Cargo.toml と vocab.json と style.css は触らない。
  - n: 11
    type: prose
    title: 行 g-seat-axis — 稼働の記録の目盛の時刻と凡例
    body: |
      なぜ。見本の block「orchestrator と口座」の稼働の記録は、SVG の下に幅ごとの目盛の時刻の字（ui.js の spanAxis・104 行から 107 行・index.html の 44 行）と、帯の色と縦線の見方の凡例の 1 行（ui.js の stripLegend・142 行・index.html の 50 行）を持つ。本番の稼働の記録（seat.rs の strip_view）は SVG と幅の切り替えだけで、目盛の字も凡例も無く、帯の色（run・wait・limit・silent・unknown）と縦線（口座の移動・今）が何を指すかを画面から読めない。要件 FR12 の席の健康の記録を、FR14 の「記号と図で表す」の形で読めるようにする。
      在りか（着地済み・HEAD 03435c3 で確かめた）。src/project/seat.rs（825 行）: pub enum Span（H24・H6・H3・ALL・pub fn key と secs）・pub const WIDTH（288）・HEIGHT（28）・LOW（0.45）・pub fn hm（時刻を clock の字の時と分に Z をつないだ字）・pub struct Strip（pub な欄 span・rects（Reading の Rect の Vec）・marks（Reading の f64 の Vec）・derive は Debug・Clone・PartialEq）・pub fn strip（SeatCard と Span から Strip・窓の右端は電文の at・365 行）・pub fn strip_class（状態の値から sg-run・sg-wait・sg-limit・sg-silent・sg-unknown）・pub fn strip_svg（矩形と縦線の x から SVG の字・縦線の class は mk と mk-acct、右端は mk と mk-now）・Seat の strip（幅で Strip を引く）。wasm の target のときだけの mod dom の strip_view（682 行）が class strip の div に見出しと幅の button と、選んだ幅の SVG を描く。SeatCard の at は EpochSecs（u64 の秒）。stylesheet に規則 .saxis（位置 relative・中の span は絶対位置で左右の真ん中を合わせる）・.sleg・.sleg-i・.ssample・.sleg-i .ssample（幅 28・高さ 12）・.mk・.mk-acct・.mk-now・.sg-run ほかが在り、語の辞書に鍵 lg_run（語 busy）・lg_wait（語 idle）・lg_silent・lg_limit・lg_unknown・lg_acct・lg_now・history が在る（確かめた）。Strip と Span と strip_svg を使う着地済みの歯は tests/seatblock.rs（Strip の欄を名で読み、Strip を struct の字で組まない）と tests/acctsess.rs（account の session の module が seat の Span・rects・strip_svg を呼び、歯がその字を比べる）。
      形（host でも組む値と関数）。Span に pub fn tick（目盛の間の秒・H24 は 21600・H6 は 3600・H3 は 1800＝見本の SPANS の tick）を足す。pub struct Tick（pub な欄 left と label・どちらも String・derive は Debug・Clone・PartialEq・Eq）と pub fn span_ticks（EpochSecs の at と Span を受けて Tick の Vec）を足す。決まりは見本の spanTicks と spanAxis と同じ。窓の始まり a は at から span の secs を引いた値（0 で止める）、最初の目盛は a を tick で割って切り上げた数に tick を掛けた時刻で、そこから tick ずつ足して at 以下の時刻を全部並べる。並べた数が 6 を越えれば、0 から数えた位置が偶数の目盛だけを残す。各目盛の位置の百分率は、目盛の時刻から a を引いた秒を f64 にして span の secs の f64 で割り 100 を掛けた値で、この値が 92 を越える目盛は落とす（丸める前の値で比べる）。left は百分率を小数 2 桁に丸めた字（format の精度 2）、label は hm の字から末尾の Z を除いた時と分の字。Strip に pub な欄 ticks（Tick の Vec）を足し、strip は span_ticks に電文の at とその幅を渡した値を入れる（rects と marks の値と strip_svg は変えない）。凡例は pub const LEGEND（記号の名と語の鍵の対の 7 つ・順に run と lg_run・wait と lg_wait・silent と lg_silent・limit と lg_limit・unknown と lg_unknown・acct と lg_acct・now と lg_now）と pub fn sample_svg（記号の名の &str を受けて SVG の String）で組む（足す関数と定数は mod dom より前に置く）。見本の凡例の 8 つのうち起動と終了（lg_spawnstop）は、本番の稼働の記録がその縦線を描かない（電文に無い）ので置かない。sample_svg の字は svg の要素（属性 class は ssample・width は 28・height は 12・viewBox は 0 0 28 12・aria-hidden は true）の中に、状態の 5 つの名は rect の要素 1 つ（class は strip_class の値・x は 0・y は 12 から高さを引いた値・width は 28・height は wait と unknown が 12 に LOW を掛けた値でほかは 12）、acct と now は line の要素 1 つ（class は mk と mk-acct か、mk と mk-now の 2 語・x1 と x2 は 14・y1 は 0・y2 は 12）、ほかの名は中の要素の無い svg。数は f64 の Display の字（12 に 0.45 を掛けた値は 5.4・12 からそれを引いた値は 6.6・12.0 は 12）で、属性の値は引用符で囲む（strip_svg と同じ書き方）。
      形（DOM・wasm の target のときだけ）。mod dom の strip_view は、選んだ幅の SVG の下に class saxis の div（aria-hidden は true）を置き、選んだ幅の Strip の ticks を、style の left に left の字と百分率の記号をつないだ値を持つ span の要素で、label の字として並べる（幅を切り替えると目盛も替わる・電文の区間が読めないときも目盛の時刻は電文の at から出す）。その下に class sleg の div（aria-label は語 history）を置き、LEGEND の順に class sleg-i の span（sample_svg の字を inner_html に持つ要素と、語の鍵の語の span）を並べる。見本の時点のつまみ（?at= の scrub）と、固定の時刻の軸（class axis）と、SVG の中の目盛の縦線（mk-tick）は、この行では足さない。
      直さずに通る着地済みの歯（write-set の外・tests の下を grep で確かめた）。tests/seatblock.rs の seatblock_strip_rects_and_marks_per_span（各幅の rects と marks の値）・seatblock_strip_svg_text（strip_svg の字）・seatblock_unknown_parts_only_unmeasured（rects と marks の Reading）・seatblock_keys_in_vocab_and_classes_in_stylesheet（19 の鍵と、組の値の class）・seatblock_span_query_read_and_write（span_of と with_span）・seatblock_landed_shape_and_no_new_deps（BLOCK・PATH・body の外形と依存）ほかは、この行が変えない値と外形だけを見る。tests/acctsess.rs は seat の Span・rects・strip_svg・span_of・with_span・OK・NG を使い、この行はそれらを変えない。tests/accthome.rs と tests/acctproj.rs（window_row・top・NG・OK）、tests/steady.rs の steady_details_use_fold_record（seat.rs の details と記録を呼ぶ所は 2 つずつのまま・記録の関数の名と開き丸括弧の並びを doc にも書かない）、tests/hsderive.rs の hsderive_consts_match_note（seat の PATHS と FOLDS）、tests/parts.rs（引用符の /api/ の字を足さない）、tests/frame.rs の frame_classes_are_in_stylesheet（足す class の字 saxis・sleg・sleg-i・ssample は stylesheet に在る）と frame_no_heading_words_in_code（見出しの語は label で引き、日本語の字を足さない）と frame_blocks_without_data_are_unmeasured（seat の body）も通る。
      並べて走る行との取り合い。account board の session の見出しの時刻の軸（後の行 h-sess-axis）は span_ticks を呼ぶ予定で、この行はその関数を wasm の target に限らない pub にしておく。
      測り方。新しい歯は tests/seataxis.rs に置き、名を saxis_ で始める。名の例は saxis_ticks_on_the_hour・saxis_ticks_off_the_hour・saxis_strip_carries_ticks・saxis_legend_samples・saxis_src_draws_legend_axis・saxis_own_names_clean。span_ticks の表（left の字と label の字の対）。at 1790510400（2026-09-27T12:00:00Z）で、H24 は 0.00 と 12:00・25.00 と 18:00・50.00 と 00:00・75.00 と 06:00 の 4 つ（並べた 5 つのうち 100.00 の 12:00 を落とす）、H6 は 0.00 と 06:00・33.33 と 08:00・66.67 と 10:00 の 3 つ（並べた 7 つの偶数の位置のうち 100.00 を落とす）、H3 は 0.00 と 09:00・33.33 と 10:00・66.67 と 11:00 の 3 つ。at 1790512800（12:40:00Z）で、H24 は 22.22 と 18:00・47.22 と 00:00・72.22 と 06:00 の 3 つ（97.22 の 12:00 を落とす）、H6 は 5.56 と 07:00・22.22 と 08:00・38.89 と 09:00・55.56 と 10:00・72.22 と 11:00・88.89 と 12:00 の 6 つ、H3 は 11.11 と 10:00・27.78 と 10:30・44.44 と 11:00・61.11 と 11:30・77.78 と 12:00 の 5 つ（94.44 の 12:30 を落とす）。strip の歯は着地済みの fixture の tests/fixtures/surface/seat-card.json の 5 つの組（at はどれも 1790510400）を seat の content で読み、3 つの幅の ticks が span_ticks の値と同じことを見る。sample_svg の歯は run・wait・acct・now の字が svg の開きの字で始まり svg の閉じの字で終わり、属性の字（属性の名と等号と引用符で囲んだ値）として class の ssample と viewBox の 0 0 28 12 を持ち、run は rect の class sg-run・y 0・height 12、wait は rect の class sg-wait・y 6.6・height 5.4、acct は line の class mk mk-acct・x1 14、now は line の class mk mk-now・x1 14 を持つことを見る（属性の順は見ない）。字の歯は CARGO_MANIFEST_DIR から src/project/seat.rs を読み、mod dom の中に class saxis・class sleg・class sleg-i の開きの字と、sample_svg と開き丸括弧・ticks・LEGEND の字が在ることを見る。DOM の振る舞いは host で撃てないので、xtask の surface-build が通ることで組めることを見る。
      filter の語。着地済みの行の verify の filter の語（contracts の 3 つの契約の file の verify の行から数えた・確かめた）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hook_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・hbproc_・hbconf_・hbroute_・hbpost_・hsblock_・hspage_・hsderive_ の 49 で、同じ波の行の接頭辞（この行の saxis_ を除く）は mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_ の 16。新しい歯の名から先頭の saxis_ を除いた字は、この 65 のどれも部分の字として含まない（例 saxis_seatblock_x・saxis_stage_x・saxis_ticker_x は不可）。歯 saxis_own_names_clean は tests/seataxis.rs の字を読み、test の属性の行の次の fn の名を全部集めて見る。
      依存は足さない。Cargo.toml と vocab.json と style.css は触らない。

