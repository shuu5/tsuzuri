sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      面の行 2 つ。
      h-win-store は、account board の開いた窓の一覧を browser の保存（鍵 tz-wins）に残し、同じ origin のほかの tab の書き替えを storage の event で受け、読み直した後の handle を失った窓を開いたはずと出し、project board の戻るの閉じの知らせで閉じたにする。
      g-coach は、project board の home の頁で、初心者の mode のときに次の一手・orchestrator の状態・pipeline の札の 3 か所を順に案内し、済み印を browser の保存（鍵 tz-coach）に残して、query の coach=1 で出し直す。
