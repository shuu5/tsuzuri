  - n: 3
    type: prose
    title: 行 h-win-store — 開いた窓の一覧を browser に残し、読み直した後の窓の閉じの知らせを受ける
    body: |
      在りかの main は f21df41（計画 surface-plan 第 0.55 版・この行の書く file の字は 0590728 と同じ・置き場だけの = で持つ歯 tests/gjst.rs は、その後に c-pipe-ci が書いて着地した）。この節の行の番号と行の数はその字で、試作は 0590728 の写しで撃ち、f21df41 の写しで撃ち直した。
      なぜ。要件 FR1 の plain は、開いた窓の一覧をその browser に覚えさせ、消えても画面は元どおり組める、と書く。計画の判断の表の d4（持ち主の裁定 t3-hub.52.16）は、mode・開いた窓の一覧・最初の案内の済み印の 3 つを browser に残す（便利の写しで正本ではない）と決め、保存の字は src/account の外の 1 つの module に置く形を許す。着地済みの行 h-win の windows.rs は一覧を頁の一生の間だけ持ち（頭の doc の字は未決）、account board を読み直すと一覧が空になる。計画の 9 節のこの行の字は、一覧を browser に残し、ほかの tab の変化を storage の event で受け、読み直した後の handle を失った窓（見本の nohandle）の閉じの印もこの行で付ける（第 12 波 c の起草の問い 6）、と決める。
      在りか・面の code（write-set）。src/account/windows.rs（315 行）は、頭の doc（1〜3 行）・pub enum WinState（44 行・Open と Closed）・pub fn after_open（66 行）・button_text（117 行）・state_word（125 行）・state_mark（133 行）・row_class（141 行）と、wasm の枝の mod dom（161 行）の thread_local の WINS（187 行・頁の一生の間だけ）・HANDLES・SWEEPING と、fn wins（194 行）・fn sweep（199 行・handle の closed が真の窓を閉じたにする）・pub fn open（224 行）・pub fn list_view（253 行）・fn row（274 行）を持つ。src/store.rs（93 行）は保存の口の私的な fn storage（53 行）と wasm の枝の pub fn get（59 行）・set（65 行）を持つ（行 g-mode-store）。src/board.rs（283 行）の fn back_to_board（97 行）は窓の名 tz-account で account board の窓を探し、腕 BackStep::Front（107 行）で前面へ出してから自分の窓を閉じる。書かない file。src/account/board.rs は mount で自分の窓の名を tz-account にする。stylesheet の 847 行は .wins > li.w-closed と .wins > li.w-nohandle の題の字を薄くする（着地済み）。
      在りか・見本（書かない）。docs/design/mock3/account/index.html の 358〜401 行は、窓の一覧を localStorage の鍵 tz-wins に project ごとの JSON（開いた時刻 at・閉じた印 closed・前面の時刻 front）で持ち、状態を 3 つ（handle が生きていれば open・閉じた印か閉じた handle なら closed・ほかは nohandle）にし、語 開いたはず（この窓の reload で handle なし）と button 前面へを出し、storage の event（鍵 tz-wins）と focus の event で描き直す。見本は 1 つの origin の上の mock で、project board の戻るが同じ保存に閉じた印を書ける。
      形。(a) windows.rs の WinState に NoHandle を足し、state_word・state_mark・row_class・button_text・after_open の腕を足す（開いたはずの窓は前面へ・記号 unknown・class w-nohandle・開くと Front）。(b) pub const WINS_KEY と、保存の字を書く pub fn wins_text と戻す pub fn wins_from（戻した open の項は NoHandle）と、生きている handle を重ねる pub fn with_live を足す。(c) 閉じの知らせの pub const CLOSED_MSG・pub fn closed_message・pub fn closed_project（送り手の origin の hostname を見る）を足す。(d) mod dom の fn wins は初めて撃たれたときに 1 度だけ、保存の一覧に生きている handle を重ねて置き（fn reload）、store::on_change で鍵 WINS_KEY の書き替えのたびに reload を撃ち、message の event の受け手 fn closed_by_message を付ける。一覧を移す所（open と sweep と closed_by_message）は fn change で移して保存に書く。closed_by_message は字の data と origin と頁の hostname を closed_project に通し、名が返れば handle を捨てて一覧で閉じたにする。(e) store.rs に wasm の枝の pub fn on_change を足す（storage の event の鍵が同じときだけ撃つ）。(f) board.rs の fn back_to_board の腕 BackStep::Front は、在った窓へ closed_message（自分の窓の名）を送り先の origin を限らずに送ってから前面へ出す。(g) 新しい歯 tests/hwstore.rs（7 本）。windows.rs・store.rs・board.rs の頭の doc はこの形を書く（doc の字は歯で測らない）。
      決めた幅（起草の決め）。(h) 保存の字は見本の JSON でなく 1 項 1 行の tab 区切り（面の crate の依存は契約の crate だけで、json の読み書きを持たない・着地済みの歯 acctwin_manifest_features_already_there と mstore の依存の見張り）。見本の時刻 at と front は持たない（本番の一覧は時刻を出さない）。(i) 本番は account board と project board の port が違い origin が違うので、project board は account board の保存に書けない。読み直した後の窓の閉じの印は、project board の戻るが在った account board の窓へ送る message の event で付ける（見本の閉じた印の本番の形）。OS の窓の閉じ・project board の読み直し・戻るを経ない閉じは知らせが無く、開いたはずのまま残る。その窓の前面へを押すと、窓が無ければ window.open が空の窓を返して新しく開く（着地済みの open の手順）。(j) 知らせの受け手は送り手の origin の hostname が頁の hostname と同じときだけ受ける（port は見ない・2 つの board は同じ host で配る・行 h-board-url）。送り先の origin は限らない（別の origin の窓の href は読めない・中身は窓の名だけ）。(k) storage の event は同じ origin のほかの tab の書きだけが届く（同じ account board を 2 つの tab で開いたとき）。見本の focus の event での描き直しは採らない（本番は一覧を signal で持ち、保存の書き替えと知らせで置き直す）。(l) 保存の一覧の読みと event の受け手の取り付けは頁で 1 度（初めて一覧を撃つとき・list_view か open）。保存が使えない browser は store の get が None を返し、空の一覧から始まる（g-mode-store の決まり）。
      着地済みの歯（grep で確かめ、試作で撃った）。acctwin_no_storage_and_wasm_wiring は src/account の下の .rs に字 localStorage・sessionStorage・cookie が無いことと open の手順の字を見る。windows.rs は保存を store の get・set・on_change で呼び、保存の口の字を持たないので直さずに通る（計画の d4 の後半の形）。acctframe_path_from_contract_and_no_storage は account の file に字 /api/ と保存の字が無いことを見る。bport_dom_open_composes は open の本体の字を読む（本体の一覧の移しは fn change に替わるが、見る字は残る）。gbnote_board_text は board.rs に字 tz-wins・local_storage・store::set( が無いことと戻るの字を見る（この行は board.rs に閉じの知らせの 2 行と注の 1 行と doc の 1 行を足し、use の 1 行を替える）。mstore_module_text は store.rs の wasm の fn が cfg の行の直後に在り unwrap・expect・panic が無いことを見る。frame_no_heading_words_in_code と frame_classes_are_in_stylesheet と aord・gjst・kindlab の歩きの歯は src の全部を読む。= で持つほかの歯の file（acctwin（acctwin_）・bport（bport_）・acctframe（acctframe_）・gbnote（gbnote_）・gpulse（gpulse_）・gfresh（gfresh_）・gpill（gpill_）・brand（brand_）・ptitle（ptitle_）・acctwire（acctwire_）・hsblock（hsblock_）・hspage（hspage_）・smore（smore_）・lcard（lcard_）・ncard（ncard_）・mstore（mstore_）・frame（frame_）・parts（parts_）・aord（aord_）・gjst（gjst_）・kindlab（kindlab_））は board.rs か windows.rs か src の全部を読む着地済みの歯で、どれも verify で撃つ。
      測り方・歯。試作（main 0590728 の写しと f21df41 の写し）で hwstore の 7 本が通り、f21df41 の写しで面の crate の歯 695 本と、xtask の check（workspace の歯 1350 本・host と面の wasm の clippy の -D warnings・面の組み立て）が rc 0（次の行 g-coach を当てた木で撃った）。噛み（直しを 1 か所ずつ崩して撃った）: 保存の字で開いたはずを closed と書くと hwstore_text_and_restore が、戻しで open の項を開いているにすると同じ歯と hwstore_restore_skips_broken_lines が、同じ project の行を読み捨てないと hwstore_restore_skips_broken_lines が、生きている handle を重ねないと hwstore_live_handles_overlay が、開いたはずの窓を開くと新しいにすると hwstore_nohandle_open_and_close が、送り手の hostname を見ないか頭で比べると hwstore_closed_message_and_sender が、開いたはずの行の class を空にすると hwstore_key_and_nohandle_words が、一覧を移しても保存に書かないか storage の event の鍵を見ないか戻るで閉じの知らせを送らないと hwstore_wasm_wiring が落ちる（acctwin と gbnote の歯は落ちない）。差分は 4 file・+399 −15・23598 byte（gate の上限 150000 byte の内）。src は +159 −15 で、計画の字の大きさ S（100 行の余白）を越えるので M と書く。
      filter の語（main f21df41 の contracts の verify の filter の語 239 を、ほかの語を部分の字として含まない 165 語に畳んだ字）は aaround_・accept_・acchold_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadl_・cadopt_・cadq_・cdorm_・cfsplit_・cgdom_・cmark_・contract_form_・cround_・csled_・cspk_・ctick_・denv_・dnedge_・dnrow_・dnskip_・ecache_・epolq_・flight_・fmark_・fprem_・frame_・fserve_・fstop_・fxpre_・g3g7_・gapspage_・gbnote_・gfix_・gfresh_・ghb_・gjst_・glabel_・gnav_・gpface_・gpill_・gpulse_・graph_・gsum_・gtuck_・gview_・hacols_・harest_・hasplit_・hbconf_・hbmark_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hdchip_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hshist_・hspage_・hspk_・hsym_・iclose_・ilink_・kcli_・kindlab_・klink_・launch_・lcard_・ledgerblock_・lhome_・lidle_・lresume_・lsnap_・lspark_・lstg_・lstore_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・nxorg_・parts_・pci_・pclosed_・pfold_・pipe_・plimit_・pmisfit_・pmore_・pquest_・pqueue_・project_・ptitle_・punmap_・pwhole_・qblock_・qgate_・qkey_・question_・relay_・rhold_・runsdoc_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・stcli_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_ で、新しい歯の名から hwstore_ を除いた字はどの語も部分の字として含まない（接頭辞 hwstore_ はどの語も含まず、どの語にも含まれない）。
      依存と順。depends は空。同じノートの g-coach は src/board.rs を書き store.rs を置き場だけの = で持つので、この行の後に流す（g-coach の depends）。ほかのノートの行との順は便の bead の依存で持つ（席が付ける）。走っていない便の行と重なる file は、c-limit-resume（ノート surface-wave13h）の = の gpill.rs と、c-ledger-stage（ノート surface-wave18a）の = の hsblock.rs・lcard.rs・gjst.rs・kindlab.rs で、どれも両方が = なので同時に流さないだけ（器の交差の断りが持つ）。歯 gjst.rs を書いた c-pipe-ci は着地済み。
      範囲の外。語の辞書の open_windows の internal の字（mock は localStorage tz-wins・本番は器の window registry）は直さない（席の問い）。器の window registry・OS の窓の閉じの検出・project board の読み直しの知らせ・一覧の時刻・account board の header。
  - n: 4
    type: prose
    title: 行 g-coach — home の頁の初心者の最初の案内と済み印
    body: |
      在りかの main は f21df41（計画 surface-plan 第 0.55 版・この行の書く file の字は 0590728 と同じ）。この節の行の番号と行の数はその字で、試作は 0590728 の写しに同じノートの h-win-store を当てた木で撃ち、f21df41 の写しで撃ち直した。
      なぜ。見本 mock v3 の ui.js は、初心者の mode の home の頁で最初の 3 手（次の一手・orchestrator の状態・pipeline の札）を輪で囲んで短い字の箱を出す（coach mark）。本番の面にはまだ無い。計画の判断の表の d4（持ち主の裁定 t3-hub.52.16）は最初の案内の済み印を browser に残すと決め、計画の 9 節のこの行の字は、home の 3 段・済み印を browser に残す・?coach=1 で出し直す、と決める。
      在りか・面の code（write-set）。src/widgets/mod.rs（8 行）は pub mod fig・help・hover・nodecard の 4 行と頭の doc。src/board.rs（283 行）の fn App（58 行）は HelpCtx（mode の signal）を context に置き、view の末尾に TipLayer と CardLayer（88〜89 行）を置く。頁は query の page から PageId::from_query で読み、home の頁は PageId::Home。src/store.rs の wasm の枝の get と set（59 行・65 行）は書かない（= で持つ）。書かない file。3 段の要素は project の next.rs（block の id next・大きく出す 1 つの class nxbig）・project_dom/seat.rs の class big の div（block の id orch・project/seat.rs）・pipeline.rs の札の class kcard が描く。stylesheet の 223〜231 行と 365 行は .coach・.coach-ring・.coach .ft .dots i.on の形を持つ（着地済み）。
      在りか・見本（書かない）。docs/design/mock3/ui.js の 1112 行の COACH（3 段の sel と text）・startCoach（1118 行・初心者でないか、済み印 done で query の coach が 1 でなければ出さない）・drawCoach（要素が無い段は飛ばし、段が尽きれば済み印を書く・輪は要素の枠の 4px 外・箱は要素の下 12px で横は 8px の余白で窓に収める・点と閉じると次へか分かったの button）・closeCoach（Esc も閉じる・済み印は書かない）。setMode は経験者で閉じ、初心者に替えると home の頁で出し直す。頁を開いて 200ms の後に 1 度だけ始める。見本の 2 段目の selector は #seatbody .big で、本番の orchestrator の block の id は orch。
      形。(a) 新しい src/widgets/coach.rs に、鍵と値の const・3 段の STEPS・button の字の const・pub fn starts・first_found・next_text・dots と、枠の型 Rect・pub fn ring・box_at・BOX_W を置く（host でも組む）。(b) wasm の枝の mod dom の #[component] CoachLayer は、HelpCtx が無ければ何も描かない。出している段を signal で持ち、段の要素の枠（get_bounding_client_rect と window の scroll と document の要素の client の幅）から輪と箱の置き場を決めて、class coach-ring の div と class coach の div（role dialog・aria-label 手引き・字・点・閉じると次へか分かったの button）を描く。閉じるは閉じて済み印を書き、次へは次の要素の在る段へ進み、段が尽きれば閉じて済み印を書く。Esc は閉じるだけ（済み印を書かない）。(c) Effect で HelpCtx の mode を見て、初めの 1 度は starts が真なら始め、後に初心者へ替わると済み印によらず始め、経験者へ替わると閉じる。始めるときは、どれかの段の要素が出るまで 200ms ごとに 25 回（5 秒）まで待ってから段 0 から出す。(d) board.rs の fn App は home の頁だけ view の末尾に CoachLayer を置く。(e) widgets の mod.rs に pub mod coach。(f) 新しい歯 tests/gcoach.rs（7 本）。頭の doc の字は歯で測らない。
      決めた幅（起草の決め）。(g) 本番の block は電文を読んだ後に描くので、見本の 200ms の後の 1 度の試しでは要素がまだ無く、案内がすぐ尽きて済み印を書いてしまう。そこでどれかの段の要素が出るまで 5 秒まで待ち、待ち切っても出なければ何も出さず済み印も書かない（見本は要素の無い段を全部飛ばして済み印を書く）。1 段でも出した後に段が尽きたときは見本どおり済み印を書く。(h) 箱の横の収めは箱の幅を stylesheet の広い方の 240px で見込む（見本は描いた箱の幅を測る・狭い画面の 220px では右の余白が 20px 広い）。窓の大きさの変化や scroll で置き直さない（見本と同じ）。(i) 2 段目の selector は本番の block の id で #orch .big。(j) 字は見本の COACH と button の字のまま（語の辞書の鍵にしない・見本も辞書に置かない）。(k) 済み印の書き読みは store の get と set（行 g-mode-store の保存の口・保存が使えない browser は毎回出す）。
      着地済みの歯（grep で確かめ、試作で撃った）。ncard_short_path_rules と hfig_names_and_svg_some は widgets の mod.rs の pub mod の行を見る（行を足すだけで残る）。gbnote_board_text は board.rs の禁じた字（tz-wins・local_storage・store::set(）を見る（この行は board.rs に use の 1 行と view の 1 行と doc の 1 行だけを足す）。hspage_no_variant_words は board.rs に頁の変種の名 Ask・Map・Gaps・Node が無いことを見る（この行は Home を書く）。mstore_board_calls は board.rs の mount と mode の押しの字を見る。frame_no_heading_words_in_code は src の全部に見出しの語の字が無いことを、frame_classes_are_in_stylesheet は src の class の字が stylesheet に在ることを見る。parts・aord・gjst・kindlab の歩きの歯は src の全部を読む。= で持つほかの歯の file（helpfig（hfig_）・gbnote（gbnote_）・gpulse（gpulse_）・gfresh（gfresh_）・gpill（gpill_）・brand（brand_）・ptitle（ptitle_）・acctwire（acctwire_）・hsblock（hsblock_）・hspage（hspage_）・smore（smore_）・lcard（lcard_）・ncard（ncard_）・mstore（mstore_）・frame（frame_）・parts（parts_）・aord（aord_）・gjst（gjst_）・kindlab（kindlab_））は board.rs か widgets の mod.rs か src の全部を読む着地済みの歯で、どれも verify で撃つ。
      測り方・歯。試作で gcoach の 7 本が通り、f21df41 の写しで面の crate の歯 695 本と、xtask の check（workspace の歯 1350 本・host と面の wasm の clippy の -D warnings・面の組み立て）が rc 0。噛み（直しを 1 か所ずつ崩して撃った）: query の coach=1 を見ないか経験者でも始めると gcoach_start_rules が、要素の無い段を飛ばさないと gcoach_skip_missing_steps が、最後の段の字を次へにすると gcoach_button_text_and_dots が、箱を右端に収めないか輪に scroll を足さないと gcoach_ring_and_box_place が、2 段目の selector を見本の #seatbody .big にすると gcoach_key_steps_and_words が、層を全部の頁に置くか Esc で済み印を書くか閉じるで済み印を書かないと gcoach_wasm_wiring が落ちる。差分は 4 file・+404 −1・18434 byte（gate の上限 150000 byte の内）。src は +230 −1 で大きさ M（300 行の余白）の内。
      filter の語（main f21df41 の contracts の verify の filter の語 239 を 165 語に畳んだ字・h-win-store の節と同じ）のどれも、新しい歯の名から gcoach_ を除いた字に部分の字として含まれない（接頭辞 gcoach_ はどの語も含まず、どの語にも含まれない）。
      依存と順。depends は h-win-store（同じノート・どちらも src/board.rs を書き、h-win-store は store.rs を書く・g-coach は store.rs を = で持つ）。ほかのノートの行との順は便の bead の依存で持つ（席が付ける）。走っていない便の行と重なる file は h-win-store の節と同じ（c-limit-resume の = の gpill.rs・c-ledger-stage の = の hsblock.rs・lcard.rs・gjst.rs・kindlab.rs）で、どれも両方が = なので同時に流さないだけ。
      範囲の外。account board の案内・案内の字の語の辞書の鍵・箱の置き直し（窓の大きさの変化と scroll）・案内の段の足し替え・案内を出した回数の記録。

