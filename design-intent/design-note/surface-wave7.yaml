  - n: 4
    type: prose
    title: 行 g-tip-expert — 経験者だけの注釈を注釈の層に足し、束の重なりと抜けの検査の見出しに付ける
    body: |
      なぜ。要件 FR14 は英語の技術語を英語のまま出して「?」で注釈し、経験者向けの 1 行を 60 字とする。見本（docs/design/mock3）は、語の辞書の鍵を持たない要素に経験者向けの字（属性 data-tip-expert）を置く。ui.js の tipContent は、指を置いた要素が語の鍵（data-term）を持たなければ、経験者の mode のときだけ、その字を改行で分けて行ごとに inline の描き方に通した内部の段（intHTML・class int の div）を注釈の箱に出し、初心者の mode では何も出さない（tipEl は data-term か data-tip-expert を持つ要素を拾う）。project board で見本がこの属性を置くのは、問いの card の投稿の時刻の chip（ask.html の qcard・字 posted_at と空白と投稿の時刻）、まとめて承認の重なりの chip（ask.html の id bo の chip・字 選んだ質問の touches の重なり（衝突の兆し））、抜けの検査の各行の見出し（gaps.html の details の class gitem の summary・字 不変条件の id と「 · 」と判定の名）と、地図の頁の切れ目と表の cell と節点の頁の段の chip。本番の注釈の層（src/widgets/help.rs）は語の鍵の注釈だけを出し、経験者だけの注釈を持たない。この行は注釈の層に経験者だけの注釈を足し、まとめて承認の重なりの chip と抜けの検査の各行の見出しに付ける。問いの card の投稿の時刻の chip は src/project/ask.rs の mod dom の問いの card の頭に在り、ask.rs は同じ第 7 波の行 c-q-blocking が書くので、この行は書かず、計画の 4 節の後の行 g-tick-adopt（同じ chip の経過を 1 秒の時計で書き直す行）がこの行の expert_tip で付ける。地図の頁の切れ目と表の cell は後の行 g-map-tips が、この行の関数で付ける。
      在りか（main 0bc6f45 で確かめた・起草の b525a13 から面の src と style.css と vocab.json と tests/fixtures/surface は変わっていない）。src/widgets/help.rs（write-set・着地済みの行 g-help-fig と g-help-sym が最後に書いた）の host の部分は、pub enum Inline（Text・Code・Sym・どれも String を持つ・derive は Debug・Clone・PartialEq・Eq）・pub struct Line・pub struct Note・pub fn note・note_of・line・pub fn inline（字の &str を受け Inline の Vec・波括弧で閉じた名を Sym・逆引用符で閉じた字を Code・ほかを Text）・fig_of・tip_class・place・pub fn shows_internal（frame の Mode を受け bool・Expert で真）・span_words・tick_words・fill・note_in・sym_html。file の頭は crate::frame::Mode を use する。wasm の target のときだけの mod dom は、pub struct Open（pub な欄 key の &'static str・x と y の f64・pinned の bool・derive は Debug・Clone・PartialEq）、pub struct HelpCtx（pub な欄 open の RwSignal の Open の Option と mode の RwSignal の Mode・derive は Debug・Clone・Copy）、非公開の ctx（use_context の HelpCtx）・at（leptos の ev の MouseEvent の参照と鍵と pinned を受け、place で置き場を決めた Open）・click・enter・leave、pub fn qmark・term・h1・h2・hs、非公開の inline_view・sym_view・lines_view、component の TipLayer を持つ。TipLayer の content の closure は let open = c.open.get()?; の後に let n = note_in(open.key, &window().location().search().unwrap_or_default())?; で注釈を組み、見出し（class tl）・head（class n1）・items・more（details の class more）・経験者の mode の internal（class int の div の中に行ごとの div）を描く。箱の class は tip_class の値（開いていれば tip と on）。file の頭の pub use dom::{HelpCtx, TipLayer, h1, h2, hs, qmark, term}; は wasm の target のときだけ。Open を組むのは help.rs の at だけで、HelpCtx を組むのは src/board.rs と src/account/board.rs の 2 か所（どちらも欄 open に RwSignal::new(None) を置く・この行は書かない・Open に欄を足しても組める）。名 Open の宣言は面の src に 2 つ（help.rs の struct と account の projects.rs の enum）。
      src/project/gaps.rs（write-set・着地済みの行 g-gaps と g-link-items が書いた・crate::project::gaps）の host の部分は、BLOCK（id gaps）・PATHS（空）・FOLDS（字 gaps と コロンと波括弧 2 つ）・REASON・UNREADABLE・EMPTY・NAMES・LIMIT・ORDER（Violation・Unknown・Pass）・Mark と mark と mark_class・name・Tile と tiles・cut・pub struct Row（pub な欄 id の String・verdict の契約の Verdict・mark・name・count・open・named・more・derive は Debug・Clone・PartialEq・Eq）・pub fn rows（InvariantCheck の slice を受け Row の Vec・違反とまだ分からないと合格の順・同じ判定の中は id の数の順）・Gaps・pub fn checks（Fetched の参照を受け Result の InvariantCheck の Vec）・body。名 Row の宣言は面の src に 5 つ（gaps・batch・next・mapview の list・account の mod）あり、この行の summary_tip が受けるのは gaps の Row。file の頭は契約の wire を use する。mod dom の row_view は、Row の r の named を動かして一覧を組み、fold に鍵を渡した後、<details class=gitem の tag（prop:open=open と on:toggle=toggle と data-id=r.id）の中に <summary> と判定の記号と名と数を置く。file に字 .nodes・.edges・.beads・.runs と引用符で始まる /api/ の字は無い（着地済みの歯が見る）。
      src/project/batch.rs（write-set・着地済みの行 g-batch が書いた・crate::project::batch）の host の部分は、BLOCK（id batch）・PATH（字 /api/batch）・PATHS・FOLDS・WRITTEN・pub struct Row・rows・body・selected・Counts と counts・can_send・request_body・Outcome・written・refused_text・outcome。mod dom の filled は、関わる所の chip（class chip num と data-term touches）と、重なりの chip（開きの tag は字 <span class=chip num の形で、中身は <span inner_html=WARN></span> と空白と重なりの数）を class metas row の div に置く（WARN は mod dom の中の見本の IC.warn の svg の字）。
      使う物（この行は書かない・確かめた）。account の home（src/account/home.rs・置き場だけの =・host でも組む）の pub const EXPERT_CHARS（usize・60・要件 FR14 の経験者向けの 1 行の字数）。frame の pub enum Mode（Beginner・Expert・host でも組む）。契約の graph の pub enum Verdict（Pass・Violation・Unknown・serde の名は kebab-case で pass・violation・unknown・pub const ALL はこの 3 つ）。style.css（この行は触らない）の規則 .tip・.tip.on（見える）・.tip .int（上の破線と monospace の字）と、class の名 chip と num。
      足す名（expert_note・expert_tip・OVERLAP_TIP・verdict_name・summary_tip）は、main の面の src と tests のどこにも宣言が無い（grep で確かめた・mapview の around.rs と graph.rs に在る名 expert_line とは違う名にした）。help.rs の Open に足す欄の名 expert は、project の timeline.rs の pub fn expert と RunRow の欄 expert と同じ名だが、別の module の別の物で、この行は timeline.rs を読まない。
      fixture の値（tests/fixtures/surface/invariants.json・この行は触らない・確かめた）。GraphDoc の本文で、invariants は 12 本（g-1・g-4 から g-8・g-11 が pass、g-2 と g-10 が violation（違反の数が 2 と 25）、g-3・g-9・g-12 が unknown）。
      形（host の部分）。help.rs に pub fn expert_note（字の &str と Mode を受け Option の Inline の Vec の Vec）を足す。shows_internal が偽の Mode なら None、真なら字を改行で分けた行のうち空でない行を順に inline に渡した値の列を返し、列が空なら None（見本の tipContent の、経験者の mode で字が在るときだけ intHTML を返す分け方と、intHTML の行ごとの inline の描き方）。batch.rs に pub const OVERLAP_TIP（&str・字 選んだ質問の touches の重なり（衝突の兆し）・見本の id bo の chip の字と同じ）を足す。gaps.rs に pub fn verdict_name（Verdict を受け &'static str・Pass に pass・Violation に fail・Unknown に unknown）と pub fn summary_tip（gaps の Row の参照を受け String・Row の id と「 · 」と verdict_name の字をつないだ字）を足す。判定の名は、見本の gaps.html が各行の見出しの data-tip-expert に置く字（不変条件の id と「 · 」と判定の名・判定の名は pass・fail・unknown の 3 つ）に揃える（電文の serde の名は違反が violation だが、見本の字は fail で、変えるなら見本を変える持ち主の裁定が要る）。
      形（DOM・help.rs の mod dom の中・字は次のとおりに決め、歯 tipx_dom_text がこの字で見る）。Open に pub expert: Option<String> の欄を足し（経験者だけの注釈の字・語の鍵の注釈では None）、at が組む Open の expert は None にする。pub fn expert_tip(el: web_sys::Element, text: String) を足す（hover の attach と同じ directive の形で、要素の tag に use:expert_tip と等号と String の値を書いて使う）。expert_tip は ctx() の HelpCtx が無ければ何もせず、在ればその値 c を捕まえ、要素に引用符で囲んだ mouseenter と mouseleave の受け手を web_sys の Closure で付け、forget で要素の一生の間持つ（受け手は event の時に context を引かず、捕まえた c を使う）。mouseenter の受け手（web_sys の MouseEvent を受ける・leptos の ev の MouseEvent と同じ型）は、留めた注釈が開いておらず、expert_note に text と c.mode の今の値を渡した値が Some のときだけ、c.open に、at と同じ置き場（place に event の client の x と y と窓の幅を渡した値）で key が空の字・pinned が偽・expert が Some（text の写し）の Open を置く（字 expert: Some( を書く・at に event と空の字と偽を渡した値の expert だけを替えてもよい・空の字は語の辞書の鍵に無い）。mouseleave の受け手は、留めていない注釈が開いていれば c.open を None にする。file の頭の pub use dom::{ の列に expert_tip を足す。TipLayer の content の closure は、let open = c.open.get()?; の後、note_in の前に、open.expert（字 open.expert を書く）が Some の字なら、expert_note にその字と c.mode の値を渡した行を、class が int の div の中の行ごとの div で描いた値を返し（行の片は inline_view で描く・None なら何も返さない）、語の鍵の注釈の組み方（字 note_in(open.key, と location().search() を含む今の行と、それより後）は変えない。経験者だけの注釈は見出しの行（class tl）と「詳しく」を持たない（見本の intHTML だけの箱と同じ）。
      形（DOM・gaps.rs と batch.rs の mod dom の中・字は次のとおり）。gaps の row_view は、r の欄を動かす前に let tip = summary_tip(&r); を置き、summary の開きの tag を <summary use:expert_tip=tip> にする（summary の中身は変えない）。batch の filled は、重なりの chip の開きの tag を、class の字 chip num の後に空白と use:expert_tip=OVERLAP_TIP.to_string() を足した形にし、中身の <span inner_html=WARN></span> と空白と重なりの数は変えない（字 use:expert_tip=OVERLAP_TIP.to_string()><span inner_html=WARN></span> が DOM の部分に在る）。2 つの mod dom の use に要る名（crate::widgets::help::expert_tip と super の summary_tip と OVERLAP_TIP）は書き方を問わない。新しい class と語の鍵と引用符で囲んだ /api/ の字は足さない。
      出さない物。問いの card の投稿の時刻の chip の注釈（ask.rs・後の行 g-tick-adopt・上の なぜ）、地図の頁の切れ目と表の cell の注釈（後の行 g-map-tips）、語の鍵を持つ要素の経験者だけの字（見本は語の鍵が在ると data-tip-expert の字を出さない）、keyboard の focus で出すこと（本番の term と qmark と同じく指の出入りと押しだけ）、経験者だけの注釈を押して留めること（見本も留めるのは「?」の button だけ）。
      src の字の 2 つの決まり（着地済みの歯が src の全部で見る）。frame_classes_are_in_stylesheet は src の全部の file の字の、class と等号と引用符の 3 字の並びの後から次の引用符までの字を class の名として拾い、style.css に在ることを見る。この行が書く class の字は int と、今の chip num だけで、どれも style.css に在る。frame_no_heading_words_in_code は語の辞書の非 ASCII の見出しの語と同じ字の literal を src に書かないことを見る。この行の literal（OVERLAP_TIP の字・「 · 」・空の字）は、どれも見出しの語と同じ字でない（語の辞書を読んで確かめた）。
      着地済みの歯（直すもの）。無い。
      着地済みの歯（直さずに通る・write-set の外・tests の下の全部を grep で確かめた）。hsym_dom_source（tests/hsym.rs）は help.rs の字 mod dom { より後に if let Some(html) = sym_html(sym) と inner_html=html と note_in(open.key と location().search() が在り、note(open.key) が無いことを見る（この行は語の鍵の注釈の行を残し、足す字に note(open.key) の並びを作らない・expert_note に渡すのは open.expert の字）。hfig_dom_source（tests/helpfig.rs）は同じ所に fig_of と fig::svg と、class と等号と引用符で囲んだ figli が在ることを見る（残す）。frame_help_note_splits_lines と hsym_ と hfig_ の値の歯は note・note_of・line・inline・fig_of・tip_class・place・shows_internal・fill・note_in・sym_html の値を見る（変えない）。gapspage_ の歯（tests/gapspage.rs）は rows と tiles と cut と body の値と、gaps.rs に map::PATH が在り字 .nodes・.edges・.beads・.runs と引用符で始まる /api/ と保存の口の名が無いこと、gaps.rs の class の字が style.css に在ることを見る（この行はどれも足さず消さない）。ilink_gaps_src_uses_row（tests/itemlink.rs）は gaps.rs の mod dom に item_view( と found と、class ttl の span の中の class nid の span の字が在ることを見る（残す）。batchpanel_ の歯（tests/batchpanel.rs）は batch と policy の値と、batch.rs の字に ask の鍵の判定の use と key_action(composing, と変換の途中の判定の字と crate::net::read(ask::PATH) と crate::net::post(PATH, body) と unmeasured(reason) が在り、保存の口の名が無く、引用符で囲んだ /api/batch が 1 度であることを見る（残す）。steady_details_use_fold_record は block の file ごとの details の tag と fold の呼びを見る（gaps.rs の details の tag は変えない）。parts_paths_distinct_in_block_modules と境界の brand_path_written_once_in_contract は src の引用符で囲んだ /api/ の字を数える（足さない）。hsderive_・hsblock_・hspage_ の歯は block の BLOCK と PATHS と FOLDS と頁の枠を見る（変えない）。account の歯（acctframe_ と acctwin_ ほか）は src/account の下の file を読む（この行は書かない）。tests/snapshots の頁の写しは頁の枠と block の並びだけを持つ。
      測り方。新しい歯は tests/tipx.rs に置き、名を tipx_ で始める。歯は help の expert_note と inline と Inline、frame の Mode、batch の OVERLAP_TIP、gaps の verdict_name と summary_tip と checks と rows、契約の Verdict、account の home の EXPERT_CHARS を host で呼ぶ。fixture は CARGO_MANIFEST_DIR から ../../tests/fixtures/surface/invariants.json として読み、Fetched の Body に入れて gaps の checks に渡す（着地済みの gapspage_ と同じ読み）。字数は Unicode の scalar で数える。tipx_dom_text は CARGO_MANIFEST_DIR から src/widgets/help.rs と src/project/gaps.rs と src/project/batch.rs の字を読み、字 mod dom { の最初の所より前と後に分けて done (4) の字を探す。注釈の箱と要素の受け手は wasm の target のときだけなので、字の歯と xtask の surface-build で見る。自分の名の歯は tests/tipx.rs の字を読み、test の属性の行の次の fn の名を全部集め（着地済みの hsym_names_stay_apart と同じ読み方）、名の数が 5 以上であることと done (6) を見る。fixture は足さない。
      filter の語（着地済みの 49 の語・第 3 波の 17・第 4 波の 4・第 5 波の 11・第 6 波の 4・第 7 波のほかの行の 7・この行の接頭辞 tipx_ は並べない・92 語）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・hcard_・qgate_・nsum_・ntime_・ptitle_・ncard_・hsym_・smore_・lcard_・aaround_・hruling_・sxaxis_・plimit_・bport_・fstop_・nsumw_・fmark_・fserve_・cadopt_・hcsess_・hcproj_・sesplit_・mstore_・athr_・qblock_ で、新しい歯の名から先頭の tipx_ を除いた字は、このどれも部分の字として含まない（例 tipx_gapspage_x・tipx_batchpanel_x・tipx_frame_x・tipx_hsym_x は不可）。名は done に書いた tipx_expert_note_rules・tipx_overlap_tip_text・tipx_gaps_summary_lines・tipx_dom_text・tipx_names_stay_apart（どの語も含まない）。
      依存は足さない。depends は空（着地済みの行 g-help-sym が最後に help.rs を書いた・計画の 5 節の help.rs の順 g-help-sym から g-tip-expert・main で確かめた）。Cargo.toml・vocab.json・style.css・fixture・board.rs・account の board.rs・home.rs・ask.rs は触らない。help.rs と gaps.rs と batch.rs は第 7 波のほかの行の write-set に無い。gaps.rs は計画の 5 節の順で後の行 g-card-adopt-c が続けて書き、help.rs の expert_tip は後の行 g-map-tips と g-tick-adopt が使う。同じ波の行 c-q-blocking は ask.rs を書き、batch.rs が使う ask の cards・EMPTY・REASON・key_action ほかの名と形を変えない前提で並べる（変えるなら batch.rs と重なるので席が順を決める）。help.rs は project の seat の Span と span_of を読むだけで、同じ波の行 g-seat-split が seat.rs の DOM の部分を移しても host の Span と span_of は残る前提。
  - n: 5
    type: prose
    title: 行 g-seat-split — 席の block の DOM を block の dir の外の file へ移す
    body: |
      なぜ。project board の block「orchestrator と口座」の file src/project/seat.rs は、計画 surface-plan の 5 節の並びで、この行の後に M の行 c-seat-tick・c-seat-grace・c-seat-group と S の行 g-seat-thr と M の行 g-seat-hb が続けて書く。受付は src の 1 file を 1500 行 以下とし（規則の行 R-4 の 1 module 1,500 行 以下・計画の作法 8）、大きさ S は 100 行・M は 300 行の余白を数えるので、今の seat.rs には後の行の全部の余白が無い。seat.rs の中身の約 3 分の 1 は wasm の target のときだけの DOM（file の末尾の inline の mod dom）で、host の歯が撃つ純粋な関数とは分かれている。そこでこの行は、その中身を字を変えずに別の file へ移し、seat.rs を host の部分と mod dom の宣言だけにする。振る舞いは変えない（DOM の字も、関数の名と引数と返りも、module の path も同じ）。後の行は host の値を seat.rs に、DOM を新しい file に足す。要件 FR12（口座と席の健康）の後の行が載る場所を作る行で、FR12 の振る舞いはこの行では変わらない。
      在りか（確かめた・main の commit b525a13 と 0bc6f45・seat.rs と tests の steady.rs・seataxis.rs・smore.rs は着地済みの行 g-seat-more の後に変わっていない）。seat.rs は build.rs が生成する字（組み立ての出力の dir の project_blocks.rs・src/project の mod.rs が include で取り込む）の中の、絶対の path の属性つきの pub mod seat の宣言で組まれ、crate::project::seat の path で使える。host の部分は BLOCK（id orch）・PATH（/api/seat）・PATHS・FOLDS（seat:hist と seat:more）と、MORE_SRC・seat_line・More・Seat・content ほかの定数と型と純粋な関数で、その後に wasm の target のときだけの pub fn view（引数なし・返りは leptos::prelude::AnyView・本文は dom::view() だけ）と、doc の 1 行と wasm の target のときだけの属性の行に続く inline の mod dom（字「mod dom {」の行から file の末尾の閉じ波括弧まで）が在る。mod dom の中身は、use の行（leptos::prelude の全部・契約の型の Reading・super の BLOCK・Band・HistRow・LEGEND・Low・MORE・MORE_SRC・More・OK・OROW・PATH・Seat・Sign・Span・Strip・Top・WindowRow・content・sample_svg・span_of・strip_svg・with_span・crate::project の Body・UNKNOWN・body_view・fold・section・state_icon・unmeasured・crate::vocab の label・crate::widgets::help の HelpCtx・hs・shows_internal・term）と、定数 HOURGLASS（限度の記号の svg の字）と、この順の 16 の関数 search・pick・view・unknown・text_or_unknown・sign_view・seat_view・band_view・big_icon・top_view・strip_view・window_view・low_view・hist_row・hist_view・more_view で、pub は view（引数なし・AnyView を返す）だけ、ほかは mod dom の中の私的な関数。中の関数はどれも 4 つの空白の字下げの閉じ波括弧で閉じる。details の要素は hist_view と more_view に 1 つずつ、記録の関数 fold を呼ぶ所も同じ 2 か所（鍵 seat:hist と seat:more）で、mod dom の外の seat.rs の字には details の要素も fold を呼ぶ所も無い。
      置き場の決め（確かめた）。(a) build.rs の block_names は src/project の dir を read_dir で 1 段だけ読み、名が .rs で終わる file（mod.rs を除く）を全部 block の module に数える。src/project に dom.rs を足すと block の module dom に数えられ、BLOCK と PATHS と FOLDS と view が無いので組めない。(b) 生成の字は seat.rs を path の属性で読むので、rustc は seat.rs を mod.rs と同じに扱い、seat.rs の中の path の属性の無い mod dom の宣言は兄弟の src/project/dom.rs か src/project/dom/mod.rs を探す（toolchain 1.98.1 の rustc で同じ形の小さな crate を組んで確かめた・rustc の module の読みの決まり）。(c) 着地済みの歯 frame_one_module_per_block（tests/frame.rs）は src/project の dir の項の名を全部（.rs で終わらない dir の名も・mod.rs だけ除く）集めて、生成の Module の ALL の名に .rs を足した列と同じかを見るので、src/project/seat のような dir を足しても落ちる。そこでこの行は新しい file を src の下の新しい dir project_dom に置き（src/project_dom/seat.rs・名は block の module と同じ）、seat.rs の中で path の属性で読む。path の属性の字は seat.rs の在る dir（src/project）からの相対の path ../project_dom/seat.rs（rustc は path の属性で読んだ file の中の path の属性を、その file の在る dir から読む・同じ小さな crate で組めて super が seat を指すことを確かめた）。dom の module の path は crate::project::seat::dom のままなので、中の use super の行と、seat.rs の pub fn view の dom::view() の呼びはそのまま使える。src/project_dom は lib.rs の module ではなく、build.rs は src/project と src/pages しか読まないので block にも頁にも数えられない。この行は lib.rs と build.rs と src/project の dir の項を変えない。組み立ての script の rerun の 2 行（src/project と build.rs）もそのままでよい（生成の字は src/project の file の名だけで決まり、src/project_dom/seat.rs の中身の変化は rustc が module の file として追って組み直す）。
      形。seat.rs では、inline の mod dom の前の doc の行と、そのすぐ次の wasm の target のときだけの属性の行（字「mod dom {」の行のすぐ前の行）を残し、字「mod dom {」の行を、path の属性の行（path と等号と引用符で囲んだ ../project_dom/seat.rs）と、mod dom とセミコロンの行の 2 行に替え、その次の行から file の末尾の閉じ波括弧までを消す。wasm の target のときだけの属性の行は 1 つのままにする（属性の行を新しく足して 2 つ重ねると歯 sesplit_texts_kept の値が変わる）。file の末尾は、doc の行・wasm の target のときだけの属性の行・path の属性の行・mod dom とセミコロンの行の 4 行になる。doc の行は残すか、置き場の path を足して書き直してよい。host の部分と pub fn view は変えない。新しい file src/project_dom/seat.rs には、mod dom の開き波括弧の次の行から末尾の閉じ波括弧の前の行までを、各行の頭の 4 つの空白を外すだけで順を変えずに置く（中の関数は字下げの無い閉じ波括弧で閉じ、pub fn view と const HOURGLASS と 16 の関数の宣言は行の頭から始まる）。file の頭に内側の doc の行（字 //! で始まる行）を足してよく、doc と comment の行（頭の空白の後が // で始まる行）は足し替えてよい。code の行の末尾の comment・/* */ の comment・属性の行は足さない（正規化が捨てるのは頭の空白の後が // の行だけ）。2 つの file の doc と comment に、字「mod dom {」・fn more_view(・fn seat_view(・fold と開き丸括弧の並び・<details の字を書かない（歯 sesplit_decl_in_seat と sesplit_dom_file_holds_view、直した steady_details_use_fold_record と smore_dom_text がこれらの字を探す）。移した後に rustfmt で組み直してもよい（行を割る・つなぐ・引数の列の末尾のコンマの有無は歯が見ない・xtask の check は rustfmt を撃たない）。関数の本文と use の行と定数の字は変えない。
      字を変えないことの見方。歯 sesplit_texts_kept は 2 つの file の字を次の決まりで正規化する。字を改行で行に割り、頭の空白を除いた字が // で始まる行（doc と comment）を捨てる。残りの字から空白の字（Rust の char の is_whitespace が真の字）を全部除く。その後に、すぐ次の字が閉じ丸括弧・閉じ角括弧・閉じ波括弧のどれかのコンマを除く。正規化した字の Unicode の scalar の数と、その字の UTF-8 の byte の FNV-1a 64 の値（初めの値 0xcbf29ce484222325・byte ごとに排他的論理和をとってから 0x100000001b3 を 64 bit で掛ける）を比べる。新しい file の値は、base の seat.rs（b525a13 と 0bc6f45 で同じ字）の mod dom の中身（上の範囲）に同じ正規化をかけた数 7039 と 0x69f20135aae77657。割った後の seat.rs の値は、base の seat.rs の字の字「mod dom {」の行から末尾までを上の 2 行（path の属性の行と mod dom とセミコロンの行）に替えた字の数 10254 と 0x2445dac972fca1e5。どちらも席が数え、字下げを外しただけの字と、toolchain 1.98.1 の rustfmt 1.9.0 で 2 つの file を組み直した字（path の属性をたどって新しい file も組み直す・1 つの呼びの引数の列を 1 行にして末尾のコンマを落とし、1 つの鎖と 1 つの定数の行を 1 行にする）で同じ値になることを確かめた。値で固める理由。移した後の木には元の字が残らないので、比べる相手は base の字から数えた値だけになる（元の字を fixture に写すと審査の diff が同じ字を 3 度運ぶ）。歯が落ちることも確かめた。移す字から文 span.set(to); を 1 つ落とすと 7026 と 0x69a0fa72b0a1972a、鍵の字 seat:hist を seat:hist2 に替えると 7040 と 0x7ab4b2b3c2b5fa8d、wasm の target のときだけの属性の行を 2 つ重ねた seat.rs は 10282 と 0x4e46fa9fb53c5cb1 で、どれも上の値と違う（席が数えた）。base の seat.rs が行を流す前に変われば、席が 2 組の値を数え直してから流す。
      着地済みの歯（直すもの・3 つ・どれも write-set の中）。(1) tests/steady.rs の steady_details_use_fold_record は、Module の ALL の module ごとに src/project の file の字だけを読み、字 <details で始まる tag がどれも prop:open=open と on:toggle=toggle を持ち空白と open と等号の字を持たないこと、tag の数と記録の関数を呼ぶ所の数と module の FOLDS の数が同じで鍵の字の集合が FOLDS と同じこと、鍵の形を見る。割った後の seat.rs には tag も呼ぶ所も無く FOLDS は 2 つなので、このままでは落ちる。この行は、src/project_dom の下に module と同じ名の .rs の file が在ればその字を block の file の字の後に足した字で同じことを見るように直す（今 src/project_dom に在るのは seat.rs だけなので、ほかの module は今と同じ字を見る・見張りの形は変えない）。(2) tests/seataxis.rs の saxis_src_draws_legend_axis は seat.rs の字「mod dom {」より後に 6 つの字（class と等号と引用符で囲んだ saxis・同じく sleg・同じく sleg-i・sample_svg と開き丸括弧・ticks・LEGEND）が在ることと、stylesheet に 9 つの class（saxis・sleg・sleg-i・ssample・sg-run・sg-wait・mk・mk-acct・mk-now）の規則が在ることを見る。この行は、6 つの字を探す字を src/project_dom/seat.rs の全部の字に替える（6 つの字と stylesheet の見張りは変えない）。(3) tests/smore.rs の smore_dom_text は seat.rs の字「mod dom {」より後の、字 fn more_view( から次の改行と 4 つの空白と閉じ波括弧と改行の並びまでを more_view の本文とする。この行は、読む file を src/project_dom/seat.rs にし、本文の終わりを字 fn more_view( より後の最初の、改行と閉じ波括弧の並び（字下げの無い関数の閉じ）にする。本文の中で見る字（fold と開き丸括弧と引用符と seat:more・use_context::<HelpCtx>()・shows_internal( が在ること・字 || false が無いこと・class と等号と引用符で囲んだ gm1 src と同じく gm1 int xo と MORE_SRC と <code> と doctor の最初の所が本文の </details> の最初の所より前）と、src/board.rs の 2 つの字（let help = HelpCtx { と provide_context(help);）は変えない。3 つの歯の名と、3 つの file のほかの歯と定数（smore の filter の語の列を含む）は変えない。
      着地済みの歯（直さずに通る・crates の tests の下と src の cfg(test) を grep で確かめた）。seat.rs を名指して字を読む歯は、上の 3 つのほかに hsderive_consts_match_note（seat.rs の行の頭の PATHS の宣言の行が引用符の字を持たないことと、FOLDS の宣言の行が在ること）・frame_one_module_per_block（seat.rs に字 id とコロンと空白と引用符で囲んだ orch が在ることと、src/project の dir の項の名）・parts_paths_distinct_in_block_modules（引用符で囲んだ /api/seat の字が src に 1 度だけで seat.rs に在る）で、この行は host の部分を変えず src/project に項を足さないので通る。hsblock_names_follow_dir と hsblock_script_reruns_and_emits は src/project の .rs の file の名と生成の字を見る（変わらない）。src の全部を歩く歯（frame_classes_are_in_stylesheet・frame_no_heading_words_in_code・parts_paths_distinct_in_block_modules・parts_reload_events_from_contract_constants）は src/project_dom/seat.rs も読むが、移す字は今の seat.rs の中の字と同じなので、class の名・見出しの語の literal・引用符の /api/ の字・event の名・EventSource::new の数は src 全体で変わらない。seatblock_ の歯（seat の host の定数と型と関数の値・style.css・Cargo.toml の直接依存の名）、smore_ のほかの歯（seat_line と More の doctor の値・rules.yaml・style.css）、saxis_ のほかの歯（span_ticks と sample_svg の値）、seat の host の名を use する accthome_・acctproj_・acctsess_・acctpop_・hcard_ の歯は host の値を撃ち、この行は host の名と値を変えない。
      後の行へ（計画の直しの材料）。計画の後の行 c-seat-tick・c-seat-grace・c-seat-group・g-seat-thr・g-seat-hb は、host の値を seat.rs に、DOM を src/project_dom/seat.rs に足す。この行の歯のうち sesplit_texts_kept は 2 つの file の字を値で固めるので、この行の後で最初にどちらかの file を書く行（計画の順では c-seat-tick）は tests/sesplit.rs を write-set に入れてこの歯を消す。ほかの sesplit_ の歯（宣言の 3 行・新しい file の宣言の並びを部分の列で見る・名の見張り）は、関数を足しても通る。
      並べて走る行との取り合い。同じ波の行 g-mode-store は src/board.rs と src/lib.rs を書くが、smore_dom_text が読む src/board.rs の 2 つの字（let help = HelpCtx { と provide_context(help);）は変えない（その行の節が言う）。この行は lib.rs を書かないので、2 つの行が lib.rs を取り合うことは無い。同じ波の行 g-tip-expert は widgets の help.rs で seat の host の Span と span_of を読む（この行は host の名と値を変えない）。同じ波のほかの行と第 6 波の行（f-mark と c-summary-design は着地済み・f-stop・f-mark-serve・c-summary-wire）の write-set に seat.rs・src/project_dom・tests の steady.rs・seataxis.rs・smore.rs は無い。
      測り方。新しい歯は tests/sesplit.rs に置き、名を sesplit_ で始める（名の例 sesplit_decl_in_seat・sesplit_dom_file_holds_view・sesplit_texts_kept・sesplit_own_names_clean）。どれも CARGO_MANIFEST_DIR から src/project/seat.rs と src/project_dom/seat.rs と自分の file を読むだけで、fixture は置かない。sesplit_decl_in_seat は、seat.rs の字に「mod dom {」が無いこと、wasm の target のときだけの属性の行・path の属性の行・mod dom とセミコロンの行の 3 行を改行でつないだ並びが 1 度だけ在ること、wasm の target のときだけの属性の行・pub fn view の宣言の行・本文 dom::view() の行・閉じ波括弧の行の並びが在ること、字 fn more_view( と fn seat_view( が無いこと、src/project の下に dom.rs と dir seat が無いことを見る。sesplit_dom_file_holds_view は、新しい file の字に改行の直後の const HOURGLASS の宣言と、改行の直後の 16 の関数の宣言が上の順に在ること（前の宣言の後の所から次を探す・間の字は見ない）と、字「mod dom {」が無いことを見る。DOM は host で撃てないので、組めることは xtask の surface-build と check（wasm の target の clippy を含む）で見る。
      filter の語（着地済みの行の verify の filter の語 49・第 3 波の行の接頭辞 17・第 4 波の行の接頭辞 4・第 5 波の行の接頭辞 11・第 6 波の行の接頭辞 4・第 7 波のほかの行の接頭辞 7・この行の接頭辞 sesplit_ は並べない・92 語）。accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・hcard_・qgate_・nsum_・ntime_・ptitle_・ncard_・hsym_・smore_・lcard_・aaround_・hruling_・sxaxis_・plimit_・bport_・fmark_・fstop_・fserve_・nsumw_・cadopt_・tipx_・hcsess_・hcproj_・mstore_・athr_・qblock_。新しい歯の名から先頭の sesplit_ を除いた字は、このどれも部分の字として含まない（例 sesplit_steady_x・sesplit_seatblock_x・sesplit_frame_x は不可）。契約の file の verify の行の filter の語（main の 0bc6f45 の contracts の 106 の字・第 6 波の fmark_・fstop_・fserve_・nsum_・nsumw_ と、frame_one_module_per_block・server_acct_ など長い語を含む）は、どれもこの列の語のどれかを部分の字として含む（確かめた）。
      依存は足さない。Cargo.toml・lib.rs・build.rs・vocab.json・style.css・src/board.rs は触らない。
  - n: 6
    type: prose
    title: 行 g-mode-store — mode をその browser の保存に写す
    body: |
      なぜ。持ち主の裁定 t3-hub.52.16（裁定 id = t3-hub.52.16:20260927T2233Z-1）は、mode（初心者と経験者）と、account board から開いた窓の一覧と、最初の案内の済み印の 3 つを、その browser に残すと決めた（便利の写しで正本ではない）。要件 FR1（srs v0.8）の字は「mode（初心者と経験者）と、account board から開いた窓の一覧と、最初の案内を見終えた印の 3 つは、その browser の保存に残す。これは便利のための写しで正本ではなく、台帳と設計文書と器の値は browser に置かず、保存が消えても面は URL と server の読みから同じ画面を組む。」。この行は 3 つのうち mode を受け持ち、保存の module を置く（窓の一覧は後の行 h-win-store、済み印は後の行 g-coach がこの module を使う）。本番は今 mode を URL の query にしか残さず、mode の無い URL で頁を開き直すと初心者に戻る。
      見本（判断の記録 ADR-7 の承認で確定した見本 mock v3・repo の docs/design/mock3・確かめた）。ui.js の保存の関数 store は、try の中で localStorage の getItem（値を渡さないとき）か setItem を撃ち、例外なら null を返す。頁を開くときの initMode の字は次の 2 行（p は URL の query の mode の値）。
        if (p === 'beginner' || p === 'expert') { MODE = p; store('tz-mode', p); }
        else MODE = store('tz-mode') === 'expert' ? 'expert' : 'beginner';
      押しの setMode は MODE = m; store('tz-mode', m); の後に URL の query の mode を m にして履歴を置き換える（replaceState）。mode の切り替えの markup（ui.js の modeSeg）は、class の値 seg・role の値 group・aria-label に語の mode・data-term の値 mode の div の中に、type の値 button・data-mode の値 beginner と expert・aria-pressed の 2 つの button を置く。account board の見本（docs/design/mock3/account/index.html）も同じ ui.js を読むので、鍵 tz-mode は 2 つの board で同じ。見本は mode の保存に storage の event を使わない（別の tab の変化を受けるのは account board の窓の一覧の鍵 tz-wins だけ）。語の辞書 vocab.json（見本の写し）の鍵 mode の internal は既に「?mode=beginner|expert」と改行と「localStorage tz-mode」を持つ（経験者の注釈が今は本番と合わない・この行で合う）。
      在りか（確かめた・main の commit b525a13 と 0bc6f45・この行が書く file と frame.rs・main.rs・vocab.json と見本の ui.js は間で変わっていない）。src/frame.rs（host・web_sys を持たない）の pub enum Mode（Beginner と Expert・derive は Debug・Clone・Copy・PartialEq・Eq）は、pub const ALL（2 つ）・pub fn from_query（query の &str を受け、mode の値が字 expert なら Expert・ほかは Beginner）・pub fn key（beginner か expert の &'static str）・pub fn body_class を持つ。pub fn param（query の &str と鍵の &str を受け、頭の ? を除き & で割った最初の同じ鍵の値の Option の &str・値の % は解かない）と pub fn with_param（query と鍵と値を受け、最初の同じ鍵の値を置き換えるか末尾に足し、頭に ? を付けた String を返す・ほかの値と順はそのまま）が在る。src/board.rs（project board・lib.rs の wasm の target のときだけの pub mod board）の pub fn mount は本文が leptos::mount::mount_to_body(App) の 1 行で、私的な fn search（location の search・読めなければ空）と fn keep_mode_in_url（引数 Mode・with_param で query の mode を置き換えた字で履歴を replace_state_with_url で置き換える）を持つ。App は let query = search(); の後に Mode の from_query で mode の RwSignal を作り、let help = HelpCtx { で値を作って provide_context(help); で context に置き、body の class を mode の body_class にする。header の mode の部品（top の最後の腕・frame の HEADER の part の mode・class の値 seg）は Mode の ALL ごとに button を置き、押しの closure は let pick = move |_| { mode.set(m); keep_mode_in_url(m); }; の形。src/account/board.rs（account の mod.rs の wasm の target のときだけの pub mod board）の pub fn mount は、自分の窓の名を置く set_name(windows::ACCOUNT_WIN) と題を置く set_title(&page_title()) の後に mount_to_body(App) を撃つ。私的な fn search と fn keep_mode_in_url は project board と同じ形で、App は query の RwSignal を search() で作り、その字を Mode の from_query に渡して mode を作り、戻ると進む（popstate）で今の URL の字から mode と query を戻す（着地済みの行 h-popstate・URL が状態の正）。tab の押しは今の query の字から tab_url で次の URL を作って履歴に積む（mode を含むほかの値はそのまま）。header の mode の部品と押しの closure は project board と同じ形。src/main.rs（wasm の target）は location の search を読み、account の selects（query の board の値が account）が真なら account の board の mount を、ほかは board の mount を撃つ。src/lib.rs は host の pub mod を account・frame・kit・mapview・pages・project・view・vocab・widgets の順に置き、その後に wasm の target のときだけの pub mod board と pub mod net を置く。src の下に store という名の file と item は無い（grep で確かめた）。
      Cargo.toml と web-sys（確かめた）。面の crate の [dependencies] は tsuzuri-contract だけ、wasm の target の依存は leptos・wasm-bindgen-futures・web-sys（版 0.3・features の列に Document から Window までの 22 の名・Storage と StorageEvent は無い）、dev の依存は tsuzuri-boundary。Cargo.lock の web-sys は 0.3.106 で、その Cargo.toml の feature は Storage が空の列、StorageEvent が Event だけの列で、どちらも ほかの package を足さない（web-sys の依存は js-sys と wasm-bindgen の 2 つだけ）。Cargo.lock は feature を持たないので変わらない。web-sys の Window の local_storage（Result の中の Option の Storage を返す）は feature Storage と Window のときだけ在り、Storage の get_item（鍵の &str を受け Result の中の Option の String）と set_item（鍵と値の &str を受け Result）も feature Storage のときだけ在る。依存の中では leptos の下の tachys 0.2.19 が web-sys の StorageEvent を既に有効にしていて、Storage を有効にする package は無い。
      形（host の部分・src/store.rs・新しい file）。module の doc に、見本の store と持ち主の裁定と要件 FR1 と、便利の写しで正本ではないことを書く。pub const MODE_KEY（&str・字 tz-mode・見本の鍵）。pub struct ModeStart（pub な欄 mode は Mode・keep は Option の &'static str で保存に書く字・url は Option の String で履歴を置き換える query の字・derive は Debug・Clone・PartialEq・Eq）。pub fn mode_start（引数は URL の query の &str と保存の値の Option の &str・返りは ModeStart）は見本の initMode と同じ決め方で、frame の param で読んだ query の mode の値が字 beginner か expert（大文字と小文字を分ける）ならその mode にし keep はその字（Mode の key）・url は None。そうでなければ keep は None で、保存の値が字 expert のときだけ Expert（見本と同じく、ほかの値と無しは Beginner）にし、Expert のときだけ url を frame の with_param で query の mode を expert にした字にする（Beginner のときは None・mode の無い URL を Mode の from_query に渡すと Beginner なので URL は変えなくてよい）。この決めにより、url が在れば url の字を、無ければ query の字を Mode の from_query に渡した値はいつも mode と同じになり、頁の App が URL から読む mode と保存から決めた mode が食い違わない。見本との違いはこの 1 つだけで、見本の initMode は URL を書かない。本番は、App が URL の query を Mode の from_query に渡して mode を作り、account board の popstate が戻ると進むのたびに URL から mode を読み直し（着地済みの行 h-popstate・URL が状態の正）、block の DOM も HelpCtx の context が無いときは URL の query から mode を読む（kit・ledger・pipeline・next・ask・askpage・nodearound・グラフの面）。URL を保存の値に揃えずに App の mode だけを保存から決めると、戻ると進むで mode が初心者に戻るので、この行は頁を開くときに URL を揃え、App と popstate の行を変えない。保存が beginner か無しのときと、URL の mode が beginner か expert のときは URL を変えない（要件 FR1 の、保存が消えても URL から同じ画面を組む、とも合う）。
      形（wasm の target のときだけ・src/store.rs）。4 つの関数を、どれも wasm の target のときだけの属性の行のすぐ次の行から宣言する。pub fn get（引数 key の &str・返りは Option の String）は window の local_storage で保存を取り、在ればその get_item の値を返し、window が無い・保存が使えない（Err か None）・読めない（Err）のどれでも None。pub fn set（引数 key と value の &str・返りなし）は同じく保存を取って set_item を撃ち、使えない・書けないときは何もしない。pub fn settle_mode（引数なし・返りなし）は location の search を読み、get(MODE_KEY) の値と一緒に mode_start に渡し、keep が在れば set(MODE_KEY, その字) を撃ち、url が在れば履歴の replace_state_with_url でその字に置き換える（頁は読み直さない）。pub fn keep_mode（引数 Mode・返りなし）は set(MODE_KEY, mode の key) を撃つ。どの関数も unwrap と expect と panic! を使わず、保存と URL が撃てないときは何もしない（見本の store が例外を null にするのと同じ・FR1 の便利の写し）。get と set は後の行（h-win-store の tz-wins・g-coach の tz-coach）も使う形の汎用の口にする。window は leptos::prelude の window か web_sys の window のどちらを使ってもよい。
      形（lib.rs と 2 つの board と Cargo.toml）。src/lib.rs に wasm の target に限らない行 pub mod store; を足す（host の歯が mode_start を撃つため・置く所の例は pub mod project; の次・doc の行を足してよい）。board と net の 2 つの宣言は変えない。src/board.rs と src/account/board.rs では、pub fn mount の本文の mount_to_body の前に store::settle_mode() を撃つ（crate::store を use するか、crate::store:: と書いてよい）。これで App が search() で読む URL は決めた後の字になり、App の Mode の from_query の行と account board の popstate の行は変えずに済む（mode の無い URL で開いても、保存が expert なら URL に mode=expert が足されてから App が読む）。mode の押しでは、押しの closure の中か keep_mode_in_url の本文の中で store::keep_mode を撃ち、選んだ mode を保存に写す（URL を置き換える手は今のまま）。account/board.rs の mount の set_name と set_title の行は変えない。Cargo.toml の web-sys の features の列に Storage と StorageEvent を足す（1 行に 1 つの今の書き方・ほかの名と版と依存の節は変えない）。StorageEvent はこの行では使わず、後の行 h-win-store（見本の account/index.html が window の storage の event で別の tab の tz-wins の変化を受ける）のために、Cargo.toml を書く行を 1 つにまとめて足す（計画 surface-plan 4 節の行の字）。
      保存の origin。localStorage は origin（scheme と host と port）ごとなので、port の違う account board と各 project board は、それぞれ自分の写しを持つ（見本は 1 つの origin）。どの board でも、URL の mode が在ればそれが先。account board の開く button の URL は今の mode を持つ（src/account/windows.rs の pub fn open_url が port の後に ?mode= と Mode の key を足す・着地済みの行 h-board-url・この行は書かない）ので、account board から開いた project board は URL の mode を使い、自分の保存に写す。
      書かない字（着地済みの歯が見る）。src/account/board.rs の字（comment を含む）に localStorage・sessionStorage・cookie・/api/ を書かない（acctwin_no_storage_and_wasm_wiring と acctframe_path_from_contract_and_no_storage が src/account の下の .rs の file の全部の字を読む・保存の口の字は src/store.rs にだけ置く）。account/board.rs の pub fn mount の本文（comment を含む）に字 fn と空白の並びを書かない（acctlook_mount_sets_page_title は字 pub fn mount の後から次の字 fn と空白までを本文とし、その中に set_title( と page_title() と mount_to_body を探す）。src/store.rs に class の字と見出しの語の日本語の literal と引用符で囲んだ /api/ の字と event の名と EventSource::new を書かない。
      着地済みの歯（直すもの）。無い（この行は tests の下の着地済みの file を書かない）。着地済みの歯 acctwin_no_storage_and_wasm_wiring は、保存の字を src/account の外の 1 つの module に置く形で、期待を変えずに通す（持ち主の裁定の効果の 2 つの道のうちの 1 つ）。
      着地済みの歯（直さずに通る・crates の tests の下と src の cfg(test) を grep で確かめた）。src/account の下を読む歯: acctwin_no_storage_and_wasm_wiring（src/account の .rs の file が 7 以上で、どれも字 localStorage・sessionStorage・cookie を持たず、account/board.rs の mount の本文に set_name(windows::ACCOUNT_WIN) が在り、windows.rs に 10 の字が在る）・acctframe_path_from_contract_and_no_storage（src/account の .rs の file の全部に /api/ と 3 つの字が無い・mod.rs の 2 つの字）・accthb_no_dialog_and_no_storage（heartbeat.rs だけ）・acctled_fold_signal_keys_and_classes（account の ledger.rs だけ）。account/board.rs の字を読む歯: apop_dom_wiring_in_source（10 の字と、Mode::from_query( が 2 度以上）・acctlook_mount_sets_page_title（上の本文）・accthome_ の歯の 1 つ（home::view(block)）・hcard_ の歯の 1 つ（provide_context(HoverCtx::default()) と <CardLayer/>）。この行は account/board.rs にこれらの字を残し、Mode::from_query( の 2 か所も変えない。src/board.rs の字を読む歯: brand_top_reads_name_and_sets_title（5 つの字と題の span の中の brand(・字 {BRAND} が無い）・acctwire_ の歯の 1 つ（6 つの字・lib.rs の wasm の target のときだけの pub mod board の 2 行・frame.rs に web_sys が無い）・hsblock_dispatch_by_list（block_view と App の本文の字・fn page_view(page: PageId) ->・lib.rs の同じ 2 行）・hspage_no_variant_words（PageId の Ask・Map・Gaps・Node と fn nav_icon が無い）・ncard_ と lcard_ の歯の 1 つずつ（provide_context(HoverCtx::default()) と <CardLayer/>）・ptitle_wiring_text（PageSubject・doc_title(・heading・set_title( が在り board_title( が無い）・smore_dom_text（let help = HelpCtx { と provide_context(help);）。この行はどの字も消さず、PageId の変種の名と board_title( を書かない。Cargo.toml を読む歯: seatblock_landed_shape_and_no_new_deps と next・ledgerblock・pipe の歯（依存の節の名の 5 つ）・gapspage_no_new_dependencies と batchpanel_no_new_dependencies と askcard の歯（依存の節の名）・acctproj・acctsess・accthome・acctwin_manifest_features_already_there（[dependencies] の名が tsuzuri-contract だけ・Window と Location の feature）・nodepage・mapgraph・mapview の歯（[dependencies] の名）・acctwire_no_new_dependencies（字 url = が無く Location と Window の feature が在る）と、xtask の skeleton_ の歯（crate ごとの直接依存の名と R-25 の 8 本）。どれも等号を含む行の鍵か節の見出しから名を拾うので、features の列に足す引用符の名の行（等号を持たない）は名を増やさない。src の全部を歩く歯（frame_classes_are_in_stylesheet・frame_no_heading_words_in_code・parts_paths_distinct_in_block_modules・parts_reload_events_from_contract_constants）は src/store.rs も読むが、上の書かない字のとおり当たらない。frame_mode_lives_in_url（Mode の from_query と頁の link の mode）は frame.rs を読み、この行は frame.rs を書かない。project の下の file の保存の口の字を見る歯（askcard・batchpanel・gapspage の 3 つ・大文字と小文字を分けない）は ask.rs・askpage.rs・batch.rs・policy.rs・gaps.rs だけを読む（この行は書かない）。
      並べて走る行との取り合い。同じ波の行 g-seat-split は seat.rs と新しい src/project_dom/seat.rs と tests の steady.rs・seataxis.rs・smore.rs を書き、lib.rs を書かないので、2 つの行が lib.rs を取り合うことは無い。g-seat-split が直す smore_dom_text は src/board.rs の 2 つの字（let help = HelpCtx { と provide_context(help);）を読み、この行はその 2 つを変えない。同じ波の行 g-tip-expert は 2 つの board の HelpCtx の組み（欄 open に RwSignal::new(None)・欄 mode に mode の RwSignal）を前提にし、同じ波の行 g-card-adopt-a は src/board.rs の provide_context(HoverCtx::default()) と <CardLayer/> を前提にする。この行はどちらも変えない（足すのは mount の 1 つの呼びと押しの 1 つの呼びだけ）。同じ波のほかの行と第 6 波の行（f-mark と c-summary-design は着地済み・f-stop・f-mark-serve・c-summary-wire）の write-set に面の lib.rs・board.rs・account/board.rs・Cargo.toml・src/store.rs は無い（第 6 波の f-stop が書く lib.rs は境界の crate の lib.rs）。同じ波の h-cards-sess と h-cards-proj の歯は src/account/board.rs の字 provide_context(HoverCtx::default()) と <CardLayer/> を読み、着地済みの acctsess_ と acctproj_ の歯は面の Cargo.toml の [dependencies] の節の名だけを読む（この行はどちらも変えない）。計画の後の行 g-seatpill・g-back-note・g-coach は src/board.rs を、h-dormant は src/account/board.rs を、h-win-store と g-coach は src/store.rs の get と set を使う（計画 surface-plan 5 節の順）。
      測り方。新しい歯は tests/mstore.rs に置き、名を mstore_ で始める（名の例 mstore_start_rules・mstore_url_wins・mstore_key_is_mock_key・mstore_module_text・mstore_board_calls・mstore_manifest_features・mstore_own_names_clean）。fixture は置かない。mstore_start_rules は tsuzuri_surface::store の mode_start を撃ち、次の表の 12 組の値を比べる（字は「」で囲む・「」は空の字・mode・keep・url の順・None は無し）。「?mode=expert」と保存無し → Expert・「expert」・無し。「?mode=beginner」と「expert」 → Beginner・「beginner」・無し。「?board=account&mode=expert」と「beginner」 → Expert・「expert」・無し。「」と「expert」 → Expert・無し・「?mode=expert」。「?board=account」と「expert」 → Expert・無し・「?board=account&mode=expert」。「?page=node&id=g-seat」と「expert」 → Expert・無し・「?page=node&id=g-seat&mode=expert」。「?mode=bogus」と「expert」 → Expert・無し・「?mode=expert」。「?page=ask&mode=Expert」と「expert」 → Expert・無し・「?page=ask&mode=expert」。「?mode=」と「expert」 → Expert・無し・「?mode=expert」。「?page=map」と保存無し → Beginner・無し・無し。「」と「beginner」 → Beginner・無し・無し。「?mode=bogus」と「bogus」 → Beginner・無し・無し。mstore_url_wins の 8 つの query は「」・「?mode=expert」・「?mode=beginner」・「?mode=bogus」・「?mode=」・「?board=account」・「?page=ask&mode=Expert」・「?board=account&tab=session&mode=expert」。mstore_key_is_mock_key は CARGO_MANIFEST_DIR から ../../docs/design/mock3/ui.js を読み、語の辞書は tsuzuri_surface::vocab の vocab の term に鍵 mode を渡した値の internal を見る。mstore_start_rules は表の値に加えて、ModeStart の値を clone し、Eq を求める型の引数の関数に渡す（derive の Clone と Eq を組み立てで見る）。mstore_module_text は src/store.rs と src/lib.rs を、mstore_board_calls は src/board.rs と src/account/board.rs を、mstore_manifest_features は Cargo.toml を字で読む（features の列は字 web-sys = { の行から次の字 ] までの引用符の名・依存の節の名は、見出しが dependencies で終わる節の中の、井桁で始まらず等号を含む行の等号の前の字と、見出しの最後の点の後の名で、着地済みの askcard と gapspage の歯と同じ読み）。保存と URL を撃つ所は wasm の target のときだけで host では撃てないので、決め方は host の純粋な関数 mode_start で、呼びの配線は source の字で見て、組めることは xtask の surface-build と check（wasm の target の clippy を含む）で見る。
      filter の語（着地済みの行の verify の filter の語 49・第 3 波の行の接頭辞 17・第 4 波の行の接頭辞 4・第 5 波の行の接頭辞 11・第 6 波の行の接頭辞 4・第 7 波のほかの行の接頭辞 7・この行の接頭辞 mstore_ は並べない・92 語）。accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・hcard_・qgate_・nsum_・ntime_・ptitle_・ncard_・hsym_・smore_・lcard_・aaround_・hruling_・sxaxis_・plimit_・bport_・fmark_・fstop_・fserve_・nsumw_・cadopt_・tipx_・hcsess_・hcproj_・sesplit_・athr_・qblock_。新しい歯の名から先頭の mstore_ を除いた字は、このどれも部分の字として含まない（例 mstore_frame_x・mstore_acctwin_x・mstore_wasm_parts_x・mstore_board_min_x は不可）。契約の file の verify の行の filter の語（main の 0bc6f45 の contracts の 106 の字・第 6 波の fmark_・fstop_・fserve_・nsum_・nsumw_ と、acctwire_back_part_before_header・server_acct_ など長い語を含む）は、どれもこの列の語のどれかを部分の字として含む（確かめた）。
      依存は足さない。足すのは web-sys の 2 つの feature だけで、package も直接依存の名も増えない。vocab.json・style.css・frame.rs・main.rs・src/account の mod.rs と windows.rs は触らない。
  - n: 7
    type: prose
    title: 行 h-cards-proj — 各 project の表の 5 つの欄と群の見出しの card
    body: |
      なぜ。見本の account board の projects の tab の各 project の表（docs/design/mock3/account/index.html の関数 projTable）は、行の 5 つの欄に hover の card を付ける。要対応の欄（class c-need の div・data-card の鍵 nx）、台帳の欄（class c-led の div・鍵 led）、run の数の欄（class c-run の div・鍵 pcnt）、orchestrator の欄（class c-orch の div・席の在る行だけ鍵 seat）、口座の欄（class c-acc の div・席の在る行だけ鍵 gproj）。並べ方 group の群の見出しの行（class pgh の div）の群の chip（class pchip grp の span・鍵 group）にも付ける。行を開く詳しくの段（class c-more の div）は、run・orch・acc・led の 4 つの欄の字を同じ関数の字のまま m-run・m-orch・m-acc・m-led の span に置き直すので、同じ card を持つ（stylesheet は幅 760 以下で 4 つの欄を隠し、詳しくの段の 4 つを出す）。card の中身は window.__tz_card の nx・led（関数 ledCard）・pcnt・seat（ui.js の seatCard）・gproj・group の枝で、どれも card4 の 4 行（題・種類・値・出所）と「詳しく」の形。本番の表（便 h-proj と h-proj-more・src/account/projects.rs）は card を 1 枚も持たない（projects.rs に use:attach の字は無い・確かめた）。要件 FR14 は hover の card を 4 行（1 行 36 字）と「詳しく」と決め、card を出すのを頁を持つ節点の札・圧縮された cell・記号だけの要素の 3 種に限る。5 つの欄はどれも project の 1 つの面（次の一手の 7 種・台帳の積みと速度・run の 4 列・席の状態と合図・席の口座と群の今の口座の一致）を 1 段か 2 段に縮めた cell で、群の chip は群の枠を名だけに縮めた cell。どれも見本（判断の記録 ADR-7 で確定）が card を付ける要素。後の行 h-cards-nx（HOME の次の一手の行と群の枠の project の chip）と h-cards-led（台帳の表の project の欄）は、この行が足す組み手（nx_card・gproj_card・led_card）を使う（計画 surface-plan の 4 節）。
      在りか（着地済み・main の commit bf21e14 で確かめた・b525a13 からの code の差は中核と契約の型と別の tests の file だけで、この行の読む file は変わっていない・着地した h-board-url〔83d453c〕は windows.rs と契約の account.rs と fixture の board を書き、projects.rs は書かず、projects.rs が呼ぶ windows の open_url の名と引数と返りの型を変えていない）。src/account/projects.rs は account の mod.rs の pub mod projects で host でも組む（着地済みの acctproj と pmore の歯が tsuzuri_surface の account の projects の path で使う）。host の部分は、BLOCK（id ptab）・PSORT_KEY・PTAB・PROW・HROW・PGH・COLUMNS（9 つ）・C_PN・C_NEED・C_WAIT・C_UN2・C_LED・C_RUN・C_ORCH・C_ACC・C_OPEN（字 c-pn ほか）・RC4・ZERO・pub const RUNS（(&str, &str) の 4 つの組・名は wait・run・stop・land の順で 2 つ目は class）・TKM・HBM・HBM_OFF・NOT_YET_CLASS・pub const NONE_MARK（字 ―）・NO_ROWS・PSort と psort_of と with_psort と without_param。pub struct Need（欄 lead は NextMove の Option・key は &'static str・sev・line は String の Option）と pub fn need（&ProjectRow を受け Need）は、next が Known なら lead に電文の lead、key に next の module の key に lead を渡した語の鍵、line に next の module の big に lead とその種の check を渡した what の Some を置き、Unknown なら lead と line は None で key は st_unknown。sev・need_rank・judge_of・judge_rank・Led と led・Run と pub fn runs・Orch と orch・hbm_class。pub fn current（&AccountDoc と群の名の &str を受け &str の Option）は電文の groups の中で group が同じ GroupCard の row の account（groups が Unknown か群が無ければ None）。pub struct Acc（欄 account は String の Option・mark は Sign の Option・derive は Debug・Clone・PartialEq・Eq）と pub fn acc（&AccountDoc と &ProjectRow を受け Acc）は、席の card の account と、行の群を current に渡した今の口座が両方分かれば同じなら OK・違えば NG・どちらかが無ければ None。Open と open。pub struct ProjLine（欄 index・class・name・group・need・wait・unref・led・runs・orch・acc・open・more・derive は Debug・Clone・PartialEq）。MORE_LED・NO_TOGGLE・LedMore・projects の More と more・fit_cut。pub struct GroupHead（欄 group と current はどちらも String の Option・derive は Debug・Clone・PartialEq・Eq）。projects の pub struct Group（欄 head は GroupHead の Option・rows は ProjLine の Vec・derive は Debug・Clone・PartialEq・Group の名の宣言は session.rs と project の ledger.rs にも在るが別の型）。pub struct Table（欄 sort と groups）と order・content・group_order。pub fn table（&AccountDoc と PSort と Mode を受け Table）は並べ方 group で群ごとに見出し（GroupHead の group に群の名の Some と current）と、最後に群の無い project の見出し（group と current が None）を組み、ほかの並べ方は見出しの無い 1 つの束にし、行の無い束は出さない。pub fn row（&AccountDoc と位置の usize と Mode を受け ProjLine）は電文の projects の 1 行から ProjLine を struct の字で組む（ProjLine を struct の字で組む所は src と tests でここだけ・Group を組む所は table だけ・GroupHead を struct の字で組むのは table と着地済みの acctproj_group_order_and_heads・Acc を struct の字で組むのは acc と着地済みの acctproj_accounts_mark・grep で確かめた）。host の部分の use は契約の型の account の AccountDoc・ProjectRow・RunCounts と board の LedgerJudge・NextMove・Reading、super の windows の NOT_YET_KEY・OPEN_NEW_KEY・open_url、crate::frame（self と Block と Mode）、crate::project::Body、project の ledger の JUDGES・Judge・Net・SPARK_H・SPARK_W・age・judge・net・spark・spark_svg、project の next の big と key（名 next_key で）、project の seat の NG・OK・Sign・state_value・top、crate::project の UNKNOWN と state_key、view の Fetched で、vocab の label と hover の Card は host の部分で use していない。wasm の target のときだけの mod dom は、search・replace・view・sort_bar・table_view・group_view（見出しを head_view で、行を row_view で組む）・head_view（引数は GroupHead だけ・PGH の div の中に、群が在れば class pchip grp の span の中の data-t の span に群の名、無ければ class pchip grp の span に NONE_MARK を置き、今の口座の段を続ける）・row_view（行の div の中に C_PN・C_NEED・C_WAIT・C_UN2・C_LED・C_RUN・C_ORCH・C_ACC・C_OPEN の div をこの順に置き、今の字は <div class=C_NEED> と <div class=C_LED>{led_view(row.led)}</div> と <div class=C_RUN>{runs_view(&row.runs)}</div> と <div class=C_ORCH>{orch_view(row.orch)}</div> と <div class=C_ACC>{acc_view(&row.acc)}</div> の形・詳しくの段は view の前に more_view(&row) で組む）・more_view（引数は &ProjLine・class c-more の div の中に台帳の項と session の数と口座の履歴と、class が mi m-run・mi m-orch・mi m-acc・mi m-led の 4 つの span に runs_view・orch_view・acc_view・led_view の字）・runs_view・acc_view・led_view・orch_view・net_view・fit_line を持ち、どの fn も行頭の空白 4 つで始まる。mod dom の use に std の BTreeMap、leptos の ev と html の Span と prelude の全部、契約の board の Reading、web_sys の wasm_bindgen の JsCast、super の定数と型と関数、account の PATH と windows、frame の Mode、project の ledger の Net、crate::project の Body・UNKNOWN・body_view・section・state_icon・unmeasured、vocab の label、widgets の help の HelpCtx・hs・shows_internal・term が在り、hover の attach は無い。この行が足す名（NX_SRC・NX_MISS・LED_SRC・RUNS_UNKNOWN・WAIT_NOTE・GPROJ_SRC・RowCards・nx_card・led_card・pcnt_card・orch_card・gproj_card・grp_card・row_cards・attach_some）は base の面と契約の型と中核と境界の src と tests と xtask のどこにも無い（grep で確かめた・似た名の seat_card は中核の歯 acctpcore と境界の歯 server_seat に、group_card は home.rs の mod dom に、Cards は mapview の compact.rs に在るので、それらの名は使わない）。足す欄の名 cards（ProjLine）と card（Group）は projects.rs に無い（home.rs の AcctRow にも欄 card が在るが別の型）。
      hover の card（src/widgets/hover.rs・widgets の mod.rs の pub mod hover で host でも組む・この行は書かない）。pub struct Card（欄 title・kind・value・src は String・more は String の Vec・derive は Debug・Clone・PartialEq・Eq・Default・host でも組む・Card の名の宣言は project の ask.rs にも在るが別の型で、この行が使うのは crate::widgets::hover::Card）と Card の rows（4 行の class と字・36 字を超える行は 35 字と … に切る・more は切らない）。wasm の target のときだけの pub fn attach（引数は web_sys の Element と Card・返りは無し）は、context に HoverCtx が在れば要素に pointerenter と pointerleave の受け手を付け、指を置くと頁に 1 つの card の層に card を出し、出ると 150 ミリ秒の猶予で残すか消す（規則の行 R-20）。attach と HoverCtx と component の CardLayer は hover.rs の wasm の target のときだけの mod dom に在り、hover.rs が wasm の target のときだけ pub use で crate::widgets::hover の名として出す。block は view の要素に use:attach と等号と Card の値を書いて付ける（着地済みの home.rs の口座の名の欄と移動の行、project の pipeline.rs の札が前例・leptos の directive は要素と値の 2 つの引数を受ける関数なら値の型を問わず、値は Clone で 'static）。account board の頁（src/account/board.rs の App・wasm の target のときだけ）は既に provide_context(HoverCtx::default()) を呼び view の末尾に <CardLayer/> を置き、tab の block の view はその App の中で組まれる。だからこの行は board.rs と widgets の下を書かずに card を出せる。
      使う組み手（どれも host でも組む pub・この行は書かない・確かめた）。project の seat の module（crate::project::seat）の pub fn state_value（SeatState を受け &'static str・Run は run・Wait は wait・Limit は limit・Silent は silent・Unknown は unknown）・pub fn hm（EpochSecs を受け、UTC の時と分を 2 桁ずつコロンでつないで Z を足した字）・pub fn hmd（時刻と今の EpochSecs を受け、2 つを 86400 で割った商が同じなら hm の字、違えば UTC の月と日を 2 桁ずつハイフンでつないだ字と空白を前に足した hm の字）・pub struct Sign（欄 glyph と class・derive は Debug・Clone・Copy・PartialEq・Eq）・pub const OK（glyph は ✓）・pub const NG（glyph は !）。crate::project の pub fn state_key（状態の値の &str を受け語の鍵・run は st_run・wait は st_wait・limit は st_limit・silent は st_silent・ほかは st_unknown）。project の ledger の module の pub fn net（i64 を受け Net・Net の欄 arrow と text・負は ↓ と字 −〔U+2212〕と絶対値・正は ↑ と字 + と値・0 は → と字 0）・pub fn fixed1（f64 を受け、10 倍して丸めて 10 で割った値を小数 1 桁にした字・0.9 は 0.9）・pub fn age（f64 の Option を受け、None は ―・1 未満は 24 倍して丸めた数と h・10 未満は fixed1 と d・ほかは丸めた整数と d・4.0 は 4.0d・11.5 は 12d）。project の next の module の pub fn key（NextMove を受け語の鍵・表 KEYS で LimitOrMove から Nothing の順に nx_a から nx_g）と pub fn big（NextMove と NextCheck の Option を受け Big・欄 what は String）で、what は Nothing なら字「orchestrator が動いている / 待っている」、StalledRun なら数と「 件」、ほかは check の target が在れば target と「 · 」と数と「 件」・無ければ数と「 件」（check が無ければ数は 0）。account の home の module の pub fn group_more（&GroupCard と電文の moves の &Reading の MoveRow の Vec を受け GroupMore）の欄 records（String）は、moves が Known なら group が群の名と同じ行の数 n で字「記録 n 件」、Unknown なら字「記録 ―」（着地済みの歯 hcard_group_more_on_fixture と hcard_group_more_rules が値を見る）。crate::vocab の pub fn label（鍵の &str を受け String）と pub fn vocab（Vocab の term は鍵を受け Term の Option・Term の欄 label）。
      電文（crates/tsuzuri-contract・この行は書かない）。型も欄も全部 pub で、EpochSecs は u64 の別名、Reading（board.rs の pub enum）は Known に値を持つか Unknown。ProjectRow の欄は name・group（String の Option）・state_dir_known・seat（Reading の SeatCard）・move_left_s（u64 の Option）・runs（Reading の RunCounts・欄 wait・run・stop・land は u32）・ledger（Reading の LedgerStats）・next（Reading の NextStep）・board（u16 の Option）。SeatCard（契約の seat.rs）の欄は at・target・state（SeatState）・since（EpochSecs の Option）・tick_healthy と heartbeat（Reading の bool）・account と model（String の Option）・group・usage（Reading の QuotaUsed の Vec・欄 window・used_pct・resets_at・counted で、窓ごとの割合と戻る時刻を持つが、どの窓が限度かは持たない）・spans・moves。LedgerStats（契約の stats.rs）の欄は at・judge・open（OpenCounts・欄 task・memo・question・epic は u32）・blocked・ready・stale（u32）・net_drop_24h と net_drop_7d（i64）・closed_7d・closed_per_day（f64）・lead（LeadDays の Option・欄 p50 と p90 は f64）・days・epics・memo・unreflected・unreflected_unknown。NextStep の欄は checks（NextCheck の Vec・欄 kind は NextMove・result は CheckResult・count は u32・target は id の Option で字にできる）と lead（NextMove）。CheckResult は Hit・Miss・NotJudged。NextMove の ALL は LimitOrMove・Unresponsive・StalledRun・BatchApproval・Question・AwaitingEffect・Nothing の順。AccountDoc の欄は at・accounts・groups（Reading の GroupCard の Vec）・moves（Reading の MoveRow の Vec）・projects・sessions・dormant（main bf21e14 で確かめた・同じ波の行 c-acct-thr が閾値と知らせの欄を足しても、この行はそれらを読まず、下の fixture の値も変わらない）。GroupCard の欄は row（GroupRow・欄 group と account は String・candidates は String の Vec・next_account・remaining）・since（EpochSecs の Option）・previous（String の Option）・recorded（bool）・members（GroupMember の Vec・欄 project・seat_account・matches）・refused。契約の型の crate の pub mod wire の pub fn decode（字の &str を受け Deserialize の型の値の Result）で fixture の字を AccountDoc に読める。
      形（host の部分・projects.rs）。足す物はどれも mod dom より前に置き、wasm の target に限らない（host の歯が tsuzuri_surface の account の projects の path で呼ぶ）。host の部分の use に契約の型の EpochSecs と stats の CheckResult、super の home の group_more、project の ledger の fixed1、project の seat の hm と hmd、vocab の label、hover の Card を足す。
      pub const NX_SRC（字「中核の next_step_seat」・電文の next を判じる中核の関数の名）と pub const NX_MISS（字「なし」・見本の nx の枝の当たらない字）。pub fn nx_card（&ProjectRow と at の EpochSecs を受け Card）は見本の nx の枝の写し。title は名と「 · 」と、need の lead が在れば字 ( と need の key の末尾の 1 字（nx_e なら e）と字 ) と空白と label に key を渡した語、無ければ label に key（st_unknown）を渡した語。kind は label に next_all を渡した語と「 · 」と、a から f の 6 種（NextMove の ALL の順から Nothing を除く）のうち next の checks でその種の result が Hit の種の末尾の 1 字と、next の lead が Nothing なら字 g を空白 1 つでつないだ字（無ければ ―・見本の種類の行の印の列のうち当たりの印だけを字で出す）。value は need の line（無ければ ―）。src は NX_SRC と「 · ◷ 」と hm に at を渡した字。more はその 6 種の順に 1 行ずつ、字 ( と末尾の 1 字と字 ) と空白と語と空白と、result が Hit なら「· 」と big にその種とその check を渡した what、Miss なら NX_MISS、NotJudged か check が無い（next が Unknown を含む）なら ―。
      pub const LED_SRC（字「bd list --all の bead」・account の server が anchor ごとに読む台帳の出力）と pub fn led_card（&ProjectRow を受け Card）は見本の ledCard の写し。ledger が Known なら title は名と「 · 」と ledger_state の語、kind は net の arrow と text（net_drop_24h）と「 24h · 」と net の arrow と text（net_drop_7d）と「 7d · 」と l_rate の語と空白と fixed1（closed_per_day）の字（着地済みの project の ledger の burn_card の種類の行と同じ形）、value は字「task 」と open の task と「（ready 」と ready と「 / blocked 」と blocked と「）」、src は LED_SRC と「 · 時点 」と hm（台帳の at）、more は「memo 」と open の memo と「 · stale 」と stale、「question 」と open の question と「 · epic 」と open の epic、「lead p50 」と age（lead の p50）と「 / p90 」と age（lead の p90）の 3 行（lead が無ければ age に None）。Unknown なら title は名と「 · 」と j_none の語、kind は ledger_state の語、value は st_unknown の語、src は LED_SRC、more は空。
      pub const RUNS_UNKNOWN（字「state dir か event log が読めない」）と pub const WAIT_NOTE（字「― = 質問の台帳を読んでいない」・見本の pcnt の枝の字）と pub fn pcnt_card（&ProjectRow と at の EpochSecs を受け Card）は見本の pcnt の枝の写し。title は runs4 の語と「 · 」と名。kind は runs が Known なら RUNS の名の順に名と空白と数（wait・run・stop・land の欄）を「 · 」でつないだ字、Unknown なら st_unknown の語。value は waiting_you の語と空白と ―（電文に決定待ちの数が無いので行の決定待ちの欄と同じ ―・数にするのは後の行 e-acct-qopen と h-acct-cols）。src は字「fleet/events.jsonl · ◷ 」と hm に at を渡した字（run の数の出所は state dir ごとの event log）。more は Known なら col_wait・col_run・col_stop・col_land の語と空白と同じ順の数の 4 行、Unknown なら RUNS_UNKNOWN の 1 行で、どちらも最後に WAIT_NOTE の 1 行。
      pub fn orch_card（&AccountDoc と &ProjectRow を受け Card の Option）は見本の seatCard の写し（見本の orchestrator の欄は席の在る行だけ card を持つので、seat が Unknown なら None）。Known の席の card c について、title は c の target、kind は label に state_key（state_value に c の state）を渡した語と、c の since が在れば「 · ◷ 」と hmd（since と電文の at）と「 から」。value は字「口座 」と c の account（無ければ ?）と「 · tick 」と、c の tick_healthy が Known の真なら healthy・偽なら stale・Unknown なら ? と「 · hb 」と、c の heartbeat が真なら on・偽なら off・Unknown なら ?（着地済みの project の seat の seat_line と同じ語）。src は字「seat/」と target と「/state.jsonl ほか」。more は「model 」と c の model（無ければ ?）の行、次に acc（電文と行）の mark が NG で行の群を current に渡した今の口座が在るとき seat_mismatch の語と空白と acc の account と「 → 」と今の口座の行（見本の seat の枝の移動待ちの行）、次に行の move_left_s が在るとき move_grace の語と空白と秒と「 秒」の行。後の行 h-cards-sess はこの関数を session の表の orchestrator の行の card に使う（同じ見本の seat の枝）。
      pub const GPROJ_SRC（字「doctor の席の行と群の今の記録」）と pub fn gproj_card（&AccountDoc と &ProjectRow を受け Card）は見本の gproj の枝の写し。今の口座は行の群を current に渡した値。seat が Known なら title は c の target、kind は acc の mark が Some の OK なら OK の glyph と空白と seat_match の語、Some の NG なら NG の glyph と空白と seat_mismatch の語、None なら st_unknown の語。value は字「登録 」と acc の account（無ければ ?）と空白と、mark が OK なら =・NG なら ≠・None なら ? と空白と字「群 」と今の口座（無ければ ?）。src は GPROJ_SRC。more は label に state_key（state_value に c の state）を渡した語の 1 行。seat が Unknown なら title は名、kind は seat_none の語、value は群の名（無ければ ―）と「 の今の口座 」と今の口座（無ければ ?）、src は GPROJ_SRC、more は空（見本の席の無い project の gproj の枝・後の行 h-cards-nx は HOME の群の枠の project の chip にこの関数を席の有無に依らず使う）。
      pub fn grp_card（&AccountDoc と群の名の &str を受け Card の Option）は見本の group の枝の写し。電文の groups が Unknown か、row の group が名と同じ GroupCard が無ければ None。在れば title は名と「 · 」と current_account の語と空白と row の account、kind は group の語と「 · 」と group_more（その GroupCard と電文の moves）の records、value は recorded が真で since が在れば「◷ 」と hmd（since と電文の at）と「 から · ← 前 」と previous（無ければ ―）、ほかは no_record の語と「 · ← 前 」と previous（無ければ ―）、src は字「groups/」と名と「.account ほか」（見本の字）、more は「候補 」と row の candidates の数と「 口座 → 」と candidates の語、「anchor 」と members の数と「 件」、members の順に「・ 」と project の行。
      pub struct RowCards（欄 need・led・runs は Card・orch と acc は Card の Option・derive は Debug・Clone・PartialEq・Eq）と pub fn row_cards（&AccountDoc と &ProjectRow を受け RowCards）。need は nx_card（行と電文の at）、led は led_card、runs は pcnt_card（行と電文の at）、orch は orch_card、acc は seat が Known なら gproj_card の Some で Unknown なら None（見本の口座の欄も席の在る行だけ card を持つ）。ProjLine に欄 cards（RowCards）を足し、row が row_cards に電文と行を渡した値を置く。projects の Group に欄 card（Card の Option）を足し、table が束ごとに、見出しが在ってその group が Some の名なら grp_card に名を渡した値、ほかは None を置く（GroupHead には欄を足さない・着地済みの acctproj_group_order_and_heads が GroupHead を 2 つの欄の struct の字で組むため）。Need・Led・Run・Orch・Acc・Open・More・GroupHead・Table の形と、need・led・runs・orch・acc・current・open・more・group_order・table・row の外形は変えない。card の 4 行は着地済みの Card の rows が 36 字で切る（fixture の値の 4 行はどれも 36 字以下・確かめた）。
      形（DOM・mod dom の中）。mod dom の use に crate::widgets::hover の Card と attach を足す（Card は super から引いてもよい・歯は DOM の部分に字 widgets::hover が在ることと、projects.rs に自前の fn attach が無いこと〔字 fn attach( が無い〕を見る）。private の fn attach_some（引数は el の web_sys::Element と card の Card の Option・返りは無し）を足し、本体は card が Some なら attach に el とその card を渡す（字 attach(el, card) の形・名 card で受けて渡す）だけにする（見本の席の無い行の欄と群の無い見出しは card を持たないので、Option の card を directive で付けるための 1 つの口）。row_view は 5 つの欄の div の class の後に属性を足し、tag は今のまま字 <div class=C_NEED などで始める。C_NEED・C_LED・C_RUN の div には tabindex と等号と引用符で囲んだ 0 と、それぞれ字 use:attach=row.cards.need.clone()・use:attach=row.cards.led.clone()・use:attach=row.cards.runs.clone() を置く。C_ORCH と C_ACC の div には字 use:attach_some=row.cards.orch.clone() と use:attach_some=row.cards.acc.clone() を置く（tabindex の 0 は card の在るときだけでも常にでもよく、歯は見ない）。more_view は class mi m-run・mi m-orch・mi m-acc・mi m-led の 4 つの span の class の後に、それぞれ字 use:attach=row.cards.runs.clone()・use:attach_some=row.cards.orch.clone()・use:attach_some=row.cards.acc.clone()・use:attach=row.cards.led.clone() を置く（tabindex は置いてよい）。head_view の引数を head の GroupHead と card の Card の Option の 2 つにし（字 fn head_view(head: GroupHead, card: Option<Card>) -> AnyView の形）、群が在るときの class pchip grp の span の class の後に字 use:attach_some=card を置く（tabindex の 0 を置いてよい）。group_view は束の欄 card を head_view に渡す（字 group.card を本体に書く）。どの tag の属性の式にも字 > を書かない（歯は tag を最初の > までと読む）。4 つの欄の値の字を包む class（C_RUN ほか）は今のまま row_view だけに置き、more_view と runs_view・acc_view・led_view・orch_view の本体に C_RUN・C_ORCH・C_ACC・C_LED と c-run・c-orch・c-acc・c-led の字を書かない（着地済みの pmore_view_bodies が見る・足す字 row.cards.runs などはどれもこの字を含まない）。引用符で囲んだ class の字は足さない。search・replace・view・sort_bar・table_view・net_view・fit_line の本文と、row_view の開閉と 2 段目の収めの字は変えない。
      出さない物。見本の card の経験者だけの行（seat と group の枝の doctor の行・hover の Card は経験者だけの行を持たない）、nx の枝の次の一手の図（figTop）、見本の card4 の出所の元の長い字（srcFull）は出さない。電文から出せないので出さない物は、群の card の閾値の行（base の電文に無い・同じ波の行 c-acct-thr が電文に閾値を足しても、この行は読まず、群の card に足すのは計画 surface-plan の 4 節が決める後の行）と種の行（GroupCard に種の欄が無い）、席の card の tick の経過と tick の理由と応答なしの経過（席の card は tick の健康の真偽だけを持つ）と限度の窓とその戻る時刻（usage は窓ごとの割合と戻る時刻を持つが、どの窓が限度かを持たず、面は判じない）、ledCard の見本を外した値の行と lead の件数（LeadDays は p50 と p90 だけ）、pcnt の枝の決定待ちの数（ProjectRow に数が無い・― と WAIT_NOTE を出す・数にするのは後の行 e-acct-qopen と h-acct-cols）。見本の seat の枝に無い退避までの残りの行は、電文の move_left_s を字にして足す（着地済みの session の表の段の欄も出す値）。決定待ちの欄（c-wait）と未反映の欄（c-un2）と project の名の欄（c-pn）と開くの欄は見本も card を持たない。面は判じず、電文の値を字にするだけにする（acc の印は着地済みの acc の値・状態の語は電文の state の写し）。
      着地済みの歯（直すもの）。無い。
      着地済みの歯（直さずに通る・write-set の外・tests の下の全部を grep で確かめた）。acctproj_（tests/acctproj.rs）は columns・psort・need・group の見出し・judge・runs・acc・open・wait と unref と orch・content・語の鍵と class と依存を見る。GroupHead と Acc を struct の字で組むが、この行は 2 つの型に欄を足さず、need・acc・runs・orch・open・table の値と並びを変えない（足す欄 cards と card は比べられない）。acctproj_vocab_style_and_deps は projects の consts の class と固定の class が style.css に在ることと Cargo.toml の dependencies が tsuzuri-contract だけであることを見る（class と依存を足さない）。pmore_（tests/projmore.rs）は more と table の行の more を比べ、projects.rs の mod dom の字に class c-more・aria-expanded・NO_TOGGLE・closest(・shows_internal(・fit_cut(・scroll_width()・client_width()・ev::resize・aria-label の set_attribute の字が在ることと、fn の本体（行頭の空白 4 つの fn か pub fn で切る）で more_view・runs_view・acc_view・led_view・orch_view に C_RUN・C_ORCH・C_ACC・C_LED・c-run・c-orch・c-acc・c-led が無く、row_view に C_RUN・C_ORCH・C_ACC・C_LED と more_view( が在り c-more が無く、more_view に c-more と mi m-run・mi m-orch・mi m-acc・mi m-led と 4 つの描きの呼びが在ることを見る（この行は 4 つの span の class の字を残して属性を後に足し、足す fn attach_some も行頭の空白 4 つで始めるので本体の切れ目は変わらず、足す字 row.cards.runs・row.cards.orch・row.cards.acc・row.cards.led は 8 つの字のどれも含まない）。apop_ は projects の psort_of を呼ぶ（変えない）。acctframe_blocks_per_tab_and_module は src/account の file の名の 8 つの列と projects.rs の id の字を、acctframe_keys_in_vocab_and_classes_in_stylesheet は src/account の class と等号と引用符で始まる字の名が style.css に在ることを、acctframe_path_from_contract_and_no_storage と acctwin_no_storage_and_wasm_wiring は src/account の file に /api/・localStorage・sessionStorage・cookie の字が無いことを見る（file を足さず、引用符で囲んだ class の字も /api/ の字も保存の字も足さない）。frame_classes_are_in_stylesheet は src の全部の class の字の名が style.css の規則の名に在ることを、frame_no_heading_words_in_code は src に語の辞書の日本語の語と同じ字だけの literal が無いことを見る（足す literal は なし・state dir か event log が読めない・― = 質問の台帳を読んでいない・doctor の席の行と群の今の記録・中核の next_step_seat などの定数と、書式の字で、どれも辞書の語と同じでない。台帳なし・測れていない・記録なし・移動待ち・今の口座 は辞書の語なので label で引き、literal に書かない。口座・から・時点 も辞書の語〔確かめた〕なので、単独の literal にせず、字 口座 と空白・空白と字 から・空白と字 時点 と空白の形で書式の字か定数の中に置く・歯は引用符で囲んだ字の全体が語と同じかだけを見る）。parts_paths_distinct_in_block_modules と parts_reload_events_from_contract_constants は src の引用符で囲んだ /api/ の字と合図の event の名の字を見る（足さない）。hcard_ の歯（tests/hcard.rs）は home.rs の字と group_more の値を見る（この行は home.rs を書かず group_more を呼ぶだけ）。bport_ の面の歯は windows.rs の字と open_url の値を見る（変えない）。acctsess_・sxaxis_・ticker_・accthb_ は session.rs を、accthome_・acctlook_ は home.rs を、acctled_・lspark_ は account の ledger.rs を読み、この行は書かない。steady_ と hsblock_・hsderive_・hspage_ は src/project と build.rs と lib.rs と board.rs ほかを読み、src/account の projects.rs を読まない。
