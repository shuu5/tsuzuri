  - n: 8
    type: prose
    title: 行 h-cards-sess — session の表の session の欄の card
    body: |
      なぜ。見本の account board の sessions の tab の表（docs/design/mock3/account/index.html の関数 sessRow）は、各行の session の欄（class c-ses の div・tabindex 0）に data-card の鍵を付ける。鍵は見本の acct.js の関数 sessionsAt が行ごとに決め、席の在る orchestrator の行は seat と席の鍵、run の行は run と run の名、席の無い project の行（名が無く語 session なし を出す行）は proj と project の名。card の中身は window.__tz_card の seat の枝（ui.js の seatCard）・run の枝・proj の枝で、どれも card4 の 4 行（題・種類・値・出所）と「詳しく」の形。本番の表（便 h-sess と h-sess-axis・src/account/session.rs）は card を 1 枚も持たない（session.rs に use:attach の字は無い・確かめた）。要件 FR14 は hover の card を 4 行（1 行 36 字）と「詳しく」と決め、card を出すのを頁を持つ節点の札・圧縮された cell・記号だけの要素の 3 種に限る。session の欄は席か run の名だけに縮めた cell で、席の状態と合図と口座（seat）、run の段と状態と口座（run）、project の session の数と board（proj）を card が補う。見本（判断の記録 ADR-7 で確定）が card を付ける要素。
      在りか（着地済み・main の commit bf21e14 で確かめた・b525a13 からの code の差は中核と契約の型と別の tests の file だけで、この行の読む file は変わっていない・着地した h-board-url〔83d453c〕は session.rs を書いていない）。src/account/session.rs は account の mod.rs の pub mod session で host でも組む。host の部分は、BLOCK・SORT_KEY・SESS・HROW・COLUMNS（7 つ）・GHEAD・C_PROJ・C_ROLE・C_STAGE・C_STRIP・C_HH・SAXIS・SAXIS_M・TKHB・NONE_MARK（字 ―）・NO_ROWS・STALLED_STAGES・Sort（Project・Account・Stage・Elapsed・ALL は 4 つ）と sort_of と with_sort と without_param と rank と stalled と band_key と BANDS・pub fn role_word と role_key（SeatRole を受け、role_key は語の鍵 role:orchestrator か role:pipeline）・pub fn stage_word（契約の board の Stage を受け &'static str・Running は字 Running）・Signs と tick_class と hb_class・Move と grace_text と elapsed_at と grace_left。pub struct SessRow（欄 index・class・project・role_key・session・account・state・stage・since・elapsed・spans・signs・moving・toggle・derive は Debug・Clone・PartialEq）と Head と session の Group（欄 head と rows）と Table（欄 at・sort・groups）。content と pub fn table（&AccountDoc と Sort を受け Table・各束の rows は row の値）と private の fn project_of（&AccountDoc と名の &str を受け、電文の projects のうち name が同じ ProjectRow の参照の Option）と pub fn row（&AccountDoc と位置の usize を受け SessRow・SessRow を struct の字で組む所は src と tests でここだけ・grep で確かめた）と signs と current_account と moving と strip と axis_labels。host の部分の use は契約の型の EpochSecs、account の AccountDoc・ProjectRow・SessionLine、board の Reading と Stage、seat の SeatSpan と SeatState、surface の SeatRole、super の heartbeat の Toggle と toggle、crate::frame（self と Block）、crate::project の Body、project の pipeline の age、project の seat の OK・Sign・Span・rects・span_ticks・state_value・strip_svg・top、view の Fetched で、vocab の label と hover の Card は host の部分で use していない。wasm の target のときだけの mod dom は、search・replace・view・sort_bar・span_bar・table_view・axis_view・head_view・group_view・row_view・stage_view・sign_view・signs_view を持ち、どの fn も行頭の空白 4 つで始まる。row_view は行の div の中に C_PROJ・C_ROLE の div、session の欄の div、口座の欄（class mono の div）、C_STAGE・経過（class num）・C_STRIP の div をこの順に置き、session の欄の今の字はちょうど <div>{session}</div>（session は名の在る行は class mono の span、無い行は語 seat_none の term の view）。mod dom の use に leptos の prelude の全部、契約の型の EpochSecs と board の Reading、super の定数と型と関数、account の PATH、account の heartbeat、project の seat の Sign・Span・span_of・with_span、crate::project の Body・UNKNOWN・body_view・section・state_icon・state_key・unmeasured、vocab の label、widgets の help の hs と term が在り、hover の attach は無い。この行が足す名（RUN_SRC・PROJ_SHOWN・run_card・proj_card・sess_card）は base の面と契約の型と中核と境界の src と tests と xtask のどこにも無い（grep で確かめた・似た名の seat_card は中核の歯 acctpcore と境界の歯 server_seat に在るので使わない）。足す欄の名 card は SessRow に無い。
      電文（crates/tsuzuri-contract・この行は書かない・型も欄も全部 pub）。SessionLine（契約の account.rs）の欄は project と name（String）・role（SeatRole・Orchestrator か Pipeline）・account（String の Option）・state（SeatState）・stage（Stage の Option）・since（EpochSecs の Option）・spans（Reading の SeatSpan の Vec）。ProjectRow の欄は name・group（String の Option）・seat（Reading の SeatCard）・board（u16 の Option）ほか。AccountDoc の欄は at・projects・sessions ほか。EpochSecs は u64 の別名。契約の型の crate の pub mod wire の pub fn decode で fixture の字を AccountDoc に読める。
      使う組み手（どれも host でも組む pub・この行は書かない・確かめた）。hover の card（src/widgets/hover.rs・widgets の mod.rs の pub mod hover で host でも組む）の pub struct Card（欄 title・kind・value・src は String・more は String の Vec・derive は Debug・Clone・PartialEq・Eq・Default・Card の名の宣言は project の ask.rs にも在るが別の型で、この行が使うのは crate::widgets::hover::Card）と rows（4 行の class と字・36 字を超える行は 35 字と … に切る・run の名の title は見本の cut で 34 字に切るが、ここは rows の 36 字の切りに任せる）。wasm の target のときだけの pub fn attach（引数は web_sys の Element と Card・返りは無し・hover.rs の mod dom に在り wasm の target のときだけ crate::widgets::hover の名として pub use で出す）は、context に HoverCtx が在れば要素に指を置いたときに頁に 1 つの card の層に card を出す（規則の行 R-20 の 150 ミリ秒の猶予）。block は view の要素に use:attach と等号と Card の値を書いて付ける（着地済みの account の home.rs の口座の名の欄と移動の行が前例）。account board の頁（src/account/board.rs の App・wasm の target のときだけ）は既に provide_context(HoverCtx::default()) を呼び view の末尾に <CardLayer/> を置き、tab の block の view はその App の中で組まれる。project の seat の module の pub fn state_value（SeatState を受け run・wait・limit・silent・unknown）と pub fn hmd（時刻と今の EpochSecs を受け、2 つを 86400 で割った商が同じなら UTC の時と分を 2 桁ずつコロンでつないで Z を足した字、違えば UTC の月と日を 2 桁ずつハイフンでつないだ字と空白を前に足した字）。crate::project の pub fn state_key（状態の値の &str を受け語の鍵・run は st_run・wait は st_wait・limit は st_limit・silent は st_silent・ほかは st_unknown）。crate::vocab の pub fn label（鍵の &str を受け String）。同じノートの行 h-cards-proj が account の projects の module に足す pub fn orch_card（&AccountDoc と &ProjectRow を受け Card の Option・seat が Unknown なら None・Known なら見本の seatCard の写しで、title は席の target・kind は状態の語と since が在れば「 · ◷ 」と hmd と「 から」・value は口座と tick と hb・src は字 seat/ と target と「/state.jsonl ほか」・more は model と、群の今の口座と違えば移動待ちの行と、退避までの残りの行）。
      形（host の部分・session.rs）。足す物はどれも mod dom より前に置き、wasm の target に限らない（host の歯が tsuzuri_surface の account の session の path で呼ぶ）。host の部分の use に super の projects の orch_card、project の seat の hmd、crate::project の state_key、vocab の label、hover の Card を足す。
      pub const RUN_SRC（字「fleet/events.jsonl · RunStage」・見本の run の枝の出所の字）と pub fn run_card（&SessionLine と at の EpochSecs を受け Card）は見本の run の枝の写し。title は行の name、kind は label に role:pipeline を渡した語と「 · 」と行の project、value は行の stage を stage_word に渡した字（無ければ NONE_MARK）と「 · 」と label に state_key（state_value に行の state）を渡した語、src は RUN_SRC、more は字「口座 」と行の account（無ければ label に st_unknown を渡した語）の行と、行の since が在れば「◷ 」と hmd（since と at）と「 から」の行。
      pub const PROJ_SHOWN（usize・5・見本の proj の枝が詳しくに並べる session の数）と pub fn proj_card（&AccountDoc と project の名の &str を受け Card）は見本の proj の枝の写し。電文の sessions のうち project が名と同じで name が空でない行を順に並べた列を named とする。title は名、kind は字「project · 」と project_of の行の群（行か群が無ければ NONE_MARK）、value は named が空なら label に seat_none を渡した語、ほかは字「session 」と named の数と「 · orchestrator 」と named のうち role が Orchestrator の数、src は名と「 · state dir」（見本は anchor の末尾の名と state dir。電文に anchor は無いが、電文の project の名は中核の account の mod.rs の pub fn project_name が anchor の末尾の名から組む字なので、同じ字になる・確かめた）、more は named の初めの PROJ_SHOWN 個ごとに name と空白と account（無ければ ?）の行と、最後に project_of の行の board が在れば「board :」と port・無ければ label に not_yet を渡した語の行（見本の dashboard の行・本番の board は電文の board の port）。
      pub fn sess_card（&AccountDoc と位置の usize を受け Card）は見本の鍵の選び方の写し。sessions のその位置の行の role が Pipeline なら run_card（行と電文の at）。ほかは、name が空でなく project_of（行の project）が Some で、その ProjectRow を orch_card に渡した値が Some ならその値（見本の seat の枝・席の card は同じノートの行 h-cards-proj の projects の orchestrator の欄と同じ値）。どれでもなければ proj_card（電文と行の project）（見本の席の無い project の行・名の在る orchestrator の行で電文の席が読めない行も含む）。SessRow に欄 card（Card）を足し、row が sess_card に電文と位置を渡した値を置く。SessRow の他の欄と、table・content・signs・moving・toggle・strip・axis_labels の外形と値は変えない。card の 4 行は着地済みの Card の rows が 36 字で切る（fixture の値の 4 行はどれも 36 字以下・確かめた）。
      形（DOM・mod dom の中）。mod dom の use に crate::widgets::hover の attach を足す（歯は DOM の部分に字 widgets::hover が在ることと、session.rs に自前の fn attach が無いこと〔字 fn attach( が無い〕を見る）。row_view の session の欄の div を、字 <div tabindex と等号と引用符で囲んだ 0 と空白と字 use:attach=row.card.clone()>{session}</div> の形にする（use:attach を tag の最後の属性にし、tabindex はその前に置く。歯は空白を除いた字の中で use:attach=row.card.clone() のすぐ後に >{session}</div> が続く字をちょうど 1 つ探し、その tag が <div で始まり tabindex の 0 を持つことを見るので、use:attach の後に別の属性を置く形は落ちる）。session の欄の div に class は付けない。見本の class の名 c-ses を session.rs のどこにも（comment にも）書かない（着地済みの acctsess_vocab_style_and_deps が session.rs の字に c-ses・c-acct・c-el が無いことを見る）。row_view の他の div、stage_view、signs_view、head_view、group_view、table_view、axis_view の字は変えない（着地済みの sxaxis_ が table_view の鎖と axis_view の本体を、ticker_ が DOM の部分の crate::net::ticker() と elapsed_at( と grace_left( を、accthb_ が heartbeat::button( と heartbeat::below( を見る）。どの tag の属性の式にも字 > を書かない。引用符で囲んだ class の字は足さない。
      出さない物。見本の card の経験者だけの行（seat の枝の doctor の行・hover の Card は経験者だけの行を持たない）、run の枝の段の道（最後の 3 段）と worker の生き死にと出力の token と RunCost の数、proj の枝の種類の行の状態の記号の列、見本の出所の元の長い字（srcFull）は電文に無いか card4 の字の外なので出さない。見本の run の枝に無い since の行（「◷ 」と時刻と「 から」）は、電文の SessionLine の since を字にして足す。seat の枝の器の tick が起こし直すという説明の行も出さない（orch_card の形は行 h-cards-proj が決める）。project の欄（C_PROJ）と役の欄（C_ROLE）と口座の欄と段の欄と経過の欄と帯の欄は見本も card を持たない（束の見出しの project の名と口座の名にも見本は card を付けない）。面は判じず、電文の値を字にするだけにする。
      着地済みの歯（直すもの）。無い。
      着地済みの歯（直さずに通る・write-set の外・tests の下の全部を grep で確かめた）。acctsess_（tests/acctsess.rs）は session の columns・sort・table の並びと束・row の欄の値・語の鍵と class と依存を見る。SessRow を struct の字で組まず、欄を 1 つずつ比べるので、足す欄 card は比べられない。acctsess_vocab_style_and_deps は session.rs の字に c-ses・c-acct・c-el が無いことと、class が style.css に在ることと、Cargo.toml の dependencies を見る（class の字も依存も足さず、c-ses の字を書かない）。sxaxis_（tests/sessaxis.rs）は DOM の部分を空白を除いた字の table_view の鎖と C_HH と SAXIS_M の数と axis_view の本体を見る（変えない）。ticker_ と accthb_ は DOM の部分の字の在ることを見る（消さない）。acctframe_ と acctwin_ は src/account の file の名の 8 つの列と、/api/・localStorage・sessionStorage・cookie の字が無いことと、class と等号と引用符で始まる字の名が style.css に在ることを見る（file も字も足さない）。frame_classes_are_in_stylesheet は src の全部の class の字を、frame_no_heading_words_in_code は src に語の辞書の日本語の語と同じ字だけの literal が無いことを見る（足す literal は fleet/events.jsonl · RunStage と、口座 と ◷ と から と project と session と orchestrator と state dir と board を含む書式の字と ? で、どれも辞書の語と同じでない。測れていない・session なし・まだ無い は辞書の語なので label で引き、literal に書かない。口座 と から も辞書の語〔確かめた〕なので、単独の literal にせず、字 口座 と空白・空白と字 から の形で書式の字か定数の中に置く・歯は引用符で囲んだ字の全体が語と同じかだけを見る）。parts_ は src の引用符で囲んだ /api/ と合図の event の名の字を見る（足さない）。acctpcore_ の中核の歯の seat_card は中核の関数で、この行の名と重ならない。
      測り方。新しい歯は tests/hcsess.rs に置き、名を hcsess_ で始める。名の例は hcsess_run_card_rules・hcsess_proj_card_rules・hcsess_rows_carry_cards・hcsess_dom_wiring・hcsess_vocab_keys・hcsess_names_clean。fixture は着地済みの tests/fixtures/account/acct-doc.json を CARGO_MANIFEST_DIR から ../../tests/fixtures/account/acct-doc.json として読み、wire の decode で AccountDoc にする（新しい fixture は置かない）。変えた電文と行は歯の中で fixture の値を clone して欄を書き換えて作り、契約の型を struct の字で組まない。orch_card の値は行 h-cards-proj の歯が形を見るので、この行の歯は sess_card の値を orch_card を呼んだ値と比べる（title の字 proj-a-orch と proj-b-orch は確かめてよい）。done の期待が拠る fixture の値は次のとおり。電文の at は 1790510400（2026-09-27 12:00Z）。sessions は 4 行で、位置 0 は project proj-a・role orchestrator・name proj-a-orch・account acct-1・state run・stage なし・since 1790505060、位置 1 は project proj-a・role pipeline・name proj-a.3-20260927T113000Z・account acct-1・state run・stage Running・since 1790508600（11:30Z）、位置 2 は project proj-b・role orchestrator・name proj-b-orch・account acct-1・state wait・since 1790508900、位置 3 は project proj-c・role orchestrator・name proj-c-orch・account なし・state unknown・since なし。projects は proj-a（群 Tier1・席は Known・board 40001）と proj-b（群 Tier2・席は Known・board 40002）と proj-c（群 Tier1・席は Unknown・board なし）。時刻の字は hmd の決まりから出る（1790508600 は 11:30Z・電文の at と日の違う 1790460300 は 09-26 22:05Z）。語の辞書の語は role:pipeline が pipeline、st_unknown が 測れていない、st_run が 動いている、st_limit が 限度で止まっている、seat_none が session なし、not_yet が まだ無い（確かめた・歯は字でなく label の値と比べてもよい）。DOM の部分と account の board.rs は wasm の target のときだけなので、字の歯は CARGO_MANIFEST_DIR から src/account/session.rs と src/account/board.rs を読む。session.rs の字「mod dom {」より後を DOM の部分とし、fn の本体は着地済みの pmore_ の歯と同じ切り方（字 fn と名と開き丸括弧の所から、次の行頭の空白 4 つと fn と空白か空白 4 つと pub fn と空白で始まる行の前まで・無ければ終わりまで）で切り、空白（Rust の char の is_whitespace が真の字）を除いた字で見る。DOM の振る舞い（指を置くと card が出る）は host で撃てないので、字の歯と xtask の surface-build で見る。done (4) と (5) の行の前提は、この行の外で board.rs か語の辞書の値が変わったときに落ちる。
      filter の語（着地済みの 49 の語と第 3 波の 17 と第 4 波の 4 と第 5 波の 11 と第 6 波の 4 と第 7 波のほかの行の 7・この行の接頭辞 hcsess_ は並べない・92 語）。accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・qgate_・nsum_・hcard_・ntime_・ptitle_・ncard_・hsym_・smore_・lcard_・aaround_・hruling_・sxaxis_・plimit_・bport_・fmark_・fstop_・fserve_・nsumw_・cadopt_・tipx_・hcproj_・sesplit_・mstore_・athr_・qblock_。新しい歯の名から先頭の hcsess_ を除いた字は、このどれも部分の字として含まない（例 hcsess_stage_x・hcsess_project_x・hcsess_account_x は不可）。
      依存は行 h-cards-proj（同じノート）。この行は orch_card を使うので、その行の着地の後に流す（見本は session の orchestrator の行と projects の orchestrator の欄に同じ seatCard を使い、組み手を 2 つの file に写さないため・計画 surface-plan の 4 節と 5 節もこの依存を書く）。審査の base の projects.rs には、その行の着地で orch_card が在る。Cargo.toml・vocab.json・style.css は触らない。account の board.rs と mod.rs と projects.rs と home.rs と heartbeat.rs、widgets の下、project の seat.rs は読むだけで書かない。session.rs は大きさ S の 100 を足しても受付の上限 1500 の内（main bf21e14 の wc で確かめた）。同じ波のほかの行の write-set と重ならない。同じ波の g-mode-store は account の board.rs を書くが、done (4) の行の前提の 2 つの字はその行の仕事の外。同じ波の c-acct-thr は契約の account.rs と fixture を書くが、足すのは AccountDoc の閾値と知らせの欄と fixture のその 2 つの鍵だけで、上の at・projects・sessions の値は変えない（その行の起草で確かめた）。この行の歯は fixture の上の値の欄を読み、契約の型を struct の字で組まないので、どちらが先に着いても通る（c-acct-thr が上の値を変える形に直されたなら、後に着く行が期待を直す）。同じ波の g-seat-split は project の seat.rs の DOM の部分を移すだけで、この行が使う host の state_value と hmd は変わらない。
  - n: 9
    type: prose
    title: 行 c-acct-thr — 窓ごとの逼迫の閾値と、器の逼迫の知らせと移動の断りを account board の電文に写す
    body: |
      なぜ。要件 FR12（第 0.8 版）は「使用量の閾値（窓ごとの cap）と逼迫の印と、移り先の候補が門で落ちた理由は、器の rules 行と event と doctor の値を写して出し、面も server も閾値を持たず判じない」と言う。持ち主の裁定 t3-hub.53.8（裁定 id = t3-hub.53.8:20260927T2233Z-1・逐語は台帳の問いの notes）は、値は器の rules 行を読んで写すだけで tsuzuri は判じない形で出すと決め、同じ束で規則の行 R-22 の値に「使用量の閾値 = 器の rules 行の窓ごとの cap」と「移り先の候補が門で落ちた理由と逼迫の知らせと移動の断りは器の event と doctor の字を写す・値は器の rules 行から読み code に書かない」を足した。見本 mock v3（判断の記録 ADR-7 の承認で確定・repo の写しは docs/design/mock3）の account board は、HOME の窓の棒に閾値の線、群の枠に逼迫の窓の段、移動の段に逼迫の知らせの行（GroupPressureNotified）と断りの行（GroupMoveRefused と理由の語）を出す（docs/design/mock3/account/index.html の群の枠と fn mvli）。本番の電文には閾値も知らせも断りの行も無い（契約の型の AccountDoc の欄は at・accounts・groups・moves・projects・sessions・dormant だけ・確かめた）。この行は電文と中核と境界の側だけを書き、画面の印と行は後の行 h-thr-home（面の account の home.rs）が描く。
      器の値（器の repo scribe2 の main 24aaa5a と、この host の器の state dir の fleet/events.jsonl で確かめた・この行は器を書かない）。窓ごとの閾値は器の rules の file（scribe2 の rules/manifest.toml）の 3 つの行で、id は fleet.group_pressure_5h_pct（kind GroupPressure5hPct）・fleet.group_pressure_7d_pct（GroupPressure7dPct）・fleet.group_pressure_model_pct（GroupPressureModelPct）、値は使用率の百分率の整数（今は 85・95・95）。器の判定の読み手（scribe2 の src/hook/group.rs の struct Caps と consts ROW_FIVE・ROW_SEVEN・ROW_MODEL）も同じ 3 行を窓ごとに読む。器の口 rules get と行の id（scribe2 の src/rules/cli.rs の fn get）は、行が在って発効していれば値の字を 1 行出して rc 0、無い行と不発効の行は rc 1。行は tracked の面だけに在り、host の面（host.toml）は rules の行を足さない（scribe2 の src/rules/manifest.rs の fn joined が合わせるのは口座・plugin・起動の引数・群・端末・器の行・tick だけ）ので、--state-dir を付けずに読んだ値が器の判定の値と同じ（着地済みの猶予の読み GRACE_ARGS と同じ形）。逼迫の知らせは event の kind GroupPressureNotified で、群の今の口座が逼迫でない周に、群の測る口座（今の口座と、群の置き場の席の口座）のうち閾値を越えた口座ごとに 1 行書かれ（scribe2 の src/hook/group.rs の fn judge の Stay と src/pipe/dispatch/group.rs の fn notice・逼迫の口座は群の今の口座と違ってよい）、欄 account が逼迫の口座、欄 detail が 1 行の字 group=群の名・window=窓の語（5h・7d・model の 3 つ・閾値を越えた窓のうち使用率が最大の 1 つ）・used=使用率・cap=その窓の閾値の行の値・sent=送った席の数を空白でつないだ形（scribe2 の src/fleet/mod.rs の struct Pressure の fn render）。移動の断りは kind GroupMoveRefused で、欄 account は断った周の群の今の口座、detail は字 group=群の名と字 reason=理由の語を空白でつないだ形で、今の理由の語は no-candidate だけ（移り先の候補が門を 1 つも通らなかった・scribe2 の src/hook/group.rs の fn refuse と const NO_CANDIDATE）。どちらも群の段を撃った state dir の event log（その state dir の fleet/events.jsonl）に 1 行ずつ書かれ（scribe2 の src/hook/group.rs の fn append）、欄 ts は UTC の RFC 3339 の字。この host の実物の event log に両方の種類の行が在る（grep で確かめた）。器は候補ごとの門の結果を出さない（持ち主の席を通した器の席 s2 の答え・候補ごとの口座と落ちた窓と使用率と閾値を doctor の群の行に足す話は器の台帳の memo s2-07l.725 で open）。器の逼迫の印は GroupPressureNotified の行そのもので（同じ答え）、window が model の行は役割の model の窓が閾値を越えたことを言う（役割の model は字 seat.model. に役の名を続けた器の rules 行から読み、今は orchestrator の行だけ・scribe2 の src/hook/group.rs の fn role_model）。器はほかのどこにも数えたかと逼迫かの欄を持たない。doctor の群の行は group・accounts・anchors・seat-accounts・current・next・refused の 7 つの項で（scribe2 の src/account/mod.rs の fn render_group）、refused の値は断りの印の時刻か字 - か読めない印の字で（scribe2 の src/account/mod.rs の fn render_refused）、理由を持たない。よってこの行は、群の候補が門で落ちた理由を断りの行の理由の語として写す。
      在りか（main の commit 4eae248 で確かめた・h-board-url の着地 83d453c の後の字・main 2bc9aa0 までこの行が書く file と読む file は変わっていない〔git diff で確かめた〕）。この行が足す名（契約の型の WindowCap・GroupNotice と AccountDoc の欄 caps・notices、中核の CAP_ROWS・PRESSURE_EVENT・REFUSED_EVENT・WINDOW_WORDS・fn caps・fn notices と HostTexts の欄 caps、境界の CAP_ARGS）は base のどの crate の src と tests にも無い（grep で確かめた・字 GroupPressureNotified と GroupMoveRefused と group_pressure は面の vocab.json の注釈の字にだけ在る）。
      契約の型（crates/tsuzuri-contract の src/account.rs・lib.rs の pub mod account）。pub struct AccountDoc（derive は Debug・Clone・PartialEq・Serialize・Deserialize・pub な欄 at の EpochSecs・accounts の Reading の AccountRow の Vec・groups の Reading の GroupCard の Vec・moves の Reading の MoveRow の Vec・projects の ProjectRow の Vec・sessions の SessionLine の Vec・dormant の String の Vec）。Reading は board の module の enum（Known に値を持つか Unknown・derive は Debug・Clone・PartialEq と serde・rename_all は kebab-case で Known の値は鍵 known の object、Unknown は字 unknown）。EpochSecs は crate の root の u64 の別名。wire の pub fn encode（Serialize の値の参照を受け Result の String・serde_json の to_string の字）と pub fn decode（&str を受け Deserialize の値の Result）。AccountDoc を struct の字で組む所は中核の project.rs の pub fn assemble の 1 つだけ（src と tests を grep で確かめた・着地済みの歯は fixture を decode するか、中核の doc と assemble を呼ぶ）。
      中核（crates/tsuzuri-core の src/account/host.rs と project.rs・account の mod.rs の pub mod host と pub mod project・host の code）。host.rs の pub struct HostTexts（derive は Debug・Clone・Default・PartialEq・Eq・Deserialize・pub な欄 host_toml・usage・doctor の Option の String と、serde の default の付いた seat_doctors・records・history の String から String への BTreeMap）。pub fn declaration（群の宣言の字の &str を受け Declaration・欄 groups は宣言の順の DeclaredGroup の Vec・DeclaredGroup の欄 name は群の名）。pub fn accounts・groups・moves（&HostTexts を受け Reading の列）は変えない。account の mod.rs の pub(crate) fn value（行と鍵を受け、空白で区切った字のうち鍵と等号で始まる最初の字の等号の後の字の Option・空の字は None）と crate の ledger の pub fn epoch_secs（UTC の RFC 3339 の字を EpochSecs の Option に）と crate の seat の pub const WINDOWS（five_hour・seven_day・seven_day_model の順）が在る。project.rs の pub struct ProjectTexts（pub な欄 state_dir_known の bool と events ほかの Option の String）、private の fn with_texts（&HostTexts と project の字の表を受け、宣言の順の project と、その anchor と同じ path の表の字の Option の対の列）、pub fn assemble（at と accounts と groups と moves と projects と sessions の 6 つを受け AccountDoc・dormant は空の列）、pub fn doc（&HostTexts と anchor から ProjectTexts への &BTreeMap と猶予の Option の &str と今の EpochSecs を受け AccountDoc・assemble に host の accounts・groups・moves と project_rows と session_lines を渡す）。中核の src/account の下の字に std::fs・std::process・SystemTime は無く（着地済みの acctcore_pure_and_no_new_dependencies が見る）、中核の Cargo.toml の直接依存は serde・serde_json・tsuzuri-contract。
      境界（crates/tsuzuri-boundary の src/acct.rs・lib.rs の pub mod acct・host の code）。pub const GIT・GIT_ARGS・BOARD_ARGS・GRACE_ARGS（[&str; 3]・rules・get・seat.move_grace_s）。pub struct Acct（器・git・bd の program と引数の state dir と cwd と持ち回しの字）。pub fn doc（&self と今を受け AccountDoc）は持ち回しの字（private の struct Texts の欄 host の HostTexts・projects・grace・boards・marks）の host と projects と grace を中核の project の doc に渡し、project の行に board の port を置いて返す。持ち回しは HOLD（5 秒）で、過ぎれば private の fn gather が集め直す。gather の 1 段目は thread の scope の中で、anchor ごとの state dir と board の git・口座の残量（器の fleet usage --show --state-dir と引数の state dir）・猶予（器の GRACE_ARGS）・引数の state dir の doctor を並べて撃って待ち、2 段目は state dir ごとの tick と doctor と台帳。器を撃つ private の fn shoot（引数の列を受け、器の program を server の proc の pub fn capture〔server の ledger が pub use で出す〕で撃ち、rc 0 で SCRIBE2_TIMEOUT〔5 秒〕の内に返した標準出力の UTF-8 の字の Option）。state dir が引けた anchor の ProjectTexts の events は、その state dir の event log の file の字（読めなければ None）。account の GET の口（server の routes の account.rs）は state dir の無い server では assemble に Unknown の 3 つと空の 2 つを渡した電文を返し、在れば Acct の doc を返す。
      形（契約）。account.rs に 2 つの型を足す。pub struct WindowCap は窓の逼迫の閾値の 1 行（pub な欄 window の String〔窓の名〕・rule の String〔器の rules 行の id〕・cap の Reading の u64〔行の値・読めなければ Unknown〕・derive は Debug・Clone・PartialEq・Serialize・Deserialize）。pub enum GroupNotice は群の逼迫の知らせと移動の断りの行（serde の tag は kind・rename_all は lowercase・derive は Debug・Clone・PartialEq・Eq・Serialize・Deserialize）で、変種 Pressure は欄 at（EpochSecs）・group・account・window（窓の名）の String と used・cap・sent（知らせを送った席の数）の u64、変種 Refused は欄 at・group・account・reason（器の理由の語）を持つ。AccountDoc の欄 accounts の直後に pub caps（WindowCap の Vec・注釈は窓ごとの逼迫の閾値・器の rules 行の写し）を、欄 moves の直後に pub notices（Reading の GroupNotice の Vec・注釈は群の逼迫の知らせと移動の断り・器の event の写し・新しい順）を足す。ほかの欄と型は変えない。電文の字は、Pressure が鍵 kind と字 pressure で始まり at・group・account・window・used・cap・sent が続く object、Refused が kind と字 refused で始まり at・group・account・reason が続く object（serde の内側の tag の形）。
      形（fixture）。tests/fixtures/account/acct-doc.json に鍵 caps（3 つの object・window と rule と cap の順・値は下の表）と鍵 notices（鍵 known の列の 2 つの object）を足す。caps は five_hour・fleet.group_pressure_5h_pct・cap の known が 85、seven_day・fleet.group_pressure_7d_pct・95、seven_day_model・fleet.group_pressure_model_pct・95（今の器の値と同じ数）。notices は 1 つ目が kind refused・at 1790509800・group Tier2・account acct-2・reason no-candidate、2 つ目が kind pressure・at 1790508600・group Tier1・account acct-2・window five_hour・used 100・cap 85・sent 1。ほかの鍵と値は変えない。足す字に字 unknown・host・住所の形は無く、口座の名は acct- の形。
      形（中核・閾値）。host.rs に pub const CAP_ROWS（[(&str, &str); 3]・窓の名と行の id・WINDOWS の順に fleet.group_pressure_5h_pct・fleet.group_pressure_7d_pct・fleet.group_pressure_model_pct）を足し、HostTexts に serde の default の付いた pub caps（行の id の String から、器の rules get のその行の出力の字の String への BTreeMap・撃てない行と rc 0 でない行は入らない）を足す。pub fn caps（&HostTexts を受け WindowCap の Vec）は CAP_ROWS の順に 1 つずつ、window に窓の名、rule に行の id、cap に、caps の表のその行の字の前後の空白を除いた字を u64 の from_str で読めた値の Known か、字が無いか読めなければ Unknown を置く。数の範囲は見ない（器の値のまま）。値の数は code に書かない（規則の行 R-22）。
      形（中核・知らせと断り）。host.rs に pub const PRESSURE_EVENT（字 GroupPressureNotified）・REFUSED_EVENT（字 GroupMoveRefused）・WINDOW_WORDS（[(&str, &str); 3]・器の窓の語と窓の名・5h と five_hour・7d と seven_day・model と seven_day_model）と pub fn notices（&HostTexts と event log の字の &[&str] を受け Reading の GroupNotice の Vec）を足す。読みの決め。群の宣言の字（host_toml）が無いか、log の字が 1 つも渡されなければ Unknown。ほかは Known で、渡した log の順に、log の中は行の順に 1 行ずつ JSON の object として読み、次の全部を満たす行だけを 1 つの GroupNotice にする。欄 kind が PRESSURE_EVENT か REFUSED_EVENT・欄 ts の字を epoch_secs で読める（at）・欄 account が空でない字・欄 detail の字の value の group が群の宣言の群の名のどれか。PRESSURE_EVENT の行はさらに detail の window の語が WINDOW_WORDS に在り（window はその窓の名）、used と cap と sent の字が u64 として読めるときだけ Pressure、REFUSED_EVENT の行は detail の reason が在るときだけ Refused（reason はその字のまま）。JSON として読めない行・ほかの kind の行（GroupMoved・GroupMovePending・RunStage ほか）・欄の欠けた行は読み捨てる。全部の欄が前に組んだ行と同じ行は足さない（同じ log が 2 度渡されても 1 度だけ）。列は at の新しい順で、同じ at は群の宣言の順、それも同じなら読んだ順。sent の数も写す（後の行が器の知らせの字のまま描けるように）。群の名に空白を持つ群の行は、value が空白の前までを返すので群の名が合わず読まない（器は群の名を字 Tier と 10 進の数字に限り、ほかの名の宣言は器の読みが断る・scribe2 の src/rules/groups.rs の fn check_tiers・器の実物にこの形は出ない）。
      形（中核・組み立て）。project.rs の pub fn assemble の引数と返りの型は変えず、組む電文の caps を CAP_ROWS の順の 3 つで cap がどれも Unknown の列（host の caps に HostTexts の Default を渡した値と同じ）に、notices を Unknown にする（何も読んでいない電文・state dir の無い server の口の電文もこれ）。pub fn doc は assemble の電文の caps を host の caps（host）に、notices を host の notices に with_texts の宣言の順の project のうち ProjectTexts の state_dir_known が真で events が在るものの events の字を順に渡した値に替えて返す（ほかの欄は今のまま）。宣言に無い anchor の字と state dir の引けない project の字は渡さない。
      形（境界）。acct.rs に pub const CAP_ARGS（[&str; 2]・rules と get）を足す。gather の 1 段目で、CAP_ROWS の行ごとに器の program に CAP_ARGS の 2 つと行の id を並べた引数を shoot で撃つ thread を、口座の残量と猶予と同じ scope に並べて spawn し（--state-dir を付けない・行ごとに 1 回）、Some の字を Texts の host の caps に行の id の鍵で入れる。marks は変えない（rules の出力は変化の印でない・値が変われば次の集め直しで出る）。event log は今の gather が既に読む state dir ごとの字（ProjectTexts の events）で足り、境界は新しい file を読まない。module の頭の注釈の撃つ口の列に rules get の閾値の 3 行を足す。
      出さない物と前提。逼迫の印（HOME の窓の棒の hot）と閾値の線と群の枠の逼迫の段と断りの理由と移動の段の行の描きは後の行 h-thr-home（面の account の home.rs と着地済みの歯 accthome の見張りの直し）の仕事で、この行は面の crate を書かない。この行は知らせの window・used・cap・sent を欄のまま写すので、後の行は器の式（役割の model の窓の数え方を含む）を組み直さずに知らせの行から印を描ける。見本の候補の札ごとの理由（ほかの群の今の口座・退役・測れていない・鮮度の外・窓が閾値以上）は出さない。器は候補ごとの門の結果を doctor にも event にも書かず、組み直すには器の門（役割の model の窓の数え方・rules 行 fleet.usage_fresh_s の鮮度・群の予約）を tsuzuri が判じることになり、要件 FR12 の判じないに反する。群の候補が門で落ちた理由は、器が書く断りの理由の語（今は no-candidate）の写しで（候補ごとの理由は器の memo s2-07l.725 が doctor に出した後の行で写す）、群の枠の今の断りは、doctor の群の行の refused（電文の GroupCard の refused）が在る群の notices の最も新しい Refused の行で足りる（後の行の描きの材料）。移動の保留の event（GroupMovePending）は計画の範囲の外で写さない。notices の時間の窓は切らない（着地済みの moves と同じく全部の行・この host の実物は数十行）。器の値の数（85・95）は code に書かない（fixture の数は電文の見本）。
      着地済みの歯（直すもの）。中核の tests/acctpcore.rs の acctpcore_assemble_equals_doc_fixture は今、fixture の電文の at・accounts・groups・moves・projects・sessions を assemble に渡した値が fixture の電文と同じことを見る。fixture の caps と notices は値を持ち assemble の値は読んでいない形なので、assemble の値の caps と notices を fixture の値に替えた電文が fixture の電文と同じことと、assemble の値そのものの caps が CAP_ROWS の順の 3 つで cap がどれも Unknown・notices が Unknown であることを見るように直す（同じ file のほかの歯は変えない）。境界の tests/server_acct.rs の偽の器は、argv の頭が rules なら行の id に依らず作業場の out の下の file grace（字 1800 と改行）を出す。server_acct_argv_exact は今、器の argv を tick 2・doctor 2 か 3・fleet usage 1・rules get seat.move_grace_s 1 の 6 行か 7 行（名の順）と見る。この行は CAP_ROWS の行ごとの字 rules get と行の id の 3 行を足して見て、CAP_ARGS の値も見るように直す（use に CAP_ARGS と中核の CAP_ROWS を足す）。server_acct_holds_five_seconds は今、5 秒の中の器の数を 6 と見る。9 と見るように直す（argv ごとに 1 回と 5 秒の後の 2 倍はそのまま通る）。fn expected（読みが集めたはずの字）は、CAP_ROWS の行ごとに、落とす出力の列に grace が無ければ out の grace の字を HostTexts の caps に行の id の鍵で入れるように直す（偽の器の出す字と同じ）。これで server_acct_doc_matches_core・server_acct_failed_output_only_its_parts・server_acct_grace_unreadable_no_left（grace を落とすと rules の 4 行が全部 rc 1 で、両辺の caps が Unknown）・server_acct_slow_output_is_unknown の core_doc との比べは直さずに通る（両辺の notices は、作業場の event log に群の event が無く Known の空の列）。server_acct_state_dir_from_git・server_acct_marks_list・server_acct_repo_and_state_bytes_unchanged・server_acct_fixture_names・server_acct_no_new_dependencies は変わらない。
      着地済みの歯（直さずに通る・tests の下を grep で確かめた）。契約の tests/acctdoc.rs の acctdoc_fixture_roundtrip は fixture を読み書きし直して同じことと数（口座 3・群 2・移動 2・project 3・session 4）を見て、acctdoc_unknown_only_where_marked は fixture の字 unknown の在りかの 12 の path と 7 つの部分の置き換えを見て（足す値に字 unknown は無い）、acctdoc_fixture_names_and_size は 20000 byte 以下と決まった欄の口座の名と host と住所の字の無さを見る（足すのは 1000 byte ほど）。fixture を decode する面の歯（acctframe_・accthb_・accthome_・acctled_・acctproj_・acctsess_・acctwin_・bport_・hcard_・lspark_〔tests/ledspark.rs〕・pmore_〔tests/projmore.rs〕・sxaxis_・ticker_）は caps と notices を読まず、面の src はどの型も struct の字で組まない。accthome_no_pressure_marks は面の home.rs が組む値と home.rs の字に hot と cap の字が無いことを見る（この行は home.rs を書かない）。中核の tests/acctcore.rs の歯は host の accounts・groups・moves と declaration の値と fixture の acct-inputs.json（texts に caps の鍵が無く serde の default で空の表）を見て、acctcore_pure_and_no_new_dependencies は src/account の下の字と Cargo.toml を見る（足す字に std::fs ほかは無い）。acctpcore_doc_host_parts_from_inputs は doc の at・accounts・groups・moves・projects・sessions・dormant を部分ごとに比べ、tests/plimit.rs の歯は HostTexts と ProjectTexts を Default の上に組み（欄を足しても組める）、doc の sessions だけを見る。境界の tests/bport.rs の bport_doc_carries_port_only は、偽の器がどの argv にも rc 1 なので caps の字が無く、core_doc も HostTexts の Default の上に組むので両辺の caps は Unknown の 3 つ、notices は作業場の state dir に event log の file が無く両辺とも log の字を渡さないので Unknown、電文の字の board の字と host-1 の無さは変わらない。tests/server_acctwire.rs の acctwire_get_matches_acct は口の電文と同じ偽の器の Acct の doc を比べ（両辺が同じ関数・偽の器は rules に grace の字を返す）、acctwire_get_without_state_dir は accounts・groups・moves・projects・sessions・dormant だけを見て、acctwire_marks_send_board_changed は最初の取り直しの後 6 秒に器を撃たないことを見る（集め直しの回数は変えない）。tests/server_hb.rs の歯は停止の切り替えの口（accthb の accept）が撃つ器と git の argv を見る（accept は gather も doc も呼ばない・変えない）。
      測り方（中核の歯・crates/tsuzuri-core の tests/athr.rs）。今は 1790510400（2026-09-27T12:00:00Z）。HOST は群の宣言の字で、[[account-group]] の塊 2 つ（name は引用符で囲んだ Tier1・anchors は引用符で囲んだ /work/proj-a と /work/proj-b／name は Tier2・anchors は /work/proj-c）。event log の行は serde_json の json の macro で組む 1 行 1 件の JSON の object（欄 ts・kind・account・detail・時刻は下では時と分だけを書き、どれも 2026-09-27 の UTC の RFC 3339 の字）。L1 は 13 行で、11:30 の GroupPressureNotified（acct-2・group=Tier1 window=5h used=90 cap=85 sent=1）、11:40 の GroupMoveRefused（acct-3・group=Tier2 reason=no-candidate）、11:40 の GroupPressureNotified（acct-1・group=Tier1 window=model used=97 cap=95 sent=2）、11:45 の GroupPressureNotified（acct-2・group=Tier9 window=7d used=99 cap=95 sent=1・宣言に無い群）、11:46 の同じ種類（acct-2・group=Tier1 window=1h used=99 cap=95 sent=1・窓の語でない）、11:47 の同じ種類（acct-2・group=Tier1 window=7d used=lots cap=95 sent=1・数でない）、11:44 の同じ種類（acct-2・group=Tier1 window=7d used=99 cap=95・sent の無い行）、ts が字 soon の GroupMoveRefused（acct-3・group=Tier2 reason=no-candidate）、11:48 の欄 account の無い GroupMoveRefused（group=Tier2 reason=no-candidate）、11:49 の reason の無い GroupMoveRefused（acct-3・group=Tier2）、11:50 の GroupMoved（acct-2・detail は字 name）、JSON でない 1 行（開きの波括弧だけ）、11:51 の GroupMovePending（acct-2・group=Tier1 reason=not-a-shell）。L2 は 4 行で、L1 の 2 行目と同じ行（字も同じ）、11:55 の GroupMoveRefused（acct-1・group=Tier1 reason=no-candidate）、11:30 の GroupPressureNotified（acct-2・group=Tier1 window=5h used=91 cap=85 sent=1）、11:20 の GroupPressureNotified（acct-1・group=Tier2 window=7d used=96 cap=95 sent=1）。L3 は 11:59 の GroupMoveRefused（acct-3・group=Tier2 reason=no-candidate）の 1 行、L4 は 11:58 の GroupPressureNotified（acct-1・group=Tier1 window=5h used=99 cap=85 sent=1）の 1 行。表（HOST と L1 と L2 の順の notices・6 行・Pressure は at・group・account・window・used・cap・sent の順）。1 行目 Refused（at 1790510100・Tier1・acct-1・no-candidate）、2 行目 Pressure（1790509200・Tier1・acct-1・seven_day_model・97・95・2）、3 行目 Refused（1790509200・Tier2・acct-3・no-candidate）、4 行目 Pressure（1790508600・Tier1・acct-2・five_hour・90・85・1）、5 行目 Pressure（1790508600・Tier1・acct-2・five_hour・91・85・1）、6 行目 Pressure（1790508000・Tier2・acct-1・seven_day・96・95・1）。log の列が空の字 1 つだけなら Known の空の列、log の列が空なら Unknown、群の宣言の字の無い HostTexts は L1 を渡しても Unknown。閾値の組。C1 は caps の表が fleet.group_pressure_5h_pct に字 70 と改行・fleet.group_pressure_7d_pct に前後に空白の 88・fleet.group_pressure_model_pct に字 soon、C2 は 5h の行に空の字・7d の行に字 -1・model の行に字 300、C3 は seat.move_grace_s の行に字 1800 だけ。組 D は HostTexts が HOST と、caps の表の 5h の行の字 70 だけで、project の字の表が /work/proj-a（state_dir_known は真・events は L1）・/work/proj-b（真・L2）・/work/proj-c（偽・L3）・/work/proj-z（宣言に無い・真・L4）の 4 つ（ほかの欄は ProjectTexts の Default）。doc は猶予の字を無しにして今で撃ち、電文の caps と notices を assemble の値に戻した電文が、同じ入力の accounts・groups・moves・project_rows・session_lines を assemble に渡した値と同じことも見る。契約の字の見本。N_P は Pressure（at 1790508600・group Tier1・account acct-2・window five_hour・used 90・cap 85・sent 1）、N_R は Refused（at 1790509200・group Tier2・account acct-3・reason no-candidate）で、鍵の在りかは encode の字の中で引用符で囲んだ鍵の名とコロンをつないだ字を探して順を見る。GroupNotice の Eq は、Eq の境界を持つ歯の中の関数に値を渡して組めることで見る。fixture は CARGO_MANIFEST_DIR から ../../tests/fixtures/account/acct-doc.json として読む。
      測り方（境界の歯・crates/tsuzuri-boundary の tests/athr.rs）。作業場は CARGO_TARGET_TMPDIR の下に歯ごとに組む（path は実行の時に組む・行 D-4）。引数の state dir は作業場の states の下の state-h で、その host.toml は群 g-a（anchors は作業場の work の下の proj-a と proj-b）と群 g-b（anchors は proj-c）の 2 つの [[account-group]] の塊。偽の git は argv を記録し、-C の次の path の最後の区切りと鍵（argv の 5 つ目）の組で作業場の git の下の file を選んで出す script（file が無ければ rc 1）で、proj-a と proj-b の scribe2.statedir に states の下の state-a の path と改行、proj-c に state-c の path と改行を置く（tsuzuri.boardport は無い）。偽の器は argv を記録の置き場に 1 行ずつ足し、頭が rules なら字 rules- と 3 つ目の argv の名の file、頭が fleet なら file usage を作業場の out の下から出し（slow の下に同じ名の印が在れば 8 秒眠る・file が無ければ rc 1）、ほかの頭は rc 1 で終わる script。bd の program は無い path。作業場 W の out は rules-fleet.group_pressure_5h_pct に字 80 と改行、rules-fleet.group_pressure_7d_pct に前後に空白の 90 と改行、rules-seat.move_grace_s に字 1800 と改行（model の行の file は無い）。state-a の fleet/events.jsonl は 4 行で、11:00 の RunCreated（run r.1-20260927T110000Z・bead r.1・stage Intake）、11:30 の GroupPressureNotified（acct-2・group=g-a window=5h used=90 cap=80 sent=1）、11:40 の GroupMoveRefused（acct-3・group=g-b reason=no-candidate）、11:45 の GroupPressureNotified（acct-1・group=g-z window=7d used=99 cap=90 sent=1・宣言に無い群）。state-c の fleet/events.jsonl は 11:50 の GroupMoveRefused（acct-1・group=g-a reason=no-candidate）の 1 行。作業場の 3 行は Refused（1790509800・g-a・acct-1・no-candidate）・Refused（1790509200・g-b・acct-3・no-candidate）・Pressure（1790508600・g-a・acct-2・five_hour・90・80・1）の順。遅い歯の作業場は W と同じ字に、out の rules-fleet.group_pressure_model_pct に字 95 と改行を足し、slow の下に usage と rules-fleet.group_pressure_5h_pct と rules-fleet.group_pressure_7d_pct の印を置く。閾値の撃ちが 1 段目で並ぶなら読みは 5 秒の上限の 1 回分で返り、2 段目か後に撃てば 10 秒ほどかかり 8 秒を越える。
      filter の語（着地済みの 49 の語と第 3 波の 17 と第 4 波の 4 と第 5 波の 11 と第 6 波の新しい 4 と第 7 波のほかの行の 7・この行の接頭辞 athr_ は並べない・92 語）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・hcard_・qgate_・nsum_・ntime_・ptitle_・ncard_・hsym_・smore_・lcard_・aaround_・hruling_・sxaxis_・plimit_・bport_・fmark_・fstop_・fserve_・nsumw_・cadopt_・tipx_・hcsess_・hcproj_・sesplit_・mstore_・qblock_ で、新しい歯の名から先頭の athr_ を除いた字は、このどれも部分の字として含まない（例 athr_account_x・athr_server_x・athr_stage_x・athr_project_x は不可）。歯の名の例は athr_wire_shape_pinned・athr_caps_copy_rules_rows・athr_notices_copy_events・athr_doc_carries_both・athr_assemble_leaves_unknown・athr_reads_rows_once_first_round・athr_caps_from_vessel_output・athr_notices_from_state_logs・athr_slow_row_is_unknown・athr_own_names_clean。
      ほかの行との重なり。着地済みの h-board-url（t3-hub.53.12・main で確かめた）が同じ契約の account.rs・境界の acct.rs・fixture を書いた後の字に書く（board の欄と port の読みは変えない）。計画の 5 節の順で、この行の後に e-acct-qopen・e-acct-unref・c-acct-spark が同じ file を書く。中核の project.rs を書く行は c-limit-pipe（着地済み）の後の e-acct-qopen・e-acct-unref・c-dormant で、どれも同じ波に無い。同じ波のほかの行（g-card-adopt-a・g-tip-expert・g-seat-split・g-mode-store・h-cards-sess・h-cards-proj・c-q-blocking）の write-set とは重ならない。後の行 h-thr-home は電文の caps と notices と既存の accounts・groups だけを読んで描く。
      依存は足さない。Cargo.toml は触らない（中核は serde_json を既に直に持ち、境界は既存の capture と thread の scope だけを使う）。
  - n: 10
    type: prose
    title: 行 c-q-blocking — 問いの card に止めている task の id の列と数の chip を足す
    body: |
      なぜ。要件 FR6 は、問いの card の順を題・概要・理由・推奨・答えの欄・つながり（畳む）と決める。見本 mock v3（判断の記録 ADR-7 の承認で確定・repo の写しは docs/design/mock3）の問いの card（docs/design/mock3/ask.html の関数 qcard）は、つながりの畳みの見出し（details の中の summary）に、語 つながり の span、関わる所の数の chip、止めている task の数の chip をこの順に並べる。止めている task の chip の字は、class の値 chip num と data-term の値 blocking の span の中に、IC.stop の図を 12 の大きさにした字（関数 sm）、語の辞書の鍵 blocking の語、空白、数（m.blocking.length）を並べた字で、数が 0 でも出す。数の出所は見本の ui.js の関数 material で、問いの節点に入る辺のうち種類 blocks の辺の出どころ（その問いの答えを待つ bead）の列。本番の問いの card には関わる所の chip だけが在り（着地済みの行 g-ask-around・main で確かめた）、電文 QuestionCard に止めている task の列が無い。この行はその列を電文に足し、中核が台帳の字から写し、面が chip を描く。
      在りか（main の commit 4eae248 で確かめ、c-summary-design の着地の後の bf21e14 で読み直した・main 2bc9aa0 までこの行が書く file と読む file は変わっていない〔git diff で確かめた〕）。契約の型の crate の src/question.rs の pub struct QuestionCard（derive は Debug・Clone・PartialEq・Eq・Serialize・Deserialize・pub な欄 id の BeadId・title・posted_at・plain・eng・reason・recommend・a1・touches の String の Vec・digest の順・欄に serde の属性は無い）と pub struct QuestionList（欄 cards の Reading の QuestionCard の Vec）。中核の src/question.rs の pub fn list（台帳の字を受け QuestionList）と pub fn open_questions（台帳の字を受け Reading の OpenQuestion の Vec・graph の build の pub(crate) の fn read_ledger で bead の列を読み、label intake:question を持ち状態が closed でも tombstone でもない bead を private の fn open_question で card にし、作られた時刻の古い順・同じなら id の順）。QuestionCard を struct の字で組む所は中核の open_question の 1 つと、着地済みの歯の契約の型の crate の tests/contract_form.rs（fn question_card と forms の中の t3-hub.8 の見本）と面の tests/batchpanel.rs（fn card）の 3 か所だけ（全部の crate の src と tests を grep で確かめた）。graph の build の module の pub(crate) の struct BdBead は欄 dependencies（Option の Vec の BdDependency）を持ち、BdDependency は欄 depends_on_id の String と dep_type の String（serde の rename で鍵 type）を持ち、ほかの鍵（issue_id・created_at ほか）は読み捨てる。graph の build は bead の依存ごとに bead の id から depends_on_id への辺を依存の種類で組む（種類 blocks は辺の種類 Blocks）。台帳の字は境界が bd の --readonly list --all --limit 0 --json で読んだ字で、bead の依存は鍵 dependencies の配列の object（鍵 issue_id・depends_on_id・type ほか）で出る（この repo の台帳で確かめた・種類は parent-child と blocks ほか）。面の crate の src/project/ask.rs の pub struct Card（derive は Debug・Clone・PartialEq・Eq・pub な欄 number・id・title・a1・posted_at・summary・reason・recommend・touches・digest）と pub fn card（番号と電文の card を受け Card）と、wasm の target のときだけの mod dom の中の Part::Around の腕（details の summary に data-term が段の鍵の span と、class の値 chip num で data-term の値 touches の span〔LINK の図と label の touches と空白と card.touches.len()〕が在り、その後に class の値 nb-body の div）と、見本の図の const（WARN・CLOCK・PERSON・CODE・CHECK・LINK）。面の語の辞書 vocab.json の鍵 blocking は語 止めている task・平易文 この質問の答えを待って止まった task で既に在る。この行が足す名（契約の型の QuestionCard の欄 blocking・中核の BLOCKS_TYPE・面の Card の欄 blocking と ask.rs の const STOP・歯の file の tests/qblock.rs と接頭辞 qblock_）は、この形ではどの crate の src と tests にも無い（grep で確かめた・面の src/project/pipeline.rs に別の図の private の const STOP が在るが、別の module の中で名は重ならない・面の account の home の module の pub const BLOCKS は別の名）。
      形（契約）。QuestionCard の欄 touches の直後に pub blocking（String の Vec・注釈はこの問いの答えを待って止まった task の id の列・台帳の順）を足し、serde の default の属性を付ける（鍵の無い電文の字は空の列に読む・着地済みの fixture の tests/fixtures/surface/question-list.json は鍵を持たず、面の歯の多くがそれを decode するので、default が無いと decode が落ちる）。derive は変えない。電文の鍵の順は id・title・posted_at・plain・eng・reason・recommend・a1・touches・blocking・digest になる。QuestionList は変えない。
