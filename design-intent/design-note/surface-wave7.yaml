n が 測れていない、ledger_state が 台帳の処理状況、j_none が 台帳なし、l_rate が closed/日、runs4 が run の数、waiting_you が あなたの決定待ち、col_wait から col_land が Queued / Blocked・Running / Gated・Questioned / Failed / Stopped・Landed（今日）、st_run が 動いている、st_wait が 待っている、st_limit が 限度で止まっている、seat_match が 今の口座で動いている、seat_mismatch が 移動待ち、seat_none が session なし、move_grace が 退避までの残り、group が project の群、current_account が 今の口座、candidates が 候補と次の移り先、no_record が 記録なし（確かめた・歯は字でなく label の値と比べてもよい）。fixture の値の card はどの 4 行も 36 字以下（確かめた）。DOM の部分と account の board.rs は wasm の target のときだけなので、字の歯は CARGO_MANIFEST_DIR から src/account/projects.rs と src/account/board.rs を読む。projects.rs の字「mod dom {」より後を DOM の部分とし、fn の本体は着地済みの pmore_ の歯と同じ切り方（字 fn と名と開き丸括弧の所から、次の行頭の空白 4 つと fn と空白か空白 4 つと pub fn と空白で始まる行の前まで・無ければ終わりまで）で切る。tag は本体の中で決まった字（<div class=C_NEED・<span class= と引用符で囲んだ mi m-run など）の所から最初の > までとし、空白を除かずに字の在る無しを見る。fnattach_some の字と fnhead_view の字と attach(el,card) は空白（Rust の char の is_whitespace が真の字）を除いた字で見る。DOM の振る舞い（指を置くと card が出る）は host で撃てないので、字の歯と xtask の surface-build で見る。done (8) と (9) の行の前提は、この行の外で board.rs か語の辞書の値が変わったときに落ちる。
