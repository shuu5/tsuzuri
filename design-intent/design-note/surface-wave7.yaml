  - n: 11
    type: prose
    title: 行 e-watch-steady — 変化 1 回に知らせ 1 件を決定的に見る（印の見張りの周の取り方と歯の書き方）
    body: |
      なぜ。第 6 波の行 f-stop の門の run（t3-hub.55.5 の 2026-09-28T00:37Z の run）で、門の側の xtask の check が境界の crate の src/server/events.rs の中の歯 server_read_watch_board_sends_on_marks で落ちた（panic の字は「印 1 回に 2 件」・その run の書く file は events.rs に触れない・同じ歯は同じ run の実装の側の check で約 1 分前に通っていた・門の側の最初の check の段の memory の峰は 4402 MB で機械は重かった）。この歯は板の印の見張り（Hub::watch_board）を 20 ミリ秒ごとに回し、変化 1 回に知らせ 1 件を見る。ところが変化 1 回が見張りから 2 つの状態に見えうる所が 2 つ在る（code を読んで確かめた・落ちた字は 3 つの変化で同じなので、どちらに当たったかは log からは分からない）。(i) 歯の側。a の書き換えと b の作りに使う std::fs::write は、file を開くときに長さ 0 に切り（無ければ長さ 0 で作り）、その後に字を書く 2 段なので、見張りの周がその間に入ると長さ 0 の印と書き終えた印の 2 つを見て 2 件を送る。(ii) 見張りの側。私的な fn board_stamps は board の関数が返した列の path ごとに後から pub fn stamp を取るので、列を取った後で印を取る前に消えた file は、その周では path と None の組で印に残り、次の周で列から消えるので、消し 1 回が 2 周続けての変化になり 2 件を送る。どちらの間も system call の 1 つ 2 つの短い間で、重い機械で thread が止められたときに当たる。tests/server_read.rs の歯 server_read_board_changed_within_5s も変化 1 回に 2 件目が無いことを見て、設計文書を std::fs::write で書き換え、event log に追記で 1 行を足すので、server の見張り（500 ミリ秒ごと）がその間に入れば同じく 2 件になる（20 ミリ秒の歯より起きにくい）。持ち主の裁定 t3-hub.55.7（裁定 id = t3-hub.55.7:20260928T0052Z-1）は案 A で、便 f-stop（t3-hub.55.5）の門を同じ作業場でもう 1 周撃ち（落ちたのは f-stop が触らない着地済みの歯の揺れで、契約の赤ではない・f-stop は撃ち直しで 36ea325 に着地した）、揺れの直しを別の行にした。この行がその直しで、計画 surface-plan（v0.8）の 4 節の行 e-watch-steady（拠る = t3-hub.55.7・門の揺れ〔t3-hub.55.5 の run〕・要件 NFR2・規則の行 R-21）。
      実物の印の書き手（scribe2 の main 24aaa5a の code で確かめた・bd は source がこの機械に無く確かめていない）。器の event log（state dir の fleet/events.jsonl）と席の状態の記録（席の dir の state.jsonl）は器の store の append_line が、file を追記で開き（OpenOptions の create と append）、1 行を writeln で書いて flush する（その場の追記で、移しではない）。合図の最後の判定（席の dir の tick-last）は同じ dir の tick-last.tmp に書いてから rename で置き換える（丸ごとの移し）。台帳の印（.beads の issues.jsonl と interactions.jsonl）は bd が書き、その書き方は確かめていない。設計文書の dir の file は席の道具と git が書く。
      だから見張りを丸めない。本番で 1 回の追記や書き換えが 2 つの印に見えて board-changed が 2 件届いても、面が板を 1 回余分に読み直すだけで、要件 NFR2 と規則の行 R-21 が決めるのは届くまでの遅れ（器の event と台帳の変化は 5 秒以内・合図なしは周期の読み 500 ms ごとで 1.5 秒以内）で、1 回に 1 件の数ではない。見張りの側で丸める（印が落ち着くまで 1 周待つ）と、どの知らせも 1 周（500 ミリ秒）遅れる。この行は (i) を歯の書き方で直し、(ii) を見張りの周の印の取り方で直す。(ii) の直しは丸めではなく、1 つの周の印を board の列と食い違わない形で取る直しで、待ちも遅れも足さない。
      在りか（main 2bc9aa0 で確かめ、6fdc429 で読み直した・その間の e2e23c3 と 62eaf10 と 6fdc429 は design-intent と contracts と docs だけを書き、events.rs は 1a48eca から、tests/server_read.rs は 2bc9aa0 から、tests/hbconf.rs は d29cd52 から変わっていない）。events.rs は server の mod.rs の pub mod events（lib.rs の pub mod server の下・host の code）。pub const POLL（500 ミリ秒）・REREAD（5 秒）・pub struct Timing（pub な欄 poll と reread の Duration）・pub const TIMING・KEEPALIVE（15 秒）・pub fn stamp（&Path を受け、metadata の更新時刻と長さの組の Option を返す・読めなければ None）・pub struct Hub（私的な欄 subscribers と seq・derive は Default）を持つ。Hub の pub fn は start（台帳の Source と board の関数を受け Arc の Hub を返し、watch と watch_board を撃つ）・watch_board（&Arc の Hub と、board の関数（FnMut で PathBuf の Vec を返し Send で static）と、poll の Duration を受け、返りは無い。最初の印を戻る前に取り、thread を立てて poll ごとに board の関数を撃ち直し、印が前と違えば board-changed を 1 件送る。Hub が落ちれば止まる）・watch（台帳の印の file の列と読みの関数と Timing を受け Arc の Hub を返す。印が動いたか REREAD を過ぎたら読み直し、読みの結果が前と違うときだけ ledger-changed を送る）・subscribe（受け手を 1 人足し Receiver の String を返す）・ledger_changed・board_changed。私的な type BoardStamps（path と stamp の組の Vec）と fn board_stamps（path の列を受け BoardStamps を返す）が板の印を作り、私的な fn stamps と struct Watch と fn watch が台帳の見張り、pub fn now と stream が残り。watch_board の doc の注は、board の関数を周ごとに撃ち直し、増えた file と消えた file も印の変化と書く。server の mod.rs の Server の bind_with は Hub::start に、走行の印（state dir の fleet/events.jsonl の 1 つ）・設計文書の印（design-intent の dir の下の全部の file を path の順に並べた列・design.rs の Design の marks）・席の印（席の dir の state.jsonl と tick-last）・acct の印（初めは空・口 /api/account の最初の要求から ACCT_MARKS_EVERY の 60 秒ごとに取り直す）をつないだ列を返す closure を渡す。走行と席と acct の列は file が無くても path を返し、無い path は stamp が None の組で印に入る。events の module を events.rs の外で使うのは server の mod.rs（Hub と stream）と、now を呼ぶ routes の file・ruling.rs・hook の stop.rs と歯 fserve で、この行はそのどれの形も変えない。
      在りか（tests/server_read.rs・main 2bc9aa0）。歯ごとの作業場の struct Place（欄 root・repo・files・state ほか）を fn new（名と偽の設計の道具の振る舞いと event log の置き方を受ける）が CARGO_TARGET_TMPDIR の下の server_read の dir の下に作り、repo の design-intent の dir に rules.yaml と adr/ADR-7.yaml（字 id と ADR-7 の 1 行）を、state dir の fleet/events.jsonl に着地済みの fixture の tests/fixtures/graph/real/events.jsonl の写しを置く。fn events_log が event log の path を、fn config（server の Config を組む・Config::new と ..Config::new の形）と fn serve が server を、fn subscribe と fn read_until と fn board_events が SSE の読みを持つ。歯 server_read_board_changed_within_5s は Place の名 sse で、1 つ目の変化で event log を OpenOptions の追記で開いて RunCost の 1 行を write_all で足し、2 つ目の変化で adr/ADR-7.yaml を std::fs::write で 2 行の字に書き換える。file の頭の use は std::fs と OpenOptions を並べ、OpenOptions を使うのはこの歯の 1 か所だけ（確かめた）。
      形（見張り・events.rs）。1 つの周の印では、stamp が None の path は、同じ周のうちに board の関数をもう 1 度撃った列にもその path が在るときだけ path と None の組で残し、無ければ落とす。例として、board_stamps を board の関数ごと受ける形にし、列を取り stamp を取った後に None が 1 つでも在れば board の関数を撃ち直して、その列に無い None の path を落とす（None の無い周は今と同じく 1 度だけ撃つ・BoardStamps の型は変えなくてよい）。こうすると、周の途中で消えて次の列にも無い file は、その周で既に列に無いものとして扱われ、消し 1 回は 1 周の変化になる。列に載ったまま無い path（走行・席・acct の列の無い file）は今までどおり path と None の組で印に残るので、無い path が列に増える・無い file ができる・在る file が消える・無い path が列から減る、はどれも今と同じく 1 件を送る（口 /api/account の後の acct の列の増えも、無い file だけの増えを含めて今と同じく板の変化）。撃ち直しの形は決めない（列を取り、印を取ってから列を取り直し、一致するまで取る形なども可）が、None の path を残すか落とすかは、その None の印を取った後に撃った列で決める（印を取る前に列を 2 度取って比べるだけの形は、2 度目の列の後で印を取る前に消えた file を None で残し、次の周でもう 1 件を送るので (ii) を直さない）。1 つの周（最初の印の取りも 1 つの周と数える）で board の関数を撃つのは 4 回までにする（新しい歯が呼びの回で周の進みを数えるため）。最初の印を戻る前に取ること・Hub が落ちれば止まること・POLL・TIMING・KEEPALIVE・stamp・watch_board の引数と返り・start・watch・subscribe・send・now・stream は変えない。watch_board の doc の注に周の途中で消えた file の扱いを足してよい（字の歯は無い）。server の board の関数は file の列を組むだけで子 process を撃たない（設計文書の列は dir を歩く）ので、None の在る周に増える呼びは軽い。
      形（着地済みの歯・events.rs の tests の mod）。印の file の中身を丸ごと替える私的な fn（名は問わない・例 put）を、fn marks と fn reader と同じ所（最初の test の属性の行より前）に足す。形は、印の dir と同じ親（std::env::temp_dir）の下で印の dir の外の、歯ごとに別の dir（例 印の dir の名に字を足した隣の dir）に字を std::fs::write で書き、std::fs::rename で印の path へ移す。同じ file system の中の rename は、見張りから前の file か書き終えた file のどちらかにしか見えない。印の dir の外に置くのは、歯 server_read_watch_board_sends_on_marks の board の関数が印の dir の中の全部の file を並べるからで、中に書きかけの file を置くとそれも印に入る。server_src_watch_marks_trigger_reread の std::fs::write の 2 つ（b に字 x・a に字 22）と、server_read_watch_board_sends_on_marks の 3 つの変化の閉包のうち a に字 22 と b に字 x を書く 2 つを、この fn に替える。b を消す std::fs::remove_file と fn marks（見張りの前に a に字 1 を書く）と、2 つの歯の眠り（2 件目を見ない 100 ミリ秒と 200 ミリ秒・最初の 100 ミリ秒と 200 ミリ秒）と数の期待と panic の字は変えない。変えるのは知らせか読みを待つ上限の 2 つだけで、届けばすぐ次へ進むので、通る時の速さは変わらない。(a) 2 つの歯の受けの recv_timeout の 1 秒を 5 秒にする（2 か所）。(b) server_src_watch_marks_trigger_reread の a の書き換えの後は、今の 200 ミリ秒の眠りの後に読み 3 回を確かめる形をやめ、読みの数が 3 に届くまで短く眠って待ち（5 秒で届かなければ落ちる）、届いた後に 200 ミリ秒を眠ってから、読みが 3 回のままで知らせが無いことを見る。今の 1 秒と 200 ミリ秒は、重い機械で見張りの thread が止められると正しい実装でも落ちうる（揺れた門の機械は重かった・遅い CI では順を見る 2 つの出来事の間に 2 秒以上の余りを置く）。2 件目を見ない眠りは短くても正しい実装を落とさない。替えた印はどれも前と長さが違うか前に無かった file なので、stamp（更新時刻と長さ）は必ず動く。移しの dir は歯の終わりに印の dir と一緒に消してよい。
      形（着地済みの歯・tests/server_read.rs）。同じ形の私的な fn（名は問わない）を歯の本文の外（例 fn board_events の隣）に足し、字を Place の root の直下（repo と files と state dir の外・同じ file system）の file に書いてから std::fs::rename で目の path へ移す。server_read_board_changed_within_5s の 1 つ目の変化は、event log の今の字に今と同じ RunCost の 1 行を足した字をこの fn で event log の path へ移し、2 つ目の変化は今と同じ 2 行の字をこの fn で adr/ADR-7.yaml へ移す。file の頭の use から使わなくなる OpenOptions を外す。待ちの長さ・件の数の期待・panic の字・ほかの歯と Place と fn config は変えない。event log の中身は今と同じ字になり（追記を移しに替えただけ）、server の見張りから見た変化はどちらも 1 回の印の動き。
      形（新しい歯・tests/wsteady.rs）。作業場は CARGO_TARGET_TMPDIR の下に歯ごとに作る（名に process の id と時刻を入れる）。印の file の中身は、作業場の外の隣の dir に書いて std::fs::rename で移す私的な fn（events.rs の tests の mod の fn と同じ形・この file の中に置く）で置き、見張らせる歯の本文の中では file の中身を書く字を使わない。使うのは tsuzuri_boundary の server の events の Hub（Default で作り、subscribe と watch_board を呼ぶ・どれも pub）だけ。受け手は watch_board の前に足す（見張りの thread が変化を送る時に受け手が既に在る）。呼びの回は board の関数の中で AtomicUsize に足して数え、回が目の値に届くまで短く眠って待ち、5 秒で届かなければ落ちる（私的な fn・名は問わない）。届いた後は try_recv で受けた件数を数える。見張りの間隔はどちらも 20 ミリ秒。wsteady_vanished_path_one_event は done (1) の形で、a と b を移しの fn で置いてから見張らせ、6 回目の呼びの中で std::fs::remove_file で b を消す。1 つの周の呼びが 4 回までなら、最初の印の取りは 4 回目までに済み、b を消した周とその次の周の送りは呼びが 14 回に届く前に済む。今の board_stamps のままならこの歯は 2 件を受けて落ちる（(ii) の揺れを必ず起こす形）。wsteady_absent_listed_path_changes は done (2) の形で、列は Arc と Mutex で包んだ PathBuf の Vec を歯が替え、board の関数はその写しを返す。a は見張りの前に移しの fn で置き、p は見張りの中で移しの fn で作る。4 つの変化のそれぞれは、変化を済ませてから呼びの回を読み（読んだ後の呼びはどれも変化の後）、そこから 13 回進むのを待つ（変化の前に読むと、変化までの間に見張りが進んだ分だけ待ちが短くなる）。1 つの周の呼びが 4 回までなら、読んだ後の最初の呼びを含む周かその次の周が変化を拾い、拾った周とその次の周の送りは 13 回目の呼びの前に済む。この歯は今の code でも通り、無い path を印から一律に落とす直し（列の増えを見失う）を落とす。wsteady_marks_change_whole は境界の crate の置き場（CARGO_MANIFEST_DIR）から src/server/events.rs・tests/server_read.rs・tests/wsteady.rs の字を読み、done (6) の 4 つの本文の範囲にどの字も無いことを見る（範囲の見つけ方は done (6) のとおり。3 つの file の test の fn の並びは今の順のままで、server_read_board_changed_within_5s の範囲には後に続く fn tree と const ROUTES が入り、どちらもその字を持たない・移しの fn と待ちの fn と、この歯が探す 4 つの針の字は 4 つの範囲の外に置く）。events.rs と tests/server_read.rs が字 fs::rename( を含むことも見る（移しの fn が在る印・どちらの file も今は含まない）。wsteady_own_names_clean は着地済みの歯 brand_own_names_clean と同じ形で、前後の空白を除くと test の属性だけになる行の次の行の fn の名を集め（4 つ以上）、どれも wsteady_ で始まり、残りの字が下の filter の語を含まないことを見る。
      着地済みの歯（直すもの）。events.rs の中の server_src_watch_marks_trigger_reread と server_read_watch_board_sends_on_marks、tests/server_read.rs の server_read_board_changed_within_5s（上の形・名と数の期待は変えず、events.rs の 2 つは待ちの上限だけを延ばす）。着地済みの行の verify の語 server_src_ と server_read_ は境界の crate を --test なしで撃つので、この 3 つの歯を今も撃つ。hbconf の歯は server の mod.rs と config.rs と main.rs の字と、Config を struct の字で組む 9 つの歯の file（server_read.rs を含む）の fn config の字（Config::new と ..Config::new）を読む。この行は server_read.rs の fn config を変えない。hbconf.rs は置き場だけの = で write-set に置き、verify で撃つ。新しい tests/wsteady.rs は Config を組まず fn config を持たないので 9 つに入らない。
      着地済みの歯（直さずに通るもの）。events.rs の server_src_watch_rereads_without_marks と server_min_hub_sends_to_each_subscriber は印を書き換えず、watch と send を見る（この行は変えない）。server_read.rs のほかの歯（4 つの口と中核の比べ・folio の引数と cwd・event log の無い state dir・folio の失敗・口が書かないこと・405・tz の引数）は歯ごとに別の Place を使い、この行の fn と use の直しに触れない。印を書き換えて SSE の知らせを待つほかの server の歯は、列に載ったままの path（走行・席・acct の列）か設計文書の dir の file を書く。直した見張りが印から落とすのは周の途中で列から消えた path だけなので、これらの知らせの有無は変わらない。server_seat_state_files_send_board_changed（tests/server_seat.rs）は state.jsonl と tick-last を std::fs::write で書き換えて 5 秒以内の 1 件以上を待つ。acctwire_marks_send_board_changed（tests/server_acctwire.rs）は口 /api/account の前は acct の列が空で知らせの無いこと、口の後の一覧の取り直し（列の増え）と 4 つの印の file への改行の追記で 1 件以上を待つ。この 2 つは 1 件以上を待つだけで、2 件目が届いても落ちない（2 件目が次の待ちを先に満たしうるのは今と同じ・この行は直さない）。server_src_marks_change_within_1500ms と server_src_rereads_every_5s_without_marks（tests/server_src.rs）と server_min の SSE の歯は台帳の見張り（watch・読みの結果が前と同じなら知らせない）を見て、この行は watch を変えない。brand_path_written_once_in_contract は 3 つの crate の src の引用符で囲んだ /api/project の字を数え、この行は src にその字を足さない（events.rs の /api/surface/events は doc の注の中）。hbproc・hbroute・fserve が字を読む src の file（ledger.rs・proc.rs・clock.rs・mod.rs・routes の dir・ruling.rs・batch.rs）をこの行は書かない。
      測り方。新しい歯は境界の crate の tests/wsteady.rs に置き、名を wsteady_ で始める。events.rs の 2 つの歯は src の中の歯なので --lib で撃ち、server_read の歯は --test で撃つ。xtask の check が全部を撃つ。接頭辞 wsteady_ は字 steady_ を含むが、着地済みの verify の語 steady_ は面の crate（tsuzuri-surface）だけを撃つので、境界の crate の歯には当たらない。境界の crate を --test なしで撃つ着地済みの語（account_・acctwire_・hook_・server_ とその下の語・stage_・tz_）は、新しい歯の名のどこにも無い。
