sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      project board と account board を見本 mock v3 に近づける第 7 波。
      project board では、流れの札と次の一手に節点の札（hover の札）を採り（g-card-adopt-a）、抜けの検査と束の頁に玄人の見方だけの注釈を足し（g-tip-expert）、席の欄の DOM を project_dom へ分け（g-seat-split）、見方（mode）をその browser に便宜の写しとして保存する（g-mode-store・URL の mode が勝つ）。
      account board では、project の札と session の札に hover の札を付ける（h-cards-proj・h-cards-sess）。
      中核と境界では、口座の圧の器の rules の行と event を判じずに写し（c-acct-thr）、問いの札に止めている物を足す（c-q-blocking）。
      あわせて、門の揺れ（t3-hub.55.5 の run・裁定 t3-hub.55.7:20260928T0052Z-1）の元の、見張りの 1 回の変化が 2 件に見える歯の書き方と見張りの側の窓を直す（e-watch-steady）。
      外の依存は足さない（g-mode-store は web-sys の feature を足すだけで package は増えない）。どの行も計画 surface-plan の 4 節の行と同じ file と依存を持つ。
