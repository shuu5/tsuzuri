      測り方。新しい歯は tests/cadopt.rs に置き、名を cadopt_ で始める。歯は fixture の字を CARGO_MANIFEST_DIR から ../../tests/fixtures/surface/ の下の pipeline-board.json と graph-doc.json と next-step.json として読み、wire の decode で PipelineBoard と GraphDoc と組の名から NextStep の map にする（着地済みの pipe_ と ncard_ と nextstep_ と同じ読み）。札を替えた板は、decode した札の contract に BeadId の値を、reason に節の長い理由の字を代入して作り、kcard には空の台帳の行を渡す。Big は next の big に NextMove と、歯の中で struct の字で組んだ NextCheck を渡して作るか、fixture の組を content に渡した値から取る。グラフの口の読みは Fetched の Body に fixture の電文の字を入れた値、NotRead、Failed、字 {} の Body の 4 つを使う。card_of・node_hover・with_nodes・columns・kcard・big_title・mapview の graph の cut・hover の clip は host で呼ぶ。cadopt_dom_wiring は CARGO_MANIFEST_DIR から src/project/pipeline.rs と src/project/next.rs の字を読み、字 mod dom { より後を DOM の部分として done (5) の字を探す。DOM が組めることは xtask の surface-build で見る。自分の名の歯は tests/cadopt.rs の字を読み、test の属性の行の次の fn の名を全部集め（着地済みの ncard_names_stay_apart と同じ読み方）、名の数が 6 以上であることと done (7) を見る。fixture は足さない。
