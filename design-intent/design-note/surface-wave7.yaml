      依存は足さない。depends は空。第 6 波の 5 行は main に着地した（f-stop は 36ea325・c-summary-wire は 2bc9aa0 で確かめた）。書く file（境界の server の events.rs・歯の server_read.rs と新しい wsteady.rs・置き場だけの hbconf.rs）を書く第 7 波の行は無い（第 7 波の境界の行 c-acct-thr は acct.rs と歯の server_acct.rs と新しい athr.rs を書く・main 6fdc429 のノート surface-wave7 の 8 行の write-set で確かめた）。計画の 4 節の後の行 e-signal（f-gate の後）も events.rs を書くので、この行を先に流す（計画 5 節）。tests/server_read.rs を書く行はこの行だけ（計画 v0.8 の 5 節・第 8 波の c-next-stall は書かない）。外の依存は足さず Cargo.toml は触らない（std だけを使う）。

