  - n: 3
    type: prose
    title: 行 g-card-adopt-a — pipeline の札と次の一手の大きい箱の質問の題の節点の card
    body: |
      なぜ。要件 FR14 は hover の card を 4 行（1 行 36 字）と「詳しく」と決め、card を出す要素を頁を持つ節点の札・圧縮された cell・記号だけの要素の 3 種に限る。見本（docs/design/mock3 の ui.js の kcardHTML）は、pipeline の札の a の要素（class kcard）に data-key（契約 bead の id）と data-run（走行の id）を付け、ui.js の cardContent は data-run の枝で、題の行と種類と帯と状態の行を契約 bead の節点の値から組み、値の行を走行の回数と段と理由の短い字（回数の印と回数・段の名・理由を 20 字に切った字を「 · 」でつないだ字・ui.js の cut は 20 字を越えれば 19 字と「…」）に、出所の行を走行の出所にし、理由が 20 字を越えれば理由を ui.js の chunk で 34 字以下の行に折って詳しくに置く（chunk は字を、と。と・と，と全角の閉じ丸括弧の後で片に分けて前から詰め、34 字を越える片は 34 字ずつに切る）。見本の次の一手の大きい箱（index.html の nextItems と nextHTML）は、種類が質問（nx_e）のとき中身を問いの題（ui.js の t36 で 36 字に切った字）だけの a の要素（class nl・data-key に問いの id・件数の字は無い）にし、同じ cardContent の節点の枝が card を出す。ほかの種類の箱の中身は字だけで、節点の link も card も無い。本番の pipeline の札（src/project/pipeline.rs）は着地済みの行 g-pipe の走行の card（題・run と段の名・回数と口座と経過・出所）を付け、節点の種類と帯と状態を出さない。本番の次の一手の大きい箱（src/project/next.rs）の中身は字だけで、対象の id に card も link も無い。着地済みの行 g-card-node（main で確かめた）は、電文の節点 1 つから card を組む共有の関数を widgets の nodecard に置き、後の行が同じ id と電文から同じ card を引けるようにした。この行はその card_of を使い、pipeline の札の card を節点の card に替え（値の行は走行の回数と段と 20 字に切った理由・長い理由は詳しく）、次の一手の質問の大きい箱の中身を、問いの題の字の節点の頁への link にして節点の card を付ける。
      在りか（main 0bc6f45 で確かめた・起草の b525a13 から面の src と style.css と vocab.json と tests/fixtures/surface は変わっていない）。src/project/pipeline.rs（write-set・着地済みの行 g-pipe と g-link-kcard と g-pipe-today が書いた・build.rs が生成する crate::project::pipeline）の host の部分は、pub const BLOCK（id pipe・heading pipeline・class panel）・PATH（字 /api/pipeline）・PATHS・FOLDS・REASON・UNKNOWN_REASON・RUN_KEY（字 run）・SHOW（3）・QUERY_KEY・SOURCE（字 fleet/events.jsonl）・NO_AGE と NO_ACCOUNT（どちらも字 ―）、pub struct Lane と pub const LANES（4 列）と pub fn lane、Lane の pub fn stops（列が Questioned と Failed と Stopped の列なら真）、pub enum Lead（Runs の u32・Why の String）、pub struct Kcard（pub な欄 id の String・title の Option の String・state の Option の &'static str・lead の Lead・age の String・class の &'static str・hover の widgets の hover の Card・derive は Debug・Clone・PartialEq・Eq）、pub struct Column（pub な欄 lane・class・cards の Kcard の Vec・derive は同じ）、pub fn age（u64 の秒を受け String・60 秒未満は s・60 分未満は m・24 時間未満は h・ほかは d）、pub fn cards と body と landed_today、pub fn content（板の口の読みの Fetched の参照と台帳の一覧の口の読みの Fetched の参照と今の EpochSecs を受け、kit の Body の Column の Vec を返す）、pub fn title_of・pub fn columns（契約の PipelineCard の slice と LedgerRow の slice と今の時刻を受け Column の Vec）・pub fn kcard（PipelineCard の参照と LedgerRow の slice を受け Kcard）・card_href・open_columns・with_open。kcard は段の名を Stage の Debug の字で作り（file に字 Stage と 2 つのコロンの並びを持たない）、止まった列の札の lead を段の理由（無ければ段の名）にし、hover を title（台帳の題を 36 字に切った字・引けなければ id）・kind（字 run と「 · 」と段の名）・value（↻ と回数と「 · 」と口座（無ければ NO_ACCOUNT）と「 · 」と age の字）・src（SOURCE）・more（空）の Card で組む。Kcard を組むのは kcard だけで、Kcard と Column を struct の字で組む歯は無い（src と tests を grep で確かめた）。wasm の target のときだけの mod dom（字 mod dom { は file に 1 度）の view は、口 PATH と台帳の一覧の口（project の ledger の PATH）を crate::net::read で読み、body の closure の中で pipe.with(|p| rows.with(|l| content(p, l, now))) の値を match して、Filled の列を board_view に渡す。kcard_view は札を <a class=card.class href=card_href(card, mode) use:attach=card.hover.clone()> で描く（mod dom の use に crate::widgets::hover::attach が在る）。
      src/project/next.rs（write-set・着地済みの行 g-next と g-next-act が書いた・crate::project::next）の host の部分は、BLOCK（id next）・PATH（字 /api/next）・PATHS・FOLDS・REASON・KEYS（7 種と語の鍵の表）・MISS・NONE_LINE・PIPE_LINK ほかの link の字・key・Mark・pub struct Row・Link・pub struct Big（pub な欄 kind の契約の NextMove・key と class と what_class の &'static str・what の String・link の Option の Link・target の Option の String・derive は Debug・Clone・PartialEq・Eq）・pub struct Next（big と rest）・step・body・pub fn content（Fetched の参照を受け Body の Next）・next・row・pub fn big（NextMove と契約の NextCheck の参照の Option を受け Big）・action・window_of。big の what は、なしで NONE_LINE、止まっている走行で件数の字（字 2 件 の形）、ほかの種類で対象が在れば対象の id と「 · 」と件数の字（字 nq.4 · 1 件 の形）、無ければ件数の字で、target は対象の id の字。Big と Next を組むのは big と next だけで、struct の字で組む歯は無い（grep で確かめた）。mod dom の view は口 PATH を読み、Filled の Next を next_view に、next_view が Big を big_view に渡し、big_view は中身を <div class=big.what_class>{big.what}</div> で字のまま描く。mode の closure は context の HelpCtx か URL の query から今の mode を読む（着地済みの歯 nxact_src_uses_action が字を見る）。Big の kind は契約の NextMove（Question・StalledRun・AwaitingEffect・Nothing ほかの 7 つ）。
      使う物（この行は書かない・確かめた）。widgets の nodecard（src/widgets/nodecard.rs・着地済みの行 g-card-node・host でも組む・置き場だけの =）の pub fn card_of（契約の GraphDoc の参照と id の &str を受け Option の Card）は、電文の nodes を前から見て id の同じ最初の節点の node_card の値、無ければ None を返す。node_card の Card は、title が節点の title の空白を畳んだ字（空なら id）、kind が種類の語と「 · 」と帯の名と「 · 」と状態の字（無ければ 状態なし）、value が id と空白と 要約なし、src が節点の file（無ければ帯の path）を短くした字、more が短くしたときだけ元の字 1 つ。widgets の hover（src/widgets/hover.rs・置き場だけの =・host でも組む）の pub struct Card（pub な欄 title・kind・value・src の String と more の String の Vec・derive は Debug・Clone・PartialEq・Eq・Default）と Card の pub fn rows（4 行を 36 字に切る）、wasm の target のときだけの pub fn attach（web_sys の Element と Card を受け、返りは無し・要素に指を置くと頁に 1 つの card の層に card を出す・要素の tag に use:attach と等号と Card の値を書く directive の形で使う）。名 Card の宣言は面の src に 2 つ（widgets の hover と project の ask の問いの card）あり、この行が使うのは hover の Card。project の map（src/project/map.rs・置き場だけの =・crate::project::map・host でも組む）の pub const PATH（字 /api/graph）と pub fn doc（Fetched の参照を受け、Result の GraphDoc と &'static str の理由を返す・NotRead に NOT_READ・Failed に map の REASON・GraphDoc として読めない本文に NO_CONTENT）。名 doc の宣言は map のほか account の mod.rs と mapview の graph.rs（どれも pub）と gaps.rs（私的）にも在り、この行が使うのは map の doc。mapview の graph（src/mapview/graph.rs・置き場だけの =・host でも組む・mapview の mod.rs の pub mod graph は target の cfg で囲まない）の pub fn cut（&str と usize の n を受け String・字を Unicode の scalar で数え、n 字を越えれば先頭の n − 1 字と「…」、越えなければそのままの字・見本の ui.js の cut と同じ）。名 cut の宣言は gaps.rs にも在り（id の列を切る別の関数）、この行が使うのは mapview の graph の cut。widgets の hover の pub fn clip（&str を受け String・36 字を越えれば 35 字と「…」・見本の t36 と同じ切り方）。frame の pub fn node_href（id の &str と frame の Mode を受け String・節点の頁の href・host でも組む）。通信（src/net.rs・wasm の target のときだけ）の pub fn read（&'static str の path を受け ReadSignal の Fetched）は同じ path の読みを 1 つの signal で分け、口を頁で 1 度だけ読む（抜けの検査の頁の gaps と問いの頁の askpage の DOM も map の PATH を読む）。project board の頁の枠（src/board.rs・この行は書かない）は provide_context(HoverCtx::default()) と <CardLayer/> を持ち（着地済みの歯 ncard_dom_wiring がこの字を見る）、pipeline と next の block はこの枠の中で組まれるので、attach を付ければ card は出る。
      契約の型（この行は書かない）。PipelineCard（pub な欄 contract の BeadId・runs の u32・stage の Stage・reason と account の Option の String・elapsed_s の Option の u64）、Stage（Queued・Blocked・Running・Gated・Questioned・Failed・Stopped・Landed の 8 つ）と Stage の column、NextCheck（pub な欄 kind・result・count の u32・target の Option の BeadId）、GraphDoc と GraphNode は wire の decode で fixture の字から読む。着地済みの第 6 波の行 c-summary-design（main 0bc6f45 で確かめた）は GraphNode に欄 line・plain・eng（どれも serde の default を持つ Option）を足し、fixture の graph-doc.json はこの 3 つの欄を持たずに今のまま読める。この行の src と歯は GraphNode を struct の字で組まない（歯は PipelineCard と NextCheck を struct の字で組むか fixture の値の欄に代入する・この 2 つの型の欄を足す行は第 6 波と第 7 波に無い）。
      足す名（run_line・run_more・node_hover・with_nodes・BigTitle・big_title）は、main の面の src と tests のどこにも宣言が無い（grep で確かめた）。
      fixture の値（tests/fixtures/surface の下・この行は触らない・確かめた）。pipeline-board.json の札は 12 枚で、歯が使うのは px.2（runs 2・stage Blocked・reason 無し・経過 45 秒）・px.3（runs 1・Running・reason 無し・口座 acct-4・経過 7200 秒）・px.5（runs 2・Questioned・reason about:write-set・口座 acct-4・経過 3600 秒）・px.6（runs 1・Failed・reason verify が赤・経過 86400 秒）・px.7（runs 4・Stopped・reason 無し・経過 60 秒）・px.11（runs 1・Landed・経過 無し）。graph-doc.json の節点は 34 で、歯が使うのは t3-hub.9（種類 task・title 作業中の契約・beads の属性の status in_progress）・t3-hub.15（task・title 地図の頁の中身を置く・status open）・t3.q10（question・title 開いた問い・status open）。電文に px で始まる id の節点と nq.4 と nx.7 は無い。節の長い理由（歯の中の字・fixture には無い）は、L1 が x の 30 字と「、」と y の 10 字をつないだ 41 字（run_more は x の 30 字と「、」の行と y の 10 字の行の 2 行・34 字ずつに切るだけの誤った折り方なら 1 行目が x の 30 字と「、」と y の 3 字になる）、L2 が z の 40 字（句切りの字が無い・run_more は z の 34 字と z の 6 字の 2 行・run_line の末尾は z の 19 字と「…」）。next-step.json は 4 組（not-judged・nothing・question・stalled）で、question の組の lead は question・target nq.4・count 1、nothing の組の lead は nothing。
      形（host の部分・pipeline.rs）。Kcard に pub な欄 run_line（String・見本の cardContent の data-run の枝の値の行）と run_more（String の Vec・同じ枝の詳しく）を足す（欄の順は問わない）。kcard は、札の段の理由（PipelineCard の reason）が在ればその字、無ければ段の名（hover の kind と同じ Debug の字）を理由の字にする（止まった列の札の Lead の Why と同じ決め方を全部の列に使う）。run_line は、字 ↻ と card の runs と「 · 」と段の名と「 · 」と、理由の字を mapview の graph の cut に 20 と渡した字をつないだ字。run_more は、理由の字が 20 字（Unicode の scalar）を越えれば、見本の chunk と同じ決まりで理由の字を 34 字以下の行に折った列（字を、と。と・と，と全角の閉じ丸括弧のどれかの直後で片に分け、前から片を足して 34 字以下なら同じ行に詰め、越えれば今の行を出して新しい行を始め、1 つの片が 34 字を越えれば 34 字ずつの行を出して残りを次の行の頭にする）、越えなければ空。折る関数の名と置き場（pipeline.rs の中・pub か私的か）は問わない。見本の reasonShort の段ごとの言い回し（runner の質問で止まっている・本線に取り込んだ ほか）は、見本が走行の段の履歴（Stopped の前の Questioned の理由・審査と検査の判定）から組む判じで、電文の PipelineCard は段と理由の欄しか持たないので、この行は電文の理由か段の名をそのまま出す（作法 7・面に判定を書かせない）。Kcard の hover とほかの欄の値は変えない（着地済みの歯 pipe_hover_card_rows が hover の 4 行を見る）。pub fn node_hover（契約の GraphDoc の参照と Kcard の参照を受け Card）は、card_of に電文と札の id を渡し、Some の card なら title と kind をその card の title と kind に、value を札の run_line に、src を札の hover の src（SOURCE）に、more を札の run_more にした Card、None なら札の hover の写しを返す（見本と同じく、題と種類と帯と状態は節点から、値と出所と詳しくは走行から取る）。pub fn with_nodes（kit の Body の Column の Vec とグラフの口の読みの Fetched の参照を受け、同じ型の Body）は、Filled で map の doc が Ok の GraphDoc を返せば、全部の列の全部の札の hover を node_hover の値に置き替え（列と札の数と順とほかの欄は変えない）、doc が Err なら受けた値のまま、Unmeasured と Empty も受けた値のまま返す（グラフの口が読めない間は今の走行の card を出す）。
      形（host の部分・next.rs）。pub struct BigTitle（pub な欄 id の String・text の String・card の Card・derive は Debug・Clone・PartialEq・Eq）と pub fn big_title（Big の参照とグラフの口の読みの Fetched の参照を受け Option の BigTitle）。big_title は、Big の kind が NextMove の Question で、Big の target が Some の id で、map の doc が Ok で、card_of がその id で Some のときだけ Some を返し、id は target の字、text はその card の title（節点の題の空白を畳んだ字・空なら id）を hover の clip に渡した字、card はその card。質問のほかの種類（止まっている走行・なし・発効待ちほか）は None（見本も質問の箱だけが節点の link で、ほかは字だけ）。見本の題の字は問いの字の属性（無ければ題）だが、電文の節点が持つのは題だけなので、節点の題を出す。Big の欄と what と target の値は変えない（着地済みの歯 nextstep_big_matches_each_fixture_set と nxact_big_carries_target が what と target を見る）。
      形（DOM・mod dom の中・字は次のとおりに決め、歯 cadopt_dom_wiring がこの字で見る）。pipeline の view は、グラフの口を crate::net::read に map の PATH を渡して読み（字 map::PATH を書く）、match する式を pipe.with(|p| rows.with(|l| graph.with(|g| with_nodes(content(p, l, now), g)))) の形にする（読みの signal の名は graph・closure の引数の名は g。着地済みの歯 pipe_view_passes_net_now が見る字 content(p, l, now) はこの中に残る）。kcard_view の a の開きの tag（<a class=card.class href=card_href(card, mode) use:attach=card.hover.clone()>）は変えない（札の hover は with_nodes が替えた値・着地済みの歯 klink_dom_anchor_keeps_hover がこの字を見る）。next の view は同じくグラフの口を読み（字 map::PATH を書く）、Filled の腕で let title = graph.with(|g| big_title(&next.big, g)); の値を next_view に渡し、next_view がそれを big_view に渡す。big_view は title が Some(t) なら、let id = t.id.clone(); と let href = move || node_href(&id, mode()); の後に、中身の div（class は big.what_class のまま）の中を <a href=href use:attach=t.card>{t.text}</a> だけにし（見本の nx_e の箱と同じく件数の字を添えない）、None なら今のとおり {big.what} を描く。Big の what の値は変えない（字を描かないだけ）。mod dom の use に要る名（crate::widgets::hover::attach・crate::frame::node_href・crate::project::map・super の with_nodes と BigTitle と big_title）は書き方を問わない。新しい class と語の鍵と引用符で囲んだ /api/ の字は足さない。
      出さない物。見本の card の経験者向けの行（種類の内部の名と要約の出所）、要約と要約を折った詳しくの行（後の行 g-summary）、見本の reasonShort の段ごとの言い回し（上の 形）、質問のほかの種類の大きい箱と次の一手の一覧の行の card（見本も持たない）、問いの card と問いの頁と台帳と抜けの頁の節点の card（後の行 g-card-adopt-b と g-card-adopt-c）、問いと札と次の一手の経過の毎秒の書き直し（後の行 g-tick-adopt）。card の層の出し方（pointer の入りと出・猶予）は hover.rs のまま変えない。
      グラフの口の読み。この行で HOME の頁の pipeline と次の一手の block がグラフの口 /api/graph を読む（境界の server の口は着地済みの src/server/routes/graph.rs で、地図の頁と抜けの検査の頁と問いの頁が既に読む）。net の read は同じ path を 1 つの signal で分けるので、2 つの block で口を読むのは頁に 1 度で、変化の知らせの合図で読み直す。口が読めない・まだ読んでいない間と、問いの節点が電文に無いときは、札は今の走行の card を出し、大きい箱は今のとおり Big の what の字だけを出す（見本も節点が引けなければ card を出さない）。
      着地済みの歯（直すもの）。無い。
