      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。(1) は verify の 1 行目、(2) は 2 行目の clippy、(3)(4) は 3 行目の歯 bvmcomp、(5) と (6) は 4〜9 行目の面の歯 6 file（(5) は tests/mapview.rs の行）、(7) は surface-build の行、(8) は check の行で測る。

      構造の連鎖。圧縮の面と一覧の面を引く src は、表の面の DOM（pair_value と with_pair）と節点の card（NO_GIST と NO_STATE）だけなので、2 か所へ移せば残りは組み立てが通る。名の照らしで当たった widgets/help.rs の note_of は語の辞書の項から注釈を組む別の関数で、project/ask.rs の tag は局所の変数で、どちらも圧縮の面を引かない（試作で消して組み立てが通ることを見た）。表の面の with_pair が書く pair の値を読む面は一覧の面と一緒に無くなるが、表の面は行 m-map-tree で消すので、その時まで字を変えずに持つ。

