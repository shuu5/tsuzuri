  - n: 3
    type: prose
    title: 行 m-map-page — 地図の頁と地図の block と 6 面の切り替えを消す
    body: |
      在りか。差の file docs/design/patch/m-map-page.patch は、main ef01b1fc を起点に、起草 w63a の試作の commit 180cc9ba との差を write-set の書く file 30 だけで切った（git diff --no-color --full-index・70,865 byte）。main ef01b1fc の木で git apply --check が rc 0、試作の木で git apply --reverse --check が rc 0 を見た。

      なぜ。判断の記録 ADR-27 の決定 (1)(2) は project board の地図の tab（6 面）を消し、要件 FR5 は地図の頁を持たない。地図を消す鎖（m-map-page・m-map-compact・m-map-tree・m-map-graph）の頭として、頁と block と面の切り替えを先に消し、面の file は続く行で消す。受入の sweep（要件 NFR1・規則の行 R-23）は面の画面の一覧を持つので、頁を消す行が一覧も直す（直さないと page=map の 6 つの URL が home に落ち、home を 7 度数える）。

      形。(a) src/pages/map.rs と src/project/map.rs を消す。頁と block の列は組み立ての script（build.rs）が dir の file から生成するので、PageId と Module の列から外れる。nav の番号 3 は空くが、nav は番号の順に並べるだけで詰めない（歯 hspage_nav_by_number は数が重ならず昇ることだけを見る）。(b) グラフの口 /api/graph の読み（PATH・REASON・doc の 3 つ）は、問いの card と台帳と pipeline と次の一手の節点の card と抜けの検査と問いの頁が読むので、新しい file src/kit/map.rs へ字を変えずに移し、src/kit.rs に pub mod map を置く。project の mod.rs の glob の再公開で crate::project::map の path のまま引けるので、読む側の 7 file（ask・askpage・gaps・ledger・next・pipeline・view.rs）の字は替えない。kit の下は block でないので、BLOCK・PATHS・FOLDS・body・tab_step・DOM は持たない。(c) mapview/mod.rs から型 View とその impl と VIEW_PARAM と with_view を消す。View を引いていた list.rs の with_pair は面を切り替えず（view の鍵を書かない）、tree.rs の Tree::view は同じ鍵の字（view_design・view_ledger）を返す Tree::key に替える。(d) 受入の sweep（境界の src/audit.rs）の画面の一覧 SCREENS の数を 12 から 6 にする（地図の 6 面 page=map&view=compact・list・graph・table・design・ledger を外す）。節点の頁に開く最初の節点を採る画面は、地図の圧縮の面から home の台帳の一覧の番号の札 .nid にする（定数の名は COMPACT から FIRST_NODE・値は ?）。測る幅の WIDTHS（今の 1280 と 390）と mode の MODES は替えない（4 幅にする直しは後の行 g-accept が持つ）。(e) doc の行は lib.rs・project/mod.rs・mapview/mod.rs の地図の頁の字を直す。(f) 歯。消す歯は tests/mapkeys.rs の 3 本（mkeys_arrows_wrap_around・mkeys_dom_wires_arrows・mkeys_names_stay_apart）と snapshot の tests/snapshots/pages/map.json。書き替える歯は acctframe_entry_selects_board_account_only・acctwire_back_part_before_header・askcard_page_frame_and_nav・frame_home_blocks_in_order_and_map_page・frame_blocks_without_data_are_unmeasured・frame_mode_lives_in_url・gapspage_page_frame_and_nav・gpill_part_and_pages・hsblock_names_follow_dir と hsblock_ids_match_consts（表 LANDED を 12 に）・hsderive_consts_match_note と hsderive_module_returns_consts（表 CONSTS から map）・hspage_ids_follow_dir（表 LANDED を 4 に）と hspage_nav_by_number・mapview_query_keeps_view_and_filters・mapview_table_counts_and_pair_filter・mapview_landed_shape_and_body（block の値の照らしを doc の 3 値の照らしに）・mapview_classes_and_keys_exist・mtree_views_six_in_url（View の照らしを消し Tree::key を照らす）・mtree_vocab_budget・mtree_dom_text・nodepage_frame_and_nav・parts_pending_blocks_unmeasured_for_all_three（表を 4 に）・parts_paths_distinct_in_block_modules（/api/graph の字は src/kit/map.rs に 1 度）・pgsw_plain_left_pushes_href・pgsw_keys_or_button_keep_default・ptitle_joins_name_and_word・ptitle_every_page_has_word と、snapshot の tests/snapshots/header.json（nav の項から map を外す）と、境界の jrun_screens_cover_surface・jrun_sweep_all_cases。歯の名は替えない（frame_home_blocks_in_order_and_map_page と mapview_query_keeps_view_and_filters の名は古い字を持つが、名替えは後の行に任せる）。新しい歯は tests/bvmpage.rs の 3 本。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。(1) は verify の 1 行目、(2)(3) は 2・3 行目の clippy、(4)〜(6) は 4 行目の歯 bvmpage、(7) は 5〜19 行目の面の歯 15 file、(8) は 20 行目の境界の歯 jrun、(9) は surface-build の行、(10) は check の行で測る。

      構造の連鎖。頁と block の列は build.rs の生成なので、file を消すと PageId と Module と block の描き分けから同時に外れる。crate::project::map の path は kit の下の map の glob の再公開で残るので、読む側と、その字を見る着地済みの歯（cadl・cadq・cadopt・hruling・gapspage・evkindview）は替えない。境界の歯 jrun は面の src の pages の dir と mapview/mod.rs を字で読むので、View を消すと同じ行で直す要がある。

      試作と噛み。試作は main ef01b1fc の写し（係の写し drafts/w63a）。書いた file は write-set の中で閉じる。面の歯 825 本（mkeys の 3 本を消し bvmpage の 3 本を足した）と境界の歯 1484 本が緑、cargo run -q -p xtask -- check が rc 0（工房の歯 2920 本が緑）、surface-build が rc 0、2 つの clippy が rc 0。噛みは 6 つの変異で、頁の file を置く・kit の map に BLOCK を足す・mapview に VIEW_PARAM を戻す・header の snapshot に map を戻すは bvmpage の歯が、SCREENS に地図の圧縮の面を戻す・節点を採る画面を替えるは jrun の歯が、どれも rc 100 で落ちた。

      流す時と順。地図を消す鎖の頭（depends は無い）。続く行 m-map-compact の差は、この行の試作の commit 180cc9ba を起点に切ったので、この行の着地の後に流す。

      範囲の外。受入の sweep の測る幅 WIDTHS を 4 幅にする直しは後の行 g-accept が持つ（この行は WIDTHS を替えない）。語の辞書 vocab.json と stylesheet style.css の地図の語と class（map・views・view_*）は第 2 段の行 g-help-sweep で掃く。地図だけが読む口 /api/graph/view と中核の view は別の行で消す。グラフの口の REASON の字（地図の 7 つの出所）は替えない。frame.rs の頭の doc の行の地図の頁の字は、頁と tab を消す行 g-one-screen-a で直す。
