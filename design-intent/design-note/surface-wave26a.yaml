    type: prose
    title: 行 c-pipe-five — pipeline の板の列を Blocked と Queued に割って 5 列にする
    body: |
      在りか。main ef01b1fc。差の file docs/design/patch/c-pipe-five.patch は、起草 w63c が main ef01b1fc に試作の commit（写し drafts/w63c の a79144bc）を載せ、git diff --no-color --full-index で write-set の書く file の 11 だけを切った（29,839 byte）。main の木で git apply --check が rc 0、試作の木で git apply --reverse --check が rc 0、main の木で git apply --reverse --check は rc 1。

      なぜ。判断の記録 ADR-27 決定 (6) は pipeline の板を Blocked・Queued・Running / Gated・止まり・着地 の 5 列にする。今の契約の PipelineColumn は閉じた 4 で、段 Queued と Blocked を 1 つの列 Queued/Blocked にまとめ、面の板も 4 列で描く（札の電文は段を分けて持つ・決定の context）。この行は列の型と今の面の板だけを 5 列にし、第 2 段の面の組み立て（札の中身・吹き出し）の前に今の板で Blocked と Queued を分けて見せる。

      形。契約の src/board.rs の PipelineColumn の変種 QueuedBlocked（電文の名 Queued/Blocked）を Blocked と Queued に割る（電文の名は Blocked と Queued・宣言の順は板の順で Blocked が先・doc は閉じた 5）。Stage::column は段 Blocked を Blocked の列へ、段 Queued を Queued の列へ写す（ほかの段の写しは替えない）。Blocked と Queued の割りは今の中核の段のまま（中核の queued_cards が開いた blocks の相手が在れば段 Blocked・無ければ段 Queued・走行の段 Blocked は段 Blocked・中核の file は書かない）。器の局面の出力 fleet/lifecycle.json での割りは後の行 c-case-columns が替える。面の src/project/pipeline.rs の LANES を 5 にし、Blocked の列は名 block と鍵 col_block、Queued の列は名 queue と鍵 col_queue（どちらも状態の記号 wait）、ほかの 3 列は替えない。doc の 4 列の字を 5 列にする。語の辞書 vocab.json に鍵 col_block（語 Blocked）と col_queue（語 Queued）を col_run の前に足す。鍵 col_wait（語 Queued / Blocked）は口座の板の run の数の card（src/account/cards.rs の fn pcnt_card が鍵 col_wait・col_run・col_stop・col_land の 4 つを二重引用符で囲みコンマと空白で区切り角括弧で囲んだ 1 行の列で引く）がまだ読むので消さず語も替えない（判断の記録 ADR-27 決定 (1) は口座の板の形を変えない・行の計画の col_wait の字を替える案はこの理由で採らない）。stylesheet は .board の grid を 5 列にし（字 .board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--s2); }）、列の class の規則 .col.c-wait の 2 つを .col.c-block（点は輪）と .col.c-queue（点は塗り）と、2 つを並べた影の規則 .col.c-block, .col.c-queue { に替える（色はどちらも var(--s-wait)・口座の板の .prow .c-wait と節点の頁の .stg.c-wait は替えない）。契約の snapshot tests/snapshots/board.json の board::PipelineColumn の列を 5 つの字にし、tests/cform_board.rs の見本の列と、段の列の重なりの無い数を 5 にする。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done (1) は verify の 1 行目（差の file の当たり）。done (2) は verify の 2 行目と 3 行目（契約と面の clippy）。done (3)〜(5) は verify の 4 行目（歯の file tests/bvfive.rs・filter bvfive_）の歯 bvfive_five_columns_in_order・bvfive_blocked_and_queued_apart・bvfive_column_words_in_vocab。done (6) は verify の 5〜9 行目（着地済みの歯の file ごとに 1 行）。verify の最後の 2 行（xtask の surface-build と check）は wasm の組み立てと repo の全部の歯と床を撃つ（done の項は持たない）。

      構造の連鎖。書き替える着地済みの歯（fn の名）は次の 13。tests/pipe.rs の pipe_columns_order_and_cards_sorted_by_elapsed（列と class と鍵の 5 組・列ごとの札の id・数 1・1・2・3・4・状態の記号）・pipe_more_button_and_open_column_in_url と中の fn open_in_url（着地の列は 5 列目・止まりの列は 4 列目・開いた列の query の字 col=queue,land）・pipe_empty_band_and_unmeasured（空の 5 列の class・列の数の assert は 5 つの class の比べに含まれるので 1 行消す〔関数の行 60 の上限〕）・pipe_stage_column_from_contract（表の列の数 5）・pipe_keys_in_vocab_and_classes_in_stylesheet（鍵 col_wait を col_block と col_queue に）・pipe_landed_column_only_today と pipe_no_landed_today_is_empty_column（列の番号を 1 つ後へ・Queued の札は 2 列目で class は col c-queue）。tests/pfold.rs の pfold_closable_rules（数 1・1・2・3・4・着地の列は 5 列目）と pfold_with_closed_rules（query の名 wait を queue に・5 つの名の並び block,queue,run,stop,land）。tests/pcimark.rs の pci_columns_keep_waiting と tests/pclosed.rs の pclosed_land_lane_today_only（空の列を 1 つ足す）。契約の tests/cform_board.rs の contract_form_snapshot_matches と contract_form_roundtrip_all_types（見本の fn forms の列）と contract_form_closed_lists（数 5）。契約の tests/cfsplit.rs は型の名 board::PipelineColumn しか持たないので書かない。PipelineColumn を読むのは面の pipeline.rs と歯だけで、中核と境界と口座の板は読まない（口座の板の 4 つの数 RunCounts は中核の src/account/project.rs が event の段から数える）。ほかの着地済みの歯で列の数や名を字で持つ物は grep（PipelineColumn・QueuedBlocked・Queued/Blocked・col_wait・c-wait・LANES・列の番号）で全部見て、上の外は替えずに緑（口座の板の歯 hcproj.rs・hacols.rs・harest.rs と節点の頁の ntime.rs の c-wait と col_wait は口座と節点の字）。

      試作と噛み。試作の main は ef01b1fc、試作の commit は写し drafts/w63c の a79144bc。書く file は write-set の中で閉じる（git diff --name-only ef01b1fc a79144bc が write-set の 11 と同じ）。試作の木で面の全部の歯 828 本と契約の 41 本が緑、clippy の 2 行と xtask の surface-build と check（2923 本）が rc 0。変異は 6 つで、done の各項が少なくとも 1 つで落ちた（nextest の落ちは rc 100、clippy の落ちは rc 101 で数え、変異の後は file の字を元に戻した・対照は戻した後の bvfive の撃ちの rc 0）。(k1) 契約の Stage::column の段 Blocked の写しを Queued の列に → bvfive_five_columns_in_order と bvfive_blocked_and_queued_apart と、着地済みの pipe_columns_order_and_cards_sorted_by_elapsed と pipe_landed_column_only_today が落ちた・done (3)(4)(6)。(k2) Blocked の列の名 block を wait に → bvfive_ の 2 本と着地済みの pfold_with_closed_rules が落ちた・done (3)(4)(6)。(k3) 語の辞書の col_queue の語を Queued（順番）に → bvfive_column_words_in_vocab が落ちた・done (5)。(k4) stylesheet の .board の repeat(5 を repeat(4 に → bvfive_column_words_in_vocab が落ちた・done (5)。(k5) 契約の snapshot の列を前の 4 つの字に戻す → 着地済みの contract_form_snapshot_matches が落ちた・done (6)。(k6) 歯の file に使わない束縛の行を挿す → 面の clippy の verify の行が rc 101・done (2)。done (1) は main の木で verify の 1 行目が rc 1。

      流す時と順。depends は空。後の行 c-landed-12h（同じノート）はこの行の試作の commit を起点に差を切った（鎖）。同時に起草した第 1 段のほかの行のうち、地図の頁と block を消す行は面の src/project/pipeline.rs（地図の block の口と札の hover の節点の card を引く所）を書く見込みで、この行の書く file と重なる（置く順と当て直しは席が決める）。

      範囲の外。中核の段の決め（queued_cards の Blocked と Queued の割り・後の行 c-case-columns）・札の中身と吹き出しと幅の段（第 2 段の面の行）・着地の列の 12 時間（後の行 c-landed-12h）・口座の板の 4 つの数と語（判断の記録 ADR-27 決定 (1)）・契約の tests/cfsplit.rs。
  - n: 7
    type: prose
    title: 行 c-landed-12h — pipeline の板の着地の列を今から 12 時間の内にする
    body: |
      在りか。起点は行 c-pipe-five の試作の commit a79144bc（main ef01b1fc の上・写し drafts/w63c）。差の file docs/design/patch/c-landed-12h.patch は、その上に載せた試作の commit 9f43d902 との git diff --no-color --full-index で write-set の書く file の 6 だけを切った（27,345 byte）。a79144bc の木で git apply --check が rc 0、試作の木で git apply --reverse --check が rc 0、a79144bc の木で git apply --reverse --check は rc 1。main ef01b1fc の木には当たらない（行 c-pipe-five の着地の後に当てる）。

      なぜ。判断の記録 ADR-27 決定 (6) と規則の行 R-36（着地の時刻が今から 12 時間 以内の札だけを出す）。今の着地の列は日本の日の今日の着地で、日付が変わった直後に列が空になり夜中の着地が見えなくなる（決定が退けた案の理由）。

      形。面の src/project/pipeline.rs に定数 LAND_WINDOW_S（u64・値 43_200・doc は規則の行 R-36 と判断の記録 ADR-27 決定 (6)）を足し、関数 landed_today（日本の日の比べ・crate::view の jst を呼ぶ）を landed_recent に替える（段の列が Landed で since が在り、now.saturating_sub(since) が LAND_WINDOW_S 以下・今より後の時刻は経過 0・引数と返りの型は前と同じ）。fn columns の着地の列の filter は landed_recent と、CI を待つ札（欄 ci が Waiting・時刻を問わない）。use の jst を外す。着地の列の見出しの語の鍵を col_land から新しい鍵 col_land_12h（語 Landed（12 時間）・注は今から 12 時間の内に、で始まる）にし、vocab.json の col_land の直後（ci_wait の前）に足す。鍵 col_land（語 Landed（今日））は口座の板の run の数の card がまだ読むので替えない（判断の記録 ADR-27 決定 (1)）。doc の今日の字を直近の着地と 12 時間の字にする。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done (1) は verify の 1 行目（差の file の当たり）。done (2) は verify の 2 行目（面の clippy）。done (3)〜(6) は verify の 3 行目（歯の file tests/bvland.rs・filter bvland_）の歯 bvland_window_is_rule_r36・bvland_kept_after_midnight・bvland_dropped_after_window・bvland_lane_word_12h。done (7) は verify の 4〜6 行目（着地済みの歯の file ごとに 1 行）。verify の最後の 2 行（xtask の surface-build と check）は done の項を持たない。歯 bvland_window_is_rule_r36 は design-intent/rules.yaml の行 R-36 の value の字（着地の時刻が今から 12 時間 以内の札だけを出す）から、今からと時間 以内の間の数を読む（規則の行の値が替われば歯が落ちる）。

      構造の連鎖。消す着地済みの歯（fn の名）は 4。tests/pipe.rs の pipe_landed_today_boundaries・pipe_landed_column_only_today・pipe_no_landed_today_is_empty_column（日本の日の今日を測る 3 本と、それだけが使う helper の fn card・fn card_at・fn board_body と use の JST_OFFSET と landed_today）と、tests/gjst.rs の gjst_landed_on_japan_day（と helper の fn landed と use の PipelineCard・Stage・BeadId・landed_today）。同じ性質（範囲の境・列の中身・描く時の今で決める）は新しい歯 bvland_ の 4 本が 12 時間で測る。書き替える着地済みの歯は 4。tests/pipe.rs の pipe_columns_order_and_cards_sorted_by_elapsed と pipe_keys_in_vocab_and_classes_in_stylesheet（鍵 col_land を col_land_12h に・doc の今日の字）、tests/absface.rs の abst_card_from_since（中の fn ci_and_landed の着地の判じを landed_recent と LAND_WINDOW_S の境に）、tests/gjst.rs の gjst_own_names_clean（この file の歯の数 9 を 8 に）。gjst_vocab_land_note（鍵 col_land の語と注）は口座の板の字なので替えない。landed_today を名指す着地済みの歯はこの 3 file の外に無い（grep）。消した後に残る面の歯の file は全部組み立てられ緑（試作で面の全部 828 本）。

      試作と噛み。試作の起点は a79144bc、試作の commit は写し drafts/w63c の 9f43d902。書く file は write-set の中で閉じる（git diff --name-only a79144bc 9f43d902 が write-set の 6 と同じ）。試作の木で面の全部の歯 828 本と契約の 41 本が緑、clippy と xtask の surface-build と check（2923 本）が rc 0。変異は 7 つで、done の各項が少なくとも 1 つで落ちた（nextest の落ちは rc 100、clippy の落ちは rc 101 で数え、変異の後は file の字を元に戻した・対照は戻した後の bvland の撃ちの rc 0）。(k1) LAND_WINDOW_S を 86_400 に → bvland_window_is_rule_r36 が落ちた・done (3)。(k2) landed_recent の以下を未満に → bvland_kept_after_midnight と bvland_dropped_after_window が落ちた・done (4)(5)。(k3) 写しの rules.yaml の R-36 の 12 時間を 24 時間に → bvland_window_is_rule_r36 が落ちた・done (3)。(k4) 着地の列の鍵を col_land に戻す → bvland_lane_word_12h と着地済みの pipe_columns_order_and_cards_sorted_by_elapsed が落ちた・done (6)(7)。(k5) 語の辞書の col_land_12h の語を Landed（今日）に → bvland_lane_word_12h が落ちた・done (6)。(k6) fn columns の CI を待つ札の filter の行を消す → bvland_dropped_after_window が落ちた・done (5)。(k7) 歯の file に使わない束縛の行を挿す → clippy の verify の行が rc 101・done (2)。done (1) は a79144bc の木で verify の 1 行目が rc 1。

      流す時と順。depends は c-pipe-five（差はその試作の commit を起点に切った・鎖）。行 c-pipe-five の差の hunk のうち tests/pipe.rs の鍵の列と着地の列の組と、着地の歯の列の番号の所はこの行が書き替えるので、この行の着地の後は c-pipe-five の差の file の reverse の当たりは rc 1 になる（鎖の前の行の verify の 1 行目は撃ち直さない）。後の行 c-case-columns の係はこの 2 行の試作の上に積む。

      範囲の外。口座の板の着地の数（中核の src/account/project.rs が UTC の日で数える）と語 col_land（判断の記録 ADR-27 決定 (1)）・CI の語の 600 秒（CI_MARK_S）・Queued の注意の色（規則の行 R-37・第 2 段の行）・規則の行 R-36 の字（読むだけ）。
  - n: 8
    type: prose
    title: 行 c-bead-facts — bead の事実の型と中核の組み
    body: |
      在りか。差の file docs/design/patch/c-bead-facts.patch は main ef01b1fc を起点に切った（試作の commit 0779f8e4・起草 w63d の写しの中だけ）。書く file は契約の crate の src/ledger.rs・tests/cform_ledger.rs・tests/snapshots/ledger.json と、中核の crate の src/ledger/mod.rs・新しい src/ledger/facts.rs・新しい歯 tests/bvfact.rs の 6 つ。write-set の =crates/tsuzuri-contract/tests/cfsplit.rs は verify が撃つだけで書かない。

      なぜ。判断の記録 ADR-27 の決定 (9) は短い題を台帳の付帯の欄 metadata の鍵 short に置き、置いていない bead は題から機械で作る（便は契約の行 id・ほかは題の「—」の前）とし、決定 (10) は面の server の電文に bead の起票の時刻・依存の相手・本文の概要・短い題を足すとした（要件 FR5 の吹き出しと FR10 の札）。今の一覧の行の型 LedgerRow は歯の literal が多いので欄を足さず、別の型 BeadFacts を次の行 c-bead-route の新しい口で出し、面が id で結ぶ。中核の台帳の読みの struct（src/graph/build.rs の BdBead）は既に欄 metadata を serde_json の Value で全部読み、同じ file の metadata_ids が object と object を JSON にした字の両方から鍵の字を読むので、struct に欄を足さず metadata_ids で鍵 short を読む（build.rs は書かない）。

      形。契約の src/ledger.rs の LedgerList の後に 2 つの型を足す。BeadFacts は欄 rows（Reading の Vec の BeadFact・読めなければ Unknown）だけ。BeadFact は欄 id（BeadId）・created_at（Option の EpochSecs）・short（String）・short_set（bool）・summary（String）・blocks（Vec の BeadId）をこの順に持つ。中核の新しい src/ledger/facts.rs は pub の関数 facts（台帳の字から BeadFacts）・short_of（題から機械の短い題）・summary_of（本文から概要）と pub の定数 SHORT_KEY・ROW_TITLE_PREFIX・TITLE_DASH・OBSERVATION_HEADING・SUMMARY_LABEL・SUMMARY_MAX を持ち、src/ledger/mod.rs が pub mod facts と pub use facts::facts を足す。決め: 台帳の字が空か JSON の配列として読めなければ rows は Unknown（空の配列は Known の 0 件）。tombstone の bead と id が bead の id の形でない bead は出さず、行は台帳の順。short は metadata の鍵 short の空でない字なら short_set は真。無ければ short_set は偽で、題の前後の空白を除き、頭が字「便」と半角の空白なら次の空白までの字（契約の行 id）、ほかは字「—」の前の字の前後の空白を除いた字（「—」が無ければ題の全体）、作った字が空なら題の全体。summary は本文の行を前後の空白を除いて見て、行の全体が字「### 観測」の行が在ればその下の最初の空でない行、無ければ空でなく字 # で始まらない最初の行を選び、頭の字「概要 =」とその後の空白を外し、Unicode の字で 120 に切る（要件の全角 120 字を Unicode の字の数と読む・題を 36 字に切る契約の title36 と同じ数え方）。選ぶ行が無ければ空の字。blocks は依存の type が blocks の先の全部を台帳の順に持ち、id の形の合わない先は外す。created_at は bd の欄 created_at の RFC 3339 の字を中核の epoch_secs で読み、読めないか欄が無ければ None。契約の歯 cform_ledger.rs は見本 2 つの BeadFact と 3 つの BeadFacts（Known の 1 行・Known の 0 件・Unknown）を LedgerList の見本の後に足し、snapshot ledger.json はその 2 つの鍵の字を持つ。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done (1) は verify の 1 行目（git apply --reverse --check）。(2) は 2 行目の clippy。(3) は 3 行目の中核の歯 bvfact_（tests/bvfact.rs の 10 本）。(4) は 4 行目の契約の歯 contract_form_（tests/cform_ledger.rs の 7 本）と 5 行目の cfsplit_（tests/cfsplit.rs の 6 本）。(5) は 6 行目の xtask の check。

      構造の連鎖。契約の型を足すので、契約の群 ledger の snapshot ledger.json が変わる（cform_ledger.rs の見本の足しと同じ差）。群の見張り cfsplit.rs は足す行が一覧を直さない決まりなので書き替えない（鍵 ledger::BeadFact と ledger::BeadFacts は群 ledger の module ledger の鍵）。契約の群の歯のうち cform_ledger.rs の contract_form_snapshot_matches と contract_form_roundtrip_all_types が新しい見本を測る。一覧の行の型 LedgerRow・bd の行の読み BdLine・境界の一覧の読み・中核の Bead と read と build.rs の BdBead と metadata_ids は替えない。次の行 c-bead-route が口を足し、第 2 段の面の行（吹き出しと札）が読む。

      試作と噛み。main ef01b1fc を git clone --local した写しで試作した（試作の commit 0779f8e4）。書く file は write-set の 6 つで閉じる（git diff --stat の file は 6・足し 404 行と消し 3 行）。差の byte は 19,242（gate の上限 150,000 の内）。cargo clippy -p tsuzuri-contract -p tsuzuri-core --all-targets --no-deps -- -D warnings が rc 0、中核と契約の全部の歯 355 本が緑、xtask の check が rc 0（workspace の歯 2930 本が緑）。変異 12 を 1 つずつ当て、どれも名指した歯が rc 100 で落ちた（short_set を常に偽・便の頭を外さない・区切りの前の空白を残す・観測の見出しを見ない・概要の頭を外さない・見出しの行を飛ばさない・121 字で切る・blocks に parent-child の外を全部・起票の時刻を読まない・読めない字を 0 件に・tombstone を残す・電文の欄の名を替える〔snapshot の歯〕）。

      流す時と順。depends は無い（第 1 段の電文の鎖の頭）。次の行 c-bead-route がこの行の後。同時に置く第 1 段の行のうち契約の snapshot と形の歯（cform_*.rs・snapshots/*.json）を書く行とは、書く file が重なる時に席が置く順を決め、後に置く行は前の行の着地の後に差を切り直す（この行が書くのは群 ledger の cform_ledger.rs と ledger.json だけ）。

      範囲の外。口 GET /api/beads（次の行 c-bead-route）・面の読みと台帳の変化の知らせでの読み直し（第 2 段の吹き出しの行）・metadata の鍵 short を書くこと（席の起票の手順・面も server も書かない）・依存の相手の段（面が台帳の一覧の状態で結ぶ）・器が自分で起こす bead の短い題（器の席と決める）。
  - n: 9
    type: prose
    title: 行 c-bead-route — 口 GET /api/beads
    body: |
      在りか。差の file docs/design/patch/c-bead-route.patch は、前の行 c-bead-facts の試作の commit 0779f8e4（main ef01b1fc に c-bead-facts の差を載せた木）を起点に切った（試作の commit fd870781・起草 w63d の写しの中だけ）。書く file は境界の crate の新しい src/server/routes/beads.rs と新しい歯 tests/bvfroute.rs の 2 つで、どちらも足すだけ。write-set の =crates/tsuzuri-boundary/tests/hbroute.rs は verify が撃つだけで書かない。

      なぜ。判断の記録 ADR-27 の決定 (10) は面の server の電文に bead の起票の時刻・依存の相手・本文の概要・短い題を足すとした（要件 FR5 と FR10）。前の行が足した型 BeadFacts を新しい口で出し、今の口 /api/ledger の電文 LedgerList とその歯の literal は替えない。面は第 2 段の行（吹き出しと札）でこの口を読み、台帳の一覧の行と id で結ぶ。

      形。口の file は 1 口 1 file の置き場 src/server/routes/ に足す。口の列は組み立ての script（build.rs）が dir から作るので mod.rs と build.rs は書かない。鍵は method GET と path の完全一致 /api/beads。本文は口 /api/ledger と同じ読み shared.sources.ledger.got()（見張りの読みの字・読みが落ちれば規則の行 R-21 の上限の内の最後に読めた字）の字を中核の tsuzuri_core::ledger::facts に渡し、字が無ければ空の字を渡す（facts が rows を Unknown にする）。応答は状態 200 の電文で、古さの印は /api/ledger と同じ aged（got の stale が在れば頭 X-Tz-Read-Age に最後に読めた時からの秒）。歯の file は fixture tests/fixtures/ledger/bd-list-8.json（bead 8 本・fx-hub.7 が fx-hub.6 を blocks に持つ）を偽の bd が出す作業場を CARGO_TARGET_TMPDIR の下に作り、server を同じ process の thread で 127.0.0.1 の空き port に立てる（歯 rhold.rs と同じ組み・偽の bd は落とす印の file が在れば rc 1）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done (1) は verify の 1 行目（git apply --reverse --check）。(2) は 2 行目の clippy。(3) は 3 行目の境界の歯 bvfroute_（tests/bvfroute.rs の 3 本）。(4) は 4 行目の口の歯 hbroute_（tests/hbroute.rs の 8 本）。(5) は 5 行目の xtask の check。

      構造の連鎖。口を 1 つ足すので、生成の口の列（Route の ALL）と口の歯 hbroute.rs（dir の名と生成の字の順と鍵の重なりを見る）が新しい口も見る（書かない・足しで落ちない）。口の一覧を字で持つ着地済みの歯は grep で全部見て、どれも書き替えない（どれも足しでは落ちず、新しい口の古さの印と読めない時は歯 bvfroute.rs が測る・口 /api/graph/view を消す行が同じ一覧を書くので重ねない）: hbroute.rs の hbroute_keys_cover_twelve_gets（12 の GET の鍵を含むかだけを見る）・lsnap.rs の lsnap_routes_call_no_bd（台帳を読む 10 の口）・rhold.rs の rhold_routes_hold_and_mark（同じ 10 の口）と rhold_wiring_text（字 aged( を持つ 11 の口の file の名）・server_view.rs の server_view_routes_write_nothing と server_view_non_get_405_writes_nothing（3 の口）・server_read.rs の server_read_routes_write_nothing（4 の口）・server_coalesce.rs の server_coalesce_seven_routes_share_one_bd（7 の口）。面の crate の口の表（歯 hsderive.rs）と合図の種類の表（歯 evkindview.rs）は、面がこの口を読む第 2 段の行が書く。

      試作と噛み。前の行の試作の commit 0779f8e4 の上で試作した（試作の commit fd870781）。書く file は write-set の 2 つで閉じる（git diff --stat の file は 2・足し 266 行）。差の byte は 11,215（gate の上限 150,000 の内）。cargo clippy -p tsuzuri-boundary --all-targets --no-deps -- -D warnings が rc 0、歯 bvfroute_ の 3 本と hbroute_ の 8 本が緑、xtask の check が rc 0。変異 5 を 1 つずつ当て、どれも名指した歯が rc 100 で落ちた（古さの印を付けない・読めない字を空の配列に・口の path を替える・行を逆の順に〔中核の facts〕・落ちた間は最後に読めた字を使わない）。

      流す時と順。depends は c-bead-facts（型 BeadFacts と中核の facts を使う）。境界の routes/ に新しい file を足すだけなので、ほかの第 1 段の行とは書く file が重ならない（口の一覧を字で持つ歯を書く行とも重ならない）。

      範囲の外。面の読み（第 2 段の吹き出しと札）・台帳の変化の知らせ ledger-changed での読み直しと合図の種類の表・口 /api/ledger と LedgerList の電文・依存の相手の段（面が台帳の一覧で結ぶ）・ほかの project の台帳。
  - n: 10
    type: prose
    title: 行 c-case-read — 器の局面の出力を読む型と中核の読みと口 GET /api/cases
    body: |
      在りか。main ef01b1fc（ノート surface-wave26a の第 0.1 版の木）。差の file docs/design/patch/c-case-read.patch は、起草 w63e の試作（写し drafts/w63e の 73d8e038・main ef01b1fc の上の 2 commit）から git diff --no-color --full-index で write-set の 14 file だけを切った。main の木で git apply --check が rc 0、試作の木で git apply --reverse --check が rc 0（41,454 byte・14 file・1030 行足して 1 行消す・src は 7 file で 233 行・歯は 3 file で 451 行・fixture と snapshot は 3 file で 344 行）。

      なぜ。判断の記録 ADR-27 の決定 (10) が、一覧の段と Queued のまだ起きない理由と Blocked の相手を器（scribe2）の局面の出力 fleet/lifecycle.json の局面と理由と相手の欄から読むとした。要件 FR10（第 0.22 版）は Blocked と Queued の列を局面 contract-queued の理由と欄 links.on と links.runs で分け、要件 FR13 は未反映の一覧を局面の出力が席の手番とする 3 つから出し、読めない出力と古さの印の在る出力を示すと書く。この行はその読み手だけを置き、後の行（c-case-columns・c-unref-lc・c-ledger-lc）が中核の関数 cases_of の電文を使う。

