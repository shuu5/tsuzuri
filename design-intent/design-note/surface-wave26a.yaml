  - n: 5
    type: prose
    title: 行 m-more-drop — 口座の履歴と口座の「詳しく」と台帳の「詳しく」を消す
    body: |
      在りか。差の file docs/design/patch/m-more-drop.patch は、行 m-map-page の試作の commit 180cc9ba（main ef01b1fc に m-map-page の差を載せた木・起草 w63a）を起点に切った。起草 w63b の試作（写し drafts/w63b の 6783f096・main ef01b1fc の上の 1 commit）の差を、席が 180cc9ba の上に当て直した（写し drafts/s26p1 の 0e572377）。替わったのは tests/hsderive.rs の 2 つの hunk の文脈の行と行の番号だけで、足す字と消す字は 6783f096 の差と同じ。180cc9ba の木で git apply --check が rc 0、0e572377 の木で git apply --reverse --check が rc 0（70,833 byte・16 file・601 行足して 711 行消す・足す行のうち 555 行は新しい歯の file で、その 358 行は filter の語の一覧）。

      なぜ。判断の記録 ADR-27 の決定 (2) が消す物に、口座の履歴と口座の「詳しく」と台帳の「詳しく」を挙げた。要件 FR13（第 0.22 版）は、project board の台帳の指標に「詳しく」の畳みを持たず、ready と blocked・lead p50・stale・sparkline を出さないと書く。席と口座は第 2 段で上の帯と窓へ移る（要件 FR12）。この行は第 1 段の消す段で、語の辞書 vocab.json と stylesheet style.css を書かない（使わなくなる class ahistd・ahist の規則は第 2 段の掃除の行でまとめて掃く。語 acct_hist は account board の project の行の開いた段〔src/account/projects.rs〕と歯 tests/projmore.rs の語の鍵の一覧が使い続けるので、語の辞書に残し第 2 段でも掃かない。語 p_more と class gmore・gm・gm1 は account board と hover の card と help が使い続ける）。

      形（要約・字は差の file）。src/project/seat.rs は、型 HistRow と More、型 Seat の欄 hist と more、関数 hist・more・copied_value・copied_line・seat_line、定数 MORE・MORE_SRC・NO_CURRENT を消し、FOLDS を空の列にし、use の EXPERT_CHARS と wrap_words を外し、module の doc の 2 か所（見本の関数名 histHTML の字と、詳しくの写しの行の字）を直す。Seat は欄 top・strips・low・band の 4 つになる。関数 band・low・park_of・marks・group_card・park_card・thr と電文の読み（card・body・content・drawn）は替えない。src/project_dom/seat.rs は、fn text_or_unknown・hist_row・hist_view・more_view を消し、fn seat_view の分解と view! から hist と more を外し、use の HistRow・MORE・MORE_SRC・More と fold と HelpCtx・shows_internal を外す。src/project/ledger.rs は、enum Tier の More とその name の腕、配置の表 LAYOUT の詳しくの段を消して LAYOUT と fn layout の長さを 7 から 6 にし、FOLDS を ledger:unref だけにし、mod dom の fn tier_view の Tier::More の腕（details の class gmore・畳みの鍵 ledger:more・語 p_more）と測れていない時の腕の Tier::More を消し、mod dom の use の shows_internal を外し、doc の 2 か所の「詳しく」の字を外す。enum Part の 8 項（Ready から Epic）と Metrics の欄と fn line_view の腕は残す（配置の表に置かないので描かれない・第 2 段の一覧の見出しの行が使うか消すかを決める）。

