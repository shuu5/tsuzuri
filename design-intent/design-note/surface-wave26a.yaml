      なぜ。判断の記録 ADR-27 の決定 (1)(2) は地図の圧縮・一覧・グラフ・表の面を消し、要件 FR5 は地図の頁を持たない。行 m-map-page が地図の頁と面の切り替えを消した後、どの頁も描かない面の file を消す鎖の 2 つ目として、圧縮の面と一覧の面を消す。

