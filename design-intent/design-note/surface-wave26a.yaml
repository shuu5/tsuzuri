    type: prose
    title: 行 c-unref-lc — 未反映の一覧を局面の出力から読む
    body: |
      在りか。差は起点 d5bea76a（main ef01b1fc に第 1 段の 9 行の試作を積んだ木・行 c-case-read の試作 fb892e58 を含む）に試作 8087d6e1 を載せて切った（30 file・追加 658 行・削除 131 行・差の file 67,666 byte）。差の file docs/design/patch/c-unref-lc.patch が字の正本。

      なぜ。要件 FR13（srs 第 0.16 版・持ち主の裁定 t3-hub.63.1）は未反映の一覧を、器の局面の出力が席の手番とする 3 つ（処置の待ちか形の崩れの memo・未仕分けの発話・裁定の反映待ち）にし、要望を独立の種類にしないと決めた。着地済みの行 c-unref-now は局面の出力の読み手が無い間のつなぎで 3 種ともまだ分からないを返す。行 c-case-read が出力の読み（中核 cases_of・契約 CaseDoc・境界 server の Cases）を置いたので、この行が一覧をその読みに替える。

      形。契約の UnreflectedKind の Request を Utterance（serde の字 utterance）に替え、ALL は memo・ruling・utterance の順。UnreflectedList の欄 requests を utterances にし、古さの印の種類の字の列 stale を足す。中核の unreflected は台帳の字と出力の字と古さの印の字を受け、cases_of の部品から表 PHASES（memo は memo-actionable と misfit・question は ruling-unreflected・utterance は utterance-open）で 3 種を出力の順に拾う。部品が Unknown なら 3 種とも Unknown、出力の unmeasured が部品の種類を名指すか unmeasured が読めなければその種類を Unknown にする。題と作った時刻は台帳の bead から引き（無ければ空と None）、発話は題を空に作った時刻を id の ts にする。中核に with_unreflected を足し、指標の未反映の 3 欄（unreflected_kinds・unreflected・unreflected_unknown）を一覧から数え直す。stats と of_beads は替えない（今のまま 3 種とも分からない）。境界の board の unreflected と metrics は出力の字と古さの印の字を受け、口の 2 つは Shared の cases の texts を渡す（state dir が無ければ空の字と None で 3 種とも分からない）。面は種類の名の表 UNREF_KINDS と次の 1 手の表 UNREF_NEXT と unref_list の照らしを Utterance に替え、vocab.json の鍵 unref:request を unref:utterance（label 発話）に、nx_reflect を nx_sort（label 仕分け）に替える。着地済みの歯 13 本と fixture 4 つは種類の字 request を utterance に、要望の見出しを発話に、電文の欄を utterances と stale に替えるだけ。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。(1) は verify の 1 行目、(2)〜(9) は bvunref の行、(10) は bvuroute の行、(11) は着地済みの歯 13 行と clippy と xtask の check の行。着地済みの歯の一覧は cform_stats・core の stats・harestcore・server_view・absface・acctproj・hacols・surface の harest・kindlab・ledgerblock・udash・unow・unrefpanel。

      構造の連鎖。UnreflectedList と UnreflectedKind の構築点と照らしは契約の cform_stats と snapshot、中核の unreflected と stats、境界の board の list と歯 server_view、面の ledger と歯 11 本で、全部を差に含めた（試作で workspace の全部の歯の組み立てと clippy を通した）。account board の表の数は中核の account の project の stats_of から来て、局面の出力を読まないので、この行の後も 3 種とも分からないの字 ― のまま（範囲の外）。

      試作と噛み。試作は起点 d5bea76a の上で撃ち、書く file は write-set の中で閉じる。clippy（4 crate・all-targets・no-deps）rc 0、新しい歯 bvunref 8 本と bvuroute 3 本と着地済みの歯 13 本が緑。試作の木 8087d6e1 で xtask の check が rc 0（歯 2,946 本が緑・面の組み立てを含む）。噛みは係 w64d が同じ木で変異 10 を 1 つずつ当て、どれも名指した歯を rc 100 で落とした（中核 7・境界 2・面 1）。done (2) は U1、(3) と (9) は U2、(4) は U3、(5) は U4、(6) は U5、(7) は U6、(8) は U7、(10) は U6 と R1 と R2、(11) は S1 で落ちた。変異の後の木は 8087d6e1 と同じ。

      流す時と順。depends は c-case-read（cases_of と server の Cases を使う）と、差の起点 d5bea76a に積んだ行のうち書く file が重なる c-bead-facts（中核の src/ledger/mod.rs）・c-landed-12h（面の vocab.json と tests/absface.rs）・m-more-drop（面の src/project/ledger.rs と tests/ledgerblock.rs と tests/unrefpanel.rs）。差はこれらの行の試作の後の木に当たる形で切った。口 /api/graph/view を消す行 m-gview-drop（境界の server/board.rs と tests/server_view.rs を書く）はこの行の後に置き、席が差を切り直す。計画の c-next-effect と g-unref-lc は計画の依存で同じ id のこの行を名指す。書く面の src/project/ledger.rs は 3 行足して 3 行消すだけで、今の main の 1,284 行では上限 1,500 の余地が size M の見込み 300 行に足りないので、growth を 10 行にした（器の受付の事前点検の cap-headroom）。

      範囲の外。面の未反映の表示の字（局面の語と手番・古さの印の示し・見出しの説明の要望の字・行 g-unref-lc）。account board の数を局面の出力から数える読み（account の project の字に出力を足す）。台帳の一覧の項の段と、epic と memo と問いの局面（計画の行 g-unref-lc）。

  - n: 13
    type: prose
    title: 行 m-map-tree — 地図の表の面と 2 つの木の面を消す
    body: |
      在りか。差の file docs/design/patch/m-map-tree.patch は、行 m-map-compact の試作の commit da99fa55（main ef01b1fc に m-map-page と m-map-compact の差を載せた木）を起点に、起草 w64a の試作の commit 7bdb7c00 との差を write-set の書く file 12 だけで切った（git diff --no-color --full-index・83,959 byte）。da99fa55 の木で git apply --check が rc 0・git apply --reverse --check が rc 1、試作の木で git apply --reverse --check が rc 0 を見た。席の積みの木 d5bea76a（第 1 段の 8 行の試作を順に積んだ木）にも git apply --check が rc 0 で当たる。 席の積みの写し drafts/s26p2 では、第 1 段の 9 行と c-unref-lc の試作の後の木 e39618c7 に m-map-tree と m-map-graph の差をこの順に当て（どちらも git apply --check が rc 0）、続けて c-case-columns・c-ledger-lc・m-gview-drop を積んだ木 cba17695 で xtask の check が rc 0（歯 2,911 本が緑）。

      なぜ。判断の記録 ADR-27 の決定 (1)(2) は project board の地図の面を消し、要件 FR5 は地図の頁を持たない。行 m-map-page が頁と面の切り替えを、行 m-map-compact が圧縮の面と一覧の面を消した後、どの頁も描かない表の面と 2 つの木の面を消す（地図を消す鎖の 3 つ目）。

      形。(a) src/mapview/table.rs（233 行）と src/mapview/tree.rs（501 行）を消し、mapview/mod.rs の 2 つの mod の宣言と頭の doc の行を直す。(b) 近傍の図とグラフの部品と節点の頁の近傍が引く辺の型の電文の字 edge_name は、本体を字を変えずに mapview/around.rs へ移す（宣言の行は pub fn edge_name(t: EdgeType) -> String {・doc の行は表の面から移した字に直す・around.rs に use tsuzuri_contract::wire の行を足す）。引く 3 か所（mapview/graph.rs・mapview/graph/dom.rs・project/nodearound.rs の wasm の DOM）の use の行は table から around へ替え、rustfmt の順に並べ直す。(c) 2 つの面だけが引いた mapview/mod.rs の 6 項を消す: unread_reasons（表の面の頭の理由の行）・RETIRED と RETIRED_UNREAD と retired_notes と retired_unread（設計の木の廃止の段・行 g-map-retired）・kinds_by_id（表の行列の種類の引き）。使わなくなった use（BTreeMap・BTreeSet・GraphSource・unread_reason）を外す。行 m-map-compact が表の面へ移した pair_value と with_pair と 3 つの鍵は表の面と一緒に消える。(d) 歯。消す歯の file は tests/mtree.rs（mtree_views_six_in_url・mtree_vocab_budget・mtree_nests_table_closed・mtree_design_on_fixture・mtree_ledger_on_fixture・mtree_items_and_keys・mtree_odd_edges_keep_shape・mtree_unread_and_empty・mtree_dom_text・mtree_names_stay_apart の 10 本）と tests/gmret.rs（gmret_tree_folds_retired・gmret_unread_folds_nothing・gmret_dom_wiring・gmret_names_clean の 4 本・どれも木の面か (c) の廃止の段の項を測る）。残る file から消す歯は mapview_table_counts_and_pair_filter（tests/mapview.rs）。書き替える歯は mapview_classes_and_keys_exist（照らす file から table.rs を外し、必ず使う class の一覧から mx・mxwrap・mxlist・pair・empty を、語の鍵の照らしから matrix を外し、行列の升の class を足す行を消す・残る鍵 st_unknown は 1 つなので for でなく assert で照らす）と mtips_dom_text（表の行列の cell の注釈の照らしと手伝いの関数 dom_part を消し、グラフの数の行の照らしだけにする）と、2 file の頭の doc の行と use の行。新しい歯は tests/bvmtbl.rs の 3 本（bvmtbl_files_gone・bvmtbl_edge_name_moved・bvmtbl_orphans_gone）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。(1) は verify の 1 行目、(2) は 2 行目の clippy、(3)〜(5) は 3 行目の歯 bvmtbl、(6) は 4〜5 行目の面の歯 2 file、(7) は surface-build の行、(8) は check の行で測る。

      構造の連鎖。表の面と木の面を引く src は edge_name の 3 か所の use だけ（2 つの面の DOM の view はどの頁も呼ばない・地図の頁は行 m-map-page で消えた）。(c) の 6 項は 2 つの面と消す歯のほかに引く所が無い（account の home.rs の RETIRED_KEY は別の名）。生きたノート surface-board の verify の filter mapview_ は残る歯 6 本で当たる。接頭辞 mtree_ と gmret_ はどの生きたノートの verify にも無い（境界の歯 gmretw は契約の欄 retired を測り、この行は触れない）。

      試作と噛み。試作は da99fa55 の上（係の写し drafts/w64a・branch proto-w64a）。書いた file は write-set の中で閉じる。面の歯 793 本（消した 15 本・足した 3 本）が緑、cargo clippy -p tsuzuri-surface --all-targets --no-deps -- -D warnings が rc 0、cargo run -q -p xtask -- check が rc 0（工房の歯 2,888 本）、surface-build が rc 0。噛みは 5 つの変異で、表の面の file を置く・kit の doc に mapview::tree の字を足すは bvmtbl_files_gone が、edge_name が引用符を外さない・mod.rs に 2 つ目の fn edge_name を足すは bvmtbl_edge_name_moved が、mod.rs に kinds_by_id を戻すは bvmtbl_orphans_gone が、どれも rc 100 で落ちた。

      流す時と順。depends は m-map-compact（差はその試作の上で切った）。m-map-compact の着地の後に流す。続く行 m-map-graph は、この行の試作の commit 7bdb7c00 を起点に切った。

      範囲の外。語の辞書 vocab.json と stylesheet style.css の表の面と木の面の語と class（matrix・view_design・view_ledger・mx・mxwrap・mxlist ほか）は第 2 段の行 g-help-sweep で掃く。lib.rs の頭の doc の行の地図の面の部品の列の字（圧縮・一覧・表）は古いまま残す（同じ行で直す）。グラフの面の DOM と面だけの項は行 m-map-graph で消す。
  - n: 14
    type: prose
    title: 行 m-map-graph — 地図のグラフの面の DOM と面だけの項を消す
    body: |
      在りか。差の file docs/design/patch/m-map-graph.patch は、行 m-map-tree の試作の commit 7bdb7c00 を起点に、起草 w64a の試作の commit 39a7f08e との差を write-set の書く file 15 だけで切った（git diff --no-color --full-index・123,507 byte・gate の上限 150,000 byte の内なので行を割らない）。7bdb7c00 の木で git apply --check が rc 0・git apply --reverse --check が rc 1、試作の木で git apply --reverse --check が rc 0 を見た。席の積みの木 d5bea76a に m-map-tree の差を当てた木にも git apply --check が rc 0 で当たる。

      なぜ。判断の記録 ADR-27 の決定 (1)(2) は地図のグラフの面を消し、近傍の図（個別の頁）を残す。要件 FR5 は地図の頁を持たない。地図を消す鎖の末として、どの頁も描かないグラフの面の DOM と、残る部品が引かない面だけの項を消す。眺めの口 /api/graph/view を読むのはこの DOM だけなので、面の側を先に消し、口を消す行 m-gview-drop を後に流せるようにする。

      形。(a) src/mapview/graph/dom.rs（628 行）を消し、graph.rs の dom の宣言と再公開の行を消す。(b) 消す項の決め方: 試作で mapview の mod graph を一時 crate の内に下げ、host と wasm の target の両方で組み立てて、どちらでも使われないと出た項（rustc の dead_code）を消し、使われない項と use が出なくなるまで繰り返した（下げた字は戻した）。graph.rs から消す項は impl の塊を含めて 55: 眺めの口の読み（PATH・REASON・doc）・配置（NODE_W から BOTTOM までの 11 の pub の定数と COL_W・ROW_H・count・Column・Layout とその impl・lane_key・lanes_of・stack_bands・layout）・線の両端と道（line_ends・edge_path）・箱の SVG（BOX_TITLE_CHARS・band_var・kids_badge・head_mark・node_svg）・帯の塗りと図（BandFill・band_fill・zero_text・svg・bands_svg・band_labels・lane_labels）・狭い幅の一覧と数の行（ChainRow・ChainBand・chain・count_line・expert_line）・拡大と移動（ZOOM_MIN から DRAG_SLOP までの 6 の定数・Zoom とその impl・initial_scale・box_height・dragged）・opens_node。graph/fold.rs から消す項は 7: OpenList とその impl・mark_svg・GROUP_TITLE_CHARS・group_lines・refused_line・LEGEND_GROUP。band.rs から消す項は 1: unread_reason（読めなかった出所の帯の理由・引いた mod.rs の unread_reasons は行 m-map-tree で、graph.rs の bands_svg はこの行で消える）。使わなくなった use を外し、graph.rs と fold.rs の頭の doc の行と fold の mod の doc の行と mapview/mod.rs の頭の doc の 2 行を直す。LineStyle の ALL は src から引かれないが、残る型の閉じた一覧で歯 mapgraph_line_style_table が引くので残す。(c) graph.rs に残る pub の項の名は file の順に次の 33: NODE_H・Pos・Lane・BandRow・LineStyle・line_style・curve・straight・line_svg・legend_line・esc・cut・round_mark・open_question・closed・border・LEGEND_SHAPES・LEGEND_BORDERS・LEGEND_HOVER・Legend・legend・edge_term・HUB_DEGREE・LIT_MAX・DEPTH・Side・Highlight・degrees・highlight・PinBar・PinAction・pin_next・fold。fold.rs に残る pub の項は fold_key と plain_title（と公開しない関数 group_title）。(d) 歯。消す歯の file は tests/graphnav.rs（gnav_enter_space_decide・gnav_hrefs_open_same_id・gnav_dom_wires_open・gnav_chain_rows_are_anchors・gnav_dom_moved_out・gnav_names_stay_apart の 6 本・frame の node_href と nodearound の id_of の往復は frame.rs と nodepage.rs の歯も測る）と tests/mtips.rs（mtips_dom_text）。残る file から消す歯は btuck_open_list・btuck_group_box_svg・btuck_chain_group_rows・btuck_refused_line・cgdom_wiring_text・glabel_box_first_line・glabel_chain_titles・glabel_refused_titles と、mapgraph の 11 本（mapgraph_fixture_layout_matches_table・mapgraph_nine_in_one_cell_wrap_to_second_column・mapgraph_empty_view_layout・mapgraph_edge_path_text・mapgraph_kids_badge_and_ids_in_every_box・mapgraph_zoom_values・mapgraph_narrow_chain_order・mapgraph_count_lines・mapgraph_unread_band_and_zero_band・mapgraph_read_three_values・mapgraph_path_and_no_new_dependency）と、それだけが使う手伝いの関数と定数。書き替える歯は cgdom_view_cards_cover（図の data-key と一覧の行の照らしを外し、card の鍵と値だけ）・cgdom_names_clean（下限 3 を 2）・btuck_vocab_keys（gf_refused と view_graph の照らしを外す）・btuck_dom_wiring_text（DOM の字の照らしを外し、graph.rs の mod の行と fold.rs と外の依存だけ・名は替えない）・btuck_own_names_clean（下限 8 を 4）・glabel_own_names_clean（下限 6 を 3）・mapgraph_node_border_and_faded（箱の SVG の照らしを open_question と closed の照らしに）・mapgraph_legend_bands_and_types（語の鍵の照らしから lines・zoom_reset・zoom_hint・view_graph を外す）・evkind_path_kinds_table と evkind_seat_reloads_two が引く手伝いの paths（数 14 を 13 にし眺めの口の行を外す）・parts_paths_distinct_in_block_modules（グラフの module の口の照らしを外す・名は生きたノート surface-board の verify が名指すので替えない）・mapview_classes_and_keys_exist（照らす file から graph/dom.rs を外し、必ず使う class を node・hit・lk・shape に）と、各 file の頭の doc の行と use の行。新しい歯は tests/bvgdom.rs の 3 本（bvgdom_file_gone・bvgdom_no_view_path・bvgdom_items_exact）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。(1) は verify の 1 行目、(2) は 2 行目の clippy、(3)〜(5) は 3 行目の歯 bvgdom、(6) は 4〜10 行目の面の歯 7 file、(7) は surface-build の行、(8) は check の行で測る。

      構造の連鎖。グラフの面の DOM の view はどの頁も呼ばない（地図の頁は行 m-map-page で消えた）。DOM が引いた部品（widgets の help と hover・nodecard の view_cards・project の ALERT_STYLE と unmeasured・mapview の band_chip ほか）は近傍の図と節点の頁がまだ引くので消えない（試作で src の名を照らした）。graph.rs の残る項を引くのは mapview/around.rs（BandRow・Lane・NODE_H・Pos・border・closed・curve・cut・esc・line_style・line_svg・open_question・round_mark）・project/nodearound.rs の wasm の DOM（凡例と光らせ方と固定の項）・widgets/nodecard.rs（cut と fold の fold_key と plain_title）・project/pipeline.rs と account/mod.rs（cut）・account/home.rs（esc）。生きたノート surface-board の verify の filter mapgraph_ は残る歯 8 本、mapview_ は 6 本で当たり、parts_paths_distinct_in_block_modules は名のまま緑。境界と中核の crate は書かない（口を消す行 m-gview-drop が書く）。

      試作と噛み。試作は 7bdb7c00 の上（係の写し drafts/w64a・branch proto-w64a）。書いた file は write-set の中で閉じる。面の歯 770 本（消した 26 本・足した 3 本）が緑、cargo clippy -p tsuzuri-surface --all-targets --no-deps -- -D warnings と wasm の target の clippy が rc 0、cargo run -q -p xtask -- check が rc 0（工房の歯 2,865 本）、surface-build が rc 0。噛みは 6 つの変異で、DOM の file を置くは bvgdom_file_gone が、kit の doc に眺めの口の字を足すは bvgdom_no_view_path が、graph.rs に PATH を戻すは bvgdom_no_view_path と bvgdom_items_exact が、graph.rs に opens_node を戻す・fold.rs に GROUP_TITLE_CHARS を戻す・band.rs に fn unread_reason を戻すは bvgdom_items_exact が、どれも rc 100 で落ちた。席の積みの木 d5bea76a に m-map-tree とこの行の差を当てた木でも cargo run -q -p xtask -- check が rc 0（工房の歯 2,900 本）だった。

      流す時と順。depends は m-map-tree（差はその試作の上で切った）。m-map-tree の着地の後に流す。口 /api/graph/view を消す行 m-gview-drop（面の crate を書かない）はこの行に依り、この行の着地の後に流す。その差は席が c-unref-lc・m-map-tree・この行・c-case-columns・c-ledger-lc の試作の後の木 178ac801 で切り直し、当てた木 cba17695 で xtask の check が rc 0 だった。

      範囲の外。語の辞書 vocab.json と stylesheet style.css のグラフの面の語と class（gf_refused・view_graph・lines・zoom_reset・zoom_hint ほか）は第 2 段の行 g-help-sweep で掃く。契約の型 GraphView と doc の字は替えない（近傍の図が使う）。グラフの電文の読みの module の名 map は替えない。src から引かれない around の edge_path と band の kind_from_name は、地図を消す鎖の前から src に引く所が無く、歯 nodepage と mapview_kind_table_is_closed が測るので、この行では触れない。
  - n: 15
    type: prose
    title: 行 c-case-columns — 走行の無い札の Blocked と Queued を局面の出力の部品で分ける
    body: |
      在りか。起点は第 1 段の試作の積みの commit d5bea76a（main ef01b1fc の上に m-map-page・m-map-compact・m-more-drop・c-pipe-five・c-landed-12h・c-bead-facts・c-bead-route・c-case-read・c-run-verdict の試作を積んだ木・写し drafts/s26p1）。差の file docs/design/patch/c-case-columns.patch は起草 w64b の試作の commit e5f9c33c（写し drafts/w64b）から git diff --no-color --full-index で write-set の 5 file だけを切った（22,435 byte・5 file・429 行足して 3 行消す・src は 3 file で 72 行足す・歯は 2 file で 357 行）。起点の木で git apply --check が rc 0、試作の木で git apply --reverse --check が rc 0。同じ境界の server/board.rs を書く行 c-unref-lc の試作の後の木（席の積みの e39618c7 に m-map-tree と m-map-graph を当てた木 964a6e13）にも git apply --check が rc 0 で当たる（c-unref-lc の差もこの差の後の木に当たる）。席の積みの写し drafts/s26p2 では 964a6e13 にこの行と c-ledger-lc と m-gview-drop を積んだ木 cba17695 で xtask の check が rc 0（歯 2,911 本が緑）。

      なぜ。判断の記録 ADR-27 の決定 (6) と要件 FR10（第 0.22 版）が、板の Blocked の列を相手を待つ物（器の局面 run-blocked と、局面 contract-queued のうち理由が dependency・overlap・reserved の物）、Queued の列を contract-queued のそのほかの理由の物と決めた。今の中核の queued_cards は台帳の blocks だけで割り、理由と列に入った時刻を持たない。器の局面 run-blocked の元の段（RunStage の段 Blocked・承認待ち）は今の stage_of の表に無く、札が作られず unmapped に数えられる。局面の出力の読み（型 CaseDoc・中核 cases_of・境界の読みの出所 Cases）は行 c-case-read が置いた。

      形（要約・字は差の file）。中核の src/pipeline.rs に定数 CONTRACT_PART（contract）・QUEUED_PHASE（contract-queued）・PARTNER_REASONS（dependency・overlap・reserved）と、関数 board_with_cases（台帳の字・event log の字・CaseDoc・今の時刻）を足す。board_with_cases は board の板を組んだ後、出力の parts が読めれば走行の回数 0 の札ごとに契約の部品（種類 contract で id が札の bead id）を探し、局面が contract-queued なら段を queued_of（理由の語が PARTNER_REASONS なら Blocked・ほかと理由の無い部品は Queued）・理由と since を部品の字にする。部品が無いか局面が違えば札は queued_cards の台帳の割りのまま。stage_of の表に RunStage の段 Blocked を足し、段 Blocked で理由は detail の字（空なら None）にする（器の局面 run-blocked は器の Stage::Blocked から写すので、出力が読めない時も同じ列になる）。境界の server/board.rs の pipeline に引数 cases（CaseDoc）を足して board_with_cases を呼び、routes/pipeline.rs は要求のたびに Shared の cases の 2 つの字を読み cases_of で CaseDoc にして渡す。札の型 PipelineCard と電文の形は替えない。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done (1) は verify の 1 行目（git apply --reverse --check）。done (2)〜(6) は 3 行目（歯 bvqcol_ の 5 本）。done (7) は 4 行目（歯 bvqsrv_ の 2 本）。done (8) は最後の行（xtask の check）。2 行目（中核と境界の clippy）は足した src が unwrap・expect・panic・添え字を使わないことと関数の長さ（60 行）を見る。

      構造の連鎖（起点の木で grep と組み立てで全部）。中核の stage_of を呼ぶのは pipeline.rs の mapped_stage と account/project.rs の run_line（account board の席の行の段）。run_line は段 Blocked を止まりの段に数えないので、承認待ちの走行の席の行の状態は今と同じ（段の欄が None から Blocked になる）。境界の board::pipeline を呼ぶのは routes/pipeline.rs だけ（歯 pmisroute.rs と server_read.rs の pipeline は口を素の TCP で撃つ同じ名の歯の関数で、board::pipeline を呼ばない）。中核の board と board_with_doctor と of_parsed（next_step が呼ぶ）は替えない。歯の接頭辞 bvqcol_ と bvqsrv_ は main の filter の語 358 と部分の字で重ならない（案の bvqpipe_ は pipe_ に当たったので替えた）。

      試作と噛み。試作は d5bea76a の上の 1 commit e5f9c33c で、書く file は write-set の 5 file の中で閉じる。中核と境界の clippy（--all-targets --no-deps）が rc 0、歯 bvqcol_ の 5 本・bvqsrv_ の 2 本・着地済みの pqueue の 4 本が緑、xtask の check が rc 0（nextest の 2,942 本が全部緑）。噛みは変異 7 つ（PARTNER_REASONS から reserved を外す・queued_of が常に Queued・since を写さない・理由を写さない・局面を照らさない・stage_of の段 Blocked を外す・口が出力を読まない）で、どれも rc 100（組み立ての失敗 101 は 0）、歯 7 本のどれも少なくとも 1 つの変異で落ちる。変異の無い対照は rc 0。

      流す時と順。depends は c-pipe-five（歯が列 PipelineColumn の Blocked を読む）・c-case-read（型 CaseDoc と cases_of と Shared の cases）・c-run-verdict（同じ中核の src/pipeline.rs を書き、差はその木から切った）。境界の server/board.rs は行 c-unref-lc も書くが、この差は c-unref-lc の前と後のどちらの木にも当たり、c-unref-lc の差もこの差の前と後のどちらの木にも当たるので、depends に置かない（器の重なりの待ちが 2 つを同時に走らせない）。同じ file を書く行 m-gview-drop はこの行に依り、席が差をこの行の試作の後の木で切り直した。

