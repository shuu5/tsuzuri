  - n: 16
    type: prose
    title: 行 c-ledger-lc — 走行の在る札の段も局面の出力の部品から読む
    body: |
      在りか。起点は行 c-case-columns の試作の commit e5f9c33c（第 1 段の試作の積み d5bea76a の上・写し drafts/w64b）。差の file docs/design/patch/c-ledger-lc.patch は起草 w64b の試作の commit b5d5a117 から git diff --no-color --full-index で write-set の 2 file だけを切った（25,575 byte・2 file・444 行足して 49 行消す・src は 149 行足して 49 行消す・歯は 295 行）。起点の木で git apply --check が rc 0、試作の木で git apply --reverse --check が rc 0。この差は行 c-case-columns の差が当たった木にだけ当たる。

      なぜ。計画 surface-plan の計画だけの行 c-ledger-lc（持ち主の答え・段は器の 1 つの関数が決め tsuzuri は描くだけ）を、判断の記録 ADR-27 の決定 (10) の後の形で契約の行へ移す。行 c-case-columns は走行の無い札だけを局面の出力で決める。走行の在る札は今も tsuzuri の自前の段の計算（stage_of の閉じた表）で決まり、器の段 RateLimited のように表に無い段の走行は札にならず unmapped に数えられる。この行は、局面の出力が読めれば走行の在る札の段も器の局面の語から読み、器と同じ列に置く。

      形（要約・字は差の file）。中核の src/pipeline.rs に定数 RUN_PART（run）・RUNNING_PHASE（contract-running）・SETTLED（settled）・REFUSED_PHASE（contract-refused）・CLOSED_PHASE（contract-closed）と、便の局面の閉じた表 RUN_PHASES（14 語と段）と、型 Phased（Waiting・Run・Unknown）と関数 phase_of（部品の列と bead id）を足す。phase_of は契約の部品が無いか contract-closed なら None、contract-queued で理由が settled でなければ Waiting（段は queued_of）、contract-refused は Waiting（Queued）、contract-running と理由 settled の contract-queued は結び runs の最初に見つかる便の部品の局面を RUN_PHASES で引いて Run（表に無い語は Unknown・便の部品が無ければ None）、ほかの契約の局面は Unknown。board_with_cases は parts を板の組み立て of_cases へ渡す形に替える（of_parsed は parts を None にして of_cases を呼ぶ）。走行の在る札は関数 decide で、Phased が None なら event log の段と時刻、Waiting は部品の理由と since、Run は event log が段を持てばその理由と時刻・持たなければ便の部品の字、Unknown は札を作らず unmapped に数える。台帳で閉じた bead の札は今までどおり Landed と閉じた理由。CI の読み（ci_reading と with_ci）は段が Landed で event log の段も Landed の時だけ渡す。走行の無い札（queued_cards）は phase_of が Waiting か Run なら部品の段と理由と since、ほかは台帳の割り。of_cases の長さ（clippy の 60 行）に収めるため、bead の最新の走行の読みを引く 4 つの let-else を関数 latest に移した。札の型 PipelineCard と電文の形は替えない。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done (1) は verify の 1 行目（git apply --reverse --check）。done (2)〜(9) は 3 行目（歯 bvlc_ の 8 本）。done (10) は最後の行（xtask の check）。2 行目（中核の clippy）は足した src の関数の長さ（60 行）と複雑さ（15）と unwrap・expect・panic を見る。

      構造の連鎖（起点の木で grep と組み立てで全部）。板の札を読むのは境界の口 /api/pipeline（行 c-case-columns で board_with_cases を呼ぶ）と面の板と台帳の一覧の項の段（面の kit.rs の stages・行 c-ledger-stage のつなぎ）で、どれも札の段をそのまま描くので、一覧の項の段もこの行で局面の出力の段になる。中核の next_step（of_parsed を呼ぶ）と account/project.rs（stage_of を呼ぶ）と runs_of（走行の時間軸）は局面の出力を読まず、今のまま。歯の接頭辞 bvlc_ は main の filter の語 358 と部分の字で重ならない。fixture tests/fixtures/case/lifecycle.json は行 c-case-read が置いた物を読むだけ。

      試作と噛み。試作は e5f9c33c の上の 1 commit b5d5a117 で、書く file は write-set の 2 file の中で閉じる。中核と境界の clippy（--all-targets --no-deps）が rc 0、歯 bvlc_ の 8 本・行 c-case-columns の歯 bvqcol_ の 5 本と bvqsrv_ の 2 本が緑、xtask の check が rc 0（nextest の 2,950 本が全部緑）。噛みは変異 11（run-landing を Running に・settled の照らしを逆に・知らない契約の局面を event log の段に・知らない便の局面を event log の段に・閉じた契約を分からないに・断りを分からないに・CI を段に依らず付ける・台帳の閉じを見ない・便の局面で部品の理由を写す・走行の無い札が部品を見ない・便の部品の種類の字）で、どれも rc 100（組み立ての失敗 101 は 0）、歯 8 本のどれも少なくとも 1 つの変異で落ちる。変異の無い対照は rc 0。

      流す時と順。depends は c-case-columns（同じ中核の src/pipeline.rs を書き、差はその試作の木から切った・関数 board_with_cases と queued_cards を書き替える）。計画 surface-plan の 9 節の計画だけの行 c-ledger-lc はこの行を置く commit で外す。

      範囲の外（この波で入れない分・計画だけの行は増やさない）。tsuzuri の自前の段の計算 stage_of 系（stage_of・mapped_stage・ci_reading・with_ci）は外さず、局面の出力が無いか読めない置き場と、部品の無い契約（器の部分の書き直しの出力は scope partial）の代わりの読みとして残す。行 c-pipe-ci の CI の読みも残す（便の部品の理由は最新の終端の語 1 つだけで、終端の語を重ねる読みを組めない）。行 c-ledger-stage のつなぎ（面の一覧の項が板の札の段を引く）を外し、一覧に局面の語と手番を直に出すこと（面の行 g-unref-lc）。手番（user・seat・vessel・runner・ci・none）を札に載せること（PipelineCard に欄を足さず、面が /api/cases を id で結ぶ）。epic と memo と問いの局面（板に出さない・判断の記録 ADR-27 決定 (6)・一覧は面の行）。account board の席の行と次の一手の段。
  - n: 17
    type: prose
    title: 行 m-gview-drop — 地図だけが読む口 /api/graph/view と中核の眺めの組みを消す
    body: |
      在りか。差の file は docs/design/patch/m-gview-drop.patch。起点は席の積みの写し drafts/s26p2 の commit 178ac801（main ef01b1fc の上に、第 1 段の 9 行と c-unref-lc・m-map-tree・m-map-graph・c-case-columns・c-ledger-lc の試作を順に積んだ木）。起草 w63f の差（main ef01b1fc で切った・試作は係の写しの commit bd6b311f）は c-unref-lc の後の木に当たらないので、席が 178ac801 の上に 3 方向の当てで積み（commit cba17695）、write-set の書く 17 file だけで切り直した（git diff --no-color --full-index）。足す字と消す字は w63f の差と同じで、替わったのは文脈の行と行の番号だけ。178ac801 の木で git apply --check が rc 0、cba17695 の木で git apply --reverse --check が rc 0。git diff の byte は 76,916（gate の上限 150,000 の内なので行を割らない）。17 file の差は 46 行を足し 1,785 行を消す（消す 4 file で 1,504 行）。

      なぜ。判断の記録 ADR-27 決定 (2) で project board の地図の 6 面を消す。口 GET /api/graph/view（地図のグラフの眺め・電文 GraphView）を読むのは面の地図のグラフの面（面の crate の mapview/graph/fold.rs の path と graph/dom.rs）だけで、account board・節点の頁・近傍の図・節点の card・pipeline・抜けの検査・問いの card は読まない（近傍の図は /api/around、節点の card と抜けの検査と問いの card は /api/graph を読む・試作で面の src を grep で照らした）。地図と一緒に、境界の口と、中核の眺めの組み（view と view_open）と、眺めだけが使う組の木と開き（中核の graph/fold.rs）を消す。要件 FR5 の注（要件書 第 0.22 版）が、グラフの箱の畳み（見える箱 40 まで）を地図と一緒に消したと書く。

      形。境界: 口の file src/server/routes/graphview.rs を消す（口の列は組み立ての script が dir から作るので、列の字は書かない）。src/server/board.rs から関数 view と view_open と、頭の doc の口の 1 行と、use の GraphView を外す。中核: src/graph/view.rs と src/graph/fold.rs を消し、src/graph/mod.rs から pub mod fold と pub mod view と pub use view::{view, view_open} を外し、頭の doc の眺めの 2 行を 1 行に直す。近傍が引く私の関数 count（数を電文の幅へ）は src/graph/around.rs の末へ移す（体は元のまま・use super::view::count を外す）。fold.rs の組の木（Tree・Opening・TreeBox）は pub(super) で view_open だけが使うので、view_open を消すと死んだ code になり clippy の -D warnings が落とす。だから fold.rs ごと消し、fold.rs だけが引いていた VIEW_CAP（view.rs）も一緒に消える。fold.rs の pub の open_list と CHUNK は、消す口と歯 gtuck だけが使っていた。契約の型 GraphView・ViewNode・ViewEdge・BoxFold と snapshot graph.json と契約の歯 cform_graph.rs・cfsplit.rs は残す（面の近傍の図 mapview/around.rs の as_view・view_node・edges と、節点の card の view_cards・group_card と、nodearound が使い続ける）。

      歯。消す歯（fn の名）: 中核 tests/gtuck.rs の 10 本を file ごと（gtuck_wire_defaults・gtuck_levels_example・gtuck_refold_oldest・gtuck_bands_make_room・gtuck_refuse_and_ignore・gtuck_chunk_ids・gtuck_real_every_node_boxed・gtuck_open_list_split・gtuck_pure_text・gtuck_own_names_clean）。中核 tests/gview.rs の gview_example_view・gview_hub_619_view_is_capped・gview_cycle_view_returns と、眺めだけの助けの view_nodes・view_edges。中核 tests/dnrow.rs の dnrow_view_band。境界 tests/server_view.rs の server_view_graph_view_matches_core・gtuck_route_open_query と助けの pct。名を替える歯: dnedge_view_and_around は dnedge_around_rows に（眺めの半分を外し、近傍の半分は字のまま）。hbroute_keys_cover_twelve_gets は hbroute_keys_cover_eleven_gets に（鍵の列から Exact の /api/graph/view を外し、その鍵が無いことを見る assert を足す）。g3g7_doc_and_view_carry_edges は g3g7_doc_carries_edges に（board::view の 2 つの assert を外す）。足す歯: server_view_graph_view_gone。字を直す歯: server_view_bd_fails_unknown（眺めの読めない出所の照らしを、/api/graph の電文 GraphDoc の unread が Ledger だけの照らしに替える）・server_view の ROUTES を 2 つに・rhold と lsnap の ROUTES を 10 から 9 に（注と assert の数の字も）・rhold_wiring_text の名の列から graphview を外す・nsumw_routes_carry_fields から眺めの電文の照らしを外す・server_coalesce_graph_routes_share_one_folio の 3 つ目の要求を /api/graph/view から /api/around?id=R-25 に替える（近傍の口も gather_held(true, true) で設計の索引を読むので、口をまたいで設計の道具の読みを束ねる見張りをそのまま測れる）。歯 gview_hub_threshold_matches_rule_r20 は消さない。gview.rs は近傍・辺の向き・自然な順・次数の歯 9 本の file として残るので、移さずにその場に置く（頭の doc の 1 行から眺めの語を外す）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done (1) は verify の 1 行目、(2) は 2 行目の clippy、(3) は hbroute の行、(4) は server_view の行、(5) は server_coalesce の行、(6) は gview の行、(7) は nextest の 10 行の全部、(8) は最後の xtask の行で測る。

      構造の連鎖。起点 178ac801 の木で字 /api/graph/view を持つ file は、境界の src の 2 つ（routes/graphview.rs と board.rs の doc）と境界の歯の 6 つ（server_view・hbroute・rhold・lsnap・nsumw・server_coalesce）と、面の歯 bvgdom.rs（行 m-map-graph の歯・面の DOM がこの字を持たないことを見る・この行は書かない）で全部。面の地図のグラフの面（mapview/graph.rs の PATH と graph/dom.rs）と project/map.rs の doc と面の歯 mapgraph.rs・btuck.rs は、前の行 m-map-page と m-map-graph が消した（この行は面の crate を書かない）。中核の view と view_open と境界の board::view を呼ぶ所は、境界の board.rs と口の file と、境界の歯 server_view・nsumw・g3g7w と、中核の歯 gview・gtuck・dnrow・dnedge で全部（試作で clippy の --all-targets が中核と境界の歯の crate を全部組み立てた）。中核の graph::fold を引く所は、消す口の file（open_list）と中核の歯 gtuck だけ。中核の view::count を引くのは around.rs だけ。

      試作と噛み。試作の main は ef01b1fc。main の木で git apply --check が rc 0、試作の木で git apply --reverse --check が rc 0。試作の木で verify の全部の行が rc 0（中核の歯は全部の 290 本・境界の歯は全部の 1,483 本が緑・cargo clippy --workspace --all-targets -- -D warnings も rc 0・xtask の check も rc 0）。gview_hub_threshold_matches_rule_r20 は今の R-20 の字（main 55c5bcd2 で直した字）で緑。面の歯 parts_constants_match_rules_r20_r19 も同じ字で緑（この行は面の歯を書かない）。噛みは変異 5 つで、どれも名指した歯か clippy が落ちた（組み立ての失敗で落ちた変異は無い）。B1 消した口の file を GET /api/graph/view に 200 を返す口として戻す → hbroute_keys_cover_eleven_gets が rc 100。B2 同じ変異 → server_view_graph_view_gone が rc 100。B3 中核の graph/fold.rs を main の字（VIEW_CAP だけ私の const に）で戻し pub mod fold を足す → clippy が死んだ code（VIEW_CAP・Band ほか）で rc 101。B4 境界の近傍の口が設計の索引を読まない（gather_held の 1 つ目を false に）→ server_coalesce_graph_routes_share_one_folio が rc 100。B5 中核の HUB_DEGREE を 31 に → gview_hub_threshold_matches_rule_r20 が rc 100。 席の積みの木 cba17695（起点 178ac801 にこの差を当てた木）で xtask の check が rc 0（歯 2,911 本が緑・host と wasm の clippy と面の組み立てを含む）。

      流す時と順。depends は m-map-graph（面の地図のグラフの面がこの口を読むので、口を先に消すと地図のグラフが 404 で読めなくなる・その面を消す行の着地の後に流す）と、同じ境界の src/server/board.rs を書く c-unref-lc（tests/server_view.rs も書く）と c-case-columns（差はこれらの試作の後の木で切り直した）。境界の口が中核の view_open を呼ぶので、境界と中核を同じ行で消す（境界だけを先に消す割り方は要らない）。境界の歯 hbroute.rs・rhold.rs・lsnap.rs は口を足す行 c-bead-route・c-case-read も書いたが、それらは起点 178ac801 の木に入っている。

      範囲の外。面の crate（地図のグラフの面の DOM と PATH と面の歯・行 m-map-graph）。契約の型と snapshot graph.json と fixture tests/fixtures/surface/graph-view.json（面の近傍の図と面の歯と中核の歯 nsum が読み続ける）。設計ノートの口の一覧の字（生きたノート surface-base と surface-board の節の /api/graph/view の字・席が別に直す）。

