    title: 行 c-run-verdict — 走行の時間軸の口に gate と審査の内訳を足す
    body: |
      在りか。main ef01b1fc。差の file docs/design/patch/c-run-verdict.patch は、起草 w63g が main ef01b1fc に試作の commit（写し drafts/w63g の 84e5fdbe）を載せ、git diff --no-color --full-index で write-set の書く file の 7 だけを切った（置き場だけの =crates/tsuzuri-boundary/tests/runsdoc.rs は書かない）。main の木で git apply --check が rc 0、試作の木で git apply --reverse --check が rc 0。

      なぜ。判断の記録 ADR-27 決定 (7) の吹き出しは、止まりに理由の全文と run の歴（各回の結果）を出し、決定 (10) は gate と審査の内訳を便の dir の 2 つの file（verdict.json・review.json）から読むとした（要件 FR10 の note・器の席の答えの 1 節・どちらも schema 1）。gate の FAIL の観点ごとの件数（例 contract-fit の 1）と審査の理由の型（kind）と指した場所（at）は event log に載らない。この行は契約と中核と境界の電文だけを足し、吹き出しの表示は第 2 段の行（吹き出しの段の流れ）が書く。

      形。新しい口と新しい型の電文は足さず、今の口 GET /api/runs?bead= の電文 RunsDoc の走行 RunLine に欄 gate（Reading の GateVerdict）と review（Reading の ReviewVerdict）を足す。GateVerdict は verdict・evidence・findings（None か GateFinding の列・GateFinding は category と count）・at（欄 ts の時刻）、ReviewVerdict は verdict・evidence・kind・place（器の欄 at の字・lens が指した場所）・at（欄 ts の時刻）。語（verdict と kind と観点）は器の字のまま運び閉じた列で持たない（知らない語を「まだ分からない」に倒すのは面）。器の欄 verify_red・diff_bytes・tree・scope・population は写さない。2 つの欄は serde の既定を Unknown にし、鍵の無い電文（面の歯 tests/ntime.rs の fixture の形）も読める（契約の seat.rs の欄 tick と同じ形）。Reading は Eq を持たないので RunLine の derive から Eq を外す。中核は pipeline.rs に純粋な関数 gate_of と review_of（字から判定）と with_verdicts（RunsDoc の Known の走行ごとに、走行の id から file の字を返す 2 つの手で判定を置く）と定数 VERDICT_SCHEMA（1）を足し、runs_of の走行は 2 つの欄を Unknown で作る。読める字は JSON の object で欄 schema が数 1 で欄 verdict と evidence が字の物だけで、欄 findings が在れば字のコンマで区切った札がどれも空でない観点の語と字のコロンと数の時だけ読める（崩れた札が 1 つでも在れば gate は Unknown・欄が無ければ findings は None）。境界は server/runs.rs の Runs に欄 pipe（state dir の下の pipe）と関数 run_file と定数 PIPE_DIR・GATE_FILE・REVIEW_FILE を足し、run_file は run の id が path の普通の要素 1 つの時だけ pipe/<run id>/<file> を読む。口 routes/runs.rs は runs_of の後に with_verdicts を通す。変化の印は event log のまま（器は判定の file を書いた後に段の event を足すので、面は event log の変化で読み直す）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done (1) は verify の 1 行目（差の hunk が全部木に在れば rc 0、当てる前の木では rc 1）。done (2) は 2 行目の clippy。done (3)〜(7) は 3 行目の中核の歯 tests/bvverd.rs（7 本）。done (8) は 4 行目の中核の着地済みの歯 tests/runsdoc.rs。done (9) と (10) は 5 行目の境界の歯 tests/bvvroute.rs（3 本）。done (11) は 6 行目の境界の着地済みの歯 tests/runsdoc.rs（書かない・判定の file の無い置き場で口の電文が中核の runs_of の電文と同じままであることを見る）。最後の行の xtask の check は repo の全部の歯と床を撃つ（done の項は持たない）。

      構造の連鎖。RunLine の値を組むのは中核の runs_of の 1 か所だけ（欄を足す literal はそこと歯）。RunLine を読む面の src/project/timeline.rs は欄を名で読むので替えない。面の歯 tests/ntime.rs の電文の fixture は鍵 gate と review を持たないが、serde の既定で Unknown に読む。Runs を作るのは境界の server/mod.rs と cli/graph.rs の Runs::new で、欄 pipe は new が埋めるので替えない。契約の snapshot の群（tests/cfsplit.rs の GROUPS）は module runs を持たないので snapshot は替えない。口の一覧の歯は口を足さないので替えない。

      試作と噛み。試作は main ef01b1fc の写しで、書く file は write-set の中で閉じる（git diff --name-only ef01b1fc 84e5fdbe が write-set の書く 7 file と同じ）。xtask の check は試作の木で rc 0（workspace の歯 2,930 本が緑・面の wasm の clippy と surface-build を含む）。噛みは変異 12 を 1 つずつ当て、名指した歯の file を撃った（schema を見ない・崩れた findings を None に・place を kind から・審査に gate の file を渡す・run の id の守りを外す・口が判定を置かない・鍵の無い電文の既定を外す・RunStopped を段にしない・0 の件数を落とす・findings の無い字を空の列に・gate の時刻を捨てる・電文に gate を出さない）。どの変異も組み立ては通り（nextest の rc 100）、done (3)〜(10) の各歯は少なくとも 1 つの変異で落ちた（変異と落ちた歯の一覧は起草の notes）。

      流す時と順。depends は空。第 1 段のほかの行（地図を消す行・bead の事実の口・列の 5 つ・局面の出力の口・/api/graph/view を消す行）と書く file は重ならない見込み（中核の pipeline.rs は後の行 c-case-columns が書く見込みで、この行を先に置く）。

      範囲の外。吹き出しの表示と段の語の対応（第 2 段の行）。器の欄 verify_red・diff_bytes・tree・scope・population の写し。過去の判定の歴（器は便ごとに最後の判定だけを file に残す・各回の段の結びは event の RunStage の detail を今の steps の verdict と verdict_kind が持つ）。新しい口と変化の印の file の足し。

