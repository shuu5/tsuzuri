    body: |
      判断の記録 ADR-27（project board の作り直し）の第 1 段を流す。消す物（地図の 6 面と地図の頁と block・地図だけが読む口 /api/graph/view・口座の履歴と口座の「詳しく」・台帳の「詳しく」・ADR-27 決定 (2)）と、データの足し（bead の起票の時刻・短い題・概要・依存の相手を出す口・器の局面の出力 fleet/lifecycle.json を読む口・run の gate と審査の内訳・ADR-27 決定 (9)(10)）と、pipeline の板の 5 列（Blocked と Queued を分ける・着地の列は規則の行 R-36 の 12 時間・ADR-27 決定 (6)）を置く。上の固定の帯・窓・吹き出し・epic ごとの一覧・幅の 3 段（規則の行 R-35）の面の組み立ては、第 1 段の行の着地の後に第 2 段として行に割る（席の行の計画・台帳 t3-hub.52.160 の notes）。質問の頁と抜けの検査の頁と tab は、窓ができるまで持ち主が board で質問に答えられるよう第 2 段で消す。
