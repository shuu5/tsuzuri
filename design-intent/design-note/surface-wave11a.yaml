      規則の行 R-21 の面の半分と、pipeline の板の札の見分けの 2 行。
      面は、台帳の読みが落ちた応答の頭 X-Tz-Read-Age の秒と変化の知らせのつながりが切れた時刻から、出している中身の古さを 1 つの状態で数える。古さが 15 秒を越えれば 2 つの board の一番上の帯の最終の記録の後に読み込み不良の注意の印を 1 つ出し（hover の card に原因と秒）、つながりが切れても中身を 60 秒まで残し、最終の記録を最後に読めた時刻にする（g-fresh）。
      pipeline の板の Landed の列で、台帳で閉じた（着地せず）の札の表に、取り込みの印の替わりの薄い色の × の印と段の字を出す（g-closed-mark）。
      電文と中核と server と外の依存は変えない。
