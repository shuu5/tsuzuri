  - n: 3
    type: prose
    title: 行 g-fresh — 出している中身の古さを数え、読み込み不良の注意の印を出し、つながりの切れを 60 秒まで持ち回す
    body: |
      なぜ。持ち主の裁定 t3-hub.52.38（裁定 id = t3-hub.52.38:20260928T0154Z-1）と t3-hub.52.39（裁定 id = t3-hub.52.39:20260928T0155Z-1）と、それを写した規則の行 R-21 と要件 NFR2 の字。台帳の読みが落ちたときと変化の知らせのつながりが切れたときは、最後に読めた中身を 60 秒まで出し続け、出している中身が最後に読めた時から 15 秒を越えれば一番上の帯に読み込み不良の注意の印を 1 つ出し、60 秒を越えたら中身を 測れていない にする（つながりの切れは全部の口）。古さは server が読みの落ちた応答の頭に載せる最後に読めた時からの秒と、面の時計の経過で数える。server の半分は行 e-hold（着地済み・t3-hub.52.54・076666a）で、この行は面の半分（計画 surface-plan の 3 節の席の決めで g-fresh-a と g-fresh-b を 1 行にまとめた）。あわせて NFR2 の 面は最終更新（最後に読めた時刻）を出す を直す。今の 2 つの board の最終の記録は、読んだ本文が前と変わった時だけ進む（計画 4 節の重さの調べ）。
      在りか（main 2e0732e で確かめた）。契約の型の crate の src/ledger.rs（書かない・host と wasm で組む）に pub const READ_AGE_HEADER（&str・字 X-Tz-Read-Age）と READ_HOLD_S（u64・60）と READ_WARN_S（u64・15）が在る。境界の server（書かない・行 e-hold）は、台帳の読みが落ちたときだけ最後に読めた字を 60 秒まで返し、その応答に頭 X-Tz-Read-Age（最後に読めた時からの秒の 10 進の整数の字・一度も読めていなければ server が読みを始めた時からの秒）を付け、読めた応答には付けない。server の fn aged は読みが落ちている間は必ず頭を付けるので、60 秒を越えた後は頭の在る応答の中身が Unknown の電文になる。頭を付ける口は project board の 10 の GET の口（/api/ledger・/api/questions・/api/pipeline ほか）と口 /api/account（台帳の読みが落ちた project が在れば、その最も古い値）。変化の見張りは持ち回さず、読めるから読めないへ・読めないから読めるへ変わるたびに ledger-changed を送る。account board の口の project ごとの台帳の読みの戻りは、見張り（acct の印の file の変わり）が知らせない場合がある。面と server は同じ origin なので、頭は fetch の応答の Headers で読める。面の crate の Cargo.toml（書かない）の web-sys の feature に Headers と Response が在る。
      面の src/net.rs（書く・wasm の target のときだけ組む）の今。口の読みは async fn fetch_status（path を受け、読みの結果と状態の数の組を返す・200 で本文が字なら Fetched::Body）で、頭を読まない。登録された口は thread_local の READS（path・ArcRwSignal<Fetched>・Flight の組）と WATCHES（path の String・組の signal・Flight）。fn connect は EventSource を 1 本張り、on_open に Closure::<dyn FnMut()>::new(go_live) を、合図の 2 つの event に new(reload_all) を、on_error に new(lose_all) をそれぞれ 1 度置き、EventSource::new の誤りでは lose_all と go_live、合図の listener を足せなければ lose_all を撃ち、開くのを待つ上限（OPEN_WAIT_MS）の set_timeout は LIVE が偽なら go_live を撃つ。つまり今は知らせが切れた瞬間に全部の口が 測れていない になる。fn lose_all は READS の signal に Fetched::Failed を、WATCHES の signal に Failed と None の組を置く。pub fn now は Date::now の epoch 秒、pub fn ticker は 1 秒の時計（set_interval の呼びは file に 1 か所）。read の on_cleanup は read_flight(slot, |flight| flight.detach()) で、read_path は Effect の前の値 before（String の Option）に前の path を持ち、on_cleanup は watch_flight(slot, |flight| flight.detach())。src/flight.rs（書かない）の Flight の pub fn users は見ている部品の数。
      面の src/board.rs（書く）の fn top(page: PageId, mode: RwSignal<Mode>, screen: RwSignal<Screen>) の部品 updated（frame の HEADER の 3 つ目・class は chip num・語の鍵 last_record）は、screen.with(|s| s.updated_at) の時刻を clock_short と term で出し（title は clock の字・None なら測れていないの印と語の鍵 not_yet の語）、App は net::read(ledger::PATH) の値が変わるたびに view の Screen::after_read（書かない）で updated_at を置く。net の読みは同じ本文なら signal を置かない（view の settle が Keep）ので、最終の記録は本文が変わった時だけ進む。src/account/board.rs（書く）の App は RwSignal の updated（EpochSecs の Option）を持ち、電文の Memo が Some のたびに net::now() を置き（Memo は電文が変わった時だけ変わる）、fn top(query, mode, read, updated) の nav の部品の後の fn updated_chip(updated) が同じ形の chip を出す（class は account の UPDATED_CLASS の chip num・語の鍵は UPDATED_KEY の last_record）。どちらの App も HoverCtx を context に置き CardLayer を描く。
      面の widgets の hover（書かない）の pub struct Card（pub な欄 title・kind・value・src の String と more の String の Vec・derive は Debug と Clone と PartialEq と Eq と Default）と Card::rows（4 行・36 字を越える行は切る）は host でも組み、pub fn delegate（wasm の target のときだけ・Delegate を返す・Delegate の show は MouseEvent の参照と Card を、leave は MouseEvent の参照を受ける）が頁の card の層に card を出す。stylesheet（書かない）に規則 .warn（橙の inline-flex の chip・中の svg は 14px）が在り、問いの頁の ask.rs と batch.rs が class の値 warn を使う。見本の IC.warn の svg は viewBox 0 0 24 24・stroke-width 2.4・path M12 3l10 18H2z と M12 10v5 と cx 12 cy 18 の円。語の辞書 vocab.json（書かない）に見出しの語 読み込み不良・台帳の読み・知らせのつながり は無い（鍵 around の見出しの語は つながり）。
      形（fresh.rs・新・host でも組む）。Fresh の欄は pub でなく、頭の無い応答を最後に受けた時刻 seen（Option）と、頭の在る口の path から最後に読めた時刻（受けた時刻から頭の秒を引いた値・0 で止める）の表 held（BTreeMap）と、つながりが切れた時刻 lost（Option）。got は頭が無ければ held から path を外して seen を大きい方にし、在れば held に置く。record は held の最も古い値、held が空なら seen（最終の記録はその古さの起点と同じ値・つながりの切れは読みでないので最終の記録を動かさない）。age は held の最も古い値と lost の古い方から今まで。warn は age が READ_WARN_S を越えたとき（15 秒ちょうどは出さない）。card の value は、字 中身の古さ・空白・age・空白・字 秒・・READ_HOLD_S・空白・字 秒で測れていない の並び（age が 23 なら 中身の古さ 23 秒・60 秒で測れていない）。kind と src は held が在れば HELD_WORD と READ_AGE_HEADER、lost が在れば LOST_WORD と LOST_SRC を、この順に字 ・ でつなぐ。mod dom（wasm の target のときだけ）の pub fn mark は net の fresh と ticker を読み、Memo で warn（ticker の今）を持ち、真の間だけ span（class の値 warn・role の値 status・tabindex の値 0・aria-label は WARN_WORD）の中に見本の IC.warn の svg と WARN_WORD の字を出し、指が入ると delegate の show にその時の card（net の now）を、出ると leave を撃つ。印は Memo の値が変わった時だけ組み直す。
      形（net.rs）。thread_local に Fresh の ArcRwSignal（初めての呼びで作る・頁に 1 本）と、読み直しの待ちの印（Cell<bool>）を足し、pub fn fresh（ReadSignal<Fresh> を返す）で読ませる。fetch_status は 200 で本文が字の応答のとき、頭 READ_AGE_HEADER の値を read_age に通した秒と path を fn note に渡す（200 でない・届かない応答は古さに置かない）。note は now() で got を撃ち、値が変わった時だけ signal に置き、held が真で待ちが無ければ HELD_POLL_MS の後に 1 度だけ、そのときまだ held なら reload_all を撃つ（応答が来てまだ held なら次の待ちを置く・見張りが戻りを知らせない場合の拾い）。fn link_lost は now() で lose を撃ち、真（切れた最初の誤り）なら READ_HOLD_S 秒の後に、lost_since がその時刻のままなら lose_all を撃つ。EventSource は切れた後も繋ぎ直しを続け、そのたびの誤りは lose が偽なので待ちを増やさない。開くと fn link_back が back を撃つ。fn connect は on_error を new(link_lost) にし、字 open の event に add_event_listener_with_callback で new(link_back) を足す（足せなければ今の合図の listener と同じく lose_all）。on_open の new(go_live) と合図の new(reload_all) は 1 度ずつのまま。開くのを待つ上限の timer の go_live は触らない（開く前に切れた接続の時刻を消さないため、切れた時刻を消すのは開いたの event だけ）。read の on_cleanup は detach の後に users が 0 なら forget(path)、read_path は path が替わるとき前の path を forget し、on_cleanup で users が 0 なら今の path を forget する（見ていない口の古さを数えない）。lose_all・load_at・load_watch・reload_all・go_live・EventSource::new の誤りの枝と、read と read_path と reload_all と post の外形と、set_interval の 1 か所は変えない。
      形（2 つの board）。board.rs は fn top の screen の引数を外し（App の呼びは top(page, mode)・App の字 let screen = RwSignal::new(Screen::initial()); と provide_context(screen); は残す）、部品 updated の時刻を net::fresh() の Fresh::record にし、その chip の後に fresh::mark() を置く。account の board.rs は App の updated の signal と Effect と top の引数を外し、updated_chip を引数なしで net::fresh() の Fresh::record を出す形にし、nav の部品の updated_chip() の後に fresh::mark() を置く（要らなくなった use の EpochSecs は外す）。印は最終の記録の chip の後の 1 つだけで、HEADER の表と tests/snapshots/header.json は変えない（狭い幅では帯が折り返す・.top は 760px 以下で flex-wrap）。frame.rs・view.rs・vocab.json・style.css・Cargo.toml と境界と中核と契約の crate は書かない。
      着地済みの歯（直さずに通る・write-set の =）。tests/flight.rs の flight_net_wiring_text は net の fn read に LIVE.get() と .attach() と on_cleanup( と .detach()、read_path にさらに .renew()、load_at に .end()、load_watch に .end() と .round() と spawn_local の前の if path.is_empty() {、go_live に LIVE.set(true) と reload_all()、connect に set_timeout( と OPEN_WAIT_MS と、new(go_live) と new(reload_all) が 1 度ずつ在ること、lib.rs の pub mod flight; の前の行が cfg でないことを見る（この行はどれも保つ）。tests/steady.rs の steady_net_uses_settle_but_lose_all_does_not は net に settle(now, &fetched, attempt) が在り、fn lose_all の本文に signal.set(Fetched::Failed) が在り settle が無く、load_at に Settle の 3 つと RETRY_MS、read と reload_all と post の外形の字を見る。tests/ticker.rs の ticker_net_holds_one_interval は net の set_interval( が 1 度だけ（読み直しと lose_all の待ちは set_timeout で書く）。tests/aaround.rs の aaround_net_skips_empty_path は load_watch の if path.is_empty() {。tests/parts.rs の parts_ は src の二重引用符の /api/ の字（block の外は events の口の 1 つ）と EventSource::new( が src に 1 度と event の名の字の無さと net の RELOAD_EVENTS（fresh.rs はどれも書かない）。tests/frame.rs の frame_ は src の全部の file の class の値が stylesheet に在ること（warn は在る）と、語の辞書の日本語の見出しの語を二重引用符で囲んだ字が src に無いこと（3 つの語は見出しの語でない）。tests/mstore.rs・hsblock.rs・acctwire.rs は lib.rs の pub mod store; が cfg でなく pub mod board; と pub mod net; の前の行が cfg、2 つの board の mount の settle_mode と keep_mode、App の Screen の 2 行と block_view、戻るの字を見る。tests/brand.rs・smore.rs・lcard.rs・ncard.rs・ptitle.rs・hspage.rs は board.rs の題の span の brand( と、HelpCtx と HoverCtx の context と CardLayer と、PageSubject と doc_title( と、PageId の変種の名の無さを見る。tests/acctpop.rs・acctlook.rs・acctwin.rs・hcproj.rs・hcsess.rs は account の board.rs の popstate と push_state_with_url( ほかの字、mount の set_title( と set_name(windows::ACCOUNT_WIN)、HoverCtx と CardLayer を見る。
      write-set の外で直さずに通る歯。tests/accthome.rs の accthome_vocab_css_deps_and_frame（account の board.rs に字 home::view(block)）と tests/hcard.rs の hcard_dom_wiring（HoverCtx と CardLayer）は、この行が変えない字を見る（2 つの file は同じ波の行 h-cards-nx の write-set に在るので、この行は置かず、xtask の check が撃つ）。tests/acctframe.rs は src/account の file の名の列と /api/ ほかの字の無さを見る（fresh.rs は src の直下）。tests/topbar.rs と board_min.rs は view の clock_short と Screen の値を見る（view.rs は書かない）。語の辞書を全部の鍵で読む歯（hsym_・hfig_・pclosed_tag_copies_core・pfold_close_text・nstall_unjudged_box・nxact_texts_not_headings）は vocab.json を書かないので変わらない。
      測り方。新しい歯は面の crate の tests/gfresh.rs に置き、名を gfresh_ で始める。fresh の関数は host の値で見る（時刻は EpochSecs の数）。net と board の DOM は wasm の target だけで組むので、字の歯と xtask の surface-build と check（wasm の clippy を含む）で見る。関数の本文の字は、字 fn 名( から次の行頭の fn・pub fn・async fn・pub async fn の前まで。語は crate の vocab の vocab で引いて比べてよい。自分の名の歯は tests/gfresh.rs の字を読み、test の属性の行の次の fn の名を全部集め、名の数が 8 以上であることと done (10) を見る。試作（席の作業場の写しの main 2e0732e に同じ形を書いた）で、gfresh_ の 9 本と面の crate の着地済みの歯の全部（570 本）と host と wasm の clippy と xtask の surface-build が通った。
      filter の語（着地済みの行の verify の filter の語と、計画の後の行 g-gz の接頭辞 pgz_ と、同じ波の行の接頭辞 cmark_・hcled_・hcnx_・pquest_・stlaunch_・この行の接頭辞 gfresh_ は並べない・ほかの語を部分の字として含む語は省いた）は aaround_・accept_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・board_min_・bport_・brand_・btuck_・cadopt_・cgdom_・cmark_・contract_form_・cround_・csled_・denv_・flight_・fmark_・frame_・fserve_・fstop_・gapspage_・ghb_・glabel_・gnav_・graph_・gsum_・gtuck_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hfig_・hook_・hruling_・hsblock_・hsderive_・hspage_・hsym_・iclose_・ilink_・kcli_・klink_・lcard_・ledgerblock_・lhome_・lspark_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・parts_・pclosed_・pfold_・pgz_・pipe_・plimit_・pmore_・pquest_・project_・ptitle_・pwhole_・qblock_・qgate_・qkey_・question_・rhold_・runsdoc_・saxis_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・steady_・stlaunch_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_ で、新しい歯の名から先頭の gfresh_ を除いた字は、このどれも部分の字として含まない（例 gfresh_frame_x・gfresh_parts_x・gfresh_steady_x は不可）。名は done に書いた gfresh_age_value_and_constants・gfresh_held_then_fresh・gfresh_link_lost_and_back・gfresh_forget_path・gfresh_card_rows・gfresh_words_not_headings・gfresh_net_text・gfresh_boards_text・gfresh_own_names_clean（どれも並べた語を含まない）。
      依存と順。depends は無い（行 e-hold と g-reads は着地済み・別のノート）。同じノートの行 g-closed-mark とは書く file も置き場だけの = も重ならないので並べて流す。計画の見込みの書く file のうち view.rs（古さの純粋な関数）と frame.rs（header の部品の表）と vocab.json（印の語の鍵）は、古さを新しい host の module fresh に置き、印を今の部品 updated の後に足し、語を file の定数にしたので書かない。これで計画 5 節の view.rs と vocab.json と frame.rs の鎖（g-jst → g-fresh・g-nav → g-fresh）はこの行に掛からない。残る重なりは board.rs（g-nav・g-pulse・g-seatpill ほか）・account の board.rs（g-pulse・h-dormant）・net.rs と tests/flight.rs（g-pulse・c-ev-kind）・tests/lcard.rs（g-jst が書く）で、まだ契約の行の無い g-jst と g-nav はこの行の後に流す（順は便の bead の依存で持つ）。
  - n: 4
    type: prose
    title: 行 g-closed-mark — pipeline の板の閉じた（着地せず）の札を着地の札と見分ける
    body: |
      なぜ。行 c-pipe-closed（着地済み・t3-hub.52.62）の後の pipeline の板で、台帳で閉じた契約 bead の着地しなかった札は Landed の列に置かれるが、札の表は着地の札と同じ見た目（取り込みの印の青い ✓・回数・経過）で、指を置いて hover の card を開くまで見分けられない。計画 surface-plan の 9 節の行 g-closed-mark（3 節の席の決め・拠りは持ち主の指摘 t3-hub.1 の裁定 id = user 2026-09-28T04:1xZ）。この行は札の表だけを直し、列の数え・並べ・hover・電文・中核は変えない。要件 FR10（pipeline の板と走行の節点）。
      在りか（main 2e0732e で確かめた）。面の src/project/pipeline.rs（書く・host でも組む・DOM は wasm の target のときだけの mod dom）に pub const CLOSED_TAG（&str・字 closed:）と pub const CLOSED_STAGE（&str・字 閉じた（着地せず））と pub fn closed_card（契約の PipelineCard の参照を受け bool・段の列が Landed で段の理由が CLOSED_TAG で始まるとき真）と pub fn kcard（PipelineCard の参照と台帳の行の slice を受け Kcard）が在る。pub struct Kcard（derive は Debug と Clone と PartialEq と Eq）の pub な欄は id・title・state（札の状態の記号の値・&'static str の Option・None は取り込みの印）・lead・age・class・hover・run_line・run_more。kcard は閉じた札の段の字を CLOSED_STAGE にし（hover の種類の行と run_line）、hover の詳しくに閉じた理由を折る。state は列の Lane の state（Landed の列は None）で、class は止まった列だけ字 kcard why-stop・ほかは字 kcard。with_nodes と node_hover は hover の値だけを替える。tests の下で Kcard を struct の式で組む歯は無く（tests/cadopt.rs の fn kc も kcard を呼ぶ・grep で確かめた）、src の下で Kcard を組むのは kcard だけなので、欄を足しても着地済みの歯と src は組める。
      mod dom の fn kcard_view（&Kcard と Mode を受ける）は、state が Some なら kit の state_icon、None なら span（class の値 st・style の値 color:var(--s-land)・inner_html は取り込みの印の const CHECK）を札の 1 行目の記号にし、札は a（class=card.class・href=card_href(card, mode)・use:attach=card.hover.clone()）で、meta の段に kid・lead（回数か止まった理由）・経過を並べる。stylesheet（書かない）の :root に色の変数 --ink-3 が在り（.muted の色・kcard の meta の字の色）、札の記号の class の値 st と kcard の規則も在る。見本の ui.js の IC.cross は viewBox 0 0 24 24・fill none・stroke currentColor・stroke-width 3・path M6 6l12 12M18 6L6 18。fixture の tests/fixtures/surface/pipeline-board.json（書かない）は cards が Known の 12 枚（px.1〜px.12・段 Queued・Blocked・Running・Gated・Questioned・Failed・Stopped と Landed が 5 枚）で、段の理由を持つのは px.5（about:write-set）と px.6（verify が赤）だけ。
      形。Kcard に pub な欄 closed（bool・doc は 台帳で閉じた（着地せず）の札か）を足し、kcard は closed_card(card) の値を置く。ほかの欄の値（state・class・lead・hover・run_line・run_more）は今のまま。mod dom に const CROSS（見本の IC.cross の svg に width 14 と height 14 を足した字）を足し、kcard_view は card.closed が真なら札の 1 行目の記号を span（class の値 st・style の値 color:var(--ink-3)・aria-label は CLOSED_STAGE・inner_html は CROSS）にし、meta の段の lead の後に CLOSED_STAGE の字の span を足す。偽の札は今のまま（state が Some なら state_icon・None なら CHECK）。class の名・見出しの語・口の字・外の依存は足さず、stylesheet・vocab.json・fixture・中核と契約の crate は書かない。
      着地済みの歯（直さずに通る・write-set の =）。tests/pclosed.rs（面）の pclosed_ は closed_card の決まり・kcard の hover と run_line と run_more と lead と state と class の値（札 px.30 は state が None で class が kcard・px.33 は class が kcard why-stop）・Landed の列の今日の札・CLOSED_TAG と CLOSED_STAGE の字を見る（この行は値を変えない）。tests/pipe.rs の pipe_ は fixture の札の列と kcard の値と pipeline.rs の字（.column() が在り Stage:: の段の名が無い・mod dom に crate::net::now() と content(p, l, now)）を、tests/cadopt.rs の cadopt_ は kcard と with_nodes の値と mod dom の with_nodes(content(p, l, now), g) と map::PATH と use:attach=card.hover.clone() を、tests/kcardlink.rs の klink_ は mod dom の card_href( と字 <a class=card.class href= と use:attach=card.hover.clone() と、字 <div class=card.class の無さを、tests/pfold.rs の pfold_ は畳みの関数と mod dom の畳みの button の字を見る。
      write-set の外で直さずに通る歯。tests/frame.rs の frame_ は src の class の値が stylesheet に在ること（足す span の class の値 st は在る）と、見出しの語を二重引用符で囲んだ字の無さ（字を足さない）を見る。tests/parts.rs の parts_ は src の二重引用符の /api/ の字を見る（足さない）。tests/hsderive.rs と frame_one_module_per_block は block の module の定数（BLOCK・PATHS・FOLDS）を見る（変えない）。tests/steady.rs の details の歯は src/project の details の要素を見る（足さない）。
      測り方。新しい歯は面の crate の tests/cmark.rs に置き、名を cmark_ で始める。PipelineCard は歯の中で契約の型の 6 つの pub な欄（contract の BeadId・runs・stage・reason・account・elapsed_s）で組む。fixture の板は tests/fixtures/surface/pipeline-board.json を契約の wire の decode で PipelineBoard に読む（cards は Reading の Known）。DOM は wasm の target だけで組むので、mod dom の字の歯と xtask の surface-build と check（wasm の clippy を含む）で見る。自分の名の歯は tests/cmark.rs の字を読み、test の属性の行の次の fn の名を全部集め、名の数が 3 以上であることと done (5) を見る。試作（席の作業場の写しの main 2e0732e・g-fresh の試作と同じ木）で、cmark_ の 4 本と面の crate の着地済みの歯の全部と host と wasm の clippy と xtask の surface-build が通った。
      filter の語（着地済みの行の verify の filter の語と、計画の後の行 g-gz の接頭辞 pgz_ と、同じ波の行の接頭辞 gfresh_・hcled_・hcnx_・pquest_・stlaunch_・この行の接頭辞 cmark_ は並べない・ほかの語を部分の字として含む語は省いた）は aaround_・accept_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・board_min_・bport_・brand_・btuck_・cadopt_・cgdom_・contract_form_・cround_・csled_・denv_・flight_・fmark_・frame_・fserve_・fstop_・gapspage_・gfresh_・ghb_・glabel_・gnav_・graph_・gsum_・gtuck_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hfig_・hook_・hruling_・hsblock_・hsderive_・hspage_・hsym_・iclose_・ilink_・kcli_・klink_・lcard_・ledgerblock_・lhome_・lspark_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・parts_・pclosed_・pfold_・pgz_・pipe_・plimit_・pmore_・pquest_・project_・ptitle_・pwhole_・qblock_・qgate_・qkey_・question_・rhold_・runsdoc_・saxis_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・steady_・stlaunch_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_ で、新しい歯の名から先頭の cmark_ を除いた字は、このどれも部分の字として含まない（例 cmark_pipe_x・cmark_frame_x・cmark_pclosed_x は不可）。名は done に書いた cmark_kcard_closed_follows_rule・cmark_fixture_cards_not_closed・cmark_dom_text・cmark_own_names_clean（どれも並べた語を含まない）。
      依存と順。depends は無い（行 c-pipe-closed は着地済み・別のノート）。同じノートの行 g-fresh とは書く file も置き場だけの = も重ならないので並べて流す。計画 5 節の src/project/pipeline.rs の鎖は c-pipe-closed（着地済み）→ g-closed-mark → g-jst → g-tick-adopt（g-pipe-memo も後）にする。同じ波のほかの行が src/project/pipeline.rs か、この行の = の歯の file（tests/pclosed.rs・pipe.rs・cadopt.rs・kcardlink.rs・pfold.rs）を持つなら、便の bead の依存で順を持つ。

