      入口の赤。木 11f0486d に、歯の file hcmode.rs と、nodecard.rs の gist_in と card_in の頭（中身は None と空の card）だけを置いた木 32f54f61（写しの branch r-card）で、verify の 3 行目は rc 100（4 本とも落ちる）。

