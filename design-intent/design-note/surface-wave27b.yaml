      構造の連鎖（木 a1f8c2f9 で grep）。brief の呼び手は session_start の 1 か所。brief_entries と cap_of と total の呼び手は hook/mod.rs の各 1 か所と meter.rs の歯。宣言の読み seat_constitution の呼び手は hook/mod.rs の brief と hook/vessel.rs の問いの口の 2 か所（問いの口は替えない）。copy.rs の NEXT_STEP の読み手は copy.rs と meter.rs。doctor の行の読み手の呼び手は境界の src/main.rs の 1 か所。器の file の行の上限（1500・幅 120 で数える）: 書く src の file の最大は hook/mod.rs の 848（行 v-brief-const の後の 825 から +23）で、confine.rs（1499）は書かない。器の rules の kind と行の数は替えない（前の版が動かした e2e の rules の歯と外形の snapshot は書かない）。

