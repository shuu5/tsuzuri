  - n: 32
    type: prose
    title: 行 g-fold-keep — 個別の頁の本文と記録の開き閉じをその browser に覚える
    body: |
      在りか。差の file docs/design/patch/g-fold-keep.patch は、行 g-list-sym の試作の木 e86434d4（写し drafts/w125a の branch p-sym）と、その上に試作を載せた木 6c05ee5e（branch p-keep）との差（12,851 byte・4 file・新しい file 1・+187 −7）。nodebody.rs と ndbody.rs は行 g-node-body が置くので、その後に当たる（depends）。差は c-fact-trim・g-list-hover・g-list-sym に依らず、depends の閉包だけを main 8cd1dc6f に当てた木にも当たる。

      なぜ。判断の記録 ADR-30 決定 (4)（本文と記録は表示の型によらず閉じて始め、開き閉じはその browser に覚える・持ち主の第 4 問の案 A・裁定 t3-hub.76.4）。行 g-node-body は着地した部品の開き閉じの記録（kit の Folds）を使うので、頁の中の移りでは覚えるが、browser を開き直すと閉じに戻る。部品の記録の決まり（頁の一生の間だけ持ち、URL にも画面の外の保存の口にも書かない）の出所は判断の記録でも要件でも規則の行でもなく、ノート surface-board の節 21（行 g-steady の形の字）で、要件 FR1 は browser に残す物を mode と開いた窓の一覧と最初の案内の済み印の 3 つと書いていた（4 つ目は同じ commit の要件書 第 0.28 版）。この行は部品の記録の決まりを替えず、個別の頁の本文と記録の 2 つの鍵だけを例外として保存の口にも写す（ほかの畳める段は頁の一生の間だけのまま）。要件 FR1 の字の 4 つ目は、席が設計の側で要件書 第 0.28 版に置いた（ノート surface-board の節 21 の例外の字も第 0.22 版で置いた）。

      形。 - src/store.rs（host）: module の注に 2 行。表 FOLD_KEYS（node:body と tz-node-body・node:notes と tz-node-notes）と字 FOLD_OPEN（open）と FOLD_SHUT（shut）と、関数 fold_store_key（表に在る畳める段の鍵だけ保存の鍵）・fold_start（保存の字が FOLD_OPEN の時だけ開く）・fold_text（開き閉じの字）を保存の口の前に足す。 - store.rs（wasm の時だけ）: 関数 fold_open（表の鍵の保存の値を get で読み fold_start で決める・表に無い鍵と保存が無い時は閉じ）と keep_fold（表の鍵だけ set で fold_text の字を書く）を keep_mode の後に足す。保存は便利の写しで正本でなく、消えても閉じて始めるだけ（要件 FR1 の決まり）。 - src/project/nodebody.rs: module の注の開き閉じの字を替え、DOM の use に crate の store を足し、関数 kept（toggle の event の details の open の属性を keep_fold で保存に写してから包んだ toggle を撃つ）を足し、2 つの段の開き閉じの記録の呼びの初めの値を偽から store の fold_open に替え、2 つの toggle を同じ名の kept で包み直す（details の tag の字は替えない）。 - 新しい歯の段 tests/fkeep.rs（接頭辞 fkeep_・4 本）。 - 行 g-node-body の歯の書き替え: tests/ndbody.rs の歯 ndbody_folds_closed の呼びの字と注 2 行。

      節の字（歯が比べる字・差の file が字の正本）。表は FOLD_KEYS: [(&str, &str); 2] の 2 つの組 node:body と tz-node-body・node:notes と tz-node-notes（字は二重引用符の字）。保存の口の頭は pub fn fold_open(fold: &str) -> bool { と pub fn keep_fold(fold: &str, open: bool) { で、どちらも前の行が wasm の target の cfg の属性。読みは fold_store_key(fold).is_some_and(|k| fold_start(get(k).as_deref())) 、書きは if let Some(k) = fold_store_key(fold) { と set(k, fold_text(open)); 。block の呼びは fold(node:body を字にした物.to_string(), || store::fold_open(node:body を字にした物)); と notes の同じ形、包みは let toggle_text = kept(node:body を字にした物, toggle_text); と notes の同じ形、kept の中は let now = event_target::<web_sys::Element>(&ev).has_attribute(open を字にした物); と store::keep_fold(key, now); と toggle(ev); 。

