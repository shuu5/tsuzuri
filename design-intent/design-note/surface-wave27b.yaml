      形。 - src/project/pipeline.rs（host）: 関数 card_sym（札から閉じた（着地せず）の真偽と状態の記号の値の対・CI を待つ札は CI_WAIT_STATE・ほかは列の値）を kcard の前に足し、kcard は let (closed, state) = card_sym(card, now); で 2 つを決める（前の closed_card の行と state の if の式を置き換えた）。 - src/ledgerlist.rs（host）: use に card_sym、Lrow に欄 sym（札の在る行だけ card_sym の値）、関数 lrow で sym を置く、module の注に 1 行。 - ledgerlist.rs（DOM）: 行の描きで sym を pipeline の stage_sym に渡して右の段の字の span の頭に置き、組の頭の段の数の b の中の数の前に、列の状態の値で描いた stage_sym を置く（板が読めない時の ? の腕は替えない）。 - style.css: 一覧の段の記号の注 1 行と規則 1 つ（.ll-rt, .ll-sd の inline-flex と字の間 3px）。 - 新しい歯の段 tests/lsym.rs（接頭辞 lsym_・4 本）。着地した歯の書き替えは無い（一覧の行と頭の字を見る bvlist・bvsel・bvsweep・lstg・tkad は書き替えずに通る）。

