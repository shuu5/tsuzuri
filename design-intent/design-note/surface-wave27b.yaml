    title: 行 g-md-view — 本文の書式の一部を字の node で描く部品
    body: |
      在りか。差の file docs/design/patch/g-md-view.patch は、行 g-pop-sum の試作の木 3158322f（写し drafts/w123a の branch p-pop）と、その上に試作を載せた木 7d2b96e9（branch p-md）との差（14,107 byte・3 file・新しい file 2・+320 −1）。差は g-sum-pick の先端の木 12a7964c にも、g-pop-sum の前にも当たる（g-pop-sum に依らない）。widgets/mod.rs は行 g-sum-pick も書くので、その後に当たる（depends）。

      なぜ。判断の記録 ADR-30 決定 (4)（個別の頁の本文は台帳の本文を見出し・箇条・番号・段落・等幅の字の形で描き、本文の書式の描き手は面の中に自前で持ち外の部品を足さない〔規則の行 R-25〕。描けない形〔表・囲いの code など〕は字のままの段にし、字を HTML として読まない）。台帳の本文が使う形はこの 5 つだけで（表・囲いの code・太字・link は 0）、山括弧の字が 42 行在る（計画の調べ）。本文の block（行 g-node-body）がこの部品を呼ぶ。

      形。 - src/widgets/md.rs（新しい file・読み手は純な関数で host でも組む）: 定数 HEAD_CLASSES（mdh1〜mdh4）・CLASSES（mdli・mdpre・md）・BULLET（・）・FENCE（逆引用符 3 つ）。型 Inline（Text と Code）と Block（Head〔深さと片〕・Para〔行ごとの片の列〕・Item〔深さと番号の字と片〕・Pre〔字〕）。関数 inline（逆引用符の対を等幅の片に・対にならない逆引用符は字のまま）・head（行頭の字 # が 1〜4 個と空白）・item（字下げ 2 字ごとに深さ 1・印 - と * か、数字と . か ) と空白）・block（1 行か、囲いの行から閉じる囲いの行までを 1 つの段に・空の行は None）・parse（行ごとに block を呼び、続く段落の行と続く縦棒の行を前の段に足す・行末の CR を外す）。DOM（wasm の枝）は関数 view（段の列を class md の div に）と、段ごとの描き（見出しは HEAD_CLASSES の div、段落は行の間に br、箇条は字下げの margin と印の span と片の span、字のままの段は pre）で、字は全部字の node（span・code・pre の子）で出す。 - src/widgets/mod.rs: doc の 2 行（前の行の末の句点を と、に替える）と pub mod md（keyline の後）。 - 字の色と大きさの規則は本文の block の行 g-node-body が style.css に置く（この行は stylesheet を書かない）。

      節の字（歯が比べる字）。DOM の 3 か所は Inline::Text(t) => view! { span{t}/span } 、Inline::Code(t) => view! { code{t}/code } 、Block::Pre(t) => view! { pre class=pre{t}/pre } の形（tag の山括弧は差の file が字の正本）。囲いの印 FENCE の字は逆引用符 3 つ。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜7 番目の項は verify の 4 行目（歯 mdview_heads・mdview_items_depth・mdview_paragraphs・mdview_inline_code・mdview_angle_text・mdview_unknown_pre・mdview_no_inner_html の 7 本）、最後の 8 番目は 5 行目（xtask の check）で測る。verify の 1〜3 行目は命令の rc で測る守りで、done の項にしない。

      構造の連鎖。新しい module で、呼び手はこの行には無い（行 g-node-body の本文の block が parse と view を呼ぶ）。widgets の module の並びを数える着地した歯は無い（面の歯の全部が通る）。面の crate の直接の依存は増やさない（Cargo.toml を書かない）。

      入口の赤。木 3158322f に、歯の file mdview.rs と、widgets/mod.rs の行と、md.rs の定数と型と関数 inline と parse の頭（中身は空の列・DOM の枝なし）を置いた木 aa97e77d（写しの branch r-md）で、verify の 4 行目は rc 100（7 本とも落ちる）。

      試作と噛み。写し drafts/w123a で書く file は write-set の中で閉じる（3 file）。verify の 2〜4 行目は rc 0。面の歯の全部が通る。句ごとの噛みは 17 で、どれも名指しの歯が rc 100 で落ち、対照は rc 0（係の bites.tsv）。根の xtask の check は席が温かい木で撃つ。

      範囲の外。太字・link・表の組み（描けない形は字のまま）。字の色と大きさ（g-node-body の style.css）。本文の block（g-node-body）。
