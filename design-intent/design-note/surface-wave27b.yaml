    type: prose
    title: 行 g-list-hover — 一覧の行の hover で板の札に印
    body: |
      在りか。差の file docs/design/patch/g-list-hover.patch は、行 c-fact-trim の試作の木 cbddc463（写し drafts/w125a の branch p-ftrim）と、その上に試作を載せた木 332cff11（branch p-hover）との差（17,977 byte・7 file・新しい file 1・+197 −12）。teeth2 の bvsel.rs と bvlist.rs は行 c-fact-trim が、style.css は行 g-node-body まで（g-sum-pick・g-ask-mode・g-pop-sum・g-node-body）が書くので、その後に当たる（depends）。差は depends の閉包だけを main 8cd1dc6f に当てた木にも当たる（style.css の g-ask-mode の hunk とは離れている）。

      なぜ。判断の記録 ADR-30 決定 (8)（台帳 open の一覧の行にマウスの pointer を載せると、板の対応する札に hover の印〔選びの輪より薄い〕を付け、離すと外す。吹き出しは出さず、押すと吹き出しを開く形は今のまま。pointer の種類がマウスでない画面〔指で触る画面〕は印を出さない〔窓の幅では分けない〕。印は hover の card でないので規則の行 R-20 に当たらない）。今は行を押して吹き出しを開いた時だけ札に輪が付く。

      形。 - src/ledgerlist.rs（host の部分）: 定数 HOVER_POINTER（字 mouse）と関数 hover_on（pointer の種類が HOVER_POINTER の時だけ行の id）と hover_lit（hover の id が札の id と同じで吹き出しの開いている札でない時だけ真）を ring の後に足し、module の注に 2 行。 - ledgerlist.rs（DOM・wasm の枝）: SelCtx に欄 hover（RwSignal の Option の字・既定 None）を足す。行の描き row_view に入りの handler enter（PointerEvent の pointer_type を hover_on に渡して欄 hover に置く）と出の handler leave（欄 hover を None）を足し、行の tag の押しの口の次の行に 2 つの口を置く。一覧の view の body の div に出の口 out（欄 hover を None・行の組み直しで行の要素が替わり行の出の口が鳴らない時も印を残さない）を置き、最後の行を 2 行に折る。 - src/project/pipeline.rs（DOM）: use に hover_lit を足し、札の包み pick_view に hovered（PopCtx の開いた id と SelCtx の欄 hover を hover_lit に渡す）と class hov を足す。 - style.css: 選びの印の規則の後に注 1 行と 2 つの規則（.kpick.hov > .kcard の影・.kpick.dim.hov の濃さ 1）。 - 新しい歯の段 tests/lhov.rs（接頭辞 lhov_・5 本）。 - 着地した歯の書き替え（群の module の file だけ）: teeth2/bvsel.rs（行の tag の字を押しの口までの頭に縮め、札の包みの字に class hov を足す）・teeth2/bvlist.rs（body の div の字に出の口）・teeth2/bvtrim.rs（view の最後の行の字を 2 行に折った形・rustfmt の形でない file なので手で字を替えた）。

      節の字（歯が比べる字・差の file が字の正本）。行の tag は押しの口 on:click=press の後に改行と字下げ 16 の空白を挟んで on:pointerenter=enter on:pointerleave=leave と閉じの山括弧。入りの置きは s.hover.set(hover_on(&e.pointer_type(), &id)); 、出は s.hover.set(None); 、body は div class=ll-body on:pointerleave=out の形（class の値は二重引用符の字）。札の包みの tag は div class=kpick class:dim=dimmed class:ring=ringed class:hov=hovered の形、印の決めは .with(|h| hover_lit(shown.as_deref(), h.as_deref(), &id)) 。規則は .kpick.hov > .kcard { box-shadow: 0 0 0 2px color-mix(in srgb, var(--ink) 35%, transparent); } と .kpick.dim.hov { opacity: 1; } 。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜5 番目の項は verify の 4 行目（歯 lhov_pointer_mouse_only・lhov_lit_ring_first・lhov_row_enter_leave・lhov_card_marked・lhov_style_rule の 5 本）、6 番目の項は 5 行目（歯 bvsel_dom_wiring_text）と 6 行目（歯 bvlist_board_unread_line）と 7 行目（歯 bvtrim_head_figure_burndown）、最後の 7 番目は 8 行目（xtask の check）で測る。verify の 1〜3 行目は命令の rc で測る守りで、done の項にしない。

      構造の連鎖（木 332cff11 で grep）。SelCtx を組む所は App の provide_context(SelCtx::default()) だけで、既定に欄を足したので書き替えない。行の押しの口（p.press と Via::Row）と吹き出しの開閉は替えない（着地した歯 bvsel_dom_wiring_text の press の字が緑）。札の包み pick_view を呼ぶ所は板の列とスマホの段の 2 か所で、どちらも印を持つ（マウスの pointer の無い画面は印を出さない）。一覧の body の div の字を見る着地した歯は bvlist と bvtrim の 2 本で、どちらも書き替えた。

      入口の赤。木 cbddc463 に、歯の file lhov.rs と、ledgerlist.rs の定数と関数の頭（HOVER_POINTER は空の字・hover_on は None・hover_lit は偽・DOM は前のまま）を置いた木 13863aa5（写しの branch r-hover）で、verify の 4 行目は rc 100（5 本とも落ちる）。

      試作と噛み。写し drafts/w125a で書く file は write-set の中で閉じる（7 file）。verify の 2〜7 行目は rc 0。面の歯の全部が通る。wasm の clippy が DOM の枝を見ていることは、入りの handler の字を型の合わない形に替えた木で rc 101 を出して見た。句ごとの噛みは 17 で（新しい歯 14・着地した歯 3）、どれも名指しの歯が rc 100 で落ち、対照（lhov と群 teeth2）は rc 0（係の bites.tsv）。根の xtask の check は席が温かい木で撃つ。実の board の画面（印の濃さ・マウスと指の違い）は browser で見ていない（host の歯と wasm の clippy だけ）。

      範囲の外。吹き出しの開閉と押しの口。札から一覧の行への逆の印（行 g-select の輪のまま）。
