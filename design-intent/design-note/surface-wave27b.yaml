    body: |
      在りか。差の file docs/design/patch/g-pop-sum.patch は、係 w113a の 4 行（c-sum-two・c-short-cap・e-hold-mark・c-short-gate）と係 w117a の 2 行（cs-server・cs-plugin）と係 w119a の 3 行（cs-hooks・cs-bar・cs-pop）を main 9abf0779 に順に当て、その上に係 w122a の 3 行（g-sum-pick・g-ask-mode・g-card-mode）を載せた木 40c8f217（写し drafts/w122a の branch p-card・行 g-card-mode の試作の先端）と、その上に試作を載せた木 3158322f（写し drafts/w123a の branch p-pop）との差（24,794 byte・6 file・新しい file 1・+295 −16）。差は g-sum-pick の先端の木 12a7964c にも当たる（g-ask-mode と g-card-mode に依らない）。pop.rs は行 cs-pop も、vocab.json と style.css は行 g-sum-pick も書くので、その後に当たる（depends）。契約の関数 summaries と excerpt は行 c-sum-two が置く。

      なぜ。判断の記録 ADR-30 決定 (2)（概要を出す全部の面は表示の型の 1 つだけを出し、無い時はもう一方を印つきで、両方無い時は本文の頭の 1 行を 本文から の印つきで出す）と決定 (3)（吹き出しの概要は切らずに全文を出し、規則の行 R-19 の 200 字を越える時は頭の字と … で畳み、押すと開いてもう 1 度押すと畳み、開く bead が替われば畳んで始める。字は吹き出しを開いた時に 1 本の引きの口 GET /api/ledger/<id> から読み、読めるまでは まだ分からない）。今の吹き出しは bead の事実の口の 120 字で切った 1 行を出している。

      形。 - src/widgets/pop.rs（host の部分）: use に契約の ITEM_PATH と LedgerItem と summary の summaries と excerpt、部品 sumpick の POP_SUM_MAX と Picked を足す。定数 SUM_KEYS（psum_more と psum_less）と SUM_CLASS（pmore）。型 Sum（Unread・Empty・Picked の 3 つ）を足し、Pop の欄 summary を Option の字から Sum に替える。関数 pop は事実の口の概要を読まず summary を Sum の Unread で組む（短い題の読みは今のまま）。関数 item_path（ITEM_PATH と id）・with_sum（1 本の引きの電文が読めて行の id が吹き出しの id と同じ時だけ、本文の 2 つの概要と本文の頭の 1 行を部品 sumpick の pick に渡し、選べば Picked・どれも無ければ Empty、ほかは Unread）・sum_text（部品 sumpick の fold で POP_SUM_MAX 字に畳み、畳まない字は口なし・畳んだ形は shut と開く口・開いた形は whole と畳む口）を足す。 - pop.rs（DOM・wasm の枝）: PopCtx に欄 whole（初め偽）を足し、press で偽に戻す。関数 sum_view を足し、Unread は まだ分からない、Empty は要約なしの字（個別の頁の NO_SUMMARY）、Picked は表示の型の側でなければ語の印を頭に置き、字は台帳の字の印の span に置き、畳む字だけ口の button（押すと whole を替える・要素は残し語だけ替える）を置く。pop_view の概要の div を sum_view の呼びに替える。PopLayer は走行の口と同じ形で 1 本の引きの口を開いた id の path の signal で読み、with_why の次の行で with_sum を呼ぶ。 - vocab.json: 鍵 psum_more（語 続きを読む）と psum_less（語 短く畳む・語 畳む は pipeline の札の button の字と同じなので歯 pfold_close_text が断る）。 - style.css: .psum small（印の破線の枠）と .pmore（口）の 2 つの規則。 - 着地した歯の書き替え（群の module の file だけ）: teeth2/bvpop.rs（Sum を use に足し、概要の 2 つの断言を Unread に）・teeth2/bvstep.rs（吹き出しの見本の summary を Sum の Unread に・use に Sum）。

      節の字（歯が比べる字）。口の path の signal は Signal::derive(move || ctx.shown().map(|id| item_path(&id)).unwrap_or_default()); で、読みは let item = crate::net::read_path(item_at); 、置きは with_why の行の次の行の let p = item.with(|(f, _)| with_sum(p, f, mode)); 、press の中の self.whole.set(false); 、sum_view の中の span の字は span data-ledger-text={move || shown().0} の形（属性の値は空の字・tag の頭の山括弧は差の file が字の正本）、口は class=SUM_CLASS on:click=move |_| ctx.whole.update(|w| *w = !*w) 、pop_view の中の呼びは {sum_view(ctx, p.summary)} 。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜6 番目の項は verify の 4 行目（歯 ppsum_item_mode・ppsum_fallback_marks・ppsum_unread_unknown・ppsum_fold_open・ppsum_reads_item_on_open・ppsum_ledger_text_mark の 6 本）、7 番目の項は 5 行目（歯 bvpop_common_rows_in_order・bvpop_unknown_fields_marked）と 6 行目（歯 bvstep_with_runs_places_facts）、最後の 8 番目は 7 行目（xtask の check）で測る。verify の 1〜3 行目は命令の rc で測る守りで、done の項にしない。

      構造の連鎖（木 3158322f で grep）。Pop の欄 summary の読み手は pop.rs の pop_view だけで、Pop を字で組む所は着地した歯 bvstep の見本だけ（書き替えた）。runflow の with_runs と with_why は summary を読まない。吹き出しの字を src から読む着地した歯 bvstep_dom_wiring_text と bvwhy の with_why の 2 行の断言と cwpop の末の口の並びは、書き替えずに通る（with_sum の行は with_why の行の後に足した）。事実の口の summary の欄は行 c-fact-trim が消す（この行の後は面が読まない）。

      入口の赤。木 40c8f217 に、歯の file ppsum.rs と、pop.rs の型と関数の頭（Sum と欄の型・SUM_KEYS と SUM_CLASS は空の字・item_path は空の字・with_sum は受けた吹き出しのまま・sum_text は空の字と口なし・DOM は前のまま）を置いた木 074a68e0（写しの branch r-pop）で、verify の 4 行目は rc 100（6 本とも落ちる）。

      試作と噛み。写し drafts/w123a で書く file は write-set の中で閉じる（6 file）。verify の 2〜6 行目は rc 0。面の歯の全部が通る。句ごとの噛みは 24 で、どれも名指しの歯が rc 100 で落ち、対照（ppsum と群 teeth2）は rc 0（係の bites.tsv）。根の xtask の check は席が温かい木で撃つ。

      範囲の外。吹き出しの置き場は開いた時に 1 度測る（概要の読みと開きで高さが替わっても置き直さない・走行の欄の読みと同じ）。個別の頁の本文と記録（g-node-body）。事実の口の summary の欄の掃除（c-fact-trim）。
  - n: 27
