  - n: 3
    type: prose
    title: 行 xp-io-bytes — 囲いごとの装置への正味の書き
    body: |
      在りか。差の file docs/design/patch/xp-io-bytes.patch は、main 5d36a358 に行 v-swap・v-lane・v-lane-cap の差を順に当てた木 a1ebbda4（写し drafts/w109a の branch base3）と、その上に試作を載せた木 3f284877（branch xp-io）との差（23,832 byte・7 file・新しい file 1・+214 −15）。3 本の差の上にだけ当たる（spawn.rs と mod.rs が v-lane の差の後の字）。

      なぜ。判断の記録 ADR-37（持ち主の裁定 t3-hub.74.54.3:20261003T2312Z-1・案 A）。持ち主の最優先は SSD の大量消費で、今の器の記録は囲いごとに memory の peak だけを持ち、便ごとの書きは係の手の測りしか無い。本番の便の SSD を毎日数える見張りと、実験場の 2 つの版の SSD の比べの両方が、器の記録から値を取れるようにする。

      測りの源。cgroup の io.stat の wbytes は、user の systemd の scope に io の controller が委ねられない host で読めない（この host の user の slice の subtree_control は cpu と memory と pids だけ）。/proc の io は子を刈った親へ数が積もるので、包みの sh が行の終端で自分の /proc/$$/io を読めば、行が起こして刈った子孫の書きの和になる。write_bytes は頁を汚した時に数わり、cancelled_write_bytes は書き戻す前に消した頁の分なので、引いた数が装置への正味の書き。runner の claude は runner の子（systemd-run の scope は exec）で runner は包みの sh の子なので、runner の囲いの数は claude と claude が撃った組みの書きを含む。刈られずに親を離れた子孫（孤児）の書きは入らない＝下限。

      形。 - pipe/confine/io.rs（新しい file）: 正味の書きの shell の字 NET_WRITE（__io の file の 2 欄を読み、揃って数の周だけ __wb に引いた数・ほかは字 unmeasured）・関数 written（包めた周だけ終端行の書きを読む）・word（数か字 unmeasured）・detail（字 write と半角のコロンと word）・total（1 つでも測れない囲いか囲い 0 の周は測れない和）と歯 xpio_ の 7 本。 - pipe/confine.rs: 行 pub mod io; を足し、終端行の script の printf の前に字 __io=/proc/$$/io の行と NET_WRITE を置き、printf の字の末に write_bytes=%s と __wb を足す。構造体 Usage に欄 write_bytes、read_usage が字 write_bytes= を読む。 - pipe/gate/verify.rs と gate/record.rs: 段 Step に欄 write_bytes、verify の record に欄 write_bytes（数か字 unmeasured）、Counted に欄 written（撃った行〔秒を持つ段〕の囲いの和）。 - pipe/gate.rs: Measured に欄 written、lens の消費の event の detail に verify 行の囲いの和の語。 - pipe/spawn.rs: runner の消費の event の detail に runner の囲いの語（runner.stdout.log の終端行から）。 - pipe/mod.rs: emit_cost が detail を受け、口 record_cost_with を足す（record_cost は detail 無しで今の形のまま）。

      event の形。消費の event RunCost の key は替えない（欄 detail は全部の kind の任意の欄で、器の読み手は Shape の Cost の行で detail を読まず、旧い binary も読める）。語は字 write と半角のコロンと数か字 unmeasured。runner の行は runner の囲い、lens の行は同じ gate の周の verify 行の囲いの和。面の読み手（crates/tsuzuri-core の pipeline.rs）は RunCost の欄 usage と turns と wall_ms だけを読み、detail の字 account の札だけを拾うので、替えない。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜7 番目の項は verify の 3 行目（器の lib の歯 xpio_ の 7 本）、最後の 8 番目の項は 4 行目（xtask の check・入れ子の段で器の歯の全部と clippy を撃つ）で測る。verify の 1 行目（差の hunk が全部木に在る）と 2 行目（器の clippy）は命令の rc で測る守りで、done の項にしない。

      構造の連鎖（木 a1ebbda4 で grep）。emit_cost の呼び手は record_cost の 1 か所だけ。record_cost の呼び手は spawn.rs と gate.rs と review.rs の 3 か所で、前の 2 つを record_cost_with に替え、審査の review.rs は替えない。Step の構築は verify.rs の 3 か所（unwrapped・closed・fire）、Measured の構築は gate.rs の 2 か所（measure と歯の助け）、Counted の構築は record.rs の 1 か所。e2e の歯は verify の record を欄の名で読み、消費の event を欄 cost で比べるので替えない。器の file の行の上限（1500）に confine.rs が 1499 で収まる（written を io.rs に置いた）。

      入口の赤。木 a1ebbda4 に、歯の module（io.rs の歯）と歯が名指す関数の頭だけ（中身は今の振る舞い: 書きの shell の字は常に unmeasured・終端行に書きの字は無い・read_usage は書きを読まない・語は常に unmeasured・和は常に測れない・record_cost_with は detail を書かない）を置いた木 86f43df3（写しの branch xp-io-red）で、verify の 3 行目は rc 100（7 本とも落ちる）。

      試作と噛み。写し drafts/w109a で書く file は write-set の中で閉じる（7 file）。verify の 2 行目と 3 行目は rc 0（歯 xpio_net_write_subtracts_cancelled_bytes・xpio_net_write_is_unmeasured_without_both_fields・xpio_epilogue_reads_own_proc_io・xpio_read_usage_reads_write_bytes・xpio_written_reads_only_confined_runs・xpio_detail_and_total_keep_unmeasured・xpio_cost_event_carries_write_detail の 7 本）。入れ子の 4 段は xtask と同じ引数と置き場（target/nested/scribe2）と cwd（scribe2/）で撃って 4 段とも rc 0（nextest run --workspace --no-fail-fast は 4,023 本が全部緑・器の xtask check は ok の 1 行で file-lines=1499/1500）。根の段は撃っていない（この行は scribe2/ の外を書かない・席が温かい木で撃つ）。句ごとの噛みは 10 で、どれも rc 100、書き戻した後の対照は rc 0（変異と歯の表は係の bites.tsv）。測りの源の確かめ: user の scope の中で sh が 8 MiB を書き、子の sh が 4 MiB を書いて書き戻す前に消すと、/proc/$$/io の正味は 8,388,608（write 12,582,912・cancelled 4,194,304）。

      費用。この行の便 1 本の正味の書きの見込みは係の measure.tsv（入れ子の 4 段の通しで約 1.7 GB・器の lib の歯の組み直し 1 回で約 0.37 GB）。

      流す時と順。scribe2/ を書く便は同時に 1 本まで（判断の記録 ADR-33 の決定 (12)）。行 v-swap・v-lane・v-lane-cap の着地の後に流す。行 xp-provenance（版の記録）は同じ spawn.rs と gate.rs と mod.rs を書くので、この行の後に depends で置く。

      範囲の外。lens の囲い（gate の lens と契約の審査の review）の書き（lens の claude は読むだけ）。io.stat の wbytes の読み（io の controller が委ねられた host の別の源）。pipe show の消費の行に書きを出すこと。面に書きを出すこと。
  - n: 4
    type: prose
    title: 行 xp-provenance — 便ごとの版の記録
    body: |
      在りか。差の file docs/design/patch/xp-provenance.patch は、行 xp-io-bytes の試作の木 3f284877（写し drafts/w109a の branch xp-io・main 5d36a358 に行 v-swap・v-lane・v-lane-cap・xp-io-bytes の差を順に当てた木）と、その上に試作を載せた木 49a483ad（写し drafts/w111a の branch xp-prov）との差（34,685 byte・9 file・新しい file 1・+279 −26）。4 本の差の上にだけ当たる（spawn.rs と gate.rs が行 xp-io-bytes の差の後の字）。

      なぜ。判断の記録 ADR-37 の決定 (7)（持ち主の裁定 t3-hub.74.54.3:20261003T2312Z-1・案 A）。実験場の 2 つの腕と、案 A の前後の比べは、便ごとに器の版と claude の CLI の版と効いた model と effort を記録から言えないと、claude の CLI の自動の更新と器の入れ替えを分けられない。今の器の event は gate の detail に rules の出所の 1 語だけを持つ。

      形。 - headless/provenance.rs（新しい file）: 4 語を組む probe（claude を起こす直前に version_of を 1 回撃つ）・version_of（claude の実行 file を引数 --version の 1 回で撃ち、stdin と stderr は null、rc 0 の周だけ version_word を読む）・version_word（stdout の最初の行の最初の語が数字で始まり数字と点だけなら版）・words（字 build と BUILD_COMMIT・字 claude と版か字 unmeasured・字 model・字 effort の 4 語）・line（runner の stderr の 1 行）・checked（4 語の形）・from_stderr（捕らえた stderr の最後の行の 4 語）・of_pairs（判定 object の key provenance の 4 語）・with_object（key usage を持つ判定 object の末に key provenance の対を足す）・detail（囲いの書きの語・半角の空白・4 語か 4 語とも unmeasured）と歯 xpprov_ の 6 本。 - headless/mod.rs: 行 pub mod provenance; を足し、build の頭の構築の字を新しい関数 claude_program に移す（claude を起こす記述の字はこの 1 か所のまま・器の xtask check の claude-spawn-points が headless/ の構築の字を mod.rs の 1 か所と測る・版の撃ちも同じ関数で組む）。 - headless/runner.rs: launch が build の前に probe を撃ち、終端の scope の行の後に line の 1 行を stderr に足す（stdout の要約行と最終行は替えない）。 - headless/lens.rs: ask が build の前に probe を撃ち、read_verdict が判定の行に with_object を掛ける（判定の読みと 6 値の足しは替えない）と歯 xpprov_lens_verdict_carries_the_words。 - pipe/gate/lens.rs: 判定 Judged に欄 provenance、parse_lens が of_pairs で読み、ほかの構築は None と歯 xpprov_gate_reads_the_lens_words。 - pipe/gate.rs: lens の消費の event の detail を detail で組み（囲いの書きの語に続けて Judged の 4 語）、構築の 1 か所に None。 - pipe/spawn.rs: runner_cost が捕らえた stderr も受け、detail で組む（囲いの書きの語に続けて from_stderr の 4 語）。

      罠（着地済みの歯の直し）。e2e の偽の claude は引数を見ずに本文を撃つので、版の撃ちが本文を 1 度余計に撃ち、痕跡（呼んだ印・回数の行）と fixture の dir の片付けが 2 度になり、着地済みの歯が落ちる。偽の claude の頭に、最初の引数が字 --version の周だけ版の 1 行を出して痕跡を残さず終わる 1 行を置く: tests/e2e/headless.rs の fake_claude と peak_claude（const FAKE_VERSION）、tests/e2e/pipe/gate.rs の max_turns_lens と real_lens の偽の claude（const CLAUDE_VERSION）。runner の偽の claude で引数を見ない result_claude（tests/e2e/pipe/spawn.rs）は痕跡を持たず版の行が数でないので直さない（版は unmeasured）。偽の lens（argv_lens・counting_lens）は器の lens を通らないので直さない。tests/e2e/headless.rs の歯 run_cost_lens_verdict_object_carries_usage_from_the_json_envelope は判定 object の字を全部で比べていたので、6 値の後に版の対が続くことを頭の字で比べる形に直す（6 値の字は替えない）。

      event の形。消費の event RunCost の key は替えない（欄 detail は全部の kind の任意の欄・器の読み手は Cost の行で detail を読まない・旧い binary も読める）。detail の字は行 xp-io-bytes の囲いの書きの語の後に半角の空白 1 つと 4 語。runner の行は runner の stderr の行から、lens の行は判定 object の key provenance から写す。行も対も無い周（旧い runner と lens・偽の lens）と形の違う周は 4 語とも unmeasured。build の値は器の BUILD_COMMIT の字のまま（測れない組みは器の 3 形の字 unknown）。model と effort は runner と lens が claude に渡す rules の行の値（runner.model と runner.effort・lens は審査の model の行と runner.effort）。lens の判定 object へは消費の 6 値を運ぶ周だけ足す（消費の event を書く周だけで、偽の lens の平の判定の字は替わらない）。受付の審査（review.rs）の消費の event は替えない（範囲の外）。面の読み手（crates/tsuzuri-core の pipeline.rs）は RunCost の欄 usage と turns と wall_ms だけを読み、detail の字 account の札だけを拾うので、替えない。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜8 番目の項は verify の 3 行目（器の lib の歯 xpprov_ の 8 本）、最後の 9 番目の項は 4 行目（xtask の check・入れ子の段で器の歯の全部と e2e の偽の claude の直しと clippy を撃つ）で測る。verify の 1 行目（差の hunk が全部木に在る）と 2 行目（器の clippy）は命令の rc で測る守りで、done の項にしない。

      構造の連鎖（木 3f284877 で grep）。headless/ の構築の字 Invocation::new( は mod.rs の build の 1 か所で、claude_program へ移しても 1 か所。Judged の構築は gate/lens.rs の 2 か所（unjudged・judge_pairs）と parse_lens の更新の 1 か所と gate.rs の 1 か所。read_verdict の呼び手は ask の 1 か所。runner_cost の呼び手は launch_runner の 1 か所。器の file の行の上限（1500）: 書く file の最大は spawn.rs の 1342 行で、confine.rs（1499）は書かない。

      入口の赤。木 3f284877 に、歯（provenance.rs の 6 本・lens.rs と gate/lens.rs の各 1 本）と、歯が名指す関数の頭と欄だけ（中身は今の振る舞い: 版を組まない・読まない・足さない・detail は囲いの書きの語だけ・runner.rs と spawn.rs は配線しない）を置いた木 8d648d85（写しの branch xp-prov-red）で、verify の 3 行目は rc 100（8 本とも落ちる）。

      試作と噛み。写し drafts/w111a で書く file は write-set の中で閉じる（9 file）。verify の 2 行目と 3 行目は rc 0（歯 xpprov_version_word_reads_the_first_word_of_the_first_line・xpprov_version_of_runs_the_flag_once_and_needs_rc_zero・xpprov_words_name_build_claude_model_effort・xpprov_stderr_line_is_read_only_in_shape・xpprov_lens_object_carries_words_only_with_usage・xpprov_detail_follows_the_write_word・xpprov_gate_reads_the_lens_words・xpprov_lens_verdict_carries_the_words の 8 本）。入れ子の 4 段は xtask と同じ引数と置き場（target/nested/scribe2）と cwd（scribe2/）で撃って 4 段とも rc 0（nextest run --workspace --no-fail-fast は 4,031 本が全部緑・器の xtask check は ok の 1 行で file-lines=1499/1500・claude-spawn-points=1・core-lines=82760/90000）。根の段は撃っていない（この行は scribe2/ の外を書かない・席が温かい木で撃つ）。句ごとの噛みは 17 で、どれも名指しの歯が rc 100 で落ち、対照は rc 0（変異と歯の表は係の bites.tsv）。版の撃ちの実の確かめ: この host の claude の実行 file は引数 --version に 1 行 2.1.289 (Claude Code) を 7 ms で返す（版の語は 2.1.289）。

      費用。この行の便 1 本の正味の書きの見込みは係の measure.tsv（入れ子の 4 段の通しと器の lib の歯の組み直し）。版の撃ちは runner と lens の 1 回ごとに 1 つの子 process（数 ms）で、書きは無い。

      流す時と順。scribe2/ を書く便は同時に 1 本まで（判断の記録 ADR-33 の決定 (12)）。行 xp-io-bytes の着地の後に流す（同じ spawn.rs と gate.rs を書く・depends）。

      範囲の外。受付の審査（review.rs の lens）の消費の event の版。pipe show と面に版を出すこと。版の撃ちの時間の上限（claude の実行 file は引数 --version に数 ms で答える・答えない実行 file は claude の本体の起動も止まる）。claude の CLI の版を stream の init の record から読むこと（lens の json の封筒は版を持たない）。
  - n: 5
    type: prose
    title: 行 xp-host-runs — host の根の走りの札
    body: |
      在りか。差の file docs/design/patch/xp-host-runs.patch は 20,112 byte・7 file（新しい file 1）・+247 −10。前の版（係 w112a の 13,888 byte・行 xp-provenance の試作の木 49a483ad と、その上に試作を載せた木 408b9e09 との差・5 file・+210 −2）の字を後ろにそのまま置き、頭に器の e2e の 2 file（tests/e2e/hook.rs と tests/e2e/main.rs）の差 6,224 byte を足した（係 w130a）。足した差は、写し drafts/w130a の起点 3e0a2a89（行 xp-provenance の試作の木）と、その上に直しを載せた木 c03d4fae（branch x-runs2）との差。起点 3e0a2a89 に差の全部を当てた木は c03d4fae と同じで、その上に後の行 xp-prov-review・xp-host-live・v-brief-const・v-brief-meter の main の差の file を順に当てた木は、直した積みの先端 5f908c65（branch stack2）と同じ（後の 4 本の差は切り直さない）。e2e の 2 file は木 49a483ad・3e0a2a89・main 78b7ffe7 で同じ字。spawn.rs の hunk は行 xp-io-bytes と xp-provenance の差の後の字に当たる（起点 3e0a2a89 と 49a483ad は spawn.rs・land.rs・lane.rs の blob が違うが、hunk の前後の字は同じ）。

      なぜ。判断の記録 ADR-37 の決定 (3) と (7)。実験場の便は本番と同じ口座の消える残りを使い、実験の置き場は本番の置き場と同じ親の下に置く。口座の選び（fleet/select.rs の便用の鍵の 2 つ目・走っている便の数）は置き場の event だけを数えるので、ほかの置き場の走りが見えない。host の根の受付札（pipe/admission.rs の札）は口座を持たず、gate の verify の行の間だけ置かれて runner の間は無いので、数える材料にならない。行 xp-host-live を 2 本に割り、この行は札を置く前半（口座の label を持つ札を runner の間だけ host の根に置く）で、数える後半（口座の選びが札を数える）は行 xp-host-live。札は置くだけで誰も読まないので、この行は口座の選びを変えない。

      直し（係 w130a・2026-10-04）。器の e2e の一時 dir（tests/e2e/main.rs の make_tmp_dir）は temp の dir の直下に作られるので、それをそのまま --state-dir に渡す歯（fleet の口座の選びの歯の置き場 select_fixture など）の host の根は、どれも temp の dir の直下の dir scribe2-host になる。口座を選ぶ便の e2e の歯 fleet::fleet_select_anchor_pipe_run_passes_the_repo は runner の間に口座 a2 の札をそこへ置くので、行 xp-host-live の後は、同じ時に走る便用の選びの歯（fleet::fleet_select_week_prefers_the_earlier_seven_day_reset_over_the_earlier_five_hour_reset と fleet::fleet_select_run_prefers_earliest_reset_over_pressure・答えは a2）が札で a2 を後に回し a1 を選んで落ちる（席の 29 行を重ねた木の入れ子の nextest で見た揺れ）。同じ host のほかの木の歯（便の gate の xtask の check と係の撃ち）も同じ dir を共有する。直しは e2e の一時 dir を一意な根の 1 段下の子にして、包みを落とすと根ごと消す形で、どの歯の host の根も自分の一時 dir の根の下に閉じる（歯どうしも、同じ host のほかの木の歯とも共有しない）。器の本番の host の根の導き（置き場の親の下の scribe2-host）は替えない。札を置く前半のこの行に入れるのは、この行が着地した後のどの木の歯も共有の dir に札を書かず、数える後半の行 xp-host-live の審査がほかの木の札で揺れないため。1 本の歯の置き場だけを 1 段下にする直しにしないのは、同じ形の置き場（make_tmp_dir の直下を置き場にする fixture）が e2e に多く、どれも同じ dir を共有するため。

      形。 - pipe/live.rs（新しい file）: 札の型 Ticket（pid・run・account・place・ts_ms）と to_line・parse、外し番 Hold（Drop で札を消す・path）、hold（label の無い周は Ok(None)・ある周は自分の pid と便 id と label と置き場の字と今の ms の札を put で置く）、put（dir を作り、書きかけの拡張子 partial で書いて拡張子 run へ rename・置けない周は書きかけを消して理由の 1 行）と歯 xphost_ の 5 本。 - seat/mod.rs: host_runs_dir（host の根の dir runs・host_slots_dir と同じ導き・env を読まない）。 - pipe/mod.rs: 行 pub mod live; を足す。 - pipe/admission.rs: now_ms を pub(super) にする（札の ts を受付札と同じ 1 本で測る）。 - pipe/spawn.rs: launch_runner が runner の起動の前に hold を撃ち、終端で outcome.err に置けない周の理由の 1 行を足す（外し番は launch_runner の終わりで落ちる・早く返る周も落ちる）。口座を選ばない周（親の環境の継承）は札を置かない。 - 器の e2e の tests/e2e/main.rs: make_tmp_dir は一意な根（temp の dir の下の e2e と pid と nanos と連番の名の dir）を作り、その 1 段下の子（定数 TMP_LEAF の字 tmp）を返す。作れない周は根を消して次の名を試す。包み TmpDir に欄 root（drop で消す根）を足し、drop は根ごと消す（keep・canonical・held は今のまま）。歯 e2e_fixture_tmp_dir_survives_when_kept の後片付けは根を消す。歯 xphost_e2e_tmp_dir_closes_the_host_root を一時 dir の包みの歯の後に足す。 - 器の e2e の tests/e2e/hook.rs: 群の歯の置き場 group_role_place の TmpDir の字の組み（欄の足しで組めなくなる 1 か所）に root を足す（消す dir は今のまま置き場の dir）。

      札の形。1 行 JSON で key は schema・pid・run・account・place・ts の順（schema は器の event の SCHEMA・pid は runner の終わりを見届ける driver の process・place は state dir の字・ts は UNIX epoch の ms）。名は pid と半角のハイフンと sanitize_target を通した便 id と拡張子 run。受付札と同じく一時の印で、死んだ持ち主の札の回収と生死の判じ（pid と起動の時刻）は数える後半の行が持つ（この行の札は driver が SIGKILL で死んだ周だけ残る）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜5 番目の項は verify の 3 行目（器の lib の歯 xphost_ の 5 本）、6 番目の項は 4 行目（器の e2e の歯 xphost_ の 1 本 xphost_e2e_tmp_dir_closes_the_host_root）、最後の 7 番目の項は 5 行目（xtask の check・入れ子の段で器の歯の全部と clippy を撃つ）で測る。verify の 1 行目（差の hunk が全部木に在る）と 2 行目（器の clippy）は命令の rc で測る守りで、done の項にしない。spawn.rs の配線（hold の 1 行と理由の足し）は lib の歯で測らない。札を置く e2e は口座を選ぶ便の歯 fleet::fleet_select_anchor_pipe_run_passes_the_repo の 1 本（runner の間に口座 a2 の札を置く）で、この行の歯は札の在りかを断言しない。数える後半の行の歯が札の在りかを測る。

      構造の連鎖（木 49a483ad と 3e0a2a89 で grep）。launch_runner の呼び手は spawn の 1 か所。launch.account.label() は spawned_detail と with_account と settle_rate_limit が既に読む。host の根の導き host_root の呼び手は host_slots_dir・host_groups_dir・host_write_budget_dir の 3 か所で、host_runs_dir が 4 つ目。now_ms の呼び手は admission.rs の write_ticket と歯の 2 か所。器の file の行の上限（1500）: 書く file の最大は pipe/mod.rs の 1371 行と spawn.rs の 1344 行で、confine.rs（1499）は書かない（e2e の file は上限の外）。make_tmp_dir の呼び手は e2e の 11 file の 27 か所で、歯の一時 dir は全部この 1 本を通る。TmpDir の字の組みは make_tmp_dir と hook.rs の group_role_place の 2 か所。置き場の親から host の根の dir を字で組む e2e の助け（gate.rs の host_slots・hook.rs と seat.rs と fleet.rs と dispatch.rs の群用 dir）は置き場の親を読むので、一時 dir の親が根になっても器の導きと同じ dir を指す。

      入口の赤。木 49a483ad に、歯（live.rs の 5 本）と、歯が名指す関数の頭だけ（中身は今の振る舞い: to_line は空の字・parse は None・hold は Ok(None)・put は理由の字・host_runs_dir は空の path・spawn.rs は配線しない）を置いた木（写しの branch xp-red の 12948f47・行 xp-prov-review の頭も同じ木に在る）で、verify の 3 行目は rc 100（5 本とも落ちる）。e2e の歯 xphost_e2e_tmp_dir_closes_the_host_root は、直す前の一時 dir の形（temp の dir の直下に作り、それ自身を消す・噛みの印 flat が同じ形を組む）で rc 100（断言 temp の直下の host の根の下に無い で落ちる）。直す前の積みの先端（2096cf2e）の揺れ: e2e の fleet の 180 本（札を置く歯と口座を選ぶ歯を含む）を 10 周撃って 4 周が落ち（落ちたのは上の 2 本のどちらか 1 本・答えは a1）、temp の直下の host の根に生きた process の口座 a2 の札を手で 1 枚置くと fleet::fleet_select_week_prefers_the_earlier_seven_day_reset_over_the_earlier_five_hour_reset は rc 100（chosen=a1）、札を外すと rc 0。

      試作と噛み。写し drafts/w112a と drafts/w130a で書く file は write-set の中で閉じる（7 file）。verify の 2 行目と 3 行目は rc 0（歯 xphost_ticket_line_round_trips_with_account_and_place・xphost_runs_dir_is_beside_the_slots_dir・xphost_hold_puts_a_ticket_only_with_a_label・xphost_hold_puts_one_ticket_and_drop_removes_it・xphost_unwritable_dir_returns_a_reason の 5 本）、4 行目は rc 0（歯 xphost_e2e_tmp_dir_closes_the_host_root の 1 本）。入れ子の段は xtask と同じ引数と置き場（target/nested/scribe2）と cwd（scribe2/）で、直した積みの先端 5f908c65（行 xp-host-runs の直しの上に後の 4 行の試作を重ねた木）で撃った。nextest run --workspace --no-fail-fast は 4,067 本が全部緑（直す前の積みの 4,066 本と新しい e2e の歯 1 本）、build --workspace は rc 0、器の xtask check は ok の 1 行（file-lines=1499/1500・core-lines=83376/90000・boundary-spawn=1/1）。clippy --workspace --all-targets -- -D warnings は撃っていない（席の根の xtask check の入れ子の段に回した）。根の段は撃っていない（席が 29 本を重ねた温かい木で直した差に替えて撃つ）。 句ごとの噛みは前の版の 13 と、この直しの 3（印 flat・shared・keeproot の変異で歯 xphost_e2e_tmp_dir_closes_the_host_root がそれぞれ名指しの断言 temp の直下の host の根の下に無い・2 つの一時 dir の host の根は別・包みを落とすと host の根の札の dir も消える で rc 100）で、対照は rc 0（変異と歯の表は係の bites.tsv）。直した積みの先端（5f908c65）の揺れの撃ち: 同じ 180 本を 10 周撃って落ちる周は 0 で、temp の直下の host の根に手で置いた札でも fleet::fleet_select_week_prefers_the_earlier_seven_day_reset_over_the_earlier_five_hour_reset は rc 0。

      費用。札は runner の 1 回ごとに 1 file（約 150 byte）を書いて消す。e2e の一時 dir は 1 つごとに dir を 1 段多く作る。

      流す時と順。scribe2/ を書く便は同時に 1 本まで（判断の記録 ADR-33 の決定 (12)）。行 xp-provenance の着地の後に流す（同じ spawn.rs を書く・depends）。e2e の hook.rs は後の行 v-brief-meter も書く（hunk は離れていて、v-brief-meter の差は切り直さずに当たる）。

      範囲の外。札を数えて口座を選ぶこと（後半の行 xp-host-live・鍵の順は持ち主の裁定 t3-hub.74.61.1 の案 A（行 xp-host-live））。死んだ持ち主の札の回収。gate と受付の審査の lens の claude の札（lens も口座を使うが、走っている便の数は runner の便だけを数える）。器の lib の歯の一時 dir（pipe の fixture の scratch などは temp の dir の直下の置き場を使うが、札を置く lib の歯 live.rs と replay.rs は置き場を temp の dir の下の子に置き、直す前の積みの先端で lib の 1,324 本を temp を離して撃っても、temp の直下の host の根に dir も札もできなかった）。fleet.rs の UsageFixture と pipe.rs と hook.rs の、置き場を 1 段下に置く注の字（直しの後は既定の置き場も閉じるが、字は替えない）。
  - n: 6
    type: prose
    title: 行 xp-prov-review — 受付の審査の版の記録
    body: |
      在りか。差の file docs/design/patch/xp-prov-review.patch は、行 xp-host-runs の試作の木 408b9e09 と、その上に試作を載せた木 d9fedb52（写し drafts/w112a の branch xp-rev）との差（9,252 byte・1 file・+59 −13）。pipe/review.rs は行 xp-host-runs と xp-provenance の差が触れないので、差は木 49a483ad（行 xp-provenance の試作の木）にもそのまま当たる（一時の index で git apply --check rc 0）。

      なぜ。判断の記録 ADR-37 の決定 (7) は版の記録を runner と審査役の各々と書く。行 xp-provenance は runner と gate の lens の消費の event に版の 4 語を書くが、受付の審査（pipe/review.rs の lens・段 Reviewed）の消費の event（出所 review）は書かない。実験場の基準（審査の FAIL の率）を版ごとに比べるには、受付の審査の版も event に要る。

      形。受付の審査の lens は gate と同じ器の lens（headless/lens.rs）を撃つ行で、行 xp-provenance の後の lens は消費の 6 値を運ぶ判定 object の末に key provenance の対を足す。この行は審査の側の読みだけを足す（lens と probe は替えない）。 - decide: 3 つ目の返りを消費の 6 値だけ（Option の Usage）から 6 値と 4 語の対（型の別名 Spent）に替える（4 つ組の形と数は替えない・clippy の type_complexity を避ける別名）。 - lens_spent（新しい関数）: stdout の最後の JSON 行を gate と同じ last_json_object で読み、Usage::from_pairs が揃う周だけ、provenance::of_pairs の 4 語か 4 語とも unmeasured（provenance::UNMEASURED_WORDS）を対にする。 - review_cost（新しい関数）: Spent から出所 review の Cost と detail の 4 語を作る（無い周は両方 None）。 - review: record_cost を record_cost_with に替え、review_cost の 2 つを渡す（使い回した周は lens を撃たないので今までどおり書かない）。 - 歯 xprev_ の 2 本（review.rs の歯の module の末）。

      event の形。消費の event RunCost の key は替えない。出所 review の行の detail は 4 語だけ（審査の lens の囲いの書きの語は行 xp-io-bytes の範囲の外で、書かない）。読み手（pipe report と面の pipeline.rs）は detail を読まない。行の審査（review_ref.rs の read_lens）は消費の event を書かないので替えない。

      偽の claude の罠。この行は claude を撃つ所を足さない（版の撃ちは行 xp-provenance の器の lens の中に在る）。受付の審査の e2e の偽の lens は shell の行で claude を起こさず、器の lens を審査の lens に置く e2e（tests/e2e/pipe/gate.rs の real_lens と max_turns_lens）の偽の claude は行 xp-provenance が引数 --version に答える形に直したので、この行で新しく落ちる歯は無い（入れ子の nextest で全部緑）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜2 番目の項は verify の 3 行目（器の lib の歯 xprev_ の 2 本）、最後の 3 番目の項は 4 行目（xtask の check）で測る。verify の 1 行目と 2 行目は命令の rc で測る守りで、done の項にしない。review の中の配線（record_cost_with へ review_cost の 2 つを渡す 1 行）は lib の歯で測らない。

      構造の連鎖（木 408b9e09 で grep）。decide の呼び手は review の 1 か所。record_cost の呼び手は review.rs ではこの 1 か所（ほかの file の呼び手は替えない）。lens_usage は read_lens が今までどおり使う。器の file の行の上限（1500）: review.rs は 1389 行から 1435 行。

      入口の赤。木 12948f47（写しの branch xp-red・行 xp-host-runs の頭も同じ木）は、歯の 2 本と、lens_spent と review_cost の頭だけ（中身は今の振る舞い: 6 値だけを読み 4 語は空・detail は書かない）を置いた木で、verify の 3 行目は rc 100（2 本とも落ちる）。

      試作と噛み。写し drafts/w112a で書く file は write-set の中で閉じる（1 file）。verify の 2 行目と 3 行目は rc 0（歯 xprev_spent_reads_usage_and_words_from_the_last_object・xprev_cost_is_review_with_the_words_as_detail の 2 本）。入れ子の 4 段は xtask と同じ引数と置き場（target/nested/scribe2）と cwd（scribe2/）で、2 行の試作を当てた木 d9fedb52 で撃って 4 段とも rc 0（nextest run --workspace --no-fail-fast は 4,038 本が全部緑・器の xtask check は ok の 1 行で file-lines=1499/1500・core-lines=82904/90000・boundary-spawn=1/1）。根の段は撃っていない（この行は scribe2/ の外を書かない・席が温かい木で撃つ）。句ごとの噛みは 7 で、どれも名指しの歯が rc 100 で落ち、対照は rc 0（係の bites.tsv）。

      流す時と順。scribe2/ を書く便は同時に 1 本まで（判断の記録 ADR-33 の決定 (12)）。行 xp-provenance の着地の後に流す（provenance の関数を使う・depends）。行 xp-host-runs とは書く file が重ならない。

      範囲の外。行の審査（review_ref.rs）の lens の版。受付の審査の lens の囲いの書きの語。pipe show と面に版を出すこと。
  - n: 7
    type: prose
    title: 行 xp-host-live — 札を数えて口座の選びの頭の鍵に入れる
    body: |
      在りか。差の file docs/design/patch/xp-host-live.patch は、行 xp-prov-review の試作の木 58377981（写し drafts/w120a の branch xp-live-base・main 75a34378 に行 v-lane と v-lane-cap の差を当て、行 xp-io-bytes・xp-provenance・xp-host-runs・xp-prov-review の試作 4 本を順に載せた木）と、その上に試作を載せた木 c9496898（branch xp-live）との差（30,813 byte・7 file・+278 −23）。差の触れる 7 file は係 w112a の木 d9fedb52 と木 58377981 で同じ字なので、差は d9fedb52 にもそのまま当たる。pipe/live.rs は行 xp-host-runs が作る file。

      なぜ。判断の記録 ADR-41（持ち主の裁定 t3-hub.74.61.1:20261004T0113Z-1・案 A）と ADR-37 の決定 (7)。実験場の便は本番と同じ口座の消える残りを使い、実験の置き場は本番の置き場と同じ親の下に置く。器の便用の選び（器の ADR-0042）は 7 日の窓の reset の早い口座 → 走っている便の数 → label の順で、走っている便の数は自分の置き場の event だけを数え、しかも reset が同じ口座の間でしか効かない。ゆえに本番と実験の便が同じ口座を選んで 5 時間の窓を取り合う。この行は行 xp-host-runs の札を数え、ほかの置き場の生きた札を持つ口座を鍵の頭で後に回す（外さない）。

      形。 - pipe/live.rs: 札の dir の判じの型 Scan（ほかの置き場の生きた札の口座の集合 elsewhere と回収に回る札 doomed）、scan（pure に起動の時刻の関数を受ける・消さない・拡張子 run の札だけを読み、生死は受付札の判じと同じ pid と起動の時刻が札の ts 以前か）、elsewhere（置き場の host の根の dir runs を本物の起動の時刻で scan し、回収に回る札を消して口座の集合を返す）と歯 xplive_ の 3 本（tests の module の末）。module の注に数える側の段を足す。 - fleet/select.rs: select_with（select の本体・ほかの置き場の札を持つ口座の集合を受ける）と、select は空の集合で select_with を呼ぶ形。候補 Candidate に欄 elsewhere を足し、standing が集合から写す（外す理由にしない）。run_key の頭に bool を足す。session 用の pick は欄を読まない。module の注と Purpose::Run の注に頭の鍵を足す。 - fleet/select_tests.rs: use に select_with を足し、file の末に助け choose_held と week_first と歯 xplive_ の 3 本。 - fleet/replay.rs: select_for_run の引数に置き場 state_dir を足し（引数は 4 つ）、入力を let input に束ねて select_with へ crate::pipe::live::elsewhere(state_dir) を渡す。歯の助け pick は temp の dir の下の置き場を渡し、歯 xplive_ の 1 本を tests の module の末に足す。 - pipe/ratelimit.rs: select_lens_account と choose_or_wait の select_for_run の呼びに state_dir を足す（2 行）。 - fleet/wait.rs: account_free の select_for_run の呼びに state_dir を足す（1 行）。 - fleet/cli.rs: fleet select の入力を let input に束ね、select_with へ crate::pipe::live::elsewhere(dir) を渡す（session 用は select_with が読まない）。

      鍵の形。run_key は（ほかの置き場の札を持つか・7 日の窓の reset を持たないか・7 日の窓の reset・走っている便の数・label）の 5 つ組の辞書順（比べの関数に分岐を持たない形のまま）。札を持つ口座どうしは今の 4 つの鍵で並ぶ。候補なしの周の理由と内訳と reset は候補の外の口座だけから作るので、札で替わらない。

      ADR-36 の決定 (6) の地図。書く 7 file が引く器の提案中の記録（17 本）は 0 本で、受け直す提案中の記録は無い。振る舞いを替える器の記録は発効した器の ADR-0042（便用の鍵の頭を足す）で、判断の記録 ADR-41 が受ける。器の ADR-0027（口座あたりの便数で外さない）は外さない形で守る。ほかに引く器の記録（ADR-0004・ADR-0017・ADR-0020・ADR-0024・ADR-0026・ADR-0028）の振る舞いは替えない。器の設計文書（account-autonomy.md の §3 と §19）は凍った資料として書き換えない（ADR-36 の決定 (7)）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜7 番目の項は verify の 3 行目（器の lib の歯 xplive_ の 7 本・在りかは pipe/live.rs の 3 本と fleet/select_tests.rs の 3 本と fleet/replay.rs の 1 本）、最後の 8 番目の項は 4 行目（xtask の check・入れ子の段で器の歯の全部と clippy を撃つ）で測る。verify の 1 行目（差の hunk が全部木に在る）と 2 行目（器の clippy）は命令の rc で測る守りで、done の項にしない。呼び手の配線は done の項にせず、振る舞いの歯で測らない。在りかは verify の 1 行目（差の hunk が全部木に在る）が測る（ratelimit.rs の 2 か所と wait.rs の 1 か所は select_for_run の引数の型も強いる・fleet/cli.rs の fleet select の 1 か所は差の hunk だけが測る・fleet select は計測の口 run_fresh を通るので lib の歯の置き場を持たない）。

      構造の連鎖（木 58377981 で grep）。select_for_run の呼び手は ratelimit.rs の 2 か所・wait.rs の 1 か所・replay.rs の歯の助け 1 か所で、全部を書く（器の e2e は select_for_run を呼ばない）。select の呼び手（seat の tick.rs と tick/park.rs と cycle/relaunch.rs・fleet/cli.rs・e2e の fleet.rs と prop.rs・select_tests.rs）は select の形を替えないので書かない（fleet/cli.rs だけ select_with に替える）。Candidate の構築は standing の 1 か所、run_key の呼び手は pick の 1 か所。RunSelect と Pool::run_select と Completion::AccountFree の欄は替えない。器の file の行の上限（1500）: 書く file の最大は fleet/wait.rs の 1230 行（替わらない）で、fleet/select_tests.rs は 929 行から 1009 行。器の clippy の引数の上限（5）: select_for_run は 4 つ。

      入口の赤。木 9ff13fa3（写しの branch xp-live-red2）は、試作の木から中身だけを今の振る舞いへ戻した木（scan は空・elsewhere は空の集合・run_key の頭は常に偽・select_for_run は置き場を読まない）で、verify の 3 行目は rc 100（7 本とも落ちる）。

      試作と噛み。写し drafts/w120a で書く file は write-set の中で閉じる（7 file）。verify の 2 行目と 3 行目は rc 0（歯 xplive_scan_names_accounts_of_live_tickets_of_other_places・xplive_scan_dooms_dead_reused_and_broken_tickets・xplive_elsewhere_reads_the_host_root_and_reclaims_doomed_tickets・xplive_run_key_puts_accounts_held_elsewhere_last・xplive_held_elsewhere_goes_last_but_is_not_dropped・xplive_only_the_run_purpose_reads_tickets_elsewhere・xplive_select_for_run_reads_the_host_root_of_the_state_dir の 7 本）。入れ子の 4 段は xtask と同じ引数と置き場（target/nested/scribe2）と cwd（scribe2/）で、試作の木 c9496898 で撃って 4 段とも rc 0（nextest run --workspace --no-fail-fast は 4,048 本が全部緑・器の xtask check は ok の 1 行で file-lines=1499/1500・core-lines=82992/90000・boundary-spawn=1/1）。根の段は撃っていない（この行は scribe2/ の外を書かない・席が温かい木で撃つ）。句ごとの噛みは 26 で、どれも名指しの歯が rc 100 で落ち、対照は rc 0（変異と歯の表は係の bites.tsv）。

      費用。便用の選び 1 回ごとに host の根の dir runs を 1 度読み、札 1 枚ごとに札の本文と持ち主の起動の時刻を 1 度読む（札は走っている runner の数だけ）。口座の待ちの観測（5 秒ごと）も同じ。死んだ札は見つけた周に消す。

      流す時と順。scribe2/ を書く便は同時に 1 本まで（判断の記録 ADR-33 の決定 (12)）。行 xp-host-runs の着地の後に流す（pipe/live.rs を書く・depends）。行 xp-prov-review とは書く file が重ならない。

      範囲の外。gate と受付の審査の lens の claude の札。置き場の字の正規化（相対の --state-dir の置き場は字のまま比べる）。受付札の判じとの共通化。器の設計文書の書き換え。
  - n: 8
    type: prose
    title: 席の手元の憲法の写しの行（判断の記録 ADR-38）
    body: |
      なぜ。判断の記録 ADR-38（持ち主の裁定 t3-hub.74.59.1〜t3-hub.74.59.6・憲法 第 1.4 版）は、憲法を tsuzuri の 1 つにまとめ、席の手元へ要の写しを注ぐと決めた。決定 (3)(4) で tz derive が憲法の正本から要の写し（contracts/seat/brief.txt）と全文の写し（contracts/seat/constitution.txt）を導き、--check が正本との差を落とし、要の写しの file 全体の byte を規則の行 R-1 の値から R-41 の値を引いた上限で測る。決定 (6)(7) で、器の行 v-brief-const（器の SessionStart が要の写しを字のまま出す）が効くまで、tsuzuri の根の plugin の SessionStart に暫定の 1 本を足す。決定 (10) でこの行は tsuzuri の側の行として器の列の外で流し、hooks.json を書く行 cs-plugin の後に置く。

      係 w124a の行。ADR-38 は行 t-seatcopy を 1 行と書いたが、差が folio の crate（導き・上限）と plugin（暫定の hook）に分かれ、合わせて約 950 行になるので、t-seatcopy（tz derive の 2 つの写しと --check と上限・欄 key の 2 つの値）と t-seathook（暫定の hook と歯 2 本）の 2 行に割った。t-seatcopy は書く file が 27b のほかの行と重ならず depends を置かない。t-seathook は hooks.json と着地した歯 gins.rs を行 cs-plugin も書くので depends に cs-plugin を置き、出す file を t-seatcopy が導くので depends に t-seatcopy も置く。器の行 v-brief-const（係 w126a・この 2 行の後に置いた）の depends は ADR-38 の字の t-seatcopy に t-seathook を足した 2 行。

      欄 key の 2 つの値（決定 (4)）。道具は規則の行の値を id でなく欄 key で読むので、t-seatcopy が規則の表の欄 key の閉じた一覧に seat-bytes（R-1 に書く）と seat-role-bytes（R-41 に書く）を足す。欄を R-1 と R-41 に書くのは t-seatcopy の着地の後の設計の commit で、tsuzuri の規則の表 design-intent/rules.yaml はこの 2 行の write-set に入らない（folio2/design-intent/rules.yaml は folio の歯の写しの置き場で、生成区間だけを tz schema --write で書く）。2 行の欄が両方無い置き場では写しを導かないので、着地から設計の commit までの間、main の tz derive --check は前のまま一致する。席の pin の tz（古い版）は新しい 2 つの値を閉じた一覧の外と見て tz check で落とすので、設計の commit は pin を t-seatcopy の着地の後の main で組み直した版に上げてから書く（R-1 と R-41 の欄・tz schema --write の生成区間・tz derive --write の 2 つの写し）。

      暫定の問いの口（決定 (6)・名と形は器の行 v-brief-const の口と同じ）。器の binary への問いは、器の hook と同じ呼び（環境の SCRIBE2_BIN か名 scribe2）に語 vessel と seat-constitution と --project と project の dir を渡し、その project の席の brief が要の写しを出すなら rc 0、そうでなければ 0 でない rc で答え、標準出力にも標準エラーにも字を出さなくてよい（hook は捨てる）。今の器にはこの口が無いので、使い方の rc 1 で落ち、hook が要の写しを出す。問いの口の名と形は器の行 v-brief-const が同じ字で置いた（v-brief-const の write-set に hooks.json と歯 seathk_ の file は入らない）。暫定の 1 本は、器の入れ替えの後に印が全部の席で効くと確かめた後の行で消す（ADR-38 決定 (6)）。
  - n: 9
    type: prose
    title: 行 t-seatcopy — tz derive の要の写しと全文の写しと上限
    body: |
      在りか。差の file docs/design/patch/t-seatcopy.patch は、係 w113a の 4 行・係 w117a の 2 行・係 w119a の 3 行・係 w122a の 3 行を main 8cd1dc6f（憲法 第 1.4 版と判断の記録 ADR-38 の発効）に順に当てた土台の木 e1c0c42a と、その上に試作を載せた木 dce7ad6b（写し drafts/w124a の branch p-seatcopy）との差（54,398 byte・9 file・新しい file 2・+699 −18）。書く file は土台の 12 行と重ならないので、main 8cd1dc6f にも単独で当たる。

      なぜ。判断の記録 ADR-38 決定 (3)（2 つの写しの形と --check と断り）と決定 (4)（測る者は tz derive・上限は R-1 の値から R-41 の値を引いた数・道具は欄 key で読む）。条 P-13 の 2 つ目の規範文と P-2 の 1 つ目の規範文の差の検査を、今の tz derive --check の仕組みに入れる。

      形。 - folio2/crates/folio/src/seat.rs（新しい file・区切り seat・層 3）: 定数 DIR（seat）・BRIEF（brief.txt）・FULL（constitution.txt）・頭の 1 行の頭の字（生成物・手で直さない・）・順位と在りかの頭の語（順位・全文）・段の順と段の名の表 TIERS（Never は 絶対にやらない・AskFirst は 確認してから・Always は いつも守る＝条 P-13.1 の字・面の名札の 確認してから変える とは違う）。型 Copies（brief・full・cap）。関数 derive（正本の置き場の rules.yaml を plan::load_rules で読み、欄 key の 2 行が両方無ければ None、在れば constitution.yaml の meta.version・precedence.text・articles を読み、2 つの字と上限を返す）・cap（2 つの値の差・片方だけと差が 0 以下は Err）・articles と statement（退いた folio inject の導き方を引き継ぐ・強さは憲法から導出した Strength の名・text の空白を畳んで 。で終わるか・0 本は Err）・brief と full（行を改行 1 つでつなぎ末尾に改行 1 つ）・squash・place_root と under と rel（正本の置き場を実の path で解いて note::root_of の根を求め、正本の path と導出物の置き場の path を根からの字にする）。 - folio2/crates/folio/src/rules.rs: 欄 key の値 SEAT_BYTES（seat-bytes）と SEAT_ROLE_BYTES（seat-role-bytes）を足し、閉じた一覧 KEYS を 8 つにする。関数 bytes（欄 key の行の value の字 byte 以下 の前の正の整数・行が無ければ None・2 本以上と形の違いは Err）と grouped（3 桁ごとの , の読み）を足す。床の木の key_note の末尾に 2 つの値の 1 文を足す。単体の歯 f179_ の KEYS の期待の字を 8 つに。 - folio2/crates/folio/src/derive.rs: run は契約表の導出物の後に seat::derive を呼び、None なら前のまま、写しが上限を越えれば over_cap（違反 1・何も書かない）、そうでなければ 2 つの写しを置き場の下の dir seat の導出物として足す（seat_files）。書きは書く file の親の dir が無ければ作り（make_dirs・dir でない物が在れば何も作らない）、file でない形の見えに symlink の dir の下を足す（not_plain）。比べは symlink の dir の下を断る。頭の doc に 3 行。 - folio2/crates/folio/src/lib.rs: mod seat を seal の次に。 - 着地した歯と凍結の写し（字の足しだけ）: tests/teeth1/modules.rs の層の表に seat を層 3 で 1 行・tests/fixtures/schema/rules-region.txt（前の anchor の字に、値域の key の 1 行を 1 行 1 値の 9 行に書き替え、key_note の末尾に 1 文を手で足した）・folio2/design-intent/rules.yaml（生成区間を tz schema --write で書いた）・tests/tz4/schema_docs.rs（RULES_REGION_ の行数 42・byte 6,301・要約値を測り直した値に・注 2 行）。 - crates/tsuzuri-boundary/tests/seatcp.rs（新しい歯の file）: 歯ごとの置き場を CARGO_TARGET_TMPDIR の下に作って根で git init し、手で書いた小さな憲法と規則の表と空の design-note/ で tz derive を撃つ。

      節の字（歯 seatcp_two_files_shape が比べる字の形）。手で書いた憲法は版 v9.9・順位の字に空白の続き・file の中の段の順が always・never・ask-first・always。要の写しは 11 行（生成物・手で直さない・design-intent/constitution.yaml v9.9／順位 段の順 で解く。／絶対にやらない／N-1.1 消さない。／N-1.2 移す だけ。／確認してから／A-1.1 問う。／いつも守る／P-1 題 いち／P-2 題よん／全文 contracts/seat/constitution.txt・行の区切りの／は改行 1 つ）、全文の写しは 6 行（頭の行・順位の行・P-1.1 いつもの 文。・N-1.1・N-1.2・A-1.1 の行）。断りの見本は正しい見本から 1 句だけ外す（P-1.1 の強さ may・N-1.2 の末の 。を外す・articles を空の一覧に）。値の形の見本は seat-bytes の値を 8000 byte 以下（通す）・8,0000・08000・8,000 byte 未満・全角の 8 に替え、seat-role-bytes を 8,000 byte 以下にする。

      実の写しの大きさ（main 8cd1dc6f の憲法 第 1.4 版・係の測り）。要の写しは 58 行・5,160 byte で上限 6,000 byte の余り 840、全文の写しは 122 行・14,900 byte（係 w115a の measure-v14.out と同じ数・Rust と独立に書いた見本の script の写しと byte で同じ）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜6 番目の項は verify の 3 行目（歯 seatcp_two_files_shape・seatcp_refuses_three・seatcp_needs_both_keys・seatcp_byte_value_form・seatcp_check_drift・seatcp_cap_edge の 6 本）、7 番目の項は 4 行目（歯 f179_key_is_a_closed_list_and_one_threshold_row_per_key）と 5 行目（歯 rules_floor_derives_the_frozen_anchor_byte_for_byte）と 7 行目（歯 schema_check_matches_the_real_rules_file_and_its_frozen_digest）、8 番目の項は 6 行目（歯 p106_layers_cover_every_module）と 8 行目（歯 f119_write_matches_the_frozen_anchor_and_check_passes）、最後の 9 番目は 9 行目（xtask の check）で測る。verify の 1 行目と 2 行目は命令の rc で測る守りで、done の項にしない。

      構造の連鎖（木 dce7ad6b で grep）。seat::derive の呼び手は derive::run だけ。rules::bytes の呼び手は seat::cap だけ。KEYS は床の key_violations と床の木の値域 enums.key が読み、tz schema --write が置き場の規則の表の生成区間に書く（folio2 の置き場はこの行で書き、tsuzuri の置き場は着地の後の設計の commit で書く）。凍結 anchor rules-region.txt と RULES_REGION_ の要約値を読む歯は tz4 の schema_docs の f85_ ほかで、folio2 の規則の表の生成区間を写す歯（tz1 の f102_・tz3 の f121_・tz4 の place_name と schema の歯）は書いた生成区間で通る。derive の口の help と床の定数（floor_note の derived の節）は替えない。

      入口の赤。土台の木 e1c0c42a に歯の file seatcp.rs だけを置いた木 4b060128（写しの branch r-seatcopy）で、verify の 3 行目は rc 100（6 本とも落ちる）。

      試作と噛み。写し drafts/w124a で書く file は write-set の中で閉じる（9 file）。verify の 2〜8 行目は rc 0。根の build・clippy（--workspace --all-targets と面の wasm）と folio・tsuzuri-core・tsuzuri-boundary の歯の全部も rc 0。句ごとの噛みは 28 句（撃ちは 29 回）で、どれも名指しの歯が rc 100 で落ち、対照は rc 0（係の bites.tsv・1 巡目に 3 桁ごとの区切りの句が空振りしたので、見本を 8,0000 に替えて理由の字を見る形に直し、撃ち直して落ちた）。根の xtask の check は席が温かい木で撃つ。

      範囲の外。R-1 と R-41 の欄 key の字と tsuzuri の規則の表の生成区間と contracts/seat/ の 2 つの写しの file（着地の後の設計の commit）・暫定の hook（行 t-seathook）・器の SessionStart の出し方と役割の行の測り（器の行 v-brief-const）。
  - n: 10
    type: prose
    title: 行 t-seathook — 器の SessionStart が効くまでの暫定の hook
    body: |
      在りか。差の file docs/design/patch/t-seathook.patch は、行 t-seatcopy の試作の木 dce7ad6b と、その上に試作を載せた木 79307fa5（写し drafts/w124a の branch p-seathook）との差（10,428 byte・3 file・新しい file 1・+254）。hooks.json と gins.rs は行 cs-plugin の後に当たる（depends）。

      なぜ。判断の記録 ADR-38 決定 (6)（暫定・問い t3-hub.74.59.3 の案 A）と決定 (7)（ADR-8 の決定 (4) からのずれの範囲と期限）。器の行 v-brief-const が器の入れ替えで効くまで、tsuzuri の根の plugin（席の起動行の 1 本目）の SessionStart が要の写しを出す。tz に注入の口を足さず、CLAUDE.md も使わない。暫定の間は器の 5 行も残り、並びの hook の出力の順は決まらない（P-13.1 の順と 6 段だけの形を満たさないずれ・ADR-38 決定 (7)）。

      形。 - plugin/hooks/hooks.json: 鍵 SessionStart を PreToolUse と Stop の間に足し、要素 1 つ（matcher なし）・hook 1 つ（type command・timeout 10）。command は 3 つの段を || でつなぐ。1 段目は runner の印の除き（ほかの 4 本と同じ字・[ -e と、二重引用符で囲んだ $CLAUDE_PLUGIN_ROOT/scribe2-runner と、]）。2 段目は器の binary への問い（器の hook と同じ呼び・二重引用符で囲んだ ${SCRIBE2_BIN:-scribe2} に、語 vessel と seat-constitution と --project と、二重引用符で囲んだ $CLAUDE_PROJECT_DIR を続け、標準出力と標準エラーを >/dev/null 2>&1 で捨てる）。3 段目は cat に、二重引用符で囲んだ $CLAUDE_PROJECT_DIR/contracts/seat/brief.txt（前後に字を足さない）。席の dir の path は書かない（N-7・在りかは $CLAUDE_PROJECT_DIR からの相対）。捨て先の /dev/null は空の装置で席の path でなく、語の頭は > なので歯 fstop_plugin_stop_entry の絶対の path の語の数えに入らない。 - crates/tsuzuri-core/tests/teeth2/gins.rs（着地した歯の書き替え）: event の鍵の一覧に SessionStart を 1 行足すだけ。 - crates/tsuzuri-core/tests/seathk.rs（新しい歯の file）: hooks.json を JSON で読み、SessionStart の command を sh で撃つ。器は偽の script（受けた引数を記録の file に 1 行で足し、標準出力と標準エラーに字を出して置いた rc で終わる）。印の名は器の src/name.rs の名の定数の行と src/pipe/spawn.rs の RUNNER_MARK_SUFFIX の行を字で読んで組む（器の改名で除きが黙って外れないため・改名の行の write-set に hooks.json とこの歯の file を入れる）。

      節の字（歯 seathk_entry_shape が比べる command の語の並び）。[ ・-e・二重引用符で囲んだ $CLAUDE_PLUGIN_ROOT/scribe2-runner・]・||・二重引用符で囲んだ ${SCRIBE2_BIN:-scribe2}・vessel・seat-constitution・--project・二重引用符で囲んだ $CLAUDE_PROJECT_DIR・>/dev/null・2>&1・||・cat・二重引用符で囲んだ $CLAUDE_PROJECT_DIR/contracts/seat/brief.txt（語の区切りは空白 1 つ・JSON の中の二重引用符は逆斜線つき・字の正本は差の file）。歯の file の要の写しの見本は 3 行（頭の行・空白の続きを持つ順位の行・在りかの行）。

      問いの口（名と形は器の行 v-brief-const の口と同じ・係 w126a が合わせた）。器の binary は語 vessel と seat-constitution と --project と project の dir を受け、その project の宣言に鍵 seat-constitution が在り、この binary の brief が要の写しを出すなら rc 0、そうでなければ 0 でない rc で答える。今の器（組み 2d807ef08b80）は使い方の rc 1 で落ち、標準出力は空・標準エラーに使い方の 2 行（係の撃ち）なので、hook が要の写しを出す。器を古い binary へ戻せば問いが落ちてまた出す（決定 (6) の問いにした理由）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜6 番目の項は verify の 3 行目（歯 seathk_entry_shape・seathk_runner_mark_excluded・seathk_mark_name_from_vessel・seathk_prints_copy_verbatim・seathk_quiet_when_vessel_serves・seathk_quiet_for_runner の 6 本）、7 番目の項は 4 行目（歯 gins_pretool_bash_entry）と 5 行目（歯 fstop_plugin_stop_entry）、最後の 8 番目は 6 行目（xtask の check）で測る。verify の 1 行目と 2 行目は命令の rc で測る守りで、done の項にしない。

      構造の連鎖（木 79307fa5 で grep）。hooks.json を読む歯は gins（event の鍵の一覧を書き替えた）・fstop（Stop の要素と全部の字の値の絶対の path の語）・fdlt・fdlv・qsig・cwplg で、gins のほかは書き替えずに通る。Stop の command は runner の印の除きを持たないので、除きの歯は SessionStart の command だけを照らす（決定 (6)）。器の名の定数の行の字（pub const NAME と型と =）と RUNNER_MARK_SUFFIX の行の字は器の src の今の字。

      入口の赤。行 t-seatcopy の試作の木 dce7ad6b に歯の file seathk.rs だけを置いた木 058e55bd（写しの branch r-seathook）で、verify の 3 行目は rc 100（6 本とも落ちる）。

      席の手元で出るかの 1 度の確かめ（係の撃ち）。写しの規則の表の R-1 と R-41 に欄 key を足して tz derive --write を撃ち（rc 0・--check も rc 0）、hooks.json の SessionStart の command を、今の器の binary を PATH に置いて手で撃つと、標準出力は contracts/seat/brief.txt と byte で同じ（5,160 byte）で標準エラーは空、印の file を置くと空、SCRIBE2_BIN を rc 0 で終わる program にすると空。規則の表は撃った後に戻した。

      試作と噛み。写し drafts/w124a で書く file は write-set の中で閉じる（3 file）。verify の 2〜5 行目は rc 0。句ごとの噛みは 13 で、どれも名指しの歯が rc 100 で落ち、対照は rc 0（係の bites.tsv・器の名の定数と印の尾の定数を器の src で替える変異も、歯 seathk_mark_name_from_vessel が落とした・器が無い時の標準エラーの断言を足した木で撃ち直した）。根の xtask の check は席が温かい木で撃つ。

      範囲の外。器の問いの口の実装と器の SessionStart の出し方（器の行 v-brief-const）・暫定の 1 本を消す行（器の入れ替えの後・印が全部の席で効くと確かめた後）・席の起動行の器の plugin の dir の付け替え（席の手の 1 歩）・Stop の command の除き。
  - n: 11
    type: prose
    title: 行 v-brief-const — 器の SessionStart が要の写しを字のまま出す（器の側の最後の形の前半）
    body: |
      在りか。差の file docs/design/patch/v-brief-const.patch は、main 20eea980（行 v-lane-cap の着地）に行 xp-io-bytes・xp-provenance・xp-host-runs・xp-prov-review・xp-host-live の試作の差を順に当てた木 fe8a91d2（写し drafts/w126a の branch base）と、その上に試作を載せた木 53d0370f（branch p-const）との差（40,595 byte・9 file・新しい file 1・+390 −10）。差の触れる 9 file は 5 つの xp の差が触れないので、差は main 20eea980 にもそのまま当たる（床の写しで git apply --check の rc 0）。

      なぜ。判断の記録 ADR-38 の決定 (5)(6)(9)(11)。器の SessionStart の brief は器の中に埋めた雛形 12 行で、4〜8 行目が器の憲法の番号（A1・A4.2・A4.3・A2・A3・N1〜N3）を名指し、tsuzuri の番号と同じ字が別の条を指す（取り違えが 1 度起きた）。この行は、宣言の任意の鍵 seat-constitution で要の写し（行 t-seatcopy が導く contracts/seat/brief.txt）を名指した project の席だけ、その 5 行の代わりに要の写しを字のまま出す。名指さない project の席は今の 12 行のまま（決定 (9)）。暫定の hook（行 t-seathook）は器への問い vessel seat-constitution --project の rc 0 で黙るので、この行の binary の入れ替えの後は器だけが写しを出す。

      形。 - pipe/declaration/optional_keys.rs: 鍵の名 seat-constitution を宣言の鍵の列と任意の鍵の列の末尾に足し、読み手 seat_constitution_of（文字列の 1 本で、助け repo_file が repo 相対・末尾の斜線なし・英数字と . _ / - に閉じた字を見る・constitution_of の項目の照らしも同じ助けに寄せた）と、HEAD の宣言の読みを閉じた 3 値 SeatConstitution（Absent・Unreadable・Declared）に写す seat_constitution と写しの関数 seat_of（route_of と同じ形）を足す。 - pipe/declaration.rs: Declared の欄 seat_constitution と parse の読み 1 行と再輸出 1 行。 - seat/brief/mod.rs: 憲法の 5 行の行番号 CONSTITUTION_LINES（4..=8）と、穴を埋めた 12 行からその 5 行を除く role_lines。 - seat/brief/copy.rs（新しい file）: brief の出し分け Copy（Absent・Read・Refused）と、読み Copy::read（宣言の path の file を anchor の作業ツリーから読む・読めない周の 1 行は path と理由の語 not-found か not-utf8 か unreadable と次の 1 手を名指す）と、行 Copy::lines（Absent は 12 行・Read は写しの字を末尾の改行 1 つだけ外して改行で割った行と役割の 7 行・Refused は断りの 1 行と役割の 7 行）。 - hook/mod.rs: brief の中で render の後に Copy::read と Copy::lines を撃ち、出す行と記録の 1 行（what は今の session-start-brief のまま・bytes は出した行の byte）をその行から作る（鍵の無い席は今と同じ byte）。 - hook/vessel.rs: verb seat-constitution（旗は --project だけ）と使い方の 3 行目。 - help.rs: vessel の頁の SUBCOMMANDS と FLAGS に 1 行ずつ。

      鍵と写しの読み方。鍵は HEAD の宣言から読む（question_route と同じ head_declaration・作業ツリーの宣言は読まない）。写しの file は anchor の作業ツリーから読む（導く道具 tz derive --write が書く場所・暫定の hook が cat する場所と同じ）。写しの字は替えない（行の中の字と復帰の字も替えず、出力の層が行ごとに改行 1 つを足すので、file が改行で終わる限り byte で同じ）。

      問いの口の答え。rc 0 は、この器が仕える repo（印の名が器の名で置き場が紐づく）の HEAD の宣言が鍵を名乗る周だけ。写しの file が読めるかは問わない（読めない周も brief が自分で 1 行で名指すので、暫定の hook が同じ file の無さを 2 度言わない）。器を古い binary へ戻すと口が無く rc が 0 でなくなり、暫定がまた出す（決定 (6) の理由）。

      ADR-0045・ADR-0046 の受け直し。この行は器の判断の記録 ADR-0045（brief の 12 行の形）と ADR-0046（注入の範囲・順位と確認と禁止の出所の印の行だけを注ぐ）が述べる振る舞いを替える。判断の記録 ADR-38 の決定 (11) が 2 本を受け直し済みで、鍵の無い project の席では 2 本の決めをそのまま受け、鍵の在る project の席では ADR-38 の決定 (2)(5) が替える。ほかに引く器の記録（ADR-0022・ADR-0090・ADR-0096）の振る舞いは替えない。器の設計文書（seat-roles.md の §5）は凍った資料として書き換えない（ADR-36 の決定 (7)）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜8 番目の項は verify の 3 行目（器の lib の歯 vbconst_ の 8 本・在りかは optional_keys.rs の 2 本・seat/brief/mod.rs の 1 本・seat/brief/copy.rs の 4 本・hook/vessel.rs の 1 本）、9 番目の項は 4 行目（xtask の check の入れ子の nextest が撃つ器の e2e の歯 vbconst_hook_brief_prints_the_copy_in_place_of_the_five_lines・在りかは e2e の hook/session.rs の末）、最後の 10 番目の項は 4 行目で測る。verify の 1 行目（差の hunk が全部木に在る）と 2 行目（器の clippy）は命令の rc で測る守り。help.rs の 2 行と使い方の 3 行目は、器の e2e の外形の snapshot（e2e__hook__vessel_external_form.snap・4 行目で撃つ）と help の頁の歯が測る。

      構造の連鎖（木 53d0370f で grep）。Declared の構築は parse の 1 か所。宣言の鍵の列の歯は declaration.rs の 1 本（列の字を直した）。brief::render の呼び手は hook/mod.rs の brief の 1 か所。vessel の使い方の字の読み手は e2e の外形の snapshot 1 本と vessel_cli.rs の 2 か所（usage の関数を呼ぶので字は替わらない）と help の頁の歯（FORM は 1 行目のまま）。器の file の行の上限（1500・幅で数える）: 書く file の最大は pipe/declaration.rs の 1422（試作の後）。

      入口の赤。木 fff1cf4b（写しの branch r-const）は、試作の木から中身だけを今の振る舞いへ戻した木（鍵を鍵の列から外し読み手は値なし・5 行の行番号は外の 13・Copy::read は常に Absent・verb を外す）で、verify の 3 行目は rc 100（8 本のうち 6 本が落ちる・通る 2 本は今も成り立つ断りと鍵の無い席の 12 行）、器の e2e の歯も落ちる。

      試作と噛み。写し drafts/w126a で書く file は write-set の中で閉じる（9 file）。verify の 2 行目と 3 行目は rc 0。入れ子の 4 段は xtask と同じ引数と置き場（target/nested/scribe2）と cwd（scribe2/）で撃った。木 7ecd63bb で build と clippy --workspace --all-targets は rc 0、nextest run --workspace --no-fail-fast は 4,057 本のうち 4,056 本が緑で、落ちた 1 本（xtask の歯 check_passes_on_workspace）は器の xtask check の paths-clean が歯の見本の字（home の短縮記号の直後の斜線）を private path 形と読んだもの。見本の字を替えた木 53d0370f で器の xtask check は ok の 1 行（file-lines=1499/1500・core-lines=83178/90000）、落ちた歯と lib の歯 vbconst_ の撃ち直しは rc 0。根の段は撃っていない（この行は scribe2/ の外を書かない・席が温かい木で撃つ）。 句ごとの噛みは 12 で、どれも名指しの歯が rc 100 で落ち、対照は rc 0（変異と歯の表は係の bites.tsv）。

      流す時と順。scribe2/ を書く便は同時に 1 本まで（判断の記録 ADR-33 の決定 (12)）。行 t-seatcopy（写しを導く）と行 t-seathook（暫定の hook と器への問いの字）の後に流す（depends）。行 v-lane-cap は 27a の行で、27b の作りが 27a の全部の行の着地を前提にするので先に着地している。入れ替えの後の席の手（tsuzuri の宣言に鍵を足す・起動行の plugin の dir の付け替え・暫定の hook を消す行）は係の notes。

      範囲の外。出力ごとの記録（役割の行の byte と 1 回の出力の字の数）と R-41 の値を越えた時の検出と doctor の語（後の行）。雛形の 5 行の番号の付け替え（行 v-renum-face）。tsuzuri の宣言に鍵を書くこと（席の手）。器の設計文書の書き換え。
  - n: 12
    type: prose
    title: board の作る行（判断の記録 ADR-30）
    body: |
      拠り。判断の記録 ADR-30（board の概要の出し分け・個別の頁の詳細の表示・短い題の上限と起票の門・測れていないの直し・持ち主の裁定 t3-hub.76.1〜t3-hub.76.6 の 6 つ〔どれも末尾は :20261003T0057Z-1〕）と、それを写した要件書 第 0.26 版（要件 FR4・FR5・FR6・FR10・FR15 と受入 AC20）と規則の行 R-19（吹き出しの概要は 200 字で畳み、短い題は 20 字 以下・越えれば頭の 19 字と … の 20 字・字数は Unicode のスカラー値）と R-39（起票の短い題の門）。board の全体の決まりの正本は ADR-30 決定 (2) と、要件 FR15 の shall の字（面は概要を出す全部の所で、初心者の表示の型では非エンジニア向けだけを、経験者の表示の型ではエンジニア向けだけを出し、字は切り捨てず、長い時は規則の行 R-19 の字数で畳んで開ける形で出す）。

      作る行の割り（15 行・係 w82a の計画の 13 行を main 882e0298 で照らし直し、決定の字の穴を埋める 2 行 g-fold-keep と g-node-excerpt を係 w125a が足した）。波 1 は c-sum-two（2 つの概要の読みを 1 つの関数に・決定 (7)）・c-short-cap（短い題の 20 字の切りと待っている相手の口の id を縮めない stylesheet の規則・決定 (5)）・e-hold-mark（台帳の印が最後に読めた時と同じ間は最後に読めた字を返す・決定 (10)）で、互いに書く file が重ならず depends は無い。短い題の門 c-short-gate（決定 (6)・規則の行 R-39）は c-short-cap の後。この 4 行は係 w113a の試作。残りの 9 行（mode で概要を 1 つ選ぶ部品 g-sum-pick・質問の窓の card g-ask-mode・hover の card g-card-mode・吹き出しの全文と畳み g-pop-sum・本文の書式の描き手 g-md-view・個別の頁の本文と記録 g-node-body・使われなくなった事実の概要の掃除 c-fact-trim・一覧の行の hover の印 g-list-hover・一覧の段の印 g-list-sym）と 2 行は、下の段の係 w122a・w123a・w125a の試作で同じ第 0.1 版に置いた。

      流す時。c-short-gate は、席の起票の手順（作る命令に短い題を渡す）を替えた後に着地させる（ADR-30 の note）。着地の後は、席が bd か bdw の create で置く bead は全部 metadata の short（20 字 以下）を持たないと門が断る。e-hold-mark は面の server の台帳の読みだけを替え、規則の行 R-21 の値（15 秒の注意の印・60 秒の測れていない）と字は替えない。

      着地の後の測り（ADR-30 の retreat）。席は決定 (10) の行の着地の後、重い時（組み立てが重なる時）に board を開いて 3 度見て、測れていないが 1 度でも出たら規則の行 R-21 の秒を問い直す。決定 (6) の門の行の着地の後 14 日の内に、門が席の起票を断った事が 10 度を越えるか、門のために席の手順が止まった事を 2 度記帳したら、門を注意だけにする形を問い直す。

      係 w122a の行。残りの 9 行のうち、表示の型で概要を 1 つ選ぶ部品と個別の頁の概要の箱 g-sum-pick と、それを使う質問の窓の card の g-ask-mode と hover の節点の card の g-card-mode の 3 行を置く。差は相談の窓の行 cs-pop の試作の先端（係 w113a の 4 行・係 w117a の 2 行・係 w119a の 3 行を当てた木）から表の順に切り、style.css と vocab.json は c-short-cap・cs-bar・cs-pop の後に当たる（g-sum-pick の depends に c-short-cap と cs-pop）。g-ask-mode と g-card-mode は互いに書く file が重ならず、どちらも g-sum-pick の後に並べて流せる。残りの 6 行（g-pop-sum・g-md-view・g-node-body・c-fact-trim・g-list-hover・g-list-sym）は下の段の係 w123a と w125a が置いた。g-pop-sum の depends に cs-pop を置いた（吹き出しの file pop.rs を cs-pop も書く）。

      係 w123a の行。残りの 6 行のうち、吹き出しの概要を表示の型の 1 つで全文と畳みで出す g-pop-sum と、本文の書式の一部を字の node で描く部品 g-md-view と、個別の頁に本文と記録の block を足す g-node-body の 3 行を置く。差は係 w122a の行 g-card-mode の試作の先端（土台に w122a の 3 行を載せた木）から表の順に 1 本の連なりで切ったが、3 つの差は g-sum-pick の先端の木にも g-pop-sum → g-md-view → g-node-body の順で当たり、g-md-view は g-pop-sum の前にも当たり、w122a の g-ask-mode と g-card-mode の差は 3 行の後にも当たる（一時の index で照らした）。depends は書く file の重なりだけで置く（g-pop-sum は c-sum-two と g-sum-pick と cs-pop・g-md-view は g-sum-pick・g-node-body は g-md-view と g-pop-sum）。残りの 3 行（c-fact-trim・g-list-hover・g-list-sym）は下の段の係 w125a が置いた。

      係 w125a の行。残りの 3 行（事実の口の概要を消す c-fact-trim・一覧の行の hover で札に印を付ける g-list-hover・一覧の段の字と組の頭の数に段の記号を付ける g-list-sym）と、判断の記録 ADR-30 の決定の字のうちまだどの行にも入っていなかった 2 つを埋める 2 行（決定 (4) の 本文と記録の開き閉じはその browser に覚える を満たす g-fold-keep・決定 (2) の 両方無い時は本文の頭の 1 行を本文からの印つきで出す を個別の頁で満たす g-node-excerpt）を置く。差は係 w123a の行 g-node-body の試作の先端から表の順に 1 本の連なりで切り、各行の差は depends の閉包の行の差だけを main に当てた木にも当たる（一時の index で照らした）。depends は書く file の重なりだけで置く（c-fact-trim は g-pop-sum と c-short-cap・g-list-hover は c-fact-trim と g-node-body・g-list-sym は g-list-hover・g-fold-keep は g-node-body・g-node-excerpt は g-fold-keep）。g-fold-keep は着地した部品の開き閉じの記録の決まり（頁の一生の間だけ持ち保存の口に書かない・ノート surface-board の節 21）の例外を、個別の頁の本文と記録の 2 つの鍵だけに置く（要件 FR1 の browser に残す物の一覧の 4 つ目は要件書 第 0.28 版に、節 21 の例外の字はノート surface-board の第 0.22 版に、同じ commit で席が置いた）。
  - n: 13
    type: prose
    title: 行 c-sum-two — 2 つの概要の読みを 1 つの関数に
    body: |
      在りか。差の file docs/design/patch/c-sum-two.patch は main 882e0298 と、その上に試作を載せた木 02284708（写し drafts/w113a の branch p-sum）との差（17,471 byte・6 file・新しい file 3・+256 −21）。main 882e0298 にそのまま当たる（git apply --check の rc 0）。

      なぜ。判断の記録 ADR-30 決定 (7)。今の 2 つの概要の読みは、導出グラフの節点（crates/tsuzuri-core/src/graph/build.rs の bead の節点）と問いの card（question.rs）が本文の定型行（字 概要 = と字 技術 = で始まる行）だけを読み、便の bead の本文の形（見出しの行 ## 概要 と ## 技術 の下に字を置く形）を読まないので、契約の bead の個別の頁が要約なしになる。読みを契約の 1 つの関数にし、後の行（吹き出しの g-pop-sum）が面から同じ関数を呼べるようにする。

      形（要約・字は差の file）。新しい module crates/tsuzuri-contract/src/summary.rs: 定数 PLAIN_LINE・ENG_LINE（定型行の頭）・PLAIN_HEAD・ENG_HEAD（見出しの行）・OBSERVATION_HEAD（字 ### 観測）・EXCERPT_LABEL（字 概要 =）と、型 Summaries（plain と eng の Option の字）と、関数 summaries（2 つの概要を別々に、定型行 typed_line か、無ければ見出しの下の字 section で読む）・typed_line（中核の question.rs の typed の字を移した関数・行頭が頭の最初の行の残りの前後の空白を除いた字・空なら None）・section（見出しの行の次から井桁で始まる行の前まで・頭と末の空の行を除く）・excerpt（本文の頭の 1 行・中核の facts.rs の summary_of と同じ行の選び方で 120 字に切らない字・後の行が概要の無い時の代わりに使う）。lib.rs に pub mod summary の 1 行。question.rs: 定数 PLAIN_PREFIX と ENG_PREFIX は契約の PLAIN_LINE と ENG_LINE の再公開に、関数 typed は契約の typed_line の再公開にして名を残す（境界の歯 epolq と policy.rs が名を使う）。問いの card の plain と eng は summaries の字。build.rs の bead の節点の plain と eng も summaries の字。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜4 番目の項は verify の 3 行目（契約の歯 sumtw_ の 4 本）、5〜6 番目は 4 行目（中核の歯 sumcr_ の 2 本）、最後の 7 番目は 5 行目（xtask の check・歯の全部）。verify の 1 行目（差の hunk が全部木に在る）と 2 行目（契約と中核の clippy）は命令の rc で測る守りで、done の項にしない。

      構造の連鎖。typed の呼び手は question.rs の問いの card の理由と推奨の欄（字は替えない）と、境界の歯 epolq（名と字は替えない）。定型行の字を書く側の境界の policy.rs も名を替えない。facts.rs の summary_of と SUMMARY_MAX は替えない（吹き出しが読む事実の概要・後の行 c-fact-trim が消す）。着地した歯の fixture に見出しの形の本文は無い（grep で 0）ので、要約の無い節点の数を断言する歯 ksum と nsumw の数は替わらない。file の行数は書く file の最大が build.rs の 715 行。

      入口の赤。main 882e0298 に、歯の file 2 本と、summary.rs の型と関数の頭だけ（summaries は定型行だけを読む今の振る舞い・section と excerpt は None）と lib.rs の 1 行を置いた木 8cc549d7（写しの branch r-sum）で、verify の 3 行目と 4 行目は rc 100（6 本とも落ちる）。

      試作と噛み。写し drafts/w113a で書く file は write-set の中で閉じる（6 file）。verify の 2〜4 行目は rc 0（歯 sumtw_typed_line_wins・sumtw_head_section_until_next_head・sumtw_empty_is_none・sumtw_excerpt_keeps_whole_line・sumcr_build_reads_heads・sumcr_card_reads_heads の 6 本）。句ごとの噛みは 19 で、どれも名指しの歯が rc 100 で落ち、対照は rc 0（変異と歯の表は係の bites.tsv・変異は環境の印で切り替える 1 つの木で 1 度だけ組んだ）。4 行の試作の先端の前の版の木 418696a1 で、xtask の check の段（build --workspace・clippy --workspace --all-targets -D warnings・面の wasm の clippy）を xtask と同じ引数で撃って rc 0、契約・中核・境界・面・xtask の 5 crate の歯（境界の folio の群 tz1〜tz5 を含む 2,960 本）を撃って、行 e-hold-mark の着地した歯 2 本だけが落ちた（その行の節の罠・直した後の境界の群 teeth1〜teeth5 と新しい歯の 628 本は先端の木 d0a5e191 で全部通る・係の measure.tsv）。根の xtask の check そのものは撃っていない（席が温かい木で撃つ）。

      流す時と順。depends は無い（波 1・c-short-cap と e-hold-mark と書く file が重ならない）。

      範囲の外。面が mode で 1 つを選ぶ部品（行 g-sum-pick）と面の各所の当て。事実の概要 summary_of を消すこと（行 c-fact-trim）。2 つの概要を起票の時に書かせる門。
  - n: 14
    type: prose
    title: 行 c-short-cap — 短い題の 20 字の切りと相手の口の id
    body: |
      在りか。差の file docs/design/patch/c-short-cap.patch は、行 c-sum-two の試作の木 02284708 と、その上に試作を載せた木 c1919322（写し drafts/w113a の branch p-cap）との差（9,729 byte・5 file・新しい file 2・+127 −3）。書く file が c-sum-two と重ならないので main 882e0298 にもそのまま当たる（git apply --check の rc 0）。

      なぜ。判断の記録 ADR-30 決定 (5) と規則の行 R-19 の短い題の字数（20 字 以下・越えれば頭の 19 字と … の 20 字・字数は Unicode のスカラー値）。今の短い題（crates/tsuzuri-core/src/ledger/facts.rs の事実の short）は metadata の鍵 short の字か題から機械で作った字で、字数の上限も省きの印も無い。機械の短い題が 71 字の時、吹き出しの待っている相手の口が 4 行の高さになり、id の等幅の字が 43 画素から 19〜20 画素に潰れた（係 w82a の測り）。

      形（要約・字は差の file）。facts.rs: 定数 SHORT_MAX（20）と ELLIPSIS（…）と関数 capped（SHORT_MAX 字以下ならそのまま・越えれば頭の SHORT_MAX − 1 字と ELLIPSIS）を足し、事実の short を置いた字か機械の字の capped にする。short_set は置いた字かどうかのまま（切っても真）。module の doc に上限を足す。契約の ledger.rs: 欄 BeadFact.short の doc に上限の 1 句を足す（型と電文の形は替えない）。面の style.css: 吹き出しの相手の口の規則（行頭が字 .plk の行）の後に 2 行（.plk > span の min-width と半角のコロンと空白と 0・.plk code の flex と半角のコロンと空白と none）を足す。短い題の span が先に縮み、id の code は縮まない。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜3 番目の項は verify の 3 行目（中核の歯 shcap_ の 3 本）、4 番目は 4 行目（面の歯 shcss_ の 1 本・stylesheet の字を include_str で読む）、最後の 5 番目は 5 行目（xtask の check・歯の全部・stylesheet を読む着地した面の歯を含む）。verify の 1 行目と 2 行目は命令の rc で測る守り。

      構造の連鎖。facts.rs の short の作りは fact の 1 か所。capped は pub（後の行 c-short-gate は SHORT_MAX と SHORT_KEY を同じ file から読む）。面の吹き出しの口（src/widgets/pop.rs の partner_view）は class plk の button に記号と短い題の span と id の code と段の small を並べ、この行は markup を替えない。札の要の 1 行は id で待つ相手を出すので題の長さに依らない。着地した事実の歯（中核の群 teeth1 の bvfact）の fixture の短い題は 20 字以下で、緑のまま。

      入口の赤。行 c-sum-two の木 02284708 に、歯の file 2 本と facts.rs の定数と capped の頭（中身は字をそのまま返す）だけを置き、事実には当てない木 e75ccd83（写しの branch r-cap）で、verify の 3 行目と 4 行目は rc 100（4 本とも落ちる）。

      試作と噛み。写し drafts/w113a で書く file は write-set の中で閉じる（5 file）。verify の 2〜4 行目は rc 0（歯 shcap_machine_cut・shcap_twenty_kept・shcap_set_cut・shcss_partner_id_not_shrunk の 4 本）。句ごとの噛みは 9（中核の 7 は環境の印で切り替える 1 つの木・stylesheet の 2 は字を 1 つずつ外して組み直した）で、どれも名指しの歯が rc 100 で落ち、対照は rc 0（係の bites.tsv）。4 行の先端の木の段と歯は行 c-sum-two の節と同じ。

      流す時と順。depends は無い（波 1）。行 c-short-gate がこの行の後。後の行 c-fact-trim は同じ facts.rs を書く。

      範囲の外。起票の時に短い題を求める門（行 c-short-gate）。開いた bead の短い題を置き直すこと（席が置き済み）。札の要の 1 行の字。
  - n: 15
    type: prose
    title: 行 e-hold-mark — 台帳が替わっていない間は最後に読めた字
    body: |
      在りか。差の file docs/design/patch/e-hold-mark.patch は、行 c-short-cap の試作の木 c1919322 と、その上に試作を載せた木 8ae2e7c0（写し drafts/w113a の branch p-hold）との差（21,148 byte・4 file・新しい file 1・+280 −35）。書く file が前の 2 行と重ならないので main 882e0298 にもそのまま当たる（git apply --check の rc 0）。

      なぜ。判断の記録 ADR-30 決定 (10)（第 6 問の案 A・規則の行 R-21 の値と字は替えない）。今の面の server の台帳の読み（crates/tsuzuri-boundary/src/server/ledger.rs の Source）は、読みが 1 回 5 秒を越えて落ちると最後に終えた読みの結果に無しを置き、見張りの付いた got は印がその読みの前の印と同じ間は bd を撃たずにその無しを使うので、台帳が次に書かれるまで読み直さず、最後に読めた字が 60 秒より古くなると中身が測れていないになる。重い時の台帳の読みは 25 秒かかる（席の測り）。

      形（要約・字は差の file）。Source に欄 good_mark（最後に読めた合流の読みの前に取った印）を足す。got は、見張りの付いた Source で今の印が good_mark と同じなら、bd を撃たず最後に読めた字を stale の無しで返す（関数 unmoved）。ほかは今の形（印が最後に始めた読みの前の印と違えば自分で読み・同じなら走っている読みに合流するか最後に終えた読みの結果・無ければ読む・落ちれば最後に読めた字を上限 hold まで stale の時刻つきで）。合流の読みの中身を関数 shoot（上限の時間を受ける）に移し、読めれば最後に読めた字と時刻と good_mark と最後に終えた読みの結果を置き、落ちれば最後に終えた読みの結果を空にする（落ちた結果を持たないので、次の got が読み直す）。fresh は shoot を BD_TIMEOUT（5 秒）で撃つ。変化の見張りの read は、最後に読めた字が在れば shoot を新しい定数 WATCH_TIMEOUT（30 秒）で撃ち合流の待ちは WATCH_WAIT（WATCH_TIMEOUT に GRACE の 1 秒）、一度も読めていなければ（server の起動の読み・Server::bind は最初の読みを取ってから戻る）BD_TIMEOUT と BD_WAIT のまま（起動を 30 秒止めない）で、走っている要求の読みに合流して落ちた結果を受けた時は自分で読み直す。module と got と read の doc を直す。

      罠（着地した歯の直し）。2 本の着地した歯は決定 (10) が替える振る舞いを断言していたので書き替えた（直さないと、試作の木で lsnap_watched_source_reads_once と server_coalesce_shared_failure_then_new_read の 2 本が rc 100 で落ちた）。(ア) 歯 lsnap_（境界の群 teeth2 の lsnap.rs）の down_then_alone は、見張りの読みが落ちた後の got が落ちた時刻を返すと断言していた。印が同じ間は最後に読めた字を stale の無しで返す形と bd の回 3 に書き替えた（落ちた時刻の断言は印を動かした形で歯 ehmark_moved_mark_holds が持つ）。(イ) 歯 server_coalesce_（群 teeth3 の server_coalesce.rs）の server_coalesce_shared_failure_then_new_read は、起動の読みが落ちた後の口が bd を撃たず、戻しても見張りが読むまで落ちた結果を返すと断言していた。口が撃ち直す（合流して 1〜4 回）形と、戻した後の口の読みが 1 回撃って 8 行を返し、次の口は撃たない形に書き替え、印を動かす段を外した。着地した歯 server_src_bd_timeout_is_unknown（群 teeth4）は起動の読みが 5 秒で止まることを断言していて、起動の読みを 30 秒にした前の版の試作で落ちた（30 秒）ので、起動の読みは BD_TIMEOUT のままにした（替えない）。着地した歯 rhold_（群 teeth3）と elazy_（群 teeth1）は替えない。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜5 番目の項は verify の 3 行目（境界の歯 ehmark_ の 5 本）、6 番目は 4 行目と 5 行目（群 teeth2 の歯 lsnap_ の 5 本と群 teeth3 の歯 server_coalesce_ の 7 本）、最後の 7 番目は 6 行目（xtask の check・歯の全部）。verify の 1 行目と 2 行目は命令の rc で測る守り。

      構造の連鎖。Source の new は欄を 1 つ足すだけで、呼び手（server の Config から組む所・account board の台帳の読み・hook と CLI の text_alone）は替えない。text_alone と text_within は合流も持ち回しもしないまま。印の取り方（関数 mark）は替えない。規則の行 R-21 の 60 秒（READ_HOLD）と 15 秒（面の注意の印）は替えない。ledger.rs は 501 行から 552 行。

      入口の赤。行 c-short-cap の木 c1919322 に、歯の file と定数 WATCH_TIMEOUT と WATCH_WAIT の頭だけを置いた木 1c02c63b（写しの branch r-hold）で、verify の 3 行目は rc 100（ehmark_fail_keeps_text・ehmark_retry_after_fail・ehmark_watch_timeout の 3 本が落ちる・ehmark_same_mark_no_read と ehmark_moved_mark_holds は今の振る舞いのままでも通る歯で、この行が壊さないことを見る）。

      試作と噛み。写し drafts/w113a で書く file は write-set の中で閉じる（4 file）。verify の 2〜5 行目は rc 0（歯 ehmark_same_mark_no_read・ehmark_fail_keeps_text・ehmark_moved_mark_holds・ehmark_retry_after_fail・ehmark_watch_timeout の 5 本と lsnap_ の 5 本と server_coalesce_ の 7 本）。歯は偽の bd（撃たれた回を記録の file に足し、落とす印・1 回だけ落とす印・6 秒眠る印の file を見る）を撃ち、歯の全部で 16 秒ほど。句ごとの噛みは 12（着地した 2 本の書き替えの句を含む）で、どれも名指しの歯が rc 100 で落ち、対照は rc 0（係の bites.tsv）。4 行の先端の木の段と歯は行 c-sum-two の節と同じ。

      流す時と順。depends は無い（波 1）。

      範囲の外。規則の行 R-21 の値。読みの落ちを記録や event に残すこと。台帳の .beads/issues.jsonl を読む形と器の prefetch の写しを読む形（ADR-30 の案の比べで採らなかった）。
  - n: 16
    type: prose
    title: 行 c-short-gate — 起票の短い題の門
    body: |
      在りか。差の file docs/design/patch/c-short-gate.patch は、行 e-hold-mark の試作の木 8ae2e7c0 と、その上に試作を載せた木 d0a5e191（写し drafts/w113a の branch p-gate）との差（19,847 byte・6 file・新しい file 2・+332 −14）。書く file は前の 3 行と重ならず main 882e0298 にも字は当たる（git apply --check の rc 0）が、gate.rs が行 c-short-cap の SHORT_MAX を使うので組めるのは c-short-cap の後（depends）。

      なぜ。判断の記録 ADR-30 決定 (6)（第 5 問の案 A）と規則の行 R-39。前の決め（ADR-27 決定 (9) の席は起票の時に書く）は一度守られず、開いた bead の短い題が欠けた。席が台帳の道具 bd か書きの包み bdw の create で置く bead は、metadata の鍵 short に空でなく 20 字 以下の字を持たないと、問いの起票の門（PreToolUse の hook・hook の数は替えない）が断る。器が自分で起こす bead は門を通らないので数えない。

      形（要約・字は差の file）。中核の crates/tsuzuri-core/src/gate.rs: 断りの理由の型 ShortWhy（閉じた 5・NoMetadata・NotObject・Missing・Empty・Long と語 short-no-metadata・short-not-object・short-missing・short-empty・short-long と次の一手の 1 文）と、関数 creates（create の一続きの --metadata の値を label を問わず拾う）・short_why（metadata の字の断りの理由・字数は SHORT_MAX を facts.rs から読む）・short_gate（create の全部を command の順に見た最初の断り）・short_output（deny の JSON の字）。今の drafts の拾いを関数 create_segments（create の一続きを、問いの起票か〔label に intake:question を持つか〕と --metadata の値の組にする）に移し、drafts はその問いの組だけを Draft にする（拾う一続きと字は替えない）。今の output の JSON を組む所を関数 deny_json に移し、output と short_output が使う（output の字は替えない）。module の doc に門を足す。境界の crates/tsuzuri-boundary/src/hook/question_gate.rs: answer の頭で short_gate を見て、断れば short_output の字を返す（台帳と設計の索引を読む前・子 process を撃たない）。module の doc の順に段を 1 つ足す。

      罠（着地した歯の直し）。着地した境界の歯 qgate_（群 teeth3 の qgate.rs）と fprem_bin_（群 teeth2 の fpremhook.rs）は、metadata に short の無い起票の hook の入力で問いの門の判じを撃つ。この行の後は short の断りが先に出るので、qgate.rs の問いの起票の metadata と memo の起票の metadata に鍵 short（字 門の歯）を、fpremhook.rs の metadata に鍵 short（字 方針の歯）を足した（ほかの字と断言は替えない）。直さないと qgate_ の 4 本（qgate_bin_names_undisposed・qgate_bin_silent_when_disposed・qgate_bin_other_calls_spawn_nothing・qgate_bin_unread_is_unknown）と fprem_bin_ の 1 本（fprem_bin_new_policy_refused）が落ちる（試作の木で直す前の 2 file を当てて撃った・rc 100）。中核の歯 qgate_ と fprem_（gate::drafts と judge を直に撃つ）と、PreToolUse の hook を 1 つと pin する歯 gins_ は替えない。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜3 番目の項は verify の 3 行目（中核の歯 shrtc_ の 3 本）、4〜5 番目は 4 行目（境界の歯 shrtb_ の 2 本・tz を偽の program で撃つ）、6 番目は 5 行目と 6 行目（群の歯 qgate_ の 7 本と fprem_bin_ の 3 本）、最後の 7 番目は 7 行目（xtask の check・歯の全部）。verify の 1 行目と 2 行目は命令の rc で測る守り。

      構造の連鎖。drafts の呼び手は境界の answer と refuse（引数の誤りの時は今のまま問いの起票だけを args で断る・短い題は見ない）。output の呼び手は answer と refuse。ShortWhy と Why は別の型で、Why の 10 の語と ALL は替えない。gate.rs は 519 行から 622 行。

      入口の赤。行 e-hold-mark の前の版の試作の木 cdda6e77（この行の書く file は替わらない）に、歯の file 2 本と gate.rs の型 ShortWhy と関数の頭（creates は空・short_why と short_gate は None・short_output は空の字）だけを置き、境界は替えない木 a50e84e1（写しの branch r-gate）で、verify の 3 行目と 4 行目は rc 100（shrtc_ の 3 本と shrtb_deny_without_short が落ちる・shrtb_pass_with_short は今の振る舞いのままでも通る歯）。

      試作と噛み。写し drafts/w113a で書く file は write-set の中で閉じる（6 file）。verify の 2〜6 行目は rc 0（歯 shrtc_creates_all・shrtc_short_reasons・shrtc_gate_first_refusal・shrtb_deny_without_short・shrtb_pass_with_short の 5 本と qgate_ の 7 本と fprem_bin_ の 3 本）。句ごとの噛みは 14 で、どれも名指しの歯が rc 100 で落ち、対照は rc 0（係の bites.tsv）。4 行の先端の木の段と歯は行 c-sum-two の節と同じ。

      流す時と順。depends は c-short-cap（SHORT_MAX と SHORT_KEY）。席の起票の手順（bd と bdw の create に --metadata の short を渡す）を替えた後に着地させる。着地の後は bd create の --file の一度に多くを置く形も metadata を持たないので断られる。

      範囲の外。器が自分で起こす bead の短い題。起票の時に 2 つの概要を書かせる門。門を注意だけにする形（ADR-30 の retreat (4) で問い直す）。
  - n: 17
    type: prose
    title: 相談の窓の残りの行 — 入口（skill と board の口）と席の hook の拾い（判断の記録 ADR-29）
    body: |
      なぜ。判断の記録 ADR-29（持ち主の裁定 t3-hub.75.1 と t3-hub.75.2）の相談の窓は、計画 16 行のうち 11 行（cs-types から cs-close）がノート surface-wave27a で 2026-10-03 に着地した。残りの 5 行（cs-server・cs-hooks・cs-plugin・cs-bar・cs-pop）は席が置き漏らし（memo t3-hub.78）、入口の skill と board の button が無いので、持ち主は相談の窓を開けない。この節の行はその残りで、在りかと形は着地した 11 行の code（crates/tsuzuri-contract/src/consult.rs・crates/tsuzuri-core/src/consult/・crates/tsuzuri-boundary/src/consult/）の上に置く。

      係 w117a の行。cs-server（board の server の 3 つの口）と cs-plugin（skill /tsuzuri:consult と tz の解き方 bin/tzw・hook の 5 つの命令の切り替え）の 2 行。2 行は書く file が重ならず、どちらも着地した 11 行の後ならいつでも流せる（depends は置かない）。cs-hooks（見張りが居ない間に席の hook が拾う・cs-server の未受けの口を撃つ）・cs-bar（帯の相談の口と相談の窓・cs-server の一覧と頼みの口を撃つ）・cs-pop（吹き出しの相談の口・cs-bar の窓を開く）は下の段の係 w119a が置いた。cs-pop は board の作る行 g-pop-sum と同じ src/widgets/pop.rs を書くので、g-pop-sum の depends に cs-pop を置いた。

      入口の形（判断の記録 ADR-29 決定 (2)(4)）。skill は plugin/skills/consult/SKILL.md で、命令 /tsuzuri:consult になる（Claude Code の公式の文書 skills の字・plugin の skill は plugin の名と skill の名を半角のコロンでつなぐ）。skill は disable-model-invocation を持たない（持ち主が打つ時も席が自分で撃つ時も使う）。tz の解き方は plugin/bin/tzw の 1 つだけで、hook と skill の全部が通る。plugin の bin の dir は、plugin が有効な間 Bash の道具の殻の PATH に載る（公式の文書 plugins の components の Executables の字）ので、席は tzw を素の名で撃てる。hook の命令は bin の PATH に載らない（公式の文書は Bash の道具の殻だけを書く）ので、hooks.json は plugin の根の環境変数 CLAUDE_PLUGIN_ROOT から bin/tzw を撃つ。器の plugin（scribe2）は binary を環境の上書きか PATH の名で引き、plugin の根と project の dir を環境変数で受ける。tzw はそれに倣い、plugin と同じ checkout の build を先に、無ければ PATH の tz を引く（ADR-29 決定 (2) の 1 つの決まった解き方）。

      宣言の無い project（ADR-29 決定 (2) の後半）。hook の口は、repo（hook の環境の CLAUDE_PROJECT_DIR）の git config に project の宣言 scribe2.statedir が無ければ tz を撃たずに 0 で終わる。tz の consult の口は鍵 scribe2.statedir と tsuzuri.draftsdir を引き、無ければ rc 2 で断る（着地した cs-open の字）。tsuzuri の repo には今 tsuzuri.draftsdir が無いので、相談の窓を使う前に席か持ち主が置く（版管理に載らない git config・行の外）。

      受入の測り。AC16 と AC19 は着地した 11 行の歯が測った。この節の行の歯は口の電文と plugin の file の形を測る。囲いの実の効き（書けない）と skill の実の撃ちは、cs-plugin の着地の後に席の手で確かめ、memo t3-hub.78 に記帳する（ADR-29 の 10 節の席の手の確かめ・持ち主に案内する前）。

      係 w119a の行。cs-hooks（見張りが居ない間に席の 3 つの hook が拾う）・cs-bar（帯の相談の口と相談の窓）・cs-pop（札と行の吹き出しの相談の口）の 3 行。27b の中の順は席の決めで、c-short-cap → cs-bar → cs-pop → board の残りの 11 行（g-sum-pick 以降）とし、相談の入口を board の作る行より先に通す（cs-bar の depends に c-short-cap、cs-pop の depends に cs-bar・board の残りの行の係は cs-pop の先端から差を切った）。cs-hooks は cs-server（口 GET /api/consult/unreceived）と cs-plugin（hook の命令の tzw）の後に置く。3 行の差は書く file が重ならず、cs-hooks は面の file を、cs-bar と cs-pop は境界の file を書かない。

      相談の入口の働き（3 行の着地の後）。持ち主は帯の 相談 の口か、札と行の吹き出しの 相談する の口（題にその bead の id が入る）で相談の窓を開き、題と形と model を書いて送る。面の server は台帳に相談の頼みの行を 1 行置くだけで窓を開かない（cs-server）。席は見張り（tz consult watch）か、見張りが居ない間は 3 つの hook の拾い（cs-hooks）で頼みを知り、skill の手順（cs-plugin）で窓を開く。受けの無い頼みが 1800 秒を越えると、相談の窓の一覧に 席に届いていない が出る。
  - n: 18
    type: prose
    title: 行 cs-server — board の server の相談の窓の 3 つの口
    body: |
      在りか。差の file docs/design/patch/cs-server.patch は main 882e0298 と、その上に試作を載せた木 66c00c57（写し drafts/w117a の branch p-srv）との差（32,845 byte・6 file・新しい file 5・+740 −0）。

      なぜ。判断の記録 ADR-29 決定 (4)(8)(9)。board の帯の相談の口（行 cs-bar）は窓の一覧と頼みの口を、席の hook の安い判じ（行 cs-hooks）は未受けの口を撃つ。着地した 11 行の口（tz consult list の組み・中核の lines::unreceived・home_of）を server から使える形にする。

      形。 - server/consult.rs（新しい file）: 置き場の材料 Consult（new は起動の引数 Config と git の program を受ける・ctx は state dir と、repo の git config の鍵 tsuzuri.draftsdir の起草の置き場を要求ごとに引いて consult の Ctx を作り、state dir が無いか鍵が無いか値が dir でなければ None）・unknown_board（4 つの段が Unknown）・board（置き場と台帳の字の相談の行が揃えば tz consult list の list::board の組み・ほかは unknown_board）・waiting（退いていない作業場の所見の名と台帳の相談の行から中核の unreceived）・next_request（同じ分の字の頼みの行の数の最大 + 1）・Outcome（Recorded・LedgerUnknown・BadLine・NoRoot・AppendFailed）・request（台帳を新しい子 process の text_alone で読み直し、頼みの行を中核の render で書き、題から中核の home_of で選んだ memo か根に bdw の AppendNotes で 1 本足す）。 - routes/consult.rs（GET /api/consult・ConsultBoard）と routes/consultun.rs（GET /api/consult/unreceived・Reading の ConsultUnreceived）: 台帳は見張りの最後の読み got の字を使い、応答の頭は他の GET の口と同じ aged（e-hold の古さの秒）。読むだけの server も同じ。 - routes/consultreq.rs（POST /api/consult/request・ConsultRequest）: 守りは方針の口と同じ guarded（Origin・本文の大きさ・電文の形）、読むだけの server は受付の前に read_only の 403、応答は 200 と頼みの id の電文か、400 bad-line・503 ledger-unknown・503 no-root・502 ledger-append と頼みの置き場の id で、200 でなければ refusal_line の 1 行を標準エラーに書く。 - server/mod.rs: 行 pub mod consult; と Shared の欄 consult（bind_with の構築に 1 行）と頭の注の 2 行。

      罠。bind_with は clippy の too_many_lines（60）の縁なので、Consult の構築は Config を受ける new の 1 行にした（欄を並べると 63 行で落ちる）。頼みの id は分の字ごとに数えるので、同じ分に 2 度押した頼みも id が重ならない（読み直しは書きの前の新しい子 process）。口の列は build.rs が routes/ の file の名から作るので、mod.rs に口の宣言の行は要らない。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜6 番目の項は verify の 3 行目（歯 cwsrv_ の 6 本）、最後の 7 番目の項は 4 行目（xtask の check）で測る。verify の 1 行目（差の hunk が全部木に在る）と 2 行目（境界の clippy）は命令の rc で測る守りで、done の項にしない。

      構造の連鎖（木 66c00c57 で grep）。Shared の構築は bind_with の 1 か所。consult::list::board の呼び手は tz consult list と server の board の 2 か所。中核の unreceived の呼び手は watch の scan と server の waiting の 2 か所。書く file の最大は server/mod.rs の 471 行（上限 1500）。

      入口の赤。main 882e0298 に、歯の file と server/consult.rs の next_request の頭だけ（None を返す・口の file と欄は置かない）を置いた木 e878369e（写しの branch r-srv）で、verify の 3 行目は rc 100（6 本とも落ちる）。

      試作と噛み。写し drafts/w117a で書く file は write-set の中で閉じる（6 file）。verify の 2 行目と 3 行目は rc 0（歯 cwsrv_board_matches_list・cwsrv_unknown_without_place・cwsrv_unreceived_lists_findings_and_requests・cwsrv_next_request_counts_same_minute・cwsrv_request_appends_one_line・cwsrv_request_refusals の 6 本）。根の段は xtask と同じ引数で、行 cs-plugin を載せた木 6b9bb51f で撃って rc 0（build --workspace・clippy --workspace --all-targets・面の wasm の clippy・境界の群 teeth1〜teeth5 と cwsrv の 627 本・中核の群 teeth1〜teeth3 と cwplg の 357 本）。xtask の check そのものは撃っていない（席が温かい木で撃つ）。句ごとの噛みは 18 で、どれも名指しの歯が rc 100 で落ち、対照は rc 0（変異と歯の表は係の bites.tsv）。

      範囲の外。board の面の部品（行 cs-bar と cs-pop）。席の hook の拾い（行 cs-hooks）。相談の窓の作業場の変化を板の印（SSE）に載せること（面は窓を開いた時と台帳の変化の知らせで読み直す）。頼みの 1800 秒の「席に届いていない」の判じ（電文は頼みの時刻を持ち、面が今の時刻と比べる・行 cs-bar）。
  - n: 19
    type: prose
    title: 行 cs-plugin — skill /tsuzuri:consult と tz の解き方 bin/tzw
    body: |
      在りか。差の file docs/design/patch/cs-plugin.patch は、行 cs-server の試作の木 66c00c57 と、その上に試作を載せた木 6b9bb51f（写し drafts/w117a の branch p-plg）との差（37,204 byte・10 file・新しい file 3〔bin/tzw は mode 100755〕・+479 −34）。書く file は行 cs-server と重ならないので、main 882e0298 にも単独で当たる。

      なぜ。判断の記録 ADR-29 決定 (2)(4)(11)。持ち主の入口は skill（/tsuzuri:consult）と board の button で、skill が無いと持ち主はチャットから窓を開けない。今の hooks.json は tz を project の dir の target/debug/tz で撃つので、ほかの project の席では動かない（検証の記録 P の (9)）。着地した cs-open の open は環境の TZ_PLUGIN_VERSION が中核の PLUGIN_VERSION（0.2.0）と同じでなければ断り、席への 1 行の命令の頭は環境の TZ_WRAPPER の字を使うが、どちらも置く者がまだ無い。

      形。 - plugin/bin/tzw（新しい file・sh・mode 100755）: plugin の根はこの file の dir の親。tz は (1) 根の親の target/debug/tz が撃てる file ならそれ、(2) 無ければ PATH の tz。頭の引数が hook の時は、環境の CLAUDE_PROJECT_DIR（無ければ cwd）の repo の git config に scribe2.statedir が無ければ 0 で終わり、tz が解けなければ標準エラーに 1 行を出して 0 で終わる（配達と門を止めない）。ほかの口は tz が解けなければ字 tzw と半角のコロンで始まる 1 行を出して 1。撃つ時は TZ_PLUGIN_VERSION（plugin.json の version の字を sed で読む）と TZ_WRAPPER（自分の絶対 path）を export して tz に exec する。 - plugin/hooks/hooks.json: 5 つの command の、二重引用符で囲んだ $CLAUDE_PROJECT_DIR に /target/debug/tz を続けた語を、二重引用符で囲んだ $CLAUDE_PLUGIN_ROOT に /bin/tzw を続けた語に替える（ほかの字・timeout・matcher・runner の印の判じ・--repo の値は替えない）。 - plugin/.claude-plugin/plugin.json: version を 0.2.0 に、description の末に skill と tzw の 1 文を足す（鍵は 3 つのまま・絶対の path を書かない）。 - plugin/skills/consult/SKILL.md（新しい file）: 頭の --- の間に name consult・description・argument-hint、本文は決まり（tzw だけで撃つ・引数を省いた時の既定・起こし手の書き方・規則の行 R-38・会話と所見は承認にならない・! で打つ命令は囲いの外で走る・落ちたら止まる）と、open・launch・watch・show と dispose・list と close の 5 つの手順。 - 着地した歯の 5 本（群の module の file だけ・群の main.rs と module の名は替えない）: fstop（語の定数の頭の語と字 $CLAUDE_PROJECT_DIR の数 2 を 1 に）・fdlt と fdlv と qsig（定数 COMMAND の語の替え・sh の撃ちの PATH を /usr/bin と /bin に・偽の tz を plugin の形の dir の親の target/debug/tz に置き・印の無い plugin の dir に bin/tzw と plugin.json を写し・project の dir に git init と scribe2.statedir を置く助けの関数 plugin_dir と declared を足す）・gins（同じ直しと、tz の無い場を checkout に build の無い plugin の形の dir にし、rc を 0 と見る形に替える・前は sh の 127 を止めない誤りと見た）。

      SKILL_WORDS（歯 cwplg_skill_shape が本文に字のまま見る 9 句）: tzw consult open・tzw consult launch・tzw consult watch・tzw consult show・tzw consult dispose・run_in_background・R-38・承認にならない・! で打つ命令は囲いの外で走る（句の区切りの・は句に含めない）。

      問いの門の hook の 10 語（歯 gins_pretool_bash_entry が二重引用符を除いて比べる）: [ と -e と $CLAUDE_PLUGIN_ROOT/scribe2-runner と ] と || と $CLAUDE_PLUGIN_ROOT/bin/tzw と hook と question-gate と --repo と $CLAUDE_PROJECT_DIR。

      公式の形の照らし（2026-10-04 に Claude Code の公式の文書を取って読んだ・plugins-reference と plugins の components と skills と hooks）。plugin.json の必須の鍵は name だけで、version は semver と照らさない字。plugin の bin の file は、plugin が有効な間 Bash の道具の殻の PATH に載り、利用者の PATH の後に並ぶ（git などを隠せない）。hook の命令の PATH に載るとは書かれていないので、hook は環境の CLAUDE_PLUGIN_ROOT から撃つ。hook の command は sh -c で撃たれ、CLAUDE_PROJECT_DIR と CLAUDE_PLUGIN_ROOT は環境にも置かれる（Bash の道具の殻には置かれない）ので、tzw は自分の path から plugin の根を求める。plugin の skill の命令の名は plugin の名と skill の name を半角のコロンでつないだ字で、本文の $ARGUMENTS は渡された引数に替わる。skill の頭の disable-model-invocation を真にすると model は撃てない（stage-setup はそれを持つ・consult は席も撃つので持たない）。

      罠。歯の file の 5 本は rustfmt の形でないので、rustfmt を掛けない（足した助けの関数だけを rustfmt の形で手で書いた）。sh の撃ちの PATH を絞らないと、PATH に tz の在る host で tzw が本物の tz を撃つ。偽の plugin の dir の tzw は写しで、歯は workspace の根の plugin/bin/tzw を読むので、tzw を直すと歯の撃ちにそのまま効く。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜6 番目の項は verify の 3 行目（歯 cwplg_ の 6 本）、7 番目は 4 行目（fstop_）、8 番目は 5 行目と 6 行目（fdlt_ と fdlv_）、9 番目は 7 行目（gins_）、10 番目は 8 行目（qsig_）、最後の 11 番目は 9 行目（xtask の check）で測る。verify の 1 行目と 2 行目は命令の rc で測る守りで、done の項にしない。

      構造の連鎖（木 6b9bb51f で grep）。plugin/hooks/hooks.json を読む歯は fstop・fdlt・fdlv・gins・qsig の 5 本だけ。plugin/.claude-plugin/plugin.json を読む歯は fstop と cwplg。字 TZ_PLUGIN_VERSION を読む code は中核の consult::launch の VERSION_ENV（open と launch が照らす）、字 TZ_WRAPPER は境界の consult の WRAPPER_ENV（席への 1 行の頭）。plugin/ の下に runner の印の名の file は無い（歯 gins_repo_plugin_has_no_runner_mark）。

      入口の赤。木 66c00c57 に歯の file の 6 本（cwplg.rs と、直した着地した歯の 5 本）だけを置いた木 91b957fc（写しの branch r-plg）で、verify の 3 行目は rc 100（6 本とも落ちる）、4〜6 行目の群 teeth1 は rc 100（4 本が落ちる）、7 行目は rc 100（2 本）、8 行目は rc 100（2 本）。

      試作と噛み。写し drafts/w117a で書く file は write-set の中で閉じる（10 file）。verify の 2〜8 行目は rc 0（歯 cwplg_version_is_plugin_version・cwplg_tzw_resolves_checkout_then_path・cwplg_tzw_without_tz・cwplg_hook_needs_declaration・cwplg_skill_shape・cwplg_tzw_is_executable_sh と、着地した歯のうち直した file の群の fstop_ 2 本・fdlt_ 6 本・fdlv_ 6 本・gins_ 3 本・qsig_ 8 本で、done が名指す着地した歯は fstop_plugin_stop_entry・fdlt_hooks_batch_entry・fdlt_command_under_sh・fdlv_hooks_prompt_entry・fdlv_command_under_sh・gins_pretool_bash_entry・gins_command_under_sh・qsig_hooks_post_entry・qsig_command_under_sh の 9 本）。根の段は xtask と同じ引数でこの木で撃って rc 0（行 cs-server の節の数）。句ごとの噛みは 26 で、どれも名指しの歯が rc 100 で落ち、対照は rc 0（変異と歯の表は係の bites.tsv）。mode の実行の bit を落とす変異は撃っていない（字の変異だけを撃つ道具）。

      着地の後の席の手（行の外）。(1) 席の hook が撃つ target/debug/tz と席の pin の tz を組み直す（memo t3-hub.78 の候補 (2)）。(2) repo の git config に tsuzuri.draftsdir を置く。(3) /tsuzuri:consult を席で撃ち、話す窓と問う窓の 1 つずつで囲いの効き（ADR-29 の席の手の確かめ）を見て、memo t3-hub.78 に記帳する。(4) ほかの project で使い始める時期は project ごとに持ち主が決める（ADR-29 決定 (2)）。

      範囲の外。plugin の配り（marketplace）。tzw の release の build の引き。ほかの project の host の宣言に plugin の行を足すこと（器の席の推し・持ち主の時期）。
  - n: 20
    type: prose
    title: 行 cs-hooks — 見張りが居ない間の席の hook の拾い
    body: |
      在りか。差の file docs/design/patch/cs-hooks.patch は、係 w113a の 4 本（c-sum-two・c-short-cap・e-hold-mark・c-short-gate）と係 w117a の 2 本（cs-server・cs-plugin）を main 7a6fe66b に順に当てた土台の木 76df738d と、その上に試作を載せた木 a7c0715c（写し drafts/w119a の branch p-hok）との差（48,348 byte・11 file・新しい file 3・+749 −49）。書く file は土台の 6 本と重ならないので、main 7a6fe66b に単独でも当たる。

      なぜ。判断の記録 ADR-29 決定 (8)。席は見張り（tz consult watch）を背景に常に 1 本置くが、起こし直しの後や置き忘れの間は所見と頼みが席に届かない。決定 (8) は、停止の hook が印の無い時に見張りを置くよう席を続けさせ（turn の終わりごとに 1 度）、入力の時の hook が見張りを置くよう 1 行足し、見張りが無い間は 3 つの hook が board の未受けの口の安い判じを先に撃ち、受けの無い所見と頼みを裁定と別の字で足す、と決めた。

      形。 - 中核 consult/pickup.rs（新しい file・純な関数）: missing（見張りの 1 行）・items（受けの無い所見と頼みの固定の 1 行・中核の lines::notice の字で、所見は経路の語 hook）・nudge（items が空か読めなければ missing の 1 行だけ）・block_with（停止の答えの reason の後ろに足す）・context_with（入力の時と道具の周の答えの additionalContext の後ろに足す）。足す行が空なら答えの字をそのまま返すので、見張りの居る間と鍵の無い repo では 3 つの hook の出力は前と同じ字。consult/mod.rs に行 pub mod pickup と頭の注。 - 境界 hook/consult.rs（新しい file）: PICK_BUDGET（3 秒）・unwatched（git config の鍵 tsuzuri.draftsdir の値が dir で、見張りの生きている印 watch::fresh が偽の時だけ置き場を返す）・pick（unwatched の後に port の鍵 tsuzuri.boardport と tailnet の status を読み、裁定の未受けの口と同じ住所の列に口 GET /api/consult/unreceived を撃つ・どの待ちも PICK_BUDGET の残りで切る・port が読めず口が撃てなければ Unknown）・nudge と items（tzw の字は着地した consult の tzw）。hook/mod.rs に行 pub mod consult と頭の注。 - stop.rs: 未配達の裁定の答え block の後ろに consult::nudge の行を block_with で足す。台帳が読めない時は前と同じ 1 行を標準エラーに書き、裁定の無い答えとして続ける（足す行が無ければ前と同じく何も出さない）。印は未配達の裁定にだけ置く。 - deliver.rs: 裁定の逐語の答えを関数 rulings に割り、consult::nudge の行を context_with で足す（指し示しの無い prompt でも拾う）。 - deliver_tool.rs: 安い判じと台帳の読みを関数 rulings に割り、consult::items の行だけを context_with で足す（見張りを置かせる 1 行は道具の周ごとに足さない）。fetch に path を受ける fetch_path を足し、fetch はそれを撃つ（字は前と同じ）。

      足す字（歯が比べる字・tzw は環境の TZ_WRAPPER の字 /x/tzw）。所見の行は 相談: 窓 cw1 の所見 cw1-1 が届いた（/x/tzw consult show cw1-1 --via hook）・「/x/tzw consult watch」を背景で置き直す。頼みの行は 相談: 頼み rq-20261003T1412Z-1 が届いた（/x/tzw consult open --request rq-20261003T1412Z-1 --by button）・「/x/tzw consult watch」を背景で置き直す。見張りの 1 行は 相談: 見張りが居ない（「/x/tzw consult watch」を背景で置く）。停止の答えの形は囲みを省くと {decision:block,reason:<行を改行でつないだ字>}、文脈の答えは {hookSpecificOutput:{hookEventName:<UserPromptSubmit か PostToolBatch>,additionalContext:<行>}}（戻し方は、鍵と字の値を二重引用符で囲む）。

      罠。停止の hook の timeout は 30 秒で、台帳の読み 5 秒と印の上限 20 秒の残りは 5 秒しかない。拾いは鍵の読み・port の鍵・tailnet の status・口の撃ちの全部を PICK_BUDGET の残りで切る（道具ごとの WAIT を足すと 30 秒を越える）。着地した歯 fstop と fdlv（境界の群 teeth2）は本物の git を撃っていたので、器の便の worktree（repo の git config を共有する）で席が鍵 tsuzuri.draftsdir を置くと、見張りの居ない間だけ答えが替わる。両方の作業場に偽の git（rc 1・鍵の無い repo）を置いて閉じた。fdlt の偽の git は鍵の読みに port の字を返すので dir でなく、静かな形の git の回だけが 1 から 2 に替わる。歯の file の 3 本は rustfmt の形でないので rustfmt を掛けない。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜7 番目の項は verify の 3 行目（歯 cwhok_ の 7 本）、8 番目は 4 行目と 5 行目（fstop_ と fdlv_）、9 番目は 6 行目（fdlt_）、最後の 10 番目は 7 行目（xtask の check）で測る。verify の 1 行目と 2 行目は命令の rc で測る守りで、done の項にしない。

      構造の連鎖（木 a7c0715c で grep）。block_with の呼び手は stop.rs の 1 か所、context_with は deliver.rs と deliver_tool.rs の 2 か所、consult::nudge は stop.rs と deliver.rs、consult::items は deliver_tool.rs だけ。fetch_path の呼び手は fetch と hook/consult.rs の pick の 2 か所。watch::fresh の呼び手は着地した watch と hook/consult.rs。書く file の最大は deliver_tool.rs の 231 行（上限 1500）。

      入口の赤。土台の木 76df738d に、歯の file の 4 本（cwhok.rs と直した fstop・fdlv・fdlt）と、中核 pickup.rs と境界 hook/consult.rs の関数の頭だけ（足す行は空・pick は None）と mod の行を置いた木 1a5fa921（写しの branch r-hok）で、verify の 3 行目は rc 100（7 本とも落ちる）、6 行目は rc 100（fdlt_run_quiet_paths が落ちる）。

      試作と噛み。写し drafts/w119a で書く file は write-set の中で閉じる（11 file）。verify の 2〜6 行目は rc 0（歯 cwhok_stop_appends_after_rulings・cwhok_stop_nudges_when_nothing_waits・cwhok_quiet_with_watch_or_without_key・cwhok_prompt_adds_context・cwhok_tool_adds_only_waiting・cwhok_merge_keeps_ruling_answer・cwhok_pick_within_budget の 7 本と、境界の群 teeth2 の 130 本・done が名指す着地した歯は fstop_blocks_then_marks・fdlv_quiet_without_pointer・fdlt_run_quiet_paths の 3 本）。根の段は xtask と同じ引数で、3 行を載せた先端 8d4b2b4e で撃って rc 0（build --workspace・clippy --workspace --all-targets・面の wasm の clippy・境界と中核と面の関わる歯）。xtask の check そのものは撃っていない（席が温かい木で撃つ）。句ごとの噛みは 22 で、どれも名指しの歯が rc 100 で落ち、対照は rc 0（変異と歯の表は係の bites.tsv）。

      範囲の外。見張りそのもの（着地した cs-watch）。口 GET /api/consult/unreceived（cs-server）。hook の命令の解き方（cs-plugin）。席の窓でない session（係）の停止の hook が見張りを置けと言われるかは、裁定の停止の hook と同じ形のまま（hook の入力に agent の鍵が無い限り区別しない・着地の後に席が見る）。
  - n: 21
    type: prose
    title: 行 cs-bar — 帯の相談の口と相談の窓
    body: |
      在りか。差の file docs/design/patch/cs-bar.patch は、行 cs-hooks の試作の木 a7c0715c と、その上に試作を載せた木 0e05f482（写し drafts/w119a の branch p-bar4）との差（35,012 byte・13 file・新しい file 2・+541 −15）。style.css は行 c-short-cap も書くので、c-short-cap の後に当たる（depends）。

      なぜ。判断の記録 ADR-29 決定 (4)(9)・ADR-27 決定 (3)(4) の帯の項目と窓に相談を足す（ADR-29 決定 (1) の (ケ)）。持ち主の入口の 1 つは board の帯の相談の口で、題と形と model を書いて頼む。面は窓を開かず、頼みの行を置く口（cs-server の POST /api/consult/request）を撃つだけ。帯の相談の口は色の付く数を持たない（所見の処分は席の手番・決定 (9)）。

      形。 - consultwin.rs（新しい file）: CONSULT_KEY（consult）・DELIVER_SPAN（1800 秒・server の配達の撃ち直しの幅と同じ）・LATE（席に届いていない）・MODELS（fable・opus・sonnet・先頭が既定）・UNREAD（相談の一覧が読めない）・NONE_LINES（3 つの段の 0 件の 1 行）・Row・request（電文 ConsultRequest の字）・sent_line（応答の 1 行）・board（口の本文の読み）・windows・findings・requests（段の行）。wasm の枝の body は、上の段に題の入力（初めの字は窓を開いた link の id・質問の窓と同じ AskFocus）と形の 2 つの radio と model の select と 送る の button、下の段に 3 つの段（見出しは 開いている相談の窓・処分の無い所見・受けの無い頼み）。送ると口に POST し、応答の 1 行を出して口を全部読み直す。 - topbar.rs: Win に Consult を足し（ALL は 8・query の名 consult）、帯の時計の段の抜けの印の後に相談の button を 1 つ置く（数を持たない）。 - wins.rs: frame_of の Consult は 720 と CONSULT_KEY、draw の Consult は consultwin の body。 - lib.rs: 行 pub mod consultwin と注。 - vocab.json: 鍵 consult（語 相談・注釈・内部の名）。 - style.css: 帯の相談の口の class cslt と、窓の class cswin・csf・csfm・csr・cst・csn・csr.late（色は段の止まりの --s-stop）。 - 着地した歯の 2 本（群の module の file だけ）: bvhelp の const WINS を 8 つに（Win::Consult を末に足す・rustfmt の形でないので掛けない）、bvnav の窓の名の列に consult を足す。 - 受入の撃ち（境界の audit.rs）: 画面の列 SCREENS を 12 にし、?win=dest& の後に ?win=consult& を足す（頭の注の窓の数も 8 に）。着地した歯の 3 本（群の module の file だけ）: bvacc の窓の名の列に consult、jrun の窓の数を 8 と画面の数を 12 と撃つ URL の数を 104 に、bvsettle の報告の行の数と撃った URL の数の 96 を 104 に。

      節の字（歯が比べる字・囲みを省いた形）。帯の button は button type=button class=cslt aria-label=label(CONSULT_KEY) on:click=move |_| wins.open(Win::Consult, false) の中に label(CONSULT_KEY) を置く字（属性の値の button と cslt は二重引用符で囲む）。頼みの電文は {topic:t3-hub.78,form:ask,model:opus} と {topic:null,form:talk,model:fable}（戻し方は、鍵と字の値を二重引用符で囲み、null は囲まない・空白なし）。窓の段の状態の字は 問う・生きている・所見 2（処分なし 1）の形。応答の 1 行は 頼み rq-20261003T1412Z-1 を送った（席が受けて窓を開く）・頼みの応答が読めない・読むだけの board なので送れない・頼みの字が書けない（題の字を見直す）・頼みを置けなかった（状態 503・no-root）・board に届かない。

      罠。面の code に語の辞書の語を字のまま書くと着地した歯 frame_no_heading_words_in_code が落ちる（開いている窓 は語 open_windows なので、見出しを 開いている相談の窓 にした）。面の class は stylesheet に在ること（歯 frame_classes_are_in_stylesheet）。Win::ALL を 8 にすると、Win を全部の腕で match する関数（key・frame_of・draw）に腕が要る。受入の撃ち（行 g-accept）の歯は topbar の key の腕を字で読み、画面の列と窓の名の全部を照らすので、窓を足す行は SCREENS と撃つ URL の数の歯を同じ行で直す（係の試作の最初の根の段で bvacc と jrun と bvsettle が落ちて見つけた）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜7 番目の項は verify の 3 行目（歯 cwbar_ の 7 本）、8 番目は 4 行目と 5 行目（bvhelp_ と bvnav_）、9 番目は 6〜8 行目（bvacc_・bvsettle_・jrun_）、最後の 10 番目は 9 行目（xtask の check）で測る。verify の 1 行目と 2 行目は命令の rc で測る守りで、done の項にしない。

      構造の連鎖（木 0e05f482 で grep）。Win を全部の腕で match するのは topbar の key と wins の frame_of と draw の 3 か所。Win::ALL を回す歯は bvnav・bvopen・cwbar（bvopen は数を断言しないので書き替えない）。窓の名の列を字で持つ着地した歯は bvhelp の WINS と bvnav の名の列の 2 つ。consultwin の body の呼び手は wins の draw だけ。SCREENS を読むのは audit の sweep と歯 bvacc・jrun。code の書く file の最大は audit.rs の 721 行（上限 1500）。vocab.json は前から 1500 行を越える 1,812 行（席が置く直前に受付の点検で見る）。

      入口の赤。木 a7c0715c に、歯の file の 6 本（cwbar.rs と直した bvhelp・bvnav・bvacc・bvsettle・jrun）と、consultwin.rs の関数と定数の頭だけ（空の字と None）と Win::Consult の腕（名は空・幅 0）を置いた木 b02177d2（写しの branch r-bar4）で、verify の 3 行目は rc 100（7 本とも落ちる）、4・5・6・7 行目は rc 100（bvhelp_win_titles_keyed・bvnav_win_query_round_trip・bvacc_screens_open_windows・bvsettle_sweep_counts_unknown）、8 行目は rc 100（jrun_screens_cover_surface と jrun_sweep_all_cases）。

      試作と噛み。写し drafts/w119a で書く file は write-set の中で閉じる（13 file）。verify の 2〜8 行目は rc 0（歯 cwbar_window_named_consult・cwbar_band_button_without_count・cwbar_request_body・cwbar_requests_late_after_span・cwbar_lists_and_unread・cwbar_sent_lines・cwbar_dom_wiring_text の 7 本と、面の歯の全部の 859 本と境界の群 teeth1〜teeth5 の全部）。面の wasm の clippy も rc 0。句ごとの噛みは 25 で、どれも名指しの歯が rc 100 で落ち、対照は rc 0（係の bites.tsv）。

      範囲の外。吹き出しの相談の口（行 cs-pop）。窓の作業場の変化を板の印（SSE）に載せること。相談の窓の中での所見の処分（席の手番・tz consult dispose）。
  - n: 22
    type: prose
    title: 行 cs-pop — 吹き出しの相談の口
    body: |
      在りか。差の file docs/design/patch/cs-pop.patch は、行 cs-bar の試作の木 0e05f482 と、その上に試作を載せた木 8d4b2b4e（写し drafts/w119a の branch p-pop4）との差（8,761 byte・4 file・新しい file 1・+91 −1）。consultwin.rs と vocab.json は行 cs-bar も書くので cs-bar の後（depends）。board の残りの行（g-sum-pick 以降の 11 行）の係は、この行の先端から差を切った。

      なぜ。判断の記録 ADR-29 決定 (4) の (イ)・ADR-27 決定 (7) の吹き出しの口に相談の口を足す（ADR-29 決定 (1) の (ケ)）。持ち主は札と行の吹き出しから、その bead を題にした相談を頼める。

      形。 - consultwin.rs: POP_KEY（pop_consult）と consult_href（win_href の Consult の後ろに query の id を足す・id は mapview の encode で包む・質問の窓の answer_href と同じ形）。 - widgets/pop.rs: 層の pop_view の末の段（class foot）の個別の頁への口の後に、相談の口の a を 1 つ足す（hover の card を付けない）。どの段の吹き出しも同じ pop_view を通るので、全部の段に 1 つずつ出る。押すと、着地した頁の層の open_link が窓を開く link の id を AskFocus に置いて相談の窓を開き、行 cs-bar の窓が題の初めの字にする（頁は読み直さない・吹き出しは窓が開くと閉じる）。 - vocab.json: 鍵 pop_consult（語 相談する・注釈・内部の名）。

      節の字（歯が比べる字）。口の先は ?mode=<mode の名>&win=consult&id=<encode した id>（例 ?mode=beginner&win=consult&id=t3-hub.78）。末の段の口は a class=link href=consult_href(&p.id, mode) の中に format!( と {} › と label(POP_KEY) を置く字（書式の字は二重引用符で囲む・差の file が字の正本）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜3 番目の項は verify の 3 行目（歯 cwpop_ の 3 本）、最後の 4 番目は 4 行目（xtask の check）で測る。verify の 1 行目と 2 行目は命令の rc で測る守りで、done の項にしない。

      構造の連鎖（木 8d4b2b4e で grep）。consult_href の呼び手は pop.rs の pop_view の 1 か所。窓を開く link の押しを受けるのは board.rs の open_link（着地した字のまま・書かない）。着地した歯 bvpop は末の段の口の数を断言しないので書き替えない（面の歯の全部の 859 本が通る）。

      入口の赤。木 0e05f482 に、歯の file cwpop.rs と、consultwin.rs の POP_KEY（空の字）と consult_href（空の字）の頭だけを置いた木 766cb3f9（写しの branch r-pop4）で、verify の 3 行目は rc 100（3 本とも落ちる）。

      試作と噛み。写し drafts/w119a で書く file は write-set の中で閉じる（4 file）。verify の 2 行目と 3 行目は rc 0（歯 cwpop_href_opens_consult_with_id・cwpop_foot_link_once_without_hover・cwpop_word_key の 3 本）。面の wasm の clippy も rc 0。根の段は行 cs-hooks の節の数。句ごとの噛みは 7 で、どれも名指しの歯が rc 100 で落ち、対照は rc 0（係の bites.tsv）。

      範囲の外。吹き出しの段ごとの欄（board の残りの行 g-pop-sum が書く）。相談の窓の中身（行 cs-bar）。
  - n: 23
    type: prose
    title: 行 g-sum-pick — 表示の型で概要を 1 つ選ぶ部品と個別の頁の概要の箱
    body: |
      在りか。差の file docs/design/patch/g-sum-pick.patch は、係 w113a の 4 行（c-sum-two・c-short-cap・e-hold-mark・c-short-gate）と係 w117a の 2 行（cs-server・cs-plugin）と係 w119a の 3 行（cs-hooks・cs-bar・cs-pop）を main 9abf0779 に順に当てた土台の木 85b0f4a2（行 cs-pop の試作の先端）と、その上に試作を載せた木 12a7964c（写し drafts/w122a の branch p-pick）との差（32,980 byte・11 file・新しい file 2・+364 −73）。style.css は行 c-short-cap と cs-bar も、vocab.json は行 cs-bar と cs-pop も書くので、その後に当たる（depends）。

      なぜ。判断の記録 ADR-30 決定 (2)（概要を出す全部の面は、初心者の表示の型では非エンジニア向けだけを、経験者ではエンジニア向けだけを出し、表示の型の側が無い時はもう一方をどちら向けかの印つきで、両方無い時は本文の頭の 1 行を 本文から の印つきで出す・もう一方の概要は個別の頁にだけ概要の下に畳んで置く）と決定 (3)（吹き出しの概要は規則の行 R-19 の 200 字を越える時に頭の字と … で畳む）。面の 4 つ（個別の頁・質問の窓の card・hover の card・吹き出し）が同じ関数で選ぶので、部品を先に 1 つ置き、個別の頁の概要の箱をこの行で 1 つにする。質問の窓の card・hover の card・吹き出しは後の行（g-ask-mode・g-card-mode・g-pop-sum）がこの部品を呼ぶ。

      形。 - src/widgets/sumpick.rs（新しい file・純な関数だけ・host でも組む）: 定数 POP_SUM_MAX（200）・ELLIPSIS（…）・PLAIN_KEY（summary_plain）・ENG_KEY（summary_eng）・BODY_KEY（sum_body）。型 Picked（key・text・marked）と Folded（head・rest と、畳んだ形の字 shut と開いた形の字 whole）。関数 pick（表示の型と plain と eng と本文の頭の 1 行から 1 つ・空か空白だけの字は無いと見る・字は切らない）・other（表示の型の側が在る時だけもう一方を印つきで）・fold（max 字以下は畳まず、越えれば頭の max − 1 字と残り・字数は Unicode のスカラー値）。 - src/widgets/mod.rs: doc の 1 行と pub mod sumpick。 - src/project/node.rs: block の見出しの鍵を summary_plain から nb_summary に。定数 SUMMARY_KEYS を消し、SUMMARY_MARKED（sumbox marked）と SUMBOX_OTHER（fold sumother）を足す。FOLDS を node:other の 1 つに。型 SumBox に欄 other を足し、関数 summary を表示の型を受けて 1 つの箱を返す形に替える（pick の字を切らずに・印つきなら class sumbox marked・どれも無ければ表示の型の側の見出しの鍵で要約なしと class sumbox none）。DOM は 2 つの箱の並び div class two を、1 つの箱と、その下のもう一方の概要の details（開き閉じの記録 fold の鍵 node:other・初めは閉じ・押すと開く）を入れる div class nsum に替え、箱の印は見出しの鍵で選ぶ（非エンジニア向けは人・エンジニア向けは code・本文からは file の印）。本文の頭の 1 行は個別の頁ではまだ渡さない（引きの口を読む行 g-node-body の後の行 g-node-excerpt で足す・この行では両方無い時は要約なし）。 - vocab.json: 鍵 nb_summary（語 概要）と sum_body（語 本文から）。 - style.css: 規則 .two を .nsum（1 列）に替え、狭い幅の規則と min-width の規則の .two を外すか .nsum に替え、.sumbox.marked（破線の枠）と details.sumother の 3 つの規則を足す。 - 着地した歯の書き替え（群の module の file だけ・群の main.rs と module の名は替えない）: teeth4/nodepage.rs（頁の枠の見出しの鍵・要約の無い箱を 2 つの表示の型で・語の鍵の一覧に 2 つ・rustfmt の形でない file なので手で字を合わせた）・teeth3/gsum.rs（箱の歯を 1 つの箱と表示の型の形に・DOM の字の歯の details を禁じる断言を、details はもう一方の概要の畳みだけの断言に）・teeth3/hsderive.rs（node の FOLDS の着地の値）・teeth2/frame.rs（使う class の集めを 2 つの表示の型の箱と 2 つの定数の class に・rustfmt の形でない file）・tests/snapshots/pages/node.json（見出しの鍵の 1 字の替え）。

      節の字（歯が比べる字）。語の鍵 nb_summary の語は 概要、sum_body の語は 本文から。箱の class は sumbox・sumbox marked・sumbox none、畳みの class は fold sumother、畳みの鍵は node:other。node.rs の DOM の部分は字 summary(c, mode()) と、details の tag の字 details class=SUMBOX_OTHER prop:open=open on:toggle=toggle を持つ（tag の頭の山括弧は差の file が字の正本）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜4 番目の項は verify の 3 行目（歯 mpick_mode_picks_one・mpick_fallback_marks・mpick_fold_lossless・mpick_node_one_box の 4 本）、5 番目の項は 4 行目（歯 nodepage_frame_and_nav・nodepage_summary）と 7 行目（歯 hspage_snaps_match_files）、6 番目の項は 5 行目（歯 gsum_node_boxes・gsum_dom_text）と 6 行目（歯 hsderive_consts_match_note）と 8 行目（歯 frame_classes_are_in_stylesheet）、最後の 7 番目は 9 行目（xtask の check）で測る。verify の 1 行目と 2 行目は命令の rc で測る守りで、done の項にしない。

      構造の連鎖（木 12a7964c で grep）。node::summary の呼び手は node.rs の DOM の 1 か所と、着地した歯 nodepage・gsum・frame（どれも書き替えた）。定数 SUMMARY_KEYS の読み手は無かった。node の FOLDS は kit の fold_keys が Module の ALL の順につなぐ（着地した歯 steady_details_use_fold_record が node.rs の details の数と fold の鍵の数と FOLDS の数の一致を見る・書き替えずに通る）。class two の読み手は node.rs と style.css だけ（着地した歯 bvlex_classes_named_in_src が stylesheet の class の全部を src に求めるので、style.css からも外した）。質問の窓の card は語の鍵 summary_plain と summary_eng を ask.rs で使い続ける（行 g-ask-mode で sumpick に替える）。

      入口の赤。木 85b0f4a2 に、歯の file mpick.rs と、sumpick.rs の型と関数の頭（中身は None か空・定数は 0 か空白）と、node.rs の新しい summary の頭（中身は空の箱）を置いた木 5384245a（写しの branch r-pick）で、verify の 3 行目は rc 100（4 本とも落ちる）。

      試作と噛み。写し drafts/w122a で書く file は write-set の中で閉じる（11 file）。verify の 2〜8 行目は rc 0。面の wasm の clippy（cargo clippy -p tsuzuri-surface --target wasm32-unknown-unknown -- -D warnings）も rc 0、面の歯の全部の 863 本が通る。句ごとの噛みは 26 で、どれも名指しの歯が rc 100 で落ち、対照（mpick と群 teeth2〜teeth5）は rc 0（係の bites.tsv）。根の xtask の check は席が温かい木で撃つ。

