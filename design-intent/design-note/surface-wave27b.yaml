  - n: 34
    type: prose
    title: 行 v-brief-meter — 器の SessionStart の出力ごとの記録と役割の行の上限の検出（器の側の最後の形の後半・上限は要の写しの隣の導出物）
    body: |
      在りか。差の file docs/design/patch/v-brief-meter.patch は、行 t-seatcap の試作の木 eb52a438（main 4e6e5f3d の上・写し drafts/w138a の branch p-seatcap）と、その上に試作を載せた木 a1f8c2f9（branch p-meter）との差（36,251 byte・6 file・新しい file 1・+413 −16）。差の触れる 6 file は行 t-seatcap の差が触れないので、差は main 4e6e5f3d にも、main にノート surface-wave28a の器の 3 本の差（v-hold-why・v-hold-case・v-refuse-why）を当てた木にもそのまま当たる（係の apply.tsv）。作り直しの起点は、前の版の差（係 w128a・76,517 byte・13 file）を木 eb52a438 に当てた木 da034dda（branch m-old）。

      なぜ。判断の記録 ADR-38 の決定 (4) と撤退の条件 (5)。規則の行 R-1（席の手元の生成区間の総 byte・8,000 byte 以下）の内訳の R-41（役割の行・2,000 byte 以下）は、役割の行の穴 6 つのうち target・anchor・起草の置き場の 3 つに型の長さの上限が無いので、見本の穴で埋めて測る歯では保てない。測る者は器で、出力ごとに役割の行の byte を記録に書き、R-41 の値を越えたら名指す（決定 (4)）。撤退の条件 (5) は器の SessionStart の 1 本の出力の字の数を記録で見る（Claude Code は hook の出力を 1 本 10,000 字で切る・9,000 字を越えた周が 1 件でも在れば割る行を問う）。

      版を上げた理由。1 度目の便（t3-hub.74.59.10）は審査の constitution:1（条 P-2.3・P-2.4）で落ちた。前の版は R-41 の値を器の rules の行 seat.role_max_bytes に写して 2 か所に人が書き、照らしの歯で揃える形だった。この版は器の rules の行を作らず、行 t-seatcap が tz derive で導く上限の file を読む（下の値 2,000 の読み方）。前の版の差から、規則の行の 6 file（rules/mod.rs・scribe2/rules/manifest.toml・e2e の rules.rs と rules/embedded.rs と外形の snapshot・e2e の hook.rs）を外し、doctor の語 root（account/consumers.rs と境界の main.rs の見本の 1 行）を行 v-doctor-root へ移した。

      形。 - seat/brief/meter.rs（新しい file）: 鍵を名乗った席の記録の組み brief_entries（写しの記録・役割の行の記録・越えか読めないの記録の順と stderr の行・鍵の無い席は None）と、上限の読み cap_of（anchor と宣言の読み SeatConstitution を受け、宣言が名乗る写しの path と同じ dir の定数 CAP_FILE〔role-max-bytes.txt〕の file を読む。返りは型 Cap〔欄 path は上限の file の repo 相対の path・宣言を読めない周は字 -、欄 value は 2 行目の数か None〕）と、file の字の数の読み value_of（ちょうど 2 行で 2 行目が 10 進の数字だけの周だけ数・頭の行は読まない）と、1 回の出力の記録 total と、byte の数え printed（行ごとに改行 1 byte を足す）と、越えと読めないの記録の読み手 doctor_line（記録の置き場の inject.jsonl を読む・file が無い周は出さない・読めない周は字 seat-role=unreadable）と記録の字から 1 行を組む doctor_word。越えと読めないの記録の what の頭は定数 WHAT_OVER（seat-role-over）と WHAT_UNMEASURED（seat-role-unmeasured）。読めないの stderr の次の 1 手は copy.rs の定数 NEXT_STEP（tz derive --write）。 - seat/brief/copy.rs: 写しの行（読めない周は断りの 1 行）と役割の行の組を返す parts を足し、lines を parts から組む形にした（出す行の字と並びは替えない）。 - seat/brief/mod.rs: mod meter の 1 行と頭の注の 2 行。 - hook/mod.rs: brief が宣言の読み（seat_constitution）を 1 度だけ撃って局所の declared に置き、写しの読み（Copy::read）と上限の読み（cap_of）が同じ declared を読む。brief が真偽を返し（鍵を名乗った席の周だけ真）、真の周は brief_entries の記録を 1 件ずつ書いて stderr の行を足し（偽の周は今の 1 件のまま）、session_start が群の行の後に total の記録を 1 件書く。記録の組み手 measured（数えた bytes を持つ記録・ほかの欄は silent と同じ）を足した。 - 境界の src/main.rs: doctor の state dir の周の行の末（起草の置き場の上限の行の後）に doctor_line の 1 行。 - e2e の hook/session.rs: 着地済みの歯 vbconst_hook_brief_prints_the_copy_in_place_of_the_five_lines の置き場に上限の file を 1 つ書く 1 行を足した（鍵を名乗った席の e2e の歯の関数 after_header は stderr 0 byte を見るので、上限の file が無いと読めないの stderr で落ちる・前の版は e2e の hook.rs の rules の見本に上限の行を足してこれを避けていた）。上限の file の字は定数 ROLE_MAX_FILE（tz derive が導く形の 2 行・2 行目 2000）で、歯 vbmeter_hook_session_start_records_each_output_and_names_the_over と共有する。

      記録の字（schema は上げない・数は what の字に載せる）。鍵を名乗った席の記録は名乗りの後に、写しの記録（what は session-start-constitution・読めない周は session-start-constitution-refused・bytes は写しの行の byte）、役割の行の記録（what は session-start-brief のまま・bytes は役割の 7 行の byte＝R-41 が数える量）、越えた周の記録（what は seat-role-over bytes=<n> cap=<m>・bytes 0）か読めない周の記録（what は seat-role-unmeasured path=<上限の file の path>・bytes 0）、圧縮の枠と DATA の記録（今のまま）、群の行の後に 1 回の出力の記録（what は session-start-total chars=<字の数>・bytes は stdout の全部の byte・字は Unicode の字で行ごとの改行を含む）。stderr の行は、越えた周が scribe2 と半角のコロンと空白と 役割の行が上限を越えた bytes=<n> cap=<m> path=<上限の file の path>、読めない周が同じ頭と 役割の行の上限を読めない path=<上限の file の path> と、全角の括弧の中に 次の 1 手 と半角のコロンと空白と tz derive --write と・越えないに倒さない。どちらの周も出力は止めず字も替えない。doctor の行は seat-role=<語> で、名乗った記録が無い周は出さず、全部の席が上限の内なら seat-role=ok seats=<席の数>、越えか読めないの席が在れば seat-role=<over か unmeasured> seats=<n> over=<k> unmeasured=<j> last=<最後に記録された席> と、その記録の what の頭の後ろの字（bytes=<n> cap=<m> か path=<上限の file の path>）。席ごとに最新の名乗った周だけを読むので、役割の行を縮めた後の周は前の越えを消す。鍵の無い席の記録は今と同じ 1 件（指示文の bytes は 12 行の byte）で、inject.jsonl の行の数も替わらない。記録の 7 か所の組み手と InjectionRecord の欄は替えない（record_launch の what の末に trust の語を足す前例と同じ）。

      値 2,000 の読み方。値の正本は規則の行 R-41 で、行 t-seatcap が tz derive で R-41 の値を要の写しと同じ dir の導出物 contracts/seat/role-max-bytes.txt（頭の 1 行と 10 進の数の 1 行）に書き、--check で正本との差を落とす。器は宣言の鍵 seat-constitution が名乗る写しの path と同じ dir のこの名の file の 2 行目だけを読み（頭の行は読まない）、器の rules の行は作らず宣言の鍵は 1 本のまま。file を anchor の作業ツリーから読むのは要の写しの読み（行 v-brief-const の Copy::read）と同じ。器は上限の数を自分では持たないので、R-41 の値を替える設計の commit は tz derive --write の 1 手で器の次の SessionStart に効き、器の入れ替えを待たない。上限は tsuzuri の規則（R-1 と R-41）なので project ごとの値で、上限の file を置かない project で名乗った席は毎回読めないの記録と stderr の 1 行を出す（今は tsuzuri だけが名乗る）。器が tz の書く file の名と 2 行の形に縛られ、名の字 role-max-bytes.txt は tz と器の 2 か所に在る（要の写しの path の字と同じ界面の字で、値の数は 1 か所）。選ばなかった形は次の 5 つ（係 w137a の options.md）。器の行を正本にし R-41 が器の行を名指す形（R-29 と同じ形）は、tz derive の要の写しの上限（R-1 − R-41）が器の file を読む道を要し、器の行を先に置けば審査の木に 2 面が残り、R-41 を先に替えれば床が rc 2 になって置く順が組めない。R-1 を新しい要の写しの行と器の行の和にする形は、R-1 が独立の上限でなくなる（実質の緩め）。器は記録だけを書き越えを tsuzuri が判じる形は、ADR-38 の決定 (4)（測る者は器）を替える。宣言に 2 本目の鍵を足して上限の file の path を名乗る形は、宣言の読みと断りと口の歯で器の差が約 60〜100 行増え、決定 (5) の鍵 1 本を替える。要の写しの頭の行に上限を足す形は、席の手元に出る字と決定 (3) の頭の 1 行の形を替える。ADR-38 の決定 (4) の検出の event を、記録の行と doctor の行で満たす。fleet の event の kind は足さない（kind の足しは event log の形と数えの歯と replay を広く替え、読み手がまだ無い）。読み手の居ない記録は黙るのと同じなので、読み手は doctor の 1 行（seat-role）にし、board は doctor の出力を写す。stderr の 1 行はその周の席の見える所への合図。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

