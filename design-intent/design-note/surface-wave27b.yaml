    title: 行 g-node-body — 個別の頁の本文と記録の block
    body: |
      在りか。差の file docs/design/patch/g-node-body.patch は、行 g-md-view の試作の木 7d2b96e9（写し drafts/w123a の branch p-md）と、その上に試作を載せた木 d08ecf42（branch p-node）との差（24,827 byte・10 file・新しい file 2・+397 −8）。差は g-sum-pick の先端の木 12a7964c に g-pop-sum と g-md-view を当てた木にも当たる（g-ask-mode と g-card-mode に依らず、2 つの差はこの行の後にも当たる）。vocab.json と style.css は行 g-pop-sum の後に、頁の snapshot と frame.rs と nodepage.rs と hsderive.rs は行 g-sum-pick の後に当たる（depends の g-pop-sum が g-sum-pick の後）。

      なぜ。判断の記録 ADR-30 決定 (4)（個別の頁は上から 頭と概要・つながり・本文・記録・run の時間軸 の順の詳細の表示とし、本文と記録は表示の型によらず閉じて始め、1 本の引きの口から読み、本文の書式の部品で描く。設計の節点は本文と記録の段を出さない）。今の個別の頁は頭と概要・つながり・時間軸の 3 つの block で、本文と記録を出す block が無い。

      形。 - src/project/nodebody.rs（新しい file・block の module は build.rs が dir の file から列挙に入れる）: BLOCK（id body・見出しの鍵 nb_body・class panel）・PATHS（空）・FOLDS（node:body と node:notes）・PART_KEYS（nb_text と nb_notes）・PART_CLASS（fold nbody）・KINDS（Task・Epic・Memo・Question）・REASON（1 本の引きの口が読めない理由）・BLANK（書かれていない）。型 Texts（本文と記録の段の列）。関数 bead_of（中心の行の種類が KINDS で id が BeadId の形の時だけ）・item_path（ITEM_PATH と bead）・kept_bead（時間軸の kept_want と同じ形で、近傍を読めた時は中心の行から決め、読み直しの間は前を保ち、見つからなければ None）・texts（NotRead は NOT_READ・Failed は REASON・電文が読めなければ NO_CONTENT・行の id が違えば NOT_READ・読めれば本文と記録を md の parse に通した Texts）。DOM（wasm の枝）は関数 view で、近傍の読みの source から bead を Memo で保ち、1 本の引きの口を path の signal で読み、Filled は 2 つの details（鍵ごとに初めの値が偽の開き閉じの記録・summary は見出しの語 h2）の中に段を置き（空なら BLANK の 1 行・空でなければ台帳の字の印の div に md の view）、Unmeasured は block の section に測れていないの 1 行。 - src/pages/node.rs: doc の 2 行と、頁の block の列に nodebody の BLOCK を nodearound と timeline の間に足す（列を 1 行 1 項に折った）。 - vocab.json: 鍵 nb_body（本文と記録）・nb_text（本文）・nb_notes（記録）を sum_body の前に。 - style.css: 本文と記録の段と部品 md の段の 13 の規則（details.nbody 2・.md 2・見出し 5・箇条 2・字のままの段 1・等幅 1）を吹き出しの口の規則の前に。 - 着地した歯の書き替え（群の module の file だけ）: teeth2/frame.rs・teeth4/nodepage.rs・teeth4/ntime.rs（頁の block の並びに body・nodepage は block の 3 つ組の表にも 1 行）・teeth3/hsderive.rs（use と module の表 CONSTS と着地の値の表に nodebody の 1 行ずつ・rustfmt の形でない file なので手で字を合わせた）・tests/snapshots/pages/node.json（block の列に 1 行）。

      節の字（歯が比べる字）。DOM の開き閉じの記録の呼びは fold(node:body を字にした物.to_string(), || false); と notes の同じ形（鍵は二重引用符の字・差の file が字の正本）、details の tag は details class=PART_CLASS prop:open=open_text on:toggle=toggle_text と notes の同じ形、段の描きは div data-ledger-text={md::view(blocks)} の形（属性の値は空の字）と span{BLANK}/span 、測れていないの腕は Body::Unmeasured(reason) => section(BLOCK, ().into_any(), unmeasured(reason)), 。読みの path は bead.with(|b| b.as_ref().map(item_path).unwrap_or_default()) 。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜5 番目の項は verify の 4 行目（歯 ndbody_page_order・ndbody_folds_closed・ndbody_reads_bead_only・ndbody_body_parsed・ndbody_unread_line の 5 本）、6 番目の項は 5 行目（歯 frame_home_blocks_in_order_and_map_page）と 6 行目（歯 hsderive_consts_match_note）と 7 行目（歯 hspage_snaps_match_files）と 8 行目（歯 nodepage_frame_and_nav）と 9 行目（歯 ntime_block_and_page）、最後の 7 番目は 10 行目（xtask の check）で測る。verify の 1〜3 行目は命令の rc で測る守りで、done の項にしない。

      構造の連鎖（木 d08ecf42 で grep）。頁の block の並びを断言する着地した歯は frame・nodepage・ntime の 3 本（どれも書き替えた）。Module の ALL の全部を表で求める着地した歯 hsderive の 2 本（CONSTS と着地の値）は表に nodebody を足した。src/project の file の名を数える着地した歯 hsblock は dir から読むので書き替えずに通る。details と開き閉じの記録の数を module ごとに照らす着地した歯 steady_details_use_fold_record は、この file の 2 つの details と 2 つの呼びと FOLDS の 2 つで書き替えずに通る。語の辞書の語を src に字で書かない着地した歯 frame_no_heading_words_in_code に当たらないよう、語は鍵で引く。

      入口の赤。木 7d2b96e9 に、歯の file ndbody.rs と、nodebody.rs の定数と型と関数の頭（定数は空の字・関数は None か空の字か Body の Empty・DOM の view は何も出さない）を置いた木 0dfbb766（写しの branch r-node）で、verify の 4 行目は rc 100（5 本とも落ちる）。

      試作と噛み。写し drafts/w123a で書く file は write-set の中で閉じる（10 file）。verify の 2〜9 行目は rc 0。面の歯の全部の 888 本が通る。根の build（cargo build --workspace）と clippy --workspace --all-targets と wasm の clippy も rc 0（3 行を載せた先端の木）。句ごとの噛みは 23 で、どれも名指しの歯が rc 100 で落ち、対照（ndbody と群 teeth2〜teeth5）は rc 0（係の bites.tsv）。根の xtask の check は席が温かい木で撃つ。

      範囲の外。開き閉じの記録は今の部品の記録（頁の一生の間・URL にも保存の口にも書かない）で、browser を開き直した後までは覚えない（判断の記録 ADR-30 決定 (4) の 覚える は行 g-fold-keep が足す・持ち主の裁定 t3-hub.76.4）。個別の頁の概要の箱に本文の頭の 1 行（本文から）を渡すこと（行 g-node-excerpt）。
  - n: 29
    type: prose
    title: 行 c-fact-trim — bead の事実の口の概要の欄を消す
    body: |
      在りか。差の file docs/design/patch/c-fact-trim.patch は、係 w113a の 4 行と係 w117a の 2 行と係 w119a の 3 行を main 9abf0779 に順に当て、その上に係 w122a の 3 行（g-sum-pick・g-ask-mode・g-card-mode）と係 w123a の 3 行（g-pop-sum・g-md-view・g-node-body）を載せた木 d08ecf42（写し drafts/w123a の branch p-node・main 8cd1dc6f は 9abf0779 から crates を替えていない） と、その上に試作を載せた木 cbddc463（写し drafts/w125a の branch p-ftrim）との差（18,990 byte・14 file・新しい file 1・+87 −99）。facts.rs は行 c-short-cap が、pop.rs と teeth2/bvpop.rs は行 g-pop-sum が書くので、その後に当たる（depends）。差は depends の閉包（c-sum-two・c-short-cap・cs-bar・cs-pop・g-sum-pick・g-pop-sum）だけを main 8cd1dc6f に当てた木にも当たる。

      なぜ。判断の記録 ADR-30 決定 (3) と決定 (1) の (ク)（吹き出しの概要は開いた時に 1 本の引きの口から読み、電文の本文の概要は 1 本の引きの読みに替える）と、退けた案 c（概要の全文を事実の口に載せると電文が膨らむ）。行 g-pop-sum の後は面の吹き出しが事実の口の概要を読まないので、口 /api/beads の行ごとの 120 字の概要は誰も読まない字になる。消すと電文が小さくなる（台帳の本数ぶん 1 行ずつ）。

