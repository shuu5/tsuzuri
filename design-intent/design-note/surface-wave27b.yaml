  note: ノート surface-wave27a（32 行の全部が着地・同じ commit で廃止）の後。承認は行の出所の判断の記録ごとの持ち主の裁定（承認の列・ADR-29・ADR-30・ADR-36・ADR-37・ADR-38・ADR-41・逐語はそれぞれの判断の記録の承認の欄の字）。第 0.1 版（2026-10-04）は目的と 28 行を置いた。器の行 xp-io-bytes・xp-provenance・xp-host-runs・xp-prov-review・xp-host-live（判断の記録 ADR-37 と ADR-41・試作は係 w109a・w111a・w112a・w120a）、席の手元の憲法の写しの行と器の側の行 t-seatcopy・t-seathook・v-brief-const（判断の記録 ADR-38・持ち主の最優先の注入・試作は係 w124a と w126a・器の判断の記録 ADR-0045 と ADR-0046 は ADR-38 の決定 (11) が受け直し済み）、board の作る行と相談の窓の残りの行 c-sum-two・c-short-cap・e-hold-mark・c-short-gate・cs-server・cs-plugin・cs-hooks・cs-bar・cs-pop・g-sum-pick・g-ask-mode・g-card-mode・g-pop-sum・g-md-view・g-node-body・c-fact-trim・g-list-hover・g-list-sym・g-fold-keep・g-node-excerpt（判断の記録 ADR-30 と ADR-29・試作は係 w113a・w117a・w119a・w122a・w123a・w125a）。どの行も差の file（docs/design/patch/<行 id>.patch）の形で、行の字は係の起草のまま（先の事として書いた字だけを今の行の事実に合わせた）。器の行の req は器の要件の取り込み（要件書 第 0.27 版）の後の根の id（xp-io-bytes は FR1113・xp-provenance は FR1061・xp-host-runs と xp-host-live は FR1036・xp-prov-review は FR1049）。適用は係 w127a の 1 本の script（係の適用 12 本をまとめた）。 第 0.2 版（2026-10-04）は、器の受付が 4 行を断った（verify の歯の filter が、行の書かない着地済みの歯の file にも当たり、その file が write-set に無い）ので、置き場だけの = の項を write-set に足した。t-seatcopy に =folio2/crates/folio/src/note.rs（歯 f179_ の 1 本）と =folio2/crates/folio/tests/tz1/derive.rs（歯 f119_）、t-seathook に =crates/tsuzuri-core/tests/teeth1/fstop.rs（歯 fstop_）、g-sum-pick と g-node-body に =crates/tsuzuri-surface/tests/teeth3/hspage.rs（歯 hspage_）。行の題・done・verify・差の file・depends・節は替えない。 第 0.3 版（2026-10-04）は、器の行 v-brief-meter（試作は係 w128a・差の file・depends は v-brief-const）を v-brief-const の直後に足した。判断の記録 ADR-38 の決定 (4)(10) と撤退の条件 (5) の器の側の最後の形の後半（出力ごとの記録と規則の行 R-41 の値を写した器の rules の行と越えの検出と、その読み手の doctor の行 seat-role と、doctor の語 root）。 第 0.4 版（2026-10-04）は、器の行 xp-host-runs に器の e2e の一時 dir の直しを足した（係 w130a・差の file を切り直した・write-set に e2e の hook.rs と main.rs・verify に e2e の歯 xphost_ の行・done に 6 番目の項）。e2e の一時 dir を temp の dir の直下に作る形では、それを置き場に渡す歯の host の根が全部 temp の直下の dir scribe2-host になり、口座を選ぶ便の e2e が置く走りの札で、行 xp-host-live の後の便用の選びの歯が揺れ、同じ host のほかの木の歯も同じ dir を共有した。一時 dir を一意な根の 1 段下の子にし、host の根を歯ごとに閉じる。後の行 xp-prov-review・xp-host-live・v-brief-const・v-brief-meter の字と差の file は替えない（切り直さずに順に当たる）。 第 0.5 版（2026-10-04）は、器の値の読み方を行 t-seatcap の導出に替えた（審査の constitution:1・条 P-2.3/P-2.4）。器の行 v-brief-meter の 1 度目の便（t3-hub.74.59.10）は、値 2,000 を規則の行 R-41 と器の rules の行の 2 か所に人が書いて照らしの歯で揃える形で落ちた。値の正本は R-41 のまま置き、tsuzuri の側の行 t-seatcap（係 w138a・差の file）がtz derive で R-41 の値を要の写しの隣の導出物 contracts/seat/role-max-bytes.txt に書き、v-brief-meter（版を上げた・差の file を切り直した・depends に t-seatcap）は器の rules の行を作らずにその file を読む。v-brief-meter の語 root は新しい器の行 v-doctor-root（係 w138a・差の file・depends は v-brief-meter）へ割った。29 行から 31 行。第 0.6 版（2026-10-05）で、31 行の全部の着地を main の commit の件名（便の bead の id の頭）で照らして廃止した（superseded_by surface-plan）。

sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      判断の記録 ADR-37（便の出来を比べる実験場・持ち主の裁定 t3-hub.74.54.3:20261003T2312Z-1 の案 A）が器に足すと決めた必須の行と、後で足す行。器の行 xp-io-bytes・xp-provenance・xp-host-runs・xp-prov-review・xp-host-live を置く。便ごとの装置への正味の書きと、runner と gate と受付の審査の lens の版の記録を器の event に残し、本番の SSD の見張りと実験の比べの記録にする。器 scribe2/ を書く便は同時に 1 本まで（判断の記録 ADR-33 の決定 (12)）。口座の選びに host の根の走りを数える行は 2 本に割り、前半の行 xp-host-runs（runner の間、口座の label を持つ走りの札を host の根に置く）と、札を数える後半の行 xp-host-live（口座の選びの鍵の頭に、ほかの置き場の生きた札を持つかを足して後に回す・判断の記録 ADR-41）を置く。最初の形 B の前に流す。条件つきの行（審査の model と effort を割る規則の行・実験の置き場の印）は、要る時に起こす。

      判断の記録 ADR-38（憲法を 1 つにし席の手元へ要の写しを注ぐ）の行も置く（持ち主の最優先の注入）。tsuzuri の側の行 t-seatcopy と t-seathook（tz derive の 2 つの写しと、器の SessionStart が効くまでの暫定の hook）と、器の側の行 v-brief-const（器の宣言の鍵を名乗った project の席で器の SessionStart の brief が要の写しを字のまま出し、鍵を器の binary に問う口を足す）。器の側の後半の行 v-brief-meter（役割の行の byte の記録と、規則の行 R-41 の値を越えた時の検出と doctor の行 seat-role）は試作の後に第 0.2 版で足し、第 0.5 版で上限を tsuzuri の側の行 t-seatcap の導出物（tz derive が R-41 の値を要の写しの隣に書く file）から読む形に替え、doctor の語 root を器の行 v-doctor-root へ割った。

      判断の記録 ADR-30（board の概要の出し分け・個別の頁の詳細の表示・短い題の上限と起票の門・測れていないの直し）の作る行と、判断の記録 ADR-29（相談の窓・持ち主の裁定 t3-hub.75.1 と t3-hub.75.2）の作る行のうちノート surface-wave27a に置き漏らした残りの行も置く（c-sum-two・c-short-cap・e-hold-mark・c-short-gate・cs-server・cs-plugin・cs-hooks・cs-bar・cs-pop・g-sum-pick・g-ask-mode・g-card-mode・g-pop-sum・g-md-view・g-node-body・c-fact-trim・g-list-hover・g-list-sym・g-fold-keep・g-node-excerpt・board の作る行の節と相談の窓の残りの行の節）。
  - n: 2
    type: contract-table
    title: 契約表
    rows:
      - id: xp-io-bytes
        title: 器が便の囲い（runner と gate の verify 行の scope）ごとに装置への正味の書き（包みの sh の /proc の io の write_bytes から cancelled_write_bytes を引いた byte）を測り、終端行 confine-usage の字 write_bytes= と verify の record の欄 write_bytes と消費の event の欄 detail の語 write に書き、測れない周は字 unmeasured と書く（判断の記録 ADR-37・差の file）
        req: ["FR1113"]
        section: "3"
        write-set: ["scribe2/crates/scribe2/src/pipe/confine.rs", "+scribe2/crates/scribe2/src/pipe/confine/io.rs", "scribe2/crates/scribe2/src/pipe/gate.rs", "scribe2/crates/scribe2/src/pipe/gate/record.rs", "scribe2/crates/scribe2/src/pipe/gate/verify.rs", "scribe2/crates/scribe2/src/pipe/mod.rs", "scribe2/crates/scribe2/src/pipe/spawn.rs"]
        verify: ["git apply --reverse --check docs/design/patch/xp-io-bytes.patch", "cargo clippy --manifest-path scribe2/Cargo.toml -p scribe2 --all-targets --no-deps -- -D warnings", "cargo nextest run --manifest-path scribe2/Cargo.toml -p scribe2 --lib --no-tests=fail xpio_", "cargo run -q -p xtask -- check"]
        size: M
        done: (1) 正味の書きの shell の字は fixture の io の字の write_bytes から cancelled_write_bytes を引いた数を出し、rchar と wchar と read_bytes を数えない（歯 xpio_net_write_subtracts_cancelled_bytes） (2) write_bytes と cancelled_write_bytes のどちらかが欠ける周・数でない周・file が無い周は字 unmeasured を出し、2 つが揃う対照は数を出す（歯 xpio_net_write_is_unmeasured_without_both_fields） (3) 包みの終端行の script は字 __io=/proc/$$/io の行と正味の書きの shell の字を持ち、printf の字は confine-usage peak_bytes=%s oom_kill=%s write_bytes=%s で、3 つ目に __wb を渡す（歯 xpio_epilogue_reads_own_proc_io） (4) 終端行の読みは字 write_bytes= の後の 10 進の数を読み、字 unmeasured と負の数と欄の無い旧い行は測れないと読み、peak の読みは替えない（歯 xpio_read_usage_reads_write_bytes） (5) 包めた周だけ stdout の終端行の書きを読み、包めなかった周は同じ stdout でも測れないと読む（歯 xpio_written_reads_only_confined_runs） (6) detail の語は字 write と半角のコロンの後に数か字 unmeasured で、囲いの和は 1 つでも測れない囲いが在る周と囲いが 0 の周は測れない（歯 xpio_detail_and_total_keep_unmeasured） (7) 消費の event の口 record_cost_with は語を event の欄 detail に書いて読み返しても同じ字で、record_cost は欄 detail を書かず、消費の 6 値は替えない（歯 xpio_cost_event_carries_write_detail） (8) cargo run -q -p xtask -- check が rc 0（最後の verify の行・歯の全部）
        depends: []
      - id: xp-provenance
        title: 器が runner と gate の lens の claude を起こす直前に版の 4 語（器の binary の組みの commit・claude の CLI の版・claude に渡す model と effort）を組み、消費の event の欄 detail の囲いの書きの語に続けて書き、読めない版は字 unmeasured と書く（判断の記録 ADR-37・差の file）
        req: ["FR1061"]
        section: "4"
        write-set: ["scribe2/crates/scribe2/src/headless/mod.rs", "+scribe2/crates/scribe2/src/headless/provenance.rs", "scribe2/crates/scribe2/src/headless/runner.rs", "scribe2/crates/scribe2/src/headless/lens.rs", "scribe2/crates/scribe2/src/pipe/gate.rs", "scribe2/crates/scribe2/src/pipe/gate/lens.rs", "scribe2/crates/scribe2/src/pipe/spawn.rs", "scribe2/crates/scribe2-boundary/tests/e2e/headless.rs", "scribe2/crates/scribe2-boundary/tests/e2e/pipe/gate.rs"]
