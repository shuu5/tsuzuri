      在りか。差の file docs/design/patch/g-list-sym.patch は、行 g-list-hover の試作の木 332cff11（写し drafts/w125a の branch p-hover）と、その上に試作を載せた木 e86434d4（branch p-sym）との差（14,382 byte・4 file・新しい file 1・+220 −9）。ledgerlist.rs と pipeline.rs と style.css は行 g-list-hover も書き、ledgerlist.rs の module の注の hunk は g-list-hover の注の行に続くので、その後に当たる（depends）。

