      形。 - src/project/node.rs（host）: module の注に 2 行。use に契約の summary の excerpt と vocab の label と吹き出しの語の鍵 UNKNOWN_KEY（語 まだ分からない）を足す。型 Excerpt（Never・Unread・Read の 3 つ）と関数 excerpt_of（bead が None なら Never・電文の行の id が bead と同じ時だけ Read・ほかは Unread）と summary_in（plain と eng と Read の行を pick に渡す・選べなければ表示の型の側の見出しで class sumbox none、字は Unread の時だけ まだ分からない、ほかは要約なし）を足し、関数 summary は summary_in に Never を渡す形に縮める（呼びの形と値は替えない・着地した歯 mpick と gsum と nodepage と frame は書き替えずに通る）。 - node.rs（DOM）: use に Excerpt と excerpt_of と summary_in と nodebody の item_source を足し summary を外す。view の頭（content の closure の外）で item_source を 1 度呼び、中心の行の箱を作る所で bead と電文を excerpt_of に渡して summary_in に渡す。 - src/project/nodebody.rs: module の注に 1 行。DOM に型 ItemSource（近傍の読み・bead の Memo・1 本の引きの読み）と thread_local の ITEM と関数 item_source（近傍の読みが無ければ None・ITEM の近傍の読みが今の近傍の読みと同じなら同じ値を返し、違えば bead の Memo と path の signal と read_path を作って ITEM に残す）を足し、view は item_source の bead と読みを使う（bead の決め方と path の式と read_path の行は前の view の字のまま item_source へ移した）。pub use に ItemSource と item_source を足す。 - 新しい歯の段 tests/nexc.rs（接頭辞 nexc_・4 本）。 - 着地した歯の書き替え（群の module の file だけ）: teeth3/gsum.rs の歯 gsum_dom_text の呼びの字 1 行。

      節の字（歯が比べる字・差の file が字の正本）。節点の block の DOM は let body = item_source(); と s.item.with(|(f, _)| excerpt_of(f, b.as_ref())) と let boxes = sum_view(summary_in(c, mode(), &excerpt)); を 1 つずつ持ち、字 crate::net::read_path( は決定の頁の問いの 1 つだけ。nodebody の DOM は字 crate::net::read_path( を 1 つだけ（item_source の中の let item = crate::net::read_path(path);）持ち、item_source の中に if let Some(s) = ITEM.get().filter(|s| s.near == near) { と ITEM.set(Some(s)); 、view に let Some(ItemSource { bead, item, .. }) = item_source() else { 。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1〜4 番目の項は verify の 4 行目（歯 nexc_excerpt_states・nexc_box_body_line・nexc_box_unread_none・nexc_one_item_read の 4 本）、5 番目の項は 5 行目（歯 gsum_dom_text）、最後の 6 番目は 6 行目（xtask の check）で測る。verify の 1〜3 行目は命令の rc で測る守りで、done の項にしない。

      構造の連鎖（木 8ef65138 で grep）。node::summary を呼ぶ着地した歯は mpick・gsum・nodepage・frame の 4 本で、包みの summary の値は前と同じなので書き替えない。node.rs の DOM の字を見る着地した歯は gsum（書き替えた）と rvknode と ptitle（書き替えずに通る）。nodebody の DOM の字を見る行 g-node-body の歯 ndbody（bead の Memo と path と read_path と bead の get の字を 1 つずつ）は、字を item_source へ移しても 1 つずつなので書き替えずに通る。頁の block の並び（node が around と body より前）は替えないので、item_source を初めに呼ぶのは節点の block で、近傍の読みの source と同じ一生の読みになる。

