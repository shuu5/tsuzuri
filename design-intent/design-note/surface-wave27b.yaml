    title: 行 v-doctor-root — doctor の導入先の語 root（行 v-brief-meter から移した）
    body: |
      在りか。差の file docs/design/patch/v-doctor-root.patch は、行 v-brief-meter の試作の木 a1f8c2f9 と、その上に試作を載せた木 f0dd4a87（写し drafts/w138a の branch p-root）との差（10,440 byte・2 file・+54 −8）。差の触れる 2 file のうち account/consumers.rs は行 v-brief-meter の差が触れず、境界の src/main.rs は v-brief-meter の差の hunk（doctor の行の 1 行）と離れているので、差は main 4e6e5f3d にも、main にノート surface-wave28a の器の 3 本の差を当てた木にも、v-brief-meter の差の前でも後でも当たる（係の apply.tsv）。中身は前の版の行 v-brief-meter の差（係 w128a）の consumers.rs の hunk 8 つと境界の main.rs の見本の 1 行のままで、歯の名の接頭辞を vbmeter_ から vbroot_ に替え、歯の一時の置き場の名を vbroot にした。

      なぜ。判断の記録 ADR-38 の決定 (10)。doctor に、読み込み元の root が宣言の plugin の dir と違う周を名指す語を足す（今の語はこの違いを黙る・入れ替えの前の席の手の付け替えをこの語で確かめる）。行 v-brief-meter の版を上げた時に、役割の行の上限と関わらない語 root をこの行へ割った（v-brief-meter の差を小さくし、審査の材料を分ける）。

      形。 - account/consumers.rs: 語 Root（字 root・Plugin の直後）と Consumer の欄 roots（起動行の plugin の dir の列）と、その列を作る roots_of。Draft::measure は anchor の path と host の [[plugin]] の宣言を受ける。歯 vbroot_doctor_root_names_a_record_outside_the_launch_plugin_dirs を足し、着地済みの歯 doctor_consumer_drift_words_are_closed_in_declaration_order の語の列に root を足した（語は 6 つ）。 - 境界の src/main.rs: doctor の外形の見本の Consumer に roots の空の列を 1 行。

      doctor の語 root。立つのは、記録が読め（記録は登録 row の席の打刻の dir に在るので、帳簿にだけ在る導入先は記録が無く立たない）、host の宣言が [[plugin]] を 1 本以上持ち、記録の root がその dir のどれとも anchor の生成 dir（anchor の下の plugin＝起動行の 1 本目）とも同じ場所（same_dir・実体 path で比べ解けない周は字面）でない周。[[plugin]] を宣言しない host は比べる相手が無いので立てない（dir の列は空）。失うもの: [[plugin]] を持たない host の席が別の dir から読んだ周は名指さない（その周は帳簿の側の語 dual と ledger が見る）。今の e2e の doctor の歯の host は [[plugin]] を宣言しないので、出す行の字は替わらない。今の tsuzuri の席は、起動行の器の plugin の dir の付け替えの前はこの語が立つ見込み（記録の root は元の repo の器の plugin）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 番目の項は verify の 3 行目（器の lib の歯 vbroot_doctor_root_names_a_record_outside_the_launch_plugin_dirs・在りかは account/consumers.rs）、2 番目の項は 4 行目（xtask の check の入れ子の nextest が撃つ器の lib の歯 doctor_consumer_drift_words_are_closed_in_declaration_order・在りかは account/consumers.rs）、最後の 3 番目の項は 4 行目で測る。verify の 1 行目と 2 行目は命令の rc で測る守り。

      構造の連鎖（木 f0dd4a87 で grep）。Consumer の組みは consumers.rs の measure と歯 1 本と境界の main.rs の見本の 1 か所。Draft::measure の呼び手は doctor_lines の 1 か所と歯 2 か所。DRIFTS の読み手は drift_of と歯 1 本。器の file の行の上限（1500・幅で数える）は consumers.rs と境界の main.rs のどちらも余地が 800 を越える。

      入口の赤。行 v-brief-meter の試作の木 a1f8c2f9 には名に vbroot_ を持つ歯が 1 本も無い（git grep で 0）ので、そこでは verify の 3 行目は --no-tests=fail で落ちる。

      試作と噛み。写し drafts/w138a で書く file は write-set の中で閉じる（2 file）。verify の 2 行目と 3 行目は rc 0（歯 vbroot_doctor_root_names_a_record_outside_the_launch_plugin_dirs と doctor_consumer_drift_words_are_closed_in_declaration_order と vbmeter_ の 6 本を同じ撃ちで）。入れ子の 2 段は xtask と同じ引数と置き場（target/nested/scribe2）と cwd（scribe2/）で、3 行を重ねた先端 f0dd4a87（写し drafts/w138a の branch p-root）で撃った。nextest run --workspace --no-fail-fast は 4,066 本の全部が緑、clippy --workspace --all-targets -- -D warnings は rc 0。 句ごとの噛みは 5（生成 dir を列から外す・列の 1 本目だけと比べる・[[plugin]] の無い host の早い返しを外す・記録が無い周に立てる・語の字を roots に替える）で、どれも名指しの歯が rc 100 で落ち、対照（噛みの前の同じ字の木の撃ち）は rc 0（係の bites.tsv）。

      流す時と順。大きさは S（+54 −8）。scribe2/ を書く便は同時に 1 本まで（判断の記録 ADR-33 の決定 (12)）。行 v-brief-meter の後に流す（depends・境界の main.rs を両方が書く）。器の入れ替えは v-brief-meter とこの行の着地の後（記録と読み手と語 root がそろってから）。

      範囲の外。起動行の plugin の dir の付け替え（席の手）。帳簿の側の語（dual・ledger）。器の設計文書の書き換え。

