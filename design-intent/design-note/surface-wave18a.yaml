  - n: 3
    type: prose
    title: 行 c-ledger-stage — 台帳の一覧の項に pipeline の板と同じ段を出す
    body: |
      在りかの main は 0590728（計画 surface-plan v0.54）。この行は開いている便 c-pipe-ci（ノート surface-wave13i・便 t3-hub.52.97）の後に流す（同じ src/project/pipeline.rs を書き、c-pipe-ci が置く札の CI の読みを使う）。pipeline.rs の在りかは c-pipe-ci の契約の字（名と値）で書き、行の番号と行の数は書かない。起草の試作は main bfc0c8c（この main との違いは account board の file と歯と語の辞書だけ）に c-pipe-ci の起草の試作を当てた土台で撃った。
      なぜ。持ち主の指摘（記帳 t3-hub.1・user 2026-09-28T22:5xZ）は、pipeline で走っている契約が台帳の一覧で未着手と出るのはおかしいというもの。今の台帳の一覧（HOME の block 台帳の一覧・epic の下に task と memo）の項の右の字は、kit の item が bd の状態だけから view の mark で決める（open は ○ 未着手・in_progress は ◐ 作業中・blocked は ⊘ 止まり・deferred は ◌ 先送り・closed は ● 閉じた）。器の席の答え（2026-09-28T23:1xZ・つなぎとして可・c-pipe-ci と同じ扱い）は、新しい段の計算を足さず、pipeline の板が既に持つ段の読みと同じ 1 つの読みから語を出して板と一覧を食い違わせないこと、器の局面の出力（state dir の fleet/lifecycle.json）が着地したら後の行 c-ledger-lc でこのつなぎを外すので 1 か所で差し替わる形にすること、epic の語は替えないこと（計画 9 節の計画だけの行 c-ledger-stage）。要件 FR10 は板の 4 列と札の段、要件 FR13 は台帳の一覧を定める。
      在りか・pipeline.rs（write-set・build.rs が生成する pub mod で crate::project::pipeline・結合試験は tsuzuri_surface::project::pipeline）。今の main の host の部分: pub const PATH（字 /api/pipeline）・pub const CLOSED_STAGE（字 閉じた（着地せず））・pub struct Kcard（pub な欄 id・title・state〔状態の記号の値・&static str の Option・None は取り込みの印〕・lead・age・class・hover〔widgets の hover の Card〕・run_line・run_more・closed）・pub const LANES（4 列の見せ方・列 QueuedBlocked の記号 wait・RunningGated の run・QuestionedFailedStopped の wait・Landed は None）・pub fn cards（Fetched の参照を受け PipelineCard の Vec か理由の Result・NotRead と Failed と電文が読めない本文と札が Unknown の板は Err）・pub fn closed_card（段の列が Landed で段の理由が字 closed: で始まる札）・pub fn kcard（PipelineCard の参照と台帳の行の slice を受け Kcard を返す・本文の頭で、閉じた札なら CLOSED_STAGE、ほかは段の Debug の名を段の字にし、run_line〔回数と段の字と理由〕と hover の kind〔定数 RUN_KEY の字 run と中黒と段の字〕に使う）。c-pipe-ci の契約が足す物（その done の字・この行はその着地の字の上に書く）: 契約の board の pub enum Ci と PipelineCard の欄 ci、面の pipeline の pub const CI_KEYS（読みと語の鍵の対 7 つ・Waiting は ci_wait）・pub fn ci_key・pub fn ci_shown・pub const CI_WAIT_STATE（字 run）・Kcard の pub な欄 ci（札の meta に足す CI の読み・止まった列の札は None）、kcard は ci_shown が Waiting の札の state を Some(CI_WAIT_STATE) にし、面の語の辞書に鍵 ci_wait（語 CI 中）と ci_success（語 CI 成功）ほか。wasm の target のときだけの mod dom の fn kcard_view は、閉じた札は class st の span（style の色 var(--ink-3)・aria-label に CLOSED_STAGE・inner_html に ✕ の svg の定数 CROSS）、ほかは state が Some なら kit の state_icon、None なら取り込みの印の span（色 var(--s-land)・定数 CHECK）を記号にする（c-pipe-ci は CI の語の span を足す）。pub fn view は dom::view を返す。
      在りか・kit.rs（write-set・今の main で 281 行・src/kit.rs・project の mod.rs が glob で再公開し crate::project の path でも引く）。host の部分に pub struct Item（50 行・derive は Debug・Clone・PartialEq・Eq・pub な欄 shape・alert・id・title・aside の 5 つ）と pub fn item（65 行・台帳の行の状態を view の mark に渡し、右の字を印と語と中黒と種類にする）と pub fn node_item（80 行・右の字は空）。mod dom（166 行）の pub fn item_view（260 行・Item の参照と番号の usize の Option と card の Option を受ける）は右の字を class aside の span に出す。在りか・ledger.rs（write-set・今の main で 1236 行・crate::project::ledger）。host の部分に pub fn listed（69 行・状態が closed でない行）・pub struct Group（95 行・pub な欄 head の Item の Option と children の Item の Vec）・pub fn body（727 行・Screen の参照を受け Body の Group の Vec・下の項は listed の行を item にし、頭は epic の行の item）。mod dom（881 行）の fn list_view（1200 行）は字 screen.with(body) で組を読み、fn group_view（1214 行）が kit の item_view で項を描く。在りか・mapview/tree.rs（write-set・451 行）の Branch の頭（232 行）が kit の Item を字で組む（右の字は空）。
      在りか・着地済みの歯で、この行が字を直す 3 つ（write-set）。tests/lhome.rs の lhome_list_draws_body（166 行）は list_view の本文に字 screen.with(body) が在ることを見る（179 行）。tests/cadl.rs の cadl_group_cards_rules（103 行の let stray）と tests/itemlink.rs の fn want（72 行）は kit の Item を 5 つの欄の字で組む。この行はこの 2 つに欄 stage の None を 1 行ずつ足し、lhome の字の期待を新しい list_view の字に替える（歯で測らず、この行の差分で持つ）。
      使う物（この行は書かない・確かめた）。契約の crate の board の Stage（8 つ・PipelineColumn への column）と PipelineCard（pub な欄 contract・runs・stage・reason・account・elapsed_s と c-pipe-ci の ci）と PipelineBoard（pub な欄 cards と misfits）と Reading、ledger の BeadId・LedgerList・LedgerRow（pub な欄 id・kind・title・status・updated_at・parent・labels）、wire。面の view の Fetched と Screen（pub fn initial と after_read）・pub fn mark（この行は変えない）。kit の mod dom の pub fn state_icon（状態の記号の値を受ける）。面の net の pub fn read（口の path ごとに 1 つの signal を持ち、2 度目の呼びは同じ signal を返す・HOME の頁は block の next・pipeline・ledger・legend を並べるので、台帳の一覧は block pipeline と同じ口の読みを使う）。語の辞書の鍵 ci_wait・ci_success ほか（c-pipe-ci が足す・この行は書かない）。
