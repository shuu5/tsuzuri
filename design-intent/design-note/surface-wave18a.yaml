    title: 目的
    body: |
      台帳の一覧（HOME の block 台帳の一覧）の項の状態の語を、pipeline の板に札が在る bead なら板の札と同じ段で出す、面の crate の行 1 つ。
      今の一覧の項は bd の状態（open・in_progress など）だけから語を出すので、pipeline で走っている契約も未着手と出て、板と食い違う。
      段は block pipeline の札の読み（kcard と札の段の字の関数 stage_word）から関数 stages 1 つで bead の id ごとに組み、一覧の下の項は右の字の前に札と同じ記号を出して、右の字を段の字（段の名・閉じた（着地せず）・札の CI の語）と種類にする。
      札の無い bead・epic の頭・板の口が読めない間は今の bd の状態の語のまま。ほかの一覧（地図の一覧・節点の card と頁・地図の木・問いの頁）は板の読みを持たないので今のまま。
      新しい段の計算・語の辞書・stylesheet・境界の server と中核と契約の crate・外の依存は変えない。器の局面の出力を読む後の行 c-ledger-lc は stages の 1 か所を替える。
