  - n: 3
    type: prose
    title: 行 g-pulse — 読みの途中に最終の記録の横へ短い脈を出す
    body: |
      なぜ。持ち主の裁定 t3-hub.52.39（裁定 id = t3-hub.52.39:20260928T0155Z-1）は、変化の知らせのつながりの切れも台帳の読みの落ちと同じ 1 つの古さで数える形（行 g-fresh・着地済み・a618238）に揃えると決めた。計画 surface-plan の 3 節の判断の表の行 d28（この裁定の行）の効果の字は、行 g-fresh（つながりの切れと読みの落ちを 1 つの古さで数える）と g-pulse（推奨の A の技術に在った読みの間の短い脈）で、この行はその後の方。要件 NFR2 は面が最終更新（最後に読めた時刻）を出すと決め、脈はその横で今まさに読んでいることを見せる（読みの間も最終の記録の字は前のままなので、読んでいるのか止まっているのかを見分けられる）。計画の 9 節の行 g-pulse（依存 g-fresh・着地済み）は、1 つでも口が読みの途中なら header の最終の記録の横へ短い脈（見本の tz-pulse）を出すと決める。
      見本（docs/design/mock3・判断の記録 ADR-7 で確定）。ui.js の関数 feed は、更新が届くたびに class の値 st と feed を持つ要素（席の pill の状態の記号・関数 seatPillHTML が stIcon に feed を渡す）に class の値 beat を足し、800 ミリ秒の後に外す。ui.css の規則 .st.st-run::after は tz-pulse の輪（1.6 秒・ease-out・繰り返し）を描き、規則 .st.beat::after はその間を .8 秒に縮める。見本の feed は class の目印で stylesheet に規則を持たない。この行は計画の字のとおり脈を最終の記録の chip の直後に置き（2 つの board の一番上の帯に最終の記録が在るのは本番の足し・席の pill は行 g-seatpill）、見本の beat の 800 ミリ秒を脈を残す間に使う。
      在りか（main 43e8ba4 で確かめた）。面の src/lib.rs の行 pub mod flight; と pub mod fresh; は target を限る cfg の属性の後に無く host でも組み、pub mod board; と pub mod net; は字 #[cfg(target_arch と wasm32 の属性の後に在り wasm の target のときだけ組む。src/flight.rs（書かない・write-set の =）の pub struct Flight（欄 users・busy・again・missed・round は外に見せない）は、pub fn start が読みを始めると欄 busy を真にし（読みの途中なら again を置いて偽を返す）、pub fn end が again の無いときだけ busy を偽にし、pub fn renew が busy を偽にし、pub fn busy が欄 busy を返す。面の src/net.rs（書く）の thread_local の READS（RefCell の Vec の組 path と ArcRwSignal の Fetched と Flight）と WATCHES（RefCell の Vec の組 String と ArcRwSignal の組と Flight）が口ごとの Flight を持つ。Flight を変える所は、fn read_flight と fn watch_flight（slot 番目の Flight に関数を撃つ・with_borrow_mut）と、pub fn read（登録か attach・接続が開いた後なら start）と、pub fn read_path の Effect（renew と start）と、pub fn reload_all の WATCHES の腕（call）で、fn load_at と fn load_watch の読みの終わり（end）と reload_all の READS の腕（call）は read_flight と watch_flight を通る。一度の読めないの読み直し（view の Settle の Retry・RETRY_MS の後）は end を撃たずに戻るので、その間も busy は真のまま。fn fetch_status に時間切れは無いので、返らない読みの間も busy は真のまま（読みの途中なので脈が出続けてよい）。post と知らせの接続（EventSource）は Flight を持たない。今は busy の数を数える所も signal も無く、header に脈は無い。
      面の src/fresh.rs（書く・host でも組む）は pub struct Fresh と pub const HELD_POLL_MS・WARN_WORD ほかを持ち、wasm の target のときだけの mod dom に pub fn mark（AnyView を返す・読み込み不良の印）を持ち、属性 cfg の後の行 pub use dom::mark; で外に見せる。src/board.rs（書く）の fn top の部品 updated の腕は、class が chip num の span（最終の記録の短い時刻）の直後に fresh::mark() を置く。src/account/board.rs（書く）の fn top の nav の腕は、nav と grow の span の後に updated_chip() と fresh::mark() をこの順に置く。stylesheet（style.css・書かない・write-set の =）の規則 .st は 16px 四方の inline-grid、.st.st-run i は動いているの色の 10px の丸、.st.st-run::after は tz-pulse の輪、.st.beat::after は animation-duration を .8s にし、prefers-reduced-motion が reduce のときは .st の子と ::after の動きを止める。
      形（fresh.rs）。host の部分に pub const PULSE_MS（u64・800）と pub fn pulse_class（真なら字 st st-run beat・偽なら字 st）と pub struct Pulse（欄 busy の usize と ended の u64 の Option・derive は Debug・Clone・Copy・Default・PartialEq・Eq）を足す。set(busy, at) は、欄 busy が 1 以上で受けた busy が 0 のときだけ ended に at を置き、欄 busy を受けた値にする（0 のままの知らせは ended を動かさない）。on(now) は欄 busy が 1 以上か、ended が在り now から ended を引いた値（0 で止める）が PULSE_MS 未満のとき真。mod dom に pub fn pulse（AnyView を返す）を足し、pub use を pub use dom::{mark, pulse}; にする。pulse は crate::net::busy() を読み、Effect で読みの途中の口の数 n と今のミリ秒の時刻 now（js_sys の Date::now）を Pulse の RwSignal に .set(n, now) の形で渡し、時刻の RwSignal に now を置き、n が 0 なら end = now + PULSE_MS を置いて、PULSE_MS の後（set_timeout）に時刻の RwSignal を Date::now と end の大きい方に置き直す（脈を消す組み直し・時計が戻っても 0 になった時刻から PULSE_MS より前に置かない）。脈は span 1 つで、class は pulse_class に Pulse の on を渡した字、属性 aria-hidden は true（飾り）、中に空の i を 1 つ持つ。出さない間も class st の 16px の幅を持つので、読みのたびに帯の字が動かない。
      形（net.rs）。thread_local に BUSY（RefCell の ArcRwSignal の usize の Option・初めての呼びで 0 で作る・頁に 1 本）を足し、pub fn busy（ReadSignal の usize を返す）で読ませる。fn count_busy は READS と WATCHES をそれぞれ with_borrow で借りて Flight の busy が真の組を数えて足した数を n に置き、値が変わった時だけ signal.set(n) を撃つ。count_busy は READS か WATCHES を借りている間（with_borrow_mut の閉包の中）に撃たない（RefCell の二重の借りで wasm が panic する・diff で見る）。read_flight と watch_flight は関数を撃った後に count_busy を撃って結果を返し、read は READS の with_borrow_mut の閉包の後で load_at の前に、read_path の Effect は WATCHES の with_borrow_mut の閉包（flight.renew() と start）の後で load_watch の前に、reload_all は 2 つの腕の後に 1 度撃つ。lose_all・go_live・connect・load_at・load_watch・fetch_status・note・link_lost・link_back と set_interval の 1 か所と知らせの接続は変えない。
      形（2 つの board）。board.rs の部品 updated の腕の view を、最終の記録の span・fresh::pulse()・fresh::mark() の順にする。account の board.rs の nav の腕を、updated_chip()・fresh::pulse()・fresh::mark() の順にする。どちらも fn top の doc の字に読みの脈を足す。HEADER の表と tests/snapshots/header.json と frame.rs と vocab.json と style.css と Cargo.toml は書かない（脈の class の st・st-run・beat は stylesheet に在り、語を足さない）。
      着地済みの歯（直さずに通る・write-set の =）。tests/flight.rs の flight_net_wiring_text は net の fn read に LIVE.get() と .attach() と on_cleanup( と .detach()、read_path にさらに .renew()、load_at に .end()、load_watch に .end() と .round() と spawn_local の前の if path.is_empty() {、go_live に LIVE.set(true) と reload_all()、connect に set_timeout( と OPEN_WAIT_MS と、new(go_live) と new(reload_all) が 1 度ずつ在ること、reload_all に .call() が 2 度以上在ること、lib.rs の pub mod flight; の前の行が cfg でないことを見る（関数の本文の見方は字 fn 名( から次の行頭の fn・pub fn・async fn・pub async fn の前まで・どの字も保つ）。tests/gfresh.rs の gfresh_net_text は net の fetch_status・note・link_lost・link_back・read・read_path・connect の字と pub fn fresh() を、gfresh_boards_text は fresh の mod dom の mark の字と、board.rs の fn top の net::fresh() と Fresh::record と fresh::mark() と字 updated_at の無さと、account の board.rs の updated_chip の Fresh::record と top の fresh::mark() を見る（足す字はどれも消さない）。tests/steady.rs の steady_net_uses_settle_but_lose_all_does_not は net の settle(now, &fetched, attempt) と fn lose_all の本文と load_at の Settle と RETRY_MS と、read と reload_all と post の外形を見る。tests/ticker.rs の ticker_net_holds_one_interval は net の set_interval( が 1 度だけ（脈の待ちは fresh.rs の set_timeout）。tests/aaround.rs は load_watch の if path.is_empty() {。tests/parts.rs は src の二重引用符の /api/ の字と EventSource::new( が 1 度と event の名の字の無さと RELOAD_EVENTS（書く字はどれも持たない）。tests/frame.rs の frame_ は src の全部の file の class の字の値が stylesheet に在ること（足す class の字は無い）と語の辞書の日本語の見出しの語を二重引用符で囲んだ字の無さと frame.rs の中身の語の無さ。tests/aord.rs は src の字 decode::<AccountDoc> の 1 か所。board.rs を読む歯（brand・acctwire・hsblock・ptitle・hspage・ncard・mstore・lcard・smore）と account の board.rs と src/account の下を読む歯（acctframe・acctlook・accthome・acctpop・acctwin・hcard・hcsess・hcproj・mstore）は、この行が消さない字（題の brand(・戻るの字・block_view・PageSubject・HelpCtx と HoverCtx と CardLayer・settle_mode と keep_mode・popstate・set_name・字 localStorage の無さほか）を見る。
      測り方。新しい歯は面の crate の tests/gpulse.rs に置き、名を gpulse_ で始める。Pulse と pulse_class は host の値で見る（時刻はミリ秒の数）。net と 2 つの board と fresh の mod dom は wasm の target だけで組むので、字の歯と xtask の surface-build と check（wasm の clippy を含む）で見る。関数の本文の字は、字 fn 名( か fn 名< から次の行頭の fn・pub fn・async fn・pub async fn の前まで（read_flight と watch_flight は型の引数を持つので < の形）。自分の名の歯は tests/gpulse.rs の字を読み、test の属性の行の次の fn の名を全部集める。試作（席の作業場の写しの main 7d633b6〔crate と fixture の字は 43e8ba4 と同じ〕に同じ形を書いた）で、gpulse_ の 5 本と面の crate の着地済みの歯の全部と host と wasm の clippy が通った。
      filter の語（main の契約表の全部の行〔着地済みの行と契約だけの行〕の verify の filter の語と、計画の後の行 g-gz の接頭辞 pgz_ と、同じノートのほかの 2 行の接頭辞 gpill_ と gbnote_ を並べ、この行の接頭辞 gpulse_ は並べず、ほかの語を部分の字として含む語は省いた）は aaround_・accept_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadopt_・cgdom_・cmark_・contract_form_・cround_・csled_・denv_・ecache_・flight_・fmark_・frame_・fserve_・fstop_・gapspage_・gbnote_・gfresh_・ghb_・glabel_・gnav_・gpill_・graph_・gsum_・gtuck_・gview_・hacols_・hbconf_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hspage_・hsym_・iclose_・ilink_・kcli_・klink_・launch_・lcard_・ledgerblock_・lhome_・lspark_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・parts_・pclosed_・pfold_・pgz_・pipe_・plimit_・pmore_・pquest_・project_・ptitle_・punmap_・pwhole_・qblock_・qgate_・qkey_・question_・relay_・rhold_・runsdoc_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・stcli_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_ で、新しい歯の名から先頭の gpulse_ を除いた字は、このどれも部分の字として含まない（例 gpulse_frame_x・gpulse_steady_x は不可）。名は done に書いた gpulse_class_and_length・gpulse_on_while_busy_and_after・gpulse_net_text・gpulse_boards_text・gpulse_own_names_clean（どれも並べた語を含まない）。
      依存と順。depends は無い（行 g-fresh と g-reads は着地済み・別のノート）。同じノートの行 g-seatpill と g-back-note は board.rs を書き、= の歯の file も重なるので、この行 → g-seatpill → g-back-note の順に流す（ノートの depends と便の bead の依存で持つ・器は走行中の行と write-set が = を含めて重なる行を断る）。計画の 5 節の鎖は board.rs が g-fresh → g-nav → g-pulse、net.rs と tests/flight.rs が g-reads → g-fresh → g-pulse → c-ev-kind、account の board.rs が g-fresh → g-pulse → h-dormant。まだ契約の行の無い g-nav がこの行より先に便の bead を持つなら、この行の便の bead を g-nav の便の bead に依存させ、c-ev-kind と h-dormant はこの行の後に流す（順は便の bead の依存で持つ）。別のノートの契約だけの行 e-revoke（ノート surface-wave12d）とは = の歯の file（tests/frame.rs・parts.rs・ptitle.rs）が重なるので同時に流さない（待ちの解けた方を先に・順は便の bead の依存で持つ）。外の依存は足さない。
      決定はしご（条 P-27）。要るか: 要る（裁定 t3-hub.52.39 の効果）。既に在るか: 読みの途中は口ごとの Flight の busy に在るが、数も signal も脈の DOM も無い。足す物は host の小さな状態 1 つ（Pulse）と、net の数え直しの関数 1 つと、DOM の span 1 つで、新しい file も語も class も依存も足さない。退けた案: 脈を読みの途中の間だけ出す（読みは多くが 100 ミリ秒より短く、見えないほど一瞬で帯がちらつく）。見本と同じく更新の届いた時に 800 ミリ秒の beat を足す（計画の字は読みの途中の脈で、届いた時だけでは遅い読みの間に何も出ない）。脈を席の pill の記号に置く（home の頁には pill が無く、account board にも無い）。同じ記号が並ぶこと: home のほかの頁では、後の行 g-seatpill の席の pill（状態が run なら同じ class st-run の記号）が読み込み不良の印の後に並ぶ。脈は最終の記録の chip の直後に在り、輪は .8 秒と速く、読みの間と 800 ミリ秒だけ出て aria-hidden で読み上げない。pill の記号は 1.6 秒の輪で出続け、語 orchestrator と組なので、置き場と速さで見分けられる（見本も席の記号そのものに beat を足す）。
  - n: 4
    type: prose
    title: 行 g-seatpill — header の席の pill と席の card（home の頁のほか）
    body: |
      なぜ。見本（docs/design/mock3・判断の記録 ADR-7 で確定）の project board は、一番上の帯の mode の切り替えの前に席の pill（ui.js の関数 topHTML の span・class seatpill・tabindex 0・data-seat 1）を置き、関数 seatPillHTML で状態の記号（stIcon）と語 orchestrator（語の鍵 seat・class who）と、限度なら再開の時刻・応答なしなら最後の tick からの経過（class eta num・応答なしの色）を出し、指を置くと hover の card（関数 cardContent の data-seat の枝が関数 seatCard を呼ぶ）を出す。home の頁は block「orchestrator と口座」が同じ状態を出すので pill を外す（index.html の init の字 pill.remove）。本番の header に pill は無い（計画 surface-plan の 2 節の g の残りの header の席の pill）。計画の 9 節の行 g-seatpill（大きさ M・依存なし）は header の席の pill と席の card（home の頁のほか）を足すと決める。要件 FR12 は席の健康を出すことを、FR14 は hover の card の 4 行と「詳しく」の予算を決める。FR14 は card を出す要素を、頁を持つ節点の札・圧縮された cell・記号だけの要素の 3 種に限る。pill は記号だけの要素に当たる（語 orchestrator は状態の記号の名札で、stylesheet は 760px 以下で .seatpill .who を隠して記号だけにする・着地済みの読み込み不良の印〔fresh の mark・印の記号と語 WARN_WORD を持ち card を出す〕と同じ扱い）。
      在りか（main 43e8ba4 で確かめた）。面の src/frame.rs（書く・host でも組む・pub mod frame）の pub struct HeaderPart（pub な欄 part・key・class の &'static str と items の &'static str の slice）と pub const HEADER（4 つ・part は brand・nav・updated・mode の順）と pub const BACK（part back・key acct_back・class upto）と pub fn header_snapshot（BACK と HEADER のこの順の行を JSON の字にし、tests/snapshots/header.json と 1 字も違わないことを歯が見る・今は 9 行）。frame.rs の pub use crate::pages::PageId で、PageId は組み立ての script が src/pages の 5 つの file（ask・gaps・home・map・node）から生成する列挙（pub const ALL・pub fn id）。着地済みの歯は frame.rs に字 view!・Screen・Reading・Body・leptos（frame_one_module_per_block・枠は中身を持たない）と web_sys（acctwire）と PageId の Ask・Map・Gaps・Node の変種の名と字 fn nav_icon（hspage）が無いことを見るので、pill の中身は frame.rs に置けない。
      電文と読み手（書かない）。契約の型の crate の seat の pub struct SeatCard の pub な欄は at（組んだ時刻）・target（席の名）・state（SeatState の Run・Wait・Limit・Silent・Unknown）・since（今の状態になった時刻の Option）・tick_healthy と heartbeat（Reading の bool）・account と model（String の Option）・group（Reading の GroupRow・欄 group・account・candidates・next_account・remaining）・usage・spans・moves。状態は server の中核（core の seat の fn state_of）が決め、Limit は器の tick-last の最後の行の理由が account-pressed のとき、Silent は理由が state-stale（器の tick が席の状態の記録を古いと判じた）のときで、どちらも since はその行の ts（契約の型の doc は since を今の状態になった時刻とする）。電文に限度の再開の時刻の欄は無く（usage の窓ごとの resets_at は在るが、どの窓で限度になったかは電文に無い）、器の tick の最後の時刻も無い（tick_healthy は bool）。面の project の seat の module（src/project/seat.rs・書かない・pub mod project の生成した pub mod seat で host でも組む）の pub const PATH（字 /api/seat）と pub fn card（&Fetched を受け SeatCard か理由の &'static str・NotRead は project の NOT_READ・Failed は seat の REASON・電文に読めない本文は NO_CONTENT）と pub fn state_value（SeatState を run・wait・limit・silent・unknown の字に）と pub fn hmd（時刻と今を受け、同じ日なら時と分と Z・違う日は月日を前に付けた字）と pub fn band（Limit なら 1 行目に LIMIT_LINE、登録の口座が群の今の口座と違えば MOVE_WAIT と空白と 2 つの口座を字 → でつないだ字、在れば 2 行目に NEXT_TARGET と空白と次の移り先・平時は None）と pub const LIMIT_LINE・MOVE_WAIT・NEXT_TARGET・REASON。面の project の ask の pub fn age（今と時刻を受け、60 分未満は分と m・48 時間未満は時間と h と 2 桁の分〔0 分なら時間と h〕・それ以上は日と d・見本の durMs）。面の kit（project が再公開）の pub const UNKNOWN（字 unknown）と pub fn state_key（st_run ほかの語の鍵）と、wasm の target だけの pub fn state_icon（class st st-値・role img・aria-label は状態の語・limit は砂時計の svg）。account board の account の projects の pub fn orch_card は、同じ見本の seatCard を account board の session の表に写した card で、kind は状態の語と ◷ と時刻と から、value は 口座・tick・hb の並び、src は seat/席の名/state.jsonl ほか（この行の card はこの字に揃える）。面の widgets の hover の pub struct Card（pub な欄 title・kind・value・src の String と more の String の Vec）の pub fn rows は title・kind・value・src の 4 行を、pub const ROW_CHARS（36）を超えれば 35 字と字 … に切って返す（pub fn clip）。
      fixture（tests/fixtures/surface/seat-card.json・書かない・write-set の =・確かめた）は組の名から SeatCard への 5 組で、どれも at 1790510400・target tsuzuri-orch。run は since 1790502600・tick と heartbeat が Known の真・account acct-4・model opus・群の今の口座 acct-4・next_account acct-5。wait は since 1790508900・tick と heartbeat が Known の偽・account acct-4・model opus・群の今の口座 acct-5・next_account null。limit は since 1790503200・tick と heartbeat が Known の真・account acct-4・model opus・群の今の口座 acct-4・next_account acct-6。silent は since null・tick と heartbeat と group が unknown・account と model が null。unknown は since 1790510340・tick と heartbeat と group が unknown・account acct-4・model null。語の辞書（vocab.json・書かない）の見出しの語は seat が orchestrator・st_run が 動いている・st_wait が 待っている・st_limit が 限度で止まっている・st_silent が 応答なし・st_unknown が 測れていない。stylesheet（style.css・書かない・write-set の =）に規則 .seatpill（inline-flex の丸い枠）と .seatpill .who と .seatpill .eta（限度の色の太字）と、760px 以下で .seatpill .who を隠す規則と、色の変数 --st-silent が在る。
      形（src/seatpill.rs・新しい file）。host の部分に pub const ETA_STYLE（字 color:var(--st-silent)・見本の eta の style）と pub struct Pill と pub fn pill と pub fn card を置き、電文を決めずに写す。pill は project の seat の card が Err なら state を UNKNOWN・eta を None に、Ok なら state を state_value に電文の state を渡した字、eta を電文の state が Silent で since が在るときだけ ask の age に今と電文の at の大きい方と since を渡した字にする（応答なしになった時からの経過・見本の応答なしの eta は管理の tick の最後の時刻からの経過〔関数 seatStatus と seatPillHTML〕だが、電文にその時刻は無く、Silent の since がその判じの時刻なので、それを使う。限度の再開の時刻は電文に無いので、見本の限度の eta は出さない）。card は Err なら title を語の鍵 SEAT.key の語・kind を st_unknown の語・value を理由の字・src を seat の PATH・more を空に、Ok なら title を SEAT.key の語、空白、字 ·、空白、電文の target の順につないだ字、kind を状態の語（電文に since が在れば続けて、空白、字 ·、空白、字 ◷、空白、hmd に since と電文の at を渡した字、空白、字 から）、value を字 口座、空白、電文の account（無ければ ?）、空白、字 ·、空白、字 tick、空白、tick_healthy の healthy か stale か ?（Known の真・Known の偽・Unknown）、空白、字 ·、空白、字 hb、空白、heartbeat の on か off か ? の順につないだ字、src を字 seat/ と target と字 /state.jsonl ほか、more を字 model と空白と電文の model（無ければ ?）の 1 行と、band が Some ならその l1 の行と l2 の行をこの順に足した列にする。wasm の target だけの mod dom に pub fn view（AnyView を返す）を置き、pub use dom::view; で外に見せる。view は crate::net::read(seat::PATH) の読みと crate::net::ticker() を読み、Memo で pill を組み（ticker の毎秒に電文を decode し直す・電文は数 KB で、home の頁の席の block も同じ口を読む）、span（class は SEAT.class・tabindex 0・data-seat 1）の中に kit の state_icon（状態の Memo が変わった時だけ組み直す）と span（class who・字は SEAT.key の語）と、eta が在る間だけ span（class eta num・style は ETA_STYLE）を置き、mouseenter で hover の delegate の show にその時の card を、mouseleave で leave を撃つ（行 g-fresh の読み込み不良の印と同じ形）。
      形（frame.rs と lib.rs と board.rs と snapshot）。frame.rs に pub const SEAT（part seat・key seat・class seatpill・items 空）と pub fn seat_shown（page が PageId の Home でなければ真）を足し、header_snapshot は HEADER の part が mode の部品の前に SEAT を挟む（BACK・brand・nav・updated・seat・mode の順・10 行）。HEADER の表は変えない（着地済みの歯 frame_home_blocks_in_order_and_map_page と acctwire_back_part_before_header と topbar_updated_part_is_a_num_chip_keyed_last_record が HEADER の並びと updated の部品を見る）。tests/snapshots/header.json は updated の行の後に seat の行を 1 つ足す。lib.rs は行 pub mod project; の後に doc の行と行 pub mod seatpill; を足す（cfg の属性を付けない）。board.rs は use に crate::seatpill を足し、fn top の部品 updated の腕で、let pill = frame::seat_shown(page).then(seatpill::view); の形で値を組み、view の {fresh::mark()} の後に {pill} を置く（mode の切り替えの部品の前・見本の順）。account board と語の辞書と stylesheet と電文と中核と境界は書かない。
      着地済みの歯。tests/hspage.rs の hspage_header_lines_same は header_snapshot の行の数を 9 と見るので、10 に直す（write-set に書く file として置く・file のほかの字と hspage_ のほかの歯は変えない）。tests/hsderive.rs の hsderive_drops_old_copy は tests/hspage.rs の字に frame.json が無いことを見る（直しは 1 字の数だけで保つ・write-set の =）。直さずに通る歯（write-set の =）: tests/frame.rs の frame_snapshot_matches_file と tests/acctwire.rs の acctwire_back_part_before_header は header_snapshot と書き直した snapshot の file を比べ（acctwire は 2 行目が back・3 行目が brand の行とも見る・変わらない）、frame_one_module_per_block は frame.rs に中身の語が無いこと（足す字は SEAT と seat_shown と snapshot の字だけ）、frame_classes_are_in_stylesheet は src の全部の file の class の字の値（足す who と eta と num は stylesheet に在る）、frame_no_heading_words_in_code は見出しの語を二重引用符で囲んだ字の無さ（seatpill.rs の字は語の鍵で引く）を見る。tests/topbar.rs は HEADER の updated の部品。tests/flight.rs・gfresh.rs・mstore.rs・hsblock.rs は lib.rs の pub mod flight;・fresh;・store; の前の行が cfg でないことと、pub mod board; と pub mod net; の前の行が wasm の cfg であることを見る（足す行はどれの前でもない）。board.rs を読む歯（brand・ptitle・ncard・lcard・smore・mstore・hsblock・gfresh）は、この行が消さない字を見る。同じノートの行 g-pulse の歯 tests/gpulse.rs（この行の前に着地する・main にはまだ無いので write-set と verify に置かず xtask の check が撃つ）は board.rs の fn top の fresh::pulse() が最終の記録の span の後で fresh::mark() の前に在ることを見る（足す字 {pill} は fresh::mark() の後なので並びは変わらない）。tests/parts.rs は src の二重引用符の /api/ の字が口の module に 1 度（seatpill.rs は seat の PATH を使い字を持たない）。tests/aord.rs は src の字 decode::<AccountDoc> の 1 か所（seatpill.rs は decode を書かない）。frame の pub な item を使うほかの歯の file（acctframe・acctled・acctpop・acctproj・acctwin・askcard・batchpanel・bport・gapspage・graphnav・hcproj・hnunk・kcardlink・maplink・mapview・nact・nextact・nodepage・ntime・pfold・projmore・tipx の 22）は、この行が足す SEAT と seat_shown を使わず、既存の item の値は変わらないので期待は動かない（xtask の check が撃つ）。
      測り方。新しい歯は面の crate の tests/gpill.rs に置き、名を gpill_ で始める。fixture の電文は契約の型の wire の decode で読み（組の名から SeatCard）、歯の中で silent の組の since を替える。pill と card は host の値で見る。時刻の字は面の project の seat の hmd を撃った値と比べ、字で固めない（後の行 g-jst が時刻の字を替えても直さずに通る）。board.rs と seatpill.rs の DOM は wasm の target だけで組むので、字の歯と xtask の surface-build と check（wasm の clippy を含む）で見る。関数の本文は字 fn 名( から次の行頭の fn・pub fn・async fn・pub async fn の前まで。自分の名の歯は tests/gpill.rs の字を読み、test の属性の行の次の fn の名を全部集める。試作（席の作業場の写しの main 7d633b6〔crate と fixture の字は 43e8ba4 と同じ〕の上に行 g-pulse を置いた木に同じ形を書いた）で、gpill_ の 6 本と面の crate の着地済みの歯の全部と host と wasm の clippy が通った。
      filter の語（main の契約表の全部の行〔着地済みの行と契約だけの行〕の verify の filter の語と、計画の後の行 g-gz の接頭辞 pgz_ と、同じノートのほかの 2 行の接頭辞 gpulse_ と gbnote_ を並べ、この行の接頭辞 gpill_ は並べず、ほかの語を部分の字として含む語は省いた）は aaround_・accept_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadopt_・cgdom_・cmark_・contract_form_・cround_・csled_・denv_・ecache_・flight_・fmark_・frame_・fserve_・fstop_・gapspage_・gbnote_・gfresh_・ghb_・glabel_・gnav_・gpulse_・graph_・gsum_・gtuck_・gview_・hacols_・hbconf_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hspage_・hsym_・iclose_・ilink_・kcli_・klink_・launch_・lcard_・ledgerblock_・lhome_・lspark_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・parts_・pclosed_・pfold_・pgz_・pipe_・plimit_・pmore_・pquest_・project_・ptitle_・punmap_・pwhole_・qblock_・qgate_・qkey_・question_・relay_・rhold_・runsdoc_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・stcli_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_ で、新しい歯の名から先頭の gpill_ を除いた字は、このどれも部分の字として含まない（例 gpill_frame_x・gpill_seatcard_x は不可）。名は done に書いた gpill_part_and_pages・gpill_snapshot_line・gpill_state_and_eta・gpill_card_rows・gpill_board_text・gpill_own_names_clean（どれも並べた語を含まない）。
      依存と順。depends は同じノートの行 g-pulse（board.rs を先に書き、歯 tests/gpulse.rs を作る）。この行の後に同じノートの行 g-back-note（board.rs と frame.rs）を流す。順はノートの depends と便の bead の依存で持つ（器は走行中の行と write-set が = を含めて重なる行を断る）。計画の 5 節の鎖は board.rs が g-nav → g-pulse → g-seatpill → g-back-note → g-coach、frame.rs が g-nav → g-seatpill。まだ契約の行の無い g-nav がこの行より先に便の bead を持つなら、この行の便の bead を g-nav の便の bead に依存させる（g-nav が fn top の page を signal にすれば、seat_shown はその値で読む）。lib.rs は着地済みの g-reads と g-fresh の後で、計画の 5 節の lib.rs の鎖にこの行を足す（席が計画を直す）。src/project/seat.rs と project_dom/seat.rs と vocab.json は書かないので、g-jst と c-seat-tick ほかの鎖に掛からない。別のノートの契約だけの行 e-revoke（ノート surface-wave12d）とは = の歯の file（tests/frame.rs・parts.rs・ptitle.rs・hsderive.rs）が重なるので同時に流さない（待ちの解けた方を先に・順は便の bead の依存で持つ）。外の依存は足さない。
      決定はしご（条 P-27）と作法 7。要るか: 要る（見本の header の部品で、home のほかの頁で席の状態が見えない）。既に在るか: 席の電文と読み手と状態の記号と card の層は在り、header の部品と pill の DOM は無い。面は判定を書かず、電文の state・since・account・model・tick_healthy・heartbeat・group をそのまま写し、数は電文に在るものだけを出す。電文に無い見本の値（限度の再開の時刻・見本の card の tick の行の経過の秒と健全の上限の秒〔関数 tickHealth と TICK_RULES〕・経験者の doctor の行・mock の heartbeat の切り替え）は出さない（tick の経過は後の行 c-seat-tick、移動の猶予と待ちは c-seat-grace の電文の欄から足せる）。limit の詳しくの 1 行目は seat の LIMIT_LINE（字 限度で止まっている（↻ の時刻に再開する））で、着地済みの席の block の帯と同じ字を使う。↻ の時刻は席の block の使用量の行（project_dom の seat.rs の窓ごとの ↻ と resets_at）にだけ在り、この card には出さない。中身を frame.rs に置かず新しい module にするのは、着地済みの歯が枠に中身の語を断るため（project の seat.rs に置けば g-jst と c-seat-tick ほかの鎖の file を書くことになる）。退けた案: HEADER に seat の部品を足す（着地済みの歯 3 本が HEADER の 4 つの並びを見るので直す file が増え、BACK と同じく HEADER の外の部品にすれば足りる）。
  - n: 5
    type: prose
    title: 行 g-back-note — 窓を閉じられないときの戻るの注記と、開いた窓の一覧の閉じの印
    body: |
      なぜ。要件 FR1 は、project board の「戻る」が自分の窓を閉じて account board へ戻ると決める。browser は script が開いた窓でない窓（持ち主が URL を打った窓・表示面が起こした app mode の窓ほか）の window の close を黙って無視するので、今の本番は押しても何も起きないように見える。見本（docs/design/mock3・判断の記録 ADR-7 で確定）の ui.js の関数 backToBoard は、close の 300 ミリ秒の後に window の closed が偽なら、header の直後に要素（id winnote・class winnote・role status）を置き、太字の語 win_close_hand（この窓は手で閉じてください）と、小さい薄い字（class small muted）で窓を探した結果（front は account board の窓は前面に出した・opened は account board を新しい窓で開いた・blocked は account board の窓を開けなかった〔popup の許可が要る〕）と字 ・この窓は script が開いた窓でないので閉じられない を出す。計画 surface-plan の 9 節の行 g-back-note（大きさ S・依存なし）は、この注記と、開いた窓の一覧の閉じの印を足すと決める。
      在りか（main 43e8ba4 で確かめた）。面の src/board.rs（書く・wasm の target だけ）の fn back_to_board（引数なし）は、window の open_with_url_and_target に空の URL と account の windows の ACCOUNT_WIN（字 tz-account）を渡し、account_open を「窓が返り、その location の href が読めて board.rs の私の const BLANK（字 about:blank）でない」ときの真にし、frame の back_steps（account_open）の段を撃つ（Front は窓の focus・OpenNew は空の窓の location にこの頁の origin と pathname と段の URL をつないだ字を置いて focus・CloseSelf は自分の window の close）。fn top の BACK の button は on:click で back_to_board() を撃つ。close の後に閉じたかを見る所も注記も無い。frame.rs（書く・host でも組む）の pub enum BackStep（Front・OpenNew の &'static str・CloseSelf）と pub fn back_steps（真なら Front と CloseSelf・偽なら OpenNew の ACCOUNT_URL〔字 ?board=account〕と CloseSelf）と pub const ACCOUNT_URL は変えない。語の辞書（vocab.json・書かない）の鍵 win_close_hand の見出しの語は この窓は手で閉じてください、stylesheet（style.css・書かない・write-set の =）に規則 .winnote（折り返す flex・限度の色の縁）と .small と .muted が在る。
      別の origin の窓（この行の直し）。account board と各 project board は同じ host の違う port で配られる（account の windows の open_url は電文の board の port で project board を開く・src/store.rs の doc は保存が origin ごとと書く）。窓の名で返った account board の窓が別の origin なら、その location の href は読めない（browser が誤りを返す）ので、今の account_open は偽になり、段は OpenNew になって、開いている account board の窓をこの project board の origin の ?board=account へ移してしまう（開いた窓の一覧の handle が消える）。見本は href が読めない時を空でない窓（前面へ）と見るので、この行は back_how で見本に揃え、href が読めない窓を Front にする（窓が返らなければ Blocked・href が about:blank なら Opened）。
      開いた窓の一覧の閉じの印。見本は戻るで browser の保存の tz-wins の自分の project の項に閉じた時刻を書き、account board の一覧がそれを閉じたと出す。本番では保存が origin ごとで、project board が書いた保存を別の port の account board は読めない（src/store.rs の doc）。account board の窓の一覧（src/account/windows.rs・行 h-win で着地済み・書かない・write-set の =）は、自分が開いた窓の handle を持ち、mod dom の fn sweep を 1 秒ごと（const SWEEP・fn open が set_interval で張る）に撃って handle の closed が真の窓を after_close で閉じたにし（state_word は 閉じた・row_class は w-closed・state_mark は wait・stylesheet の .wins > li.w-closed .ttl が字を薄くする）、戻るの close が効いた窓は 1 秒の内に閉じたと出る。close が効かない窓は開いたままなので閉じたと出さないのが正しい。account board を読み直した後の一覧を残すのは計画の行 h-win-store（保存）。そこでこの行は保存に書かず、一覧の閉じの印が着地済みの一覧から出ることを歯で見る（gbnote_list_closed_mark）。残る穴: account board を読み直すと、前に開いた窓の handle は消える（WinState は Open と Closed の 2 つだけ）。見本はその窓を nohandle（開いたはず・この窓の reload で handle なし・account/index.html の関数 drawWins）と出す。h-win-store の保存は一覧を戻すが閉じたことは知らないので、読み直した後に閉じた窓の閉じの印はこの行でも h-win-store でも付かない（席の問いに置く）。
      形（frame.rs）。pub const BLANK と pub enum BackHow と pub fn back_how（(偽, 何でも) は Blocked・(真, BLANK) は Opened・ほかの (真, 何でも) は Front）と pub const BACK_NOTE_MS（300）と BACK_NOTE（winnote）と BACK_NOTE_KEY（win_close_hand）と pub fn back_note（結果の字と字 ・この窓は script が開いた窓でないので閉じられない をつなぐ）を足し、doc の行に行 g-back-note を足す。字 view!・Screen・Reading・Body・leptos・web_sys と PageId の変種の名は書かない（枠の歯）。
      形（board.rs）。私の const BLANK を消し（frame の BLANK へ移す）、use に std の time の Duration と frame の BackHow を足す。back_to_board は引数 note（RwSignal の BackHow の Option）を受け、窓の location の href を .href().ok() で Option にして let href に置き、frame::back_how(win.is_some(), href.as_deref()) を how に置き、段は back_steps に how が Front かを渡す。CloseSelf の段は close の後に set_timeout で BACK_NOTE_MS を待ち、window の closed が偽（読めなければ真と見る）なら note に how を置く。fn top は RwSignal の note（None）を作り、BACK の button の on:click で back_to_board(note) を撃ち、返す view を header の要素の直後に {move || note.get().map(back_note)} を置く形にする（note が Some の間だけ fn back_note の view）。fn back_note は div（class は frame の BACK_NOTE・role status）の中に b（BACK_NOTE_KEY の語）と span（class small muted・字は frame の back_note）を置く。見本の要素は id winnote も持つが、本番に id で引く所は無いので id は付けない。App と HEADER と snapshot と語の辞書と stylesheet と account board は書かない。
      着地済みの歯（直さずに通る・write-set の =）。tests/acctwire.rs の acctwire_back_steps は back_steps と ACCOUNT_URL と account の selects を、acctwire_back_part_before_header は BACK と HEADER と snapshot と board.rs の字 frame::back_steps( と open_with_url_and_target と二重引用符 2 つと ACCOUNT_WIN の並び・BackStep::CloseSelf・me.close()・class=BACK_WRAP・class=BACK.class と lib.rs の board の cfg と frame.rs の web_sys の無さを見る（どれも保つ）。tests/frame.rs の frame_ は frame.rs の中身の語の無さと src の class の字の値（足す small と muted は stylesheet に在る）と見出しの語の字の無さ（注記の語は鍵で引く）。tests/hspage.rs は frame.rs と board.rs の PageId の変種の名の無さと snapshot。board.rs を読む歯（brand・ptitle・ncard・lcard・smore・mstore・hsblock・gfresh）は、この行が消さない字を見る。同じノートの前の 2 行の歯 tests/gpulse.rs と tests/gpill.rs（この行の前に着地する・main にはまだ無いので write-set と verify に置かず xtask の check が撃つ）は fn top の本文の字 title=title>{at}</span>・fresh::pulse()・fresh::mark()・frame::seat_shown(・seatpill::view・{pill} と、その並びを見る（この行はどれも保つ・fn top の後に足す fn back_note は字下げ 0 の fn なので、関数の本文の見方の終わりになるだけ）。tests/parts.rs と aord.rs は src の全部の file の字（足す字に /api/ と decode は無い）。frame の pub な item を使うほかの歯の file（acctframe・acctled・acctpop・acctproj・acctwin・askcard・batchpanel・bport・gapspage・graphnav・hcproj・hnunk・kcardlink・maplink・mapview・nact・nextact・nodepage・ntime・pfold・projmore・tipx・topbar の 23）は、この行が足す item を使わず、既存の item（back_steps・ACCOUNT_URL・HEADER ほか）の値は変わらないので期待は動かない（xtask の check が撃つ）。
      測り方。新しい歯は面の crate の tests/gbnote.rs に置き、名を gbnote_ で始める。back_how と back_note と back_steps と account の windows の after_close ほかは host の値で見る。board.rs の DOM と window の撃ちは wasm の target だけで組むので、字の歯と xtask の surface-build と check（wasm の clippy を含む）で見る（閉じられない窓の注記の実物は傘の行 j の browser の runner の後）。関数の本文は字 fn 名( から、字下げの同じ次の fn・pub fn の行の前まで（board.rs は字下げ 0・windows.rs の mod dom は字下げ 4）。自分の名の歯は tests/gbnote.rs の字を読み、test の属性の行の次の fn の名を全部集める。試作（席の作業場の写しの main 7d633b6〔crate と fixture の字は 43e8ba4 と同じ〕の上に行 g-pulse と g-seatpill を置いた木に同じ形を書いた）で、gbnote_ の 4 本と面の crate の着地済みの歯の全部と host と wasm の clippy が通った。
      filter の語（main の契約表の全部の行〔着地済みの行と契約だけの行〕の verify の filter の語と、計画の後の行 g-gz の接頭辞 pgz_ と、同じノートのほかの 2 行の接頭辞 gpulse_ と gpill_ を並べ、この行の接頭辞 gbnote_ は並べず、ほかの語を部分の字として含む語は省いた）は aaround_・accept_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadopt_・cgdom_・cmark_・contract_form_・cround_・csled_・denv_・ecache_・flight_・fmark_・frame_・fserve_・fstop_・gapspage_・gfresh_・ghb_・glabel_・gnav_・gpill_・gpulse_・graph_・gsum_・gtuck_・gview_・hacols_・hbconf_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hspage_・hsym_・iclose_・ilink_・kcli_・klink_・launch_・lcard_・ledgerblock_・lhome_・lspark_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・parts_・pclosed_・pfold_・pgz_・pipe_・plimit_・pmore_・pquest_・project_・ptitle_・punmap_・pwhole_・qblock_・qgate_・qkey_・question_・relay_・rhold_・runsdoc_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・stcli_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_ で、新しい歯の名から先頭の gbnote_ を除いた字は、このどれも部分の字として含まない（例 gbnote_frame_x・gbnote_acctwin_x は不可）。名は done に書いた gbnote_how_and_note・gbnote_board_text・gbnote_list_closed_mark・gbnote_own_names_clean（どれも並べた語を含まない）。
      依存と順。depends は同じノートの行 g-seatpill（board.rs と frame.rs を先に書き、歯 tests/gpill.rs を作る・その前に g-pulse）。順はノートの depends と便の bead の依存で持つ（器は走行中の行と write-set が = を含めて重なる行を断る）。計画の 5 節の鎖は board.rs が g-seatpill → g-back-note → g-coach で、g-coach はこの行の後に流す。src/account/windows.rs は = で持ち書かないが、器は = も重なりとして持つので、それを書く計画の行 h-win-store とは同時に流さない（待ちの解けた方を先に・順は便の bead の依存で持つ）。別のノートの契約だけの行 e-revoke（ノート surface-wave12d）とは = の歯の file（tests/frame.rs・parts.rs・ptitle.rs）が重なるので同時に流さない（待ちの解けた方を先に・順は便の bead の依存で持つ）。外の依存は足さない。
      決定はしご（条 P-27）。要るか: 要る（閉じられない窓で戻るが何も起きないように見える・別の origin の account board の窓が移される）。既に在るか: 段の列と窓の一覧の閉じの印は在り、注記と close の後の確かめは無い。足す物は frame の純粋な値と、board の timer 1 つと div 1 つで、語も class も依存も足さない。退けた案: 見本どおり保存の tz-wins に閉じた時刻を書く（origin ごとの保存で account board に届かず、close が効かない窓まで閉じたと書く）。窓を閉じられない時に location を account board へ移す（持ち主が見ていた頁が消え、account board が 2 つになりうる）。

