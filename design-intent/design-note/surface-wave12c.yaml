sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      見本 mock v3 の project board の一番上の帯に揃える 3 行（計画 surface-plan の 5 節の board.rs の鎖の g-pulse → g-seatpill → g-back-note）。
      読みの途中（1 つでも口が読みの途中）は、2 つの board の最終の記録の chip の直後に短い脈（見本の tz-pulse を beat で速めた動いているの記号）を出し、読みが終わってから 800 ミリ秒で消す（g-pulse・持ち主の裁定 t3-hub.52.39）。
      home のほかの頁は mode の切り替えの前に席の pill（状態の記号と語 orchestrator と、応答なしの経過）を置き、指を置くと席の card を出す。中身は口 /api/seat の電文を写すだけで、電文に無い見本の値は出さない（g-seatpill）。
      戻るで自分の窓を閉じられなかったときは一番上の帯の直後に注記を出し、別の origin の account board の窓を移さず前面に出す。開いた窓の一覧の閉じの印は着地済みの account board の窓の一覧が出す（g-back-note）。
      電文と中核と境界と語の辞書と stylesheet と Cargo.toml は書かない。
