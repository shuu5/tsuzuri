    title: 行 h-popstate — account board の tab の履歴と戻る
    body: |
      なぜ。見本の account board は tab を押すと頁を読み直さずに切り替えて履歴に積み（history の pushState）、戻ると進むで popstate を受けて tab と 3 つの並べ方を URL から戻す（docs/design/mock3/account/index.html の 350〜356 行の setTab と tab の link の押しと popstate）。本番の tab の link は href だけの a で、押すたびに頁を読み直す。読み直しで、開いている窓の一覧（account の windows.rs が頁の一生の間だけ持つ）と行の詳しくの開きが消え、口を読み直す。popstate を受ける所も無い。要件 FR1 は account board の 3 つの tab を、要件 NFR1 は切り替えが URL に残ることを言う。
      在りか（着地済み・確かめた）。src/account/board.rs（191 行）は account の mod.rs の wasm の target のときだけの pub mod board で、host では組まない。pub fn mount（窓の名を windows の ACCOUNT_WIN に・document の title を page_title に・mount_to_body に App）。fn search（今の URL の query・読めなければ空）。fn keep_mode_in_url（frame の with_param で mode を替えた URL を history の replace_state_with_url で置く）。App は tab を Tab::from_query(&query) で頁の初めに 1 度だけ決め、mode を RwSignal に Mode::from_query(&query) で持ち、HelpCtx と HoverCtx を provide_context に渡し、net の read に PATH を渡し、view で top(tab, mode, read, updated)・main（class page）の中の page_view(tab)・TipLayer・CardLayer を並べる。top の nav は tab_links(tab) の link ごとに a（href は tab_href(l.tab, mode.get())・class は l.class で今の tab だけ on・data-tab・data-v・data-term）を置く。page_view は page(tab) の段ごとに block_view を呼び、block_view は home::view(block)・windows::view()・session::view()・ledger::view()・projects::view() を選ぶ。
      src/account/mod.rs（361 行・host でも組む）。Tab（Home・Session・Projects・ALL・id・key・from_query は tab の値が session と projects のときだけその tab でほかは Home）・pub fn tab_href（Tab と Mode を受け、字 ?board=account&tab= と id と &mode= と mode の key）・selects（board の値が account のときだけ真）・tab_links（今の tab の link の class が on）・HEADER・page・pages・doc・pending・need_count・stuck_count・badge・snapshot。use に crate::frame の Block・Mode・STACK・param が在る。frame の pub fn with_param（query・鍵・値を受け、同じ鍵の最初の値を替え、無ければ末尾に足し、ほかの値と順を残し、? で始まる字を返す）は host でも組む。
      block は組むときに今の URL から並べ方を読む（確かめた）。session の view は search() の字を sort_of と span_of に渡し、ledger の view は sort_of に、projects の view は psort_of に search() の字を渡して RwSignal を作る。並べ方の押しは replace_state_with_url で今の履歴の URL を書き換える（履歴を積まない）。開いている窓の一覧は windows.rs の thread_local の signal で頁の一生の間ずっと持つ（block を組み直しても残る）。
      leptos の ev::popstate と window_event_listener は project の map.rs（72 行）が既に使い、PopStateEvent の feature は leptos が入れる。history の push_state_with_url（feature History）・MouseEvent の ctrl_key と meta_key と shift_key（feature MouseEvent）・Event の prevent_default（feature Event）・Window の scroll_to_with_x_and_y（feature Window）は Cargo.toml の web-sys の feature に在る。
      形（mod.rs）。pub fn tab_url（今の URL の query の &str と Tab を受け String）を足し、frame の with_param に query と鍵 tab と Tab の id を渡した字を返す（tab を押したときに履歴に積む URL・board・sort・lsort・psort・span・mode は残る・見本の setTab の searchParams の set と同じ）。module の doc に 1 行足す。tab_href と tab_links と snapshot は変えない。
      形（board.rs）。App は頁の今の URL の query を RwSignal の String に持ち（最初の値は search()）、今の tab をその signal から Tab::from_query で導く。main の中身は move || page_view( で始まる closure にし、query の signal が変わるたびに今の tab の block を組み直す（block は組むときに URL の並べ方と幅を読むので、戻った履歴の並べ方が出る）。window_event_listener(ev::popstate, …) で popstate を受け、search() の字を query の signal に置き、mode を Mode::from_query に同じ字を渡した値に置く（mode の切り替えは replace_state で今の履歴の URL に残るので、戻った履歴の URL の mode に戻す・URL が状態の正）。受け手は on_cleanup で外してよい。nav の link は href を今の tab_href のまま置き（新しい窓や tab で開く押しのため）、押されたとき、ctrl_key() か meta_key() か shift_key() が真なら何もせず（browser の既定のまま）、ほかは prevent_default() を呼び、tab_url(&search(), 押した tab) の字を history の push_state_with_url で積み、query の signal に置き、window の scroll_to_with_x_and_y(0.0, 0.0) で上端へ戻す（見本と同じ）。nav の link の class（今の tab だけ on）と aria-current（今の tab だけ page）は今の tab の signal から決める。mount・keep_mode_in_url・top の brand と mode と最終の記録の chip・block_view は変えない。
      並べ方の押しを履歴の 1 歩にする（見本の setSort と setParam の pushState）のは、session.rs・ledger.rs・projects.rs を書くので後の行にする。この行の後も、並べ方の押しは今の履歴の URL を書き換えるので、戻ると進むで出る並べ方はその履歴で最後に選んだもの。行の詳しくの開き（ledger.rs の記録）は URL に無い頁の中の状態なので、block を組み直すと mode の既定に戻る。
      着地済みの歯（直すもの）。無い。
      着地済みの歯（直さずに通る・write-set の外・tests の下の全部を grep で確かめた）。acctframe_tabs_and_links は Tab の id と key と from_query と tab_href の字を見る（変えない）。acctframe_ のほかの歯は src/account の file の名の列（8 つ・この行は file を足さない）と、mod.rs の字「mod dom {」より前に view! が無いこと（tab_url は純粋な関数）と、mod.rs の字に crate::net::read(PATH) と pub use tsuzuri_contract::account::PATH; が在ることと、src/account に /api/ と保存の口の字が無いことと、枠の snapshot（tests/snapshots/acctframe.json と account の snapshot の字・HEADER と page から組む）を見る（どれも変えない）。acctlook_mount_sets_page_title は board.rs の字 pub fn mount から次の字 fn までに set_title( と page_title() と mount_to_body が在ることを、acctwin_no_storage_and_wasm_wiring は mount の本文に set_name(windows::ACCOUNT_WIN) が在ることと保存の口の字の無さを見る（mount は変えない）。accthome_ の歯は board.rs の字に home::view(block) が在ることを見る（block_view は変えない）。frame_classes_are_in_stylesheet と frame_no_heading_words_in_code（この行は class の字と見出しの語の字を足さない）。acctwire_ の歯が読むのは root の board.rs と frame.rs と lib.rs で、この行は触らない。
      測り方。新しい歯は tests/acctpop.rs に置き、名を apop_ で始める。tab_url の歯の 4 つの query は A = ?board=account&tab=session&sort=stage&lsort=net&psort=group&span=6h&mode=expert・B = ?board=account&mode=beginner・C = ?board=account&tab=home&sort=elapsed&span=3h・D = 空の字で、A と 3 つの tab・B と 3 つの tab・C と 3 つの tab・D と 3 つの tab の 12 の組を見る。board.rs は全部が wasm の target のときだけなので、歯は CARGO_MANIFEST_DIR から board.rs の字を読み、DOM は xtask の surface-build で組めることで見る。
      filter の語。着地済みの 49 の語（accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_）と、同じ波の行の接頭辞 mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・brand_・runsdoc_・nbatch_ の 16。自分の接頭辞 apop_ はこの列に入れない。新しい歯の名から先頭の apop_ を除いた字は、このどれも部分の字として含まない（例 apop_account_x・apop_frame_x・apop_board_min_x は不可）。
      依存は足さない。Cargo.toml・vocab.json・style.css は触らない。
  - n: 8
    type: prose
    title: 行 g-brand — project board の題の字と頁の題を project の名にする
    body: |
      なぜ。project board の header の題の字は面の frame の BRAND（字 tsuzuri）の固定で、scribe2 や folio2 の repo で立てた board も tsuzuri と出る（台帳 t3-hub.52.2）。頁の題も index.html の固定の字（tsuzuri と長い横棒と project board）だけ。見本（mock3 の ui.js の 879 行の topHTML）の題の字は、その board の project の名。名を起動の引数 --repo の dir の名から実行の時に取れば、tracked な file に project ごとの字も host の字も書かずに済む（行 D-4）。頁ごとの題（名と頁の語）は後の行 g-title が、この行の board_title を直して足す。
      在りか（HEAD 03435c3 で確かめた）。面: src/frame.rs の pub const BRAND（&str・字 tsuzuri・wasm の target に限らない・この行は frame.rs を書かない）。src/board.rs は lib.rs の wasm の target のときだけの pub mod board で、fn top（引数 page の PageId・mode の RwSignal の Mode・screen の RwSignal の Screen）が HEADER の部品を part の名で描き分け、part が brand の腕は a の要素（class は部品の class の brand・href は home への link・aria-label は語の鍵 project の語）の中に題の印 LOGO の span と、class の値が name の span を置き、その中身は今 BRAND の字（波括弧で囲んだ BRAND）。class の brand と name は stylesheet に在る（見本の ui.css の写しの .brand の規則と .brand .name の規則）。src/net.rs（wasm の target のときだけ・この行は書かない）の pub fn read（path の &'static str を受けて ReadSignal の Fetched を返す）は初めての path を登録して 1 回読み、読み直しの合図で登録した口を全部読み直し、知らせが切れると登録した口を全部 Failed にする。src/view.rs（wasm の target に限らない）の pub enum Fetched は NotRead・Body（本文の String）・Failed の 3 値で、view.rs は契約の型の crate の wire を既に use している。account board は src/account/board.rs の mount で自分の題（account の page_title・字 器 — account board）を置き、main.rs は URL の query の board で account board か project board のどちらか 1 つだけを載せるので、project board の題を置いても account board の題は変わらない。index.html の 6 行目の title の字は tsuzuri・空白・長い横棒（U+2014）・空白・project board。
      在りか（境界と契約の型）。口は src/server/routes の下に 1 口 1 file（形の見本は routes/seat.rs・server の中だけの可視性の const ROUTE の Entry の key に method GET と Match の Exact の path・handle は Request の参照と Shared の参照を受けて Response を返す関数）。組み立ての script（build.rs）が dir の file の名から列挙 Route を生成するので、file を足すだけで列に載る（build.rs と route.rs と server の mod.rs は書かない）。Shared（server の mod.rs の非公開の struct）の欄 sources は server の board の pub struct Sources で、その pub な欄 ledger（server の ledger の pub struct Source）の pub な欄 repo（PathBuf）は起動の引数 --repo の字のまま（main.rs は PathBuf::from で Config::new に渡し canonicalize しない・Server::bind は dir でない repo を断る）。口の file は server の mod.rs の非公開の fn json（状態の数と wire の encode の結果を受けて Response）と http の pub fn Response::text（状態の数と &str）を crate::server の path で呼べる（子の module から親の非公開の item と Shared の欄は見える・routes/pipeline.rs が同じ形で shared.sources を読む）。契約の型の crate の lib.rs は pub mod の行を手で書く（今は account・board・graph・ledger・question・seat・stats・surface の 8 つ）。依存は serde（derive つき）と serde_json で、wire の pub fn encode と decode が在る。
      形（契約の型）。src/project.rs を足し、lib.rs の ledger の行と question の行の間に pub mod project の 1 行を足す。project.rs は pub const PATH（&str・字 /api/project）と pub struct ProjectName（pub な欄 name の String だけ・derive は Debug・Clone・PartialEq・Eq・Serialize・Deserialize・rename を置かない）を持つ。名 proj-kiri の電文の字は、開き波括弧・引用符で囲んだ name・コロン・引用符で囲んだ proj-kiri・閉じ波括弧（空白なし）。
      形（境界）。src/server/routes/project.rs を足す（Route の変種 Project・名 project）。ROUTE の key は method GET と Exact の契約の型の crate の project の PATH（口の file に引用符の /api/ の字を書かない）。handle は shared の sources の ledger の repo を canonicalize し（できなければ repo のまま）、その path の最後の名が在り UTF-8 の字なら ProjectName の電文を json で 200、無ければ Response::text で 503 と字 no-name を返す（台帳の bd も設計の索引も読む要は無い）。
      形（面）。view.rs に pub const BOARD_WORDS（&str・字 project board）と 3 つの pub fn を足す（どれも wasm の target に限らない）。kept_name（before の Option の String と fetched の Fetched の参照を受けて Option の String を返す）は、fetched が Body で本文を wire の decode で ProjectName に読めて name が空でなければ Some の name、ほかは before を返す。brand（name の Option の &str を受けて &str を返す）は name が在ればそれ、無ければ frame の BRAND を返す。board_title（name の Option の &str を受けて String を返す）は brand の字・空白・長い横棒（U+2014）・空白・BOARD_WORDS をつないだ字を返す（None なら index.html の title と同じ字）。board.rs は use の行に tsuzuri_contract::project::PATH as PROJECT_PATH を足し（面の crate の project の module は block の列なので別名で取り込む）、net::read(PROJECT_PATH) の読みの結果が変わるたびに名の signal（RwSignal の Option の String）を kept_name で進め、名の signal が変わるたびに document の set_title に board_title の字を渡し、brand の腕の class の値が name の span の中身を brand の呼びの字にする（一度読めた名は、知らせが切れて読みが Failed になっても次に読めるまで持ち続け、読めるまでと 503 の間は BRAND を出す）。frame の use の並びから BRAND を外す（使わない import は wasm の clippy の -D warnings で落ちる）。この読みと 2 つの効果を置く関数は問わない（top の中でも、top が呼ぶ非公開の関数でも、App の中でもよい）。下の段の着地済みの歯が見る字（App の本文の 2 行・page_view の宣言・block_view の本文・戻るの部品の 6 つの字・lib.rs の 2 行の並び）は崩さない。index.html は書かない（wasm が載る前の題は今の字のまま）。
      着地済みの歯（直すものは無い・直さずに通るもの・workspace の tests と src の #[cfg(test)] を grep で確かめた）。board.rs を読む歯は 3 つ。acctwire_back_steps（tests/acctwire.rs）は board.rs の 6 つの字（frame::back_steps( の呼び・open_with_url_and_target に空の字と ACCOUNT_WIN を渡す字・BackStep::CloseSelf・me.close()・class=BACK_WRAP・class=BACK.class）と lib.rs の wasm の target のときだけの pub mod board の 2 行の並びを見る。hsblock_dispatch_by_list（tests/hsblock.rs）は fn block_view の本文（Module::ALL と .block().id == block.id と Module::view が在り、13 の module の名に続く :: が無い）と fn App の本文の 2 行（画面の状態の signal を Screen の initial で作る行と provide_context(screen); の行）と fn page_view(page: PageId) -> の字と ledger.rs と lib.rs を見る。hspage_no_variant_words（tests/hspage.rs）は frame.rs と board.rs に PageId の Ask・Map・Gaps・Node の変種の字と fn nav_icon の字が無いことを見る。この行はそれらの字を崩さず、頁の変種の名を書かないので 3 つとも通る。src の全部を歩く歯のうち、frame_classes_are_in_stylesheet（tests/frame.rs）は src の class= に引用符の続く字を集める（この行は新しい class の字を書かず、class の値が name の span は今のまま）。frame_no_heading_words_in_code は語の辞書の英字でない見出しの語を引用符で囲んだ字を見る（BOARD_WORDS の字は英字だけで対象の外・vocab.json に project board の見出しは無い）。parts_paths_distinct_in_block_modules（tests/parts.rs）は src の引用符で囲んだ /api/ の字が block の module の PATHS・mapview の graph の PATH・/api/surface/events のどれかであることを見るので、面は /api/project の字を書かず、契約の型の crate の PATH を名で使う。parts_reload_events_from_contract_constants は src の EventSource::new の数 1 と event の名の字を見る（この行は足さない）。steady_ の歯は src/project の下だけを読む。header の値の歯（frame_snapshot_matches_file・hspage_ の header.json の比べ・acctwire_back_part_before_header）は tests/snapshots/header.json と frame の header_snapshot（frame.rs の HEADER と BACK と nav）を読み、この行は frame.rs も header.json も書かない。BRAND を名指す歯は acctlook_page_title_is_brand_and_board だけで、見るのは account の module の BRAND（字 器）と page_title（この行は触らない）。契約の型の crate の src を歩く歯は acctdoc_paths_once_in_account_module（/api/account と /api/account/heartbeat の引用符の字が account.rs にだけ在る・project.rs はどちらも持たない）で、lib.rs の字を読む歯は無い。口の列の歯は hbroute_all_names_follow_dir（Route の ALL の名の列が dir の file の名の列と同じ・file を足せば列も増える）・hbroute_keys_cover_twelve_gets（12 の GET の鍵が在ることだけを見る・多い分を許す）・hbroute_keys_never_overlap（同じ method の鍵の対が重ならない・Exact の /api/project は他の Exact と字が違い Prefix の /api/ledger/ で始まらない）・hbroute_build_script_writes_paths（生成の字に dir の全部の file の path の属性つきの mod の宣言が名の順に在る）と hbpost_ の歯（POST の 4 つが在ることだけを見る）。index.html を読む着地済みの歯は無い。
      測り方。新しい歯は境界の crate の tests/brand.rs と面の crate の tests/brand.rs に置き、名を brand_ で始める（2 つの file は verify で -p と --test で狭める）。filter の語 brand_ は着地済みの tests/acctlook.rs の acctlook_page_title_is_brand_and_board の名にも部分の字として当たるが、--test brand が置き場を tests/brand.rs に狭めるので、その file は write-set に要らない（handoff の 14 節・確かめた）。境界の歯は、作業場（CARGO_TARGET_TMPDIR の下）に dir proj-kiri とその下の dir inner と、面の file の置き場（index.html 1 つ）と偽の bd（空の配列を出す sh の script・実行の権限つき）を置き、bd に偽の bd を入れた Config::new（repo は proj-kiri と inner と .. をつないだ path・bind は 127.0.0.1 の 0 番・files は面の file の置き場）で server を立てて GET /api/project を素の TCP で撃ち、200 と本文が名 proj-kiri の電文の字であることを見る。repo に根の / を渡した server では 503 と字 no-name を見る。Route の ALL の名 project の key を見る。CARGO_MANIFEST_DIR から契約の型の crate・境界の crate・面の crate の src の下の rs の file を全部読み、引用符で囲んだ /api/project の字の在りかが契約の型の crate の src/project.rs の 1 度だけであることを見る。PATH の値と ProjectName の電文の字（上の形の段の字）を見る。面の歯は、kept_name を次の 6 組で比べる（前の名 無し と名 proj-kiri の本文で proj-kiri・前の名 a と Failed で a・前の名 a と NotRead で a・前の名 a と空の object の本文で a・前の名 a と name が空の字の本文で a・前の名 a と名 b の本文で b）。brand は None で frame の BRAND、proj-kiri で proj-kiri。board_title は None で tsuzuri と空白と U+2014 と空白と project board、proj-kiri で proj-kiri と同じつなぎの字。index.html を読み、title の開きの tag と board_title の None の字と閉じの tag をつないだ字が在ることを見る。board.rs の字を読んで done (5) を見る（題の span の中身と set_title の呼びは wasm の target のときだけなので host では撃てない・組めることは xtask の surface-build で見る）。
      filter の語（着地済みの行とこの波の行の verify の語・この行の接頭辞 brand_ は並べない・65 語）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・runsdoc_・nbatch_ で、新しい歯の名から先頭の brand_ を除いた字は、このどれも部分の字として含まない（例 brand_project_name・brand_server_up は不可）。名の例（どの語も含まない）は brand_keeps_last_read_name・brand_title_joins_board_words・brand_top_reads_name_and_sets_title・brand_route_is_listed・brand_name_is_repo_dir・brand_no_name_is_503・brand_own_names_clean。
      依存は足さない。Cargo.toml と vocab.json と style.css と index.html は触らない（3 つの crate は契約の型の crate を既に直に使う）。
  - n: 9
    type: prose
    title: 行 e-runs — 走行の記録の口 GET /api/runs?bead=
    body: |
      なぜ。節点の頁の走行の時間軸（見本の mock3 の bead.html の 41 行から 57 行・走行ごとに段の chip を並べ、段の審査の結びが PASS でなければ止まりの色）は今の口では組めない。口 /api/graph の走行の属性は最後の段と口座と答えの無い問いの数だけで（中核の graph の RunAttr）、pipeline の板は bead ごとに最新の走行の最後の段 1 つだけ。要件 FR10 は走行の属性（段・段の理由・gate の verdict・審査・費用・時刻）を器の event log から読むとする。この行は bead の走行ごとの段の列・審査の結び・口座・費用を返す読みの口を足す（面の block は後の行 g-node-timeline）。
      在りか（HEAD 03435c3 で確かめた）。境界: src/server/runs.rs の pub struct Runs（pub な欄 log の Option の PathBuf・state dir の下の fleet/events.jsonl）の pub fn text（&self を受けて Option の String・state dir を省いたときと file が読めないときは None）。Shared の欄 sources（server の board の Sources）の pub な欄 runs が起動で作った Runs。口の file の形・json・Response::text・生成の Route は行 g-brand の節の在りかの段と同じ。query の読みの見本は routes/around.rs で、http の Request の pub fn query（鍵の &str を受けて Option の String・+ を空白に、%XX を byte に戻す）と pub fn path（query を除いた path）を使う。中核: src/pipeline.rs の非公開の fn detail_account（event の JSON の値の参照を受けて Option の String・欄 detail の字を , と空白で切った札のうち account: で始まる最後の空でない札の残り）と非公開の fn text（event の欄の字）と、use している crate::graph::build の read_events（pub(crate)・字が空白だけか、空でない行のどれかが JSON の object でなければ None）と run_bead（pub・run の id の後半が器の時刻の形なら前半の字）と crate::ledger の epoch_secs（pub・RFC 3339 の字を epoch 秒）。pipeline の of_inputs は、欄 run の字を持つ event のうち kind が RunCreated の最初の 1 件で走行を作り（bead は欄 bead の字か run_bead）、作る前の同じ走行の event と、作れない走行の event を読み捨てる。この行は同じ決まりで走行を作る。契約の型: board の Reading（serde の kebab-case・Known は鍵 known の object・Unknown は字 unknown・derive は Debug・Clone・PartialEq・Serialize・Deserialize で Eq が無い）・ledger の BeadId（ASCII の英数字と . と - と _ だけの 1 語・先頭は英数字・64 byte 以下・電文は字 1 つ・形が悪ければ new が Err）・根の EpochSecs（u64）。契約の型の crate の lib.rs は行 g-brand の後に pub mod project を持つ。
      fixture（読むだけ・書かない）。tests/fixtures/graph/real/events.jsonl（109 行・器の実物の写しで host と口座は伏せた字）。RunCreated は 10（bead は t3-hub.2 が 3・t3-hub.3 が 1・t3-hub.4 が 2・t3-hub.5 が 3・t3-hub.6 が 1・どれも欄 bead を持つ）。RunCost は 21（欄 usage は in・out・cache_read・cache_create の札を , でつないだ字・欄 turns と wall_ms は整数）。欄 stage を持つ event は RunCreated（字 Intake）・RunStage（Reviewed・Spawned・Implemented・Gated）・RunDone（Landed）で、RunCost・SeatSpawned・SeatStopped・DispatchMark は欄 stage を持たず、DispatchMark は欄 run も持たない。
      形（契約の型）。src/runs.rs を足し、lib.rs の question の行と seat の行の間に pub mod runs の 1 行を足す。pub const PATH（&str・字 /api/runs）。pub struct RunsDoc（欄 bead の BeadId・runs の Reading の Vec の RunLine・derive は Debug・Clone・PartialEq・Serialize・Deserialize）。pub struct RunLine（欄 run の String・started_at の Option の EpochSecs・account の Option の String・steps の Vec の RunStep・cost の RunCost）。pub struct RunStep（欄 at の Option の EpochSecs・stage の String・detail の Option の String・verdict の Option の String・verdict_kind の Option の String）。pub struct RunCost（欄 events の u32 と、turns・wall_ms・tokens_in・tokens_out・cache_read・cache_create の u64）。RunLine・RunStep・RunCost の derive は Debug・Clone・PartialEq・Eq・Serialize・Deserialize で、RunCost は Default も持つ。欄はどれも pub で、serde の rename を置かない。電文の鍵の集合は、RunsDoc が bead と runs、RunLine が run・started_at・account・steps・cost、RunStep が at・stage・detail・verdict・verdict_kind、RunCost が events・turns・wall_ms・tokens_in・tokens_out・cache_read・cache_create（無しの値は null の字で鍵は残る）。
      形（中核）。src/pipeline.rs に pub fn runs_of（events の &str と bead の &BeadId を受けて RunsDoc を返す・file も時計も触らない）を足す。決まりは上から順に次のとおり。(a) read_events が None なら runs は Unknown。(b) event を log の順に読み、欄 run の字を持つ event だけを見る。kind が RunCreated でその run をまだ見ていなければ、bead を欄 bead の字か run_bead で決め（どちらも無ければ作らない）、それが引数の bead と同じ字なら RunLine（run の id・started_at は欄 ts の epoch_secs・account は無し・段は空・費用は全部 0）を作り、違えばその run を作らずに見た印だけを付ける。作った走行の event（その RunCreated を含む）だけを次の (c) から (e) で読み、作る前の event と作らなかった走行の event は読み捨てる。(c) detail_account が Some なら account をそれにする（後の event ほど勝つ・pipeline の札の口座と同じ決まり）。(d) 欄 stage が字なら段を 1 つ足す。at は欄 ts の epoch_secs、stage はその字のまま、detail は欄 detail の字（無ければ無し）、verdict は detail を , と空白で切った札のうち verdict: で始まる最初の札の残り（空なら無し）、verdict_kind は同じく kind: で始まる最初の札の残り。同じ段の続く event（RunDone の Landed が 4 つ続くなど）もそのまま 1 つずつ足す（まとめるのは後の面の時間軸・見本の bead.html も描く側でまとめる）。(e) kind が RunCost なら events に 1 を、turns と wall_ms に同じ名の欄の整数（無いか u64 に読めなければ 0）を足し、欄 usage の字を , で切った札を最初の : で鍵と値に分け、鍵が in・out・cache_read・cache_create で値が u64 に読めれば tokens_in・tokens_out・cache_read・cache_create に足す（ほかの札は数えない）。(f) runs は Known で、走行の並びは RunCreated の log の順。board・of_inputs・stage_of・detail_account の外形と値は変えない（下の段の着地済みの歯が見る）。
      形（境界）。src/server/routes/runs.rs を足す（Route の変種 Runs・名 runs・server の同じ名の module runs とは別の module）。ROUTE の key は method GET と Exact の契約の型の crate の runs の PATH（引用符の /api/ の字を書かない）。handle は、query の bead が無いか空なら 400 と字 no-bead、BeadId の new が Err なら 400 と字 id-shape、ほかは shared の sources の runs の text（None なら空の字）と bead を runs_of に渡した RunsDoc を json で 200 で返す（sources の gather は台帳の bd も撃つので要らず、runs の text だけで足りる）。
      節の値（fixture の t3-hub.2・done (2)）。走行は 3 つで、1 本目は run t3-hub.2-20260927T071348Z・started_at 1790493228・account 無し・段 Intake と Reviewed（Intake の at 1790493228・detail の字 classes:・verdict と verdict_kind は無し、Reviewed の at 1790493247・detail の字 verdict:FAIL kind:other・verdict FAIL・verdict_kind other）・cost は events 1・turns 1・wall_ms 17235・tokens_in 2・tokens_out 1541・cache_read 10896・cache_create 8407。2 本目は run t3-hub.2-20260927T071750Z・started_at 1790493470・account は fixture の伏せた口座の字 acct-1・段 Intake・Reviewed（verdict PASS）・Spawned・Implemented（detail 無し）・Gated（verdict FAIL・verdict_kind 無し）の 5 つ・cost は events 2・turns 33・wall_ms 155603・tokens_in 32・tokens_out 15638・cache_read 503756・cache_create 43725。3 本目は run t3-hub.2-20260927T072139Z・started_at 1790493699・account acct-1・段 Intake・Reviewed（verdict PASS）・Spawned・Implemented・Gated（verdict PASS）・Gated（detail の字 turn:taken・verdict 無し）・Landed の 7 つ・cost は events 3・turns 40・wall_ms 212986・tokens_in 38・tokens_out 23140・cache_read 706443・cache_create 69522。段の verdict は、書いていない段はどれも無し（Intake の classes: と Spawned の base: と account: の札と Landed の sha: と main: の札は verdict: で始まらない）。
      着地済みの歯（直すものは無い・直さずに通るもの・workspace を grep で確かめた）。pipeline.rs の字を読む歯は無い。pipeline の関数を呼ぶ歯（中核の stats_pipeline_matches_fixture・境界の server_read_four_routes_match_core と server_coalesce_seven_routes_share_one_bd・中核の next_step の止まっている走行の判じを見る歯）は board と of_inputs を呼び、この行はその 2 つと stage_of と detail_account を変えないので値は変わらない。pipeline.rs の中の歯 stats_stage_of_closed_table と stats_detail_account_takes_the_last も変えない。server の runs.rs の中の歯 server_read_events_log_path は Runs の path と text を見る（この行は server の runs.rs を書かない）。口の列の歯は行 g-brand の節の段と同じで、Exact の /api/runs は他の Exact と字が違い Prefix の /api/ledger/ で始まらない。契約の型の crate の src を歩く歯は acctdoc_paths_once_in_account_module（runs.rs は /api/account の字を持たない）と行 g-brand の歯 brand_（引用符で囲んだ /api/project の字の数だけを数える）で、lib.rs の字を読む歯は無い。tests/contract_form.rs と snapshots/contract_form.json は新しい型を持たない（新しい型はこの行の歯の file で見る・handoff の 14 節）。
      測り方。新しい歯は中核の crate の tests/runsdoc.rs と境界の crate の tests/runsdoc.rs に置き、名を runsdoc_ で始める（2 つの file は verify で -p と --test で狭める）。中核の歯は CARGO_MANIFEST_DIR から fixture を読み、done (2) の節の値と、t3-hub.5 の 2 本目（run t3-hub.5-20260927T080945Z）の段と、log に無い bead（t3-hub.9）の Known の空の列を見る。短い字の組は歯の中に書く。空の字と、JSON の object の行の後に JSON の object でない行を 1 つ含む字は Unknown。前に在る event と bead の無い RunCreated の組は 4 行で、run は fx-1-20260927T000000Z、1 行目は RunStage（stage Reviewed・detail は verdict:PASS と account: の札を , でつないだ字）、2 行目は RunCost（usage in:5・turns 1・wall_ms 10）、3 行目は欄 bead の無い RunCreated（stage Intake）、4 行目は RunStage（stage Gated・detail verdict:FAIL）で、bead fx-1 の runs は走行 1 つ・段は Intake と Gated（verdict FAIL）の 2 つ・account は無し・cost は全部 0。電文の鍵の歯は runs_of の値を wire の encode で字にして serde_json の Value に読み、4 つの型の object の鍵の集合を見て、Unknown の電文の欄 runs が字 unknown であることと、decode で同じ値に戻ることを見る（鍵の順は見ない）。境界の歯は作業場に repo（.beads の dir）と面の file の置き場（index.html 1 つ）と state dir（fleet/events.jsonl に fixture の字を写す）と偽の bd を置き、state_dir と bd を入れた Config（残りは Config::new）で server を立てて素の TCP で撃つ。本文は同じ字を runs_of に渡して wire の encode した字と比べる。state dir の無い Config の server の本文は decode して runs が Unknown。断りは /api/runs と /api/runs?bead= と /api/runs?bead=a%20b の 3 つ。fixture は足さない（歯の中の短い字と、読むだけの着地済みの fixture）。
      filter の語（着地済みの行とこの波の行の verify の語・この行の接頭辞 runsdoc_ は並べない・65 語）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・nbatch_ で、新しい歯の名から先頭の runsdoc_ を除いた字は、このどれも部分の字として含まない（例 runsdoc_stage_path・runsdoc_account_last・runsdoc_server_get は不可）。名の例（どの語も含まない）は runsdoc_hub2_three_runs・runsdoc_verdict_kind_and_edges・runsdoc_wire_keys・runsdoc_get_matches_core・runsdoc_refuses_bad_bead・runsdoc_unread_log_is_unknown・runsdoc_route_is_listed・runsdoc_own_names_clean。
      依存。契約の型の crate の lib.rs は行 g-brand も pub mod project の 1 行で書くので、この行は g-brand の着地の後に走る（depends）。外の依存は足さない。Cargo.toml は触らない（中核の crate は serde_json を既に直に持ち、歯も使える・境界の crate は serde に直に依存せず、歯は契約の型の wire で読む）。
  - n: 10
    type: prose
    title: 行 c-next-batch — 次の一手の束の承認を判じる
    body: |
      なぜ。次の一手の閉じた 7 種（規則の行 R-24 の value の限度と移動 → 応答なし → 止まっている走行 → 束の承認 → 質問 → 発効待ち → なし の順）のうち、束の承認を中核の next_step は判じない（結果は NotJudged・live の /api/next でも not-judged）。見本（mock3 の index.html の次の一手が積む鍵 nx_d の項目と、acct.js の関数 TZ.nextQ とそれを使う鍵 nx_d の項目）は、A-1 の印の無い open の問いが 2 本以上なら当て、件数を出し、問いの頁の束の block へ導く。要件 FR7 は A-1 の印（消す・出す・使う）を持つ問いは束に入れず個別の逐語を要るとする。問いの一覧と束の受付は着地済みで、材料の台帳の字は next_step が既に受けている。
      在りか（HEAD 03435c3 で確かめた）。中核の src/next_step.rs の非公開の fn judge（台帳の字・event log の字・今の時刻・席の card の Option を受けて NextStep）は NextMove の ALL から Nothing を除いた 6 つを宣言の順に判じ、StalledRun は stalled_run、Question は question、LimitOrMove と Unresponsive は seat_found、ほか（BatchApproval と AwaitingEffect）は None。非公開の fn check は、非公開の struct Found（件数 count の usize と対象 target の Option の BeadId）が None なら NotJudged・件数 0・対象無し、count が 0 より大きければ Hit、0 なら Miss にする。Nothing は判じた種類に Hit が無ければ Hit、lead は checks の並びで最初に Hit の種類。pub な item は next_step（台帳・event log・時刻）と next_step_seat（それと席の card の Option）と STALLED_STAGES。中核の src/question.rs の pub fn open_questions（台帳の字を受けて Reading の Vec の OpenQuestion）は label intake:question を持ち status が closed でも tombstone でもない bead を作られた時刻の順に返し、字が空か読めないか、open の問いの id が bead の id の形でなければ Unknown。OpenQuestion の pub な欄 card（契約の型の question の QuestionCard）の a1 は label のどれかが字 A-1（question の pub const A1_PREFIX）で始まるとき真。同じ open_questions を境界の server の batch.rs（束の受付・a1 の問いを A1InBatch で断る）と ruling.rs が使い、面の問いの頁の束の block は /api/questions（同じ関数の一覧）から a1 でない問いを並べる。口 /api/next（境界の src/server/routes/next.rs）は台帳の字（bd の一覧の全部で label を含む）と event log の字を境界の board の next か next_seat に渡し、それが中核の next_step か next_step_seat を呼ぶ。account board の HOME は中核の account の project.rs が next_step_seat を呼ぶ。よって口と account board は、この行の中核の変更だけで束の承認を判じる（境界と面と契約の型は書かない）。面の project の next.rs は Hit の種類に件数、Miss に字 ―、NotJudged に測れていないの印を出し、束の承認の大きい箱は対象が無ければ件数の字だけを出す。
      形。next_step.rs に pub const BATCH_MIN（usize・値 2）と非公開の fn batch（台帳の字を受けて Option の Found）を足す。batch は open_questions が Known なら card の a1 が偽の数 n を数え、n が BATCH_MIN 以上なら count を n、未満なら count を 0 にした Found（target は無し）を返し、Unknown なら None を返す。judge の BatchApproval の腕で batch を呼ぶ。AwaitingEffect は今のまま None。check・Nothing・lead の決め方、7 種の並び、ほかの種類の判じ方、STALLED_STAGES の宣言の行は変えない。質問の種類の数え方（台帳の Bead の種類が問いで is_open）も変えない。束の承認は束の受付と束の block が使う同じ一覧（open_questions）で数え、質問の種類は着地済みの一覧のまま数える。module の doc の、判じる種類の段（束の承認を判じないと書いた字）を直す。
      fixture の直し（この行の write-set の中）。tests/fixtures/pipeline/next.json（4 組）の各組の want の束の承認の result を not-judged から miss に替え（count 0・target null のまま）、組 2（質問）の問い nx2.q1（新しい方）の labels に字 A-1 を足し、組 2 の case の字と note の字の束の承認の説明を今の決まりに直す。組 2 の open の問いは nx2.q1 と nx2.q2 の 2 本で、A-1 の印を足すと束の数 n は 1（nx2.q2 だけ）なので束の承認は Miss、質問は今のまま Hit（件数 2・対象 nx2.q2）で lead は question のまま。組 1 と組 4 は open の問いが 1 本、組 3 は 0 本で、束の承認はどれも Miss。ほかの欄と字は変えない。
      着地済みの歯（直すものは無い・直さずに通るもの・workspace を grep で確かめた）。中核の tests/stats.rs の stats_next_step_matches_fixture は next.json の 4 組で next_step の値と want が等しいこと・lead の集合が止まっている走行と質問となしの 3 つであること・台帳の字が空なら Nothing のほかが全部 NotJudged であることを見る。直した fixture で want と値は等しく、lead は変わらず、空の台帳では open_questions が Unknown なので束の承認も NotJudged。stats_rule_r24_order_matches_rules は NextMove の ALL の順と規則の行 R-24 の字と、空の配列の台帳での種類の並びを見る（並びは変えない）。中核の tests/seat.rs の seatcard_next_step_from_card は台帳が空の配列で席の card の 2 種と lead を見る（open の問いが 0 本なので束の承認は Miss で、lead と Nothing の当たりは変わらない）。seatcard_next_step_keeps_landed_values は next.json の 4 組の台帳と event log と時刻だけを読み（want は読まない）、next_step_seat と next_step を比べる（同じ関数の値）。中核の tests/acctpcore.rs の acctpcore_ledger_and_next_step_as_landed と、境界の server_read_four_routes_match_core・server_coalesce_seven_routes_share_one_bd・server_seat_next_uses_card は、口や組み立ての値を同じ入力の next_step か next_step_seat と比べる（server_seat_next_uses_card の台帳は空の配列で束の承認は Miss・席の card の 2 種で値が違うことは変わらない）。面の tests/acctsess.rs の acctsess_vocab_style_and_deps は next_step.rs の字に STALLED_STAGES の宣言の 1 行（Stage の 3 つの配列・Questioned と Failed と Stopped の順）が在ることを見る（この行は変えない）。面の tests/next.rs と契約の型の tests/contract_form.rs は fixture（tests/fixtures/surface/next-step.json）と snapshot の電文を読むだけで中核の関数を呼ばない。面の crate の Cargo.toml の dependencies は契約の型の crate だけ（acctsess_vocab_style_and_deps が見る）で dev-dependencies は境界の crate だけ、契約の型の crate の dependencies は serde と serde_json だけで、どちらも tsuzuri-core を持たない。
      account の 2 つの fixture（tests/fixtures/account の acct-doc.json と acct-inputs.json・この行は書かない・読む歯はどれも直さずに通る・workspace を grep で確かめた）。write-set の = の 2 つ（中核の tests/acctpcore.rs と tests/fixtures/account/acct-doc.json）は置き場だけで中身は変えない（器の contract-source §3）。前の便の審査が、この 2 つが壊れると読んだので、審査の目が実物の中身を見られるように置く。実装はこの 2 つの file を書かない。acct-doc.json は契約の型の AccountDoc の電文の見本で、鍵は at・accounts・groups・moves・projects・sessions・dormant。project の行（proj-a・proj-b・proj-c）の鍵は name・group・state_dir_known・seat・move_left_s・runs・ledger・next・board で、ledger は台帳の指標（LedgerStats）の値、next は次の一手（NextStep）の値そのもので、台帳の字も event log の字も見本に無い。proj-a の next の checks は 7 つ（限度と移動が miss・応答なしが miss・止まっている走行が miss・束の承認が not-judged で count 0 と target null・質問が hit で count 1 と target proj-a.7・発効待ちが not-judged・なしが miss）で lead は question。proj-a の ledger の open は task 9・memo 3・question 2・epic 2。proj-b と proj-c の ledger と next は字 unknown。この見本は関数の値の写しでない。中核の ledger の stats の open の question は、非公開の fn read（ledger の module）で読んだ bead のうち作られた時刻が無いか今以下のものから、種類が問い（NodeKind の Question）で is_open のものを数え、next_step の fn question の count は同じ fn read で読んだ bead から種類が問いで is_open のものを全部数えるので、同じ台帳の字なら前者は後者より大きくならない。見本では前者が 2 で後者が 1 なので、どの台帳の字からも出ない手で書いた値で、着地のときから計算と揃っていない（電文の形と面の出し方を撃つための見本）。束の承認の not-judged は契約の型の CheckResult の値で、この行の後も next_step は open_questions が Unknown なら出すので、見本を直す理由は無い。見本を読む歯とその比べるものは次のとおり。(i) 中核の tests/acctpcore.rs の acctpcore_assemble_equals_doc_fixture は見本を AccountDoc の want に読み、want の at と accounts・groups・moves・projects・sessions の写しをそのまま中核の account の project の pub fn assemble（時刻と 3 つの Reading の列と ProjectRow の Vec と SessionLine の Vec を受けて AccountDoc）に渡し、返りが want と等しく dormant が空であることを見る。assemble は受けた 6 つを AccountDoc の欄に詰めて dormant を空の Vec にするだけで next_step も next_step_seat も呼ばないので、proj-a の next は見本の値がそのまま戻り、この行の変更で動かない。(ii) 面の tests/accthome.rs の accthome_next_all_on_fixture は見本の proj-a の next から HOME の 1 行と 6 つの印を組み、印の glyph d（束の承認）の class が nxm na（判じなかった）・glyph e（質問）が nxm on・lead が question・行の字が「proj-a.7 · 1 件」であることを見る。見本の束の承認の値から期待を組む歯はこれだけで（acctdoc_fixture_roundtrip は字の全体の往復を見るだけ）、見本を変えないので通る。(iii) 面の acctframe.rs の acctframe_badges_on_fixture と acctproj.rs の acctproj_need_order は proj-a の lead が question であることを見て、契約の型の tests/acctdoc.rs の acctdoc_fixture_roundtrip は見本の字を decode して encode すると同じ字に戻ることを見る。面の acctled.rs・acctsess.rs・acctwin.rs・accthb.rs・ledspark.rs は口座・台帳の指標（ledspark.rs は ledger の days）・session・窓・heartbeat の部分を読み、束の承認を読まない。面と契約の型の、見本を読む歯はどれも tsuzuri_core も tsuzuri_boundary も use せず、見本を decode するだけ。(iv) acct-inputs.json は host の側の字だけを持ち（鍵は texts・accounts・groups・moves・texts の鍵は host_toml・usage・doctor・seat_doctors・records・history）、台帳の字を持たない（字 ledger も字 question も無い）。読むのは中核の tests/acctcore.rs（口座・群・移動を組む歯）と acctpcore.rs。acctpcore の proj-a の台帳の字は歯の中の fn ledger が組む 3 本（fx-4 と fx-5 が open の task・fx-6 が closed の task・どれも labels が無い）で、open の問いは 0 本。acctpcore_ledger_and_next_step_as_landed は project_rows の proj-a の next を、同じ台帳の字と event log の字と席の card で今呼んだ next_step_seat と比べ（両辺が同じ関数で、束の承認は両辺とも Miss）、acctpcore_doc_host_parts_from_inputs は doc の projects を同じ入力の project_rows と比べ、accounts・groups・moves を acct-inputs.json の値と比べる。(v) 境界の tests/server_acct.rs の server_acct_doc_matches_core と、core_doc と比べるほかの歯は、口の電文を同じ字を中核の account の project の pub fn doc に渡した値と比べる（両辺が同じ関数）。その台帳の字は proj-a が open の task 1 本（labels が無い）・proj-e が空の配列で、open の問いはどちらも 0 本。見本の束の承認を miss か hit に直すと (ii) の印の期待が変わり、hit なら lead も束の承認に替わって (iii) の 2 つの歯も変わり、面の crate の歯を書く行になる。見本は計算の写しでないので直さない。
      測り方。新しい歯は中核の crate の tests/nbatch.rs に置き、名を nbatch_ で始める。台帳の字は serde_json の json の macro で bd の一覧の形（id・title・status・issue_type・labels・created_at）の配列を組んで字にする。組は次のとおり。(a) A-1 の印の無い open の問い 2 本（label intake:question）と open の task 1 本・event log は空 → 束の承認は Hit・件数 2・対象無し、質問は Hit・件数 2、lead は束の承認。(b) open の問い 3 本のうち 2 本の labels に字 A-1 か A-1 で始まる字（例 A-1:消す）→ n は 1 で束の承認は Miss・件数 0、lead は質問。(c) (a) の 2 本に closed の問い 1 本と tombstone の問い 1 本と label の無い task 1 本を足す → n は 2 で Hit・件数 2。(d) 台帳の字が空 → NotJudged・件数 0。台帳が空の配列 → Miss・件数 0。(e) open の task の走行の最後の段が Gated で detail が verdict:FAIL の event log（RunCreated と RunStage の 2 行）と A-1 の印の無い open の問い 2 本 → 止まっている走行と束の承認が Hit で lead は止まっている走行。(f) 全部の組で checks の種類の並びは NextMove の ALL、lead は並びで最初に Hit の種類、発効待ちは NotJudged、席の card の無い next_step_seat は next_step と同じ値。(g) BATCH_MIN は 2。(h) CARGO_MANIFEST_DIR から tests/fixtures/pipeline/next.json を読み、組 2 の nx2.q1 の labels に字 A-1 が在り、4 組で next_step の束の承認が Miss・件数 0・対象無しで、want の束の承認も同じ値であること。
      filter の語（着地済みの行とこの波の行の verify の語・この行の接頭辞 nbatch_ は並べない・65 語）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_ で、新しい歯の名から先頭の nbatch_ を除いた字は、このどれも部分の字として含まない（例 nbatch_question_two・nbatch_stats_fixture・nbatch_stage_first は不可）。名の例（どの語も含まない）は nbatch_two_plain_asks_hit・nbatch_a1_left_out・nbatch_closed_and_plain_tasks_left_out・nbatch_unread_is_not_judged・nbatch_stalled_leads_first・nbatch_order_keeps_all・nbatch_fixture_cases_miss・nbatch_own_names_clean。
      依存は足さない。Cargo.toml は触らない（中核の crate は serde_json を既に直に持つ）。境界と面と契約の型の crate は書かない。

