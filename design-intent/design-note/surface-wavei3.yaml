    body: |
      席が持ち主の端末の Chrome を起こして画面を見せる表示面（要件 FR16・判断の記録 ADR-5 と ADR-15）の 3 つ目の部品を、境界の crate の module stage に置く（i-2）。
      端末の行（行 i-1 と i-1b の読み手）から ssh の argv と Chrome の argv と起動の env を Os の値でだけ組む純粋な関数（子 module launch）と、端末の Chrome の口をこの server の 0700 の dir の中の unix socket へ ssh で引く tunnel と、同じ profile の Chrome が動いていれば起こさず、動いていなければ呼ぶ側が起こしてよいと渡した時だけ 1 回起こし、頁の target の websocket の path を読む口（子 module tunnel）。
      窓を前に出す・動かす・新しい窓を足す命令は持たない。外の依存は足さない。tz の口（i-5）・届かない端末の落ちる先（i-4）・表示先の設定と初めて見せた印（i-7）・知らせ（i-10）は後の行。
