  - n: 3
    type: prose
    title: 行 i-2 — 起動の引数と tunnel と、窓を 1 回だけ起こすこと
    body: |
      なぜ。要件 FR16 は、席が端末の一覧（器の宣言の行）から端末の名で命令し、ssh 経由で Chrome を専用の profile の app mode で起こし、CDP を tunnel で引いて操作するとし、窓を起こすのは表示先の端末に初めて見せる時と持ち主が tz の口か board の button で頼んだ時だけで（持ち主が閉じた窓は開き直さない）、窓を前に出す命令と窓を動かす命令と新しい窓を起こす命令は撃たないとする。受入 AC13 は、偽の ssh と偽の Chrome で起動の引数（専用の profile・app mode・入力の環境）が snapshot と一致し、窓を前に出す命令を撃たないことを見る（fixture は端末の行 2 つの tests/fixtures/stage/terminals.toml）。判断の記録 ADR-5 の決定 (1) は端末の Chrome を ssh 経由で app mode で起こし CDP を tunnel で引く形を、決定 (2) は端末の値を器の宣言の行から読み code に焼かないこと（条 N-7）を決める。ADR-15 の決定 (4) は専用の profile の置き場を層 A の行の欄に書き code に既定の dir を持たないことを、決定 (6) は窓を起こすのは初めて見せる時の 1 回と持ち主が頼んだ時だけで、前に出さず動かさず、新しい窓を起こす命令を撃たないことを決める。着地した行 i-1（端末の行の読み）・i-3（CDP の口）・i-1b（画面を開く env の欄 display-env）の後も、端末の行から起動の引数を組み、端末の Chrome の口を tunnel で引き、窓を 1 回だけ起こす部品は境界の crate に無い（下の在りか）。この行は、計画 surface-plan（v0.19）の 9 節の計画だけの行 i-2 のとおりそれを置く。tz の口と守り（行 i-5）・届かない端末の落ちる先と URL（行 i-4）・初めて見せた印（行 i-7）・知らせ（行 i-10）は、この行の部品を使う後の行。
      拠る裁定と技術の決め。持ち主の裁定 t3-hub.59.2（裁定 id = t3-hub.59.2:20260928T0127Z-1・案 A）は、席専用の Chrome の profile を各 PC のホームの下の ~/.cache/tsuzuri-stage に作り、値は層 A の行の profile-dir に書き、code に既定の dir を持たないとした。t3-hub.59.5（裁定 id = t3-hub.59.5:20260928T0126Z-1）は、窓を前に出さず知らせだけを出し、タイル型の窓の管理（sway）では最初の 1 回だけ今見ている仮想の机に開き、その後は動かさないとした。t3-hub.59.7（裁定 id = t3-hub.59.7:20260928T0249Z-1・案 B）は、持ち主が窓を閉じた後は開き直さず、開くのは持ち主が tz の口か board の button で頼んだ時だけとし、計画はそれを行 i-2 の字（窓を起こしてよいかは呼ぶ側が渡す）にした。逐語は各問いの notes に在る。技術の決めは表示面の見積り（席の作業場の i-scope の 7 節）の T1（1 回の撃ちごとに繋いで閉じ、常駐しない・Chrome は端末に残る）・T3（tunnel は 0700 の dir の中の unix socket への転送・この server には人の口座が複数在り、127.0.0.1 の TCP の転送だとほかの口座の process も持ち主の Chrome を操れる）・T4（profile-dir の無い行を断り、既定の dir を補わない・src/stage/terminal.rs の lookup が断る）・T5（同じ profile の Chrome が動いていれば起こさない・起こしても引数と env が効かない・器の側の実測）。
      在りか（main 594131f で確かめた）。境界の crate の src/lib.rs は 15 行で、pub mod の 6 行（acct・accthb・cli・hook・server・stage をこの順・pub mod stage は 15 行目）を持つ。src/stage/mod.rs は 8 行で、doc の 3 行（表示面の要約・行 i-1 の terminal・行 i-3 の ws と json と cdp）と空の行と pub mod cdp・pub mod json・pub mod terminal・pub mod ws の 4 行（この順）だけを持ち、src/stage の下に launch.rs と tunnel.rs は無い。src/stage/terminal.rs（277 行・行 i-1 と i-1b）は pub const HEADER（字 [[device]]）と pub enum Os（Linux・Macos・Windows・derive に Clone・Copy・PartialEq・Eq・pub const ALL と pub fn word〔字 linux・macos・windows〕）と pub struct Terminal（pub な欄 name・ssh・chrome の String、os の Os、display の Option の String、ime_env の String の組の Vec、profile_dir の String、display_env の String の組の Vec の 8 つ・derive に Debug と Clone と PartialEq と Eq）と pub fn lookup（本文の &str と名の &str を受け Result の Terminal と String）を持つ。lookup は、display と display-env を両方持つ行・X の DISPLAY の形でない display・profile-dir の無い行・形の外の ime-env と display-env（KEY は英大文字と数字と下線で先頭が数字でなく、同じ欄の中で同じ KEY は 1 度だけ）を断り、ssh の値は空白を含まず字 - で始まらない。profile-dir の値の形（/ で始まるか）は見ず、ime-env と display-env の間で同じ KEY を持つ行も断らない。src/stage/json.rs は 181 行で、pub fn escape（6 行目）・member（26 行目・object の一番上の段の鍵の値の字）・unquote（70 行目）と、私の fn hex4・skip_ws・skip_string・skip_value（値の終わりの次の位置・字の値と括弧の対を跨ぐ・数と true と false と null の語を受ける）を持ち、配列の要素を切り出す pub な口は無い。src/stage/cdp.rs の Session の open は unix socket の &Path と resource の &str と timeout の Duration を受け（203 行目）、繋ぐ先の socket と頁の target の websocket の path を渡すのは後の行（cdp.rs の doc の字 行 i-2 が張る 0700 の dir の中の unix socket）。src/server/proc.rs（86 行・行 hb-proc）は pub const KILL（字 kill・17 行目）と pub fn capture（22 行目・program の &OsStr と args と cwd の &Path と timeout の Duration を受け、標準入力を空に、標準エラーを捨て、子を新しい process group に入れ、rc 0 で timeout の内に返った標準出力だけを Some で返し、ほかは group ごと止めて None）と pub fn stop_with（72 行目・Child と kill の &OsStr を受け、kill -KILL -- と負の group の id で group ごと止めて子を待つ）を持ち、src/server/mod.rs の pub mod proc の行（29 行目）と lib.rs の pub mod server で crate の中から使える（今の使い手は server/ledger.rs の pub use の再公開だけ）。境界の crate の中の module の向きを縛る歯は無い（tests と xtask を grep で確かめた）。境界の crate の Cargo.toml は [dependencies] に tsuzuri-contract と tsuzuri-core だけを持つ。main の workspace の rs の file に字 launch は無く（grep で確かめた）、字 json/new と json/activate はどの rs の file にも無く、字 bringToFront を持つのは tests/stcdp.rs だけ（それを断る歯の字）。fixture の tests/fixtures/stage/terminals.toml は 22 行で、term-a の行（ssh me@term-a・chrome /fake/bin/chrome・os linux・display :0・ime-env の GTK_IM_MODULE=fcitx と XMODIFIERS=@im=fcitx・profile-dir /fake/profile-a）と term-b の行（ssh me@term-b・chrome /fake/bin/chrome・os linux・display-env の WAYLAND_DISPLAY=wayland-1 と XDG_RUNTIME_DIR=/fake/run-b・profile-dir /fake/profile-b）を持つ（行 D-4・名も宛先も path も偽物）。
      形（src/stage/launch.rs・新しい file・純粋な関数だけ）。file も子の process も環境変数も触らない（撃つのは tunnel・use は std の path の Path と super の json と terminal だけ）。pub const PORT（u16・9224・端末の 127.0.0.1 だけで待つ remote debugging の port）。pub const WINDOW_SIZE（&str・字 900,760）。私の const SSH_OPTIONS（[&str; 6]・字 -o・BatchMode=yes・-o・ConnectTimeout=10・-o・ControlPath=none・鍵だけで入り、接続の待ちを 10 秒で切り、席の口座の ssh の設定の接続の共有〔ControlMaster〕を使わないので、閉じれば転送も消える・T1）。pub fn quote（&str を受け String）は字を一重引用符で包み、中の一重引用符を、一重引用符・逆斜線・一重引用符・一重引用符の 4 字に替える（遠くの shell の 1 語）。pub fn launch_env（&Terminal を受け Result の Vec の String と String の組と String）は、display が在れば DISPLAY と display の組、続けて display_env の組、続けて ime_env の組を、どれも宣言の順に並べ、同じ KEY が 2 度出れば端末の名と KEY を含む Err を返す（ime-env と display-env の間の重なりは lookup が断らないのでここで断る）。pub fn chrome_argv（&Terminal と URL の &str を受け Vec の String）は、chrome の値・字 --app= と URL・字 --user-data-dir= と profile_dir・字 --remote-debugging-port= と PORT・字 --no-first-run・字 --no-default-browser-check・字 --window-size= と WINDOW_SIZE の 7 語を返す（profile_dir は層 A の行の字のまま）。pub fn launch_argv（&Terminal と URL の &str を受け Result の Vec の String と String）は窓を起こす ssh の program の後の引数で、次の順に断る。URL が字 http:// か字 https:// で始まらないか空白か制御の字を持てば字 URL を含む Err（任意の script を URL で運ばない・見積りの T6）。os が Linux でなければ、端末の名と字 [os] と os の word を含む Err（下の Os の分け）。display が None で display_env が空なら、端末の名と字 [display] と字 [display-env] を含む Err。profile_dir が字 / でも字 ~/ でも始まらなければ（字 ~ だけと字 ~ と別の名も）端末の名と字 [profile-dir] を含む Err。launch_env の Err はそのまま返す。Ok の列は 9 語で、SSH_OPTIONS の 6 語・字 --・ssh の値（宛先）と、遠くの shell の字の 1 語。遠くの shell の字は、字 setsid・字 -f・字 env・launch_env の組を KEY と = と VALUE でつないだ字・chrome_argv の 7 語をこの順にそれぞれ quote して空白でつなぎ、その後に字 </dev/null >/dev/null 2>&1（前に空白 1 つ）を足した字（setsid の -f で子を切り離し、入出力を /dev/null へ向けるので ssh は Chrome を待たずに返る）。ただし profile_dir が字 ~/ で始まる時の chrome_argv の 3 語目は quote せず、節の HOME の語（字 --user-data-dir= の quote・二重引用符で囲んだ $HOME・字 / と ~/ の後の字をつないだ字の quote の 3 つを空白を挟まずにつないだ字）にする（遠くの shell は一重引用符の中の ~ を解かないので、その ~ だけを遠くの shell の HOME に替える・持ち主の裁定 t3-hub.59.2 の置き場を層 A の行に ~/ の字のまま書いても、/ から書いても起こせる）。pub fn tunnel_argv（&Terminal と socket の &Path を受け Vec の String・Os で分けない）は、字 -N・-o・ExitOnForwardFailure=yes・SSH_OPTIONS の 6 語・字 -L・socket の path と字 :127.0.0.1: と PORT をつないだ字・字 --・ssh の値の 13 語を返す。pub fn page_resource（/json/list の本文の &str を受け Option の String）は、json の items で本文の配列の要素を並びの順に見て、鍵 type の値を unquote した字が page で、鍵 webSocketDebuggerUrl の値を unquote した字が字 ws:// で始まり、その後の最初の斜線から後の字（path）が字 /devtools/page/ で始まる最初の要素の path を返し、無ければ None（配列でない本文も None）。1 つの端末の窓は 1 つを使い回し、頁の替えは同じ窓の中で行う（判断の記録 ADR-15 の決定 (6)）ので、URL で target を選ばない。
      形（src/stage/tunnel.rs・新しい file・撃つ側）。pub const SOCKET（&str・字 cdp.sock）。私の const SOCKET_MAX（107・unix socket の path の上限の 108 byte から終わりの NUL を除く）・REPLY_MAX（1 MiB・HTTP の応答の上限）・POLL（50 ミリ秒・見直しの間隔）。pub fn socket_dir（base の &Path を受け Result の PathBuf と String）は、base の下の名 tzst- と process の id と字 - と今の時刻の秒の下の nanosecond の dir を、std の DirBuilder の mode 0700 で新しく作り（在れば Err・再帰で作らないので base が無ければ Err）、作った後に権限を 0700 に置き直して（umask によらない）返す。dir に SOCKET をつないだ path の字が SOCKET_MAX を越えるか、コロン（ssh の -L の区切り）か空白を含めば、作らずに Err（temp_dir が /tmp なら path は 40 byte ほど・base は 75 byte ほどまで）。pub enum Window（Debug・Clone・PartialEq・Eq）は変種 Page（名の在る欄 resource の String〔頁の target の websocket の path〕と launched の bool〔この撃ちで窓を起こしたか・行 i-7 が初めて見せた印を書くのに使う〕）と Absent（名の無い 1 つの欄の String・窓が無いことを名指す出力の 1 行）。pub struct Tunnel（derive は Debug・欄は外に見せない・ssh の program・Terminal・dir・socket・timeout・子の process）。関連関数 open（ssh の program の &OsStr・&Terminal・socket_dir の dir の &Path・timeout の Duration を受け Result の Tunnel と String）は、dir に SOCKET をつないだ path を socket とし、ssh の program を tunnel_argv の引数で、標準入出力を空と捨てにし、新しい process group に入れて撃ち（撃てなければ端末の名を含む Err）、POLL ごとに、socket の path が在れば Ok、子が先に終われば端末の名とその終わりの状態（例 字 exit status: 255）を含む Err、timeout を越えれば端末の名を含む Err を返す（どの Err も端末に届かなかった印で、行 i-4 が落ちる先へ行く・Err を返す時も子を止めて渡された dir を消す）。method の socket（&self を受け &Path）は socket の path（行 i-3 の Session の open に渡す）。method の window（&self と URL の &str と may_open の bool を受け Result の Window と String）は、まず GET /json/version を撃ち、状態 200 の本文が返れば同じ profile の Chrome が動いているとして起こさない（T5・may_open によらない）。答えが無く may_open が偽なら、字 端末 と端末の名と、起こしてよいと渡されていないので窓を起こさない旨と、持ち主が閉じた窓は開き直さない旨と、字 tz stage open を含む 1 行の Absent を Ok で返す。答えが無く may_open が真なら、POLL の間を置いて GET /json/version を撃ち直し（一時の不通で、動いている Chrome に 2 つ目の窓を起こさないため）、答えれば起こさない。2 度とも答えが無ければ、launch_argv の引数（Err はそのまま返す）で ssh の program を server の proc の capture（cwd は dir・timeout は open の timeout）で 1 回だけ撃ち、None（rc が 0 でないか時間切れ・端末に setsid が無ければ遠くの shell の rc 127）なら端末の名と、端末の setsid と Chrome の場所と画面の env を確かめる旨を含む Err を返す。その後、GET /json/list の本文の page_resource が Some になれば Page（launched は起こしたかどうか）を Ok で返す。起こしていない時に頁が無ければ、字 端末 と端末の名と、Chrome は動いているが頁の窓が無い旨と、窓を足さない旨と、その Chrome を端末で終えてから字 tz stage open で開く旨を含む 1 行の Absent を Ok で返す（新しい窓を足さない）。起こした時は POLL ごとに GET /json/list を撃ち直し、timeout を越えれば端末の名を含む Err を返し、起こし直さない。GET は socket へ std の UnixStream で繋ぎ、読みと書きの上限を timeout にして、字 GET と path と HTTP/1.1 の行・Host の欄 localhost（Chrome の HTTP の口は Host の欄が IP か localhost の要求だけを受ける・公開の告知・この server では確かめていない）・Connection の欄 close と空の行（区切りは CR と LF）を書き、応答の頭を CR と LF の 2 組の並びまで読み、状態の行の 2 つ目の語が 200 で Content-Length の欄が在る時だけ、その長さの本文を読んだところで UTF-8 の字として返す（相手が閉じるのを待たない・Chrome の HTTP の口は応答の後も接続を保ちうる）。頭の欄は行ごとに最初のコロンで名と値に分け、名は大文字と小文字を区別せず、値は前後の空白を除いて読む（コロンの後の空白の有る形と無い形の両方を受ける）。繋げない・書けない・0 byte で閉じた（ssh の転送の先で Chrome が待っていない時は ssh が接続を閉じる）・200 でない・Content-Length が無い・REPLY_MAX を越える・時間切れはどれも答えが無いとする。Tunnel の drop は、子の ssh を proc の stop_with（道具は proc の KILL）で group ごと止め、dir を中身ごと消す（Chrome は端末で切り離されて残る・T1）。
      形（src/stage/json.rs と mod.rs）。json.rs に pub fn items（配列の &str を受け Option の Vec の &str・返りの寿命は受けた字と同じ）を unquote の前に足す。字の前後の空白を除いて字 [ で始まる配列の一番上の段の要素の字（前後の空白を除いた字・object と配列の要素は括弧ごと・字の値は引用符ごと）を並びの順に返す。要素の終わりは今の skip_value で見て、要素の後はコンマか閉じの括弧だけで、コンマの後には要素が要る（字 [1,]・[,1]・[1,,2] は None）。配列でない字・閉じの括弧の無い字・閉じの括弧の後に空白でない字の残る字も None。escape・member・unquote と私の fn と file の頭の //! の doc は変えない。mod.rs に doc の 1 行（行 i-2 で起動の引数 launch と、tunnel と窓を 1 回だけ起こすこと tunnel を置く旨・字 pub mod を含まない）と、pub mod launch の 1 行（pub mod json の後）と pub mod tunnel の 1 行（pub mod terminal の後）を足し、ほかの行は変えない。
      節の字。節の URL は字 http://127.0.0.1:4173/?a=1&b=2（shell の特別な字 ? と & を持つ）。節の Chrome の argv（term-a）の 7 語は /fake/bin/chrome・--app=http://127.0.0.1:4173/?a=1&b=2・--user-data-dir=/fake/profile-a・--remote-debugging-port=9224・--no-first-run・--no-default-browser-check・--window-size=900,760。節の起こす argv の 9 語は、term-a では -o・BatchMode=yes・-o・ConnectTimeout=10・-o・ControlPath=none・--・me@term-a と、遠くの shell の字の 1 語 'setsid' '-f' 'env' 'DISPLAY=:0' 'GTK_IM_MODULE=fcitx' 'XMODIFIERS=@im=fcitx' '/fake/bin/chrome' '--app=http://127.0.0.1:4173/?a=1&b=2' '--user-data-dir=/fake/profile-a' '--remote-debugging-port=9224' '--no-first-run' '--no-default-browser-check' '--window-size=900,760' </dev/null >/dev/null 2>&1。term-b では宛先が me@term-b で、遠くの shell の字の 1 語は 'setsid' '-f' 'env' 'WAYLAND_DISPLAY=wayland-1' 'XDG_RUNTIME_DIR=/fake/run-b' '/fake/bin/chrome' '--app=http://127.0.0.1:4173/?a=1&b=2' '--user-data-dir=/fake/profile-b' '--remote-debugging-port=9224' '--no-first-run' '--no-default-browser-check' '--window-size=900,760' </dev/null >/dev/null 2>&1。節の tunnel の argv（path /s/cdp.sock と term-a）の 13 語は -N・-o・ExitOnForwardFailure=yes・-o・BatchMode=yes・-o・ConnectTimeout=10・-o・ControlPath=none・-L・/s/cdp.sock:127.0.0.1:9224・--・me@term-a。節の HOME の語は、一重引用符で囲んだ --user-data-dir=・二重引用符で囲んだ $HOME・一重引用符で囲んだ /.cache/tsuzuri-stage を空白を挟まずにつないだ字。節の printf の書式は、字 printf と空白と、字 %s と逆斜線と 0 の並びを一重引用符で囲んだ字と空白。
      節の quote の表（5 つ）。字 abc には一重引用符で囲んだ abc の 5 字。空の字には一重引用符 2 つ。字 a と空白と b には一重引用符で囲んだその 3 字。字 it と一重引用符と s には、一重引用符・i・t・一重引用符・逆斜線・一重引用符・一重引用符・s・一重引用符の 9 字。字 $HOME;`id`&|<>* には一重引用符で囲んだその字。節の往復の 9 つの字は、quote の表の 5 つの字・字 日本・一重引用符 2 つ・a と二重引用符と b と逆斜線と c の 5 字・節の URL をこの順。節の 5 つの形の外の URL は、字 javascript:alert(1)・字 file:///fake/x.html・字 http://a と空白と b/・字 http://a/ と改行・空の字。
      節の /json/list の表（8 つ・page_resource の値）。(1) 節の偽の Chrome の LIST（type が service_worker で webSocketDebuggerUrl が ws://localhost/devtools/page/S1 の要素の後に、type が page で ws://localhost/devtools/page/P1 の要素）は字 /devtools/page/P1。(2) type が page の 2 つの要素（ws://localhost/devtools/page/P1 と P2 の順）の配列は字 /devtools/page/P1。(3) type が page で ws://127.0.0.1:9224/devtools/page/P9 の要素だけの配列は字 /devtools/page/P9。(4) 節の偽の Chrome の NO_PAGE（LIST の service_worker の要素だけ）は None。(5) 空の配列は None。(6) 空の object は None。(7) type が page で ws://localhost/devtools/browser/B1 の要素だけの配列は None。(8) type が page で鍵 webSocketDebuggerUrl の無い要素だけの配列は None。節の配列の表（9 つ・items の値）。前後に空白を置いた、数 1・鍵 a に配列 [2,3] を持つ object・字 x の値・配列 [4]・true の 5 つの要素の配列は、字 1・その object の字そのまま・引用符で囲んだ x の 3 字・字 [4]・字 true の 5 つの字をこの順。前後と中に空白を置いた空の配列は空の列。空の object・字 [1,]・字 [,1]・字 [1,,2]・字 [1] と空白と x・字 [1・空の字はどれも None。
      節の偽の場（歯の中で組む・本物の ssh と Chrome を撃たず網に出ない）。作業場は CARGO_TARGET_TMPDIR の下の stlaunch と歯の場の名の dir で、記録の置き場の dir と、偽の ssh（sh の script・権限 0755）と、印の file の path を持つ。偽の ssh は撃たれるたびに、記録の置き場の count の数に 1 を足した回の番号 n の file（n と字 .args）に argv を 1 行に 1 つずつ書いてから count に n を書き、最初の引数が字 -N（tunnel）なら、場によって exec sleep 30 で眠り続けるか exit 255 で終わり、そうでない回（窓を起こす回）は、場によって印の file を置いてから、または置かずに rc 0 で終わる。tunnel の dir は socket_dir に std の env の temp_dir を渡して作る（unix socket の path の上限を越えないため・着地済みの tests/stcdp.rs の偽の server も temp_dir の下の名 tzcdp- と process の id と番号の unix socket で待ち受ける）。偽の Chrome は歯の中の thread で、Tunnel の open の前に dir に SOCKET をつないだ path に std の UnixListener で待ち受け（open は socket の在るのを見て Ok を返す）、接続ごとに要求の頭を CR と LF の 2 組の並びまで読み、頭が Host の欄 localhost の行を持つことを見て、要求の行から末の空白と HTTP/1.1 を除いた字（例 字 GET /json/version）を受けた順に記し、印の file が無ければ何も書かずに閉じ（動いていない Chrome の先の ssh の転送と同じ）、在れば path が /json/version なら VERSION（鍵 Browser の字 Chrome/146.0.0.0・Protocol-Version の字 1.3・webSocketDebuggerUrl の字 ws://localhost/devtools/browser/B1 の object）を、/json/list なら場の LIST か NO_PAGE を、状態 200 の頭（/json/version は欄の名と値の間に空白を置かない Content-Length・/json/list は名を小文字にしてコロンの後に空白を置く content-length）と本文の 2 回に分けて（間に 20 ミリ秒）書き、閉じずに相手が閉じるまで待つ。印の file は、場 running と nopage では始めから置き、場 raise では窓を起こす回の偽の ssh が置き、場 closed と once では置かない。偽の ssh の記録は count が待つ回の数になるまで 5 秒まで待って読む（open が Ok を返した時に tunnel の回の記録がまだ書かれていないことがあるため、歯は window の前に 1 回目の記録を待つ）。
      窓を前に出さない・動かさない・足さない（持ち主の裁定 t3-hub.59.5 と t3-hub.59.7・判断の記録 ADR-15 の決定 (6)・要件 FR16）。この行は CDP の method を撃たない（撃つのは src/stage/cdp.rs の Session で、その語彙は窓を前に出す・動かす・新しい窓の method を持たない・歯 stage_cdp_window_never_raised）。Chrome の HTTP の口のうち、新しい tab か窓を足す path（json/new）と頁を前に出す path（json/activate）も撃たず、撃つのは /json/version と /json/list の GET だけ（done (9)〜(13) が偽の Chrome の受けた要求の行で、done (15) が launch.rs と tunnel.rs の字で見る）。窓を起こすのは window の may_open が真で Chrome が 2 度とも答えない時の 1 回だけで、起こした Chrome が答えなくても起こし直さない（done (12)）。頁の target が無い時は、may_open が真でも窓を足さず Absent の 1 行で名指す（done (13)・計画の行 i-2 は頁の target が無くても新しい窓の Target.createTarget を起こさないとし、この行は json/new も撃たない・app mode の Chrome は最後の窓を閉じると終わるので、頁の無い Chrome が残るのは背景で動く app の在る時だけの見込み）。may_open を真にするのは、表示先に初めて見せる時（行 i-7 の印）と持ち主の tz stage open（行 i-5・計画の行 i-5 の字と持ち主の裁定 t3-hub.59.7 がこの名を決める）だけで、呼ぶ側の行が持つ。Absent の 1 行は窓が無いことだけを名指し、board の URL の 1 行は tz の口の行 i-5 が出力の最後に出す（計画の行 i-5 の字・持ち主の裁定 t3-hub.59.4）。起こした窓は、タイル型の窓の管理では今見ている仮想の机に tile として出て、その後の置き場は持ち主に任せる（Chrome の argv に窓の位置の旗を持たない・--window-size はタイル型では効かない）。PORT で答える Chrome は表示面の専用の profile の Chrome とみなす（持ち主の普段の Chrome は既定の profile で、Chrome 136 からは既定の profile で remote debugging の口が開かない・公開の告知・この server では確かめていない）。見込みの外。tz の撃ちが 2 つ同時に Chrome の答えの無いのを見て両方が起こすと、後の Chrome は同じ profile の先の Chrome に --app の URL を渡して窓が 2 つになりうる（同時の撃ちを 1 つにする錠はこの行に置かず、置くなら tz の口の行 i-5 か表示先の設定の行 i-7 で持つかを席が決める・notes）。unix socket への ssh の -L は OpenSSH 6.7 からで、この server の OpenSSH は 9.6（見積りの T3）。
      Os の分けと、画面の env と、port と大きさ（席の決め）。起動の引数は Terminal の os の値でだけ組み分け、host の名を見ない（条 N-7）。この行が持つ窓を起こす形は linux だけ（setsid の -f と env と Chrome の argv）で、macos と windows の端末は、窓を起こす形をまだ持たない旨で名指して断る（形を捨てる決めでなく、この行の範囲の決め）。判断の記録 ADR-5 の決定 (5) は Windows の端末を標準の OpenSSH server で同じ形で届けるとするが、見積りの T8 は ssh から起こした GUI が Windows の持ち主の画面に出ない見込み（推定・確かめていない）で試作が要るとし、ADR-15 の決定 (3) は持ち主の最初の PC 1 台から始め Windows の PC は後で別に問うとする。mac の端末の行は無い。Windows と mac の起こす形は、その試作と問いの後の行で足す（notes）。tunnel は OS によらずこの server の側の ssh の -L なので分けない（done (6) が見る）。画面の env は層 A の行の display か display-env の値のまま渡し、Chrome を Wayland で描かせる旗は足さない（2026-09-25 の実証は WAYLAND_DISPLAY・DISPLAY・XDG_RUNTIME_DIR の 3 つで起こした・見積りの T9・持ち主の最初の PC の行の display-env に何を書くかは層 A を書く器の席が決める・notes）。port は、表示面の専用の profile の Chrome だけが使う tsuzuri の決めの値で、どの端末でも同じ 9224（Chrome の既定の慣習の 9222 と、2026-09-25 の実証で使った 9223 を避けた）で、端末ごとの値でない。層 A の key の集合は閉じていて port の欄を足せない（器の答え S2-1）。窓の大きさ 900,760 は 2026-09-25 の実証の値。port を 0 にして Chrome が profile の dir に書く DevToolsActivePort の file を ssh で読む案は、ssh の往復が 1 つ増え、OS ごとの読みの命令が要り、古い file の扱いも要るので採らない（席が決める・notes）。
      着地済みの歯（直さずに通る・main 594131f の workspace を grep で確かめた）。行 i-3 の tests/stcdp.rs（write-set の =）は、stage_cdp_shape_and_consts で json の escape・member・unquote を型を書いた fn の値に束ね、stage_cdp_json_helpers でその値を見て、stage_cdp_no_script_port と stage_cdp_window_never_raised で src/stage の ws.rs・json.rs・cdp.rs の字（注釈を含む）に unsafe・print!・println!・callFunctionOn・compileScript・runScript・addScriptToEvaluateOnNewDocument・Debugger.・bringToFront・activateTarget・createTarget・setWindowBounds が無いことを見る。この行が json.rs に足す items と doc はこのどの字も持たず、ほかの fn を変えない。stage_cdp_no_script_port の pub fn の名の数えは cdp.rs だけを読む。行 i-1 と i-1b の tests/stterm.rs と tests/stdenv.rs は src/stage/terminal.rs と fixture だけを読み、この行はどちらも書かない（この行の歯は fixture を読むだけなので fixture を置き場だけの = で持つ）。tests/brand.rs の brand_path_written_once_in_contract は 3 つの crate の src の下の全部の rs の file を歩いて引用符で囲んだ /api/project を数え、この行の新しい file は引用符で囲んだ /api/ で始まる字を持たない。tests/hbproc.rs の hbproc_definitions_move_out_of_ledger は src/server/proc.rs の capture と stop_with の字を見て、この行は proc.rs を書かず使うだけ。tests/hbroute.rs・hbpost.rs・hbconf.rs は src/server の下と main.rs と決まった歯の file だけを読み、この行はどれも書かない。xtask の skeleton_ の歯は Cargo.toml と Cargo.lock を読み、この行は触らない。xtask の check は build と歯の全部と clippy（全部の target・警告を誤りにする）と面の wasm の clippy を撃つ。着地済みの verify の filter のうち --test を持たずに境界の crate の全部の歯の binary を選ぶ語（account_・acctwire_・hook_・server_・stage_・tz_）は、この行の歯の名のどれも部分の字として含まない（stage_ は傘の行 i の filter で、この行の名は stage_ を含まないので傘の filter はこの行の歯を選ばない）。
      測り方。新しい歯の file は境界の crate の tests/stlaunch.rs（席の下書きで約 800 行・受付の上限 1500 の内）で、名を launch_ で始める（名は done の 16）。端末の Terminal は CARGO_MANIFEST_DIR の 2 つ上の tests/fixtures/stage/terminals.toml の字を src/stage/terminal.rs の lookup で引き、直した Terminal は struct の更新の字で組む（欄はどれも pub）。受入 AC13 の red_test の字は端末の行 2 つ（ssh 可・不可）の fixtureとするが、fixture の term-a と term-b はどちらも ssh の宛先を持ち（届くかどうかは宣言の欄に無い）、届くかどうかは偽の ssh の rc で決める。この行は届かない場の done (14) を term-b で見る（done (11) は起動の env の 2 つの組み方を見るため term-b も届く場で撃つ）。使う item は tsuzuri_boundary の stage の json（items）・launch（PORT・WINDOW_SIZE と 6 つの pub fn）・terminal（Os・Terminal・lookup）・tunnel（SOCKET・socket_dir・Tunnel・Window）で、lib.rs の pub mod stage と mod.rs の pub mod の行で外から見える。型は型を書いた fn の値に束ねる（items は寿命を書いた fn の型・socket は &Tunnel を受け &Path の型）。done (2) と (5) の sh は PATH の sh で、ssh でも Chrome でもない。done (7) の権限は std の os の unix の fs の PermissionsExt の mode の下 9 bit で見て、作った dir は歯の終わりに消す。done (12) と (14) は std の time の Instant で撃つ前後を数え、上の限りだけを見る。done (15) は src/stage の launch.rs と tunnel.rs と mod.rs の字を注釈ごと読む（字 print と ! は歯の中でつないで組む）。done (17) は tests/stlaunch.rs の字を読み、test の属性の行の次の fn の名を全部集め、下の filter の語を空白で区切った 1 つの字の定数（concat で組む・語の数 121）と照らす。偽の場の歯（done (9)〜(14)）は、歯の終わりに Tunnel を drop してから偽の Chrome の thread を止めて join する。
      filter の語（main 594131f の contracts の全部の verify の filter の語のうち、ほかの語を部分の字として含まない最小の語・121 語・この行の接頭辞 launch_ は並べない）は aaround_・accept_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・board_min_・bport_・brand_・btuck_・cadopt_・cgdom_・cmark_・contract_form_・cround_・csled_・denv_・ecache_・flight_・fmark_・frame_・fserve_・fstop_・gapspage_・gfresh_・ghb_・glabel_・gnav_・graph_・gsum_・gtuck_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hfig_・hook_・hruling_・hsblock_・hsderive_・hspage_・hsym_・iclose_・ilink_・kcli_・klink_・lcard_・ledgerblock_・lhome_・lspark_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・parts_・pclosed_・pfold_・pipe_・plimit_・pmore_・pquest_・project_・ptitle_・pwhole_・qblock_・qgate_・qkey_・question_・rhold_・runsdoc_・saxis_・sclosed_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_ で（字 stage_term_・stage_cdp_・acctframe_・mapgraph_ などの長い語は、この中の語を部分の字として含むので並べない）、新しい歯の名から先頭の launch_ を除いた字は、このどれも部分の字として含まない。contracts の verify の filter の語に字 launch を含む語は無く、main の workspace の rs の file で字 launch を含むのは、着地した行 g-closed-mark の歯 tests/cmark.rs の filter の表の字 stlaunch_ だけ（grep で確かめた・その行の起草がこの行の試作の歯の file の名を接頭辞と読んだ字で、この行の名はどれも字 stlaunch_ を含まず、その歯は自分の file の名だけを見るので互いに落ちない）。launch_env と launch_argv は src の関数の名で、test の属性を持たないので filter の launch_ に選ばれない。
      依存と順。depends は空（行 i-1・i-3 はノート surface-wavei、i-1b はノート surface-wavei2 の着地済みの行で、depends は同じノートの中の行しか引けない・i-1b は 22661d6 で着地し、Terminal の欄 display_env と fixture の term-b の display-env の行はこの行の歯が読む）。計画の 5 節の鎖では boundary/stage/mod.rs は i-1 → i-3 → i-2 → i-4 → i-5 → i-7 → i-10 で、この行の後に mod.rs を書く後の行（i-4 ほか）は、そのノートを置く時に便の bead の依存でこの行の後に置く。json.rs は行 i-3 の file で、書く後の行は今の計画に無い。器は走行中の行と write-set が重なる行（置き場だけの = 同士も）を断るので、ほかの行との順は便の bead の依存で持つ。main 594131f の contracts の行のうち、この行の write-set と = を含めて重なるのは着地した行 i・i-1・i-3・i-1b だけで、走行中と起草中の第 11 波の行（ノート surface-wave11a・surface-wave11b・surface-wave11d と起草中の h-next-unknown・書く file は面と境界の server と中核）とは重ならない。外の依存は足さず、Cargo.toml と Cargo.lock は触らない。src の file の大きさ（席の下書きを rustfmt で整えて数えた）は、launch.rs が 146 行、tunnel.rs が 226 行（どちらも大きさ M の 1 file の見積り 300 の内・1 つの file にまとめると 300 を越えたので、純粋な関数と撃つ側を 2 つの file に分けた）、json.rs は 181 行から 211 行、mod.rs は 8 行から 11 行（受付の上限 1500 から遠い）。
      決定はしご（条 P-27）と試し。要るか: 要る（要件 FR16 の起動と tunnel）。既に在るか: 起動の引数と tunnel は無く、子の process を group で撃って止める部品（src/server/proc.rs の capture と stop_with）と JSON の値の切り出し（src/stage/json.rs）は在るので使い回し、JSON の配列の要素の切り出しだけを json.rs に足す（同じ読みを 2 つ持たない）。標準 library で足りるか: 足りる（ssh と Chrome は端末と server に既に在る道具・HTTP の GET は std の UnixStream で書ける・境界の crate の std だけの歯 skeleton_boundary_std_only_and_bin_tz のまま）。席の下書き（repo の外の写しの workspace で、cargo の offline の build と nextest と clippy〔全部の target・警告を誤りにする〕と xtask の check を撃った）で、stlaunch の 16 本と stcdp の 16 本と境界の crate と xtask の全部の歯が通り、clippy が警告 0 で、stlaunch を 15 回続けて撃って落ちないことと、window の枝（動いている Chrome を使う・may_open の時だけ起こす・起こさない時に頁が無ければ Absent・答えの無いのを 2 度見る）を 1 つずつ壊すと歯が落ちることを確かめた。

