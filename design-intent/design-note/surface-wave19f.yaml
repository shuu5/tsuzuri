sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      質問の頁の答えの口（裁定・束・取り消しの POST）が、席や器が台帳を書いている間の読みの落ちで断らず、送れた答えも席への配達で待たせないようにする、境界の crate の行 1 つ。
      今の口は書きの前の台帳の読みを 1 度だけ撃ち、読めなければすぐ 503 で断る。台帳の store は読みも排他の錠を取るので、ほかの書きの間は読みが上限の 5 秒を越えて落ちうる。配達（器の配達の口と印の書き）も応答の前に同期で撃つ。
      直しは、書きの前の読みを 1 秒空けて 3 回まで撃ち直し、bdw の 1 回の書きを 120 秒まで待って途中で止めず、配達を応答の後の thread へ回し、断った時に状態の code と理由と問いの id を server の標準エラーに 1 行書くこと。
      bdw の書きの撃ち直しと記帳の前に応答を返す形と、面の送っている間の字と断りの見せ方は、後の行に預ける。電文・契約の型・面・外の依存は変えない。
