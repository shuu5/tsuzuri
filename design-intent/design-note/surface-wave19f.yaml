  - n: 3
    type: prose
    title: 行 e-ruling-retry — 答えの口を台帳の錠の間も待って受け、配達で応答を待たせない
    body: |
      在りかの main は b640c63（計画 surface-plan 第 0.68 版）。この行は計画だけの行（9 節）を経ずにノートへ置く欠陥の直し（計画 3 節の席の決め・第 0.16 版の e-idle-close と g-graph-label と同じ扱い）で、承認は計画の裁定を継ぐ。行の拠りは持ち主の報告（2026-09-29）と席の調べ（同日）。
      なぜ。持ち主の報告では、質問の頁で答えの button を押すと送れずに button がまた押せる形に戻ることが 2 度続き、3 度目で送れ、どの押しでも送るまでかなり待たされた。答えの口（境界の server の server/ruling.rs の fn accept）は、台帳を子 process の bd の読みで読み直し（上限 BD_TIMEOUT 5 秒）、読めなければすぐ 503 で断る。bd の組み込みの store は読みも排他の錠を取るので、席や器が台帳を書いている間（bdw の書きと書いた後の書き出しと同期）は読みが 5 秒を越えて落ちうる。起草の測り（2026-09-29・席の board の server が動いている時）では、同じ読みが 4.8 秒と 1.4 秒と 1.5 秒で返り、上限の縁にある。席の測り（同日）では、空いた周の bdw の書きは 1.9〜3.4 秒（錠の待ち 1 ms・bd の実行 1.0〜2.5 秒・jsonl の書き出し約 0.8 秒）、大きな notes を持つ bead への追記 1 回は 32.7 秒で、今の WRITE_TIMEOUT 30 秒を越えて 502 になる。応答の前には、追記と閉じるの 2 つの bdw の書き（上限 WRITE_TIMEOUT 30 秒・bdw は機械で共通の錠を 60 秒まで待つ）に続けて、配達（台帳の読み直し・器の配達の口 DELIVER_TIMEOUT 10 秒・印の bdw の書き）も同期で撃つので、送れた押しも待たされる。server は断りを log に書かないので、どの状態で断ったかは残らない。
      在りか・server/ruling.rs（write-set）。fn accept（裁定の受付）と fn revoke（取り消しの受付・行 e-revoke）は、書きの前の読みを Source の fn text_alone で 1 度だけ撃つ。配達は fn deliver（台帳を読み直し、印の無い裁定が在れば器の配達の口を 1 度撃ち、rc 0 なら印を置く）を応答の前に呼ぶ（accept と、revoke の私的な fn reopen）。bdw の書きは私的な fn write（capture を WRITE_TIMEOUT で 1 度）。server/batch.rs（write-set）の fn accept（束の受付）も読みを text_alone で 1 度撃ち、行ごとの書きの後に deliver を呼ぶ。口の file は server/routes の ruling.rs・revoke.rs・batch.rs（どれも write-set）で、受付の結果を状態の code と本文に写すだけ。
      形（ruling.rs）。pub const READ_TRIES（u32 の 3・書きの前の読みを撃つ回の上限）・pub const RETRY_STEP（Duration の 1 秒・撃ち直しの前に空ける時間）・pub const REFUSED_LOG（字 tz surface serve: 断った）を足し、pub const WRITE_TIMEOUT を 30 秒から 120 秒にする（bdw が自分の錠を待つ上限の既定 60 秒に書きそのものの 60 秒を足した長さ・bdw は錠を待ちきれなければ書かずに落ちるので、server が書きの途中で bdw を止めない）。WRITE_TIMEOUT は方針の受付（server/policy.rs）と停止の hook（hook/stop.rs・自分の残りの時間との小さい方）も使うので、どちらの書きも同じ上限になる（どちらの file も書かない）。pub fn reread(ledger: &Source) -> Option<String> は text_alone を撃ち、None なら RETRY_STEP を空けて READ_TRIES 回まで撃ち直し、最初に読めた字を返す（1 回の読みの上限は今の BD_TIMEOUT のまま・最悪は 3 × 5 秒と 2 × 1 秒の 17 秒）。accept と revoke と束の accept は書きの前の読みを reread に替える（読めない時の応答は今と同じ 503 ledger-unknown）。配達は、accept と reopen と束の accept が Delivery と Writer と Source と id と Pending の列を clone して std::thread::spawn の中で deliver を呼び、待たずに Recorded を返す（deliver の本文と、器の配達の口の引数の列と、受けない時の標準エラーの 1 行 NOT_TAKEN は変えない）。pub fn refusal_line(path: &str, status: u16, body: &[u8], questions: &[&BeadId]) -> String は「<REFUSED_LOG>: <path> <status> <応答の本文の字の前後の空白を除いた字>・問い <問いの id を , で並べた字>」を返す。口の 3 つの file は受付の結果から応答を作った後、状態の code が 200 でなければ refusal_line の 1 行を eprintln で書いてから応答を返す（束は要求の全部の行の問いの id を並べる）。本文を読めない要求の 400 と Origin の 403 と 413 は guarded が先に返すので書かない。逐語は log に書かない（応答の本文にも逐語は無い）。
      変わらない物（歯で測らず、この行の差分で持つ）。bdw の書きは今のまま 1 度だけ撃ち、落ちれば今と同じ 502（追記が落ちた・閉じるか開き直しが落ちた・束の行の結果）。応答の状態の code と本文の字、digest の比べ、id の発行、notes の定型行の字、方針の受付（server/policy.rs）、取り消しの開き直しだけの撃ち直し（pending_reopen）、GET の口の読み（見張りの読み・持ち回し）、http.rs と mod.rs は書かない。配達が応答の後になるので、server が配達の途中で止められると印が置かれないが、印の無い裁定は今と同じく席の停止の hook が拾う（NOT_TAKEN の字の決め）。
      決めた幅（起草の決め）。直しの形は 3 つを比べた。(i) 書きの上限を延ばす（採る）: 書きの途中で止めないので、書けたか分からない 502 が無くなる。待ちは長くなりうる（書き 2 回で最悪 240 秒・空いた周は今と同じ 2〜7 秒）。(ii) 記帳の前に 200 を返し、書きを server の中で撃ち直す（退ける・後の行の候補）: server が落ちても答えを失わないよう、追跡しない file に先に書いて起動で残りを撃つ持ち方が要り、server は file を書かない決め（server/mod.rs の doc）を替えることになる。面に記帳待ちの状態を見せる電文の欄（契約の変更）も要り、S と M を越える。(iii) 面の見せ方（送っている間の字・記帳待ち・断りの目立つ形）は後の面の行に預ける（ask.rs は g-tick-adopt の後）。読みの撃ち直しを回の数で縛るのは、偽の bd がすぐ落ちる歯で待ちが 2 秒で済み、錠で塞がった本物の読みでは 17 秒まで待てるから（時の長さで縛ると、今の 503 を見る着地済みの歯が毎回その長さを待つ）。書きの撃ち直し（落ちた bdw の書きの後に台帳を読み直し、書けていなければもう 1 度撃つ）はこの行に入れない。bdw は機械で共通の錠を自分で 60 秒まで待つ。rc が 0 でない書きが書けたかは読み直さないと分からない。着地済みの 502 の歯（server_ask_write_failures_are_502・server_batch_write_failure_is_502_with_done_rows・rvk_write_failures・bhalf_step_k_of_n・bhalf_resend_rest）は「1 回目が落ちれば 2 回目を撃たない」を測る。この 3 つの理由で、書きの撃ち直しは後の行に預ける（席が決める）。
      着地済みの歯（境界の crate の tests を grep で確かめ、試作で撃った）。配達が応答の後の thread になるので、応答の直後に偽の bdw と偽の器の回を数える着地済みの歯は、待ちを足して直す（歯の期待の回の数と字は変えない）。server_ask.rs・server_batch.rs・rvk.rs は作業場の Place に私的な fn wait(name, n)（n 回目の cwd の記録の file が空でなくなるまで 10 秒まで待つ）を足し、bhalf.rs は同じ名の fn（n 回目の argv の file が 3 行になるまで待つ）を足し、回を数える前に呼ぶ（server_ask の 5 本・server_batch の 5 本・rvk の 2 本・bhalf の 1 本）。偽の bdw の記録は同時に撃たれると回の数を失うので、束の後に方針を送る server_batch の 2 本は、束の配達の印を待ってから次を送る。tz を撃って標準エラーを読む server_ask_failed_delivery_stays_200_with_stderr_line と fserve_batch_refusal_logs_once は、NOT_TAKEN の行が出るまで標準エラーを読んでから tz を止める。rvk_ruling_rs_text の revoke の本文に在るべき字の一覧の text_alone() を reread( に替える。fserve_words_and_deliver（accept の本文に字 deliver( が在る・ruling.rs の deliver_argv( は 2 つ）は直さずに通る。
      測り方・歯（tests/eretry.rs・新しい file・接頭辞 eretry_）。受付は server を立てずに ruling::accept・ruling::revoke・batch::accept を受付の時刻の const NOW で直に撃つ（server の台帳の見張りの読みが偽の bd の回を数えに混ぜないように）。偽の bd は作業場の file bd.fails の数の回までは rc 1 で落ち、その後は out.json を出す。偽の bdw と偽の器は回ごとに argv を記録し、argv を書き終えたら回ごとの done の file を置く。偽の器は門の file gate を 9 秒まで待ってから終わりの印 scribe2.end を置く。見本は着地済みの fixture の surface/question-2.json（open の問い fx-ask.3・closed の問い fx-ask.1 とその裁定 fx-ask.1:20260924T0200Z-1）と surface/question-batch.json（fx-b.2・fx-b.3）を読むだけで、fixture の file を足さない。log の歯だけ tz（CARGO_BIN_EXE_tz）を 127.0.0.1 の空き port で撃ち、見た版の違う要求（409）と、bd.fails を大きくして読めなくした要求（503）を送り、tz を止めてから標準エラーを読む。逐語には log に出ない字（秘めた言葉）を使う。歯の名は eretry_read_retries_then_writes・eretry_deliver_after_reply・eretry_refusal_logged。使う item は server::ledger::Source・server::ruling の accept・revoke・line・Outcome・Revoked・Writer・Delivery・PATH・READ_TRIES・RETRY_STEP・REFUSED_LOG・server::batch の accept・Outcome と、契約の型の RulingRequest・RevokeRequest・BatchRequest・BatchItem・RulingId・BeadId・LedgerWrite（どれも pub）。
      filter の語。main の contracts の verify の filter の語 256 のどれも、接頭辞 eretry_ と 3 つの歯の名に部分の字として含まれず、接頭辞と名もどの語にも含まれない（確かめた）。直す着地済みの歯は、今の filter の語 server_ask_・server_batch_・rvk_・bhalf_・fserve_ のまま verify で撃つ（ruling.rs の単体の歯 server_ask_ はこの行で変えないので xtask check が撃つ・--lib の filter の語 server_ask_ は write-set の外の http.rs の単体の歯にも当たるので verify に入れない）。
      依存と順。depends は空（ノートの行は 1 つ）。計画 9 節の計画だけの行 e-approval-event と e-multi-ask も ruling.rs を書くので、この行の後に流す（計画 5 節の鎖）。境界の server の mod.rs（a-lean）・http.rs と files.rs（g-gz）・board.rs（k-sum-count）・ledger.rs は書かない。書く歯の file 6 つを書く走行中と待ちの便は無い。
      範囲の外。落ちた bdw の書きの撃ち直しと、記帳の前に 200 を返す形（上の決めた幅）。面の送る button の送っている間の字・断りの目立つ見せ方と次の手（後の面の行）。方針の受付の口と、GET の口の読みの上限（NFR2・R-21 の 5 秒）。1 つの bdw で追記と閉じるを 1 度に撃つ形（契約の LedgerWrite の変更）。

