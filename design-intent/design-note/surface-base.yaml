sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      面の便のうち、画面を持たない土台の 6 便（骨格・契約の型・導出グラフと不変条件・台帳の指標と次の一手・面の server・席の hook）を契約表の行にする。
      部品・口・歯・節点・辺・不変条件・契約の型・器に頼む口の閉じた一覧は設計ノート surface が持ち、ここには写さない。
  - n: 2
    type: prose
    title: 便 a — workspace の骨格
    body: |
      cargo の workspace と 4 つの crate（契約の型・中核・境界・面）と xtask の空の骨格を置き、器の宣言（.vessel.toml）を cargo の形に改める。
      crate は空の lib で、契約の型の crate が骨格の歯を 1 本持つ。依存は serde に限る。xtask は cargo run -q -p xtask -- の形で起動し、alias の file（.cargo/config.toml）は置かない。
      xtask の check は workspace の build と歯の全部（cargo nextest run --workspace）と clippy（warning を error にする）を順に撃ち、最初に落ちた段の rc を返す。
      xtask の歯（接頭辞 skeleton_）は 3 本。workspace の member が 5 つであること、.vessel.toml の common-verify が cargo run -q -p xtask -- check の 1 行であること、Cargo.lock の workspace の外の package が serde と serde の導出が連れて来るものだけであること。
      target の dir と器の作業場（.worktrees の dir）は .gitignore で版管理の外に置く。trunk はこの便では入れない。面の便で xtask の下から呼ぶ形にして、器の allowed-commands は cargo と git のままにする。
  - n: 3
    type: prose
    title: 便 b — 契約の型
    body: |
      server と面と hook が共有する型を契約の型の crate に置く。面の event・面の状態・問いの合図・裁定の要求と応答・束の要求と応答・方針の要求・台帳への書き（閉じた enum で bdw の argv を組む）・グラフの節点と辺・板の型。
      面の側に電文の写しを書かない。型の外形は snapshot の歯で pin する。snapshot は全型の見本の値を JSON にした 1 つの file で、歯は標準 library で字を比べる（snapshot の道具の依存は足さない）。
      電文の形は JSON なので、依存に serde_json を 1 本足す（条 A-3 の持ち主の確認の後に便を起こす）。便 a の xtask の歯（Cargo.lock の外の package の許可の一覧）に serde_json とそれが連れて来る package を足す。
      台帳への書きの歯は、argv の形（notes を置き換える旗が無い・子を作る argv は親を持つ）を契約の型の crate の中で測る。器の起票の門の判定の純関数に掛ける歯は、器の code の持ち込みの後の便で足す。
  - n: 4
    type: prose
    title: 便 c — 導出グラフと不変条件と近傍
    body: |
      設計の索引と台帳と走行を 1 つのグラフに毎回組み直す純粋な関数を中核の crate に置く。不変条件を 3 値（合格・違反・まだ分からない）で数え、近傍を返す。
      入力は 3 つの字で、関数は file も子 process も触らない。設計の索引（設計の道具の graph の口が出す節点と辺の表・タブ区切り）・台帳の一覧（bd の読み取りの口が返す JSON）・器の event log（1 行 1 件の JSON）。読めない入力はその種類の節点だけ「まだ分からない」にして、ほかの種類は組む。設計文書の YAML は読まない（YAML の読み手の依存を足さない）。
      節点。設計の索引の節点は表の行をそのまま写す（種類は 条・規範文・規則行・目的・要件・非機能要件・受入基準・制約・登場人物・出力・判断の記録 の 11）。bead の種類はこの順に決めて、どの bead も 1 つに当たる。bd の種類が epic なら epic、label intake:memo を持てば memo、label intake:question を持てば問い、それ以外は契約。走行は event log の RunCreated の 1 件が 1 つ。裁定と受けと方針は、bead の notes の定型行 1 行から 1 つずつ導く。定型行は行頭の字で見分け、「裁定 id = 」は裁定、「受け id = 」は受け、「方針 id = 」は方針で、id はその字の後から最初の「・」までの字。設計ノートの行はこの便では節点にしない。
      辺。設計の索引の辺は表の行を写す。型は 3 列目の字で、閉じた一覧の 17 型（in-article・relations.articles・relations.reqs・relations.rules・relations.sections・amended_by・article・refs・basis・goals・rules・adrs・verify.ac・verifies・figures・produced・amends）の内側だけを組み、一覧に無い字の行は組まずに数える。台帳の辺は bead の dependencies の欄から組み、型は parent-child・blocks・relates-to・discovered-from の 4 つで、ほかの型は組まずに数える。answers は裁定から、その定型行を持つ問いの bead へ。touches は問いの bead の metadata の touches の欄の id へ。premises は問いの metadata の premises の欄の方針へ。source は memo の metadata の source の欄の裁定か走行へ。run_of は走行から、run の id の前半（時刻の前の字）の bead へ。raised は走行から、event の QuestionRaised が名指す問いへ。口座は節点にせず、走行の属性に持つ。design と ruled_by の辺は、先の節点（設計ノートの行と承認欄）がこの便に無いので組まない。契約の pointer の行（acceptance の中の「design = 」で始まる行）は契約の属性に持つ。
      不変条件のうち、この便で数えるのは 9 本。g-1 組んだ辺の両端の節点が実在する。g-2 open の契約は pointer の行をちょうど 1 つ持つ（closed の契約は数えない）。g-4 open の問いは metadata の touches の欄に id を 1 つ以上持つ。g-5 根（親を持たない epic）でない bead は、parent-child をたどって根に着く。g-6 blocks に輪が無く、parent-child は木。g-8 memo の label と pointer の行の両方を持つ bead が無い。g-10 設計の索引と台帳と走行の id が互いに重ならない。g-11 走行は run_of の先の bead を持つ。g-12 段が Questioned の走行は raised の辺を持つ。残りの 3 本（g-3 発効した記録は裁定の行を持つ・g-7 宙に浮いた裁定 0・g-9 名指した id は欄にも在る）は、材料が 3 つの入力に無いので、つねに「まだ分からない」を返す。
      近傍は、1 つの節点から根拠の側（辺を逆にたどる）と影響の側（辺を順にたどる）を各 2 段たどって返す。次数が 30 を超える節点は hub で、hub から先は広げず、切った理由と hub の次数を返す（規則の行 R-20 の値）。
      fixture。実物の入力の見本（tests/fixtures/graph/real の索引と event log、tests/fixtures/ledger の bd-list-8.json）は設計席が置いた。この便が作るのは 5 つ。violations.json は数える 9 本のそれぞれについて入力の組を 1 つ持ち、組ごとに、違反になるはずの条件の一覧を欄に持つ（1 つの欠陥が 2 本に当たる組は 2 本を書く）。hub-619.json は子を 619 本持つ epic を 1 つ含む。runs-5.json は同じ bead の走行を 5 つ含む。no-state.json は event log の字が空の入力。unruled.json は定型行の無い閉じた問いを 1 つ含む。
      依存は serde_json を中核の crate に足す（workspace には便 b で入っている）。入力を読んで口に出す側（子 process と server の口と tz graph の口）は境界の crate の後の便が持つ。
  - n: 5
    type: prose
    title: 便 d — 台帳の指標と未反映と次の一手
    body: |
      台帳の指標と未反映の一覧と次の一手と pipeline の板を、中核の crate の純粋な関数に置く。入力は便 c と同じ字（台帳の一覧の JSON・器の event log）と今の時刻（引数）で、関数は file も子 process も時計も触らない。字を読んで口に出す側（server の口）は境界の crate の後の便が持つ。
      電文の型は契約の型の crate に足す。足すのは 2 つ（台帳の指標 LedgerStats・次の一手 NextStep）で、pipeline の板は着地済みの型（PipelineBoard と PipelineCard）を使う。足した型は便 b の snapshot の歯で pin する。
      数え方は見本の集計（docs/design/mock3/ledger.js の stats と judge）と同じにする。bead の種類は便 c と同じ順で決める（epic・memo・問い・契約）。指標が数える task は契約の bead。
      台帳の指標。open は status が closed でも tombstone でもない bead。blocked は open の task のうち、status が blocked のものと、status が in_progress でなく blocks の先に open の bead を持つもの。ready は status が open で blocks の先が全部閉じている task。時点 t の open の数は、created_at が t 以前で、closed_at が無いか t より後の task の数。純減 24h は今の open の数から 24 時間前の数を引いた値で、純減 7d は 7 日前の数を引いた値。closed/日 は直近 7 日に閉じた task の数を 7 で割った値。lead は直近 30 日に閉じた task の created_at から closed_at までの日数の中央値と p90 で、1 本も無ければ値なし。stale は updated_at が 7 日以上前の open の task。日ごとの 14 本は、その日に作られた数と閉じた数と、その日の終わりの open の数（burndown と sparkline の材料）。epic の進みは直下の task の閉じた数と全体の数で、直下の task が 0 本の epic は出さない。memo は open の数・昇格待ちの数（description に「昇格条件」の見出しの行を持つ open の memo）・直近 7 日に閉じた数・open の memo の年齢の中央値。種類ごとの open の数（task・memo・問い・epic）も持つ。作業中の数と最古の task は電文に持たない。
      判定は規則の行 R-18 の順に当てて最初の 1 つ。open の task が 1 本以上で stale の数が open の task の 0.5 倍を超えれば滞り。でなく純減 7d が 0 を超えれば積み増し。でなく closed/日 が 0.1 未満なら停滞。どれでもなければ順調。台帳の字が読めなければ台帳なし。閾値の定数（0.5・0・0.1・7 日）は 1 か所に置き、歯が rules の file（design-intent/rules.yaml）の行 R-18 の字と照らす（読むだけ・YAML の読み手は足さず、行の字を探す）。
      未反映の一覧は 3 種（memo・裁定・要望）を、種類ごとに「読めた一覧」か「まだ分からない」で持つ。memo は open の memo の全部（昇格先を指す辺がまだ無いので、open なら未反映）で、年齢の古い順。裁定（処分の宣言の無い裁定）と要望（反映されていない要望）は、材料（処分の宣言・要望の印）が入力にまだ無いので「まだ分からない」を返す。0 件とは区別する。指標の電文の未反映の数は memo の数で、分からない 2 種の名を欄に持つ。
      次の一手は、閉じた 7 種を規則の行 R-24 の順に判じる。電文は 7 種の 1 つずつについて、判じた結果（当たった・当たらない・判じなかった の 3 値）と件数と対象の id を順に持ち、最初に当たった 1 つを「大きく出す 1 つ」として名指す（見本の画面は 1 つを大きく出し、残りを当たった・当たらないの印つきの一覧で出す）。この便の入力で判じられるのは 3 種。止まっている走行は、板の段が Questioned か Failed か Stopped の札で、その bead が open のもの（対象はいちばん古い札の bead）。質問は open の問い（対象は created_at がいちばん古い 1 本）。なしは、どれにも当たらないとき。残りの 4 種（限度と移動・応答なし・束の承認・発効待ち）は材料（席と口座の状態・束・発効待ちの記録）が入力に無いので、結果を「判じなかった」にする（後の便が材料と一緒に足す）。event log の字が読めなければ、止まっている走行も「判じなかった」にする。台帳の字が読めなければ、質問も「判じなかった」にする。なしは、判じた種類のどれも当たらないときに当たる。
      pipeline の板。札は bead ごとに 1 枚で、その bead の走行のうち RunCreated がいちばん新しい 1 つの、最後の event で段を決める。走行の回数は同じ bead の RunCreated の数。口座は、その走行の event の detail の「account:」の後の字のうち最後のもの。経過は今の時刻から最後の event の時刻を引いた秒。器の event から板の段への対応は閉じた表で持つ。RunDone は Landed。RunStage の Reviewed と Gated で detail が「verdict:FAIL」か「verdict:INCONCLUSIVE」で始まれば Failed（段の理由は detail の字）。RunStage の Gated でそれ以外は Gated。RunCreated と、RunStage の Reviewed（verdict が PASS）・Spawned・Implemented は Running。最後の event が QuestionRaised なら Questioned。走行を 1 つも持たない open の契約は、blocks の先に open の bead が在れば Blocked、無ければ Queued。Stopped はこの便の入力に材料が無いので作らない。表に無い段の名の走行は札を作らず、数だけを返す。event log の字が読めなければ、板の札は「まだ分からない」。
      fixture はこの便が作る。judge.json は見本の自己検査と同じ 7 組（滞り・積み増し・停滞・closed/日 がちょうど 0.1 なら順調・順調・台帳なし・open の task が 0 本なら滞りにしない）。stats-30.json は bead 30 本の台帳の一覧と今の時刻と、期待の指標の値。pipeline.json は対応の表の 1 行ごとに走行を 1 つ持つ event log と、期待の札。next.json は 3 種と event log が読めない組の 4 組。
      依存は足さない。中核の crate は便 c の着地で契約の型の crate と serde と serde_json に依存している（crates/tsuzuri-core/Cargo.toml の dependencies の 3 行）ので、Cargo.toml も Cargo.lock も触らない。
      歯が照らす規則の行の字（design-intent/rules.yaml・着地済み）。行 R-18 の value は「滞り = stale が open の task の 0.5 超・積み増し = 純減 7d が 0 超・停滞 = closed/日 が 0.1 未満・順に当てて最初の 1 つ・stale = 7 日 更新なし」。行 R-24 の value は「限度と移動 → 応答なし → 止まっている走行 → 束の承認 → 質問 → 発効待ち → なし の順に判じ 1 つを出す・応答なしは tick が stale のときだけ」。歯は字の在る無しでなく、字の全体を比べる。行 R-18 は、定数の 4 つの数を上の文の形に埋めて組んだ字（滞り = stale が open の task の <比> 超・積み増し = 純減 7d が <数> 超・停滞 = closed/日 が <率> 未満・順に当てて最初の 1 つ・stale = <日> 日 更新なし）が、rules の file の行 R-18 の value の字の全体と 1 字も違わないことを確かめる（定数のどれか 1 つを変えれば落ちる）。行 R-24 は、契約の型の 7 種の宣言の順に日本語の名を「 → 」でつないだ字が、行 R-24 の value の「 の順に判じ」より前の字の全体と 1 字も違わないことを確かめる（順を入れ替えれば落ちる）。
  - n: 6
    type: prose
    title: 便 e — 面の server
    body: |
      同期の server を境界の crate に置く。台帳の読み・裁定と束と方針の受付・承認の event の書き・SSE の配信・面の file の配布。
      このうち台帳の読みと SSE の配信と面の file の配布は、先に便 e-min が最小の形で置く（§9）。この便は受付と書きを足す。グラフと指標を配る口は便 c と便 d の着地の後にこの便が足す。
      台帳への書きは閉じた enum から bdw の argv を組む 1 経路だけで、repo の file も state dir の file も書かない。id は server だけが発行する。見た版が古い要求は 1 byte も書かずに断る。
  - n: 7
    type: prose
    title: 便 f — 席の hook と問いの起票の門
    body: |
      裁定が届いたときの席の起こし（器の配達の口と停止の hook の 2 経路）と、問いの起票の門（PreToolUse の guard・近傍の処分の宣言・束の要約値）を境界の crate に置く。
      席は自前の周期の読みを持たない。門は処分の無い id を全部名指して止める。
  - n: 8
    type: contract-table
    title: 契約表
