  - n: 9
    type: prose
    title: 便 e-min — 最小の server
    body: |
      最初の本物の画面を早く出すために、server の最小の形と tz の入口を先に置く（作る順の計画 2026-09-27・持ち主の承認）。
      server は標準 library だけで書く同期の server で、1 つの process と 1 つの port で動く。起動は tz surface serve で、引数は repo の置き場・bind 先・面の file の置き場の 3 つ。終了 code は 合格 0・不合格 1・まだ分からない 2。
      口は 4 つ。台帳の一覧（GET /api/ledger）・台帳の 1 本（GET /api/ledger/<id>）・変化の知らせ（GET /api/surface/events・SSE）・面の file の配布（それ以外の GET）。書く口は持たない。
      台帳は .beads の issues.jsonl を読むだけで、500 ミリ秒ごとに file の更新時刻と長さを見て、変わったら 1.5 秒以内に SSE で知らせる（要件 NFR2・規則の行 R-21）。読めないときは 0 件でなく測れていないの印を返す。
      bind 先は同じ端末の中（loopback）か tailnet の中だけで、それ以外は起動を断る（条 N-6）。tailnet の住所は引数で受け、版管理の file に書かない（行 D-4）。
      台帳の一覧の型は契約の型の crate に足し、snapshot の file に写す。
  - n: 10
    type: prose
    title: 便 e-src — 台帳の読みの出所
    body: |
      便 e-min は .beads の issues.jsonl を読む形で置いたが、この file は席の台帳の書き（bdw）の後にしか作り直されない。器が便を閉じても古いままで、画面に古い状態が出る（2026-09-27 の実測・scribe2 の memo s2-07l.677）。
      台帳の読みの出所を bd の読み取りの口に改める。server は子 process を 1 本撃つ。引数は --readonly list --all --limit 0 --json で、cwd は repo の置き場、標準入力は空、標準エラーは捨てる。program の名は既定が bd で、引数（--bd）で替えられる。歯は偽の bd を一時の dir に置いて回す。
      起動できない・rc が 0 でない・JSON として読めない・5 秒を超えて返さない、のどれでも、0 件でなく測れていないの印を返す。5 秒は要件 NFR2 の上限（規則の行 R-21 の値）。
      変化の印は .beads の issues.jsonl と interactions.jsonl の 2 つの file の更新時刻と長さで、500 ミリ秒ごとに見る。どちらかが変わったら 1.5 秒以内に読み直して SSE で知らせる。前の file は席の書きで、後の file は器の close を含む状態の変更で動く。
      印の取りこぼしを拾うために、印が動かなくても 5 秒ごとに読み直す。読みの結果が前と同じなら知らせない。issues.jsonl の中身を読む経路は残さない。
      台帳の一覧の型に親と label を足す。問いは label intake:question、memo は label intake:memo で見分ける（設計ノート surface の節点の一覧）。fixture（bd の出力の形の 8 本）は設計席が置いた。

  - n: 11
    type: prose
    title: 便 e-read — 読む側の口
    body: |
      便 c と便 d の関数の値を server の口に出す。server は 3 つの字を集めて中核の関数に渡し、電文を返す。書く口は足さない。
      3 つの字の集め方。台帳の一覧は、着地済みの bd の読み（便 e-src の子 process）が返した字をそのまま使う。設計の索引は、設計の道具を子 process で撃って標準出力を字にする。argv は「<program> graph --print --dir <repo>/design-intent」で、cwd は repo。rc が 0 でない・program が無い・5 秒で返らない のどれかなら、設計の出所は読めない。器の event log は file「<state dir>/fleet/events.jsonl」を読む。file が無いか読めなければ、走行の出所は読めない。今の時刻は server が時計から取り、関数に引数で渡す。
      引数を 2 つ足す。--state-dir <dir> は器の state dir の置き場で、省いたら走行の出所は読めない扱いにする。--folio <program> は設計の道具の program で、省いたら folio。どちらも省ける。host 固有の値と住所は code に書かず、引数で受ける（行 D-4）。
      口は 4 つ足す。GET /api/pipeline は pipeline の板（PipelineBoard）。GET /api/metrics は台帳の指標（LedgerStats）。GET /api/next は次の一手（NextStep）。GET /api/graph は導出グラフ（GraphDoc）。読めない出所が在っても 200 で返し、電文の中のその部分だけを「まだ分からない」にする。口は要求のたびに字を集めて組み直す（グラフは repo に書かず毎回組み直す）。GET でない要求は 405 で、何も書かない。
      グラフの電文 GraphDoc は、契約の型の crate の graph の module に足す。欄は、節点の一覧・辺の一覧・読めなかった出所の一覧・bead の属性（種類・状態・label・pointer の行・touches）・走行の属性（段・口座）・不変条件の 12 本の判定（id・3 値・違反の数・違反の id の一覧）・組まずに数えた辺の数。中核の crate の Graph と check の値を電文に写す関数は境界の crate に置く。型の外形は便 b の snapshot の歯で pin する。
      変化の知らせ。event log の file と、設計文書の dir（<repo>/design-intent の下の全 file）の変化の印（更新の時刻と長さ）を 500 ミリ秒ごとに見て、変わったら board-changed の event を SSE（/api/surface/events）に流す。event の名は契約の型の crate の面の module の定数 BOARD_CHANGED_EVENT（便 g-parts が足した）から引く。要件 NFR2 の「器の event と台帳の変化は 5 秒以内に面へ届く」をこの知らせで満たす。台帳の変化の知らせ（ledger-changed）は着地済みのまま。
      依存。境界の crate の直接依存に中核の crate を 1 つ足す（workspace の中の crate・外の package は増えない）。xtask の歯（crate ごとの直接依存の名の一覧）に、その 1 行を足す。
      歯は偽の program を使う。偽の bd は便 e-src の歯と同じ形（fixture を標準出力へ出す script）。偽の設計の道具は tests/fixtures/graph/real/design-index.tsv を標準出力へ出す script。event log は tests/fixtures/graph/real/events.jsonl を一時の state dir に写して使う。
      在りか（着地済み）。境界の crate の server の module（crates/tsuzuri-boundary/src/server の下）に、口の振り分けと起動の引数の型（mod.rs の Config）・bd の子 process の読み（ledger.rs の Source）・変化の印の周期の読みと SSE の配信（events.rs の Hub と stamp）・応答の型（http.rs）・面の file の配布（files.rs）が在る。tz の入口と引数の読みは crates/tsuzuri-boundary/src/main.rs に在る。契約の型の crate に、電文を字にする関数（wire の encode）・板の型（board の module の PipelineBoard）・節点と辺の型（graph の module の GraphNode と GraphEdge）・event の名の定数（surface の module の BOARD_CHANGED_EVENT と ledger の module の LEDGER_CHANGED_EVENT）が在る。中核の crate に、グラフを組む関数と不変条件を数える関数と入力の型（graph の module の build・check・Inputs）が在る。指標と次の一手と板の関数と、その電文の型（LedgerStats・NextStep）は便 d が足すので、この便は便 d の着地の後に起こす。xtask の歯の直接依存の名の一覧は xtask/src/main.rs の DIRECT_DEPS に在る。fixture の 3 つ（tests/fixtures/ledger/bd-list-8.json・tests/fixtures/graph/real/design-index.tsv・tests/fixtures/graph/real/events.jsonl）は着地済みで、この便は新しい fixture の file を作らない。
      起動の引数の型に欄を足すので、着地済みの歯の file（tests/server_min.rs と tests/server_src.rs）の引数の組み立ても直す。歯の中身は変えない。
      この便は面の crate と中核の crate の code を触らない。

  - n: 12
    type: prose
    title: 便 b-cards — 問いの card と席の card の電文の型
    body: |
      画面の 2 つの block（問いの card・orchestrator と口座）が読む電文の型を、契約の型の crate に先に置く。型が先に在れば、server の便と画面の便を並べて走らせられる。この便は型と、型に付く小さな純粋な関数だけを書く。
      問いの card（新しい module question）。QuestionCard の欄は、id（bead の id）・title（題）・posted_at（作られた時刻）・plain（非エンジニア向けの概要・無ければ無し）・eng（エンジニア向けの概要・無ければ無し）・reason（理由・無ければ無し）・recommend（推奨・無ければ無し）・a1（A-1 の印を持つか）・touches（名指した節点の id の列）・digest（見た版の要約値）。QuestionList の欄は cards（読めた card の列か「まだ分からない」）。
      要約値の関数は台帳の module の LedgerItem に足す。id・題・状態・本文・notes をこの順に改行 1 つでつないだ字の UTF-8 の byte を、FNV-1a の 64 bit（初期値 0xcbf29ce484222325・乗数 0x100000001b3）で畳み、16 字の 16 進の小文字にする。標準 library だけで書く。
      席の card（新しい module seat）。席の状態の型 SeatState は閉じた 5 値で、字は run・wait・limit・silent・unknown（動いている・待っている・限度・応答なし・測れていない）。SeatCard の欄は、at（組んだ時刻）・target（席の名）・state（席の状態）・since（今の状態になった時刻・無ければ無し）・tick_healthy（器の合図の健康・読めたか「まだ分からない」）・heartbeat（停止の切り替えが on か・読めたか「まだ分からない」）・account（登録の口座・無ければ無し）・model（席の model・無ければ無し）・group（群の名と今の口座と候補と次の移り先・着地済みの型 GroupRow・読めたか「まだ分からない」）・usage（席の口座の窓ごとの使った割合・読めたか「まだ分からない」）・spans（直近 24 時間の状態の区間の列・読めたか「まだ分からない」）・moves（口座の移動の履歴の列・読めたか「まだ分からない」）。窓の 1 行 QuotaUsed の欄は window（窓の名）・used_pct（使った割合）・resets_at（戻る時刻・無ければ無し）・counted（限度の判定で数える窓か）。区間の 1 行 SeatSpan の欄は from・to・state。移動の 1 行 AccountMove の欄は at・from（無ければ無し）・to。
      在りか（着地済み）。契約の型の crate の入口は crates/tsuzuri-contract/src/lib.rs、読めたか「まだ分からない」かの型 Reading と GroupRow は板の module（src/board.rs）、LedgerItem と bead の id の型は台帳の module（src/ledger.rs）。型の外形を pin する歯は crates/tsuzuri-contract/tests/contract_form.rs と、その snapshot の file。
      依存は足さない。
  - n: 13
    type: prose
    title: 便 e-ask — 問いの一覧の口と裁定の受付
    body: |
      持ち主が画面で問いに答えられるようにする。問いの一覧を配る口と、1 問の答えを受ける口を足す。束の承認と方針の欄と取り消しは後の便が足す。
      問いの bead の本文の形を決める。席は問いを置くとき、本文の行頭に定型の字を書く。「概要 = 」の行は非エンジニア向けの概要、「技術 = 」の行はエンジニア向けの概要、「理由 = 」の行は理由、「推奨 = 」の行は推奨。1 つの定型は 1 行で、同じ定型が 2 行在れば最初の行を取る。定型の無い欄は無しにする。A-1 の印は、label のどれかが「A-1」で始まること。名指した節点は bead の metadata の touches の欄。
      問いの一覧の関数は中核の crate に置く（新しい module question）。入力は台帳の一覧の字（bd の読み取りの口が返す JSON）。open の問い（label intake:question を持ち、状態が closed でも tombstone でもない bead）を、作られた時刻の古い順（同じなら id の順）に、契約の型の QuestionCard にして返す。要約値は契約の型の関数で付ける。字が読めなければ「まだ分からない」。関数は file も子 process も触らない。
      口は 2 つ足す。GET /api/questions は問いの一覧（QuestionList）。POST /api/ruling は裁定の受付で、本文は契約の型の RulingRequest（問いの id・見た版の要約値・逐語）、応答は RulingResponse（記帳 id・記帳時刻）か断りの応答。
      受付の順。(1) 逐語が空白だけなら断る（400・EmptyVerbatim）。(2) 台帳を bd の読み取りの口で読み直し（持ち回しの値を使わない）、id が無いか open の問いでなければ断る（404・UnknownQuestion）。台帳が読めなければ 503。(3) 今の版の要約値が要求の値と違えば断る（409・StaleVersion）。(4) id を発行する。形は「<問いの id>:<分>-<数>」で、分は今の時刻の UTC の「年月日 T 時分 Z」（例 20260927T1034Z）、数は 1 から始め、問いの notes に同じ id の定型行が在れば 1 つずつ増やす。契約の型の RulingId の for_question を使う。(5) 書く。1 回目は notes の末尾に 1 行を足す。行は「裁定 id = <id>・問い = <問いの id>・逐語 = <字>」。逐語の逆斜線は逆斜線 2 つに、改行は逆斜線と n の 2 字に写し、1 行にする。2 回目は問いを閉じる（理由は「裁定 <id>」）。書きは契約の型の LedgerWrite の argv の関数から組み、program は引数 --bdw（省いたら契約の型の定数 BDW）で、cwd は repo。1 回目が落ちたら 2 回目を撃たずに 502 を返す。2 回目が落ちたら 502 を返し、応答の字に発行した id を入れる。(6) 配達する。引数 --seat <target> と --state-dir の両方が在るときだけ、器の配達の口を撃つ。argv は「<program> seat deliver --state-dir <dir> --target <target> --ruling <id>」で、program は引数 --scribe2（省いたら scribe2）。配達が落ちても応答は 200 のままで、落ちたことを標準 error に 1 行書く。(7) 200 と RulingResponse を返す。
      守り。POST を受ける口は /api/ruling だけ。ほかの口への GET でない要求は 405 のまま。本文は 65536 byte まで（超えたら 413）。Origin の頭が在って、その host と port が Host の頭と違えば 403。断りと 4xx と 5xx の応答では、(5) の書きの前なら何も書いていない。server 自身は repo の dir と state dir の file を書かない（台帳に書くのは bdw・席へ送るのは器の CLI）。
      台帳の変化は bdw の書きで変化の印が動くので、着地済みの知らせ（ledger-changed）がそのまま画面に届く。この便は知らせの code を触らない。
      在りか（着地済み）。要求と応答と断りの型（RulingRequest・RulingResponse・Refusal と http_status・RulingId）は契約の型の crate の面の module（src/surface.rs）、台帳への書きの型と argv の関数（LedgerWrite・BDW）は台帳の module（src/ledger.rs）。server の口の振り分けと起動の引数の型は crates/tsuzuri-boundary/src/server/mod.rs、要求の読みと応答の型は http.rs、bd の子 process の読みは ledger.rs、tz の引数の読みは crates/tsuzuri-boundary/src/main.rs。QuestionCard と QuestionList と要約値の関数は便 b-cards が足し、--state-dir の引数は便 e-read が足すので、この便は 2 つの着地の後に起こす。
      歯は偽の program を使う。偽の bd は fixture を標準出力へ出す script、偽の bdw と偽の器は受けた argv を一時の file に 1 行ずつ書く script。fixture の question-2.json は bd の一覧の形で、open の問い 2 本（1 本は定型行を 4 つ持ち、1 本は持たない）と closed の問い 1 本。起動の引数の型に欄を足すので、着地済みの歯の file の引数の組み立ても直す（歯の中身は変えない）。
      依存は足さない。

  - n: 14
    type: prose
    title: 便 e-seat — 席と口座の読み
    body: |
      画面の block「orchestrator と口座」が読む席の card を組んで配る。器の出力と file を読むだけで、器の state dir には書かない。状態の判定は器の値を写し、閾値を面の code に持たない（規則の行 R-22）。
      材料は 7 つの字。器の 3 つの出力（子 process・program は引数 --scribe2 で、省いたら scribe2）と、4 つの file。(a) 合図の健康の出力。argv は「seat tick status --state-dir <dir>」。1 行が 1 席で、形は「seat tick status: target=<席の名> last=<秒か -> age=<秒か -> healthy=<yes か no> heartbeat=<on か off> step=<数> next=<数>」。(b) doctor の出力。argv は「doctor --state-dir <dir>」。席の行は「seat: role=<役> anchor=<path> target=<席の名> account=<口座> model=<model> …」、群の行は「group=<群の名> accounts=<口座をコンマでつないだ字> anchors=<数> seat-accounts=<字> current=<口座> next=<口座か none> refused=<字>」。(c) 残量の出力。argv は「fleet usage --show --state-dir <dir>」。--show を必ず付ける（付けないと器が測り直して記録を書く）。1 行が 1 口座で、形は「usage: account=<口座> five_hour=<数>% resets=<時刻か none> seven_day=<数>% resets=<時刻か none> model=<model の名>:<数>% resets=<時刻か none>」か、測れていない口座の「usage: account=<口座> unmeasured reason=<語>」。時刻は UTC の「年-月-日 T 時:分:秒 Z」。(d) 状態の記録の file「<state dir>/seat/<席の dir>/state.jsonl」。席の dir は席の名の「:」を「_」に替えた字。1 行が 1 件の JSON で、欄は schema・state（busy か idle）・event・ts（epoch 秒）・sid。(e) 合図の最後の判定の file「<state dir>/seat/<席の dir>/tick-last」。1 行で、形は「ts=<epoch 秒> decision=<語> reason=<語>」。(f) 群の宣言の file「<state dir>/host.toml」。群は「[[account-group]]」の行で始まる塊で、塊の中に、name の行（name = の後に引用符で囲んだ群の名）と、anchors の行（anchors = の後に角括弧で囲んだ配列・中は引用符で囲んだ path をコンマで区切った字・1 行の配列）を持つ。(g) 群の記録の file。今の記録は「<state dir の親>/scribe2-host/groups/<群の名>.account」、過去の記録は同じ dir の下の「history/<群の名>.account.<時刻>.<数>」。どちらも 4 行で「account=<口座>」「ts=<時刻>」「reason=<語>」「previous=<口座>」（previous の行が無いか空の記録が在る）。
      席の card を組む関数は中核の crate に置く（新しい module seat）。入力は、席の名・anchor の path・上の (a) から (f) の 6 つの字（どれも無いことが在る）・群の記録の字の列・今の時刻。関数は file も子 process も時計も触らない。群の名を決める関数（群の宣言の字と anchor を受けて、宣言の順で最初に anchor を含む群の名を返す）も同じ module に置き、server はこの関数で群の名を得てから (g) の file を読む。TOML の読み手は足さず、行の字を読む（1 行に収まらない配列は読めない扱いにして「まだ分からない」）。
      欄の決め方。account と model は、(b) の席の行のうち target が席の名と同じ行から写す。tick_healthy と heartbeat は、(a) の行のうち target が席の名と同じ行の healthy（yes は真）と heartbeat（on は真）から写し、行が無ければ「まだ分からない」。state は次の順で決める。(e) の reason が account-pressed なら limit。reason が state-stale なら silent。それ以外は (d) の最後の行の state が busy なら run、idle なら wait。(d) が無いか行が 1 つも読めなければ unknown。since は、limit と silent では (e) の ts、run と wait では (d) の末尾から同じ state が続く行のうち最も古い行の ts。
      usage は、(c) の行のうち account が席の account と同じ行から 3 つの窓を組む。窓の名は five_hour・seven_day・seven_day_model。used_pct は数（100 を超える数は 100 にしない・255 を超える数は 255）。resets_at は時刻を epoch 秒にした値で、none なら無し。counted は、five_hour と seven_day はつねに真、seven_day_model は行の model の名が席の model と同じ（大文字と小文字を区別しない）ときだけ真。行が unmeasured か、行が無ければ「まだ分からない」。
      group は、群の名（群の宣言から）と、(b) の群の行のうち名が同じ行の current（今の口座）・accounts（候補）・next（次の移り先・none なら無し）から組む。remaining は、(c) の行のうち account が今の口座と同じ行の 3 つの窓の残り（100 から使った割合を引いた値・0 より小さくしない）で、行が無いか unmeasured なら空の列。群の名か群の行が得られなければ「まだ分からない」。
      spans は、(d) の行のうち ts が今の時刻の 24 時間前以後の行から組む。行を ts の順に並べ、同じ state が続く行を 1 つの区間にまとめ、区間の始まりは最初の行の ts、終わりは次の区間の始まり（最後の区間は今の時刻）。state は busy を run、idle を wait に写す。(d) が無ければ「まだ分からない」、在って 24 時間の中に行が無ければ空の列。
      moves は、群の記録の字の列から組む。1 つの記録が 1 つの移動で、at は ts、to は account、from は previous（無いか空なら無し）。時刻の古い順に並べる。群の名が得られなければ「まだ分からない」。
      次の一手。席の card を受ける関数を中核の crate の next_step の module に足す（着地済みの関数は変えず、席の card を受けない値のまま）。限度と移動は、席の card の state が limit か、account が群の今の口座と違うときに当たった（対象は無し・件数は 1）、どちらでもなければ当たらない。応答なしは、state が silent のときに当たった。席の card が無い（引数が無い）ときと、state が unknown のときは、2 種とも判じなかった。なしと大きく出す 1 つは、7 種の結果から着地済みの決め方で決め直す。
      server。引数 --seat <席の名> を読む（便 e-ask が足した引数・省いたら席の card は組まない）。口 GET /api/seat を足す。3 つの出力は子 process で撃ち、5 秒で返らなければ読めない扱い。3 つの出力と file の読みは 5 秒のあいだ持ち回す（要求のたびに器を撃たない）。--seat か --state-dir が無いときは、器を撃たず、state が unknown で読む欄が全部「まだ分からない」の card を返す。口 GET /api/next は、席の card が読めるときは席の card を受ける関数の値を返す。変化の知らせは、(d) と (e) の file の変化の印を着地済みの周期の読み（500 ミリ秒）に足し、変わったら board-changed を流す。
      在りか（着地済み）。席の card の型（SeatCard・SeatState・QuotaUsed・SeatSpan・AccountMove）は契約の型の crate の seat の module、群の行の型（GroupRow・QuotaLeft）と Reading は板の module、次の一手の型（NextStep・NextCheck・CheckResult）は stats の module。中核の crate の次の一手の関数は crates/tsuzuri-core/src/next_step.rs の next_step（引数は台帳の字・event log の字・今の時刻）で、歯は crates/tsuzuri-core/tests/stats.rs（この便の write-set の外・関数の外形を変えないので通る）。server の読む側の口は crates/tsuzuri-boundary/src/server/board.rs（次の一手の口は next の関数）、口の振り分けと起動の引数の型は mod.rs、周期の読みと SSE は events.rs。中核の crate は契約の型の crate と serde と serde_json に依存し、境界の crate は契約の型の crate と中核の crate に依存している（Cargo.toml は触らない）。時刻の字を epoch 秒にする関数は中核の crate の ledger の module の epoch_secs。
      歯は偽の器を使う（受けた argv を一時の file に書き、argv に応じて fixture の字を標準出力へ出す script）。fixture の seat-inputs.json は、組ごとに 7 つの字と期待の card を持つ。口座の名と host の名は見本の名（acct-1・host-1 の形）にして、実物の名を書かない（行 D-4）。fixture は 20000 byte 以下にする。
      依存は足さない。

