# 設計ノート surface-base — （発効 2026-09-27・持ち主の裁定 user 2026-09-27T03:19Z・記帳先 = t3-hub.1 notes）面の便の土台（便 a〜f）。判断の記録 ADR-3・ADR-4・ADR-7・ADR-8 の実装の便。要件は srs.yaml。
# 契約表の行は器（scribe2）が読む導出物 contracts/surface-base.toml に写る（folio derive --dir design-intent --out ../contracts --write）。便の契約 bead の pointer は design = contracts/surface-base.toml#<行 id>。
meta:
  id: surface-base
  title: 面の便（土台）— workspace の骨格・契約の型・導出グラフ・台帳の指標・面の server・席の hook
  version: v0.3
  status: effective
  generated: 2026-09-27
  profile: design-note
  approval:
    - {who: 持ち主, date: 2026-09-27, ruling: t3-hub.1（裁定 id = user 2026-09-27T03:19Z・notes に逐語）, verbatim: よい, surface: R-8}
  note: 設計ノート surface（v0.2・持ち主の承認 2026-09-26T14:37Z）の便の散文と契約表を、字を変えずに移した文書（章の上限 12 に収めるため・folio2 の ADR-21 決定 (3)）。持ち主の承認（2026-09-27T03:19Z）で effective。第 0.2 版（2026-09-27）は器の契約の審査（走行 t3-hub.2-20260927T071348Z・FAIL）の指摘を受けた設計席の直しで、便 a の行に alias の file と Cargo.lock と .gitignore を足し、完了の条件の 4 つを歯と検証の行で測る形にした。便の範囲と完了の条件の意図は変えていない。第 0.3 版（同日）は 2 周目の走行（t3-hub.2-20260927T071750Z・検証の行 1 本が赤）を受けた直しで、実装役の権限の検査が .cargo/config.toml を守られた file として書かせないため、alias をやめて cargo run -q -p xtask -- check の行にした。

sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      面の便のうち、画面を持たない土台の 6 便（骨格・契約の型・導出グラフと不変条件・台帳の指標と次の一手・面の server・席の hook）を契約表の行にする。
      部品・口・歯・節点・辺・不変条件・契約の型・器に頼む口の閉じた一覧は設計ノート surface が持ち、ここには写さない。
  - n: 2
    type: prose
    title: 便 a — workspace の骨格
    body: |
      cargo の workspace と 4 つの crate（契約の型・中核・境界・面）と xtask の空の骨格を置き、器の宣言（.vessel.toml）を cargo の形に改める。
      crate は空の lib で、契約の型の crate が骨格の歯を 1 本持つ。依存は serde に限る。xtask は cargo run -q -p xtask -- の形で起動し、alias の file（.cargo/config.toml）は置かない。
      xtask の check は workspace の build と歯の全部（cargo nextest run --workspace）と clippy（warning を error にする）を順に撃ち、最初に落ちた段の rc を返す。
      xtask の歯（接頭辞 skeleton_）は 3 本。workspace の member が 5 つであること、.vessel.toml の common-verify が cargo run -q -p xtask -- check の 1 行であること、Cargo.lock の workspace の外の package が serde と serde の導出が連れて来るものだけであること。
      target の dir と器の作業場（.worktrees の dir）は .gitignore で版管理の外に置く。trunk はこの便では入れない。面の便で xtask の下から呼ぶ形にして、器の allowed-commands は cargo と git のままにする。
  - n: 3
    type: prose
    title: 便 b — 契約の型
    body: |
      server と面と hook が共有する型を契約の型の crate に置く。面の event・面の状態・問いの合図・裁定の要求と応答・束の要求と応答・方針の要求・台帳への書き（閉じた enum で bdw の argv を組む）・グラフの節点と辺・板の型。
      面の側に電文の写しを書かない。型の外形は snapshot の歯で pin する。
  - n: 4
    type: prose
    title: 便 c — 導出グラフと不変条件と近傍
    body: |
      設計文書と設計ノートの行と台帳と走行を 1 つのグラフに毎回組み直す純粋な関数を中核の crate に置く。不変条件の 12 本を 3 値で数え、近傍（根拠の側と影響の側・各 2 段・hub は畳む）を返す。
      入力は design-intent の YAML と issues.jsonl と器の event log で、読めない出所はその種類だけ「まだ分からない」にする。tz graph の --check と --around の口は境界の crate が薄く包む。
  - n: 5
    type: prose
    title: 便 d — 台帳の指標と未反映と次の一手
    body: |
      台帳の指標（open task・純減・closed/日・未反映・burndown・判定・memo と「詳しく」の項）と、未反映の 3 種（昇格先の無い memo・処分の無い裁定・反映されていない要望）と、次の一手の 7 種の判定を中核の crate の純粋な関数に置く。
      判定の閾値は rules 行から読む（数を code に書かない）。作業中の数と最古は出さない。
  - n: 6
    type: prose
    title: 便 e — 面の server
    body: |
      同期の server を境界の crate に置く。台帳の読み・裁定と束と方針の受付・承認の event の書き・SSE の配信・面の file の配布。
      台帳への書きは閉じた enum から bdw の argv を組む 1 経路だけで、repo の file も state dir の file も書かない。id は server だけが発行する。見た版が古い要求は 1 byte も書かずに断る。
  - n: 7
    type: prose
    title: 便 f — 席の hook と問いの起票の門
    body: |
      裁定が届いたときの席の起こし（器の配達の口と停止の hook の 2 経路）と、問いの起票の門（PreToolUse の guard・近傍の処分の宣言・束の要約値）を境界の crate に置く。
      席は自前の周期の読みを持たない。門は処分の無い id を全部名指して止める。
  - n: 8
    type: contract-table
    title: 契約表
    rows:
      - id: a
        title: workspace の骨格（4 つの crate と xtask・器の宣言を cargo の形へ）
        req: [FR17]
        section: "2"
        write-set: ["+Cargo.toml", "+Cargo.lock", ".gitignore", "+crates/tsuzuri-contract/Cargo.toml", "+crates/tsuzuri-contract/src/lib.rs", "+crates/tsuzuri-core/Cargo.toml", "+crates/tsuzuri-core/src/lib.rs", "+crates/tsuzuri-boundary/Cargo.toml", "+crates/tsuzuri-boundary/src/lib.rs", "+crates/tsuzuri-surface/Cargo.toml", "+crates/tsuzuri-surface/src/lib.rs", "+xtask/Cargo.toml", "+xtask/src/main.rs", ".vessel.toml"]
        verify: ["cargo build --workspace", "cargo nextest run -p tsuzuri-contract --no-tests=fail skeleton_", "cargo nextest run -p xtask --no-tests=fail skeleton_", "cargo run -q -p xtask -- check"]
        size: S
        done: (1) cargo build --workspace が 5 つの package で通り、xtask の歯が workspace の member の 5 つの名を読む (2) 契約の型の crate の骨格の歯 1 本が緑 (3) xtask の歯が .vessel.toml の common-verify を cargo run -q -p xtask -- check の 1 行と読み、その行が rc 0 で終わる（allowed-commands の cargo は便の前に main で足してある） (4) xtask の歯が Cargo.lock を読み、workspace の外の package が serde と serde の導出が連れて来るものだけである
        depends: []
      - id: b
        title: 契約の型（面の event・状態・問いの合図・裁定と束と方針の要求と応答・台帳への書きの enum・グラフの節点と辺・板の型）
        req: [FR2, FR6, FR7, FR8, FR9]
