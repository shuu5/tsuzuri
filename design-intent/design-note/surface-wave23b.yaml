s は空。起草は main efe709f3（計画 v1.01）の写しで行い、試作で歯を撃ち、直しを戻して歯が落ちることを見た。第 0.8 版（2026-09-29）は、9 行目 f-undelivered（境界の server の新しい口と面の project の ask と next・M）と 11 節を足した。計画 surface-plan の 9 節の計画だけの行を契約の行にしたもので、新しいノートにせずこのノートに足した（条 P-28・規則の行 R-32）。depends は空。席の受けは配達済みの印で判じる（席の決め 2026-09-29）。同じ時に起草した計画だけの行 e-approval-event は、器の答えの口を待つので契約の行にしなかった（計画の 9 節に残す）。起草は main efe709f3（計画 v1.01）の写しで行い、試作で歯を撃ち、直しを戻して歯が落ちることを見た。第 0.10 版（2026-09-29）は、10 行目 c-park-acct（契約の board と account・中核の seat と next_step と account の host と project・面の project の seat の fn band・S）と 12 節を足した。計画だけの行ではなく、行 g-park-view の見せ方の問いを作る起草で実物の画面に見つけた誤り（器の park の区画の席が次の一手の限度と移動と状態の帯の移動待ちに当たる）の直しで、新しいノートにせずこのノートに足した（席の決め 2026-09-29・条 P-28・規則の行 R-32）。depends は空。起草は main 6d7e98e5（計画 v1.03）の写しで行い、試作で歯を撃ち、直しを戻して歯が落ちることを見た。第 0.11 版（2026-09-30）は、11 行目 f-deliver（中核の delivery と境界の hook と plugin の hooks.json・M）と 13 節を足した。計画 surface-plan の 9 節の計画だけの行 f-deliver の前半（指し示しを受けた席に逐語を足す）を契約の行にしたもので、新しいノートにせずこのノートに足した（条 P-28・規則の行 R-32）。後半（考え中の席を次の tool の呼びで拾う）は計画だけの行 f-deliver-tool に残した。depends は空。起草は main 11affd91（計画 v1.04）の写しで行い、試作で歯を撃ち、直しを戻して歯が落ちることを見た。第 0.12 版（2026-09-30）は、12 行目 c-g3-extern（中核の graph の mod と build と check・境界の server の board と others と口の graph と cli の graph・M）と 14 節を足した。計画 surface-plan の 9 節の計画だけの行を契約の行にしたもので、新しいノートにせずこのノートに足した（条 P-28・規則の行 R-32）。depends は空。外の台帳の行は起動の引数 --project の置き場の台帳の読みで確かめ、server は見張りの最後の読みの字を使って bd を新しく撃たない。起草は main 11affd91（計画 v1.04）の写しで行い、試作で歯を撃ち、直しを戻して歯が落ちることを見た。第 0.13 版（2026-09-30）は、13 行目 e-stage-target（契約の stage・境界の stagecall と口の 4 file と stage の cli と server の config と mod と proc と main・M）と 15 節を足した。計画 surface-plan の 9 節の計画だけの行 i-8（2 つの board の表示先の設定の画面・L）の server と契約の口を割って契約の行にしたもので、新しいノートにせずこのノートに足した（条 P-28・規則の行 R-32）。面の画面は i-8 に残す（見本に設定の画面が無く、置き場を持ち主に問う）。depends は空。起草は main 11affd91（計画 v1.04）の写しで行い、試作で歯を撃ち、直しを戻して歯が落ちることを見た。 第 0.14 版（2026-09-30）は、15 節に行 e-stage-target の電文の字（空白なし・歯 dstg_wire_forms が比べる字と読まない本文・二重引用符を省いた形とその戻し方）を足し、面の画面の問いを t3-hub.59.22 と名指した（便 t3-hub.59.23 の審査が、done (1) の比べる字が節に無いとした）。行の字は変えない。 第 0.15 版（2026-09-30）は、15 節に行 e-stage-target の審査の材料（今の Request と same_origin と guarded の字・build.rs の口の鍵の決まりと着地済みの歯 hbroute と hbpost が見る字・試作と噛み）を足した（便 t3-hub.59.23 の 2 回目の審査が、材料の上限で落ちた file の字と試作の記述が無く確かめられないとした）。行の字は変えない。 第 0.16 版（2026-09-30）は、14 行目 i-rules-validate（境界の stage の cli と歯 stcli だけ・S）と 16 節を足した。tz stage が host の面を読む前の器の検めを、器に無い上の階の命令 validate --state-dir でなく器の本当の口 rules validate --state-dir で撃つ（器 0.1.0 の scribe2 help rules の字・器の歯 e2e の rules.rs）。今の字は本物の器で rc 1 になり、host の面を読む口の全部と board の口 GET /api/stage/target が落ちる（席の実測 2026-09-30）。本物の器の形を写した偽の器の歯を足した。計画だけの行ではなく、新しいノートにせずこのノートに足した（条 P-28・規則の行 R-32）。depends は空。起草は main b87f9aa5（計画 v1.07）の写しで行い、試作で歯を撃ち、直しを戻して歯が落ちることを見た。 第 0.17 版（2026-09-30）は、7 節に行 t-carry-ex の審査の材料（判断の記録を引く path は根の design-intent/adr の 2 つで、持ち込んだ folio2/ の同じ名の file ではないこと・ADR-18 の欄 ruling の裁定 id の字・merge の後の錠と workspace の字・試作と噛み）を足した（便 t3-hub.52.129 の審査が、同じ名の別物の file しか材料に無く確かめられないとした）。行の字は変えない。 第 0.18 版（2026-09-30）は、15 行目 g-park-view（面の project の seat と account の projects と cards と home と style.css と vocab.json・S）と 17 節を足した。計画 surface-plan の 9 節の計画だけの行 g-park-view を、持ち主の答え t3-hub.53.41（裁定 id = t3-hub.53.41:20260929T2152Z-1・案 A）に沿って契約の行にしたもので、新しいノートにせずこのノートに足した（条 P-28・規則の行 R-32）。区画の席の群の見出しを語 区画 にし、chip の枠を点線にし、今の口座を持たない短い card を出し、今の口座を字 ― にして一致の印を出さない。depends は c-acct-park と c-park-acct（どちらも着地済み）。起草は main 3d57d349（計画 v1.08）の写しで行い、試作で歯を撃ち、直しを戻して歯が落ちることを見た。 第 0.19 版（2026-09-30）は、16 行目 i-stage-own（面の project の stage〔新〕と net と pages の home と vocab と style・M）と 17 行目 i-stage-all（面の account の stage〔新〕と mod と board と style・M・depends は i-stage-own）と 18 節と 19 節を足した。計画 surface-plan の 9 節の計画だけの行 i-8（2 つの board の表示先の設定の画面）を、持ち主の答え t3-hub.59.22 の案 A（裁定 id = t3-hub.59.22:20260929T2152Z-1・今の頁に block を足す・tab は 3 つのまま）の置き場で 2 行に割って契約の行にしたもので、新しいノートにせずこのノートに足した（条 P-28・規則の行 R-32）。設定の読みは block を開いた時と書きの後だけ撃ち、ふだんの読み直しの鎖に入れない。起草は main 3d57d349（計画 v1.08）の写しで行い、試作で歯を撃ち、直しを戻して歯が落ちることを見た。 第 0.20 版（2026-09-29）は、18〜23 行目（c-tick-word〔中核の seat だけ・S〕・e-held-design〔境界の server の held と design〕・e-held-seat〔境界の server の seat〕・e-held-acct〔境界の acct〕・e-ledger-lazy〔境界の server の events と ledger と others と form と acct〕・c-acct-parse〔中核の account と next_step と pipeline と ledger の stats と境界の acct〕）と 20〜25 節を足した。c-tick-word と e-held-design が根で、e-held-seat から後は直列（depends）。S の 1 行のほかは M。拠りは判断の記録 ADR-23（持ち主の裁定 t3-hub.52.133・網は 600 秒）と要件 NFR2・NFR4（持ち主の裁定 t3-hub.52.134・案 D）。計画だけの行ではなく、新しいノートにせずこのノートに足した（条 P-28・規則の行 R-32）。起草は main 6d7e98e5 の写しで起こし（起草 lite1）、main 3d57d349（計画 v1.10）の写しに行を 1 つずつ当て直し、途中の写しの全部で xtask の check を撃ち、変異を当てて歯が落ちることを見た。 第 0.21 版（2026-09-30）は、行 e-held-acct の done (1) を、着地した e-held-seat の Seats::new の引数の形に合わせ、mod.rs の code の行（doc と注の行を除く）で Held::new() が 1 度・held.clone() が 2 度と測る字にし、23 節に今の字の段を足した（便 t3-hub.53.44 の門が、doc の字で数を満たす歯を空とした）。 第 0.22 版（2026-09-30）は、21〜23 行目（e-held-acct・e-ledger-lazy・c-acct-parse）と 23〜25 節を、着地した e-held-seat の形（Seats::new が表を引数で受ける・read_held の鍵と input_marks の印・event log は usage の印だけ）の上の試作に合わせた（便 t3-hub.53.44 の審査が、done (3) の数と input_marks の印の字が材料の内で解けないとした）。e-held-acct は、usage を read_held で席の card の読みと分け合い、tick status と doctor は state dir の全部の席の dir の input_marks の和と event log の印を、席の card の読みと分けた鍵で持つ。done (1) に表の分け合いを撃ちの数で見る歯 eheld_acct_shares_usage を足し、done (3) の数を試作の数にした。23 節に held.rs と read_held と input_marks の今の形と歯の作業場の字を足した。e-ledger-lazy の done (4) の字の数えを doc と注の行を除く形にし、24 節と 25 節の今の字と試作と噛みの数を直した。write-set と verify と depends は変えない。起草は main 48b4bfbf の写しで行い、途中の写しの全部で xtask の check を撃ち、変異を当てて歯が落ちることを見た。 第 0.23 版（2026-09-30）は、24 行目 f-deliver-tool（考え中の席の印の無い裁定を、並べた tool の呼びの組の後の hook で拾って逐語を足し、経路が tool の呼びの印を置く・中核の delivery と境界の hook の deliver_tool と plugin の hooks.json の PostToolBatch・M）と 26 節を足した。計画 surface-plan の 9 節の計画だけの行 f-deliver-tool を契約の行にしたもので、新しいノートにせずこのノートに足し（条 P-28・規則の行 R-32）、同じ commit で計画の 9 節から外して規則の行 R-33 の値を下げる。起草は main 666ccd51 の写しで行い（起草 w33b）、xtask の check を撃ち、変異を当てて歯が落ちることを見た。 第 0.24 版（2026-09-30）は、行 f-deliver-tool の 26 節の今の字を直して足した（便 t3-hub.55.22 の審査が、着地した f-deliver の context と CONTEXT_CAP と copied の数え方と、question_signal の places と WAIT と REACH が材料に無く、done (3) と (10) の named の数を照らせず、席が足した段の bd の読みが WAIT の 2 秒の内という字が fetch の読みの待ち REACH の 0.5 秒と食い違うとした）。読みの待ちは REACH で、頁を閉じている間に台帳が動いた後の最初の判じは読めずに黙り、次の組で届けると直した。行の字は変えない。 第 0.25 版（2026-09-30）は、25 行目 e-held-marks（境界の server の seat と held と acct・M）と 27 節を足した。着地した行 e-held-seat の input_marks が判断の記録 ADR-23 の決定 (2) の印より狭く、席の card の doctor が器の event で撃ち直さない（要件 NFR2 の 5 秒を越えうる）ので、撤退の条件 (2) により読みの印を直す行を起こした。account board の tick status と doctor の鍵の字 acct と fn vessel_marks をやめて席の card の読みと表を分け合い、同じ鍵の読みを 1 本ずつにする。計画だけの行ではなく、新しいノートにせずこのノートに足した（条 P-28・規則の行 R-32）。depends は c-acct-parse。起草は main 666ccd51 の写しに起草 w32a の試作の e-ledger-lazy と c-acct-parse を当てた写しで行い、xtask の check を撃ち、変異を当てて歯が落ちることを見た。

sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      器の park の区画と明示の on の記録（器の草稿の字・branch docs/park-lot-rows・未着地）を tsuzuri の読みに受ける行 2 つ。どちらも器の字を写すだけで、器の code と台帳の形と契約の型は変えない。

      1 行目 c-acct-park（中核の account の host だけ）は、account board の群の枠の列から器の park の区画を外す。区画の見分けは器の doctor の区画の行の欄 kind=park の写しだけで、区画の名の決まり（Tier1〜9）は tsuzuri で持たない。区画の行の無い doctor の読みは 1 字も変えない。

      2 行目 e-hb-on-mark（境界の crate だけ）は、器が新しく書く明示の on の記録 heartbeat-on を席の card と account board の変化の印に足す。on と off の値は今までどおり seat tick status の欄 heartbeat= から読み、file の有無では読まない。

      2 行とも、器の区画の宣言と器の binary の入れ替えより前に着地してよい（器の字が無い今の字では振る舞いが変わらない）。

      3 行目 c-abs-seat（契約・中核・境界・面の crate）は、席の card と account board の電文から、server が組む時の今の時刻から作る値（時点・最後の区間の終わり・24 時間の窓の始まり・退避の残り秒）を除き、今の時刻に依らない材料の時刻と猶予の終わる時刻で送る。経過と残り秒は面が組む時の今から引く（行 c-abs-time の後の組）。

      4 行目 t-pub-fp（xtask だけ）は、公開の走査 xtask pub-scan の commit の走査を本流（HEAD から 1 本目の親だけを辿る列）に限る。folio2 を別の根として merge で持ち込む時（判断の記録 ADR-18 の決定 (2)(3)）に、既に公開の folio2 の履歴の commit の本文を走査から外す。作業の木の file の走査は変えない。持ち込みの merge より前に着地させる。

      5 行目 t-carry-ex（repo の根の file と xtask の歯だけ）は、持ち込んだ木への tsuzuri の規則の除外の表 carry-exclusions.toml を置き、欄と値の形と行の並びを歯で見る（ADR-18 の決定 (5)・ADR-19 の決定 (2)）。表の path は持ち込んだ木 folio2/ の中なので、流すのは持ち込みの merge の着地の後。

      6 行目 c-note-retired（中核の check と境界の board と cli の graph）は、tz graph --check の全部の行が着地した設計ノートの名指し（行 c-note-stale）から、folio の索引の要約の状態の欄（folio 0c910db から）が retired のノートを外す。全部の行が着地したノートの状態が読めなければ、その名指しは まだ分からない。

      7 行目 g-unref-dash-acct（面の account の ledger だけ）は、account board の台帳の tab の未反映の数を、3 種とも まだ分からない の時は 0 と測れていないの印でなく字 ― にする（行 g-unref-dash と同じ字）。

      8 行目 g-map-retired（契約の graph と中核の check と境界の board と cli の graph と面の mapview の mod と compact と tree）は、地図の圧縮の面と設計の木で、folio の索引の要約の状態の欄が retired の設計ノートを design-note の帯の末尾の 1 つの段に束ねて既定で畳み、開けば見せる。状態の欄が読めなければ畳まずに理由の行を出す。

      9 行目 f-undelivered（境界の server の新しい口と面の project の ask と next）は、裁定から 2 分（規則の行 R-21）で席の受けの無い裁定を、問いの頁と次の一手の block に 席に届いていない の 1 行で出す（要件 FR9）。席の受けは、裁定の行の在る問いの notes の配達済みの印（経路 配達の口 か 停止）で判じる。

      10 行目 c-park-acct（契約の board と account・中核の seat と next_step と account の host と project・面の project の seat の fn band だけ）は、器の park の区画（名 Tier9・doctor の群の行の欄 kind が park）に居る席を、次の一手の限度と移動と、project board の状態の帯の移動待ちと次の移り先に数えない。区画は今の口座を持たず席ごとに口座を持つので、登録の口座を区画の行の今の口座 - と比べない。account board の電文には区画の名の列を置く（見せ方は計画だけの行 g-park-view が持ち主の答えの後に持つ）。

      11 行目 f-deliver（中核の delivery と境界の hook と plugin の hooks.json）は、器の配達の口が待ちの席へ送る指し示しの 1 行（記帳 id だけを持つ）を席の UserPromptSubmit の hook が受けた時に、名指された裁定（束の id なら束の全部の行）の逐語を台帳から写して席の文脈に足す（要件 FR9 の「hook が逐語を注入する」）。印は置かない（配達の口の印は server が器の rc 0 の後に置く）。考え中の席を次の tool の呼びで拾う分は、この行に入れない（13 節・計画だけの行 f-deliver-tool）。

      12 行目 c-g3-extern（中核の graph の mod と build と check・境界の server の board と others と口の graph と cli の graph）は、不変条件 g-3 の外の台帳の行（族〔bead の id の最初の「.」の前の字〕が自分の台帳に無い裁定の書き出しの行）を、起動の引数 --project の置き場（行 e-multi-ask の組）の台帳の読みで確かめる。族を持つ読めた台帳の無い行だけが残れば、今までどおりまだ分からない。

      13 行目 e-stage-target（契約の stage・境界の stagecall と口の 4 file と stage の cli と server の config と mod と proc と main）は、計画だけの行 i-8（2 つの board の表示先の設定の画面）の server と契約の口を割った行で、tz stage target show --json の電文を読みの口で渡し、書きの 3 つの口は tz stage target と tz stage open を子 process で撃つだけにする（判断の記録 ADR-15 の決定 (2)・制約 CON3）。面の画面は i-8 に残す。

      14 行目 i-rules-validate（境界の stage の cli と歯 stcli だけ）は、tz stage が host の面を読む前の器の検めを、器に無い上の階の命令 validate --state-dir でなく、器の本当の口 rules validate --state-dir で撃つ（器 0.1.0 の scribe2 help rules の字）。本物の器の形を写した偽の器の歯を足し、同じ誤りを戻さない。

      15 行目 g-park-view（面の project の seat と account の projects と cards と home と style.css と vocab.json だけ）は、器の park の区画（名 Tier9）に居る席を、project board の席の block の下段と詳しくと、account board の各 project の表の行と群の順の見出しと HOME の次の一手の行で区画と見せる（持ち主の答え t3-hub.53.41 の案 A）。見出しを語 区画 にし、群の chip の形のまま枠を点線にし、chip の card を今の口座を持たない短い card にし、今の口座を字 ― にして一致の印を出さない。区画かは、席の card の群の行の欄 park と account board の電文の欄 parks（行 c-park-acct）だけで判じる。

      16 行目 i-stage-own（面の project の stage〔新〕と net と pages の home と vocab と style）と 17 行目 i-stage-all（面の account の stage〔新〕と mod と board と style）は、計画だけの行 i-8（2 つの board の表示先の設定の画面）を割った 2 行で、持ち主の答え t3-hub.59.22 の案 A（今の頁に block を足す・tab は 3 つのまま）の置き場に、行 e-stage-target の口を読む画面を置く。project board は home の右の列の「orchestrator と口座」の下、account board は HOME の tab の最後の段の末尾。どちらも畳める段で、設定の読みは block を開いた時と書きの後だけ撃ち、ふだんの読み直しの鎖に入れない。面は設定の file を書かず、層 A の名は並べるだけで変えない。

      18〜23 行目（c-tick-word・e-held-design・e-held-seat・e-held-acct・e-ledger-lazy・c-acct-parse・中核の seat と account と next_step と pipeline と ledger の stats・境界の server の held と design と seat と events と ledger と others と form と mod と acct）は、判断の記録 ADR-23 の直しで、面の server の外の読み（器の CLI と folio の子 process）を読みごとに入力の印と上限で持ち回し、知らせの受け手が 0 人の間は台帳を読まず、account board の台帳と event log の読み解きは字が変わった時だけ行う（要件 NFR2・NFR4）。契約の電文と面は変えない。

      25 行目 e-held-marks（境界の server の seat と held と acct）は、判断の記録 ADR-23 の撤退の条件 (2) で起こした直しで、器の出力の入力の印を決定 (2) の一覧（state dir の host.toml と event log・群の記録・seat の dir・全部の席の dir の記録）にし、席の card の読みと account board の読みを同じ鍵と印で持って表を分け合い（決定 (3)）、同じ鍵の読みを 1 本ずつにする（決定 (1)）。器の event の後の席の card の doctor は 5 秒の内に撃ち直す（要件 NFR2）。
