  note: 設計ノート surface-base の傘の行 e（面の server）の子の、中核と境界の crate の行 2 つ。承認は発効した計画 surface-plan の持ち主の裁定（t3-hub.56:20260927T2259Z-1）を継ぐ。行の拠りは席の決め（計画 surface-plan の 9 節の計画だけの行 c-acct-park と、器の席の知らせ 2026-09-29〔器の草稿の字 branch docs/park-lot-rows の doctor の区画の行と seat tick status の heartbeat_by= と記録の file heartbeat-on〕を受けて計画に足してすぐこのノートへ移す行 e-hb-on-mark）と要件 FR12 で、持ち主の問いを置かない。どちらも器の字を写すだけで（規則の行 R-22）、器の区画の宣言より前に着地してよい。起草は main 84be3ea2 の写しで行い、試作で歯を撃ち、直しを戻して歯が落ちることを見た。第 0.2 版（2026-09-29）は、3 行目 c-abs-seat（計画 9 節の計画だけの行・契約と中核と境界と面の crate・M）と 5 節を足した。席の card と account board の電文の時点・最後の区間の終わり・24 時間の窓の始まり・退避の猶予を、今の時刻に依らない材料の時刻と猶予の終わる時刻で送り、面は組む時の今で描く（行 c-abs-time の後の組）。depends は空（1 行目と 2 行目の出力に頼らない）。起草は main 87f7fe9（計画 v0.95・行 c-grace-acct と e-hb-on-mark と c-acct-park の着地の後）の写しで行い、試作で歯を撃ち、直しを戻して歯が落ちることを見た。

sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      器の park の区画と明示の on の記録（器の草稿の字・branch docs/park-lot-rows・未着地）を tsuzuri の読みに受ける行 2 つ。どちらも器の字を写すだけで、器の code と台帳の形と契約の型は変えない。

      1 行目 c-acct-park（中核の account の host だけ）は、account board の群の枠の列から器の park の区画を外す。区画の見分けは器の doctor の区画の行の欄 kind=park の写しだけで、区画の名の決まり（Tier1〜9）は tsuzuri で持たない。区画の行の無い doctor の読みは 1 字も変えない。

      2 行目 e-hb-on-mark（境界の crate だけ）は、器が新しく書く明示の on の記録 heartbeat-on を席の card と account board の変化の印に足す。on と off の値は今までどおり seat tick status の欄 heartbeat= から読み、file の有無では読まない。

      2 行とも、器の区画の宣言と器の binary の入れ替えより前に着地してよい（器の字が無い今の字では振る舞いが変わらない）。

      3 行目 c-abs-seat（契約・中核・境界・面の crate）は、席の card と account board の電文から、server が組む時の今の時刻から作る値（時点・最後の区間の終わり・24 時間の窓の始まり・退避の残り秒）を除き、今の時刻に依らない材料の時刻と猶予の終わる時刻で送る。経過と残り秒は面が組む時の今から引く（行 c-abs-time の後の組）。
