    type: prose
    title: 行 c-acct-park — 群の枠の列から park の区画を外す
    body: |
      ## 器の草稿の字（branch docs/park-lot-rows・器の席の知らせ 2026-09-29）
      - doctor の区画の行は群の行の後ろに 1 本（区画を宣言しない host は 0 本）で、形は group=<名> kind=park accounts=<a,b,…> anchors=<数> seat-accounts=<l1,…|none|unreadable> current=- next=- refused=- pressure=<字>。kind は 2 番目の欄で、群の行は kind を持たず 1 字も変わらない。current・next・refused は常に字 -。pressure は <5h|7d|model>:<使用率>/<閾値> か字 - か unmeasured・unreadable・no-rule。
      - host の面の区画は群と同じ見出し [[account-group]] で、行は name・anchors・accounts と任意の key heartbeat（on か off）を持つ。
      - 器は区画を、器の便 r2b の着地と binary の入れ替えの後まで、どの host.toml にも宣言しない。

      ## 今の読みを測った字（main 84be3ea2）
      - 群の宣言の読み（pub fn declaration）は name・anchors・accounts だけを読み、heartbeat の key は読み捨てる。区画の宣言は 3 つ目の群として読まれ、落ちない。
      - 区画の行を足した doctor では、群の枠の列は Unknown に倒れない。字 - は空の字でないので今の口座として読まれ、3 つ目に区画の名の群の枠（今の口座の字 -・次の口座の字 -・候補は区画の accounts・区画の席の一致は席の口座と字 - の比べで ! 移動待ち）が並ぶ。計画の 9 節の見込み（群の列の全部が まだ分からない に倒れる）は、宣言に在って doctor に行が無い字（器の古い binary に区画を宣言した時）だけで起きる。この行はその読みを変えない。
      - 口座の占有は current が口座の名と同じ群の行で決まり、区画の行の current は字 - なのでどの口座とも合わない。

      ## 直し
      - 中核の account の host に pub const PARK_KIND（字 park）と fn parked（頭が group= で欄 kind が PARK_KIND の行）を足す。群の行の読み（fn group_lines）は区画の行を除き、口座の占有と群の枠の行の引きは区画の行を読まない。
      - pub fn groups は、doctor に同じ名の区画の行が在る宣言（fn in_park）を列に入れない。残りの宣言は今までどおり、どれかの枠が組めなければ Unknown。
      - 見分けは欄 kind の字 park だけ（大文字の Park・ほかの kind の字・kind の無い行は群の行のまま）。名 Tier9 でも kind の無い行は群。

      ## 区画の席の見せ方（見本を見て決めた）
      見本 docs/design/mock3 の account board の群の所（acct.js と account/index.html の群の枠）は群の宣言の群だけを枠にし、park の区画も区画の席も持たない。区画は口座を占有せず、群の枠の欄（今の口座といつから・前の口座・候補と閾値・席の一致の数）が意味を持たないので、群の枠の列に出さない（区画として別の枠も出さない）。

      ## 変えないもの
      - account board の project の行は、区画の anchor の project も宣言の順に並び、群の名は区画の名のまま（中核の account の project は書かない）。電文に区画の名の群の枠が無いので、面の口座の欄の群の今の口座は ?、project board の席の群の chip の card は面の project の seat の GROUP_MISSING の字になる。今の main で区画が群として並ぶ時の ! 移動待ちの誤りより正しいが、区画と書く見せ方は後の行の候補として席に問う。
      - 移動の列と知らせの列は宣言の名で読むまま（区画の記録と event が在れば出す）。器の区画は口座を占有しないので記録は書かれない見込み。
      - 席の card（中核の seat）は書かない。区画の席の card の群の欄は区画の行の写し（今の口座と次の口座は字 -・残りは空）で、逼迫は区画の行の pressure の写し、断りは字 - の Known(None) になり、壊れない（歯 apark_seat_card_copies_lot が測る）。
      - fixture の file（tests/fixtures/account の 2 つ）は書かない。区画を fixture に足すと電文の fixture acct-doc.json と面の歯が動き、見本にも無いので、区画の宣言と行は歯の中で足す。

      ## 歯
      - 新しい歯 tests/apark.rs（中核）の 4 つ。filter の語は main の契約表の verify の nextest の最後の引数 291 語で、歯の file に const WORDS として持つ。
      - 置き場だけの = は、中核の host の fn を撃つ着地済みの歯（中核の acctcore・acctpcore・athr・cdorm・cspk・lresume・pclosed・plimit・pquest・punmap・sclosed と、電文を組む境界の server_acct・athr・bport）。どれも区画の字を持たないので値は変わらない。

      ## 器の着地との順
      区画の行の無い今の doctor では振る舞いが変わらないので、器の r2b の着地より前に着地してよい。器の草稿の字（kind の位置・current の字 -）が変わっても、見分けは欄 kind の字だけに依るので、欄の名 kind と字 park が変わらない限りこの行は直さない。
  - n: 4
    type: prose
    title: 行 e-hb-on-mark — 明示の on の記録を変化の印に足す
    body: |
      ## 器の草稿の字（branch docs/park-lot-rows の器の行 aa・器の席の知らせ 2026-09-29）
      - seat tick status の欄 heartbeat= は実効の値（on・off・unreadable）になり、直後に欄 heartbeat_by=（explicit・group・default・unreadable）が入る。区画の席の move= と grace_left= は字 -。
      - 記録の file は heartbeat-off と、新しく heartbeat-on（席の dir の下）。区画の宣言の heartbeat の既定が off の席を明示の on にすると、器は heartbeat-on を書く。

      ## 今の欠陥
      席の card の読み（境界の server の seat の Seat の fn marks）と account board の読み（境界の acct の Acct の fn marks）の変化の印は、席の dir の state.jsonl・tick-last・heartbeat-off だけ。器が heartbeat-on だけを書く切り替えでは印が動かず、board-changed が出ず、読みは 5 秒の持ち回しが切れるまで古い（面は知らせを受けないので、次の知らせまで古い字を出し続ける）。

      ## 直し
      - 境界の acct に pub const HEARTBEAT_ON（字 heartbeat-on）を HEARTBEAT_OFF の隣に足し、Seat の fn marks と Acct の集めの印の並びの heartbeat-off の後ろに足す。module の doc（server の seat と events）と Acct の fn marks の doc の file の列にも足す。
      - 値の読みは変えない。中核の seat の card の heartbeat は seat tick status の席の行の欄 heartbeat= の字 on と off だけを Known にし、unreadable と欄の無い行は Unknown のまま。欄 heartbeat_by= は読まない（欄の名で引くので、間に入っても heartbeat= の読みは変わらない）。file の有無は印にだけ使う。

      ## 変えないもの
      - 群の宣言の file host.toml は印にしない（今までどおり）。区画の heartbeat の既定を持ち主が host.toml で替えた時は、器が席の file を書かなければ読みは 5 秒の持ち回しの後か次の印で追いつく。印に足すかは範囲の外（席に問う）。
      - 着地済みの歯 hbmark_marks_name_three_files（ノート surface-wave13e の done が名指す）は名を替えず、marks の先頭の 3 つを見る形に書き換え、4 つの全部は新しい歯 hbon_marks_name_on_file が見る。server_acct_marks_list は席の dir ごとの file の名の列に heartbeat-on を足す。

      ## 歯
      - 新しい歯 hbon_ は着地済みの歯の file に足す（偽の器と作業場の組みを使うため・前例は hbmark_ と acchold_）。server_seat に 3 つ（hbon_marks_name_on_file・hbon_on_file_sends_board_changed・hbon_card_reads_tick_word）、server_acct に 1 つ（hbon_acct_reads_tick_word）。hbon_ と歯の名は main の契約表の filter の語のどれも含まない（起草の lint で見た）。account board の歯は器の撃ちの回数を最初の集めの回数の倍で見るので、行 c-grace-acct（便 t3-hub.53.38）の 1 回の集めの撃ちの数の替えに依らない。
      - 置き場だけの = は、席の dir の印と停止の切り替えを撃つ着地済みの歯（evkind・shb・server_hb・server_acctwire・server_read）と、境界の lib の events の単体の歯。

      ## 器の着地との順と便の順
      - 器が heartbeat-on を書かない今は、印の file が無いまま動かないので振る舞いは変わらない。器の着地より前に着地してよい。
      - 行 c-grace-acct（ノート surface-wave22e・便 t3-hub.53.38・open）が同じ境界の src/acct.rs と tests/server_acct.rs を書く。ノートの depends はほかのノートの行を持てないので、便の bead の依存（この行が後）は席が張る。試作は main 84be3ea2 の上で、c-grace-acct の差分は当てていない（着地の後に当て直す）。

  - n: 5
    type: prose
    title: 行 c-abs-seat — 席と account の組の時刻を絶対の時刻で送る
    body: |
      在りかの main は 87f7fe9（計画 surface-plan 第 0.95 版）で、この行は着地した行 c-grace-acct（便 t3-hub.53.38・2dc132b）と、同じノートの e-hb-on-mark（便 t3-hub.51.3・ca4fada）と c-acct-park（便 t3-hub.53.39・87f7fe9）の後の字に書く。計画 9 節の計画だけの行 c-abs-seat（行 c-abs-time を計画の字のとおり割った後の組）をこの契約の行にする。承認は計画の裁定を継ぐ。拠りは見本（docs/design/mock3 の ui.js の data-since を 1 秒ごとに書き直す形）と要件 NFR2。

      なぜ。面は知らせのたびに口を読み直し、同じ本文なら置かない（通信の module net.rs）。行 c-abs-time で pipeline と台帳の指標の電文は今に依らなくなったが、席の card（口 /api/seat）と account board の電文（口 /api/account）は server が組む時の今から作る値を持つので、席も台帳も変わらない読み直しでも本文の字が毎回変わり、block を毎回組み直す。この行の値は次の 5 つ。席の card の時点 at（今そのもの）。最後の区間の to（今）。24 時間の窓の始まり（今の 1 日前・区間の from を切る）。account board の電文の時点 at（今そのもの・state dir が無い時も今）。退避までの残り秒（行 c-seat-grace の card の欄 grace_left と行 c-grace-acct の ProjectRow の欄 move_left_s・器の秒のままで、面は電文の at からの経過を引く）。休止中の席の経過は電文に置かず、面が電文の at から last の時刻を引く字なので、電文の at の替えに合わせて面の描く今から引く。

      形（契約）。seat.rs の SeatCard の欄 grace_left: Reading<Option<u64>> を grace_until: Reading<Option<EpochSecs>>（器の残り秒に card を組んだ今を足した猶予の終わる時刻・serde の既定は Unknown）に替え、欄 at と SeatSpan の doc を新しい意味にする。account.rs の ProjectRow の欄 move_left_s: Option<u64> を move_until: Option<EpochSecs> に替え、AccountDoc の欄 at と DormantSeat の doc を新しい意味にする。契約の surface.rs の SeatView の欄 move_left_s は組む所の無い型なので替えない。
      形（中核）。seat.rs の pub fn card は、時点 at を、状態の記録の最後の読めた行の ts と合図の最後の判定（tick-last）の ts のうち大きい方にする（どちらも無ければ 0）。区間は at の 1 日前以後の行から組み、最後の区間の to は at。grace_until は器の欄 grace_left= の秒に引数の今を足した時刻（器の字 - は Known(None)・読めない字は Unknown・写すだけで群の記録や rules 行から計算しない）。account/project.rs の fn move_left を fn move_until（席の card の move_to が口座のときだけ grace_until を写す）にし、fn latest（project の席の card の at と台帳の指標の at・群の移動の時刻・口座の最後に測った時刻・休止中の席の last のうち最大・無ければ 0）を足す。pub fn assemble は引数の at を捨て、渡した字から latest で at を組む。pub fn doc は休止中の席を置いた後に at を latest で組み直す。
      形（境界）。server/routes/account.rs の state dir が無い時の電文は assemble に今を渡さない（at は 0）。
      形（面）。project/seat.rs に pub fn drawn（電文の card の at を今と at の大きい方にし、最後の区間の to をその at まで伸ばす）と pub fn reach を足し、pub fn content(fetched, now) と pub fn group_card(account, name, now) は描いた card と電文で組む。状態の帯の猶予の内の残り秒と詳しくの写しの行の grace_left の値は grace_until から card の at を引く。seatpill.rs の pub fn card(fetched, now) は描いた card で組む。account/mod.rs に pub fn drawn（電文の at を今と at の大きい方にし、project の席の card の at をその at にし、席と session の最後の区間を伸ばす）を足し、home・projects・session の pub fn content は今を受けて描いた電文で組む。account/board.rs の頁の電文の Memo は描いた電文を持つ（休止中の card の時刻の月日の要否を描く今で決める）。account/cards.rs の orch_card の退避の残り秒は move_until から電文の at を引く。account/session.rs の Move::Grace は終わる時刻を持ち、pub fn grace_left(until, at, now) は until から今と at の大きい方を引く（DOM は今までどおり 1 秒の時計 tick で書き直す）。DOM は組む時に crate::net::now() を渡す（群の chip の card は指を置いた時の今）。
      決めた幅。card の at は材料の時刻にした（読み直しの間に材料が変わらなければ同じ字）。面は今が at より前なら at のまま描く（端末の時計が server より遅れても区間を縮めない）。grace_until は器の残り秒に組んだ今を足すので、器が秒で丸めた残り秒と server の今の読みの間で 1 秒ずれうる（猶予の内の席だけ・読み直しで字が変わりうる）。電文の区間は at の 1 日前以後で、面は描く今の窓の端で区間を切るので、描く今が at より後でも面の窓の中の区間は欠けない。
      読む歯（fixture の替え）。tests/fixtures/seat/seat-inputs.json の 6 組の期待の card の at と最後の区間の to を材料の時刻に替えた（limit 1790503200・no-state 1790510390・run 1790510390・silent 1790509000・unread 1790510390・wait 1790510000）。読む歯は中核の seat・lresume・sgrace（書く）と ctick・nstall（置き場だけの =）と境界の server_seat（書く）。中核の seat・lresume・sgrace・ctick は組の期待の card の at を今として card を組む（今は grace_until にしか使わず、fixture の組は grace_left= の数を持たない）。nstall は組の期待の card を読んで次の一手の関数に渡す。server_seat は偽の器が出す組の字から server が組んだ card を、同じ字から中核で組んだ card と比べる。tests/fixtures/account/acct-doc.json は鍵 move_left_s を move_until（null・1790511501・null）に、proj-a の台帳の memo の鍵 age_p50_days（5.5）を created_p50（1790035200 = 電文の at の 5.5 日前）に替えた（後者は行 c-abs-time が残した字）。電文の at は 1790510400 のままで、fn latest で組む値と同じ（中核の歯 acctpcore_assemble_equals_doc_fixture が見る）。読む歯は 4 つの crate の tests で fixture の名を grep して拾い、書かない歯（中核の harestcore、面の acctframe・accthb・acctled・acctwin・bport・hacols・harest・hcard・hcled・hcnx・hcsess・hdchip・hnunk・hspk・ledspark・projmore・sthr・sxaxis・unow）は置き場だけの = に置いた。これらは電文を描かずに組む fn を呼ぶので電文の at 1790510400 を今として字を組み、残り秒は move_until から at を引いた 1101 で前と同じ。
      書き換える着地済みの歯。契約の cform_seat・ctick・lresume・acctdoc（欄の名）、中核の seat・sgrace・lresume・gacct・acctpcore・athr（欄の名と時点・assemble の引数）、境界の server_seat・server_acct・server_acctwire（時点は今より前の材料の時刻か 0・残り秒は終わる時刻）、面の gchip・gpill・ghb・seatblock・seataxis・smore・sgrace・lresumepill・hthr・accthome・acctproj・acctsess・aord・hcproj・ticker（content と card と group_card に今を渡す・残り秒は終わる時刻）。着地済みの歯の名は替えない（acctpcore_move_left_seconds と gacct_left_copies_card は名のまま中身を終わる時刻にする）。src と歯の字を読む置き場だけの = は、境界の brand・shb・stcli（crate の src を歩く）・hbconf（server_seat と server_acctwire の字を読む）・rhold・hbroute（routes/account.rs を読む）、契約の cfsplit・fxpre（tests と fixture を歩く）、中核の acctcore（src/account を歩く）、面の acctlook・acctpop・ctickface・frame・gatt・gfresh・gjst・gpulse・hasplit・hsblock・hshist・kindlab・lstg・mstore・parts・sesplit（account と seat の src の字を読むか src を歩く）。
      依存と順。depends は空。同じノートの 1 行目 c-acct-park と 2 行目 e-hb-on-mark は着地済みで、その後の字に書いた。この行の節の字は 2 つの行の出力（群の枠の列から park の区画を外すこと・heartbeat-on の印）に頼らない（歯の fixture に kind=park の行も heartbeat-on の file も無い）。c-acct-park の歯 apark は fixture acct-inputs.json（この行は書かない）を読み、この行が書く file の字を読まない。
      歯で測らず、この行の差分で持つ。契約の doc の字。DOM の今の渡し方の字の外の DOM の組み方。src の行数（試作の後で中核の seat.rs 550・account/project.rs 671、面の project/seat.rs 933・account/mod.rs 487・account/home.rs 1244・account/projects.rs 1223）。面の home.rs と projects.rs と境界の歯 server_acct.rs（1291）は上限 1500 の余地が M の見込みより小さいので growth を置いた（試作の差し引きは home.rs 0・projects.rs +1・server_acct.rs +1）。
      範囲の外。run の 4 列の今日と生きている run の境（ALIVE_S）、session の生き死に、口座の使用量の線の枠、休止中の席の境（12 時間）は今から数えるので、その境を越えた時だけ電文が変わる（変わった値として送る）。猶予の内の残り秒を project board の席の block で 1 秒ごとに書き直すこと（block を組む時の今で決める・account board の session の行は今までどおり 1 秒の時計）。契約の SeatView。持ち回しの古さの頭 X-Tz-Read-Age。

      歯と verify。接頭辞 abss_ の 9 本（中核の tests/abss.rs に 6・面の tests/abssface.rs に 3）。fixture の acct-inputs.json と seat-card.json は読むだけ。
      filter の語（起草の時の main f467057 の契約表の verify の最後の字の 217 語・歯の名の見張りの WORDS と同じ）: aaround_・abst_・accept_・acchold_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・aface_・afocus_・alean_・aord_・aown_・apark_・apop_・areread_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadl_・cadopt_・cadq_・cdorm_・cfsplit_・cg9_・cgdom_・cmark_・cnote_・contract_form_・cround_・csled_・cspk_・ctick_・cupd_・cupdlist_・denv_・dnedge_・dngrp_・dnrow_・dnskip_・dretry_・ecache_・epolq_・eretry_・esig_・evkind_・flight_・fmark_・fprem_・frame_・fserve_・fstop_・fxpre_・g3g7_・gacct_・gapspage_・gatt_・gbnote_・gchip_・gcoach_・gfix_・gfresh_・ghb_・gins_・gjst_・glabel_・gnav_・gpface_・gpill_・gpulse_・graph_・gsum_・gtuck_・gview_・gwv_・hacols_・harest_・hasplit_・hbconf_・hbmark_・hbon_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hdchip_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hshist_・hspage_・hspk_・hsym_・hthr_・http_・hwstore_・iclose_・ilink_・jcount_・jrun_・kcli_・kg9_・kindlab_・klink_・ksum_・launch_・lcard_・ledgerblock_・lgrp_・lhome_・lidle_・lkind_・lresume_・lsnap_・lspark_・lstg_・lstore_・mapview_・mkeys_・mlink_・mqask_・mqface_・mstore_・mtips_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntc_・ntime_・nxact_・nxorg_・parts_・pci_・pclosed_・pfold_・pgsw_・pgz_・pipe_・plimit_・pmisfit_・pmore_・pquest_・pqueue_・project_・ptitle_・pubscan_・punmap_・pwhole_・qblock_・qgate_・qkey_・qsig_・question_・rbusy_・relay_・rhold_・runsdoc_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server::events::・server_・sesplit_・sgrace_・shb_・skeleton_・smore_・stage_・stats_・stbp_・stcli_・steady_・sthr_・stnfy_・stskill_・sttgt_・sxaxis_・ticker_・tipx_・tkad_・tlic_・topbar_・topfit_・tz_・udash_・unow_・urpanel_・uword_・wstrip_

  - n: 6
    type: prose
    title: 行 t-pub-fp — 公開の走査の commit を本流に限る
    body: |
      在りかの main は 821ed79（計画 surface-plan 第 0.97 版）。書く file は xtask/src/pubscan.rs だけ。

      なぜ。folio2 を tsuzuri へ別の根として merge で持ち込む（判断の記録 ADR-18 の決定 (2)(3)・commit id を保つ）と、pub-scan の commit の走査（base より後の commit）は folio2 の 595 本の commit を全部読む。起草の予行（写しの main 821ed79 に folio2 0c910db を folio2/ へ merge）で、folio2 の commit 1 本の本文に tailnet の住所の形が 3 件当たり、xtask の check が落ちた。当たりは範囲を判じる歯の設計の文の、範囲の端の値で、機械の住所ではない。folio2 は既に公開の repo で、席は持ち込む前に folio2 の全履歴（commit の作者・記録者・本文と、全部の blob）を同じ規則と一覧の語で走査した（一覧の語の当たりは 0）。履歴は書き換えない（ADR-18 の案 d を退けた）。

      形。fn scan の git log に --first-parent を足し、本流（HEAD から 1 本目の親だけを辿る列）の base より後の commit だけを見る。merge の commit は本流に在るので、その作者・記録者・本文は見る。作業の木の file の走査（git ls-files）は変えず、持ち込んだ木の file も全部見る。module の doc と fn scan の doc に、本流だけを見ることと、持ち込む repo の全履歴は持ち込む前に席が走査することを書く。

      今と変わらないこと。tsuzuri の main の履歴に merge の commit は 0 本（全履歴・写しで数えた）。器の着地は親 1 つの commit で、設計席の commit は ff なので、今の走査の結果は変わらない。BASE・一覧の file・当たりの出し方も変えない。走査を止める旗・環境変数・除外の一覧は持たない（条 N-3）。

      歯。pubscan.rs の mod tests に歯 pubfp_side_root_commits_skipped を 1 つ足す。見本の repo（着地済みの歯 pubscan_repo_range と同じ git の撃ち方の fn git_in）に、base・本流の commit・根の違う branch の commit・その branch を --allow-unrelated-histories で merge した commit を作る。当たりの列が、根の違う branch の木の file b.txt・merge の commit の本文・本流の commit の本文の 3 つだけで、根の違う branch の commit の本文を含まないことを見る。filter の語 pubfp_ は、起草の時の main 821ed79 の契約表の verify の最後の字 294 語のどれも含まず、どの語にも含まれない。

      変えない歯。着地済みの歯 pubscan_ の 8 本（ノート surface-wave20a の行 t-pub-scan）は同じ file に在り、字を変えずに通る（verify に入れる）。

      流す時と順。持ち込みの merge より前に着地させる（merge の commit で xtask の check と CI が緑であるため）。depends は空。同じノートの 3 行目 c-abs-seat（走行中）と書く file は重ならない。

      範囲の外。folio2 の木の file に在る当たり（歯と設計の文の 6 件）は、folio2 の側の直しで消す（持ち込む commit はその直しの後の folio2 の最新）。

  - n: 7
    type: prose
    title: 行 t-carry-ex — 持ち込んだ木への規則の除外の表
    body: |
      在りかの main は f371566（計画 surface-plan 第 0.98 版・同じノートの 4 行目 t-pub-fp は着地済み）。書く file は、repo の根の新しい file carry-exclusions.toml と、xtask の新しい歯の file xtask/tests/carry.rs。流すのは持ち込みの merge（folio2 を folio2/ へ）の着地の後で、同じノートの 4 行目 t-pub-fp の後（depends）。試作は、写しの main 821ed79 に folio2 0c910db を folio2/ へ別の根として merge し、t-pub-fp と、folio2 の側の直しの代わり 2 つ（範囲の端の値の字と、YAML の読み手の既定の機能を切って cargo が解き直した錠）を当てた木で撃った。merge は持ち主が、席が写しで予行した script で 1 回撃つ（持ち主の答え t3-hub.67.28）。

      なぜ。判断の記録 ADR-18 の決定 (5) は、持ち込む code への tsuzuri の規則 R-4・R-10・R-2 を、最初は除外の表で持ち、段ごとの便で外すと決めた（計画の判断の表 d43）。ADR-19 の決定 (2) は、同じ表に器の宣言 file の効いているかの旗を条 N-3 の除外として足し、除外の表を作る便は両方を読むと決めた。この行はその表を置く。表の行は ADR-18 の決定 (5) を行にしただけで、新しい緩めは足さない（席の決め 2026-09-29）。

      形（表）。欄は rule・path・scope・ruling・removed_by の 5 つだけで、旗・環境変数・今回だけの口は持たない（条 N-3）。行は 3 本で、どれも path は folio2/crates/folio/、ruling は ADR-18 の承認の t3-hub.67.4 の裁定 id。
      - R-4 — 大きさの上限（1 module の行数・関数の粒度・歯と source の行数比） — 外す行 k-size-folio
      - R-10 — lint で deny にする書き方（unwrap・expect・panic・直接の print ほか） — 外す行 k-lint-folio
      - R-2 — 持ち込みの 1 回で足す依存（folio2/Cargo.lock の 26 本）の、1 PR 1 本と増分 check の実測だけ — 外す行 k-join-folio（folio の crate を根の workspace に入れる行）
      R-2 のほかの字（許しの一覧・直接依存の本数）は、この表で外さない。持ち主は問い t3-hub.67.29 と決め直しの t3-hub.67.30 で依存の一覧を決めた（判断の記録 ADR-21）。encoding_rs は持ち込みの前に folio2 の直し F3（YAML の読み手の既定の機能を切る）で外し、持ち込む外の部品は 26 本（直接 2・間接 24）、R-2 の許しの一覧には Zlib だけを足す。許しの一覧は R-2 の本体で広げるので、この表には入れない。
      N-3 の行は置かない。ADR-19 の決定 (2) の N-3 の除外は器の宣言 file の旗が対象で、scribe2 の持ち込みの段で行を足す（席の決め）。欄 rule の閉じた一覧は N-3 を含む 4 つ。
      外す行の id（k-join-folio・k-size-folio・k-lint-folio）は、まだ契約の行でも計画だけの行でもなく、計画 6 節の folio の持ち込みの段落が名指す。起草する時に波のノートの契約の行にし、その行が表の行を消す。

      形（歯）。xtask/tests/carry.rs は、外の依存を使わず、repo の根からの相対の path で字を読む（前例 tests/tlic.rs）。表の読み（見出し [[exclusion]] と、鍵 = 引用符で囲んだ字 の行だけ）と、repo の木での確かめを持つ。確かめは次のとおり。規則が閉じた 4 つのどれか。path が字 / で終わり、節 .. と . を持たない dir で、根の直下の dir の Cargo.toml が行 [workspace] を持つ。裁定 id が ADR-18 か ADR-19 の file に、字 裁定 id = に続けて在る。外す行の id が英小文字で始まり、英小文字と数字と字 - だけ。scope が空でない。同じ規則と path の 2 度目が無い。根の workspace の member の dir は自分の [workspace] を持てないので、この確かめで tsuzuri の crate の dir は名指せない。
      錠の歯（cexcl_lock_drops_encoding）は、持ち込んだ木の錠の file folio2/Cargo.lock を字で塊に割り（見出し [[package]] と、塊の頭の name = の行）、encoding_rs が無いこと・folio を除く名が 26 本・folio の dependencies が clap と yaml-rust2 の 2 つ・表の R-2 の行の本数の字が錠の本数と等しいことを見る。表の字と錠がずれたら落ちる。持ち込みの後に folio の依存が変わる時は、この歯を直すことが R-2 の見張りになる。今の 0c910db の錠（35 本・encoding_rs が在る）ではこの歯は落ちるが、t-carry-ex は F3 の後の folio2 を merge した後に流すので、それで良い。
      歯は 4 つ（cexcl_table_rows・cexcl_refuses_bad_rows・cexcl_lock_drops_encoding・cexcl_own_names_clean）。filter の語は、起草の時の main 821ed79 の契約表の verify の最後の字 294 語で、歯の file に const WORDS として持つ。

      器の共通 verify と node。merge の後の木でも、器の共通 verify（.vessel.toml の common-verify = xtask の check）は folio2/ の下を撃たない。build・nextest・clippy は根の workspace の member だけを撃ち、面の組み立ては面の crate の dir だけを読み、木の全部を歩くのは pub-scan だけ（folio2 の側の直しの後は当たり 0）。試作の木（merge の後）で xtask の check は緑（1,619 本）。folio の歯は根の workspace の外なので撃たず、CI に node は要らない。folio の歯を撃つ段（k-join-folio）で CI に node を足す（folio の図の口 figure と、図を持つ文書の face と build が node を起こす・folio2 の CI は node 20）。

      読み手。今は歯だけ。folio2/ は根の workspace の外（自分の [workspace] を持つ入れ子）なので、R-4・R-10・R-2 の検査はもともと folio2/ に当たらず、この表で切る仕組みは無い。k-join-folio が folio の crate を根の workspace に入れる時に、表を読んで lint と数えを外す実装を持つ。

      今の字（持ち込みの merge e5a313d2 の後の main・審査の材料）。歯と表の読みが引く判断の記録は、repo の根からの相対の path design-intent/adr/ADR-18.yaml と design-intent/adr/ADR-19.yaml の 2 つ（試作の const ADRS）で、持ち込んだ folio2/design-intent/adr/ の同じ名の file （folio2 の自分の判断の記録）は読まない。根の ADR-18.yaml の見出しの欄 ruling の字は t3-hub.67.4（裁定 id = t3-hub.67.4:20260929T0058Z-1）を含む。そこで表の 3 行の欄 ruling の字 t3-hub.67.4:20260929T0058Z-1 は、字 裁定 id = に続けて在る（読みは 2 つの file の字をつなぎ、字 裁定 id = と ruling の字を続けた字を探す）。ADR-19.yaml は N-3 の行の裁定 id を引くためにも読む（今の表に N-3 の行は無い）。merge の後の木で、folio2/Cargo.lock の package の名は folio を除いて 26 で、encoding_rs は無い（持ち込みの script が撃つ前に確かめた）。folio2/Cargo.toml は行 [workspace] を持ち、根の Cargo.toml の workspace の member に folio2 は無い。

      試作と噛み（起草 fin1）。main f371566 の写しに持ち込みの代わりの木（folio2 を folio2/ に置いた写し・F3 の代わりに yaml-rust2 の既定の機能を切って錠を解き直したもの）を当てて撃った。書く file は write-set の 2 つだけ（試作の diff 約 17 KB）。歯 cexcl_ の 4 本が緑、clippy -p xtask --all-targets -D warnings が rc 0。変異（表に tsuzuri の core の行を足す・表の裁定 id を判断の記録に無い id にする・持ち込んだ木かを見ない・判断の記録の裁定 id を見ない・知らない鍵を通す・同じ規則と path の 2 度目を通す・歯の名に filter の語・錠に encoding_rs を戻す・表の本数の字だけを 25 本にする）で、それぞれ名指した歯が落ちた。

      範囲の外。folio2/ の木の中の、tsuzuri で働かない file（CLAUDE.md・.beads・.vessel など）の扱いは、持ち込みの後の最初の便で持ち主に問う。

  - n: 8
    type: prose
    title: 行 c-note-retired — 廃止したノートを着地の名指しから外す
    body: |
      在りかの main は f371566（計画 surface-plan 第 0.98 版・ノート surface-wave23b 第 0.3 版）。中核の crate の src/graph/check.rs と、境界の crate の src/server/board.rs と src/cli/graph.rs と、着地済みの歯 tests/cnote.rs を書き、新しい歯の file tests/cnret.rs を足す。計画 9 節の計画だけの行 c-note-retired を契約の行にした。拠りは持ち主の裁定 t3-hub.66.1（判断の表 d38）と t3-hub.66.3（判断の記録 ADR-20 決定 (2)・廃止したノートを名指しから外すのはこの行の着地から）。

      なぜ。行 c-note-stale（ノート surface-wave20b・着地済み）は設計ノートの状態を読まずに、全部の契約表の行が着地したノートを名指す（その時の folio の索引に状態の欄が無かった）。2026-09-29 に全部の行が着地したノート 75 本を廃止した（状態 retired・計画が後継）ので、今の名指しは廃止済みのノートを並べ、退役の忘れを名指す役（条 P-28.5）を果たさない。folio 0c910db の索引の --summary の行は 8 つ目の欄 status を持ち、設計ノートの行の節点にはそのノートの状態の字（effective・retired ほか）が入る（ほかの種類は判断の記録が accepted か proposed、残りは null）。tsuzuri は設計文書の YAML を読まない（計画 3 節の席の決め）ので、状態はこの欄から読む。

      決めた幅（まだ分からないの範囲）。全部の行が着地したノートのどれかの状態が読めなければ、名指しの行全体をまだ分からないにする（その行を黙って名指しも除きもしない・条 P-7）。状態が読めないのは、要約の字が読めない（空か JSON の object でない行が在る）・そのノートの行の節点に要約の状態の字が無い・そのノートの行の状態の字が揃わない、の時。全部の行が着地したノートが 1 つも無ければ、状態が読めなくても名指しは 0 と分かる（名指す物が無い）。この幅のため、索引に着地したノートを持たない着地済みの歯 kcli・ksum・kg9・g3g7w の --check の期待は変わらない。

      形（中核）。check.rs に pub const RETIRED（字 retired）と pub fn note_states（要約の字を受け、種類が設計ノートの行で欄 id と status が字の行の id から状態の字への表を返す・空の字か JSON の object でない行が 1 つでも在れば None）を置き、use に serde_json の Value と super::build の NOTE_ROW_KIND を足す。pub fn landed_notes は引数に要約の字 summary を足し（Graph・台帳の字・要約の字）、文書 id ごとに行の節点の id を集め、全部の行が着地した文書 id ごとに行の状態の字の集まりを見て、ちょうど RETIRED の 1 つなら外し、ほかの 1 つなら名指し、それ以外なら Unknown を返す。着地の述語 fn landed と着地した行の判じは変えない。module の doc に 1 行、landed_notes の doc を直す。

      形（境界）。board.rs の built_floors は landed_notes に Texts の欄 summary の字も渡す（Floors の欄 landed の doc を直す）。cli/graph.rs の LANDED_UNKNOWN の字を 全部の行が着地した設計ノート（設計の索引か台帳か状態の欄が読めない）に直し、file の頭の doc の --check の項を直す。tz graph --check の口と引数と終了 code は変えない。

      直す着地済みの歯（tests/cnote.rs）。landed_notes を撃つ 2 か所に要約の字を渡し、節の要約の字 SUM（12 の節点の行・状態はどれも effective）を置き、Texts の欄 summary を SUM にする。偽の設計の道具は 3 つ目の引数が --summary なら SUM の file を返す（今は どの引数にも索引）。要約が読めるので --check の標準出力に要約の無い節点の行と名指した id の対の行が増える。fn cnote_check_names_notes は標準出力の全部の字でなく、末尾が landed の行と要約の行の 2 行で LANDED_HEAD の行が 1 つであることを見る。fn cnote_unread_goes_to_stderr は標準出力が 1 行であることでなく、最後の行が tz graph --check で始まることを見る。LANDED_UNKNOWN の字の期待を直す。

      歯（tests/cnret.rs・接頭辞 cnret_）。節の索引は設計ノートの行 5（ra#r1・ra#r2・rb#r1・rc#r1・rd#r1）、節の台帳は根の epic y と子の task 5 本（y.1 から y.4 は着地した closed で ra の 2 行と rb と rc の行を指し、y.5 は open で rd の行を指す）。要約の字は判断の記録の行 1 つ（状態 accepted・種類を見ない読みが落ちる）と 5 つの行（ra は retired・rb は effective・rc は draft・rd は retired）。歯 cnret_state_decides・cnret_unread_state_is_unknown は中核と board の関数を直に撃ち、cnret_check_leaves_retired_out は CARGO_TARGET_TMPDIR の下の cnret の dir に作業場を作って tz graph --check を撃つ。

      filter の語は、起草の時の main f371566 の契約表の verify の最後の字 296 語を、ほかの語を部分の字として含まない 220 語に畳んだ次の語で、歯の file は同じ語を const FILTERS に持つ（行 g-unref-dash-acct の歯 tests/udacct.rs も同じ語を持つ）。接頭辞 cnret_ と udacct_ は 296 語のどれも含まず、どれにも含まれない。
      aaround_・abss_・abst_・accept_・acchold_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・aface_・afocus_・alean_・aord_・aown_・apark_・apop_・areread_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadl_・cadopt_・cadq_・cdorm_・cexcl_・cfsplit_・cg9_・cgdom_・cmark_・cnote_・contract_form_・cround_・csled_・cspk_・ctick_・cupd_・cupdlist_・denv_・dnedge_・dngrp_・dnrow_・dnskip_・dretry_・ecache_・epolq_・eretry_・esig_・evkind_・flight_・fmark_・fprem_・frame_・fserve_・fstop_・fxpre_・g3g7_・gacct_・gapspage_・gatt_・gbnote_・gchip_・gcoach_・gfix_・gfresh_・ghb_・gins_・gjst_・glabel_・gnav_・gpface_・gpill_・gpulse_・graph_・gsum_・gtuck_・gview_・gwv_・hacols_・harest_・hasplit_・hbconf_・hbmark_・hbon_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hdchip_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hshist_・hspage_・hspk_・hsym_・hthr_・http_・hwstore_・iclose_・ilink_・jcount_・jrun_・kcli_・kg9_・kindlab_・klink_・ksum_・launch_・lcard_・ledgerblock_・lgrp_・lhome_・lidle_・lkind_・lresume_・lsnap_・lspark_・lstg_・lstore_・mapview_・mkeys_・mlink_・mqask_・mqface_・mstore_・mtips_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntc_・ntime_・nxact_・nxorg_・parts_・pci_・pclosed_・pfold_・pgsw_・pgz_・pipe_・plimit_・pmisfit_・pmore_・pquest_・pqueue_・project_・ptitle_・pubfp_・pubscan_・punmap_・pwhole_・qblock_・qgate_・qkey_・qsig_・question_・rbusy_・relay_・rhold_・runsdoc_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server::events::・server_・sesplit_・sgrace_・shb_・skeleton_・smore_・stage_・stats_・stbp_・stcli_・steady_・sthr_・stnfy_・stskill_・sttgt_・sxaxis_・ticker_・tipx_・tkad_・tlic_・topbar_・topfit_・tz_・udash_・unow_・urpanel_・uword_・wstrip_

      置き場だけの = の歯。--check の標準出力を字で見る着地済みの歯 kcli・ksum・kg9・g3g7w は書かずに verify で撃つ（索引に着地したノートが無いので 0 の行のまま）。landed_notes と built_floors と LANDED_UNKNOWN の読み手を契約・中核・境界・面の crate の src と tests と xtask で grep すると、src は board.rs と cli/graph.rs、歯は cnote と kg9（built_floors）だけ。

      試作と噛み。main f371566 の写しで cnret の 4 本と cnote・kcli・ksum・kg9・g3g7w が通り、xtask の check が緑。変異 7 つ（廃止を外さない・状態が読めない時も名指す・種類を見ない・読めない行を飛ばす・board が要約を渡さない・揃わない状態の先頭を取る・歯の名に filter の語）で、それぞれ名指した歯が落ちた。試作の tz で、今の main の design-intent と台帳を pin の folio（0c910db）で撃った --check は 全部の行が着地した設計ノート 0 の行を出した（2026-09-29 に廃止した 75 本は、全部の行が着地したノートとして廃止したもので、名指さない）。

      依存と順。depends は空。計画 5 節の鎖の core/graph/check.rs と cli/graph.rs は、c-note-stale（着地済み）→ この行 → c-g9-deny（計画だけの行・便の bead の依存で持つ）。build.rs は書かない（計画だけの行 c-map-lc が書く）。同じノートのほかの行と書く file は重ならない。

      範囲の外。地図で廃止のノートを畳むこと（計画だけの行 g-map-retired）。廃止の忘れを落とす側へ替えることと猶予の値。folio の pin を上げること（0c910db は発効済み）。

  - n: 9
    type: prose
    title: 行 g-unref-dash-acct — account board の台帳の tab の未反映の数を ― にする
    body: |
      在りかの main は f371566（計画 surface-plan 第 0.98 版）。面の crate の src/account/ledger.rs と、着地済みの歯 tests/hacols.rs と tests/harest.rs を書き、新しい歯の file tests/udacct.rs を足す。計画 9 節の計画だけの行 g-unref-dash-acct（起草 w22d2 の見つけ・席の決め 2026-09-29）を契約の行にした。拠りは要件 FR13。

      なぜ。行 c-unref-now（着地済み）で、中核は未反映の 3 種を器の局面の出力が来るまで全部 まだ分からない にし、電文の unreflected は 0 になった。行 g-unref-dash（ノート surface-wave22d・着地済み）で project board の台帳の block は 3 種とも分からない時に字 ― を出すようになり、account board の各 project の表も unref_of で ― を出す。ところが account board の台帳の tab（見本 mock3 の session の tab の ledger）は、行の未反映の数に 0 を出し、隣に測れていないの印を添える。見本 mock3 の account の頁の ledTable は未反映が null の行に ― を出し、extremes は null を除き、印の関数 xm は null に印を付けない。この行はその字に揃える。

      形。src/account/ledger.rs の use に projects の unref_of を足す。LedRow の numbers の 4 つ目を c.unref.text()（行 g-unref-dash の Unref の text・3 種とも分からなければ ―・ほかは部分の和の数）にする。fn table の未反映の列の最大と最小は、電文の projects の unref_of が数を返す行（台帳が Known で 1 種でも読める行）の数だけで数え、行の未反映の cell の class の印は unref_of が数を返す行だけに付ける（3 種とも分からない行は c-n c-un で、数は 0 なので on も付かない）。mod dom の未反映の cell は b の中身を cells.unref.text() にし、印は cells.unref.partial() の時だけ state_icon(UNKNOWN) を置く。module の doc と numbers の doc と table の doc を直す。Cells の欄 unref は unref_count の値のまま（行の詳しくの段と card は変えない）。

      画面の字（歯で測らず、この行の差分で持つ）。3 種とも分からない行は未反映の cell に ― だけで印を添えない。1 種か 2 種が分からない行は今のまま数と印、どれも分かる行は数だけ。台帳が Unknown の行は今のまま全部 ―。account board の各 project の表・project board の台帳の block・電文の形・中核の数え方は変えない。並べ方（judge・project・net・backlog）は未反映を使わないので変わらない。

      直す着地済みの歯。hacols の fn hacols_dom_words の ledger.rs の DOM の字の 2 つ（cells.unref.count と cells.unref.unknown.is_empty()）を cells.unref.text() と cells.unref.partial() にする。harest の fn harest_dom_words の ledger.rs の字の 1 つ（un_class に mark(ext_un, f64::from(s.unreflected)) を渡す字）を unref_of(p).and_then(|u| mark(ext_un, f64::from(u.count))), にする。

      歯（tests/udacct.rs・接頭辞 udacct_）。fixture tests/fixtures/account/acct-doc.json（行 h-acct-rest の fixture・proj-a の台帳は未反映 3 で ruling と request が分からない・proj-b と proj-c は台帳が Unknown）の 3 行の台帳を差し替えた電文を table に Sort の Project で渡す。3 種とも分からない台帳は proj-a の台帳の unreflected を 0、unreflected_kinds を空、unreflected_unknown を 3 種の全部にした値（行 c-unref-now の今の中核の値）。DOM は wasm の target でしか組めないので、src の字の mod dom 以降を読む。filter の語は 8 節に並べた 220 語。

      置き場だけの = の歯。account の ledger の item（table・Cells・LedRow・numbers・marks・un_class）を面の crate の tests と src で grep すると、書かない歯は acctled（fixture の proj-a は部分の和で数 3 のまま）・hcled・ledspark で、verify で撃つ。unow と projects.rs は account の projects の表を見て、この行は書かない。

      試作と噛み。main f371566 の写しで udacct の 3 本と hacols・harest・acctled・hcled・ledspark が通り、xtask の check が緑。変異 6 つ（数の字を count に戻す・読めない行も最大と最小に数える・読めない行にも印・DOM の数を count に戻す・DOM の印を読めない種類の有無に戻す・歯の名に filter の語）で、それぞれ名指した歯が落ちた。

      依存と順。depends は空（行 g-unref-dash は着地済みで、その Unref の text と partial を使う）。計画 5 節の鎖の surface/account/ledger.rs は h-acct-rest（着地済み）→ この行、面の歯 hacols と harest も h-acct-rest と g-kind-label（着地済み）→ この行。同じノートのほかの行と書く file は重ならない。

      範囲の外。account board の各 project の表と Σ の字（今のまま unref_of）。未反映の数え方と器の局面の出力を読むこと（計画だけの行 c-unref-lc・g-unref-lc）。

  - n: 10
    type: prose
    title: 行 g-map-retired — 地図で廃止した設計ノートを既定で畳む
    body: |
      在りかの main は efe709f3（計画 surface-plan 第 1.01 版・ノート surface-wave23b 第 0.6 版）。契約の crate の src/graph.rs、中核の crate の src/graph/check.rs、境界の crate の src/server/board.rs と src/cli/graph.rs、面の crate の src/mapview/mod.rs と compact.rs と tree.rs と、着地済みの歯 契約の tests/cform_graph.rs と面の tests/mtree.rs を書き、新しい歯の file 境界の tests/gmretw.rs と面の tests/gmret.rs を足す。計画 9 節の計画だけの行 g-map-retired を契約の行にした。拠りは持ち主の裁定 t3-hub.66.1（判断の表 d38・地図の文書の側は folio の索引から描く）と t3-hub.66.2（判断の表 d39・folio の索引の状態の欄）と要件 FR5。

      なぜ。2026-09-29 に全部の行が着地した設計ノート 75 本を状態 retired で置き場に残して廃止した（判断の記録 ADR-20）。地図の既定の面（圧縮）の design-note の帯は、ノートごとの見出しの下に全部の行の札を並べるので、廃止したノートの行 181 が生きたノートの行の間に並ぶ。設計の木も design-note の帯の下の全部のノートを開いて出す。folio 0c910db の索引の --summary の行は 8 つ目の欄 status を持ち、設計ノートの行の節点にはそのノートの状態の字が入る（行 c-note-retired が読む欄）が、面が読む電文 GraphDoc に状態の欄は無い。

      決めた幅（席の決め・起草 w26a）。(a) 状態を面に渡す口は、契約の型 GraphDoc に欄 retired（状態が retired の設計ノートの文書 id の列・読めなければ無し）を 1 つ足す形にした。決定はしご（条 P-27）: 要るか = 要る（面は YAML も要約も読まない）。既に在るか = 状態の字の読み note_states と字 RETIRED は中核に在り（行 c-note-retired）、同じ読みで文書 id を挙げる。節点ごとの欄（GraphNode に status）は struct の字で組む所が 44 か所あり、文書の状態は文書に 1 つなので、文書 id の列を電文に 1 つ持つ方が小さい（GraphDoc を struct の字で組む所は src の 2 か所と歯 cform_graph の 2 か所だけ）。欄は serde の default と、無しなら書かない形にし、欄の無い電文（前の版の server と tz graph --design）は無し（まだ分からない）と読む。(b) 畳む面は、ノートごとの組を持つ 3 面のうち圧縮の面と設計の木の 2 つ。グラフの面は今もどのノートも組の箱 ~note:<文書 id> に既定で畳み（行 c-graph-fold）、開けば見せるので書かない（廃止のノートを 1 つの箱に束ねるなら中核の fold と眺めの電文を書く別の行）。一覧と表の面は節点の平たい列で組を持たないので書かない。(c) 見せ方は、design-note の帯の末尾に廃止したノートを束ねた 1 つの段を置き、既定で閉じ、見出しに状態の字 retired と束ねたノートの数を出し、開けば今と同じノートの組（見出しと札）を出す。設計の木では段の下のノートの項も畳む（閉じた項目を既定で畳む行 g-map-tree の決めに揃える）。帯の数は廃止のノートの行も数えたまま。(d) 開き閉じは URL に残さず、kit の fold の記録で頁の一生の間だけ持つ（鍵 map:retired と tree:retired）。要件 FR5 は URL に残す物を面の切り替えと段数と近傍の畳みとし、グラフの開いた箱と木の開き閉じは頁の間だけ持つので、それに揃える。(e) まだ分からないの形は行 c-note-retired に揃える: 設計の索引が読めない・要約の字が読めない・どれかの設計ノートの行の状態の字が無い・揃わなければ文書 id の列の全体をまだ分からない（欄 retired は無し）にし、設計ノートの行が無ければ要約の字が読めなくても空の列。欄が無いとき面は何も畳まず、design-note の帯の箱と設計の木の頭に理由の行 設計ノートの状態の欄が読めない（廃止したノートも畳まずに出す）を出す（黙って畳みも見せもしない・条 P-7）。

      形（契約と中核と境界）。契約の GraphDoc に欄 retired: Option<Vec<String>> を足す（serde の default と skip_serializing_if）。中核の check.rs に pub fn retired_notes（Graph と要約の字を受け、設計ノートの行の節点の id を最初の井桁で文書 id に分け、文書 id ごとの行の状態の字がちょうど RETIRED の 1 つなら挙げる）を置き、行の状態の字の集まりを 1 つに揃える判じを私的な fn doc_state に移して landed_notes と共に使う（landed_notes の値は変えない）。境界の board::doc は要約の字を 3 つ目の引数に受け、欄 retired に retired_notes の Known の列を写し、board::graph と tz graph の旗なしと --check は集めた要約の字を渡す。tz graph --design の design_view は欄 retired を無しにする（folio の graph の吸収の出力は変えない）。

      形（面）。mapview/mod.rs に const RETIRED（字 retired）と RETIRED_UNREAD と、電文の欄 retired を文書 id の集まりにする retired_notes と、設計の索引が読めて設計ノートの行が在り欄 retired が無い時だけ理由を返す retired_unread を置く。compact.rs の BandBox に欄 retired（廃止したノートの組）を足し、design-note の帯の組を廃止していない組（Notes）と廃止した組に分ける（欄 retired が無ければ全部を Notes）。mod dom は design-note の帯の箱にだけ段を置き、理由があれば理由の行、廃止した組があれば閉じた details（鍵 map:retired）に今の Notes の枝と同じ DOM で組を出す。tree.rs の Head に Retired（数）を足し、design-note の帯の項を、廃止していないノートの開いた項・井桁の無い項・畳んだ廃止の段の順にする（欄 retired が無ければ今の順と開き閉じのまま）。mod dom は設計の木の時だけ理由の行を出し、段の頭に状態の字と数を出す。

      直す着地済みの歯。契約の cform_graph の GraphDoc の 2 つの値に欄 retired の無しを足す（電文の字と snapshot は変わらない）。面の mtree の項の名の関数 name に Head::Retired の腕を 1 つ足す。

      歯（境界の tests/gmretw.rs・接頭辞 gmretw_ と面の tests/gmret.rs・接頭辞 gmret_）。gmretw は設計の索引（設計ノートの行 5 と判断の記録 1）と要約の字（判断の記録の行 1 つと設計ノートの行 5 つ・ra と rd が retired）で中核と board の関数を直に撃つ（子 process も file も使わない）。gmret は fixture tests/fixtures/surface/graph-doc.json の設計ノートの行を 4 つのノートの行に替えた電文で、圧縮の面の箱と設計の木の項を組み、DOM は wasm の target でしか組めないので compact.rs と tree.rs の mod dom 以降の字を読む。

      filter の語は、起草の時の main efe709f3 の契約表の verify の最後の字 298 語を、ほかの語を部分の字として含まない 222 語に畳んだ次の語で、2 つの歯の file は同じ語を const FILTERS に持つ。接頭辞 gmret_ と gmretw_ は 298 語のどれも含まず、どれにも含まれない。
      aaround_・abss_・abst_・accept_・acchold_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・aface_・afocus_・alean_・aord_・aown_・apark_・apop_・areread_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadl_・cadopt_・cadq_・cdorm_・cexcl_・cfsplit_・cg9_・cgdom_・cmark_・cnote_・cnret_・contract_form_・cround_・csled_・cspk_・ctick_・cupd_・cupdlist_・denv_・dnedge_・dngrp_・dnrow_・dnskip_・dretry_・ecache_・epolq_・eretry_・esig_・evkind_・flight_・fmark_・fprem_・frame_・fserve_・fstop_・fxpre_・g3g7_・gacct_・gapspage_・gatt_・gbnote_・gchip_・gcoach_・gfix_・gfresh_・ghb_・gins_・gjst_・glabel_・gnav_・gpface_・gpill_・gpulse_・graph_・gsum_・gtuck_・gview_・gwv_・hacols_・harest_・hasplit_・hbconf_・hbmark_・hbon_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hdchip_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hshist_・hspage_・hspk_・hsym_・hthr_・http_・hwstore_・iclose_・ilink_・jcount_・jrun_・kcli_・kg9_・kindlab_・klink_・ksum_・launch_・lcard_・ledgerblock_・lgrp_・lhome_・lidle_・lkind_・lresume_・lsnap_・lspark_・lstg_・lstore_・mapview_・mkeys_・mlink_・mqask_・mqface_・mstore_・mtips_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntc_・ntime_・nxact_・nxorg_・parts_・pci_・pclosed_・pfold_・pgsw_・pgz_・pipe_・plimit_・pmisfit_・pmore_・pquest_・pqueue_・project_・ptitle_・pubfp_・pubscan_・punmap_・pwhole_・qblock_・qgate_・qkey_・qsig_・question_・rbusy_・relay_・rhold_・runsdoc_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server::events::・server_・sesplit_・sgrace_・shb_・skeleton_・smore_・stage_・stats_・stbp_・stcli_・steady_・sthr_・stnfy_・stskill_・sttgt_・sxaxis_・ticker_・tipx_・tkad_・tlic_・topbar_・topfit_・tz_・udacct_・udash_・unow_・urpanel_・uword_・wstrip_

      置き場だけの = の歯。compact.rs の字か compact の関数と BandBox を読む面の歯 dngrp・mtips・ncard・maplink・mapview、landed_notes を撃つ境界の歯 cnret・cnote、board::graph と board::doc か tz graph の出力を読む境界の歯 kcli・dnskipw・g3g7w は書かずに verify で撃つ（契約・中核・境界・面の crate の tests と xtask の src を grep した）。

      試作と噛み。main efe709f3 の写しで gmret の 5 本と gmretw の 3 本と書き換えた mtree・cform_graph と置き場だけの = の歯が通り、xtask の check が緑。変異（retired_notes が廃止を挙げない・揃わない状態を先頭で判じる・読めない要約で空の列・board が欄 retired を写さない・圧縮の面が廃止の組を分けない・木の段を開く・欄が無い時も理由を出さない・DOM の段を閉じにしない・歯の名に filter の語）で、それぞれ名指した歯が落ちた。

      依存と順。depends は空（行 c-note-retired は着地済みで、その note_states と RETIRED を使う）。計画 5 節の鎖: core/graph/check.rs は c-note-retired → この行 → c-g9-deny（計画だけの行・便の bead の依存で持つ）、cli/graph.rs と server/board.rs は c-note-retired → この行、contract/graph.rs は c-updated → この行、mapview/compact.rs は g-dn-group → この行、mapview/mod.rs と tree.rs は g-map-tree → この行。同じノートのほかの行と書く file は重ならない。

      範囲の外。グラフの面で廃止のノートを 1 つの箱に束ねること（中核の fold と眺めの電文）。一覧と表の面で廃止のノートの行を絞ること。ノートの状態の字を節点の card や一覧の状態の欄に出すこと。廃止のノートの行を地図から落とすこと（開けば見せる）。

  - n: 11
    type: prose
    title: 行 f-undelivered — 席に届いていない裁定を面に出す
    body: |
      在りかの main は efe709f3（計画 surface-plan 第 1.01 版・ノート surface-wave23b 第 0.6 版）。境界の crate の新しい口の file src/server/routes/unreceived.rs と、面の crate の src/project/ask.rs と src/project/next.rs と着地済みの歯 tests/hsderive.rs を書き、新しい歯の file 境界の tests/fundl.rs と面の tests/lateface.rs を足す。計画 9 節の計画だけの行 f-undelivered を契約の行にした。拠りは要件 FR9（裁定から 2 分で席の受けが無ければ面は 席に届いていない と出す）と規則の行 R-21（裁定から席の受けが 2 分 無ければ 届いていない）。

      なぜ。裁定は、待ちの席へは server が器の配達の口を撃ち、考え中の席へは停止の hook が拾う（行 f-mark・f-stop・f-mark-serve・e-deliver-retry は着地済み）。どちらも届けたら裁定の行の在る問いの notes に配達済みの印（配達 = 裁定の id・経路 = 配達の口 か 停止・時刻 = 分）を置く。ところが面は、届いたかをどこにも出さない。起草の時の台帳では、問いの裁定の行の全部に印が在り、裁定の分から印の分までが 2 分以上の裁定が 3 割を越える（考え中の席を停止の hook が拾う分）。持ち主は答えた後に席が受けたかを画面で知れない。

      席の受けの決め（席の決め 2026-09-29）。席の受けは配達済みの印で判じる。計画 6 節の器の答え（2026-09-27T23:0xZ）の hook の配達済みの印で決める と、要件 FR9 の verify の 席の受けの行 に合わせた。器の答え（2026-09-28T04:5xZ）の RulingReceived は、server が裁定を記帳した時に書く承認の event（計画だけの行 e-approval-event）で、答えの時刻に必ず在るので受けを測れない。器の新しい形（答えの口と bind）も答えの時刻に書くので同じ。器の変更は要らない。

      形（境界）。口 GET /api/unreceived（routes の新しい file・口の列は組み立ての script が routes の dir から作る）は、台帳の字（server の台帳の読み・持ち回しの字を含む）を中核の delivery の undelivered で読み、印の無い裁定の id の列を台帳の順に Known で、台帳が読めなければ Unknown で返す（契約の型 board の Reading と surface の RulingId・新しい契約の型は置かない）。読むだけの server も同じに返す。中核と契約は書かない。

      形（面）。ask.rs に口の path UNRECEIVED_PATH（PATHS に足す）と、待つ秒 RECEIPT_WAIT_S（120）と、行の頭 UNRECEIVED_HEAD と読めない時の 1 行 UNRECEIVED_UNKNOWN と、純粋な関数 minute_end・late・unreceived・unreceived_line を置き、mod dom に late_view（口を読み 1 秒の時計 net の ticker で unreceived_line を書き直す 1 行）を置いて一覧の上に出し、wasm の target の pub fn late_view で next.rs にも渡す。next.rs の mod dom は同じ 1 行を箱の上に出す。2 分は裁定の id の分の終わりから数える（分の始まりから数えると実際の裁定から 1 分と少しで出るので、2 分より早く出さない・出るのは実際の裁定の 2 分から 3 分の後）。2 分の判じを面の時計で行うのは、台帳が動かない間は面が口を読み直さず、server の時刻で判じると 2 分の境で出ないため。分の読めない id は待たずに出す（読めない物を黙って消さない・条 P-7）。

      画面の字（歯で測らず、この行の差分で持つ）。1 行は class small と role status の div。まだ読んでいない間と、届いていない裁定が無い時は何も出さない。口が読めない時は UNRECEIVED_UNKNOWN の 1 行を出す（前の版の server は口を持たないので、面だけが先に替わるとこの 1 行が出る）。1 行は裁定の id だけを並べ、逐語は出さない。面の合図の読み直しの表 view.rs の RELOAD_KINDS には足さない（表に無い口は全部の合図で読み直す・書く file を増やさない）。

      直す着地済みの歯（tests/hsderive.rs）。block の module の口の列の期待の ask の行と、ask::PATHS の期待に /api/unreceived と UNRECEIVED_PATH を足す。

      歯（接頭辞 fundl_ と lateface_）。fundl.rs は台帳を歯の中で組み（逐語は作った字）、偽の bd が作業場の out.json を出し、server を同じ process の thread で立てて口を撃つ。lateface.rs は純粋な関数を host で撃ち、DOM は wasm の target でしか組めないので src の字の mod dom 以降を読む。2 つの接頭辞は、起草の時の main の契約表の verify の最後の字 298 語のどれとも、部分の字として重ならない（filter の語を集める script で照らした）。

      置き場だけの = の歯。ask.rs か next.rs の字を読む着地済みの面の歯 15（aaround・aface・askcard・askfocus・cadopt・cadq・mqface・nact・next・nextact・nxorg・qblock・qkey・rbusy・tkad）と、routes の dir の file と口の列を比べる境界の歯 hbroute は書かずに verify で撃つ。mod dom の section の呼びは 1 行のまま（歯 qkey が section(BLOCK の字を読む）にし、1 行を足した中身は変数に置いた。

      試作と噛み。main efe709f3 の写しで fundl の 2 本と lateface の 4 本と hsderive と上の = の歯が通り、xtask の check が緑。変異 9 つ（口が Known の空の列を返す・読めない台帳を Known の空の列にする・分の始まりから数える・120 秒ちょうどで出さない・分の読めない id を隠す・読めない口で何も出さない・next.rs の 1 行を外す・ask.rs の 1 行を外す・ask の PATHS から口を外す）で、それぞれ名指した歯が落ちた。

      依存と順。depends は空。計画 5 節の鎖の surface/project/ask.rs と next.rs の前の行（g-tick-adopt・e-ask-own-only・e-multi-ask ほか）は着地済み。同じノートのほかの行と書く file は重ならない。境界の server の口の file は新しい file だけで、ruling.rs は書かない（計画だけの行 e-approval-event とは重ならない）。

      範囲の外。承認の event を器の event log に書くこと（計画だけの行 e-approval-event・器の答えの口を待つ）。account board と ほかの project の問いの裁定（この口は自分の台帳だけを読む）。契約の型 surface の SurfaceState（欄 undelivered を持つがどの口も出さない）はこの行で使わない。配達そのものの撃ち直しの間と上限（行 e-deliver-retry）。

  - n: 12
    type: prose
    title: 行 c-park-acct — 区画の席を移動待ちに数えず、電文に区画の名を置く
    body: |
      在りかの main は 6d7e98e5（計画 surface-plan 第 1.03 版・ノート surface-wave23b 第 0.9 版）。契約の crate の src/board.rs と src/account.rs、中核の crate の src/seat.rs と src/next_step.rs と src/account/host.rs と src/account/project.rs、面の crate の src/project/seat.rs と、着地済みの歯 契約の tests/cform_board.rs と tests/cform_seat.rs と中核の tests/apark.rs と tests/seat.rs を書き、新しい歯の file 中核の tests/pkac.rs と面の tests/pkacface.rs を足す。計画だけの行ではない（2026-09-29 に起草 w27a が行 g-park-view の見せ方の問いを作る時に実物の画面で見つけた誤りの直しで、席の決め 2026-09-29）。拠りは要件 FR12（project の群は今の口座 1 つと候補の集合を持ち、次の移り先は器の doctor と同じ導出の値を写す）と、行 c-acct-park（ノート surface-wave23b の 1 行目・区画の行を群の枠の列から外し、区画の anchor の席の group を区画の行の写しにした）。

      なぜ。器は 2026-09-29 に host の 8 つの置き場の host.toml に区画 Tier9（anchors 3・口座は Tier1 と同じ 6 口座）を宣言し、doctor に group=Tier9 kind=park accounts=… anchors=3 seat-accounts=none current=- next=- refused=- pressure=- の行が出る。区画は群と違って今の口座の記録を持たず、器の管理 tick が周ごとに席の登録の口座が閾値以上かを見て、以上の席だけを区画の行の口座から次の口座へ移す（器の seat/tick/park.rs）。行 c-acct-park の後の中核は、区画の anchor の席の card の group を区画の行の写し（今の口座 -・次の字 -）にするので、登録の口座と今の口座 - は必ず違う。起草の時に main の tz を読むだけで起こして測ると、区画の 3 席は account board の要対応で (a) 限度 / 移動 1 件 に当たり（要対応の重い順の先頭に sev-hi で並ぶ）、区画の席の project board の状態の帯は 移動待ち と 次の移り先 の行を出した。どちらも区画の席が移動を待っていないのに出る誤りである。

      形（契約）。board.rs の GroupRow に欄 park: bool を足す（器の park の区画の行の写しか・serde の既定は false・false は電文に字を置かない skip_serializing_if）。account.rs の AccountDoc に欄 parks: Vec<String> を欄 groups の後に足す（区画の名・宣言の順・serde の既定は空・空は電文に字を置かない）。どちらも区画が無い電文の字を変えないので、fixture の acct-doc.json と seat-card.json と seat-inputs.json は書かない。

      形（中核）。seat.rs の fn group は、doctor の同じ名の群の行の欄 kind が account の host の PARK_KIND（字 park）ちょうどなら GroupRow の park を true にする（行 c-acct-park と同じく欄 kind だけが決める）。account/host.rs に pub fn parks を足し（群の宣言の順・doctor に同じ名で欄 kind が park の行が在る宣言の名・宣言か doctor の字が無ければ空）、群の枠の fn card の GroupRow は park false。account/project.rs の pub fn assemble は parks を空にし、pub fn doc は host の parks を置く。next_step.rs の fn seat_found の限度と移動は、登録の口座と群の行の今の口座を比べる前に park を見て、区画の行の写しなら比べない（状態が limit なら区画の席でも当たる）。

      形（面）。project/seat.rs の pub fn band は、群の行が区画の行の写しなら移動待ちの行と次の移り先の行を出さない（限度・猶予の内〔器の move= と grace_left= の写し〕・移り先の無い断り・逼迫の行は今のまま・逼迫の行の今の口座は区画の行の字 - のまま）。DOM は書かない。

      決めた幅。区画の席の card を区画と判じる材料は doctor の区画の行の欄 kind だけで、今の口座の字 - や名 Tier9 を見ない（器の区画の名は Tier9 に決まっているが、名の決まりは持たない・行 c-acct-park）。電文の parks は群の枠の列（Reading）と違い、読めない時も空の列にする（区画の無い電文と同じ字・読めない時は群の枠の列が Unknown で面は群の枠が無いと出す）。区画の席の移動（器の seat tick status の欄 move= と grace_left=）は今のまま写し、面の帯は猶予の内の行を出す。

      歯（tests/pkac.rs と tests/pkacface.rs・接頭辞 pkac_）。中核の 5 本は、2026-09-29 の器の出力の形（doctor の Tier1 の行と group=Tier9 kind=park の区画の行と席の行・seat tick status の欄 heartbeat_by= を持つ行・kind の key を持たない host.toml の区画の宣言）の字を歯の中で組み、口座と anchor と target は架空の名（acct-1〜acct-3・/work/proj-a と /work/proj-p1〜p3・pa と pp1）にした。面の 1 本は fixture の seat-card.json（読むだけ）の組の群の行を区画の行の写しに替える。filter の語は、起草の時の main 6d7e98e5 の契約表の verify の最後の字 302 語を、ほかの語を部分の字として含まない 226 語に畳んだ語で、中核の歯の file が const FILTERS に持つ。接頭辞 pkac_ は 302 語のどれも含まず、どれにも含まれない。

      直す着地済みの歯。GroupRow を struct の字で組む 4 file に欄 park を足す（契約の cform_board と cform_seat・中核の seat は false、中核の apark の fn apark_seat_card_copies_lot の区画の行の期待は true）。着地済みの歯の名は替えない。置き場だけの = は、AccountDoc と GroupRow の電文を往復するか比べる歯（契約の acctdoc・中核の acctpcore・境界の server_seat と server_acct と server_acctwire・面の sgrace と seatblock と gchip）と、次の一手を席の card で判じる歯（中核と面の nstall）と、src の字を歩く歯（中核の acctcore・面の sesplit）。

      試作と噛み。main 6d7e98e5 の写しで pkac の 6 本と直した 4 file と = の歯が通り、xtask の check が緑。変異 14 個（区画の名を置かない・宣言の全部を区画にする・電文を組む所で置かない・空の列も電文に置く・card が区画を印さない・欄 kind が在れば区画・false も電文に置く・次の一手が区画の口座を比べる・区画の限度も数えない・区画の席の移動の写しを捨てる・歯の名に filter の語・帯が区画にも移動待ちを出す・次の移り先だけ群の字を出す・区画の席の猶予を出さない）で、それぞれ名指した歯が落ちた。src の行数は試作の後で契約の board.rs 253・account.rs 224、中核の seat.rs 557・next_step.rs 194・account/host.rs 681・account/project.rs 676、面の project/seat.rs 935（src の差分は 7 file で 33 行を足し 3 行を消す・歯は新しい 2 file で 561 行と直した 4 file で 4 行）。

      依存と順。depends は空。同じノートの 1 行目 c-acct-park（着地済み）の後の字に書いた。計画 5 節の鎖の contract/seat.rs と core/seat.rs は c-abs-seat（着地済み）の後、surface/project/seat.rs は g-seat-thr の後で、計画だけの行 g-park-view（見せ方・持ち主の問い t3-hub.53.41 の答えの後）の前。contract/account.rs と core/account/host.rs は c-acct-spark と a-lean の後。同じノートのほかの着地していない行と書く file は重ならない。

      範囲の外。区画の見せ方（群の chip と card と account board の行と群の順の見出しの字・計画だけの行 g-park-view）。語の辞書の語 区画（この行は画面に新しい字を出さないので要らない・見せ方の行が足す）。project board の席の block の詳しくの写しの行の一致の印（登録の口座と区画の行の今の口座 - を比べる・見せ方の行で直す）。逼迫の行の区画の席の口座の字。区画の席の口座の占有（行 c-acct-park のまま数えない）。器の区画の判定の値（R-C9-1）を写すこと。

  - n: 13
    type: prose
    title: 行 f-deliver — 指し示しを受けた席に裁定の逐語を足す
    body: |
      在りかの main は 11affd91（計画 surface-plan 第 1.04 版・ノート surface-wave23b 第 0.10 版）。中核の crate の src/delivery.rs、境界の crate の src/hook/mod.rs と src/main.rs、repo の根の plugin/hooks/hooks.json と、着地済みの歯 中核の tests/gins.rs（鍵の列の 1 行）を書き、新しい file 境界の src/hook/deliver.rs と、新しい歯の file 中核の tests/fdlv.rs と境界の tests/fdlv.rs を足す。計画 surface-plan の 9 節の計画だけの行 f-deliver（依存 f-stop と f-gate・どちらも着地済み）の前半を契約の行にした。

      なぜ。要件 FR9 は、席が待ちなら器の配達の口で「裁定 <id> が届いた」の 1 行を送り、hook が逐語を注入するとする。器の配達の口（scribe2 seat deliver・器の判断の記録 ADR-0077・器の要件 FR79）が送る行は、器の雛形「<器の名> seat: 裁定 <記帳 id> が届いた（在りかは裁定面の記帳）」の固定の 1 行で、外からの値は記帳 id だけで逐語を持たない（器の PATH の binary 913e63e の seat deliver の help と器の src/seat/deliver.rs で確かめた）。器の ADR-0077 は、逐語を席へ届けるのは消費側の hook の読みとする（器の変更は要らない）。今の tsuzuri には UserPromptSubmit の hook が無く、席の会話に入るのは指し示しの 1 行だけで、席は台帳を自分で読んで逐語を探す。停止の hook（行 f-stop）の答えも指し示しだけ（中核の block の reason は逐語を持たない）。

      形（中核）。delivery.rs に pub const POINTER_HEAD（字「seat: 裁定 」）・POINTER_TAIL（字「 が届いた（在りかは裁定面の記帳）」）・BATCH_FIELD（字「束 = 」・境界の server の batch の BATCH_PREFIX と同じ字）・CONTEXT_CAP（8000）と、pub struct Said（pub な欄 question の BeadId・ruling の RulingId・verbatim の String）と、pub fn pointed と said と context を足す（どれも file も子 process も時計も触らない）。pointed は hook の入力の鍵 prompt の行から器の雛形の id を拾う（器の名の字は見ない・器の名が替わっても拾う）。said は問いの bead（label intake:question・tombstone でない）の notes の裁定の行のうち、id か束の欄の id が名指しに当たる行を台帳の順に返し、逐語の欄（契約の surface の VERBATIM の後の字）を server の escape の逆で戻す。context は Claude Code の UserPromptSubmit の hook の答えの JSON（鍵 hookSpecificOutput の下の hookEventName と additionalContext）を組む。文脈の字は命令の形でなく事実の形の字にする（Claude Code の hook の doc が、命令の形の字は prompt injection の守りに当たりうるとする）。

      形（境界）。新しい module hook の deliver（pub const USAGE・pub struct Args〔欄 repo と bd〕・pub fn parse と run）。run は、使い方の誤りか repo が dir でなければ rc 1、prompt に指し示しが無ければ子 process を撃たずに何も出さずに 0、在れば台帳を bd で 1 回読んで答えを標準出力に書いて 0。台帳が読めない・名指された行が無い時は標準エラーに 1 行を書いて何も出さずに 0（席には指し示しだけが残り、今と同じく席が台帳を読む）。印は置かない。hook は file を書かない。main.rs に腕 hook deliver と doc の 1 行、hook/mod.rs に pub mod deliver と doc の 1 行を足す。lib.rs は書かない。

      形（plugin）。hooks.json に鍵 UserPromptSubmit を足す（matcher を持たない・timeout 10 秒〔bd の読みの上限 5 秒より長く〕・command は門と合図と同じ形で、器の runner の印 scribe2-runner が CLAUDE_PLUGIN_ROOT に在れば撃たず、無ければ CLAUDE_PROJECT_DIR の下の target/debug/tz を引数 hook と deliver と --repo と CLAUDE_PROJECT_DIR の値で撃つ）。器自身の plugin の UserPromptSubmit の打刻（席を Busy にする）とは別の plugin の hook で、並べて撃たれる。

      決めた幅。(1) 印は置かない。配達の口の経路の印は server が器の rc 0 の後に置く（行 f-mark-serve）。hook が印を置くと、指し示しごとに印が 2 行になる。server の印の書きが落ちた時は、停止の hook が次の停止で指し示しを返す（逐語は足さない・今のまま）。(2) 指し示しの id は印の有無で絞らない。器は hook の打刻を見てから rc 0 を返し、server はその後に印を書くので、hook の読みの時に印が在ることもありうる（名指しが正で、印は見ない）。(3) 束の id は束の全部の行を足す（server は束を束の id で 1 度だけ器に渡す）。(4) 逐語の字の合計が CONTEXT_CAP を越える裁定からは逐語を写さず在りかの行を置く（Claude Code は hook の文脈が 10000 字を越えると file に落として先頭 2000 字だけを見せるので、越える前に切る）。(5) 考え中の席を次の tool の呼びで拾う分（計画の行の字の後半）はこの行に入れない。tool の呼びごとの hook で台帳を読むと bd の 1 回の読みが約 0.7 秒かかり（起草の時に 3 回測った）、安く判じるには自分の board の口 GET /api/unreceived を読む形が要り、下請けの agent の tool の呼びでも hook は撃たれて裁定が下請けの文脈に入りうる（Claude Code の hook の doc は、下請けの呼びの入力に鍵 agent_id が載るとする・teammate の呼びは doc に書かれていない）。計画だけの行 f-deliver-tool として残す（席の決め 2026-09-30）。

      歯（中核の tests/fdlv.rs と境界の tests/fdlv.rs・接頭辞 fdlv_）。中核の 6 本は、歯の中で組む台帳（問い fx-d.1〜fx-d.6）と hook の入力と、workspace の根の hooks.json を読む。境界の 5 本は tz の binary を偽の bd で撃つ。filter の語は起草の時の main 11affd91 の契約表の verify の最後の字 303 語を、ほかの語を部分の字として含まない 227 語に畳んだ語で、中核の歯の file が const FILTERS に持つ。直す着地済みの歯は中核の gins の gins_pretool_bash_entry の鍵の列だけ。置き場だけの = は、delivery.rs の字を読む中核の fmark、hooks.json を読む中核と境界の fstop と境界の qsig、main.rs を読む境界の hbconf・qgate・fpremhook・ntcsrv。

      試作と噛み。main 11affd91 の写しで fdlv の 11 本と直した gins と = の歯が通り、xtask の check が緑（nextest 1,654 本）。変異 16 個（指し示しの尾を見ない・重なりを除かない・束の id で拾わない・問いでない bead も拾う・逐語を戻さない・上限を見ない・event の名を違える・hooks.json の command に旗を足す・runner の守りを外す・歯の名に filter の語・指し示しが無くても台帳を読む・無い裁定に空の行を出す・知らない旗を通す〔parse と rc の 2 つ〕・bd の cwd を repo にしない・main.rs の腕を消す）で、それぞれ名指した歯が落ちた。src の行数は試作の後で中核の delivery.rs 296、境界の hook/deliver.rs 111（src の差分は中核と境界の 4 file で 267 行を足し 1 行を消す・hooks.json は 11 行を足す・歯は新しい 2 file で 744 行と直した 1 file で 4 行を足し 1 行を消す）。試作の diff は約 40 KB。

      依存と順。depends は空（依存の f-stop と f-gate は着地済み・同じノートのほかの着地していない行と書く file は重ならない）。計画 5 節の鎖の boundary/main.rs と hook/mod.rs は e-signal-send（着地済み）の後、i-5（着地済み）と並べて走れ、k-parity の前。plugin/hooks/hooks.json と中核の歯 gins は e-signal-send（着地済み）の後。

      範囲の外。考え中の席を次の tool の呼びで拾うこと（計画だけの行 f-deliver-tool）。停止の hook の答えに逐語を足すこと（行 f-stop の答えの形は変えない）。配達の口の経路の印の置き方（行 f-mark-serve のまま）。器の雛形の字の変更（器の名だけが替わるなら直さずに拾う）。

  - n: 14
    type: prose
    title: 行 c-g3-extern — g-3 の外の台帳の行を --project の置き場の台帳で確かめる
    body: |
      在りかの main は 11affd91（計画 surface-plan 第 1.04 版・ノート surface-wave23b 第 0.10 版）。中核の crate の src/graph/mod.rs と src/graph/build.rs と src/graph/check.rs、境界の crate の src/server/board.rs と src/server/others.rs と src/server/routes/graph.rs と src/cli/graph.rs と、着地済みの歯 境界の tests/g3g7w.rs を書き、新しい歯の file 中核の tests/gext.rs と境界の tests/gextw.rs を足す。計画 9 節の計画だけの行 c-g3-extern を契約の行にした。拠りは席の決め（2026-09-28・第 15 波 d の起草の問い 2）と条 P-7.2 と要件 FR3。

      なぜ。行 c-g3g7（ノート surface-wave15d・着地済み）の g-3 は、裁定の書き出しの行の先が自分の台帳に無く、族（bead の id の最初の「.」の前の字）が自分の台帳のどの bead とも違う行（外の台帳の行）を確かめず、そういう行が在ればまだ分からないにする。起草の時の main の置き場で tz graph --check を読むだけで撃つと（pin の folio 0c910db）、g-3 はまだ分からない（理由の字は 読めない出所が在る）で、外の台帳の行は 22 の節点（判断の記録 ADR-2 から ADR-6 の 5 つと、規則の表の discipline の 4 行と thresholds の 13 行）の 22 行、族は 1 種（器 scribe2 の台帳の憲法の承認 s2-07l.214 を bead の形で引く）だった。自分の台帳の族は t3-hub の 1 種で、scribe2 の台帳を読み取りの bd で読むと 848 件・族 26 種で、s2-07l.214 は閉じた bead として在る。行 e-multi-ask（ノート surface-wave22c・着地済み・便 t3-hub.52.122）で、server はほかの project の置き場を起動の引数 --project に持ち、置き場ごとの台帳を読み取りの bd で見張るようになった。この行はその組の台帳で外の台帳の行を確かめる。

      決めた幅（まだ分からないの幅・条 P-7）。(a) 外の台帳の行は、その族を bead の id の族に持つ読めたほかの project の台帳（--project の置き場の順）で確かめる。そのどれかに先が在れば（問いの形は notes の裁定の定型行の id・bead の形と notes の日時の形は bead の id・自分の台帳の Graph::holds と同じ分け）確かめた行、どれにも無ければ違反でその節点を名指す。(b) 族を持つ読めた台帳の無い行（--project の組に無い族・台帳が読めない置き場の族・--project が無い）は確かめられない行で、名指す節点が無くそういう行が在れば g-3 はまだ分からない（今と同じ）。台帳が読めない置き場が在っても、族を持つ読めた台帳で確かめた行の判定は変えない（族は台帳の bead の id の頭で、1 つの族の bead は 1 つの台帳に在る）。(c) 自分の台帳の族の行と、設計の索引か自分の台帳か裁定の書き出しが読めない時の判じは変えない（外の台帳を見る前に判じる）。(d) 外の台帳の bead は節点にせず、ruled_by の辺も組まない（組めば辺の片端が無く g-1 に当たる）。g-7 は自分の台帳の裁定の節点だけを数えるので変えない。(e) tz graph --check の g-3 のまだ分からないの理由は、確かめられない行だけのためなら 読めない出所が在る でなく、その節点の数と族を書く（出所は読めているので）。

      読む時機と重さ。server の口 GET /api/graph は bd を新しく撃たない。行 e-multi-ask の見張りの Source（watched）の got が返す最後の読みの字（口 /api/questions と同じ字・起草中の判断の記録 ADR-23 の決定 (3) の、--project の置き場の見張りの読みを分け合う向きと同じ）を、口の要求のたびに中核の build::outside で読む。読みは bead の id と notes の 2 つの欄だけを serde で読み、ほかの欄は読み捨てる。試作の release の組み立てで scribe2 の台帳の字（8,271,570 byte・848 件）の読みは 10 回の最小で 2.1 ミリ秒で、同じ字を写して前の字と比べる分（2.4 ミリ秒）と同じ程度だったので、読み解いた値を持ち回す表は置かない（持てば台帳の字の写しを置き場ごとに 1 つ余分に持つ）。地図の眺めと近傍の口（/api/graph/view・/api/around）は不変条件を数えないので読まない。tz graph（旗なしと --check）は新しい引数 --project（何度でも・--project=値 の形も）で置き場を受け、置き場ごとに読み取りの bd を 1 本ずつ、自分の 3 つの字の集めと並べて撃つ（1 度だけ撃つ口なので持ち回さない）。起草の時の main の置き場で撃つと、--project の無い撃ちの壁の時間 0.84 秒に対し、scribe2 の置き場を渡した撃ちは 1.03 秒で、g-3 のまだ分からないの行は消えた。--design は --project を読まない（不変条件を数えない）。

      本番の効き目。席の board の server（tz surface serve）と席が撃つ tz graph --check に --project で器の置き場を渡した時から出る（起動の引数の運用は席の置き場の script が持ち、この行は書かない）。--project に置き場を足すと、その project の open の問いも問いの頁に札つきで混ざる（行 e-multi-ask の決め）。

      形（中核）。mod.rs に pub struct Outside（欄 families・beads・rulings はどれも String の BTreeSet・derive は Debug と Clone と Default と PartialEq と Eq と Serialize）と pub fn holds（RulingRow の参照を受け、問いの形は rulings、notes の日時と bead の形は beads に先が在るか）を置き、Graph に欄 outside（Outside の Option の Vec・既定は空の列・読めない置き場は None）を足す。module の doc に 1 文を足す。build.rs に pub(crate) fn family（check.rs の私的な fn family を移す）と、私的な struct OutsideBead（欄 id と notes だけ）と pub fn outside（台帳の一覧の字を受け、空か JSON の配列として読めなければ None、読めれば bead の id と族と notes の裁定の定型行〔typed_lines の裁定の種類〕の id の Outside）を置き、module の doc に 1 文を足す。check.rs の g-3 は、私的な struct G3Rows（名指す節点と、確かめられない行の節点ごとの族）を返す私的な fn g3_rows と、外の台帳の行を確かめる私的な fn outside_holds で数え、pub fn outside_heads（g-3 が確かめられない行だけのためにまだ分からない時の節点の数と族の列・ほかは None）を足す。module の doc に 2 行を足す。

      形（境界）。board.rs に pub fn graph_outside（Texts と Outside の Option の列を受け、built のグラフの欄 outside に置いて不変条件を数え電文にする）を足し、fn graph は空の列の graph_outside にする。others.rs の Others に pub(super) fn outside（組ごとに見張りの最後の読みの字を build::outside で読む・引数の順・字が無いか読めなければ None）を足す。routes/graph.rs の口は graph_outside に shared の others の outside を渡す。cli/graph.rs は、Args に欄 projects、fn parse に何度でも受ける --project（空の値は今の字 --project の値が空で断る）、私的な fn outside（置き場ごとの Source の text を thread で並べて読む）、pub const OUTSIDE_HEAD（字 --project の組の台帳で確かめられない外の台帳の行を持つ節点）を足し、--check の g-3 のまだ分からないの理由を、outside_heads が値を返す時だけ OUTSIDE_HEAD と空白と数と（族 と中黒つなぎの族と）の字にする（ほかの理由は今のまま）。USAGE の末に [--project <dir>]... を足し、file の頭の doc を直す。

      直す着地済みの歯。g3g7w の fn g3g7_check_counts_outside_ids の、族 s9-far の行だけのために g-3 がまだ分からない撃ちの標準エラーの期待を、読めない出所が在る から OUTSIDE_HEAD と 1（族 s9-far）の字に替え、use に OUTSIDE_HEAD を足す。着地済みの歯の名は替えない。

      歯（中核の tests/gext.rs と境界の tests/gextw.rs・接頭辞 gext_）。中核の 4 本は fixture tests/fixtures/graph/unruled/ の 4 つの file（読むだけ）に、族 s9-far と s7-gone と s8-near（作った名）を引く書き出しの行と外の台帳の字を歯の中で足し、関数を直に撃つ。境界の 2 本は歯ごとの作業場（CARGO_TARGET_TMPDIR の下の gextw の dir）に自分の repo と 3 つの置き場（far・cut・gone）と偽の bd と偽の設計の道具を置き、tz を撃つか server を同じ process の thread で立てる（本物の bd と folio と器とほかの project の台帳を撃たない）。filter の語は、起草の時の main 11affd91 の契約表の verify の最後の字 303 語を、ほかの語を部分の字として含まない 227 語に畳んだ語で、中核の歯の file が const FILTERS に持つ。接頭辞 gext_ は 303 語のどれも含まず、どれにも含まれない。

      置き場だけの = の歯。g-3 と g-7 を数える中核の歯 g3g7（外の台帳の読みの無いグラフの判定は変わらない）と、中核の src/graph の字を読む csled と nsum（check.rs と build.rs に file と process と時計の字が無い）と、Graph を struct の字と Default で組む gview と、tz graph --check の出力を読む境界の歯 kcli・ksum・kg9・cnote・cnret と、口 /api/graph を撃つ server_read と、others.rs の見張りを撃つ mqask は書かずに verify で撃つ（中核と境界の crate の tests を grep した）。

      試作と噛み。main 11affd91 の写しで gext の 4 本と gextw の 2 本と直した g3g7w と置き場だけの = の歯が通り、xtask の check が緑（nextest 1,649 本・公開の走査の当たり 0）。変異 16 個（外の台帳を見ない・族を見ずにどの外の台帳でも探す・外で先が無くても違反にしない・問いの形も bead の id で見る・notes の日時の形を裁定の id で見る・方針の行も裁定の id に数える・読めない台帳を空の台帳にする・違反が在っても族を返す・自分の台帳が読めなくても外で確かめる・口が外の台帳を渡さない・組みが外の台帳を捨てる・口の読みが組の字を読まない・tz が --project を捨てる・tz が外の読みを置かない・tz の g-3 の理由を今の字に戻す・歯の名に filter の語）で、それぞれ名指した歯が落ちた。src の行数は試作の後で中核の graph/mod.rs 289・build.rs 678・check.rs 803、境界の server/board.rs 343・others.rs 86・routes/graph.rs 23・cli/graph.rs 433（src の差分は 7 file で 218 行を足し 45 行を消す・歯は新しい 2 file で 696 行と直した 1 file で 2 行）。

      依存と順。depends は空（行 e-multi-ask〔ノート surface-wave22c〕と c-g3g7〔ノート surface-wave15d〕は着地済み・同じノートの着地していない行と書く file は重ならない）。計画 5 節の鎖: core/graph/check.rs と cli/graph.rs は g-map-retired（着地済み）→ この行 → c-g9-deny（計画だけの行・便の bead の依存で持つ）、core/graph/build.rs は g-ledger-kind → この行 → c-map-lc（計画だけの行）、core/graph/mod.rs は c-g3g7 → この行、server/board.rs は g-map-retired → この行、server/others.rs は e-multi-ask → この行。起草中の判断の記録 ADR-23 の行（others.rs を書く台帳の読みの行ほか）が契約の行になれば、others.rs の順は便の bead の依存で持つ。

      範囲の外。起動の引数の運用（席の board の server と席が撃つ tz graph --check に器の置き場を渡すこと）。面の不変条件の頁の g-3 のまだ分からないの理由の字（電文の InvariantCheck は理由を持たない）。外の台帳の bead と裁定を節点や辺にすること。g-7 で外の台帳の裁定を数えること。ほかの project への答え（計画だけの行 e-multi-answer）。

  - n: 15
    type: prose
    title: 行 e-stage-target — 表示先の設定の電文と server の口
    body: |
      在りかの main は 11affd91（計画 surface-plan 第 1.04 版・ノート surface-wave23b 第 0.10 版）。契約の crate の src/stage.rs（新）と src/lib.rs、境界の crate の src/stagecall.rs（新）と src/lib.rs と src/accthb.rs と src/main.rs と src/server/config.rs と src/server/mod.rs と src/server/proc.rs と src/server/routes の stagetarget.rs・stageset.rs・stageall.rs・stageopen.rs（新・1 口 1 file・build.rs が口の列に足す）と src/stage/cli.rs、着地済みの歯 tests/stskill.rs を書き、新しい歯の file tests/dstg.rs を足す。計画 9 節の計画だけの行 i-8（大きさ L・起草で割る）の server と契約の口を割って契約の行にした。面の 2 つの画面は i-8 に残す（見本 mock3 に設定の画面が無く、置き場を持ち主に問うため）。拠りは要件 FR16 と、判断の記録 ADR-15 の決定 (1)(2)(6) と、持ち主の裁定 t3-hub.59.1（表示先の設定を board の設定の画面からも変えられるように・project ごとと一括）と t3-hub.59.7（閉じた窓は開き直さず、開くのは持ち主が tz の口か board の button で）と t3-hub.52.29（project board の口は自分の project だけ）。

      なぜ。行 i-7（ノート surface-wave18d・着地済み）で表示先の設定は tz 自前の追跡されない 1 つの file になり、tz stage target の 4 つの口（show・set --project・set --all・clear --project）が読み書きする。ADR-15 の決定 (2) は、2 つの board の設定の画面もこの口を通り、server は heartbeat の口と同じく tz の口を撃ち、面と server は設定の file を自分で書かないと決めた。今の show の字は人の読む行で、名に空白を含められる（fn shaped は空白を断らない）ので、server が行を割って読むと名が割れる。そこで show に旗 --json を足し、同じ読みを電文の 1 行で書く。窓を開く button は tz stage open を撃つ。

      形 — 契約（contract/stage.rs・新）: pub const PATH（字 /api/stage/target・読みと project board の書き）・ALL_PATH（/api/stage/targets・account board の書き）・OPEN_PATH（/api/stage/open）。列挙 Origin（Default・Override・kebab-case の字 default と override）。pub struct Effective { name, origin: Origin, listed: bool（層 A の名に在るか） }・ProjectTarget { project, effective: Option<Effective> }・Override { project, name }・StageTargets { project（--repo の project の名）, default: Option<String>, overrides: Vec<Override>（設定の表 project の全部・名の順）, projects: Vec<ProjectTarget>（群の宣言の anchor の project と --repo の project・show の行の順）, names: Vec<String>（層 A の名・host の面の [[device]] の順） }。要求は OwnTarget { to: Option<String> }（端末の名か null で上書きを外す）・列挙 Targets { All { to }, Project { project, to: Option<String> } }（kebab-case の外の札）・OpenRequest { project: Option<String> }。要求の 3 つは deny_unknown_fields で、Option の欄は鍵を省けない（serde の deserialize_with = Option::deserialize・空の本文 {} を既定へ戻す頼みに読まない）。

      電文の字（歯 dstg_wire_forms が比べる字）は、下に書く形の鍵と字の値をそれぞれ二重引用符で囲み、空白を置かない JSON の 1 行（null と true と false は囲まない・この節は二重引用符を書けないので囲みを省いて書く）。StageTargets の値（project は proj-a・既定は term-a・上書きは proj-b の term-b だけ・projects は proj-b〔効く値 term-b・出所 override・層 A に無い〕と proj-c〔効く値なし〕・層 A の名は term-a だけ）は {project:proj-a,default:term-a,overrides:[{project:proj-b,name:term-b}],projects:[{project:proj-b,effective:{name:term-b,origin:override,listed:false}},{project:proj-c,effective:null}],names:[term-a]} の字に写り、その字から同じ値に読める。OwnTarget は {to:term-a} を名 term-a、{to:null} を None に読む。Targets の All（to は term-a）は {all:{to:term-a}}、Project（project は proj-b・to は None）は {project:{project:proj-b,to:null}} の字に写る。OpenRequest の project が None の値は {project:null} の字に写る。読まない本文は、OwnTarget の {to:a,project:b} と {} と []、Targets の {all:{to:a,x:1}}（1 は数で囲まない）と {every:{to:a}} と {project:{to:a}} と {project:{project:p}}、OpenRequest の {project:null,to:a} と {}。

      形 — tz の口（stage/cli.rs）: parse_target は値の無い旗 --json を受け（2 度は --json が 2 度ある）、show だけが受ける（ほかは --json は target show だけが受ける）。列挙 Setting に変種 Json（show --json）を足す。pub fn doc(targets, own, projects, names) -> StageTargets は show の行と同じ材料から電文を組み（出所 target::Origin の Project は Override）、fn setting は Show と Json で同じ projects の列を組み、Json なら wire::encode の 1 行を出す。今の show の行の字は変えない。着地済みの歯 stskill は Setting を網羅の match で読むので、Show の腕に Json を足す（1 行）。

      形 — 受付（境界の stagecall.rs・新）: pub struct Caller { tz, scribe2, repo }（server の Shared の欄 stage）。pub const TZ（字 tz）・TARGET_ARGS（stage target）・OPEN_ARGS（stage open）・TARGET_TIMEOUT（20 秒・tz の中の器の検めの 10 秒より長い）・OPEN_TIMEOUT（60 秒・tz stage open の錠の待ち 30 秒と ssh の待ちより長い）・BAD_BODY と NO_PROJECT（accthb の字 bad-body と no-project）・BAD_NAME（bad-name）・TZ_FAILED（tz-failed）・BAD_REPLY（bad-reply）。pub fn named は target::shaped で - で始まらない名（旗に化けない）。pub fn read は show --json を撃ち、標準出力を trim して StageTargets に読めれば 200 とその字、読めなければ 502 bad-reply、撃てなければ 502 tz-failed。pub fn accept_own・accept_all・accept_open の受付の順は、本文の読み（400 bad-body）→ 名の形（400 bad-name）→ project の引き（404 no-project）→ 撃ち（502 tz-failed）→ 200 と tz の標準出力の字（accthb の accept と同じ並び）。accept_own は project を cli::project(--repo) で引き、to が Some なら set --project <own> <名>、None なら clear --project <own>。accept_all は All で set --all <名>、Project は名が --repo の project か群の宣言の anchor の名（accthb::anchor・fn を pub(crate) にする）の時だけ set か clear。accept_open は project が None なら --repo、Some なら anchor の dir を --repo にして stage open を撃つ。撃ちはどれも引数の後に --repo と --scribe2（Config の器の program）を足し、cwd は --repo の dir、子の環境から cli::SEAT_ENV（CLAUDECODE）を除く（proc の新しい pub fn capture_unset・capture はそれを空の列で呼ぶ）。

      なぜ席の印を除くか。起草の時に動いている board の server の process の環境は、席の Bash の道具から起こしたので CLAUDECODE=1 を持っていた（/proc の environ で見た）。tz stage open は席の中の撃ちを断る（行 i-5）ので、印を渡すと持ち主の button の頼みが断られる。窓を開く頼みは持ち主の board の button から来る（ADR-15 の決定 (6)・t3-hub.59.7）。子の環境から印を除くので、席が誤って curl で撃つと「席は窓を起こさない」の決めが破れる。そこで POST の 3 つの口は頭 Origin の無い要求も断る（今の guarded は頭 Origin の無い要求を同じ origin として通す・browser の POST は必ず頭 Origin を付けるので持ち主の button は困らない・席の決め 2026-09-30）。同じ端末の process が頭 Origin を偽る撃ちは故意の撃ちで、断れない（答えと停止の口と同じ限り）。

      形 — 口（routes の 4 file・1 口 1 file）: stagetarget.rs は GET PATH（stagecall::read・200 は JSON）。stageset.rs は POST PATH（guarded_strict → accept_own）、stageall.rs は POST ALL_PATH（guarded_strict → accept_all・群の宣言は account board の読みの state dir、無ければ --repo の project だけ）、stageopen.rs は POST OPEN_PATH（guarded_strict → accept_open）。server/mod.rs の新しい私的な fn guarded_strict は、頭 Origin の無い要求を 403 と字 origin で断り、在れば guarded と同じ（Origin が Host と違えば 403・大きすぎ 413・読めない本文 400）。GET は guarded を通らず今のまま（Origin なしも通す）。POST の本文は字。読むだけの server（--read-only）も受ける（台帳を書く口 ruling・batch・policy・revoke だけが断り、停止の口は受けるのに揃える・席の決め 2026-09-30）。server/mod.rs の module の doc の POST の口の列に 3 つを足す。

      形 — 起動の引数: server/config.rs の Config に pub tz: OsString（既定 stagecall::TZ）。main.rs は引数 --tz <program>（空の値と 2 度は断る）を受け、省けば std::env::current_exe()（server 自身の binary・起草の時の PATH に tz は無く、動いている server は置き場の写しの binary で起きている）にする。

      歯の置き場（tests/dstg.rs）: 偽の tz は受けた argv を 1 行と、環境の CLAUDECODE の値（無ければ字 none）を seat= の 1 行で記録に足し、印の file rc が在れば rc 1、無ければ置いた字を出す。server は同じ process の thread で Server::bind_with（偽の bd と器と git）で立て、窓の口の歯だけは tz の binary を環境 CLAUDECODE=1 と --tz で子 process として立て、標準エラーの最初の行の口の住所に撃つ。host の面は fixture tests/fixtures/stage/terminals.toml に群の宣言（anchor は場の proj-a と proj-b の dir）を足した字。

      今の字（main の字・審査の材料）。境界の server/http.rs の pub struct Request は欄 host と origin（どちらも Option<String>・頭 Host と頭 Origin の値・無ければ None）を持ち、pub fn same_origin は origin が None なら真、在れば scheme と authority が頭 Host と同じ時だけ真を返す。server/mod.rs の私的な fn guarded(req, decode) は、same_origin が偽なら 403 と字 origin、too_large なら 413 と字 too-large、本文が UTF-8 と decode で読めなければ 400 と字 bad-body を返し、読めた値を返す。新しい guarded_strict は、req.origin.is_none() なら 403 と字 origin を返し、そうでなければ guarded をそのまま呼ぶ。口の列は build.rs が src/server/routes の下の file の名（英小文字で始まり、英小文字と数字と下線だけ）から生成し、各 file の const ROUTE の鍵 route::Key（欄 method と、path の Match::Exact か Match::Prefix）を列挙 Route の fn key が返す。Key::matches は method と path の両方が当たる時だけ真。着地済みの歯 hbroute の keys_never_overlap は、どの 2 つの口も fn apart（method が違えば離れている・同じ method なら Exact の字が違うか Prefix に当たらない）を満たすことを見る。stagetarget.rs の鍵 GET の Exact /api/stage/target と stageset.rs の鍵 POST の Exact /api/stage/target は method が違うので離れている（同じ path を GET と POST の 2 つの file で持つ最初の口）。hbroute の key_matches_rule は Key::matches の字を見るだけで、この行は route.rs を書かない。hbroute の mod_rs_keeps_only_events は mod.rs の引用符で囲んだ /api/ の字が /api/surface/events だけであることを見るので、mod.rs は新しい口の path の字を持たない（path は契約の stage の const）。着地済みの歯 hbpost の four_posts_in_route_all は ruling・batch・policy・heartbeat の 4 つの口を名で引いて鍵を比べるだけなので口を足しても変わらず、mod_rs_drops_post_fns は mod.rs に fn post_ruling などの字と HEARTBEAT_PATH の字が無いことを見るので、guarded_strict はそれらの字を持たない。

      試作と噛み（起草 w29a）。main 11affd91 の写しで、書く file を write-set の書く file だけに閉じ（git の差分の file の列と write-set の + と印なしの列が同じことを起草の lint で照らした）、歯 dstg の 9 本と直した stskill と = の歯（hbroute と hbpost を含む）が通り、xtask の check が緑（nextest 1,652 本）。GET と POST が同じ path を持つ口の列で hbroute の keys_never_overlap と key_matches_rule が通った。変異 14 個（子の環境から印を除かない・頭 Origin の無い要求を通す・POST で guarded_strict を通らない・Option の欄の鍵を省ける・名の形を見ない・一括の口で名指す project の範囲を見ない・窓の口で anchor の dir を使わない・show --json を人の読む行にする・読めない答えを 200 にする など）で、それぞれ名指した歯が落ちた。試作の diff は約 71 KB。

      面の画面（i-8 に残す）: 見本 mock3 に表示先の設定の画面は無い。project board の自分の project の block と、account board の一括と project ごとの表の置き場は、持ち主の見せ方の答え（問い t3-hub.59.22）の後に面の行に割る。層 A（PC を足す・消す）は画面から変えず名を並べるだけで、器の書きの口（器の memo s2-07l.727）の着地の後に別の行で足す。

      未確か: 本物の端末で board の button から窓が開くかは、表示先の PC の行と面の行の着地の後にしか確かめられない。GET は要求ごとに子 process 約 3 本（tz と、tz の中の git と器の検め）を撃つので、面は block を開いた時と書きの後だけ読み、ふだんの読み直しの鎖に入れない（起草中の判断の記録 ADR-23 の軽さの向き）。

  - n: 16
    type: prose
    title: 行 i-rules-validate — tz stage の器の検めを rules validate で撃つ
    body: |
      在りかの main は b87f9aa5（計画 surface-plan 第 1.07 版・ノート surface-wave23b 第 0.15 版）。境界の crate の src/stage/cli.rs と着地済みの歯 tests/stcli.rs を書く。計画だけの行を移した行ではなく、席が 2026-09-30 に実測で見つけた誤りの直しで、新しいノートにせずこのノートに足した（条 P-28・規則の行 R-32）。計画だけの行の数は変わらないので規則の行 R-33 は書かない。拠りは要件 FR16。

      なぜ。tz stage の口は host の面（器の state dir の host.toml）を読む前に器の検めを撃ち、rc 0 の後にだけ面を読む（行 i-5 の決め）。今の字はその検めを上の階の命令 validate --state-dir S で撃つ。器 scribe2 0.1.0 に上の階の命令 validate は無く、使い方の 1 行を返して rc 1 になる。このため本物の器では、host の面を読む口の全部（tz stage の命令の撃ち・tz stage open・tz stage target の 4 つの口と show --json・tz stage notify）が、字 器 … の validate --state-dir … が 10 秒の内に rc 0 で返らない で落ち、board の口 GET /api/stage/target（行 e-stage-target・子 process で tz stage target show --json を撃つ）は 502 と字 tz-failed を返す。着地済みの歯の偽の器は argv を見ずに rc 0 を返すか、argv を記すだけで器の形と照らさないので、緑のまま通ってきた。

      器の口の形の出所（器の変更は要らない）。
      - 器の binary の help の字。scribe2 help の命令の一覧は name・--version・doctor・account・rules・fleet・vessel・hook・host-guard・pipe・runner・lens・seat・polarity・contracts で、validate は無い。scribe2 help rules の FORM は usage: rules <validate|get <id>> [--rules PATH] [--state-dir S] で、WHAT は With --state-dir the host manifest is read and checked the same way、FLAGS は --state-dir S  Host state dir; its host.toml is read as well。
      - 器の歯。器の repo の crates/scribe2-boundary/tests/e2e/rules.rs の fn rules_external_form は、binary を rules validate --state-dir <dir> で撃ち（host の面を持つ state dir・host=present の形）、同じ file の host の面の歯は rules の dispatch を validate --state-dir <dir> で撃つ（rules の下の命令）。
      - 実測（2026-09-30・PATH の器 0.1.0 4279e7a7）。scribe2 validate --state-dir S は rc 1 で、標準出力に使い方の 1 行 usage: scribe2 <name|--version|doctor|account|rules|fleet|vessel|hook|host-guard|pipe|runner|lens|seat|polarity|contracts> を出す（標準エラーは空）。scribe2 rules validate --state-dir S は rc 0 と 1 行 rules: ok rows=<数> kinds=<数> accounts=<数> plugins=<数> launch-args=<数> host=present（S に host.toml が無ければ host=absent）。

      今の字（main b87f9aa5）。
      - src/stage/cli.rs の pub const VALIDATE_ARGS は型 [&str; 2] で字 validate と --state-dir の列、doc は 器の検めの引数（この後に state dir）。
      - 私的な fn face_text(repo, scribe2, git) は、git を -C <repo> config --get scribe2.statedir で撃って state dir の字を得て（読めなければ断り）、VALIDATE_ARGS の後に state dir を足した argv で器を proc::capture（待ち TIMEOUT 10 秒）で撃ち、None なら断りの字 器 <program> の validate --state-dir <S> が 10 秒の内に rc 0 で返らない（host の面を読まない）を返し、rc 0 なら terminal::read_face で <repo>/<S> の host.toml を読む。呼ぶのは fn setting（tz stage target）・fn stage（命令の撃ちと open）・fn reach_out（tz stage notify）の 3 つ。module の doc の 7 行目と fn face_text の doc は 器の validate が rc 0 で返った後にだけ と書く。
      - 着地済みの歯が見る字。stcli の fn stcli_shape_and_consts は VALIDATE_ARGS を型 [&str; 2] に受けて字 validate と --state-dir の列と比べる。fn stcli_validate_gate は印の file の在る間 rc 1 を返す偽の器で、断りの 1 行目に字 validate --state-dir と state dir の path と rc 0 を探し、偽の器の argv を validate と --state-dir と state dir の 1 回と比べる。sttgt の fn sttgt_cli_settings は断りの行に字 validate --state-dir と rc 0 を、stnfy の fn stnfy_cli_refusals は字 validate --state-dir を探す（部分の字なので直しの後も通る）。dstg の偽の器は argv を見ずに exit 0 を返す。

      直し（形）。
      - VALIDATE_ARGS を型 [&str; 3] の字 rules と validate と --state-dir の列にし、doc に 器に上の階の validate は無く、host の面の検めは rules validate の旗 --state-dir（器の scribe2 help rules の FORM・行 i-rules-validate） を足す。
      - face_text の断りの字は撃った argv の字を VALIDATE_ARGS を空白で繋いで書く（器 <program> の rules validate --state-dir <S> が 10 秒の内に rc 0 で返らない（host の面を読まない））。module の doc と fn face_text の doc の 器の validate を 器の rules validate --state-dir にする。
      - 撃つ回数と待ちと読む file は変えない。stage/terminal.rs の doc の 面の全体の形は器の validate が持ち は器の検めの一般の言い方なので書かない。

      直す着地済みの歯と足す歯（tests/stcli.rs・接頭辞 stcli_）。
      - stcli_shape_and_consts は型 [&str; 3] と字 rules と validate と --state-dir の列にする。
      - stcli_validate_gate は断りの 1 行目に探す字を rules validate --state-dir にし、偽の器の argv を rules と validate と --state-dir と state dir の 1 回と比べる。
      - 新しい歯 stcli_vessel_real_form は、場の偽の器（fn fake が argv を記す sh の script）の本文を本物の器の形を写した const REAL_VESSEL に替える。節の字の形は、引数が 4 つで最初の 3 つが rules validate --state-dir の時だけ、4 つ目の dir に host.toml が在れば host=present・無ければ host=absent の 1 行 rules: ok rows=82 kinds=80 accounts=7 plugins=1 launch-args=1 host=<字> を標準出力に出して rc 0 で、ほかの argv には標準出力に 1 行 usage: scribe2 <name|--version|doctor|account|rules|fleet|vessel|hook|host-guard|pipe|runner|lens|seat|polarity|contracts> を出して rc 1。歯はまず偽の器を上の階の validate --state-dir S で自ら撃って rc 1 と usage: scribe2 <name| で始まる 1 行の標準出力を見（偽の器が本物の形であることの見張り）、次に本物の tz を stage target show --json と --repo・--scribe2・--git・--config で撃って rc 0 と 1 行を見て電文 StageTargets に読み（project は場の repo の dir の名 repo・層 A の名は fixture の term-a と term-b）、次に tz stage dom --to term-z で host の面を読んだ後の断り（端末 term-z と term-a・term-b を含む行と board の URL の行）を見て、偽の器の argv の記しを 3 回の列（歯の上の階の validate・tz の rules validate の 2 回）と比べ、ssh の記しが空であることを見る。
      - stcli_own_names_clean の歯の数を 20 から 21 にする。名 stcli_vessel_real_form から stcli_ を除いた字は FILTER_WORDS の 126 語（stcli.rs の const・行 i-5 の起草の時の語と relay_）のどれも含まない。この行は FILTER_WORDS を書かない。
      - なぜ偽の器の形を足すか。今の歯の偽の器は argv を見ずに rc 0 を返すので、器に無い命令を撃っても落ちない。本物の器の形（上の階の validate は rc 1）を写した偽の器を 1 つ置けば、同じ誤りが戻ると歯 stcli_vessel_real_form が落ちる。argv を見ない偽の器の歯（sttgt・stnfy・stbp・dstg）は書かない。

      同じ誤りの調べ（この行の範囲を決めた材料）。tsuzuri の src で器の program を子 process で撃つ所を grep し（境界の server の seat・acct・accthb・server の form と ruling・stage の cli）、各 argv（seat tick status --state-dir・doctor --state-dir・doctor --state-dir --repo・fleet usage --show --state-dir・rules get <id>・seat heartbeat <on|off> --state-dir --target・seat deliver --state-dir --target --ruling・validate --state-dir）を器の scribe2 help <命令> の FORM と FLAGS と照らした。器に無いのは validate --state-dir の 1 つだけ。fleet usage の旗 --show は help の字に無いが、器の source の fleet の cli が許しの旗に持ち、実測で rc 0（読むだけの表示）なので tsuzuri の誤りではない。面の account の heartbeat の撃つ字の見せ（撃たない表示の字・state dir を出さない決め）はこの行の範囲の外。

      本物の器での確かめ。試作の binary の tz stage target show --json --repo <tsuzuri の repo> --scribe2 <PATH の器> は rc 0 と 1 行の電文（鍵 project・default・overrides・projects・names）を返した。直しを戻した binary（撃つ argv から rules を除いた変異）は rc 1 と断りの行を返した。窓を開く口 open は撃っていない。

      試作と噛み。main b87f9aa5 の写し（係の branch）で、書いた file は src/stage/cli.rs と tests/stcli.rs の 2 つで write-set の中で閉じる。stcli・sttgt・stnfy の 40 本が通り、xtask の check が緑（nextest 1,670 本）。変異 6 つ（撃つ argv から rules を除く・VALIDATE_ARGS の validate を check にする・断りの字から rules を除く・器の rc を見ない・歯の偽の器に上の階の validate を受けさせる・歯の名に filter の語 tz_ を入れる）で、それぞれ名指した歯（stcli_validate_gate と stcli_vessel_real_form・stcli_shape_and_consts・stcli_validate_gate・stcli_validate_gate・stcli_vessel_real_form・stcli_own_names_clean）が落ちた。

      依存と順。depends は空（行 e-stage-target は main b87f9aa5 に着地済み）。計画 5 節の鎖の boundary/stage/cli.rs は i-11（着地済み）→ e-stage-target（着地済み）→ この行。歯 stcli を置き場だけの = で持つ c-abs-seat（このノートの 3 行目）と c-grace-acct（ノート surface-wave22e）は歯を撃つだけで、stcli.rs を書かないので、この行と順を持たない。同じノートのほかの行と書く file は重ならない。

      範囲の外。board の server の口（行 e-stage-target の stagecall と routes）は tz を撃つだけなので書かない（tz の直しで 502 tz-failed が解ける）。着地済みの設計ノート（surface-wavei・surface-wavei2・surface-wavei4・surface-wave18d・surface-wave21c）の 器の validate の字は着地の時の記録なので書き換えない。器の help に旗 --show の字が無いことは器の側の事柄。

  - n: 17
    type: prose
    title: 行 g-park-view — 区画の席を画面で区画と見せる
    body: |
      在りかの main は 3d57d349（計画 surface-plan 第 1.08 版・ノート surface-wave23b 第 0.16 版）。面の crate の src/project/seat.rs と src/project_dom/seat.rs と src/account/projects.rs と src/account/cards.rs と src/account/home.rs と style.css と vocab.json と、着地済みの歯 tests/seatblock.rs と tests/acctproj.rs と tests/gchip.rs を書き、新しい歯の file tests/pkview.rs を足す。計画 surface-plan の 9 節の計画だけの行 g-park-view を契約の行にしたもので、新しいノートにせずこのノートに足した（条 P-28・規則の行 R-32）。拠りは要件 FR12 と、持ち主の答え t3-hub.53.41（裁定 id = t3-hub.53.41:20260929T2152Z-1・案 A）。

      なぜ。器は 2026-09-29 に Tier9 を区画（park）として宣言した。区画は群と違って今の口座を 1 つに決めず、席ごとに口座を持つ。行 c-park-acct（このノートの 10 行目・着地済み）の後も、面は区画を群として読むので、project board の席の block の群の chip Tier9 の card が 測れていない と 群の枠が無い の字を出し、詳しくの一致の印が登録の口座と区画の行の今の口座 - を比べて ✗ を出し、account board の群の順の見出しの今の口座が測れていないの印になり、見出しの chip に card が無い。持ち主は案 A（区画の chip に替える・点線の chip・短い card・行の小字は 区画 Tier9）を選んだ。

      形（project board）。src/project/seat.rs に pub fn park_of（群の行が Known で欄 park が真か）と pub fn group_head（区画なら語の鍵 park・ほかは group）と pub fn park_card（題は語 区画 と名・種は定数 PARK_KIND の字 今の口座を持たない・値は定数 PARK_VALUE の字 口座は席ごと · 閾値に届いた席だけ器が移す・出所は定数 PARK_SRC の字 host.toml の区画の行・doctor・詳しくは空）と定数 NO_CURRENT（字 ―）を足す。struct Low に欄 park を足し、pub fn low が park_of を置く。struct More の欄 same の型を Reading<Sign> から Option<Reading<Sign>> にし、pub fn more は区画の席で same を None（比べない）、current を Known(―) にし、ほかは今までの値を Some で包む。src/project_dom/seat.rs は、下段の群の見出しを hs(group_head(low.park)) にし、fn group_chip に引数 park を足して chip に class:park=park を置き、指を置いた時の card を区画なら park_card、ほかは今までの group_card にし、詳しくの印を more.same.map(sign_view) にする。帯（fn band）は書かない（行 c-park-acct のまま）。

      形（account board）。src/account/projects.rs に pub fn is_park（名が電文の parks に在るか）と pub fn group_word（区画なら語 区画 と名・群は名・群が無ければ空の字）を足す。struct GroupHead と struct ProjLine に欄 park を足す。pub fn table の並べ group の見出しは、区画なら current を字 ―（NONE_MARK）にし park を真にする。pub fn row は park を置く。mod dom の fn head_view は群の chip に class:park=head.park を置き、区画なら名の前に語 区画 の span（class pk）を置き、fn row_view の群の小字を group_word にする。src/account/cards.rs の pub fn grp_card は名が parks に在れば park_card を返し、pub fn gproj_card は区画の行の席の card を、種を group_word の字（区画 Tier9）、値を 登録 <席の口座> · 今の口座を持たない にして群の今の口座と比べない。src/account/home.rs の pub fn next_all は区画の行の group の字を group_word にする（pub fn nx_row は変えない）。style.css に点線の規則を 2 つ足し、vocab.json の欄 rephrase の鍵 current_account の前に鍵 park（見出しの語 区画・原語 park）を足す。

      節の字（歯 pkview_dom_wiring が比べる字・どれも二重引用符を持たない）。(a) src/project_dom/seat.rs: class:park=park と {hs(group_head(low.park))} と {group_chip(low.group, low.park, group_doc)} と park_card(&key) と {more.same.map(sign_view)}。(b) src/account/projects.rs の字 mod dom より後: class:park=head.park と use:attach_some=card>{pk}<span data-t= と {group_word(row.group.as_deref(), row.park)}。(c) style.css の 2 行:
        .pchip.grp.park { border-style: dashed; border-color: var(--line-2); }
        .pchip.grp.park .pk {
      （(c) の 2 行目は規則の頭までの字で、中身は font-weight: 500; color: var(--ink-2); }。）

      画面の字（歯で測らず、この行の差分で持つ）。project board の区画の席の下段は、見出し 区画 と点線の chip Tier9 で、chip に指を置くと card（区画 Tier9・今の口座を持たない・口座は席ごと · 閾値に届いた席だけ器が移す・host.toml の区画の行・doctor）を出す。詳しくの行は 今の口座 ― で印を出さない。account board の各 project の表の区画の行の小字は 区画 Tier9、並べ 群の順 の見出しは点線の chip 区画 Tier9 と 今の口座 ―（太字の mono）で、chip の card は同じ短い card。HOME の次の一手の行の小字も 区画 Tier9。HOME の群の段は変えない（区画の card は足さない・案 B の外）。見本 mock3 の群の chip の形（pchip grp）は変えず、枠だけ点線（見本の点線の作法 chip.ext と同じ var(--line-2)）にする。群の chip・見出し・card・帯・電文の形は、区画でない群では今の字のまま。

      今の字（着地済みの歯が見る字・書き換える 3 file）。seatblock は fn more の same を Reading で比べる 3 行（Unknown・Known(NG)・Known(OK)）を Some で包む。acctproj は GroupHead を struct の字で組む 2 つに欄 park 偽を足す。gchip の fn gchip_dom_text の字 {group_chip(low.group, group_doc)} を {group_chip(low.group, low.park, group_doc)} にする（ほかの字 account.with_untracked(|a| group_card(a, &key, now)) と data-card=GROUP_CARD と on:mouseenter=over on:mouseleave=out はちょうど 1 度のまま）。置き場だけの = の歯が見る今の字: hcproj は fn head_view の宣言の形と、字 <span class= に続く pchip grp の tag に use:attach_some=card が在ること（chip の tag は 1 つのまま class:park を足す）。gatt は src/account/projects.rs の字 use:attach_some= が 5 つ（区画の chip を別の tag にせず 1 つの tag の class:park で持つので 5 のまま）。frame は画面の code に見出しの語（語 区画 を含む）を二重引用符で囲んだ字が無いことと、class の字の名が stylesheet に在ること（class pk は style.css の規則に在る）。sesplit は src/project/seat.rs の名の列の見張りで、足す名は数えない。pkacface は fn band の区画の字（書かない）。

      決めた幅。区画かの判じは、project board は席の card の群の行の欄 park（中核が器の doctor の群の行の欄 kind=park から置く）、account board は電文の欄 parks だけで、名 Tier9 や今の口座の字 - を見ない。電文の parks が読めない時は空の列なので、区画の行は今の群の字（見出しの今の口座は測れていないの印・card は無い）のまま出る（行 c-park-acct の決め）。区画の card は電文に依らない説明だけの card で、席ごとの口座は行の口座の列で見る。逼迫の行の今の口座の字（区画の席では -）は帯の fn band の字で、この行は書かない。

      歯（tests/pkview.rs・接頭辞 pkview_）。fixture tests/fixtures/surface/seat-card.json と tests/fixtures/account/acct-doc.json（どちらも読むだけ）の群の行と proj-b の群と parks を歯の中で替える。名 Tier9 は器の区画の宣言の字で、口座は fixture の架空の名。filter の語は、起草の時の main 3d57d349 の契約表の verify の最後の字 306 語を、ほかの語を部分の字として含まない 230 語に畳んだ語で、歯の file が const FILTERS に持つ。接頭辞 pkview_ は 306 語のどれも含まず、どれにも含まれない。DOM は wasm の target でしか組めないので、src の字を読む。

      置き場だけの =。触れる fn を面の tests で grep した歯のうち、書かないもの: frame・gatt・hcproj・hasplit・hacols・projmore・hcard・smore・sgrace・sesplit・accthome・hcnx・hnunk・pkacface。

      試作と噛み。main 3d57d349 の写しで pkview の 6 本と直した 3 file と = の歯が通り、xtask の check（面の crate の wasm の clippy と trunk の組み立てを含む）が緑。書く file は write-set の中で閉じる。変異 15 個（下段の見出しの鍵を群のまま・詳しくの印を区画でも比べる・詳しくの今の口座を区画でも群の字・card の種の字・is_park が区画を見ない・見出しの今の口座を区画でも群の字・grp_card が区画の card を返さない・HOME の小字を群のまま・口座の欄の card を区画でも群と比べる・chip の class:park を消す・見出しを group_head に渡さない・行の小字を群のまま・点線を実線に・語の見出しの語を替える・歯の名に filter の語）で、それぞれ名指した歯が落ちた（nextest の rc 100）。src の行数は試作の後で面の project/seat.rs 980・project_dom/seat.rs 405・account/projects.rs 1258・account/cards.rs 333・account/home.rs 1253（src の差分は 5 file で 136 行を足し 27 行を消す・style.css 3 行と vocab.json 6 行を足す・歯は新しい 1 file で 485 行〔うち FILTERS 230 行〕と直した 3 file で 6 行を足し 4 行を消す）。

      依存と順。depends は c-acct-park と c-park-acct（どちらも着地済み・電文の parks と群の行の park を読む）。計画 5 節の鎖の surface/project/seat.rs と surface/project_dom/seat.rs は c-park-acct（着地済み）→ この行。surface/account/projects.rs・cards.rs・home.rs と style.css と vocab.json は着地済みの行の後。同じノートのほかの着地していない行と書く file が重なるかは、置く時に席が器の交差の断りで見る（起草の時に同じノートへ行を足す起草 w31a と w31c の書く file との重なりは notes に書いた）。

      範囲の外。HOME の群の段の区画の card と区画の席ごとの口座の並び（案 B）。逼迫の行の区画の席の口座の字。区画の席の口座の占有（行 c-acct-park のまま数えない）。design-intent の語彙表 vocabulary.yaml への語 区画 の足し（面の語の辞書だけで足りる）。

  - n: 18
    type: prose
    title: 行 i-stage-own — project board の表示先の block と、読み直しの鎖に入れない 1 回の読み
    body: |
      在りかの main は 3d57d349（計画 surface-plan 第 1.08 版・ノート surface-wave23b 第 0.16 版）。面の crate の src/project/stage.rs（新・block の module の file を置くと build.rs が列挙 Module に足す）と src/net.rs と src/pages/home.rs と vocab.json と style.css、着地済みの歯 tests/frame.rs と tests/hsderive.rs と snapshot の tests/snapshots/pages/home.json を書き、新しい歯の file tests/tgown.rs を足す。計画 9 節の計画だけの行 i-8（M・起草で 2 行に割る）の project board の半分で、account board の半分は 19 節の行 i-stage-all。拠りは要件 FR16 と NFR2、判断の記録 ADR-15 の決定 (1)(2)(6)、持ち主の裁定 t3-hub.59.1（表示先を board の設定の画面からも変えられるように）・t3-hub.59.7（閉じた窓は開き直さず、開くのは持ち主が tz の口か board の button で）・t3-hub.52.29（project board の口は自分の project だけ）・t3-hub.59.22（裁定 id = t3-hub.59.22:20260929T2152Z-1・置き場は案 A）。server と契約の口は行 e-stage-target（15 節）と i-rules-validate（16 節）で着地済み。

      なぜ。行 e-stage-target で、表示先の設定の読み（GET /api/stage/target の電文 StageTargets）と書き（POST /api/stage/target・/api/stage/targets）と窓を開く頼み（POST /api/stage/open）の口が着地したが、2 つの board に画面が無く、持ち主は tz の口でしか表示先を変えられず、閉じた窓を開き直す button も無い。置き場は持ち主の答え（案 A）で、今の頁に block を 1 つ足し、home から 1 回で押せる所に置く。

      形 — block（project/stage.rs）。BLOCK は id stage・見出しの鍵 stage_target（vocab.json に語 表示先 と注釈を足す）・class panel fold mvp（account board の移動の block と同じ畳める段・style.css の details.panel.mvp の規則を使う）。PATHS は空（口の path は契約の stage の PATH と OPEN_PATH を pub use で出し、面の code に /api/ の字を書かない）、FOLDS は stage:block の 1 つ。純粋な関数（host でも組む）は、読みの応答から中身を決める pub fn content（Body の Filled か、理由の 1 行の Unmeasured）、pub struct Own と pub fn own（電文の project の行の効く値・全体の既定・層 A の名と、fn overridden・picked・clear_label）、effective_line・names_line・origin_word、要求の本文の own_body（契約の OwnTarget）と open_body（OpenRequest）、送った後の 1 行の pub enum Outcome（Done と Refused・fn line）と pub fn outcome。字の定数（理由・語・button・応答）は module の pub const で、vocab の日本語の語と同じ字を二重引用符で囲んで書かない。DOM（wasm の target だけ）は pub struct Face（読みの応答・選んだ名・送っている間・送った後の 1 行の signal）と、pub fn load（net の get で PATH を 1 回読んで応答を置く）と、pub fn send（POST を 1 回送り、送った後の 1 行を置き、reread なら load）と、view（details の prop:open と on:toggle を畳める段の記録に結び、toggle で開いた時だけ load を撃つ）。account board の block（行 i-stage-all）も Face と load と send と純粋な関数を使う。

      中身の並び: 効く値の字（名 · 出所の語、層 A に無ければ続けて · 層 A に無い、効く値が無ければ 表示先なし（席の目と URL に落ちる））、project の名と層 A の名の select と 置く button（own_body の Some を PATH へ送り、書きの後に 1 回読み直す）、上書きの時だけ 既定に戻す button（own_body の None・字は全体の既定の名を括弧で添える）、窓を開く button（open_body の None を OPEN_PATH へ送り、読み直さない）と注記 閉じた窓を開き直す（席は開き直さない）、層 A の名の行（並べるだけで変えない）、送った後の 1 行（role status・200 は tz の標準出力の字・断りは 口が断った・ と server の語の字と状態の数）。窓を開く button は持ち主が押す口で、席は押さない（server は頭 Origin の無い POST を断る・15 節）。

      形 — 読み（net.rs）。新しい pub async fn get(path) は fetch_with_str で 1 回読み、状態の数と本文の字を返す（届かない・応答が読めなければ None）。READS にも WATCHES にも登録せず、古さ（fn note と change）に置かず、知らせの接続を張らない。だから変化の知らせの合図（fn reload_changed）と reload_all（接続が開いた時と、書きの口へ送った後に block が呼ぶ）で読み直されず、上端の帯の最終の記録と読み込み不良の印にも数えない。view.rs の RELOAD_KINDS に表示先の口を足さない。GET は要求ごとに子 process 約 3 本（tz と、tz の中の git と器の検め）を撃つので、block を開いた時と書きの後だけ読む（判断の記録 ADR-23 の軽さの向き）。初めは畳み、畳んだ block は読まない。頁を替えて block を組み直した時に記録が開いたなら、details の open の付けで toggle が 1 度起き、1 回読む。

      電文と本文の字（歯が比べる字）。節は二重引用符を書けないので、電文と本文の字は鍵と字の値の囲みを省いて書く。戻すには、鍵と字の値をそれぞれ二重引用符で囲み、null と true と false は囲まず、空白を置かない 1 行にする（歯が比べる字）。読みの電文は {project:proj-a,default:term-a,overrides:[{project:proj-b,name:term-b}],projects:[{project:proj-a,effective:{name:term-a,origin:default,listed:true}},{project:proj-b,effective:{name:term-b,origin:override,listed:false}}],names:[term-a]}。書きの本文は {to:term-b} と {to:null}、窓の本文は {project:null} と {project:proj-b}。

      字の見張りの字（歯 tgown_block_placed_and_folded と tgown_reads_off_the_chain・二重引用符を省いた形）。畳める段の記録の呼びは、字 let (open, record) = fold( と、stage:block を二重引用符で囲んだ字と、字 .to_string(), || false); を続けた 1 行。toggle の枝の 3 行は、12 字の空白で字下げした if now { と、16 字の字下げの load(f); と、12 字の字下げの閉じ波括弧。送った後の枝の 3 行は、同じ字下げの if reread { と load(f); と閉じ波括弧。

      今の字（main の字・審査の材料）。pages/home.rs の fn columns は 2 つの Column（どちらも class STACK）で、1 つ目の blocks は notice・next・pipeline・ledger・legend の BLOCK、2 つ目は seat::BLOCK だけ。この行は 2 つ目を seat::BLOCK と stage::BLOCK にする。歯 frame の frame_home_blocks_in_order_and_map_page は home の列ごとの block の id の列を比べるので、右の列の字を orch と stage にする。frame_one_module_per_block は src/project の file と Module の ALL が 1 対 1 で、各 file が自分の block の id の字を持ち、頁の枠の block と module の block が 1 対 1 であることを見る。frame_no_heading_words_in_code は src に vocab の日本語の語を二重引用符で囲んだ字が無いことを見る。frame_classes_are_in_stylesheet は src の class の字が style.css に在ることを見る（新しい class stgrow を足す）。hsderive の hsderive_consts_match_note と hsderive_module_returns_consts は module ごとの PATHS と FOLDS の表を持ち、Module の ALL の全部が表に在ることを見るので、表に stage を足す。hspage_snaps_match_files は頁ごとの page_snapshot と tests/snapshots/pages の file を 1 字も違わず比べるので、home.json の右の列に stage の block の 1 行を足す。steady_details_use_fold_record は src/project の details の tag が prop:open=open と on:toggle=toggle を持ち、記録の呼びの鍵の集合が FOLDS と同じことを見る。parts_paths_distinct_in_block_modules は module の PATHS の字が src に 1 度だけ在ることと、block の外の /api/ の字が知らせの口だけであることを見る。hsblock_names_follow_dir は src/project の file の名と生成した Module の名が同じことを見る。net.rs の今の pub async fn post は本文つきの POST を送るだけで登録しない。pub fn read は READS に登録し、fn connect で知らせの接続を張る。

      試作と噛み（起草 w31c）。main 3d57d349 の写しで、書く file を write-set の書く file だけに閉じ（この行だけを当てた写しの git の差分の file の列が write-set の + と印なしの列と同じ）、歯 tgown の 6 本と直した frame と hsderive と = の歯が通り、この行だけを当てた写しで xtask の check が緑（nextest 1,676 本）。変異 9 個（502 tz-failed の理由を外す・picked の層 A の見分けを外す・None の本文を空の名にする・bad-name の語を外す・右の列の順を入れ替える・窓の button で読み直す・load で net の read も撃つ・get で古さに置く・block を初めから開く）で、それぞれ名指した歯が落ちた。読みの軽さの実測: 試作の server を loopback の別の port で読むだけで起こし（--read-only）、偽の tz（stage target show --json にだけ偽の名の電文を出す）で 2 つの board を開いた。偽の tz の撃ちの記録は、block を開いた 5 回と手で撃った 1 回の 6 行だけで、ほかの口の読みと読み直しで増えなかった。POST の口は試作の server にも撃っていない。

      未確か: 本物の端末で button から窓が開くかは、表示先の PC の行とこの 2 行の着地の後にしか確かめられない。vocab.json は今 1,719 行で、1 file の上限 1,500 行を越えている（前の行のノート surface-wave22b と 22e は growth の欄なしで書いた）。器の事前の点検 cap-headroom が止めるなら、行に growth の欄を足す。

  - n: 19
    type: prose
    title: 行 i-stage-all — account board の HOME の表示先の block
    body: |
      在りかの main は 3d57d349（計画 surface-plan 第 1.08 版・ノート surface-wave23b 第 0.16 版）。面の crate の src/account/stage.rs（新）と src/account/mod.rs と src/account/board.rs と style.css、着地済みの歯 tests/acctframe.rs と snapshot の tests/snapshots/acctframe.json を書き、新しい歯の file tests/tgall.rs を足す。計画 9 節の計画だけの行 i-8 の account board の半分で、depends は 18 節の行 i-stage-own（project の stage の Face と load と send と純粋な関数を使う）。拠りは 18 節と同じで、置き場は持ち主の答え t3-hub.59.22 の案 A（HOME の tab の最後の段に block・tab は 3 つのまま・要件 FR1）。

      形 — block（account/stage.rs）。BLOCK は id stage・見出しの鍵 stage_target・class panel fold mvp。account/mod.rs は pub mod stage を足し、fn page の HOME の最後の段（class STACK・群の枠と口座 × 窓と移動）の blocks の末尾に stage::BLOCK を足す。account/board.rs の fn block_view に腕 id if id == stage::BLOCK.id => stage::view(), を足す。純粋な関数は、表の 1 行 pub struct Line（project・効く名・出所・層 A に在るか・窓を開く要求の project・fn overridden）と、電文の projects の順に Line を組む pub fn lines（電文の project〔server の --repo の project〕の窓の要求は None、ほかは名・server の受付は名を群の宣言の anchor で引き、--repo の project は None で撃つので群の宣言に無くても開ける）と、要求の本文の all_body（契約の Targets の All）と project_body（Targets の Project）。DOM（wasm だけ）は project の stage の Face を作り、details の on:toggle で開いた時だけ load を撃つ（account board の block は畳める段の記録を持たない・移動の block と同じ）。

      中身の並び: 全体の既定の行（名、無ければ 表示先なし（席の目と URL に落ちる））、全部の project を の select（層 A の名）と 一括で置く（上書きを外す） button（all_body を ALL_PATH へ・書きの後に 1 回読み直す）、project ごとの表（見出しは project・効く PC・既定か上書きか・空、行ごとに project の名・層 A の名の select・出所の chip〔層 A に無ければ続けて · 層 A に無い〕・置く button〔project_body の Some〕・上書きの行だけ 既定に戻す button〔project_body の None〕・窓を開く button〔open_body を OPEN_PATH へ・読み直さない〕）、層 A の名の行、送った後の 1 行。表は .stgscroll の中に置き、幅 390 でも頁が横にはみ出さない（chip と button の字を折り返す）。

      電文と本文の字（歯が比べる字）。節は二重引用符を書けないので、電文と本文の字は鍵と字の値の囲みを省いて書く。戻すには、鍵と字の値をそれぞれ二重引用符で囲み、null と true と false は囲まず、空白を置かない 1 行にする（歯が比べる字）。表の電文は {project:proj-a,default:term-a,overrides:[{project:proj-b,name:term-b}],projects:[{project:proj-a,effective:{name:term-a,origin:default,listed:true}},{project:proj-b,effective:{name:term-b,origin:override,listed:false}},{project:proj-c,effective:null}],names:[term-a]}。本文は {all:{to:term-a}} と {project:{project:proj-b,to:term-b}} と {project:{project:proj-b,to:null}}。toggle の枝の 3 行（歯 tgall_reads_off_the_chain・二重引用符を省いた形）は、12 字の空白で字下げした if event_target::<web_sys::Element>(&ev).has_attribute( と、open を二重引用符で囲んだ字と、字 ) { を続けた行と、16 字の字下げの load(f); と、12 字の字下げの閉じ波括弧。

      今の字（main の字・審査の材料）。account/mod.rs の fn page の Tab::Home は 3 つの Row で、1 つ目は STACK の notices::BLOCK、2 つ目は HGRID の home::NXALL と windows::BLOCK、3 つ目は STACK の home::GROUPS と home::ALLOWANCE と home::MOVES。Tab は Home・Session・Projects の 3 つ（要件 FR1）で、この行は変えない。account/board.rs の fn block_view は block の id で home・windows・session・ledger・projects・notices の view を選び、無ければ空。歯 acctframe の acctframe_blocks_per_tab_and_module は HOME の段ごとの block の id の列と、全部の tab の block の表（id・見出しの鍵・class・描く module の file）と、src/account の file の名の列を比べるので、3 つとも stage を足す。acctframe_snapshot_matches_file は枠の値の JSON の字と tests/snapshots/acctframe.json を 1 字も違わず比べるので、HOME の最後の段に stage の block の 1 行を足す。acctframe_keys_in_vocab_and_classes_in_stylesheet は block の見出しの鍵が vocab に在り class が style.css に在ることを見る（鍵 stage_target は行 i-stage-own が足す）。歯 frame の frame_no_heading_words_in_code と frame_classes_are_in_stylesheet は src の全部を見るので、この行の file にも当たる（新しい class stgscroll と stgtbl を style.css に足す）。

      試作と噛み（起草 w31c）。main 3d57d349 の写しに行 i-stage-own を当てた上で、書く file を write-set の書く file だけに閉じ（git の差分の file の列が write-set の + と印なしの列と同じ）、歯 tgall の 4 本と直した acctframe と = の歯が通り、xtask の check が緑（nextest 1,680 本）。変異 6 個（電文の project の窓の要求も名にする・一括の本文を project の本文にする・block を移動の前に置く・既定に戻すを窓の口へ送る・畳む toggle でも読む・層 A の見分けを外す）で、それぞれ名指した歯が落ちた。撮りは起草 w31c の w/ の PNG（幅 390 と 1280・表の中も頁も横にはみ出さない）。

      未確か: account board の server が群の宣言の state dir を持たない時、表は --repo の project だけになる（tz stage target show の行の順・15 節）。本物の端末で button から窓が開くかは 18 節と同じ。

  - n: 20
    type: prose
    title: 行 c-tick-word — 席の健康の語の時刻に依る分かれを tick status から
    body: |
      判断の記録 ADR-23 の決定 (2) の前段。中核の seat の card の欄 tick（管理 tick の健康の語・面の tk-healthy と tk-stale の出所）を、doctor の席の行の語が読める時だけ、tick status の席の行の欄 healthy= と last= で決める（fn tick_word）。healthy=yes なら健全、no で last= が時刻なら古い、no で last=- なら doctor の語が打刻が無い（absent）か読めない（unreadable）の時だけその語で、ほかは Unknown。tick status の行か欄 healthy= が無い時と、doctor の語が 4 つのほか（no-rule など）の時は今のまま doctor の語。

      なぜ。器の doctor の tick= と tick status の healthy= は、器の同じ 1 関数（seat/tick.rs の health_of・経過 ≤ 周期 × 係数）から出る。語は今の時刻に依る（合図の時計が止まると、印の file は動かないまま健全が古いに変わる）。行 e-held-seat は doctor を 30 秒まで持ち回すので、この行が無いと席の健康の語が今より最大 30 秒遅れて変わる（検証 qv2 の must 1）。tick status は 5 秒（HOLD）で撃ち直すので、この行で語の遅れは今と同じ 5 秒の内に保てる。doctor の印に tick-last を戻す形（案 f）は、止まった時計（印が動かない）を拾えず、起草の実測（同じ回に並べた 2 回）で頁 1 枚が 5.0〜6.0 ポイント重かった（数は ADR-23 の問いの bead の notes）。

      直す着地済みの歯。ctick の ctick_card_copies_word_and_ts（doctor の語を替えても、組 run の tick status が healthy=yes なら健全・tick status の行が無ければ doctor の語の写し）と ctick_own_names_clean（歯の数 12 → 13）。契約の電文と面は変えない。


      範囲の外。doctor の語の打刻が無いと読めないの変わり（tick-last の file が出来る・消える）と、tmux・systemd・口座の file・plugin の変化は、doctor の 30 秒の上限まで遅れる（ADR-23 の決定 (2) の開示）。

      今の字（起草の main）。中核の src/seat.rs の pub fn card は、席の card の欄 tick を tick_health（doctor の席の行の欄 tick の字）で組む。tick_health は TickHealth の 4 語（healthy・stale・absent・unreadable）のどれかと同じ字なら Known でその語、ほかと欄が無い時は Unknown を返す。tick status の席の行（seat tick status: target= last=秒か- age= healthy=yesかno heartbeat= heartbeat_by= step= next= reopens= move= grace_left= の欄）は、欄 heartbeat と reopens と move と grace_left の読みに使い、欄 healthy と last は読まない。行 c-park-acct（10 行目・着地済み）は同じ file の fn group に欄 park（doctor の群の行の欄 kind が park）と use crate::account::host::PARK_KIND を足した（この行の字とは重ならない）。着地済みの歯 ctick の ctick_card_copies_word_and_ts は、組 run の fixture の doctor の字 tick=healthy を 4 語のそれぞれに替えた card が、欄 tick だけがその語で残りは fixture の card と同じことを見る（fixture の tick status の席の行は last=1790510390 age=10 healthy=yes）。ctick_own_names_clean は中核と境界と面の 3 つの file の歯の名が ctick_ で始まり filter の語を含まないことと、数が 12 本であることを見る。中核の歯 pkac（行 c-park-acct）の席の材料も tick status の行に healthy=yes と doctor の tick=healthy を持つので、この行の後も欄 tick は健全のまま。

      試作と噛み。起草の main 3d57d349 の写しに c-tick-word → e-held-design → e-held-seat → e-held-acct → e-ledger-lazy → c-acct-parse の順に 1 行ずつ当てた写しの、この行までの写しで、xtask の check（公開の走査・build・nextest の全部・clippy・面の組み立て）が rc 0（nextest 1671 本）。書く file はこの行の write-set の書く file と一致し（前の行の写しとの差分の file 2 個）、差分は 5700 byte（+59 −6 行）。変異 3 つを 1 つずつ当てて名指した歯を撃ち、done の歯は全部どれかの変異で落ちた（T1（doctor の語が在れば tick status を見ない）で ctick_word_follows_tick_status と ctick_card_copies_word_and_ts、T2（healthy=no と時刻の last= でも doctor の語）で ctick_word_follows_tick_status、T3（ctick_ の歯を 1 本足す）で ctick_own_names_clean）。

  - n: 21
    type: prose
    title: 行 e-held-design — 外の読みの持ち回しの表と folio の読み
    body: |
      ADR-23 の決定 (1)(2) の folio の分。境界の server に新しい module held（Held・読みの鍵ごとに撃った時刻と撃つ前に取った印と字を持つ表）を置き、design の Design の text・summary・rulings をこの表に通す。鍵は folio の program と引数の列と cwd、印は Design の marks（設計文書の dir の下の全 file）、上限は 300 秒（pub const DESIGN_HOLD）。裁定の書き出し（check --emit-rulings）は contracts の dir と git も読む（検証 qv2 の should 3・strace）ので、その印は rulings_marks（marks に contracts の dir の下の全 file と .git の HEAD と packed-refs と refs の dir の下の全 file を足す・.git が file なら gitdir と commondir をたどる）。走っている撃ちへの合流（coalesce）は表の内側に残す。

      なぜ。導出グラフの口は今は要求ごとに folio を 3 本撃ち、面は台帳か event log が動くたびにこの口を読み直す。読めなかった読みは 5 秒（pub const FAILED_HOLD）と上限の短い方だけ持つ（持たないと読めない子を要求ごとに撃ち直す）。

      直す着地済みの歯。server_read の server_read_folio_argv_and_cwd（同じ設計文書の 2 回の要求で folio 6 回 → 3 回）。


      範囲の外。導出グラフの組み立て（中核）の持ち回し。folio の印の変化を知らせ（board-changed）に足すこと（今も contracts と git の変化では知らせない）。

      今の字（起草の main）。境界の src/server/design.rs の Design の pub fn text・summary・rulings は、要求ごとに場（Coalesce の share と FOLIO_WAIT）の中で capture（folio の program と引数の列と cwd の repo と FOLIO_TIMEOUT の 5 秒）を撃ち、走っている撃ちへの合流だけをする（持ち回さない）。引数は args が graph --print --dir <repo>/design-intent、summary_args が graph --print --summary --dir <repo>/design-intent、rulings_args が check --emit-rulings --dir <repo>/design-intent。pub fn marks は設計文書の dir の下の全 file を path の順に返す（知らせの板の印に使う・fn walk は symlink の dir をたどらない）。src/server/mod.rs は pub mod の列（coalesce・design・events・files・form・http・ledger ほか）を持ち、行 e-stage-target（13 行目・着地済み）が Shared の欄 stage と fn guarded_strict を足した（この行の字とは重ならない）。口 /api/graph は src/server/board.rs の読みで text と summary と rulings を並べて撃ち、行 c-g3-extern（12 行目・着地済み）が Others の outside を g-3 に渡す（folio の撃ちの数は変えない）。着地済みの歯 server_read の server_read_folio_argv_and_cwd は、偽の folio の撃ちの argv と cwd を見た後、同じ設計文書で口 /api/graph をもう 1 回読むと folio の撃ちが 6 回（3 本 × 2）、その後の板と指標と次の一手の読みでも 6 回のままを見る。歯 gextw（行 c-g3-extern）と g3g7w と nsumw と server_view と rhold と server_coalesce は偽の folio で口を読み、撃ちの数は数えないか、1 回の要求の中の数だけを見る。

      試作と噛み。起草の main 3d57d349 の写しに c-tick-word → e-held-design → e-held-seat → e-held-acct → e-ledger-lazy → c-acct-parse の順に 1 行ずつ当てた写しの、この行までの写しで、xtask の check（公開の走査・build・nextest の全部・clippy・面の組み立て）が rc 0（nextest 1674 本）。書く file はこの行の write-set の書く file と一致し（前の行の写しとの差分の file 5 個）、差分は 17013 byte（+262 −14 行）。変異 5 つを 1 つずつ当てて名指した歯を撃ち、done の歯は全部どれかの変異で落ちた（D1（読めなかった読みを上限まで持つ）で eheld_held_marks_and_ceiling、D2（表が印を比べない）で eheld_held_marks_and_ceiling と eheld_design_reads_follow_marks と eheld_design_rulings_marks、D3（裁定の書き出しの印が設計文書の dir だけ）で eheld_design_rulings_marks、D4（索引の読みを持ち回さない（元の形））で eheld_design_reads_follow_marks と server_read_folio_argv_and_cwd、D5（DESIGN_HOLD を 60 秒）で eheld_design_rulings_marks）。

  - n: 22
    type: prose
    title: 行 e-held-seat — 席の card の器の出力を出力ごとに持ち回す
    body: |
      ADR-23 の決定 (2)(3) の席の card の分。境界の seat に pub const SLOW_HOLD（30 秒）と pub fn input_marks・ceiling・read_held を置き、Seat の gather を読みの関数で組む形に割り（gather は今のまま撃ち、gather_held は表を通す）、Seats の持ち回し（HOLD と席の 4 file の印で 3 本を全部撃ち直す形）を消す。server は 1 つの Held を作って Seats に渡す。

      入力の印は器の CLI の実際の入力（strace・ADR-23 の context）から決めた。群の記録の dir は、器が読む .account と .refused の file だけを印にする（lock と .judged は器が書くが読まない。起草の 3 回目の 1 回目の測りでは lock の動きで全部の dir の doctor を撃ち直し、頁 1 枚が 15.8% だった）。doctor の印に tick-last を入れない（合図の時計が 15 秒ごとに書き替える）。席の健康の語の時刻に依る分かれは行 c-tick-word が tick status（5 秒）から決める。

      直す着地済みの歯（どれも器の撃ちの数を 3 本の全部の単位で数えていた）。server_seat の server_seat_holds_outputs_five_seconds（5 秒の後は tick status だけを撃ち直す・doctor と usage は SLOW_HOLD）・hbmark_card_follows_off_file・hbon_card_reads_tick_word（記録の置きと消しで tick status と doctor の 2 本）。名は替えない。前の行（surface-wave13f など）の「5 秒の後に 3 本を撃ち直す」約束は、doctor と usage の分を 30 秒に替える（ADR-23 の決定 (2) の開示）。

      依存と順。depends は e-held-design（held の module）と c-tick-word（doctor を 30 秒持つ前に、健康の語を tick status から決める）。

      範囲の外。account board の読み（行 e-held-acct）。

      今の字（起草の main）。境界の src/server/seat.rs の Seats は欄 held に Mutex<Option<(Instant, Stamps, SeatTexts)>> を持ち、fn texts は、集めてから HOLD（5 秒）を過ぎたか、Seat の marks（席の dir の state.jsonl・tick-last・heartbeat-off・heartbeat-on）の更新時刻と長さが集める前に取った値と違えば、Seat の gather で 3 本（TICK_ARGS の seat tick status・DOCTOR_ARGS の doctor・USAGE_ARGS の fleet usage --show、どれも末に --state-dir と state dir）を thread::scope で並べて全部撃ち直し、file を読む。Seat の shoot は capture（program と引数と cwd と SCRIBE2_TIMEOUT の 5 秒）。const の STATE_LOG・TICK_LAST・GROUPS_DIR・HOST_TOML が在り、HEARTBEAT_OFF と HEARTBEAT_ON は acct.rs から使う。src/server/mod.rs の Server の組み立ては Seats::new の後に Acct::new に with_own を付ける（行 e-stage-target は同じ fn の Shared の欄 stage を足した）。着地済みの歯 server_seat の server_seat_holds_outputs_five_seconds は、5 秒の後の読みで器の撃ちが 6 本（3 つの頭が 2 回ずつ）になることを見て、hbmark_card_follows_off_file と hbon_card_reads_tick_word は停止の記録と明示の on の記録の置きと消しのたびに 3 本を全部撃ち直す数（6・9・12 本）を見る。歯 server_hb・shb・evkind・hbroute は Seats の口を通るが、撃ちの数は数えない。

      試作と噛み。起草の main 3d57d349 の写しに c-tick-word → e-held-design → e-held-seat → e-held-acct → e-ledger-lazy → c-acct-parse の順に 1 行ずつ当てた写しの、この行までの写しで、xtask の check（公開の走査・build・nextest の全部・clippy・面の組み立て）が rc 0（nextest 1676 本）。書く file はこの行の write-set の書く file と一致し（前の行の写しとの差分の file 4 個）、差分は 17565 byte（+219 −38 行）。変異 5 つを 1 つずつ当てて名指した歯を撃ち、done の歯は全部どれかの変異で落ちた（S1（tick status の上限も SLOW_HOLD）で eheld_vessel_marks_by_head と server_seat_holds_outputs_five_seconds、S2（doctor の印から heartbeat-off を外す）で eheld_vessel_reads_per_state_dir と eheld_vessel_marks_by_head と hbmark_card_follows_off_file、S3（群の記録の .judged も印）で eheld_vessel_marks_by_head、S4（席の card の読みが表を通らない）で server_seat_holds_outputs_five_seconds と hbmark_card_follows_off_file と hbon_card_reads_tick_word、S5（印から heartbeat-on を外す）で eheld_vessel_marks_by_head と hbon_card_reads_tick_word）。

  - n: 23
    type: prose
    title: 行 e-held-acct — account board の器の出力を出力ごとに持ち回す
    body: |
      ADR-23 の決定 (3) の account board の分。境界の acct の Acct は、集めの全部の持ち回し（欄 held の Mutex<Option<(Instant, Stamps, Texts)>> と、HOLD と印の和で全部を撃ち直す fn texts）を消し、器の出力を外の読みの表（Held）で出力ごとに持つ。usage は席の card の読みと同じ read_held で読み、鍵も印も同じなので表の持ち分を分け合う。tick status と doctor は、state dir の seat の dir の下の全部の席の dir ごとの input_marks の和（群の記録の .account と .refused を含む）にその state dir の event log を足した印（fn vessel_marks・path の順・重ねない）と、read_held と同じ鍵の列の末に字 acct（pub const ACCT_KEY）を足した鍵で、ceiling の上限で held.get に渡す。rules get は印の無い鍵で SLOW_HOLD の間持つ。file の読みは要求ごとのまま。marks は最後の集めの印の一覧（欄 last_marks）を返し、一度も集めていない時だけ集める（60 秒ごとの印の取り直しで器を撃たない）。集めの間は欄 gate の錠で次の要求を待たせる（同じ出力を二重に撃たない）。server は Held::new() を 1 度だけ作り、Seats::new の引数と Acct の with_held に同じ表の clone を渡す。Acct の ledger_got は、読めなかった台帳（stale の在る読み）を、印が同じなら FAILED_HOLD の間は撃ち直さない（集めの全部の 5 秒の持ち回しが消えた後に、読めない anchor の bd を要求ごとに撃たないため）。

      なぜ tick status と doctor だけ鍵と印を席の card の読みと分けるか。着地した input_marks は、tick status と doctor の頭で席 1 つ（Seat の target）の dir の file と群の記録だけを印にし、event log を usage の印にだけ持つ。account board の読みは state dir ごとに tick status と doctor を 1 本ずつ撃ち、その出力は state dir の全部の席（orchestrator の席は anchor ごとに違う）の行を持つので、席 1 つの印では、ほかの席の停止の記録や明示の on の記録が動いて account board の変化の印（marks）が知らせを出しても撃ち直さず、知らせの後の読みが古い出力を返す。event log も account board の marks に在り、器の tick status と doctor の入力なので（ADR-23 の決定 (2)）、印に足す。印の違う 2 つの読みが同じ鍵を使うと、互いに相手の置いた印を違うと見て交互に撃ち直すので、鍵を分ける。そのため event log の更新時刻だけの動きで、account board の読みは usage と、その state dir の tick status と doctor の 3 本を撃ち直す（席の card の読みの read_held なら usage の 1 本だけ）。

      直す着地済みの歯。server_acct の server_acct_holds_five_seconds・acchold_card_follows_off_file・acchold_state_log_regathers・alean_git_held・alean_ledger_follows_mark・alean_own_ledger_shared・hbon_acct_reads_tick_word。数え方は、印の動いた出力と上限を過ぎた出力の数にし、読めなかった台帳の bd は FAILED_HOLD の内は撃ち直さず、過ぎれば撃ち直す（alean_ledger_follows_mark の末で見る）。名は替えない。新しい歯は eheld の eheld_acct_wiring_text と eheld_acct_shares_usage と、server_acct の acchold_marks_keep_last_gather。

      依存と順。depends は e-held-seat（read_held と input_marks と ceiling と SLOW_HOLD と、Seats::new が表を引数で受ける形・着地済み）。行 c-grace-acct（ノート surface-wave22e）と c-park-acct（このノートの 10 行目）の字は main に在る。

      範囲の外。台帳の見張りの読み（行 e-ledger-lazy）。この行は src/server/seat.rs を変えない（席の card の読みの印は着地した input_marks のまま。ADR-23 の決定 (2) の印のうち input_marks に無い host.toml と seat の dir と pointer-ladder と move-signal は、account board の読みの印にも足さない）。

      今の字（行 e-held-seat の着地の後の main 48b4bfbf・表と席の読み）。境界の src/server/held.rs の pub struct Held は #[derive(Clone, Default)] で、欄 rows に Arc<Mutex<HashMap<Key, Row>>> を持つ（clone は同じ表を分け合う・Key は Vec<OsString>・Row は撃つ前の時刻と、撃つ前に取った印の path と更新時刻と長さの列と、読めた字の Option<String>）。pub fn get(&self, key: &[OsString], marks: &[PathBuf], ceiling: Duration, read) は、印の file ごとの更新時刻と長さを先に取り、鍵の持ち分が在って、撃ってからの時間が上限（読めなかった持ち分は上限と FAILED_HOLD の短い方）より短く、印の列が持ち分と同じなら read を撃たずに持った字を返し、ほかは read を撃って、撃つ前の時刻と印と一緒に置く（撃つ間は表の錠を持たない）。src/server/seat.rs の pub fn read_held(held: &Held, seat: &Seat, head: &[&str]) は、鍵を Seat の program と argv（head の後に --state-dir と state dir）と cwd の列にし、印を input_marks(seat, head)、上限を ceiling(head) にし、Seat の shoot（capture）を読みの関数にして held.get を呼ぶ。pub fn input_marks は、fleet usage --show の頭で state dir の host.toml と fleet/events.jsonl の 2 つを返し、seat tick status の頭で席の dir（state dir の seat の下の、target の : を _ に替えた名の dir・target が空なら無い）の tick-last と heartbeat-off と heartbeat-on と account に、群の記録の dir（state dir の親の scribe2-host/groups）の直の file のうち名が .account か .refused で終わる file（名の順）を足した列を返し、doctor の頭では tick-last を除いた同じ列を、ほかの頭では空を返す。event log は usage の印にだけ在る。ceiling は tick status で HOLD（5 秒）、doctor と usage で SLOW_HOLD（30 秒）。Seats::new は program と state dir と target と cwd と Held を引数で受け（with_held は無い）、src/server/mod.rs の Server の組み立ては Seats::new の引数に字 Held::new() を渡し、Acct::new に with_own だけを付ける（表は分け合っていない）。

      今の字（同じ main・account board の読み）。境界の src/acct.rs の Acct は欄 held に Mutex<Option<(Instant, Stamps, Texts)>> を持ち、fn texts は、集めてから HOLD（5 秒）を過ぎたか、持った字の印の一覧（Texts の marks・state dir ごとの event log と、anchor ごとの orchestrator の席の state.jsonl と tick-last と heartbeat-off と heartbeat-on と、群の今の記録）の更新時刻と長さが集める前と違えば、fn gather で集めの全部（引数の state dir の usage と doctor・rules get の 3 本・anchor ごとの git・state dir ごとの tick status と doctor〔引数の state dir の doctor は 1 本〕・anchor ごとの台帳）を撃ち直す。gather は state dir ごとの席の dir を、Seat（program は器・state dir・target は doctor の席の行の名・cwd）の seat_dir で引く。pub fn marks は texts を通るので、呼ぶたびに HOLD を過ぎていれば集め直す（routes/account.rs の watch_acct_marks が 60 秒ごとに呼ぶ）。fn shoot_in は head と --state-dir と dir を shoot（capture）に渡す。fn ledger_got は、台帳の印（Source::mark）が前の読みの前の印と同じで前の読みが読めていれば bd を撃たない（行 a-lean）が、読めなかった読み（欄 stale が在る）は要求ごとに撃ち直す。着地済みの歯 server_acct の 7 本は器の撃ちの数を集めの全部の単位で数える（例 5 秒の後の読みで集めの全部を撃ち直す・停止の記録の置きと消しで全部を撃ち直す）。歯 athr と server_acctwire と bport と rhold は Acct の電文と口の字を見て、撃ちの数は数えない。

      歯の作業場（tests/server_acct.rs の Place・Place::new の 2 つめの引数が false の形）。根は CARGO_TARGET_TMPDIR/server_acct/<作業場の名> で、state dir は states/state-a（引数の state dir で、proj-a と proj-e の state dir）と states/state-b（proj-b の state dir）、群の記録の dir は states/scribe2-host/groups、event log は states/state-a/fleet/events.jsonl と states/state-b/fleet/events.jsonl。席の dir は states/state-a/seat の下の proj-a_0.1 と proj-e_0.1 と proj-a_1.1 と、states/state-b/seat の下の proj-b_0.1 と proj-z_0.1。偽の器は受けた argv を log に 1 行足して決めた字を返し、偽の bd は proj-a と proj-e の字を返し、proj-b の字は無い（rc 1 で読めない）。最初の doc の器の撃ちは 8 本（state-a の usage と doctor・rules get の 3 本・state-a と state-b の tick status・state-b の doctor）。関数 alean_bump は event log の字と長さを替えず更新時刻だけを 1 秒進め、acchold_switch は states/state-a/seat/proj-a_0.1/heartbeat-off を置くか消す。歯 eheld_acct_shares_usage は tests/eheld.rs の作業場（CARGO_TARGET_TMPDIR/eheld/acct-shares）で、偽の器は受けた argv を log に 1 行足して字 ok を返し、state dir s/state に host.toml は無い（anchor が無いので tick status と git と bd は撃たない）。

      試作と噛み。main 48b4bfbf（ノート v0.21）の写しに e-held-acct → e-ledger-lazy → c-acct-parse の順に 1 行ずつ当てた写しの、この行までの写しで、xtask の check（公開の走査・build・nextest の全部・clippy・面の組み立て）が rc 0（nextest 1700 本）。書く file はこの行の write-set の書く file と一致し（main との差分の file 4 個）、差分は 29924 byte（+242 −78 行）。tests/server_acct.rs は 1290 行から 1325 行（growth 40 の内）。変異 11 を 1 つずつ当てて名指した歯を撃ち、done の歯は全部どれかの変異で落ちた（A1（marks を呼ぶたびに集め直す）で acchold_marks_keep_last_gather、A2（読めなかった台帳を印が同じならずっと持つ）で alean_ledger_follows_mark と server_acct_holds_five_seconds、A3（読めなかった台帳を持たない・元の形）で acchold_card_follows_off_file と alean_ledger_follows_mark と alean_own_ledger_shared、A4（Seats::new に別の表を渡す）と A5（with_held を外して注の行に字を写す）で eheld_acct_wiring_text、A6（usage を read_held で読まない）と A7（tick status と doctor の鍵に字 acct を足さない）で eheld_acct_shares_usage、A8（tick status と doctor を表で持たない）で server_acct_holds_five_seconds と acchold_card_follows_off_file と acchold_state_log_regathers と alean_git_held と hbon_acct_reads_tick_word、A9（rules get を持たない）で server_acct_holds_five_seconds ほか、A10（印に event log を足さない）で alean_git_held と alean_ledger_follows_mark、A11（印に席の dir を入れない）で acchold_card_follows_off_file と hbon_acct_reads_tick_word）。

  - n: 24
    type: prose
    title: 行 e-ledger-lazy — 受け手が居ない時は台帳を読まない
    body: |
      ADR-23 の決定 (3) の後半と (4)。境界の server の events の見張りの周（watch）は、受け手が 0 人の周では印が動いても読まず、見た印も置かない（受け手が付いた周に 1 回読む決まりと、受け手が居る間の読み直しは今のまま）。ledger の Source は、最後に始めた合流の読みの前に取った印を持ち、watched の Source の got は、印がその印と違えば見張りを待たず自分で読み、台帳の形の行の撃ち（form の kick）へ渡す。others の Others は見張りの Source の列を返し、server は Acct の with_watched に渡す。events の STORE_REREAD は 60 秒から 600 秒にする（持ち主の裁定 t3-hub.52.133・起草の実測は ADR-23 の問いの bead の notes）。

      頁を開いた時の変わり（検証 qv2 の should 14）。閉じている間に台帳が動いていれば、頁の最初の口の読みは bd の読みを待つ（壁で約 0.6 秒）。その読みが落ちた時は、閉じる前の最後の読みから古さを数える（規則の行 R-21 の字どおり）。知らせの受け手が閉じた後も、server が接続の切れを知るまで（keepalive の 15 秒の後の書きの落ち）は受け手を 1 人と数える。

      直す着地済みの歯。lidle の lidle_watch_idle_then_attach と lidle_live_reads_on_attach（受け手 0 人の時の決まりを逆にする：印が動いても読まず、口の読みが自分で読む）・lsnap の lsnap_routes_wait_for_read（知らせの受け手を付けてから印を動かす）・server_coalesce の server_coalesce_ruling_reads_alone（見張りの読みでなく口の読みが走っている間に裁定を受ける）・pmisroute の置き場の関数 move_mark（印を動かした後に口 /api/ledger を読む・pmisfit_route_reads_kept_form と pmisfit_route_without_seat_or_line がこれで通る）・lstore の lstore_values_and_dirs（600 秒）・server_acct の alean_own_ledger_shared（印の動いた proj-a を口の読みで読み直す）。頁を開いている時の本番の道（受け手が居る間の見張りの読みで台帳の形の行を撃ち、落ちた周は Unknown・置き直した周は戻る）は、新しい歯 pmisfit_watch_kicks_form_while_listening が server を通して見る。

      依存と順。depends は e-held-acct（acct.rs と server_acct.rs の同じ字と、alean_own_ledger_shared の数え方）。

      範囲の外。受け手が付いた周の読みを、印が動いていないか網の内なら撃たない形（頁を開いた最初の 60 秒の bd が減るが、台帳の形の行の撃ちの始まりを別に要る）。

      今の字（行 e-held-acct の着地の後の main）。境界の src/server/events.rs の fn watch（台帳の見張りの周）は、印を読みの前に取り、受け手が 0 人から 1 人以上になった周（attached）と、受け手が居る間の読み直しの間隔（due・store の印で前の読みが読めていれば STORE_REREAD の 60 秒・ほかは REREAD の 5 秒）と、印が見た印と違う周に読む（受け手 0 人の間も印が動けば読む・行 e-idle の字）。src/server/ledger.rs の Source の pub fn got は、watched なら走っている合流の読みを BD_WAIT まで待ち（shared の join）、無ければ最後に終えた読みの字（latest）を返し、一度も終えていなければ自分で読む（fresh）。見張りの読みの後に Form の kick で台帳の形の行（doctor --repo .）を撃つ（行 c-pipe-misfit）。src/server/others.rs の Others は --project の置き場ごとの watched の Source を持ち、行 c-g3-extern（12 行目・着地済み）が pub(super) fn outside（見張りの最後の読みの字を build::outside で読む・bd を撃たない）を足した。src/server/mod.rs は Others::new を Acct の組み立ての後に置く。src/acct.rs の fn ledger は with_own の Source だけを anchor の dir で探す。行 e-held-acct の後の fn ledger_got は、見張りの Source（is_watched）なら got をそのまま返し、ほかは台帳の印と読みと読む前の時刻を欄 seen に置き、印が同じなら読めた読みを持ち、読めなかった読みを FAILED_HOLD の間持つ。行 e-held-acct の後の歯 alean_own_ledger_shared は、with_own の Source の proj-a の台帳の印と event log を動かしても bd を撃ち直さない（見張りの最後の読みの字・bd は proj-a と proj-b と proj-e の 1 回ずつ）ことを見る。src/server/form.rs の FORM_TIMEOUT の doc は STORE_REREAD（60 秒）の半分と書く。着地済みの歯 lidle_watch_idle_then_attach は受け手 0 人の間に印が動けば見張りが読むことを、lidle_live_reads_on_attach は受け手 0 人の間の issues.jsonl の 1 行で偽の bd が撃たれることを、lstore_values_and_dirs は STORE_REREAD が 60 秒であることを、lsnap_routes_wait_for_read と server_coalesce_ruling_reads_alone と pmisfit_route_reads_kept_form と pmisfit_route_without_seat_or_line は受け手の無いまま印を動かして見張りの読みを待つ道を見る。この行の後は、口 /api/graph の outside も watched の Source の got を通るので、受け手 0 人の間に印が動いた後の最初の要求は bd を 1 回撃つ（見張りの読みを待つ前の字でなく口の読みの字で g-3 を数える・歯 gextw はこの道で通る）。

      試作と噛み。main 48b4bfbf（ノート v0.21）の写しに e-held-acct → e-ledger-lazy → c-acct-parse の順に 1 行ずつ当てた写しの、この行までの写しで、xtask の check（公開の走査・build・nextest の全部・clippy・面の組み立て）が rc 0（nextest 1703 本）。書く file はこの行の write-set の書く file と一致し（前の行の写しとの差分の file 13 個）、差分は 28825 byte（+226 −46 行）。tests/server_acct.rs は 1325 行から 1358 行（growth 40 の内）。変異 7 つを 1 つずつ当てて名指した歯を撃ち、done の歯は全部どれかの変異で落ちた（L1（受け手 0 人でも印が動けば読む（元の形））で lidle_watch_idle_then_attach と lidle_live_reads_on_attach と pmisfit_route_reads_kept_form、L2（見張りが受け手の居る間も読まない）で pmisfit_watch_kicks_form_while_listening と lsnap_routes_wait_for_read ほか、L3（口の読みが印の遅れを見ない）で elazy_watched_reads_when_behind と lidle_live_reads_on_attach と alean_own_ledger_shared と server_coalesce_ruling_reads_alone と pmisfit_route_ の 2 本ほか、L4（網を 60 秒）で lstore_values_and_dirs、L5（account board が見張りの Source を探さない）で alean_watched_ledger_shared、L6（口の読みが形の行を撃たない）で pmisfit_route_reads_kept_form と pmisfit_route_without_seat_or_line、L7（server が見張りの Source を渡さず、注の行に字を写す）で alean_watched_ledger_shared）。

  - n: 25
    type: prose
    title: 行 c-acct-parse — 読み解きは字が変わった時だけ
    body: |
      ADR-23 の決定 (5)。中核の account の project に pub struct Parsed（台帳の bead の列・event log の値の列・open の問いの読み）と pub fn Parsed::of と pub fn doc_with を足し、pub fn doc は doc_with に今の字を読み解いた値を渡す形にする。next_step に judge_with、pipeline に of_parsed、ledger の stats に stats_of を足し、今の関数（judge・of_inputs・stats）はそれを呼ぶ。account の host の notices は、逼迫と断りの event の名を含まない行を JSON として読まない。境界の acct の Acct は、anchor ごとに読み解いた時の台帳と event log の字と Arc の値を持ち（pub fn parsed）、字が同じ anchor は前の値を使う。

      なぜ。口 /api/account の 1 回の server 自身の計算の時間は、器の出力を表で持った後も 353 ミリ秒（10 回の平均・起草の記録）で、中核で同じ字を何度も読み解いていた。要求をまたいで持つと 10 回の平均で 90 ミリ秒（最初の 1 回と器の撃ち 8 本を含む・起草の記録）。

      依存と順。depends は e-ledger-lazy（acct.rs と server_acct.rs の同じ字）。

      範囲の外と費用。読み解いた値と字の写しを持つので、server の使う記憶の量（RSS）は増えうる（起草の測りの終わりの 1 度の値で元より −3.1〜+35.6%・数は ADR-23 の問いの bead の notes）。持つ量は台帳と event log の大きさに比例し、event log は追記だけなので日を追って増える。字の写しの代わりに長さと hash を持つ形と、event log を要る欄だけの型で読む形は後の行の候補（計画だけの行にしない）。

      今の字（行 e-ledger-lazy の着地の後の main）。中核の src/account/project.rs の pub fn doc は、要求ごとに project_rows（anchor ごとに stats と next_step_seat と run_counts_of が台帳と event log の字を読み解く）と session_lines（read_events）と dormant を組み、行 c-park-acct（10 行目・着地済み）が足した doc.parks = host::parks を置く。src/account/host.rs の pub fn notices は、state dir ごとの event log の全部の行を JSON として読み、逼迫と断りの event を群の知らせにする。src/next_step.rs の next_step_seat は judge に台帳と event log の字を渡し、src/pipeline.rs の of_inputs と src/ledger/stats.rs の stats も字を受けて中で読む。境界の src/acct.rs の Acct の doc_read は、要求ごとの集め（fn texts・器の出力は行 e-held-acct の表を通し、file と台帳の字は要求ごとに読む）の字を project::doc に渡し、読み解いた値は持ち回さない。着地済みの歯 acctpcore・acctcore・athr・cdorm・cspk・nstall・nbatch・stats・pqueue・runsdoc・pkac は、これらの関数の今の引数の形で電文と値を比べ、境界の server_acctwire は口の電文を比べる。この行は今の関数の引数の形を変えず、読み解いた値を受ける関数（doc_with・judge_with・of_parsed・stats_of）を足して今の関数から呼ぶ。

      試作と噛み。main 48b4bfbf（ノート v0.21）の写しに e-held-acct → e-ledger-lazy → c-acct-parse の順に 1 行ずつ当てた写しの、この行までの写しで、xtask の check（公開の走査・build・nextest の全部・clippy・面の組み立て）が rc 0（nextest 1705 本）。書く file はこの行の write-set の書く file と一致し（前の行の写しとの差分の file 8 個）、差分は 24137 byte（+254 −44 行）。tests/server_acct.rs は 1358 行から 1387 行（growth 40 の内）。変異 3 つを 1 つずつ当てて名指した歯を撃ち、done の歯は全部どれかの変異で落ちた（P1（読み解きの持ち回しが台帳の字を比べない）で alean_parsed_follows_texts、P2（doc_with が受けた値を使わず字を読み直す）で acctpcore_doc_with_parsed_equals_doc、P3（読み解きの持ち回しが event log の字を比べない）で alean_parsed_follows_texts）。

  - n: 26
    type: prose
    title: 行 f-deliver-tool — 考え中の席に tool の呼びの後で裁定の逐語を足す
    body: |
      在りかの main は 666ccd51（計画 surface-plan 第 1.11 版・ノート surface-wave23b 第 0.22 版）。中核の crate の src/delivery.rs、境界の crate の src/hook/mod.rs と src/main.rs、repo の根の plugin/hooks/hooks.json と、着地済みの歯 中核の tests/gins.rs（鍵の列の 1 行）を書き、新しい file 境界の src/hook/deliver_tool.rs と、新しい歯の file 中核の tests/fdlt.rs と境界の tests/fdlt.rs を足す。計画 surface-plan の 9 節の計画だけの行 f-deliver-tool（依存 f-deliver・着地済み）を契約の行にしたもので、新しいノートにせずこのノートに足した（条 P-28・規則の行 R-32）。

      なぜ。要件 FR9 は、席が考え中なら停止の hook が未読を見つけて続けさせるとし、裁定から 2 分で席の受けが無ければ面は 席に届いていない と出す。考え中の席へは、器の配達の口が busy で断り（server は 15 秒ごとに 30 分まで撃ち直す・行 f-mark-serve）、席が止まる時に停止の hook（行 f-stop）が指し示しだけを返して印を置く。起草の時の台帳の写し（問いの notes の配達済みの印 77 行）では、停止の hook が置いた経路 停止 の印 32 行（ほかの 7 行は席が手で置いた）の、裁定の分から印の分までが中央 6 分・最大 32 分で、32 行のうち 31 行が 2 分以上だった（経路 配達の口 の 38 行は中央 0 分で、2 分以上は 1 行）。席が長く考え続ける間、裁定は席の文脈に入らず、面は受けていない席を 席に届いていない と出し続ける。着地した行 f-deliver は、待ちの席が器の指し示しを受けた時に逐語を足すだけで、考え中の席は拾わない（13 節の決めた幅 (5)）。この行は、計画の行 f-deliver の字の後半（次の tool の呼びでも拾う）を満たす。

      調べ（Claude Code の hook の doc・起草の時の hooks の頁と agent teams の頁）。(a) PostToolBatch は、並べた tool の呼びの組が全部終わった後、次の model の呼びの前に 1 度だけ撃たれ、matcher を持たない。PostToolUse は tool ごとに撃たれ、並べた呼びでは同時に撃たれる。PostToolBatch の答えの hookSpecificOutput の additionalContext は次の model の呼びの前に 1 度だけ足される。hook の文脈の字は 10000 字を越えると file に落ちる（行 f-deliver の CONTEXT_CAP 8000 をそのまま使う）。rc 0 の hook の標準エラーは debug の log にだけ行き、席は見ない。PostToolBatch の rc 2 は次の model の呼びの前に止める。command の hook の既定の timeout は 600 秒。(b) hook の入力の共通の鍵 agent_id は下請けの agent の中の呼びの時だけ在り、本体の呼びと分けるのに使えるとする。agent_type は下請けの agent の中と --agent で起こした session の本体に在る。settings と plugin の hook は下請けの agent の中でも撃たれ、tool の event の入力に agent_id と agent_type が載る。(c) teammate の tool の呼びで plugin の hook が撃たれるか、その入力に agent_id が載るかは doc に書かれていない。doc は、in-process の teammate が新しい便りを扱うたびに SubagentStart（入力に agent_id が在る）が撃たれるとする。

      調べ（実物）。席の team の設定の file では、teammate の全部が in-process（backendType in-process）。席の in-process の teammate の transcript には、器の plugin の PreToolUse の hook の断りの tool の結果が 81 件在り、plugin の tool の event の hook は in-process の teammate の tool の呼びでも撃たれる（確かめた）。その入力に agent_id が載るかは doc に無く未確か。起草の時の Claude Code 2.1.284 の code を読むと、hook の入力の agent_id は tool の呼びの agent の文脈の id から入り、in-process の teammate の transcript の行は agentId と isSidechain 真を持つので、載る見込み（推し）。split pane の teammate は別の process で起こされ（隠れた旗 --agent-id と --agent-name と --team-name と --parent-session-id）、その本体の呼びの入力に agent_id が載るかは未確か（型を名指して起こすと --agent-type も渡る）。

      判じの実測（起草の時・この host・試作の debug の binary）。今の main の hook の既定の判じの材料の重さは、bd の全部の読み（bd --readonly list --all --limit 0 --json）が 720〜835 ms（3 回・読みが込む時に 1 回 8848 ms）。自分の board の口 GET /api/unreceived は 90 秒の間の 356 回で中央 1.3 ms・99% 4.6 ms・最大 607 ms（board が台帳を読み直している間は、読みの終わりを待つ・200 ms を越えたのは 1 回）。試作の tz hook deliver-tool を本物の repo と動いている board に撃つ空の判じ（git の config と tailnet の道具の status と GET）は 30 回の中央 8.6 ms・最大 515 ms（REACH の 0.5 秒の読みの待ちで止めた 1 回）。1 MB の tool_calls を持つ入力は、agent_id の在る入力で中央 7.2 ms（子 process を撃たない）、本体の入力で中央 14.5 ms。印の無い裁定の在る形は、偽の bd（台帳の写し 852231 byte）と何もしない偽の bdw で中央 27.4 ms、これに本物の bd の読み 1 回と、名指した裁定ごとの bdw の書き 1 回が足される（bdw の書きの時間は台帳に書かないので測っていない）。起草の最初の撃ちでは board が台帳を読めず Unknown を返し、hook は判じずに黙った。

      今の字（行 e-ledger-lazy の着地 45687a0d の後の main）。境界の src/hook/question_signal.rs の pub const WAIT は 2 秒（git と tailnet の道具の待ちの上限）、pub const REACH は 500 ミリ秒（1 つの住所への接続と読み書きの待ちの上限）で、pub fn places(status, port) は、tailnet の道具の status の Self の住所として読める字の順に住所を並べ、最後に 127.0.0.1 を 1 度足す（status が読めなければ 127.0.0.1 だけ・同じ住所は 1 度）。この行の fetch は住所ごとに REACH で繋ぎ、REACH で読む。境界の src/server/ledger.rs の pub const BD_TIMEOUT は 5 秒、BD_ARGS は --readonly と list と --all と --limit と 0 と --json の 6 つで、この行の MARK_BUDGET は 15 秒なので、WAIT の 2 倍と REACH の 3 倍と BD_TIMEOUT と MARK_BUDGET の和は 25.5 秒（hooks.json の timeout の 30 秒より短い）。口 GET /api/unreceived（src/server/routes/unreceived.rs）は shared.sources.ledger.got() を読む。着地した e-ledger-lazy の後の watched の Source の got は、台帳の印が最後に始めた合流の読みの前に取った印（read_mark）と違えば見張りを待たず自分で bd を読み（fn behind と fresh・約 0.7 秒）、同じなら最後に終えた見張りの読みの字を返す。そこで頁を閉じている間に台帳が動いた後の最初の判じは、読みの待ちが REACH を越えて読めない判じになり、hook は標準エラーに 1 行を書いて黙る（rc 0）。server はその読みを終えて最後の読みの字と印を置くので、次の tool の呼びの組の判じは待たずに新しい裁定を返し、hook はそこで届ける（届くのは組 1 つ遅れる・停止の hook は今のまま拾う）。頁を開いている間は、見張りが印の動きを 5 秒の内に読む。上の判じの実測の数は、この着地の前の main 666ccd51 の数である。この行は server を書かない。

      今の字（行 f-deliver の着地の後の main の中核の src/delivery.rs）。pub const CONTEXT_CAP は 8000（Claude Code は hook の文脈が 10000 字を越えると file に落とす）。pub struct Said は欄 question（問いの id）と ruling（裁定の id）と verbatim（戻した逐語）を持つ。pub fn context は、空の slice に None を返し、ほかは見出しの行「席に届いた持ち主の裁定の逐語（<数> 件・台帳の問いの notes の裁定の行の写し）:」の後に、前から裁定ごとに逐語の字数（chars の数）を合計に足し、合計が CONTEXT_CAP を越えた所で止め、越えない間は行「裁定 <id>（問い <問いの id>）の逐語:」と逐語を足す（足した数を copied と呼ぶ）。写さない裁定が残れば、最初に写さない裁定を名指す行「裁定 <id>（問い <問いの id>）を含む <残りの数> 件の逐語は上限 8000 字を越えるので写さない（在りかは台帳の問いの notes の裁定の行）」を足し、行を改行でつないで、鍵 hookSpecificOutput の下の hookEventName（字 UserPromptSubmit）と additionalContext の JSON の字にする。この行は context の本体を context_for（hookEventName を引数の event の字にする）へ移し、context は context_for に字 UserPromptSubmit を渡す形にする。この行の fn copied は同じ数え（前から合計が CONTEXT_CAP 以下の間の数）で、pub fn named は copied に 1 を足して slice の長さで抑えた数（写す裁定と、上限で写さない最初の裁定を名指す数）。done (3) の 3 つの形の数はこれで決まる（小さい Said の逐語は 1 字）: 逐語が CONTEXT_CAP 字ちょうどの Said・小さい Said・小さい Said の順は copied 1 で named 2、CONTEXT_CAP より 1 字多い Said・小さい Said の順は copied 0 で named 1、小さい Said・CONTEXT_CAP 字ちょうどの Said・小さい Said の順は copied 1 で named 2。done (10) の逐語が CONTEXT_CAP 字ちょうどの fx-t.1 と小さい fx-t.2 と fx-t.3 の台帳は、印の無い裁定が fx-t.1・fx-t.2・fx-t.3 の順で copied 1・named 2 なので、印は fx-t.1 と fx-t.2 の 2 つにだけ置く。

      形（中核）。delivery.rs の Route に Tool（語は字「tool の呼び」）を足し、pub const TOOL_EVENT（字 PostToolBatch）と AGENT_KEYS（字 agent_id と agent_type）と、pub fn main_thread・unmarked・named・context_for を足す（どれも file も子 process も時計も触らない）。main_thread は hook の入力が JSON の object で最上位に AGENT_KEYS のどの鍵も無い時だけ真（object でない字は偽・入れ子の鍵は見ない）。unmarked は undelivered の印の無い裁定（問いと裁定の id の組）の逐語を said で拾い、組の在るものだけを 1 度ずつ undelivered の順に返す（逐語の欄の無い行は出さない）。context_for は行 f-deliver の context の形の hookEventName を引数の event にしたもので、context は context_for に字 UserPromptSubmit を渡す形に替える（答えの字は今のまま）。named は答えが名指す裁定の数（逐語を写す裁定と、上限で写さない最初の裁定）で、context_for と同じ数えの fn copied を使う。

      形（境界）。新しい module hook の deliver_tool（pub const USAGE・UNRECEIVED_PATH・MARK_BUDGET 15 秒・pub struct Args〔欄 repo と bd と bdw〕・pub fn parse・fetch・unreceived・mark・run）。run は、使い方の誤りか repo が dir でなければ rc 1、repo の下の .git が file（git の worktree）なら何もせずに 0（行 f-stop と同じ守り）、標準入力が main_thread でなければ子 process を撃たずに 0。次に安い判じとして unreceived（repo の git の config の tsuzuri.boardport と tailnet の道具の status から、問いの合図の送り手の places と同じ住所の列を組み、GET UNRECEIVED_PATH を撃ち、最初に応答を読めた住所の答えを電文 Reading の Vec の RulingId に読む・待ちは question_signal の WAIT と REACH）を撃ち、Known の空の列なら 0、読めない・Unknown なら標準エラーに 1 行を書いて 0。空でなければ台帳を bd で 1 回読み、unmarked が空なら 0（board の持ち回しの字が印の書きより古い）、読めなければ標準エラーに 1 行を書いて 0。答えを標準出力に書いて flush し、その後に答えが名指した裁定（named の数）にだけ、経路が tool の呼びの印を bdw で置く（行 f-stop の mark と同じ形・上限 MARK_BUDGET）。どの形でも 2 を返さない。hook は file を書かない。main.rs に腕 hook deliver-tool と doc の 1 行、hook/mod.rs に pub mod deliver_tool と doc の 1 行を足す。lib.rs は書かない。

      形（plugin）。hooks.json に鍵 PostToolBatch を足す（matcher を持たない・timeout 30 秒〔git と tailnet の道具の待ち 2 秒ずつと住所 3 つの REACH と bd の読みの上限 5 秒と MARK_BUDGET の和 25.5 秒より長い〕）。command の字は、二重引用符を省いた形で [ -e $CLAUDE_PLUGIN_ROOT/scribe2-runner ] || $CLAUDE_PROJECT_DIR/target/debug/tz hook deliver-tool --repo $CLAUDE_PROJECT_DIR（戻し方は、$CLAUDE_PLUGIN_ROOT/scribe2-runner の全体と、1 つ目の $CLAUDE_PROJECT_DIR と、末尾の $CLAUDE_PROJECT_DIR の 3 か所をそれぞれ二重引用符で囲む・hooks.json の JSON の字ではその二重引用符を逆斜線で escape する）。器の runner の印 scribe2-runner が在れば撃たない門と合図と配達の hook と同じ形。

      歯の本文の字。done (8) の口の本文は、二重引用符を省いた形で {known:[]}・{known:[fx-t.1:20260930T0101Z-1]}・unknown と書いた（戻し方は、鍵 known と id の字と字 unknown を二重引用符で囲む・空白なし）。

      決めた幅。(1) event は PostToolBatch にする。PostToolUse は並べた呼びごとに同時に撃たれ、同じ裁定を 2 つの hook が読んで印を 2 行置き、逐語を 2 度足しうる。PostToolBatch は組ごとに 1 度で、次の model の呼びの前に足す。失敗した tool の呼びの後も拾える。(2) 下請けの agent と teammate の守りは、入力の最上位の鍵 agent_id か agent_type が在れば撃たない形にする。agent_id は doc が本体と分ける鍵とし、in-process の teammate にも載る見込み（推し）。agent_type は --agent で起こした session の本体にも在るので、席を --agent で起こすと tool の呼びの後の配達は止まり、停止の hook だけが拾う（分からない時は届けない側に倒す）。split pane の teammate の本体の呼びに鍵が無ければ守りは効かない（未確か・席の team は in-process）。(3) 安い判じが読めない時（board が止まっている・port の設定が無い・board が Unknown を返す・応答が REACH の内に来ない）は台帳を読まずに黙る。印の無い裁定は停止の hook が次の停止で返す。(4) 印は答えを書けた後にだけ、答えが名指した裁定にだけ置く（上限で逐語を写さない 2 つ目から後の裁定は印を置かず、次の組の後の hook か停止の hook が拾う・組ごとに少なくとも 1 つに印が付く）。経路の語は新しい字「tool の呼び」で、配達済みの判じは経路を見ないので、面の 席に届いていない と server の撃ち直し（周ごとに印を読み直し、どれにも印が在れば止める）はこの印でも止まる。(5) server が器の配達の口を撃って rc 0 を受けた直後で、印の書きの前に席が tool を撃つと、配達の口の印と tool の呼びの印が 2 行置かれ、逐語が 2 度足されうる（害は重なりだけ）。(6) 判じの待ちが長い時は、席の次の model の呼びが遅れる（中央 9 ms・board の読み直しと重なると REACH の 0.5 秒まで）。

      歯（中核の tests/fdlt.rs と境界の tests/fdlt.rs・接頭辞 fdlt_）。中核の 6 本は、歯の中で組む台帳（問い fx-t.1〜fx-t.8）と hook の入力と、workspace の根の hooks.json を読む。境界の 6 本は、作業場（CARGO_TARGET_TMPDIR の下の fdlt）に撃たれた引数を記録する sh の script を偽の git と tailnet の道具と bd と bdw として置き、同じ process の thread で立てた読むだけの server か 127.0.0.1 の受け手を board にし、tz の binary を作業場を PATH の頭に足して撃つ（tailnet の道具は落ちる形だけで、住所の列は 127.0.0.1 だけ）。filter の語は起草の時の main 666ccd51 の契約表の verify の最後の字 315 語を、ほかの語を部分の字として含まない 239 語に畳んだ語で、中核の歯の file が const FILTERS に持つ。直す着地済みの歯は中核の gins の gins_pretool_bash_entry の鍵の列だけ。置き場だけの = は、delivery.rs の字と hooks.json を読む中核と境界の fdlv と fstop と中核の fmark、口 GET /api/unreceived を撃つ境界の fundl、hooks.json を読む境界の qsig、main.rs を読むか tz hook を撃つ境界の hbconf・qgate・fpremhook・ntcsrv・dstg。

      試作と噛み。main 666ccd51 の写し（係の dir の clone）で fdlt の 12 本と直した gins と = の歯が通り、xtask の check が緑（nextest 1712 本）。書く file は write-set の中で閉じる。変異 8 つ（agent_type を見ない・印の在る裁定も拾う・写さない最初の裁定を名指しに数えない・hooks.json の event の名を違える・口の path を違える・知らない旗を通す・hooks.json と歯の COMMAND の runner の守りを外す・歯の名に filter の語）で、done の 13 本の歯（xtask の check を除く）がどれもどれかの変異で落ちた。src の行数は試作の後で中核の delivery.rs 353、境界の hook/deliver_tool.rs 254（src の差分は中核と境界の 4 file で 325 行を足し 11 行を消す・hooks.json は 11 行を足す・歯は新しい 2 file で 1203 行〔うち FILTERS 239 行〕と直した 1 file で 1 行を足し 1 行を消す）。試作の diff は約 62 KB。

      依存と順。depends は空（依存の f-deliver は着地済み）。書く file の重なる契約の行（f-deliver・e-signal-send・f-gate-install・e-stage-target・i-11・e-multi-ask）は main の log に着地の commit が在る。計画 5 節の鎖の boundary/main.rs と hook/mod.rs は f-deliver の後、k-parity（計画だけの行）の前。plugin/hooks/hooks.json と中核の歯 gins は f-deliver の後。

      範囲の外。split pane の teammate を見分けること（入力の鍵が doc で決まるまで・席の team は in-process）。停止の hook の答えに逐語を足すこと（行 f-stop の答えの形は変えない）。配達の口の経路の印の置き方（行 f-mark-serve のまま）。hook の判じの答えを file に持ち回すこと（hook は file を書かない）。

  - n: 27
    type: prose
    title: 行 e-held-marks — 器の出力の入力の印を決定 (2) の一覧にし、席の card と account board の読みで表を分け合う
    body: |
      判断の記録 ADR-23 の撤退の条件 (2) で起こした直しの行。着地した行 e-held-seat の input_marks は決定 (2) の印より狭い（tick status と doctor の印は席の target の 1 つの dir の記録と群の記録だけで、host.toml と event log と seat の dir とほかの席の記録と pointer-ladder と move-signal が無い）。そのため席の card の doctor は器の event（event log の書き）で撃ち直さず、event log に由る doctor の字の変わりが doctor の上限（30 秒）まで遅れうる（要件 NFR2 の 5 秒と、決定 (2) の開示の「器の event は印に入るので 5 秒の内のまま」に反する）。行 e-held-acct はこの狭さのため、account board の tick status と doctor を、席の card の読みの鍵の末に字 acct を足した鍵と、全部の席の dir の input_marks の和に event log を足した印（fn vessel_marks）で持ち、分け合いは usage だけになった（決定 (3) より狭い）。

      直し。境界の seat の input_marks を決定 (2) の一覧にする。usage は今のまま host.toml と event log。tick status はそれに、state dir の下の seat の dir そのものと、その下の全部の席の dir（名の順・dir でない file は除く）ごとの tick-last・pointer-ladder・heartbeat-off・heartbeat-on・move-signal・account と、群の記録の dir の .account と .refused の file（名の順）を足す。doctor は席の dir ごとの記録を heartbeat-off・heartbeat-on・account だけにする。印は席の target に依らない（pub const TICK_SEAT_MARKS・DOCTOR_SEAT_MARKS・POINTER_LADDER・MOVE_SIGNAL・SEAT_DIR を置く）。境界の acct の fn held_out は、字 acct の鍵と fn vessel_marks をやめて read_held で読み、usage も held_out を通す（pub const ACCT_KEY と module の fn vessel_marks と fn shoot_in を消す）。同じ server の席の card の読みと account board の読みは、同じ state dir の器の 3 つの出力を同じ鍵と印で持ち、表の持ち分を分け合う。

      同じ鍵の読みは 1 本ずつ（決定 (1) の字）。境界の held の Held は鍵ごとの順番の錠（欄 turns）を持ち、get は撃っている間に来た同じ鍵の読みを、その終わりを待たせてから印を取って比べる。別の鍵の読みは待たない。表の錠は読みの関数を撃つ間は持たないまま。なぜ。席の card の読み（Seats の錠）と account board の読み（Acct の錠）は別の錠で並んで走り、project board の席の block は口 /api/seat と /api/next と /api/account を同じ知らせで読み直すので、鍵を分け合うだけでは同じ鍵の読みを 2 本撃つ。folio の読み（design）の同じ鍵の読みも 1 本ずつになる（走っている撃ちへの合流の場 Coalesce は残す）。

      撃ちの数（起草の試作の測り・写しの中だけの歯で数えた・偽の器・同じ表の Seats の card と Acct の doc・state dir 1 つに席の dir 2 つ・anchor 1 つ）。着地の形（e-held-acct の後に e-ledger-lazy と c-acct-parse を当てた写し）→ この行、順に読む形と同時に読む形で、最初の読み 8 と 9 → 6 と 6、event log の書き 3 と 4 → 3 と 3（着地の形は account board の読みだけが撃ち直し、席の card の doctor と tick status は古いまま）、target の席の tick-last 2 と 2 → 1 と 1、ほかの席の tick-last 1 と 1 → 1 と 1、ほかの席の heartbeat-off 2 と 2 → 2 と 2、ほかの席の move-signal 0 と 0 → 1 と 1（tick status）。1 本ずつの錠を外した形は同時に読む形で 8・6・2・2・4・2 本。費用の見立て（新しい測りは撃っていない）。project board のふだんの頁では撃ちが増えず、tsuzuri の state dir の doctor の持ち分 2 つ（席の card と account board・どちらも上限の 30 秒ごと）が 1 つになる分だけ減る。ADR-23 の測り（起草 lite1 の試作・決定 (8) の数）は、同じ鍵と印と 1 本ずつの錠の形で測った。

      直す着地済みの歯。eheld の eheld_acct_shares_usage（同じ表の Acct の doc で増える撃ちが rules get の 3 本だけになり、器の数が 3・7・7・12 から 3・6・6・11 に）。名は替えない。ほかの着地済みの歯（server_acct の撃ちの数を数える 7 本・server_seat の hbmark_ と hbon_・eheld の eheld_vessel_ の 2 本）は数を変えずに通る。新しい歯は eheld の eheld_marks_by_adr_list・eheld_marks_card_follows_events・eheld_marks_one_read_per_key・eheld_marks_card_and_acct_in_flight。

      依存と順。depends は c-acct-parse（このノートの 23 行目・e-held-acct と e-ledger-lazy の後の鎖の末）。書く file の重なり: acct.rs は e-held-acct（着地済み）と e-ledger-lazy と c-acct-parse が書く。server/seat.rs は e-held-seat、server/held.rs は e-held-design、歯 eheld は e-held-design と e-held-seat と e-held-acct が書いた（どれも着地済み）。置き場だけの = の歯 server_acct は e-ledger-lazy と c-acct-parse が、server_coalesce は e-ledger-lazy が書く。

      範囲の外。変化の知らせの印（Seats の marks と Acct の marks）と、面の口ごとの読み直しの種類（口 /api/seat は種類 Seat だけ）は変えない。doctor の印の外の入力（tmux・起動の管理・口座の dir の file・plugin・git）の遅れの開示は ADR-23 のまま。

      今の字（main ee584706・行 e-held-acct と e-ledger-lazy と c-acct-parse の着地の後）。境界の src/server/seat.rs の pub fn input_marks(seat: &Seat, head: &[&str]) は、fleet usage --show の頭で state dir の host.toml と fleet/events.jsonl を返し、seat tick status の頭で席の dir（state dir の下の seat の下の、target の : を _ に替えた名の dir・target が空なら無い）の tick-last・heartbeat-off・heartbeat-on・account に、群の記録の dir（state dir の親の scribe2-host/groups）の直の file のうち名が .account か .refused で終わる file（名の順）を足した列を返し、doctor の頭では tick-last を除いた同じ列を、ほかの頭では空を返す。pub fn read_held(held, seat, head) は、鍵を Seat の program と argv（head の後に --state-dir と state dir）と cwd の列にし、印を input_marks(seat, head)、上限を ceiling(head) にして held.get を呼ぶ。Seat の seat_dir は state dir に字 seat と席の名を足す。src/server/held.rs の Held は欄 rows（Arc<Mutex<HashMap<Key, Row>>>）だけを持ち、pub fn get は印の更新時刻と長さを先に取り、鍵の持ち分が上限の内で印が同じなら持った字を返し、ほかは読みの関数を撃つ（module の doc は、走っている撃ちへの合流を読みの関数の内側の Coalesce に残すと書く）。src/acct.rs は pub const ACCT_KEY（字 acct）を持ち、fn vessel(dir) は target が空の Seat を返し、fn held_out(head, dir) は、鍵を read_held と同じ列の末に ACCT_KEY を足した列、印を module の fn vessel_marks（target が空の input_marks と、seat の dir の下の dir の名を target にした input_marks の和に event log を足し、path の順で重ねない）、読みの関数を fn shoot_in（head と --state-dir と dir を shoot に渡す）にして held.get を呼ぶ。fn gather は usage を read_held(&self.held, &self.vessel(&self.state_dir), &USAGE_ARGS) で読み、引数の state dir の doctor と state dir ごとの tick status と doctor を held_out で読む。着地した行 e-ledger-lazy と c-acct-parse（このノートの 22・23 行目）は、acct.rs に pub fn with_watched と読み解きの持ち回し（pub fn parsed と fn parsed_all）を足したが、held_out と vessel_marks と shoot_in と ACCT_KEY には触れていない（666ccd51 から ee584706 の acct.rs の差分で確かめた・seat.rs と held.rs と tests/eheld.rs はその間に変わっていない）。着地済みの歯 eheld_acct_shares_usage は、表 H を受けた Seats の card の後に器 3 回、同じ H の Acct の doc の後に 7 回（fleet usage は無い）、同じ Seats の card の後も 7 回、新しい Held の Acct の doc の後に 12 回（増えた 5 回のうち fleet usage は 1 回）を見る。eheld_vessel_marks_by_head は input_marks の列が含む file と含まない file を見て、列の全部は比べない。server_acct の撃ちの数を数える歯は account board の読みだけで数え、作業場の state-a の proj-a_0.1 の move-signal は置いたまま動かさない。

      試作と噛み。起草の main 666ccd51（ノート v0.22）の写しに、起草 w32a の試作の e-ledger-lazy と c-acct-parse を cherry-pick で当て、その上にこの行を当てた写しで、xtask の check が rc 0（nextest 1709 本）。2 行の着地の後、席がこの行の試作を main ee584706 に当て直した（acct.rs の module の doc と ACCT_KEY の置き場の 1 か所の衝突を、ACCT_KEY を外すこの行の側に解いた）写しでも、xtask の check（公開の走査・build・nextest の全部・clippy・面の組み立て）が rc 0（nextest 1709 本）。その写しで、書く file はこの行の write-set の書く file と一致し（差分の file 4 個）、差分は 25211 byte（+291 −97 行）。歯 eheld は 378 行から 582 行。変異 7 つを 1 つずつ当てて名指した歯を撃ち、done の歯は全部どれかの変異で落ちた（M1（doctor の印に tick-last を足す）と M2（tick status と doctor の印から event log を外す）で eheld_marks_by_adr_list と eheld_marks_card_follows_events、M3（席の dir を target の 1 つだけにする）で同じ 2 本と eheld_acct_shares_usage と eheld_marks_card_and_acct_in_flight、M4（seat の dir を印にしない）で eheld_marks_by_adr_list、M5（同じ鍵の読みを 1 本ずつにしない）で eheld_marks_one_read_per_key と eheld_marks_card_and_acct_in_flight、M6（鍵に席の target を入れて 2 つの読みの鍵を分ける）で eheld_acct_shares_usage と eheld_marks_card_and_acct_in_flight、M7（鍵ごとでなく表の全部の読みを 1 本ずつにする）で eheld_marks_one_read_per_key）。接頭辞 eheld_marks_ は、起草の main の契約表の verify の filter の語 315 のどれとも部分の字で重ならない。

