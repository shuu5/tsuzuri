  - n: 8
    type: prose
    title: 便 g-min — 最小の project board
    body: |
      最初の本物の画面を早く出すために、project board の最小の形を先に置く（作る順の計画 2026-09-27・持ち主の承認）。
      面の crate に Leptos（csr）の画面を 1 枚置く。出すのは、問いの一覧（open の question を古い順）・台帳の一覧（epic の下に task と memo・状態の印）・最終更新の時刻の 3 つ。
      data は server の口（台帳の一覧と変化の知らせ）から読む。読めないときは 0 件でなく測れていないと出す（要件 NFR2）。
      この便は問いと台帳を見せるだけで、答えの欄と 2 つ目の面（account board）は持たない。答えの欄は便 e の受付の後に便 g が足し、account board は便 h が置く。
      並べ方と状態の印と測れていないの判定は純粋な関数（view の module）に置き、host の cargo test で試す。DOM と通信を触る部分は wasm の target のときだけ組み立て、host の build と clippy が workspace の全部で通る形にする。
      組み立ては xtask の下から trunk を呼ぶ（cargo run -q -p xtask -- surface-build）。出力は面の crate の dist の dir で、版管理の外に置く。この便は server の file を触らない（配る側の引数は便 e-min が置いた tz surface serve の --files で、着地済み）。
      依存は Leptos の一式を足す。面の crate の依存の予算は core と別枠で、直接依存 8 本以下（規則の行 R-25 の値・要件 NFR3）。xtask の歯は本数の定数を持ち、rules の file の行 R-25 の字（直接依存 8 本）と食い違えば落ちる。便 a の xtask の歯（Cargo.lock の外の package の許可の一覧）は、crate ごとの直接依存の名の一覧を照らす形に改める。
      toolchain の file の wasm の target と CI の trunk は、便の前に設計席が main で足す。この便は土台の便 e-min の着地の後に起こす（依存は台帳の blocks で張る）。
  - n: 9
    type: prose
    title: 便 g-frame — project board の枠と見た目
    body: |
      最小の画面は見た目も機能も見本（mock v3）に遠い。先に見た目と頁の枠を見本に揃え、block を module に分けて、後の便が block を 1 つずつ並べて書けるようにする（持ち主の指摘 2026-09-27・開発の速さ）。
      見本の頁は docs/design/mock3 に写してある（index.html・map.html・ask.html・ui.css・ui.js・ledger.js・vocab.json ほか）。見本は持ち主が承認した仕様の見本で、class の名と block の並びと語はこれに揃える。見本の JavaScript は読む材料で、写さない。
      stylesheet は見本の ui.css を面の crate の style.css に写す。class の名は変えない。頁は 2 つ。home の頁の枠は header（題・mode の切り替え・最終更新・地図の頁への link）と 6 つの block（id は next・ask・pipe・orch・ledger・legend = 次の一手・問いの一覧・pipeline・orchestrator と口座・台帳の処理状況・凡例）で、この順に置く。地図の頁（id は map）は枠と見出しだけを置く。
      block と地図の頁は project の下の module に 1 つずつ置く（next・ask・pipeline・seat・ledger・legend・map の 7 つの file）。この便で中身を持つのは 3 つ。ask は問いの一覧、ledger は台帳の一覧（どちらも便 g-min の中身を見本の class で描き直す）、legend は状態の印の凡例。
      data の口がまだ無い 4 つ（next・pipe・orch・地図の頁）は、見出しと、0 でなく測れていないの印と、理由の 1 行を出す。ledger の block の指標の段も同じく測れていないと出す。中身は後の便が module ごとに足す。
      見出しの語と「?」の注釈の字は見本の vocab.json を面の crate に写して引く。初心者と経験者の mode は URL に残す。hover の card と「?」の注釈の部品は widgets の下に置き、この便では「?」の注釈だけを動かす。
      頁の枠と block の見出しは純粋な関数の値にして host の cargo test で pin する。DOM を触る部分は wasm の target のときだけ組み立てる。この便は server と中核の crate と契約の型の crate を触らない。

  - n: 10
    type: prose
    title: 便 g-parts — block に共通の部品
    body: |
      block の便を 1 つずつ並べて走らせるために、block が共通に使う部品を先に置く。この便の後、block の便は自分の module の file と自分の歯の file だけを書く。
      読みの口。block は自分の口を 1 本読む。口の path は閉じた 6 本で、ask と ledger の一覧は /api/ledger（着地済み）、next は /api/next、pipeline は /api/pipeline、seat は /api/seat、ledger の指標の段は /api/metrics、地図の頁は /api/graph。path は block の module の定数に置く。/api/ledger の外の 5 本は server にまだ無い（後の便が足す）。無い口は 200 を返さないので「読めない」になる。
      読みの結果は 3 値にする（まだ読んでいない・本文・読めない）。通信の module は、path を受けて読みの結果の signal を返す関数を持つ。頁を開いたときに 1 回読み、読み直しの合図を受けたら登録された口を全部読み直す。
      読み直しの合図は、変化の知らせ（SSE・/api/surface/events）の接続が開いたときと、event の名が ledger-changed か board-changed の知らせを受けたとき。ledger-changed の定数（LEDGER_CHANGED_EVENT）は契約の型の crate の台帳の module（src/ledger.rs）に着地済みで、この便は触らない。board-changed は器の event の記録か設計文書が変わったことを表す名で、この便が契約の型の crate の面の module（src/surface.rs）に定数（BOARD_CHANGED_EVENT）として 1 つ足す。接続は頁に 1 本だけ持つ。接続が切れたら、登録された口の結果を全部「読めない」にする。
      block の中身の関数は、読みの結果を受けて中身を返す純粋な関数にする。この便では next・pipeline・seat・地図の頁・ledger の指標の段の 5 つを、3 値のどれを受けても測れていないと理由の 1 行を返す形にする（本文を受けたときの理由は「この block の中身はまだ無い」）。本文を読んで中身を返すのは後の block の便。ask と ledger の一覧は今の中身のまま、同じ通信の関数で読む。
      hover の card。card の層を頁に 1 つ置き、block は「要素に card を付ける関数」を呼ぶだけにする。card は 4 行（題・種類・値・出所）と「詳しく」で、1 行は 36 字まで（超える行は 35 字と「…」）。
      置き場は規則の行 R-20 の値で、card の左上を pointer の右 16 ピクセルと上 20 ピクセルに置く。card の右端が窓の右端を越えるときは pointer の左 16 ピクセルに card の右端を置く。card が窓の上端か下端を越えるときは、窓に収まるまで縦に寄せる。
      猶予は 150 ミリ秒（規則の行 R-20）。要素を出た点と今の pointer の点を比べ、card の矩形までの距離が縮んでいて、出てから 150 ミリ秒以内なら card を残す。それ以外は消す。置き場と猶予の判定と行の切り方は純粋な関数にして host の cargo test で pin する。行の数と字数は規則の行 R-19 の値（4 行・1 行 36 字）。歯は定数を rules の file（design-intent/rules.yaml）の行 R-20 と行 R-19 の字と照らす（読むだけ）。
      web-sys の feature は、後の block の便が Cargo.toml を触らずに済むよう、この便でまとめて足す（Document・Element・HtmlElement・DomRect・Event・EventTarget・MouseEvent・PointerEvent・KeyboardEvent・WheelEvent・History・Location・Headers・Request・RequestInit・HtmlInputElement・HtmlTextAreaElement・SvgElement）。feature を足すだけで、外の依存の package は増やさない。
      この便は server と中核の crate を触らない。契約の型の crate に書くのは、面の module に足す定数 1 つ（BOARD_CHANGED_EVENT）だけ。

  - n: 11
    type: prose
    title: 便 g-pipe — block「pipeline」の中身
    body: |
      block「pipeline」の中身を置く。見本は docs/design/mock3/index.html の pipe の block と、docs/design/mock3/ui.js の kcardHTML（札）。class の名は見本のまま使う（stylesheet に着地済み）。書くのは自分の module の file と、自分の歯の file と、fixture の 1 つだけ。
      data は 2 つの口から読む。/api/pipeline は pipeline の板（契約の型の PipelineBoard・札は契約 bead の id・走行の回数・段・段の理由・口座・経過の秒）。/api/ledger は台帳の一覧（札の題を bead の id で引く）。読みは便 g-parts の通信の関数（面の crate の net の read・口の path を受けて読みの結果の signal を返す）を使う。
      板は 4 列で、順は Queued / Blocked・Running / Gated・Questioned / Failed / Stopped・Landed。列の class は順に c-wait・c-run・c-stop・c-land、見出しの語の鍵は順に col_wait・col_run・col_stop・col_land。段から列への対応は、契約の型の段の型が持つ関数（Stage の column）を呼ぶ。見出しの横に、その列の札の数を出す。
      列の中は経過の短い順（同じなら bead の id の順）。列ごとに 3 枚まで出し、超える分は「+n」の button にする。button を押すと、その列の札を全部出す。開いた列の名は URL の query（鍵は col）に残し、頁を開き直しても開いたままにする。
      札は、状態の記号・題・bead の id・走行の回数・経過の字を持つ。題は 36 字で切る（契約の型の title36）。台帳の一覧から引けない札は題を出さず id だけを出す。Questioned / Failed / Stopped の列の札は、回数の代わりに段の理由の字を出す。経過の字は、60 秒未満は秒の数と s、60 分未満は分の数と m、24 時間未満は時間の数と h、それ以上は日の数と d（端数は切り捨て）。bead の頁はまだ無いので、札は link にしない。
      札に hover の card を付ける（便 g-parts の部品・面の crate の widgets の hover の attach と Card）。4 行は、題・種類（run と段の名）・値（回数と口座と経過）・出所（fleet/events.jsonl）。
      読めて札が 0 枚のときは、0 件の帯（class は empty・字は run の語と数の 0）と、空の 4 列を出す。札が「まだ分からない」のとき・口が読めないとき・まだ読んでいないときは、0 件でなく測れていないの印と理由の 1 行を出す（要件 NFR2）。
      在りか（着地済み・この便は触らない）。契約の型の crate の板の module（crates/tsuzuri-contract/src/board.rs）に、板の型 PipelineBoard と札の型 PipelineCard と段の型 Stage と、段から列を返す関数（Stage の column）と列の型 PipelineColumn が在る。題を 36 字で切る関数 title36 は同じ crate の graph の module に在る。台帳の一覧の型 LedgerList は同じ crate の ledger の module に在る。語の鍵 col_wait・col_run・col_stop・col_land・pipeline・st_unknown は語の辞書に在る。class の board・col・c-wait・c-run・c-stop・c-land・cnt・cards・kcard・more・kid・why・empty は stylesheet に在る。語の辞書（crates/tsuzuri-surface/vocab.json・便 g-frame が見本から写した）と stylesheet（crates/tsuzuri-surface/style.css・見本の ui.css の写し）は着地済みで、この便は触らない。使う語の鍵と class は全部そこに在るものだけにする。測れていないの印と理由の 1 行は、面の crate の project の module の部品（Body の Unmeasured・unmeasured・語の鍵 st_unknown）を使う。
      着地済みの関数の外形は変えない。変えないのは、BLOCK の値・口の path の定数・読みの結果を受けて Body<()> を返す関数（body）の名と引数と返りの型。枠の歯（tests/frame.rs）はこの関数を呼んでいて、この便の write-set の外に在るので、そのまま通す（本文が電文の型として読めないとき、この関数は測れていないを返す）。中身を返す関数は、同じ module に別の名で足す。題を引く関数と列を組む関数も同じ module に足す。並べ方と字の関数は純粋な関数にして host の cargo test で pin し、DOM は wasm の target のときだけ組み立てる。
  - n: 12
    type: prose
    title: 便 g-next — block「次の一手」の中身
    body: |
      block「次の一手」の中身を置く。見本は docs/design/mock3/index.html の nextHTML。書くのは自分の module の file と、自分の歯の file と、fixture の 1 つだけ。
      data は口 /api/next から読む（契約の型の NextStep・着地済み）。電文は閉じた 7 種の 1 つずつについて、判じた結果（当たった・当たらない・判じなかった）と件数と対象の id を順に持ち、大きく出す 1 つを名指す。判定は中核の crate が済ませていて、面は写すだけにする（面の code に判定の分岐を書かない）。
      7 種と語の鍵の対応は、限度と移動 nx_a・応答なし nx_b・止まっている走行 nx_c・束の承認 nx_d・質問 nx_e・発効待ち nx_f・なし nx_g。順は契約の型の 7 種の宣言の順を引く。
      大きく出す 1 つは、見本の class nxbig の箱に、語（「?」の注釈つき）と中身の字を出す。止まっている走行の中身は件数と、block「pipeline」への頁の中の link。質問の中身は対象の bead の id と件数。なし（どれも当たらない）は class nxbig none の箱。
      残りの種類は、見本の class nxlist の一覧に 7 種の順のまま出す（大きく出した 1 つは除く）。当たった種類は件数、当たらない種類は「―」、判じなかった種類は測れていないの記号を出す（0 や「―」と区別する）。
      口が読めないとき・まだ読んでいないときは、0 件でなく測れていないの印と理由の 1 行を出す（要件 NFR2）。
      在りか（どれも着地済み・この便は触らない）。電文の型 NextStep は契約の型の crate の stats の module（crates/tsuzuri-contract/src/stats.rs・便 d の着地 715840c）に在る。NextStep の欄は 2 つで、checks（NextCheck の列・7 種の宣言の順に 7 つ）と lead（大きく出す 1 つ・型は NextMove）。NextCheck の欄は 4 つで、kind（NextMove）・result（CheckResult の 3 値で Hit は当たった・Miss は当たらない・NotJudged は判じなかった）・count（件数）・target（対象の bead の id・無ければ無し）。7 種の型 NextMove は同じ crate の板の module（src/board.rs）に在り、宣言の順は定数 ALL（7 つ・限度と移動から なし まで）。語の鍵 nx_a から nx_g の 7 つと next と st_unknown は語の辞書に在る。class の nxbig・nxlist・none・on・off は stylesheet に在る。語の辞書（crates/tsuzuri-surface/vocab.json・便 g-frame が見本から写した）と stylesheet（crates/tsuzuri-surface/style.css・見本の ui.css の写し）は着地済みで、この便は触らない。使う語の鍵と class は全部そこに在るものだけにする。測れていないの印と理由の 1 行は、面の crate の project の module の部品（Body の Unmeasured・unmeasured・語の鍵 st_unknown）を使う。
      着地済みの関数の外形は変えない。変えないのは、BLOCK の値・口の path の定数・読みの結果を受けて Body<()> を返す関数（body）の名と引数と返りの型。枠の歯（tests/frame.rs）はこの関数を呼んでいて、この便の write-set の外に在るので、そのまま通す（本文が電文の型として読めないとき、この関数は測れていないを返す）。中身を返す関数は、同じ module に別の名で足す。中身を組む関数は純粋な関数にして host の cargo test で pin し、DOM は wasm の target のときだけ組み立てる。
  - n: 13
    type: prose
    title: 便 g-ledger — block「台帳」の指標の段
    body: |
      block「台帳」の指標の段を置く。見本は docs/design/mock3/index.html の ledgerBlock と、docs/design/mock3/ledger.js の描き方の関数（netHTML・burndown・spark14・judgeHTML・unrefHTML・days）。class の名は見本のまま使う。書くのは自分の module の file と、自分の歯の file と、fixture の 1 つだけ。
      data は口 /api/metrics から読む（契約の型の LedgerStats・着地済み）。数え方と判定は中核の crate が済ませていて、面は写すだけにする。面の code に、数え直しと判定の分岐を書かない。
      上段（class l4）は 4 つの数で、open の task・open の memo・未反映・純減 24h（語の鍵は l_task・l_memo・l_unref・l_net24）。純減は矢印と数で出す。電文の net_drop_24h と net_drop_7d の値は「今の open の task の数 − 過去の時点の数」で（中核の crate の stats の関数・着地済み）、欄の名は net_drop だが、増えた向きが正、減った向きが負。値が負なら ↓（純減）、正なら ↑（純増）、0 なら →（横ばい）。数の字は、負は「−」と絶対値、正は「+」と値、0 は「0」。例: 値 -3 は「↓」と「−3」、値 2 は「↑」と「+2」、値 0 は「→」と「0」。見出しの横に判定の 1 語を出す。判定の 5 値は、滞りが「!」、積み増しが「↑」、停滞が「→」、順調が「✓」、台帳なしが「―」で、class と語の鍵（j_bad・j_up・j_stall・j_ok・j_none）への対応は 1 か所の表に置く。
      中段（class lmid）は burndown の図（14 日・線は open の task・棒は閉じた数 / 日）。座標の式は見本の burndown と同じにする。memo の段（class mpro）は 4 つの数で、open・昇格待ち・直近 7 日に閉じた数・年齢の中央値（語の鍵は m_open・m_wait・m_promo7・m_age）。
      主な指標は見えている所に置く（要件 FR13）。上段の 4 つの数の下に 1 行を足し、closed/日（小数 1 桁）と純減 7d（矢印と数）を出す。
      「詳しく」（見本の details の class gmore・経験者の mode では開いて出す）の中に置くのは 6 つで、ready・blocked・lead の中央値・stale・sparkline（14 日の created と closed）・epic の進み（閉じた数 / 全体の棒）。open の問いの数と open の epic の数も「詳しく」の中に出す。作業中の数と最古の task はどこにも出さない。
      未反映は数だけを出す。電文の unreflected の数をそのまま出し、電文の unreflected_unknown が名指す種類（memo・ruling・request）は、その名と測れていないの記号を出す（0 と書かない）。未反映の行の一覧は、行を運ぶ電文がまだ無いので、この便では出さない（後の便が電文と一緒に足す）。面の側で台帳の一覧から数え直さない。
      memo の年齢の中央値の字は、値なしは「―」、1 日未満は時間の数と h、10 日未満は小数 1 桁の日の数と d、それ以上は整数の日の数と d。lead の中央値も同じ形で出す。
      電文の形（着地済み・契約の型の crate の stats の module）。LedgerStats の欄は、at・judge（判定の 5 値）・open（task・memo・question・epic の数）・blocked・ready・stale・net_drop_24h・net_drop_7d・closed_7d・closed_per_day・lead（p50 と p90 の日数・無いことが在る）・days（14 日の列で、1 日は end・created・closed・open）・epics（epic の id と閉じた数と全体の数）・memo（open・awaiting_promotion・closed_7d・age_p50_days）・unreflected（数）・unreflected_unknown（分からない種類の列）。口の本文は、読めた LedgerStats か「まだ分からない」。epic の題は台帳の一覧（/api/ledger）から id で引き、引けなければ id だけを出す。
      台帳の一覧（便 g-frame の中身）は今のまま、指標の段の下に出す。
      配置は値で持つ。block の中の段の並びと、段ごとの項の名を、純粋な関数の値（配置の表）にして host の歯で pin する。段は上から、上段（open の task・open の memo・未反映・純減 24h）・主な指標の行（closed/日・純減 7d）・burndown・memo の段（open・昇格待ち・直近 7 日に閉じた数・年齢の中央値）・「詳しく」（ready・blocked・lead の中央値・stale・sparkline・epic の進み・open の問いの数・open の epic の数）・未反映の数・台帳の一覧。DOM はこの値を上から順にたどって組み立て、値に無い項を出さない。作業中の数と最古の task は、どの段の項にも無い。
      口が読めないとき・まだ読んでいないときは、指標の段は 0 でなく測れていないの印と理由の 1 行を出す（要件 NFR2）。
      在りか。面の crate は契約の型の crate に依存している（crates/tsuzuri-surface/Cargo.toml の dependencies の tsuzuri-contract・着地済み）ので、Cargo.toml は触らない。block を描く関数（ledger の module の view・引数は画面の状態の signal の 1 つ）は頁（board の module）から今の引数のまま呼ばれる。口の読みは view の中で、面の crate の net の read に指標の口の path の定数 METRICS_PATHを渡して得る（便 g-parts の着地でこの形になっている）。頁の側（board）は触らない。電文の型 LedgerStats は契約の型の crate の stats の module に着地済み（便 d の着地 715840c）。判定の型 LedgerJudge は同じ crate の板の module に着地済み。語の鍵 l_task・l_memo・l_unref・l_net24・l_net7・l_burn・l_epics・l_blocked・l_stale・l_ready・l_lead・j_bad・j_up・j_stall・j_ok・j_none・m_open・m_wait・m_promo7・m_age・memo_promo・unref・u_kind・u_age・u_next・nx_promote・st_unknown・l_rate・l_spark・l_question・l_epic は語の辞書に在る。closed/日 の見出しは語の鍵 l_rate で出す（辞書の字は closed/日）。sparkline の見出しは l_spark、open の問いの数は l_question、open の epic の数は l_epic。class の l4・l4un・l4net・net・net-down・net-up・net-flat・lmid・lcap・lburn・lb-closed・lb-open・lspark・mpro・gmore・gm・gm1・fold・lep・lchips・ulist・urow・hrow・jdg・ep・bar は stylesheet に在る。語の辞書（crates/tsuzuri-surface/vocab.json・便 g-frame が見本から写した）と stylesheet（crates/tsuzuri-surface/style.css・見本の ui.css の写し）は着地済みで、この便は触らない。使う語の鍵と class は全部そこに在るものだけにする。測れていないの印と理由の 1 行は、面の crate の project の module の部品（Body の Unmeasured・unmeasured・語の鍵 st_unknown）を使う。
      着地済みの関数の外形は変えない。変えないのは、BLOCK の値・口の path の定数・読みの結果を受けて Body<()> を返す関数（metrics）の名と引数と返りの型。枠の歯（tests/frame.rs）はこの関数を呼んでいて、この便の write-set の外に在るので、そのまま通す（本文が電文の型として読めないとき、この関数は測れていないを返す）。中身を返す関数は、同じ module に別の名で足す。台帳の一覧の関数（body と count）も変えない。数と字と座標の関数は純粋な関数にして host の cargo test で pin し、DOM は wasm の target のときだけ組み立てる。

  - n: 14
    type: prose
    title: 便 g-map — 地図の頁の中身
    body: |
      地図の頁の中身を置く。見本は docs/design/mock3/map.html の compact（圧縮）・list（一覧）・table（表）と、docs/design/mock3/ui.js の帯の表（BANDS・BAND_PATH・BEADS_LANES）。書くのは、地図の module の file（project の下の map）と、面の部品を置く新しい module（面の crate の src の下の mapview・入口の file と 6 つの file）と、面の crate の入口の file（lib.rs に module の宣言の 1 行を足す）と、自分の歯の file と、fixture の 1 つだけ。project の dir の下には file も dir も足さない（枠の歯が project の下の項を block の数と照らしていて、その歯はこの便の write-set の外に在る）。
      data は口 /api/graph から読む（契約の型の GraphDoc・便 e-read の着地 fb8053f で契約の型の crate の graph の module に在る）。GraphDoc の欄は 7 つ。nodes は節点の列（GraphNode の欄は id・kind・file・digest・title）。edges は辺の列（GraphEdge の欄は from・to・型）。unread は読めなかった出所の列（GraphSource の閉じた 3 値で、字は design・ledger・runs）。beads は bead の id から属性への表（BeadAttr の欄は kind・status・labels・pointers・touches）。runs は走行の id から属性への表（RunAttr の欄は stage・account で、どちらも無いことが在る）。invariants は不変条件の判定の列（InvariantCheck の欄は id・verdict・violations・ids）。skipped は組まずに数えた辺の数（design・ledger）。読めなかった出所と帯の対応は、design が constitution・rules・ADR・SRS・design-note、ledger が beads、runs が pipeline。読みは面の crate の net の read を使う。
      頁の頭に見出しと節点の数を出し、その下に面の切り替えの tab を 4 つ置く（圧縮・一覧・グラフ・表・語の鍵は view_compact・view_list・view_graph・view_table・class は tabs）。今の面は URL の query の view（値は compact・list・graph・table）に残し、値が無いか知らない値なら圧縮の面にする。
      帯は 7 つで、順は constitution・rules・ADR・SRS・design-note・beads・pipeline。種類から帯への対応は閉じた表で 1 か所に置く。条と規範文は constitution。規則行は rules。判断の記録は ADR。目的・要件・非機能要件・受入基準・制約・登場人物・出力は SRS。設計ノートの行（note-row）は design-note。epic・task・memo・question・ruling・receipt・policy は beads。run は pipeline。beads の帯は種類の 7 行に分け、順は epic・task・memo・question・ruling・receipt・policy。
      種類から語の鍵への対応も閉じた表で 1 か所に置く。設計文書の 11 種は「k:」に種類の日本語の名をつないだ鍵（k:条・k:規範文・k:規則行・k:目的・k:要件・k:非機能要件・k:受入基準・k:制約・k:登場人物・k:出力・k:判断の記録）。note-row は k:設計ノートの行。epic は k:epic。task は k:契約。memo は k:memo。question は k:問い。ruling は k:裁定。receipt は k:受け。policy は k:方針。run は k:走行。帯の語の鍵は「b:」に帯の名をつないだ鍵。
      圧縮の面は、帯ごとに 1 つの箱（class は band と band-<帯の名の小文字>）を帯の順に置く。箱の頭に帯の名・出所の path・節点の数を出す。出所の path は見本の BAND_PATH の字。constitution は条の札（class art7）を電文の順に並べ、札の下に、その条の規範文の id を並べる（規範文の id は条の id に「.」と数をつないだ形）。rules は電文の順。ADR と SRS は id の自然な順（数は数として比べる）。beads は種類の行ごとに小見出し（class subh）と数と札。pipeline は走行の札。札（class tag）は印と id と題（30 字で切る）。読めなかった出所に当たる帯は、0 件でなく測れていないの印と理由の 1 行を出す。読めて 0 件の帯は 0 件の帯（class empty）を出す。
      一覧の面は、絞り（帯・種類）と並べ替え（id・状態）の選択（class filters）と、行の一覧（class items rows）。行は印・id・題（36 字で切る）・帯の chip・種類の語・状態の語。要約は電文にまだ無いので、class gist none で「要約なし」と出す。更新の時刻は電文に無いので、この便では出さず、並べ替えにも入れない。状態は、bead は属性の状態の字、走行は属性の段の字、設計文書の節点は状態なし。並べ替えの id は、帯の順、次に constitution と rules は電文の順、ほかは id の自然な順。並べ替えの状態は、open の問い・open と in_progress・状態なし・それ以外の順で、同じなら id の自然な順。絞りと並べ替えは URL の query の band・kind・sort に残す。種類の組（query の pair・値は「種類|種類」）が在れば、その組の辺の両端の節点だけに絞り、組の名と数と、絞りを外す button を出す。
      表の面は、種類と種類の辺の数の行列（class mx）。行は辺の from の節点の種類、列は to の節点の種類で、辺が 1 本も無い種類は行にも列にも出さない。数の cell は button で、押すと一覧の面へ移り、その組で絞る。幅の狭い画面のための一覧（class mxlist）も同じ数を出す。
      グラフの面と近傍は後の便が足す。この便は mapview の下に module の file（graph と around）を置き、中身は測れていないの印と理由の 1 行（この面はまだ無い）を返す関数だけにする。後の便はその file だけを書く。
      圧縮と一覧の全部の札と行に節点の id を出す。節点の頁はまだ無いので、札と行は link にしない。
      在りか。節点の種類の型 NodeKind（20 個・ALL の定数）と辺の型 EdgeType と節点と辺の型（GraphNode・GraphEdge）と題を 36 字で切る関数 title36 は、契約の型の crate の graph の module に着地済み。語の鍵 map・views・bands・matrix・view_compact・view_list・view_graph・view_table・col_band・col_kind・col_id・col_state・sort・st_unknown と、「b:」の 7 つと「k:」の 27 個は語の辞書に在る。class の tabs・band・band-constitution・band-rules・band-adr・band-srs・band-design-note・band-beads・band-pipeline・art7・kids・tag・tid・tt・subh・cards7・filters・items・rows・rowb・nid・ttl・meta・bchip・gist・none・mx・mxwrap・mxlist・pair・pairnote・path・bn・shape・empty は stylesheet に在る。語の辞書（crates/tsuzuri-surface/vocab.json）と stylesheet（crates/tsuzuri-surface/style.css）は着地済みで、この便は触らない。使う語の鍵と class は全部そこに在るものだけにする。
      着地済みの関数の外形は変えない。変えないのは、BLOCK の値・口の path の定数・読みの結果を受けて Body<()> を返す関数（body）の名と引数と返りの型。枠の歯（tests/frame.rs）はこの関数を呼んでいて、この便の write-set の外に在るので、そのまま通す（本文が電文の型として読めないとき、この関数は測れていないを返す）。中身を返す関数は別の名で足す。並べ方と絞りと数え方は純粋な関数にして host の cargo test で pin し、DOM は wasm の target のときだけ組み立てる。
      fixture は小さくする（節点 40 個以下・辺 60 本以下）。

  - n: 15
    type: prose
    title: 便 g-seat — block「orchestrator と口座」の中身
    body: |
      block「orchestrator と口座」の中身を置く。見本は docs/design/mock3/index.html の orch の block（renderSeat・lowHTML・bandHTML・histHTML）と、docs/design/mock3/ui.js の stripSVG・stIcon・tkhbHTML と、docs/design/mock3/acct.js の meter。書くのは自分の module の file と、自分の歯の file と、fixture の 1 つだけ。
      data は口 /api/seat から読む（契約の型の SeatCard・便 b-cards の着地 3a453c2 で契約の型の crate の seat の module に在る）。状態の判定は server の側が済ませていて、面は写すだけにする。口は server にまだ無いので（後の便が足す）、着地の直後の画面は測れていないを出す。
      電文の形。SeatCard の欄は、at・target・state（閉じた 5 値 run・wait・limit・silent・unknown）・since・tick_healthy・heartbeat・account・model・group（群の名と今の口座と候補と次の移り先）・usage（窓ごとの 1 行の列で、1 行は window・used_pct・resets_at・counted。window の字は five_hour・seven_day・seven_day_model の 3 つのどれか）・spans（区間の列で、1 行は from・to・state）・moves（移動の列で、1 行は at・from・to）。tick_healthy・heartbeat・group・usage・spans・moves は、読めたか「まだ分からない」かを持つ。
      上段（class orow）。左は大きい状態の記号と語（class big・語の class は state stlabel st-<値>・語の鍵は st_run・st_wait・st_limit・st_silent・st_unknown）と、「から」の時刻（語の鍵 since・時刻は時と分と Z）。その下に合図の行（class tkrow）で、tick の健康（語の鍵 tick_health・読めて健康なら ✓・健康でなければ !）と heartbeat（語の鍵 heartbeat・on か off）を出す。停止の切り替えの button は出さない（書く口は後の便）。
      右は稼働の記録（class strip・語の鍵 history）。幅は 24h・6h・3h の 3 つで、選びは URL の query の span に残す（無いか知らない値は 24h）。query の字から幅を読む関数と、幅を query の字に写す関数は純粋な関数にして（面の crate の frame の module の param と with_param を使う）、host の歯で測る。帯は SVG で、横の幅は 288、区間ごとに矩形を置く。矩形の左端は（区間の始まり − 窓の始まり）÷ 窓の長さ × 288、幅は区間の長さ ÷ 窓の長さ × 288（1 未満は 1）で、窓の外にはみ出す区間は窓の端で切る。窓の右端は電文の at。口座の移動は、その時刻の位置に縦線を置く。過去の時点を見るつまみは後の便が足す。
      下段（class olow）。登録の口座（語の鍵 reg_account）と群の名（語の鍵 group）を出す。窓ごとの割合（class usage と wrow と meter・段の名の語の鍵 allowance）は、窓の名（語の鍵は window の字と同じ five_hour・seven_day・seven_day_model）・棒・使った割合・戻るまでの字（戻る時刻 − at を、60 分未満は分の数と m、24 時間未満は時間の数と h、それ以上は日の数と d・戻る時刻が無ければ「―」）。棒の class は、割合が 100 以上なら w100、80 を超えれば w80。数えない窓（counted が偽）は薄く出す。
      状態の帯は平時には出さない。出すのは 2 つの場合で、状態が limit のときは「限度で止まっている」、登録の口座が群の今の口座（語の鍵 current_account）と違うときは「移動待ち」と 2 つの口座の名。群の次の移り先が在れば、その名も出す。帯の字（限度で止まっている・移動待ち・次の移り先）と「詳しく」の字は、見出しでない本文の字なので、語の辞書の鍵を使わずに module の定数に置く。
      口座の履歴は畳める段（class fold ahistd・語の鍵 acct_hist）で、最初は閉じている。見出しに件数、中は新しい順。「詳しく」（class gmore）の中に、席の名と、群の今の口座と登録の口座が同じかの印を出す。
      電文の中の「まだ分からない」の部分は、その部分だけ測れていないの記号を出し、読めた部分は出す（0 や空の字で埋めない）。口が読めないとき・まだ読んでいないとき・本文が電文の型として読めないときは、block の全体が測れていないの印と理由の 1 行になる（要件 NFR2）。
      在りか。この便が使う語の鍵は 19 個で、全部が語の辞書に在る（orch_acct・since・tick_health・heartbeat・history・span・reg_account・group・current_account・acct_hist・allowance・five_hour・seven_day・seven_day_model・st_run・st_wait・st_limit・st_silent・st_unknown）。面の crate は契約の型の crate に依存している（crates/tsuzuri-surface/Cargo.toml の dependencies の tsuzuri-contract・着地済み）ので、Cargo.toml は触らない。block を描く関数（seat の module の view・引数なし）は頁（board の module）から今の引数のまま呼ばれる。口の読みは view の中で、面の crate の net の read に口の path の定数 PATHを渡して得る（便 g-parts の着地でこの形になっている）。頁の側（board）は触らない。語の辞書（crates/tsuzuri-surface/vocab.json）と stylesheet（crates/tsuzuri-surface/style.css）は着地済みで、この便は触らない。class の名は見本の字のまま使い、語の鍵は語の辞書に在るものだけを使う。測れていないの印と理由の 1 行は、面の crate の project の module の部品（Body の Unmeasured・unmeasured・語の鍵 st_unknown）を使う。状態の記号の部品（state_icon・state_class・state_key）は面の crate の project の module に着地済み。
      着地済みの関数の外形は変えない。変えないのは、BLOCK の値・口の path の定数・読みの結果を受けて Body<()> を返す関数（body）の名と引数と返りの型。枠の歯（tests/frame.rs）はこの関数を呼んでいて、この便の write-set の外に在るので、そのまま通す。中身を返す関数は別の名で足す。字と座標の関数は純粋な関数にして host の cargo test で pin し、DOM は wasm の target のときだけ組み立てる。
  - n: 16
    type: prose
    title: 便 g-ask — 問いの頁と問いの card
    body: |
      持ち主が問いを読んで答える頁を置く。見本は docs/design/mock3/ask.html の qcard と、これまでの決定の段。束の承認と方針の欄（見本の右の列）は後の便が足すので、この便は出さない。
      data は口 /api/questions から読む（契約の型の QuestionList・便 b-cards の着地 3a453c2 で契約の型の crate の question の module に在る）。答えは口 /api/ruling へ POST で送る（server の口は便 e-ask が足す。着地までは口が読めないので、画面は測れていないを出す）。これまでの決定（block hist）は畳める段で、最初は閉じていて、見出しに件数を出す（見本の ask.html の hist と同じ）。中は台帳の一覧（/api/ledger・着地済み）から、label intake:question を持つ closed の bead を id の自然な順（数は数として比べる）に出す。台帳の一覧の 1 行（契約の型の LedgerRow）は labels の欄と、問いの label を見る関数（is_question）を持つ（着地済み）。
      電文の形。QuestionCard の欄は、id・title・posted_at・plain（非エンジニア向けの概要）・eng（エンジニア向けの概要）・reason（理由）・recommend（推奨）・a1（A-1 の印）・touches（名指した節点の id の列）・digest（見た版の要約値）。plain・eng・reason・recommend は無いことが在る。QuestionList の欄は cards（読めた card の列か「まだ分からない」）。要求は RulingRequest（question・seen_digest・verbatim）、応答は RulingResponse（ruling・recorded_at）、断りの応答は理由（Refusal の閉じた 6 値）を持つ。この 3 つの型は契約の型の crate の面の module（src/surface.rs）に着地済み（便 b）で、この便は契約の型の crate を触らない。
      頁の枠を見本（docs/design/mock3/index.html と ask.html）に揃える。頁を 1 つ足す。頁の id は ask で、URL の query の page=ask で開き、頁の題の語の鍵は questions。頁の順は home・ask・map で、header の頁の link もこの順に 3 つになる（見本の header は ホーム・質問・地図 の順）。質問の link には open の問いの数の印（class badge）を付け、数が読めないときと 0 のときは印を出さない。
      問いの頁の block は 2 つで、id は ask（見出しの語の鍵 ask_open・問いの card の列・module は着地済みの ask）と hist（見出しの語の鍵 rulings・これまでの決定・畳める段・module は新しい askpage）。home の頁からは block ask を外す。home の block の並びは見本と同じにして、左の列が next・pipe・ledger・legend、右の列が orch。頁の枠の値と snapshot の file と枠の歯（頁の block の並び・block と module の対応の表・project の下の file の数）を、この形に直す。
      card（class qcard）の部分の順は、題・概要・理由・推奨・答えの欄・つながり。頭（class head）に、番号・題（36 字で切る）・A-1 の印（語の鍵 a1・印を持つ card だけ）・置かれてからの経過。概要（class qsum）は 2 行で、非エンジニア向け（語の鍵 summary_plain）とエンジニア向け（語の鍵 summary_eng）。片方だけ無ければ「―」、両方無ければ「要約なし」の 1 行。理由（class qreason・語の鍵 reason）はつねに出す。推奨（class rec・語の鍵 recommend）。答えの欄（class answer）は、字の欄（語の鍵 own_words）と送る button（語の鍵 ruling）。つながり（語の鍵 around）は畳める段で、最初は閉じていて、見出しに名指した節点の数（語の鍵 touches）を出し、中は節点の id の一覧（近傍の図は後の便）。
      送る。button は、答えの欄が空白だけのときと、送っている間は押せない。字の変換の途中（IME）の Enter は何もしない。Ctrl か Meta と Enter で送る。要求の見た版の要約値には、card の digest の字をそのまま入れる。応答が 200 なら、card に記録した id と時刻を出し、答えの欄を閉じ、問いの一覧を読み直す。409 なら「質問が更新された」と出して一覧を読み直し、答えの欄の字は残す。ほかの 4xx と 5xx と届かないときは、理由の字（断りの応答の理由か、状態の数）を出し、答えの欄の字は残す。持ち主の字は、送る要求の本文の外には書かない（URL にも、画面の外の保存の口にも残さない。歯は module の code に localStorage・sessionStorage・cookie の字が無いことを見る）。
      module ask は、台帳の一覧の読みをやめて、口 /api/questions の card を古い順に番号つきで出す問いの頁の block にする。見出しの横の件数の chip はそのまま。問いの見分けは server の側（label intake:question）に寄せ、面は bd の種類で選ばない。block「次の一手」の質問の行（着地済み）から問いの頁へ入れるよう、頁の link の関数（frame の href）に問いの頁を足す。
      読めて 0 本なら 0 件の 1 行を出す。口が読めないとき・まだ読んでいないとき・本文が電文の型として読めないときは、0 件でなく測れていないの印と理由の 1 行を出す（要件 NFR2）。
      通信の module に、本文つきの POST を送って状態の数と本文の字を返す関数を 1 つ足す（面の crate の net・着地済みの読みの関数は変えない）。
      着地済みの歯との関係。module ask の今の関数（画面の状態を受ける count と body）は、着地済みの歯の file（tests/frame.rs・tests/board_min.rs・tests/parts.rs）が呼んでいる。この便は module ask の読みの出所を変えるので、3 つの歯の file のうち module ask を呼ぶ所を新しい関数に合わせて直す（3 つとも write-set に在る）。台帳の一覧の並べ方の関数（view の module）と、その歯は変えない。
      在りか。この便が使う語の鍵は 12 個で、全部が語の辞書に在る（questions・ask_open・rulings・reason・recommend・own_words・ruling・around・touches・summary_plain・summary_eng・a1）。送った後の card の字（記録した・質問が更新された・理由の字）と「要約なし」は、見出しでない本文の字なので、語の辞書の鍵を使わずに module の定数に置く。面の crate は契約の型の crate に依存している（crates/tsuzuri-surface/Cargo.toml の dependencies の tsuzuri-contract・着地済み）ので、Cargo.toml は触らない。web-sys の feature（Request・RequestInit・Headers・HtmlTextAreaElement・KeyboardEvent）は便 g-parts が足してある。語の辞書（crates/tsuzuri-surface/vocab.json）と stylesheet（crates/tsuzuri-surface/style.css）は着地済みで、この便は触らない。class の名は見本の字のまま使い、語の鍵は語の辞書に在るものだけを使う。測れていないの印と理由の 1 行は、面の crate の project の module の部品（Body の Unmeasured・unmeasured・語の鍵 st_unknown）を使う。頁の枠の値と頁の id の型は面の crate の frame の module、頁を描く所と block から module を選ぶ所は board の module、block の共通の部品は project の module に着地済み。枠の歯と snapshot は crates/tsuzuri-surface/tests/frame.rs と tests/snapshots/frame.json。stylesheet に規則が在る class は、qcard・head・nb・t・warn・chip・num・qsum・ln・eng・qreason・rec・answer・btn・primary・fold・panel・items・muted・ask・stack・badge（header の質問の link の数の印・規則は「.nav .badge」）。A-1 の印は class warn、置かれてからの経過は class chip と num。見本が規則を持たない目印の class（plain・send・nb-d・nb-body）は、見本と同じ名で付けてよい（枠の歯が stylesheet と照らすのは、頁の枠の値が持つ class だけで、この便が枠の値に足す class は badge と、着地済みの panel・stack・fold だけ）。
      fixture はこの便が 2 つ作る。question-list.json は問いの一覧の電文（QuestionList）で、card を 2 本持つ（1 本は概要と理由と推奨と A-1 の印と touches を持ち、1 本は概要を持たない）。ledger-questions.json は台帳の一覧の電文（LedgerList）で、label intake:question を持つ closed の bead を 3 本（id の数が 2・10・9 の順に並ぶ）と、label を持たない closed の bead を 1 本と、label intake:question を持つ open の bead を 1 本持つ。これまでの決定の歯はこの fixture を読み、3 本が id の数の順（2・9・10）に並ぶことを見る。fixture は 2 つとも 5000 byte 以下にする。
      測り方。card の部分の並びと、段が最初に開いているかは、純粋な関数の値（配置の表）にして host の歯で pin し、DOM はこの値を順にたどって組み立てる。card の中身・送る button の状態・鍵の判定（変換の途中か・Ctrl か Meta が押されているか・鍵の名を受けて、何もしない・送る・送らないを返す）・要求の本文を組む関数・応答から card の状態を決める関数・これまでの決定を選んで並べる関数・header の数の印の関数は、どれも純粋な関数にして host の cargo test で pin する。DOM と通信は wasm の target のときだけ組み立てる。

  - n: 17
    type: prose
    title: 便 g-gaps — 抜けの検査の頁
    body: |
      不変条件の 12 本の判定を 1 つの頁で見せる。見本は docs/design/mock3/gaps.html。数え方は中核の crate が済ませていて、面は電文を写すだけにする（面の code に判定の分岐を書かない）。
      data は口 /api/graph から読む（契約の型の GraphDoc・着地済み）。使う欄は invariants で、1 行（InvariantCheck）の欄は id（g-1 から g-12）・verdict（閉じた 3 値で、字は pass・violation・unknown）・violations（違反の数）・ids（違反の節点の id の列）。読みは面の crate の net の read を使う。
      頁の枠。頁を 1 つ足す。頁の id は gaps で、URL の query の page=gaps で開き、頁の題の語の鍵は gaps。頁の順は home・ask・map・gaps で、header の頁の link もこの順に 4 つになる（見本の header と同じ）。block は 1 つで、id は gaps（見出しの語の鍵 gaps）。中身は新しい module（project の下の gaps）に置く。頁の枠の値と snapshot の file と枠の歯（頁の順・block と module の対応の表・project の下の file の数）に、この頁と block を足す。この便は便 g-ask（頁の枠を直す便）の着地の後に起こす。問いの頁の歯の file（tests/askcard.rs・便 g-ask の着地）は、頁の枠の値（頁の数と順）を見る歯を持つので write-set に入れ、頁が 4 つになる所だけを直す。今の頁の枠（便 g-ask の着地 040bb05）は、頁の id の型 PageId が Home・Ask・Map の 3 値で、ALL の定数と頁の一覧の関数（pages）がこの順に 3 つを持つ。この便は 4 つ目に Gaps を足す。
      数の札（class gtiles と gtile）は 3 枚で、順は違反・まだ分からない・合格。1 枚は記号（class gi と、違反は ng・まだ分からないは unknown・合格は ok）と数と語（語の鍵は gap_ng・gap_unknown・gap_ok）。記号の字は、違反が「✕」、まだ分からないが「?」、合格が「✓」。
      一覧は 12 行で、順は違反・まだ分からない・合格、同じ判定の中は id の数の順。1 行は畳める段（class gitem）で、違反の行だけが最初は開いている。見出しに記号と名と違反の数（0 なら出さない）。中は、違反の節点の id の一覧（class items）を 20 件まで出し、超える分は残りの数の 1 行にする。
      12 本の名は、module の定数の表に置く（見本の字・本文の字なので語の辞書の鍵を使わない）。g-1 は「線の両端が実在する」、g-2 は「open の task は design-note の行を 1 つ指す」、g-3 は「発効した ADR と rule に、あなたの決定が結ばれている」、g-4 は「question は関わる所を 1 つ以上持つ」、g-5 は「迷子の項目がない（全部が epic から辿れる）」、g-6 は「blocks の線が輪になっていない」、g-7 は「宙に浮いたあなたの決定がない」、g-8 は「台帳の種類の約束を守っている」、g-9 は「題で名指した項目に線が引かれている」、g-10 は「番号の形が重ならない」、g-11 は「run はどれも 1 つの task に属する」、g-12 は「止まった run の question が記録にある」。電文に在って表に無い id の行は、id の字を名の代わりに出す。
      口が読めないとき・まだ読んでいないとき・本文が電文の型として読めないときは、合格と出さず、測れていないの印と理由の 1 行を出す（要件 NFR2）。
      測り方。札の数・一覧の並び・段が最初に開いているか・名の表・20 件の切り方は、純粋な関数の値にして host の cargo test で pin し、DOM はこの値を順にたどって組み立てる。DOM は wasm の target のときだけ組み立てる。fixture の invariants.json は 12 本の判定（違反 2 本・まだ分からない 3 本・合格 7 本・うち 1 本は違反の id を 25 個持つ）で、5000 byte 以下にする。
      在りか。面の crate は契約の型の crate に依存している（Cargo.toml は触らない）。GraphDoc と InvariantCheck と Verdict は契約の型の crate の graph の module に着地済み。頁の枠の値と頁の id の型は面の crate の frame の module、頁を描く所と block から module を選ぶ所は board の module、block の共通の部品と module の宣言は project の module に在る。語の鍵 gaps・gap_ok・gap_ng・gap_unknown・st_unknown は語の辞書に在る。class の gtiles・gtile・gi・ok・ng・unknown・n・gitem・ttl・aside・body・items・panel は stylesheet に規則が在る。語の辞書と stylesheet は触らない。

  - n: 18
    type: prose
    title: 便 g-ledger-fix — 指標の段が口の本文の形を読む
    body: |
      便 g-ledger の着地（e7f9754）の後、実物の画面で指標の段が測れていないのままになった。口 /api/metrics の本文は、指標（LedgerStats）そのものでなく、読めたか「まだ分からない」かの型（契約の型の crate の板の module の Reading）で包んだ形で、着地した code は包みを読まずに指標そのものとして読んでいた。便 g-ledger の節の字（口の本文は、読めた LedgerStats か「まだ分からない」）が形を書いていなかったのが原因で、この便で直す。
      口の本文の形。読めたときは、鍵 known の下に LedgerStats の object を持つ object。読めないときは、字 unknown（JSON の文字列）。この形は Reading の serde の形（鍵は小文字）で、server は Reading の値を電文にして返している（境界の crate の板の module の metrics・便 e-read の着地 fb8053f）。
      直し方。指標を読む関数（面の crate の project の下の ledger の module の stats・引数は読みの結果）は、本文を Reading の LedgerStats として読む。known なら指標を返す。unknown なら、台帳が読めない理由の 1 行を返す。理由の字は module の定数に置き（本文の字なので語の辞書の鍵を使わない）、口が読めないときの理由（METRICS_REASON）とも、電文の型として読めないときの理由（project の module の NO_CONTENT）とも違う字にする。読めない本文（known も unknown も持たない）は今と同じ理由を返す。
      実物の本文の写し。設計席が、動いている server の口の本文をそのまま写した file を置いた（tests/fixtures/surface/metrics-body.json・この便の write-set の外で、読むだけ）。歯はこの file を読みの結果として渡し、指標の段が中身を返すことと、open の task の数が写しの中の数と同じことを見る。着地済みの fixture（ledger-stats.json・指標そのものの形の 2 組）は変えず、着地済みの歯は、fixture の指標を known の鍵で包んだ字にしてから渡す形に直す。
      在りか。Reading は契約の型の crate の板の module（crates/tsuzuri-contract/src/board.rs）、LedgerStats は stats の module、電文を読む関数は契約の型の crate の wire の decode。面の crate は契約の型の crate に依存している（Cargo.toml は触らない）。指標の段の関数（stats・metrics・content）を呼ぶ歯は crates/tsuzuri-surface/tests/ledgerblock.rs だけ（枠の歯は呼ばない）。
      依存は足さない。

  - n: 19
    type: prose
    title: 便 g-graph — 地図のグラフの面
    body: |
      地図の 3 つ目の面（グラフ）を置く。見本は docs/design/mock3/map.html の graph と initZoom、docs/design/mock3/ui.js の nodeBox・edgeSVG・legendHTML・hlCompute・hlPin。選ぶ・畳む・数える・段を決めるのは中核の crate が済ませていて（便 c-view の着地 41b138a）、画面は電文の値を写して座標を決めるだけにする。画面の code に、節点を選ぶ分岐と数え直しを書かない。
      data は口 /api/graph/view から読む（契約の型の GraphView・口は後の便 e-view が足す。着地までは口が読めないので、実物の画面は測れていないを出す）。口の本文は GraphView の object そのもので、包みは無い。GraphView の欄は、nodes（出す節点の列）・edges（まとめた辺の列）・shown・folded・cut・total・unread（読めなかった出所の列）。節点 ViewNode の欄は、node（GraphNode・欄は id・kind・file・digest・title）・status（bead の状態の字か走行の段の字・無いことが在る）・rank（段・0 が根拠の側の端）・kids（畳まれた子の数）・degree（次数）。辺 ViewEdge の欄は、from（影響の側の節点の id）・to（根拠の側の節点の id）・type（辺の型）・count（まとめた本数）。読みは面の crate の net の read を、グラフの module の中で呼ぶ（口の path の定数をグラフの module に置く）。着地済みの口の path の歯（crates/tsuzuri-surface/tests/parts.rs の parts_paths_distinct_in_block_modules）は、口の path の定数 8 本の一覧を持ち、src の中の /api/ で始まる字が、その 8 本は project の下の module に 1 度ずつ、ほかは変化の知らせの口だけであることを見る。この便はこの歯を直し、一覧の 9 本目にグラフの module の口の path の定数を足し、その字だけは mapview の下のグラフの module の file に在ってよいとする（ほかの 8 本の決まりは変えない）。
      地図の module（project の下の map）は、グラフの面を選んだときに呼ぶ関数を、グラフの module の新しい関数（view・引数は URL の query の signal）に替える。変えるのはその 1 か所だけ。グラフの module の今の関数 body（引数なし・測れていないを返す）は消し、それを呼ぶ着地済みの歯（tests/mapview.rs の mapview_graph_and_around_are_unmeasured）は、近傍の module の分だけを見る形に直す。
      配置は純粋な関数の値にして host の歯で pin する（DOM の性質で測らない）。定数は見本の値で、節点の箱の幅 176・高さ 40、段の間 36、箱の縦の間 6、1 列の箱の数 8、帯の名の幅 116、上の余白 8、行の余白 10、列の間 8、節点の無い帯の高さ 44、節点の無い beads の行の高さ 28。帯は 7 つを全部、帯の順（constitution・rules・ADR・SRS・design-note・beads・pipeline）に上から置く。beads の帯は種類の 7 行（epic・task・memo・question・ruling・receipt・policy の順）に分ける。帯と種類の対応は着地済みの表（mapview の band の module の band_of と BEADS_LANES）を使う。
      升は、帯と行と段の 3 つで決まる。升の中の節点は id の自然な順（契約の型の crate の graph の module の natural_cmp）。段の列の数は、その段の升のうち最も多い節点の数を 8 で割って切り上げた数（最小 1）。段の x は、最初の段が 116 で、次の段は前の段の x に、前の段の列の数に 184 を掛けた値と 36 を足した値。図の幅は、最後の段の右端に 8 を足した値（最後の段の x に、列の数に 184 を掛けた値を足し、8 を足す）。行の高さは、その行の升のうち最も多い節点の数（8 まで）に 46 を掛けて 20 を足した値（節点が無い行は 1 個ぶん）。ただし beads の帯の節点の無い行は 28。節点が 1 つも無い帯は高さ 44。帯の上端は上の余白 8 から順に積む。図の高さは、最後の帯の下端に 4 を足した値。箱の左上は、x が段の x に、升の中の番号（0 から）を 8 で割った商に 184 を掛けた値を足した値、y が行の上端に 10 を足し、番号を 8 で割った余りに 46 を掛けた値を足した値。節点が 1 つも無い眺めは段が無いので、幅は 300（帯の名の幅 116 に箱の幅 176 と 8 を足した値）、高さは 320（8 に 44 の 7 つぶんを足し、4 を足した値）。
      例のグラフの配置の表（fixture の眺め）。段の x は、段 0 が 116、1 が 336、2 が 556、3 が 776、4 が 996、5 が 1216。幅 1408、高さ 658。帯の上端と高さは、constitution が 8 と 66、rules が 74 と 66、ADR が 140 と 66、SRS が 206 と 66、design-note が 272 と 44、beads が 316 と 272、pipeline が 588 と 66。beads の行の上端と高さは、epic が 316 と 66、task が 382 と 66、memo が 448 と 28、question が 476 と 28、ruling が 504 と 28、receipt が 532 と 28、policy が 560 と 28。箱の左上は、P-1 が 116 と 18、R-1 が 336 と 84、ADR-1 が 336 と 150、FR1 が 556 と 216、AC1 が 776 と 216、e が 776 と 326、e.1 が 996 と 392、走行が 1216 と 598。
      fixture の graph-view.json は、この便が作る。中身は便 c-view の節（設計ノート surface-base の 15 節）の例のグラフの眺めで、出す節点は 8 個（id・種類・段・子の数・次数の順に、P-1 は条・0・2・5、R-1 は規則行・1・0・1、FR1 は要件・2・0・4、AC1 は受入基準・3・0・1、ADR-1 は判断の記録・1・0・2、e は epic・3・2・2、e.1 は task・4・0・2、e.1-20260927T000000Z は走行・5・0・1）。辺は 10 本で、どれも本数 1（AC1 から FR1 の verify.ac、AC1 から FR1 の verifies、ADR-1 から P-1 の basis、FR1 から ADR-1 の adrs、FR1 から P-1 の basis、R-1 から P-1 の relations.rules、R-1 から P-1 の article、e から FR1 の touches、e.1 から e の parent-child、走行から e.1 の run_of）。shown 8・folded 4・cut 1・total 13・unread は空。bead の節点の status は open、走行の status は Landed、ほかは無し。題は短い見本の字。歯は file を契約の型の GraphView として読む（読めなければ落ちる）。fixture は 5000 byte 以下にする。
      線。線は辺の from の箱の左の辺の中点から、to の箱の右の辺の中点へ引く（根拠の側が左）。道は 3 次の曲線で、2 つの制御点の x は両端の x の中点、y はそれぞれの端の y。道の字は「M x1 y1 C mx y1, mx y2, x2 y2」の形（数は小数点の無い整数ならそのまま）。例のグラフの FR1 から P-1 の辺は、x1 が 556、y1 が 236、x2 が 292、y2 が 38、mx が 424 で、字は「M556 236 C 424 236, 424 38, 292 38」。線の形は辺の型から決める閉じた表で、bold（太い・止まりの色）は blocks、dotted（点線）は in-article・article・parent-child・run_of・ran_by、arrow（矢印つき）は amends、solid（実線）はほかの全部。見た目の値（色と太さ）は見本の edgeSVG と同じにする。
      節点の箱（見本の nodeBox）。囲みは 1 種（角の丸い四角）。頭の記号の形は 2 種で、file に書かれた行（constitution・rules・ADR・SRS・design-note の帯）は四角、台帳と走行（beads と pipeline の帯）は丸。色は帯。縁は状態だけで、open の question は止まりの色の縁と塗らない記号、固定した節点は太い縁、閉じた bead と終わった走行（status が closed の bead）は id と題を薄い字にする。1 行目は id を全部、2 行目は題を 12 字で切る。子を持つ節点は右上に子の数の札（語の鍵 children の字と数）を出す。箱は link にしない（節点の頁は後の便）。
      拡大と移動（見本の initZoom）。値の計算は純粋な関数にして host の歯で pin し、事件の受け取りと DOM の書き換えは wasm の target のときだけ組み立てる。最初の倍率は、箱の幅から 116 を引いた値を、図の幅から 116 を引いた値で割った値（1 より大きくしない）。箱の高さは、図の高さに最初の倍率を掛けて 8 を足した値を、360 から 720 の間に収めて整数に丸めた値。例は、箱の幅 1000 と図の幅 1408 と高さ 658 で、最初の倍率が 884 を 1292 で割った値（0.6842 に丸まる）、箱の高さが 458。wheel は、倍率に e の（wheel の縦の量に -0.0015 を掛けた値）乗を掛け、0.2 から 4 の間に収め、pointer の下の点が動かないように移動の量を決める。drag は移動の量に pointer の動いた量を足す。元に戻す button（語の鍵 zoom_reset）は最初の倍率と移動 0 に戻す。使い方の 1 行（語の鍵 zoom_hint）を button の横に出す。transform の字は「translate(a b) scale(s) translate(-116 0)」の形で、a は 116 に横の移動を足した値を小数 2 桁、b は縦の移動を小数 2 桁、s は倍率を小数 4 桁。例は、倍率 0.5・横の移動 10・縦の移動 -4 で「translate(126.00 -4.00) scale(0.5000) translate(-116 0)」。帯の名は図の左端に固定し、拡大と移動に合わせて縦の位置と高さだけを変える。2 本指の拡大はこの便では作らない。
      hover で光らせる（見本の hlCompute）。節点に pointer か focus が乗ると、その節点から根拠の側と影響の側を各 2 段たどり、着いた節点と、その間の線を光らせ、ほかを薄くする。たどるのは図に出ている線だけ。次数（電文の degree）が 8 を超える節点は光らせるが、そこから先へは広げない。光る節点（中心を除く）が 20 を超えたら段を 1 に落としてたどり直し、それでも超えたら、着いた順の先頭の 20 個で切る（20 は規則の行 R-20 の値・8 は見本の値で module の定数に置く）。光る線は、たどった向きに沿う線だけ（見本の litE）。電文の辺は from が影響の側の端で to が根拠の側の端なので、to の端が根拠の側で from の端が根拠の側か中心の線と、from の端が影響の側で to の端が影響の側か中心の線が光る。往復する 2 本の線（例 FR1 から ADR-1 と ADR-1 から FR1）のうち、中心から見てたどった向きと逆の 1 本は、両端が光っていても光らない（その端の側を 2 つに見せないため）。関数は純粋で、入力は辺の列と次数の表と中心の id、返りは節点ごとの側（中心・根拠・影響）と、着いた順と、光る線の番号と、段。例のグラフの FR1 では、根拠の側が ADR-1 と P-1、影響の側が AC1 と e と e.1、光る線は 7 本（光らないのは R-1 から P-1 の 2 本と、走行から e.1 の 1 本）、段は 2。
      固定（見本の hlPin）。節点を押すと光り方を固定し、図の下の帯（class pinbar）に、語の鍵 pinned の字と節点の id、根拠の側の数（語の鍵 nb_up）、影響の側の数（語の鍵 nb_down）、段、外す button（語の鍵 unpin）を出す。同じ節点をもう一度押すか、外す button を押すか、Escape で外れる。別の節点を押すと、その節点に固定が移る。固定の間は hover で光り方を変えない。drag の後の pointer の離しは押したと数えない。固定の状態の移り方は純粋な関数（今の固定と、押した節点か Escape か外す button を受けて、次の固定を返す）にする。節点の頁への link（見本の open_node）は、頁がまだ無いので出さない。
      凡例（見本の legendHTML）。3 行で、1 行目は形と色と縁と hover の見方（語の鍵 lg_shape・lg_color・lg_border・lg_hover）、2 行目は図に出ている帯（節点を持つ帯だけ・帯の名と出所の path）、3 行目は図に出ている辺の型（線の見本と型の字）。型の字は電文の字をそのまま code の要素で出す。語の辞書に「e:」に型の字をつないだ鍵が在る型だけ、注釈の属性（data-term）を付ける（鍵が在るかは語の辞書の module の term で見る）。
      狭い幅の一覧（class nb-chain）。節点の在る帯ごとに、帯の chip（着地済みの band_chip）の小見出し（class subh）と、行の一覧（class items）。行は印と id と題（36 字で切る）で、子を持つ節点は右に子の数（class aside）。帯の中は段の小さい順、同じなら id の自然な順。
      数の行（class cutline と num）。字は「shown / total ・ 子 folded ・ ✂ cut」の形で、子は語の鍵 children の字。例は「8 / 13 ・ 子 4 ・ ✂ 1」。経験者の mode では、その下に 1 行「shown=8 folded=4 cut=1 total=13」を出す（60 字以下）。数は電文の欄の値をそのまま出す。
      読めなかった出所。電文の unread が名指す出所の帯（design は constitution・rules・ADR・SRS・design-note、ledger は beads、runs は pipeline・着地済みの band の module の source）は、帯の中に測れていないの印と理由の 1 行を出す。読めて節点の無い帯は、帯の中に 0 と出す（見本は「run 0」の形で、語は帯の語の鍵の字）。
      圧縮の面の並びの直し。着地済みの圧縮の面は、constitution の条の札と rules の札を電文の順に並べている。電文の順は字の順（P-1 の次が P-10）なので、実物の画面で条が番号の順に並ばない。どちらも id の自然な順に直す（圧縮の module の 2 か所）。着地済みの歯（tests/mapview.rs の mapview_compact_bands_and_tags_in_order）の期待を、条は A-2・N-1・P-1 の順、規則行は D-3・R-4・R-25 の順に直す。一覧の面の並べ替えの id も同じ決め方に直す（帯の順、次に、どの帯も id の自然な順・一覧の module の 1 か所）。着地済みの歯（mapview_list_filters_and_sorts）の期待も、この順に直す。
      在りか。GraphView と ViewNode と ViewEdge と natural_cmp は契約の型の crate の graph の module（便 c-view の着地 41b138a）。面の crate は契約の型の crate に依存している（Cargo.toml は触らない）。地図の頁と面の切り替えは project の下の map の module と mapview の module（便 g-map の着地 3602b56）で、グラフの面を選ぶ所は map の module の中の 1 か所。URL の query の読みと書き（param・set_param・current・navigate）と、帯の chip と、節点の印の class は mapview の入口の module に着地済み。測れていないの印と理由の 1 行は project の module の部品（unmeasured・NOT_READ・NO_CONTENT）。web-sys の feature（SvgElement・WheelEvent・PointerEvent・KeyboardEvent・DomRect）は便 g-parts が足してある。語の鍵 lines・zoom_reset・zoom_hint・children・cut・pinned・nb_up・nb_down・unpin・lg_shape・lg_color・lg_border・lg_hover・view_graph・st_unknown と、「b:」の 7 つは語の辞書に在る。「e:」の鍵は 30 個の型のうち 18 個だけが語の辞書に在る（無いのは relations.articles・relations.reqs・relations.sections・amended_by・refs・goals・rules・adrs・verify.ac・verifies・figures・produced）。stylesheet に規則が在る class は、gpanel・hlsvg・gtools・btn・sm・small・muted・gwrap・gzoom・pinbar・pinned・mono・nb-chain・cutline・num・legend・lkey・lk・wide・sw7・lane-sep・lane-lab・zero・node・nl・hit・e・lit・lit-up・lit-down・lit-self・hl-on・blab・subh・items・aside・path・panel。着地済みの歯（mapview_classes_and_keys_exist）は、mapview の下の module の code の class の字が stylesheet に規則を持つことを見るので、この一覧に無い class は付けない（見本の節点の id の字の class sid は規則が無いので付けない）。語の辞書と stylesheet は触らない。
      測り方。配置・線の道の字・線の形の表・拡大の値・transform の字・光らせる関数・固定の移り方・狭い幅の一覧の並び・数の行の字・凡例に出す帯と型は、どれも純粋な関数にして host の cargo test で pin する。DOM と事件の受け取りは wasm の target のときだけ組み立てる。新しい歯は新しい歯の file（mapgraph.rs）に置き、名を mapgraph_ で始める。
      依存は足さない。

  - n: 20
    type: prose
    title: 便 g-node — 節点の頁
    body: |
      節点 1 つの頁を置く。見本は docs/design/mock3/bead.html と、docs/design/mock3/ui.js の aroundBlock・svgAround・chainAround・nbK・nbFold。たどる・選ぶ・数えるのは中核の crate が済ませていて（便 c-view の着地 41b138a）、画面は電文の値を写して座標を決めるだけにする。
      data は口 /api/around から読む（契約の型の AroundDoc・口は便 e-view が足す。着地までは口が読めないので、実物の画面は測れていないを出す）。query は id（中心の節点の id・値は %XX にする）・k（段数・2 のときは付けない）・fold（畳み・畳みなしのときは付けない）。200 の本文は AroundDoc の object そのもの。節点が無い id は 404 で、本文は 1 語 no-node。AroundDoc の欄は、center・steps・fold・rows（出す行の列）・basis（畳みなしでたどったときの根拠の側の行の数）・impact（同じく影響の側の数）・shown・total・cut_hub・cut_cap・hubs（hub の id と次数の列）・unread。行 AroundRow の欄は、node（GraphNode・欄は id・kind・file・digest・title）・status（無いことが在る）・col（列・負が根拠の側・0 が中心・正が影響の側）・via（1 つ前の節点の id・中心は無し）・type（着いた辺の型・中心は無し）・degree（次数）。
      口の path は query の値で変わるので、着地済みの読みの関数（面の crate の net の read・引数は決まった字の path）は使えない。通信の module に、path を字の signal で受ける読みの関数を 1 つ足す（着地済みの関数は変えない）。口の path の頭の字（/api/around）は nodearound の module の定数に 1 度だけ置き、口の path を組む関数はこの定数から組む。着地済みの口の path の歯（crates/tsuzuri-surface/tests/parts.rs の parts_paths_distinct_in_block_modules・便 g-graph の後は 9 本の一覧）に、この定数を 10 本目として足す。変化の知らせの接続は頁に 1 本のまま（着地済みの歯 parts_reload_events_from_contract_constants が EventSource を張る所を 1 つと数える）で、新しい読みの関数は着地済みの接続を使う。path が変わったときと、変化の知らせが届いたときに読み直し、返りは、読みの結果（着地済みの 3 値）と、応答の状態の数（応答が無ければ無し）の組の signal。
      頁の枠。頁を 1 つ足す。頁の id は node で、URL の query の page=node と id=<節点の id> で開く。nav には出さない（見本の header は 4 つのまま）。頁の id の型に Node を足し、nav の順の定数（ALL・4 つ）と頁の一覧の関数（pages）は変えず、頁を id から返す関数（page）と query から頁を決める関数（from_query）と頁への link の関数（href）に Node を足す。節点の頁への link の字を組む関数（引数は節点の id と mode・返りは「?page=node&id=<%XX にした id>&mode=<mode>」）を frame の module に足す。block は 2 つで、id は node（見出しの語の鍵 summary_plain・class stack・module は新しい node）と around（見出しの語の鍵 around・class panel・module は新しい nodearound）。頁の枠の値と snapshot の file と枠の歯（block と module の対応の表・project の下の file の数）に、この頁と 2 つの block を足す。枠の歯の語（frame_）の字を持つ歯の file（tests/askcard.rs と tests/gapspage.rs）は write-set に入れるが、中身は変えない（nav の 4 つは変わらない）。
      block node（見本の頭と 2 面の概要）。頭（class nhead）は、節点の印・種類の見出し（語の鍵は「k:」に種類の名をつないだ鍵・着地済みの band の module の kind_key）・帯の chip・状態の字（bead は状態の字・走行は段の字・ほかは出さない）・id（class cid）・題（class t・36 字で切る）・出所の行（class srcline・語の鍵 src・字は電文の file・無ければ「出所なし」）。中心が open の question のときだけ、質問の頁への link（語の鍵 answer_here・class btn sm primary）を出す。概要（class two）は 2 つの箱（class sumbox）で、見出しの語の鍵は summary_plain と summary_eng。電文に要約の欄がまだ無いので、どちらも「要約なし」の字と class none を出す。頭と概要は、電文の rows のうち col が 0 の行から組む。
      block around（見本の aroundBlock）。上から、操作の行（class nbctl）・凡例・図（class nb-graph）・固定の帯（class pinbar）・狭い幅の一覧（class nb-chain）・数の行（class cutline）。
      操作の行。根拠の側の畳みの button（class btn sm nbside・語の鍵 nb_up・字は開いていれば「▾」、畳んでいれば「▸」と、語と、電文の basis の数）、中心の語（語の鍵 nb_self）、影響の側の畳みの button（語の鍵 nb_down・数は電文の impact）、段数の切り替え（語の鍵 nb_k・class seg・1 と 2 と 3 の button）。押すと URL の query を置き換え（履歴に積まない）、新しい query で口を読み直す。
      図の配置（見本の svgAround）は純粋な関数の値にして host の歯で pin する。列は、-3 から 3 のうち、0 と、行を持つ列だけ。列の幅は、1100 を列の数で割って切り捨てた値を、168 から 300 の間に収めた値。箱の幅は列の幅から 20 を引いた値、箱の高さは 40。題の字数は、箱の幅から 16 を引いた値を 12.5 で割って切り捨てた値。帯の名の幅は 128、上の余白（列の見出しの行）は 28。図の幅は 128 に、列の数に列の幅を掛けた値を足した値。帯は、行を持つ帯だけを帯の順に置く。beads の帯は種類の 7 行に分け、行の高さは、その行の升のうち最も多い節点の数に 48 を掛けて 12 を足した値、節点の無い行は 18。beads でない帯の高さは、最も多い節点の数（最小 1）に 48 を掛けて 12 を足した値と、44 の大きいほう。図の高さは最後の帯の下端に 4 を足した値。箱の左上は、x が 128 に、列の番号（左から 0）に列の幅を掛けた値と 10 を足した値、y が行の上端に 6 を足し、升の中の番号に 48 を掛けた値を足した値。升の中の並びは電文の rows の順。列の見出しの語の鍵は、-3 から順に nb_up3・nb_up2・nb_up・nb_self・nb_down・nb_down2・nb_down3。
      fixture の around-doc.json は、この便が作る。中身は便 c-view の節（設計ノート surface-base の 15 節）の例のグラフの近傍（中心 FR1・段数 2・畳みなし）で、出す行は 6 つ（P-1 は条・列 -1・FR1 から・basis、ADR-1 は判断の記録・列 -1・FR1 から・adrs、FR1 は要件・列 0、AC1 は受入基準・列 1・FR1 から・verifies、e.2 は question・列 1・FR1 から・touches・状態は open、e.2:20260927T0000Z-1 は ruling・列 2・e.2 から・answers）。basis 2・impact 3・shown 6・total 6・cut_hub 0・cut_cap 0・hubs は空・unread は空。FR1 の file は srs.yaml、P-1 の file は constitution.yaml、ADR-1 の file は adr/ADR-1.yaml、台帳の節点の file は無し。歯は file を契約の型の AroundDoc として読む。fixture は 5000 byte 以下にする。
      fixture の図の配置の表。列は -1・0・1・2 の 4 つ、列の幅 275、箱の幅 255、題の字数 19、図の幅 1228、高さ 422。帯の上端と高さは、constitution が 28 と 60、ADR が 88 と 60、SRS が 148 と 60、beads が 208 と 210。beads の行の上端と高さは、epic が 208 と 18、task が 226 と 18、memo が 244 と 18、question が 262 と 60、ruling が 322 と 60、receipt が 382 と 18、policy が 400 と 18。箱の左上は、P-1 が 138 と 34、ADR-1 が 138 と 94、FR1 が 413 と 154、AC1 が 688 と 154、e.2 が 688 と 268、ruling が 963 と 328。
      線は、1 つ前の節点（via）の箱から、着いた節点の箱へ引く。着いた節点が右に在れば、1 つ前の箱の右の辺の中点から着いた箱の左の辺の中点へ、左に在れば、1 つ前の箱の左の辺の中点から着いた箱の右の辺の中点へ、同じ列なら両方の箱の横の中点どうしを結ぶ。道の字と線の形の表は、便 g-graph のグラフの module の関数を使う（同じ決め方）。例は FR1 から P-1 の線で、始まりが 413 と 174、終わりが 393 と 54、制御点の x が 403 で、字は「M413 174 C 403 174, 403 54, 393 54」。節点の箱・凡例・hover で光らせる関数・固定の帯も、グラフの module の関数を使う（光らせる線の根拠の側の端は、col の絶対値が小さいほうが中心に近いので、根拠の側の行では着いた節点、影響の側の行では 1 つ前の節点）。中心の箱は太い縁にする。
      狭い幅の一覧（見本の chainAround）。根拠の側（語の鍵 nb_up）と影響の側（語の鍵 nb_down）の 2 段。1 段目（中心の隣）の行の下に、その先の行を入れ子（class nest）で並べる。行は印と id と題と、右に辺の型の字。行の無い側は出さない。
      数の行。字は「shown / total」で、切った数（cut_hub と cut_cap の和）が 1 以上なら「 ・ ✂ 」と数を足す。経験者の mode では下に 1 行「shown=… total=… up=… down=… cut.hub=… cut.cap=…」（up と down は、畳んだ側が 0、畳んでいない側が電文の steps）。
      見つからないとき。URL に id が無いか空のときは、口を読まず、見つからないの見出し（語の鍵 not_found）を出す。口が 404 のときは、同じ見出しと、id の字を出す。読みの結果と状態の数の組から、頁の 4 つの状態（まだ読んでいない・見つからない・読めない・電文あり）を決める関数は純粋な関数にして、nodearound の module に置く（状態の数が 404 なら見つからない）。
      近傍の module（mapview の around）の今の関数 body（測れていないを返すだけ）は消し、図の配置と一覧の並びと数の行の字の純粋な関数をこの module に置く。それを呼ぶ着地済みの歯（tests/mapview.rs の mapview_graph_and_around_are_unmeasured・便 g-graph が近傍の分だけにした歯）は消す。
      在りか。AroundDoc と AroundRow と HubCut と Fold は契約の型の crate の graph の module（便 c-view の着地 41b138a）。帯と種類の対応と語の鍵は mapview の band の module、URL の query の読みと書きと %XX の関数は mapview の入口の module（param・set_param・encode・current・navigate）、節点の箱と線と凡例と光らせる関数と固定はグラフの module（便 g-graph の着地の後）。測れていないの部品は project の module。読みの結果の型（Fetched）と、変化の知らせの名の一覧（RELOAD_EVENTS）は view の module、知らせの口の path（EVENTS_PATH）は通信の module。語の鍵 not_found・around・src・answer_here・summary_plain・summary_eng・nb_up・nb_down・nb_self・nb_up2・nb_up3・nb_down2・nb_down3・nb_k・cut・st_unknown は語の辞書に在る。stylesheet に規則が在る class は、nhead・kind・cid・t・srcline・sumbox・none・two・nb-wrap・nbctl・sides・nbside・arr・self・kseg・seg・nb-graph・nb-chain・nest・cutline・empty・pinbar・btn・sm・primary・panel・stack・items・aside。要約なしの字と出所なしの字は、見出しでない本文の字なので module の定数に置く。語の辞書と stylesheet は触らない。面の crate は契約の型の crate に依存している（Cargo.toml は触らない）。
      測り方。口の path の字・query の読みと書き・畳みの移り方・図の配置・線の端・頭の値・概要の値・畳みの button の数・数の行の字・狭い幅の一覧の並びは、どれも純粋な関数にして host の cargo test で pin する。DOM と通信は wasm の target のときだけ組み立てる。新しい歯は新しい歯の file（nodepage.rs）に置き、名を nodepage_ で始める。
      依存は足さない。

  - n: 21
    type: prose
    title: 便 g-steady — 読み直しで画面を崩さない
    body: |
      持ち主の指摘（2026-09-27）は、画面の更新のたびに全部一回消えて使いづらい。設計席の実測では、変化の知らせ（今は 16 秒ごとに届く）のたびに画面が口を全部読み直し、(a) server の読みが込み合って上限を越えた口が 10 秒ほど読めないになり block が測れていないに落ちる、(b) 本文が同じでも block の中身を全部組み直す、(c) 組み直しで畳める段（「詳しく」・口座の履歴・これまでの決定・抜けの検査の行・問いの card のつながり）が初めの開き閉じに戻る。(a) の元は server の便 e-coalesce が直す。この便は画面の側の (a) の受け方と (b) と (c) を直す。
      読みの後の決め方。通信の module の 1 つの口の読みの後で、signal に新しい値を置くかを、純粋な関数（view の module に置く・引数は今の値・新しい値・何回目の読みか・返りは閉じた 3 値で、置く・置かない・読み直す）で決める。決め方は上から順に当てる。新しい値が今の値と同じなら置かない（組み直さない）。新しい値が読めないで、今の値が本文で、1 回目なら読み直す（1 秒後にもう 1 回読む）。ほかは置く（今の値がまだ読んでいないで新しい値が読めないときは、1 回目でも置く）。2 回目の読めないは置く（測れていないを出す・要件 NFR2）。知らせが切れたときに全部の口を読めないにする所（lose_all）はこの関数を通さず、今までどおり置く。
      畳める段の開き閉じの記録。project の module に、鍵（字）ごとに開き閉じの値を 1 つ持つ記録を置く。初めて読む鍵は、呼び手が与えた初めの値を返す。details の要素は、開き閉じをこの記録から読み（prop の open に結ぶ）、toggle の event で今の開き閉じを記録へ書き戻す。記録は頁の一生の間だけ持ち、URL にも画面の外の保存の口にも書かない。記録の読み書きは純粋な部分（鍵と値の表）を host の歯で測り、signal と DOM は wasm の target のときだけ組み立てる。
      鍵の表（6 つの形）。台帳の「詳しく」は ledger:more。orchestrator と口座の口座の履歴は seat:hist、同じ block の「詳しく」は seat:more。これまでの決定は ask:hist。抜けの検査の行は gaps:<不変条件の id>（例 gaps:g-1）。問いの card のつながりは ask:around:<問いの id>。初めの値は今の code と同じにする（台帳の「詳しく」は経験者の mode なら開く・抜けの検査は違反の行だけ開く・ほかは閉じる）。台帳の「詳しく」は、記録に値が無いときだけ mode から初めの値を取り、持ち主が開き閉じを変えた後は mode を切り替えても記録の値を使う。
      在りか（着地済み）。読みの結果の型 Fetched（3 値・PartialEq を持つ）は view の module、口ごとの読みと知らせの接続と POST は通信の module（crates/tsuzuri-surface/src/net.rs・wasm の target のときだけ組み立てる・関数 load・reload_all・lose_all・read・post）。details の要素は、project の下の ledger（class gmore）・seat（class fold ahistd と gmore）・askpage（block hist）・gaps（class gitem）・ask（card のつながりの段）の 6 か所。mode は widgets の help の module の HelpCtx の mode と shows_internal で読む。面の crate は Cargo.toml を触らない（web-sys の Event と Element は便 g-parts が足してある）。
      測り方。読みの後の決め方と、開き閉じの記録の表は、host の cargo test で pin する。details の要素が記録を使うことは、歯が src の project の下の file の字を読んで、details の要素の数と、記録の関数を呼ぶ所の数が同じで、使う鍵の字が表の形に合うことで測る。新しい歯は新しい歯の file（steady.rs）に置き、名を steady_ で始める。
      依存は足さない。

  - n: 22
    type: prose
    title: 便 g-batch — 問いの頁の右の列
    body: |
      問いの頁の右の列に、まとめて承認の block と、全体への指示（方針）の block を置く。見本は docs/design/mock3/ask.html の side（id batch と id policy の 2 つの panel）。受ける口は server の便 e-batch が足す（POST /api/batch と POST /api/policy・着地までは送っても口が無いので、応答の出し方の通りに理由を出す）。
      頁の枠。問いの頁（frame の module の ask）を 2 列にする。左の列は今のまま（class stack・block は ask と hist）。右の列は class side stack で、block は batch（見出しの語の鍵 batch・class panel・module は新しい batch）と policy（見出しの語の鍵 policy・class panel・module は新しい policy）。頁を描く所（board の module）の block から module を選ぶ所に 2 つを足す。頁の枠の値と snapshot の file と枠の歯（block と module の対応の表・project の下の file の数）を直す。枠の歯の語（frame_）の字を持つ歯の file（tests/askcard.rs と tests/gapspage.rs と、便 g-node が足した tests/nodepage.rs）は、問いの頁の列の数を見る所だけを直す（その所が無い file は触らない）。
      data。2 つの block とも、問いの一覧を着地済みの口 /api/questions から読む（ask の module の PATH を net の read に渡す・同じ path の読みは 1 つの signal を分け合う）。電文の読みは ask の module の cards（着地済み）を使う。
      まとめて承認の block。行の一覧（class items）は、問いの一覧の順に 1 行ずつ、1 から始まる番号（class nb）と題（class ttl・契約の型の crate の graph の module の title36 で切る）。A-1 の印を持つ card の行は、選ぶ box の代わりに印（class gi ng と字「!」）と、A-1 の注の記号（class warn・語の鍵 a1）を持つ。ほかの行は選ぶ box（checkbox・aria-label は番号の字）を持ち、初めは選ばれている。2 つの chip は class metas row の行に置く。その下に 2 つの chip（class chip num）で、選んだ card の関わる所の数（語の鍵 touches・touches の和集合の数）と、重なりの数（2 つ以上の選んだ card が持つ touches の数・注の記号つき）。その下に逐語の欄（textarea・語の鍵 own_words を aria-label と placeholder に）と、送る button（class btn primary・字は語の鍵 batch）。
      束を送る。button は、逐語が空白だけか、選んだ card が 0 本か、送っている間は押せない。要求の本文は契約の型の BatchRequest で、items は選んだ card を一覧の順に、question は card の id、seen_digest は card の digest の字そのまま、verbatim は無し。束の verbatim は欄の字。POST は通信の module の post（着地済み）で /api/batch へ。応答の出し方。200 は本文を BatchResponse として読み、記録した（ask の module の RECORDED）と束の id と書いた行の数を出し、欄を空にして、口を全部読み直す（net の reload_all）。409 は質問が更新された（ask の module の STALE）を出して読み直し、欄の字を残す。502 で本文が BatchResponse として読めれば、送れなかった（REFUSED）と書いた行の数を出して読み直し、欄の字を残す。ほかの 4xx と 5xx は、本文が RefusalResponse なら理由の字（ask の module の refusal_text）、text なら状態の数と本文の字を出し、欄の字を残す。届かなければ口に届かない（NOT_REACHED）。
      全体への指示の block。範囲の切り替え（class seg・role group・aria-label は字「範囲」）は、字「この論点」と字「全体」の 2 つの button で、押した方が aria-pressed true。問いが 1 本以上在れば初めはこの論点が押されていて、問いが 0 本ならこの論点は押せず初めは全体。この論点が押されている間だけ、その下に問いの選び（select の要素・aria-label は字「論点」・項は問いの一覧の順の番号と 36 字に切った題・初めの項は 1 本目）を出す。その下に逐語の欄（textarea・aria-label は語の鍵 policy の字）と、送る button（class btn・字は語の鍵 policy）。範囲の字（範囲・この論点・全体・論点）と、送った後の本文の字（方針の memo が台帳に無い・範囲が今の問いでない）は、見出しでない本文の字なので module の定数に置く。
      指示を送る。button は、逐語が空白だけか送っている間は押せない。要求の本文は契約の型の PolicyRequest で、scope は全体なら字 all、この論点なら選んだ問いの id、verbatim は欄の字。POST は /api/policy へ。応答の出し方。200 は本文を PolicyResponse として読み、記録した と方針の id を出して欄を空にする（問いは閉じないので読み直さない）。400 で本文が text の scope なら範囲が今の問いでないを出して読み直し、503 で text の no-policy-memo なら方針の memo が台帳に無いを出し、どちらも欄の字を残す。ほかは束と同じ。
      入力の鍵。2 つの欄とも、ask の module の key_action（変換の途中か・Ctrl か Meta か・鍵の名を受けて、何もしない・送る・送らないを返す・着地済み）で決める。持ち主の字は、送る要求の本文の外に書かない（URL にも、画面の外の保存の口にも残さない）。
      口の path。2 つの口の path の定数（/api/batch と /api/policy）を、batch と policy の module に 1 つずつ置く。着地済みの口の path の歯（crates/tsuzuri-surface/tests/parts.rs の parts_paths_distinct_in_block_modules）は、口の path の定数の一覧を持ち、src の中の /api/ で始まる字の在りかを見る。この便は一覧に 2 本を足し、2 つの字は project の下の batch と policy の module に 1 度ずつ在るとする（ほかの決まりは変えない）。
      在りか（着地済み）。QuestionCard（欄は id・title・posted_at・plain・eng・reason・recommend・a1・touches・digest）と QuestionList は契約の型の crate の question の module。BatchRequest・BatchItem・BatchResponse・BatchItemResult・ItemOutcome・PolicyRequest・PolicyResponse・Refusal・RefusalResponse は契約の型の crate の面の module（src/surface.rs）。ask の module に、cards・key_action・KeyAction・refusal_text・RECORDED・STALE・NOT_REACHED・REFUSED・BAD_REPLY と、送る button の判定 can_send が在る。測れていないの部品は project の module。語の鍵 batch・policy・own_words・touches・a1・st_unknown は語の辞書に在る。stylesheet に規則が在る class は、side・stack・panel・items・metas・nb・ttl・gi・ng・warn・chip・num・btn・primary・row・seg。語の辞書と stylesheet は触らない。面の crate は Cargo.toml を触らない（web-sys の HtmlTextAreaElement と HtmlInputElement と KeyboardEvent は便 g-parts が足してある・select の要素の値は event の target の value で読む）。
      測り方。行の一覧・2 つの数・送る button の判定・要求の本文・応答の出し方・範囲の初めの値と問いの選びの項と scope の字は、どれも純粋な関数にして host の cargo test で pin する。DOM と通信は wasm の target のときだけ組み立てる。新しい歯は新しい歯の file（batchpanel.rs）に置き、名を batchpanel_ で始める。fixture は着地済みの question-list.json（card 2 本・1 本が A-1 の印を持つ）を使い、ほかの入力は歯の中で組む。
      依存は足さない。

  - n: 23
    type: prose
    title: 便 g-seat-fix — 窓の名を短い字にする
    body: |
      実物の画面（2026-09-27T12:42Z に測った）で、block「orchestrator と口座」の窓ごとの行の名の欄が、割合の字（9% など）に重なっていた。名の欄の幅は stylesheet の規則（#orch .wrow の grid-template-columns の 1 列目）で 44px だが、着地済みの行は名の欄に見出しの部品（語の字 five_hour と「?」の button・幅 88px）を置いている。見本（docs/design/mock3/index.html の lowHTML）は、名の欄に短い字（acct.js の WSHORT = five_hour は 5h・seven_day は 7d・seven_day_model は model）だけを置き、字そのものに data-term と tabindex 0 を持たせて、pointer が乗ると説明の card を出す。
      直し方。seat の module に短い字の表（窓の字と短い字の組・3 つ）を定数で置き、WindowRow に短い字の欄を足す（知らない窓は電文の字のまま）。窓の名の欄は短い字だけを出し、見出しの部品（hs）は使わない。語の鍵を持つ窓は、help の module に足す公開の関数 term（語の鍵と出す字を受ける）で組む。term は span を組み、data-term に語の鍵、tabindex 0 を持ち、pointer が乗ると説明の card を開き（留めていなければ）、離れると閉じ（留めていなければ）、押すと留める・もう一度押すと外す。開き方は qmark と同じ（qmark の中の 3 つの closure と同じ働き・共通にしてよい）。qmark と h1・h2・hs の外の見え方は変えない。
      在りか（着地済み）。seat の module は crates/tsuzuri-surface/src/project/seat.rs（WINDOWS・window_row・WindowRow・window_view）。help の module は crates/tsuzuri-surface/src/widgets/help.rs（wasm の target のときだけの dom の module に qmark・hs・TipLayer）。語の辞書に five_hour・seven_day・seven_day_model の説明が在る。
      この便は、見本の閾値の欄（┆85 の字）と、使った割合の推移の線（spark）を足さない（席の card の電文に閾値と推移が無い・後の行で server の側から足す）。
      測り方。短い字の表と WindowRow の短い字の欄は host の cargo test で pin する（歯の file は着地済みの seatblock.rs・名は seatblock_ で始める）。term と窓の名の欄の DOM は wasm の target のときだけ組み立て、surface-build で組めることを見る。
      依存は足さない。

  - n: 24
    type: prose
    title: 便 g-top-fix — header を中くらいの幅で潰さない
    body: |
      実物の画面（2026-09-27T12:53Z に測った）で、幅 780px のとき header の中身が収まらず、頁の link の字（ホーム・抜けの検査）と見出しの語（最終の記録）と mode の切り替えが縦に折れ、頁が横に 34px はみ出していた（document の scrollWidth 814）。stylesheet は幅 760px 以下で header を 2 段に組み替えるので、潰れるのは 761px から 900px ほどの幅（縦に持った tablet の幅）。見本の同じ幅（780px）では 1 行に収まる。差は header の最終の記録の部品で、着地済みの画面は見出しの語と「?」の button（約 110px）と長い時刻の字（2026-09-27 12:53:41 UTC・約 170px）を並べ、見本の同じ場所の部品（約 130px）より約 150px 広い。
      直し方。最終の記録の部品を 1 つの chip（class chip num）にし、中の字を短い時刻（view の module に足す clock_short）にする。短い時刻は見本の hmd と同じ決め方で、今の時刻との差が 20 時間以内なら時と分と Z（12:53Z）、超えれば月と日を前に足す（09-26 12:53Z）。今の時刻は描く時の net の now。chip の字は help の module の term（便 g-seat-fix が足した・語の鍵と字を受けて、pointer が乗ると説明の card を出す span）で組み、語の鍵は last_record。見出しの語と「?」の button は出さない（説明は chip の字に pointer を乗せると出る）。長い時刻の字（着地済みの clock）は span の title の属性に残す。まだ 1 度も読めていないときの出し方は変えない。
      在りか（着地済み）。header を組む所は board の module の top（部品 updated の枝）。clock と Screen は view の module（crates/tsuzuri-surface/src/view.rs）。term は crates/tsuzuri-surface/src/widgets/help.rs の dom の module（wasm の target のときだけ）。頁の枠の HEADER は frame の module（触らない）。
      測り方。clock_short は純粋な関数にして host の cargo test で pin する（新しい歯の file は topbar.rs・名は topbar_ で始める）。header の DOM は wasm の target のときだけ組み立て、surface-build で組めることを見る。幅ごとの収まりは host で測れないので、着地の後に設計席が実物の画面で測る。
      依存は足さない。

  - n: 25
    type: prose
    title: 便 h-frame — account board の枠
    body: |
      account board の頁の枠を、面の crate の新しい module account に置く。見本は docs/design/mock3/account/index.html（見本の頁の写し・data の file は口座名と home の path を持つので写さない）と docs/design/mock3/ui.js の topHTML（PAGE_KIND が account の枝）と acctTabHref。
      入口。面の入口（crates/tsuzuri-surface/src/main.rs）は、URL の query の board が account のときだけ account の module の mount を呼び、ほかは今のまま board の module の mount を呼ぶ。同じ index.html と wasm を配るので、trunk と xtask の surface-build は変えない。
      tab と URL。tab は home・session・projects の 3 つ（見本の ACCT_TABS）。query の tab に残し、既定は home。tab への link は ?board=account&tab=<tab>&mode=<mode>。並べ方の sort・lsort・psort と幅の span は tab をまたいで残す（各 block の便が書く）。query の読みと書きは着地済みの frame の module の param と with_param を使う（frame の module は触らない）。
      header。題（語の鍵 acct_board・見本の IC.vessel の印と字「器」）・tab の 3 つの link（語の鍵 tab_home・tab_session・tab_projects・印の class badge num）・mode の切り替え（語の鍵 mode・class seg）。header の class は top vessel。関係の頁への link と、時点のつまみと、休止中の chip は出さない（未決）。最終の記録の chip は着地済みの view の module の clock で出す（g-top-fix の clock_short が着地していれば、それを使う）。
      block。home の tab は、1 段目が class hgrid の中に nxall（語の鍵 next_all）と winsp（語の鍵 open_windows）、2 段目が class gtop の群の枠、3 段目が allowance（class panel）、4 段目が moves（class panel fold mvp の畳める段）。session の tab は sessions と ledger（語の鍵 sessions と ledger_state）。projects の tab は ptab（語の鍵 dashboards）。block ごとに 1 つの module（home・windows・session・ledger・projects）で、この便は中身を描かず、読めたら中身はまだ無いの字を出す。
      data。口は 1 つで、契約の型の crate の account の module の PATH を着地済みの net の read に渡す（全部の block が 1 つの signal を分け合う）。着地済みの net の read（crates/tsuzuri-surface/src/net.rs）は、読みの口を path ごとに 1 つだけ登録する表（READS）を持ち、同じ path の 2 回目からの read は登録済みの同じ signal を返して口を読み直さない（net.rs の read の本文・doc の「同じ path は 1 つの signal を分ける」）。だから block ごとに read に PATH を渡しても、口の読みは頁に 1 本で、signal は 1 つを分け合う。net.rs は触らない。本文は AccountDoc として読む。読めないとき・まだ読んでいないとき・本文が AccountDoc として読めないときは、block ごとに測れていないの印と理由の 1 行（着地済みの project の module の pending と unmeasured と Body）。
      数の印。home の数は次の一手の lead がなしでない project の数、session の数は状態が limit か silent の行の数、projects は home の数が 1 以上のとき字「!」（見本の BAD）。0 は出さない。
      block の表（done (4) の出所・見本の頁の id と class の写し）。home の tab: block nxall（見出しの語の鍵 next_all・module home）と block winsp（open_windows・module windows）を class hgrid の 1 段に並べ、block groups（見出しの語の鍵 group・class gtop・module home）、block allowance（allowance・class panel・module home）、block moves（moves・class panel fold mvp・module home）。session の tab: block sessions（sessions・module session）と block ledger（ledger_state・module ledger）。projects の tab: block ptab（dashboards・module projects）。語の鍵 next_all・open_windows・group・allowance・moves・sessions・ledger_state・dashboards はどれも語の辞書（crates/tsuzuri-surface/vocab.json）に在る（確かめた）。
      数の印の決まり（done (5) の出所）。電文の ProjectRow の欄 next は Reading の NextStep（契約の型の crate の stats の module・欄 lead は NextMove）。NextMove は board の module の閉じた 7 値（limit-or-move・unresponsive・stalled-run・batch-approval・question・awaiting-effect・nothing・宣言の順）。SessionLine の欄 state は seat の module の SeatState（run・wait・limit・silent・unknown）。home の数は next が Known で lead が nothing でない project の数（Unknown の project は数えない＝読めない物を要対応と数えない）、session の数は state が limit か silent の行の数、projects の印は home の数が 1 以上のときの字「!」。
      電文の型と fixture（着地済み・便 b-acct）。AccountDoc と各行の型と口の path の定数 PATH・HEARTBEAT_PATH は crates/tsuzuri-contract/src/account.rs。fixture は tests/fixtures/account/acct-doc.json（歯はこの file を読むだけで、書き換えない）。fixture の中身（done (5) の出所）: projects は proj-a・proj-b・proj-c の 3 行で、next は proj-a が Known で lead が question、proj-b と proj-c は Unknown。sessions は 4 行で、state は順に run（proj-a の orchestrator）・run（proj-a の pipeline）・wait（proj-b の orchestrator）・unknown（proj-c の orchestrator）。
      在りか（着地済み）。Fetched と clock は crates/tsuzuri-surface/src/view.rs、read・reload_all・post・now は net.rs（wasm の target のときだけ）、param・with_param・Mode・Block は frame.rs、Body・pending・unmeasured・state_icon・section は project の mod.rs、HelpCtx・TipLayer・h1・h2・hs・qmark・term は widgets/help.rs、CardLayer・HoverCtx は widgets/hover.rs、label は vocab.rs。語の鍵 acct_board・tab_home・tab_session・tab_projects・mode・next_all・open_windows・allowance・moves・sessions・ledger_state・dashboards・last_record・not_yet・st_unknown は語の辞書に在る。class top・vessel・nav・badge・num・seg・hgrid・gtop・panel・fold・mvp・stack は stylesheet に在る。
      触らない file。frame.rs・board.rs・net.rs・view.rs・project の下の全部・widgets の下の全部・vocab.json・style.css・Cargo.toml・tests の既存の全部。
      測り方。tab と URL と入口の振り分けと数の印は純粋な関数にして host の cargo test で pin する。枠の値は JSON の字にして snapshot の file（tests/snapshots/acctframe.json）と比べる。DOM は wasm の target のときだけ組み、surface-build で組めることを見る。新しい歯は acctframe.rs に置き、名を acctframe_ で始める。
      依存は足さない。
  - n: 26
    type: prose
    title: 便 h-home — HOME
    body: |
      HOME の 4 段を描く。見本は account/index.html の render の home の枝（nxrows・over・arows・mvli）と acct.js の nextAll・meter。
      次の一手の並び（class nxall と nxrow）。電文の project の行の next（NextStep）の lead で並べる。1 行は project の名（class nxp）・lead の語と 1 行（class nxtop・nxk・nxl）・6 つの印（class nxms と nxm・on・off・na）・開く button（便 h-win が windows の module に置いた開く関数を呼ぶ・この便は h-win の着地の後に起こす）。lead の語は語の鍵 nx_a から nx_g（閉じた 7 種の順に写す）。
      群の枠（class gcard）。見出し（語の鍵 group と群の名）、今の口座（class gcur・語の鍵 current_account・since_rec・previous）、窓ごとの使った割合（class gpw と pws と pw・語の鍵 pressure）、project の列（class projs と pchip・印は class gi ok・gi ng・gi unknown）、候補（語の鍵 candidates・次の移り先は語の鍵 next_target・無しは no_target）。見本の cap の字（/ 85）と hot の class と、候補ごとの門で落ちた理由は出さない（未決・R-22）。
      口座 × 窓（class acct-grid）。見出しは語の鍵 accounts・occupant・five_hour・seven_day・seven_day_model。行は口座の名（class c-name・aname）・占有（class occ grp か occ free・語の鍵 free_for_pipeline）・3 つの窓（class c-w と meter・着地済みの seat の module の window_row と bar_class と until）・退役は語の鍵 retired。見本の spark と measured_at の列は出さない（電文に値が無い）。class c-occ は stylesheet に規則が無いので使わない。
      移動（class mv）。新しい順に 8 行、残りは畳む（見本の SHOWMV）。1 行は時刻（着地済みの seat の module の hmd）・群の名・前 → 後。
      在りか（着地済み）。window_row・WindowRow・bar_class・until・hm・hmd・short は crates/tsuzuri-surface/src/project/seat.rs。NextMove の ALL（宣言の順が優先の順）は契約の型の crate の board の module、NextStep（欄は checks と lead）と NextCheck は stats の module。語の鍵 nx_a・nx_b・nx_c・nx_d・nx_e・nx_f・nx_g・group・current_account・since_rec・previous・pressure・members・candidates・next_target・no_target・occupant・free_for_pipeline・retired・five_hour・seven_day・seven_day_model・accounts・no_record・st_unknown は語の辞書に在る（確かめた・この便は語の辞書を触らない）。
      次の一手の並びの決まり（done (1)(2) の出所）。並べは電文の projects を、next が Known の行は lead の NextMove の ALL の順、同じ lead は電文の projects の順（project の宣言の順）にし、next が Unknown の行はその後ろに電文の順で置く。1 行の欄は、project の名（ProjectRow の name）・群の名（ProjectRow の group・無しは「―」）・lead の語（着地済みの project の next の module の key が返す語の鍵 nx_a から nx_g）・1 行（着地済みの project の next の module の big に lead とその種の NextCheck を渡した値の what の字）・6 つの印。6 つの印は NextMove の ALL の先頭の 6 種（nothing を除く）の順で、字は語の鍵の末尾の a から f。class は nxm と、その種の NextCheck の result（契約の型の crate の stats の module の CheckResult）が hit なら on、miss なら off、not-judged か電文にその種が無ければ na。next が Unknown の行は、lead の語の代わりに語の鍵 st_unknown と測れていないの記号（project の mod.rs の state_icon の unknown）を出し、1 行は「―」、6 つの印は全部 na。
      群の枠の決まり（done (3) の出所）。群の枠は電文の groups の順に 1 つ。今の口座は GroupCard の row の account。いつからは since を着地済みの seat の module の hmd（引数は since と電文の at）の字にし、recorded が偽の群は、いつからの代わりに語の鍵 no_record の字を出す。前の口座は previous（無しは「―」）。窓ごとの使った割合は、電文の accounts の中で label が今の口座と同じ行の usage を、窓の名 five_hour・seven_day・seven_day_model の順に、着地済みの seat の module の short の字と used_pct の字（例 42%）で出す。accounts が Unknown・行が無い・usage が Unknown・その窓が無いときは「―」（読めない割合を 0 と出さない・要件 NFR2）。project の列は members の順。matches が Known の真なら着地済みの seat の module の OK（字 ✓・class gi ok）、Known の偽なら NG（字 !・class gi ng）、Unknown なら字の無い class gi unknown。候補は row の candidates の順、次の移り先は row の next_account（無しは語の鍵 no_target）。
      口座 × 窓の決まり（done (4) の出所）。行は電文の accounts の順。占有の欄は、occupant の群の名（class occ grp）か、無しなら語の鍵 free_for_pipeline（class occ free）で、退役の口座は「―」。3 つの窓は、窓の名の順に usage の同じ window の QuotaUsed を着地済みの seat の module の window_row（引数の時刻は電文の at）に渡した値のまま（bar_class もその値のまま）。無い窓と、usage が Unknown の行は「―」。退役（retired が真）の口座は、3 つの窓の代わりに語の鍵 retired を出す。
      移動の決まり（done (5) の出所）。行は電文の moves の順（便 e-acct-host が新しい順に組む）で、初めの 8 行を出し、9 行目からは畳める段（class fold）に入れる。段の見出しの字は + と残りの数（例 +3・見本の SHOWMV の summary）。1 行は、時刻（hmd・引数は at と電文の at）・群の名・from → to（from が無しなら「―」）。
      段ごとの測れていない（done (6) の出所・要件 NFR2）。口の本文が AccountDoc として読めないときは、便 h-frame の決まりのとおり、4 つの block が測れていないと理由の 1 行になる。読めたときは、groups が Unknown なら群の枠の段、accounts が Unknown なら口座 × 窓の段、moves が Unknown なら移動の段だけを、測れていないの記号と理由の 1 行（理由の字は module の定数・0 件と区別する・project の mod.rs の Body の Unmeasured）にし、ほかの段は出す。
      出さない物（done (7) の出所・規則の行 R-22）。逼迫の印（見本の cap の字 / 85 と hot の class）と、候補ごとの門で落ちた理由と、見本の spark（24 時間の線）と measured_at の列は出さない（歯は、組んだ値の class と字に hot と cap が無いことを見る）。
      fixture の中身（done の期待の出所・tests/fixtures/account/acct-doc.json・便 b-acct の着地・歯は読むだけで書き換えない）。at は 1790510400（2026-09-27T12:00:00Z）。projects は proj-a（群 Tier1・next が Known で lead が question・question だけが hit で target proj-a.7 と count 1・batch-approval と awaiting-effect は not-judged・ほかは miss）・proj-b（群 Tier2・next が Unknown）・proj-c（群 Tier1・next が Unknown）の順。期待の並びは proj-a・proj-b・proj-c で、proj-a の 1 行は proj-a.7 · 1 件、印は a・b・c が off、d が na、e が on、f が na。groups は Tier1（今の口座 acct-1・since 1790503200 でいつからは 10:00Z・previous acct-2・members は proj-a が Known の真で ✓、proj-c が Unknown・candidates は acct-1 と acct-2・next_account acct-2・窓は 42%・61%・30%）と Tier2（今の口座 acct-2・recorded が偽で記録なし・previous 無し・members は proj-b が Known の偽で !・candidates は acct-2・next_account 無しで no_target・窓は 100%・81%・12%）。accounts は acct-1（occupant Tier1）・acct-2（occupant Tier2）・acct-3（退役・usage Unknown）。moves は 2 行で、10:00Z に Tier1 で acct-2 → acct-1、09-26 22:05Z に Tier2 で ― → acct-2。fixture の移動は 2 行なので、畳みの歯は 9 行以上の列を歯の中で組む。
      着地済みの枠との関係（便 h-frame・3100107）。home の module の block の枠の定数（NXALL・GROUPS・ALLOWANCE・MOVES・BLOCKS の id と見出しと class）と、account の board.rs が呼ぶ view（引数は Block・MOVES は畳める段）の名と引数は変えない。着地済みの歯 acctframe_blocks_unmeasured_until_read（tests/acctframe.rs）が、home の module の body を 3 つの読めない形と fixture で pin している（fixture でも中身はまだ無い）。だから body は変えず、中身は新しい関数で組み、view はその関数を使う。口の読みは着地済みの net の read に、account の mod.rs の PATH（契約の型の crate の定数の再公開）を渡す（同じ path の読みは 1 つの signal を分け合う）。本文を AccountDoc に読むのは account の mod.rs の doc（読めない理由は NOT_READ・UNREAD・BAD_BODY）。着地済みの歯 acctframe_path_from_contract_and_no_storage が見るので、account の下の file には、注釈にも /api/ と localStorage と sessionStorage と cookie の字を書かない。着地済みの歯 acctframe_blocks_per_tab_and_module が account の下の .rs の名を固定しているので、file を足さない。
      歯の在りか。歯の file は crate の外の integration test で、着地済みの crates/tsuzuri-surface/src/lib.rs が pub mod account を、account の mod.rs が pub mod home・ledger・projects・session・windows を宣言している（board だけは wasm の target のときだけ）。だから歯は tsuzuri_surface::account::home の pub な関数と定数を呼べ、この便は lib.rs と mod.rs を触らない。この便が足す関数と定数は pub にする。
      触らない file。account の下の自分の file（home.rs）のほかの全部。
      測り方。並べと 1 行の値と印の class と段ごとの測れていないと移動の畳みは純粋な関数にして host の cargo test で pin する（fixture は便 b-acct の tests/fixtures/account/acct-doc.json）。DOM は wasm の target のときだけ組み、surface-build で組めることを見る。新しい歯は accthome.rs に置き、名を accthome_ で始める。
      依存は足さない。
  - n: 27
    type: prose
    title: 便 h-sess — session の表
    body: |
      session の表を描く。見本は account/index.html の sessRow・sessTable・stageCell と ui.js の tkhbHTML。
      行。電文の sessions の行を 1 つずつ。列は project（class c-proj）・role（class c-role・語の鍵 role:orchestrator か role:pipeline）・session（席が無ければ語の鍵 seat_none）・accounts・stage（class c-stage・状態の記号は着地済みの project の module の state_icon）・elapsed・稼働の記録（class c-strip strip24）。見出しの行は class srow hrow。
      並べ方（見本の SORTS）。project・account・stage・elapsed。query の sort に残し、既定の project のときは消す。束の見出しは class ghead。stage の束の語の鍵は stopped_group・moving_group・no_record。
      稼働の記録。着地済みの seat の module の Span と span_of と with_span（query の鍵 span）と rects と strip_svg を使う。窓の右端は電文の at。幅の切り替えは着地済みの形のまま（class seg）。
      合図の行。orchestrator の行は tick の健康（語の鍵 tick_health）と heartbeat（語の鍵 heartbeat）を class tkhb の中に出す。退避までの残り秒（電文の move_left_s）は class mvgrace と語の鍵 move_grace、席の口座が群の今の口座と違う行は class mvwait と語の鍵 seat_mismatch。
      在りか（着地済み）。seat の module（crates/tsuzuri-surface/src/project/seat.rs）の Span・span_of・with_span・SPAN_KEY・rects・strip_svg・strip_class・hm・hmd。state_icon と state_key と STATES は project の mod.rs。語の鍵 sessions・project・role・session・accounts・stage・elapsed・history・span・sort_by・sort_project・sort_account・sort_stage・sort_elapsed・stopped_group・moving_group・no_record・seat_none・tick_health・heartbeat・move_grace・seat_mismatch・free_for_pipeline・st_unknown・role:orchestrator・role:pipeline は語の辞書に在る（確かめた・この便は語の辞書を触らない）。class sess・srow・hrow・ghead・c-strip・strip24・tkhb・mvgrace・mvwait・sortbar・seg は stylesheet に在る。
      並べの決まり（done (1)(2) の出所・見本の sessTable の写し）。query の sort が project・account・stage・elapsed のどれでもないか無ければ project。並べを書く関数は、project のときは sort の鍵を query から消し、ほかは着地済みの frame の with_param で書く（frame の module に鍵を消す関数は無いので、消す関数はこの module に置く）。project の並べは、電文の projects の順に project ごとの見出し（class ghead・project の名と群の名と行の数）を置き、その中は orchestrator の行が先で、ほかは name の字の順。account の並べは、電文の accounts の順に口座ごとの見出し（口座の名と、occupant の群の名か語の鍵 free_for_pipeline）を置き、account が無い行は末尾の見出し（語の鍵 st_unknown）に入れる。見出しの中は orchestrator が先で、ほかは project の名の順。stage の並べは、行の位（state が limit は 0・silent は 1・止まった run は 2・wait は 3・run は 4・unknown は 5）で 3 つの束に分ける。位 0 から 2 は語の鍵 stopped_group、3 と 4 は moving_group、5 は no_record。止まった run は、role が pipeline で stage が Questioned・Failed・Stopped の行（着地済みの next_step の module の STALLED_STAGES）。束の中は位の順、同じ位は since の古い順。elapsed の並べは since の古い順で、since が無い行は末尾。行の無い見出しと束は出さない。同じ値は電文の sessions の順。
      合図の行の決まり（done (4) の出所）。SessionLine は tick と heartbeat と残り秒を持たないので、orchestrator の行は、電文の projects のうち name が行の project と同じ ProjectRow から引く。tick の健康と heartbeat は、その seat（SeatCard）を着地済みの seat の module の top に渡した値の tick（Sign）と heartbeat（on か off）で、seat が Unknown なら両方とも測れていない。退避までの残り秒は move_left_s が在る行だけで、class mvgrace・字は <秒> 秒（例 1101 秒）。mvgrace の無い行のうち、行の account が群の今の口座（電文の groups の中で group が ProjectRow の group と同じ GroupCard の row の account）と違う行だけ、class mvwait と語の鍵 seat_mismatch を出す。行の account か群の今の口座が分からない行（account が無し・groups が Unknown・群が無い）は mvwait を出さない（読めない一致を不一致と出さない・要件 NFR2）。
      席なしの行（done (5) の出所）。便 e-acct-proj の決まりで、席の card が Unknown の project の orchestrator の行は name が空の字。name が空の字の行は、session の欄に語の鍵 seat_none を出す。
      稼働の記録の決まり（done (3) の出所）。rects に渡す時刻は電文の at、幅は span_of（query の鍵 span）。縦線（marks）は空の列（session の行は口座の移動を持たない）。spans が Unknown の行は、稼働の記録の欄に「―」。
      読めないとき（done (6) の出所・要件 NFR2）。口の本文が AccountDoc として読めないときは、便 h-frame の決まりのとおり、表の全体を測れていないと理由の 1 行にする（account の mod.rs の doc と project の mod.rs の Body）。
      fixture の中身と期待（done (2)(4) の出所・tests/fixtures/account/acct-doc.json・歯は読むだけ）。sessions は 4 行。行 1 は proj-a の orchestrator（name proj-a-orch・account acct-1・state run・since 1790505060）、行 2 は proj-a の pipeline（name proj-a.3-20260927T113000Z・account acct-1・state run・stage Running・since 1790508600）、行 3 は proj-b の orchestrator（name proj-b-orch・account acct-1・state wait・since 1790508900）、行 4 は proj-c の orchestrator（name proj-c-orch・account 無し・state unknown・since 無し）。期待の順は、project が 1・2・3・4、account が 1・3・2・4（acct-1 の見出しの中は orchestrator の 1 と 3 が先）、stage が 3・1・2・4（moving_group の中は wait の 3 が先で、run の 1 と 2 は since の古い順、4 は no_record）、elapsed が 1・2・3・4。合図は、proj-a が tick ✓ と heartbeat on、proj-b が tick ! と heartbeat off と 1101 秒（mvwait は出さない）、proj-c が両方とも測れていない。fixture に席なしの行は無いので、name が空の字の行は歯の中で組む。
      着地済みの枠との関係（便 h-frame・3100107）。session の module の BLOCK と、account の board.rs が呼ぶ view（引数なし）の名は変えない。着地済みの歯 acctframe_blocks_unmeasured_until_read が session の module の body を pin しているので、body は変えず、中身は新しい関数で組み、view はその関数を使う。口の読みは net の read に account の mod.rs の PATH を渡し、本文は account の mod.rs の doc で読む。account の下の file に /api/ と保存の口の字を書かず、file を足さない（着地済みの歯が見る）。
      歯の在りか。歯の file は crate の外の integration test で、着地済みの crates/tsuzuri-surface/src/lib.rs が pub mod account を、account の mod.rs が pub mod home・ledger・projects・session・windows を宣言している（board だけは wasm の target のときだけ）。だから歯は tsuzuri_surface::account::session の pub な関数と定数を呼べ、この便は lib.rs と mod.rs を触らない。この便が足す関数と定数は pub にする。
      触らない file。session.rs のほかの全部。
      測り方。並べ・束・行の値・合図の class は純粋な関数にして host の cargo test で pin する（fixture は便 b-acct の tests/fixtures/account/acct-doc.json）。DOM は wasm の target のときだけ組み、surface-build で組めることを見る。class c-ses・c-acct・c-el は stylesheet に規則が無いので付けない（行の列は並びの順で決まる）。新しい歯は acctsess.rs に置き、名を acctsess_ で始める。
      依存は足さない。
  - n: 28
    type: prose
    title: 便 h-led — 台帳の処理状況の表
    body: |
      台帳の処理状況の表を描く。見本は account/index.html の ledTable・ledOrder・ledMore・extremes と ledger.js の judge。
      行は電文の project の行の ledger（LedgerStats）と judge。見出しは語の鍵 l_judge・project・l_task・l_rate・l_unref（class jtab と jrow と hrow）。1 行は判定（class c-j）・project（class c-p）・task と 24 時間の純減（class c-n c-task）・closed/日の棒（class rbar）・未反映（LedgerStats の unreflected は読めない種類を 0 と数えた和で確かな値と言えないので、この便は「―」・未決）。詳しくの段（class rowmore と c-more）は ready・blocked・stale・7 日の純減・lead の p50（語の鍵 l_ready・l_blocked・l_stale・l_net7・l_lead）。
      並べ方は judge・project・net・backlog（query の lsort・既定の judge のときは消す・語の鍵 sort_judge・sort_project・sort_net・sort_backlog）。
      在りか（着地済み）。LedgerStats の欄（at・judge・open・blocked・ready・stale・net_drop_24h・net_drop_7d・closed_7d・closed_per_day・lead・days）は契約の型の crate の stats の module。LedgerJudge の ALL は board の module。語の鍵 l_judge・project・l_task・l_rate・l_unref・l_ready・l_blocked・l_stale・l_net7・l_lead・sort_judge・sort_project・sort_net・sort_backlog・st_unknown は語の辞書に在る（確かめた・この便は語の辞書を触らない）。台帳の block（project の下の ledger の module）の関数は project board のもので、この便は呼ばない（見た目の class だけ揃える）。
      並べの決まり（done (1)(2) の出所・見本の ledOrder の写し）。query の lsort が judge・project・net・backlog のどれでもないか無ければ judge。書く関数は judge のときに lsort の鍵を消し、ほかは frame の with_param で書く（消す関数はこの module に置く）。judge の並べは、着地済みの project の ledger の module の JUDGES の表の順（悪い順＝滞り・積み増し・停滞・順調・台帳なし）で、台帳が Unknown の project は台帳なしと同じ位。project の並べは電文の projects の順。net の並べは net_drop_7d が小さい順で、同じなら net_drop_24h が小さい順。backlog の並べは open の task が多い順。net と backlog は台帳が Unknown の project を末尾に置く。どの並べも、同じ値は電文の projects の順。
      行の字の決まり（done (3)(5) の出所）。判定は着地済みの project の ledger の module の judge の記号と語の鍵。open の task は LedgerStats の open の task、24 時間の純減は同じ module の net、closed/日は fixed1 の字と class rbar の棒。詳しくの段の ready・blocked・stale は数のまま、7 日の純減は net、lead の p50 は age（lead が無ければ「―」）。台帳が Unknown の project の行は、判定の欄に語の鍵 st_unknown、数の欄は全部「―」。
      列の最大と最小（done (4) の出所・見本の extremes と xm）。open の task と closed/日の 2 列について、台帳が Known の行の値が 2 つ以上在り、最大と最小が違うときだけ、最大の cell に class hi、最小の cell に class lo を足す。表の下の凡例は class xm hi と xm lo の印。台帳が Unknown の行は数えない。
      詳しくの段（done (6) の出所）。行ごとの開き閉じは ledger.rs の中の signal だけに持ち、URL の query と画面の外の保存に書かない（歯は、並べを書く関数の出力に lsort のほかの鍵が増えないことと、ledger.rs の字に localStorage・sessionStorage・cookie が無いことを見る）。
      fixture の中身と期待（tests/fixtures/account/acct-doc.json・歯は読むだけ）。台帳が Known なのは proj-a だけで、judge は on-track（✓）・open の task 9・net_drop_24h 2・closed_per_day 0.9・ready 5・blocked 3・stale 1・net_drop_7d 4・lead の p50 4.0（age の字は 4.0d）。proj-b と proj-c は台帳が Unknown。judge の並べは proj-a・proj-b・proj-c。Known の値が 1 つなので最大と最小の印は付かない。並べと最大と最小の歯は、3 行以上の LedgerStats を歯の中で組む。
      着地済みの枠との関係（便 h-frame・3100107）。ledger の module の BLOCK と view の名と body は変えず（着地済みの歯 acctframe_blocks_unmeasured_until_read が body を pin する）、中身は新しい関数で組み、view はその関数を使う。口の読みと本文の読みは account の mod.rs の PATH と doc。file を足さない。
      歯の在りか。歯の file は crate の外の integration test で、着地済みの crates/tsuzuri-surface/src/lib.rs が pub mod account を、account の mod.rs が pub mod home・ledger・projects・session・windows を宣言している（board だけは wasm の target のときだけ）。だから歯は tsuzuri_surface::account::ledger の pub な関数と定数を呼べ、この便は lib.rs と mod.rs を触らない。この便が足す関数と定数は pub にする。
      触らない file。account の下の ledger.rs のほかの全部。
      測り方。並べと印と行の値は純粋な関数にして host の cargo test で pin する（fixture は便 b-acct の tests/fixtures/account/acct-doc.json）。DOM は wasm の target のときだけ組み、surface-build で組めることを見る。新しい歯は acctled.rs に置き、名を acctled_ で始める。
      依存は足さない。
  - n: 29
    type: prose
    title: 便 h-proj — 各 project の表
    body: |
      各 project の表を描く。見本は account/index.html の projTable（9 列・PSORTS）。
      列（class ptab と prow）。project（class c-pn）・要対応（class c-need・lead の語と 1 行）・決定待ち（class c-wait）・未反映（class c-un2）・台帳（class c-led）・run の 4 列（class c-run と rc4 と rq q-wait・q-run・q-stop・q-land・0 は z）・orchestrator（class c-orch・状態の記号と tick と heartbeat）・accounts（class c-acc）・開く（class c-open）。
      並べ方は need・group・judge・unref（query の psort・既定の need のときは消す）。group の並べは群の見出しの行（class pgh）を持つ。
      決定待ちは電文に値が無く、未反映は LedgerStats の unreflected が読めない種類を 0 と数えた和で確かな値と言えないので、どちらもこの便では「―」（未決: ほかの project の台帳と design-intent を読むか）。
      在りか（着地済み）。語の鍵 project・p_need・p_wait・l_unref・ledger_block・runs4・seat・accounts・p_open・sort_need・sort_group・sort_judge・sort_unref・open_new・not_yet・current_account・st_unknown は語の辞書に在る（確かめた・この便は語の辞書を触らない）。class は stylesheet に在る（ptab・prow・hrow・c-more・rowmore）。
      列と見出し（done (1) の出所）。見出しの行（class prow hrow）の語の鍵は、列の順に project・p_need・p_wait・l_unref・ledger_block・runs4・seat・accounts・p_open の 9 つ。
      並べの決まり（done (2)(3) の出所・見本の PSORTS）。query の psort が need・group・judge・unref のどれでもないか無ければ need。書く関数は need のときに psort の鍵を消し、ほかは frame の with_param で書く（消す関数はこの module に置く）。need の並べは next の lead の NextMove の ALL の順で、next が Unknown の project はその後ろ、同じなら電文の projects の順。group の並べは電文の groups の順で、group が無い project は末尾。群が変わる所に群の見出しの行（class pgh・群の名と語の鍵 current_account と今の口座）を置く。judge の並べは着地済みの project の ledger の module の JUDGES の表の順（台帳が Unknown は台帳なしと同じ位）。unref の並べは、この便では未反映がどれも「―」なので電文の projects の順。どの並べも、同じ値は電文の projects の順。
      欄の決まり（done (4)(5)(6) の出所）。runs4 は runs の wait・run・stop・land の順の 4 つの数（class rq と q-wait・q-run・q-stop・q-land）。0 の数は class z を足し、runs が Unknown なら 4 つとも「―」と class z。accounts の欄は、seat が Known ならその card の account（無しは「―」）を出す。その字が、group が同じ GroupCard の row の account（群の今の口座）と同じなら着地済みの seat の module の OK（字 ✓）、違えば NG（字 !）を付ける。seat が Unknown・card の account が無し・groups が Unknown・群が無い project は印を持たない（読めない一致を不一致と出さない・要件 NFR2）。p_open の欄は、board を持つ project だけ開く button（語の鍵 open_new）を持ち、押すと便 h-win が windows の module に置いた開く関数を呼ぶ（この便は h-win の着地の後に起こす）。board を持たない project は、語の鍵 not_yet の押せない字。
      fixture の中身と期待（tests/fixtures/account/acct-doc.json・歯は読むだけ）。need の並べは proj-a（lead question）・proj-b・proj-c（どちらも next が Unknown）。group の並べは Tier1 の見出しの下に proj-a・proj-c、Tier2 の見出しの下に proj-b。runs4 は、proj-a が 1・2・0・3（stop に z）、proj-b が 0・0・1・0（wait と run と land に z）、proj-c が ― が 4 つ。accounts は、proj-a が acct-1 と ✓（Tier1 の今の口座 acct-1）、proj-b が acct-1 と !（Tier2 の今の口座 acct-2）、proj-c が ― で印なし。p_open は、proj-a（board /proj-a/）と proj-b（/proj-b/）が open_new、proj-c（board 無し）が not_yet。
      着地済みの枠との関係（便 h-frame・3100107）。projects の module の BLOCK と view の名と body は変えず（着地済みの歯 acctframe_blocks_unmeasured_until_read が body を pin する）、中身は新しい関数で組み、view はその関数を使う。口の読みと本文の読みは account の mod.rs の PATH と doc。file を足さない。
      歯の在りか。歯の file は crate の外の integration test で、着地済みの crates/tsuzuri-surface/src/lib.rs が pub mod account を、account の mod.rs が pub mod home・ledger・projects・session・windows を宣言している（board だけは wasm の target のときだけ）。だから歯は tsuzuri_surface::account::projects の pub な関数と定数を呼べ、この便は lib.rs と mod.rs を触らない。この便が足す関数と定数は pub にする。
      触らない file。projects.rs のほかの全部。
      測り方。並べと各欄の値と class は純粋な関数にして host の cargo test で pin する（fixture は便 b-acct の tests/fixtures/account/acct-doc.json）。DOM は wasm の target のときだけ組み、surface-build で組めることを見る。新しい歯は acctproj.rs に置き、名を acctproj_ で始める。
      依存は足さない。
  - n: 30
    type: prose
    title: 便 h-win — 名前つきの新しい窓
    body: |
      project board を名前つきの新しい窓で開く（要件 FR1・持ち主の裁定 2026-09-26 の案 2）。見本は account/index.html の openWin・drawWins と relation.html。
      窓の名は tz-<project の名>。account board の窓の名は tz-account で、mount の時に自分の窓の名にする。開くときは、この頁が開いた窓の handle が生きていれば前面へ、無ければ window の open に空の URL と窓の名を渡し、返った窓が about:blank なら URL を入れる（新しい）、そうでなければ前面へ。
      開く URL は電文の project の行の board の字に mode を足した字。board を持たない project は開けない（語の鍵 not_yet）。
      開いている窓の一覧（HOME の winsp・class items wins）は頁の一生の間だけ持つ。見本は localStorage の tz-wins に残すが、この便は残さない（未決）。
      在りか（着地済み）。web-sys の Window の feature は面の crate の Cargo.toml に在る（open と focus と name は Window の feature だけで使える）。語の鍵 open_windows・open_new・not_yet は語の辞書に在る。
      開く URL の決まり（done (2) の出所）。開く URL は、電文の ProjectRow の board の字の後に ?mode= と今の mode の key（着地済みの frame の Mode の key・beginner か expert）を付けた字（例 /proj-a/ と expert で /proj-a/?mode=expert）。board が無い project は無し。
      窓の一覧の決まり（done (3)(4) の出所）。一覧の 1 項は、project の名・窓の名（tz-<project の名>）・状態（開いている か 閉じた）。一覧の移り方は純粋な関数で決める。一覧に無い project を開くと、末尾に開いているで足す（結果は新しい）。一覧に在る project を開くと、状態を開いているにして位置は変えない（結果は前面へ）。handle の closed が真になった project は閉じたにする。一覧は開いた順（初めて足した順）に並べ、頁の一生の間だけ持つ（localStorage・sessionStorage・cookie を使わない）。一覧の行と開く button の字は、開いている窓は字「前面へ」（語の辞書に鍵が無いので module の定数に置く）、ほかは語の鍵 open_new。
      関数の名（ほかの行が呼ぶ）。windows の module に、窓の名の関数 win_name・account board の窓の名の定数 ACCOUNT_WIN（字 tz-account）・開く URL の関数 open_url・一覧の移り方の関数 after_open（開いたとき）と after_close（handle の closed が真になったとき）・開く関数 open（wasm の target のときだけ・引数は project の名と開く URL）を置く。便 h-home と便 h-proj の開く button は open を呼ぶ。about:blank の確かめは web-sys の Location の feature を使う（Cargo.toml に在る）。
      窓の名を付ける所。account board の窓の名 tz-account は、account の board.rs の mount で window の name に入れる（この行の write-set に board.rs を足す）。
      着地済みの枠との関係（便 h-frame・3100107）。windows の module の BLOCK と view の名と body は変えず（着地済みの歯 acctframe_blocks_unmeasured_until_read が body を pin する）、中身は新しい関数で組み、view はその関数を使う。file を足さない。
      歯の在りか。歯の file は crate の外の integration test で、着地済みの crates/tsuzuri-surface/src/lib.rs が pub mod account を、account の mod.rs が pub mod home・ledger・projects・session・windows を宣言している（board だけは wasm の target のときだけ）。だから歯は tsuzuri_surface::account::windows の pub な関数と定数を呼べ、この便は lib.rs と mod.rs を触らない。この便が足す関数と定数は pub にする。
      触らない file。windows.rs と account の board.rs（mount で窓の名を入れる 1 行）のほかの全部。Cargo.toml。
      測り方。窓の名・URL・一覧の移り方・button の字は純粋な関数にして host の cargo test で pin する（fixture の board は proj-a が /proj-a/、proj-b が /proj-b/、proj-c が無し）。DOM と window の open は wasm の target のときだけ組み、surface-build で組めることを見る。新しい歯は acctwin.rs に置き、名を acctwin_ で始める。
      依存は足さない。
  - n: 31
    type: prose
    title: 便 h-hb — 停止の切り替えの button
    body: |
      session の表の orchestrator の行に停止の切り替えを置く（要件 FR12）。見本は ui.js の tkhbHTML・openHB・hbCmd（見本は撃たずに画面の状態だけ変える）。
      button（class btn hbbtn）の字は、heartbeat が on なら語の鍵 hb_to_off、off なら hb_to_on。押すと行の下に確かめの段を開く。dialog の要素は面の crate の web-sys の feature に無いので使わない（Cargo.toml は触らない）。段は語の鍵 hb_dlg_lead と hb_dlg_scope の字と、撃つ字（class cmd）と、やめると撃つの 2 つの button を持つ。撃つ字は state dir を出さず「scribe2 seat heartbeat <to> --target <席の名>」。
      送る。本文は HeartbeatRequest（project と to）で、契約の型の crate の account の module の HEARTBEAT_PATH へ、着地済みの net の post で送る。応答の出し方は下の応答の出し方の段落のとおり。応答の字（止めた・戻した・理由の字）は見出しでない本文の字なので、語の辞書を使わずに module の定数に置く。
      在りか（着地済み）。post と reload_all は net.rs。語の鍵 hb_to_off・hb_to_on・hb_dlg_lead・hb_dlg_scope は語の辞書に在る。class hbbtn・tkhb・btn・primary は stylesheet に在る。
      値の出所（done (1)(2)(3) の出所）。SessionLine は heartbeat を持たないので、orchestrator の行の heartbeat は、電文の projects のうち name が行の project と同じ ProjectRow の seat（SeatCard）の heartbeat（Known の真が on・Known の偽が off）。seat か heartbeat が Unknown の行と、name が空の字（席なし）の行は button を持たない。pipeline の行も button を持たない。to は今の heartbeat の逆（on なら off・off なら on）。撃つ字の <席の名> は行の name。要求の本文の project は行の project。
      応答の出し方（done (4) の出所）。応答の字は module の定数に置く。200 は、to が off なら「止めた」、on なら「戻した」を出してから、net の reload_all で口を全部読み直す。404 で本文の字が no-project なら「project が群の宣言に無い」、no-seat なら「orchestrator の席が見つからない」。400 の bad-body は「要求の本文が読めない」。502 の vessel-failed は「器の CLI が失敗した（5 秒で返らないか rc が 0 でない）」。ほかの状態の数と本文（着地済みの guarded の 403 origin と 413 too-large を含む）は「口が断った」と状態の数。net の post が無しを返したら「口に届かない」。断りの本文は字だけ（便 e-acct-hb の決まり）。
      送る間（done (5) の出所）。送る状態（送っていない・送っている・応答の字）を行ごとに持ち、送っている間は button を押せない（disabled）。状態の移り方は純粋な関数で決める。
      fixture の中身と期待（tests/fixtures/account/acct-doc.json・歯は読むだけ）。proj-a の orchestrator の行（name proj-a-orch）は heartbeat が on なので、button は hb_to_off、撃つ字は scribe2 seat heartbeat off --target proj-a-orch、本文は project proj-a と to off。proj-b の行（proj-b-orch）は off なので hb_to_on と to on。proj-c の行は seat が Unknown なので button を持たない。proj-a の pipeline の行は button を持たない。
      着地済みの枠との関係（便 h-frame・3100107）。新しい heartbeat の module は account の mod.rs に宣言する（mod.rs の DOM でない部分に view の字を足さない・着地済みの歯が見る）。着地済みの歯 acctframe_blocks_per_tab_and_module（tests/acctframe.rs）は account の下の .rs の名の一覧を 7 つに固定しているので、その一覧の board.rs の次に heartbeat.rs を足す（名の順・この行の write-set に mod.rs と tests/acctframe.rs を足す）。session の module の body は変えない（acctframe_blocks_unmeasured_until_read が pin する）。口の path は契約の型の crate の account の module の HEARTBEAT_PATH を使い、account の下の file には注釈にも /api/ と localStorage と sessionStorage と cookie の字を書かない（acctframe_path_from_contract_and_no_storage が見る）。
      歯の在りか。歯の file は crate の外の integration test で、着地済みの crates/tsuzuri-surface/src/lib.rs が pub mod account を宣言している。この便は account の mod.rs に pub mod heartbeat を足すので、歯は tsuzuri_surface::account::heartbeat と tsuzuri_surface::account::session の pub な関数と定数を呼べる。この便が足す関数と定数は pub にする。
      触らない file。session.rs と heartbeat.rs と account の mod.rs（heartbeat の宣言の 1 行）と tests/acctframe.rs（名の一覧に heartbeat.rs を足す）のほかの全部。
      測り方。button の字・段の字・要求の本文・応答の出し方・送る間の状態は純粋な関数にして host の cargo test で pin する（fixture は便 b-acct の tests/fixtures/account/acct-doc.json）。DOM と post は wasm の target のときだけ組み、surface-build で組めることを見る。新しい歯は accthb.rs に置き、名を accthb_ で始める。
      依存は足さない。
  - n: 32
    type: prose
    title: 便 h-wire — つなぐ行
    body: |
      project board の便と重なる file を触るのはこの行だけにする。
      server。口の振り分け（crates/tsuzuri-boundary/src/server/mod.rs の route と handle）に、GET の PATH と POST の HEARTBEAT_PATH（どちらも契約の型の crate の account の module の定数）を足す。POST は着地済みの guarded（Origin と本文の大きさ）を通してから accthb の module の受付の関数を呼ぶ。起動（Server の bind）で、state dir が在るときだけ acct の module の読みを作り、変化の印の closure に acct の module の印の file を足す。起動の引数は足さない（--state-dir と --scribe2 と --bd を使う）。
      project board の「戻る」。frame の module の HEADER（4 つの部品・着地済みの歯 tests/gapspage.rs と tests/nodepage.rs が HEADER[1] を nav として読む）は変えず、戻るの部品は同じ module の新しい定数 BACK（part は back・key は acct_back・class は upto・items は空）に置く。board の module の header は BACK を HEADER の前に描き、包む span の class は backwrap（見本の ui.js の topHTML と backToBoard）。snapshot の字は header の前に back の 1 行を足し、snapshot の file と枠の歯（tests/frame.rs）を直す。振る舞いを決める純粋な関数を frame の module に置き、tz-account の窓が在るか（真偽）を受けて、3 段の列（在れば前面へ・無ければ ?board=account を新しい窓で開く・どちらの後も自分の窓を閉じる）を返す。window の open（空の URL と tz-account を渡し、about:blank なら URL を入れる）と close は wasm の target のときだけ組む。
      在りか（着地済み）。guarded・route・handle・Shared・Hub の起動は server/mod.rs、Hub は server/events.rs、HEADER は frame.rs、top は board.rs。
      この行は g-top-fix（board.rs と view.rs を触る）の着地の後に起こす。e-acct と e-acct-hb の着地の後に起こす順は台帳の blocks で張る。
      server の acct の読みの決まり（done (1)(3) の出所）。読みは便 e-acct の acct の module の型で、器の program（--scribe2）・git の program・bd の program（--bd）・state dir・cwd（repo）を、便 e-acct の節の順の引数で Acct::new に渡して作り、GET は method doc に今の時刻を渡し、変化の印は method marks の一覧を使う。git の program は Config に欄を足さずに渡す（Config を字で組む着地済みの歯の file が crates/tsuzuri-boundary/tests の下に 8 つ在り、欄を足すとそれらが組めなくなる）。server の mod.rs に、Config と git の program を受ける起動の関数 bind_with を足し、着地済みの bind は同じ module の新しい定数 GIT（字 git）を渡して bind_with を呼ぶ。main.rs は触らない（起動の引数は足さない）。歯は bind_with に偽の git の path を渡す。GET の PATH は 200 で、読みの値を wire の encode の字で返す。歯は、同じ偽の器と偽の git と一時の state dir で読みの関数を直に呼んだ値と、電文の at を除いて比べる（at は撃った時刻でずれる）。state dir が無いときは器も git も撃たず、at は今の時刻、accounts と groups と moves は Unknown、projects と sessions と dormant は空の列の電文を返す。
      POST の決まり（done (2) の出所）。POST の HEARTBEAT_PATH は、着地済みの guarded を通す（Origin が Host と違えば 403 と字 origin、本文が http の BODY_MAX の 65536 byte を越えれば 413 と字 too-large、どちらも器を撃たない）。通った本文の字を便 e-acct-hb の accthb の module の受付の関数 accept に server の Acct と一緒に渡し、返った状態の数と本文をそのまま返す（200 は JSON・ほかは字）。
      変化の知らせ（done (4) の出所・要件 NFR2）。Hub の変化の印の closure に、acct の module の印の file の一覧（便 e-acct の method marks）を足す。着地済みの Hub（server/events.rs）は印の file を POLL（500 ミリ秒）ごとに見て、変われば SSE の口（/api/surface/events）に board-changed（契約の型の crate の surface の module の BOARD_CHANGED_EVENT）を送るので、5 秒以内に届く。
      測り方。server の口の歯は server_acctwire.rs に、戻るの関数の歯は acctwire.rs に置き、名はどちらも acctwire_ で始める。
      依存は足さない。

  - n: 33
    type: prose
    title: 便 g-pipe-today — Landed の列を今日の着地だけにする
    body: |
      実物で見つけた（2026-09-27T13:3xZ・scribe2 の repo を同じ画面で読んだ時）。pipeline の block の Landed の列は見出しが Landed（今日）なのに、口 /api/pipeline の札の全部の着地（17 日前のものまで 270 本）を並べていた。tsuzuri の着地は全部が今日だったので、これまで見えなかった。見本の決め方（docs/design/mock3/acct.js の runColsAt の注）は、land の列は今日（UTC）の Landed だけ。
      直し方。札（契約の型の crate の board の module の PipelineCard・欄は contract・runs・stage・reason・account・elapsed_s）の elapsed_s は、server が読んだ時の今から最後の event の時刻を引いた秒。面は描く時の今の時刻から elapsed_s を引いて着地の時刻とみなし、今日の UTC の日の始まり以上なら今日の着地とする（読んだ時と描く時の差の数秒は許す）。関数 landed_today を足し、columns と content に今の時刻の引数を足して Landed の列だけを絞る。server の口と電文は変えない。
      在りか（着地済み）。columns・content・body・kcard・LANES・PipelineColumn の決め方は crates/tsuzuri-surface/src/project/pipeline.rs。着地済みの歯は crates/tsuzuri-surface/tests/pipe.rs（名は pipe_ で始まる・fixture は tests/fixtures/surface/pipeline-board.json）。columns と content を呼ぶ歯は、fixture の着地の札が今日に入る今の時刻を渡すように直す。body の形は変えない（frame と parts の歯が使う）。
      呼ぶ所（確かめた）。columns と content を呼ぶのは、pipeline の module の中（content の中の columns・wasm の target のときだけの view の中の content と columns）と、着地済みの歯 tests/pipe.rs だけで、src のほかの file とほかの歯の file は呼ばない（ledger の module の content は同じ名の別の関数）。今の時刻は通信の module の now（crates/tsuzuri-surface/src/net.rs・wasm の target のときだけ・epoch 秒を返す）を view の中で呼んで渡す。
      測り方。新しい歯も tests/pipe.rs に置き、名を pipe_ で始める。done (6) は wasm の target のときだけの code なので、xtask の surface-build が組めることで見る。
      依存は足さない。

