      - id: g-ledger
        title: block「台帳」の指標の段（4 つの数・判定・burndown・memo の段・「詳しく」・未反映の一覧・epic の進み）
        req: [FR13, FR14, NFR2]
        section: "13"
        write-set: ["crates/tsuzuri-surface/src/project/ledger.rs", "+crates/tsuzuri-surface/tests/ledgerblock.rs", "+tests/fixtures/surface/ledger-stats.json"]
        verify: ["cargo nextest run -p tsuzuri-surface --no-tests=fail ledgerblock_", "cargo run -q -p xtask -- surface-build", "cargo run -q -p xtask -- check"]
        size: M
        done: (1) fixture の指標の電文から、上段の 4 つの数（open の task・open の memo・未反映・純減 24h）と純減の矢印（負は ↓・正は ↑・0 は →）が期待と一致する (2) 判定の 5 値のそれぞれが、記号（! ↑ → ✓ ―）と class と語の鍵に 1 か所の表で写る (3) burndown の図は 14 日で、棒の高さと線の点の座標が見本の式で計算した fixture の期待と一致する (4) 未反映の一覧は古い順に 20 件までで、超える分は「ほか n 件」と出し、まだ分からない種類は 0 でなく測れていないの記号を出す (5) 年齢の字が 4 つの形（値なしは ―・1 日未満は時間の h・10 日未満は小数 1 桁の d・それ以上は整数の d）で期待と一致する (6) 「詳しく」の中に ready と blocked と lead の中央値と stale と sparkline と epic の進みが在り、作業中の数と最古の task はどこにも出さない (7) 口が読めないかまだ読んでいないときは 0 でなく測れていないと理由の 1 行を出し、台帳の一覧は今のまま出す (8) 着地済みの関数の外形（BLOCK・口の path の定数・Body<()> を返す metrics の名と引数と返りの型・台帳の一覧の body と count）を変えず、本文が電文の型として読めないときは測れていないを返し、足す外の依存は 0 本
        depends: [g-parts]
  - n: 8
    type: prose
    title: 便 g-min — 最小の project board
    body: |
      最初の本物の画面を早く出すために、project board の最小の形を先に置く（作る順の計画 2026-09-27・持ち主の承認）。
      面の crate に Leptos（csr）の画面を 1 枚置く。出すのは、問いの一覧（open の question を古い順）・台帳の一覧（epic の下に task と memo・状態の印）・最終更新の時刻の 3 つ。
      data は server の口（台帳の一覧と変化の知らせ）から読む。読めないときは 0 件でなく測れていないと出す（要件 NFR2）。
      この便は問いと台帳を見せるだけで、答えの欄と 2 つ目の面（account board）は持たない。答えの欄は便 e の受付の後に便 g が足し、account board は便 h が置く。
      並べ方と状態の印と測れていないの判定は純粋な関数（view の module）に置き、host の cargo test で試す。DOM と通信を触る部分は wasm の target のときだけ組み立て、host の build と clippy が workspace の全部で通る形にする。
      組み立ては xtask の下から trunk を呼ぶ（cargo run -q -p xtask -- surface-build）。出力は面の crate の dist の dir で、版管理の外に置く。この便は server の file を触らない（配る側の引数は便 e-min が置いた tz surface serve の --files で、着地済み）。
      依存は Leptos の一式を足す。面の crate の依存の予算は core と別枠で、直接依存 8 本以下（規則の行 R-25 の値・要件 NFR3）。xtask の歯は本数の定数を持ち、rules の file の行 R-25 の字（直接依存 8 本）と食い違えば落ちる。便 a の xtask の歯（Cargo.lock の外の package の許可の一覧）は、crate ごとの直接依存の名の一覧を照らす形に改める。
      toolchain の file の wasm の target と CI の trunk は、便の前に設計席が main で足す。この便は土台の便 e-min の着地の後に起こす（依存は台帳の blocks で張る）。
  - n: 9
    type: prose
    title: 便 g-frame — project board の枠と見た目
    body: |
      最小の画面は見た目も機能も見本（mock v3）に遠い。先に見た目と頁の枠を見本に揃え、block を module に分けて、後の便が block を 1 つずつ並べて書けるようにする（持ち主の指摘 2026-09-27・開発の速さ）。
      見本の頁は docs/design/mock3 に写してある（index.html・map.html・ask.html・ui.css・ui.js・ledger.js・vocab.json ほか）。見本は持ち主が承認した仕様の見本で、class の名と block の並びと語はこれに揃える。見本の JavaScript は読む材料で、写さない。
      stylesheet は見本の ui.css を面の crate の style.css に写す。class の名は変えない。頁は 2 つ。home の頁の枠は header（題・mode の切り替え・最終更新・地図の頁への link）と 6 つの block（id は next・ask・pipe・orch・ledger・legend = 次の一手・問いの一覧・pipeline・orchestrator と口座・台帳の処理状況・凡例）で、この順に置く。地図の頁（id は map）は枠と見出しだけを置く。
      block と地図の頁は project の下の module に 1 つずつ置く（next・ask・pipeline・seat・ledger・legend・map の 7 つの file）。この便で中身を持つのは 3 つ。ask は問いの一覧、ledger は台帳の一覧（どちらも便 g-min の中身を見本の class で描き直す）、legend は状態の印の凡例。
      data の口がまだ無い 4 つ（next・pipe・orch・地図の頁）は、見出しと、0 でなく測れていないの印と、理由の 1 行を出す。ledger の block の指標の段も同じく測れていないと出す。中身は後の便が module ごとに足す。
      見出しの語と「?」の注釈の字は見本の vocab.json を面の crate に写して引く。初心者と経験者の mode は URL に残す。hover の card と「?」の注釈の部品は widgets の下に置き、この便では「?」の注釈だけを動かす。
      頁の枠と block の見出しは純粋な関数の値にして host の cargo test で pin する。DOM を触る部分は wasm の target のときだけ組み立てる。この便は server と中核の crate と契約の型の crate を触らない。

  - n: 10
    type: prose
    title: 便 g-parts — block に共通の部品
    body: |
      block の便を 1 つずつ並べて走らせるために、block が共通に使う部品を先に置く。この便の後、block の便は自分の module の file と自分の歯の file だけを書く。
      読みの口。block は自分の口を 1 本読む。口の path は閉じた 6 本で、ask と ledger の一覧は /api/ledger（着地済み）、next は /api/next、pipeline は /api/pipeline、seat は /api/seat、ledger の指標の段は /api/metrics、地図の頁は /api/graph。path は block の module の定数に置く。/api/ledger の外の 5 本は server にまだ無い（後の便が足す）。無い口は 200 を返さないので「読めない」になる。
      読みの結果は 3 値にする（まだ読んでいない・本文・読めない）。通信の module は、path を受けて読みの結果の signal を返す関数を持つ。頁を開いたときに 1 回読み、読み直しの合図を受けたら登録された口を全部読み直す。
      読み直しの合図は、変化の知らせ（SSE・/api/surface/events）の接続が開いたときと、event の名が ledger-changed か board-changed の知らせを受けたとき。ledger-changed の定数（LEDGER_CHANGED_EVENT）は契約の型の crate の台帳の module（src/ledger.rs）に着地済みで、この便は触らない。board-changed は器の event の記録か設計文書が変わったことを表す名で、この便が契約の型の crate の面の module（src/surface.rs）に定数（BOARD_CHANGED_EVENT）として 1 つ足す。接続は頁に 1 本だけ持つ。接続が切れたら、登録された口の結果を全部「読めない」にする。
      block の中身の関数は、読みの結果を受けて中身を返す純粋な関数にする。この便では next・pipeline・seat・地図の頁・ledger の指標の段の 5 つを、3 値のどれを受けても測れていないと理由の 1 行を返す形にする（本文を受けたときの理由は「この block の中身はまだ無い」）。本文を読んで中身を返すのは後の block の便。ask と ledger の一覧は今の中身のまま、同じ通信の関数で読む。
      hover の card。card の層を頁に 1 つ置き、block は「要素に card を付ける関数」を呼ぶだけにする。card は 4 行（題・種類・値・出所）と「詳しく」で、1 行は 36 字まで（超える行は 35 字と「…」）。
      置き場は規則の行 R-20 の値で、card の左上を pointer の右 16 ピクセルと上 20 ピクセルに置く。card の右端が窓の右端を越えるときは pointer の左 16 ピクセルに card の右端を置く。card が窓の上端か下端を越えるときは、窓に収まるまで縦に寄せる。
      猶予は 150 ミリ秒（規則の行 R-20）。要素を出た点と今の pointer の点を比べ、card の矩形までの距離が縮んでいて、出てから 150 ミリ秒以内なら card を残す。それ以外は消す。置き場と猶予の判定と行の切り方は純粋な関数にして host の cargo test で pin する。行の数と字数は規則の行 R-19 の値（4 行・1 行 36 字）。歯は定数を rules の file（design-intent/rules.yaml）の行 R-20 と行 R-19 の字と照らす（読むだけ）。
      web-sys の feature は、後の block の便が Cargo.toml を触らずに済むよう、この便でまとめて足す（Document・Element・HtmlElement・DomRect・Event・EventTarget・MouseEvent・PointerEvent・KeyboardEvent・WheelEvent・History・Location・Headers・Request・RequestInit・HtmlInputElement・HtmlTextAreaElement・SvgElement）。feature を足すだけで、外の依存の package は増やさない。
      この便は server と中核の crate を触らない。契約の型の crate に書くのは、面の module に足す定数 1 つ（BOARD_CHANGED_EVENT）だけ。

  - n: 11
    type: prose
    title: 便 g-pipe — block「pipeline」の中身
    body: |
      block「pipeline」の中身を置く。見本は docs/design/mock3/index.html の pipe の block と、docs/design/mock3/ui.js の kcardHTML（札）。class の名は見本のまま使う（stylesheet に着地済み）。書くのは自分の module の file と、自分の歯の file と、fixture の 1 つだけ。
      data は 2 つの口から読む。/api/pipeline は pipeline の板（契約の型の PipelineBoard・札は契約 bead の id・走行の回数・段・段の理由・口座・経過の秒）。/api/ledger は台帳の一覧（札の題を bead の id で引く）。読みは便 g-parts の通信の関数（面の crate の net の read・口の path を受けて読みの結果の signal を返す）を使う。
      板は 4 列で、順は Queued / Blocked・Running / Gated・Questioned / Failed / Stopped・Landed。列の class は順に c-wait・c-run・c-stop・c-land、見出しの語の鍵は順に col_wait・col_run・col_stop・col_land。段から列への対応は、契約の型の段の型が持つ関数（Stage の column）を呼ぶ。見出しの横に、その列の札の数を出す。
      列の中は経過の短い順（同じなら bead の id の順）。列ごとに 3 枚まで出し、超える分は「+n」の button にする。button を押すと、その列の札を全部出す。開いた列の名は URL の query（鍵は col）に残し、頁を開き直しても開いたままにする。
      札は、状態の記号・題・bead の id・走行の回数・経過の字を持つ。題は 36 字で切る（契約の型の title36）。台帳の一覧から引けない札は題を出さず id だけを出す。Questioned / Failed / Stopped の列の札は、回数の代わりに段の理由の字を出す。経過の字は、60 秒未満は秒の数と s、60 分未満は分の数と m、24 時間未満は時間の数と h、それ以上は日の数と d（端数は切り捨て）。bead の頁はまだ無いので、札は link にしない。
      札に hover の card を付ける（便 g-parts の部品・面の crate の widgets の hover の attach と Card）。4 行は、題・種類（run と段の名）・値（回数と口座と経過）・出所（fleet/events.jsonl）。
      読めて札が 0 枚のときは、見本の 0 件の帯（class は empty zrun）と、空の 4 列を出す。札が「まだ分からない」のとき・口が読めないとき・まだ読んでいないときは、0 件でなく測れていないの印と理由の 1 行を出す（要件 NFR2）。
      着地済みの関数の外形は変えない。変えないのは、BLOCK の値・口の path の定数・読みの結果を受けて Body<()> を返す関数（body）の名と引数と返りの型。枠の歯（tests/frame.rs）はこの関数を呼んでいて、この便の write-set の外に在るので、そのまま通す（本文が電文の型として読めないとき、この関数は測れていないを返す）。中身を返す関数は、同じ module に別の名で足す。題を引く関数と列を組む関数も同じ module に足す。並べ方と字の関数は純粋な関数にして host の cargo test で pin し、DOM は wasm の target のときだけ組み立てる。
  - n: 12
    type: prose
    title: 便 g-next — block「次の一手」の中身
    body: |
      block「次の一手」の中身を置く。見本は docs/design/mock3/index.html の nextHTML。書くのは自分の module の file と、自分の歯の file と、fixture の 1 つだけ。
      data は口 /api/next から読む（契約の型の NextStep・便 d が足した電文）。電文は閉じた 7 種の 1 つずつについて、判じた結果（当たった・当たらない・判じなかった）と件数と対象の id を順に持ち、大きく出す 1 つを名指す。判定は中核の crate が済ませていて、面は写すだけにする（面の code に判定の分岐を書かない）。
      7 種と語の鍵の対応は、限度と移動 nx_a・応答なし nx_b・止まっている走行 nx_c・束の承認 nx_d・質問 nx_e・発効待ち nx_f・なし nx_g。順は契約の型の 7 種の宣言の順を引く。
      大きく出す 1 つは、見本の class nxbig の箱に、語（「?」の注釈つき）と中身の字を出す。止まっている走行の中身は件数と、block「pipeline」への頁の中の link。質問の中身は対象の bead の id と件数。なし（どれも当たらない）は class nxbig none の箱。
      残りの種類は、見本の class nxlist の一覧に 7 種の順のまま出す（大きく出した 1 つは除く）。当たった種類は件数、当たらない種類は「―」、判じなかった種類は測れていないの記号を出す（0 や「―」と区別する）。
      口が読めないとき・まだ読んでいないときは、0 件でなく測れていないの印と理由の 1 行を出す（要件 NFR2）。
      着地済みの関数の外形は変えない。変えないのは、BLOCK の値・口の path の定数・読みの結果を受けて Body<()> を返す関数（body）の名と引数と返りの型。枠の歯（tests/frame.rs）はこの関数を呼んでいて、この便の write-set の外に在るので、そのまま通す（本文が電文の型として読めないとき、この関数は測れていないを返す）。中身を返す関数は、同じ module に別の名で足す。中身を組む関数は純粋な関数にして host の cargo test で pin し、DOM は wasm の target のときだけ組み立てる。
  - n: 13
    type: prose
    title: 便 g-ledger — block「台帳」の指標の段
    body: |
      block「台帳」の指標の段を置く。見本は docs/design/mock3/index.html の ledgerBlock と、docs/design/mock3/ledger.js の描き方の関数（netHTML・burndown・spark14・judgeHTML・unrefHTML・days）。class の名は見本のまま使う。書くのは自分の module の file と、自分の歯の file と、fixture の 1 つだけ。
      data は口 /api/metrics から読む（契約の型の LedgerStats・便 d が足した電文）。数え方と判定は中核の crate が済ませていて、面は写すだけにする。
      上段（class l4）は 4 つの数で、open の task・open の memo・未反映・純減 24h（語の鍵は l_task・l_memo・l_unref・l_net24）。純減は矢印と数で出し、負は ↓（純減）、正は ↑（純増）、0 は →（横ばい）。見出しの横に判定の 1 語を出す。判定の 5 値は、滞りが「!」、積み増しが「↑」、停滞が「→」、順調が「✓」、台帳なしが「―」で、class と語の鍵（j_bad・j_up・j_stall・j_ok・j_none）への対応は 1 か所の表に置く。
      中段（class lmid）は burndown の図（14 日・線は open の task・棒は閉じた数 / 日）。座標の式は見本の burndown と同じにする。memo の段（class mpro）は 4 つの数で、open・昇格待ち・直近 7 日に閉じた数・年齢の中央値（語の鍵は m_open・m_wait・m_promo7・m_age）。
      「詳しく」（見本の details の class gmore・経験者の mode では開いて出す）の中に、ready・blocked・lead の中央値・stale・sparkline（14 日の created と closed）・closed/日・純減 7d を置く。epic の進み（閉じた数 / 全体の棒）は畳んだ段に置く。作業中の数と最古の task は出さない。
      未反映の一覧は畳める段で、最初は開いている。見出しに全体の数と、種類ごとの数（memo・裁定・要望）を出す。電文が「まだ分からない」と言う種類は、0 でなく測れていないの記号を出す。一覧は 5 列（id・題・種類・年齢・次の 1 手）で、題は 44 字で切り、古い順に 20 件まで出し、超える分は「ほか n 件」と出す。年齢の字は、値なしは「―」、1 日未満は時間の数と h、10 日未満は小数 1 桁の日の数と d、それ以上は整数の日の数と d。
      台帳の一覧（便 g-frame の中身）は今のまま、指標の段の下に出す。
      口が読めないとき・まだ読んでいないときは、指標の段は 0 でなく測れていないの印と理由の 1 行を出す（要件 NFR2）。
      着地済みの関数の外形は変えない。変えないのは、BLOCK の値・口の path の定数・読みの結果を受けて Body<()> を返す関数（metrics）の名と引数と返りの型。枠の歯（tests/frame.rs）はこの関数を呼んでいて、この便の write-set の外に在るので、そのまま通す（本文が電文の型として読めないとき、この関数は測れていないを返す）。中身を返す関数は、同じ module に別の名で足す。台帳の一覧の関数（body と count）も変えない。数と字と座標の関数は純粋な関数にして host の cargo test で pin し、DOM は wasm の target のときだけ組み立てる。

