        depends: []
  - n: 3
    type: prose
    title: 行 i-9 — 表示先の設定の手引きの skill
    body: |
      在りかの main は b5c24c8（計画 surface-plan 第 0.78 版・試作は 93389e3 の clone で撃ち、b5c24c8 へ当て直して verify を撃ち直した・この行の書く file と読む file の字は 2 つの main で同じ）。書く file は新しい 2 つ（plugin/skills/stage-setup/SKILL.md と境界の歯 crates/tsuzuri-boundary/tests/stskill.rs）で、src と plugin の .claude-plugin/plugin.json と hooks/hooks.json は書かない。依存の i-7（表示先の設定〔層 B〕と tz stage target の口・ノート surface-wave18d）は着地した（028986c）。
      なぜ。要件 FR16 は、どの project をどの端末に出すかを版管理に載らない表示先の設定（全体の既定と project ごとの上書き・値は端末の一覧に在る名だけ）で持ち、tz の口で変えると言う。判断の記録 ADR-15 の決定 (2) は、層 B を変える口を tz の口 1 つとし、持ち主が起こす設定の手引きの skill（setup）と 2 つの board の設定の画面がどれもこの口を通り、手引きの skill は持ち主が起こす聞き取りで ADR-14 の決定 (5)（席への直接の問いの見張り）の例外にあたると決めた。持ち主の裁定 t3-hub.59.1（裁定 id = t3-hub.59.1:20260928T0120Z-1）は、表示先を setup の skill か席との対話で最初に決めるとした。この行はその手引きの skill を置く（board の設定の画面は後の行 i-8）。
      Claude Code の skill の決まり（この repo の外の事実・Claude Code の公式の文書の skills の頁で 2026-09-29 に確かめた）。plugin の skill は plugin の dir の下の skills の下の skill の名の dir の SKILL.md に置き、plugin が効く session で、字 / と plugin の名とコロンと skill の名をつないだ命令で起こす（この plugin は plugin.json の name が tsuzuri なので /tsuzuri:stage-setup）。頭の欄は --- の行の間の YAML で、鍵 name を省くと dir の名になる。鍵 disable-model-invocation を true にすると、持ち主だけが起こせて model は起こせない（description も model の文脈に載らず、model が起こそうとすると Claude Code がその呼びを断る・既定は false）。鍵 user-invocable を false にすると逆に持ち主が起こせなくなる（この skill は持たない）。plugin の下の skills の dir は既定の置き場なので、plugin.json に鍵を足さずに見つかる。
      席の session と便。器の席の起動は、登録の anchor の下の plugin の dir を 1 つ目の plugin の dir に渡す（ノート surface-wave6 の節の器の答え）ので、席の session はこの skill を読む。器の便の runner は、便の worktree の plugin の下の .claude-plugin と hooks の 2 つの dir だけを写す（器の code の pipe/spawn.rs の const PLUGIN_DIRS・器 7c4ab0a で読んだ）ので、runner の session はこの skill を持たない。
      形（plugin/skills/stage-setup/SKILL.md・新しい file）。頭の欄の鍵は name（値 stage-setup）と description（1 行の要約・表示先の設定の手引きで、持ち主が起こす聞き取りで層 A の名と今の設定を見せ、選んだ PC を既定と上書きに置く）と disable-model-invocation（値 true）の 3 つだけ。本文は、決まりの節と 5 つの段（1 今の設定を見る・2 層 A に PC が無いか足りない時・3 全部の project の既定を選ぶ・4 project ごとの上書き・5 確かめて終える）。撃つ命令は囲みの中の 5 行だけで、tz stage target show（1 と 5）・tz stage target set --all <端末の名>（3）・tz stage target set --project <project> <端末の名> と tz stage target clear --project <project>（4）。名の置き字は <端末の名> と <project> の 2 つで空白を含まない（tz の口の読みは空白で語を分けるので、置き字も 1 語にする）。
      形（SKILL.md の決まりの節と各段の字）。(a) 持ち主が起こす聞き取りなので ADR-14 の決定 (5) の例外にあたり、この skill の中でだけ表示先をチャットで問う。skill の外で表示先を決めてほしい時は board の問いで出す（ADR-15 の決定 (2)）。(b) 問いは散文で 1 つずつ出し、推奨を 1 つ添えて答えを待つ。AskUserQuestion の道具は使わない（見張りがどの形で着地しても、道具を撃たない散文の問いは当たらない）。(c) 設定を読み書きするのは tz stage target の口だけで、設定の file と器の host の面を直に読み書きしない。旗は --all と --project だけで、撃つ program と設定の path の差し替えの旗は使わない。命令は repo の根を cwd にして撃つ（tz stage target は cwd の repo の git config の scribe2.statedir から器の state dir を読む・旗 --repo の既定は字 .）。tz が PATH に無ければ、repo の根で build した target/debug/tz を同じ引数で撃つ（根からの相対の path で撃ち、絶対の path を字に書かない）。(d) 名は形だけで書き、実の名は show の出力から読む。show の出力の名を版管理に載る file と commit の字に写さない（行 D-4）。(e) 命令が rc 1 で落ちたら断りの行をそのまま見せて止まり、回り道（file を直に書く・別の旗で撃ち直す）をしない。
      形（各段）。1 は show を撃ち、出力の行の読み方を並べる（境界の fn show の字の形）。既定 <端末の名> か 既定 無し・上書き <project> <端末の名>（上書きごとに 1 行）・project <project> <端末の名>（既定）か（上書き）〔名が層 A に無ければ出所の後に ・層 A に無い が付く〕・project <project> 無し（席の目と URL に落ちる）・層 A の名 <名の列> か 層 A の名 無し。2 は、層 A を書くのは持ち主か器の席で tsuzuri の席は書かないこと、PC を足すのは今は器の席の運びであること（器の覚え書き s2-07l.727 の書きの口が着地したら画面から）、足す行の欄 profile-dir（席専用の Chrome の設定の置き場）は PC のホームの下の ~/.cache/tsuzuri-stage にすること（ADR-15 の決定 (4)・持ち主の裁定 t3-hub.59.2）、ほかの欄（name・ssh・chrome・os・display）は欄の名だけを示し値の見本を出さないことを案内し、層 A の名が無いままなら止まる。3 は層 A の名を並べて全部の project に出す PC を問い（推奨は今の既定が層 A に在ればそれ・名が 1 つならその名）、set --all を撃つ。set --all は project ごとの上書きを全部外すので、1 で上書きの行が在ったら撃つ前に外れる上書きを見せて確かめる。4 は既定と違う PC に出したい project を問い、在れば set --project を撃ち、既定に戻すなら clear --project を撃つ。5 は show をもう 1 度撃って project ごとに効く表示先を見せて終える。この skill は設定を置くだけで窓を開かず、表示先を替えると、その PC に初めて見せる時の 1 度だけ窓が開く（ADR-15 の決定 (6)）ことを添える。
      形（crates/tsuzuri-boundary/tests/stskill.rs・新しい file・接頭辞 stskill_）。使う境界の item はどれも着地済みの pub で、この行は書かない。lib.rs の pub mod stage・stage/mod.rs の pub mod cli と pub mod terminal・cli.rs の pub fn parse_target（&[&str] を受けて Result の TargetCall と String）と pub enum Setting（Show・Project の 2 つの String・All の String・Clear の String）と pub struct TargetCall（pub な欄 setting）・terminal.rs の pub const KEYS（8 つの字の配列）。const NAME（字 stage-setup）・SKILL（workspace の根からの path）・PROFILE（字 ~/.cache/tsuzuri-stage）と、file を CARGO_MANIFEST_DIR の 2 つ上の dir から読む fn skill・頭の欄の鍵と値の組と本文に分ける fn head・囲みの中の空でない行を返す fn fenced（閉じない囲みを断る）を持つ。歯は 3 本（stskill_head・stskill_commands・stskill_layer_a）で、端末も器も撃たず、網に出ない。
      歯で測らず、この行の差分で持つ。この節の (a)〜(e) に書いた決まりの節の字と、各段の問いの字・推奨の決め・show の出力の読み方・set --all の前の確かめ・窓の添え書きの字。host の名・tailnet の住所・口座の名札を書かないこと（行 D-4）は、xtask の check の最初の段 pub-scan が追跡される file の全部（新しい SKILL.md と歯の file を含む）の形と一覧で持つ。
      grep で調べた読み手。字 plugin/ と skills と SKILL と stage-setup を、契約・中核・境界・面の crate の tests と src と xtask/src と .github で grep した。plugin の下を読むのは中核の歯 tests/fstop.rs の fstop_plugin_stop_entry だけで、plugin/.claude-plugin/plugin.json（鍵が name と version と description の 3 つ）と plugin/hooks/hooks.json（Stop の 1 つの entry）の 2 つの file を名指して読み、plugin の dir を走査しない。この行はその 2 つの file を書かないので、その歯の期待は動かず、write-set にも verify にも入れない。新しい歯が読む fn と const（parse_target・Setting・KEYS）はこの行が書かず、共有の fixture と語の辞書は使わない。
      試作（main 93389e3 の clone に当て、b5c24c8 へ当て直した）。3 本の歯が通った。噛みを見た（SKILL.md の字を 1 つずつ崩し、名指した歯が落ちることを 20 通りで確かめた）。頭の欄の disable-model-invocation の行を外す・値を false にする・鍵 user-invocable を足す・name を替える・description を空にする・頭の欄を閉じない（stskill_head）、囲みに tz stage open を置く・旗 --config か --repo を足す・名の置き字を実の形の名にする・set --all の囲みを外す・読めない形（set と名だけ）にする・散文に tz stage open を書く・囲みを閉じない・名に字 ~ で始まる path を置く（stskill_commands）、~/.cache/tsuzuri-stage を外す・ほかのホームの下の path を書く・欄の名 profile-dir を外す・覚え書き s2-07l.727 を外す・ssh の宛先の見本（字 @）を書く（stskill_layer_a）。xtask check の全部の段（一覧つきの pub-scan・build・nextest の 1502 本・clippy の 2 つ・surface-build）が b5c24c8 に当てた木で rc 0 で通った（93389e3 に当てた木でも通った）。試作の git diff は 2 file・246 行の足し・11129 byte。
      filter の語。main b5c24c8 の contracts の verify の filter の語（272 語）のどれも、接頭辞 stskill_ と 3 本の歯の名に部分の字として含まれず、接頭辞と名もどの語にも含まれない。
      依存と順。depends は空（ノートの行は 1 つ）。書く file は新しい 2 つだけで、走行中と待ちの便（g-nav・c-limit-resume）の write-set とも、同じ波の起草の行の書く file（plugin/hooks/hooks.json を書く f-gate-install・boundary/stage/cli.rs を書く i-open-mark と i-10 ほか）とも重ならない。後の行が tz stage target の口の形（parse_target の受ける命令と旗・Setting の枝）か境界の KEYS を替えるなら、その行が歯 tests/stskill.rs を置き場だけの = と verify で持つ。
      範囲の外。層 A（器の host の面の端末の表）を書くこと（書くのは持ち主か器の席）。持ち主が画面から PC を足す口（器の覚え書き s2-07l.727 の後の別の行）。2 つの board の設定の画面（行 i-8）。知らせ（行 i-10）。窓を開く命令（持ち主の tz stage open）。ADR-14 の決定 (5) の見張りそのもの（器の側）。tz の binary を PATH に置くこと。

