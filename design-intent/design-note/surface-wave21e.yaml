    body: |
      表示先の設定（層 B）を持ち主と一緒に決めて置く手引きの skill を、tsuzuri の plugin に足す行 1 つ。
      skill は持ち主だけが起こせる聞き取りで、席の model からは起こせない印を頭の欄に持つ。
      設定を読み書きするのは着地した tz stage target の口だけで、skill の字には host の名・tailnet の住所・口座の名札を書かず、名は形だけで示す。
      歯は skill の file の頭の欄と、撃つ命令が tz stage target の口だけで絶対の path を持たないことと、層 A の案内を見る。
