    body: |
      在りか。差の file docs/design/patch/ag-ref.patch（14,174 byte）は、main fefb3056 と試作の木（写しは drafts の try-w232a の commit b89b3d06・係 w232a）の差で、参照の file plugin/skills/agent-discipline/reference.md の直しと新しい段の file crates/tsuzuri-boundary/tests/agref.rs の 2 file。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。depends は空で、同じノートの並ぶ行 t-teeth-on と書く file が交わらない（一時の index に両順で当てて同じ木になる）。並ぶ行 t-kfold-cap が参照の file の 11 節を直す時も、この差の最後の hunk（main の 70〜82 行目）から 5 行以上離れる。

      なぜ。判断の記録 ADR-63 の決定 (2) は、参照の file を席の起草の決まりの唯一の正本とし、git の外の頼みの共通の文にしか無い 4 項のうち 3 項（行を数珠つなぎにしない・門に断られたら回り込まず止めて知らせる・token の節約）を移し、残りの案内の幅の項は器の入れ子の歯（接頭辞 cli_help_）が落とすので写さず歯の名だけを指すとした。あわせて天井の 4 つ（置き場の物差しの順と置き場の妥協の 1 文・根の src の module の頭の doc に行の id を書かない・goal に歯の本数を書かない・実装の source の字を照らす歯を足す時は振る舞いで測れない訳を節に 1 文）を足すとした。帰結の 9 番目の項は、群の係の頭の予算は下限と上限が同じ 15 万なのでちょうど 15 万だけが通るとし、10 節の字（150000 以下）を直すとした。

      形。参照の file の頭の文の末に、決定 (2) で起草の決まりの文をこの file だけに置き頼みの文はこの file を名指す 1 文を足す。3 節（契約の行の書き方）の depends の項の後に、数珠つなぎの項（割り方と depends を書く時の 1 文）と置き場の物差しの順の項（置き場の妥協の 1 文を含む）を、3 節の末に goal の項と module の doc の項と案内の幅の項を足す。goal の項は、契約表の goal が行の節の字の写しなので、行の節と書く。5 節（歯の置き方）の末に source の字の歯の項を、9 節（道具の撃ち方）の末に回り込みの項と token の節約の項を足す。10 節の 4 番目の項の予算の字を、予算は token ちょうど 150000 に直す。参照の file は 90 行から 98 行になる。参照の file の行の数の上限を測る歯は無い（crates と xtask の歯と src を grep した）。案内の幅の値は写さない。

      done と verify の対応。done の 1 番目の項は verify の 1 行目、2〜5 番目の項は 3 行目（新しい段の file tests/agref.rs の歯 agref_）で測る。2 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので verify に書かない。入口の赤は、main の参照の file では 2〜4 番目の項の歯が落ち（3 行目が rc 100）、5 番目の項の歯は器の歯の dir だけを読むので main でも通る。

      歯と噛み。新しい段の file tests/agref.rs（判断の記録 ADR-32 の決定 (3)・群の main.rs と kfold.rs は書かない）。境界に置くのは、plugin の file を読む着地済みの歯 agpl_ と同じ crate に寄せるため。参照の file は天井の文で振る舞いを持たないので、歯は字を節の塊（番号の見出しの行から次の見出しの行の前まで）の中で照らし、1 度だけである事を数で断言する（決定 (2) の (d) の訳）。器の歯の名は、scribe2/crates の下の crate ごとの tests の dir を名で探して照らす（歯の file の path を固定しない）。噛みは係が撃った（参照の file の変異 14 と歯の助けの変異 4・全部 rc 100・対照は rc 0・書き戻した後の status は空）。句ごとの外しと 150000 以下への戻しと 100 字の写しと 9 節から 2 節への動かしで 2 番目の項、節の塊を見ない変異と 1 度以上で通す変異で 3 番目、無いはずの字を見ない変異で 4 番目、器の歯の接頭辞の変異で 5 番目の項の歯が落ちた。

      U と範囲の外。頼みの共通の文の退役（席の置き場の退役の dir への mv）と、頼みの文から共通の文を指さない事は席の手で、着地の後に撃つ。module の doc の行の id を数える lint の歯（段 S3 の行）と、goal の字の型の照らし。手引きの文の効きの測り（物差しの群 q）。SKILL.md は替えない（本文の字数と決まりの行の数を着地済みの歯 agpl_ が断言する）。
  - n: 9
    type: prose
    title: 行 t-teeth-on — 器への宣言に歯の検査の鍵 teeth-check を真で名乗る（判断の記録 ADR-63 の決定 (5)・ADR-45 の門 H1）
    body: |
      在りか。差の file docs/design/patch/t-teeth-on.patch（4,204 byte）は、行 ag-ref の試作の commit b89b3d06 と試作の木（写しは drafts の try-w232a の commit 5f86b06a・係 w232a）の差で、.vessel.toml と xtask/tests/teeth1/vlanes.rs の 2 file。行 ag-ref の差と書く file が交わらないので main fefb3056 にも当たる（一時の index に両順で当てて同じ木になる）。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。depends は空。

      置き場。名乗りの 3 行（注 2 行と鍵の行）は、行 entrance-flip の直後、design-intent-paths の注の前に置く。並ぶ器の行 v-one-vessel が同じ file の末（build-lanes の後）に鍵を足し、群の module vlanes.rs にも歯を足しうるので、vlanes.rs の新しい歯は助けの関数の直後（着地済みの歯の前）に置き、file の末を空ける。仮の差（.vessel.toml の末に 2 行・vlanes.rs の末に歯）を一時の index に両順で当てて、どちらも rc 0 で同じ木になった。置き場の妥協。並ぶ行との交わりを避けるため、新しい歯を群の module の末でなく着地済みの歯の前に置いた。

      なぜ。判断の記録 ADR-63 の決定 (5) は、tsuzuri の器への宣言に、器の任意の鍵 teeth-check を真で名乗るとした（判断の記録 ADR-45 の門 H1 の鍵の 1 つ・前の 1 歩の行 t-teeth-col と v-atk-names は着地済み）。名乗りで、器の表の検査（scribe2 contracts check）は --base を渡した周に、base から足された行と done の字が変わった行に番号つきの done の項目と欄 done-teeth を求める。tsuzuri でこの周を撃つのは席の設計の commit の門で、断った行は main へ入らない。受付と preflight は欄が在る行の形を照らし、欄の要否は見ない。

      形。.vessel.toml の行 entrance-flip の直後に、由来（器の任意の鍵・ADR-45 の門 H1 の鍵の 1 つ・ADR-63 の決定 (5)）と働き（--base を渡した周に番号つきの項目と欄 done-teeth を求める・撃つのは席の設計の commit の門）の注 2 行と、鍵の行 teeth-check = true を足す。着地済みの群の module xtask/tests/teeth1/vlanes.rs は、build-lanes の行を数える助け lanes_lines の中身を、鍵を引数に取る助け key_lines へ移して lanes_lines から呼び、名乗りの字の定数 TEETH_ON と名乗りを数える歯を足す。

      器の読みの実測。PATH の器 scribe2（版 3642943fb9ce）は宣言を HEAD の木から読み、作業木の宣言は読まない。床の写しで main fefb3056 にこの行の差を commit した木に scribe2 contracts check の --repo と --base を撃つと、base が main の周は断りの種 done-teeth-missing と done-unnumbered が 0 件（今 main に在る未着地の行は断られない）、base をノート surface-wave29c を起こす前の 76909977 にした周は done-teeth-missing が 6 件（その後に足したノート surface-wave29b の 2 行と surface-wave29c の 4 行）だった。名乗りの無い main の木と、作業木にだけ名乗りを書いた木では、同じ 2 つの base でどちらも 0 件。器の表の検査は着地済みの行の断り（write-set-item-unresolved と teeth-outside-write-set）でどの周も rc 1 なので、席の門は rc でなく断りの種の行で判じる。

      done と verify の対応。done の 1 番目の項は verify の 1 行目、2 番目と 3 番目の項は 3 行目（xtask の群 teeth1 の歯 vlanes_）で測る。2 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので verify に書かない。入口の赤は、main の .vessel.toml が鍵を持たないので 2 番目の項の歯が落ちる（3 行目が rc 100）。

      歯と噛み。宣言を読む今の歯は群の module vlanes.rs なので、段の file を作らずそこへ足す（判断の記録 ADR-32 の決定 (3) の、着地した群の module を直す形・群の main.rs と kfold.rs は書かない）。歯は宣言の file の字を読む（器の宣言は器が読む設定の file で、tsuzuri の歯から器の読みを撃たないため・器の読みは上の実測で照らした）。噛みは係が撃った（変異 9・対照は rc 0）。名乗りの行の外し・false・字の true・注・2 行の変異と、鍵の名を前の字の一致で見る変異で 2 番目の項の歯が rc 100、build-lanes の数えが別の鍵を読む変異で 3 番目の項の歯がどちらも rc 100。注の行の除きを外す変異は生き残った（鍵の字の一致が注の行を既に除くので振る舞いが替わらない等価の変異）。

      U と範囲の外。名乗りの前に置く行（この行と ag-ref・t-kfold-cap・v-one-vessel）は欄 done-teeth を書かない（決定 (11)）。名乗りの着地の後に置く行と、done の字を替える行は欄 done-teeth を書く。この 4 行の設計の commit は、この行の着地の前に済ませる（着地の後は、席の門が --base main で欄の無い行を断る）。断りごとの 1 行の記録（物差しの床の断りの項 floor_refused_3d）は席の道具の側で、行に入れない。
  - n: 10
    type: prose
    title: 行 v-one-vessel — 器を書く便の同時の数を、器の宣言の鍵 run-cap と run-cap-paths で受付と列の同じ 1 本の判じに数える（判断の記録 ADR-63 の決定 (13)・器の行）
    body: |
      在りか。差の file docs/design/patch/v-one-vessel.patch（57,081 byte）は、main f4bbc16f（器の行 v-gate-findings を置いた設計の commit・器の行 v-commute-wire は着地済み）と、その上の試作の commit 63fea01a（tree 16b82352・写しは drafts の try-w240a の branch w240a-s・係 w240a）の差（13 file・+460 −53）。第 0.15 版と第 0.18 版で替えたのは宣言の読み手の file src/pipe/declaration/run_cap.rs の差だけで（第 0.15 版は key run-cap-paths の doc の 2 行・RunCap::holder の本体の 1 行・歯の名と見本の 2 形、第 0.18 版は項目の照らしの 2 枝と doc の 2 行・歯の名と見本の 2 形）、ほかの 12 file の差の字は第 0.8 版の差（係 w234a の試作 f59b425a・main fefb3056 に未着地の器の行 v-commute-names・v-commute-wire・v-run-write の差を当てた土台 9fed1221 で切った）と byte で同じ。v-commute-wire の着地の後は main の上に当たる（main f4bbc16f の後の設計の commit は scribe2/ の下を替えていない）。v-run-write（hold）の差とはどちらの順に当てても同じ tree ddad44a7 になり、その後に行 v-gate-findings の差も当たる。行 t-run-cap-on の差の後にも当たる。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      依存と順。depends は空。差の文脈の前の行 v-commute-wire（便 t3-hub.89.9）は同じノートに在るが、並べられない訳は意味の依存でなく器を書く便は同時に 1 本の決まり（この行が床にする物）と差の文脈なので、順は便の bead の依存で持つ（前例はこのノートの行 ag-plugin と v-commute-wire の節）。v-run-write（t3-hub.80.27.8・hold）とは書く file が交わらず両順に当たる。ADR-63 の器の行の数珠では、この行を先に流し、行 v-gate-findings がこの行に依る（ADR-63 の決定 (11)）。

      なぜ。判断の記録 ADR-63 の決定 (13) は、器の code（scribe2/）を write-set に持つ便が同時に走る数を床で 1 本までにし、数えるのは器の起こしの 1 つの判じで、待ちの理由を 1 つ足し、2 本目の判定を別に書かず、値 1 と数える path の集まりは器への宣言の鍵が持つとした。ADR-33 の決定 (12) の決まりは器にも席の道具にも字が無く、10-04 と 10-05 に器を書く便が 2 本並んだ（10-05 は 10:35:10Z に driver の終端の周が 89.8 を起こし、17 秒後に席の 1 周が 77.25 を起こした・器の出来事の記録・2 本は write-set が交わらないので交差の待ちに掛からない）。

      形（鍵）。宣言の任意 key を 2 本足す。run-cap は 1 以上の整数（本数）、run-cap-paths は repo 相対の dir（末尾 /・空でない・前後に空白を持たない・絶対 path でない・.. の段を持たない・名の段を 1 つ以上持つ）の配列。2 key は揃えて書き、片方だけ・本数 0・型違い・空の配列・項目の不備は key の名と書いた行を名指す宣言の不備（今の任意 key と同じ極性）。空の配列と空字の項目は、宣言の値の読み（親の value_of）が呼ぶ器の配列の層 src/rules/manifest.rs の list が key の名と行で断り（配列が空である・配列の要素が空文字である）、その値は読み手の declared_of に渡らない。空の配列の宣言は、その行の配列が空の不備と、値が渡らないので run-cap の行の run-cap-paths が無いの不備の 2 つを名指し、本数だけを持って数える dir の無い上限（黙って効かない上限）にはならない。空白だけの項目は配列の層を通るので、読み手の項目の照らしが空であるとして断る。数えの畳み refuse::covered は項目と dir の両方を正規化して段で比べるので、前後に空白を持つ項目（その字のまま何にも当たらない）と、./ のように名の段を持たない項目（正規化で空の字になり何にも当たらない）は、宣言したのに何も数えない上限になる。読み手はこの 2 形も前後に空白を持つ・名の段を持たないの不備にする。本数を宣言が持つのは ADR-63 の決定 (13) の字（値 1 は宣言の鍵が持つ）のとおりで、2 key を 1 本にまとめないのは、宣言の読み手の値の型（字・整数・真偽・字の配列）に本数と dir の列を 1 つで持つ型が無いため。読み手は新しい子 module src/pipe/declaration/run_cap.rs（型 RunCap・HEAD の宣言の口 RunCap::at_head・数えの RunCap::counts・上限の RunCap::holder）で、親の Declared に欄 run_cap と parse の 1 行、optional_keys.rs の key の 2 列に 2 本ずつを足す。数える便は、頭の印を剥がした write-set の項目のどれかが数える dir の下か dir そのもので、畳み方は交差と同じ refuse::covered（段の境目で切る）。

      形（判じ）。判じは受付の子 module src/pipe/cli/intake/run_cap.rs の関数 capped の 1 本で、数える契約の周だけ live な便を読み、同じ周に起こした bead と live な便のうち数える便が本数に達した周に先頭の 1 本の名を返す。live な便の読みは交差の関数 crossings と同じ 1 本 live_contracts に寄せた（crossings の本体から純に移した・読めない周は今と同じ WriteSetUnreadable）。受付（judge）は同時本数の上限 max-live の直後・交差の前に exclude_run_cap を撃ち、上限に達した周に新しい断り Refuse::RunCap（名 run-cap・rc 1・在り処は置き場・理由の 1 行は run-cap run=<run id> cap=<本数>）で断る（短絡しない）。列の候補の段（dispatch/candidates.rs の blocker）は、周に 1 回 HEAD の宣言を読んだ値を Room に持ち、交差の待ちの後・受付の判定の前に同じ capped を同じ周に起こした bead も渡して撃ち、達した周に新しい待ちの理由 WaitReason::RunCap（名 run-cap・描きは run-cap と値をコロンで繋ぐ・値は live な便の run id か同じ周に起こした bead id）で待たせる。判じの本体は 1 本で、受付と列はそれを読むだけ（器の憲法 C2・交差の crossings と同じ形）。宣言を読めない周は上限を持たない形に読むが、その周は受付の判定の freeze が宣言の不備で断る（列は admission で待つ）ので、黙って通す周は無い。局面の contract-queued の理由の表（src/case/mod.rs の QUEUED_TURNS と設計 case-lifecycle.md の表）に run-cap を手番 vessel で足した（交差と同じく器が着地の後の周で拾う）。intake.rs は 1500 行の上限まで 26 行しか無かったので、新しい判じと live の読みを子 module に置き、intake.rs は 1474 行から 1467 行に縮む（write-set の頭の -）。

      起こす道の照らし。新しい便を作るのは受付（pipe run と pipe intake の intake）だけで、列が起こす便も子 process の pipe run --drive が同じ受付を通る。列の 1 周（queue::fire）を撃つのは、dispatch の手動の 1 周（席の dispatch.sh）・印の直後の 1 周（release と first・hold は撃たない）・便の終端と回答と承認の記帳の直後の 1 周（driver が着地の後に次を起こす道）の 3 つで、どれも同じ measure から settle と blocker を通る。起こし直し（revive・pipe resume）は既に live な便で、数えに入っている。席が手で撃つ scribe2 pipe run は列の判じを通らないが、受付の exclude_run_cap が同じ capped で断るので塞いだ。2 つの列の周が近い時刻に重なり、前の周が起こした便の RunCreated より前に後の周が判じる窓（10-05 の実測は印と RunCreated が同じ秒）も、後の便の受付が入口の lock の中で前の便の run を数えて断るので塞いだ（その bead は今の起動の失敗と同じく印 launched で止まり、席の release で列に戻る）。範囲の外は、regate（FR1077）で Gated から戻す便と、席が台帳の外で器を書く写しを作る道（器の便でない）。

      名乗りを別の行にした訳。器への宣言の未知の鍵は宣言の不備で、今 PATH に在る器の binary に 2 鍵を名乗る main を読ませると、全部の受付と列の判定が宣言の不備で止まり、この行の便の着地の終端（push と close の前に宣言を読む）も読めないで止まる（床の写しで今の binary の preflight が未知の key run-cap と run-cap-paths の 2 行で断ったのを確かめた）。そのため .vessel.toml の名乗りは同じノートの行 t-run-cap-on に割り、この行の着地と器の binary の入れ替えの後に流す。

      要件の句。器の要件の正本は根の要件書（design-intent/srs.yaml・判断の記録 ADR-39）で、器の dispatcher の要件 FR1068 は同時走行の最大値（pipe.max_live）を持つが、宣言の鍵の同時の数の上限の句と待ちの理由 run-cap を持たなかった（scribe2/ の下の design-intent/spec の要件書は持ち込みの時の写しで、ADR-60 の句も写っていない）。この行を置く設計の commit で、FR1068 の shall と plain に 2 鍵の上限と受付の同じ判じの断りと待ちの理由 run-cap の句を、型付きの欄 adrs に ADR-63 を、note に ADR-63 の決定 (13) を足す（要件書の版を 1 つ上げ、承認は ADR-63 の裁定 t3-hub.87.14・adrs の欄は床の規則の行 R-17 が散文の名指しに求める・前例は FR1039 の adrs）。

      撤退（ADR-63 の撤退 (8)）。行 v-roots が着地し、器の追随の再 gate と着地の後の検出線が scribe2/ を見るようになったら、席は .vessel.toml の 2 鍵を外す行（行 t-run-cap-on の歯の名乗りを外す形）を置く。器の読み手（この行）は残し、鍵の無い宣言は今のまま 1 本も待たせない（done の 10 番目の項）。それまでに器の床の待ちが 1 日 2 時間を越える日が 7 日に 3 日在れば、v-join と v-roots を繰り上げるかを持ち主に問う。

      done と verify の対応。1 番目の項は verify の 1 行目。2 番目から 7 番目の項は verify の 3 行目（器の lib の vrcap_ の 6 本・宣言の読み手の file と断りの file の歯）。8 番目から 10 番目の項は 4 行目（器の e2e の新しい子 module tests/e2e/pipe/dispatch/run_cap.rs の vrcap_ の 3 本・親 tests/e2e/pipe/dispatch.rs に mod の 1 行と module の doc の 1 句）。11 番目から最後の項は 5 行目から 11 行目（着地した歯 7 本を 1 行に 1 本ずつ名指す・この行が足した名と数に合わせて断言を直した・11 番目の項は 5 行目、12 番目は 6 行目と 7 行目、13 番目は 9 行目から 11 行目、14 番目は 8 行目）。2 行目の器の clippy は done の項にしない。欄 done-teeth は第 0.15 版で足した（名乗りの行 t-teeth-on の着地の後に done の字を替えたので、席の門の器の表の検査が欄を求める）。番号つきの項ごとに歯を名指し、1 番目は verify の 1 行目（@1）、12 番目と 13 番目は名指しの歯を 2 本と 3 本持つ。第 0.8 版の 5 行目は着地した歯 7 本を 1 行の filter に並べていたが、器の表の検査は 1 行の filter の語を 1 つだけ読み、欄の 6 本を撃たれない歯と断るので、第 0.15 版で 1 行に 1 本へ割った（撃つ歯は同じ 7 本）。

      歯と噛み。噛みは試作を commit した後に句ごとに 1 変異を当てて名指しの歯を撃ち、34 変異が全部 rc 100（表は係 w234a の notes.md）。変異の無い木の対照は lib・e2e とも rc 0。第 0.18 版の噛み（係 w240a・試作 63fea01a を commit した後・表は係 w240a の notes.md）は、歯 vrcap_declaration_names_twelve_defects が 6 変異（配列の層 src/rules/manifest.rs の list が空の配列を通す・項目の照らしが空白だけの項目を通す・前後に空白を持つ項目を通す・名の段の無い項目を通す・項目の理由から key の名を外す・項目の理由から項目の字を外す）で、縮めた RunCap::holder の歯 vrcap_holder_names_the_first_counted_run_at_the_cap が 4 変異（上限の比べを越えるにする・数えない便も数える・末の 1 本を返す・上限を見ない）で、どれも rc 100 で落ち、変異の無い対照は rc 0。第 0.8 版の便（t3-hub.87.29 の run 20261005T131240Z）の gate の審査は、読み手の list_of だけを見て run-cap = 1 と空の run-cap-paths が数える dir の無い上限に読まれると判じて FAIL にしたが、配列の層の断りを外す変異を当てた時だけ歯が落ちるとおり、その宣言は第 0.8 版でも読めない宣言の不備だった。同じ根の形（宣言したのに何も数えない上限）を読み手の code で照らし、前の版が通していた前後に空白を持つ項目と名の段の無い項目を第 0.18 版で断る。器の入れ子の歯の全部（cd scribe2 で cargo nextest run --workspace --no-fail-fast）は 4,177 本が全部通り、器の xtask の check も rc 0（core-lines 86080 / 90000・file-lines 1500 / 1500）。

      入口の赤。main には名に vrcap_ を持つ歯が無いので、verify の 3 行目と 4 行目は --no-tests=fail で落ちる。5 行目から 11 行目の着地した歯は main に在り main で通る（この行は断言の字を直すだけで、新しい名と数は 3 行目と 4 行目が持つ）。

      範囲の外。.vessel.toml の名乗り（行 t-run-cap-on）・器の binary の入れ替え（席の手）・数えの物差しの項（待ちの内訳の項 wait_top_h は群 a に在る）・regate の道。
  - n: 11
    type: prose
    title: 行 t-run-cap-on — tsuzuri の器への宣言に器を書く便の同時の数の 2 鍵を名乗る（判断の記録 ADR-63 の決定 (13)・行 v-one-vessel の名乗り）
    body: |
      在りか。差の file docs/design/patch/t-run-cap-on.patch（4,042 byte）は、main 3c86f31a と、その上の試作の commit 10e5add3（tree ac00b973・写しは drafts の try-w234a-on の branch w234a-on・係 w234a）の差（2 file・+52）。.vessel.toml の末（build-lanes の行の後）に注 3 行と run-cap = 1 と run-cap-paths の 1 行を足し、段の file xtask/tests/onevd.rs（歯 2 本・群の main.rs と kfold.rs は書かない）を足す。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      依存と順。depends は v-one-vessel。並べられない訳は、器への宣言の未知の鍵が宣言の不備なので、2 鍵を読める器の binary が PATH に入る前にこの行が着地すると、全部の受付と列の判定と着地の終端が宣言の不備で止まるため（床の写しで今の binary の preflight が未知の key run-cap と run-cap-paths の 2 行で断った）。席は v-one-vessel の着地の後に器の binary を入れ替え、入れ替えの前はこの行の bead を hold に置く（入れ替えは toml の depends では持てない）。並ぶ行 t-teeth-on（係 w232a の下書き・.vessel.toml の entrance-flip の直後に teeth-check の 3 行）とは同じ file の離れた所を書き、main 3c86f31a の一時の index に両順に当てて同じ tree になる（係 w234a の commute.log）。この行は tsuzuri の行で器の code を書かないので、器を書く便の数には入らない。

      なぜ。判断の記録 ADR-63 の決定 (13) は、値 1 と数える path の集まり（scribe2/）を器への宣言の鍵が持ち、器の code に字で書かないとした。器の読み手は行 v-one-vessel が足す。この行の着地の後、write-set に scribe2/ の下の項目を持つ便は、同じ dir の下を書く live な便と同じ周に起こした便が 1 本在る周に、列で待ちの理由 run-cap で待ち、受付で断り run-cap で断られる。席の hold の手（ADR-33 の決定 (12) の今の守り）は、この行の着地の後は要らない。

      撤退（ADR-63 の撤退 (8)）。行 v-roots が着地したら、席はこの 2 鍵と注を外し、歯 onevd_ の名乗りを外す行を置く（鍵の無い宣言は器が今のまま読む）。

      done と verify の対応。1 番目の項は verify の 1 行目、2 番目と最後の項は 3 行目（段の file tests/onevd.rs の onevd_ の 2 本）。2 行目の clippy は done の項にしない。

      歯と噛み。歯は根の .vessel.toml の字を注の行を除いて key で拾う（行 r-lanes-on の歯 vlanes_ と同じ数え方・外の依存を使わない）。噛みは句ごとに .vessel.toml と歯の見本へ 1 変異を当てて rc 100（表は係 w234a の notes.md）。

      入口の赤。main には段の file tests/onevd.rs が無いので、verify の 3 行目は組めずに落ちる。

      範囲の外。器の読み手と判じ（行 v-one-vessel）・器の binary の入れ替え（席の手）・2 鍵を外す行（撤退 (8)）。
  - n: 12
    type: prose
    title: 行 v-gate-findings — gate の判定と数の食い違いを FAIL に読み、場所の列 at を判定の記録に写し、PASS の質の指摘を memo の口へ返す（判断の記録 ADR-63 の決定 (6)(7)・器の行）
    body: |
      在りか。差の file docs/design/patch/v-gate-findings.patch（45,401 byte）は、main c1234912（器の行 v-one-vessel を置いた設計の commit）に、未着地の器の行 v-one-vessel と v-run-write の差をこの順に当てた土台の木（commit 08513985）と、その上の試作の commit 0f6267ba（tree 73391594・写しは drafts の try-w235a の branch w235a-s・係 w235a）の差（9 file・+354 −26）。差は v-one-vessel の差と書く file が交わらず、v-run-write とは e2e の tests/e2e/pipe/gate.rs を両方が書くが hunk が離れている（v-run-write は module の doc と mod の列・この行は findings の歯の段）。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      依存と順。depends は v-one-vessel（同じノート）。並べられない訳は code の依存でなく、器を書く便は同時に 1 本（ADR-33 の決定 (12)・その床を入れるのが v-one-vessel）で、ADR-63 の帰結の 6 番目の項が器の行の数珠を v-one-vessel を先に、この行をそれに依ってと決めたため。v-run-write（t3-hub.80.27.8・hold）とは depends を書かず、両順に当たるので席が便の bead の依存で順を持つ。

      なぜ。判断の記録 ADR-63 の決定 (6) は、gate の審査役が PASS を返し、findings の contract-fit・teeth-nonvacuous・constitution のどれかを 1 以上と数えた周を、器が判定と数の食い違いとして FAIL に読み（理由の型 verdict-count-mismatch・evidence に数えた数）、雛形の判定の決め方に 1 文を足すと決めた。審査役が自分で違反を数えた周なので、判じられない周（INCONCLUSIVE）でなく不合格に読み、器の今の FAIL の道（直前の FAIL の材料を次の便に渡す口 prior_fail・memo の FAIL の口・席の撃ち直し）に乗せる。決定 (7) は、雛形の出す JSON に 0 でない観点ごとの場所の列 at を足して器が判定の記録 verdict.json に写し、器の memo の口（scribe2 ledger memo --run・台帳を読まず書かない）が gate の PASS のうち delete を 1 以上と数えた便からも memo の案（evidence と at を写す）を組めるようにすると決めた。窓の gate の PASS 133 便のうち、3 観点を数えた PASS は 7 便、delete を 1 以上と数えた PASS は 18 便で、どれも器のどこにも行かなかった（ADR-63 の context）。観点の種類と数え方は替えない。席の型の表は雛形に足さない。

      形（読み）。食い違いの材料は findings の集計の型の関数 Tally::mismatch（src/pipe/gate/findings.rs）の 1 本で、3 観点（定数 FIT）のどれかを 1 以上と数えた周だけ 3 観点の件数の字を返す。lens の判定の行の読み judge_pairs（src/pipe/gate/lens.rs）は、集計を読めた周に限り、PASS と食い違いの材料の組を FAIL・理由の型 verdict-count-mismatch（定数 MISMATCH_KIND）・evidence（字 verdict-count-mismatch・PASS を返したが <3 観点の件数の字> を数えた・lens の evidence は <lens の evidence>）に読み替える。FAIL と INCONCLUSIVE の判定と、3 観点を 0 と数えた PASS は替えない。形の読めない周の撃ち直し（reread）は形の誤りの周だけのまま（食い違いは形が読めた周なので撃ち直さない）。判定の型 Judged と記帳の型 Decision に欄 kind（理由の型）と at（場所の列）を足し、settle は verdict.json の findings と population の後に kind と at を在る周だけ足す（schema は 1 のまま・読み手は未知の field を無視する・review.json の kind と at と同じ名）。at は集計を読めた周に lens の at の字が空白だけでない時だけ写し、判定を動かさない（器は at の字を判じない・判断は審査役の領分）。Gated の detail は verdict:FAIL のまま替えないので、直前の FAIL の材料の口 prior_fail（detail の頭 verdict:FAIL と verdict.json の evidence と findings を読む）がそのまま次の便へ渡し、gate の rc は FAIL の 1。赤い verify の周の判定の組みは unjudged の形に寄せた（欄を 2 つ足すため・判定は替えない）。

      形（雛形）。src/headless/lens.txt の 3 行を替える。出すものの節の JSON の形の末に key at（観点とコロンと場所・場所はセミコロンで継ぎ・観点はコンマで継ぐ形）を足し、必須の 2 key の行の次に at の形の行（0 でない観点ごとの場所の列・findings と同じ順・場所は path か path と行か識別子・0 の観点は書かない）を足し、判定の決め方の節の PASS の行の次に ADR-63 の字のままの 1 文「contract-fit・teeth-nonvacuous・constitution を 1 以上数えたら PASS を返さない」を 1 行で足す。決定 (6) と (7) の雛形の替えをこの行 1 本にまとめ、雛形の指紋（lens の版の lens.txt の値）の替えを 1 回にする。gate の prompt の外形の snapshot（e2e__headless__lens_prompt_external_form.snap）は同じ 3 行だけが替わる（契約審査の雛形の snapshot 2 本は替わらない）。

      形（memo の口）。src/ledger/memo.rs の原本に質の形 Material::Quality（delete の件数・evidence・at）を足す。段 Gated の便の verdict.json が PASS の周と、段 Landed の便の verdict.json の周は、関数 quality が、PASS で findings の delete を 1 以上と数えた（読みは gate の 2 key の読みの 1 本 delete_count）周だけ原本にし、delete が 0・数えを読めない・PASS でない周は今の断り not-terminal、evidence が空の周は no-material で断る。Landed の便の verdict.json が無い・読めない周は今のまま not-terminal。plan の題は [memo] の後に質の頭 質 delete — を足して run と段と kind（PASS delete:<n>）を続け、本文の観測は evidence と at（無ければ -）を写す。題の頭は、日次の物差しの質の memo の項 quality_memos_open が数える正規表現（頭の [memo] と空白を許す 質 <型> — ・memo t3-hub.87.22 の notes）と同じ字で、起票の門の memo の印（題の頭の [memo]）も保つ。

      席の起票の手。器の口の題が質の頭を持つのは delete の形だけである。判定と数の食い違いの FAIL の便の plan の題は [memo] <run> Gated FAIL verdict-count-mismatch で、質の頭を持たない。席がこの便を constitution の質の memo として起票する時（verdict.json の findings の constitution が 1 以上の便）は、plan の arg の行の title を [memo] 質 constitution — <run> Gated FAIL verdict-count-mismatch に替えて撃つ。週の memo（stdlib・native・yagni・shrink のまとめ）は器の口を使わず、席が題 [memo] 質 週 — <週の初めの日付> で起票する。器の口の題に constitution と週の頭を足さないのは、食い違いの FAIL は今の FAIL の道で撃ち直され質の memo にするかは席が便ごとに決めるためと、週の memo は便に結ばれないため。

      要件の句。器の要件の正本は根の要件書（design-intent/srs.yaml・判断の記録 ADR-39）で、scribe2/ の下には要件書が無い。器の lens の判定の要件 FR1009 は判定に届かない周の INCONCLUSIVE と撃ち直しだけを持ち、判定と数の食い違いの読みと場所の列の写しと PASS の質の memo の口の句を持たなかった（memo の口の要件は根の要件書に無い）。この行を置く設計の commit で、FR1009 の shall と plain に 2 つの句を、型付きの欄 adrs に ADR-63 を、note に ADR-63 の決定 (6)(7) を足す（要件書の版を 1 つ上げ、承認は ADR-63 の裁定 t3-hub.87.14・前例は係 w234a が FR1068 に足した句）。

      撤退（ADR-63 の撤退 (2)(3)）。判定の食い違いの FAIL の項 gate_mismatch_3d が数えた周のうち、指摘が誤りで PASS が正しかったと席が記帳した数が 7 日で半分を越えたら、読みを外す行を置いて問う。外す形は Tally::mismatch の呼びと雛形の 1 文を外すだけで、場所の列 at と memo の口は残る。3 観点を 1 以上と数えた周の率が、この行の着地の前の 7 日の半分を下回ったら、審査役が数を 0 に寄せた疑いとして問う。開いた質の memo の項 quality_memos_open は、週 1 の掃除の行を 2 本着地させた後も 3 週続けて増えたら、掃除の行の頻度を先に問う。

      done と verify の対応。1 番目の項は verify の 1 行目。2 番目から 6 番目の項は verify の 3 行目（器の lib の vgfind_ の歯・在りかは findings.rs と gate の lens.rs と headless の lens.rs）、6 番目の項は 6 行目（着地した gate の prompt の外形の歯 headless_lens_prompt_external_form・snapshot の file だけを替え、tests/e2e/headless.rs は書かないので write-set の置き場だけの項）でも測る。7 番目から最後の項は 4 行目（器の e2e の vgfind_ の歯・在りかは tests/e2e/pipe/gate.rs の findings の歯の段の後と tests/e2e/ledger_memo.rs）、8 番目の項は 5 行目の着地した歯 pipe_gate_findings_counts_are_recorded_per_category（見本の 3 観点を 0 に直した・3 観点を数えた PASS はこの行で FAIL に読むため）でも測る。2 行目の器の clippy は done の項にしない。xtask の check は器の共通 verify が撃つので verify に書かない。欄 done-teeth は番号つきの項ごとに歯を verify の行の番号（@k）で名指し、名の歯を書かない。器の歯は scribe2/crates/ の下に在り、器の表の検査と gate の段 ① が歯の在りかを探す根（固定の crates/ と宣言の crate-roots の folio2/crates/）の外なので、名の歯は在りか 0 か所で断られるため。done の項の字の歯の名は、その項の @k の行の filter が選ぶ名にした（契約の審査の表の歯は、宣言の @k の行が選ぶ名なら宣言の内に数わる・行 v-atk-names）。着地した歯は filter を 1 語ずつにした別の行（5 行目と 6 行目）に置いた（nextest の行の filter は後ろの 1 語だけが読まれる）。

      置き場の妥協。器の e2e の gate の歯は族ごとに子 module へ置く形（tests/e2e/pipe/gate.rs の module の doc）だが、親の mod の列と module の doc は v-run-write の差が書くので、hunk を離して両順に当てるため、新しい歯 vgfind_ は親の findings の歯の段（同じ領域の着地した歯の後）に置いた。

      字を照らす歯の訳。歯 vgfind_gate_template_names_the_rule_and_the_at は雛形 lens.txt の字を読む。雛形は審査役（AI）への指示の字で、審査役がその字に従うかは器の歯の偽の lens では測れないので、審査役に渡る字そのもの（節の中の 1 文・JSON の形・at の形の行）を照らす。審査役に渡る prompt の全体は着地した外形の歯 headless_lens_prompt_external_form の snapshot が測る。

      歯と噛み。噛みは試作を commit した後に句ごとに 1 変異を当てて名指しの歯を撃ち、全部 rc 100（表は係 w235a の notes.md）。変異の無い木の対照は lib・e2e とも rc 0。器の入れ子の歯の全部（cd scribe2 で cargo nextest run --workspace --no-fail-fast）は全部通り、器の xtask の check も rc 0（core-lines 86370 / 90000）。

      入口の赤。main には名に vgfind_ を持つ歯が無いので、verify の 3 行目と 4 行目は --no-tests=fail で落ちる。5 行目と 6 行目の着地した歯は main に在り main で通る（この行は見本と snapshot を直すだけで、新しい振る舞いは 3 行目と 4 行目が測る）。

      範囲の外。席の型の表を雛形に足すこと（決定 (6) が採らない）・契約審査の雛形が質を数える形（乙' の器の行・決定 (7) の条件つきの段）・物差しの項と席の起票（席の道具・eval_daily.py は verdict.json の kind の字 verdict-count-mismatch と題の頭の字で数える）・器の binary の入れ替え（席の手）・gate の Gated の detail に理由の型を足すこと（読み手 prior_fail と局面の detail の読みを替えないため）。
  - n: 13
    type: prose
    title: 行 ag-floor-rec — 差の file を出す係の床の記録と、終える前の門の撃ち直し（判断の記録 ADR-63 の決定 (4)）
    body: |
      在りか。差の file docs/design/patch/ag-floor-rec.patch（62,155 byte）は、main 099a01cc と試作の木（写しは drafts の try-w242a の branch r1 の commit 3c29f3e3・係 w242a）の差で、中核の終える前の門の判じ crates/tsuzuri-core/src/agent/stop.rs と新しい子 stop/floor.rs、境界の hook crates/tsuzuri-boundary/src/hook/subagent_stop.rs と新しい子 subagent_stop/floor.rs、main.rs の口の doc の 1 行、plugin/hooks/hooks.json の終える前の門の timeout、着地済みの群の module teeth6/agpl.rs の timeout の見込みの 1 字、参照の file plugin/skills/agent-discipline/reference.md の 7 節と 11 節、新しい段の file crates/tsuzuri-boundary/tests/agflr.rs。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。depends は空。第 0.22 版で替えたのは境界の子 subagent_stop/floor.rs と段の file tests/agflr.rs の差だけで、ほかの 7 file の差の字は第 0.10 版の差（main c1234912 と係 w236a の試作の commit 842dadc5 の差）と同じ。同じ参照の file を書く並ぶ行 ag-ref2 と、同じ境界の subagent_stop.rs を書く並ぶ行 ag-budget-floor の差とは hunk の文脈が交わらず、main 099a01cc を読んだ一時の index に 3 本を 6 通りの順で当てて同じ木 24f8374d になった。

      なぜ。判断の記録 ADR-63 の決定 (4) は、終える前の門（ADR-59 の決定 (4)）の欠けに 1 つ足すとした。頭の出す物が差の file を名指す係は、出力の dir に床の記録 floor.tsv を置き、記録は差の file ごとに 1 行で、行の id と preflight・tz check・tz derive --check・器の表の検査（scribe2 contracts check に --base main を渡した周）・verify の 2 行目から最後の行のそれぞれの rc を持つ。記録が無い・行が欠ける・rc が 0 でない時は 1 度目の終わりを止め、門は安い 4 本を床の写しで撃ち直して記録の rc と比べ、食い違いも欠けとして止める。cargo の verify の行は撃ち直さず受ける。撃ち直せない時は、まだ分からない（条 P-7.2）として 1 度目を止め、何が見つからないかを名指す。要否は頭の出す物の字が決め、除外の印は置かない（条 N-3.1）。記録が在る事も撃ち直しの合格も、完成とも審査の合格とも扱わない（条 P-6.3）。

      形。記録の形は日次の物差しが今読む仮の形に合わせた。floor.tsv はタブで区切った 6 欄（行 id・preflight・tz check・tz derive --check・器の表の検査の rc・verify の 2 行目から最後の行の rc を , で繋いだ字）で、# で始まる行は頭。門の記録 floor-gate.tsv は判じるごとに行ごとの 1 行（時刻・終わりの回 1 か 2・行 id・型・詳細）で、型は no-record・no-row・unknown・mismatch・rc・ok、違う rc の詳細は記録と撃ち直しを / で繋ぐ（例 table=0/1）。時刻は器の他の記録と同じ分までの UTC の字（例 20261005T1200Z）で、物差しの読み手が読める。中核の子 floor は純関数だけ（差の file の行・記録の読み・契約表の行の頭と verify の数・器の表の検査の行の rc・行ごとの判じ・門の記録の行）を持ち、境界の子 floor が床の写しと state dir と道具を解いて子 process を撃ち、門の記録に足す。

      器の表の検査の rc。器の表の検査は着地済みの行の断り（write-set-item-unresolved と teeth-outside-write-set）で検査全体の rc が今いつも 1 なので（main c1234912 の床の写しで rc 1・出力 2367 行・ノート surface-wave29c を名指す行は 0）、記録と撃ち直しは、その行の頭（contracts/<ノート>.toml の [[contract]] の行の番号）を名指す断りの行が在れば 1・無ければ 0 とし、検査の rc が 0 と 1 のどちらでもなければその rc を写す。全体の rc を写すと差の file を出す全部の係が毎回止まる。断りの行の頭は contracts と、コロンと空白と file の path とコロンと番号と空白の形（器の出力を実測した）。

      撃ち直しの道具と置き場。床の写しは参照の file の 1 節の名 <置き場>/try-<名>-fl、state dir は係の dir の下の floor-state（無ければ作り、空でなければまだ分からない）。tz は既定でこの hook の binary（plugin の tzw が解く tz）、scribe2 は PATH の名で、旗 --tz と --scribe2 が替える（面の口 tz surface serve の同じ旗と同じ形・歯は偽の殻の script を渡す）。preflight の --bead は札の対象（preflight は --placed の無い周に bead を判じに使わない・在らない bead でも ok を実測した）。器の表の検査を別の子で撃ちながら tz check と tz derive --check と行ごとの preflight を順に撃ち、全部の上限は 100 秒（子の標準出力と標準エラーの読み終わりも上限の内だけ待つ）で、越えた子は process group ごと止めてまだ分からないにする。tz check か tz derive --check を撃ち直せない周（撃てない・上限を越える・signal で止まる・design-intent の dir が無い）も、撃ち始めた器の表の検査の子を待ち終えずに手放す時に process group ごと止めて待ち、門の返りの後に子を残さない（子を持つ値 Shot を待ち終えずに捨てると Drop が group ごと止めて待つ形にした・第 0.22 版）。実測は main の床の写しで器の表の検査 18〜21 秒・tz check 4 秒・derive 0.1 秒・preflight 0.3 秒（load average 20 前後）。hooks.json の終える前の門の timeout は 10 秒では器の表の検査が終わらないので 120 秒にした。差の file を名指さない係は今のまま何も撃たない。

      実装の約束と done と verify の対応。1 番目の項は verify の 1 行目。2 番目から 13 番目と 15 番目と最後の 16 番目の項は 3 行目（新しい段の file tests/agflr.rs の歯 agflr_）、8 番目の項は 5 行目（着地済みの歯 agsg_hook_passes_a_whole_stop_and_marks_it_ended と agsg_hook_holds_the_first_stop_with_one_hole・本文を替えない・file は write-set の置き場だけの項）でも、14 番目の項は 4 行目（着地済みの群 teeth6 の module agpl.rs・歯の本文は替えず、助け wanted の timeout の見込みの 1 字だけを替えた）で測る。2 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので verify に書かない。欄 done-teeth は番号つきの項ごとに歯を名指し、1 番目は verify の 1 行目（@1）、8 番目と 14 番目の着地済みの歯は本文を替えない既存の歯（=・14 番目は第 0.22 版で = に直した）。入口の赤は、main では新しい段の file と中核の子 module が無く 3 行目が組めず、4 行目は hooks.json の timeout 10 で落ちる。16 番目の項の歯は、第 0.10 版の差の境界の floor.rs の上でも落ちる（器の表の検査の group が残る）。

      歯と噛み。新しい段の file tests/agflr.rs（判断の記録 ADR-32 の決定 (3)・群の main.rs と kfold.rs は書かない）。境界に置くのは、hook の binary を撃つ着地済みの歯 agsg_ と同じ crate に寄せるため。hook の歯は偽の tz と scribe2（撃たれた cwd と引数を log に足す殻の script）を旗で渡し、置き場は CARGO_TARGET_TMPDIR の下。参照の file の句は、手引きが天井の文で振る舞いを持たないので、節の塊の中の字を照らし、1 度だけである事を数で断言する（決定 (2) の (d) の訳）。噛みは係が撃った（表は係 w236a の notes.md の 4 節）。第 0.22 版の噛み（係 w242a・試作の commit 3c29f3e3 の後・表は係 w242a の notes.md）は、歯 agflr_hook_stops_the_table_group_when_another_rerun_fails が 5 変異（境界の floor.rs を第 0.10 版の字に戻す・手放した子を止めない・子だけを止めて group を止めない・tz check の Err の周だけ器の表の検査を止めずに忘れる・tz derive --check の Err の周だけ同じく忘れる）でどれも rc 100 で落ち、変異の無い対照は rc 0。歯は 2 つの見本（design-intent の dir の無い床の写しと、signal で止まる tz check）を撃ち、偽の器の表の検査は自分の pid（group の id）を書いてから子の sleep を待ち続け、偽の tz はその字を待ってから返して撃ちの順を固め、門の返りの後に /proc の stat でその group に zombie でない process が 5 秒の内に居なくなる事を断言する（見た後に group へ KILL を送って片付ける）。前の版の便 t3-hub.87.36.1 の gate の審査は、tz check か tz derive --check が Err を返すと器の表の検査の子が止められずに残り、goal の越えた子は process group ごと止めての句に反するとして FAIL にした。

      置き場の妥協。後で置く行 ag-budget-floor（予算の記録 usage.json・同じ終える前の門）が並べて置けるよう、この行は中核の stop.rs には頭の doc の 1 行と子 module の宣言だけを、境界の subagent_stop.rs には頭の doc の 2 行と子 module の宣言と USAGE と引数の読みの 2 行と欠けの足しの 1 行だけを書き、判じと撃ち直しの本体を子 module に置いた。

      U と範囲の外。門の tz は hook の tz で、係が床を撃つ席の pin の tz と版が違えば tz check の rc が食い違いうる（その時は 1 度目だけ止まる・撤退 (5) の食い違いの数が見る）。係の札の結び（.agents/<係の id>）が無い係は今の門のまま通る（終える前の門の全部が効かない・この行は替えない）。物差しの読み手（席の道具 eval_daily.py の agent_stop_floor）は形を替えないので直さない。予算の記録 usage.json と下限は行 ag-budget-floor。要件 FR21 の shall と plain と adrs と note は、この行を置く設計の commit で適用の script が書く。上限 100 秒の越え（子の出力の読みの待ちを含む）は歯で撃たない（1 本に 100 秒かかる）。
  - n: 14
    type: prose
    title: 行 ag-ref2 — 頼みの共通の文の残り 7 項を参照の file へ移す（判断の記録 ADR-63 の決定 (2) の続き）
    body: |
      在りか。差の file docs/design/patch/ag-ref2.patch（9,283 byte）は、main c1234912 と試作の木（写しは drafts の try-w236a の branch r2 の commit 091e077b・係 w236a）の差で、参照の file plugin/skills/agent-discipline/reference.md の 5 か所（1 節・3 節・6 節・8 節・9 節）と、着地済みの段の file crates/tsuzuri-boundary/tests/agref.rs の句の表と頭の doc の 2 file。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。depends は空。同じ参照の file を書く並ぶ行 ag-floor-rec（7 節と 11 節）とは hunk の文脈が交わらず、一時の index に両順で当てて同じ木 f61a0047 になった。

      なぜ。判断の記録 ADR-63 の決定 (2) は、参照の file を席の起草の決まりの唯一の正本とした。行 ag-ref は決定 (2) が数えた頼みの共通の文の 3 項を移したが、grep で照らすと参照の file と SKILL.md のどちらにも無い項がほかに 7 つ在った（係 w232a の起草の記録・memo t3-hub.87.28）。この行はその 7 項を移し、共通の文を退役させられる形にする。退役（席の置き場の退役の dir への mv）と、頼みの文から共通の文を指さない事は、席がこの行の着地の後に撃つ（ADR-59 の決定 (6) の、移した後は頼みの文から指さないの履行）。

      形。1 節（置き場）に、本物の repo に一時の物も書かず一時の index の照らしも写しの中で撃つ項と、TMPDIR を /tmp/<名>-t にする項（係の dir の下は repo の中で歯が落ち、長い path は tmux の socket の path の上限で落ちる訳つき）。3 節のノートの行の項に、行の数を contracts/<ノート>.toml の id = の行で数える 1 文（適用の script の節の番号は行の数でない）。6 節に、働きを通らない照らしは審査で落ち、歯は足す物の在る見本で働きを通す項。8 節の末に、出す物の file の名に findings も使わない事と、最後の返事（席への知らせ）を 10 行以内の日本語で要点と出力の path を書く事の項。9 節に、着地の窓が閉じている間は写しの commit も門が断るので試しは commit せず write-tree の木の hash で撃つ項。参照の file は 98 行から 103 行になる。着地済みの段の file agref.rs の句の表に 7 句を足し（表の長さを 12 から 19 に）、頭の doc に行の名と残りの 7 項を足す。歯の fn の本文は替えない。

      機械で決まる項（決定 (1)）。TMPDIR の形・出す物の file の名・返事の行の数は機械で数えられるので、門へ上げる行の案を係の notes.md の 6 節に書いた。この行では天井に書き、門の行は起こさない（頼みのとおり）。門が着地したら、その項の末に門の名を書き、天井の字は門の名を指す 1 句に縮める。

      done と verify の対応。1 番目の項は verify の 1 行目、2 番目と最後の 3 番目の項は 3 行目（着地済みの段の file tests/agref.rs の歯 agref_）で測る。同じ行の着地済みの歯 agref_copied_width_and_old_budget_are_named と agref_help_width_tooth_lives_in_the_vessel も撃たれて緑のまま（本文を替えない・done に載せない）。2 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので verify に書かない。欄 done-teeth は番号つきの項ごとに歯を名指し、1 番目は verify の 1 行目（@1）。入口の赤は、main の参照の file では 7 句が無いので 2 番目と 3 番目の項の歯が落ちる（3 行目が rc 100）。

      歯と噛み。句は行 ag-ref と同じ段の file の同じ表で測る（同じ参照の file の句の照らしを 2 本に割らない・新しい段の file を足さない）。参照の file は天井の文で振る舞いを持たないので、歯は字を節の塊の中で照らし、1 度だけである事を数で断言する（決定 (2) の (d) の訳）。噛みは係が撃った（表は係 w236a の notes.md の 4 節）。

      U と範囲の外。共通の文の退役の mv と頼みの文の直しは席の手。門へ上げる行（出す物の名・返事の行の数・TMPDIR）は別の行。SKILL.md は替えない（本文の字数と決まりの行の数を着地済みの歯 agpl_ が断言する）。
  - n: 15
    type: prose
    title: 行 ag-budget-floor — 起こしの予算の下限 15 万と予算の記録 usage.json（判断の記録 ADR-63 の決定 (3) と決定 (9) の予算の口）
    body: |
      在りか。差の file docs/design/patch/ag-budget-floor.patch（26,346 byte）は、main 36e74bb7 と試作の commit 9e2adafd（tree 7872d6da・写しは drafts の try-w238a の branch w238a-s・係 w238a）の差（4 file・足す 399 行・消す 6 行）。字を書き替える file は中核の crates/tsuzuri-core/src/agent/spec.rs（310 → 327 行）と crates/tsuzuri-core/src/agent/meter.rs（175 → 236 行）と境界の crates/tsuzuri-boundary/src/hook/subagent_stop.rs（109 → 124 行）、新しい file は段の file crates/tsuzuri-boundary/tests/agbf.rs（300 行）。土台の木で git apply --check、試作の木で git apply --reverse --check がどちらも rc 0。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。1 番目の項は verify の 1 行目、2 番目から最後の項は verify の 3 行目（段の file crates/tsuzuri-boundary/tests/agbf.rs・接頭辞 agbf_）で測る。verify の 2 行目（中核と境界の 2 crate の clippy）は lint の落ちが無いことを命令の rc で測る守りで、done の項にしない。xtask の check は器の共通 verify が撃つので verify に書かない。欄 done-teeth は 1 番目の項を verify の行の番号（@1）で、ほかの項を名の歯で名指す（名乗りの行 t-teeth-on は着地済み）。

      依存と並べ方。depends は空。同じ段の並ぶ行 ag-floor-rec（係 w236a）は、境界の subagent_stop.rs を両方が書くが、変えた行の間を 3 行以上離した（この行は module の doc の手順 6 の続きの 1 行・中核の meter の use の 1 行・claim_holes の後の助けの fn・run の末の 0 の前の 1 行、ag-floor-rec は doc の群の段の後と子の module の宣言・使い方の字・引数の読み・欠けの足し）。中核の stop.rs はこの行が書かない。係 w236a の試作の commit 842dadc5 の差とこの行の差は、main 36e74bb7 を読んだ一時の index に両順で当たり同じ木 9262199e になった。2 行とも要件 FR21 を書くが、適用の script はどちらも先に置かれた字を見て足す（この行は shall の文「生きた係と対象が重なれば断られる（同じ群の係どうしは FR22）。」の直後に句を差し込み、adrs に ADR-63 が無い時だけ足し、note の行の末に 1 文を足す）。

      なぜ。判断の記録 ADR-63 の決定 (3) は、起こしの門（ADR-59 の決定 (2)）が頭の予算が新しい量 15 万より小さい起こしを、直した頭の見本を付けて断ると決めた。10-04 からの 100 体のうち予算 10 万以下の 9 体は全部越え、出来ない予算で書き終えの段に入り新しい 1 体に頼み直す往復を生んだ。値は中核に置く下限の定数 1 つが持ち、群の係ごとの上限 MEMBER_NEW（ADR-61 の決定 (2)・今同じ 15 万）とは共有しない。下限は全部の起こし、上限は群の係ごとで中身が違い、共有すると群の上限を上げた時に下限が黙って上がるためで、歯で下限が上限以下である事を見る（一致を強いる写しでないので条 P-2.4 に当たらない）。決定 (9) は、物差しの予算の項 drafter_budget_over と着地 1 本あたりの量の項 landing_tokens_median_3d の口として、係の終える前の門（ADR-59 の決定 (4)）が係の新しい量と頭の予算と倍率を起草の置き場の係の dir の usage.json に書き、物差しが前の日の分を読むと決めた。台帳の持ち手の memo t3-hub.87.16 の notes は、記録が起草した行の id（頼みの頭の対象）を持ち、着地ごとに器の便の量と起草係の量を足してから中央を取る読みにした。

      下限の形。中核の spec.rs に定数 BUDGET_MIN（150_000）を置き、頼みの頭の読み head が予算の形を読んだ後に下限より小さい値を断りの型 HeadError::Low（値）にする。起こしの判じ judge は今までどおり頭の断りを理由にし、理由の字は値と下限を名指して、直した頭の見本（関数 fixed）の予算の行だけを字 token <150000 以上の数> にする（形の違う予算の行は今までの書き方 token <数>、下限から上の値はそのまま）。群の起こしの口（境界の hook/agent_spawn/group.rs）は頭が読めない呼びを ADR-59 の判じに任せるので、群の係の起こしも同じ下限で断られ、群の係の頭の予算はちょうど 15 万だけが通る（ADR-63 の帰結の決定 (3) の費えの項）。

      予算の記録の形。中核の meter.rs に、係の記録の全部の新しい量を数える関数 spent と、記録の型 Tally と file の名の定数 TALLY（usage.json）を置く。置き場は、新しい量の数え（assistant の行の usage の 1 行の読み）を持つ測りの module で、数えを 2 か所に書かないため（領域の親の順）。記録は整えた JSON の 1 つの object で、鍵は name（起こしの名）・type（係の型）・target（頼みの頭の対象＝起草した行の id）・budget（頭の予算）・used（新しい量）・ratio（倍率＝used を budget で割り小数 3 桁に丸めた数）・at（札の終えの印の epoch 秒）の順。節は二重引用符を書けないので鍵と字の値の囲みを省いた形で書いた。戻し方は、鍵ごとに二重引用符で囲み、name・type・target の値も二重引用符で囲み、数の値はそのまま。

      数え方と読む所。数えは席の道具 usage.py（transcript の input＋cache_creation＋output）に合わせ、type が assistant で message に usage の在る行だけを読み、同じ応答の id（message の id）の行は離れていても最後の行だけを数え、id の無い行は 1 行ずつ数え、cache の読み（cache_read）は数えない。読む所は、終える前の門の入力（SubagentStop の入力）の欄 agent_transcript_path の file（席への SendMessage の知らせの欠けを数えるのに門が既に読む同じ係の記録）で、親の session の subagents の下の agent-<係の id>.jsonl に当たる。席の道具との違いは 2 つ。席の道具は名が同じ係の記録を全部足すが、門は終わる係の 1 本だけを数える（同じ名の起こし直しは札と記録を上書きする）。門が撃たれた時に最後の応答の usage の行が記録に書かれているかは測っていない。

      書く時。境界の hook の run は、通す終わり（欠けの無い 1 度目と、欠けを記帳して通す 2 度目）に札へ終えの印を書いた後、0 を返す前に係の dir の usage.json を書く（助けの関数 tally）。1 度目の止め（rc 2）では書かず、係が続けて次に終わる時に記録の全部で書く。係の記録が読めないか空の時は数えずに書かず、標準エラーに 1 行書いて通す（新しい量 0 の記録で越えを隠さないため・分からないと出す）。書けない時も標準エラーに書いて通す（ADR-59 の決定 (4) の通しのまま）。

      読み手。日次の物差し（席の道具 eval_daily.py・repo の外）の drafter_budget_over は、前の日に終えた係の usage.json を型ごとに数えて越えの率と倍率の中央を出し、landing_tokens_median_3d は着地の bead の行（台帳の acceptance の design の行）を対象に持つ記録の used を器の便の量に足してから中央を取る。読み手の差は係の出す物の seat-eval.diff に在り、席が着地の後に当てる（この行に入れない）。

      歯と噛み。段の file の歯は、中核の関数を直に撃つ歯と、tz の binary の hook を標準入力で撃つ歯（置き場は CARGO_TARGET_TMPDIR の下・本物の起草の置き場と git config を読まない）。噛みは試作を commit した後に句ごとに 1 変異を当てて名指しの歯だけを撃ち、句ごとの変異が全部 rc 100（表は係 w238a の notes.md）。変異の無い木の対照は rc 0。中核と境界の名が ag で始まる着地した歯の全部も試作の木で通った。

      入口の赤。main には段の file agbf.rs が無いので、verify の 3 行目は nextest が test の target を見つけられず rc 101、1 行目は rc 1。

      範囲の外。参照の file（reference.md）と係の型の file（plugin/agents）の頭の見本の字は替えない（門の断りの理由が見本を持つ）。日次の物差しの読み手は席の道具なので行に入れない。下限の値の問い直しは撤退 (4) の数え（予算の項が読めるようになってから 14 日）で行う。
  - n: 16
    type: prose
    title: 行 v-commute-ledger — 差の当たりで通した組の便の、その後の着地の出来事を出来事の記録に記す（判断の記録 ADR-60 の決定 (4) の着地の側・器の行）
    body: |
      在りか。差の file docs/design/patch/v-commute-ledger.patch（49,595 byte）は、main f4bbc16f に未着地の器の行 v-one-vessel の差を当てた土台の木（commit 9549bb1f）と、その上の試作の commit 730bb11c（tree c016cf9e・写しは drafts の try-w237a の branch w237a-ledger2・係 w237a）の差（15 file・+474 −24）。書く file は v-one-vessel と交わらず、差は main f4bbc16f 単独にも当たる。便は差を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。器を書く便は同時に 1 本まで（判断の記録 ADR-33 の決定 (12)・判断の記録 ADR-60 の決定 (10)）。

      依存と順。depends は空。差は器の列の前の行（v-one-vessel・v-run-write・v-gate-findings）と書く file が交わらないか、交わる e2e の file tests/e2e/pipe/gate.rs の hunk が離れていて、main f4bbc16f を読んだ一時の index で v-one-vessel の後にこの差と v-run-write と v-gate-findings をどの順に当てても当たり、同じ木になる（係が写しで撃った・係 w237a の notes.md）。器を書く便は同時に 1 本までなので、順は便の bead の依存か席の hold で持つ。意味の依存は、kind OverlapCommuted の行と、その detail の形（run= と with= と files= と main=）を足した着地済みの行 v-commute-wire だけ。

      なぜ。判断の記録 ADR-60 の決定 (4) は、通した組を出来事の記録に 1 行記帳し（行 v-commute-wire が着地させた）、その組の後の着地では、積み直しの衝突・撃ち直しの間に main がまた動いた周（stale）・追随の再 gate の不合格・着地の列の候補の木の赤を分けて記帳し、着地の差と差の file の行の差の数も添えると決めた。決定 (5) は、この記帳が着地した後の器の行で規則の行 pipe.overlap_commute を真にすると決め、撤退の欄の (ア) は組の後に着地する便が衝突・再 gate の不合格・候補の木の赤のどれかに当たった数を 7 日で数え、stale を別に数えるとした。今の器は、衝突と stale を便の段の行（RunStage の detail の rebase-conflict と stale）に書くが、再 gate の不合格は追随の段の後の gate の判定と見分けられず、候補の木の赤はどの便の記録にも出来事として残らず、どの便が通した組の便かも段の行からは読めない。

      形（記帳の型）。src/fleet/mod.rs の EventKind に OverlapFollowed を宣言の末に足し（KINDS の末・字は OverlapFollowed・既定の actor は machine）、形は OverlapCommuted と同じ Case（便に紐づかない＝replay が便を作らず段も detail も動かさない）とし、本体の型 Case に欄を持たない Followed を足した。src/fleet/event.rs は bead と空でない detail を要る読み手 followed_of を、src/fleet/replay.rs は 2 つの網羅の match の何もしない腕に足した。KINDS の母集団が 32 から 33 になるので、母集団と末尾を断言する着地した e2e の歯（fleet.rs の fleet_kinds_follow_declaration_order・fleet/json.rs の 3 本・fleet/account.rs の 1 本・pipe/gate.rs の 2 か所）の数と末尾の字を直した（LimitPermitted は末尾の 2 つ前）。

      形（記帳の module）。src/pipe/commute.rs の子の module src/pipe/commute/ledger.rs（可視は crate の pipe の中）に、閉じた 5 語の型 Followed（conflict・stale・regate-fail・train-red・landed）と、記す便の型 Mark（置き場・便 id・契約の bead・lock の待ち方）と、2 本の関数 note と landed を置く。どちらも置き場の出来事の記録を読み、kind OverlapCommuted の行の detail の run= の値か with= の 1 つが便 id と等しい周（組に名の在る便）だけ、kind OverlapFollowed の行を 1 件書く（bead は便の契約・detail は run=<便 id> word=<語> と語ごとの尾）。landed の尾は diff=<着地の差の変えた行の数> patch=<差の file の変えた行の数> off=<片方にだけ在る変えた行の数> で、着地の差は着地の commit とその親の差（git diff）、差の file は契約の欄 patch の path を着地の commit の木から読む。変えた行は hunk の中の + と - の行で、字ごとの本数で比べ、off は字ごとの本数の差の絶対値の和。読めない側の数と off は字 -。記帳は撤退の数えの材料で着地の判じに使わないので、記録を読めない・書けない周も着地の結末と rc は替えない（着地の後の検出の起こしと同じ極性・書けない行は捨てる）。

      形（呼び手）。src/pipe/follow.rs の on_conflict（rebase-conflict の段の行の記帳の後）と on_stale（stale の段の行の記帳の後）が語 conflict と stale を、src/pipe/land.rs の追随（follow_main）は再 gate が落ちた周に新しい関数 regate_failed を呼び、便の判定が FAIL の周だけ語 regate-fail を、src/pipe/train.rs は候補の木の検査が赤の周（列を解く段 why=verify）に新しい関数 red で積んだ便の全部へ語 train-red（尾 train=<積んだ本数>・どの便が赤かは帰属しない）を、src/pipe/land/finish.rs の finish は RunDone の Landed の記帳の後に landed を撃つ（列の着地も列の各便が finish を通る）。組に名の無い便は 1 字も書かない。

      done と verify の対応。1 番目の項は verify の 1 行目。2 番目から 4 番目の項は 3 行目（器の lib の vcledger_ の 3 本・src/pipe/commute/ledger.rs の歯）。5 番目から最後の 10 番目の項は 4 行目（器の e2e の新しい子 module tests/e2e/pipe/land/commute.rs の vcledger_ の 6 本・親 tests/e2e/pipe/land.rs に mod の 1 行と module の doc の 1 句）。e2e は組の行を置き場に手で 1 件積み（受付の通した組と同じ形）、land の外形と出来事の記録を測る。2 行目の器の clippy は命令の rc で測る守りで、done に載せない。xtask の check は器の共通 verify が gate の各段で撃つので verify に書かない。直した KINDS の歯は共通 verify の器の歯の全部で撃たれる。欄 done-teeth は 1 番目の項を検証行の番号の歯 @1、ほかの項を名の歯にした。

      歯と噛み。噛みは試作を commit した後に句ごとに 1 変異を当てて名指しの歯を撃ち、22 変異が全部 rc 100（表は係 w237a の notes.md）。変異の無い木の対照は lib・e2e とも rc 0。器の入れ子の歯の全部（cd scribe2 で cargo nextest run --workspace --no-fail-fast）は 4,186 本が全部通り、器の xtask の check も rc 0（core-lines 86287 / 90000）。

      入口の赤。main には名に vcledger_ を持つ歯も tests/e2e/pipe/land/commute.rs も無いので、verify の 3 行目と 4 行目は --no-tests=fail で落ちる。

      範囲の外。規則の行を真にする（行 v-commute-on）・撤退の欄の数えの道具（席の手・器の記録の kind OverlapCommuted と OverlapFollowed の行と、bead の付記の印 omitted-dep と、着地と審査の記録を読む）・印 omitted-dep は bead の付記に在り器は読まない・器の binary の入れ替え（席の手）。この行の契約表の行は欄 patch を書かない（書く file は全部が器の dir の下で再 gate の面の外なので、規則の行が真でも判じは outside-face で断る）。
