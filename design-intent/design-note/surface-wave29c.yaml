  - n: 7
    type: prose
    title: 行 t-kfold-cap — 群の行と段の file の上限を束ねの表の file の定数に置き、名指した群の越えだけを落とす命令 kfold-cap を足す（判断の記録 ADR-63 の決定 (8) の (a)）
    body: |
      done と verify の対応。1 つ目の項は verify の 1 行目、2 つ目から 9 つ目の項は verify の 3 行目（段の file xtask/tests/kcap.rs・接頭辞 kcap_）、10 番目と最後の項は verify の 4 行目（群 teeth1 の module kfold・接頭辞 kfold_）で測る。done の項は歯が測る物だけにした。verify の 2 行目（cargo clippy -p xtask --all-targets --no-deps -- -D warnings）は lint の落ちが無いことを命令の rc で測る守りで、done の項にしない。xtask の check は器の共通 verify が撃つので verify に書かない。欄 done-teeth は書かない（名乗りの行 t-teeth-on の前に置く・判断の記録 ADR-63 の決定 (11)）。

      在りか。差の file docs/design/patch/t-kfold-cap.patch（23,027 byte）は、main fefb3056（判断の記録 ADR-63 の置き）の上の試作の commit a4844981 から切った（git diff --full-index・4 file・足す 477 行・消す 23 行）。新しい file は xtask/src/kcap.rs（236 行）と段の file xtask/tests/kcap.rs（199 行）、字を書き替える file は xtask/src/main.rs（716 → 729 行）と xtask/tests/teeth1/kfold.rs（215 → 221 行）。土台の木で git apply --check、試作の木で git apply --reverse --check がどちらも rc 0。

      なぜ。判断の記録 ADR-63 の決定 (8) の (a)。群の行の上限 1 万行（持ち主の裁定・ADR-32 の決定 (2)）と段の file の上限 24 本は、今まで席の道具が持っていた（畳みの道具 fold2.py の引数の上限の行と、日次の物差しの字 10000・ADR-32 の決定 (10)）。決定 (8) は 2 つの値の持ち手を repo の中の 1 か所（束ねの表の file kfold.rs の定数）へ替え、値と比べる撃ちを歯にせず xtask の下の命令にして、畳みの行の verify だけが名指すと決めた。全部の行の歯（共通の verify の xtask の check）に入れると、群の歯を書く行と段を足す行が全部の便の gate で落ちうるからである。

      定数と字の形。kfold.rs の関数 read の後に、行頭からの 2 行 const GROUP_LINES_CAP: usize = 10_000; と const STAGE_FILES_CAP: usize = 24; を置く（表 GROUPS の行から 12 行以上離した・並ぶ行が GROUPS の数を替えても差の文脈が重ならない）。固い形は、行頭から字 const・空白・名・コロン・空白・字 usize・空白・等号・空白・数字と _ だけの値・セミコロンで行が終わる 1 行で、定数ごとにちょうど 1 行。命令はこの形の行だけを読み（頭に pub などが付けば 0 行と数えて rc 2・値に数字と _ のほかの字が在れば rc 2）、席の道具も同じ形を正規表現 ^const (GROUP_LINES_CAP|STAGE_FILES_CAP): usize = ([0-9_]+);$ で読む。値の正本はこの 2 行だけで、命令と席の道具は名と行の形だけを持ち、値を持たない（条 P-2.3）。

      読みの道。字の読みにした。命令は撃つ時に、根の下の xtask/tests/ の下の群の dir の kfold.rs（ちょうど 1 本・群の名が替わっても file の名で探す）を字で読む。src から kfold.rs を #[path] の module として読む道は、kfold.rs の頭の #![cfg(test)] のため歯でない組みでは中身が空になり、kfold.rs の歯が binary の側でも組まれて 2 度走るので採らない。include! の道は、内の属性と test の属性の fn を持つ file を取り込めないので採らない。字の読みの得は、席の道具（python）が同じ字を同じ形で読めることと、歯が toy の木の kfold.rs に小さな上限を書いて読みから判じまでの全部の道を通せることである。逆向きに kfold.rs は #[path] で src/kcap.rs を読み、歯 kfold_caps_read_back_by_kfold_cap が命令の読み（関数 caps）でこの file 自身の字（include_str!）から 2 つの値を読み直して定数と比べる。これは source の字を照らす歯で、振る舞いで測れない訳は、値の持ち手が定数の行の字そのもので、席の道具は組んだ値でなく字を読むので、字の形が命令の読みと合うかは字でしか測れないからである（判断の記録 ADR-63 の決定 (2) の (d)）。kfold.rs の関数 members と groups_of の中身も命令の関数（members と groups）に替えて群の探しを 1 つにし、module の宣言に命令の測りと判じを使わない訳の dead_code の expect を付けた。

      数え（畳みの道具 fold2.py と同じ・判断の記録 ADR-63 の決定 (8) の (a)）。member は根の Cargo.toml の members の表、群は member の tests/ の直下で main.rs を持つ dir、群の行は群の dir の直下の名が .rs で終わる file（main.rs を除く）の行の和、行は改行の数に、改行で終わらない最後の行を 1 つ足した数（python の file の行の繰り返しと同じ）。下の dir（common/mod.rs など）は数えない。段は member の tests/ の直下の名が .rs で終わる file。上限は越えた時だけ越えとし、ちょうど 1 万行は通す（畳みの道具は足すと上限を越える file から次の群を開く）。

      命令の形。撃ち方は cargo run -q -p xtask -- kfold-cap <群の dir> ...（根からの相対の path・表 GROUPS の行と同じ字）。畳みの行は書く範囲に持つ群と作る群を全部名指す。出力は標準エラーへ、頭が字 xtask kfold-cap とコロンの行で、上限の行（2 つの値と読んだ file）・群ごとの行（名指しと越えの印）・段の在る member ごとの行・段の合計の行（上限に届けば印）・名指した群の数と越えの数の行の順。rc は、名指した群が全部上限の内なら 0、名指した群に越えが 1 つでも在れば 1、名指しが空・名指した字が群でない・木や上限の行を読めない時は 2。名指さない群の越えは印を付けて名指すだけで rc を替えない（起草から着地までの間にほかの行の着地で群が越えても、畳みの行が落ちないため）。歯の印で外す形（#[ignore]）は作らない（条 N-3.1）。main.rs の task の呼びは insta-refs と同じ形（module の関数が rc と行を返し、main.rs の出力の手 emit_err が書く）。

      段の本数は落とす条件に入れない。決定 (8) の (a) は、命令が比べて落とす物を畳みの行が書く範囲に持つ群と作る群に限り、段の file の上限 24 本は (b) が、届いた日に席が段を足す行を器の列で待たせる（hold）形で持つ。畳みの行は未着地の行の書く範囲と verify が名指す段の file を畳まないので（ADR-32 の決定 (4)）、畳みの後にも段は残りうるし、起草から着地までの間にほかの行の着地で段は増える。段の本数で落とすと、畳みの行がほかの行の着地で落ちることになり、(a) が群の越えで避けた落ちと同じになる。そこで段の本数は member ごとと合計を出力に名指し、上限に届けば印を付けるだけにした。

      命令を全部の行の歯にしない。この行の歯は一時の dir の toy の木（member 2 つ・群 3 つ・main.rs を持たない dir 1 つ・段 3 本・toy の kfold.rs の上限は群 10 行と段 2 本）で命令の関数 run を撃ち、本物の木の群の行を上限と比べない。xtask の binary の撃ちの歯は群でない字を名指して rc 2 を測るので、本物の木の群の大きさで結果が替わらない。歯 kfold_caps_read_back_by_kfold_cap は kfold.rs の字だけを読む。共通の verify の xtask の check が撃つ歯は、群の行と段の本数がどう替わっても落ちない。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      歯と噛み。試作の木で verify の 4 行が全部 rc 0、土台の木（main fefb3056）で 1 行目が rc 1、3 行目が rc 101（test target kcap が無い）、2 行目と 4 行目が rc 0（4 行目は着地済みの kfold_ の歯だけが走る）。xtask の歯の全部（cargo nextest run -p xtask）も試作の木で緑。噛みは試作を commit した後に句ごとの変異 21 を 1 つずつ当て、名指しの歯が全部 rc 100 で落ちた（対照は rc 0）。変異は、名指しの越えの数えを 0 にする・名指さない群の越えも数える・main.rs の除きを外す・.rs の絞りを外す・下の dir を数える・改行で終わらない行を数えない・上限の値を字でなく固い数にする（群と段）・pub の付いた行を読む・値の字に空白と + を許す・値の _ を読み飛ばさない・段の本数でも落とす・群でない名指しを通す・main.rs を持たない dir を群にする・空の名指しを通す・main.rs の task の呼びを外す・出力の頭の字を替える・kfold.rs の 2 つの定数の行の形を替える・members の読みをずらす（2 つ）。

      今の木の数（main fefb3056 にこの差を当てた木で、群 23 を全部名指して撃った・rc 0）。群の最大は境界の teeth2 の 9,996 行で、1 万行を越える群は 0。9,000 行を越える群は 16、9,900 行を越える群は 5（境界の teeth2 と面の teeth1〜teeth4）。段は 1 本（この行の xtask/tests/kcap.rs）。群の行は畳みの道具の数え（python の file の行の繰り返し）と 23 群とも同じ。

      並ぶ行と依存。同じノートに置く行 ag-ref（参照の file と境界の段の file）と t-teeth-on（.vessel.toml と xtask の群 teeth1 の vlanes.rs）とは書く file が重ならず、kfold.rs の表 GROUPS にも触れない。3 つの差を main fefb3056 の一時の index に 3 つの順で当て、全部当たった。depends は空。

      範囲の外。席の道具（畳みの道具 fold2.py と日次の物差しの code の項）が kfold.rs の定数の行を読む直しは repo の外で、席が当てる。参照の file の畳みの行の節に、畳みの行の verify に命令 kfold-cap を書く 1 文を足すのは、参照の file を書く行 ag-ref の着地の後に席が決める。器の入れ子の workspace の歯は束ねの表の外なので数えない。
  - n: 8
    type: prose
    title: 行 ag-ref — 起草の決まりの文の正本を参照の file 1 つにし、頼みの共通の文の 3 項と天井の 4 つを足す（判断の記録 ADR-63 の決定 (2) と帰結の 9 番目の項）
    body: |
      在りか。差の file docs/design/patch/ag-ref.patch（14,174 byte）は、main fefb3056 と試作の木（写しは drafts の try-w232a の commit b89b3d06・係 w232a）の差で、参照の file plugin/skills/agent-discipline/reference.md の直しと新しい段の file crates/tsuzuri-boundary/tests/agref.rs の 2 file。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。depends は空で、同じノートの並ぶ行 t-teeth-on と書く file が交わらない（一時の index に両順で当てて同じ木になる）。並ぶ行 t-kfold-cap が参照の file の 11 節を直す時も、この差の最後の hunk（main の 70〜82 行目）から 5 行以上離れる。

      なぜ。判断の記録 ADR-63 の決定 (2) は、参照の file を席の起草の決まりの唯一の正本とし、git の外の頼みの共通の文にしか無い 4 項のうち 3 項（行を数珠つなぎにしない・門に断られたら回り込まず止めて知らせる・token の節約）を移し、残りの案内の幅の項は器の入れ子の歯（接頭辞 cli_help_）が落とすので写さず歯の名だけを指すとした。あわせて天井の 4 つ（置き場の物差しの順と置き場の妥協の 1 文・根の src の module の頭の doc に行の id を書かない・goal に歯の本数を書かない・実装の source の字を照らす歯を足す時は振る舞いで測れない訳を節に 1 文）を足すとした。帰結の 9 番目の項は、群の係の頭の予算は下限と上限が同じ 15 万なのでちょうど 15 万だけが通るとし、10 節の字（150000 以下）を直すとした。

      形。参照の file の頭の文の末に、決定 (2) で起草の決まりの文をこの file だけに置き頼みの文はこの file を名指す 1 文を足す。3 節（契約の行の書き方）の depends の項の後に、数珠つなぎの項（割り方と depends を書く時の 1 文）と置き場の物差しの順の項（置き場の妥協の 1 文を含む）を、3 節の末に goal の項と module の doc の項と案内の幅の項を足す。goal の項は、契約表の goal が行の節の字の写しなので、行の節と書く。5 節（歯の置き方）の末に source の字の歯の項を、9 節（道具の撃ち方）の末に回り込みの項と token の節約の項を足す。10 節の 4 番目の項の予算の字を、予算は token ちょうど 150000 に直す。参照の file は 90 行から 98 行になる。参照の file の行の数の上限を測る歯は無い（crates と xtask の歯と src を grep した）。案内の幅の値は写さない。

      done と verify の対応。done の 1 番目の項は verify の 1 行目、2〜5 番目の項は 3 行目（新しい段の file tests/agref.rs の歯 agref_）で測る。2 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので verify に書かない。入口の赤は、main の参照の file では 2〜4 番目の項の歯が落ち（3 行目が rc 100）、5 番目の項の歯は器の歯の dir だけを読むので main でも通る。

      歯と噛み。新しい段の file tests/agref.rs（判断の記録 ADR-32 の決定 (3)・群の main.rs と kfold.rs は書かない）。境界に置くのは、plugin の file を読む着地済みの歯 agpl_ と同じ crate に寄せるため。参照の file は天井の文で振る舞いを持たないので、歯は字を節の塊（番号の見出しの行から次の見出しの行の前まで）の中で照らし、1 度だけである事を数で断言する（決定 (2) の (d) の訳）。器の歯の名は、scribe2/crates の下の crate ごとの tests の dir を名で探して照らす（歯の file の path を固定しない）。噛みは係が撃った（参照の file の変異 14 と歯の助けの変異 4・全部 rc 100・対照は rc 0・書き戻した後の status は空）。句ごとの外しと 150000 以下への戻しと 100 字の写しと 9 節から 2 節への動かしで 2 番目の項、節の塊を見ない変異と 1 度以上で通す変異で 3 番目、無いはずの字を見ない変異で 4 番目、器の歯の接頭辞の変異で 5 番目の項の歯が落ちた。

