      done と verify の対応。1 番目の項は verify の 1 行目、2 番目から 8 番目の項は 3 行目（新しい段の file tests/agshp.rs の歯 agshp_）、最後の 9 番目の項は 4 行目から 9 行目（着地済みの群 teeth5 の aggd_ と群 teeth6 の aggw_・aghk_・agmt_・agsg_ と段の file tests/agflr.rs の agflr_）で測る。4 行目から 9 行目の絞りが当たる歯の file のうち、本文を替えない file は置き場だけの項（=）で write-set に置く。群 teeth5 の aggd.rs は use の 1 行だけを替え、歯の本文は替えない。2 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので verify に書かない。欄 done-teeth は、1 番目が verify の 1 行目（@1）、2 番目から 8 番目が差の file が足す歯、9 番目が本文を替えない着地済みの歯（=）。入口の赤は、main では形を測る 3 行目の歯が落ちる（rc 100・2 番目の項の振る舞いの歯は main でも通る）。

      在りか。差の file docs/design/patch/t-shape-ag.patch（44,152 byte・git diff -M）は、main 9e6f8b4d と試作の木（写しは drafts の try-w249a の branch r1 の commit d49f1482・係 w249a）の差で、中核の src の 7 file（agent/meter/guard.rs から agent/guard.rs への移し・agent/mod.rs・agent/meter.rs・agent/meter/group.rs・agent/spec.rs・agent/stop.rs・gate.rs）と、境界の src の hook の 7 file（新しい agent_args.rs・agent_spawn.rs・agent_bind.rs・agent_meter.rs・agent_guard.rs・subagent_stop.rs・mod.rs）と、歯の 2 file（新しい段の file tests/agshp.rs・群 teeth5 の aggd.rs の use の 1 行）。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。depends は空。main の docs/design/patch の未着地の行の差は、この file のどれも書かない。

      なぜ。判断の記録 ADR-63 の決定 (8) の (d) は、群の行が全部着地した後に、交わりを避けるために置き場と名を曲げた行の形を畳む行を席が置くとし、帰結の 4 つ目の項がこの行を挙げた。係の起こしと門の行は、並ぶ行と差が交わらないように、deny の答えの JSON を問いの起票の門の関数と同じ字で中核の agent の spec に写し、係の出力の dir の名を中核の stop と meter の guard に 2 つ置き、path の下の判じを meter の guard の open と meter の group の inside に 2 度書き、係の門の module を中核の agent の mod.rs に足さずに meter の子に置き、境界の係の口 5 つが同じ引数の読みと置き場の解きと 2 つの断りの字を run の頭に写した（memo t3-hub.87.17）。写しが残ると、次に断りの字や判じを直す行が同じ直しを全部の写しに当てる要があり、写しの間の食い違いを測る歯も無い。

      形。deny の答えは中核の gate.rs の関数 deny_json の 1 つにし（pub を足すだけで字と引数は替えない）、agent の spec の関数 deny を消して、境界の起こしの門と係の門は deny_json を使う。係の出力の dir の名 OUT（値 w）は、係の dir の下の置き場の名（brief.md・spec.json・.agents）を持つ中核の agent の spec に 1 つ置き、stop と guard の写しを消す。係の門の module は中核の agent/meter/guard.rs から agent/guard.rs へ移し（module の path は agent の guard・agent/mod.rs が pub mod guard を持ち meter.rs は持たない）、path の下の判じを関数 under の 1 本にして、open と meter の group の inside はそれを呼ぶ（inside の名と引数と読みは替えない）。境界の hook に新しい module agent_args を置き、引数の読み Args・parse と置き場の解き drafts を agent_spawn から移し、使い方の誤りの 2 行を書いて rc 1 を返す misuse と、引数を読み置き場を解く口の頭の段 begin を足す。口の名は USAGE の字から読む（字 usage と空白の後の、最初の空白と 2 つの - の前）。5 つの口の run は begin を 1 度呼び、終える前の門は道具の旗の読みの誤りも misuse で書く。断りの字と rc と書く file の形は替えない。

      歯と噛み。新しい段の file tests/agshp.rs（判断の記録 ADR-32 の決定 (3)・群の main.rs と kfold.rs は書かない）。2 番目の項の歯は tz の binary の口を撃つ振る舞いの歯で、畳んだ引数の読みの字と rc を口ごとに測る。3 番目から 7 番目の項の形は、写しが 2 つでも同じ字を同じ順に出すので振る舞いの歯では測れず、中核と境界の src を crate の manifest の dir から読み、字の数を関数の範囲（宣言の行から行の頭の閉じ括弧の行の前まで）の中で照らして断言する（判断の記録 ADR-63 の決定 (2) の (d)）。8 番目の項の歯は本物の src の写しから 1 句だけ崩した見本で判じの腕を通す。噛みは係が撃った（表は係 w249a の notes.md）。main の src に戻すと形の歯が全部落ち、deny の写しの足しとその鍵の字の置き場だけの移し、出力の dir の名の写しの足しとその置き場だけの移し、inside への判じの写し、測りの口の run への読みの写し戻し、係の門の module を meter の下へ戻す移しは、それぞれの項の歯を落とし、misuse の USAGE の行の外し・結びの口の訳の替え・口の名の読みの替えは 2 番目の項の歯を落とす（どれも rc 100）。

      範囲の外。境界の結びの解き resolve と結びの無い呼びの記帳 unbound（agent_meter）と札の結び late（agent_bind）は、ほかの口から super で呼ばれるが、名と置き場を替えると既存の歯の名指しと交わりが増えるので畳まない。中核の meter の group が持つ群の係の門の字（fence・read_refusal）は群の係の測りの字と同じ file に在り、移すと群の歯の use の行を替えるので動かさない。標準入力の読みの 4 行は係の口のほかの hook も同じ形で持つので、この行では畳まない。verify の絞りを名の部分の字から module の path の頭へ替える形は、この行で替えない（所見は係 w249a の notes.md）。
