  - n: 12
    type: prose
    title: 行 v-gate-findings — gate の判定と数の食い違いを FAIL に読み、場所の列 at を判定の記録に写し、PASS の質の指摘を memo の口へ返す（判断の記録 ADR-63 の決定 (6)(7)・器の行）
    body: |
      在りか。差の file docs/design/patch/v-gate-findings.patch（45,401 byte）は、main c1234912（器の行 v-one-vessel を置いた設計の commit）に、未着地の器の行 v-one-vessel と v-run-write の差をこの順に当てた土台の木（commit 08513985）と、その上の試作の commit 0f6267ba（tree 73391594・写しは drafts の try-w235a の branch w235a-s・係 w235a）の差（9 file・+354 −26）。差は v-one-vessel の差と書く file が交わらず、v-run-write とは e2e の tests/e2e/pipe/gate.rs を両方が書くが hunk が離れている（v-run-write は module の doc と mod の列・この行は findings の歯の段）。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      依存と順。depends は v-one-vessel（同じノート）。並べられない訳は code の依存でなく、器を書く便は同時に 1 本（ADR-33 の決定 (12)・その床を入れるのが v-one-vessel）で、ADR-63 の帰結の 6 番目の項が器の行の数珠を v-one-vessel を先に、この行をそれに依ってと決めたため。v-run-write（t3-hub.80.27.8・hold）とは depends を書かず、両順に当たるので席が便の bead の依存で順を持つ。

      なぜ。判断の記録 ADR-63 の決定 (6) は、gate の審査役が PASS を返し、findings の contract-fit・teeth-nonvacuous・constitution のどれかを 1 以上と数えた周を、器が判定と数の食い違いとして FAIL に読み（理由の型 verdict-count-mismatch・evidence に数えた数）、雛形の判定の決め方に 1 文を足すと決めた。審査役が自分で違反を数えた周なので、判じられない周（INCONCLUSIVE）でなく不合格に読み、器の今の FAIL の道（直前の FAIL の材料を次の便に渡す口 prior_fail・memo の FAIL の口・席の撃ち直し）に乗せる。決定 (7) は、雛形の出す JSON に 0 でない観点ごとの場所の列 at を足して器が判定の記録 verdict.json に写し、器の memo の口（scribe2 ledger memo --run・台帳を読まず書かない）が gate の PASS のうち delete を 1 以上と数えた便からも memo の案（evidence と at を写す）を組めるようにすると決めた。窓の gate の PASS 133 便のうち、3 観点を数えた PASS は 7 便、delete を 1 以上と数えた PASS は 18 便で、どれも器のどこにも行かなかった（ADR-63 の context）。観点の種類と数え方は替えない。席の型の表は雛形に足さない。

      形（読み）。食い違いの材料は findings の集計の型の関数 Tally::mismatch（src/pipe/gate/findings.rs）の 1 本で、3 観点（定数 FIT）のどれかを 1 以上と数えた周だけ 3 観点の件数の字を返す。lens の判定の行の読み judge_pairs（src/pipe/gate/lens.rs）は、集計を読めた周に限り、PASS と食い違いの材料の組を FAIL・理由の型 verdict-count-mismatch（定数 MISMATCH_KIND）・evidence（字 verdict-count-mismatch・PASS を返したが <3 観点の件数の字> を数えた・lens の evidence は <lens の evidence>）に読み替える。FAIL と INCONCLUSIVE の判定と、3 観点を 0 と数えた PASS は替えない。形の読めない周の撃ち直し（reread）は形の誤りの周だけのまま（食い違いは形が読めた周なので撃ち直さない）。判定の型 Judged と記帳の型 Decision に欄 kind（理由の型）と at（場所の列）を足し、settle は verdict.json の findings と population の後に kind と at を在る周だけ足す（schema は 1 のまま・読み手は未知の field を無視する・review.json の kind と at と同じ名）。at は集計を読めた周に lens の at の字が空白だけでない時だけ写し、判定を動かさない（器は at の字を判じない・判断は審査役の領分）。Gated の detail は verdict:FAIL のまま替えないので、直前の FAIL の材料の口 prior_fail（detail の頭 verdict:FAIL と verdict.json の evidence と findings を読む）がそのまま次の便へ渡し、gate の rc は FAIL の 1。赤い verify の周の判定の組みは unjudged の形に寄せた（欄を 2 つ足すため・判定は替えない）。

      形（雛形）。src/headless/lens.txt の 3 行を替える。出すものの節の JSON の形の末に key at（観点とコロンと場所・場所はセミコロンで継ぎ・観点はコンマで継ぐ形）を足し、必須の 2 key の行の次に at の形の行（0 でない観点ごとの場所の列・findings と同じ順・場所は path か path と行か識別子・0 の観点は書かない）を足し、判定の決め方の節の PASS の行の次に ADR-63 の字のままの 1 文「contract-fit・teeth-nonvacuous・constitution を 1 以上数えたら PASS を返さない」を 1 行で足す。決定 (6) と (7) の雛形の替えをこの行 1 本にまとめ、雛形の指紋（lens の版の lens.txt の値）の替えを 1 回にする。gate の prompt の外形の snapshot（e2e__headless__lens_prompt_external_form.snap）は同じ 3 行だけが替わる（契約審査の雛形の snapshot 2 本は替わらない）。

      形（memo の口）。src/ledger/memo.rs の原本に質の形 Material::Quality（delete の件数・evidence・at）を足す。段 Gated の便の verdict.json が PASS の周と、段 Landed の便の verdict.json の周は、関数 quality が、PASS で findings の delete を 1 以上と数えた（読みは gate の 2 key の読みの 1 本 delete_count）周だけ原本にし、delete が 0・数えを読めない・PASS でない周は今の断り not-terminal、evidence が空の周は no-material で断る。Landed の便の verdict.json が無い・読めない周は今のまま not-terminal。plan の題は [memo] の後に質の頭 質 delete — を足して run と段と kind（PASS delete:<n>）を続け、本文の観測は evidence と at（無ければ -）を写す。題の頭は、日次の物差しの質の memo の項 quality_memos_open が数える正規表現（頭の [memo] と空白を許す 質 <型> — ・memo t3-hub.87.22 の notes）と同じ字で、起票の門の memo の印（題の頭の [memo]）も保つ。

      席の起票の手。器の口の題が質の頭を持つのは delete の形だけである。判定と数の食い違いの FAIL の便の plan の題は [memo] <run> Gated FAIL verdict-count-mismatch で、質の頭を持たない。席がこの便を constitution の質の memo として起票する時（verdict.json の findings の constitution が 1 以上の便）は、plan の arg の行の title を [memo] 質 constitution — <run> Gated FAIL verdict-count-mismatch に替えて撃つ。週の memo（stdlib・native・yagni・shrink のまとめ）は器の口を使わず、席が題 [memo] 質 週 — <週の初めの日付> で起票する。器の口の題に constitution と週の頭を足さないのは、食い違いの FAIL は今の FAIL の道で撃ち直され質の memo にするかは席が便ごとに決めるためと、週の memo は便に結ばれないため。

      要件の句。器の要件の正本は根の要件書（design-intent/srs.yaml・判断の記録 ADR-39）で、scribe2/ の下には要件書が無い。器の lens の判定の要件 FR1009 は判定に届かない周の INCONCLUSIVE と撃ち直しだけを持ち、判定と数の食い違いの読みと場所の列の写しと PASS の質の memo の口の句を持たなかった（memo の口の要件は根の要件書に無い）。この行を置く設計の commit で、FR1009 の shall と plain に 2 つの句を、型付きの欄 adrs に ADR-63 を、note に ADR-63 の決定 (6)(7) を足す（要件書の版を 1 つ上げ、承認は ADR-63 の裁定 t3-hub.87.14・前例は係 w234a が FR1068 に足した句）。

      撤退（ADR-63 の撤退 (2)(3)）。判定の食い違いの FAIL の項 gate_mismatch_3d が数えた周のうち、指摘が誤りで PASS が正しかったと席が記帳した数が 7 日で半分を越えたら、読みを外す行を置いて問う。外す形は Tally::mismatch の呼びと雛形の 1 文を外すだけで、場所の列 at と memo の口は残る。3 観点を 1 以上と数えた周の率が、この行の着地の前の 7 日の半分を下回ったら、審査役が数を 0 に寄せた疑いとして問う。開いた質の memo の項 quality_memos_open は、週 1 の掃除の行を 2 本着地させた後も 3 週続けて増えたら、掃除の行の頻度を先に問う。

      done と verify の対応。1 番目の項は verify の 1 行目。2 番目から 6 番目の項は verify の 3 行目（器の lib の vgfind_ の歯・在りかは findings.rs と gate の lens.rs と headless の lens.rs）、6 番目の項は 6 行目（着地した gate の prompt の外形の歯 headless_lens_prompt_external_form・snapshot の file だけを替え、tests/e2e/headless.rs は書かないので write-set の置き場だけの項）でも測る。7 番目から最後の項は 4 行目（器の e2e の vgfind_ の歯・在りかは tests/e2e/pipe/gate.rs の findings の歯の段の後と tests/e2e/ledger_memo.rs）、8 番目の項は 5 行目の着地した歯 pipe_gate_findings_counts_are_recorded_per_category（見本の 3 観点を 0 に直した・3 観点を数えた PASS はこの行で FAIL に読むため）でも測る。2 行目の器の clippy は done の項にしない。xtask の check は器の共通 verify が撃つので verify に書かない。欄 done-teeth は番号つきの項ごとに歯を verify の行の番号（@k）で名指し、名の歯を書かない。器の歯は scribe2/crates/ の下に在り、器の表の検査と gate の段 ① が歯の在りかを探す根（固定の crates/ と宣言の crate-roots の folio2/crates/）の外なので、名の歯は在りか 0 か所で断られるため。done の項の字の歯の名は、その項の @k の行の filter が選ぶ名にした（契約の審査の表の歯は、宣言の @k の行が選ぶ名なら宣言の内に数わる・行 v-atk-names）。着地した歯は filter を 1 語ずつにした別の行（5 行目と 6 行目）に置いた（nextest の行の filter は後ろの 1 語だけが読まれる）。

      置き場の妥協。器の e2e の gate の歯は族ごとに子 module へ置く形（tests/e2e/pipe/gate.rs の module の doc）だが、親の mod の列と module の doc は v-run-write の差が書くので、hunk を離して両順に当てるため、新しい歯 vgfind_ は親の findings の歯の段（同じ領域の着地した歯の後）に置いた。

      字を照らす歯の訳。歯 vgfind_gate_template_names_the_rule_and_the_at は雛形 lens.txt の字を読む。雛形は審査役（AI）への指示の字で、審査役がその字に従うかは器の歯の偽の lens では測れないので、審査役に渡る字そのもの（節の中の 1 文・JSON の形・at の形の行）を照らす。審査役に渡る prompt の全体は着地した外形の歯 headless_lens_prompt_external_form の snapshot が測る。

      歯と噛み。噛みは試作を commit した後に句ごとに 1 変異を当てて名指しの歯を撃ち、全部 rc 100（表は係 w235a の notes.md）。変異の無い木の対照は lib・e2e とも rc 0。器の入れ子の歯の全部（cd scribe2 で cargo nextest run --workspace --no-fail-fast）は全部通り、器の xtask の check も rc 0（core-lines 86370 / 90000）。

      入口の赤。main には名に vgfind_ を持つ歯が無いので、verify の 3 行目と 4 行目は --no-tests=fail で落ちる。5 行目と 6 行目の着地した歯は main に在り main で通る（この行は見本と snapshot を直すだけで、新しい振る舞いは 3 行目と 4 行目が測る）。

      範囲の外。席の型の表を雛形に足すこと（決定 (6) が採らない）・契約審査の雛形が質を数える形（乙' の器の行・決定 (7) の条件つきの段）・物差しの項と席の起票（席の道具・eval_daily.py は verdict.json の kind の字 verdict-count-mismatch と題の頭の字で数える）・器の binary の入れ替え（席の手）・gate の Gated の detail に理由の型を足すこと（読み手 prior_fail と局面の detail の読みを替えないため）。
  - n: 13
    type: prose
    title: 行 ag-floor-rec — 差の file を出す係の床の記録と、終える前の門の撃ち直し（判断の記録 ADR-63 の決定 (4)）
    body: |
      在りか。差の file docs/design/patch/ag-floor-rec.patch（57,707 byte）は、main c1234912 と試作の木（写しは drafts の try-w236a の branch r1 の commit 842dadc5・係 w236a）の差で、中核の終える前の門の判じ crates/tsuzuri-core/src/agent/stop.rs と新しい子 stop/floor.rs、境界の hook crates/tsuzuri-boundary/src/hook/subagent_stop.rs と新しい子 subagent_stop/floor.rs、main.rs の口の doc の 1 行、plugin/hooks/hooks.json の終える前の門の timeout、着地済みの群の module teeth6/agpl.rs の timeout の見込みの 1 字、参照の file plugin/skills/agent-discipline/reference.md の 7 節と 11 節、新しい段の file crates/tsuzuri-boundary/tests/agflr.rs。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。depends は空。同じ参照の file を書く並ぶ行 ag-ref2 とは hunk の文脈が交わらず、一時の index に両順で当てて同じ木 f61a0047 になった。

      なぜ。判断の記録 ADR-63 の決定 (4) は、終える前の門（ADR-59 の決定 (4)）の欠けに 1 つ足すとした。頭の出す物が差の file を名指す係は、出力の dir に床の記録 floor.tsv を置き、記録は差の file ごとに 1 行で、行の id と preflight・tz check・tz derive --check・器の表の検査（scribe2 contracts check に --base main を渡した周）・verify の 2 行目から最後の行のそれぞれの rc を持つ。記録が無い・行が欠ける・rc が 0 でない時は 1 度目の終わりを止め、門は安い 4 本を床の写しで撃ち直して記録の rc と比べ、食い違いも欠けとして止める。cargo の verify の行は撃ち直さず受ける。撃ち直せない時は、まだ分からない（条 P-7.2）として 1 度目を止め、何が見つからないかを名指す。要否は頭の出す物の字が決め、除外の印は置かない（条 N-3.1）。記録が在る事も撃ち直しの合格も、完成とも審査の合格とも扱わない（条 P-6.3）。

      形。記録の形は日次の物差しが今読む仮の形に合わせた。floor.tsv はタブで区切った 6 欄（行 id・preflight・tz check・tz derive --check・器の表の検査の rc・verify の 2 行目から最後の行の rc を , で繋いだ字）で、# で始まる行は頭。門の記録 floor-gate.tsv は判じるごとに行ごとの 1 行（時刻・終わりの回 1 か 2・行 id・型・詳細）で、型は no-record・no-row・unknown・mismatch・rc・ok、違う rc の詳細は記録と撃ち直しを / で繋ぐ（例 table=0/1）。時刻は器の他の記録と同じ分までの UTC の字（例 20261005T1200Z）で、物差しの読み手が読める。中核の子 floor は純関数だけ（差の file の行・記録の読み・契約表の行の頭と verify の数・器の表の検査の行の rc・行ごとの判じ・門の記録の行）を持ち、境界の子 floor が床の写しと state dir と道具を解いて子 process を撃ち、門の記録に足す。

      器の表の検査の rc。器の表の検査は着地済みの行の断り（write-set-item-unresolved と teeth-outside-write-set）で検査全体の rc が今いつも 1 なので（main c1234912 の床の写しで rc 1・出力 2367 行・ノート surface-wave29c を名指す行は 0）、記録と撃ち直しは、その行の頭（contracts/<ノート>.toml の [[contract]] の行の番号）を名指す断りの行が在れば 1・無ければ 0 とし、検査の rc が 0 と 1 のどちらでもなければその rc を写す。全体の rc を写すと差の file を出す全部の係が毎回止まる。断りの行の頭は contracts と、コロンと空白と file の path とコロンと番号と空白の形（器の出力を実測した）。

      撃ち直しの道具と置き場。床の写しは参照の file の 1 節の名 <置き場>/try-<名>-fl、state dir は係の dir の下の floor-state（無ければ作り、空でなければまだ分からない）。tz は既定でこの hook の binary（plugin の tzw が解く tz）、scribe2 は PATH の名で、旗 --tz と --scribe2 が替える（面の口 tz surface serve の同じ旗と同じ形・歯は偽の殻の script を渡す）。preflight の --bead は札の対象（preflight は --placed の無い周に bead を判じに使わない・在らない bead でも ok を実測した）。器の表の検査を別の子で撃ちながら tz check と tz derive --check と行ごとの preflight を順に撃ち、全部の上限は 100 秒で、越えた子は process group ごと止めてまだ分からないにする。実測は main の床の写しで器の表の検査 18〜21 秒・tz check 4 秒・derive 0.1 秒・preflight 0.3 秒（load average 20 前後）。hooks.json の終える前の門の timeout は 10 秒では器の表の検査が終わらないので 120 秒にした。差の file を名指さない係は今のまま何も撃たない。

      実装の約束と done と verify の対応。1 番目の項は verify の 1 行目。2 番目から 13 番目と最後の 15 番目の項は 3 行目（新しい段の file tests/agflr.rs の歯 agflr_）、8 番目の項は 5 行目（着地済みの歯 agsg_hook_passes_a_whole_stop_and_marks_it_ended と agsg_hook_holds_the_first_stop_with_one_hole・本文を替えない・file は write-set の置き場だけの項）でも、14 番目の項は 4 行目（着地済みの群 teeth6 の module agpl.rs・timeout の見込みの 1 字を替えた）で測る。2 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので verify に書かない。欄 done-teeth は番号つきの項ごとに歯を名指し、1 番目は verify の 1 行目（@1）、8 番目の着地済みの歯は本文を替えない既存の歯（=）。入口の赤は、main では新しい段の file と中核の子 module が無く 3 行目が組めず、4 行目は hooks.json の timeout 10 で落ちる。

      歯と噛み。新しい段の file tests/agflr.rs（判断の記録 ADR-32 の決定 (3)・群の main.rs と kfold.rs は書かない）。境界に置くのは、hook の binary を撃つ着地済みの歯 agsg_ と同じ crate に寄せるため。hook の歯は偽の tz と scribe2（撃たれた cwd と引数を log に足す殻の script）を旗で渡し、置き場は CARGO_TARGET_TMPDIR の下。参照の file の句は、手引きが天井の文で振る舞いを持たないので、節の塊の中の字を照らし、1 度だけである事を数で断言する（決定 (2) の (d) の訳）。噛みは係が撃った（表は係 w236a の notes.md の 4 節）。

      置き場の妥協。後で置く行 ag-budget-floor（予算の記録 usage.json・同じ終える前の門）が並べて置けるよう、この行は中核の stop.rs には頭の doc の 1 行と子 module の宣言だけを、境界の subagent_stop.rs には頭の doc の 2 行と子 module の宣言と USAGE と引数の読みの 2 行と欠けの足しの 1 行だけを書き、判じと撃ち直しの本体を子 module に置いた。

      U と範囲の外。門の tz は hook の tz で、係が床を撃つ席の pin の tz と版が違えば tz check の rc が食い違いうる（その時は 1 度目だけ止まる・撤退 (5) の食い違いの数が見る）。係の札の結び（.agents/<係の id>）が無い係は今の門のまま通る（終える前の門の全部が効かない・この行は替えない）。物差しの読み手（席の道具 eval_daily.py の agent_stop_floor）は形を替えないので直さない。予算の記録 usage.json と下限は行 ag-budget-floor。要件 FR21 の shall と plain と adrs と note は、この行を置く設計の commit で適用の script が書く。
