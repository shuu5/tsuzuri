      範囲の外。残りの 5 行は、境界の群 teeth1 から teeth3（-b）、境界の群 teeth4・teeth5 と面の群 teeth1・teeth2（-c）、面の群 teeth3 から teeth5（-d）、folio の群 teeth1 と境界が組む tz1・tz2（-e）、tz3 から tz5（-f）で、どれも置く直前の main で fold2.py の --pool を撃って切り、kfold.rs を書かない（見込みの byte は係 w250a の notes.md）。寄せない写し（同じ名で字の違う物ほか・全部の群で 82 class）はこの行で直さない。verify の絞りを名の部分の字から module の path の頭へ替える形は、この行で替えない（所見は係 w250a の notes.md）。
