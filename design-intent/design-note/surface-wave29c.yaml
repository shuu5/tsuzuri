    title: 行 t-fold-3 — 段の file 26 本を crate ごとの最後の群へ畳み、境界と面で群 teeth6 を開き、上限を越えた群 2 つを割る（判断の記録 ADR-32 の決定 (4)・畳みの行の 3 本目）
    body: |
      done と verify の対応。1 つ目の項は verify の 2 行目（歯 kfold_groups_declare_every_module_once）、2 つ目の項は verify の 2 行目（歯 kfold_test_names_unique_in_each_crate）、最後の項は verify の 4 行目から最後の行まで（群ごとの nextest・filter なし）で測る。done の項は歯が測る物だけにした。verify の 1 行目（git apply --reverse --check）は差の file の hunk が全部木に在ることを、3 行目（cargo clippy -p xtask -p tsuzuri-core -p tsuzuri-boundary -p tsuzuri-surface --all-targets --no-deps -- -D warnings）は群の 1 crate でも lint の落ちが無いことを、命令の rc で測る守りで、done の項にしない。xtask の check は器の共通 verify が撃つので verify に書かない。欄 done-teeth は書かない。群の行の数（上限 1 万行）は歯が測らないので done に書かず、この節の数えに書く。移した file の歯の fn の名は 1 字も替えない（差の file が字の正本で、段の file 26 本と境界の server_coalesce は rename だけ・core の gext は自分を読む path の字だけを替える）。

      在りか。差の file docs/design/patch/t-fold-3.patch は、main 95153106（行 ag-plugin の着地 f5cf5009 と器の行 v-commute-wire の置きの後）の上で、席の道具（fold2.py・群の上限 10,000 行・係 w230a の写し seq-w230a.sh と split-w230a.sh）を撃った commit cff69d21 から切った（13,958 byte・git diff -M）。main ba27ee7f（器の行 v-follow-mtime の置き・設計の file だけ）で切り直した差とも byte で同じ。差の file の数は、移すだけで中身を 1 字も替えない file 27（段の file 26 本と境界の server_coalesce）・移して path の字を 1 行替える file 1（core の gext）・新しい群の入口の file 2（境界と面の teeth6 の main.rs）・移さずに字を書き替える file 8（群の main.rs 6 と kfold.rs と境界の群 teeth2 の gextw.rs の注の 1 行）。席は置く直前と流す直前の main の写しで seq-w230a.sh と split-w230a.sh を撃って差を切り直し、置いた差と byte で比べる。

      なぜ。判断の記録 ADR-32 の決定 (4)。段の file（歯の置き場の直下の 1 本の歯の file）が 12 本に達するごとに、席が畳みの行を 1 行置き、まだ着地していない行の書く範囲と verify が名指さない段の file を最後の群へ（上限 1 万行を越えれば次の群へ）移す。畳みの行 t-fold-2 の差を切った後（main aa113d5b）に段の file が溜まり、main 95153106 で 26 本（境界だけで 13 本）になった。段の file は 1 本ごとに別の歯の実行 file を組み link する。

      畳まない段の file は無い。全部の契約表の行のうち着地の印 Scribe2-Contract の無い行（main ba27ee7f で 6 行・古い傘の行 surface-base の e と surface-board の g と、器の行 v-run-write・v-commute-names・v-commute-wire・v-follow-mtime）の write-set の字と verify の -p と --test の組（w/stage_named.py）と、起草の置き場の置く用意の行の字は、段の file を 1 本も名指さない。

      数えと行き先（main 95153106）。群の行の数は群の dir の直下の .rs（main.rs を除く）の行の和で、段の file を名の順に最後の群へ足し、足すと 1 万行を越える file から次の群を開く（fold2.py の決まり・判断の記録 ADR-32 の決定 (2) と (4)）。xtask の段 1 本（vlanes 46 行）は群 teeth1（5,152 行・module 15）へ入り 5,198 行・module 16。core の段 7 本（aggj 379・agsp 169・cwflw 64・cwplg 235・cwrsm 50・cwsts 114・cwtru 47 行・和 1,058）は群 teeth3（3,312 行・module 14）へ入り 4,370 行・module 21。境界の段 13 本（和 3,264 行）のうち名の順で前の 4 本（acctcwr 176・aggc 171・aggd 176・aggs 271 行）は群 teeth5（8,960 行・module 25）へ入り 9,754 行・module 29。次の aggw（300 行）を足すと 10,054 行で上限を越えるので、aggw から後の 9 本（aggw 300・aghk 223・agmt 199・agpl 433・agsg 223・cwres 517・cwsln 195・cwtrw 53・dtcol 327 行）は新しい群 teeth6 を開いて入り 2,470 行・module 9。面の段 5 本（和 902 行）のうち前の 4 本（acctcws 115・cwbar 265・stparts 190・vcdup 83 行）は群 teeth5（9,239 行・module 41）へ入り 9,892 行・module 45。次の vcparts（249 行）を足すと 10,141 行になるので、vcparts は新しい群 teeth6 を開いて入り 249 行・module 1。契約と folio に段の file は無い。

