  - n: 18
    type: prose
    title: 行 v-roots — 器への宣言の crate の根に scribe2/crates/ を足す（判断の記録 ADR-33 の決定 (12)・ADR-63 の撤退 (8) の前の 1 歩）
    body: |
      在りか。差の file docs/design/patch/v-roots.patch（8,177 byte）は、main f4bbc16f と、その上の試作の commit d2bf5f74（tree d5f9ff66・写しは drafts の try-w239a の branch w239a-roots・係 w239a）の差（2 file）。.vessel.toml の任意 key crate-roots の行の値に scribe2/crates/ を足し、その上の注 3 行のうち 2 行を着地の字に替え、段の file xtask/tests/vroots.rs（群の main.rs と kfold.rs は書かない）を足す。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      依存と順。depends は書かない。この行は器の code を書かないので、器を書く便の数（宣言の run-cap と run-cap-paths）に入らない。判断の記録 ADR-33 の決定 (12) は、この行を器の xtask の名替え（決定 (11)・着地済み）と器の crate を根の workspace に入れる行 v-join の後に置くと決めた（席の決め）。置く時と流す時は、その決めか、それを替える判断の記録に従い、席が便の bead の hold で持つ（toml の depends は同じノートの行しか名指せない）。同じ .vessel.toml を書く行 t-run-cap-on（未着地）とは、この行が crate-roots の行とその上の注を、t-run-cap-on が file の末を書き、main の一時の index に両順で当てて同じ tree になる（係 w239a の commute-roots.log と commute-roots2.log）。どちらが先に着地してもよい。

      なぜ。器の追随の再 gate の面は、根からの相対の字の集合（crates/・Cargo.toml・Cargo.lock・rules/・.vessel.toml）と宣言した crate の根の和である（器の設計 contract-source.md の 62 節）。tsuzuri の器の code は scribe2/crates/ の下に在り、どちらにも入らないので、器の crate を書いた便が着地しても、走るほかの便は前の PASS を引き継いで撃ち直されない。このため器を書く便は同時に 1 本に縛られている（ADR-33 の決定 (12)・ADR-63 の決定 (13) の床）。この行はその訳の主の部分を消す。代わりに、器の便の着地のたびに、走るほかの便（根の便も）は審査を含む段を撃ち直すので、撃ち直しの量は増える。

      形。宣言の行は crate-roots の値を folio2/crates/ と scribe2/crates/ の 2 項目にする（固定の根 crates/ に足す鍵で、項目は末尾 / の repo 相対の dir・重なり無し）。今の器の binary は鍵を知っている（folio2/crates/ の前例）。注は、2 つの根の下の crate を器が crates/ の直下の crate と同じに読むことと、scribe2/crates/ をこの行が足したことを書く。

      効き（器の code の読み・係 w239a の試し）。着地の後、器は宣言を HEAD の木から読むので、次の受付と追随から効く。(ア) 追随の再 gate の省き（関数 scope_touched）は scribe2/crates/ の下の path を面に読む。(イ) 受付の上限の余地は、器の crate の src の file を 1 file 1,500 行と core crate の本体 scribe2/crates/scribe2/src の合計（器の rules の R-C4-2 と R-C4-1・今の値 90,000）で測る。測るのは実の行数でなく size の見込み（M は 1 file 300 行）と growth の欄で、器の xtask の check の core-lines は main f4bbc16f で 85,895、器の src の file 273 本のうち 1,200 行を越える物は 27 本（wc -l の数）なので、M の器の行がその file を書く時は growth の欄が要る。(ウ) 器の行の verify の歯の在りか（preflight の teeth= の行・teeth-outside-write-set・gate の done-teeth の照らし）が器の crate の file に解ける。床の写しで main f4bbc16f とこの行の宣言を commit した木の 2 つで、今の器の binary の preflight を契約表の器の行 25 本に撃つと、受付の判じの rc は 25 本とも同じで、違いは teeth= の行の 0@- が歯の file に解けること（23 本）だけだった（14 本は前と同じ write-set の項の未解決で断られ、余地の判じに届かない）。gate は便の HEAD の木の宣言から根を読むので、欄 done-teeth に歯の名を書けるのは、この行の着地の後に起こす器の便だけである。名を書く器の行は、この行の bead に依存を持ち、この行の着地の後に置く（置く時の contracts check も設計の木の宣言を読む）。着地の後の検出線は tsuzuri の宣言に鍵 detection-verify が無いので、前後とも撃たれない。

      面の外に残る物。器の binary が組みの時に読み込む scribe2/rules/manifest.toml（と scribe2/plugin/ の 2 file・scribe2/scripts/bdw）は、crate の根の下でも面の字でもないので、この行の後も面の外に残る。器の規則の表だけを書く便の着地は、ほかの走る器の便の再 gate を省かせる。器を書く便の同時 1 本の床を外す行（ADR-63 の撤退 (8)）を置く前に、この穴の扱いを席が決める（係 w239a の問いの下書き Q1）。

      done と verify の対応。1 番目の項は verify の 1 行目、2 番目から最後の項は 3 行目（段の file tests/vroots.rs の vroots_ の歯）。2 行目の clippy は done の項にしない。

      歯と噛み。歯は根の .vessel.toml の字を key で拾い、repo の追跡する manifest を git ls-files で読む（外の依存を使わない・行 t-run-cap-on の歯 onevd_ と同じ数え方）。根の外に在ってよい package の dir は根の開発の道具 xtask の 1 つで、器の面の外である。噛みは試作を commit した後に句ごとに .vessel.toml・木の追跡する manifest・歯の読み手へ 1 変異を当てて名指しの歯が rc 100、変異の無い対照は rc 0（表は係 w239a の notes.md と bite-roots.tsv）。

      入口の赤。main には段の file tests/vroots.rs が無いので、verify の 3 行目は組めずに落ちる。

      範囲の外。器の crate を根の workspace に入れること（行 v-join の割りの行）・器を書く便の同時 1 本の床を外すこと（ADR-63 の撤退 (8) の行）・scribe2/rules/ を面に入れる器の直し（問い Q1）・器の binary の入れ替え（席の手・この行は今の binary が知る鍵だけを使う）。
  - n: 19
    type: prose
    title: 行 v-join-xt — 器の xtask の check が根の workspace に入った形の器も読む（判断の記録 ADR-33 の決定 (14)・ADR-36 の決定 (9) の C2 と C5・器の行）
    body: |
      在りか。差の file docs/design/patch/v-join-xt.patch（25,263 byte）は、main f4bbc16f と、その上の試作の commit 30f9af96（写しは drafts の try-w239a の branch w239a-xt・係 w239a）の差（4 file）。器の xtask に module joined（src/joined.rs）を足し、src/workspace.rs の Layout::discover と src/check_facts.rs の 3 つの測り（lints-set・deps-empty・nextest-tmux-group）の読み先を直し、src/main.rs に mod の 1 行を足す。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      依存と順。depends は書かない。器の code を書く行なので器の列（同時 1 本）に入る。書く file は器の xtask の src だけで、列の未着地の器の行（v-one-vessel・v-run-write・v-gate-findings・係 w237a の 2 行）の差のどれとも交わらない（V: 差の file の名）。器の crate を根の workspace に入れる行 v-join は、この行の code（器の dir の Cargo.toml が無い木の読み）を呼ぶので、v-join がこの行に依る。

      なぜ。判断の記録 ADR-33 の決定 (14) と ADR-36 の決定 (9) は、器の crate を根の workspace に入れる（v-join）と決めた。cargo は member の dir から上へ最も近い行 [workspace] の manifest を根と読むので、v-join は器の dir の Cargo.toml と Cargo.lock を退かせる（ADR-33 の決定 (10)）。今の器の xtask の check は器の dir の Cargo.toml の members を読む（Layout::discover）ので、退かせた木では測りの全部が読めずに止まり、器の xtask の歯の一部も同じ訳で落ちる（係 w239a の試し・根に器を入れた最小の木で撃った）。この行は、v-join の前に、器の xtask を両方の形で読めるようにする。入れ子の形（今の main）の読みは替えない。

      形（読み）。器の dir が自分の Cargo.toml を持たず、祖先のうち行 [workspace] の Cargo.toml を持つ最も近い dir の members に器の dir の下の項目が在る木を、根に入った形と読む（Layout::joined）。その木の member は、その members のうち器の dir の下の項目を器の dir からの相対にした物（members の配列は複数行も読む・器の dir の下の項目が無い木は断る）。workspace の根の dir（Layout::workspace_dir）は、根に入った形では祖先の dir、ほかでは器の dir。Layout の欄は足さない（Layout を字で組む測りの歯を書き替えないため・メソッドで持つ）。manifest を持たない一時の木（測りの歯の fixture）は、祖先の members に器の dir の下が無いので根に入った形と読まない。

      形（測り）。lints-set は、根に入った形では workspace の根の Cargo.toml の lint の表を読み、器の lint の表 REQUIRED_LINTS の各 lint が deny か forbid で在ることを測る（表の外の lint を許す）。器の表は粒度の lint 3 つを forbid に置く（属性で黙らせない）が、根の表は deny に置く（外の crate の macro が forbid の下で組めないため）。根の検査の歯 klint_r4_no_attr_exceptions は、根の workspace の全部の member の .rs が 3 つの lint とその群の名を持たないことを字で測るので、根に入った後は deny と根の歯の組で forbid と同じ守りになる（判断の記録 ADR-36 の決定 (9) の C2・覆う根の歯の名）。lints-optin は今のまま（器の 3 つの manifest は [lints] workspace = true で根の表を継ぐ）。deps-empty は、根に入った形では器の member の manifest だけを数える（根の manifest は消費側の依存の一覧で、器の母集団でない）。nextest-tmux-group は workspace の根の .config/nextest.toml を読み（nextest は workspace の根の設定だけを読む）、根に入った形では filter の固定形の頭に境界 crate の package を名指す句 package(<NAME>-boundary) & を求める（C5 の、部品を名指す形で根の設定へ移す群）。

      撃った確かめ（V・係 w239a）。入れ子の形の写し（この行の試作）で、器の xtask の歯の全部が通り、cd scribe2 の cargo xtask check が rc 0（lints-set=17・deps-empty=4・nextest-tmux-group=ok）。根に入った形の写し（この行に、根の members と錠と器の manifest と錠の退役と tmux の群の根への移しを重ねた木 22fb98e1）で、器の xtask の歯の全部が通り、cargo xtask check が rc 0（lints-set=18・lints-optin=3/3・deps-empty=3・nextest-tmux-group=ok）。verify の --manifest-path scribe2/crates/scribe2-xtask/Cargo.toml は、入れ子の木では器の workspace に、根に入った木では根の workspace に解ける（cargo metadata で照らした）ので、v-join の前後のどちらで撃っても組める。

      done と verify の対応。1 番目の項は verify の 1 行目、2 番目から 8 番目の項は 3 行目（器の xtask の module joined の vjxt_ の歯）、最後の項は 4 行目（既存の歯 check_passes_on_workspace・在りかは src/check_tests.rs で、書かないので write-set の置き場だけの項）。2 行目の clippy は done の項にしない。

      歯と噛み。歯は一時の dir に擬似の木（根の workspace と器の dir）を書いて Layout と測りを撃つ。噛みは試作を commit した後に句ごとに 1 変異を当てて名指しの歯が rc 100、変異の無い対照は rc 0（表は係 w239a の notes.md と bite-xt.tsv）。

      入口の赤。main には名に vjxt_ を持つ歯が無いので、verify の 3 行目は --no-tests=fail で落ちる。4 行目は main で通る（入れ子の形の読みを替えないことを測る）。

      範囲の外。器の dir の Cargo.toml と Cargo.lock の退役・根の members と錠・tmux の群を根の設定へ移すこと・根の検査の歯の直し（行 v-join）・根の検査の器の段（行 v-join-stage）・入れ子の形の読みを畳むこと（v-join の後の行）。
  - n: 20
    type: prose
    title: 行 ag-bind — 係の札の結びの道（meta.json の名）と出す物の字の形（判断の記録 ADR-59 の決定 (4) と帰結の (1)・ADR-63）
    body: |
      在りか。差の file docs/design/patch/ag-bind.patch（34,991 byte）は、main a5dc75be と試作の commit 3f63923e（tree e0c428e0・写しは drafts の try-w241a の branch w241a・係 w241a）の差（9 file・足す 550 行・消す 25 行）。字を書き替える file は境界の crates/tsuzuri-boundary/src/hook/agent_bind.rs（54 → 79 行）・agent_guard.rs（86 → 86 行）・agent_meter.rs（155 → 172 行）・subagent_stop.rs（109 → 112 行）と、中核の crates/tsuzuri-core/src/agent/meter.rs（175 → 175 行）・agent/spec.rs（310 → 318 行）。新しい file は中核の spec の子の module crates/tsuzuri-core/src/agent/spec/tie.rs（69 行）と spec/outs.rs（66 行）と、段の file crates/tsuzuri-boundary/tests/agbn.rs（337 行）。土台の木で git apply --check、試作の木で git apply --reverse --check がどちらも rc 0。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。1 番目の項は verify の 1 行目、2 番目から最後の項は verify の 3 行目（段の file crates/tsuzuri-boundary/tests/agbn.rs・接頭辞 agbn_）で測る。verify の 2 行目（中核と境界の 2 crate の clippy）は lint の落ちが無いことを命令の rc で測る守りで、done の項にしない。xtask の check は器の共通 verify が撃つので verify に書かない。欄 done-teeth は 1 番目の項を verify の行の番号（@1）で、ほかの項を名の歯で名指す（名乗りの行 t-teeth-on は着地済み）。

      なぜ。2026-10-05 に、席が起こした係の札 spec.json の agent_id がどれも空で、起草の置き場の .agents には結びの無い呼びの記帳 unbound.jsonl だけが在った。結びの口（tz hook agent-bind）は席の Agent の呼びの結果の tool_response.agentId を読むが、席に team が在る周（今の席の形）の名を付けた起こしの結果は team の形（status teammate_spawned）で agentId を持たない（欄 agent_id は在るが、起こしの名と team の名を繋いだ字で、係の呼びの入力の係の id と違う）。係の門と測りと終える前の門は結びの無い係を通す（判断の記録 ADR-59 の決定 (4) の通し）ので、出す物の欠けの止め・床の記録（行 ag-floor-rec）・予算の記録（行 ag-budget-floor）がどの係にも効いていなかった。これは判断の記録 ADR-59 の帰結の (1)（席の係で名と係の id が結べず、記帳だけが増えて門が全部素通りになると分かったら見分けの形を問い直す）の引き金に当たる。見分けの形（起こしの名と係の id を結ぶ）は替えず、係の id を得る道を 1 つ足す。

      試しの窓の記し（係 w241a・2026-10-05）。使い捨ての作業場と、hook の入力を記すだけの hook で起こしを撃って記した。team が無い周（headless）では、名を付けた起こしも名を付けない起こしも結果は agentId を持ち（status async_launched か completed）、その値は係の呼びの入力（PreToolUse・PostToolUse・SubagentStart・SubagentStop）の欄 agent_id と同じだった。team が在る周（端末の窓）の名を付けた起こしの結果は status teammate_spawned で agentId が無く、係の呼びの入力の agent_id は字 a と起こしの名と 16 字の 16 進を繋いだ形、agent_type は起こしの名だった。係の呼びの入力の transcript_path は席の記録の path で、係の記録はその .jsonl を除いた dir の下の subagents/agent-<係の id>.jsonl、その隣の agent-<係の id>.meta.json は欄 name（起こしの名・team の形でもそうでない形でも在る）と agentType を持つ。名を付けない起こしの meta.json には name が無い。meta.json は、席の Agent の呼びの PostToolUse と係の SubagentStart の時には subagents の dir ごと無く、係の 1 度目の道具の呼びの PreToolUse の時には在った。

      結びの形。中核の spec の子の module tie に、親の記録の path と係の id から meta.json の path を組む関数 meta_path（測りが係の記録の path を組む関数 transcript と同じ組み方）、欄 name を読む meta_name（名の字の守りは起こしの門と同じ safe の 64 字）、結べない訳の型 Miss、札に結べるかの判じ claim（札の agent_id が無いか同じ係の id で、終えの印が無い時だけ結べる）を置く。境界の結びの口の module agent_bind に、札の agent_id と .agents/<係の id> を書く関数 tie（結果の agentId の道と共有）と、meta.json の名の札に結ぶ関数 late を置く。測りの module の関数 resolve は .agents/<係の id> が無い時に late を呼び、係の門（PreToolUse）・測り（PostToolUse）・終える前の門（SubagentStop）は resolve を通るので、どの門が先に撃たれても 1 度目の呼びで結ぶ。係の id の字の形から名を切り出さない（Claude Code の内の形に頼らない）。入力の agent_type も名として読まない（team でない形では係の型になる）。

      結べない時。訳の字は 6 つで、係の記録の隣の meta.json が読めない・meta.json に名が無い・名 <名> の札が無い・名 <名> の札は別の係の id <係の id> に結ばれている・名 <名> の札に終えの印が在る・結びを書けない（書けない時はその誤りの字が続く）。測りと終える前の門は標準エラーにちょうど 1 行、tz hook agent: 係の id <係の id> を係の札に結べない（<訳>・門は通す） を書き、unbound.jsonl の行に欄 cause で訳を足して通す（判断の記録 ADR-59 の決定 (4) の通しのまま・要件 FR21 の係と結べない呼びは通して記帳する）。記帳の行の鍵は agent_id・at・cause・event・tool の順。係の門は結べない時は何も書かずに通す（記帳は同じ呼びの後の測りが書く・今のまま）。標準エラーの行は rc 0 の hook の出力として記録の hook の行に残るが、席の文脈には入らない（席の記録の rc 0 の hook の行は欄 content が空）ので、席は unbound.jsonl の cause を読む。

      出す物の字の形。終える前の門は札の出す物の字を係の出力の dir <名>/w/ に join して探す（中核の stop の lacks と境界の subagent_stop）ので、出す物の字は w/ からの相対が正本である。頼みに w/notes.md と書くと <名>/w/w/notes.md を探し、結びが直ると全部の係が 1 度目の終わりに出す物の欠けで止まる（係 w236a が試作で再現した）。中核の spec の子の module outs に、w/ か / で始まる字と .. の段を持つ字を並びのまま選ぶ astray、直した字を返す mend、断りの理由の字の reason を置き、起こしの判じ judge は頭を読んだ後、対象の重なりの前にその字を断りの型 Refusal::Outputs にする。理由は 係の起こしの門は止める（出す物の字 <断った字を・で繋いだ字> が出力の dir w/ からの相対でない・w/ か / で始まるか .. の段を持つ） 次の一手 = prompt の頭に次の 4 行を置き、空の行の後に頼みを書く に続けて、直した頭の見本（関数 fixed）の出す物の行だけを mend で直した 4 行を持つ。直し方は、/ で始まるか .. の段を持つ字は最後の /w/ の後にし、それでも / で始まるか .. の段を持てば末の段にし、頭の w/ を全部外す。直して空になる字は落とし、全部落ちれば書き方 <file>,<file> を書く。

      依存と並べ方。depends は空。並ぶ未着地の行 ag-floor-rec・ag-ref2・ag-budget-floor（main に置かれた差の file）とこの行は、境界の subagent_stop.rs と中核の spec.rs と meter.rs を書き合うが、変えた行の間を離した。spec.rs はこの行が子の module の宣言・断りの型の 1 欄・judge の頭の読みの後の 4 行・reason の型の腕の後の 1 腕で、ag-budget-floor は module の doc・定数・HeadError・head・fixed・reason の Low の腕。meter.rs はこの行が unbound_line だけで、ag-budget-floor は頭の use と数えの関数。subagent_stop.rs はこの行が resolve の呼びの 1 か所で、ag-floor-rec は doc と引数の読みと欠けの足し、ag-budget-floor は doc と助けの関数と末。main a5dc75be を読んだ一時の index で、この差と 3 行の差は行ごとに両順で同じ木になり、3 行の差を全部先に当てた順と全部後に当てた順でも同じ木になった（係 w241a の commute の記録）。3 行の差を当てた木にこの差を当てた木で、2 crate の clippy と、段の file agbn・agflr・agbf・agref と群 teeth5・teeth6 の名が ag で始まる歯が全部緑だった。

      歯と噛み。段の file の歯は、tz の binary の hook を標準入力で撃つ歯（置き場は CARGO_TARGET_TMPDIR の下・本物の起草の置き場と git config を読まない・hook の入力と結果と meta.json の欄は試しの窓の記しの形で、会話の id と path は伏せた）と、中核の mend と astray を直に撃つ歯。噛みは試作を commit した後に句ごとに 1 変異を当てて名指しの歯だけを撃ち、句ごとの変異が全部 rc 100（表は係 w241a の notes.md）。変異の無い木の対照は rc 0。境界の着地した係の門の歯（群 teeth5・teeth6 の名が ag で始まる歯）と中核の起こしの門の歯（群 teeth3 の接頭辞 agsp_）も試作の木で緑だった。記帳の行の欄 cause は鍵の順で at と event の間に入るので、着地した歯の記帳の行の頭と末の照らしは変わらない。

      入口の赤。main には段の file agbn.rs が無いので、verify の 3 行目は nextest が test の target を見つけられず rc 101、1 行目は rc 1。

      範囲の外。規律の手引きとその参照の file と係の型の file の字は替えない（並ぶ行 ag-floor-rec・ag-ref2 が参照の file を書く）。席が頼みの頭の出す物を w/ からの相対で書くことは門の断りの理由が見本を返す。結べない係を席の文脈に知らせる口（席の呼びの答えの足し）は置かない。判断の記録 ADR-59 の決定 (4) の字（起こしの結果の係の id を結ぶ）は、結果に係の id の無い形の道が足されるが、名と係の id を結ぶ見分けの形は変わらないので替えない。
  - n: 21
    type: prose
    title: 行 ag-read-scope — 読む範囲を頼みの文が名指し、係は名指しの範囲だけを読む（判断の記録 ADR-63 の決定 (2) の正本へ）
    body: |
      在りか。差の file docs/design/patch/ag-read-scope.patch（5,537 byte）は、main 358e8dde と試作の木（写しは drafts の try-w244a の branch r1 の commit 90d95678・係 w244a）の差で、参照の file plugin/skills/agent-discipline/reference.md の 9 節（見出しと末の 4 項）と、着地済みの段の file crates/tsuzuri-boundary/tests/agref.rs の句の表と頭の doc の 2 file。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。depends は空。同じ参照の file を書く並ぶ未着地の行 ag-floor-rec（7 節と 11 節）とは hunk の文脈が交わらず、一時の index に両順で当てて同じ木 f24dc296 になった。並ぶ未着地の行 ag-bind は同じ file を書かない（両順で同じ木 6c759187）。

      なぜ。持ち主は 2026-10-05 に、係が読むだけで使う token を減らす事を求めた（memo t3-hub.87.32）。調べ係 rs2 の測りでは、器の M の行の起草係 2 体の新しい量のうち、前の係の出す物と設計文書の読みが 1 体 11〜17 万を占め、1 体は手本として前の係の行の字・notes・命令の列・commit の文の案を約 7.9 万 token 読んだ。code はもう sed -n の範囲で読まれ、同じ行の読み直しは 4〜9% だった。読む範囲を頼みの文で名指す手は失う物が無いので、席は問わずに入れると決めた。判断の記録 ADR-63 の決定 (2) は参照の file を席の起草の決まりの唯一の正本としたので、決まりはここに置き、頼みの文は参照の file を名指す。

      形。9 節の見出しを「道具の撃ち方と読む範囲」に直し、末の token の項の後に 4 項を足す。席の側は、読む範囲は頼みの文が名指す事と、頼みの文に書く 3 つ（手本にする前の係の出す物の file と節を 1〜2 本・要件と判断の記録の id と節・読む code の file と fn）の項（起草係の新しい量の大きな分が前の係の出す物と設計文書の読みである訳つき）。係の側は、file を丸ごと cat せず grep -n で行を当てて sed -n で当てた範囲だけを読む項、前の係の出す物は頼みの文が名指した file と節だけを読み名指しの無い前の係の出す物を手本にも読まない項、要件と判断の記録は id を grep -A で読み全文を読まない項。長い出力を file に落として落ちた所だけを読む事と同じ file の全文を読み直さない事は、9 節の token の項が既に持つので重ねない。参照の file は 103 行から 107 行になる。着地済みの段の file agref.rs の句の表に 5 句を足し（表の長さを 19 から 24 に）、頭の doc に行の名と読む範囲の 5 句を足す。歯の fn の本文は替えない。

      done と verify の対応。1 番目の項は verify の 1 行目、2 番目と最後の 3 番目の項は 3 行目（着地済みの段の file tests/agref.rs の歯 agref_）で測る。同じ file の着地済みの歯 agref_copied_width_and_old_budget_are_named と agref_help_width_tooth_lives_in_the_vessel も撃たれて緑のまま（本文を替えない・done に載せない）。2 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので verify に書かない。欄 done-teeth は番号つきの項ごとに歯を名指し、1 番目は verify の 1 行目（@1）、2 番目と 3 番目は fn の本文を替えない既存の歯なので = の形。入口の赤は、main の参照の file では 5 句が無いので 2 番目と 3 番目の項の歯が落ちる（3 行目が rc 100）。見出しの直しの字は歯で測らない（差の file が持つ）。

      歯と噛み。句は行 ag-ref と ag-ref2 と同じ段の file の同じ表で測る（同じ参照の file の句の照らしを割らない・新しい段の file を足さない）。参照の file は天井の文で振る舞いを持たないので、歯は字を節の塊の中で照らし、1 度だけである事を数で断言する。句は最後の節（11 節）でなく 9 節に置くので、最後の節へ動かす見本が句の外れを名指せる。噛みは係が撃った（表は係 w244a の notes.md の 4 節）。

      U と範囲の外。読む範囲の決まりを門へ上げる事（頼みの頭に読む物の欄を足す・係の読みの量を測りの注ぎで見る）は別の行。SKILL.md は替えない（本文の字数と決まりの行の数を着地済みの歯 agpl_ が断言する）。code の地図と意味の道（rust-analyzer）は memo t3-hub.87.32 の別の候補で、この行は持たない。
  - n: 22
    type: prose
    title: 器の行 v-scope-paths — 器の宣言の任意 key scope-paths で器の面に path を足す（判断の記録 ADR-63 の撤退 (8) と ADR-33 の決定 (12)・問い t3-hub.87.39）
    body: |
      在りか。差の file docs/design/patch/v-scope-paths.patch（25,983 byte）は、main 358e8dde と、その上の試作の commit 678948ae（tree c4f279ec・写しは drafts の try-w243a の branch w243a・係 w243a）の差（器の 7 file・+191 −25）。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      なぜ。器の追随の再 gate と着地の後の検出線と差の当たり（判断の記録 ADR-60）の面は、根からの相対の字の集合（land.rs の DETECTION_SCOPE・crates/・Cargo.toml・Cargo.lock・rules/・.vessel.toml）と、宣言の crate-roots が足す根の下の crate の和である。行 v-roots が scribe2/crates/ を根に足しても、器の binary が組みの時に読み込む規則の表 scribe2/rules/ と、器の workspace の scribe2/Cargo.toml と scribe2/Cargo.lock は面の外に残る（器だけの repo では根の rules/・Cargo.toml・Cargo.lock として面に入っていた）。これらだけを書く器の便が着地すると、走る器の便は撃ち直さずに着地する。器を書く便を同時 1 本にする床（判断の記録 ADR-63 の撤退 (8) と ADR-33 の決定 (12)）を外す前に、この穴を塞ぐ。問い t3-hub.87.39 の甲・乙・丙のどれでも塞ぐ（答えの判断の記録は席が拠りの字に足す）。器の code に scribe2/ の字を書かず、値は宣言が持つ（ADR-63 の決定 (13) と同じ作法）。

      形。宣言の読みの子 module declaration/crate_roots.rs が、任意 key scope-paths（定数 SCOPE_KEY）を crate-roots と同じ HEAD の口で読む。2 key の値は型 Added（欄 roots と paths）にまとめ、宣言の値 Declared の欄 crate_roots を欄 added に替える（Declared::parse の行の数は替えない・clippy の too_many_lines の 60 行にちょうど届いているため）。HEAD の 3 値 RootsAtHead の Declared は Added を持ち、2 key のどちらも無い宣言は Fixed のまま。面の判じの 1 本 land.rs の scope_touched が、宣言した面の path に触れる path も面に読む。照らしの dir と file の分け（末尾 / は接頭辞・ほかは字の一致）は既存の in_face を pub(crate) にして 1 本で使い、宣言の読みの重なりの照らしも同じ in_face を読む（器の憲法 C2・判じを 2 か所に持たない）。追随の再 gate の省き regate_skippable・着地の後の検出線の touches_scope・差の当たりの on_face は今も scope_touched を通るので書き替えない。項目の不備は、面に何も足さない形（空字・前後の空白・絶対 path・.. の段・空の段か . の段・固定の面の中・ほかの項目と重なる）を、key と行番号を名指して断る（器の行 v-one-vessel の run-cap-paths の断りに倣う・配列でない値と空の配列は既存の配列の層が断る）。断った宣言は読めない宣言で、追随は撃ち直し、判じは fail-closed に倒れる。ほかに、key の列 DECLARED_KEYS と OPTIONAL_KEYS の crate-roots の直後に SCOPE_KEY を足し、受付の表の事実 table_facts と gate の名の歯の在りか（gate/verify.rs）は根を Added の roots から読む（振る舞いは替えない）。

      依存と順。depends は書かない。この行は器の code を書くので、器を書く便の数に入る。欄 done-teeth の名の歯は、gate が便の HEAD の宣言の根で探すので、行 v-roots（scribe2/crates/ を根に足す）の着地の後に起こす便で解ける。席は便の bead に v-roots の bead への依存を持たせる（toml の depends は同じノートの行しか名指せず、v-roots は同じノートに在るが code を呼ばないので depends に書かない）。並ぶ未着地の行（v-one-vessel・v-gate-findings・v-commute-ledger・v-commute-on・v-run-write・v-join-xt・t-run-cap-on・v-roots）の差とは、main 358e8dde の一時の index で両順に当てて同じ木になる（係 w243a の commute.py と log の commute1.log・全部を積んだ木も両順で同じ）。宣言の読みの declaration.rs では、Declared::parse の 2 行（let と Ok の欄）が行 v-one-vessel の差の替える行と 6 行と 9 行離れる（hunk の文脈は 0 行と 3 行）。名を替えずに欄の型だけを替えれば hunk は消えるが、欄 crate_roots が面の path も持つ名になるので、名を替えた（置き場の妥協ではない・両順の当たりで確かめた）。

      done と verify の対応。1 番目の項は verify の 1 行目。2 番目から 8 番目の項は 3 行目（器の lib の vscope_ の歯・crate_roots.rs に 4 本・land.rs と land/detection.rs と commute.rs の既存の mod tests に 1 本ずつ）。9 番目の項は 4 行目（key の列の既存の歯・本文の列に 1 行足す）。最後の項は 5 行目（crate-roots の既存の歯のうち本文を Added の形に替えた 3 本を名指す・同じ filter が選ぶ本文を替えない 4 本も緑・write_set.rs の 1 本は置き場だけの = の項で write-set に置く）。2 行目の clippy は done の項にしない。xtask の check は器の共通 verify が撃つので書かない。

      歯と噛み。宣言の読みと面の判じの表は pure な関数を直に撃ち、HEAD の口と 3 つの呼び手（追随・検出線・差の当たり）は使い捨ての git repo の宣言を HEAD から読む（既存の fixture notes_repo と差の当たりの場 place を使う）。噛みは試作を commit した後に句ごとに 1 変異を当て、名指しの歯が rc 100、変異の無い対照は rc 0（変異 18・表は係 w243a の bite/bite.tsv と、当て所を DECLARED_KEYS に絞って撃ち直した key の列の 1 変異の bite/bite-on.tsv）。

      入口の赤。main の器は scope-paths を未知の key として断り、vscope_ の歯と型 Added が無いので、verify の 3 行目は組めずに落ち、4 行目と 5 行目も歯の本文の字が無いので組めずに落ちる。

      範囲の外。宣言に scribe2/rules/ と scribe2/Cargo.toml と scribe2/Cargo.lock を書くこと（行 t-scope-on・器の binary の入れ替えの後）・器を書く便の同時 1 本の床を外すこと（ADR-63 の撤退 (8) の行・問い t3-hub.87.39）・器の binary の入れ替え（席の手）・項目が repo に在るかの照らし（器は知れない・名乗りの行の歯が見る）・crate-roots の根の下の crate の中を面の path に書いた重なり（足す物が無いが 2 key を跨ぐ照らしは足さない）・器の plugin/ と scripts/ と .config/ と docs/（器だけの repo でも面の外だった）・器の設計 doc の 62 節の字（器の設計の契約表は tsuzuri の契約の外）。
  - n: 23
    type: prose
    title: 行 t-scope-on — 器への宣言に scope-paths で器の規則の表と manifest と錠を名乗る（判断の記録 ADR-63 の撤退 (8) と ADR-33 の決定 (12)・問い t3-hub.87.39）
    body: |
      在りか。差の file docs/design/patch/t-scope-on.patch（6,905 byte）は、main 358e8dde と、試作の commit 29386f54（tree b21f6819・行 v-scope-paths の試作 678948ae の上・写しは drafts の try-w243a の branch w243a・係 w243a）の .vessel.toml と xtask/tests/scopeon.rs の差（2 file・+114）。.vessel.toml の任意 key constitution の行の後、seat-constitution の注の前に、注 2 行と scope-paths の 1 行を足し、段の file xtask/tests/scopeon.rs（群の main.rs と kfold.rs は書かない）を足す。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      依存と順。depends は v-scope-paths。並べられない訳は、器は宣言の未知の key を宣言ごとの不備として断るので、scope-paths を読める器の binary が PATH に入る前にこの行が着地すると、全部の受付と列の判定と着地の終端が宣言の不備で止まるため。席は v-scope-paths の着地の後に器の binary を入れ替え、入れ替えの前はこの行の bead を hold に置く（入れ替えは toml の depends では持てない）。この行は器の code を書かないので、器を書く便の数に入らない。同じ .vessel.toml を書く並ぶ行 v-roots（crate-roots の行とその上の注）と t-run-cap-on（file の末）とは、main 358e8dde の一時の index で両順に当てて同じ木になる（係 w243a の commute1.log）。足す 3 行と 2 つの行の替える行は 7 行ずつ離れる（hunk の文脈は 1 行ずつ）。file が 34 行で、2 つの行の hunk の間が 8 行しか無いので、文脈を 4 行離せる置き場は意味の近い key の並びの中に無い。

      なぜ。行 v-scope-paths の節のとおり、行 v-roots の後も器の規則の表と器の workspace の manifest と錠は器の追随の再 gate と着地の後の検出線と差の当たりの面の外に残る。この行は宣言にその 3 つを書き、器だけの repo の線（根の rules/・Cargo.toml・Cargo.lock）に揃える。判断の記録 ADR-63 の撤退 (8) と ADR-33 の決定 (12) の床を外す前に、問い t3-hub.87.39 の答えに従って流す（甲と丙では床を外す行に畳んでもよい・同じ .vessel.toml を書く）。

      形。宣言の行は scope-paths = の後に、二重引用符で囲んだ scribe2/rules/ と scribe2/Cargo.toml と scribe2/Cargo.lock の 3 項目の配列（末尾 / の項目は dir・ほかは file）。注は、器の任意の key と読み手の行と、3 つが器の crate の外に在り crate-roots では面に入らないことを書く。

      done と verify の対応。1 番目の項は verify の 1 行目、2 番目から最後の項は 3 行目（段の file tests/scopeon.rs の scopeon_ の 3 本）。2 行目の clippy は done の項にしない。

      歯と噛み。歯は根の .vessel.toml の字を注の行を除いて key で拾い、repo の追跡する file を git ls-files で読む（外の依存を使わない・行 v-roots の歯 vroots_ と同じ数え方）。器は宣言の項目が repo に在るかを知れないので、名指しの外れはこの歯が見る。行 v-join などが scribe2/Cargo.toml か scribe2/Cargo.lock を動かすと、3 番目の項の歯が落ちるので、その行は宣言のこの行と歯の定数を同じ行で直す。噛みは試作を commit した後に句ごとに .vessel.toml と歯の読み手へ 1 変異を当てて名指しの歯が rc 100、対照は rc 0（変異 6・表は係 w243a の bite/bite-on.tsv）。

      入口の赤。main には段の file tests/scopeon.rs が無いので、verify の 3 行目は組めずに落ちる。

      範囲の外。器の読み手（行 v-scope-paths）・器の binary の入れ替え（席の手）・器を書く便の同時 1 本の床を外すこと（ADR-63 の撤退 (8) の行・問い t3-hub.87.39）・器の plugin/ と scripts/ と .config/ と docs/ を面に入れること（器だけの repo でも面の外だった）。
  - n: 24
    type: prose
    title: 行 t-anchor-chain — folio の凍結 anchor の列の検査の段を親が並べて呼ぶ形へ（判断の記録 ADR-63 の帰結の段 S3）
    body: |
      done と verify の対応。1 番目の項は verify の 1 行目、2 番目から 4 番目の項は 3 行目（新しい段の file tests/achain.rs の歯 achain_）、最後の 5 番目の項は 4 行目から 6 行目（着地済みの群 tz1 と tz3 の歯）で測る。4 行目の絞り anchor_ は名の部分の字で、群 tz1 の module anchor のほかに bundle と constitution_range と derive の歯も 1 本ずつ撃つので、その 3 file も置き場だけの項（=）で write-set に置く（本文は替えない・done に載せない）。2 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので verify に書かない。欄 done-teeth は番号つきの項ごとに歯を名指し、1 番目は verify の 1 行目（@1）、2 番目から 4 番目は差の file が足す歯、5 番目は fn の本文を替えない既存の歯だが、群 tz1 と tz3 は境界の package が folio の歯の置き場の file を組む群で、器は --test の群を境界の crate の dir の下で探して名を解けないので、検証行の番号の形（@4・@5・@6）。入口の赤は、main の anchor.rs では親が段 read_chain だけを呼び段 read_current が無いので 2 番目と 3 番目と 4 番目の項の歯が落ちる（3 行目が rc 100）。

      在りか。差の file docs/design/patch/t-anchor-chain.patch（18,581 byte）は、main aae602c1 と試作の木（写しは drafts の try-w246a の branch r1 の commit ac530d36・係 w246a）の差で、folio の検査の file folio2/crates/folio/src/anchor.rs と、新しい段の file folio2/crates/folio/tests/achain.rs と、folio の manifest folio2/crates/folio/Cargo.toml の 3 file。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。depends は空。main の docs/design/patch の未着地の行の差は、この 3 file のどれも書かない。

      なぜ。folio の凍結 anchor の列の検査は 8 つの段（read_chain から finish まで）が、それぞれの末で次の段を呼ぶ数珠の形で、段を足す行も段の中を直す行も、前の段の末の呼びと段の引数の受け渡しを書き替え、同じ関数の連なりに触る（判断の記録 ADR-63 の帰結の段 S3 の候補・memo t3-hub.87.18）。親の関数が段を並べて呼ぶ形なら、段を足す行は親に 1 行と新しい段の関数を足すだけで、ほかの段の本文に触らない。

      形。親 check_anchor（引数と返り値と doc の 3 行は今のまま）は、今の頭の憲法の読み（現行の写し・版・承認・名）を新しい段の関数 read_current へ移し、read_current・read_chain・check_git_records・check_index・check_versions・check_reuse・check_pairs・check_current・finish をこの順に 1 度ずつ呼ぶ。段は現行の読みと列の結果を親から借り（check_git_records と check_index は列の結果に書くので書ける借り、ほかは読むだけの借り）、次の段を呼ばない。read_current と read_chain は読めた物を返し、読めない時の止まりは親の 2 つの ? が持つ。finish は State を返し、親が Some で包む。段の順・途中で止まる条件（憲法と現行の写しと anchors/ が読めない時だけ）・出す字と順は替えない。段の本文は分け取りの字（= cur を = *cur に、= chain を = *chain に）と末の次の段の呼びの外しだけを替え、check_file と check_entries と check_start_approvals へは借りをそのまま渡す。doc は親に段の並べ方の 1 行を足し、現行の読みと列の結果の型と read_chain の 1 行を、段の間で受け渡す字から親が貸す字へ直す。anchor.rs は幅で正規化した行で 1348 から 1360 になり（上限 1500 の余地 152）、欄 growth に 12 を書く。新しい段の file は folio の歯の置き場の直下に置き、folio の manifest は autotests = false なので、表 [[test]] の名 achain だけの項（path の欄なし）を足す（畳みの道具 fold2.py と xtask の歯 f2ret_folio_tests_named_once が読む形）。

      歯と噛み。段の形は出す字に現れず（段が次の段を呼ぶ数珠の形でも同じ字を同じ順に出す）、振る舞いの歯では測れないので、新しい歯は source の字を関数の範囲（宣言の行から行の頭の閉じ括弧の行の前まで）の中で照らし、呼びの数と順を断言する（判断の記録 ADR-63 の決定 (2) の (d)）。着地済みの振る舞いの歯は字の在る無しと違反の数を測り、段をまたぐ字の順は測らないので、順は 2 番目の項の歯が呼びの順で持つ。歯は source を crate の manifest の dir から include_str! で読み、歯の file の置き場に依らない（畳みで群へ移っても path を直さない）。否定の見本は本物の source から 1 句だけ外した写しで、元の字がちょうど 1 度在ることを先に断言する。噛みは係が撃った（表は係 w246a の notes.md）。親の呼びの入れ替え・外し・2 度は 2 番目の項の歯を、段の末の次の段の呼びと段の宣言の名替えは 3 番目の項の歯を、判じの句ごとの変異は 4 番目の項の歯を落とし、親から段 check_reuse の呼びを外すと 5 番目の項の歯 floor_cases_all_pass_with_folio も落ちる（どれも rc 100）。

      範囲の外。verify の絞りを名の部分の字から module の path の頭へ替える形（memo t3-hub.87.18 の候補の後半）は、この行で替えない（判断の記録 ADR-32 の決定 (7) との関わりと器の要否の所見は係 w246a の notes.md）。folio のほかの検査の file の数珠と、段を足す行は別の行。
  - n: 25
    type: prose
    title: 行 t-doc-ids-a — 根の src の module の頭の doc の行の id の前半を外し、crate ごとの上限で数える lint の歯を足す（判断の記録 ADR-63 の決定 (2) の (b)）
    body: |
      在りか。差の file docs/design/patch/t-doc-ids-a.patch（131,626 byte）は、main aae602c1 と試作の木（写しは drafts の try-w245a の branch r1 の commit f6ccbe27・係 w245a）の差の、中核の src/account/mod.rs の 1 行目の + の行だけを、行の id の項を外して規則の行 R-22 の項だけを括弧に持つ字に替えた差で（便 t3-hub.87.33.3 の gate の FAIL の直し・係 w247a・直しの差を main 4829ee8e に当てた木は写し try-w247a の branch afix の commit 3abb795e）、根の 3 crate の src の 81 file の内側の doc の行の直しと、新しい段の file xtask/tests/mdid.rs。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。depends は空。このノートの未着地の行（t-run-cap-on・t-scope-on・v-roots と器の行）の差は crates/ の src を書かず、xtask/tests/ に足す段の file の名も違う。gate に渡す差（git diff の byte）は 126,378 byte で、上限 150,000 byte の内。

      なぜ。行の id（契約表の行の id・台帳の bead の id）の正本は契約と commit で、module の頭の doc に写した id は古び、並ぶ行の差の塊の重なりの元になる（判断の記録 ADR-63 の決定 (2) の (b)）。決定は、正規表現で数えられるのでこの行で xtask の lint の歯にし、それまでは規律の手引きの参照の file の 3 節の天井とした。

