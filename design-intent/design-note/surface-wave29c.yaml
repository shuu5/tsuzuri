  - n: 3
    type: prose
    title: 行 ag-plugin — 係の型と規律の手引きと門の設定（plugin の agents と skill agent-discipline と hooks.json・判断の記録 ADR-59 の決定 (1)(2)(5)(6) と ADR-61 の決定 (4)(9)）
    body: |
      在りか。差の file docs/design/patch/ag-plugin.patch（50,233 byte）は、main d0d07c1a にノート surface-wave29b の未着地の行 ag-stop・ag-gjudge・ag-gspawn の差を当てた木 c5117a96 と、試作の木 1b6b61cc の差（写しは drafts の try-w225a・係 w225a）。差は 11 file で、3 行の書く file と交わらない。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。ノートを跨ぐので depends は空で、順は便の bead の依存で持つ（歯が ag-stop の口 subagent_stop の USAGE と、ag-gjudge の group の WORKFLOW と KEY を使い、流れの道具の呼びの断りは ag-gspawn が置く）。差は 3 行の前の木にも当たるが、3 行の着地の前は歯が組めない。

      なぜ。判断の記録 ADR-59 の決定 (1) は、席が起こす係を tsuzuri の plugin の型 3 本のどれかとし、型の数を歯が数えるとした。決定 (2) は頼みの頭を 4 行とし、決定 (5) は判じを tz の 5 つの口に置き、plugin の型の定義が門を持てないので口を hooks.json に置くとした。決定 (6) は、規律の手引き agent-discipline を型の手引きの欄で前置きし、本文を 2,000 字以下・説明の欄を引き金だけ・各決まりの末に止める門の名か天井だけとし、席の手元の手引きの段を参照の file へ移すとした。判断の記録 ADR-61 の決定 (1) は検証の群の係の頭に 5 行目を足し、決定 (4) は起こしの門が席の流れの道具 Workflow の呼びを全部断るとし、決定 (9) は群の手順を参照の file に書くとした。口の 5 つは前の行（ag-hook・ag-meter・ag-guard・ag-stop・ag-gspawn）が tz に置き、どの行も hooks.json の口はこの行が足すと書いた。

      形。plugin/agents に drafter.md・verifier.md・researcher.md（頭の欄は name・description・model・skills・model は opus で規則の行 D-1 の席の設定を継がせない形・skills は tsuzuri:agent-discipline・本文は係の役と頭の 4 行の囲みと頼みの file の置き場・検証役だけ 5 行目の群の行）。plugin/skills/agent-discipline に SKILL.md（本文 1,184 字・決まり 17 行・節は 頼みと終わり・予算・置き場と組み・検査）と reference.md（席の手元の手引きの段を、機の path と口座の置き場と古い前例の path を外して移した 11 節・10 節が検証の群の手順・11 節が畳みの行）。plugin.json は鍵を足さず description の末に 1 文を足す（歯 fstop_ が鍵 3 つを断言する）。agents と skills は plugin の既定の dir で読まれる。

      門の設定。hooks.json の PreToolUse に matcher Agent と縦線と Workflow の agent-spawn（timeout 30・群の判じが台帳を読む）と matcher の無い agent-guard、PostToolUse に matcher Agent の agent-bind と matcher の無い agent-meter、新しい event の鍵 SubagentStop に agent-stop を足す（ほかは timeout 10）。command は今の question-gate の command と同じ形（runner の印の除きの後に tzw の path と hook と口の名と --repo と project の dir・path と dir は二重引用符で囲む）で、便の中では印で黙る（ADR-59 の決定 (5)）。今の要素は配列の頭のまま、係の口の要素を後ろに足す。

      着地した歯の直し。PreToolUse と PostToolUse に要素が並ぶと、要素 1 つを断言する着地した歯 3 本が落ちる。gins_ は PreToolUse の matcher Bash の要素を選ぶ助け bash_entry に替えてevent の鍵に SubagentStop を足し、qsig_ は PostToolUse の matcher Bash の要素を選ぶ形に替え、seathk_ は event の鍵を 6 つにし、印を持つ event に SubagentStop を足し、全部の要素の command を照らす助け commands と、最後の要素を書き替える見本の助け edited_last を足した。3 本は rustfmt の形でないので掛けない。歯 fstop_・fdlt_・fdlv_ は Stop・PostToolBatch・UserPromptSubmit を替えないので今の形で通る（係が撃った）。

      done と verify の対応。done の 1 番目の項は verify の 1 行目、2〜6 番目の項は 3 行目（新しい段の file tests/agpl.rs の歯 agpl_ の 5 本）、7 番目の項は 5 行目（中核の群 teeth2 の gins_）、8 番目の項は 6 行目（中核の群 teeth3 の seathk_）、最後の 9 番目の項は 4 行目（境界の群 teeth3 の qsig_）で測る。2 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので verify に書かない。入口の赤は、main に名が agpl_ の歯が無いので 3 行目が --no-tests=fail で落ちる。

      歯と噛み。新しい段の file tests/agpl.rs（判断の記録 ADR-32 の決定 (3)・群の main.rs と kfold.rs は書かない）。境界に置くのは、口の名を境界の hook の USAGE から、型と頭の行を中核の定数から同じ file で組むため（hooks.json は境界の stage の json で読む）。plugin の file を読むだけで tz も器も撃たない。噛みは係が撃った（31 変異・全部 rc 100・対照の 4 つは rc 0・書き戻した後の status は空）。matcher と timeout と口の名と印の除きと event の鍵の変異 6 つで 2 番目の項、型の file の名と name と説明と model と skills の変異 5 つで 3 番目、頭の塊と群の行の変異 3 つで 4 番目、説明と字数と参照の名指しと在りの変異 4 つで 5 番目、門の名と器の門の名と末と数と形ごとの数の変異 5 つで 6 番目、event の鍵と Bash の要素の timeout と数の変異 3 つで 7 番目、event の鍵と最後の要素の印と SubagentStop の印の変異 3 つで 8 番目、async と Bash の要素の数の変異 2 つで 9 番目の項の歯が落ちた。

      U と範囲の外。席の係は名で呼び合う形（teammate）で起きる。この形で PreToolUse の門が席の Agent と Workflow の呼びに撃たれるかと、終わりに SubagentStop が撃たれるかは U（判断の記録 ADR-59 の決定 (7)・ag-stop の着地の後に席が係を 1 体起こして記帳を読み閉じる）。手引きの文の効きの測り。plugin.json の version の上げ（中核の PLUGIN_VERSION と相談の窓の版の照らしに触れる）。席の頼みの文から手引きの段を指さないこと（席の手）。群の係の測りと係の門と終える前の門（後の行）。汎用の部分を器へ移す案（memo）。
  - n: 4
    type: prose
    title: 行 v-commute-wire — 器の入口と起動の列に差の当たりの判じを配線し、結末を断りと待ちの理由に添え、通した組を記帳する（判断の記録 ADR-60 の決定 (3)(4)・器の行の 4 本目）
    body: |
      在りか。差の file docs/design/patch/v-commute-wire.patch は、器の行 v-commute-names の試作の commit 1c916d43（係 w221a・v-self-match と v-patch-field と v-commute-apply と v-commute-names の試作を積んだ木）と、その上に試作の commit 8407b9ce を載せた木（写し drafts/try-w226a の branch w226a-s）との差（14 file・57,025 byte・+441 −73）。main f67926e7 を読んだ一時の index に、未着地の v-commute-apply と v-commute-names の差とこの差をこの順に当てると当たり（tree d38b0773・係が写しで撃った）、その木の scribe2/ の下は試作の木と、この行が書かない 3 file（器の build.rs と build/rerun.rs と e2e の seat.rs・main で後から着地した字）を除いて同じ。便は差を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。器を書く便は同時に 1 本まで（判断の記録 ADR-33 の決定 (12)・判断の記録 ADR-60 の決定 (10)）。

      依存と順。前の行 v-commute-names（関数 judge の名の段）はノート surface-wave29b に在り、depends は同じノートの行だけを書けるので depends は空で、順は便の bead の依存で持つ（前例はこのノートの行 ag-plugin）。意味の依存: 関数 judge と型 Ask・Partner・Verdict と関数 on を v-commute-apply が、名の段を v-commute-names が足し、この行はその上に呼び手を足す。v-commute-apply と v-commute-names の差は src/pipe/commute.rs を足して書くので、この差は 2 本の着地の後にだけ当たる。

      なぜ。判断の記録 ADR-60 の決定 (3) は、判じを純な交わりの関数の中でなく、入口と起動の列がその関数の後に呼ぶ 1 本の関数に置き、行の予約の照らしと回答で書く file を広げる周の照らし直しは file の交わりのまま替えず、入口と起動の列の間に main が動いて判じが割れたら入口の判じが勝って受付の断りとして今の口で記帳すると決めた。決定 (4) は待ちの理由の重なりに判じの結末を閉じた列で添え、通した組を出来事の記録に 1 行（2 つの bead・交わった file・main の先端）記帳すると決め、決定 (5) は通すかどうかを規則の行 pipe.overlap_commute が持ち、偽の値で入れて後の器の行で真にすると決めた。前の 2 行は判じの関数と名の段を置き、呼び手と時間の上限の値をこの行に渡した。

      形。src/pipe/commute.rs に、周の材料の型 Scene（repo・規則の表・state dir・base の tracked file）と結果の型 Weighed（結末・main の先端・相手・交わった項）と、1 本の関数 weigh と、記帳の関数 record と、時間の上限の定数 LIMIT（20 秒）を足した。weigh は、規則の行が偽の周と交差の無い周は None を返し（呼び手は今の断りと待ちのまま）、真の周は、交差の照らし（intake の crossings）が返した live な便のうち交差の空でない run を run id の末の時刻の順に、列が同じ周に起こした bead をその後に並べて相手にし、相手の契約の写しと base を置き場から読み（spawn の前で base の記帳の無い便は main の先端・起こした bead も main の先端）、交差の組を同じ overlaps で測り直して judge を撃つ。live な便の写しか base を読めない周と、main の先端を読めない周は judge を撃たずに unreadable。judge の時間切れは Ask の deadline（今の時刻に LIMIT を足した時刻）。

      受付。src/pipe/cli/intake.rs の exclude_overlap は、交差の照らしの後に交差が在れば weigh を撃ち、commutes なら通して Crossed の新しい欄 commuted に結果を持ち、ほかは断りの WriteSetOverlap（src/pipe/refuse.rs）の新しい欄 verdict に結末を添えて断る（規則の行が偽なら None で今の断りの字）。断りの 1 行は、結末の在る周だけ交わった path の後に中黒と結末の字を足す。受付の create は、RunCreated の記帳の後に、commuted の在る周だけ record でkind OverlapCommuted を 1 行書く（受付の入口の lock の中・判定だけの preflight と列は書かない）。判じは受付の周の main で撃ち直すので、列が通した後にmain が動いて当たらなくなった組は受付が断る（入口が勝つ・断りは今の口）。

      列。src/pipe/dispatch/candidates.rs の blocker の交差の段を新しい関数 overlap に移し、同じ周に起こした bead との交差を先に、live な便との交差を後に測る（同じ周に起こした便の列は write-set の写しから契約の借りに替えた）。規則の行が偽で同じ周に起こした bead と交差した周は、今と同じく live な便を読まずに先頭の組で待つ。ほかは weigh を撃ち、commutes なら待たせずに後の照らし（受付の判定と枠）へ進み、ほかは先頭の組の相手と file に結末を添えたWaitReason::Overlap（src/pipe/dispatch.rs の新しい欄 verdict）で待つ。render は結末の在る周だけ字 / と結末を足す（偽の周の字は今のまま）。行の予約の照らし（reserve.rs）と兄弟の待ちは替えない。

      記帳の型。src/fleet/mod.rs の EventKind に OverlapCommuted を宣言の末に足し（KINDS の末・字は OverlapCommuted・既定の actor は machine）、形は案件の一生と同じ Case（便に紐づかない＝replay が便を作らず段も detail も動かさない）とし、本体の型 Case に欄を持たない Commuted を足した（memo の判定の Judged を使い回すと、Judged を kind を見ずに拾う読み手 lifecycle_mark が混ぜるため）。src/fleet/event.rs は bead と空でない detail を要る読み手 commuted_of を、src/fleet/replay.rs は 2 つの網羅の match の何もしない腕に足した。KINDS の母集団が 31 から 32 になるので、母集団と末尾を断言する着地した e2e の歯（fleet.rs の fleet_kinds_follow_declaration_order・fleet/json.rs の 3 本・fleet/account.rs の 1 本・pipe/gate.rs の 2 か所）の数と末尾の字を直した（LimitPermitted は末尾の 1 つ前・MemoJudged はその前）。

      done と verify の対応。1 番目の項は verify の 1 行目。2 番目から 6 番目の項は 3 行目（新しい e2e の子 module tests/e2e/pipe/dispatch/commute.rs の歯 vcwire_ の 5 本・親 tests/e2e/pipe/dispatch.rs に mod の 1 行と module の doc の 1 句）。最後の 7 番目の項は 4 行目（器の lib の歯 1 本・結末の在る見本を 1 つ足した）。2 行目の器の clippy は命令の rc で測る守りで、done に載せない。xtask の check は器の共通 verify が gate の各段で撃つので verify に書かない。直した KINDS の歯と前の行の歯 vcapply_・vcnames_ は共通 verify の器の歯の全部で撃たれる。欄 done-teeth は書かない。

      e2e の場。toy repo に面の中の file crates/toy/src/lib.rs（30 行・行 n は l と n）と、行ごとの差の file docs/p/<行>.patch（1 行を替える・文脈 3 行）と、write-set がその file 1 本の行 a・b・c・f・d（d は欄 patch を持たない）を 1 回で commit する。規則の行は manifest の写しから同じ id の塊を除いて値の塊を足す（行なし・false・true）。live な便は行 a の受付（審査 PASS の偽の lens）で起こす。

      入口の赤。main には tests/e2e/pipe/dispatch/commute.rs も名に vcwire_ を持つ歯も無いので、verify の 3 行目は --no-tests=fail で落ちる。4 行目の歯は main に在るが、結末の欄の無い main では組めない。

      試作と噛み。写し drafts/try-w226a で書く file は write-set の中で閉じる（14 file）。試作の木で verify の 1 行目から最後の行までが rc 0 で、器の入れ子の歯の全部（cd scribe2 で cargo nextest run --workspace --no-fail-fast）は 4,163 本が通り、器の xtask の check も rc 0（core-lines 85586/90000・intake.rs は幅で数えて 1492/1500）。根の xtask の check は撃っていない（書く file は全部 scribe2/ の下）。噛みは 9 の変異（記帳を外す・detail の並び・断りの字の結末・判じの結末を問わず通す・規則の行を読まない・同じ周に起こした bead を相手から外す・live な便を先に名乗る・main の先端の 1 つ前で判じる・描きの結末を外す）が全部 rc 100 で名指した歯が落ちた（2 番目から 7 番目の項の歯に各 1 つ以上・書き戻した後の写しは clean）。

      範囲の外。着地の記帳（積み直しの衝突・stale・再 gate の不合格・候補の木の赤と行の差の数・v-commute-ledger）・規則の行を真にする（v-commute-on）・席の置く前の照らしの道具（席の手）・器の binary の入れ替え（席の手）。この行の契約表の行は欄 patch を書かない（前の行と同じ・規則の行が偽の間は判じに使われない）。
