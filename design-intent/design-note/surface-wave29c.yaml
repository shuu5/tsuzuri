    title: 行 t-helper-fold-c — 境界の群 teeth4・teeth5 と面の群 teeth1・teeth2 の helper の字で同じ写しを群の共通の module へ寄せる（判断の記録 ADR-63 の決定 (8) の (c)・寄せの行の 3 本目）
    body: |
      done と verify の対応。1 番目の項は verify の 1 行目、2 番目の項は 4 行目（xtask の群 teeth1 の歯 kfold_）、3 番目の項は 3 行目（行 t-helper-fold-a の段の file xtask/tests/hpool.rs の歯 hpool_）、4 番目の項は 5 行目から 8 行目（境界の群 teeth4・teeth5 と面の群 teeth1・teeth2 の歯の全部・絞りなし）、最後の 5 番目の項は 9 行目（命令 kfold-cap）で測る。2 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので verify に書かない。xtask の歯は器の歯の区間の根（crates/ と folio2/crates/）の外なので、欄 done-teeth は verify の行の番号で書く。境界と面の群の歯は根の中に在るが、4 番目の項は群の歯の全部を絞りの無い行で測るので、同じく行の番号で書く（名で指す歯は無い）。3 行目と 4 行目が当たる xtask の file と、5 行目から 8 行目の絞りの無い行が当たる群の file のうち、この行が書かない file は置き場だけの項（=）で write-set に置く。

      在りか。差の file docs/design/patch/t-helper-fold-c.patch（112,325 byte・73 file・+366 −980）は、main f0846c38 に行 t-helper-fold-a の差を当てた土台の木（写しは drafts の try-w251a の branch w251a-base の commit 24ca363c・係 w251a）と、その上の試作の commit 20b47b8a（branch w251a-c）の差で、境界の群 teeth4・teeth5 と面の群 teeth1・teeth2 の module の file（写しを消して use crate::common の行を足す）と、4 群の新しい共通の module common.rs と、群の main.rs の mod common の行を書く。差は行 t-helper-fold-a の差と書く file が交わらず、a の前の main にも当たる。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      依存と順。depends は t-helper-fold-a（同じノート）。並べられない訳は、この行の verify の 3 行目と 4 行目が a の歯に依るためである。群に common.rs を足すと、a の前の main の歯 kfold_groups_declare_every_module_once は common を module に数えて表 GROUPS と食い違い、数えから common を外す替えと、写しが群に残らないことを測る段の file xtask/tests/hpool.rs は a の差に在る。行 t-helper-fold-b とは書く file が交わらず（置き場だけの項の xtask/tests/hpool.rs と xtask/tests/teeth1/kfold.rs だけが重なる）、2 つの差は一時の index で両順に当てて同じ木になる（係 w251a が照らした）ので、depends を書かない。

      なぜ。判断の記録 ADR-63 の決定 (8) の (c) は、畳みの行が群へ移す歯の file の helper のうち中身が字で同じ物を群の dir の共通の module 1 本へ寄せるとし、帰結の 4 つ目の項が、その手を畳みの道具に入れた後に既に群に在る写しを寄せる行 t-helper-fold を挙げた（大きさ L・差の上限で割る・memo t3-hub.87.21）。写しの 1 つを直す行は同じ直しを全部の写しに当てる要がある。行 t-helper-fold-a の節のとおり 6 行に割り、この行は 3 本目で、境界の群 teeth4・teeth5 と面の群 teeth1・teeth2 の 38 class（写し 170 個・746 行・直上の注と属性を含めた字で数える）を寄せる。

      形。畳みの道具 fold2.py の手 --pool（係 w250a の版）を土台の木で境界の 2 群と面の 2 群に撃ち、表 GROUPS は替わらなかった。寄せ方と寄せない物は行 t-helper-fold-a の節の形の段と同じである。群の module の file の頭の段の item（test の属性の付かない fn・const・static・type・struct・enum・union・trait・impl）のうち、群の中の 2 つ以上の file が直上の // と /// の行と属性を含めて字で同じ物を、群の dir の common.rs に 1 つだけ置き、頭に pub が無ければ pub(crate) を足し、写しを持っていた file から消して use crate::common の行で呼ぶ。消した item だけが読んでいた use の葉は外し、葉を外した use の列は道具が字の順に並べ直す。4 群で寄せなかった写しは 23 class で、同じ名で字の違う class が勝つ物 11・寄せない item に依る物 7・名で読めない trait の use を呼ぶかもしれない物 3・use の名の読みが file ごとに違う物 2。歯の fn の本文と名と module の path は替えない。common.rs は rustfmt に掛けない（掛けると寄せた配列の形が替わり、写しの字と離れる）。

      歯と噛み。この行は歯の file を足さず、kfold.rs の表も書かない（群の main.rs には mod common の行だけを足す）。字で同じ写しを寄せても寄せなくても歯の振る舞いは同じなので、写しが群に残らないことは振る舞いの歯では測れず、行 t-helper-fold-a の段の file の歯 hpool_ が群の dir の共通の module と同じ群のほかの .rs の字を読んで測る（判断の記録 ADR-63 の決定 (2) の (d)）。噛みは係が試作を commit した後に句ごとに 1 変異を当てて撃った（表は係 w251a の notes.md）。面の群 teeth2 の main.rs から mod common の行を外す変異は歯 kfold_ を落とし、境界の群 teeth5 の module に共通の fn の写しを足す変異は歯 hpool_ を落とし、4 群それぞれの共通の module の fn の字を替える変異はその群の行を落とした（どれも rc 100）。面の群 teeth2 の共通の module に上限の数の注の行を足す変異は命令 kfold-cap を rc 1 で落とした。変異の無い木の対照は rc 0。

      範囲の外。残りの寄せの行は、境界の群 teeth1 から teeth3（-b）、面の群 teeth3 から teeth5（-d）、folio の群 teeth1 と境界が組む tz1・tz2（-e）、tz3 から tz5（-f）。寄せない写し（4 群で 23 class）はこの行で直さない。verify の絞りを名の部分の字から module の path の頭へ替える形は、この行で替えない（所見は係 w250a の notes.md）。
