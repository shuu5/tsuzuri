      なぜ。判断の記録 ADR-63 の決定 (8) の (c) は、畳みの行が群へ移す歯の file の helper のうち中身が字で同じ物を群の dir の共通の module 1 本へ寄せるとし、帰結の 4 つ目の項が、その手を畳みの道具に入れた後に既に群に在る写しを寄せる行 t-helper-fold を挙げた（大きさ L・差の上限で割る・memo t3-hub.87.21）。群の中で字が同じ helper の写しは main 27ae4daa で 316 class・1,212 個・7,602 行在り（直上の注と属性を含めた字で数える・係 w250a の道具の計り）、写しの 1 つを直す行は同じ直しを全部の写しに当てる要がある。この行は 6 行に割った 1 本目で、中核の 3 群と xtask の群の 38 class（写し 113 個・551 行）を寄せる。

      形。畳みの道具 fold2.py の新しい手（--pool）で寄せた。群の module の file の頭の段の item（test の属性の付かない fn・const・static・type・struct・enum・union・trait・impl）のうち、群の中の 2 つ以上の file が直上の // と /// の行と属性を含めて字で同じ物を、群の dir の common.rs に 1 つだけ置き、頭に pub が無ければ pub(crate) を足し（struct の欄と trait でない impl の中の item にも足す）、写しを持っていた file から消して use crate::common の行で呼ぶ。消した item だけが読んでいた use の葉は外す。字が 1 文字でも違う物・同じ名で別の字の class が勝つ物・file の中の寄せない item に依る物・use の名の読みが file ごとに違う物・名で読めない trait の use を呼ぶかもしれない物は寄せない。歯の fn の本文と名と module の path は替えない。束ねの表の file kfold.rs の歯 kfold_groups_declare_every_module_once は、main.rs が common を名指すことをほかの module と同じに見て、表 GROUPS の module の数には common を数えないように替え、既に common の dir を持つ契約の crate の群 teeth1 の数を 15 から 14 にした。これで後の寄せの行は kfold.rs を書かずに群に common を足せ、互いに同じ file を書かずに並ぶ。common.rs は rustfmt に掛けない（掛けると寄せた配列の形が替わり、写しの字と離れる）。

