  - n: 33
    type: prose
    title: 行 t-helper-fold-e — folio の群 teeth1 と境界の package が組む tz1・tz2 の helper の字で同じ写しを群の共通の module へ寄せ、歯 f2ret を単位の粒で読む形に直す（判断の記録 ADR-63 の決定 (8) の (c)・寄せの行の 5 本目）
    body: |
      done と verify の対応。1 番目の項は verify の 1 行目、2 番目の項は 3 行目（行 t-helper-fold-a の段の file xtask/tests/hpool.rs の歯 hpool_・本物の木の群を読む）、3 番目と 4 番目の項は 4 行目（xtask の群 teeth1 の歯 kfold_）、5 番目の項は 5 行目（xtask の群 teeth1 の module retire.rs の歯 f2ret_）、6 番目の項は 6 行目から 8 行目（folio の群 teeth1 と tz1・tz2 の歯の全部・絞りなし）、最後の項は 9 行目（命令 kfold-cap）で測る。2 行目の clippy は done に載せない守り（xtask の module を書くので -p xtask も撃つ）。xtask の check は器の共通 verify が撃つので verify に書かない。欄 done-teeth は verify の行の番号で書く（この行は歯 f2ret_folio_tests_named_once の本文を替える・xtask の歯と、境界の package が [[test]] の path で組む folio の群 tz1・tz2 の歯は、器が歯の区間を解けない所に在る・folio の群 teeth1 の歯は名でも書けるが、行 -a と同じ番号の形にそろえた）。3 行目から 8 行目の行が当たる file のうち、この行が書かない file は置き場だけの項（=）で write-set に置く。

      在りか。差の file docs/design/patch/t-helper-fold-e.patch（113,391 byte・git diff -M）は、main 188547a8（行 t-helper-fold-a は着地済み）の木（写しは drafts の try-w253a の branch base）と、試作の木（同じ写しの branch re の commit 0a56cb63・係 w253a）の差で、folio の群 teeth1 と tz1・tz2 の module の file（写しを消して use crate::common の行を足す）と、3 群の新しい共通の module common.rs と群の main.rs の mod common の行と、xtask の群 teeth1 の module retire.rs（歯 f2ret_folio_tests_named_once の直し）。寄せの部分は、係 w252a が main f0846c38 に行 -a の差を当てた木で切った差と字で同じ。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。差は kfold.rs を書かない。

      depends は t-helper-fold-a（着地済み）。この行の verify の歯 hpool_ の段の file xtask/tests/hpool.rs と、歯 kfold_ が共通の module を表 GROUPS の module の数に数えない形は行 -a が足し、この行が直す module retire.rs も行 -a が書いたので、この行は行 -a の着地の後の木でだけ通る。ほかの寄せの行 -b・-c・-d とは同じ file を書かないので depends を持たない。行 -f はこの行に depends を持つ（行 -f の寄せの後の木は、この行が直した歯でなければ通らない）。

      なぜ。判断の記録 ADR-63 の決定 (8) の (c) は、群の dir の helper のうち中身が字で同じ物を群の共通の module 1 本へ寄せるとし、帰結の 4 つ目の項が既に群に在る写しを寄せる行 t-helper-fold を挙げた（memo t3-hub.87.21）。写しの 1 つを直す行は同じ直しを全部の写しに当てる要がある。この行は 6 行に割った 5 本目で、folio の群 teeth1 と tz1・tz2 の 52 class（写し 210 個・1,610 行・main f0846c38 に行 -a の差を当てた木で畳みの道具の --pool-measure が数えた・その後の main は folio の歯の file を書いていない）を寄せる。寄せると tz を撃つ helper が群の common.rs へ移り、群 tz1 の adr.rs・anchor.rs と群 tz2 の face_index.rs・face_index_shelf.rs・face_srs_figure.rs が字 CARGO_BIN_EXE_tz を持たなくなる。行 k-tz-tests が足した着地済みの歯 f2ret_folio_tests_named_once は、境界の単位の file の 1 本ずつに字を求めたので、寄せの後の木で落ちた（係 w252a の試作の木の xtask の check）。この行は、歯の意図（境界の package が組む単位は tz を撃ち、folio の歯の単位は 2 つの manifest のどちらか 1 つだけが名指す）を保ち、群の common.rs へ寄せた字も数える単位の粒の読みに直す（席の決め・係 w252a の案 甲）。

      形。行 -a と同じ畳みの道具 fold2.py の手（--pool）で寄せた（群の module の file 23・新しい common.rs 3）。群の module の file の頭の段の item（test の属性の付かない fn・const・static・type・struct・enum・union・trait・impl）のうち、群の中の 2 つ以上の file が直上の // と /// の行と属性を含めて字で同じ物を、群の dir の common.rs に 1 つだけ置き、頭に pub が無ければ pub(crate) を足し（struct の欄と trait でない impl の中の item にも足す）、写しを持っていた file から消して use crate::common の行で呼ぶ。消した item だけが読んでいた use の葉は外す。群の main.rs には mod common の行を名の順の位置に足す。字が 1 文字でも違う物・同じ名で別の字の class が勝つ物・file の中の寄せない item に依る物・use の名の読みが file ごとに違う物・名で読めない trait の use を呼ぶかもしれない物は寄せない（この 3 群で 9 class）。寄せた群の歯の fn の本文と名と module の path は替えない。表 GROUPS の module の数は行 -a の数えで共通の module を数えないので、kfold.rs は書かない。common.rs は rustfmt に掛けない（掛けると寄せた item の形が替わり、写しの字と離れる）。folio の群 teeth1 は folio の crate の test target、tz1・tz2 は境界の package の Cargo.toml の [[test]] が folio2/crates/folio/tests/ の下の main.rs を path で組む群で、どちらも crate の中の共通の module は群の dir の common.rs。

      歯 f2ret の直しの形。module retire.rs に助けの関数 units_firing_tz を足す。単位の名と歯の file の字の対の列を受け、字 CARGO_BIN_EXE_tz を持つ file が 1 本でも在る単位の名の集まりを返す。歯 f2ret_folio_tests_named_once は、単位の歯の file（群は main.rs を除く .rs で、共通の module common.rs を含む）を読んで対の列を作り、その集まりが境界の manifest の [[test]] の名の集まりと等しいことを見る。前の形の、字を持たない file の在る単位を集めて境界の名と交わらないことを見る判じは外す。歯の頭に見本を 2 つ置く。正しい見本は、tz の helper（env の字 CARGO_BIN_EXE_tz の path の Command）を持つ common.rs と、字を持たない module の file の 2 本の群 g で、tz を撃つ単位の集まりが g だけの集まりと等しい。否定の見本は、common.rs の helperだけを env の字でなく名 tz の Command に替え（ほかは同じ）、群のどの file も字を持たないので、集まりが g だけの集まりと等しくない。folio の歯の file が字 CARGO_BIN_EXE_folio を持たないことと、2 つの manifest の表の照らしは替えない。歯の名と module の path と module の歯の fn の数は替えない（歯 f2ret_own_names_clean の数えはそのまま）。

      歯と噛み。この行は歯を足さず、着地済みの歯 f2ret_folio_tests_named_once の本文を替える。単位がどの package の binary を撃つかは、cargo がその binary を持つ package の歯にだけ与える env の字 CARGO_BIN_EXE_<名> で決まり、組んだ歯の振る舞いには出ないので、歯は file の字を照らす形のまま。寄せは字で同じ写しを寄せるだけで歯の振る舞いは同じなので、群の歯が全部通ることと、歯 hpool_ が新しい 3 群の common.rs と群のほかの .rs の字を読んで写しが残らないことと、歯 kfold_ が群の main.rs の mod common の行を見ることで測る。噛みは係が撃った（表は係 w253a の notes.md の噛みの節）。common.rs の helper の fn を群の module の file の頭の段へ写し戻す変異は歯 hpool_ を、群の main.rs から mod common の行を外す変異は歯 kfold_ を、助けの関数 units_firing_tz を単位の全部の file に字を求める判じに替える変異と、字を見ずに file の在る単位を全部返す変異と、群 tz2 の全部の file から字を外す変異は歯 f2ret_ を、群 tz1 の common.rs の helper の字を替える変異は群 tz1 の歯を落とす（どれも rc 100）。群の common.rs に 10,000 行を足す変異は命令 kfold-cap を rc 1 で落とす。

      範囲の外。寄せない写し（同じ名で字の違う物ほか・この 3 群で 9 class）はこの行で直さない。ほかの群は行 -b・-c・-d・-f が寄せる。歯 f2ret の、2 つの manifest の表の照らしと字 CARGO_BIN_EXE_folio の照らしは替えない。verify の絞りを名の部分の字から module の path の頭へ替える形は、この行で替えない。
  - n: 34
    type: prose
    title: 行 t-helper-fold-f — 境界の package が組む folio の群 tz3・tz4・tz5 の helper の字で同じ写しを群の共通の module へ寄せる（判断の記録 ADR-63 の決定 (8) の (c)・寄せの行の 6 本目）
    body: |
      done と verify の対応。1 番目の項は verify の 1 行目、2 番目の項は 3 行目（行 t-helper-fold-a の段の file xtask/tests/hpool.rs の歯 hpool_・本物の木の群を読む）、3 番目と 4 番目の項は 4 行目（xtask の群 teeth1 の歯 kfold_）、5 番目の項は 5 行目（xtask の群 teeth1 の module retire.rs の歯 f2ret_・行 -e が直した形）、6 番目の項は 6 行目から 8 行目（境界の package が組む folio の群 tz3・tz4・tz5 の歯の全部・絞りなし）、7 番目の項は 10 行目（群 tz4 の歯 f89_ だけを絞って撃つ行・絞りなしの 7 行目は filter の語を持たないので、器の審査の表の読みが項目の歯の名を番号の形の内に数えない）、最後の項は 9 行目（命令 kfold-cap）で測る。2 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので verify に書かない。この行は歯を足さず、どの歯の fn の本文も替えないので、欄 done-teeth は verify の行の番号で書く（xtask の歯と、境界の package が [[test]] の path で組む folio の群 tz3・tz4・tz5 の歯は、器が歯の区間を解けない所に在る）。3 行目から 8 行目の行が当たる file のうち、この行が書かない file は置き場だけの項（=）で write-set に置く。

      在りか。差の file docs/design/patch/t-helper-fold-f.patch（92,717 byte・git diff -M）は、main 188547a8 に行 t-helper-fold-e の差を当てた土台の木（写しは drafts の try-w253a の branch re の commit 0a56cb63）と、試作の木（同じ写しの branch rf の commit fb1c88c2・係 w253a）の差で、境界の package が組む folio の群 tz3・tz4・tz5 の module の file（写しを消して use crate::common の行を足す）と、3 群の新しい共通の module common.rs と群の main.rs の mod common の行。差は係 w252a が main f0846c38 に行 -a の差を当てた木で切った差と字で同じで、行 -e の差とは同じ file を書かない。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。差は kfold.rs を書かない。

      depends は t-helper-fold-e。この行の寄せで群 tz4 の file refs.rs・schema.rs・schema_docs.rs が字 CARGO_BIN_EXE_tz を持たなくなり（字は群 tz4 の common.rs へ移る）、群 tz3・tz5 の新しい common.rs も字を持たないので、着地済みの歯 f2ret_folio_tests_named_once の前の形（境界の単位の file の 1 本ずつに字を求める）では落ち、行 -e がその歯を単位の粒で読む形に直した後の木でだけ通る（行 -e と並べられない訳）。行 -a は着地済みで、行 -e が depends に持つ。ほかの寄せの行 -b・-c・-d とは同じ file を書かないので depends を持たない。

      なぜ。判断の記録 ADR-63 の決定 (8) の (c) は、群の dir の helper のうち中身が字で同じ物を群の共通の module 1 本へ寄せるとし、帰結の 4 つ目の項が既に群に在る写しを寄せる行 t-helper-fold を挙げた（memo t3-hub.87.21）。写しの 1 つを直す行は同じ直しを全部の写しに当てる要がある。この行は 6 行に割った 6 本目で、境界の package が組む folio の群 tz3・tz4・tz5 の 36 class（写し 152 個・1,120 行・main f0846c38 に行 -a の差を当てた木で畳みの道具の --pool-measure が数えた・その後の main は folio の歯の file を書いていない）を寄せる。寄せの後の木を通す歯の直しは行 -e が持ち、この行は xtask の file を書かない。

      形。行 -a と同じ畳みの道具 fold2.py の手（--pool）で寄せた（群の module の file 35・新しい common.rs 3）。群の module の file の頭の段の item（test の属性の付かない fn・const・static・type・struct・enum・union・trait・impl）のうち、群の中の 2 つ以上の file が直上の // と /// の行と属性を含めて字で同じ物を、群の dir の common.rs に 1 つだけ置き、頭に pub が無ければ pub(crate) を足し（struct の欄と trait でない impl の中の item にも足す）、写しを持っていた file から消して use crate::common の行で呼ぶ。消した item だけが読んでいた use の葉は外す。群の main.rs には mod common の行を名の順の位置に足す。字が 1 文字でも違う物・同じ名で別の字の class が勝つ物・file の中の寄せない item に依る物・use の名の読みが file ごとに違う物・名で読めない trait の use を呼ぶかもしれない物は寄せない（この 3 群で 8 class）。寄せた群の歯の fn の本文と名と module の path は替えない。表 GROUPS の module の数は行 -a の数えで共通の module を数えないので、kfold.rs は書かない。common.rs は rustfmt に掛けない（掛けると寄せた item の形が替わり、写しの字と離れる）。群 tz4 の file schema.rs と schema_docs.rs は写しを消して縮み、歯 f89_ が見る器の行数の式の上限（700 と 1200）の内に留まり、移した定義の頭 8 本は寄せない（字で同じ写しが無い）。

      歯と噛み。この行は歯を足さず、どの歯の fn の本文も替えない。字で同じ写しを寄せても歯の振る舞いは同じなので、群の歯が全部通ることと、歯 hpool_ が新しい 3 群の common.rs と群のほかの .rs の字を読んで写しが残らないことと、歯 kfold_ が群の main.rs の mod common の行を見ることと、行 -e が直した歯 f2ret_ が寄せの後の木でも境界の単位を tz を撃つ単位と読むことで測る。噛みは係が撃った（表は係 w253a の notes.md の噛みの節）。common.rs の helper の fn を群の module の file の頭の段へ写し戻す変異は歯 hpool_ を、群の main.rs から mod common の行を外す変異は歯 kfold_ を、群 tz4 の全部の file（common.rs を含む）から字 CARGO_BIN_EXE_tz を外す変異は歯 f2ret_ を、群 tz4 の common.rs の helper の字を替える変異は群 tz4 の歯を、schema.rs に 700 行を足す変異は歯 f89_ を落とす（どれも rc 100）。群の common.rs に 10,000 行を足す変異は命令 kfold-cap を rc 1 で落とす。

      範囲の外。寄せない写し（同じ名で字の違う物ほか・この 3 群で 8 class）はこの行で直さない。ほかの群は行 -b・-c・-d・-e が寄せる。歯 f2ret は書かない（直しは行 -e）。verify の絞りを名の部分の字から module の path の頭へ替える形は、この行で替えない。
