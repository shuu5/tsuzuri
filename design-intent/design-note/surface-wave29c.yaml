  note: ノート surface-wave29b（契約表の枠の最後は群の係の門の行に回した）の続きで、生きたノートの上限（規則の行 R-31）のため、契約表の行を持たないノート surface を同じ commit で廃止した。承認は判断の記録 ADR-59 と ADR-61 の持ち主の裁定（承認の列・逐語は各記録の承認の欄の字）。第 0.1 版（2026-10-05）は、目的の節と、判断の記録 ADR-59 と ADR-61 の行 ag-plugin（係の型 3 本と規律の手引き agent-discipline とその参照の file と、hooks.json の係の口 5 つの結びと、着地した hooks.json の歯 3 本の直し・試作と噛みと床は係 w225a・差の file の形・ノートを跨ぐ順は便の bead の依存）を置いた。 第 0.2 版（2026-10-05）は、判断の記録 ADR-60 の決定 (3) と (4) の器の行 v-commute-wire（入口と起動の列が交差の照らしの後に差の当たりの判じを呼ぶ 1 本の関数 weigh・断りと待ちの理由に結末の欄・受付が通した組の kind OverlapCommuted の記帳・判じの時間の上限 20 秒・規則の行は偽のまま・ADR-60 の器の行の 4 本目で前の 3 本はノート surface-wave29b・depends は空で順は便の bead の依存・器を書く便は同時に 1 本まで・試作と噛みと床は係 w226a・差の file の形）を足した。 第 0.3 版（2026-10-05）は、判断の記録 ADR-62 の決定 (6) の器の行 v-follow-mtime（追随の載せ替えの 1 段で、撃つ前に便の自分の差の path の型と中身と作業木の byte の指紋と時刻を控え、載せ替えが通り前後とも木が clean な周に、型と中身と byte の指紋が同じ普通の file だけ時刻を前の値へ戻し、追随ごとに便の dir の記録へ 1 行を書く・差は main で切った・depends は無い・器を書く便は同時に 1 本まで・試作と噛みと床は係 w228a・差の file の形）を足した。 第 0.4 版（2026-10-05）は、判断の記録 ADR-32 の決定 (4) の畳みの行 t-fold-3（段の file 26 本〔xtask 1・core 7・境界 13・面 5〕を crate ごとの最後の群へ名の順に畳み、1 万行を越える境界と面は群 teeth6 を開く・畳まない段の file は無い・上限を越えた着地済みの群〔core の teeth1・境界の teeth3〕から名の順で最後の module〔gext・server_coalesce〕を最後の群へ移して割る・差は main 95153106 で切った・depends は空・試作と噛みと床は係 w230a・差の file の形）を足した。 第 0.5 版（2026-10-05）は、判断の記録 ADR-63 の決定 (8) の (a) の行 t-kfold-cap（束ねの表の file kfold.rs に群の行の上限 1 万と段の file の上限 24 本の定数を置き、xtask の命令 kfold-cap が名指した群の越えだけを落とす・ほかの群の越えと段の本数は名指すだけ・畳みの行の verify だけが名指す・差は main fefb3056 で切った・depends は空・試作と噛みと床は係 w233a・差の file の形）を足した。 第 0.6 版（2026-10-05）は、判断の記録 ADR-63 の決定 (2) と帰結の 9 番目の項の行 ag-ref（規律の手引きの参照の file に、頼みの共通の文にしか無い 3 項と天井の 4 つと案内の幅の歯の名を足し、群の頭の予算の字をちょうど 150000 に直す・新しい段の file tests/agref.rs・差は main fefb3056 で切った・depends は空・欄 done-teeth は名乗りの前なので書かない・試作と噛みと床は係 w232a・差の file の形）を足した。 第 0.7 版（2026-10-05）は、判断の記録 ADR-63 の決定 (5) の行 t-teeth-on（器への宣言 .vessel.toml に器の任意の鍵 teeth-check を真で名乗り、宣言を読む群の module vlanes.rs に名乗りの歯を足す・差は main fefb3056 の上の行 ag-ref の試作で切り書く file が交わらないので main にも当たる・depends は空・欄 done-teeth は書かない・試作と噛みと床は係 w232a・差の file の形）を足した。 第 0.8 版（2026-10-05）は、判断の記録 ADR-63 の決定 (13) の器の行 v-one-vessel（器の宣言の任意 key run-cap と run-cap-paths を読み、write-set がその dir の下を書く契約は、同じ dir の下を書く live な便と同じ周に起こした便が本数に達した周に、受付が断り run-cap で断り、列が待ちの理由 run-cap で待たせる・判じは受付と列が同じ 1 本を読む・差は v-commute-wire の差の上で切った・depends は空で順は便の bead の依存）と、名乗りの行 t-run-cap-on（.vessel.toml の末に run-cap = 1 と run-cap-paths の dir scribe2/ を名乗る・depends は v-one-vessel・器の binary の入れ替えの後に流す）を足し、要件書の要件 FR1068 に句を足した（試作と噛みと床は係 w234a・差の file の形）。 第 0.9 版（2026-10-05）は、判断の記録 ADR-63 の決定 (6)(7) の器の行 v-gate-findings（gate の審査役が PASS を返して contract-fit・teeth-nonvacuous・constitution のどれかを 1 以上と数えた周を、器が判定と数の食い違いとして理由の型 verdict-count-mismatch の FAIL に読み、雛形 lens.txt の出す JSON に場所の列 at と判定の決め方の 1 文を足して at を判定の記録に写し、memo の口が PASS のうち delete を数えた便からも質の memo の案を組む・depends は v-one-vessel・欄 done-teeth を書く）を足し、要件書の要件 FR1009 に句を足した（試作と噛みと床は係 w235a・差の file の形）。 第 0.10 版（2026-10-05）は、判断の記録 ADR-63 の決定 (4) の行 ag-floor-rec（出す物が差の file を名指す係は出力の dir に床の記録 floor.tsv を置き、終える前の門が床の写しで preflight・tz check・tz derive --check・器の表の検査を撃ち直して記録と比べ、記録が無い・行が欠ける・rc が 0 でない・撃ち直しと違う・撃ち直せない時は 1 度目の終わりを止め、判じを floor-gate.tsv に足す・hooks.json の終える前の門のtimeout を 120 に・参照の file の 7 節と 11 節・新しい段の file tests/agflr.rs・差は main c1234912 で切った・depends は空・欄 done-teeth を書く・要件 FR21 に句を足した・試作と噛みと床は係 w236a・差の file の形）を足した。 第 0.11 版（2026-10-05）は、判断の記録 ADR-63 の決定 (2) の続きの行 ag-ref2（規律の手引きの参照の file に頼みの共通の文の残り 7 項を足し、着地済みの段の file tests/agref.rs の句の表に 7 句を足す・差は main c1234912 で切った・depends は空・欄 done-teeth を書く・memo t3-hub.87.28・試作と噛みと床は係 w236a・差の file の形）を足した。 第 0.12 版（2026-10-05）は、判断の記録 ADR-63 の決定 (3) と決定 (9) の予算の口の行 ag-budget-floor（起こしの門が頭の予算が新しい量 15 万より小さい起こしを直した頭の見本を付けて断り、下限の定数を群の係ごとの上限と共有せず歯で下限が上限以下である事を見て、終える前の門が通す終わりに係の新しい量と頭の予算と倍率と対象を係の dir の予算の記録 usage.json に書く・depends は空・欄 done-teeth を書く）を足し、要件書の要件 FR21 に句を足した（試作と噛みと床は係 w238a・差の file の形）。 第 0.13 版（2026-10-05）は、判断の記録 ADR-60 の決定 (4) の着地の側の器の行 v-commute-ledger（差の当たりで通した組の便の後の出来事を出来事の記録の新しい kind OverlapFollowed に