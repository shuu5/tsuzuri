ub.87.21・試作と噛みと床は係 w252a・差の file の形）を足した。 第 0.38 版（2026-10-05）は、待っている行 t-helper-fold-c と t-helper-fold-d に欄 patch（差の file の path・器の行 v-patch-field の任意の欄）を足した（規則の行 pipe.overlap_commute が真になったが、欄 patch を持たない行は置き場だけの項の交わりでも差の当たりを判じられず no-patch で待つ・done と verify と差の file は替えない）。 第 0.39 版（2026-10-05）は、判断の記録 ADR-63 の決定 (8) の (c) の行 t-helper-fold-e（folio の群 teeth1 と境界の package が組む tz1・tz2 に在る helper の字で同じ写し 52 class を群の共通の module common.rs へ寄せ、着地済みの歯 f2ret_folio_tests_named_once を単位の粒で読む形に直す・寄せの行を 6 行に割った 5 本目・差は main 188547a8 で切った・depends は t-helper-fold-a・欄 done-teeth を書く・memo t3-hub.87.21・試作と噛みと床は係 w253a・差の file の形）を足した。 第 0.40 版（2026-10-05）は、判断の記録 ADR-63 の決定 (8) の (c) の行 t-helper-fold-f（境界の package が組む folio の群 tz3・tz4・tz5 に在る helper の字で同じ写し 36 class を群の共通の module common.rs へ寄せる・寄せの行を 6 行に割った 6 本目・差は main 188547a8 に行 t-helper-fold-e の差を当てた木で切った・depends は t-helper-fold-e・欄 done-teeth を書く・memo t3-hub.87.21・試作と噛みと床は係 w253a・差の file の形）を足した。 第 0.41 版（2026-10-05）は、行 t-helper-fold-f の done の 7 番目の項を、歯 f89_ だけを絞って撃つ verify の 10 行目で測る形に直した（絞りなしの 7 行目は filter の語を持たず、器の審査の表の読みが項目の歯の名を番号の形の内に数えないので、便の審査が 2 度 INCONCLUSIVE になった・差の file と write-set は替えない）。

sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      判断の記録 ADR-59（席が起こす係を、拡張の束の係の型 3 本と規律の手引きと係にだけ効く門で機械が持つ・持ち主の裁定 t3-hub.87.1 の甲）と、判断の記録 ADR-61（検証の群の上限と引き金・ADR-59 の決定 (2)(3)(4) への群の例外・持ち主の裁定 t3-hub.87.6 の乙）の行のうち、ノート surface-wave29b の契約表の枠（規則の行 R-32・32 行 以下）に入らない行を置く。

      行は 1 本から 3 本の見込み。行 ag-plugin は型と手引きと門の設定（ADR-59 の決定 (7) の 3 本目の行・ADR-61 の決定 (9)）。後の行は、群の係の測りと係の門と終える前の門（ADR-61 の決定 (4)(7)）のうち surface-wave29b の枠に入らない分（1 本か 2 本）。

      前の行（起こしの門と結び・測り・係の門・終える前の門・群の起こしの門の判じと口）はノート surface-wave29b に在る。depends は同じノートの行だけを書けるので、surface-wave29b の行との順は便の bead の依存で持つ。行ごとの節は、行を足す適用が節の末に足す。1 本の契約表は 32 行まで（規則の行 R-32）。歯の置き方は判断の記録 ADR-32 の決定 (3) のとおりで、新しい歯は段の file で足し、群の main.rs と kfold.rs は畳みの行だけが書く。
