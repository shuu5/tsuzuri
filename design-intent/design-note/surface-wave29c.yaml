    body: |
      在りか。差の file docs/design/patch/v-commute-on.patch（3,578 byte）は、行 v-commute-ledger の試作の木（commit 730bb11c・main f4bbc16f に v-one-vessel の差と v-commute-ledger の差を当てた木）と、その上の試作の commit c3acf6c6（tree c8bfe633・写しは drafts の try-w237a の branch w237a-on2・係 w237a）の差（2 file・+8 −7）。便は差を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。器を書く便は同時に 1 本まで（判断の記録 ADR-33 の決定 (12)・判断の記録 ADR-60 の決定 (10)）。

      依存と順。depends は v-commute-ledger。並べられない訳は code の呼びでなく判断の記録 ADR-60 の決定 (5) の字で、規則の行を真にするのは (4) の記帳が着地した後の器の行と決めた（真の周に通した組の後の着地が記帳に載らないと、撤退の欄の (ア) を数えられない）。差は src/pipe/commute.rs の末の歯と rules/manifest.toml の行 pipe.overlap_commute だけを替え、v-commute-ledger の差の書く頭の段（子の module の宣言）とは hunk が離れている（差は main 単独にも当たる）。

      なぜ。判断の記録 ADR-60 の決定 (5) は、通すかどうかを規則の行 pipe.overlap_commute（真偽・値は裁定 id 付き）1 つが持ち、偽の値で入れ、(4) の記帳が着地した後の器の行で、この記録の裁定の id を引いて真にすると決めた。断る行を緩めるので条 A-2.3 の検証を前置する（条 P-17.4）が、その検証の記録は ADR-60 の grill の欄に添えてある（検証役 qv184・docs/grill/2026-10-05-Q-parallel-exclusion-grill.md）。

      形。scribe2/rules/manifest.toml の行 pipe.overlap_commute の値を false から true にし、ruling の字を user 2026-10-05T05:13Z 問い t3-hub.89.2 から user 2026-10-05T05:13Z 裁定 t3-hub.89.2:20261005T0513Z-1 に替え（ADR-60 の承認の欄の裁定 id・器の rules-diff の門は値を替えて裁定の字を替えない行を断る）、ruled_at は 2026-10-05 のまま。行の上の注 2 行を、真にした経緯と撤退の 1 行の字の注 3 行に替えた。着地した歯 vcapply_verdict_tokens_and_the_rule_row_read_true_only_when_set（src/pipe/commute.rs の歯）の埋め込みの行の断言を、値の真と新しい裁定の字と規則の読みの真に直した（歯の名は替えない）。ほかの歯は直さない（値を真にした木で器の入れ子の歯の全部が通った・下の歯と噛み）。

      効く時。器の埋め込みの規則の表は器の binary に入るので、この行の着地の後に席が器の binary を入れ替えた時から、入口と列が差の当たりの判じを撃つ（席の手）。入れ替えの後は、両方の契約が欄 patch で差の file を名指し、再 gate の面の中だけで交わり、どちらの順でも当たり、同じ名を足さない組が同時に走る。器の dir（scribe2/）の下を書く行は、面の外なので今のまま断られる（行 v-roots の後に広がる）。

      撤退。値を false に戻す 1 行（ruling は撤退の裁定の id に替える）。数えるのは席で、器の記録の kind OverlapCommuted と OverlapFollowed の行と、bead の付記の印 omitted-dep と、着地と審査の記録を読む（ADR-60 の撤退の欄の (ア) から (エ)）。

      done と verify の対応。1 番目の項は verify の 1 行目、2 番目の項は 3 行目（器の lib の着地した歯 1 本を直した）。2 行目の器の clippy は命令の rc で測る守りで、done に載せない。xtask の check は器の共通 verify が gate の各段で撃つので verify に書かない。欄 done-teeth は 1 番目の項を @1、2 番目の項を直した歯の名にした。

      歯と噛み。噛みは試作を commit した後に句ごとに 1 変異（埋め込みの行の値を false に戻す・裁定の字を前の字に戻す・enabled を false にする・読み on の enabled の照らしを外す・値の照らしを外す・行の無い表を真と読む）を当てて歯を撃ち、6 変異が全部 rc 100、変異の無い木の対照は rc 0（表は係 w237a の notes.md）。器の入れ子の歯の全部（cd scribe2 で cargo nextest run --workspace --no-fail-fast）は 4,186 本が全部通った。

      入口の赤。前の行の木（v-commute-ledger の試作の木）には差の hunk が無いので、verify の 1 行目は rc 1 で落ちる（差の前向きの当たりは rc 0）。3 行目の歯は前の木にも在り、偽の値と前の裁定の字を断言して通る（直した断言は差の中に在る）。

