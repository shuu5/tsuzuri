      ほかの crate を名指す字。fold2.py（係 w89a の直し）は crate の tests/ と src/ の .rs と build.rs の中の、歯の file を名指す字を拾い、指さなくなった字だけを書き換える。移す段の file 26 本を名指す字（tests/ の下の名と --test の名）は、契約表とノートと差の file（着地した行の字・判断の記録 ADR-32 の決定 (9) で書き換えない）の外の木に無い（git grep で 0）。照らしの script w/refcheck.py は、この行の前と後の木で許しの外の指さない字が 0（字 311・許した字 17）。

