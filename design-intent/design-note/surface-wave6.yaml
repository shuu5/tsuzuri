    type: prose
    title: 行 f-mark — 配達済みの印の形と中核の読み（undelivered・marked・mark_line・stop_active・block）
    body: |
      なぜ。要件 FR9 は、面の server が裁定を記帳したとき、席が待ちなら器の配達の口で 1 行を送り、席が考え中なら停止の hook が未読を見つけて続けさせ、裁定から 2 分で席の受けが無ければ面に「席に届いていない」と出すとする。器の持ち主の答え（2026-09-27T23:0xZ・計画の設計ノート surface-plan の 6 節・器の判断の記録 ADR-0077 の CTX2 と CSQ-N3・器の要件 FR79）は、消費側（tsuzuri）の停止の hook が未読の裁定を拾って指し示し（裁定の id）を返し、返した後にだけ配達済みの印を置くこと、board の「席に届いていない」は器の配達の口の rc でなくこの印で決めることとする。計画の 4 節の 1 行 f-stop を、席は 3 行に割った（2026-09-28）。この行 f-mark は、印の形と置き場と読み方を決め、印と未配達を読む純粋な関数と停止の hook の入出力の JSON の読み書きを中核の新しい module delivery に置き、後の行の歯が共に読む台帳の見本（fixture）を置く。後の行 f-stop（境界の停止の hook の口 tz hook stop と repo の根の plugin の登録）と後の行 f-mark-serve（server が器の配達の口の rc 0 のときに印を置き、撃つ前に印を読み直す）はこの行に依り、互いに file が重ならない。後の行 f-undelivered も undelivered を材料にする。この行は境界の code を変えず、関数の使い手は歯だけで始まる。
      計画との差（席が計画の 4 節と 5 節を先に直す）。計画の f-stop の file は境界の hook/mod.rs・hook/stop.rs・lib.rs・main.rs・server/ruling.rs だけで、中核の file を持たない。境界の crate は serde と serde_json に直に依存せず（直接依存は契約の型の crate と中核の crate の 2 つだけ・xtask の歯 skeleton_boundary_std_only_and_bin_tz が pin する）、停止の hook の入力の JSON を読めず、答えの JSON を組む部品も持たないので、JSON の読み書きと台帳の字の読みはこの行が中核の純粋な関数に置く。中核の lib.rs は、後の行 f-gate も pub mod gate の 1 行を足すので、並べ方は f-mark の後に f-gate。
      在りか（中核の crate・tsuzuri_core・main a8ec25f で確かめ、b525a13 でも同じ）。lib.rs は doc と pub mod の 7 行（account・graph・ledger・next_step・pipeline・question・seat）で、doc はどの関数も file も子 process も時計も触らないとする。直接依存は serde と serde_json と契約の型の crate で、dev-dependencies は無い（中核の tests の file は直接依存の serde_json を使える・着地済みの tests/question.rs と同じ）。graph の build の module（src/graph/build.rs・pub）は、pub const TYPED_LINES（頭と節点の種類の組の 3 つ・「裁定 id = 」は Ruling・「受け id = 」は Receipt・「方針 id = 」は Policy）と、crate の中だけで見える pub(crate) の fn read_ledger（&str を受けて Option の Vec の BdBead・空白だけの字か JSON の配列として読めない字は None）と pub(crate) の struct BdBead（欄 id の String と、title・status・issue_type・notes の Option の String と labels の Option の Vec の String ほか・知らない欄は読み捨てる）を持つ。導出グラフは notes の行のうち TYPED_LINES の頭で始まる行だけから節点を組み（頭の後から最初の「・」までの字を id にする）、ほかの行は読まない。中核の question の module（src/question.rs）も read_ledger で台帳を読む。この行は build の module を読むだけで変えない。
      在りか（契約の型の crate・tsuzuri_contract・どれも pub）。ledger の module は BeadId（pub fn new・ASCII の英数字と . と - と _ だけの 64 byte 以下の 1 語）・LedgerWrite（閉じた 3 つ・AppendNotes の欄 id の BeadId と line の String・pub fn argv は AppendNotes に字 update と id と --append-notes= に行をつないだ字の 3 つを返す）・pub const QUESTION_LABEL（字 intake:question）を持ち、surface の module は RulingId（pub fn new・英数字と . と - と _ と : だけの 64 byte 以下の 1 語・1 問の裁定の id は問いの id とコロンと分とハイフンと数）を、board の module は Reading（Known と Unknown）を持つ。境界の server の裁定の行（src/server/ruling.rs の pub fn line）は「裁定 id = <id>・問い = <問いの id>・逐語 = <字>」で、束の行は「・束 = <束の id>」を逐語の前に挟み、分の字は pub fn minute（epoch 秒を受けて UTC の年月日と T と時分と Z の 14 字・例 20260927T1034Z）の形。この行は境界を読まない（分の字は呼ぶ側が渡す）。
      停止の hook の入出力（Claude Code の hook の決まり・この repo の外の事実）。Claude Code は、席が応答を終えて止まるときに Stop の hook の command を撃ち、標準入力に JSON の object を 1 つ渡す（鍵 session_id・transcript_path・cwd・hook_event_name（字 Stop）・stop_hook_active（bool）ほか）。stop_hook_active は、その停止が停止の hook の block で続けた後の停止のとき true になる。hook が rc 0 で標準出力に JSON の object（鍵 decision の字 block と鍵 reason の字）を出すと、Claude Code は止まらず、reason を席への指示として続ける。この行はその読み（stop_active）と答えの組み（block）だけを置き、hook の口と rc と登録は行 f-stop が置く。
      形（配達済みの印）。印は、裁定の行の在る問いの bead の notes の末尾に足す 1 行で、字は MARK_PREFIX（「配達 = 」）と裁定の id と「・経路 = 」と経路の語と「・時刻 = 」と印を書く直前の時計の UTC の分（server の minute の形の 14 字）をつなぐ（例「配達 = fx-s.2:20260928T0101Z-1・経路 = 停止・時刻 = 20260928T0110Z」）。経路の語は、server が器の配達の口の rc 0 の後に置く印（行 f-mark-serve）が「配達の口」、停止の hook が答えを出した後に置く印（行 f-stop）が「停止」。裁定が配達済みとは、その裁定の行の在る同じ bead の notes に、行の末尾の復帰の字を除いて行頭が MARK_PREFIX で、頭の後から最初の「・」までの字（前後の空白を除く）がその裁定の id と同じ行が 1 つ以上在ることをいう（経路と時刻は判じに使わず、同じ裁定の印が 2 つ在っても配達済み）。印の頭は TYPED_LINES のどの頭とも、一方が他方の前の方になる重なりが無いので、導出グラフは印の行から節点を組まない。受けの行（「受け id = 」・節点 Receipt）は席が自分の言葉で書く受けの記録（討論の記録 B §8.1 の席の受けの形）で、機械が置く配達の印とは別の物なので、印を受けの行にしない。server の印は閉じる書きの後に足すので、閉じた時点の notes の末尾は裁定の行のまま（受入 AC1 の形）で、印はその後の追記になる。閉じた問いへの notes の追記は bdw で rc 0 で通り、問いは閉じたまま（設計席が実物の台帳で確かめた）。着地の前に server が記帳した裁定には、設計席がこの形の印を手で置き、この節の決まりで数えた実物の台帳の未配達は 0（2026-09-28・読み取りの口で確かめた）。
      置き場の選び（台帳の notes にし、state dir の file にしない）。器の答えは、印を消費側の自分の置き場に置くとした。候補は台帳の問いの notes の 1 行と、state dir の追跡されない file の 2 つで、台帳を選ぶ。(a) 台帳は問い・裁定・方針・受けの正本（設計ノート surface の出所の表）で、裁定の行も同じ bead の notes に在り、印と裁定を 1 つの読み（bd の読み取りの口）で突き合わせられる。(b) 境界の server と後の停止の hook はどちらも台帳を読む部品（server の ledger の Source）と書く部品（LedgerWrite の argv を bdw で撃つ）を既に持ち、bdw は同じ台帳への書きを直列にする。(c) 後の行 f-undelivered は、board が既に読む台帳の同じ読みから届いていない裁定を出せる（undelivered と marked をそのまま使える）。(d) server は repo の file も state dir の file も書かない決まり（設計ノート surface-base の便 e の節）で、着地済みの歯 server_ask_repo_and_state_bytes_unchanged と server_batch_repo_and_state_bytes_unchanged が裁定の受付の後の repo と state dir の byte が変わらないことを見る。state dir の file にすると、この決まりと 2 つの歯を破り、state dir は器の置き場で、board の読みにも新しい file の読みが要る。
      形（新しい module delivery・新しい file の src/delivery.rs・lib.rs に pub mod delivery の 1 行と doc の文・target の cfg で囲まない host の code・file も子 process も時計も触らない）。pub const RULING_PREFIX（字「裁定 id = 」）と pub const MARK_PREFIX（字「配達 = 」）。pub enum Route（Deliver と Stop の 2 つ・Debug・Clone・Copy・PartialEq・Eq）と pub fn word（self を受けて static な &str・Deliver は「配達の口」・Stop は「停止」）。pub struct Pending（pub な欄 question の BeadId と ruling の RulingId・Debug・Clone・PartialEq・Eq）。pub fn mark_line（&RulingId と Route と分の &str を受けて String）は上の印の 1 行を返す。pub fn undelivered（台帳の &str を受けて Reading の Vec の Pending）は、read_ledger が None なら Unknown を返し、読めれば、bead を配列の順に見て、label に QUESTION_LABEL を持ち、状態が tombstone でなく、id が BeadId の形の bead だけを取り（状態が open の問いも取る＝閉じる書きが落ちた裁定の行も届ける）、その notes の行を順に見て、行の末尾の復帰の字を除いて行頭が RULING_PREFIX の行の、頭の後から最初の「・」までの字（前後の空白を除く）が RulingId の形で、同じ bead の notes にその id の印が無く、同じ bead でまだ出していない id なら Pending を 1 つ足し、Known を返す（別の bead の notes の印は数えない）。pub fn marked（台帳の &str と問いの &BeadId と裁定の &RulingId を受けて bool）は、read_ledger で読め、id が問いの id と同じ bead が在り、その notes にその裁定の印が在るときだけ真（読めない字・無い bead は偽）。pub fn stop_active（payload の &str を受けて Option の bool）は、字を serde_json で読み、JSON の object なら鍵 stop_hook_active の値が JSON の true のときだけ true の Some、ほか（鍵が無い・false・字・数）は false の Some、object でない字（空の字・JSON でない字・配列）は None を返す。pub fn block（&[Pending] を受けて Option の String）は、空の slice に None、ほかは鍵 decision（字 block）と鍵 reason の 2 つだけを持つ JSON の object を serde_json で字にした Some を返す。reason は見出しの行と裁定ごとの行を改行 1 つずつでつないだ字（末尾に改行を足さない）で、見出しの行は「席に届いていない持ち主の裁定が 」と件数（10 進の数字）と「 件ある（逐語は台帳の問いの notes の裁定の行）。」をつなぎ、裁定の行は Pending の順に「裁定 」と裁定の id と「 が届いた（問い 」と問いの id と「）」をつなぐ（器の雛形と同じく指し示しだけを返し、逐語は返さない・席の続けを短くする）。
      使い手（後の行）。行 f-stop の hook は undelivered・stop_active・block と、Stop を渡した mark_line を使う。行 f-mark-serve の server は marked と、Deliver を渡した mark_line を使い、RULING_PREFIX が server の ruling の LINE_PREFIX と同じ字であることを歯で見る。行 f-undelivered は undelivered を使う（裁定から 2 分の判じには、裁定の id の分を読む足しが要る）。
      着地済みの歯（直さずに通る）。中核の acctcore_pure_and_no_new_dependencies は中核の src/account の下だけを歩いて std::fs と std::process と SystemTime の字が無いことを見て、中核の直接依存が serde と serde_json と契約の型の crate の 3 つで dev-dependencies が無いことを見る（この行は依存を足さない）。導出グラフの歯は TYPED_LINES と build を呼び、中核の question の歯は question の module を呼び、この行はどちらも変えない。契約の型は変えないので contract_form の snapshot も変わらない。tests/fixtures の下を歩く着地済みの歯は無く（名を指した file だけを読む・grep で確かめた）、新しい dir の stop は当たらない。xtask の check は build と歯の全部と clippy（警告を誤りにする）と面の組み立てを撃ち、JSON の file を検めない。
      測り方。新しい歯は中核の crate の tests/fmark.rs に置き、名を fmark_ で始める。歯は mark_line・undelivered・marked・stop_active・block を型を書いた fn の値に束ね、serde_json で block の字を読む。fixture は CARGO_MANIFEST_DIR の 2 つ上の tests/fixtures/stop の下から読む。done (3) の印を足した字は ledger.json を serde_json で読んで notes の字の末尾に mark_line の行を足してから字に戻して組む。fmark_delivery_is_pure は CARGO_MANIFEST_DIR の下の src/delivery.rs の字を読む。fmark_own_names_clean は自分の file の字を読み、test の属性の次の行の fn の名を全部見る。
      節の字（fixture）。tests/fixtures/stop/ledger.json は bd の出力の形の JSON の配列で、bead 8 本を次の順に持つ（欄は id・title・status・issue_type・labels・notes だけ・notes の行は改行でつなぐ）。(1) fx-s（title 根・status open・issue_type epic・labels と notes は無し）。(2) fx-s.1（title 届いた問い・status closed・issue_type task・labels は intake:question・notes は「裁定 id = fx-s.1:20260928T0100Z-1・問い = fx-s.1・逐語 = はい」と「配達 = fx-s.1:20260928T0100Z-1・経路 = 配達の口・時刻 = 20260928T0100Z」の 2 行）。(3) fx-s.2（title 考え中に答えた問い・closed・task・intake:question・notes は「前置きの 1 行」と「裁定 id = fx-s.2:20260928T0101Z-1・問い = fx-s.2・逐語 = よい」の 2 行）。(4) fx-s.3（title 閉じ損ねた問い・status open・task・intake:question・notes は「裁定 id = fx-s.3:20260928T0102Z-1・問い = fx-s.3・逐語 = 推奨で」の 1 行）。(5) fx-s.4（title 2 度答えた問い・closed・task・intake:question・notes は「裁定 id = fx-s.4:20260928T0103Z-1・問い = fx-s.4・逐語 = 前」と「配達 = fx-s.4:20260928T0103Z-1・経路 = 停止・時刻 = 20260928T0104Z」と「裁定 id = fx-s.4:20260928T0105Z-1・問い = fx-s.4・束 = batch:20260928T0105Z-1・逐語 = 後」の 3 行）。(6) fx-s.5（title 方針・status open・task・labels は intake:memo・notes は「裁定 id = fx-s.5:20260928T0106Z-1・問い = fx-s.5・逐語 = 問いでない」の 1 行）。(7) fx-s.6（title 消した問い・status tombstone・task・intake:question・notes は「裁定 id = fx-s.6:20260928T0107Z-1・問い = fx-s.6・逐語 = 消えた」の 1 行）。(8) fx-s.7（title 手で写した問い・closed・task・intake:question・notes は「裁定 id = user 2026-09-28T01:08Z・逐語 = 手で写した」と「配達 = fx-s.2:20260928T0101Z-1・経路 = 停止・時刻 = 20260928T0109Z」の 2 行）。tests/fixtures/stop/ledger-done.json は同じ形で (1)・(2)・(6) の 3 本だけの配列。上の undelivered の決まりで数えると、ledger.json の Pending は、問い fx-s.2 と裁定 fx-s.2:20260928T0101Z-1・問い fx-s.3 と裁定 fx-s.3:20260928T0102Z-1・問い fx-s.4 と裁定 fx-s.4:20260928T0105Z-1 の 3 つをこの順に持つ列（done の節の 3 つの Pending・fx-s.1 の裁定と fx-s.4 の 1 つ目の裁定は印が在る・fx-s.5 は memo・fx-s.6 は tombstone・fx-s.7 の裁定の行の id は空白を含み RulingId の形でなく、fx-s.7 の印は別の bead の裁定の id で fx-s.2 を配達済みにしない）、ledger-done.json の Pending は 0。block の reason は、見出しの行「席に届いていない持ち主の裁定が 3 件ある（逐語は台帳の問いの notes の裁定の行）。」と、裁定の行「裁定 fx-s.2:20260928T0101Z-1 が届いた（問い fx-s.2）」・「裁定 fx-s.3:20260928T0102Z-1 が届いた（問い fx-s.3）」・「裁定 fx-s.4:20260928T0105Z-1 が届いた（問い fx-s.4）」を、この順に改行でつないだ字。7 つの payload（歯の中の定数）は、P1 が JSON の object（鍵 session_id の字 s-1・transcript_path の字 /tmp/t.jsonl・cwd の字 /tmp・hook_event_name の字 Stop・stop_hook_active の false）、P2 が P1 の stop_hook_active を true にして後ろに改行 1 つを付けた字、P3 が鍵 session_id の字 s-1 だけの object、P4 が鍵 stop_hook_active の値が字 true の object、P5 が空の字、P6 が字 not json、P7 が空の配列の字。行 f-stop と行 f-mark-serve の歯もこの 2 つの fixture を読む。
      filter の語（着地済みの行の verify の語と第 3 波から第 5 波の行の接頭辞と第 4 波の起草の qgate_ と nsum_ と第 6 波の起草の nsumw_ と同じ波の行の接頭辞 fstop_ と fserve_ と第 7 波の行の接頭辞 cadopt_ と tipx_ と hcsess_ と hcproj_ と sesplit_ と mstore_ と athr_ と qblock_・この行の接頭辞 fmark_ は並べない・92 語）。accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・hcard_・qgate_・nsum_・nsumw_・ntime_・ptitle_・ncard_・hsym_・smore_・lcard_・aaround_・hruling_・sxaxis_・plimit_・bport_・fstop_・fserve_・cadopt_・tipx_・hcsess_・hcproj_・sesplit_・mstore_・athr_・qblock_。新しい歯の名から先頭の fmark_ を除いた字は、この語のどれも部分の字として含まない（例 fmark_mark_line_and_prefixes・fmark_marked_same_bead_only・fmark_delivery_is_pure・fmark_own_names_clean）。
      依存は足さない。Cargo.toml と Cargo.lock は触らない。中核は serde_json を既に直接依存に持つ。中核の lib.rs は 1 行と doc の文を足すだけ。大きさは M とする（受付の見積は 1 file あたり S が 100 行・M が 300 行で、新しい src/delivery.rs は doc と 2 つの const と Route と Pending と 5 つの fn で 100 行を越える見込み・300 行の内）。
  - n: 4
    type: prose
    title: 行 f-stop — 席の停止の hook（tz hook stop）と plugin の登録
    body: |
      なぜ。要件 FR9 は、面の server が裁定を記帳したとき、席が待ちなら器の配達の口で 1 行を送り、席が考え中なら停止の hook が未読を見つけて続けさせるとする。今の server は裁定を台帳に書いた後に器の配達の口（scribe2 seat deliver）を 1 回撃つだけで、席が考え中なら器は断り、器は queue も撃ち直しも持たないので、その裁定は席に届かないまま残る。境界の crate に hook の dir はまだ無く、repo の根に plugin の dir も無い（確かめた）。器の持ち主の答え（2026-09-27T23:0xZ・計画の設計ノート surface-plan の 6 節・器の判断の記録 ADR-0077 の CTX2 と CSQ-N3・器の要件 FR79）は、消費側（tsuzuri）の停止の hook が、席が考え中から待ちに移る境で未読の裁定を拾い、指し示し（裁定の id）を返して席を続けさせ、返した後にだけ配達済みの印を置くこととし、器の追加の答えは、hook の入れ先を repo の根の追跡される plugin の dir とした（下の plugin の段）。計画の 4 節の 1 行 f-stop を、席は 3 行に割った（2026-09-28）。印の形と中核の読みは先の行 f-mark が置き、server の印と読み直しは並ぶ行 f-mark-serve が置く。この行は、停止の hook の口 tz hook stop と plugin の dir の登録を足す。傘の行 f（設計ノート surface-base の契約表）の done (2) の後半（考え中の席は停止の hook が続けさせる）にあたり、hook の dir と plugin の dir をこの行が作る（計画の 5 節の並べ方で、同じ file を書く f-gate と f-deliver はこの行の後・問いの起票の門は後の行が同じ hooks.json の PreToolUse に足す）。
      計画との差（席が計画の 4 節と 5 節を先に直す）。計画の f-stop の file は境界の hook/mod.rs・hook/stop.rs・lib.rs・main.rs・server/ruling.rs で、hook の入れ先は器待ちだった。割った後のこの行は server/ruling.rs を書かず（行 f-mark-serve へ）、ほかに境界の新しい歯の file の tests/fstop.rs、中核の新しい歯の file の tests/fstop.rs、repo の根の新しい plugin の dir の 2 つの file を書く。中核の歯の file を置くのは、plugin の JSON を JSON として読む歯が serde_json を要り、境界の crate は serde_json に直に依存しない（直接依存は契約の型の crate と中核の crate の 2 つだけ・xtask の歯 skeleton_boundary_std_only_and_bin_tz が pin する）から。tests/hbconf.rs は書かないが、main.rs の字を読むので、置き場だけの = で write-set に置く。
      在りか（境界の crate の server・main a8ec25f で確かめ、b525a13 でも同じ・どれも pub で target の cfg を持たない host の code）。src/server/ledger.rs は pub const BD（字 bd）・pub const BD_ARGS（--readonly・list・--all・--limit・0・--json の 6 つ）・pub const BD_TIMEOUT（5 秒）と、pub struct Source の pub fn new（repo の Into の PathBuf と bd の Into の OsString を受けて Source）と pub fn text_alone（&self を受けて Option の String・bd を BD_ARGS と cwd の repo と BD_TIMEOUT で新しい子 process で撃ち、起動できない・rc が 0 でない・UTF-8 でない・上限を越える、のどれでも None）を持ち、src/server/proc.rs の pub fn capture（program の &OsStr・引数・cwd の &Path・上限の Duration を受けて Option の Vec の u8・標準入力は空・標準エラーは捨てる・rc 0 で上限の内に返した標準出力だけを Some・子は新しい process group に入れ、上限を越えれば group ごと止める）を再公開する。src/server/ruling.rs は pub const WRITE_TIMEOUT（30 秒の Duration）と pub fn minute（epoch 秒を受けて UTC の年月日と T と時分と Z の 14 字の String・例 20260927T1034Z）を持つ。src/server/events.rs の pub fn now（引数なしで今の UTC の epoch 秒の u64）。契約の型の crate（tsuzuri_contract）の ledger の module は、BeadId・LedgerWrite（AppendNotes の欄 id の BeadId と line の String・pub fn argv は字 update と id と --append-notes= に行をつないだ字の 3 つを返す）・pub const BDW（字 bdw）を持つ。この行は server の file を書かない。
      在りか（中核の crate・行 f-mark が置く module delivery）。pub enum Route（Deliver と Stop）・pub struct Pending（pub な欄 question の BeadId と ruling の RulingId）・pub fn mark_line（&RulingId と Route と分の &str を受けて印の 1 行「配達 = <裁定の id>・経路 = <経路の語>・時刻 = <分>」の String・Stop の経路の語は「停止」）・pub fn undelivered（台帳の &str を受けて Reading の Vec の Pending・台帳の問いの bead の notes の裁定の行のうち同じ bead に印の無いものを配列の順に・読めない字は Unknown）・pub fn stop_active（停止の hook の入力の &str を受けて Option の bool・JSON の object なら鍵 stop_hook_active が JSON の true のときだけ true の Some、ほかの object は false の Some、object でない字は None）・pub fn block（&[Pending] を受けて Option の String・空なら None・ほかは鍵 decision の字 block と鍵 reason の字の 2 つだけの JSON の object の字・reason は件数の見出しの行と裁定ごとの行「裁定 <id> が届いた（問い <問いの id>）」を改行でつなぎ、逐語は持たない）。この行はこれらを呼ぶだけで変えない。
      在りか（境界の crate の入口と repo の根）。lib.rs は doc と pub mod の 4 行（acct・accthb・cli・server）。main.rs の fn main は引数の 2 番目からの字を &str の slice にして match し、腕は、字 surface と serve で始まる slice の残りを fn serve に渡す腕・字 graph で始まる slice の残りを cli の graph の run に渡す腕（行 k-graph）・ほかの全部を fn usage（標準エラーに tz: と理由と surface serve の USAGE を書いて rc 1）に渡す腕の 3 つで、返った u8 を ExitCode にする。Cargo.toml の [[bin]] は名 tz。repo の根は Cargo.toml・Cargo.lock・contracts・crates・design-intent・docs・tests・xtask ほかを持ち、plugin の dir は無い。.gitignore は target の dir を版管理の外に置く。anchor の .git は dir で、器の便の worktree（anchor の下の .worktrees の下）の .git は file（git の worktree の決まり・字 gitdir とコロンと空白と本の repo の git の dir の下の path の 1 行）。
      停止の hook の決まり（Claude Code の hook の決まり・この repo の外の事実）。Claude Code は、席（Claude Code の session）が応答を終えて止まるときに、読み込んだ設定と plugin の Stop の hook の command を shell で撃ち（環境変数の展開が効く）、標準入力に JSON の object を 1 つ渡して閉じる（鍵 session_id・transcript_path・cwd・hook_event_name（字 Stop）・stop_hook_active（bool）ほか）。hook の環境には CLAUDE_PROJECT_DIR（session を起こした根の dir・session が cd や git の worktree に移っても変わらず、session の今の場所は入力の cwd が追う）と、plugin の hook には CLAUDE_PLUGIN_ROOT（plugin の dir）が在る。stop_hook_active は、その停止が停止の hook の block で続けた後の停止のとき true になる。hook が rc 0 で標準出力に JSON の object（鍵 decision の字 block と鍵 reason の字）を出すと、Claude Code は止まらず、reason を席への指示として続ける。rc 0 で標準出力が空なら何もしない。rc 2 は標準エラーの字を理由として停止を止める（続けさせる）。ほかの rc は止めない誤りとして扱われ、JSON は rc 0 のときだけ読まれる。設定の timeout（秒）を越えた hook は止められ、その出力は決めとして読まれない。headless の -p の session でも、Stop の hook は撃たれ、--plugin-dir は効き、rc 0 の block の決めは対話の session と同じく停止を止める。plugin は plugin の dir の .claude-plugin/plugin.json（鍵 name ほか）と hooks/hooks.json（鍵 hooks の下に event の名ごとの配列・要素は matcher と hooks の配列・hooks の要素は type と command と timeout）で宣言し、Claude Code は起動の時に読む。.claude-plugin は Claude Code の守られた path（.git・.claude〔.claude/worktrees を除く〕・.vscode ほか）でないので、runner はどの permission の型でも plugin の 2 つの file を書ける（Claude Code の公式の doc の hooks と permission-modes で確かめた・席）。
      器の plugin の入れ先の決まり（器の main の code で確かめた・器の答え）。scribe2 seat が起こす席の起動の行（器の seat の cycle の launch の derive_launch）は、1 つ目の plugin の dir に登録の anchor（その project の main の checkout）の下の plugin の dir を渡し、その後に器自身の plugin の dir を渡す。器自身の plugin の Stop の hook は席の状態の打刻を Idle にする。器の便の runner もこの plugin を読む（器 24aaa5a の pipe の spawn の copy_plugin と consumer_plugin・席も器の code で確かめた）。便の worktree（anchor の下の .worktrees の下の器の名と便の名の dir・git の worktree で、その .git は dir でなく file）が、器と別名の plugin（plugin の下の .claude-plugin/plugin.json と hooks/hooks.json の両方・plugin.json の name が器の名と違う）を持つとき、器はその 2 つの dir を便の plugin の置き場の下の consumer に写し、headless の runner がそれを --plugin-dir に渡す。審査の session は plugin を読まない。runner の環境は TMUX_PANE を持たない。runner の停止では CLAUDE_PROJECT_DIR は便の worktree で、bd は worktree からも本物の台帳を読むので、見分けが無ければ runner が裁定を返して停止の印を置き、席に届かなくなる（下の worktree の守りで防ぐ）。repo の .claude の settings.json に入れる案は採らない（器の答えは plugin の dir）。器自身の plugin の hooks.json は、program を host の path でなく PATH の名（環境変数 SCRIBE2_BIN が空なら名 scribe2）で撃ち、引数に CLAUDE_PROJECT_DIR と CLAUDE_PLUGIN_ROOT を渡す。
      形（境界・新しい module hook）。新しい file の src/hook/mod.rs は doc と pub mod stop の 1 行。lib.rs に pub mod hook の 1 行と doc の 1 行を足す。子 module stop（新しい file の src/hook/stop.rs・target の cfg で囲まない host の code・引用符で囲んだ /api/ で始まる字を持たない）は次を持つ。pub const USAGE（字 usage: tz hook stop --repo <dir> [--bd <program>] [--bdw <program>]）。pub const MARK_BUDGET（20 秒の Duration・1 回の停止の印の書きの全部の上限）。pub struct Args（pub な欄 repo の PathBuf・bd の OsString・bdw の OsString の 3 つ・Debug・Clone・PartialEq・Eq）。pub fn parse（&[&str] を受けて Result の Args と String）は、--名 値 か --名=値（main.rs の parse と同じ読み）で --repo と --bd と --bdw を読み、--repo が無い・知らない旗・同じ旗が 2 度・値の無い旗・空の値を Err で断り、省いた bd は server の ledger の BD・bdw は契約の ledger の BDW の字にする（host に固有の path の既定は持たない・--repo は省けない）。pub fn mark（&Args と &[Pending] と now の EpochSecs と上限の Duration を受けて usize）は、呼ばれた時の std の time の Instant から上限を数え、Pending を順に、残りの時間が 0 なら bdw を撃たず、そうでなければ問いの id の notes に mark_line（その裁定・Stop・ruling の minute に now を渡した分）を足す AppendNotes の argv で、bdw を cwd の repo と、残りの時間と WRITE_TIMEOUT の短い方の上限で capture で撃ち、Some で返した数を返す。落ちた裁定と撃たなかった裁定は、その裁定の id を含む 1 行ずつを標準エラーに書き、次へ進む。pub fn run（&[&str] を受けて u8）は次の順。(a) parse が Err か、repo が dir でなければ、標準エラーに字 tz hook stop: と理由の 1 行と USAGE を書いて 1 を返す（標準入力は読まない）。(b) repo の下の .git が file なら（std の path の is_file・git の worktree の形）、標準入力も台帳も読まず、標準出力にも標準エラーにも何も書かずに 0 を返す（bd も bdw も撃たない・下の worktree の守り）。.git が dir か、無いときは次へ進む。(c) 標準入力を終わりまで読み（読めなければ空の字）、stop_active が false の Some でなければ（true の Some と None）何も出さずに 0 を返す（bd も bdw も撃たない）。(d) ledger の Source の new（repo と bd）の text_alone で台帳を読み、None か、undelivered が Unknown なら、標準エラーに字 tz hook stop: で始まり台帳が読めない旨の 1 行を書いて 0 を返し、Known の空の列なら何も出さずに 0 を返す。(e) block の字と改行 1 つを標準出力に書いて flush し、書けなければ標準エラーに 1 行を書いて印を置かずに 0 を返す。(f) mark に events の now と MARK_BUDGET を渡して印を置き、0 を返す。どの形でも 2 は返さない（Claude Code は停止の hook の rc 2 を続けの指示として読むので、読めない入力や台帳で 2 を返すと席が止まれなくなる）。印は答えを標準出力に書いて flush した後にだけ置く（器の答えの順）。ふつうの道では標準エラーに何も書かない。hook は repo と state dir に file を書かない（台帳の書きは bdw だけ）。main.rs は fn main の match に、字 hook と stop で始まる slice の残りを hook の stop の run に渡し、返った u8 をそのまま rc にする腕を 1 つ、ほかの全部を fn usage に渡す腕より前に足し、先頭の doc に tz hook stop の形の 1 行を足す（parse・serve・usage・USAGE・FAIL と、surface serve と graph の腕は変えない）。
      形（plugin の登録・器の答えの案 c）。repo の根に plugin の dir を置き（版管理に載せる）、新しい file の plugin/.claude-plugin/plugin.json は鍵 name（字 tsuzuri）・version（字 0.1.0）・description（この plugin が席の停止の hook を持つ旨の字）の 3 つの object、新しい file の plugin/hooks/hooks.json は鍵 hooks の下に鍵 Stop だけを持ち、Stop の値は要素 1 つの配列で、その要素は鍵 hooks だけ（matcher を持たない）、その hooks は要素 1 つの配列で、その要素は type（字 command）・command（下の字）・timeout（数 30）の 3 つの鍵の object。name は、判断の記録 ADR-6 の決定 (1) と (2)（plugin の名は器の名から導き、名は 1 つの build 時の定数で持つ）に従う。器の名を持つ定数は契約の型の crate にも中核の crate にもまだ無い（面の crate の frame の BRAND は画面の題の既定の字で、中核から見えない）ので、歯は中核の crate の package の名（build 時の値の CARGO_PKG_NAME・workspace の crate の名は器の名と役の名をハイフンでつなぐ）から末尾の -core を除いた字と比べ、名の字を歯に写さない（器の名の定数を置く行は計画に別に置き、できたらその定数と比べるように直す）。command の字は、二重引用符・$CLAUDE_PROJECT_DIR・二重引用符・/target/debug/tz・空白・hook・空白・stop・空白・--repo・空白・二重引用符・$CLAUDE_PROJECT_DIR・二重引用符をこの順に隙間なくつないだ字（shell が CLAUDE_PROJECT_DIR を展開し、anchor の debug の組みの tz を撃ち、--repo に anchor を渡す・--bd と --bdw は省いて PATH の bd と bdw を使う）。選びの理由。(1) この host の PATH に tz は無い（command -v tz が見つけない・確かめた）ので、PATH の名 tz は撃てない。(2) 設計席の server の組み直しの道具（repo の外）は anchor で cargo build -p tsuzuri-boundary を撃ち、anchor の target/debug/tz を着地のたびに組む（確かめた）。(3) scribe2 seat が起こす席の project の dir は登録の anchor で、CLAUDE_PROJECT_DIR は host の path を file に書かずに anchor を指す（規則の行 D-4 の、版管理に載せる file に host の path を書かない決まりを守る）。CLAUDE_PLUGIN_ROOT の親の dir も anchor だが、Claude Code が plugin の dir をどこから読むかに依るので、session の決まった値の CLAUDE_PROJECT_DIR を使う。(4) bd と bdw は、席の環境の PATH の利用者の local の bin に在る（この席の Bash の環境で確かめた・bdw はその host の正本の直列化の wrapper を撃つ薄い shim で、正本が無ければ書かずに落ちる）ので、hook は既定の名 bd と bdw を使い、器自身の plugin と同じく PATH の名で撃つ。(5) 環境変数で替える口（器自身の hooks.json の、環境変数 SCRIBE2_BIN が空なら PATH の名 scribe2 を撃つ形）は付けない（席も了承した）。今は使い手が無く（歯は tz を CARGO_BIN_EXE_tz の path で直に撃ち、席は anchor の組みを使う）、既定で空の環境変数は版管理の外の host ごとの設定を 1 つ増やし（規則 N-3 の、host に固有の値で振る舞いを分けない向きに反する）、字 TZ で始まる名は標準の時間帯の環境変数 TZ と紛れる。要るようになれば hooks.json の command と歯の語の列の 2 か所で足せる。timeout の 30 は下の時間の上限（MARK_BUDGET と BD_TIMEOUT の和・約 25 秒）より長い（歯は timeout が 30 以上であることと、和が 30 秒より短いことを見る）。plugin は席の起動の時に読まれるので、hook が効くのは着地の後に席が起こし直されてからで、その時までに anchor の target/debug/tz が組み直されている必要がある。anchor に tz が無ければ shell が rc 127 で終わり、古い tz は hook stop を知らず使い方を出して rc 1 で終わる（どちらも最小の環境で command を撃って確かめた）。どちらも rc 2 でないので、Claude Code は止めない誤りとして扱い、席はふつうに止まり、印は置かれない。問いの起票の門は、後の行（計画の 4 節の f-gate-install の列）が同じ hooks.json に PreToolUse の段を足す（この行の歯は Stop の段と top の鍵だけを見るので、ほかの event の段の足しを止めない）。
      続けと打刻（器の見立て・測っていない）。器自身の Stop の hook は席の打刻を Idle にするので、この hook が block して席が続けている間、打刻は待ちを示し、器の配達の口が続けている席の入力欄に 1 行を打ちうる。この行は続けを短くする（reason は裁定の id の指し示しだけで逐語を持たない）。並ぶ行 f-mark-serve は、server が器の配達の口を撃つ前に台帳を読み直し、この hook が既に返して印を置いた裁定を撃たない。続けの間に届いた新しい裁定は、器の配達の口が打ちうる（打刻の直しは器の側の事）。
      worktree の守り。hook は --repo の下の .git が file のとき（git の worktree）、何もしない。anchor（登録の置き場・main の checkout）の .git は dir なので、席の hook はふつうに働き、器の便の runner（便の worktree で起きる）と、人が worktree で起こした session は黙る。hook の command は --repo に CLAUDE_PROJECT_DIR を渡し、これは session の起動の dir（scribe2 seat の席では登録の anchor）で、session の途中で変わらないので、席が作業の途中で worktree の中の file を編集しても、席の hook の --repo は anchor のままで、席は裁定を受け続ける。見分けを TMUX_PANE（runner の環境に無い）でなく置き場の形にするのは、hook の引数と環境を増やさず、repo の dir だけで決まり、歯が作業場で組めるから。.git が無い dir（歯の作業場の空の repo）は worktree と見ない。
      輪の守り（stop_hook_active）。停止の hook の block で続けた後の停止（stop_hook_active が true）では、hook は台帳も読まずに何も出さない。これで、印の書きが落ち続ける場（bdw が止まっている）でも、同じ裁定を返して続けさせるのは、ふつうの停止 1 回につき 1 度までで終わる（印の有無だけで輪を止める形は、印が書けないと止まらない）。代わりに、hook の block で続けている間に届き、器の配達の口も受けなかった裁定は、その続けの後の停止では返さず、次のふつうの停止（stop_hook_active が false）で返す（その間は、後の行 f-undelivered が面に届いていないと出し、後の行 f-deliver が次の tool の呼びでも拾う計画）。JSON の object でない入力も何も出さない側に倒す。印は答えを出した後に置くので、答えを出して印の書きが落ちた裁定は次のふつうの停止でもう一度返る（少なくとも 1 度は届き、2 度届くことはある）。server と hook が同じ裁定に 2 つの印を置いても配達済みの判じは変わらない（行 f-mark の決まり）。
      時間の上限。hook の最悪の待ちは、台帳の読みの BD_TIMEOUT（5 秒）と印の書きの MARK_BUDGET（20 秒）で約 25 秒。Claude Code は timeout を越えた hook の出力を読まないので、印を書いている途中で止められると、答えが席に渡らないまま印だけが残りうる。MARK_BUDGET はこれを防ぐ上限で、上限に達したら残りの裁定に印を置かず（次のふつうの停止でもう一度返る）、hook を上限の内に終える。hooks.json の timeout は 30 秒。
      範囲の外。server の印と撃つ前の読み直しと log の字（並ぶ行 f-mark-serve）。board の「席に届いていない」（行 f-undelivered）。逐語の注入（行 f-deliver）。問いの起票の門と、その登録（後の行 f-gate-install が同じ hooks.json の PreToolUse に足す・門の hook も器の便の runner に載り、runner での振る舞いは行 f-gate が決める）。器の配達の口の撃ち直し（器の答え・再送は要らない）。器の打刻の直し（器の側）。器の名の定数（ADR-6・計画に別の行）。同じ anchor に scribe2 seat の席が 2 つ以上在る形（plugin はその anchor の席の全部が読むので、裁定を受けない席も裁定を返して印を置き、受ける席に届かない。そのときは hook に server の席の target との見分けを足す）。着地の前に server が記帳した裁定には設計席が印を手で置いた（行 f-mark の節）ので、着地の後の最初の停止でまとめて返るものは無い。着地から server と席の起こし直しまでに記帳された印の無い裁定は、席が plugin を読んだ後の最初のふつうの停止で 1 度だけ返り、印が置かれる。
      着地済みの歯（直さずに通る・workspace を grep で確かめた）。tests/hbconf.rs の hbconf_main_parse_fills_the_rest_with_new は main.rs の字に Config::new が在り、字「Config {」の数と字「..Config::new」の数が等しいことを見て、足す腕と doc の行はどちらの字も持たない。tests/brand.rs の brand_path_written_once_in_contract は 3 つの crate の src の下の全部の rs の file を歩き、引用符で囲んだ /api/project が契約の src/project.rs に 1 つだけ在ることを見て、この行の新しい file は引用符で囲んだ /api/ で始まる字を持たない。tests/hbroute.rs は src/server/routes を、tests/hbpost.rs と tests/hbproc.rs は src/server の mod.rs・ledger.rs・proc.rs・clock.rs を読み、この行はどれも書かない。tests/kcli.rs は tz graph を撃ち、tests/server_min.rs・server_read.rs・server_src.rs・server_ask.rs の tz の binary の歯は最初の引数が surface で、足す腕は最初の字が hook のときだけ当たる。xtask の skeleton_ の歯は Cargo.toml と Cargo.lock を読み、この行は触らない。xtask の check は build と歯の全部と clippy（警告を誤りにする）と面の組み立てだけを撃ち、JSON の file を検めない（plugin の 2 つの file は新しい中核の歯だけが読む）。repo の根や plugin の dir を歩く着地済みの歯は無く（read_dir を持つ歯は作業場か各 crate の src の下だけを歩く）、tsuzuri の xtask に名の字を数える検めは無い。
      測り方。新しい歯は中核の crate の tests/fstop.rs（plugin の 2 つの file・serde_json で JSON を読む）と境界の crate の tests/fstop.rs（parse と tz の binary と mark）に置き、名を fstop_ で始める。中核の歯は CARGO_MANIFEST_DIR の 2 つ上の plugin の下の 2 つの file を読み、plugin の name と比べる字は env の macro の CARGO_PKG_NAME から組む。境界の歯は境界の crate の直接依存の tsuzuri_contract と tsuzuri_core を直に使い（着地済みの server_ask.rs と同じ）、答えの字は中核の block で、印の argv は中核の mark_line と契約の AppendNotes の argv で組んで比べ、parse・mark・run を型を書いた fn の値に束ねる。fixture は CARGO_MANIFEST_DIR の 2 つ上の tests/fixtures/stop の下（行 f-mark が置く）から読む。境界の作業場は CARGO_TARGET_TMPDIR の下の fstop と歯の名の dir で、根の下に repo の dir（空）と記録の置き場と字の file の out.json（既定は ledger.json の写し）と偽の program を置く。偽の bd は、受けた引数を空白でつないだ 1 行を記録の置き場の file に足してから out.json を exec cat で出す sh の script（out.json が無ければ rc 1）、偽の bdw は着地済みの server_ask.rs の recorder と同じ形（撃たれた回ごとの argv と pwd -P の cwd を書き、fail の回だけ rc 1）で、done (4) の偽の bdw は記録の前に sleep 2 を撃つ（3 回で 6 秒・MARK_BUDGET の内）。どれも std の os の unix の権限 0o755 で、repo の dir の外に置く。tz は env の macro の CARGO_BIN_EXE_tz の path を std の process の Command で撃ち、標準入力を pipe にして payload を書いて閉じる（使い方の誤りと worktree の場では hook が標準入力を読まずに終わるので、どの歯も書きの誤りを捨てる）。どの歯も、環境変数 PATH の頭に作業場の根（偽の bd と偽の bdw の在る dir・名は bd と bdw）を足して tz を撃つ（--bd や --bdw を渡さない撃ち方でも既定の名 bd と bdw が偽の program に解け、旗を読み捨てて進む誤った実装が本物の台帳を読み書きしない・done (9) の偽の bd と偽の bdw を撃たないの見方が見える形になる・偽の program の script が使う cat と sleep は元の PATH の後ろで解ける）。done (4) は標準出力の pipe から最初の行を読み終えた時点で記録を数え、終わりを待ってからもう一度数える。done (10) は作業場の下に repo と別の dir を作り、中に .git の file（字 gitdir とコロンと空白と作業場の下の別の dir の path の 1 行）を書いて --repo に渡し、同じ場で .git の file を消して同じ名の dir を作ってからもう一度撃つ。分は撃つ前と後の時計を server の ruling の minute に渡した 2 つの字のどちらかと見る。repo の byte は撃つ前と後の file の path と字の一覧で比べる（着地済みの server_ask.rs の fn tree と同じ形）。
      節の字（行 f-mark の fixture と歯の定数）。tests/fixtures/stop/ledger.json（行 f-mark が置く・bd の出力の形の JSON の配列・bead 8 本）を中核の undelivered で数えた Pending は、問い fx-s.2 と裁定 fx-s.2:20260928T0101Z-1・問い fx-s.3 と裁定 fx-s.3:20260928T0102Z-1・問い fx-s.4 と裁定 fx-s.4:20260928T0105Z-1 の 3 つをこの順に持つ列（done の節の 3 つの Pending・fx-s.1 の裁定 fx-s.1:20260928T0100Z-1 と fx-s.4 の 1 つ目の裁定は印が在る・ほかは問いでない・tombstone・形でない id の行）。tests/fixtures/stop/ledger-done.json の Pending は 0。block に 3 つの Pending を渡した字の reason は、見出しの行「席に届いていない持ち主の裁定が 3 件ある（逐語は台帳の問いの notes の裁定の行）。」と、裁定の行「裁定 fx-s.2:20260928T0101Z-1 が届いた（問い fx-s.2）」・「裁定 fx-s.3:20260928T0102Z-1 が届いた（問い fx-s.3）」・「裁定 fx-s.4:20260928T0105Z-1 が届いた（問い fx-s.4）」を、この順に改行でつないだ字。7 つの payload（境界の歯の中の定数・行 f-mark の歯と同じ字）は、P1 が JSON の object（鍵 session_id の字 s-1・transcript_path の字 /tmp/t.jsonl・cwd の字 /tmp・hook_event_name の字 Stop・stop_hook_active の false）、P2 が P1 の stop_hook_active を true にして後ろに改行 1 つを付けた字、P3 が鍵 session_id の字 s-1 だけの object、P4 が鍵 stop_hook_active の値が字 true の object、P5 が空の字、P6 が字 not json、P7 が空の配列の字（この行の歯は P1・P2・P5・P6・P7 を使う）。
      filter の語（着地済みの行の verify の語と第 3 波から第 5 波の行の接頭辞と第 4 波の起草の qgate_ と nsum_ と第 6 波の起草の nsumw_ と同じ波の行の接頭辞 fmark_ と fserve_ と第 7 波の行の接頭辞 cadopt_ と tipx_ と hcsess_ と hcproj_ と sesplit_ と mstore_ と athr_ と qblock_・この行の接頭辞 fstop_ は並べない・92 語）。accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・hcard_・qgate_・nsum_・nsumw_・ntime_・ptitle_・ncard_・hsym_・smore_・lcard_・aaround_・hruling_・sxaxis_・plimit_・bport_・fmark_・fserve_・cadopt_・tipx_・hcsess_・hcproj_・sesplit_・mstore_・athr_・qblock_。新しい歯の名から先頭の fstop_ を除いた字は、この語のどれも部分の字として含まない（例 fstop_plugin_stop_entry・fstop_blocks_then_marks・fstop_budget_bounds_marks・fstop_own_names_clean）。
      依存は足さない。Cargo.toml と Cargo.lock は触らない。境界は std と workspace の 2 つの crate だけで書き、中核の歯は中核の直接依存の serde_json を使う。src の直す file（main.rs・境界の lib.rs）はどちらも受付の上限から遠く、新しい file も小さい。
  - n: 5
    type: prose
    title: 行 f-mark-serve — server の配達の印と撃つ前の読み直し
    body: |
      なぜ。要件 FR9 は、面の server が裁定を記帳したとき、席が待ちなら器の配達の口で 1 行を送り、席が考え中なら停止の hook が未読を見つけて続けさせ、裁定から 2 分で席の受けが無ければ面に「席に届いていない」と出すとする。今の server（境界の crate の src/server/ruling.rs と src/server/batch.rs）は、裁定を台帳に書いた後に器の配達の口（scribe2 seat deliver）を撃つだけで、器が受けたかを台帳に残さず、器の断りを serve の log に「配達が落ちた」と失敗の字で書く。束の受付は行ごとに器の配達の口を続けて撃つが、器は 1 回に 1 つの id だけを受け、1 つ目の打ち込みを席が扱っている間の 2 回目を断るので、束の 2 行目からは届かない（実際に起きた・下の器の決まり）。器の持ち主の答え（2026-09-27T23:0xZ・計画の設計ノート surface-plan の 6 節・器の判断の記録 ADR-0077 の CTX2 と CSQ-N3・器の要件 FR79）は、board の「席に届いていない」は器の配達の口の rc でなく配達済みの印で決めること、busy の断りは失敗でなくふつうの断りであることとする。計画の 4 節の 1 行 f-stop を、席は 3 行に割った（2026-09-28）。印の形と中核の読みは先の行 f-mark が置き、停止の hook と plugin の登録は並ぶ行 f-stop が置く。この行は、server が器の配達の口を受付ごとに 1 度だけ撃ち（1 問は裁定の id・束は束の id）、rc 0 のときにその受付の全部の裁定に経路が配達の口の印を置き、受けないときは印を置かず log の字をふつうの断りの字にし、撃つ前に台帳を読み直して停止の hook が既に返した裁定だけの受付を撃たないようにする。
      計画との差（席が計画の 4 節と 5 節を先に直す）。計画の f-stop の file のうち server/ruling.rs をこの行が書き、ほかに境界の src/server/batch.rs、着地済みの歯の file の tests/server_ask.rs と tests/server_batch.rs、新しい歯の file の tests/fserve.rs を書く。理由。(i) 束の受付も行ごとに器の配達の口を撃つので、束の側にも印を置かないと、器が受けた束の裁定を停止の hook がもう一度返し、後の行 f-undelivered が届いた裁定を届いていないと出す。(ii) 着地済みの server の歯が偽の bdw の回数と argv を pin していて、印の書きで期待が変わる（下の着地済みの歯）。計画の 5 節の並べ方の boundary/server/ruling.rs は f-mark-serve の後に e-revoke と e-approval-event。
      在りか（境界の crate の server・main a8ec25f で確かめ、b525a13 でも同じ・どれも pub で target の cfg を持たない host の code）。src/server/ruling.rs（tsuzuri_boundary の server の ruling）は、pub const LINE_PREFIX（字「裁定 id = 」）・pub const WRITE_TIMEOUT（30 秒の Duration）・pub const DELIVER_TIMEOUT（10 秒の Duration）・pub struct Delivery（pub な欄 program の OsString・state_dir の PathBuf・target の String・derive に Clone を持つ）・pub struct Writer（pub な欄 repo の PathBuf・bdw の OsString・delivery の Option の Delivery）・pub fn accept（&RulingRequest と ledger の &Source と &Writer と受付の時刻の EpochSecs を受けて Outcome を返す）・pub fn deliver_argv（&Delivery と &RulingId を受けて Vec の OsString・字 seat・deliver・--state-dir・state dir・--target・target・--ruling・裁定の id の 8 つ）・pub fn next_id・pub fn line（裁定の定型行「裁定 id = <id>・問い = <問いの id>・逐語 = <字>」を返す）・pub fn escape・pub fn minute（EpochSecs を受けて UTC の年月日と T と時分と Z の 14 字の String・例 20260927T1034Z）を持ち、非公開の fn write（&Writer と &LedgerWrite を受けて bool・bdw を LedgerWrite の argv と cwd の repo と WRITE_TIMEOUT で capture で撃ち、Some なら true）と非公開の fn deliver（&Delivery と repo の &Path と &RulingId を受けて bool・器の CLI を deliver_argv と DELIVER_TIMEOUT で capture で撃つ）を持つ。accept は台帳を ledger の text_alone で読み直して open の問いを確かめ、notes への追記（契約の LedgerWrite の AppendNotes）と閉じる書き（CloseItem）を順に撃ち、2 つとも通った後に writer の delivery が Some なら非公開の deliver を撃ち、false なら標準エラーに「tz surface serve: 配達が落ちた: 裁定 <id> を席 <target> へ届けられない」の 1 行を書き、応答（200 と RulingResponse）は変えない。この file の中の歯（server_ask_minute_is_utc・server_ask_escape_one_line・server_ask_next_id_skips_taken・server_ask_line_prefix_is_graph_ruling）は minute・escape・line・next_id・LINE_PREFIX を呼ぶ。src/server/batch.rs（tsuzuri_boundary の server の batch）の pub fn accept（&BatchRequest と ledger の &Source と &Writer と EpochSecs）は、全部の行の追記と閉じる書きを行の順に終えた後に、delivery が Some なら行の順に器の配達の口を capture と deliver_argv と DELIVER_TIMEOUT で撃ち、落ちた行ごとに「tz surface serve: 配達が落ちた: 裁定 <id>（束 <束の id>）を席 <target> へ届けられない」の 1 行を標準エラーに書く。batch.rs は ruling から DELIVER_TIMEOUT・LINE_PREFIX・WRITE_TIMEOUT・Writer・deliver_argv・escape・minute・next_id を、ledger から Source と capture を use し、自分の非公開の fn write を持つ。server の起動（src/server/mod.rs の Server の bind が呼ぶ bind_with）は、Config の seat と state_dir の両方が Some のときだけ Delivery（program は Config の scribe2）を Some にした Writer を組む。口の file（src/server/routes/ruling.rs と batch.rs）は accept に shared の sources の ledger と writer と events の now を渡して Outcome を応答にし、この行は書かない。
      在りか（台帳の読みと子 process と時計と契約の型と中核・どれも pub）。src/server/ledger.rs は pub const BD_TIMEOUT（5 秒）と、pub struct Source の pub fn new（repo と bd を受けて Source）と pub fn text_alone（&self を受けて Option の String・bd を読み取りの引数と cwd の repo と BD_TIMEOUT で新しい子 process で撃ち、起動できない・rc が 0 でない・UTF-8 でない・上限を越える、のどれでも None）を持ち、src/server/proc.rs の pub fn capture（program・引数・cwd・上限を受けて Option の Vec の u8・標準エラーは捨てる・rc 0 で上限の内に返した標準出力だけを Some）を再公開する。src/server/events.rs の pub fn now（今の UTC の epoch 秒の u64）。契約の型の crate の ledger の module は BeadId と LedgerWrite（AppendNotes の欄 id と line・pub fn argv は字 update と id と --append-notes= に行をつないだ字の 3 つ）を、surface の module は RulingId を持つ。中核の crate の module delivery（行 f-mark が置く）は、pub const RULING_PREFIX（字「裁定 id = 」）・pub enum Route（Deliver の経路の語は「配達の口」）・pub fn mark_line（&RulingId と Route と分の &str を受けて印の 1 行「配達 = <裁定の id>・経路 = <経路の語>・時刻 = <分>」）・pub struct Pending（pub な欄 question の BeadId と ruling の RulingId）・pub fn marked（台帳の &str と問いの &BeadId と裁定の &RulingId を受けて bool・同じ bead の notes にその裁定の印が在るときだけ真・読めない字と無い bead は偽）を持ち、この行はそれらを呼ぶだけで変えない。
      器の配達の口の決まり（器の main の code で確かめた・器の id の決まりは器の持ち主が器の code で確かめた）。scribe2 seat deliver --state-dir <dir> --target <target> --ruling <id> は、登録の行が在り、状態の打刻の最終行が Idle で、入力欄が空の席にだけ、器が持つ雛形の 1 行（裁定 <id> が届いた）を 1 回送り、rc 0 で標準出力に delivered と target と ruling と consumed の 1 行を出す。--ruling の値は 1 回に 1 つの id で、空白の無い 1 語・64 byte 以下・ASCII の英字と数字と . と - と _ と : だけの字（並べた id も 2 度の旗も断る）。束の id（batch と分と数をコロンとハイフンでつないだ字・RulingId の形）はこの決まりを通る。条件の外は 1 key も送らずに断り、rc 1 で標準エラーに refused か unconfirmed と理由の語（閉じた 13 語・考え中は busy・入力欄が空でないのは input-busy ほか）の 1 行を出し、器の event log が読めなければ rc 2。1 つ目の打ち込みを席が扱っている間に撃った 2 回目は busy か input-busy で断られる（持ち主が 2 問を 1 つの束で答えた受付で、1 行目の裁定は届き、2 行目の裁定は断られて今の log の「配達が落ちた」になった）。server の capture は標準エラーを捨てるので、server は理由の語を見分けず、rc 0 でない全部と上限越えを「受けない」の 1 つとして扱う（どれも印を置かず、停止の hook が拾う）。
      形（server の印と読み直しと log の字）。ruling.rs に pub const NOT_TAKEN（字「配達の口が今は受けない（印を置かず、席の停止の hook が拾う）」）と pub fn deliver（&Delivery と &Writer と ledger の &Source と器に渡す id の &RulingId と中核の delivery の &[Pending] を受けて何も返さない）を置き、非公開の fn deliver（bool を返す今の形）をこれに替える。器に渡す id は、1 問の受付では発行した裁定の id、束の受付では発行した束の id で、Pending の列は印を置く裁定の組（1 問は 1 つ・束は行の順に行ごとに 1 つ）。deliver は、(a) まず ledger の text_alone で台帳を読み直し、読めて、列のどの Pending にも中核の marked が真なら、器の配達の口も bdw も撃たずに終わる（停止の hook が既に返した裁定を、続けている席の入力欄へ重ねて打たない）。1 つでも偽なら撃つ。読めなければ撃つ側に倒す（今までと同じ）。(b) 器の CLI（Delivery の program）を deliver_argv に器に渡す id を渡した引数と cwd の writer の repo と DELIVER_TIMEOUT で capture で 1 回だけ撃ち、None なら印を 1 つも置かず、標準エラーに「tz surface serve: 」と NOT_TAKEN と「: 」と器に渡す id と「・席 」と target をつないだ 1 行を 1 度だけ書く（束でも行ごとに書かない）。(c) Some（rc 0）なら、events の now を ruling の minute に渡した分で、列の順に、その Pending の問いの id の notes にその裁定の mark_line（Deliver）を足す AppendNotes を非公開の write で撃ち（既に印の在る裁定にも置く・同じ裁定の印が 2 つ在っても配達済みの判じは変わらない）、落ちたものごとに標準エラーに字 tz surface serve: で始まりその裁定の id を含む 1 行を書く（印の無い裁定は停止の hook が次の停止で返す）。accept は delivery が Some のとき、今の非公開の deliver と標準エラーの行の組の代わりに、この deliver に ledger と発行した裁定の id とその Pending 1 つを渡す。batch の accept は、全部の行の書きの後に、delivery が Some なら ruling の deliver に ledger と発行した束の id と行の順の Pending の列を 1 度だけ渡し、今の行ごとの capture と標準エラーの行の組を消す（使わなくなった import も消す・xtask の check の clippy は警告を誤りにする）。書きが落ちた束（502）は今と同じく配達しない。束で席に届く器の雛形の 1 行は「裁定 <束の id> が届いた」になり、席は台帳の裁定の行の「・束 = <束の id>・」で束の裁定を見つける。読み直しは受付ごとに bd を 1 本足す（上限 5 秒）。束の印は全部の行の書きの後に行の順に置くので、偽の bdw の記録の順は、行ごとの追記と閉じる書きの全部の後に行の順の印になる。2 つの module の doc の受付の順の最後の段は、この形に合わせて直す。字「配達が落ちた」は境界の src から消える。応答（状態の code と電文）は配達と印の結果で変えない。server は repo の file も state dir の file も書かない決まりのまま（印は台帳の書き・行 f-mark の置き場の選び）。
