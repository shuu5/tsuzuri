sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      持ち主が board で答えた裁定を、席が考え中でも取りこぼさず席に渡す。中核に配達済みの印の形と判じを置き（f-mark）、席の停止の hook が印の無い裁定を返して印を置き（f-stop・repo の根の plugin/ に登録）、server は器の配達の口が受けたときだけ印を置き、束は束の id で 1 度だけ送る（f-mark-serve）。
      あわせて、folio の索引の要約（folio graph --print --summary）を電文の節点に写す中核の関数と欄を置き（c-summary-design）、server と tz graph が要約を読んで渡す（c-summary-wire）。
      外の依存は足さない。どの行も計画 surface-plan の 4 節の行と同じ file と依存を持つ。
