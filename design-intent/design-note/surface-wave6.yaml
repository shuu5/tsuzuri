    title: 行 c-summary-design — 節点の行の位置と 2 つの概要を電文に持たせ、folio の要約の字から写す
    body: |
      なぜ。要件 FR15 は、節点ごとの概要（非エンジニア向けとエンジニア向け）を設計文書の plain の欄と台帳の要約の欄に置き、面は写すだけで生成しないとする（判断の記録 ADR-7 も同じ）。見本 mock v3（repo の写しは docs/design/mock3）は、地図の一覧の行に概要の 1 行を、節点の頁に出所の file と行と 2 つの概要の箱を、hover の card に概要と file と行を出す（ui.js の fn summaryOf が節点の plain と eng と src を返し、fn srcText が file と行をコロンでつなぎ、行が無ければ「行は測れていない」と出す）。本番の口 /api/graph の節点は id と種類と file と要約値と題だけで、行と概要を持たない。
      席の決め（計画の設計ノート surface-plan の 3 節）は、tsuzuri の側に設計文書の YAML の走査を置かない（正本の 2 つ目の読み手になり、条 P-2 に反し、folio を取り込むときに消す負債になる）。folio2 は自分の要件書の第 1.52 版（その FR14・tsuzuri の srs の FR14 とは別の文書の要件）で索引の口に --summary を足し、席の手元の folio の binary 0fb780e はそれを持つ。この行は、電文の節点に行の位置と 2 つの概要の欄を足し、folio の要約の字を読んで節点に写す中核の純粋な関数を置く。設計文書の字は読まない。
      この行が持たないもの。server と tz graph が folio を --summary つきでも撃ち、その字を中核の関数に渡す配線は後の行 c-summary-wire が持つ。この行の着地から c-summary-wire の着地まで、本番の口 /api/graph と /api/graph/view と /api/around と tz graph の電文の節点の line と plain と eng は全部 null で、面に出る字は今と変わらない。面の表示（一覧の概要・頁の 2 つの箱と file と行・card の概要）は後の行 g-summary が持つ。台帳の bead の概要と、要約の無い節点を床が数えて名指すこと（FR15 の最後の文と受入基準 AC12 の要約の無い節点の名指し）は後の行 c-summary-ledger が持つ。この行は受入基準 AC12 を満たしたと言わない（要約の無い節点を数える歯はこの行に無い）。
      在りか（main 8693ad3 で確かめ、b525a13 で確かめ直した）。契約の型の crate の src/graph.rs の pub struct GraphNode は pub な欄 id（String）・kind（NodeKind）・file（Option の String）・digest（Option の String）・title（String）を持ち、derive は Debug・Clone・PartialEq・Eq・Serialize・Deserialize で、欄に serde の属性を持たない（無しの欄は null の字で鍵が残る）。GraphNode は GraphDoc の欄 nodes と ViewNode の欄 node と AroundRow の欄 node の中身で、この 3 つの型は変えない（どれも derive に Eq を持つ）。同じ crate の src/question.rs の QuestionCard は同じ意味の欄 plain と eng を Option の String で serde の属性なしに持つので、名と形をそれに揃える。
      在りか（中核）。src/graph/mod.rs は pub mod around・build・check・view と pub use build::build を持ち、pub struct Inputs（欄 design_index・ledger・events の 3 つの &str）と pub struct Graph（pub な欄 nodes の Vec の GraphNode・edges・unread・skipped・beads・runs・derive に Debug と Clone と Default と PartialEq と Serialize）を持ち、どの関数も file と子 process を触らない。src/graph/build.rs は pub fn build（&Inputs を受けて Graph を返す）を持ち、GraphNode を struct の字で 4 か所で組む（設計の索引の節点の行を読む fn read_design・台帳の bead と notes の定型行の節点を組む fn add_ledger の 2 か所・走行の節点を組む fn add_runs）。read_design は索引の節点の行を 5 列（id・種類・file・要約値・題）のタブ区切り、辺の行を 3 列で読み、字 # で始まる行と空の行を読み捨て、形の合わない行が 1 つでも在れば索引を読めない（None）とする。build.rs は serde の derive の Deserialize を既に使う（台帳の bead の読みの型）。中核の crate の直接依存は serde と serde_json と契約の型の crate の 3 つ。Inputs は着地済みの多くの歯が struct の字で組むので、この行は Inputs に欄を足さず、要約は build の後に撃つ別の関数で写す。mod.rs の pub mod build の module は外から graph の build の path で届き（関数 build の再公開とは名の空間が別）、境界の src/cli/graph.rs は既にその path で build.rs の定数 DESIGN_EDGE_TYPES を読む。今の build.rs の字は std::fs と std::process と SystemTime を持たない（確かめた）。この行が足す名（GraphNode の欄 line・plain・eng と、中核の関数 add_summary と、歯の file tests/nsum.rs と接頭辞 nsum_）は、GraphNode の欄としても関数としても base のどの crate の src と tests にも無い（確かめた）。同じ名の欄と関数は別の型に在る（契約の型の QuestionCard の欄 plain と eng・面の crate の src/project/ask.rs と src/project/node.rs の pub fn summary）が、この行は触らない。
      在りか（folio の口・0fb780e を main の design-intent で撃って確かめた）。境界の crate の src/server/design.rs は folio を graph・--print・--dir と設計文書の dir の引数で撃ち、その標準出力（索引）を build に渡す。索引の節点の行は 5 列で、行の番号も概要も持たない。folio graph --print --summary --dir の dir は、表の代わりに、設計の節点ごとに JSON の object を 1 行ずつ出す（JSON Lines）。object の鍵は id・kind・file・line・title・plain・eng の順で、line は所属 file の中でその id が書かれた行の番号（1 から数える整数）、plain は平易文の欄の字のまま（判断の記録の plain は改行を含む）、eng は shall・text・what・decision の欄のうち最初に在る欄の字（条はその最初の規範文の字・受入基準は題の全文）、欄が無ければ null。main の design-intent では 237 行で、--print の節点の行と同じ順・同じ id と種類と file と題だった。--summary の出力は要約値と辺を持たないので、build は今のまま --print の索引を読み、要約は 2 つ目の字として別に写す。席の folio の link は持ち主の裁定 t3-hub.58 の後に 0fb780e を指す（事前の点検の時に確かめた）。前の 866bb78 は --summary を知らず、使い方の誤りを標準エラーに出して rc 2 で終わる（その扱いは c-summary-wire が持つ）。
      形（契約の型）。GraphNode の欄 title の後に、欄 line（Option の u32・所属 file の中で id が書かれた行の番号・1 から数える）・plain（Option の String・非エンジニア向けの概要）・eng（Option の String・エンジニア向けの概要）をこの順で足す。rename と skip_serializing_if は付けない（無しは null の字で鍵が残る・歯は snapshot の null と鍵の順で見る）。serde の default の属性は付けても付けなくてもよい（serde の derive は鍵の無い Option の欄を無しに読む・歯は decode の値で見る）。derive は変えない（GraphDoc と ViewNode と AroundRow の Eq が GraphNode の Eq を要る）。電文の鍵の順は id・kind・file・digest・title・line・plain・eng になる。
      形（中核）。src/graph/build.rs に pub fn add_summary（g の &mut Graph と summary の &str を受けて bool を返す）を足す（mod.rs の re-export は足さない・呼ぶ側は graph の build の module の path で呼ぶ）。決まり。字の前後の空白を除いて空なら読めない。そうでなければ字を行に割り、前後の空白を除いて空の行は読み捨て、ほかの行はどれも JSON の object で、鍵 id の値が字、鍵 file の値が字か null、鍵 line の値が 0 以上で u32 に収まる整数か null、鍵 plain と鍵 eng の値が字か null でなければならない（鍵が無ければ null と同じ・鍵 kind と title とほかの鍵は読み捨てる）。形に合わない行が 1 つでも在れば読めない（read_design と同じく、全部か無しか）。読めなければ g を変えずに偽を返す。読めたら、g の節点のうち、欄 file が Some で、id と file の字が行の id と file の字と同じ行が在る節点ごとに、line と plain と eng をその行の値（null は無し）にし、真を返す（写した節点が 0 でも真）。字は長さで切らず改行も含めてそのまま写す（面の文の予算の切りは面の行 g-summary が当てる）。file が違う行・グラフに無い id の行は読み捨て、行の無い節点と file が無い節点（台帳と走行の節点）の 3 つの欄は触らない。節点のほかの欄と、辺・unread・skipped・beads・runs は触らない。同じ id と file の行が 2 つ在るときにどちらを写すか、JSON の配列の行を読めるとするかは決めない（歯は見ない）。file も子 process も触らない（done (4) の字の歯）。行を読む型の形と pub かどうかは決めない（例 鍵 id・file・line・plain・eng を持つ私的な struct に serde の derive の Deserialize を付ける形）。
      形（build.rs の組み）。build.rs の 4 か所の GraphNode の組みは line と plain と eng を無しにする（build は索引と台帳と event log から 3 つの欄を読まない・概要と行は add_summary だけが写す）。build.rs の頭の注に、要約は add_summary が写すことを足してよい。
      着地済みの歯（直すもの・節点を struct の字で組むので組めなくなる・main 8693ad3 と b525a13 の全部の crate の src と tests と xtask を字 GraphNode と開き波括弧で grep した・どちらも同じ 14 か所で、build.rs の 4 か所と歯の 10 か所）。契約の型の crate の tests/contract_form.rs の 6 か所（fn task_node・fn run_node・forms の中の graph::GraphNode の見本の 2 つ・graph::GraphDoc の見本の 1 つ目の nodes の 2 つ）で 3 つの欄を足す。graph::GraphNode の見本の 1 つ目（id ADR-7・file adr/ADR-7.yaml）だけは line を Some の 3・plain を字「決定の画面の形を決めます。」・eng を字「面は 2 つとする。」にし、ほかの 5 か所は 3 つとも無しにする。snapshots/contract_form.json は歯 contract_form_snapshot_matches が CARGO_TARGET_TMPDIR に書く今の字を写す（鍵 id と kind と digest と title を持つ 13 個の object は、graph::GraphNode・graph::GraphDoc・graph::ViewNode・graph::GraphView・graph::AroundRow の列に 2 個ずつと graph::AroundDoc の列に 3 個で、ViewNode から後の見本は fn task_node と fn run_node の節点を使う・1 個が値を持ち 12 個が null を持つ）。中核の tests/gview.rs の fn node、面の tests/nodepage.rs の fn row の中の GraphNode、tests/mapgraph.rs の fn node の中の GraphNode、tests/itemlink.rs の fn node は 3 つとも無しを足すだけで、期待は変えない（どの歯も組んだ節点を眺めと近傍と面の関数に渡して id と段と数と字を見て、新しい欄を読まない）。面の src と境界の src は GraphNode を struct の字で組まず、欄を全部並べる分解も持たない（確かめた）。
      着地済みの歯（直さずに通るもの）。中核の tests/graph.rs と tests/gquestion.rs と build.rs の中の歯 graph_ は build の節点の数と種類と id と辺と属性を見て、build の値は 3 つの欄が無しになるほか変わらない。境界の歯はこの行が境界の crate を書かず add_summary を呼ばないので通る。server_read の歯は口の電文を decode して中核の build の nodes と比べ（両側とも 3 つの欄が無し）、server_view の歯は口の本文の字を中核の値を encode した字と比べ（両側とも 3 つの鍵が null）、server_coalesce の歯は decode するだけで、kcli の歯は tz graph の電文を board の graph の値と比べる（両側とも同じ組み）。folio の引数の列を見る歯（src/server/design.rs の中の server_read_folio_args と tests/server_read.rs の server_read_folio_argv_and_cwd）は design.rs を書かないので変わらない。面の tests/frame.rs・mapview.rs・maplink.rs・graphnav.rs と、第 5 波で着地した tests/hruling.rs・ncard.rs・ptitle.rs・ntime.rs・aaround.rs は tests/fixtures/surface の JSON を decode して（hruling は辺を足して encode し直した字を・ntime は種類を替えて encode し直した字を）面の関数に渡すだけで、新しい欄を読まず、fixture の字と電文の字を比べず、GraphNode を struct の字で組まない。鍵の無い Option の欄は無しに読める（done (2) の歯が同じ 3 つの fixture で見る）。面の頁の snapshot は面の src が新しい欄を読まないので変わらない。契約の型の src を歩く着地済みの歯は 2 つで、契約の型の crate の tests/acctdoc.rs の acctdoc_paths_once_in_account_module は契約の型の src の引用符で囲んだ /api/account と /api/account/heartbeat の字を、境界の crate の tests/brand.rs の brand_path_written_once_in_contract は契約の型と境界と面の src の引用符で囲んだ /api/project の字を数える。src/graph.rs はどの字も持たず、この行も足さない（確かめた）。xtask の歯 skeleton_direct_deps_match_list と中核の tests/acctcore.rs の acctcore_pure_and_no_new_dependencies は Cargo.toml を読み（後者は中核の src/account の下の字も読む）、この行はどれも書かない。中核の src/graph の下の字を読む着地済みの歯は無い（この行の歯 nsum_core_reads_no_files が初めて build.rs の字を読む）。
      節の字（歯の中に書く・fixture の file は足さない）。節点 N1 は id FR1・kind 要件（NodeKind の Req）・file srs.yaml・digest 00000000・title 面は 2 つ・line 2・plain 画面は 2 つです。・eng 面は 2 つとする。の節点。N_OLD は鍵 id FR1・kind 要件・file srs.yaml・digest 00000000・title 面は 2 つ の 5 つだけを持つ JSON の object の字。IDX はタブ区切りの 5 列の 5 行で、FR1・要件・srs.yaml・00000000・面は 2 つ、FR404・要件・srs.yaml・00000000・要約の行が無い、owner・登場人物・srs.yaml・00000000・持ち主、ADR-90・判断の記録・adr/ADR-90.yaml・00000000・見本、A-9・条・constitution.yaml・00000000・file の違う行。LED は bead 1 本の JSON の配列（鍵 id t-1・title 台帳の行・issue_type task・status open・台帳の読みの型は id のほかの欄を省ける・確かめた）で、build はこの bead を file の無い種類 task の節点 t-1 にする。SUM は JSON の object の 6 行と、3 行目と 4 行目の間の空の行 1 つで、各行の鍵は id・kind・file・line・title・plain・eng の順。1 行目 FR1・要件・srs.yaml・2・面は 2 つ・plain 画面は 2 つです。・eng 面は 2 つとする。、2 行目 ADR-90・判断の記録・adr/ADR-90.yaml・3・見本・plain は 一つ目です。と改行 1 つと 二つ目です。をつないだ字・eng 一つ目を決める。、3 行目 owner・登場人物・srs.yaml・37・持ち主・plain null・eng null、4 行目 A-9・条・rules.yaml・7・file の違う行・plain 違う file です。・eng null（file が節点の constitution.yaml と違う）、5 行目 t-1・要件・srs.yaml・9・台帳の行・plain 台帳です。・eng 台帳。（節点 t-1 は台帳の節点で file が無い）、6 行目 X-1・要件・srs.yaml・11・無い節点・plain 無いです。・eng 無い。（グラフに無い id）。SUM_MIN は鍵 id FR1・file srs.yaml・line 2・extra 1 だけを持つ object の 1 行。BAD_LINE は SUM の 1 行目の後に、鍵 id FR404・file srs.yaml・line の値 -1 の object の行を続けた 2 行（line が u32 に収まらない）。NO_ID は鍵 file srs.yaml・line 2 だけを持つ object の 1 行（鍵 id が無い）。
      測り方。新しい歯は中核の crate の tests/nsum.rs に置き、名を nsum_ で始める。節の字は歯の中で組む（JSON の字は serde_json で組んでも字で書いてもよい）。done (1) は encode の字の中の 8 つの鍵の字（引用符で囲んだ鍵の名とコロン）の位置が増える順で、どれも 1 度だけ現れることと、serde_json の Value に読んだ鍵の集合と値を見る。done (2) と (8) と (9) は workspace の根（CARGO_MANIFEST_DIR の 2 つ上）の着地済みの fixture を読むだけで書かない。done (2) の 3 つの fixture の節点はどれも鍵 id・kind・file・digest・title の 5 つだけを持つ（確かめた・graph-doc.json の nodes は 34 個・around-doc.json の rows は 6 行・graph-view.json の nodes は 8 個）。done (8) の design-index.tsv の節点の行の id は重ならず、台帳と event log を空の字にしたグラフの節点は全部が設計の種類で欄 file を持つ（確かめた）。done (9) の 3 つの fixture で build の unread が空なことは、同じ 3 つの字を build に渡す着地済みの歯 server_read_four_routes_match_core も見る。done (3) は中核の crate の CARGO_MANIFEST_DIR の 1 つ上の tsuzuri-contract/tests/snapshots/contract_form.json（契約の型の crate の snapshot）を Value に読み、鍵 id と kind と digest と title を持つ object を入れ子の全部から数える。done (4) の字の歯は src/graph/build.rs の字を読む。done (5) と (6) と (7) は build の値を clone して撃つ前の値にし、(5) は撃った後の値の全部の節点の 3 つの欄を無しに戻して比べる。done (8) の行の字は serde_json の json! で組む（title の字の引用符と逆斜線を字のまま運ぶ）。
      filter の語（着地済みの行と第 3 波から第 7 波の行の verify の語・この行の接頭辞 nsum_ は並べない・92 語）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・qgate_・hcard_・ntime_・ptitle_・ncard_・hsym_・smore_・lcard_・aaround_・hruling_・sxaxis_・plimit_・bport_・fstop_・nsumw_・fmark_・fserve_・cadopt_・tipx_・hcsess_・hcproj_・sesplit_・mstore_・athr_・qblock_ で、新しい歯の名から先頭の nsum_ を除いた字は、このどれも部分の字として含まない（例 nsum_graph_nodes・nsum_stage_line・nsum_server_text は不可）。名は done に書いた nsum_wire_keys_in_order・nsum_old_text_reads_none・nsum_snapshot_carries_fields・nsum_core_reads_no_files・nsum_fills_matching_nodes・nsum_missing_keys_are_null・nsum_unreadable_changes_nothing・nsum_every_index_node_filled・nsum_build_leaves_fields_empty・nsum_own_names_clean（どの語も含まない）。
      依存。depends は空（folio2 の --summary の着地は別の repo の事実で、この行の歯は folio を撃たない）。書く file が重なる行とは直列に流す（計画の 5 節）。contract/graph.rs と core/graph/build.rs は c-summary-design → c-dn-rows → c-summary-ledger → c-updated の順。tests/nodepage.rs は第 5 波の g-node-timeline も書いた（着地済み・main 7feba57）。g-node-timeline は歯 nodepage_frame_and_nav の block の列に timeline を足しただけで、fn row と fixture の読みとほかの歯を変えていない（main で確かめた）。この行が直すのは fn row の組みだけで、nodepage のほかの期待は main のまま。tests/contract_form.rs と snapshots/contract_form.json を書くほかの行（例 問いの card に欄を足す c-q-blocking）とも直列にする。流す直前に席が全部の crate の src と tests と xtask で GraphNode の struct の字の組みを grep し直し、write-set と verify を組みの在る file と同じにする。外の依存は足さず Cargo.toml は触らない（中核の crate は serde と serde_json と契約の型の crate を既に直に持ち、歯も使える）。後の行 c-summary-wire がこの行の add_summary を server と tz graph から呼ぶ。
  - n: 7
    type: prose
    title: 行 c-summary-wire — server と tz graph が folio の要約も読み、節点に行の位置と 2 つの概要を載せる
    body: |
      なぜ。要件 FR15 は、節点ごとの概要を設計文書の plain の欄に置き、面は写すだけとする。行 c-summary-design は電文の節点の欄 line・plain・eng と、folio の要約の字を節点に写す中核の関数 add_summary を置いたが、server と tz graph は folio を --print でしか撃たないので、本番の電文の 3 つの欄はいつも null。この行は server と tz graph に要約の読みを足し、その字を add_summary に渡す。
      この行が持たないもの。面の表示は後の行 g-summary、台帳の bead の概要と要約の無い節点の床の数え（受入基準 AC12）は後の行 c-summary-ledger が持つ。この行は受入基準 AC12 を満たしたと言わない。席の folio の link を 0fb780e に替えたのは持ち主の裁定 t3-hub.58 の後の席の手で（事前の点検の時に link は 0fb780e を指していた）、この行の code ではない。
      在りか（main 8693ad3 と行 c-summary-design の契約で確かめ、b525a13 で確かめ直した・この行の書く file と読む file は 8693ad3 から変わっていない）。境界の crate の src/server/design.rs は pub const FOLIO（字 folio）・DESIGN_DIR（字 design-intent）・FOLIO_ARGS（[&str; 3]・graph・--print・--dir）・FOLIO_TIMEOUT（5 秒）・FOLIO_WAIT（FOLIO_TIMEOUT に coalesce の GRACE の 1 秒を足した値）と、pub struct Design（pub な欄 repo の PathBuf と folio の OsString と、私的な欄 shared の Coalesce の String・derive は Debug と Clone・PartialEq は repo と folio だけを比べる）を持つ。Design の pub fn は new（repo と folio を受ける）・dir（repo と DESIGN_DIR をつないだ path）・args（FOLIO_ARGS の後に dir）・text（Option の String・shared で合流して capture を FOLIO_WAIT まで待つ）・marks（設計文書の dir の下の file の列）。design.rs の中の歯は server_read_folio_args（args の値）・server_read_unstartable_folio_is_unread・server_read_marks_walk_the_dir。src/server/proc.rs の pub fn capture（design.rs は src/server/ledger.rs の再公開 pub use super::proc の capture を通して呼ぶ・program の &OsStr・引数・cwd の &Path・上限の Duration を受け Option の Vec の u8 を返す）は、cwd を置き、標準入力を空に、標準エラーを捨て、新しい process group で撃ち、rc 0 で上限の内に返した標準出力だけを Some で返す（上限を越えれば group ごと止める）。src/server/coalesce.rs の Coalesce（Clone は同じ合流の場を分け合い、Debug と Default を持つ）の share（上限と読みの関数を受ける）は、同じ値とその clone の上で走っている読みが在れば新しく撃たずにその結果を待ち、new で作った別の値とは分け合わない。
      在りか（board と tz graph）。src/server/board.rs の pub struct Sources（pub な欄 ledger・design の Design・runs）と pub struct Texts（pub な欄 design・ledger・events の 3 つの String・derive は Debug と Clone と Default と PartialEq と Eq）と、Texts の pub fn inputs（中核の Inputs を返す）、Sources の pub fn gather（design と events の bool を受け Texts を返す・design が真なら索引の読みを thread の scope で並べて撃つ）、pub fn graph（GraphDoc）・view（GraphView）・around（中心の id と段と畳みを受け Option の AroundDoc）が在り、3 つとも中核の build に Texts の inputs を渡したグラフを使う。gather を design 真で呼ぶのは口 /api/graph・/api/graph/view・/api/around の route の file と tz graph の旗なしと --check で、板・指標・次の一手・未反映の口は design 偽で呼ぶ。src/cli/graph.rs の tz graph --design は Texts を組み（欄 design に Design の new の text の字、ほかは Texts の default）、board の graph の値を design_view に渡す。board.rs の Texts を struct の字で組む所は board.rs の gather と cli/graph.rs（残りを Texts の default で埋める）と tests/kcli.rs の fn texts（3 つの欄を全部並べる）の 3 つで、ほかに無い（確かめた・境界の src/acct.rs の私的な struct Texts は account board の読みの別の型で、この行は触らない）。この行が足す名（design.rs の SUMMARY_ARGS と Design の summary_args と summary・board.rs の Texts の欄 summary・歯の file tests/nsumw.rs と接頭辞 nsumw_）は base の境界の crate の src と tests のどこにも無い（確かめた）。名 summary の pub fn は面の crate の src/project/ask.rs と src/project/node.rs に在るが、別の crate の別の関数で、この行は触らない。
      在りか（中核・行 c-summary-design の契約）。中核の crate の src/graph/build.rs の pub fn add_summary（g の &mut Graph と要約の字の &str を受け bool を返す）は、字が空か形の合わない行が在れば g を変えずに偽を返し、読めたら id と file の字が同じ行の在る節点の line・plain・eng をその行の値にして真を返す（file の無い台帳と走行の節点と、行の無い節点は触らない）。索引（5 列のタブ区切り）の字を渡すと、どの行も JSON でないので偽を返し g を変えない。呼ぶ path は tsuzuri_core の graph の build の add_summary（graph の mod.rs の pub mod build の module・関数 build の再公開とは名の空間が別で、src/cli/graph.rs は既に同じ module の path で定数 DESIGN_EDGE_TYPES を読む）。
      在りか（folio の口・0fb780e と 866bb78 を main の design-intent で撃って確かめた）。0fb780e の folio graph --print --summary --dir と dir は、設計の節点ごとに鍵 id・kind・file・line・title・plain・eng の JSON の object を 1 行ずつ出し、rc 0。要約値と辺は出さないので、--print の索引の読みはそのまま要る。前の席の folio（866bb78）は --summary を知らず、使い方の誤りの字を標準エラーに出して rc 2 で終わる（--print の字は 0fb780e と同じ）。server は起動の引数 --folio の path の program を読みのたびに撃つ（config の欄 folio の OsString・既定は FOLIO）。
      形（design.rs）。pub const SUMMARY_ARGS（[&str; 4]・graph・--print・--summary・--dir）を足す。要約の読みも索引の読みと同じく合流させる（例 Design に私的な欄をもう 1 つ・要約の読みの合流の場の Coalesce の String を足し、new で作る・合流の場の持ち方は決めない）。pub fn summary_args（SUMMARY_ARGS の後に dir）と pub fn summary（Option の String）を足す。summary は text と同じ形で、program を summary_args で capture に渡し（cwd は repo の置き場・標準入力は空・標準エラーは捨てる・上限は FOLIO_TIMEOUT・cwd は done (7) の歯、上限は done (5) の歯が見る）、UTF-8 の字なら Some を返し、同じ Design とその clone の上の要約の読みは走っている 1 本を分け合い（text の合流の場とは別の場）、合流した呼び出しは FOLIO_WAIT まで待つ。FOLIO_ARGS と args と text と marks は変えない。module の頭の注には、要約の読みの形と、--summary を知らない folio では要約だけが読めない（索引は読める）ことを足してよい（字の歯は無い）。
      形（board.rs と cli/graph.rs）。Texts に pub な欄 summary（String・設計の索引の要約・読めないか集めなかったら空の字）を足す。gather は design が真のとき、索引の読みと要約の読みを並べて撃ち（今の gather と同じ thread の scope でよい・台帳の読みも同じ時に走る）、要約の字を summary に入れる。design が偽なら要約を撃たない。graph と view と around は、中核の build の後に add_summary に Texts の summary を渡したグラフを使う（私的な関数に 1 つにまとめてよい）。add_summary の返りの bool は使わなくてよい。電文の unread は変えない（要約が読めなくても設計の出所は読めたまま・3 つの欄の null が測れていないの印になる）。cli/graph.rs の --design の Texts の組みは欄 summary にも同じ Design の summary の字を入れる（2 つの読みは順に撃ってよい）。旗なしと --check は gather を通るので書き足さない。
      実物の振る舞い。席の server の起こし直しの script は --folio に席が pin した folio の link の path を渡す。--summary を知らない folio（866bb78 など）を --folio に渡した server では、要約の読みは rc 2 で読めず、Texts の summary は空の字で、add_summary は偽を返してどの節点も変えず、電文の 3 つの欄は全部 null で、グラフの節点と辺と unread と不変条件の判定は今と同じ（グラフを落とさない・要件 NFR2 の読めないものを 0 と出さない、に沿って null を測れていないの印として運ぶ・done (4) の Refuse がこの形を見る）。link が 0fb780e を指す今は、この行の着地の後に組み直した server の読みから設計の節点に行と概要が載る（program は読みのたびに path で撃つので、link を替えるだけなら server を起こし直さなくてよい）。2 つの読みは並べて撃つので、要求の待ちは遅い方の 1 本分（どちらも FOLIO_TIMEOUT まで）。
      着地済みの歯（直すもの）。tests/server_read.rs の server_read_folio_argv_and_cwd は、偽の folio が撃たれた回ごとに引数の列と cwd を残す作業場で、今は口 /api/graph の 1 回に 1 回・引数の列 graph・--print・--dir・設計文書の dir を見る。直した後は 1 回に 2 回で、引数の列は graph・--print・--dir・設計文書の dir と、graph・--print・--summary・--dir・設計文書の dir の 1 つずつ（pid の順は撃った順と限らないので順は問わない）、どちらも cwd は repo の置き場、2 回目の口の後は 4 回、板と指標と次の一手の口の後も 4 回（この 3 つの口は設計の索引も要約も撃たない）。program の既定の名の FOLIO の値の比べは変えない。tests/server_view.rs の server_view_graph_view_matches_core は、撃たれた回ごとに file を 1 つ置く偽の folio で、眺めの口 1 回に 1 回を見る。直した後は 2 回。本文の字の比べは変えない（偽の folio は --summary でも索引の字を返し、add_summary は偽を返して何も写さないので、中核の build だけの値と同じ字になる）。tests/server_coalesce.rs の server_coalesce_graph_routes_share_one_folio は、撃たれるたびに記録の file に 1 行を足す偽の folio で、3 つの口（/api/graph 2 つと /api/graph/view）の同時の要求の回が 1 以上 2 以下を見る。直した後は、引数に --summary の在る回と無い回を分けて数え（偽の folio が引数を見て別の記録に書く形でよい）、どちらも 1 以上 2 以下（索引と要約のどちらの読みも合流する）。tests/kcli.rs の fn texts は Texts を 3 つの欄を並べる struct の字で組むので、欄 summary を空の字で足す（Texts の default で残りを埋めてもよい）。期待は変えない（偽の folio は引数を見ず索引の字を返すので、tz graph の要約は読めず、board の graph の値と同じになる）。
      着地済みの歯（直さずに通るもの）。server_read_four_routes_match_core・server_read_runs_unread_without_log・server_read_design_unread_on_folio_failure は口の nodes を中核の build の nodes と比べ、偽の folio が --summary でも索引の字を返すので要約は読めず、両側とも 3 つの欄が無し。design_unread_on_folio_failure の rc 1・無い program・返さない の 3 つでは要約の読みも読めず、返さない場合の口の時間の上限（FOLIO_TIMEOUT に 2 秒を足した時間より短い）は、要約の読みを索引の読みと並べて撃つので越えない。server_read_routes_write_nothing と server_read_non_get_405_writes_nothing は repo と state dir の byte と 405 の口の撃たれた回 0 を見て、偽の folio の記録は repo の外に在る。server_read_board_changed_within_5s と server_read_tz_takes_state_dir_and_folio は読みの回を数えない。server_view のほかの歯（近傍の本文の比べ・未反映と 405 の口の撃たれた回 0）は、本文が中核の値と同じ字のままで、未反映と 405 の口は設計の読みを撃たない。server_coalesce のほかの歯は bd の回を数える。kcli のほかの歯（旗なしの電文と board の graph の比べ・--design の電文の比べと 2 つの撃ち方の標準出力の一致・--check の行・folio の無い --design の rc 2）は、要約が読めないので今と同じ値になり、folio の無い program では索引も要約も読めない。design.rs の中の 3 つの歯と board.rs の中の歯 server_read_doc_copies_verdicts・server_read_empty_texts_are_unread は、args と text と marks を変えず、Texts の default の summary が空の字なので通る（src の中の歯は xtask の check が撃つ・verify に --lib の行を置かないのは、filter の語 server_read_ が write-set の外の src/server/events.rs の歯 server_read_watch_board_sends_on_marks と src/server/runs.rs の歯 server_read_events_log_path にも当たるから）。hbconf の歯は src/server/mod.rs と config.rs と main.rs の字と、Config を struct の字で組む 9 つの歯の file（server_read.rs・server_view.rs・server_coalesce.rs を含む）の fn config の字（Config::new と ..Config::new）を読む。この行は mod.rs と config.rs と main.rs を書かず、3 つの歯の file の fn config は変える要が無い（偽の program は fn new の中で置く・変えるなら Config::new と ..Config::new の形を保つ・新しい nsumw.rs は 9 つに入らない）。hbconf.rs は置き場だけの = で write-set に置き、verify で撃つ。brand_path_written_once_in_contract は契約の型と境界と面の src の引用符で囲んだ /api/project の字を数え、この行はその字を足さない。hbroute の歯は routes の dir の file を数え、この行は足さない。
      節の作業場（歯の中で組む・fixture の file は足さない）。歯ごとに CARGO_TARGET_TMPDIR の下に作業場を置く（repo の置き場の .beads の印の file と design-intent の dir・面の file の置き場の index.html・state dir の fleet の events.jsonl に着地済みの fixture の tests/fixtures/graph/real/events.jsonl の写し・台帳の fixture の tests/fixtures/ledger/bd-list-8.json を返す偽の bd）。偽の folio は shell の script で、撃たれた回ごとに引数を記録し、引数に --summary が無ければ着地済みの fixture の tests/fixtures/graph/real/design-index.tsv の字を返して rc 0 で、--summary が在るときの振る舞いは 3 つ。Lines は作業場に置いた SUMW の file の字を返して rc 0、Refuse は標準エラーに字を出して rc 2、Hang は FOLIO_TIMEOUT より長く眠る。SUMW は JSON の object の 3 行で、各行の鍵は id・kind・file・line・title・plain・eng の順。1 行目 R-25・規則行・rules.yaml・94・直接依存の予算・plain null・eng 直接依存の予算。、2 行目 FR15・要件・srs.yaml・242・概要は data で持つ・plain 説明は文書に書きます。・eng 概要は data で持つ。、3 行目 A-1・条・rules.yaml・5・確認・plain 違う file です。・eng null。索引の fixture で R-25 の file は rules.yaml、FR15 は srs.yaml、A-1 は constitution.yaml（確かめた）なので、A-1 の行は file が違って写らない。
      測り方。新しい歯は境界の crate の tests/nsumw.rs に置き、名を nsumw_ で始める。server は同じ process の thread で 127.0.0.1 の空き port に立て（server_read と同じ形）、tz は CARGO_BIN_EXE_tz を撃つ。done (3) の G は、歯の中で 3 つの fixture の字を中核の build に渡し、SUMW の字で add_summary を撃って組み、眺めと近傍の本文は G を中核の view と around に渡した値を wire の encode で字にして比べる（境界の crate は serde に直に依存しないので型ごとに wire の encode を呼ぶ）。done (5) は要求の前後の Instant の差で測る。done (7) と (8) は着地済みの歯の file の中で測る。
      filter の語（着地済みの行と第 3 波から第 7 波の行の verify の語・この行の接頭辞 nsumw_ は並べない・92 語）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・qgate_・hcard_・ntime_・ptitle_・ncard_・hsym_・smore_・lcard_・aaround_・hruling_・sxaxis_・plimit_・bport_・fstop_・nsum_・fmark_・fserve_・cadopt_・tipx_・hcsess_・hcproj_・sesplit_・mstore_・athr_・qblock_ で、新しい歯の名から先頭の nsumw_ を除いた字は、このどれも部分の字として含まない（例 nsumw_server_routes・nsumw_graph_nodes・nsumw_tz_output は不可）。名は done に書いた nsumw_summary_argv・nsumw_summary_reads_output・nsumw_routes_carry_fields・nsumw_refused_summary_stays_null・nsumw_hung_summary_keeps_index・nsumw_cli_doc_carries_fields・nsumw_own_names_clean（どの語も含まない）。
      依存。depends は c-summary-design（add_summary と GraphNode の 3 つの欄を使う）。書く file（境界の server の design.rs と board.rs・cli の graph.rs・4 つの歯の file）を書く第 6 波のほかの行は無い（f-stop は境界の hook の dir・lib.rs・main.rs と plugin の dir を書き、f-mark-serve は server の ruling.rs と batch.rs・歯の server_ask.rs と server_batch.rs を書き、hbconf.rs はこの行と同じく置き場だけの = で置く。f-gate は hook の dir と lib.rs と main.rs、c-acct-thr は acct.rs を書く・起草の file と計画の 4 節で確かめた）。外の依存は足さず Cargo.toml は触らない（境界の crate は中核と契約の型の crate を既に直に持つ）。

