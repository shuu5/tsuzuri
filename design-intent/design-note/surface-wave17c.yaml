  - n: 3
    type: prose
    title: 行 g-kind-label — 未反映の種類の見出しを 2 つの board で同じ語にする
    body: |
      在りかの main は 947fb4a（計画 surface-plan v0.51）。起草と試作は f71082f（行 g-card-adopt-c の着地）で撃ち、947fb4a で確かめた（この間に変わったのは design-intent と contracts の字だけで、面の crate の字と、contracts の verify の filter の語は同じ）。
      なぜ。要件 FR13 は、design-intent に未反映のもの（昇格先の無い memo・処分の宣言の無い裁定・反映されていない要望）を一覧で出し、account board は project ごとに未反映の数を出すとし、要件 NFR1 は見出しを語彙表の語だけにする。見本 mock v3 は未反映の種類を 2 つの board で同じ 3 語 memo・裁定・要望 で出す（account board は docs/design/mock3/account/index.html の unrefBreak の内訳の鍵 memo・裁定・要望、project board は index.html の台帳の block の未反映の段の chip の 3 語と、ledger.js の unrefHTML の一覧の種類の欄 u-k の字と、ui.js の unreflected が作る項の kind の字 裁定）。本番の account board は着地済みの行 h-acct-rest が語の辞書の鍵 unref: と種類の名の label で出す（kind_label）が、project board は内部の名をそのまま出す（未反映の一覧の種類の欄と、指標の段の読めない種類の chip と、一覧の読めない種類の行に ruling・request の字が出る）。この行は kind_label を 2 つの board の共通の所へ移し、project board の 3 か所も同じ label で出す（計画 9 節の計画だけの行 g-kind-label・席の決め〔2026-09-28・第 13 波 c の起草の問い〕）。
      在りか・ledger.rs（write-set・1219 行・build.rs が生成する pub mod で crate::project::ledger・結合試験は tsuzuri_surface::project::ledger・上限 1500 に近い file の 1 つ）。host の部分の use に crate::vocab の label（23 行）が在る。pub const UNREF_KINDS（323 行・UnreflectedKind と名の &str の 3 組・memo・ruling・request）と pub fn kind_name（330 行・表から名を引く）が未反映の種類の名の 1 か所の表。pub struct Unref（340 行・derive は Debug・Clone・PartialEq・Eq・pub な欄 count の u32 と unknown の &static str の Vec・unknown は kind_name の字）、pub fn content（579 行）と pub fn panel（600 行・LedgerStats の参照と Screen の参照を受け Metrics を返す・Metrics の pub な欄 unref の unknown は電文の unreflected_unknown を kind_name で写した列）、pub struct UnrefRow（768 行・pub な欄 id と title の String・kind の &static str〔kind_name の字〕・age の String・next の &static str）、pub struct UnrefList（778 行・pub な欄 rows・more・unknown〔kind_name の字の列〕）と pub fn unref_list（806 行・Fetched の参照を受け Body の UnrefList を返す）。wasm の target のときだけの mod dom（867 行・字 mod dom { は file に 1 度）の use の super の列（874〜878 行）に unref_list ほかが在り、use に crate::vocab の label が在る。DOM の 3 か所が種類の名をそのまま出す。fn unref_view（1059 行）は m.unref.unknown の名ごとに class chip num の span の中身に字 {*k} と空白と測れていないの記号を出し（1064 行）、fn unref_rows（1091 行）は l.unknown の名ごとに class small muted の div の中身に字 {*k} と記号と語 gap_unknown を出し（1115 行）、fn unref_row_view（1123 行）は行の種類の欄の span の中身に字 {r.kind} を出す（1128 行）。
      在りか・account/projects.rs（write-set・1233 行・crate::account::projects・結合試験は tsuzuri_surface::account::projects）。host の部分の use は 16 行が契約の stats の CheckResult・LedgerStats・UnreflectedKind、22〜24 行が crate::project::ledger の JUDGES・Judge・Net・SPARK_H・SPARK_W・Unref・age・judge・kind_name・net・spark・spark_svg、29 行が crate::vocab の label（host の部分で label を使うのは kind_label だけ・UnreflectedKind を使うのも kind_label の宣言だけ）。pub fn unref_count（275 行・Unref の unknown は kind_name の字・測れていないの印の有無にだけ使う）、pub const UNREF_KIND_KEY（340 行・字 unref:）、pub fn kind_label（343 行・本文は label に接頭と kind_name の字を足した鍵を渡す）、pub struct UnrefKinds（349 行・pub な欄 known の String と u32 の組の Vec と unknown の String の Vec）、pub fn unref_break（355 行・読めた種類と読めない種類の見出しを kind_label で組む）と pub fn kinds_of（372 行）。mod dom（800 行）の fn unref_view（1111 行）は UnrefKinds の見出しを出す（この行は DOM を変えない）。
      在りか・着地済みの歯で、この行が use の字を直す 1 つ（write-set）。tests/harest.rs（562 行）の 11〜14 行の use が account の projects から PSort・UNREF_KIND_KEY・UnrefKinds・UnrefSum・batch_of・batch_text・kind_label・kinds_of・table・unref_break・unref_sum を、16 行の use が project の ledger から kind_name を引く。歯 harest_kind_labels（190 行）は UNREF_KIND_KEY が字 unref: であることと、kind_label の 3 種の字（memo・裁定・要望）と、語の辞書の欄 english と rephrase の鍵の在りかと label と、projects.rs の DOM の部分に字 kind_name が無いことを見る。
      使う物（この行は書かない・確かめた）。契約の crate の stats の pub enum UnreflectedKind（pub const ALL = Memo・Ruling・Request・電文の名は memo・ruling・request）と pub struct LedgerStats（pub な欄 unreflected の u32・unreflected_kinds の UnreflectedCount の Vec〔pub な欄 kind と count〕・unreflected_unknown の UnreflectedKind の Vec）と pub struct UnreflectedList（pub な欄 memos・rulings・requests・どれも Reading の UnreflectedRow の Vec）と pub struct UnreflectedRow（pub な欄 id・title の String と age_s の u64 の Option）。面の crate の vocab の pub fn label（鍵の見出しの語・表に無い鍵は無いと分かる字）と、語の辞書 crates/tsuzuri-surface/vocab.json の鍵 unref:memo（258 行・欄 english・label memo）・unref:ruling（1488 行・欄 rephrase・label 裁定）・unref:request（1493 行・欄 rephrase・label 要望）。view の pub fn Screen::initial と、project の pub enum Body（Filled・Empty・Unmeasured）。fixture tests/fixtures/surface/ledger-stats.json の組 filled と empty（上の done の値）。
      形（host の部分・ledger.rs）。module の doc に、未反映の種類の見出しは語の辞書の鍵 unref: と種類の名の label で account board もここの関数で引く（行 g-kind-label）1 行を足す。kind_name の後に、pub const UNREF_KIND_KEY（字 unref:・doc は鍵が接頭と kind_name の字であること）と、pub fn kind_label（UnreflectedKind を受け、name_label に kind_name の字を渡す）と、pub fn name_label（種類の名の &str を受け、label に接頭と名を足した鍵を渡す）を置く（+13 行）。Unref・UnrefRow・UnrefList の欄と、content・panel・unref_list の値は変えない（種類の名は電文の名のまま持ち、見出しにするのは DOM で引く所だけ・着地済みの歯 ledgerblock と unrefpanel と acctproj と hacols が名の字を pin する）。
