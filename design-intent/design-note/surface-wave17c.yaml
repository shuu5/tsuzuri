    type: prose
    title: 行 g-next-acct-origin — 次の一手の link が別の origin の account board の窓を移さない
    body: |
      在りかの main は 947fb4a（計画 surface-plan v0.51）。起草と試作は f71082f（行 g-card-adopt-c の着地）で撃ち、947fb4a で確かめた（この間に変わったのは design-intent と contracts の字だけで、面の crate の字と、contracts の verify の filter の語は同じ）。
      なぜ。要件 FR1 は、project board を account board から名前つきの新しい窓で開き、既に開いていれば前面に出し、「戻る」は自分の窓を閉じて account board へ戻るとし、要件 FR11 は次の一手を 1 つ大きく出す。本番の project board の次の一手の link のうち、限度と移動（nx_a）と応答なし（nx_b）の次の手は account board の tab への相対の URL（字 ?board=account&tab=home か session と mode）を、窓の名 tz-account を target にして開く。account board が別の origin（project ごとの board の server は別の port で配る）で開いていると、既定の遷移はその窓を project board の origin の URL へ移してしまう（account board の窓が別の server の画面に替わる・席が 2026-09-28 に見つけた欠陥）。着地済みの行 g-back-note は「戻る」で同じ窓を探し、href の読めない窓を在った窓と見て前に出す判定 frame::back_how を置いた。この行は次の一手の link も同じ探し方と判定で、別の origin の窓だけ移さずに前に出す（計画 9 節の計画だけの行 g-next-acct-origin・席の決め〔2026-09-28・第 13 波 h の起草の 10 節の案・別の origin の窓では tab を替えないことを受け入れ、前に出した注記は出さない〕）。
      在りか・next.rs（write-set・454 行・build.rs が生成する pub mod で crate::project::next・結合試験は tsuzuri_surface::project::next）。host の部分の use は 15 行が crate::frame の Block・Mode・PageId・href、13 行が crate::account::windows の ACCOUNT_WIN。pub fn action（278 行・種類と対象と mode から次の手の Link・限度と移動は account の tab_href の Home・応答なしは Session）、pub fn window_of（297 行・LimitOrMove と Unresponsive は Some の ACCOUNT_WIN・ほかは None）、pub fn row_link（306 行）。wasm の target のときだけの mod dom（338 行・字 mod dom { は file に 1 度）の use は leptos の prelude の全部と super の列（BLOCK・Big・BigTitle・MISS・Mark・Next・PATH・Row・action・big_title・content・row_link・waited・window_of）ほか。fn big_view（389 行）は link を class btn primary の a（字 href=l.href と target=win）にし、fn row_view（423 行）は当たった行の link を class の無い a（同じ 2 つの属性）にする。どちらも押しを受けない（既定の遷移だけ）。file の終わりは mod dom の閉じ波括弧。
      使う物（この行は書かない・確かめた）。frame.rs の pub const BLANK（204 行・字 about:blank）と pub enum BackHow（208 行・derive は Debug・Clone・Copy・PartialEq・Eq・変種 Front・Opened・Blocked）と pub fn back_how（219 行・窓が返ったかの bool と URL の &str の Option を受け、返らなければ Blocked・about:blank なら Opened・ほか〔読めない URL の None を含む〕は Front）。account の pub mod windows の pub const ACCOUNT_WIN（24 行・字 tz-account）。board.rs の wasm の target のときだけの私的な fn back_to_board（97 行）は、window() の open_with_url_and_target に空の字と ACCOUNT_WIN を渡して窓を探し、窓の location().href().ok() と back_how で結果を決める（同じ探し方・この行は書かない）。account の board.rs の tab の押し（140 行）は e.ctrl_key() と e.meta_key() と e.shift_key() の論理和なら既定のままにする（修飾 key の同じ見方）。leptos の ev の MouseEvent（account の board.rs の 5 行が use leptos::ev; で引く）。契約の board の NextMove（pub const ALL・7 種）。
      形（host の部分・next.rs）。module の doc に、account board の窓へ飛ぶ link は押した時に窓を探し、href の読めない在る窓だけ既定の遷移を止めて窓を前に出す（行 g-next-acct-origin・窓の探し方と判定は frame の back_how）2 行を足す。15 行の use の列に BackHow と back_how を足す。window_of の後（row_link の前）に、pub enum Jump（doc は押しの手・変種 Follow の doc は既定の遷移のまま〔窓が返らない・空の窓・href の読める窓〕・Front の doc は既定の遷移を止めて在る窓を前に出すだけ〔href の読めない別の origin の窓・tab は替えない〕）と、pub fn jump（本文は字 match (back_how(returned, href), href) { の 1 つの match で、BackHow の Front と None の組だけが Jump の Front・ほかは Follow）を置く（+18 行）。
      形（DOM・next.rs の mod dom）。use に字 use leptos::ev; を足し（prelude の use の前）、super の列に Jump と jump を足す。fn big_view の a に属性 on:click=move |e| press(e, win) を足し（view の 1 行を div と a の 3 行に割る）、fn row_view の a にも同じ属性を足す（closure の本文を波括弧で包む 3 行）。mod dom の終わりに私的な fn press（e の ev::MouseEvent と win の &static str の Option を受ける・doc は窓の名の無い linkと修飾 key の押しは既定のまま・空の URL で開くので在る窓は動かない・href の読めない在る窓だけ既定の遷移を止めて前に出し tab は替えない）を置く。本文は、win が None なら return・修飾 key なら return・window().open_with_url_and_target に空の字と name を渡した値の .ok().flatten() を found・found の location().href().ok() を href・jump(found.is_some(), href.as_deref()) が Jump::Front なら e.prevent_default() と在る窓の focus（返りは捨てる）。窓が無い（空の窓が開いた）・同じ origin の読める窓・popup の許しが無く窓が返らないときは既定の遷移のまま（今の動き＝link の target の名の窓で開く）。next.rs は 454 → 501 行。frame.rs と board.rs は書かない（この行の差分で持つ）。
      決めた幅（起草の決めと席の決め）。(a) 別の origin の窓では tab を替えない（窓の URL を書くと origin が替わる・前に出すだけ）・前に出した注記は出さない（席の決め）。(b) 判定は frame の back_how の結果に URL が読めたかを足すだけで、about:blank の字の写しを next.rs に置かない（空の窓の見分けは back_how の 1 か所）。(c) 修飾 key（Ctrl・Meta・Shift）の押しは窓を探さない（新しい tab や窓で開く browser の既定のまま・account board の tab の押しと同じ 3 つ）。(d) 窓の名の無い link（window_of が None の種類）は press がすぐ返る（既定の遷移のまま）。(e) 窓を探す空の URL の open は、窓が無ければ空の窓を開き、既定の遷移がその窓で link を開く（今の動きと同じ窓の数）。
      着地済みの歯（面の crate の tests を grep で確かめ、試作で撃った・どれも直さずに通る）。next.rs の字を読む歯: nextstep_keys_one_table_in_declared_order（file の字に語の鍵 nx_a〜nx_g の literal がそれぞれ 1 度だけ・この行は鍵の literal を足さない）・nact_dom_wiring（mod dom に crate::net::read(ask::PATH) と row_link( と waited( が在る）・nxact_src_uses_action（mod dom に action( と window_of( と use_context::<HelpCtx>() と Mode::from_query( が在り、action と window_of の定義は mod dom より前）・cadopt の DOM の字（next.rs の mod dom に big_title(&next.big, g) と map::PATH と node_href( と big の題の a の字が在る）。どれも字が在ることを見るので、足すだけのこの行で通る。verify の = の 4 file はこれらの歯の file（tests/next.rs の歯 nextstep_ は contracts の verify に filter が無かったので、この行で初めて撃つ）。
      測り方・歯（tests/nxorg.rs・新しい file）。使う item は契約の crate の board の NextMove、面の crate の account::windows の ACCOUNT_WIN、frame の BLANK・BackHow・back_how、project::next の pub mod の Jump・jump・window_of。nxorg_jump_rules は上の done の 4 組と window_of の 7 種。nxorg_dom_wiring は next.rs の字を mod dom { で前と後に分け、宣言の字から次の 4 つの空白と閉じ波括弧だけの行までの本文で見る（press の字は並びの順に探す）。nxorg_names_stay_apart は自分の file の #[test] の後の fn の名を読む。試作（main の写しに当てた）で 3 本が通り、噛みを見た（読める窓でも前に出す・読めない窓でも既定のままにすると nxorg_jump_rules が、どちらかの link が押しを渡さない・修飾 key の分岐を消す・prevent_default を消す・判定を back_how に拠らず写すと nxorg_dom_wiring が落ちる）。
