      測り方・歯（tests/kindlab.rs・新しい file）。使う item は契約の crate の board の Reading・stats の LedgerStats・UnreflectedCount・UnreflectedKind・UnreflectedList・UnreflectedRow・wire、面の crate の account::projects の pub fn unref_break（結合試験から引ける・harest が引く）、project の Body、project::ledger の pub mod の UNREF_KIND_KEY・kind_label・kind_name・name_label・panel・unref_list、view の Fetched と Screen。kindlab_one_place は src の下を std の read_dir で辿り、4 つの字の在りかを file ごとの数で見る。kindlab_boards_same_words は上の done の値。kindlab_ledger_dom_words は ledger.rs の字 mod dom { より後の、宣言の字から次の 4 つの空白と閉じ波括弧だけの行までの本文で見る。kindlab_names_stay_apart は自分の file の #[test] の後の fn の名を読む。試作（main の写しに当てた）で 4 本が通り、噛みを見た（DOM の 3 か所のどれかを名のままに戻すと kindlab_ledger_dom_words が、account の projects.rs に鍵の literal の写しを置くと kindlab_one_place が、name_label が鍵を引かず名を返すと kindlab_boards_same_words が落ちる）。
      filter の語（main 947fb4a の contracts の verify の filter の語 236 を、ほかの語を部分の字として含まない 162 語に畳んだ語と、計画の後の行 g-gz の接頭辞 pgz_ と、同じノートのもう 1 つの行の接頭辞 nxorg_・この行の接頭辞 kindlab_ は並べない・164 語）は aaround_・accept_・acchold_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadl_・cadopt_・cadq_・cdorm_・cfsplit_・cgdom_・cmark_・contract_form_・cround_・csled_・cspk_・ctick_・denv_・dnedge_・dnrow_・dnskip_・ecache_・epolq_・flight_・fmark_・fprem_・frame_・fserve_・fstop_・fxpre_・g3g7_・gapspage_・gbnote_・gfix_・gfresh_・ghb_・gjst_・glabel_・gnav_・gpface_・gpill_・gpulse_・graph_・gsum_・gtuck_・gview_・hacols_・harest_・hasplit_・hbconf_・hbmark_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hdchip_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hshist_・hspage_・hspk_・hsym_・iclose_・ilink_・kcli_・klink_・launch_・lcard_・ledgerblock_・lhome_・lidle_・lresume_・lsnap_・lspark_・lstore_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・parts_・pci_・pclosed_・pfold_・pipe_・plimit_・pmisfit_・pmore_・pquest_・pqueue_・project_・ptitle_・punmap_・pwhole_・qblock_・qgate_・qkey_・question_・relay_・rhold_・runsdoc_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・stcli_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_・pgz_・nxorg_ で、新しい歯の名から先頭の kindlab_ を除いた字は、このどれも部分の字として含まない（例 kindlab_frame_x・kindlab_next_x は不可）。歯の file は同じ 164 語を const FILTERS に持つ。畳んだ語で足りる（着地済みの filter のうち歯の名そのものと、server_ と stage_ で始まる接頭辞は、並べた語を部分の字として含む）。
