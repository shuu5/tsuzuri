      決めた幅（起草の決め）。(a) 語は見本 mock v3 のとおり memo・裁定・要望 のまま（計画の行の what の問い〔unref:ruling の label を ほかの鍵が 裁定 を言い換える字 あなたの決定 に揃えるか〕は、見本の 2 つの board と語の辞書の鍵 u_kind の注釈〔memo か 裁定 か 要望〕が 裁定 と言うので揃えない）。そのため語の辞書 vocab.json は書かない（後の行 c-dn-edges・h-acct-spark・c-pipe-ci と vocab.json で重ならない）。揃えるなら後の行で vocab.json の 1 か所と、歯 harest_kind_labels・harest_unref_kinds と kindlab_one_place・kindlab_boards_same_words の期待の字を替える。(b) 移す先は、account board が Unref・kind_name ほかを既に use で引く面の ledger の module（新しい module を作らない・kind_name の隣）。(c) UnrefKinds は account board の未反映の 2 段目だけの型なので account/projects.rs に残す（計画の files の見込みの字〔kind_label と UnrefKinds を移す〕から UnrefKinds を外した）。(d) project board の種類の名の欄を持つ型（Unref・UnrefRow・UnrefList）は変えず、DOM で name_label を引く（型を替えると着地済みの歯 4 file の期待の字が動く）。(e) 見出しは語の辞書の label だけで、経験者の mode でも内部の名を足さない（account board と同じ）。(f) 古い path（account の projects の kind_label と UNREF_KIND_KEY）は再公開しない（写しの path を残さない・着地済みの歯 hasplit_callers_use_cards が projects.rs に字 pub use が無いことを見る）。
