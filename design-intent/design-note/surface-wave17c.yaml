sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      project board の面の小さな直し 2 つ。
      g-kind-label は、未反映の種類（memo・裁定・要望）の見出しを 2 つの board で同じ語にする。見出しは語の辞書の鍵 unref: と種類の名の label で引き、引く関数は面の ledger の module の 1 か所に置く。
      project board の未反映の一覧の種類の欄と、指標の段と一覧の読めない種類は、今は内部の名（ruling・request）をそのまま出しているので、同じ関数の label にする。
      g-next-acct-origin は、次の一手の限度と移動と応答なしの link（窓の名 tz-account を target に持つ）を押した時に窓を探し、別の origin で開いた account board の窓を project board の origin へ移さず前に出す。
      窓が無い・空の窓・同じ origin の窓・修飾 key の押しは今の動きのまま。別の origin の窓では tab を替えず、注記も出さない。
      語の辞書・stylesheet・契約と中核と境界の crate・外の依存は変えない。
