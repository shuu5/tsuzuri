  - n: 5
    type: prose
    title: 行 g-summary — 一覧の要約と節点の頁の 2 つの概要と出所の行と card の概要を電文から写す
    body: |
      なぜ。要件 FR15 は、節点ごとの概要（非エンジニア向けとエンジニア向け）を設計文書の plain の欄と台帳の要約の欄に置き、面は写すだけで生成しないとする。規則の行 R-19（文の予算）は hover の card を 4 行 以下（1 行 36 字 以下）とし、要件 FR14 も hover の card は 4 行（1 行 36 字）と「詳しく」とする。電文は概要を全文で運び、切るのは面（計画 surface-plan の 3 節の席の決め）。見本 mock v3（判断の記録 ADR-7 の承認で確定した仕様・repo の写しは docs/design/mock3）は、地図の一覧の面の行に要約の欄を、節点の頁に出所の file と行と 2 つの概要の箱を、節点の hover の card の 3 行目に id と概要の短い字を、詳しくに長い概要を折った行と出所の全部の字を出す（下の 見本の字）。本番の面は 3 か所とも要約なし（mapview の list.rs の NO_GIST・project の node.rs の NO_SUMMARY）で、出所に行の番号を出さない。持ち主の指摘（t3-hub.1（裁定 id = user 2026-09-28T00:4xZ）・節点に指を置いても中身が出ない）の調べも、card の概要の欄が固定の要約なしであることを、この行の範囲として挙げた。この行は、電文の節点の 3 つの欄を 3 か所に写し、見本の字数で切る。字は作らない（無い欄は見本の要約なしと、file が在って行が無いときの行は測れていないの形で出す）。
      この行が持たないもの。要件 FR15 の最後の文（要約の無い節点は床が数える）と受入基準 AC12 は後の行 c-summary-ledger が持ち、この行は満たしたと言わない。台帳と走行の節点の概要（電文に無い・後の行 c-summary-ledger）と、一覧の更新の時刻の列（後の行 c-updated）も持たない。グラフの面と表の面と近傍の図の箱には概要を出さない。card の経験者向けの行（見本の種類の内部の名と要約の出所）は出さない。
      在りか（電文・main bf21e14 で確かめ、2bc9aa0 と d927a57 で確かめ直した・その間の着地 3 本〔f-mark-serve・f-stop・c-summary-wire〕は境界の crate と中核の歯と plugin の dir だけを書き、後に着地した第 7 波の 6 行〔g-card-adopt-a・g-tip-expert・g-mode-store・h-cards-proj・c-acct-thr・c-q-blocking〕は、契約の型の crate の graph.rs と tests/fixtures/surface の下と、この行が書く 6 つの file と、読む hover.rs・graph.rs・band.rs・compact.rs・vocab.json・style.css を書いていない）。着地済みの行 c-summary-design（t3-hub.52.25・main bf21e14）は、契約の型の crate の src/graph.rs の pub struct GraphNode に、欄 title の後に pub な欄 line（u32 の Option・所属 file の中で id が書かれた行の番号・1 から数える）・plain（String の Option・非エンジニア向けの概要）・eng（String の Option・エンジニア向けの概要）を足した。3 つとも serde の default の属性を持ち、鍵の無い電文の字も無しに読める。GraphNode は GraphDoc の欄 nodes と AroundRow の欄 node の中身で、derive は Debug・Clone・PartialEq・Eq と serde。契約の型の crate の pub mod wire の pub fn decode（&str を受け Deserialize の型の Result）で fixture の字を読める。着地済みの行 c-summary-wire（t3-hub.52.26・main 2bc9aa0 で確かめた）は、server と tz graph が folio を --summary でも撃ち（境界の src/server/board.rs の私的な fn built が build の後に中核の add_summary を撃ち、pub fn graph と view と around がその値を使う）、中核の add_summary で写した行と概要を、口 GET /api/graph の電文の nodes と、GET /api/graph/view と GET /api/around の本文の節点に載せる。写るのは id と file の同じ要約の行が在る設計の節点だけで、台帳と走行の節点と、--summary を読めない folio の server の節点は 3 つとも null のまま。面の地図の頁（project の map.rs が口 /api/graph を読む）の一覧の面と圧縮の面は GraphDoc から、節点の頁（project の nodearound.rs が口 /api/around を読む）は AroundDoc から組む。この行の歯は口を撃たず、fixture の電文の節点の欄に歯の中で値を代入して見る（本番の画面に行と概要が出るのは、この行の着地の後に面を組み直したとき）。実物（main の design-intent を席の folio 0fb780e の --summary で読んだ・確かめた）では、設計の節点 239 の全部が行を持ち、plain と eng の両方を持つ節点が 92・eng だけが 138・どちらも無いのが 9 で、概要の字数は最大 448 字・20 字を越える節点が 218、改行を含む plain が 13 在る。
      在りか（widgets の nodecard・write-set・着地済みの行 g-card-node が置いた・host でも組む・確かめた）。src/widgets/nodecard.rs は crate::mapview の state・band の band_of と kind_key・list の NO_GIST（字「要約なし」）と NO_STATE、crate::vocab の label、crate::widgets::hover の Card と ELLIPSIS を use し、pub fn short_path（&str を受け String・最初の「・」より前の字を斜線で区切った片が 3 つ以上なら「…/」と末尾の 2 片をつないだ字、2 つ以下ならその字）と pub fn node_card（契約の &GraphDoc と &GraphNode を受け Card）と pub fn card_of（&GraphDoc と id の &str を受け Card の Option・nodes の前から同じ id の最初の節点の node_card の値）を持つ。今の node_card は、title を節点の title の空白を畳んだ字（空なら id）、kind を種類の語と「 · 」と帯の名と「 · 」と状態の字（無ければ NO_STATE）、value を id と空白 1 つと NO_GIST、src を節点の file（無ければ band.rs の Band の path）を short_path に渡した字、more を src がその元の字と違えば元の字 1 つだけにする。帯の path は、条と規範文が design-intent/constitution.yaml、判断の記録が design-intent/adr/ADR-n.yaml、beads が .beads/issues.jsonl、pipeline が <state dir>/fleet/events.jsonl。node_card は list.rs の row と compact.rs の tag と articles から呼ばれる（compact.rs はこの行は書かず、札の card は node_card の値のまま変わる）。上は main 2bc9aa0 の形で、この行は同じノートの前の行 g-card-around の着地の後に流す。g-card-around は node_card の組みを card_for（pub fn・契約の &GraphNode と状態の字の &str の Option を受け Card を返す・node_card は card_for に mapview の state の値を渡す 1 行・同じ行の pub fn view_cards も眺めの節点ごとに card_for を呼ぶ）に割り、node_card はそれを呼ぶだけになり、字は 1 字も変えない（g-card-around の行の決まり）。card_for は近傍の電文の AroundRow の節点と status からも card を組める（GraphDoc を要らない）。card_for の名と形は g-card-around の起草者の知らせと起草の file で確かめた（流す前に席が着地の字で確かめ直す）。g-card-around の歯 cround_card_split_same は、graph-doc.json の全部の節点と、P-1 に plain と eng と line 12 を置いた写しで、node_card の値が card_for に state の値を渡した値と同じことを見るので、この行の決まりは node_card でなく card_for に置く（node_card だけを直すとその歯が落ちる）。cround_ と cgdom_ の歯は card の title と kind を字で見るほかは card_for・node_card・view_cards の値を互いに比べるだけで、value と src と more の字を決めない（起草者の知らせ）。
