      節の字（歯の中で組む・fixture の file は足さない）。G_LONG は x の 30 字と「、」と y の 10 字をつないだ 41 字（折ると x の 30 字と「、」の行と y の 10 字の行・34 字ずつに切るだけの誤った折り方なら 1 行目は x の 30 字と「、」と y の 3 字になる）。G_BARE は z の 40 字（句切りの字が無い・折ると z の 34 字の行と z の 6 字の行）。「画面は 2 つです。」は 10 字で、6 字で切ると「画面は 2」と「…」。
      測り方。新しい歯は tests/gsum.rs に置き、名を gsum_ で始める。歯は CARGO_MANIFEST_DIR から ../../tests/fixtures/surface/graph-doc.json と around-doc.json を読み、wire の decode で GraphDoc と AroundDoc にする。値を替えた電文は、fixture の値を写して、節点の line・plain・eng・file への代入で作り（GraphNode を struct の字で組まない）、id を替えた節点は fixture の P-1 の節点を clone して欄 id に代入する。gist・card_for・node_card・Card の rows・listing・head・summary は host で呼ぶ。近傍の card の歯は、around-doc.json の中心の行の節点と status を card_for に渡す。gsum_dom_text は CARGO_MANIFEST_DIR から src/mapview/list.rs と src/project/node.rs の字を読み、字 mod dom { より後を DOM の部分として字を探す（要約の在る行と箱だけが data-t を持つことと、印を見出しの前に置くことは上の形で決め、DOM が組めることは xtask の surface-build で見る）。自分の名の歯は tests/gsum.rs の字を読み、test の属性の行の次の fn の名を全部集め、名の数が 9 以上であることと done (11) を見る。
      filter の語（着地済みの行と第 3 波から第 8 波の行の verify の語・この行の接頭辞 gsum_ は並べない・106 語）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・qgate_・hcard_・ntime_・ptitle_・ncard_・hsym_・smore_・lcard_・aaround_・hruling_・sxaxis_・plimit_・bport_・fstop_・nsum_・nsumw_・fmark_・fserve_・cadopt_・tipx_・hcsess_・hcproj_・sesplit_・mstore_・athr_・qblock_・wsteady_・nstall_・pfold_・uword_・cround_・cgdom_・csled_・lhome_・shb_・ghb_・nact_・aord_・mtree_ で、新しい歯の名から先頭の gsum_ を除いた字は、このどれも部分の字として含まない（例 gsum_graph_x・gsum_nodepage_x・gsum_frame_x・gsum_ncard_x は不可）。名は done に書いた gsum_gist_pick_rules・gsum_card_value_line・gsum_card_src_line・gsum_card_more_rows・gsum_list_gist_cut・gsum_node_boxes・gsum_node_src_text・gsum_dom_text・gsum_own_names_clean（どの語も含まない）。
      依存。depends は同じノートの前の行 g-card-around（nodecard.rs の node_card を card_for に割る・この行はその関数に概要と行の決まりを置く・席の決めの順は g-card-around → g-summary）。電文の 3 つの欄は着地済みの行 c-summary-design（main bf21e14 で確かめた）、口の配線は着地済みの行 c-summary-wire（t3-hub.52.26・main 2bc9aa0 で確かめた）、nodecard.rs の node_card と card_of は着地済みの行 g-card-node、node.rs の今の形は着地済みの行 g-title が置いた（どれも main で確かめた）。書く file が重なる行とは計画の 5 節の順に流す（mapview の list.rs は g-card-node → g-summary → c-updated、project の node.rs は g-title → g-summary、widgets の nodecard.rs は g-card-node → g-card-around → g-summary）。g-card-around の歯は card の value と src と more の字を決めず、g-card-around は tests/ncard.rs を書かない（起草者の知らせ）。着地済みの第 7 波の行 g-card-adopt-a（main d927a57 で確かめた）は nodecard.rs を書かず、pipeline.rs の node_hover と next.rs の big_title から card_of を呼び、歯 cadopt_（cadopt_node_hover_rules・cadopt_big_title_rules・cadopt_columns_take_node_cards）は card_of の値の title と kind と、card_of と node_hover の値そのものとの比べだけを見る。この行は card_of の名と引数と返りと、title と kind の決まりを変えず、fixture の節点は概要と行を持たないので、cadopt_ の歯は崩れない。ほかの第 7 波の行（着地済みの g-tip-expert・g-mode-store・h-cards-proj・c-acct-thr・c-q-blocking と、まだ着地していない h-cards-sess・g-seat-split・e-watch-steady）は、この行の 6 つの file のどれも書かない（着地済みの 5 行は main で、まだの 3 行はノート surface-wave7 の write-set で確かめた）。第 8 波のほかの行（c-next-stall・g-next-rows・g-pipe-fold・g-unref-word・c-summary-ledger・g-ledger-home・e-seat-hb・g-seat-hb・h-acct-order と、同じノートの g-card-graph と g-map-tree）の書く file は、この行の 6 つの file と重ならない（起草の file の write-set で確かめた・同じノートの g-card-graph と g-map-tree は nodecard.rs を置き場だけの = で持ち、歯で card の value と src と more の字を決めない）。外の依存は足さず、Cargo.toml・vocab.json・style.css・fixture・hover.rs・graph.rs・band.rs・compact.rs・ask.rs・board.rs は触らない。
  - n: 6
    type: prose
    title: 行 g-map-tree — 地図に設計の木と台帳の木を足す
    body: |
      なぜ。持ち主は project board を見て、ホームの台帳の block に閉じた bead まで並ぶことと、設計と台帳の全体を葉までたどれる図が地図に無いことを指摘した（t3-hub.1（裁定 id = user 2026-09-28T00:4xZ）・逐語の抜きは t3-hub.1 の notes）。席は問い t3-hub.52.32 を置き、持ち主は束で案 A を選んだ（t3-hub.52.32（裁定 id = t3-hub.52.32:20260928T0107Z-1）・束 batch:20260928T0107Z-1）。案 A は、地図に木の形（入れ子の一覧）の全体図を 2 つ足し、今の 4 つの面と切り替えて見られるようにする。設計の木は 帯 → 条 → 規範文・要件 → 受入基準・規則の行・判断の記録・設計ノート → 行、台帳の木は epic → task → run・問い → 裁定・memo で、どちらも葉までたどれ、閉じた項目は既定で畳み、各項目は節点の頁（?page=node&id=…）へ飛び、節点の hover の card を出す。今の畳んだグラフの面（中核の VIEW_CAP の 40 で切る）は要約として残す。問い t3-hub.52.31 の答え（t3-hub.52.31（裁定 id = t3-hub.52.31:20260928T0105Z-1））は、ホームの台帳の一覧から閉じた bead を出さず（計画の行 g-ledger-home）、地図には閉じた物を含む全件を出すと決めた。台帳の木がその全件の置き場で、閉じた bead は既定で畳んだ項として必ず出る。
      見本 mock v3（docs/design/mock3・判断の記録 ADR-7 の承認 user 2026-09-26T07:51Z で確定した仕様）の地図は圧縮・一覧・グラフ・表の 4 面で、木の面を持たない。この行は、見本の一覧の項の形（ui.js の itemNode・li の中に印の span と、class ttl と href と属性 data-key を持つ a〔中に class nid の id と題〕、入れ子は class nest の li の中の class items の ul）と、畳みの形（details の class fold と summary・style.css の details.fold の規則）で木を描く。要件 FR5 の地図の面は、持ち主の裁定 t3-hub.52.32（裁定 id = t3-hub.52.32:20260928T0107Z-1）に従い、圧縮・一覧・グラフ・表の 4 面に設計の木と台帳の木を足した 6 面とする（srs の FR5 の字は席がこの行を流す前に 4 面から 6 面に直す・この行は srs を書かない）。
      在りか（main 2bc9aa0 で確かめ、d927a57 で読み直した・その間に着地した第 7 波の 6 行〔g-card-adopt-a・g-tip-expert・g-mode-store・h-cards-proj・c-acct-thr・c-q-blocking〕は、この行が書く file と、読む file のうち mapview の下・project の map.rs と nodearound.rs・kit.rs・frame.rs・vocab.rs・hover.rs・nodecard.rs・vocab.json・style.css・契約の graph.rs・中核の graph/build.rs・fixture の surface の下・tests の mapkeys.rs と mapview.rs を書いていない・widgets の help.rs は g-tip-expert が経験者だけの注釈の関数を足したが、note と Note と Line と Inline の形は変わっていない）。
      mapview の mod.rs（src/mapview/mod.rs・write-set・着地済みの行 g-map が置き g-link-map と g-graph が書いた・crate::mapview・host でも組む）は、pub mod around・band・compact・graph・list・table の 6 つの宣言（target の cfg で囲まない）と、pub enum View（Compact・List・Graph・Table・derive は Debug・Clone・Copy・PartialEq・Eq・Hash）と impl View の pub const ALL（[View; 4]・この順）・pub fn name（compact・list・graph・table）・pub fn key（view_compact・view_list・view_graph・view_table・tab の語の鍵）・pub fn from_query（URL の query の view の値が ALL のどれかの name と同じならその面、無い・知らない値は Compact）、pub const VIEW_PARAM（字 view）、pub fn with_view（query の字と View を受け、view の値をその name に置き替えた query の字・無ければ末尾に足す・ほかの値と順はそのまま）、unread_reasons・kinds_by_id、pub fn state（&GraphDoc と &GraphNode を受け、電文の寿命の &str の Option・帯が beads なら電文の beads の属性の status、pipeline なら runs の属性の stage、ほかと属性の無い節点は None）、pub fn is_open（&str の Option を受け bool・open と in_progress で真）、pub fn open_question（問いの種類で state が open なら真）、pub fn shape_class（字 shape と空白と帯の class と、is_open が偽なら空白と fill）、pub fn natural（id の自然な順の Ordering・数の並びは数として比べる）、param・set_param・encode・decode を持ち、wasm の target のときだけの mod dom に current・navigate・pub fn band_chip（Band を受け AnyView・class が bchip と帯の class で属性 data-term が帯の語の鍵の span）を持って pub use dom::{band_chip, current, navigate}; で出す。名 View の宣言は面の src にこの 1 つ。View を match するのは project の map の mod dom の中身の 1 か所で、mapview の list は View の List の name だけを使う（grep で確かめた）。
      project の map（src/project/map.rs・write-set・着地済みの行 g-map と g-map-keys が書いた・build.rs が生成する crate::project::map・host でも組む）の host の部分は BLOCK（id map・heading map・class panel）・PATH（字 /api/graph）・PATHS（[PATH]）・FOLDS（空）・REASON・pub fn doc（Fetched の参照を受け Result の GraphDoc と &'static str）・pub fn body・pub fn tab_step（View と key の &str を受け View の Option・View の ALL の中の位置から ArrowRight は次・ArrowLeft は前で、端は反対の端へ回り、ほかの key は None）。wasm の target のときだけの mod dom の view は、net の read で PATH を読んで doc を Memo に置き、URL の query を RwSignal の search に置き、tab を View の ALL から組み（role tab の button・id は字 tab- と name・語は label に key を渡した字・keydown で tab_step と prevent_default と focus）、中身は search の View で match して Compact は compact の view(d)・List は list の view(d, search)・Graph は graph の view(search)・Table は table の view(d, search) を返す。見出しの横の数は電文の nodes の数。
      地図の帯（src/mapview/band.rs・置き場だけの =・host でも組む）の pub enum Band（Constitution・Rules・Adr・Srs・DesignNote・Beads・Pipeline・derive は Debug・Clone・Copy・PartialEq・Eq・PartialOrd・Ord・Hash）と pub const ALL（この 7 つの順）・pub fn name（constitution・rules・ADR・SRS・design-note・beads・pipeline）・pub fn key（字 b: と name）・pub fn source（beads は GraphSource の Ledger・pipeline は Runs・ほかの 5 つは Design）、pub fn band_of（NodeKind を受け Band・種類の表 KINDS の 1 か所で決める・条と規範文は constitution、規則行は rules、目的と要件と非機能要件と受入基準と制約と登場人物と出力は SRS、判断の記録は ADR、note-row は design-note、epic と task と memo と question と ruling と receipt と policy は beads、run は pipeline）、pub fn unread_reason（GraphSource を受け &'static str の 1 行・Design に「設計の索引が読めず、この帯の節点がまだ分からない」・Ledger に「台帳が読めず、この帯の節点がまだ分からない」・Runs に「器の event の記録が読めず、この帯の節点がまだ分からない」）。
