      形（DOM・graph/dom.rs・字は次のとおりに決め、歯 cgdom_wiring_text がこの字で見る）。use に crate::widgets::hover の Card と attach と delegate と leaves、crate::widgets::nodecard の view_cards を足す（書き方は問わない）。Model に欄 cards（String から Card の BTreeMap）を足す。panel は Model に v を動かす前に let cards = view_cards(&v.nodes); で眺めの節点の card の map を組み、Model の cards にその写しを置き、let hc = delegate(); で委ねの口を引く。hover の closure の後、out の前に let over = move |ev: ev::MouseEvent| { … } を置き、中で node_key(ev.target()) の鍵 k の card を model.with_value(|m| m.cards.get(&k).cloned()) で引いて、Some の card なら hc.show(&ev, card) を呼び、その後に hover(ev.target()) を呼ぶ（over は固定を見ない）。out は最初に、leaves(node_key(ev.target()).as_deref(), node_key(ev.related_target()).as_deref()) が真なら hc.leave(&ev) を呼び、その後に今の中身を置く。図の div の属性は on:mouseover=move |ev| hover(ev.target()) を on:mouseover=over に替え（字 on:mouseover=over on:mouseout=out の並びになる）、ほかの受け手は残す。chain_view は cards の参照を受け、行ごとに cards.get(&r.id) の写し（無ければ Card の既定）を card とし、題の a を、字 <a class= と引用符で囲んだ ttl と空白と href=href と空白と use:attach=card と閉じ山括弧の tag で描く（中の nid の span と題の span と印と子の数の aside は変えない）。panel の後の chain_view の呼びは bands と cards の参照と mode を渡す形にする。view_cards の map の鍵は眺めの電文の nodes の id の全部で、svg の data-key と chain の行も nodes から作るので、引きは外れない（歯 cgdom_view_cards_cover が fixture で見る）。hover・paint・click・open・key・拡大と drag・固定の帯・凡例・数の行は変えない。新しい class と語の鍵と引用符で囲んだ /api/ の字は足さない。
