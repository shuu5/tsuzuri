      pub fn parent_end(edge_type: EdgeType, from: NodeKind, to: NodeKind) -> Option<EdgeEnd> は、NESTS の edge_type が同じ行について、契約の basis_end に 3 つを渡した端を親の端とし、その端の種類が行の parents に在り、もう一方の端の種類が行の children に在ればその端の Some、ほかは None を返す。親の端を basis_end で決めるので、in-article の両向き（条から規範文なら From・規範文から条なら To）と verify.ac（From）と verifies（To）の対はどちらの向きでも同じ節点が親になり、parent-child（子から親へ）・answers（裁定から問いへ）・run_of（走行から bead へ）は To が親になる。
      pub enum Head（derive は Debug・Clone・PartialEq・Eq）は Band { band: Band, count: usize }（設計の木の 1 段目の帯の項・count はその帯の木の節点の数）・Note { note: String, count: usize }（design-note の帯の下の設計ノートの項・note は節点の id の最初の「#」より前の字・count は束ねた項の数・設計ノートそのものは節点でないので頁と card を持たない）・Node(Item)（節点の項・kit の Item）。pub struct Branch { pub head: Head, pub open: bool, pub kids: Vec<Branch> }（open は開き閉じの記録に値が無いときの初めの値）と pub struct Forest { pub unread: Vec<&'static str>, pub items: Vec<Branch> }（どちらも derive は Debug・Clone・PartialEq・Eq）。
      pub fn forest(doc: &GraphDoc, tree: Tree) -> Forest の決まり（電文のほかは読まない）。(a) 木の節点は、電文の nodes のうち band_of の帯が tree の bands に在り、その帯の source が電文の unread に無い節点（同じ id が 2 つ在れば前の 1 つ）。(b) unread は GraphSource の ALL の順に、電文の unread に在り、tree の bands のどれかの帯の source である出所ごとに unread_reason の字を 1 つ置く。(c) 親子は、電文の edges の辺のうち from と to の両方が木の節点で、parent_end に辺の型と from の種類と to の種類を渡した値が Some の辺の、その端の節点を親・他方を子とする組（同じ組は 1 つ・in-article の両向きの 2 本や verify.ac と verifies の対は 1 組）。(d) 並べ方は、節点の種類（NodeKind の Ord）が先、同じ種類は id の mapview の natural の順。(e) 親の無い節点を根にし、根から子を (d) の順にたどって項を組む。たどっている道の上に在る節点は子にしない（親子の輪で止まる）。どの根からもたどれない節点（輪の中の節点）が残れば、残りのうち (d) の順で最初の節点を根に足してたどり、残りが無くなるまで繰り返す。1 段目は根の全部を (d) の順に並べる。親を 2 つ持つ節点（2 つの要件の受入基準など）は、どちらの親の下にも同じ項を置く。(f) 節点の項は、head が Node の Item（shape は mapview の shape_class・alert は open_question・id は節点の id・title は節点の題を title36 に渡した字・aside は空の字）、kids はたどった子の項、open は kids が空でなく、is_closed に mapview の state の値を渡した値が偽のときだけ真（閉じた項目だけを畳む・持ち主の案 A の字は閉じた項目を既定で畳むと言い、持ち主は葉まで見える木を求めたので、席は閉じていない項目を開いて出すと決めた）。pub fn is_closed(state: Option<&str>) -> bool は、字が closed（閉じた bead）か rejected か superseded（却下と置き換えの設計の項目）の Some で真、ほかの字と None で偽を返す。電文は設計の節点に状態を載せず、mapview の state は設計の帯の節点に None を返すので、設計の項目は子が在ればどれも開いて出る（設計の節点の状態を電文と state に載せる後の行が来れば、同じ is_closed で却下と置き換えの項目が畳まれる）。台帳の木は閉じた bead の枝だけが閉じて出て、open・in_progress・blocked・deferred の bead は子が在れば開いて出る（走行は子を持たない）。(g) Ledger の items は (e) の 1 段目の項（台帳の木は beads と pipeline の 2 つの帯をまたぐので帯の項を置かない・走行は親の bead の下に入り、親の無い走行と、問いにつながらない裁定と、受けと方針は 1 段目に並ぶ）。(h) Design は、unread が空でなければ items は空。空なら bands の順に 5 つの帯の項（head が Band・count は木の節点のうち band_of がその帯の節点の数）を置き、kids は 1 段目の項のうち節点の帯がその帯の項（(d) の順のまま）とし、design-note の帯だけは、id に「#」を持つ項を最初の「#」より前の字ごとに束ねた Note の項（note の natural の順・count は束の項の数・kids は束の項の順のまま・open は真〔設計の項目で、束の項は 1 つ以上〕）に替え、「#」を持たない項を Note の項の後に置く。帯の項の open は kids が空でないとき真。
      pub fn fold_key(head: &Head) -> String は、Band に字 tree:band: と Band の name、Note に字 tree:note: と note、Node に字 tree:node: と Item の id をつないだ字を返す（開き閉じの記録の鍵・同じ節点が 2 か所に出れば同じ鍵で開き閉じを分ける）。
      設計ノートの枝。c-dn-rows が着地するまで電文に note-row の節点は無いので、design-note の帯の項は count 0 で kids の無い項になり、帯の chip と 0 の数だけを出す（圧縮の面の 0 件の帯と同じ・要件 NFR2 の 0 件）。c-dn-rows の後は、この行の決まりのまま、文書ごとの Note の項の下に行の項が入る（面の直しは要らない・fixture の 2 つの note-row の節点で歯が見る）。
      形（DOM・tree.rs の mod dom の中・字は次のとおりに決め、歯 mtree_dom_text がこの字で見る）。host の部分に wasm の target の cfg を付けた pub use dom::view; を置き、wasm の target のときだけの mod dom（字 mod dom { は file に 1 度）に pub fn view(doc: &GraphDoc, tree: Tree, search: RwSignal<String>) -> AnyView を置く。view は、nodearound の mode_of に search を渡して mode を引き、forest(doc, tree) の値を組み、電文の写しを 1 つ StoredValue に置き、let hc = delegate(); で委ねの口を引く。over（move |ev: ev::MouseEvent|）は、事件の的から closest で属性 data-key を持つ最も近い a の祖先を引いてその data-key の字 k を読み、電文の写しと k を card_of に渡した値が Some の card なら hc.show(&ev, card) を呼ぶ。out は、leaves に的の鍵と related_target の鍵（同じ引き方）の as_deref を渡した値が真なら hc.leave(&ev) を呼ぶ。unread の理由ごとに unmeasured の行を置き、unread も items も空なら class empty の div に label に tree の view の key を渡した語と class num の b の 0 を置く（圧縮の面の 0 件の帯と同じ形）。items は 1 つの ul に入れ、その開きの tag は字 <ul と空白と class と等号と引用符で囲んだ items と空白と on:mouseover=over on:mouseout=out と閉じ山括弧をつないだ字にする。card はこの 1 組の受け手だけで出し、項ごとに attach の directive を付けない（描く時に項ごとの Card を組まず、指が入った項の card だけをそのとき組む・歯が tree.rs の全部に字 use:attach が無いことを見るので、注にもこの字を書かない）。
      項の描き方（私的な再帰の関数・名は問わない）。頭は、Band なら band_chip(band) と class chip num の span に count、Note なら class nid の span に note と class chip num の span に count、Node なら印の span（class は Item の shape・alert なら style に ALERT_STYLE・aria-hidden）と題の a（開きの tag は字 <a と空白と class と等号と引用符で囲んだ ttl と空白と href=href と空白と data-key= で始まり、href は frame の node_href に id と mode の値を渡した字を返す closure、data-key は Item の id・中に class nid の span の id と空白と属性 data-t の span の題）と、kids が在れば class chip num の span に kids の数。kids の無い項は class の無い li の中に頭を置く。kids の在る項は、let (open, record) = fold(fold_key(&b.head), move || initial);（initial は Branch の open）で記録から開き閉じを引き、let shown = RwSignal::new(open()); を置き、toggle は event の的の属性 open の有無を shown に置いてから record に event を渡す closure にし、字 <li と空白と class と等号と引用符で囲んだ nest と閉じ山括弧の li の中に、字 <details と空白と class と等号と引用符で囲んだ fold と空白と prop:open=open と空白と on:toggle=toggle と閉じ山括弧の details を置き、summary に頭を、その後に move || shown.get().then(|| …) の形で、開いている間だけ class items の ul に子の項を組む（閉じると子の DOM を外し、開くたびに組む）。題の a は summary の中に在り、a を押すと節点の頁へ飛び、a の外の summary を押すと開き閉じする。
      project の map.rs の mod dom の中身の match に、View::Design => tree::view(d, Tree::Design, search) と View::Ledger => tree::view(d, Tree::Ledger, search) の 2 つの腕を足す（use に mapview の tree と Tree を足す・書き方は問わない）。tab と keydown と見出しと数は変えない（tab は View の ALL から組むので 6 つになり、矢印の key の輪も tab_step が View の ALL で回る）。mapview の mod.rs と map.rs の module の頭の注の 4 面の字は 6 面に直してよい（字の歯は無い）。
