sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      project board の hover の card と地図を見本 mock v3 と持ち主の指摘に揃える第 8 波の前半。
      hover の card の委ねの口と card を組む関数を割り、近傍図とつながりの一覧に card を付け（g-card-around）、地図のグラフの見方にも付け（g-card-graph）、電文の節点の要約を card と地図の一覧と節点の頁に写す（g-summary）。
      地図に設計と台帳の 2 つの木の面を足し、閉じた項目だけを既定で畳む（g-map-tree・裁定 t3-hub.52.32）。
      未反映の注釈の字を project board で意味の通る字に替え（g-unref-word）、pipeline の開いた列を畳む button を足す（g-pipe-fold）。
      外の依存は足さない。どの行も計画 surface-plan の 4 節の行と同じ file と依存を持つ。
