      着地済みの歯（直さずに通るもの・tests の下の全部を grep で確かめた）。ncard_short_path_rules は short_path と widgets の mod.rs の字を見る（変えない）。ncard_rules_on_changed_docs は file を無しにした節点の src と more を見て、file の無い節点の出所の全部の字は帯の path のままで行の字を足さない。ncard_card_of_every_node は card_of と node_card の一致と、fixture の全部の card の kind・value・src が 36 字以内であることを見る（fixture の節点は概要と行を持たないので value と src は今のまま）。ncard_tags_and_rows_carry_cards は compact の札と listing の行の card が card_of の値であることを見る（Row に欄を足しても card は node_card の値のまま）。ncard_dom_wiring は list.rs の DOM の部分の題の a の tag が use:attach=r.card.clone() と閉じ山括弧で終わることと board.rs の 2 つの字を見る（この行はその tag と board.rs を変えない）。nodepage_summary は fixture の中心 FR1（概要を持たない）の summary の 2 つの箱の key が summary_plain と summary_eng で、text が NO_SUMMARY と等しく、class が字 sumbox none であることを見る。text を String にしても String と &str の比べは組めて、値は今のまま。nodepage_keys_fixture_and_deps は語の鍵（summary_plain・summary_eng・src ほか）と fixture の大きさと面の crate の [dependencies] の名が tsuzuri-contract だけであることを見る（どれも触らない）。ほかの nodepage_ の歯は近傍の図と畳みと頁の状態の関数を見る。frame_classes_are_in_stylesheet は src の全部の file の、class と等号と引用符で始まる字の class と、node の head の shape と帯の class と、node の summary に around-doc.json の中心を渡した箱の class（sumbox none のまま）を集めて stylesheet と照らす。足す class の字は list.rs の gist だけで、style.css に在る。frame_no_heading_words_in_code は src の全部の file に、非 ASCII の見出しの語を引用符で囲んだ字が無いことを見る。足す literal「（行は測れていない）」は見出しの語でなく、引用符で囲んだ字「測れていない」も含まない。frame_one_module_per_block は node.rs の字 id と引用符の node を見る（変えない）。mapview_classes_and_keys_exist は map.rs と mapview の下の 8 つの file の、class と等号と引用符で始まる字に gist と none を含む 29 の名が在り stylesheet に在ることを見る（list.rs の gist none の span は残る）。mapview_ のほかの歯と mlink_list_title_is_anchor（list.rs の DOM の部分の node_href( と題の a の字）と mlink_hrefs_open_same_id は listing の id と数と字を読み、Row の欄を足しても変わらない。ptitle_wiring_text は node.rs の DOM の部分の字 PageSubject・kept_subject(・context を見る（変えない）。hsblock_ と hsderive_consts_match_note は node.rs の BLOCK と PATHS と FOLDS を見る（変えない）。steady_details_use_fold_record は node.rs の details の tag と fold( の呼びの数を見る（