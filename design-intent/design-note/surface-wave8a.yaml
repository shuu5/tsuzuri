    type: prose
    title: 行 g-card-around — つながりの近傍の図の節点と一覧の題の節点の card（hover の層の委ねの口と card_for）
    body: |
      なぜ。要件 FR14 は hover の card を 4 行（1 行 36 字）と「詳しく」と決め、card を出す要素を頁を持つ節点の札・圧縮された cell・記号だけの要素の 3 種に限り、pointer の右に出し、要素を出て 150 ミリ秒の猶予の間に card の方向へ動いたときだけ残すと決める。見本（docs/design/mock3・判断の記録 ADR-7 の承認 user 2026-09-26T07:51Z で確定した仕様）の ui.js の CARD_SHOULD の a の selector は、節点の頁（bead.html と query の id）への a の要素の全部と、図の節点の g の要素（class node）の全部に card を求め、auditCards がその欠けを数える。図の節点は ui.js の nodeBox が class node と nl・属性 data-key（節点の鍵）・tabindex 0 の g の要素で組み、近傍の図（ui.js の svgAround・bead.html のつながりの block が呼ぶ TZ.aroundBlock）が使う。狭い幅の一覧の行の題は ui.js の itemNode が class ttl と nl・href（bead.html と id）・属性 data-key の a の要素で組み、近傍の一覧（ui.js の chainAround）が使う。ui.js の cardContent は属性 data-key を持つ要素に節点の card（題・種類と帯と状態・id と要約・出所の 4 行）を返し、bindHover は document の mouseover と mouseout の委ねで、data-key を持つ最も近い祖先の card を出し（同じ要素なら出し直さない）、出たら 150 ミリ秒の猶予に入る。持ち主は project board を見て「各ノードのホバーで詳細が表示されないのは…」「各beadsのページのつながりではノードのホバーでtooltipが出ない」と指摘した（t3-hub.1（裁定 id = user 2026-09-28T00:4xZ）・逐語の抜きは t3-hub.1 の notes・席はこの行に拠ると記帳した）。
      本番の節点の頁のつながりの block（src/project/nodearound.rs）は近傍の図を字の SVG（inner_html）で描くので、札に付けてきた use:attach の形を図の節点に付けられず、図の mouseover の委ねは光らせ（paint）だけで card を出さない。つながりの一覧の題の a にも card が無い。hover の層（src/widgets/hover.rs）は attach だけが外から呼べ、card を出す HoverCtx の show と消す leave は外から呼べない。節点の card を組む node_card は状態を引くためだけに GraphDoc を要るが、近傍の電文の行（AroundRow）と眺めの節点（ViewNode）は GraphNode と状態の字を持つ。
