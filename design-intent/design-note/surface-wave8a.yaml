    type: prose
    title: 行 g-unref-word — 未反映の注釈の字
    body: |
      なぜ。持ち主の指摘（t3-hub.1（裁定 id = user 2026-09-28T00:4xZ）の逐語）: 台帳の「未反映」の「?」の注釈の「! tsuzuri 以外は memo だけ」が分かりにくい。語の鍵 l_unref の注釈は 2 つの board で共用で、project board の台帳の block の 4 数（src/project/ledger.rs の METRICS の 3 つ目）と、account board の台帳の表の列（src/account/ledger.rs の COLUMNS の c-un）と project の表の列（src/account/projects.rs）の見出しの「?」に出る（どこも鍵の字で引く・着地済みの行 h-cards-proj の後は project の表の行の未反映の欄も同じ鍵を data-term で引き、同じ注釈を開く・確かめた）。今の注釈の 3 行目は、見本の data（見本の tsuzuri は 3 種を数え、ほかの project は memo だけ）を前提にした account board の表のための限定で、tsuzuri だけを映す project board では意味を成さない。本番の中核（crates/tsuzuri-core/src/ledger/unreflected.rs の of_beads）は tsuzuri でも open の memo だけを数え、裁定と要望はいつも まだ分からない（電文 LedgerStats の unreflected_unknown に ruling と request が入る）ので、今の画面の事実とも合わない。数の横に出る測れていないの印（src/project/ledger.rs の 4 数の未反映の値の横・未反映に まだ分からない 種類が在るとき）の意味も注釈に無い。この行は面の語の辞書の l_unref の注釈（rephrase の plain）を、2 つの board のどちらでも、後の行 c-unref-kinds（裁定と要望を数える）の前でも後でも正しい字に替える。拠る = 持ち主の指摘と、要件 FR14（語彙と文の予算）と規則の行 R-19（文の予算）と、要件 FR13 の未反映の 3 種（昇格先の無い memo・処分の宣言の無い裁定・反映されていない要望）。
      新しい字（改行で分けた 6 行）。1 行目「design-intent にまだ写っていないものの数」、2 行目「・ memo = 昇格先の無い memo」、3 行目「・ 決定 = 処分の宣言が無い決定」、4 行目「・ 要望 = 反映されていない要望」、5 行目「▸」、6 行目「{st:unknown} 付きは まだ数えていない種類がある」。label「未反映」と internal（「unreflected(G).length」と改行と「他の project は open memo ∧ ¬promoted_to」）は今のまま。vocab.json の中では plain の字の値の改行を JSON の改行の escape で書く（今の字と同じ書き方）。
      字の決め（席の決め）。1 行目は何の数かだけを言い、3 つの項に未反映の 3 種を要件 FR13 の字の言い換えで並べ、詳しく（行「▸」の後）に測れていないの印の意味を置く。「tsuzuri 以外は」の行を消し、どの project でも同じ定義の字にする（数えられない種類が在れば印が出る、という書き方なので、c-unref-kinds の前後で字を替えずに済む）。今の 2 行目「= 未反映の一覧と同じ数」は落とす（account board には未反映の一覧が無く、2 つの board のどちらでも正しいとは言えない）。語は語の辞書のほかの注釈と揃える（決定と処分の宣言は鍵 nx_f の注釈の「決定はあるが処分の宣言が無い」と同じ語・昇格は鍵 memo_promo と同じ語）。
      見本との差（席の決め）。見本の語彙（docs/design/mock3/vocab.json）は承認済みの見本（判断の記録 ADR-7 の承認 user 2026-09-26T07:51Z）なので替えず、面の語彙（crates/tsuzuri-surface/vocab.json）だけを替える。2 つの file は main で byte まで同じ（cmp で確かめた）で、この行の後の差は l_unref の plain の 1 つだけになる。見本の字は見本の data を前提にした字で、本番の数え方（c-unref-kinds までは memo だけ）とは前提が違う。見本と面の vocab.json を比べる着地済みの歯は無い（tests と xtask と build.rs を grep で確かめた）。
      R-19 の予算（数えた・字数は Unicode の scalar・記号の波括弧の片は 0 字と数える見本の budget と同じ数え方）。1 行目 27 字（上限 40）。項 3（上限 4）。項の本文（記号「・」と空白の後）18・15・15 字（上限 20）。字「・」を 2 つ以上持つ行は 0（項の行の「・」は記号の 1 つだけ）。括弧は無く、入れ子も 0。詳しくの行は 1 行で本文 17 字（R-19 は詳しくの字数を決めない・見本の budget の詳しくの上限 36 の内）。
      在りか（main d927a57 で確かめた・vocab.json と vocab.rs と kit.rs と rules.yaml と見本の vocab.json は 2bc9aa0 から変わっていない）。crates/tsuzuri-surface/vocab.json（write-set）は src/vocab.rs の pub const SOURCE に include_str で入り、pub fn vocab（&'static Vocab）が 1 度だけ読む。Vocab の pub fn parse（&str を受け Vocab と String の理由の Result）は rephrase の plain を term の note に、internal を internal に入れる（orig があれば internal の末に原語の行を足す・l_unref に orig は無い）。pub struct Term（pub な欄 label と note と internal の String）と Vocab の pub fn term（&str を受け Term の参照の Option）と pub fn keys。widgets の help（src/widgets/help.rs・host でも組む・この行は書かない）の pub fn note（鍵の &str を受け Note の Option）は note_of で、note を改行で行に分け、行「▸」の前を本体・後を詳しくにし、本体の 1 行目を inline で head に、残りの空でない行を line で items に、詳しくの空でない行を line で more に、internal の空でない行を inline で internal にする。pub fn line は、行が字 { で始まれば } までを記号に、そうでなければ最初の空白までの 1〜3 字の語を記号にし、記号の後が空白で残りが空でなければ記号と本文（前の空白を除く）に分ける（見本の itemHTML と同じ）。pub fn inline は波括弧の片を Sym に、逆引用符の片を Code に、ほかを Text にする。pub enum Inline（Text・Code・Sym の String）と pub struct Line（pub な欄 sym と text の Inline の Vec）と pub struct Note（pub な欄 label・head・items・more・internal）は Debug・Clone・PartialEq・Eq。第 7 波の行 g-tip-expert（着地済み）は help.rs に経験者の注釈の関数 expert_note ほかを足したが、note と note_of と line と inline は変えていない（main d927a57 の字で確かめた）。kit（src/kit.rs・host でも組む）の pub const STATES（5 組・値 run・wait・limit・silent・unknown と語の鍵 st_run ほか）と pub const UNKNOWN（字 unknown）。
      記号（確かめた）。新しい字が使う記号は {st:unknown} の 1 つだけで、語の辞書の中で既に使われている（鍵 st_unknown と status の注釈ほか）。help の DOM（wasm の target のときだけ）は、字 st: で始まる記号の値が kit の STATES に在れば kit の state_icon にその値を渡して描く。project board の 4 数の未反映の値の横の印も state_icon に UNKNOWN を渡して描くので、注釈の印と数の横の印は同じ部品の同じ見た目になる。着地済みの歯 hsym_vocab_tokens_all_drawn が見張る記号は字 gi: と nxm: と thr: と tk: と band: で始まる 14 個の閉じた集合で、字 st: の記号は見張りの外（集合は変わらない）。図の行（字 {fig: で始まる行）は足さない（hfig_fig_of_note_lines の 8 組は変わらない）。
      出さない物。数え方の変更（裁定と要望を数えるのは後の行 c-unref-kinds・account board の未反映の列を埋めるのは後の行 e-acct-unref と h-acct-cols）。t3-hub.1 のような記録の memo を数えから外す印（席の決め・行でない）。見本の語彙の字の変更。
      着地済みの歯（直すもの）。無い（l_unref の字を pin する歯は無い・tests と src の cfg(test) を grep で確かめた）。
      着地済みの歯（直さずに通る・write-set の外）。hsym_vocab_tokens_all_drawn は全部の鍵の注釈の 5 種の頭の記号の集合を見る（足す記号は st: で見張りの外）。hsym_note_fills_history は全部の鍵で、字 SPAN と TICK の記号が無い注釈は note_in と note が同じ値であることを見る（新しい字は SPAN と TICK を持たない）。hfig_fig_of_note_lines は図の行の鍵と図の名の 8 組を見る（足さない）。frame_help_note_splits_lines は st_unknown と status と b:beads と questions の注釈の分け方を見る（l_unref は見ない・分け方は変えない）。frame_headings_come_from_vocab は頁と block の見出しと METRICS の鍵（l_unref を含む）が語の辞書に在って label が空でないことを見る（label は変えない）。frame_no_heading_words_in_code は src に見出しの語を引用符で囲んだ字が無いことを見る（label は変えず、src は書かない）。ledgerblock_ と acctproj_ と acctled_ の歯は列と数の語の鍵の並び（l_unref を含む）を見る（鍵は変えない）。vocab.rs の cfg(test) の JSON の読みの歯は vocab.json を読まない。
      測り方。新しい歯は tests/uword.rs に置き、名を uword_ で始める。面の語彙は vocab の module の vocab で、見本の語彙は CARGO_MANIFEST_DIR から ../../docs/design/mock3/vocab.json の字を読んで Vocab の parse に渡して得る。規則の行は CARGO_MANIFEST_DIR から ../../design-intent/rules.yaml を読み、字 id: R-19, を含む行を探す（着地済みの smore_budget_matches_r19 と同じ読み方）。注釈は help の note で得て、Sym の片は 0 字、Text と Code の片は字の数（Unicode の scalar）で数える。括弧の入れ子は、行を前から見て、開き丸括弧（全角と半角）で 1 を足し閉じ丸括弧で 1 を引いた深さが 2 以上になる行を数える。自分の名の歯は tests/uword.rs の字を読み、test の属性の行の次の fn の名を全部集め（着地済みの ncard_names_stay_apart と同じ読み方）、名の数が 6 以上であることと done (7) を見る。fixture は足さない。
      filter の語（着地済みの行の verify の 49 の語・第 3 波の 17・第 4 波の 4・第 5 波の 11・第 6 波の新しい 4・第 7 波の 9・第 8 波のほかの行の 12・この行の接頭辞 uword_ は並べない・106 語）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・hcard_・qgate_・nsum_・ntime_・ptitle_・ncard_・hsym_・smore_・lcard_・aaround_・hruling_・sxaxis_・plimit_・bport_・fmark_・fstop_・fserve_・nsumw_・cadopt_・tipx_・hcsess_・hcproj_・sesplit_・mstore_・athr_・qblock_・wsteady_・gsum_・nstall_・pfold_・cround_・cgdom_・csled_・lhome_・shb_・ghb_・nact_・aord_・mtree_ で、新しい歯の名から先頭の uword_ を除いた字は、このどれも部分の字として含まない（例 uword_parts_x・uword_hsym_x・uword_frame_x は不可）。着地済みの verify の filter のうち歯の名そのもの（frame_one_module_per_block ほか）と server_ で始まる接頭辞（server_read_ ほか）は、並べた語を部分の字として含むので、並べた語で足りる。名は done に書いた uword_note_text・uword_note_lines・uword_budget_r19・uword_symbols_known・uword_mock_kept・uword_names_stay_apart（どの語も含まない）。
      依存は足さない。depends は空。vocab.json は第 7 波の行の write-set に無く、第 8 波では後の行 g-map-tree も書く（計画の 5 節の順 g-unref-word → g-map-tree・その行は map の眺めの鍵を足して直し、l_unref の字は変えない）。src と style.css と Cargo.toml と見本の file は触らない。
  - n: 8
    type: prose
    title: 行 g-pipe-fold — pipeline の開いた列を畳む button
    body: |
      なぜ。持ち主の指摘（t3-hub.1（裁定 id = user 2026-09-28T00:4xZ）の逐語）: pipeline の列の「+n」を押して開いた後に、畳む手が無い。見本（docs/design/mock3 の index.html の pipeline の列・判断の記録 ADR-7 の承認 user 2026-09-26T07:51Z）は、札が 3 枚を越える列の末に「+n」の button（class more num・aria-label は n の数の字）を置き、押すと列の札を全部に替えて button を消す。見本にも畳む button は無い（見本の穴で、見本に反する所ではない）。本番の pipeline の block（src/project/pipeline.rs）は見本どおりで、開いた列の名を URL の query の鍵 col に残す関数（with_open）は在るが、外す関数が無い。この行は、開いた列で札が 3 枚を越えるとき、列の末（「+n」と同じ場所）に「畳む」の button を出し、押すとその列の名を URL の col から外して、3 枚と「+n」に戻す。要件 FR10 の 4 列の板の見せ方だけを変え、札の中身と列の対応は変えない。
      在りか（main d927a57 で確かめた・第 7 波の行 g-card-adopt-a が着地した後の字）。src/project/pipeline.rs（write-set・着地済みの行 g-pipe と g-link-kcard と g-pipe-today が書いた・build.rs が生成する crate::project::pipeline・host でも組む）の host の部分で、この行が使う物は次のとおり。pub const SHOW（usize の 3・列ごとに出す札の数）、pub const QUERY_KEY（字 col）、pub const LANES（4 列の Lane・板の順に列の名 wait・run・stop・land）、pub struct Column（pub な欄 lane の Lane・class の String・cards の Kcard の Vec・derive は Debug・Clone・PartialEq・Eq）と Column の pub fn shown（bool の open を受け Kcard の slice・開いた列は全部・閉じた列は前から 3 枚まで）と pub fn more（bool の open を受け usize の Option・開いた列と 3 枚以下の列は None・ほかは札の数から 3 を引いた数）、pub fn columns（契約の PipelineCard の slice と LedgerRow の slice と EpochSecs の今を受け Column の Vec・列は板の順・Landed の列は今日の着地だけ）、pub fn open_columns（URL の query の &str を受け PipelineColumn の Vec・frame の param で鍵 col の値を読み、コンマで切り、LANES の名に無い名は読み捨て、板の順に並べる）、pub fn with_open（query の &str と PipelineColumn を受け String・open_columns にその列を足し、開いた列の名を板の順にコンマでつないだ字を frame の with_param で col の値にする）。frame の pub fn param（query の &str と鍵の &str を受け、最初の同じ鍵の値の Option）と pub fn with_param（query と鍵と値を受け String・最初の同じ鍵の値を置き替え、無ければ末に足し、ほかの片と順はそのまま・先頭に字 ? を付ける）は host でも組む（frame.rs はこの行は書かない）。wasm の target のときだけの mod dom（字 mod dom { は file に 1 度）は、私的な fn search（今の URL の query・読めなければ空の字）と fn open_column（開いた列の signal の RwSignal の PipelineColumn の Vec と PipelineColumn を受け、with_open(&search(), column) の URL を history の replace_state_with_url で残し、open.set(open_columns(&url)) で signal を替える・頁は読み直さない）を持ち、view は開いた列の signal を open_columns(&search()) で初め、column_view は列ごとに is_open の closure（open.with(|o| o.contains(&column))）と、札の closure（shown(is_open())）と、「+n」の closure（more(is_open()) が Some の n なら、type の値 button と class の値 more num を二重引用符で囲んだ button に aria-label と on:click=move |_| open_column(open, column) を付け、字 +n を描く）を持ち、列の要素の中に header と札の列と「+n」をこの順で置く。
      第 7 波の行 g-card-adopt-a（同じ file を先に書いた・t3-hub.52.33 で着地した）の変更は、Kcard に欄 run_line と run_more を足したこと、pub fn node_hover と pub fn with_nodes を足したこと、mod dom の view でグラフの口（map の PATH）を読み、match する式を with_nodes(content(p, l, now), g) を含む形にしたことで、Column と shown と more と open_columns と with_open と open_column と column_view には触っていない（main d927a57 の字で確かめた）。この行はそれらの変更の字を変えない（g-card-adopt-a の歯 cadopt_ が読む字 with_nodes(content(p, l, now), g) と map::PATH と use:attach=card.hover.clone() は残る）。
      stylesheet と語の辞書（この行は書かない・確かめた）。crates/tsuzuri-surface/style.css に class more の規則（幅 100%・最小の高さ 32px・var(--line-2) の 1px の点線の枠・角の丸み・透明の背景・字の色 var(--ink-2)・指の形の cursor・字の大きさ var(--fs-1)）が在り、見本の ui.css の同じ規則の写し。狭い幅の media の規則は .col.is-empty の中の .more を隠すが、畳むの button は札が 3 枚を越える列にしか出ず、札の在る列は is-empty の class を持たない（columns が札 0 枚の列だけに is-empty を付ける）。語の辞書（crates/tsuzuri-surface/vocab.json）に見出しの語が「畳む」の鍵は無い（全部の鍵の label を読んで確かめた）。
      形（host の部分）。pub const CLOSE（&str・字「畳む」・畳むの button の字）を足す。button の字は見出しでなく、見本の「+n」と着地済みの next.rs の link の字（PIPE_LINK ほか）と同じく file の定数の字にし、語の辞書に鍵を足さない（見本の語彙の約束「見出しは label だけ」は見出しの語の約束で、button の字には鍵を要しない）。着地済みの歯 frame_no_heading_words_in_code は、語の辞書の非 ASCII の見出しの語を引用符で囲んだ字が src に在れば落とすが、「畳む」はどの見出しの語とも同じでない。Column に pub fn closable（bool の open を受け bool）を足し、open が真で cards の数が SHOW を越えるときだけ真を返す（shown(open) が 3 枚より多くを出す列と同じ）。shown と more の値は変えない（開いた列の more は今のまま None で、「+n」と畳むの button は同じ列に同時には出ない）。pub fn with_closed（query の &str と PipelineColumn を受け String）を with_open の隣に置き、open_columns の値からその列を除き、残りが在れば with_open と同じく残りの名を板の順にコンマでつないだ字を frame の with_param で col の値に置いた字、残りが無ければ、query の先頭の字 ? を除いて字 & で片に切り、鍵（字 = の前・= が無ければ片の全部）が col の片を全部外し、残りの片を & でつないで先頭に字 ? を付けた字（片が 1 つも残らなければ字 ? だけ）を返す。空の query を返さないのは、history の replace_state_with_url に空の字を渡すと今の URL がそのまま残るため（字 ? は同じ path の query の無い URL になる）。開いていない列を渡したときは、with_open と同じく知らない名を読み捨てて板の順に並べ直した字を返す。
