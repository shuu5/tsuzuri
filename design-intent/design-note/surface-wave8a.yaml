      振る舞い。近傍の図の節点に指を置くと、その節点の子の要素のどれに入っても節点の card が出て、同じ節点の中の移りでは出し直さず、節点を出て 150 ミリ秒の猶予の間に card へ近づけば残り、ほかは消える（attach の札と同じ）。固定（click）の間も card は出る（見本も固定と card は別）。節点の頁のつながりの block と、問いの頁の問いの card の近傍の段（Embeds の view が同じ panel を組む）の両方に効く。一覧の題の a は attach で card を持つ。
      出さない物。見本の 300 ミリ秒の出し遅れ（attach も遅らせない）、keyboard の focus で card を出すこと（見本の focusin と anchorFor・attach も pointer だけ・図の focusin は今の光らせのまま）、見本の hv-on の印とくちばし（hbeak）と三角の猶予（attach は距離の縮みで判じる）、要約と出所の行の番号（計画の後の行 g-summary が card_for に足す）、経験者向けの行、地図のグラフの面の card（同じノートの後の行 g-card-graph）。
      着地済みの歯（直すもの）。無い。
      着地済みの歯（直さずに通る・write-set の外・tests の下の全部を grep で確かめた）。ncard_ の歯（tests/ncard.rs）は node_card と card_of と short_path の値（fixture の節点の card の 4 行と詳しく・変えた電文の出所と状態と題・全部の節点の card_of と node_card の一致と 36 字）と、compact の札と listing の行の card が card_of の値であることを見て、ncard_dom_wiring は compact.rs と list.rs の DOM の部分の a の tag の字と board.rs の字 provide_context(HoverCtx::default()) と <CardLayer/> を、ncard_short_path_rules は widgets の mod.rs の 4 つの pub mod の行を見る。node_card は card_for に同じ節点と state の値を渡すだけで、card_for の中身は今の node_card の中身と同じなので、どの値も変わらない。この行は compact.rs・list.rs・board.rs・widgets の mod.rs を書かない。parts_hover_place・parts_hover_grace・parts_hover_rows_clip・parts_constants_match_rules_r20_r19 は hover.rs の place・keeps・clip・Card の rows と定数の値を見る（変えない・足す 2 つの関数は既存の関数を変えない）。aaround_src_embeds_in_nodearound は nodearound.rs の字（字 mod dom { が在ること・DOM の部分に pub struct Embeds と pub fn open(self と embed_path( が在ること・字 pub fn embeds( から次の fn までに Owner::current()・字 pub fn view(self から次の fn までに state( と embed_reason( と unmeasured( と panel(・再出しの行に Embeds と embeds・字 layout(&doc と svg(&doc が 1 度ずつ・字 <details が無いこと）を見る。この行は Embeds と embeds と Embeds の view と再出しの行を変えず、layout(&doc と svg(&doc と <details の字を足さない。nodepage_ の歯（tests/nodepage.rs）は nodearound の host の関数（path・query の読み書き・畳み・buttons・state）と mapview の around の関数（layout・svg・chain・数の行）と node の head と summary の値と語の鍵と直接依存を見る（どれも変えない・nodearound.rs の字は読まない）。ntime_ と ptitle_ は nodearound の state と PageState と REASON を、hsblock_ と hsderive_consts_match_note は BLOCK と PATHS と FOLDS を見る（変えない）。frame_one_module_per_block は src/project の下の file の名と各 file の block の id の字を見る（file を足さない）。frame_classes_are_in_stylesheet と frame_no_heading_words_in_code は src の全部を歩く。この行は class の字を足さず（題の a の class ttl は今の字のまま）、引用符で囲んだ非 ASCII の字を足さない。steady_details_use_fold_record と steady_ の畳みの歯は block の file の details の tag と fold の記録の呼びを数える（足さない）。parts_paths_distinct_in_block_modules と境界の brand_path_written_once_in_contract は src の引用符で囲んだ /api/ の字を数える（足さない）。mapview_classes_and_keys_exist と gnav_ と mapgraph_ は mapview の下の file の字と値を見る（この行は mapview の file を書かない）。hcard_・lcard_・klink_・mlink_ は home.rs・ledger.rs・pipeline.rs・compact.rs・list.rs の use:attach の字と board.rs の字を見る（書かない）。着地済みの第 7 波の行 g-card-adopt-a の歯 cadopt_（cadopt_node_hover_rules と cadopt_big_title_rules ほか）は card_of の値の title と kind と card_of の値そのものとの比べを見る（card_of と node_card の値は変わらない）。着地済みの第 7 波のほかの歯（tipx_・mstore_・qblock_・hcproj_ ほか）は help.rs・gaps.rs・batch.rs・store.rs・lib.rs・board.rs・ask.rs・account の board.rs と projects.rs の字と値を見る（この行はどれも書かない）。tests/snapshots の頁の写しは頁の枠と block の並びだけを持つ。
      測り方。新しい歯は tests/cround.rs に置き、名を cround_ で始める。歯は fixture の字を CARGO_MANIFEST_DIR から ../../tests/fixtures/surface/graph-doc.json と around-doc.json として読み、wire の decode で GraphDoc と AroundDoc にする（着地済みの ncard_ と nodepage_ と同じ読み）。変えた電文は fixture の値を写して、節点の plain・eng・line への代入と、beads の status と runs の stage への代入で作り（GraphNode と ViewNode を struct の字で組まない）、重なりの節点は as_view の nodes の e.2 の値を clone して status に代入する。over_shows に渡す Card は Card の既定の値に欄を代入して作る。card_for・node_card・mapview の state・view_cards・as_view・layout・svg・chain は host で呼ぶ。svg の字の data-key の値は、字 data-key= と引用符の後から次の引用符の前までの字を全部集める。cround_dom_text は CARGO_MANIFEST_DIR から src/widgets/hover.rs と src/project/nodearound.rs の字を読み、字 mod dom { より後を DOM の部分とし、区間は始めの字から後で最初に出る終わりの字の前までとして done (4)(5) の字を探す（done (4) の再出しの行だけは file の全部で探す・hover.rs の再出しの行は字 mod dom { より前に在る）。DOM が組めることは xtask の surface-build で見る。自分の名の歯は tests/cround.rs の字を読み、test の属性の行の次の fn の名を全部集め（着地済みの ncard_names_stay_apart と同じ読み方）、名の数が 5 以上であることと done (7) を見る。歯は card の値の行と出所と詳しくの字を比べない（title と kind の字と、card_for・node_card・view_cards の値の間の一致だけを見る）ので、後の行 g-summary が card_for に概要と行を足しても崩れない。fixture は足さない。
      filter の語（着地済みの 49 の語・第 3 波の 17・第 4 波の 4・第 5 波の 11・第 6 波の 4・第 7 波の 8・第 7 波の揺れの行の 1・第 8 波のほかの行の 12・この行の接頭辞 cround_ は並べない・106 語）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・hcard_・qgate_・nsum_・ntime_・ptitle_・ncard_・hsym_・smore_・lcard_・aaround_・hruling_・sxaxis_・plimit_・bport_・fstop_・nsumw_・fmark_・fserve_・cadopt_・tipx_・hcsess_・hcproj_・sesplit_・mstore_・athr_・qblock_・wsteady_・gsum_・nstall_・pfold_・uword_・cgdom_・csled_・lhome_・shb_・ghb_・nact_・aord_・mtree_ で、新しい歯の名の字の全部（先頭の接頭辞 cround_ を含む）は、このどれも部分の字として含まない（例 cround_graph_x・cround_ncard_x・cround_stage_x は不可・接頭辞 cround_ そのものはどの語も含まない・確かめた）。名は done に書いた cround_hover_steps・cround_card_split_same・cround_around_cards・cround_dom_text・cround_names_clean（どの語も含まない）。
      依存は足さない。depends は空（着地済みの行 g-card-node の nodecard と g-ask-around の Embeds を main で確かめた）。Cargo.toml（wasm の target の web-sys の feature に MouseEvent・PointerEvent・Element・EventTarget が在る・確かめた）・vocab.json・style.css・fixture・board.rs・mapview の around.rs と mod.rs と graph.rs と graph/dom.rs は触らない。書く 3 つの file は第 7 波の行の write-set に無い（着地済みの g-card-adopt-a は nodecard.rs と hover.rs を置き場だけの = で持ち中身を書かず、着地済みの g-tip-expert は help.rs を書き hover.rs を書かなかった・main d927a57 で確かめた・まだ着地していない g-seat-split・h-cards-sess・e-watch-steady の write-set にも無い）。計画の行 g-summary は nodecard.rs を書くので、計画の順は g-card-around → g-summary とし、g-summary は card_for の中身を直す。この行は tests/ncard.rs を書かない（ncard_ の期待は変わらない・ncard の期待の直しは g-summary が持つ）。card_for の名と引数と返りは、後の行 g-summary と g-map-tree が使う形としてこのまま保つ。同じノートの後の行 g-card-graph がこの行の Delegate・delegate・leaves・view_cards を使い、同じノートの後の行 g-map-tree が Delegate・delegate・leaves と card_of を使い、同じノートの後の行 g-summary が card_for の中身を直すので、hover.rs の名（Delegate・delegate・Delegate の show と leave・leaves・over_shows）と card_for の形はこの行の字のまま保つ。
  - n: 4
    type: prose
    title: 行 g-card-graph — 地図のグラフの面の図の節点と一覧の題の節点の card
    body: |
      なぜ。要件 FR14 は hover の card を頁を持つ節点の札に出すと決める。見本（docs/design/mock3・判断の記録 ADR-7 の承認 user 2026-09-26T07:51Z で確定した仕様）の map.html の graph の関数は、図の節点を TZ.nodeBox で描き（ui.js の nodeBox・class node と nl と属性 data-key の g の要素）、狭い幅の帯ごとの一覧の行を TZ.itemNode で描く（class ttl と nl と属性 data-key の a の要素）。ui.js の CARD_SHOULD の a の selector は、節点の頁への a の要素と図の節点の g の要素のどちらにも card を求め、cardContent が節点の card を返し、bindHover の mouseover と mouseout の委ねが出し消す。本番の地図のグラフの面（src/mapview/graph/dom.rs）は図を字の SVG（inner_html）で描くので use:attach を図の節点に付けられず、mouseover の委ねは光らせ（paint）だけで card を出さない。狭い幅の一覧の題の a にも card が無い。持ち主は project board を見て「各ノードのホバーで詳細が表示されないのは…」と指摘した（t3-hub.1（裁定 id = user 2026-09-28T00:4xZ）・逐語の抜きは t3-hub.1 の notes・席はこの行に拠ると記帳した）。この行は、同じノートの前の行 g-card-around が足す委ねの口と view_cards を使い、眺めの電文の節点から card を組んで、図の節点の mouseover と一覧の題の a に付ける。切れ目（子 n と切った数）の経験者の注釈と表の cell の注釈は計画の後の行 g-map-tips のままで、この行は節点の card だけを付ける。表の面は見本でも節点の card を持たない（cell は data-pair の button と経験者の注釈だけ）。
      在りか（main 2bc9aa0 で確かめ、d927a57 で読み直した・前の行 g-card-around の着地の後に流す・その間に着地した第 7 波の 6 行〔g-card-adopt-a・g-tip-expert・g-mode-store・h-cards-proj・c-acct-thr・c-q-blocking〕は、この行が書く graph/dom.rs と、読む graph.rs・nodecard.rs・hover.rs・fixture の graph-view.json・vocab.json・style.css・tests の graphnav.rs と mapgraph.rs と mapview.rs を書いていない）。mapview の graph（src/mapview/graph.rs・置き場だけの =・この行は書かない・mapview の mod.rs の pub mod graph・host でも組む）は、pub const PATH（字 /api/graph/view）・pub fn doc（Fetched の参照を受け、GraphView と &'static str の理由の Result）・pub fn layout（&GraphView を受け Layout）・pub fn svg（&GraphView と &Layout を受け String・節点ごとに node_svg が、字 <g class= と引用符で囲んだ node と空白と data-key= と引用符で囲んだ節点の id（esc に通した字）で始まる g の要素を描く）・pub fn chain（&GraphView を受け ChainBand の Vec）と pub struct ChainBand（pub な欄 band と rows の ChainRow の Vec）と pub struct ChainRow（pub な欄 id・title・shape・alert・kids）を持ち、DOM は wasm の target のときだけの宣言の行 mod dom; の先の graph/dom.rs に在り、pub use dom::view; で出す。graph.rs を書かないのは、着地済みの歯 gnav_dom_moved_out が graph.rs の改行で割った行の数を 1150 以下と見ていて余白が小さいから（この行の足す物は全部 graph/dom.rs と前の行の nodecard.rs と hover.rs に在る）。着地済みの歯 mapgraph_kids_badge_and_ids_in_every_box は fixture の図に g の要素 node が 8 つ在り、全部の節点の id が data-key に在ることを見る。
      graph/dom.rs（write-set・着地済みの行 g-graph と g-link-graph が書いた・全部が wasm の target のときだけ）は、私的な struct Model（欄 view の GraphView・layout・degree）・Press・pub fn view（URL の query の signal を受け、口 PATH を crate::net::read で読み、doc の値で panel か測れていないの理由を描く）・私的な fn node_key（事件の的の EventTarget の Option を受け、closest で g.node の祖先の属性 data-key の字の Option）・place・paint・panel・legend_view・chain_view を持ち、use に std の collections の BTreeMap と leptos の ev が在る。panel（GraphView と固定の signal と拡大の StoredValue と mode を受け AnyView）は lay と picture（svg）と凡例と bands（chain）と数の行と経験者の行と degree を組んでから Model に v を動かして StoredValue に置き、hover（固定が無ければ node_key の節点を paint で光らせる）・out（固定が無く、的が節点で、移った先が節点でなければ光らせを消す）・click・open・key・wheel・down・moved・up の closure を組み（hover・out・click はこの順）、図の箱を、字 <div class= と引用符で囲んだ gzoom と空白と node_ref=gz inner_html=picture で始まる div に、on:wheel と on:pointerdown と on:pointermove と on:pointerup と on:pointercancel の受け手と、on:mouseover=move |ev| hover(ev.target()) と on:mouseout=out と on:focusin=move |ev| hover(ev.target()) と on:click=click と on:dblclick=open と on:keydown=key を付けて描き、後に chain_view に bands と mode を渡した値を置く。chain_view（ChainBand の Vec と mode を受け AnyView）は帯ごとに subh と items の ul を置き、行ごとに li の中に印の span と、字 <a class= と引用符で囲んだ ttl と空白と href=href と閉じ山括弧で始まる題の a（中に nid の span と題の span）と、子の数の aside を置く。
      前の行 g-card-around が置く物（同じノートの行・この行の base で在る）。widgets の hover の host の部分の pub fn leaves（from と to の字の参照の Option を受け bool・from が Some で to と等しくないときだけ真）と、wasm の target のときだけの pub struct Delegate と pub fn delegate()（描くときに呼び頁の card の層を引く・Copy）と Delegate の pub fn show（web_sys の MouseEvent の参照と Card を受け、出している card と同じなら猶予を止めて残し、違えば attach と同じ HoverCtx の show で出す）と pub fn leave（web_sys の MouseEvent の参照を受け attach と同じ HoverCtx の leave で猶予に入る）。どれも crate::widgets::hover の名で出る。widgets の nodecard の pub fn card_for（&GraphNode と状態の字の Option を受け Card・今の node_card と同じ 4 行と詳しく）と pub fn view_cards（ViewNode の slice を受け、id から Card の BTreeMap・同じ id は前の節点）。project board の頁の枠（src/board.rs）の App は provide_context(HoverCtx::default()) と <CardLayer/> を持ち、地図の頁の block（src/project/map.rs）の mod dom はグラフの面で graph::view を呼ぶので、委ねの口は頁の card の層を引ける。
      電文（契約の型の crate の graph.rs・この行は書かない）。pub struct GraphView（pub な欄 nodes の ViewNode の Vec・edges・shown・folded・cut・total・unread）、pub struct ViewNode（pub な欄 node の GraphNode・status の String の Option・rank・kids・degree）。ViewNode の status の注は、bead は属性の状態の字、走行は属性の段の字、ほかは無し（中核が GraphDoc の beads と runs から置く・mapview の state と同じ字）。
