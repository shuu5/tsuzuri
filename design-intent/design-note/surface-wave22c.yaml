  - n: 3
    type: prose
    title: 行 e-multi-ask — ほかの project の問いを札つきで 1 つの一覧に混ぜて読む（答えはチャット）
    body: |
      在りかの main は 45cc258（計画 surface-plan 第 0.83 版）で、試作は行 e-signal（ノート surface-wave21d・便は未着地）の差分を当てた土台で撃った。この行は計画 9 節の行 e-multi-ask を、席の決め（2026-09-29）のとおり問いの読みだけにした行で、裁定の書きは計画だけの行 e-multi-answer に残す（器の答えの口 seat ruling answer〔器の ADR-0087 決定 (6)〕の着地を待つ）。
      なぜ。今の運用では、ほかの project の board は別の server を起動の引数 --read-only で起こし（答えの口を 403 で断る・行 e-ask-own-only）、ほかの project の席の問いは持ち主が別の頁を開かないと見えず、答えはチャットで受けている。持ち主の答え（2026-09-28T13:14Z・器の席の問い 2）で席の問いは台帳の問いになったので、tsuzuri の board の問いの頁に、ほかの project の open の問いを札つきで 1 つの一覧に混ぜて出す。答えは今までどおりチャットで受ける（tsuzuri の server はほかの repo の台帳へ直に書かない・器の ADR-0087 も裁定面の server が器の台帳へ直に書く形を退ける）。
      在りか（今の main の字）。契約の crate の question.rs は pub struct QuestionCard（欄 id・title・posted_at・plain・eng・reason・recommend・a1・touches・blocking・digest）と pub struct QuestionList（欄 cards は Reading の QuestionCard の列・欄 answerable は serde の default が真の fn answers）を持つ。境界の crate の口 GET /api/questions（src/server/routes/questions.rs の fn questions）は、見張りの読みの Source（shared.sources.ledger）の got の字を中核の tsuzuri_core::question::list に渡し、answerable を読むだけの server で偽にした QuestionList を電文にし、fn aged で読みの古さの頭を付ける。起動の引数は src/server/config.rs の pub struct Config（欄 repo・bind・files・bd・state_dir・folio・bdw・seat・scribe2・read_only・fn new が 3 つの欄のほかを既定で埋める）と src/main.rs の fn parse（--名 値 と --名=値・値を取らない --read-only・2 度の引数と省ける引数の空の値を断る・const USAGE）。src/server/mod.rs の Server::bind_with は Hub::start で台帳と板の見張りを始め、struct Shared（私的な欄 sources・files・hub・writer・seats・acct・acct_marks・acct_watch・read_only）を組む。src/server/events.rs の Hub は pub fn start・watch_board・watch・watch_ledger（印 Mark と読みの関数・受け手が居る間は印が Store で前の読みが Known なら store_reread〔60 秒〕、ほかは reread〔5 秒〕ごとに読み直す）・subscribe・nudge・listeners・ledger_changed・board_changed を持ち、私的な fn watch_with と fn watch（受け手が 0 人の間は印が動いた周だけ読む・読みが前と変われば ledger-changed を送る）と struct Watch（欄 seen・read_at・last・listening）を持つ。src/server/ledger.rs の pub struct Source は pub fn new(repo, bd)・watched・mark・read・got・text を持ち、watched の Source の got は bd を撃たず見張りの最後の読みの字を返す（行 e-snap）。中核の account/mod.rs の pub fn project_name(anchor: &str) -> String は字の末の / を除いた最後の / の後の字を返す。面の crate の src/project/ask.rs は pub const PATH（字 /api/questions）・CHAT_KEY（語の鍵 answer_in_chat）・EMPTY・CARDS_UNKNOWN、pub struct Card（欄 number・id・title・a1・posted_at・summary・reason・recommend・touches・blocking・digest）、pub fn cards・answerable・count・body・card_key・outline・listed・node_cards・card(number, q) を持ち、mod dom の fn view が口の本文から card を組み、fn part_view が LAYOUT の部分（Head・Summary・Reason・Recommend・Answer・Around）を組み、fn answer_view が context CanAnswer（電文の answerable）が偽なら送る欄の代わりに語の鍵 CHAT_KEY の 1 行を出す。
      形（契約・src/question.rs）。pub struct ProjectQuestions（欄 project は札の字 String・欄 answerable は bool で serde の default〔鍵の無い電文は偽〕・欄 cards は Reading の QuestionCard の列）と pub struct AllQuestions（欄 own は QuestionList で serde の flatten・欄 others は ProjectQuestions の列で serde の default と skip_serializing_if Vec::is_empty）を足す。どちらも derive は Debug・Clone・PartialEq・Serialize・Deserialize。others が空の AllQuestions の字は own の QuestionList の字と同じで、鍵 others の在る字を QuestionList で読むと鍵 others は捨てられ自分の問いの一覧になる（serde の既定・QuestionList は知らない鍵を断らない）。QuestionCard と QuestionList の形は変えない。見本は契約の歯 tests/cform_ledger.rs の fn forms の question の段の後に question::ProjectQuestions（札 proj-x・answerable 偽・cards は Known の空の列／札 proj-y・answerable 偽・cards は Unknown）と question::AllQuestions（own が Known の空の列で answerable 真・others は空／同じ own と others は先の 2 つ）を足し、snapshot の tests/snapshots/ledger.json に同じ順で 2 つの鍵を足す。見本の card の列を空にするのは、中核の歯 tests/qblock.rs の qblock_snapshot_carries_ids が snapshot の ledger.json の鍵 a1 を持つ card を 3 つと数えるため（card の形は question::QuestionCard の見本が持つ）。
      形（境界）。src/server/config.rs の Config に pub projects: Vec<PathBuf>（ほかの project の repo の置き場・引数の順）を足し、fn new は空の列で埋める。src/main.rs は const PROJECT（字 --project）を足し、fn parse は --project を何度でも受け（--project 値 と --project=値）、値の dir の名（tsuzuri_core::account::project_name）が空なら字「--project の値 <値> に dir の名が無い」、前の --project と同じ名なら字「--project の名 <名> が 2 度ある」で断り（fn usage が rc 1 で標準 error に書く）、引数の順の PathBuf の列を Config の projects に置く。USAGE の末に [--project <dir>]... を足す。置き場が dir でなくても起動は断らず、その project の問いは Unknown になる。新しい src/server/others.rs（mod.rs の私的な mod others）は pub(super) struct Others（札と Source の組の列）を持ち、pub(super) fn new(projects, bd) は置き場ごとに札を project_name で、Source を Source::new(dir, bd).watched() で作り（bd は撃たない・bd の program は --bd と同じ）、pub(super) fn watch(&self, hub: &Arc<Hub>) は組ごとに Hub::watch_ledger_into で印を Source::mark、読みを Source::read の後の open の問いの card の列にして見張りを始め、pub(super) fn questions(&self) は組ごとに札・answerable 偽・見張りの最後の読みの字（Source::got の text）を tsuzuri_core::question::list で読んだ cards（字が無ければ Unknown）の ProjectQuestions を引数の順に返す。src/server/events.rs の impl Hub に pub fn watch_ledger_into(hub: &Arc<Hub>, mark, read, timing: Timing) を足す。最初の印と読みは戻る前に取り、私的な fn watch に Hub の Weak と、送り手を thread が持ち続ける待ちの受け手を渡すので、受け手の数えと読み直しの間隔（watch_ledger と同じ・私的な fn ledger_reread に移す）と送る先はその Hub のもの（受け手は server の知らせの接続）で、問いの合図 nudge では起きない。watch_ledger は fn ledger_reread を使う形にするだけで振る舞いは変えない。src/server/mod.rs は Shared に私的な欄 others を足し、bind_with は Hub::start の後で Others::new(&config.projects, &config.bd) と watch(&hub) を撃ち、module の doc に 1 文を足す。口の fn questions は AllQuestions（own は今の QuestionList・others は shared.others.questions()）を電文にする。答えの口（ruling・batch・policy・revoke）と台帳の書きと席の配達は変えないので、ほかの project の問いへの答えは今の答えの口が自分の台帳に無い問い（Refusal::UnknownQuestion・状態 404）として断り、bdw を撃たない。
      形（面・src/project/ask.rs）。Card に欄 pub project: Option<String>（ほかの project の札・自分の問いは None）と pub answerable: bool（自分の問いは真・ほかは電文のその組の answerable）を足し、fn card は None と真で埋める。pub const OTHER_UNKNOWN（字「台帳が読めず、答えを待つ質問が分からない」）を足す。pub fn others(fetched) は本文を AllQuestions に読んだ欄 others（読めない本文・まだ読んでいない・読めないは空の列）、pub fn unknown_projects(fetched) は cards が Unknown の組の札の列（電文の順）、pub fn total(fetched) は block の中身の card の数（測れていなければ Unknown・0 件は Known の 0）を返す。fn body は自分の問いの列（fn cards の Err は今のとおり測れていない）に、others の Known の組の列を電文の順に 1 つずつ私的な fn merged で混ぜ、空なら EMPTY、ほかは番号を 1 から付けた Card（札と answerable を置く）にする。fn merged は 2 つの列をどちらも順を変えずに 1 つにし、先頭どうしの投稿の時刻を比べて後の列の先頭が古いときだけ後の列から取る（同じ時刻は前の列が先・面はどの列の中も並べ替えない〔着地済みの歯 askcard_numbers_and_touches が電文の逆の順の番号を見る〕）。fn cards・count・answerable は今のまま自分の問いだけを読むので、束の block（batch.rs の body）と次の一手（next.rs）と問いの件数の読み手には、ほかの project の問いは入らない。mod dom の fn view は、block の頭の数の chip を fn total で出し、fn list の前に置く閉包 unknown で読めない組ごとに class small muted の div の中に class chip の span の札と OTHER_UNKNOWN の 1 行を一覧の下に出し、section の中身を {list}{unknown} にする。fn part_view の Head は札の在る card に class chip の span の札を番号の後に置き、題を節点の頁への link（class t の a）にせず、属性 data-t の span の字だけで出し（その project の地図を読まない）、Around は札の在る card では何も出さない（腕 Part::Around if card.project.is_some()）。歯が見る mod dom の 8 つの字は、card.project.clone().map(|p|・if other {・return view! { <span data-t=・Part::Around if card.project.is_some() => ().into_any(),・let own_ok = card.answerable;・let answerable = move || own_ok && can_answer.is_none_or(|m| m.get());・.with(unknown_projects)・let extra = move || match fetched.with(total) {。fn answer_view は let own_ok = card.answerable; を取り、送る欄を出す条件を own_ok と電文の answerable の両方にするので、ほかの project の card は送る欄の代わりに CHAT_KEY の 1 行を出す。class chip・small・muted は面の style.css に在る規則で、style.css と語の辞書 vocab.json と見本は書かない。
      決めた幅。project の組の渡し方は起動の引数 --project <dir>（何度でも）で、札も後の行の id の頭も置き場から引く（札は dir の名で account board の project の名と同じ読み・id の頭〔最初の「.」の前の字〕は後の行 c-g3-extern がその置き場の台帳の族から引く）。登録の file は置かない（host の名・口座の名札・tailnet の住所を字に持たない）。席の target と state dir は組に持たせない（答えの行 e-multi-answer が器の答えの口の形を見て足す）。ほかの project の台帳は読み取りの bd（--readonly）だけで撃ち、見張りは印（行 e-marks の Mark・錠の file を開かない）が動いた周と、知らせの接続が居る間の読み直しの間隔の周だけ読む（受け手が 0 人の間は読み直さない・行 e-idle と同じ）。open の問いの card が前と変わった周だけ ledger-changed を送る。問いの合図の口（行 e-signal）はほかの project の見張りを起こさない。
      変わらない物（歯で測らず、この行の差分で持つ）。--project の無い server の振る舞い（見張りを足さず・口の字は今のまま）・答えの口と束と方針と取り消しの口の振る舞い・電文 QuestionCard と QuestionList の形・読むだけの server の answerable・面の束の block と次の一手と方針の panel・節点の頁と地図の読み・vocab.json と style.css と見本 mock3。
      着地済みの歯（全部の crate〔契約・中核・境界・面〕の tests と src と xtask を grep で探した）。書く file の字を読む歯: 境界の hbpost・ecache・hbconf・server_acct・hbroute・evkind・iclose・rhold（mod.rs か events.rs か config.rs か main.rs の字）と wsteady（events.rs の歯の名）、面の aaround・acctframe・aface・askcard・askfocus・cadq・qblock・qkey・rbusy・tkad（ask.rs の字）、契約の cfsplit（群の鍵の床）と fxpre（snapshot の ledger.json の裁定 id の形）と中核の qblock（snapshot の ledger.json の card の数）。口 /api/questions と QuestionList を読む歯: 境界の aown・fserve・lsnap・server_ask・server_batch・server_coalesce、面の batchpanel・bhalfpanel・board_min・evkindview・frame・gpface・hsblock・hsderive・nact・parts・rvknode。tz の起動の引数を撃つ歯: 境界の eretry・server_min・server_src・server_read。Hub の見張りを使う歯: 境界の pmisroute・lstore・lidle と行 e-signal の esig。どれも直さずに通り（試作で撃った）、置き場だけの = と verify に入れる。askfocus の afocus_src_links_and_scroll は ask.rs に class t の span の字の無いことを、qkey の qkey_dom_text は mod dom の let list = move || から section(BLOCK までに collect_view() の無いことを見るので、題の字と閉包 unknown の置き場をそれに合わせた。events.rs の単体の歯（mod tests・名は server::events:: で始まる）も --lib の filter server::events:: で撃つ（当たるのは events.rs だけ）。
      測り方・歯。境界の新しい歯 tests/mqask.rs（接頭辞 mqask_）は server を同じ process の thread で立てる（(5) は tz を撃つ）。自分の置き場の台帳は fixture の surface/question-2.json（open の問い fx-ask.3 と fx-ask.2）、ほかの project の置き場 proj-x の台帳は歯の中の 2 行（open の問い fx-oth.2・作られた時刻 2026-09-25T01:00:00Z と closed の問い fx-oth.1・どちらも label intake:question）で、proj-y は台帳の file を持たない。偽の bd は撃たれた cwd の ledger.json を出す script（無ければ rc が 0 でない）で、偽の bdw は撃たれた回を数える。歯の名は mqask_others_follow_args・mqask_no_projects_same_text・mqask_other_change_reaches_events・mqask_answer_to_other_refused・mqask_tz_refuses_bad_project。面の新しい歯 tests/mqface.rs（接頭辞 mqface_）は fixture の surface/question-list.json（qa.2 の投稿の時刻 1790488800・qa.10 は 1790494200）を自分の問いにし、qa.2 の card の id と時刻を替えた fx-oth.2（1790490000）と fx-oth.4（1790494200）を札 proj-x の組に、Unknown を札 proj-y の組にした電文を読む。歯の名は mqface_mixes_by_posted_time・mqface_bare_list_unchanged・mqface_dom_wiring。使う item は契約の question::AllQuestions・ProjectQuestions・QuestionCard・QuestionList、境界の server::Config（欄 projects は pub）と Server、面の project::ask の Card・body・card・cards・count・total・unknown_projects と project::batch::body と project::Body（どれも pub）。
      filter の語。main の contracts の verify の filter の語 203 のどれも、接頭辞 mqask_・mqface_ と歯の名に部分の字として含まれず、接頭辞と名もどの語にも含まれない。workspace の test の fn の名にも mqask と mqface を含む名は無い（確かめた）。
      依存と順。depends は空（ノートの 1 行目）。書く mod.rs と events.rs は行 e-signal（ノート surface-wave21d）が書くので、この行はその着地の後に流す。ask.rs を書く行は計画 5 節の鎖で e-ask-own-only（着地済み）の後。契約の歯と snapshot は ledger の群の鎖（t-fx-prefix の後）。ほかの行との順は便の bead の依存で持つ（席が付ける）。
      範囲の外。ほかの project の問いへの答えと取り消し（計画だけの行 e-multi-answer・器の答えの口 seat ruling answer の着地を待つ）。t3 自身の答えを器の口へ寄せること（要件 FR6 の書き換え）。ほかの project の地図と節点の頁と hover の card。account board の問いの欄。行 c-g3-extern（不変条件 g-3 の外の台帳の行を組の台帳で確かめる）。読むだけの board の server を止めること（席の運用の道具）。

