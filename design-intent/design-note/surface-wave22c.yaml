    type: prose
    title: 目的
    body: |
      ほかの project の台帳の open の問いを、tsuzuri の board の問いの頁に札つきで 1 つの一覧に混ぜて出す、server と面と契約の行 1 つ。
      今は、ほかの project の board を別の読むだけの server で起こし、その席の問いは持ち主が別の頁を開かないと見えず、答えはチャットで受けている。
      ほかの project の置き場は起動の引数 --project で名指し、server は置き場ごとの台帳を読み取りの bd で見張って読み、口 /api/questions の電文の鍵 others に札つきで載せる。面は自分の問いと混ぜた 1 つの一覧を出し、ほかの project の card には送る欄の代わりにチャットで答える 1 行を出す。答えは受けず、ほかの repo の台帳へ直に書かない（答えは器の答えの口の着地を待つ計画だけの行 e-multi-answer）。
