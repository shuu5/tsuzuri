      出さない物。閾値と逼迫の印（見本の cap の字・hot の class・kpi-s の hot の色）、候補ごとの門で落ちた理由、spark と測った時刻の列、休止中の chip、時点のつまみは未決（規則の行 R-22 ほか・便 h-home の約束）で、この行も出さない。電文に無いので出さない物は、群の種（見本の詳しくの種の段）、口座を測った時刻と退役の時刻と測れない理由（見本の acct の枝の値と出所の時刻）、移動の承認・保留・移動の頼み・今の記録の印（見本の mv の枝）、移動の段の逼迫と断りの行（電文の moves は account の記録だけ）。限度の数は電文の session の state が Limit の行だけを数え、電文の pipeline の session は Run か Wait だけなので、見本が数える口座の窓が 100 の run は入らない（面は限度を判じず、電文の state の写しだけを数える）。群の project の札（pchip）と次の一手の行の card は後の行 h-cards-proj の分。
