  - n: 3
    type: prose
    title: 行 k-graph — tz graph の入口（導出グラフ・--check の 3 値・--design の絞り）
    body: |
      なぜ。要件 FR2 は面の server か tz graph が呼ばれたときに導出グラフを組み直すとし、FR3 は tz graph --check が呼ばれたときに不変条件の 12 本を 3 値で数え、違反は id と次の 1 手を名指し、台帳か state が読めなければまだ分からないとして合格にしないとし、FR17 は folio の graph を tz graph に吸収するとする（判断の記録 ADR-8 決定 (3)・索引だけの眺めは tz graph --design の絞り）。FR17 の、引数と終了 code を folio2 の口のままにする決まりは ADR-8 決定 (2) の 11 の口のもので、graph はその列に無く、決定 (3) で導出グラフの絞りになる（folio の graph と同じく、設計の索引が読めなければまだ分からないの 2 を返す）。今の tz の入口（境界の crate の main.rs）は surface serve だけで、導出グラフと不変条件の判定は口 /api/graph の電文からしか読めず、席と人が端末で撃てる床が無い（見本と本番の差の調べ 2026-09-28 の傘の行 k）。この行は tz graph の 3 つの形（旗なし・--check・--design）を足す。folio の 11 の口の一致（FR17 の残り・AC14）と近傍の tz graph --around（ADR-7 決定 (2)）はこの行に入れない。設計ノートの行の節点と design・ruled_by の辺は中核がまだ組まない（行 c-dn-rows の前）ので、この行の出力にも無い。
      在りか（HEAD 9eef54d で確かめた・境界の crate の入口）。Cargo.toml の [[bin]] は名 tz・path src/main.rs で、直接依存は契約の型の crate と中核の crate の 2 つだけ（dev-dependencies は無く、serde と serde_json に直に依存しない・xtask の歯 skeleton_boundary_std_only_and_bin_tz が pin する）。main.rs の fn main は std::env::args の 2 番目からの字を &str の Vec にし、その slice を match する。腕は、字 surface と字 serve で始まる slice の残りを fn serve に渡す腕と、ほかの全部を fn usage（理由の字 subcommand）に渡す腕の 2 つで、返った u8 を ExitCode の from に渡す。main.rs は非公開の const FAIL（u8 の 1）・const USAGE（surface serve の使い方の字）・fn usage（標準エラーに tz: と理由と USAGE を出して FAIL を返す）・fn parse（serve の引数を Config にする）・fn serve を持つ。lib.rs は doc の行と pub mod acct・pub mod accthb・pub mod server の 3 行。src/server/mod.rs は pub mod board・design・ledger・runs を持つ（どれも pub）。境界の crate の src はどれも target の cfg を持たない host の code。
      在りか（読みと組みの部品・どれも pub・host の code・HEAD 9eef54d で確かめた）。src/server/board.rs（tsuzuri_boundary の server の board）は、pub struct Sources（pub な欄 ledger の Source・design の Design・runs の Runs）の pub fn gather（&self と design の bool と events の bool を受けて Texts を返す・台帳はつねに読み、設計の索引と event log は旗が true のときだけ読み、読めない出所と読まなかった出所は空の字）、pub struct Texts（pub な欄 design・ledger・events の String・derive は Debug・Clone・Default・PartialEq・Eq・pub fn inputs が 3 つの欄を中核の Inputs に渡す）、pub fn graph（&Texts を受けて GraphDoc を返す・中核の graph の build の値と、それを check に渡した値を、同じ module の pub fn doc で電文の型に写す・doc は invariants を check の順のまま写し、Violation が名指す id を ids に、その数を violations に置く）を持つ。口 /api/graph の file（src/server/routes/graph.rs）の非公開の fn graph は、shared の sources の gather に true と true を渡した字を board の graph に渡し、wire の encode の値を 200 の JSON で返す。server の起動（src/server/mod.rs の Server の bind_with）は Sources を ledger の Source の new（repo と bd）・design の Design の new（repo と folio）・runs の Runs の new（state dir の Option の &Path）で組む。src/server/ledger.rs は pub const BD（字 bd）と、pub struct Source の pub fn new（repo の Into の PathBuf と bd の Into の OsString を受けて Source を返す）と pub fn text（&self を受けて Option の String・bd を --readonly list --all --limit 0 --json の引数で cwd を repo にして撃ち、起動できない・rc が 0 でない・UTF-8 でない・5 秒を越える、のどれでも None）を持つ。src/server/design.rs は pub const FOLIO（字 folio）と、pub struct Design の pub fn new（repo の Into の PathBuf と folio の Into の OsString を受けて Design を返す）と pub fn text（設計の道具を graph --print --dir と repo の下の design-intent の path の引数で cwd を repo にして撃つ・同じ条件で None）を持つ。src/server/runs.rs は pub struct Runs の pub fn new（state dir の Option の &Path を受けて Runs を返す・file は state dir の下の fleet/events.jsonl）と pub fn text（state dir を省いたときと file が無いか読めないときは None）を持つ。どの読みも書かない。ledger の Source と中核の graph の Source は名が同じ別の型で、cli の graph は path で分けて使う。
      在りか（中核と契約の型・どれも pub・host の code）。中核の crate（tsuzuri_core）の graph の module（src/graph/mod.rs）は pub struct Inputs（&str の欄 design_index・ledger・events）と pub struct Graph（pub な欄 nodes・edges・unread（出所の Vec）ほか）と pub enum Source（Design・Ledger・Runs・Copy）を持ち、Source の pub fn kinds（self を受けて NodeKind の static な slice の参照を返す）は Source の Design に NodeKind の ALL の先頭の 11 個を返す。graph の build の module（src/graph/build.rs・pub）の pub const DESIGN_EDGE_TYPES（usize の 17）は、EdgeType の ALL の先頭の 17 個が設計の索引の辺の型であることを表す。graph の check の module（src/graph/check.rs・pub）は pub const INVARIANTS（&str の 12 個の配列・g-1 から g-12 の順）と pub const UNMEASURED（&str の 3 個の配列・g-3・g-7・g-9）を持つ。契約の型の crate（tsuzuri_contract）の graph の module（src/graph.rs）は、GraphDoc（pub な欄 nodes の Vec の GraphNode・edges の Vec の GraphEdge・unread の Vec の GraphSource・beads の BTreeMap の String から BeadAttr・runs の BTreeMap の String から RunAttr・invariants の Vec の InvariantCheck・skipped の SkippedEdges（pub な欄 design と ledger の u32）・derive は Debug・Clone・PartialEq・Eq・Serialize・Deserialize）、InvariantCheck（pub な欄 id の String・verdict の Verdict・violations の u32・ids の Vec の String・derive は GraphDoc と同じ）、Verdict（Pass・Violation・Unknown・Copy と PartialEq を持つ）、GraphSource（Design・Ledger・Runs・Copy・電文の字は design・ledger・runs）、NodeKind の pub const ALL（20 個）、EdgeType の pub const ALL（30 個）を持つ。契約の型の crate の lib.rs の pub mod wire は、pub fn encode（Serialize の値の参照を受けて Result の String と wire の Error を返す）と pub fn decode（&str を受けて Result の DeserializeOwned の値と wire の Error を返す）を持つ（wire の Error は serde_json の Error の再公開）。
      在りか（中核の build の組み方・src/graph/build.rs の pub fn build・&Inputs を受けて Graph を返す・code を読んで確かめた）。(i) 設計の索引は、空白だけの字なら読めない。行ごとに、空白だけの行と # で始まる行を捨て、タブで切って 5 列（id・種類の語・file・要約値・題）なら節点、3 列（端の id・端の id・型の語）なら辺にする。種類の語が NodeKind の ALL の先頭の 11 個の電文の語（条・規範文・規則行・目的・要件・非機能要件・受入基準・制約・登場人物・出力・判断の記録）の外か、列の数が 5 でも 3 でもない行が 1 つでも在れば、設計の出所を丸ごと読めないにする。型の語が EdgeType の ALL の先頭の 17 個の電文の語（1 番目が in-article・8 番目が refs）の外の辺は組まずに skipped の design に数える。(ii) 台帳は JSON の配列として読めなければ読めない。bead ごとに節点を 1 つ組み、種類は issue_type が epic なら epic、label に intake:memo が在れば memo、label に intake:question が在れば問い、ほかは task。dependencies の type が parent-child・blocks・relates-to・discovered-from のものを、その bead から depends_on_id への辺にする。問いの bead は metadata の touches の id ごとに touches の辺を引く。acceptance_criteria の中の、字 design と空白と = と空白で始まる行を、その bead の pointer の行に持つ。status の字を属性に写し、closed と tombstone のほかは open。notes の定型行（裁定・受け・方針の id の行）からも節点を組むが、節の台帳は notes を持たない。(iii) event log は、空白だけの字か、空白だけでない行に JSON の object として読めない行が在れば読めない。kind が RunCreated の event の欄 run の id ごとに走行の節点を 1 つ組み（段はその走行の event の最後の欄 stage）、run の id がハイフンと 16 字の時刻（数字 8 字・T・数字 6 字・Z）で終われば、ハイフンの前の字の bead の id へ run_of の辺を引く。節点は設計の索引・台帳・走行の順に並び、読めない出所は Graph の unread にこの順で挙がる。設計の索引から組む節点と辺と skipped の design は、台帳と event log の字に依らない。
      在りか（中核の check の 12 本・src/graph/check.rs の pub fn check・&Graph を受けて判定の Vec を INVARIANTS の順に返す・code を読んで確かめた）。9 本は判じの形が同じで、要る出所のどれかが Graph の unread に在ればまだ分からない、無ければ名指す id が空なら合格・在れば違反（名指す id は名の順）。g-2 は種類が task で open の bead のうち pointer の行の数が 1 でないもの（要る出所は台帳）。g-4 は open の問いの bead のうち touches が空のもの（台帳）。g-5 は根（種類が epic で parent-child の親を持たない bead）に、parent-child の最初の親をたどって着かない bead（台帳）。g-6 は blocks の輪の上の bead と parent-child の輪の上の bead と、親を 2 つ以上持つ bead（台帳）。g-8 は label に intake:memo と pointer の行の両方を持つ bead（台帳）。g-11 は run_of の辺の先の bead が台帳の bead に無い走行（走行と台帳）。g-12 は段が Questioned で答えの無い問いが 0 の走行（走行）。g-1 と g-10 だけ形が違う。g-1 は端の id が節点に無い辺の端を名指し、名指す端が無ければ出所を問わず合格、在れば 3 つの出所を要る判じ。g-10 は 2 つ以上の出所の種類の節点に同じ id が在るものを名指し、在れば出所を問わず違反、無ければ 3 つの出所を要る判じ。g-3・g-7・g-9 はどの入力でもまだ分からない（UNMEASURED・材料が 3 つの入力に無い）。だから 3 つの出所が全部読めれば、まだ分からないは UNMEASURED の 3 本だけになる（着地済みの歯 server_read_four_routes_match_core が、3 つとも読める口 /api/graph の電文でまだ分からないの id の列が UNMEASURED と同じことを見て、中核の歯 graph_violations_match_fixture が、3 つとも読める fixture の組ごとに UNMEASURED の 3 本がまだ分からないことを見る）。
      形（lib と main）。lib.rs に pub mod cli の 1 行と、doc に行 k-graph が tz の口の graph を置く旨の 1 行を足す。src/cli/mod.rs を足し、doc と pub mod graph だけを持たせる。main.rs は match に腕を 1 本足す。最初の字が graph の slice の残りを cli の graph の run に渡し、返った u8 をそのまま rc にする腕で、surface serve の腕と、ほかの全部の腕の間に置く。先頭の doc に tz graph の形の 1 行を足す。parse・serve・usage・USAGE・FAIL は変えない（tz graph の使い方の字は cli の graph の USAGE が持つ）。
      形（cli の graph・src/cli/graph.rs・target_arch の cfg で囲まない host の code・引用符で囲んだ /api/ で始まる字を持たない）。pub const USAGE（字 usage: tz graph [--check | --design] [--repo <dir>] [--bd <program>] [--folio <program>] [--state-dir <dir>]）。pub fn run（&[&str] を受けて u8 を返す）は次のとおり。(a) 引数。値を取らない旗 --check と --design、値を取る --repo・--bd・--folio・--state-dir（--名 値 か --名=値・main.rs の parse と同じ読み）。同じ名が 2 度・知らない引数（= の値を付けた旗を含む）・値の無い名・値が空・--check と --design の両方、のどれも使い方の誤りで、標準エラーに tz graph: と理由の 1 行と USAGE を出して 1 を返す。省いた --repo は字 .（今の dir）、--bd は ledger の BD、--folio は design の FOLIO、--state-dir は無し（走行の出所は読めない）。--repo の path が dir でなければ、標準エラーに tz graph: と、repo の置き場のその path が dir でない旨の 1 行と USAGE を出して 1 を返す。(b) 組み。旗の無いときと --check のときは、Sources（Source の new に repo と bd・Design の new に repo と folio・Runs の new に state dir）の gather に true と true を渡した字を board の graph に渡す（口 /api/graph と同じ 2 つの呼びで、組みの code を写さない）。--design のときは Design の text だけを読み（bd も event log も読まない）、Texts の design にその字（None なら空の字）を置いてほかの 2 つを空の字にして board の graph に渡し、design_view で絞る。(c) 出す GraphDoc（--design では絞った値）の unread が空でなければ、どの形でも標準エラーに「# 読めない出所: 」の後に unread の順の語（design は 設計の索引・ledger は 台帳・runs は 走行の記録）を「・」でつないだ 1 行を出す。(d) 旗の無いときと --design のときは、標準出力にその GraphDoc の wire の encode の字（1 行）と改行を出し、unread が空なら 0、空でなければ 2 を返す（encode が Err なら標準エラーに理由を出して 2）。(e) --check のときは、GraphDoc の invariants を電文の順（id の順）にたどり、verdict が Violation の 1 本ごとに標準出力へ違反の行を出し、Unknown の 1 本ごとに標準エラーへまだ分からないの行を出し、最後に標準出力へ要約の行を出し、exit_code に overall の値を渡した rc を返す。GraphDoc の JSON は出さない。
      形（--check の行の字）。違反の行は、[ と id と ] と半角の空白と 違反 と半角の空白と欄 violations の数と全角の（ と欄 ids を「・」でつないだ字と全角の）と半角の空白と next= と NEXT のその id の字（例 [g-2] 違反 1（k.1） next=契約の bead の acceptance に design = で始まる行をちょうど 1 つ置く）。まだ分からないの行は「# まだ分からない: [」と id と「] 」と理由で、理由は id が UNMEASURED に在れば 測る機構がまだ無い、ほかは 読めない出所が在る。要約の行は「tz graph --check: 」と語と全角の（ と 違反 と半角の空白と Violation の本数と「・まだ分からない 」と Unknown の本数（UNMEASURED の 3 本を含む）と全角の）で、語は overall の値が Pass なら 合格・Violation なら 不合格・Unknown なら まだ分からない（例 tz graph --check: 不合格（違反 1・まだ分からない 3））。行の置き先と 3 値の終了 code は folio の床の check の口（違反の行と要約の行を標準出力・# で始まるまだ分からないの行を標準エラー・合格 0・不合格 1・まだ分からない 2）に揃える。
      形（関数と表）。pub fn overall（契約の InvariantCheck の slice を受けて契約の Verdict を返す）は、verdict が Violation の本が 1 本でも在れば Violation、無くて Unknown の本が 1 本でも在るか slice が空なら Unknown、ほかは Pass を返す（違反を先に立てる。中核の違反は読めた材料だけから名指すので、ほかの本がまだ分からないでも名指した違反は確かで、落とす側に立てる）。pub fn exit_code（Verdict を受けて u8 を返す）は Pass に 0・Violation に 1・Unknown に 2。pub fn design_view（&GraphDoc を受けて GraphDoc を返す）は、nodes を種類が中核の Source の Design の kinds に在る節点だけに（順は元のまま）、edges を型が EdgeType の ALL の先頭の DESIGN_EDGE_TYPES 個に在る辺だけに（順は元のまま・端の節点の在る無しは見ない＝索引の辺をそのまま写す）、unread を GraphSource の Design だけに絞り、beads と runs を空の表、invariants を空の列、skipped を design はそのまま・ledger は 0 にした値を返す。節点と辺は受けた値の clone を絞り、GraphNode と GraphEdge を struct の字で組まない。pub const NEXT（&str と &str の組の 12 個の配列）は不変条件の id と次の 1 手の字の組を INVARIANTS の順に持つ。字の例（歯は字を pin せず、id の並びと、空でなく改行を含まないことだけを見る）は、g-1 片端の無い辺の元の行（索引の辺・bead の依存・metadata）を直すか、消えた節点を戻す／g-2 契約の bead の acceptance に design = で始まる行をちょうど 1 つ置く／g-3 発効した記録の承認欄に台帳の id と裁定 id を書き、その bead の notes に裁定の行を置く／g-4 問いの bead の metadata の touches に関わる節点の id を 1 つ以上書く／g-5 bead に根の epic へ parent-child でたどれる親を付ける／g-6 blocks の輪を切り、parent-child の親を 1 つにする／g-7 裁定を問い（answers）か発効した記録（ruled_by）に結ぶ／g-8 memo の label か design = で始まる行のどちらかを外す／g-9 本文で名指した id を欄か辺に書く／g-10 重なった id の片方を改める／g-11 走行の run_of の先の bead を台帳に置くか、宙に浮いた走行を器で片付ける／g-12 Questioned の走行に問いを起こすか、走行の段を進める。
      書かない。tz graph は repo と state dir と台帳の file に何も書かない（読む部品は server と同じ・done (3) の歯が repo と state dir の byte で見る）。設計の索引の読みは server と同じく設計の道具の program を撃つ（既定 folio・--folio で替える）。folio の code の持ち込み（ADR-4 決定 (3)）の後の in-process の呼びへの替えは行 k の側。
      今の中核で出る rc（中核の check の code で確かめた）。UNMEASURED の 3 本はどの入力でも Unknown なので、今の中核の上の tz graph --check は、違反が在れば 1、無ければ 2（まだ分からない）を返し、0（合格）は出ない。これは FR3 の合格にしないの側に倒した形で（測れない本を合格に数えない）、g-3・g-7・g-9 を数える中核の行が着地して UNMEASURED が縮めば、この行の code を変えずに 0 が出る（overall の歯が 12 本とも Pass の列で Pass を見る）。受入基準 AC5 の前半（裁定の行を 1 つ消した fixture で違反 1 と id）は g-3 を数える行（発効した記録の承認欄の材料を設計の索引が運ぶ形が要る）の後で、違反の行と要約の行は id を問わない同じ形で出る。AC5 の後半（台帳の無い fixture で 2）と、pointer の行を 1 つ消すと違反 1 と id と次の 1 手が出る形は、この行が今数えられる g-2 で測る（done (5) と (6)）。
      節の 3 つの字（歯の中の定数・fixture の file は足さない）。設計の索引は 8 行をタブ区切りの列と改行でつなぐ字で、# で始まる見出しの行（節点）・節点の行 A-1（種類 条・file constitution.yaml・要約値 00000000・題 見本の条）・A-1.1（規範文・constitution.yaml・00000001・見本の規範文）・FR1（要件・srs.yaml・00000002・見本の要件）・# で始まる見出しの行（辺）・辺の行 A-1 から A-1.1 の in-article・A-1.1 から A-1 の in-article・FR1 から A-1 の refs（着地済みの fixture tests/fixtures/graph/no-state.json の欄 design_index と同じ行）。台帳は bd の出力の形の JSON の配列で bead 3 本、k（title 根・status open・issue_type epic）・k.1（title 契約・status open・issue_type task・acceptance_criteria は字 design = contracts/x.toml#a の 1 行・dependencies は depends_on_id が k で type が parent-child の 1 つ）・k.2（title 問い・status open・issue_type task・labels は intake:question の 1 つ・metadata は touches が FR1 の 1 つの object・dependencies は k への parent-child の 1 つ）で、どの bead も notes を持たない。k.1 の欄 acceptance_criteria を除いた台帳は、この台帳から k.1 のその欄だけを除いた字（k.1 の pointer の行が 0 になる）。event log は JSON の object の 1 行（schema 1・ts 2026-09-27T00:00:00Z・kind RunCreated・run k.1-20260927T000000Z・bead k.1・stage Intake）。
      節の値（上の build と check の決まりで数えた）。3 つとも読める組は、節点 7（設計 A-1・A-1.1・FR1、bead k・k.1・k.2（k.2 は問い）、走行 k.1-20260927T000000Z）と辺 7（in-article 2・refs 1・parent-child 2・touches 1・run_of 1）で、unread は空、g-3・g-7・g-9 が Unknown でほかの 9 本が Pass（違反 0・まだ分からない 3）。k.1 の acceptance_criteria を除いた組は g-2 だけが Violation で ids は k.1 の 1 つ、ほかは同じ（違反 1・まだ分からない 3）。bd の program が無い組は unread が ledger だけで、g-12 だけが Pass、ほかの 11 本が Unknown（g-1 は run_of の先の k.1 が節点に無く台帳が読めない・g-10 は重なりが無く読めない出所が在る・違反 0・まだ分からない 11）。--state-dir だけを省いた組は unread が runs だけで、g-1・g-2・g-4・g-5・g-6・g-8 の 6 本が Pass、g-10・g-11・g-12 と UNMEASURED の 3 本が Unknown（g-1 は走行の節点も run_of の辺も無く端の欠けた辺が無い・違反 0・まだ分からない 6）。--design の値は節点 A-1・A-1.1・FR1 と辺 3 本（in-article 2・refs 1・touches と parent-child と run_of は落ちる）で、設計の索引の部分は台帳と event log の字に依らないので、bd と event log の有無で変わらず、3 つとも読める組の board の graph の値を design_view に渡した値とも同じ。
      着地済みの歯（直すものは無い・直さずに通るもの・workspace を grep で確かめた）。境界の crate の main.rs を名指しで読む歯は tests/hbconf.rs の hbconf_main_parse_fills_the_rest_with_new だけで（面の crate の tests/acctframe.rs が読む src/main.rs は面の crate の file・src の全部を歩く歯は下の brand の歯）、字 Config::new が在ることと、字 Config と空白と開き波括弧の数が字 ..Config::new の数と同じことを見る。足す腕と doc の行はどちらの字も持たない。tz の binary を撃つ着地済みの歯は 4 つで、どれも最初の引数を surface にする。tests/server_min.rs の server_min_bind_refused_rc1 は surface serve に断る bind 先を渡して rc 1 と標準エラーの字 N-6 を見て、字 surface だけと、surface serve の要る引数の欠けと、住所と port の形でない bind 先で rc 1 を見る。tests/server_read.rs の server_read_tz_takes_state_dir_and_folio と tests/server_src.rs の server_src_tz_takes_bd_flag と tests/server_ask.rs の server_ask_failed_delivery_stays_200_with_stderr_line は、surface serve を 127.0.0.1 の空き port で立てて標準エラーの最初の行の住所を読み、空の値の旗（--bd と --state-dir と --folio と --bdw と --seat と --scribe2 の等号だけの形）で rc 1 を見る。足す腕は最初の字が graph のときだけ当たるので、surface serve の腕とほかの全部の腕に落ちる引数の扱いと標準エラーの字は変わらない。xtask の skeleton_boundary_std_only_and_bin_tz は境界の crate の Cargo.toml（依存の名と bin の名 tz）を読み、この行は Cargo.toml を触らない。境界の crate の lib.rs の字を名指しで読む歯は無い。境界の crate の src の下の dir を読む歯は 2 つで、tests/hbroute.rs の歯は src/server/routes の dir を読み（cli は server の外の module で口の file を足さない）、tests/brand.rs の brand_path_written_once_in_contract（第 3 波の行 g-brand・着地済み）は契約の型と境界と面の 3 つの crate の src の下の全部の rs の file を歩き、引用符で囲んだ字 /api/project が契約の型の crate の src/project.rs に 1 つだけ在ることを見る。この行が書く src の 4 つの file（lib.rs・main.rs・src/cli の 2 つ）は引用符で囲んだ字 /api/project を持たず、src/cli の 2 つは引用符で囲んだ /api/ で始まる字を持たないので、この歯の数は変わらない。src/server/board.rs の中の歯（server_read_doc_copies_verdicts・server_read_empty_texts_are_unread）と tests/server_read.rs の歯は board.rs の関数を呼ぶか口を撃つだけで、この行は board.rs と routes の file を書かない。面の crate は境界の crate を dev-dependencies で持つだけ（host の歯が server の ledger の parse を使う）で、wasm の組み立てに境界の crate は入らない。
      測り方。新しい歯は境界の crate の tests/kcli.rs に置き、名を kcli_ で始める。作業場は CARGO_TARGET_TMPDIR の下の kcli と歯の名の dir で、根の下に repo の dir・state dir（fleet/events.jsonl を置く）・3 つの字の file・偽の bd と偽の設計の道具（字の file を exec cat で出すだけの sh の script・std の os の unix の権限 0o755）を置く（着地済みの server_read.rs の Place と同じ形・偽の program と字の file は repo の dir の外）。binary は env の macro の CARGO_BIN_EXE_tz の path を std の process の Command で撃ち（着地済みの server_min.rs と同じ）、output の rc と標準出力と標準エラーを見る。電文は契約の wire の decode で GraphDoc に読む（境界の crate は serde_json に直に依存しないので、歯も wire を使う・歯は境界の crate の直接依存の tsuzuri_contract と tsuzuri_core を直に使える＝着地済みの server_read.rs と同じ）。比べの値は同じ字を持つ board の Texts を board の graph に渡した値（done (3)）と、その値を design_view に渡した値（done (7)）。書かないの歯（done (3)）は、撃つ前と後で repo の dir と state dir の下の file の path と字の一覧を比べる（着地済みの server_read.rs の fn tree と同じ形）。違反の行の歯は NEXT の g-2 の字を歯の中で引いて行の字を組む。純粋な関数の歯（done (1) と (2)）は InvariantCheck の列を歯の中で組み（violations と ids は verdict に合わせる）、run と design_view は型を書いた fn の値に束ねて形を見る。歯は GraphNode と GraphEdge と GraphDoc を struct の字で組まない（比べの値は board の graph と design_view が組む）。tests/fixtures/graph の直下の json の file（no-state.json ほか）は設計の索引と台帳と event log を 1 つの JSON に包んだ形で、serde_json を直に持たない境界の歯は包みを解けず、tests/fixtures/graph/real の実物の字は節の値の組にならないので、どちらも使わず、字は歯の中の短い定数にする（fixture の file は足さない）。
      filter の語（着地済みの行と第 3 波と第 4 波の行の verify の語・この行の接頭辞 kcli_ は並べない・69 語）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・qgate_・nsum_・hcard_ で、新しい歯の名から先頭の kcli_ を除いた字は、このどれも部分の字として含まない（例 kcli_graph_print・kcli_tz_check・kcli_server_same は不可）。名の例（どの語も含まない）は kcli_prints_same_doc_as_board・kcli_unread_runs_is_two・kcli_check_all_read_is_unknown・kcli_check_cut_line_names_k1・kcli_check_no_ledger_is_two・kcli_check_no_state_is_two・kcli_design_keeps_index_only・kcli_design_without_folio_is_two・kcli_overall_and_codes・kcli_next_follows_invariants・kcli_usage_errors_are_one・kcli_own_names_clean。
      依存は足さない。depends は無い。Cargo.toml は触らない（境界の crate は契約の型の crate と中核の crate を既に直に持つ）。契約の型の crate と中核の crate と面の crate と server の module の file は書かない（第 3 波の write-set の file も書かない）。
  - n: 4
    type: prose
    title: 行 h-cards-home — HOME の口座と移動の card・群の枠の詳しくと限度の数
    body: |
      なぜ。見本の account board の HOME（docs/design/mock3/account/index.html の render の home の枝）は、口座 × 窓の表の口座の名の欄（arows の class c-name の div）と移動の段の行（mvli の li）に hover の card を付け（window.__tz_card の acct と mv の枝・ui.js の card4 の 4 行と詳しく）、群の枠（over の class gcard の section）の見出しの横に限度で止まった session の数（class kpi-s の span・語の鍵 limited）を置き、枠の末尾に詳しくの段（class gmore の details・記録の数・出所・doctor の群の行・経験者の mode では初めから開く）を置く。群の枠そのものには card を付けず、見えていない情報は枠の中の詳しくへ置く（over の中の注記・持ち主の決め）。本番の HOME（便 h-home・src/account/home.rs）はどれも持たず、account board の card は 0 枚（src/account の下の file に use:attach の字は無く、src の全部で use:attach の字は project の pipeline.rs だけ・確かめた）。要件 FR14 は hover の card を 4 行（1 行 36 字）と「詳しく」、経験者向けの 1 行を 60 字と決め、card を出す要素を頁を持つ節点の札・圧縮された cell・記号だけの要素の 3 種に限る。口座の名の欄は口座の行を名と占有と 3 つの窓の棒に縮めた cell で、card が窓ごとの戻る時刻・model の名・その口座で動く session・出所を持つ。移動の行は群の記録 1 件を 1 行に縮めた cell で、card が記録の種類と出所の file を持つ。どちらも見本（判断の記録 ADR-7 で確定）が card を付ける要素。要件 FR12 は project の群が今の口座 1 つと候補の集合を持ち、次の移り先は器の doctor と同じ導出の値を写すと言い、詳しくの段の doctor の群の行は電文の今の口座と候補と次の移り先を doctor の行の形で並べる。
      在りか（着地済み・main の commit 9eef54d で確かめた）。src/account/home.rs は account の mod.rs の pub mod home で host でも組む。host の部分は Block の定数 NXALL・GROUPS（id groups・class gtop）・ALLOWANCE・MOVES と BLOCKS と body、pub const NONE（字 ―）・MARK_KINDS・UNKNOWN_KEY・NxMark・NxRow・marks・nx_row・next_all、Pw（欄 window・short・used）・Member（欄 project・sign）・UNKNOWN_SIGN・NO_RECORD_KEY・NO_TARGET_KEY、GroupView（derive は Debug・Clone・PartialEq・Eq・欄 name・account・recorded・since・previous・pressure・members・candidates・next_account・next）と pub fn group_view（&GroupCard と口座の行の slice の Option と電文の at を受け GroupView）、Occupant（Group・Free・Retired と class と text）・FREE_KEY（free_for_pipeline）・RETIRED_KEY（retired）・Cells・AcctRow（derive は同じ 4 つ・欄 label・occupant・cells）・ACCT_HEADS・ACCT_COLS・pub fn acct_row（&AccountRow と at を受け AcctRow・退役の行は先に返る）、MvRow（derive は同じ 4 つ・欄 at・group・from・to はどれも String・from が無ければ NONE・at は hmd の字）・Moves（欄 shown・folded・more）・SHOW_MV・mv_row・moves、読めないときの理由の字と 0 件の字、Home（欄 next・groups・accounts・moves）と pub fn home（電文から Home を組む・群ごとに group_view・口座の行ごとに acct_row）と content。use に project の seat の NG・OK・Sign・WINDOWS・WindowRow・hmd・short・window_row と vocab の label が在る。wasm の target のときだけの mod dom は next_view・groups_view（block の class と id の section の要素に group_card の列を置く）・group_card（class gcard の section・header に hs に語の鍵 group を渡した見出しと群の名・class gcur と gpw と projs の段・候補の ul・次の移り先の段）・allowance_view・acct_row_view（class c-name の div の中の class aname の span に名・占有の div・窓の欄）・meter・moves_view（block の class の details）・moves_body・mv_li（li に矢印と時刻と群と from → to）を持ち、use に crate::widgets::help の HelpCtx・h2・hs と crate::project の state_icon ほかが在る。next_view は use_context で HelpCtx の mode を受けている。GroupView・AcctRow・Moves・Home を struct の字で組む歯は無く、MvRow を struct の字で組む歯は着地済みの accthome_moves_fold だけ。group_view・acct_row・mv_row を呼ぶ所は home.rs の中だけ（src と tests を grep で確かめた）。
      hover の card（src/widgets/hover.rs・widgets の mod.rs の pub mod hover で host でも組む・この行は書かない・どの行の write-set にも無い）。pub struct Card（欄 title・kind・value・src は String・more は String の Vec・derive は Debug・Clone・PartialEq・Eq・Default・host でも組む）と Card の rows（4 行の class と字・36 字を超える行は 35 字と … に切る・more は切らない）。wasm の target のときだけの pub fn attach（引数は web_sys の Element と Card・返りは無し）は、context に HoverCtx が在れば要素に pointerenter と pointerleave の受け手を付け、指を置くと頁に 1 つの card の層に card を出し、出ると 150 ミリ秒の猶予で残すか消す（規則の行 R-20）。HoverCtx が無ければ何もしない。attach と、pub struct HoverCtx（欄は外から見えない・Default を持ち default で空の層の状態を作る）と、component の CardLayer（頁に 1 つの card の層の div・引数なし）は hover.rs の wasm の target のときだけの mod dom に在り、hover.rs が wasm の target のときだけ pub use で crate::widgets::hover の名として出す（host では 3 つとも無い）。block は view の要素に use:attach と等号と Card の値を書いて付ける（project の pipeline.rs の札が mod dom の中で crate::widgets::hover::attach を use してこの形で付けている）。account board の頁（src/account/board.rs の App・account の mod.rs の wasm の target のときだけの pub mod board）は既に provide_context(HoverCtx::default()) を呼び、view の末尾に <CardLayer/> を置き、tab の block の view はその App の中で組まれる。だからこの行は board.rs と account の mod.rs と widgets の下を書かずに card を出せる。
      「?」の注釈と mode（src/widgets/help.rs・この行は書かない・第 3 波の行 g-help-fig は着地済みで、足したのは fig_of と図の描きだけ）。pub fn shows_internal（crate::frame の Mode を受け bool・Mode の Expert のときだけ真・host でも組む）、wasm の target のときだけの pub struct HelpCtx（pub な欄 open と mode・mode は RwSignal の Mode・account board の App が context に置く）と pub fn hs（語の鍵の &'static str を受け AnyView・class hd の span に語と「?」）。HelpCtx と hs は help.rs が wasm の target のときだけ pub use で crate::widgets::help の名として出し、home.rs の mod dom は既に HelpCtx と h2 と hs を use している。この行はこの 3 つを呼ぶだけで、名と形を変えない。
      project の seat の module（src/project/seat.rs・build.rs が生成する pub mod で crate::project::seat・host でも組む・この行は書かない・着地済みの行 g-seat-axis が足したのは目盛と凡例の値と関数だけで下の 3 つは変えていない）。pub const WINDOWS（[&str; 3]・five_hour・seven_day・seven_day_model の順）・pub fn short（窓の名の &str を受け String・five_hour は 5h・seven_day は 7d・seven_day_model は model・知らない窓は字のまま）・pub fn hmd（時刻の EpochSecs と今の EpochSecs を受け String）。hmd は、2 つの EpochSecs を 86400 で割った商（UTC の日）が同じなら UTC の時と分を 2 桁ずつコロンでつないで Z を足した字（例 12:30Z）、違えば UTC の月と日を 2 桁ずつハイフンでつないだ字と空白 1 つをその前に足した字（例 09-29 12:00Z）。home.rs は既にこの 3 つを use し、group_view と mv_row が hmd を呼ぶ。kit の state_icon（&'static str の状態の値を受け AnyView・wasm の target のときだけ・値 limit で砂時計の記号）は crate::project から使え、home.rs の mod dom が既に use している。
      電文（crates/tsuzuri-contract の account.rs・board.rs・seat.rs・この行は書かない）。下の型はどれも pub で欄も全部 pub（derive は Debug・Clone・PartialEq と serde・MoveRow と GroupRow と QuotaUsed は Eq も）。EpochSecs は契約の型の crate の u64 の別名。Reading（board.rs の pub enum）は Known に値を持つか Unknown。SeatState（seat.rs の pub enum・Copy）。契約の型の crate の pub mod wire の pub fn decode（字の &str を受け、Deserialize の型の値の Result）で fixture の字を AccountDoc に読める（着地済みの accthome_ の歯も同じ読み）。AccountDoc は at・accounts（Reading の AccountRow の Vec）・groups（Reading の GroupCard の Vec）・moves（Reading の MoveRow の Vec）・projects・sessions（SessionLine の Vec）・dormant。AccountRow は label・retired・occupant（群の名の Option）・model（model の窓の model の名の Option）・usage（Reading の QuotaUsed の Vec・QuotaUsed は window・used_pct・resets_at の Option・counted）。GroupCard は row（GroupRow = group・account は今の口座・candidates・next_account・remaining）・since・previous・recorded・members（GroupMember = project・seat_account の Option・matches）・refused。MoveRow は at・group・from の Option・to。SessionLine は project・role・name・account の Option・state（SeatState = Run・Wait・Limit・Silent・Unknown）・stage・since・spans。中核の account の host.rs は群の枠を host の doctor の群の行と群の宣言の anchors と群の記録から組み（candidates は doctor の行の accounts の字をコンマで切った列・members は anchors の順）、移動の列は群の記録（groups の下の群の名 .account と history の下の記録）の account の記録だけを新しい順に並べる。中核の account の project.rs は orchestrator の session の state を席の card の state（器の値の写し・限度は Limit）から組み、pipeline の session の state は Run か Wait だけにする。
      語の辞書と stylesheet（確かめた）。crate::vocab の pub fn label（鍵の &str を受け String・辞書の見出しの語・無い鍵は「語彙表に無い」と鍵を括った字）と pub fn vocab（&'static Vocab を返す・Vocab の pub fn term は鍵を受け Option の &Term・Term の pub な欄 label は String）は host でも組む。vocab.json に語の鍵 limited（限度で止まった session）・p_more（詳しく）・accounts（口座）・occupant（占有）・moves（口座の移動）・free_for_pipeline（pipeline が使える）・retired（retired）・st_unknown（測れていない）が在る。style.css に規則 .kpi-s・.gmore と .gmore .gm・.gmore .gm1 と .gm1.src と .gm1.int・.gmore .xo（body の mode-expert のときだけ出す）・.gmore の summary の .rm-a・.rowmore の .rm-t が在る（見本の ui.css の写し）。
      形（host の部分・home.rs）。pub const EXPERT_CHARS（usize・60・要件 FR14 の経験者向けの 1 行）。pub fn wrap_words（字の &str と字数の usize を受け String の Vec）は、空白で区切った空でない語を順に並べ、今の行に空白 1 つと語を足した字の数（Unicode の scalar）が字数以下なら足し、超えるか行がまだ無ければ新しい行にする。字数を超える語は先頭から字数ごとの片に切り、片を語として扱う（どの行も字数を超えない・見本の doctorLine の 60 字の畳みに長い語の切りを足した形）。pub fn doctor_line（&GroupCard を受け String）は器の doctor の群の行の形（見本の doctorLine と同じ 6 つの欄の順）で、字 group= と群の名、accounts= と候補をコンマでつないだ字、anchors= と members の数、seat-accounts= と members の seat_account の在る値を初めに出た順に重ねずコンマでつないだ字（無ければ none）、current= と今の口座、next= と次の移り先（無ければ none）を空白 1 つで並べる。GroupCard の refused は読まない（見本の doctorLine も持たない）。pub struct GroupMore（欄 records・src は String・doctor は String の Vec・derive は Debug・Clone・PartialEq・Eq）と pub fn group_more（&GroupCard と電文の moves の &Reading の MoveRow の Vec を受け GroupMore）。records は moves が Known なら group が群の名と同じ行の数 n で字「記録 n 件」（見本の記録 1 件は移動の 1 行）、Unknown なら字「記録 ―」。src は字 groups/ と群の名と字「.account・host.toml の群の行」（見本の gm1 src の字）。doctor は doctor_line の字を wrap_words に EXPERT_CHARS で渡した行。pub fn limited（&GroupCard と &[SessionLine] を受け usize）は state が Limit で project が群の members のどれかの project と同じ session の数。GroupView に欄 limited（usize）と more（GroupMore）を足し、home の群の枠は群ごとに同じ GroupCard を limited（電文の sessions）と group_more（電文の moves）に渡した値を持つ（group_view の引数を替えるか home で埋めるかは実装が決めてよい）。
      pub const ACCT_SRC（字「fleet usage --show・doctor の口座の行」・server が口座の行を組む器の出力の名）と pub fn acct_card（&AccountRow と &[SessionLine] と電文の at の EpochSecs を受け Card）。title は口座の名。kind は語の鍵 accounts の語と「 · 」と、退役なら語の鍵 retired の語、占有が在れば語の鍵 occupant の語と空白と群の名、無ければ語の鍵 free_for_pipeline の語。value は、退役なら NONE、usage が Unknown なら語の鍵 st_unknown の語、Known なら WINDOWS の順に在る窓ごとの short と空白と used_pct と % を「 · 」でつないだ字（在る窓が 0 なら NONE・WINDOWS に無い窓は出さない）。src は ACCT_SRC。more は、退役でなく usage が Known のときだけ先に WINDOWS の順に resets_at の在る窓ごとの行（short と「 ↻ 」と hmd（resets_at と at）の字・seven_day_model の窓は model が在れば「 · 」と model を足す）を置き、退役でも Unknown でも最後に 1 行（字 session と空白と、account がその口座の名と同じ session の数・1 つ以上なら「 · 」と電文の順の初めの 2 つの name を「 / 」でつないだ字を足す）を置く（見本の acct の枝の more・見本の名の 22 字の切りは置かない・card の詳しくの行は Card の rows の 36 字の外）。AcctRow に欄 card（Card）を足し、home の口座 × 窓の行は電文の同じ行と sessions と at を acct_card に渡した値を持つ（acct_row の引数を替えるか home で埋めるかは実装が決めてよい）。pub fn mv_card（&MvRow を受け Card）は、title が from と「 → 」と to、kind が語の鍵 moves の語と「 · 」と群の名、value が「◷ 記録 」と at の字、src が字 groups/history/ と群の名と「 ほか」（見本の mv の枝の src の字）、more が空。MvRow・Moves・moves・mv_row の形は変えない。card の 4 行は着地済みの Card の rows が 36 字で切る。
