  - n: 3
    type: prose
    title: 行 c-pipe-unmapped — 器の段 Failed と Stopped を板の札にし、畳んだ記帳で段を決めない
    body: |
      在りかの main は 5095441（行 c-pipe-questioned〔便 t3-hub.52.70〕は 897e5db で、行 e-sess-closed〔便 t3-hub.53.22〕は d20f0d4 で着地済みで、この節の字はその後の code の値）。
      なぜ。器（scribe2）は run の終端を RunStage で書く。落ちた run は RunStage の段 Failed（detail は落ちた理由の字・例 oom-kill・runner-rc:1,commits:0・main-red・rebase-conflict）で、器の pipe retire は worktree を畳んだことを、段を動かさずに RunStage（段の欄は run の今の終端の段・detail は字 retired）で残す。中核の段の表 stage_of は RunStage の段 Failed と Stopped を持たないので、段を決める最後の event がそれらの走行は表に無い段として unmapped に数えられるだけで札にならない。台帳で閉じた bead なら閉じた札（段 Landed）になるが、open の bead の走行が器で落ちると（oom-kill・main-red ほか）その bead の札が板から消え、次の一手の止まっている走行（段 Failed と Stopped の札を数える）にも数えられない。さらに retire の記帳が最後の event になると、FAIL の審査の後に畳んだ走行は段 Gated（動いている列）の札になり、問いか審査の後に止めて畳んだ走行は unmapped になる。2026-09-28 に席が実物の event log で見つけた（行 c-pipe-questioned の起草で数えた・席の決め・計画 surface-plan の 3 節・欠陥の直しなので持ち主の問いを置かない）。要件 FR10（pipeline の板の Questioned/Failed/Stopped の列・止まっている便には理由が必ず付く）、FR11（次の一手の止まっている走行）、FR12（account board の session の表の段）。
      実物の形（2026-09-28 に器の state dir の event log 9 つ〔1322 の走行〕を読んで数えた・名は書かない）。段を決める最後の event が RunStage の段 Failed の走行は 20（detail は oom-kill 8・runner-rc の字 7・main-red 2・rebase-conflict 1・precheck の字 1・unknown 1）。detail が retired の RunStage で終わる走行は 38 で、段 Gated で直前の段の event が Gated の verdict:FAIL の字の 32、段 Stopped で RunStopped の後の 6（直前の段の event が Questioned の about の字の 4 と Gated の verdict:INCONCLUSIVE の 2）。今の 3 つの台帳ではこれらの走行の bead は全部閉じていて、板では閉じた札になる（台帳が読めない板では 3 つの bead の札が unmapped）。これからの open の bead の落ちた走行が板から消えるのを防ぐ行。
      在りか・器の書き方（器の source で確かめた）。器の段の型 Stage は Intake・Reviewed・Blocked・Spawned・Questioned・RateLimited・Implemented・Gated・Landed・Stopped・Failed の 11（Merging は無い）。pipe retire（器の pipe の retire の module）は worktree を寄せた後に種類 RunStage・段は呼び手が解いた run の今の終端の段・detail は字 retired の event を 1 件書き、doc に段を 1 つも動かさないとある（畳める run は Landed・Failed の rebase-empty と rebase-conflict・verdict が FAIL の Gated と、実物では RunStopped の後の Stopped）。pipe stop は種類 RunStopped（段 Stopped・detail は全部止めの理由の逐語か無し）を書き、止める前の印として RunStage（段は今の段・detail は字 stopping）を書く（この行は stopping を変えない・段は今の段のままなので板の段は変わらない）。
      在りか・板（src/pipeline.rs・write-set・main 5095441）。crates/tsuzuri-core/src/lib.rs の 16 行目は pub mod pipeline;。pub const STAGE_EVENTS・FAILED_VERDICTS（verdict:FAIL と verdict:INCONCLUSIVE）・PASSED_VERDICT（verdict:PASS）・ACCOUNT_TAG・CLOSED_TAG・CLOSED_CHARS・QUESTION_STOPPED と pub struct Board（pub な欄 board と unmapped）を持つ。pub fn stage_of（種類と段の名の Option と detail を受け、段と段の理由の Option の組の Option）の表は、RunDone を Landed、QuestionRaised と RunStage の段 Questioned を Questioned、RunCreated を Running、RunStage の Reviewed と Gated で detail が FAILED_VERDICTS のどれかで始まれば Failed（段の理由は detail の字）、RunStage の Gated を Gated、Reviewed で detail が verdict:PASS で始まれば Running、Spawned と Implemented を Running にし、ほか（RunStage の段 Failed・Stopped・RateLimited・Landed・Intake・Blocked・Merging と、段の名の無い RunStage と、種類 RunStopped ほか）は None。段の理由を持つのは Failed だけ。src/pipeline.rs の of_inputs は、event を log の順に読み、欄 run を持つ event のうち種類 RunCreated の最初の 1 件で走行を作り（bead は欄 bead か run の id の時刻の札の前の字）、作った走行の event ごとに detail の口座の札（字 account: の後・後ほど勝つ）を読み、種類が pub const STAGE_EVENTS（RunCreated・RunStage・RunDone・QuestionRaised の 4 種）の event で私的な struct RunState の欄 last（段を決めた最後の event）を替えて欄 stopped を偽にし、種類 RunStopped の event で stopped を真にする（RunStopped・RunCost・SeatSpawned・SeatStopped ほかは last を替えない）。札は bead の最初の RunCreated の順に 1 枚で、その bead のいちばん新しい走行の last を pub fn stage_of に通し、その値が段 Questioned で stopped が真なら段の理由を、pub const QUESTION_STOPPED（字 質問の後に止めた）に、last の detail が字 about: で始まりその後の前後の空白を除いた字が空でなければ全角の括弧で囲んだその字を添えた字にする（私的な fn question_stopped）。その後に閉じた bead の読み替えを当てる（stage_of の値が段 Landed ならそのまま、台帳にその bead が在って is_open が偽なら段 Landed と段の理由 pub const CLOSED_TAG〔字 closed:〕と閉じた理由の空白の続きを 1 つに畳み前後を除いた字の頭 60 字〔CLOSED_CHARS〕、どちらでもなければ stage_of の値で、None なら欄 unmapped に 1 足して札を作らない）。経過 elapsed_s は今から last の ts を引いた秒、口座は走行の口座の札の最後のもの。module の頭の doc の 6 行目の後の文は Stopped はこの便の入力に材料が無いので作らない。の字。#[cfg(test)] の lib の歯 stats_stage_of_closed_table（RunDone・Reviewed の PASS と空・Gated の turn:taken・Merging・RunCost・Gated の verdict:FAIL を見る）と stats_detail_account_takes_the_last を持つ。
      在りか・stage_of と板を使うほかの所（確かめた）。crate::next_step（src/next_step.rs・置き場だけの =・lib.rs の 15 行目 pub mod next_step;）の pub const STALLED_STAGES は Failed と Stopped で、私的な fn stalled_run は of_inputs の札のうち段が STALLED_STAGES に在り bead が台帳で open の札を数え、対象は経過のいちばん長い札の bead。crate::account::project（src/account/project.rs・置き場だけの =・lib.rs の 10 行目 pub mod account;）の 27 行目は use crate::pipeline::{ACCOUNT_TAG, FAILED_VERDICTS, stage_of}; で、pub fn session_lines は終わっていない（RunDone も RunStopped も無い）生きている（席が立っているか最後の event が ALIVE_S の 3600 秒以内）run のうち、project の字の欄 ledger の台帳が読めれば今閉じている bead の run を外し（私的な fn closed_beads・行 e-sess-closed）、残りの run ごとに、run の最後の段の event（pub const RUN_STAGE_EVENTS の 5 種の最後）を stage_of に通した段を行の段にし、上限の印（RunStage の段 RateLimited）なら状態 Limit、段が Questioned・Failed・Stopped でなく席が立っていれば Run、ほかは Wait にする。だからこの行の後は、段 Failed か Stopped の RunStage で終わる生きている run の行が、段 None と（席が立っていれば）状態 Run から、段 Failed か Stopped と状態 Wait になる。pub fn run_counts と run_counts_of は stage_of を呼ばず段の名の字で分ける（私的な const STOP_STAGES の Questioned・Failed・Stopped は今も stop に入る・変わらない）。pub fn runs_of（走行の頁）は欄 stage を持つ event を全部段の列にする（retired の記帳も 1 段・変わらない）。境界の server の口 /api/pipeline と next と account board の電文は中核の値をそのまま返す。面は段 Failed と Stopped の札を止まりの列（契約の Stage の column が QuestionedFailedStopped）に置き、面の fixture の pipeline-board.json は段 Stopped の札を 1 枚持つ（面は変えない）。
      形（src/pipeline.rs）。pub const RETIRED（&str・字 retired・doc は器が worktree を畳んだことを残す RunStage の detail の字で、器は段を動かさずに書くので板の段を決めない）を足す。stage_of の表に、種類 RunStage で段の名が字 Failed か Stopped（大文字の頭・字の全体が同じ）の腕を足し、段 Failed か Stopped と、段の理由は detail が空の字でなければ detail の字の全体、空なら None にする（Reviewed と Gated の FAILED_VERDICTS の腕はその前のまま・ほかの腕は変えない・RunStage の段 RateLimited・Landed・Intake・Blocked・Merging と小文字の段と段の名の無い RunStage と種類 RunStopped は今のまま None）。of_inputs の event の読みで、種類 RunStage で detail の字の全体が RETIRED の event は last を替えず stopped も替えない（STAGE_EVENTS の種類の event で last を替える条件に、この event でないことを足す・種類 RunStopped で stopped を真にする枝は今のまま）。口座の札は今のまま全部の event から読む。module の頭の doc の Stopped の文を、器の RunStage の段 Failed と Stopped は段 Failed と Stopped の札にし段の理由は detail の字にする（行 c-pipe-unmapped）・detail が RETIRED の RunStage は段を決めない、の旨に書き替える。STAGE_EVENTS・Board・board と of_inputs と runs_of の引数と返り・問いの後の読み（QUESTION_STOPPED）・閉じた bead の読み替え・走行の無い札の決まり・CLOSED_TAG の宣言の行は変えない。
      形（tests/pquest.rs・write-set・着地済みの歯の期待の直し）。pquest_table_arm の None を見る組の列（5 組）から、(RunStage・段 Stopped・detail retired) と (RunStage・段 Failed・detail oom-kill) の 2 組を外す（残りの 3 組〔RunStopped の段 Stopped・小文字の段 questioned・段の名の無い RunStage〕と、RunStage の段 Questioned と QuestionRaised の組は残す）。pquest_board_cards の期待の札の列の末（qa.7 の札の後）に qa.8（runs 1・段 Questioned・理由 質問の後に止めた（write-set）・口座無し・経過 2340）を足し、unmapped の 2 つの assert を 1 から 0 にする（qa.8 は RunStage 11:21 の段 Questioned〔about:write-set〕・RunStopped 11:22・RunStage 11:22 の段 Stopped〔retired〕の走行で、retired の記帳が段を決めないので段 Questioned の event が last・stopped が真）。doc の (1) と (2) の文を値に合わせる（(1) の止まりの段は表に無いの旨を RunStopped と小文字の段と段の名の無い event は表に無いの旨に、(2) の 7 枚と unmapped 1 を 8 枚と unmapped 0 に）。ほかの歯と節の組と FILTERS は変えない。
      決めた幅（起草の決め）。(a) detail が retired の RunStage は段を決めない。器は retire の記帳を段を動かさずに書く（段の欄は run の今の終端の段）ので、板はその前に段を決めた event で段を決める。retired で段を決めて段 Stopped にすると、問いの後に止めて畳んだ走行が段 Stopped・理由 retired の札になり、次の一手の止まっている走行に数えられて問いが隠れる（行 c-pipe-questioned の決めと持ち主の指摘 t3-hub.1〔裁定 id = user 2026-09-28T00:4xZ〕の向きに反する・試作で pquest_next_step_not_stalled が Hit・件数 1 に変わるのを確かめた）。また FAIL の審査の後に畳んだ走行の札が段 Gated のまま残る。(b) 段の理由は detail の字の全体を切らずに載せる（今の Failed の腕と同じ・面の札の run_line は why の頭 20 字で切る）。detail の無い RunStage の段 Failed と Stopped は理由 None（面は why に段の字を出す）。(c) 種類 RunStopped は今のまま段を決めない（Spawned の後に止めた走行は段 Running のまま・止めた走行を段 Stopped にするかは後の行で決める・この行の範囲の外）。(d) 段 RateLimited（器の上限の印・終端でない）・Landed・Intake・Blocked の RunStage は今のまま表に無い段。(e) 閉じた bead の読み替えは今のまま後に当てる（台帳で閉じた bead の落ちた走行は段 Landed で理由が字 closed: で始まる札）。(f) account board の session の表の段は stage_of の値なので、段 Failed か Stopped の RunStage で終わる生きている run の行は段 Failed か Stopped・状態 Wait になる。session_lines は retired の記帳を飛ばさない（この行は project.rs を書かない・終わった run は行が無く、段 Failed の後の retired は段 Failed のまま）。(g) 走行の頁（runs_of）と run の 4 列と Queued と Blocked の札は変えない。
