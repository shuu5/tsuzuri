  - n: 9
    type: prose
    title: 行 g-ask-around — 問いの card のつながりの段に近傍の図を埋め込む（中心は引数の id・初めて開いたときに読む）
    body: |
      なぜ。見本の ask.html の関数 qcard は card の最後に畳める段（class nb-d の details・最初は閉じる）を置き、中の class nb-body の div を空のまま出す。同じ file の script（注釈「つながりは開いたときに組む（段階的開示）」）は、段が初めて開いた toggle のときだけ、card の data-q の問いの key を ui.js の aroundBlock に渡した字を nb-body に入れ、2 度目からは組まない。aroundBlock は節点の頁（bead.html）の近傍の block と同じ関数で、畳みと段数の button・凡例・図・固定の帯・狭い幅の一覧・数の行を組み、段数と畳みは今の頁の URL の query の k と fold から読む。button を押すと今の頁の URL の query を置き換え（履歴に積まない）、頁の全部の図（class nb-wrap で data-origin を持つ要素）を組み直す。要件 FR6 は card の順の最後をつながり（畳む）とし、FR5 は近傍を根拠の側と影響の側の各 2 段とし、段数と畳みを URL に残す。本番の問いの card のつながりの段は、touches の id を字だけで並べるだけで図が無い。本番の節点の頁のつながりの block（nodearound）は同じ図を組むが、中心の id を今の URL の query の id から読むので、URL の id が名指しの問い（行 g-ask-focus）である問いの頁ではそのまま使えない。この行は nodearound の図を、中心の id を引数で受ける埋め込みの部品にして、問いの card の段が初めて開いたときにだけ口を読む。
      在りか（着地済み・main の 8693ad3 で確かめた・起草の 11d03d3 から後に変わったのは design-intent と docs だけ・file の行の数と行の番号には頼らず、名と字で引く）。src/project/nodearound.rs の wasm の target に限らない部分は、pub const BLOCK（id around・heading around・class panel）・PATH（字 /api/around）・PATHS（PATH の 1 つ）・FOLDS（空の slice）・REASON（空でない 1 行）・NOT_FOUND（u16 の 404）・K_CHOICES（1・2・3）・K_DEFAULT（2）と、pub fn path（id の &str と段数の u8 と Fold を受けて String・PATH の字の後に ?id= と mapview の encode で %XX にした id、段数が 2 でなければ &k= と段数、畳みが無しでなければ &fold= と up・down・both のどれか）・id_of（URL の query の &str を受けて Option の String・鍵 id の値が無いか空なら None）・k_of（query を受けて u8・1 から 3 のほかと無いときは 2）・fold_of（query を受けて Fold・up・down・both のほかと無いときは Fold の None）・with_k・with_fold・toggle・buttons・request（query を受けて Option の String・今は id_of の値の id と k_of と fold_of の値を path に渡した値の Some、id が無ければ None）と、pub enum PageState（NotRead・NotFound・Unread の &'static str・Doc の AroundDoc の 4 つ・derive は Debug・Clone・PartialEq・Eq）と、pub fn state（crate::view の Fetched（読みの結果の 3 値・NotRead と本文の String を持つ Body と Failed・host でも組む）の参照と Option の u16 を受けて PageState・状態の数が 404 なら NotFound、NotRead は NotRead、Failed は Unread の REASON、本文が AroundDoc として読めれば Doc、読めなければ Unread の NO_CONTENT）・unmeasured_reason（PageState の参照を受けて Option の &'static str・NotRead に NOT_READ・Unread にその理由・NotFound と Doc に None）。NOT_READ（字「この block の口をまだ読んでいない」）と NO_CONTENT は kit の pub const で、crate::project の path でも引ける。wasm の target のときだけの部分は、字 pub use dom::{ で始まる再公開の行（今は Source・mode_of・source・view の 4 つ）と、file の終わりまで続く mod dom。mod dom は leptos の prelude の全部（Owner・ArcRwSignal・StoredValue・Signal・RwSignal を含む）を use する。mod dom の pub struct Source（欄 search は URL の query の RwSignal の String・read は読みの ReadSignal の Option）と pub fn source（頁に 1 つ・thread_local に持ち、初めて呼んだ block が今の URL の query から RwSignal を作り、request が Some のときだけ net の read_path に request の値の path の signal を渡して読みを作る）は、節点の頁の 2 つの block（project の node と nodearound）が分ける。pub fn view（引数なし・AnyView を返す）は source の読みの状態で、測れていないは kit の section（BLOCK）の中に kit の unmeasured の 1 行、電文は section の中に fn panel の値、見つからないは何も出さない（見つからないの見出しは node の block が出す）。private な fn panel（AroundDoc と search の RwSignal と固定の RwSignal の Option の String と mode の関数を受けて AnyView）は、mapview の around の layout と svg で図の字を組み（file の中の字 layout(&doc と svg(&doc はここに 1 度ずつ）、畳みの button（押すと mapview の navigate で query の fold を置き換え・履歴に積まない）・段数の button（同じく k）・凡例・図の div（class nb-graph・hover と focus で光らせ、click で固定し、2 回押すと節点の頁へ）・固定の帯（class pinbar）・狭い幅の一覧（class nb-chain）・数の行（class cutline）・経験者向けの 1 行を class nb-wrap の div（属性 data-origin は中心の id）の中に組み、window の keydown の listener（Esc で固定を外す）を張って on_cleanup で外す。pub fn mode_of（search の RwSignal を受けて mode を返す関数）は HelpCtx の context の mode、無ければ query から読む。nodearound.rs に字 <details は無く、記録の関数の呼びも無い（記録の関数の名と開き丸括弧の並びの字は with_fold の中にだけ在り、前の字が下線）。
      src/project/ask.rs は、pub const PATH（字 /api/questions）・RULING_PATH（字 /api/ruling）・PATHS（その 2 つ）・FOLDS（字 ask:around:{} の 1 つ）・BLOCK（id ask）・LAYOUT（Slot の 6 つ・最後は部分 Around と class nb-d と語の鍵 around と最初は閉じる）と、pub struct Card（欄 id は BeadId・touches は String の Vec ほか）と pub fn body を持ち、その後に wasm の target のときだけの pub fn view（中は dom::view の呼びだけ）と mod dom が在る。mod dom の pub fn view（字「pub fn view() -> AnyView {」で始まる・引数なし）は、頭で今の URL の query を読み、net の read で口 PATH を読み、答えの状態の drafts（StoredValue）を作り、字「let list = move ||」で始まる closure で Body の Filled の card を 1 本ずつ fn card_view に渡して kit の section の中に置く。この closure は一覧の読みが変わるたびに走り直して card を全部組み直し、前の走りの中で作った signal と Effect は捨てられる。fn card_view と fn part_view は private で、part_view の字「Part::Around =>」の腕は、kit の fold を 1 度呼び（鍵は format! の字 ask:around:{} と card.id・初めの値は slot.open の偽）、details の要素（class=slot.class・prop:open=open・on:toggle=toggle）の中に summary（語の鍵 around の span と、touches の数の chip）と class nb-body の div（中に class items の ul と、touches の id を 1 つずつ class nid の span にした li）を置く。その次の item は fn answer_view。ask.rs は mapview の around も net の read_path も使わない。
      src/net.rs（wasm の target のときだけの module・この行は字を変えず、write-set に置き場だけの印 = で置く）の pub fn read_path（path の Signal の String を受けて、Fetched と Option の u16 の組の ReadSignal を返す）は、呼ぶたびに thread_local の WATCHES に場所を 1 つ足し、Effect で path の signal を見て、値が変わるたびに組を NotRead に戻して fn load_watch を呼び、知らせの接続を張る。fn load_watch は場所の path が空の字なら読まずに返す（字 if path.is_empty() { の後に return）。知らせの合図の reload_all は場所を全部 load_watch に渡し（空の path は読まない）、知らせが切れた lose_all は全部に Failed を置く。source は頁を開いたときの URL に id が無ければ読みを作らず、作った読みの path の signal も request が None なら空の字を返す（今の約束）。
      kit の pub fn fold（wasm の target のときだけ・鍵の String と initial の impl Fn() -> bool + Clone + 'static を受け、開きの closure と toggle の handler（impl Fn(web_sys::Event) + 'static）の組を返す）の開きの closure は頁の一生の thread_local の記録（Folds）を読むだけで signal でなく、toggle の handler は event の的の要素の属性 open の有無を記録へ書き戻す。だから段が開いたことを reactive に知るには、handler を包んで印を置く。mapview の current（今の URL の query）と navigate（query を変えて履歴に残し signal に置く・変える元は今の URL）は wasm の target のときだけ。leptos 0.8（Cargo.lock の reactive_graph は 0.2.15）では、Effect と arena に置く値（RwSignal・ReadSignal・StoredValue・Signal::derive の値）は作った時の owner に属し、その owner が捨てられる（closure が走り直す）と一緒に捨てられ、捨てられた signal を読むと落ちる。ArcRwSignal は owner に属さない。leptos の prelude は reactive_graph の owner の module の全部を再公開し、Owner::current() が今の owner を Option で返し、Owner の with が closure をその owner の下で走らせる。
      style.css に規則 .nb-wrap・.nb-graph・.nb-chain・.pinbar・.cutline・.nbctl・.legend・.empty と .qcard details が在る。幅 760 px 以下の規則のうちこの行の図に当たるのは .nb-graph を隠して .nb-chain を出す 1 つだけ（狭い幅は一覧で見せる・節点の頁と同じ）で、pinbar を隠す規則は class gpanel の下だけに当たる。tests/frame.rs の目印の class の表 MARKERS に nb-d と nb-body が在る。fixture の tests/fixtures/surface/around-doc.json は center FR1・steps 2・fold none・rows 6 つで、state に本文と Some の 200 を渡すと Doc になる（着地済みの nodepage_page_state と nodepage_keys_fixture_and_deps が見る値）。
      今の字の数（3 つの file の字を数えて確かめた・形の歯と変えないものの前提）。nodearound.rs は、字「mod dom {」が 1 度、字 pub use dom::{ が 1 度（その行の名は Source・mode_of・source・view）、字 layout(&doc と svg(&doc が 1 度ずつ（panel の中）、字 <details が 0、引用符で始まる /api/ の字が 1（PATH の値）、字 pub struct Embeds・pub fn embeds(・pub fn open(self・pub fn view(self・Owner::current()・embed_path(・embed_reason(・center_path(・NO_NODE が 0（字 state( と unmeasured( と panel( は今も host の state の定義と block の view と fn panel の定義に在るが、どれも Embeds の view の本文の範囲の外なので、その範囲を読む歯は数えない）。ask.rs は、字「pub fn view() -> AnyView {」と「let list = move ||」と「Part::Around =>」と「fn answer_view(」が 1 度ずつ、その view の頭から list の closure までに字 embeds() が 0、Part::Around の腕から answer_view までに、字 has_attribute( と .open( と .view( が 0、字 </details> が 1、字 class= と引用符で囲んだ nb-body の並びが 1、字 format!( と引用符と ask:around:{} の並びが 1、字 <details が 1、字 class= と引用符で囲んだ nid の並びが 1、字 <ul class= と引用符で囲んだ items の並びが 1、file の全体に字 mapview::around と read_path( が 0、字 <details が 1、記録の関数の呼びが 1。net.rs は、字 fn load_watch( が 1 度で、そこから次の字 spawn_local( までに字 if path.is_empty() { が 1 度。
      形（nodearound.rs・wasm の target に限らない）。pub fn center_path（中心の id の &str と URL の query の &str を受けて String）を足し、path に引数の id と query の k_of と fold_of の値を渡した字を返す（query の id の値は見ない）。request は id_of の値の id と query を center_path に渡した値の Some を返す形に書き直す（値は今と同じ）。pub fn embed_path（中心の id の &str と query の &str と開いたかの bool を受けて String）は、偽なら空の字、真なら center_path の値を返す（空の path は net が読まないので、開くまで口を読まない）。pub const NO_NODE（字の例「近傍の口がこの id の節点を見つけない（台帳か設計の索引が読めないか、節点が無い）」・空白だけでない 1 行・REASON と NOT_READ と NO_CONTENT のどれとも違い、vocab の見出しの語と同じ字でない）と pub fn embed_reason（PageState の参照を受けて Option の &'static str）を足し、NotFound に NO_NODE、ほかは unmeasured_reason の値を返す（埋め込みの図は見つからないも理由の 1 行で出す・節点の頁では見つからないの見出しを node の block が出すので unmeasured_reason は変えない）。どれも wasm の target のときだけの再公開の行と mod dom より前に置く。
      形（nodearound.rs・wasm の target のときだけ）。mod dom に pub struct Embeds（Copy・問いの頁に 1 つの埋め込みの図の置き場）と pub fn embeds（引数なし・Embeds を返す）を足し、再公開の行に Embeds と embeds を足す。embeds は今の URL の query から search の RwSignal を作り、Owner::current() の値（呼んだ block の owner の Option）と、中心の id ごとの印（開いたかの ArcRwSignal の bool）と読みの列を StoredValue に持つ（Owner は Clone で Copy でないので StoredValue の中に置き、Embeds の欄は search の RwSignal と StoredValue だけにして Copy にする）。Owner::current() の呼びは embeds の本文に直に書く（別の関数に分けない）。中心の id の場所が無ければ作り、読みは持った owner の下で（Owner の with で・持った値が None なら今の owner のまま）net の read_path に、search と印を読んで embed_path に中心の id と query と印を渡した値の path の signal を渡して作る（頁の一生の間、中心の id ごとに 1 つ・card の組み直しで作り直さず、捨てられない）。pub fn open（self と中心の id の &str を受けて何も返さない）はその id の印を真にする。pub fn view（self と中心の id の String を受けて AnyView）は、その id の読みの状態を state で決め、embed_reason が理由を返せば kit の unmeasured の 1 行、Doc なら fn panel（search は Embeds の search・固定の RwSignal はこの view で作る・mode は mode_of の値）の値を出す（section と見出しで包まない）。state と embed_reason と unmeasured と panel の呼びは Embeds の view の本文に直に書く（別の関数に分けない）。歯は字 pub fn embeds( と pub fn view(self のそれぞれから、その後の最初の字 fn と空白の並びまでを本文として読むので、この 2 つの本文の中（注釈を含む）に字 fn と空白の並びを書かない（本文の中に fn の定義を入れ子に置かない）。段数と畳みの button は panel のまま今の頁の URL の query の k と fold を置き換え、Embeds の search を読む全部の図が新しい path で読み直す（見本の nbRerender と同じ）。節点の頁の view と source は今のまま（図を組む所は panel の 1 つを分ける）。
      形（ask.rs）。project の下の module は組み立ての script が pub mod で宣言するので、ask.rs の mod dom から nodearound の Embeds と embeds を crate::project::nodearound の path で引ける（どちらも wasm の target のときだけで、ask.rs の mod dom も wasm の target のときだけ）。mod dom の view は、頭（字 let list = move || の closure より前）で nodearound の embeds を 1 度呼び、その Embeds を card_view と part_view に渡す。Part::Around の腕は、kit の fold の呼びを今の形（鍵は format! の字 ask:around:{} と card.id）のまま、返りの toggle の handler を別の名で受け、名 toggle の新しい handler（web_sys の Event を受ける）で包む。新しい handler は段が開いた event（的の要素が属性 open を持つ）なら Embeds の open に card の id を渡し、記録の handler を呼ぶ。属性 open の有無は kit の fold の handler と同じく event の的の要素の has_attribute で読み、字 has_attribute( を新しい handler の中に直に書いて、Embeds の open の呼びをその後に書く。新しい handler は fold の呼びの後、details の view より前に定義する（tag の on:toggle=toggle が名で引く）。details の tag の字は今のまま（class=slot.class・prop:open=open・on:toggle=toggle）。class nb-body の div の中は Embeds の view に card の id を渡した値に替え（view の呼びは div の中に直に書き、変数に組んでから置かない）、touches の id の ul と li は消す（id は図と狭い幅の一覧に出る）。summary（語の鍵 around と touches の数の chip）はそのまま。初めて開くまでは読みの path が空の字なので口を読まず、段の中は見えない。開くと読み、2 度目からは同じ読みを使う（閉じても開いても読み直さない・知らせの合図と段数と畳みの button では読み直す）。
      変えないもの。ask と nodearound の PATH・PATHS・FOLDS・BLOCK、ask の LAYOUT・Card・body・count・focus・anchor・card_class・target_number と mod dom の題の link と名指しの card を寄せる字、nodearound の path・id_of・k_of・fold_of・with_k・with_fold・toggle・buttons・state・unmeasured_reason・REASON・NOT_FOUND の値と、節点の頁の view と source と node の block の読み。2 つの file の view の名と、引数なしで AnyView を返す形（組み立ての script が生成する Module の view が呼ぶ）。ask.rs の details と記録の呼びは 1 つずつのまま、nodearound.rs に details の要素と記録の呼びを足さず、記録の関数の名と開き丸括弧の並びを doc にも書かない。引用符で始まる /api/ の字を足さない（口の path は PATH の定数から path が組む）。保存の口の名（localStorage・sessionStorage と字 cookie・大文字と小文字を問わない）を書かない。vocab の日本語の見出しの語を引用符で囲んだ字を書かない。字 class= に新しい class の名を書かない（使う class は style.css に在るものと目印の nb-body だけ）。pages の ask.rs と node.rs、project の node.rs、kit.rs、net.rs は書かない。
