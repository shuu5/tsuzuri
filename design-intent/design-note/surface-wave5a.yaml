  - n: 3
    type: prose
    title: 行 g-node-timeline — 節点の頁の run の時間軸
    body: |
      なぜ。見本の節点の頁（docs/design/mock3/bead.html）は、種類が契約・走行・epic の節点の頁の末尾に run の時間軸の panel を置く。panel の見出しは語の鍵 timeline（語 run の時間軸）で、横に走行の数の chip を置く。走行ごとに 1 行で、行の頭は走行の節点の頁への link（やり直しの印と回の数・走行の頁では数を出さない）、続けて段の chip を矢印でつなぐ。chip は続く同じ段を 1 つにまとめ、色は ui.js の STAGE_COL の表（待ち・動き・止まり・取り込み）から取り、段の審査の結びが PASS でなければ止まりの色にし、字は段の名と審査の結び、段の語の説明（語の鍵 stage: と段の名）を持ち、経験者向けに段と detail の字を持つ。本番の節点の頁（src/pages/node.rs の PAGE）の block は node と around の 2 つで（tests/snapshots/pages/node.json）、走行の時間軸は無い。要件 FR10 は、走行（run）は節点で、属性（段・段の理由・gate の verdict・審査・費用・時刻）は器の event log から読み、板と近傍図と問いの card が同じ id で連動するとする。要件 FR14 は英語の技術語を英語のまま出して「?」で注釈し、経験者向けの 1 行を 60 字とする。要件 NFR2 は読めないときは 0 件でなく測れていないと出すとする（この行は走行の口が読めないと、読めて 0 件を分けて出す）。着地済みの行 e-runs が走行の列の読みの口 GET /api/runs?bead= を足した。この行はその口を読む block を節点の頁に足す。
      在りか（契約の型・着地済みの行 e-runs・main の commit 11d03d3 で確かめた・この行は書かない）。契約の型の crate の src/runs.rs（crate::runs・どれも pub で欄も全部 pub・serde の rename なし）は pub const PATH（字 /api/runs）と、pub struct RunsDoc（欄 bead の ledger の BeadId・runs の board の Reading の Vec の RunLine・derive は Debug・Clone・PartialEq・Serialize・Deserialize）・RunLine（欄 run の String・started_at の Option の EpochSecs・account の Option の String・steps の Vec の RunStep・cost の RunCost）・RunStep（欄 at の Option の EpochSecs・stage の String・detail と verdict と verdict_kind の Option の String）・RunCost（欄 events の u32 と turns・wall_ms・tokens_in・tokens_out・cache_read・cache_create の u64）を持つ（RunLine と RunStep と RunCost の derive は Debug・Clone・PartialEq・Eq・Serialize・Deserialize・RunCost は Default も）。board の Reading は serde の kebab-case で、Known は鍵 known の object、Unknown は字 unknown。走行の並びは RunCreated の log の順、steps は欄 stage を持つ event ごとに 1 つで同じ段の続く event もまとめない（まとめるのは面）、verdict は detail の札 verdict: の残り、verdict_kind は札 kind: の残り、cost は RunCost の event の和。契約の型の crate の wire の pub fn decode（字の &str を受け Result の DeserializeOwned の値）で読む。
      在りか（境界の口・着地済み・この行は書かない）。src/server/routes/runs.rs の口は method GET と Exact の runs の PATH で、query の bead が無いか空なら 400 と字 no-bead、BeadId の new が Err なら 400 と字 id-shape、ほかは 200 で RunsDoc の電文を返す（event log が読めなければ runs は Unknown・log に無い bead は Known の空の列）。BeadId は ASCII の英数字と . と - と _ だけの 1 語・先頭は英数字・64 byte 以下。中核の graph の build の pub fn run_bead（run の id の &str を受け Option の &str）は、最後のハイフンで切った後ろが器の時刻の形（16 字・9 字目 T・16 字目 Z・ほかは数字）で前が空でなければ前を返し、導出グラフは走行の節点からその bead へ run_of の辺をこの決まりで引く（走行の節点の id は run の id）。口の組み立て（中核の pipeline の runs_of）は、RunCreated の event の欄 bead か、無ければ同じ決まりで run の id から出した bead が、query の bead と同じ走行を列に入れる。面の crate の直接依存は契約の型の crate だけで（着地済みの nodepage_keys_fixture_and_deps が pin する）、面は中核の run_bead を呼べないので、timeline.rs が同じ決まりの run_bead を持つ。
      在りか（面の節点の頁・main の commit 11d03d3 で確かめた）。src/pages/node.rs の PAGE（heading nb_self・class stack・nav None・badge false・icon 空）の columns は class stack の列 1 つに project の node の BLOCK と nodearound の BLOCK を並べる。frame の pub fn page（PageId を受け Page）と Page の block_ids、pub fn page_snapshot（PageId を受け String・block ごとに 12 字の字下げの行で id・heading・class を JSON の形に並べる）が頁の枠の値を返す。組み立ての script（build.rs）は src/project の mod.rs でない .rs の file ごとに pub mod を置き、列挙 Module と ALL（名の順・timeline は seat の後）・name・block・paths・folds・view（wasm の target のときだけ）を生成し、各 module の BLOCK・PATHS・FOLDS（host）と view（wasm の target のときだけの pub fn view、引数なしで leptos の AnyView を返す）を呼ぶ。board.rs の block_view は枠の id の同じ module の view を Module の ALL から選ぶ（この行は board.rs と build.rs を書かない）。
