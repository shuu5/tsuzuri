    title: 行 g-hist-ruling — これまでの決定の行から答えた決定の節点へ（answers の辺・字は時刻）
    body: |
      なぜ。見本の ask.html の「これまでの決定」（id hist の details）は、答え済みの問いを 1 行ずつ ui.js の itemNode で出し、行の右の小さい字（aside）に、その問いに答えた決定の節点（ui.js の rulingOf・問いへ入る型 answers の辺の from）の頁への link（class nl・字は決定の時刻）を置く。本番の段の行は kit の item_view で題を問いの節点の頁への link にしているが、右の字は状態の印と語と種類（例「● 完了 · task」）で、決定への link が無い。要件 FR6 は、答えは面の server が id（UTC の分つき）を発行して問いの bead の notes に定型行として追記するとし、FR2 は notes から導く あなたの決定 の節点と結びの型 answers の辺を導出グラフに組むとする。この行は段の行の右に、その問いに答えた決定の節点の頁への link を置き、link の字は見本と同じく決定の時刻（UTC の時と分に字 Z・例 13:00Z）にする（設計席の決め・server の形でない古い手書きの id は id のまま出す）。
      在りか（着地済み・main の 8693ad3 で確かめた・起草の 11d03d3 から後に変わったのは design-intent と docs だけ・file の行の数と行の番号には頼らず、名と字で引く）。src/project/askpage.rs は、use で tsuzuri_contract の board の Reading・ledger の LedgerList と LedgerRow・wire と、super の Body・Item・LEDGER_UNREAD・NOT_READ・item と、crate::frame の Block と、crate::view の Fetched（読みの結果の 3 値・NotRead と本文の String を持つ Body と Failed・host でも組む）と id_order を引き、pub const BLOCK（id hist・heading rulings・class fold panel）・PATHS（空の slice）・FOLDS（字 ask:hist の 1 つ）・OPEN（偽）・EMPTY・UNREADABLE・ROWS_UNKNOWN・HIGHLIGHT と、pub fn rows・rulings・count・body（Fetched の参照を受けて Body の Item の Vec・項は kit の item で組む）・opens・focus_index・row_selector を持つ。file の最後の item は wasm の target のときだけの pub fn view（引数なし・leptos の prelude の AnyView を返す・この file に mod dom は無い）で、中は順に、今の URL の query を読み、ask の focus で焦点を読み、net の read で ledger の PATH を読み、件数の chip、段の初めの値の closure（opens）、一覧の closure（Body の Filled のとき、焦点の項が在れば最初の 1 度だけ request_animation_frame の後に query_selector と set_attribute と scroll_into_view_with_bool(true) で行を光らせて寄せ、項を 1 つずつ super の item_view（number は None）に渡して class items の ul の中に並べる）、記録の関数の super の path での 1 度の呼び（鍵は引用符で囲んだ ask:hist に .to_string()）、details の要素（class=BLOCK.class・id=BLOCK.id・prop:open=open・on:toggle=toggle）の中の summary と一覧。
      kit（crate::project の path でも引ける）の pub struct Item（pub な欄 shape は印の class の String・alert は open の問いの印を赤にする bool・id と title は String・aside は状態の印と語と種類の String・derive は Debug と Clone と PartialEq と Eq）と pub const ALERT_STYLE（字 color:var(--s-stop)）は host でも組む。wasm の target のときだけの item_view（Item の参照と Option の usize を受けて AnyView）は li の要素を 1 つ組み、中は印の span（class は Item の shape・alert なら style に ALERT_STYLE・aria-hidden）と、class ttl の a（href は frame の node_href に項の id と mode・中に class nid の span の id と、属性 data-t の span の題）と、class aside の span（Item の aside の字）で、mode は HelpCtx の context の mode、無ければ今の URL の query を Mode の from_query で読んだ値（kit の private な mode_of）。Item の aside は字なので link を入れられず、kit.rs はこの行の write-set の外で、item_view の宣言の行は着地済みの歯 ilink_ が今の字のまま見る。frame の pub fn node_href（id の &str と Mode を受けて String・字 ?page=node&id= と %XX にした id と &mode= と mode の鍵）と Mode の from_query は wasm の target に限らない。HelpCtx（widgets の help・pub な欄 mode は Mode の RwSignal）は wasm の target のときだけ。
      グラフの口。project の map（src/project/map.rs）の pub const PATH は字 /api/graph（契約の型の GraphDoc を返す口・wasm の target に限らない）で、抜けの検査の頁の gaps の view も net の read に map の PATH を渡して読む（net の read は同じ path の読みを 1 つの signal で分ける）。askpage の PATHS は空の slice で、doc は「この file が字を持つ口の path（無い・台帳の口は ledger の module が持つ・行 hs-derived）」（今も ledger の PATH を読みながら空・ほかの module の口を読む所は数えない決まりは map と nodearound の PATHS の doc が書く）。契約の graph（tsuzuri_contract::graph・host）の GraphDoc は pub な欄 nodes・edges（GraphEdge の Vec）・unread・beads・runs・invariants・skipped を持ち、GraphEdge は pub な欄 from と to（String）と edge_type（EdgeType・電文の鍵は type）を持つ。EdgeType の Answers（電文の字 answers）は決定から問いへの辺。中核の graph の build は、台帳の bead の notes の定型行（頭の字「裁定 id = 」）ごとに決定の節点（種類 ruling・id は頭の字の後から最初の「・」まで）を 1 度だけ足し、その bead が問いなら決定の id から問いの id への answers の辺を足す（bead の順・notes の行の順で辺を足し、節点を辺より先に足す）。server の答えの書き（1 問は server の ruling・束は server の batch）は notes の終わりに行を足すので、同じ問いへの answers の辺が 2 本以上なら電文の順の最後が最も新しい決定。決定の id は server が発行する形か、それより前の手書きの形で、どちらも 1 つの問いの notes の行から導く。server の形は、境界の crate の src/server/ruling.rs の pub fn next_id（問いの BeadId の参照と notes の &str と分の &str を受けて RulingId の Result・契約の crate の surface の RulingId の for_question で字を組む）が組む「問いの id・字 :・分の字・字 -・1 から数える数」の字（例 lq.9:20260927T1300Z-1）で、分の字は同じ file の pub fn minute（epoch 秒を受けて String）が返す UTC の年月日 T 時分 Z（数字 8 つ・字 T・数字 4 つ・字 Z・例 20260927T1034Z）。束で答えた問いも 1 問ずつ next_id の id を持つ（束の id は字 batch で始まり、同じ行の別の欄に在り、節点の id にならない）。契約の BeadId の字は ASCII の英数字と . と - と _ だけなので、server の形の id に字 : は 1 つ。手書きの形は、fixture の t3.q2#r や、中核の graph の build の単体の歯の notes の例 user 2026-09-27T03:19Z のように別の形。電文の決定の節点（GraphNode・欄は id・kind・file・digest・title）は時刻の欄を持たず、時刻は server の形の id の字の中にだけ在る。
      fixture（確かめた・この行は書かない）。tests/fixtures/surface/graph-doc.json の edges に型 answers の辺は 1 本（from t3.q2#r・to t3.q2）だけで、節点 t3.q2#r は種類 ruling、t3.q2 は種類 question（beads の status は closed）。tests/fixtures/surface/ledger-questions.json の rows の known は lq.2・lq.10・lq.9・lq.3・lq.4 の 5 行で、askpage の body の項は lq.2・lq.9・lq.10 の順（着地済みの askcard_rulings_from_ledger_fixture が見る値）。2 つの fixture の id は互いに重ならない。style.css に規則 .items > li（flex）・.items > li > .ttl・.items > li > .aside（小さい字・右寄せ・幅は 45% まで）・.nid が在り、幅 760 px 以下でこれらを隠す規則は無い。
      今の字の数（確かめた・形の歯と変えないものの前提）。askpage.rs は、字「pub fn view(」が 1 度（上の view の宣言）で、そこから file の終わりまでに字 item_view( が 1 度、字 hist_rows( と ruling_links( と ruling_text( と map::PATH と node_href( と、字 <a class= と引用符で囲んだ ttl の並びと、字 <span class= と引用符で囲んだ aside の並びが 0。file の全体に字 HistEntry・hist_rows・ruling_links・ruling_text が 0、字 <details が 1、記録の関数の呼びが 1、引用符で始まる /api/ の字が 0、保存の口の名が 0。
      形。wasm の target に限らない pub fn ruling_links（Fetched の参照を受けて BTreeMap の String から String）を足す。Fetched の Body の字を wire の decode で GraphDoc に読めれば、edges を電文の順にたどり、edge_type が EdgeType の Answers の辺ごとに map に鍵 to・値 from を置く（後の辺が前の値を置き換えるので、同じ問いには最後の辺の from が残る）。NotRead と Failed と読めない本文は空の map。見本の ui.js の rulingOf は問いへ入る最初の answers の辺を取るが、見本の data は 1 問に決定が 1 つで、取り消して答え直した問いでは最後の辺が今の決定なので、この行は最後を取る。pub struct HistEntry（pub な欄 item は Item・ruling は決定の id の Option の String・derive は Debug と Clone と PartialEq と Eq）と pub fn hist_rows（Item の slice と Fetched の参照を受けて HistEntry の Vec）を足す（名 HistEntry は、project の seat の pub struct HistRow（口座の履歴の 1 行・欄 at・from・to の別の型）と重ねないための名）。hist_rows は ruling_links を 1 度だけ呼び、項の順のまま、item に項の写し、ruling に map の項の id の値の写しを置く。pub fn ruling_text（決定の id の &str を受けて String）を足す。id を最後の字 : で前と後に分け、前が空でなく、後が数字 8 つ・字 T・数字 4 つ・字 Z・字 -・1 つ以上の数字だけの並び（数字は ASCII の 0 から 9）なら、字 T の後の数字 2 つと字 : と次の数字 2 つと字 Z をつないだ字を返し、ほかの形（字 : が無い・前が空・後の形が違う）には id の写しを返す。見本の link の字は決定の時刻で、電文の時刻は server の形の id の字の中にしか無いので、server の形だけを読み、手書きの形は id のまま出す。年月日の値の範囲は見ない（形だけを見る）。どれも pub fn view より前に置く。view は頭で net の read に project の map の PATH を渡してグラフの口を読み（引用符で始まる /api/ の字を足さない・PATHS は空のまま）、mode を kit の item_view と同じ決め方（HelpCtx の context の mode、無ければ今の URL の query を Mode の from_query で読んだ値）で持つ。一覧の closure の Body の Filled の腕は、焦点の行を光らせて寄せる今の字をそのまま持ち、項を item_view に渡す代わりに、hist_rows に項とグラフの読みを渡した行を 1 つずつ li の要素にして class items の ul に並べる。li の中は kit の item_view と同じ 3 つ（印の span・class ttl の a（href は node_href に項の id と mode・中に class nid の span の id と data-t の span の題）・class aside の span）で、a と span の開きの tag は class を最初の属性に書き（字 <a class= と引用符で囲んだ ttl の並びと、字 <span class= と引用符で囲んだ aside の並び）、aside の span の中は、ruling が Some なら a の要素（href は node_href に決定の id と mode・中の字は ruling_text に決定の id を渡した値）、None なら Item の aside の字（グラフが読めないか、問いに answers の辺が無い）。字の歯が見る形として、class aside の span は 1 つで、その開きの tag の後に Some と None を分ける match か if を直に書く。決定の link の a の開きの tag は字 <a と空白で始め（class を書かない）、その tag の href に node_href の呼びを直に書き（mode は値でも closure でもよい）、a の中に ruling_text の呼びを直に書く（href や字を変数に組んでから置く書き方は歯が落とすので使わない）。ruling_text の呼びは view の字でこの 1 か所だけ。li を組む DOM は view の中か、view の後に置く wasm の target のときだけの private な fn に置く。グラフの読みが変わると一覧の closure が走り直して行を組み直す（台帳の読みの変わりと同じ）。1 つの項は 1 つの li のままなので、row_selector の位置の行は今と同じ。
      変えないもの。askpage の BLOCK・PATHS・FOLDS・OPEN・EMPTY・UNREADABLE・ROWS_UNKNOWN・HIGHLIGHT と rows・rulings・count・body・opens・focus_index・row_selector の値、view の名と引数なしで AnyView を返す形、焦点の行を光らせて寄せる字（opens・focus・focus_index・row_selector・query_selector・set_attribute・HIGHLIGHT・scroll_into_view_with_bool(true)）。details の要素と記録の呼びは 1 つずつのまま（鍵は ask:hist）で、記録の関数の名と開き丸括弧の並びを doc にも書かない。引用符で始まる /api/ の字と、保存の口の名（localStorage・sessionStorage と字 cookie・大文字と小文字を問わない）と、vocab の日本語の見出しの語を引用符で囲んだ字を書かない。字 class= に書く class は items・ttl・nid・aside（style.css に在る）だけで、印の class は Item の shape の値。kit.rs と ask.rs と map.rs は書かない。URL の id が決定の id を名指したときにその問いを引いて寄せる振る舞い（見本の ask.html の終わりの script）はこの行に入れない。
      着地済みの歯（直すもの）は無い。直さずに通る着地済みの歯（write-set の外・tests の下を grep で確かめた）。askpage.rs を名指しで字を読む歯は、tests/askfocus.rs の afocus_src_links_and_scroll（最初の「pub fn view(」から終わりまでに opens・focus・focus_index・row_selector・query_selector・set_attribute の名と開き丸括弧の並びと HIGHLIGHT と scroll_into_view_with_bool(true) が在る・この行はその字を残す）と、tests/askcard.rs の askcard_no_offscreen_storage_names。値の歯は、tests/askcard.rs の askcard_rulings_from_ledger_fixture（rows の 5 行・rulings と body の項 lq.2・lq.9・lq.10・count 3・OPEN・BLOCK）と askcard_empty_is_not_unmeasured（body と count の 0 件と測れていない）、tests/askfocus.rs の afocus_rulings_fold_opens（opens・focus_index・row_selector・HIGHLIGHT・OPEN）、tests/parts.rs の parts_ledger_lists_read_three_values（body の 3 値）で、この行はその関数を変えない。src の下を歩く歯と Module の ALL の file を読む歯のうち、tests/steady.rs の steady_details_use_fold_record（askpage.rs の字 <details の tag と記録の呼びが 1 つずつで鍵は ask:hist・tag は prop:open=open と on:toggle=toggle を持つ・呼びは記録の関数の名と開き丸括弧の並びのうち前の字が英数字と下線と点でなく fn の後でもない所で、直後が引用符でなければ落ちる・足す名 ruling_links と hist_rows と ruling_text はその並びを含まない）と、tests/hsderive.rs の hsderive_consts_match_note（askpage の PATHS は空・FOLDS は ask:hist・PATHS の行に引用符が無い）と、tests/parts.rs の parts_paths_distinct_in_block_modules（/api/graph の字は map.rs に 1 度だけ・askpage.rs は 0 のまま）と、tests/frame.rs の frame_classes_are_in_stylesheet（足す字の class は items・ttl・nid・aside で、どれも style.css の selector の名に在る）と frame_no_heading_words_in_code と frame_one_module_per_block（askpage.rs に id の hist）。tests/hsblock.rs の歯は askpage の BLOCK の値を見る（変えない）。tests/seatblock.rs は project の seat の HistRow を使う（この行の HistEntry とは別の名）。tests/itemlink.rs は kit.rs と gaps.rs の字を読み、tests/gapspage.rs は gaps.rs の字を読む（この行は書かない）。組み立ての script（build.rs）は src/project の file の名を読み、各 module の wasm の target のときだけの view を呼ぶ（名と形は変えない）。
      測り方。新しい歯は tests/hruling.rs に置き、名を hruling_ で始める。名の例は hruling_links_from_answers_edges・hruling_last_answer_wins・hruling_rows_carry_ruling・hruling_link_text_forms・hruling_src_row_links・hruling_own_names_clean。歯は CARGO_MANIFEST_DIR から ../../tests/fixtures/surface/graph-doc.json と ledger-questions.json を読む。節の組んだ電文は、graph-doc.json を wire の decode で GraphDoc に読み、edges の終わりに 4 本（from lq.9:20260927T1105Z-1・to lq.9・型 answers、from lq.10:20260927T1200Z-1・to lq.10・型 answers、from lq.9:20260927T1300Z-1・to lq.9・型 answers、from lq.4・to lq.2・型 touches）をこの順に足して wire の encode で字にした Fetched の Body。ruling_links はこの電文で鍵 t3.q2 に t3.q2#r・lq.9 に lq.9:20260927T1300Z-1・lq.10 に lq.10:20260927T1200Z-1 の 3 組だけ（touches の辺は数えない・lq.9 は後の辺）を返し、graph-doc.json の本文のままで鍵 t3.q2 と値 t3.q2#r の 1 組だけを返し、Fetched の NotRead と Failed と本文「not json」と ledger-questions.json の本文に空の map を返す。hist_rows は ledger-questions.json の本文を askpage の body で読んだ Body の Filled の項と、節の組んだ電文で、item の id が順に lq.2・lq.9・lq.10 で item は項と同じ、ruling が順に None・Some の lq.9:20260927T1300Z-1・Some の lq.10:20260927T1200Z-1 の 3 行を返し、同じ項と Fetched の NotRead、graph-doc.json の本文のままではどれも ruling が None の 3 行を返す。ruling_text の 14 の例は、時分を返す 4 つ（lq.9:20260927T1300Z-1 に 13:00Z・t3-hub.52.16:20260927T2233Z-1 に 22:33Z・fx.1:20260927T1034Z-12 に 10:34Z・a.b:c:20260927T0905Z-2 に最後の字 : の後を読んで 09:05Z）と、id の写しを返す 10（t3.q2#r・user 2026-09-27T03:19Z・fx.1:20260927T1034Z・fx.1:20260927T1034Z-・fx.1:2026092T1034Z-1・fx.1:20260927T10345Z-1・fx.1:20260927t1034Z-1・fx.1:20260927T1034Z-1x・:20260927T1034Z-1・空の字）。字の歯は src/project/askpage.rs を読み、最初の字「pub fn view(」から file の終わりまでの字（view の字）に、hist_rows( と map::PATH の字と、字 <a class= と引用符で囲んだ ttl の並びが在り、字 item_view( が無いことを見る。続けて view の字で、字 <span class= と引用符で囲んだ aside の並びの最初の所を s、字 ruling_text( の最初の所を r とし、s が r より前に在り、s から r までに字 </span> が無く、r より前の最後の字 <a と空白の並びの所が s より後に在り、その所から r までに字 node_href( が在って字 </a> が無いことを見る（決定の link が aside の span の中の a で、href が node_href の呼びで、中の字が ruling_text の呼び）。id を字にする誤った実装（ruling_text を呼ばない）、link を aside の span の外に置く実装、href を node_href で組まない実装は、どれもこの字の歯で落ちる。上の今の字の数のとおり、この字の歯は今の file では落ちる。足す関数と型の定義は view より前に置くので、範囲に定義の字は入らない。DOM の振る舞い（行の link）は host で撃てないので、xtask の surface-build と check（wasm の target の clippy を含む）が通ることで組めることを見る。
      filter の語。着地済みの行と第 3 波・第 4 波・第 5 波の行の verify の filter の語（contracts の契約の file の verify の行と、第 5 波の行の接頭辞から数えた・この行の接頭辞 hruling_ は並べない・78 語）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_ の 49 と、mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_ の 17 と、kcli_・hcard_ の 2 と、ntime_・ptitle_・ncard_・hsym_・smore_・lcard_・aaround_・sxaxis_・plimit_・bport_ の 10。新しい歯の名から先頭の hruling_ を除いた字は、この 78 のどれも部分の字として含まない（例 hruling_graph_x・hruling_question_x・hruling_uilink_x は不可）。歯 hruling_own_names_clean は tests/hruling.rs の字を読み、test の属性の行の次の fn の名を全部集めて見る。
      依存は足さない。Cargo.toml と vocab.json と style.css は触らない。depends は無い（行 g-ask-focus は着地済みで、同じ波の行 g-ask-around とは書く file が重ならない・g-ask-around は ask.rs を書くが、この行の view が使う ask の focus の名と形と値は変えない）。

