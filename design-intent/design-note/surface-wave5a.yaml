  - n: 4
    type: prose
    title: 行 g-title — project board の頁ごとの題
    body: |
      なぜ。見本の頁はどれも題を project の名と頁の語にする（docs/design/mock3 の index.html の title は tsuzuri と長い横棒と ホーム、ask.html は 質問、map.html は 地図、gaps.html は 抜けの検査・見本の project の名は tsuzuri）。節点の頁（bead.html）は節点が見つかれば題を project の名と長い横棒と節点の題にし、節点の題は ui.js の cut で 24 字に切る（24 字を超えれば先頭の 23 字と …）。見本の節点の頁の読む前の題（bead.html の title の 項目の頁）は、本番では頁の見出しの鍵 nb_self の語 この節点 にする（本番の節点の頁の見出しの語と揃える）。本番の project board の題は、着地済みの行 g-brand が置いた project の名と固定の board の語（字 project board）だけで、どの頁でも同じ字になり、窓の tab と履歴の一覧で今の頁を見分けられない。要件 FR1 は面を project ごとの project board と account board の 2 つとし、project board を account board から名前つきの新しい窓で開くとする（窓は project ごとに在り、頁は同じ窓の中で移る）。この行は頁の題を project の名と頁の見出しの語にし、節点の頁では読めた節点の題にする。見本の題の末尾の字（mock v3）は見本の印なので出さない。
      在りか（main の commit 11d03d3 で確かめた）。src/view.rs（host でも組む）は pub const BOARD_WORDS（字 project board）と pub fn kept_name（前の名の Option の String と Fetched の参照を受け Option の String）・pub fn brand（名の Option の &str を受け &str・名が在ればそれ、無ければ frame の BRAND の字 tsuzuri）・pub fn board_title（名の Option の &str を受け String・brand の字と空白と長い横棒 U+2014 と空白と BOARD_WORDS をつなぐ）を持つ（行 g-brand）。view.rs は frame の BRAND を use し、vocab をまだ use していない。crate::vocab の pub fn label（鍵の &str を受け String・辞書の見出しの語・無い鍵は字「〔語彙表に無い」で始まる字）は host でも組む。index.html の title は board_title の None の字（wasm が載る前の題・この行は書かない）。
      在りか（board.rs・lib.rs の wasm の target のときだけの pub mod board）。fn App は URL の query から頁（PageId の from_query）と mode の signal を作り、HelpCtx と HoverCtx を context に置き、台帳の一覧の口の読みから画面の状態の signal を作って provide_context(screen) で置き、top と頁の枠と注釈の層と card の層を描く。fn top（頁の PageId・mode・screen を受ける）は非公開の fn project_name を呼び、project_name は net の read に契約の型の crate の project の PATH を渡した読みの結果が変わるたびに名の signal を kept_name で進め、名が変わるたびに document の set_title に board_title の字を渡す（use の行に view の board_title が在る）。頁の定義は生成した PageId の pub fn def（self を受け frame の PageDef）で引け、PageDef の pub な欄 heading が頁の見出しの語の鍵（src/pages の各 file の PAGE の値・home は home・ask は questions・map は map・gaps は gaps・node は nb_self）。語の辞書の語は home が ホーム・questions が 質問・map が 地図・gaps が 抜けの検査・nb_self が この節点。account board は src/account/board.rs の mount で自分の題を置き、main.rs は URL の query の board で 2 つの board のどちらか 1 つだけを載せるので、この行は account board の題を変えない。
      在りか（節点の頁の読み・この行は nodearound.rs を書かない）。src/project/nodearound.rs の host の部分に pub enum PageState（NotRead・NotFound・Unread の &'static str・Doc の契約の型の AroundDoc・derive は Debug・Clone・PartialEq・Eq）と pub fn state（Fetched の参照と応答の状態の数の Option の u16 を受け PageState・状態の数が 404 なら NotFound・ほかは Fetched の NotRead が NotRead、Failed が Unread の REASON、本文が AroundDoc に読めれば Doc、読めなければ Unread の kit の NO_CONTENT）と pub const REASON が在り、wasm の target のときだけの pub fn source（頁に 1 つの近傍の読み・Source の pub な欄 search と read・URL に id が無ければ read は None）が在る。src/project/node.rs（build.rs が生成する crate::project::node・host でも組む）の host の部分は BLOCK・PATHS（空）・FOLDS（空）・NO_SUMMARY・NO_SRC・SUMMARY_KEYS・SUMMARY_NONE・Head・pub fn center（AroundDoc の参照を受け Option の AroundRow の参照・列 0 の行）・head・SumBox・summary・answer_href で、wasm の target のときだけの mod dom の pub fn view は source を呼び、read が None なら見つからないを出し、ほかは読みの結果を state に渡して頭と概要を描く。契約の型の AroundRow の pub な欄 node（GraphNode・pub な欄 title の String ほか）と col（i8）。題が長いときに切るのは doc_title（kept_subject は切らない）。
      形（view.rs）。pub const SUBJECT_CHARS（usize・24・見本の cut の 24）。pub struct PageSubject（Option の String の pub な欄 1 つの tuple の struct・derive は Debug・Clone・Default・PartialEq・Eq・Default は None）＝頁の見出しの語に替える字（節点の頁の節点の題）。pub fn doc_title（名の Option の &str と見出しの語の鍵の &str と subject の Option の &str を受け String）は、語を subject が Some で trim して空でなければ subject の字そのまま、ほかは label に鍵を渡した語とし、語の字の数（char の数）が SUBJECT_CHARS を超えれば先頭の SUBJECT_CHARS から 1 を引いた数の字と …（U+2026）にし、brand に名を渡した字と空白と U+2014 と空白と語をつないで返す。BOARD_WORDS・kept_name・brand・board_title の形と値は変えない（index.html の字と着地済みの brand_ の歯が見る）。着地済みの行 g-brand の節は、頁ごとの題を後の行 g-title が board_title を直して足すと書いたが、board_title の値は index.html の title（wasm が載る前の題）と着地済みの brand_title_joins_board_words が見るので、この行は board_title を直さずに doc_title を足す。
      形（board.rs）。App で PageSubject の Default を初めの値にした RwSignal の PageSubject を作って context に置き（頁の block が組まれる前・画面の状態の signal と同じ置き方）、頁の題の効果は名の signal と PageSubject の signal が変わるたびに、doc_title に名と頁の PageId の def の heading と PageSubject の欄を渡した字を document の set_title に渡す（board_title を呼ばない・use の並びから board_title を外す・使わない import は wasm の clippy の -D warnings で落ちる）。名の読みの形（net の read と kept_name）と header の題の span（brand の呼び）は変えない。PageId の変種の名（Ask・Map・Gaps・Node）を書かない（頁の語は def の heading から引く）。題の効果を置く関数は問わない（App・top・project_name のどこでもよく、PageSubject の signal を context から受けても引数で渡してもよい）。下の段の着地済みの歯が見る字（App の本文の 2 行・page_view の宣言・block_view の本文・戻るの部品の 6 つの字）は崩さない。
      形（node.rs）。host の部分に pub fn kept_subject（前の Option の String と nodearound の PageState の参照を受け Option の String）を足す。Doc なら center の行が在ってその node の title を trim して空でなければ Some の title（字はそのまま・切るのは doc_title）、中心の行が無いか title が空白だけなら None。NotFound なら None。NotRead と Unread なら前の値（近傍の読みが一度切れたり段数と畳みを変えて読み直したりする間も題を保つ）。mod dom の view は read が Some のとき、context に RwSignal の PageSubject が在れば、読みの結果が変わるたびに今の欄と state の値を kept_subject に渡し、値が今の欄と違えば PageSubject にして置く効果を足す（context が無ければ何もしない）。頭と概要の描き方と host の既存の関数は変えない。
      節の組（doc_title・名 proj-kiri）。名 無しと鍵 home と subject 無しで tsuzuri — ホーム。proj-kiri と questions で proj-kiri — 質問、map で proj-kiri — 地図、gaps で proj-kiri — 抜けの検査、nb_self で proj-kiri — この節点。nb_self と subject「project board を 1 枚の頁で見る」（24 字）で proj-kiri — project board を 1 枚の頁で見る（切らない）。subject が「あ」の 24 字ならそのまま、25 字なら「あ」の 23 字と …。subject が空の字と空白 3 つなら proj-kiri — この節点。どの例の横棒も U+2014 で前後に空白 1 つ。
      節の組（kept_subject）。歯は着地済みの fixture tests/fixtures/surface/around-doc.json（center FR1・中心の行は列 0 の FR1・title は「project board を 1 枚の頁で見る」）を読み、nodearound の state に本文と 200 を渡して Doc を作る。前 無しと Doc で Some の「project board を 1 枚の頁で見る」、前 x と Doc でも同じ、前 x と NotRead で x、前 x と nodearound の REASON の Unread で x、前 x と NotFound で None、列 0 の行を除いた Doc で None、中心の行の node の title を空白 1 つにした Doc で None。
      着地済みの歯（直すもの）。tests/brand.rs の brand_top_reads_name_and_sets_title は board.rs の字に 5 つの字（tsuzuri_contract::project::PATH as PROJECT_PATH・net::read(PROJECT_PATH)・kept_name(・set_title(・board_title(）が在ることと、class の値が name の span の中身に brand( が在ることと、波括弧で囲んだ BRAND が無いことを見る。この行は board.rs で board_title を呼ばなくなるので、5 つ目の字を doc_title( に替える（ほかの字と見方は変えない・file の doc の行に行 g-title の 1 行を足してよい・歯の名と FILTERS の列は変えない）。
