s/parts.rs の parts_ledger_lists_read_three_values、tests/frame.rs の frame_blocks_without_data_are_unmeasured）は LAYOUT・Card・body・count の値を見て、この行は変えない（touches は Card に残り、summary の chip が数を出す）。tests/askcard.rs の askcard_page_frame_and_nav と tests/nodepage.rs の nodepage_frame_and_nav は、問いの頁と節点の頁の枠（frame の page の block の並び・nav・tests/snapshots/pages の下の字）を見て、この行は frame.rs と pages の下と snapshot を書かない。組み立ての script（build.rs）は src/project の file の名を読み、各 module の wasm の target のときだけの view を呼ぶ（名と形は変えない）。project の node.rs は nodearound の PageState・id_of・mode_of・source・state・unmeasured_reason を使い、この行はその名と形を変えない。
      測り方。新しい歯は tests/aaround.rs に置き、名を aaround_ で始める。名の例は aaround_center_path_from_param・aaround_lazy_path_until_opened・aaround_embed_reason_states・aaround_net_skips_empty_path・aaround_src_embeds_in_nodearound・aaround_src_ask_fold_embeds・aaround_own_names_clean。center_path の 4 つの例は、id qa.2 と query「?page=ask&id=qa.10&mode=beginner」で「/api/around?id=qa.2」、id qa.2 と「?page=ask&id=qa.10&k=3&fold=up&mode=expert」で「/api/around?id=qa.2&k=3&fold=up」、id e.2:20260927T0000Z-1 と「?k=1&fold=both」で「/api/around?id=e.2%3A20260927T0000Z-1&k=1&fold=both」、id FR1 と「?page=ask&k=9&fold=side」で「/api/around?id=FR1」（知らない k と fold は既定）。request は query「?page=node&id=FR1&k=3&fold=up&mode=expert」と「?page=node&id=e.2%3A20260927T0000Z-1」と「?page=node&id=FR1」のそれぞれで、id_of の値と query を center_path に渡した値の Some と同じで、「?page=node」で None。embed_path の 4 つの例は、id qa.2 と「?page=ask&id=qa.10&k=3&mode=beginner」で偽に空の字・真に「/api/around?id=qa.2&k=3」、id qa.10 と「?page=ask」で偽に空の字・真に「/api/around?id=qa.10」。embed_reason は PageState の NotRead に NOT_READ、Unread の REASON に REASON、Unread の NO_CONTENT に NO_CONTENT、NotFound に NO_NODE、fixture の around-doc.json の本文を state に Some の 200 と渡した値に None を返し、unmeasured_reason は NotFound に None を返す。NO_NODE は空白だけでなく改行を含まず、REASON・NOT_READ・NO_CONTENT と違う。net.rs の歯は CARGO_MANIFEST_DIR から src/net.rs を読み、字 fn load_watch( の最初の所から次の字 spawn_local( までに字 if path.is_empty() { が在ることを見る。nodearound.rs の歯は src/project/nodearound.rs を読み、最初の字「mod dom {」から file の終わりまでの字に pub struct Embeds・pub fn open(self・embed_path( の字が在り、字 pub fn embeds( の最初の所から、その字の後の最初の字 fn と空白の並びまでに字 Owner::current() が在り、字 pub fn view(self の最初の所から、その字の後の最初の字 fn と空白の並びまでに字 state( と embed_reason( と unmeasured( と panel( が在り（範囲の終わりの字 fn と空白の並びが無ければ file の終わりまで）、最初の字 pub use dom::{ から次の字 }; までに字 Embeds と字 embeds が在り（大文字と小文字は別の字なので、Embeds の字は embeds を含まない）、file の全体の字 layout(&doc と svg(&doc の数がどちらも 1 で、字 <details の数が 0 であることを見る。ask.rs の歯は src/project/ask.rs を読み、字「pub fn view() -> AnyView {」の最初の所から次の字「let list = move ||」までに字 embeds() が在り、字「Part::Around =>」の最初の所から次の字「fn answer_view(」までの腕の字で、字 format!( と引用符と ask:around:{} の並びの最初の所、その後の最初の字 has_attribute(、その後の最初の字 .open(、その後の最初の字 <details、その後の最初の字 class= と引用符で囲んだ nb-body の並び、その後の最初の字 .view( がこの順に在り、その .view( が nb-body の並びの後の最初の字 </details> より前に在り、腕の字 <details の数が 1 で、字 class= と引用符で囲んだ nid の並びと、字 <ul class= と引用符で囲んだ items の並びが無く、file の全体に字 mapview::around と read_path( が無いことを見る。段を開く前に読む誤った実装（has_attribute の前に open を呼ぶ）、図を nb-body の外に置く実装、Embeds の view に図を組ませない実装（panel を呼ばない）は、どれもこれらの字の歯で落ちる。上の今の字の数のとおり、これらの字の歯は今の file では落ちる。足す host の関数と定数の定義は mod dom より前に置き、Embeds は mod dom の中に置くので、範囲を取り違えない。DOM の振る舞い（段を初めて開いたときに読む・図の button・組み直しで読みを作り直さない）は host で撃てないので、xtask の surface-build と check（wasm の target の clippy を含む）が通ることで組めることを見る。
