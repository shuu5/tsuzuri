  - n: 5
    type: prose
    title: 行 g-card-node — 地図の札と一覧の行の題の節点の card（共有の組み方は widgets の nodecard）
    body: |
      なぜ。要件 FR14 は hover の card を 4 行（1 行 36 字）と「詳しく」と決め、card を出す要素を頁を持つ節点の札・圧縮された cell・記号だけの要素の 3 種に限る。地図の頁の圧縮の面の札と一覧の面の行の題は、どれも節点の頁を持つ節点の札で、行 g-link-map（着地済み）が節点の頁への a の要素にした。見本（docs/design/mock3 の map.html の tag と compact の条の札の頭と規範文の子と一覧の行の a の class ttl）は、この 4 つの a に data-key を付け、ui.js の cardContent の節点の枝が card4 の 4 行（題・種類と帯と状態の行・id と要約の行・出所の file の行）と詳しく（出所の全部の字）を出す。本番で card を付けているのは project の pipeline.rs の札と account の home.rs の口座と移動の行だけで、src/mapview の下の file に use:attach の字は無い（grep で確かめた）。この行は、電文の節点 1 つから card を組む関数を widgets の下の新しい file nodecard.rs に置き、地図の圧縮の面の札（帯の札・条の札・規範文の子・beads の種類の行の札）と一覧の面の行の題の a に付ける。関数を widgets に置くのは、後の行（pipeline と次の一手・問いの card と問いの頁・台帳と抜けの頁の節点に card を付ける行）が同じ id と電文から同じ card を引くため（kit の node_item が電文と id から札の値を引くのと同じ形の card_of を置く）。
      在りか（HEAD 11d03d3 の main で確かめた・起草の 9215c08 の後の着地 2 本（行 c-next-batch と h-proj-more）は中核の next_step.rs と account の projects.rs とその歯と fixture だけを書き、この行が読む file と書く file は変わらない）。hover の card（src/widgets/hover.rs・widgets の mod.rs の pub mod hover・host でも組む・この行は書かない）。pub struct Card（pub な欄 title・kind・value・src は String・more は String の Vec・derive は Debug・Clone・PartialEq・Eq・Default）と Card の pub fn rows（4 つの class と字の組の配列を返す・class は r ti・r k・r v・r src の順・字は clip に通した字）。pub fn clip（&str を受け String）は Unicode の scalar で数えて 36 字（pub const ROW_CHARS）以下ならそのまま、超えれば 35 字と「…」（pub const ELLIPSIS）にする。more は rows の外で切らない（着地済みの parts_hover_rows_clip が詳しくの 90 字を切らないことを見る）。wasm の target のときだけの pub fn attach（引数は web_sys の Element と Card・返りは無し）は、context に HoverCtx が在れば要素に pointerenter と pointerleave の受け手を付け、指を置くと頁に 1 つの card の層に card を出し、出ると 150 ミリ秒の猶予で残すか消す（規則の行 R-20）。HoverCtx が無ければ何もしない。attach と pub struct HoverCtx（欄は外から見えない・Default を持つ）と component の CardLayer（引数なし）は hover.rs の wasm の target のときだけの mod dom に在り、hover.rs が wasm の target のときだけ pub use で crate::widgets::hover の名として出す。block は view の要素に use:attach と等号と Card の値を書いて付ける（pipeline.rs の札は use:attach=card.hover.clone() の形、home.rs の口座の名の欄は use:attach=card の形・どちらも mod dom の中で crate::widgets::hover::attach を use する）。
      project board の頁の枠（src/board.rs・wasm の target のときだけ・この行は書かない）。App は provide_context(HoverCtx::default()) を呼び、view の末尾に <TipLayer/> と <CardLayer/> を置き、main の要素の中で page_view に頁を渡して頁の view を組む。地図の頁（src/pages/map.rs）の block は project の map.rs の mod dom の view で、その中の closure が圧縮の面は mapview の compact の view に電文を、一覧の面は list の view に電文と URL の query の RwSignal の String を渡す（map.rs はこの行は書かず、2 つの view の名と引数と返りは変えない）。だから地図の面の要素に attach を付ければ card は出る。
      電文（契約の型の crate の graph.rs・この行は書かない）。pub struct GraphDoc（pub な欄 nodes（GraphNode の Vec）・edges・unread（GraphSource の Vec）・beads（id から BeadAttr の BTreeMap）・runs（id から RunAttr の BTreeMap）・invariants・skipped）、pub struct GraphNode（pub な欄 id・kind（NodeKind）・file（String の Option）・digest（String の Option）・title（String）・derive は Debug・Clone・PartialEq・Eq と serde）、BeadAttr（pub な欄 kind・status（String）・labels・pointers・touches）、RunAttr（pub な欄 stage と account・どちらも String の Option）。file は設計の索引の節点だけが持ち、台帳と走行の節点は持たない（graph.rs の GraphNode の doc）。契約の型の crate の pub mod wire の pub fn decode（字の &str を受け、Deserialize の型の値の Result）で fixture の字を GraphDoc に読める。まだ着地していない第 4 波の行 c-summary-design が GraphNode に欄を足すので、この行の src と歯は GraphNode を struct の字で組まない（欄への代入だけで変える）。
      地図の部品（src/mapview の下・host でも組む）。mapview の mod.rs の pub fn state（&GraphDoc と &GraphNode を受け、電文の寿命の &str の Option を返す・帯が beads なら beads の属性の status、pipeline なら runs の属性の stage、ほかと属性の無い節点は None）。band.rs（この行は書かない）の pub enum Band（7 つ・Copy）の pub fn name（constitution・rules・ADR・SRS・design-note・beads・pipeline）と pub fn path（constitution は design-intent/constitution.yaml・rules は design-intent/rules.yaml・ADR は design-intent/adr/ADR-n.yaml・SRS は design-intent/srs.yaml・design-note は design-intent/design-note/*.yaml と「・」と docs/design/*.md・beads は .beads/issues.jsonl・pipeline は <state dir>/fleet/events.jsonl）と pub fn band_of（NodeKind を受け Band）と pub fn kind_key（NodeKind を受け &'static str・20 の種類の語の鍵・例 k:条・k:契約・k:走行）。語の鍵の語（vocab.json・この行は触らない・確かめた）は k:条 が 条、k:規範文 が 条の文、k:規則行 が rule、k:要件 が requirement、k:判断の記録 が ADR、k:設計ノートの行 が design-note の行、k:契約 が task、k:問い が question、k:memo が memo、k:裁定 が あなたの決定、k:方針 が 全体への指示、k:走行 が run。crate の vocab の pub fn label（鍵の &str を受け String）は host でも組む。
      compact.rs（write-set・着地済みの行 g-link-map が最後に書いた）。host の部分は TAG_TITLE_MAX・cut30・Tag（pub な欄 id・title・class・shape・alert・derive は Debug・Clone・PartialEq・Eq）・Article（pub な欄 tag と norms（規範文の id の String の Vec））・Lane・Cards（Unmeasured・Empty・Tags・Articles（articles と loose）・Lanes）・BandBox（class と ids）・pub fn tag（&GraphDoc と &GraphNode を受け Tag）・pub fn compact（&GraphDoc を受け BandBox の Vec）・article_of と非公開の band_box・natural_tags・articles・lanes。Tag を組むのは tag だけ、Article を組むのは articles だけ（src と tests を grep で確かめた・Tag と Article と Row を struct の字で組む歯も分けて組む歯も無い）。wasm の target のときだけの mod dom（字 mod dom { は file に 1 度）に pub fn view と非公開の box_view・cards_view・tag_head・tag_view が在る。tag_view は a の要素（開きの tag の字は <a class=t.class.clone() href=href で始まる）で tag_head を包み、条の札は div（class art7 と帯の class）の中の a で tag_head を包み（字 {tag_head(&a.tag)}</a>）、規範文の子は kids の div の中の a（字 {id}</a>）。href はどれも frame の node_href の字。
      list.rs（write-set・g-link-map が最後に書いた）。host の部分は BAND_PARAM ほかの鍵・pub const NO_STATE（字「状態なし」）・pub const NO_GIST（字「要約なし」）・Sort・Query（from_search）・Row（pub な欄 id・title・shape・alert・band・kind・state・derive は Debug・Clone・PartialEq・Eq・state_word）・PairNote・Listing（rows ほか）・pair_ends・state_rank・pub fn listing（&GraphDoc と &Query を受け Listing）と非公開の row。Row を組むのは row だけ。mod dom（字 mod dom { は file に 1 度）の非公開の row_view は li の中の rowb の div に、id の span（class nid）と題の a（開きの tag の字は、字 <a class= と引用符で囲んだ ttl と空白と href= で始まる）と meta と要約の欄を置く。
      widgets の mod.rs（write-set）は module の doc と pub mod fig・pub mod help・pub mod hover の 3 行だけ。
      形（host の部分・新しい file src/widgets/nodecard.rs・host でも組む・target の cfg を付けない）。widgets の mod.rs に pub mod nodecard; を足し（fig・help・hover の 3 行は残す）、module の doc に節点の card を足す。nodecard は crate::mapview の state と band の band_of・kind_key・Band と list の NO_STATE・NO_GIST、crate::vocab の label、crate::widgets::hover の Card を使う（mapview の compact と list がこの module を use し、この module が mapview を use する。同じ crate の中の module の間なので組める）。
      pub fn short_path（&str を受け String）。字の最初の「・」より前の字（「・」が無ければ全部）を斜線で区切り、片が 3 つ以上なら「…」と斜線の 2 字に末尾の 2 片を斜線でつないだ字を足した字、2 つ以下ならその字を返す（見本の ui.js の baseName と同じ切り方・片が空でない path で同じ結果）。
      pub fn node_card（&GraphDoc と &GraphNode を受け Card）。title は節点の title を空白（改行とタブを含む Unicode の空白）で区切った語を空白 1 つでつないだ字で、空なら節点の id（36 字の切りは Card の rows に任せる）。kind は label に kind_key の鍵を渡した種類の語、「 · 」、band_of の Band の name、「 · 」、state の字（None なら NO_STATE）をつないだ字（見本の card の 2 行目の種類と帯と状態の語・記号は描かない）。value は節点の id と空白 1 つと NO_GIST（要約は電文にまだ無い・見本の 3 行目の要約なしと同じ）。src は節点の file が在ればその字、無ければ band_of の Band の path を元の字とし、元の字を short_path に渡した字（見本の card は出所を必ず持つ・台帳と走行の節点は帯の path を出所にする）。more は src が元の字と違えば元の字 1 つだけ、同じなら空（見本の card4 の srcFull）。
      pub fn card_of（&GraphDoc と id の &str を受け Option の Card）。電文の nodes を前から見て id の同じ最初の節点の node_card の値、無ければ None。
      fixture の値（tests/fixtures/surface/graph-doc.json・着地済み・この行は触らない・確かめた）。34 の節点を持つ。歯が使う節点は、P-1（kind 条・file design-intent/constitution.yaml・title 常に守ること）、P-1.2（規範文・同じ file・title 条の文 P-1.2）、ADR-10（判断の記録・file design-intent/adr/ADR-10.yaml・title 十番目の判断）、ADR-2（判断の記録・file design-intent/adr/ADR-2.yaml）、FR14（要件・file design-intent/srs.yaml）、R-4（規則行・file design-intent/rules.yaml・title は abcdefghij を 4 つ並べ、1 つ目と 2 つ目の間だけ空白 2 つ、ほかは空白 1 つの字）、R-25（規則行・title 面の crate の直接依存）、surface-board と g-map をシャープでつないだ id と surface-board と g-frame をシャープでつないだ id（どちらも note-row・file contracts/surface-board.toml）、t3-hub.9（task・file なし）、t3.q10（question・file なし）、t3.m1（memo）、t3.p（policy・beads の属性なし）、r-1 と r-12（run・file なし）。beads の属性は t3-hub.9 が in_progress、t3.q10 と t3.m1 が open（t3.p は無い）。runs の属性は r-1 の stage が Landed、r-12 の stage が無し。電文の unread は空。fixture の全部の節点の card の kind は 35 字以下・value は 26 字以下・src は 31 字以下で、title を 36 字で切るのは R-4 だけ（全部の節点で数えて確かめた）。
      形（host の部分・compact と list）。compact の Tag に pub な欄 card（Card）を足し、tag が node_card にその節点を渡した値を置く。Article に pub な欄 norm_cards（Card の Vec）を足し、articles が norms と同じ順で規範文の節点ごとに node_card の値を置く（norms は String の Vec のまま・着地済みの mapview_compact_bands_and_tags_in_order が norms を String として読む）。list の Row に pub な欄 card（Card）を足し、row が node_card の値を置く。ids・compact・listing の値と順、Tag・Row のほかの欄は変えない。
      形（DOM・mod dom の中）。4 つの a の開きの tag は、今の属性の後、閉じ山括弧の直前に use:attach と等号と card の値を 1 つだけ書く（字は次のとおりに決め、歯 ncard_dom_wiring がこの字で見る）。compact の tag_view の a は <a class=t.class.clone() href=href use:attach=t.card.clone()> の形。条の札の closure（Article の値 a を受ける）は、規範文の子を a.norms.into_iter().zip(a.norm_cards) で id と card の組にして組み（norms と norm_cards を動かした後も a.tag は使える）、規範文の子の a を <a href=href use:attach=card>{id}</a> の形、条の札の頭の a を <a href=href use:attach=a.tag.card.clone()>{tag_head(&a.tag)}</a> の形で書く。list の row_view の題の a は、字 <a class= と引用符で囲んだ ttl と空白と href=href と空白と use:attach=r.card.clone() と閉じ山括弧の形。どの tag も、着地済みの歯 mlink_ が見る字（<a class=t.class.clone() href= と {tag_head(&a.tag)}</a> と {id}</a> と、字 <a class= と引用符で囲んだ ttl と空白と href=）を残す。2 つの mod dom の use に crate::widgets::hover::attach を足す。新しい class と語の鍵は足さない。
      出さない物。要約（要件 FR15・電文に無い・後の行 g-summary が value と詳しくに足す）、出所の行の番号（電文に無い）、経験者向けの行（見本の card の種類の内部の名と要約の出所）、外の台帳の chip、走行の card の回数と段と理由（見本の data-run の枝）、0 件の帯の SRS と run の card（後の行 g-map-tips）、グラフの面の節点と表の面の cell の card（後の行）、pipeline・次の一手・問い・台帳・抜けの頁の節点の card（後の行 g-card-adopt）。card の層の出し方（pointer の入りと出・猶予）は hover.rs のまま変えない。
      着地済みの歯（直すもの）。無い。
      着地済みの歯（直さずに通る・write-set の外・tests の下の全部を grep で確かめた）。mlink_compact_tags_are_anchors は compact.rs の字 mod dom の最初の所から後に、node_href の呼びと、字 <a class=t.class.clone() href= と字 {tag_head(&a.tag)}</a> と字 {id}</a> が在り、file に字 <div class=t.class.clone()> と <span>{id}</span> と「節点の頁はまだ無い」が無いことを見る。mlink_list_title_is_anchor は list.rs の同じ所に node_href の呼びと、字 <a class= と引用符で囲んだ ttl と空白と href= が在り、file に字 <span class= と引用符で囲んだ ttl と閉じ山括弧、と「節点の頁はまだ無い」が無いことを見る。この行は 4 つの a の開きの tag の、class と href の後に use:attach を足すだけなので、どの字も残り、消えた字は戻らない。mlink_hrefs_open_same_id は compact の ids と listing の行の id を読む（変えない）。mapview_ の歯（mapview_compact_bands_and_tags_in_order・mapview_unread_band_is_unmeasured_and_zero_band_is_empty・mapview_list_filters_and_sorts・mapview_every_tag_and_row_shows_id・mapview_table_counts_and_pair_filter ほか）は compact と listing の値の id・数・class・norms の字を 1 つずつ見るだけで、Tag・Article・Row を struct の字で組まないので、足す欄で崩れない。mapview_classes_and_keys_exist は map.rs と mapview の下の 8 つの file の、字 class と等号と引用符で始まる所の class の名が stylesheet に在ることと 29 の名が集まることを見る（この行は class の字を足さず消さない）。mapview_landed_shape_and_body は Cargo.toml の直接依存が契約の型の crate だけであることを見る（足さない）。hfig_names_and_svg_some は widgets の mod.rs の字に pub mod fig; が在ることを見る（残す）。frame_classes_are_in_stylesheet と frame_no_heading_words_in_code は src の全部の file（新しい nodecard.rs を含む）を歩く。nodecard.rs は class の字を持たず、足す literal の「 · 」「…/」「・」は語の辞書の見出しの語と同じ字でなく（語の辞書を読んで確かめた）、種類の語は label で引き、状態なしと要約なしは list の const を使う（新しい literal にしない）。parts_paths_distinct_in_block_modules と境界の brand_path_written_once_in_contract は src の引用符で囲んだ /api/ の字を数える（この行は足さない）。parts_hover_ の歯は hover.rs の関数を見る（変えない）。steady_・hsblock_・hsderive_・hspage_ は src/project・src/pages・kit.rs・board.rs・build.rs を、mapgraph_・gnav_ は graph.rs と graph/dom.rs を、mkeys_ は project の map.rs を、nodepage_ は近傍の関数を、hcard_ は home.rs と account の board.rs を読み、この行はどれも書かない。tests/snapshots の頁の写しは頁の枠と block の並びだけを持つ。
      測り方。新しい歯は tests/ncard.rs に置き、名を ncard_ で始める。歯は fixture の字を CARGO_MANIFEST_DIR から ../../tests/fixtures/surface/graph-doc.json として読み、wire の decode で GraphDoc にする（着地済みの mlink_ と mapview_ と同じ読み）。変えた電文は歯の中で fixture を写し、節点の file と title への代入、beads の BTreeMap から除くこと、beads の status と runs の stage への代入で作る（GraphNode を struct の字で組まない）。short_path・node_card・card_of・compact・listing・Card の rows は host で呼ぶ。ncard_short_path_rules は CARGO_MANIFEST_DIR から src/widgets/mod.rs の字も読み、done (1) の 4 つの pub mod の行を見る。DOM は wasm の target のときだけなので、ncard_dom_wiring は CARGO_MANIFEST_DIR から src/mapview/compact.rs と list.rs と src/board.rs の字を読み、2 つの mapview の file は字 mod dom { より後を DOM の部分とし、tag は <a から次の閉じ山括弧まで（閉じ山括弧を含む）の字として、tag の末尾の字が上の形の 4 つの use:attach の字と閉じ山括弧であることと、compact の DOM の部分に字 zip(a.norm_cards が在ることを見る（付ける card が札・条・規範文・行のそれぞれの card であることを字で見る・Card の値そのものは done (6) の host の歯が見る）。DOM が組めることは xtask の surface-build で見る。自分の名の歯は tests/ncard.rs の字を読み、test の属性の行の次の fn の名を全部集め（着地済みの mlink_names_stay_apart と同じ読み方）、名の数が 7 以上であることと done (9) を見る。fixture は足さない。
      filter の語（着地済みの 49 の語・第 3 波の 17・第 4 波の 4・第 5 波のほかの行の 10・この行の接頭辞 ncard_ は並べない・80 語）。accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・hcard_・qgate_・nsum_・ntime_・ptitle_・hsym_・smore_・lcard_・aaround_・hruling_・sxaxis_・plimit_・bport_。新しい歯の名から先頭の ncard_ を除いた字は、このどれも部分の字として含まない（例 ncard_graph_x・ncard_mapview_x・ncard_stage_x は不可）。名の例（どの語も含まない）は ncard_short_path_rules・ncard_node_card_on_fixture・ncard_rules_on_changed_docs・ncard_card_of_every_node・ncard_tags_and_rows_carry_cards・ncard_dom_wiring・ncard_names_stay_apart。
      依存は足さない。Cargo.toml・vocab.json・style.css・fixture は触らない。hover.rs・board.rs・project の map.rs・mapview の mod.rs と band.rs は読むだけで書かない。compact.rs と list.rs は第 5 波のほかの行の write-set に無く、widgets の mod.rs はこの波ではこの行だけが書く。
  - n: 6
    type: prose
    title: 行 g-help-sym — 「?」の注釈の記号の見本と幅の置き換えの字
    body: |
      なぜ。要件 FR14 の plain は説明を短く記号と図で表すと言い、語の辞書の注釈の行は先頭に記号の見本の名（波括弧で囲んだ名）を持つ。見本（docs/design/mock3 の ui.js の symHTML）は、この名を実物と同じ class の小さな要素に替えて描く（凡例が実物と同じ class で描かれ、実物が変われば凡例も変わる）。本番の「?」の注釈（src/widgets/help.rs の mod dom の sym_view）が描くのは状態の記号（名が st とコロンで始まる物）だけで、ほかは名の最後の語を字で出す（例 gi と ok の見本は字 ok になる）。行 g-help-fig（着地済み）は図の行だけを描いた。この行は、見本の gi（検査の丸の印）・nxm（次の一手の札）・thr（閾値の印）・tk（管理 tick の印）・band（帯の形）の 5 つを見本と同じ class の字で描く。もう 1 つ、語の鍵 history の注釈は置き換えの字 {SPAN}（2 度）と {TICK}（1 度）を持ち、見本の tipContent は注釈を出すときに今の稼働の記録の幅（URL の query の span）の字に替える（24h なら 24 時間と 6 時間ごと）。本番は字のまま出す（inline が Sym の SPAN と TICK にし、sym_view が字 SPAN と TICK を出す）。この行は注釈を出すときに同じく替える。
      在りか（HEAD 11d03d3 の main で確かめた・起草の 9215c08 の後の着地 2 本（行 c-next-batch と h-proj-more）は中核の next_step.rs と account の projects.rs とその歯と fixture だけを書き、この行が読む file と書く file は変わらない）。src/widgets/help.rs（write-set・行 g-help-fig が最後に書いた）の host の部分は、pub enum Inline（Text・Code・Sym・どれも String を持つ・derive は Debug・Clone・PartialEq・Eq）、pub struct Line（pub な欄 sym と text・どちらも Inline の Vec）、pub struct Note（pub な欄 label（String）・head（Inline の Vec）・items と more（Line の Vec）・internal（Inline の Vec の Vec））、pub fn note（鍵の &str を受け Option の Note・vocab の term を note_of に渡す）、pub fn note_of（&Term を受け Note・term の note を改行で分け、行「▸」の前の 1 行目を head に、残りの空でない行を items に、後の空でない行を more に、internal を改行で分けた空でない行を inline に通す）、pub fn line（字を受け Line・先頭の波括弧の名か 1〜3 字の語を sym に、残りを text に）、pub fn inline（字を受け Inline の Vec・波括弧で閉じた名を Sym・逆引用符で閉じた字を Code・ほかを Text）、pub fn fig_of・tip_class・place・shows_internal。wasm の target のときだけの mod dom は HelpCtx・TipLayer・qmark・term・h1・h2・hs と非公開の inline_view・sym_view・lines_view を持つ。sym_view は、名が st とコロンで始まり後の値が project の STATES に在れば state_icon の記号を返し、ほかは名をコロンで区切った最後の語を span の字にする。lines_view は図の行を li（class figli）の inner_html に fig の svg の字を置いて描き、ほかの行は li の中に class sy の記号と class it の本文を置く。TipLayer は開いた語の鍵を note に渡した値を、見出しの語・head（class n1）・items・more（details の class more・経験者の mode では開く）・経験者の mode の internal（class int）の順に描く。語の辞書の crate::vocab の pub fn vocab（&'static Vocab）と Vocab の term（鍵を受け Option の &Term）と keys、pub struct Term（pub な欄 label・note・internal はどれも String・derive は Debug・Clone・PartialEq・Eq）は host でも組む。
      稼働の記録の幅（src/project/seat.rs・build.rs が生成する pub mod で crate::project::seat・host でも組む・この行は書かない・着地済みの行 g-seat-axis が足した）。pub enum Span（H24・H6・H3・derive は Debug・Clone・Copy・PartialEq・Eq・pub const ALL）、Span の pub fn key（24h・6h・3h）と pub fn secs（86400・21600・10800）と pub fn tick（目盛の間の秒・21600・3600・1800・見本の SPANS の tick と同じ）、pub fn span_of（URL の query の &str を受け Span・frame の param で鍵 span の値を読み、無いか知らない値は H24・param は先頭の疑問符を除いて読むので、疑問符の在る query も無い query も読める）。project の seat の block と account の session の tab は、幅の button を押すと URL の query の span をその幅の key に置き換える（頁は読み直さない）。語の鍵 history の見出しは seat の block の稼働の記録の段に在る。
      帯（src/mapview/band.rs・host でも組む・この行は書かない）。pub enum Band（7 つ・Copy・pub const ALL）の pub fn from_name（&str を受け Option の Band・name と同じ字の Band）と pub fn name（constitution・rules・ADR・SRS・design-note・beads・pipeline）と pub fn class_name（band-constitution・band-rules・band-adr・band-srs・band-design-note・band-beads・band-pipeline）。
      語の辞書の記号の見本の名（vocab.json・この行は触らない・全部の鍵の注釈を読んで確かめた）。gi とコロンと ok・ng・unknown（鍵 gaps・gap_ok・gap_ng・gap_unknown・members・seat_match・seat_mismatch・seat_none・state_now・nx_a ほか）、nxm とコロンと on とコロンと c・off とコロンと d・na とコロンと e（鍵 next_all・nx_na）、thr とコロンと 85・95（鍵 pressure・five_hour・seven_day ほか）、tk とコロンと healthy・stale・absent・unreadable（鍵 tick_health・st_silent）、band とコロンと constitution・beads（鍵 status・bands・lg_shape）。置き換えの字は鍵 history の注釈だけに在り、1 行目の要点が「直近 」と {SPAN} と「の session の状態を帯で見る」、行「▸」の後の 5 つ目の行が「{strip:ticks} 目盛 = 」と {TICK} と「ごと」、6 つ目が「← 左端 = 」と {SPAN} と「前」。ほかの名（st・strip・edge・hb・cand・badge・net・ic・occ・fig）はこの行の外。
      style.css の規則（確かめた）。.gi・.gi.ok・.gi.ng・.gi.unknown・.gi.sm、.nxm・.nxm.on・.nxm.na と li.off（class の名 off）、.thrs と .thrs i、.tkhb・.tkhb .tk・.tkhb .tk-healthy b・.tkhb .tk-stale b・.tkhb.smpl・.smpl、.shape・.shape.fill と帯の 7 つの class（band-constitution ほか）が在る。見本の symHTML が tk の absent と unreadable に付ける class の tk-absent と tk-unreadable は style.css に規則が無い（見本の ui.css にも無い）ので、この行はこの 2 つの値では class を tk だけにする。
      形（host の部分・help.rs）。pub fn span_words（Span を受け String）は Span の key の字の h を「 時間」に替えた字（24 時間・6 時間・3 時間・見本の spanKey の replace と同じ）。pub fn tick_words（Span を受け String）は Span の tick の秒が 3600 で割り切れれば 3600 で割った数と「 時間」、ほかは 60 で割った数と「 分」（6 時間・1 時間・30 分・見本の SPANS の tickL と同じ字）。pub fn fill（&str と Span を受け String）は字の中の全部の {SPAN} を span_words の字に、全部の {TICK} を tick_words の字に替える。pub fn note_in（語の鍵の &str と URL の query の &str を受け Option の Note）は、vocab の term が None なら None、在れば Term の label はそのまま、note と internal をそれぞれ span_of に query を渡した Span で fill に通した Term を note_of に渡した値。note・note_of・line・inline・fig_of・tip_class・place・shows_internal の名と形と値は変えない（着地済みの frame_help_note_splits_lines と hfig_fig_of_note_lines が note と line と inline の値を見る）。mod dom が pub use で出す HelpCtx・TipLayer・qmark・term・h1・h2・hs と Open の名と形も変えない（面の src の多くの block と同じ波のほかの行がこれらを使う）。
      pub fn sym_html（記号の名の &str を受け Option の String）。名を最初のコロンで頭と残りに分け、頭が gi・nxm・thr・tk・band のどれかで残りが次の決まりに合うときだけ Some、ほかは None。字の形は見本の symHTML と同じ並び（属性の値は二重引用符で囲み、要素の間に空白を置かない）。gi は残りが ok・ng・unknown のどれかで、span（属性は class・aria-hidden の順・class は gi と残りと sm を空白でつないだ字・aria-hidden は true）の中に ok なら ✓、ng なら !、unknown なら空。nxm は残りを最初のコロンで値と札に分け（コロンが無ければ札は空）、値が on・off・na のどれかで、札が空か ASCII の英数字 1 字のとき、span（class は nxm と空白と値・aria-hidden は true）の中に札（空なら c）。thr は残りが 1 字以上の ASCII の数字だけのとき、span（class は thrs・aria-hidden は true）の中に i の要素（中身なし）と残りの字。tk は残りが healthy・stale・absent・unreadable のどれかで、span（class は tkhb と空白と smpl）の中に span（class は healthy なら tk と空白と tk-healthy、stale なら tk と空白と tk-stale、absent と unreadable なら tk だけ）を置き、その中に sym_html に gi と ok（healthy）・ng（stale と unreadable）・unknown（absent）を渡した字と、b の要素の中の残りの字（見本の tk の枝と同じ・gi の印の選び方も同じ）。band は残りを Band の from_name に渡して Some のとき、中身の無い span（class は shape と空白と Band の class_name と空白と fill・aria-hidden は true）。値を閉じた集合と数字と英数字 1 字に限るので、字に escape の要る字は入らない（見本は esc を通す）。例は gi と ok で、span の開きの tag（class の値 gi ok sm と aria-hidden の値 true）と ✓ と span の閉じの tag をつないだ字。
      形（DOM・mod dom の中・字は次のとおりに決め、歯 hsym_dom_source がこの字で見る）。sym_view（引数は記号の名の sym）は今の st の枝の後、名の最後の語を字にする枝の前に、if let Some(html) = sym_html(sym) の枝を足し、中身の無い span の inner_html に html を置いた要素（view の中の字は <span inner_html=html></span>）を返す（行 g-help-fig の図の行と同じ inner_html の描き方・図の行の字 class と等号と引用符で囲んだ figli と inner_html=svg は残す）。TipLayer の content の closure は、開いた語の鍵を note でなく note_in に渡す（let n = note_in(open.key, &window().location().search().unwrap_or_default())? の形・window は leptos の prelude の関数で help.rs の mod dom が既に使う・web-sys の feature の Window と Location は面の Cargo.toml に在る）。見本と同じく注釈を出すときの幅を読み、出した後に幅を替えても出ている注釈は替えない。mod dom の super からの use は note を外して note_in と sym_html を足す（使わない名を use に残さない）。
      src の字の 2 つの決まり（着地済みの歯が src の全部で見る）。(a) frame_classes_are_in_stylesheet は src の全部の file の字から、class と等号と引用符の 3 字の並びの後、次の引用符までの字を空白で分けて class の名として拾い、style.css に在ることを見る。help.rs の字にこの並びを書くなら、後の字は style.css に在る class の名だけにする（置き換えの波括弧を含めない）。値で変わる所は、例えば着地済みの widgets の fig.rs の svg と同じく、引用符を逆斜線で escape した普通の字の literal で書けば、この並びは字に現れない。(b) frame_no_heading_words_in_code は、語の辞書の非 ASCII の見出しの語と同じ字の literal（引用符で囲んだ字の全部が語）を src に書かないことを見る。この行の literal の「 時間」「 分」「✓」「!」、置き換えの字の {SPAN} と {TICK} は、どれも見出しの語と同じ字でない（語の辞書を読んで確かめた）。
      出さない物。見本の symHTML のほかの名（strip・edge・hb・cand・badge・net・ic・occ）は後の行の分で、今までどおり名の最後の語を字で出す。経験者だけの説明の字（見本の data-tip-expert）は後の行 g-tip-expert の分。hover の card の中の記号は描かない（card は字だけ）。
      着地済みの歯（直すもの）。無い。
      着地済みの歯（直さずに通る・write-set の外・tests の下の全部を grep で確かめた）。frame_help_note_splits_lines は note に鍵 st_unknown・status・b:beads・questions を渡した値と、line と inline と tip_class と place と shows_internal の値を見る（この行は変えない・history を見ない）。hfig_fig_of_note_lines は語の辞書の全部の鍵の note の items と more の行で fig_of が名を返す行を数える（note と fig_of を変えない）。hfig_dom_source は help.rs の字 mod dom { より後に fig_of と fig::svg と、class と等号と引用符で囲んだ figli の字が在ることを見る（残す）。hfig_names_and_svg_some は widgets の mod.rs の字に pub mod fig; が在ることを見る（この行は mod.rs を書かない）。frame_classes_are_in_stylesheet と frame_no_heading_words_in_code は上の (a) と (b)。parts_ の歯は src の引用符で囲んだ /api/ の字と合図の event の名を見る（足さない）。steady_・hsblock_・hsderive_・hspage_ は src/project・src/pages・kit.rs・board.rs・build.rs を読み、seataxis の歯（saxis_）は project の seat の Span・span_ticks・LEGEND・sample_svg・content と seat.rs の字を見る（この行は seat.rs を読むだけで書かない）。tests/snapshots の頁の写しは頁の枠と block の並びだけを持つ。
      測り方。新しい歯は tests/hsym.rs に置き、名を hsym_ で始める。歯は help の span_words・tick_words・fill・note_in・note・sym_html と Inline と Line、project の seat の Span、mapview の band の Band、vocab の vocab と keys と term を host で呼ぶ。style.css は CARGO_MANIFEST_DIR から読み、着地済みの frame の歯と同じ読み（comment を除き、点の後の英字か下線か - で始まる名を拾う）で規則の名を集める。sym_html の字の class の値は、字の中の、空白と class と等号と引用符の並びの後から次の引用符までの字として拾う。help.rs の字の歯は CARGO_MANIFEST_DIR から読み、字 mod dom { より後を DOM の部分とする。注釈の箱の DOM は wasm の target のときだけなので、字の歯と xtask の surface-build で見る。自分の名の歯は tests/hsym.rs の字を読み、test の属性の行の次の fn の名を全部集め（着地済みの hfig_test_names と同じ読み方）、名の数が 7 以上であることと done (8) を見る。fixture は足さない。
      filter の語（着地済みの 49 の語・第 3 波の 17・第 4 波の 4・第 5 波のほかの行の 10・この行の接頭辞 hsym_ は並べない・80 語）。accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・hcard_・qgate_・nsum_・ntime_・ptitle_・ncard_・smore_・lcard_・aaround_・hruling_・sxaxis_・plimit_・bport_。新しい歯の名から先頭の hsym_ を除いた字は、このどれも部分の字として含まない（例 hsym_frame_x・hsym_seatcard_x・hsym_stage_x は不可）。名の例（どの語も含まない）は hsym_span_and_tick_words・hsym_note_fills_history・hsym_html_exact_strings・hsym_vocab_tokens_all_drawn・hsym_classes_in_stylesheet・hsym_dom_source・hsym_names_stay_apart。
      依存は足さない。Cargo.toml・vocab.json・style.css は触らない。widgets の mod.rs は第 5 波の行 g-card-node が書くので、この行は書かない（help.rs の中に関数を足すだけで、module を足さない）。project の seat.rs と mapview の band.rs は読むだけで書かない（同じ波の行 g-seat-more は seat.rs を書くが、その行の節は Span と span_of と with_span の名と値を変えないと書く）。help.rs は第 5 波のほかの行の write-set に無い。
  - n: 7
    type: prose
    title: 行 g-seat-more — 席の block の詳しくの出所と doctor の席の行
    body: |
      なぜ。見本の project board の HOME の block「orchestrator と口座」（docs/design/mock3/index.html の orch の section と renderAcct）は、block の末尾の詳しくの段（id omore・class gmore の details）に 3 つの段を置く。1 つ目は席の名と群の今の口座と、登録の口座と同じかの印（class gm1）。2 つ目は出所の 1 行（class gm1 src・席の dir の state.jsonl・account・tick-last・heartbeat-off の file の名）。3 つ目は経験者向けの doctor の席の行（class gm1 int xo・ui.js の doctorSeatLines・器の doctor の席の行と同じ形の字を 60 字以下の行に折る）。詳しくは経験者の mode では初めから開き、mode を替えると block の詳しくの開きも mode に合わせる（ui.js の mode の切り替えの所）。本番の詳しく（src/project/seat.rs の mod dom の more_view）は 1 つ目の段だけを持ち、出所と doctor の席の行が無く、開き閉じの初めの値はいつも閉じ。要件 FR14 は経験者向けの 1 行を 60 字とし、FR12 は席の合図の健康（tick）と停止（heartbeat）を器の 2 つの file から読んで出すとする（面は server が組んだ電文の値を写すだけ）。この行は電文に在る値だけで doctor の席の行を組んで 60 字に畳み、出所の 1 行と一緒に詳しくの段に置き、詳しくの初めの開きを台帳の block の詳しくと同じく mode から取る。
      在りか（着地済み・main の commit 9a892c4 で確かめた・seat.rs は着地済みの行 g-seat-axis の後に変わっていない・a0ef946 から 9a892c4 までに変わったのは account の projects.rs と tests/projmore.rs と docs だけ）。src/project/seat.rs は build.rs が生成する pub mod で crate::project::seat の path で使え、wasm の target のときだけの pub fn view と mod dom のほかは host でも組む。host の部分は BLOCK（id orch）・PATH（/api/seat）・PATHS（PATH の 1 つ）・FOLDS（seat:hist と seat:more）・MORE（字「詳しく ▸」）・Sign と OK と NG（印の字と class）・pub fn sign・pub fn hm（EpochSecs を受け、view の clock の字の時と分に Z を足した字）・pub struct More（pub な欄 target は String・current は Reading の String・same は Reading の Sign・derive は Debug・Clone・PartialEq）・pub fn more（SeatCard の参照を受け More・target は席の名・current は群の今の口座・same は登録の口座と群の今の口座が同じかの印で、どちらかが分からなければ Unknown）・pub struct Seat（pub な欄 top・strips・low・band・hist・more）・pub fn seat（SeatCard の参照を受け Seat）・pub fn card（Fetched の参照を受け、SeatCard か理由の &'static str の Result）・pub fn content（Fetched の参照を受け Body の Seat・Filled の中身は seat の値）。mod dom の more_view（引数は More・返りは AnyView）は、記録の関数を鍵 seat:more の字と、いつも偽を返す初めの値の closure で呼び、class gmore の details（prop:open=open と on:toggle=toggle）の summary に class rm-t の span の MORE、中の class gm の div に class gm1 の div（席の名の class mono の span と、語の鍵 current_account の語と今の口座と印）を置く。mod dom の use は crate::project の Body・UNKNOWN・body_view・fold・section・state_icon・unmeasured と crate::widgets::help の hs と term と crate::vocab の label を持つ。seat の More を struct の字で組む所は seat.rs の more の 1 つだけで、tests の下と src のほかの file には無く（grep で確かめた・account の projects.rs の pub struct More は名が同じだけの別の型で、この行は触らない）、着地済みの歯 seatblock_unknown_parts_only_unmeasured は More の current・same・target を欄の名で読む。
      電文（crates/tsuzuri-contract の seat.rs と board.rs・この行は書かない）。pub struct SeatCard（欄は全部 pub・derive は Debug・Clone・PartialEq と serde）の欄は at（EpochSecs・u64 の秒）・target（席の名の String）・state（SeatState）・since（Option の EpochSecs）・tick_healthy（Reading の bool・器の合図の健康）・heartbeat（Reading の bool・停止の切り替えが on か）・account（Option の String・登録の口座）・model（Option の String）・group（Reading の GroupRow）・usage（Reading の QuotaUsed の Vec）・spans（Reading の SeatSpan の Vec）・moves（Reading の AccountMove の Vec）。Reading は board.rs の pub enum で Known に値を持つか Unknown（電文の字は鍵 known で包んだ値か字 unknown）。SeatState は Run・Wait・Limit・Silent・Unknown の 5 つ（Copy）。電文には state dir の path・席の役（role）・anchor の path・pane の欄が無い。中核の seat.rs の card は account と model を器の doctor の席の行（頭が seat とコロンの行のうち target が席の名の行）の欄から、tick_healthy と heartbeat を seat tick status の行の healthy と heartbeat の欄から、state と since と spans を席の dir の state.jsonl と tick-last から、usage を fleet usage --show の行から、group を host.toml と群の記録から組む（境界の crate の src/server/seat.rs が 3 つの出力を撃ち、席の dir（state dir の下の seat の下）の state.jsonl と tick-last、state dir の host.toml、群の記録の file を読む）。契約の型の crate の pub mod wire の pub fn decode（字の &str を受け、Deserialize の型の値の Result）で fixture の字を読める。
      経験者向けの畳み（src/account/home.rs・account の mod.rs の pub mod home で host でも組む・この行は書かない・着地済みの行 h-cards-home が足した）。pub const EXPERT_CHARS（usize・値 60・要件 FR14 の経験者向けの 1 行）と pub fn wrap_words（字の &str と字数の usize を受け String の Vec を返す）。どちらも home.rs の最初の cfg(target_arch = wasm32) の属性の行より前に在り、target の cfg で囲まれない（確かめた）。home.rs は write-set に = で置く（置き場だけで中身は変えない・この 2 つの宣言を審査の材料に載せるため）。wrap_words は字数を 1 以上にしてから、空白で区切った空でない語を順に、今の行に空白 1 つと語を足した字の数（Unicode の scalar）が字数以下なら足し、超えるか行がまだ無ければ新しい行にし、字数を超える語は先頭から字数ごとの片に切って片を語として扱う（どの行も字数を超えない・空の字は 0 行）。この決まりは着地済みの歯 hcard_wrap_words が pin する。project の module から crate::account の module を use するのは着地済みの project の next.rs（crate::account::windows と crate::account の Tab と tab_href）と同じ形。home.rs は既に crate::project::seat の NG・OK・Sign・WINDOWS・WindowRow・hmd・short・window_row を use していて、seat.rs が home.rs の 2 つを use しても同じ crate の中の相互の use なので組める。
      mode と記録（この行は書かない）。src/widgets/help.rs の pub fn shows_internal（crate::frame の Mode を受け bool・Mode の Expert のときだけ真・host でも組む）と、wasm の target のときだけの pub struct HelpCtx（derive は Debug・Clone・Copy・pub な欄 open と mode・mode は Mode の RwSignal）は、help.rs が wasm の target のときだけ pub use で crate::widgets::help の名として出す。project board の頁（src/board.rs の App）は let help = HelpCtx { で値を作って provide_context(help); で context に置き、block の view はその App の中で組まれる。App は body の class を Mode の body_class（Expert は mode-expert・Beginner は mode-beginner）にする。src/kit.rs の wasm の target のときだけの pub fn fold（鍵の String と、初めの値を返す closure を受け、開きの値を返す closure と toggle の handler の組を返す）は、記録に鍵の値が在ればその値、無ければ初めの closure の値を開きにし、toggle では今の開きが出している値と違うときだけ記録に書く（持ち主が開き閉じを変えるまで mode に従う・着地済みの歯 steady_folds_write_back_keeps_mode_until_owner_toggles）。台帳の block（src/project/ledger.rs の mod dom の tier_view の段 More）は use_context::<HelpCtx>() で受けた値を shows_internal に渡す closure を初めの値にして記録の関数を鍵 ledger:more の字で呼び、経験者の mode で詳しくを初めから開いている。この行は同じ形を席の block の詳しくに使う。
      stylesheet と語の辞書（確かめた・この行は触らない）。style.css に規則 .gmore と .gmore .gm と .gmore .gm1 と .gmore .gm1.src（等幅の小さい字・折り返しは字ごと）と .gmore .gm1.int と .gmore .gm1.int code と、.gmore .xo（display none）と body.mode-expert .gmore .xo（display flex）が在る（見本の ui.css の写し）。class xo の段は経験者の mode のときだけ見える。account の HOME の群の枠の詳しく（着地済みの行 h-cards-home）は同じ class の gm1 src と gm1 int xo の段に、出所の字と doctor の群の行の code を置いている。語の鍵 current_account は語の辞書に在る（この行は語の鍵を足さない）。
      形（host の部分・seat.rs）。pub const MORE_SRC（&str・字「席の dir の state.jsonl と tick-last・器の doctor と seat tick status と fleet usage --show の出力」・電文を組む器の出力と file の名）。pub fn seat_line（SeatCard の参照を受け String）は器の doctor の席の行の形（見本の doctorSeatLines の欄の順）で、seat とコロンをつないだ字の後に、空白 1 つずつで target と等号と席の名、account と等号と登録の口座、model と等号と model の名、heartbeat と等号と停止の切り替えの値、tick と等号と合図の健康の値を並べる。電文に値が無い欄（account と model が None・heartbeat と tick_healthy が Unknown）は字 ?（見本の doctorSeatLines と同じ）、heartbeat は Known の真で on・偽で off（上段の top の heartbeat の写しと同じ語）、tick は tick_healthy の Known の真で healthy・偽で stale（上段の tick の class の tk-healthy と tk-stale と同じ語）。見本の行の頭の欄 role（席の役）は電文に無いので置かない（見本は役の値を持たずに orchestrator を埋めている）。More に pub な欄 doctor（String の Vec）を足し、more は seat_line の字を wrap_words に EXPERT_CHARS で渡した行を入れる（target・current・same の値と more の引数と返りは変えない）。seat.rs は crate::account::home の EXPERT_CHARS と wrap_words を use し、畳みの関数を写さない。足す定数と関数は wasm の target のときだけの pub fn view より前に置く（mod dom は file の終わりのまま）。
      形（DOM・mod dom の中）。more_view は、記録の関数を今と同じ鍵 seat:more の字で呼び、初めの値を、use_context::<HelpCtx>() で受けた値が在りその mode の値を shows_internal に渡して真のときだけ真を返す closure にする（台帳の詳しくと同じ・context が無ければ閉じ）。details と summary と 1 つ目の class gm1 の段は今のまま。class gm の div の中の 1 つ目の段の後に、class の字 gm1 src の div に MORE_SRC を置き、その後に class の字 gm1 int xo の div に More の doctor の行ごとの div の中の code の要素を置く（見本の gm1 int xo の中の div と code）。class gm1 src と class gm1 int xo の div と code の要素と More の doctor を読む字は more_view の本文に直に書き（別の関数に分けない）、details の閉じの tag より前に置く（行の div を変数に組んでから view に置く書き方でもよい）。mod dom の use に crate::widgets::help の HelpCtx と shows_internal と、super の MORE_SRC を足す。details の要素の数（2）と記録の関数を呼ぶ所の数（2）は変えず、seat.rs の code と doc に、記録の関数の名と開き丸括弧が続く字を新しく書かない。summary の字（MORE）と hist の段の初めの値（閉じ）は変えない。
      出さない物。閾値と逼迫の印（規則の行 R-22 の決め待ち）、tick の最後の時刻からの秒（電文に無い・後の行 c-seat-tick）、heartbeat の切り替えの button と確かめの dialog（後の行 g-seat-hb・持ち主の決め待ち）、見本の出所の行の state dir の実の path と席の dir の名（電文に無い）、見本の 1 つ目の段の群の名の字（本番の 1 つ目の段は今のまま）。doctor の席の行の tick の値は電文の真偽の写しで、器の seat tick status の 4 つの値（healthy・stale・absent・unreadable）のうち absent と unreadable は電文の上で区別できない（Unknown か偽）。
      着地済みの歯（直すもの）。無い（この行は tests の下の着地済みの file を書かない）。
      着地済みの歯（直さずに通る・write-set の外・tests の下を grep で確かめた）。tests/seatblock.rs は seat の Band・HistRow・LIMIT_LINE・MORE・MOVE_WAIT・NEXT_TARGET・NG・OK・Rect・Seat・Span・SHORT・WINDOWS・content・span_of・strip_svg・until・with_span を使い、MORE が字「詳しく」で始まること（seatblock_band_only_on_limit_or_move_wait）、More の target と current と same の値（seatblock_unknown_parts_only_unmeasured）、組の値の class と固定の 18 の class が stylesheet に在ること（seatblock_keys_in_vocab_and_classes_in_stylesheet・固定の列に gmore が在る）、BLOCK と PATH と body の外形と直接依存の 5 つの名（seatblock_landed_shape_and_no_new_deps）を見る。この行はこの名と値を変えない。tests/seataxis.rs の saxis_src_draws_legend_axis は seat.rs の mod dom に class saxis・sleg・sleg-i の字と sample_svg と開き丸括弧・ticks・LEGEND の字が在ることを見る（この行は触らない）。tests/steady.rs の steady_details_use_fold_record は src/project の block の file ごとに、字 <details で始まる tag がどれも prop:open=open と on:toggle=toggle を持って空白と open と等号の字を持たないこと、tag の数と記録の関数を呼ぶ所（名の前が識別子の字でも点でもない所の、名と開き丸括弧の後の最初の引用符の字）の数と module の FOLDS の数が同じで鍵の字の集合が FOLDS と同じことを見る（seat.rs は details 2 つ・呼ぶ所 2 つ・鍵 seat:hist と seat:more のまま）。tests/hsderive.rs の hsderive_consts_match_note は seat の PATHS と FOLDS の値と、seat.rs の PATHS の宣言の行が引用符の字を持たないことを見る（変えない）。tests/frame.rs の frame_classes_are_in_stylesheet は src の全部の file の、class と等号と引用符で始まる字を空白で切った名が style.css の規則の名に在ることを見る（足す gm1・src・int・xo は在る）。frame_no_heading_words_in_code は src に語の辞書の日本語の語と同じ字の literal が無いことを見る（MORE_SRC と seat_line の書式の字は辞書の語と同じでない）。frame_blocks_without_data_are_unmeasured は seat の body を見る（変えない）。tests/parts.rs の parts_paths_distinct_in_block_modules は src の引用符で囲んだ /api/ の字を見る（足さない）。tests/accthome.rs・tests/acctproj.rs・tests/acctsess.rs・tests/acctpop.rs・tests/hcard.rs は seat の NG・OK・SPAN_KEY・Span・rects・span_of・strip_svg・with_span・window_row・hmd を使い（src の account の session.rs と projects.rs と home.rs は Sign・top・state_value・WINDOWS・WindowRow・short も使う）、この行はそれらを変えない。tests/hcard.rs の hcard_wrap_words は account の home の wrap_words と EXPERT_CHARS を見る（この行は home.rs を書かない）。home.rs の字を読む着地済みの歯（accthome_ と acctlook_ と hcard_ の歯）も、home.rs の中身が変わらないので通る。
      並べて走る行との取り合い。同じ波の行 g-ledger-card は ledger.rs を書き、seat の hm を読むだけ（この行は hm を変えない）。同じ波のほかの行の write-set に seat.rs と home.rs は無く、help.rs の shows_internal と HelpCtx の名を変える行も無い（help.rs を書く行 g-help-sym も、この 2 つの名と形を変えない前提）。同じ波の行 g-title は src の board.rs を書くが、歯 smore_dom_text が読む board.rs の 2 つの字（let help = HelpCtx { と provide_context(help);）は変えない前提（g-title の節は App が HelpCtx を context に置くことを変えない）。後の行 c-seat-tick・c-seat-grace・c-seat-group・g-seat-hb はこの行の後に seat.rs を書く。
      測り方。新しい歯は tests/smore.rs に置き、名を smore_ で始める。名の例は smore_seat_line_rules・smore_lines_on_fixture・smore_lines_within_budget・smore_budget_matches_r19・smore_dom_text・smore_css_rules・smore_own_names_clean。fixture は着地済みの tests/fixtures/surface/seat-card.json（組の名から SeatCard への map・5 組）を CARGO_MANIFEST_DIR から ../../tests/fixtures/surface/seat-card.json として読み、wire の decode で組の名から SeatCard への BTreeMap にする（着地済みの seatblock_ の歯と同じ読み・新しい fixture は置かない）。変えた電文は歯の中で写して作る。fixture の値（5 組とも at は 1790510400・target は tsuzuri-orch）は、run が tick_healthy は known の真・heartbeat は known の真・account は acct-4・model は opus、wait が tick_healthy は known の偽・heartbeat は known の偽・account は acct-4・model は opus、limit が run と同じ 4 つ、silent が tick_healthy と heartbeat は unknown・account と model は null、unknown が tick_healthy と heartbeat は unknown・account は acct-4・model は null。
      節の表（seat_line の字と doctor の行）。run の seat_line は「seat: target=tsuzuri-orch account=acct-4 model=opus heartbeat=on tick=healthy」で、行は「seat: target=tsuzuri-orch account=acct-4 model=opus」（51 字）と「heartbeat=on tick=healthy」。wait の行は同じ 1 行目と「heartbeat=off tick=stale」。limit の行は run と同じ 2 行。silent の行は「seat: target=tsuzuri-orch account=? model=? heartbeat=?」（55 字）と「tick=?」。unknown の行は「seat: target=tsuzuri-orch account=acct-4 model=? heartbeat=?」（ちょうど 60 字）と「tick=?」。run の組の target を x が 70 字の名にした card の行は「seat:」・「target=」と x が 53 字（60 字）・x が 17 字と「 account=acct-4 model=opus heartbeat=on」（56 字）・「tick=healthy」の 4 行（長い語を 60 字ごとに切る）。target を proj-with-a-rather-long-name:0.1 にした card の行は「seat: target=proj-with-a-rather-long-name:0.1 account=acct-4」（60 字）と「model=opus heartbeat=on tick=healthy」の 2 行。
      規則の行の字。歯 smore_budget_matches_r19 は CARGO_MANIFEST_DIR から ../../design-intent/rules.yaml を読み、字 id: R-19, を含む行の中の字「経験者向けの 1 行は」の後の空白を除いた字を「字」の前まで数として読み、EXPERT_CHARS と同じことを見る。行 R-19 の value の字は「…・hover の card は 4 行 以下（1 行 36 字 以下）・経験者向けの 1 行は 60 字 以下・最初の画面の散文は 300 字 以下・…」（確かめた・着地済みの歯 parts_constants_match_rules_r20_r19 も同じ file の同じ行を読む）。
      字の歯。歯 smore_dom_text は CARGO_MANIFEST_DIR から src/project/seat.rs と src/board.rs を読む。seat.rs の字「mod dom {」より後を DOM の部分とし、その中の字 fn more_view( から次の改行と 4 つの空白と閉じ波括弧と改行の並びまでを more_view の本文とする（mod dom の関数は 4 つの空白の字下げで閉じる）。本文の中の順は、gm1 src・gm1 int xo・MORE_SRC・<code>・doctor の字の最初の所が字 </details> の最初の所より前かだけを見る（5 つの間の順は見ない）。done の (5) と (7) と (6) の board.rs の字は行の前提で、この行の外の値が変わったときに落ちる。DOM の振る舞いは host で撃てないので、xtask の surface-build が通ることで組めることを見る。歯 smore_css_rules は style.css の字を読み、点と名の後に英数字とハイフンと下線のどれも続かない所が在ることで規則の名を見る（着地済みの seatblock_ の歯と同じ見方）。
      filter の語（着地済みの行の verify の filter の語 49・第 3 波の行の接頭辞 17・第 4 波の行の接頭辞 2・第 5 波のほかの行の接頭辞 10・この行の接頭辞 smore_ は並べない・78 語）。accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・hcard_・ntime_・ptitle_・ncard_・hsym_・lcard_・aaround_・hruling_・sxaxis_・plimit_・bport_。新しい歯の名から先頭の smore_ を除いた字は、このどれも部分の字として含まない（例 smore_seatblock_x・smore_hook_x・smore_lcard_x は不可）。着地済みの契約の file の verify の行の filter の語（server_acct_ など長い語を含む）は、どれもこの列の語のどれかを部分の字として含む（確かめた）。
      依存は足さない。Cargo.toml・vocab.json・style.css は触らない。account の home.rs・widgets の help.rs・kit.rs・src の board.rs は読むだけで書かない。
  - n: 8
    type: prose
    title: 行 g-ledger-card — 台帳の burndown の card と epic の行の link
    body: |
      なぜ。見本の project board の HOME の block「台帳」（docs/design/mock3/index.html の ledgerBlock と ledgerCard）は、burndown の図（class lmid の div・data-card は lg:burn・tabindex 0）に hover の card を付け、card は題（burndown と project の名）、種類の行（純減 24h と純減 7d の矢印と数と closed/日）、値の行（14 日の始めと終わりの open の task の数）、出所の行（台帳の file と時点）の 4 行と、詳しくの日ごとの行（日付と open の数と作った数と閉じた数）を持つ。epic の進みの行（class ep の div）は、epic の題を節点の頁への link（class nl の a の要素）にする。本番の台帳の block（src/project/ledger.rs の mod dom）は burndown の図に card を付けず（src の全部で use:attach の字は project の pipeline.rs と account の home.rs と、hover.rs の doc の 1 か所だけ・確かめた）、epic の進みの行は id と題を span の字で出すだけで、行 g-node が足した節点の頁（?page=node&id=）へ行けない。要件 FR14 は hover の card を 4 行（1 行 36 字）と「詳しく」とし、card を出す要素を頁を持つ節点の札・圧縮された cell・記号だけの要素の 3 種に限る。burndown の図は 14 日の数を棒と線に縮めた cell で、card が日ごとの数と純減と出所を持つ。見本（判断の記録 ADR-7 で確定）はこの図に card を付ける。要件 FR13 は burndown と純減（24h と 7d）と closed/日を台帳の指標とし、epic の進みを「詳しく」に置く。この行は電文に在る値だけで burndown の card を組んで図に付け、epic の進みの行を節点の頁への link にする。
      在りか（着地済み・main の commit 9a892c4 で確かめた・ledger.rs は着地済みの行 g-unref-panel の後に変わっていない・a0ef946 から 9a892c4 までに変わったのは account の projects.rs と tests/projmore.rs と docs だけ）。src/project/ledger.rs は build.rs が生成する pub mod で crate::project::ledger の path で使え、wasm の target のときだけの pub fn view と mod dom のほかは host でも組む。host の部分は BLOCK（id ledger）・PATH・METRICS_PATH・UNREF_PATH・PATHS（この 3 つを定数の名で）・FOLDS（ledger:more と ledger:unref）・NONE（字 ―）・DAYS（14）・BURN_W と BURN_H・Part と Tier と LAYOUT（段 Burn に項 Burn の 1 つ）・pub struct Net（pub な欄 arrow・class・word は &'static str・text は String）と pub fn net（i64 を受け Net・負は arrow が ↓ で text が − と絶対値、正は ↑ と + と値、0 は → と字 0）・pub fn fixed1（f64 を受け小数 1 桁の String・ちょうど半分は大きい方へ）・Burn と burndown と burn_svg・pub struct EpicBar（pub な欄 id は String・title は Option の String・closed と total と pct は u32・derive は Debug・Clone・PartialEq・Eq）・pub struct Metrics（pub な欄 judge・open・unref・net24・net7・rate・burn・memo・ready・blocked・stale・lead・spark・epics・derive は Debug・Clone・PartialEq）・pub fn stats（Fetched の参照を受け LedgerStats か理由の &'static str の Result・本文は Reading で包んだ指標）・pub fn content（Fetched の参照と view の Screen の参照を受け Body の Metrics・Filled の中身は panel の値）・pub fn panel（LedgerStats の参照と Screen の参照を受け Metrics・epic の題は画面の台帳の一覧から id で引く）と、未反映の一覧の定数と関数（行 g-unref-panel）。wasm の target のときだけの pub fn view（引数なし・context の画面の状態の signal を mod dom の view に渡す）と、file の終わりの mod dom。mod dom の tier_view（段と項の slice と Metrics の参照 m と画面の signal と未反映の読みの signal を受ける）は、段 Burn を class lmid の div に line_view の項 Burn の値（class lcap の div に見出しと BURN_CAPTION・burn_svg の字を inner_html に持つ div）を入れて描く。line_view の項 Epics の腕は見出しと class lep の div に m の epics を epic_view で描く。epic_view（引数は EpicBar の参照・返りは AnyView）は class ep の div に、span（その中に class nid の span の id と空白と data-t の span の題・題が無ければ id）と、class bar の span（中の i の幅が pct）と、class meta num の span（closed と total）を置く。未反映の 1 行の unref_row_view は id を class u-id mono の a の要素にし、href は crate::frame の node_href に id と mode を渡した値で、mode は unref_view が use_context で受けた HelpCtx の mode（無ければ今の URL の query を Mode の from_query で読んだ値）。mod dom の use は leptos の prelude・Reading・super の定数と関数・crate::frame の frame と Mode・crate::project の Body・UNKNOWN・fold・item_view・section・state_icon・unmeasured・crate::view の Fetched と Screen・crate::vocab の label・crate::widgets::help の HelpCtx・hs・shows_internal。Metrics と EpicBar を struct の字で組む所は ledger.rs の panel だけで、tests の下と src のほかの file には無い（grep で確かめた・着地済みの ledgerblock_layout_table は EpicBar の欄を名で読む）。
      電文（crates/tsuzuri-contract の stats.rs・この行は書かない）。pub struct LedgerStats（欄は全部 pub・derive は Debug・Clone・PartialEq と serde）の欄のうちこの行が読むのは at（EpochSecs・u64 の秒・指標を組んだ時点）・net_drop_24h と net_drop_7d（i64・今の open の task の数から 24 時間前と 7 日前の数を引いた値）・closed_per_day（f64）・days（DayCount の Vec・古い日から順に 14 本）。pub struct DayCount（欄は全部 pub・derive は Debug・Clone・Copy・PartialEq・Eq と serde）の欄は end（EpochSecs・その日の終わりの時刻）・created・closed・open（u32・その日に作られた task・閉じた task・その日の終わりの open の task）。中核の ledger の stats.rs は days を、今の時刻から i 日前（i は 13 から 0）を end にして組む。台帳の読みは境界の crate の src/server/ledger.rs が bd の読み取りの口（bd --readonly list --all --limit 0 --json）を撃って行を読み、口 /api/metrics はその行を中核の stats に渡した値を返す。
      時刻と語と節点の頁（この行は書かない）。project の seat の pub fn hm（EpochSecs を受け String・host でも組む）は view の clock の字の時と分に Z を足した字（例 00:00Z）。crate::view の pub fn clock（EpochSecs を受け String・host でも組む）の字は 2026-09-28 00:00:00 UTC の形で、6 字目から 10 字目が月と日（例 09-28）。crate::vocab の pub fn label（鍵の &str を受け String・host でも組む・辞書の見出しの語・無い鍵は「語彙表に無い」と鍵を括った字）で、語の辞書の鍵 l_burn の語は burndown、l_rate の語は closed/日（確かめた）。crate::frame の pub fn node_href（id の &str と Mode を受け String・host でも組む）は page が node・id は %XX にした id・mode は Mode の鍵の query の字を返す。
      hover の card（src/widgets/hover.rs・widgets の mod.rs の pub mod hover で host でも組む・この行は書かない・write-set に = で置く＝置き場だけで中身は変えず、宣言を審査の材料に載せるため）。pub struct Card（pub な欄 title・kind・value・src は String・more は String の Vec・derive は Debug・Clone・PartialEq・Eq・Default・hover.rs の最初の cfg(target_arch = wasm32) の属性の行より前に在り host でも組む）と Card の rows（4 行の class と字・36 字を超える行は 35 字と … に切る・more は切らない）。project の ask.rs の pub struct Card は名が同じだけの別の型（問いの札）で、この行は使わない。wasm の target のときだけの pub fn attach（引数は web_sys の Element と Card・返りは無し）は、context に HoverCtx が在れば要素に pointerenter と pointerleave の受け手を付け、指を置くと頁に 1 つの card の層に card を出し、出ると 150 ミリ秒の猶予で残すか消す（規則の行 R-20）。HoverCtx が無ければ何もしない。attach と HoverCtx と component の CardLayer は hover.rs が wasm の target のときだけ pub use で crate::widgets::hover の名として出す。block は view の要素に use:attach と等号と Card の値を書いて付ける（project の pipeline.rs の札と account の home.rs の口座の名の欄と移動の行がこの形）。project board の頁（src/board.rs の App）は既に provide_context(HoverCtx::default()) を呼び、view の末尾に <CardLayer/> を置き、HOME の block の view はその App の中で組まれる。だからこの行は board.rs と widgets の下を書かずに card を出せる。
      stylesheet（確かめた・この行は触らない）。style.css に規則 a（color inherit・text-decoration none）と #ledger .ep（3 列の grid・760 px 以下では 2 列で .meta を行の全幅に置く）と #ledger .lmid が在り、ep と lmid の中の要素を隠す規則は無い。この行は class の字を足さない（epic の link の a は class を持たず、中の class nid と data-t の span は今のまま）。
      形（host の部分・ledger.rs）。pub const BURN_SRC（&str・字「bd list --all の task」・burndown の数の出所の台帳の読み）。pub fn burn_card（LedgerStats の参照を受け Card）は、title が label に l_burn を渡した語。kind が net に net_drop_24h を渡した値の arrow と text と字 24h（間に空白）、「 · 」、net に net_drop_7d を渡した値の arrow と text と字 7d、「 · 」、label に l_rate を渡した語と空白と fixed1 に closed_per_day を渡した字（見本の card の種類の行の 24h と 7d の純減と closed/日）。value が、days が空でなければ字 open と空白と最初の日の open と「 → 」と最後の日の open と「（」と days の数と「 日）」、空なら字 open と空白と NONE。src が BURN_SRC と「 · 時点 」と hm に at を渡した字（語の辞書の鍵 at と lg_now の語が「時点」なので、「時点」だけの字の literal は書かず、書式の字の中に書く）。more が、days の最後の日から古い方へ 1 日おきに選んだ日を古い順に並べ、日ごとに clock に end を渡した字の月と日と「 open 」と open と「 · +」と created と「 / −」と closed をつないだ行（見本の ledgerCard の burn の枝の詳しくは古い日から数えて偶数番目の日を選び、14 日だと最後の日の行が落ちるので、この行は最後の日から数えて必ず含める）。Metrics に pub な欄 burn_card（Card）を足し、panel は同じ電文を burn_card に渡した値を入れる（Metrics のほかの欄の値と、content・panel・stats の引数と返りは変えない）。ledger.rs の頭の use に crate::widgets::hover の Card と crate::vocab の label と project の seat の hm と view の clock を足す。足す定数と関数は wasm の target のときだけの属性の行と pub fn view の宣言の行の間に置かず、mod dom より前に置く。
      形（DOM・mod dom の中）。tier_view の段 Burn の class lmid の div に tabindex と等号と引用符で囲んだ 0 と、use:attach と等号と m の burn_card の clone を足す（見本の lmid の data-card と tabindex・tag の頭の、<div と空白と class と等号と引用符で囲んだ lmid の並びは変えず、その後に足す）。mod dom の use に crate::widgets::hover::attach を足す。epic_view は、外側の span を a の要素に替え、href を frame の node_href に EpicBar の id と今の mode を渡した値にする（中の class nid の span と空白と data-t の span と、class bar と class meta num の span は今のまま）。mode は unref_view と同じく use_context で受けた HelpCtx の mode（無ければ今の URL の query を Mode の from_query で読んだ値）で、mode の受け取り方と epic_view の引数は実装が決めてよいが、node_href を呼ぶ所は epic_view の本文に置く。a の要素と中の class nid の span と data-t の span は、今と同じく epic_view の 1 つの view の中に書く（外側の span の開きと閉じの tag を a の開きと閉じの tag に替える）。組む要素の数と class は変えない（a の要素は class を持たない）。details の要素と記録の関数を呼ぶ所は足さず、ledger.rs の code と doc に、記録の関数の名と開き丸括弧が続く字を新しく書かない（burndown の中の点と名の続く字は数えない形のまま）。
      出さない物。見本の card の題の project の名（指標の電文に project の名が無い）、見本の詳しくの最後の見本を外した数の行（本番の台帳に見本の印が無い）、見本の burndown の下の始めと終わりの日付の行、epic の行の hover の card（見本は節点の card・後の行 g-card-node と g-card-adopt の分）、見本の epic の題の 40 字の切りと open の子の数、memo の行の hover の card（電文に見出しの欄が無い・行 g-unref-panel と同じ判断）。
      着地済みの歯（直すもの）。無い（この行は tests の下の着地済みの file を書かない）。
