  - n: 3
    type: prose
    title: 行 h-acct-cols — account board の決定待ちと未反映の欄を数にし、群の card に閾値の行を足す
    body: |
      在りかの main は 3e2e875（その前の bac6854 からの 3 つの commit は設計ノートと契約表と境界の歯 fstop だけを書き、この行の書く file と読む file は bac6854 と同じ）。この行の書く file を最後に書いたのは、面の src/account/projects.rs が行 h-next-unknown〔便 t3-hub.53.19・bfda70a〕、src/account/ledger.rs と歯 hcled が行 h-cards-led〔便 t3-hub.53.21・6e08605〕、歯 hcproj が行 h-cards-proj〔便 t3-hub.53.15・550176b〕、歯 acctproj が便 t3-hub.53.12（83d453c）、歯 acctled が便 t3-hub.44（12a42bc）、歯 projmore が便 t3-hub.53.4（11d03d3）、歯 ledspark が便 t3-hub.53.5（322e86d）で、電文の閾値の欄 caps を足した行 c-acct-thr〔便 t3-hub.53.17・c36fcc7〕は着地済み。この節の字はその後の code の値。
      なぜ。要件 FR13 は、account board が各 project の anchor の台帳と design-intent を読むだけで project ごとに決定待ち（open の問いの数）と未反映の数を出すとし（持ち主の裁定 t3-hub.53.9・裁定 id = t3-hub.53.9:20260927T2233Z-1・計画の判断の表の行 d6）、要件 FR12 は群の閾値を器の rules 行の写しで出すとし（持ち主の裁定 t3-hub.53.8・裁定 id = t3-hub.53.8:20260927T2233Z-1・計画の判断の表の行 d5）、要件 NFR2 は読めない出所を測れていないと出す（0 と区別する）とする。見本 mock v3（判断の記録 ADR-7 の承認で確定・repo の写しは docs/design/mock3）の account board（docs/design/mock3/account/index.html の関数 projTable と ledTable と card の group の枝）は、各 project の表の決定待ちの欄（class c-wait）と未反映の欄（class c-un2）と、台帳の表の未反映の欄（class c-un）に数を出し、群の card の詳しくの候補の行の次に閾値の行を持つ。本番の面は 3 つの欄に ― を出し（src/account/projects.rs の module の doc の字は、決定待ちは電文に値が無く、未反映は読めない種類を 0 と数えた和で確かな値と言えないので、どちらも ― を出す）、run の数の欄の card の値の行も ― で、群の card に閾値の行が無い。電文の project の行（契約の ProjectRow）の欄 ledger（Reading の LedgerStats）は各 anchor の台帳からもう open.question と unreflected と unreflected_unknown を運び、project board の指標の頁も同じ中核の stats を読むので、この行は電文を変えずに面だけで欄を数にする（計画の行 e-acct-qopen と e-acct-unref は、計画の 3 節の席の決め〔2026-09-28・憲法の条 P-27 の決定はしごの、もう在るかの段〕で退けた）。
      在りか・電文（契約の型の crate・読むだけ）。account の pub struct ProjectRow の pub な欄 ledger は board の Reading（Known か Unknown）の stats の LedgerStats で、LedgerStats の pub な欄 open（OpenCounts・欄 task・memo・question・epic の u32）と unreflected（u32・読めた種類の件数の和・読めない種類は 0 と数える）と unreflected_unknown（stats の UnreflectedKind の Vec・読めない種類・閉じた 3 つは Memo・Ruling・Request）を持つ。AccountDoc の pub な欄 caps は account の WindowCap の Vec（pub な欄 window と rule の String と cap の Reading の u64）で、中核は器の rules 行の 3 つ（five_hour・seven_day・seven_day_model の順）を写す（行 c-acct-thr）。fixture の tests/fixtures/account/acct-doc.json（読むだけ）は、proj-a の台帳が Known で open.question 2・unreflected 3・unreflected_unknown が ruling と request、proj-b と proj-c の台帳が unknown、caps が 85・95・95、群が Tier1（proj-a と proj-c）と Tier2（proj-b）。
      在りか・project board の指標の段（面の src/project/ledger.rs・読むだけ・書かない）。pub struct Unref（derive は Debug・Clone・PartialEq・Eq・pub な欄 count の u32 と unknown の &static str の Vec・doc は未反映の数〔電文の数そのまま〕と分からない種類の名〔測れていないの記号を添えて出す〕）と、pub const UNREF_KINDS（Memo は字 memo、Ruling は字 ruling、Request は字 request）と pub fn kind_name（UnreflectedKind を受け表の字）を持つ。pub fn panel（&LedgerStats と view の &Screen を受け pub struct Metrics）の pub な欄 unref は、count を unreflected、unknown を unreflected_unknown の順に kind_name した値。DOM（wasm の target のときだけ）の指標の箱は、未反映の箱の数の後に、unknown が空でなければ project の module の state_icon に UNKNOWN を渡した測れていないの印を添え、未反映の段の見出しは読めない種類ごとに種類の名と空白と同じ印の chip を出す。語の辞書の l_unref の plain の字は、測れていないの印の付いた数はまだ数えていない種類がある、の旨。これがこの行の再利用する言い方と関数（型 Unref・kind_name・印）。src/project/ledger.rs の字を読む着地済みの歯（lcard・lhome・hsblock・unrefpanel）が在るので、この行はその file を書かず、pub な型と関数を use する。
      在りか・各 project の表（面の src/account/projects.rs・write-set・1298 行）。account の mod.rs の pub mod projects で host でも組む（歯は tsuzuri_surface::account::projects の path で使う）。pub struct ProjLine（derive は Debug・Clone・PartialEq）の pub な欄 wait と unref は &static str で、pub fn row がどちらにも pub const NONE_MARK（字 ―）を置く。pub fn table は並べ PSort::Unref で電文の projects の順のまま（ほかの並べは need_rank と judge_rank の sort_by_key と群の見出し）。pub const WAIT_NOTE（字 ― = 質問の台帳を読んでいない）を pub fn pcnt_card がいつも詳しくの最後に足し、値の行は語の鍵 waiting_you の語（あなたの決定待ち）と空白と NONE_MARK。pub fn grp_card（&AccountDoc と群の名）の詳しくは、候補の行（字 候補 と候補の数と 口座 → と語の鍵 candidates の語）・字 anchor と件数と 件・project ごとに字 ・ と名の行。私的な const ASK は字 ?。use に crate::project::seat の NG・OK・Sign・hm・hmd・state_value・top が在る（同じ module の pub fn short は窓の字を 5h・7d・model にし、知らない窓は字のまま）。DOM の row_view は決定待ちを div の class=C_WAIT の中の b の class 字 num に row.wait、未反映を div の class=C_UN2 data-term の l_unref の中の b の class 字 num に row.unref で出す。stylesheet（crates/tsuzuri-surface/style.css）は .prow .c-wait b.on と .ptab .c-un2.on b と .jrow .c-un.on b の規則と .prow .c-un2 .l2 の規則を持つ（確かめた・この行は stylesheet を書かない）。語の辞書の waiting_you・threshold（語 閾値）・l_unref・p_wait の鍵は在る（確かめた・この行は語の辞書を書かない）。
      在りか・台帳の処理状況の表（面の src/account/ledger.rs・write-set・619 行）。pub struct Cells（台帳が Known の行の欄・derive は Debug・Clone・PartialEq）と pub struct LedRow の pub fn numbers（open の task・24 時間の純減・closed/日・未反映の順の 4 つの字）が在り、numbers の 4 つ目はいつも project の ledger の module の NONE（字 ―）。pub fn table は台帳が Known の行の Cells を LedgerStats から組む。DOM の row_view は台帳が Known の行の未反映を div の class 字 c-n c-un muted の中の b に NONE で出し、Unknown の行は同じ class の div に NONE を出す。use に super::projects::led_card と crate::project::ledger の JUDGES ほかが在る。
