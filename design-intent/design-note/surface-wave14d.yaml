      依存と順。depends は c-dn-unknown（同じ build.rs と mod.rs と tests/dnrow.rs と契約の graph.rs と contract_form と snapshot・ノートの depends と便の bead の依存）。面の src/mapview/graph.rs と tests/mapgraph.rs と vocab.json を書くほかの行（計画の 5 節の g-graph-label・g-map-tips・g-pipe-misfit・c-pipe-ci）とも同時に流さず、順は便の bead の依存で持つ（5 節に書いた順）。
      範囲の外。判断の記録 ADR-7 の決定 (2) と設計ノート surface の 18 節の 17 型の字を直すこと（持ち主の問い t3-hub.65 の答えを受けて席が直す・行 c-dn-edges の便はその答えまで待つ）。depends の輪を不変条件で数えること。見本 mock v3 に無い線の形を 2 型に決めること。
      付け替え（第 0.3 版・2026-09-28）。行 t-cform-split（ノート surface-wave16a）の着地で、契約の歯 tests/contract_form.rs と snapshot tests/snapshots/contract_form.json は契約の型の群ごとの歯の file と snapshot に割られた。この行の見本と歯は群 graph の tests/cform_graph.rs と tests/snapshots/graph.json に在り、見本の id の組み立て・snapshot の読み比べ・往復・閉じた列の数えの共通の手は tests/common/mod.rs に在る。歯の名（contract_form_ で始まる名）と見本の字と verify の filter は変わらない。この節の上の段落の contract_form.rs と contract_form.json の行の番号と行の数は割る前の字で、同じ見本と歯を群の file の中で探して読む。write-set・verify・done は群の file の字に付け替えた。群の file はほかの群の行と重ならないので、同じ群の行とだけ直列に流す。

