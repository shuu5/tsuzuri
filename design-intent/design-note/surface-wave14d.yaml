  - n: 3
    type: prose
    title: 行 c-dn-unknown — 索引の知らない種類の節点の行と知らない型の辺の行を、その行だけ飛ばして数える
    body: |
      在りかの main は 4fb5ee1（計画 surface-plan 第 0.40 版・着地済みの行 c-dn-rows〔便 t3-hub.52.86〕の後）。この節の在りかの字はその code と、席の folio の pin 6467915 を main の写しの design-intent に撃った出力の値。
      なぜ。要件 FR2 は、読めない出所はその種類だけ まだ分からない とし、ほかの種類は組むとする。中核の read_design（build.rs の 162〜201 行）は、索引の節点の行の種類の語が私的な fn design_kind（141〜147 行）で読めないと、177 行の ? で索引の全部を None にし、build（54〜73 行）は設計の出所を unread に挙げる。そのため folio に種類が 1 つ増えるだけで、地図と tz graph と問いの起票の門から設計文書の節点が全部消える（席の folio の pin を 6467915 に上げた時の欠陥・計画 3 節の席の決め）。辺の行は既に、型が EdgeType::ALL の先頭の DESIGN_EDGE_TYPES（17）に無ければ組まずに skipped に数える（189〜196 行）。この行は節点の行も同じく、その行だけを組まずに数え、数を電文に出す（条 P-7 の 判定できないものは まだ分からない として表に出す）。
      在りか・中核（write-set）。build.rs（528 行）の私的な struct Design（133〜137 行）は欄 nodes・edges・skipped（usize・辺の行の数）を持ち、build の 60 行が g.skipped.design_edges に写す。mod.rs（204 行）の pub struct Skipped（112〜119 行・derive は Debug・Clone・Copy・Default・PartialEq・Eq・Serialize）は pub な欄 design_edges と ledger_edges を持ち、graph の module の pub な型なので tests から tsuzuri_core::graph::Skipped で届く。src/graph/check.rs（書かない）の g-1（85 行）は、辺の端の id が節点に無ければ、読めない出所が無いとき違反とする。
      在りか・契約と境界（write-set）。契約の src/graph.rs（555 行）の pub struct SkippedEdges（303〜310 行・derive は Debug・Clone・Copy・PartialEq・Eq・Serialize・Deserialize）は pub な欄 design と ledger（u32）を持ち、GraphDoc の欄 skipped（325 行）の型。境界の src/server/board.rs（278 行）の pub fn graph（116 行）は 196〜199 行で中核の Skipped を SkippedEdges に写し（私的な fn count は u32 に丸める）、pub struct Texts（42〜48 行）は derive Default と pub な欄 design・ledger・events・summary を持つ。src/cli/graph.rs（300 行）の pub fn design_view（113〜143 行）は 138〜141 行で design を写し ledger を 0 にする。面の crate は SkippedEdges を組まず、面の fixture の電文（tests/fixtures/surface/graph-doc.json と invariants.json）は鍵 design と ledger だけを持つ。
      形。(a) build.rs の Design の欄 skipped を skipped_nodes と skipped_edges の 2 つにし、read_design は 5 列の行の種類が design_kind で読めなければ skipped_nodes に 1 を足してその行の id を集合に入れ、次の行へ進む。3 列の行は今のまま。行の loop の後に、組んだ辺のうち端の id がその集合に在る辺を除き、除いた数を skipped_edges に足す。列の数が 5 でも 3 でもない行と空の字は今のまま None。build は g.skipped.design_nodes と design_edges に写す。build.rs の頭の doc に、種類の読めない節点の行と型の読めない辺の行はその行だけを組まずに数える旨を足し、read_design の doc を形に合わせる。(b) mod.rs の Skipped に pub な欄 design_nodes（usize・doc は設計の索引の節点の行のうち種類の語が設計の 12 種の外）を最後に足し、struct と design_edges の doc に、端が組まなかった節点の行の id の辺も数える旨を足す。(c) 契約の SkippedEdges に pub な欄 design_nodes（u32・属性 #[serde(default)]・doc は同じ旨と欄の無い電文は 0）を最後に足し、struct と design の doc を (b) と同じ旨にする。(d) 境界の board.rs は design_nodes に count(g.skipped.design_nodes) を、cli/graph.rs の design_view は doc.skipped.design_nodes を写す。std::fs と std::process と SystemTime は使わない。外の依存は足さない。
