  - n: 3
    type: prose
    title: 行 c-seat-tick — 席の card に器の tick の語と最後の判定の時刻を写し、席の block の tick の欄に語と経過の秒を出す
    body: |
      在りかの main は ca1ca76（計画 surface-plan 第 0.41 版）。この節の字はその code と fixture の値で、器（scribe2）の字は器の repo の main 0eae89eb の source と、器の実物の出力を読むだけの撃ちで確かめた。
      なぜ。要件 FR12 は席の block に器の管理 tick の健康を出すとし、見本 mock v3（ui.js の tkhbHTML）は tick の欄に印と語（healthy・stale・absent・unreadable）と最後の tick からの経過（ageTxt）を出す。今の面は器の seat tick status の healthy の yes か no だけを写し、打刻の無い席（absent）も古い席と同じ印 ! と class tk tk-stale になり、語も経過も出ない。器の doctor の席の行は末に字 heartbeat= と tick= の 2 項目を持ち、tick= の値は器の健全の 1 関数（器の src/seat/tick.rs の Health・閉じた 4 値・as_str は healthy・stale・absent・unreadable）の語で、周期の rules 行が読めない周は no-rule: で始まる語になる（器の src/seat/role.rs の tick_words）。実物の doctor の席の行は字 paths=declared:2 heartbeat=on tick=healthy tick-unit=present の形で、同じ出力の host の行も字 tick=declared を持つ。合図の最後の判定の file tick-last は 1 行の ts=<epoch 秒> decision= reason= で、器の seat tick status の last= も同じ ts。この行は語と時刻を電文に写し、面に出す（計画の 9 節の行 c-seat-tick・拠る要件は FR12 と、器の値を写して判じない NFR2 の読めない欄だけ測れていない）。
      在りか・契約（write-set）。src/seat.rs の pub struct SeatCard（derive は Debug・Clone・PartialEq・Serialize・Deserialize）の pub な欄は at・target・state・since・tick_healthy（Reading の bool）・heartbeat（Reading の bool）・account・model・group・usage・spans・moves の 12 で、欄に serde の属性は無い。閉じた型 SeatState は ALL と serde の rename_all kebab-case を持つ。契約の歯 tests/contract_form.rs の fn forms は seat::SeatCard の見本を 2 つ struct の字で組み（Wait の見本と、全部が読めない見本・at は const AT の 1790494620）、contract_form_snapshot_matches が tests/snapshots/contract_form.json と字を比べ、contract_form_roundtrip_all_types が往復を見る。SeatCard は契約の account の ProjectRow の欄 seat にも入る。
      在りか・中核（write-set）。src/seat.rs の pub fn card（型 fn(&str, Option<&str>, &SeatTexts, EpochSecs) -> SeatCard）は、doctor の字の頭が字 seat: で target が席の名の最初の行（私的な fn seat_line）から account と model を読み、seat tick status の同じ席の行から tick_healthy と heartbeat を読み（私的な fn flag）、私的な fn state_of が tick-last の字の空でない最後の行の reason と ts で限度と応答なしを判じる。私的な fn field は行の空白で区切った字のうち鍵と等号の最初の値。pub struct SeatTexts（derive は Debug・Clone・Default・PartialEq・Eq・Deserialize）の欄は変えない。中核の歯 tests/seat.rs は fixture tests/fixtures/seat/seat-inputs.json（組 run・wait・limit・silent・no-state・unread の 6 組・7 つの字と期待の card）を SeatTexts に flatten で読んで組んだ card を期待の card と比べ（seatcard_fixture_six_cases）、seatcard_unread_text_touches_only_its_fields は組 run の字を 1 つずつ無くして変わる欄を名指す（doctor の腕と tick_last の腕を直す）。
      在りか・面（write-set）。src/project/seat.rs の pub struct Top の pub な欄は state・icon_class・key・label_class・since・tick（Reading の Sign）・heartbeat・toggle で、pub fn top は tick を tick_healthy の真偽の印（pub fn sign・pub const OK は字 ✓ と class gi ok・NG は字 ! と class gi ng）にする。pub fn seat_line（詳しくの doctor の行）は tick の語を tick_healthy の真偽から healthy・stale・? にする。DOM の src/project_dom/seat.rs（mod dom・wasm の target のときだけ）の fn top_view は tick の欄を class tk tk-healthy・tk tk-stale・tk の span に印と hs の tick_health だけで組む。面の src/account/session.rs（書かない）は account board の orchestrator の行の印を project の seat の top の欄 tick と heartbeat から取り、自分の fn tick_class で class にする。stylesheet は規則 .tkhb .tk-stale b と .tkhb .tk-healthy b と .gi.unknown を持つ（見本の ui.css の写し・書かない）。crate::net の pub fn ticker は 1 秒の時計の signal（wasm の target だけ）。
      形。(a) 契約の seat に pub enum TickHealth（done の項 1）を置き、SeatCard の heartbeat の直後に pub な欄 tick（doc は器の doctor の席の行の tick の語・4 つの語のほかと行か語が無いときは Unknown・属性 serde の default に私的な fn unknown〔Reading::Unknown を返す〕）と tick_at（doc は合図の最後の判定の時刻・属性 serde の default）を足す。(b) 中核の card は、席の行の field tick の語を TickHealth::ALL の as_str と比べて Known にし（私的な fn tick_health・どれにも当たらなければ Unknown）、tick-last の空でない最後の行（私的な fn last_tick・state_of もこれを使う）の field ts を u64 に読んで tick_at にする。閾値は持たない。(c) 面の Top に pub な欄 tick_word（Reading の TickHealth）・tick_at・at（電文の at）を足し、欄 tick は今のまま（account board の印は変えない）。pub const BLANK（字は空・class gi unknown）と pub fn tick_sign（healthy は OK・stale と unreadable は NG・absent は BLANK）・tick_mark・tick_class・age_text・tick_age（done の項 10〜12）を置き、seat_line は語が読めれば語を書く。(d) DOM の top_view は tick の欄の class を tick_class、印を tick_mark にし、hs の tick_health の後に語の b と、crate::net::ticker の今で書き直す経過の class num の span を置く（見本の tkhbHTML の順）。
      決めた幅。(e) 毎秒書き直すのは tick の経過の秒だけで、席の block の since は時刻の表示のまま（席の決め 2026-09-28・計画の what の席の since の毎秒の書き直しの字は席が直す）。(f) 経過は今と電文の at の大きい方から tick_at を引き（端末の時計が遅れても読んだ時点より小さくしない・account board の elapsed_at と同じ決まり）、語が absent か unreadable の時と時刻が無い時は出さない（見本は打刻の読めない席に経過を出さない）。(g) 語の読めない周（no-rule の語・doctor が読めない・行が無い）の印と class は今の健康の真偽からで、見本の past（つまみで遡った時点）は面に無いので作らない。(h) header の席の pill（src/seatpill.rs）と account board の orchestrator の行は tick_healthy のまま（absent を stale と出す件はこの行の外・席への申し送り）。(i) 新しい 2 つの欄は serde の default を持つので、欄の鍵の無い fixture の電文（tests/fixtures/surface/seat-card.json と account/acct-doc.json）は書き直さない。期待の card を中核の出力と比べる seat-inputs.json だけを書く（done の項 7）。(j) 作法 6 の新しい型の歯は契約の tests/ctick.rs に置き、語の列を歯の中の字で pin する（4 語なので snapshot の file を足さない）。
      着地済みの歯（grep で確かめ、試作で撃った）。期待を直すのは契約の contract_form_snapshot_matches（snapshot に 6 行）と中核の seatcard_fixture_six_cases と seatcard_unread_text_touches_only_its_fields。直さずに通るのは、契約の acctdoc_ の 6 本（fixture の電文に鍵が無く、unknown の字の在りかの一覧は fixture の字から数える）、中核の acctpcore_ の 7 本（card を中核の関数で組んで比べる）と nstall_（fixture の card を読むだけ）、境界の server_seat_ の 10 本（偽の器が tests/fixtures/seat/seat-inputs.json の組 run の字を返し、server_seat_card_matches_core が同じ字から組んだ中核の card と比べる）、面の sesplit_（seat.rs の名は列に在る数以上・mod dom の名の列は変えない）・smore_（fixture に鍵 tick が無いので doctor の行は今の字）・ghb_ と saxis_ と smore_dom_text（top_view と mod dom の字の在る無し）・seatblock_（上段の state と since と鍵）・steady_details_use_fold_record（src/project_dom の同じ名の file を読む）。面の gpill_ と account board の歯は tick_healthy を読むだけで変わらない（xtask の check が撃つ）。
      測り方。新しい歯は契約の tests/ctick.rs（2 本）・中核の tests/ctick.rs（5 本）・面の tests/ctickface.rs（5 本）に置き、名を接頭辞 ctick_ で始める。使う item はどれも pub（契約の seat の TickHealth と SeatCard の欄・中核の seat の SeatTexts と card と anchor・面の project の seat の Top と top と BLANK・OK・NG と tick_mark・tick_class・age_text・tick_age・seat_line と、契約の wire と board の Reading）。中核の歯の ctick_own_names_clean は CARGO_MANIFEST_DIR の 2 つ上から 3 つの file を読み、test の属性の行の次の fn の名を集める。外の依存は足さない（契約と中核の歯は serde と serde_json を dev の依存として既に持つ）。filter の語（main ca1ca76 の contracts と計画の verify の filter の語 227 を、ほかの語を部分の字として含まない 153 語に畳んだ語）は aaround_・accept_・acchold_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadopt_・cdorm_・cgdom_・cmark_・contract_form_・cround_・csled_・denv_・dnedge_・dnrow_・dnskip_・ecache_・epolq_・flight_・fmark_・fprem_・frame_・fserve_・fstop_・gapspage_・gbnote_・gfix_・gfresh_・ghb_・gjst_・glabel_・gnav_・gpface_・gpill_・gpulse_・graph_・gsum_・gtuck_・gview_・hacols_・harest_・hasplit_・hbconf_・hbmark_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hdchip_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hshist_・hspage_・hsym_・iclose_・ilink_・kcli_・klink_・launch_・lcard_・ledgerblock_・lhome_・lidle_・lresume_・lsnap_・lspark_・lstore_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・parts_・pclosed_・pfold_・pipe_・plimit_・pmisfit_・pmore_・pquest_・pqueue_・project_・ptitle_・punmap_・pwhole_・qblock_・qgate_・qkey_・question_・relay_・rhold_・runsdoc_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・stcli_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_ で、新しい歯の名から先頭の ctick_ を除いた字は、このどれも部分の字として含まない（接頭辞 ctick_ もどの語も含まない）。試作（main の写しに当てた）で新しい 12 本と verify の着地済みの歯が通り、中核の card の tick を Unknown に戻すと ctick_card_copies_word_and_ts と seatcard_fixture_six_cases ほかが、absent の印を NG にすると ctick_sign_and_class_per_word が落ちることを同じ写しで確かめた。wasm の target の clippy も通った（書く src の file はどれも受付の上限 1500 行の中）。
      依存と順。depends は空（計画の依存の字 g-seat-split は着地済み）。計画の 5 節の鎖で、契約の seat.rs と中核の seat.rs はこの行が先で、後に c-seat-group と、器の欄を写す後の行（c-seat-grace と c-limit-resume）が続く。面の project/seat.rs と project_dom/seat.rs は g-jst（着地済み）の後でこの行が先（後の行の順は契約と中核の seat.rs と同じ）。契約の歯 contract_form と snapshot は 5 節の 1 本の鎖に入れ、境界の歯 tests/server_seat.rs（置き場だけの =）は e-seat-hbmark（着地済み）の後で c-seat-grace より先。これらの file を write-set（置き場だけの = を含む）に持つほかの行とは器が同時に流さないので、順は便の bead の依存で持つ。
      範囲の外。退避の猶予の残り秒と移動と再開の時刻（器が seat tick status の席の行に足す欄を写す後の行・欄が届くまで tsuzuri は代わりの計算を作らない・席の決め 2026-09-28）と、群の移動の断りと逼迫。header の席の pill と account board の tick の印を語にすること。席の since を経過にすること。器の rules の周期の値（健全の閾値）を面に出すこと。
      付け替え（第 0.3 版・2026-09-28）。行 t-cform-json と t-cform-split（ノート surface-wave16a・この順）の着地で、契約の歯 tests/contract_form.rs と snapshot tests/snapshots/contract_form.json は契約の型の群ごとの歯の file と snapshot に割られた。この行の見本と歯は群 seat の tests/cform_seat.rs と tests/snapshots/seat.json に在り、見本の id の組み立て・snapshot の読み比べ・往復・閉じた列の数えの共通の手は tests/common/mod.rs に在る。歯の名（contract_form_ で始まる名）と見本の字と verify の filter は変わらない。この節の上の段落の contract_form.rs と contract_form.json の行の番号と行の数は割る前の字で、同じ見本と歯を群の file の中で探して読む。write-set・verify・done は群の file の字に付け替えた。群の file はほかの群の行と重ならないので、同じ群の行とだけ直列に流す。

