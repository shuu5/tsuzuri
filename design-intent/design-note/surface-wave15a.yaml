    title: 目的
    body: |
      席の card と project board の席の block の tick の欄の行 1 つ。
      器の doctor の席の行の tick= の語を契約の閉じた 4 つの型 TickHealth に写し、4 つのほかの語と読めない行は測れていないにする。
      合図の最後の判定 tick-last の空でない最後の行の ts を、席の card の tick の時刻にする。
      面は tick の欄の印と class を語から決め（語が読めなければ今の健康の真偽から）、語と、最後の tick からの経過の秒を出し、経過は 1 秒の時計で書き直す。
      閾値を持たず、header の席の pill と account board の印と席の since の表示は変えない。
      外の依存は足さない。
