    title: 行 c-pipe-ci — 着地して CI を待つ走行を板に CI 中として出す
    body: |
      在りかの main は e24fab6（計画 surface-plan 第 0.42 版・要件書 v0.15・行 c-pipe-misfit の便 t3-hub.52.88 の着地 ca1ca76 と、行 f-premises の便 t3-hub.52.90・行 h-acct-split の便 t3-hub.53.27・行 g-policy-face の便 t3-hub.52.91・行 h-dormant の便 t3-hub.53.26・行 h-sort-hist の便 t3-hub.53.28 の着地の commit と、判断の記録 ADR-17・規則の行 R-22 の直し・行 t-fx-prefix を置いたノート surface-wave15c の後。f-premises と h-acct-split と h-dormant と h-sort-hist が書いた file〔中核の gate.rs・graph/build.rs・graph/mod.rs と面の account の block と歯〕はこの行の write-set に無い。g-policy-face は契約の歯 contract_form.rs と snapshot の RulingId と PolicyResponse の見本を直した。面の pipeline.rs と vocab.json と歯 gfix.rs は、行 g-pipe-misfit（ノート surface-wave12g の第 0.2 版）の便 t3-hub.52.89 の着地の commit の字。この行の write-set のほかの file は ca1ca76 の字から変わらない）。code の字は main の file を読み、台帳は読むだけの bd で、器（scribe2）の code は repo を読むだけにし（入った binary の build 元の commit 4d3ba2ca）、器の event log は tsuzuri の state dir の fleet/events.jsonl を読んだ。
      なぜ。持ち主の指示（チャット 2026-09-28T11:4xZ・逐語は t3-hub.1 の notes）は、着地して CI を待つ走行を pipeline の板に CI 中とわかるように出すこと。同じ日に、席は器の binary の入れ替えの窓で、着地して CI を待つ走行（器の driver が生きている）を 0 本と数え違えた。今の板は、器の event の RunDone をどれも段 Landed にし（中核の pipeline の fn stage_of の腕 RunDone は段 Landed と理由 None）、走行の最後の event で段を決めるので、CI を待つ走行も CI の終わった走行も同じ段 Landed・理由 None の札で、Landed の列は今日（日本の日）の着地だけを出す。器の終端（crates/scribe2/src/pipe/land/finish.rs の fn terminal と fn note）は、着地を記す RunDone（段 Landed・detail は字 sha: と着地の sha と字 main: と main の sha）の後に、段ごとに 1 件、段 Landed の RunDone を detail の字 terminal: と段の語で記す。語は push（字 push: と remote の名、落ちれば push:failed:git）、CI の照合（ci:success・ci:failure・ci:unmeasurable のどれか 1 つ）、台帳の close（close:ok か、落ちれば close:failed:unlaunchable か字 close:failed:rc= と rc の数と空白と末の行）の順で、宣言が読めない周は unreadable の 1 件、押す先の宣言が無い周は 0 件で、止まった段から先は記さない。success のときだけ器が bead を閉じ（閉じた理由 landed と sha と ci=success）、failure と測れずと close の落ちは閉じずに driver が終わる（rc 1）。器の land.rs の TERMINAL_TOKENS は fn terminal が返す値の閉じた一覧で、event log には記さない（終端のまとめの行は無い）。器は CI を規則の行 pipe.ci_poll_s（30 秒）ごとに pipe.ci_wait_s（900 秒）まで見る。終端のやり直し（pipe land --terminal-only）は同じ走行に push から記し直す。器の着地の後の検出（detection）は子 process が後から段 Landed の RunDone を字 detection: と語で記しうる（tsuzuri の宣言は検出の行を持たず、event log に 0 件）。器の席の答え（2026-09-28T11:5xZ・控え t3-hub.63 の notes）も、CI を待つ間は push の行が在って ci の行が無い間、と言う。tsuzuri の event log には terminal:push:origin が 137 件・terminal:ci:success が 117 件・terminal:ci:unmeasurable が 20 件・terminal:close:ok が 117 件在り、ci:failure は 0 件。2026-09-28 の便 t3-hub.52.86 の走行は 11:37:39Z に着地・11:37:41Z に push・11:44:22Z に ci:success・11:44:24Z に close:ok、t3-hub.52.87 は 11:42:10Z・11:42:13Z・11:48:56Z・11:48:58Z（どちらも 6 分 40 秒ほど CI を待った）。今の台帳で、いちばん新しい走行が CI の読みを持つ bead はどれも閉じている（success 117・測れず 20）。この行は計画の 6 節の控え t3-hub.63（issue の一生の道筋の整理）の候補 (d) で、先に足す小さな直し。
      在りか・契約（crates/tsuzuri-contract/src/board.rs・write-set・215 行・g-pipe-misfit は書かない）。lib.rs は pub mod board と serde の encode と decode の pub mod wire を持つ。board の pub enum Stage は 8 つ（Queued・Blocked・Running・Gated・Questioned・Failed・Stopped・Landed・pub const ALL と pub fn column）、pub enum PipelineColumn は 4 列、pub struct PipelineCard（derive は Debug・Clone・PartialEq・Eq・Serialize・Deserialize・doc は pipeline の札〔契約 bead・走行の回数・段・段の理由・口座・経過〕）は pub な欄 contract（BeadId）・runs（u32）・stage（Stage）・reason（String の Option）・account（String の Option）・elapsed_s（u64 の Option）をこの順に持つ。PipelineCard の後に pub enum Misfit と pub struct MisfitBead が在り（行 c-pipe-misfit）、pub struct PipelineBoard は欄 cards と misfits を持つ。契約の歯 tests/contract_form.rs（write-set・1427 行・この行の前に流す行が見本を足す・型の群ごとの file に割る t-cform-split はこの行の後）の fn pipeline_card は bead t3-hub.3・回数 2・段 Running・理由 verify・口座 acct-4・経過 185 の札で、fn forms は鍵 board::Stage・board::PipelineColumn・board::PipelineCard（見本は pipeline_card と、bead t3-hub.4・回数 0・段 Queued・ほかは None の札の 2 つ）・board::PipelineBoard（見本 3 つ）の順に form を持ち、fn contract_form_closed_lists は distinct(&Stage::ALL) が 8 と見る。snapshot の tests/snapshots/contract_form.json（write-set）は forms の順の鍵の値の字。
      在りか・中核（crates/tsuzuri-core/src/pipeline.rs・write-set・513 行・g-pipe-misfit は書かない）。中核の lib.rs は pub mod pipeline と pub mod next_step を持つ。pipeline は pub const STAGE_EVENTS（RunCreated・RunStage・RunDone・QuestionRaised）・CLOSED_TAG（字 closed:）・RETIRED（字 retired）ほかと pub fn stage_of・form_ids・board・board_with_doctor（行 c-pipe-misfit）・runs_of を持つ。私的な struct RunState は欄 last（段を決めた最後の event）・account・stopped を持つ。私的な fn of_inputs（台帳の bead の Option と event log の字と今）は、event log を順に読み、走行ごとに口座の札を後ほど勝つとして読み、STAGE_EVENTS の event（detail が RETIRED の RunStage を除く）で last を替える。bead ごとの札はいちばん新しい走行の last を stage_of で段と理由にし（問いの後に止めた走行の理由を足す）、台帳で閉じた bead（台帳に在り is_open が偽）は、段が Landed ならそのまま、ほかは段 Landed と理由 closed: と閉じた理由の頭の札にし、表に無い段は数えて札にしない。経過は last の ts から今までの秒。走行の無い open の task は Blocked か Queued の札（欄は None）。next_step の私的な fn stalled_run は of_inputs の札のうち段が pub const STALLED_STAGES（Failed と Stopped）で bead が open の札を数え、対象は経過のいちばん長い札の bead。中核の account の project は stage_of を直に呼び、pipeline の of_inputs を通らない（この行は書かない）。中核の src/ledger/mod.rs と src/ledger/stats.rs は書かないが、それらの単体の歯（名は stats_ で始まる）は src/pipeline.rs の単体の歯 stats_stage_of_closed_table と stats_detail_account_takes_the_last と同じ filter に当たる。
      在りか・面（crates/tsuzuri-surface/src/project/pipeline.rs・write-set・733 行・crates/tsuzuri-surface/vocab.json・write-set）。面の lib.rs は pub mod project・view・vocab・kit を持ち、project は kit の再公開（Body ほか）と、build.rs が dir の file から組む block の pub な module（pipeline を含み、tsuzuri_surface::project::pipeline で引ける）を持つ。pipeline は pub const LANES（4 列・Landed の列の state は None で取り込みの印）・CLOSED_TAG・CLOSED_STAGE（字 閉じた（着地せず））・NO_AGE（字 ―）と、pub enum Lead（Runs の u32 と Why の String）・pub struct Kcard（pub な欄 id・title・state〔状態の記号の値・None は取り込みの印〕・lead・age・class・hover・run_line・run_more・closed）と、pub fn landed_today（段の列が Landed で、今から経過を引いた時刻の日本の日が今の日本の日と同じ・view の jst を使う・行 g-jst）・columns（列の中は経過の短い順・Landed の列は landed_today の札だけ）・closed_card・kcard（why は段の理由か段の名・run_line は字 ↻ と回数と段の字と why の頭 20 字を字 · でつなぐ・止まった列は lead が Why(why) で class が kcard why-stop・ほかは Runs(回数) と kcard・state は列の state）・content（口の電文を札にし台帳の口の読みから題を引く）を持つ。mod dom の fn kcard_view は、閉じた札は CROSS、state が Some なら kit の state_icon（値 run は class st st-run と語 動いている の aria）、None なら CHECK を字 color:var(--s-land) で出し、meta に kid・lead・閉じた札の CLOSED_STAGE の span・CLOCK と age を並べる。pipeline は要修正の行の pub const MISFIT_KEY・MISFIT_CLASS・NEITHER_TEXT・BOTH_TEXT と pub struct MisfitCard と pub fn misfit_text・misfit_cards・misfit_href と mod dom の fn misfit_view（kcard_view の前）を持ち（行 g-pipe-misfit）、面の歯 tests/gfix.rs の fn known_card は PipelineCard の字を 1 つ組む。語の辞書（vocab.json・1638 行・末に改行が無い・この行の前に流す h-acct-rest と c-dn-edges も鍵を足し、h-acct-spark は鍵 spark の字を直す）は欄 english と rephrase を持ち（欄 rephrase の末に鍵 misfit・行 g-pipe-misfit）、欄 english の鍵 col_land は語 Landed（今日）・注 今日（日本時間）、本線に取り込まれたか、着地せずに閉じた run・内部の名 Landed・今日。面の vocab の pub fn label は表に無い鍵を、字 語彙表に無い と鍵を亀甲の括弧で包んだ字にする。着地済みの歯 frame_no_heading_words_in_code は面の src に語の辞書の日本語の語を引用符の中の字として直に書くことを断る。
      形・契約。board の PipelineColumn の後に pub enum Ci（着地の後の CI の読み・閉じた 7・doc は器の RunDone の終端の detail の語から読む）を足す（変種 Waiting〔push の後で CI の結果が無い〕・Success・Failure〔器は bead を閉じない〕・Unmeasurable〔器は bead を閉じない〕・PushFailed〔push が落ちた〕・CloseFailed〔CI は通ったが close が落ちた〕・Unreadable〔終端の宣言が読めない〕・derive と serde は Misfit と同じ・pub const ALL）。PipelineCard の最後に pub な欄 ci（Ci の Option・doc は器が着地を push した走行だけ Some）を足し、struct の doc に着地の後の CI を足す。ほかの型は変えない。contract_form.rs は Ci を use に足し、PipelineCard の 2 つの字に ci: None を足し、forms に form board::Ci と PipelineCard の 3 つ目の見本（done (2)）を足し、contract_form_closed_lists に Ci の字の列を足し、snapshot を同じに直す（board::Ci の 7 語・PipelineCard の見本の欄 ci）。
      形・中核。pipeline に pub const TERMINAL_TAG・PUSH_WORD・CI_WORDS・FAULT_WORDS・CI_STALLS（done (3) の値）と pub fn ci_after を足す。ci_after は detail が TERMINAL_TAG で始まらなければ前の読みを返し、頭の後の語が FAULT_WORDS の語で始まればその読み、ほかの PUSH_WORD で始まれば Waiting、CI_WORDS の語ちょうどならその読み、ほかは前の読みを返す。着地の後の終端の段の判定は判定の関数 pub fn ci_reading 1 つに閉じる（入力は走行の event の行のログの順の列・出力は読みと器の語・done (15)）。ci_reading は種類 RunDone の行の detail を ci_after で順に重ね、器の語は走行の最後の TERMINAL_TAG で始まる RunDone の detail の字。RunState に欄 rows（走行の event の行の列）を足し、of_inputs は走行の event を rows に積む（段を決める last の決まりは変えない）。中核の札と面は ci_reading の出力だけを使い、ci_after を ci_reading の外で呼ばない。札は、stage_of の段が Landed のときだけ走行の rows を ci_reading に渡し、今の段と理由の決め（閉じた bead の closed: の札を含む）の後に私的な fn with_ci で重ねる。with_ci は、読みが None か、台帳で閉じた bead で読みが Waiting なら段と理由のままで ci None、閉じていない bead（台帳が読めないときと台帳に無い bead も）で読みが CI_STALLS に在ればその段・理由は ci_reading の器の語（器の detail の字のまま）、ほかは段と理由のままで ci はその読み。Blocked と Queued の札の ci は None。module の頭の doc にこの決まりを足す。stage_of・STALLED_STAGES・next_step・runs_of は変えない。
      形・面。pipeline に pub const CI_KEYS（done (7) の 7 対）・CI_MARK_S（600・結果の語を Landed の列の札に出す経過の上限の秒）・CI_WAIT_STATE（字 run）と、pub fn ci_key・ci_shown・ci_style を足し、Kcard の最後に pub な欄 ci（Ci の Option・Landed の列ほかの札の meta に足す読み・止まった列の札は None）を足す。ci_shown は札の ci が Waiting ならいつも、段の列が止まった列ならいつも、ほかは経過が CI_MARK_S 以下のときだけその読みを返す。kcard は ci_shown が Some なら why を vocab の label(ci_key(読み)) にし、読みが Waiting なら state を Some(CI_WAIT_STATE) にし、欄 ci は止まった列でなければ ci_shown の値。columns の Landed の列は landed_today の札に、札の ci が Waiting の札を足す。mod dom の kcard_view は meta の閉じた札の span の後と CLOCK の前に、欄 ci が Some なら span（style は ci_style・字は label(ci_key(読み))）を足す。module の頭の doc と columns と kcard と Kcard の doc にこの決まりを足す。vocab.json の欄 english の鍵 col_land の後に 7 つの鍵を足す（ci_wait は注 本線に取り込んだ後で、CI の結果を待っている run／・ 器が CI を見ている／・ 結果が出るまで Landed の列に出る、ci_success は注 本線に取り込んだ後の CI が通った／・ 器が bead を閉じる／・ 10 分の間だけ札に出る、ci_failure は注 本線に取り込んだ後の CI が落ちた／・ 本線が赤い／・ 器は bead を閉じない／・ bead が open の間は止まった列に出る、ci_unmeasurable は注 本線に取り込んだ後の CI の結果を器が測れなかった／・ 器は bead を閉じない／・ bead が open の間は止まった列に出る、ci_push_failed は注 本線に取り込んだ後の push が落ちた／・ CI に届かない／・ 器は bead を閉じない／・ bead が open の間は止まった列に出る、ci_close_failed は注 CI は通ったが台帳の close が落ちた／・ 器は bead を閉じられない／・ bead が open の間は止まった列に出る、ci_unreadable は注 着地の後の終端の宣言を器が読めなかった／・ push の前に止まる／・ 器は bead を閉じない／・ bead が open の間は止まった列に出る・／は改行・内部の名は器の detail の語と段）。ci_style は Waiting と Success のほかの 5 つの読みを止まった色の太字にする。鍵 col_land の注を done (8) の字に、内部の名を Landed・今日 と改行と字 CI を待つ run は日を問わない に替える。語は src に字で書かず label で引く。style.css と ほかの block と LANES と landed_today は変えない。
      決めた幅（起草の決め・席が決めること）。(a) CI の failure の札は、台帳で bead が open の間は止まった列（段 Failed）に出す。Landed の列のまま赤い印にしない理由は 4 つ。Landed の列は今日の着地だけを出すので、夜をまたいだ failure が列から消える。止まった列は理由を赤の太字で札に出す見本 v3 の形を持ち、新しい見た目を足さずに目立つ。器も failure を止まりとして扱う（bead を閉じず rc 1・閉じない側へ倒す極性）。次の一手の止まっている走行（段 Failed と Stopped で bead が open の札）に乗り、席の仕事になる（控え t3-hub.63 の候補 (c) の向き）。着地した事実は hover の段の字と理由と語の注で残る。(b) 測れずは段 Stopped にする（failure と融合しない・器の C10 と同じ）。push と close の落ちは段 Failed、読めない終端は段 Stopped にする（落ちたは Failed・分からないは Stopped・条 P-7 の分からないを分からないと出す・席の決め 2026-09-28）。(c) CI を待つ札は日を問わず Landed の列に出す（driver が落ちて ci の行が来ない札も、経過の字が長くなって見える）。規則の行 pipe.ci_wait_s は器の値で tsuzuri は読まないので、待ちすぎの印は付けない。(d) success の語は経過が CI_MARK_S（600 秒）以下の間だけ出し、後は普通の着地の札（持ち主の指示の成功か失敗の印を短く出す）。経過は server が読んだ時の値なので、次の読みまで語が残りうる（経過の字と同じ）。(e) 台帳で閉じた bead の札は Waiting を落とし（閉じた後は待っていない）、ほかの読みは電文に残し、面は結果の語をCI_MARK_S の間だけ出す。(f) 読むのは bead のいちばん新しい走行だけで、終端のやり直しは後の push から読み直す。(g) 台帳が読めないときと台帳に無い bead は閉じていないと読む（行 c-pipe-closed の決まりと同じ・event log の段のまま）。(h) 段の理由は走行の最後の終端の detail の字（terminal:ci:failure・terminal:push:failed:git・terminal:close:failed:rc=1 x ほか・器の字のまま）で、面は札に語の辞書の語を出す。(i) 時刻の字は足さない（今日の決めは着地済みの landed_today・行 g-jst のまま）。(j) 欄 ci の無い電文（fixture の tests/fixtures/surface/pipeline-board.json と古い server）は None に読む（serde は欄の無い Option を None に読むので default の属性は付けない）。
      範囲の外（席への申し送り）。(1) account board（中核の account の project の fn run_counts と session の表）は stage_of を直に読み、CI を待つ走行を land に数え、session の表は RunDone を持つ走行を出さないので、そこでは CI 中が見えない（後の行か t3-hub.63）。(2) 台帳で閉じた bead の push の落ち・close の落ち・読めない終端の札は、段を変えずに結果の語を CI_MARK_S の間だけ出す（閉じた後の落ちを止まった列に出すかは t3-hub.63 の段の表）。(3) 要件 FR10 の字は CI に触れない（字を足すかは席）。(4) 走行の頁（runs_of・行 e-runs）は段の列と detail を今のまま出す。(5) 器の event の形は器の答えのまま読むだけで、器に event を足すことは頼まない。(6) この行の判定は仮の形で、器の段の出力が来たら判定の関数 ci_reading の中身を替える（面と契約は変えない・器が state dir に段の出力の file を書くのは 1 日を超える見込み〔器の席の答え 2026-09-28〕）。
      着地済みの歯（中核と面と契約と境界の tests と src を grep で確かめ、試作で撃った）。PipelineCard の字を組む着地済みの歯は、中核の tests/pquest.rs・punmap.rs・pclosed.rs・pqueue.rs の fn card と pmisfit.rs の fn want_cards の中の 2 つと、面の tests/gjst.rs の fn landed・pipe.rs の fn card・pclosed.rs の fn card・cmark.rs の fn card・gfix.rs の fn known_card と、契約の contract_form.rs の 2 つで、どれにも ci: None を足す（write-set）。面の gjst_vocab_land_note は鍵 col_land の注を pin するので done (8) の字に直す。fixture の台帳と event log は字 terminal: の行を持たないので、中核の stats・nstall と面の cadopt・kcardlink・pfold・pclosed と境界の server_read・server_coalesce・pmisroute（pipeline の板の電文と中核の board の値を比べる）の期待は変わらない（置き場だけの =）。面の frame・hsym・helpfig・gfresh・nstall・nextact は語の辞書の全部の鍵を読むので置き場だけの = で持つ。着地済みの歯 cmark_dom_text が kcard_view の後に見る字（card.closed・CROSS・CLOSED_STAGE・var(--ink-3)・CHECK・var(--s-land)・a の class と href と use:attach）は残す。
      測り方。中核の tests/pci.rs（新しい file）は台帳と event log を serde_json の json で歯の中で組み（done (4) の字）、中核の pipeline の board と next_step の next_step と ci_after と ci_reading を直に撃ち、札の電文は serde_json で読み書きし、中核の src/pipeline.rs と面の src/project/pipeline.rs の字を読む（CARGO_MANIFEST_DIR から）。面の tests/pcimark.rs（新しい file）は PipelineCard の値を歯の中で組み、面の project の pipeline の kcard・ci_shown・content と vocab の vocab を撃ち、src/project/pipeline.rs の字を読む（CARGO_MANIFEST_DIR から）。どちらも fixture の file を足さず、bead の id の接頭辞は fx-ci と fx-cm。
      filter の語（main e24fab6 の contracts の verify の filter の語 231 を、ほかの語を部分の字として含まない 157 語に畳んだ語と、並行の起草の行の接頭辞 2 語〔cadl_・cadq_〕・この行の接頭辞 pci_ は並べない）は aaround_・accept_・acchold_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadl_・cadopt_・cadq_・cdorm_・cgdom_・cmark_・contract_form_・cround_・csled_・cspk_・ctick_・denv_・dnedge_・dnrow_・dnskip_・ecache_・epolq_・flight_・fmark_・fprem_・frame_・fserve_・fstop_・fxpre_・gapspage_・gbnote_・gfix_・gfresh_・ghb_・gjst_・glabel_・gnav_・gpface_・gpill_・gpulse_・graph_・gsum_・gtuck_・gview_・hacols_・harest_・hasplit_・hbconf_・hbmark_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hdchip_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hshist_・hspage_・hspk_・hsym_・iclose_・ilink_・kcli_・klink_・launch_・lcard_・ledgerblock_・lhome_・lidle_・lresume_・lsnap_・lspark_・lstore_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・parts_・pclosed_・pfold_・pipe_・plimit_・pmisfit_・pmore_・pquest_・pqueue_・project_・ptitle_・punmap_・pwhole_・qblock_・qgate_・qkey_・question_・relay_・rhold_・runsdoc_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・stcli_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_ で、新しい歯の名はどれも pci_ で始まり、名の全体がこのどれも部分の字として含まない（例 pci_stage_x・pci_pipe_x・pci_nsum_x は不可）。歯の 2 つの file は同じ 159 語を const FILTER_WORDS に持つ。名は done に書いた pci_words_fold・pci_cards_with_ledger・pci_cards_without_ledger・pci_stalled_move・pci_wire_default・pci_core_names_clean・pci_reading_one_fn・pci_vocab_words・pci_shown_rule・pci_kcard_marks・pci_columns_keep_waiting・pci_dom_text・pci_surface_names_clean。
      依存と順。ノートの depends は空（folio の床は契約表の行の depends を同じノートの行の id だけで照らすので、ほかのノートの行は書けない）。この行の便の bead は行 g-pipe-misfit（ノート surface-wave12g の第 0.2 版）の便 t3-hub.52.89 に依る（席が bead の依存で持つ・g-pipe-misfit はmain に着地の commit が在る）。同じ契約の board.rs・中核の pipeline.rs・contract_form.rs と snapshot・面の pipeline.rs と歯 pipe.rs を書いた行 c-pipe-misfit（便 t3-hub.52.88・中核の歯 pmisfit.rs を足した）は着地済み。g-pipe-misfit とは面の pipeline.rs と vocab.json と歯 gfix.rs を書き、面の歯 cmark・pclosed・pfold・frame・hsym・helpfig・gfresh・nstall・nextact・cadopt・kcardlink で = が重なる。歯 gfix.rs の fn known_card は PipelineCard の字を組むので、この行が欄 ci: None を足す。契約の歯 contract_form と snapshot は計画の 5 節の順（c-pipe-misfit〔着地済み〕→ g-policy-face → c-limit-resume〔留めの間は飛ばす〕→ h-acct-rest → c-dn-unknown → c-dn-edges → t-fx-prefix → c-seat-tick → この行 → t-cform-split → c-updated → c-abs-time・置いた行を先に、まだ起草していない行を後に並べた席の決め）で流す（歯の file を割る t-cform-split はこの行の後なので、この行は割る前の 1 つの file を書く）。vocab.json は h-acct-rest（ノート surface-wave13c）と c-dn-edges（ノート surface-wave14d）と h-acct-spark（ノート surface-wave15b）も書くので、g-pipe-misfit → h-acct-rest → c-dn-edges → h-acct-spark → この行の順に流す。後の行 t-cform-split（契約の歯と snapshot）と c-abs-time（契約の board.rs）と g-tick-adopt（面の pipeline.rs）はこの行の後。外の依存と Cargo.toml と Cargo.lock と境界の src と style.css は触らない。src の行数は試作で契約の board.rs 215 → 249・中核の pipeline.rs 513 → 612・面の pipeline.rs 733 → 803（上限 1500 から遠い）・契約の歯 contract_form.rs は 1427 に 29 行を足す（前に流す行の足しを載せても上限 1500 の内の見込み）。

