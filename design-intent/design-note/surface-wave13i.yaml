sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      着地して CI を待つ走行を pipeline の板に CI 中として出す、契約と中核と面の crate の行 1 つ。
      札に着地の後の CI の読み（待つ・success・failure・測れず・push の落ち・close の落ち・読めない終端）を置く。読みは器が着地の後に段ごとに記す RunDone の detail の語から、bead のいちばん新しい走行の分を順に重ねて決める。
      CI を待つ札は Landed の列に日を問わず、動いているの記号と語 CI 中で出す。CI の結果の語は 10 分の間だけ出し、その後は普通の着地の札にする。
      台帳で閉じていない bead の CI の failure と push・close の落ちは段 Failed、測れずと読めない終端は段 Stopped の札にして止まった列に出し、次の一手の止まっている走行に数える。
      語は語の辞書の 7 つの鍵から引く。境界の crate と外の依存は変えない。
