  - n: 3
    type: prose
    title: 行 hb-proc — 子 process の撃ち方と時刻の読みを割る
    body: |
      なぜ。境界の crate の server の ledger.rs（381 行）は、台帳の読みのほかに、子 process を撃つ共通の部品（capture・stop・stop_with・KILL・WAIT_STEP）と時刻の読み（epoch_secs と暦の 3 つの関数）を持ち、src の 7 つの module が capture を ledger から呼ぶ。台帳の読みを直す行と子 process の撃ち方を直す行が同じ file を書かないように割る。
      在りか（着地済み・HEAD b02c2ae で確かめた）。crates/tsuzuri-boundary/src/server/ledger.rs の pub fn capture（型引数 I と S・引数は program の &OsStr・args の I・cwd の &Path・timeout の Duration・返りは Option の Vec の u8・I は IntoIterator で Item が S・S は AsRef の OsStr）・非公開の fn stop（Child を受ける）・pub fn stop_with（Child と kill の &OsStr を受けて bool を返す）・pub const KILL（&str の字 kill）・非公開の const WAIT_STEP（5 ミリ秒）・pub fn epoch_secs（&str を受けて Option の EpochSecs を返す・EpochSecs は契約の型の crate の根の型）・非公開の fn is_leap・days_in_month・days_from_civil。どれも wasm の target に限らない（境界の crate は host だけ）。
      呼び手（確かめた・この行の write-set の外で直さない）。capture を ledger から use する src は accthb.rs・acct.rs・server の batch.rs・policy.rs・seat.rs・ruling.rs・design.rs。歯は tests/server_reap.rs（capture・stop_with・KILL を ledger の path で use）と tests/server_batch.rs と tests/server_ask.rs（epoch_secs を ledger の path で use）。ledger.rs の中の歯 server_min_epoch_secs_reads_rfc3339 は ledger の tests の module から super の epoch_secs を呼ぶ。中核の crate の ledger の module にも同じ名の epoch_secs が在るが別物で、この行は触らない。
      形。server の proc.rs へ capture・stop・stop_with・KILL・WAIT_STEP を字を変えずに移し、clock.rs へ epoch_secs・is_leap・days_in_month・days_from_civil を字を変えずに移す。server の mod.rs の pub mod の並びに pub mod clock と pub mod proc を足す。ledger.rs は pub use で super の proc の capture・stop_with・KILL と super の clock の epoch_secs を同じ名で再公開し、自分の items の中の epoch_secs の呼びはその名のまま使う。ledger.rs で使わなくなった use（Read・CommandExt・Child・Command・Stdio・mpsc・thread・Instant・EpochSecs など）は外す（clippy の警告で落ちるため）。ledger.rs の #[cfg(test)] の歯は動かさず、字も変えない。ledger.rs は縮むだけ（write-set の印 -）。
      測り方。新しい歯は tests/hbproc.rs に置き、名を hbproc_ で始める（着地済みの行の filter の語 server_・server_reap_・server_min_ ほかを名に含めない）。歯は tsuzuri_boundary::server::proc と clock と ledger の 3 つの path で呼ぶ。capture の歯は program に sh を、args に -c と printf の字の 2 つを渡し（rc 0 は出した byte・exit 1 は無し）、cwd は一時の dir、timeout は 5 秒。epoch_secs の歯の値は done (3) のとおりで、壊れた字の 9 つは空の字・2026-09-27T07:39:00（時差の無い字）・2026-02-29T00:00:00Z・2026-13-01T00:00:00Z・2026-09-27T24:00:00Z・2026-09-27T07:39:00.Z・2026-09-27T07:39:00+0900・1969-12-31T23:59:59Z・年を全角の数字で書いた字（着地済みの ledger.rs の歯と同じ字）。src の字の歯は CARGO_MANIFEST_DIR から src/server/ledger.rs・proc.rs・clock.rs を読み、done (1) の定義の字（fn の名の後の開き括弧か型引数の開き）が ledger.rs に無く、proc.rs と clock.rs に在ることを見る。着地済みの歯は xtask の check（nextest の workspace の全部）で通ることを見る。
      依存は足さない。Cargo.toml は触らない。
  - n: 4
    type: prose
    title: 行 hb-config — 起動の引数を config.rs に割り Config::new を置く
    body: |
      なぜ。起動の引数の struct Config（server の mod.rs の 81 行目から）に欄を足すと、Config を struct の字で組む 9 つの歯の file と main.rs が全部組めなくなる（着地の前の行 h-wire は、これを避けるために欄を足さず bind_with を足した）。既定の値を持つ Config::new を置き、歯の file はそれと残りの欄の埋め（struct の更新の形）で組むようにする。後で欄を足す行は config.rs と main.rs だけを書く。
      在りか（着地済み・確かめた）。Config は pub な欄 repo（PathBuf）・bind（SocketAddr）・files（PathBuf）・bd（OsString）・state_dir（Option の PathBuf）・folio（OsString）・bdw（OsString）・seat（Option の String）・scribe2（OsString）の 9 つを持ち、derive は Debug・Clone・PartialEq・Eq。既定の値の在りかは server の ledger の BD（字 bd）・server の design の FOLIO（字 folio）・契約の型の crate の ledger の BDW（字 bdw）・server の ruling の SCRIBE2（字 scribe2）で、main.rs の parse が省いた引数にこれらを入れる（state_dir と seat は無し）。
      形。server の config.rs に Config を移し（欄と derive と doc は同じ）、impl に pub fn new を置く。new は repo の PathBuf・bind の SocketAddr・files の PathBuf を受け、ほかの 6 つの欄を上の既定の値で埋めた Config を返す。server の mod.rs は mod config と pub use で Config を再公開し、tsuzuri_boundary::server::Config の path を変えない。Server の bind と bind_with は変えない。main.rs の parse は Config::new に 3 つの引数を渡し、省ける引数が在る欄だけを上書きする（読みの決まりと断りの字は変えない）。
      歯の file の直し（確かめた・この 9 つだけ）。crates/tsuzuri-boundary/tests の server_src.rs（107 行目）・server_seat.rs（164 行目）・server_coalesce.rs（102 行目）・server_read.rs（147 行目）・server_ask.rs（139 行目）・server_min.rs（92 行目）・server_batch.rs（166 行目）・server_view.rs（107 行目）・server_acctwire.rs（167 行目）の fn config は、今は Config を 9 つの欄の struct の字で組む。直した後は、既定と違う欄だけを書き、残りを Config::new（repo・bind・files の 3 つを渡す）で埋める。各 file の欄の値（例 server_read の folio は folio_program・server_coalesce の state_dir は Some）は変えない。#[test] の fn は 1 つも触らない。main.rs を除く src の file（config.rs と mod.rs のほか）と、Config を組まないほかの歯の file は触らない。
      測り方。新しい歯は tests/hbconf.rs に置き、名を hbconf_ で始める。欄の歯は Config::new の値の欄を 1 つずつ比べ（歯の中で Config を struct の字で組まない＝後で欄が増えても歯を直さずに済む）、src の字の歯は CARGO_MANIFEST_DIR から server/mod.rs と config.rs と main.rs を読み（main.rs は done (4) の 2 つの字の数を比べる）、9 つの歯の file の fn config の本文（fn config の開き括弧から次の 4 つの空白と閉じ括弧だけの行まで）を読んで done (3) を見る。tz の引数の読みの振る舞いは着地済みの歯 server_src_tz_takes_bd_flag と server_read_tz_takes_state_dir_and_folio（tz の binary を撃つ）が見る。
      依存は足さない。Cargo.toml は触らない。
  - n: 5
    type: prose
    title: 行 hb-route — 境界の crate の組み立ての script と GET の口の列
    body: |
      なぜ。server の mod.rs の fn route は GET の口を path の字の match で振り分け、口ごとの本文も同じ file に在る。口を足す行は必ず mod.rs を書く。口を 1 口 1 file に割り、口の列は組み立ての script が dir から生成する（判断の記録 ADR-13・案 M2）。
      口の型（server の route.rs・新しい file・pub mod route）。pub enum Match は Exact（&'static str）と Prefix（&'static str）の 2 つ。pub struct Key は pub な欄 method（&'static str・字 GET か POST）と path（Match）を持ち、pub fn matches（method の &str と path の &str を受けて bool）は method が等しく、Exact なら path が等しく、Prefix なら path がその字で始まるときに真。口の本体は server の module の中だけ（可視性 pub(in crate::server)）の struct Entry（欄 key の Key と handle の関数の pointer・handle は Request の参照と Shared の参照を受けて Response を返す）。振り分けは同じく server の中だけの fn dispatch（Request の参照と Shared の参照を受けて Option の Response を返す）の 1 つで、生成した列挙 Route の ALL を宣言の順に見て、key が要求の method と path に当たる最初の口の handle を呼ぶ（条 P-21）。Request は server の pub mod http の pub struct、Shared は server の mod.rs の非公開の struct（確かめた）で、どちらも server の中からは見えるので、Entry・dispatch・各口の file の ROUTE・生成の entry を server の中だけの可視性にすれば Shared の可視性は変えずに済む（crate 全体へ出すと、Shared より広い面に Shared が出て private_interfaces の警告になり、host の clippy の -D warnings で落ちる）。
      口の file（src/server/routes の下・12 の新しい file）。各 file は server の中だけの const ROUTE（Entry）と、口の本文の関数を持つ。本文は今の route の腕の字を変えずに移す。account.rs は GET の account の PATH（契約の型の crate の account の PATH・字 /api/account）で fn account と fn watch_acct_marks を移し、around.rs は /api/around で fn around を移し、item.rs は Prefix の /api/ledger/（BeadId の読みと 400 の id-shape・404 の no-item・503 の ledger-unknown）、ledger.rs は /api/ledger、graph.rs は /api/graph、graphview.rs は /api/graph/view、metrics.rs は /api/metrics、next.rs は /api/next（席の card と台帳の字を thread の scope で並べて集める形のまま）、pipeline.rs は /api/pipeline、questions.rs は /api/questions、seat.rs は server の seat の PATH（字 /api/seat）、unreflected.rs は /api/unreflected。file の名と path の対はこのとおりにする（Route の変種の名になる）。json と lock と ACCT_MARKS_EVERY と GIT は server の mod.rs に残し、口の file は crate::server の path で使う（非公開の関数も子の module から呼べる）。
      server の mod.rs の残り。Server・Config の再公開・bind と bind_with・guarded・refusal・post の 4 つの関数・handle・json・lock・SSE の口（/api/surface/events）・面の file の配布（files の serve の 3 つの応答）。handle の形は、読めない要求が 400 の bad-request、POST の 4 つの腕はそのまま、GET でない要求は 405、/api/surface/events は SSE、ほかの GET は dispatch が Some ならその応答、None なら面の file の配布。mod.rs の module の doc から口の path の一覧を外す（各口の file の doc が自分の path を書く）。mod.rs は縮む（write-set の印 -）。
      組み立ての script（crates/tsuzuri-boundary/build.rs・新しい file・標準 library だけ）。main は Result を返し、unwrap と expect と panic を使わない。src/server/routes の下の拡張子 rs の file を読み、名（拡張子を除く字）を byte の順に並べる。名が英小文字で始まり英小文字と数字と下線だけでなければ、その file の名を書いた Err で組み立てを止める。生成する字は、名ごとに、path の属性（値は CARGO_MANIFEST_DIR の絶対の path に src/server/routes と名と拡張子をつないだ字を Rust の字の literal にしたもの・Debug の書式で引用符と逆斜線を escape する）と mod の宣言、次に列挙 Route（derive は Debug・Clone・Copy・PartialEq・Eq・変種の名は名の先頭と下線の後の字を大文字にして下線を外したもの・宣言の順は名の順）と、impl の pub const ALL（全部の変種の配列）・pub fn name（名の字）・pub fn key（その file の ROUTE の key）・server の中だけの fn entry（その file の ROUTE）。字は組み立ての出力の dir（環境の OUT_DIR）の routes.rs に書き、今の file の字と同じなら書き直さない。生成する字に内側の doc（//! の行）と内側の属性を置かない（include の macro の中で使えないため）。標準出力に rerun-if-changed の src/server/routes（dir は中の file の足し引きと書き換えで再び走る）と rerun-if-changed の build.rs の 2 行を書く（println か stdout への writeln）。
      取り込み。server の mod.rs に、中身が include の macro 1 つの inline の module routes を置き、include の macro には concat の macro で env の macro の OUT_DIR と字 /routes.rs をつないだ path を渡す。mod.rs は pub use で routes の Route を server の Route として再公開する（歯が tsuzuri_boundary::server::Route で使う）。
      着地済みの歯（全部、直さずに通る・write-set の外）。口の振る舞いは tests の server_min（server_min_ledger_list_returns_five・server_min_ledger_item_by_id・server_min_ledger_unreadable_is_unknown・server_min_files_refuse_outside・server_min_non_get_405_writes_nothing ほか）・server_read（server_read_four_routes_match_core ほか）・server_view（server_view_graph_view_matches_core・server_view_around_matches_core・server_view_around_refusals・server_view_unreflected_matches_core ほか）・server_seat（server_seat_card_matches_core・server_seat_next_uses_card ほか）・server_ask（server_ask_questions_route_matches_core ほか）・server_acctwire（acctwire_get_matches_acct・acctwire_get_without_state_dir・acctwire_marks_send_board_changed ほか）・server_coalesce（server_coalesce_seven_routes_share_one_bd・server_coalesce_graph_routes_share_one_folio ほか）が見る。子 process の撃つ数と引数は変えない。
      server の mod.rs の今の字（HEAD 87949da・確かめた）と done (4) の両立。引用符で囲んだ /api/ の字は 11 で、handle の腕の /api/surface/events の 1 つ、fn route の match の腕の 9 つ（/api/ledger・/api/pipeline・/api/metrics・/api/next・/api/graph・/api/graph/view・/api/around・/api/unreflected・/api/questions）、fn route の中の strip_prefix に渡す /api/ledger/ の 1 つ。/api/seat と /api/account の腕は定数（server の seat の PATH と、契約の型の crate の account の PATH を ACCOUNT_PATH の名で use したもの）で書かれ、引用符の字を持たない。handle の POST の 4 つの腕は、method の字 POST と、ruling の PATH・batch の PATH・policy の PATH・HEARTBEAT_PATH の 4 つの定数を比べるだけで、引用符の /api/ の字を持たない。よって GET の腕と strip_prefix を routes の下の file へ移した後に mod.rs に残る引用符の /api/ の字は /api/surface/events の 1 つだけで、POST の 4 つの腕をこの行でそのまま残すことと done (4) は両立する。module の doc（//! の行）に書かれた /api/ の path は引用符で囲まれていないので done (4) は数えない（この行で doc から口の一覧の行を外すのは別の理由・上の段）。面の file の配布（files の serve と 3 つの応答）は今 fn route の最後に在り、移した後は handle の、dispatch が None のときの枝に置く。
      server の mod.rs と src の字を読む着地済みの歯（workspace の全部の crate と xtask を grep で確かめた）。mod.rs を読むのは境界の crate の tests/hbconf.rs の hbconf_config_moves_to_config_rs だけで、見る字は pub struct Config が無いこと・mod config; の行・pub use self::config::Config; の行の 3 つ。この行はこの 3 つを残す（Config の再公開の行を消さない・書き換えない）。tests/hbproc.rs の hbproc_definitions_move_out_of_ledger が読むのは server の ledger.rs・proc.rs・clock.rs の 3 つで、この行はどれも触らない（routes の下に置く ledger.rs は src/server/routes/ledger.rs という別の file で、歯が読む src/server/ledger.rs ではない）。tests/hbconf.rs のほかの歯が読む main.rs と 9 つの歯の file も、この行は触らない。面の crate・契約の型の crate・中核の crate・xtask の歯に、境界の crate の src の字を読むものは無い（xtask が読むのは Cargo.toml と .vessel.toml だけ）。面の crate の歯のうち ledgerblock.rs・frame.rs・board_min.rs は dev-dependencies の境界の crate の server の ledger の module（parse など）を呼ぶが、この行は server の ledger の module を触らない。
      節の 12 の GET の口の鍵（done (2)）。Exact の /api/ledger・/api/pipeline・/api/metrics・/api/next・/api/seat・/api/account・/api/graph・/api/graph/view・/api/around・/api/unreflected・/api/questions と、Prefix の /api/ledger/ で、method はどれも GET。
      規則の行 R-2 の測り（この crate の最初の生成の行）。増分 check の秒は、口の file を 1 つ書き換えた後（着地の前は server の mod.rs を書き換えた後）の cargo check -p tsuzuri-boundary --all-targets の Finished の行の秒で、3 回の中央値。組み立ての script を足す前の木で before を、足した後の木で after を測り、docs/measure/r2-boundary-build.txt に before_s = 秒・after_s = 秒・差が 0.3 秒を越えるときは reason = 理由 の行で書く。記録は commit の message でなくこの file に置く（歯が読めるため）。
      測り方。新しい歯は tests/hbroute.rs に置き、名を hbroute_ で始める。着地済みの行と、この文書の行の verify の filter の語（contracts の 3 つの契約の file の verify の行から数えた・確かめた）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hook_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_ と、この文書の hbproc_・hbconf_・hbroute_・hbpost_・hsblock_・hspage_・hsderive_ で、新しい歯の名から先頭の hbroute_ を除いた字は、このどれも部分の字として含まない（例 hbroute_project_x・hbroute_graph_x・hbroute_server_x は不可・着地済みの行の filter に当たると、その行の歯の置き場が write-set の外に増える）。dir の歯は CARGO_MANIFEST_DIR の src/server/routes を読み、生成の字の歯は env の OUT_DIR の routes.rs を読む（組み立ての script を持つ package の歯には OUT_DIR が渡る）。重なりの歯は Route の ALL の全部の対で、同じ method の 2 つの Exact は字が違い、Exact と Prefix は Exact の字が Prefix の字で始まらず、2 つの Prefix はどちらの字も他方で始まらないことを見る（この決まりで重ならなければ順は結果を変えない）。
      依存は足さない。Cargo.toml は触らない（組み立ての script は package の根の build.rs として Cargo が見つける・build-dependencies を足さない・xtask の歯 skeleton_boundary_std_only_and_bin_tz が見る）。
  - n: 6
    type: prose
    title: 行 hb-post — POST の口を routes の下へ移す
    body: |
      なぜ。行 hb-route の後も、POST の 4 つの口（裁定・束・方針・停止の切り替え）は server の mod.rs の handle の腕と post の関数に残る。これを routes の下の file に移し、POST の口を足す行も mod.rs を書かないようにする。
      在りか（着地済み・確かめた）。server の mod.rs の fn post_ruling（ruling の PATH・字 /api/ruling）・post_batch（batch の PATH・字 /api/batch）・post_policy（policy の PATH・字 /api/policy）・post_heartbeat（契約の型の crate の account の HEARTBEAT_PATH・字 /api/account/heartbeat）と、handle の 4 つの腕（method が POST で path が等しい）。守りの guarded と refusal は mod.rs の非公開の関数。
      形。routes の下に ruling.rs・batch.rs・policy.rs・heartbeat.rs を足し、各 file の ROUTE の key は method POST と Exact の上の path で、handle は今の post の関数の本文を字を変えずに移したもの（guarded と refusal と json は crate::server の path で呼ぶ）。mod.rs からは 4 つの post の関数と 4 つの腕と HEARTBEAT_PATH の use を外す。handle の形は、読めない要求が 400 の bad-request、/api/surface/events の GET は SSE、ほかは dispatch が Some ならその応答、None で method が GET でなければ 405 と字 method と Allow の頭 GET、None で GET なら面の file の配布。組み立ての script（build.rs）と route.rs は触らない（dir に file を足すだけで Route の列に載ることがこの行の確かめ）。routes の下の file の名 ruling・batch・policy は server の同じ名の論理の module とは別の module（server の routes の下）になる。
      着地済みの歯（全部、直さずに通る・write-set の外）。受付の振る舞いは tests の server_ask（server_ask_ruling_writes_twice・server_ask_refusals_write_nothing・server_ask_guards_write_nothing ほか）・server_batch（server_batch_writes_rows_in_order・server_batch_guards_write_nothing・server_batch_policy_all_appends_to_memo ほか）・server_acctwire（acctwire_post_heartbeat・acctwire_post_without_state_dir）と、405 の歯 server_min_non_get_405_writes_nothing・server_read_non_get_405_writes_nothing・server_view_non_get_405_writes_nothing が見る。
      server の mod.rs の字を読む着地済みの歯（行 hb-route の着地の後・確かめる先は workspace の grep）。境界の crate の tests/hbconf.rs の hbconf_config_moves_to_config_rs（pub struct Config が無い・mod config; の行・pub use self::config::Config; の行）と、行 hb-route の tests/hbroute.rs の mod.rs の字の歯（fn route・fn around・fn account の定義が無い・引用符で囲んだ /api/ の字は /api/surface/events だけ）。この行は mod.rs から post の 4 つの関数と 4 つの腕と HEARTBEAT_PATH の use を外すだけで、Config の 2 行を残し、引用符の /api/ の字を足さないので、どちらの歯の字も崩さない。POST の 4 つの口の path は今も定数（ruling の PATH・batch の PATH・policy の PATH・HEARTBEAT_PATH）で書かれ、routes の下の file でも定数で書く（引用符の /api/ の字を新しく書かない）。
      行 hb-route の着地した物（HEAD 3b04a7e の後の main・確かめた）。src/server/route.rs の Entry は server の中だけの可視性の struct で、欄 key（Key）と handle（Request の参照と Shared の参照を受けて Response を返す関数の pointer）を持ち、dispatch は Route の ALL を宣言の順に見て、key の matches が要求の method と path に真の最初の口の handle を呼ぶ（method は GET に限らない）。mod.rs の post の 4 つの関数は今どれも Request の参照と Shared の参照を受けて Response を返す形なので、Entry の handle にそのまま入り、route.rs を変えずに済む。build.rs は src/server/routes の下の拡張子 rs の file の名（英小文字で始まり英小文字と数字と下線だけ）を byte の順に並べ、名ごとに path の属性つきの mod の宣言と、列挙 Route の変種と、name（名の字）・key（その file の ROUTE の key）・entry（その file の ROUTE）の腕を生成するので、ruling・batch・policy・heartbeat の 4 つの file が server の中だけの const ROUTE（Entry）を持てば build.rs を変えずに列に載る。口の file の形の見本は着地した routes の seat.rs（ROUTE の key が method GET と Exact の seat の PATH・handle が本文の関数）。mod.rs の handle は今、POST の 4 つの腕・GET でない要求の 405・/api/surface/events の SSE・dispatch の順で、dispatch は GET の要求にだけ撃たれる。この行は handle を、400・SSE・dispatch（method を問わない）・dispatch が None で GET でなければ 405・None で GET なら面の file の配布、の順に替える。
      行 hb-route の着地した歯（tests/hbroute.rs・直さずに通る・確かめた）。hbroute_all_names_follow_dir は Route の ALL の名の列が dir の file の名の列（名の順）と同じで重なりが無いことを見る（file を 4 つ足せば列も 4 つ増えて同じ）。hbroute_keys_cover_twelve_gets は 12 の GET の鍵が Route の ALL の鍵の中に在ることだけを見る（多い分を許す・POST の 4 つは妨げない）。hbroute_keys_never_overlap は同じ method の鍵の対が重ならないことを見る（POST の 4 つの Exact の path は互いに違い、GET の鍵とは method が違う）。hbroute_key_matches_rule は Key の matches の決まりを見る（変えない）。hbroute_mod_rs_keeps_only_events は mod.rs に fn route・fn around・fn account の定義が無く、引用符の /api/ の字が /api/surface/events だけであることを見る（この行は post の関数を外すだけで引用符の字を足さない）。hbroute_build_script_writes_paths は build.rs の 2 つの rerun-if-changed の行と、生成の字に dir の全部の file の path の属性つきの mod の宣言が名の順に在ることを見る（build.rs は変えず、足した 4 つの file も同じ形で生成される）。hbroute_measure_r2_recorded は docs/measure/r2-boundary-build.txt の before_s と after_s（0.17 と 0.26）を読むだけ（この行は触らない）。hbroute_teeth_names_stay_apart は自分の file の歯の名だけを見る。
      測り方。新しい歯は tests/hbpost.rs に置き、名を hbpost_ で始める。着地済みの行と、この文書の行の verify の filter の語（contracts の 3 つの契約の file の verify の行から数えた・確かめた）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hook_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_ と、この文書の hbproc_・hbconf_・hbroute_・hbpost_・hsblock_・hspage_・hsderive_ で、新しい歯の名から先頭の hbpost_ を除いた字は、このどれも部分の字として含まない（例 hbpost_project_x・hbpost_graph_x・hbpost_server_x は不可・着地済みの行の filter に当たると、その行の歯の置き場が write-set の外に増える）。Route の ALL の key と name を見る歯と、CARGO_MANIFEST_DIR から server/mod.rs の字を読む歯を置く。重なりは行 hb-route の歯（tests/hbroute.rs の重なりの歯・Route の ALL の全部を見る）が POST の 4 つを含めて見る。
      依存は足さない。
  - n: 7
    type: prose
    title: 行 hs-blocks — 面の crate の組み立ての script と block の列
    body: |
      なぜ。project board の block を足す行は、src/project/mod.rs の pub mod の列と、board.rs の block_view の腕と、tests/frame.rs の frame_one_module_per_block の 13 の名の列を必ず書く（着地済みの g-ask・g-gaps・g-node・g-batch がそうした）。block の列を組み立ての script が dir から生成し、描き分けは生成した列挙の 1 つの関数にし、枠の歯は列から導く（判断の記録 ADR-13）。
      在りか（着地済み・確かめた）。src/project/mod.rs（279 行）は 13 の pub mod の行と、block に共通の部品を持つ。host でも組むのは Body（3 つの変種 Unmeasured・Empty・Filled）・STATES・UNKNOWN・state_key・state_class・Item・ALERT_STYLE・item・LEDGER_UNREAD・NOT_READ・NO_CONTENT・pending・FOLD_KEYS・fold_key_ok・Folds で、wasm の target のときだけの非公開の mod dom が section・state_icon・unmeasured・body_view・item_view・fold を持ち、pub use で出す。これを使うのは block の file（super の path）・account の module・mapview の compact.rs と list.rs と table.rs と graph.rs・board.rs で、どれも crate::project の path で呼ぶ。block の module は 13 で、どれも pub const BLOCK（frame の Block）と wasm の target のときだけの pub fn view を持つ。view は ledger だけが画面の状態の signal（RwSignal の Screen）を引数に取り、ほかの 12 は引数を持たない。board.rs（wasm の target のときだけ）の fn block_view は block の id を 13 の腕で比べて view を呼び、App が画面の状態の signal を作って page_view に渡す。
      形。src/kit.rs（新しい file・lib.rs に pub mod kit を足す）へ project の mod.rs の共通の部品を字を変えずに移し、project の mod.rs は module の doc と、pub use の crate::kit の全部（glob）と、生成した file の include だけにする（縮むだけ・write-set の印 -）。今までの crate::project の path は再公開で全部そのまま使える。ledger の module の pub fn view は引数を持たない形にし、画面の状態の signal を leptos の use_context で受ける（無いときは Screen の initial で作った signal を使う）。board.rs の App は画面の状態の signal を provide_context に渡し、page_view は画面の状態を受けず、block_view は Module の ALL から block の id が枠の id と同じ module を選んで view を呼び（無ければ空）、13 の module の名を持たない。lib.rs の wasm の target のときだけの pub mod board の 2 行の並び（着地済みの歯 acctwire_back_steps が lib.rs の字で見る）は崩さない。
      組み立ての script（crates/tsuzuri-surface/build.rs・新しい file・標準 library だけ）。main は Result を返し、unwrap と expect と panic を使わない。src/project の下の拡張子 rs の file のうち mod.rs でないものの名を byte の順に並べ、名が英小文字で始まり英小文字と数字と下線だけでなければ file の名を書いた Err で止める。生成する字は、名ごとに path の属性（CARGO_MANIFEST_DIR の絶対の path に src/project と名と拡張子をつないだ字を Debug の書式で Rust の字の literal にしたもの）と pub mod の宣言、次に列挙 Module（derive は Debug・Clone・Copy・PartialEq・Eq・変種の名は名の先頭と下線の後の字を大文字にして下線を外したもの・例 askpage は Askpage・宣言の順は名の順）と impl の pub const ALL・pub fn name（名の字）・pub fn block（その module の BLOCK）・wasm の target のときだけの pub fn view（その module の view を呼んで leptos の AnyView を返す）。字は組み立ての出力の dir の project_blocks.rs に書き、今の字と同じなら書き直さない。生成する字に内側の doc と内側の属性を置かない。標準出力に rerun-if-changed の src/project と rerun-if-changed の build.rs の 2 行を書く。trunk の wasm の組み立ても同じ script を host で走らせて同じ字を得る。project の mod.rs の include の macro には concat の macro で env の macro の OUT_DIR と字 /project_blocks.rs をつないだ path を渡す。
      着地済みの歯の直し（この行の write-set の中）。tests/frame.rs の frame_one_module_per_block は、今は 13 の (名, BLOCK の id) の字の列と数 13 を持つ。直した後は、src/project の mod.rs でない file の名の列が Module の ALL の name の列（拡張子 rs を付けたもの）と同じ、各 module の file の字が id の字（id と引用符で囲んだ block の id）を持つ、全部の頁の block の id の集合が Module の ALL の block の id の集合と同じ、frame.rs の字に view!・Screen・Reading・Body・leptos が無い、を見る（名の列と数を持たない）。frame.rs のほかの歯は直さない。
      src の字を読む着地済みの歯の全部（tests の下を grep で確かめた・HEAD bca5627）。src/board.rs を読む歯は acctwire_back_steps だけで、見る字は 戻るの部品の描きの 6 つ（frame::back_steps の呼び・window を開く呼び open_with_url_and_target に空の URL と ACCOUNT_WIN を渡す字・BackStep::CloseSelf・me.close()・class=BACK_WRAP・class=BACK.class）と、lib.rs の wasm の target のときだけの pub mod board の 2 行の並び。この行は board.rs の top と戻るの部品と lib.rs のその 2 行を触らないので、字は残る。src/project/ledger.rs と src/project/mod.rs を名指しで読む歯は無い。ledgerblock_ の歯（tests/ledgerblock.rs）が読むのは fixture と style.css と Cargo.toml だけで、ledger の module の host の関数（content・metrics など）を呼び、wasm の target のときだけの view は呼ばない。block の file を名指しで読む歯は、askcard_（src/project/ask.rs と askpage.rs）・gapspage_（gaps.rs）・batchpanel_（batch.rs と policy.rs）・next の歯（next.rs）・pipe の歯（pipeline.rs）・mapview の歯（map.rs）で、nodepage_ は src を読まない。この行はこれらの block の file を 1 字も変えない（block の file の super の path の呼びは、project の mod.rs の crate::kit の glob の再公開でそのまま解ける）。ledger.rs で変えるのは wasm の target のときだけの pub fn view の 1 つ（引数を外し、use_context で受けた signal を mod dom の中の view に渡す）で、mod dom の中の view は引数を持つまま。src/project の dir を歩く歯は frame_one_module_per_block（この行で直す）と steady_details_use_fold_record と parts の path の歯で、下の段に書いた。src の全体を歩く frame_no_heading_words_in_code と frame_classes_are_in_stylesheet は、kit.rs の字が今の mod.rs の共通の部品の字と同じなので数が変わらない（生成の file は OUT_DIR に在り src の外）。
      Screen の initial（確かめた）。src/view.rs の pub fn initial（wasm の target に限らない・引数なし）で、台帳が Reading の Unknown・最終更新が None の Screen を返す。Screen は pub struct（欄 board と updated_at・derive は Debug・Clone・PartialEq）。board.rs の App は今この値を RwSignal の new に渡して画面の状態の signal を作っているので、use_context が無いときの代わりの値は App の最初の値と同じになる。
      直さずに通る着地済みの歯（write-set の外）。steady_details_use_fold_record（src/project の下の file を読む・mod.rs は details も記録の呼びも持たなくなるので数は同じ 6）・parts の歯（src の /api/ の字を数える・kit.rs は持たない）・acctwire_back_steps（board.rs と lib.rs の字を見る）と acctwire_back_part_before_header・frame_no_heading_words_in_code と frame_classes_are_in_stylesheet（kit.rs の字は今の mod.rs の字と同じ）・accthome と acctled の account の file の字の歯。
      規則の行 R-2 の測り（この crate の最初の生成の行）。増分 check の秒は、src/project の下の block の file を 1 つ書き換えた後の cargo check -p tsuzuri-surface --all-targets の Finished の行の秒で 3 回の中央値。足す前の木で before を、足した後の木で after を測り、docs/measure/r2-surface-build.txt に before_s = 秒・after_s = 秒・差が 0.3 秒を越えるときは reason = 理由 の行で書く（commit の message でなくこの file）。trunk が生成した module を解けなければ（surface-build が落ちれば）、判断の記録 ADR-13 の撤退の条件に当たる。
      測り方。新しい歯は tests/hsblock.rs に置き、名を hsblock_ で始める。着地済みの行と、この文書の行の verify の filter の語（contracts の 3 つの契約の file の verify の行から数えた・確かめた）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hook_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_ と、この文書の hbproc_・hbconf_・hbroute_・hbpost_・hsblock_・hspage_・hsderive_ で、新しい歯の名から先頭の hsblock_ を除いた字は、このどれも部分の字として含まない（例 hsblock_project_x・hsblock_graph_x・hsblock_server_x は不可・着地済みの行の filter に当たると、その行の歯の置き場が write-set の外に増える）。着地の前の周で hsblock_parts_live_in_kit の名が parts_ を含み、門で落ちた。dir の歯は CARGO_MANIFEST_DIR の src/project を読み、生成の字の歯は env の OUT_DIR の project_blocks.rs を読み、src の字の歯は src/project/mod.rs・kit.rs・board.rs・ledger.rs を読む（block_view と ledger の view の本文は wasm の target のときだけなので host では撃てない・DOM は surface-build で組めることで見る）。
      依存は足さない。Cargo.toml と vocab.json と style.css は触らない。
  - n: 8
    type: prose
    title: 行 hs-pages — 頁を 1 頁 1 file にし頁の列挙を生成する
    body: |
      なぜ。頁を足す行は、frame.rs の PageId の変種と ALL と id と from_query と頁の関数と page の腕と href の腕と HEADER の nav の items と snapshot、board.rs の nav_icon の腕、tests/snapshots/frame.json の全体、頁の列を字で持つ 6 つの歯の file を書く（着地済みの g-ask・g-gaps・g-node）。頁を src/pages の下の 1 頁 1 file にし、列挙 PageId を組み立ての script が生成し、snapshot を頁ごとの file に割る（判断の記録 ADR-13）。
      在りか（着地済み・確かめた）。src/frame.rs（446 行・wasm の target に限らない）の PageId は Home・Ask・Map・Gaps・Node の 5 変種で、ALL は nav の 4 つ（Home・Ask・Map・Gaps の順）、頁の関数 home・ask・map・gaps・node が Page（欄 id の PageId・heading・class・columns）を返し、pages は nav の 4 つ、nav_links は PageId が Ask の link にだけ BADGE を付け、href は Home が mode だけの字でほかは page と mode の字、HEADER の nav の部品の items は home・questions・map・gaps の字の列、snapshot は BACK と HEADER の 5 行と nav の 4 頁と node の頁を 1 つの JSON の字にする。board.rs の nav_icon は PageId の腕で SVG の字を返す（Node は空）。
      形。src/pages の下に home.rs・ask.rs・map.rs・gaps.rs・node.rs と、module の doc と生成した file の include だけの mod.rs を置き、lib.rs に pub mod pages を足す。各頁の file は pub const PAGE（frame の新しい pub struct PageDef・pub な欄 heading・class・nav（Option の u8）・badge（bool）・icon（&'static str）・columns（Vec の Column を返す関数の pointer））を持つ。PageDef に PartialEq を derive しない（関数の pointer の比べは警告になり、clippy の -D warnings で落ちる）。値は今の frame.rs と board.rs の値のとおりで、nav は home 1・ask 2・map 3・gaps 4・node 無し、badge は ask だけ真、icon は今の nav_icon の字（node は空）、columns は今の頁の関数の列。組み立ての script は src/pages の下の mod.rs でない rs の file の名から、path の属性と pub mod の宣言と列挙 PageId（変種の名は名の先頭を大文字にしたもの・derive は Debug・Clone・Copy・PartialEq・Eq）と impl の pub const ALL（名の順の全部）・pub fn id（名の字）・pub fn def（その頁の PAGE）を組み立ての出力の dir の pages.rs に生成する（行 hs-blocks と同じ書き方・今の字と同じなら書き直さない・rerun-if-changed の src/pages を足す）。frame.rs は pub use で crate::pages の PageId を再公開し（tsuzuri_surface::frame::PageId の path と変種の名は変わらない）、PageId の手書きの列挙と頁の関数 5 つを外し、page（PageId から def の値で Page を組む）・pages（nav の頁を Page の Vec で nav の順）・nav（nav の在る PageId を数の順に並べた Vec）・nav_keys（nav の頁の heading の列）・from_query（page の字と id の同じ頁・無い字と知らない字は Home）・href（Home は mode だけ・ほかは page と id と mode・今の字と同じ）・nav_links（nav の頁の link を nav の順に並べ、badge は def の badge が真の頁だけ BADGE）を頁の変種の名を持たない形で置く。HEADER の nav の部品の items は空の列にし、header_snapshot は nav の部品の items に nav_keys を書く。snapshot は外し、page_snapshot（頁 1 つの object の字に改行 1 つ・今の page_json の字と同じ形）と header_snapshot（今の snapshot の先頭の 7 行と、2 つの空白と閉じ角括弧だけの行と、閉じ波括弧だけの行と、末尾の改行）を置く。board.rs は nav_icon を外して def の icon を使う。
      snapshot の file。tests/snapshots/frame.json はこの行では消さず 1 字も書かない（write-set に無い）。着地済みの header と 5 つの頁の字が今と同じであることを、歯 hspage_ がこの file と比べて測るための写しで（done (2) と (3)）、次の行 hs-derived が消す。tests/snapshots/pages の下の 5 つの json は page_snapshot の字で、作るときは frame.json の各頁の object の字（先頭の 4 つの空白を含む・末尾のカンマを除く）に改行 1 つを足した字を写す（frame.json の頁の object は page_json の字をカンマと改行でつないだもので、page_snapshot は page_json の字に改行 1 つ・確かめた）。tests/snapshots/header.json は header_snapshot の字で、先頭の 7 行は frame.json の先頭の 7 行（開き波括弧・header の見出し・BACK と HEADER の 4 つの部品の 5 行）と同じ字になる。
      着地済みの歯の直し（この行の write-set の中・期待を次のように変える）。tests/frame.rs: 助けの関数 all_pages は PageId の ALL を page で写した列にし、frame_snapshot_matches_file は header_snapshot と header.json を比べ、frame_home_blocks_in_order_and_map_page は home・ask・map・gaps・node の頁の列の中身を page の PageId で引いて今と同じ値を見て、頁の列と nav の語の字の列を nav の中の含まれ方と順で見る（frame_mode_lives_in_url と frame_one_module_per_block と ほかは直さずに通る）。tests/askcard.rs の askcard_page_frame_and_nav・tests/gapspage.rs の gapspage_page_frame_and_nav・tests/nodepage.rs の nodepage_frame_and_nav は、pages と PageId の ALL と HEADER の nav の items の字の列の一致を、nav の中の含まれ方と順の検査に替え、frame の ask・gaps・node の関数を page の PageId の Ask・Gaps・Node に替え、frame.json との比べを tests/snapshots/pages の下の同じ頁の file との比べに替える（頁ごとの中身の値の期待は変えない）。tests/batchpanel.rs の batchpanel_page_frame_two_columns は frame の ask を page の PageId の Ask に替え、frame.json との比べを pages の下の ask.json に替える。tests/acctwire.rs の acctwire_back_part_before_header は HEADER の nav の items の字の比べを nav_keys に替え、frame.json と snapshot の比べを header.json と header_snapshot に替える（2 行目と 3 行目の字の期待は変えない）。
      write-set の外の着地済みの歯と src の使い手の全部（workspace を grep で確かめた・HEAD 98d511d = 行 hs-blocks の着地の後）。frame の PageId・HEADER・nav_links・pages・snapshot・頁の関数・nav_icon を名指す歯の file は、この行の write-set の 6 つ（frame.rs・askcard.rs・gapspage.rs・nodepage.rs・batchpanel.rs・acctwire.rs）のほかに 3 つだけ在る。(a) tests/topbar.rs は HEADER を使う歯が topbar_updated_part_is_a_num_chip_keyed_last_record の 1 つで、HEADER の中から part が updated の部品を探し、key が last_record・class が chip num であることだけを見る（ほかの 4 つの topbar_ の歯は時刻の字の組み方を見て frame を使わない）。この行が変える HEADER の欄は nav の部品の items だけなので、この歯は直さずに通る。(b) tests/acctframe.rs が使う HEADER は account の module の HEADER（別の定数）で、frame の PageId は acctframe_entry_selects_board_account_only が 5 つの変種と from_query を使うだけ（変種の名と from_query の読みは変わらない）。(c) tests/hsblock.rs（行 hs-blocks の歯・着地済み）が、この行の書く file について見る字は次のとおりで、この行はどれも崩さない。build.rs は rerun-if-changed の src/project と build.rs の 2 行を持ち、.unwrap() と .expect( と panic! の字を持たず、main が Result を返す（この行は頁の生成と 3 行目の rerun-if-changed の src/pages を同じ決まりで足す）。生成の file project_blocks.rs の字（path の属性と pub mod の宣言が名の順・列挙 Module の derive と wasm の target のときだけの view）は変えない（頁は別の生成の file pages.rs）。board.rs は fn page_view(page: PageId) の形の行・App の本文の画面の状態の signal を作る行と provide_context の行・block_view の本文を持つ（この行は top の nav の icon の取り方だけを変え、この 3 つを触らない）。lib.rs は wasm の target のときだけの pub mod board の 2 行の並びを持つ（この行は pub mod pages の行を足すだけ）。hsblock_own_names_clean は自分の file だけを読む。src の使い手は board.rs（この行の write-set）だけで、src/account の HEADER は account の定数、src/project/nodearound.rs は frame の node_href と Mode だけを使う（どちらも変わらない）。board.rs の top の描きは、HEADER の部品を part の名で描き分け、nav の部品は nav_links の列から link を描き、HEADER の nav の部品の items を読まない（確かめた）ので、items を空にしても画面の nav は変わらない。
      直さずに通る着地済みの歯。tests/acctframe.rs の acctframe_entry_selects_board_account_only（PageId の 5 つの変種と from_query を使う）と、6 つの file のほかの歯の全部。
      測り方。新しい歯は tests/hspage.rs に置き、名を hspage_ で始める。着地済みの行と、この文書の行の verify の filter の語（contracts の 3 つの契約の file の verify の行から数えた・確かめた）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hook_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_ と、この文書の hbproc_・hbconf_・hbroute_・hbpost_・hsblock_・hspage_・hsderive_ で、新しい歯の名から先頭の hspage_ を除いた字は、このどれも部分の字として含まない（例 hspage_project_x・hspage_graph_x・hspage_server_x は不可・着地済みの行の filter に当たると、その行の歯の置き場が write-set の外に増える）。dir の歯は CARGO_MANIFEST_DIR の src/pages と tests/snapshots/pages を読み、src の字の歯は frame.rs と board.rs を読む。頁の中身の描画は wasm の target のときだけなので surface-build で見る。
      依存は足さない。Cargo.toml と vocab.json と style.css は触らない。
  - n: 9
    type: prose
    title: 行 hs-derived — 口の path と畳む段の鍵を block ごとの定数から導く
    body: |
      なぜ。口の path を持つ block を足す行は tests/parts.rs の parts_paths_distinct_in_block_modules（12 の path の字の列と数を持つ）を、畳む段を持つ block を足す行は project の FOLD_KEYS（6 つの鍵の形）と tests/steady.rs の steady_fold_key_forms と steady_details_use_fold_record（6 の数と鍵の字）を書く。block ごとの定数から導く形にし、歯は列を持たない（判断の記録 ADR-13）。
      在りか（着地済み・行 hs-blocks と hs-pages の後）。block の module の口の path の定数（どれも host でも組む pub const）は、ask の PATH（/api/questions）と RULING_PATH（/api/ruling）・batch の PATH（/api/batch）・ledger の PATH（/api/ledger）と METRICS_PATH（/api/metrics）・map の PATH（/api/graph）・next の PATH（/api/next）・nodearound の PATH（/api/around）・pipeline の PATH（/api/pipeline）・policy の PATH（/api/policy）・seat の PATH（/api/seat）で、12 本目は block でない mapview の graph の PATH（/api/graph/view）。畳む段の記録を呼ぶ所（kit の fold の呼び）は ledger（ledger:more）・seat（seat:hist と seat:more）・askpage（ask:hist）・gaps（字 gaps とコロンと中括弧の対をつないだ形）・ask（字 ask:around とコロンと中括弧の対をつないだ形）。FOLD_KEYS と fold_key_ok は kit.rs に在り、src で呼ぶのは fold_key_ok の中の FOLD_KEYS だけ（歯は steady.rs と、行 hs-blocks の tests/hsblock.rs の hsblock_kit_holds_shared が使う・下の段）。13 の module の path の定数はどれも wasm の target に限らない（定数の前に cfg の行が無い・確かめた）。gaps は map の PATH を読み（gaps.rs の 260 行）、askpage は ledger の PATH を読み（askpage.rs の 89 行）、batch と policy は ask の PATH を読み（batch.rs の 243 行・policy.rs の 223 行）、node は nodearound の読みを分けるが、どれも自分の file に引用符の /api/ の字を持たない。
      形。13 の block の module に pub const PATHS（&[&str]）と pub const FOLDS（&[&str]）を足す。値は、PATHS が ask は PATH と RULING_PATH、ledger は PATH と METRICS_PATH、batch・map・next・nodearound・pipeline・policy・seat は PATH の 1 つ、askpage・gaps・legend・node は空（定数の名で書き、/api/ の字を新しく書かない）。PATHS は、その module の file が引用符の字を持つ口の path の定数だけを並べ、ほかの module の定数を読む口は数えない（gaps・askpage・batch・policy・node が読む他の module の path を自分の PATHS に入れると、同じ path が 2 つの module の PATHS に載り、parts の歯の、path の字がそれを PATHS に持つ module の file に在ることの検査が 1 対 1 でなくなる）。FOLDS は ledger が ledger:more、seat が seat:hist と seat:more、askpage が ask:hist、gaps が字 gaps とコロンと中括弧の対をつないだ 1 つ、ask が字 ask:around とコロンと中括弧の対をつないだ 1 つ、ほかの 8 つは空（字は今の FOLD_KEYS の字と同じ）。組み立ての script は Module の impl に pub fn paths と pub fn folds（その module の PATHS と FOLDS を返す・wasm の target に限らない）を足す。このときも、着地済みの hsblock_script_reruns_and_emits が build.rs の字に見る 4 つ（引用符を含めた rerun-if-changed の src/project と build.rs の字・main が Result を返す宣言・unwrap と expect と panic の字が無い）を崩さない。kit.rs の FOLD_KEYS を外し、pub fn fold_keys（Module の ALL の順に各 folds をつないだ Vec）を置き、fold_key_ok は fold_keys の形で判じる（判じ方の決まりは変えない）。kit.rs の fold_keys は crate::project の Module を呼ぶ（project の mod.rs は kit を glob で再公開し、kit は project の生成した列挙を呼ぶ・Rust の module の間の参照は循環してよい）。fold_keys の順は Module の ALL の順（ask・askpage・gaps・ledger・seat の鍵の順）で今の FOLD_KEYS の順と違うが、順を使う所は無い（fold_key_ok はどれかの形に合うかだけを見る）。13 の block の file に足す 2 つの定数とその doc の字には、fold の後に開き丸括弧が続く字を書かない（steady の助けの関数が記録の呼びとして数える）。ledger.rs では、2 つの定数を wasm の target のときだけの属性の行と pub fn view の宣言の間に置かない（hsblock_dispatch_by_list がその 2 行の並びを見る）。
      着地済みの歯の直し（この行の write-set の中）。tests/parts.rs の parts_paths_distinct_in_block_modules は、path の列を Module の ALL の paths と graph の PATH から組み、互いに違うことを見て、各 block の path の字が src に 1 度だけでその path を PATHS に持つ module の file（src/project の下の名の file）に在り、graph の PATH の字は src/mapview/graph.rs に在り、残りの /api/ の字は /api/surface/events だけであることを見る（12 の数と字の列の一致の比べを外す・着地済みの 11 本の値は歯 hsderive_ が、graph の PATH の値は着地済みの mapgraph_path_and_no_new_dependency が見る）。tests/steady.rs は use から FOLD_KEYS を外し（kit の fold_keys は use で名を取り込まず、tsuzuri_surface::project の path を付けて呼ぶ。steady.rs には字を読む助けの関数 fold_keys（字を受けて鍵の字の Vec を返す・185 行）が在り、steady_details_use_fold_record と steady_fold_key_reader が呼ぶので、同じ名を use すると組み立てが落ちる。助けの関数の名と steady_fold_key_reader の本文は変えない）、steady_fold_key_forms は fold_keys に着地済みの 6 つの形が全部在ることと今の通す字と断る字の判定を見て（通す字は ledger:more・seat:hist・seat:more・ask:hist・gaps:g-1・ask:around:t3-hub.4 の 6 つ、断る字は ledger・seat:hist2・字 gaps とコロンだけの字・字 ask:around とコロンだけの字・ask:more・空の字の 6 つ・tests/steady.rs の 142 行から 161 行・この行で変えない）、steady_details_use_fold_record は Module の ALL の module ごとに src/project の下の file の details の数と記録を呼ぶ所の数と folds の数が同じで、鍵の字の集合が folds と同じであることを見る（合計 6 と鍵の列の比べを外す）。直した後は Module の ALL の名の file だけを読むので project の mod.rs は数えないが、mod.rs は doc と再公開と include の 3 つだけで details も記録の呼びも持たない（確かめた）ので、数は変わらない。steady.rs のほかの歯は直さない。
      FOLD_KEYS を名指す着地済みの歯の全部（workspace を grep で確かめた・HEAD e25f1b7）。src で使うのは kit.rs の fold_key_ok の中だけ。歯は tests/steady.rs（use の行・steady_fold_key_forms・steady_details_use_fold_record・上の段で直す）と、行 hs-blocks の tests/hsblock.rs の hsblock_kit_holds_shared の 2 か所（kit.rs の定義の字の列の pub const FOLD_KEYS の項と、project の FOLD_KEYS の数が 6 の比べ）だけ。この行は tests/hsblock.rs を write-set に入れ、hsblock_kit_holds_shared の 2 か所を、pub fn fold_keys の項と、project の fold_keys の数が Module の ALL の各 module の folds の数の和と同じことの比べに替える（数の字 6 を歯に残すと、畳む段を持つ block を後で足す行が write-set の外の hsblock.rs で落ちるので、数を持たない形にする・done (8)）。hsblock.rs のほかの歯（生成の字の歯 hsblock_script_reruns_and_emits は列挙 Module の derive の行と wasm の target のときだけの view の行を見るだけで、この行が impl に足す paths と folds は見ない）は直さずに通る。
      13 の block の file の字を読む着地済みの歯（tests の下を grep で確かめた・HEAD 3b04a7e）。write-set の外は、askcard_no_offscreen_storage_names（ask.rs と askpage.rs に保存の口の名が無い）・gapspage_reads_graph_and_copies_verdicts（gaps.rs が map の PATH の字を持ち、.nodes・.edges・.beads・.runs と引用符で始まる /api/ の字を持たない）・gapspage_classes_and_keys_exist（gaps.rs の class の字）・batchpanel_key_action と batchpanel_paths と batchpanel_unmeasured と batchpanel_no_offscreen_storage_names（batch.rs と policy.rs の鍵の判定の use と呼び・自分の口の引用符の字が 1 度だけ・ask の PATH を読む呼びと自分の PATH へ送る呼び・unmeasured の呼び・保存の口の名が無い）・nextstep_keys_one_table_in_declared_order（next.rs の nx_ の鍵の引用符の字が 1 度ずつ）・pipe_stage_column_from_contract と pipe_view_passes_net_now（pipeline.rs の column の呼び・段の名の字が無い・mod dom の中の net の now の呼び）・mapview_classes_and_keys_exist（map.rs の class の字）・frame_one_module_per_block（各 file が id と引用符で囲んだ block の id を持つ）・hsblock_dispatch_by_list（ledger.rs の wasm の target のときだけの属性の行のすぐ次の行が引数なしの pub fn view の宣言で、その本文が use_context で受ける）・frame_no_heading_words_in_code と frame_classes_are_in_stylesheet（src の全体）。この行が足す 2 つの定数は、定数の名（PATH・RULING_PATH・METRICS_PATH）と今の FOLD_KEYS と同じ鍵の字だけを持ち、引用符で始まる /api/ の字・class の字・語彙の日本語の語・保存の口の名・段の名・nx_ の鍵を持たないので、上の歯の数は変わらない（batchpanel_paths が数える自分の口の引用符の字も、PATHS を定数の名で書くので 1 のまま）。
      写しの frame.json を消す（行 hs-pages の後始末）。行 hs-pages は、着地済みの header と 5 つの頁の字が変わらないことを測るために tests/snapshots/frame.json を 1 字も書かずに残し、歯 hspage_ がその file と header_snapshot の先頭の 7 行と 5 つの頁の page_snapshot の字を比べる。頁ごとの snapshot（tests/snapshots/pages の下）と header.json が着地した後はこの写しは要らず、残すと、着地済みの頁を直す行がみな同じ file を書くことになる。この行は frame.json を消し、tests/hspage.rs から frame.json を読む比べの 2 つだけを外す（hspage_ のほかの期待は変えない）。frame.json を読む歯は、行 hs-pages の着地の後は hspage.rs だけになる（hs-pages が frame.rs・askcard.rs・gapspage.rs・nodepage.rs・batchpanel.rs・acctwire.rs の比べを頁ごとの file と header.json に替える）ので、ほかの歯の file は触らない。
      測り方。新しい歯は tests/hsderive.rs に置き、名を hsderive_ で始める。着地済みの行と、この文書の行の verify の filter の語（contracts の 3 つの契約の file の verify の行から数えた・確かめた）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hook_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_ と、この文書の hbproc_・hbconf_・hbroute_・hbpost_・hsblock_・hspage_・hsderive_ で、新しい歯の名から先頭の hsderive_ を除いた字は、このどれも部分の字として含まない（例 hsderive_project_x・hsderive_graph_x・hsderive_server_x は不可・着地済みの行の filter に当たると、その行の歯の置き場が write-set の外に増える）。名の例（どの語も含まない）は hsderive_consts_match_note・hsderive_module_returns_consts・hsderive_fold_forms_joined・hsderive_drops_old_copy・hsderive_own_names_clean。13 の module の PATHS と FOLDS を節の値と比べる歯（着地の時の値の確かめ）と、Module の paths と folds が各 module の定数と同じであることを見る歯を置く。13 の block の file は 2 つの定数を足すだけで、ほかの字は変えない。
      依存は足さない。Cargo.toml と vocab.json と style.css は触らない。

