    - {who: 持ち主, date: 2026-09-29, ruling: t3-hub.66.3（裁定 id = t3-hub.66.3:20260929T0656Z-1・notes に逐語）, verbatim: 推奨で良い。, surface: R-8}
  superseded_by: surface-plan
  note: 判断の記録 ADR-13（組み立ての script が登録を生成する・案 M2）の実装の行。surface-base と surface-board は章の上限 12 を越えているので、新しい文書に置いた。境界の 4 行（hb-proc → hb-config → hb-route → hb-post）と面の 3 行（hs-blocks → hs-pages → hs-derived）はそれぞれの中で直列、2 つの列は互いに並べて走る。

sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      server の口の振り分け・project board の block の列と描き分け・頁の列の 3 つの登録を、crate の組み立ての script（build.rs）が dir の file の名から生成する形へ移す（判断の記録 ADR-13）。移した後は、新しい口・block・頁は、その dir に新しい file を置くだけで登録に載る。
      境界の crate は、先に共通の部品（子 process の撃ち方と時刻の読み）と起動の引数の組み方を割り、その後に GET の口と POST の口を 1 口 1 file に割る。面の crate は、先に block の共通の部品を kit へ割って block の列を生成し、その後に頁を 1 頁 1 file にし、最後に口の path と畳む段の鍵を block ごとの定数から導く。
      どの行も外の依存を足さない。crate の根の lib.rs の pub mod の行は手で書く。
