      依存と順。ノートの depends は空。器の行 x（seat tick status の 3 欄）は器の main 44b3f3da に着地し、PATH の scribe2 の binary も器の main 57c02e87 の世代に入れ替わった（2026-09-29・実の出力の席の行の末に reopens= と move= と grace_left= がこの順で在ることを確かめた）。便を流す時は席が決める（欄の無い古い binary の器に対しても壊れず、面は測れていないの ↻ の行を出す）。同じ file を書く行の順は計画の 5 節の鎖に従い、便の bead の依存で持つ（席が付ける）: 契約の seat.rs と中核の seat.rs と契約の歯の seat の群（cform_seat.rs と snapshot seat.json）は c-seat-tick（ノート surface-wave15a・着地済み）の後で、計画だけの行 c-seat-group・c-seat-grace・c-abs-seat はこの行の後に起こして流す（計画の 5 節の鎖）。面の seatpill.rs と歯 gpill.rs は g-seatpill（着地済み）の後で、後の計画だけの行 c-abs-seat の前。この行は境界の server/seat.rs・中核の account/project.rs・歯 acctpcore.rs を書かない（acctpcore と server_seat は置き場だけの =）。置き場だけの = の重なり（歯 frame.rs・parts.rs・aord.rs・kindlab.rs・gjst.rs・gatt.rs・lstg.rs は行 g-ledger-group-kind〔ノート surface-wave21b〕、歯 server_seat.rs は行 e-signal〔ノート surface-wave21d〕と、どれも =）は同時に流さないことを器の交差の断りが持つ。置き場だけの = の歯 gjst.rs・kindlab.rs・lstg.rs は行 c-abs-time（ノート surface-wave21a）が書くので、この行はその後に流す（便の bead の依存・席が付ける）。g-ledger-group-kind と c-abs-time の起草の差分を試作に当てた木でも、契約・中核・面の歯の全部（1065 本）が通った。外の依存は足さず、Cargo.toml・fixture の file・stylesheet・語の辞書・境界の file・中核の account の file は触らない。src の行数は試作で契約の seat.rs 119 → 138・中核の seat.rs 466 → 483・面の seatpill.rs 136 → 173（src の差分は足した 89 行・消した 16 行）、歯の cform_seat.rs 151 → 164・ctick.rs 94 → 95・gpill.rs 457 → 459・snapshot seat.json 145 → 157、新しい歯の file は 79・209・377 行。大きさは第 0.3 版の M から S に下げた（自前の判定と境界の撃ちを消し、書く src は 3 つの file）。試作の git diff は 38982 byte。
      決定はしご（条 P-27）。要るか: 要る（限度で止まった席がいつ戻るかが project board の header に無く、見本の値が欠ける）。既に在るか: 器の判定の値は器の行 x が seat tick status の席の行に足し、tsuzuri は同じ出力を既に撃って読んでいる。足す物は電文の閉じた 4 つの値の型 1 つと欄 1 つ、中核の私的な関数 1 つ、面の字の 2 か所と const 2 つで、依存も語も class も口も子 process も足さない。退けた案: 器の rules 行の閾値の写しで窓を選ぶ（第 0.1〜0.3 版・器の判定と 2 点で食い違い、判定の写しを器の外に作る）。欄を時刻と無しの 2 値にする（測れていないと時刻の無い当たりを当たっていないに潰す）。欄の無い古い行を分からないに落とす（器の判定を得ていないのに当たりを名乗る）。move= と grace_left= の読みを先に足す（この行は読まない）。面が限度でない状態にも再開の時刻を出す（状態の限度と器の当たりの食い違いを面が判じることになる）。

