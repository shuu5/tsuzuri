      filter の語（main 45cc258 の contracts の verify の filter の語 278〔この行の語を除く〕を、ほかの語を部分の字として含まない 203 語に畳み、test の名に入りえない :: を含む語 server::events::tests:: を除いた 202 語・この行の接頭辞 lresume_ は並べない）は aaround_・abst_・accept_・acchold_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・aface_・afocus_・alean_・aord_・aown_・apop_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadl_・cadopt_・cadq_・cdorm_・cfsplit_・cg9_・cgdom_・cmark_・cnote_・contract_form_・cround_・csled_・cspk_・ctick_・cupd_・cupdlist_・denv_・dnedge_・dngrp_・dnrow_・dnskip_・ecache_・epolq_・eretry_・esig_・evkind_・flight_・fmark_・fprem_・frame_・fserve_・fstop_・fxpre_・g3g7_・gapspage_・gatt_・gbnote_・gcoach_・gfix_・gfresh_・ghb_・gins_・gjst_・glabel_・gnav_・gpface_・gpill_・gpulse_・graph_・gsum_・gtuck_・gview_・gwv_・hacols_・harest_・hasplit_・hbconf_・hbmark_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hdchip_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hshist_・hspage_・hspk_・hsym_・hthr_・http_・hwstore_・iclose_・ilink_・jcount_・jrun_・kcli_・kg9_・kindlab_・klink_・ksum_・launch_・lcard_・ledgerblock_・lgrp_・lhome_・lidle_・lkind_・lsnap_・lspark_・lstg_・lstore_・mapview_・mkeys_・mlink_・mstore_・mtips_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・nxorg_・parts_・pci_・pclosed_・pfold_・pgsw_・pgz_・pipe_・plimit_・pmisfit_・pmore_・pquest_・pqueue_・project_・ptitle_・pubscan_・punmap_・pwhole_・qblock_・qgate_・qkey_・question_・rbusy_・relay_・rhold_・runsdoc_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・stbp_・stcli_・steady_・stnfy_・stskill_・sttgt_・sxaxis_・ticker_・tipx_・tkad_・tlic_・topbar_・topfit_・tz_・unow_・urpanel_・uword_・wstrip_ で、新しい歯の名はどれも lresume_ で始まり、名から先頭の lresume_ を除いた字はこのどれも部分の字として含まない（例 lresume_seatcard_x・lresume_frame_x は不可）。名は done に書いた lresume_wire_four_values・lresume_card_key_default・lresume_copies_four_forms・lresume_unreadable_is_unmeasured・lresume_own_line_only・lresume_board_rows_carry・lresume_pil