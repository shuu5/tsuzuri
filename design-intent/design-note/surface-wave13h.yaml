  - n: 3
    type: prose
    title: 行 c-limit-resume — 器の seat tick status の reopens= を席の card の電文に写し、header の席の pill と席の card に出す
    body: |
      在りかの main は 45cc258（計画 surface-plan は第 0.83 版）。この節の code の字はその値で、書く file と読む file の字は main 34265f4 から変わっていない（試作は 45cc258 の写しで撃った）。器（scribe2）の字は、器の設計 doc docs/design/seat-heartbeat.md の §20（器の main 7cfb6394・器の契約表の行 x と行 y）と、行 x の着地した器の code（器の main 44b3f3da の crates/scribe2/src/seat/tick.rs の fn status と fn status_tail）を読んで確かめた値。
      なぜ。見本（docs/design/mock3・判断の記録 ADR-7 で確定）の project board は、header の席の pill（ui.js の関数 seatPillHTML）で、限度なら再開の時刻を class eta num の span（style の無い形・stylesheet の限度の色）に、応答なしなら最後の tick からの経過を応答なしの色の span に出し、席の card（関数 seatCard）は限度なら ↻ と再開の時刻を出す。着地済みの行 g-seatpill（ノート surface-wave12c）は電文に再開の時刻が無いので出さなかった。第 0.1〜0.3 版は、器の rules 行の窓ごとの閾値の写しと規則の行 R-22 の逼迫の印の式で中核が当たる窓を選び、戻る時刻の遅いものを出す形だった。器の席の答え（2026-09-28）で、器の限度の判定は上限 100%（器の fleet/select.rs の LIMIT_PCT）と席の model の窓を数える選定の読みで、その代わりの読みは閾値を使う点と数える窓の点で器と食い違うと分かり、便 t3-hub.52.92 を留めた。器は §20 で、自分の選定の判定を 1 回呼んでその答えを seat tick status の席の行の欄 reopens= に出すと決めた。判定は器だけが持ち、消費する側は rules 行や実測から代わりに計算しない（器の約束）。そこでこの行は、その欄をそのまま電文に写し、面に出す形に書き直す。要件 FR12 は席の健康（限度を含む）を出すことを決める。
