    body: |
      公開した tsuzuri の repo（2026-09-29）へ、host の名・tailnet の住所と名・口座の名札をまた出さないための走査を、xtask に足す行 1 つ。
      見るのは、追跡される file の今の字と、公開を記した commit より後の commit の作者の欄と本文。公開の前の履歴はこれらの字を持つが、commit の id を保つので消さず、見ない。
      形の走査（tailnet の IPv4 の範囲と *.ts.net の名）は一覧なしで効き、口座の名札と host の名の一覧は追跡しない file から読む（CI には一覧が無いので形だけを見る）。
      走査は xtask の check の最初の段で撃たれるので、器の land の前の check と CI の両方で効く。当たりは場所と種類だけを出し、当たった字は出さない。
