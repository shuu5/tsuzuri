  - n: 3
    type: prose
    title: 行 cs-acct-mark — 窓の記録に起こした時の口座と会話の印を置く（判断の記録 ADR-55 の決定 (2)(6)）
    body: |
      在りか（版上げ）。差の file docs/design/patch/cs-acct-mark.patch は、main 485aacca に 29a の未着地の cs-env-closed と cs-read-roots の差と行 cs-plain-open の差を当てた木（写し drafts/w188a の 1135283d）と、その上に前の版の試作 4b8577ea（係 w184a）と版上げの試作を載せた木 8f1334a9 との差（18 file・+526 −24・35,672 byte・NFR1002 の見積の上限 550 行ちょうど）。その後に cs-env-closed が着地した（main 3320c277）。main 736bf810 に 29a の未着地の cs-read-roots の差と行 cs-plain-open の差を当てた木の crates と xtask と tests の字は 1135283d と同じで、この差はその木に当たり、当てた木の同じ字は 8f1334a9 と同じ（係 w190a）。版上げは、会話の印の口が窓の作った symlink を辿って作業場の外の file に書けた穴（係 w188a の見立て）を、行 cs-plain-open の助けで塞ぐ。拠りは判断の記録 ADR-55 の決定 (2)（窓の記録に口座と会話の印）と (6)（測り方）。

      順。書く file の 5 つ（中核の consult/launch.rs・fixture・cwarg.rs・境の consult/launch.rs・cwlch.rs）は 29a の相談の窓の行と重なる。差は cs-env-closed と cs-read-roots と行 cs-plain-open の差の後でだけ当たる（main 485aacca にこの順で git apply --cached --check を当てた・係 w188a。cs-env-closed の着地の後の main 736bf810 には cs-read-roots・cs-plain-open の順で当たり、cs-read-roots の差を抜くと中核の consult/launch.rs で当たらない・係 w190a）。行 cs-plain-open は同じノートなので depends で名指す。ノートを跨ぐ順（29a の未着地の cs-read-roots の後）は depends に書けないので、便の bead の依存で持つ（席が付ける）。このノートの後の行（cs-resume・c-acct-consult）は depends でこの行を名指す。

      なぜ。ADR-55 の決定 (3)（付いてくる形）と (4)（口座の board）は、窓を起こした時の口座と今の会話の id と手すきかを読む。今の窓の記録（作業場の .consult/window.json と process の印）はどれも持たない（行 cs-launch）。口座は起動の口の環境の CLAUDE_CONFIG_DIR（席の環境・ADR-29 の決定 (5)）から読め、会話の id は Claude Code の hook の入力の session_id から読める。検証役 qv182 が、制限の形（--restricted）の下でも --settings の hook が撃たれ、会話の始まりの hook が会話の id と始まりの種類（startup・resume・clear・fork）を持ち、消し直し（/clear）と窓の中の選び直しの後は新しい id で撃たれることを確かめた（drafts/qv182/w/notes.md の 5 節・V）。transcript の path は別の cwd の時に当てにならない（同 4 節）ので、id は session_id だけから取る。

      形。 - contract: ProcMark に欄 account（Option・serde の default・欄の無い前の印も None で読める）。会話の印の型 Stamp（at・event・sid・source・未知の鍵を断る）と 事の閉じた語 StampEvent（start・prompt・stop・hook の名から読む of_hook）。
      - 中核: 新しい module consult/stamp.rs（is_uuid・read・lines・last_sid・純関数）。consult/launch.rs に STAMP_HOOKS と stamp_command と私用の fn hooks を足し、settings の hooks を守りの hook と 3 つの会話の印の hook にし、audit_permissions が 3 つの事の各々を字で照らす。module の doc に 1 行。
      - 境: consult/stamp.rs（新しい口・どの周も rc 0）。窓の控えの有無を行 cs-plain-open の plain_file で、印の 1 行の足しを append_plain で行う（symlink を辿らない）。consult/mod.rs に口の振り分けと USAGE の字と module の doc。consult/launch.rs が process の印に account を書く（定数 ACCOUNT_ENV）。
      - fixture: settings の hooks に 3 つ。
      - xtask の歯の表: kfold.rs の GROUPS の 2 つの群の数（中核の teeth3 は 4 から 5・境の teeth5 は行 cs-plain-open の後の 15 から 16）。歯の束に module を足す行は、この表も同じ行で直す（段の束ねの後で束に module を足す最初の行・係 w183a の試作は表を直しておらず、係 w184a の根の xtask check で歯 kfold_groups_declare_every_module_once が落ちた）。
      - 歯: cwarg.rs に cwarg_settings_hold_the_stamp_hooks。新しい歯の file teeth3/cwstm.rs（4 本）と teeth5/cwstp.rs（3 本）と、束の main.rs の mod の行。cwlch.rs の話す窓の印の期待に account を足し（助けの fn talk_mark）、問う窓の印の account を断言する。印を組む歯の file（cwlch.rs・cwcls.rs・cwopn.rs・cwwat.rs）の ProcMark の字に account を足す（断言は替えない）。歯の会話の id は作り物の uuid の字。

      hook の命令の決め（条 P-7）。会話の印の口は囲いの外で持ち主の権限で走り、turn の終わりの hook が rc 2 を返すと窓の終わりを止める（Claude Code の hook の決まり）。なので命令の末は || true で、口自身もどの周も rc 0 で返し、書かなかった理由を標準エラーに出す（会話の始まりと持ち主の入力の hook の標準出力は会話の文脈に入るので、口は標準出力に何も出さない）。書く先は起動の口が窓ごとに決めて命令に置いた作業場の 1 file だけで、hook の入力の cwd は使わない（窓の中で cd すると替わる・相談の窓の所見 cw1-5 の 11 番）。作業場の名と窓の控えを照らすので、ほかの dir には書かない。版上げの symlink の決め。窓は作業場の中に symlink を作れ、口は囲いの外で走るので、作業場から印の file までのどの段も行 cs-plain-open の助けで見て、symlink と普通でない file には書かない。断った周も今の作法のまま、書かずに rc 0 と標準エラーの 1 行（窓を止めない）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 番目の項は verify の 1 行目、2 番目から 6 番目の項は 3 行目（中核の歯の束 teeth3・在りかは cwarg.rs と cwstm.rs）、7 番目から 10 番目の項は 4 行目（境の歯の束 teeth5・在りかは cwlch.rs と cwstp.rs）、11 番目の項は 5 行目（xtask の歯の束 teeth1・在りかは kfold.rs）、最後の 12 番目の項は 3 行目と 4 行目で測る。verify の 2 行目（clippy）は done の項に載せない守り。xtask の check は器の共通 verify が gate の各段で verify の行の前に撃つので verify に書かない。欄 done-teeth は書かない。

      入口の赤。土台 2bef0db3 の crates の字に、この行の fixture だけを当てた木（会話の印の hook 3 つを持つ fixture）で、verify の 3 行目の歯 cwarg_ は rc 100（cwarg_matches_fixture の 1 本が落ち 13 本が通る）。新しい歯の file teeth3/cwstm.rs と teeth5/cwstp.rs は土台に無い。verify の 5 行目の歯 kfold_ は、表 GROUPS の 2 行を直す前の試作の木（根の xtask check の中）で rc 100（kfold_groups_declare_every_module_once の 1 本が落ちる）。版上げの入口の赤。行 cs-plain-open の木に前の版の stamp.rs と版上げの歯 cwstp.rs を当てた木で、verify の 4 行目の cwstp_ は rc 100（cwstp_does_not_follow_symlinks の 1 本が落ち、2 本が通る）。

      試作と噛み。写し drafts/w184a で書く file は write-set の中で閉じる。verify の 2 行目から最後の行までは、試作の commit 4b8577ea で rc 0（clippy・中核の歯 cwarg_ と cwstm_ の 19 本・境の歯 cwstp_ cwlch_ cwcls_ cwopn_ cwwat_ の 29 本・xtask の歯 kfold_ の 2 本）。噛みは句ごとに 1 つの変異を当てて名指しの歯だけを撃ち（係 w184a の w/bite.py）、22 の句（hook の事の名・命令の末・設定の印の hook の時間・検めが印の hook を見ない・検めの時間の照らし・uuid の長さ・uuid の 16 進・uuid の区切りの数・始まりの種類を全部の事に・id の形を見ない・知らない事を受ける・最後の id を最初に・印の口座を書かない・作業場の名を見ない・窓の控えを見ない・絶対 path を見ない・断りの rc・足さずに書き替える・口の振り分け・中核の束の mod の行・境の束の mod の行・表の境の群の数）に 22 の変異を当てて全部 rc 100（組み立ての失敗の rc 101 は 0）。変異なしの対照は 3 つの束とも rc 0。係 w183a の 1 度目の噛みで生き残った 2 つ（uuid の区切りの数・窓の控えを見ない）は、見本を足した後の歯で噛む（区切りの多い字と、.consult の dir は在るが窓の控えの無い作業場）。版上げの噛みの付け替え。前の版上げの句のうち、途中の段の symlink・印の file の symlink・書かずに Ok・無い file を作る の 4 つは行 cs-plain-open の歯 cwpln_ に付け替えた（そちらで rc 100）。この行に残る 2 つの句（印の 1 行を symlink を辿って足す・窓の控えの照らしを is_file に戻す）は境の歯 cwstp_ で撃って全部 rc 100、対照 rc 0。版上げの後も verify の 2 行目から最後の行までは rc 0（写し drafts/w188a の 8f1334a9）。

      範囲の外。続きの旗（--resume）と起こす口座の信頼の印と前の process の照らし（行 cs-resume）。付いてくる口（--follow）と見張りの口座のずれと一覧の口座の欄（行 cs-follow）。口座の board（行 c-acct-consult・e-acct-consult）。席と窓の言付けと受け口の断りと、Remote Control と状態の 1 行（判断の記録 ADR-57・このノートの後の行・会話の印の hook と同じ設定の hooks の塊に言付けを渡す hook が足される見込み）。開いている窓への効き（起こし直すまで前の設定のまま・前の印は口座を持たない）。
  - n: 4
    type: prose
    title: 行 cs-plain-open — 作業場の file を symlink を辿らずに見て書く助け（判断の記録 ADR-55・行 cs-acct-mark の前）
    body: |
      なぜ。窓の会話の印の口（行 cs-acct-mark）と状態の 1 行の口（行 cs-status-verb）は、囲いの外で持ち主の権限で走り、窓が書ける作業場の file を見て書く。窓は作業場の中に symlink と fifo を作れるので、辿れば作業場の外の file に書き、外の字を持ち主の画面に出す（行 cs-acct-mark の前の版の stamp は印の file を辿って開いた・係 w188a の見立て）。この行は 2 つの口が使う助けを先に置き、穴の在る stamp が main に着地しない順にする（行 cs-acct-mark は版上げでこの助けを使う）。

      形。境に新しい module consult/plain.rs（plain_dir・plain_path・same_file・plain_file・append_plain）。作業場と途中の段は lstat で symlink でない dir と見る。append_plain は file を lstat で見て、普通の file なら append で開いた後の fstat で同じ dev と ino かを照らし、無ければ create_new（O_EXCL・symlink を辿らない）で作り、symlink と普通でない file は書かない。consult の mod.rs に module の行 1 つ。歯は新しい file teeth5/cwpln.rs（2 本）と束の main.rs の mod の行と、kfold.rs の teeth5 の数 14 を 15。

      測らない事。lstat と開く間に途中の dir を替える競りは残る（std に段ごとの O_NOFOLLOW の開きが無い）。fstat の照らしと create_new が塞ぐ印の file の競りは歯で作れないので、same_file は別の file を渡す形で、create_new は無い file を作る形で測る。

      順。この行はノート surface-wave29b の最初の行で、行 cs-acct-mark が depends でこの行を名指す。差は main 485aacca に 29a の未着地の cs-env-closed と cs-read-roots の差を当てた木（写し drafts/w188a の cdbfeca3）で切った。cs-env-closed の着地（main 3320c277）の後の main 736bf810 には、29a の未着地の cs-read-roots の差の前でも後でも当たる（書く file が重ならない）。cs-read-roots の差を当てた木の crates と xtask と tests の字は cdbfeca3 と同じ（係 w190a が一時の index で照らした）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。(1) は verify の 1 行目、(2) と (3) は 3 行目（境の歯の束 teeth5・在りか cwpln.rs）、(4) は 4 行目で測る。clippy は守り。xtask の check は器の共通 verify が撃つので書かない。欄 done-teeth は書かない。

      入口の赤。歯の file と main.rs と kfold.rs だけを試作の字にした木は、verify の 3 行目が rc 101（module consult::plain が無く組めない）。

      試作と噛み。写し drafts/w188a の 1135283d で verify の 2 行目から最後の行まで rc 0。句ごとに 8 つの変異（dir の symlink を辿る・作業場を照らさない・途中の段を照らさない・fstat の照らしをしない・在るかの見の symlink を辿る・足す file の symlink を辿る・書かずに Ok・無い file を作らない）を当てて全部 rc 100、対照は rc 0。普通でない file を開く変異は、fifo の開きが止まるので撃っていない（file の symlink は同じ見本で fstat の照らしも断る）。

      範囲の外。stamp の口の直し（行 cs-acct-mark）・状態の 1 行の口（行 cs-status-verb）・読む助け（行 cs-status-verb の read_plain）。
  - n: 5
    type: prose
    title: 行 cs-inbound-refuse — 窓はほかの session からの言付けを全部断る（判断の記録 ADR-57 決定 (1)(ケ)・言付けの問い t3-hub.88.1.3 の甲）
    body: |
      なぜ。Claude Code の session どうしの言付け（cross-session messaging）は、受け方の値を置かない窓に、確かめを飛ばさない送り手（持ち主がほかで開いた session・Remote Control の先の session）の言付けをそのまま届け、手すきの窓に turn を起こす（公式の文書 cross-session-messaging の Control inbound messages）。持ち主の裁定は甲＝窓は Claude Code の言付けを全部断り、席の言付けは tsuzuri の口の箱から渡す形。文書は受け方の鍵 crossSessionInbound の値を accept・hold・refuse の 3 つとし、--settings の旗が鍵を置けば利用者の設定の値は効かないと書き、送りと一覧を止めるには permissions.deny に SendMessage と ListAgents を specifier なしで置くと書く。

      形。中核の launch.rs に定数 INBOUND（字 refuse）と PEER_TOOLS（SendMessage・ListAgents）を足し、設定の末の鍵に crossSessionInbound を置き、読む道具の断りの列の末に PEER_TOOLS の 2 つを足す。検めの audit_permissions は鍵の値が refuse でなければ欠けの名 /crossSessionInbound を足す。permissions.deny の欠けは今の照らし（組んだ断りの全部が設定に在るか）がそのまま見る。fixture は deny の末の 2 字と鍵 1 つを足す。歯 cwarg_audit_refuses_each_missing_key の deny の数 19 を 21 に、歯 cwarg_hides_account_dirs_and_credential_reads の数 17 を 19 に替える（字は差の file）。

      ほかの行との当たり。行 cs-acct-mark の版上げの差を当てた木の上で切った。差は main afe01c84（行 cs-plain-open と cs-acct-mark を置き、29a の cs-read-roots が着地した後）に、行 cs-plain-open と cs-acct-mark の差の後で当たる（係 w190a が一時の index で照らした）。同じ 3 file を書く後の行 cs-remote・cs-status-text はこの差の後に当たる（直列）。境の歯 cwlch_ は tz consult launch の argv を中核の argv と同じ字で比べるので字を替えず、write-set に置き場だけの = で置いた。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。(1) は verify の 1 行目、(2) から (4) は 3 行目（中核の歯の束 teeth3・在りか cwarg.rs）、(5) は 3 行目と 4 行目（境の歯の束 teeth5）で測る。verify の 2 行目（clippy）は done に載せない守り。xtask の check は器の共通 verify が撃つので verify に書かない。欄 done-teeth は書かない。

      入口の赤。歯と fixture だけを試作の字にした木は、verify の 3 行目が rc 101（歯が名指す INBOUND と PEER_TOOLS が無く組めない）。

      試作と噛み。写し drafts/w188a で verify の 2 行目から最後の行まで rc 0。句ごとに 6 つの変異（値 accept・鍵を置かない・値の検めを外す・道具を断りに置かない・道具の順を替える・道具の名に specifier）を当てて全部 rc 100、対照は rc 0。

      範囲の外。席→窓の言付けの箱（行 cs-tell の予定）・窓→席の知らせ（行 cs-note の予定）・Remote Control（行 cs-remote）。
