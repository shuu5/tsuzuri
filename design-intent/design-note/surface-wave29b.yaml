  - n: 9
    type: prose
    title: 行 cs-status-verb — 口 tz consult statusline（判断の記録 ADR-57 決定 (1)(コ)・(4)・状態の 1 行の口は囲いの外で走る）
    body: |
      なぜ。状態の 1 行の命令は設定の hook と同じく囲いの外で持ち主の権限で走り、窓が書ける作業場の file を読む。窓は作業場の中に symlink と fifo を作れるので、辿れば作業場の外の file の字を持ち主の画面に出し、fifo を開けば止まる。裁定は「制御の字を落とし symlink を辿らない」。

      形。境の module consult::statusline に run・read_plain・count と FILE_MAX（16 KiB）・STDIN_MAX（256 KiB）・DIGEST（bundle/digest）を置く。照らしの助けは行 cs-plain-open の境の module consult::plain の plain_dir・plain_path・same_file を使う（この行は plain.rs を書かない・行 cs-acct-mark も同じ助けを使う）。run は渡した path が「/」で始まり、名が consult-cw<n> で、plain_dir（lstat で symlink でない dir）の時だけ読む。read_plain は plain_path で作業場から file までの途中の段を symlink でない dir と見て、file を lstat で普通の file と見て開き、開いた後の same_file（fstat で普通の file で dev と ino が同じか）で照らし、頭の FILE_MAX byte だけを読む。count は symlink でない dir の直下の、名が .json で終わる普通の file を数える（DirEntry の型は辿らない）。控えは wire::decode で読み、1 行は中核の status::render で組む。consult の mod.rs は module の行・USAGE の字・振り分けの 1 行・doc の 1 行を足す。歯は段の file crates/tsuzuri-boundary/tests/cwsln.rs（判断の記録 ADR-32 の決定 (3)・群の main.rs と kfold.rs は書かない）。字は差の file。

      測らない事。lstat と開く間に fifo へ替える競り（開きが止まる）は、設定の命令の timeout 2 で終わる。fstat の照らしは歯で測っていない（競りを歯で作れない）。

      ほかの行との当たり。行 cs-status-text の差の後に当たる（main afe01c84（行 cs-plain-open と cs-acct-mark を置き、29a の cs-read-roots が着地した後）に、このノートの前の行の差を順に当てた木・係 w190a）。境の consult/mod.rs は後の行 cs-tell（予定）も書く。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。(1) は verify の 1 行目、(2) から (7) は 3 行目（段の file cwsln.rs と境の歯の束 teeth5 の cwlch.rs）で測る。clippy は守り。欄 done-teeth は書かない。

