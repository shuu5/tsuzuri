ollow は cs-resume と cs-gone-once）。 第 0.8 版（2026-10-05）は、判断の記録 ADR-32 の決定 (4) の畳みの行 t-fold-2（段の file 36 本〔xtask 1・契約 1・core 9・境界 9・面 16〕を crate ごとの最後の群へ名の順に畳み、置く用意の行が名指す 2 本〔core の cwplg・面の cwbar〕と、差を切った後に名指しが外れたか段で足された 3 本〔境界の dtcol と cwsln・core の cwsts〕は次の畳みへ残す・群は開かない・差は main aa113d5b で切った・depends は同じノートの cs-acct-mark・試作と噛みと床は係 w194a・差の file の形）を足した。 第 0.9 版（2026-10-05）は、判断の記録 ADR-35 の決定 (7) の名乗りの行 r-lanes-on（tsuzuri の宣言 .vessel.toml に任意 key build-lanes = true を足し、宣言を読む段の歯の file xtask/tests/vlanes.rs を置く・判断の記録 ADR-37 の決定 (6) の最初の比べ〔形 B・判断の記録 ADR-48 と ADR-56〕の後・節に判断の記録 ADR-35 の撤退の条件の 7 日の数え方・depends は空・試作と噛みは係 w187a・差の file の形）を足した。 第 0.10 版（2026-10-05）は、行 g-vocab-dupkey（面の語彙の読みが、同じ欄に 2 度在る鍵と english と rephrase の両方に在る鍵を Err にする・検証役 qv184 の名指し・判断の記録に依らず先に置く・差は main f6771a8c で切った・試作と噛みは係 w198a・差の file の形）を足した。 第 0.12 版（2026-10-05）は、判断の記録 ADR-58 の行 g-style-parts と g-vocab-parts（面の stylesheet と語彙に行ごとの部品の dir・新しい selector と鍵だけを足す行は基を書かない・g-vocab-parts は g-style-parts と g-vocab-dupkey の後・試作と噛みは係 w198a・差の file の形）を足した。 第 0.13 版（2026-10-05）は、判断の記録 ADR-36 の決定 (8) の器の行 v-buildrs（器の build.rs の組み直しの合図を器の入力だけに絞り、git の HEAD と index を合図から外す・版の値の字は替えない・v-join の前・差は main 6087307b で切った・depends は空・器を書く便は同時に 1 本まで・試作と噛みと床は係 w199a・差の file の形）を足した。 第 0.14 版（2026-10-05）は、行 v-buildrs の verify に、器の clippy の 1 行と、done の歯 build_rerun_ を撃つ器の e2e の nextest の 1 行を足した（便 t3-hub.74.62 の行の審査が、差の当たりの 1 行だけでは done の歯を撃たないと vacuous-assert で落とした・差の file と done と write-set は替えない）。 第 0.15 版（2026-10-05）は、判断の記録 ADR-59 の行 ag-spec と ag-hook（席が起こす係の起こしの門と結びの口・中核の判じと境界の 2 つの口に割った・ag-hook は ag-spec の後・後の行 ag-meter は ag-hook の後・試作と噛みと床は係 w208a・差の file の形）を足した。 第 0.16 版（2026-10-05）は、判断の記録 ADR-59 の行 ag-meter（席が起こす係の測りと残りの注ぎ・ag-hook の後・試作と噛みと床は係 w209a・差の file の形）を足した。 第 0.17 版（2026-10-05）は、行 g-vocab-parts の done と節を直し、関数 vocab() と受入の vocab_text の本体が部品を読む字を測る歯 vcparts_vocab_reads_sources と vcparts_accept_reads_dir を差の file の歯の file に足した（便 t3-hub.89.5 の行の審査が、置き場の部品が鍵を持たないので vocab() が基だけを読む変異でも歯が通り、done の 2 つ目の項と受入の vocab_text を測る歯が無いと vacuous-assert で落とした・差の file を置き換えた・歯の file のほかの差と verify と write-set は替えない・直しと噛みと床は係 w212a）。 第 0.18 版（2026-10-05）は、判断の記録 ADR-60 の決定 (7) の器の行 v-patch-field（器の契約表の行に任意の欄 patch〔差の file の path〕を足し、契約 file に写し、欄の生成物と根の欄の写しを同じ行で直す・ADR-60 の器の行の 1 本目で続く 5 行は後で足す・差は main 5f1dfb49 で切った・depends は空・器を書く便は同時に 1 本まで・試作と噛みと床は係 w211a・差の file の形）を足した。 第 0.19 版（2026-10-05）は、判断の記録 ADR-59 の行 ag-guard（係の門・tz hook agent-guard）と ag-stop（終える前の門・tz hook agent-stop）を足した（どちらも depends は ag-meter・互いに depends を書かず差は両順で当たる・試作と噛みと床は係 w218a・差の file の形）。 第 0.20 版（2026-10-05）は、判断の記録 ADR-60 の決定 (1)(2)(4)(5) の器の行 v-commute-apply（器に入口の排他を差の当たりで判じる 1 関数と結末の閉じた列 6 値と入り切りの規則の行 pipe.overlap_commute〔真偽・値は偽〕を足す・ADR-60 の器の行の 2 本目・差は v-self-match と v-patch-field の差の後で切った・depends は v-patch-field・器を書く便は同時に 1 本まで・試作と噛みと床は係 w214a・差の file の形）を足した。

sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      判断の記録 ADR-55（相談の話す窓を群の口座の移動に付いて来させ、窓の記録に起こした時の口座と今の会話の id を持たせ、口座の board に窓を口座つきで並べる・ADR-29 の決定 (5)(7) の部分の置き換え・持ち主の裁定 t3-hub.88.1.1 と t3-hub.88.1.2 の案 A）と、判断の記録 ADR-57（窓は会話どうしの言付けを全部断り、話す窓を起動の時から Remote Control に繋いで状態の 1 行を出す・ADR-29 の決定 (3)(7)(8) の部分の置き換え・持ち主の裁定 t3-hub.88.1.3 の甲と t3-hub.84.3 の案 A）の行を置く。

      行は 13 本。ADR-55 の行は、作業場の file を symlink を辿らずに見て書く助け cs-plain-open、窓の記録に口座と会話の印 cs-acct-mark、撃ち直しの部品と信頼の印 cs-trust、撃ち直しが会話を続ける cs-resume、口座の board の電文と中核 c-acct-consult、読み手と面 e-acct-cwread、口座ずれの印と一覧の口座 e-acct-consult、止まった窓を同じ process について 1 度だけ知らせる cs-gone-once、付いてくる口と見張りの口座のずれ cs-follow。ADR-57 の行は、言付けの断り cs-inbound-refuse、Remote Control cs-remote、状態の 1 行の字と設定 cs-status-text と口 cs-status-verb。言付けの箱と知らせの行（cs-tell・cs-note・cs-note-relay の見込み）は試作の後に足す。

      相談の窓の起動の口の行は中核と境の consult の file と fixture と歯の cwarg.rs を重ねて書くので、席の決めで 1 本ずつ直列に流す。順は cs-plain-open → cs-acct-mark → cs-inbound-refuse → cs-remote → cs-status-text → cs-status-verb → cs-trust → cs-resume → cs-follow で、各行の depends は前の行を名指し、差は前の行までを当てた木で切る。口座の board の 3 行（c-acct-consult → e-acct-cwread → e-acct-consult）は、新しい歯を段の file に切り直して起動の口の行と書く file が交わらないので、cs-acct-mark の後にその列と並べて流し、c-acct-consult の depends は cs-acct-mark を名指す。行 cs-gone-once は直列の外で depends を持たず、書く file の交わる cs-acct-mark と cs-follow とは器が便を順に流し、cs-follow は depends で cs-resume と cs-gone-once を名指す（差は cs-gone-once の後の木で切る）。今の窓 cw1 の開き直し（ADR-55 の決定 (5)）に要る cs-trust と cs-resume は口座の board の行を待たない。開き直しは席が持ち主に確かめてから撃つ。ノート surface-wave29a の相談の窓の行は全部着地した。

      行ごとの節は、行を足す適用が節の末に足す。1 本の契約表は 32 行まで（規則の行 R-32）。 歯の置き方は判断の記録 ADR-32 の決定 (3) のとおりで、新しい歯は段の file で足し、群の main.rs と kfold.rs は畳みの行だけが書く（持ち主の裁定 t3-hub.77.20:20261005T0258Z-1 で、置く前だった行 cs-status-text・cs-status-verb・cs-trust・cs-resume・e-acct-cwread・e-acct-consult・cs-follow を段の file に切り直した）。先に置いた行 cs-plain-open と cs-acct-mark は群へ直に歯の file を 3 本（cwpln・cwstm・cwstp）足して群の main.rs と kfold.rs を書いたが、3 本は crate の最後の群に名の順で入り、群の数と最後の群の上限の内で、畳みの行が段の file を群へ移した後と同じ形になるので、直す物は残らない。
