  - n: 27
    type: prose
    title: 行 ag-stop — 係の終える前の門（tz hook agent-stop・判断の記録 ADR-59 の決定 (4)(7)）
    body: |
      在りか。差の file docs/design/patch/ag-stop.patch（21,287 byte）は行 ag-meter の差の後に当たる差で、写しは drafts の try-w218a の commit 98bf842d（係 w218a・行 ag-meter の試作 bb1af787 の上・枝 w218a-stop）。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。depends は ag-meter（係の呼びの読み sub_call と、結びの解き resolve と、結びの無い呼びの記帳 unbound を使う）。行 ag-guard とは互いに depends を書かない（判断の記録 ADR-60）。2 つの差は ag-meter の差の後にどちらの順でも当たり、同じ木になる（係が一時の index で両順を照らした）。

      なぜ。判断の記録 ADR-59 の決定 (4) は、終える前の門を後の確かめとし、出す物・出力の path・席への知らせの欠けを 1 度目の終わりだけ止めると決めた。行 ag-spec は係の札の終えの印 ended を後の行が書くと置いた。書かないと、起こしの門の対象の重なりの断りが終わった係にも効き続ける。2 本目の行は機能で 3 本に割り、この行は終える前の門だけを置く。

      形。module tsuzuri_core の agent の stop に、定数 OUT（w）・LEAD（team-lead）・GATE（STOP-GATE.txt）と、型 End（欄 record・last・again）と、関数 end・lacks・hold を置く。境界の hook の subagent_stop に、定数 USAGE と関数 run を置く（口の名は agent-stop、module の名は Claude Code の門の事 SubagentStop から取り、席の停止の hook の stop の次に並ぶ）。中核の agent の mod.rs の doc の行は ag-meter の行の後、pub mod は spec の後、hook の mod.rs の doc の行は行 f-stop の行の後、pub mod は stop の後、main.rs の doc の行は tz hook stop の行の後、腕は stop の腕の後に置き、行 ag-guard の足す所から 4 行以上離した。

      順と極性。tz hook agent-stop --repo <dir> [--drafts <dir>]（SubagentStop・引数と置き場の解き方は agent-spawn と同じ）。rc は 0 か 1（使い方の誤り）か 2（1 度目の終わりの止め・Claude Code は SubagentStop の rc 2 を係の続けと読み、標準エラーを係に渡す）。係の id の無い入力は何も読まずに 0。置き場を解けなければ標準エラーに書いて通す。結びの名と札が読めない終わりは、測りと同じ unbound で .agents/unbound.jsonl に時刻・係の id・事 SubagentStop・空の道具の名の 1 行を足して通す（fail-open・決定 (4)）。結んだ係は、入力の agent_transcript_path の係の記録と、<置き場>/<名>/w と、入力の last_assistant_message から欠けを数える。欠けが在り stop_hook_active が真でなければ、理由を標準エラーに書いて 2。通す時は、欠けが在れば w/STOP-GATE.txt に欠けを 1 行ずつ書き、札の ended に今の epoch 秒を書いて 0（書けなければ標準エラーに書いて通す）。

      欠けの字。係の記録のどの行の message の content にも、名が SendMessage で input の to が team-lead の項が無ければ 係の記録に席（team-lead）への SendMessage の知らせが無い。札の outputs の名ごとに <出力の dir>/<名> が file でなければ 出す物 <名> が <出力の dir>/ に無い。最後の文が出力の dir の path の字を含まなければ 最後の文に出力の dir の path <出力の dir> が無い。この順に並べる。理由は 係の終える前の門は止める（<欠けを・で繋いだ字>） 次の一手 = 欠けを埋め、最後の文に <出力の dir> を書いて終える（止めるのは 1 度目の終わりだけ）。

      U。席の係は名で呼び合う形（teammate）で起きる。この形で SubagentStop がいつ撃たれるか（係の終わりか、手番ごとの待ちか）は U（判断の記録 ADR-59 の決定 (7)）。手番ごとに撃たれるなら、欠けの在る手番の終わりを毎回 1 度止め、通した手番で ended を書く。決定 (7) のとおり、2 本目の行の着地の後に席で係を 1 体起こして記帳を読み閉じ、終わりの事が SubagentStop でないと分かれば、口をその事へ移す行をこの記録の範囲で足す。

      見本。歯の入力は、囲みの二重引用符を省いた形で { session_id 00000000-0000-4000-8000-000000000000, transcript_path <根>/s.jsonl, cwd /W, permission_mode bypassPermissions, agent_id a77, agent_type tsuzuri:drafter, hook_event_name SubagentStop, stop_hook_active false, agent_transcript_path <根>/s/subagents/agent-a77.jsonl, last_assistant_message 済み。出す物は <置き場>/w218a/w に在る }（欄の名と形は係 w200a の試しの記帳の SubagentStop の入力の写しで、使わない欄 prompt_id・background_tasks・session_crons は省いた）。席への知らせの行は { type assistant, message { id A, content [ { type text, text 済み }, { type tool_use, id toolu_1, name SendMessage, input { to team-lead, message 済み } } ] } }。戻すには、欄の名と字の値を二重引用符で囲み、名と値の間にコロンを置く（false は囲まない）。

      done と verify の対応。どの項も verify の 3 行目（段の file tests/agsg.rs の歯 agsg_ の 6 本）で測る。1 行目は差の当たり、2 行目の clippy は命令の rc で測る守りで、done に載せない。xtask の check は器の共通 verify が撃つので verify に書かない。入口の赤は、main に名が agsg_ の歯が無いので 3 行目が --no-tests=fail で落ちる。

      歯と噛み。新しい段の file tests/agsg.rs（判断の記録 ADR-32 の決定 (3)・群の main.rs と kfold.rs は書かない）。中核の lacks を直に撃ち、tz の binary に歯ごとの置き場を --drafts で渡す（本物の起草の置き場と git config は読まない）。試作の木で verify の 2 行目と 3 行目は rc 0。噛みは係が撃った（18 変異・全部 rc 100・書き戻した後の status は空）。宛先を見ない変異で (1) (3)、道具の名を見ない変異で (1)、出す物を見ない変異で (2) (3) (5)、最後の文の path を見ない変異で (2) (3)、出す物の欠けを頭に並べる変異で (2)、1 度目の終わりも通す変異・止める時も終えの印を書く変異・止める時も欠けを記帳する変異・理由に欠けを書かない変異・止めの rc を 0 にする変異で (3)、係の記録を親の記録の path で読む変異と最後の文を読まない変異で (3) (4) (5)、終えの印を書かない変異で (4) (5)、2 度目の終わりも止める変異・stop_hook_active を読まない変異・欠けを記帳しない変異で (5)、結びの無い終わりを記帳しない変異と席の終わりを止める変異で (6) の歯が落ちる。

      範囲の外。拡張の束の門の設定 hooks.json の口（行 ag-plugin）。名で呼び合う形の終わりの事の確かめと口の移し（決定 (7)・上の U）。
  - n: 28
    type: prose
    title: 行 v-commute-apply — 器の入口の排他を差の当たりで判じる 1 関数と結末の閉じた列と入り切りの規則の行（判断の記録 ADR-60 の決定 (1)(2)(4)(5)・器の行の 2 本目）
    body: |
      在りか。差の file docs/design/patch/v-commute-apply.patch は、main 5f1dfb49 に器の行 v-patch-field の試作の commit 52504582（係 w211a）を載せ、ノート surface-wave29a の未着地の器の行 v-self-match の差（main の docs/design/patch/v-self-match.patch）を当てた木（commit 2fbb76ef・tree 48866c50）と、その上に試作の commit 40f9cc7d を載せた木（tree 9aca69ce・写し drafts/try-w214a の branch w214a-s）との差（8 file・48,026 byte・+489 −23）。差は v-self-match の差と v-patch-field の差の後にだけ当たる（e2e の rules/embedded.rs の表の行の数の断言と snapshot の rows の字を v-self-match の差が先に 111 にする）。main cf9f9d21 を読んだ一時の index に v-self-match と v-patch-field とこの差をこの順に当てると当たり（tree ce580980）、v-self-match の差を除くと当たらない（係が撃った）。便は差を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。器を書く便は同時に 1 本まで（判断の記録 ADR-33 の決定 (12)・判断の記録 ADR-60 の決定 (10)）。

      依存と順。depends は v-patch-field（同じノート・差を切った土台）。v-self-match はノートが違うので depends に書けない。v-patch-field の便は v-self-match の着地の後に流す（席の hold）ので、この行の便は v-self-match と v-patch-field の着地の後に走る。

      なぜ。判断の記録 ADR-60 の決定 (1)(2) は、交差した組のうち、交わる path が全部 file で再 gate の面の中に在り、両方の契約が差の file を名指し、両方の差が交わる path を全部書き、main の先端の一時の index に 4 通り（相手が 2 本以上なら積みも）で当たる組だけを通すと決めた。決定 (3) は判じを純な交わりの関数の中に置かず入口と起動の列が後から呼ぶ 1 本の関数に置くと決め、決定 (4) は結末を閉じた列で添え、決定 (5) は通すかどうかを規則の行 1 つ（真偽・値は裁定 id 付き）に持たせて偽の値で入れると決めた。この行は判じの関数と結末の列と規則の行を置くだけで、入口と起動の列への配線（v-commute-wire）と同じ名の拾い（v-commute-names）と着地の記帳（v-commute-ledger）と規則の行を真にする行（v-commute-on）は後の行が置く。規則の行は偽で、関数の呼び手もまだ無いので、入口の振る舞いは替わらない。

      形。器の src/pipe/commute.rs（新しい file）に、関数 judge（材料の構造体 Ask と相手の構造体 Partner を受けて結末 Verdict を返す）・結末の閉じた列 Verdict（Commutes・NoPatch・OutsideFace・NotCommuting・SameName・Unreadable の 6 値・as_str の字は commutes・no-patch・outside-face・not-commuting・same-name・unreadable・全部の列 VERDICTS）・規則の行の読み on・行 id の定数 ROW（pipe.overlap_commute）・一時の dir の名の定数 SCRATCH（commute）を置いた。Ask は repo・state dir・その周の main の先端・main の先端の宣言の根（RootsAtHead）・候補の欄 patch・相手の列（起こした順）・時間切れの時刻を持ち、Partner は相手の契約の写しの欄 patch・相手の便の base・候補と交わった項の組（refuse の overlaps の候補の項と相手の項）を持つ。src/pipe/mod.rs に pub mod commute の 1 行を足した。

      判じの順。judge は、候補の欄 patch か相手の 1 本の欄 patch が無い組を no-patch で断り、交わる項の組のどれかの項が、接頭辞を剥いで dir（末が /）か再 gate の面の外（追随の再 gate を撃つかを決める land の関数 scope_touched に 1 項ずつ渡して偽）なら outside-face で断る。次に state dir の下の commute に周ごとの dir（pid と通しの番号）を切り、候補の差の file を main の先端の木から、相手の差の file を相手の base の木から git cat-file blob で周の dir へ写し（読めない周は unreadable）、差の file の diff --git の行が書く path に交わる項の path が無い組を not-commuting で断る。最後に、相手ごとに 2 つの並び（候補の後に相手・相手の後に候補）と、相手が 2 本以上なら相手を起こした順に積んだ後に候補の並びを、並びごとに main の先端を git read-tree で一時の index に読んでから git apply --cached で 1 本ずつ当てる。並びの頭の差の当たりが単独の当たり（候補だけ・相手だけ）を兼ねるので、4 通りは 2 つの並びの 4 回の当てで測る。当たらない差が在れば not-commuting、index を読めない周と時間切れは unreadable、全部当たれば commutes。

      一時の置き場。git は全部、環境の GIT_INDEX_FILE を周の dir の index に、GIT_OBJECT_DIRECTORY を周の dir の objects に、GIT_ALTERNATE_OBJECT_DIRECTORIES を repo の物の置き場（git rev-parse --path-format=absolute --git-path objects）にして撃つので、repo の index と物の置き場には書かない。周の dir は判じの終わりに drop で dir ごと消す（決定 (2) の、一時の索引と物は repo の外に置き周ごとに消す）。git の子は時間切れの時刻を越えたら止めて unreadable に倒す。上限の時間の値はこの行では決めず、呼び手（v-commute-wire）が Ask に渡す。子は器の起動の記述（Invocation）を通して起こす。

      同じ名。結末の列は決定 (4) の断りの 5 つに通すの 1 つを足した 6 値で、same-name はこの行では返さない。同じ宣言の名を足す組の拾い（Rust の宣言の名・JSON の鍵の道・CSS の最上段の選び手）は後の行 v-commute-names が judge の当ての後の段に足す。後の行の順（names の後に wire）で、名の判じの前に judge が入口から呼ばれることは無い。

      規則の行。器の規則の値の形に真偽（ValueShape の Bool と RuleValue の Bool）を足し、manifest の読みは value の bool を真偽の値に読む（これまでは bool の値を読みの段で断っていた・形の照らしは RuleRow の validate の 1 か所のまま）。種類 PipeOverlapCommute（形は真偽・上限の許可の読み手は持たない）を足し、ALL では PipeSizeLLines の直後に置き（受付の見積の行の並び・ALL と表の末の並びを測る着地済みの歯の位置を動かさない）、rules/manifest.toml の行 pipe.overlap_commute（値 false・enabled true・ruling user 2026-10-05T05:13Z 問い t3-hub.89.2・ruled_at 2026-10-05）を行 pipe.size_l_lines の後に置いた。裁定は判断の記録 ADR-60 の承認（t3-hub.89.2:20261005T0513Z-1）。読み on は、行が無い・enabled が偽・値が偽の周を偽と読む（要件 FR1039 の、読めない周は偽と読む）。値の形が真偽でない行は manifest の読みが断るので、on は kind を見ない。

      歯の字の直し。着地済みの e2e の歯の字を合わせた。rules/embedded.rs の表の行の数の断言は 111 から 112（v-self-match の後・注の頭に行 v-commute-apply の +1）、kind の母集団の断言は 96 から 97、snapshot e2e__rules__rules_external_form.snap の 2 行の rows=111 kinds=96 を rows=112 kinds=97 に、e2e の rules.rs の種類ごとの見本の値に真偽の形の腕（字 false）を足した（値の形の match は網羅なので腕が無いと組めない）。

      実装の約束と done と verify の対応。1 番目の項は verify の 1 行目。2 番目から 6 番目の項は 3 行目（器の lib の歯 vcapply_ の 5 本・在りかは src/pipe/commute.rs の歯の区間）。7 番目から最後の 9 番目の項は 4 行目（着地済みの e2e の歯 4 本・在りかは e2e の rules/embedded.rs と rules.rs）。2 行目の器の clippy は命令の rc で測る守りで、done に載せない。xtask の check は器の共通 verify が gate の各段で撃つので verify に書かない。欄 done-teeth は書かない。

      構造の連鎖（commit 40f9cc7d の木で grep）。値の形と値を網羅で match する所は、rules/mod.rs の RuleValue の shape と render、rules/manifest.rs の関数 value_field、e2e の rules.rs の関数 sample_value で、全部に腕を足した（ほかの読み手は if let か _ の腕で形を絞るので替えない）。RuleKind の網羅の match（as_str・shape・has_permit_reader）と ALL にも足した。表の行の数と kind の母集団を断言する着地済みの歯は上の 2 本で、ALL と表の末の並びを断言する着地済みの歯は、足した位置が末の並びの外なので替えない。value_field の引数の id と errors は bool の断りの字だけが使っていたので外した。

      器の file の行の上限（1500）。src/pipe/commute.rs は新しい file で 453 行（本体 266 行・歯の区間 187 行）で、大きさ M の見込み 300 行を越えるので growth に 453 と書く。src/pipe/mod.rs は 1413 行から 1414 行で、M の見込みでは上限を越えるので growth に 1 と書く。src/rules/manifest.rs は 1422 行から 1411 行に縮むので write-set に 頭の - で書く。src/rules/mod.rs は 906 行から 917 行。器の xtask の check の core の行は 85168 / 90000。

      入口の赤。main には src/pipe/commute.rs も名に vcapply_ を持つ歯も無いので、verify の 3 行目は --no-tests=fail で落ちる。4 行目の着地済みの歯は、表の行の数 112 と kind の母集団 97 と snapshot の字と真偽の見本の腕を持つので、差の無い木（v-self-match の後で 111 行・96 種）では組めないか落ちる。

      試作と噛み。写し drafts/try-w214a で書く file は write-set の中で閉じる（8 file）。試作の木で verify の 2 行目から最後の行までは rc 0。器の入れ子の歯の全部（cd scribe2 で cargo nextest run --workspace --no-fail-fast）は 4,153 本が通り、器の clippy の全部（--workspace --all-targets）と器の xtask の check も rc 0。根の xtask の check は撃っていない（書く file は全部 scribe2/ の下で、根の歯が読む器の file を替えない）。噛みは 30 の変異（判じの各段を外す・候補と相手の差を読む木を取り替える・2 つの並びの片方を外す・積みを外すか逆の順にする・当たらない差を見逃す・時間切れを見ない・周の dir を消さない・物の置き場か index を repo に戻す・結末の字・規則の読みの enabled か値の照らしを外す・表の行の値を真にする・真偽の形を外す・manifest の読みが bool を捨てる・真偽の字の描き・表の行を外す・ALL から kind を外す・snapshot の字・見本の値）が全部 rc 100 で名指した歯が落ちた（書き戻した後の対照は rc 0）。

      範囲の外。同じ名の拾い（v-commute-names）・入口と起動の列への配線と待ちの理由の結末の欄と通した組の記帳の event（v-commute-wire）・着地の記帳（v-commute-ledger）・規則の行を真にする（v-commute-on）・判じの時間の上限の値。行の予約の照らしと回答で write-set を広げる周の照らしは file の交わりのまま（決定 (3)）。器の binary の入れ替え（席の手）。この行の契約表の行は欄 patch を書かない（v-patch-field の着地の前は根の欄の写しが欄を持たず tz check が断る・規則の行が偽の間は判じに使われない）。
