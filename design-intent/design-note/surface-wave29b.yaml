      範囲の外。付いてくる口と見張りの口座のずれの事象（行 cs-resume・cs-follow）。tz consult list の口座の欄の並べ替え。

      根の確かめの直し（係 w190a）。係 w186a の差は面の consultwin.rs に字 NO_ACCOUNT（分からない）を置き、行 e-acct-cwread の後は 分からない が vocab の語になるので、根の xtask check の面の歯 frame_no_heading_words_in_code が落ちた（V・写し drafts/w190a の w/xtask-F.log）。面は語の鍵で引く形に直し、歯 cwbar.rs の断言を語の引きに替えた。境の consult/list.rs の字 NO_ACCOUNT は残す（境の src はこの歯の外で、tz consult list の人の読む行は vocab を読まない）。

