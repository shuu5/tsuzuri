      席の決めで、起動の口の行は 1 本ずつ直列に流し（cs-plain-open → cs-acct-mark → cs-inbound-refuse → cs-remote → cs-status-text → cs-status-verb → cs-trust → cs-resume → cs-follow）、口座の board の 3 行（c-acct-consult → e-acct-cwread → e-acct-consult）は cs-acct-mark の後にその列と並べて流す（新しい歯を段の file に切り直して、board の行と起動の口の行の書く file が交わらなくなった）。depends は前の行 e-acct-cwread。起動の口の行（cs-resume・cs-follow を含む）と重なる file は無い。口座の board の 3 行の差は、cs-acct-mark の着地の後の main 028a4989 に board の 3 行だけを当てた木（写し drafts/w190a の branch s2-par の 34966e3e）でも当たり、3 行の verify の clippy と歯の行が rc 0（係 w190a・w/par-run.log）。

