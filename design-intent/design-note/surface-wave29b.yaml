    type: prose
    title: 目的
    body: |
      判断の記録 ADR-55（相談の話す窓を群の口座の移動に付いて来させ、窓の記録に起こした時の口座と今の会話の id を持たせ、口座の board に窓を口座つきで並べる・ADR-29 の決定 (5)(7) の部分の置き換え・持ち主の裁定 t3-hub.88.1.1 と t3-hub.88.1.2 の案 A）の行を置く。行は 5 本の見込み。窓の記録に起こした時の口座と会話の印を置く行 cs-acct-mark、続きの旗と起こす口座の信頼の印と前の process の照らしの行 cs-resume、付いてくる口と見張りの口座のずれの行 cs-follow、口座の board の電文と中核の行 c-acct-consult、読み手と面の行 e-acct-consult。試作の済んだ行から足す。
      相談の窓の行は中核の consult/launch.rs と fixture と歯の cwarg.rs を書くので直列に流す。ノート surface-wave29a の相談の窓の行（cs-gh-read・cs-env-closed・cs-root-edits・cs-read-roots）の後に流す順は、ノートを跨ぐので depends に書かず、便の bead の依存で持つ（席が付ける）。このノートの中の順（cs-acct-mark の後に cs-resume、その後に cs-follow、cs-acct-mark の後に c-acct-consult、cs-follow と c-acct-consult の後に e-acct-consult）は depends で書く。
      席と窓の言付け（問い t3-hub.88.1.3 の裁定の後）と、Remote Control と状態の 1 行（問いの前）の行も、決まった後にこのノートへ足せる。今の窓 cw1 の開き直し（ADR-55 の決定 (5)）は、行 cs-follow の着地の後に席が持ち主に確かめてから撃つ。
      行ごとの節は、行を足す適用が節の末に足す。1 本の契約表は 32 行まで（規則の行 R-32）。
