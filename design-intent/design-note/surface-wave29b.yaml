    body: |
      在りか。差の file docs/design/patch/c-acct-consult.patch は、行 cs-acct-mark の試作の木 4b8577ea（写し drafts/w184a の branch p184）と、その上に試作を載せた木 fce60827（写し drafts/w186a の branch pc1）との差（8 file・+331 −8・22,559 byte）。拠りは判断の記録 ADR-55 の決定 (4)（口座の board）。窓の口座は行 cs-acct-mark が process の印に足す欄 account を読む。積み（係 w190a）。差は、このノートの前の行の差を順に当てた木（写し drafts/w190a の branch s2）の上に試作の commit を cherry-pick した木との差で、差の file は係 w186a の差と byte で同じ。席の決めで、1 つの行の案（差 744 行）を要件 NFR1002 の見積の上限 550 行の内に割った前半で、後半の行 e-acct-cwread（読み手と面）が depends でこの行を名指す。

      順。書く file は相談の窓の起動の口の行（ノート surface-wave29a の cs-env-closed・cs-root-edits・cs-read-roots と、このノートの cs-acct-mark・cs-resume・cs-follow）と交わらない（係 w186a が cs-resume の試作 4e2918c6 の差と両順で当てて同じ木を確かめた）。席の決めで、起動の口の行は 1 本ずつ直列に流し（cs-plain-open → cs-acct-mark → cs-inbound-refuse → cs-remote → cs-status-text → cs-status-verb → cs-trust → cs-resume → cs-follow）、口座の board の 3 行（c-acct-consult → e-acct-cwread → e-acct-consult）は cs-acct-mark の後にその列と並べて流す（新しい歯を段の file に切り直して、board の行と起動の口の行の書く file が交わらなくなった）。depends は窓の口座の欄 account を置く行 cs-acct-mark。口座の board の 3 行の差は、cs-acct-mark の着地の後の main 028a4989 に board の 3 行だけを当てた木（写し drafts/w190a の branch s2-par の 34966e3e）でも当たり、3 行の verify の clippy と歯の行が rc 0（係 w190a・w/par-run.log）。

      なぜ。ADR-55 の決定 (4) は、口座の board が project ごとに相談の窓の作業場を読み、閉じていない窓ごとに session の行の種類 相談の窓 で、窓の名・口座（process の印の口座の置き場の名）・状態（生きている・止まった）・開いた時刻を並べ、口座の印を持たない窓の口座を 分からない と出すと決めた。今の口座の board の session の行は席と run の 2 種類に閉じている（電文の SeatRole）。この行は電文と中核の組みを置き、読み手の集めと面の語は後半の行に置く。

      形。 - contract: SeatRole に Consult（字 consult・doc に 1 句）。snapshot の surface.json と歯 cform_surface.rs の見本に 3 つ目の値。
      - 中核: project.rs に作業場の材料の型 ConsultWindow と ProjectTexts の欄 consult（serde の default・在る見本の字はそのまま読める）、読み解いた値 Parsed に台帳の notes の相談の開きと閉じの行（台帳の bead の notes だけを読む軽い型で読む・台帳の字が替わった時だけ読む）、私用の fn consult_rows・minute_secs と公開の fn account_label。session_lines_with は席の行の直後に consult_rows を足す（state dir の照らしの前）。module の doc に 2 行。
