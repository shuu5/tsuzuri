  - n: 3
    type: prose
    title: 行 cs-acct-mark — 窓の記録に起こした時の口座と会話の印を置く（判断の記録 ADR-55 の決定 (2)(6)）
    body: |
      在りか。差の file docs/design/patch/cs-acct-mark.patch は、main 9d94cb38 にノート surface-wave29a の未着地の相談の窓の行 4 本（cs-gh-read・cs-env-closed・cs-root-edits・cs-read-roots）の差をこの順に当てた木（土台 2bef0db3）と、その上に試作を載せた木 4b8577ea（写し drafts/w184a の branch p184・係 w183a の試作 7df417d0 を土台に載せ直し、xtask の歯の表を足した）との差（18 file・+506 −24・34,331 byte）。その後に cs-gh-read が着地した（main d8ca9385）。着地の木の crates と tests の字は、9d94cb38 に cs-gh-read の差を当てた木と同じ。拠りは判断の記録 ADR-55 の決定 (2)（窓の記録に口座と会話の印）と (6)（測り方）。

      順。書く file の 5 つ（中核の consult/launch.rs・fixture・cwarg.rs・境の consult/launch.rs・cwlch.rs）は 29a の相談の窓の行と重なる。差は cs-gh-read と cs-env-closed と cs-read-roots の 3 本の差の後でだけ当たり、cs-root-edits とはどちらの順でも当たる。cs-gh-read の着地の後の main に残りの 3 本の差を当てる順は 6 つとも同じ木になり、その木にこの差が当たる（係 w184a の w/commute-d8ca.out・着地の前の 4 本の 24 の順も w/commute.out）。ノートを跨ぐ順は depends に書けないので depends は空にし、順は便の bead の依存で持つ（席が未着地の 29a の相談の窓の便に付ける）。このノートの後の行（cs-resume・c-acct-consult）は depends でこの行を名指す。

      なぜ。ADR-55 の決定 (3)（付いてくる形）と (4)（口座の board）は、窓を起こした時の口座と今の会話の id と手すきかを読む。今の窓の記録（作業場の .consult/window.json と process の印）はどれも持たない（行 cs-launch）。口座は起動の口の環境の CLAUDE_CONFIG_DIR（席の環境・ADR-29 の決定 (5)）から読め、会話の id は Claude Code の hook の入力の session_id から読める。検証役 qv182 が、制限の形（--restricted）の下でも --settings の hook が撃たれ、会話の始まりの hook が会話の id と始まりの種類（startup・resume・clear・fork）を持ち、消し直し（/clear）と窓の中の選び直しの後は新しい id で撃たれることを確かめた（drafts/qv182/w/notes.md の 5 節・V）。transcript の path は別の cwd の時に当てにならない（同 4 節）ので、id は session_id だけから取る。

      形。 - contract: ProcMark に欄 account（Option・serde の default・欄の無い前の印も None で読める）。会話の印の型 Stamp（at・event・sid・source・未知の鍵を断る）と 事の閉じた語 StampEvent（start・prompt・stop・hook の名から読む of_hook）。
      - 中核: 新しい module consult/stamp.rs（is_uuid・read・lines・last_sid・純関数）。consult/launch.rs に STAMP_HOOKS と stamp_command と私用の fn hooks を足し、settings の hooks を守りの hook と 3 つの会話の印の hook にし、audit_permissions が 3 つの事の各々を字で照らす。module の doc に 1 行。
      - 境: consult/stamp.rs（新しい口・どの周も rc 0）。consult/mod.rs に口の振り分けと USAGE の字と module の doc。consult/launch.rs が process の印に account を書く（定数 ACCOUNT_ENV）。
      - fixture: settings の hooks に 3 つ。
      - xtask の歯の表: kfold.rs の GROUPS の 2 つの群の数（中核の teeth3 は 4 から 5・境の teeth5 は 14 から 15）。歯の束に module を足す行は、この表も同じ行で直す（段の束ねの後で束に module を足す最初の行・係 w183a の試作は表を直しておらず、係 w184a の根の xtask check で歯 kfold_groups_declare_every_module_once が落ちた）。
      - 歯: cwarg.rs に cwarg_settings_hold_the_stamp_hooks。新しい歯の file teeth3/cwstm.rs（4 本）と teeth5/cwstp.rs（2 本）と、束の main.rs の mod の行。cwlch.rs の話す窓の印の期待に account を足し（助けの fn talk_mark）、問う窓の印の account を断言する。印を組む歯の file（cwlch.rs・cwcls.rs・cwopn.rs・cwwat.rs）の ProcMark の字に account を足す（断言は替えない）。歯の会話の id は作り物の uuid の字。

      hook の命令の決め（条 P-7）。会話の印の口は囲いの外で持ち主の権限で走り、turn の終わりの hook が rc 2 を返すと窓の終わりを止める（Claude Code の hook の決まり）。なので命令の末は || true で、口自身もどの周も rc 0 で返し、書かなかった理由を標準エラーに出す（会話の始まりと持ち主の入力の hook の標準出力は会話の文脈に入るので、口は標準出力に何も出さない）。書く先は起動の口が窓ごとに決めて命令に置いた作業場の 1 file だけで、hook の入力の cwd は使わない（窓の中で cd すると替わる・相談の窓の所見 cw1-5 の 11 番）。作業場の名と窓の控えを照らすので、ほかの dir には書かない。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。done の 1 番目の項は verify の 1 行目、2 番目から 6 番目の項は 3 行目（中核の歯の束 teeth3・在りかは cwarg.rs と cwstm.rs）、7 番目から 9 番目の項は 4 行目（境の歯の束 teeth5・在りかは cwlch.rs と cwstp.rs）、10 番目の項は 5 行目（xtask の歯の束 teeth1・在りかは kfold.rs）、最後の 11 番目の項は 3 行目と 4 行目で測る。verify の 2 行目（clippy）は done の項に載せない守り。xtask の check は器の共通 verify が gate の各段で verify の行の前に撃つので verify に書かない。欄 done-teeth は書かない。

      入口の赤。土台 2bef0db3 の crates の字に、この行の fixture だけを当てた木（会話の印の hook 3 つを持つ fixture）で、verify の 3 行目の歯 cwarg_ は rc 100（cwarg_matches_fixture の 1 本が落ち 13 本が通る）。新しい歯の file teeth3/cwstm.rs と teeth5/cwstp.rs は土台に無い。verify の 5 行目の歯 kfold_ は、表 GROUPS の 2 行を直す前の試作の木（根の xtask check の中）で rc 100（kfold_groups_declare_every_module_once の 1 本が落ちる）。

      試作と噛み。写し drafts/w184a で書く file は write-set の中で閉じる。verify の 2 行目から最後の行までは、試作の commit 4b8577ea で rc 0（clippy・中核の歯 cwarg_ と cwstm_ の 19 本・境の歯 cwstp_ cwlch_ cwcls_ cwopn_ cwwat_ の 29 本・xtask の歯 kfold_ の 2 本）。噛みは句ごとに 1 つの変異を当てて名指しの歯だけを撃ち（係 w184a の w/bite.py）、22 の句（hook の事の名・命令の末・設定の印の hook の時間・検めが印の hook を見ない・検めの時間の照らし・uuid の長さ・uuid の 16 進・uuid の区切りの数・始まりの種類を全部の事に・id の形を見ない・知らない事を受ける・最後の id を最初に・印の口座を書かない・作業場の名を見ない・窓の控えを見ない・絶対 path を見ない・断りの rc・足さずに書き替える・口の振り分け・中核の束の mod の行・境の束の mod の行・表の境の群の数）に 22 の変異を当てて全部 rc 100（組み立ての失敗の rc 101 は 0）。変異なしの対照は 3 つの束とも rc 0。係 w183a の 1 度目の噛みで生き残った 2 つ（uuid の区切りの数・窓の控えを見ない）は、見本を足した後の歯で噛む（区切りの多い字と、.consult の dir は在るが窓の控えの無い作業場）。

      範囲の外。続きの旗（--resume）と起こす口座の信頼の印と前の process の照らし（行 cs-resume）。付いてくる口（--follow）と見張りの口座のずれと一覧の口座の欄（行 cs-follow）。口座の board（行 c-acct-consult・e-acct-consult）。言付けの受け（問い（t3-hub.88.1.3）の後）と、Remote Control と状態の 1 行（問いの前）。開いている窓への効き（起こし直すまで前の設定のまま・前の印は口座を持たない）。
