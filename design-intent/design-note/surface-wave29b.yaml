    title: 行 r-lanes-on — tsuzuri の宣言で組みの使い回しを名乗る（判断の記録 ADR-35 の決定 (7)・ADR-37 の決定 (6) の比べの後）
    body: |
      在りか。差の file docs/design/patch/r-lanes-on.patch（2 file・+50・3,608 byte）は、main ec27c058 に、根の器の宣言 .vessel.toml の末へ注 3 行と行 build-lanes = true を足し、段の file xtask/tests/vlanes.rs（歯 2 本・接頭辞 vlanes_）を足した木との差。器の file（scribe2/ の下）と rules の行は書かない。

      前提（字で照らした）。判断の記録 ADR-35 の決定 (7) は、入れ替え（行 v-swap の門）と決定 (5) の行（並びの合計の上限の掃除・行 v-lane-cap）の着地の後に名乗りを置くと定める。並びの行 v-lane（便 t3-hub.74.56・8778c2ee）と上限の行 v-lane-cap（便 t3-hub.74.57・20eea980）は着地し、PATH の器 4a20678f はその 2 つと入れ替えの門を含む（後の行 v-pin は含まない・名乗りの前提でない）。判断の記録 ADR-37 の決定 (6) の最初の比べ（形 B・判断の記録 ADR-48 と ADR-56）は 2026-10-05 の朝に全部の便が済んだ。

      比べの結果（席の記帳は memo t3-hub.77）。温かい使い回しありの便の書きは、同じ仕事のなしより約 3 割少ない（3 組・減るのは実装の AI の段だけで、検査の段は減らない）。ありの 2 回の揺れは温かい 5 組で中央 4.5%・最大 11.2%。着地した 18 便は全部が正解と同じ木。ありの 2 回目の 1 便（仕事 v-join-prep）は実装の AI が質問で終えて着地せず、撃ち直さない（席の決め）。

      歯（判断の記録 ADR-32 の決定 (3)）。根の宣言の key を読む歯は無かったので、段の file に新しい歯の file を 1 本置く。歯 vlanes_root_declaration_names_build_lanes_true_once は、根の .vessel.toml の注でない行のうち key が build-lanes の行がちょうど 1 行で、その字が build-lanes = true であることを見る。歯 vlanes_one_clause_changes_are_refused は、名乗りの見本を名乗りと読み、1 句だけ替えた 5 つ（値 false・引用符で囲んだ値・注の中・無い・2 行）を名乗りと読まないことを見る。外の依存は使わない。試作は写し drafts/w187a-lanes で、歯の file を単体で組んで撃って緑、宣言の無い main と値 false と引用符の値と 2 行の 4 つの宣言で落ちた（rc 101）。

      効く時。器は便の base の宣言を読むので、名乗りはこの行の着地の後に受付に来た便から効く。この行の便そのものは並びを使わない。

      撤退（判断の記録 ADR-35 の撤退の条件・数えるのは tsuzuri の設計の席・memo t3-hub.77 の notes に 1 件ごとに記帳・問う相手は持ち主）。一つ目、偽の緑（便の gate が緑だった木が、着地の後の CI か、並びを退かせて冷えた所から撃ち直すと落ちる）が 1 度でも見つかったら、宣言の名乗りを外す行を置いて原因を問う。二つ目、名乗りの後 7 日の装置の書きが、名乗りの前の 7 日より 25% 以上減っていなければ、形を問い直す。7 日の数えは、この行の着地の commit の時刻を境に前後 168 時間ずつ、装置 nvme0n1 の書きの和（netdata の disk.nvme0n1 の書き）で比べ、便の数の違いを見るために判断の記録 ADR-49 の式の便ごとの書きの和を便の数で割った値を並べる。三つ目、並びの上限に当たって丸ごと退かせる回数が 1 日 4 回を越えたら、上限の値を問い直す。

      範囲の外。器の file と rules の行と並びの上限の値は替えない。冷えた 1 便目は使い回しなしと同じ書きになるので、本番の 7 日の減りは比べの約 3 割より小さくなりうる（二つ目の線に近い側）。
  - n: 18
    type: prose
    title: 行 g-vocab-dupkey — 語彙の鍵の重なりを読みが断る（検証役の名指し）
    body: |
      在りか。差の file docs/design/patch/g-vocab-dupkey.patch（7,305 byte）は main f6771a8c からの差で、写しは drafts の try-w198a-parts の枝 s-dupkey（係 w198a）。

      なぜ。検証役 qv184 の名指し。面の src/vocab.rs の読みは、欄の object の項を BTreeMap に入れるので、同じ欄に 2 度在る鍵は黙って後が勝ち、english と rephrase の両方に在る鍵は黙って english が勝った。2 本の便が同じ鍵を足すと、差は当たり組めて歯も拾わない。今の vocab.json と 2026-09-20 からの全部の版には、どちらの重なりも無い（係 w198a が数えた）。締める直しなので、判断の記録 ADR-58 の答えに依らず先に置く。

      形。src/vocab.rs に、型 Owners（鍵から file の名と欄）と関数 add_file（1 つの file の rephrase と english を表へ足し、鍵が既に在れば鍵と 2 つの在りかを書いた Err）を足し、Vocab の parse は add_file を file の名 vocab.json で呼ぶ。Err の字は、鍵 K が 2 度在る（F1 の欄 C1 と F2 の欄 C2）の形。28 行目の doc の english が勝つ旨は、両方の欄に在れば Err に替える。vocab() は Err の時に空の語彙になるので、歯 vcdup_source_parses が置き場の file を止める。

      歯。新しい段の file tests/vcdup.rs（判断の記録 ADR-32 の決定 (3)・群の main.rs と kfold.rs は書かない）。噛みは係が撃った。照らしを外す変異で (2) と (3) の歯が落ち、(1) と (4) は通る。照らしを外し基に重なりを 1 つ足す変異で (1) が鍵の数 405 と 406 で落ちる。
  - n: 19
    type: prose
    title: 行 g-style-parts — stylesheet の部品の dir（判断の記録 ADR-58）
    body: |
      在りか。差の file docs/design/patch/g-style-parts.patch（17,797 byte）は main f6771a8c からの差で、写しは drafts の try-w198a-parts の枝 s-style（係 w198a）。

      なぜ。判断の記録 ADR-58 の決定 (1)(2)(3)(5)(7)。新しい selector だけを足す行が、行ごとの部品の file に書き、基の style.css を書かずに済むようにする（直近 3 日で足す行は 63%）。

      形。build.rs に関数 parts_table（crate の dir の下の dir の .ext の file を名の byte の順に読み、名と include_str の表 PARTS の字を書く・名の外れは file の名を書いた Err）と part_name_ok を足し、style の dir から OUT_DIR の style_parts.rs を書く（rerun-if-changed は style）。src/style.rs は PARTS を include し、関数 joined（部品ごとに名の注の 1 行と中身）と、wasm の target だけの関数 inject（head の末尾へ style の要素を 1 つ入れる・head が無ければ入れない）を持つ。main.rs は wasm の main の頭で inject を呼ぶ。lib.rs に pub mod style。style/000-about.css は決まりを書いた注だけの file で、dir を空にしない。style.css の頭の注の 2 行目を判断の記録 ADR-58 の決まりの字に替える。frame.rs の stylesheet_classes は基と joined の字をつないで読む。web-sys の feature と依存は足さない（head は query_selector で引く）。面の server は CSP を出さない。

      歯。新しい段の file tests/stparts.rs。噛みは係が撃った。基の selector を書き直す部品を足すと (3)、名の並べを逆にすると (1)(2)、表の中身を別の file にすると (1)、注の行を外すと (2)、入れる呼びを mount の後へ移すと (4)、frame の読みを基だけにすると (5) が落ちる。
  - n: 20
    type: prose
    title: 行 g-vocab-parts — 語彙の部品の dir（判断の記録 ADR-58）
    body: |
      在りか。差の file docs/design/patch/g-vocab-parts.patch（20,167 byte）は、main a5260517（行 g-style-parts と g-vocab-dupkey の着地の後）の木からの差で、写しは drafts の try-w198a-parts の枝 s-w212a（試作は係 w198a・歯の直しは係 w212a）。第 0.16 版で替えたのは歯の file tests/vcparts.rs だけで、ほかの 5 file の差の字は第 0.12 版と同じ。

      なぜ。判断の記録 ADR-58 の決定 (1)(3)(4)(6)。新しい鍵だけを足す行が、行ごとの部品の file に書き、基の vocab.json を書かずに済むようにする（直近 3 日で足す行は 83%）。鍵の重なりは file の中も外も断る（行 g-vocab-dupkey の断りを file を跨ぐ重なりへ広げる）。

      形。build.rs は行 g-style-parts の parts_table で vocab の dir から OUT_DIR の vocab_parts.rs を書く（rerun-if-changed は vocab）。src/vocab.rs は PARTS を include し、関数 sources（基の後に部品）と Vocab の parse_all（file の並びを 1 つの表に・行 g-vocab-dupkey の add_file を file ごとに呼び、在りかの表を共有する）を足し、vocab() は parse_all で読む。parse は parse_all の 1 file の形。vocab/000-about.json は鍵を持たない 2 欄の file（欄 _about は読まない）。境の crate の audit.rs に関数 merge_vocab（字の並びの english と rephrase の中身をつないだ 1 つの JSON の字）を足し、xtask の accept は基と vocab の dir の .json を名の順に読んで merge_vocab の字を sweep に渡す。基の鍵は動かないので、基の字を読む歯 pkview・hspk・gfix・gwv は替えない。

      歯。新しい段の file tests/vcparts.rs。置き場の部品は 000-about.json だけで鍵を持たないので、置き場の部品を読む vocab() の鍵の数は基だけを読んでも同じになる。そこで vocab() と受入の vocab_text が部品を読む事は、関数の本体の範囲の字の数と順で測り（歯 vcparts_vocab_reads_sources と vcparts_accept_reads_dir）、部品の鍵を表に入れる読みは、鍵を持つ見本の部品を歯の中の字で渡して測る（歯 vcparts_part_keys_read と vcparts_accept_reads_parts）。受入の vocab_text は xtask の中の file を読む関数で、xtask は面の crate に依らず、境の audit は file を触らない純な関数だけを持つので、PARTS を渡す形にせず、本体の字で測る。本体の範囲は頭の行から次の行頭の閉じ括弧までで、本体の外へ字を移すだけの変異でも落ちる。

      噛み。係 w212a が main a5260517 の木で撃った。鍵を持つ部品を 1 つ足すだけの対照は 7 本とも通る。vocab() が基だけを読むか sources の先頭だけを読むと vcparts_vocab_reads_sources が落ち、鍵を持つ部品を足した木で vocab() が基だけを読むと、さらに vcparts_part_keys_read と vcparts_accept_reads_parts も落ちる。sweep が基を直に読む・vocab_text が部品の dir を読まない・vocab_text が並びを基の 1 つに縮めるの 3 つは、どれも vcparts_accept_reads_dir が落ちる。名の並べを逆にすると vcparts_table_follows_dir、file を跨ぐ照らしを外すと vcparts_duplicate_key_refused、照らしを全部外すと vcparts_duplicate_key_refused と vcparts_in_file_duplicate_refused、merge_vocab が基だけをつなぐと vcparts_accept_reads_parts が落ちる。
  - n: 21
    type: prose
    title: 行 v-buildrs — 器の build.rs の組み直しの合図を器の入力だけに絞る（判断の記録 ADR-36 の決定 (8)・v-join の前）
    body: |
      在りか。差の file docs/design/patch/v-buildrs.patch は、main 6087307b と、その上に試作の commit を載せた木 56e9306c（tree 849108e1・写し drafts/try-w199a の branch w199a-p2b）との差（3 file・17,589 byte・+83 −68）。便は差を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。器を書く便は同時に 1 本まで（判断の記録 ADR-33 の決定 (12)）。

      なぜ。判断の記録 ADR-36 の決定 (8) は、器の build.rs の組み直しの合図を器の中の直しだけに絞る行を、器を根の workspace に入れる行 v-join の前に置くと決めた。今の build.rs は git の HEAD と index と repo の追跡の全 file を合図にするので、器の外の file の直し・commit・checkout の後に器を組むたびに build script が走り、器の crate を組み直す。build script の git status が index を書き直すので、何も変えずにもう 1 度撃っても走る。係の測り（器の全部の target・cargo build --workspace --all-targets・入れ子の manifest）で、main ec27c058 は器の外の commit の後に 5.0 秒・書き 1,127 MB、何も変えずにもう 1 度撃っても 4.8 秒・書き 1,104 MB を使い、試作の木はどちらも 0.05 秒・書き 0 だった。入れ子の段は build・歯・clippy の 3 つを撃つので、器を撃つ便 1 本で最大 約 3.3 GB の漏れになる見込み。合図に HEAD と index を残し、値が同じなら file を書かない途中の形でも、build script が走れば crate を組み直した。そのため HEAD と index を合図から外す。

      形。合図の列（rerun_paths）は pathspec（器の根の下の全部と、根の Cargo.toml・Cargo.lock・rust-toolchain.toml・rust-toolchain・.cargo）で器の追跡 file を列挙し、build/rerun.rs に置く。build.rs と器の e2e の歯は同じ file を include! で読む。器の根が repo の根の木では、列は追跡の全 file と同じになる。

      版の値。版の値（BUILD_COMMIT・--version と doctor の版の行）を測る字（HEAD の sha の頭 12 字と木の全部の dirty）は替えない（判断の記録 ADR-1028 の 2.1 のまま）。替わるのは測る時で、器の入力の直しで build script が走った時の値を焼く。器の外の commit と直しでは走らないので、値は最後に走った時の HEAD と dirty のまま残る。値を読む口は git の HEAD と比べない（doctor の食い違い binary は導入先の記録と自分の値を比べ、便の留めは留めの --version と自分の 1 行目を比べる）。

      範囲の外。consumer-sync.md の 18 節の合図の字（tracked 全 file と git の meta を合図にする）は後の行で合わせる（器の設計文書は組み立ての材料・判断の記録 ADR-33 の決定 (2)）。残る形として、器の直しを commit した後に器の入力を直さずに組むと、値は直した時の HEAD に +dirty を足した字のまま残る（便の gate と vessel update の install は新しい木の中身で走り直す見込み）。
  - n: 22
    type: prose
    title: 行 ag-spec — 係の起こしの門と結びの口の中核の判じ（判断の記録 ADR-59 の決定 (1)(2)(4)）
    body: |
      在りか。差の file docs/design/patch/ag-spec.patch（20,286 byte）は main e6e5dba2 からの差で、写しは drafts の try-w208a の commit de23152f を crate で割った中核の側（係 w208a）。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      なぜ。判断の記録 ADR-59 は、席が起こす係を拡張の束の係の型 3 本と係にだけ効く門で機械が持つと決めた（要件 FR21・受入 AC21）。この行は判じの純粋な関数だけを置き、file と子 process と時計は触らない（今の時刻は引数で受ける）。口は次の行 ag-hook が置き、後の行 ag-meter は ag-hook の後に置く。1 本の行では大きさ M（約 300 行）の約 3 倍（足す行 +894・src の下で +502）になったので、中核と境界の 2 本に割った。

      形。module tsuzuri_core の agent の spec に、定数 TYPES（tsuzuri:drafter・tsuzuri:verifier・tsuzuri:researcher）・KEYS（予算・組み・対象・出す物）・HOLES・BUILDS（なし・軽・重）・BRIEF（brief.md）・SPEC（spec.json）・AGENTS（.agents）と、型 Head・HeadError・Call・Refusal・Spec と、関数 head・fixed・spawn_call・judge・reason・deny・bound を置く。頼みの頭は prompt の頭の空でない行の塊の 鍵 と値をコロンで分けた行（鍵ごとに最初の行・空の値は無いと同じ）。予算の値は token と空白と 1 以上の数、組みは なし・軽・重 のどれか、出す物はコンマで区切った名の列。名は英数で始まり英数と - と _ だけの 64 字以内（Agent の name の欄の形）、係の id は同じ字で 128 字以内（起草の置き場の下の file の名に使う）。札の欄は name・type・budget・build・target・outputs・spawned（epoch 秒）・agent_id（結びの口が書く）・ended（終えの印・後の行が書く）。

      見分けと極性。係の id（agent_id）の在る入力は、Agent の呼びでも読まない（spawn_call と bound が None）。判じの順は型・名・頭・終えの印の無い札との対象の重なり。断りの理由は何が欠けたかと次の一手で、頭の断りは末に直した頭の見本の 4 行（形の合う値はそのまま・欠けたか形の違う値は書き方）を付ける。

      歯。新しい段の file tests/agsp.rs（判断の記録 ADR-32 の決定 (3)・群の main.rs と kfold.rs は書かない）。噛みは係が撃った（9 変異・全部 rc 100）。頭の欠けた鍵を数えない変異で (1) と (3) の歯、予算 token 0 を通す変異と組みの値を見ない変異で (2)、見本に書き方を書かない変異で (3)、終えの印を見ない変異で (4)、型を見ない変異と名の無い呼びを通す変異で (5)、係の id の在る呼びも読む変異で (6) と (7)、agentId の無い結果の status を係の id に読む変異で (7) の歯が落ちる。
  - n: 23
    type: prose
    title: 行 ag-hook — 係の起こしの門と結びの口（tz hook agent-spawn と agent-bind・判断の記録 ADR-59 の決定 (2)(4)(5)）
    body: |
      在りか。差の file docs/design/patch/ag-hook.patch（20,559 byte）は行 ag-spec の差の後に当たる差で、写しは drafts の try-w208a の commit de23152f を crate で割った境界の側（係 w208a）。便は差を git apply で当てるだけで、当たらない時は手で書かずに止まる。depends は ag-spec。後の行 ag-meter の depends は ag-hook にする（判断の記録 ADR-59 の決定 (7) の 2 本目の行）。

      口。tz hook agent-spawn --repo <dir> [--drafts <dir>] と tz hook agent-bind --repo <dir> [--drafts <dir>]。起草の置き場は --drafts か、repo の git config の鍵 tsuzuri.draftsdir（相談の窓と同じ鍵・consult の DRAFTS_ARGS）。rc は 0 か 1（使い方の誤り）だけ。hooks.json の口は後の行 ag-plugin が足し、この行は tz の口だけを置く。

      順。agent-spawn は、標準入力が席の Agent の呼びでなければ何も読まず何も出さずに 0。置き場を解けなければ標準エラーに書いて通す（fail-open・判断の記録 ADR-59 の決定 (4)）。置き場の直下の dir の spec.json を全部読み、中核の judge で判じ、断る時は deny の答えを標準出力に 1 行で書く。通す時は <名>/brief.md に prompt の字を、<名>/spec.json に札を書く（書けなければ標準エラーに書いて通す）。agent-bind は、結びの読みが返す名の札が在る時だけ札の agent_id を書き、.agents/<係の id> に名と改行を書く。札が無いか置き場を解けなければ何も書かない。

      見本。歯の入力は係の試しの門の入力の形を写し、会話の id と path は伏せた。囲みの二重引用符を省いた形で、席の起こしは { session_id 00000000-0000-4000-8000-000000000000, transcript_path /T/s.jsonl, cwd /W, permission_mode bypassPermissions, hook_event_name PreToolUse, tool_name Agent, tool_input { description 起草, prompt 頭の 4 行と空の行と本文, subagent_type tsuzuri:drafter, run_in_background true, name w208a }, tool_use_id toolu_X }。係の呼びは頭に agent_id aa21461fe66d86b69 と agent_type tsuzuri:drafter を足す。結果は末に tool_response { status async_launched, agentId a9f0c1 } を足す。戻すには、欄の名と字の値を二重引用符で囲み、名と値の間にコロンを置く（true は囲まない）。

      歯。新しい段の file tests/aghk.rs（判断の記録 ADR-32 の決定 (3)・群の main.rs と kfold.rs は書かない）。tz の binary を撃ち、--drafts に歯ごとの置き場を渡す（本物の起草の置き場と git config は読まない）。噛みは係が撃った（8 変異・全部 rc 100）。係の id の在る呼びも判じる変異で (1)、型を見ない変異と名の無い呼びを通す変異で (2)、brief.md に頭の 1 行だけを書く変異・起こしの時刻を 0 で書く変異・置き場の札を読まない変異で (3)、agentId の無い結果の status を係の id に読む変異と .agents に書かない変異で (4) の歯が落ちる。
  - n: 24
    type: prose
    title: 行 ag-meter — 係の測りと残りの注ぎ（tz hook agent-meter・判断の記録 ADR-59 の決定 (3)(4)）
    body: |
      在りか。差の file docs/design/patch/ag-meter.patch（23,878 byte）は行 ag-hook の差の後に当たる差で、写しは drafts の try-w209a の commit bb1af787（係 w209a・行 ag-spec と ag-hook の試作 de23152f の上）。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。depends は ag-hook（起草の置き場の解き方 drafts と引数の読み parse と、係の札 Spec と結びの dir の名 AGENTS を使う）。

      なぜ。判断の記録 ADR-59 の決定 (3) は、係の予算を係の記録の使用量の input・cache_creation・output の和を応答の id で重ねずに足した数とし、cache_read を別の欄にし、50・75・90% を越えた最初の 1 回だけ残りを注ぐと決めた。係の自己申告の量は合わない（席の測り・12.5 万を 4 万の内と申告した例）。2 本目の行（測りと係の門と終える前の門）は 1 本では大きさ M の約 2 倍の見込みなので、測りだけをこの行に置く。

      形。module tsuzuri_core の agent の meter に、定数 METER（meter.json）・MARKS（50・75・90）と、型 Meter（欄 offset・used・cache_read・last_id・last_used・last_cache_read・marks）・SubCall（欄 agent_id・event・tool・parent）と、関数 feed・cross・sub_call・unbound_line・transcript・notice・inject を置く。境界の hook の agent_meter に、定数 USAGE・UNBOUND（unbound.jsonl）と、関数 resolve・unbound・run を置く。resolve と unbound は後の行の係の門と終える前の門も使う。

      数え方。係の記録の 1 行が type assistant で message に usage を持つ時だけ数える。同じ応答の id の行は記録の中で続いて並び、後の行ほど output が伸びるので、直前の行と同じ id の行は前の行の分を引いて足し直す（席の測りの script が id ごとに最後の行を取るのと同じ和）。読むのは offset から最後の改行までで、末の書きかけの行は次の周に読む。係の記録の path は、門の入力の transcript_path（親の記録）の .jsonl を除いた dir の下の subagents/agent-<係の id>.jsonl。

      順と極性。tz hook agent-meter --repo <dir> [--drafts <dir>]（引数と置き場の解き方は agent-spawn と同じ・rc は 0 か 1 だけ）。係の id の無い入力は何も読まずに 0。置き場を解けなければ標準エラーに書いて通す。.agents/<係の id> の名の札が読めない呼びは測らず、unbound.jsonl に時刻・係の id・門の事・道具の名の 1 行を足して通す（fail-open・決定 (4)）。結んだ係は <名>/meter.json の offset から測り、札を書き直し、新しく越えた印が在れば最も大きい印の注ぎを 1 行出す。

      字。注ぎは 係の測り: 予算 <予算> の <印>% を越えた（使った量 <和> = input と cache_creation と output の和・残り <残り>・cache の読み <読み> は別の欄で数えない）。次の一手 = 新しい調べを広げず、分かった所を w/ に書く。100% を越えると、係の門は自分の w/ への書きと SendMessage だけを通す。答えは鍵 hookSpecificOutput の下の hookEventName PostToolUse と additionalContext の JSON の 1 行。

      見本。歯の記録の行は、囲みの二重引用符を省いた形で { type assistant, message { id A, usage { input_tokens 5, cache_creation_input_tokens 100, output_tokens 10, cache_read_input_tokens 1000 } } }。記帳の行は { agent_id a77, at <epoch 秒>, event PostToolUse, tool Bash }。戻すには、欄の名と字の値を二重引用符で囲み、名と値の間にコロンを置く（数は囲まない）。

      歯と噛み。新しい段の file tests/agmt.rs（判断の記録 ADR-32 の決定 (3)・群の main.rs と kfold.rs は書かない）。中核の feed と cross を直に撃ち、tz の binary に歯ごとの置き場を --drafts で渡す（本物の起草の置き場と git config は読まない）。噛みは係が撃った（12 変異・全部 rc 100）。同じ id の前の行の分を引かない変異と cache の読みを和に入れる変異で (1) (2) (4)、assistant でない行も数える変異で (1)、書きかけの行の後まで offset を進める変異で (2)、注いだ印を見ない変異で (3) (4)、小さい印を返す変異で (3)、記録を頭から読む変異・係の記録を subagents の下に組まない変異・残りに予算をそのまま書く変異・測りの札を書かない変異で (4)、結びの無い呼びを記帳しない変異と係の id の無い呼びも係の呼びに読む変異で (5) の歯が落ちる。
  - n: 25
    type: prose
    title: 行 v-patch-field — 器の契約表の行の欄 patch（差の file の path・判断の記録 ADR-60 の決定 (7)・器の行の 1 本目）
    body: |
      在りか。差の file docs/design/patch/v-patch-field.patch は、main 5f1dfb49 と、その上に試作の commit 52504582 を載せた木（tree 782c588c・写し drafts/try-w211a の branch w211a）との差（9 file・25,265 byte・+150 −18）。便は差を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。器を書く便は同時に 1 本まで（判断の記録 ADR-33 の決定 (12)・判断の記録 ADR-60 の決定 (10)）。

      なぜ。判断の記録 ADR-60 の決定 (7) は、入口の排他を差の当たりで通す判じの材料の差の file の path を、契約表の行の型の欄に持つと決めた（散文の verify の行を判じの材料にしない）。決定 (1) は、両方の契約がこの欄で差の file を名指す組だけを通す。この行は欄を足して読み書きするだけで、判じと名の拾いと入口の呼びと記帳と規則の行は後の 5 行（v-commute-apply・v-commute-names・v-commute-wire・v-commute-ledger・v-commute-on）が置く。

      形。器の src/pipe/table.rs の欄の列 FIELDS の末に patch（任意・文字列）を足し、ContractRow に欄 patch（Option の字・無ければ None）を足した。値の形は src/pipe/contract.rs の関数 patch_unfit の 1 本で測る（末が / の字は dir として断り、ほかは末が .patch でなければ断る・file の在否は読まない）。契約表の行の読み（src/pipe/table/parse.rs の patch_of）は形の外れを欄の行番号の 1 件で断る。生成する契約 file（契約の写し）は欄を持つ行だけ末に patch の 1 行を書き、契約 file の読みは Contract の欄 patch（Option の字）に読み、同じ関数で測って key の行番号の 1 件で断る。後の行の入口の判じは、今の交差の照らしが相手の便の write-set を読むのと同じ所（便の置き場の契約の写し）から相手の差の file の path を読む。

      欄の写し。欄の生成物 scribe2/contracts/schema.toml と根の欄の写し contracts/field-schema/schema.toml の basis の塊の次に、同じ patch の塊（name・need は optional・shape は text）を足した（写しの頭の 1 行の注は替えない）。判断の記録 ADR-60 の決定 (7) の、欄を足す行は器の欄の写しを同じ行で直す、の分。着地済みの根の歯 dtcol_copy_matches_the_vessel_schema が、写しの頭の 1 行の後ろと器の生成物を byte で比べる。

      歯の字の直し。欄の数と宣言順を断言する着地済みの器の lib の歯 3 本（src/pipe/table.rs）の数（21 を 22・任意 14 を 15）と宣言順の一覧（末に patch）と doc の字を合わせた。着地済みの歯 vbasis_toml_row_reads_the_basis_list_and_refuses_a_string の欄の列の末は basis の断言は、欄の列の 21 番目が basis の断言に替え、doc の字を合わせた（欄の列の末の断言は新しい歯 vpatch_toml_row_reads_the_patch_path_and_refuses_a_dir_a_suffix_and_a_list が持つ）。全欄を持つ行の見本（src/pipe/table.rs の full_row）は、欄 patch の既定の値を docs/design/patch/v.patch にした（字 v では形で断られる）。

      実装の約束と done と verify の対応。1 番目の項は verify の 1 行目。2 番目と 3 番目の項は 3 行目（器の lib の歯 vpatch_ の 2 本・在りかは src/pipe/table/parse.rs と src/pipe/contract.rs の歯の区間）。4 番目の項は 4 行目（字が替わる着地済みの器の lib の歯 3 本・在りかは src/pipe/table.rs の歯の区間）。5 番目の項は 5 行目（字が替わる着地済みの器の lib の歯 1 本・在りかは src/pipe/table/parse.rs）。6 番目の項は 6 行目（着地済みの器の e2e の歯・在りかは e2e の pipe/contracts.rs）。最後の 7 番目の項は 7 行目（着地済みの根の歯・在りかは crates/tsuzuri-boundary/tests/dtcol.rs）。2 行目の器の clippy は命令の rc で測る守りで、done に載せない。xtask の check は器の共通 verify が gate の各段で verify の行の前に撃つので verify に書かない。欄 done-teeth は書かない。

      構造の連鎖（commit 52504582 の木で grep）。ContractRow を欄ごとに組む所は parse の typed と歯の見本 2 か所（src/pipe/contract.rs と src/pipe/table/check.rs）、Contract を欄ごとに組む所は契約 file の読みの build と歯の助けと見本 3 か所（src/pipe/mod.rs・src/pipe/cli/intake.rs・e2e の polarity.rs）で、全部に欄を足した（ほかは既定の値か ..row の形で組むので替えない）。欄の数と宣言順と末を断言する着地済みの器の歯は上の 4 本で全部（器の入れ子の歯の全部を --no-fail-fast で撃って見つけた）。欄の写しを byte で比べる根の歯は dtcol.rs の 1 本。欄の列 FIELDS の読み手（器の contracts schema・契約表の検査の欄の照らし）は列をそのまま回すので替えない。

      器の file の行の上限（1500）。src/pipe/cli/intake.rs は 1481 行から 1482 行、src/pipe/mod.rs は 1412 行から 1413 行、src/pipe/table/check.rs は 1455 行から 1456 行で、大きさ S の見込み 100 行では上限を越えるので growth の欄に 1 行と書く。src/pipe/table.rs は 1274 行から 1280 行、src/pipe/contract.rs は 798 行から 862 行、src/pipe/table/parse.rs は 721 行から 769 行。

      入口の赤。main 5f1dfb49 には名に vpatch_ を持つ歯が無いので verify の 3 行目は --no-tests=fail で落ちる。差の字の着地済みの歯 4 本（欄 22・21 番目が basis）は、main の src（欄 21・末が basis）で撃つと欄の数と順で落ちる。

      試作と噛み。写し drafts/try-w211a で書く file は write-set の中で閉じる（9 file）。試作の木で verify の 2 行目から最後の行までは rc 0（器の clippy・器の lib の歯 vpatch_ の 2 本・着地済みの欄の列の歯 3 本・vbasis_ の 1 本・e2e の歯 1 本・根の歯 1 本）。器の入れ子の歯の全部（cd scribe2 で cargo nextest run --workspace --no-fail-fast）は 4144 本が通り、根の歯 dtcol_ の 5 本も通り、根の xtask の check（入れ子の器の build と nextest と clippy と器の check を含む）は rc 0。噛みは 10 の変異（行の読みが patch を捨てる・行の読みが形を測らない・契約 file に写さない・dir を断らない・末の .patch を見ない・契約 file の読みが配列を黙って捨てる・欄の列から patch を外す・patch を basis の前に置く・器の生成物の塊を外す・根の写しの塊を外す）が全部 rc 100 で名指した歯が落ちた（書き戻した後の対照は rc 0）。

      範囲の外。差の当たりの判じとその結末の列・名の拾い・入口と起動の列の呼び・記帳・規則の行 pipe.overlap_commute（後の 5 行）。契約表の検査が差の file の在否を照らすこと（読めない差の file は後の行の判じが断る側に倒す・判断の記録 ADR-60 の決定 (2)）。器の binary の入れ替え（席の手）。
  - n: 26
    type: prose
    title: 行 ag-guard — 係の門（tz hook agent-guard・判断の記録 ADR-59 の決定 (3)(4)）
    body: |
      在りか。差の file docs/design/patch/ag-guard.patch（17,327 byte）は行 ag-meter の差の後に当たる差で、写しは drafts の try-w218a の commit ddcfc484（係 w218a・行 ag-meter の試作 bb1af787 の上・枝 w218a）。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。depends は ag-meter（測りの札の名 METER と読み Meter と、係の呼びの読み sub_call と、結びの解き resolve を使う）。行 ag-stop とは互いに depends を書かない（判断の記録 ADR-60）。2 つの差は ag-meter の差の後にどちらの順でも当たり、同じ木になる（係が一時の index で両順を照らした）。

      なぜ。判断の記録 ADR-59 の決定 (3) は、予算の 100% を越えた後は係の門が自分の出力の dir への書きと席への知らせだけを通す（書き終えの段）と決めた。決定 (4) は、係の id の無い呼び（席）を見ず、結びの無い呼びを通し、結びの在る係の決まりの破りを断る（fail-closed）と決めた。2 本目の行（測りと係の門と終える前の門）は機能で 3 本に割り、この行は係の門だけを置く。

      形。module tsuzuri_core の agent の meter の子の guard（file は agent/meter/guard.rs・meter.rs が pub mod guard を持つ）に、定数 OUT（w）・NOTIFY（SendMessage）・WRITES（Write と Edit は鍵 file_path・NotebookEdit は鍵 notebook_path）と、関数 spent・write_path・open・refusal を置く。測りの子に置くのは、中核の agent の mod.rs が 5 行で、行 ag-stop がそこに module を足す差とこの行の差を両順で当たる様に分けるため。境界の hook の agent_guard に、定数 USAGE と関数 run を置く。hook の mod.rs の doc の行は ag-meter の行の後、pub mod は agent_bind の後、main.rs の doc の行は agent-meter の行の後、腕は agent-meter の腕の後に置き、行 ag-stop の足す所から 4 行以上離した。

      順と極性。tz hook agent-guard --repo <dir> [--drafts <dir>]（PreToolUse・matcher なし・引数と置き場の解き方は agent-spawn と同じ・rc は 0 か 1 だけ）。係の id の無い入力は何も読まずに 0。置き場を解けなければ標準エラーに書いて通す。測りと同じ resolve で結びの名と札が読めない呼びは通す（記帳は同じ呼びの後の測りが書く・門は file を書かない）。<名>/meter.json の used（札が無いか読めなければ 0）が札の budget より小さければ通す。以上なら、SendMessage と、Write・Edit・NotebookEdit で path が .. の成分を持たず <置き場>/<名>/w の成分で始まる呼びだけを通し、ほかは deny の答えを標準出力に 1 行で書いて 0。

      字。断りの理由は 係の門は止める（使った量 <和> が予算 <予算> 以上の書き終えの段で、道具 <道具の名> は通さない） 次の一手 = 分かった所を <置き場>/<名>/w/ の下に Write か Edit で書き、SendMessage で席に知らせて終える。答えは鍵 hookSpecificOutput の下の hookEventName PreToolUse・permissionDecision deny・permissionDecisionReason の JSON の 1 行（中核の spec の deny）。

      見本。歯の入力は、囲みの二重引用符を省いた形で { session_id 00000000-0000-4000-8000-000000000000, transcript_path /T/s.jsonl, cwd /W, permission_mode bypassPermissions, agent_id a77, agent_type tsuzuri:drafter, hook_event_name PreToolUse, tool_name Write, tool_input { file_path <置き場>/w218a/w/notes.md, content x }, tool_use_id toolu_X }。NotebookEdit は tool_input の鍵を notebook_path にする。測りの札は { offset 0, used 1000, cache_read 0, last_id null, last_used 0, last_cache_read 0, marks [50, 75, 90] }。戻すには、欄の名と字の値を二重引用符で囲み、名と値の間にコロンを置く（数と null は囲まない）。

      done と verify の対応。どの項も verify の 3 行目（段の file tests/aggd.rs の歯 aggd_ の 4 本）で測る。1 行目は差の当たり、2 行目の clippy は命令の rc で測る守りで、done に載せない。xtask の check は器の共通 verify が撃つので verify に書かない。入口の赤は、main に名が aggd_ の歯が無いので 3 行目が --no-tests=fail で落ちる。

