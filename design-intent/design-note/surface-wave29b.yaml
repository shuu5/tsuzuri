ind の母集団は 97（着地済みの e2e の歯 rules_embedded_manifest_is_valid_and_covers_all_kinds・rules_embedded_manifest_declares_one_capability_row_per_role） (8) 器の binary の rules validate の出力の 2 行は rows=112 kinds=97 を持ち、tracked の snapshot と一致する（着地済みの e2e の歯 rules_external_form） (9) 種類ごとの見本の値は真偽の形の kind に false を与え、全部の kind の 1 行の表が読めて kind が一致する（着地済みの e2e の歯 rules_kind_parity_every_kind_has_sample）
