      形。新しい中核の module consult::status（純な関数だけ）に VERB・SEP・DIGEST_HEAD（8）・FIELD_MAX（40）・command・clean・context_percent・render を置く。命令は作業場の絶対 path を引数に渡す（cwd に頼らない）。launch.rs の settings は鍵 statusLine に status_line(l) を置き、audit は設定の statusLine が同じ値でなければ欠けの名 /statusLine を足す。fixture は settings に statusLine の 1 行を足す。歯は段の file crates/tsuzuri-core/tests/cwsts.rs（判断の記録 ADR-32 の決定 (3)・群の main.rs と kfold.rs は書かない）。字は差の file。

      確かめた事（V）。使い捨ての作業場で claude を --restricted と --settings の statusLine で起こし、窓の下に「窓 cw9 ｜ 題 probe ｜ haiku・low ｜ 所見 0 ｜ 束 01234567」が出た（文脈の割合は最初の答えの前で null のため出ない）。

      ほかの行との当たり。行 cs-remote の差の後に当たる（main afe01c84（行 cs-plain-open と cs-acct-mark を置き、29a の cs-read-roots が着地した後）に、このノートの前の行の差を順に当てた木・係 w190a）。口 tz consult statusline は次の行 cs-status-verb が置く。間に起こした窓の状態の 1 行は、口が無いので空のまま（窓は止まらない）。

      実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。

      done と verify の対応。(1) は verify の 1 行目、(2) から (7) は 3 行目（中核の歯の束 teeth3 の cwarg.rs と段の file cwsts.rs）、(8) は 3 行目と 4 行目で測る。clippy は守り。欄 done-teeth は書かない。

      入口の赤。前の行の木（写し drafts/w190a の branch s2-hei の 7cbe7078）に段の file cwsts.rs だけを足した木で、verify の 3 行目の段の file の歯（--test cwsts）は rc 101（module consult::status が無く組めない）。

      試作と噛み。写し drafts/w188a で verify の 2 行目から最後の行まで rc 0。句ごとに 9 の変異（命令の時間・命令に作業場を渡さない・C0 と C1 を落とさない・向きの上書きを落とさない・長さを切らない・範囲を見ない・題を clean しない・束の頭を切らない・設定の検めを外す）を当てて全部 rc 100、対照は rc 0。

