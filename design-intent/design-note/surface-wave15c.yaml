  - n: 3
    type: prose
    title: 行 t-fx-prefix — 契約の歯の見本の裁定 id を台帳の外の接頭辞 fx-c. にする
    body: |
      在りかの main は e055edd（計画 surface-plan 第 0.41 版・同じ歯と snapshot を書いた行 c-pipe-misfit〔便 t3-hub.52.88・着地済み〕と g-policy-face〔便 t3-hub.52.91〕の着地の commit の後）。この節の行の番号はその main の字で、鎖で先に流す行（h-acct-rest・c-dn-unknown・c-dn-edges）が同じ 2 つの file に見本を足すと動くので、替える所は fn と見本の名で done に書いた。
      なぜ。器（scribe2）の要件 FR83 の決まり A（計画 6 節の器の答え）は、追跡される file の中の問い id の形（問いの部分・コロン・UTC の年月日 T 時分 Z・ハイフン・連番）の字のうち、問いの部分が台帳の接頭辞 t3-hub で始まるものを本物の引きとして数え、閉じた問いの notes の字 裁定 id = の行に解けなければ、tsuzuri が vessel 宣言に ruling-check を書いた後の受付と着地で断る。ほかの接頭辞の問い id の形は数えず、断らず、一覧に載せる要も無い。main e055edd の追跡される file の t3-hub の問い id の形の字は 40 種で、35 種は閉じた問いの notes の 裁定 id = の行に在る（起草で台帳を読んで確かめた）。解けない 5 種はどれも契約の歯 contract_form の見本（問いの部分が t3-hub.5 の 3 種と t3-hub.7 と t3-hub.8 の1 種ずつ・どの問いの notes にも無い時刻）で、契約の crate の 2 つの file に 26 か所（rs 14・snapshot 12）在る。同じ字の写しは設計ノート surface の記帳 id の欄の例と、ノート surface-wave12d の行 e-revoke の done と、その導出物にも在る（設計の文書は席が直す・範囲の外）。tsuzuri が ruling-check を宣言するのは、この行の着地の後（計画 6 節）。
      在りか・歯（write-set）。tests/contract_form.rs（1427 行・受付の上限 1500）は頭の doc で接頭辞 contract_form_ の歯の file と名乗り、私的な fn bead（39〜41 行）と fn ruling（43〜45 行）が BeadId::new と RulingId::new で見本の id を作る。見本の裁定 id の字の在りかは、fn ledger_writes（138〜174 行）の AppendNotes の line（142 行）・CloseItem の reason（146 行）・ReopenItem の reason（171 行・取り消す裁定と前の裁定の 2 つ）、fn ledger_item（321〜327 行）の notes（325 行）、fn forms（407 行から）の surface::RulingId の見本の 1 つ目（421 行・RulingId::for_question に bead t3-hub.5 と字 20260926T1437Z と 1 を渡す）・surface::SurfaceState の undelivered（458 行）・surface::SurfaceEvent の RulingRead（473 行）・surface::RulingResponse（503 行）・surface::ItemOutcome の Written と Skipped（529 行と 532 行）・surface::BatchResponse の 1 つ目の項（547 行）、fn contract_form_ledger_item_digest（1280〜1357 行）の期待の字 0874e9bb3b87f545（1288 行）・fnv1a64 に渡す字（1293 行）・changed の notes の 2 つ（1337 行と 1342 行）。fn question_card（330〜344 行）の digest は ledger_item().digest()（342 行）なので、見本の notes が変わると値が変わる。contract_form_snapshot_matches（1110〜1132 行）は fn snapshot_text の字を tests/snapshots/contract_form.json（1343 行）と比べ、違えば今の字を CARGO_TARGET_TMPDIR の contract_form.json に書いて落ちる。snapshot の替わる行は、裁定 id の 3・47・70・97・121・125・139・222・261・266・299 行と、digest の 1155 行（question::QuestionCard）と 1192 行（question::QuestionList）。契約の crate の tests の dir の中身は acctdoc.rs と contract_form.rs と snapshots/contract_form.json の 3 つ。
      在りか・契約の型（書かない）。src/surface.rs の RulingId（18 行）の new は id_shape に字 . - _ とコロンを許し、for_question（28〜30 行）は問いの bead id・コロン・時刻・ハイフン・連番をつなぐ。src/ledger.rs の BeadId の new（16〜20 行）は字 . - _ を許す。LedgerItem の digest（97〜107 行）は id・題・状態・本文・notes をこの順に改行 1 つでつないだ字の fnv1a64（111 行）を 16 字の 16 進の小文字にする。bead fx-c.5 と、fx-c. で始まる裁定 id の形はどの型も通す。
      形。(a) contract_form.rs の見本の裁定 id の字を done の項 1 のとおりに替え、fn forms の surface::RulingId の見本の 1 つ目の bead の字を fx-c.5 にする。行を足さず消さない（受付の上限 1500 の余りを使わない）。(b) contract_form_ledger_item_digest の期待の字と fnv1a64 に渡す字を新しい notes で書き直す（2f890a3dc04a8b5a）。(c) snapshot は fn snapshot_text の今の字を写す（替わるのは裁定 id の 11 行と digest の 2 行だけ）。(d) 新しい歯の file tests/fxpre.rs は私的な const LEDGER（字 t3-hub）と私的な fn minute_tail・ledger_forms・files と 2 つの歯を持ち、標準 library だけを使う（契約の crate の item を使わない・外の依存は足さない）。見本の字は LEDGER から format で組み、file の字に台帳の接頭辞の裁定 id の形を持たない。
      決めた幅（起草の決め）。(e) 新しい問いの部分は字 fx-c. と元の問いの番号（5・7・8）で、時刻と連番は元のまま（どの見本を替えたか辿れる・c は契約の歯）。方針の見本の fx-p.（歯 epolq ほか）と、fx-s. と fx-h. とは重ならない。(f) 見本の bead id の字（t3-hub.5・t3-hub.7・t3-hub.8・t3-hub.9・t3-hub.3・t3-hub ほか）は替えない。FR83 の問い id の形は時刻と連番を要るので、bead id だけの字は数えない。問いの card と束の項の bead と裁定 id の問いの部分が違う字になるが、契約の型と歯は 2 つを突き合わせない。(g) 字 batch とコロンで始まる見本の字（rs の surface::BatchResponse の 1 つと snapshot の 2 か所・policy とコロンで始まる見本は g-policy-face の着地で無くなった）は替えない。FR83 の決まり B で器の宣言の ruling-fixtures に字どおり載せるかは、席が宣言で決める（この行の外）。新しい batch と policy の形の字は足さない。(h) 見張りは器より厳しく、語の途中から始まる台帳の接頭辞の形も数え、契約の crate の tests の dir の全部を読む（後の行 t-cform-split が歯の file を割っても見張りが続く・acctdoc.rs も読む）。ほかの crate の歯の file は読まない。
      着地済みの歯（grep で確かめ、試作で撃った）。contract_form_ の 8 本のうち、contract_form_snapshot_matches は snapshot の字（項 2）を、contract_form_ledger_item_digest は要約値の期待（項 3）を見るので、この行が 2 つの file を一緒に直す。ほかの 6 本は見本の値の往復と argv とid の形と閉じた一覧を見て、裁定 id の字に依らない。中核の歯 qblock_snapshot_carries_ids（tests/qblock.rs）と nsum_snapshot_carries_fields（tests/nsum.rs）は snapshot を読むが、見るのは問いの card の id と blocking と GraphNode の欄で、この行の字は替わらない（write-set に入れない・試作で通った）。試作（main e055edd の写しに当てた木）で verify の 2 行の歯（fxpre 2・contract_form 8）と qblock と nsum の歯が通った。直しを戻すと落ちる歯は、2 つの file を main の字に戻すと fxpre_contract_tests_hold_none（contract_form_ は通る）、snapshot だけ戻すと contract_form_snapshot_matches と fxpre_contract_tests_hold_none、要約値の期待だけ戻すと contract_form_ledger_item_digest、for_question の bead だけ戻すと contract_form_snapshot_matches、fx-c.8 の字を 2 つの file で戻すと fxpre_contract_tests_hold_none、ledger_forms の日付の 8 桁を 7 桁にすると fxpre_scan_counts_ledger_forms。
      測り方・歯。新しい歯は契約の crate の tests/fxpre.rs に置き、名を fxpre_ で始める（名は done の 2 つ）。file は CARGO_MANIFEST_DIR の tests の dir を std::fs::read_dir で下の dir まで読む。
      filter の語（main e055edd の contracts の verify の filter の語 227 を、ほかの語を部分の字として含まない 153 語に畳んだ語と、計画の後の行 g-gz の接頭辞 pgz_）は aaround_・accept_・acchold_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadopt_・cdorm_・cgdom_・cmark_・contract_form_・cround_・csled_・denv_・dnedge_・dnrow_・dnskip_・ecache_・epolq_・flight_・fmark_・fprem_・frame_・fserve_・fstop_・gapspage_・gbnote_・gfix_・gfresh_・ghb_・gjst_・glabel_・gnav_・gpface_・gpill_・gpulse_・graph_・gsum_・gtuck_・gview_・hacols_・harest_・hasplit_・hbconf_・hbmark_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hdchip_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hshist_・hspage_・hsym_・iclose_・ilink_・kcli_・klink_・launch_・lcard_・ledgerblock_・lhome_・lidle_・lresume_・lsnap_・lspark_・lstore_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・parts_・pclosed_・pfold_・pipe_・plimit_・pmisfit_・pmore_・pquest_・pqueue_・project_・ptitle_・punmap_・pwhole_・qblock_・qgate_・qkey_・question_・relay_・rhold_・runsdoc_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・stcli_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_・pgz_ で、新しい歯の名から先頭の fxpre_ を除いた字は、このどれも部分の字として含まない（接頭辞 fxpre_ もどの語も含まない）。
      依存と順。depends は空。同じ contract_form.rs と snapshot を書く行は、計画の 5 節の鎖の c-pipe-misfit（着地済み）→ g-policy-face（着地の commit は main e055edd に在る）→ c-limit-resume（留めの間は飛ばす）→ h-acct-rest → c-dn-unknown → c-dn-edges → この行 → c-pipe-ci → t-cform-split → c-updated → c-abs-time の順で、器は同じ file の行を同時に流さないので、順は便の bead の依存で持つ（この行の便は c-dn-edges の便に依る）。g-policy-face の直し（fn forms の surface::RulingId の見本から for_policy の 1 つを消し、surface::PolicyResponse の方針の id を fx-p.1 の問いの形にした）は main e055edd に在り、この行はその後の字に当てた。まだ流していない h-acct-rest・c-dn-unknown・c-dn-edges が 2 つの file に書くのは LedgerStats・SkippedEdges・EdgeType の見本と snapshot のその値と歯 contract_form_closed_lists の数で、どれも fn ledger_writes・ledger_item・contract_form_ledger_item_digest と、SurfaceState・SurfaceEvent・RulingResponse・ItemOutcome・BatchResponse・RulingId の見本の裁定 id の字を書かない。tsuzuri の vessel 宣言の ruling-check と ruling-fixtures は、席がこの行の着地の後に別の変更で置く。
      範囲の外。設計ノート surface の記帳 id の欄の例と、ノート surface-wave12d の行 e-revoke の done に在る同じ字を直すこと（設計の文書は席の手・導出物は folio derive が書き直す）。vessel 宣言に ruling-check と ruling-fixtures を書くこと。字 batch と字 policy の形の見本の字を替えること。見本の bead id を替えること。ほかの crate の歯の file の見本（面の歯 hruling の見本の 1 つは閉じた問いの本物の裁定 id で解ける）。
      付け替え（第 0.2 版・2026-09-28）。行 t-cform-json と t-cform-split（ノート surface-wave16a・この順）の着地で、契約の歯 tests/contract_form.rs と snapshot tests/snapshots/contract_form.json は契約の型の群ごとの歯の file と snapshot に割られた。この行の見本と歯は群 surface・ledger の tests/cform_surface.rs・tests/cform_ledger.rs と tests/snapshots/surface.json・tests/snapshots/ledger.json に在り、見本の id の組み立て・snapshot の読み比べ・往復・閉じた列の数えの共通の手は tests/common/mod.rs に在る。歯の名（contract_form_ で始まる名）と見本の字と verify の filter は変わらない。この節の上の段落の contract_form.rs と contract_form.json の行の番号と行の数は割る前の字で、同じ見本と歯を群の file の中で探して読む。write-set・verify・done は群の file の字に付け替えた。群の file はほかの群の行と重ならないので、同じ群の行とだけ直列に流す。

