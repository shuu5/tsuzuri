  - n: 3
    type: prose
    title: 行 j-count — 受入 12 条の数え（測りの事実から条ごとの違反の数と report の行）
    body: |
      在りか（main f846d55・計画 surface-plan 第 0.58 版で確かめた）。計画の 9 節の行 j-runner（M）を起草で割った前の行。runner と CDP の口を使う後の行 j-runner（同じノート）の数えの部分で、browser を使わずに歯で撃てる。
      なぜ。要件 NFR1 と規則の行 R-23 は、面が 1280 と 390 の幅ではみ出し 0・重なり 0・横 scroll 0・hover の欠け 0・語彙表に無い見出し 0・最初の画面の散文 300 字以下・page error 0・文の予算の違反 0・id の無い節点 0・URL に残らない切り替え 0・持ち主の逐語の混入 0・外部の配信元からの library 0 を満たし、測定の script が数えるとする。受入 AC9 は、1 画面に 1 字のはみ出しを仕込んだ fixture で違反 1 が出て、現物で 0 になることを red test とし、fixture の置き場を tests/fixtures/surface/accept-12/ とする。傘の行 j（ノート surface-board）の done は 12 条ごとに 1 件仕込んだ fixture で違反 1・現物の全画面で 0・report・面の crate の依存の予算。持ち主の裁定 t3-hub.52.61（計画の 3 節の d33）は、runner を行 i の CDP の口を使い回して外の依存を足さずに作るとした。計画の行 j-runner は xtask の新しい file と fixture と CDP の口の測りの step を 1 行に持つが、12 条の数え・fixture・runner・CDP の口・xtask の入口を合わせると試作で約 1760 行（fixture の JSON の約 690 行を含む）になり M を越えるので、browser に触らない数えと fixture をこの行に割った。
      在りか（書かない・使う）。境界の crate（crates/tsuzuri-boundary・外の依存は足さない決まり・xtask の歯 skeleton_boundary_std_only_and_bin_tz）の src/stage/json.rs は std だけの小さな JSON の読みで、pub fn member（object の字の一番上の段の鍵の値の字）・pub fn items（配列の字の要素の字の列）・pub fn unquote（字の値を字に戻す）・pub fn escape を持つ。src/lib.rs は module の doc と pub mod acct・accthb・cli・hook・server・stage の 6 行。面の語彙表 crates/tsuzuri-surface/vocab.json は english の欄（鍵ごとの label と note）と rephrase の欄（label と plain）を持ち、面の vocab は english を先に引く（同じ鍵が両方に在れば english）。面の見出しは widgets の help の h2 と hs が class hd と data-v に語の鍵を持つ要素で出す（見本 mock v3 の ui.js の checkHeadings と同じ見方）。見本の ui.js の audit（受入条件の自己測定）は見出し・card・一覧・最初の画面の字数（countChars・散文は凡例と tab と button と数と id を除く）・横の溢れを数える。
      形。(a) 新しい src/audit.rs（host の純粋な関数・file も browser も触らない）に pub const RULES（鍵と名の 12 の組）・PROSE_MAX（300）・TITLE_MAX（36）、pub struct Heading（key・text）・Node（id・text）・Switch（label・before・after）・Facts（url・hscroll〔i64〕・overflow・overlap・nocard・headings・first・errors・titles・nodes・switches・text・libraries）、pub fn facts（事実の JSON の object の字を Facts に読む・鍵の欠けと形の違いは鍵の名を含む Err・余る鍵は読み捨てる）・pub fn label・pub fn prose_chars・pub fn count・pub fn head・pub fn line を置く。(b) 条の数え方（count）。overflow・overlap・hover（nocard）・error は列の長さ、hscroll は溢れが 0 より大きければ 1、heading は語彙表の label が出ている字と違う見出しの数、prose は最初の画面の散文の片の字数（文字の字だけ）が 300 を越えれば 1、budget は 36 字を越える題の数と、中黒を 2 つ以上持つか括弧（全角と半角）を入れ子にする散文の片の数の和、nodeid は札の字が節点の id を含まない札の数、url は押す前と押した後の URL が同じ切り替えの数、verbatim は頁の見える字の中の持ち主の逐語の記録の印（字 user と空白と日付と字 T と時と字 :）の数、library は読み先のうち頁と別の origin（scheme と host と port）の字の数。(c) src/lib.rs に pub mod audit と、doc の 1 行（行 j-count で受入 12 条の数えを置く）を足す。doc の字は歯で測らず、この行の差分で持つ。(d) fixture tests/fixtures/surface/accept-12/ に、違反 0 の clean.json（どの条にも違反でない値を持つ・英語の見出しと rephrase の見出し・36 字の題・id を含む札・押すと URL の変わる切り替え・逐語の形でない字 user・相対と同じ origin と data: の読み先）と、clean.json に 1 件だけ仕込んだ 12 の file と、english と rephrase に同じ鍵 pipeline を持つ小さな vocab.json を置く（面の語彙表の変わりに歯が揺れない）。file は起草の script で組んだ JSON（1 字下げ）。試作（main f846d55 の写し）で audit.rs は 277 行、jcount.rs は 181 行、fixture は 14 の file。git diff は 36086 byte（17 file・1140 行足し）。
      決めた幅（起草の決め・席に問う所は notes）。(e) 数えは境界の crate に置く（CDP の口と同じ crate で、表示面の JSON の読みを使い回し、後の行の runner が同じ module で撃つ・xtask に JSON の読みを写さない）。(f) 事実は測りの式（後の行）が返す字で、判定の字数と閾値と origin の比べと語彙表の引きは Rust の側で持つ（歯が browser 無しで撃てる）。(g) 散文の字数は字の種類が文字の字（char の is_alphabetic）だけを数え、数字・記号・約物・空白を数えない（見本の countChars の近い読み・時刻の字 Z は数える）。(h) 文の予算は画面に見えるものだけを数える（題の 36 字と、最初の画面の散文の片の中黒の 3 つ以上のつなぎと括弧の入れ子）。「?」の注釈・hover の card の 4 行・経験者向けの 1 行は画面の読み込みの後に出ないので、面の crate の着地済みの歯（語彙表の予算を見る uword_budget_r19・smore_ ほか）と card の字の切り（hover の clip）が持つ。(i) 逐語の混入は、持ち主の逐語の記録の id の形（user と日付と時）の字だけを数える（逐語そのものは台帳の控えにしか無く、画面の字と照らす元を持たないため・席に問う）。
      着地済みの歯。src/lib.rs を読む着地済みの歯は無い（grep で確かめた）。xtask の歯 skeleton_boundary_std_only_and_bin_tz は境界の Cargo.toml の依存が member だけであることを見る（この行は Cargo.toml を書かない）。fixture の dir tests/fixtures/surface の下の file を数える歯は無い。
      測り方。新しい歯は境界の crate の tests/jcount.rs に置き、名を jcount_ で始める（7 本・jcount_rules_in_order・jcount_clean_is_zero・jcount_each_planted_counts_one・jcount_edges・jcount_rule_readings・jcount_facts_refuse_bad_shape・jcount_report_lines）。新しい歯の名は main f846d55 の contracts の verify の filter の語 243 のどれも部分の字として含まず、接頭辞 jcount_ もどの語にも含まれない。試作で jcount の 7 本と境界の crate の clippy が通り、2 行を当てた写しで xtask の check が通った。噛み: 散文の上限で違反にすると jcount_edges が、語彙表を rephrase から引くと jcount_clean_is_zero と jcount_rule_readings（ほかの jcount の歯も）が、// の形を外と見ないか、中黒 3 つからを違反にするか、逐語の印に時のコロンを求めないと jcount_rule_readings が、札の id を見ないと jcount_each_planted_counts_one が、横の溢れ 0 を違反にすると jcount_clean_is_zero と jcount_edges が、題の上限を 37 字にすると jcount_rules_in_order と jcount_each_planted_counts_one が落ちる。
      依存と順。depends は空。書く file は新しい 16 の file と境界の src/lib.rs だけ。src/lib.rs は計画の 5 節の鎖（boundary/main.rs と lib.rs と hook/mod.rs）の計画だけの行 f-deliver と k-parity も書く見込みで、この行を先に流す。いま走る・待つ便の write-set とは重ならない。
      範囲の外。測りの式と runner と xtask の入口（後の行 j-runner）・現物の全画面で 0 にする直し（report を見て起こす後の行）・面の crate の code と語彙表・画面の読み込みの後に出る注釈と card の予算。
  - n: 4
    type: prose
    title: 行 j-runner — 受入 12 条の runner（全画面 × 2 幅 × 2 mode・CDP の決まった測りの式・xtask の accept）
    body: |
      在りか（main f846d55・計画 surface-plan 第 0.58 版で確かめた）。計画の 9 節の行 j-runner を割った後の行。同じノートの前の行 j-count が置く境界の module audit（Facts と count と head と line）に runner を足し、audit.rs の字は j-count の着地の後の字に当てる。
      なぜ。受入 12 条（要件 NFR1・規則の行 R-23）は全画面 × 2 幅 × 2 mode で測る。持ち主の裁定 t3-hub.52.61（計画の 3 節の d33・案 A）は、runner を行 i の CDP の口（i-3 の std の websocket と session・i-4 の server の headless の起動）を使い回して外の依存を足さずに作り、runner だけが使う測りの step を boundary/stage/cdp.rs に足すとした（任意の JavaScript の口は持たないまま・見積りの T6）。
      在りか・CDP の口（write-set）。src/stage/cdp.rs の doc は、任意の式を撃つ口を持たない（見積りの T6・条 P-12.1）・Runtime.evaluate は Dom の決まった式だけ・Session は method と params を直に受ける口を持たない、と書く。pub const DOM_EXPRESSION・LOAD_EVENT・HISTORY、pub enum Command（navigate・viewport・reload・click・type・key・scroll・wait・screenshot・dom・console）、pub fn steps（Command を歩の列に写す・Console は Runtime.enable と Log.enable・Viewport は Emulation の 2 つ・Click は Input の 3 つ）、pub fn message、pub struct Session（open は websocket・attach は行 i-4 の pipe・url は Page.getNavigationHistory・run は歩を撃ち応答を返す・events は貯めた event・close・私的な call と await_event）。src/stage/relay.rs（書かない）の pub const CHROME（google-chrome）と pub struct Eyes の pub fn open（Chrome の program と base の dir と URL と待ちの上限を受け、base の下の 0700 の profile の dir で headless と pipe の口の Chrome を起こし、最初の頁の target に付いた Session を返す・drop で止めて dir を消す）。src/stage/tunnel.rs（書かない）の pub fn user_dir（tz の口が temp の dir の下に作る自分だけの dir）。
      在りか・歯（write-set）。tests/stcdp.rs の stage_cdp_no_script_port は cdp.rs の pub fn の名の列を 8 つと等しさで見て、Command の歩の Runtime.evaluate が Dom の params だけと、ws.rs・json.rs・cdp.rs に禁じた字が無いことを見る。stage_cdp_own_names_clean は歯の数を 16 と見る。歯の中の偽の Chrome（unix socket の上の websocket・Runtime.evaluate には DOM の字の値を返す）は、受けた message の字を順に返す。tests/strelay.rs の relay_source_guards は cdp.rs の字 enum Link と Page.getNavigationHistory を 1 度ずつと見て、tests/stcli.rs の stcli_source_guards は cdp.rs を含む stage の file が字 CLAUDECODE を持たないことを見る（どちらも書かない）。xtask（write-set）の src/main.rs は check と surface-build の 2 つの task と、歯の定数 DIRECT_DEPS（member ごとの直接依存の名・xtask は空）と歯 skeleton_direct_deps_match_list・skeleton_lock_inside_is_members を持ち、xtask/Cargo.toml の [dependencies] は空。
      形（CDP の口）。(a) cdp.rs に pub const MEASURE_EXPRESSION（include_str で stage/measure.js の字）と、Session の pub fn measure（Runtime.evaluate を 1 度撃ち返った字の値を返す・値が無ければ Err）を足し、doc の T6 の文を、Runtime.evaluate は Dom の決まった式と受入の測りの決まった式だけ（撃てるのは steps の列と measure だけ）と直す。Command に枝を足さない（tz の口の cli.rs と歯を書かない）。測りの式は DevTools の console の命令 getEventListeners を使うので includeCommandLineAPI を真にする。(b) 新しい stage/measure.js は頁を書き換えない 1 つの式（即時の関数）で、見える要素から、中身が箱を越える要素（overflow-x が visible で scrollWidth が clientWidth より 1 px を越えて大きい）・重なる a と button と chip と見出しと題の組（互いを含まない箱が縦横 1 px を越えて重なる）・節点の頁への a と graph の節点のうち自分と祖先に pointerenter の受け手が無いもの・見出し（h1〜h6・class hd・nav の a）の data-v と「?」の印を除いた字・最初の画面の散文の片（凡例と tab と button と数と id と題を除く見える字の片）・題（data-t）・節点の札（id と字）・切り替え（class seg の button・role tab・aria-pressed・data-tab）の画面の中の真ん中・body の innerText・script と stylesheet と preload の読み先・横の溢れを集め、JSON の字で返す。(c) stcdp.rs の名の列に measure を足し、禁じた字を見る file に measure.js を足し、歯 stage_cdp_measure_one_fixed_expression を足して歯の数を 17 にする。
      形（runner）。(d) audit.rs に pub const WIDTHS・MODES・SCREENS と、pub trait Page（run・measure・url・events・Session が実装する・歯は偽の頁で撃つ）、pub fn errors・pub fn case・pub fn sweep を足す（値は done (4)〜(7)）。(e) 新しい xtask/src/accept.rs は入口（cargo run -q -p xtask -- accept --url <board の URL> [--chrome <program>] [--out <path>]）で、旗を読み（--url は要る・同じ旗は 1 度・知らない旗は rc 2）、語彙表 crates/tsuzuri-surface/vocab.json を読み、tz の口と同じ user_dir の下で Eyes::open（既定の program は CHROME）を撃ち、URL の query の前までを board の URL として sweep を撃ち、report を --out か target/accept/report.txt に書き、違反の計を標準誤りに出して、違反が在れば rc 1・無ければ 0・撃てなければ 2 を返す。main.rs に mod accept と task accept の腕と usage の字を足し、DIRECT_DEPS の xtask の名を tsuzuri-boundary にする。xtask/Cargo.toml に workspace の中の path の依存 tsuzuri-boundary を 1 本足す（外の依存は 0 本・Cargo.lock は xtask の package に依存の行が 3 行足されるだけ）。入口の字は歯で測らず、この行の差分で持つ（試作で --url の無い撃ちが rc 2・撃てない Chrome の program で rc 2 を確かめた）。試作（main f846d55 の写しに前の行を当てた写し）で audit.rs は 156 行足し、measure.js は 58 行、jrun.rs は 271 行、accept.rs は 80 行。git diff は 33442 byte（9 file・623 行足し 7 行消し）。
      決めた幅（起草の決め・席に問う所は notes）。(f) runner の頁の口は trait Page にし、歯は偽の頁で撃つ（本物の Chrome を起こさない・偽の Chrome の pipe の場を歯に写さない）。CDP の message の形は stcdp.rs の着地済みの偽の Chrome で 1 本撃つ。(g) 全画面は、project board の頁と地図の 6 つの面と account board の 3 つの tab と節点の頁（その幅と mode の地図の圧縮の面の最初の節点）。問いの頁の中の問い 1 つの頁と、account board の中の窓は数えない。画面の一覧の抜けは面の crate の src の字と照らす歯で見る。(h) hover の欠けは節点の頁への a と graph の節点だけを見る（圧縮された cell と記号だけの要素の選び方は面の DOM に印が無いので後の行）。(i) URL に残らない切り替えは画面の中に見える切り替えを 1 つずつ押し、押した後の URL が押す前と同じなら数える（押すたびに頁へ戻る）。(j) 1 つの画面の page error は頁へ移ってから測るまでの event（Runtime.exceptionThrown と Log の error）だけを数える。(k) runner は server を起こさない（board の URL を旗で受ける・現物の server は席が tz surface serve で起こす）。
      着地済みの歯。relay_source_guards（strelay.rs）は cdp.rs の enum Link と Page.getNavigationHistory の数を、stcli_source_guards（stcli.rs）は stage の file の字 CLAUDECODE を見る（この行はどちらの字も足さない）。stcdp の歯 stage_cdp_steps_table・stage_cdp_session_sequence ほかは Command の歩と Session の撃ちを見る（Command は変えない）。xtask の skeleton_ の歯は DIRECT_DEPS と Cargo.lock を見る（xtask の名だけを直す）。jcount の歯は audit の数えを見る（この行は数えを変えない）。
      測り方。新しい歯は境界の crate の tests/jrun.rs に置き、名を jrun_ で始める（5 本・jrun_screens_cover_surface・jrun_case_order_and_readings・jrun_errors_from_events・jrun_sweep_all_cases・jrun_measure_expression_text）と、stcdp.rs の stage_cdp_measure_one_fixed_expression。新しい歯の名は main f846d55 の contracts の verify の filter の語 243 のどれも部分の字として含まず（stcdp の歯は自分の接頭辞 stage_cdp_ のほか）、接頭辞 jrun_ もどの語にも含まれない。試作で jrun・stcdp・jcount・strelay・stcli の歯と xtask の歯と境界と xtask の clippy が通り、2 行を当てた写しで xtask の check が通った。噛み: 押した切り替えを測りの字に足すか、page error を始めからの event で数えるか、狭い幅の高さを 800 にすると jrun_case_order_and_readings が、節点の頁を足さないか id の # を %XX にしないと jrun_sweep_all_cases が、地図の面を 1 つ抜くと jrun_screens_cover_surface が、測りに console の命令の口を付けないと stage_cdp_measure_one_fixed_expression が、測りの式に外への送りを足すと jrun_measure_expression_text が、warning を page error にすると jrun_errors_from_events が、cdp.rs に測りの外の pub fn を足すと stage_cdp_no_script_port が落ちる。
      依存と順。depends は j-count（同じノート・audit.rs を書く）。計画の依存 i-4 は着地済み。書く file の重なり: xtask/src/main.rs と xtask/Cargo.toml と Cargo.lock は計画だけの行 g-gz も書く見込みで、この行を先に流す（g-gz は DIRECT_DEPS の xtask の名に tsuzuri-boundary が在る字に当てる）。cdp.rs と stcdp.rs を書くほかの行は無い（i-3 と i-4 は着地済み）。置き場だけの = の重なり: strelay.rs はいま起草中の表示面の行 i-7 と i-board-ports も = で持ち、stcli.rs は i-7 が書くので、この行と同時に流さない（順はどちらが先でもよい・この行は 2 つの歯の期待の字を変えない）。
      範囲の外。現物の全画面で 12 条を 0 にする直し（report を見て起こす後の行）・server の起動・問い 1 つの頁と窓の測り・圧縮された cell と記号だけの要素の hover の欠け・面の crate の code と語彙表・Command と tz の口。

