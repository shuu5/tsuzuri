    rows:
      - id: g-gz
        what: "xtask の直接依存に miniz_oxide を 1 本足し（既定の feature の with-alloc・license は MIT OR Zlib OR Apache-2.0・依存の adler2 は 0BSD OR MIT OR Apache-2.0 でどちらも R-2 の一覧に在る）、surface-build が trunk の後に dist の wasm・js・css ごとに gzip の写し（名に .gz を足した file・枠と CRC-32 は xtask に自分で書く）を置く（index.html は小さく no-cache なので写さない）。server は標準 library のまま、要求の頭 Accept-Encoding に gzip（q=0 でない）が在り、元の file と同じ置き場に .gz が在れば、その中身を Content-Encoding gzip で返し、圧縮できる file には Vary Accept-Encoding を付ける（e-cache の immutable と組む）。Accept-Encoding の無い要求と .gz の無い file は今と同じ字を返す。xtask の歯の表 DIRECT_DEPS の xtask の行を空から miniz_oxide 1 本にし、表の上の注に行 g-gz と裁定 id を足す（直さなければ skeleton_direct_deps_match_list が落ちる）。Cargo.lock に外の包みが 2 つ（miniz_oxide・adler2）増える。規則の行 R-2 の 1 PR 1 本の追加に当たり、増分 check の実測差と surface-build の圧縮の時間を便の記録に書く。"
