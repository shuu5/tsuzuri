      段 3（波のノート）: 並べてよい行（5 節）をまとめて波のノート surface-wave<N> に置く。章の上限は規則の行 R-26（40 章 以下）。波のノートは小さく保ち、1 つのノートは 10 行までにする（審査と点検の単位を小さくするため）。置くのは設計の worktree と commit の道具（folio の schema と check と derive を回す）で行い、main の checkout では file を編集しない。
      段 4（器）: 行ごとに契約 bead を置き（pointer は design = contracts/<ノート>.toml#<行 id>）、受付の前の点検の後に流す。審査で差し戻されたら審査の材料を読み、足りない材料を節に足して流し直す。
      段 5（着地の後）: 器の着地の event を確かめてから xtask の check・push・bead を閉じる・台帳の push。server を組み直して実物の画面を見る。
