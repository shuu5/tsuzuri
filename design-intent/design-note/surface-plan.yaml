      g-ledger-home（S）: ホームの台帳の block の一覧の段（Tier::List）を残し、閉じた項目を出さない（open の項目と epic を残す・閉じた epic を出すかは起草で決める）。全件は地図で見る（今の圧縮の面と g-map-tree の台帳の全体図）。file = surface/project/ledger.rs と、一覧の段の中身を pin する着地済みの歯（ledgerblock・見込み）。依存 = なし。拠る = t3-hub.52.31・要件 FR13。
      g-map-tree（M）: 地図に設計の木と台帳の木の 2 つの面を足す（口 /api/graph の電文から面の純粋な関数で組む・親子の辺の型の表を 1 か所に置く・閉じた項目は既定で畳む・各項目は節点の頁への link と節点の card）。設計 = 帯 → 条 → 規範文・要件 → 受入基準・規則の行・判断の記録・設計ノート → 行。台帳 = epic → task → run・問い → 裁定・memo。面の閉じた集合を 4 から 6 にし、tab の語の鍵を語彙に足す。file = surface/mapview/tree.rs（新）・surface/mapview/mod.rs・surface/project/map.rs・crates/tsuzuri-surface/vocab.json と、面の数を pin する着地済みの歯（mapview・見込み）。依存 = なし（設計ノートの行の枝は c-dn-rows の後に埋まる）。拠る = t3-hub.52.32・t3-hub.52.31（全件は地図）・要件 FR5。
      e-seat-hb（S）: project board 用の口（例 POST /api/seat/heartbeat・名は起草で決める）を 1 口 1 file で足す（本文は向きだけ・server は自分の anchor の project の席だけを、account の口の受付と同じ順〔doctor で target を引き、器の seat heartbeat を 1 回撃つ〕で止める・戻す・守りは同じ origin の guarded・account board の口は今のまま）。file = boundary/server/routes の新しい file・boundary/accthb.rs（受付を anchor で呼べる形に割る・見込み）・contract/account.rs か contract/seat.rs（見込み）。依存 = なし。拠る = t3-hub.52.29・要件 FR12・受入 AC10。
      g-seat-hb（M・書き直し）: 席の card から切り替えを組む関数と、project board の席の block の停止の切り替えの button と確かめの段（account board の heartbeat の純粋な関数と段の DOM を使い回し、送り先は e-seat-hb の口・撃つ字に --state-dir を足すかは見本に揃える）。file = surface/project/seat.rs・surface/project_dom/seat.rs・surface/account/heartbeat.rs（送り先の path を引数にする・見込み）と、g-seat-split の後で 2 つの seat の file を最初に書く行なら g-seat-split の歯 tests/sesplit.rs（値で固める歯 sesplit_texts_kept を消す）。依存 = e-seat-hb（g-seat-split の着地の後に流す）。拠る = 見本・t3-hub.52.29・要件 FR12・受入 AC10。
      h-acct-order（S）: account board の口座を並べる全部の表（HOME の口座 × 窓・群の候補ほか）で、口座を名の自然な順（名の中の数を数として比べる）に並べ、退役の口座を出さない（移動の履歴のように過去を示す所は出す）。並べと絞りは面の純粋な関数で行い、電文と中核は変えない。file = surface/account/home.rs・surface/account/session.rs（見込み・口座を並べる表の file は起草で確かめる）と、口座の順と退役の語を pin する着地済みの歯（accthome ほか・見込み）。依存 = なし。拠る = t3-hub.53.14・要件 FR12。
      書き直しを待つ 1 行（f-stop が着地して hook の dir と plugin/hooks/hooks.json が在るので、t3-hub.55.2 の絞りで書き直して後の波に置く）。
      f-gate（M）: 問いの起票の門 tz hook question-gate（1 段・4 種・hub を除く・30 越えは まだ分からない・止めるときは処分の無い id を全部名指す・要約値が古ければ止める）。file = core/gate.rs（新）・core/lib.rs・boundary/hook/mod.rs・boundary/hook/question_gate.rs（新）・boundary/lib.rs・boundary/main.rs・tests/fixtures/guard の fixture（新）。依存 = srs の直し（FR4 と AC6・main に在る）と f-stop の着地（hook の dir）。門は器の runner に写った plugin でも効く（runner の見張りとして望ましい）。拠る = t3-hub.55.2・要件 FR4・受入 AC6。
      project board（傘 g）の続き。
      g-card-adopt-b（S）: 問いの card の題とこれまでの決定の行に節点の card。file = surface/project/ask.rs・surface/project/askpage.rs。依存 = g-card-node。拠る = 見本・要件 FR14。
      g-card-adopt-c（S）: 台帳の epic の行と抜けの検査の名指しに節点の card。file = surface/project/ledger.rs・surface/project/gaps.rs。依存 = g-card-node・g-ledger-card（epic の行の link）。拠る = 見本・要件 FR14。
      g-map-tips（S）: グラフの切れ目と表の cell の経験者の注釈、SRS と run の 0 件の帯の card。file = surface/mapview/graph.rs か graph/dom.rs・surface/mapview/table.rs・surface/mapview/compact.rs。依存 = g-tip-expert・g-card-node。拠る = 見本・要件 FR14。
      g-tick-adopt（S）: 問いの経過・pipeline の札の経過・次の一手の質問の経過を 1 秒の時計で書き直し、問いの card の投稿の時刻の chip に経験者だけの注釈（見本の字 posted_at と投稿の時刻・g-tip-expert の expert_tip）を付ける（席の since は c-seat-tick が持つ）。file = surface/project/ask.rs・surface/project/pipeline.rs・surface/project/next.rs。依存 = g-tip-expert・g-next-rows（次の一手の質問の行の経過・g-tick は着地済み）。拠る = 見本・要件 NFR2・FR14。
      c-seat-tick（M）: 席の card に tick の経過と状態の語、面に tick healthy と秒と席の since の毎秒の書き直し。file = contract/seat.rs・core/seat.rs・surface/project/seat.rs（host の値）・surface/project_dom/seat.rs（DOM）と、g-seat-split の後で 2 つの seat の file を最初に書く行なら g-seat-split の歯 tests/sesplit.rs（2 つの file を値で固める歯 sesplit_texts_kept を消す）。依存 = g-seat-split。拠る = 見本・要件 FR12。
      c-seat-grace（M）: 席の card に移動の猶予の終わり・待ち・断り・逼迫の窓、面の状態の帯に残り秒と待ちと断りと逼迫の行。file = contract/seat.rs・core/seat.rs・boundary/server/seat.rs・surface/project/seat.rs・surface/project_dom/seat.rs。依存 = g-seat-split。拠る = 見本・t3-hub.53.8（逼迫の行）・要件 FR12・規則の行 R-22。
      c-seat-group（M）: 席の card に群の project と登録の口座と一致、群の chip に card。file = contract/seat.rs・core/seat.rs・surface/project/seat.rs・surface/project_dom/seat.rs。依存 = g-seat-split。拠る = 見本・要件 FR12。
      g-seat-thr（S）: 席の block の窓の棒に閾値（cap）の印。file = surface/project/seat.rs・surface/project_dom/seat.rs（窓の棒の DOM）。依存 = c-seat-grace（席の card の窓の閾値）。拠る = t3-hub.53.8・規則の行 R-22。
      c-dn-rows（M）: 設計ノートの行を節点に、design と ruled_by の辺を組む。file = core/graph/build.rs。依存 = folio の索引に設計ノートの行と ruled_by の材料が載ること（6 節・tsuzuri は設計文書の YAML を走査しない）。拠る = 要件 FR2・判断の記録 ADR-7 決定 (2)。
      c-updated（S）: 節点に更新の時刻、一覧の面に更新の列と並べ方。file = contract/graph.rs・core/graph/build.rs・surface/mapview/list.rs。依存 = c-summary-design。拠る = 見本・要件 FR5。
      g-dn-group（S）: 地図の圧縮の面の design-note の帯をノートごとの見出しに分ける。file = surface/mapview/compact.rs。依存 = c-dn-rows・g-map-tips。拠る = 見本・要件 FR5。
      c-g3g7（M）: 裁定の節点と ruled_by の辺を材料に不変条件 g-3 と g-7 を数える（受入 AC5 の前半）。file = core/graph/check.rs。依存 = c-dn-rows。拠る = 席の決め（rc 2 のまま）・要件 FR3・受入 AC5。
      c-g9（M）: 本文で名指した id が欄か辺にも在るかを数える（不変条件 g-9・規則の行 R-17 と同じ見方・2 周の実測の後に落とす側へ）。file = core/graph/check.rs。依存 = なし（材料の本文の出所は c-dn-rows と同じく folio の索引を待つ）。拠る = 席の決め・要件 FR3。
      c-unref-kinds（M）: 未反映の一覧の裁定（処分の宣言の無い裁定）と要望の 2 種を数える。file = core/ledger/unreflected.rs（見込み）。依存 = c-g3g7。拠る = 要件 FR13・受入 AC12。
      c-next-effect（S）: 次の一手の発効待ちを判じる。file = core/next_step.rs。依存 = c-unref-kinds。拠る = 要件 FR11・規則の行 R-24。
      g-seatpill（M）: header の席の pill と席の card（home の頁のほか）。file = surface/board.rs・surface/frame.rs と header の snapshot。依存 = なし。拠る = 見本・要件 FR12・FR14。
      g-back-note（S）: 窓を閉じられないときの戻るの注記と、開いた窓の一覧の閉じの印。file = surface/board.rs。依存 = なし。拠る = 見本・要件 FR1。
      g-coach（M）: 初心者の最初の案内（home の 3 段・済み印を browser に残す・?coach=1 で出し直す）。file = surface/widgets/coach.rs（新）・surface/widgets/mod.rs・surface/board.rs。依存 = g-mode-store（保存の module surface/store.rs の get と set）。拠る = t3-hub.52.16・見本・要件 FR1。
      g-jst（M）: 面が人に見せる時刻を全部日本時間（UTC に 9 時間を足す固定）にし、字の印を Z から JST の印に替え、pipeline の Landed（今日）の今日を日本の日にする（記録の id の中の UTC は変えず、問いの頁の決定の link は id を読んで 9 時間を足して出す・時差は view の定数 1 つに置き、browser の時間帯を読まない純粋な関数のまま）。file = surface/view.rs・surface/project/seat.rs（割った後の host の部分）・surface/project/pipeline.rs・surface/project/askpage.rs・surface/project/ask.rs・surface/project/ledger.rs と、UTC の字を pin する着地済みの歯 9 本（hruling・lcard・topbar・hcard・accthome・seatblock・board_min・sxaxis・seataxis）。依存 = なし（書く file が多いので第 7 波と第 8 波の着地の後に流す・5 節）。拠る = t3-hub.52.28・要件 NFR2。
      g-policy-all（S）: 問いの頁の block「全体への指示」の範囲の切り替え（この論点と全体の 2 つの button）を外し、方針の逐語はつねに範囲 全体 で口 /api/policy へ送る（server の口が問いの id の範囲を受けるのを残すかは起草で決める・画面からは送らない）。file = surface/project/policy.rs と、policy.rs を pin する着地済みの歯。依存 = なし（第 8 波と重ならなければ第 8 波に足してよい）。拠る = t3-hub.1（裁定 id = user 2026-09-28T01:2xZ）・要件 FR6。
      account board（傘 h）の続き。
      h-cards-nx（S）: HOME の次の一手の並びの行と群の枠の project の chip に card（見本の nx と gproj・組み手は h-cards-proj のものを使う）。file = surface/account/home.rs。依存 = h-cards-proj。拠る = 見本・要件 FR14。
      h-cards-led（S）: 台帳の表の project の欄に card（見本の led・組み手は h-cards-proj のものを使う）。file = surface/account/ledger.rs。依存 = h-cards-proj。拠る = 見本・要件 FR14。
      h-sort-hist（S）: 並べ方の押しを履歴の 1 歩にする（見本の pushState）。file = surface/account/session.rs・surface/account/ledger.rs・surface/account/projects.rs。依存 = なし。拠る = 席の決め（見本どおり）・要件 FR1・NFR1。
      h-win-store（S）: 開いた窓の一覧をその browser に残し、ほかの tab の変化を storage の event で受ける（見本の tz-wins）。file = surface/account/windows.rs（保存は surface/store.rs の get と set を呼ぶ・着地済みの歯 acctwin の保存の字の見張りは、windows.rs が保存の口の字を書かなければ直さずに通る・見込み）。依存 = g-mode-store（保存の module surface/store.rs）。拠る = t3-hub.52.16・要件 FR1。
      h-thr-home（M）: HOME の窓の棒に閾値の印、群の枠に逼迫の窓の段と hot の印と候補の断りの理由、移動の段に逼迫と断りの行。file = surface/account/home.rs と着地済みの歯 accthome（逼迫の印が無いことの見張りを直す）。依存 = c-acct-thr。拠る = t3-hub.53.8・見本・要件 FR12。model の窓の印は器の答えで決着した: 逼迫の印は器の GroupPressureNotified の行そのもの（window が model の行は役割の model の窓が閾値を越えたことで、役割の model は器の rules 行 seat.model.<役>）で、c-acct-thr が window・used・cap・sent を欄のまま写すので、面は式を持たずに電文の notices の Pressure の行から印を描く。
      e-acct-qopen（M）: 各 anchor の台帳の open の問いの数を project の行の決定待ちとして電文に載せる（読むだけ）。file = contract/account.rs・core/account/project.rs・boundary/acct.rs・tests/fixtures/account/acct-doc.json。依存 = なし。拠る = t3-hub.53.9・要件 FR13。
      e-acct-unref（M）: 各 anchor の台帳と design-intent の未反映の数を project の行に載せる（読むだけ・読めない種類は まだ分からない）。file = contract/account.rs・core/account/project.rs・boundary/acct.rs と fixture。依存 = なし。拠る = t3-hub.53.9・要件 FR13。
      h-acct-cols（S）: 各 project の表の決定待ちと未反映の列、台帳の表の未反映の列を「―」から数にし、h-cards-proj の run の数の card の決定待ちの値を数にして注の行（― = 質問の台帳を読んでいない）を外し、群の card に閾値の行（c-acct-thr の電文の窓ごとの閾値の写し）を足す。file = surface/account/projects.rs・surface/account/ledger.rs。依存 = e-acct-qopen・e-acct-unref・c-acct-thr。拠る = t3-hub.53.9・t3-hub.53.8・要件 FR13・FR12。
      c-dormant（S）: 電文の休止中の席の列を埋める（今は常に空）。file = core/account/project.rs（見込み）。依存 = なし。拠る = t3-hub.53.10・要件 FR12。休止の閾値の出所（器の rules 行か doctor の値か）は起草で確かめる。
      h-dormant（S）: header に休止中の chip と card。file = surface/account/board.rs。依存 = c-dormant。拠る = t3-hub.53.10・見本・要件 FR12。
      c-acct-spark（M）: 口座の行に 7 日の使用量の列と最後に測った時刻（器の event log の AllowanceMeasured の写し）。file = contract/account.rs・core/account/host.rs・boundary/acct.rs と fixture。依存 = なし。拠る = t3-hub.53.10・要件 FR12。
      h-acct-spark（S）: HOME の口座 × 窓の表に spark の列と測った時刻の列。file = surface/account/home.rs。依存 = c-acct-spark。拠る = t3-hub.53.10・見本・要件 FR12。
      面の server（傘 e）の続き。
      e-deliver-busy は決着して第 6 波の行 f-mark・f-stop・f-mark-serve に入れ、3 行とも着地した（2 節）。見張りの揺れの直し e-watch-steady は第 7 波、project board の heartbeat の口 e-seat-hb は第 8 波。
      e-signal（S）: 問いの合図から SSE まで 200 ミリ秒の速い道。file = boundary/server/events.rs。依存 = f-gate（合図を誰が書くか）。拠る = 要件 NFR2・規則の行 R-21。
      e-revoke（M）: POST の取り消しの口（新しい裁定が前の id を名指して問いを open に戻す）。file = boundary/server/routes の新しい file・contract/ledger.rs（台帳への書きの enum）・boundary/server/ruling.rs。依存 = なし。拠る = 要件 FR7・受入 AC3。持ち主待ち: 見本に置き場の無い取り消しの button をどこに置くか（問いはまだ置いていない）。
      e-approval-event（M）: 裁定ごとの逐語つきの承認の event を器の event log に書く。file = boundary/server/ruling.rs。依存 = なし。拠る = 要件 FR9・受入 AC1。器待ち: どの器の口が event を書くか。
      席の hook（傘 f）の続き。
      f-gate-install（S）: 門を plugin/hooks/hooks.json の PreToolUse（matcher Bash）に足す（f-stop の Stop の隣）。file = plugin/hooks/hooks.json。依存 = f-gate・f-stop。拠る = t3-hub.55.3・器の答え（hook の入れ先 23:3xZ）。
      f-deliver（M）: 配達の hook が裁定の逐語を注入する（f-stop と同じ印を使い、次の tool の呼びでも拾う）。file = boundary/hook/deliver.rs（新）・boundary/hook/mod.rs・boundary/main.rs。依存 = f-stop・f-gate。拠る = 要件 FR9。
      f-undelivered（M）: 裁定から 2 分で席の受けが無ければ面に「席に届いていない」。file = server の読み（見込み）と surface/project/ask.rs・surface/project/next.rs。依存 = f-mark（席の受けの材料は f-stop と f-mark-serve が置く配達済みの印・器の seat deliver の rc は使わない）。拠る = 要件 FR9・規則の行 R-21。
      tz の口（傘 k）の続き。
      k-parity（M）: folio の 11 の口を同じ名の tz の subcommand にし、終了 code と出力を合わせ、tz inject と folio という名の binary が無いことを歯で見る。file = boundary/cli の新しい file・boundary/main.rs（見込み）。依存 = folio の code の持ち込み（判断の記録 ADR-4）。拠る = 要件 FR17・受入 AC14・判断の記録 ADR-8。
      持ち主の決め待ちの傘（行の割りは決めの後）。
      i-1〜i-4（S か M）: 端末の一覧の読み・起動の引数・CDP の命令の列・届かない端末の配信。file = boundary/stage の新しい file。拠る = 要件 FR16・受入 AC13。持ち主待ち: 端末の宣言・ssh・Chrome の専用の profile。
      j-runner（M）: 受入 12 条の runner（全画面 × 2 幅 × 2 mode・12 条ごとに 1 件仕込んだ fixture・report）。file = xtask の新しい file と tests の fixture。依存 = g と h の残りの多く。拠る = 要件 NFR1・受入 AC9・規則の行 R-23。持ち主待ち: 外の依存（headless の browser か CDP か、行 i の使い回しか）。
  - n: 5
    type: prose
    title: 並べ方（同じ file を書く行は直列・上限に近い file）
    body: |
      並べる決まり: 書く file が互いに重ならず、依存が着地していて、持ち主と器と folio2 の答えを待たない行は同じ波で並べて走る。同じ file を書く行は同時に流さない（器も同じ file の行を直列にする）。下の並びは今の見込みの順で、待ちの解けた行から先に流してよい。
      contract/seat.rs と core/seat.rs: c-seat-tick → c-seat-grace → c-seat-group（e-seat-hb が契約の型を contract/seat.rs に置くなら e-seat-hb を先に）。
      surface/project/seat.rs と surface/project_dom/seat.rs と歯 tests/sesplit.rs: g-seat-split → g-seat-hb → g-jst → c-seat-tick → c-seat-grace → c-seat-group → g-seat-thr（g-seat-more は着地済み・g-jst は host の部分だけ・歯 sesplit_texts_kept は g-seat-split の後で 2 つの file を最初に書く行が消す〔今の見込みは g-seat-hb〕・e-seat-hb は並べて走れる）。歯 steady・seataxis・smore: g-seat-split（seataxis は後に g-jst も直す）。
      contract/graph.rs と core/graph/build.rs: c-summary-design → c-summary-ledger → c-dn-rows → c-updated（c-summary-design は着地済み・c-summary-ledger は第 8 波で core/graph/build.rs だけ・c-dn-rows は folio の索引待ち）。
      core/graph/check.rs: c-g3g7 → c-g9。core/ledger/unreflected.rs と core/next_step.rs: c-next-stall → g-next-rows（電文に足すときだけ）→ c-unref-kinds → c-next-effect。
      core/account/project.rs: c-limit-pipe → c-acct-thr → e-acct-qopen → e-acct-unref → c-dormant。
      contract/account.rs と boundary/acct.rs と tests/fixtures/account/acct-doc.json: h-board-url → c-acct-thr → e-acct-qopen → e-acct-unref → c-acct-spark（e-seat-hb が契約の型を contract/account.rs に置くなら c-acct-thr の後）。core/account/host.rs: c-acct-thr → c-acct-spark。boundary/accthb.rs: e-seat-hb。
      surface/project/ask.rs: g-ask-around → c-q-blocking → g-jst → g-card-adopt-b → g-tick-adopt → f-undelivered。surface/project/askpage.rs: g-hist-ruling → g-jst → g-card-adopt-b。
      surface/project/pipeline.rs: g-card-adopt-a → g-pipe-fold → g-jst → g-tick-adopt。surface/project/next.rs: g-card-adopt-a → c-next-stall → g-next-rows → g-tick-adopt → f-undelivered（c-next-stall は next.rs に測れていないの箱を足す）。
      surface/project/ledger.rs: g-ledger-card → g-ledger-home → g-jst → g-card-adopt-c。surface/project/gaps.rs: g-tip-expert → g-card-adopt-c。
      surface/widgets/help.rs: g-help-sym → g-tip-expert。surface/widgets/mod.rs: g-card-node → g-coach。surface/widgets/nodecard.rs: g-card-node → g-card-around → g-summary（g-card-adopt-a〔第 7 波〕と g-card-graph は置き場だけの = で持つ）。surface/widgets/hover.rs と surface/project/nodearound.rs: g-card-around（g-card-adopt-a と g-card-graph は hover.rs を置き場だけで持つ）。
      surface/mapview/compact.rs: g-card-node → g-map-tips → g-dn-group。surface/mapview/list.rs: g-card-node → g-summary → c-updated。surface/project/node.rs: g-title → g-summary。surface/mapview/graph.rs と graph/dom.rs: g-card-graph → g-map-tips。surface/mapview/mod.rs と surface/project/map.rs: g-card-around（mod.rs を置き場だけ）→ g-map-tree。crates/tsuzuri-surface/vocab.json: g-unref-word → g-map-tree。
      surface/board.rs: g-title → g-mode-store → g-seatpill → g-back-note → g-coach。surface/account/board.rs: g-mode-store → h-dormant。surface/lib.rs と crates/tsuzuri-surface/Cargo.toml: g-mode-store（第 7 波で書くのはこの行だけ）。surface/store.rs: g-mode-store → h-win-store・g-coach（後の 2 行が store.rs を書くなら直列）。
      surface/account/session.rs: h-sess-axis → h-cards-sess（h-cards-proj の着地の後）→ h-acct-order（書くとき）→ h-sort-hist。surface/account/projects.rs: h-cards-proj → h-sort-hist → h-acct-cols。surface/account/ledger.rs: h-cards-led → h-sort-hist → h-acct-cols。
      surface/account/windows.rs と歯 acctwin: h-board-url → h-win-store。surface/account/home.rs と歯 accthome: h-acct-order → g-jst（歯 accthome だけ）→ h-thr-home → h-cards-nx → h-acct-spark。surface/account/heartbeat.rs: g-seat-hb。
      boundary/main.rs と boundary/lib.rs と boundary/hook/mod.rs: f-stop → f-gate → f-deliver → k-parity。boundary/server/ruling.rs: f-mark-serve → e-revoke → e-approval-event。core/lib.rs: f-mark → f-gate。plugin/hooks/hooks.json: f-stop → f-gate-install。boundary/server/events.rs: e-watch-steady → e-signal。歯 tests/server_read.rs: e-watch-steady（c-next-stall は server_read を書かない・起草で確かめた）。
      着地済みの歯の file も、期待を直す行が 2 つ在れば同じく直列にする（例: 歯 acctpcore と server_acct は c-acct-thr → e-acct-qopen → e-acct-unref → c-acct-spark の順に直す見込み。UTC の字を pin する 9 本は g-jst がまとめて直し、同じ歯を先に直す行が在ればその後に流す。歯 contract_form と snapshot の c-summary-design → c-q-blocking は着地で満たされた）。
      上限に近い file（受付の上限は 1 file 1500 行・流す前に行数と大きさの余白の和を確かめ、越えるなら先に割る行を置く）: surface/project/ledger.rs・surface/mapview/graph.rs・surface/account/projects.rs・surface/account/home.rs・surface/project/seat.rs。project/seat.rs は後に M の行が続くので、g-seat-split（第 7 波）で DOM を src/project_dom/seat.rs へ path の属性で割る（割った後の余白は seat.rs 約 841 行・project_dom/seat.rs 約 1174 行・直した steady_details_use_fold_record は src/project_dom の同じ名の file を block の file に足して見るので、後で割る block も同じ形で置ける）。account/projects.rs は h-cards-proj の起草で M の余白の内と確かめた（後の h-sort-hist と h-acct-cols を足しても内の見込み）。account/home.rs は h-acct-order と h-thr-home を流す前に確かめる。mapview/graph.rs は着地済みの歯 gnav_dom_moved_out が 1150 行以下と見るので余白が小さい（g-card-graph は graph/dom.rs だけを書く・g-map-tips が graph.rs に足すなら起草で確かめる）。surface/project の下は block の dir で、file を足すと build.rs が block に数えるので、割った中身の置き場は block の dir の外にする。
      第 6 波（f-mark・f-stop・f-mark-serve・c-summary-design・c-summary-wire）は着地した。第 7 波 = g-card-adopt-a・g-tip-expert・g-seat-split・g-mode-store・h-cards-proj・h-cards-sess・c-acct-thr・c-q-blocking・e-watch-steady（ノート surface-wave7・h-cards-sess は h-cards-proj の後）。第 8 波（起草中）= c-next-stall・g-next-rows・g-pipe-fold・g-unref-word・g-card-around・g-card-graph・g-summary・c-summary-ledger・g-ledger-home・g-map-tree・e-seat-hb・g-seat-hb・h-acct-order（2 つのノート・g-pipe-fold は g-card-adopt-a の後・g-seat-hb は g-seat-split の後・c-next-stall は server_read を書かないので e-watch-steady と並べてよい）。g-jst は第 7 波と第 8 波の着地の後に、次の波の頭に置く（書く file と直す歯が多いため）。f-gate は f-stop が着地したので書き直して後の波に置く。1 つのノートは 10 行まで（7 節）。
  - n: 6
    type: prose
    title: 他の席を待つもの
    body: |
      folio2: folio graph --print --summary（JSON Lines・欄 id・kind・file・line・title・plain・eng・無ければ null・eng は shall・text・what・decision の最初、条は最初の規範文、受入基準は題の全文）。folio2 の要件 FR14 の字の変更に持ち主の承認が 1 回要り、folio2 が自分の問いとまとめて問う。c-summary-design と c-summary-wire はこれを読んで写す形で着地した（第 6 波）。g-summary と c-summary-ledger は第 8 波、c-updated は後。
      器（scribe2）の要件 FR50（着地の終端）: 列車の先端でない便が ci の測れない終わりで止まり bead が閉じない欠陥の直しが効くまで、先端の CI が success で自分の sha が祖先なら席が手で閉じる（道具 close-unmeasurable の見張り）。直しが効いたら見張りを外す。
      器（scribe2）の答え（2026-09-27T23:0xZ・決着）: 器は裁定を queue しない。seat deliver は待ちで入力欄が空の席にだけ 1 回送り、考え中なら型付きの理由で断る（器の FR79・ADR-0077）。考え中の席へは消費側（tsuzuri）の停止の hook が拾う（ADR-0077 CTX2・CSQ-N3）。再送は要らない。board の「届いていない」は hook の配達済みの印で決める。→ 行 f-stop。f-stop の着地までは席が台帳から裁定を読む。
      器（scribe2）の答え（2026-09-27T23:3xZ・決着）: 停止の hook と門の hook の入れ先は、tsuzuri の repo の根に追跡される plugin/（.claude-plugin/plugin.json と hooks/hooks.json）。scribe2 seat が起こす席は --plugin-dir で読む。答えの「runner には載らない」は誤りで、器は便ごとに worktree の plugin を runner の plugin の dir に写す（scribe2 24aaa5a の pipe/spawn.rs の copy_plugin・席が確かめ器に伝えた・lens には載らない）。そこで停止の hook は repo が git の worktree なら黙り、門の hook は runner でも効く前提で書く。f-stop が Stop を、f-gate-install が門の PreToolUse を同じ hooks.json に足す（裁定 t3-hub.55.3・門の着地の後）。器の Idle の打刻が hook の続けの間に古くなる件と、同じ anchor に席が 2 つ在る件は器の memo s2-07l.723 に在る。
      器（scribe2）の答え（2026-09-28T00:0xZ・決着）: seat deliver の --ruling は 1 回に id 1 つ（64 byte まで・英数と . - _ :）。束の id（batch:…）も形を通るので、束は束の id で 1 度だけ送る（行 f-mark-serve）。束の 2 つ目の配達は、1 つ目の注入で席が考え中になり断られた（2026-09-27T23:57Z の実物）。
      器（scribe2）の答え（2026-09-28・決着）: 群の移動の断りの event（GroupMoveRefused）が持つ理由は語 no-candidate だけで、候補ごとの門の結果はどこにも残らない（候補ごとの結果を doctor の群の行に足す話は器の memo s2-07l.725・着地したら写す行を起こす）。逼迫の印は event GroupPressureNotified の行そのもので、窓と使用率と閾値（window・used・cap）を持つ。役割の model は器の rules 行 seat.model.<役> から読む。→ 行 c-acct-thr（写すだけ）と h-thr-home（知らせの行から描き、式を持たない）。席と器の runner の役を hook に知らせる環境変数は器の memo s2-07l.723 の候補（着地すれば、停止の hook が worktree かどうかで runner を見分ける今の形を替えられる見込み）。
      器（scribe2）にまだ問うこと: f-undelivered の席の受けとする event・e-approval-event の event を書く口。
      文書の運用の強制の 5 段（判断の記録 ADR-14）: 段 1（床の形は folio2・実在は器）・段 2（folio2 の鍵の行と計画の索引の生成・tsuzuri は鍵の行で加わる）・段 3（器）・段 4（器と folio2）・段 5（器）。各席の判断の記録の id と着地の順を受けたらここに書き、着地した段から加わる。folio2 の分は bead f2-648.267・判断の記録 folio2 ADR-31（改訂 c・folio2 の要件 v1.53 と合わせ folio2 の持ち主の承認待ち・条 P-12.1）。順は 渡し A（段 1 の床の形・全部の repo に効く）→ 渡し B（段 2・計画のノートの規則の行〔仮の名 plan-note〕と、行の索引 row-index・大きさと書く file を持つ行の計画 row-plan・決定の表 decision-table）→ 渡し C（段 4 の folio の分・folio check --emit-rulings で design-intent が引く裁定 id を書き出す）。tsuzuri は渡し B の着地の後に、この計画を 1 つの commit で新しい形へ移す。器の分は memo s2-07l.722（器の判断の記録の番号は着地で付く）。順は publish-guard（器の FR80）の着地の後に、器の判断の記録 1 本 → 器の要件の改訂 → 段 5 → 段 1 → 段 4（doctor の行と tick の警報 → dispatch の断り → 着地の比べ）→ 段 3（folio2 が床の終了の約束を決めた後）。
      持ち主にまだ問うこと（台帳の問いはまだ置いていない・行を起草する前に 1 問ずつ置く）: e-revoke（取り消しの button の置き場）・j-runner（外の依存）・i（端末の宣言・ssh・Chrome の profile）。g-seat-hb と c-summary-ledger は裁定が付いた（3 節の t3-hub.52.29 と t3-hub.52.27）。
      folio2 にまだ問うこと: 索引に設計ノートの契約表の行と、承認欄と規則の行の裁定の欄から導く ruled_by の材料を載せるか（行 c-dn-rows・c-g3g7・c-g9 の材料・tsuzuri は設計文書の YAML を走査しない）。
      folio の code の持ち込み（判断の記録 ADR-4・制約 CON2 の出口）: k-parity の前提。
      表示面（傘の行 i）: 下調べの後、行の割りを別に起草している（端末の宣言の置き場・行の案・持ち主への問い）。起草を受けたら 4 節の i の行と、持ち主にまだ問うことの i を直す。
      project board の重さ: 口ごとの遅れと描画を測っている（2026-09-28）。結果を受けたら性能の行を 4 節に足す（閉じた見張り t3-hub.53.2 の、負荷の時の台帳の読みの上限もここで扱う）。
  - n: 7
    type: prose
    title: 運び方（計画 → 波のノート → 器）と、この文書を直す時
    body: |
      段 1（計画）: 行はまずこの文書の 4 節に 1 行で足す（id・大きさ・何を・書く file・依存・拠る裁定）。持ち主の決めが要る行は、台帳に問いを置き（board の質問の頁）、裁定が付くまで起草しない。
      段 2（起草）: 席の作業場で行の契約の字と節を起草する（作法は 3 節）。行ごとに事前の点検の agent を撃ち、design-intent の写しで folio check と folio derive の --write と --check を回して合格と差分 0 を見る。
      段 3（波のノート）: 並べてよい行（5 節）をまとめて波のノート surface-wave<N> に置く。章の上限は規則の行 R-26（40 章 以下）。波のノートは小さく保ち、1 つのノートは 10 行までにする（審査と点検の単位を小さくするため）。置くのは設計の worktree と commit の道具（folio の schema と check と derive を回す）で行い、main の checkout では file を編集しない。
      段 4（器）: 行ごとに契約 bead を置き（pointer は design = contracts/<ノート>.toml#<行 id>）、受付の前の点検の後に流す。審査で差し戻されたら審査の材料を読み、足りない材料を節に足して流し直す。
      段 5（着地の後）: 器の着地の event を確かめてから xtask の check・push・bead を閉じる・台帳の push。server を組み直して実物の画面を見る。
      この文書を直す時: 持ち主の裁定が付いた時（3 節と、効く行の 4 節）・着地の束の後（2 節の現在地と、着地した行を 4 節から外す）・新しい行を足す時（4 節が先・5 節の順も）・他の席の答えが来た時（6 節と効く行）。直すたびに meta の version を上げ、generated をその日にする。
      発効の後の直し: 3 節の決定と 4 節の行の足し引きは持ち主の裁定か席の決めの出所を書いて直す。持ち主の裁定の逐語はこの文書に写さず、裁定 id だけを書く。
