と account の block）が c-seat-tick・c-seat-group・c-seat-grace・c-limit-resume ほかと重なるので、それらの後の最後に置く。 性能の続き（ノート surface-wave23b の 18〜23 行目）の書く file の順はノートの depends（c-tick-word と e-held-design → e-held-seat → e-held-acct → e-ledger-lazy → c-acct-parse → e-held-marks〔25 行目〕）で持ち、着地済みの行の後に流す: core/seat.rs は c-park-acct（着地済み）→ c-tick-word。boundary/server/mod.rs は e-stage-target（着地済み）→ e-held-design（pub mod held）→ e-held-seat（表を Seats へ）→ e-held-acct（表を Acct へ）→ e-ledger-lazy（Others を先に組み with_watched）。boundary/acct.rs と歯 server_acct は a-lean・e-hb-on-mark・c-abs-seat・c-park-acct（着地済み・c-park-acct は歯を置き場だけの =）→ e-held-acct → e-ledger-lazy → c-acct-parse → e-held-marks（歯 server_acct は置き場だけの =）。boundary/server/seat.rs と歯 server_seat は e-hb-on-mark（着地済み）→ e-held-seat → e-held-marks（歯 server_seat は置き場だけの =）。boundary/server/held.rs は e-held-design → e-held-marks。boundary/server/others.rs は c-g3-extern（着地済み）→ e-ledger-lazy。boundary/server/events.rs・ledger.rs・form.rs は c-misfit-pair・e-hb-on-mark（着地済み）→ e-ledger-lazy。core/account/project.rs・host.rs・next_step.rs は c-park-acct（着地済み）→ c-acct-parse。新しい歯 eheld は e-held-design → e-held-seat → e-held-acct → e-held-marks の順に書く。
