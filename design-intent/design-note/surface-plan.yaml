      器（scribe2）の memo の判定（器の memo s2-07l.734・§ は docs/design/ledger-form.md の新しい §・器の持ち主の裁定から）: memo は label intake:memo の bead で、repo ごとの dispatch の周が判じ、判定が変わった時だけ event MemoJudged を出す（昇格条件は description の節の閉じた 5 形の引き金・常設の memo は bd の状態 pinned で state=standing の 1 行）。閾値の案（memo.triage_interval_h・memo.triage_per_round）は器の裁定待ち。§ が着地して field の名が決まるまで行 g-pipe-memo は起草しない（器の頼み）。着地の時に t3-hub.1 と t3-hub.29 を pinned へ移す。
      folio2 の答え（2026-09-28・folio2 の bead f2-648.270）: 渡し B も C も設計ノートの行を folio graph に載せない。folio2 が判断の記録を書いてから載せる（tsuzuri は形〔種類の名・id = meta.id#行 id・行 → 要件の辺・裁定 id は節点の値〕を送った）。行 c-dn-rows・c-g3g7・c-g9 はその着地を待つ（tsuzuri は設計文書の YAML を走査しない）。
      folio の code の持ち込み（判断の記録 ADR-4・制約 CON2 の出口）: k-parity の前提。
      器（scribe2）の答え（2026-09-28・決着・表示面）: tsuzuri は host の面の表 [[device]] を自前の読み手で直に読む（S2-1・key の集合は閉じる〔必須 name・ssh・chrome・os、任意 display・ime-env・profile-dir〕・器は知らない key の面を丸ごと断るので tsuzuri は key を足さない・読む前に scribe2 validate --state-dir の rc 0 を確かめるのは i-5）。display は X の DISPLAY としてだけ読み、Wayland の端末は器が display-env を足すまで範囲の外（S2-2・器の memo s2-07l.726・2026-09-28 に着地した・閉じた key に足すのは行 i-1b）。読むのは自分の anchor の state dir の host.toml だけで、tsuzuri の席は host.toml を書かない（S2-3）。profile-dir は器では任意のまま、表示面では無い行を断る（S2-4）。スマホは [[device]] の外（S2-5）。層 A の書きの口（持ち主が PC を足す口）は器に置く方向で器の memo s2-07l.727（P3・形は未定・器の推奨は [[device]] を host 全体の 1 つの面へ移し口はその 1 file だけを書く形・器の ADR-0076 の部分の置き換えなので器の持ち主の裁定から・時期は board の設定の画面の行 i-8 に合わせる）。それまで層 A は器の席が運ぶ。→ 行 i-1・i-5・i-8。
