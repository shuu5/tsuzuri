        text: "案 B。開発中の app の上では click と入力もしてよく、board の origin の上では見せるだけにして click・入力・key の命令を歯で断る（T7）。任意の JavaScript を撃つ口は持たない（T6）。効果: ADR-15 の決定 (7)・行 i-5 の守りが確定。"
