  note: 設計ノート surface-board（傘の行 g・h・i・j・k）と surface-base（傘の行 e・f）の子の行を、どの波で、どの順で流すかを 1 か所で持つ計画。これまで見本と本番の差の調べ・行の割り・順・席の決めは追跡されない作業場の file にしか無く、全体の統制がとれないという持ち主の指摘（2026-09-27）を受けて置く。持ち主が board で承認したら status を effective にし、承認欄に裁定 id を書く。第 0.11 版（2026-09-28）は、持ち主の裁定 t3-hub.52.38〜.52.40 の後の性能の行 14 本を 3 節（席の決め）と 4 節と 5 節に足し、第 9 波（ノート surface-wave9 = e-hold・g-keyed・g-strip・g-reads・g-policy-all の 5 行）の組みと、表示面の行 i-5 の tz stage open の守り（席の決め）を書き、第 8 波と表示面の i-1 の着地を 2 節に写して着地した行を 4 節から外した。第 0.12 版（2026-09-28）は、第 9 波の 6 行目 c-pipe-closed と、ノート surface-wavef の行 f-gate の書き直しを足し、持ち主の裁定 t3-hub.52.53・.52.60・.52.61 と器の答え（RulingReceived・行 ad・memo の判定・display-env）を写し、後の行（e-sess-closed・g-closed-mark・g-pipe-memo・c-graph-fold・g-graph-fold・e-batch-partial・i-1b）を 4 節に足し、i-3 の着地と disk の満ちを 2 節に書いた。第 0.13 版（2026-09-28）は、4 節の起草中の 2 行 c-graph-fold と g-graph-fold を、ノート surface-wave10a に置いた行の字（大きさ・書く file・接頭辞・便の bead の依存）に替えて 5 節に順の鎖を足し、後の行 t-fstop-tidy を足し、着地した第 9 波の 4 行（e-hold・g-keyed・g-strip・g-reads）を 4 節から外し、第 9 波の g-policy-all と e-hold の着地と surface-wavef の v0.2 と退役した target/ の掃除を 2 節に書いた。第 0.14 版（2026-09-28）は、folio2 の渡し B（folio f300177）の着地を受けて、3 節の持ち主の裁定の行を判断の表（33 行）へ、4 節の行を計画だけの行（67 行）へ移し、行の索引（130 行・folio derive が契約表から書く）を置き、契約表に在る 4 行（f-gate・c-graph-fold・g-graph-fold・c-pipe-closed）を計画だけの行から外し、規則の表に名札の行 R-27 を足した（拠りは裁定 t3-hub.57.1:20260927T2357Z-1 の案 A の 2 段目）。第 0.15 版（2026-09-28）は、器の binary の 8dd964f への入れ替え（display-env を読む）を受けて行 i-1b をノート surface-wavei2 に置いて計画だけの行から外し、i-2 の依存に i-1b を足し、第 9 波の c-pipe-closed と第 10 波 a の 2 行と f-gate の着地を 2 節と 5 節に書いた。第 0.16 版（2026-09-28）は、席が 2026-09-28 に実物の画面で見つけた欠陥 2 つ（1 byte も送らない接続にも境界の server が 400 bad-request を書き、Chrome が後の頁の移りでその接続を使い回して board に素の bad-request の頁が出る件・地図のグラフの組の箱と塊の箱が内部の id を題に出す件）の行 e-idle-close（S）と g-graph-label（S）を、計画だけの行を経ずにノート surface-wave10b に置き（3 節の席の決め）、5 節の鎖に 2 行を入れた（行の索引は folio derive が書く）。第 0.17 版（2026-09-28）は、folio の pin を渡し C の 1e6ab0f に上げ、第 11 波の account board の card の 2 行（h-cards-nx・h-cards-led）をノート surface-wave11d に置いて計画だけの行から外した。第 0.18 版（2026-09-28）は、第 11 波の g-fresh（面の古さの印と 60 秒の諦め）と g-closed-mark（閉じた札の印）をノート surface-wave11a に置いて計画だけの行から外し、g-fresh が view.rs・frame.rs・vocab.json を書かないことに合わせて 5 節の鎖を直した。第 0.19 版（2026-09-28）は、第 11 波の server と中核の 3 行（e-cache・c-pipe-questioned・e-sess-closed）をノート surface-wave11b に置いて計画だけの行から外し、core/account/project.rs と中核の歯 pclosed の鎖に 2 行を入れた。第 0.20 版（2026-09-28）は、account board の行 h-next-unknown（bead t3-hub.53.19・判じなかった次の一手を測れていないの字で出す）をノート surface-wave11f に置いて計画だけの行から外した。第 0.21 版（2026-09-28）は、folio の pin を folio2 の判断の記録 ADR-32（索引に設計ノートの契約表の行を節点として足す）の 6467915 に上げ、folio schema --write で様式の design-note/schema.yaml と graph.yaml を書き直した。第 0.22 版（2026-09-28）は、表示面の行 i-2（起動の引数と tunnel と、窓を 1 回だけ起こすこと）をノート surface-wavei3 に置いて計画だけの行から外し、起草で出た問いの席の決め（頁の窓の無い Chrome と同時の撃ちの錠は行 i-5・Windows は範囲の外）を 3 節と i-5 の字に書いた。第 0.23 版（2026-09-28）は、席が実物の event log で見つけた pipeline の板の欠陥の行 c-pipe-unmapped（器の段 Failed と Stopped の走行を札にし、器が worktree を畳んだ記帳 retired では段を決めない）をノート surface-wave11e に置き（3 節の席の決め・欠陥の直し）、5 節の鎖に入れた。走行の無い札の決まりの行 c-pipe-queue は、bead の種類を問う持ち主の問い t3-hub.60 と t3-hub.52.71 の答えまで起草を止める。第 0.24 版（2026-09-28）は、第 12 波 e の 2 行（t-fstop-tidy = 歯 fstop_worktree_stays_quiet が作る .git を drop の守りで消す・e-batch-partial = まとめて承認の束が途中で落ちた時に、書いた行・閉じていない行・書いていない行を名指して残りだけを送り直せる）をノート surface-wave12e に置いて計画だけの行から外し、起草で見つけた同じ形の後始末の漏れ（tests/qgate.rs）の行 t-qgate-tidy を 9 節に足した。第 0.25 版（2026-09-28）は、持ち主の裁定 t3-hub.60 と t3-hub.52.71（判断の記録 ADR-16・bead の種類を器と揃え、方針は閉じた問いに記帳し、板は控えの列と 4 列と要修正の行）を判断の表に写し、行 c-pipe-queue・c-pipe-misfit・g-pipe-misfit・e-policy-q を 9 節に足し、g-pipe-memo の字と 6 節の常設の控えの字を直した。第 0.26 版（2026-09-28）は、account board の表の数の欄の行 h-acct-cols（電文の台帳の指標 LedgerStats を読む）をノート surface-wave12b に置き、同じ事を電文に別の欄で足す計画の行 e-acct-qopen と e-acct-unref を 3 節の席の決めで退け、上限に近くなる surface/account/projects.rs を先に割る行 h-acct-split と、見本の表の残りの行 h-acct-rest を 9 節に足した。第 0.27 版（2026-09-28）は、表示面の行 i-4（届かない端末と席の目・席の目の Chrome は pipe）と i-5（tz stage の口の配線と守り・頁の target を作るのは tz stage open だけ・錠と tunnel の dir は口座ごとの 0700 の dir）をノート surface-wavei4 に置いて計画だけの行から外し、5 節の stage の鎖と surface/account/projects.rs の鎖を直し、ほかの project の board の上でも click と入力を断る行 i-board-ports を 9 節に足した。第 0.28 版（2026-09-28）は、答えた決定の取り消しの行 e-revoke（持ち主の裁定 t3-hub.52.60 の案 A・POST の取り消しの口・決定の頁の頭に理由の欄と取り消すの button・開き直しだけが落ちた時は同じ button で開き直しだけを撃ち直す）をノート surface-wave12d に置いて計画だけの行から外した。第 0.29 版（2026-09-28）は、project board の上端の 3 行（g-pulse = 読みの途中の脈・g-seatpill = header の席の pill と席の card・g-back-note = 窓を閉じられない時の戻るの注記と閉じの印）をノート surface-wave12c に置いて計画だけの行から外し、5 節の鎖（lib.rs・fresh.rs・frame.rs・歯 hspage）を直し、g-nav をその後に置き、起草の問いから行 c-limit-resume と g-back-origin を足し、h-win-store の範囲に account board を読み直した後の窓の閉じの印を足した。第 0.30 版（2026-09-28）は、台帳の読みを減らす 3 行（e-marks = 変化の印を dolt の store の中身にし〔印の字は第 0.32 版の行 e-mark-meta が直す〕、印の無い周期の読み直しを 60 秒に・e-snap = GET の口は bd を撃たず見張りの最後の読みを返す・e-idle = SSE の受け手が 0 人の間は印が動いた時だけ読む）をノート surface-wave12f に置いた（器の席が 2026-09-28 に測った、bd の読みの排他の錠と tz の画面の server の 5 秒ごとの読みの衝突の直し）。a-lean の what を store の印に直し、FR8 の premises の検査の行 f-premises を 9 節に足した。第 0.31 版（2026-09-28）は、方針の欄の記帳先の行 e-policy-q（方針 1 つにつき根の直下の閉じた問いを作り、本文は器の要件 FR81 の (a) の 4 行と effect operation）をノート surface-wave12h に置いて計画だけの行から外し、5 節に契約の ledger.rs と歯 contract_form と snapshot の鎖を足し、c-pipe-misfit を e-policy-q の後に置き、起草の問いから行 g-policy-face を 9 節に足し、方針の id と器の要件 FR83 の問いを 6 節に足した。第 0.32 版（2026-09-28）は、着地した行 e-marks（857d2b2）の印を器の席の測りの形（.beads の metadata.json が名指す db の manifest の字と、manifest が名指す file の長さ）に直す行 e-mark-meta をノート surface-wave12f v0.2 に足して e-snap をその後に置き、ノート surface-wave12h を v0.2（行 e-policy-q がこれまでの決定の一覧と数から方針の問いを外す分を持つ）にして g-policy-face を面の断りの字と契約の doc だけに縮め、器の答え（FR83 の 3 つの決まり）を 6 節に写し、fixture の id の接頭辞を替える行 t-fx-prefix を 9 節に足した。第 0.33 版（2026-09-28）は、pipeline の板の走行の無い札（Queued と Blocked）を設計の参照を持つ契約の bead だけにする行 c-pipe-queue を 1 行のノート surface-wave12g（v0.1）に置いて計画だけの行から外した（c-pipe-misfit と g-pipe-misfit は同じノートの v0.2 で足す・c-pipe-misfit は器の scribe2 doctor の ledger-form の行を台帳の見張りの読みの周で写す形に直して起草中＝判断の記録 ADR-16 の決定 (6)）。第 0.34 版（2026-09-28）は、小さな 2 行（t-qgate-tidy = 着地済みの歯 qgate の作業場の後始末・e-seat-hbmark = 席の card の変化の印に heartbeat-off を足し、印が動いたら 5 秒の持ち回しを解く）をノート surface-wave13e に置いて計画だけの行から外し、同じ 5 秒の古さを account board の口座の読みから除く行 e-acct-hbmark を 9 節に足した。c-dormant と h-dormant の休止の境の 12 時間は器の rules 行に置かず、tsuzuri の規則の表の行（R-28・見本 mock v3 の承認）に置く（器の席の答え・器は休止を読まない）。第 0.35 版（2026-09-28）は、folio の pin 6467915 の索引の新しい種類「設計ノートの行」を中核が読めず地図の設計の出所がまるごと読めなかった欠陥（持ち主の指摘）の直しを兼ねる行 c-dn-rows をノート surface-wave13d に置いて計画だけの行から外し、索引の辺 req と depends を組む行 c-dn-edges と、知らない種類の節点と辺をその 1 つだけ飛ばして数える行 c-dn-unknown を 9 節に足し、c-g3g7 の材料（節点ごとの裁定 id）を folio2 に頼む字を 6 節に足した。第 0.36 版（2026-09-28）は、board が人に見せる時刻を日本時間にする行 g-jst（持ち主の方針の欄の指示〔2026-09-28〕と裁定 t3-hub.52.28・2 つの board の時刻は同じ関数から出るので 1 行・時差は 1 か所・印は JST・Landed の今日と 24 時間の目盛は日本の日と時）をノート surface-wave13a に置いて計画だけの行から外し、g-jst が書かない ask.rs と ledger.rs の鎖から外し、UTC の字を pin する着地済みの歯の数を 12 file の 26 本に直した。第 0.37 版（2026-09-28）は、持ち主の指示（チャット 2026-09-28T11:4xZ・逐語は t3-hub.1）を受けて、着地して CI を待つ走行を板に CI 中として出す行 c-pipe-ci を 9 節に足し、issue の一生（要望から memo・契約・走行・着地・CI・閉じ・反映まで）の道筋を器と整理し直して板を一生を追う面に作り直す件を控え t3-hub.63 として 6 節に書いた。第 0.38 版（2026-09-28）は、account board の 3 行（e-acct-hbmark = 口座の読みの 5 秒の持ち回しを印の変化で解く・c-dormant = 登録の全部の席の state.jsonl の最後の行から休止の席の一覧を電文に出す・h-dormant = header の休止中の chip と card）をノート surface-wave13f に置いて計画だけの行から外し、休止の境を規則の表の行 R-28（12 時間・見本 mock v3 の承認）に置いた。第 0.39 版（2026-09-28）は、pipeline の板の 2 行（c-pipe-misfit = 器の doctor の台帳の形の行が名指す形の崩れた bead の一覧を電文の欄 misfits に持つ・g-pipe-misfit = 板の 4 列の下の要修正の行）をノート surface-wave12g の第 0.2 版に置いて計画だけの行から外し、6 節の folio2 の 2 つの段落を今の字（設計ノートの行は folio2 の判断の記録 ADR-32 で節点になった・裁定 id の欄は節点に足さず check --emit-rulings の行を結ぶ）に直した。第 0.40 版（2026-09-28）は、ノート surface-wave13b（f-premises と g-policy-face・f-premises は持ち主の裁定 t3-hub.64 の案 B で要件書 v0.15 の FR8 に拠る）・surface-wave13c（h-acct-split・h-sort-hist・h-acct-rest）・surface-wave13h（c-limit-resume）を置いて 6 行を計画だけの行から外し、g-back-origin を外し（直しは着地済みの g-back-note に入っていた）、契約の歯 contract_form と snapshot の順を 1 本の鎖にそろえ、計画だけの行 g-kind-label・g-next-acct-origin・c-misfit-pair・t-cform-split を足した。第 0.41 版（2026-09-28）は、ノート surface-wave14d（c-dn-unknown と c-dn-edges・c-dn-edges は判断の記録 ADR-7 の決定 (2) の辺の字を改める持ち主の問い t3-hub.65 の答えを待つ）を置いて 2 行を計画だけの行から外し、c-limit-resume を留め（器の限度の判定は 100% と席の model の窓で、器が seat tick status に再開の時刻の欄を足す・その後にノート surface-wave13h を第 0.2 版にする）、t-cform-split を急がない所（c-dn-edges の後）へ移した（契約の歯の file は 1428 行前後で上限 1500 まで余る）。第 0.42 版（2026-09-28）は、ノート surface-wave15c（t-fx-prefix・fixture の裁定 id の台帳の接頭辞を fx- に替える）を置いて計画だけの行から外し、t-cform-split の what の後の行の字を今の鎖に合わせ、計画だけの行 t-allow-runsdoc（着地済みの歯の allow を外す・憲法の条 P-22.2）と g-attach-acct（account board の私的な attach_some を hover.rs の共通の fn に寄せる）を足した。第 0.43 版（2026-09-28）は、ノート surface-wave15a（c-seat-tick・器の doctor の席の行の tick= と tick-last の ts を写し、tick の経過の秒だけを毎秒書き直す）を置いて計画だけの行から外し、c-seat-grace を器の欄を写す行に改めた（器の席の答え 2026-09-28・器が seat tick status に move= と grace_left= と reopens= を足す・それまで代わりの計算を作らない・account board の move_left の起点の欠陥もこの行で直す）。第 0.44 版（2026-09-28）は、ノート surface-wave15a を第 0.2 版にし（節の依存と順と範囲の外を器の欄を待つ形に合わせた・契約表の行は同じ）、契約と中核と面の seat.rs の鎖を c-seat-tick → c-seat-group → c-seat-grace → c-limit-resume の順にした（器の欄を待つ 2 行を後ろへ）。第 0.45 版（2026-09-28）は、ノート surface-wave15b（c-acct-spark・口座の行に 7 日の使用の線と HostTexts の欄 events → h-acct-spark・口座 × 窓の表の後ろの 2 列と鍵 spark の字を 7 日に）を置いて計画だけの行から外し、core/account と boundary/acct.rs と面の home.rs と歯 accthome・acctpcore・server_acct の鎖を着地済みの行を着地済みと書いて直した（待ちの解けた方を先にの字は消し、順は便の bead の依存で持つ）。第 0.46 版（2026-09-28）は、持ち主が器の席の問い 2〜4 に推奨どおりに答えたのを受け（2026-09-28T13:14Z・issue の一生の整理・記録は器の側）、計画だけの行 e-multi-ask（1 つの面で登録した複数の project の問いに答える・問いの id の頭で repo と席を選ぶ）を足し、g-pipe-memo の材料を器の段の出力の memo の段に改めた。第 0.47 版（2026-09-28）は、ノート surface-wave13i（c-pipe-ci・着地の後に CI を待つ走行を板に CI 中として出す・CI の読み 7 つ・判定は中核の 1 つの関数 ci_reading に閉じ、器の段の出力が来たらその中身だけを替える）を置いて計画だけの行から外した。あわせて持ち主の指示（2026-09-28）で行 t-cform-split を前に出すと決め（契約の歯と snapshot を型の群ごとに割って、契約の歯の鎖を群ごとの鎖に分ける・起草中）、置く版で 5 節の鎖を書き直す。第 0.48 版（2026-09-28）は、ノート surface-wave15d（c-g3g7・folio の check --emit-rulings の書き出しを節点に結んで ruled_by の辺を組み、不変条件 g-3 と g-7 を数える・外の台帳の行と folio の裁定 id の文法の外の裁定はまだ分からない）を置いて計画だけの行から外し、2 節・3 節・6 節の字をその決めに合わせ、外の台帳の裁定を確かめる計画だけの行 c-g3-extern を足し、e-multi-ask の note を器の席の問い 5 の答え（画面の答えは器の 1 つの口が記録する）に合わせた。第 0.49 版（2026-09-28）は、持ち主の指示で前に出した行 t-cform-split をノート surface-wave16a に置き（契約の歯 contract_form と snapshot を契約の型の群 surface・ledger・graph・board・stats・seat ごとの歯の file と json に割り、見張りの歯 cfsplit を足す）、計画だけの行から外し、5 節の契約の歯の 1 本の鎖を群ごとの鎖に書き直した。割る行の後に起こす行（c-dn-edges・t-fx-prefix・c-seat-tick・c-limit-resume・c-pipe-ci）は、同じ commit でノートの版を上げて write-set と verify と done の字を群の file に付け替えた。c-dn-unknown は割る行を置いた時に走っていたので割る行の前に流す。第 0.50 版（2026-09-28）は、ノート surface-wave14c（g-card-adopt-b・問いの card の題とこれまでの決定の行に節点の card → g-card-adopt-c・台帳の epic の行と抜けの検査の名指しに節点の card・後始末で card の層を閉じる）を置いて計画だけの行から外し、g-attach-acct の files を起草の調べ（私的な fn attach_some は account/projects.rs と home.rs の 2 つに在る）に合わせた。第 0.51 版（2026-09-29）は、行 t-cform-split の diff が器の gate の上限（rules 行 gate.token_cap・150000 byte）を越えたので、ノート surface-wave16a を第 0.4 版にして t-cform-json（snapshot を群ごとの json に割る・中核 qblock と nsum と面 gpface の snapshot の path・見張りの歯の json の鍵の床）と t-cform-split（歯の rs を群の file と共通の手に割る・残りの見張りの歯）の 2 行に割り、5 節の鎖をその順に直し、付け替えた 5 行のノートの付け替えの段落の字を直した。席の folio の pin は folio2 1c7f927（79c8608）。第 0.52 版（2026-09-29）は、ノート surface-wave17c（g-kind-label・未反映の種類の見出しを 2 つの board で同じ語にする〔語の辞書の unref:ruling の label は見本 mock v3 どおり 裁定 のまま〕／g-next-acct-origin・次の一手の link が別の origin の account board の窓を移す欠陥の直し）を置いて計画だけの行から外した。第 0.53 版（2026-09-29）は、ノート surface-wave17b（t-allow-runsdoc・中核の歯 runsdoc の clippy の allow を外し見本の引数を束ねる〔憲法の条 P-22.2〕と見張りの歯を足す／c-misfit-pair・境界の server が台帳の字と器の doctor の台帳の形の行を同じ周の組として持ち、撃つ許しを知らせの接続の受け手にも置く）を置いて計画だけの行から外した。第 0.54 版（2026-09-29）は、持ち主の指摘 2 点（未反映の一覧が本当の未反映でない memo を出す・台帳の一覧が走行中の契約を「未着手」と出す・記帳 t3-hub.1 の user 2026-09-28T22:5xZ）と器の席の答え（2026-09-28T23:1xZ）を受け、計画だけの行 c-unref-kinds を外して c-unref-now・c-unref-lc・g-unref-lc を、台帳の一覧の状態の語の行 c-ledger-stage（つなぎ）と c-ledger-lc を足し、5 節の鎖と 6 節の案件の一生と器の memo の段落を器の答えで書き直した。第 0.55 版（2026-09-29）は、ノート surface-wave18a（c-ledger-stage・台帳の一覧の下の項が pipeline の板の札の読み 1 つから段の記号と字を出す・面だけで結び、server と中核と電文は書かない・c-pipe-ci の後）を置いて計画だけの行から外し、5 節の鎖に足した。第 0.56 版（2026-09-29）は、ノート surface-wave18c（h-win-store・account board の開いた窓の一覧を browser に残し、ほかの tab の変化を storage の event で受け、project board の戻るが account の窓へ閉じの知らせを送る〔2 つの board の origin が違うため・計画の files に無い surface/board.rs も書く・起草で大きさ M〕→ g-coach・初心者の最初の案内）を置いて計画だけの行から外し、5 節の board.rs の鎖を h-win-store → g-coach → g-nav に直し、語の辞書の open_windows の internal の字を決め d4 に揃える小さな行 g-wins-vocab を足した。第 0.57 版（2026-09-29）は、ノート surface-wave18b（g-map-tips・地図のグラフの切れ目と表の cell の経験者の注釈と、SRS と run の 0 件の帯の card → g-dn-group・圧縮の面の design-note の帯をノートごとの見出しに分ける）を置いて計画だけの行から外した。第 0.58 版（2026-09-29）は、器の束 E（要件 v0.29・ADR-0087〜0089）の着地を 6 節と行 c-unref-lc の依存の字に写し、器の memo の段落に着地した ADR-0089 の手の「昇格済み」の閉じの misfit と知らせ直しの字を足した。第 0.59 版（2026-09-29）は、c-ledger-stage の着地の後の画面の点検（memo 5 本と問い 2 本が台帳の一覧で「○ 未着手 · task」と出る）から、計画だけの行 g-ledger-kind を足した。第 0.60 版（2026-09-29）は、ノート surface-wave18e（計画の j-runner を起草で 2 行に割った j-count・受入 12 条の違反を測りの事実から数える純粋な関数と 12 条ごとに 1 件仕込んだ fixture → j-runner・CDP の決まった測りの式と全画面 × 2 幅 × 2 mode の sweep と xtask の accept・xtask が workspace の中の境界の crate に path で依存する・外の依存は 0 本）を置いて計画だけの行から外し、5 節の鎖に足した。第 0.61 版（2026-09-29）は、ノート surface-wave18d（i-7・表示先の設定〔層 B〕の中核と tz stage target の口・--to を省いた撃ちは設定から端末を引き、初めて見せるときだけ窓を起こして印を書く〔起草で src +564 行・大きさは M のまま〕→ i-board-ports・board の頁の上の守りを同じ host のほかの project の board にも広げる）を置いて計画だけの行から外し、tz stage open が窓を起こしたときも印を書く小さな行 i-open-mark を足した（起草の問い 2・裁定 t3-hub.59.7 に沿う）。第 0.62 版（2026-09-29）は、持ち主の裁定 2 つ（束 batch:20260929T0031Z-1）を判断の表 d36 と d37 に写し、要件 FR13 と受入 AC12 の改訂（srs v0.16）で行 c-unref-now の依存の字を解き、6 節の t3-hub.1 の扱いを「閉じた」に直した。

sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      この文書は、見本 mock v3（判断の記録 ADR-7 の承認 user 2026-09-26T07:51Z で確定した仕様）に本番の 2 つの board を揃える残りの仕事の全体の計画を持つ。どの行が残っていて、どの順で流し、何が持ち主の裁定と他の席の答えを待っているかを、この 1 か所で見る。
      傘の行は設計ノート surface-board（g = project board・h = account board・i = 表示面・j = 受入 12 条の測定・k = tz の口）と surface-base（e = 面の server・f = 席の hook と問いの起票の門）に在る。子の行は波ごとの設計ノート（surface-hub・surface-wave3a・surface-wave3b・surface-wave4・surface-wave5a・surface-wave5b・surface-wave6・surface-wave7・surface-wave8a・surface-wave8b・表示面の surface-wavei と、これから置く第 9 波のノート〔surface-wave9〕）に在る。
      決まり 1: 波のノートの行は全部この文書の 4 節（残りの行）から取る。この文書に無い行を波のノートに置かない。
      決まり 2: 新しい行は、まずこの文書の 4 節に足す（id・大きさ・何を・書く file・依存・拠る裁定）。その後に起草して波のノートへ移す。
      決まり 3: 行の契約の字（write-set・verify・done・節の材料）は波のノートが持つ。この文書は 1 行の要約だけを持ち、字が食い違ったら波のノートが正しい（この文書を直す）。
      範囲の外: 要件 FR18（指し示し）・FR19（相談の窓）・FR20（表示面の対象を広げる）は見本 mock v3 に無いので、この計画に入れない。見本に揃えた後に別の計画のノートを置く。
      状態: 下書き。持ち主が board の質問の頁で承認したら発効にする。波のノートの承認は、この計画の承認の裁定 id を継ぐ。
  - n: 2
    type: prose
    title: 現在地（2026-09-28・main 1c26a6f・台帳の closed と着地の commit で確かめた）
    body: |
      傘の行 g（project board）。着地した子の行: g-min（t3-hub.5）・g-frame（.7）・g-parts（.9）・g-pipe（.11）・g-next（.12）・g-ledger（.13）・g-map（.15）・g-seat（.18）・g-ask（.19）・g-gaps（.21）・g-ledger-fix（.23）・g-graph（.24）・g-node（.26）・g-steady（.28）・g-batch（.32）・g-seat-fix（.33）・g-top-fix（.34）・g-pipe-today（.49）、登録の生成の hs-blocks・hs-pages・hs-derived（.54.5〜.54.7）、第 3 波の g-brand（.52.2）・g-link-map（.52.3）・g-link-graph（.52.4）・g-map-keys（.52.5）・g-link-kcard（.52.6）・g-link-items（.52.7）・g-ask-focus（.52.8）・g-next-act（.52.9）・g-unref-panel（.52.10）・g-seat-axis（.52.11）・g-tick（.52.12）・g-help-fig（.52.13）と中核の c-next-batch（.52.15）、第 5 波の g-node-timeline（.52.17）・g-title（.52.18）・g-card-node（.52.19）・g-help-sym（.52.20）・g-seat-more（.52.21）・g-ledger-card（.52.22）・g-ask-around（.52.23）・g-hist-ruling（.52.24）、第 6 波の中核と境界の c-summary-design（.52.25）・c-summary-wire（.52.26）、第 7 波の g-card-adopt-a（.52.33）・g-tip-expert（.52.34）・g-seat-split（.52.35・審査の まだ分からない〔器の材料の行数の数え方の欠陥・器の memo s2-07l.728〕の後に、値で固める歯を名の列を見る歯に替えて〔surface-wave7 v0.3〕出し直して着地）・g-mode-store（.52.36）と中核の c-q-blocking（.52.37）、第 8 波の g-card-around（.52.41）・g-card-graph（.52.42）・g-summary（.52.43）・g-unref-word（.52.45）・g-pipe-fold（.52.46）・g-next-rows（.52.48）・g-map-tree（.52.44）・g-ledger-home（.52.50）・g-seat-hb（.52.52）と中核の c-next-stall（.52.47）・c-summary-ledger（.52.49）。第 8 波の 13 行は全部着地した（78f4701 まで・便の bead は閉じた）。
      g の done の (1)(2)(3)(5) は子の行で満ちた。(4) の hover の置き場と猶予を browser の runner で通すのは傘の行 j の runner 待ち。
