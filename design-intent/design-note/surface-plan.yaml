      着地済みの歯の file も、期待を直す行が 2 つ在れば同じく直列にする（例: 歯 acctpcore と server_acct は c-acct-thr → e-acct-qopen → e-acct-unref → c-acct-spark の順に直す見込み。UTC の字を pin する 9 本は g-jst がまとめて直し、同じ歯を先に直す行が在ればその後に流す。歯 contract_form と snapshot の c-summary-design → c-q-blocking は着地で満たされた）。
      上限に近い file（受付の上限は 1 file 1500 行・流す前に行数と大きさの余白の和を確かめ、越えるなら先に割る行を置く）: surface/project/ledger.rs・surface/mapview/graph.rs・surface/account/projects.rs・surface/account/home.rs・surface/project/seat.rs。project/seat.rs は後に M の行が続くので、g-seat-split（第 7 波・着地済み）で DOM を src/project_dom/seat.rs へ path の属性で割った（割った後の余白は seat.rs 約 841 行・project_dom/seat.rs 約 1174 行・直した steady_details_use_fold_record は src/project_dom の同じ名の file を block の file に足して見るので、後で割る block も同じ形で置ける）。account/projects.rs は h-cards-proj の起草で M の余白の内と確かめた（後の h-sort-hist と h-acct-cols を足しても内の見込み）。account/home.rs は h-next-unknown と h-thr-home を流す前に確かめる（h-acct-order は home.rs を書かない）。mapview/graph.rs は着地済みの歯 gnav_dom_moved_out が 1150 行以下と見るので余白が小さい（g-card-graph は graph/dom.rs だけを書く・g-map-tips が graph.rs に足すなら起草で確かめる）。surface/project の下は block の dir で、file を足すと build.rs が block に数えるので、割った中身の置き場は block の dir の外にする。
      第 6 波（f-mark・f-stop・f-mark-serve・c-summary-design・c-summary-wire）と第 7 波（ノート surface-wave7 の 9 行）は着地した。第 8 波 = 2 つのノート surface-wave8a（g-card-around・g-card-graph・g-summary・g-map-tree・g-unref-word・g-pipe-fold）と surface-wave8b（c-next-stall・g-next-rows・c-summary-ledger・g-ledger-home・h-acct-order・e-seat-hb・g-seat-hb）。g-map-tree は srs の要件 FR5 を 6 面に直した後に器へ出す。depends の外の順（g-map-tree は g-unref-word の後・g-seat-hb は g-seat-split〔着地済み〕の後）は便の bead の間の bd の依存で置く。g-jst は第 7 波と第 8 波の着地の後に、次の波の頭に置く（書く file と直す歯が多いため）。表示面の第 1 波 = i-1 と i-3（ノート surface-wavei・i-3 は i-1 の後・書く file は boundary/stage の下と boundary/lib.rs と新しい歯と fixture だけで、board の行〔surface・core の account・contract の account・boundary の acct.rs と server〕とは重ならないので、board の波と並べて走る）。表示面の第 2 波 = i-2・i-4・i-5（stage/mod.rs の鎖で直列・i-2 の起草は t3-hub.59.7 の答えの後・i-5 の守りは t3-hub.59.3 の案 B で確定）。表示面の第 3 波 = i-7・i-10・i-9（i-9 は i-7 の後）。i-8 と i-11 は board の波の着地の後。f-gate は f-stop が着地したので書き直して後の波に置く。1 つのノートは 10 行まで（7 節）。
