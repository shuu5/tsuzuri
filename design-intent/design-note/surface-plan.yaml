  note: 設計ノート surface-board（傘の行 g・h・i・j・k）と surface-base（傘の行 e・f）の子の行を、どの波で、どの順で流すかを 1 か所で持つ計画。これまで見本と本番の差の調べ・行の割り・順・席の決めは追跡されない作業場の file にしか無く、全体の統制がとれないという持ち主の指摘（2026-09-27）を受けて置く。持ち主が board で承認したら status を effective にし、承認欄に裁定 id を書く。第 0.11 版（2026-09-28）は、持ち主の裁定 t3-hub.52.38〜.52.40 の後の性能の行 14 本を 3 節（席の決め）と 4 節と 5 節に足し、第 9 波（ノート surface-wave9 = e-hold・g-keyed・g-strip・g-reads・g-policy-all の 5 行）の組みと、表示面の行 i-5 の tz stage open の守り（席の決め）を書き、第 8 波と表示面の i-1 の着地を 2 節に写して着地した行を 4 節から外した。第 0.12 版（2026-09-28）は、第 9 波の 6 行目 c-pipe-closed と、ノート surface-wavef の行 f-gate の書き直しを足し、持ち主の裁定 t3-hub.52.53・.52.60・.52.61 と器の答え（RulingReceived・行 ad・memo の判定・display-env）を写し、後の行（e-sess-closed・g-closed-mark・g-pipe-memo・c-graph-fold・g-graph-fold・e-batch-partial・i-1b）を 4 節に足し、i-3 の着地と disk の満ちを 2 節に書いた。第 0.13 版（2026-09-28）は、4 節の起草中の 2 行 c-graph-fold と g-graph-fold を、ノート surface-wave10a に置いた行の字（大きさ・書く file・接頭辞・便の bead の依存）に替えて 5 節に順の鎖を足し、後の行 t-fstop-tidy を足し、着地した第 9 波の 4 行（e-hold・g-keyed・g-strip・g-reads）を 4 節から外し、第 9 波の g-policy-all と e-hold の着地と surface-wavef の v0.2 と退役した target/ の掃除を 2 節に書いた。第 0.14 版（2026-09-28）は、folio2 の渡し B（folio f300177）の着地を受けて、3 節の持ち主の裁定の行を判断の表（33 行）へ、4 節の行を計画だけの行（67 行）へ移し、行の索引（130 行・folio derive が契約表から書く）を置き、契約表に在る 4 行（f-gate・c-graph-fold・g-graph-fold・c-pipe-closed）を計画だけの行から外し、規則の表に名札の行 R-27 を足した（拠りは裁定 t3-hub.57.1:20260927T2357Z-1 の案 A の 2 段目）。第 0.15 版（2026-09-28）は、器の binary の 8dd964f への入れ替え（display-env を読む）を受けて行 i-1b をノート surface-wavei2 に置いて計画だけの行から外し、i-2 の依存に i-1b を足し、第 9 波の c-pipe-closed と第 10 波 a の 2 行と f-gate の着地を 2 節と 5 節に書いた。第 0.16 版（2026-09-28）は、席が 2026-09-28 に実物の画面で見つけた欠陥 2 つ（1 byte も送らない接続にも境界の server が 400 bad-request を書き、Chrome が後の頁の移りでその接続を使い回して board に素の bad-request の頁が出る件・地図のグラフの組の箱と塊の箱が内部の id を題に出す件）の行 e-idle-close（S）と g-graph-label（S）を、計画だけの行を経ずにノート surface-wave10b に置き（3 節の席の決め）、5 節の鎖に 2 行を入れた（行の索引は folio derive が書く）。第 0.17 版（2026-09-28）は、folio の pin を渡し C の 1e6ab0f に上げ、第 11 波の account board の card の 2 行（h-cards-nx・h-cards-led）をノート surface-wave11d に置いて計画だけの行から外した。第 0.18 版（2026-09-28）は、第 11 波の g-fresh（面の古さの印と 60 秒の諦め）と g-closed-mark（閉じた札の印）をノート surface-wave11a に置いて計画だけの行から外し、g-fresh が view.rs・frame.rs・vocab.json を書かないことに合わせて 5 節の鎖を直した。第 0.19 版（2026-09-28）は、第 11 波の server と中核の 3 行（e-cache・c-pipe-questioned・e-sess-closed）をノート surface-wave11b に置いて計画だけの行から外し、core/account/project.rs と中核の歯 pclosed の鎖に 2 行を入れた。第 0.20 版（2026-09-28）は、account board の行 h-next-unknown（bead t3-hub.53.19・判じなかった次の一手を測れていないの字で出す）をノート surface-wave11f に置いて計画だけの行から外した。第 0.21 版（2026-09-28）は、folio の pin を folio2 の判断の記録 ADR-32（索引に設計ノートの契約表の行を節点として足す）の 6467915 に上げ、folio schema --write で様式の design-note/schema.yaml と graph.yaml を書き直した。第 0.22 版（2026-09-28）は、表示面の行 i-2（起動の引数と tunnel と、窓を 1 回だけ起こすこと）をノート surface-wavei3 に置いて計画だけの行から外し、起草で出た問いの席の決め（頁の窓の無い Chrome と同時の撃ちの錠は行 i-5・Windows は範囲の外）を 3 節と i-5 の字に書いた。第 0.23 版（2026-09-28）は、席が実物の event log で見つけた pipeline の板の欠陥の行 c-pipe-unmapped（器の段 Failed と Stopped の走行を札にし、器が worktree を畳んだ記帳 retired では段を決めない）をノート surface-wave11e に置き（3 節の席の決め・欠陥の直し）、5 節の鎖に入れた。走行の無い札の決まりの行 c-pipe-queue は、bead の種類を問う持ち主の問い t3-hub.60 と t3-hub.52.71 の答えまで起草を止める。第 0.24 版（2026-09-28）は、第 12 波 e の 2 行（t-fstop-tidy = 歯 fstop_worktree_stays_quiet が作る .git を drop の守りで消す・e-batch-partial = まとめて承認の束が途中で落ちた時に、書いた行・閉じていない行・書いていない行を名指して残りだけを送り直せる）をノート surface-wave12e に置いて計画だけの行から外し、起草で見つけた同じ形の後始末の漏れ（tests/qgate.rs）の行 t-qgate-tidy を 9 節に足した。第 0.25 版（2026-09-28）は、持ち主の裁定 t3-hub.60 と t3-hub.52.71（判断の記録 ADR-16・bead の種類を器と揃え、方針は閉じた問いに記帳し、板は控えの列と 4 列と要修正の行）を判断の表に写し、行 c-pipe-queue・c-pipe-misfit・g-pipe-misfit・e-policy-q を 9 節に足し、g-pipe-memo の字と 6 節の常設の控えの字を直した。第 0.26 版（2026-09-28）は、account board の表の数の欄の行 h-acct-cols（電文の台帳の指標 LedgerStats を読む）をノート surface-wave12b に置き、同じ事を電文に別の欄で足す計画の行 e-acct-qopen と e-acct-unref を 3 節の席の決めで退け、上限に近くなる surface/account/projects.rs を先に割る行 h-acct-split と、見本の表の残りの行 h-acct-rest を 9 節に足した。第 0.27 版（2026-09-28）は、表示面の行 i-4（届かない端末と席の目・席の目の Chrome は pipe）と i-5（tz stage の口の配線と守り・頁の target を作るのは tz stage open だけ・錠と tunnel の dir は口座ごとの 0700 の dir）をノート surface-wavei4 に置いて計画だけの行から外し、5 節の stage の鎖と surface/account/projects.rs の鎖を直し、ほかの project の board の上でも click と入力を断る行 i-board-ports を 9 節に足した。第 0.28 版（2026-09-28）は、答えた決定の取り消しの行 e-revoke（持ち主の裁定 t3-hub.52.60 の案 A・POST の取り消しの口・決定の頁の頭に理由の欄と取り消すの button・開き直しだけが落ちた時は同じ button で開き直しだけを撃ち直す）をノート surface-wave12d に置いて計画だけの行から外した。第 0.29 版（2026-09-28）は、project board の上端の 3 行（g-pulse = 読みの途中の脈・g-seatpill = header の席の pill と席の card・g-back-note = 窓を閉じられない時の戻るの注記と閉じの印）をノート surface-wave12c に置いて計画だけの行から外し、5 節の鎖（lib.rs・fresh.rs・frame.rs・歯 hspage）を直し、g-nav をその後に置き、起草の問いから行 c-limit-resume と g-back-origin を足し、h-win-store の範囲に account board を読み直した後の窓の閉じの印を足した。第 0.30 版（2026-09-28）は、台帳の読みを減らす 3 行（e-marks = 変化の印を dolt の store の中身にし〔印の字は第 0.32 版の行 e-mark-meta が直す〕、印の無い周期の読み直しを 60 秒に・e-snap = GET の口は bd を撃たず見張りの最後の読みを返す・e-idle = SSE の受け手が 0 人の間は印が動いた時だけ読む）をノート surface-wave12f に置いた（器の席が 2026-09-28 に測った、bd の読みの排他の錠と tz の画面の server の 5 秒ごとの読みの衝突の直し）。a-lean の what を store の印に直し、FR8 の premises の検査の行 f-premises を 9 節に足した。第 0.31 版（2026-09-28）は、方針の欄の記帳先の行 e-policy-q（方針 1 つにつき根の直下の閉じた問いを作り、本文は器の要件 FR81 の (a) の 4 行と effect operation）をノート surface-wave12h に置いて計画だけの行から外し、5 節に契約の ledger.rs と歯 contract_form と snapshot の鎖を足し、c-pipe-misfit を e-policy-q の後に置き、起草の問いから行 g-policy-face を 9 節に足し、方針の id と器の要件 FR83 の問いを 6 節に足した。第 0.32 版（2026-09-28）は、着地した行 e-marks（857d2b2）の印を器の席の測りの形（.beads の metadata.json が名指す db の manifest の字と、manifest が名指す file の長さ）に直す行 e-mark-meta をノート surface-wave12f v0.2 に足して e-snap をその後に置き、ノート surface-wave12h を v0.2（行 e-policy-q がこれまでの決定の一覧と数から方針の問いを外す分を持つ）にして g-policy-face を面の断りの字と契約の doc だけに縮め、器の答え（FR83 の 3 つの決まり）を 6 節に写し、fixture の id の接頭辞を替える行 t-fx-prefix を 9 節に足した。第 0.33 版（2026-09-28）は、pipeline の板の走行の無い札（Queued と Blocked）を設計の参照を持つ契約の bead だけにする行 c-pipe-queue を 1 行のノート surface-wave12g（v0.1）に置いて計画だけの行から外した（c-pipe-misfit と g-pipe-misfit は同じノートの v0.2 で足す・c-pipe-misfit は器の scribe2 doctor の ledger-form の行を台帳の見張りの読みの周で写す形に直して起草中＝判断の記録 ADR-16 の決定 (6)）。第 0.34 版（2026-09-28）は、小さな 2 行（t-qgate-tidy = 着地済みの歯 qgate の作業場の後始末・e-seat-hbmark = 席の card の変化の印に heartbeat-off を足し、印が動いたら 5 秒の持ち回しを解く）をノート surface-wave13e に置いて計画だけの行から外し、同じ 5 秒の古さを account board の口座の読みから除く行 e-acct-hbmark を 9 節に足した。c-dormant と h-dormant の休止の境の 12 時間は器の rules 行に置かず、tsuzuri の規則の表の行（R-28・見本 mock v3 の承認）に置く（器の席の答え・器は休止を読まない）。第 0.35 版（2026-09-28）は、folio の pin 6467915 の索引の新しい種類「設計ノートの行」を中核が読めず地図の設計の出所がまるごと読めなかった欠陥（持ち主の指摘）の直しを兼ねる行 c-dn-rows をノート surface-wave13d に置いて計画だけの行から外し、索引の辺 req と depends を組む行 c-dn-edges と、知らない種類の節点と辺をその 1 つだけ飛ばして数える行 c-dn-unknown を 9 節に足し、c-g3g7 の材料（節点ごとの裁定 id）を folio2 に頼む字を 6 節に足した。第 0.36 版（2026-09-28）は、board が人に見せる時刻を日本時間にする行 g-jst（持ち主の方針の欄の指示〔2026-09-28〕と裁定 t3-hub.52.28・2 つの board の時刻は同じ関数から出るので 1 行・時差は 1 か所・印は JST・Landed の今日と 24 時間の目盛は日本の日と時）をノート surface-wave13a に置いて計画だけの行から外し、g-jst が書かない ask.rs と ledger.rs の鎖から外し、UTC の字を pin する着地済みの歯の数を 12 file の 26 本に直した。第 0.37 版（2026-09-28）は、持ち主の指示（チャット 2026-09-28T11:4xZ・逐語は t3-hub.1）を受けて、着地して CI を待つ走行を板に CI 中として出す行 c-pipe-ci を 9 節に足し、issue の一生（要望から memo・契約・走行・着地・CI・閉じ・反映まで）の道筋を器と整理し直して板を一生を追う面に作り直す件を控え t3-hub.63 として 6 節に書いた。

sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      この文書は、見本 mock v3（判断の記録 ADR-7 の承認 user 2026-09-26T07:51Z で確定した仕様）に本番の 2 つの board を揃える残りの仕事の全体の計画を持つ。どの行が残っていて、どの順で流し、何が持ち主の裁定と他の席の答えを待っているかを、この 1 か所で見る。
      傘の行は設計ノート surface-board（g = project board・h = account board・i = 表示面・j = 受入 12 条の測定・k = tz の口）と surface-base（e = 面の server・f = 席の hook と問いの起票の門）に在る。子の行は波ごとの設計ノート（surface-hub・surface-wave3a・surface-wave3b・surface-wave4・surface-wave5a・surface-wave5b・surface-wave6・surface-wave7・surface-wave8a・surface-wave8b・表示面の surface-wavei と、これから置く第 9 波のノート〔surface-wave9〕）に在る。
      決まり 1: 波のノートの行は全部この文書の 4 節（残りの行）から取る。この文書に無い行を波のノートに置かない。
      決まり 2: 新しい行は、まずこの文書の 4 節に足す（id・大きさ・何を・書く file・依存・拠る裁定）。その後に起草して波のノートへ移す。
      決まり 3: 行の契約の字（write-set・verify・done・節の材料）は波のノートが持つ。この文書は 1 行の要約だけを持ち、字が食い違ったら波のノートが正しい（この文書を直す）。
      範囲の外: 要件 FR18（指し示し）・FR19（相談の窓）・FR20（表示面の対象を広げる）は見本 mock v3 に無いので、この計画に入れない。見本に揃えた後に別の計画のノートを置く。
      状態: 下書き。持ち主が board の質問の頁で承認したら発効にする。波のノートの承認は、この計画の承認の裁定 id を継ぐ。
  - n: 2
    type: prose
    title: 現在地（2026-09-28・main 1c26a6f・台帳の closed と着地の commit で確かめた）
    body: |
