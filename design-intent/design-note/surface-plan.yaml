      略記: surface/ = crates/tsuzuri-surface/src、core/ = crates/tsuzuri-core/src、contract/ = crates/tsuzuri-contract/src、boundary/ = crates/tsuzuri-boundary/src。どの行も自分の歯の file（tests の下の新しい file）を足すので、書く file からは省く。拠るの「見本」は判断の記録 ADR-7 の承認（user 2026-09-26T07:51Z）を指す。file に（見込み）と付けた行は、起草のときに main の code で確かめて決める。依存に書くのは中身の依存（先の行が作る物を使う）だけで、同じ file を書くだけの順は 5 節が持つ（依存に書かなくても 5 節の順で流す）。
      問いの起票の門（t3-hub.55.2 の絞りで書き直し、ノート surface-wavef に置く）。
      性能（持ち主の 2 つの board が重いという指摘と、読み直しは要るが画面への出し方を工夫するという指摘〔t3-hub.1 の user 2026-09-28T00:4xZ・00:59Z・01:06Z の記帳〕を受けた重さの調べ〔2026-09-28・席の作業場の pb-perf/report.md〕から・14 行・新鮮さの決まりは 1 つ = 台帳の読みが落ちたときも変化の知らせのつながりが切れたときも、最後に読めた中身を 60 秒まで出し、出している中身が 15 秒より古くなれば一番上の header に読み込み不良の注意の印を 1 つ出し、60 秒を越えたら今の まだ分からない〔つながりは lose_all〕にする・規則の行 R-21 に足す・第 9 波 = e-hold・g-keyed・g-strip・g-reads〔ノート surface-wave9・project board の続きの g-policy-all と 5 行〕・第 10 波と第 11 波は 5 節）。

      性能の続き（判断の記録 ADR-23・ノート surface-wave23b の 18〜23 行目）: c-tick-word（席の健康の語を tick status から）と e-held-design（外の読みの持ち回しの表と folio の 3 つの読み）を根に、e-held-seat（席の card の器の出力を出力ごとに持つ）→ e-held-acct（account board の器の出力を出力ごとに持つ）→ e-ledger-lazy（受け手が居ない時は台帳を読まない・印の動かない読み直しの網は 600 秒）→ c-acct-parse（読み解きは字が変わった時だけ）の 6 行。撤退の条件 (2) で起こした e-held-marks（ノート surface-wave23b の 25 行目・器の出力の入力の印を決定 (2) の一覧にし、席の card と account board の読みで表を分け合い、同じ鍵の読みを 1 本ずつにする）を c-acct-parse の後に流す。全部の着地の後と、その後に面の server の読みを変える行の着地ごとに、席が測りの script で頁を開いて 60 秒の後の 300 秒と閉じて 30 秒の後の 120 秒の CPU を元の code（c-tick-word の前の commit の release）と並べて測り（要件 NFR4・規則の行 R-34）、便の bead の notes に記帳する。判断の記録 ADR-26（R-34 の越えの手当て・t3-hub.52.156 と t3-hub.52.157）: doctor だけの持ち回しの上限を 60 秒にする行 m-doctor-hold（ノート surface-wave24a の 17 行目・使用量の読みと規則の行の読みは 30 秒のまま）を置き、器の doctor の読みを器の側で軽くする問いを、器の持ち込みの段を待たずに器の席へ起こした（決定 (4)）。器の席は doctor の入口で event log を 1 回だけ読む便を器の側で起こすと答えた（t3-hub.52.157 の notes）。その便の着地までは R-34 の越えを便の bead の notes に記帳し、着地の後の最初の測りで比べ直す（決定 (5)）。台帳の形の行の撃ち（doctor --repo）を台帳の入力の印が動いた時だけにする形は、その測りの後に席が決める。後の行の候補（計画だけの行にしない）: 今の時刻に依る欄を tsuzuri が組む形・受け手が付いた周の台帳の読みを印と網で省く形・台帳の印が動いた周に短く待ってから読む形（ADR-26 の却けた案 b・台帳の動きの多い窓で並べて測り、効きが 1.5 ポイントを越えた時だけ問う）・台帳の形の行の撃ちを同じ台帳の字の周で撃たない形（器の席の確かめの後）・event log を要る欄だけの型で読む形と字の写しの代わりに長さと hash を持つ形（使う記憶の量）。
