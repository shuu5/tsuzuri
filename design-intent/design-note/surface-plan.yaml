        text: "ssh の届かない端末（スマホ）は URL を渡すだけにし、席はその browser を操作しない。配信の窓は v2 の候補（専用のスマホの app の案と同じ所）。推奨の A（配信の窓を board の後に作る）とは違う。効果: 判断の記録 ADR-15 の決定 (5)（ADR-5 決定 (3) の置き換え・ADR-5 は発効のまま）・srs の要件 FR16 と受入 AC13 の字と scope の not_build（v0.10）・傘の行 i の字（surface-board の第 0.21 版）。行 i-4（server 側の headless は席の目・持ち主へは URL・host の名は実行の時に組む）・行 i-6 を 4 節から外す（6 節の v2 の候補）。"
