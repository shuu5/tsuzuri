sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      この文書は、見本 mock v3（判断の記録 ADR-7 の承認 user 2026-09-26T07:51Z で確定した仕様）に本番の 2 つの board を揃える残りの仕事の全体の計画を持つ。どの行が残っていて、どの順で流し、何が持ち主の裁定と他の席の答えを待っているかを、この 1 か所で見る。
      傘の行は設計ノート surface-board（g = project board・h = account board・i = 表示面・j = 受入 12 条の測定・k = tz の口）と surface-base（e = 面の server・f = 席の hook と問いの起票の門）に在る。子の行は波ごとの設計ノート（surface-hub・surface-wave3a・surface-wave3b・surface-wave4 と、これから置く第 5 波からのノート）に在る。
      決まり 1: 波のノートの行は全部この文書の 4 節（残りの行）から取る。この文書に無い行を波のノートに置かない。
      決まり 2: 新しい行は、まずこの文書の 4 節に足す（id・大きさ・何を・書く file・依存・拠る裁定）。その後に起草して波のノートへ移す。
      決まり 3: 行の契約の字（write-set・verify・done・節の材料）は波のノートが持つ。この文書は 1 行の要約だけを持ち、字が食い違ったら波のノートが正しい（この文書を直す）。
      範囲の外: 要件 FR18（指し示し）・FR19（相談の窓）・FR20（表示面の対象を広げる）は見本 mock v3 に無いので、この計画に入れない。見本に揃えた後に別の計画のノートを置く。
      状態: 下書き。持ち主が board の質問の頁で承認したら発効にする。波のノートの承認は、この計画の承認の裁定 id を継ぐ。
  - n: 2
    type: prose
    title: 現在地（2026-09-28・main b525a13・台帳の closed と着地の commit で確かめた）
    body: |
      傘の行 g（project board）。着地した子の行: g-min（t3-hub.5）・g-frame（.7）・g-parts（.9）・g-pipe（.11）・g-next（.12）・g-ledger（.13）・g-map（.15）・g-seat（.18）・g-ask（.19）・g-gaps（.21）・g-ledger-fix（.23）・g-graph（.24）・g-node（.26）・g-steady（.28）・g-batch（.32）・g-seat-fix（.33）・g-top-fix（.34）・g-pipe-today（.49）、登録の生成の hs-blocks・hs-pages・hs-derived（.54.5〜.54.7）、第 3 波の g-brand（.52.2）・g-link-map（.52.3）・g-link-graph（.52.4）・g-map-keys（.52.5）・g-link-kcard（.52.6）・g-link-items（.52.7）・g-ask-focus（.52.8）・g-next-act（.52.9）・g-unref-panel（.52.10）・g-seat-axis（.52.11）・g-tick（.52.12）・g-help-fig（.52.13）と中核の c-next-batch（.52.15）、第 5 波の g-node-timeline（.52.17）・g-title（.52.18）・g-card-node（.52.19）・g-help-sym（.52.20）・g-seat-more（.52.21）・g-ledger-card（.52.22）・g-ask-around（.52.23）・g-hist-ruling（.52.24）。
      g の done の (1)(2)(3)(5) は子の行で満ちた。(4) の hover の置き場と猶予を browser の runner で通すのは傘の行 j の runner 待ち。
      g の残り（見本との差）: 節点の hover の card が pipeline の札・次の一手・問いの題・これまでの決定・台帳の epic・抜けの検査の名指しに無い（地図の札と一覧の題は g-card-node で付いた）。経験者だけの注釈が無い。1 秒の時計は account の session の表だけで、問い・pipeline・席・次の一手の経過は動かない。block「orchestrator と口座」に tick の経過・退避の猶予と待ちと断りと逼迫の帯・群の card・窓の閾値の印・停止の切り替えが無い（詳しくの出所の行と doctor の席の行は g-seat-more で付いた）。問いの card に止めている便の数が無い。header の席の pill・窓を閉じられないときの注記・mode の保存・最初の案内が無い。節点の概要（要件 FR15）が電文に無く、設計ノートの行の節点と更新の時刻も無い。未反映の一覧の裁定と要望の 2 種と、次の一手の発効待ちは、材料（処分の宣言）が無いので まだ分からない。
      傘の行 h（account board）。着地した子の行: b-acct（.36）・e-acct-host（.37）・e-acct-proj（.38）・e-acct（.39）・e-acct-hb（.40）・h-frame（.41）・h-home（.42）・h-sess（.43）・h-led（.44）・h-proj（.45）・h-win（.46）・h-hb（.47）・h-wire（.48）・h-look（.53.3）、第 3 波の h-proj-more（.53.4）・h-led-spark（.53.5）・h-popstate（.53.6）、第 4 波の h-cards-home（.53.7）、第 5 波の h-sess-axis（.53.11）・h-board-url（.53.12）と中核の c-limit-pipe（.53.13）。開く button は各 anchor の追跡されない git config の tsuzuri.boardport で開く（席が 4 つの anchor に置いた・2026-09-28）。
      h の done の (1)〜(4) は単体の歯で満ちた（browser の runner は j 待ち）。
      h の残り: session と run と各 project の表に card が無い。並べ方の押しが履歴に積まれない。決定待ちと未反映の欄が「―」。使用量の閾値と逼迫の印と候補が門で落ちた理由が無い。休止中の印と口座ごとの 7 日の小さな図と測った時刻の列が無い。開いた窓の一覧と mode が頁を開き直すと消える。
      h で作らないと決めた物: 時点のつまみと関係の頁（t3-hub.53.10）。見張り: t3-hub.53.2（負荷の高い時に台帳が測れていないに落ちる・直しは保留）。
      傘の行 i（表示面）: 着地した子の行は無い。done の (1)〜(4) が全部残る。端末の宣言・ssh・Chrome の専用の profile の決めが持ち主待ち。
      傘の行 j（受入 12 条の測定）: 着地した子の行は無い。done の (1)〜(4)（12 条ごとに 1 件仕込んだ fixture・現物の全画面で 0・report・面の crate の依存の予算）が全部残る。runner の外の依存（headless の browser か CDP か、行 i の道具の使い回しか）が持ち主待ち。
      傘の行 k（tz の口）: 着地した子の行は k-graph（.55.1）。done の (2)（tz graph --design が設計の索引だけを出す）は満ちた。tz graph --check は今の中核が g-3・g-7・g-9 を測らないので、違反が無くても まだ分からない（rc 2）を返す。残り: (1) folio の 11 の口の終了 code と出力の一致（folio の code の持ち込み〔判断の記録 ADR-4〕の後）と、(3) tz inject が無いこと・(4) folio という名の binary が workspace に無いこと（どちらも今は真で、見る歯が無いだけ）と、g-3・g-7・g-9 を数える行。
      傘の行 e（面の server）: 着地した子の行: e-min（.4）・e-src（.6）・e-read（.14）・e-ask（.17）・e-seat（.20）・e-view（.25）・e-coalesce（.27）・e-batch（.30）・e-reap（.31）・e-runs（.52.14）と、登録の生成の hb-proc・hb-config・hb-route・hb-post（.54.1〜.54.4）。
      e の done の (2)・(3) の前半（古い版の要求を 409 で断る）・(4) は満ちた。残り: (1) 裁定ごとの逐語つきの承認の event を器の event log に書く（今は器の seat deliver を撃つだけ）。(3) の後半の取り消し（新しい裁定が前の id を名指して問いを open に戻す）。(5) 問いの合図から SSE まで 200 ミリ秒（今は 500 ミリ秒の周期の読みだけ）。考え中の席が断った配達（busy）を届ける手（第 6 波の行 f-mark・f-stop・f-mark-serve）。
      傘の行 f（席の hook と問いの起票の門）: 着地した子の行は無い（境界の crate に hook の dir が無い）。done の (1)〜(3) が全部残る。配達の 3 行（f-mark・f-stop・f-mark-serve）は第 6 波。門の行 f-gate は t3-hub.55.2 の絞りで、f-stop の着地の後に書き直す（hook の dir と hooks.json を f-stop が置くため）。
  - n: 3
    type: prose
    title: 決定（持ち主の裁定と席の決め・出所つき）
    body: |
      持ち主の裁定（逐語は各問いの notes と t3-hub.1 の notes に在り、この文書には写さない）。
      t3-hub.53.1（裁定 id = user 2026-09-27T22:18Z）: 案 A。account の server が各 anchor の追跡されない git config の tsuzuri.boardport から port だけを読み、電文の ProjectRow の board に載せ、面は開いている頁の protocol と hostname に port を足して URL を組む。効果: 行 h-board-url（第 5 波）。前提は全部の board が account board と同じ host に在ること。案 B（起動の引数）は取らず、案 C（1 つの server が全部の board を配る）は複数の process の運用が辛くなったときの判断の記録の候補として残す。
      t3-hub.55.2（裁定 id = t3-hub.55.2:20260927T2233Z-1）: 問いの起票の門の名指しを討論の記録 B §11.3 の絞りにする（1 段・種類は条・規則行・発効した判断の記録・要件の 4 つ・次数 30 を越える hub は除く・処分が 30 を越える問いは まだ分からない で分けさせる）。効果: srs の要件 FR4 と受入 AC6 の字を変える（この文書と同じ束の srs の直し）。行 f-gate を書き直す（台帳の節点は門の集合から外れ、fixture の名指しの例を 4 種の節点に替え、hub と 30 越えの fixture を足す）。
      t3-hub.55.3（裁定 id = t3-hub.55.3:20260927T2233Z-1）: 門の便の着地の後に、席の設定（PreToolUse・matcher Bash）に門を入れる。効果: 行 f-gate-install（f-gate の後）。
      t3-hub.52.16（裁定 id = t3-hub.52.16:20260927T2233Z-1）: mode・account board から開いた窓の一覧・最初の案内の済み印の 3 つを、その browser に残す（便利の写しで正本ではない）。効果: srs の要件 FR1 の字。行 g-mode-store・h-win-store・g-coach。着地済みの歯 acctwin_no_storage_and_wasm_wiring（src/account の下に保存の字が無いことを見る）の期待を変えるか、保存の字を src/account の外の 1 つの module に置く。
      t3-hub.53.8（裁定 id = t3-hub.53.8:20260927T2233Z-1）: 使用量の閾値（窓ごとの cap）と逼迫の印と、移り先の候補が門で落ちた理由を出す。値は器の rules 行と event を写すだけで tsuzuri は判じない。効果: rules 行 R-22 に写し方を足す（同じ束の直し）。行 c-acct-thr・h-thr-home・g-seat-thr と、行 c-seat-grace の逼迫の行（前は持ち主待ち）。着地済みの歯 accthome_no_pressure_marks（HOME に逼迫の印が無いことを見る）の期待を変える。
      t3-hub.53.9（裁定 id = t3-hub.53.9:20260927T2233Z-1）: account board でほかの project の台帳と design-intent を読み（書かない）、決定待ちと未反映の数を出す。効果: srs の要件 FR13 の字。行 e-acct-qopen・e-acct-unref・h-acct-cols。
      t3-hub.53.10（裁定 id = t3-hub.53.10:20260927T2233Z-1）: 休止中の project の印と、口座ごとの 7 日の小さな図（spark）と測った時刻の列だけを作る。時点のつまみと関係の頁は作らない（推奨の A = 休止中の印だけ、とは違う）。効果: srs の要件 FR12 の字と scope の not_build。行 c-dormant・h-dormant・c-acct-spark・h-acct-spark。
      t3-hub.58（裁定 id = t3-hub.58:20260927T2357Z-1・束 batch:20260927T2357Z-1）: 案 A。設計ノートの章の上限を 40 章 以下にする。効果: 規則の行 R-26（key note-chapters）と、席の folio を 0fb780e に替えること（同じ commit 58b16c2）。波のノートは今の運びどおり小さく保つ（7 節）。
      t3-hub.57.1（裁定 id = t3-hub.57.1:20260927T2357Z-1・束 batch:20260927T2357Z-1）: 案 A。文書の運用の強制を、無いと先へ進めない形の 5 段（裁定 id の実在・計画のノートの必須と行の索引の生成・dispatch の時の床の合格・問いの反映先の型と未反映の差・席の役の AskUserQuestion の guard）でこの順に入れる。効果: 判断の記録 ADR-14（tsuzuri は各段が器と folio に着地した順に加わる）。各段は s2 と folio2 の判断の記録と行で入る（6 節）。
      この計画の枠の裁定: 判断の記録 ADR-7 の承認（user 2026-09-26T07:51Z・見本で確定）、surface-board と波のノートの承認（user 2026-09-27T03:19Z）、判断の記録 ADR-13 の承認（user 2026-09-27T17:36Z・登録の生成）。
      席の決め（理由つき・持ち主の異議があれば戻す）。
      tz graph --check は g-3・g-7・g-9 を測る機構が来るまで rc 2（まだ分からない）のままにする。3 本を判定の外に出す案は取らない。理由: 要件 FR3 の「読めなければ合格にしない」と条 P-7（黙って飛ばさない）。行 c-g3g7 と c-g9 で rc 0 に届く。
      tsuzuri の側に設計文書の YAML の走査を置かない。folio2 の folio graph --print --summary の着地を待ち、行 c-summary-design を「--summary を読んで写す」行として書き直す。理由: tsuzuri の走査は正本の 2 つ目の読み手になり（条 P-2）、folio を取り込むときに消す負債になる。設計ノートの行の節点と ruled_by の辺の材料（行 c-dn-rows・c-g3g7・c-g9）も、同じ理由で folio の索引に載るのを待つ（6 節）。電文の概要は全文で運び、切るのは面（規則の行 R-19 の字の予算・行 g-summary）。
      並べ方の押しは見本どおり履歴に積む（pushState）。理由: 見本は判断の記録 ADR-7 の承認で確定した仕様で、行 h-popstate は 3 つの block の file を書かないために今は履歴の書き換え（replace）に留め、後の行に回した。効果: 行 h-sort-hist。
      限度の KPI（h-cards-home）は電文が Limit と印す session を写して出す。電文が pipeline の session を Limit と印さない欠けは面で数え直さず、中核の行 c-limit-pipe で直す。
      行 h-proj-more の詳しくの段（more_view）の形: 4 つの値の span は列の class で包まず、列の class で包むのは row_view だけ。理由: style.css の 760px 以下の規則は .prow の子孫の全部の c-run・c-orch・c-acc・c-led を隠すので、中で包むと狭い幅で値が消える（前の便の門 FAIL の実物）。以後の行も、隠す class を値を見せる要素の中に入れ子にしない。
      門の引数の誤りは、入力が問いの起票のときだけ断り、ほかの Bash は素通しにする（問いについては閉じる側に倒す）。metadata の鍵の名は器と揃える。
      project board の block「orchestrator と口座」の時点のつまみ（見本の ?at=）も作らない。t3-hub.53.10 の字は account board のつまみだが、同じ機能（server に時点の引数と履歴が要る L）なので揃える。持ち主が project board だけ欲しいと言えば 1 問で戻す。
      行を書く作法（審査と門で止まった実例から・詳しくは docs/handoff/2026-09-27-t3-screen-wave.md の 7・14・15・16 節）。
      作法 1: 審査の目は行と節と要件の字と write-set の file の宣言の名しか見ない。使う型・関数の path・pub か・wasm に限るか・引数と返り・class が stylesheet に在るか・語の鍵が辞書に在るかを節に書き、確かめた事実は確かめたと書く。
      作法 2: file の行数と行番号を書かない（審査は幅で均した行数を見る）。fn・const・型の名で指す。歯が頼る fixture の欄と値は行の節に字で書く。
      作法 3: done の 1 項ごとに、それを落とせる歯の名を書く。DOM だけの振る舞いは host の純粋な関数か、名のある目印の間の source の字を読む歯で見て、組めることは xtask の surface-build で見る。
      作法 4: write-set の外の着地済みの歯を grep で全部探し、期待が変わる歯の file は write-set に足して節に直しを書き、直さずに通る歯は何を読むから通るかを書く。書かないが審査に見せたい file は置き場だけの = で足す。
      作法 5: 新しい歯の名は接頭辞で始め、接頭辞の後に着地済みの verify の filter の語を含めない。done にその見張りの歯を置く。
      作法 6: 新しい電文の型は自分の歯の file と snapshot を持つ（contract_form に足さない）。電文の欄を足す行は、その型を struct の字で組む着地済みの歯と snapshot を全部 write-set に入れる。
      作法 7: 許す範囲は歯が見る広さと同じにする（狭く書くと正しい実装が門で落ちる）。面に判定を書かせず、面が出す数は電文の欄に在るものだけにする。
      作法 8: 受付の上限は src の 1 file 1500 行で、大きさ S は 100 行・M は 300 行の余白を数える。上限に近い file は先に中身を新しい file へ移す行を置く。
      作法 9: fixture は小さく（審査の diff の上限）。散文と done に二重引用符と逆斜線を書かない（導出が止まる）。done に「コロンと空白」と「空白と井桁」の並びを書かない。host の名・住所・口座の名を書かない。
      作法 10: 行を流す前に、審査の目の材料だけで問いを出し main の code で答える事前の点検の agent を 1 本撃つ。
  - n: 4
    type: prose
    title: 残りの行（id・大きさ・何を・書く file・依存・拠る）
    body: |
      略記: surface/ = crates/tsuzuri-surface/src、core/ = crates/tsuzuri-core/src、contract/ = crates/tsuzuri-contract/src、boundary/ = crates/tsuzuri-boundary/src。どの行も自分の歯の file（tests の下の新しい file）を足すので、書く file からは省く。拠るの「見本」は判断の記録 ADR-7 の承認（user 2026-09-26T07:51Z）を指す。file に（見込み）と付けた行は、起草のときに main の code で確かめて決める。依存に書くのは中身の依存（先の行が作る物を使う）だけで、同じ file を書くだけの順は 5 節が持つ（依存に書かなくても 5 節の順で流す）。
      第 6 波（起草と事前の点検の済み・1 つのノート surface-wave6 に置く・depends は同じノートの中の行しか引けないため）。
      f-mark（M・最優先）: 配達済みの印の形（台帳の問いの notes の末尾の 1 行「配達 = <裁定の id>・経路 = <配達の口|停止>・時刻 = <分>」・同じ bead の印だけを数える）と、印の無い裁定の読み（undelivered）・印の判じ（marked）・印の 1 行（mark_line）・停止の hook の入力の旗（stop_active）と答えの JSON（block）を中核の純粋な関数に置き、歯が共に読む台帳の見本を置く。file = core/delivery.rs（新）・core/lib.rs・tests/fixtures/stop の 2 つ（新）。依存 = なし。拠る = 要件 FR9・器の答え（ADR-0077 CTX2 と CSQ-N3・器の FR79）。
      f-stop（M）: 席の停止の hook tz hook stop（Stop・考え中から待ちに移る境）が印の無い裁定を読み、在れば裁定の id を返して席を続けさせ、返した後にだけ経路が停止の印を置く（stop_hook_active が true なら黙る・rc 2 を返さない・--repo の下の .git が file＝git の worktree なら、標準入力も台帳も読まずに黙る〔器の便の runner も plugin を読むため〕）。repo の根の plugin/ の hooks.json に Stop を登録する（command は $CLAUDE_PROJECT_DIR の下の target/debug/tz・timeout 30・--repo は $CLAUDE_PROJECT_DIR＝席の起動の dir の anchor なので、worktree で編集する席も裁定を受け続ける）。file = boundary/hook/mod.rs（新）・boundary/hook/stop.rs（新）・boundary/lib.rs・boundary/main.rs・plugin/.claude-plugin/plugin.json（新）・plugin/hooks/hooks.json（新）。依存 = f-mark。拠る = 要件 FR9・器の答え（ADR-0077 CTX2 と CSQ-N3・hook の入れ先 23:3xZ・器 24aaa5a の runner への plugin の写し）。
      f-mark-serve（M）: server は受付ごとに seat deliver を 1 度だけ撃つ（1 問は裁定の id・束は束の id・器は 1 回に 1 つの id だけを受け、打ち込みの間の 2 回目を断るため）。撃つ前に台帳を読み直し、受付の全部の裁定に印が在れば撃たない。rc 0 のとき受付の全部の裁定の問いに経路が配達の口の印を置き、受けないときは失敗とせず、log に 1 行だけ書いて印を置かない（「配達が落ちた」を消す）。file = boundary/server/ruling.rs・boundary/server/batch.rs（着地済みの歯 server_ask と server_batch の数の直しと、1 本の名の替えを含む）。依存 = f-mark（f-stop と並べて流せる）。拠る = 要件 FR9・器の答え（busy はふつうの断り・器の id の決まり）。
      c-summary-design（M）: 電文の節点に行の位置と 2 つの概要（plain と eng）の欄を足し、folio graph --print --summary の字を id と file の同じ節点に写す中核の関数 add_summary を置く。file = contract/graph.rs と契約の snapshot・core/graph/build.rs と、節点を struct の字で組む着地済みの歯 5 つ（contract_form・gview・nodepage・mapgraph・itemlink）。依存 = なし（folio2 の --summary は着地済み・席の folio は 0fb780e）。拠る = 席の決め（走査を置かない）・要件 FR15。
      c-summary-wire（S）: server と tz graph が設計の索引を --print に加えて --summary でも読み、その字を中核の add_summary に渡して、口 /api/graph・/api/graph/view・/api/around と tz graph の節点に行の位置と 2 つの概要を載せる（--summary を読めない folio では 3 つの欄は null のまま・グラフは落とさない）。file = boundary/server/design.rs・boundary/server/board.rs・boundary/cli/graph.rs と着地済みの歯 4 つ（server_read・server_view・server_coalesce・kcli）と置き場だけの歯 hbconf。依存 = c-summary-design（同じ波のノート）。拠る = 要件 FR15。
      保留の 1 行。
      f-gate（M）: 問いの起票の門 tz hook question-gate（1 段・4 種・hub を除く・30 越えは まだ分からない・止めるときは処分の無い id を全部名指す・要約値が古ければ止める）。file = core/gate.rs（新）・core/lib.rs・boundary/hook/mod.rs・boundary/hook/question_gate.rs（新）・boundary/lib.rs・boundary/main.rs・tests/fixtures/guard の fixture（新）。依存 = srs の直し（FR4 と AC6・main に在る）と f-stop の着地（hook の dir）。門は器の runner に写った plugin でも効く（runner の見張りとして望ましい）。拠る = t3-hub.55.2・要件 FR4・受入 AC6。
      project board（傘 g）の続き。第 7 波（起草中・1 つか 2 つのノート）は g-card-adopt-a・g-tip-expert・g-seat-split・g-mode-store と h-cards-sess・h-cards-proj と c-acct-thr・c-q-blocking の 8 行。
      g-card-adopt-a（S）: pipeline の札と次の一手の大きい箱の題に節点の card。file = surface/project/pipeline.rs・surface/project/next.rs。依存 = g-card-node。拠る = 見本・要件 FR14。
      g-card-adopt-b（S）: 問いの card の題とこれまでの決定の行に節点の card。file = surface/project/ask.rs・surface/project/askpage.rs。依存 = g-card-node。拠る = 見本・要件 FR14。
      g-card-adopt-c（S）: 台帳の epic の行と抜けの検査の名指しに節点の card。file = surface/project/ledger.rs・surface/project/gaps.rs。依存 = g-card-node・g-ledger-card（epic の行の link）。拠る = 見本・要件 FR14。
      g-tip-expert（S）: 経験者だけの注釈（見本の data-tip-expert）を注釈の層に足し、問いの投稿の時刻・束の重なり・抜けの検査の要約に使う。file = surface/widgets/help.rs・surface/project/gaps.rs・surface/project/batch.rs（見込み）。依存 = なし。拠る = 見本・要件 FR14。
      g-map-tips（S）: グラフの切れ目と表の cell の経験者の注釈、SRS と run の 0 件の帯の card。file = surface/mapview/graph.rs か graph/dom.rs・surface/mapview/table.rs・surface/mapview/compact.rs。依存 = g-tip-expert・g-card-node。拠る = 見本・要件 FR14。
      g-tick-adopt（S）: 問いの経過・pipeline の札の経過・次の一手の質問の経過を 1 秒の時計で書き直す（席の since は c-seat-tick が持つ）。file = surface/project/ask.rs・surface/project/pipeline.rs・surface/project/next.rs。依存 = なし（g-tick は着地済み）。拠る = 見本・要件 NFR2。
      g-seat-split（S か M）: surface/project/seat.rs の DOM の部分を block の dir の外の新しい file へ移す（中身は変えない・project の下に file を足すと block に数えられるので置き場は起草で決める）。依存 = なし。拠る = 作法 8（受付の上限）。
      c-seat-tick（M）: 席の card に tick の経過と状態の語、面に tick healthy と秒と席の since の毎秒の書き直し。file = contract/seat.rs・core/seat.rs・surface/project/seat.rs（割った後の file）。依存 = g-seat-split。拠る = 見本・要件 FR12。
      c-seat-grace（M）: 席の card に移動の猶予の終わり・待ち・断り・逼迫の窓、面の状態の帯に残り秒と待ちと断りと逼迫の行。file = contract/seat.rs・core/seat.rs・boundary/server/seat.rs・surface/project/seat.rs。依存 = g-seat-split。拠る = 見本・t3-hub.53.8（逼迫の行）・要件 FR12・規則の行 R-22。
      c-seat-group（M）: 席の card に群の project と登録の口座と一致、群の chip に card。file = contract/seat.rs・core/seat.rs・surface/project/seat.rs。依存 = g-seat-split。拠る = 見本・要件 FR12。
      g-seat-thr（S）: 席の block の窓の棒に閾値（cap）の印。file = surface/project/seat.rs。依存 = c-seat-grace（席の card の窓の閾値）。拠る = t3-hub.53.8・規則の行 R-22。
      g-seat-hb（M）: project board の席の block に停止の切り替えと確かめの段（account の heartbeat の純粋な関数を使い回す）。file = surface/project/seat.rs（と server の口の守り・見込み）。依存 = g-seat-split。拠る = 見本・要件 FR12・受入 AC10。持ち主待ち: どの project board からも停止の POST を受けてよいか（問いはまだ置いていない）。
      c-q-blocking（S）: 問いの card の電文に止めている便の id の列、card に止めている数の chip。file = contract/question.rs・core/question.rs・surface/project/ask.rs。依存 = g-ask-around。拠る = 見本・要件 FR6。
      g-summary（S）: 一覧の面の要旨・節点の頁の 2 つの概要と出所の file と行・card の概要。file = surface/mapview/list.rs・surface/project/node.rs・surface/widgets/nodecard.rs。依存 = c-summary-wire・g-card-node。拠る = 見本・要件 FR15・規則の行 R-19。
      c-dn-rows（M）: 設計ノートの行を節点に、design と ruled_by の辺を組む。file = core/graph/build.rs。依存 = folio の索引に設計ノートの行と ruled_by の材料が載ること（6 節・tsuzuri は設計文書の YAML を走査しない）。拠る = 要件 FR2・判断の記録 ADR-7 決定 (2)。
      c-summary-ledger（M）: bead の要約を節点の概要に写し、概要の無い節点を床が数える。file = core/graph/build.rs・core/ledger（見込み）。依存 = c-summary-design。拠る = 要件 FR15・受入 AC12。持ち主待ち: 台帳のどの欄を要約とするか（問いはまだ置いていない）。
      c-updated（S）: 節点に更新の時刻、一覧の面に更新の列と並べ方。file = contract/graph.rs・core/graph/build.rs・surface/mapview/list.rs。依存 = c-summary-design。拠る = 見本・要件 FR5。
      g-dn-group（S）: 地図の圧縮の面の design-note の帯をノートごとの見出しに分ける。file = surface/mapview/compact.rs。依存 = c-dn-rows・g-map-tips。拠る = 見本・要件 FR5。
      c-g3g7（M）: 裁定の節点と ruled_by の辺を材料に不変条件 g-3 と g-7 を数える（受入 AC5 の前半）。file = core/graph/check.rs。依存 = c-dn-rows。拠る = 席の決め（rc 2 のまま）・要件 FR3・受入 AC5。
      c-g9（M）: 本文で名指した id が欄か辺にも在るかを数える（不変条件 g-9・規則の行 R-17 と同じ見方・2 周の実測の後に落とす側へ）。file = core/graph/check.rs。依存 = なし（材料の本文の出所は c-dn-rows と同じく folio の索引を待つ）。拠る = 席の決め・要件 FR3。
      c-unref-kinds（M）: 未反映の一覧の裁定（処分の宣言の無い裁定）と要望の 2 種を数える。file = core/ledger/unreflected.rs（見込み）。依存 = c-g3g7。拠る = 要件 FR13・受入 AC12。
      c-next-effect（S）: 次の一手の発効待ちを判じる。file = core/next_step.rs。依存 = c-unref-kinds。拠る = 要件 FR11・規則の行 R-24。
      g-mode-store（S）: mode をその browser に残す（両方の board・見本の tz-mode・URL の mode が先）。file = 保存の字を持つ新しい module（src/account の外・見込み）・surface/board.rs・surface/account/board.rs・surface/lib.rs・crates/tsuzuri-surface/Cargo.toml（web-sys の feature の Storage と StorageEvent を足す・package は増えない）。依存 = なし。拠る = t3-hub.52.16・要件 FR1。
      g-seatpill（M）: header の席の pill と席の card（home の頁のほか）。file = surface/board.rs・surface/frame.rs と header の snapshot。依存 = なし。拠る = 見本・要件 FR12・FR14。
      g-back-note（S）: 窓を閉じられないときの戻るの注記と、開いた窓の一覧の閉じの印。file = surface/board.rs。依存 = なし。拠る = 見本・要件 FR1。
      g-coach（M）: 初心者の最初の案内（home の 3 段・済み印を browser に残す・?coach=1 で出し直す）。file = surface/widgets/coach.rs（新）・surface/widgets/mod.rs・surface/board.rs。依存 = g-mode-store（保存の module）。拠る = t3-hub.52.16・見本・要件 FR1。
      account board（傘 h）の続き。
      h-cards-sess（S）: session の行と run の行に card。file = surface/account/session.rs。依存 = なし。拠る = 見本・要件 FR14。
      h-cards-proj（M）: 各 project の表の要対応・台帳・run の数・orchestrator・口座の欄と群の見出しに card（見本の nx・led・pcnt・seat・gproj・group）。file = surface/account/projects.rs。依存 = なし（file が上限に近ければ先に割る）。拠る = 見本・要件 FR14。
      h-cards-nx（S）: HOME の次の一手の並びの行と群の枠の project の chip に card（見本の nx と gproj・組み手は h-cards-proj のものを使う）。file = surface/account/home.rs。依存 = h-cards-proj。拠る = 見本・要件 FR14。
      h-cards-led（S）: 台帳の表の project の欄に card（見本の led・組み手は h-cards-proj のものを使う）。file = surface/account/ledger.rs。依存 = h-cards-proj。拠る = 見本・要件 FR14。
      h-sort-hist（S）: 並べ方の押しを履歴の 1 歩にする（見本の pushState）。file = surface/account/session.rs・surface/account/ledger.rs・surface/account/projects.rs。依存 = なし。拠る = 席の決め（見本どおり）・要件 FR1・NFR1。
      h-win-store（S）: 開いた窓の一覧をその browser に残し、ほかの tab の変化を storage の event で受ける（見本の tz-wins）。file = surface/account/windows.rs と着地済みの歯 acctwin（保存の字の見張りを直す）。依存 = g-mode-store（保存の module）。拠る = t3-hub.52.16・要件 FR1。
      c-acct-thr（M）: account の電文に窓ごとの閾値（器の rules 行の写し）と、群の候補が門で落ちた理由と逼迫と断りの移動の行（器の event の写し）を足す。file = contract/account.rs・core/account/host.rs・boundary/acct.rs・tests/fixtures/account/acct-doc.json。依存 = なし。拠る = t3-hub.53.8・規則の行 R-22・要件 FR12。
      h-thr-home（M）: HOME の窓の棒に閾値の印、群の枠に逼迫の窓の段と hot の印と候補の断りの理由、移動の段に逼迫と断りの行。file = surface/account/home.rs と着地済みの歯 accthome（逼迫の印が無いことの見張りを直す）。依存 = c-acct-thr。拠る = t3-hub.53.8・見本・要件 FR12。
      e-acct-qopen（M）: 各 anchor の台帳の open の問いの数を project の行の決定待ちとして電文に載せる（読むだけ）。file = contract/account.rs・core/account/project.rs・boundary/acct.rs・tests/fixtures/account/acct-doc.json。依存 = なし。拠る = t3-hub.53.9・要件 FR13。
      e-acct-unref（M）: 各 anchor の台帳と design-intent の未反映の数を project の行に載せる（読むだけ・読めない種類は まだ分からない）。file = contract/account.rs・core/account/project.rs・boundary/acct.rs と fixture。依存 = なし。拠る = t3-hub.53.9・要件 FR13。
      h-acct-cols（S）: 各 project の表の決定待ちと未反映の列、台帳の表の未反映の列を「―」から数にする。file = surface/account/projects.rs・surface/account/ledger.rs。依存 = e-acct-qopen・e-acct-unref。拠る = t3-hub.53.9・要件 FR13。
      c-dormant（S）: 電文の休止中の席の列を埋める（今は常に空）。file = core/account/project.rs（見込み）。依存 = なし。拠る = t3-hub.53.10・要件 FR12。休止の閾値の出所（器の rules 行か doctor の値か）は起草で確かめる。
      h-dormant（S）: header に休止中の chip と card。file = surface/account/board.rs。依存 = c-dormant。拠る = t3-hub.53.10・見本・要件 FR12。
      c-acct-spark（M）: 口座の行に 7 日の使用量の列と最後に測った時刻（器の event log の AllowanceMeasured の写し）。file = contract/account.rs・core/account/host.rs・boundary/acct.rs と fixture。依存 = なし。拠る = t3-hub.53.10・要件 FR12。
      h-acct-spark（S）: HOME の口座 × 窓の表に spark の列と測った時刻の列。file = surface/account/home.rs。依存 = c-acct-spark。拠る = t3-hub.53.10・見本・要件 FR12。
      面の server（傘 e）の続き。
      e-deliver-busy は決着して第 6 波の行 f-mark・f-stop・f-mark-serve に入れた（器の答え・下の 6 節）。
      e-signal（S）: 問いの合図から SSE まで 200 ミリ秒の速い道。file = boundary/server/events.rs。依存 = f-gate（合図を誰が書くか）。拠る = 要件 NFR2・規則の行 R-21。
      e-revoke（M）: POST の取り消しの口（新しい裁定が前の id を名指して問いを open に戻す）。file = boundary/server/routes の新しい file・contract/ledger.rs（台帳への書きの enum）・boundary/server/ruling.rs。依存 = なし。拠る = 要件 FR7・受入 AC3。持ち主待ち: 見本に置き場の無い取り消しの button をどこに置くか（問いはまだ置いていない）。
      e-approval-event（M）: 裁定ごとの逐語つきの承認の event を器の event log に書く。file = boundary/server/ruling.rs。依存 = なし。拠る = 要件 FR9・受入 AC1。器待ち: どの器の口が event を書くか。
      席の hook（傘 f）の続き。
      f-gate-install（S）: 門を plugin/hooks/hooks.json の PreToolUse（matcher Bash）に足す（f-stop の Stop の隣）。file = plugin/hooks/hooks.json。依存 = f-gate・f-stop。拠る = t3-hub.55.3・器の答え（hook の入れ先 23:3xZ）。
      f-deliver（M）: 配達の hook が裁定の逐語を注入する（f-stop と同じ印を使い、次の tool の呼びでも拾う）。file = boundary/hook/deliver.rs（新）・boundary/hook/mod.rs・boundary/main.rs。依存 = f-stop・f-gate。拠る = 要件 FR9。
      f-undelivered（M）: 裁定から 2 分で席の受けが無ければ面に「席に届いていない」。file = server の読み（見込み）と surface/project/ask.rs・surface/project/next.rs。依存 = f-mark（席の受けの材料は f-stop と f-mark-serve が置く配達済みの印・器の seat deliver の rc は使わない）。拠る = 要件 FR9・規則の行 R-21。
      tz の口（傘 k）の続き。
      k-parity（M）: folio の 11 の口を同じ名の tz の subcommand にし、終了 code と出力を合わせ、tz inject と folio という名の binary が無いことを歯で見る。file = boundary/cli の新しい file・boundary/main.rs（見込み）。依存 = folio の code の持ち込み（判断の記録 ADR-4）。拠る = 要件 FR17・受入 AC14・判断の記録 ADR-8。
      持ち主の決め待ちの傘（行の割りは決めの後）。
      i-1〜i-4（S か M）: 端末の一覧の読み・起動の引数・CDP の命令の列・届かない端末の配信。file = boundary/stage の新しい file。拠る = 要件 FR16・受入 AC13。持ち主待ち: 端末の宣言・ssh・Chrome の専用の profile。
      j-runner（M）: 受入 12 条の runner（全画面 × 2 幅 × 2 mode・12 条ごとに 1 件仕込んだ fixture・report）。file = xtask の新しい file と tests の fixture。依存 = g と h の残りの多く。拠る = 要件 NFR1・受入 AC9・規則の行 R-23。持ち主待ち: 外の依存（headless の browser か CDP か、行 i の使い回しか）。
  - n: 5
    type: prose
    title: 並べ方（同じ file を書く行は直列・上限に近い file）
    body: |
      並べる決まり: 書く file が互いに重ならず、依存が着地していて、持ち主と器と folio2 の答えを待たない行は同じ波で並べて走る。同じ file を書く行は同時に流さない（器も同じ file の行を直列にする）。下の並びは今の見込みの順で、待ちの解けた行から先に流してよい。
      contract/seat.rs と core/seat.rs: c-seat-tick → c-seat-grace → c-seat-group。
      surface/project/seat.rs: g-seat-more → g-seat-split → c-seat-tick → c-seat-grace → c-seat-group → g-seat-thr → g-seat-hb。
      contract/graph.rs と core/graph/build.rs: c-summary-design → c-dn-rows → c-summary-ledger → c-updated。
      core/graph/check.rs: c-g3g7 → c-g9。core/ledger/unreflected.rs と core/next_step.rs: c-unref-kinds → c-next-effect。
      core/account/project.rs: c-limit-pipe → e-acct-qopen → e-acct-unref → c-dormant。
      contract/account.rs と boundary/acct.rs と tests/fixtures/account/acct-doc.json: h-board-url → c-acct-thr → e-acct-qopen → e-acct-unref → c-acct-spark。core/account/host.rs: c-acct-thr → c-acct-spark。
      surface/project/ask.rs: g-ask-around → c-q-blocking → g-card-adopt-b → g-tick-adopt → f-undelivered。surface/project/askpage.rs: g-hist-ruling → g-card-adopt-b。
      surface/project/pipeline.rs と next.rs: g-card-adopt-a → g-tick-adopt → f-undelivered。
      surface/project/ledger.rs: g-ledger-card → g-card-adopt-c。surface/project/gaps.rs: g-tip-expert → g-card-adopt-c。
      surface/widgets/help.rs: g-help-sym → g-tip-expert。surface/widgets/mod.rs: g-card-node → g-coach。
      surface/mapview/compact.rs: g-card-node → g-map-tips → g-dn-group。surface/mapview/list.rs: g-card-node → g-summary → c-updated。surface/project/node.rs: g-title → g-summary。
      surface/board.rs: g-title → g-mode-store → g-seatpill → g-back-note → g-coach。surface/account/board.rs: g-mode-store → h-dormant。
      surface/account/session.rs: h-sess-axis → h-cards-sess → h-sort-hist。surface/account/projects.rs: h-cards-proj → h-sort-hist → h-acct-cols。surface/account/ledger.rs: h-cards-led → h-sort-hist → h-acct-cols。
      surface/account/windows.rs と歯 acctwin: h-board-url → h-win-store。surface/account/home.rs と歯 accthome: h-thr-home → h-cards-nx → h-acct-spark。
      boundary/main.rs と boundary/lib.rs と boundary/hook/mod.rs: f-stop → f-gate → f-deliver → k-parity。boundary/server/ruling.rs: f-mark-serve → e-revoke → e-approval-event。core/lib.rs: f-mark → f-gate。plugin/hooks/hooks.json: f-stop → f-gate-install。
      着地済みの歯の file も、期待を直す行が 2 つ在れば同じく直列にする（例: 歯 server_ask と server_batch は f-mark-serve、歯 contract_form と snapshot は c-summary-design → c-q-blocking の順に直す）。
      上限に近い file（受付の上限は 1 file 1500 行・流す前に行数と大きさの余白の和を確かめ、越えるなら先に割る行を置く）: surface/project/ledger.rs・surface/mapview/graph.rs・surface/account/projects.rs・surface/account/home.rs・surface/project/seat.rs。project/seat.rs は後に M の行が 3 つ続くので g-seat-split を先に置いた。account/projects.rs と account/home.rs は h-cards-proj と h-thr-home を流す前に確かめる。surface/project の下は block の dir で、file を足すと build.rs が block に数えるので、割った中身の置き場は block の dir の外にする。
      第 6 波 = f-mark・f-stop・f-mark-serve・c-summary-design・c-summary-wire（ノート surface-wave6・f-stop と f-mark-serve は f-mark の後に並べて走る）。第 7 波（起草中）= g-card-adopt-a・g-tip-expert・g-seat-split・g-mode-store・h-cards-sess・h-cards-proj・c-acct-thr・c-q-blocking（c-q-blocking は c-summary-design の後）。f-gate の書き直しは f-stop の着地の後に起草する。1 つのノートは 10 行まで（7 節）。
  - n: 6
    type: prose
    title: 他の席を待つもの
    body: |
      folio2: folio graph --print --summary（JSON Lines・欄 id・kind・file・line・title・plain・eng・無ければ null・eng は shall・text・what・decision の最初、条は最初の規範文、受入基準は題の全文）。folio2 の要件 FR14 の字の変更に持ち主の承認が 1 回要り、folio2 が自分の問いとまとめて問う。着地の知らせの後に c-summary-design を書き直し、その後に c-summary-wire・g-summary・c-summary-ledger・c-updated の列が動く。
      器（scribe2）の要件 FR50（着地の終端）: 列車の先端でない便が ci の測れない終わりで止まり bead が閉じない欠陥の直しが効くまで、先端の CI が success で自分の sha が祖先なら席が手で閉じる（道具 close-unmeasurable の見張り）。直しが効いたら見張りを外す。
      器（scribe2）の答え（2026-09-27T23:0xZ・決着）: 器は裁定を queue しない。seat deliver は待ちで入力欄が空の席にだけ 1 回送り、考え中なら型付きの理由で断る（器の FR79・ADR-0077）。考え中の席へは消費側（tsuzuri）の停止の hook が拾う（ADR-0077 CTX2・CSQ-N3）。再送は要らない。board の「届いていない」は hook の配達済みの印で決める。→ 行 f-stop。f-stop の着地までは席が台帳から裁定を読む。
      器（scribe2）の答え（2026-09-27T23:3xZ・決着）: 停止の hook と門の hook の入れ先は、tsuzuri の repo の根に追跡される plugin/（.claude-plugin/plugin.json と hooks/hooks.json）。scribe2 seat が起こす席は --plugin-dir で読む。答えの「runner には載らない」は誤りで、器は便ごとに worktree の plugin を runner の plugin の dir に写す（scribe2 24aaa5a の pipe/spawn.rs の copy_plugin・席が確かめ器に伝えた・lens には載らない）。そこで停止の hook は repo が git の worktree なら黙り、門の hook は runner でも効く前提で書く。f-stop が Stop を、f-gate-install が門の PreToolUse を同じ hooks.json に足す（裁定 t3-hub.55.3・門の着地の後）。器の Idle の打刻が hook の続けの間に古くなる件と、同じ anchor に席が 2 つ在る件は器の memo s2-07l.723 に在る。
      器（scribe2）の答え（2026-09-28T00:0xZ・決着）: seat deliver の --ruling は 1 回に id 1 つ（64 byte まで・英数と . - _ :）。束の id（batch:…）も形を通るので、束は束の id で 1 度だけ送る（行 f-mark-serve）。束の 2 つ目の配達は、1 つ目の注入で席が考え中になり断られた（2026-09-27T23:57Z の実物）。
      器（scribe2）にまだ問うこと: f-undelivered の席の受けとする event・e-approval-event の event を書く口。
      文書の運用の強制の 5 段（判断の記録 ADR-14）: 段 1（床の形は folio2・実在は器）・段 2（folio2 の鍵の行と計画の索引の生成・tsuzuri は鍵の行で加わる）・段 3（器）・段 4（器と folio2）・段 5（器）。各席の判断の記録の id と着地の順を受けたらここに書き、着地した段から加わる。folio2 の分は bead f2-648.267・判断の記録 folio2 ADR-31（folio2 の要件 v1.53 と合わせ folio2 の持ち主の承認を先に取る・条 P-12.1）。順は 渡し A（段 1 の床の形）→ 渡し B（段 2・規則の行の欄 key の新しい値・仮の名 plan-note）→ 渡し C（段 4 の folio の分・design-intent が引く裁定 id の書き出し）。器の分は memo s2-07l.722（器の判断の記録の番号は着地で付く）。順は publish-guard（器の FR80）の着地の後に、器の判断の記録 1 本 → 器の要件の改訂 → 段 5 → 段 1 → 段 4（doctor の行と tick の警報 → dispatch の断り → 着地の比べ）→ 段 3（folio2 が床の終了の約束を決めた後）。
      持ち主にまだ問うこと（台帳の問いはまだ置いていない・行を起草する前に 1 問ずつ置く）: g-seat-hb（どの project board からも停止の POST を受けてよいか）・c-summary-ledger（台帳のどの欄を要約とするか）・e-revoke（取り消しの button の置き場）・j-runner（外の依存）・i（端末の宣言・ssh・Chrome の profile）。
      folio2 にまだ問うこと: 索引に設計ノートの契約表の行と、承認欄と規則の行の裁定の欄から導く ruled_by の材料を載せるか（行 c-dn-rows・c-g3g7・c-g9 の材料・tsuzuri は設計文書の YAML を走査しない）。
      folio の code の持ち込み（判断の記録 ADR-4・制約 CON2 の出口）: k-parity の前提。
  - n: 7
    type: prose
    title: 運び方（計画 → 波のノート → 器）と、この文書を直す時
    body: |
      段 1（計画）: 行はまずこの文書の 4 節に 1 行で足す（id・大きさ・何を・書く file・依存・拠る裁定）。持ち主の決めが要る行は、台帳に問いを置き（board の質問の頁）、裁定が付くまで起草しない。
      段 2（起草）: 席の作業場で行の契約の字と節を起草する（作法は 3 節）。行ごとに事前の点検の agent を撃ち、design-intent の写しで folio check と folio derive の --write と --check を回して合格と差分 0 を見る。
      段 3（波のノート）: 並べてよい行（5 節）をまとめて波のノート surface-wave<N> に置く。章の上限は規則の行 R-26（40 章 以下）。波のノートは小さく保ち、1 つのノートは 10 行までにする（審査と点検の単位を小さくするため）。置くのは設計の worktree と commit の道具（folio の schema と check と derive を回す）で行い、main の checkout では file を編集しない。
      段 4（器）: 行ごとに契約 bead を置き（pointer は design = contracts/<ノート>.toml#<行 id>）、受付の前の点検の後に流す。審査で差し戻されたら審査の材料を読み、足りない材料を節に足して流し直す。
      段 5（着地の後）: 器の着地の event を確かめてから xtask の check・push・bead を閉じる・台帳の push。server を組み直して実物の画面を見る。
      この文書を直す時: 持ち主の裁定が付いた時（3 節と、効く行の 4 節）・着地の束の後（2 節の現在地と、着地した行を 4 節から外す）・新しい行を足す時（4 節が先・5 節の順も）・他の席の答えが来た時（6 節と効く行）。直すたびに meta の version を上げ、generated をその日にする。
      発効の後の直し: 3 節の決定と 4 節の行の足し引きは持ち主の裁定か席の決めの出所を書いて直す。持ち主の裁定の逐語はこの文書に写さず、裁定 id だけを書く。
