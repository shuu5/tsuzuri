        ruling: "t3-hub.1（裁定 id = user 2026-09-28T00:4xZ・チャットの指摘の記帳）"
      - id: d19
        text: "問いの頁の block「全体への指示」から範囲の切り替え（この論点）を外し、範囲はつねに全体にする（個々の問いへの答えは各問いの頁で足りる）。見本 mock v3 を変える決めだが、持ち主の直の指示で選び肢が無いので問いを置かない。効果: 行 g-policy-all（第 9 波）と、srs v0.11 の要件 FR8 の note（画面はつねに範囲 全体 を送り、この論点の札は server の受けとして残る）。"
        ruling: "t3-hub.1（裁定 id = user 2026-09-28T01:2xZ・チャットの指摘の記帳）"
      - id: d20
        text: "案 A（最初の PC は持ち主の 1 台）に足して、表示先の PC を設定として持ち、setup の skill か席との対話で最初に決め、いつでも変えられ、2 つの board の設定の画面（最後は tz の口に帰す）で project ごとにも全部の一括にも替えられるようにする。推奨の A（器の行を書くだけ）より広い。席の読み（台帳 t3-hub.59 の notes）: 層 A = どの PC が在るか（器の host の面の [[device]]・書くのは持ち主か器の席・持ち主が画面から PC を足す口は器の memo s2-07l.727 の後）、層 B = どの project をどの PC に出すか（tsuzuri 自前の追跡されない設定・値は層 A の名だけ）。効果: 判断の記録 ADR-15 の決定 (1)〜(3)・srs の要件 FR16 の字（v0.10）・行 i-7・i-8・i-9。最初の PC の行は、器の欄 display-env（器の memo s2-07l.726）の着地の後に器の席が書く。"
        ruling: "t3-hub.59.1（裁定 id = t3-hub.59.1:20260928T0120Z-1）"
      - id: d21
        text: "案 A。席専用の Chrome の profile を各 PC のホームの下の ~/.cache/tsuzuri-stage に作る（値は層 A の行の profile-dir に書き、code に既定の dir を持たない・T4）。効果: ADR-15 の決定 (4)・行 i-2・i-9 の案内。"
        ruling: "t3-hub.59.2（裁定 id = t3-hub.59.2:20260928T0127Z-1・束 batch:20260928T0127Z-1）"
      - id: d22
        text: "案 B。開発中の app の上では click と入力もしてよく、board の origin の上では見せるだけにして click・入力・key の命令を歯で断る（T7）。任意の JavaScript を撃つ口は持たない（T6）。効果: ADR-15 の決定 (7)・行 i-5 の守りが確定。"
        ruling: "t3-hub.59.3（裁定 id = t3-hub.59.3:20260928T0127Z-1・束 batch:20260928T0127Z-1）"
      - id: d23
        text: "ssh の届かない端末（スマホ）は URL を渡すだけにし、席はその browser を操作しない。配信の窓は v2 の候補（専用のスマホの app の案と同じ所）。推奨の A（配信の窓を board の後に作る）とは違う。効果: 判断の記録 ADR-15 の決定 (5)（ADR-5 決定 (3) の置き換え・ADR-5 は発効のまま）・srs の要件 FR16 と受入 AC13 の字と scope の not_build（v0.10）・傘の行 i の字（surface-board の第 0.21 版）。行 i-4（server 側の headless は席の目・持ち主へは URL・host の名は実行の時に組む）・行 i-6 を 4 節から外す（6 節の v2 の候補）。"
        ruling: "t3-hub.59.4（裁定 id = t3-hub.59.4:20260928T0123Z-1）"
      - id: d24
        text: "窓を前に出さず、知らせだけを出す。sway では最初の 1 回だけ今見ている仮想の机に開き、その後は動かさない。Windows と mac の知らせだけの形は急がない。推奨の B（問いと「見て」の時だけ前に出す）は退けられた。効果: ADR-15 の決定 (6)・行 i-2（起こすのは表示先に初めて見せる時と持ち主が頼んだ時だけ・閉じた窓は開き直さない＝t3-hub.59.7）・i-3（前に出す・動かす・新しい窓の命令を持たない歯）・i-5・i-10（知らせ）・i-11（board の知らせ）。"
        ruling: "t3-hub.59.5（裁定 id = t3-hub.59.5:20260928T0126Z-1）"
      - id: d25
        text: "案 A。表示面の 5 つの答えをまとめた判断の記録 ADR-15 と、要件 FR16 と受入 AC13 の書き換えをこのまま承認。効果: ADR-15 が発効（ADR-5 決定 (3) の置き換え・ADR-5 は発効のまま）・srs v0.10（要件 FR16・受入 AC13・scope の not_build）・傘の行 i の字（設計ノート surface-board の第 0.21 版）・表示面の行の拠りに ADR-15 を戻した。"
        ruling: "t3-hub.59.6（裁定 id = t3-hub.59.6:20260928T0249Z-1・束 batch:20260928T0249Z-1）"
      - id: d26
        text: "案 B。持ち主が窓を閉じた後は開き直さず、知らせと URL だけを出す。開くのは持ち主が tz の口か board の button で頼んだ時だけ。効果: ADR-15 の決定 (6)・要件 FR16 の字・行 i-2（窓を起こしてよいかは呼ぶ側が渡す）・i-5（持ち主が窓を開く口 tz stage open）・i-7（初めて見せた印を層 B の置き場に持つ）・i-8（board の開く button）。"
        ruling: "t3-hub.59.7（裁定 id = t3-hub.59.7:20260928T0249Z-1・束 batch:20260928T0249Z-1）"
      - id: d27
        text: "台帳の読みが一時的に落ちても、最後に読めた中身を 60 秒まで出し続け、出している中身が 15 秒より古くなれば一番上の header に読み込み不良の注意の印を出す（推奨の A = 15 秒の持ち回しとは違う）。効果: srs の要件 NFR2 の「読めないときは測れていないと出す」の字と、60 秒と 15 秒を規則の行 R-21 に足す直し（srs v0.11 と R-21 は第 9 波の便を器へ出す前に main へ入れる）。行 e-hold（server が最後に読めた字を持ち、落ちた応答の頭に古さの秒を載せる）と g-fresh（面が注意の印を出し、60 秒で諦める）。同じ問いの技術に書いた、問いの一覧をその場で更新して書きかけの答えと scroll を守る形は、問わずに入れる（行 g-keyed）。閉じた見張り t3-hub.53.2（負荷の時に account board の台帳が測れていないに落ちる）は e-hold の持ち回しが引き継ぐ。"
        ruling: "t3-hub.52.38（裁定 id = t3-hub.52.38:20260928T0154Z-1）"
      - id: d28
        text: "変化の知らせのつながりの切れも t3-hub.52.38 と揃える（推奨の A の形に t3-hub.52.38 の値を当てる）。つながりが切れても中身を残し、出している中身が 15 秒より古くなれば t3-hub.52.38 と同じ 1 つの注意の印を出し、60 秒を越えたら今のとおり全部の口を まだ分からない にする。効果: 行 g-fresh（つながりの切れと読みの落ちを 1 つの古さで数える）と g-pulse（推奨の A の技術に在った読みの間の短い脈）。"
        ruling: "t3-hub.52.39（裁定 id = t3-hub.52.39:20260928T0155Z-1）"
      - id: d29
        text: "配布の file の圧縮のために外の部品か道具を 1 つ足してよい（推奨の C = 今は足さない、とは違う）。条 A-3（外の依存の増減の持ち主の確認）の裁定 id として引く。効果: 行 g-gz（M・e-cache の後）。足すのは xtask の直接依存 miniz_oxide の 1 本で、境界の crate と面の crate の依存は増えない（形は下の席の決め）。問わずに入れると問いに示した g-strip もこの問いに拠る。"
        ruling: "t3-hub.52.40（裁定 id = t3-hub.52.40:20260928T0156Z-1）"
      - id: d30
        text: "2 つの board が重い（project board は 00:4xZ の記帳の重さの項〔2026-09-28T03:0xZ に逐語を足した〕・account board は 00:59Z）・読み直しは要るが画面への出し方を工夫する（01:06Z）。持ち回しの上限と注意の印と圧縮の部品は問い t3-hub.52.38〜.52.40 に出して裁定を受けた。効果: 4 節の性能の 14 行はこの記帳と 3 つの裁定に拠る。"
        ruling: "t3-hub.1（裁定 id = user 2026-09-28T00:4xZ・user 2026-09-28T00:59Z・user 2026-09-28T01:06Z・チャットの指摘の記帳）"
      - id: d31
        text: "地図のグラフは、上限から溢れた節点を出さないのでなく、組を作って畳む手段で全体を見せる。席の読み（問いの notes 2026-09-28T04:2xZ）: 黙って切る節点を無くし、どの節点も見えている組のどれかに畳む（図の切りは通常 0）。組の段は、憲法は条の系 → 条 → 規範文、規則は規則行の組、要件書は種類ごとの組（受入基準は検める要件へ畳む）、判断の記録は 1 組、設計ノートはノート → 行（folio の索引に載った後）、台帳は epic → task → 走行（問いは親へ・裁定は問いへ＝今の畳みを残す）。最初の図は帯ごとの組の箱と epic で全体を 1 目で見せ、箱に中の数を出す。箱を押すと 1 段開き、もう一度で畳む。40 の上限は見える箱の数の上限として残し、開いて越えるときは古く開いた組から畳み直す（落とさない）。辺は見えている代表へまとめ、数を出す。効果: 行 c-graph-fold（中核と電文と口）と g-graph-fold（面の開き閉じ）・ノート surface-wave10a に置いた（見本 mock v3 の graphModel をグラフの眺めについてだけ改める・srs v0.13 の要件 FR5 に 1 文を足す）。地図のグラフで規則が 0 と出る不具合もこれで消える。"
        ruling: "t3-hub.52.53（裁定 id = t3-hub.52.53:20260928T0412Z-1）"
      - id: d32
        text: "案 A。答えた決定の取り消しは、決定の頁の頭に理由の欄と取り消すの button を置く（見本に置き場が無いので足す決め）。効果: 行 e-revoke の持ち主待ちが解けた（書く file に contract/surface.rs と surface/project/node.rs を足し、台帳への書きの enum に ReopenItem を足す）。"
        ruling: "t3-hub.52.60（裁定 id = t3-hub.52.60:20260928T0441Z-1・束 batch:20260928T0441Z-1）"
      - id: d33
        text: "案 A。受入 12 条の runner は行 i の CDP の口を使い回し、外の依存を足さない（0 本・i-4 の後）。束の閉じが disk の満ち（ENOSPC）で落ちたので、この問いは同じ答えを 2 度受けた。効果: 行 j-runner と傘の行 j の持ち主待ちが解けた（runner だけが使う測りの step を boundary/stage/cdp.rs に足す）。束の途中の落ちの実例から、後の行 e-batch-partial を足した（4 節）。"
        ruling: "t3-hub.52.61（裁定 id = t3-hub.52.61:20260928T0441Z-1・束 batch:20260928T0441Z-1・同じ答えを t3-hub.52.61:20260928T0443Z-1 でもう一度受けた）"
