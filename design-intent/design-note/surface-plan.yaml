  - n: 6
    type: prose
    title: 他の席を待つもの
    body: |
      folio2: folio graph --print --summary（JSON Lines・欄 id・kind・file・line・title・plain・eng・無ければ null・eng は shall・text・what・decision の最初、条は最初の規範文、受入基準は題の全文）。folio2 の要件 FR14 の字の変更に持ち主の承認が 1 回要り、folio2 が自分の問いとまとめて問う。c-summary-design と c-summary-wire はこれを読んで写す形で着地した（第 6 波）。g-summary と c-summary-ledger は第 8 波、c-updated は後。
      器（scribe2）の要件 FR50（着地の終端）: 列車の先端でない便が ci の測れない終わりで止まり bead が閉じない欠陥の直しが効くまで、先端の CI が success で自分の sha が祖先なら席が手で閉じる（道具 close-unmeasurable の見張り）。直しが効いたら見張りを外す。
      器（scribe2）の答え（2026-09-27T23:0xZ・決着）: 器は裁定を queue しない。seat deliver は待ちで入力欄が空の席にだけ 1 回送り、考え中なら型付きの理由で断る（器の FR79・ADR-0077）。考え中の席へは消費側（tsuzuri）の停止の hook が拾う（ADR-0077 CTX2・CSQ-N3）。再送は要らない。board の「届いていない」は hook の配達済みの印で決める。→ 行 f-stop。f-stop の着地までは席が台帳から裁定を読む。
      器（scribe2）の答え（2026-09-27T23:3xZ・決着）: 停止の hook と門の hook の入れ先は、tsuzuri の repo の根に追跡される plugin/（.claude-plugin/plugin.json と hooks/hooks.json）。scribe2 seat が起こす席は --plugin-dir で読む。答えの「runner には載らない」は誤りで、器は便ごとに worktree の plugin を runner の plugin の dir に写す（scribe2 24aaa5a の pipe/spawn.rs の copy_plugin・席が確かめ器に伝えた・lens には載らない）。そこで停止の hook は repo が git の worktree なら黙り、門の hook は runner でも効く前提で書く。f-stop が Stop を、f-gate-install が門の PreToolUse を同じ hooks.json に足す（裁定 t3-hub.55.3・門の着地の後）。器の Idle の打刻が hook の続けの間に古くなる件と、同じ anchor に席が 2 つ在る件は器の memo s2-07l.723 に在る。
