sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      この文書は、見本 mock v3（判断の記録 ADR-7 の承認 user 2026-09-26T07:51Z で確定した仕様）に本番の 2 つの board を揃える残りの仕事の全体の計画を持つ。どの行が残っていて、どの順で流し、何が持ち主の裁定と他の席の答えを待っているかを、この 1 か所で見る。
      傘の行は設計ノート surface-board（g = project board・h = account board・i = 表示面・j = 受入 12 条の測定・k = tz の口）と surface-base（e = 面の server・f = 席の hook と問いの起票の門）に在る。子の行は波ごとの設計ノート（surface-hub・surface-wave3a・surface-wave3b・surface-wave4・surface-wave5a・surface-wave5b・surface-wave6 と、これから置く第 7 波からのノート）に在る。
      決まり 1: 波のノートの行は全部この文書の 4 節（残りの行）から取る。この文書に無い行を波のノートに置かない。
      決まり 2: 新しい行は、まずこの文書の 4 節に足す（id・大きさ・何を・書く file・依存・拠る裁定）。その後に起草して波のノートへ移す。
      決まり 3: 行の契約の字（write-set・verify・done・節の材料）は波のノートが持つ。この文書は 1 行の要約だけを持ち、字が食い違ったら波のノートが正しい（この文書を直す）。
      範囲の外: 要件 FR18（指し示し）・FR19（相談の窓）・FR20（表示面の対象を広げる）は見本 mock v3 に無いので、この計画に入れない。見本に揃えた後に別の計画のノートを置く。
      状態: 下書き。持ち主が board の質問の頁で承認したら発効にする。波のノートの承認は、この計画の承認の裁定 id を継ぐ。
  - n: 2
    type: prose
    title: 現在地（2026-09-28・main 2bc9aa0・台帳の closed と着地の commit で確かめた）
    body: |
      傘の行 g（project board）。着地した子の行: g-min（t3-hub.5）・g-frame（.7）・g-parts（.9）・g-pipe（.11）・g-next（.12）・g-ledger（.13）・g-map（.15）・g-seat（.18）・g-ask（.19）・g-gaps（.21）・g-ledger-fix（.23）・g-graph（.24）・g-node（.26）・g-steady（.28）・g-batch（.32）・g-seat-fix（.33）・g-top-fix（.34）・g-pipe-today（.49）、登録の生成の hs-blocks・hs-pages・hs-derived（.54.5〜.54.7）、第 3 波の g-brand（.52.2）・g-link-map（.52.3）・g-link-graph（.52.4）・g-map-keys（.52.5）・g-link-kcard（.52.6）・g-link-items（.52.7）・g-ask-focus（.52.8）・g-next-act（.52.9）・g-unref-panel（.52.10）・g-seat-axis（.52.11）・g-tick（.52.12）・g-help-fig（.52.13）と中核の c-next-batch（.52.15）、第 5 波の g-node-timeline（.52.17）・g-title（.52.18）・g-card-node（.52.19）・g-help-sym（.52.20）・g-seat-more（.52.21）・g-ledger-card（.52.22）・g-ask-around（.52.23）・g-hist-ruling（.52.24）、第 6 波の中核と境界の c-summary-design（.52.25）・c-summary-wire（.52.26）。
      g の done の (1)(2)(3)(5) は子の行で満ちた。(4) の hover の置き場と猶予を browser の runner で通すのは傘の行 j の runner 待ち。
      g の残り（見本との差と持ち主の指摘）: 節点の hover の card が pipeline の札・次の一手・問いの題・これまでの決定・台帳の epic・抜けの検査の名指しと、地図のグラフ・近傍図・つながりの一覧に無い（地図の札と一覧の題は g-card-node で付いた）。経験者だけの注釈が無い。1 秒の時計は account の session の表だけで、問い・pipeline・席・次の一手の経過は動かない。block「orchestrator と口座」に tick の経過・退避の猶予と待ちと断りと逼迫の帯・群の card・窓の閾値の印・停止の切り替えが無い（詳しくの出所の行と doctor の席の行は g-seat-more で付いた）。問いの card に止めている task の数が無い。header の席の pill・窓を閉じられないときの注記・mode の保存・最初の案内が無い。節点の行の位置と 2 つの概要（要件 FR15）は電文に載った（c-summary-wire）が面が出さず、bead の概要と設計ノートの行の節点と更新の時刻は無い。未反映の一覧の裁定と要望の 2 種と、次の一手の発効待ちは、材料（処分の宣言）が無いので まだ分からない。持ち主の指摘（2026-09-28・3 節）から: 次の一手が質問を上げただけの run を止まっている走行に数えて質問を小さい行に隠す（見本と違う）・当たっている小さい行に link と質問の経過が無い・pipeline の開いた列を畳めない・未反映の注釈の字が project board で意味を成さない・ホームの台帳の一覧に閉じた項目まで出る・地図に葉までたどる全体図が無い・時刻が UTC で出る。
      傘の行 h（account board）。着地した子の行: b-acct（.36）・e-acct-host（.37）・e-acct-proj（.38）・e-acct（.39）・e-acct-hb（.40）・h-frame（.41）・h-home（.42）・h-sess（.43）・h-led（.44）・h-proj（.45）・h-win（.46）・h-hb（.47）・h-wire（.48）・h-look（.53.3）、第 3 波の h-proj-more（.53.4）・h-led-spark（.53.5）・h-popstate（.53.6）、第 4 波の h-cards-home（.53.7）、第 5 波の h-sess-axis（.53.11）・h-board-url（.53.12）と中核の c-limit-pipe（.53.13）。開く button は各 anchor の追跡されない git config の tsuzuri.boardport で開く（席が 4 つの anchor に置いた・2026-09-28）。
      h の done の (1)〜(4) は単体の歯で満ちた（browser の runner は j 待ち）。
      h の残り: session と run と各 project の表に card が無い。並べ方の押しが履歴に積まれない。決定待ちと未反映の欄が「―」。使用量の閾値と逼迫の印と候補が門で落ちた理由が無い。休止中の印と口座ごとの 7 日の小さな図と測った時刻の列が無い。開いた窓の一覧と mode が頁を開き直すと消える。口座が器の宣言の順に並び、退役の口座も出る（t3-hub.53.14）。時刻が UTC で出る（t3-hub.52.28）。
      h で作らないと決めた物: 時点のつまみと関係の頁（t3-hub.53.10）。見張り t3-hub.53.2（負荷の高い時に台帳が測れていないに落ちる）は閉じた（その Failed の便が次の一手の大きい箱を 8 時間取り、持ち主の問いを小さい行に隠していた）。負荷の時の台帳の読みの上限は、project board の重さの調べ（6 節）から起こす行で扱う。
      傘の行 i（表示面）: 着地した子の行は無い。done の (1)〜(4) が全部残る。端末の宣言・ssh・Chrome の専用の profile の決めが持ち主待ち。行の割りを下調べしている（6 節）。
      傘の行 j（受入 12 条の測定）: 着地した子の行は無い。done の (1)〜(4)（12 条ごとに 1 件仕込んだ fixture・現物の全画面で 0・report・面の crate の依存の予算）が全部残る。runner の外の依存（headless の browser か CDP か、行 i の道具の使い回しか）が持ち主待ち。
      傘の行 k（tz の口）: 着地した子の行は k-graph（.55.1）。done の (2)（tz graph --design が設計の索引だけを出す）は満ちた。tz graph --check は今の中核が g-3・g-7・g-9 を測らないので、違反が無くても まだ分からない（rc 2）を返す。残り: (1) folio の 11 の口の終了 code と出力の一致（folio の code の持ち込み〔判断の記録 ADR-4〕の後）と、(3) tz inject が無いこと・(4) folio という名の binary が workspace に無いこと（どちらも今は真で、見る歯が無いだけ）と、g-3・g-7・g-9 を数える行。
      傘の行 e（面の server）: 着地した子の行: e-min（.4）・e-src（.6）・e-read（.14）・e-ask（.17）・e-seat（.20）・e-view（.25）・e-coalesce（.27）・e-batch（.30）・e-reap（.31）・e-runs（.52.14）と、登録の生成の hb-proc・hb-config・hb-route・hb-post（.54.1〜.54.4）。
      e の done の (2)・(3) の前半（古い版の要求を 409 で断る）・(4) は満ちた。残り: (1) 裁定ごとの逐語つきの承認の event を器の event log に書く（今は器の seat deliver を撃つだけ）。(3) の後半の取り消し（新しい裁定が前の id を名指して問いを open に戻す）。(5) 問いの合図から SSE まで 200 ミリ秒（今は 500 ミリ秒の周期の読みだけ）。考え中の席が断った配達（busy）を届ける手は第 6 波の f-mark・f-stop・f-mark-serve で入った。見張りの揺れ（変化 1 回に知らせ 2 件・f-stop の門を落とした）は e-watch-steady（第 7 波）で直す。project board から自分の席の heartbeat を切り替える口は e-seat-hb（第 8 波）。
      傘の行 f（席の hook と問いの起票の門）: 着地した子の行: 第 6 波の f-mark（t3-hub.55.4）・f-stop（.55.5・門の揺れの後に t3-hub.55.7 の裁定で撃ち直して着地）・f-mark-serve（.55.6）。境界の crate に hook の dir が在り、repo の根の plugin/ に停止の hook（Stop）が登録された（席が次に起こし直した時から効く）。done の (2) の 2 経路（待ちの席へは server が器の配達の口を 1 度撃ち、考え中の席は停止の hook が続けさせる）は入った。残り: (1) 問いの起票の門（f-gate と f-gate-install・t3-hub.55.2 の絞りで書き直す）・(3) 裁定から 2 分で届いていないの印（f-undelivered）と、裁定の逐語を注入する配達の hook（f-deliver）。
  - n: 3
    type: prose
    title: 決定（持ち主の裁定と席の決め・出所つき）
    body: |
      持ち主の裁定（逐語は各問いの notes と t3-hub.1 の notes に在り、この文書には写さない）。
      t3-hub.53.1（裁定 id = user 2026-09-27T22:18Z）: 案 A。account の server が各 anchor の追跡されない git config の tsuzuri.boardport から port だけを読み、電文の ProjectRow の board に載せ、面は開いている頁の protocol と hostname に port を足して URL を組む。効果: 行 h-board-url（第 5 波）。前提は全部の board が account board と同じ host に在ること。案 B（起動の引数）は取らず、案 C（1 つの server が全部の board を配る）は複数の process の運用が辛くなったときの判断の記録の候補として残す。
      t3-hub.55.2（裁定 id = t3-hub.55.2:20260927T2233Z-1）: 問いの起票の門の名指しを討論の記録 B §11.3 の絞りにする（1 段・種類は条・規則行・発効した判断の記録・要件の 4 つ・次数 30 を越える hub は除く・処分が 30 を越える問いは まだ分からない で分けさせる）。効果: srs の要件 FR4 と受入 AC6 の字を変える（この文書と同じ束の srs の直し）。行 f-gate を書き直す（台帳の節点は門の集合から外れ、fixture の名指しの例を 4 種の節点に替え、hub と 30 越えの fixture を足す）。
      t3-hub.55.3（裁定 id = t3-hub.55.3:20260927T2233Z-1）: 門の便の着地の後に、席の設定（PreToolUse・matcher Bash）に門を入れる。効果: 行 f-gate-install（f-gate の後）。
      t3-hub.52.16（裁定 id = t3-hub.52.16:20260927T2233Z-1）: mode・account board から開いた窓の一覧・最初の案内の済み印の 3 つを、その browser に残す（便利の写しで正本ではない）。効果: srs の要件 FR1 の字。行 g-mode-store・h-win-store・g-coach。着地済みの歯 acctwin_no_storage_and_wasm_wiring（src/account の下に保存の字が無いことを見る）の期待を変えるか、保存の字を src/account の外の 1 つの module に置く。
      t3-hub.53.8（裁定 id = t3-hub.53.8:20260927T2233Z-1）: 使用量の閾値（窓ごとの cap）と逼迫の印と、移り先の候補が門で落ちた理由を出す。値は器の rules 行と event を写すだけで tsuzuri は判じない。効果: rules 行 R-22 に写し方を足す（同じ束の直し）。行 c-acct-thr・h-thr-home・g-seat-thr と、行 c-seat-grace の逼迫の行（前は持ち主待ち）。着地済みの歯 accthome_no_pressure_marks（HOME に逼迫の印が無いことを見る）の期待を変える。
      t3-hub.53.9（裁定 id = t3-hub.53.9:20260927T2233Z-1）: account board でほかの project の台帳と design-intent を読み（書かない）、決定待ちと未反映の数を出す。効果: srs の要件 FR13 の字。行 e-acct-qopen・e-acct-unref・h-acct-cols。
      t3-hub.53.10（裁定 id = t3-hub.53.10:20260927T2233Z-1）: 休止中の project の印と、口座ごとの 7 日の小さな図（spark）と測った時刻の列だけを作る。時点のつまみと関係の頁は作らない（推奨の A = 休止中の印だけ、とは違う）。効果: srs の要件 FR12 の字と scope の not_build。行 c-dormant・h-dormant・c-acct-spark・h-acct-spark。
      t3-hub.58（裁定 id = t3-hub.58:20260927T2357Z-1・束 batch:20260927T2357Z-1）: 案 A。設計ノートの章の上限を 40 章 以下にする。効果: 規則の行 R-26（key note-chapters）と、席の folio を 0fb780e に替えること（同じ commit 58b16c2）。波のノートは今の運びどおり小さく保つ（7 節）。
      t3-hub.57.1（裁定 id = t3-hub.57.1:20260927T2357Z-1・束 batch:20260927T2357Z-1）: 案 A。文書の運用の強制を、無いと先へ進めない形の 5 段（裁定 id の実在・計画のノートの必須と行の索引の生成・dispatch の時の床の合格・問いの反映先の型と未反映の差・席の役の AskUserQuestion の guard）でこの順に入れる。効果: 判断の記録 ADR-14（tsuzuri は各段が器と folio に着地した順に加わる）。各段は s2 と folio2 の判断の記録と行で入る（6 節）。
      t3-hub.55.7（裁定 id = t3-hub.55.7:20260928T0052Z-1）: 案 A。便 f-stop（t3-hub.55.5）の門を同じ作業場でもう 1 周撃つ（器の regate・落ちたのは f-stop が触らない着地済みの歯の揺れで、契約の赤ではない）。効果: f-stop は撃ち直しで着地した（36ea325）。揺れの直しは別の行 e-watch-steady（第 7 波）。
      t3-hub.52.27（裁定 id = t3-hub.52.27:20260928T0049Z-1）: 案 A。bead の概要は description の「概要 = 」の行を plain に、「技術 = 」の行を eng に写す（問いの bead と同じ形）。便の bead は契約の行の題を写す。どちらも無い bead は要約なしとして床が数え、画面は題だけを出す。効果: 行 c-summary-ledger（第 8 波・持ち主待ちが解けた）。これから置く bead の description には 2 つの行を書く（席の運び）。
      t3-hub.52.31（裁定 id = t3-hub.52.31:20260928T0105Z-1）: ホームの台帳の block の一覧は残し、閉じた項目は出さない（open の項目と epic はホームですぐ見られるように残す）。全件は地図で見る（台帳の全体図・t3-hub.52.32）。推奨の A（一覧を消す）とも B（閉じた項目を畳みに入れる）とも違う。効果: 行 g-ledger-home（第 8 波）。
      t3-hub.52.28（裁定 id = t3-hub.52.28:20260928T0107Z-1・束 batch:20260928T0107Z-1）: 案 A。面が人に見せる時刻を全部日本時間（UTC に 9 時間を足す固定）にし、字の印も JST にする。「今日」も日本の日にする。記録の id（裁定 id の中の UTC）は記録の鍵なので変えない。見本 mock v3 の UTC の表示を変える決め。効果: 行 g-jst（第 7 波と第 8 波の着地の後）。
      t3-hub.52.29（裁定 id = t3-hub.52.29:20260928T0107Z-1・束 batch:20260928T0107Z-1）: 案 A。project board に、自分の project の席だけの heartbeat を止める・戻す新しい口を足す（本文は向きだけ）。account board の口は今のまま。効果: 行 e-seat-hb と g-seat-hb（書き直し・持ち主待ちが解けた・第 8 波）。
      t3-hub.52.30（裁定 id = t3-hub.52.30:20260928T0107Z-1・束 batch:20260928T0107Z-1）: 案 A。次の一手の順（規則の行 R-24）は変えない。一覧の小さい行でも当たっている行には次の手の link を付け、質問の行には経過を出す。効果: 行 g-next-rows（第 8 波・問いの題の名 g-next-act は第 3 波の着地済みの行 t3-hub.52.9 と id が重なるので替えた）。
      t3-hub.52.32（裁定 id = t3-hub.52.32:20260928T0107Z-1・束 batch:20260928T0107Z-1）: 案 A。地図に設計と台帳の 2 つの全体図を木の形（入れ子の一覧）で足す。閉じた項目は既定で畳み、各項目は項目の頁へ飛び、hover の card を持つ。今の畳んだグラフは要約として残す。効果: 行 g-map-tree（第 8 波）。
      t3-hub.53.14（裁定 id = t3-hub.53.14:20260928T0107Z-1・束 batch:20260928T0107Z-1）: 案 A。account board の全部の表で、口座を名の自然な順（名の中の数を数として比べる）に並べ、退役の口座は出さない（移動の履歴のように過去を示す所だけは出す）。並べと絞りは面の純粋な関数で行い、電文と中核は変えない。見本 mock v3 の退役の印の出し方を変える決め。効果: 行 h-acct-order（第 8 波）。
