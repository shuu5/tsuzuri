        ruling: "t3-hub.53.9（裁定 id = t3-hub.53.9:20260927T2233Z-1）"
      - id: d7
        text: "休止中の project の印と、口座ごとの 7 日の小さな図（spark）と測った時刻の列だけを作る。時点のつまみと関係の頁は作らない（推奨の A = 休止中の印だけ、とは違う）。効果: srs の要件 FR12 の字と scope の not_build。行 c-dormant・h-dormant・c-acct-spark・h-acct-spark。"
        ruling: "t3-hub.53.10（裁定 id = t3-hub.53.10:20260927T2233Z-1）"
      - id: d8
        text: "案 A。設計ノートの章の上限を 40 章 以下にする。効果: 規則の行 R-26（key note-chapters）と、席の folio を 0fb780e に替えること（同じ commit 58b16c2）。波のノートは今の運びどおり小さく保つ（7 節）。"
        ruling: "t3-hub.58（裁定 id = t3-hub.58:20260927T2357Z-1・束 batch:20260927T2357Z-1）"
