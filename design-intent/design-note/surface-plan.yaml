の行 f-deliver（M）に置いたことを写し、5 節の鎖を直した。後半（考え中の席を次の tool の呼びで拾う）は計画だけの行 f-deliver-tool として 9 節に残した（計画だけの行の数 14 は変わらず、規則の行 R-33 は変えない）。第 1.06 版（2026-09-30）は、9 節の計画だけの行 c-g3-extern をノート surface-wave23b の契約の行へ移して 9 節から外し（計画だけの行は 14 から 13 へ・同じ commit で規則の行 R-33 の値を下げる・条 P-28）、5 節の鎖の 5 か所に足し、2 節と 3 節の名指しの字にノートを添えた。外の台帳の行は server と tz graph の起動の引数 --project の置き場の台帳の読みで確かめ、server は行 e-multi-ask の見張りの最後の読みの字を使って bd を新しく撃たない（起草 w28b）。第 1.07 版（2026-09-30）は、9 節の計画だけの行 i-8 の server と契約の口を割ってノート surface-wave23b の契約の行 e-stage-target へ移し、i-8 を面の画面だけの行（M・起草で 2 行に割る・持ち主の見せ方の答えの後・depends に e-stage-target を足す）に直し、5 節の鎖の 3 か所に足した。計画だけの行の数は変わらない（規則の行 R-33 は書かない）。見本 mock3 に表示先の設定の画面が無いので、置き場を持ち主に問う（起草 w29a）。第 1.08 版（2026-09-30）は、5 節の鎖の boundary/stage/cli.rs に ノート surface-wave23b の 14 行目 i-rules-validate（tz stage の器の検めを器の本当の口 rules validate --state-dir で撃つ・席の実測 2026-09-30 の誤りの直し）の 1 文を足した。計画だけの行の数は変わらない（規則の行 R-33 は書かない）。第 1.09 版（2026-09-30）は、9 節の計画だけの行 g-park-view を、持ち主の答え t3-hub.53.41（案 A）に沿ってノート surface-wave23b の 15 行目の契約の行へ移して 9 節から外し（計画だけの行は 13 から 12 へ・同じ commit で規則の行 R-33 の値を下げる・条 P-28）、5 節の鎖の字を直した。第 1.10 版（2026-09-30）は、9 節の計画だけの行 i-8（2 つの board の表示先の設定の画面）を、持ち主の答え t3-hub.59.22 の案 A の置き場で 2 行に割ってノート surface-wave23b の契約の行 i-stage-own（project board）と i-stage-all（account board）へ移し、9 節から外した。5 節の末尾に面の file の順の 1 段落を足した。計画だけの行が 1 つ減るので、規則の行 R-33 の値を移した後の実数へ下げた（起草 w31c）。 第 1.11 版（2026-09-29）は、4 節に性能の続き（判断の記録 ADR-23・ノート surface-wave23b の 18〜23 行目）の段落、5 節の性能の行の並べに 6 行の書く file の順、6 節の重さの段落と folio の持ち込みの段落に 1 文ずつを足した。計画だけの行の数は変わらない（規則の行 R-33 は書かない）。 第 1.12 版（2026-09-30）は、9 節の計画だけの行 f-deliver-tool を、ノート surface-wave23b の 24 行目の契約の行 f-deliver-tool（M・hooks.json の PostToolBatch）へ移して 9 節から外し（計画だけの行は 11 から 10 へ・同じ commit で規則の行 R-33 の値を下げる・条 P-28）、5 節の鎖の字を直した（起草 w33b）。 第 1.13 版（2026-09-30）は、4 節の性能の続きの段落と 5 節の性能の行の並べの鎖に、ノート surface-wave23b の 25 行目 e-held-marks（判断の記録 ADR-23 の撤退の条件 (2) の直し・c-acct-parse の後）を足した。計画だけの行の数は変わらない（規則の行 R-33 は書かない）。 第 1.14 版（2026-09-30）は、6 節の folio の持ち込みの段落の、持ち込んだ木の中の tsuzuri で働かない file を持ち主に問うという字を、問い t3-hub.67.45 の裁定と行の名（ノート surface-wave23b の 26 行目 t-carry-retire）を書く形に直し、10 節の判断の表に d47 を足した。計画だけの行の数は変わらない（規則の行 R-33 は書かない）。 第 1.15 版（2026-09-30）は、6 節の folio の持ち込みの段落の後の行の列を、k-join-folio と k-deny をノート surface-wave23b の 28 行目と 29 行目の契約の行にした字に直し、前の行 t-ci-shard（27 行目・着地済み）を書いた（起草 w33a・w37a）。計画だけの行の数は変わらない（規則の行 R-33 は書かない）。第 1.16 版（2026-09-30）は、判断の記録 ADR-24（t3-hub.59.27）を受けて、4 節の傘 i の続きの窓の字を board ごとにし、2 節の i-2 の席の決め (1) が置き換わったことを足した。 第 1.17 版（2026-09-30）は、6 節の folio2/ の中の床の見張りの字を、行 k-join-folio の着地の後の形（folio の歯 check_canonical_design_intent_passes が見張る・別の段は置かない）に直した。 第 1.18 版（2026-09-30）は、9 節の計画だけの行 k-parity を、ノート surface-wave24a の 5 行（k-tz-entry・k-tz-parity・k-tz-drop・k-tz-self と、16 行目の契約の行 k-tz-tests）に割り終えたので 9 節から外し（計画だけの行は 10 から 9 へ・同じ commit で規則の行 R-33 の値を下げる・条 P-28）、5 節の鎖と 6 節の k-parity の字を割った行の名に直した（起草 w49a）。 第 1.19 版（2026-09-30）は、判断の記録 ADR-26（t3-hub.52.156 と t3-hub.52.157）を受けて、4 節の性能の続きに doctor だけの上限を 60 秒にする行 m-doctor-hold と器の席への問いと器の席の答えと越えの扱いを書き、後の行の候補から doctor の上限を 60 秒にする形を外して台帳を読む前に短く待つ形（ADR-26 の却けた案 b）を足した。計画だけの行の数は変わらない（規則の行 R-33 は書かない）。

sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      この文書は、見本 mock v3（判断の記録 ADR-7 の承認 user 2026-09-26T07:51Z で確定した仕様）に本番の 2 つの board を揃える残りの仕事の全体の計画を持つ。どの行が残っていて、どの順で流し、何が持ち主の裁定と他の席の答えを待っているかを、この 1 か所で見る。
      傘の行は設計ノート surface-board（g = project board・h = account board・i = 表示面・j = 受入 12 条の測定・k = tz の口）と surface-base（e = 面の server・f = 席の hook と問いの起票の門）に在る。子の行は波ごとの設計ノート（surface-hub・surface-wave3a・surface-wave3b・surface-wave4・surface-wave5a・surface-wave5b・surface-wave6・surface-wave7・surface-wave8a・surface-wave8b・表示面の surface-wavei と、これから置く第 9 波のノート〔surface-wave9〕）に在る。
      決まり 1: 波のノートの行は全部この文書の 4 節（残りの行）から取る。この文書に無い行を波のノートに置かない。
      決まり 2: 新しい行は、まずこの文書の 4 節に足す（id・大きさ・何を・書く file・依存・拠る裁定）。その後に起草して波のノートへ移す。
      決まり 3: 行の契約の字（write-set・verify・done・節の材料）は波のノートが持つ。この文書は 1 行の要約だけを持ち、字が食い違ったら波のノートが正しい（この文書を直す）。
      範囲の外: 要件 FR18（指し示し）・FR19（相談の窓）・FR20（表示面の対象を広げる）は見本 mock v3 に無いので、この計画に入れない。見本に揃えた後に別の計画のノートを置く。
      状態: 下書き。持ち主が board の質問の頁で承認したら発効にする。波のノートの承認は、この計画の承認の裁定 id を継ぐ。
  - n: 2
    type: prose
    title: 現在地（2026-09-28・main 1c26a6f・台帳の closed と着地の commit で確かめた）
    body: |
      傘の行 g（project board）。着地した子の行: g-min（t3-hub.5）・g-frame（.7）・g-parts（.9）・g-pipe（.11）・g-next（.12）・g-ledger（.13）・g-map（.15）・g-seat（.18）・g-ask（.19）・g-gaps（.21）・g-ledger-fix（.23）・g-graph（.24）・g-node（.26）・g-steady（.28）・g-batch（.32）・g-seat-fix（.33）・g-top-fix（.34）・g-pipe-today（.49）、登録の生成の hs-blocks・hs-pages・hs-derived（.54.5〜.54.7）、第 3 波の g-brand（.52.2）・g-link-map（.52.3）・g-link-graph（.52.4）・g-map-keys（.52.5）・g-link-kcard（.52.6）・g-link-items（.52.7）・g-ask-focus（.52.8）・g-next-act（.52.9）・g-unref-panel（.52.10）・g-seat-axis（.52.11）・g-tick（.52.12）・g-help-fig（.52.13）と中核の c-next-batch（.52.15）、第 5 波の g-node-timeline（.52.17）・g-title（.52.18）・g-card-node（.52.19）・g-help-sym（.52.20）・g-seat-more（.52.21）・g-ledger-card（.52.22）・g-ask-around（.52.23）・g-hist-ruling（.52.24）、第 6 波の中核と境界の c-summary-design（.52.25）・c-summary-wire（.52.26）、第 7 波の g-card-adopt-a（.52.33）・g-tip-expert（.52.34）・g-seat-split（.52.35・審査の まだ分からない〔器の材料の行数の数え方の欠陥・器の memo s2-07l.728〕の後に、値で固める歯を名の列を見る歯に替えて〔surface-wave7 v0.3〕出し直して着地）・g-mode-store（.52.36）と中核の c-q-blocking（.52.37）、第 8 波の g-card-around（.52.41）・g-card-graph（.52.42）・g-summary（.52.43）・g-unref-word（.52.45）・g-pipe-fold（.52.46）・g-next-rows（.52.48）・g-map-tree（.52.44）・g-ledger-home（.52.50）・g-seat-hb（.52.52）と中核の c-next-stall（.52.47）・c-summary-ledger（.52.49）。第 8 波の 13 行は全部着地した（78f4701 まで・便の bead は閉じた）。
      g の done の (1)(2)(3)(5) は子の行で満ちた。(4) の hover の置き場と猶予を browser の runner で通すのは傘の行 j の runner 待ち。
