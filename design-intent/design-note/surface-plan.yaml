  note: 設計ノート surface-board（傘の行 g・h・i・j・k）と surface-base（傘の行 e・f）の子の行を、どの波で、どの順で流すかを 1 か所で持つ計画。これまで見本と本番の差の調べ・行の割り・順・席の決めは追跡されない作業場の file にしか無く、全体の統制がとれないという持ち主の指摘（2026-09-27）を受けて置く。持ち主が board で承認したら status を effective にし、承認欄に裁定 id を書く。第 0.11 版（2026-09-28）は、持ち主の裁定 t3-hub.52.38〜.52.40 の後の性能の行 14 本を 3 節（席の決め）と 4 節と 5 節に足し、第 9 波（ノート surface-wave9 = e-hold・g-keyed・g-strip・g-reads・g-policy-all の 5 行）の組みと、表示面の行 i-5 の tz stage open の守り（席の決め）を書き、第 8 波と表示面の i-1 の着地を 2 節に写して着地した行を 4 節から外した。第 0.12 版（2026-09-28）は、第 9 波の 6 行目 c-pipe-closed と、ノート surface-wavef の行 f-gate の書き直しを足し、持ち主の裁定 t3-hub.52.53・.52.60・.52.61 と器の答え（RulingReceived・行 ad・memo の判定・display-env）を写し、後の行（e-sess-closed・g-closed-mark・g-pipe-memo・c-graph-fold・g-graph-fold・e-batch-partial・i-1b）を 4 節に足し、i-3 の着地と disk の満ちを 2 節に書いた。第 0.13 版（2026-09-28）は、4 節の起草中の 2 行 c-graph-fold と g-graph-fold を、ノート surface-wave10a に置いた行の字（大きさ・書く file・接頭辞・便の bead の依存）に替えて 5 節に順の鎖を足し、後の行 t-fstop-tidy を足し、着地した第 9 波の 4 行（e-hold・g-keyed・g-strip・g-reads）を 4 節から外し、第 9 波の g-policy-all と e-hold の着地と surface-wavef の v0.2 と退役した target/ の掃除を 2 節に書いた。第 0.14 版（2026-09-28）は、folio2 の渡し B（folio f300177）の着地を受けて、3 節の持ち主の裁定の行を判断の表（33 行）へ、4 節の行を計画だけの行（67 行）へ移し、行の索引（130 行・folio derive が契約表から書く）を置き、契約表に在る 4 行（f-gate・c-graph-fold・g-graph-fold・c-pipe-closed）を計画だけの行から外し、規則の表に名札の行 R-27 を足した（拠りは裁定 t3-hub.57.1:20260927T2357Z-1 の案 A の 2 段目）。第 0.15 版（2026-09-28）は、器の binary の 8dd964f への入れ替え（display-env を読む）を受けて行 i-1b をノート surface-wavei2 に置いて計画だけの行から外し、i-2 の依存に i-1b を足し、第 9 波の c-pipe-closed と第 10 波 a の 2 行と f-gate の着地を 2 節と 5 節に書いた。第 0.16 版（2026-09-28）は、席が 2026-09-28 に実物の画面で見つけた欠陥 2 つ（1 byte も送らない接続にも境界の server が 400 bad-request を書き、Chrome が後の頁の移りでその接続を使い回して board に素の bad-request の頁が出る件・地図のグラフの組の箱と塊の箱が内部の id を題に出す件）の行 e-idle-close（S）と g-graph-label（S）を、計画だけの行を経ずにノート surface-wave10b に置き（3 節の席の決め）、5 節の鎖に 2 行を入れた（行の索引は folio derive が書く）。第 0.17 版（2026-09-28）は、folio の pin を渡し C の 1e6ab0f に上げ、第 11 波の account board の card の 2 行（h-cards-nx・h-cards-led）をノート surface-wave11d に置いて計画だけの行から外した。第 0.18 版（2026-09-28）は、第 11 波の g-fresh（面の古さの印と 60 秒の諦め）と g-closed-mark（閉じた札の印）をノート surface-wave11a に置いて計画だけの行から外し、g-fresh が view.rs・frame.rs・vocab.json を書かないことに合わせて 5 節の鎖を直した。第 0.19 版（2026-09-28）は、第 11 波の server と中核の 3 行（e-cache・c-pipe-questioned・e-sess-closed）をノート surface-wave11b に置いて計画だけの行から外し、core/account/project.rs と中核の歯 pclosed の鎖に 2 行を入れた。

sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      この文書は、見本 mock v3（判断の記録 ADR-7 の承認 user 2026-09-26T07:51Z で確定した仕様）に本番の 2 つの board を揃える残りの仕事の全体の計画を持つ。どの行が残っていて、どの順で流し、何が持ち主の裁定と他の席の答えを待っているかを、この 1 か所で見る。
      傘の行は設計ノート surface-board（g = project board・h = account board・i = 表示面・j = 受入 12 条の測定・k = tz の口）と surface-base（e = 面の server・f = 席の hook と問いの起票の門）に在る。子の行は波ごとの設計ノート（surface-hub・surface-wave3a・surface-wave3b・surface-wave4・surface-wave5a・surface-wave5b・surface-wave6・surface-wave7・surface-wave8a・surface-wave8b・表示面の surface-wavei と、これから置く第 9 波のノート〔surface-wave9〕）に在る。
      決まり 1: 波のノートの行は全部この文書の 4 節（残りの行）から取る。この文書に無い行を波のノートに置かない。
      決まり 2: 新しい行は、まずこの文書の 4 節に足す（id・大きさ・何を・書く file・依存・拠る裁定）。その後に起草して波のノートへ移す。
      決まり 3: 行の契約の字（write-set・verify・done・節の材料）は波のノートが持つ。この文書は 1 行の要約だけを持ち、字が食い違ったら波のノートが正しい（この文書を直す）。
      範囲の外: 要件 FR18（指し示し）・FR19（相談の窓）・FR20（表示面の対象を広げる）は見本 mock v3 に無いので、この計画に入れない。見本に揃えた後に別の計画のノートを置く。
      状態: 下書き。持ち主が board の質問の頁で承認したら発効にする。波のノートの承認は、この計画の承認の裁定 id を継ぐ。
  - n: 2
    type: prose
    title: 現在地（2026-09-28・main 1c26a6f・台帳の closed と着地の commit で確かめた）
    body: |
      傘の行 g（project board）。着地した子の行: g-min（t3-hub.5）・g-frame（.7）・g-parts（.9）・g-pipe（.11）・g-next（.12）・g-ledger（.13）・g-map（.15）・g-seat（.18）・g-ask（.19）・g-gaps（.21）・g-ledger-fix（.23）・g-graph（.24）・g-node（.26）・g-steady（.28）・g-batch（.32）・g-seat-fix（.33）・g-top-fix（.34）・g-pipe-today（.49）、登録の生成の hs-blocks・hs-pages・hs-derived（.54.5〜.54.7）、第 3 波の g-brand（.52.2）・g-link-map（.52.3）・g-link-graph（.52.4）・g-map-keys（.52.5）・g-link-kcard（.52.6）・g-link-items（.52.7）・g-ask-focus（.52.8）・g-next-act（.52.9）・g-unref-panel（.52.10）・g-seat-axis（.52.11）・g-tick（.52.12）・g-help-fig（.52.13）と中核の c-next-batch（.52.15）、第 5 波の g-node-timeline（.52.17）・g-title（.52.18）・g-card-node（.52.19）・g-help-sym（.52.20）・g-seat-more（.52.21）・g-ledger-card（.52.22）・g-ask-around（.52.23）・g-hist-ruling（.52.24）、第 6 波の中核と境界の c-summary-design（.52.25）・c-summary-wire（.52.26）、第 7 波の g-card-adopt-a（.52.33）・g-tip-expert（.52.34）・g-seat-split（.52.35・審査の まだ分からない〔器の材料の行数の数え方の欠陥・器の memo s2-07l.728〕の後に、値で固める歯を名の列を見る歯に替えて〔surface-wave7 v0.3〕出し直して着地）・g-mode-store（.52.36）と中核の c-q-blocking（.52.37）、第 8 波の g-card-around（.52.41）・g-card-graph（.52.42）・g-summary（.52.43）・g-unref-word（.52.45）・g-pipe-fold（.52.46）・g-next-rows（.52.48）・g-map-tree（.52.44）・g-ledger-home（.52.50）・g-seat-hb（.52.52）と中核の c-next-stall（.52.47）・c-summary-ledger（.52.49）。第 8 波の 13 行は全部着地した（78f4701 まで・便の bead は閉じた）。
      g の done の (1)(2)(3)(5) は子の行で満ちた。(4) の hover の置き場と猶予を browser の runner で通すのは傘の行 j の runner 待ち。
      g の残り（見本との差と持ち主の指摘）: 節点の hover の card が問いの題・これまでの決定・台帳の epic・抜けの検査の名指しに無い（地図の札と一覧の題は g-card-node で、pipeline の札と次の一手の質問の題は g-card-adopt-a で、近傍図とつながりの一覧は g-card-around で、地図のグラフは g-card-graph で付いた）。経験者だけの注釈は束の重なりの chip と抜けの検査の行の見出しに付いた（g-tip-expert）が、地図のグラフの切れ目と表の cell と問いの投稿の時刻の chip に無い。1 秒の時計は account の session の表だけで、問い・pipeline・席・次の一手の経過は動かない。block「orchestrator と口座」に tick の経過・退避の猶予と待ちと断りと逼迫の帯・群の card・窓の閾値の印・停止の切り替えが無い（詳しくの出所の行と doctor の席の行は g-seat-more で付いた）。問いの card の止めている task の数の chip は付いた（c-q-blocking）が、台帳に問いを待つ task の blocks の依存が無いので 0 を出す。header の席の pill・窓を閉じられないときの注記・最初の案内が無い（mode の保存は g-mode-store で付いた）。節点の行の位置と 2 つの概要（要件 FR15）は card と地図の一覧と節点の頁に出て（g-summary）、bead の概要は description の 2 行から写る（c-summary-ledger）。要約の無い節点を tz graph --check に出す口（k-sum-count）と、設計ノートの行の節点と、更新の時刻は無い。未反映の一覧の裁定と要望の 2 種と、次の一手の発効待ちは、材料（処分の宣言）が無いので まだ分からない。器の問いの走行（段を決める最後の event が RunStage Questioned）は pipeline の板で札にならず、表に無い段として数えられるだけ（c-next-stall の起草で見つけた・行 c-pipe-questioned）。持ち主の指摘（2026-09-28・3 節）のうち、次の一手が質問を上げただけの run を止まっている走行に数える件（c-next-stall）・当たっている小さい行の link と質問の経過（g-next-rows）・pipeline の開いた列の畳み（g-pipe-fold）・未反映の注釈の字（g-unref-word）・ホームの台帳の一覧の閉じた項目（g-ledger-home）・地図の葉までたどる全体図（g-map-tree）は第 8 波で直した。残りは時刻が UTC で出る件（g-jst）。地図のグラフが 40 の上限で節点を黙って切り、規則が 0 と出る件（裁定 t3-hub.52.53・行 c-graph-fold と g-graph-fold・ノート surface-wave10a に置いて着地した）。pipeline の板で、台帳で閉じた bead の走行が止まった札に残る件（持ち主の指摘・行 c-pipe-closed）と、memo の列が無い件（持ち主の指示・行 g-pipe-memo・器の § 待ち）。2 つの board が重く、台帳の読みが落ちると画面が一瞬消える件は、裁定 t3-hub.52.38〜.52.40（3 節）の後の性能の行（4 節の 14 行・第 9 波から）で直す。第 9 波（ノート surface-wave9）: g-keyed（.52.55・897cf56）・g-strip（.52.56・0f09104）・g-reads（.52.57・b23084f）は着地した。g-policy-all（.52.58・3a80b1c）も着地して閉じた。e-hold（.52.54・076666a）も契約の直し（ノートの v0.5〜v0.7）の後に着地した。6 行目の c-pipe-closed（.52.62）も着地した。第 10 波 a の c-graph-fold（.52.63・274fbfb）と g-graph-fold（.52.64・cbaa244）と、ノート surface-wavef の f-gate（.55.9・526a452）も着地した。
      傘の行 h（account board）。着地した子の行: b-acct（.36）・e-acct-host（.37）・e-acct-proj（.38）・e-acct（.39）・e-acct-hb（.40）・h-frame（.41）・h-home（.42）・h-sess（.43）・h-led（.44）・h-proj（.45）・h-win（.46）・h-hb（.47）・h-wire（.48）・h-look（.53.3）、第 3 波の h-proj-more（.53.4）・h-led-spark（.53.5）・h-popstate（.53.6）、第 4 波の h-cards-home（.53.7）、第 5 波の h-sess-axis（.53.11）・h-board-url（.53.12）と中核の c-limit-pipe（.53.13）、第 7 波の h-cards-proj（.53.15）・h-cards-sess（.53.16）と中核の c-acct-thr（.53.17）、第 8 波の h-acct-order（.53.18）。開く button は各 anchor の追跡されない git config の tsuzuri.boardport で開く（席が 4 つの anchor に置いた・2026-09-28）。
      h の done の (1)〜(4) は単体の歯で満ちた（browser の runner は j 待ち）。
      h の残り: HOME の次の一手の行と群の枠の project の chip と台帳の表の project の欄に card が無い（各 project の表と session の表の card は h-cards-proj と h-cards-sess で付いた）。並べ方の押しが履歴に積まれない。決定待ちと未反映の欄が「―」。使用量の閾値と逼迫の知らせと移動の断りは電文に載った（c-acct-thr）が面が出さない（候補ごとの門の理由は器が残さない）。休止中の印と口座ごとの 7 日の小さな図と測った時刻の列が無い。開いた窓の一覧が頁を開き直すと消える（mode は g-mode-store で残る）。時刻が UTC で出る（t3-hub.52.28）。判じなかった次の一手なしを測れていないに出さない（行 h-next-unknown）。
      h で作らないと決めた物: 時点のつまみと関係の頁（t3-hub.53.10）。見張り t3-hub.53.2（負荷の高い時に台帳が測れていないに落ちる）は閉じた（その Failed の便が次の一手の大きい箱を 8 時間取り、持ち主の問いを小さい行に隠していた）。負荷の時の台帳の読みの上限は、project board の重さの調べ（6 節）から起こす行で扱う。
      傘の行 i（表示面）: 着地した子の行: 表示面の第 1 波の i-1（t3-hub.59.8・c43cae0）と i-3（t3-hub.59.9・3604893）。done の (1)〜(4) が全部残る（done (3) の配信に落ちるは、判断の記録 ADR-15 の決定 (5) で届かない端末へ URL を渡す形に替わり、傘の字は設計ノート surface-board の第 0.21 版で直した）。持ち主の問い t3-hub.59.1〜.59.7 は全部裁定が付いた（3 節・判断の記録 ADR-15 と要件 FR16 の字は t3-hub.59.6 で承認）。行を i-1〜i-5 と i-7〜i-11 に割った（4 節・元の i-6 は 6 節の v2 の候補）。i-1 と i-3 はノート surface-wavei（発効・v0.2）で器に出した。i-1（t3-hub.59.8）は審査の空振りの返りを v0.2 で直して着地し、閉じた（c43cae0）。i-3（t3-hub.59.9）も着地した（3604893）。器の欄 display-env は着地した（器の memo s2-07l.726）ので、i-1 の閉じた key に足す行 i-1b をノート surface-wavei2 に置いた（器の binary 8dd964f が display-env を読む）。
      傘の行 j（受入 12 条の測定）: 着地した子の行は無い。done の (1)〜(4)（12 条ごとに 1 件仕込んだ fixture・現物の全画面で 0・report・面の crate の依存の予算）が全部残る。runner は行 i の CDP の口を使い回し、外の依存を足さない（裁定 t3-hub.52.61・3 節・i-4 の後）。
      傘の行 k（tz の口）: 着地した子の行は k-graph（.55.1）。done の (2)（tz graph --design が設計の索引だけを出す）は満ちた。tz graph --check は今の中核が g-3・g-7・g-9 を測らないので、違反が無くても まだ分からない（rc 2）を返す。残り: (1) folio の 11 の口の終了 code と出力の一致（folio の code の持ち込み〔判断の記録 ADR-4〕の後）と、(3) tz inject が無いこと・(4) folio という名の binary が workspace に無いこと（どちらも今は真で、見る歯が無いだけ）と、g-3・g-7・g-9 を数える行。
      傘の行 e（面の server）: 着地した子の行: e-min（.4）・e-src（.6）・e-read（.14）・e-ask（.17）・e-seat（.20）・e-view（.25）・e-coalesce（.27）・e-batch（.30）・e-reap（.31）・e-runs（.52.14）・第 7 波の e-watch-steady（.55.8）・第 8 波の e-seat-hb（.52.51）と、登録の生成の hb-proc・hb-config・hb-route・hb-post（.54.1〜.54.4）。
      e の done の (2)・(3) の前半（古い版の要求を 409 で断る）・(4) は満ちた。残り: (1) 裁定ごとの逐語つきの承認の event を器の event log に書く（今は器の seat deliver を撃つだけ・器の event は RulingReceived・6 節）。(3) の後半の取り消し（新しい裁定が前の id を名指して問いを open に戻す・button は決定の頁の頭・裁定 t3-hub.52.60）。(5) 問いの合図から SSE まで 200 ミリ秒（今は 500 ミリ秒の周期の読みだけ）。考え中の席が断った配達（busy）を届ける手は第 6 波の f-mark・f-stop・f-mark-serve で入った。見張りの揺れ（変化 1 回に知らせ 2 件・f-stop の門を落とした）は e-watch-steady（第 7 波・t3-hub.55.8）で直した。project board から自分の席の heartbeat を切り替える口は e-seat-hb（第 8 波）で入り、面の button は g-seat-hb で付いた。台帳の読みが落ちた時に最後に読めた字を返す持ち回しは e-hold（第 9 波）。
      傘の行 f（席の hook と問いの起票の門）: 着地した子の行: 第 6 波の f-mark（t3-hub.55.4）・f-stop（.55.5・門の揺れの後に t3-hub.55.7 の裁定で撃ち直して着地）・f-mark-serve（.55.6）。境界の crate に hook の dir が在り、repo の根の plugin/ に停止の hook（Stop）が登録され、2026-09-28T01:59Z に live で初めて働いた（席の起こし直しの後の最初の停止で、配達の印の無い裁定 5 件を席に返し、5 件に経路 = 停止の配達の印を置いた・t3-hub.55 の notes）。done の (2) の 2 経路（待ちの席へは server が器の配達の口を 1 度撃ち、考え中の席は停止の hook が続けさせる）は入った。残り: (1) 問いの起票の門（f-gate は t3-hub.55.2 の絞りで書き直してノート surface-wavef〔v0.2〕に置いた・bead t3-hub.55.9・e-hold の後・f-gate-install はその後）・(3) 裁定から 2 分で届いていないの印（f-undelivered）と、裁定の逐語を注入する配達の hook（f-deliver）。
      道具と台帳（2026-09-28）: 席の folio の pin は 1e6ab0f（folio2 の判断の記録 ADR-31 の渡し C・check --emit-rulings・2026-09-28 に 150 件を書き出し、question の形の 48 件が全部台帳の問いの記録に解けることを席が確かめた）。渡し B は f300177（便 183 と 184）。渡し B の着地で、この計画を 3 つの節の型（判断の表・行の索引・計画だけの行）へ移し、名札の規則の行 R-27（key plan-note）を置いた（第 0.14 版）。folio build の HTML を席が配る。次の行の bead: t3-hub.53.19（h-next-unknown・acceptance が空なので器は起こさない）と t3-hub.55.9（f-gate・ノート surface-wavef を置く時に acceptance を入れる）。2026-09-28T04:4xZ に disk が満ち、器の走行の worktree の target/ を掃除した。器の席は走行の生成物の掃除を器の最優先の直しにしている。2026-09-28T04:5xZ に、退役した走行の target/ 29 個を持ち主の承認（t3-hub.1 の user 2026-09-28T04:49Z）で掃除した（rm の守りは、どの target/ にも残る空の .git の dir を理由に断っていた・直しは後の行 t-fstop-tidy）。棚上げの洗い出しは済んだ（t3-hub の notes 2026-09-28T04:4xZ・持ち主への問い 2 つは t3-hub.52.60 と .52.61 で裁定が付き、器への問い 3 つは答えが来た・3 節と 6 節）。
  - n: 3
    type: prose
    title: 決定（持ち主の裁定と席の決め・出所つき）
    body: |
      持ち主の裁定（逐語は各問いの notes と t3-hub.1 の notes に在り、この文書には写さない）。
      この計画の枠の裁定: 判断の記録 ADR-7 の承認（user 2026-09-26T07:51Z・見本で確定）、surface-board と波のノートの承認（user 2026-09-27T03:19Z）、判断の記録 ADR-13 の承認（user 2026-09-27T17:36Z・登録の生成）。
      席の決め（理由つき・持ち主の異議があれば戻す）。
      tz graph --check は g-3・g-7・g-9 を測る機構が来るまで rc 2（まだ分からない）のままにする。3 本を判定の外に出す案は取らない。理由: 要件 FR3 の「読めなければ合格にしない」と条 P-7（黙って飛ばさない）。行 c-g3g7 と c-g9 で rc 0 に届く。
      tsuzuri の側に設計文書の YAML の走査を置かない。folio2 の folio graph --print --summary の着地を待ち、行 c-summary-design を「--summary を読んで写す」行として書き直す。理由: tsuzuri の走査は正本の 2 つ目の読み手になり（条 P-2）、folio を取り込むときに消す負債になる。設計ノートの行の節点と ruled_by の辺の材料（行 c-dn-rows・c-g3g7・c-g9）も、同じ理由で folio の索引に載るのを待つ（6 節）。電文の概要は全文で運び、切るのは面（規則の行 R-19 の字の予算・行 g-summary）。
      並べ方の押しは見本どおり履歴に積む（pushState）。理由: 見本は判断の記録 ADR-7 の承認で確定した仕様で、行 h-popstate は 3 つの block の file を書かないために今は履歴の書き換え（replace）に留め、後の行に回した。効果: 行 h-sort-hist。
      限度の KPI（h-cards-home）は電文が Limit と印す session を写して出す。電文が pipeline の session を Limit と印さない欠けは面で数え直さず、中核の行 c-limit-pipe で直す。
      行 h-proj-more の詳しくの段（more_view）の形: 4 つの値の span は列の class で包まず、列の class で包むのは row_view だけ。理由: style.css の 760px 以下の規則は .prow の子孫の全部の c-run・c-orch・c-acc・c-led を隠すので、中で包むと狭い幅で値が消える（前の便の門 FAIL の実物）。以後の行も、隠す class を値を見せる要素の中に入れ子にしない。
      門の引数の誤りは、入力が問いの起票のときだけ断り、ほかの Bash は素通しにする（問いについては閉じる側に倒す）。metadata の鍵の名は器と揃える（器は問いの metadata の鍵を持たないので、f-gate は touches・not-relevant・digest にした・下の席の決め）。
      project board の block「orchestrator と口座」の時点のつまみ（見本の ?at=）も作らない。t3-hub.53.10 の字は account board のつまみだが、同じ機能（server に時点の引数と履歴が要る L）なので揃える。持ち主が project board だけ欲しいと言えば 1 問で戻す。
      g-mode-store は頁を開くとき、URL に有効な mode が無く保存が expert なら URL に mode=expert を足す（見本の initMode は URL を書かない）。理由: project board の App と account board の戻る進むと block の DOM の控えが URL から mode を読むので、揃えないと戻るで初心者に戻る。持ち主が見本どおりを望めば、後の行で App と戻る進むの mode の読みを替える。
      表示先の設定（層 B）の置き場は、tsuzuri 自前の追跡されない 1 つの file（XDG の設定の dir の下の tsuzuri/stage.toml）にする。理由: 全体の既定と project ごとの上書きを 1 か所で原子的に書け、account board の一括の変更が 1 file で済み、器の host の面にも版管理に載る file にも触らない。~/.gitconfig は持ち主の dotfiles で版管理に載りうるので使わない（行 D-4）。退けた案の全部は行 i-7。
      便の bead は description の頭に 2 行を持つ: 概要 = <持ち主に向けた平易な 1 文> と 技術 = <契約の行の題>。これで裁定 t3-hub.52.27（裁定 id = t3-hub.52.27:20260928T0049Z-1）の便の bead の分を満たし、題を読む code は持たない（行 c-summary-ledger は 2 行をほかの bead と同じ決まりで写す）。この運びの前に置いた便の bead は要約なしのまま床が名指す。
      器は置き場だけの = の file も重なりとして持つ（idle の知らせの held の列で見えた）。そこで、ある file を = で持つ行は、その file を書く行と直列に流れる。5 節の並びは = で持つ行も書く行と同じく数え、行の割りと波の組みでは = の重なりも並べられない物として扱う。
      持ち回しの古さは、server が応答の頭 X-Tz-Read-Age に最後に読めた時からの秒（整数）で載せ、面はその秒と自分の時計の経過で数える。時刻（epoch 秒）でなく秒で送るのは、持ち主の端末は server と別の機械で、2 つの時計の差が 15 秒の判定に入らないため。頭は読みが落ちた応答だけに付く（読めた応答には付かない・一度も読めていなければ server が読みを始めた時からの秒）。頭の名と 60 と 15 は契約の型の crate の ledger の module の定数に置き、server と面が同じ値を読む。変化の見張り（Hub）の読みは持ち回さず、落ちれば まだ分からない のままにする。見張りが読めたから読めないへ、読めないから読めたへ変わるたびに ledger-changed を送るので、面は読みの落ちと戻りを知らせで知る。効果: 行 e-hold・g-fresh。
      g-fresh-a（最終の記録を最後に読めた時刻にする）と g-fresh-b（つながりの切れの猶予と header の印）は 1 行 g-fresh にまとめる。理由: 2 つの裁定（t3-hub.52.38・.52.39）で、読みの落ちとつながりの切れは同じ古さ（最後に読めた時から今まで）で数え、同じ 1 つの印を同じ header に出すことになった。最終の記録の時刻はその古さの起点と同じ値で、net.rs の同じ状態から出る。割ると同じ net.rs・board.rs・account の board.rs を 2 行が続けて書く。
      g-keyed は問いの頁の 2 つの block（答えを待つ質問 ask.rs・まとめて承認 batch.rs）を書く。全体への指示（policy.rs）の form が読み直しで作り直されるのは、範囲の切り替えと問いの選びが問いの一覧に依るからで、行 g-policy-all がその 2 つを外す。そこで g-policy-all の行に「form を一覧の読みに依らずに 1 度だけ組む」を足し、g-keyed は policy.rs を書かない（同じ file を 2 行で直して捨てない）。
      e-snap（GET の口は bd を撃たず、見張りが読んだ字を返す）は便 e-coalesce の「読み終えた字は持ち回さない」を覆すが、持ち主の問いを置かない。理由: 見張りは印を 500 ms ごとに見て 5 秒ごとに読み直すので、要件 NFR2 の 5 秒と 1.5 秒（規則の行 R-21）は守られ、持ち主の指摘（t3-hub.1 の user 2026-09-28T00:4xZ・00:59Z・01:06Z・読み直しは要るが画面への出し方を工夫する・2 つの board が重い）の直しで、画面の振る舞いの選び肢を持ち主に問う種類ではない。
      g-gz の形: 圧縮の crate は xtask の側だけに miniz_oxide を 1 本足し、surface-build が dist の wasm・js・css の gzip の写し（.gz）を前もって作り、server は標準 library のまま Accept-Encoding を見て .gz を返す。境界の crate は外の依存 0 本のまま（歯 skeleton_boundary_std_only_and_bin_tz を保つ）。比べたこと（g-strip の後の wasm 3,018,891 byte・2026-09-28 に測った）: gzip -9 = 958,324 byte・brotli の品質 11 = 626,790 byte（gzip より 33% 小さい・3.8 秒）・zstd -19 = 676,800。brotli は足さない。理由は 3 つ。(1) 純 Rust の brotli の crate とその依存 alloc-no-stdlib と alloc-stdlib の license の BSD-3-Clause は、規則の行 R-2 の使ってよい license の一覧に無い。(2) browser は br を HTTPS の時だけ Accept-Encoding に載せる（推測）ので、local の Chrome の app mode（http）には届かず gzip の写しも要り、足すものが 2 つになる（裁定は 1 つ）。(3) 包みが 4 つで、miniz_oxide は 2 つ（miniz_oxide・adler2）。差の約 330 KB は build ごとの最初の 1 回にしか効かない（e-cache の後は 2 回目から 0 byte）。flate2 でなく miniz_oxide にしたのは、flate2 の純 Rust の backend が 4 つの包みを Cargo.lock に足すため（gzip の枠と CRC-32 は xtask に自分で書き、歯が標準の検査値と inflate の戻しで見る・枠を自分で書くのを避けたいなら flate2 に替えてよい・直接依存は同じ 1 本）。端末の gzip の道具に頼る案は退けた。理由: 道具は Cargo.lock にも manifest にも依存の数えの歯にも規則の行 R-2 の予算にも載らない見えない依存になり、surface-build はどの行の門でも走るので道具の有無と版が門の結果と出力の byte を host ごとに変え（条 N-3）、surface-build が撃つ外の道具を trunk の外に増やす。効果: 行 g-gz。
      g-reads の最初の読みは、知らせの接続（SSE）が開くのを 1 秒まで待ってから 1 巡だけ撃つ形にする（調べの案の、開いた直後の 2 巡目をやめる形は取らない）。理由: server は受け手を足してから頭を書き、繋いだ時に知らせを送らないので、接続が開く前に撃った読みは、読みの後から受け手を足すまでの間の変化を取りこぼす（今はそれを 2 巡目が拾っている）。2 巡目だけを消すと、変わりの少ない台帳では次の変化まで古い中身が残り、要件 NFR2 の 5 秒を破る。待つ形でも読みの本数は同じく 16 本から 8 本に減り、接続が上限の枠を先に取る。開かなければ 1 秒で読み、後で開いた時にもう 1 巡読む（取りこぼさない）。大きさは M にする（決め方を host の新しい module flight に出し、src と歯の file が増えたため）。効果: 行 g-reads。
      tz stage open を席から撃てなくする守りは、tz の口の中で環境変数 CLAUDECODE が 1 の時に断る形にする（Claude Code の Bash の道具が子 process に渡す値・器が実測・器の推奨 (a)・台帳 t3-hub.59 の notes 2026-09-28T03:1xZ）。器が席の役を知らせる環境変数（器の memo s2-07l.723）が着地したら、その判定に替える。持ち主は素の端末か board の button（i-8）から撃つ（席の入力欄の ! からの撃ちは同じ環境変数を持つので断られる）。退けた案: 器の rules 行に断る語を足す案は器が断った（器の rules の manifest は公開の repo で、非公開の隣の project の command の名を載せない・断る語の行は runner.denied_commands だけ）。tsuzuri の plugin の PreToolUse で command の字を断る案 (b) は、字の言い換えで抜けるので退けた。効果: 行 i-5。
      台帳で閉じた契約 bead の走行の札は、段が Landed でなければ止まった・動いている札にせず、pipeline の板の Landed の列に閉じた（着地せず）として置く（見本は消すが、消さずに済んだ側へ置く・欠陥の直しなので問いを置かない）。拠り = 持ち主の指摘 t3-hub.1（裁定 id = user 2026-09-28T04:1xZ）。効果: 行 c-pipe-closed（第 9 波の 6 行目）と、後の行 e-sess-closed・g-closed-mark。
      問いの起票の門（f-gate）の 4 種の要件は、語のとおり要件（Req）だけを数え、非機能要件（Nfr）は数えない（討論の記録 B §11.3 の 4 つは要件だけを挙げる）。判断の記録は、設計の索引が状態を持つまで状態によらず数える（処分を求めすぎる側・閉じる側・srs v0.12 の要件 FR4 の note）。問いの metadata の鍵は touches・not-relevant・digest にする（器は問いの metadata の鍵を持たず、揃える相手が無いので要件 FR4 の語を使う・器と決めるなら鍵の定数 2 つだけが変わる）。効果: 行 f-gate（ノート surface-wavef）。
      第 10 波 b の 2 行（ノート surface-wave10b）は、席が 2026-09-28 に実物の画面で見つけた欠陥の直しなので、計画だけの行（9 節）に置かずに起草してノートに置き（決まり 2 の例外・欠陥の直しは持ち主の問いを置かない）、承認は計画の裁定 t3-hub.56:20260927T2259Z-1 を継ぐ。e-idle-close = 境界の server は、要求の行の最初の 1 byte より前に相手が閉じたか読みが終わった接続（browser が先に張る接続・10 秒の読みの時間切れ）には何も書かずに閉じ、byte の届いた形の悪い要求と切れた要求には今のまま 400 を返す（今は read_request の誤りなら種類を問わず 400 bad-request を書くので、Chrome が先に張った接続を頁の移りに使い回して残った 400 を読み、board に素の bad-request の頁が出た・席の測りでは 11 秒の空きの後の GET に 400）。g-graph-label = 地図のグラフの組の箱と塊の箱の 1 行目・狭い幅の一覧の組の行・組の箱の card・開けなかった行に、~ の id でなく種類の原文の名と系と子の番号の範囲から組んだ題を出す（例 条 A・規則行・t3-hub.52 の 1〜12）。題は面で組む。理由: 台帳と走行の種類の日本語の名は面の表 KINDS にだけ在り（電文の種類の字は台帳と走行では英字）、面で組めば電文と中核と中核の歯の題の値を変えずに済むため。効果: 行 e-idle-close と g-graph-label（5 節の鎖）。
      行を書く作法（審査と門で止まった実例から・詳しくは docs/handoff/2026-09-27-t3-screen-wave.md の 7・14・15・16 節）。
      作法 1: 審査の目は行と節と要件の字と write-set の file の宣言の名しか見ない。使う型・関数の path・pub か・wasm に限るか・引数と返り・class が stylesheet に在るか・語の鍵が辞書に在るかを節に書き、確かめた事実は確かめたと書く。
      作法 2: file の行数と行番号を書かない（審査は幅で均した行数を見る）。fn・const・型の名で指す。歯が頼る fixture の欄と値は行の節に字で書く。
      作法 3: done の 1 項ごとに、それを落とせる歯の名を書く。DOM だけの振る舞いは host の純粋な関数か、名のある目印の間の source の字を読む歯で見て、組めることは xtask の surface-build で見る。
      作法 4: write-set の外の着地済みの歯を grep で全部探し、期待が変わる歯の file は write-set に足して節に直しを書き、直さずに通る歯は何を読むから通るかを書く。書かないが審査に見せたい file は置き場だけの = で足す。
      作法 5: 新しい歯の名は接頭辞で始め、接頭辞の後に着地済みの verify の filter の語を含めない。done にその見張りの歯を置く。
      作法 6: 新しい電文の型は自分の歯の file と snapshot を持つ（contract_form に足さない）。電文の欄を足す行は、その型を struct の字で組む着地済みの歯と snapshot を全部 write-set に入れる。
      作法 7: 許す範囲は歯が見る広さと同じにする（狭く書くと正しい実装が門で落ちる）。面に判定を書かせず、面が出す数は電文の欄に在るものだけにする。
      作法 8: 受付の上限は src の 1 file 1500 行で、大きさ S は 100 行・M は 300 行の余白を数える。上限に近い file は先に中身を新しい file へ移す行を置く。
