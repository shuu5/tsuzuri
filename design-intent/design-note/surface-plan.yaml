  - n: 10
    type: decision-table
    title: 持ち主の裁定（台帳の問いの記録に在る判断・3 節の散文から移した）
    rows:
      - id: d1
        text: "案 A。account の server が各 anchor の追跡されない git config の tsuzuri.boardport から port だけを読み、電文の ProjectRow の board に載せ、面は開いている頁の protocol と hostname に port を足して URL を組む。効果: 行 h-board-url（第 5 波）。前提は全部の board が account board と同じ host に在ること。案 B（起動の引数）は取らず、案 C（1 つの server が全部の board を配る）は複数の process の運用が辛くなったときの判断の記録の候補として残す。"
        ruling: "t3-hub.53.1（裁定 id = user 2026-09-27T22:18Z）"
      - id: d2
        text: "問いの起票の門の名指しを討論の記録 B §11.3 の絞りにする（1 段・種類は条・規則行・発効した判断の記録・要件の 4 つ・次数 30 を越える hub は除く・処分が 30 を越える問いは まだ分からない で分けさせる）。効果: srs の要件 FR4 と受入 AC6 の字を変える（この文書と同じ束の srs の直し）。行 f-gate を書き直す（台帳の節点は門の集合から外れ、fixture の名指しの例を 4 種の節点に替え、hub と 30 越えの fixture を足す）。"
        ruling: "t3-hub.55.2（裁定 id = t3-hub.55.2:20260927T2233Z-1）"
      - id: d3
        text: "門の便の着地の後に、席の設定（PreToolUse・matcher Bash）に門を入れる。効果: 行 f-gate-install（f-gate の後）。"
        ruling: "t3-hub.55.3（裁定 id = t3-hub.55.3:20260927T2233Z-1）"
      - id: d4
        text: "mode・account board から開いた窓の一覧・最初の案内の済み印の 3 つを、その browser に残す（便利の写しで正本ではない）。効果: srs の要件 FR1 の字。行 g-mode-store・h-win-store・g-coach。着地済みの歯 acctwin_no_storage_and_wasm_wiring（src/account の下に保存の字が無いことを見る）の期待を変えるか、保存の字を src/account の外の 1 つの module に置く。"
        ruling: "t3-hub.52.16（裁定 id = t3-hub.52.16:20260927T2233Z-1）"
      - id: d5
        text: "使用量の閾値（窓ごとの cap）と逼迫の印と、移り先の候補が門で落ちた理由を出す。値は器の rules 行と event を写すだけで tsuzuri は判じない。効果: rules 行 R-22 に写し方を足す（同じ束の直し）。行 c-acct-thr・h-thr-home・g-seat-thr と、行 c-seat-grace の逼迫の行（前は持ち主待ち）。着地済みの歯 accthome_no_pressure_marks（HOME に逼迫の印が無いことを見る）の期待を変える。"
        ruling: "t3-hub.53.8（裁定 id = t3-hub.53.8:20260927T2233Z-1）"
      - id: d6
