  - n: 3
    type: prose
    title: 決定（持ち主の裁定と席の決め・出所つき）
    body: |
      持ち主の裁定（逐語は各問いの notes と t3-hub.1 の notes に在り、この文書には写さない）。
      この計画の枠の裁定: 判断の記録 ADR-7 の承認（user 2026-09-26T07:51Z・見本で確定）、surface-board と波のノートの承認（user 2026-09-27T03:19Z）、判断の記録 ADR-13 の承認（user 2026-09-27T17:36Z・登録の生成）。
      席の決め（理由つき・持ち主の異議があれば戻す）。
      tz graph --check は g-3・g-7・g-9 を測る機構が来るまで rc 2（まだ分からない）のままにする。3 本を判定の外に出す案は取らない。理由: 要件 FR3 の「読めなければ合格にしない」と条 P-7（黙って飛ばさない）。行 c-g3g7（ノート surface-wave15d）と c-g9（ノート surface-wave19c）と計画だけの行 c-g9-deny で 3 本を測る機構が揃う（c-g9 は g-9 の対を数えるだけで、判定を落とす側へ替えるのは 2 周の実測の後の c-g9-deny）。rc 0 に届くのは、さらに 2 つが済んだ後: 外の台帳（器の台帳の憲法の承認 s2-07l.214 を引く節点 22）の裁定をその台帳を読んで確かめる行 c-g3-extern（ノート surface-wave23b・server と tz graph --check の起動の引数 --project に器の置き場を渡した時から確かめる）と、控え t3-hub.1 の user の形の裁定（folio の裁定 id の文法の外・56）が器の発話の記録へ移って問いの形の id を持つこと（器の席の問い 1 の答え 2026-09-28）。それまで g-3 と g-7 はまだ分からないのまま（測れないものを違反と言わない・条 P-7.2・第 15 波 d の起草の席の決め）。
      tsuzuri の側に設計文書の YAML の走査を置かない。folio2 の folio graph --print --summary の着地を待ち、行 c-summary-design を「--summary を読んで写す」行として書き直す。理由: tsuzuri の走査は正本の 2 つ目の読み手になり（条 P-2）、folio を取り込むときに消す負債になる。設計ノートの行の節点と ruled_by の辺の材料（行 c-dn-rows〔着地済み〕・c-g3g7〔ノート surface-wave15d・folio の check --emit-rulings の書き出しを読んで結ぶ〕・c-g9）も、同じ理由で folio の出力を読んで写す（6 節）。電文の概要は全文で運び、切るのは面（規則の行 R-19 の字の予算・行 g-summary）。
      並べ方の押しは見本どおり履歴に積む（pushState）。理由: 見本は判断の記録 ADR-7 の承認で確定した仕様で、行 h-popstate は 3 つの block の file を書かないために今は履歴の書き換え（replace）に留め、後の行に回した。効果: 行 h-sort-hist。
      限度の KPI（h-cards-home）は電文が Limit と印す session を写して出す。電文が pipeline の session を Limit と印さない欠けは面で数え直さず、中核の行 c-limit-pipe で直す。
      行 h-proj-more の詳しくの段（more_view）の形: 4 つの値の span は列の class で包まず、列の class で包むのは row_view だけ。理由: style.css の 760px 以下の規則は .prow の子孫の全部の c-run・c-orch・c-acc・c-led を隠すので、中で包むと狭い幅で値が消える（前の便の門 FAIL の実物）。以後の行も、隠す class を値を見せる要素の中に入れ子にしない。
      門の引数の誤りは、入力が問いの起票のときだけ断り、ほかの Bash は素通しにする（問いについては閉じる側に倒す）。metadata の鍵の名は器と揃える（器は問いの metadata の鍵を持たないので、f-gate は touches・not-relevant・digest にした・下の席の決め）。
      project board の block「orchestrator と口座」の時点のつまみ（見本の ?at=）も作らない。t3-hub.53.10 の字は account board のつまみだが、同じ機能（server に時点の引数と履歴が要る L）なので揃える。持ち主が project board だけ欲しいと言えば 1 問で戻す。
      g-mode-store は頁を開くとき、URL に有効な mode が無く保存が expert なら URL に mode=expert を足す（見本の initMode は URL を書かない）。理由: project board の App と account board の戻る進むと block の DOM の控えが URL から mode を読むので、揃えないと戻るで初心者に戻る。持ち主が見本どおりを望めば、後の行で App と戻る進むの mode の読みを替える。
      表示先の設定（層 B）の置き場は、tsuzuri 自前の追跡されない 1 つの file（XDG の設定の dir の下の tsuzuri/stage.toml）にする。理由: 全体の既定と project ごとの上書きを 1 か所で原子的に書け、account board の一括の変更が 1 file で済み、器の host の面にも版管理に載る file にも触らない。~/.gitconfig は持ち主の dotfiles で版管理に載りうるので使わない（行 D-4）。退けた案の全部は行 i-7。
      便の bead は description の頭に 2 行を持つ: 概要 = <持ち主に向けた平易な 1 文> と 技術 = <契約の行の題>。これで裁定 t3-hub.52.27（裁定 id = t3-hub.52.27:20260928T0049Z-1）の便の bead の分を満たし、題を読む code は持たない（行 c-summary-ledger は 2 行をほかの bead と同じ決まりで写す）。この運びの前に置いた便の bead は要約なしのまま床が名指す。
      器は置き場だけの = の file も重なりとして持つ（idle の知らせの held の列で見えた）。そこで、ある file を = で持つ行は、その file を書く行と直列に流れる。5 節の並びは = で持つ行も書く行と同じく数え、行の割りと波の組みでは = の重なりも並べられない物として扱う。
      持ち回しの古さは、server が応答の頭 X-Tz-Read-Age に最後に読めた時からの秒（整数）で載せ、面はその秒と自分の時計の経過で数える。時刻（epoch 秒）でなく秒で送るのは、持ち主の端末は server と別の機械で、2 つの時計の差が 15 秒の判定に入らないため。頭は読みが落ちた応答だけに付く（読めた応答には付かない・一度も読めていなければ server が読みを始めた時からの秒）。頭の名と 60 と 15 は契約の型の crate の ledger の module の定数に置き、server と面が同じ値を読む。変化の見張り（Hub）の読みは持ち回さず、落ちれば まだ分からない のままにする。見張りが読めたから読めないへ、読めないから読めたへ変わるたびに ledger-changed を送るので、面は読みの落ちと戻りを知らせで知る。効果: 行 e-hold・g-fresh。
      g-fresh-a（最終の記録を最後に読めた時刻にする）と g-fresh-b（つながりの切れの猶予と header の印）は 1 行 g-fresh にまとめる。理由: 2 つの裁定（t3-hub.52.38・.52.39）で、読みの落ちとつながりの切れは同じ古さ（最後に読めた時から今まで）で数え、同じ 1 つの印を同じ header に出すことになった。最終の記録の時刻はその古さの起点と同じ値で、net.rs の同じ状態から出る。割ると同じ net.rs・board.rs・account の board.rs を 2 行が続けて書く。
      g-keyed は問いの頁の 2 つの block（答えを待つ質問 ask.rs・まとめて承認 batch.rs）を書く。全体への指示（policy.rs）の form が読み直しで作り直されるのは、範囲の切り替えと問いの選びが問いの一覧に依るからで、行 g-policy-all がその 2 つを外す。そこで g-policy-all の行に「form を一覧の読みに依らずに 1 度だけ組む」を足し、g-keyed は policy.rs を書かない（同じ file を 2 行で直して捨てない）。
      e-snap（GET の口は bd を撃たず、見張りが読んだ字を返す）は便 e-coalesce の「読み終えた字は持ち回さない」を覆すが、持ち主の問いを置かない。理由: 見張りは印を 500 ms ごとに見て 5 秒ごとに読み直すので、要件 NFR2 の 5 秒と 1.5 秒（規則の行 R-21）は守られ、持ち主の指摘（t3-hub.1 の user 2026-09-28T00:4xZ・00:59Z・01:06Z・読み直しは要るが画面への出し方を工夫する・2 つの board が重い）の直しで、画面の振る舞いの選び肢を持ち主に問う種類ではない。
      g-gz の形: 圧縮の crate は xtask の側だけに miniz_oxide を 1 本足し、surface-build が dist の wasm・js・css の gzip の写し（.gz）を前もって作り、server は標準 library のまま Accept-Encoding を見て .gz を返す。境界の crate は外の依存 0 本のまま（歯 skeleton_boundary_std_only_and_bin_tz を保つ）。比べたこと（g-strip の後の wasm 3,018,891 byte・2026-09-28 に測った）: gzip -9 = 958,324 byte・brotli の品質 11 = 626,790 byte（gzip より 33% 小さい・3.8 秒）・zstd -19 = 676,800。brotli は足さない。理由は 3 つ。(1) 純 Rust の brotli の crate とその依存 alloc-no-stdlib と alloc-stdlib の license の BSD-3-Clause は、規則の行 R-2 の使ってよい license の一覧に無い。(2) browser は br を HTTPS の時だけ Accept-Encoding に載せる（推測）ので、local の Chrome の app mode（http）には届かず gzip の写しも要り、足すものが 2 つになる（裁定は 1 つ）。(3) 包みが 4 つで、miniz_oxide は 2 つ（miniz_oxide・adler2）。差の約 330 KB は build ごとの最初の 1 回にしか効かない（e-cache の後は 2 回目から 0 byte）。flate2 でなく miniz_oxide にしたのは、flate2 の純 Rust の backend が 4 つの包みを Cargo.lock に足すため（gzip の枠と CRC-32 は xtask に自分で書き、歯が標準の検査値と inflate の戻しで見る・枠を自分で書くのを避けたいなら flate2 に替えてよい・直接依存は同じ 1 本）。端末の gzip の道具に頼る案は退けた。理由: 道具は Cargo.lock にも manifest にも依存の数えの歯にも規則の行 R-2 の予算にも載らない見えない依存になり、surface-build はどの行の門でも走るので道具の有無と版が門の結果と出力の byte を host ごとに変え（条 N-3）、surface-build が撃つ外の道具を trunk の外に増やす。効果: 行 g-gz。
      g-reads の最初の読みは、知らせの接続（SSE）が開くのを 1 秒まで待ってから 1 巡だけ撃つ形にする（調べの案の、開いた直後の 2 巡目をやめる形は取らない）。理由: server は受け手を足してから頭を書き、繋いだ時に知らせを送らないので、接続が開く前に撃った読みは、読みの後から受け手を足すまでの間の変化を取りこぼす（今はそれを 2 巡目が拾っている）。2 巡目だけを消すと、変わりの少ない台帳では次の変化まで古い中身が残り、要件 NFR2 の 5 秒を破る。待つ形でも読みの本数は同じく 16 本から 8 本に減り、接続が上限の枠を先に取る。開かなければ 1 秒で読み、後で開いた時にもう 1 巡読む（取りこぼさない）。大きさは M にする（決め方を host の新しい module flight に出し、src と歯の file が増えたため）。効果: 行 g-reads。
      tz stage open を席から撃てなくする守りは、tz の口の中で環境変数 CLAUDECODE が 1 の時に断る形にする（Claude Code の Bash の道具が子 process に渡す値・器が実測・器の推奨 (a)・台帳 t3-hub.59 の notes 2026-09-28T03:1xZ）。器が席の役を知らせる環境変数（器の memo s2-07l.723）が着地したら、その判定に替える。持ち主は素の端末か board の button（i-8）から撃つ（席の入力欄の ! からの撃ちは同じ環境変数を持つので断られる）。退けた案: 器の rules 行に断る語を足す案は器が断った（器の rules の manifest は公開の repo で、非公開の隣の project の command の名を載せない・断る語の行は runner.denied_commands だけ）。tsuzuri の plugin の PreToolUse で command の字を断る案 (b) は、字の言い換えで抜けるので退けた。効果: 行 i-5。
      台帳で閉じた契約 bead の走行の札は、段が Landed でなければ止まった・動いている札にせず、pipeline の板の Landed の列に閉じた（着地せず）として置く（見本は消すが、消さずに済んだ側へ置く・欠陥の直しなので問いを置かない）。拠り = 持ち主の指摘 t3-hub.1（裁定 id = user 2026-09-28T04:1xZ）。効果: 行 c-pipe-closed（第 9 波の 6 行目）と、後の行 e-sess-closed・g-closed-mark。
      問いの起票の門（f-gate）の 4 種の要件は、語のとおり要件（Req）だけを数え、非機能要件（Nfr）は数えない（討論の記録 B §11.3 の 4 つは要件だけを挙げる）。判断の記録は、設計の索引が状態を持つまで状態によらず数える（処分を求めすぎる側・閉じる側・srs v0.12 の要件 FR4 の note）。問いの metadata の鍵は touches・not-relevant・digest にする（器は問いの metadata の鍵を持たず、揃える相手が無いので要件 FR4 の語を使う・器と決めるなら鍵の定数 2 つだけが変わる）。効果: 行 f-gate（ノート surface-wavef）。
      第 10 波 b の 2 行（ノート surface-wave10b）は、席が 2026-09-28 に実物の画面で見つけた欠陥の直しなので、計画だけの行（9 節）に置かずに起草してノートに置き（決まり 2 の例外・欠陥の直しは持ち主の問いを置かない）、承認は計画の裁定 t3-hub.56:20260927T2259Z-1 を継ぐ。e-idle-close = 境界の server は、要求の行の最初の 1 byte より前に相手が閉じたか読みが終わった接続（browser が先に張る接続・10 秒の読みの時間切れ）には何も書かずに閉じ、byte の届いた形の悪い要求と切れた要求には今のまま 400 を返す（今は read_request の誤りなら種類を問わず 400 bad-request を書くので、Chrome が先に張った接続を頁の移りに使い回して残った 400 を読み、board に素の bad-request の頁が出た・席の測りでは 11 秒の空きの後の GET に 400）。g-graph-label = 地図のグラフの組の箱と塊の箱の 1 行目・狭い幅の一覧の組の行・組の箱の card・開けなかった行に、~ の id でなく種類の原文の名と系と子の番号の範囲から組んだ題を出す（例 条 A・規則行・t3-hub.52 の 1〜12）。題は面で組む。理由: 台帳と走行の種類の日本語の名は面の表 KINDS にだけ在り（電文の種類の字は台帳と走行では英字）、面で組めば電文と中核と中核の歯の題の値を変えずに済むため。効果: 行 e-idle-close と g-graph-label（5 節の鎖）。
      表示面の行 i-2（ノート surface-wavei3）の起草で出た問いの席の決め。(1) 端末で Chrome が動いていて頁の窓が無い時、i-2 は計画の字のとおり新しい窓を起こさず、窓が無いことを名指すだけにする。持ち主が tz stage open で頼んだ時に頁の target を 1 つ作る手は行 i-5 に置く（持ち主の裁定 t3-hub.59.7 の、頼んだ時は開くを、この場合にも満たす）。(2) Windows と mac の起こし方は i-2 の範囲の外にする（ADR-15 の決定 (3) が Windows の据え置きの PC を後で別に問うとした・ADR-5 の決定 (5) は効いたまま）。(3) 同時に 2 度撃つと窓が 2 つになりうる穴の錠は行 i-5（tz の口）に置く。(4) 同じ口の番号に別の profile の Chrome が答える場合は、i-2 では見分けない（/json/version の中身で profile は分からない）。(5) 層 A の端末の行の display-env に DISPLAY を入れるかと、profile-dir を ~/ で書くか / で書くかは器の席の決めで、i-2 はどちらでも起こせる。効果: 行 i-2 の字と、計画の i-5 の字。（2026-09-30 追記）(1) は判断の記録 ADR-24 の決定 (4) で置き換わった: 動いている Chrome にその board の窓が無ければ、起こしてよい時は起動の引数で窓を足させ、頁の target を作る CDP の命令は撃たない。
      第 11 波 e の行 c-pipe-unmapped（ノート surface-wave11e）は、席が 2026-09-28 に器の実物の event log で見つけた欠陥の直しなので、計画だけの行（9 節）に置かずに起草してノートに置き（決まり 2 の例外・欠陥の直しは持ち主の問いを置かない）、承認は計画の裁定 t3-hub.56:20260927T2259Z-1 を継ぐ。c-pipe-unmapped = 器の RunStage の段 Failed と Stopped を板の段 Failed と Stopped の札にし（段の理由は detail の字）、器が worktree を畳んだ記帳（detail が retired の RunStage・器は段を動かさずに書く）では段を決めない（今は oom-kill・main-red ほかで落ちた open の bead の走行が表に無い段として板から消え、次の一手の止まっている走行にも数えられず、畳んだ記帳が最後の走行は FAIL の審査の後でも Gated の札か表に無い段になる）。retired の記帳で段 Stopped にしない理由: 問いの後に止めて畳んだ走行が止まっている走行に数えられて問いが隠れる（行 c-pipe-questioned の決めと同じ向き）。効果: 行 c-pipe-unmapped（5 節の鎖）。
      account board の決定待ちと未反映の数の出所の席の決め（2026-09-28）。計画の行 e-acct-qopen（各 anchor の台帳の open の問いの数を電文の project の行に足す）と e-acct-unref（各 anchor の未反映の数を足す）は置かずに退ける。憲法の条 P-27（決定はしご・出所は scribe2 の C17）のもう在るかの段で止まるため。電文の project の行の欄 ledger（Reading の LedgerStats）は各 anchor の台帳から open.question（open の問いの数）と unreflected（未反映の数）と unreflected_unknown（読めない種類）をもう運び、project board の指標の頁も同じ中核の stats を読むので、2 つの面の数は揃う。起草で見つけた端の形（問いの印 intake:question を併せ持つ epic や memo・先の時刻の closed_at）は、台帳の種類の片付け（判断の記録 ADR-16 の形の崩れの直し）が除く崩れた bead で、電文に 2 つ目の定義を置く理由にしない。account board の欄は行 h-acct-cols（ノート surface-wave12b）が電文の LedgerStats を読んで数にし、その計画の依存は着地済みの c-acct-thr だけにする（契約の行の depends は空）。
      第 12 波 f の行 e-marks（ノート surface-wave12f）は、器の席が 2026-09-28 に測った欠陥の直しなので、計画だけの行（9 節）に置かずに起草してノートに置き（決まり 2 の例外・欠陥の直しは持ち主の問いを置かない）、承認は計画の裁定 t3-hub.56:20260927T2259Z-1 を継ぐ。欠陥 = bd は --readonly の読みでも台帳の store の LOCK に排他の錠を取り、面の server は変化の見張りの 5 秒ごとの読み直しと印の読みと台帳を読む GET の口ごとに bd の読みを続けて撃つので、器の席の測り（2026-09-28）では器の台帳の錠が 15 秒の見本の 209 回の 209 回で取られ、器の台帳の門の読みが時間切れになった（1 回の読みが錠を 2.4 秒待った・門の上限は 6 秒）。今の印の jsonl 2 つは、器の着地の close が素の bd close で書き出しを飛ばすので動かないことがあり、それが 5 秒の読み直しの理由（席はつなぎとして、ほかの project の読むだけの board を止めた）。e-marks = 台帳の印を store（.beads/embeddeddolt の下の db ごとの .dolt/noms・db の名は周ごとに dir を読んで決める）の manifest の中身と journal の本体の長さにし、store の印で前の読みが読めていれば印の動かない読み直しを 60 秒（安全の網）にし、store が無ければ今の jsonl の印と 5 秒のまま。更新時刻を印にしない理由: 席の測り（2026-09-28・台帳の写しと実物）では bd の読みも manifest を同じ中身で置き替え journal と journal.idx の更新時刻を動かし、journal.idx の長さは読み手の間で行き来した（器の席の測りの、読みでは動かない、は長さと中身でだけ成り立つ）。更新時刻で見ると見張りの読みが自分の印を動かし、試作では受け手 0 人でも 15 秒に 8 回読んだ。同じ測りに拠り、計画の行 e-snap（GET の口は bd を撃たず見張りの字を返す）と e-idle（受け手 0 人の間は読み直さない）を同じノートに e-marks → e-snap → e-idle の順で置き、e-snap を a-lean の前に流す（a-lean は自分の repo の台帳を server の見張りの Source と分け合い、ほかの anchor の台帳にも store の印を使う）。規則の行 R-21 の値の字は直さない（store の印は書きごとに動き、見張りは印を 500 ms ごとに見て読む・60 秒は取りこぼしの網）。効果: 行 e-marks・e-snap・e-idle（5 節の鎖）と、計画の行 a-lean の依存。ノート surface-wave12f v0.2 の追記（2026-09-28）。e-marks は main 857d2b2 で着地した後、器の席の測り（bd 1.1.0 の組み込みの store・使い捨ての台帳と実物・印は .beads の metadata.json が名指す db の manifest の字と manifest が名指す file〔journal の本体と table の file〕の長さで、読みでは一度も動かず、書き〔import・append-notes・自動の書き出しを止めた append-notes〕ごとに動く・組む時間は 27 マイクロ秒ほど）に揃える後の行 e-mark-meta（S・同じノート・e-marks の後で e-snap の前）を足した。着地した印（.beads/embeddeddolt の下の dir を全部読み、manifest の中身と journal の本体の長さを見る）を、metadata.json が組み込みと名指す db だけの、manifest の字と名指す file の長さに替え、組み込みでない置き方と store の無い周は jsonl の印と 5 秒のまま。効果: 行 e-mark-meta（5 節の鎖）と、行 e-snap と計画の行 a-lean の依存。
      第 12 波 h の行 e-policy-q（ノート surface-wave12h）の起草の問いの席の決め（2026-09-28）。拠りは持ち主の裁定 t3-hub.60（ADR-16 の決定 (4)）と要件 FR8。(1) server が作る方針の問いの本文と metadata は、器の要件 FR81 の (a) の問いの形（概要・技術・理由・推奨の 4 行と metadata の effect）に揃え、effect は operation にする（方針は文書へ写す答えでなく、席の次の問いの置き方に効く）。器の起票の門は席の道具の呼び出しだけを見るので server の書きは断られないが、器は label intake:question を問いとして読むので形を埋める。(2) 方針の問いは字 方針 id = の行だけを持ち、字 裁定 id = の行を持たない（取り消しの button〔行 e-revoke〕と器の束 A の bind の的にしない）。(3) 画面の「これまでの決定」の一覧と数から方針の問い（label policy-scope: を持つ bead）を外す分はこの行が持つ（ノート v0.2・契約の ledger に label の頭と判じの fn を置き、境界と面が同じものを使う）。決定待ちの数と問いの card は外さない（open の方針の問いは書きが途中で落ちた時だけ残り、席が閉じる合図になる）。面の方針の form の断りの字 NO_MEMO の片付けと、契約の doc の字（RulingId の方針の字・NodeKind::Policy）は、この行の外にして行 g-policy-face に置く。設計ノート surface の節点の一覧の方針の字は、e-policy-q の着地の後に席が直す。(4) bd の create の --metadata（JSON の object）・--labels・--silent・--no-inherit-labels の形は、台帳の既存の metadata（touches の object）と bd の help で確かめ、器の席も器の読みと食い違わないと答えた。--metadata と改行を含む --description の実物の書きは着地の後に席が 1 度確かめる。(6) 方針の id は問い id の形のままにし、追跡される文書は方針の id を引かない（器の要件 FR83 は問い id の形を閉じた問いの字 裁定 id = の欄にだけ解くので、引けば器が断る＝機械が持つ決まり・器の推奨の字 裁定 id = policy: の形は tsuzuri の中核の裁定の節点と取り消しの button に入るので取らない・文書が方針を引く要が出たら新しい判断の記録で移す・便 t3-hub.52.81 の notes）。(5) t3-hub.29 は着地の後に席が閉じる。効果: 行 e-policy-q と g-policy-face。
      地図の設計の出所の欠陥（持ち主の指摘 2026-09-28）の席の決め。席が folio の pin を 6467915（folio2 の判断の記録 ADR-32）に上げた時から、索引が種類「設計ノートの行」の節点 158 と辺の型 req・depends を出し、中核の索引の読み（build.rs の read_design）は知らない種類の行が 1 つでも在ると索引の全部を読めない（None）としたので、地図の設計の節点が 0 になった。pin を上げる前に、面の server が撃つ graph --print の出力を今の電文で読めるかを確かめなかったのが席の漏れ。つなぎ: 面の server の --folio だけを 1e6ab0f にした（席の管理の道具 serve/restart.sh・席の folio は 6467915 のまま）。直し = 行 c-dn-rows（新しい種類を note-row の節点に読む）。着地して server を組み直したら、server の folio を席の pin に戻す。以後、folio の pin を上げる時は、面の server の索引と要約の読み（tz graph と /api/graph）を新しい binary で撃って unread が無いことを確かめてから上げる。知らない種類で索引の全部を落とす今の決まりは、その節点か辺だけを飛ばして数える形（条 P-7 の、まだ分からないを数で出す）に行 c-dn-unknown で替える。効果: 行 c-dn-rows・c-dn-edges・c-dn-unknown。
      行を書く作法（審査と門で止まった実例から・詳しくは docs/handoff/2026-09-27-t3-screen-wave.md の 7・14・15・16 節）。
      作法 1: 審査の目は行と節と要件の字と write-set の file の宣言の名しか見ない。使う型・関数の path・pub か・wasm に限るか・引数と返り・class が stylesheet に在るか・語の鍵が辞書に在るかを節に書き、確かめた事実は確かめたと書く。
      作法 2: file の行数と行番号を書かない（審査は幅で均した行数を見る）。fn・const・型の名で指す。歯が頼る fixture の欄と値は行の節に字で書く。
      作法 3: done の 1 項ごとに、それを落とせる歯の名を書く。DOM だけの振る舞いは host の純粋な関数か、名のある目印の間の source の字を読む歯で見て、組めることは xtask の surface-build で見る。
      作法 4: write-set の外の着地済みの歯を grep で全部探し、期待が変わる歯の file は write-set に足して節に直しを書き、直さずに通る歯は何を読むから通るかを書く。書かないが審査に見せたい file は置き場だけの = で足す。
      作法 5: 新しい歯の名は接頭辞で始め、接頭辞の後に着地済みの verify の filter の語を含めない。done にその見張りの歯を置く。
      作法 6: 新しい電文の型は自分の歯の file と snapshot を持つ（contract_form に足さない）。電文の欄を足す行は、その型を struct の字で組む着地済みの歯と snapshot を全部 write-set に入れる。
      作法 7: 許す範囲は歯が見る広さと同じにする（狭く書くと正しい実装が門で落ちる）。面に判定を書かせず、面が出す数は電文の欄に在るものだけにする。
      作法 8: 受付の上限は src の 1 file 1500 行で、大きさ S は 100 行・M は 300 行の余白を数える。上限に近い file は先に中身を新しい file へ移す行を置く。
      作法 9: fixture は小さく（審査の diff の上限）。散文と done に二重引用符と逆斜線を書かない（導出が止まる）。done に「コロンと空白」と「空白と井桁」の並びを書かない。host の名・住所・口座の名を書かない。
      作法 10: 行を流す前に、審査の目の材料だけで問いを出し main の code で答える事前の点検の agent を 1 本撃つ。
