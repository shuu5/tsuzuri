    title: 他の席を待つもの
    body: |
      folio2: folio graph --print --summary（JSON Lines・欄 id・kind・file・line・title・plain・eng・無ければ null・eng は shall・text・what・decision の最初、条は最初の規範文、受入基準は題の全文）。folio2 の要件 FR14 の字の変更に持ち主の承認が 1 回要り、folio2 が自分の問いとまとめて問う。c-summary-design と c-summary-wire はこれを読んで写す形で着地した（第 6 波）。g-summary と c-summary-ledger は第 8 波、c-updated は後。
      器（scribe2）の要件 FR50（着地の終端）: 列車の先端でない便が ci の測れない終わりで止まり bead が閉じない欠陥の直しが効くまで、先端の CI が success で自分の sha が祖先なら席が手で閉じる（道具 close-unmeasurable の見張り）。直しが効いたら見張りを外す。
      器（scribe2）の答え（2026-09-27T23:0xZ・決着）: 器は裁定を queue しない。seat deliver は待ちで入力欄が空の席にだけ 1 回送り、考え中なら型付きの理由で断る（器の FR79・ADR-0077）。考え中の席へは消費側（tsuzuri）の停止の hook が拾う（ADR-0077 CTX2・CSQ-N3）。再送は要らない。board の「届いていない」は hook の配達済みの印で決める。→ 行 f-stop。f-stop の着地までは席が台帳から裁定を読む。
      器（scribe2）の答え（2026-09-27T23:3xZ・決着）: 停止の hook と門の hook の入れ先は、tsuzuri の repo の根に追跡される plugin/（.claude-plugin/plugin.json と hooks/hooks.json）。scribe2 seat が起こす席は --plugin-dir で読む。答えの「runner には載らない」は誤りで、器は便ごとに worktree の plugin を runner の plugin の dir に写す（scribe2 24aaa5a の pipe/spawn.rs の copy_plugin・席が確かめ器に伝えた・lens には載らない）。そこで停止の hook は repo が git の worktree なら黙る。門の hook は runner では撃たない（器が runner の plugin の写しの根に置く空の印の file scribe2-runner の在否で判じる・器の docs/design/consumer-sync.md・runner の tz は組みかけか無い・裁定 t3-hub.55.3 の字は席の設定に門を入れる・席の決め 2026-09-29 は行 f-gate-install の起草の問い）。f-stop が Stop を、f-gate-install が門の PreToolUse を同じ hooks.json に足す（裁定 t3-hub.55.3・門の着地の後）。器の Idle の打刻が hook の続けの間に古くなる件と、同じ anchor に席が 2 つ在る件は器の memo s2-07l.723 に在る。
      器（scribe2）の答え（2026-09-28T00:0xZ・決着）: seat deliver の --ruling は 1 回に id 1 つ（64 byte まで・英数と . - _ :）。束の id（batch:…）も形を通るので、束は束の id で 1 度だけ送る（行 f-mark-serve）。束の 2 つ目の配達は、1 つ目の注入で席が考え中になり断られた（2026-09-27T23:57Z の実物）。
      器（scribe2）の答え（2026-09-28・決着）: 群の移動の断りの event（GroupMoveRefused）が持つ理由は語 no-candidate だけで、候補ごとの門の結果はどこにも残らない（候補ごとの結果を doctor の群の行に足す話は器の memo s2-07l.725・着地したら写す行を起こす）。逼迫の印は event GroupPressureNotified の行そのもので、窓と使用率と閾値（window・used・cap）を持つ。役割の model は器の rules 行 seat.model.<役> から読む。→ 行 c-acct-thr（写すだけ）と h-thr-home（知らせの行から描き、式を持たない）。席と器の runner の役を hook に知らせる環境変数は器の memo s2-07l.723 の候補（着地すれば、停止の hook が worktree かどうかで runner を見分ける今の形を替えられる見込み）。
      器（scribe2）の答え（2026-09-28T04:5xZ・決着）: f-undelivered の席の受けの印と、e-approval-event の裁定ごとの逐語つきの event は、同じ event RulingReceived（actor=human・bead・detail に逐語・席が scribe2 seat ruling add を撃った時に 1 行・便の承認は別に ApprovalReceived）。i-11 の知らせは今は event でない（知らせは notify の 1 行だけ）。器の memo s2-07l.732 は dispatcher.md §29 の行 ad に上がった（終端の周の idle の行の末に pending= を足し、notify の結果の行を stderr にも出す）。ad の着地で、i-11 の材料を決め、席の 30 分の止まりの点検を pending= を読む形に替えるか外す。→ 行 f-undelivered・e-approval-event・i-11。f-undelivered の席の受けは、答えの時刻に必ず在る RulingReceived でなく配達済みの印で判じる（席の決め 2026-09-29・計画 第 1.03 版・RulingReceived は e-approval-event の承認の記録にだけ使う）。
      文書の運用の強制の 5 段（判断の記録 ADR-14）: 段 1（床の形は folio2・実在は器）・段 2（folio2 の鍵の行と計画の索引の生成・tsuzuri は鍵の行で加わる）・段 3（器）・段 4（器と folio2）・段 5（器）。各席の判断の記録の id と着地の順を受けたらここに書き、着地した段から加わる。folio2 の分は bead f2-648.267・判断の記録 folio2 ADR-31（改訂 c・folio2 の要件 v1.53 と合わせ folio2 の持ち主の承認待ち・条 P-12.1）。順は 渡し A（段 1 の床の形・全部の repo に効く）→ 渡し B（段 2・計画のノートの規則の行〔仮の名 plan-note〕と、行の索引 row-index・大きさと書く file を持つ行の計画 row-plan・決定の表 decision-table）→ 渡し C（段 4 の folio の分・folio check --emit-rulings で design-intent が引く裁定 id を書き出す）。tsuzuri は渡し B の着地（2026-09-28・folio f300177）の後に、この計画を 1 つの commit で新しい形へ移した（第 0.14 版）。器の分は memo s2-07l.722（器の判断の記録の番号は着地で付く）。順は publish-guard（器の FR80）の着地の後に、器の判断の記録 1 本 → 器の要件の改訂 → 段 5 → 段 1 → 段 4（doctor の行と tick の警報 → dispatch の断り → 着地の比べ）→ 段 3（folio2 が床の終了の約束を決めた後）。
      器（scribe2）の答え（2026-09-28・決着・束 A の要件 FR83 と器の ADR-0083 に入る）: 追跡される file の中の裁定 id の形の字の引きは 3 つの決まりで見る。A = 問い id の形は、問いの部分が台帳の接頭辞（tsuzuri は t3-hub）で始まる時だけ引きとして数え、閉じた問いの字 裁定 id = の欄に解く（fx-p.7:… のような fixture は数えない）。B = 字 batch: と policy: の形（と時刻の形）の fixture は、器の宣言の鍵の閉じた一覧に字どおり載せた時だけ引きでない（鍵の名は束 A の着地で器が知らせる）。(1) = batch: と policy: の形は、裁定の行の 裁定 id の欄か 束 の欄に等しければ解ける（封じた判断の記録の束の引きはそのまま解ける・一覧に入れない）。tsuzuri の方針の id は問い id の形で字 方針 id = の行だけを持つので、追跡される文書は方針の id を引かない（3 節の第 12 波 h の (6)）。席の点検（67b74e3）: t3-hub の形の 38 個のうち 33 個は解け、5 個は fixture が台帳の接頭辞を使っている（行 t-fx-prefix で替える）。batch: と policy: の形の字は 18 個（本物の束の引きと fixture が混ざる・一覧は鍵の名が来てから数える）。tsuzuri の ruling-check の宣言は、束 A の着地・t-fx-prefix の着地・B の一覧の後。宣言の前に、設計文書に残る台帳の接頭辞の見本の字（設計ノート surface の問いの id の例と、ノート surface-wave12d の行 e-revoke の done の 2 つ）も席が直す（第 15 波 c の起草の調べ）。
      folio2 の答え（2026-09-28・folio2 の判断の記録 ADR-32 の決定 (5)）: 索引の要約（graph --print --summary）の節点ごとの裁定 id の欄は足さない（第 13 波 d の起草からの頼みは取り下げた）。行 c-g3g7（ruled_by の辺）は、check --emit-rulings の行を節点の id で、無ければ file で要約の節点に結ぶ（その行が全数なのは check が合格の時だけ）。結び方の手順は folio2 が送る。手順は届き、c-g3g7 はノート surface-wave15d に置いた（第 0.48 版・結んだ節点 225・行 328 は folio2 の数え方と同じ）。
      issue の一生（案件の一生）の道筋の整理（持ち主の指示 2026-09-28T11:4xZ・控え t3-hub.63）: 器の席と段の表に合意し、器の持ち主が器の問い 1〜5 に答えた（2026-09-28T13:12Z〜13:47Z・器の側の記録）。持ち主の発言は要望・答え・会話のどれかで閉じ（要望は発端を持つ memo で、独立の種類にしない）、席の問いは台帳の問いにし、段は器の 1 つの関数が局面の出力（state dir の fleet/lifecycle.json と古さの印 lifecycle.stale・部品ごとの局面・手番〔user・seat・vessel・runner・ci・none〕・局面に入った時刻・理由・結び）に書き、t3 は自前の段の計算をやめて描くだけにする。器の束 E（要件 v0.29・ADR-0087〜0089）は器の main に着地した（2026-09-29）。局面の語と欄の名と引き金の行の字面の文法を持つ器の設計 doc の § はこれから書く（欄の名の草稿と文法は t3 が行を置く前に器の席が送る・日付は約束しない）。t3 の行は、つなぎの c-pipe-ci（ci の読みを分けて置く）と c-ledger-stage（台帳の一覧の状態の語を pipeline の板と同じ段の読みから出す・器の席の許し 2026-09-28T23:1xZ）と c-unref-now（未反映の memo を代用で数えない）、局面の出力の着地の後の c-unref-lc・g-unref-lc・c-ledger-lc・g-pipe-memo（つなぎと自前の段の計算を外す）。器の束 A の残り（発話の event・seat ruling bind・答えの口）は、器の設計 doc の § も行もまだ無い。
      持ち主にまだ問うこと: 今は無い（e-revoke と j-runner は t3-hub.52.60 と .52.61 で裁定が付いた・3 節）。表示面 i の問い t3-hub.59.1〜.59.7 は全部裁定が付いた（3 節）。g-seat-hb と c-summary-ledger は裁定が付いた（3 節の t3-hub.52.29 と t3-hub.52.27）。
      表示面の問い t3-hub.59.6 と .59.7 は裁定が付いた（3 節・束 batch:20260928T0249Z-1）。判断の記録 ADR-15 は発効し、要件 FR16 と受入 AC13 の字と scope の not_build は srs v0.10、傘の行 i の字は設計ノート surface-board の第 0.21 版で直した（行 i-4 との食い違いは解けた）。
      器（scribe2）の memo の判定（器の ADR-0085 と ADR-0089〔どちらも着地〕・器の席の答え 2026-09-28T23:1xZ と 2026-09-29T00:1xZ）: memo は label intake:memo の bead で、昇格条件の節に閉じた 5 形（再発・同梱・依存・期日・着地）の引き金の行を持ち、器の dispatch の周が判じる（行の字面の文法は器の設計 doc・器の判じ手はまだ無い）。開いた memo の局面は memo-promoting（昇格の途中）・memo-asking（問いの返事待ち）・memo-actionable（処置の待ち）・memo-waiting（引き金待ち）の 4 つで、どれにも当たらない memo は misfit（形の崩れ）。席の宿題は memo-actionable と misfit だけ。閉じの理由の頭は「昇格済み <契約 id の列>」「まとめた <memo id>」「見送り <裁定 id>」の 3 つで、昇格は昇格の行（「昇格: 全部 <契約 id の列>」か「昇格: 一部 <契約 id の列>」・最後の行で判じる）と契約からの discovered-from の辺で辿る（判断の記録や別の repo の台帳への移しは昇格に数えない）。席が手で書く「昇格済み」の閉じは、閉じた時点で自動の close の条件を満たさないか、並べた契約 id が最後の昇格の行と違えば misfit になる。処置の待ちの知らせ直しは memo-actionable を出るまで続く。常設の memo は置かない。t3-hub.1（常設の裁定の控え）は、持ち主の裁定 t3-hub.1.1（判断の表 d37）で「見送り」として閉じた。以後、要望は発端を持つ memo の notes、問いへの答えは問いの notes の裁定の行、問いの無い裁定の逐語は器の口 scribe2 seat ruling add に残す。閾値の案（memo.triage_interval_h・memo.triage_per_round）は器の裁定待ち。行 g-pipe-memo は器の局面の出力の memo の局面を描く形で起草する（器の頼み・欄の名が決まるまで起草しない）。器の形の判定（2 つの印の崩れ）は、器の doctor が引数 --repo の周に出す台帳の形の行（器の crates/scribe2/src/ledger/form.rs の render・欄 both と neither）を写す（撃つのは境界の server の台帳の見張りの読みの周だけ・席の決め 2026-09-28・ADR-16 の決定 (6)・行 c-pipe-misfit・ノート surface-wave12g）。
      folio2 の答え（2026-09-28・folio2 の bead f2-648.270 と判断の記録 ADR-32）: 設計ノートの行は ADR-32 で folio graph の節点（種類 note-row）になり（folio 6467915）、行 c-dn-rows はそれを読んで着地した（便 t3-hub.52.86）。c-g9 の本文の出所も同じ索引を読む（tsuzuri は設計文書の YAML を走査しない）。
      folio の code の持ち込み（判断の記録 ADR-4・制約 CON2 の出口）: k-parity の前提。CON2 の 3 点は記帳した（2026-09-29・memo t3-hub.68・folio2 の台帳が名指した）。合流の 3 段目は持ち主が決めた（判断の表 d40〜d43・控え t3-hub.67）: 器と folio は 1 つずつにし元の repo は凍結（tsuzuri は持ち主の承認 t3-hub.67.5 で 2026-09-29 に公開にした・秘密の鍵と token が履歴の全部に無いことを席が確かめた・台帳は別の非公開の repo のまま）・folio2 が先で scribe2 が後（folio2 = tsuzuri の求めの便 203・204 と増殖の案の folio の側の着地の後、持ち込む commit で folio2 への便を止め、木を丸ごと 1 つの sub-dir へ・scribe2 = 器の束 E の実装の核の着地の後で全部の便の列が空の時）・持ち込みの段で器の名は変えない・持ち込む code は t3 の規則（R-4・R-10・R-2）と条 N-3（器の宣言 file の効いているかの旗・判断の記録 ADR-19 の決定 (2)）の除外の表で持ち段ごとに外し（N-3 の除外は持ち込みの着地から 30 日で外れていなければ持ち主に問い直す）、依存は持ち込みの時に一覧で 1 回承認を取る。判断の記録 ADR-18（ADR-4 の 3 段目の具体化・発効 2026-09-29）に決定 (1)〜(9) を書き、決定 (3) の folio2 の分は判断の記録 ADR-22（持ち主の裁定 t3-hub.67.31）が移し替えの形に置き換えた。LICENSE は持ち主の裁定 t3-hub.67.6（判断の表 d45）で scribe2・folio2 と同じ MIT OR Apache-2.0 にし、行 t-license（ノート surface-wave19g）が置く。持ち込みの段取り（席の決め 2026-09-29・起草の予行）: 写しの main に folio2 0c910db を番号（commit id）を保ったまま folio2/ へ別の根として merge すると、folio の凍結 anchor の検査が folio2 の昔の commit を tsuzuri の anchors と同じ path に読んで床が不合格（違反 9）になり、xtask pub-scan が 9 件当たった（歯と設計の文の範囲の端の値）。そこで 2 つの直し（F1 = tsuzuri の側で folio2 の履歴を folio2/ の下へ移し替えてから持ち込む（ADR-22）・F2 = folio2 に頼む、歯と設計の文の範囲の端の値の字を組みにする直し）を取り、持ち込む commit は F2 の着地の後の folio2 の最新にする。F1 は folio の検査を直す folio2 の便 210 を使わない（folio2 の検証役が差し替えの穴を見つけ、folio2 の席が採らなかった）。tsuzuri の側の行はノート surface-wave23b の t-pub-fp（pub-scan の commit の走査を本流に限る・merge の前に着地）と t-carry-ex（持ち込んだ木への規則の除外の表・merge の着地の後に流す）。merge は器の便では入らない（器の着地は親 1 つの squash で folio2 の履歴が main から辿れず、差分は審査の上限の約 100 倍）。持ち主は t3-hub.67.28 で、席が写しで予行した script を持ち主が 1 回撃つ形を選んだ（merge の間は席が tsuzuri の dispatch を hold し、script は anchor の checkout で ff して push する）。script は folio2 の写しの clone で履歴を移し替え、本数・木・作者と日付と本文の要約・対応表の全行を照らしてから merge する。持ち込みの merge の直後の設計席の commit で、古い番号と新しい番号の対応表 docs/carry/folio2-ids.tsv を置く（ADR-22 の決定 (6)）。依存の一覧は t3-hub.67.29 と決め直しの t3-hub.67.30 で決め、判断の記録 ADR-21 に書いた。folio2 に直し F3（YAML の読み手の既定の機能を切って encoding_rs を外す・folio の code は変えない）を頼み、持ち込む commit