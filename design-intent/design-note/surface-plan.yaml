-1 を継ぎ、拠りは 3 節の席の決め・4 行は ledger.rs か events.rs と歯 tests/server_src.rs で重なるので depends と便の bead の依存でこの順に流す・e-snap の後に a-lean）。ノート surface-wave12g = c-pipe-queue（v0.1）と c-pipe-misfit・g-pipe-misfit（v0.2）の 3 行（置いた・承認は計画の裁定 t3-hub.56:20260927T2259Z-1 を継ぎ、拠りは持ち主の裁定 t3-hub.60 と t3-hub.52.71・c-pipe-misfit は器の doctor の台帳の形の行を写し、撃つのは境界の server の台帳の見張りの読みの周だけ〔席の決め 2026-09-28・ADR-16 の決定 (6)〕）。ノート surface-wave12h = e-policy-q の 1 行（置いた・承認は計画の裁定 t3-hub.56:20260927T2259Z-1 を継ぎ、拠りは持ち主の裁定 t3-hub.60 と要件 FR8・契約の 3 file を書いた e-revoke は着地済み・c-pipe-misfit はこの行の後）。ノート surface-wave13b = f-premises と g-policy-face の 2 行（第 0.1 版・置いた・承認は計画の裁定 t3-hub.56:20260927T2259Z-1 を継ぎ、拠りは要件 FR8〔要件書 v0.15〕と持ち主の裁定 t3-hub.60 と t3-hub.64〔裁定 id = t3-hub.64:20260928T1204Z-1・1 度の確認〕・依存の e-policy-q は着地済み・2 行の write-set は置き場だけの = を含めて互いに素）。ノート surface-wave13i = c-pipe-ci の 1 行（置いた・承認は計画の裁定 t3-hub.56:20260927T2259Z-1 を継ぎ、拠りは持ち主の指示〔チャット 2026-09-28T11:4xZ・t3-hub.1〕と要件 FR10・g-pipe-misfit の便の後に流し〔面の pipeline.rs と vocab.json が重なり、g-pipe-misfit の歯 gfix も書く〕、順は便の bead の依存で持つ・同じ file を書いた c-pipe-misfit は着地済み・境界の歯 server_read・server_coalesce・pmisroute も置き場だけの = で持つ・契約の歯 contract_form と snapshot は c-dn-unknown と c-dn-edges〔ノート surface-wave14d〕の後、語の辞書は c-dn-edges と h-acct-spark〔ノート surface-wave15b〕の後に書く）。ノート surface-wave17b = t-allow-runsdoc（中核の歯 tests/runsdoc.rs だけを書き、ほかの行と重ならない）と c-misfit-pair（境界の server の form.rs・ledger.rs・mod.rs・board.rs・routes/pipeline.rs と歯 pmisroute）の 2 行（書く file が重ならないので depends は空・承認は計画の裁定 t3-hub.56:20260927T2259Z-1 を継ぐ・c-misfit-pair はほかのノートの行との順を便の bead の依存で持つ）。ノート surface-wave18c = h-win-store（account board の windows.rs・store.rs の on_change・board.rs の戻るの閉じの知らせと歯 hwstore）と g-coach（新しい widgets/coach.rs・widgets の mod.rs・board.rs の案内の層と歯 gcoach）の 2 行（どちらも board.rs を書くので g-coach は h-win-store の後〔depends〕・承認は計画の裁定 t3-hub.56:20260927T2259Z-1 を継ぐ・ほかのノートの行との順は便の bead の依存で持つ）。表示面の第 1 波 = i-1 と i-3（ノート surface-wavei・どちらも着地した・i-3 は i-1 の後・書く file は boundary/stage の下と boundary/lib.rs と新しい歯と fixture だけで、board の行