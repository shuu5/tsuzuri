sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      持ち主の 2 つの board が重く、質問の頁で答えを書いている最中に画面が一瞬全部消えるという指摘への最初の 4 行と、全体への指示の範囲の直し 1 行。
      境界では、台帳の読みが落ちたときに最後に読めた字を 60 秒まで返し続け、読みの落ちた応答の頭に最後に読めた時からの秒を載せる（e-hold・値は規則の行 R-21 と要件 NFR2）。15 秒を越えた時の一番上の帯の注意の印は、面の後の行 g-fresh が置く。
      面では、問いの頁の答えを待つ質問の card とまとめて承認の行を鍵つきの一覧にし、読み直しで中身の変わらない card と行の DOM を作り直さない（g-keyed・答えの欄の focus と caret と変換の途中を守る）。
      配布では、workspace の release の profile の strip で面の wasm の関数の名の表を抜く（g-strip・7.9〜8.3 MB から約 3.0〜3.2 MB の見込み）。
      面の通信では、最初の読みを知らせの接続の開きに合わせて 1 巡にし、読みの途中の口と片付いた部品の口に重ねて撃たない（g-reads）。
      問いの頁の全体への指示の block は、範囲の切り替えと問いの選びを外して方針の逐語をつねに範囲 全体 で送り、問いの一覧を読まずに字の欄と送る button を 1 度だけ組む（g-policy-all・server の口は変えない）。
      外の依存は足さない。
