  - n: 3
    type: prose
    title: 行 e-hold — 読みが落ちても最後に読めた字を 60 秒まで返し、応答の頭に古さの秒を載せる
    body: |
      なぜ。持ち主は project board の質問の頁で、答えを書いている最中に画面が一瞬全部消えると指摘し、「リロードは必要だとは思うが画面表示への反映の仕方を工夫しろ」と求めた（記帳は t3-hub.1（裁定 id = user 2026-09-28T01:06Z））。2 つの board が重いという指摘もある（project board は t3-hub.1（裁定 id = user 2026-09-28T00:4xZ）・account board は t3-hub.1（裁定 id = user 2026-09-28T00:59Z））。重さの調べ（2026-09-28・席の作業場の pb-perf/report.md）で原因を実測した。高負荷の時、台帳の読み（bd を子 process で撃つ）の 9.4% が 5 秒の上限で落ちる。落ちた読みは合流で同じ時の全部の要求に配られ、口は 200 で まだ分からない を返し、面は猶予なしに block を丸ごと置き換える。質問の頁で 554 ミリ秒と 1988 ミリ秒の消えを測った。持ち主は t3-hub.52.38（裁定 id = t3-hub.52.38:20260928T0154Z-1）で、落ちても最後に読めた中身を 60 秒まで出し続け、出している中身が 15 秒より古くなれば一番上の帯に読み込み不良の注意の印を出すと決めた。t3-hub.52.39（裁定 id = t3-hub.52.39:20260928T0155Z-1）で、変化の知らせのつながりの切れも同じ決まりに揃えた。値は規則の行 R-21 に足した値（最後に読めた中身を 60 秒 まで出し続ける・最後に読めた時から 15 秒 を越えれば注意の印・60 秒 を越えれば中身を測れていないにする・古さは server が読みの落ちた応答の頭に載せる最後に読めた時からの秒と面の時計の経過で数える）と要件 NFR2 の字に在る。この行は server の側だけを置く。最後に読めた字の持ち回しと、応答の頭の秒と、server と面が同じ値を読む契約の型の定数。面の注意の印と 60 秒の諦めとつながりの切れの扱いは後の行 g-fresh が置き、この行は面の crate を触らない。閉じた見張り t3-hub.53.2（負荷の時に account board の台帳が測れていないに落ちる）もこの行が引き継ぐ。
      在りか（main 578f948 で確かめ、4fdf420 と 398516a で読み直した・その間に境界の crate と契約の型の crate で変わったのは第 7 波の行 e-watch-steady〔418b673 で着地〕の src/server/events.rs と歯の server_read.rs と新しい wsteady.rs だけで、この行の書く file と読む file の字は同じ・events.rs の Hub の start の字も同じ・4fdf420 の後の着地は第 8 波の面と中核の 4 行）。境界の crate の src/server/ledger.rs（server の mod.rs の pub mod ledger・host の code）の pub struct Source は pub な欄 repo（PathBuf）と bd（OsString）と私的な欄 shared（server の coalesce の Coalesce の String）を持ち、derive は Debug と Clone、PartialEq と Eq は手で書いて repo と bd だけを比べる。pub fn new（repo と bd を Into で受ける）・marks（.beads の issues.jsonl と interactions.jsonl の path）・read（text を parse_bd に渡した値・None なら Reading の Unknown）・text（shared の share に BD_WAIT と text_alone を渡した値・走っている読みが在ればその終わりを待って同じ結果）・text_alone（capture で bd に BD_ARGS を渡し、BD_TIMEOUT の 5 秒で返らないか rc が 0 でなければ None、出力が UTF-8 でなければ None）を持つ。pub fn parse_bd（&str を受け Reading の LedgerItem の Vec）は bd の JSON の配列を読み、1 本でも読めなければ Unknown。pub fn list（&Source を受け LedgerList）と pub enum Lookup（Found・Missing・Unknown）と pub fn item（&Source と &BeadId を受け Lookup）は source の read を使う。ほかに pub const BD と BD_ARGS と BD_TIMEOUT（5 秒）と BD_WAIT（6 秒）と、proc と clock の名の再公開（epoch_secs・KILL・capture・stop_with）が在る。src/server/coalesce.rs の pub struct Coalesce の pub fn share は走っている読みを分け合うだけで、読み終えた値は持ち回さない（この行は coalesce.rs を書かない）。src/server/board.rs の pub struct Sources（pub な欄 ledger の Source・design・runs）の pub fn gather（&self と design と events の bool を受け Texts）は台帳の字を self.ledger.text() で集め、pub struct Texts（pub な欄 design・ledger・events・summary の String・derive は Debug と Clone と Default と PartialEq と Eq）を返す。src/cli/graph.rs は Texts を欄と ..Texts::default() の更新の形で組み、Sources を欄の字で組む（Source::new を呼ぶ）。src/server/mod.rs の私的な fn json（状態の u16 と wire の encode の結果を受け Response）が口の 200 の電文の応答を作り、src/server/http.rs の pub struct Response の pub fn header（self と &'static str の名と Into の String の値を受け Response を返す）が頭の行を足す（pub fn json は頭 Cache-Control の no-store を付ける）。口は src/server/routes の下に 1 口 1 file で在り、各 file の pub(in crate::server) の const ROUTE（Entry）の handle が要求と Shared を受ける（around.rs は handle の閉包が私的な fn around に要求と Shared の sources を渡す・account.rs は閉包が私的な fn account に Shared を渡す）。routes/project.rs（口 /api/project・write-set には置き場だけの =）の私的な fn project は Shared の sources の ledger の欄 repo を canonicalize した path の最後の名を ProjectName の電文にして 200 で返し（名が引けなければ 503 no-name）、台帳を読まない。台帳の字を読む口は 11 で、ledger.rs（/api/ledger・ledger の list）・item.rs（/api/ledger/<id>・ledger の item・無ければ 404 no-item・読めなければ 503 ledger-unknown）・questions.rs（/api/questions・sources の ledger の text を中核の question の list に渡す）・metrics.rs・pipeline.rs・next.rs・graph.rs・graphview.rs・around.rs・unreflected.rs（どれも gather の Texts を board の関数に渡す）と account.rs（/api/account・Acct の doc）。src/server/events.rs の Hub の pub fn start は Hub::watch に source の marks と move || source.read() の閉包を渡し、Hub::watch は最初の読みを戻る前に撃ち（Server::bind は戻る前に台帳を 1 回読む・mod.rs の bind の doc の字）、その後の見張りは印が動くか前の読みから 5 秒（events の REREAD）を過ぎるたびに read を撃ち、値が前と違うときだけ ledger-changed を送る（この行は events.rs を書かない・置き場だけの =）。server の config の pub struct Config（src/server/config.rs・mod.rs が再公開する）は pub な欄 repo・bind・files・bd・state_dir・folio・bdw・seat・scribe2 と、repo と bind と files を受けてほかを既定で埋める pub fn new を持つ。src/acct.rs の pub struct Acct（derive は Debug・欄はどれも私的）の pub fn new（器・git・bd の program と state dir と cwd の 5 つ）と pub fn doc（&self と EpochSecs を受け AccountDoc）は、私的な fn texts が seat の HOLD（5 秒）持ち回す私的な struct Texts を返し、私的な fn gather の 2 段目が state dir の引けた anchor ごとに Source::new(a, self.bd.clone()).text() を新しく作って撃つ（読みごとに作り直すので、合流も持ち回しも無い）。裁定と束と方針の受付（ruling.rs・batch.rs・policy.rs）と停止の hook（hook の stop.rs）は text_alone を使う。着地済みの歯 tests/kcli.rs（write-set には置き場だけの =）の私的な fn texts は board の Texts を 4 つの欄 design・ledger・events・summary の struct の字で組み、..Texts::default() を使わない（Texts に欄を足すとこの歯が組めなくなる）。中核の値でこの行の歯が拠るもの（確かめた）。board の gather は読めない出所を空の字で集め（設計の道具の program が無ければ design の text と summary は None・state dir が無ければ runs の text は None）、中核の関数はその部分だけを まだ分からない にするので、metrics・pipeline・next・graph・graphview・around・unreflected の口はどれも 200 の電文を返す（next は起動の引数に席が無ければ席の card を読まない・around は中心の節点が無いときだけ 404 no-node）。中核の graph の build は台帳の bead をどれも節点にする（設計の索引の字が空でも台帳の bead の節点は在る）ので、fixture の台帳の字を持てば口 /api/around?id=fx-hub.3 は 200 で、中核の ledger の stats は fixture の台帳の字で Known を返す（着地済みの歯 server_coalesce_seven_routes_share_one_bd が同じ fixture で /api/metrics の Known を見る）。中核の account の project の doc は、state dir の引けた project の行の欄 ledger を、台帳の字が在れば中核の ledger の stats の値、無ければ Unknown にする（state dir の引けない project の行は Unknown）。
      形（契約の型）。契約の型の crate の src/ledger.rs の LEDGER_CHANGED_EVENT の近くに 3 つの定数を足す。pub const READ_AGE_HEADER は &str で字 X-Tz-Read-Age、pub const READ_HOLD_S は u64 で 60、pub const READ_WARN_S は u64 で 15。doc の注に、値は規則の行 R-21 に足した値で、server が READ_HOLD_S と READ_AGE_HEADER を使い、面の後の行 g-fresh が READ_WARN_S と READ_HOLD_S と READ_AGE_HEADER を使うと書く。電文の型は足さず、contract_form の snapshot は変わらない（定数は snapshot に載らない）。
      形（server の Source）。server の ledger.rs に pub const READ_HOLD（Duration・契約の READ_HOLD_S 秒）を足す。Source に私的な欄を 2 つ足す。1 つは最後に読めた字と読んだ時刻を Arc と Mutex で包んだ値（一度も読めていなければ字は None で、時刻は Source::new を呼んだ時刻・clone は同じ値を分け合う）、もう 1 つは持ち回しの上限の Duration（new では READ_HOLD）。PartialEq と Eq は今のまま repo と bd だけを比べる。pub fn with_hold（self と Duration を受け、上限を替えた Source を返す・歯が短い上限で試す）と pub fn hold（上限を返す）を足す。読めたかどうかの決まりは、合流の読みを始めた呼びが text_alone を撃ち、字が Some で parse_bd の値が Known のときだけ読めたとし、その字と Instant::now() を最後に読めた字と時刻に置く（JSON として読めない rc 0 の出力も落ちた読み）。合流して待った呼びは、始めた呼びと同じ結果を受ける。pub struct Got（pub な欄 text の String の Option と stale の Instant の Option・derive は Debug と Clone と PartialEq と Eq）と pub fn got を足す。got は合流の読みを撃ち、読めれば text に読めた字・stale に None、落ちれば stale に最後に読めた時刻（一度も読めていなければ new の時刻）と、text にその時刻から今までが上限より短い間だけ最後に読めた字（越えたか一度も読めていなければ None）を返す。pub fn text は got の text を返す（今までの呼び手の gather と questions.rs と cli の graph は、落ちても持ち回しの字を受ける）。pub fn read は持ち回さない読みにする。合流の読みを撃ち、読めた字を parse_bd に渡した値、落ちれば Unknown を返す（読めた字は同じく最後に読めた字に置く）。read を撃つのは変化の見張り（Hub の start の閉包）だけで、見張りは読めたから落ちたへ、落ちたから読めたへ変わるたびに今と同じく ledger-changed を送る。面はその知らせで読み直して頭の秒を受け、読みが戻ったことも知らせで知る（持ち回しの間に見張りの値が変わらず知らせが止まる形にしない）。text_alone は今のまま持ち回さず、最後に読めた字も置かない（裁定と束と方針の受付の読み直しは、落ちれば今どおり 503）。list と item は got の text を parse_bd で読む形にする（引数の形は問わない・口の file が got を渡す）。module の doc と Source の doc に、持ち回しと上限と見張りの読みの違いを書き足す。
      形（口）。server の mod.rs に私的な fn aged（Response と Instant の Option を受け Response を返す）を足す。Some なら頭 READ_AGE_HEADER に、その Instant から今までの秒（Duration の as_secs の整数の 10 進の字）を header で足し、None なら受けた Response をそのまま返す。board の Texts の欄と derive は変えない（着地済みの歯 kcli が struct の字で組む）。board の Sources に pub fn（名は問わない・例 gather_held）を足し、gather と同じ引数（&self と design と events の bool）を受け、Texts と Instant の Option の組を返す（Texts の ledger は self.ledger.got() の text〔None なら空の字〕・Instant は同じ got の stale・ほかの欄は今の gather と同じ集め方）。gather は引数と返りを変えず、その組の Texts を返す（cli の graph が使う）。台帳を読む 10 の口の file は、応答を aged に通す。今 gather を使う 7 つ（metrics・pipeline・next・graph・graphview・around・unreflected）は足した fn の組の Instant を渡し、ledger.rs と item.rs と questions.rs は sources の ledger の got の stale を渡す（item.rs の 404 と 503 の応答も通す・around.rs は gather の後の 200 と 404 no-node を通し、query の 400 は台帳を読む前なので通さない）。口の body の電文の字は今と同じ関数で作る（読めた字が持ち回しの字に替わるだけ）。project.rs・seat.rs・runs.rs と POST の口は台帳の字を読まないので頭を付けない。mod.rs の module の doc の、同じ時に届いた要求は台帳の読みを分け合い読み終えた字は次の要求に持ち回さないと書く文を、読めた字は次の読みが落ちたときだけ READ_HOLD（60 秒）まで返し、その応答の頭に最後に読めた時からの秒を付けると書き直す。mod.rs の字（doc の注を含む file の全部の字）に、引用符で囲んだ /api/ の字（今の /api/surface/events の 1 つのほか）・fn route(・fn around(・fn account(・fn post_ で始まる字・HEARTBEAT_PATH を足さない（着地済みの歯 hbroute_mod_rs_keeps_only_events と hbpost_mod_rs_drops_post_fns が file の全部の字で見る）。
      形（account board）。Acct に私的な欄（名は問わない）として、anchor の字ごとの Source を Mutex で包んだ BTreeMap を足す（new では空）。gather の 2 段目は anchor ごとに、表に在ればその Source の clone を、無ければ Source::new(anchor, bd) を表に置いてその clone を取り、got を撃つ（同じ anchor の Source を持ち続けるので、最後に読めた字が次の gather に残る）。ProjectTexts の ledger には got の text を置く。私的な Texts に Instant の Option の欄（名は問わない）を足し、落ちた project の got の stale のうち最も古い値を置く（どれも読めれば None）。pub fn doc_read（&self と EpochSecs を受け、AccountDoc と Instant の Option の組を返す）を足し、今の doc の組み立て（中核の project の doc と board の port の置き）で作った電文と Texts の値を返す。pub fn doc は doc_read の電文を返す（引数と返りは変えない・着地済みの歯と bport と athr の歯が直に呼ぶ）。marks と state_dir と board と scribe2 と host_state_dir と cwd は変えない。routes の account.rs は Shared の acct が在れば doc_read の組を、無ければ今の Unknown の電文と None を aged に通す。撃つ子 process の数と argv と cwd は変えない（project ごとの bd は gather ごとに 1 回・seat の HOLD の 5 秒の持ち回しの中は撃たない）。
      着地済みの歯（直すもの）。tests/server_min.rs の server_min_ledger_unreadable_is_unknown は、落ちる偽の bd で起こし、空の配列の字を返させて Known の空を見た後に、壊れた台帳の 5 つの字（切れた配列・更新時刻の形の悪い bead・id の形の悪い bead・配列でない字・空の字）のそれぞれで Unknown と /api/ledger/fx-min の 503 を見て、最後に印の file に fixture を書いて Unknown を見る。この行の後は、空の配列の読みが読めた字になり、続く壊れた字の読みは持ち回しの空の一覧（Known の空）を返すので、そのままでは落ちる。空の配列の確かめ（bd_returns に空の配列の字を渡す文と Known の空を見る文とその注の行）を歯の最後へ移す。壊れた字の確かめと印の file の確かめは一度も読めていない server で撃たれ、今と同じ Unknown と 503 になる。見張りの読みも、この間は一度も読めない（偽の bd は最初は字が無く rc 1、後は壊れた字）。tests/server_ask.rs の server_ask_questions_route_matches_core は、読める偽の bd の問いの一覧を中核の値と比べた後、bd_fails（出力の file を消す・cat が rc 1）の後の問いの一覧が 200 で Unknown であることを見る。この行の後は持ち回しの一覧を返すので、落ちた後の確かめを、200 で本文の一覧が落とす前と同じ（中核の question の list に read_fixture の字を渡した値）で、応答の頭の字（Reply の head）に名の大小を問わず x-tz-read-age が在ることに替え、続けて別の名の Place を作り、serve の前に bd_fails を撃った server の問いの一覧が 200 で Unknown であることを見る。どちらの file も fn config を変えない（着地済みの歯 hbconf_teeth_fill_the_rest_with_new が 9 つの歯の file の fn config の字を読み、この 2 つもその中に在る・hbconf.rs は置き場だけの = で verify で撃つ）。
      着地済みの歯（直さずに通るもの・3 つの crate の tests と src の cfg(test) を grep で確かめた）。server_coalesce_ の 7 本は、同時の 7 つの口が bd を 1 回か 2 回撃つこと（seven_routes_share_one_bd・読めた字の読みで持ち回しは効かない）、読めた後に出力を替えると次の要求が新しい読みを始めること（no_carry_over・持ち回しは落ちたときだけ）、起こす前から落ちる偽の bd で一覧が Unknown と /api/ledger/fx-hub.3 が 503 で、戻すと新しい読みで 8 行を読むこと（shared_failure_then_new_read・一度も読めていないので持ち回す字が無い）、裁定の受付が走っている読みを分け合わないこと（ruling_reads_alone・text_alone は変えない）を見る。server_src_ の 7 本（tests/server_src.rs）は、起こす前から落ちる偽の bd（rc 1・JSON でない字・起動できない program・30 秒眠る）で一覧が Unknown と 503 になること（一度も読めていない）と、読める偽の bd の出力の替わりが印の 1.5 秒の内と 5 秒ごとの読み直しで一覧に出ること（読めた字は持ち回さない）を見る。server_acct_ の 11 本は、歯ごとに新しい Acct で、起こす前から落ちる出力の部分だけが Unknown になること、5 秒の持ち回しの中の呼びの回数と argv、state dir と repo の byte を見る（新しい Acct は一度も読めていないので持ち回す字が無く、呼びの回数と argv は変えない）。server_ask_refusals_write_nothing は読めた後の bd_fails で POST /api/ruling が 503 になることを見て、受付の text_alone は持ち回さないので通る。src の中の server_src_unstartable_bd_is_unknown は一度も読めていない Source の read が Unknown であることを見る。server_min_parse_refuses_broken_lines と server_min_epoch_secs_reads_rfc3339 は parse_bd と parse と epoch_secs を直に撃ち、この行はその 3 つを変えない。hbproc_definitions_move_out_of_ledger は ledger.rs に字 fn capture<・fn stop(・fn stop_with(・const KILL:・const WAIT_STEP:・fn epoch_secs(・fn is_leap(・fn days_in_month(・fn days_from_civil( が無いことを見る（この行はどれも書かない・名 stop の fn を足さない）。hbroute_ の歯は routes の dir の file の名の列と鍵と build.rs と mod.rs の字を見る（file を足さず、mod.rs に上の字を書かない）。brand_path_written_once_in_contract は 3 つの crate の src の引用符で囲んだ /api/project の字を数える（この行は書かない）。kcli_ の歯（tests/kcli.rs）は board の Texts を 4 つの欄の struct の字で組み、tz graph の口を撃つ（この行は Texts の欄と Sources の gather の引数と返りを変えないので組めて通る）。server_seat・server_view・server_read・server_batch・server_acctwire・fserve・fstop・nsumw の歯は読める偽の bd か、起こす前から落ちる偽の bd か、text_alone の読みを使い、頭の行の足しは本文の字と状態の数を変えない。
      測り方。新しい歯は境界の crate の tests/rhold.rs に置き、名を rhold_ で始める。作業場は CARGO_TARGET_TMPDIR の下に歯ごとに作る。偽の bd は作業場の sh の script で、落とす印の file が在れば何も出さずに rc 1、無ければ置いた字の file を cat する（眠らない）。読める字は tests/fixtures/ledger/bd-list-8.json（bead 8 本・fx-hub と fx-hub.1〜fx-hub.7・fx-hub.3 は問い）。rc 0 の壊れた字は printf で not json を出す形に替えて撃つ。rc 0 の読めない字も落ちた読みで、上限の内は前に読めた字を返し、一度も読めていないときと上限を越えた後は text に None を返す（読めない字そのものを text に返さない・rhold_never_read_has_no_text と rhold_unparsed_is_a_failure が見る）。rhold_unparsed_is_a_failure も with_hold に 4 秒を渡し、6 秒の後の確かめは上限を 2 秒越えた後。rhold_source_holds_then_gives_up は Source::new に作業場の repo と偽の bd を渡し with_hold に 4 秒を渡す。印を置いた直後の確かめは最後に読めた時から 1 秒より短い後で、上限の 4 秒まで 2 秒以上の余りが在り、6 秒の後の確かめは上限を 2 秒越えた後（順を見る 2 つの出来事の間に 2 秒以上の余りを置く）。rhold_routes_hold_and_mark は server の Config を Config::new と ..Config::new の更新の形で組み（bd に偽の bd・folio と scribe2 に作業場の中の無い path・state dir は None）、Server::bind と local_addr と run で起こし、TcpStream で GET を撃って状態の数と頭の行と本文を読む。server は起こす時に見張りの最初の読みを戻る前に撃つので、最初の口の読みの前に最後に読めた字が在る。見張りの次の読み（起こしてから約 5 秒の後）が落とした間に来ても、見張りの読みも落ちて最後に読めた字は替わらず、口はその字を返すので、歯は落とした間の確かめの時を測らない。偽の bd を戻した後は頭の無い 200 を 5 秒まで短く眠って待つ（見張りの読みの途中に撃った口がその落ちた結果を分け合う場合を拾う）。頭の値の上限 59 は持ち回しの上限の 60 秒より短い（落とした間の確かめは数秒で済むので値は 0 か数秒）。/api/project は台帳を読まない口の見本として、落とした間に 200 で頭の無いことを見る。rhold_acct_ledger_held は作業場に work の下の proj-x の dir（anchor）と、引数の state dir の下の host.toml（表の頭の字 [[account-group]] の群 1 つ・鍵 name は字 g-x・鍵 anchors は anchor の path 1 つの配列・中核の account の host の declaration が読む形）と、偽の git（引数の 5 番目の字が scribe2.statedir なら作業場の下の state-x の path を出し、ほかは rc 1）と、偽の器（rc 1）と、偽の bd を置き、Acct::new に器・git・bd の program と引数の state dir と作業場の repo を渡す。seat の HOLD と Acct と doc と doc_read は pub で歯が直に使う。電文は 2 回とも同じ時刻を渡すので、持ち回しの字が同じなら電文も同じ字になる（state-x の dir は無く、event log と席の file は読めない扱いで 2 回とも同じ）。rhold_wiring_text は境界の crate の置き場（CARGO_MANIFEST_DIR）から 11 の口の file と mod.rs と events.rs の字を読む。rhold_values_and_header_name は契約の型の 3 つの定数と READ_HOLD と hold の値を見る。rhold_own_names_clean は着地済みの歯 brand_own_names_clean と同じ形で、前後の空白を除くと test の属性だけになる行の次の行の fn の名を集め（8 つ）、どれも rhold_ で始まり、残りの字が下の filter の語を含まないことを見る。
      filter の語（着地済みの行と第 3 波から第 9 波の行の verify の語・この行の接頭辞 rhold_ は並べない・110 語）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・qgate_・nsum_・hcard_・ntime_・ptitle_・ncard_・hsym_・smore_・lcard_・aaround_・hruling_・sxaxis_・plimit_・bport_・fstop_・nsumw_・fmark_・fserve_・cadopt_・tipx_・hcsess_・hcproj_・sesplit_・mstore_・athr_・qblock_・wsteady_・gsum_・nstall_・pfold_・uword_・cround_・cgdom_・csled_・lhome_・shb_・ghb_・nact_・aord_・mtree_・qkey_・wstrip_・flight_ で、新しい歯の名から先頭の rhold_ を除いた字は、このどれも部分の字として含まない（例 rhold_account_x・rhold_server_x・rhold_graph_x・rhold_project_x は不可）。名は done に書いた rhold_values_and_header_name・rhold_source_holds_then_gives_up・rhold_never_read_has_no_text・rhold_unparsed_is_a_failure・rhold_routes_hold_and_mark・rhold_acct_ledger_held・rhold_wiring_text・rhold_own_names_clean（どの語も含まない）。
      依存と順。depends は空。src/server/mod.rs は第 8 波の行 e-seat-hb（main のノート surface-wave8b）も module の doc の字だけを書くので、この行は e-seat-hb の着地の後に流す（便の bead の依存で持つ・depends は同じノートの行しか引けない・計画の 5 節）。この行の mod.rs の直しは持ち回さないと書く文の書き直しと fn aged の足しで、e-seat-hb の直す POST の口の列の文（/api/seat/heartbeat を足し POST の口を 5 にする）と重ならない。e-seat-hb の新しい routes/seathb.rs は Shared の sources の ledger の欄 repo と Acct の pub fn（new・host_state_dir・state_dir・scribe2・cwd）を使い、この行はそのどれも変えない。e-seat-hb の歯 shb_ が字を読むのは src の下の引用符で囲んだ /api/seat/heartbeat の数で、この行はその字を書かない。src/server/events.rs は第 7 波の行 e-watch-steady が 418b673 で書いた（見張りの周の印の取り方と歯・Hub の start は変えていない）ので、この行は置き場だけの = で持ち、中身を書かない。src/acct.rs を書いた第 7 波の行 c-acct-thr は着地済み。同じ波の行 g-keyed は面の crate だけを書き、この行と file が重ならない。後の行 e-snap（GET の口が見張りの読んだ字を返す）と a-lean（account board の台帳を印の動いたときだけ読む）はこの行の最後に読めた字と project ごとの Source の上に置く。外の依存は足さず Cargo.toml は触らない（std だけを使う）。
  - n: 4
    type: prose
    title: 行 g-keyed — 問いの頁の card と束の行を鍵つきの一覧にし、読み直しで欄の DOM を作り直さない
    body: |
      なぜ。持ち主は project board の質問の頁で、答えを書いている最中に画面が一瞬全部消えると指摘し、「リロードは必要だとは思うが画面表示への反映の仕方を工夫しろ」と求めた（記帳は t3-hub.1（裁定 id = user 2026-09-28T01:06Z）・project board が重いという指摘は t3-hub.1（裁定 id = user 2026-09-28T00:4xZ））。重さの調べ（2026-09-28・席の作業場の pb-perf/report.md）で、どの block も一覧の読みの値が変わるたびに中身を丸ごと作り直す（閉包の中で fetched の with に body を渡し、Filled の列を collect_view で組む・面のどこにも鍵つきの一覧が無い）と確かめた。答えを送った後（reload_all）と台帳の変化の知らせのたびに問いの一覧の本文が変わり、答えを待つ質問の block は全部の card の article と答えの欄の textarea を作り直す。書きかけの字は block が問いの id ごとに持つ Draft の signal に残るが、欄の focus と caret と変換の途中の字は消え、開いたつながりの段の図も組み直される。まとめて承認の block は、束の逐語の textarea と送る button を一覧の読みのたびに作り直す。読めない読みの消えは行 e-hold が直し、この行は読めた一覧の出し方を直す。問い t3-hub.52.38 の技術に、あわせて問いの一覧をその場で更新する形（行 g-keyed）にし書きかけの答えと scroll を守る（これは問わずに入れる）と書いて持ち主の裁定（裁定 id = t3-hub.52.38:20260928T0154Z-1）を受けたので、問いを置かない。要件 FR6（問いの card の順と答えの欄）と NFR2（面は最終更新を出し、読み直しで中身を置く）に拠る。全体への指示の block（policy.rs）は、範囲の切り替えと問いの選びが問いの一覧に依るので同じく作り直されるが、その 2 つを外す後の行 g-policy-all が form を一覧に依らずに 1 度だけ組む（計画の 4 節の書き足し）ので、この行は policy.rs を書かない。これまでの決定の block（askpage.rs）は入力の欄を持たず、畳みの開き閉じは記録から戻り、同じ字の置き直しで頁の scroll は動かないので入れない。
      在りか（main 578f948 で確かめ、398516a で読み直した・ask.rs と batch.rs と kit.rs と view.rs と net.rs は 578f948 から同じ・nodearound.rs は第 8 波の g-card-around〔969c13c で着地〕が近傍の図の節点と一覧の題に hover の card を足したが Embeds と embeds と Embeds の view と open は同じ・第 7 波の c-q-blocking が ask.rs に止めている task の chip を、g-tip-expert が batch.rs に重なりの注釈を足した後の字）。面の crate の src/project/ask.rs（block の dir・host でも組む）。pub struct SumLine（欄 class・key・text・eng・derive は Debug と Clone と PartialEq と Eq）と pub struct Card（欄 number の usize・id の BeadId・title・a1・posted_at の EpochSecs・summary の SumLine の Vec・reason・recommend・touches・blocking・digest・derive は同じ 4 つ）。pub fn cards（Fetched の参照を受け、Result の契約の QuestionCard の Vec と理由の字・NotRead は Err の kit の NOT_READ・Failed は Err の REASON・本文が QuestionList として読めなければ Err の UNREADABLE・cards が Unknown なら Err の CARDS_UNKNOWN・Known なら Ok の列）・pub fn count・pub fn body（Fetched の参照を受け kit の Body の Card の Vec・cards の Err の理由は Unmeasured・0 本は Empty の EMPTY・ほかは電文の順に番号を 1 から付けた Filled）・pub fn card・pub fn summary・pub fn age（今と posted_at を受け経過の字）・pub fn anchor（番号を受け字 q と 0 から数えた位置の String）・pub fn card_class（名指しか否かを受け字 qcard か qcard target）・pub fn target_number（Card の slice と id の &str を受け番号の Option）・pub fn focus と pub const PATH（字 /api/questions）ほかが mod dom { より前に在る。kit（src/kit.rs・write-set には置き場だけの =）の pub enum Body（Unmeasured と Empty の &'static str と Filled・derive は Debug と Clone と PartialEq と Eq）と pub const NOT_READ（まだ読んでいない理由の字）は crate::project の path で使え、wasm の target のときだけの pub fn body_view は Body の unit を、unmeasured は理由の字を受ける。view（src/view.rs・write-set には置き場だけの =）の Fetched（NotRead と Body の String と Failed・derive は同じ 4 つ）と、net の pub fn read（&'static str を受け leptos の ReadSignal の Fetched）は wasm の target のときだけの net に在り、同じ path の読みを頁に 1 つの signal で分け、読みの本文が前と同じなら置かない（view の settle が Keep を返す）。mod dom（wasm の target のときだけ）の pub fn view は、URL の名指しの id と mode の context と、net の read(PATH) の読みと、問いの id ごとの Draft（答えの字・送っている間・送った後の 1 行の ArcRwSignal）を持つ StoredValue と、つながりの段の図の読みを持つ nodearound の Embeds（字 let places = embeds(); で作る・Copy・pub fn view と open）を組み、字 let list = move || の閉包が fetched の with に body を渡した値で分けて、Filled なら名指しの card を 1 度だけ画面の上端へ寄せ（target_number と私的な fn scroll_to が anchor の id の要素を get_element_by_id で探して scroll_into_view_with_bool(true) を呼ぶ）、今の時刻（crate::net::now）と mode の値を取り、card ごとに card_view（Card と Draft と今の u64 と名指しか否かと Mode と Embeds を受ける）を collect_view で並べる。card_view は article（class は card_class・id は anchor(card.number)・data-q は id の字）の中に配置の表 LAYOUT の順に私的な fn part_view（Slot と Card の参照と Draft の参照と今の u64 と Mode と Embeds を受ける）を並べ、Part::Head の枝は字 {card.number} の番号・node_href(card.id.as_str(), mode) を href に持つ字 <a class=「t」の link・age(now, card.posted_at) の経過の chip を出す。Part::Around の枝は fold(format!(「ask:around:{}」, card.id)) の記録と details と places.view の図と touches と blocking の chip を出し、answer_view は Draft の outcome の signal で欄の開き閉じを決める閉包の中で textarea と送る button を組む（字を打つだけでは閉包は走らない）。src/project/batch.rs（block の dir・host でも組む）は pub struct Row（欄 number・id・title・a1・touches・digest・derive は Debug と Clone と PartialEq と Eq）・pub fn rows（QuestionCard の slice を受け番号を 1 から付けた Row の Vec）・pub fn body（Fetched の参照を受け Body の Row の Vec・読めない理由は ask の cards と同じ・0 本は ask の EMPTY）・selected・counts・can_send・request_body ほかを mod dom { より前に持つ。mod dom の view は crate::net::read(ask::PATH) の読みと Copy の State（外した id の集合・欄の字・送っている間・送った後の 1 行の RwSignal）を組み、fetched の with に body を渡した値で分けて、Filled なら私的な fn filled（Row の Vec と State を受ける）を撃つ。filled は ul class items の中に行ごとの私的な fn row_view（Row の参照と State を受け、選ぶ box か A-1 の印と字 {r.number} の番号と題を出す）を collect_view で並べ、行を StoredValue に入れ、touches と重なりの chip と textarea と送る button を組み、私的な fn submit（StoredValue の Row の Vec と State）に渡す。どちらの file も今は Hash を derive していない。
      形（host の部分）。ask.rs の SumLine と Card の derive に Hash を足す（欄の型は String・&'static str・bool・usize・u64・BeadId〔Hash を derive 済み〕とその Vec と Option で、どれも Hash を持つ）。pub fn card_key（Card の参照を受け、欄 number を 0 にしてほかの欄を写した Card を返す）・pub fn outline（Fetched の参照を受け、body の値の Filled を Filled の unit に替えた Body の unit を返す）・pub fn listed（Fetched の参照を受け、body が Filled なら中の列、ほかは空の列を返す）を mod dom { より前に足す。batch.rs の Row の derive に Hash を足し、pub fn row_key（number を 0 にした Row）・pub fn outline・pub fn listed（Row の Vec）・pub fn number_of（Row の slice と BeadId の参照を受け、id の同じ行の number を返す）を mod dom { より前に足す。鍵は番号を除いた中身なので、前の card が答えられて番号が詰まっても残る card の鍵は変わらず、題・概要・理由・推奨・touches・blocking・digest・A-1 の印のどれかが替われば、その card だけ鍵が変わって作り直される（中身の変わった card の DOM は作り直してよい・書きかけの字は Draft に残る）。ask の cards・count・body・card・summary・age・target_number・anchor・card_class と batch の rows・body・selected・counts・can_send・request_body・outcome の名と引数と返りと値は変えない（第 8 波の行 g-next-rows が ask の PATH と cards と age を使い、着地済みの歯 askcard_・batchpanel_ が直に撃つ）。
      形（DOM・mod dom の中・字は次のとおりに決め、歯 qkey_dom_text がこの字で見る）。ask.rs の view は、字 let places = embeds(); を字 let list = move || より前に残し、fetched の with に outline を渡す Memo と listed を渡す Memo を作る（Memo は値が前と同じなら知らせないので、本文が替わっても形が同じなら外枠を組み直さない）。list の閉包は形の Memo で分け、Unmeasured は今の unmeasured、Empty は今の body_view、Filled は <For の鍵つきの一覧（each は card の列の Memo の値・key は card_key・子は card を受けて card_view を組む）を返し、字 collect_view() を list の閉包の中に書かない。名指しの card を 1 度だけ寄せる確かめは card の列の Memo を読む Effect（か同じく列の Memo を読む閉包）に移し、target_number と scroll_to と anchor を今のとおり使う。子は card の id から、列の Memo の中の番号を target_number で読む閉包（無ければ 0）を作り、番号の span と article の id（anchor に渡す）はその閉包から読む（送る要求の本文 request_body は id と digest と逐語だけを使い、番号を使わない）。経過の chip は fetched を読む閉包の中で crate::net::now と age を呼び（今と同じく一覧の読みのたびに書き直す・1 秒の時計は後の行 g-tick-adopt）、Head の a の href は字 href=move || で mode の閉包の値を node_href に渡す（mode を替えれば link が替わる）。card_view と part_view の引数は、今の u64 の代わりに閉包を受ける形にし、mod dom の中に字 now とコロンの並び（引数 now の宣言）と .number を書かない（子を組んだ時の値で番号と経過と link を止めない）。Part::Around の枝の字と answer_view と submit と Draft と drafts の持ち方は変えない（同じ id の Draft を使い回し、鍵の変わった card を作り直しても書きかけの字は残る）。batch.rs の view は、fetched の with に batch の outline と listed を渡す Memo を作り、content の閉包は形の Memo で分け、Filled なら filled に行の列の Memo と State を渡す（字 unmeasured(reason) と crate::net::read(ask::PATH) は残す）。filled の引数は行の列の Vec でなく行の列の Memo にする（型の字 Memo<Vec<Row>> は可・fn filled( から fn row_view( までに、コロンと空白に続く字 Vec<Row> を書かない＝型が Vec<Row> の引数や束縛を置かない）。batch.rs の ask の use の行の字 use crate::project::ask::{self, KeyAction, key_action}; は変えない（着地済みの歯 batchpanel_key_action がこの字のまま見る・足す名 card_key ほかは要らず、batch の row_key と outline と listed と number_of は super の use に足す）。ul class items の中を <For の鍵つきの一覧（each は行の列の Memo の値・key は row_key・子は行を受けて row_view）にし、touches と重なりの chip（字 use:expert_tip=OVERLAP_TIP.to_string()><span inner_html=WARN></span> は今のまま）と textarea と button は filled の中で 1 度だけ組む（形が Filled のまま替わらなければ作り直さない）。chosen と n と submit は行の列の Memo を読む（submit は with_untracked で読む・StoredValue をやめる）。row_view は行の番号を number_of で列の Memo から読む閉包にし、番号の span と選ぶ box の aria-label にその値を出し、mod dom の中に字 .number を書かない。新しい class と語の鍵と引用符で囲んだ /api/ の字と fold の記録の呼びと details の tag は足さない（使う class の qcard・target・nb・t・chip・num・items・metas・row は stylesheet に在る）。leptos 0.8 の For は leptos::prelude に在り、鍵の fn は T の参照を受け Eq と Hash を持つ値を返せばよい（card_key と row_key はそのまま渡せる）。
      着地済みの歯（直さずに通るもの・面の crate の tests の全部を grep で確かめた）。aaround_src_ask_fold_embeds は ask.rs の字 pub fn view() -> AnyView { から字 let list = move || までに embeds() が在ることと、字 Part::Around => から字 fn answer_view( までの枝の字（fold の鍵の format!・has_attribute(・.open(・details・class nb-body・.view( が </details> より前・details は 1 つ・class nid と ul class items が無い）と、ask.rs に mapview::around と read_path( が無いことを見る（この行は places の作りを list より前に残し、Around の枝を書かない）。afocus_src_links_and_scroll は ask.rs の mod dom { より後に anchor(・card_class(・node_href(・focus(・target_number(・get_element_by_id(・scroll_into_view_with_bool(true)・<a class と引用符で囲んだ t が在り、題の span が無いことを見る（この行はどれも残す）。qblock_chip_after_touches は Around の枝の空白を除いた字に blocking の chip の並び（{card.blocking.len()} を含む）が touches の chip の後で </summary> の前に在り、ask.rs に data-term の blocking が 1 度だけ在ることを見る。qblock_vocab_and_icon は ask.rs の const STOP の字が見本と同じことを見る（どちらも変えない）。askcard_no_offscreen_storage_names（tests/askcard.rs・write-set には置き場だけの =）と batchpanel_no_offscreen_storage_names は ask.rs と askpage.rs、batch.rs と policy.rs の字に画面の外の保存の口の名（localStorage・sessionStorage・cookie・大小を問わない）が無いことを見る（この行は注にも書かない）。batchpanel_key_action は batch.rs と policy.rs に、ask の KeyAction と key_action の use の行の字 use crate::project::ask::{self, KeyAction, key_action}; と字 key_action(composing, と変換の途中の判定の字 ev.is_composing() || ev.key_code() == 229 が在り、字 fn key_action が無いことを見る（この行は use の行を変えない）。batchpanel_paths は batch.rs に引用符で囲んだ /api/batch が 1 度だけ在り、crate::net::read(ask::PATH) と crate::net::post(PATH, body) が在ることを見る。batchpanel_unmeasured は batch と policy の body の値と、2 つの file を合わせた字に unmeasured(reason) が在ることを見る。tipx_dom_text は batch.rs の mod dom より後に重なりの chip の字が在ることを見る。steady_details_use_fold_record は block の file の details の tag と fold の記録の呼びの数と鍵が FOLDS と同じことを見る（ask.rs は 1 つの ask:around:{}・batch.rs は 0・この行は注にも fold の呼びと details の字を足さない）。hsderive_consts_match_note と parts_paths_distinct_in_block_modules は PATHS と FOLDS の定数と引用符で囲んだ /api/ の字を見る（変えない）。askcard_ と batchpanel_ の host の歯は body と card と rows ほかの値を見る（値を変えない・Row を struct の字で組む歯は derive の足しで壊れない）。frame_classes_are_in_stylesheet と frame_no_heading_words_in_code は class と見出しの語を見る（足さない）。第 8 波の行 g-next-rows の歯 nact_ は ask の PATH と cards と age と batch.rs の read の字を使う（この行は変えないので、2 つの行の順は問わない）。
      測り方。新しい歯は面の crate の tests/qkey.rs に置き、名を qkey_ で始める。fixture は CARGO_MANIFEST_DIR から ../../tests/fixtures/surface/question-list.json として読む（電文の QuestionList・cards は Known で 2 つ・qa.2 は題「質問の頁の答えの欄は 1 問に 1 つでよいか」・a1 は真・touches は qa.1 と ADR-7 と R-20・digest は 0123456789abcdef・qa.10 は a1 が偽・touches は空・digest は fedcba9876543210・blocking はどちらも無く空の列）。歯の中の一覧の替えは、fixture の字を wire の decode で QuestionList に読み、cards の Known の列から qa.2 を除くか、qa.10 の digest を別の字に替えるか、qa.10 の題を 36 字以下の別の字（例 字「別の題」）に替えて wire の encode で本文に戻す（struct の字で QuestionCard を組まない・qa.10 の題は 39 字で、card の題は 36 字を越える行を 35 字と「…」に切るので、36 字目より後だけを替えた題では card の題が変わらない）。cards が Unknown の電文は QuestionList の cards に Reading の Unknown を置いた値の encode、空の電文は Known の空の列の encode。Hash を持つことは、歯の中の型の境界（Hash と Eq）を持つ私的な fn に card_key と row_key の値を渡して組めることで見る。qkey_dom_text は CARGO_MANIFEST_DIR から src/project/ask.rs と batch.rs の字を読み、done (4) の範囲の字を見る。qkey_own_names_clean は着地済みの歯 tipx_names_stay_apart と同じ形で、test の属性の行の次の行の fn の名を集め（5 つ）、どれも qkey_ で始まり、残りの字が下の filter の語を含まないことを見る。DOM の振る舞い（鍵の同じ card の要素が読み直しで同じ要素のまま残り、欄の focus が残ること）は host の歯で撃てないので、鍵の値と字の並びで見て、DOM は xtask の surface-build で組めることで見る（見本 mock v3 と同じ振る舞いは、着地の後に席が実物の画面で答えの欄に字を打ちながら別の問いを答えて確かめる）。
      filter の語（着地済みの行と第 3 波から第 9 波の行の verify の語・この行の接頭辞 qkey_ は並べない・110 語）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・qgate_・nsum_・hcard_・ntime_・ptitle_・ncard_・hsym_・smore_・lcard_・aaround_・hruling_・sxaxis_・plimit_・bport_・fstop_・nsumw_・fmark_・fserve_・cadopt_・tipx_・hcsess_・hcproj_・sesplit_・mstore_・athr_・qblock_・wsteady_・gsum_・nstall_・pfold_・uword_・cround_・cgdom_・csled_・lhome_・shb_・ghb_・nact_・aord_・mtree_・rhold_・wstrip_・flight_ で、新しい歯の名から先頭の qkey_ を除いた字は、このどれも部分の字として含まない（例 qkey_question_x・qkey_batchpanel_x・qkey_pipe_x・qkey_steady_x は不可）。名は done に書いた qkey_card_key_rules・qkey_outline_and_listed・qkey_batch_keys_and_numbers・qkey_dom_text・qkey_own_names_clean（どの語も含まない）。
      依存と順。depends は空（ask.rs を書いた第 7 波の c-q-blocking と、batch.rs を書いた第 7 波の g-tip-expert は着地済み・main 578f948 で確かめた）。第 8 波の行（main のノート surface-wave8a と surface-wave8b の 12 行）で ask.rs と batch.rs を書く行は無い（g-next-rows は ask.rs を置き場だけの = で持ち、中身を書かない）。第 8 波の g-card-around は 969c13c で着地し、nodearound.rs の Embeds と embeds と Embeds の view と open と再出しの行を変えていない（398516a で確かめた）。Embeds の view が組む近傍の図は hover の層の委ね（context の HoverCtx・src/board.rs が頁に 1 つ置く）を引き、For の子の owner は For を組んだ block の owner の下に作られるので、子の中の図にも context は届く。同じ波の行 e-hold は境界の crate と契約の型の crate だけを書き、この行と file が重ならない。後の行 g-jst・g-card-adopt-b・g-tick-adopt・f-undelivered が ask.rs を、この行の後に書く（計画の 5 節）。nodearound.rs は置き場だけの = で、Embeds の形（Copy・view と open）を使うだけで書かない。外の依存は足さず、Cargo.toml と vocab.json と style.css と fixture と policy.rs と askpage.rs は触らない。
  - n: 5
    type: prose
    title: 行 g-strip — release の profile の strip で面の wasm の関数の名の表を抜く
    body: |
      なぜ。持ち主は 2 つの board が重いと指摘した（project board は t3-hub.1（裁定 id = user 2026-09-28T00:4xZ）・account board は t3-hub.1（裁定 id = user 2026-09-28T00:59Z））。質問の頁の読み直しの消え（t3-hub.1（裁定 id = user 2026-09-28T01:06Z））も含めて、重さの調べ（2026-09-28・席の作業場の pb-perf/report.md）で配布の file を測った。頁を開くたびに配る面の wasm は 7,907,794 byte で、その 62%（4.88 MB）が関数の名の表（wasm の name の節）だった。名の表を抜いた写しは 3,018,891 byte になる。project board の nav は素の link で、押すたびに頁を丸ごと読み直して wasm を取り直し（静的な file に cache の頭も圧縮も無い）、名の表の分がそのたびに転送と compile に乗る。問い t3-hub.52.40（配布の file の圧縮のために外の部品を足してよいか）の概要に、名の表を抜く直し（行 g-strip）は問わずに入れると書いて持ち主の裁定（裁定 id = t3-hub.52.40:20260928T0156Z-1・できる限り軽く速くしたいので足してよい）を受けたので、問いを置かない。要件 NFR2（器の event と台帳の変化は 5 秒以内に面へ届く）に拠る（頁を開くたびに取り直す wasm の転送と compile は、開いた後の最初の読みが面に届くまでの時間に乗る）。依存は足さないので、規則の行 R-25（面の crate の直接依存 8 本以下）と R-2（core の依存の予算）の数は変わらない。
      在りか（main 4fdf420 で確かめ、78f4701 で読み直した・root の Cargo.toml と面の crate の Trunk.toml と index.html と xtask の src/main.rs はその間に変わっていない）。workspace の Cargo.toml（root・頭に注の行）は表を 3 つ持つ。workspace（resolver は 3・members は字 crates/tsuzuri-contract・crates/tsuzuri-core・crates/tsuzuri-boundary・crates/tsuzuri-surface・xtask の 5 つの配列）・workspace.package（version 0.1.0・edition 2024・publish は false）・workspace.dependencies（serde〔derive の feature〕と serde_json）。profile の表は無く、release の profile は cargo の既定のまま。面の crate の Trunk.toml は表 build に target（index.html）・dist（dist）・release（true）・public_url（/）を持ち、鍵 cargo_profile を持たない。面の crate の index.html の rust の link は data-trunk と、rel の値 rust と、data-bin の値 tsuzuri-surface と、data-wasm-opt の値 0 を持ち（注の字は、wasm-opt は外から取りに行くので使わない）、data-cargo-profile を持たない。xtask の src/main.rs の私的な fn surface_build は面の crate の dir で trunk を引数 build だけで撃ち（設定は Trunk.toml）、私的な fn dist_missing で dist に index.html と拡張子 wasm の file が在るかを見る。私的な fn check は cargo の build（workspace）・nextest（workspace）・clippy（workspace の all-targets）・面の crate の wasm32-unknown-unknown の clippy を順に撃ち、最後に surface_build を撃つ。この 4 つの cargo の段は release を付けない（dev の profile）ので、足す release の profile は host の build と歯と clippy には効かない。効くのは trunk の組み（Trunk.toml の release が true で data-cargo-profile が無いので、trunk は cargo の build に release を付ける）と、手で release を付けて組む tz（境界の crate の binary）だけ。席が今配っている tz は release を付けない dev の build（調べで確かめた）で、この行の効きの外にある。
      名の表について（調べの実測と toolchain の決まり）。調べの dist の wasm は release で組んでいるのに name の節が 4.88 MB 残っていた。release の profile は既定で debug の情報を持たないので、strip を debuginfo にしても name の節は残る（debuginfo が抜くのは debug の情報の節だけで、関数の名の表は記号の側）。strip を symbols にすると、rustc は wasm の linker に --strip-all を渡し、linker は name の節を書かない（toolchain の扱い・組んだ後の dist で席が確かめる）。wasm-bindgen が読む専用の custom の節と export は残る見込みで、組めることは xtask の surface-build で見る。linker の --strip-all は name の節と一緒に producers と target_features の節も書かない見込みで、wasm-bindgen は target_features の節から reference-types を読めないので、JS の glue は externref の表でなく JS の側の heap の表を使う形になる（働きは同じ）。事前の点検で、手元の release の組みの wasm からこの 3 つの節を抜いた写しを wasm-bindgen 0.2.129（Cargo.lock の wasm-bindgen と同じ版）に --target web で通すと組めて、出た wasm は 3,157,931 byte（name の節は wasm-bindgen の shim の名の 1,249 byte）で、wasm-opt の読みの検査も通った。trunk は wasm-opt を撃たない（data-wasm-opt が 0）ので、今の組みには名の表を抜く段が無い。wasm-bindgen は自分が作る shim の名を小さい name の節に書く見込みなので、抜いた後の大きさは調べの写しの 3,018,891 byte に近い見込み（歯では測らない・下の測り方）。
      panic の時に失うもの。面の crate には panic の hook が無い（board.rs と account の board.rs は leptos の mount の mount_to_body を呼ぶだけで、leptos 0.8.21 の mount も hook を置かない・grep で確かめた）。wasm32-unknown-unknown の panic は abort で、browser の console には RuntimeError の unreachable と JS の stack が出る。今はその stack の wasm の枠に name の節の Rust の関数名が出るが、この行の後は関数の番号と offset だけになる（panic の字は、この行の前も後も console に出ない）。手で release を付けて組む tz も記号の表を失い、RUST_BACKTRACE の backtrace の関数名が出なくなる（panic の 1 行目の file と行と列と panic の字は、記号の表でなく data に在るので残る）。面の panic を調べるときは、手元の写しで profile の表の strip の行を外して組み直す。
      形。workspace の Cargo.toml の末に、注の行（行 g-strip・release の profile の strip で面の wasm の関数の名の表を抜く・opt-level と lto は組みの時間を測ってから別に決める）と、表の見出し profile.release と、1 行（鍵 strip・値は引用符で囲んだ symbols）を足す。ほかの表と行は変えない。opt-level・lto・codegen-units・panic は足さない（組みの時間と xtask の check の時間が変わり、規則の行 R-2 の測りに効くので、測ってから別の行で決める）。strip の値は true でなく symbols と書く（効きは同じで、字で意図を示す）。面の crate と xtask の Cargo.toml・Trunk.toml・index.html・Cargo.lock は触らない（profile の足しは Cargo.lock を変えない）。
      着地済みの歯（直さずに通るもの・4 つの crate と xtask の tests と src の cfg(test) を grep で確かめた）。root の Cargo.toml を読む歯は xtask の src/main.rs の cfg(test) の中だけにある。私的な module read の pub(super) fn member_names は root の Cargo.toml を読み、pub(super) fn string_array で鍵 members の配列（等号の左が members で右が角括弧で始まる最初の行から、閉じの角括弧の在る行まで）の字を取り、各 member の dir の Cargo.toml の表 package の name を読む。歯 skeleton_workspace_has_five_members はその名が 5 つの member と同じことを見る。skeleton_direct_deps_match_list は root の members の配列が一覧の dir と同じことと、各 member の Cargo.toml の直接依存の名（pub(super) fn dependency_names が dependencies・dev-dependencies・build-dependencies とその target ごとの表だけを数える）が一覧と同じことを見る。足す表 profile.release は members の行でも依存の表でもなく、dependency_names は member の manifest にしか当てない。skeleton_lock_inside_is_members は Cargo.lock の source の無い package が 5 つの member だけであることを見る（profile は lock に載らない）。skeleton_boundary_std_only_and_bin_tz は境界の crate の Cargo.toml を、skeleton_surface_budget_matches_rule_r25 は rules の file の行 R-25 を、skeleton_common_verify_is_xtask_check は .vessel.toml を読み、skeleton_surface_direct_deps_within_budget と skeleton_rule_direct_max_reads_value と skeleton_dependency_names_reads_every_table は歯の中の定数と字を読む。どれもこの行で変わらない。各 crate の依存の数を見る歯（server_acct_no_new_dependencies・server_ask_no_new_dependencies・server_hb_no_new_dependencies・server_seat_no_new_dependencies・server_batch_fixture_shape_and_no_new_dependencies・境界の crate の acctwire_no_new_dependencies・acctdoc_no_new_dependencies・acctcore_pure_and_no_new_dependencies・stats_core_deps_are_the_three・面の crate の manifest を読む askcard_ ほかの歯）は、どれも CARGO_MANIFEST_DIR か隣の crate の dir の Cargo.toml（member の manifest）を読み、root の Cargo.toml を読まない。面の crate の歯 brand_title_joins_board_words は index.html の題の字を読む（変えない）。hsblock_measure_r2_lines は docs/measure の r2-surface-build.txt に記録した秒を読み、組みを撃たない。歯を組む cargo の段は dev の profile なので、どの歯の組みにも strip は効かない。
      測り方。新しい歯は面の crate の tests/wstrip.rs に置き、名を wstrip_ で始める。file は CARGO_MANIFEST_DIR から ../../Cargo.toml・Trunk.toml・index.html を字で読む（TOML の crate は使わず行で読む・dev の依存は足さない）。wstrip_release_profile_keys は root の Cargo.toml の行を trim し、角括弧で始まる行の最初の角括弧の中の字を表の見出しとして集め（今の file に二重の角括弧の表は無い）、見出しの集まりと、見出し profile.release の後から次の見出しの前までの鍵と、鍵 strip の値を見る（done (1) の読み方）。wstrip_trunk_release_build は Trunk.toml の表 build の鍵 release の値と、どの行の鍵も cargo_profile でないことと、index.html の字を見る（done (2) の読み方）。wstrip_own_names_clean は着地済みの歯 tipx_names_stay_apart と同じ形で、test の属性の行の次の行の fn の名を集め（3 つ）、どれも wstrip_ で始まり、残りの字が下の filter の語を含まないことを見る。wasm の大きさ（7.91 MB から約 3.0 MB の見込み）は歯で測らない。xtask の check は歯の段（nextest）を surface-build より前に撃つので、歯は組んだ後の dist を読めない。着地の後に席が xtask の surface-build の後の dist の wasm の byte と name の節の大きさを測り、計画の 6 節に書く（事後の確かめ）。
      filter の語（着地済みの行と第 3 波から第 9 波の行の verify の語・この行の接頭辞 wstrip_ は並べない・110 語）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・qgate_・nsum_・hcard_・ntime_・ptitle_・ncard_・hsym_・smore_・lcard_・aaround_・hruling_・sxaxis_・plimit_・bport_・fstop_・nsumw_・fmark_・fserve_・cadopt_・tipx_・hcsess_・hcproj_・sesplit_・mstore_・athr_・qblock_・wsteady_・gsum_・nstall_・pfold_・uword_・cround_・cgdom_・csled_・lhome_・shb_・ghb_・nact_・aord_・mtree_・rhold_・qkey_・flight_ で、新しい歯の名から先頭の wstrip_ を除いた字は、このどれも部分の字として含まない（例 wstrip_skeleton_x・wstrip_frame_x・wstrip_project_x は不可）。名は done に書いた wstrip_release_profile_keys・wstrip_trunk_release_build・wstrip_own_names_clean（どの語も含まない）。
      依存と順。depends は空。書く file は root の Cargo.toml と新しい歯の file だけで、第 8 波の 13 行（main のノート surface-wave8a と surface-wave8b）と、表示面の第 1 波の 2 行（ノート surface-wavei の i-1 と i-3）と、同じ第 9 波の行 e-hold・g-keyed・g-reads の write-set（置き場だけの = を含む）のどれとも重ならない（main 78f4701 の contracts で機械的に確かめた）。置き場だけの = で持つ xtask/src/main.rs は後の行 g-gz（第 10 波・g-strip と e-cache の後）が書き、面の crate の Trunk.toml と index.html を書く行は計画に無い。g-gz は xtask に圧縮の crate を 1 本足し、この行の後の wasm を前もって gzip に圧縮する（調べの実測で 3,018,891 byte から 958,324 byte）。opt-level と lto は組みの時間を測ってから別に決める。外の依存は足さず、Cargo.lock は変わらない。
  - n: 6
    type: prose
    title: 行 g-reads — 最初の読みを接続の開きに合わせ、読みの途中と片付いた部品の口に重ねて撃たない
    body: |
      なぜ。持ち主は 2 つの board が重いと指摘し（project board は t3-hub.1（裁定 id = user 2026-09-28T00:4xZ）・account board は t3-hub.1（裁定 id = user 2026-09-28T00:59Z））、質問の頁で答えを書いている最中の読み直しで画面が一瞬全部消えるので、読み直しは要るが画面への出し方を工夫するよう求めた（t3-hub.1（裁定 id = user 2026-09-28T01:06Z））。重さの調べ（2026-09-28・席の作業場の pb-perf/report.md）で、面の読み方に 3 つの無駄を測った。(a) 頁を開くと登録した口を 1 回ずつ読み（ホームで 8 本を 52 ms に撃つ）、知らせの接続（SSE）が開いたときに同じ口をもう 1 巡読む（接続は同じ host への 6 本の上限で待たされて 802 ms に開いた）。最初の読み込みで 16 本を撃つ。(b) 知らせの合図は種類を問わず登録した口を全部読み直し、読みの途中の口にも重ねて撃つ。持ち主の project board では 109 秒に知らせが 24 件来て、0.5 秒おきの束が多く、ホームを開いたままで毎分約 90〜130 本を撃つ（束のたびに読みが 2〜4 巡重なる見込み）。台帳を読む口はどれも要求ごとに bd を撃ち（0.55〜1.2 秒）、重なった読みは server の合流で bd を分け合っても、接続の上限と端末の負荷を食う。(c) 登録した口は消えず、画面から外れた部品の口も知らせのたびに読む（path が変わる口の枠も頁の一生の間残る）。今の 1 頁の中で外れる部品は少ないが、後の行 g-nav（頁を読み直さない切り替え）の後は、見た頁の口が全部残って読まれ続ける。要件 NFR2（器の event と台帳の変化は 5 秒以内に面へ届く・合図なしは周期の読みで 1.5 秒以内・台帳の読みが落ちたときと変化の知らせのつながりが切れたときは最後に読めた中身を 60 秒まで出し、15 秒を越えれば一番上の帯に読み込み不良の注意の印を出し、60 秒を越えたら測れていないと出す）と規則の行 R-21（同じ値）に拠り、この行は届く遅れを足さずに読みの数を減らす。つながりの切れの持ち回しと注意の印は server の側の行 e-hold と面の側の後の行 g-fresh（lose_all の直し）が受け持ち、この行は lose_all と、読めないときの出し方を変えない（今の lose_all はつながりが切れるとすぐ全部の口を読めないに置く）。画面の振る舞いの選び肢は足さないので、持ち主への問いは要らない。
      在りか（main 4fdf420 で確かめ、78f4701 で読み直した・net.rs と lib.rs と view.rs と歯の steady.rs・parts.rs・ticker.rs・mstore.rs・aaround.rs・acctwire.rs・hsblock.rs はその間に変わっていない・net.rs を書く行は第 3 波の g-tick の後に無い）。面の crate の src/net.rs（lib.rs の wasm の target の cfg の付いた pub mod net・wasm の target のときだけ組む）。thread_local に READS（RefCell の Vec の、&'static str の path と ArcRwSignal の Fetched の組・同じ path は 1 つの signal を分ける）・WATCHES（path の String と ArcRwSignal の Status〔Fetched と u16 の Option の組〕の組・頁の一生の間だけ持つ）・CONNECTED（Cell の bool）・TICK を持ち、pub const EVENTS_PATH（字 /api/surface/events）と pub const TICK_MS（1000）と pub fn now と pub fn ticker（set_interval を 1 本張る）を持つ。私的な async fn fetch と fetch_status は window の fetch_with_str で読み、応答の ok（状態の数が 200 から 299）でなければ Failed。pub async fn post は path と本文を受け、状態の数と本文の字の Option を返す。私的な fn load は path と signal を受け、load_at に 1 回目を渡す。私的な fn load_at は path と signal と何回目か（attempt）を受け、spawn_local の中で fetch の後に signal の with_untracked の中の字 settle(now, &fetched, attempt) の値で分け、Settle::Set なら置き、Keep なら何もせず、Retry なら set_timeout で RETRY_MS の後に attempt を 1 足して読み直す。私的な fn registered は READS の clone。私的な fn load_watch は枠の番号 slot と attempt を受け、WATCHES の枠の path と signal を取り、字 if path.is_empty() { で空なら戻り、spawn_local の中で fetch_status の後に枠の path が替わったか signal の値が同じなら戻り、settle が Retry なら set_timeout で読み直し、ほかは置く。pub fn reload_all は登録した口を全部 load し、枠を全部 load_watch の 1 回目で読む（書きの口へ送った後に block も呼ぶ）。私的な fn lose_all は登録した口と枠を全部 Failed に置く（決め方を通さない）。pub fn read_path は path の字の Signal を受け ReadSignal の Status を返し、枠を足し、Effect の中で path が変わるたびに枠の path を置き NotRead に戻して load_watch の 1 回目を撃ち、connect を撃つ。pub fn read は &'static str を受け ReadSignal の Fetched を返し、初めての path は枠を足して load で 1 回読み、登録済みなら同じ signal を返して読まず、connect を撃つ。私的な fn connect は CONNECTED が偽の初めての呼びだけ、EventSource を EVENTS_PATH で作り（作れなければ lose_all で戻る）、onopen と view の RELOAD_EVENTS の各 event に reload_all の closure を、onerror に lose_all の closure を付け、closure と接続を forget する。view の module（src/view.rs・host でも組む）は pub enum Fetched（NotRead・Body の String・Failed）・pub enum Settle（Set・Keep・Retry）・pub fn settle（今の値と新しい値と attempt を受け、同じなら Keep、Body の後の Failed は attempt が 1 以下なら Retry、ほかは Set）・pub const RETRY_MS（1000）・pub const RELOAD_EVENTS（契約の LEDGER_CHANGED_EVENT と BOARD_CHANGED_EVENT）を持ち、この行は view.rs を書かない。net の read を呼ぶのは project と project_dom と account の下の block の view と board.rs と account の board.rs と mapview の graph の dom で、どれも view を組む fn の中で 1 度呼び、読みの値で走り直す閉包の中では呼ばない（account board の tab の中身は query が替わるたびに作り直され、そのたびに read を呼ぶ・account board の block はどれも App と同じ口 account の PATH を読み、App の読みは頁の一生の間片付かない）。reload_all を呼ぶのは ask.rs・batch.rs・policy.rs と account の heartbeat.rs の POST の後、read_path を呼ぶのは project の nodearound.rs と timeline.rs。nodearound.rs の問いの頁の近傍の埋め込み（Embeds の open）は、中心ごとに 1 度だけ block の Owner の下で read_path を呼び、同じ中心は同じ読みを使う。nodearound.rs の pub fn source は節点の頁の読みを thread_local の SOURCE に頁に 1 つだけ持ち、初めて呼んだ block（節点の block）が read_path を呼び、つながりの block と timeline の block は同じ読みを使う（read_path を呼ばない）。節点の頁の block は頁の一生の間片付かない（board.rs の page_view が 1 度だけ組む）ので、この行の後も片付けで節点の頁の口が読まれなくなることは無い。leptos 0.8.21 の on_cleanup（leptos の prelude に在る・FnOnce と Send と Sync と 'static の closure を受ける）は今の Owner の片付けで closure を撃ち、Owner が無ければ撃たない。面の crate は on_cleanup を既に使っている（account の board.rs・project の map.rs ほか）。server の src/server/events.rs の pub fn stream は、受け手を Hub に足して（hub.subscribe）から 200 の頭と retry の行を書き、doc に受け手を足してから頭を書くので頭の後の変化は取りこぼさないと書いてある。繋いだ後は変化の知らせと 15 秒ごとの keepalive の注だけを書き、繋いだ時に知らせは送らない。
      最初の読みを接続の開きまで待たせる訳（調べの案からの違い）。調べの案は開いた直後の 2 巡目をやめ、読み直すのは繋ぎ直しのときだけにするものだった。server は受け手を足してから頭を書くので、頭（面の onopen）の後に撃った読みの後の変化は必ず知らせで届く。頭の前に撃った読みは、その読みの後で受け手を足す前に見張りが見つけた変化を取りこぼす（見張りの知らせはその時の受け手にしか送らず、繋いだ時にも送らない）。今は開いた時の 2 巡目がこの取りこぼしを拾っている。2 巡目だけを消すと、変わりの少ない台帳では次の変化まで古い中身が残り、要件 NFR2 の 5 秒を破る。そこでこの行は 1 巡目のほうを消す。初めての口は登録しても接続が開くまで読まず、開いた時の 1 巡（go_live の reload_all）を最初の読みにする。接続が OPEN_WAIT_MS（1 秒）の内に開かなければ（同じ host への接続の上限や server の不調）開くのを待たずに 1 巡読み、後で開いたときにもう 1 巡読む（今の 2 巡と同じで、取りこぼさない）。接続を張れないとき（EventSource を作れない）は今の lose_all の後にすぐ 1 巡読む。接続が開いた後に登録した口は、今のとおりすぐ読む。最初の読み込みの読みは 16 本から 8 本になり、接続は読みより先に張るので、調べで 802 ms 待たされた接続が上限の枠を先に取る。最初の描きの遅れは接続が開くまでの 1 往復で、上限は 1 秒（NFR2 の 5 秒の内）。
      形（host の module）。面の crate に src/flight.rs を足し、lib.rs に doc の 1 行（口ごとの読みの印の決め方・net が使い host でも組む・行 g-reads）と pub mod flight; を、wasm の target の cfg を付けずに pub mod account; の後に足す。flight に pub const OPEN_WAIT_MS（u64・1000・知らせの接続が開くのを待ってから最初の読みを撃つ上限の ms）と pub struct Flight（私的な欄 users の usize・busy の bool・again の bool・missed の bool・round の u32・derive は Debug と Clone と Copy と Default と PartialEq と Eq）を置く。Flight の pub fn は次のとおりで、名と引数と返りは歯が撃つ。attach（&mut self を受け bool）は見ている部品の数を 1 足し、0 から 1 になったときに missed が真なら missed を偽にして start の値を返し、ほかは偽。detach（&mut self）は見ている部品の数を 1 引く（0 より下げない）。call（&mut self を受け bool）は読み直しの呼びで、users が 0 なら missed を真にして偽、ほかは start の値。start（&mut self を受け bool）は busy が真なら again を真にして偽、偽なら busy を真にして真。end（&mut self を受け bool）は読みの鎖の終わりで、again が真なら again を偽にし、users が 1 以上なら busy を真のまま真を返し（続けてもう 1 回読む）、users が 0 なら missed を真にする。真を返さないときは busy を偽にして偽。renew（&mut self を受け u32）は path が変わった時で、busy と again を偽にして round を 1 進め、その round を返す（users と missed は変えない）。users（usize）・busy（bool）・round（u32）は &self を受け欄の値を返す（busy は後の行 g-pulse の読みの途中の数に使える見込み）。呼びは何度来ても読みの途中なら 1 回にまとまり、見ている部品が無い間の呼びは部品が戻ったとき（attach）の 1 回にまとまる。部品が走り直しで作り直されても、片付け（detach）と付け直し（attach）の間に呼びが無ければ読まないので、読みの値で部品を組み直す閉包の中で read を呼んでも読みは増えない。
      形（net.rs・wasm の target のときだけ・字は次のとおりに決め、歯 flight_net_wiring_text はこのうち done (5) に並べた字を見る）。thread_local に LIVE（Cell の bool・const で偽・最初の読みを撃ってよいか）を足す。READS の枠と WATCHES の枠はそれぞれ 1 つの Flight を持つ（持ち方の形と私的な補いの fn は問わない）。Flight の fn はメソッドの呼びの字（.attach() など）で呼び、fn の値として渡さない。done (5) が fn の本文に名指す字（LIVE.get()・LIVE.set(true)・.attach()・.renew()・.call()・.end()・.round()・on_cleanup(・.detach()・new(go_live)・new(reload_all)・set_timeout(・OPEN_WAIT_MS・if path.is_empty() {）は、その fn の本文に直に書く（閉包の中は可・表を借りる補いの fn に Flight を受ける閉包を渡す形は可。補いの fn の本文だけに移すと歯が見つけない）。私的な fn go_live（引数なし）は LIVE.set(true) の後に reload_all() を撃つ。connect は、onopen の closure を Closure の new に go_live を渡して作り（字 new(go_live)）、合図の event の closure は今のとおり reload_all を渡し（字 new(reload_all) は connect の本文に 1 つ）、onerror は今のとおり lose_all にする。接続を張った後に set_timeout で OPEN_WAIT_MS の後に LIVE.get() が偽なら go_live を撃つ closure を置く。EventSource を作れないときは今の lose_all の後に go_live を撃って戻る。read は、初めての path なら枠を足して Flight の attach を撃ち（初めてなので偽）、LIVE.get() が真で start が真なら今のとおり 1 回読む（偽なら撃たず、go_live の 1 巡が最初の読み）。登録済みの path なら attach を撃ち、真なら読む。どちらも on_cleanup に、その枠の Flight の detach を撃つ closure（枠の番号の usize だけを持つ）を渡す。reload_all は、登録した口ごとに Flight の call を撃ち真なら読み、path が変わる口の枠ごとに path が空でなければ call を撃ち、真なら load_watch にその枠の round を渡して読む。load_at は今の決め方の枝（字 settle(now, &fetched, attempt) と Settle::Set・Settle::Keep・Settle::Retry と RETRY_MS の後の読み直し）を保ち、Set か Keep の後に枠の Flight の end を撃ち、真なら続けて 1 回目の読みを撃つ（Retry の間は読みの途中のまま）。read_path は、枠を足すときに Flight の attach を撃ち、path の変わりの Effect の中で path を置いた後に Flight の renew を撃って round を持ち、LIVE.get() が真で path が空でなく start が真なら load_watch にその round を渡して読み、on_cleanup にその枠の Flight の detach を撃つ closure を渡す（片付いた後は呼びで読まない・Effect も同じ Owner で片付く）。load_watch は枠の番号と round と attempt を受け、枠の round が受けた round と違えば何もせず戻り、字 if path.is_empty() { を最初の spawn_local より前に残す（歯 flight_net_wiring_text と着地済みの aaround_net_skips_empty_path が見る）。読みの後、枠の round が受けた round と違えば置かず end も撃たずに戻り（前の path の読み）、同じなら今の決め方で置くか置かないかを決めてから（前と同じ値で置かないときも）Flight の end を撃ち、真なら同じ round で 1 回目の読みを撃つ。Retry なら同じ round で attempt を 1 足して読み直す。lose_all は変えない（Flight に触らず、全部の枠を読めないに置く）。字 fn lose_all( から次の行頭の fn の前までに字 settle を書かない（歯 steady_net_uses_settle_but_lose_all_does_not が見る）。READS と WATCHES の借りを持ったまま signal の set と読みの撃ちを呼ばない（set で部品が片付くと、その on_cleanup の closure が同じ表を借りる）。EventSource の new と set_interval の呼びと、引用符で囲んだ /api/ の字と event の名の字は増やさず、read・reload_all・post・read_path・now・ticker の名と引数と返りは変えない。
      着地済みの歯（直さずに通るもの・面の crate の tests の全部を grep で確かめた）。steady_net_uses_settle_but_lose_all_does_not（tests/steady.rs）は net.rs の字に settle(now, &fetched, attempt) が在ることと、fn の本文（字 fn と名と開き括弧から、次の行頭の fn・pub fn・async fn・pub async fn の前まで・この行の歯と同じ読み方）で lose_all の本文に signal.set(Fetched::Failed) が在り settle が無いことと、load_at の本文に Settle::Set・Settle::Keep・Settle::Retry・RETRY_MS が在ることと、net.rs に pub fn read(path: &'static str) -> ReadSignal<Fetched> と pub fn reload_all() と pub async fn post(path: &str, body: String) -> Option<(u16, String)> の字が在ることを見る（この行はどれも残す）。aaround_net_skips_empty_path（tests/aaround.rs）は net.rs の字 fn load_watch( から最初の spawn_local( までに字 if path.is_empty() { が在ることを見る（残す）。parts_reload_events_from_contract_constants（tests/parts.rs）は src の全部の file で EventSource::new( が 1 つだけ、event の名の字（ledger-changed・board-changed）が無く、net.rs に RELOAD_EVENTS の字が在ることを見る。parts_paths_distinct_in_block_modules は src の全部の file の引用符で囲んだ /api/ の字が block の module と graph の module と変化の知らせの口（net の EVENTS_PATH）だけに在ることを見る（flight.rs はどちらの字も持たない）。ticker_net_holds_one_interval（tests/ticker.rs）は net.rs に pub const TICK_MS: u64 = 1000; と pub fn ticker() -> ReadSignal<EpochSecs> と Duration::from_millis(TICK_MS) の字が在り、set_interval( が 1 つだけであることを見る（go_live の待ちは set_timeout）。mstore_module_text（tests/mstore.rs）は lib.rs の trim した行で pub mod store; の直前の行が wasm の target の cfg の属性でなく、pub mod board; と pub mod net; の直前の行がその属性であることを見る。acctwire_back_steps と hsblock_dispatch_by_list（どちらも write-set には置き場だけの =）は lib.rs の字に wasm の target の cfg の属性の行と pub mod board; の行が続けて在ることを見る（ほかに board.rs・frame.rs・project の ledger.rs の字と frame の値を見るが、この行はそれらを書かない・この行は pub mod flight; を pub mod account; の後に足すだけで、board と net と store の行と属性を変えない）。frame_classes_are_in_stylesheet と frame_no_heading_words_in_code は src の全部の file の class の字と、引用符で囲んだ見出しの語を見る（flight.rs は持たない）。block の file の字を読む歯（acctframe_・accthome_・acctsess_・batchpanel_・brand_ の crate::net::read の字と、accthb_ の crate::net::reload_all() の字）は呼び手の字を見て、この行は呼び手を書かない。
      測り方。新しい歯は面の crate の tests/flight.rs に置き、名を flight_ で始める。flight_one_more_after_busy・flight_unwatched_waits_for_user・flight_again_waits_when_unwatched・flight_renew_drops_flight は tsuzuri_surface::flight の Flight を host で撃ち、done (1)〜(4) の順に呼びと値を見る（時計を使わず、時間を測る歯は無い）。flight_net_wiring_text は OPEN_WAIT_MS の値を見て、CARGO_MANIFEST_DIR から src/net.rs と src/lib.rs の字を読み、done (5) の fn の本文の字を steady.rs の私的な fn function と同じ読み方で見る（load_watch の空の path の字は、aaround_net_skips_empty_path と同じく字 fn load_watch( から最初の spawn_local( までで見る）。flight_own_names_clean は着地済みの歯 tipx_names_stay_apart と同じ形で、test の属性の行の次の行の fn の名を集め（6 つ）、どれも flight_ で始まり、残りの字が下の filter の語を含まないことを見る。最初の読みが接続の開きを待つことと、読みの途中に重ねないことと、片付いた部品の口を読まないことの browser での振る舞いは host の歯で撃てないので、決め方を host の Flight で撃ち、net.rs が決め方を呼ぶことを字の並びで見て、wasm で組めることを xtask の surface-build で見る。着地の後に席が実物の頁で、開いた時の読みが 8 本であることと、知らせの束で同じ口の読みが重ならないことを browser の network の記録で確かめる（事後の確かめ）。
      filter の語（着地済みの行と第 3 波から第 9 波の行の verify の語・この行の接頭辞 flight_ は並べない・110 語）は accept_・account_・acctcore_・acctdoc_・acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・qgate_・nsum_・hcard_・ntime_・ptitle_・ncard_・hsym_・smore_・lcard_・aaround_・hruling_・sxaxis_・plimit_・bport_・fstop_・nsumw_・fmark_・fserve_・cadopt_・tipx_・hcsess_・hcproj_・sesplit_・mstore_・athr_・qblock_・wsteady_・gsum_・nstall_・pfold_・uword_・cround_・cgdom_・csled_・lhome_・shb_・ghb_・nact_・aord_・mtree_・rhold_・qkey_・wstrip_ で、新しい歯の名から先頭の flight_ を除いた字は、このどれも部分の字として含まない（例 flight_steady_x・flight_parts_x・flight_ticker_x は不可）。名は done に書いた flight_one_more_after_busy・flight_unwatched_waits_for_user・flight_again_waits_when_unwatched・flight_renew_drops_flight・flight_net_wiring_text・flight_own_names_clean（どの語も含まない）。
      依存と順。depends は空。書く file は net.rs と lib.rs と新しい flight.rs と新しい歯の file で、置き場だけの = は歯の steady.rs・parts.rs・ticker.rs・mstore.rs。第 8 波の 13 行（main のノート surface-wave8a と surface-wave8b）と、表示面の第 1 波の 2 行（ノート surface-wavei の i-1 と i-3）と、同じ第 9 波の行 e-hold・g-keyed・g-strip の write-set（置き場だけの = を含む）のどれとも重ならない（main 78f4701 の contracts で機械的に確かめた）。歯 aaround_net_skips_empty_path の file tests/aaround.rs は行 g-keyed が置き場だけの = で持つので、この行は write-set にも verify にも入れず（器の受付は verify の歯の file が write-set に無い行を断る）、同じ字を自分の歯 flight_net_wiring_text で見る（aaround_net_skips_empty_path は xtask の check の nextest が撃つ・2 行を並べて流せる）。置き場だけの = の tests/acctwire.rs と tests/hsblock.rs は verify の acctwire_back_steps と hsblock_dispatch_by_list の置き場で、どの行も書かない。第 8 波と第 9 波で net の read と reload_all と read_path を呼ぶ行（着地済みの g-next-rows の next.rs と h-acct-order の account の mod.rs と g-seat-hb の heartbeat.rs・g-keyed の ask.rs と batch.rs）は名と引数と返りを使うだけで、この行はそれを変えないので順は問わない。後の行は net.rs を g-reads → g-fresh → g-pulse → c-ev-kind の順に書き（どの行も歯 flight_net_wiring_text が見る done (5) の字を保つか、tests/flight.rs を write-set に持って直す）、g-nav（頁を読み直さない切り替え）はこの行の後（片付いた部品の口を読まないことを使う）。lib.rs は第 7 波の g-mode-store（着地済み）の後にこの行。steady.rs は後の行 g-fresh が lose_all の直しで書く見込みで、この行の後。外の依存は足さず、Cargo.toml と view.rs と vocab.json と style.css は触らない。
  - n: 7
    type: prose
    title: 行 g-policy-all — 全体への指示の範囲をつねに全体にする
    body: |
      なぜ。持ち主の指摘（t3-hub.1（裁定 id = user 2026-09-28T01:2xZ）に逐語で記帳・字はここに写さない）の要旨は、1 つの問いへの答えはその問いの card の答えの欄で書けば足りる（要件 FR6・問いの card ごとに答えの欄が在る）ので、問いの頁の block「全体への指示」は範囲 全体 だけを持てばよい、というもの。見本（docs/design/mock3 の ask.html の side の id policy・判断の記録 ADR-7 の承認 user 2026-09-26T07:51Z）は見出しの下に範囲の切り替え（class seg・role group・aria-label 範囲・button「この論点」〔初めに押された形〕と button「全体」）を置き、その下に字の欄と送る button を置く。この行は見本のこの切り替えを外す決めで、持ち主の直の指示で選び肢が無いので問いを置かない（計画 surface-plan の 3 節の同じ裁定 id の行）。あわせて、本番の block は問いの一覧を読み、読み直しのたびに字の欄と送る button を作り直すので、書きかけの欄の focus と caret が消える（重さの調べ〔2026-09-28・席の作業場の pb-perf/report.md〕と、答えを書いている最中に画面が一瞬消えるという持ち主の指摘 t3-hub.1（裁定 id = user 2026-09-28T01:06Z））。block が問いの一覧を読むのは範囲の切り替えを押せるかと問いの選びの項のためだけなので、2 つを外すと一覧を読まずに済み、字の欄と button を 1 度だけ組める。問い t3-hub.52.38 の技術に書いて裁定（裁定 id = t3-hub.52.38:20260928T0154Z-1）を受けた、問いの一覧をその場で更新する形のうち、答えを待つ質問とまとめて承認の 2 つの block は同じ第 9 波の行 g-keyed が直し、g-keyed は全体への指示の block（policy.rs）を書かずにこの行へ回した（g-keyed の節の字）。要件は FR8（全体の方針の欄）と FR6（問いの card と答え）。
      在りか（main b758e25 で確かめた・同じノートの行 g-keyed は着地の前で、policy.rs と tests/batchpanel.rs を書かないので、この 2 つの file の字は g-keyed の後も同じ）。src/project/policy.rs（write-set・着地済みの行 g-batch が置き、hs-derived が PATHS と FOLDS を足した・build.rs が生成する crate::project::policy・host でも組む）の host の部分は次のとおり。pub const BLOCK（Block の id policy・見出しの語の鍵 policy・class panel）、pub const PATH（二重引用符で囲んだ字 /api/policy は file に 1 度）、pub const PATHS（&[PATH]）、pub const FOLDS（空）、範囲の字の pub const SCOPE（範囲）・TOPIC（この論点）・ALL（全体）・TOPIC_PICK（論点）、pub const ALL_SCOPE（all）、pub const NO_MEMO（方針の memo が台帳に無い）、pub const NOT_CURRENT（範囲が今の問いでない）、pub enum Scope（Topic と All・pub const ALL はこの順の 2 つ・pub fn text は TOPIC か ALL の字）、pub struct Topic（pub な欄 id の BeadId と text の String）、pub fn topics（契約の QuestionCard の slice を受け、一覧の順の番号と 36 字に切った題の Topic の Vec）、pub fn body（view の Fetched の参照を受け、ask の cards の値を topics に通した Result・読めなければ &'static str の理由）、pub fn topic_enabled（usize を受け、1 以上で真）、pub fn scope（usize と Scope の Option を受け、0 本なら All・押していなければ Topic・ほかは押した値）、pub fn pick（選んだ id が一覧に在ればそれ・無ければ 1 本目）、pub fn scope_text（All なら字 all・Topic なら選んだ問いの id・問いが無ければ None）、pub fn can_send（&str と bool を受け bool・ask の can_send をそのまま呼ぶ）、pub fn request_body（範囲の &str と逐語の &str を受け、契約の PolicyRequest の欄 scope と verbatim にそのまま入れた電文の字）、pub enum Outcome（Recorded の policy の RulingId・Stale・NotCurrent・NoMemo・Refused の String・derive は Debug と Clone と PartialEq と Eq）と pub fn line・keeps_text（Recorded の外は真）・reloads（Stale と NotCurrent で真）、pub fn outcome（状態の数と本文の字の組の Option を受け、None は Refused の字 口に届かない、200 は本文が PolicyResponse に読めれば Recorded・読めなければ Refused、409 は Stale、400 で本文の trim が字 scope なら NotCurrent、503 で本文の trim が字 no-policy-memo なら NoMemo、ほかは batch の refused_text の字の Refused）。wasm の target のときだけの pub fn view（leptos の AnyView を返し dom の view を呼ぶ・生成した Module の view が呼ぶ）と私的な mod dom（字 mod dom { は file に 1 度）。mod dom の view は crate::net::read(ask::PATH) で問いの一覧を読み、押した範囲・選んだ問い・欄の字・送っている間・送った後の 1 行の 5 つの RwSignal の状態を作り、中身の閉包で fetched の with に body を渡して、Err は unmeasured(reason)、Ok の項の列は form(topics, s) を組む。form は範囲の切り替え（class の値 seg・role の値 group・aria-label の値 SCOPE の div の中に、Scope の ALL ごとに aria-pressed と disabled と on:click の button）と、範囲が Topic のときだけの問いの選び（aria-label の値 TOPIC_PICK の select）と、字の欄（textarea・rows の値 2・aria-label は語の鍵 policy の語・prop:value・on:input・on:keydown は変換の途中の判定の字 ev.is_composing() || ev.key_code() == 229 と key_action(composing, の呼びが Send なら既定の動きを止めて送る）と、送る button（type の値 button・class の値 btn・disabled の閉包・on:click で送る・字は語の鍵 policy の語と字 ›）を組む。submit は scope_text(scope(…), pick(…)) の字（None なら送らない）と欄の字を request_body に渡し、crate::net::post(PATH, body) で送り、outcome で状態を決め、keeps_text が偽なら欄を空にし、reloads が真なら crate::net::reload_all() を呼ぶ。block は kit の section に BLOCK と空の extra と、中身の閉包と送った後の 1 行（class の値 small・role の値 status の div）を渡して組む。中身の閉包が一覧の読みのたびに form を呼ぶので、読み直しのたびに textarea と button が作り直される。
      使う物（この行は書かない・確かめた）。src/project/ask.rs（crate::project::ask・host でも組む）の pub fn can_send（&str と bool を受け、送っている間でなく字の trim が空でないとき真）、pub enum KeyAction（Nothing・Send・Hold）、pub fn key_action（変換の途中なら Nothing・Ctrl か Meta と字 Enter なら Send・ほかは Hold）、字の定数 RECORDED（記録した）・STALE（質問が更新された）・NOT_REACHED（口に届かない）・BAD_REPLY（応答が電文として読めない）・REFUSED（送れなかった）。src/project/batch.rs の pub fn refused_text（状態の数と本文の字を受け、本文が契約の RefusalResponse に読めれば ask の refusal_text の字と全角の括弧の状態の数、読めなければ字 状態 と数とコロンと本文の trim）。同じノートの行 g-keyed は ask.rs と batch.rs を書くが、その形は ask に card_key・outline・listed を、batch に row_key・outline・listed・number_of を足し、2 つの DOM を鍵つきの一覧にするもので、この行が使う名と値には触れない（その行の節の字）。契約の型の crate の surface の module の pub struct PolicyRequest（pub な欄 scope の String と verbatim の String・derive は Debug と Clone と PartialEq と Eq と serde）と、lib.rs の pub mod wire の pub fn encode と decode（serde の JSON の字と行き来）。kit の pub fn section（Block と extra と body の AnyView を受ける）。語の辞書の鍵 policy の見出しの語は「全体への指示」で、plain は「全体に伝えたい方針」で始まる（この行は書かない）。
      server の口（境界の crate・この行は書かない・確かめた）。口 POST /api/policy（routes/policy.rs から server の policy.rs の accept）は、同じ origin でない要求を 403、大きすぎる要求を 413、電文として読めない本文を 400 の字 bad-body で断り、逐語が空白だけなら契約の Refusal の EmptyVerbatim（400）で断り、台帳を合流しない読みで読み直し（読めなければ 503 の字 ledger-unknown）、範囲の字が all でも open の問いの id でもなければ 400 の字 scope、方針の memo（題が 方針 ちょうど・memo の label・closed でも tombstone でもない・親が根の epic）が無ければ 503 の字 no-policy-memo を返し、方針の id を出して memo の notes の末に 1 行（方針 id と範囲の字と逐語を・でつないだ定型行）を足し、200 で PolicyResponse（方針の id と記帳の時刻）を返す。409 は返さない。
      形（host の部分）。policy.rs の host の部分から、範囲の切り替えと問いの選びのための物を全部外す（pub const SCOPE・TOPIC・ALL・TOPIC_PICK、pub enum Scope、pub struct Topic、pub fn topics・body・topic_enabled・scope・pick・scope_text）。pub fn request_body は逐語の &str だけを受ける形にし、契約の PolicyRequest の欄 scope に ALL_SCOPE の字 all を、欄 verbatim に逐語をそのまま入れた電文の字を返す（画面が範囲の字を渡す道を型で無くす）。BLOCK・PATH・PATHS・FOLDS・ALL_SCOPE・NO_MEMO・NOT_CURRENT・can_send・Outcome と line・keeps_text・reloads・outcome と wasm の target のときだけの pub fn view の名と引数と返りと値は変えず、PATHS と FOLDS の宣言の行の字もそのまま残す。Outcome の NotCurrent と outcome の 400 の字 scope の腕は残す（server の口は変えず、応答の写し方も今のままにする・画面は all だけを送るので、この block に 400 の scope は返らない）。file の頭の doc の注（今は範囲を選ぶと書き、問いの一覧を ask の口から読むと書く）は、方針の逐語をつねに範囲 全体（字 all）で送り問いの一覧は読まない、という字に直す。要らなくなった use（契約の graph の title36・ledger の BeadId・question の QuestionCard・view の Fetched と、mod dom の中の ledger の BeadId と project の unmeasured と ask の self）は外す（xtask の check は host と面の wasm の 2 つの clippy を -D warnings で撃つので、使わない use が残ると落ちる）。file の字（doc の注を含む）には、字「この論点」・Scope・aria-pressed・<select・net::read と、字 seg・全体・範囲 をそれぞれ二重引用符で囲んだ字を書かず、小文字にすると topic を含む字（Topic・topic・TOPIC）も書かない（歯 pwhole_toggle_gone が見る）。残す字 ALL_SCOPE（大文字の SCOPE は Scope と違う字）・NOT_CURRENT の値の字 範囲が今の問いでない（二重引用符の中で 範囲 の後に字が続く）・小文字の scope の字（欄の名と 400 の本文の字）・crate::net::post と crate::net::reload_all（字 net::read を含まない）は、どの見る字にも当たらない（確かめた）。
      形（DOM・mod dom の中・字は次のとおりに決め、歯 pwhole_dom_form_once がこの字で見る）。状態は欄の字・送っている間・送った後の 1 行の 3 つの RwSignal にする（押した範囲と選んだ問いを外す）。view はどの口も読まず、状態を作り、送った後の 1 行の閉包 note を今のまま作り、kit の section に BLOCK と空の extra と、字 {form(s)}{note} を中身に持つ view を渡す（form は view を組む時に 1 度だけ呼び、閉包の中で呼ばない・字 move || form( を書かない）。fn form は状態 s だけを受け（名 form と s は今のまま）、範囲の切り替えの div と問いの選びの select を置かず、字の欄と送る button を今の字のまま組む（textarea の rows・aria-label・prop:value・on:input・on:keydown と変換の途中の判定の字 ev.is_composing() || ev.key_code() == 229 と key_action(composing, の呼び、button の type・class の値 btn・disabled・on:click・語の鍵 policy の語と字 ›）。fn submit は状態だけを受け、欄の字が can_send で送れるときだけ、request_body に欄の字を渡した電文を crate::net::post(PATH, body) で送り、応答の後の扱い（outcome・keeps_text が偽なら欄を空に・reloads が真なら crate::net::reload_all()）は今のまま。mod dom の中に字 scope と PolicyRequest を書かない（範囲を DOM で選ばず、要求の本文を DOM で組まない）。ask の use の行は字 use crate::project::ask::{KeyAction, key_action}; でよい（self は使わなくなる・着地済みの歯 batchpanel_key_action のこの行の字の見張りは batch.rs だけに移す・次の段）。新しい class と語の鍵と二重引用符で囲んだ /api/ の字と details の要素と fold の記録の関数を呼ぶ字は足さない。
