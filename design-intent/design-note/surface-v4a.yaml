      歯（agflr.rs）。file の末の、doc の行『/// 参照の file の置き場（workspace の根から）。』から file の末まで（定数 REFERENCE と CLAUSES・関数 reference と section と faults・歯 agflr_reference_holds_the_floor_clauses_once_in_their_sections と agflr_reference_clause_removed_doubled_or_moved_is_named）を外し、直前の空の行も外して、file を前の歯の閉じ括弧の行と改行で終える。module の doc の 4 行目の『参照の file の 7 節と 11 節の句は、手引きが天井の文で振る舞いを持たないので、節の塊の中の字を照らす。』を外す（4 行目は『//! --scribe2 で渡す。』になる）。使われなくなった use の項は外す。ほかの歯は替えない。

