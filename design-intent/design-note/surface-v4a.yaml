  - n: 30
    type: prose
    title: 行 v-bead-intake — 受付と preflight が契約を bead から読む（memo t3-hub.92.7・作り直し v4 の段 S4 の移しの口の 1 本目・設計だけの行）
    body: |
      在りか。差の file は無い（設計だけの行・決め D2）。便は 13 項を書く。器の lib に新しい module pipe/bead.rs（判じと写しと digest の共有の口）と、受付の子 module pipe/cli/intake/bead.rs（bead の周の引数と台帳の読みと照らし）を足し、pipe/mod.rs に行 pub mod bead; を、pipe/cli/intake.rs に子 module の宣言と呼び替えを、pipe/cli/preflight.rs に bead の周を、pipe/refuse.rs に断りの語 5 つを、rules/mod.rs と scribe2/rules/manifest.toml に rules 行 3 本を足す。器の e2e の受付の子 module scribe2/crates/scribe2-boundary/tests/e2e/pipe/intake/vbin.rs に歯 6 本を足し、親 scribe2/crates/scribe2-boundary/tests/e2e/pipe/intake.rs の mod の行の並びの末に行 mod vbin; を足す。数を pin する着地済みの歯の file rules/embedded.rs と snapshot e2e__rules__rules_external_form.snap の数を直す。歯 rules_external_form の file rules.rs は書かない（置き場だけの = の項）。depends は v-pf-contract（その行が足す後段 generated_from を呼び、preflight.rs の --contract の周の分けに bead の周を足す）。v-pf-literal とは preflight.rs が交わるが、呼びも歯の書き替えも無いので depends を書かない。

      なぜ。持ち主は判断の記録 ADR-72 の決定 (2)（決め D1）で契約の正本を台帳の bead に移すと決め、裁定 t3-hub.92.7.2 で、便の契約を bead 1 本に置く形（欄 acceptance に契約表の導出の形の [[contract]] の 1 行・本文に設計の節）と上限の値（開いた契約の bead 40 本・本文 64 KB・acceptance 24 KB）を承認した（逐語は台帳の notes）。今の受付は acceptance の design = の pointer で base の木の契約表の行を読む（pipe/cli/intake.rs の generated が show_head で読む・V）。この行は受付と preflight に bead の周を足し、行の本文の出所だけを替えて、判定の 1 本 judge と表の検査と写しの読み（table::read の 1 本）を替えない。決定はしご。要るか: bead に置いた契約を読む口が無ければ切り替えられない。既に在るか: 台帳の 1 回の読み（seat::ledger::read_ledger・bd list --all の 1 撃ちで acceptance と description を持つ Issue の列・V）、行の読み（table::read_rows）、行の digest（pipe/row_review.rs の row_digest・FNV-1a 64・V）、置き場の全部の行の読み（pipe/spawn.rs の table_rows・V）、後段 generated_from（行 v-pf-contract）を使い、新しい判定の関数を足さない。器の crate は依存を持たない（Cargo.toml の dependencies が空・V）ので digest は既存の FNV の 1 本にする。

      並ぶ間の決まり（この行の着地から退けの行まで）。器は acceptance に design = の行が在れば今の契約表を、行 [[contract]] が在れば bead を読み、両方を持つ bead は断りの語 contract-bead-both-forms で断る。受付は --design を渡された周は今のまま台帳を読まない（両方の形の断りは、列が候補を組む周に行 v-bead-dispatch が撃つ）。

      形（pipe/bead.rs・pub の名）。
      - 定数 CONTRACT_HEAD（字 [[contract]]）と COPY_DIR（字 bead-contracts）。
      - enum Form（Design は pointer を持つ・Bead・Both・Neither）と関数 form_of(acceptance)。前後の空白を除いた行がちょうど [[contract]] の行が在れば bead の形、行頭が字 design と空白と等号と空白の行（dispatch/candidates.rs の pointer_of と同じ鍵）が在れば design の形。両方は Both（design の行の pointer が解けなくても Both）。design の行だけで pointer が解ければ Design、解けなければ Neither（今の pointer_of と同じ極性）。どちらも無ければ Neither。
      - 関数 digest(acceptance, description)。row_review::row_digest(acceptance, description) をそのまま呼ぶ（2 つの字を整えずに NUL で区切った byte の FNV-1a 64 の 16 桁）。
      - 関数 copy_text(bead, acceptance, description)。写しの字は 5 つの部分を改行 1 つで繋いで末に改行を 1 つ足した字。部分は、字 schema = 1、空の字、acceptance の末の空白と改行を除いた字、字 section と空白と等号と空白と二重引用符で囲んだ bead の id、字 goal と空白と等号と空白と二重引用符で囲んだ本文の 1 行。本文の 1 行は description の各行（str::lines の行・CR と LF の区切りの CR も落ちる）の前後の空白を除き、空の行を落とし、空白 1 つで繋いだ字（tz derive の goal と同じ・folio2/crates/folio/src/derive.rs の関数 goal）。Err の理由の句は次の 5 つ。本文に二重引用符か逆斜線が在る。本文が空。acceptance に欄 <名> が在る（名は section か goal か depends・書かれた最初の名）。[[contract]] の行が <数> 本。行を読めない（<read_rows の最初の理由>）。句の順は、本文の字の照らし、本文の空、欄の照らし、行の読み、行の数。
      - 関数 row_of(bead, acceptance, description)。copy_text の字を table::read_rows に写しの名（字 bead.toml）で渡し、行がちょうど 1 本ならその ContractRow を返す（欄 goal に本文の 1 行・欄 section に bead の id）。
      - 関数 copy_path(state_dir, bead, digest)。置き場の子 bead-contracts の子 <bead> の下の <digest>.toml。中身で名が決まるので、bead が後で替わっても前の写しは替わらない。関数 digest_of_design(design)。契約の design の path がこの形なら 16 桁を返し、ほかは None（列外の鍵が便の写しから digest を引く口・行 v-bead-dispatch が使う）。
      - 関数 copy_pointer(state_dir, bead, acceptance, description)。row_of で行を読み、digest と copy_path で写しの path を作り、table::parse_pointer に写しの絶対 path と井桁と行の id を繋いだ字を渡した Pointer を返す（Err は row_of の理由の句か parse_pointer の理由の字）。写しを書かない純な関数で、受付の bead_contract の 7 段目と、行 v-bead-precheck の事前審査の母集団と memo の引き金が、同じ 1 本で写しの pointer を組む。

      見本（歯 vbin_copy_text_joins_the_body_like_derive）。acceptance は e2e の toy の derive_row の行 b（欄 verify を字 cargo nextest run -p toy --no-tests=fail derive_ の 1 行の配列に差し替えた形）から欄 section の行を除いた字。本文は 4 行で、1 行目は空白 2 つと字 第一の段。、2 行目は空、3 行目はタブ 1 つと字 - 二つ目 ab、4 行目は字 末 で、行の区切りは CR と LF の 2 字、末に改行は無い。goal の値は 第一の段。 - 二つ目 ab 末 で、bead の id は s2-b。同じ歯は copy_pointer を置き場の dir の固い字 /s で撃ち、path が copy_path に /s と s2-b と digest の値を渡した値で id が字 b の pointer を見る（写しを書かない）。

      大きさの見本（歯 vbin_cap_sized_bead_reads_back_byte_equal）。本文は、字 あ（3 byte）と ASCII の a と二重引用符と逆斜線とタブと CR と LF の 9 byte の組みを繰り返して 65536 byte に切りそろえた字、acceptance は同じ組みで 24576 byte の字。JSON の字の escape（二重引用符・逆斜線・タブ・CR・LF）で書いた bead 1 本の配列を seat::ledger::issues_of で読む。この歯は台帳の client を撃たない（bd の書きと読みが字を替えないことは係 w331a の U の照らし・notes）。

      形（pipe/cli/intake/bead.rs・pub(in crate::pipe) の名）。
      - 関数 source_of(args)。--design も --contract も無い周は bead の周で、--bead と --repo を read_args と同じ need と repo_flag で読む。ほかの周は今の read_args をそのまま呼ぶ（--contract の hand-written-contract の断りと --design の読みは替えない）。返りは enum Source（Design は pointer を持つ・Bead）と bead と repo。
      - 関数 bead_contract(repo, state_dir, manifest, bead, issues, materials)。issues は台帳の全部の Issue（受付と preflight は read_ledger を 1 回撃って渡し、列は周の頭に読んだ列を渡す）。順は次のとおりで、最初の断りで返る（judge の前・run dir も event も作らない）。
        1. bead の id が空か区切りの字（斜線）か .. を持てば、また issues に B が無ければ contract-bead-unreadable。
        2. form_of が Both なら contract-bead-both-forms、Neither なら contract-bead-unreadable、Design なら今の generated をその pointer で呼んで返す（並ぶ間の 2 形）。
        3. byte。本文の byte の数（str::len）が rules 行 contract.body_max_bytes の値より大きければ field=description、acceptance が contract.acceptance_max_bytes より大きければ field=acceptance の contract-bytes-cap（本文を先に見る）。
        4. row_of が Err なら contract-bead-unreadable（理由はその句）。
        5. 行の id が pipe::spawn::table_rows(repo, HEAD) の全部の行（置き場の宣言の全部の doc・廃止のノートの導出物も含む）のどれかの id と同じなら by=<doc>#<id>、B のほかの bead（閉じた物も）のうち form_of が Bead か Both で row_of が Ok の行の id と同じなら by=<その bead の id> の contract-id-taken（表を先に・bead は id の順）。table_rows が Err の周は今の断り contract-table（TableError の Unreadable・理由はその字）で断る。
        6. status が closed でない bead のうち form_of が Bead か Both の本数（B を含む）が rules 行 contract.open_max の値より大きければ contract-open-cap。
        7. pointer を copy_pointer で作り、写しの file を copy_path に書く（在れば書かない・dir は作る・書けない周は broken）。後段 generated_from(repo, pointer, 写しの字, materials) で契約を組む。
      - 台帳を読めない周（read_ledger の Err・rules 行 seat.ledger_timeout_s が無い周）は contract-bead-unreadable で、理由の句は 台帳を読めない。3 本の rules 行が無いか Int でない周は今の rules の断り（DENIAL_RULES）。

