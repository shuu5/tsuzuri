    type: prose
    title: 行 v-bead-dispatch — 列が契約の bead を候補に数え、列外の鍵を bead の digest で比べる（memo t3-hub.92.7・作り直し v4 の段 S4・設計だけの行）
    body: |
      在りか。差の file は無い（設計だけの行・決め D2）。便は 7 file を書く。器の scribe2/crates/scribe2/src/pipe/dispatch/candidates.rs（列の 1 件の解き・列外の鍵・兄弟・起こす argv）を直し、scribe2/crates/scribe2/src/pipe/dispatch.rs の準備の表の型の 1 行と entry_of の呼びの 1 行をその場で替え、scribe2/crates/scribe2/src/pipe/cli.rs の受付の re-export の列（pub(in crate::pipe) use intake の 1 行）に語 bead::bead_contract を足し、scribe2/crates/scribe2/src/pipe/review.rs に子 module の宣言の 1 行を足して detail の 1 行に呼びを足し、新しい子 module scribe2/crates/scribe2/src/pipe/review/copied.rs（2 つの digest の語の純関数と、その lib の歯）を足し、器の e2e の列の親 scribe2/crates/scribe2-boundary/tests/e2e/pipe/dispatch.rs に行 mod vbdisp; の 1 行を足し（今の行 mod waiting; の次）、新しい子 module scribe2/crates/scribe2-boundary/tests/e2e/pipe/dispatch/vbdisp.rs に e2e の歯を足す。precheck.rs・bundle.rs・memo.rs・row_review.rs・受付の intake.rs と preflight.rs と refuse.rs は替えない。

      なぜ。持ち主は判断の記録 ADR-72 の決定 (2)（決め D1）で契約の正本を台帳の bead に移すと決め、裁定 t3-hub.92.7.2 で、契約の行を bead の欄 acceptance に契約表の導出の形の [[contract]] の 1 行で置き、設計の節の本文を bead の本文（description）に置き、便の順を bead の blocks で持つ形を承認した。今の列は acceptance の design = の行だけを読み（candidates.rs の pointer_of・401 行）、その行の無い bead を no-design-pointer で待たせる（74 行）ので、bead に置いた契約は永久に起きない。列外の鍵（審査の FAIL の後に起こし直すかの鍵）は、便の写しの契約 file の字が今の生成と同じか（settled・424 行）と、審査の材料の節の写しが今の base の節と違うか（section_moved・477 行）で決まり、どちらも base の設計 doc の行と節を読むので bead の契約には当たらない。兄弟の待ち（same_section・213 行）は同じ doc の同じ節の行を兄弟に数えるが、bead の契約には doc も節も無い。決定はしご。要るか: 列が数えなければ受付の行 v-bead-intake が着地しても便が起きない。既に在るか: bead の blocks の待ち（entry_of の頭・58〜63 行の is_blocking）と交差・枠・受付の判定（settle と blocker）は bead の契約の生成した Contract をそのまま使え、替えるのは pointer の読みと鍵と兄弟と argv だけ。新しい待ちの理由と断りの名と event kind は足さない。

      共有の読み（行 v-bead-intake が持つ・この行は呼ぶだけ）。器の module scribe2/crates/scribe2/src/pipe/bead.rs の pub の名を使う: form_of(acceptance) と Form（Design・Bead・Both・Neither の 4 つ）、digest(acceptance, description)（row_review::row_digest で 2 つの字を整えずに繋いだ 16 桁）、copy_path(state_dir, bead, digest)（置き場の bead-contracts/<bead>/<16 桁>.toml・COPY_DIR は字 bead-contracts）、digest_of_design(design)（契約の design の path がその形なら 16 桁）。受付の bead の周の照らしと契約の生成は、行 v-bead-intake の子 module pipe/cli/intake/bead.rs の bead_contract(repo, state_dir, manifest, bead, issues, materials) の 1 本を呼ぶ（形・本文と acceptance の byte・写しの字と行・契約 id の重なり・開いた本数を受付と同じ順で撃ち、写しを置いて後段 generated_from で組んだ契約と契約 file の字か Denial を返す・Design の形の bead は今の generated に回す）。intake は cli の私的な子 module なので、この行が cli.rs の re-export の列に語 bead::bead_contract を足して pipe の中へ見せる（v-bead-intake が子 module の宣言を pub(super) mod bead; にする・cli の外で bead_contract を最初に呼ぶのがこの行なので re-export の語もこの行が持つ）。この行は generated_from を直に呼ばない。断りの語 contract-bead-both-forms と contract-bead-unreadable ほかは Refuse の型のまま Denial に入るので、今の refused_by と列の受付の断りの記録（pipe/dispatch/refused.rs）がそのまま名を運ぶ。

      形（candidates.rs の entry_of）。
      - 依存・印・起こした事実の待ちは今のまま先に見る（bead の契約も blocks で順を持つ・欄 depends は無い）。
      - 今の pointer_of の呼びを form_of の呼びに替える（pointer_of は両方の形を持つ bead にも設計 pointer を返すので、先に撃つと両方の形の断りが立たない・candidates.rs の 401 行から 404 行）。Design の bead はその pointer で今の道のまま（2 形を読む期間の表の側）。Bead か Both の bead は bead_contract を撃ち（Both は bead_contract の 2 段目が contract-bead-both-forms で断る）、Err は今の refused_by で受付の断りの待ち（理由の欄は admission と断りの名）にし、Ok の契約を使う。Neither の bead は今のまま no-design-pointer。bead_contract に渡す issues は周の頭に読んだ台帳の全部の列で、entry_of に引数 issues を足し、dispatch.rs の entry_of の呼びの 1 行に周の issues を渡す（その場の替え）。
      - bead_contract は照らしの後に写しの file を置く（在れば書かない）。列の余地の判じ（blocker の judge）は受付と同じ settle_write_set の pointed_row で契約の design の path を table::read で読む（pipe/cli/intake.rs の 921 行から 925 行）ので、写しが無いと bead の契約は contract-table で待ち続ける。見る側の dispatch ls も同じ周の読み（measure）を通るので写しを置く。写しは中身で名が決まり在れば書かないので、ls が置いても値と便は替わらない（ls が便を起こさない事と、索引と未反映の裁定の file を書かない事は替えない）。
      - 生成が通った bead の契約は、列外の鍵の判じ（下の settled_bead）の後、兄弟の判じ sibling_of を撃たずに準備の表へ入れる（bead の契約は兄弟を持たない）。
      - 準備の表の値は（設計 pointer か無し・契約）の対にし、dispatch.rs の let mut ready の型の 1 行を Option の pointer に替える。settle は Option の pointer を受け、Some の便は今の launch_of を、無しの便は新しい関数 launch_bead を撃つ。launch_bead の argv は run と --bead と bead の id と --repo と --state-dir と道具（tools）と DRIVE で、--design を持たない（受付が bead を読み写しの pointer を作る）。起きた便の受付は、--design も --contract も無い撃ちを行 v-bead-intake の source_of が bead の周にする。pipe run は intake_id から intake_run を通り（pipe/cli/run.rs の 97 行・pipe/cli/intake.rs の 158 行から 164 行）、run の許す旗の列 ALLOWED_RUN は --design を必須にしない（pipe/cli/args.rs の 160 行から 163 行・必須の断りは read_args の need だけ）ので、run の側は替えない。台帳の client は tools が渡す --bd で受付に届く。launch_of の字は替えない（dispatch.rs の in-file の歯が 1130 行で呼ぶ）。

      形（列外の鍵・settled_bead）。新しい関数 settled_bead は、今の settled の 2 つ目の段から先（live の生死・requeues と released_after の戻し・審査を測れない Reviewed の印の戻し・hash-object の sha）を同じ順で使い、直前の便の選びだけを替える。選ぶのは、同じ bead の run を id の逆順に見て、run の dir の契約 file（Contract::load）の欄 design に digest_of_design を撃った 16 桁が、今の bead の digest（bead::digest に acceptance と description を渡した値）と同じ最初の 1 本。digest は acceptance と本文の両方を持つので、どちらかの 1 字が替われば同じ digest の便が無く列に戻り、戻せば前の便がまた選ばれる（今の節を直すと起きるのと同じ意味）。節の写しの比べ section_moved は bead の便には撃たない（本文は digest に入る）。契約 file を読めない便と digest_of_design が None の便（表の側の便）は選ばない。今の settled と section_moved と section_keyed と requeues は替えない。

      形（兄弟）。kin_of は pointer_of が設計 pointer を返さない B を今のまま None にする（bead の契約は兄弟の待ちの元にならない）。same_section と siblings_of と sibling_of は替えない。

      形（審査の event の detail・撤退の測る口）。新しい子 module review/copied.rs の純関数 words(material, copy) は、字『 material:』と row_review::row_digest の材料の値と字『 copy:』と写しの値を繋いだ字を返す。材料は審査の材料の dir の契約の写しと設計の材料の file design.txt の字の対（lens が読んだ字）、写しは run の dir の契約 file と、review::design_material が今の写しの pointer から読み直した字の対で、どちらも末の改行 1 つを除いて渡す（candidates.rs の kin_of と同じ整え方）。review.rs の settle の Reviewed の detail の 1 行（今は detail_of の字と ROW_REUSED を繋ぐ format の 1 行）を、その間に copied の関数 words_of(entry) の字を挟む形に同じ 1 行のまま替える。words_of は、契約の design に digest_of_design が Some を返す時（受付が bead の写しを置いた便）だけ words の字を返し、ほかは空の字を返す（材料と写しを読めない周も空の字）。表の側の便の detail は 1 字も替えない。read_detail は語で読むので判定と理由の型の読みは替わらない。この 2 つの値が食い違う event が、判断の記録の撤退の窓 C の数える材料になる。

