  - n: 28
    type: prose
    title: 段 S7 の割り方の要点 — 審査役の prompt の行の順と、測りを先に置く理由（memo t3-hub.92.9・行はこのノートに 1 本だけ置く）
    body: |
      在りか。割り方の正本は段の memo t3-hub.92.9 の notes と、そこから辺を張る行の bead である。このノートには、先に流せる行 v-lens-ask（節 27）だけを置く。

      測りを先に置く。審査役の雛形を替える前に、席が記録の材料で今の判定を撃ち直して基準を取る。契約の審査の run の dir は、材料の dir review（契約の写しと design.txt・requirements.txt ほか）と、review.json の key tree（審査の木の sha）を残す。器の口 scribe2 lens --contract と --worktree に、写した材料と、その tree を写した木を渡せば、同じ審査を撃ち直せる（新しい code は要らない）。材料は、2026-10-06 の契約の審査の FAIL 13 件と、PASS で着地した行から 13 件の、計 26 件とする（FAIL のうち 9 件はこのノートの版の直しで本物の漏れと確かめた物・残り 4 件はほかのノートの行で、直しの有無を測りの前に照らす）。今の binary で 2 度撃って揺れの幅を数え、各行の着地の後に新しい binary で 1 度撃ち、FAIL を捕まえた数と PASS を通した数を比べる。わざと欠陥を植えた便は作らない（本物の漏れの記録が在るので）。

      契約の審査役は残す。2026-10-06 の契約の審査は 88 件のうち FAIL 13 件で、そのうち 9 件はこのノートの版 0.3〜0.16 の直しに 1 件ずつ当たる本物の漏れだった。消すと、この 13 件は実装役の周の後の gate か着地の後で見つかる。測りで捕まえる数が落ちた時だけ、消すか絞るかを改めて問う。

      順（小さい行から）。
      - 1 本目 v-lens-ask（器・雛形 3 つ・節 27）。迷ったらの既定と道具で止まる禁止を消し、外の読みを名指せる危険 1 つにつき 1 度に限る。v-gate-fix の着地の後。
      - 2 本目 v-review-material-refuse（器・pipe/review.rs）。契約の審査の材料に欠けの印（要件面に無い・本文が無い・読めない）が在る周は、lens を起こさず INCONCLUSIVE と kind section-material-missing を器が書く。lens-contract.txt の材料の欠けの行を消す。2026-10-01 からの欠けは 0 件なので、効くのは費えでなく雛形の字を減らす事である。review.rs は 1463 行で上限 1500 に近く、growth の欄が要る。
      - 3 本目 v-lens-severity（器・lens.txt・pipe/gate/lens.rs・pipe/gate/findings.rs・pipe/follow.rs）。gate の出力を所見の表（場所・何・なぜ・直し方・重さ）と最終行の JSON の 2 層にし、重さ Critical・Important・Minor を足し、FAIL を Critical か Important の所見を持つ周に限る。Minor だけの周は PASS で、所見は memo の材料に送る。判断の記録 ADR-63 の決定 (6)（PASS と数の食い違いを FAIL に読む）は、Critical と Important の数だけで照らす形に改める（記録の改めが要る）。v-gate-fix の直しの周の節は、所見の表を写す。
      - 4 本目 v-gate-refix（器・行 v-gate-fix の節 10 の 2 本目）。直しの周の再審査を、前の周の所見の表と直した差だけを渡す雛形にする。3 本目の後。
      - 5 本目 v-memo-merge（器・lens-memo.txt・pipe/dispatch/memo.rs・pipe/dispatch/memo_lens.rs・fleet/lifecycle_mark.rs）。memo の判定の語に merge（key into に相手の memo の id）を足し、keep に理由の型 3 つ（no-material・wait-row・wait-owner）と引き金の key を足す。merge は promote と close と同じく席の手番の memo に数える。
      - 6 本目 v-review-quality-cut（器・lens-contract.txt・lens-quality.txt・pipe/review/quality.rs ほか）。契約の審査の質の 5 観点の数を、gate の重さの Minor の所見に寄せて消す。3 本目の着地と測りの後に決める。

      重さと直しの周。今の行 v-gate-fix は、gate の lens の FAIL の全部で直しの周に入る（節 9）。3 本目の後は FAIL が Critical か Important の所見を持つ周だけになるので、直しの周の条件はそのまま Critical と Important の所見だけになる（v-gate-fix の code は替えない）。Minor だけの便は PASS で着地し、直しの周を使わない。

      判定の語の名。INCONCLUSIVE を CANNOT-VERIFY に名を替えるのは、この段では行にしない。器の記録の語（review.json・verdict.json・event の detail・report の数え）が字 INCONCLUSIVE を持ち、器の src と歯の .rs の 49 file がその字を持ち、古い記録を読む口も要る。替えるのは意味で、1 本目が INCONCLUSIVE を名指せる危険を確かめられない時だけの語に絞る。名を替えるかは席が決める（memo の notes に問いとして残す）。

      消す物（段 S7 の全部）。迷ったらの既定の文 3 つ・道具で止まる禁止の文 3 つ・契約が渡されていないからの句・上限の無い外の読みの文 3 つ（1 本目）・材料の欠けの行（2 本目）・質の数の重ね（6 本目）。
