  - n: 38
    type: prose
    title: 行 t-code-bead — tz code と memo の繋ぐ門が契約の bead も読む（memo t3-hub.92.7・作り直し v4 の段 S4・判断の記録 ADR-72 の決定 D1 の分・裁定 t3-hub.92.7.2・設計だけの行）
    body: |
      在りか。差の file は無い（設計だけの行・決め D2）。便は src 3 file と歯の file 3 本を書く。台帳の字から契約の bead の write-set を読む関数は中核の graph/code.rs に、台帳の読みと旗 --bd は境界の cli/code.rs に置き、境界の main.rs の module の doc の tz code の 1 行（31 行目）の字を合わせる。新しい歯の段の file は crates/tsuzuri-core/tests/cdbead.rs（接頭辞 cdbead_）と crates/tsuzuri-boundary/tests/kcbead.rs（接頭辞 kcbead_）。着地済みの tz code の歯 kcode.rs は見本に偽の bd を足す（下の段）。群の main.rs と kfold の表は書かない（module を足さない）。

      なぜ。持ち主は裁定 t3-hub.92.7.2 で、便の契約を台帳の bead に置く形を承認した（判断の記録 ADR-72 の決定 D1 の分）。決めの字のうちこの行が頼る物。契約の行は契約表の導出の形の [[contract]] の行（欄 id・title・req・write-set・verify・size・done ほか）で bead の欄 acceptance に置き、設計の節の本文は bead の本文に置く。切り替えの commit の日から新しい契約は bead にだけ置き、設計ノートに行を足さない。契約の id は契約表の全部の行とほかの全部の契約の bead の id に重ならない（器の受付が照らす）。並ぶ間（切り替えから退けまで）は契約表の行と契約の bead の 2 形が在る。今の tz code は契約表の導出物だけを読む。境界の cli/code.rs の fn gather（85 行目・行の読みは 93 行目）が fn write_sets（98 行目から 123 行目）で repo の contracts の直下の .toml の字を読み、中核の graph/code.rs の fn read_write_sets（288 行目）が [[contract]] の行ごとに id と write-set を読む。台帳は読まない。そのため切り替えの後の契約は tz code の数にも --row の引きにも出ず、席と係が bead の契約の write-set の file の定義を tz code で引けない。

      memo の繋ぐ門（照らした結果・src は替えない）。中核の memo_gate.rs の fn memo_needs（111 行目から 149 行目）は、1 段目で memo の touches の各節点の隣のうち候補の種類（契約の bead は種類 task）で次数が 30 以下で、bead なら開いた物を拾い、2 段目で 1 段目の設計ノートの行へ design の辺を持つ開いた契約の bead を拾う。契約の bead は設計ノートの行を持たず design の辺も持たない（行 t-graph-bead が design の辺を pointer の行だけから組む）ので、2 段目は契約の bead を拾わない。一方で行 t-graph-bead は契約の bead から欄 req の要件への req の辺を張り、bead の依存（blocks）は今も辺になる。そのため、要件を名指す memo は 1 段目で契約の bead を直に拾い（pointer の形では要件 → 行 → 契約の 2 段で拾う）、契約の bead を名指す memo は blocks の隣の開いた契約の bead を 1 段目で拾う（pointer の形では行の depends の隣の行の契約を 2 段目で拾う）。閉じた契約の bead は 1 段目の開いた物の決めで拾わない（pointer の形も 2 段目で開いた物だけ）。見落としと誤った断りは src の替えで直す物が無いので、この行は memo の門の src を替えず、上の拾いを歯で留める（行 t-graph-bead の req の辺や blocks の辺の読みを後で替えると、この歯が落ちる）。違いは 1 つ在る。契約の bead を名指す memo の 1 段目は、次数が 30 以下の要件も拾う（pointer の形では設計ノートの行を拾う）。行が無いので、近い設計の節点として要件を処分させるのは正しい。

      形（中核の graph/code.rs）。公開の関数 bead_write_sets（台帳の字を受け、Option の、行の id と write-set の項の列の対の列を返す）を fn read_write_sets の後に足す。台帳の字は bd の読み取りの口の JSON の配列（境界の BD_ARGS の撃ちの出力）で、中核の graph/build.rs の fn read_ledger（397 行目・pub(crate)）で読む（読めなければ None）。bead を台帳の順に見て、欄 acceptance の字（無ければ空の字）を fn read_write_sets で読む（読めなければ全体を None・壊れた台帳の一部だけを見せない）。読んだ行ごとに、行の id を bead の id と井桁と契約の id をつないだ字にして列に足す。契約の行を持たない bead（pointer の行だけの bead・acceptance の無い bead ほか）は read_write_sets が空の列を返すので何も足さない。開閉は問わない（契約表の導出物も着地した行を持つのと同じ）。module の doc の 1 行目から 2 行目の 3 つの字の段に、台帳の契約の bead の write-set の字を足す。

      形（境界の cli/code.rs）。旗 --bd（値は台帳の読みの program・既定は server の ledger の定数 BD・空の値と 2 度は今の fn parse の断りのまま）を足し、USAGE を usage: tz code [--repo <dir>] [--sg <program>] [--bd <program>] [--row <ノート>#<行> | --file <path>] にする。fn gather は contracts の行を今のまま読んだ後に、server の ledger の Source を repo と bd で作って text_alone で台帳の字を読み、bead_write_sets の行を contracts の行の後に足す。台帳の字が無いか bead_write_sets が None なら、bead の行を足さずに組み、読めない印を持つ。fn run は旗なしと --row の時、読めない印が在れば、今の出力を出した後に標準エラーに tz code の頭と字 台帳が読めない を持つ 1 行（bead の契約の行を含まない・まだ分からない）を書き rc 2 を返す（--row の名指しの誤りの rc 1 も 2 にする・名指した行が bead の契約かもしれない）。--file は行を使わないので rc を替えない。module の doc の旗の段と終了 code の行に --bd と台帳が読めない時の rc 2 を書く。--row の行の id は、契約表の行は文書 id と井桁と行 id（今のまま）、契約の bead は bead の id と井桁と契約の id。終了 code の決めは tz graph（旗なしは読めない出所が在れば出した上で 2）と同じ形にした（切り替えの前の写しのように台帳の無い置き場でも、契約表の行は引ける）。境界の main.rs の 31 行目の字を USAGE と同じ旗の並びにする。

      歯の見本（cdbead.rs）。台帳の字は serde_json の json の配列で組む（着地済みの tsuzuri-core の teeth1/dnrow.rs の偽の台帳と同じ組み方）。
      - bead_write_sets の見本の台帳は 4 本。kb.1 は open で acceptance は [[contract]] の行と、id の行で値は t-one の JSON の字と、write-set の行で値は b.rs と +d.rs の JSON の配列。kb.2 は open で acceptance は design の pointer の 1 行（contracts/nx.toml の後に井桁と a）。kb.3 は closed で acceptance は [[contract]] の行と、id の行で値は t-three と、write-set の行で値は a.rs だけの配列。kb.4 は acceptance を持たない。
      - None の見本は空の字と、字 not json と、kb.1 の write-set の行の値を配列でなく b.rs の JSON の字にした bead の台帳。空の列の見本は空の配列の字。
      - memo の門の見本の索引は dnrow.rs の IDX と同じ 5 節点と 5 辺（要件 FR1・条 A-1・設計ノートの行 nx#a・nx#b・ny#c）。台帳は 5 本。mb は種類 epic の open。mb.1 は種類 task の open・親 mb・acceptance は [[contract]] の行と id の行で値は t-one と req の行で値は FR1 だけの配列。mb.2 は mb.1 と同じ形で id は t-two・dependencies に mb.1 への blocks。mb.3 は mb.1 と同じ形で id は t-three・status は closed。mb.4 は種類 task の open・親 mb・acceptance は design の pointer の 1 行（contracts/nx.toml の後に井桁と a）。グラフは tsuzuri_core::graph::build に索引と台帳と空の event log を渡して組み、memo_gate::memo_needs を FR1 と mb.2 の名指しで撃って集合で比べる。FR1 の名指しの集合の内訳は、索引の隣の A-1 と nx#a と nx#b、req の辺の隣の開いた mb.1 と mb.2（閉じた mb.3 は入らない）、2 段目の pointer の形の mb.4。mb.2 の名指しの集合は req の辺の隣の FR1（次数 6）と blocks の辺の隣の mb.1。

      歯の見本（kcbead.rs）。組み方は着地済みの kcode.rs に倣う（歯ごとの一時の根・git の一時の repo に a.rs と b.rs と規則の file と contracts/n1.toml・偽の構文で探す道具・fn shot で撃った後に根を消す）。n1.toml と stream は kcode.rs の TOML と STREAM と同じ字（行 a は a.rs と +c.rs と =b.rs・行 b は b.rs）。偽の bd は根の shell の script で、撃たれた引数を 1 行ずつ根の bd-args.txt に書き、根の ledger.json を出して rc を返す。ledger.json は cdbead.rs の kb.1 と kb.2 と同じ 2 本。tz code は --repo と --sg と --bd で撃つ。
      - 3 行は、file と b.rs と b.rs と 1 をタブで区切った行、def と b.rs#fn g と 1-1 をタブで区切った行、none と +d.rs をタブで区切った行。
      - 6 語は、--readonly と list と --all と --limit と 0 と --json（境界の BD_ARGS と同じ並び）。
      - rows 3 と writes 3 と unbound 2 の行は、語と数をタブで区切った行で、行は n1#a と n1#b と kb.1#t-one、辺は a.rs と b.rs と b.rs、file に当たらない項は +c.rs と +d.rs。
      - rows 2 の行は、偽の bd が rc 1 を返す時の rows と 2 をタブで区切った行（契約表の行だけ）。
      - def の 1 行は、def と b.rs#fn g と 1-1 をタブで区切った行。
      - 壊れた bead の見本は ledger.json の kb.1 の write-set の行の値を b.rs の JSON の字にした台帳。

      着地済みの kcode.rs の直し。tz code が台帳を読むので、偽の bd の無い見本の repo では台帳が読めず rc 2 になる（kcode_row_lists_defs_of_write_set_files_only と kcode_counts_and_file_lines と kcode_scratch_is_gone_after_the_shot の rc 0 の断言が落ちる）。fn place で根に空の配列の字を出す偽の bd を書き、fn tz で --bd にその path を渡す。断言の字は替えない（空の台帳は行を足さない）。kcode_unreadable_and_named_errors の 4 つの撃ちは引数の誤りと名指しの誤りのまま rc 1（台帳は読める）。

      done と verify の対応。1 つ目から 4 つ目の項は verify の 2 行目（cdbead.rs）、5 つ目から 9 つ目の項は 3 行目（kcbead.rs）が測る。10 個目の項は偽の bd を足した kcode.rs の歯が緑のまま、最後の項は read_write_sets を替えないことを着地済みの cdnode_ で測る。1 行目の clippy は書く 2 crate を -p で名指す。xtask の check は共通 verify が撃つので行の verify に書かない。

      照らした事（起草の時の main）。消す物と名を替える物は無い（足すだけ・read_write_sets と fn write_sets の契約表の読みは替えない）。fn gather の字を読む着地済みの歯は kcode.rs だけ（crates と xtask の .rs を tz code の口と graph::code の名で grep した 3 file のうち、ほかは中核の cdnode.rs と src）。tz code の USAGE を字で持つ歯は無い。数を pin する歯は動かない（定義の種類 11・kfold の群の表は module を足さないので替えない・段の file は中核 3 本と境界 12 本で、命令 kfold-cap は段の本数では落とさない）。src の file の大きさは graph/code.rs 368 行・cli/code.rs 224 行で、上限 1500 行の余地に収まる。接頭辞 cdbead_ と kcbead_ は契約表の verify の filter の語と部分の字で重ならない。

      依存。歯 cdbead_memo_needs_reach_bead_contracts の FR1 から mb.1 と mb.2 への拾いは、行 t-graph-bead の足す req の辺に頼るので、この行は行 t-graph-bead の着地の後に流す。graph/code.rs と cli/code.rs は行 t-graph-bead の write-set に無く、行 t-graph-bead の関数 contract_rows は使わない（write-set の字は着地済みの read_write_sets が [[contract]] の塊ごとに読む）。

      範囲の外。設計ノートの行の節点と契約表の導出物を読むのをやめること（退けの行）。memo の繋ぐ門の src（上の照らし）。tz context と board の契約の欄の表。
  - n: 39
    type: prose
    title: 行 v-bead-precheck — 事前審査と直しの束と memo の同梱の引き金が契約の bead も数える（memo t3-hub.92.7・作り直し v4 の段 S4・設計だけの行）
    body: |
      在りか。差の file は無い（設計だけの行・決め D2）。便は器の 7 file を書く。scribe2/crates/scribe2/src/pipe/dispatch/precheck.rs（母集団・祖先の walk・予想の口・周の鍵）を直し、scribe2/crates/scribe2/src/pipe/dispatch/bundle.rs の束の測り直しの argv を bead の契約で替え、scribe2/crates/scribe2/src/pipe/dispatch/memo.rs の開いた契約の write-set に bead の契約を足し、scribe2/crates/scribe2/src/pipe/review_ref.rs の祖先の層の口の呼び 1 行に引数 manifest を足し、scribe2/crates/scribe2/src/pipe/cli.rs の受付の re-export の列（pub(in crate::pipe) use intake の 1 行）に語 generated_from を足し、器の e2e の列の親 scribe2/crates/scribe2-boundary/tests/e2e/pipe/dispatch.rs に行 mod vbpre; の 1 行を足し（行 v-bead-dispatch が足す行 mod vbdisp; の次）、新しい子 module scribe2/crates/scribe2-boundary/tests/e2e/pipe/dispatch/vbpre.rs に e2e の歯を足す。lib の歯は precheck.rs の今の tests の module に足す。row_review.rs・review.rs・candidates.rs・受付の intake.rs と intake/bead.rs と preflight.rs と refuse.rs と共有の読みの pipe/bead.rs は替えない。

      なぜ。持ち主は判断の記録 ADR-72 の決定 (2)（決め D1）で契約の正本を台帳の bead に移すと決め、裁定 t3-hub.92.7.2 で、契約の行を bead の欄 acceptance に契約表の導出の形の [[contract]] の 1 行で置き、設計の節の本文を bead の本文（description）に置き、便の順を bead の blocks で持ち、上限と照らしを削らない形で bead の側へ移す形を承認した。今の事前審査の母集団（precheck.rs の関数 population）と祖先の walk（Walk::new）は acceptance の design = の行だけを読む（candidates.rs の pointer_of）。このままでは切り替えの後の新しい契約は全部が事前審査の母集団の外になり、依存を待つ bead の契約に予想が立たず、bead の契約を祖先に持つ行も、その祖先を見ないまま予想する（祖先の宣言の + の file を持たない誤った確定の finding が出る）。直しの束（bundle.rs）は事前審査の結果だけを束ねるので同じく bead の契約を拾わない。memo の同梱の引き金（memo.rs の関数 open_write_set）は開いた契約の write-set を設計 pointer の bead からだけ集めるので、bead の契約の write-set では満ちない。行 v-bead-dispatch は列の候補だけを bead で読み、この 3 つを範囲の外にした。決定はしご。要るか: 切り替えの前に埋めないと、事前審査と同梱の引き金が黙って新しい契約を見なくなる（削り）。既に在るか: bead の契約の生成と写しの書きは行 v-bead-intake の受付の bead の周の 1 本 bead_contract が持ち（列の行 v-bead-dispatch も同じ 1 本を呼ぶ）、受付の写しの pointer は今の Pointer に読め、table::read は絶対 path をそのまま読むので、行の鍵の型を替えずに bead の契約を同じ母集団に入れられる。この行は契約の生成も写しの書きも足さない。新しい待ちの理由・断りの名・event kind・結果の語は足さない。

      共有の口（行 v-bead-intake が持つ・この行は呼ぶだけ）。module crate::pipe::bead の form_of と Form（acceptance の形の判じ）・digest（acceptance と本文の 16 桁）・copy_path（置き場の bead-contracts の下の写しの path）・digest_of_design（契約の design の path が写しの形なら 16 桁）・copy_text（写しの全文）・copy_pointer（写しの絶対 path と井桁と行の id の Pointer・bead_contract の写しの pointer と同じ 1 本）と、後段 generated_from（行 v-pf-contract）と、受付の段の bead_contract(repo, state_dir, manifest, bead, issues, materials)（Design の形の bead は今の generated に回し、bead の形の bead は照らしの後に写しを copy_path に置き、後段 generated_from で契約と契約の file の字を組む）を呼ぶ。bead_contract は行 v-bead-dispatch が cli.rs の受付の re-export の列に足した語で引き、generated_from はこの行が同じ列に語を足して引く（cli の外で generated_from を最初に呼ぶのはこの行の memo.rs で、使われない pub(in crate::pipe) の use は器の clippy の -D warnings で unused_imports に落ちうるので、語は使う行が持つ）。

      形（鍵の選び）。比べた 3 つの形と失う物。
      - 鍵の型を替える（Row の pointer を設計 pointer か bead の id の列挙にする）。Walk・束の Hit・review_ref.rs の ancestry の引数・行の審査の記録の鍵の字の全部が替わり、L を越える。採らない。
      - bead の id を鍵の字にする（例 bead: と id）。parse_pointer が読めないので、束の toml_of と審査の材料 design_material と judge の中の行の読み直し pointed_row（どれも table::read で path を読む）が全部読めない。採らない。
      - 受付の写しの pointer を鍵にする（採る）。bead の契約の行の pointer を copy_pointer の値（写しの絶対 path と井桁と行の id）にする。鍵の字は bead の中身ごとに替わり（path に digest を持つ）、受付が便に書く契約の design と同じ字になる。写しの path は digest_of_design で見分ける。

      形（生成と写しの書き手は 1 本）。事前審査は bead の契約を bead_contract で組み、memo の引き金は写しを置かない純な道（copy_pointer と copy_text と generated_from）で組む。この行は契約の生成の関数も写しの書きの関数も足さない。bead_contract は受付と同じ照らしの後に写しの file を置く（在れば書かない）ので、judge の中の pointed_row と束の toml_of と design_material は、その写しを table::read で読む。照らし（byte の上限・契約 id の重なり・開いた本数）が断った bead は写しを持たず、その断りが予想の finding になる（受付も同じ断りで断る）。

      形（precheck.rs）。
      - 新しい関数 contract_of(state_dir, issue) は Option の Pointer を返す。pointer_of が設計 pointer を返す bead はその pointer（今の読みのまま・両方の形を持つ bead もこの道）。返さず form_of が Form::Bead の bead は copy_pointer が Ok の時だけその pointer。ほかは None。
      - population は filter_map の pointer_of の呼びを contract_of に替える（閉じた bead は今のまま入らない）。Row の型は替えない。
      - Walk に欄 manifest と欄 issues を足す。Walk::new は引数 manifest を受け、beads の map は、memo でも問いでもない全部の bead の pointer_of の行（今のまま）に、閉じていない bead の contract_of の写しの pointer の行を足す（閉じた bead の契約は到達に現れないので読まない）。
      - 関数 ancestry の引数に manifest を足す（state_dir の次）。呼び手は layers_of と review_ref.rs の judge_rows の 1 行（ctx.manifest を渡す）と precheck.rs の in-file の歯の 3 か所。
      - depends_of は、行の字に digest_of_design が Some を返す時、表を読まずに空の列を返す（bead の契約は欄 depends を持たず、順は blocks・row_of が depends の欄を断る）。
      - pending の便の無い祖先の生成は、rep(row) が bead を返す行は bead_contract(self.table, self.state_dir, self.manifest, bead, self.issues, 予想の材料) を、bead の無い表の行は今の generated を撃つ（Design の形の bead は bead_contract の中で今の generated に回るので、設計 pointer の行の値は替わらない）。
      - 新しい関数 forecast_by(table, manifest, base, ancestors, make) は今の forecast_findings の本文で、generated の呼びを引数 make（予想の材料から契約と契約の file の字か Denial を返す関数）の呼びにした形。forecast_findings は署名を替えず、make に今の generated を渡して forecast_by を呼ぶだけにする（review_ref.rs の forecast_findings の呼びは替えない）。judged は make に bead_contract(repo, state_dir, manifest, 行の bead, 周の issues, 予想の材料) を渡して forecast_by を呼ぶ。
      - words は、祖先の行の字に digest_of_design が Some を返す時、語の頭を bead の id と字 @ と 16 桁にする（祖先の bead の中身が替われば鍵が替わる）。設計 pointer の祖先の語は 1 字も替えない。
      - round は、依存待ちの行の pointer に digest_of_design が Some を返す時、鍵の字の末に字 copy: と 16 桁を足す。設計 pointer の行の鍵の字は 1 字も替えない（着地済みの結果の file はそのまま当たる）。

      形（bundle.rs）。body_of の測り直しの行 remeasure は、行の pointer の字に digest_of_design が Some を返す行だけ argv を NAME と pipe preflight --bead と bead の id と --repo と repo の path にする（行 v-bead-intake の preflight の bead の周・写しの path を --design に渡すと base の木を読み断られる）。Hit の型と row の行の pointer と toml と section の部は今の字のまま（写しを読む・写しの無い行は今の読めない旨の字）。

      形（memo.rs）。open_write_set の引数を（input, read）に替え、今の設計 pointer の bead の道はそのまま、form_of が Form::Bead の開いた bead（memo でも問いでもない）ごとに、写しを置かない純な道で契約を組んだ write-set を足す。pointer は copy_pointer(input.state_dir, bead, acceptance, 本文)、字は copy_text(bead, acceptance, 本文) で、契約は generated_from(input.repo, pointer, 字, materials)（どれかが Err の bead は write-set を持たない側に倒す・今の読めない行と同じ）。dispatch ls も同梱の引き金を組むので、見る側は書かない決まりを保つためにこの道は bead_contract を呼ばず、置き場に何も書かない（事前審査は起こす側の周だけで撃たれるので bead_contract のまま写しを置く）。triggers の呼び 1 つを合わせる。着地の引き金は替えない。持ち主の席の決めで着地の引き金の新しい形は足さず、bead の契約の着地は今の引き金 依存 <bead id>（ledger/trigger.rs の Trigger::Dependency・値の bead が閉じた時に満ちる・world の closed の列）で書く。この file は closed と closed_pointers の列を今のまま渡す。

      歯（vbpre.rs・接頭辞 vbpre_）。頭の //! の行に接頭辞と、親の helper を use super::*; で使うことを書き、続けて use super::*; と use vessel::fleet::json_lite; を置く（兄弟の waiting.rs と同じ形）。toy は repo_with_state と commit_rows で表の行を置く（行は row_fields に id と drop の字 write-set を渡し、add に write-set の 1 行を渡した欄の列）。見本の bead の契約は、row_fields に id と drop の字 write-set と section を渡し add に write-set の 1 行を渡した欄の列を、字 [[contract]] の行の後に改行で繋いだ字を acceptance に、字 本文。を本文に持つ。偽の台帳は fake_bd で書き、bead の 1 件は listed と同じ欄の並びに欄 description を足し、acceptance と本文を json_lite::quote で囲む helper を vbpre.rs に置く（受付の bead の周は台帳の全件を周の issues で受けるので、偽の bd は引数を読み飛ばして全件を返す今の形でよい）。rules は ceiling_rules の写しで、行 v-bead-intake の 3 本の rules 行は埋め込みの値のまま。memo の 1 件は waiting.rs の memo_of と同じ欄と本文の形の helper を vbpre.rs に置く（memo の歯の toy は .beads/config.yaml に接頭辞 s2 を書く）。hold と起こす側の 1 周は terminal.rs の hold と precheck_turn と同じ argv の helper を vbpre.rs に置く。結果の file は置き場の pipe/precheck/<bead>、束の file は pipe/precheck/bundle/ の下の . を名に持たない file、写しは置き場の bead-contracts/<bead>/ の下の file。各歯は終わりに clean で畳む。

      lib の歯（precheck.rs の tests の module・接頭辞 vbpre_）。今の helper open に欄 description を構造体の更新の形で足した Issue で contract_of を撃ち、置き場は Path::new の固い字にする（contract_of は写しを書かない）。

      done と verify の対応。1 つ目から 5 つ目の項は verify の 3 行目（e2e の歯 vbpre_）、6 つ目は 2 行目（lib の歯 vbpre_）、7 つ目は 4 行目、8 つ目は 5 行目、9 つ目は 6 行目、10 個目は 7 行目、最後の項は 8 行目（どれも着地済みの歯を 1 本ずつ代表に名指す）が測る。1 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので行の verify に書かない。

      大きさ。替える字の見込みは src が約 70 行（precheck.rs 約 55・bundle.rs 約 5・memo.rs 約 10・review_ref.rs 1 行・cli.rs 1 語）と歯が約 260 行で M。precheck.rs は 719 行、bundle.rs は 212 行、memo.rs は 265 行、review_ref.rs は 633 行で、上限の余地は足りる。

      順。行 v-bead-intake と行 v-bead-dispatch の後に置く。cli.rs の re-export の同じ 1 行を v-bead-dispatch の後に替える。この行の code は v-bead-intake の共有の口と bead_contract と preflight の bead の周を呼び、e2e の歯は v-bead-dispatch が着地させる列の bead の契約の待ち（依存の待ち）と親の行 mod vbdisp; の次に置くので並べられない。

      範囲の外。行の審査（review_ref.rs）は設計の PR の契約表の行だけを審査し、bead の契約を自分の行にしない（祖先の walk は同じ Walk を使うので、bead の契約を blocks の祖先に持つ表の行は、この行の着地からその祖先の宣言を重ねる）。両方の形を持つ bead は母集団では今の読みのまま設計 pointer の行に数え、予想は bead_contract が断りの語 contract-bead-both-forms で断る（列が同じ bead を待たせる断りと同じ語が finding になる）。台帳の形の判じと局面の出力は行 v-bead-ledger、受付と preflight の bead の読みと写しの書きは行 v-bead-intake、列の候補と列外の鍵は行 v-bead-dispatch。
  - n: 41
    type: prose
    title: 行 v-bead-reads-b — 置き場の全部の行を読む 3 つの口が契約の bead の行も読む（memo t3-hub.92.7・作り直し v4 の段 S4・設計だけの行）
    body: |
      在りか。差の file は無い（設計だけの行・決め D2）。器の lib の新しい子 module pipe/spawn/bead_rows.rs（台帳を読む材料 LedgerRead・読みの結果 Beads・関数 ledger_rows と bead_rows と merged と own_bead・cfg(test) の歯 3 本）を足し、pipe/spawn.rs（子 module の宣言・Launch の欄 ledger・関数 touches_section）、pipe/follow.rs（Runner の欄 ledger と Launch の組み立て）、Runner の組み立ての 3 つの場所 pipe/cli/run.rs と pipe/ratelimit.rs と pipe/cli/step.rs、pipe/cli/args.rs（pipe spawn の引数に --bd）、pipe/review/index.rs（表 Tables の関数 with_beads・関数 material と show・cfg(test) の歯 1 本）、pipe/cli/preflight.rs（関数 widen_lines の行の列）と、器の e2e の着地済みの module scribe2/crates/scribe2-boundary/tests/e2e/pipe/spawn.rs（歯 2 本）を書く。depends は v-bead-intake（その行の module crate::pipe::bead の form_of・row_of・COPY_DIR・digest_of_design を呼ぶ）と v-bead-reads（index.rs を同じく書き、その行が足す cfg(test) の module に歯を足す）。

      なぜ。持ち主は判断の記録 ADR-72 の決定 (2)（決め D1）で契約の正本を台帳の bead に移すと決め、裁定 t3-hub.92.7.2 で判断の記録の案 甲を承認した。その決定 (7) の字は、置き場の全部の行を読む口は bead の契約も読む、である。今の 3 つの口は便の base か審査の木の契約表の行だけを読む（V）。
      - 便の runner への節 ほかの行の touches（pipe/spawn.rs の touches_section が呼ぶ touches_rows と table_rows）
      - pipe preflight の閉包の広がりの予想（pipe/cli/preflight.rs の widen_lines が table_rows を借りる）
      - 審査の材料 index.txt と口 pipe index show の rows の列（pipe/review/index.rs の Tables::load と other_rows）
      切り替えの後は新しい契約が全部 bead に在るので、この行が無いと bead の契約の行の touches と write-set はほかの便の runner にも preflight にも審査役にも現れない。

      決定はしご。要るか: 決定 (7) の字。既に在るか: 台帳の読み（seat::ledger の read_ledger と timeout_of・待ちの上限の rules 行 seat.ledger_timeout_s）、契約の bead の判じと行の読み（v-bead-intake の form_of と row_of）、touches の束ね（touches_lines）、閉包の広がりの判じ（widen_lines の本体）、rows の列の数え（other_rows）を使う。新しい断りの語・rules 行・旗は足さない。

      形（bead_rows.rs）。
      - 構造体 LedgerRead（Clone と Copy・欄 bd は client の名の字・欄 timeout は Option の Duration）と関数 LedgerRead::of（--bd の値か無ければ DEFAULT_BD と、manifest の timeout_of）。
      - 列挙 Beads は 3 つ。Off（置き場に子 bead-contracts の dir が無く台帳を読まない）・Rows（契約の bead の行の列）・Unread（理由の字）。
      - 関数 bead_rows は Issue の列を受け、form_of が Bead か Both で row_of（bead の id・acceptance・description）が Ok の bead だけを、鍵を bead の id、touches と write-set を行の欄にした RowFacts の列にして bead の id の順で返す。閉じた bead も入れる（v-bead-intake の契約 id の重なりの母集団と同じ・表の行が着地した行も持つのと揃える）。
      - 関数 ledger_rows は置き場と repo と LedgerRead を受ける。置き場の子 COPY_DIR が dir でなければ台帳を読まずに Off。timeout が None なら Unread（理由は字 rules 行 seat.ledger_timeout_s が無い）。read_ledger（cwd は repo）の Err の Unreadable は Unread（理由は字『台帳を読めない』）、Timeout は Unread（理由は字 台帳の待ちの上限を越えた）。Ok なら bead_rows の Rows。
      - 関数 own_bead は design の字を受け、digest_of_design が Some の時だけ、井桁の前の path の親の dir の名（受付の写しの dir の bead の id）を返す。
      - 関数 merged は表の行の列と Beads と自分の design を受け、Rows なら own_bead の鍵の行を除いて表の行の後に足し、印は None。Unread なら表の行の列のままで印は Some の理由。Off は表の行の列と None。
      Off の訳: e2e の台帳の client の見張り（接頭辞 e2e_ledger_tripwire_ の歯・設計 gate-cost.md の 37 節）は、表の行の便の helper の 1 便が台帳の client を着地の close の 1 回しか起こさないことを pin する。写しの dir は v-bead-intake の受付が bead の周に初めて書くので、bead の契約を 1 度も受け付けていない置き場は台帳を読まず、今の決まりと歯を替えない。失う物: bead の契約が台帳に在っても、その置き場で bead の便を 1 度も受け付けるまでは 3 つの口に現れない（受付は列の 1 周で起きるので、切り替えの後の最初の bead の便の受付までの間）。

      形（3 つの口）。
      - spawn.rs。Launch に欄 ledger（LedgerRead）を足す。touches_section は table_rows の Ok の列を merged に ledger_rows（launch.state_dir・launch.repo・launch.ledger）と契約の design で通し、touches_lines の本文の後に、印が Some なら 1 行（全角の括弧の中に 契約の bead の行を読めない とコロンと空白と理由）を足す。table_rows の Err の周は今の理由の 1 行のまま。runner は止めない。
      - follow.rs。Runner に欄 ledger を足し、spawn_rounds の Launch の組み立てで runner.ledger を渡す。Runner の組み立ては run.rs の launch（LedgerRead::of に引数 --bd と manifest）、ratelimit.rs（同じ）、step.rs の land（terminal_input の bd と timeout_of）、follow.rs の cfg(test) の 2 つ（DEFAULT_BD と None）。args.rs は ALLOWED_SPAWN に TOOLS の --bd を足す（pipe run と resume の子は既に --bd を受ける・dispatch の tools が渡す）。
      - preflight.rs。関数 checked は置き場が在る周に ledger_rows（置き場・repo・引数 --bd と timeout_of の LedgerRead）を撃ち、widen_lines に渡す。widen_lines は table_rows の Ok の列を merged に通して同じ判じに掛け、印が Some なら並べた行の後に 1 行 widen=unmeasured:契約の bead の行を読めない（理由）を足す。置き場が無い周は Off。checked は one_read の区間の中なので、bead の周（v-bead-intake）が先に読んだ台帳の出力を同じ 1 回で分ける。
      - index.rs。審査の Review に欄を足さない（pipe/review.rs は上限の余地が 1 行で書けない・preflight の headroom）。審査の材料と口 show は台帳を既定の client（DEFAULT_BD）で読み、待ちの上限は、材料は埋め込みの rules（関数 assembled と同じ Manifest::embedded）、show は渡った manifest の timeout_of で読む（関数 LedgerRead::of に None と manifest）。Tables に関数 with_beads（self と RowFacts の列を受け、各行を pointer と鍵を bead の id、doc と section と goal を空、patch を None にした Line として lines の末に足す）を足す。material は Tables::load と v-bead-reads の with_copy の後に、merged に空の列と ledger_rows（置き場・repo・Review の ledger）と design を通した列を with_beads で足し、印が Some なら本文の頭に 1 行 index=partial:ledger を足す。show も同じく足す（審査の材料と show の --row の byte の等しさを保つ・どちらも台帳の既定の client で読む）。置き場の妥協: 列が --bd で別の client を名指した便でも、審査の材料は既定の client で読む（pipe/review/index.rs が既に埋め込みの rules を読むのと同じ形）。other_rows は替えない（pointer の比べで自分を除く・bead の行は own_bead で先に除いた）。

      偽の台帳（歯 5 つ目と 6 つ目の項）。client は着地済みの e2e の歯 e2e_ledger_tripwire_explicit_client_bypasses_the_tripwire と同じ形（置き場の json を cat する実行権つきの sh）で、--bd にその絶対 path を渡す。json は Issue の配列で、各要素は鍵 id・status・acceptance_criteria・description・dependencies（空）。契約の bead の acceptance は行 [[contract]] と、着地済みの助け row_fields の欄の行から section を落とした行（行 id と touches と write-set を替える）を改行で繋いだ字で、description は字 本文。。spawn の歯は bead s2-c（touches は crate::other::Shared の 1 つ）と design の行だけの bead s2-e（acceptance は design = docs/design/other.md井桁b1・井桁は記号）を置く。preflight の歯は bead s2-k（touches は crate::tint::Tint・write-set は crates/toy/src/other.rs）を置き、--rules は ceiling_rules の写しの末に e2e の助け with_ledger_row と同じ待ちの上限の行を足した file。

      lib の見本（歯 1 つ目から 4 つ目の項）。台帳の 4 つの bead の acceptance は、行 [[contract]] と v-bead-intake の lib の歯の見本の行の欄（section と goal と depends を持たない）を繋いだ字。s2-f は [[contract]] の行を 2 つ持つ（row_of が Err）。s2-g は status が closed。一時 dir は pipe::fixture の scratch（器の lib の歯の着地済みの助け）。在らない client の名は字 bd-gone（seat/ledger.rs の着地済みの歯と同じ）。

      歯（接頭辞 vbrb_）。bead_rows.rs の cfg(test) に vbrb_bead_rows_keep_only_readable_contract_beads・vbrb_ledger_rows_read_only_when_copies_exist・vbrb_merged_drops_own_bead_and_keeps_table_rows、index.rs の cfg(test)（v-bead-reads が足す module）に vbrb_index_other_rows_name_the_bead_row、e2e の spawn.rs に vbrb_spawn_touches_list_the_contract_bead_row（toy は着地済みの助け touches_intake と touches_spawn_stdin と touches_body・spawn の撃ちに --bd を足す）と vbrb_preflight_widen_names_the_contract_bead_row（toy は widen_doc と widen_own と widen_h と derive_repo_with・widen_preflight の引数に --bd を足した撃ち）。

      done と verify の対応。1 つ目から 4 つ目の項は verify の 2 行目、5 つ目と 6 つ目は 3 行目、7 つ目は 4 行目から 6 行目が測る。1 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので書かない。消す物と名を替える物は無い（touches_lines・table_rows・other_rows の名と形を替えない・Runner と Launch と Review は欄を足すだけで、組み立ての場所は上の全部・grep で数えた）。数を pin する歯（台帳の client の見張りの 1 回・index.txt と show の byte の等しさ）は Off の決めで動かない。e2e の pipe.rs と pipe/dispatch.rs は見張りの歯の在りかで書かない（= の項）。

      範囲の外。台帳を読まない置き場の口（列の外の pipe contracts check ほか）、着地の trailer の値（行 v-bead-trailer）、hook/live_row.rs（席の決め）。
  - n: 42
    type: prose
    title: 行 v-bead-trailer — 写しの便の契約の trailer に置き場の path を書かず bead の id と行の id を書く（memo t3-hub.92.7・作り直し v4 の段 S4・設計だけの行）
    body: |
      在りか。差の file は無い（設計だけの行・決め D2）。器の lib の pipe/land/finish.rs（関数 squash_message）、pipe/land.rs（cfg(test) の歯 1 本）、fleet/lifecycle_mark/commits.rs（関数 bead_of と cfg(test) の歯 1 本）を書く。depends は v-bead-intake（module crate::pipe::bead の digest_of_design と form_of を呼ぶ）。

      なぜ。着地の squash の commit の契約の trailer（器の名の trailer の key で、語幹は Contract）の値は、今は契約の design の字そのままである（V・finish.rs の squash_message）。裁定 t3-hub.92.7.2 の形では bead の便の design は受付の写しの絶対 path で、置き場の path は利用者の home の dir の名を含む。main の commit は公開の repo の履歴なので、口座と host と home の名を書かない決まり（席の作法 D-4）に当たる。またこの trailer を読む器の口 commits.rs の bead_of は、acceptance の design の行の字と trailer の値を比べて bead を引くので、bead の契約の便の commit から bead を引けない。

      読む口と書く口の数え（V・grep の語は contract_key と CONTRACT_TRAILER と Contract とコロン）。書く口は finish.rs の squash_message の 1 つ。読む口は fleet/lifecycle_mark/commits.rs の commit_of（契約の trailer を bead_of で bead の id へ引く）の 1 つ。ほかの当たりは歯の見本（land.rs の tests と fleet/lifecycle.rs の tests）と key の定義だけ。xtask の provenance.rs と hook/merge_gate.rs と pipe/land/detection.rs は run の trailer と発端の trailer だけを読む。tsuzuri の crate と plugin の script に読む口は無い。器の外の RTM（別の repo）は trailer を読むが、bead の便の値は bead の id と行の id で、表の pointer の形でない（範囲の外・その repo で bead の id の形を読む要がある）。

      決定はしご。要るか: 公開の履歴に置き場の path を書かない決まりと、局面の出力が着地の commit から bead を引く読み。既に在るか: 写しの判じ（v-bead-intake の digest_of_design）、形の判じ（form_of）、trailer の key（contract_key）を使い、新しい trailer の語幹・旗・rules 行を足さない。

      形（finish.rs）。squash_message は、digest_of_design が契約の design に Some を返す周は、trailer の値を bead の字と井桁と design の井桁の後の行の id を繋いだ字（例 s2-b井桁b・井桁は記号）にする。ほかの周は今の design の字のまま。値に置き場の path も口座も host も入らない。

      形（commits.rs）。bead_of は、値を最後の井桁で割った前の字と同じ id を持ち、form_of が Bead か Both の bead（acceptance が行 [[contract]] を持つ bead）が台帳に在ればその bead を返す。無ければ今の比べ（acceptance の design の行の字と値）のまま。表の pointer の前の字は doc の path で、bead の id と同じ字にならない（doc の path は拡張子を持つ file）。

      歯（接頭辞 vbtr_）。land.rs の cfg(test) に vbtr_squash_message_names_the_bead_for_a_copy_contract（契約は着地済みの歯 pipe_land_subject_keeps_multiline_goal_verbatim_in_body と同じ pipe::fixture の contract で組み、design だけを替える）。commits.rs の cfg(test) に vbtr_commit_reads_the_bead_trailer（record は着地済みの助け record と sha、台帳の Issue は着地済みの歯 vadopt_binds_the_named_bead_only_to_a_commit_without_trailers と同じ組み方で acceptance だけを替える）。

      done と verify の対応。1 つ目と 2 つ目の項は verify の 2 行目、3 つ目は 3 行目と 4 行目が測る。1 行目の clippy は done に載せない守り。xtask の check は書かない。消す物と名を替える物は無い。数を pin する歯は動かない。

      範囲の外。着地済みの commit の trailer は書き換えない（この行の着地の前の bead の便は S4 の切り替えの前なので在らない見込み・I）。
