      なぜ。持ち主は作り直し v4 で、作業の状態（計画・次の手・優先・未決）を台帳の作業中の bead の notes の定型の行に置き、器が圧縮の後の文脈の欄 [RECENT-WIP] にその行を出すと決めた（決め D5・判断の記録 ADR-72 の決定 (6)・段の memo t3-hub.92.5）。今の [RECENT-WIP] は id と更新時刻と題だけで、計画の中身は圧縮の要約と席の記憶に任されている。決定はしご。要るか: 圧縮の後に席が持つのは最後の発言 1 つと題の行だけで、計画が失われる（ADR-72 の背景・V）。既に在るか: 欄 [RECENT-WIP] と台帳の 1 回の読みと畳みの関数 fold が在り、出す行を足すだけにする。新しい子 process も新しい読みも足さない。

      形（recent.rs）。
      - 構造体 Bead に欄 notes（String・doc は notes の字・無いか字でなければ空）を足す。beads_of は要素の鍵 notes を Tree::as_str で読み、無い時と字でない時は空の字にする（id と status の必須は今のまま）。
      - 定数を 3 つ足す。MARKER_WIP_LINE（字 [RECENT-WIP-LINE]・doc は作業中の bead の定型の行の行頭の印）、WIP_HEADS（型 [&str; 4]・字 計画: と 次の手: と 優先: と 未決: をこの順・doc は定型の行の頭で出す順）、WIP_LINE_WIDTH（usize・200・doc は定型の行の字を切る幅〔文字〕）。Kind と KINDS は替えない（定型の行は [RECENT-WIP] の種類の続きで、新しい種類でない）。
      - 関数 fold は幅を受ける関数 fold_to（字と幅）を呼ぶ形に割り、fold は fold_to に TITLE_WIDTH を渡すだけにする（今の fold の字と歯は替えない）。
      - 関数 wip_state（notes の字を受け、頭と字の組の列を返す・pure）を足す。WIP_HEADS の順に、notes の行のうち頭の空白を落とした字がその頭で始まる行の最後の 1 行を選び、頭の後の字の両端の空白を落とし、空でなければ fold_to で WIP_LINE_WIDTH に畳んで組にする。4 つの頭の外の行は読まない。頭は字の一致だけで見る（全角の ： は頭でない）。
