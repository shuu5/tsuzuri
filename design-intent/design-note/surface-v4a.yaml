      - 今の歯（接頭辞 agsg_lacks_ と agsg_hook_ の歯）の本文は替えない。

      done と verify の対応。1 番目から 3 番目の項は verify の 2 行目（群 teeth6 の歯 agsg_）、4 番目の項は 3 行目（群 teeth6 の歯 agpl_・歯 agpl_hooks_bind_the_five_agent_mouths_once の本文は替えず、助け wanted の 1 字だけを替える）が、5 番目の項は 4 行目（歯の file agshp.rs の歯 agshp_・見本の swap の字だけを替える）が測る。1 行目の clippy は done に載せない守り（消した子 module の残りの use と死んだ助けを落とす）。xtask の check は器の共通 verify が撃つので verify に書かない。入口の赤は 2 行目（main では足す歯が落ちる）。

