    title: 行 t-prose-bead — 1 つの file に散文の門を撃つ口と、契約の bead の本文に撃つ起票の門と係の終える前の門（memo t3-hub.92.7・作り直し v4 の段 S4・設計だけの行）
    body: |
      在りか。差の file は無い（設計だけの行・決め D2）。便は 9 file を書き、4 file を置き場だけで名指す。folio の folio2/crates/folio/src/entry.rs と src/prose.rs、中核の crates/tsuzuri-core/src/lib.rs（pub mod の 1 行）と新しい src/contract_gate.rs、境界の crates/tsuzuri-boundary/src/hook/question_gate.rs と hook/subagent_stop.rs（子 module の宣言と呼びの 2 行と doc の 1 行）と新しい子 module hook/subagent_stop/prose.rs、新しい歯の段の file crates/tsuzuri-boundary/tests/tprsb.rs（接頭辞 tprsb_）。着地済みの歯の file mlnk.rs・teeth3/qgate.rs・teeth6/agsg.rs・folio の tests/tz4/prose.rs は書かず、verify の 3 行目から 6 行目が撃つので置き場だけで名指す。規則の表・plugin/hooks/hooks.json・群の main.rs・kfold の表・tz の口の名の表（crates/tsuzuri-boundary/src/cli/folio.rs の NAMES・11 の名）は書かない。

      なぜ。判断の記録 ADR-72 の決定 (2) と裁定 t3-hub.92.7.2（memo t3-hub.92.7）は、便の契約を台帳の bead に置き、欄 acceptance に契約表の導出の形の [[contract]] の行を、本文 description に設計の節の本文を置くと決めた。今の散文の門（規則の行 R-16）は folio の床が設計ノートの型 prose の節の body にだけ撃つ（folio2/crates/folio/src/note.rs の 103 行から 106 行で規則の表から門を組み、822 行から 836 行で節ごとに prose::scan を撃つ）ので、bead の本文には誰も撃たない。この行は 1 つの file の字に同じ門を撃つ口を足し、契約の bead を書く台帳の書きの門（起票の門・規則の行 R-39 と同じ hook）と係の終える前の門がその口を撃つ。決定はしご。要るか: 切り替えの後は設計ノートの節が無くなり、散文の門の母集団が bead の本文へ移る。既に在るか: 門の読みと走査は prose.rs の gate と scan が持ち、hook の入力の分け方は中核の gate.rs の segments・PROGRAMS・deny_json が持つので、足すのは file を読む口と契約の書きの見分けと答えの字だけ。

      1 口。folio の口 check に旗 --prose（値は file の path）を足す。tz check は folio の口を同じ引数で撃つので tz の口の名の数は替わらない。旗は check の今の 8 つの旗（emit_amends・freeze_anchor・freeze_ids・freeze_start・freeze_adrs・emit_rulings・proposed・polarity）と conflicts_with_all で混ぜない。撃つ形は tz check --dir <設計文書の dir> --prose <file>。prose.rs に関数 file_gate（dir と path を受け、dir の rules.yaml を crate の yaml::parse で読んで prose::gate で門を組み、file の字を prose::scan に渡して印を持つ文の列を返す・読めなければ Err）を足し、entry.rs の dispatch の Check の腕に 1 つ足す。読むのは規則の表 1 file と名指した file だけで、憲法・要件書・設計ノートは読まない（参照 id の実在は見ず、行 R-16 の 2 つの理由だけを数える）。
      出力は標準出力。印を持つ文のうち理由の在る文ごとに 1 行で、字は <file の path（引数の字のまま）>: 行 <1 始まりの行番号>: <理由の語> <文の頭 60 字>（理由の語は prose.rs の no-pointer か number-with-unit）。最後に要約の 1 行で、違反 0 なら字『folio check --prose: 合格（』、1 つ以上なら字『folio check --prose: 不合格（』に、印を持つ文 <M>・違反 <N>） を続ける。rc は違反 0 で 0、1 つ以上で 1。
      まだ分からない（rc 2）。規則の表が読めない・行 R-16 の value が読めない（prose::gate の Err）・file が無いか file でないか UTF-8 でない時は、entry.rs の UNKNOWN_HEAD の字に理由を続けた 1 行と、要約の 1 行の字『folio check --prose: まだ分からない』を書いて 2。

      2 契約の書きの見分け（中核の contract_gate.rs・file も子 process も時計も触らない）。関数 writes は PreToolUse の hook の入力（Bash の command）を gate.rs の segments で一続きに分け、頭の代入の語の後の program が bd か bdw（gate.rs の PROGRAMS）で語 create か update を持つ一続きのうち、次の 2 つを command の順に拾う。
      甲（契約の書き）。欄 acceptance の値（--acceptance 値 か --acceptance=値・何度在っても最後の値）の行のうち、前後の空白を落とした字が [[contract]] の行を 1 つ以上持つ一続き。
      乙（本文だけの直し）。語 update を持ち、--acceptance を持たず、本文の旗（--body-file・--description・-d・--stdin とその =値 の形）を 1 つ以上持つ一続き。語 update の後の - で始まらない語を名指しの id として持つ。
      本文の形。--body-file の値（最後の値）が / で始まる絶対 path なら file、--body-file の値が - か相対 path の時と --description・-d・--stdin の時は file でない形、本文の旗が無ければ無し。
      契約の bead の見分け。台帳の bead のうち、欄 acceptance の行に前後の空白を落とした字が [[contract]] の行を持つもの（甲の字と同じ判じ・台帳の字は graph::build の read_ledger で読む）。

      3 判じ（関数 judge・下書きを command の順に判じて最初に通さない答え）。甲で本文が file でない形か無しなら止める（contract-body-form）。甲で本文が file なら、呼び手が渡す撃ちの関数（file の path を受けて rc と標準出力の字を返す）を撃ち、rc 1 なら止める（contract-prose・標準出力の違反の行を答えに写す）、rc 0 と 1 のほかは まだ分からない（contract-prose-unknown）、rc 0 なら次へ。乙は、名指しの id のどれかが台帳の契約の bead なら止め（contract-body-form・acceptance と本文を 1 つの命令で書き直させる）、台帳の字が空か読めなければ まだ分からない（contract-ledger-unread）、契約の bead が無ければ通す。
      理由の閉じた 4 語は ContractWhy の ALL の順に contract-body-form・contract-prose・contract-prose-unknown・contract-ledger-unread。関数 output は通す時に None、止める時は字『契約の本文の散文の門は止める（』、まだ分からない時は字『契約の本文の散文の門は まだ分からない（』に、理由の語と閉じ括弧と、在れば違反の行を「 / 」で繋いだ字と、字 次の一手 = と次の一手の 1 文を続け、gate.rs の deny_json で PreToolUse の deny の JSON にする。次の一手は contract-body-form で、契約の行の --acceptance と本文の --body-file の絶対 path を 1 つの bd update に並べて書き直す。contract-prose で、本文の印を持つ文に参照 id を足すか参照 id の外の数と単位を外して書き直す。ほかの 2 語で、規則の表と台帳が読めるようになってから書き直す。

      4 起票の門（境界の hook/question_gate.rs）。関数 answer は短い題の門（gate::short_gate）の後、問いと memo の下書きの前に、contract_gate::writes が拾った一続きを判じる。撃ちの関数は folio の入口 ::folio::entry::run を命令の名 tz と引数 check --dir <repo>/design-intent --prose <file> で、標準出力と標準エラーを Vec の buffer に受けて撃つ（cli/folio.rs の run と同じ入口・子 process は撃たない）。台帳は乙の一続きが在る時だけ server::ledger の Source で 1 度読む（甲だけなら bd を撃たない・設計の索引は読まない）。止める答えと まだ分からない答えは 1 行を標準出力に書いて rc 0（今の門と同じ）。契約の書きの無い payload の答えは今のまま。行 t-plan-cap が着地済みなら、その判じの前に置く（どちらも answer の中の別の呼びの塊・交わりは器が順に流す）。

      5 係の終える前の門（境界の hook/subagent_stop.rs と子 module hook/subagent_stop/prose.rs）。関数 run は、行 t-stop-preflight の契約の file の欠けの足しの後に、子 module の関数 holes の欠けを足す。holes は出力の dir の子 contract の直下の名の末が .md の file（設計係が bead の本文として bd update --body-file に渡す file・子の dir と .md でない file は見ない）を名の順に、4 と同じ入口で撃ち、rc 1 の file に欠けの字『契約の本文 <path> が散文の門で落ちる（<違反の行を「 / 」で繋いだ字>）』を、rc 0 と 1 のほかの file に欠けの字『契約の本文 <path> の散文の門が まだ分からない（<標準出力の字>）』を足す。設計文書の dir は口の --repo の値の下の design-intent。.md の file が無ければ規則の表を読まない。着地済みの歯 tests/tspf.rs の tspf_no_contract_file_fires_nothing は、子 contract に memo.md だけを置き規則の表の無い見本で rc 0 を求めるので、この行の後は まだ分からない の欠けで落ちる。だから tspf.rs をこの行が書き、その歯の memo の見本に design-intent の規則の表（行 R-16 を持つ rules.yaml・tprsb.rs の見本と同じ組み）を置いて memo.md の字を散文の門が通る字にし、rc 0 と偽の scribe2 を撃たない（calls.txt が無い）断言は残す（まだ分からない を欠けにする決めは替えない・便 t3-hub.92.7.11 の問いの答え）。欠けの止め（1 度目の終わりは rc 2・2 度目は STOP-GATE.txt に書いて通す）は今の lacks と hold と GATE の道のまま。

      depends。行 t-stop-preflight は subagent_stop.rs の関数 run に契約の file の欠けの呼びと子 module の宣言を足すので、この行はその着地の後の run に呼びを足す（並べると同じ行が当たる）。

      歯（tprsb.rs・作業場は CARGO_TARGET_TMPDIR の下の tprsb/<歯の名>）。toy の設計文書の dir は rules.yaml の 1 file で、節 thresholds に行 R-16 の value を main の rules.yaml と同じ字で写した行を置く。見本の本文の file は 7 行で、印 M は規則の行 R-16 の value の marks の 1 つ目の字。1 行目は 条 P-28.2 のとおり席は記帳 と M と句点。2 行目は 席は記帳 と M と句点。3 行目は 条 P-28.2 のとおり席は 3 本を記帳 と M と句点。4 行目と 6 行目は code fence の印の行で、5 行目は 2 行目と同じ文。7 行目は頭が縦線の表の行で、中身は 2 行目と同じ文。口の歯の偽の bd と偽の設計の道具は mlnk.rs の Place と同じ組み方（撃たれた引数を記録の file に 1 行足して作業場の字を出す script）で、payload の create には短い題の門を通す metadata の short を持たせる。係の終える前の門の歯は teeth6/agsg.rs の whole と同じ組み方（札・係の記録・出力の dir・--drafts）に、出力の dir の子 contract と口の --repo の toy の repo を足す。振る舞いで測れる口だけなので、source の字を照らす歯は足さない。
  - n: 35
    type: prose
    title: 行 t-plan-cap — 起票の門が開いた計画の memo の本数を数えて上限を越える書きを止める（memo t3-hub.92.7・作り直し v4 の段 S4・設計だけの行）
    body: |
      在りか。差の file は無い（設計だけの行・決め D2）。便は 4 file を書き、3 file を置き場だけで名指す。中核の crates/tsuzuri-core/src/lib.rs（pub mod の 1 行）と新しい src/plan_cap.rs、境界の crates/tsuzuri-boundary/src/hook/question_gate.rs、新しい歯の段の file crates/tsuzuri-boundary/tests/tplcap.rs（接頭辞 tplcap_）。着地済みの歯の file mlnk.rs・teeth3/qgate.rs・teeth5/shrtb.rs は書かず、verify の 3 行目から 5 行目が撃つので置き場だけで名指す。規則の表・folio・graph の module・群の main.rs・kfold の表は書かない。

      なぜ。裁定 t3-hub.92.7.2（memo t3-hub.92.7）で、契約になる前の計画は、切り替えの後に設計ノートの計画だけの行（規則の行 R-33 の上限）でなく memo の bead に置き、開いた計画の memo の本数の上限（推奨の値 4 本）を起票の門が数えると決まった。今の起票の門（tz hook question-gate・規則の行 R-39）は短い題と問いと memo の繋ぐ門を持つが、本数は数えない（crates/tsuzuri-boundary/src/hook/question_gate.rs の関数 answer）。決定はしご。要るか: 計画だけの行の上限が守っていた積もりの止めを、ノートの退けの後も残す。既に在るか: 台帳の読みとグラフの組みと bead の label と開きの判じ（graph の BeadAttr の labels と is_open・crates/tsuzuri-core/src/graph/mod.rs の 85 行から 100 行）と hook の入力の分け方（gate.rs の segments・PROGRAMS・label_values・deny_json）が在るので、足すのは印の数えと値の読みと答えの字だけ。

      1 計画の印（この行が決める形）。計画の memo は label memo:plan を持つ bead で、席は label intake:memo と並べて起票の時に置く。数えるのは台帳の bead のうち label memo:plan を持ち、BeadAttr の is_open が真の物（状態が closed でも tombstone でもない・種類を問わない）。印を label にしたのは、今の BeadAttr が label を持ち、bd の一覧の読みで数えられ、新しい欄の読みを足さないため。metadata に置く形は BeadAttr に欄を足すので、行 t-graph-bead が書く graph の file と交わり、採らない。

      2 値の読み。境界は口の --repo の値の下の design-intent/rules.yaml の字を読み（読めなければ Err）、中核の関数 cap に渡す。cap は字の行のうち、前後の空白を落とした頭が、字 - と空白と字 {id: と空白と定数 CAP_ROW と読点の , を繋いだ字の行がちょうど 1 本の時だけ、その行の欄 value の引用符の中の字を読み、<0 以上の整数> 本 以下 の形ならその整数を返し、ほかは Err（行が無い・2 本以上・value が無い・形が違う）。定数 CAP_ROW の字は、切り替えの設計の commit が規則の表に足す開いた計画の memo の本数の上限の行の id で、頭の字 R と字 - と数 45 を繋いだ 4 字。その行は 1 行の流れの形で、value に 4 本 以下 を持つ（切り替えの commit の差の字）。

      3 値の行が無い間（切り替えの前）の振る舞い。cap が Err の時、印の在る書き（4 の足す一続き）は まだ分からない（plan-cap-unread）で止まり、印の無い書きと、短い題・問い・memo の門の答えは替わらない。規則の行 R-33 は読まない。R-33 は設計ノートの計画だけの行という別の母集団を単位 行 で数え、計画の行を契約の行へ移すたびに値を下げる行なので、読むと memo の上限が設計ノートの直しで黙って動く。切り替えの前の計画は設計ノートの計画だけの行に置くので、印の在る memo を止めても失う仕事は無い。この振る舞いは数えを外す旗でも一度だけの口でもなく、値が読めない間は止める側に倒れる常の口で、条 N-3.1 の例外の機構に当たらない。切り替えの commit が上限の行を足した時から、同じ code が値を読んで数える。

      4 数える一続き（関数 opens・gate.rs の segments と PROGRAMS で bd か bdw の一続きを command の順に拾う）。
      印の起票。語 create を持ち、label の旗（gate.rs の label_values の 7 形）の値のコンマの項に memo:plan を持つ一続きは 1 本足す。
      継ぐ起票。語 create を持ち、label に印が無く、--parent の値（--parent 値 か --parent=値）が台帳で label memo:plan を持つ bead の id で、語 --no-inherit-labels を持たない一続きは、bd が親の label を子に継ぐので 1 本足す。
      起こし直し。語 reopen を持つ一続きと、語 update を持ち --status の値（--status 値 か --status=値）が closed でない一続きは、語のうち台帳で label memo:plan を持ち開いていない bead の id ごとに 1 本足す（同じ id は 1 度）。
      後からの印。語 update の --add-label か --set-labels の値（=値 の形も）のコンマの項、語 label と語 add を持つ一続きの語、語 tag を持つ一続きの語に memo:plan が在れば、本数を問わず止める（plan-late-label・印は起票の時だけ置く）。
      語 list・show ほかの読みの一続きと、label を外す旗は数えない。

      5 判じ（関数 judge）。後からの印が 1 つでも在れば止める（plan-late-label）。足す本数が 0 なら通す（値を読まない）。足す本数が 1 以上で、cap が Err か台帳が読めない（gate.rs の unread_sources が ledger を持つ）なら まだ分からない（plan-cap-unread）。開いた計画の memo の本数と足す本数の和が値を越えれば止め（plan-cap）、値以下なら通す。
      理由の閉じた 3 語は PlanWhy の ALL の順に plan-cap・plan-late-label・plan-cap-unread。関数 output は通す時に None、止める時は字『計画の memo の上限の門は止める（』、まだ分からない時は字『計画の memo の上限の門は まだ分からない（』に、理由の語と閉じ括弧を続け、plan-cap では空白と字『開いた計画の memo 4・足す 1・上限 4』と同じ形の数の字（開いた本数・足す本数・値）を続け、字 次の一手 = と次の一手の 1 文を続けて gate.rs の deny_json で PreToolUse の deny の JSON にする。次の一手は plan-cap で、済んだ計画の memo を閉じるか契約の bead へ移してから置き直す。plan-late-label で、印 memo:plan は起票の時に label で置き、後から足さない。plan-cap-unread で、規則の表の上限の行と台帳が読めるようになってから置き直す。

      6 起票の門。question_gate.rs の関数 answer は、短い題の門の後で、問いと memo の下書きの前に plan_cap::opens を拾い、在ればグラフを 1 度だけ組み（問いと memo の門と同じグラフを分け合う）、規則の表の字を読んで judge を撃つ。止める答えと まだ分からない答えは 1 行を標準出力に書いて rc 0。opens が空の payload の答えは今のまま。行 t-prose-bead が着地済みなら、その契約の書きの判じの後に置く（どちらも answer の中の別の呼びの塊・交わりは器が順に流すので depends は書かない）。

      歯（tplcap.rs・作業場は CARGO_TARGET_TMPDIR の下の tplcap/<歯の名>）。純関数の歯は fixture の字から中核の graph::build でグラフを組んで plan_cap の関数を直に撃つ（mlnk.rs と同じ組み方）。台帳の fixture は label memo:plan を持つ開いた bead 4 本（fx-p.1 から fx-p.4）、同じ label の閉じた bead fx-p.5、印の無い開いた memo fx-p.6、閉じた task fx-p.7 で、3 本の台帳は fx-p.4 を閉じた物。口の歯の toy の repo は design-intent/rules.yaml に節 thresholds と CAP_ROW の 1 行（value 4 本 以下）を置き、偽の bd と偽の設計の道具は mlnk.rs の Place と同じ組み方で、payload の create には短い題の門を通す metadata の short を持たせる。振る舞いで測れる口だけなので、source の字を照らす歯は足さない。
  - n: 37
    type: prose
    title: 行 v-bead-reads — 便の契約の pointer が受付の写しの時、base の木から読む口が写しを直に読む（memo t3-hub.92.7・作り直し v4 の段 S4・設計だけの行）
    body: |
      在りか。差の file は無い（設計だけの行・決め D2）。便は 4 file を書く。器の lib の pipe/gate/verify.rs（約束の名の読みを関数 promised_in に割り、写しの周を足す・歯 1 本）、pipe/review/index.rs（表 Tables に関数 with_copy を足し、審査の材料の関数 material が写しの行を引く・cfg(test) の module と歯 1 本を足す）、pipe/cli/resume.rs（関数 refresh_contract の写しの周）と、器の e2e の着地済みの module scribe2/crates/scribe2-boundary/tests/e2e/pipe/spawn/question.rs（歯 1 本）。depends は v-bead-intake（その行の module crate::pipe::bead の関数 digest_of_design を呼ぶ）。pipe/cli/intake.rs は書かない（今の余地 15 行を行 v-pf-contract の 12 行と v-bead-intake の 3 行が使い切る・preflight の headroom）。

      なぜ。持ち主は判断の記録 ADR-72 の決定 (2)（決め D1）で契約の正本を台帳の bead に移すと決め、裁定 t3-hub.92.7.2 で、器の受付が便を起こす時に bead を 1 回読み、本文を goal に足した 1 行の toml を置き場に写し、契約の pointer をその写しの絶対 path にする形を承認した（行 v-bead-intake・節 30）。その決めの字は、審査の材料と裁定の照らしと行の読み直しは今の table::read の 1 本で写しを読み、写しの後に bead が替わっても走っている便の契約は替わらない、である。table::read は repo の path に pointer の path を join して読むので、絶対 path の写しをそのまま読む（V・pipe/table/check.rs の 765 行から 767 行）。審査の材料（pipe/review.rs の design_text と promise_rows）、裁定の照らし（pipe/cli/intake/ruling.rs の section_of）、依存の塊（pipe/review/outside.rs）、兄弟（pipe/review/outside/linked.rs）はこの読みなので替えない。ところが次の 3 つの口は写しを読めない（V）。
      - gate の約束の名（pipe/gate/verify.rs の promised_names）は、git show に便の base とコロンと pointer の path を繋いだ字を渡して読む。git は repo の外の絶対 path を rc 128 で断る（写しの repo で撃って見た）ので、関数 head_tree が Err を返し、write-set の段が rc -1 になり、bead の契約の便の gate は全部落ちる。
      - 審査の材料の索引 index.txt（pipe/review/index.rs の material）は、審査の木の契約表の行だけを持つ表 Tables から pointer の字で行を引く（関数 row_items）。写しの pointer は表に無いので、材料は字 index=unavailable:row の 1 行になり、審査役は touches と節の名指しの項目の数えを失う。
      - resume の契約の取り直し（pipe/cli/resume.rs の関数 refresh_contract が呼ぶ pipe/cli/intake.rs の regenerated）は関数 generated を呼び、generated は pointer の path を置き場の宣言で照らして置き場の外を断りの語 contract-table（TableError の PlaceOutside）で断り、照らしを通っても show_head（HEAD の木の git show）で読む。写しの便の resume は取り直しで落ち、問いに答えた後の便が起き直らない。

      決定はしご。要るか: 切り替えの後は新しい便の pointer が全部写しなので、3 つの口が要る。既に在るか: 写しの形の判じ（行 v-bead-intake の digest_of_design）、file の読み（table::read）、行と約束の読み（table::read_table と table::promises_of）、を使い、新しい判定・旗・断りの語・rules 行を足さない。

      形（verify.rs）。関数 promised_names の本体を、worktree と base と design の字を受ける関数 promised_in に移し、promised_names はそれを呼ぶ 1 行にする（名も形も残す）。promised_in は、design が pointer でなければ今のとおり空の列。digest_of_design が design に Some を返す周は、table::read に worktree と pointer の path を渡して写しを直に読み、読めない周は table::read の理由の字の Err。ほかの周は今の git show の読みのまま（理由の字を便の base から読めない、を替えない）。読んだ字からの read_table と promises_of と + の名の抜きは 2 つの周で同じ 1 本を通す。写しは中身で名が決まる（v-bead-intake の copy_path）ので、base の木の代わりに写しを読んでも受付が読んだ行と同じ字を読む。写しの約束の行は bead の acceptance が [[promise]] の行を持つ時だけ在り、無ければ空の列で、今の約束の行を持たない行と同じ扱いになる。

      形（index.rs）。表 Tables に関数 with_copy（self と repo と design を受けて Self を返す）を足す。digest_of_design が design に Some を返し、table::parse_pointer が解け、table::read と read_table で写しを読めた周は、写しの行のうち pointer の行 id の行を、pointer を design の字、doc を写しの path にした Line として lines の末に足し、docs に写しの path と字を足す。ほかの周は表を替えずに返す（行を引けない事は今のとおり row_items の Err が字 index=unavailable:row にする）。material は Tables::load の Ok の値に with_copy を 1 度掛けてから row_items を撃つ。ほかの行の数え（関数 other_rows）は自分の pointer を除くので、写しの行を rows の列に入れない。

      形（resume.rs）。関数 refresh_contract は、契約 file を読んだ後、digest_of_design が契約の design に Some を返す周は取り直しを撃たずに Ok(false) を返す（写しを書かず記帳しない・判定行に字 contract=refreshed を出さない）。ほかの周は今のまま regenerated を呼ぶ。訳: 写しは中身で名が決まり、裁定 t3-hub.92.7.2 の決めの字のとおり走っている便の契約は受付の写しから替わらない。問いの答えで契約を替える道は bead を直す事で、列が digest の替わりで新しい便を起こす（行 v-bead-dispatch の列外の鍵）。表の行の便の取り直し（doc の行を直して commit し resume で拾う）は替えない。失う物: 写しの便の resume は HEAD の木から導く欄（write-set の導出ほか）を組み直さず、受付の時の契約のまま走る。pipe/cli/intake.rs の regenerated で写しを読んで組み直す案は、intake.rs の余地が尽きるので採らない（plan.md の 2 節）。

      歯（3 本・接頭辞 vbrd_）。
      - 歯 vbrd_promised_names_read_the_copy_directly は verify.rs の着地済みの cfg(test) の module に置く。器の歯の一時 dir の助け（pipe/scratch_tests.rs が使う pipe::fixture の scratch と held）で dir を作り、git の repo にしない。dir の子 bead-contracts の子 s2-b の下に名 0123456789abcdef.toml の file を置く。字は v-bead-intake の lib の歯の見本の acceptance（行 b）に約束の行 1 つ（of は b・n は 1・symbols は +fresh_name と old の 2 つ・ほかの必須の欄は埋める）を足した字を copy_text に通した字。対照として、その字を read_table が欠陥なしで読み、約束の行が 1 つであることを先に見る。同じ字の file を dir の子 other の下の b.toml にも置く。在らない写しは同じ dir の子 bead-contracts の子 s2-b の下の名 fedcba9876543210.toml。
      - 歯 vbrd_index_tables_take_the_copy_row は index.rs の末に足す cfg(test) の module に置く（index.rs は今 tests の module を持たない・V）。写しと 2 つの対照の path は上と同じ形で、行 b の touches の項目を 1 つにした字。
      - 歯 vbrd_resume_keeps_the_copy_contract は e2e の question.rs に置く。toy と問いの便は着地済みの歯 pipe_question_refresh_widened_row_rewrites_snapshot_and_records_once と同じ助け（repo_with_state・answered・write_contract・resume_copying・refreshed_count）で組む。答えた後、置き場の子 bead-contracts の子 s2-b の下に名 0123456789abcdef.toml の写しを書き（字は v-bead-intake の copy_text の形・行は toy の設計 doc の行 b と同じ欄と値・section は s2-b・goal は字 本文。）、便の契約 file の design の行の値を写しの絶対 path と井桁と字 b に替え、その byte を覚える。続けて着地済みの歯と同じく write_contract で doc の行 b の write-set に src/extra.rs を足して commit し（表の行の便なら取り直しが拾う替え）、resume_copying で撃つ。

