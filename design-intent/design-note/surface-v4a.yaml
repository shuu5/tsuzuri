      - 語の項 not-memo の行の直後に、次の 1 行を足す。
           - no-gist: 名指した開いた memo の notes が発話の ts の字を含まない（要望の要旨と時刻を先に memo の notes へ書く・tsuzuri の memo t3-hub.92.5・持ち主の決め D5）。

      done と verify の対応。全部の項は verify の 2 行目（e2e の歯 utterance_sort_）が測る。1 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので行の verify に書かない。

