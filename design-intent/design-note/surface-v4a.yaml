      done と verify の対応。1 つ目の項は verify の 2 行目、2〜6 つ目は 3 行目（e2e の歯 gfix_）、7 つ目は 4 行目、8 つ目は 5 行目、9 つ目は 6 行目、10 は 7 行目、11 は 8 行目、12 と 13 は 9 と 10 行目（着地済みの歯・9 行目は終わりの門の起こし直しの歯 1 本の名で絞る。接頭辞 end_gate_ は write-set の外の歯の file にも当たる）が測る。1 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので verify に書かない。入口の赤は、main の器が fix_rounds と行 runner.gate_fix_rounds を知らないので 2〜4 行目と 7 行目が落ちる（5 行目と 6 行目は 116 と 101 のまま緑で、行と kind を足すと 117 と 102 にしなければ落ちる）。

      数えと大きさ。器の src の file の行の数（main d7dd57a7）は spawn.rs 1397（見込み +35）・follow.rs 1311（見込み +35）・run.rs 168・resume.rs 323・rules/mod.rs 924 で、どれも上限 1500 に収まる。受付は size M の見込みを 300 行と数え、受付の数えの余地 spawn.rs 91 行・follow.rs 179 行で断るので、欄 growth に見込み 45 行ずつを置く。

      ADR-72 の決定 (7) の字との差。直した差だけの再審査はこの行に入れず、gate は直しの周も今と同じく base..HEAD の全部の差を lens に渡す（理由と割り方は節 10）。直しの周の条件は今の lens の FAIL の全部である（今の lens は重さを出さない。段 S7 の審査役の prompt の行が重さ Critical と Important だけを FAIL にすれば、この行の条件はそのまま決定 (7) の字になる）。実装役は新しい process で起こす（終わりの門の起こし直しと同じ口で、会話の記録の --resume は使わない）。口座は起こし直しの選定 spawn_selected で選び直す（終わりの門の輪は同じ口座を使う。直しの周は gate の lens の時間を挟むので選び直す）。越えた便は今の Gated の FAIL の終端（列の予約・席への知らせ・節を替えて次の便）に入る＝設計係へ返す席の手番である。

      範囲の外。pipe gate の 1 段だけの口（席や歯が撃つ）と land の追随の再 gate（pipe/land.rs の regated）は輪を持たず今のまま。pipe regate と dispatch の release は替えない（verify の赤の FAIL と揺れる歯の FAIL を測り直す口として残る）。契約の審査の FAIL（Reviewed）の扱いと列の hold の既定（memo t3-hub.92.8 の notes の候補）・main の差が閉包に触れない時の着地の前の撃ち直しを省く候補（memo の候補 2）は、この行で決めない。消す物: この行は code を消さない。消えるのは、lens の FAIL の便を席が節を替えて新しい便で全周やり直す手の道のうち、2 周で直る便の分である（regate と release は上の理由で残す・消す物の無い足しの理由は memo の notes に書く）。

  - n: 10
    type: prose
    title: 直した差だけの再審査 — 行 v-gate-fix に入れなかった理由と、段 S7 の審査役の prompt の行への割り方の案（memo t3-hub.92.8・行は置かない）
    body: |
      code で確かめたこと。gate の判定の file verdict.json は gate を撃った HEAD の木 tree を持ち（pipe/gate.rs の fn settle）、直しの周の gate を撃つ前には前の周の FAIL の verdict.json が残っている。だから器は git diff <前の tree> HEAD で直した差だけを取れる（git diff は木と commit を比べられる）。lens に渡す本文は fn measure が base..HEAD の差から組み（pipe/gate.rs）、雛形 headless/lens.txt の穴は {contract}・{rulings}・{diff} の 3 つで、前の周の所見を渡す穴が無い。

      入れなかった理由。今の lens の雛形は契約の全部に照らして差を判じる。直した差だけを渡すと、前の周に見た所を見ないまま PASS を返しうる（偽の PASS・条 AC3 の向きに反する）。直した差だけの再審査が成り立つのは、前の周の所見の表（場所・何・直し方・重さ）を渡し、所見ごとに直ったかと、直した差が新しい穴を作ったかだけを問う別の雛形の時である。所見の表と重さは段 S7（memo t3-hub.92.9）の審査役の prompt の作り直しが足す物で、この行で先に雛形を割ると S7 の行と同じ file（headless/lens.txt と headless/lens.rs と pipe/gate/lens.rs）を 2 度書く。

      割り方の案（S7 の行へ・行 v-gate-fix の着地の後）。1 本目は S7 の審査役の prompt の行で、lens の出力に所見の表と重さを足し、FAIL を Critical と Important に限る。2 本目は再審査の行で、雛形 headless/lens-refix.txt（穴は契約・前の周の所見の表・直した差）を足し、fn measure は便の最後の RunStage が直しの印の周だけ、前の verdict.json の tree から HEAD への差と所見の表を lens に渡す。tree が無いか読めない周は今の全部の差に倒す（黙って狭めない）。verify の行と共通 verify は今のとおり全部を撃つ（機械の検査は狭めない）。
