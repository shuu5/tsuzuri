    body: |
      在りか。差の file は無い（設計だけの行・決め D2）。便は器の 9 file を書く。scribe2/crates/scribe2/src/ の下の ledger/form.rs・ledger/lint.rs・ledger/phase.rs・ledger/phase_main.rs・fleet/lifecycle.rs・fleet/lifecycle_mark.rs・hook/ledger_guard.rs・hook/ledger_guard_tests.rs と、新しい子 module の fleet/lifecycle_mark/contracts.rs である。歯は全部 lib の歯で、各 file の tests の module（hook/ledger_guard.rs の歯は子の file ledger_guard_tests.rs）に接頭辞 vbled_ で足す。新しい e2e の歯の file・群の module・規則の行・断りの語・局面の語・部品の kind・引き金の形は足さないので、数を pin する着地済みの歯（群の表 xtask/tests/teeth1/kfold.rs の GROUPS ほか）は動かない。

