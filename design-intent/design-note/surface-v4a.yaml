    body: |
      在りか。差の file は無い（設計だけの行・決め D2）。便は 3 file を書く。器の scribe2/crates/scribe2/src/utterance.rs の enum Refusal と REFUSALS と fn sort に語 no-gist を足し、scribe2/crates/scribe2-boundary/tests/e2e/seat/ruling.rs の助け open_memo の notes を直して歯 1 本を足し、scribe2/docs/design/dialogue-surface.md の断りの約束の字を 5 語に直す。fn sort は要望の周に台帳の bead 1 本を ledger::show で既に読み、その Bead は欄 notes を既に持つ（V）。新しい台帳の読みは足さない。utterance/cli.rs と help.rs と hook/turn_end.rs は替えない（断りの行は Refusal::as_str の語をそのまま出す）。

      なぜ。持ち主は作り直し v4 で、要望として結んだ発話の時刻を引く行が結び先の memo の notes に無い時に止めると決めた（決め D5・判断の記録 ADR-72 の決定 (6)・段の memo t3-hub.92.5）。今の仕分けは、どの memo に結ぶかだけを記録し、中身が memo に写ったかは誰も見ない（V・ADR-72 の背景）。決定はしご。既に在るか: 要望の仕分けの口は memo を 1 本読み、turn の終わりの門は未仕分けの発話の在る turn を 1 度だけ止める（hook/turn_end.rs・控え told）。この 2 つを繋ぐと、決めの止めは仕分けの口の断り 1 語で足りる。結び先の notes に時刻の行が無い要望は仕分けられず、未仕分けのまま turn の終わりの門が 1 度だけ止める。turn の終わりの門に台帳の読みを足す形（Stop の hook が bd を撃つ）より、読みが増えず、止めの回数も同じ 1 度である。新しい口と無効化の旗は足さない（条 N-3.1）。

      形（utterance.rs）。
      - enum Refusal の末に NoGist（doc は名指した memo の notes が発話の ts の字を含まない）を足し、as_str は字 no-gist、REFUSALS は末に Refusal::NoGist を足して 5 項にする。fn sort の doc の断りの順の字を no-utterance → linked → ledger-unreadable → not-memo → no-gist に直し、Failure::Refused の doc の閉じた 4 語を 5 語に直す。
      - fn sort の要望の周で、not-memo の判定を通った後に、読んだ Bead の notes が ts の字を部分の字として含まなければ Err(Failure::Refused(Refusal::NoGist)) を返す（含むかは str::contains・行の形と時刻の形は解かない）。同じ組の already の判定は今のまま台帳より先で、断りの周は event も台帳も書かない。

      歯の file（ruling.rs）。
      - 助け open_memo の notes の字を空から、TS_A と TS_B と TS_C の 3 つの字を含む 1 行（例 [席] 要旨 の後に 3 つの ts を空白で繋いだ字）に替え、doc に「notes は TS_A・TS_B・TS_C の字を含む（要望の断り no-gist に当たらない）」を足す。open_memo を使う着地済みの歯は字を替えずに緑のまま。
      - 歯 utterance_sort_refuses_a_request_whose_memo_notes_lack_the_ts を足す。発話 TS_A と TS_B を言わせ、show_json で 5 本の memo を置く。s2-n0 は開いた memo で notes が空、s2-n1 は開いた memo で notes が TS_B の字だけ、s2-n2 は開いた memo で notes が TS_A を秒までに切った字 2026-09-30T07:05:09Z だけ、s2-n3 は閉じた memo（label intake:memo）で notes が空、s2-ok は開いた memo で notes が 2 行（1 行目 [席] 記帳・2 行目 要旨 の後に空白と TS_A の字と空白と字 から）。s2-n0・s2-n1・s2-n2 への TS_A の要望は assert_refused_sort で refused_sort の no-gist と TS_A の行、s2-n3 への TS_A の要望は not-memo の行、s2-ok への TS_A の要望は assert_ok_line で utterance: sorted ts=TS_A as=request memo=s2-ok の行と sorted の 1 件を見る。REFUSALS の as_str の列も同じ歯が見る（vessel::utterance::REFUSALS）。

