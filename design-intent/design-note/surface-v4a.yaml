      - Kind::Wip の doc の末に「各行の直後にその bead の定型の行（MARKER_WIP_LINE）」を足す。

      純関数の歯の fixture（歯 hook_session_recent_wip_lines_carry_the_last_state_lines_purely）。now は 2026-09-21T00:00:00Z の秒、bead は次の 3 本（updated はどれも None・題は id の後に書く）。
      - w-a（in_progress・題 作業 A）の notes は 7 行: 1 行目 [席 2026-09-20T09:00Z 記帳]、2 行目 計画: 古い計画、3 行目 次の手: 手 1、4 行目 空白 2 つの後に 計画: 新しい計画 と末の空白 2 つ、5 行目 未決: と空白 3 つ、6 行目 優先: P-1、7 行目 メモ: 外。
      - w-b（in_progress・題 作業 B）の notes は 1 行で、次の手: の後に空白 1 つと字 い を 201 個。
      - o-1（open・題 開）の notes は 1 行 計画: 出ない。
      期待の 7 行は、[RECENT-WIP] w-a - 作業 A・[RECENT-WIP-LINE] w-a 計画: 新しい計画・[RECENT-WIP-LINE] w-a 次の手: 手 1・[RECENT-WIP-LINE] w-a 優先: P-1・[RECENT-WIP] w-b - 作業 B・[RECENT-WIP-LINE] w-b 次の手: と空白 1 つと字 い を 200 個と字 …・[RECENT-NONE] kind=bead、をこの順に持つ列である。同じ歯は beads_of を、鍵 notes が字 計画: x の要素・鍵 notes の無い要素・鍵 notes の値が数 3 の要素の 3 つを持つ配列で撃ち、3 つとも読めて notes が 計画: x と空の字と空の字であることを見る。定数の 3 つの値と KINDS の長さ 6 も同じ歯が見る。

