  - n: 24
    type: prose
    title: 行 t-stop-preflight — 係の終える前の門が係の出した契約の file ごとに preflight --contract を撃ち直す（memo t3-hub.92.7・作り直し v4 の段 S4・設計だけの行）
    body: |
      在りか。差の file は無い（設計だけの行・決め D2）。便は 3 file を書き、2 file を置き場だけで名指す。境界の crates/tsuzuri-boundary/src/hook/subagent_stop.rs に子 module の宣言と呼びの 2 行と doc の 1 行を足し、子 module crates/tsuzuri-boundary/src/hook/subagent_stop/contract.rs を新しく足し、歯の段の file crates/tsuzuri-boundary/tests/tspf.rs（接頭辞 tspf_）を新しく足す。中核の tsuzuri-core と plugin/hooks/hooks.json と群の main.rs と kfold の表は書かない（新しい歯は段の file・群に module を足さない）。着地済みの歯の file teeth6/agsg.rs と agshp.rs は書かず、verify の 3 行目と 4 行目が撃つので置き場だけで名指す。

      なぜ。持ち主の決め D1（判断の記録 ADR-72 の決定 (2)）は、設計係が自分の作業の中で preflight を rc 0 まで撃つと決めた。行 v-pf-contract の着地で、器の pipe preflight は 1 行の toml の契約の file を --contract で直に受ける。係が撃ったと書くだけでは席が撃ち直すまで分からないので、係の終える前の門が係の出した契約の file を機械で撃ち直し、通らない file を 1 度目の終わりで係に返す。決定はしご。要るか: 契約の file の誤りを席の置く前に係の中で直させ、席の撃ち直しを省く。既に在るか: 子を上限つきで撃つ道具は境界の server::proc::run（src/server/proc.rs の 107 行・rc 0 で標準出力を返し、ほかは Failed の Unstartable・TimedOut・Exit で返し、上限を越えた子は process group ごと止める）が在り、欠けの字の止めと記帳は今の門の lacks と hold と GATE の道が持つので、足すのは契約の file の列と撃ちと欠けの字だけ。

      depends。行 ag-floor-off は境界の子 module subagent_stop/floor.rs と旗 --tz と --scribe2 を消し、subagent_stop.rs の関数 run の頭（旗を抜く floor::tools の呼び）と欠けの足し（floor::holes の 1 行）を書き替えるので、この行はその着地の後の run に呼びを足す（並べると同じ行が当たる）。行 v-pf-contract は器の preflight に口 --contract を足すので、その着地と器の binary の入れ替えの前は、撃ち直しが全部 rc 1（引数の断り）で返る。

      契約の file の置き場（設計係の決まり）。設計係は契約の行を 1 行ずつ、出力の dir の子 contract の直下に <行 id>.toml の名で書く（字 schema = 1 と空の行と、契約表の導出の形の [[contract]] の 1 行・欄 goal に節の本文）。門は頭の出す物の欄を見ず、子 contract の直下の名の末 .toml の file を全部撃つ（子の dir と .toml でない file は見ない）。

      形（contract.rs）。頭の //! に、終える前の門の契約の file の撃ち直しであることと順（子 contract の直下の .toml を名の順に・空の state dir・file ごとに 1 本・通らない file ごとに欠けの 1 行）を書く。
      - 定数 DIR（字 contract・出力の dir の子の名）、STATE（字 pf-state・係の dir の子の空の state dir の名）、PROGRAM（字 scribe2・PATH で解く）、LIMIT（Duration の 8 秒・全部の撃ちの上限で、hooks.json の終える前の門の timeout 10 秒の内）。
      - 関数 files(out: &Path) -> Vec<PathBuf>。out.join(DIR) を read_dir で読み（読めなければ空）、file で拡張子が toml の path を名の順に並べる。
      - 関数 holes(agent: &Path, out: &Path, repo: &Path, bead: &str) -> Vec<String>。files が空なら空を返し、子を撃たない。次に agent.join(STATE) を create_dir_all で作って read_dir が空かを見て、作れないか空でなければ state dir の欠けの 1 行だけを返し、子を撃たない。ほかは deadline を今と LIMIT の和にし、file ごとに server::proc::run(OsStr の PROGRAM, 引数の列, repo, deadline までの残り) を撃つ。引数の列は pipe・preflight・--contract・file の path・--bead・bead・--repo・repo・--state-dir・state dir の path の 10 語（path は join のまま・canonicalize しない）。Ok は欠けにせず、Err(failed) は通らない欠けの 1 行にする。deadline を過ぎた後の file は撃たずに Failed::TimedOut と同じ欠けの 1 行にする。
      - 欠けの字は次の 2 つ（<名> は子 contract からの相対の字 contract/<file の名>・<訳> は Failed の word の字〔起動できない・時間切れ・rc が 0 でない: と標準エラーの最後の空でない行〕）。
        通らない: 契約の file <名> の preflight が通らない（<訳>）
        state dir: preflight の空の state dir <path> が無い（作れないか空でない）
      - 子 module は字 Component::ParentDir・const OUT: &str・permissionDecision・pub const USAGE: &str を持たず、begin を呼ばない（歯 agshp_ の数える句を動かさない）。出力の dir の名は呼び手が渡す out だけを使う。

      形（subagent_stop.rs）。子 module の宣言 pub mod contract; を、行 ag-floor-off が外した pub mod floor; の在った所（頭の doc の次）に置く。関数 run の begin の受けを let (args, dir) にし、claim_holes の足しの次に holes.extend(contract::holes(&dir.join(&name), &out, &args.repo, &spec.target)); の 1 行を足す。頭の doc の群の係の段の次に 1 行（出す物の dir の子 contract の .toml の file ごとに 4 で器の preflight --contract を撃ち直し、通らない file を欠けに数える・判断の記録 ADR-72 の決定 (2)）を足す。USAGE と止めと記帳の道は替えない（1 度目は hold で rc 2、2 度目は STOP-GATE.txt に記帳して通す）。

      歯の段の file（tspf.rs）。頭は //! の 2 行（接頭辞 tspf_ と、終える前の門の契約の file の撃ち直しの歯である事）の次の行に #![cfg(test)] を置く。助けは群 teeth6 の agsg.rs の place・whole・w・said・told と同じ字の助けをこの file に写し（置き場の dir の名は tspf）、stop に PATH の値の引数を足して Command の env で子の PATH を置く。偽の scribe2 は置き場の子 bin の file scribe2（mode 755）で、1 行目 #!/bin/sh、2 行目は引数の全部を空白で繋いだ 1 行を置き場の calls.txt に足す行、3 行目は 4 つ目の引数の末が bad.toml なら標準エラーに字 refuse 1 を書いて rc 1 で終える行、4 行目 exit 0。偽の PATH は置き場の bin と元の PATH を繋いだ字で、scribe2 の無い PATH は置き場の子 empty（空の dir）だけの字。契約の file の字は中身を見ないので字 schema = 1 だけ。札の対象は whole の t3-hub.87、口の --repo の値は置き場の根。
      - tspf_contract_files_are_preflighted_in_name_order。子 contract に a.toml・bad.toml・memo.md・子の dir sub（中に x.toml）を置く。1 度目の終わりの rc 2、標準エラーは通らない欠けの字 契約の file contract/bad.toml の preflight が通らない（rc が 0 でない: refuse 1） を持ち contract/a.toml を持たない、calls.txt は 2 行で 1 行目が a.toml の、2 行目が bad.toml の撃ちの字、札の ended が無い、係の dir の子 pf-state が空の dir として在る、を断言する。
      - tspf_second_end_records_the_hole_and_passes。同じ置き場の 2 度目の終わりの rc 0、STOP-GATE.txt の字が上の通らない欠けの字と改行 1 つ、札の ended が在る、を断言する。
      - tspf_no_contract_file_fires_nothing。子 contract の無い置き場・子 contract に memo.md だけの置き場で、rc 0・calls.txt が無い・札の ended が在る。子 contract に a.toml だけの置き場で rc 0・標準エラーが空・calls.txt が 1 行・札の ended が在る。
      - tspf_missing_scribe2_holds_once。scribe2 の無い PATH と a.toml の置き場で、rc 2・標準エラーが字 契約の file contract/a.toml の preflight が通らない（起動できない） を持つ。
      - tspf_state_dir_must_be_empty。係の dir の子 pf-state に file x を置き a.toml を置いた置き場で、rc 2・標準エラーが state dir の欠けの字に係の dir の子 pf-state の path を入れた字を持つ・calls.txt が無い。
      上限の時間切れの周は、歯が 8 秒を待つので歯に置かない（欠けの字の道は Failed の word の同じ 1 本）。

      done と verify の対応。1 つ目から 5 つ目の項は verify の 2 行目（段の file tspf の歯）が測る。6 つ目は 3 行目（群 teeth6 の歯 agsg_・子 contract の無い置き場なので撃ちが起きない）、7 つ目は 4 行目（歯の file agshp.rs の歯 agshp_・子 module が数える句を持たない）が測る。1 行目の clippy は done に載せない守り。xtask の check は共通 verify が撃つので verify に書かない。入口の赤は 2 行目（main では子 contract を見ず、1 度目の終わりを rc 0 で通す）。

      範囲の外。設計係の型 plugin/agents/drafter.md と手引きの参照の file に、契約の file の置き場と preflight --contract を撃つ手順を書くこと（席が置く）。hooks.json の timeout（行 ag-floor-off の 10 秒のまま）。受付の pipe intake と、席の置き場への契約の file の写し。
  - n: 25
    type: prose
    title: 行 v-turn-wip-stale — turn の終わりの門で作業中の bead の定型の行の古さを 1 度だけ止める（memo t3-hub.92.5・作り直し v4 の段 S3・決め D5・設計だけの行）
    body: |
      在りか。差の file は無い（設計だけの行・決め D2）。便は器の src 5 file と器の e2e の歯 2 file と器の設計の文書 1 file を書く。判定と印と止めは scribe2/crates/scribe2/src/hook/turn_end.rs に足す。呼びは hook/mod.rs の fn dispatch の 2 つの腕（pre-tool-use と stop）を直す。頭の時刻の読みは hook/ledger_guard/notes.rs の fn head_time を pub(crate) にして使い（親 hook/ledger_guard.rs の mod notes を pub(crate) mod notes にする・第 2 の読み手を作らない）、runner の見分けは hook/utterance.rs の fn is_runner を pub(super) にして使う。歯は新しい子 module の file scribe2/crates/scribe2-boundary/tests/e2e/hook/session/wipst.rs（接頭辞 wipst_）に置き、親 tests/e2e/hook/session.rs には mod wipst; の 1 行だけを足す（子は use super::* で親と祖父 hook.rs の助けを使う）。lib の歯は turn_end.rs の tests module の 1 本を直す。群の main.rs と kfold の表は書かない（e2e の群に module を足さない）。depends は空（このノートのほかの行と触る file が交わらない・行 v-wip-lines と v-sort-gist は着地済み）。

      なぜ。持ち主は作り直し v4 で、turn の終わりの門が、その turn で台帳か設計を書いたのに作業中の bead の定型の行が古い時に 1 度だけ止めると決めた（決め D5・判断の記録 ADR-72 の決定 (6)）。行 v-wip-lines は定型の行を圧縮の後に出すが、席が行を足し忘れると古い計画が出る。今の turn_end.rs は event log と控え told だけを読み、台帳を読まない（module の doc）。

      決め（code で照らした・file 行は main 8837a96e）。
      - 書きの測り。PreToolUse の門が全部通した周（fn dispatch の pre-tool-use の腕で pre_tool_use の戻りの rc が RC_OK の周）に、turn_end::mark が session の置き場（turn_end.rs の fn place・<state>/session/<id>/）の新しい file wrote に 1 行（UTC の秒の時刻・空白・語 ledger か design）を足す。台帳の書きは古さの印の門 stale_gate.rs の fn mark と同じ読み（ledger_guard の segments と write_of の subcommand が WRITES に在る片を持つ command）。設計の書きは編集の道具（guard.rs の GUARDED の 4 つ）の編集先を role_guard::locate で anchor の HEAD の宣言（PathKinds::read_at_head・鍵 design-intent-paths と design-doc-paths）から分けた種別が DesignIntent か DesignDoc の周。器は tsuzuri の path を焼かない。先に PathKinds::Default で locate して Outside の周は宣言を読まずに印を書かない（git の子 process を repo の外の編集で撃たない）。runner（is_runner が真・--plugin-root が置き場の pipe の dir の下）と session の id の無い周は印を書かない。印を書けない周は黙る（門の allow を変えない・fail-open）。
      - turn の区切り。印は判定の後に空にする。turn の最初の書きの時刻 T は wrote の最初の読める行の時刻。再入の stop（stop_hook_active）は今のまま判定せず、印も消さない。
      - 古さの定義。定型の行は、行の頭の空白を落とした字が recent::WIP_HEADS の 4 つの頭のどれかで始まり、頭の後の字が空白だけでない行（recent::wip_state と同じ選び）。行の時刻は、notes の中でその行より前の最後の段の頭の行（head_time が Some を返す行・札 [席 <時刻>] の形）の時刻の下の端。T を分に切った値（T から T を 60 で割った余りを引く）以上の時刻を持つ定型の行が、作業中の bead（status が in_progress）のどれか 1 本に在れば新しい。無ければ古い。分に切る訳は、席の段の頭が分の形（date で埋める）で、同じ分の書きを古いと読まないため。10 分と時の形の頭は下の端で読むので、同じ 10 分か同じ時の中でも古い側に倒れる。
      - 作業中の bead が 0 本の turn。書いた turn は止める（行の wip= の値は字 -）。決め D5 は作業の状態を作業中の bead に置くので、bead が無いと圧縮の後に状態が残らない。止めの行が in_progress にする手を名指す。
      - 台帳の読み。今の器の口 crate::seat::ledger::read_text（bd --readonly list --all --limit 0 --json・子 process の cwd は hooked.cwd・client は --bd の旗か PATH の bd）を 1 回だけ撃ち、recent::beads_of で読む。待ち上限は今の rules 行 seat.ledger_timeout_s（timeout_of・manifest は --rules か埋め込み）。新しい rules 行は足さない。印の無い turn は台帳を読まない（NFR5）。
      - 1 度だけ。止めた周は控え told に stale <T の字> と block を 1 回の書きで足して rc 2・stdout 0 byte・stderr 1 行で止める（打刻しない・未仕分けの止めと同じ外形）。印は止める前に空にするので、続く再入でない stop は通し、次の turn は新しい書きの時だけ判じる。再入は今の fn release が控えの最後の block を見て Idle を打つ。
      - 未仕分けの止めが先。fn stop は今の未仕分けの判定が Block の周はそれだけで止め、印を消さない。Pass と Unjudged の周だけ古さを判じる（1 度の stop で止めは 1 つ）。
      - 読めない周。Reason に 3 語を足す。marks-unreadable（wrote が在るのに読めないか空にできない・控えを持たない）・ledger-unreadable（rules を読めない・行が無い・子が落ちる・JSON を読めない）・ledger-timeout（待ち上限を越えた）。台帳の 2 語は keeps_record を真にし session ごとに 1 度だけ記帳する。どれも止めず TurnEndUnjudged を記帳して打刻する（POLARITY は今の in-loop・fail-open のまま・極性の一覧と外形の snapshot は替わらない）。

      形（turn_end.rs）。
      - 定数 WROTE_FILE（字 wrote）。enum Wrote（Ledger と Design・as_str は ledger と design）。
      - 純関数 wrote_of(tool, command, kind) は Option<Wrote> を返す。tool が Bash なら command の片のどれかが台帳の書きの時 Ledger。tool が GUARDED に在り kind が Some(DesignIntent) か Some(DesignDoc) の時 Design。ほかは None。
      - 純関数 stale_of(since, beads) は enum Staleness（Fresh と Stale { wip: Vec<String> }・wip は作業中の bead の id の台帳の順）を返す。
      - TurnEndDecision に腕 Stale { wrote: String, wip: Vec<String> } を足す（型の名は替えない・極性の一覧の boundary の字は今のまま）。Record に腕 Stale(String)（控えの行 stale <ts>）を足す。
      - pub(super) fn mark(hooked, args, payload) と、fn stop の引数を state_dir から hooked（&Hooked）に替える（dispatch の stop の腕が &hooked を渡す・中の state_dir は hooked.dir）。
