    body: |
      在りか。差の file は無い（設計だけの行・決め D2）。便は src 7 file と歯の file 7 本を書く。読みと辺は tsuzuri-core の graph/build.rs、属性は graph/mod.rs の BeadAttr、不変条件は graph/check.rs、板の札は pipeline.rs、電文の属性は tsuzuri-contract の graph.rs の BeadAttr、電文への写しは境界の server/board.rs の fn doc、吹き出しは面の widgets/pop.rs の fn row_pointer に置く。新しい歯の段の file は crates/tsuzuri-core/tests/gbead.rs（接頭辞 gbead_）と crates/tsuzuri-surface/tests/gbpop.rs（接頭辞 gbpop_）。属性の欄を足すと構造体の字で BeadAttr を組む着地済みの歯 5 file（gview.rs・cform_graph.rs・itemlink.rs・bvpop.rs・cadl.rs）が組めなくなるので、各 file の BeadAttr の字に欄 contracts の空の列を 1 行ずつ足す（ほかの字は替えない）。群の main.rs と kfold の表は書かない（module を足さない）。depends は同じノートの行 v-bead-ledger（器が台帳の形の判じで契約の行を持つ bead を契約に数える前に、tsuzuri の g-2 だけが数えると器の doctor と食い違う）。

      なぜ。持ち主は裁定 t3-hub.92.7.2 で、便の契約を台帳の bead に置く形を承認した（判断の記録 ADR-72 の決定 D1 の分）。決めの字のうちこの行が頼る物。契約の行は契約表の導出の形の [[contract]] の 1 行（欄 id・title・req・write-set・verify・size・done ほか・section と depends と goal は持たない）で bead の欄 acceptance に置き、設計の節の本文は bead の本文に置く。便の順は bead の依存（blocks）で持つ。並ぶ間（移しの行の着地から退けまで）は、acceptance に design の pointer の行を持つ bead と、[[contract]] の行を持つ bead の 2 形が在り、両方を持つ bead は器が断る。folio の頁の契約の表は退けで消えるので、board が台帳の bead の契約を描く期間を切らさないよう、この行は切り替えの前に着地させる。今の導出グラフは acceptance の design の pointer の行だけを読む（build.rs の fn pointer_lines と fn pointer_row・300 行目から 305 行目と 535 行目から 543 行目）。契約の行の bead は種類 task の節点にはなる（tsuzuri-contract の ledger.rs の fn bead_kind）が、pointers が空なので、不変条件 g-2（check.rs の fn g2_one_pointer・open の契約は pointer の行をちょうど 1 つ持つ）が全部の bead の契約を違反と名指し、pipeline の板は札を作らず（pipeline.rs の fn dispatchable・320 行目）、吹き出しの設計の行は空になる（pop.rs の fn row_pointer・439 行目）。

      読みの在りか（依存の向き）。tsuzuri の crate は器の crate を使えない。tsuzuri-core の直接依存は serde・serde_json・tsuzuri-contract だけで、xtask の歯の一覧 DIRECT_DEPS（xtask/src/main.rs の 540 行目）が manifest と照らし、器は別の workspace に在る。toml の crate も無い。そこで tsuzuri の側の読みは、着地済みの tsuzuri-core の graph/code.rs の fn read_write_sets（契約表の導出物の字から [[contract]] の行ごとに id の行と write-set の行の値を JSON として読む・288 行目）と同じ形の読みにする。導出の形の id と req の値は二重引用符で囲んだ字と字の配列で、節と題は逆斜線を持てないので、値の字は JSON の字としても読める。

      形（build.rs）。
      - 定数 CONTRACT_HEAD は字 [[contract]]。
      - 公開の関数 contract_rows（acceptance の字を受け、Option の字と字の列の対の列を返す）。行ごとに行末の CR を除き、行末の空白を除いた字が CONTRACT_HEAD の行で新しい塊を始める。塊の中で、頭が字 id と空白と等号と空白の行は残りを JSON の字として読み（読めなければ None のまま）、頭が字 req と空白と等号と空白の行は残りを JSON の字の配列として読む（読めなければ空の列）。最初の CONTRACT_HEAD より前の行は読まない。塊を出る順に返す。
      - fn add_ledger は pointer の行を今のまま読み、続けて contract_rows を読む。塊ごとの req の字を、bead から req の辺として、同じ bead の中で同じ先を 1 度だけ、塊の順と配列の順に足す。先の節点が在るかは見ない（台帳の blocks の辺と同じ・先の無い辺は g-1 が名指す）。契約の行の bead から design の辺は張らない（design の辺は今のまま pointer の行だけから組む）。属性の contracts に塊ごとの id を入れる（読めない id は空の字）。
      形（mod.rs と graph.rs と board.rs）。中核の BeadAttr と電文の BeadAttr に欄 contracts（字の列・acceptance の [[contract]] の行ごとの欄 id）を足す。電文の欄は serde の default と、空の時に書かない skip_serializing_if を持つ（tests/snapshots/graph.json の字は替わらない）。board.rs の fn doc は中核の値を写す。
      形（check.rs）。g-2 は open の task のうち pointers の数と contracts の数の和がちょうど 1 でない bead を名指す（両方の形の bead と、2 塊の bead も名指す）。g-8 は memo の label を持ち、pointers か contracts のどちらかが空でない bead を名指す。doc の行の字を合わせる。
      形（pipeline.rs）。fn dispatchable は、行の前後の空白を除いた字が CONTRACT_HEAD の行が在る時、design の pointer の行が 1 つも無ければ真、在れば偽（器が両方の形を断る）を返す。無い時は今の読みのまま。module の doc の 6 行目の字を合わせる。
      形（pop.rs）。fn row_pointer は pointer の行が在れば今のまま。無ければ contracts がちょうど 1 つで空の字でない時にその id を返し、ほかは None。

      歯の見本（gbead.rs）。組み方は着地済みの tsuzuri-core/tests/teeth1/dnrow.rs に倣う（folio の索引の形の表の字 IDX と、serde_json の json の配列で組む偽の台帳と、器の event log の 1 行）。IDX は dnrow.rs の IDX と同じ 5 節点と 5 辺（要件 FR1・設計ノートの行 nx#a・nx#b・ny#c ほか）。event log は RunCreated の 1 行（bead zz.1・台帳に無い bead）。台帳の bead。
      - gb は種類 epic の open。
      - gb.1 は種類 task の open・親 gb・acceptance は 3 行（[[contract]] の行、id の行で値は t-one の JSON の字、req の行で値は FR1 だけの JSON の配列）。
      - gb.2 は種類 task の open・親 gb・acceptance は design の pointer の 1 行（contracts/nx.toml の後に井桁と a）。
      - gb.3 は種類 task の open・親 gb・dependencies に gb.1 への blocks・acceptance は [[contract]] の行と、id の行で値は t-three、req の行で値は FR1 を 2 度持つ JSON の配列。
      - g-2 の見本は gb.4（acceptance に design の pointer の行で nx.toml の後に井桁と b、続けて [[contract]] の行と id の行で値は t-four）と gb.5（[[contract]] の塊が 2 つで id は t-five と t-six）を足した台帳。
      - g-8 の見本は gb.6（label intake:memo・種類 task・acceptance は gb.1 と同じ形で id は t-seven）を足した台帳。
      - contract_rows の見本の字は 2 塊（1 つ目は [[contract]] の行・id の行で値は t-one の JSON の字・req の行で値は FR1 だけの配列、2 つ目は [[contract]] の行・id の行で値が引用符の無い字 bare）。
      板の札の歯は pipeline::board に台帳の字と event log の字と時刻を渡し、札の列の contract の id で gb.1・gb.3・gb.4 を引く（gb.4 は g-2 の見本の台帳で撃つ）。電文の歯は tsuzuri_contract の BeadAttr を serde_json で字にして読み戻す。
      歯の見本（gbpop.rs）。組み方は着地済みの bvpop.rs の fn graph に倣い、GraphDoc を契約の型で組んで tsuzuri_surface::widgets::pop::row_pointer を撃つ。bead は 3 本（pointer の行が design の頭と contracts/nx.toml の後に井桁と a の bead、pointers が空で contracts が t-one の bead、contracts が t-one と t-two の bead）。

      done と verify の対応。1 つ目から 10 個目の項は verify の 2 行目（gbead.rs）、11 個目の項は 3 行目（gbpop.rs）が測る。12 個目の項は着地済みの dnrow_（pointer の行から design の辺を組む読みが替わらない）、13 個目から最後の項は BeadAttr の字を直した歯の file の歯が緑のままを測る。1 行目の clippy は書く 4 crate（tsuzuri-contract・tsuzuri-core・境界・面）の all-targets を名指す（no-deps は名指さない依存の lint を外すだけなので、書く crate を全部 -p で名指す）。xtask の check は共通 verify が撃つので行の verify に書かない。

      照らした事（起草の時の main）。消す物と名を替える物は無い（足すだけ・pointer の読みは替えない）。BeadAttr を構造体の字で組む所は src に 3 つ（build.rs・board.rs と、電文の型の定義）、歯に 5 file。g-2 と g-8 の判定を測る着地済みの歯（tsuzuri-core の teeth2 の graph.rs・境界の teeth2 の kcli.rs）の見本は acceptance に [[contract]] の行を持たないので判定は替わらない。数を pin する歯（節点の種類 21・辺の型・不変条件 12 本）は動かない（種類も型も不変条件も足さない）。src の file の大きさは build.rs 817 行・check.rs 842 行・pipeline.rs 909 行・pop.rs 1125 行で、上限 1500 行の余地に収まる。

      範囲の外。設計ノートの行の節点を消すこと（退けの行の後）。tz code の行 → file の辺（cli/code.rs が contracts の dir の導出物から write-set を読む）に bead の契約を足すこと。memo の繋ぐ門（memo_gate.rs）が設計ノートの行への design の辺で小さい契約を引く読み。節点の頁の本文の block に契約の欄の表（write-set・verify・done）を描くこと（1 本の引きの口の電文 LedgerItem に acceptance が無い・本文は今の block が描く）。server/design.rs の contracts の dir は裁定の書き出しの読み直しの印だけで、描きには使わない。
