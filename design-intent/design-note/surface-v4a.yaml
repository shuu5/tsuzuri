        done: '(1) 定数 recent::MARKER_WIP_LINE は字 [RECENT-WIP-LINE]・定数 recent::WIP_HEADS は 4 つの字 計画: と 次の手: と 優先: と 未決: をこの順に持ち・定数 recent::WIP_LINE_WIDTH は 200 で、recent::KINDS は 6 項のまま（歯 hook_session_recent_wip_lines_carry_the_last_state_lines_purely） (2) recent::beads_of は要素の鍵 notes の字を Bead の欄 notes に読み、鍵 notes の無い要素と値が字でない要素の notes は空の字で、要素は読み飛ばさない（歯 hook_session_recent_wip_lines_carry_the_last_state_lines_purely） (3) 節 11 の純関数の fixture の 3 本の bead に recent::ledger_lines が返す行は節 11 の期待の 7 行と等しい（頭ごとに最後の 1 行だけ・頭の順・頭の前の空白は読み・頭の後の字が空白だけの行と 4 つの頭の外の行は出さず・200 字を越える字は 200 字と字 … に畳み・open の bead の notes は出さない・歯 hook_session_recent_wip_lines_carry_the_last_state_lines_purely） (4) 偽の bd が notes つきの in_progress の bead 1 本を返す SessionStart の周は、その bead の [RECENT-WIP] の行の直後の 2 行が [RECENT-WIP-LINE] w-1 計画: 段 S3 から と [RECENT-WIP-LINE] w-1 次の手: 行を置く で、行頭が [RECENT-WIP] と空白の行は 1 行だけで、notes の無い in_progress の bead w-2 の [RECENT-WIP] の行の直後は印 [RECENT-WIP-LINE] の行でない（歯 hook_session_recent_wip_lines_follow_their_bead） (5) 着地済みの歯 hook_session_recent_ が緑のまま（verify の 2 行目） (6) 着地済みの歯 hook_recovery_edge_ が緑のまま（verify の 3 行目）'
