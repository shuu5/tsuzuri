  - n: 17
    type: prose
    title: 行 v-ci-child-cut — 着地の終端の GitHub の検査の子と着地の後の CI の口を退ける（memo t3-hub.92.3・持ち主の決め D3・設計だけの行）
    body: |
      在りか。差の file は無い（設計だけの行・作り直し v4 の決め D2）。便は器の src 6 file（scribe2/crates/scribe2/src/pipe/land/finish.rs・pipe/land.rs・pipe/cli/step.rs・pipe/cli/args.rs・pipe/cli.rs・help.rs）と、器の e2e の歯 3 file（scribe2/crates/scribe2-boundary/tests/e2e/pipe/land/cilast.rs・order.rs・retire.rs）と外形の snapshot 1 file（e2e__pipe__pipe_external_form.snap）と、器の設計の文書 scribe2/docs/design/contract-source.md を書く。write-set の = の 5 file（e2e の pipe.rs・pipe/land.rs・pipe/land/redclose.rs・pipe/dispatch.rs・pipe/dispatch/terminal.rs）は verify の filter が当たる着地済みの歯の置き場で、書かない。depends は空（行 v-gate-fix とは触る file が交わらず並べる）。

      なぜ。持ち主の決め D3（push ごとの CI を止め daily に寄せる・判断の記録 ADR-72 の決定 (4)・memo t3-hub.92.3 の候補 2）で、tsuzuri の push に GitHub の検査の run は起きない（行 t-ci-stop の着地 d7dd57a7）。器の land の終端は宣言の鍵 ci-watch が無いか true の repo で、close の後に着地の後の CI の口（pipe land --run 便 --ci-only sha）を子 process で起こし、子は run の無い commit を rules 行 pipe.ci_wait_s の上限まで gh で読み続けて ci:unmeasurable を記す。行 v-ci-watch-off は鍵で子を切ったが、子の code と口は残った（v-ci-watch-off の節 4 の範囲の外）。この行はその code を消し、鍵の有無によらず終端が子を起こさない形にする。決定はしご。要るか: 消す物（memo の候補 2 の器の CI の見張り）。既に在るか: 鍵 ci-watch = false の終端の道（push とこの host の緑の close だけ）が在るので、全部の repo をその道に寄せ、新しい道を作らない。

      形（finish.rs の fn terminal）。宣言の remote が在る周は、push（受け入れの周の Adopted は押さない・今のまま）の後、Adopted でない周は close_reason(sha, CloseTail::HostGreen) の close を撃って、その結末をそのまま返す（子を起こさず、照らす commit を選ばず、ci:unmeasurable も記さない）。Adopted の周は今のまま（鍵 ci-watch が false なら ci:unmeasurable を記して Terminal::CiUnmeasurable、そうでなければ先端の祖先かを測って read_ci で待ち、success だけが close する）。消す物: 今の段 (3)（照らす commit の選び checked のうち Adopted でない周の分と、spawn_ci の呼びと、照らす commit が無い周の ci:unmeasurable の記し）、fn spawn_ci（語 ci:spawned と ci:unspawned の記し）、fn ci_only、const CI_ONLY、fn pushed_past、enum PushTip の variant Behind（読むのは checked の選びだけ）と、land の Landing::Behind から PushTip::Behind を作る枝（Landing::Behind も PushTip::Tip に写す）。fn terminal の doc の段 (3) と子と Behind の句を外し、終端は push とこの host の緑の close だけと書く。read_ci と ci_word は Adopted の周の記しが使うので残し、doc の口の句（着地の後の CI の口と共有）を外す。module の頭の doc の終端の句（push → CI の照合 → 台帳の close）を push → 台帳の close に直す。

      形（pipe/cli/step.rs）。fn settled_port から --ci-only の枝を外す。fn ci_only と fn red_notice を消す。fn terminal_only の側の選びは常に PushTip::Tip にする（記録の sha が先端と違う周の写しの探し直し landed_squash_of は、close の理由の sha を決めるので残す）。doc の --ci-only の項と Behind と子の句を外し、settled_entry の doc の --ci-only と子の句を外す（--rules は land の道と同じ形のまま渡す）。use の CiRead と CI_ONLY を外し、ほかに使い手の無い use（notify など）は clippy が名指す物だけ外す。

      形（旗と案内）。pipe/cli/args.rs の ALLOWED_LAND から value(--ci-only) を外す（旗は未知の引数として rc 2 で断られる・cli_args.rs の fn refusal）。pipe/cli.rs の usage と help.rs の form の字 [land: --terminal-only|--detection-only|--ci-only SHA] を [land: --terminal-only|--detection-only] に替え、外形の snapshot e2e__pipe__pipe_external_form.snap の同じ字の 3 行を合わせる。pipe/land.rs の 85 行目の再輸出から ci_only と ci_word と CI_ONLY を外す。

      歯（足す・e2e の子 module の cilast.rs と order.rs に足し、2 つの file のどちらも頭の //! の行に接頭辞 vcicut_ の句を足す。order.rs の頭の doc は今の接頭辞 pipe_terminal_ と pipe_order_ の句を残し、その後に vcicut_ の句を足す）。歯 vcicut_land_closes_without_a_ci_child（cilast.rs）は、fake_terminal で偽の CI が failure を答える repo（鍵 ci-watch を足さない）の land を撃ち、rc 0・terminal=closed・偽 remote の main・偽の台帳の argv（close と bead と --reason と landed sha host=green）・便の終端の行が PUSHED と CLOSED の 2 件だけ・偽の CI の呼びが 0 回を断言する（子が在れば終端の行に ci:spawned が親の記しで同期に載るので、待たずに測れる）。歯 vcicut_terminal_only_closes_without_a_ci_child（order.rs）は、replay_fixture で close を断った便を作り、main を着地した sha の上の別の commit へ進めて終端だけを撃ち直す周と、relocated で本文に run の行を持つ写しの上の先端に main を向けて撃ち直す周の 2 つで、rc 0・1 行 run=便の id terminal=closed・close の理由の sha（着地した sha と写しの sha）・撃ち直しの周の終端の行が PUSHED と CLOSED の 2 件だけ・偽の CI の呼びが 0 回を断言する。歯 vcicut_ci_only_flag_is_unknown（cilast.rs）は、着地した便の land に --ci-only と着地した 40 桁の sha を渡して撃ち、rc 2・stderr の字 未知の引数 --ci-only・event の数が不変を断言する。

      歯（消す・直す）。子と口を測る着地済みの歯を消す: cilast.rs の vcil_terminal_closes_on_the_read_the_wait_saw・vcil_terminal_checks_the_commit_the_push_carried・vcil_terminal_ignores_a_main_moved_after_the_push・vcil_terminal_keeps_its_own_sha_when_the_pushed_commit_is_not_a_descendant・vclhost_land_closes_on_host_green_before_a_red_ci_answer・vclhost_ci_only_red_notifies_and_leaves_the_bead・vclhost_ci_only_green_reads_success_without_a_notice・vclhost_ci_only_refuses_a_value_that_is_not_40_hex_digits、order.rs の pipe_terminal_land_pushes_closes_and_hands_ci_to_the_child・pipe_replay_tip_behind_checks_the_current_main_tip_and_closes・pipe_replay_tip_non_ancestor_closes_without_a_read_and_own_tip_reads_its_sha・pipe_replay_hands_its_rules_to_the_ci_child_only_when_given・pipe_replay_relocate_finds_the_copy_by_run_line_and_checks_the_tip・pipe_terminal_land_ci_failure_wins_over_a_still_running_workflow・pipe_terminal_land_ci_ignores_scheduled_runs・pipe_terminal_land_ci_only_scheduled_runs_is_unmeasurable・pipe_terminal_ci_poll_interval_bounds_the_ci_calls・pipe_terminal_ci_poll_first_check_is_before_the_sleep・pipe_terminal_ci_poll_sleep_never_overruns_the_limit。CI の答えの読みの判定（落ちた run を先に見る・schedule の run を外す・間隔と上限）は lib の歯 fleet/wait.rs の fleet_wait_ci_・retire_parts_ci_read_・vcil_wait_ が後の行まで測る。直す（残す歯のうち、消す助けや定数を使う物と子を断言する物・e2e の歯の file の全部を grep で数えた 5 本と助け 1 本）: order.rs の pipe_terminal_land_close_cwd_survives_a_vanished_driver_cwd（今の 328〜329 行）は settled_rows と parent_rows と ANSWERED と SPAWNED を使わず、親の land.rs の terminal_lines で読んだ便の終端の行が PUSHED（terminal:push:fake）と CLOSED（terminal:close:ok）の 2 件だけと、偽の台帳の cwd が repo を断言する（消えた cwd の作りは今のまま）。order.rs の pipe_replay_relocate_copy_at_the_tip_closes_without_tip は CI の argv の断言を外し、偽の CI の呼びが 0 回と、terminal_lines で読んだ終端の行 PUSHED・CLOSE_REFUSED（terminal:close:failed:rc=1）・PUSHED・CLOSED の 4 件だけと、close の理由 landed 写しの sha host=green を断言する。retire.rs の助け land_train_with_terminal は、列の便ごとに settled_rows で子の答えを待つ注と for の塊（今の 641〜644 行）を消す（子が無いので答えの行は来ず、残すと 1 便ごとに上限 60 秒を待つ）。retire.rs の pipe_train_terminal_every_run_checks_the_tip_ci_and_closes は名を pipe_train_terminal_every_run_closes_without_a_ci_child に替え、列の 3 便の terminal_tail が PUSHED と CLOSED の 2 件ずつ・偽の CI の呼びが 0 回・偽 remote の main が先端の sha を断言する（偽の CI の argv の読みを外す）。pipe_train_tip_close_reason_is_host_green_and_failure_still_closes は 2 周目の parent_rows の断言を、failure を答える偽の CI の列の 3 便の terminal_tail が PUSHED と CLOSED の 2 件ずつに替える（1 周目の close の理由の断言は今のまま）。order.rs と retire.rs の use super::cilast の行は CLOSED と PUSHED の 2 名だけにする。助けを残す形と比べた: settled_rows と parent_rows は子の答えの行を待つ・外す助けで、子の無い終端では待つ物が無く（settled_rows は上限まで待って返る・parent_rows は答えの行が無いと落ちる）、残しても直す歯の数は同じなので、消す形が小さい。使い手の無くなる助けと定数を同じ行で消す（消す歯と直す歯の後の使い手が 0 の物・e2e の全部と lib の歯を grep で数えた）: cilast.rs の PASSED・ci_answer・ci_only_on_the_remote_main・real_git・advance_main・land_with_push_race・raced・SPAWNED・CI_ANSWERS・CHILD_WAIT_S・settled_rows・parent_rows・ci_only・answer_of・landed_for_ci・count_of、order.rs の ANSWERED・UNMEASURABLE・ci_child_recorder・release_recorder・ci_child_argv・ci_with_poll・CI_RUNNING。残す: cilast.rs の FAILED・terminal_rows・landed_sha・PUSHED・CLOSED（vcioff_ と vcicut_ と order.rs・retire.rs が使う）、order.rs の CLOSE_REFUSED・replay_fixture・replay・point_main・relocated（残る歯と vcicut_ が使う）。e2e の pipe/gate.rs と pipe/gate/detection.rs の CHILD_WAIT_S と SPAWNED_DETAIL は着地の後の検出の子の別の名で触らない。lib の歯（src の mod tests）は消す名を使わない。使い手の残りは e2e の clippy の dead_code で照らす。cilast.rs の頭の doc の子と道 1・道 2 の句を外し、残る歯（vcioff_ と vcicut_）の句に直す。pipe_terminal_ci_poll_missing_row_moves_nothing と e2e の land.rs の write_rules_ci は残す（land は後の行まで rules 行 pipe.ci_poll_s を読む）。

      文書（contract-source.md）。§5 の手順 3（GitHub の検査を後から読む）を、終端は close の後に何も起こさない（GitHub の検査は読まない・持ち主の決め D3）の 1 段に替え、--ci-only と ci:spawned・ci:unspawned の句を外す。§53 と §58 の照らす先端の選び（Behind）の句と、末の追記（終端の順の入れ替え）の子の句に、この行で退けた旨の 1 文を足す。

      done と verify の対応。1〜3 つ目の項は verify の 2 行目（e2e の歯 vcicut_）、4 つ目は 3 行目、5〜10 つ目は 4〜9 行目（着地済みの歯の族）が測る。5〜7 つ目の項の直す歯は、消す助けを使っていた残る歯で、各族の filter が当たる。1 行目の clippy は done に載せない守り（消した助けの残りを dead_code で拾う）。xtask の check は器の共通 verify が撃つので書かない。入口の赤は、今の main の終端が子を起こして終端の行に ci:spawned を記すので 1 つ目と 2 つ目の項が落ち、--ci-only を受けるので 3 つ目が落ちる。

      範囲の外。main-red の便の取り込み（--terminal-only の Failed の形・判断の記録 ADR-45 の門 H6）と PR の便の retire の照合が読む CI（read_ci・fleet の ci_read・ci_wait）、終端の語 ci:failure・ci:unmeasurable と TERMINAL_TOKENS、close の理由の尾 ci=success、宣言の鍵 ci-watch と ci-cmd、rules 行 pipe.ci_wait_s と pipe.ci_poll_s、局面の段 run-ci-waiting、tsuzuri の board の CI の印は替えない（後の行）。鍵 ci-watch はこの行の後も取り込みと retire の断りを決めるので、根の .vessel.toml は替えない。
  - n: 19
    type: prose
    title: 行 v-pf-contract — preflight に契約の file を直に渡す口（memo t3-hub.92.7・作り直し v4 の段 S4 の 1 本目・設計だけの行）
    body: |
      在りか。差の file は無い（設計だけの行・決め D2）。便は 5 file を書く。器の scribe2/crates/scribe2/src/pipe/cli/preflight.rs に口 --contract の読みを足し、scribe2/crates/scribe2/src/pipe/cli/intake.rs の関数 generated を 2 つに割り（base の木から読む前段と、行の本文から契約を組む後段 generated_from）、器の e2e の受付の子 module scribe2/crates/scribe2-boundary/tests/e2e/pipe/intake/vpfcon.rs に歯 5 本を足し、親 scribe2/crates/scribe2-boundary/tests/e2e/pipe/intake.rs に行 mod vpfcon; の 1 行を足し（今の行 mod vpfgap; の次）、scribe2/docs/design/contract-source.md の 21 節に 1 行を足す。args.rs の ALLOWED_PREFLIGHT は旗 --contract を既に受ける（V・pipe/cli/args.rs の 137 行）ので替えない。help.rs と refuse.rs と受付の intake の read_args は替えない。

      なぜ。持ち主は作り直し v4 で、契約の正本を台帳の bead に移し、preflight に契約の file を直に渡す口を足し、設計係が自分の作業の中で preflight を rc 0 まで撃つと決めた（決め D1・判断の記録 ADR-72 の決定 (2)・段の memo t3-hub.92.7）。今の preflight は受付と同じく base の木（HEAD）の契約表の行だけを読み（pipe/cli/intake.rs の generated が show_head で読む・V）、契約を試すには適用・導出・commit の後に床の写しで撃つ回り道が要る（ADR-72 の背景・V）。決定はしご。要るか: 契約を bead に移した後も、設計係が置く前に撃つ口が要り、移す前の今も同じ回り道を消せる。既に在るか: 判定の 1 本 judge と、契約表の 1 行の検査 check_row と、Promised の行の生成は在り、行の本文の出所だけを替えればよい。judge の中で行を読み直す pointed_row と節の本文を読む review の design_text と裁定の section_of は、どれも table::read（repo.join(path) を fs::read_to_string で読む・pipe/table/check.rs の 765 行）で読み、Rust の Path::join は絶対 path を渡すとその path に替わるので、pointer の path を file の絶対 path にすれば同じ file を読む（V・code と std の決まり）。新しい判定の関数と新しい断りの名は足さない。

      形（preflight.rs）。
      - 関数 checked の頭で、旗 --contract が在れば契約の file の周、無ければ今の read_args の周にする。--contract の周の引数の読みは関数 read_contract_args（新しい・preflight.rs の中）が持ち、--bead と --repo の読みは read_args と同じ need と repo_flag を使う。
      - 断りは 4 つで、どれも refused（rc 1・stdout 0 byte・stderr の 1 行）で返し、末尾の判定行を積まない（今の引数の断りと同じ形）。字は次のとおり（<…> は値）。
        両方の断り: pipe: --design と --contract は 1 つだけ渡す
        placed の断り: pipe: --placed は --design と使う
        拡張子の断り: pipe: --contract <渡した字> は .toml の file でない
        行の数の断り: pipe: 契約の file は [[contract]] の行を 1 つだけ持つ（<数> 行）
