  note: 作り直し v4 の行の置き場。生きたノートの上限（規則の行 R-31）のため、32 行の全部が着地したノート surface-wave29a を同じ commit で廃止した（生きたノートは 6 本のまま）。第 0.1 版（2026-10-06）は目的の節と空の契約表を置いた。行は段ごとの係の起草（設計だけ・差の file と噛みは無い）で足す。 第 0.2 版（2026-10-06）は、memo t3-hub.92.3（作り直し v4 の段 S6・持ち主の決め D3）の行 3 本を足した。tsuzuri の行 t-daily-deny（日に 1 度の全部の撃ちが check の後に写しの孤児の照らしと依存の監査 2 本を撃つ）、器の行 v-ci-watch-off（器の宣言の任意の鍵 ci-watch・値 false の repo は終端で GitHub の検査を読まず、main-red の便の取り込みと PR の便の retire を語 ci-off で断る）、tsuzuri の行 t-ci-stop（ci.yml を撃たれない置き場へ移し、根の宣言で鍵を切り、ci.yml を読む歯を消すか直す・前の 2 行に依る）。3 本とも係 w309a の設計だけの行（差の file と噛みは無い）。 第 0.3 版（2026-10-06）は、便 t3-hub.92.3.1 の契約審査の FAIL（check の後の段は Command が親の環境を継ぐので、daily 自身の check と CI の check が置く 2 つの環境変数が子に渡り、done の 2 つ目の項と食い違う）を受け、行 t-daily-deny の節 3 に 2 つの環境変数を子の環境から外す字を足し、done の 2 つ目の項の字を合わせた。 第 0.4 版（2026-10-06）は、便 t3-hub.92.3.1 の 2 度目の契約審査の FAIL（vacuous-assert・歯は process の環境変数を置けず、gate の verify も置かないので、env_remove の無い実装が通る）を受け、行 t-daily-deny に AFTER の段の Command を組む関数 after_command と、その get_envs で外すことを測る done の 7 つ目の項と歯 vdaily_after_steps_drop_the_check_env を足した。 第 0.5 版（2026-10-06）は、便 t3-hub.92.3.1 の 3 度目の契約審査の FAIL（節の頭の足す歯の数が 2 本のまま・done の 5 つ目の項の時機を歯が測らない）を受け、行 t-daily-deny の節 3 の頭を歯 3 本の名指しに直し、偽の cargo が check の撃ちで refs_dir の項目の数を記録して done の 5 つ目の項が時機を測る形にした。 第 0.6 版（2026-10-06）は、判断の記録 ADR-73（憲法 第 1.5 版・条 P-13.1 の改め・持ち主の裁定 t3-hub.92.1.2〔逐語 推奨で良い〕）の行 t-seat-manners（tz derive の要の写しから条の題の行を外し、規則の表の作法の行を段 席の作法 の下に写す・起草は係 w308a・節 6）を足した。 第 0.7 版（2026-10-06）は、memo t3-hub.92.5（作り直し v4 の段 S3・持ち主の決め D5）の器の行 2 本を足した。行 v-wip-lines（圧縮の後の文脈で作業中の bead の定型の行を [RECENT-WIP-LINE] で出す・節 11）と行 v-sort-gist（要望の仕分けは結び先の memo の notes が発話の時刻を引く時だけ通す・節 12）で、起草は係 w315a。turn の終わりの門の 2 つ目の止め（要望の時刻の行が無い時）は、Stop で台帳を読まず、仕分けの口の断り no-gist と今の未仕分けの発話の門の 1 度の止めで作る（席の決め・t3-hub.92.5 の notes）。 第 0.8 版（2026-10-06）は、memo t3-hub.92.2（作り直し v4 の段 S2 の 2・持ち主の決め D2・判断の記録 ADR-72 の決定 (3)）の行 ag-designer（plugin の起草係の型 drafter の本文を設計係の本文に置き換え、係の手引きと参照の file から組み・差の file・噛み・床の記録・畳み・適用の script の手順を外す・節 7）を足した。起草は係 w313a。参照の file の歯の置き方の句（新しい行の歯は新しい file で足し、群の main.rs と module を書かない）は今の決まりのまま替えない（席の決め・t3-hub.92.2 の notes）。 第 0.9 版（2026-10-06）は、行 v-wip-lines の契約審査の FAIL（done の 4 つ目の項が、偽の bd の作業中の bead 2 本に対して [RECENT-WIP] の行を 1 行と書いていた）を受け、その項を w-1 と w-2 の 1 行ずつの 2 行に直した。 第 0.10 版（2026-10-06）は、memo t3-hub.92.8（作り直し v4 の段 S5・持ち主の決め D6・判断の記録 ADR-72 の決定 (7)）の器の行 v-gate-fix（pipe run と pipe resume で審査役だけの gate の FAIL の便を同じ worktree の runner の起こし直しで最大 2 周直す・節 9 と節 10）を足した。起草は係 w314a。席は調べ係 r316 の数え（輪で振る舞いの変わる e2e の歯は 0 本・行と kind を足すと数の pin 2 本が動く）を受け、kind の母集団の pin の歯を done と verify に足した。決定 (7) の字との差（差の全部を審査し直す・重さで絞らない・新しい process で起こす）は席の決め（t3-hub.92.8 の notes）。 第 0.11 版（2026-10-06）は、行 v-gate-fix の契約審査の FAIL を受け、直しの周に入る条件を「便の最後の RunStage が Gated の FAIL」に直し（直しの周の runner が rc 0 でなく終わった便を起こし直さない）、その歯 gfix_failed_fix_round_stops_without_another_round の項を足し、外形の snapshot の項を行と kind の数の字に直した。 第 0.12 版（2026-10-06）は、起草係 5 体の行を 1 本ずつ足した。段 S3 の行 t-memo-link-gate（memo の起票の繋ぐ門・節 13・係 w317a）、段 S2 の行 ag-floor-off（係の終える前の門の床の照らしと撃ち直しを退ける・節 15・係 w318a）、段 S6 の行 v-ci-child-cut（器の着地の後の CI の子を退ける・節 17・係 w319a）、段 S4 の行 v-pf-contract（preflight に契約の file を直に渡す口・節 19 と 20・係 w320a）、段 S9 の行 t-ruling-gui（配達の読みが器の裁定の行の経路 gui も読む・節 21・係 w321a）。席の決めとして、t-memo-link-gate の候補は閉じた memo も含む（直った問題の再発を古い memo に繋ぐ）。裁定の書き手は器の seat ruling answer の 1 本に寄せる。要件 FR21 から床の記録と撃ち直しの文 3 つを外した（行 ag-floor-off の範囲・行の便は srs.yaml を書かない）。 第 0.13 版（2026-10-06）は、行 ag-floor-off の契約審査の FAIL（歯が境界の main.rs の字 [--tz の不在を見るが、口 tz surface serve の USAGE が範囲の外で [--tz <program>] を持つ）を受け、不在を見る字を消す前の口の doc の行の字 [--drafts <dir>] [--tz に狭めた。 第 0.14 版（2026-10-06）は、行 ag-floor-off の 2 度目の契約審査の FAIL（歯の file agshp.rs の見本が stop.rs の字 pub mod floor; を使う・subagent_stop.rs の床の段は 14 行目と 15 行目の 2 行）を受け、agshp.rs を write-set と verify と done に足し、外す doc の行を直した。 第 0.15 版（2026-10-06）は、行 v-pf-contract の契約審査の FAIL（歯の toy の行 a が差し替え無しだと verify が宣言の共通 verify と同じで断られ、write-set の導出の材料も無い）を受け、toy の行の verify を歯 vpfgap_ の通る見本と同じ nextest の 1 行に差し替える形に直した。 第 0.16 版（2026-10-06）は、行 v-ci-child-cut の契約審査の FAIL（消す助けを残す歯 order.rs の 2 本と retire.rs の助けが使う・要件 FR1050 が close の後の CI の照合を求める）を受け、消す名 23 個と残す名 10 個を節 17 に列挙し、直す歯 4 本の断言を done に足した（起草は係 w323a）。同じ commit で要件 FR1050 と受入 AC1023 から close の後の CI の照合の字を外した。 第 0.17 版（2026-10-06）は、起草係 3 体の行を 1 本ずつ足した。段 S3 の行 v-turn-wip-stale（turn の終わりの門で、台帳か設計を書いたのに作業中の bead の定型の行が古い turn を 1 度だけ止める・節 25 と 26・係 w326a）、段 S7 の行 v-lens-ask（審査役の雛形 3 つから迷った時の既定の文と機械で止まる禁止の文と上限の無い外の読みを外す・節 27 と 28・係 w327a）、段 S8 の行 ag-ladder-verifier（検証役の型に決定はしごの段と消す物の名指しを書かせる 1 行・節 29・係 w328a）。席の決めとして、判定の語 INCONCLUSIVE は名を替えず意味だけを絞る（語を読む器の 49 file と記録の語を替えない）。 第 0.18 版（2026-10-06）は、段 S4 の条 P-28 の改めの前に流せる 2 行を足した。行 v-pf-literal（preflight だけの断りで、done の項が二重鉤括弧で名指す字が節の本文に無い項を名指す・節 23）と行 t-stop-preflight（係の終える前の門が、係の出した契約の file ごとに preflight を撃ち直して 1 度止める・節 24・depends は ag-floor-off と v-pf-contract）。起草は係 w325a。 第 0.19 版（2026-10-06）は、行 v-turn-wip-stale の契約審査の FAIL（要件 FR1088 が turn の終わりの判定で台帳を読まないと書く）を受け、同じ commit で要件 FR1088 の字を決め D5 に合わせて直し、節 25 の末にその 1 文を足した。 第 0.20 版（2026-10-06）は、行 v-pf-contract の便の gate の FAIL（便 t3-hub.92.7.1-20261006T111631Z・節 19 の各歯が置き場の run dir の空を見る字を、done の項が測っていなかった）を受け、done の 2 つ目から 4 つ目の項に、撃ちが置き場に run dir を作らない句を足した。 第 0.21 版（2026-10-06）は、段 S4 の契約を bead に置く移しの行 7 本を足した（持ち主の裁定 t3-hub.92.7.2 の承認の後に流し、全部の着地と器の binary の入れ替えの後に切り替えの設計の commit を置く）。器の行 v-bead-intake（受付と preflight が契約の bead を読み写しを置く・節 30・係 w331a）・v-bead-dispatch（列の候補と列外の鍵・節 31・係 w332a）・v-bead-ledger（台帳の形の判じと局面の出力・節 32・係 w333a）と、tsuzuri の行 t-graph-bead（導出グラフと板の札・節 33・係 w334a）・t-prose-bead（契約の bead の本文に散文の門・節 34）・t-plan-cap（計画の memo の本数の上限・節 35・係 w335a と w338a）・t-code-bead（tz code が台帳の契約を読む・節 38・係 w336a）。 第 0.22 版（2026-10-06）は、行 v-ci-child-cut の便の gate の FAIL（便 t3-hub.92.3.4-20261006T115808Z・歯を足した order.rs の頭の doc に接頭辞 vcicut_ の句が無い）を受け、節 17 の歯の段に、頭の doc に句を足す file を cilast.rs と order.rs と名指した。 第 0.23 版（2026-10-06）は、段 S4 の移しの行 4 本を足し（v-bead-reads〔gate と審査の索引と resume が受付の写しを読む・節 37・係 w339a〕・v-bead-precheck〔事前審査と直しの束と memo の同梱の引き金が契約の bead を読む・節 39・係 w337a と w340a〕・v-bead-reads-b〔起こしの touches と preflight の広がりと審査の索引の母集団・節 41〕・v-bead-trailer〔写しの便の着地の trailer の値を bead の id と井桁と行の id に・節 42・係 w341a〕）、置いた行 v-bead-intake（関数 copy_pointer と子 module の宣言）と v-bead-dispatch（受付の照らしの bead_contract の呼びと cli.rs の re-export）を事前審査の呼びに合わせた（係 w342a）。第 0.24 版（2026-10-06）は行 t-prose-bead の write-set に着地済みの歯の file tests/tspf.rs を足し、節 34 にその歯の memo の見本の直しを書き、verify に tspf_ の 1 行を足した（便 t3-hub.92.7.11 の実装役の問い・まだ分からない を欠けにする決めは替えない）。第 0.25 版（2026-10-06）は契約の審査の literal-mismatch の所見を受け、行 t-prose-bead の verify の tspf_ の行を末の 7 行目へ移して done の 10〜13 つ目の行の番号を元に戻し、tspf_ を測る 14 つ目の項と done-teeth の 14:@7 を足し、節 34 の在りかの file の数を 9 に直した（席）。第 0.26 版（2026-10-06）は契約の審査で落ちた行 v-bead-intake を直した（断りの語の列の末に 5 語を足すと動く着地済みの歯 3 本〔refuse.rs の pin と code-facts の 2 断りと在り処の表〕の直しの字・RuleKind の網羅 match の has_permit_reader の腕・bead の周の置き場の断りを節 30 と done と verify に足した・係 w358a）。e2e の親 intake.rs に mod の 1 行を足すので growth に 1 行を足した（席）。

sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      持ち主は 2026-10-06 に、tsuzuri のワークフローを作り直すと決めた（決め D1〜D6 は全部推奨・memo t3-hub.91.4 の notes 2026-10-06 08:11・発話 2026-10-06T08:08:35.348Z の逐語の頭「D1-6はすべて推奨で」）。D1 は契約の正本を台帳の bead に移して設計ノートを退ける。D2 は起草係を設計だけにし、差の file・噛み・適用の script を止める。D3 は main への push ごとの CI を止め、日に 1 度の全部の撃ち（xtask daily）に寄せる。D4 は memo の起票に繋ぐ門を置く。D5 は作業の状態を台帳の作業中の bead に置き、turn の終わりの門で古さを止める。D6 は gate の FAIL を終端にせず、便の中で 2 周まで直す。

      置き場。作業中の計画の正本は台帳の epic t3-hub.92 と、子の段の memo（S1〜S9）である。このノートは、その段の行を D1 の着地まで置く仮の置き場で、D1 の着地の後に廃止する。行は差の file を持たない設計だけの行で、便の実装役が契約の節の字から書く（D2）。
  - n: 2
    type: contract-table
    title: 契約表
    rows:
      - id: t-daily-deny
        title: '日に 1 度の全部の撃ち（xtask の daily）が、check の後に歯の写しの孤児の照らし（insta-refs）と依存の監査（根と scribe2 の cargo deny の 2 本）を順に撃ち、落ちた段の名を記録の行と memo に書く（持ち主の決め D3・memo t3-hub.92.3・設計だけの行）'
        req: ["NFR3"]
        section: "3"
        write-set: ["xtask/src/daily.rs", "xtask/tests/teeth1/vdaily.rs"]
        verify: ["cargo clippy -p xtask --all-targets --no-deps -- -D warnings", "cargo nextest run -p xtask --test teeth1 --no-tests=fail vdaily_"]
        size: M
        done: '(1) 定数 AFTER は 3 段をこの順に持ち（段 insta-refs は cargo の引数 run -q -p xtask -- insta-refs と cwd 写しの根・段 deny は引数 deny check -D unmatched-skip -D advisory-not-detected と cwd 写しの根・段 deny-scribe2 は引数 deny check と cwd scribe2）、定数 REFS_ENV は字 INSTA_SNAPSHOT_REFERENCES_FILE で src/snaprefs.rs の同じ名の定数の行と一致し、fn refs_dir は出力の file の拡張子を insta-refs に替えた path を返す（歯 vdaily_consts_fixed） (2) 全部の段が通る周は、偽の cargo がこの順に 4 度撃たれ（check は cwd 写しの根で FORCE の環境変数と、値が refs_dir の下の insta-refs.txt の REFS_ENV と、行 refs-entries=0 を持つ・insta-refs は引数の末に refs_dir の path を持ち 2 つの環境変数を持たない・deny は cwd 写しの根・deny-scribe2 は cwd 写しの scribe2）、出力の file は 4 度の撃ちの出力をこの順に持ち、記録の行は step=check rc=0 memo=- で台帳に書かない（歯 vdaily_pass_records_no_memo） (3) check の後の 3 段のどれか 1 段の偽の cargo が rc 0 でない周は、記録の行が step=その段の名 rc=その rc memo=fx-9 で、その段より後の段を撃たない（歯 vdaily_after_step_failure_names_the_step） (4) check が落ちた周は check の後の段を 1 つも撃たない（歯 vdaily_after_step_failure_names_the_step） (5) check を撃つ時、refs_dir は在って項目が 0 で（偽の cargo が check の撃ちで数えて記録した行 refs-entries=0）、撃つ前に refs_dir の下に置いた古い file は撃った後にも無い（歯 vdaily_refs_dir_emptied_before_check） (6) 着地済みの歯 vdaily_fail_memo_then_recur と vdaily_fetch_and_bdw_failures と vdaily_units_template と vdaily_main_wiring が緑のまま（verify の 2 行目） (7) AFTER の 3 段のそれぞれについて、fn after_command が返す Command は、program が NICE の program で、引数が NICE の引数・Daily の cargo・段の引数（段 insta-refs は末に渡した refs の path）の順で、cwd が写しの根か写しの根の下の dir scribe2 で、get_envs が FORCE の名と REFS_ENV の名をどちらも値 None（外す）で持つ（歯 vdaily_after_steps_drop_the_check_env）'
        done-teeth: ["1:@2", "2:@2", "3:@2", "4:@2", "5:@2", "6:@2", "7:@2"]
        depends: []
      - id: v-ci-watch-off
        title: '器の宣言に任意の真偽の鍵 ci-watch を足し、値 false の repo の land の終端は push とこの host の緑の close だけを撃って GitHub の検査の子を起こさず、main-red の便の取り込みと PR の便の retire は CI を読まずに語 ci-off の 1 行で断る（鍵が無いか true の repo は今の動きのまま・持ち主の決め D3・memo t3-hub.92.3・設計だけの行）'
