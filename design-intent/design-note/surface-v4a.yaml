    body: |
      持ち主は 2026-10-06 に、tsuzuri のワークフローを作り直すと決めた（決め D1〜D6 は全部推奨・memo t3-hub.91.4 の notes 2026-10-06 08:11・発話 2026-10-06T08:08:35.348Z の逐語の頭「D1-6はすべて推奨で」）。D1 は契約の正本を台帳の bead に移して設計ノートを退ける。D2 は起草係を設計だけにし、差の file・噛み・適用の script を止める。D3 は main への push ごとの CI を止め、日に 1 度の全部の撃ち（xtask daily）に寄せる。D4 は memo の起票に繋ぐ門を置く。D5 は作業の状態を台帳の作業中の bead に置き、turn の終わりの門で古さを止める。D6 は gate の FAIL を終端にせず、便の中で 2 周まで直す。

      置き場。作業中の計画の正本は台帳の epic t3-hub.92 と、子の段の memo（S1〜S9）である。このノートは、その段の行を D1 の着地まで置く仮の置き場で、D1 の着地の後に廃止する。行は差の file を持たない設計だけの行で、便の実装役が契約の節の字から書く（D2）。
