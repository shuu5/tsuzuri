  - n: 3
    type: prose
    title: 行 t-daily-deny — 日に 1 度の全部の撃ちに写しの孤児の照らしと依存の監査 2 本を足す（memo t3-hub.92.3・設計だけの行）
    body: |
      在りか。差の file は無い（設計だけの行・作り直し v4 の決め D2）。便は 2 file を書く。xtask/src/daily.rs に段の定数と段の撃ちを足し、xtask/tests/teeth1/vdaily.rs の fixture を 4 度の撃ちに合わせて直し、歯 3 本（vdaily_after_step_failure_names_the_step・vdaily_refs_dir_emptied_before_check・vdaily_after_steps_drop_the_check_env）を足して着地済みの歯 2 本（vdaily_consts_fixed・vdaily_pass_records_no_memo）の断言を伸ばす。群の main.rs と kfold の表は書かない（module を足さない）。systemd の雛形（xtask/systemd/tsuzuri-daily.service と .timer）と main.rs の呼びは替えない。depends は空（行 v-ci-watch-off とは触る file が交わらず並べる）。

      なぜ。持ち主は 2026-10-06 に、main への push ごとの GitHub の CI を止め、日に 1 度の全部の撃ち（xtask の daily）に寄せると決めた（決め D3・作業中の計画の正本は台帳の epic t3-hub.92・段の memo t3-hub.92.3）。器の着地の門が同じ xtask の check を着地の直前の木で撃つので、CI の job check（8 割り）は重なっている。ただし CI の 11 job のうち 3 つ（根の依存の監査 deny・器の依存の監査 scribe2-deny・歯の写しの孤児の照らし insta-refs）は着地の門の check に無い。この行はその 3 つを daily へ先に移し、CI を止める行 t-ci-stop が監査の穴を作らないようにする。決定はしご。要るか: 依存の監査は憲法の条 P-26.5 が求める。既に在るか: daily の段の撃ちと落ちの memo と記録の行（xtask/src/daily.rs の fn shoot と fn tell）と、写しの孤児の判じ（task insta-refs・xtask/src/snaprefs.rs）と、cargo-deny 0.20.2（ci.yml が pin する版と同じ・host の ~/.cargo/bin に在り、systemd の雛形の PATH が持つ）をそのまま使い、段を足すだけにする。

      条 P-26.5 の読み。条の字「依存の重複した版・脆弱性・使ってよい条件（ライセンス）を CI で監査する」は、平易の文が「自動の検査（CI）で監査します」と書くので、日に 1 度の自動の撃ち（host の利用者の timer が撃つ daily）で満たすと読み、条の字は替えない。規則の行 R-5（CI 5 分以下）は検出線なので替えない。

      形（xtask/src/daily.rs）。足す定数と関数は次の 3 つ（字は二重引用符で囲んだ Rust の字の literal・節は二重引用符を書けないので囲みを省いて書く。戻し方は、各段の名と各引数と環境変数の名と拡張子の字を、それぞれ両側を二重引用符で囲む）。

        /// check の後の段（段の名・cargo の引数・写しの根からの cwd〔空の字は根〕）。最初の段 insta-refs だけ、引数の末に refs_dir の path を足す。
        pub const AFTER: &[(&str, &[&str], &str)] = &[
            (insta-refs, &[run, -q, -p, xtask, --, insta-refs], ),
            (deny, &[deny, check, -D, unmatched-skip, -D, advisory-not-detected], ),
            (deny-scribe2, &[deny, check], scribe2),
        ];

        /// 入れ子の段の歯が読んだ写しの path を足す file を名指す環境変数（src/snaprefs.rs の REFS_ENV と同じ名）。
        pub const REFS_ENV: &str = INSTA_SNAPSHOT_REFERENCES_FILE;

        /// 読んだ写しの file を置く dir（出力の file の拡張子を insta-refs に替えた path）。
        pub fn refs_dir(out: &Path) -> PathBuf

      AFTER の 1 つ目の段の空の cwd の字は二重引用符 2 つ（空の字）で、ほかの 2 段も同じく 3 つ目の項を持つ（deny は空の字・deny-scribe2 は scribe2）。

      形（段の撃ち・fn shoot）。段の順は fetch → checkout → 出力の file を作る（落ちれば段 out と rc 1・今のまま）→ refs_dir を空で置く（前の dir を消して作り直す・落ちれば段 refs と rc 1）→ check → AFTER の 3 段。check の撃ちは今の argv と cwd と FORCE の環境変数に、環境変数 REFS_ENV（値は refs_dir の下の file insta-refs.txt の path）を足す。AFTER の段は、NICE の program と引数・cargo の program・段の引数（insta-refs の段は末に refs_dir の path）を、cwd を写しの根（cwd の字が空）か写しの根の下の dir（scribe2）にして撃ち、FORCE と REFS_ENV の 2 つの環境変数を子の環境から外す（Command の env_remove で外し、親の process がどちらかを持っていても子に渡さない。daily 自身の check と CI の job check は入れ子の段の歯を撃つ時に 2 つを置くので、外さないと歯 vdaily_ を撃つ process から子へ継がれる・便 t3-hub.92.3.1 の契約審査の見つけ）。AFTER の段の Command は新しい関数 pub fn after_command(d: &Daily, step: (&str, &[&str], &str), refs: &Path) -> Command が組む（program・引数・cwd・2 つの env_remove までを持ち、stdout と stderr は持たない。cwd は段の 3 つ目の字が空なら Daily の root そのもの、空でなければ root にその字を join した path）。fn shoot は AFTER の項ごとに after_command を呼び、出力の file への stdout と stderr を足して撃つ。歯は process の環境変数を置けない（workspace は unsafe を禁じ、edition 2024 の set_var は unsafe）ので、外すことは after_command の返す Command の get_envs で測る。AFTER の段の stdout と stderr は出力の file の末に足す（追記で開き、開けなければ段 out と rc 1）。最初に rc 0 でない段の名と rc を返し、後の段は撃たない。全部の段が通れば今のまま段 check と rc 0 を返す（記録の行の形と open_memo の読みは替えない）。check の出力の file は今のまま撃つたびに作り直す。

      形（memo の本文・fn memo_body）。観測の 1 行の「xtask の check を撃ち、段 X が」の所を「xtask の check と、check の後の段（insta-refs・deny・deny-scribe2）を順に撃ち、段 X が」に替える。ほかの字（origin/main と sha の木・出力は file と記録は file の句・4 つの節の見出し・引き金）は替えない。module の頭の doc は、撃つ物に check の後の 3 段を足した字に直す。

      done と verify の対応。全部の項は verify の 2 行目（群 teeth1 の歯 vdaily_）が測る。1 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので verify に書かない。入口の赤は、main の daily.rs が AFTER と REFS_ENV と refs_dir を持たないので歯の file の組み立てが落ちる（2 行目が組み立ての失敗で rc 0 でない）。

      歯（xtask/tests/teeth1/vdaily.rs）。fixture の偽の cargo は、撃たれた回数を file cargo.n に数え、1 度ごとに cwd（pwd -P）と環境変数 TSUZURI_CHECK_NESTED_ALL と環境変数 INSTA_SNAPSHOT_REFERENCES_FILE の値と引数の全部と区切りの行 --- を file cargo.seen の末に足し（環境変数 INSTA_SNAPSHOT_REFERENCES_FILE を持つ撃ちでは、区切りの行の前に、その値の親の dir の項目の数を字 refs-entries= に続けた 1 行も足す）、stdout に out- と回数の 1 行を出し、file cargo.rc.<回数> の rc（file が無ければ 0）で終える。Fx の shoot は撃つ前に cargo.n と cargo.seen と cargo.rc の file を消し、渡された rc を cargo.rc.1 に書く（1 度目の撃ちが check）。origin の最初の commit に scribe2/ の下の file を 1 つ置き、写しに dir scribe2 を持たせる（無いと段 deny-scribe2 の cwd が無く rc 127）。歯 vdaily_consts_fixed に、AFTER の 3 段の字（段の名・引数・cwd）と、REFS_ENV の字と、read_root で読んだ xtask/src/snaprefs.rs が行 pub const REFS_ENV: &str = INSTA_SNAPSHOT_REFERENCES_FILE;（字の値は二重引用符で囲む）を持つことと、refs_dir の値（daily.out から daily.insta-refs）を足す。deny の段の引数は、依存の監査の着地済みの 1 行（行 k-deny の ci.yml の job deny の run の字）から頭の cargo を除いた字と同じである。歯 vdaily_pass_records_no_memo は、cargo.seen が 4 度の撃ちの字（上の done の 2 つ目の項の cwd と環境変数と引数）をこの順に持ち、出力の file が out-1 から out-4 の 4 行で、記録と台帳の断言は今のままであることを断言する。新しい歯 vdaily_after_step_failure_names_the_step は、check の後の 3 段のそれぞれについて、その段の回数の rc を 3 にした撃ちの記録の行の段と rc と memo（fx-9）と、cargo.n がその段の回数で止まることを断言し、check の rc を 3 にした撃ちでは cargo.n が 1 であることを断言する。新しい歯 vdaily_after_steps_drop_the_check_env は、AFTER の 3 段のそれぞれを fixture の Daily と refs の path で after_command に渡し、返る Command の get_program と get_args の列と get_current_dir と、get_envs の中の FORCE の名と REFS_ENV の名の項がどちらも値 None であることを断言する（偽の cargo は撃たない）。新しい歯 vdaily_refs_dir_emptied_before_check は、撃つ前に refs_dir の下に古い file を置き、check の撃ちの cargo.seen の記録が行 refs-entries=0 を持つこと（check の時に dir が空）と、撃った後にその file が無く dir が在ることと、check の撃ちの REFS_ENV の値が refs_dir の下の insta-refs.txt であることを断言する。module の頭の doc に、check の後の 3 段を偽の cargo の回数で照らす句を足す。噛みは撃たない（作り直し v4 の決め D2・設計だけの行）。

      未確か（I）。分割の無い check（daily は TSUZURI_CHECK_PARTITION を置かない）は入れ子の段の歯を全部撃つので、写しを読む歯が REFS_ENV の file を 1 本作り、段 insta-refs は役の file 1 本で照らす（snaprefs の fn run は 1 本以上で通る）。daily の写しで初めて撃つ夜に段 insta-refs が落ちたら、daily の memo が落ちの段を名指す。段 deny は advisory-db を網から取るので、網の無い夜は段 deny が落ちて memo になる（systemd の TimeoutStartSec の 2 時間は足りる）。

      範囲の外。CI の ci.yml と、ci.yml を読む歯は替えない（行 t-ci-stop）。systemd の雛形の注（TSUZURI_DAILY_OUT の説明）は替えない（出力の file は全部の段の出力を持つが、雛形の字は歯 vdaily_units_template が固定し、注は手で読む物）。評価の撃ち（eval-daily）は替えない。
  - n: 4
    type: prose
    title: 行 v-ci-watch-off — 器の CI の見張りを切る宣言の鍵（memo t3-hub.92.3・設計だけの行）
    body: |
      在りか。差の file は無い（設計だけの行・作り直し v4 の決め D2）。便は器の src 5 file と器の e2e の歯 4 file と器の設計の文書 1 file を書く。宣言の鍵の名と読み手と外へ渡す口を scribe2/crates/scribe2/src/pipe/declaration/optional_keys.rs に、Declared の欄と parse の読みの 1 行ずつを親 declaration.rs に足し（optional_keys.rs の module の doc の足し方のとおり）、終端の分岐を land/finish.rs に、取り込みの断りを pipe/cli/step.rs の fn adopt に、retire の断りを pipe/retire.rs の fn prove に足す。歯は宣言の読みを optional_keys.rs の tests module に 1 本、外形を e2e の子 module の cilast.rs・redclose.rs・retire.rs に 1 本ずつ足し、宣言の末に鍵の行を足して commit する助けを親 module の tests/e2e/pipe/land.rs に 1 つ足す（子は use super::* で使う）。depends は空（行 t-daily-deny とは触る file が交わらず並べる）。

      なぜ。持ち主の決め D3（push ごとの CI を止める・memo t3-hub.92.3）で ci.yml を止めると、器の land の終端は着地のたびに着地の後の CI の口（pipe land --ci-only）の子 process を起こし、run の無い commit を rules 行 pipe.ci_wait_s の 900 秒まで pipe.ci_poll_s の 30 秒ごとに gh で読み、最後に ci:unmeasurable を 1 件記して終わる（land/finish.rs の fn terminal の (3) の段と fn read_ci・fleet/wait.rs の ci_read が run 0 本を Pending に読む）。赤にも alarm にもならないが、便ごとに 15 分の子と gh の呼び約 30 回と、閉じた bead の札の「CI 測れず」が残る。宣言の鍵 remote を外すと push も止まり、daily が写しを origin の main から fetch するので daily も新しい main を見なくなる（xtask/src/daily.rs の定数 FETCH）。だから CI だけを切る鍵が要る。決定はしご。要るか: 要る（上）。既に在るか: 真偽の任意の鍵の読み手 bool_key（teeth-check・build-lanes と同じ）と、取り込みの断りの 1 行の形（run=id adopt=語・rc 1）と、retire の断りの閉じた語（run=id retire=語・rc 1）をそのまま使い、語を 1 つずつ足すだけにする。見張りの code そのものの削除（spawn_ci・ci_only・CiRead・終端の語 ci:failure と ci:unmeasurable・鍵 ci-cmd・rules 行 pipe.ci_wait_s と pipe.ci_poll_s）は後の段の行で、この行は消さない。

      形（宣言）。鍵の名は ci-watch（値は真偽だけ）。optional_keys.rs に const CI_WATCH_KEY（字 ci-watch・鍵 ci-cmd の定数の直後）と読み手 ci_watch_of（bool_key を呼ぶだけ）を足し、DECLARED_KEYS と OPTIONAL_KEYS の列の CI_CMD_KEY の直後に CI_WATCH_KEY を 1 行ずつ足す。親 declaration.rs の Declared に欄 ci_watch（Option<bool>）を、parse に ci_watch_of の読みを 1 行ずつ足す。pub fn ci_watch_on(declared: &Declared) -> bool は、欄が Some(false) の時だけ偽を返す（鍵の無い宣言と true は真）。TerminalFacts に欄 ci_watch（bool・ci_watch_on の値）を足し、fn terminal_facts が埋める。型違いの断りの字は bool_key の今の字（鍵の名と true か false の真偽だけである）のまま。歯 declaration_kind_passes_declarations_without_cargo_and_keeps_the_schema の DECLARED_KEYS の列の断言に ci-cmd の直後の ci-watch を足し、その doc の鍵の本数の句を 1 本増やす。

      形（終端・land/finish.rs の fn terminal）。facts.ci_watch が偽の周は、(1) push と (2) この host の緑の close を今のまま撃ち、(3) の段（spawn_ci と、照合する commit の無い周の ci:unmeasurable の記し）を撃たずに close の結末を返す。push の後の先端の読み（pushed_past と merge-base の照らし）も撃たない。受け入れの周（PushTip::Adopted）には来ない（下の取り込みの断りが先に止める）が、来た周は CI を読まずに Terminal::CiUnmeasurable を返す（close しない・FailClosed のまま）。鍵が真の周は今のまま。fn terminal の doc に鍵が偽の周の 1 文を足す。

      形（取り込み・pipe/cli/step.rs の fn adopt）。const CI_OFF（字 ci-off）を NOT_RED などの語の並びに足す。red_of が真を返した後、宣言の remote を読む前に facts.ci_watch が偽なら declined(CI_OFF) を返す（stdout の 1 行 run=id adopt=ci-off・rc 1・何も書かず何も撃たない）。理由: 主実測が赤か測れなかった便を受け入れる周は、この host の緑が無く、先端の CI の success だけが緑の証拠で、CI を止めた repo にはその証拠が無い。便は新しい便で撃ち直す。fn adopt の doc の受け入れない周の語の列に ci-off を足す。

      形（retire・pipe/retire.rs）。enum Refusal の末に CiOff を、REFUSAL_WORDS の末に字 ci-off を足す（語は index で引くので末に足し、今の 6 語の位置を替えない）。fn prove は terminal_facts を読んだ直後、remote を読む前に facts.ci_watch が偽なら Err(Refusal::CiOff) を返す（forge と git と CI に問わない）。理由は取り込みと同じで、PR の便は先端の CI の success を close の証拠にするので、CI を止めた repo では証拠が無い。--fold-only と台帳で閉じた便を畳む道は替えない（照合をしない道）。Refusal と REFUSAL_WORDS の doc の閉じた 6 値の句を 7 値に直す。

      形（器の設計の文書 scribe2/docs/design/contract-source.md）。§5 の手順 3 の段の末に、宣言の任意の鍵 ci-watch（値 false の repo は手順 3 を撃たない・取り込みの周は ci-off で断る）の 1 段を足し、§61 の retire の閉じた語の列に ci-off を足す。

      歯。宣言の歯 declaration_ci_watch_reads_a_bool_and_refuses_other_values は optional_keys.rs の tests module の今の助け with で、鍵の無い宣言・ci-watch = true・ci-watch = false の 3 つを Declared::parse で読んで ci_watch_on の真・真・偽を断言し、ci-watch の値が字・整数・列の 3 つの宣言が鍵の名 ci-watch と行の番号 4 を持つ不備で断られることを断言する。e2e の助け（親 land.rs）は、宣言の file の末に行 ci-watch = false を足して add と commit する（fake_terminal_decl の書きと同じ形）。歯 vcioff_land_closes_without_watching_ci（cilast.rs）は、vclhost_land_closes_on_host_green_before_a_red_ci_answer と同じ fixture に助けで鍵を足して land を撃ち、rc 0 と terminal=closed と台帳の argv（close・bead・--reason・landed sha host=green）と、便の終端の行が push と close の 2 件だけであることと、偽の CI の呼びの数が 0 であることを断言する（子を起こさないので settled_rows で待たない）。歯 vcioff_terminal_only_refuses_to_adopt_without_ci（redclose.rs）は、red_run の後に助けで鍵を足し、終端だけの撃ち直しの stdout が 1 行 run=id adopt=ci-off で rc 1、event の数が不変、偽の CI の呼びが 0、偽の bd の log が無い、偽 remote の main が動かないことを断言する。歯 vcioff_pr_retire_refuses_without_ci（retire.rs）は、pr_tools(true) の後に助けで鍵を足して retire を撃ち、stdout の 1 行 run=id retire=ci-off と rc 1、偽の CI の呼びと偽の gh の呼び（file gh-calls）が無いこと、worktree が元の場所に在ることと、event と偽の台帳が不変であることを断言する。3 つの子 module の頭の doc に接頭辞 vcioff_ の句を足す。噛みは撃たない（作り直し v4 の決め D2・設計だけの行）。

      done と verify の対応。1 つ目の項は verify の 2 行目、2 つ目は 3 行目、3〜5 つ目は 4 行目（e2e の歯 vcioff_）、6〜9 つ目は 5〜8 行目（鍵の無い宣言の着地済みの歯）が測る。1 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので verify に書かない。入口の赤は、main の器が鍵 ci-watch を知らない鍵として断るので、2 行目の歯と 4 行目の歯が落ちる（DECLARED_KEYS を伸ばす前は 3 行目が緑で、伸ばした後に断言を直さなければ落ちる）。

      範囲の外。着地の後の CI の口（pipe land --ci-only）は鍵を読まず今のまま（人が名指して撃つ口・子は鍵が偽の周に起こされない）。終端の語（TERMINAL_TOKENS の 7 形）と close の理由の 4 形と rules 行は替えない。tsuzuri の根の .vessel.toml に鍵を書くのは行 t-ci-stop（この行の着地と器の binary の入れ替えの後）。器の持ち込んだ宣言 scribe2/.vessel.toml は替えない。見張りの code の削除と tsuzuri の board の CI の語の整理は後の段の行。
  - n: 5
    type: prose
    title: 行 t-ci-stop — push ごとの GitHub の CI を止め、器の CI の見張りを宣言で切る（memo t3-hub.92.3・設計だけの行）
    body: |
      在りか。差の file は無い（設計だけの行・作り直し v4 の決め D2）。便は git mv で .github/workflows/ci.yml を .github/retired/ci.yml へ byte のまま移し（.github/workflows/ の下に file が残らないので dir も消える）、根の .vessel.toml の鍵 remote の注を直して鍵 ci-watch の行を足し、xtask の歯の file 1 本（cishard.rs）を消し、ci.yml を読む歯と字を 5 file で直す。depends は行 t-daily-deny と行 v-ci-watch-off。並べられない訳: t-daily-deny より先に着地すると、依存の監査 2 本と写しの孤児の照らしがどこでも撃たれない日ができる。v-ci-watch-off より先に着地すると、器が鍵 ci-watch を知らない鍵として宣言ごと断り、全部の便の受付と終端が止まる。席は v-ci-watch-off の着地の後に anchor の器の binary を入れ替えてから、この行の便を置く（受付は base の木の宣言を読み、終端は着地した木の宣言を読むので、この行の便の終端から鍵が効く）。

      なぜ。持ち主の決め D3（push ごとの CI を止め、日に 1 度の全部の撃ちに寄せる・memo t3-hub.92.3）。器の着地の門が同じ xtask の check を着地の直前の木で撃ち、CI にだけ在った 3 job（deny・scribe2-deny・insta-refs）は行 t-daily-deny が daily へ移した。GitHub の branch protection と ruleset は main に掛かっていない（係 w309a が gh api で読んだ・protection は 404 Branch not protected・rulesets と branch の rules は空の列）ので、ci.yml を止めても PR の merge は止まらない。決定はしご。要るか: CI の 11 job（job check の 8 割り・deny・scribe2-deny・insta-refs）が消す物。既に在るか: 退ける置き場の前例は folio2 の持ち込みの ci.yml（folio2/retired/github/workflows/ci.yml・xtask/tests/teeth1/retire.rs の表）で、字を履歴と木に残し撃たれない置き場へ移す形を同じにする。ci.yml を消さないのは、戻す時に git の履歴を辿らずに済むため。push は続ける（daily は写しで origin の main を fetch する・器の着地の push が送り先を更新する）。

      形（.vessel.toml）。今の 5 行目と 6 行目の注（CI は ci.yml・器は終端で CI の判定を読む・一度外して戻した経緯）を次の 2 行に替え、行 remote の直後に行 ci-watch を足す（4 行の字・節は二重引用符を書けないので remote の値の囲みを省いた。戻し方: 値 origin を二重引用符で囲む・今の行と同じ）。

        # push 先の remote（持ち主の決め D3 で push ごとの GitHub の CI は止めた・daily の写しは origin の main を fetch する）。器は着地を push する。
        # 器の CI の見張り（器の任意 key ci-watch・器の行 v-ci-watch-off）を切る。終端は push とこの host の緑の close だけで、GitHub の検査を読まない。
        remote = origin
        ci-watch = false

      消す物と直す物（xtask）。
      - xtask/tests/teeth1/cishard.rs を消し、群の main.rs の行 mod cishard; を消す。表 GROUPS の行 xtask/tests/teeth1 の数を 16 から 15 にする（xtask/tests/teeth1/kfold.rs）。check の分割の環境変数（xtask/src/main.rs の PARTITION_ENV）は手元の分割でも使えるので残す。
      - xtask/tests/teeth1/vcij.rs から、ci.yml を読む歯 vcij_ports_vessel_jobs と vcij_vessel_jobs_classified を消し、歯 vcij_refs_wiring から ci.yml の読みと見本（bad_refs と環境変数の 2 度目の見本）を外して main.rs の 2 つの断言（mod snaprefs; の行と task insta-refs の腕）だけを残す。それらだけが使う定数（OURS・VESSEL・DEFAULTS・PORTED・SUMMED・NESTED・LATER・KEYS・CHECK_REFS・SUM_REFS）と助け（job_names・body・shape・judge・in_order・refs_wiring・swap・bad_ports・bad_refs）を消す。task insta-refs の判じの歯 vcij_refs_judge と vcij_refs_run は残す（daily の段 insta-refs が使う）。器の ci.yml の job の振り分けを見る役は、持ち込んだ器の ci.yml（scribe2/.github/workflows/ci.yml）を GitHub が撃たないので捨てる。module の頭の doc を、task insta-refs の判じと、push の CI を退けたことの歯（下の 2 本）の字に直す。
      - vcij.rs の末に歯 2 本を足す。歯 cistop_push_ci_is_retired は、根の .github/workflows/ が無いかその下に名が .yml か .yaml で終わる file が無いことと、.github/retired/ci.yml が file でその字が done の 1 つ目の項の 2 つの字を持つことと、根の .vessel.toml の行のうち字のとおり ci-watch = false の行の数が 1 で、remote = と二重引用符で囲んだ origin の行の数が 1 であることを断言する。歯 cistop_no_file_reads_the_workflow は、xtask/src と xtask/tests の下を辿って名が .rs で終わる file を全部読み、この歯の file（名 vcij.rs）を除いて、二重引用符に続く字 .github/workflows/ci.yml を持つ file の列が空であることを断言する（folio2 の持ち込みの path の字 folio2/.github/workflows/ci.yml は二重引用符に続かないので当たらない・着地の後の木で当たる file は無い）。
      - xtask/tests/teeth1/deny.rs から歯 kdeny_ci_job_runs_full_check と、それだけが使う定数 RUN_LINE と助け job_deny と is_sha を消し、歯 kdeny_own_names_clean の名の数の断言を 4 から 3 にする。依存の監査の全面の 1 行は daily の段 deny（行 t-daily-deny の定数 AFTER・歯 vdaily_consts_fixed が字を固定）が持つ。module の頭の doc の ci.yml の job deny の句を daily の段 deny の句に直す。
      - xtask/tests/teeth1/vskip.rs から歯 vskip_ci_forces_all を消す（daily の FORCE は歯 vdaily_consts_fixed が固定する）。module の頭の doc の ci.yml の env の句を消す。
      - xtask/src/pubscan.rs の歯 pubscan_wiring から、ci.yml の checkout の fetch-depth を読む後半（ci.yml を読む行から末の断言まで）を消す。公開の走査が全部の履歴を要る事実は、着地の門と daily の写しの clone が満たす。
      - xtask/src/snaprefs.rs の module の頭の doc と定数 REFS_ENV の doc の、CI の job check と job insta-refs と ci.yml の句を、daily の段（check が環境変数で file に残し、段 insta-refs が照らす・行 t-daily-deny）の句に直す。code は替えない。

      done と verify の対応。1 つ目と 2 つ目の項は verify の 2 行目（歯 cistop_）、3 つ目は 3 行目、4 つ目は 4 行目、5 つ目は 5 行目、6 つ目は 6 行目、7 つ目は 7 行目（bin の歯 pubscan_）が測る。1 行目の clippy は done に載せない守り（消した定数と助けの残りを dead_code で落とす）。xtask の check は器の共通 verify が撃つので verify に書かない。入口の赤は、main に .github/workflows/ci.yml が在り xtask の 5 file がその字を持つので、2 行目の歯 2 本が落ちる。

      持ち主の承認の字。条 P-26.5 の字は替えない（行 t-daily-deny の節 3 の読み）。規則の行 R-5（CI 5 分以下）は検出線なので替えない。判断の記録の置き換え（判断の記録 ADR-34 の CI の決めほか）は、持ち主の決め D1〜D6 の記録を起草する別の係の記録が持ち、この行は持ち主の決め D3 と memo t3-hub.92.3 を拠りにする。

      範囲の外。持ち込んだ器の .github/（scribe2/.github/workflows/ の ci.yml と mutants.yml）は GitHub が撃たず、器の xtask の歯が器の根の字として読むので替えない。器の見張りの code の削除と tsuzuri の board の CI の語（crates/tsuzuri-core/src/pipeline.rs の CI_WORDS ほか・過去の event log の札を読む）の整理は後の段の行。退けた ci.yml の中の注（器の終端が判定をここから読む）は byte のまま残す（撃たれない置き場の履歴）。
  - n: 6
    type: prose
    title: 行 t-seat-manners — 席の手元の要の写しを、条の題の一覧から規則の表の作法の行へ替える（memo t3-hub.92.1・作り直し v4 の段 S1 の 3・設計だけの行）
    body: |
      在りか。差の file は無い（設計だけの行・決め D2）。便は 3 file を書く。folio2/crates/folio/src/seat.rs の要の写しの導き方を下の形に替え、crates/tsuzuri-boundary/tests/teeth5/seatcp.rs の fixture と歯を替えて歯 4 本を足し、組んだ tz で根の写しを導き直す（cargo run -q -p tsuzuri-boundary --bin tz -- derive --write --dir design-intent --out ../contracts・書くのは contracts/seat/brief.txt だけで、全文の写しと上限の file は替わらない）。群の main.rs と kfold の表は書かない（module を足さない）。depends は空。

      なぜ。持ち主は作り直し v4 で、席の起こしの文脈を席の役に効く物だけにすると決め（決め D1〜D6 と発話 2026-10-06T08:16:48.774Z・epic t3-hub.92・段の memo t3-hub.92.1）、席の自動の記憶を切る。記憶にだけ在った席の振る舞いの決まりは、型付きの置き場に 1 つ置き（条 N-2.1・P-1・P-2）、席の手元へ導いて写す（条 P-13）。その置き場は規則の表 design-intent/rules.yaml の節 discipline（作法の行・D 行・種別 human-review・欄 article と ruling を持つ）で、今の D-1〜D-4 も席の作法である。今の要の写しは、段「いつも守る」の条の id と題の 28 行（1,654 byte）を持つが、題だけでは今何をするかが決まらず（見直しの記録 prompts-review.md の §2.1）、全文は全文の写しの在りかの行が名指す。この 28 行を外し、空いた byte に作法の行を写す。

      形。要の写しの行は、頭の 1 行・順位の行・段の名 絶対にやらない の行とその段の規範文の行・段の名 確認してから の行とその段の規範文の行・全文の在りかの行・段の名 席の作法 の行と作法の行の行、をこの順に持つ。作法の行の行は、規則の表の discipline の行の欄 id と空白 1 つと欄 what の字（前後の空白を落とし続く空白を 1 つに畳む・今の squash）で、規則の表の順に並ぶ。discipline の行が 0 本（節が無いか空の一覧）なら、段の名 席の作法 の行も書かず、全文の在りかの行で終える。全文の写し（constitution.txt）と上限の file（role-max-bytes.txt）と byte の上限の数え方は替えない。

      seat.rs の替え。(ア) 段の表 TIERS から段 いつも守る の項を外し 2 項にする（型は [(Tier, &str); 2]）。(イ) 定数 MANNERS（字 席の作法・doc は「作法の行の段の名の行（規則の表の節 discipline・条 P-13.1 の字）。」）を足す。(ウ) 関数 discipline（規則の表の Node を受けて作法の行の行の Vec を返す）を足す。節 discipline が無ければ空の Vec、一覧でなければ Err（字 discipline が一覧でない）、行に欄 id の字が無ければ Err（字 作法の行に id が無い）、欄 what の字が無ければ Err（字 <id>: what が字でない）。(エ) derive は、読んだ規則の表から discipline を撃ち、brief に渡す。brief は段ごとの規範文の後に全文の在りかの行を足し、作法の行の行が 1 本以上在れば段の名の行とその行を足す。(オ) 条の構造体 Article の欄 title と、articles の中の title の読みを外す（使う所が無くなる・clippy の死んだ欄を残さない）。(カ) module の doc の 1〜2 行目の「要の写し（順位・段「絶対にやらない」と段「確認してから」の規範文の全文・段「いつも守る」の条の id と題・全文の写しの在りか）」の括弧の中を「順位・段「絶対にやらない」と段「確認してから」の規範文の全文・全文の写しの在りか・規則の表の作法の行の id と字」に替え、5 行目の「段の名だけの行・「id 字」の行・「条の id 題」の行・在りかの行」を「段の名だけの行・「id 字」の行・在りかの行・作法の段の名の行・作法の「id 字」の行」に替え、brief の doc を「要の写し: 頭の行と順位の行・段ごとに段の名の行と規範文の行・在りかの行・作法の行が在れば作法の段の名の行と作法の行。」に替える。Err は今の Err と同じく、導出の まだ分からない（rc 2）として出る。

      歯の file の替え。module の doc の 2 行目の「規則の表（欄 key が seat-bytes と seat-role-bytes の 2 行）」を「規則の表（欄 key が seat-bytes と seat-role-bytes の 2 行と作法の行 2 本）」に替える。Place::new は common の RULES を書いた後に、その字の discipline: [] を次の 3 行に 1 度だけ替える（swap を使う）。

        discipline:
          - {id: D-1, article: P-1, what: 係を  並べる}
          - {id: D-2, article: N-1, what: 決めを書く}

      定数 BRIEF は次の 11 行に替える（字下げの 2 字を除く・末は改行で終える）。定数 FULL は替えない。

        生成物・手で直さない・design-intent/constitution.yaml v9.9
        順位 段の順 で解く。
        絶対にやらない
        N-1.1 消さない。
        N-1.2 移す だけ。
        確認してから
        A-1.1 問う。
        全文 contracts/seat/constitution.txt
        席の作法
        D-1 係を 並べる
        D-2 決めを書く

