  - n: 3
    type: prose
    title: 行 e-cache — 名に hash を持つ配布の file を 1 年持たせる
    body: |
      なぜ。持ち主の 2 つの board が重いという指摘（t3-hub.1 の user 2026-09-28T00:4xZ・00:59Z・01:06Z の記帳・字はここに写さない）を受けた重さの調べ（2026-09-28・計画 surface-plan の 4 節の性能の行）で、境界の server は面の file（index.html・wasm・js・css）の応答に Cache-Control も Last-Modified も ETag も付けないので、browser は頁を開くたびに wasm を取り直す。得の見込みは計画の 9 節の行 e-cache の字（2 回目からの wasm の転送が 7.9 MB から 0 byte）で、7.9 MB は行 g-strip の前の値（g-strip の後の 2026-09-28 の dist の wasm は 3,327,959 byte）。trunk は wasm・js・css の名に中身の hash を入れ、index.html がその名を引くので、hash を持つ名の file は中身が変われば名が変わる。そこで hash を持つ名の file は 1 年持たせて読み直させず（Cache-Control の public・max-age=31536000・immutable）、index.html とほかの file は毎回確かめさせる（no-cache）。新しい build の後も index.html は取り直すので、新しい名の wasm を読む。あわせて配布の枝（files の serve の結果の match と頭）を files.rs の 1 つの fn に移し、mod.rs はそれを呼ぶ 1 行にする（計画の後の行 g-gz が Accept-Encoding を見て .gz を返す所を files.rs だけに書けるように・計画の 9 節の行の字）。要件は NFR2（器の event と台帳の変化は 5 秒以内に面へ届く・頁を開くたびの数 MB の取り直しは頁の移りと読み直しを遅らせる）。
      在りか・可視性（main 2e0732e で確かめ、99924c3 で読み直した・間に変わったのは面の account の 2 file と歯と design-intent だけで、境界の crate は同じ・行 e-idle-close〔cd3bfee〕の後の字）。境界の crate の src/lib.rs の 14 行目は pub mod server; で、src/server/mod.rs の 25 行目は pub mod files;・26 行目は pub mod http; なので、files.rs と http.rs の pub な item は結合試験の file から tsuzuri_boundary::server::files::respond や tsuzuri_boundary::server::http::read_request のように use で引ける（mod.rs の中の私的な mod は config と routes の 2 つだけ・着地済みの tests/iclose.rs が同じ形で server::http と server::Config と server::Server を引く）。
      在りか・files.rs（write-set・109 行・標準 library だけ）。pub enum Served（File の欄 content_type〔&'static str〕と body〔Vec の u8〕・Outside・Missing・derive は Debug・Clone・PartialEq・Eq）と、pub fn resolve（20 行目・置き場の &Path と URL の path の &str を受け Result の PathBuf と Served・% を解き、字 NUL と逆斜線の在る path と . と .. の区切りを Outside で断り、dir なら index.html を足し、canonicalize した実体が置き場の中で file のときだけ Ok）と、pub fn serve（46 行目・同じ引数で Served・resolve の Ok を std::fs::read で読み、Content-Type を私的な fn content_type の表〔html は text/html; charset=utf-8・js と mjs は text/javascript; charset=utf-8・css は text/css; charset=utf-8・json・wasm は application/wasm・svg・png・ico・txt・ほかは application/octet-stream〕で付ける）と、私的な fn percent_decode（61 行目）と content_type（81 行目）と、#[cfg(test)] の mod tests の lib の歯 server_min_percent_decode（101 行目・percent_decode だけを見る）を持つ。files.rs のどの fn にも二重引用符で囲んだ outside・no-file・Cache-Control の字は無い（確かめた）。
      在りか・mod.rs の今の字（write-set・329 行）。58 行目に use self::files::Served; が在り（mod.rs で Served を使うのは配布の枝だけ）、260 行目の私的な fn handle（TcpStream と Shared を受ける）は set_read_timeout と set_write_timeout の後に http::read_request(&stream) を match し、Err で http::no_bytes が真なら何も書かずに戻り、ほかの Err は Response::text(400, と二重引用符で囲んだ bad-request)、GET の /api/surface/events は events::stream、Ok(req) は route::dispatch(&req, shared) が Some ならその応答、None で GET でなければ Response::text(405, と二重引用符で囲んだ method) に頭 Allow の GET、None の GET は 276〜280 行目の files::serve(&shared.files, req.path()) の match で Served::File なら Response::new(200, content_type, body)・Served::Outside なら Response::text(403, と二重引用符で囲んだ outside)・Served::Missing なら Response::text(404, と二重引用符で囲んだ no-file) にし、末で response.write_to(&stream) を撃つ（書きの誤りは捨てる）。handle の後の fn guarded（289 行目・403 と字 origin・413 と字 too-large・400 と字 bad-body）・fn refusal（303 行目）・fn lock・fn aged（316 行目・頭 READ_AGE_HEADER）・fn json（324 行目・Err なら 500 と字 encode）はどれも字 Served・outside・no-file を持たず、mod.rs のどこにも字 Cache-Control は無い（確かめた）。
      在りか・http.rs（置き場だけの =・この行は書かない）。pub struct Request（16 行目）は欄 method・target・host・origin・content_length・body をどれも pub で持ち、pub fn path（29 行目・target の字 ? より前）を持つ。pub fn read_request（138 行目・impl Read を受け io::Result の Request）は字 GET と空白と path と空白と HTTP/1.1 と CR LF と頭の行と空行の byte の列を読んで Request を返す（&[u8] も Read）。pub struct Response（229 行目）は欄 status（u16）・content_type（&'static str）・body（Vec の u8）・headers（名の &'static str と値の String の組の Vec）をどれも pub で持ち、pub fn new・json（頭 Cache-Control の no-store を足す）・text（Content-Type は text/plain; charset=utf-8）・header（headers の末に足す）・write_to（状態の行と Content-Type・Content-Length・X-Content-Type-Options・Connection の行と headers の行と空行と本文を書く）を持ち、私的な fn reason は 200 を OK・403 を Forbidden・404 を Not Found にする。
      今の dist（2026-09-28 の surface-build・crates/tsuzuri-surface/dist は版管理の外）は index.html（1,333 byte）・style-13a5b5bf849cd686.css（89,748）・tsuzuri-surface-2e993b6ea1850f19.js（50,708）・tsuzuri-surface-2e993b6ea1850f19_bg.wasm（3,327,959）の 4 つで、index.html は css を link で、js を script の import と modulepreload で、wasm を init の引数と preload で、どれも / で始まる hash の名で引く。crates/tsuzuri-surface/Trunk.toml は [build] の target（index.html）・dist（dist）・release（true）・public_url（/）だけを持ち filehash を書かないので、trunk（0.21.14）の既定の filehash が効いて名に hash が付く。hash の字は今の dist では 16 字の小文字の 16 進で、trunk は数を 0 で埋めずに書く見込み（推測）なので、8〜16 字を hash と認め、それより短い名は no-cache の側に倒す（読み直すだけで壊れない）。
      形（files.rs）。use super::http::{Request, Response}; を足し、pub const IMMUTABLE（&str・字 public, max-age=31536000, immutable・doc は名に hash を持つ file の Cache-Control）と pub const NO_CACHE（&str・字 no-cache・doc はほかの file の Cache-Control）と pub fn hashed（file の名の &str を受け bool）と pub fn respond を足す。hashed は、名の最初の . より前の字（. が無ければ偽）から末の字 _bg を 1 つ除いた字を最後の - で分け、- の前が 1 字以上で、- の後が 8 字以上 16 字以下で 0〜9 と a〜f の字だけのときだけ真にする。respond の宣言の行は pub fn respond(req: &Request, root: &Path) -> Response { の 1 行で、serve(root, req.path()) の値が Served::File なら Response::new(200, content_type, body) に名 Cache-Control の頭を 1 つ足し（値は req.path() の最後の / の後の字が hashed なら IMMUTABLE・ほかは NO_CACHE・/ と / で終わる path は空の字なので NO_CACHE）、Served::Outside なら Response::text(403, と二重引用符で囲んだ outside)、Served::Missing なら Response::text(404, と二重引用符で囲んだ no-file)（どちらも頭を足さない・今と同じ字）を返す。二重引用符で囲んだ outside と no-file と Cache-Control の字は files.rs の respond に 1 度ずつだけ書く。file の頭の doc に Cache-Control の決まりの 1 文を足す。Served・resolve・serve・percent_decode・content_type と lib の歯は変えない。
      形（mod.rs）。276〜280 行目の配布の枝を 1 行の None => files::respond(&req, &shared.files), に替え、58 行目の use self::files::Served; を消す（残すと使わない import で clippy の -D warnings が落ちる）。fn handle のほかの腕（no_bytes の腕・400 の bad-request・events・dispatch・405）と READ_TIMEOUT と WRITE_TIMEOUT と後の fn は変えない。mod.rs に二重引用符で囲んだ /api/ の字と Cache-Control の字を足さず、字 fn route(・fn around(・fn account(・fn post_ruling・fn post_batch・fn post_policy・fn post_heartbeat・HEARTBEAT_PATH・pub struct Config を書かず、mod config; と pub use self::config::Config; と fn aged( と READ_AGE_HEADER と、1 か所の http::no_bytes( と 1 か所の二重引用符で囲んだ bad-request を残す（下の着地済みの歯が mod.rs の字を読む）。
      browser の側（この行の歯の外・見込み）。2 回目からの頁の読みは index.html だけを取り直し（1,333 byte）、css・js・wasm は browser の cache から読む。着地の後に席が実物（Chrome の devtools の network か headless の Chrome の転送の byte）で 2 回目の wasm の転送が 0 byte であることを確かめる（計画 7 節の段 5）。API の口（Response::json の no-store）と変化の知らせ（SSE の no-store）の頭は変えない。
      着地済みの歯（直さずに通る・write-set の =）。tests/server_min.rs の server_min_files_refuse_outside は / と /index.html の状態 200 と本文と Content-Type の text/html、/sub/app.js?v=1 の 200 と text/javascript、/sub/ と /nope.wasm の 404、置き場の外の 10 の path（..・%2e%2e・%2E%2E%2F・..%2f・/./・逆斜線・%00・%zz・置き場の外を指す symlink）の 403 と本文に秘密の字が無いことを見る（頭の Cache-Control を見ないので足した頭で落ちず、状態と本文と Content-Type は今と同じ）。server_min_non_get_405_writes_nothing は GET でない要求が dispatch の後の 405 になることと字 GARBAGE の要求の 400 を見る（respond を通らない）。lib の server_min_percent_decode は files.rs の私的な percent_decode を見る（変えない）。tests/iclose.rs の iclose_eof_writes_nothing は GET / の頭が HTTP/1.1 200 OK で始まり本文が index.html の字であることを見て、iclose_handle_wiring_text は mod.rs の字で fn handle( の後に http::no_bytes( と Response::text(400, と二重引用符で囲んだ bad-request が在りその後に fn guarded< が在ること（http::no_bytes( と二重引用符で囲んだ bad-request はどちらも 1 度だけ）と READ_TIMEOUT の 10 秒と境界の crate の依存 2 つを見る（この行の後も同じ字）。mod.rs の字を読むほかの歯は hbconf_config_moves_to_config_rs（pub struct Config が無く mod config; と pub use self::config::Config; が在る）・hbpost_mod_rs_drops_post_fns・hbroute_mod_rs_keeps_only_events（二重引用符で囲んだ /api/ の字が /api/surface/events の 1 つだけ）・rhold_wiring_text（fn aged( と READ_AGE_HEADER）の 4 本。面の file を GET する歯は server_min.rs と iclose.rs の 2 つの file だけで、files.rs と Served を字で読む歯は無い（tests と src を grep で確かめた・ほかの server の歯は置き場に index.html を置くだけ）。
      測り方。新しい歯は境界の crate の tests/ecache.rs に置き、名を ecache_ で始める。ecache_hashed_names は done (1) の名で hashed を見る。ecache_respond_heads は CARGO_TARGET_TMPDIR の下の作業場に done (2) の置き場（index.html の字は <!doctype html><title>tz</title>・css と wasm と js と sub/app.js は短い字）と置き場の外の secret.txt を作り、置き場の実体の path（canonicalize）と、read_request に字 GET と空白と path と空白と HTTP/1.1 と CR LF と頭 Host の行と空行を渡した Request で respond を撃ち、Response の欄 status・content_type・body と、headers のうち名が Cache-Control の値の列を見る（headers の全体は比べない・後の行 g-gz が Vary ほかの頭を足しても通る）。ecache_served_over_tcp は tests/iclose.rs の Place と同じ形（字 [] を出す sh の偽の bd・repo の .beads の dir・Config の bd を偽の bd にし残りの欄を Config::new で埋める・Server::bind で 127.0.0.1 の port 0 に立て thread で run）の server に std の TcpStream で GET を撃ち（読みの上限 5 秒）、頭の行を CR LF で分けて名が Cache-Control の行を数える。ecache_handle_wiring_text は CARGO_MANIFEST_DIR から src/server/mod.rs と src/server/files.rs を読む。自分の名の歯は tests/ecache.rs の字を読み、test の属性の行の次の fn の名を全部集め、名の数が 5 以上であることと done (6) を見る。fixture は書かない。
      filter の語（main 99924c3 の contracts の verify の filter の語 181 を、ほかの語を部分の字として含まない 118 語に畳んだ語と、計画の後の行 g-gz の接頭辞 pgz_ と、同じノートの行 c-pipe-questioned の接頭辞 pquest_と行 e-sess-closed の接頭辞 sclosed_・この行の接頭辞 ecache_ は並べない）は aaround_・accept_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・board_min_・bport_・brand_・btuck_・cadopt_・cgdom_・cmark_・contract_form_・cround_・csled_・denv_・flight_・fmark_・frame_・fserve_・fstop_・gapspage_・gfresh_・ghb_・glabel_・gnav_・graph_・gsum_・gtuck_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hfig_・hook_・hruling_・hsblock_・hsderive_・hspage_・hsym_・iclose_・ilink_・kcli_・klink_・lcard_・ledgerblock_・lhome_・lspark_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・parts_・pclosed_・pfold_・pipe_・plimit_・pmore_・project_・ptitle_・pwhole_・qblock_・qgate_・qkey_・question_・rhold_・runsdoc_・saxis_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_・pgz_・pquest_・sclosed_ で、新しい歯の名から先頭の ecache_ を除いた字は、このどれも部分の字として含まない（例 ecache_server_x・ecache_stage_x・ecache_tz_x は不可）。畳んだ語で足りる（着地済みの filter のうち歯の名そのものと server_ で始まる接頭辞と stage_ で始まる接頭辞は、並べた語を部分の字として含む）。名は done に書いた ecache_hashed_names・ecache_respond_heads・ecache_served_over_tcp・ecache_handle_wiring_text・ecache_own_names_clean（どれも並べた語を含まない）。
      依存と順。depends は無い（計画の 9 節の行の依存 = なし・mod.rs を書いた行 e-hold〔076666a〕と e-idle-close〔cd3bfee〕は着地済み）。同じノートの行 c-pipe-questioned と e-sess-closed とは、書く file も置き場だけの = も重ならない（あちらは中核の crate と fixture だけ）ので並べて流す。計画の 5 節の鎖は、mod.rs が e-idle-close → e-cache → a-lean → e-snap → c-ev-kind、files.rs が e-cache → g-gz、http.rs（この行は置き場だけの =）が e-idle-close → g-gz で、mod.rs の字を読む歯（hbconf・hbpost・hbroute・rhold・iclose・server_min）もこの行が置き場だけの = で持つので、後の a-lean と g-gz はこの行の着地の後に流す（その行のノートを置く時に便の bead の依存で持つ）。外の依存は足さず、境界の Cargo.toml と Trunk.toml と index.html と面と契約と中核の crate は触らない。
  - n: 4
    type: prose
    title: 行 c-pipe-questioned — 器の問いの走行を板の Questioned の札にする
    body: |
      なぜ。器（scribe2）は run の席が問いを上げると、QuestionRaised（detail は問いの字）の後に同じ時刻で RunStage（段 Questioned・detail は字 about: と問いの種類）を書き、後で RunStopped（段 Stopped）で run を止める。中核の板の段の表 stage_of は RunStage の段 Questioned を持たないので、段を決める最後の event が RunStage Questioned の走行は表に無い段として unmapped に数えられるだけで札にならず、pipeline の板から問いの走行が消える（行 c-next-stall の起草で見つけた・計画 2 節）。見本（docs/design/mock3 の ui.js の STAGE_COL と reasonShort・判断の記録 ADR-7 の承認 user 2026-09-26T07:51Z）は Questioned を止まりの列（Questioned/Failed/Stopped）に置く。問いの後の RunStopped は、見本の data では Stopped の段になり reasonShort が 質問の後に止めた と about の字を出すが、そうすると問いを上げた走行が数十秒から数分で器が止めた走行と同じ段になり、問いを待つ走行と器が落とした走行の区別が板から消える。そこで席は、問いの後の RunStopped は段を変えず（段 Questioned のまま）、札の段の理由に見本の 質問の後に止めた を出すと決めた（計画の 9 節の行の字・持ち主の指摘 t3-hub.1〔裁定 id = user 2026-09-28T00:4xZ〕の、質問を上げただけの run を止まっている走行に数えて質問を隠す件と同じ向き・行 c-next-stall の起草で c-pipe-stop と呼んだ RunStopped の扱いもこの 1 行に入れた）。要件は FR10（pipeline の板の 4 列・止まっている便には理由が付く）と FR12（account board の session の表の段・下の決めた幅 (e)）。
      実物の形（2026-09-28 に 4 つの project の器の state dir の event log〔fleet/events.jsonl〕を読んで数えた・名は書かない）。RunStage の段 Questioned の event は 83 件で、detail は about:write-set 62・about:design 11・about:done 3・about:goal 3・about:verify 3・contract:refreshed 1。それを持つ run 81 のうち、最後の Questioned の後が RunStopped だけのものが 63、RunStopped の後に RunStage の段 Stopped（detail retired）が来るものが 4、同じ run が Spawned 以後へ進んだもの（答えを受けて続いた run）が 14。
      在りか・中核の板（main 2e0732e で確かめ、99924c3 で読み直した・間に変わったのは面の account の 2 file と歯と design-intent だけで、中核の crate と fixture は同じ・行 c-pipe-closed〔.52.62〕の後の字）。crates/tsuzuri-core/src/lib.rs の 16 行目は pub mod pipeline; で、src/pipeline.rs（write-set・360 行）は pub const STAGE_EVENTS（24 行目・RunCreated・RunStage・RunDone・QuestionRaised の 4 種）・FAILED_VERDICTS・PASSED_VERDICT・ACCOUNT_TAG・CLOSED_TAG（字 closed:）・CLOSED_CHARS（60）と pub struct Board（pub な欄 board と unmapped）を持つ。pub fn stage_of（50 行目・種類と段の名の Option と detail を受け、段と段の理由の Option の組の Option）の表は、RunDone を Landed、QuestionRaised を Questioned、RunCreated を Running、RunStage の Reviewed と Gated で detail が FAILED_VERDICTS のどれかで始まれば Failed（段の理由は detail の字）、RunStage の Gated を Gated、Reviewed で detail が verdict:PASS で始まれば Running、Spawned と Implemented を Running にし、ほか（RunStage の Questioned・Stopped・Failed・Merging ほかと種類 RunStopped）は None。段の理由を持つのは Failed だけ。私的な struct RunState（欄 last〔段を決めた最後の event〕と account・derive は Default）を走行ごとに持ち、pub(crate) fn of_inputs は event を log の順に読み、STAGE_EVENTS の種類の event で last を替える（RunStopped・RunCost・SeatSpawned ほかは段を変えない）。札は bead の最初の RunCreated の順に、いちばん新しい走行の last を stage_of に通した値に行 c-pipe-closed の読み替え（stage_of の値が Landed ならそのまま・台帳にその bead が在って is_open が偽なら段 Landed と段の理由 CLOSED_TAG と閉じた理由の頭・どちらでもなければ stage_of の値で、None なら unmapped に 1 足して札を作らない）を当てて作り、経過 elapsed_s は今から last の ts を引いた秒。pub fn board（台帳の字と event log の字と今）は of_inputs を撃つ。pub fn runs_of と私的な detail_account・text・closed_reason・detail_tag・count と、#[cfg(test)] の lib の歯 stats_stage_of_closed_table（RunDone・Reviewed の PASS と空・Gated の turn:taken・Merging・RunCost・Gated の verdict:FAIL を見る・RunStage の Questioned は見ない）と stats_detail_account_takes_the_last を持つ。
      在りか・stage_of と板を使うほかの所（確かめた）。crate::next_step（src/next_step.rs・置き場だけの =・lib.rs の 15 行目 pub mod next_step;）の私的な fn stalled_run は of_inputs の札のうち段が pub const STALLED_STAGES（Failed と Stopped・Questioned は入らない）に在り bead が台帳で open の札だけを数える。crate::account::project（src/account/project.rs・置き場だけの =・lib.rs の 10 行目 pub mod account; と src/account/mod.rs の 8 行目 pub mod project;）の 27 行目は use crate::pipeline::{ACCOUNT_TAG, FAILED_VERDICTS, stage_of}; で、pub fn session_lines（448 行目）は、終わっていない（RunDone も RunStopped も無い）生きている（席が立っているか最後の event が ALIVE_S の 3600 秒以内）run ごとに、run の最後の段の event（pub const RUN_STAGE_EVENTS の 5 種〔RunCreated・RunStage・RunDone・RunStopped・QuestionRaised〕の最後）を stage_of に通した段を契約の SessionLine の欄 stage にし、上限の印 RateLimited なら状態 Limit、段が Questioned・Failed・Stopped でなく席が立っていれば Run、ほかは Wait にする。だからこの行の後は、問いを上げてまだ止められていない run の session の行が、段 None と（席が立っていれば）状態 Run から、段 Questioned と状態 Wait になる。pub fn run_counts と run_counts_of は stage_of を呼ばず段の名の字（QuestionRaised なら Questioned・ほかは欄 stage）で分けるので、RunStage の Questioned は今も stop に入る（変わらない）。境界の server の口 /api/pipeline と next は中核の board と next_step の値をそのまま返し、境界の歯 server_read と server_coalesce は口の値を同じ中核の関数の値と比べる（同じ決まりで変わり、通る）。
      在りか・面（この行は書かない・確かめた）。面の src/project/pipeline.rs の pub fn kcard は段の理由を why（無ければ段の字）にし、止まりの列（Questioned/Failed/Stopped）の札は lead を Why(why)・class を kcard why-stop にし、run_line を ↻回数 · 段の字 · why の頭 20 字にする。字 質問の後に止めた（write-set） は 19 字で切れない。面の fixture tests/fixtures/surface/pipeline-board.json は段 Questioned で理由 about:write-set の札 px.5 を既に持ち、面は段 Questioned の理由を出せる。面の src/account/session.rs の STALLED_STAGES（Questioned・Failed・Stopped）は session の行の段で並べの止まっているの束を決める（段 Questioned になった行はその束に入る・見本の acct.js の runStopped も Questioned を止まりと見る）。面の file と面の歯は変えない。
      形（src/pipeline.rs）。pub const QUESTION_STOPPED（&str・字 質問の後に止めた・doc は問いの後に器が止めた走行の札の段の理由の頭の字で見本の reasonShort の写し）を足す。stage_of の表に、種類 RunStage で段の名が字 Questioned（大文字の Q・字の全体が同じ）の腕を足し、段 Questioned・段の理由 None にする（QuestionRaised と同じ・detail は見ない）。表のほかの腕は変えない（RunStage の段 Stopped と Failed と Merging と、種類 RunStopped は今のまま None）。RunState に私的な欄 stopped（bool）を足し、of_inputs の event の読みで、STAGE_EVENTS の種類の event で last を替える時に stopped を偽にし、種類 RunStopped の event で stopped を真にする（last は替えない）。札を作る時、last を stage_of に通した値が段 Questioned で、その走行の stopped が真なら、段の理由を、last の detail が字 about: で始まりその後の字の前後の空白を除いた字が空でなければ QUESTION_STOPPED と全角の括弧 （ と ） で囲んだその字、ほかは QUESTION_STOPPED だけにする（例 about:write-set なら 質問の後に止めた（write-set）・QuestionRaised の後の RunStopped と detail が contract:refreshed なら 質問の後に止めた）。その後に行 c-pipe-closed の読み替えを今のまま当てる（台帳で閉じた bead の問いの走行は閉じた（着地せず）になる）。経過は今のまま段を決めた最後の event（RunStage Questioned か QuestionRaised）の ts から数え、RunStopped の ts は使わない。file の頭の doc に 1 文を足す。STAGE_EVENTS・board と of_inputs と runs_of の引数と返り・Board・Queued と Blocked の札の決まり・CLOSED_TAG の宣言の行は変えない。
      形（fixture）。tests/fixtures/pipeline/pipeline.json（write-set）に、台帳の行 fx-pl.16（題 RunStage Questioned → Questioned（後の RunStopped は段を変えない）・status open・issue_type task・created_at 2026-09-26T00:00:00Z・parent fx-pl）を fx-pl.15 の行の後に、event log の 4 行（run fx-pl.16-20260927T011000Z の RunCreated 2026-09-27T01:10:00Z〔stage Intake・detail classes:〕・QuestionRaised 01:15:00Z〔detail は字 write-set に足りない file が在る〕・RunStage 01:15:00Z〔stage Questioned・detail about:write-set〕・RunStopped 01:20:00Z〔stage Stopped〕）を fx-pl.12 の 2 行の後に、期待の札 fx-pl.16（runs 1・stage Questioned・reason 質問の後に止めた（write-set）・account null・elapsed_s 2700）を fx-pl.11 の札の後に足し、欄 note の fx-pl.12 の文の後に fx-pl.16 の 1 文を足す。unmapped は 1（fx-pl.12 の Merging）のまま。今は 1790474400（2026-09-27T02:00:00Z）で、札の順は bead の最初の RunCreated の順なので fx-pl.16 は fx-pl.11 の後・Blocked の fx-pl.13 の前。
      決めた幅（起草の決め）。(a) 問いの後の RunStopped で段を Stopped にしない（上の なぜ・計画の 9 節の行の字）。(b) 段の理由は RunStopped の後だけに付け、止められる前の問いの走行は今の QuestionRaised の札と同じく理由無し（面の札は why に段の字 Questioned を出す）。(c) 段の理由の about の字は、見本の reasonShort と同じく段 Questioned の event の detail の字 about: の後（QuestionRaised の detail は問いの全文なので使わない）。(d) 問いの後に同じ走行が Spawned 以後へ進めば、その event で段を決め直し stopped も偽に戻る（答えを受けて続いた run は Running ほかの札）。(e) account board の session の表の段は stage_of の値なので、問いを上げて止められる前の run の行も段 Questioned・状態 Wait になる（面では並べの止まっているの束に入る）。(f) 実物に在る RunStage の段 Stopped（detail retired）と段 Failed（detail oom-kill・runner-rc ほか）は、この行では表に無い段のまま（札にするかは後の行で決める・計画の 9 節の行の外）。(g) 次の一手と run の 4 列と走行の頁（runs_of）は変えない。
      着地済みの歯（直さずに通る・中核と境界と面の crate の tests と src を grep で確かめた）。src/pipeline.rs の stats_stage_of_closed_table と stats_detail_account_takes_the_last は変わらない。tests/stats.rs（=）の stats_pipeline_matches_fixture は fixture の pipeline.json の台帳と event log を board に通し、札の列と unmapped を fixture の期待と比べ、Stopped のほかの 7 つの段がどれも 1 枚以上在ることと、台帳の字が空の板の札の数が期待の札のうち runs が 1 以上の数と同じことを見る（歯の字は変えず直した fixture で通る・fx-pl.16 は台帳が無くても段 Questioned の札なので数も合う・今の code では fx-pl.16 が unmapped に入って落ちる）。stats_core_deps_are_the_three は中核の直接依存 serde・serde_json・tsuzuri-contract の 3 つを見る。tests/pclosed.rs（=）の pclosed_ は問いの走行を QuestionRaised だけで作る（cs.4）ので値は変わらない。tests/nstall.rs（=）の nstall_ は fixture の next.json（問いの走行 nx1.2 は QuestionRaised だけ）を next_step に通す（変わらない）。session_lines を撃つ歯 acctpcore・plimit・athr の event に RunStage の段 Questioned は無く（確かめた）、値は変わらない。graph の fixture（runs-5.json・questions-4.json・violations.json）は RunStage の段 Questioned を持つが、読むのはグラフの組み立て（crate::graph）で stage_of を通らない。面の歯は中核を呼ばない。
      測り方・節の組（中核の歯が使う値・歯の中で組む・fixture の file は使わない）。今は 1790510400（2026-09-27T12:00:00Z）。台帳（bd の出力の形の JSON の配列）は qa.1 から qa.8 の task（題は字 t と番号・status open）で、qa.6 だけ status closed・closed_at 2026-09-27T11:05:00Z・close_reason 字 withdrawn。event log は 27 行（1 行 1 件の JSON の object・欄は schema の 1・ts・kind・run・bead と、在れば stage と detail・時刻の日は 2026-09-27・run は bead とハイフンと RunCreated の時刻の札・RunCreated の stage は Intake で detail は無い・QuestionRaised の detail は字 問いの字・RunStopped の stage は Stopped で detail は無い）で、qa.1 の RunCreated 10:00・QuestionRaised 10:05・RunStage 10:05（Questioned・about:write-set）、qa.2 の RunCreated 10:10・QuestionRaised 10:15・RunStage 10:15（Questioned・about:design）・RunStopped 10:20、qa.3 の RunCreated 10:30・RunStage 10:31（Questioned・contract:refreshed）・RunStopped 10:32、qa.4 の RunCreated 10:40・QuestionRaised 10:41・RunStopped 10:42、qa.5 の RunCreated 10:50・RunStage 10:51（Questioned・about:verify）・RunStopped 10:52・RunStage 10:53（Spawned・base:0a,account:acct-1）、qa.6 の RunCreated 11:00・RunStage 11:01（Questioned・about:done）・RunStopped 11:02、qa.7 の RunCreated 11:10・RunStage 11:11（Spawned・detail 無し）・RunStopped 11:12、qa.8 の RunCreated 11:20・RunStage 11:21（Questioned・about:write-set）・RunStopped 11:22・RunStage 11:22（Stopped・retired）。
      節の表（board の値の札・この順・欄は contract・runs・stage・reason・account・elapsed_s）。qa.1 は 1・Questioned・無し・無し・6900。qa.2 は 1・Questioned・質問の後に止めた（design）・無し・6300。qa.3 は 1・Questioned・質問の後に止めた・無し・5340。qa.4 は 1・Questioned・質問の後に止めた・無し・4740。qa.5 は 1・Running・無し・acct-1・4020。qa.6 は 1・Landed・closed:withdrawn・無し・3540。qa.7 は 1・Running・無し・無し・2940。unmapped は 1（qa.8）。台帳の字が空の板は qa.6 だけが 1・Questioned・質問の後に止めた（done）・無し・3540 で、ほかの 6 枚と unmapped は同じ。
      測り方・歯。新しい歯は中核の crate の tests/pquest.rs に置き、名を pquest_ で始める。pquest_table_arm は done (1) の組で stage_of を見る。pquest_board_cards は節の組を board に渡して札の列（PipelineCard の Vec の全体）と unmapped を節の表と比べ、台帳の字を空にした板も比べる。pquest_next_step_not_stalled は同じ入力の next_step の checks のうち種類 StalledRun の結果と件数と、lead を見る。pquest_session_line_questioned は、群の宣言の字（塊の頭の行 [[account-group]] と、name に一重の引用符で囲んだ字 g と、anchors に一重の引用符で囲んだ字 /w/p だけの配列の 3 行・着地済みの pclosed_rows_pass_ledger と同じ）の HostTexts（host_toml のほかは Default）と、鍵 /w/p に state_dir_known が真で events だけを持つ ProjectTexts（ほかは Default・台帳は None）の表で session_lines を撃ち、役が Pipeline の行の列を比べる。event は sq.2（run sq.2-20260927T114000Z の RunCreated 11:40・RunStage 11:41〔Questioned・about:design〕・RunStopped 11:42）と sq.1（run sq.1-20260927T115000Z の RunCreated 11:50・SeatSpawned 11:50・QuestionRaised 11:55・RunStage 11:55〔Questioned・about:write-set〕）で、sq.1 の行は project p・役 Pipeline・名 sq.1-20260927T115000Z・口座 None・状態 Wait・段 Questioned・いつから 1790510100（11:55）・稼働の記録 Unknown、sq.2 は RunStopped で終わった run なので行が無い。pquest_fixture_card は CARGO_MANIFEST_DIR から ../../tests/fixtures/pipeline/pipeline.json を読んで done (5) を見る。自分の名の歯は tests/pquest.rs の字を読み、test の属性の行の次の fn の名を全部集め、名の数が 6 以上であることと done (7) を見る。
      filter の語（main 99924c3 の contracts の verify の filter の語 181 を、ほかの語を部分の字として含まない 118 語に畳んだ語と、計画の後の行 g-gz の接頭辞 pgz_ と、同じノートの行 e-cache の接頭辞 ecache_と行 e-sess-closed の接頭辞 sclosed_・この行の接頭辞 pquest_ は並べない）は aaround_・accept_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・board_min_・bport_・brand_・btuck_・cadopt_・cgdom_・cmark_・contract_form_・cround_・csled_・denv_・flight_・fmark_・frame_・fserve_・fstop_・gapspage_・gfresh_・ghb_・glabel_・gnav_・graph_・gsum_・gtuck_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hfig_・hook_・hruling_・hsblock_・hsderive_・hspage_・hsym_・iclose_・ilink_・kcli_・klink_・lcard_・ledgerblock_・lhome_・lspark_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・parts_・pclosed_・pfold_・pipe_・plimit_・pmore_・project_・ptitle_・pwhole_・qblock_・qgate_・qkey_・question_・rhold_・runsdoc_・saxis_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_・pgz_・ecache_・sclosed_ で、新しい歯の名から先頭の pquest_ を除いた字は、このどれも部分の字として含まない（例 pquest_stage_x・pquest_question_x・pquest_stats_x は不可）。畳んだ語で足りる（着地済みの filter のうち歯の名そのものと server_ で始まる接頭辞と stage_ で始まる接頭辞は、並べた語を部分の字として含む）。名は done に書いた pquest_table_arm・pquest_board_cards・pquest_next_step_not_stalled・pquest_session_line_questioned・pquest_fixture_card・pquest_own_names_clean（どれも並べた語を含まない）。
      依存と順。depends は空（計画の 9 節の行の依存 c-next-stall は着地済みで、先に流すと札になった問いの走行が今の止まっている走行の段に数えられるが、c-next-stall の後は Questioned を数えない・main で確かめた）。同じノートの行 e-cache とは書く file も置き場だけの = も重ならないので並べて流す。同じノートの行 e-sess-closed とは、あちらが書く src/account/project.rs をこの行が置き場だけの = で持ち、tests/pclosed.rs を両方が置き場だけの = で持つので、器は同時に流さない。そこで便の bead の依存で c-pipe-questioned → e-sess-closed の順に流す（e-sess-closed の歯は RunStage の段 Questioned を使わないので、順を逆にしても値は変わらない）。計画の 5 節の鎖は、中核の pipeline.rs が c-next-stall（置き場だけの =）→ c-pipe-closed → c-pipe-questioned、tests/stats.rs が c-pipe-closed（置き場だけの =）→ c-pipe-questioned（この行は fixture の期待を直し、歯の字は直さない）。外の依存は足さず、Cargo.toml・契約の型の crate・境界と面の crate・next_step.rs と account/project.rs の字は触らない。
