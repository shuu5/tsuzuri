    type: prose
    title: 行 e-sess-closed — 閉じた bead の run を session の表から外す
    body: |
      なぜ。持ち主の指摘（t3-hub.1（裁定 id = user 2026-09-28T04:1xZ）に逐語で記帳・字はここに写さない）は、止まった run が処分の済んだ後も出たまま放っておかれている、というもの。席の決め（計画 surface-plan の 3 節・台帳で閉じた契約 bead の走行は止まった・動いている札にしない・効果は行 c-pipe-closed と e-sess-closed と g-closed-mark）のうち、pipeline の板と account board の run の 4 列は行 c-pipe-closed（着地済み・.52.62）が直したが、account board の session の表（中核の session_lines）は c-pipe-closed の節の決めた幅 (f) で変えずに残した。今は台帳で閉じた bead の run でも、終わっておらず（RunDone も RunStopped も無い）生きている（席が立っているか最後の event が 1 時間以内）なら段のまま行に出て、段が Failed なら面の並べの止まっているの束に入る（器が RunStopped を書かずに bead だけが閉じた run・席が手で閉じた bead の run）。この行は、台帳で今閉じている bead の run の行を session の表に出さない。欠陥の直しで選び肢が無いので問いを置かない（席の決め）。見本（docs/design/mock3 の acct.js の runAlive と session の行）は bead の状態を見ない（見本の穴）。要件は FR12（口座と席の健康・account board の session の表）。
      在りか・可視性（main 2e0732e で確かめ、99924c3 で読み直した・中核の crate は同じ）。crates/tsuzuri-core/src/lib.rs の 10 行目は pub mod account; で、src/account/mod.rs の 7 行目と 8 行目は pub mod host; と pub mod project; なので、結合試験の file から tsuzuri_core::account::project::session_lines と ProjectTexts と tsuzuri_core::account::host::HostTexts を use で引ける（着地済みの歯 acctpcore と pclosed が同じ形で引く）。HostTexts（derive に Default）は pub な欄 host_toml ほかを持つ。
      在りか・project.rs（write-set・575 行）。25 行目は use crate::ledger::{DAY, epoch_secs, read}; で、pub const ALIVE_S（60 * 60）・RUN_STAGE_EVENTS（RunCreated・RunStage・RunDone・RunStopped・QuestionRaised の 5 種）・RATE_LIMITED と、pub struct ProjectTexts（derive に Default・pub な欄 state_dir_known の bool と、tick_status・state_log・tick_last・move_signal・events・ledger の String の Option）を持つ。私的な struct Run（id と events）は fn last_stage（RUN_STAGE_EVENTS の種類の最後の event）・count・seated（SeatSpawned の数が SeatStopped の数より多い）・ended（RunDone か RunStopped を持つ）・alive（seated か、最後の event が今から ALIVE_S 以内）・account（detail の口座の札の最後）を持ち、私的な fn runs（RunCreated の ts が今以下の run を RunCreated の順に・各 run は ts が今以下の event）と bead_of（run の最初の event の欄 bead か run の id の前半）を持つ。pub fn run_counts_of（行 c-pipe-closed）は、台帳の字を read で読み is_open(now) が偽の bead の id を BTreeSet に集め（字が無いか読めなければ空）、その集まりに在る bead の最新の run の段を Landed と読み替える。
      pub fn session_lines（448 行目・HostTexts の参照と anchor から ProjectTexts の表の参照と今を受け、契約の SessionLine の Vec）は、群の宣言の順の project ごとに orchestrator の行（席の card が読めれば target と口座と状態と since と spans・読めなければ名が空の字で状態 Unknown の行）を出し、state dir が引けて event log が読めれば、runs の run のうち ended でなく alive の run ごとに pipeline の行を RunCreated の順に出す。pipeline の行は、project の名・役 Pipeline・名は run の id・口座は run の account・段は最後の段の event を stage_of に通した値・状態は上限の印 RateLimited なら Limit、段が Questioned・Failed・Stopped でなく席が立っていれば Run、ほかは Wait・いつからは最後の段の event の ts・稼働の記録は Unknown。台帳（texts の ledger）は見ない。pub fn doc は assemble に session_lines の値を渡す。
      使う物（この行は書かない・確かめた）。crate::ledger（src/ledger/mod.rs）の pub(crate) fn read（台帳の一覧の字を受け Bead の Vec の Option・読めなければ None・tombstone の bead は入れない）と Bead の pub(crate) fn is_open（今を受け、status が closed でも tombstone でもなく、closed が今以前でないとき真）。面の src/account/session.rs（書かない）は電文の sessions を表に組み、段が STALLED_STAGES の写し（Questioned・Failed・Stopped）の pipeline の行を並べの止まっているの束に入れる（外した行は表に出ないだけ）。契約の SessionLine と AccountDoc の形は変えない。
      形。session_lines は、project ごとに texts の ledger の字を read で読んで今閉じている（is_open(now) が偽の）bead の id の集まりを作り（台帳の字が無いか読めなければ空の集まり）、pipeline の行を出す run の選びに、run の bead（bead_of）がその集まりに在れば出さない、を足す（ended と alive の決まりと行の欄の値は変えない）。集まりの組み方は run_counts_of と同じにする（組む所を私的な fn に出して run_counts_of と分け合ってよく、run_counts_of の値は変えない）。台帳に無い bead の run と bead の読めない run は今のまま出す。orchestrator の行・project_rows・run_counts と run_counts_of の値・assemble・doc と契約の型は変えない。session_lines の doc に 1 文を足す。
