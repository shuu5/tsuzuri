  - n: 3
    type: prose
    title: 行 g-ruling-busy — 答えの送る button に送っている間を出し、断りを目立たせる
    body: |
      在りかの main は 6ffa67a（計画 surface-plan 第 0.69 版）で、試作は行 e-ruling-retry（ノート surface-wave19f）の差分を当てた土台で撃った。この行は計画だけの行（9 節）を経ずにノートへ置く欠陥の直し（計画 3 節の席の決め）で、承認は計画の裁定を継ぐ。行の拠りは持ち主の報告（2026-09-29）と席の決め（同日・面の見せ方は e-ruling-retry と別の行）。
      なぜ。持ち主の報告では、質問の頁で答えの button を押すと、送れずに button がまた押せる形に戻り、送るまで長く待たされた。今の面（surface/project/ask.rs の mod dom の fn answer_view と fn submit）は、送っている間は button を押せなくするだけで字を替えず、200 の外の応答では小さな 1 行（class small・role status）に「送れなかった: 状態 503」の形を出す。持ち主はこの 1 行に気づかず、押しても飛ばないと見た。server の台帳の断り（503 ledger-unknown・502 ledger-append・502 ledger-close と裁定の id）は本文が契約の断りの電文でない字なので、今の fn outcome は状態の数だけを出し、何も書いていないのか、もう一度押してよいのかが分からない。
      在りか・ask.rs（write-set）。純粋な関数は fn can_send（字の欄が空白だけのときと送っている間は押せない）・enum Outcome（Recorded・Stale・Refused の字）と fn line・fn keeps_text・fn answer_open・fn reloads・fn refusal_text・fn outcome。const REFUSED（字 送れなかった）・NOT_REACHED・BAD_REPLY・RECORDED・STALE。DOM は mod dom の fn answer_view（字の欄と送る button と送った後の 1 行）と fn submit。
      形（ask.rs）。pub const SENDING（字 送っています…）と、server の台帳の断りの理由と次の手の 3 つの字を足す。LEDGER_BUSY は字「台帳が混んでいて読めなかった（503）・何も書いていない・少し待ってもう一度押す」、APPEND_FAILED は字「台帳に書けなかった（502）・何も書いていない・もう一度押す」、CLOSE_FAILED は字「記録したが問いを閉じられなかった（502）・もう一度押さず席に知らせる」。pub fn send_text(sending: bool, ruling: &str) -> String は、送っている間は SENDING を、ほかは決定の語に空白と › を足した字を返す。pub fn server_reason(status: u16, text: &str) -> Option<String> は、本文の前後の空白を除いた字が 503 と ledger-unknown なら LEDGER_BUSY、502 と ledger-append なら APPEND_FAILED、502 と字 ledger-close と空白で始まる字なら CLOSE_FAILED に全角の括弧で包んだ残りの字（裁定の id）を足した字を返し、ほかは None。fn outcome の断りの電文として読めない本文の枝は、server_reason の字か、None なら今の「状態 <数>」を Refused に入れる。Outcome に pub fn note(&self) -> (&'static str, &'static str) を足し、Refused は組 (warn, alert)、ほかは組 (small, status) を返す。mod dom の fn answer_view は、送る button の中身を、決定の語の鍵 ruling の見出しの語で send_text を呼ぶ閉包 send にし（busy は sending の clone）、送った後の 1 行を let (class, role) = o.note(); と <div class=class role=role>{o.line()}</div> で組む。歯が見る mod dom の 4 つの字は、let send = move || send_text(busy.get(), &label(・on:click=click>{send}</button>・let (class, role) = o.note();・<div class=class role=role>{o.line()}</div>。
      変わらない物（歯で測らず、この行の差分で持つ）。can_send と送っている間に押せないこと、200 と 409 の字と一覧の読み直し、断りの電文（RefusalResponse）の理由の字、知らない本文の「状態 <数>」、NOT_REACHED と BAD_REPLY の字。class warn は面の style.css に在る規則（上端の帯の印と同じ見た目）を使い、style.css と語の辞書と見本は書かない。束の panel（surface/project/batch.rs）と方針の panel と取り消しの頁の 1 行は替えない（範囲の外）。
      着地済みの歯（面の crate の tests を grep で確かめ、試作で撃った）。tests/askcard.rs の askcard_ は ask::outcome の 200・409・400・404・状態 503 と本文 busy・届かない・200 の読めない本文の字を測り、この行でも同じ字になるので置き場だけの = で持つ。tests/cadq.rs の cadq_dom_wiring は ask.rs の mod dom の字（struct Live と card_view の呼び）を測り、直さずに通る。tests/frame.rs の frame_classes_are_in_stylesheet は src の class が style.css に在ることを測り、warn は在る。
      測り方・歯（tests/rbusy.rs・新しい file・接頭辞 rbusy_）。面の純粋な関数を host で撃ち、DOM は ask.rs の字を env! の CARGO_MANIFEST_DIR から読んで mod dom より後の字を見る。歯の名は rbusy_send_text・rbusy_reasons・rbusy_note_is_alert。使う item は ask::SENDING・send_text・LEDGER_BUSY・APPEND_FAILED・CLOSE_FAILED・outcome・server_reason・Outcome と契約の型の RulingId（どれも pub）。
      filter の語。main の contracts の verify の filter の語 261 のどれも、接頭辞 rbusy_ と 3 つの歯の名に部分の字として含まれず、接頭辞と名もどの語にも含まれない。workspace の test の fn の名にも rbusy_ を含む名は無い（確かめた）。歯の名は語 server_ を含まないように選んだ。
      依存と順。depends は空（ノートの 1 行目）。ask.rs を書く行は計画 5 節の鎖で g-tick-adopt（ノート surface-wave19a）の後で、この行はその着地の後に字を当て直して流す（便の bead の依存は席が付ける）。同じノートの e-ask-own-only が ask.rs を書くので、その行の depends でこの行の後に置く。server の行 e-ruling-retry とは書く file が重ならず、server の本文の 3 つの字はどれも着地済みの口の file の字（e-ruling-retry は変えない）。
      範囲の外。束の panel・方針の panel・取り消しの頁の送っている間の字と断りの見せ方。記帳の前に応答を返す形の「記帳待ち」の見せ方（席の決めで今は採らない）。見本 mock3 と語の辞書の語。
  - n: 4
    type: prose
    title: 行 e-ask-own-only — ほかの project の board では答えを受けず、面は送る欄を出さない
    body: |
      在りかの main は 6ffa67a（計画 surface-plan 第 0.69 版）で、試作は行 e-ruling-retry（ノート surface-wave19f）と同じノートの g-ruling-busy の差分を当てた土台で撃った。この行は計画だけの行（9 節）を経ずにノートへ置く欠陥の直し（計画 3 節の席の決め）で、承認は計画の裁定を継ぐ。行の拠りは持ち主の報告（2026-09-29）と席の決め（同日）と、器の側の裁定と判断の記録（器の台帳の裁定・器の ADR-0083）。
      なぜ。器（scribe2）の board に出た問い 2 本に、持ち主が答えを送れなかった。器の側の裁定と ADR-0083 は、画面の server が器の台帳へ直に書く形（今の server/ruling.rs の fn accept の bdw の追記と閉じる）を退け、画面の答えは器の答えの口（器の要件 FR82 の channel gui）1 つを通す決まりにした。その口はまだ無い。今の server は 1 つの process が 1 つの repo を持ち、「自分の project」を表す欄は code に無い。席の起こし方（repo の外）は、ほかの project の board を同じ tz で --bdw /bin/false を付けて起こすので、台帳の読みは通って面は送る button を出し、押すと追記が rc 1 で落ちて 502 になる。
      在りか。境界の crate の main.rs の fn parse（--名 値 か --名=値 の引数を読む・既定の値は Config::new）と const USAGE、server/config.rs の struct Config、server/mod.rs の struct Shared と fn bind_with の組み立てと守りの fn guarded と断りの fn refusal、server/ruling.rs の const REFUSED_LOG と fn refusal_line（行 e-ruling-retry）、答えと方針の口の file（server/routes の ruling.rs・revoke.rs・batch.rs・policy.rs）、問いの一覧の口（routes/questions.rs・中核の question::list の字をそのまま電文にする）。契約の crate の question.rs の struct QuestionList（欄 cards だけ）と、中核の crate の question.rs の fn list。面の crate の surface/project/ask.rs（fn cards・mod dom の fn view と fn answer_view）と surface/project/batch.rs（mod dom の fn view）と語の辞書 vocab.json。どれも write-set。
      形・境界。Config に pub read_only: bool（Config::new は偽）を足し、main.rs の fn parse は値を取らない引数 --read-only を読んで真にする（2 度なら使い方の誤り・USAGE と doc に 1 語を足す）。Shared に read_only を足し、fn bind_with が Config から写す。mod.rs に私的な fn read_only(path: &str, questions: &[&BeadId]) -> Response を足し、状態 403 と本文 ruling::READ_ONLY（pub const・字 read-only）の応答を作り、ruling::refusal_line の 1 行を標準エラーに書いて返す。4 つの口の file は guarded の後、受付の fn（accept・revoke・束の accept・方針の accept）を呼ぶ前に、shared.read_only なら read_only を返す（口の path と、束は要求の全部の行の問いの id、方針は空の列）。受付の fn の前に返すので、台帳の読みも書きも配達も撃たない。問いの一覧の口は、中核の list の字に answerable: !shared.read_only を上書きして電文にする。
      形・契約と中核。QuestionList に pub answerable: bool を足し、serde の default は真にする（欄の無い電文は答えを受ける・前の server と組の面が今のまま動く）。中核の fn list は answerable を真で組む（答えを受けるかは server が決める）。
      形・面。ask.rs に pub const CHAT_KEY（字 answer_in_chat）と pub fn answerable(fetched: &Fetched) -> bool（本文を QuestionList に読めればその欄、読めない本文と NotRead と Failed は真）を足す。fn cards の QuestionList の型の見本の 2 つの枝に .. を足す。mod dom に私的な struct CanAnswer(Memo<bool>)（Clone と Copy）を足し、fn view は provide_context で置き、fn answer_view は use_context で読む（無ければ真）。送る欄の開きは answerable() && の後に今の字を続け、読むだけのときは送る欄の代わりに class small muted と data-term の CHAT_KEY の 1 行（label(CHAT_KEY)）を出す。batch.rs の mod dom の fn view は can_answer の Memo を組み、形が Filled で can_answer が偽なら欄と button の代わりに同じ 1 行を出す。語の辞書 vocab.json に鍵 answer_in_chat（label チャットで答える・plain・internal・orig）を足す。歯が見る ask.rs の mod dom の 4 つの字は、provide_context(CanAnswer(Memo::new(move |_| fetched.with(answerable))));・move || answerable() && outcome.with(・(!answerable()).then(|| view! { <div class=・data-term=CHAT_KEY>{label(CHAT_KEY)}</div> })。batch.rs の mod dom の 2 つの字は、let can_answer = Memo::new(move |_| fetched.with(ask::answerable));・Body::Filled(()) if !can_answer.get() => {。
      決めた幅（起草の決めと席の決め）。「自分」の決め方は、起動の引数 --read-only で読むだけを名指す形にした（既定は今のまま答えを受ける）。台帳の接頭辞（t3）を code に持つ形は、fixture に台帳の接頭辞 t3-hub を使えない決まり（起草の規則 12）で歯が組めず退けた。repo の置き場の config の接頭辞と比べる形も、同じ const を持つので退けた。面への知らせは問いの一覧の電文の欄にした（面の fetch の口は本文と状態だけを返すので頭の行は読めない）。断りの状態は 403（守りの Origin の 403 と同じ数・本文の字で分ける）にし、契約の断りの閉じた値（Refusal）は足さない（面は送る欄を出さないので押されない）。席の起こし方の script（repo の外）に、ほかの project の行の --read-only を足すのは席の手。
      変わらない物（歯で測らず、この行の差分で持つ）。read_only が偽の server の全部の口の振る舞い、guarded の 400 と 403 と 413 の先の断り、受けの口の数と path、GET の口の読み、心拍の POST の口（読むだけでも受ける）。方針の panel と取り消しの頁の面は替えない（server は 403 で断る）。
      着地済みの歯（grep で確かめ、試作で撃った）。QuestionList を struct の字で組む歯 7 file（askcard・batchpanel・frame・nact・parts・qblock・qkey・面の crate）と契約の歯 cform_ledger は、組む字に answerable: true を足す（14 か所・期待は変えない）。snapshot の ledger.json は QuestionList の 3 つの見本に欄 answerable の真が足される。cadq の ask.rs の mod dom の字（struct Live と card_view の呼び）は変えない（CanAnswer を context で渡すのはこのため）。境界の server_ask・server_batch・rvk・epolq は read_only が偽の server で今のまま通るので置き場だけの = で持ち、verify で撃つ。
      測り方・歯。境界は tests/aown.rs（新しい file・接頭辞 aown_）で、server を同じ process の thread で立て、偽の bdw と偽の器は撃たれた回を file に数える。見本は着地済みの fixture の surface/question-2.json。歯の名は aown_read_only_refuses_without_writes・aown_cli_flag_and_log（tz を CARGO_BIN_EXE_tz で撃つ）。面は tests/aface.rs（新しい file・接頭辞 aface_）で、歯の名は aface_answerable_from_wire・aface_chat_line_word・aface_dom_wiring。使う item は Config（欄 read_only）・Server・ruling の PATH・READ_ONLY・REFUSED_LOG・batch の PATH・policy の PATH・契約の型の QuestionList（欄 answerable）・RulingRequest・BatchRequest・BatchItem・RevokeRequest・REVOKE_PATH・PolicyRequest・RulingId・BeadId、面の ask::answerable・CHAT_KEY・Fetched・vocab（どれも pub）。
      filter の語。main の contracts の verify の filter の語 261 のどれも、接頭辞 aown_ と aface_ と 5 つの歯の名に部分の字として含まれず、接頭辞と名もどの語にも含まれない。workspace の test の fn の名にも 2 つの接頭辞を含む名は無い（確かめた）。
      依存と順。depends は g-ruling-busy（同じノート・どちらも ask.rs を書く）。ほかのノートの行との順は便の bead の依存で持つ（席が付ける）。境界の ruling.rs と routes の 3 file は e-ruling-retry（ノート surface-wave19f）の後、mod.rs は a-lean（ノート surface-wave19d）の後、ask.rs は g-tick-adopt（ノート surface-wave19a）の後、vocab.json は g-wins-vocab（ノート surface-wave19a）の後で、どれもその着地の後に字を当て直して流す。main.rs と config.rs は計画だけの行 e-multi-ask も書くので、この行を先に流す（計画 5 節の鎖）。
      範囲の外。器の答えの口（器の要件 FR82 の channel gui）への答えの送り（口が器に在ってから）。1 つの server が複数の project の問いを読む形（計画だけの行 e-multi-ask）。方針の panel と取り消しの頁の面の見せ方。席の起こし方の script の字。

