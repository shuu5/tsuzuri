    body: |
      質問の頁の答えを、送っている間と断りが見える形にし、ほかの project の board では答えを受けない形にする 2 行。
      g-ruling-busy は面の問いの card で、送る button の字を送っている間は「送っています…」にし、断りの 1 行を目立つ形で出し、server の台帳の断りには理由と次の手を出す。
      e-ask-own-only は起動の引数 --read-only の server（ほかの project の board）が答えと方針の口を台帳を撃たずに断り、問いの一覧の電文で面に知らせ、面は送る欄の代わりに「チャットで答える」を出す。
      2 行とも ask.rs を書くので、順はノートの depends で持つ（g-ruling-busy の後に e-ask-own-only）。
