  - n: 3
    type: prose
    title: 行 c-ev-kind — 変化の知らせを種類に分け、口ごとに読み直す種類を持つ
    body: |
      在りかの main は fb9c5c6（計画 surface-plan 第 0.73 版・行 g-ledger-kind の着地 f925e4e の後）。計画 9 節の行 c-ev-kind（M）を置く。承認は計画の裁定を継ぐ。行の拠りは持ち主の重いという指摘（t3-hub.1 の user 2026-09-28T00:4xZ・00:59Z・01:06Z）と要件 NFR2 と規則の行 R-21。
      なぜ。知らせの口 GET /api/surface/events（境界の server の server/events.rs）は、台帳の見張りの読みの結果が変わると ledger-changed を、板の印の file（器の event log・設計文書の dir の下の全 file・席の状態の file・account board の印）のどれかが動くと board-changed を 1 件送る。board-changed はどの印が動いたかを持たない（data は欄 at だけ）。面（surface/net.rs）は 2 つの名のどちらを受けても fn reload_all で登録された口を全部読み直す。器は席の dir の tick-last を 15 秒ごとに書き替える（計画 9 節の字）ので、project board は 15 秒ごとに台帳・指標・未反映・問い・グラフ（設計の索引を読む子 process を撃つ）・pipeline・次の一手・席の card・project の名の口を全部読み直す。
      在りか（今の main の字）。contract/surface.rs（write-set）の pub const BOARD_CHANGED_EVENT（字 board-changed）と、contract/ledger.rs の pub const LEDGER_CHANGED_EVENT（字 ledger-changed）と pub struct LedgerChanged（欄 at）。server/events.rs（write-set）の Hub の pub fn start（台帳の Source と板の印の一覧の関数を受ける）・pub fn watch_board（印の一覧を poll ごとに取り直し、印が動けば board_changed(now()) を撃つ）・pub fn ledger_changed(at)・pub fn board_changed(at)・私的な fn send(event, at)（どちらの data も LedgerChanged を encode する）・私的な type BoardStamps と fn board_stamps。server/mod.rs（write-set）の fn bind_with は Hub::start に、runs.marks()・design.marks()・席の seat_marks・account の印 held_marks を 1 つの列にして返す関数を渡す。server/form.rs（write-set）の私的な fn shoot は台帳の形の行の一覧が変われば hub.board_changed(now()) を撃つ。surface/view.rs（write-set）の pub const RELOAD_EVENTS（2 つの名の列）。surface/net.rs（write-set）の fn connect は開いたに go_live、RELOAD_EVENTS の 2 つの名に Closure::new(reload_all) を付け、pub fn reload_all は READS と WATCHES の全部の枠の読みの印に call を撃つ。
      形（契約・contract/surface.rs）。pub enum ChangeKind（Seat・Runs・Design・Ledger・Account・serde は kebab-case の字 seat・runs・design・ledger・account・derive は Debug・Clone・Copy・PartialEq・Eq・PartialOrd・Ord・Hash・Serialize・Deserialize）と、pub const ChangeKind::ALL（この 5 つをこの順に並べた配列）と、pub struct BoardChanged（pub at: EpochSecs と pub kinds: Vec<ChangeKind>・kinds は serde の default で、欄が無ければ空）を足す。board-changed の data は BoardChanged を契約の wire で encode した字（空白なし・欄の順は at・kinds）で、kinds が空なら全部の種類と読む。ledger-changed の data は今の LedgerChanged のまま（台帳の種類）。BOARD_CHANGED_EVENT の doc を、data が BoardChanged で面は種類を読む口だけを読み直す字に直し、module の doc に 1 行足す。
      形（境界・server/events.rs）。Hub::start と Hub::watch_board の板の関数の型を、印の file の列から、種類と file の組の列 Vec<(ChangeKind, PathBuf)> に替える。BoardStamps は種類と path と印の組の列にし、fn board_stamps は周の途中で消えた file を、撃ち直した一覧に同じ種類と path の組が在るときだけ残す（今の決め方を組に広げる）。私的な fn moved(seen, current) を足し、ChangeKind::ALL の順に、種類ごとの印の列（その種類の path と印を一覧の順に並べた列）が前の周と違う種類を返す。見張りの周は、印の列が前と違えば moved の種類を取り、seen を置き直し、種類が空（種類をまたいで一覧の並びだけが変わった周）なら送らず、ほかは board_changed(&kinds, now()) を撃つ。1 つの file が 2 つの種類の一覧に載れば、その file の変化は 2 つの種類を 1 件の data に並べる（受け手に届くのは周に 1 件のまま）。pub fn board_changed の引数を (kinds: &[ChangeKind], at: u64) にして BoardChanged を encode し、ledger_changed は LedgerChanged を encode し、私的な fn send は event の名と data の字を受けて frame を組む（id の数え方と frame の形と受け手の外し方は今のまま）。module の doc の 2 行を直し 1 行足す。単体の歯 server_read_watch_board_sends_on_marks は板の関数が組を返すように 1 行を直し、期待は変えない。
      形（境界・server/mod.rs と server/form.rs）。fn bind_with が Hub::start に渡す関数は、私的な閉包 kinded（種類と file の列から組の列を作る）で、runs.marks() を ChangeKind::Runs・design.marks() を Design・seat_marks を Seat・held_marks の中身を Account の組にして 1 つの列を返す（並びは今のまま走行・設計・席・account）。server/mod.rs の module の doc に 1 行足す。server/form.rs の shoot は hub.board_changed(&[ChangeKind::Ledger], now()) を撃つ（台帳の形の行は台帳の見張りの読みの周の字から撃つので台帳の種類）。module の doc と shoot の doc を直す。
      形（面・surface/view.rs）。今の main の view.rs の use の塊は、契約の EpochSecs・board::Reading・graph::NodeKind・ledger の 3 つ・project::ProjectName・surface::BOARD_CHANGED_EVENT・wire と、crate の frame::BRAND と vocab::{label, vocab}（行 g-ledger-kind が NodeKind と vocab を足した）。この行が触る item は、module の doc の 1 行・use の 3 行（surface の行を BOARD_CHANGED_EVENT・BoardChanged・ChangeKind に広げ、wire の行を契約の account・project・runs・wire の行にし、crate::project の ask・ledger・map・next・nodearound・pipeline・seat の行を frame と vocab の行の間に足す）・RELOAD_EVENTS の doc・新しい pub const RELOAD_KINDS・新しい pub fn path_kinds・pub fn reloads・pub fn changed_kinds だけで、新しい item はどれも RELOAD_EVENTS の直後に置く（fn settle・fn mark・行 g-ledger-kind の MEMO_OPEN_KEY と fn row_mark ほかの今の item の字は変えない）。RELOAD_EVENTS の字（2 つの名の列）は変えない。RELOAD_KINDS は口の path と種類の組の 12 行で、path は面の block の module の定数と契約の定数から引き、字の /api/ を直に書かない（歯 parts_paths_distinct_in_block_modules の決まり）: project::seat::PATH は [Seat]・project::next::PATH は [Ledger, Runs, Seat]・project::ledger の PATH と METRICS_PATH と UNREF_PATH と project::ask::PATH は [Ledger]・project::pipeline::PATH は [Ledger, Runs]・project::map::PATH と project::nodearound::PATH は [Ledger, Runs, Design]・契約の runs::PATH は [Runs]・契約の account::PATH は [Account, Ledger]・契約の project::PATH は空。種類は server の口の読みから決めた: 席の card の口は席の状態の file だけを読み、次の一手の口は台帳と event log と席の card を読み（中核の next_step_seat の LimitOrMove と Unresponsive は席の card で判じる）、台帳・指標・未反映・台帳の 1 本・問いの口は台帳だけ、pipeline の口は台帳と event log と台帳の形の行、グラフ・グラフの眺め・近傍の口は設計の索引と台帳と event log（gather_held の 2 つの引数が真）、走行の口は event log だけ、account の口は account board の印と自分の repo の台帳（見張りの Source）、project の名の口は起動の repo から決まる。path_kinds(path) は path の最初の ? より前の字を、表の path と同じか、表の path に / を続けた字で始まる最初の行の種類を返し（グラフの口の行がグラフの眺めの口を、台帳の口の行が台帳の 1 本の口を持つ）、当たる行が無ければ ChangeKind::ALL を返す。reloads(path, kinds) は path_kinds のどれかが kinds に在れば真。changed_kinds(event, data) は、event が LEDGER_CHANGED_EVENT なら [Ledger]、BOARD_CHANGED_EVENT なら data を BoardChanged として読んで kinds（読めない・data が無い・kinds が空なら ChangeKind::ALL）、ほかの名なら空を返す。
      形（面・surface/net.rs）。pub fn reload_all の本文を私的な fn reload_if(|_| true) の 1 行にし、今の本文（READS の枠ごとに call・WATCHES の枠ごとに path が空でなければ call して round を取り load_watch・最後に count_busy）を fn reload_if(pick: impl Fn(&str) -> bool) へ移して、枠の path が pick に当たるときだけ call を撃つ。私的な fn reload_changed(event: MessageEvent) を足し、changed_kinds(&event.type_(), event.data().as_string().as_deref()) の種類で reload_if(|path| reloads(path, &kinds)) を撃つ。fn connect は RELOAD_EVENTS の 2 つの名に Closure::<dyn FnMut(MessageEvent)>::new(reload_changed) を付ける（開いたの go_live と、切れたの link_lost と、開いたの event の link_back は今のまま）。use に web_sys の MessageEvent と view の changed_kinds と reloads を足し、module の doc の 1 行を 2 行に直し、connect の doc の字を直す。web-sys の feature MessageEvent は Cargo.toml に在る（Cargo.toml は書かない）。
      変わらない物（歯で測らず、この行の差分で持つ）。event の名 2 つとその字、ledger-changed の data の字、SSE の頭と retry と keepalive、見張りの間隔（POLL 500 ミリ秒）と台帳の周期の読み（Hub::watch と Hub::watch_ledger）、接続が開いた時の読み（go_live は reload_all で全部の口を読む・project の名の口もこの読みで読む）、台帳の読みが落ちている間の読み直し（fn note は reload_all）、書きの口へ送った後の block の reload_all、知らせの切れの持ち回し（link_lost と lose_all）。account board の印の取り直し（ACCT_MARKS_EVERY）と席の印の file の列は変えない。
      決めた幅（起草の決め）。(i) 種類は event の名でなく board-changed の data の欄 kinds に載せる（採る）。名を種類ごとに分けると、席・account・走行・設計・台帳の形の行の変化で字 board-changed を待つ着地済みの歯（server_seat・server_acctwire・server_read・pmisroute・wsteady と events.rs の単体の歯）を全部書き直すことになり、1 つの file の変化が 2 つの種類に当たると 2 件になる。data に載せると、どの歯も直さずに通り（試作で撃った）、周に 1 件のままで、kinds を持たない data を受けた面は全部の口を読み直す（読み落としの無い側）。(ii) 計画の字は tick で /api/seat だけだったが、next_step_seat が席の card で判じるので /api/next も席の種類で読み直す（席の決め 2026-09-29・次の一手の口は席の card で LimitOrMove と Unresponsive を判じるので、席の種類を外すと席の変化の後の次の一手が台帳か走行が動くまで古いまま残る）。次の一手の口の読みは設計の索引を読まない（gather_held の第 1 の引数が偽）ので、tick ごとの読みは席の card と次の一手の 2 口になる。(iii) 台帳の形の行の変化は台帳の種類（読むのは pipeline の口だけだが、種類を 5 つに保つ）。(iv) project の名の口は種類を持たず、合図では読み直さない。(v) 表に無い口と、読めない data は全部の種類（新しい口を足した行が表を直し忘れても、今と同じく全部を読み直す）。
      着地済みの歯（grep で確かめ、試作で撃った）。書く歯: 境界の tests/wsteady.rs は Hub::watch_board に渡す 2 つの板の関数（wsteady_vanished_path_one_event と wsteady_absent_listed_path_changes）が組の列（種類は Design）を返すように直す（期待と WRITERS と BODIES は変えない）。面の tests/flight.rs の flight_net_wiring_text は、reload_all の本文の call の数を見る字を fn reload_if の本文に、connect の字 new(reload_all) を new(reload_changed) に替える（行 g-reads の done (5) の、最初の読みを接続の開きまで待ち口ごとに読みの印を呼ぶ字の並びは保つ）。面の tests/gpulse.rs の gpulse_net_text は count_busy を見る fn の名の列と最後の見方の reload_all を reload_if に替える。契約の tests/cform_surface.rs の見本の列の最後に surface::ChangeKind と surface::BoardChanged を足し、tests/snapshots/surface.json の最後に同じ 2 つの鍵を足す（歯 cfsplit_snapshot_keys_floor は鍵の床なので直さずに通る）。直さずに通る歯（置き場だけの =）: 面の parts.rs（parts_reload_events_from_contract_constants は RELOAD_EVENTS と 2 つの名の字と EventSource::new の 1 か所と net の字 RELOAD_EVENTS を見る・parts_paths_distinct_in_block_modules は src の /api/ の字を見る）・steady.rs（pub fn reload_all() の外形）・gfresh.rs（fn note の reload_all() と connect の link の字）・境界の server_read.rs（board-changed の data が欄 at で始まる）・契約の cfsplit.rs。どこを grep したか: 契約・中核・境界・面の crate の tests と src と xtask の src を、この行が書く item と file の字（watch_board・board_changed・ledger_changed・Hub::start・Hub::default・Hub::watch・watch_ledger・server::events・board-changed・ledger-changed・BOARD_CHANGED_EVENT・LedgerChanged・RELOAD_EVENTS・reload_all・src/net.rs・src/view.rs・server/events.rs・server/mod.rs・server/form.rs・snapshots/surface.json）で探した。中核の crate と xtask には読み手が無い。見つけた読み手のうち上の書く歯と = の歯のほかは、次の歯を置き場だけの = で持ち verify で撃つ（どれも直さずに通る・試作で撃った）: 境界の server_seat.rs（server_seat_state_files_send_board_changed と hbmark_off_file_sends_board_changed が字 board-changed の到着を見る）・server_acctwire.rs（acctwire_marks_send_board_changed）・pmisroute.rs（form の知らせの字 board-changed）・server_min.rs と server_src.rs と lstore.rs（ledger-changed の frame と数）・lidle.rs（Hub::watch と ledger_changed の frame の字）・rhold.rs（events.rs の fn start の本文の字 source.read()）・hbroute.rs と iclose.rs と ecache.rs と hbconf.rs と hbpost.rs（mod.rs の字）・server_acct.rs（alean_wiring_text が mod.rs の字、acchold_events_doc_names_off が events.rs の module の doc の語 heartbeat-off と Acct::marks と e-seat-hbmark を見る・この行は doc の 3 語を残す）、面の accthb.rs と rvknode.rs（src の字 crate::net::reload_all()）・aaround.rs と ticker.rs（net.rs の字）・gjst.rs（view.rs の字）・gpface.rs（契約の snapshot の surface.json に旧い形の方針の id が無い）、契約の fxpre.rs（snapshot の surface.json の fixture の接頭辞）。events.rs の単体の歯 server_src_watch_ の 2 本と server_min_hub_sends_to_each_subscriber は Hub::watch と ledger_changed を使うので --lib の名で撃つ（src の中でこの字を名に持つ fn は events.rs の 3 つだけ）。server_seat.rs は保留の便 c-limit-resume が書くので、この行と同時に流さない（器の交差の断りが持ち、順は席が決める）。
      測り方・歯（境界の tests/evkind.rs と面の tests/evkindview.rs・どちらも新しい file・接頭辞 evkind_）。境界の 4 本: evkind_board_sends_moved_kinds（Hub::default と subscribe と Hub::watch_board に 20 ミリ秒の poll と、作業場の 5 つの file を席・席・走行・設計・account・account の 6 組に並べた列を渡す・印は作業場の put の dir に書いてから rename で移す）・evkind_frames_exact・evkind_serve_marks_by_kind（Config と Server::bind で 127.0.0.1 の空き port に server を起こす・偽の bd は空の列を出し、偽の器は rc 1 で落ちる・席の target は proj-1:0.1）・evkind_wiring_text（CARGO_MANIFEST_DIR から src/server/mod.rs と src/server/form.rs を読む）。面の 4 本: evkind_path_kinds_table・evkind_seat_reloads_two・evkind_changed_kinds・evkind_net_wiring_text（src/net.rs を読み、fn の本文は fn の頭から次の行頭の fn・pub fn・async fn・pub async fn の前まで）。面の 14 の口の字は、台帳の 1 本が契約の ITEM_PATH に fx-a.1、グラフの眺めが mapview::graph::PATH に ?open=fx-a、近傍が nodearound::PATH に ?id=fx-a.1&k=1&fold=、走行が契約の runs::PATH に ?bead=fx-a.1 を足した字で、ほかは定数のまま。使う item は境界の server::events::Hub（default・subscribe・watch_board・ledger_changed・board_changed）・server::design::DESIGN_DIR・server::{Config, Server}、契約の surface::{BoardChanged, ChangeKind, BOARD_CHANGED_EVENT}・ledger::{ITEM_PATH, LEDGER_CHANGED_EVENT}・account::PATH・project::PATH・runs::PATH・wire::decode、面の view::{path_kinds, reloads, changed_kinds}・mapview::graph::PATH・project の ask・ledger・map・next・nodearound・pipeline・seat の module の PATH と METRICS_PATH と UNREF_PATH（どれも pub）。噛み（直しを 1 つずつ戻すと名指す歯が落ちる・試作で 12 通りの戻しを 13 回撃ち、view.rs にかかる 5 回は main fb9c5c6 の写しで撃ち直した）: 見張りが印の動いた種類でなく全部の種類を送る・種類が空の周も送る・席の印を account の種類で渡す・板の data を LedgerChanged で encode する・form が全部の種類で送る・path_kinds の / の決まりを外す・次の一手の口から席を外す・project の名の口に台帳を持たせる・空の kinds を全部の種類にしない・台帳の合図を全部の種類にする・reload_changed が reload_all を撃つ・ChangeKind の kebab-case を外す。
      filter の語。main fb9c5c6 の contracts の verify の filter の語 269 のどれも、接頭辞 evkind_ と 8 つの歯の名に部分の字として含まれず、接頭辞と名もどの語にも含まれない（確かめた）。--lib の filter は単体の歯の名 server_read_watch_board_sends_on_marks と server_min_hub_sends_to_each_subscriber をそのまま使い、server_src_watch_ は events.rs の 2 本だけに当たる（どれも write-set の中）。
      依存と順。depends は空（ノートの行は 1 つ）。surface/view.rs を書いた行 g-ledger-kind（ノート surface-wave18f）は着地済みで、この行の view.rs の字はその着地の後の字に当て直した（試作と verify と view.rs の噛みを main fb9c5c6 の写しで撃ち直した）。計画 5 節の鎖では、server/events.rs は e-idle（着地済み）→ c-ev-kind → e-signal、server/mod.rs は a-lean（着地済み）→ c-ev-kind、contract/surface.rs は g-policy-face（着地済み）→ c-ev-kind、surface/net.rs と歯 flight.rs は g-pulse（着地済み）→ c-ev-kind、歯 parts.rs は g-graph-label（着地済み）→ c-ev-kind。便 c-limit-resume（保留）とは、この行が置き場だけの = で持つ歯 server_seat.rs だけで重なり（境界の server/seat.rs は書かない）、この行を先に流す（席の決め 2026-09-29）。計画だけの行のノートとの重なり: 行 g-nav（ノート surface-wave20c）は歯 gpulse.rs を置き場だけの = で持ち、この行は書く。行 t-pub-scan（ノート surface-wave20a）は歯 server_min.rs を書き、この行は置き場だけの = で持つ。どちらもこの行と同時に流さず、順は便の bead の依存で持つ（席が付ける）。gfresh.rs・aaround.rs・hbconf.rs は両方が置き場だけの = で持つだけ。
      範囲の外。席の種類を tick と状態の file に割ること、応答の途絶えた席（tick が止まる）を知らせ無しで面に出すこと、account board の口の中の block ごとの読み分け、行 e-signal（器の合図）、行 c-abs-time（時刻の値を絶対の時刻で送る）。

