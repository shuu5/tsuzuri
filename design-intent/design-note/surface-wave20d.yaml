sections:
  - n: 1
    type: prose
    title: 目的
    body: |
      変化の知らせ（SSE）を種類（席・走行・設計・台帳・account）に分け、面が合図の種類を読む口だけを読み直すようにする、契約と境界と面の crate の行 1 つ。
      今の server は板の印（器の event log・設計文書・席の状態の file・account board の印）のどれが動いても種類を持たない board-changed を送り、面はどの合図でも登録された口を全部読み直す。器は席の tick-last を 15 秒ごとに書き替えるので、project board は 15 秒ごとに設計の索引を読むグラフの口を含む全部の口を読み直す。
      直しは、契約に知らせの種類と板の変化の知らせの data を足し、server は印の列に種類を付けて周ごとに印の動いた種類を data に並べ、面は口ごとに読み直す種類の表を持って合図の種類を読む口だけを読み直すこと。event の名と台帳の知らせの字と、接続が開いた時と書きの後の全部の読み直しは変えない。
