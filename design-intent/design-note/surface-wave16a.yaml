    body: |
      契約の crate の歯の file を割る行 2 つ。
      契約の snapshot tests/snapshots/contract_form.json を契約の型の群（surface・ledger・graph・board・stats・seat）ごとの json に割る行 t-cform-json と、契約の歯 tests/contract_form.rs を群ごとの歯の file に割る行 t-cform-split を、この順に流す。
      見本の id の組み立て・snapshot の読み比べ・往復・閉じた列の数えの手は 1 つの module に置き、歯の関数の名と見本の値と assert の文は変えない。
      群ごとの鎖に分かれ、地図のグラフ・席の card・pipeline の板・台帳の指標の行を並べて流せるようにする。群の持ち分と共通の手の 1 か所と行数の上限と割る前の path の字の残りは新しい歯で見張る。
