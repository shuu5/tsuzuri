着地の後の行 t-cform-split の便 t3-hub.52.101 の審査の差し戻し（節と goal が、着地した見張りの歯の file の行の数を試作の字で書き、着地した字と照らせない断言を持っていた）を受けて、t-cform-split の節と goal の在りか・行の番号・行の数・歯の数を着地した後の main a5f602f（計画 v0.53）の字から取り直し、試作をその写しで撃ち直した（試作の git diff は 119397 byte）。t-cform-json の行の字は着地したまま変えない。

