  - n: 3
    type: prose
    title: 行 t-cform-json — 契約の snapshot contract_form.json を契約の型の群ごとの json に割る
    body: |
      在りかの main は f71082f（計画 surface-plan 第 0.50 版）。この行の書く file（契約の歯 contract_form.rs と snapshot・中核の qblock.rs と nsum.rs・面の gpface.rs）の字は、契約の歯と snapshot を最後に書いた行 c-dn-unknown〔便 t3-hub.52.93〕の着地の commit ddc1627 と同じ。この節の行の番号と行の数はその字で、試作はその写しで撃った。
      なぜ。契約の歯 tests/contract_form.rs と snapshot tests/snapshots/contract_form.json は、契約の型を足すか変える行が全部書くので、地図のグラフ・席の card・pipeline の板・台帳の指標の行が 1 本の鎖でしか流れない。2 つを契約の型の群ごとに割れば、群ごとの鎖に分かれて並べて流せる（持ち主の指示〔2026-09-28〕と席の決め）。割る仕事を 1 行で書いた第 0.3 版の行 t-cform-split は、差分が約 18 万 byte で、器の gate が審査の lens に渡す差分の上限（器の規則の行 gate.token_cap の 150000 byte）を超え、gate がまだ分からない（INCONCLUSIVE）で止まった。そのため割る仕事を 2 行に分け（席の決め）、この行は snapshot だけを割って先に流す（試作の git diff は 68333 byte）。歯の file を割る仕事は、同じノートの行 t-cform-split が後に流す。
      在りか・歯（write-set）。tests/contract_form.rs（1435 行・受付の上限 1500）の頭の doc の 2〜3 行目は、snapshot は全型の見本の値を JSON にした 1 つの file で、字が違えば今の字を CARGO_TARGET_TMPDIR の contract_form.json に書いて落ちる、と名乗る。fn forms（407 行）は let refusals の後の vec の中に 62 の form を、注の行 surface・ledger・graph・board・stats・question・seat の 7 つの塊（417〜1097 行）で並べる。fn snapshot_text（1102〜1116 行・引数なし）は forms() の型の名を鍵にした 1 つの JSON の object の字を組む（鍵は fn forms の順・名の重なりを断る）。歯 contract_form_snapshot_matches（1118〜1140 行）は tests/snapshots/contract_form.json を読み（1120 行）、snapshot_text の字と比べ、違えば今の字を CARGO_TARGET_TMPDIR の contract_form.json に書いて、違う行の番号を言って落ちる。ほかの歯は contract_form_roundtrip_all_types（1143 行）ほか 6 本で、snapshot の file を読まない。snapshot の contract_form.json は 1353 行（鍵 62・fn forms の順）。
      在りか・snapshot を読むほかの歯（write-set）。中核の歯 tests/qblock.rs（366 行）の qblock_snapshot_carries_ids は 211 行で ../tsuzuri-contract/tests/snapshots/contract_form.json を読み、鍵 a1 を持つ object（問いの card）を全部集めて 3 つと数え、id と blocking を見る（3 つとも question の型の見本）。中核の歯 tests/nsum.rs（426 行）の nsum_snapshot_carries_fields は 241 行で同じ file を読み、節点の object を 13 と数え、鍵 graph::GraphNode の 1 つ目の欄を見る（13 とも graph の型の見本）。面の歯 tests/gpface.rs（344 行）の gpface_contract_words は 312 行で同じ file の字を読み、方針の旧い形の字が無く、方針の欄の字が方針の問いの見本の裁定 id であることを見る（surface の型 PolicyResponse の見本）。repo の code でほかに snapshot の path を読む file は無い（grep で確かめた）。
      形。(a) 群は契約の crate の module に合わせた 6 つ。surface（src/surface.rs）・ledger（src/ledger.rs と src/question.rs）・graph・board・stats・seat（それぞれ同じ名の src の file）。見本の群は form の名の頭（コロン 2 つの前の module の名）で決める。(b) 群の json tests/snapshots と群の名の .json の字は割る前の snapshot と同じ書き方（{ の行・鍵ごとに 2 字下げの鍵と値・区切りのコンマ・} の行と改行）で、鍵は群の見本の fn forms の順。割る前の json を 2 字下げの鍵の行で切った塊を群ごとに並べ直した字と同じ。試作で群の json は surface 174・ledger 199・graph 524・board 134・stats 193・seat 139 行（和 1363 は割る前の 1353 から外の括弧の 2 行を引き 6 つの群の 12 行を足した数）、見本の数は surface 16・ledger 10（question の 2 を含む）・graph 20・board 7・stats 4・seat 5。(c) contract_form.rs は 3 か所だけを書く。頭の doc の 2〜3 行目を、snapshot は型の見本の値を JSON にした群ごとの file（tests/snapshots の群の名の json・群は型の名の module の頭で決まる）で、字が違えば今の字を CARGO_TARGET_TMPDIR の群の名の json に書いて落ちる、の字にする。fn snapshot_text の前に const GROUPS（群の名と、群が見本を持つ module の列の 6 組）を置き、fn snapshot_text を引数 forms（Box<dyn Form> の slice）を取る形にする（本体は forms() の代わりに引数を読むほかは今の字）。fn snapshot_matches（引数 group の str と forms）を足し、本体は今の歯 contract_form_snapshot_matches の本体の字で、読む path を tests/snapshots/ と群の名と .json に、落ちる時に書く file を CARGO_TARGET_TMPDIR の群の名と .json にする。歯 contract_form_snapshot_matches の本体は、forms() の見本を型の名の module の頭で GROUPS の群に分け（群の中は fn forms の順・どの群の module でもない見本は落ちる）、GROUPS の順に群ごとに snapshot_matches を呼ぶ。fn forms とほかの歯と見本の fn は書かない。試作で contract_form.rs は 1461 行（上限 1500 の内）。(d) 見張りの歯の tests/cfsplit.rs（新しい file・試作で 136 行）は標準 library と serde_json だけを使い（契約の crate の依存は serde と serde_json だけで、Cargo.toml は書かない）、頭の doc 3 行、const GROUPS（群の名と module の 6 組）・const BEFORE_KEYS（割る前の snapshot の鍵 62・割る前の順）・fn tests_dir（CARGO_MANIFEST_DIR の tests）・fn read を持つ。cfsplit_snapshots_by_group は群ごとに、群の json が空でない object で鍵のコロン 2 つの前が群の module のどれかであることと、鍵が群どうしで重ならないこと、tests の dir に snapshots/contract_form.json が無いことを見る。cfsplit_snapshot_keys_floor は 6 つの群の json の鍵が群どうしで重ならず、鍵の和が BEFORE_KEYS を含むこと（一覧自身に重なりが無いことも）を見る。(e) qblock.rs と nsum.rs と gpface.rs の読む path の字をそれぞれ ledger.json・graph.json・surface.json の path に替える（1 か所ずつ）。
      差分の検めの材料（割る前の字と群の json の対応・試作の差分で確かめた）。割る前の json の鍵の順は fn forms の順で、塊は surface（form 16）・ledger（8）・graph（20）・board（7）・stats（4）・question（2）・seat（5）の順。群の json は自分の群の鍵の塊を割る前の順と字のまま写す（ledger の群は ledger の塊の後に question の塊）。そのため群の json の鍵の順は、cfsplit.rs の BEFORE_KEYS（割る前の順）を群の module で絞った順と同じ（試作の 6 群で確かめた）。歯の本体の字の移し方は、今の歯 contract_form_snapshot_matches の 1120〜1139 行の本体が fn snapshot_matches の本体になり、変わる字は読む path・落ちる時に書く file の名・snapshot_text に引数 forms を渡す字の 3 か所だけ。
      決めた幅（起草の決めと席の決め）。(f) 割る仕事を 2 行にし、snapshot を割るこの行を先に、歯の file を割る行 t-cform-split を後に流す（席の決め・どちらの差分も gate の上限を十分に下回る）。後の行 t-cform-split は contract_form.rs を群の歯の file と共通の手の module に割り、この行の fn snapshot_text と fn snapshot_matches を共通の手へ移し、見張りの歯を cfsplit.rs に足す。(g) 群は module ごとの 6 つにし、question は ledger の群に入れる（question_card の要約値が ledger_item から組まれ、後の行で共通の手に見本を置かないため）。(h) 歯の名は変えない（席の決め）。この行の後も snapshot の歯は contract_form.rs の 1 本で、6 つの群の json を読む。(i) 割る前の snapshot の file は消す（git の中なので戻せる）。群の json の名は群の名だけ。(j) 群の json の持ち分と割る前の鍵が残ることは新しい見張りの歯で見る（割っても、後の行が見本を別の群の json に書けば元の鎖に戻るため・歯を 1 つ足すか見本を落としても verify が全部通るのを防ぐ）。鍵は等しさでなく床（割る前の一覧を含む）で見る（席の決め）。型を足す行は見張りを書かず、型を消すか名を替える行だけが BEFORE_KEYS を直す。(k) 値を字を変えずに移すことは、差分と contract_form_snapshot_matches で持つ（割る前の値を見張りの歯に持つと、後の行が値を替えるたびに cfsplit.rs を書くことになるため・席の決め）。(l) 契約の crate の src/lib.rs の頭の doc（型の外形は tests/contract_form.rs の snapshot の歯が pin する）はこの行の後も正しいので書かない。割る前の path の字の残りを見る歯は、contract_form.rs を消す後の行が足す。
      着地済みの歯（grep で確かめ、試作で撃った）。契約の crate の歯 acctdoc（6 本）は contract_form の file を読まない。src/lib.rs の単体の歯 2 本（skeleton_contract_crate_is_in_workspace と contract_form_id_shape_refuses）は snapshot を読まない（xtask の check で撃つ）。contract_form.rs のほかの歯 7 本と、qblock・nsum・gpface のほかの歯は snapshot の path を読まない。filter の語の一覧に contract_form_ を持つ面と中核の歯は、名を見るだけで直さずに通る。
      測り方・歯。snapshot の歯は --test contract_form と filter contract_form_ で、見張りは --test cfsplit と filter cfsplit_ で撃つ。試作（main f71082f の写し）で契約の crate の歯は 18 本（contract_form 8・見張り 2・acctdoc 6・src の単体 2）が通り、qblock・nsum・gpface を含めた filter で 41 本が通る。clippy（契約の crate・--all-targets・-D warnings）も通る。噛み: 割る前の snapshot を戻すと cfsplit_snapshots_by_group が落ち、見本 graph::HubCut を fn forms と json の両方から落とすと cfsplit_snapshot_keys_floor だけが落ち（見張りが無ければ verify が全部通る）、見本 graph::Verdict を board の json にも置くと cfsplit_snapshot_keys_floor と cfsplit_snapshots_by_group と contract_form_snapshot_matches が落ち、群の json の 1 字を崩すと contract_form_snapshot_matches が落ちる。歯の GROUPS で question を stats の群に替えるか seat を外すと contract_form_snapshot_matches が落ち、歯が割る前の 1 つの json を読む形に戻すと contract_form_snapshot_matches と cfsplit_snapshots_by_group が落ちる。qblock・nsum・gpface の path を割る前の字に戻すか別の群の json にすると、それぞれの歯が落ちる。
      filter の語（main f71082f の contracts の verify の filter の語 236 を、ほかの語を部分の字として含まない 162 語に畳み、見張りの接頭辞 cfsplit_ を除いた 161 語）は aaround_・accept_・acchold_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadl_・cadopt_・cadq_・cdorm_・cgdom_・cmark_・contract_form_・cround_・csled_・cspk_・ctick_・denv_・dnedge_・dnrow_・dnskip_・ecache_・epolq_・flight_・fmark_・fprem_・frame_・fserve_・fstop_・fxpre_・g3g7_・gapspage_・gbnote_・gfix_・gfresh_・ghb_・gjst_・glabel_・gnav_・gpface_・gpill_・gpulse_・graph_・gsum_・gtuck_・gview_・hacols_・harest_・hasplit_・hbconf_・hbmark_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hdchip_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hshist_・hspage_・hspk_・hsym_・iclose_・ilink_・kcli_・klink_・launch_・lcard_・ledgerblock_・lhome_・lidle_・lresume_・lsnap_・lspark_・lstore_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・parts_・pci_・pclosed_・pfold_・pipe_・plimit_・pmisfit_・pmore_・pquest_・pqueue_・project_・ptitle_・punmap_・pwhole_・qblock_・qgate_・qkey_・question_・relay_・rhold_・runsdoc_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・stcli_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_ で、見張りの歯の名（cfsplit_snapshots_by_group・cfsplit_snapshot_keys_floor）はどれもこの語を部分の字として含まない。cfsplit_ は同じノートの行 t-cform-split の見張りの接頭辞で、この行が先に見張りの file を置く。
      依存と順。depends は空。契約の歯と snapshot を最後に書いた行 c-dn-unknown（便 t3-hub.52.93）は着地済み。同じノートの行 t-cform-split はこの行に依り（ノートの depends）、この行の着地の後に流す（便の bead の依存）。この後に起こす契約の型の行（c-dn-edges・c-updated・c-seat-tick・c-limit-resume・c-seat-grace・c-pipe-ci・t-fx-prefix・c-abs-time）は群の歯の file と群の json の両方を書くので、t-cform-split の着地の後に起こす。中核の歯 nsum は c-dn-edges と c-g3g7 が置き場だけの = で持つので、この行と同時に流さない（便の bead の依存）。
      範囲の外。contract_form.rs を群の歯の file と共通の手に割ること・契約の crate の src/lib.rs の doc・割る前の path の字の残りの見張り（どれも後の行 t-cform-split）。見本の値と歯の assert の文を変えること・見本を足すこと・契約の型と中核と境界と面の code・Cargo.toml と Cargo.lock。ほかのノートと計画の contract_form の字を直すこと（席の付け替えの手）。
  - n: 4
    type: prose
    title: 行 t-cform-split — 契約の歯 contract_form.rs を契約の型の群ごとの歯の file に割る
    body: |
      在りかの main は a5f602f（計画 surface-plan 第 0.53 版）。同じノートの前の行 t-cform-json（snapshot を群ごとの json に割る・便 t3-hub.52.98）は着地済み（着地の commit 0b83a7c）。この節の行の番号と行の数と字は main a5f602f の字で、試作はその写しにこの行を当てて撃った（契約の crate の歯と src/lib.rs・群の json・中核の qblock.rs と nsum.rs・面の gpface.rs は 0b83a7c から a5f602f まで変わらない）。割り方と done は見本の列でなく規則で決まり、割る前の歯の名と snapshot の鍵は見張りの歯の閉じた一覧に床として持つ。
      なぜ。契約の歯 tests/contract_form.rs は、契約の型を足すか変える行が全部書く。器は write-set の交わる便を同時に起こさないので、地図のグラフ（c-dn-edges・c-updated）・席の card（c-seat-tick・c-limit-resume・c-seat-grace）・pipeline の板（c-pipe-ci）・台帳の指標の行が 1 本の鎖でしか流れない。前の行 t-cform-json が snapshot を群ごとの json に割った後も、歯の file が 1 つなので鎖は分かれない。この行が歯の file も契約の型の群ごとに割ると、群ごとの鎖に分かれて並べて流せる（持ち主の指示〔2026-09-28〕と席の決め）。割る仕事を 1 行で書いた第 0.3 版は差分が約 18 万 byte で、器の gate が審査の lens に渡す差分の上限（器の規則の行 gate.token_cap の 150000 byte）を超えたので、2 行に分けた（席の決め）。この行の試作の git diff は 119397 byte。
      在りか・歯（write-set）。tests/contract_form.rs（1460 行・受付の上限 1500）は頭の doc（1〜3 行）で、接頭辞 contract_form_ の歯の file で、snapshot は型の見本の値を JSON にした群ごとの file、字が違えば今の字を CARGO_TARGET_TMPDIR の群の名の json に書いて落ちる、と名乗る。共通の手は const AT（37 行）・fn bead（39 行・BeadId::new）・fn ruling（43 行・RulingId::new）・struct Samples（48 行・欄 name と values）・trait Form（53 行・name と json と roundtrip）とその impl（59 行）・fn form（85 行）。私的な見本の fn は 21 本（92〜404 行・seat_view・pipeline_card・ledger_row・root_row・ledger_writes・bead_attr・run_attr・invariant_checks・task_node・run_node・view_nodes・view_edge・around_rows・hub_cut・unreflected_rows・ledger_item・question_card・group_row・quota_used・seat_spans・account_moves）。fn forms（407 行）は let refusals の後の vec の中に 62 の form を、注の行 surface・ledger・graph・board・stats・question・seat の 7 つの塊（417〜1097 行）で並べる。const GROUPS（1102 行・群の名と module の列の 6 組の配列）・fn snapshot_text（1112 行・引数 forms の slice・型の名を鍵にした 1 つの JSON の object・鍵は forms の順）・fn snapshot_matches（1128 行・引数 group と forms・tests/snapshots の群の名の json と読み比べ、違えば今の字を CARGO_TARGET_TMPDIR の群の名の json に書いて落ちる）。#[test] は 8 本で、contract_form_snapshot_matches（1152 行・forms() を module の頭で GROUPS の群に分けて群ごとに snapshot_matches を呼ぶ）・contract_form_roundtrip_all_types（1168 行）・contract_form_ledger_write_argv（1174 行）・contract_form_ids_refuse_bad_shape（1228 行）・contract_form_bd_line_reads（1255 行）・contract_form_ledger_row_labels（1293 行）・contract_form_ledger_item_digest（1314 行）・contract_form_closed_lists（1393 行）。closed_lists は中に fn distinct（1394 行）を持ち、graph の NodeKind・EdgeType・GraphSource・EdgeEnd・Fold・BoxFold・Verdict と、board の NextMove・LedgerJudge・Stage と、stats の CheckResult・UnreflectedKind と、seat の SeatState の閉じた列の数と字を見る。question の見本 question_card の欄 digest は ledger の見本 ledger_item の要約値から組む。群の json（t-cform-json が置いた 6 つ・和 1363 行・鍵 62）はこの行では書かない。
      在りか・見張りの歯と doc（write-set）。着地した tests/cfsplit.rs（138 行）は、頭の doc 3 行・use（std の BTreeSet と Path と PathBuf・serde_json の Map と Value）・const GROUPS（11 行・群の名と module の列の 6 組の配列）・const BEFORE_KEYS（21 行・割る前の snapshot の鍵 62 の配列・割る前の順）・fn tests_dir（86 行）・fn read（91 行・群の名を取り、群の json を読んで object の Map を返す）と、歯 cfsplit_snapshots_by_group（102 行・群の json が空でない object で、鍵はコロン 2 つを含み頭が群の module・鍵が群どうしで重ならない・tests の dir に snapshots/contract_form.json が無い）と cfsplit_snapshot_keys_floor（123 行・BEFORE_KEYS に重なりが無く、群の json の鍵が群どうしで重ならず、和が BEFORE_KEYS を含む）を持つ。契約の crate の src/lib.rs（95 行）の頭の doc の 3 行目は、型の外形は tests/contract_form.rs の snapshot の歯が pin する、と書く。repo の crates と xtask の下の .rs と .toml の file で字 contract_form.rs か字 snapshots/contract_form.json を持つのは、lib.rs の 3 行目と cfsplit.rs（BEFORE_KEYS の doc の 20 行と、割る前の json が無いことを見る 117 行）だけ（grep で確かめた・中核の qblock.rs・nsum.rs と面の gpface.rs は t-cform-json が群の json の path に替えた）。歯の名の語 contract_form_ を filter の一覧に持つ面と中核の歯（hspage・cmark・qblock・nsum・gpface ほか）は名を見るだけ。
      形。(a) 群は t-cform-json と同じ 6 つ。surface（src/surface.rs）・ledger（src/ledger.rs と src/question.rs）・graph・board・stats・seat（それぞれ同じ名の src の file）。見本の群は form の名の頭（コロン 2 つの前の module の名）で決める。(b) 群の歯の file tests/cform_ と群の名の .rs は、頭の doc 4 行（契約の型の外形の歯〔接頭辞 contract_form_〕のうち群の型の見本・snapshot は tests/snapshots の群の名の json で、字の比べは標準 library だけ・共通の手は tests/common/mod.rs に 1 つだけ在る・字が違えば今の字を CARGO_TARGET_TMPDIR の群の名の json に書いて落ちる）、行 mod common;、use（群の file が使う名だけ・今の use の順）、群の見本だけが使う私的な見本の fn（今の字と順のまま）、fn forms（doc は、群の型の見本〔この順が snapshot の file の key の順〕・群の form を割る前の順と字のまま・塊の注の行も残し、surface の群は let refusals も持つ）、歯 contract_form_snapshot_matches（本体は common::snapshot_matches に群の名の字と &forms() を渡す 1 行）、歯 contract_form_roundtrip_all_types（本体は common::roundtrip_all(&forms()) の 1 行）、閉じた列の文を持つ群は歯 contract_form_closed_lists（割る前の文のうち群の型を名指す文と、その文が let で束ねた名を使う後の文を、割る前の順と字のまま）、ほかの歯（割る前の字のまま）を持つ。頭の doc の字は歯で測らない（形として書く）。(c) 共通の手の tests/common/mod.rs は、頭の doc と #![allow(dead_code)]（群の binary はどれも共通の手の一部だけを使う）、pub const AT・pub fn bead・pub fn ruling・pub struct Samples（pub な欄 name と values）・pub trait Form と impl・pub fn form（割る前の字に pub を足すだけ）、pub fn snapshot_text と pub fn snapshot_matches（着地した contract_form.rs の同じ名の fn の字〔doc を含む〕に pub を足すだけ）、pub fn roundtrip_all（本体は割る前の contract_form_roundtrip_all_types の字）、pub fn distinct（割る前の closed_lists の中の fn）を持つ。contract_form.rs の const GROUPS と歯の群の分けは、群の file に割ることで要らなくなる（持ち込まない）。(d) 見張りの歯の tests/cfsplit.rs は標準 library と serde_json だけを使い（契約の crate の依存は serde と serde_json だけで、Cargo.toml は書かない）、次を足す。頭の doc を 5 行（群の json と群の歯の file・床・共通の手と行数の上限・古い path の字）にする。BEFORE_KEYS の後に const HANDS（共通の手の定義の字 10）・const TEETH（割る前の歯の名 8 つと、その名の歯を持つ群の列〔snapshot と往復は 6 群・closed_lists は graph・board・stats・seat・ほかの 5 つは ledger〕）・const LIMIT（1500）・const OLD_PATHS（字 contract_form.rs と字 snapshots/contract_form.json）を、fn read（群の json を読む手）の後に fn read_text（file の字を読む手）と fn test_names を足す。cfsplit_snapshots_by_group に、群ごとの loop の頭で群の file が common::snapshot_matches に群の名と &forms() を渡す字を 1 度だけ持つことと、終わりに tests の dir に contract_form.rs も無いことを足す。cfsplit_test_names_floor は群の file ごとに属性 test の次の fn の名を集め（属性・注・空の行は跨ぐ）、TEETH の名ごとに、列の群の file がどれもその名を持つことを見る。cfsplit_hands_in_common は群の file が行 mod common; を 1 つ持ち HANDS の字を持たないことと、common/mod.rs が HANDS の字を 1 度ずつ持つことを見る。cfsplit_files_within_limit は契約の crate の tests の dir の下の file（下の dir も）がどれも 1500 行以下で、数が 12 より多いことを見る。cfsplit_no_old_paths は CARGO_MANIFEST_DIR の 2 つ上（workspace の root）の crates と xtask の dir を標準 library の read_dir で辿り（名が target の dir と symlink は辿らない）、拡張子 .rs と .toml の file のうち tests/cfsplit.rs 自身を除いたものの字に OLD_PATHS の字が無いことと、辿った file に契約の crate の src/lib.rs が在ること（辿りが空でないこと）を見る。cfsplit_snapshot_keys_floor と、GROUPS・BEFORE_KEYS・tests_dir・read の字は書かない。(e) src/lib.rs の doc の 3 行目を、型の外形は群ごとの歯 tests/cform_*.rs と snapshot tests/snapshots/*.json が pin する（共通の手は tests/common/mod.rs）の字にする（path は code の書式の印で囲む）。この doc の字は歯で測らず、古い path の字が無いことだけを cfsplit_no_old_paths が測る。試作で、群の file は surface 211・ledger 399・graph 378・board 149・stats 196・seat 147 行、common/mod.rs は 123 行、cfsplit.rs は 340 行（HANDS 89 行・TEETH 104 行・LIMIT 125 行・OLD_PATHS 128 行・read_text 146 行・test_names 151 行・歯は 169・202・220・247・271・297 行）。
      差分の検めの材料（割る前の字と群の file の対応・試作の差分で確かめた）。割る前の fn forms の vec の中の塊は、注の行 surface（417 行・form 16）・ledger（580 行・8）・graph（602 行・20）・board（793 行・7）・stats（879 行・4）・question（1024 行・2）・seat（1059 行・5）の順で、群の fn forms の vec は自分の群の塊を注の行ごと割る前の順と字のまま写す（ledger の群は ledger の塊の後に question の塊・surface の群は let refusals の 6 語の vec も写す）。そのため群の file の見本の順は、t-cform-json の歯が群に分けた順（群の中は fn forms の順）と同じで、群の json は書かずに合う。私的な見本の fn は、surface の群に seat_view、ledger の群に ledger_row・root_row・ledger_writes・ledger_item・question_card、graph の群に bead_attr・run_attr・invariant_checks・task_node・run_node・view_nodes・view_edge・around_rows・hub_cut、board の群に pipeline_card、stats の群に unreflected_rows、seat の群に group_row・quota_used・seat_spans・account_moves（計 21・どれも割る前の順）。歯は、snapshot_matches と roundtrip_all_types の本体が共通の手を呼ぶ 1 行に替わるほかは字のままで、ledger_write_argv・ids_refuse_bad_shape・bd_line_reads・ledger_row_labels・ledger_item_digest の 5 本は ledger の群へ移る（本体が名指す契約の型が最も多い群）。closed_lists の文は、NodeKind から Verdict までの graph の文（Fold と BoxFold の let を含む）・NextMove・LedgerJudge・Stage の数の文と後の labels と columns の文（board）・CheckResult と UnreflectedKind の文（stats）・SeatState の数と seat_words と語 stopped を断る文（seat）に割る。群の file と共通の手へ動かす字は、着地した contract_form.rs の 1〜1099 行（頭の doc と use のほか、共通の手・私的な見本の fn・fn forms）と 1167〜1460 行（snapshot の歯のほかの歯 7 本）で、1101〜1165 行（GROUPS・snapshot_text・snapshot_matches・snapshot の歯）は、snapshot_text と snapshot_matches を共通の手へ移し、GROUPS と群の分けは群の file の歯の 1 行 common::snapshot_matches に替わる。
      決めた幅（起草の決めと席の決め）。(f) 割る仕事を 2 行にし、snapshot を割る t-cform-json を先に、歯の file を割るこの行を後に流す（席の決め・どちらの差分も gate の上限を十分に下回る）。(g) 群は module ごとの 6 つにし、question は ledger の群に入れる（question_card の要約値が ledger_item から組まれ、共通の手に見本を置かないため・共通の手は見本の値を持たない）。(h) 歯の関数の名は変えない（席の決め）。snapshot と往復の歯は群ごとに同じ名で 6 本、閉じた列の歯は 4 本（graph・board・stats・seat）になる。後の行の verify の filter contract_form_ はそのまま使え、--test の名だけを群の file に替える。(i) 群の file の名は接頭辞 cform_ と群の名にする（中核の歯 tests/graph.rs と見分ける）。割る前の歯の file は消す（git の中なので戻せる）。(j) 群の持ち分と共通の手の 1 か所と行数の上限と、割る前の歯の名が残ることは、新しい見張りの歯で見る（割っても、後の行が見本を別の群の file に書くか共通の手を写すと元の鎖に戻るため）。歯の名と鍵は等しさでなく床（割る前の一覧を含む）で見る（席の決め）。後の行（c-dn-edges・c-seat-tick ほか）が型や歯を足すたびに cfsplit.rs を書くと、また 1 本の鎖に戻るため。型を足す行と歯を足す行は見張りを書かず、型を消すか名を替える行と歯を消すか名を替える行だけが TEETH か BEFORE_KEYS を直す。契約の crate に新しい module ができて群を足す行だけが GROUPS を直す。(k) 見本と歯の字は動かすだけで直さない（rustfmt を割った file にかけない・割る前の contract_form_ledger_write_argv の assert_eq の中のコンマの後の空白の無い 1 か所も字のまま）。新しく書く共通の手と見張りの字は rustfmt の既定の形。(l) 割る前の path の字の残りは、repo の crates と xtask の .rs と .toml を辿る見張りの歯 cfsplit_no_old_paths で測り、その歯の file 自身は数えない（割る前の file が無いことを見る cfsplit_snapshots_by_group が 2 つの字を持つため・席の決め）。json の古い path は t-cform-json で消えているが、この歯は 2 つの字をまとめて見る（contract_form.rs が消えるのはこの行なので・席の決め）。辿るのは code の file だけで、design-intent と contracts と docs の字（ほかのノートの行の節と導出の toml）は数えない（席の付け替えの手が直すか、着地済みの行の記録として残る）。src/lib.rs の頭の doc と群の file の頭の doc が新しい在りかを名乗る字は歯で測らず、形として節に書く（席の決め・done は古い path の字が無いことだけを求める）。(m) 値と歯の本体を字を変えずに移すことは、差分と群ごとの contract_form_snapshot_matches で持つ（割る前の値を見張りの歯に持つと、後の行が値を替えるたびに cfsplit.rs を書くことになるため・席の決め）。TEETH は歯ごとに持つ群を字で持つ（ほかの 5 つは ledger）。
      着地済みの歯（grep で確かめ、試作で撃った）。契約の crate の歯 acctdoc（6 本）は contract_form の file を読まない。src/lib.rs の単体の歯 skeleton_contract_crate_is_in_workspace と contract_form_id_shape_refuses は doc の行を見ない（verify の --test は群の file と cfsplit だけを撃つので、この単体の歯は xtask の check で撃つ）。中核の qblock・nsum と面の gpface の歯は t-cform-json の後の群の json の path を読み、この行では変わらない。filter の語の一覧に contract_form_ を持つ面と中核の歯は、名を見るだけで名は変わらないので直さずに通る。
      測り方・歯。群の file の歯は verify の 6 行（--test に群の file の名・filter は contract_form_）で撃ち、見張りは --test cfsplit と filter cfsplit_ で撃つ。試作（main a5f602f の写しにこの行を当てた木）で契約の crate の歯は 35 本（群の file の 21・見張り 6・acctdoc 6・src の単体 2）が通り、t-cform-json の後の 18 本（contract_form 8・見張り 2・acctdoc 6・単体 2）から群の file の 21 本と見張り 6 本に替わる。噛み: 割る前の snapshot を戻すか着地した contract_form.rs を消さずに残すと cfsplit_snapshots_by_group が落ち、graph の見本を board の群の file と json へ移すと同じ歯が落ち、群の file に共通の手 bead を写すと cfsplit_hands_in_common が落ち、群の file を 1501 行にすると cfsplit_files_within_limit が落ち、群の json の 1 字を崩すとその群の contract_form_snapshot_matches が落ち、群の歯に別の群の名を渡すと両方が落ちる。歯 contract_form_ledger_write_argv を消すと cfsplit_test_names_floor だけが落ち、seat の群の closed_lists を消すと同じ歯だけが落ち、見本 graph::HubCut を群の rs と json の両方から落とすと cfsplit_snapshot_keys_floor だけが落ち、見本 graph::Verdict を board の群の rs と json にも置くと cfsplit_snapshot_keys_floor と cfsplit_snapshots_by_group が落ちる。src/lib.rs の doc の 3 行目を割る前の字に戻すか、qblock.rs に割る前の path の字を注で残すか（読む path は ledger.json のまま）、xtask の src/main.rs か中核の Cargo.toml に 2 つの字の 1 つを注で残すと、cfsplit_no_old_paths だけが落ちる。qblock・nsum・gpface の読む path を割る前の字に戻すと、それぞれの歯と cfsplit_no_old_paths が落ちる。cfsplit.rs 自身に 2 つの字を足しても、crate の下の target の dir の .rs と、拡張子が .rs と .toml でない file に字を置いても、歯は落ちない。
      filter の語（main a5f602f の contracts の verify の filter の語 238 を、ほかの語を部分の字として含まない 164 語に畳み、この行の接頭辞 cfsplit_ を除いた 163 語）は aaround_・accept_・acchold_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadl_・cadopt_・cadq_・cdorm_・cgdom_・cmark_・contract_form_・cround_・csled_・cspk_・ctick_・denv_・dnedge_・dnrow_・dnskip_・ecache_・epolq_・flight_・fmark_・fprem_・frame_・fserve_・fstop_・fxpre_・g3g7_・gapspage_・gbnote_・gfix_・gfresh_・ghb_・gjst_・glabel_・gnav_・gpface_・gpill_・gpulse_・graph_・gsum_・gtuck_・gview_・hacols_・harest_・hasplit_・hbconf_・hbmark_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hdchip_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hshist_・hspage_・hspk_・hsym_・iclose_・ilink_・kcli_・kindlab_・klink_・launch_・lcard_・ledgerblock_・lhome_・lidle_・lresume_・lsnap_・lspark_・lstore_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・nxorg_・parts_・pci_・pclosed_・pfold_・pipe_・plimit_・pmisfit_・pmore_・pquest_・pqueue_・project_・ptitle_・punmap_・pwhole_・qblock_・qgate_・qkey_・question_・relay_・rhold_・runsdoc_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・stcli_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_ で、見張りの歯の名（cfsplit_snapshots_by_group・cfsplit_test_names_floor・cfsplit_snapshot_keys_floor・cfsplit_hands_in_common・cfsplit_files_within_limit・cfsplit_no_old_paths）はどれもこの語を部分の字として含まない。cfsplit_ は t-cform-json の見張りの接頭辞と同じで、この行が同じ file に歯を足す。群の file の歯の名は割る前の名のままで、filter contract_form_ に当たる。
      依存と順。depends は [t-cform-json]（同じノートの前の行・snapshot を群の json に割り、cfsplit.rs を置いた・着地済み）。この行の後に起こす契約の型の行は、席が付け替えの script でノートの版を上げ、write-set・verify・done の contract_form.rs と contract_form.json の字を群の file に替えてから起こす（graph の群は c-dn-edges・c-updated、seat の群は c-seat-tick・c-limit-resume・c-seat-grace、board の群は c-pipe-ci、surface と ledger の群は t-fx-prefix、stats と board と seat の群は c-abs-time）。群が違えば鎖は別で、並べて流せる（試作で、各行の試作の差分を割る前の字に当ててから割ると、差分はその行の群の file と json だけに落ちた）。後の行が code の字に割る前の 2 つの path の字を書けば cfsplit_no_old_paths が落ちるので、付け替えた行は群の file と json の path だけを書く。src/lib.rs を書く計画の行 i-8 は、この行の後に流す。
      範囲の外。群の json と、中核の qblock.rs・nsum.rs と面の gpface.rs（どれも t-cform-json が書く）。見本の値と歯の assert の文を変えること・見本を足すこと・契約の型と中核と境界と面の code・Cargo.toml と Cargo.lock。ほかのノートと計画の contract_form の字を直すこと（席の付け替えの手）。着地済みの行のノートの write-set と verify の字（着地済みの行は起こさない）。

