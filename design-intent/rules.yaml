# 規則の表 — 数値と開発規律の正本（folio init の雛形・行は利用者が書き換える）
# folio:schema:begin — 生成区間・手で直さない・正本は実装の定数（folio schema --write が書く）
schema:
  version: 1
  top_level: [schema, thresholds, discipline]
  top_level_note: 最上位の節の閉じた一覧（ほかの節は床が落とす）。thresholds と discipline は人が書き、schema は生成区間
  threshold_row:
    required: [id, article, what, value, kind, status, ruling, ruled_at, stage]
    optional: [basis, projection, same_failure, population, note, refs, key]
  discipline_row:
    required: [id, article, what, kind, status, ruling, ruled_at]
    optional: [note, refs]
  refs_note: その行の散文が依っている、article の条以外の id の一覧（ほかの行・要件書の id・判断の記録・別の条と規範文）。各項は id の形で、その行自身の id と article の値は書かない。
  enums:
    kind: [deny, build-check, detect, human-review]
    status: [仮, 凍結, 未定]
    stage: [in-loop, post]
    key: [note-chapters, plan-note, in-loop-min]
  enums_note: stage は憲法の値域 stage と同じ値（実装は憲法から導出した名の列を使う）
  key_note: 閾値の行の欄 key は、道具がその行の値を読む口の名（閉じた一覧 enums.key）。行の id は置き場ごとに意味が違うので、道具は値を読む行を id でなくこの欄で引く。同じ値の閾値の行は置き場に 1 本まで。行が無いときの扱いは key ごとに違う。note-chapters（値 = 設計ノートの章の上限「<正の整数> 章 以下」）は、行が無いか 2 本以上在るか値の形が違えば、章の上限の判定が まだ分からない（道具は既定の値を持たない）。plan-note（値 = 計画のノートの文書 id・種別 build-check・段 post）は、行が無ければ計画のノートの床を掛けない（行の索引と計画だけの行の節を名札の行が名指すノートの外に置けない決まりは、行が無くても掛かる）。2 本以上在るか値が文書 id の形でなければ、計画のノートの判定が まだ分からない。in-loop-min（値 = 極性一覧の段が in-loop の仕掛けの本数の下限「<正の整数> 本以上」）は、行が無ければ下限を数えず床の標準エラーに 1 行出す。2 本以上在るか値の形が違えば、下限の判定が まだ分からない
  kind_meaning:
    deny: 機械が測って、値域の外なら落とす（上限の超過・下限の不足・固定の値との違い。憲法の reject / build-check に対応）
    build-check: 生成時の検査で数え、違反なら落とす（憲法の build-check に対応）
    detect: 記録・起票のみ・止めない（憲法の none に対応）
    human-review: 人が守る作法（憲法の human-review に対応・D 行）
  kind_map_to_constitution:
    deny: [reject, build-check]
    build-check: [build-check]
    detect: [none]
  kind_map_to_constitution_note: R 行にだけ適用する（D 行は作法＝条の機構とは別）。右辺は憲法の値域 mechanism_kind の値
  excluded:
    what: [人の作業の時間（「60 分以内」）, AI の費用（「300k token 以下」）]
    why: 人の作業の時間と AI の費用は測る仕組みが別で凍結できない。M1 の実地試験（非エンジニア 1 回）で初めて数値を決める（要件書 not_frozen）。道具が決定的に測れる機械の待ち時間は除外に当たらず、規則の表の行に載せてよい。
  reverse_reference: 各行は article 欄で条を指し、その条の relations.rules に行 id が載る。
# folio:schema:end
