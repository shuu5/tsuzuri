  - {id: R-42, article: "P-2", what: "host の負荷と詰まりの注意の色の線（project board の帯の host の印と窓・account board の HOME の host の block）", value: "1 分の負荷の core 比が 1.0 を越えたら・io の詰まり（PSI の full の avg60）が 5% を越えたら・memory の詰まり（PSI の full の avg60）が 1% を越えたら、その値と印に注意の色を付ける", kind: "build-check", status: "仮", ruling: "t3-hub.77.28（裁定 id = t3-hub.77.28:20261005T2102Z-1・配達の口・notes に逐語・案 1）", ruled_at: "2026-10-05T21:02Z", stage: "post", note: "出所 = 判断の記録 ADR-27 決定 (5)・ADR-31 決定 (5)・持ち主の裁定 t3-hub.77.28 の推奨（色の線の案の値）。値は中核の定数（ノート surface-wave29d の行 h-host-core の LOAD_WARN・IO_FULL_WARN・MEMORY_FULL_WARN・100 倍の整数）が写し、歯がこの行の字を読み直して比べる。判じは中核の 1 つの関数 over だけで、面は判じ直さない。ちょうどの値は越えない。読めない測りは注意にせず、まだ分からないと出す。値を変えるのは表示の決めの変更として裁定 id を要る", refs: [ADR-27, ADR-31, FR12, R-40]}
  - {id: R-43, article: "P-28", what: "開いた契約の bead（欄 acceptance に契約の行を持ち、状態が closed でない bead）の本数の上限", value: "40 本 以下（値の正本は器の rules の行・行 v-bead-intake が同じ値で足す）", kind: "deny", status: "仮", ruling: "t3-hub.92.7.2（裁定 id = t3-hub.92.7.2:20261006T1144Z-1・notes に逐語・案 甲と推奨の上限の値）", ruled_at: "2026-10-06T11:44Z", stage: "in-loop", population: "台帳の bead のうち、欄 acceptance に契約表の導出の形の [[contract]] の行を持ち、状態が closed でないもの", note: "出所 = 判断の記録 ADR-74 決定 (3)（行 R-31 と R-32 が積もりを止めていた分を移す）。値は同時に開いた契約の bead の最大 29 本（2026-10-04）に余地を足した推奨。数える者は器の受付と preflight で、越える置きは断りの語 contract-open-cap で断る（条 P-28.8）。値の正本は器の行で、この行は写し（行 R-29 と同じ形）。器の行の値を替えるのも、この行の上限の変更として A-2 を通す。行 v-bead-intake の着地までは数える者が居ない", refs: [ADR-74, R-29, R-31, R-32, P-28.8, A-2]}
  - {id: R-44, article: "P-28", what: "契約の bead ごとの本文（description）と欄 acceptance の byte の上限", value: "本文 64 KB 以下・欄 acceptance 24 KB 以下（KB は 1,024 byte で数え、本文 65,536 byte・欄 acceptance 24,576 byte・値ちょうどは通す・値の正本は器の rules の行・行 v-bead-intake が同じ値で足す）", kind: "deny", status: "仮", ruling: "t3-hub.92.7.2（裁定 id = t3-hub.92.7.2:20261006T1144Z-1・notes に逐語・案 甲と推奨の上限の値）", ruled_at: "2026-10-06T11:44Z", stage: "in-loop", population: "行 R-43 と同じ契約の bead（閉じた物は数えない）", note: "出所 = 判断の記録 ADR-74 決定 (3)（行 R-26 の章の上限が守っていた分を移す）。値は契約表の行 566 本の本文に移る節の本文の最大 49.3 KB と欄 acceptance に移る部分の最大 19.2 KB に余地を足した推奨。数える者は器の受付と preflight で、越える物は断りの語 contract-bytes-cap で断る（条 P-28.8）。値の正本は器の行で、この行は写し（行 R-29 と同じ形）。行 R-43 と合わせて、毎周の台帳の読みの量も縛る。行 v-bead-intake の着地までは数える者が居ない", refs: [ADR-74, R-26, R-29, R-43, P-28.8, A-2]}
  - {id: R-45, article: "P-28", what: "開いた計画の memo（契約になる前の計画を置く memo の bead）の本数の上限", value: "4 本 以下", kind: "deny", status: "仮", ruling: "t3-hub.92.7.2（裁定 id = t3-hub.92.7.2:20261006T1144Z-1・notes に逐語・案 甲と推奨の上限の値）", ruled_at: "2026-10-06T11:44Z", stage: "in-loop", note: "出所 = 判断の記録 ADR-74 決定 (3)（行 R-33 の計画だけの行の上限の値のまま移す）。数える者は起票の門（行 t-plan-cap）で、memo の計画の印の形はその行の起草で決める。行 t-plan-cap の着地までは数える者が居ない。値は tsuzuri の行が正本で、緩めるのは条 P-28.3 と P-17.4 に従う", refs: [ADR-74, R-33, P-17.4, P-28.3]}
discipline:
  - {id: D-1, article: "P-16", what: "並列で AI を起動する全ての起動点で、使うモデルと予算（token の上限）を明示し、席の設定を継承させない。作業者の内側は opus まで、1 件ずつの判定は sonnet 可", kind: "human-review", status: "仮", ruling: "s2-07l.214（裁定 id = user 2026-09-24T22:39Z・憲法 v1.0 の発効の承認）", ruled_at: "2026-09-24T22:39Z", note: "出所 = folio2 D1・D2・D4"}
  - {id: D-2, article: "P-7", what: "並列実行の返り値は file に落とし、通知は要約だけにする（agent は自分の出力 file だけ書く）", kind: "human-review", status: "仮", ruling: "s2-07l.214（裁定 id = user 2026-09-24T22:39Z・憲法 v1.0 の発効の承認）", ruled_at: "2026-09-24T22:39Z", note: "出所 = folio2 D5"}
  - {id: D-3, article: "P-12", what: "持ち主への問い（承認の要求・反対側からの確認・相談窓口の質問）は対話面（R-8）の散文で 1 論点 1 問として出し、選択式の問いの窓を使わない", kind: "human-review", status: "仮", ruling: "s2-07l.214（裁定 id = user 2026-09-24T22:39Z・憲法 v1.0 の発効の承認）", ruled_at: "2026-09-24T22:39Z", note: "出所 = folio2 D10・s3:design 席の運用（grill は 1 論点 1 問・推奨 1 つ）", refs: [R-8]}
  - {id: D-4, article: "N-6", what: "版管理へ載せる file に tailnet の住所・機器名（host 名）・口座名を書かない", kind: "human-review", status: "仮", ruling: "s2-07l.214（裁定 id = user 2026-09-24T22:39Z・憲法 v1.0 の発効の承認）", ruled_at: "2026-09-24T22:39Z", note: "出所 = folio2 D8"}
  - {id: D-5, article: "P-19", what: "席は決める係である。調べと設計の起草は係に、実装は便に任せ、出す物を機械の検査で通すか返し、便を置き、決めを記帳する", kind: "human-review", status: "仮", ruling: "t3-hub.92.1.2（裁定 id = t3-hub.92.1.2:20261006T0959Z-1・notes に逐語）", ruled_at: "2026-10-06T09:59Z", note: "出所 = 判断の記録 ADR-73・持ち主の向き（作り直し v4 の席は決める係）・見直しの記録（prompts-review.md §2.1）", refs: [ADR-73]}
  - {id: D-6, article: "A-1", what: "持ち主に問うて止まるのは、段「確認してから」の条（A-1〜A-4）に当たる時と、どの道も見立てだけの分かれの時だけ", kind: "human-review", status: "仮", ruling: "t3-hub.92.1.2（裁定 id = t3-hub.92.1.2:20261006T0959Z-1・notes に逐語）", ruled_at: "2026-10-06T09:59Z", note: "出所 = 判断の記録 ADR-73・作り直しの案（tobe.md の流れ 7）・見直しの記録（prompts-review.md §2.1）。止まる種類の列挙は段「確認してから」の条に任せ、ここで数え直さない（P-2）。持ち主の決めた値と範囲を替えない決まりは D-8 が持つ", refs: [A-2, A-3, A-4, P-2, D-8, ADR-73]}
  - {id: D-7, article: "P-4", what: "ほかの分かれは推奨の案に決めて進め、決めた事を持ち主への報告に明示し、作業中の bead の notes に頭が「決め」の 1 行（決めた事 — 理由 — 外れた時の費え）を書く", kind: "human-review", status: "仮", ruling: "t3-hub.92.1.2（裁定 id = t3-hub.92.1.2:20261006T0959Z-1・notes に逐語）", ruled_at: "2026-10-06T09:59Z", note: "出所 = 判断の記録 ADR-73・見直しの記録（prompts-review.md §2.1）・持ち主の裁定（作り直し v4 は推奨で進める）。報告に明示するのは持ち主の全 project の指示（分岐は明示して見せる）と揃えるため", refs: [ADR-73]}
  - {id: D-8, article: "P-7", what: "持ち主の決めた値と範囲は留保を足して揺らさず、黙って削らない。案を比べる時は失う物を書き、削らない案を先に置く", kind: "human-review", status: "仮", ruling: "t3-hub.92.1.2（裁定 id = t3-hub.92.1.2:20261006T0959Z-1・notes に逐語）", ruled_at: "2026-10-06T09:59Z", note: "出所 = 判断の記録 ADR-73・memo t3-hub.92.1（席の自動の記憶から移した決まり）", refs: [ADR-73]}
  - {id: D-9, article: "P-8", what: "持ち主に出す事実と数は完全な記録と code の現物から取り、途中の log と見立てを丸めない。設計を頼む係にも code の現物を読ませる", kind: "human-review", status: "仮", ruling: "t3-hub.92.1.2（裁定 id = t3-hub.92.1.2:20261006T0959Z-1・notes に逐語）", ruled_at: "2026-10-06T09:59Z", note: "出所 = 判断の記録 ADR-73・memo t3-hub.92.1（席の自動の記憶から移した決まり）", refs: [ADR-73]}
  - {id: D-10, article: "P-27", what: "待ち・門・検証の周回は効きを数えてから足し、検証役は 1 巡までとし、直した所は席が所見と照らす。条の改めと上限の替え（条 A-2.3 が名指す物）は、出す前に必ず攻めさせる", kind: "human-review", status: "仮", ruling: "t3-hub.92.1.2（裁定 id = t3-hub.92.1.2:20261006T0959Z-1・notes に逐語）", ruled_at: "2026-10-06T09:59Z", note: "出所 = 判断の記録 ADR-73・memo t3-hub.92.1（席の自動の記憶から移した決まり）", refs: [A-2.3, ADR-73]}
  - {id: D-11, article: "N-2", what: "再発を防ぐ決まりは記憶に書かず、門・hook・雛形の案として memo に起票する", kind: "human-review", status: "仮", ruling: "t3-hub.92.1.2（裁定 id = t3-hub.92.1.2:20261006T0959Z-1・notes に逐語）", ruled_at: "2026-10-06T09:59Z", note: "出所 = 判断の記録 ADR-73・memo t3-hub.92.1（席の自動の記憶から移した決まり）", refs: [ADR-73]}
  - {id: D-12, article: "P-23", what: "独立した仕事は係を並べ、cache の切れた係に大きな文脈の続きを頼まず新しく起こす。想定外と詰まりは気づいた時に知らせる", kind: "human-review", status: "仮", ruling: "t3-hub.92.1.2（裁定 id = t3-hub.92.1.2:20261006T0959Z-1・notes に逐語）", ruled_at: "2026-10-06T09:59Z", note: "出所 = 判断の記録 ADR-73・memo t3-hub.92.1（席の自動の記憶から移した決まり）。cache が切れるのは今は止まって 5 分の後（製品の値で替わりうる）で、切れた係に続きを頼むと文脈まるごと（10〜20 万 token）を新しく数える", refs: [ADR-73]}
  - {id: D-13, article: "P-7", what: "係に途中で答えを送ったら、出す物がその答えを入れた版かを照らしてから使う。相手の席が待つ条件が成り立ったら自分から知らせる", kind: "human-review", status: "仮", ruling: "t3-hub.92.1.2（裁定 id = t3-hub.92.1.2:20261006T0959Z-1・notes に逐語）", ruled_at: "2026-10-06T09:59Z", note: "出所 = 判断の記録 ADR-73・memo t3-hub.92.1（席の自動の記憶から移した決まり）", refs: [ADR-73]}
