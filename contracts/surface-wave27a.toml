done = "(1) git apply --reverse --check docs/design/patch/cs-types.patch が rc 0（差の file の hunk が全部木に在る） (2) cargo clippy -p tsuzuri-contract -p tsuzuri-core --all-targets --no-deps -- -D warnings が rc 0 (3) 窓の id は字 cw と頭の 0 の無い 1 以上の 10 進の数の字だけを読み（cw12 を読み、cw0・cw・cw01・w1・cw1x・cw-1・CW1 と末に空白の在る字を断る）、名の字は consult-cw12 と retired-consult-cw12、所見の id は窓の id と字 - と 1 以上の数の字だけを読む（cw3-1 を読み、cw3-0・cw3・cw3-01・cw0-1・cw3-1-2・cw3- ・-1 を断る）（歯 cwty_window_ids_read_and_refuse） (4) 頼みの id は字 rq- と UTC の分の字（数字 8 字・T・数字 4 字・Z の 14 字）と字 - と 1 以上の数の字だけを読み（rq-20261003T1412Z-1 を読み、Z の欠け・数が 0・分に数字でない字・数の欠け・rq の後の - の欠け・数の後の字を断る）、分の字の小文字の z を断る（歯 cwty_request_ids_read_and_refuse） (5) 閉じた語は、形が 話す・問う、起こし手が 席・持ち主のチャット・持ち主の button、経路が 見張り・完了・hook・一覧、採否が 採る・一部採る・採らない、窓の状態が 生きている・止まった・閉じた・退いた の順で、どの語も値へ戻り、知らない語は None、電文の字は英小文字の語（partial・done・button・ask）、確かさの probable と添え物の種類の image を電文で断る（歯 cwty_words_closed） (6) 所見と草稿と頼みと未受けと窓の一覧の電文は往復で同じ値に戻り（一覧の 4 つの段が Unknown の電文も）、所見の電文の id と window は字 cw3-1 と cw3、候補の採否と主張の確かさと添え物の種類は字 adopted と verified と report、未受けの電文は鍵 findings と requests の id の字の列（歯 cwty_wire_roundtrip と cwty_board_roundtrip） (7) 所見と草稿と候補と主張と添え物の電文は知らない鍵を断り、草稿の電文は鍵 id を断り、窓の id が cw0 の所見を断る（歯 cwty_unknown_keys_refused） (8) 草稿の欄の名の列 DRAFT_FIELDS は 12 で草稿の電文の鍵と同じ集まり、所見の電文の鍵はそれに id と window と date を足した集まり、保存の写し先 kept_path は字 docs/consult/kept と所見の id と添え物の path を / でつないだ相対の path（歯 cwty_draft_fields_and_kept_path） (9) cargo run -q -p xtask -- check が rc 0"
goal = "在りか。差の file docs/design/patch/cs-types.patch は main 5b1099ae（判断の記録 ADR-29 を発効させた木）に試作の commit 8747a2da（写し drafts/w83a・branch main）を載せて切った（9 file・30,418 byte・+810 −0）。契約の crate に module consult を足し、中核の crate に module consult と 4 つの子の module（finding・lines・quota・launch）を頭の注 1 行だけで置く。子の中身は後の行 cs-finding・cs-lines・cs-quota・cs-argv が書く。 なぜ。判断の記録 ADR-29 は相談の窓を tsuzuri の plugin の機能として作り直し、所見の欄に話題と添え物を足し（決定 1 のウ）、台帳の相談の行の起こし手と経路の語を閉じた列にし（決定 4 と 8）、処分を採る・一部採る・採らない と添え物ごとの保存にした（決定 9）。後の 11 行（命令・hook・server・面）が同じ型を引くので、型を先に 1 つの行で置く。 形（要約・字は差の file）。(a) id の形。窓 WindowId は cw と 1 以上の数、所見 FindingId は窓の id と - と 1 以上の数、頼み RequestId は rq- と UTC の分の字（minute_ok・14 字）と - と 1 以上の数で、どれも頭の 0 を断り、電文では字（serde の try_from と into）。窓の名 name は consult-cw<n>（tmux の窓・作業場の dir・--name）、退いた作業場の名 retired_name は retired-consult-cw<n>。どの id も器の引用の形（<bead id>:<分>-<n>・batch:・policy:・user と時刻）に当たらない（字 : を持たない）。(b) 閉じた語。trait Word（ALL・word・from_word）を形 Form・起こし手 Starter・経路 Via・採否 Verdict・窓の状態 WindowState に持たせる。語は台帳の行と一覧に出す日本語の字で、電文の字は英小文字。候補の採否 Adoption（adopted・rejected）と確かさ Confidence（verified・deduced・inferred・uncertain）と添え物の種類 AttachmentKind（report・program・result）は電文の語だけを持つ。(c) 所見の file の形は JSON。窓が書く草稿 FindingDraft は 12 欄（DRAFT_FIELDS の順に topic・model・bundle_digest・conclusion・options・recommendation・basis・claims・ask_owner・touches・attachments・sandbox_denials）で、所見 Finding はそれに所見の口が埋める id・window・date を足した 15 欄。どちらも知らない鍵を断る（deny_unknown_fields・flatten は deny と組めないので欄を 2 つの struct に書く）。(d) board の口の電文。口の path は PATH（/api/consult）・UNRECEIVED_PATH（/api/consult/unreceived）・REQUEST_PATH（/api/consult/request）。頼み ConsultRequest（topic は省ける・form・model）・未受け ConsultUnreceived（findings と requests の id の列）・席の問う窓の数 SeatQuota（today・live）・一覧 ConsultBoard（windows・findings・requests・quota の 4 つの段がそれぞれ Reading）。 保存の写し先（処分の口の --into に合わせる）。保存する添え物の写し先は、写し先の木の根からの相対の path だけを kept_path（KEPT_DIR の docs/consult/kept と所見の id と添え物の path）で決める。どの木の根に写すかは型に持たせず、後の行 cs-show の処分の口が引数 --into <木の根>（省けば --repo）で受ける（tsuzuri の席は設計の写しの木を渡し、公開の走査は席の commit の門が持つ）。添え物の path は作業場からの相対（行 cs-finding が形を検め、作業場の下に実在するかは所見の口が確かめる）。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done の 1 つ目の項は verify の 1 行目、2 つ目の項は 2 行目、3 つ目から 8 つ目の項は 3 行目（cwty_ の 7 本）、9 つ目の項は 4 行目。 構造の連鎖（main 5b1099ae で grep）。consult の名の module は契約と中核の crate に無い。足すのは lib.rs の pub mod の 1 行ずつ（契約は case の次・中核も case の次）と中核の lib.rs の頭の注の 1 行だけで、ほかの file の字は替えない。契約の lib.rs の id_shape と IdError は使わない（窓と所見の id は数の欄を持つ型にした）。 試作と噛み。写しの main 5b1099ae の上の試作で、契約と中核の crate の clippy（--all-targets --no-deps・-D warnings）が rc 0、歯 cwty_ の 7 本が通る。xtask の check は rc 0（workspace の歯 3,030 本・size は file-lines 1348/1500・core-lines 7145/20000）。噛みは変異 7 つ（頭の 0 を通す・分の字の Z と T を見ない・経路の語 完了 を替える・所見の id の区切りを替える・所見の未知の鍵を通す・草稿の欄の名を替える・保存の dir を替える）で、7 本の歯のどれも少なくとも 1 つの変異で落ちる（対照の撃ちは全部通る・どの変異も rc 100）。歯の名から接頭辞を除いた字は、main の契約表の verify の filter の語 403 のどれも含まない。 流す時と順。depends は空。同じノートの行 cs-finding・cs-lines・cs-argv はこの行の骨の file を書き替えるので、この行の後（波 1）。 範囲の外。所見の欄の検め・台帳の行の字・数え・起動の組みの中身（後の 4 行）。tz consult の命令と hook と server の口と面（後の行 cs-open から cs-pop）。board の一覧の材料の読みと時刻の換え（行 cs-server）。"

