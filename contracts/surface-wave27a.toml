目の項は verify の 3 行目（cwlch_ の 6 本）、最後の項は 4 行目（xtask の check・歯の全部を撃つ）。done の項は歯が測る物だけにした。verify の 1 行目（git apply --reverse --check）は差の file の hunk が全部木に在ることを、2 行目（cargo clippy -p tsuzuri-boundary --all-targets --no-deps -- -D warnings）は clippy の落ちが無いことを、命令の rc で測る守りで、done の項にしない。 構造の連鎖。launch.rs は行 cs-open が骨で置き、中身はこの行だけが書く。使うのは中核の launch（ASK_DROP・Launch・PROGRAM・TALK_ENV・VERSION_ENV・argv・audit・env・private_tmp・read_roots・version_ok）と lines（By・Event・Line・WORD_MAX・cited・free・notice）と quota（admit・count）、境界の server の ledger（KILL・capture・stop_with）と行 cs-open の consult の共通の手（どれも今の pub の名・替えない）。material と TMUX と WINDOW_FORMAT と ASK_LIMIT は pub（行 cs-close が TMUX を使う）。 本物の tmux と claude を撃たない歯。偽の tmux（受けた argv を記録し、display-message に session の名 seat-s を、new-window に @7 と 4242 を答える）と偽の claude（argv と環境と pid を記録し、印の file が在れば findings/cw1-1.json を置く）を PATH の頭に置いて撃つ。tz に渡す環境の TMUX と TMUX_PANE は偽の字で、動いている tmux の server に触れない。囲いの実の効き（作業場の外と repo へ書けない）は撃たない（着地の後に席の手で問う窓と話す窓の両方で確かめる）。 試作と噛み。今の main 19407588 に行 cs-types から cs-launch までの差を契約表の順に当てた木 5e7ab292（写し drafts/w93a）で境界の crate の clippy（--all-targets --no-deps・-D warnings）が rc 0、歯 cwlch_ の 6 本が通る。xtask の check は 11 行（cs-types から cs-close）の差を全部当てた最後の木 a34e433d で 1 回だけ撃って rc 0（workspace の歯 3,104 本・size は file-lines 1348/1500・core-lines 8355/20000・test-src-ratio 7069/82451）で、行ごとの木では撃っていない。差の file を切った試作の commit は係 w85a の写しの 3f9aa735 で、次の噛みもその木で撃った（差の file は 1 字も替わらない）。噛みは変異 6 つ（話す窓の -d を落とす・問う窓に TMUX を残す・検めの欠けでも起こす・R-38 を数えない・--dry-run でも起こす・temp の mode を緩く見る）で、6 本の歯のどれも少なくとも 1 つで落ちる（どの変異も rc 100・対照は全部通る）。 流す時と順。depends は cs-open（共通の手と骨）と cs-quota（admit と count）。同じ波の行 cs-answer・cs-watch・cs-show と書く file が重ならない。depends の確かめ（係 w93a）は、main 19407588 に depends を辿った行 cs-types・cs-lines・cs-argv・cs-quota・cs-open の差とこの行の差だけを当てた木 ef2eefeb で、境界の crate の clippy と歯 cwlch_ の 6 本が通る。 範囲の外。plugin の tzw が TZ_PLUGIN_VERSION と TZ_WRAPPER を置くこと（行 cs-plugin）。窓を閉じる口と私用の temp を消すこと（行 cs-close）。見張りの止まった窓と閉じられた話す窓の拾い（行 cs-watch）。"

