。指さなくなった字だけを、その crate の tests/ の直下と群の dir の直下で同じ名の 1 つの file へ書き換える。この行で動かす file を名指す字はどの crate の file の中でも直し、前の行で動いた file を名指す古い字も直し、ほかの crate の動いていない file を名指す字には触れない。許し（w/refallow.tsv）は、退役した歯の名を無いと見る歯の字 11（面の bvcull.rs・bvgdom.rs・bvmtbl.rs・bvshed.rs の 9 つと xtask の retire.rs の 2 つ・main e16524a9 から指さない）と、folio の設計の字の写し crates/folio/tests/floor_cases.rs の 2 つ（tests の schema.rs と src/floor_adr.rs）。照らしの script w/refcheck.py（同じ読み）は、この行の木で許しの外の指さない字が 0（rc 0）。 この行が書き換える字: 中核の file の中で中核の file を名指す字 50（path の字と注）。境界の file の中で中核の file を名指す 4 つ（fdlv.rs の注の 中核の tests/fdlv.rs を tests/teeth1/fdlv.rs へ・g3g7w.rs の ../tsuzuri-core/tests/g3g7.rs を teeth1 へ・gextw.rs の注の tsuzuri-core の tests/gext.rs を teeth1 へ・pmisroute.rs の注の 中核の tests/pmisfit.rs を teeth2 へ）と、面の file の 2 つ（lresumepill.rs の ../tsuzuri-core/tests/lresume.rs と sgrace.rs の ../tsuzuri-core/tests/sgrace.rs を teeth2 へ）。着地した行 t-fold-contract が移した共通の手を名指す古い字 10（契約の src/lib.rs の注と、群 teeth1 の cform_ の 7 つと cfsplit.rs の 2 つの tests/common/mod.rs を tests/teeth1/common/mod.rs へ）も、この行で直す（main 0f46006c の木で許しの外の指さない字はこの 10 だけ）。中核の fdlt.rs と fdlv.rs の 3 行目の注の 境界の tests/fdlt.rs と 境界の tests/fdlv.rs は境界の file を名指すので、この行では触れない（行 t-fold-boundary が teeth2 へ書き換える）。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 構造の連鎖。移す file を名指す path の字はほかの crate の歯にも在り、差はその file も書く（write-set の ~ と + の対のほかの項目）。群の main.rs は畳みの行だけが書く。まだ着地していない行（ノート surface-wave27a の cs-types・cs-finding・cs-lines・cs-argv・cs-quota と、着地の印を持たない古い行）の write-set と verify が名指す歯の file は、どれも今の木に無い新しい file で、この差は動かさない（係 w89a の照らし）。 試作と噛み。試作の木（commit 2782ad46）で、差の当たり（前の commit の木で git apply --check・行の木で --reverse --check）が rc 0、verify の行のうち xtask の check を除く 4 行が全部 rc 0（kfold_ 2 本・clippy・群 teeth1 の歯 170 本・teeth2 の歯 154 本）。照らし w/refcheck.py は rc 0（字 308・許しの外の指さない字 0・許した字 13）。 4 行を全部当てた木（commit 638161ec）で cargo run -q -p xtask -- check を 1 回撃って rc 0（184 秒・歯 3,036 本が全部緑・clippy の段 cargo clippy --workspace --all-targets -- -D warnings と面の wasm の clippy が rc 0・size は file-lines 1348/1500・入れ子の段は字 nested workspaces=0）。途中の木では xtask の check を撃っていない。歯の fn の名は main 0f46006c と同じ（契約 43・core 324・境界 587・面 847・folio 946・xtask 34・消えた名も増えた名も無い）。 照らしの噛み: 境界の fdlv.rs の注を中核の古い在りか 中核の tests/fdlv.rs へ戻すと w/refcheck.py が rc 1、書き戻すと rc 0。 前の試作の木（commit 5cad5dad・ほかの crate を名指す字の直しの前・噛んだ歯と変異の所の字は同じ）での噛みは変異 3（どれも rc 100）: 群 teeth2 の main.rs から行 mod pci; を消す・表 GROUPS の core の群 teeth1 の module の数を 29 から 30 へ（この 2 つで kfold_groups_declare_every_module_once が落ちる）・群 teeth2 の歯の名を群 teeth1 の歯の名と同じにする（kfold_test_names_unique_in_each_crate が落ちる）。 範囲の外。新しい行の歯の置き方（段）と畳みの行の置き方は起草の守りと席の手が持つ。klintf と klint の根の重複の退役・自分の名の照らしの寄せは別の行。着地した行の verify の字（--test の旧い名）と差の file は歴史として残し書き換えない（判断の記録 ADR-32 の決定 (9)）。"

