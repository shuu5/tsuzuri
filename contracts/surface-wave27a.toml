題の欄に開いた問いの id をそのまま書く（置き替えない）。(c) home_of（台帳の LedgerItem の列・題・足す字）。根 root_of は種類 epic・親が無い・closed でない bead の id の自然な順で最初（境界の server/policy.rs の root_epic と同じ決まりを中核に置く）。題が台帳の bead なら、その bead から親を上へたどり（題が memo ならその memo）最も近い label intake:memo の bead に置く。たどりは台帳の bead の数を越えたら止める。memo の notes の byte と足す字の byte と 1（改行）の和が NOTES_MAX の 8192 を越えれば根に置き、足す字は Home::line で末に ・memo = <memo の id>（notes が満ちた）を足した字。根の notes の長さは見ない（器の席の答え Q-V3・notes の上限は器の rules 行 memo.notes_max_bytes の memo だけで、epic と契約には無い）。断りは根の epic が無い時の HomeError::NoRoot だけ。(d) unreceived（行の列・作業場に在る所見の id の列）は ConsultUnreceived を返す。(e) notice（事象・tz の解き方の命令の字）は次の固定の 1 行の段の字を返す。 固定の 1 行の段（tz の解き方の命令の字が /x/tzw の時）。 相談: 窓 cw3 の所見 cw3-1 が届いた（/x/tzw consult show cw3-1 --via 見張り）・「/x/tzw consult watch」を背景で置き直す 相談: 窓 cw4 の所見 cw4-2 が届いた（/x/tzw consult show cw4-2 --via 完了） 相談: 頼み rq-20261003T1412Z-1 が届いた（/x/tzw consult open --request rq-20261003T1412Z-1 --by button）・「/x/tzw consult watch」を背景で置き直す 相談: 問う窓 cw4 が所見なしで止まった（/x/tzw consult launch cw4 --again）・「/x/tzw consult watch」を背景で置き直す 相談: 話す窓 cw3 が閉じられた（/x/tzw consult close cw3 --by chat）・「/x/tzw consult watch」を背景で置き直す 相談: 見張りが上限で終わった・「/x/tzw consult watch」を背景で置き直す 器の席の答え。Q-V2: 器の入力の時の hook が席の文脈へ器が記録した発話の時刻の 1 行（scribe2 utterance と ts）を出すので、持ち主のチャットで開く窓の開きの行の 発話 = はその時刻を分の字にして書く（逐語は器の utterance show の口で引ける）。Q-V3: notes の上限は memo だけなので、memo が満ちる行は根に置く形のまま（根では断らない）。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done の 1 つ目の項は verify の 1 行目、2 つ目の項は 2 行目、3 つ目から 11 番目の項は 3 行目（cwlin_ の 9 本）、最後の項は 4 行目。 構造の連鎖。lines.rs は行 cs-types が骨で置き、中身はこの行だけが書く。使うのは契約の consult の id と語と minute_ok・graph の natural_cmp・ledger の BeadId と LedgerItem（is_memo）と、中核の delivery の MARK_PREFIX と graph::build の TYPED_LINES（どれも今の pub の名・替えない）。lines の名を呼ぶ所は今の木に無く、後の行 cs-quota（Line と By）・cs-open・cs-watch・cs-show・cs-close・cs-server・cs-hooks が呼ぶ。 試作と噛み。試作の木で中核の crate の clippy（--all-targets --no-deps・-D warnings）が rc 0、歯 cwlin_ の 9 本が通る。xtask の check は積み直