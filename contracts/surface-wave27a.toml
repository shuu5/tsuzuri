goal = "在りか。差の file docs/design/patch/cs-open.patch は、行 cs-types から cs-quota の試作を積んだ木（係 w83a の写しの 60d2c916・その差の file は main の 27a の 5 つ）に試作の commit c57c60ff（写し drafts/w85a・branch main）を載せて切った（15 file・64,487 byte・+1536 −1）。境界の crate に module consult（口の振り分けと共通の手）と口 open・bundle の中身と、残りの 8 つの口（launch・answer・guard・watch・show・dispose・list・close）の骨を置き、tz の振り分けに arm 2 つ（consult と --version）を足し、契約の consult に窓の控えと process の印の型を足す。 なぜ。判断の記録 ADR-29 決定 (2) は相談の窓の本体を tz consult の命令にし、project ごとの値を project の宣言から読み、host ごとに分岐しないと決め、決定 (5) は窓ごとの作業場を席の起草の置き場の下の窓の名の dir にした。決定 (1) のイは束を機械が組む字を残し、話題ごとに窓の中からも組めるとした。後の 5 行（起こす口・所見の口・見張り・読む口と処分・一覧と閉じ）が同じ置き場の解き方と作業場の読み書きと相談の行の書きを使うので、この行が先に共通の手と口の骨を置き、後の行は自分の口の file だけを書く（並べて流せる）。 起草の置き場の引き方（器の席の答え Q-V1）。器に起草の置き場を引く口は無いので、project の git config の鍵 tsuzuri.draftsdir で引く（鍵の名は acct の GIT_ARGS の scribe2.statedir と BOARD_ARGS の tsuzuri.boardport の前例の形・DRAFTS_ARGS）。state dir は同じ acct の GIT_ARGS で引く。どちらかの鍵が無いか起草の置き場が dir でなければ rc 2（まだ分からない）。計画の state dir の seat の下の _orchestrator で終わる dir を探す読みは使わない。 形（要約・字は差の file）。(a) 口の振り分け run と共通の終了 code（FAIL 1・UNKNOWN 2）と断りの型 Refused（rc と理由）と refuse（口の名を付けて標準エラーに 1 行）。(b) flags は --名 値 と --名=値 の旗（何度でも受ける旗の列を別に取る）と値を取らない旗と位置の引数を読み、知らない旗・空の値・2 度の旗を rc 1 で断る。共通の旗 COMMON は --repo・--bd・--bdw。(c) ctx は repo（--repo か cwd の git の根）と state dir と起草の置き場と bd・bdw の program を解く。(d) 作業場の読み書き。workspace と retired（consult-cw<n> と retired-consult-cw<n>）・windows・read_window と write_window（.consult/window.json）・findings（findings/<所見 id>.json の名）・procs と proc_path（.consult/proc-<k>.json）・alive（/proc/<pid> の在る無し）・live（最後の印の pid）。(e) 台帳。ledger は bd の字と bead の列（読めなければ rc 2）、lines_of は全部の notes の相談の行、append は中核の render と home_of で行の字と置き場を決めて bdw の AppendNotes を撃つ（行の字が書けなければ rc 1・置き場が無いか書きが落ちれば rc 2）。(f) minute_now・tz_path（tz 自身の binary の path）・tzw（席への 1 行の命令の頭・環境の TZ_WRAPPER か tz 自身の path・行 cs-plugin の tzw が自分の path を置く）。(g) open は版（環境の TZ_PLUGIN_VERSION と中核の PLUGIN_VERSION）を照らし、起こし手と添えの組み（chat は --said の分の字・button は --request）と形（talk・ask）と経路（見張り・hook・一覧・既定 見張り）を読み、台帳を読み、頼みなら頼みの行の形と model と題を使い受けの行を書いてから、作業場を create_dir で原子に作り（n は在る窓と退いた窓の最大 + 1・在れば次）、git init と 5 つの dir と窓の控えと notes.md と束を置く。既定の model は fable・念入りさは xhigh（制約 CON6）。開きの行は書かない（行 cs-launch）。(h) bundle は窓の控えの在る作業場に brief.md（中核の brief）・ledger.json（席が撃つ時だけ bd の字）・reads.md（読む根と台帳の写しの行・席が撃つ時だけ）・question.md（--question の file の字か、題を渡すか question.md が無い時に題と台帳の写しの bead の題名と本文）・digest（4 つの file の名と字の FNV-1a 64）を書く。窓の中（環境の TZ_CONSULT_ID が窓の id）では cwd を作業場とし、bd を撃たない。(i) 契約の WindowFile（id・形・題・model・念入りさ・起こし手・発話・頼み・用意した分）と ProcMark（k・形・pid・分・撃ち直し・tmux の window id）は未知の鍵を断る JSON。(j) 残りの 8 つの口の file は頭の注と、標準エラーに字 まだ無い と行の id を書いて rc 1 を返す run だけ（後の行が中身に替える・この行の歯は骨の振る舞いを測らない）。(k) tz --version は tz と workspace の版と consult と PLUGIN_VERSION の 1 行。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done の 1 つ目から 7 つ目の項は verify の 3 行目（cwopn_ の 7 本）、最後の項は 4 行目（xtask の check・歯の全部を撃つ）。done の項は歯が測る物だけにした。verify の 1 行目（git apply --reverse --check）は差の file の hunk が全部木に在ることを、2 行目（cargo clippy -p tsuzuri-contract -p tsuzuri-boundary --all-targets --no-deps -- -D warnings）は clippy の落ちが無いことを、命令の rc で測る守りで、done の項にしない。 構造の連鎖（60d2c916 で grep・今の main 19407588 でも同じ）。境界の crate に consult の名の module は無い。足すのは lib.rs の pub mod consult の 1 行と頭の注の 1 行、main.rs の振り分けの arm 2 つと fn version と頭の注の 2 行と use の 1 語（emit）、契約の consult.rs の末の 2 つの型だけで、ほかの file の字は替えない。使う今の pub の名は、境界の acct の GIT と GIT_ARGS、out の emit と emit_err、server の events の now、ledger の BD・Source・capture・parse_bd、ruling の WRITE_TIMEOUT と minute、中核の consult の lines（Line・Subject・home_of・render・scan）と launch（ID_ENV・PLUGIN_VERSION・VERSION_ENV・brief・read_roots・version_ok）、契約の board の Reading と consult（FindingId・Form・RequestId・Starter・Via・WindowId・Word・minute_ok）と ledger（BDW・BeadId・LedgerItem・LedgerWrite・fnv1a64）と wire。 試作と噛み。今の main 19407588 に行 cs-types から cs-open までの差を契約表の順に当てた木 a1006d50（写し drafts/w93a）で契約と境界の crate の clippy（--all-targets --no-deps・-D warnings）が rc 0、歯 cwopn_ の 7 本が通る。xtask の check は 11 行（cs-types から cs-close）の差を全部当てた最後の木 a34e433d で 1 回だけ撃って rc 0（workspace の歯 3,104 本・size は file-lines 1348/1500・core-lines 8355/20000・test-src-ratio 7069/82451）で、行ごとの木では撃っていない。差の file を切った試作の commit は係 w85a の写しの c57c60ff で、次の噛みもその木で撃った（差の file は 1 字も替わらない）。噛みは変異 7 つ（置き場の鍵の名を替える・退いた窓を番号に数えない・版を照らさない・要約値の順を替える・窓の中でも台帳を読む・受けの既定の経路を替える・最初の印で生きているかを見る）で、7 本の歯のどれも少なくとも 1 つの変異で落ちる（どの変異も rc 100・対照は全部通る）。歯の名から接頭辞を除いた字は、今の main 19407588 の契約表の verify の filter の語 414 のどれも含まず、6 行の接頭辞はその語とも群の module の名 372（stem と字 ::）とも部分の字で重ならない。 流す時と順。depends は cs-lines（Line と home_of）と cs-argv（brief と version_ok）。cs-types と cs-finding と cs-quota はその前に在る。後の行 cs-launch・cs-answer・cs-watch・cs-show はこの行の後に並べて流せる（書く file が重ならない）。depends の確かめ（係 w93a）は、main 19407588 に depends を辿った行 cs-types・cs-lines・cs-argv の差とこの行の差だけを当てた木 e2eac098 で、契約と境界の crate の clippy と歯 cwopn_ の 7 本が通る（cs-finding と cs-quota が無くても組める）。 範囲の外。起こす口（cs-launch）・所見の口と守り（cs-answer）・見張り（cs-watch）・読む口と処分（cs-show）・一覧と閉じ（cs-close）の中身。plugin の tz の解き方 tzw と環境の TZ_PLUGIN_VERSION と TZ_WRAPPER を置くこと（行 cs-plugin）。repo の git config に鍵 tsuzuri.draftsdir を書くこと（着地の後に席が tsuzuri の repo に置き、ほかの project は使い始める時に置く）。"

