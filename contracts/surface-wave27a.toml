goal = "在りか。差の file docs/design/patch/v-lane-cap.patch は、行 v-lane の試作の先端 11bd143a（main 882e0298 に v-lane の差を載せた木）と、その上に試作を載せた木 9832a8f3（写し drafts/w116a の branch r-cap3）との差（54,158 byte・8 file・+296 −39）。v-lane の差の上にだけ当たる（main だけの木には lane.rs が無いので当たらない）。第 0.23 版で、行 v-lane の差の直し（番号の予約・返しの印の照らし・land.rs の move_tree）の上で切り直した（上限の掃除の振る舞いと歯の断言は替えない）。上限は持ち主の答え（問い t3-hub.77.15 の案 A・2026-10-03T22:11Z）で 40 GiB（rules の行の値 40960）。 なぜ。判断の記録 ADR-35 の決定 (5)。並びの木は 1 本 5.2〜6.1 GB で、便が無い時も disk に残る。同時の便の数だけ並びが増えるので、合計の上限で切る。 形。 - rules: 新しい kind PipeLanesCapMb（Int・許可の読み手を持たない）を enum と ALL の末に足し、埋め込みの manifest の末（行 index.timeout_s の後・口座の注の前）に行 pipe.lanes_cap_mb（値 40960・enabled・ruling は字 user 2026-10-03T22:11Z 問い t3-hub.77.15・ruled_at は 2026-10-03）と 2 行の注を足す。関数 shape の行数が上限 60 ちょうどなので、kind は既存の行（LedgerTimeoutS の行）に並べて足し、行を増やさない。 - pipe/sweep.rs: rules 行の id の定数 ROW_LANES_CAP。sweep の lock の中で、便の木の掃き（sweep_runs）の後・起草の木の掃きの前に新しい関数 sweep_lanes を撃つ。sweep_lanes は行を整数で読めない周と置き場の replay を読めない周は 0 を返して何もしない。読めれば置き場の便の repo（repo_of_run）の集合ごとに lane::shed を上限（MiB × 1048576 byte）と便の live の読み（replay の段から live で読む・測れない便は None）で撃つ。退かせられなかった並びは失敗の名（字 lane/<n>）に足す。stderr の行は退かせた数が 1 以上の周だけ、失敗の名の後に空白と字 lanes= と数を足す。関数 measure を pub(super) にする（lane.rs が並びの大きさを測る）。 - pipe/lane.rs: 関数 shed（並びの番号を v-lane の numbers で集め、大きさは lock の外で measure で測り、v-lane の lock〔lane.lock〕の中で各並びの印を読み、印の便が並びを持たないか持つ便が live でない並びを候補にし、印の mtime の古い順〔同じ時刻は番号の順〕に、合計が上限以下になるまで evict する）・idle_of（候補の判じ・印の便は mark_of で読む）・evict（返された並びは land.rs の move_tree で retired/<印の便> へ、便が持つ並びは symlink を外してから便の元の path へ move_tree で移し、移せない周は symlink を戻す・移せた周は印を外す）・resting_place（退役の後に便の木が在る path）・held_lane（便が持つ並びの木・retire.rs が読む）・構造体 Idle。lock の取りと番号の集めと move は v-lane の関数を使い、新しく作らない。大きさを測れない並びは合計に数えず退かせず、候補なら失敗に数える。印を読めない並びは退かせない。 - pipe/retire.rs: fold と fold_after_close が退役の前に held_lane を読み、stdout の字 retired= を resting_place で書く（並びへ返した便は並びの木・ほかは今のまま retired/<run>）。 - 着地済みの歯の直し: kind と行を ALL と manifest の末に 1 つ足したので、末尾から数える窓の歯を 1 つずつ後ろへずらす。scribe2-boundary の e2e の rules.rs の 5 つの歯（rules_floor_timeout_row_precedes_the_drafts_cap_rows・rules_drafts_cap_rows_are_the_last_two_kinds_and_rows・rules_index_rows_are_the_last_two_kinds_and_rows・rules_lifecycle_rows_carry_the_ruled_values_and_the_lifecycle_ruling・class_derive_embedded_row_carries_the_ruled_three_elements_and_ruling_id）の末尾から数える窓の skip の数を 1 つ増やし（索引の歯は take だけの窓に skip 1 を足す・歯の名は替えず断言と注の字を「末尾の 1 つの前の 2 つ」にする）、続く並びを書く注 3 か所に並びの上限の 1 kind・1 行を足す。rules/embedded.rs の 4 つの歯（rules_embedded_manifest_declares_host_guard_kinds_at_the_tail_of_all の ALL の末までの列の末に PipeLanesCapMb と窓の skip・rules_embedded_manifest_is_valid_and_covers_all_kinds の行数 109 を 110・rules_embedded_manifest_declares_one_capability_row_per_role の kind の数 95 を 96・rules_memo_rows_are_the_last_three_kinds_and_rows の窓の skip）。外の形の snapshot の字 rows=109 kinds=95 の 2 か所を rows=110 kinds=96 にする。 - 歯の module: v-lane の歯の助けに、上限の行 1 本の rules の写し（cap_rules）・並びの target に 1 MiB を書き印の新しさを紀元からの秒にする fill・置き場に便を段ごとに積む state_with と定数 BLOB を足し、歯 vlcap_ の 4 本を足す（便の並びは v-lane の held で読む・返しは便の id だけを渡す）。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done の 1〜4 番目の項は verify の 3 行目（器の lib の歯 vlcap_ の 4 本）、最後の 5 番目の項は 4 行目（xtask の check・入れ子の段で器の歯の全部と clippy を撃つ）で測る。verify の 1 行目（差の hunk が全部木に在る）と 2 行目（器の clippy）は命令の rc で測る守りで、done の項にしない。 構造の連鎖（木 11bd143a で grep）。sweep の呼び手は pipe/cli.rs の運転手の終端の 1 か所で、引数は替えない。retire_worktree の呼び手は retire.rs の 2 か所と land/finish.rs の 1 か所で、land の stdout は退役の path を書かないので替えない。kind の match は wildcard を書かない形（as_str・shape・has_permit_reader）で、足し忘れは compile が落とす。PipeReserveH と SeatDraftsBusyS を名指す e2e の pipe/stop.rs と pipe/dispatch/waiting.rs は位置でなく名で読むので替えない。shed と evict は v-lane の lock の中で印と symlink を外すので、v-lane の取りの予約と返しと同じ lock で並ぶ。 器の提案中の判断の記録（判断の記録 ADR-33 の決定 (8)）。sweep.rs が引く ADR-0081 と ADR-0101 は 17 本に無い。掃除の lock・候補の古い順・測れない時は消さない形は ADR-0101 の量の線と同じ形をなぞる。 入口の赤。v-lane の試作の木 45cea9ed（先端 11bd143a と take の注 2 行だけが違う）に、歯の module（vlcap_ の 4 本と助けの関数）と kind PipeLanesCapMb（rules/mod.rs の enum と ALL と 3 つの match）だけを置いた木 8298077d（写しの branch r-cap2-red）で、verify の 3 行目は rc 100（4 本とも振る舞いの断言で落ちる・上限を越えても退かせず、retired= は retired/<便の id> を名指す）。歯が名指す新しい関数は無い（歯は sweep・take・give_back・retire を呼ぶ）ので、関数の頭は置かない（裁定 t3-hub.74.52:20261003T2211Z-1・案 A）。 試作と噛み。写し drafts/w116a で書く file は write-set の中で閉じる（8 file）。verify の 2 行目と 3 行目は rc 0（歯 vlcap_sheds_least_recent_idle_lanes・vlcap_moves_lanes_to_where_the_run_would_be・vlcap_keeps_lanes_without_the_rule・vlcap_retire_names_the_lane_tree の 4 本と、行 v-lane の歯 vlane_ の 7 本も緑）。入れ子の 4 段（build --workspace・nextest run --workspace --no-fail-fast・clippy --workspace --all-targets と -D warnings・器の xtask check）は、xtask と同じ引数と置き場（target/nested/scribe2）と cwd（scribe2/）で撃って 4 段とも rc 0（器の歯 4,019 本が全部緑・器の xtask check は ok の 1 行で file-lines=1498/1500・core-lines=82558/90000）。4 段は木 e2e97ad3 で撃ち、先端 9832a8f3 は v-lane の take の注 2 行だけが違う（先端で verify の 2 行目と 3 行目と歯 vlane_ を撃ち直して rc 0）。根の段（pub-scan・size・根の build と歯と clippy・面の組み立て）は係の SSD の上限で撃っていない（この行は scribe2/ の外を書かず、根の段の木は行 v-lane の木と同じ）。句ごとの噛みは 9 つで、変異を環境の印で切り替える 1 つの木に当てて 1 度だけ組み、どれも名指しの歯が rc 100、どの変異も効かない対照は rc 0（上限を見ずに全部退かせる・印の新しい順に退かせる・live な便が持つ並びも退かせる・上限を byte で読む・stderr に lanes= を出さない→vlcap_sheds_least_recent_idle_lanes、便が持つ並びも retired へ移す・印を外さない→vlcap_moves_lanes_to_where_the_run_would_be、行を読めない周を上限 0 に倒す→vlcap_keeps_lanes_without_the_rule、retired= に退役の path を書く→vlcap_retire_names_the_lane_tree）。fold_after_close（PR で着地した便の close の後の畳み）の字の直しは同じ resting_place を使うが、forge と台帳を要るので歯は測らない。 流す時と順。depends は v-lane。scribe2/ を書く便は同時に 1 本まで（判断の記録 ADR-33 の決定 (12)）。この行の着地と器の binary の入れ替えの後に、席が tsuzuri の宣言に build-lanes = true を足す行を置く。 範囲の外。並びの取りと替えと返し（行 v-lane）。列の候補の木を並びに載せること（器の ADR-0039 を受け直す要がある）。上限の線の記録を doctor に出すこと（起草の置き場の量の線の DraftsCap の形・要るなら別の行）。"
