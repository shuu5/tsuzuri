goal = "在りか。差の file docs/design/patch/cs-show.patch は、行 cs-open の試作 c57c60ff の木に行 cs-launch・cs-answer・cs-watch の試作を載せた木に試作の commit 4eae5b24（写し drafts/w85a・書く file は重ならず cs-open の木でも当たる）を載せて切った（3 file・34,519 byte・+819 −14・第 0.15 版で歯の file だけを直し、main 145db064 に着地していない前の行の差を 11 行の順に当てた木の上で切り直した）。行 cs-open が骨で置いた境界の show.rs と dispose.rs を中身に替え、歯の file を足す。 なぜ。判断の記録 ADR-29 決定 (8) は、席が所見を読む口で読み、読んだ口が経路の語つきの相談の所見と相談の受けの行を台帳に置くと決めた。決定 (9) と ADR-10 決定 (5) は、処分を所見ごとに採る・一部採る・採らない と理由に、添え物ごとの保存する・しないを足して宣言し、保存すると決めた添え物は席が repo の決まった置き場へ写して commit すると決めた。決定 (5) は所見が全部処分された後に作業場を退きの置き場へ移す（消さない）と決めた。決定 (4) は所見から先の行を話題の bead から上へたどった memo か根に置くと決めた。受入 AC16 は台帳の 2 行が 1 度だけ置かれることを見る。 形（要約・字は差の file）。(a) show は位置の引数 1 つ（所見の id か頼みの id）と --via（見張り・完了・hook・一覧）を受ける。所見は作業場か退いた作業場の findings/<所見 id>.json を契約の Finding に読み、台帳に同じ id の相談の所見の行が無ければ行（題と所見の時刻）を、相談の受けの行が無ければ行（経路と今の分）を、所見の題の置き場（home_of）に足す。題は字 なし と空と器の引用の形を含む字なら題なし。出力は render の行の列（所見の頭の行・結論・推奨・候補・主張・根拠・持ち主に問う・触る節点・束の要約値・囲いの断り・添え物の種類と作業場の絶対 path と注）。頼みは台帳の頼みの行の題・形・model・時刻の行と、開く命令（tzw consult open --request <id> --by button）の行を出し、台帳を書かない（受けの行は open --request が書く）。(b) dispose は位置の引数 1 つ（所見の id）と --verdict（採る・一部採る・採らない）と --reason と何度でも受ける --keep と --drop と --into（写し先の木の根・省けば repo）を受ける。順は、添え物の選び（添え物の全部がちょうど 1 度ずつ keep か drop・所見に無い path を断る）、台帳を読み受けの行の無い所見と処分の行の在る所見を断り、処分の行の字を render で確かめ（整えて空の理由・区切りの字を持つ path を断る）、写し先 kept_path が 1 つでも在ればどれも写さずに断り、保存の添え物を写し、処分の行を所見の題の置き場に足す。標準出力は 処分を記した と写した path（木の根からの相対）の列。(c) retire は、作業場が在り、窓に閉じの行が在り、作業場の所見の全部に処分の行が在れば、作業場を retired-consult-cw<n> へ rename する（在れば断る・消さない）。dispose は自分の処分の行を足した行の列で retire を撃ち、退かせれば 退いた と path の行を足す（行 cs-close の close も同じ retire を撃つ）。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done の 1 つ目から 5 つ目の項は verify の 3 行目（cwshw_ の 5 本）、最後の項は 4 行目（xtask の check・歯の全部を撃つ）。done の項は歯が測る物だけにした。verify の 1 行目（git apply --reverse --check）は差の file の hunk が全部木に在ることを、2 行目（cargo clippy -p tsuzuri-boundary --all-targets --no-deps -- -D warnings）は clippy の落ちが無いことを、命令の rc で測る守りで、done の項にしない。 構造の連鎖。show.rs と dispose.rs は行 cs-open が骨で置き、中身はこの行だけが書く。使うのは中核の lines（Line・Subject・WORD_MAX・cited・free・render）、契約の consult（Finding・FindingId・RequestId・Verdict・Via・WindowId・Word・kept_path）と wire、行 cs-open の共通の手。show の finding_path・read_finding・topic_of・render と dispose の retire は pub（行 cs-close と後の server の行が使う）。 試作と噛み。今の main 19407588 に行 cs-types から cs-show までの差を契約表の順に当てた木 172a1594（写し drafts/w93a）で境界の crate の clippy（--all-targets --no-deps・-D warnings）が rc 0、歯 cwshw_ の 5 本が通る。xtask の check は 11 行（cs-types から cs-close）の差を全部当てた最後の木 a34e433d で 1 回だけ撃って rc 0（workspace の歯 3,104 本・size は file-lines 1348/1500・core-lines 8355/20000・test-src-ratio 7069/82451）で、行ごとの木では撃っていない。差の file を切った試作の commit は係 w85a の写しの 4eae5b24 で、次の噛みもその木で撃った（差の file は 1 字も替わらない）。噛みは変異 5 つ（受けの行を何度も書く・結論の字を替える・保存の写しを空にする・重なりを通す・処分の無い所見が在っても退かせる）で、5 本の歯のどれも少なくとも 1 つで落ちる（どの変異も rc 100・対照は全部通る）。歯は所見を fixture complete.json の草稿に id と時刻 20261003T1500Z を足した JSON で直に置き、偽の bdw が受けた行を台帳の写しに積み直して撃つ。 句の型の照らし（第 0.15 版・便 t3-hub.75.5 の 2 度目の審査の vacuous-assert に答える・係 w93a）。done の句を型（順・1 度だけと重ねない・縁と既定と空・だけ）に分け、句を崩す変異（順を替える・重ねる・縁を 1 ずらす・既定に倒す・だけの絞りを外す）を 35 撃ち、直した歯で 35 が名指しの歯で落ちた（rc 100・対照は全部通る）。前の歯では落ちない見立て（src と歯を読んだ見立て・前の歯では撃っていない）の変異が 5 で、その句の見本を足して直した（ほかの所見の行だけの台帳での最初の show・処分の時刻を撃つ前と後の分で挟む・ほかの所見の受けの行だけの台帳での断り・在る file の --into・3 つの所見の最後を処分した時の退かせ）。歯の fn の数と名は替えない。src は替えない。xtask の check は main 145db064 に着地していない行の差を 11 行の順に当てた木 2b4b6fe6 で rc 0（workspace の歯 3,121 本・size は file-lines 1348/1500・core-lines 8367/20000・test-src-ratio 7069/82743）。 流す時と順。depends は cs-open（共通の手と骨）と cs-finding（歯が check と fixture を使う）。同じ波の行 cs-launch・cs-answer・cs-watch と書く file が重ならない。depends の確かめ（係 w93a）は、main 19407588 に depends を辿った行 cs-types・cs-finding・cs-lines・cs-argv・cs-open の差とこの行の差だけを当てた木 da2d2aea で、境界の crate の clippy と歯 cwshw_ の 5 本が通る。後の行 cs-close が retire を使う。 範囲の外。保存した写しの commit（席の設計の commit・docs/consult/kept/ は design-doc-paths の docs/consult/ の下）。窓の閉じ（行 cs-close）。board の一覧の処分の無い所見（行 cs-close の list と後の server の行）。"

[[contract]]
