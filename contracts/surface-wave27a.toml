e.rs の一覧の 2 つの file の名に群の dir の字を足す。xtask の kfold.rs の末に fn test_fns・fn rs_under と歯 kfold_test_names_unique_in_each_crate を足す。 lint の期待。共通の手 tests/teeth1/common/mod.rs の 5 行目の #![expect(dead_code, reason = …)] は差で替えない（移すだけ）。群 teeth1 の 1 crate では、cform_ の 6 つとほかの module の use の和が共通の手の 13 の item（const AT・fn bead・fn ruling・struct Samples・trait Form と 3 つの trait の fn・fn form・fn snapshot_text・fn snapshot_matches・fn roundtrip_all・fn distinct）を全部使い、expect の行を消して clippy を撃っても dead_code は 1 つも出ない（rc 0）。それでも期待は満たされ、expect の行を置いたままの clippy も rc 0 になる。期待を満たすのは struct Samples の 2 つの欄 name と values で、どちらも trait Form の impl（同じ期待の下の code）の中だけで読まれる。欄と item ごとに expect を置いて撃つと、欄 name と values の 2 つの期待は満たされ、ほかの 13 の item と impl の 4 つ（impl と 3 つの fn）の期待は満たされないと報される（rustc と clippy 1.98.1・試作の木で撃った）。期待の外の歯から 2 つの欄を読む 1 本を足すと、common/mod.rs の 5 行目に満たされない期待の lint が出て clippy が落ちる（下の噛み）。ほかの移す file の lint の属性は頭の #![cfg(test)] だけ。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 構造の連鎖。移す file を名指す path の字はほかの crate の歯にも在り、差はその file も書く（write-set の ~ と + の対のほかの項目）。群の main.rs は畳みの行だけが書く。まだ着地していない行（ノート surface-wave27a の cs-types・cs-finding・cs-lines・cs-argv・cs-quota と、着地の印を持たない古い行）の write-set と verify が名指す歯の file は、どれも今の木に無い新しい file で、この差は動かさない（係 w89a の照らし）。 試作と噛み。試作の木（commit d3285b98）で、差の当たりが rc 0、verify の行のうち xtask の check を除く 5 行が全部 rc 0（kfold_ 2 本・群 teeth1 の歯 43 本・cfsplit_ 6 本・fxpre_contract_ 1 本・contract_form_ 21 本）。 足した clippy の行（verify の 3 行目）は同じ木で rc 0（移した file を touch してから撃った・群 teeth1 を clippy-driver が組んだことを -v で見た）。 6 行を全部当てた木（commit 5cad5dad）で cargo run -q -p xtask -- check を 1 回撃って rc 0（224 秒・歯 3,036 本が全部緑・clippy の段 cargo clippy --workspace --all-targets -- -D warnings と面の wasm の clippy が rc 0・size は file-lines 1348/1500・入れ子の段は字 nested workspaces=0）。途中の木では xtask の check を撃っていない。歯の fn の名は main e16524a9 と同じ（契約 43・core 324・境界 587・面 847・folio 946・xtask は kfold_ の 2 本が増えて 34・契約の 16 か所の名替えのほか消えた名も増えた名も無い）。噛みの後に書き戻した木の対照の撃ちは全部緑。 噛みは変異 4（どれも rc 100）: cform_board の名 contract_form_board_snapshot_matches を群 stats の名と同じにする（kfold_test_names_unique_in_each_crate が落ちる）・同じ名を元の名へ戻す（1 か所だけでは重ならないので一意の歯は通り、cfsplit_test_names_floor が落ちる）・cfsplit の fn group_dir を tests/ の直下へ戻す（cfsplit_ の 4 本が落ちる）・fxpre の一覧の cform_surface の群の字を外す（fxpre_contract_tests_hold_none が落ちる）。 clippy の行の噛み: 群 teeth1 の cform_board.rs に Samples の欄 name と values を読む歯を 1 本足すと、verify の 3 行目の clippy が common/mod.rs の 5 行目に満たされない期待の lint を出して rc 101 で落ち、書き戻すと rc 0。 範囲の外。新しい行の歯の置き方（段）と畳みの行の置き方は起草の守りと席の手が持つ。klintf と klint の根の重複の退役・自分の名の照らしの寄せは別の行。着地した行の verify の字（--test の旧い名）と差の file は歴史として残し書き換えない（判断の記録 ADR-32 の決定 (9)）。"

