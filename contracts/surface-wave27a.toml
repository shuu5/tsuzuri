[[contract]]
id = "r-dbg"
title = "開発の組み（dev と test の profile）の debuginfo を行の表だけにする（根の Cargo.toml に段 profile.dev と debug の 1 行・器 scribe2 と同じ値・歯 wstrip_release_profile_keys の見出しの一覧と段の断言を合わせる・判断の記録 ADR-31 の決定 (1)）"
req = ["NFR3"]
section = "9"
write-set = ["Cargo.toml", "crates/tsuzuri-surface/tests/wstrip.rs"]
verify = ["git apply --reverse --check docs/design/patch/r-dbg.patch", "cargo clippy -p tsuzuri-surface --all-targets --no-deps -- -D warnings", "cargo nextest run -p tsuzuri-surface --test wstrip --no-tests=fail wstrip_", "cargo run -q -p xtask -- check"]
