goal = "在りか。差の file docs/design/patch/v-gate.patch は main afa65b32 に試作の commit 61fa0932（写し drafts/w84a・branch main）を載せて切った（2 file・21,632 byte・+405 −2）。xtask の src/main.rs に module nested の宣言と fn check の最後の段の呼びを足し、新しい xtask/src/nested.rs に入れ子の workspace の段（見つけ・1 行・段の列・撃ち）と歯 vnest_ の 7 本を置く。 なぜ。判断の記録 ADR-18 は器 scribe2 を folio2 の後に tsuzuri へ持ち込み、元の repo を凍結すると決め（決定 (1)(2)）、ADR-22 の決定 (7) は器の履歴を番号を保つ merge で持ち込む形を予行の 3 つの条件で決めた。器の木は scribe2/ の下に、自分の Cargo.toml（行 [workspace]）と錠と xtask を持つ入れ子の workspace のまま置かれる。根の workspace に入れる後の行までの間、tsuzuri の門（xtask の check・器の common-verify・CI の 8 つの job）は器の code を組まず、器の歯も撃たない。持ち込んだ後に器の code を書く便が器の歯を通らずに着地しないよう、入れ子の間も器の build・歯・clippy・器の xtask の check を tsuzuri の xtask の check の段で撃つ。今の main に入れ子は無いので、段は数えた 0 の 1 行だけを出す。器を持ち込む merge の木で初めて scribe2/ を撃つ。 形（要約・字は差の file）。(a) 見つけ方。根の直下の dir のうち、Cargo.toml の行の前後の空白を除いた字が [workspace] に等しい行を持つ dir を、名の字の順（byte の順）に並べる。下の dir は見ない。節 [workspace.package] だけの manifest と注の行は数えない。(b) 1 行。段の頭に、字 xtask check: と空白に続けて summary の字（0 なら nested workspaces=0・在れば nested workspaces=1 dirs=scribe2 の形）を標準エラーへ出す。(c) 段の列。dir ごとに STEPS の 4 段（cargo build --workspace・cargo nextest run --workspace・cargo clippy --workspace --all-targets -- -D warnings・cargo xtask check）を、その dir を cwd にして順に撃つ。引数は根の段と同じ main.rs の step_args で作るので、環境変数 TSUZURI_CHECK_PARTITION の字が在れば nextest の段にだけ同じ --partition の字が付く（CI の 8 つの job は入れ子の歯も同じ割りで分ける）。cargo xtask check は入れ子の workspace の .cargo/config.toml の alias（器は run -q -p xtask --）で引く。(d) 組み立ての置き場。入れ子の段は環境変数 CARGO_TARGET_DIR を、根の target（その変数の字・相対なら根から・無いか空なら根の下の target）の下の nested と dir の名の path にして撃つ。根と器の xtask は package の名が同じ xtask で、同じ置き場に組むと binary の target/debug/xtask を取り合うため。置き場は根の target の下なので版管理の外のまま。(e) 落ち方。最初に落ちた段の rc を返し、後の段と後の dir を撃たない（根の段と同じ）。入れ子の dir を読めなければ段を撃たずに rc 1。面の組み立てが落ちたら入れ子の段を撃たない。cargo の binary は根の段と同じ環境変数 CARGO の字。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done の 1 つ目の項は verify の 1 行目、2 つ目の項は 2 行目、3 つ目から 9 つ目の項は 3 行目（vnest_ の 7 本）、10 個目の項は 4 行目（ksize_ の 7 本）、最後の項は 5 行目。 構造の連鎖（main afa65b32 で grep）。module の名 nested は xtask に無い。xtask の src/main.rs の fn check を読む着地済みの歯は ksize_check_wiring（size.rs・走査 → 数え → cargo の段の順と数えの後の return 1;）と pubscan_wiring（pubscan.rs・走査が cargo の段より前）で、cishard_ の歯は const PARTITION_ENV と step_args と CHECK_STEPS を読む。この行はそれらの字を替えない（fn check の末で return rc; を 1 行足し、最後の式 rc を nested::run(root, &cargo, part) に替え、doc の注を 2 行足すだけ）。xtask の出力の手は main.rs の emit_err の 1 つ（歯 klint_print_hands が src の print の macro の数を数える）なので、nested は crate::emit_err で書き、print の macro を書かない。step_args は main.rs のまま nested が crate::step_args で引く。xtask/tests の歯は nested.rs を読まない。 試作と噛み。写しの main afa65b32 の上の試作で、xtask の clippy（--all-targets --no-deps・-D warnings）が rc 0、歯 vnest_ の 7 本と xtask の歯の全部（68 本）が通る。xtask の check は rc 0（490 秒・入れ子の段は字 nested workspaces=0 の 1 行だけ・workspace の歯 3,030 本・size は file-lines 1348/1500・core-lines 7129/20000・test-src-ratio 7069/78519）。噛みは変異 10（字 [workspace を含む行を全部数える・字の順を逆にする・入れ子の歯に partition を渡さない・入れ子の clippy から --all-targets を抜く・置き場を dir の名で分けない・0 の時も dirs= を足す・環境変数の置き場を読まない・cargo を起動できない時に 0 を返す・面の組み立てが落ちても入れ子を撃つ・歯の名に filter の語 gate_ を入れる）で、7 本の歯のどれも少なくとも 1 つの変異で落ちる（対照の撃ちは全部通る・どの変異も rc 100）。歯の名から接頭辞を除いた字は下の filter の語 409 のどれも含まない。 merge の木の確かめ。器を持ち込む予行の merge の木（tsuzuri main 5b1099ae に器 main 38cbb667 を番号を保つ merge で scribe2/ に置いた木 6524ab4d・起草 w81a の写し）にこの差を当てた枝で xtask の check を 2 回撃った。割り count:3/8（入れ子で落ちる器の歯 4 本を含まない割り）は rc 0（99 秒）で、段は字 nested workspaces=1 dirs=scribe2 の 1 行を出し、scribe2/ で build・歯 495 本（ほかの割りの 3,457 本は撃たない）・clippy・器の xtask の check を撃って全部通った（段の 57 秒）。器の xtask の check は 4 つの門（paths-clean・private-clean・non-rust-exec・prose-gate）を n/a(not-a-repo-root) と出して黙る。割り count:1/8（落ちる 1 本 contract_names_declared_real_table_has_zero_findings を含む割り）は入れ子の歯の段で 495 本のうち 1 本が落ちて rc 100（132 秒）で、段は落ちた段の字を出し、後の clippy と器の xtask の check を撃たない。落ちる器の歯 4 本は割り 1・2・7 に在り、割り 3・4・5・6・8 に無い（どれも git の根の宣言を器の宣言と読む歯で、器の側の直しを待つ正しい落ち）。 filter の語の一覧（起草の時の main afa65b32 