goal = "在りか。差の file docs/design/patch/cs-close.patch は、行 cs-open から cs-show の試作を積んだ木に試作の commit 516c554c（写し drafts/w85a）を載せて切った（3 file・28,549 byte・+689 −14）。行 cs-open が骨で置いた境界の list.rs と close.rs を中身に替え、歯の file を足す。 なぜ。判断の記録 ADR-29 決定 (3) は窓を持ち主が閉じ、持ち主が閉じると言った時は席が起動の口で閉じると決め、決定 (5) は窓を閉じた後も作業場を残し、所見が全部処分された後に退きの置き場へ移す（消さない）と決め、一覧が所見の無いまま process の無い問う窓を止まったと出すと決めた。決定 (9) は処分の無い所見と席に届いていない頼みを tz consult の一覧に出すと決め、決定 (10) と規則の行 R-38 の数え（今日の数と今の数）を一覧に出す。決定 (8) は見張りが無い間の拾いの 1 つを一覧とした（席は show --via 一覧 で受ける）。 形（要約・字は差の file）。(a) list は値を取らない --json と共通の旗だけを受け、台帳を読み（読めなければ rc 2）、board（作業場と台帳の行と今の分）を組む。窓ごと（退いた窓も）に、id・控えの形と題・状態（退いた作業場なら 退いた、閉じの行が在れば 閉じた、最後の process の印の pid が在れば 生きている、ほかは 止まった）・最後の結果 開いた の開きの行の時刻・所見の数・処分の行の無い所見の数。処分の無い所見ごとに題と届いた時刻（所見の時刻）と受けた時刻（受けの行）。受けの無い頼みごとに題と時刻。数は中核の quota の count（生きている窓を渡す）。時刻は分の字を epoch_of で epoch 秒にする（RFC 3339 の形に直して server の clock の epoch_secs で読む・形でない字は None）。--json は電文 ConsultBoard（4 つの段はどれも Known）、無ければ text の人の読む行。台帳を書かない。(b) close は位置の引数 1 つと --by（seat・chat・button）を受け、退いていない作業場の窓の控えが無ければ断り、閉じの行の在る窓を断る。最後の process の印に tmux の window id が在れば、tmux display-message で窓の名を問い、consult-cw<n> と同じ時だけ kill-window を撃つ（違えば標準エラーに 1 行で撃たない）。私用の temp（作業場の canonicalize した path の private_tmp）は symlink でない作業場の持ち主の uid の dir だけを消す。閉じの行（起こし手・作業場の所見の数・今の分）を根に足し、行 cs-show の retire を撃つ。標準出力は 窓 cw<n> を閉じた と、退かせた時は 退いた と path。問う窓の子は止めない。 一覧の字の段（歯 cwcls_list_states_and_text の 7 行・今日の開きの行 2 本と生きている席の問う窓 1 つ）。 窓 cw1・形 問う・題 fx-c.2・状態 生きている・所見 1・未処分 1 窓 cw2・形 問う・題 題なし・状態 止まった・所見 0・未処分 0 窓 cw3・形 話す・題 題なし・状態 閉じた・所見 1・未処分 0 窓 cw4・形 話す・題 題なし・状態 退いた・所見 0・未処分 0 窓 cw5・形 話す・題 題なし・状態 止まった・所見 0・未処分 0 受けの無い頼み rq-20261003T1412Z-1・題 題なし 席の問う窓: 今日 2・今 1（規則の行 R-38 の上限 同時 1・1 日 3） 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done の 1 つ目から 5 つ目の項は verify の 3 行目（cwcls_ の 5 本）、最後の項は 4 行目（xtask の check・歯の全部を撃つ）。done の項は歯が測る物だけにした。verify の 1 行目（git apply --reverse --check）は差の file の hunk が全部木に在ることを、2 行目（cargo clippy -p tsuzuri-boundary --all-targets --no-deps -- -D warnings）は clippy の落ちが無いことを、命令の rc で測る守りで、done の項にしない。 構造の連鎖。list.rs と close.rs は行 cs-open が骨で置き、中身はこの行だけが書く。使うのは行 cs-launch の TMUX と行 cs-show の retire、中核の launch の private_tmp と quota（DAY_MAX・LIVE_MAX・count）と lines（Line・Subject・unreceived）、契約の consult の一覧の電文の型（ConsultBoard・FindingRow・RequestRow・SeatQuota・WindowRow・WindowState）と wire、境界の server の clock の epoch_secs と ledger の capture（今の pub の名・替えない）。list の board・text・epoch_of・state_of と close の kill_named・drop_tmp は pub（後の server の行 cs-server が board を使う見込み）。 試作と噛み。今の main 19407588 に行 cs-types から cs-close までの差を契約表の順に当てた木 a34e433d（写し drafts/w93a）で境界の crate の clippy（--all-targets --no-deps・-D warnings）が rc 0、歯 cwcls_ の 5 本が通る。xtask の check は 11 行（cs-types から cs-close）の差を全部当てた最後の木 a34e433d で 1 回だけ撃って rc 0（workspace の歯 3,104 本・size は file-lines 1348/1500・core-lines 8355/20000・test-src-ratio 7069/82451）で、行ごとの木では撃っていない。差の file を切った試作の commit は係 w85a の写しの 516c554c で、次の噛みもその木で撃った（差の file は 1 字も替わらない）。噛みは変異 6 つ（生きている窓を止まったと見る・分の字の秒を替える・名を照らさずに kill-window・閉じの行を退かせの材料にしない・閉じた窓をまた閉じる・temp の symlink を辿る）で、5 本の歯のどれも少なくとも 1 つで落ちる（どの変異も rc 100・対照は全部通る）。歯は偽の tmux（受けた argv を記録し、窓の名を置き場の file の字で答える）を撃ち、本物の tmux を撃たない。 流す時と順。depends は cs-launch（TMUX）と cs-show（retire）。cs-open と cs-quota はその前に在る。depends の確かめ（係 w93a）は、main 19407588 に depends を辿った行 cs-types・cs-finding・cs-lines・cs-argv・cs-quota・cs-open・cs-launch・cs-show の差とこの行の差だけを当てた木 0bbcd4d2 で（cs-answer と cs-watch を当てずに）、境界の crate の clippy と歯 cwcls_ の 5 本が通る。 範囲の外。board の server の一覧の口（行 cs-server が board を使って組む）。窓の中の exit で閉じられた話す窓の拾い（行 cs-watch の 1 行で席が close --by chat を撃つ）。"
