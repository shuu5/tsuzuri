[[contract]]
id = "cs-launch"
title = "窓を起こす口 tz consult launch を置く（話す窓は席の tmux の session に -d と -e の閉じた 4 つで新しい窓を・問う窓は席の子の claude -p を作業場で・中核の argv と audit の欠けで起こさない・私用の temp を 0700 で・R-38 の断り・開きの行・process の印・--dry-run・受入 AC19 の起こし・差の file）"
req = ["FR19"]
section = "18"
write-set = ["crates/tsuzuri-boundary/src/consult/launch.rs", "+crates/tsuzuri-boundary/tests/cwlch.rs"]
