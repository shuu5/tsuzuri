y で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done の 1 つ目から 6 つ目の項は verify の 3 行目（cwlch_ の 6 本）、最後の項は 4 行目（xtask の check・歯の全部を撃つ）。done の項は歯が測る物だけにした。verify の 1 行目（git apply --reverse --check）は差の file の hunk が全部木に在ることを、2 行目（cargo clippy -p tsuzuri-boundary --all-targets --no-deps -- -D warnings）は clippy の落ちが無いことを、命令の rc で測る守りで、done の項にしない。 構造の連鎖。launch.rs は行 cs-open が骨で置き、中身はこの行だけが書く。使うのは中核の launch（ASK_DROP・Launch・PROGRAM・TALK_ENV・VERSION_ENV・argv・audit・env・private_tmp・read_roots・version_ok）と lines（By・Event・Line・WORD_MAX・cited・free・notice）と quota（admit・count）、境界の server の ledger（KILL・capture・stop_with）と行 cs-open の consult の共通の手（どれも今の pub の名・替えない）。material と TMUX と WINDOW_FORMAT と ASK_LIMIT は pub（行 cs-close が TMUX を使う）。 本物の tmux と claude を撃たない歯。偽の tmux（受けた argv を記録し、display-message に session の名 seat-s を、new-window に @7 と 4242 を答える）と偽の claude（argv と環境と pid を記録し、印の file が在れば findings/cw1-1.json を置く）を PATH の頭に置いて撃つ。tz に渡す環境の TMUX と TMUX_PANE は偽の字で、動いている tmux の server に触れない。囲いの実の効き（作業場の外と repo へ書けない）は撃たない（着地の後に席の手で問う窓と話す窓の両方で確かめる）。 試作と噛み。main 5c8fe2b4（行 cs-types が着地）に行 cs-finding から cs-launch までの差を契約表の順に当てた木 7a9a0f96（写し drafts/w93a）で境界の crate の clippy（--all-targets --no-deps・-D warnings）が rc 0、歯 cwlch_ の 6 本が通る。xtask の check は 11 行の差を全部当てた最後の木 8214cef7 で 1 回だけ撃って rc 0（workspace の歯 3,104 本・size は file-lines 1348/1500・core-lines 8367/20000・test-src-ratio 7069/82463・今の main 61c2a443 に着地していない行の差を順に当てた木の crates と tests と xtask の字は 8214cef7 と同じ）で、行ごとの木では撃っていない。第 0.11 版の直し（否定の見本が測りたい句より前の別の理由で断られる空振りを除く・係 w93a）は、--dry-run を撃つ前に台帳の写しを消す見本にした（前は --dry-run が台帳を読んでも通った）。その噛みは変異 1（--dry-run でも台帳を読む）で、どれも直した歯で落ち（rc 100・対照は全部通る）、前の歯では通った（空振り）。次の噛みは直す前の差で、係 w85a の写しの木 3f9aa735 で撃った。噛みは変異 6 つ（話す窓の -d を落とす・問う窓に TMUX を残す・検めの欠けでも起こす・R-38 を数えない・--dry-run でも起こす・temp の mode を緩く見る）で、6 本の歯のどれも少なくとも 1 つで落ちる（どの変異も rc 100・対照は全部通る）。 句の型の照らし（第 0.15 版・便 t3-hub.75.5 の 2 度目の審査の vacuous-assert に答える・係 w93a）。done の句を型（順・1 度だけと重ねない・縁と既定と空・だけ）に分け、句を崩す変異（順を替える・重ねる・縁を 1 ずらす・既定に倒す