と rc 0。 前の試作の木（commit 5cad5dad・ほかの crate を名指す字の直しの前・噛んだ歯と変異の所の字は同じ）での噛みは変異 3（どれも rc 100）: 群 teeth5 の main.rs から行 mod wstrip; を消す・表 GROUPS の面の群 teeth3 の module の数を 30 から 31 へ（この 2 つで kfold_groups_declare_every_module_once が落ちる）・群 teeth5 の歯の名を群 teeth1 の歯の名と同じにする（kfold_test_names_unique_in_each_crate が落ちる）。 範囲の外。新しい行の歯の置き方（段）と畳みの行の置き方は起草の守りと席の手が持つ。klintf と klint の根の重複の退役・自分の名の照らしの寄せは別の行。着地した行の verify の字（--test の旧い名）と差の file は歴史として残し書き換えない（判断の記録 ADR-32 の決定 (9)）。"

