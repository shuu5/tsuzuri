le の名 sheet:: を足す（libtest の名が <module>::<fn> になる）。schema_docs.rs は schema.rs と自分を群の dir の path で読む。schema.rs の中の設計の字の写し crates/folio/tests/floor_cases.rs は書き換えない。folio の manifest の test の項は群 teeth1 の 1 つ、境界の manifest の folio の歯の test の項は群 tz1〜tz5 の 5 つ（path は ../../folio2/crates/folio/tests/<群>/main.rs）にする。 lint の期待。constitution_enums.rs と parts_catalog.rs が持っていた build.rs の取り込み（dead_code の expect の属性と #[path] の属性の付いた mod build;）は、群 teeth1 の main.rs に 1 度だけ置く。この期待を満たすのは build.rs の 8 つの item（const CATALOG・const CONSTITUTION・const TOOL と fn derive・fn main・fn tool_files・fn walk・fn write_out）で、main.rs の expect の行を消して clippy を撃つと、この 8 つが使われない item として報されて落ちる（rc 101・試作の木で撃った）。ほかの移す file（群 teeth1 の 5 つと境界が組む群 tz1〜tz5 の 58）の lint の属性は頭の #![cfg(test)] だけ。 ほかの crate を名指す字。fold2.py（係 w89a の直し）は、歯の file を名指す字（crate の tests/ と src/ の .rs と build.rs の中・code の path の字と //! と // の注の両方）を全部拾い、名指す crate を path の頭（crates/<crate>/・<crate>/・../<crate>/・xtask/・folio2/crates/folio/）か、字の直前の修飾の語（境界の・中核の・面の・契約の・tsuzuri-<crate> の）で決め、どちらも無ければ字の在る file の crate とする。指さなくなった字だけを、その crate の tests/ の直下と群の dir の直下で同じ名の 1 つの file へ書き換える。この行で動かす file を名指す字はどの crate の file の中でも直し、前の行で動いた file を名指す古い字も直し、ほかの crate の動いていない file を名指す字には触れない。許し（w/refallow.tsv）は、退役した歯の名を無いと見る歯の字 11（面の bvcull.rs・bvgdom.rs・bvmtbl.rs・bvshed.rs の 9 つと xtask の retire.rs の 2 つ・main e16524a9 から指さない）と、folio の設計の字の写し crates/folio/tests/floor_cases.rs の 2 つ（tests の schema.rs と src/floor_adr.rs）。照らしの script w/refcheck.py（同じ読み）は、この行の木で許しの外の指さない字が 0（rc 0）。 この行が書き換える字: folio の file の中で folio の file を名指す字 53。ほかの crate の file の中で folio の歯の file を名指す字は、境界の manifest の test の項の path（群 tz1〜tz5 の main.rs へ・manifest は照らしの外）と、xtask の retire.rs の退役した 2 つの名（許しの字）のほか無い。設計の字の写し crates/folio/tests/floor_cases.rs の 2 つは許しの字で書き換えない（この行の後は指さない字になり、許した字は 13 から 15 になる）。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 構造の連鎖。移す file を名指す path の字はほかの crate の歯にも在り、差はその file も書く（write-set の ~ と + の対のほかの項目）。群の main.rs は畳みの行だけが書