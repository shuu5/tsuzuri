goal = "在りか。差の file docs/design/patch/cs-lines.patch は、main 145db064（行 cs-types と cs-argv が着地した木）に試作の commit d047da07（写し drafts/w93a・係 w83a の試作 745ad5f8 の差に第 0.11 版と第 0.15 版の直しを足した）を載せて切った（2 file・41,963 byte・+1200 −1）。中核の src/consult/lines.rs の骨の注 1 行を中身に替える。 なぜ。判断の記録 ADR-29 決定 (4) は、相談の bead を起こさず、台帳の型付きの行（頭が相談の で始まる閉じた 6 つ）で記帳し、置けるのは memo と根の bead だけで、開いた問い（版の要約値が notes を含む）と契約の bead に置かないと決めた。決定 (8) は見張りが固定の 1 行を出して席を起こすと決めた。器の席の答え（memo t3-hub.75）の注意 (a) は行の本文に器の引用の形（user と時刻・batch: ・policy: ・問いの id と分と数の並び）を書くと裁定の引用として数えられること、(b) は memo の notes の 8192 byte の上限、(c) は memo の notes が memo の審査の材料になること。この行は字と置き場を純な関数にし、書く口（後の行）が同じ関数を引く。 行の字の段（6 つの見本・render の字）。 相談の頼み = rq-20261003T1412Z-1・題 = t3-hub.75・形 = 話す・model = fable・起こし手 = 持ち主の button・時刻 = 20261003T1412Z 相談の開き = cw3・形 = 話す・題 = 題なし・起こし手 = 持ち主のチャット・発話 = 20261003T1410Z・model = fable・念入りさ = xhigh・結果 = 開いた・時刻 = 20261003T1412Z 相談の所見 = cw3-1・窓 = cw3・題 = t3-hub.75・時刻 = 20261003T1530Z 相談の受け = cw3-1・経路 = 見張り・時刻 = 20261003T1530Z 相談の処分 = cw3-1・採否 = 一部採る・理由 = 前提の 1 つが古い・保存 = work/report.md・不保存 = work/a.py、work/b.csv・時刻 = 20261003T1602Z 相談の閉じ = cw3・起こし手 = 席・所見 = 2・時刻 = 20261003T1800Z 形（要約・字は差の file）。(a) Line は 6 つの variant（Request・Open・Finding・Receipt・Disposal・Close）。開きの起こし手 By は Seat・Chat（発話の分の字）・Button（頼みの id）、受けた物 Subject は所見か頼み。render は頭と「 = 」と主の id の後に「<名> = <値>」の欄を「・」で区切って並べ、時刻は分の字（前に user を付けない）。自由な字（題・model・念入りさ・理由）は free で整え（字「・」を「／」に・制御の字を空白に・前後の空白を除く・題と model と念入りさは WORD_MAX の 40 字・理由は REASON_MAX の 80 字）、題が空なら NO_TOPIC の 題なし、保存と不保存の path の列は字「、」でつなぎ空なら NONE の なし。最後に cited が真なら書かずに LineError::Cited。read は render の逆で、render が書く欄を全部見て（頼みの行は起こし手が持ち主の button の時だけ・所見の行は窓が所見の id の窓の時だけ読む）、欄が 1 つでも欠ければ読まない。scan は notes の行ごとに read する。(b) cited は、字「:」の後に分の字と字「-」と数字（裁定 id の形）・字 batch: ・字 policy: ・字 user と空白の後に数字・導出グラフの TYPED_LINES の 3 つの頭（行頭に限らず字の中）・配達の印の頭 MARK_PREFIX のどれかで真。行は相談の で始まるので TYPED_LINES の行頭の照らしに当たらない。頼みの id は字「:」を持たないので当たらない。器の注意 (a) の 4 形（裁定 id の形・batch: ・policy: ・user と時刻）を断り、許すのは裸の bead id だけ。裸の bead id（t3-hub.75.1 のように字「:」と分と数の無い問いの id）は、器の席の答え（器の引用の読みは <問い id>:<分>-<n> まで揃った字だけ）のとおり引用に数えないので、題の欄に開いた問いの id をそのまま書く（置き替えない）。(c) home_of（台帳の LedgerItem の列・題・足す字）。根 root_of は種類 epic・親が無い・closed でない bead の id の自然な順で最初（境界の server/policy.rs の root_epic と同じ決まりを中核に置く）。題が台帳の bead なら、その bead から親を上へたどり（題が memo ならその memo）最も近い label intake:memo の bead に置く。たどりは台帳の bead の数を越えたら止める。memo の notes の byte と足す字の byte と 1（改行）の和が NOTES_MAX の 8192 を越えれば根に置き、足す字は Home::line で末に ・memo = <memo の id>（notes が満ちた）を足した字。根の notes の長さは見ない（器の席の答え Q-V3・notes の上限は器の rules 行 memo.notes_max_bytes の memo だけで、epic と契約には無い）。断りは根の epic が無い時の HomeError::NoRoot だけ。(d) unreceived（行の列・作業場に在る所見の id の列）は ConsultUnreceived を返す。(e) notice（事象・tz の解き方の命令の字）は次の固定の 1 行の段の字を返す。 固定の 1 行の段（tz の解き方の命令の字が /x/tzw の時）。 相談: 窓 cw3 の所見 cw3-1 が届いた（/x/tzw consult show cw3-1 --via 見張り）・「/x/tzw consult watch」を背景で置き直す 相談: 窓 cw4 の所見 cw4-2 が届いた（/x/tzw consult show cw4-2 --via 完了） 相談: 頼み rq-20261003T1412Z-1 が届いた（/x/tzw consult open --request rq-20261003T1412Z-1 --by button）・「/x/tzw consult watch」を背景で置き直す 相談: 問う窓 cw4 が所見なしで止まった（/x/tzw consult launch cw4 --again）・「/x/tzw consult watch」を背景で置き直す 相談: 話す窓 cw3 が閉じられた（/x/tzw consult close cw3 --by chat）・「/x/tzw consult watch」を背景で置き直す 相談: 見張りが上限で終わった・「/x/tzw consult watch」を背景で置き直す 器の席の答え。Q-V2: 器の入力の時の hook が席の文脈へ器が記録した発話の時刻の 1 行（scribe2 utterance と ts）を出すので、持ち主のチャットで開く窓の開きの行の 発話 = はその時刻を分の字にして書く（逐語は器の utterance show の口で引ける）。Q-V3: notes の上限は memo だけなので、memo が満ちる行は根に置く形のまま（根では断らない）。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done の 1 つ目から 9 つ目の項は verify の 3 行目（cwlin_ の 9 本）、最後の項は 4 行目（xtask の check・歯の全部を撃つ）。done の項は歯が測る物だけにした。verify の 1 行目（git apply --reverse --check）は差の file の hunk が全部木に在ることを、2 行目（cargo clippy -p tsuzuri-core --all-targets --no-deps -- -D warnings）は clippy の落ちが無いことを、命令の rc で測る守りで、done の項にしない。 構造の連鎖。lines.rs は行 cs-types が骨で置き、中身はこの行だけが書く。使うのは契約の consult の id と語と minute_ok・graph の natural_cmp・ledger の BeadId と LedgerItem（is_memo