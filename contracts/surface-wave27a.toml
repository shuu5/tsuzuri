を出し、--topic fx-c.2 は bd の今の字でなく台帳の写しの本文で question.md を組み、cwd が作業場でないかほかの窓の作業場なら rc 1、TZ_CONSULT_ID がほかの窓の id なら席の撃ちとして台帳の写しを替える（歯 cwopn_bundle_inside_window） (6) open --by button --request rq-20261003T1412Z-1 は台帳の相談の頼みの行の形 問う・model opus・題 fx-c.2 と起こし手 button と頼みの id を控えに置き、偽の bdw が受けるのは update と頼みの題の置き場の memo fx-c.1 と、行 相談の受け = rq-20261003T1412Z-1・経路 = 見張り・時刻 = 撃った間の分 の 1 本だけ、台帳に無い頼みと受けの行の在る頼みは rc 1（字 台帳に無い・もう受けた）、ほかの頼みの受けの行の在る台帳でも --via 一覧 --topic 別の題 は rc 0 で受けの行の経路と控えの題を替え、受けの置き場は memo fx-c.1 のまま（歯 cwopn_request_receipt） (7) windows は起草の置き場の consult-cw<n> と retired-consult-cw<n> の dir だけを id の数の順に退いたかと読み（cw0 と file と頭に consult- の無い dir を除く・cw2 の後に cw10）、findings は窓の id の所見の名の .json だけを id の数の順に（番号 0 と .txt とほかの窓の名を除く・cw1-2 の後に cw1-10）、procs は名が proc-<k>.json の読める印だけを k の数の順に（形の違う印と .txt の名を除く・2 の後に 10）、alive は 0 を偽で 1 と今の pid を真、live は最後の印の pid で判じ（後に死んだ pid の印を足すと偽）、flags は位置の引数と何度でも受ける旗の値の受けた順（字の順でない）と値を取らない旗を読み、2 度の旗・2 度の値を取らない旗・知らない旗・空の値・値の欠けをそれぞれの断りの字で断る（歯 cwopn_workspace_readers） (8) cargo run -q -p xtask -- check が rc 0"
