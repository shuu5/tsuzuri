done = "(1) HEADS は相談の頼み・相談の開き・相談の所見・相談の受け・相談の処分・相談の閉じの順で、6 つの見本の行の render の字は節の行の字の段の 6 行と同じで、どれも read で同じ値に戻り、scan は notes の中の相談の行だけを順に読み、頭の知らない行・時刻の欄の無い行・欄の足りない行・空の行を読まない（歯 cwlin_six_heads_text_and_roundtrip） (2) 開きの行は、起こし手が席なら添えが無く、持ち主の button なら 頼み = と頼みの id を、持ち主のチャットなら 発話 = と分の字（器が記録した発話の時刻）を起こし手の次に添え、結果は 開いた か 落ちた、撃ち直しは 撃ち直し = はい を時刻の前に足し、どれも read で戻り、受けの行は頼みの id と経路の 4 つの語でも往復する（歯 cwlin_open_starters_and_marks） (3) free は字「・」を字「／」に、制御の字を空白に替えて前後の空白を除いて切り、題は 40 字・理由は 80 字で切り、空白だけの題は 題なし、空の保存と不保存の列は なし（歯 cwlin_free_text_cleaned） (4) 字「:」と分の字と字「-」と数字の並び（裁定 id の形）・字 batch と半角のコロン・字 policy と半角のコロン・字 user と空白と数字・TYPED_LINES の 3 つの頭・配達の印の頭のどれかを含む字は cited が真で、題に置くと render が引用の断りにし、t3-hub.75・裸の問いの id t3-hub.75.1・rq-20261003T1412Z-1・時刻と分の字・user の言葉・a:b・数の無い x:20261003T1412Z は偽で、6 つの見本の行は TYPED_LINES の頭でも MARK_PREFIX でも始まらない（歯 cwlin_refuses_cited_forms） (5) 時刻か発話の分の字が分の形でなければ分の断り、model を整えて空なら空の断り、保存の path が字「、」か字「・」か改行を含むか空なら path の断り（歯 cwlin_refuses_bad_fields） (6) home_of は題の bead から親を上へたどった最も近い memo（題が memo ならその memo）に置き、memo の無い題・台帳に無い題・題なしは根（種類 epic・親なし・closed でない・id の自然な順で最初）に置き、どの bead を題にしても置き場は memo か根で、根が無ければ根なしの断り、親が輪になっても根に置いて終わる（歯 cwlin_home_memo_or_root） (7) memo の notes の byte と行の byte と 1 の和が 8192 を越えれば根に置き、足す字は行の末に ・memo = と memo の id と（notes が満ちた）を足した字で、根の notes の長さは見ない（根の notes が 8192 の 4 倍でも根に置く）（歯 cwlin_full_memo_goes_to_root） (8) unreceived は作業場に在って受けの行の無い所見の id を重ねずに id の順で、頼みの行が在って受けの行の無い頼みの id を台帳の順で返す（歯 cwlin_unreceived_findings_and_requests） (9) notice の 6 つの事象の字は節の固定の 1 行の段の 6 行と同じで、経路 完了 の所見の行だけが置き直しの命令を末に持たない（歯 cwlin_notice_fixed_lines） (10) cargo run -q -p xtask -- check が rc 0"
