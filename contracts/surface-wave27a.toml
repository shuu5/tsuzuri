depends = ["cs-launch", "cs-show"]
goal = "在りか。差の file docs/design/patch/cs-close.patch は、行 cs-open から cs-show の試作を積んだ木に試作の commit 516c554c（写し drafts/w85a）を載せて切った（3 file・31,020 byte・+733 −14・第 0.11 版で歯の file を、第 0.15 版で歯の file と srcを直し、main 145db064 に着地していない前の行の差を 11 行の順に当てた木の上で切り直した）。行 cs-open が骨で置いた境界の list.rs と close.rs を中身に替え、歯の file を足す。 なぜ。判断の記録 ADR-29 決定 (3) は窓を持ち主が閉じ、持ち主が閉じると言った時は席が起動の口で閉じると決め、決定 (5) は窓を閉じた後も作業場を残し、所見が全部処分された後に退きの置き場へ移す（消さない）と決め、一覧が所見の無いまま process の無い問う窓を止まったと出すと決めた。決定 (9) は処分の無い所見と席に届いていない頼みを tz consult の一覧に出すと決め、決定 (10) と規則の行 R-38 の数え（今日の数と今の数）を一覧に出す。決定 (8) は見張りが無い間の拾いの 1 つを一覧とした（席は show --via 一覧 で受ける）。 形（要約・字は差の file）。(a) list は値を取らない --json と共通の旗だけを受け、台帳を読み（読めなければ rc 2）、board（作業場と台帳の行と今の分）を組む。窓ごと（退いた窓も）に、id・控えの形と題・状態（退いた作業場なら 退いた、閉じの行が在れば 閉じた、最後の process の印の pid が在れば 生きている、ほかは 止まった）・最後の結果 開いた の開きの行の時刻・所見の数・処分の行の無い所見の数。処分の無い所見ごとに題と届いた時刻（所見の時刻）と受けた時刻（受けの行）。受けの無い頼みごとに題と時刻。数は中核の quota の count（生きている窓を渡す）。時刻は分の字を epoch_of で epoch 秒にする（RFC 3339 の形に直して server の clock の epoch_secs で読む・形でない字は None）。--json は電文 ConsultBoard（4 つの段はどれも Known）、無ければ text の人の読む行。台帳を書かない。(b) close は位置の引数 1 つと --by（seat・chat・button）を受け、退いていない作業場の窓の控えが無ければ断り、閉じの行の在る窓を断る。最後の process の印に tmux の window id が在れば、tmux display-message で窓の名を問い、consult-cw<n> と同じ時だけ kill-window を撃つ（違えば標準エラーに 1 行で撃たない）。私用の temp（作業場の canonicalize した path の private_tmp）は symlink でない作業場の持ち主の uid の dir だけを消す。閉じの行（起こし手・作業場の所見の数・今の分）を根に足し、行 cs-show の retire を撃つ。標準出力は 窓 cw<n> を閉じた と、退かせた時は 退いた と path。問う窓の子は止めない。 一覧の字の段（歯 cwcls_list_states_and_text の 7 行・今日の開きの行 2 本と生きている席の問う窓 1 つ）。 窓 cw1・形 問う・題 fx-c.2・状態 生きている・所見 1・未処分 1 窓 cw2・形 問う・題 題なし・状態 止まった・所見 0・未処分 0 窓 cw3・形 話す・題 題なし・状態 閉じた・所見 1・未処分 0 窓 cw4・形 話す・題 題なし・状態 退いた・所見 0・未処分 0 窓 cw5・形 話す・題 題なし・状態 止まった・所見 0・未処分 0 受けの無い頼み rq-20261003T1412Z-1・題 題なし 席の問う窓: 今日 2・今 1（規則の行 R-38 の上限 同時 1・1 日 3） 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done の 1 つ目から 5 つ目の項は verify の 3 行目（cwcls_ の 5 本）、最後の項は 4 行目（xtask の check・歯の全部を撃つ）。done の項は歯が測る物だけにした。verify の 1 行目（git apply --reverse --check）は差の file の hunk が全部木に在ることを、2 行目（cargo clippy -p tsuzuri-boundary --all-targets --no-deps -- -D warnings）は clippy の落ちが無いことを、命令の rc で測る守りで、done の項にしない。 構造の連鎖。list.rs と close.rs は行 cs-open が骨で置き、中身はこの行だけが書く。使うのは行 cs-launch の TMUX と行 cs-show の retire、中核の launch の private_tmp と quota（DAY_MAX・LIVE_MAX・count）と lines（Line・Subject・unreceived）、契約の consult の一覧の電文の型（ConsultBoard・FindingRow・RequestRow・SeatQuota・WindowRow・WindowState）と wire、境界の server の clock の epoch_secs と ledger の capture（今の pub の名・替えない）。list の board・text・epoch_of・state_of と close の kill_named・drop_tmp は pub（後の server の行 cs-server が board を使う見込み）。 試作と噛み。main 5c8fe2b4（行 cs-types が着地）に行 cs-finding から cs-close までの差を契約表の順に当てた木 8214cef7（写し drafts/w93a）で境界の crate の clippy（--all-targets --no-deps・-D warnings）が rc 0、歯 cwcls_ の 5 本が通る。xtask の check は 11 行の差を全部当てた最後の木 8214cef7 で 1 回だけ撃って rc 0（workspace の歯 3,104 本・size は file-lines 1348/1500・core-lines 8367/20000・test-src-ratio 7069/82463・今の main 61c2a443 に着地していない行の差を順に当てた木の crates と tests と xtask の字は 8214cef7 と同じ）で、行ごとの木では撃っていない。第 0.11 版の直し（否定の見本が測りたい句より前の別の理由で断られる空振りを除く・係 w93a）は、閉じた窓の見本に tmux の窓を持つ話す窓 cw2 を足し（前の見本 cw1 は tmux の窓を持たず、閉じの検めを外しても tmux に届かなかった）、2 つの位置の引数の 2 つ目を在る窓にし、受けた頼みとその受けの行を一覧の見本に足した（一覧の字の段の 7 行は替わらない）。その噛みは変異 4（tmux の窓を持つ窓では閉じの検めを外す・位置の引数の最初を取る・最後を取る・受けた頼みも一覧に出す）で、どれも直した歯で落ち（rc 100・対照は全部通る）、前の歯では 4 のうち 3 つが通った（空振り・最初を取る変異は前の歯でも落ちた）。次の噛みは直す前の差で、係 w85a の写しの木 516c554c で撃った。噛みは変異 6 つ（生きている窓を止まったと見る・分の字の秒を替える・名を照らさずに kill-window・閉じの行を退かせの材料にしない・閉じた窓をまた閉じる・temp の symlink を辿る）で、5 本の歯のどれも少なくとも 1 つで落ちる（どの変異も rc 100・対照は全部通る）。歯は偽の tmux（受けた argv を記録し、窓の名を置き場の file の字で答える）を撃ち、本物の tmux を撃たない。 句の型の照らし（第 0.15 版・便 t3-hub.75.5 の 2 度目の審査の vacuous-assert に答える・係 w93a）。done の句を型（順・1 度だけと重ねない・縁と既定と空・だけ）に分け、句を崩す変異（順を替える・重ねる・縁を 1 ずらす・既定に倒す・だけの絞りを外す）を 35 撃ち、直した歯で 35 が名指しの歯で落ちた（rc 100・対照は全部通る）。前の歯では落ちない見立て（src と歯を読んだ見立て・前の歯では撃っていない）の変異が 12 で、その句の見本を足して直した（窓の数の順（cw10）・閉じたと生きているの先後・退いたと閉じたの先後・最後の開いた行の時刻・同じ頼みの行の 2 度・最後の process の印の窓・中に file の在る私用の temp・閉じの行の時刻の縁・名の照らしの否定・処分した所見の数・ほかの窓の閉じの行・--by button の写像）。歯の fn の数と名は替えない。src は list.rs も直した（一覧の受けの無い頼みは同じ頼みの行が 2 度在っても 1 つ）。xtask の check は main 145db064 に着地していない行の差を 11 行の順に当てた木 2b4b6fe6 で rc 0（workspace の歯 3,121 本・size は file-lines 1348/1500・core-lines 8367/20000・test-src-ratio 7069/82743）。 流す時と順。depends は cs-launch（TMUX）と cs-show（retire）。cs-open と cs-quota はその前に在る。depends の確かめ（係 w93a・第 0.9 版の差・歯の file を直す前）は、main 19407588 に depends を辿った行 cs-types・cs-finding・cs-lines・cs-argv・cs-quota・cs-open・cs-launch・cs-show の差とこの行の差だけを当てた木 0bbcd4d2 で（cs-answer と cs-watch を当てずに）、境界の crate の clippy と歯 cwcls_ の 5 本が通る。 範囲の外。board の server の一覧の口（行 cs-server が board を使って組む）。窓の中の exit で閉じられた話す窓の拾い（行 cs-watch の 1 行で席が close --by chat を撃つ）。"

[[contract]]
id = "v-skip"
title = "xtask の check の入れ子の段を、送り先の main との合流の基からの差（作業木と未追跡を含む）が入れ子の入力 6 つに触れない dir では省いて 1 行を出し、根が木の根でない・base が読めない・自分の commit が 0・環境変数 TSUZURI_CHECK_NESTED_ALL が在る時は全部を撃ち、CI の job check にその環境変数を置く（判断の記録 ADR-34・器 scribe2 の持ち込みの前の行・差の file）"
req = ["NFR3"]
section = "23"
write-set = ["xtask/src/nested.rs", "+xtask/src/nested/skip.rs", "+xtask/tests/vskip.rs", ".github/workflows/ci.yml"]
verify = ["git apply --reverse --check docs/design/patch/v-skip.patch", "cargo clippy -p xtask --all-targets --no-deps -- -D warnings", "cargo nextest run -p xtask --test vskip --no-tests=fail vskip_", "cargo run -q -p xtask -- check"]
size = "M"
done = "(1) 定数 SHARED は rust-toolchain・rust-toolchain.toml・.cargo/・xtask/src/・xtask/Cargo.toml の 5 つをこの順で持ち、fn inputs は字 scribe2 に scribe2/ を頭に足した 6 つを返し、定数 FORCE_ENV は TSUZURI_CHECK_NESTED_ALL、定数 BASE_REF は origin/main で、fn line は省いた判じを字 nested と空白と dir の名と半角のコロンの 1 字と空白と字 省いた（base と空白と base の頭 12 字と字 からの差が入れ子の入力に触れない）の 1 行に、全部を撃つ判じを字 nested と空白と dir の名と半角のコロンの 1 字と空白と字 全部を撃つ（と理由と字 ）の 1 行にする（歯 vskip_fixed_inputs_and_env） (2) base の上に入力の外の commit を置いた fixture の木で、xtask/tests の下の file・名の頭だけが同じ dir s2x の file・rust-toolchain.toml.bak を直す commit を足し、未追跡の docs/new.md と .gitignore が除く s2/ignored/out.txt を置いても、fn decide は dir s2 を省き、省いた base は origin/main の sha（歯 vskip_outside_change_skips） (3) 入力の外の commit の上に、s2/src/lib.rs・新しい s2/new.rs・rust-toolchain・rust-toolchain.toml・.cargo/config.toml・xtask/src/main.rs・新しい xtask/src/new.rs・xtask/Cargo.toml のどれか 1 つを直す commit を置いた 8 つの木で、fn decide は dir s2 を全部を撃ち、理由は字 base と空白と base の頭 12 字と字 からの差が入れ子の入力に触れる（歯 vskip_inputs_touched_run_all） (4) git mv で s2/src/lib.rs を crates/a/src/moved.rs へ・crates/a/src/lib.rs を s2/src/moved.rs へ・rust-toolchain.toml を docs/toolchain.toml へ移す commit の木では全部を撃ち、crates/a/src/lib.rs を crates/a/src/moved.rs へ移す commit の木では省く（歯 vskip_renames_run_all） (5) 入力の外の commit の上で、未追跡の s2/new.rs・.cargo/config.toml・xtask/src/new.rs のどれか 1 つ、作業木だけの s2/src/lib.rs の直し、index に載せた同じ直し、作業木で消した rust-toolchain.toml のどれでも全部を撃ち、直しを index と作業木から戻した木は省く（歯 vskip_untracked_and_worktree_run_all） (6) HEAD が origin/main と同じ木（入力の外の未 commit の直しが在っても）と、origin/main より 1 つ古い commit に HEAD を置いた木では全部を撃ち、理由は字 base と空白と base の頭 12 字と字 から HEAD までに自分の commit が無い（歯 vskip_no_own_commit_runs_all） (7) origin/main の印を消した木と、origin/main を共通の祖先の無い commit に向けた木では理由 base を読めない（merge-base HEAD origin/main）で全部を撃ち、git の木の下の dir crates を根にすると理由 根が git の木の根でない、git の木でない dir では理由 根が git の木でない で全部を撃つ（歯 vskip_unreadable_base_runs_all） (8) 省く側の木でも forced が真なら理由 TSUZURI_CHECK_NESTED_ALL が在る で全部を撃ち、git の木でない dir でも同じ判じを返す（歯 vskip_force_env_runs_all） (9) fn select は