schema = 1

[[contract]]
id = "c-g3-bindline"
title = "導出グラフの台帳の読みと外の台帳の読みが、器の結びの口が問いの notes に足す 5 欄の裁定の行（区切りは空白と縦棒と空白）も、条件を満たす時だけ裁定の定型行として読む（判断の記録 ADR-7 決定 (4)・ADR-44 の段 0・ADR-45 の門 H3・差の file）"
req = ["FR2", "FR3"]
section = "4"
write-set = ["crates/tsuzuri-core/src/graph/build.rs", "+crates/tsuzuri-core/tests/g3bl.rs", "=crates/tsuzuri-core/tests/teeth1/g3g7.rs", "=crates/tsuzuri-core/tests/teeth2/graph.rs"]
verify = ["git apply --reverse --check docs/design/patch/c-g3-bindline.patch", "cargo clippy -p tsuzuri-core --all-targets --no-deps -- -D warnings", "cargo nextest run -p tsuzuri-core --test g3bl --no-tests=fail g3bl_", "cargo nextest run -p tsuzuri-core --lib --no-tests=fail graph_typed_lines_", "cargo nextest run -p tsuzuri-core --test teeth1 --no-tests=fail g3g7_", "cargo nextest run -p tsuzuri-core --test teeth2 --no-tests=fail graph_", "cargo run -q -p xtask -- check"]
size = "M"
done = "(1) 差の file docs/design/patch/c-g3-bindline.patch の hunk が全部木に在る（verify の 1 行目） (2) 器の形の正しい行を 1 本 notes に持つ問いの bead から、1 つ目の欄の id の裁定の節点を 1 つ（題は行の title36・file と要約値と行と時刻は持たない）と、裁定から問いへの answers の辺を組み、欄の区切りと欄の数の下限の定数は空白と縦棒と空白の 3 字と 5（歯 g3bl_bind_line_makes_ruling_and_answers） (3) 欄が 4 つ・1 つ目の欄が裁定 id の文法の外・1 つ目の欄のコロンの前が 2 つ目の欄と違う・2 つ目の欄が notes を持つ bead でないの 4 つの見本は、どれも裁定の節点も answers の辺も作らず読めない出所も立てず、行を読む関数 bind_line は正しい行だけに 1 つ目の欄を返す（歯 g3bl_only_full_bind_lines_count） (4) 外の台帳の読みは、正しい行の id を裁定の id の集まりに入れ、欄が 4 つの行の id は入れず、bead の id は両方入れる（歯 g3bl_outside_reads_bind_lines） (5) 承認の欄が器の形の行の id を名指す判断の記録を不変条件の 3 番が名指さず合格にし（7 番も合格）、同じ所を欄が 4 つの行に替えると 3 番はその判断の記録の id を名指す違反（歯 g3bl_g3_stops_naming_the_bound_ruling） (6) 頭の字 裁定 id = の行は欄の区切りを含んでも前のとおり頭の字の後から中黒までを id として読み（題は行の title36）、頭の字の行を器の形の行として読まない（歯 g3bl_typed_prefix_lines_stay_first） (7) 着地済みの歯の graph_typed_lines_ と g3g7_ と graph_ が通る（verify の 4〜6 行目） (8) cargo run -q -p xtask -- check が rc 0（最後の verify の行・歯の全部）"
goal = "在りか。差の file docs/design/patch/c-g3-bindline.patch は、main 0ee9c0da と、その上に試作を載せた木 7f767bd2（写し drafts/w146a の branch rows3）との差（2 file・+193 −11・12,957 byte）。 なぜ。判断の記録 ADR-7 の決定 (4)（答えは notes の定型行として あなたの決定 の節点になる）を、合流で入った器の結びの口（seat ruling bind・器の src/seat/ruling.rs の row_of）の行の形まで広げる（ADR-36・ADR-44 の段 0 の 2 つ目・ADR-45 の門 H3）。器の結びの口は問いの notes に 5 欄の 1 行（裁定 id・問い id・発話の ts・経路・逐語〔JSON の字の字面〕を、空白と縦棒と空白でつないだ字）を足す。tz の導出グラフの読みは頭の字 裁定 id = の行だけを読むので、承認の欄がこの裁定 id を名指す判断の記録を不変条件の 3 番が名指していた（係 w145a の測りで 240）。設計の commit で直せる字は無く（承認の字は正しく、名指す id は台帳に在る）、読みを広げる。書く形（tz の面の 裁定 id = の行）と台帳の字と承認の字は替えない。 形。 - 中核の src/graph/build.rs に定数 BIND_SEP（空白と縦棒と空白の 3 字）と BIND_FIELDS（5）と関数 bind_line（行と bead の id）を足した。bind_line は、区切りで割った欄が 5 以上在り、1 つ目の欄がコロンを持ち裁定 id の文法（中核の src/graph/check.rs の in_ruling_grammar・問いの形）に合い、コロンの前の字が 2 つ目の欄と同じで、2 つ目の欄が bead の id と同じ時だけ、1 つ目の欄を返す。 - typed_lines は bead の id を受け、頭の字（TYPED_LINES）の行を先に読み、頭の字の行でない行に bind_line を当てて裁定の行にする。呼び手の add_typed（台帳の読み）と outside（外の台帳の読み・行 c-g3-extern）が bead の id を渡す。節点の題は今と同じ title36（行）。TYPED_LINES の 3 要素と字は替えない。 - module の doc に 1 行。lib の歯 graph_typed_lines_cut_at_the_dot の呼びに bead の id の引数を足した（断言は替えない）。 - 字。歯の正しい行は q7-fx.4:20260928T0100Z-1 と q7-fx.4 と 2026-09-28T01:00:00Z と chat と、字 ADR-7 を発効する を二重引用符で囲んだ字を、空白と縦棒と空白でつないだ 1 行（土台は tests/fixtures/graph/unruled/ の台帳の q7-fx.4 の notes の 裁定 id = の行をこの行に替える）。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done の 2〜6 番目の項は verify の 3 行目（新しい歯の file crates/tsuzuri-core/tests/g3bl.rs の 5 本・項の順と歯の順は同じ）、7 番目の項は 4〜6 行目（着地済みの歯・在りかは build.rs の歯の区間と teeth1/g3g7.rs と teeth2/graph.rs）、最後の 8 番目の項は 7 行目で測る。verify の 1 行目と 2 行目は命令の rc で測る守り。 構造の連鎖（木 7f767bd2 で grep）。typed_lines の呼び手は add_typed と outside と lib の歯の 3 か所で、全部に bead の id を渡した。in_ruling_grammar は pub の関数のまま読むだけ。 実の記録での測り。写しの tz で、器の repo を外の台帳として渡した tz graph --check（--project）は違反 0 で、不変条件の 3 番は合格（残りは 7 番の文法の外の id の裁定 56 と 9 番の機構なしの まだ分からない）。係 w145a の写しの測り（g3sim.py）でも 240 から 0。 入口の赤。main 0ee9c0da には歯の file g3bl.rs が無いので verify の 3 行目は --no-tests=fail で落ちる。 試作と噛み。書く file は write-set の中で閉じる（2 file）。木 7f767bd2 で verify の 1〜6 行目が rc 0。噛みは 9 つの変異（器の形の行を読まない〔歯 2 本で〕・欄の数の下限を 4 に・文法を見ない・コロンの前と 2 つ目の欄を照らさない・2 つ目の欄と bead を照らさない・外の台帳の読みが bead の id を渡さない・種類を受けに・頭の字の行が区切りを含むと読まない）が全部 rc 100 で落ち、対照は rc 0。 範囲の外。器の結びの口の書きの形。台帳の notes への書き足し（係 w145a の案 N）。不変条件の 7 番の文法の外の id の裁定。"

[[contract]]
id = "c-commit-node"
title = "導出グラフに着地の commit の節点（種類 commit）と commit → 契約 bead の辺（型 landed）を、器の event log の RunDone の札 sha の 40 字から git を読まずに組み、着地の commit の無い着地した契約を名指す床の値を中核に置く（判断の記録 ADR-46 の決定 (2)・ADR-45 の門 H4・ADR-47 の決定 (2)・差の file）"
req = ["FR2"]
section = "5"
write-set = ["crates/tsuzuri-contract/src/graph.rs", "crates/tsuzuri-contract/tests/snapshots/graph.json", "crates/tsuzuri-contract/tests/teeth1/cform_graph.rs", "crates/tsuzuri-core/src/graph/build.rs", "crates/tsuzuri-core/src/graph/check.rs", "crates/tsuzuri-core/src/graph/mod.rs", "+crates/tsuzuri-core/tests/cmtnode.rs", "crates/tsuzuri-core/tests/teeth1/dnedge.rs", "crates/tsuzuri-core/tests/teeth2/graph.rs", "crates/tsuzuri-surface/src/mapview/band.rs", "crates/tsuzuri-surface/src/mapview/graph.rs", "crates/tsuzuri-surface/tests/teeth4/mapgraph.rs", "crates/tsuzuri-surface/tests/teeth4/mapview.rs", "crates/tsuzuri-surface/vocab.json"]
verify = ["git apply --reverse --check docs/design/patch/c-commit-node.patch", "cargo clippy -p tsuzuri-contract -p tsuzuri-core -p tsuzuri-surface -p tsuzuri-boundary --all-targets --no-deps -- -D warnings", "cargo clippy -p tsuzuri-surface --target wasm32-unknown-unknown --no-deps -- -D warnings", "cargo nextest run -p tsuzuri-core --test cmtnode --no-tests=fail cmtnode_", "cargo nextest run -p tsuzuri-contract --test teeth1 --no-tests=fail contract_form_graph_", "cargo nextest run -p tsuzuri-core --test teeth1 --no-tests=fail dnedge_", "cargo nextest run -p tsuzuri-core --test teeth2 --no-tests=fail graph_", "cargo nextest run -p tsuzuri-surface --test teeth4 --no-tests=fail mapgraph_", "cargo nextest run -p tsuzuri-surface --test teeth4 --no-tests=fail mapview_", "cargo run -q -p xtask -- check"]
size = "M"
done = "(1) 差の file docs/design/patch/c-commit-node.patch の hunk が全部木に在る（verify の 1 行目） (2) 節点の種類の閉じた列は 21 で末が Commit（電文の字 commit）、辺の型の閉じた列は 33 で末が Landed（電文の字 landed）、Commit の出所は走行の記録で、走行の記録の種類は Run と Commit の 2 つ、札の頭と字数と題の字数の定数は字 sha と半角のコロン・40・8（歯 cmtnode_closed_lists_end_with_commit_and_landed） (3) 走行の RunDone の detail の札の 40 字の小文字の 16 進から commit の節点を 1 つ組み、id はその 40 字・題は頭の 8 字・更新の時刻は RunDone の ts で、file と要約値と行と平易文と英語の欄を持たず、commit からその走行の契約 bead へ landed の辺を 1 本組み、札 main の名は節点にしない（歯 cmtnode_run_done_sha_makes_commit_and_landed） (4) 札の名が 39 字・41 字・大文字・16 進でない字を含む・札が main だけ・RunDone でない event・RunCreated の無い走行の 7 つの見本は、どれも commit の節点も landed の辺も組まず読めない出所も立てず、札を探す関数は空白とカンマで切った切れの札を読み札 main と 39 字は読まない（歯 cmtnode_only_full_lower_hex_sha_of_run_done_counts） (5) 同じ名の札は event log の順で名ごとに節点 1 つで、landed の辺は名と bead の組ごとに 1 本（歯 cmtnode_same_sha_is_one_node_and_one_edge_per_bead） (6) run id の前半が bead でない走行の札は節点を組み辺を組まない（歯 cmtnode_run_without_bead_front_has_node_but_no_edge） (7) event log が読めない時は commit の種類が まだ分からない の種類に入り節点は 0（歯 cmtnode_unread_events_make_commit_unknown） (8) commit の節点が在っても不変条件の 1 番と 10 番は合格（歯 cmtnode_invariants_hold_with_commits） (9) 床の値 unlanded_contracts は、閉じた理由が landed か着地で始まる種類 task の bead のうち commit の節点から landed の辺を受けない bead の id を字の順に並べ、取り下げで閉じた契約・open の契約・memo は数えず、札の無い RunDone の走行の契約は数える（歯 cmtnode_unlanded_names_landed_contracts_without_commit） (10) 床の値は、走行の記録か台帳が読めない時と台帳の字が JSON の配列でない時は まだ分からない（歯 cmtnode_unlanded_unknown_when_unread） (11) 契約の型の snapshot と往復と閉じた一覧の歯（contract_form_graph_ の 3 本）・辺の型の数の歯（dnedge_ の 4 本）・読めない出所の種類の歯（graph_ の 11 本）・面の線の形と凡例と種類の表の歯（mapgraph_ と mapview_）が通る（verify の 5〜9 行目） (12) cargo run -q -p xtask -- check が rc 0（最後の verify の行・歯の全部）"
depends = ["c-g3-bindline"]
goal = "在りか。差の file docs/design/patch/c-commit-node.patch は、行 c-g3-bindline を当てた木 7f767bd2 と、その上に試作を載せた木 905d1179（写し drafts/w146a の branch rows3）との差（14 file・+437 −24・33,808 byte）。行 c-g3-bindline と同じ file（中核の build.rs）を書き、差はその足しの上で切ったので c-g3-bindline の後（depends）。 なぜ。判断の記録 ADR-46 の決定 (2)（節点に着地の commit を足し、辺 commit → bead を組む）と ADR-45 の門 H4。導出グラフは commit の節点を持たず、閉じた契約が着地の commit に結ぶかを測れない。器の event log の走行の終わり（RunDone）の detail は、着地した便では札 sha と半角のコロンの後ろに着地の squash の commit の名（40 字）を、札 main と半角のコロンの後ろに着地の後の main の先の名を持つ。この札から組めば git を読まずに済む（ADR-46 の決定 (5)・正本は器の event log）。名の形は ADR-47 の決定 (2)。 実の記録での測り（席の台帳と器の event log・2026-10-05・係 w146a）。commit の節点 421・辺 landed 421。床の値（着地の commit の無い着地した契約）は 0。閉じた理由を問わずに数えると 4（取り下げで閉じ中身を別の便の commit に載せた契約 1・設計の行を指さない閉じた task 3）で、ADR-45 の門 H4 の「閉じた契約」の読みは持ち主への問い（席が起票した問い・その裁定の後に行 k-commit-count を置く）。 形。 - 契約の型（tsuzuri-contract の src/graph.rs）。節点の種類の閉じた列の末に Commit（電文の字 commit）を足して ALL を 21 個に、辺の型の閉じた列の末に Landed（電文の字 landed・着地の commit → 契約 bead）を足して ALL を 33 個にした。module の doc に 1 行。 - 中核の組み（tsuzuri-core の src/graph/build.rs）。定数 RUN_DONE（字 RunDone）・SHA_TAG（字 sha と半角のコロン）・SHA_LEN（40）・SHA_TITLE（8）と、関数 landed_sha（detail をカンマと空白で切り、頭が札の切れの残りがちょうど 40 字の 0〜9 と a〜f の時だけ返す）。add_runs の末で add_commits を呼ぶ。add_commits は event log の行のうち種類が RunDone で、札の名が在り、走行の節点が在る行について、名ごとに 1 度 commit の節点（id は名・題は頭の 8 字・更新の時刻は行の ts・file と要約値と行と平易文と英語は持たない）を足し、走行の契約 bead（run id の前半・関数 run_bead）が在れば、名と bead の組ごとに 1 度 landed の辺を足す。 - 出所（src/graph/mod.rs）。走行の記録の種類を Run と Commit の 2 つにした（event log が読めない周は commit も まだ分からない）。 - 床の値（src/graph/check.rs）。関数 unlanded_contracts（グラフと台帳の字）は、台帳か走行の記録が読めない周と台帳の字が読めない周は まだ分からない。読めた周は、台帳の bead のうち閉じた理由が着地の述語（今の関数 landed・頭が landed か着地で、続きが無いか空白か全角の括弧）に当たり、グラフの種類が task で、commit の節点からの landed の辺を受けない bead の id を、字の順に並べる。tz graph --check に出すのは行 k-commit-count。 - 面（tsuzuri-surface）。種類の表 src/mapview/band.rs の KINDS に Commit（帯 pipeline・語 k:commit）を足して 21 行、線の形 src/mapview/graph.rs の line_style で Landed を点線（RunOf と RanBy と同じ組）、語の辞書 vocab.json の english の節に k:commit と e:landed の 2 項を足した。 - 着地済みの歯の書き換え。contract の snapshot graph.json（種類の列に commit・型の列に landed）・cform_graph.rs（21 と 33）・core の teeth1/dnedge.rs（33）・teeth2/graph.rs（読めない走行の まだ分からない の種類が run と commit）・surface の teeth4/mapgraph.rs（点線の型に Landed・型の数 33・種類の数の字 21 個）・teeth4/mapview.rs（21 行と commit の行）。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done の 2〜10 番目の項は verify の 4 行目（新しい歯の file crates/tsuzuri-core/tests/cmtnode.rs の 9 本・項の順と歯の順は同じ）、11 番目の項は 5〜9 行目（着地済みの歯）、最後の 12 番目の項は 10 行目で測る。verify の 1 行目（差の hunk が全部木に在る）と 2・3 行目（clippy と wasm の clippy）は命令の rc で測る守り。 構造の連鎖（木 905d1179 で grep）。NodeKind::ALL と EdgeType::ALL の数を断言する歯は上の着地済みの歯の 6 file で全部を直した。GraphNode の構築は add_commits の 1 か所を足しただけ。Source::kinds の読み手は unknown_kinds の 1 か所。unlanded_contracts の呼び手はこの行では歯だけ（境界の呼び手は行 k-commit-count）。書く src の file の最大は tsuzuri-core の graph/check.rs の 842 行（上限 1500）。 入口の赤。木 7f767bd2 には歯の file cmtnode.rs が無いので verify の 4 行目は --no-tests=fail で落ちる。着地済みの歯は main の src で撃つと閉じた一覧の数（20 と 32）で落ちる。 試作と噛み。写し drafts/w146a で書く file は write-set の中で閉じる（14 file）。木 905d1179 で verify の 1〜10 行目が全部 rc 0（xtask check は歯 3290 本が全部通り・入れ子の器は差が触れないので省いた）。噛みは 1 つずつ変異を当てて名指しの歯を --test 1 本の範囲で撃ち、16 の変異が全部 rc 100 で落ちた（電文の字を替える・landed の辺を足さない・大文字の 16 進を許す・40 字以上を許す・種類 RunDone を見ない・走行の節点の有無を見ない・同じ名の節点を重ねる・更新の時刻を持たない・出所の種類から commit を外す・床の値が着地の述語を見ない・種類 task を見ない・走行の記録の読めなさを見ない・辺の元を走行で数える・種類の表の帯を beads に・landed を実線に・語の辞書の e:landed を外す）。対照（書き戻した後の同じ撃ち）は rc 0。 範囲の外。tz graph --check の行（行 k-commit-count）。file と定義と歯の節点（ADR-44 の段 4）。git の記録から commit を読むこと（ADR-46 の決定 (5)）。器の event log の札の形の変更（器の finish の書き手は替えない）。"

[[contract]]
