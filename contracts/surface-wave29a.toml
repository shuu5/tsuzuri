goal = "在りか。差の file docs/design/patch/v-scope-empty.patch は、木 08aca306（main 0e3102a0 に 29a の器の行 5 本 v-notes-head・v-accept-ptr・v-drafts-env・v-closed-runs・v-red-close の差の file をこの順に当てた木）に試作の commit を載せた木 45654e4a（写し drafts/w156a の branch w156a）との差（5 file・21,057 byte・+256 −4）。差は main 0e3102a0 の素の木にも、5 本の差の前にも後にも当たる（5 本の書く file と交差しない）。後の main 273fb394（行 v-review-dedup の適用と v-notes-head の着地の後）にも、残りの差 5 本（v-accept-ptr・v-drafts-env・v-closed-runs・v-red-close・v-review-dedup）の前にも後にも当たる。depends は無い（29a のどの行とも write-set が file の名で交差しない）。 なぜ。判断の記録 ADR-45 の門 H6（便の一生の閉じ）。10-04T18:36Z に、host の user の systemd に器の scope 41 本が active のまま残っていた（10-03T22:21Z〜10-04T18:32Z の作り・全部 TasksCurrent 0・MemoryCurrent 0・MemoryPeak 0・cgroup の populated 0・CollectMode は inactive-or-failed・作り手の pid は全部死んでいる・係 w154a の読むだけの測り）。席は 10-04 に 38 本を手で止めたが、10-04T19:23Z にまた 4 本が残っていた（同じ形・17:41Z〜18:57Z の作り・10-03T22:21Z からの約 21 時間で 42 本＝1 時間に約 2 本）。名は全部 器の名-s2-kill-<時刻>-common-2-<pid>-2 で、場所の s2-kill-<時刻> は器の e2e の歯（pipe/spawn/question.rs の pipe_resume_kill_at_implemented_resumes_to_landed_in_new_process と pipe_resume_kill_dead_owner_lock_does_not_block_resume）が bead s2-kill で起こす便 id、段 common と番号 2 は gate の共通 verify の 1 行目（record の 2 番・toy の git rev-parse --verify）、pid は歯が process group ごと SIGKILL した pipe run、末尾の 2 はその process の 3 つ目の unit 名。歯は Implemented の記帳を見た直後に group を殺すので、gate の囲いの systemd-run --scope の起動の途中が当たる。器の合流（10-03）の後は tsuzuri の xtask の check の入れ子の段が器の e2e をこの host で撃ち、便の gate・終わりの門・列の候補・着地の確かめと係の確かめのどれでも残る。本番の便も driver が囲いの起動の途中で殺されれば同じ形で残る。 残る理由。--collect は終わった unit を畳む旗で、active のままの unit には効かない。空になった scope を systemd が止めない形は systemd の既知の形（cgroup が空になった知らせが届かない scope が空のまま active に残る）で、作り手が死んだ後は器の誰も片付けない。止める口 pipe stop の片付け（作り手の死んだ scope に kill と reset-failed）は空の scope の段を替えない: 10-04T12:40Z に pipe stop が 1 回撃たれた（RunStopped が在る）後も、その前に作られた空の scope は残っていた。 形。 - 新しい module の pipe/confine/empty.rs（confine.rs は幅 120 で数えて 1,499 行で上限 1,500 なので本体を置かない・confine.rs には pub mod empty の 1 行だけ）。選びは、止める口の選び reap_ta