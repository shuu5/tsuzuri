title = "契約表の欄の写し contracts/field-schema/schema.toml を器の今の版（欄 done-teeth と code-facts を足した 20 欄）に揃え、設計ノートの行がその 2 欄を書けて tz check が受け tz derive が契約表へ写すことを歯 dtcol_ で測る（判断の記録 ADR-45 の門 H1・teeth-check の前の 1 歩・差の file）"
