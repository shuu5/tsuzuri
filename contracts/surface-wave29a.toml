pfs_of は mount の表（/proc/self/mounts）の各行の 2 欄目（mount の点・8 進の escape の 040 と 011 と 012 と 134 を解く）のうち、path の段ごとの前置きになる最も長い点を選び、3 欄目が tmpfs か ramfs なら点を返す。表を読めない周は 1 行（/dev/shm の tmpfs）で読む。表は env の行き先が在る周だけ 1 回読む。 - decide: 写しの segment も env の行き先も 0 の周は今のとおり席を解かずに通す。席を解いた後、写しの断りが先・env の行き先は command の中の順に最初の断り。席を解けない周は env の 行き先の segment も seat-unresolved で断る（fail-closed・今と同じ）。 - 断りの 1 行: 頭は <NAME>: deny drafts reason=<語> via=<名> to=<path か -> で、経路は 3 つ。組みの置き場の外・相対・解けない値は「組みの置き場は起草の置き場 <置き場> の直下の写しの中の掃除の名の dir（例 <置き場>/<名>/target）を字のままの絶対 path で書く（器の掃除が消すのはその形だけで、ほかの置き場は誰も消さず disk を満たす・ADR-0096・ADR-0101）」。TMPDIR の相対と解けない値は「TMPDIR は字のままの絶対 path で書く（~ と、同じ command で決めていない変数は門が解かない）」。tmpfs は「RAM の上の置き場（tmpfs の <点>）に組みと一時の file を置かない（tmpfs の頁は書いた席の memory に数えられ、上限を越えると席ごと落ちる）— disk の上の置き場に置く」。 - TMPDIR は起草の置き場の外を断らない。器の e2e は TMPDIR を repo の外の短い path に置かないと歯が落ち（写しの中は repo の中・長い path は tmux の socket の上限）、TMPDIR の害の実例は tmpfs の 1 度だけだから。 - drafts_guard.rs の module の doc に env の行き先を足す（hook/mod.rs は替えない・記録の語は drafts-deny と理由の語のまま）。e2e の hook/guards.rs に歯 1 本。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done の 1 番目の項は verify の 1 行目（差の hunk が全部木に在る）、2〜4 番目の項は 3 行目（器の lib の歯 vdrenv_ の 3 本・在りかは hook/drafts_guard.rs の歯の区間）、5 番目の項は 4 行目（器の e2e の歯 vdrenv_ の 1 本・在りかは e2e の hook/guards.rs）、最後の 6 番目の項は 5 行目（着地済みの器の e2e の歯 hook_drafts_place_ の 1 本・同じ file）で測る。verify の 2 行目（器の clippy）と 6 行目（xtask の check）は done の項に載せない守り（歯の名で測る項でないので、審査の対応の表で歯の無い項になる・第 0.6 版の便の契約の審査）。欄 done-teeth は書かない（入れ子の器の歯は器が選ぶ行を解けないので、書くなら項ごとに撃つ verify の行の番号になる。その形では、審査役が done の項の字が名指す歯の名を対応の表に書き、器がそれを宣言の歯の外の項目に数えて審査を INCONCLUSIVE に倒す・第 0.5 版の行 v-notes-head の便 t3-hub.80.19-20261004T182144Z の契約の審査）。 構造の連鎖（木 0ee9c0da で grep）。drafts_guard::decide の呼び手は hook/mod.rs の pre_tool_use の 1 か所。copy_places の呼び手は decide と live_row の歯の 1 か所。literal と normalized と moved は live_row の中だけで使われ、見える範囲を広げるだけ。NAMES の読み手は掃除の 1 か所で、見える範囲を広げるだけ。Reason の語を数える読み手は記録の what の 1 か所（字 drafts-deny と語）。席の会話の記録で 10-03 以後に断りになる撃ちは 13 件（席の管理の組みの置き場 7・解けない値 4・ほか 2・係 w148a の実測）で、席は着地の前に管理の組みの置き場を起草の置き場の子の target へ移す。器の file の行の上限: 幅 120 で数えて drafts_guard.rs は 221 行から 579 行・pipe/mod.rs は 1377 行のまま（余地 123 で growth 1）。 入口の赤。lib の歯は src の drafts_guard.rs の歯の区間に在るので、前の行 v-accept-ptr の木では verify の 3 行目の filter に当たる歯が 0 本で rc 4（--no-tests=fail）。e2e の歯の file hook/guards.rs だけを試作の字にした前の行の木で、verify の 4 行目が rc 100（e2e の一時 dir の下の target を通し、断りの rc 2 の断言で落ちる）。 試作と噛み。写し drafts/w152a で書く file は write-set の中で閉じる。verify の 2 行目から最後の前の行までは rc 0（器の clippy・器の lib の歯 vdrenv_ の 3 本・器の e2e の歯 vdrenv_ の 1 本と着地済みの hook_drafts_place_ の 1 本）。根の xtask の check は rc 0（3 行を全部当てた木 2cb62054〔main 0ee9c0da の上〕で根の歯 3281 本・入れ子の器の歯 4089 本・器の clippy・器の xtask check まで。main 21cb093d に積み直した木 065b9ce3 で入れ子の 4 段〔build・歯 4092 本・clippy・器の xtask check〕も rc 0）。噛みは句ごとに 1 つの変異を当てた木で名指しの歯を 1 本の範囲で撃ち、13 の句（掃除の名の段・子より下・相対を断る・段の前置き・最も長い点・8 進の escape・宣言の語・--target-dir・PWD を解く・前置きは残らない・TMPDIR は置き場を問わない・写しの無い周も読む・tmpfs を断る）に 14 の変異を当てて全部 rc 100。書き戻した後の対照は rc 0。 範囲の外。script の file の中の割り当てと Write の道具の path（門は Bash の command の字だけを読む）・npm と pip の cache の置き場・掃除が .git を持たない子を見ない穴（次の歩）・組みの置き場の名の列を言語の表へ移すこと（判断の記録 ADR-44 の決定 (4)）・器の設計文書の書き換え。"

