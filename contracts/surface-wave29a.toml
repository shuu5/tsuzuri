goal = "在りか。差の file docs/design/patch/v-red-close.patch は、行 v-closed-runs の試作の木 b91c8841 に試作の commit 2 つを載せた木 d2b9ffe9（写し drafts/w153a の branch w153a）との差（6 file・35,950 byte・+337 −30）。差は main 21cb093d と木 903e722e（前の 3 行を当てた木）にもそのまま当たり、行 v-closed-runs を当てない木（903e722e に差だけを当てた木 67295ae7・branch w153a-rc-alone）でも器の clippy と入れ子の器の歯 4096 本が rc 0。write-set はノート 29a のどの行とも交差しないので depends は持たない（file の名で測った）。器を書く便は同時に 1 本までなので、席は行 v-closed-runs の便と並べて起こさない（hold と release の手で順を守る）。 なぜ。判断の記録 ADR-45 の門 H6 は、main を赤にした便の squash を閉じる口を求める。着地の口は main を進めた後の主実測が赤でも巻き戻さず Failed main-red を残す。その squash は後の便の push で remote に載り、先端の CI が success でも、その便の契約を着地の形で閉じる器の口が無い（終端だけの撃ち直しの前提の段は Landed だけ・pipe/cli/step.rs）。tsuzuri では 10-02 に 1 回起き（t3-hub.52.180・squash は今の remote の main の祖先に在る）、席は取り下げの形で閉じた。台帳は着地した契約を取り下げと記し、着地の記録にも載らない。同じ道の裏返しに、列の先頭が着地させた便の driver が番待ちの後の 1 回の読みを過ぎてから主実測を撃ち直し、Landed の後に Failed main-red を記帳した件が在る（器の memo t3-hub.74.49.3・tsuzuri の event logでは 0 件）。どちらも便の終わりの段が 1 つに定まらない穴で、直す file も重なる（land.rs と land/finish.rs）。 形。 - 記帳の口: fleet/store.rs の条件付きの追記の条件 NotStopped（emit と regate が段の記帳に使う 1 本）の判じに、追記する event の段を渡し、最後の段が Landed の便に段が Landed でない event を足す周を新しい断り StoreError の Landed で断る（Stopped の後の断りの隣・lock の中の判じ）。Landed の後の正しい記帳（終端の push と ci と close の RunDone と retire の RunStage）は段が Landed なので通る。pipe/mod.rs の emit は替えない。tsuzuri の event log の便 623 本にこの条件で断られる過去の記帳は 0 件。 - 着地の口: land.rs の試行は、追随で main が替わっていないことを確かめた後、squash の前に settled_in_train で段を読み直し、終端なら Settled で返る（番待ちの直後の読みと同じ道・Landed なら already-landed の行）。 - 終端だけの撃ち直し: cli/step.rs の terminal_only は前提の段に Failed を足し、Failed の便を新しい adopt へ渡す。adopt は最後の Failed の RunStage（detail が字 retired の retire の記帳を除く）の detail が main-red か main-unmeasured の周だけ受け、宣言の remote の main の先端を retire.rs の read_tip（ls-remote と fetch と object の確かめ）で読み、先端の祖先から本文に run の行を持つ squash を landed_squash_of（今の 1 本）で探す。在れば段 Landed の RunDone（detail は sha:squash main:先端 adopted）を 1 件積み、終端を新しい PushTip の値 Adopted で撃つ。受けない周は stdout の 1 行 run=便 id adopt=語（not-red・no-remote・not-on-remote）と rc 1 で何も書かない。event log と宣言と remote を読めない周は rc 2。Landed の便の今の道は settle に移して字を替えない（撃ち直しの行に受け入れの周だけ adopted=squash が入る）。 - 終端: land/finish.rs の terminal は、PushTip の Adopted の周に push を撃たず、先端が squash を祖先に持つかを今の Behind と同じ照らしで確かめ、CI を先端で照合し、閉じの理由を今の Behind と同じ landed squash ci=success tip=先端 の形にする。CI が success でない周は今の終端の語で止まり bead は開いたまま（Landed の記帳は残り、次の撃ち直しは Landed の今の道になる）。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done の 1 番目の項は verify の 1 行目（差の hunk が全部木に在る）、2 番目の項は 3 行目（器の lib の歯 vredc_ の 1 本・在りかは fleet/store.rs の歯の区間）、3〜5 番目の項は 4 行目（器の e2e の歯 vredc_ の 3 本・在りかは e2e の pipe/land/redclose.rs）、6 番目の項は 5 行目（着地済みの器の lib の歯 pipe_stop_driver_append_if_ の 1 本・同じ store.rs）、7 番目の項は 6 行目（着地済みの器の e2e の歯 pipe_land_already_landed_ の 3 本・在りかは e2e の pipe/land.rs）、最後の 8 番目の項は 7 行目（着地済みの器の e2e の歯 pipe_replay_ の 5 本・在りかは e2e の pipe/land/order.rs で、書かない file なので write-set に置き場だけの = で置く）で測る。verify の 2 行目（器の clippy）と最後の行（xtask の check）は done の項に載せない守り（歯の名で測る項でないので、審査の対応の表で歯の無い項になる・29a の第 0.6 版の便の契約の審査）。欄 done-teeth は書かない（29a の第 0.7 版の 3 行と同じ形）。 構造の連鎖（木 b91c8841 で grep）。append_if に条件 NotStopped を渡すのは pipe/mod.rs の emit（段の記帳の全部）と pipe/regate.rs の regate の記帳の 2 か所で、条件の判じの足しは呼び手を替えない（Landed の便の regate も断られる）。StoreError を match する読み手（hook/utterance.rs と fleet/lifecycle_line.rs）は残りの腕を持ち、網羅の match は無い。settled_in_train の呼び手は await_turn の後の 1 か所に試行の 1 か所が足される。PushTip を match する所は finish.rs の terminal の 3 か所で、全部に Adopted の腕を足した。terminal の呼び手は着地の列の終端と step.rs の settle の 2 か所。read_tip と RemoteTip は pipe の中に見える範囲のまま使う。器の file の行の上限は幅 120 で数えて fleet/store.rs が 1394 行から 1433 行（余地 106・growth 40）・pipe/land.rs が 1410 行から 1415 行（余地 90・growth 6）・pipe/land/finish.rs が 695 行から 704 行・pipe/cli/step.rs が 459 行から 543 行。 入口の赤。lib の歯は src の fleet/store.rs の歯の区間に在るので、木 b91c8841 では verify の 3 行目の filter に当たる歯が 0 本で rc 4（--no-tests=fail）。e2e の歯の file だけを試作の字にした木 b91c8841（src は前の木の字）で、verify の 4 行目が rc 100（3 本とも落ちる）。 試作と噛み。写し drafts/w153a で書く file は write-set の中で閉じる。verify の 2 行目から最後の前の行までは rc 0（器の clippy・器の lib の歯 vredc_ の 1 本と着地済みの pipe_stop_driver_append_if_ の 1 本・器の e2e の歯 vredc_ の 3 本と着地済みの pipe_land_already_landed_ の 3 本と pipe_replay_ の 5 本）。入れ子の器の歯は 2 行を当てた木で 4103 本が全部緑。根の xtask の check は木 d2b9ffe9 で rc 0。噛みは句ごとに 1 つの変異を当てた木で名指しの歯を 1 本の範囲で撃ち、12 の句（Landed の後の Landed でない段を断る・Landed の記帳は通す・段なしの記帳も断る・squash の前に段を読み直す・Failed を受ける・retire の記帳を読み飛ばす・push を撃たない・受け入れの印で積む・先端の CI の照合を名指す・remote の main の祖先を見る・main-red か main-unmeasured だけ・remote の無い repo は断る）に 12 の変異を当てて全部 rc 100。書き戻した後の対照は rc 0（vredc_ の lib と e2e・pipe_stop_driver_append_if_・pipe_land_already_landed_・pipe_replay_）。 範囲の外。後の便の着地の終端が、自分の push で載った main-red の squash を見つけて閉じること（memo の候補 2）。席の閉じの頭の集合を替えること（memo の候補 3）。remote を宣言しない repo の main-red を閉じる形（照らす CI が無いので no-remote で断る）。既に取り下げで閉じた bead の便（t3-hub.52.180）を受け入れ直すこと（台帳の閉じは今の close の答えのまま）。器の設計文書 contract-source.md の書き換え。 ほかの project で。宣言の remote と ci-cmd と台帳の client だけを読み、tsuzuri の字を持たない。remote の無い repo では 5 番目の項の no-remote で断る。"

[[contract]]
id = "v-review-dedup"
title = "器の契約の審査の lens が、材料 design.txt の設計の節の本文が契約の goal と同じ字の周に、設計の節の穴へ goal を 2 度埋めず出所の 1 行と同じ字の 1 行を埋め、cap もその字で数える（判断の記録 ADR-44 の段 3・差の file）"
req = ["FR1049", "NFR1001"]
section = "14"
write-set = ["scribe2/crates/scribe2/src/headless/lens.rs", "scribe2/crates/scribe2-boundary/tests/e2e/headless/lens.rs"]
verify = ["git apply --reverse --check docs/design/patch/v-review-dedup.patch", "cargo clippy --manifest-path scribe2/Cargo.toml -p scribe2 -p scribe2-boundary --all-targets --no-deps -- -D warnings", "cargo nextest run --manifest-path scribe2/Cargo.toml -p scribe2 --lib --no-tests=fail vrdup_", "cargo nextest run --manifest-path scribe2/Cargo.toml -p scribe2-boundary --test e2e --no-tests=fail vrdup_", "cargo run -q -p xtask -- check"]
size = "S"
done = "(1) git apply --reverse --check docs/design/patch/v-review-dedup.patch が rc 0（差の file の hunk が全部木に在る・verify の 1 行目） (2) 契約の審査の prompt の設計の節の穴は、材料 design.txt の出所の 1 行の後ろが契約の goal と byte で同じ字で、その後ろが改行か材料の末の時、出所の 1 行と字 （本文は契約の goal と同じ字・上の契約の goal を節の本文として読む） の 1 行になり、goal の字は prompt に契約の goal の行の 1 度だけ載り、design.txt の中身は替わらない（歯 vrdup_same_goal_body_becomes_one_line_in_the_hole） (3) 本文の末に字を足す・頭に空白を足す・中に字を挿す・末に空白を足す・出所の行が無い（材料が goal と改行だけ）・goal と本文がどちらも空の 6 つの見本は、本文をそのまま穴に埋めて同じ字の 1 行を持たず、design.txt の中身は替わらない（歯 vrdup_body_off_by_one_clause_stays_whole） (4) goal の後ろの改行から後の行（予想の印の 2 行）は 1 字も替わらずに同じ字の 1 行の後ろに残り、goal の直後に改行の無い材料は本文のまま（歯 vrdup_note_lines_after_the_goal_stay） (5) cap の照合は 1 行にした節の byte で数え、契約と 1 行の節と要件の byte のちょうどの cap で prompt を組み、1 byte 少ない cap では INCONCLUSIVE の字 contract material exceeds cap を返し、空いた byte は外の材料に回る（同じ cap で goal を渡す周は外の材料の塊が 2 つとも全部入り、渡さない周は全部は入らない）（歯 vrdup_cap_counts_the_one_line_and_the_room_goes_to_outside） (6) 器の binary の lens は契約 file の goal を prompt の組みに渡し、design.txt の本文が契約 file の goal と同じ字の周は claude に渡す prompt が出所の 1 行と同じ字の 1 行を持って goal の字を 1 度だけ持ち、本文が違う周は本文のままで、どちらの周も design.txt の中身は替わらない（器の e2e の歯 vrdup_lens_child_puts_one_line_for_the_same_goal）"
goal = "在りか。差の file docs/design/patch/v-review-dedup.patch は、main 58de8850 に試作の commit を載せた木 abaab2d7（写し drafts/w155a の branch w155a）との差（2 file・16,493 byte・+138 −6）。試作は main 14739c69 の上で作って 58de8850 へ積み直した（scribe2/ の下は同じ字で、差は byte で同じ・main 0e3102a0 も scribe2/ の下は同じ字）。ノート 29a のほかの器の行（v-notes-head・v-accept-ptr・v-drafts-env・v-closed-runs・v-red-close）の差の file の書く file と重ならない。 なぜ。判断の記録 ADR-44 の段 3（AI に届ける）の前の 1 歩（係 w150a の調べの要約 2 と 9・4 節の表の 1 行目）。器の契約の審査（受付の直後の段 Reviewed）は、雛形 lens-contract.txt の穴 contract に契約の goal を、穴 design に材料 design.txt（出所の 1 行と設計の節の本文）を埋める。tsuzuri の契約表は導出物の toml で、行の goal が節の本文の全部（器の設計 contract-source.md の 47 節の 6）なので、同じ字が prompt に 2 度載る。便の記録の 624 便（2026-10-05 の pipe の下・受付の審査の材料の全部）のうち 622 便で design.txt の本文が契約の goal と byte で同じで、2 度目の字は 1 便の中央値 9,235 byte・p90 23,483・最大 58,450（合計 7,598,137 byte）。審査の上限 gate.token_cap（150,000 byte）の中で core（契約・節・要件・約束の行・done の項目）がこの字を食い、その残りに収める base の要約と外の材料（write-set の外の名指しの塊）が削られる。今の器の lens では 194 便の外の材料が切り詰めか落としを受け、9 便が base の要約の段を落とした。 判定の材料は替わらない（同じ字を 2 度読ませないだけ）ので、持ち主に問わない席の決め（係 w150a の 5 節）。 形。 - lens.rs に定数 SAME_GOAL（字は （本文は契約の goal と同じ字・上の契約の goal を節の本文として読む））と関数 design_hole を足す。design_hole は材料を最初の改行で出所の 1 行と後ろに割り、後ろが契約の goal で始まりその直後が改行か材料の末なら、goal の字を SAME_GOAL の 1 行に替えた字を返す（出所の 1 行と、goal の後ろの改行から後は 1 字も替えない）。goal が空の周と違う周は材料のまま返す。 - prompt_of の引数の契約の本文を、本文と goal の組にする。契約の審査の腕は design_hole の字を contract_prompt に渡す（cap の照合も穴の字もこの字・contract_prompt は替えない）。diff の審査の腕は goal を使わない。 - dispatch は state の字と契約 file の goal（Contract の欄 goal）を渡す。 - 歯の区間の helper prompt_of は goal に空を渡す（着地済みの歯の字と断言は替えない）。module の doc に 1 段を足す。 - 雛形 lens-contract.txt は替えない。lens の版の 1 行（--print-version）は雛形の hash を持つので版の字も替わらず、行の審査の記録の使い回し（器の review_ref.rs）は前の判定をそのまま写す（判定の材料は替わらないので写してよい）。 - 比べの決め（実の材料で測った）。比べは byte で、前後の空白も改行も寄せない。624 便で、byte の比べ・前後の空白を剥がす比べ・空白の並びを 1 つに寄せる比べの 3 つとも同じ 622 便が同じ字になり、寄せて増える便は 0（寄せる理由が無く、寄せると違いを隠す側に倒れる）。goal の字は 624 便とも改行を持たない。同じでない 2 便: 1 つは md の契約表の行（docs/design/vessel-keys.md#v-field-schema・goal は行の title の 368 byte・節の本文は 11,048 byte）。もう 1 つは便 t3-hub.21-20260927T112128Z（行 contracts/surface-board.toml#g-gaps）で、受付の後に base の節に 1 文（204 byte・問いの頁の歯の file を write-set に入れる文）が足されて goal と違い、審査役がその違いを literal-mismatch の FAIL で捕まえた。違う周を本文のまま渡すのは、この違いが審査の材料だから。 - 後ろの行（予想の印）。行の審査（先撃ち）の材料は、節の本文の後ろに予想の印の行（未着地の祖先の行・予想の base の断り）を足す（器の review.rs の stage と review_ref.rs の note_of）。design_hole は goal の後ろの改行から後を替えずに残すので、先撃ちの材料でも本文だけが 1 行になる。受付の審査の便の材料は印を持たない（624 便で 0）。 - design.txt の file と中身は替えない。design.txt は先撃ちの材料の鍵（review_ref.rs の digest）・列外の鍵（dispatch の candidates.rs）・受付の焼き直しの物差し（intake.rs）が読み、要件 FR1049 は lens に渡した節の本文の写しを便の記録に残すと言う。替えるのは lens が claude に渡す prompt の字だけ。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done の 1 番目の項は verify の 1 行目（差の hunk が全部木に在る）、2〜5 番目の項は 3 行目（器の lib の歯 vrdup_ の 4 本・在りかは headless/lens.rs の歯の区間）、最後の 6 番目の項は 4 行目（器の e2e の歯 vrdup_ の 1 本・在りかは e2e の headless/lens.rs）で測る。verify の 2 行目（器の clippy）と 5 行目（xtask の check）は done の項に載せない守り（歯の名で測る項でないので、審査の対応の表で歯の無い項になる・29a 第 0.6 版の便の契約の審査）。欄 done-teeth は書かない（29a 第 0.6 版の決め・入れ子の器の歯は器が選ぶ行を解けない）。 構造の連鎖（木 58de8850 で grep）。prompt_of の呼び手は dispatch の 1 か所と歯の区間の helper の 1 か所（着地済みの歯 8 本はこの helper を通る）。contract_prompt の呼び手は prompt_of の 1 か所。Contract の欄 goal は pub。e2e の helper（contract_in・material_in・run_lens・fake_claude）と外形の snapshot lens_contract_prompt_external_form（節の本文が goal と違う fixture）は替えない。器の file の行の上限（1500・幅 120 で数える）: lens.rs は 幅 120 で数えて 1019 行から 1136 行（余地 364）。e2e の file は上限の外（数えるのは crates の src だけ）。 入口の赤。lib の歯は src の lens.rs の歯の区間に在るので、main の木では verify の 3 行目の filter に当たる歯が 0 本で rc 4（--no-tests=fail）。e2e の歯の file headless/lens.rs だけを試作の字にした main 14739c69 の木（写しの branch w155a-red・scribe2/ の下は 58de8850 と同じ字）で、verify の 4 行目は rc 100（goal の字が 2 度載り、同じ字の 1 行が無い）。 試作と噛み。写し drafts/w155a で書く file は write-set の中で閉じる（2 file）。verify の 2〜4 行目は rc 0（器の clippy・器の lib の歯 vrdup_same_goal_body_becomes_one_line_in_the_hole・vrdup_body_off_by_one_clause_stays_whole・vrdup_note_lines_after_the_goal_stay・vrdup_cap_counts_the_one_line_and_the_room_goes_to_outside の 4 本・器の e2e の歯 vrdup_lens_child_puts_one_line_for_the_same_goal の 1 本）。入れ子の 4 段（器の build・歯 4,086 本・clippy・器の xtask check）は xtask と同じ引数と置き場（target/nested/scribe2）と cwd（scribe2/）で、nextest を --no-fail-fast にして試作の木 d7817054 で rc 0（器の xtask check は ok の 1 行で file-lines=1499/1500・core-lines=83574/90000・test-src-ratio=44200/93983）。 根の xtask の check は main 58de8850 に積み直した最後の木 abaab2d7 で rc 0（根の歯 3,296 本・host と wasm の clippy・面の組み立て・入れ子の 4 段で器の歯 4,086 本）。 噛みは句ごとに 1 つの変異を当てた木で名指しの歯を 1 本の範囲で撃ち、12 の句（同じ字なら 1 行にする・出所の 1 行を残す・1 行の字・design.txt を替えない・頭の空白を寄せない・末の空白を寄せない・改行で切れる所だけ・goal が空なら外さない・出所の行の後ろだけを比べる・後ろの行を残す・cap は 1 行の字で数える・lens の子は契約の goal を渡す）に 17 の変異を当てて全部 rc 100（cap の句は歯の断言を締めた後の木 abaab2d7 で撃ち直して rc 100）。書き戻した後の対照は rc 0（変異と歯の表は係の bites.tsv）。 効きの見込み（624 便の受付の審査の材料に、今の器の lens（PATH の binary）と試作の lens を偽の claude で撃ち、claude に渡る prompt を測った・係の real-summary.txt）。core の byte は中央値 25,220 から 16,166・p90 55,461 から 31,699・最大 123,134 から 64,684 に減る。外の材料が切られない 429 便では prompt が中央値 8,205 byte・p90 22,681・最大 39,750（合計 4,621,706 byte）短くなる。切られている便では空いた byte に外の材料が入り、外の材料の切りが起きる便は 194 から 182（切りが無くなる便 12・新しく切られる便 0）、切り詰めの名は 822 から 747、落とした名は 22,818 から 21,626、base の要約の段を落とす便は 9 から 1 になる。外の材料は 1 便の中央値 75 KB・最大 977 KB（係 w150a）なので、空く 9 KB では多くの便の切りは残る（残りの収めは段 3 の近傍の行の話）。cap 越えの INCONCLUSIVE は前も後も 0。 範囲の外。runner の prompt（runner は契約の写しを受け、設計の節を別に受けない）。gate の審査役（diff の雛形は穴 design を持たない）。md の契約表の行（goal は行の title で本文と違う）。雛形の字の替え。材料の file design.txt の中身の替え。近傍の材料（段 3 の後の行・係 w150a の 4 節）。"

[[contract]]
id = "v-scope-empty"
title = "器 scribe2 の管理 tick の周が、作り手の process が死に中の task がちょうど 0 の器の scope（席の箱を除く）を systemctl の --user stop --no-block で止め、--collect が畳めない active のままの空の scope を残さない（中に process の在る scope と作り手の生きた scope は触らず kill を撃たない・判断の記録 ADR-45 の門 H6・ADR-44 の G3・差の file）"
req = ["NFR1006", "FR1027"]
section = "15"
write-set = ["+scribe2/crates/scribe2/src/pipe/confine/empty.rs", "scribe2/crates/scribe2/src/pipe/confine.rs", "scribe2/crates/scribe2/src/seat/tick.rs", "+scribe2/crates/scribe2-boundary/tests/e2e/seat/empty_scope.rs", "scribe2/crates/scribe2-boundary/tests/e2e/seat.rs"]
verify = ["git apply --reverse --check docs/design/patch/v-scope-empty.patch", "cargo clippy --manifest-path scribe2/Cargo.toml -p scribe2 -p scribe2-boundary --all-targets --no-deps -- -D warnings", "cargo nextest run --manifest-path scribe2/Cargo.toml -p scribe2 --lib --no-tests=fail vscpe_", "cargo nextest run --manifest-path scribe2/Cargo.toml -p scribe2-boundary --test e2e --no-tests=fail vscpe_", "cargo run -q -p xtask -- check"]
size = "M"
done = "(1) git apply --reverse --check docs/design/patch/v-scope-empty.patch が rc 0（差の file の hunk が全部木に在る・verify の 1 行目） (2) 器の lib の選びの関数は、systemctl の active な scope の一覧の行のうち、名が器の名と字 - で始まり、名から読む作り手の pid が生きた pid の集合に無く、名から読む段の語が字 seat でなく、systemctl の show の TasksCurrent の答えが rc 0 で前後の空白を除いた字がちょうど 0 の unit だけを字 .scope を剥がした名で返し、正しい見本から 1 句ずつ外した unit、つまり作り手が生きた unit・段の語が seat の unit・答えが 2 の unit・答えが字 [not set] の unit・答えが空の unit・show が rc 1 の unit・show を起動できない unit・名が器の名で始まらない unit・名の pid の欄が数でない unit は返さず、show は名が器の名で始まり作り手が死に段の語が seat でない unit にだけ撃つ（歯 vscpe_picks_only_empty_scopes_of_dead_creators_outside_seats） (3) 登録 row の在る席の管理 tick の周は、偽の systemctl の一覧の 5 本（作り手が死に task 0・作り手が死に task 2・作り手が生きて task 0・段の語が seat で作り手が死に task 0・作り手が死に task が字 [not set]）に対し、一覧を 1 回、作り手が死に段の語が seat でない 3 本に show を 1 回ずつ、1 本目の unit の名に字 .scope を足した 1 語に --user stop --no-block を 1 回だけ撃ち、ほかの呼出（kill と reset-failed を含む）を撃たず、tick の rc と stdout と stderr は一覧が 0 行の対照と同じで、event log の byte は tick の前と同じ（器の e2e の歯 vscpe_tick_stops_only_the_empty_scope_of_a_dead_creator） (4) 正しい見本から 1 句ずつ外した周、つまり一覧の撃ちが rc 1 の周（偽が同じ 5 本の行を出す）は一覧の 1 回の後に show も stop も撃たず、tick の rc と stdout と stderr は対照と同じで、登録 row の無い target の周（event log は在る）は systemctl を 1 回も撃たない（器の e2e の歯 vscpe_tick_shoots_only_the_list_when_it_fails_and_nothing_without_a_row） (5) 着地済みの tick の歯の置き場 2 つ（e2e の seat.rs の tick_shims と move_shims が組む PATH・host の PATH を後ろに持つ）で撃つ登録 row の在る tick の周は rc 0 で、systemctl の呼出が偽の bin の systemctl に届き、その記録は一覧の 1 行だけ（器の e2e の歯 vscpe_tick_places_of_the_landed_teeth_answer_the_list_with_a_fake）"
