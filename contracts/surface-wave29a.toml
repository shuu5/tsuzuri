goal = "在りか。差の file docs/design/patch/v-drafts-env.patch は、main 21cb093d に試作の commit を載せた木 065b9ce3（写し drafts/w152a の branch w152a2）との差（5 file・30,771 byte・+397 −18・main 0ee9c0da の上で切った差と byte で同じ）。差は前の行 v-accept-ptr の差を当てた木の上で切った（器を書く便は同時に 1 本まで・判断の記録 ADR-33 の決定 (12)・depends の鎖）。 なぜ。判断の記録 ADR-44 の決定 (3)・束 B08（係 w143a の仕分けの 5 番）。器の掃除（器の判断の記録 ADR-1096 と ADR-1101）が消すのは、席の起草の置き場の直下の写し（.git を持つ子）の中の掃除の名の dir だけで、置き場の外の組みの置き場は誰も消さない。席の係が組みの置き場を置き場の外に置いて disk を 100% にし（約 620 GB）、係に tmpfs の上で組ませて席の scope が OOM で落ちた（tmpfs の頁は書いた process の cgroup に数わる）。席の会話の記録では、置き場の外の組みの置き場の撃ちが 10-01 に 180・10-02 に 137 あった（係 w148a の実測）。器の席の起草の写しの門（vessel-hook §25）は git の写しの行き先だけを読む。この行は同じ門に組みの置き場と TMPDIR の行き先を読ませる。器の設計文書 vessel-hook.md §25 は凍ったまま（判断の記録 ADR-36 の決定 (7)）で、この節が新しい振る舞いを書く。 §25 の門は、写しの行き先に続けて env の行き先を読む。 形。 - 読み: drafts_guard.rs に env_places と value_of と tmpfs_of と judged_env を足す。名の閉じた列は 2 つで、組みの置き場の名（CARGO_TARGET_DIR・CARGO_BUILD_TARGET_DIR・PYTHONPYCACHEPREFIX・器が対応する言語の、組みの産物を木の外へ向ける環境変数・TypeScript は該当なし）と TMPDIR。拾う所は walked の segment ごとに、頭の割り当ての並び・export と declare と typeset と readonly と local の後ろの割り当て・env の後ろの割り当て（flag を飛ばし最初の非割り当ての語まで・宣言の語の割り当ては後ろの segment へ残り env の割り当ては残らない・command の前置きの割り当てはその segment だけで効く）と、頭の語が cargo の segment の --target-dir の値（次の語か = の後ろ・-- より前）。空の値の割り当ては拾わない。 - 値: live_row の literal と normalized と moved（cd と pushd の作業 dir の替え）を pub(crate) にして使う。字のままの絶対 path は畳んだ path。頭が $NAME か波括弧で囲んだ NAME で、NAME が PWD なら segment の作業 dir（解けない周は解けない）、同じ command の前で字のまま決めた変数（割り当てだけの segment・export の割り当て・同じ segment の前の割り当て）ならその値に替え、残りが字のままなら path。~ と、ほかの変数・逆引用符・波括弧・glob は解けない。頭が / でない字は相対。器は環境変数を読まない（憲法 C2.2）ので ~ と HOME を解かない。 - 判定: Reason に Relative（語 relative）と Tmpfs（語 tmpfs）を末に足す（閉じた 5 つ）。解けない値は unresolved、相対は relative、mount の表で tmpfs の上は tmpfs。TMPDIR はそれ以外を通す。組みの置き場は real で解いた path が起草の置き場の下で、置き場からの段が 2 つ以上あり、2 段目から下のどれかの段の名が掃除の名の列（pipe/sweep.rs の NAMES を pub(crate) にし、pipe/mod.rs の mod sweep を pub(crate) mod にして読む・掃除と門が同じ列を読む）に在れば通し、そうでなければ outside（掃除が見ない所）。 - tmpfs: tmpfs_of は mount の表（/proc/self/mounts）の各行の 2 欄目（mount の点・8 進の escape の 040 と 011 と 012 と 134 を解く）のうち、path の段ごとの前置きになる最も長い点を選び、3 欄目が tmpfs か ramfs なら点を返す。表を読めない周は 1 行（/dev/shm の tmpfs）で読む。表は env の行き先が在る周だけ 1 回読む。 - decide: 写しの segment も env の行き先も 0 の周は今のとおり席を解かずに通す。席を解いた後、写しの断りが先・env の行き先は command の中の順に最初の断り。席を解けない周は env の 行き先の segment も seat-unresolved で断る（fail-closed・今と同じ）。 - 断りの 1 行: 頭は <NAME>: deny drafts reason=<語> via=<名> to=<path か -> で、経路は 3 つ。組みの置き場の外・相対・解けない値は「組みの置き場は起草の置き場 <置き場> の直下の写しの中の掃除の名の dir（例 <置き場>/<名>/target）を字のままの絶対 path で書く（器の掃除が消すのはその形だけで、ほかの置き場は誰も消さず disk を満たす・ADR-0096・ADR-0101）」。TMPDIR の相対と解けない値は「TMPDIR は字のままの絶対 path で書く（~ と、同じ command で決めていない変数は門が解かない）」。tmpfs は「RAM の上の置き場（tmpfs の <点>）に組みと一時の file を置かない（tmpfs の頁は書いた席の memory に数えられ、上限を越えると席ごと落ちる）— disk の上の置き場に置く」。 - TMPDIR は起草の置き場の外を断らない。器の e2e は TMPDIR を repo の外の短い path に置かないと歯が落ち（写しの中は repo の中・長い path は tmux の socket の上限）、TMPDIR の害の実例は tmpfs の 1 度だけだから。 - drafts_guard.rs の module の doc に env の行き先を足す（hook/mod.rs は替えない・記録の語は drafts-deny と理由の語のまま）。e2e の hook/guards.rs に歯 1 本。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done の 1 番目の項は verify の 1 行目（差の hunk が全部木に在る）、2 番目の項は 2 行目（器の clippy）、3〜5 番目の項は 3 行目（器の lib の歯 vdrenv_ の 3 本・在りかは hook/drafts_guard.rs の歯の区間）、6 番目の項は 4 行目（器の e2e の歯 vdrenv_ の 1 本・在りかは e2e の hook/guards.rs）、7 番目の項は 5 行目（着地済みの器の e2e の歯 hook_drafts_place_ の 1 本・同じ file）、最後の 8 番目の項は 6 行目で測る。欄 done-teeth は書かない（入れ子の器の歯は器が選ぶ行を解けないので、書くなら項ごとに撃つ verify の行の番号になる。その形では、審査役が done の項の字が名指す歯の名を対応の表に書き、器がそれを宣言の歯の外の項目に数えて審査を INCONCLUSIVE に倒す・第 0.5 版の行 v-notes-head の便 t3-hub.80.19-20261004T182144Z の契約の審査）。 構造の連鎖（木 0ee9c0da で grep）。drafts_guard::decide の呼び手は hook/mod.rs の pre_tool_use の 1 か所。copy_places の呼び手は decide と live_row の歯の 1 か所。literal と normalized と moved は live_row の中だけで使われ、見える範囲を広げるだけ。NAMES の読み手は掃除の 1 か所で、見える範囲を広げるだけ。Reason の語を数える読み手は記録の what の 1 か所（字 drafts-deny と語）。席の会話の記録で 10-03 以後に断りになる撃ちは 13 件（席の管理の組みの置き場 7・解けない値 4・ほか 2・係 w148a の実測）で、席は着地の前に管理の組みの置き場を起草の置き場の子の target へ移す。器の file の行の上限: 幅 120 で数えて drafts_guard.rs は 221 行から 579 行・pipe/mod.rs は 1377 行のまま（余地 123 で growth 1）。 入口の赤。lib の歯は src の drafts_guard.rs の歯の区間に在るので、前の行 v-accept-ptr の木では verify の 3 行目の filter に当たる歯が 0 本で rc 4（--no-tests=fail）。e2e の歯の file hook/guards.rs だけを試作の字にした前の行の木で、verify の 4 行目が rc 100（e2e の一時 dir の下の target を通し、断りの rc 2 の断言で落ちる）。 試作と噛み。写し drafts/w152a で書く file は write-set の中で閉じる。verify の 2 行目から最後の前の行までは rc 0（器の clippy・器の lib の歯 vdrenv_ の 3 本・器の e2e の歯 vdrenv_ の 1 本と着地済みの hook_drafts_place_ の 1 本）。根の xtask の check は rc 0（3 行を全部当てた木 2cb62054〔main 0ee9c0da の上〕で根の歯 3281 本・入れ子の器の歯 4089 本・器の clippy・器の xtask check まで。main 21cb093d に積み直した木 065b9ce3 で入れ子の 4 段〔build・歯 4092 本・clippy・器の xtask check〕も rc 0）。噛みは句ごとに 1 つの変異を当てた木で名指しの歯を 1 本の範囲で撃ち、13 の句（掃除の名の段・子より下・相対を断る・段の前置き・最も長い点・8 進の escape・宣言の語・--target-dir・PWD を解く・前置きは残らない・TMPDIR は置き場を問わない・写しの無い周も読む・tmpfs を断る）に 14 の変異を当てて全部 rc 100。書き戻した後の対照は rc 0。 範囲の外。script の file の中の割り当てと Write の道具の path（門は Bash の command の字だけを読む）・npm と pip の cache の置き場・掃除が .git を持たない子を見ない穴（次の歩）・組みの置き場の名の列を言語の表へ移すこと（判断の記録 ADR-44 の決定 (4)）・器の設計文書の書き換え。"
