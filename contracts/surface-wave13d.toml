ign-note に置き（68 行）、組の id を字 ~note: と id の最初の字 # の前の字にする（236 行から 238 行）。src/gate.rs（書かない）の処分の要る種類 KINDS は条・規則行・判断の記録・要件の 4 つ。 在りか・境界（書かない・確かめた）。境界の src/server/board.rs の私的な fn built（109 行）は folio の索引の字を中核の build に、要約の字を add_summary に渡し、口 /api/graph・/api/graph/view・/api/around がこれを使う。src/cli/graph.rs の pub fn design_view（113 行・tz graph --design）は節点を Source::Design の kinds で、辺を EdgeType::ALL の先頭の DESIGN_EDGE_TYPES で絞る。src/hook/question_gate.rs は folio の索引の字を読んで（70 行）中核の build に渡す。どれも索引の字を変えずに渡すので、中核の読みを直せば 3 つとも読める。 形（build.rs）。DESIGN_KINDS を 12 にし、doc を 設計の索引の節点の種類の数（NodeKind::ALL の先頭の 12 = 設計文書の 11 種と設計ノートの行）の旨にする。pub const NOTE_ROW_KIND（&str・字 設計ノートの行・doc は索引の設計ノートの行の種類の語で、契約の型の serde の名とは違う）を足す。read_design の種類の読みを、語が NOTE_ROW_KIND なら NodeKind::NoteRow、ほかは named で読んだ種類が NoteRow でなく NodeKind::ALL の先頭の DESIGN_KINDS に在るときだけ、に替え、読めない語はこれまでどおり索引の全部を None にする（私的な fn に分けてもよい）。add_ledger は、グラフの種類 NoteRow の節点の id の集合を bead の読みの前に取り、bead ごとに pointers の各行（行の順）から行の候補の id を作り、候補が集合に在り同じ bead からまだ組んでいなければ、bead から候補への型 design の辺を足す（bead の種類は問わない・pointers と beads の属性は今のまま）。候補の作り方は、行から POINTER_PREFIX を除いた残りの前後の空白を除いた字を最初の字 # で path と行 id に分け、path の最後の字 / の後の字が字 .toml で終わるとき、その前の字（folio derive が書く導出物の file の名 = 文書 id）と字 # と行 id をつないだ字（字 # が無いか .toml で終わらなければ候補なし）。頭の doc の 4 行目を、設計ノートの行は NOTE_ROW_KIND の節点の行から組み、design の辺は pointer の行が指す行の節点へ組み、ruled_by の辺は組まない（索引に裁定の欄が無い）旨の字に替える。std::fs と std::process と SystemTime は使わない。 形（mod.rs）。doc だけを直す。Source の Design の doc を 設計の索引（設計文書の 11 種と設計ノートの行）に、pub fn of の doc を、閉じた 20 の種類はどれも 1 つの出所に当たる旨に替える（kinds と of の式は変えない・DESIGN_KINDS が 12 になるので NoteRow の出所は Design になる）。形（tests/graph.rs）。done (9) の message の字だけを替える。 決めた幅（起草の決め）。(a) 索引の種類の語は folio の語だけを読み、契約の型の serde の名 note-row は索引の語として読まない（読めない語の行が在れば索引の全部を読めないのは今のまま・知らない種類の語で全部を落とすかは変えない）。(b) 索引の辺の型 req と depends は組まずに skipped の design に数える（契約の型の EdgeType の閉じた 30 と DESIGN_EDGE_TYPES の 17 と電文と面の語を変えない・組むのは後の行）。(c) ruled_by の辺は組まない（索引と要約に裁定 id の欄が無い・folio の check --emit-rulings の出力は読まない）。(d) design の