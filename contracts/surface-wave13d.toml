schema = 1

[[contract]]
id = "c-dn-rows"
title = "中核の導出グラフが、folio の索引の種類の語 設計ノートの行 の節点の行を読めない行とせずに種類 note-row の節点に組み（今は 1 行でも在ると設計の出所の全部が読めない）、台帳の bead の acceptance の pointer の行が指す行の節点へ型 design の辺を組む（索引の req と depends の辺は組まずに数え、ruled_by の辺は組まない）"
req = ["FR2"]
section = "3"
write-set = ["crates/tsuzuri-core/src/graph/build.rs", "crates/tsuzuri-core/src/graph/mod.rs", "+crates/tsuzuri-core/tests/dnrow.rs", "crates/tsuzuri-core/tests/graph.rs", "=crates/tsuzuri-core/tests/nsum.rs", "=crates/tsuzuri-core/tests/csled.rs", "=crates/tsuzuri-boundary/tests/kcli.rs", "=crates/tsuzuri-boundary/tests/nsumw.rs", "=crates/tsuzuri-boundary/tests/server_read.rs"]
verify = ["cargo nextest run -p tsuzuri-core --test dnrow --no-tests=fail dnrow_", "cargo nextest run -p tsuzuri-core --test graph --no-tests=fail graph_", "cargo nextest run -p tsuzuri-core --test nsum --no-tests=fail nsum_", "cargo nextest run -p tsuzuri-core --test csled --no-tests=fail csled_", "cargo nextest run -p tsuzuri-boundary --test kcli --no-tests=fail kcli_", "cargo nextest run -p tsuzuri-boundary --test nsumw --no-tests=fail nsumw_", "cargo nextest run -p tsuzuri-boundary --test server_read --no-tests=fail server_read_", "cargo run -q -p xtask -- check"]
size = "M"
done = "(1) 節の索引の字 IDX と台帳の字 LED と event log の字 EV を中核の graph の build に渡したグラフ G は、読めなかった出所が無く、種類 NodeKind::NoteRow の節点は順に 3 つで、nx#a（file design-note/nx.yaml・要約値 1a2b3c4d・題 便 a — 骨格）・nx#b（file design-note/nx.yaml・要約値 5e6f7a8b・題 便 b — 型）・ny#c（file design-note/ny.yaml・要約値 9c0d1e2f・題 行 c — 札）で、3 つとも line と plain と eng が無し。NodeKind::ALL の順に 0 でない種類ごとの節点の数は、Article 1・Req 1・NoteRow 3・Epic 1・Task 3・Run 1。型 basis の辺は FR1 から A-1 への 1 本だけで、skipped の design_edges は 4（req の 2 行と depends の 2 行を組まずに数える）、ledger_edges は 0（歯 dnrow_index_reads_rows） (2) 中核の graph の build の module に pub const NOTE_ROW_KIND（&str・字 設計ノートの行）が在り、pub const DESIGN_KINDS は 12 で、Source::Design の kinds は NodeKind::ALL の先頭の 12（最後は NoteRow）、Source::of に NoteRow を渡すと Some(Source::Design) で、NodeKind::ALL の 20 の種類のどれを渡しても Some。IDX の ny#c の行の種類の語だけを字 note-row（契約の型の serde の名）に替えた索引と LED と EV のグラフは、読めなかった出所が Source::Design だけで、種類 NoteRow と Req の節点が 0、unknown_kinds が NoteRow を含み、型 design の辺が 0 で、種類 Task の節点は 3。空の字の索引と LED と EV のグラフも、読めなかった出所が Source::Design だけで、unknown_kinds が NoteRow を含み、型 design の辺が 0 で、種類 Task の節点は 3（歯 dnrow_kind_words） (3) G の型 design の辺は辺の順に dn.1 から nx#a・dn.2 から nx#b・dn.2 から ny#c の 3 本だけ（dn.3 の pointer の先 nx#zz は節点に無いので辺を組まない）。EdgeType::ALL の順に 0 でない型ごとの辺の数は Basis 1・ParentChild 3・Design 3・RunOf 1。G の beads の dn.3 の pointers は字 design = contracts/nx.toml#zz の 1 つ。IDX と空の字の台帳と EV のグラフは、読めなかった出所が Source::Ledger だけで、種類 NoteRow の節点が 3 つ、型 design の辺が 0（歯 dnrow_design_edges） (4) IDX と EV と、open の task の bead fm.1 の 1 本だけの台帳（欄 acceptance_criteria に字を置く）のグラフは、どれも読めなかった出所が無く、型 design の辺はどれも fm.1 から出る。辺が nx#a への 1 本になる字は、design = contracts/nx.toml#a・字 design = の後に空白 2 つと contracts/nx.toml#a と空白 2 つ・design = nx.toml#a・design = a/b/nx.toml#a・3 行の字（行の区切りは復帰と改行・1 行目 受け入れの字・2 行目 design = contracts/nx.toml#a・3 行目 本文）・同じ行 design = contracts/nx.toml#a を 2 行（区切りは改行）の 6 つ。辺が 0 になる字は、空の字・design = contracts/nx.toml#zz・design = contracts/nx.md#a・design = contracts/nx.yaml#a・design = contracts/nx#a・design = contracts/nx.toml#a#b・design = contracts/nx.toml#・design = contracts/nx.toml・design = contracts/.toml#a・design=contracts/nx.toml#a・空白 1 つと design = contracts/nx.toml#a・research = contracts/nx.toml#a の 12。2 行の字 design = contracts/ny.toml#c と design = contracts/nx.toml#b（区切りは改行）は ny#c と nx#b への 2 本をこの順に持つ。3 本の台帳（fk.1 は open の epic・fk.2 は open の task で label intake:memo・fk.3 は closed の task で label intake:question で、pointer を bd の別名の欄 acceptance に置く・3 本とも字 design = contracts/nx.toml#a）と IDX と EV のグラフの型 design の辺は、fk.1・fk.2・fk.3 から nx#a への 3 本をこの順に持つ（歯 dnrow_pointer_forms） (5) 中核の graph の check に G を渡した 12 の判定は id の順で、g-3 と g-7 と g-9 が Verdict::Unknown、ほかの 9 本が Verdict::Pass（歯 dnrow_invariants_hold） (6) G に要約の 2 行の字（1 行目は鍵 id nx#a・kind 設計ノートの行・file design-note/nx.yaml・line 30・title 便 a — 骨格・plain null・eng 行 a の題、2 行目は鍵 id ny#c・kind 設計ノートの行・file design-note/nz.yaml・line 9・title 行 c — 札・plain null・eng file の違う行の JSON の object）で add_summary を撃つと真を返し、nx#a は line 30・plain 無し・eng 行 a の題 になり、nx#b と ny#c（file が違う）は line と plain と eng が無しのまま（歯 dnrow_summary_fills_rows） (7) 中核の graph の view に G を渡した眺めは total 10・cut 0 で、種類 NoteRow の箱は順に ~note:nx（kids 2）と ~note:ny（kids 1）の 2 つ、型 design のまとめた辺は順に dn から ~note:nx（count 2）と dn から ~note:ny（count 1）の 2 本（歯 dnrow_view_band） (8) 中核の src/graph/build.rs の字は std::fs と std::process と SystemTime の字を持たない（着地済みの歯 nsum_core_reads_no_files と csled_floor_shape_and_pure が build.rs の字を読む）（歯 nsum_core_reads_no_files） (9) 中核の tests/graph.rs の graph_real_runs_hold_stage_and_account の assert の式は変えず、その message の字 設計ノートの行と口座は節点にしない を 見本の索引は設計ノートの行を持たず、口座は節点にしない に替える（見本の tests/fixtures/graph/real/design-index.tsv は folio の判断の記録 ADR-32 の前の出力で、設計ノートの行を持たない）。tests/graph.rs のほかの字は変えない（歯 graph_real_runs_hold_stage_and_account） (10) 中核の tests/dnrow.rs の test の属性の付いた fn の名は 7 つ以上で、どれも dnrow_ で始まり、名から先頭の dnrow_ を除いた字は、節に並べた filter の語のどれも部分の字として含まない（歯 dnrow_own_names_clean）"
goal = "在りかの main は db212b1（行 c-pipe-queue〔便 t3-hub.52.83〕の着地の commit・計画 第 0.33 版・要件書 第 0.14 版の後）。この行の file のうち中核の src/graph/build.rs と src/graph/mod.rs と tests/graph.rs と tests/nsum.rs と tests/csled.rs は、行 c-pipe-queue も行 e-snap も変えていない（c-pipe-queue は build.rs を置き場だけの = で持った）。この節の在りかの字はその code と、席の folio の pin 6467915 を main の写しの design-intent に撃った出力と、2026-09-28 に読むだけの bd で読んだ台帳の値。 なぜ。要件 FR2 は、設計文書の節点（11 種と設計ノートの行）と台帳と走行の節点を 1 つのグラフに組み、辺に型 design（契約 → 設計ノートの行）を含めるとする。これまで folio の索引（graph --print）は設計ノートの行を持たず、中核はこの節点と design の辺を組まなかった（build.rs の頭の doc の 4 行目 設計ノートの行・design の辺・ruled_by の辺はこの便では組まない）。席の folio の pin は 6467915（folio2 の判断の記録 ADR-32・計画 第 0.21 版）に上がり、索引は設計ノートの契約表の行を種類の語 設計ノートの行 の節点にし、辺の型 req（行 → 要件）と depends（行 → 行）を足した。中核の read_design は種類の語が契約の型の NodeKind の先頭の 11 の serde の名のどれでもない節点の行を 1 つでも見ると索引の全部を読めない（None）とするので、pin を上げた時から設計の出所の全部が まだ分からない になった。2026-09-28 の実測で、席の面の server の口 GET /api/graph/view は unread が design・shown 10・total 556 で、設計文書の 400 の節点が 1 つも出ない。同じ索引を読む tz graph と問いの起票の門（tz hook question-gate）も設計の出所を読めない。計画 surface-plan の 9 節のこの行（依存の字は folio の索引に設計ノートの行が載ること）はこの pin で待ちが解けたので、この行はその読みを直し、設計ノートの行の節点と design の辺を組む。 在りか・folio の口（pin 6467915 を main の design-intent に撃って確かめた）。graph --print の標準出力は 1349 行で、字 # で始まる行が 3 つ（1 行目 # 節点（1 行 = id / 種類 / file / 要約値 8 字 / 題 36 字・タブ区切り）・402 行目 # 辺（1 行 = 端 / 端 / 型・タブ区切り）・末行 # 節点 400・辺 946・型 14・端が節点でない参照 0）、節点の行が 400（タブ区切りの 5 列）、辺の行が 946（3 列）。節点の行のうち種類の語が 設計ノートの行 の行は 158 で 32 のノートに在り、id は文書 id と字 # と行 id をつないだ字、file は design-note/<文書 id>.yaml、題は行の section が指す節の題（例 surface-base#c・設計ノートの行・design-note/surface-base.yaml・d7f7c880・便 c — 導出グラフと不変条件と近傍）。辺の型の語は 14 で、そのうち req（309 行・例 surface-base#b・FR2・req）と depends（90 行・例 surface-base#b・surface-base#a・depends）は契約の型の EdgeType の閉じた 30 に無い。design-intent/graph.yaml の schema の node_kinds は 12（11 種と 設計ノートの行）で edge_types は 19（17 型と req と depends）。graph --print --summary は 400 行の JSON の object で、設計ノートの行の行は鍵 file が同じ design-note の path・line が行の id の行の番号・plain が null・eng が契約表の行の題の