goal = "在りかの main は fb2cc24（計画 surface-plan v0.66）。試作は main b8beec2（計画 v0.62）で撃ち、b8beec2 から fb2cc24 までの差はこの行の書く file と歯に当たらない。面の crate tsuzuri-surface の src/project/ask.rs・pipeline.rs・next.rs（どれも pub mod project の下の pub mod・DOM は各 file の mod dom で、wasm の target だけで組む）。 なぜ。着地した行 g-tick が net.rs に 1 秒の時計 pub fn ticker（ReadSignal の EpochSecs・頁に 1 本の interval・TICK_MS 1000）を置き、account の session の表と席の card（c-seat-tick）はそれで経過を書き直す。問いの card の経過は一覧の読みのたびにしか書き直さず（ask.rs の mod dom の tick は fetched.track() の後に crate::net::now() を返す）、pipeline の札の経過は電文を読んだ時の字（Kcard の age）のまま、次の一手の質問の行の経過は問いの一覧の読みが替わった時だけ組む（next.rs の注の字 毎秒の書き直しはしない）。見本はどれも data-since で 1 秒ごとに書き直す（ask.html の chip・ui.js の kcardHTML の札の meta・index.html の nx_e の小さい値）。見本の問いの chip は data-tip-expert に字 posted_at と投稿の時刻を持つ。 形（ask.rs）。mod dom の外に pub fn posted_tip を置く。値は字 posted_at と空白と view の clock（日本時間の年月日と時分秒と JST・行 g-jst）の字で、見本の生の UTC の字は使わない。mod dom の view の tick は、let clock = crate::net::ticker(); と let tick = move || clock.get(); に替える（名 tick と card_view の呼びの字 card_view(c, d, Live { nb, node }, on, tick, current, places) は歯 cadq が pin するので保つ・mod dom に字 now: を書かない＝歯 qkey）。注の字は、経過は 1 秒の時計で書き直し link は mode を替えれば替わる、にする。頭の部分の経過の chip の span の開きの tag に use:expert_tip=posted_tip(posted) を足す（widgets の help の directive expert_tip・行 g-tip-expert・経験者の mode だけで注釈を出す）。use の行に posted_tip と expert_tip を足す。 形（pipeline.rs）。Kcard の欄 age の後に pub な欄 elapsed_s（u64 の Option・電文の PipelineCard の elapsed_s をそのまま写す）を足し、kcard は elapsed_s に card.elapsed_s を置く（欄 age の値と決め方は今のまま）。fn age の前に pub fn age_at を置く。値は経過が None なら NO_AGE の字、在れば経過に now.saturating_sub(read) を足した秒を age に渡した字。mod dom の view は let tick = crate::net::ticker(); と、pipe を track して crate::net::now() を返す Memo の read（板の電文を読んだ時の今）と、read と tick の組を返す closure の clock を置き、board_view と column_view と kcard_view に引数 clock（EpochSecs の組を返す Fn で Copy・Send・Sync・static）を足して渡す。kcard_view は札の elapsed_s と clock から age_at を呼ぶ closure を経過の span の中身にする（今の card.age.clone() を替える）。view の body の let now = crate::net::now(); と content(p, l, now) は今のまま（歯 pipe が pin する）。kcard_view の {ci} は CLOCK の印より前のまま（歯 pcimark）。mod dom の use に age_at と tsuzuri_contract::EpochSecs を足す。 形（next.rs）。mod dom の row_view の経過の closure は、let clock = crate::net::ticker(); を置き、waited の今の引数を clock.get() にする。注の字は、経過は 1 秒の時計で書き直す、にする。waited の外形と値（歯 nact が pin する）は変えない。 決めた幅。時計は net の ticker の 1 本だけを読み、読み直しの口（net の read の path）を毎秒撃たない。次の一手の質問の行は、今ある問いの一覧の電文を毎秒 waited に渡すので、当たった質問の行 1 つだけが毎秒電文を decode する（ほかの行は種類と印で先に None を返す）。札の hover の card の値の行の経過（Kcard の hover の value）は読んだ時の字のまま（見本も札の meta だけが data-since を持つ）。この 2 つは歯で測らず、この行の差分で持つ。経過の字の決め方（ask の age の分と時間と日・pipeline の age の s と m と h と d）は変えない。 測り方・歯（tests/tkad.rs・新しい file）。使う item は tsuzuri_surface::project::ask の posted_tip と age、project::pipeline の age_at・age・kcard・NO_AGE と Kcard の欄 elapsed_s と age、widgets::help の expert_note と Inline、frame::Mode、tsuzuri_contract::board の PipelineCard と Stage、ledger::BeadId（札の contract は fx-t.1）。DOM の字は src の file を読んで見る（DOM が組めることは xtask の surface-build が見る）。試作で 4 本と着地済みの歯が通り、噛みを見た（注釈の頭の字を落とす・描く時の経過に読んでからの秒を足さない・札が経過の秒を持たない・問いの経過を一覧の読みのたびに戻す・chip に注釈を付けない・札の経過を読んだ時の字に戻す・次の一手の経過を描く時の今に戻す・歯の名が filter の語を含む、でそれぞれ名指した歯が落ちる）。wasm の clippy は通る。 filter の語（main fb2cc24 の contracts の verify の filter の語 251 を、ほかの語を部分の字として含まない 177 語に畳んだ語と、同じノートのほかの 2 行の接頭辞 gwv_・ksum_・この行の接頭辞 tkad_ は並べない・179 語）は aaround_・accept_・acchold_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadl_・cadopt_・cadq_・cdorm_・cfsplit_・cgdom_・cmark_・contract_form_・cround_・csled_・cspk_・ctick_・denv_・dnedge_・dngrp_・dnrow_・dnskip_・ecache_・epolq_・flight_・fmark_・fprem_・frame_・fserve_・fstop_・fxpre_・g3g7_・gapspage_・gatt_・gbnote_・gcoach_・gfix_・gfresh_・ghb_・gjst_・glabel_・gnav_・gpface_・gpill_・gpulse_・graph_・gsum_・gtuck_・gview_・hacols_・harest_・hasplit_・hbconf_・hbmark_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx