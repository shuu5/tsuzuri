nown の空の配列・known の空の配列・字 unknown）を足す（ほかの型の見本と snapshot の字は変えない・新しい型の見本は contract_form に足さず自分の歯の file に置く・作法 6）。 決めた幅（起草の決め・(e) と (h) は席の決め）。(a) 形の判定は器の doctor の行を写すだけで、中核は印を読まない（器の母集団が正本・決定 (6)）。そのため器が母集団から外さない問い（label intake:question で控えの印も設計の参照も無い open の bead）は Neither として一覧に出る（ADR-16 の決定 (1) は問いを区分の外に置くが、器の judge は問いの label を見ない・席の決め 2026-09-28・この repo の 2026-09-28 の台帳の open の問いは 0 本）。epic と bd の種類 decision は器が外す。(b) 一覧の順は台帳の順（器の行は欄ごとに id の昇順）。題は台帳の字のまま全文で運び、切るのは面。(c) 器が名指しても tsuzuri の台帳の読みに無い id と、is_open が偽の bead は出さない（doctor の字は最後に終えた撃ちの字で、台帳の読みより古くありうる・形は写すが在るか閉じたかは新しい台帳の読みに従う）。(d) doctor の字が無い（席の target か state dir が無い・口の最初の要求の後の見張りの読みの撃ちをまだ終えていない・器が落ちたか 30 秒を越えた周）か、台帳の形の行が無いか読めないか、台帳が読めなければ Unknown にし、0 本に化けさせない（条 P-7）。落ちた周の後に読めた周が来れば Known に戻る（前の字は持ち回さない）。event log が読めなくても一覧は Known（札だけが Unknown）。面が Unknown をどう出すかは次の行 g-pipe-misfit の決め。(e) 撃つのは台帳の見張りの読みの周だけ（席の決め 2026-09-28）。席の card の読み（5 秒ごと）には足さず、口の要求ごとの子 process も足さない（席の card の読みに bd の読みを足すと、行 e-marks・e-snap・e-idle が除いた bd の錠の取り合いが戻り、遅い bd で席の card の doctor の欄が Unknown になる）。見張りの読みの周は、今の main で起動の読み・印の動いた周・読み直しの間隔の周で、行 e-idle の後は受け手 0 人の間は印の動いた周だけ（受け手の付いた周と受け手の居る間の読み直しを足す）なので、撃ちも同じ決まりに従う。(f) 口 /api/pipeline の最初の要求が以後の撃ちを許し、その前は撃たない（板を見ない server は器を撃たず bd の読みも足さない・席の target と state dir を持つ server を立てる着地済みの歯 server_seat・server_ask・server_batch・epolq は口 /api/pipeline を撃たないので、偽の器の argv の記録は変わらない）。許した要求そのものは撃たないので、その要求と、次の見張りの読みの撃ちを終えるまでの要求の一覧は Unknown。面は知らせの接続を開いてから口を読むので、行 e-idle の後は受け手の付いた周の読みが撃ちを起こすことが多く、撃ちを終えて字が変わると board-changed の知らせで面が板を読み直す（許しが受け手の付いた周の読みの後なら、次の印の動きか読み直しの間隔〔store の印で 60 秒〕まで待つ）。(g) 撃ちは別の thread で走り、見張りの周と ledger-changed の知らせを待たせない（撃ちの時間を見張りの周に足すと、規則の行 R-21 の 1.5 秒を越える周が出る・下の測った値）。同時に 1 本だけで、走っている間の読みは終わった後にもう 1 回だけ撃つ（字が最後の台帳に追いつく）。撃ちの中の bd の読みは、撃ちを起こした見張りの bd の読みが終わった後に始まる。(h) 撃ちは器の中で bd の読みを 1 回足す（器の doctor は --repo の周だけ台帳を bd の --readonly list --all --limit 0 --json で読む）。測った値は、doctor --state-dir だけの 0.15 秒から 0.47 秒に対し、--repo . を足すと 0.85 秒から 15.76 秒（上の在りか・器の出力の測った時間）。上限 FORM_TIMEOUT はそ