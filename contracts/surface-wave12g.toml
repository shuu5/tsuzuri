ipelineCard・PipelineColumn・Reading と graph の title36（空白の続きを 1 つに畳み前から 36 字）と wire と、crate::frame（Block と pub fn node_href〔id と Mode を受け字 ?page=node&id=<id>&mode=<beginner か expert>〕）を持つ。pub const BLOCK（id pipe・見出しの鍵 pipeline・class panel）・PATH（字 /api/pipeline）・REASON・UNKNOWN_REASON・RUN_KEY・SHOW・CLOSE・CLOSED_TAG・CLOSED_STAGE と、pub fn cards（Fetched の参照を受け、札の列か理由の Result）・body・content（板と台帳の一覧と今を受け Body の Column の Vec）・columns・kcard・with_nodes・card_href・open_columns・with_open・with_closed を持つ。#[cfg(target_arch = wasm32)] の mod dom の pub fn view は、口 PATH と台帳の一覧の口とグラフの口を crate::net::read で読み、中身の閉包 body の中で crate::net::now() を今にし、pipe.with(|p| rows.with(|l| graph.with(|g| with_nodes(content(p, l, now), g)))) の値を match して、Unmeasured は unmeasured（理由の 1 行）、Empty は 0 件の帯と空の 4 列の board_view、Filled は board_view（class board の div に 4 つの列）にし、section(BLOCK, …) に渡す。mode は HelpCtx の mode か URL の query から決める閉包（Copy）。見出しは crate::widgets::help の hs（鍵を受け class hd の span に見出しの語と「?」）で出す。kcard_view は札を class card.class の a（href は card_href）で出す。frame の Mode（Beginner・Expert・pub const ALL・pub fn key）は pub。 在りか・語の辞書と stylesheet と「?」の注釈（確かめた）。crates/tsuzuri-surface/vocab.json（write-set）は欄 english（label・note・internal）と rephrase（label・plain・internal）を持ち、src/vocab.rs の vocab() が 2 欄の和集合を鍵で引き、label（鍵）が見出しの語を返す（表に無い鍵は字 〔語彙表に無い…〕）。rephrase の最後の鍵は p_more（詳しく）。widgets の help の pub fn note（鍵を受け Note の Option）は plain の 1 行目を head に、字 ▸ の行までの 2 行目からを items に、その後を more に分け、項は頭の 1〜3 字の記号と本文に分ける（Inline は Text・Code・Sym の 3 つ・pub）。crates/tsuzuri-surface/style.css（write-set）は .board（4 列の grid）・.col・.cards・.kcard・.more・.empty と、全体の .kid（id の字の等幅）の規則と、色の変数 --s-stop（明るい地で #d14343・暗い地で #ff6b6b）・--panel・--line・--ink・--ink-2・--r2・--s2・--fs-1 を持ち、字 .fixrow・.fixcards・.fixcard の規則は無い（.strip は席の block の時間の帯の規則で使わない）。 形（src/project/pipeline.rs の host の部分）。use の契約の board に Misfit を足す。pub const MISFIT_KEY（&str・字 misfit・doc は要修正の行の見出しの語の鍵）・MISFIT_CLASS（&str・字 fixrow・doc は見本の案 A の横長の行の class）・NEITHER_TEXT（&str・字 印が無い — 設計の参照も控えの印も無い）・BOTH_TEXT（&str・字 印が両方 — 設計の参照と控えの印の両方が在る）を足す（2 つの字は見本の案 A の字と、その対の字）。pub struct MisfitCard（derive は Debug・Clone・PartialEq・Eq・pub な欄 id の String・title の String・why の &static str）を足す。pub fn misfit_text（Misfit を受け &static str）は Neither に NEITHER_TEXT・Both に BOTH_TEXT を返す（電文の語を写すだけで面は判じない）。pub fn misfit_cards（Fetched の参照を受け MisfitCard の Vec）は、Fetched が Body でなければ空、本文を wire の decode で PipelineBoard に読み、欄 misfits が Known ならその順に MisfitCard（id は bead の字・title は title36 に通した字・why は misfit_text の字）の Vec、ほか（読めない・Unknown）は空にする。pub fn misfit_href（MisfitCard の参照と frame の Mode を受け String）は frame の node_href に札の id と Mode を渡した字を返す（pipeline の札の card_href と同じ先）。module の頭の doc の 1 行目の後に、4 列の下の要修正の行（形の崩れた open の bead・0 本なら出さない・行 g-pipe-misfit）の 1 行を足す。 形（mod dom）。use super の列に MISFIT_CLASS・MISFIT_KEY・MisfitCard・misfit_cards・misfit_href を足す。view の閉包 body は、今の match の値を let board で受け（match の腕の字は変えない・字 with_nodes(content(p, l, now), g) と crate::net::now() は残る）、その後に let fix = pipe.with(|p| misfit_view(misfit_cards(p), mode())); を置き、view! { {board}{fix} }.into_any() を返す（板の後に要修正の行・板が測れていないか 0 件でも行は欄 misfits だけで決まる）。私的な fn misfit_view（MisfitCard の Vec と Mode を受け AnyView の Option）は、札が 0 枚なら None を返し、ほかは札ごとに view! の a（class fixcard・href は misfit_href の字）の中に span（class kid・id）と span（class tt・題）と span（class why・崩れの字）を置いて collect_view し、class が MISFIT_CLASS の div の中に header（中身は hs(MISFIT_KEY)）と div（class fixcards・札）を置いた値を Some にする。kcard_view・board_view・column_view・列を開き畳む関数は変えない。 形（style.css と vocab.json）。style.css の .more の規則の前に 6 つの規則を足す。.fixrow { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--s2); margin-top: var(--s2); padding: var(--s2); border: 1px dashed var(--s-stop); border-radius: var(--r2); background: color-mix(in srgb, var(--s-stop) 10%, var(--panel)); } と、.fixrow > header { flex: 0 0 150px; display: flex; align-items: center; min-height: 32px; font-weight: 700; color: var(--ink-2); } と、.fixcards { flex: 1 1 260px; display: flex; flex-wrap: wrap; gap: var(--s2); min-width: 0; } と、.fixcard { display: block; flex: 0 1 260px; min-width: 0; overflow-wrap: anywhere; padding: 6px var(--s2); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r2); font-size: var(--fs-1); } と、.fixcard .tt { display: block; font-weight: 650; color: var(--ink); } と、.fixcard .why { color: var(--s-stop); }（どれも 1 行）。広い幅では札の群が見出しの右に並んで折り返し、札の群の仮の幅 260px が見出しの右に収まらない狭い幅では札の群が見出しの下へ回る（試作の 6 つの規則を headless の Chromium で測った・行の幅 1200px と 900px と 600px では右、400px と 330px では下）。vocab.json の rephrase の p_more の後に鍵 misfit（label は 要修正、plain は 5 行と ▸ と 1 行〔1 行目 控えの印と設計の参照の形が崩れた open の bead、項 ・ 印が無い = どちらも無い、・ 印が両方 = 両方が在る、・ epic と裁定は外す、・ 0 本なら行を出さない、▸ の後に → 直す手は席が持つ〕、internal は 2 行〔1 行目 PipelineBoard.misfits の後に字 ・ と判断の記録 ADR-16 の決定 (1)(5)(6)、2 行目 器の ledger/form.rs の neither と both〕）を足す（ほかの鍵は変えない・記号の片 {…} も括弧の入れ子も持たない）。 決めた幅（起草の決め）。(a) 欄 misfits が Unknown（器の doctor の字が無いか台帳の形の行か台帳が読めない）のときも行を出さない。同じ home の頁の pipe の block の下の block ledger（src/project/ledger.rs）が、台帳の一覧の口が読めないことを理由の字 LEDGER_UNREAD（kit の定数）と指標の METRICS_UNKNOWN で名指すので、条 P-7 の まだ分からない は頁に出ている。Unknown で赤の行を出すと、台帳の読みが落ちるたびと、台帳か席の出所を持たない project でいつも要修正の行が出て、形の崩れと読めなさが同じ見た目になる（出す形は持ち主の裁定に無いので、席が要ると言えば後の行で足す・席の決め 2026-09-28）。(b) 板が測れていない（札が Unknown）か 0 件でも、欄 misfits が Known で 1 本以上なら行を出す（板の後）。(c) 札は押すと bead と同じ id の節点の頁へ行く（pipeline の札と同じ・要件 FR10 の同じ id で連動する）。hover の card は付けない。(d) 見本の案 A の見出しは数を持たないので、列の見出しの数（class cnt）は付けない。(e) 札の題は 36 字に切り、切る前の全文は節点の頁で読める。(f) 直す手（設計の参照を入れる・控えにする・閉じる）は席が持ち、面は button を出さない（見本の案 A の注と同じ・注釈の more の 1 行）。(g) 器の判定を写すので、器が母集団から外さない問い（label intake:question で印の無い open の bead）も印が無いの札で出る（c-pipe-misfit の決め）。注釈の項は epic と裁定は外す とし、問いを外すとは書かない。 着地済みの歯（面の crate の tests を grep で確かめ、試作で撃った）。src/project/pipeline.rs の字を読む歯: cadopt_dom_wiring（mod dom の字 with_nodes(content(p, l, now), g) と map::PATH と use:attach=card.hover.clone()）・klink_dom_anchor_keeps_hover（card_href( と a の class と href の並びと、file に字 <div class=card.class が無いこと）・cmark_dom_text（kcard_view の後の字）・pfold