goal = "在りかの main は 2dda25f（行 c-pipe-unmapped〔便 t3-hub.52.72〕は 014eb8e で着地済みで、この節の字はその後の code の値・判断の記録 ADR-16 と要件書 第 0.14 版と計画 第 0.32 版も 2dda25f に在る・中核の crate の字は 3e2e875 から変わっていない）。 なぜ。持ち主の裁定 t3-hub.60（裁定 id = t3-hub.60:20260928T0904Z-1）と t3-hub.52.71（裁定 id = t3-hub.52.71:20260928T0904Z-1）〔束 batch:20260928T0904Z-1・どちらも案 A〕で発効した判断の記録 ADR-16 の決定 (5) は、pipeline の板の Queued / Blocked の札を設計の参照を持つ契約の bead だけにし、epic は板に出さないとする（要件 FR10 の第 0.14 版の字も同じ）。決定 (1) は bead の種類を器（scribe2）と同じ 2 つの印（控えの印 = label intake:memo・設計の参照 = acceptance の design = の行）で決め、設計の参照だけなら契約とする。中核の板は今、走行を 1 つも持たない open の task の bead の全部を Queued か Blocked の札にし acceptance を見ないので、設計の参照の無い task（器が流さない）が Queued の列に何時間も残った（2026-09-28 の持ち主の指摘・ADR-16 の context）。計画 surface-plan の 9 節のこの行の字のとおり、読みは器の列の受付（dispatch）の pointer の読みと同じにし、器が流せる契約だけを走行の無い札にする。設計の参照の無い open の task（器の台帳の形の判定では控えの印も設計の参照も無い形の崩れ）を板の 4 列の下の要修正の行に出すのは、後の行 c-pipe-misfit と g-pipe-misfit（計画 surface-plan 第 0.32 版の 9 節の行）で、この行は札にしないだけで、この行の歯は形の崩れを見ない。 在りか・器の読み（器の repo の main fc76ebf の source で確かめた・器の repo は読むだけ）。器の pipe の dispatch の candidates の module の pub(super) fn is_input は、status が字 open で acceptance の前後の空白を除いた字が空でなく label intake:memo を持たない bead を列の入力にする。pub(super) fn pointer_of は acceptance の各行の前後の空白を除いた字のうち器の定数 DESIGN_KEY（字 design と空白と等号と空白）で始まる最初の行の残りを、前後の空白を除いて table の pub fn parse_pointer に通し、読めなければ待ちの理由 NoDesignPointer で便にしない（後の行は見ない）。parse_pointer は字を井桁で分けてちょうど 2 つの部分（path と行 id）になり、path の拡張子が md か toml（Rust の std::path::Path の extension）で、行 id が空でなく空白の char を含まないときだけ読める（path の file の stem が空でないことも見るが、Path の extension が在れば stem は空でない）。2026-09-28 に読んだ台帳の pointer の行は、この repo の 138 本が全部 design = contracts/<ノート>.toml#<行 id> の形、ほかの 2 つの project の台帳は design = docs/design/<file>.md#<行 id> の形（板は project ごとの server が出すので md の形も契約として読む・器の台帳の 2 本の読めない行の bead は閉じている）。 在りか・中核（main 2dda25f で確かめた）。crates/tsuzuri-core/src/lib.rs の 14 行目は pub mod ledger; で 16 行目は pub mod pipeline;。src/ledger/mod.rs（write-set）の src/ledger/mod.rs の pub(crate) struct Bead（