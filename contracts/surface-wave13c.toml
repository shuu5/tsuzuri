[[contract]]
id = "h-acct-split"
title = "account board の各 project の表の hover の card を組む関数と型と字（nx_card・led_card・pcnt_card・orch_card・gproj_card・thr_line・grp_card・row_cards と RowCards と 6 つの字）を、上限に近い surface/account/projects.rs から新しい file surface/account/cards.rs へ移し、使う側と着地済みの歯は use の path だけを替えて振る舞いを変えない"
req = ["FR12"]
section = "3"
write-set = ["crates/tsuzuri-surface/src/account/projects.rs", "+crates/tsuzuri-surface/src/account/cards.rs", "crates/tsuzuri-surface/src/account/mod.rs", "crates/tsuzuri-surface/src/account/ledger.rs", "crates/tsuzuri-surface/src/account/session.rs", "crates/tsuzuri-surface/src/account/home.rs", "crates/tsuzuri-surface/tests/acctframe.rs", "crates/tsuzuri-surface/tests/hcproj.rs", "crates/tsuzuri-surface/tests/hcnx.rs", "crates/tsuzuri-surface/tests/hcsess.rs", "crates/tsuzuri-surface/tests/hcled.rs", "crates/tsuzuri-surface/tests/hacols.rs", "crates/tsuzuri-surface/tests/hnunk.rs", "+crates/tsuzuri-surface/tests/hasplit.rs"]
