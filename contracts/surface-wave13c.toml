size = "S"
done = "(1) 面の account に新しい pub な module cards（新しい file src/account/cards.rs・account の mod.rs の行 pub mod cards; で host でも組む）が在り、projects.rs から移した pub fn nx_card・led_card・pcnt_card・orch_card・gproj_card・thr_line・grp_card・row_cards と pub struct RowCards と pub const NX_SRC・NX_MISS・LED_SRC・RUNS_UNKNOWN・WAIT_NOTE・GPROJ_SRC（どれも &str）を 1 度ずつ持ち、その file の字は mod dom・view!・target_arch・leptos のどれも含まず、mod.rs に行 pub mod cards; がちょうど 1 つ在る（歯 hasplit_cards_file） (2) projects.rs の字は 8 つの関数の宣言（fn と名と開き括弧）と struct RowCards と 6 つの字と私的な字 ASK の宣言（const と名とコロン）と字 pub use を持たず、projects.rs・ledger.rs・session.rs・home.rs は順に行 use super::cards::{RowCards, grp_card, row_cards};・use super::cards::led_card;・use super::cards::orch_card;・use super::cards::{gproj_card, nx_card}; をちょうど 1 つずつ持ち、4 つの file の字 use super::projects で始まる行は 8 つの関数の名のどれも含まない（歯 hasplit_callers_use_cards） (3) 面の src の account の dir の下の .rs の file の名の列（名の順）は board.rs・cards.rs・heartbeat.rs・home.rs・ledger.rs・mod.rs・projects.rs・session.rs・windows.rs の 9 つ（歯 acctframe_blocks_per_tab_and_module） (4) card の値は変わらない。着地済みの歯の file hcproj（10 本）・hcnx（4 本）・hcsess（6 本）・hcled（3 本）・hacols（7 本）・hnunk（4 本）は、card の item の use の path だけを tsuzuri_surface::account::cards に替え（ほかの item は account::projects のまま）、期待の字を変えずに通る。表の各行の pub な欄 cards は cards の row_cards に電文の同じ位置の行を渡した値（歯 hcproj_rows_carry_cards） (5) 新しい歯の file tests/hasplit.rs の歯の名は 3 つで、どれも hasplit_ で始まり、名の全体は file の const FILTERS の語（節の filter の語の列）のどれも部分の字として含まない（歯 hasplit_own_names_clean）"
goal = "在りかの main は 671060f（計画 v0.39）。この行の書く file を最後に書いたのは、面の src/account/projects.rs と src/account/ledger.rs と歯 hacols が行 h-acct-cols〔便 t3-hub.53.23・fa9f3ab〕、歯 hcproj と hcsess が行 g-jst〔ノート surface-wave13a・便 t3-hub.52.87・8634bf2・時刻の期待の字と別の日の since の入力だけ〕、src/account/session.rs が便 t3-hub.53.16（54fb75c）、src/account/home.rs と歯 hnunk が行 h-next-unknown〔便 t3-hub.53.19・bfda70a〕、src/account/mod.rs が便 t3-hub.53.18（2f84856）、歯 hcnx が行 h-cards-nx〔便 t3-hub.53.20・b229dd9〕、歯 hcled が行 h-cards-led〔便 t3-hub.53.21・6e08605〕、歯 acctframe が便 t3-hub.47（ba015fc）で、どれも着地して閉じた。起草の元の main 71a0780 から在りかの main までの commit のうちこれらの file を書いたのは g-jst の 8634bf2 だけで、card の item の use の行は変えない。この節の字はその code の値。 なぜ。計画の 3 節の作法 8 は、受付の上限を src の 1 file 1500 行とし、上限に近い file は先に中身を新しい file へ移す行を置くとする。面の src/account/projects.rs は行 h-acct-cols の後に 1400 行で、後に同じ file を書く行 h-sort-hist（S・余白 100）と h-acct-rest（M・余白 300）が続くので、1400 に 300 を足すと上限を越える。この file の後ろ寄りの 302 行（681 行目から 982 行目）は、表の 5 つの欄と群の見出しの chip の hover の card（見本 mock v3〔判断の記録 ADR-7 の承認で確定・repo の写しは docs/design/mock3〕の account/index.html の card の nx・ledCard・pcnt・seatCard・gproj・group の枝）を組む純粋な関数と型と字で、DOM を持たず、表の組み立てからは row と table が 2 つの関数を呼ぶだけなので、ここを割る。 在りか・projects.rs（write-set・1400 行）。account の mod.rs の pub mod projects で host でも組む（歯は tsuzuri_surface::account::projects の path で使う）。681 行目から 982 行目は順に、pub const NX_SRC（字 中核の next_step_seat）・NX_MISS（字 なし）・私的な const ASK（字 ?）・私的な fn nx_kinds・pub fn nx_card（&ProjectRow と EpochSecs を受け widgets の hover の Card）・pub const LED_SRC（字 bd list --all の bead）・pub fn led_card（&ProjectRow を受け Card）・pub const RUNS_UNKNOWN（字 state dir か event log が読めない）・WAIT_NOTE（字 ― = 質問の台帳を読んでいない）・pub fn pcnt_card（&ProjectRow と EpochSecs を受け Card）・pub fn orch_card（&AccountDoc と &ProjectRow を受け Card の Option）・pub const GPROJ_SRC（字 doctor の席の行と群の今の記録）・pub fn gproj_card（&AccountDoc と &ProjectRow を受け Card）・pub fn thr_line（契約の account の WindowCap の &[] を受け String）・pub fn grp_card（&AccountDoc と &str を受け Card の Option）・pub struct RowCards（derive は Debug・Clone・PartialEq・Eq・pub な欄 need・led・runs の Card と orch・acc の Card の Option）・pub fn row_cards（&AccountDoc と &ProjectRow を受け RowCards）。これらは同じ file の need・acc・current・wait_of・count_text と字 NONE_MARK と RUNS、account の home の group_more、project の ledger の age・fixed1・net、project の next の big と key、project の seat の NG・hm・hmd・short・state_value、project の UNKNOWN と state_key、vocab の label を使う。表の組み立ての pub fn table は群の見出しの card に grp_card を、pub fn row は ProjLine の pub な欄 cards（RowCards）に row_cards を使い、pub struct Group の pub な欄 card は Card の Option。DOM（mod dom・wasm の target のときだけ）は 983 行目より後に在り、row_view と more_view と head_view が card を widgets の hover の attach と自前の attach_some で要素に付ける。 在りか・使う側（write-set）。src/account/ledger.rs（633 行）は行 use super::projects::{led_card, unref_count}; を持ち、module の doc の 8 行目は中身は account の projects の led_card で組む、と言う。src/account/session.rs（926 行）は行 use super::projects::orch_card; を、src/account/home.rs（986 行）は行 use super::projects::{gproj_card, nx_card}; を持つ。src/account/mod.rs（398 行）は pub mod heartbeat・home・ledger・projects・session・windows と、wasm の target のときだけの pub mod board を持つ。 在りか・着地済みの歯（write-set）。tests/hcproj.rs は use tsuzuri_surface::account::projects の列に GPROJ_SRC・LED_SRC・NX_MISS・NX_SRC・PSort・ProjLine・RUNS_UNKNOWN・RowCards・WAIT_NOTE・gproj_card・grp_card・led_card・nx_card・orch_card・pcnt_card・row_cards・table を、tests/hcnx.rs は GPROJ_SRC・gproj_card・nx_card・row_cards を、tests/hcsess.rs は orch_card を、tests/hcled.rs は led_card を、tests/hacols.rs は NONE_MARK・PSort・WAIT_NOTE・count_text・grp_card・pcnt_card・table・thr_line・unref_class・unref_count・unref_of・wait_class・wait_of を、tests/hnunk.rs は PSort・need・need_rank・nx_card・table を持つ。tests/acctframe.rs の acctframe_blocks_per_tab_and_module は src/account の下の .rs の file の名の列を board.rs・heartbeat.rs・home.rs・ledger.rs・mod.rs・projects.rs・session.rs・windows.rs の 8 つと見る。 形。新しい file src/account/cards.rs に、projects.rs の 681 行目から 982 行目の字をそのまま移す（NX_SRC・NX_MISS・LED_SRC・RUNS_UNKNOWN・WAIT_NOTE・GPROJ_SRC と私的な ASK と nx_kinds と 8 つの関数と RowCards）。頭に module の doc（account board の各 project の表の hover の card を組む純粋な関数で、行 h-acct-split で projects.rs から移し振る舞いは同じ・台帳の欄の card は台帳の処理状況の表が、次の一手と口座の欄の card は HOME が、orchestrator の欄の card は session の表も使う、の旨）と、use の列（契約の EpochSecs・account の AccountDoc と ProjectRow と WindowCap・board の NextMove と Reading・stats の CheckResult、super::home::group_more、super::projects の NONE_MARK・RUNS・acc・count_text・current・need・wait_of、crate::project::ledger の age・fixed1・net、crate::project::next の big と key as next_key、crate::project::seat の NG・hm・hmd・short・state_value、crate::project の UNKNOWN と state_key、crate::vocab::label、crate::widgets::hover::Card）を置く。新しい file は rustfmt の既定で整える（移した字の 3 か所の改行だけが変わり、値は変わらない）。projects.rs は移した字を消し、use に行 use super::cards::{RowCards, grp_card, row_cards}; を足し、使わなくなった use（EpochSecs・WindowCap・CheckResult・group_more・fixed1・hm・hmd・short・label）を外し、module の doc に、5 つの欄と群の見出しの chip の hover の card は account の cards の module が組む（行 h-acct-split で割った）、の 1 行を足す。mod.rs に pub mod cards を足す（名の順で heartbeat の前）。ledger.rs の use を行 use super::cards::led_card; と use super::projects::unref_count; の 2 行にし、module の doc の projects の led_card を cards の led_card にする。session.rs と home.rs の use の projects を cards にする。着地済みの歯は card の item の use だけを account::cards の列に移し（hacols と hcproj と hnunk は projects の列を残りの item にする）、acctframe の file の名の列に cards.rs を足す。projects.rs は 1400 行から 1095 行に、cards.rs は 315 行になる（試作）。 決めた幅（起草の決めと席の決め）。(a) 計画の what が名指す 6 つの関数と型に、群の見出しの chip の card の grp_card と、それだけが使う thr_line を足して移す（どちらも表の hover の card で、見本の card の group の枝）。(b) 移した item は cards の path だけに置き、projects.rs から pub use で出し直さない（1 つの item に 2 つの path を置かない）。使う側の src の 3 つの file は use の 1 行ずつを直す（計画の files は src/account/projects.rs・cards.rs・mod.rs と歯だけを名指すが、path を替えるとこの 3 つも直る・席の決めで受け、write-set に ledger.rs・session.rs・home.rs を持つ）。(c) card の字と出所の字（NX_SRC ほか 6 つ）も card と同じ file に移す（歯が同じ path で読む）。私的な ASK と nx_kinds も card だけが使うので移す。(d) DOM（row_view・more_view・head_view・attach_some）は projects.rs に残す（着地済みの歯 hcproj_dom_wiring・pmore_dom_words・hacols_dom_words が projects.rs の字 mod dom より後を読むので、DOM を動かすと直す歯が増える）。 範囲の外。(1) card の値と字と出所は変えない（見本との差は後の行）。(2) home.rs と session.rs と ledger.rs の中身は use の行と doc の 1 語のほか変えない。(3) 着地済みの歯の期待と数は変えない。(4) 語の辞書・stylesheet・電文の契約と中核と境界の crate・fixture・Cargo.toml は触らない。 着地済みの歯（面の crate の tests と src を grep で確かめ、試作で撃った）。path を替える 6 つの file（hcproj・hcnx・hcsess・hcled・hacols・hnunk）と file の名の列を直す acctframe のほかに、card の item の path を使う歯は無い。src/account の下の file を全部読む歯（acctframe の block の枠と class と語の見張り・acctwin の acctwin_no_storage_and_wasm_wiring〔file の数が 7 以上〕）と、src の下の file を全部読む歯（frame の見出しの語と class の見張り・parts・aord）は cards.rs も読み、直さずに通る（cards.rs は DOM と見出しの語の字と保存の口の字を持たない）。DOM の字を読む歯（hcproj_dom_wiring・pmore_dom_words・hacols_dom_words・hcled_dom_wiring・hcsess_dom_wiring）は、DOM と ledger.rs と session.rs の DOM を変えないので直さずに通る。試作（scratchpad の main 71a0780 の写しにこの行だけを入れた木）で面の crate の歯の全部（616 本）と clippy（host の workspace の全部の target と面の wasm）が通った。3 行を順に当てた main 671060f の写しで xtask の check（workspace の歯の全部 1212 本〔契約 16・中核 199・境界 352・面 636・xtask 9〕・clippy の host と面の wasm・surface-build）が rc 0 で通った。 測り方・歯。新しい歯は面の crate の tests/hasplit.rs に置き、名を hasplit_ で始める。src の字を読む（env の CARGO_MANIFEST_DIR に src/account/cards.rs・projects.rs・ledger.rs・session.rs・home.rs・mod.rs と tests/hasplit.rs を足した path）。hasplit_cards_file は done (1) を、hasplit_callers_use_cards は done (2) を、hasplit_own_names_clean は done (5) を見る（自分の file の字を読み、test の属性の行の次の fn の名を全部集める）。card の値は着地済みの 6 つの歯の file が見る（done (4)）。新しい歯は main の code では落ちる（cards.rs が無い）。 filter の語（main 671060f の contracts の verify の filter の語 219 を、ほかの語を部分の字として含まない 145 語に畳んだ語と、並行の起草の行と計画の後の行の接頭辞の 4 語〔pgz_・fprem_・gpface_・dnkind_〕で、このノートの 3 行の接頭辞 hasplit_・hshist_・harest_ は並べない）は aaround_・accept_・acchold_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadopt_・cdorm_・cgdom_・cmark_・contract_form_・cround_・csled_・denv_・dnrow_・ecache_・epolq_・flight_・fmark_・frame_・fserve_・fstop_・gapspage_・gbnote_・gfix_・gfresh_・ghb_・gjst_・glabel_・gnav_・gpill_・gpulse_・graph_・gsum_・gtuck_・gview_・hacols_・hbconf_・hbmark_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hdchip_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hspage_・hsym_・iclose_・ilink_・kcli_・klink_・launch_・lcard_・ledgerblock_・lhome_・lidle_・lsnap_・lspark_・lstore_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・parts_・pclosed_・pfold_・pipe_・plimit_・pmisfit_・pmore_・pquest_・pqueue_・project_・ptitle_・punmap_・pwhole_・qblock_・qgate_・qkey_・question_・relay_・rhold_・runsdoc_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・stcli_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_・pgz_・fprem_・gpface_・dnkind_ で、新しい歯の名はどれも hasplit_ で始まり、名の全体がこのどれも部分の字として含まない（例 hasplit_stats_x・hasplit_project_x・hasplit_server_x は不可）。歯の file は同じ 149 語を const FILTERS に持つ。名は done に書いた hasplit_cards_file・hasplit_callers_use_cards・hasplit_own_names_clean（どれも並べた語を含まない）。畳んだ語で足りる（着地済みの filter のうち歯の名そのものと server_ で始まる接頭辞と stage_ で始まる接頭辞は、並べた語を部分の字として含む）。 依存と順。depends は無い（計画の依存の行 h-acct-cols は着地済み・便 t3-hub.53.23・fa9f3ab）。このノートの 3 行は面の src/account/projects.rs を h-acct-split → h-sort-hist → h-acct-rest の順に書き（ノートの depends と便の bead の依存で持つ）、ledger.rs と session.rs も h-acct-split → h-sort-hist の順に書く。src/account/home.rs を書く計画の後の行 h-thr-home と h-acct-spark（計画の 9 節・まだノートに無い）、mod.rs を書く行、歯 hcproj・hcnx・hcsess・hcled・hacols・hnunk・acctframe を書く行が起草されたら、この行との順は便の bead の依存で持つ（器は走行中の行と write-set が重なる行を断る）。行 g-jst（面の時刻を日本時間にする・ノート surface-wave13a）は便 t3-hub.52.87 で着地した（8634bf2）。g-jst は card の時刻の字（project の seat の hm と hmd を使う nx_card・led_card・pcnt_card・orch_card・grp_card）を見る面の歯 hcproj.rs と hcsess.rs の期待の字を直し、この行はその後の字の use の行だけを書く（期待の字は変えない・在りかの main の写しに当てて衝突が無いことを試作で確かめた）。計画の行 h-dormant（ノート surface-wave13f・休止中の席の chip）も src