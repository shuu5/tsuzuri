oml は頭の注の 2 行目の頭の 1 文（行 r4-args-mark の expect で許す R-4 の行の間の字）を、表が 3 つを deny にし expect と allow の属性で許さない字に替える（鍵と値は替えない）。xtask/tests/klint.rs は、頭の //! の 3 行目の R-4 の行の間の字を替え、一覧 MAP の拠り R-4 の 3 行の level を forbid から deny にし、一覧 ENABLED を 15 から 18 にして末に 3 つの lint を MAP の順に足し、歯 klint_own_names_clean の歯の数を 8 から 9 にし、その歯の前に歯 klint_r4_no_attr_exceptions（doc の行 3 行・名を一覧 MAP に data として持つ自分の file xtask/tests/klint.rs を数えから除く）を足す。xtask/tests/klintf.rs は、頭の //! の 2 行（一覧 R4_DONE の字）と、定数 R4_DENY と一覧 R4_DONE（どちらも doc の行を含む）と歯 klintf_r4_module_deny を消し、歯 klintf_own_names_clean の歯の数を 5 から 4 にする。folio の src の 20 file（anchor.rs・check.rs・face_adr.rs・face_constitution.rs・face_index_read.rs・face_index.rs・face_note.rs・face.rs・face_srs_items.rs・face_srs.rs・face_srs_rtm.rs・findings.rs・freeze.rs・graph.rs・lineage.rs・link.rs・mentions.rs・note.rs・refs.rs・stamp.rs）は、頭の //! の続きの直後の module の属性の行 #![deny(clippy::too_many_lines, clippy::cognitive_complexity)] の 1 行だけを消す（行 r4-folio-src-a と b が足した行・ほかの行は替えない）。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。当てた後に rustfmt と cargo fmt を撃たない。 done と verify の対応。done (1) は verify の 1 行目（git apply --reverse --check）、done (2) は 2 行目（歯 klint_）、done (3) は 3 行目（歯 klintf_）、done (4) は 4 行目（host の clippy・3 つの lint の -D を旗で渡さないので表の deny が効くことを測る）、done (5) は 5 行目（wasm の clippy）で測る。verify の最後の行（xtask の check）は workspace の全部の歯と大きさの数えと、同じ 2 つの clippy の段を撃つ（done には名指さない）。 入れ子の crate。持ち込んだ folio（folio2/crates/folio）は根の workspace の member で、manifest の節 lints は workspace = true の 1 行（歯 klintf_src_roots_lint_attrs と klint_members_follow_carry_table が見る）。folio2/ の下に別の workspace の Cargo.toml は無い（追跡される Cargo.toml は根と 6 つの member だけ）。よって根の表は folio にもそのまま効き、folio の側に表を置かない（噛みの変異 t5 で、folio の src の関数を 61 行延ばすと、3 つの lint の -D を渡さない host の clippy が too_many_lines で落ちた）。器の穴の 5 点: (1) folio の src の 20 file を書く行はこのノートに無い（depends は下の段）。(2) 行数はどの file も 1 行減るだけ。(3) 構造の連鎖は下の段。(4) verify の clippy は --workspace で folio を含む。(5) 着地の後に席が xtask の check を手で 1 度撃つ。 例外の属性の数（git grep・.rs の全部）。main 94b0e5a7 で、3 つの lint の expect の属性 15（中核の歯 6・folio の歯 2・面の歯 7）と、folio の src の module の属性 deny 20。このノートの 3〜11 節の 9 行の後で expect 0・deny 20、この行の後で expect と allow と deny の属性はどれも 0 で、字 clippy と 2 つのコロンに 3 つの lint か 3 つの群の名を続けた字は member の .rs に 0（歯 klint_r4_no_attr_exceptions が見る）。 構造の連鎖（grep で全部）。根の Cargo.toml の表の行を読む歯は klint_workspace_table（一覧 ENABLED と MAP と照らす）と klintf_src_roots_lint_attrs（一覧 COVER の 15 が表に在る）だけ。clippy.toml の鍵と値を読む歯 klint_clippy_conf_copies_rule_r4 は注の行を読まない。一覧 R4_DONE と定数 R4_DENY を読む物は消す歯 klintf_r4_module_deny だけ。ほかの行の done が名指す歯 klintf_r4_module_deny は、廃止したノート surface-wave24a の行 r4-folio-src-a と b の done だけ（どちらも着地済み・verify の行は歯の名を名指さない）。 試作と噛み。試作の木（写し drafts/w58a の branch six の dc74a8f3）で verify の全部の行が rc 0（xtask の check は rc 0・分けない全部・歯 2,920 本が全部緑・274 秒）。噛みは同じ木で変異 8 を 1 つずつ当て、どれも名指した verify の行を落とした（clippy の落ちは rc 101 と lint の名・nextest の落ちは rc 100・git apply の行は rc 1）。(t1) folio の src/note.rs の頭の //! の続きの直後に module の属性 deny の行を戻す → verify の 1 行目が rc 1・done (1) の項／(t3) folio の src/note.rs の頭の //! の続きの直後に module の属性 deny の行を戻す → nextest の行が rc 100（歯が落ちた）・done (2) の項／(t4) folio の build.rs の最初の use の前に module の属性 deny（unused_must_use）を足す → nextest の行が rc 100（歯が落ちた）・done (3) の項／(t5) folio の src/refs.rs の fn id_of の本体の頭に 61 行を足す（3 つの lint の -D を渡さない host の clippy の行で、表の deny が入れ子の crate に効くことを見る） → clippy の行が rc 101（lint の誤りで落ちた）・done (4) の項／(t6) 面の tests/btuck.rs の fn boxed の前に expect の属性の 4 行を足す → clippy の行が rc 101（lint の誤りで落ちた）・done (4) の項／(t7) 面の src/widgets/hover.rs の wasm の target だけで組む fn window_size の本体の頭に 61 行を足す → clippy の行が rc 101（lint の誤りで落ちた）・done (5) の項／(t8) folio の src/refs.rs の fn id_of の本体の頭に 61 行を足し、その前に理由を持つ expect(clippy::too_many_lines) の属性を 1 つ足す（条 P-24.3 の一般の例外の口） → nextest の行が rc 100（歯が落ちた）・done (2) の項／(t9) t8 と同じ変異で host の clippy の行を撃つ → rc 0（理由を持つ expect が表の deny を下げるので clippy だけでは止まらず、t8 の歯が止める・対照）／(t2) 根の Cargo.toml の表から too_many_arguments の行を消す → nextest の行が rc 100（歯が落ちた）・done (2) の項。 前の行の注。着地済みの行 r