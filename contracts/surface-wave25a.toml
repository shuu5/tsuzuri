 は空（このノートの 3〜8 節の 6 行と、面の歯のほかの 2 行と、書く file が重ならない）。範囲の外: 面の歯のほかの file（行 r4-surface-tests-a と b）。中核・契約・境界・folio の歯（3〜8 節の行）。面の src と build.rs（ノート surface-wave24a の行 r4-surface-src が直した）。根の Cargo.toml の workspace の lint の表への R-4 の 3 つの lint の足しと、xtask の歯 klint と klintf の一覧と clippy.toml（12 節の表の行）。"

