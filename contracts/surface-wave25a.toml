ord.rs・tests/bhalfpanel.rs・tests/cadopt.rs は試作の後も rustfmt --check が rc 0。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。当てた後に rustfmt と cargo fmt を撃たない。関数の割り・足す関数の頭と doc の行・束ねた引数と呼ぶ所の形は全部差の字のとおりで、上の形の段はその平の字の要約（食い違えば差の file が正本）。 done と verify の対応。done (1) は verify の 1 行目（git apply --reverse --check・差の hunk が全部木に在れば rc 0、当てる前の木では rc 1）、done (2) は 2 行目（clippy）、done (3) から (6) は 3 行目から 18 行目（歯の file ごとの nextest・done の file の順・歯の名の filter は置かない）で測る。done (7) は 19 行目から 20 行目（歯 abssと歯 pwhole）で測る。verify の最後の行（xtask の check）は workspace の全部の歯と大きさの数えを撃つ（done には名指さない）。clippy の行は cargo clippy -p tsuzuri-surface に 16 の --test と --no-deps を渡し、名指した歯の crate と組みに入る面の lib と build.rs だけを撃つ（面の歯は 3 行に割ったので --tests と --all-targets を使わない・面の package の全部は表の行 r4-table の verify が撃つ）。 構造の連鎖（grep で全部）。足す関数は file の中で private で、ほかの file から呼ばれない（歯の crate は file ごとに別の crate）。この行の file の字を読む着地済みの歯は 2 つで、どちらも verify に置き write-set に = で置いた（書かない）: 中核の tests/abss.rs の abss_own_names_clean は面の tests/abssface.rs の行 #[test] の次の行の名を数え、面の tests/pwhole.rs は tests/batchpanel.rs の字に Scope と fn batchpanel_policy_scope が無いことを見る。書く file はどれも tests/ の下で、器の受付の余地の検査（1 file 1,500 行）は crate の src の下だけを見るので当たらない（最大 tests/accthome.rs の 773 行）。 試作と噛み。試作の木（写し drafts/w58a の branch six = main 94b0e5a7 に 3〜8 節の 6 行の差と面の歯の 3 行と表の行の試作を積んだ木）で、verify の全部の行が rc 0（xtask の check は rc 0・分けない全部・歯 2,920 本が全部緑・274 秒）。噛みはその木で変異 8 を 1 つずつ当て、どれも名指した verify の行を落とした（clippy の落ちは rc 101 と lint の名で、nextest の落ちは rc 100 で数え、nextest の rc 101〔組み立ての誤り〕は数えない・変異の後は file の字を元に戻した）。(a1) tests/accthome.rs の file を試作の前の字（main 94b0e5a7 の字）に戻す → clippy の行が rc 101（lint の誤りで落ちた）・done (2) の項／(a2) tests/btuck.rs の束ねた関数の前に行 r4-args-mark の expect の属性の 4 行を戻す → clippy の行が rc 101（lint の誤りで落ちた）・done (2) の項／(a3) tests/accthb.rs の足す関数の本体の頭に落ちる断言の 1 行を挿す → nextest の行が rc 100（歯が落ちた）・done (3) の項／(a4) tests/acctsess.rs の足す関数の本体の頭に落ちる断言の 1 行を挿す → nextest の行が rc 100（歯が落ちた）・done (4) の項／(a5) tests/askcard.rs の足す関数の本体の頭に落ちる断言の 1 行を挿す → nextest の行が rc 100（歯が落ちた）・done (5) の項／(a6) tests/cround.rs の足す関数の本体の頭に落ちる断言の 1 行を挿す → nextest の行が rc 100（歯が落ちた）・done (6) の項／(a7) tests/batchpanel.rs の最初の doc の行の頭に字 Scope を足す（面の歯 pwhole が見る字） → nextest の行が rc 100（歯が落ちた）・done (7) の項／(a8) tests/abssface.rs の歯の名 abss_acct_drawn_at_now の頭を abssx_ に替える（中核の歯 abss が数える名） → nextest の行が rc 100（歯が落ちた）・done (7) の項。verify の 1 行目は、差を当てる前の main（床の写しの 846866bc）で rc 1。 流す時と順と範囲の外。depends は空（このノートの 3〜8 節の 6 行と、面の歯のほかの 2 行と、書く file が重ならない）。範囲の外: 面の歯のほかの file（行 r4-surface-tests-b と c）。中核・契約・境界・folio の歯（3〜8 節の行）。面の src と build.rs（ノート surface-wave24a の行 r4-surface-src が直した）。根の Cargo.toml の workspace の lint の表への R-4 の 3 つの lint の足しと、xtask の歯 klint と klintf の一覧と clippy.toml（12 節の表の行）。"

