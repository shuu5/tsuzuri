schema = 1

[[contract]]
id = "e-idle-close"
title = "境界の server が、要求の行の最初の 1 byte より前に相手が閉じた接続と読みの時間切れの接続には何も書かずに閉じ、byte の届いた形の悪い要求と切れた要求には今のまま 400 bad-request を返す"
req = ["NFR1", "NFR2"]
section = "3"
write-set = ["crates/tsuzuri-boundary/src/server/http.rs", "crates/tsuzuri-boundary/src/server/mod.rs", "=crates/tsuzuri-boundary/tests/server_min.rs", "=crates/tsuzuri-boundary/tests/hbconf.rs", "=crates/tsuzuri-boundary/tests/hbpost.rs", "=crates/tsuzuri-boundary/tests/hbroute.rs", "=crates/tsuzuri-boundary/tests/rhold.rs", "+crates/tsuzuri-boundary/tests/iclose.rs"]
verify = ["cargo nextest run -p tsuzuri-boundary --test iclose --no-tests=fail iclose_", "cargo nextest run -p tsuzuri-boundary --test server_min --no-tests=fail server_min_", "cargo nextest run -p tsuzuri-boundary --lib --no-tests=fail server_min_http_", "cargo nextest run -p tsuzuri-boundary --lib --no-tests=fail server_ask_http_", "cargo nextest run -p tsuzuri-boundary --lib --no-tests=fail server_view_http_", "cargo nextest run -p tsuzuri-boundary --test hbconf --no-tests=fail hbconf_config_moves_to_config_rs", "cargo nextest run -p tsuzuri-boundary --test hbpost --no-tests=fail hbpost_mod_rs_drops_post_fns", "cargo nextest run -p tsuzuri-boundary --test hbroute --no-tests=fail hbroute_mod_rs_keeps_only_events", "cargo nextest run -p tsuzuri-boundary --test rhold --no-tests=fail rhold_wiring_text", "cargo run -q -p xtask -- check"]
size = "S"
done = "(1) 境界の server の http の module に pub fn no_bytes（&io::Error を受け bool）が在り、歯の中の読み手を read_request に渡すと、何も返さず尽きる読み手・最初に ErrorKind の WouldBlock を返す読み手・最初に TimedOut を返す読み手・最初に ConnectionReset を返す読み手ではどれも Err で no_bytes が真、字 GET / HT の後に WouldBlock を返す読み手・字 GARBAGE と CR LF CR LF・CR LF だけ・字 GET / HTTP/1.1 と CR LF だけ・byte 0xFF と 0xFE だけ・字 POST / HTTP/1.1 と CR LF と頭 Content-Length の値 5 の行と空行と本文 2 byte ではどれも Err で no_bytes が偽、最初に Interrupted を返しその後に字 GET / HTTP/1.1 と CR LF CR LF を返す読み手では Ok で method が GET で path が /、read_request の外で作った io::Error::from(ErrorKind::WouldBlock) と io::Error::from(ErrorKind::UnexpectedEof) と ErrorKind の InvalidData の io::Error では no_bytes が偽（歯 iclose_no_bytes_kinds） (2) 偽の bd と面の file の置き場（index.html）で 127.0.0.1 の空き port に立てた server に std の TcpStream で接続し、何も書かずに書きの側を閉じる（shutdown の Write）と、歯の側の読みの上限 5 秒の read_to_end が 0 byte で戻り（server は何も書かずに接続を閉じる）、その後に同じ server へ撃つ GET / は状態 200 で本文が index.html の字（歯 iclose_eof_writes_nothing） (3) 同じ形の server に、字 GARBAGE と CR LF CR LF を書いたとき・字 GET / HTTP/1.1 と CR LF だけを書いて書きの側を閉じたとき・字 G の 1 byte だけを書いて書きの側を閉じたとき・字 POST /api/ruling HTTP/1.1 と CR LF と頭 Content-Length の値 5 の行と空行と本文 2 byte を書いて書きの側を閉じたときの応答は、どれも頭の 1 行目が HTTP/1.1 400 Bad Request で本文が字 bad-request（歯 iclose_broken_keeps_400） (4) src/server/mod.rs の字で、字 fn handle( の後に字 http::no_bytes( が在り、その後に字 Response::text(400, と二重引用符で囲んだ bad-request と閉じ括弧の並びが在り、その後に字 fn guarded< が在り、字 http::no_bytes( と二重引用符で囲んだ bad-request はどちらも mod.rs に 1 度だけで、字 const READ_TIMEOUT で始まる行が字 Duration::from_secs(10); を持ち、境界の crate の Cargo.toml の dependencies の表の名は tsuzuri-contract と tsuzuri-core だけ（歯 iclose_handle_wiring_text） (5) 着地済みの歯は write-set の外の file を直さずに全部通る（xtask の check と、server_min_ の全部・lib の server_min_http_ と server_ask_http_ と server_view_http_ の 5 本・mod.rs の字を読む hbconf_config_moves_to_config_rs と hbpost_mod_rs_drops_post_fns と hbroute_mod_rs_keeps_only_events と rhold_wiring_text を含む）（歯 server_min_non_get_405_writes_nothing が字 GARBAGE の要求を今のまま 400 と見て通る） (6) tests/iclose.rs の test の属性の付いた fn の名はどれも iclose_ で始まり、名から先頭の iclose_ を除いた字は、節に並べた filter の語のどれも部分の字として含まない（歯 iclose_own_names_clean が自分の file の字を読んで全部の名を見る）"
goal = "なぜ。2026-09-28 に席が実物で測った欠陥（席の決め・計画 surface-plan の第 0.16 版の 3 節・欠陥の直しなので持ち主の問いを置かない）。境界の server の fn handle は、1 byte も送らない接続（browser が先に張っておく接続・空いたまま読みの時間の上限の 10 秒を越えた接続）にも、read_request の誤りとして 400 bad-request を書く。Chrome は先に張った接続を後の頁の移りに使い回すので、使い回した時に受け取りの箱に残っていた 400 を移りの応答として読み、持ち主の board に素の bad-request の頁が出た。席の測りでは、11 秒何も送らなかった素の接続に後から GET を送ると頭の 1 行目 HTTP/1.1 400 Bad Request と本文 bad-request が返り、headless の Chrome では、しばらく空けた後の最初の fetch（頁の path /）が 400 で、続く fetch は 200 だった。直しは、要求の行の最初の 1 byte が届く前に相手が閉じたか読みが終わった接続には何も書かずに閉じ、byte の届いた後の形の悪い要求と切れた要求には今のまま 400 を返すこと。要件は NFR1（面は page error 0 ほかの 12 条を満たす・頁の代わりに素の 400 の字が出れば面が出ない）と NFR2（台帳と器の変化は 5 秒以内に面へ届く・使い回した接続で口の読みが 400 になれば読みが落ちる）。 在りか（main cbaa244 で確かめた）。crates/tsuzuri-boundary/src/server/mod.rs（write-set）は 1 接続 1 thread の server で、Server の run が accept ごとに thread で私的な fn handle（TcpStream と Shared を受ける）を撃つ。私的な const READ_TIMEOUT（Duration::from_secs(10)・要求の頭を読む時間の上限）と WRITE_TIMEOUT（10 秒）を持つ。fn handle は stream に set_read_timeout と set_write_timeout を置き、http::read_request(&stream) を match して、Err なら種類を問わず Response::text(400, 二重引用符で囲んだ bad-request)、Ok で GET の /api/surface/events なら events::stream で SSE を流して戻り、ほかは route::dispatch の応答か、GET でなければ 405、GET なら files::serve（200・403 outside・404 no-file）の応答を作り、末で response.write_to(&stream) を撃つ（書きの誤りは捨てる）。fn handle の後に fn guarded<T>・fn refusal・fn lock・fn aged・fn json が続く。mod.rs の二重引用符で囲んだ /api/ の字は /api/surface/events の 1 つだけ。 在りかの補い（審査が材料に無いと返した可視性・main 8a6a643 で確かめた）。境界の crate の src/lib.rs の 14 行目は pub mod server; で、server の mod.rs の 26 行目は pub mod http; なので、http.rs の pub fn read_request と、この行が足す pub fn no_bytes は、結合試験の file（tests/iclose.rs）から tsuzuri_boundary::server::http::read_request のように use で引ける。同じ形の着地済みの例は tests/fserve.rs が use する tsuzuri_boundary::server::ledger::Source と server::ruling。mod.rs の中で私的な mod は config と routes の 2 つだけで、外へは pub use self::config::Config と pub use self::routes::Route で出す（http は私的でない）。 在りかの補い 2（審査の 2 度目の返し・main 8b9c40c で確かめた）。http.rs の 16 行目の pub struct Request は欄 method（String）・target（String）・host と origin（Option の String）・content_length（u64）・body（Vec の u8）をどれも pub で持ち、impl Request の pub fn path（target の字 ? より前・&str）と pub fn query は pub なので、結合試験の file から Ok の Request の method と path() を読める（この行は Request を変えない）。mod.rs の今の字: fn handle（259 行目）の match の腕 Err(_) が Response::text(400, と二重引用符で囲んだ bad-request を返し、二重引用符で囲んだ bad-request は mod.rs でこの 1 か所だけ。handle の後の fn guarded（286 行目）は Response::text で 403 と字 origin・413 と字 too-large・400 と字 bad-body を返し、fn refusal（300 行目）は json に Refusal の http_status と RefusalResponse の encode を渡し、fn json（321 行目）は Ok なら Response::json・Err なら 500 と字 encode を返す。guarded・refusal・json のどれも字 bad-request を持たず、この行はこの 3 つを変えない。const READ_TIMEOUT の行（148 行目）は Duration::from_secs(10); で、境界の crate の Cargo.toml の dependencies の表は tsuzuri-contract と tsuzuri-core の 2 つだけ（この行は足さない）。 crates/tsuzuri-boundary/src/server/http.rs（write-set・標準 library だけ）は、私的な const HEAD_MAX（16 * 1024 byte）と pub const BODY_MAX（65536）と私的な const BODY_DRAIN_MAX（1024 * 1024）、pub struct Request（method・target・host・origin・content_length・body と path・query・too_large・same_origin）と pub struct Response（new・json・text・header・write_to）を持つ。pub fn read_request（impl Read を受け io::Result<Request>）は stream を BufReader で包み、閉包 next_line（行を空にし、take(HEAD_MAX) を掛けた read_line で 1 行読み、読んだ byte の数を head に足し、0 byte か head が HEAD_MAX を越えたか改行で終わらなければ bad の誤り）で要求の行を読み、字の空白で 3 つ（method・target・version）に分けられないか version が HTTP/1. で始まらないか target が / で始まらなければ bad、頭の行を空行まで読み（鍵 Content-Length の値が数でなければ bad・Host と Origin を持つ）、Content-Length が BODY_MAX 以下なら本文を take で読んで足りなければ bad、BODY_DRAIN_MAX 以下なら読み捨てる。私的な fn bad は ErrorKind の InvalidData の io::Error を作る。read_line の読みの誤り（時間切れを含む）は ? でそのまま返る。Linux では set_read_timeout の上限を越えた読みは ErrorKind の WouldBlock（ほかの OS では TimedOut）。Response の write_to は字 HTTP/1.1 と状態と語の 1 行と、Content-Type・Content-Length・X-Content-Type-Options（nosniff）・Connection（close）と足した頭の行と本文を書く。同じ file の mod tests に lib の歯 5 本（server_min_http_reads_request・server_ask_http_keeps_body_and_heads・server_ask_http_same_origin・server_view_http_query_unescapes・server_min_http_writes_response）が在る。 形（http.rs）。pub fn no_bytes（&io::Error を受け bool）を足す。read_request は、要求の行の最初の byte を待つ読み（例 BufReader の fill_buf を先に撃つ）が 0 byte で終わった（相手が閉じた）か読みの誤り（時間切れの WouldBlock と TimedOut・相手の切断ほか）で終わったとき、no_bytes が真になる誤りを返す（Interrupted は今の read_line と同じく読み直す）。no_bytes は read_request がこの時に返した誤りだけで真で、ほかの誤り（bad の InvalidData の全部・1 byte でも届いた後の読みの誤り）と、read_request の外で作った io::Error（io::Error::from(ErrorKind::WouldBlock)・io::Error::from(ErrorKind::UnexpectedEof) ほか）では偽にする（印の決め方は問わない・例 私的な型を包んだ io::Error を作り get_ref の downcast で見る）。1 byte でも届いた後の決まり（next_line・HEAD_MAX・要求の行の形・頭・本文）と Request と Response と 3 つの定数は変えない（CR LF だけの行と UTF-8 でない byte も、byte が届いたので今のまま 400 の側）。 形（mod.rs）。fn handle の match の先頭に、Err で http::no_bytes が真なら何も書かずに戻る腕を足す（接続は TcpStream の drop で閉じる）。ほかの Err は今のまま Response::text(400, 二重引用符で囲んだ bad-request)。READ_TIMEOUT（10 秒）と WRITE_TIMEOUT とほかの腕と後の fn は変えない。mod.rs に二重引用符で囲んだ /api/ の字を足さず、字 fn route(・fn around(・fn account(・fn post_ruling・fn post_batch・fn post_policy・fn post_heartbeat・HEARTBEAT_PATH・pub struct Config を書かず、mod config; と pub use self::config::Config; と fn aged( と READ_AGE_HEADER を残す（下の着地済みの歯が mod.rs の字を読む）。 Chrome の側（この行の歯の外・見込み）。server が何も書かずに閉じた先の接続は、読める byte が無く閉じているので、Chrome は使い回す前に捨てる。使い回す接続に要求を書いた時に閉じられた（時間切れと重なった）ときは、Chrome は使い回した接続の誤りとして新しい接続で撃ち直す。着地の後に席が実物（headless の Chrome でしばらく空けた後の最初の fetch）で 200 を確かめる（計画 7 節の段 5）。 着地済みの歯（直さずに通る・write-set の = ほか）。tests/server_min.rs の server_min_non_get_405_writes_nothing は末に、字 GARBAGE と CR LF CR LF を書く要求（歯の fn request は書いた後に書きの側を閉じずに read_to_end で待つ）の状態を 400 と見る。GARBAGE の byte は届くので 400 のまま。ほかの server_min_ も fn handle を通る（台帳の口・面の file・SSE・405）。lib の server_min_http_reads_request は read_request が GET / HTTP/1.1 と CR LF だけ・GET と CR LF CR LF・target が http://x/ の要求の行・Content-Length の値 x の 4 つを誤りと見て、server_ask_http_keeps_body_and_heads は本文の切れを誤りと見る（is_err だけを見る・どれも byte が届いた後の誤りなので誤りのまま）。server_ask_http_same_origin・server_view_http_query_unescapes・server_min_http_writes_response は Request と Response だけを見る。mod.rs の字を読む歯は hbconf_config_moves_to_config_rs（pub struct Config が無く mod config; と pub use self::config::Config; が在る）・hbpost_mod_rs_drops_post_fns（fn post_ruling・fn post_batch・fn post_policy・fn post_heartbeat・HEARTBEAT_PATH が無い）・hbroute_mod_rs_keeps_only_events（fn route(・fn around(・fn account( が無く、二重引用符で囲んだ /api/ の字が /api/surface/events の 1 つだけ）・rhold_wiring_text（fn aged( と READ_AGE_HEADER が在る）の 4 本。http.rs の字を読む歯と、1 byte も送らない接続の応答を待つ歯は無い（tests と src の歯を grep で確かめた）。hbconf の fn config を見る 9 つの file の表は server_min.rs ほかの決まった名で、新しい tests/iclose.rs は入らない。 測り方。新しい歯は境界の crate の tests/iclose.rs に置き、名を iclose_ で始める。iclose_no_bytes_kinds は歯の中の読み手（順に byte の塊か ErrorKind の誤りを返し、尽きたら 0 byte を返す Read）を read_request に渡す（CR LF は byte 13 と 10）。server を立てる歯は tests/server_min.rs の Place と同じ形（CARGO_TARGET_TMPDIR の下の作業場・字 [] を出す sh の偽の bd・repo の .beads の dir・面の file の置き場の index.html・Config の bd を偽の bd にし残りの欄を Config::new で埋める・Server::bind で 127.0.0.1 の port 0 に立て thread で run）で、要求は std の TcpStream で撃ち、歯の側の読みの上限は 5 秒にする。10 秒の READ_TIMEOUT は待たない（時間切れの道は、iclose_no_bytes_kinds の WouldBlock と TimedOut の読み手と、iclose_handle_wiring_text の字で見る）。iclose_handle_wiring_text は CARGO_MANIFEST_DIR から src/server/mod.rs と Cargo.toml を読む。自分の名の歯は tests/iclose.rs の字を読み、test の属性の行の次の fn の名を全部集め、名の数が 5 以上であることと done (6) を見る。fixture は書かない。 filter の語（着地済みの行の verify の filter の語と、計画の後の行 g-gz の接頭辞 pgz_ と、同じノートの行 g-graph-label の接頭辞 glabel_・この行の接頭辞 iclose_ は並べない・ほかの語を部分の字として含む語は省いた）は aaround_・accept_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・board_min_・bport_・brand_・btuck_・cadopt_・cgdom_・contract_form_・cround_・csled_・flight_・fmark_・frame_・fserve_・fstop_・gapspage_・ghb_・gnav_・graph_・gsum_・gtuck_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hcard_・hcproj_・hcsess_・hfig_・hook_・hru