section = "3"
write-set = ["crates/tsuzuri-boundary/src/stage/cli.rs", "crates/tsuzuri-boundary/tests/stcli.rs", "=crates/tsuzuri-boundary/tests/sttgt.rs", "=crates/tsuzuri-boundary/tests/stbp.rs"]
verify = ["cargo nextest run -p tsuzuri-boundary --test stcli --no-tests=fail stcli_", "cargo nextest run -p tsuzuri-boundary --test sttgt --no-tests=fail sttgt_", "cargo nextest run -p tsuzuri-boundary --test stbp --no-tests=fail stbp_", "cargo run -q -p xtask -- check"]
