title = "tz stage open が端末の窓を起こすか頁の窓を 1 つ作った時も、端末の錠の中で表示先の設定に初めて見せた印を書き（--to の在る無しによらず・印が在れば書き替えない）、設定の path が決まらないか設定が読めなければ ssh を撃つ前に断る"
