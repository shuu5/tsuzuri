done = "(1) 境界の crate の tz stage open --to term-a が偽の端末で窓を起こすと、rc は 0 で標準出力は 3 行（字 端末 term-a に表示面の窓を起こした・term-a の印の行・board の URL の行）、--config の設定の file の印の表は term-a の 1 つだけで、その値は撃つ前と後の epoch 秒の間、file の mode は 0600 である。窓が在る 2 度目の open --to term-a は 2 行（字 端末 term-a の表示面の窓は在る（起こさない）・URL の行）で、印は変わらない。既定を term-a にし窓を閉じた後の --to を省いた reload は rc 1 の 2 行で、1 行目は字 端末 term-a に表示面の Chrome の窓が無い と字 tz stage open を含み、2 行目は URL の行、偽の端末の Chrome が受けた要求は GET /json/version の 1 つだけ、偽の ssh の撃ちは 1 度だけ増え、窓を起こす回の印の file は無く、印は変わらない（歯 stcli_open_marks_shown） (2) 印の表に term-a と 7 の組だけを持つ設定で窓を起こした open --to term-a は、rc 0 の 2 行（字 端末 term-a に表示面の窓を起こした・URL の行）で、印の表は term-a と 7 の組だけのまま（歯 stcli_open_keeps_old_mark） (3) 設定の file の字が HEAD の行と表 [screen] の時、open --to term-a は rc 1 の 2 行で、1 行目は字 表示先の設定 と設定の file の path と字 知らない表 [screen] を含み、2 行目は URL の行、偽の ssh は撃たれず、設定の file の字は変わらない（歯 stcli_open_bad_config_first） (4) 窓を起こした open --to term-a の標準出力は、字 端末 term-a に表示面の窓を起こした・term-a の印の行・URL の行の 3 行（歯 stcli_open_raises_once） (5) 動いている Chrome に頁を 1 つ作った open --to term-a の標準出力は、字 端末 term-a の表示面の Chrome に頁の窓を 1 つ開いた・term-a の印の行・URL の行の 3 行（歯 stcli_open_makes_one_page） (6) tests/stcli.rs の歯は 20 本で、どれも名が stcli_ で始まり、その後の字は歯の file の 126 の filter の語のどれも含まない（歯 stcli_own_names_clean） (7) cli.rs の字 tunnel.window(&board.url, first) と target::mark(path, &name, now()) と (true, Some(_)) => Some(lock(&base, &name, LOCK_WAIT)?) と !target::load(path)?.shown.contains_key(&name) はどれも 1 度だけ在る（歯 sttgt_source_guards）"
goal = "在りかの main は 8f8eeb8（計画 surface-plan v0.81）。境界の crate tsuzuri-boundary の lib.rs の pub mod stage の下の file（crate の外からは tsuzuri_boundary::stage::<名>）。この行はノートの 2 行の前の行で、後の行 i-10（同じノート・cli.rs を書く）はノートの depends でこの行の後に流す。 なぜ。持ち主が閉じた窓は開き直さない（持ち主の裁定 t3-hub.59.7・判断の記録 ADR-15 の決定 (6)）。行 i-7（着地済み）は --to を省いた撃ちが窓を起こした時だけ表示先の設定に端末ごとの印を書き、印の在る端末の窓は起こし直さない。tz stage open は印を書かないので、持ち主が open で窓を開いてから閉じた後の最初の --to を省いた撃ちは、印が無いため窓を 1 度だけ起こし直す。open でも印を書き、この穴を閉じる（行 i-7 の起草の問い 2・席の決め 2026-09-29）。 在りか・cli.rs（write-set・今の main の字）。私的な fn open（call と端末の行と口座の dir と Board を受ける・端末の錠 lock を持ち、tunnel の socket_dir と Tunnel の open の後に window を may_open 真で撃ち、Page の launched 真なら字 端末 <名> に表示面の窓を起こした、launched 偽なら字 端末 <名> の表示面の窓は在る（起こさない）、Absent なら私的な fn new_page で頁を 1 つ作り window を may_open 偽で撃ち直して字 端末 <名> の表示面の Chrome に頁の窓を 1 つ開いた、の 1 行を出す）。私的な fn stage は --to の在る撃ちでは端末の名だけを持ち、--to を省いた撃ちでは pub fn config_path と target の load と pub fn aim で端末を決め、どちらも open なら fn open を呼ぶ（設定の path は渡さない）。--to を省いた open 以外の撃ちは、印が無い時だけ錠の中で印を読み直して窓を起こしてよいと渡し、起こしたら target の mark（path と名と私的な fn now の epoch 秒）で印を書く。target の pub fn mark は設定を読み直して印が無い時だけ足して書き、書いた時だけ真を返す（在る印は替えない）。pub fn load は無い file を空の設定に読み、形の外れた字は file の path と行の番号を名指す Err にする。pub fn config_path は --config が在ればその path、無ければ XDG_CONFIG_HOME と HOME で決め、どちらも絶対の path でなければ Err。 形（cli.rs）。module の doc に 1 行（tz stage open も窓を起こすか頁を 1 つ作った時は、錠の中で同じ印を書く・--to の在る無しによらない）を足す。fn open の doc に 2 行（窓を起こすか頁を作った時は錠の中で印を書く・印が在れば書かない／設定の path が決まらないか設定が読めなければ ssh を撃つ前に断る）を足す。fn open は錠を取った後、config_path に call の config を渡して設定の path を決め、target の load でその設定を読んでから（どちらの Err もそのまま返す＝tunnel の ssh を撃たない）tunnel を引く。window の 3 つの枝は出す 1 行と、窓を起こしたか頁を作ったかの真偽の組を返し、窓の在る枝だけが偽。1 行を出した後、真の時だけ target の mark に設定の path と端末の名と now を渡し、mark が真なら字 表示先の設定に端末 <名> の印を書いた（持ち主が閉じた後は --to を省いた撃ちで起こし直さない） の 1 行を出す。fn open の署名・fn stage・ほかの fn は変えない。 出力（URL の行は fn run が最後に出す・今のまま）。窓を起こした open と頁を作った open は、今の 1 行の後に印の行（表示先の設定に端末 <名> の印を書いた（持ち主が閉じた後は --to を省いた撃ちで起こし直さない）・名は端末の名）を出し、その後に URL の行。印が既に在れば印の行を出さない。窓が在る open は今のまま 2 行。 変わらない行と読む順と落ちる時（歯で測らず、この行の差分で持つ）。変わらない: 窓を起こす回数（1 回だけ）・頁を作る手（Target.createTarget を 1 度）・端末ごとの錠と待ち LOCK_WAIT・席の中の open の断り・--to を省いた open で設定に値が無い時の断り・--to を省いた open 以外の撃ちの印の書き方。読む順: 錠 → 設定の path → 設定の読み → tunnel → window → 1 行 → 印。印は錠を持ったまま書く（同じ端末の --to を省いた撃ちは同じ錠の中で印を読み直すので、窓を 2 つ起こさない）。落ちる時: 設定の path が決まらない・設定が読めないなら ssh を撃たずに断る（rc 1・URL の行は出す）。印を書く時の書きの Err は、窓の 1 行の後に Err として出す（rc 1）。 決めた幅（起草の決め）。(a) 印を書くのは窓を起こした時と頁の窓を 1 つ作った時の 2 つ（持ち主の頼みで表示面を見せた時）で、窓が既に在る時は書かない（在る窓は誰かが起こした窓で、この撃ちは見せていない）。(b) --to を渡した open でも印を書く（印は端末ごとで project によらない・持ち主が --to で開いた端末を閉じた後も、--to を省いた撃ちが起こし直さない）。そのため --to の在る open も表示先の設定の path を決めて読む。(c) 設定を ssh の前に読む（形の外れた設定のまま窓だけ起こして印の無い形を残さない・条 P-7 の黙って既定へ落とさない）。この読みで、--to の在る open は、HOME も XDG_CONFIG_HOME も絶対の path でない環境と、形の外れた設定の時に新しく断る（持ち主は設定を直すか --config で渡す）。(d) 印の値は i-7 と同じ epoch 秒（fn now）で、在る印は替えない（初めて見せた時を残す）。 着地済みの歯と読み手（全部の crate の tests と src と xtask を grep した・字 src/stage と cli.rs と fn open と target::mark を読む歯）。境界の歯 stcli（cli.rs と mod.rs と tunnel.rs の字・4 つの crate の src の createTarget の在りか）は書く。sttgt の sttgt_source_guards は cli.rs の 4 つの字を 1 度ずつ見る。この行の印の書きは字 target::mark(&config, name, now()) で、sttgt の見る字 target::mark(path, &name, now()) と違うので数は 1 のまま（= で持つ）。stbp の stbp_wiring は cli.rs の字 drive(session, script, board, &ports) を 3 度ほかを見る（この行は drive を足さない・= で持つ）。strelay と stlaunch は mod.rs を見る（この行は mod.rs を書かない）。契約・中核・面の crate と xtask に cli.rs を読む歯は無い（xtask の pub-scan は追跡される全部の file を読むので verify の xtask check で撃つ）。置かれた行 i-9（ノート surface-wave21e・未着地）の新しい歯 stskill は cli の pub fn parse_target と pub enum Setting と pub struct TargetCall を使うが、この行はそれらを変えない（write-set に入れない）。 測り方・歯（tests/stcli.rs・着地済みの file を書く）。偽の場 Field に欄 config（場の下の cfg/stage.toml）を足し、fn tz は全部の撃ちに --config とその path を渡す（持ち主の設定の file を読まず書かない）。use に std::time の SystemTime と UNIX_EPOCH と、stage::target の module と Targets を足す。const MARKED_A（term-a の印の行の字）と、私的な fn epoch（今の epoch 秒）と fn shown（場の設定の印の表を名と数の組の Vec に）を足す。着地済みの歯 stcli_open_raises_once と stcli_open_makes_one_page の期待に MARKED_A を足し、stcli_own_names_clean の歯の数を 17 から 20 にする。新しい歯 3 本: stcli_open_marks_shown（窓の無い端末へ open・2 度目の open・既定 term-a で窓を閉じた後の --to を省いた reload）・stcli_open_keeps_old_mark（印 term-a と 7 を持つ設定で窓を起こす）・stcli_open_bad_config_first（HEAD の行と表 [screen] の設定）。同じ場で偽の端末の Chrome の待ち受けを 2 度目に起こす前に、場の socket の file を消す。歯の名は stcli_own_names_clean が見る 126 の語と、main の contracts の verify の filter の語のどれも stcli_ の後に含まない。 試作（main 8f8eeb8 を scratch に git clone した木に commit）で、stcli 20 本・sttgt 10 本・stbp 5 本が通った。噛み: 印を書かない（marks_shown・raises_once・makes_one_page が落ちる）・ssh の前に設定を読まない（bad_config_first が落ちる）・在る窓でも印を書く（着地済みの stcli_open_reuses_window と waits_for_lock が落ちる）・在る印を書き替える（keeps_old_mark が落ちる）。 依存と順。depends は空。後の行 i-10（同じノート）は cli.rs を書くので、ノートの depends で i-10 をこの行の後に流す。計画の 5 節の鎖は boundary/stage/cli.rs が i-5 → i-7 → i-board-ports（3 行とも着地済み）→ i-open-mark → i-10。着地した便 g-nav（面の file）と留めの便 c-limit-resume（seat の file）は boundary/stage と歯 stcli・sttgt・stbp を書かない。 範囲の外。印を外す口（持ち主が同じ端末にまた窓を起こしてよいとする口）と board の開く button（行 i-8）。--to を省いた撃ちの印の書き方（行 i-7 のまま）。知らせ（行 i-10）。"

[[contract]]
