goal = "在りか。差の file docs/design/patch/v-close-host.patch（144,248 byte）は、main 87623125 と、その上の試作（写しは drafts の try-w278a の branch w278a・前の差〔係 w263a の試作と続きの係 w265a・w266a・w275a の直し・main 777aad43 の差〕を main 87623125 に当てた commit bd3e7e1d と、その上の係 w278a の直しの 2 つの commit〔先端 2d87d119〕）の差。2026-10-06 に、便 t3-hub.90.3 の gate の FAIL（contract-fit・撃ち直しが受けた --rules を GitHub の検査の子へ渡さない）を係 w275a が直し、2 度目の便の契約審査の FAIL（literal-mismatch・要件 FR1091 と器の判断の記録 ADR-1094 と器の設計 ledger-form.md §16 が尾を閉じた 3 形と CI の後の close に固定する）を係 w278a が判断の記録 ADR-68 と要件の但し書きと ledger-form.md §16 の直しと読み手の歯で直した。器の終端 scribe2/crates/scribe2/src/pipe/land/finish.rs、終端の結末の型の doc と in-file の歯 land.rs、着地をやり直さない口 cli/step.rs と flag の閉包 cli/args.rs と案内 cli.rs と案内の頁の FORM の字 help.rs、台帳の閉じた理由の読み手 ledger/close_reason.rs（尾 host=green の読みと歯）、局面の関数 ledger/phase.rs と ledger/phase_main.rs（in-file の歯だけ）、規則の行 pipe.ci_wait_s と pipe.ci_poll_s の注（値と裁定 id は替えない）、器の設計 contract-source.md の §5 手順 2 と 3 と §50 の追記と ledger-form.md §16（文法の表と形 1 と締め出しの字を尾の閉じた 4 形に直す）、器の e2e の歯の file 3 本と、pipe の使い方の行の写しの snapshot（e2e の歯 pipe_external_form が比べる）を書く。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 なぜ。持ち主は 2026-10-05 に台帳の問い t3-hub.90.2 で甲（推奨）を選んだ（裁定 id t3-hub.90.2:20261005T2257Z-1）。器は着地の後に GitHub の検査を最大 900 秒待ってから札を閉じ、その札を待つ後の便はそれまで起きない（10-05 の 79 便で着地から close まで中央 373 秒・7 便は GitHub の障害で札が残り席が手で閉じた）。器は着地の前の gate と着地の後の主実測でこの host で同じ検査を撃っているので、札はこの host の緑で閉じ、GitHub の検査は外の環境の追いの確かめとして後から読む。先の裁定 t3-hub.90.1 の丁1（障害の時だけ host で撃つ読み手）は作らない。判断の記録 ADR-68 がこの裁定を写し、器の判断の記録 ADR-1094 の経路 (1) の close の時機と尾（success の周だけ ci=success で閉じる）と ADR-1023 の §2.5 の CI の後に閉じる順を host の緑の周について置き換え、要件 FR1091（尾の正本）と FR1050 と受入 AC1023 に但し書きを足した（要件書の版を上げた）。 形。終端の順を push → close → GitHub の検査の読みに替える。close の理由は landed と sha と host=green の 3 語（尾の型 CloseTail に HostGreen を足す）。台帳の閉じた理由の読み手の尾の型 LandedTail に HostGreen を足し、読めない尾（局面の misfit）にしない。尾は閉じた 4 形になり、host=green は 1 語だけの尾（語を足す・前に置く・字を替える尾は読めない尾）で、局面の出力と memo の自動の close の条件（FR1093）と行の着地の局面は読める尾として着地に数える（phase.rs の landed_by と form_misfit と phase_main.rs の landed_close は読めない尾だけを外すので、code は替えずに in-file の歯で測る）。器の設計 ledger-form.md §16 の文法の表と形 1 と締め出しの字を 4 形に直す（diff の上限 150000 byte のため §16 に追記は置かない）。起票の門は頭 landed の席の close を尾に依らず断る（替えない）。close の後に、着地の後の CI の口 pipe land --run と便 id と --ci-only と照合する sha の子 process を着地後の検出と同じ spawn_self で起こし、待たない（記すのは ci:spawned か ci:unspawned）。呼び手は close の直後に戻るので、列の 1 周が後の便を GitHub の検査を待たずに起こす。子は今の照合（唯一の待ち・間隔 pipe.ci_poll_s・上限 pipe.ci_wait_s・落ちた run を先に見る）で読み、ci:success か ci:failure か ci:unmeasurable を 1 件記し、赤の周は席へ終端の 1 行（落ちた便の 1 行と同じ形・語 ci:failure）を送る。札は替えない。照合する先端が無い周（列の先端でない便で祖先でない・測れない）は子を起こさず ci:unmeasurable を記す。主実測が赤か測れなかった便を受け入れる周（--terminal-only の受け入れの形）は host の緑が無いので、今までどおり先端の CI の success を待ってから ci=success で閉じる。主実測の赤の記帳（段 Failed の main-red）は Landed の後に書けない（記帳の門が Landed で断る）ので使い回さず、知らせの 1 行だけを同じ送達の関数で送る。着地をやり直さない口（--terminal-only の 2 つの形と --ci-only）が共有する land の材料 settled_entry は、受けた --rules を land の道と同じ形で持ち、子 process の --ci-only へ同じ規則を渡す（--rules の無い周は今のまま子も渡さず、子は埋め込みの規則を読む）。CI の答えの語は 1 本の関数 ci_word にし、終端の行と口の stdout が共有する。 done と verify の対応。1 つ目の項は verify の 1 行目、2 つ目の項と 7 つ目から最後の項は 3 行目（器の lib の歯 vclhost_・land.rs と close_reason.rs と phase.rs と phase_main.rs の in-file）、3 つ目と 4 つ目の項は 4 行目（器の e2e の歯 vclhost_）、5 つ目の項は 5 行目から 10 行目（書き替えた着地済みの歯）、6 つ目の項は 8 行目（撃ち直しの歯 pipe_replay_hands_its_rules_to_the_ci_child_only_when_given）が測る。2 行目の clippy は done に載せない守り。欄 done-teeth は器の歯を名で解けないので @k で書く。 歯と噛み。lib の歯は land.rs の in-file に接頭辞 vclhost_ で足す。e2e の歯は器の e2e の pipe/land/cilast.rs の末に同じ接頭辞で足す。着地済みの e2e の歯 19 本（order.rs 13・cilast.rs 4・retire.rs 2）は旧い順（CI の答えの後に close・CI が赤なら閉じない）を断言していたので、新しい順に書き替えた。CI の読みの仕組みの断言（落ちた run を先に見る・schedule の run を外す・照合の間隔と上限）は、着地した便に --ci-only の口を直に撃つ形へ移した（land から撃つと子 process の撃ちと偽 CI の呼びの数が混ざる）。撃ち直しの歯の fixture は、1 周目を CI の赤でなく台帳 client の断り（close で止まり子を起こさない）で止める。名が新しい意味と食い違う 3 本は名を替えた（pipe_terminal_land_pushes_closes_and_hands_ci_to_the_child・pipe_replay_tip_non_ancestor_closes_without_a_read_and_own_tip_reads_its_sha・pipe_train_tip_close_reason_is_host_green_and_failure_still_closes）。CI が赤なら閉じないを断言した 1 本 pipe_terminal_land_ci_failure_does_not_close_the_bead は裁定で断言が反転し、反転した断言は e2e の歯 vclhost_land_closes_on_host_green_before_a_red_ci_answer が持つので消した。子 process は誰も待たないので、land から子を起こす歯は片付けの前に子の答えの行（ci:success・ci:failure・ci:unmeasurable）を上限 60 秒で待つ（助けの関数 settled_rows・待たないと片付けの後に子が置き場の event log を作り直す）。子の答えの追記は親の ci:spawned の記帳と競うので、歯は答えの 1 件を外した親の行の順と、答えが最後の close の後に在ることを断言する（助けの関数 parent_rows）。 撃ち直しの歯 pipe_replay_hands_its_rules_to_the_ci_child_only_when_given は order.rs の撃ち直しの歯の後に足す。器は --run を持つ子を便の bin の下の留めで起こすので、歯は撃ち直しの fixture の便の bin の下に器の名で argv を写す script を置き、子の argv を読む（子の環境を替える flag を器に足さない）。--rules の 2 語だけを外した撃ち直しを否定の見本にし、どちらの周も子の --ci-only と着地した sha を対照に見る。噛みは settled_entry の rules を None に戻す変異で、この歯が rc 100 で落ちる。尾の文法の歯 3 本は lib の close_reason.rs・phase.rs・phase_main.rs の tests の末に同じ接頭辞で足す。否定の見本は正しい理由から尾の 1 語だけを崩す（語を足す・前に置く・字を替える）。噛みは係 w278a の bite-v-close-host.tsv（読み手の尾の照合と、局面の 3 つの読みの読めない尾の外しを替える変異・名指しの歯は全部 rc 100）。 範囲の外。主実測の赤の流れと受け入れの形（判断の記録 ADR-45 の門 H6）・retire の close の理由・終端の結末の 7 値と rc・規則の行の値と裁定 id は替えない。GitHub の検査そのものを外すか（持ち主の追いの言葉）は席が別に答え、この行は CI を残して待ちだけを外す。席の道具 close-unmeasurable.sh と close-unmeasurable-v2.sh（ci:unmeasurable の札を手で閉じる）は、この行の着地の後に要らなくなる（席の手で退ける）。器の設計のほかの doc に残る着地済みの行の範囲の字（pipeline.md の着地済みの節の「触らない: 終端の 3 段の順」など）は、その行の着地の時の記録で直さない（今の順の正本は contract-source.md §5 と ledger-form.md §16 の締め出しの字・係 w278a の notes の表）。"

