goal = "在りか。差の file docs/design/patch/c-code-nodes.patch は、main 9f2b47b4 と、その上の試作の commit 54f8d92f（tree 02830e79・写しは drafts の try-w282a の branch w282a・係 w282a・2026-10-06）の差（8 file・うち新しい file 5）。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 なぜ。持ち主の診断（memo t3-hub.80）は、設計（席と起草係）が行を書く時に、その行が触る code をグラフから引けず、契約が code と食い違って審査と gate で落ちることである。導出グラフは設計の節点と着地の commit の節点だけを持ち、file と定義の節点を持たない。判断の記録 ADR-46 は code のグラフを tsuzuri の専用の機能として作ると決め（決定 (1)）、節点に file と定義を足し（決定 (2)）、定義の名前を path と入れ子と名と種類で決め（決定 (3)）、関数と型の範囲を構文で探す道具の言語ごとの規則の file で読む（決定 (4)）。この行はその最初の段で、行の write-set の file の関数と型を引く口までを置く。呼び手と参照の目・commit → 定義・歯の節点は後の行に置く。 形。 - 規則の file .config/code-defs.yml（新しい file）。ast-grep の Rust の rule 12 本で、rule の id は定義の種類の語 fn・struct・enum・union・trait・type・const・static・macro・mod・impl と、trait の impl の impl-for。どの rule も名を meta 変数 NAME に捕え、impl-for は trait の名を TRAIT にも捕える。fn は本体の在る関数と trait の中の宣言を、type は型の別名と関連型を、mod は本体の在る module と file の module の宣言を拾う。 - 中核 crates/tsuzuri-core/src/graph/code.rs（新しい file・graph/mod.rs に pub mod code と module の doc の 1 行）。file も子 process も触らない純粋な関数で、ast-grep の scan の stream（1 行 1 つの JSON）から欄 ruleId・file・language・range（byteOffset と行）・metaVariables の single だけを読む read_defs、契約表の導出物の toml の [[contract]] の塊の id と write-set を読む read_write_sets、git ls-files -z の字と定義と行の write-set から code の層 CodeGraph を組む build、問いの関数 file_defs・row_writes・row_defs を持つ。定義の種類は閉じた 11（DefKind）で、言語の表 LANGS は Rust の 1 行。入れ子は同じ file の byte の範囲の包みで決め、名前は file の path の後に記号 # と段を / で繋いだ字（段は種類の語と空白と名・例 scribe2/crates/scribe2/src/ledger/close_reason.rs#enum LandedTail）。種類も名も同じ 2 行は 1 つの節点に範囲を足す。write-set の印は + 新しい file・- 縮むが残る・~ 着地で消える・= 置き場だけ・末の / は dir で、= は辺を組まず、file に当たらない項は unbound に数える。 - 境界 crates/tsuzuri-boundary/src/cli/code.rs（新しい file・cli/mod.rs に pub mod code と doc の 1 行・main.rs に subcommand code の腕と doc の 1 行）。口は tz code [--repo <dir>] [--sg <program>] [--row <ノート>#<行> | --file <path>]。規則の file が無ければ道具を撃たずに標準エラーへ 1 行で断り rc 1。在れば repo で git ls-files -z と <sg> scan --rule .config/code-defs.yml --json=stream を撃ち（--sg の既定は ast-grep・上限 120 秒）、contracts/ の直下の .toml を読み、行の id を file の名の .toml の前と # と行にして組む。出力はタブで区切った行で、旗なしは数（files・defs・種類ごとの kind・rows・writes・unbound・skipped）、--row は辺ごとの file の行（path・項・定義の数）とその file の def の行（名前・範囲）と file に当たらない項の none の行、--file は def の行。字が読めない時（道具か git の rc が 0 でない・stream に読めない行・導出物に読めない行）は rc 2、無い行と git の一覧に無い file と使い方の誤りは rc 1。 - 面の server と口 /api/graph と tz graph は替えない。code の層を導出グラフの既定の組みに入れると、毎回 ast-grep を撃って数万の節点を電文に載せ、面の server の軽さ（規則の行 R-34）に効くため。電文と面へ載せるかは後の行で決める。 - 要件 FR2 の when と shall と plain に code の層を足す（適用の script が srs.yaml を直す）。 done と verify の対応。1 番目の項は verify の 1 行目、2 番目から 9 番目の項は 3 行目（新しい歯の file crates/tsuzuri-core/tests/cdnode.rs・項の順と歯の順は同じ）、10 番目から最後の 13 番目の項は 4 行目（新しい歯の file crates/tsuzuri-boundary/tests/kcode.rs）で測る。2 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので書かない。入口の赤は、main には 2 本の歯の file が無いので 3 行目と 4 行目が --no-tests=fail で落ちる。 歯と噛み。中核の歯は見本の stream の行を JSON で組み（ast-grep 0.45 の scan の行のうち中核が読む欄）、境界の歯は一時の git の repo と、撃たれた引数を file に書いて見本の stream を出す偽の道具（shell の script）で tz の binary を撃つ。CI の job は ast-grep を入れないので本物の道具は撃たない。規則の file は外の道具の data で振る舞いで測れないので、歯 cdnode_rule_file_names_every_kind は rule の id の集まりと言語と捕える名の字を照らす。否定の見本は 1 句ずつ外す（種類も名も同じ 2 行・write-set の外の file・置き場だけの項・欄の欠けた行・JSON でない行・言語・rule の id・名・trait の名を 1 つずつ）。噛みは係が撃ち、15 の変異が全部 rc 100 で名指しの歯の断言で落ちた（表は係 w282a の notes.md）。 実物の測り（係 w282a・2026-10-06・試作の木 02830e79・debug の tz・host の 1 分の負荷 5〜16）。全木（根の crates・xtask・folio2・scribe2）の tz code は 1.5〜5.7 秒・RSS 約 124 MB で、時間の大きな分は ast-grep の scan（stream は定義の本文の字も持ち約 100 MB）。file 2,897・定義 34,815（fn 24,338・const 5,812・struct 1,456・mod 1,386・impl 967・enum 648・type 165・static 28・macro 10・trait 5・union 0）・行 522・行 → file の辺 4,260・file に当たらない項 1,940・組まずに数えた行 0。行 v-close-host（未着地）は write-set の 13 file に辺を組み定義 405、行 v-gate-carry（着地済み）は 8 file で定義 784。 依存と順。depends は書かない。差の file が書く着地済みの file は graph/mod.rs・cli/mod.rs・main.rs の 3 本で、どれも 2 行を足すだけ。置く直前に席が main で当たりを撃ち直す。器の行 t-index-on（係 w281a）は根の .vessel.toml と .config/index-roles.yml を書き、この行の file と交わらない。 範囲の外。呼び手と参照の目（器の索引の読み・後の行 c-code-refs）・commit → 定義と git の記録からの一括の入れと結びの無い定義の数（後の行 c-code-commits）・歯の節点（後の行 c-code-teeth）・TypeScript と Python の rule（後の行 c-code-langs）・電文 GraphDoc と面と近傍への載せ。未着地の行の差の file の hunk で触る定義を絞ること（着地の後は commit → 定義が持つ）。"

