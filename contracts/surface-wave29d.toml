宣言の共通 verify（受付の早い段の freeze の有効値の common_verify）と空白の並びの外で同じ行を refuse=verify-common の 1 行にする。断りの字は、行 <doc>#<id> の verify <字> と、前者は語の数と語の列と最後の語と「1 行に filter の語を 1 つずつ割る」、後者は「行の verify から外す」を持つ。 - 描き。render の 5 番目の引数を（acceptance の照らし・verify の欄の断りの列）の対にし、断りの行は acceptance の断りの後に verify の行の順に並べ、末尾の件数と rc に数える。材料を読めない周と行を引けない周（早い断り）は照らさない。module の doc の stdout の行の列に 2 つの名を足す。 器の設計の字との照らし。器の設計文書は凍った資料（判断の記録 ADR-36 の決定 (7)）なので直さず、この節が新しい振る舞いを書く。contract-source.md の 21 節は preflight の stdout の行の列を名指す（refuse= は judge の断り）が、preflight だけの断りの行は行 v-accept-ptr の前例と同じくこの節が足す。43 節 (2) の後ろが正本は読み手の読みのまま替えない。27 節（受付は契約の散文 goal と done を走査しない）の外で、読むのは verify の欄だけ。要件 FR1048 は preflight の行の列を固定しないので替えない。 既存の歯の fixture の直し。器の共通 verify（入れ子の器の nextest）を係 w279a の試作の木で全部撃つと（--no-fail-fast）、既存の器の e2e の歯 5 本が新しい断り verify-common で落ちた（受付の歯 pipe_intake_code_facts_equal_claims_pass_and_a_changed_count_is_refused_with_sites と pipe_intake_index_closure_failed_state_degrades_to_the_literal_closure_with_the_tail・preflight の広がりの歯 preflight_widen_names_the_row_and_its_missing_files と preflight_widen_says_unmeasured_when_the_head_table_is_unreadable と preflight_widen_stays_out_of_the_refusal_count）。5 本とも、toy の行の既定の verify git status（tests/e2e/pipe.rs の table_row）が toy の導出の宣言の共通 verify git status（同じ file の DERIVE_VESSEL）と同じ字で、preflight の rc 0 か件数 1 を断言していた。断りは同じ字の行だけを断っており広すぎないので、断りの側は替えず、fixture の行の verify を git diff --stat に替えた（ixc_row と cf_row は器の e2e の dispatch.rs も使うが、そこの歯は verify の字を見ない）。既存の歯の断言は外していない。verify-filters で落ちた歯は 0 本。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done の 1 番目の項は verify の 1 行目、2・3 番目の項は 3 行目（器の lib の歯 vpfgap_ の 2 本・在りかは pipe/cli/preflight.rs の歯の区間）、4 番目の項は 4 行目（器の e2e の歯 vpfgap_ の 1 本・在りかは e2e の pipe/intake/vpfgap.rs）、5 番目の項は 5 行目から 8 行目（着地済みの読み手の歯 closure_scope_・preflight の歯 vaccpt_ と pipe_preflight_）、最後の項は 9 行目から 11 行目（fixture を直した着地済みの歯・在りかは e2e の pipe/intake.rs と pipe/spawn.rs）で測る。verify の 2 行目（器の clippy）は done の項に載せない守り。xtask の check は器の共通 verify が gate の各段で撃つので verify に書かない。 歯と噛み。噛みは試作の commit の上で句ごとに 1 つの変異（--manifest-path の消費を外す・語の数の縁を 2 から 3 へ・空白の並びの照らしを字の等しさへ・-- の後ろの語を最後の 1 つだけにする・共通 verify の照らしを止める）を当て、器の lib の歯 vpfgap_ を撃って 5 つとも rc 100 で落ちた（表は係 w279a の bite-w279a.tsv）。係 w287a は判じの関数を替えていないので、この噛みは差の src にそのまま当たる。最後の項は着地済みの歯が緑であることだけを言い、fixture の替えを戻すと 5 本が verify-common で落ちることは係 w287a が直す前の木の器の nextest で見た。 範囲の外。受付の judge・表の検査・起動の列・審査の対応の表の読み（selects）は替えない。節の差の file の byte と行の数の照らし（27 節に外れる・席の判じ）と、bead の acceptance の照らし（行 v-accept-ptr の --placed で既に在る）は入れない。"
