goal = "done と verify の対応。1 つ目の項は verify の 1 行目、2 つ目から 6 つ目の項は 3 行目（段の file crates/tsuzuri-boundary/tests/hapi.rs・接頭辞 hapi_）、7 つ目の項は 5 行目（面の群 teeth2 の module bvtrim）、8 つ目の項は 4 行目（契約の型の群 teeth1 の module cform_surface・この行は snapshot の json だけを直す）、9 つ目の項は 6 行目（面の群 teeth2 の module evkindview・書かない）、最後の項は 7 行目（面の群 teeth4 の module ntcface・書かない）で測る。2 行目の clippy は lint の落ちが無いことを命令の rc で測る守りで、done の項にしない。xtask の check は器の共通 verify が撃つので verify に書かない。この行が書かない歯の file で verify の行が当たる 3 本は置き場だけの項（=）で write-set に置く。 在りか。差の file docs/design/patch/h-host-api.patch（26,276 byte・git diff --full-index・8 file・足す 440 行・消す 8 行）は、行 h-host-core の試作の commit 24a4b0c6 と、この行の試作の commit 55c4d798（同じ写し）の差。第 0.7 版で行 h-host-core の差を置き換えた後も、この差は直した中核の試作の commit b94362a8 の上に git apply --check が rc 0 で当たり、当てた木で verify の 2 行目から 7 行目が rc 0（係 w262a）。新しい file は境界の crates/tsuzuri-boundary/src/server/host.rs（196 行）と口の crates/tsuzuri-boundary/src/server/routes/host.rs と段の file crates/tsuzuri-boundary/tests/hapi.rs（199 行）。字を書き替える file は境界の server/mod.rs（471 → 480 行）・契約の型の surface.rs（種類 Host と ALL の数）と snapshot の surface.json（値 host）・面の view.rs（表の 16 行目）と群の歯 bvtrim.rs（表の行の数と host の口の種類）。土台の木で git apply --check、試作の木で git apply --reverse --check がどちらも rc 0。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 depends は h-host-core。この行の境界の code が中核の host_doc・budget_rows・rate・sectors_written と契約の型 HostDoc と口の path を呼ぶので、行 h-host-core の着地の前には組めない（並べられない訳）。 なぜ。持ち主の裁定 t3-hub.77.28 の推奨は、面の server の新しい口 /api/host がその場で読み、変化の種類 Host を今の SSE に 1 つ足す形（database に新しく書かない・条 P-20）。kernel の file は更新時刻と長さが動かないので、今の板の印の見張り（更新時刻と長さ）では見えない。そこで局面の出力の中身の見張り（Cases の watch）と同じ形の見張りを足し、受け手が居る周だけ読んで、組んだ時刻を除く電文が前に送った周と違う時だけ host の種類を送る。受け手が居ない周は読まず、前の中身を忘れる（規則の行 R-34 の頁を開いていない時）。 形。読む file は、根からの相対の kernel の 6 本（proc/loadavg・sys/devices/system/cpu/online・proc/pressure の cpu と memory と io・proc/meminfo）と、自分の cgroup（proc/self/cgroup の、0 と 2 つのコロンで始まる行）の親の dir の下の子の dir ごとの memory.current と memory.max（席と便の scope は同じ親の下に並ぶ・名を code に焼かない）と、state dir の host.toml の書きの測りの表の行の stat と wear の path。根は本物では / で、歯は一時の dir に写しの木を置いて根を替える（with_root）。装置の path は表から読み、code に焼かない（条 N-7）。書きの速さは装置ごとに前の読み（区の数と読んだ ms と速さ）を控え、前の読みから RATE_GAP（5 秒）に満たない読みは前の速さを返す（口の要求と見張りの読みが続いても揺れない）。見張りの間 HOST_POLL は 10 秒（規則の行 R-21 の 5 秒は器の event と台帳の変化の値で、host の値の周期はこの行の定数）。面の読み直しの表には host の口を host の種類だけで読む行を足す。表に無い口（相談の窓の一覧など）は今までどおり全部の種類で読み直すので、相談の窓を開いた頁は host の値が動く周に一覧を読み直す（表に行を足すのは範囲の外）。 軽さ。読みの 1 周は kernel の file 6 本と scope の dir（この host で約 90）の file 2 本ずつと装置の stat と摩耗の記録で、調べ係 rs1 が kernel の 9 本を 1 周 約 0.18 ms の CPU と測った（V）。scope の file はそれより多いので、着地の後に席が規則の行 R-34 の測り（面の server の読みを変える行の着地ごと）を撃ち、頁 1 枚と頁を開いていない時の値を便の bead の notes に記帳する。 歯と噛み。試作の木で verify の 7 行が全部 rc 0、行 h-host-core の試作の木で 1 行目が rc 1、3 行目が rc 101（test target hapi が無い）。xtask の check（共通 verify）は 2 つの行を当てた木で rc 0。噛みは試作を commit した後に句ごとの変異 6 を 1 つずつ当て、名指しの歯が全部 rc 100 で落ちた（対照は rc 0）。変異は、口の path を替える・kernel の file の io と memory の順を入れ替える・cgroup の親でなく自分の dir を読む・間の内でも測り直す・中身が動かない周も送る・host の口に席の種類を足す。1 度目の噛みで生き残った間の内の変異（2 度目の読みが同じ ms で間が 0 になり Unknown に落ちた）は、歯の 2 度目の読みの前に 20 ms 待つようにして落ちるようにした。見張りの歯は 20 ms の周で 400 ms の窓の frame を数える。 範囲の外。帯の host の印と窓 Win の Host と account board の HOME の block と語彙と style（後の行）・規則の行 R-40 の札（器の判定の行 v-wline-b の出力を読む後の行）・器が host の面の key wear を受ける直し（器の行 v-wear-key）・相談の窓の一覧の口を読み直しの表に足すこと。"

