section = "5"
write-set = ["+crates/tsuzuri-contract/src/host.rs", "crates/tsuzuri-contract/src/lib.rs", "+crates/tsuzuri-core/src/hostload.rs", "crates/tsuzuri-core/src/lib.rs", "+crates/tsuzuri-core/tests/hload.rs"]
verify = ["git apply --reverse --check docs/design/patch/h-host-core.patch", "cargo clippy -p tsuzuri-contract -p tsuzuri-core --all-targets --no-deps -- -D warnings", "cargo nextest run -p tsuzuri-core --test hload --no-tests=fail hload_"]
