done = "(1) git apply --reverse --check docs/design/patch/h-host-core.patch が rc 0（差の file の hunk が全部木に在る・verify の 1 行目） (2) 中核の hundredths は 10 進の字の 100 倍を小数 2 桁まで読み（25.36 は 2536・1.0 は 100・5 は 500・0.129 は 12）、空の字・符号・点で始まる字・点が 2 つの字・数でない字は読まない。cores は動いている cpu の範囲の字を数え（0-31 は 32・0-3,5,7-9 は 8）、逆の範囲・末の区切り・数でない字は読まない（歯 hload_hundredths_and_cores） (3) load は loadavg の字の 3 つの負荷の 100 倍と cpu の数を、stall は PSI の字の some か full の行の avg10 と avg60 を、memory は meminfo の MemTotal・MemAvailable・SwapTotal・SwapFree の kB を byte にした値を、sectors_written は装置の stat の 7 つ目の欄を読み、欄の欠けた字と cpu の範囲の読めない字は読まない（歯 hload_reads_kernel_texts） (4) 線の定数 LOAD_WARN・IO_FULL_WARN・MEMORY_FULL_WARN は 100・500・100 で、規則の行 R-42 の value の字の core 比と io の詰まりと memory の詰まりの数の 100 倍と同じ（歯 hload_lines_are_rule_r42） (5) over は線を越えた測りだけを Load・Io・Memory の順に返し、負荷は cpu の数で割らずに 1 分の負荷の 100 倍が LOAD_WARN と cpu の数の積を越える時だけ返し（32 の cpu で 32.00 の 3200 は返さず 32.01 の 3201 と 32.31 の 3231 は返す・負荷と cpu の数が u32 の上限でも積があふれない）、io と memory は PSI の full の avg60 の 100 倍が線を越える時だけ返し（io は 500 を返さず 501 を返す・memory は 100 を返さず 101 を返す）、ちょうどの値と読めない測りは返さない（歯 hload_over_follows_the_lines） (6) scopes は上限の字が max・0・読めない scope と今の量の読めない scope を除き、埋まりの多い順・同じ埋まりは名の順に 5 つまで返す（歯 hload_scopes_rank_the_bounded） (7) rate は前の読みとの区の差に 512 を掛けて ms の間で割った byte/s で、前の読みが無い・数えが戻った・間が 0 か負の時は Unknown（歯 hload_rate_from_sectors） (8) wear は smartctl の JSON の local_time の time_t と nvme_smart_health_information_log の percentage_used・data_units_written（512,000 byte を掛ける）・available_spare・media_errors を読み、どれかが無い・割合が 255 を越える・JSON でない字は読まない（歯 hload_wear_reads_smartctl_json） (9) budget_rows は host の面の字の見出し [[write-budget]] の表の行だけを読み、name と stat の両方が引用符で読める行を宣言の順に返し、wear は無くてよく、行末の注釈を読み捨て、ほかの見出しの表の行と最初の見出しの前の行は読まない（歯 hload_budget_rows_read_the_face） (10) host_doc は材料の字から電文を組み、読めない材料はその欄だけ Unknown にし、装置の摩耗は表の行に path が無ければ無し・在って読めなければ Unknown にし、over の結果を欄 over に置く（歯 hload_doc_assembles_the_texts）"
done-teeth = ["1:@1", "2:hload_hundredths_and_cores", "3:hload_reads_kernel_texts", "4:hload_lines_are_rule_r42", "5:hload_over_follows_the_lines", "6:hload_scopes_rank_the_bounded", "7:hload_rate_from_sectors", "8:hload_wear_reads_smartctl_json", "9:hload_budget_rows_read_the_face", "10:hload_doc_assembles_the_texts"]
patch = "docs/design/patch/h-host-core.patch"
goal = "done と verify の対応。1 つ目の項は verify の 1 行目、2 つ目から最後の項は 3 行目（段の file crates/tsuzuri-core/tests/hload.rs・接頭辞 hload_）で測る。2 行目の clippy は lint の落ちが無いことを命令の rc で測る守りで、done の項にしない。xtask の check は器の共通 verify が撃つので verify に書かない。 在りか。差の file docs/design/patch/h-host-core.patch（30,541 byte・git diff --full-index・5 file・足す 741 行・第 0.7 版で置き換えた）は、main 6274a7a3（規則の行 R-42 は着地済み）と、試作の commit b94362a8（写しは起草の置き場の try-w262a・係 w262a・1 度目の試作は係 w257a の try-w257a の 24a4b0c6）の差。新しい file は契約の型の crates/tsuzuri-contract/src/host.rs（103 行）と中核の crates/tsuzuri-core/src/hostload.rs（305 行）と段の file crates/tsuzuri-core/tests/hload.rs（330 行）で、2 つの lib.rs は module の行と中核の頭の doc の 1 行を足すだけ。土台の木で git apply --check、試作の木で git apply --reverse --check がどちらも rc 0。便は差を git apply で当てるだけで、差の外の字を書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 なぜ。持ち主の裁定 t3-hub.77.28（裁定 id t3-hub.77.28:20261005T2102Z-1・案 1・推奨どおり）は、host の負荷と SSD の負荷を project の board の帯の印と窓と account board の HOME の block に出し、摩耗は root の timer が書く file から読み、色の線は新しい規則の行に置くとした。行は 5 つと器の行 1 つに割り、この行は電文の型と、字を値にする中核の純粋な関数と、注意の線の判じを持つ（中核は file も子 process も時計も触らない）。判じは 1 つの関数 over だけに置き（条 P-21）、server も面も判じ直さない。線の値は同じ commit で足す規則の行 R-42 で、中核の定数がそれを写し、歯が規則の表の行の字を読み直して比べる（前例は規則の行 R-37 と面の定数 QUEUED_WARN_S の歯）。値の正本が規則の表の字なので、振る舞いでなく字で照らす。 形。電文 HostDoc は組んだ時刻・負荷（1・5・15 分の load の 100 倍と動いている cpu の数）・詰まり（PSI の cpu の some と memory の full と io の full の avg10 と avg60 の % の 100 倍）・メモリ（全体と使える量と swap の全体と空きの byte）・上限を持つ scope（埋まりの多い順に 5 つまで）・装置（host の面の書きの測りの表の順・書きの速さ byte/s と摩耗）・線を越えた測り（Load・Io・Memory の順）。負荷の判じは cpu の数で割らずに、1 分の負荷の 100 倍と LOAD_WARN と cpu の数の積を u64 で比べる（第 0.7 版の直し・割って切り捨てると core 比 1.00〜1.01 の越えを落とし、規則の行 R-42 の 1.0 を越えたらに反する）。詰まりは PSI の full の avg60 の 100 倍を線と直に比べる。kernel の PSI と loadavg の字は小数 2 桁なので、hundredths が 3 桁目から捨てる読みは本物の字の値を変えず、詰まりの比べに同じ切り捨ての穴は無い。中核は core 比を値として持たず（関数 load_ratio を外した）、表示の丸めは面が持つ。値は整数で持ち、浮動小数を電文に置かない（型が等しさを持てる）。読めない材料はその欄だけ Unknown（条 P-7）。摩耗は表の行が記録の path（key wear）を持たなければ欄が無く、持って読めなければ Unknown。摩耗の記録は root の timer が 1 日 1 度 smartctl -j -a の JSON を誰でも読める file に書く物で（持ち主が入れる・repo の外）、その path は host の面に置く（条 N-7）。今の器は表の key を name と stat に閉じているので、key wear を器が受ける行は別の器の行 v-wear-key で、それが着地するまで持ち主は key を書かない。書きの速さは境界が前の読みとの差を rate で導いて渡す。表の読みは中核の account の host.rs と境界の端末の表の読みと同じ自前の行の読みで、TOML の部品を足さない（条 P-26）。 歯と噛み。1 度目の試作（係 w257a）の木で verify の 3 行が全部 rc 0、main 4522db99 の木で 1 行目が rc 1、3 行目が rc 101（test target hload が無い）。噛みは試作を commit した後に句ごとの変異 17 を 1 つずつ当て、名指しの歯が全部 rc 100 で落ちた（対照は rc 0）。変異は、小数を 3 桁読む・範囲の数えの 1 を外す・avg60 に avg300 を読む・kB に 1000 を掛ける・stat の 6 つ目を読む・io の線を 499 にする・ちょうどを越えに数える・memory に io の線を使う・上限 0 の scope を通す・同じ埋まりを名の逆の順にする・6 つ返す・戻った数えを wrapping で引く・書いた量の単位を 512 にする・割合を 255 で丸めて通す・key wear の字を替える・ほかの見出しの後も表の中と読む・電文の over を空にする。1 度目の噛みで生き残った 2 つ（戻った数えの wrapping は桁あふれで Unknown に落ちて同じ結果・書いた量の歯が定数そのものを掛けていた）は、歯に間の長い戻りの見本と字の値 83,499,999,744,000 を足して落ちるようにした。規則の行 R-42 の字を照らす歯は、値の正本が規則の表の字なので字で照らす（振る舞いで測れない訳）。 第 0.7 版の直し（係 w262a）。便 t3-hub.77.29 の審査は、over が負荷を cpu の数で割って切り捨てて比べ、32 の cpu で 32.31 を越えないと判じ、歯がそれを固定していたので FAIL とした。直しは over の負荷の比べを割らない形にし、歯 hload_over_follows_the_lines の負荷の縁を 32 の cpu の 3200（返さない）と 3201 と 3231（返す）にし、負荷と cpu の数が u32 の上限の見本（返さない）を足した。io と memory の縁（500 と 501・100 と 101）は 1 度目の歯のまま。直した試作の木で verify の 3 行が全部 rc 0、main 6274a7a3 の木で 1 行目が rc 1、3 行目が rc 101（test target hload が無い）。噛みは直した試作を commit した後に over の句の変異 9 を 1 つずつ当て、歯 hload_over_follows_the_lines が全部 rc 100 で落ちた（対照は rc 0）。変異は、割って切り捨てて比べる（直す前の形）・負荷のちょうどを越えに数える・積を u32 で掛ける（u32 の上限の見本で桁があふれる）・cpu の数を 1 多く数える・詰まりのちょうどを越えに数える・詰まりに avg10 を比べる・memory に io の線を使う・順を逆にする・読めない負荷を越えに数える。over の外の 14 の変異は、字の替わらない code と歯に当てた1 度目の噛みのまま。 範囲の外。境界の口と変化の種類（行 h-host-api）、面の帯の印と窓と account board の block と語彙と style（後の行）、規則の行 R-40 の 1 日の書きの線の札（器の判定の行 v-wline-b の出力を読む後の行）、便ごとの書きの上位（中核の RunCost に書きの byte の和を足す後の行）、器が host の面の key wear を受ける直し（器の行 v-wear-key）。"

