goal = "在りかの main は f371566（計画 surface-plan 第 0.98 版・ノート surface-wave23b 第 0.3 版）。中核の crate の src/graph/check.rs と、境界の crate の src/server/board.rs と src/cli/graph.rs と、着地済みの歯 tests/cnote.rs を書き、新しい歯の file tests/cnret.rs を足す。計画 9 節の計画だけの行 c-note-retired を契約の行にした。拠りは持ち主の裁定 t3-hub.66.1（判断の表 d38）と t3-hub.66.3（判断の記録 ADR-20 決定 (2)・廃止したノートを名指しから外すのはこの行の着地から）。 なぜ。行 c-note-stale（ノート surface-wave20b・着地済み）は設計ノートの状態を読まずに、全部の契約表の行が着地したノートを名指す（その時の folio の索引に状態の欄が無かった）。2026-09-29 に全部の行が着地したノート 75 本を廃止した（状態 retired・計画が後継）ので、今の名指しは廃止済みのノートを並べ、退役の忘れを名指す役（条 P-28.5）を果たさない。folio 0c910db の索引の --summary の行は 8 つ目の欄 status を持ち、設計ノートの行の節点にはそのノートの状態の字（effective・retired ほか）が入る（ほかの種類は判断の記録が accepted か proposed、残りは null）。tsuzuri は設計文書の YAML を読まない（計画 3 節の席の決め）ので、状態はこの欄から読む。 決めた幅（まだ分からないの範囲）。全部の行が着地したノートのどれかの状態が読めなければ、名指しの行全体をまだ分からないにする（その行を黙って名指しも除きもしない・条 P-7）。状態が読めないのは、要約の字が読めない（空か JSON の object でない行が在る）・そのノートの行の節点に要約の状態の字が無い・そのノートの行の状態の字が揃わない、の時。全部の行が着地したノートが 1 つも無ければ、状態が読めなくても名指しは 0 と分かる（名指す物が無い）。この幅のため、索引に着地したノートを持たない着地済みの歯 kcli・ksum・kg9・g3g7w の --check の期待は変わらない。 形（中核）。check.rs に pub const RETIRED（字 retired）と pub fn note_states（要約の字を受け、種類が設計ノートの行で欄 id と status が字の行の id から状態の字への表を返す・空の字か JSON の object でない行が 1 つでも在れば None）を置き、use に serde_json の Value と super::build の NOTE_ROW_KIND を足す。pub fn landed_notes は引数に要約の字 summary を足し（Graph・台帳の字・要約の字）、文書 id ごとに行の節点の id を集め、全部の行が着地した文書 id ごとに行の状態の字の集まりを見て、ちょうど RETIRED の 1 つなら外し、ほかの 1 つなら名指し、それ以外なら Unknown を返す。着地の述語 fn landed と着地した行の判じは変えない。module の doc に 1 行、landed_notes の doc を直す。 形（境界）。board.rs の built_floors は landed_notes に Texts の欄 summary の字も渡す（Floors の欄 landed の doc を直す）。cli/graph.rs の LANDED_UNKNOWN の字を 全部の行が着地した設計ノート（設計の索引か台帳か状態の欄が読めない）に直し、file の頭の doc の --check の項を直す。tz graph --check の口と引数と終了 code は変えない。 直す着地済みの歯（tests/cnote.rs）。landed_notes を撃つ 2 か所に要約の字を渡し、節の要約の字 SUM（12 の節点の行・状態はどれも effective）を置き、Texts の欄 summary を SUM にする。偽の設計の道具は 3 つ目の引数が --summary なら SUM の file を返す（今は どの引数にも索引）。要約が読めるので --check の標準出力に要約の無い節点の行と名指した id の対の行が増える。fn cnote_check_names_notes は標準出力の全部の字でなく、末尾が landed の行と要約の行の 2 行で LANDED_HEAD の行が 1 つであることを見る。fn cnote_unread_goes_to_stderr は標準出力が 1 行であることでなく、最後の行が tz graph --check で始まることを見る。LANDED_UNKNOWN の字の期待を直す。 歯（tests/cnret.rs・接頭辞 cnret_）。節の索引は設計ノートの行 5（ra#r1・ra#r2・rb#r1・rc#r1・rd#r1）、節の台帳は根の epic y と子の task 5 本（y.1 から y.4 は着地した closed で ra の 2 行と rb と rc の行を指し、y.5 は open で rd の行を指す）。要約の字は判断の記録の行 1 つ（状態 accepted・種類を見ない読みが落ちる）と 5 つの行（ra は retired・rb は effective・rc は draft・rd は retired）。歯 cnret_state_decides・cnret_unread_state_is_unknown は中核と board の関数を直に撃ち、cnret_check_leaves_retired_out は CARGO_TARGET_TMPDIR の下の cnret の dir に作業場を作って tz graph --check を撃つ。 filter の語は、起草の時の main f371566 の契約表の verify の最後の字 296 語を、ほかの語を部分の字として含まない 220 語に畳んだ次の語で、歯の file は同じ語を const FILTERS に持つ（行 g-unref-dash-acct の歯 tests/udacct.rs も同じ語を持つ）。接頭辞 cnret_ と udacct_ は 296 語のどれも含まず、どれにも含まれない。 aaround_・abss_・abst_・accept_・acchold_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・aface_・afocus_・alean_・aord_・aown_・apark_・apop_・areread_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadl_・cadopt_・cadq_・cdorm_・cexcl_・cfsplit_・cg9_・cgdom_・cmark_・cnote_・contract_form_・cround_・csled_・cspk_・ctick_・cupd_・cupdlist_・denv_・dnedge_・dngrp_・dnrow_・dnskip_・dretry_・ecache_・epolq_・eretry_・esig_・evkind_・flight_・fmark_・fprem_・frame_・fserve_・fstop_・fxpre_・g3g7_・gacct_・gapspage_・gatt_・gbnote_・gchip_・gcoach_・gfix_・gfresh_・ghb_・gins_・gjst_・glabel_・gnav_・gpface_・gpill_・gpulse_・graph_・gsum_・gtuck_・gview_・gwv_・hacols_・harest_・hasplit_・hbconf_・hbmark_・hbon_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hdchip_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hshist_・hspage_・hspk_・hsym_・hthr_・http_・hwstore_・iclose_・ilink_・jcount_・jrun_・kcli_・kg9_・kindlab_・klink_・ksum_・launch_・lcard_・ledgerblock_・lgrp_・lhome_・lidle_・lkind_・lresume_・lsnap_・lspark_・lstg_・lstore_・mapview_・mkeys_・mlink_・mqask_・mqface_・mstore_・mtips_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntc_・ntime_・nxact_・nxorg_・parts_・pci_・pclosed_・pfold_・pgsw_・pgz_・pipe_・plimit_・pmisfit_・pmore_・pquest_・pqueue_・project_・ptitle_・pubfp_・pubscan_・punmap_・pwhole_・qblock_・qgate_・qkey_・qsig_・question_・rbusy_・relay_・rhold_・runsdoc_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server::events::・server_・sesplit_・sgrace_・shb_・skeleton_・smore_・stage_・stats_・stbp_・stcli_・steady_・sthr_・stnfy_・stskill_・sttgt_・sxaxis_・ticker_・tipx_・tkad_・tlic_・topbar_・topfit_・tz_・udash_・unow_・urpanel_・uword_・wstrip_ 置き場だけの = の歯。--check の標準出力を字で見る着地済みの歯 kcli・ksum・kg9・g3g7w は書かずに verify で撃つ（索引に着地したノートが無いので 0 の行のまま）。landed_notes と built_floors と LANDED_UNKNOWN の読み手を契約・中核・境界・面の crate の src と tests と xtask で grep すると、src は board.rs と cli/graph.rs、歯は cnote と kg9（built_floors）だけ。 試作と噛み。main f371566 の写しで cnret の 4 本と cnote・kcli・ksum・kg9・g3g7w が通り、xtask の check が緑。変異 7 つ（廃止を外さない・状態が読めない時も名指す・種類を見ない・読めない行を飛ばす・board が要約を渡さない・揃わない状態の先頭を取る・歯の名に filter の語）で、それぞれ名指した歯が落ちた。試作の tz で、今の main の design-intent と台帳を pin の folio（0c910db）で撃った --check は 全部の行が着地した設計ノート 0 の行を出した（2026-09-29 に廃止した 75 本は、全部の行が着地したノートとして廃止したもので、名指さない）。 依存と順。depends は空。計画 5 節の鎖の core/graph/check.rs と cli/graph.rs は、c-note-stale（着地済み）→ この行 → c-g9-deny（計画だけの行・便の bead の依存で持つ）。build.rs は書かない（計画だけの行 c-map-lc が書く）。同じノートのほかの行と書く file は重ならない。 範囲の外。地図で廃止のノートを畳むこと（計画だけの行 g-map-retired）。廃止の忘れを落とす側へ替えることと猶予の値。folio の pin を上げること（0c910db は発効済み）。"

[[contract]]
id = "g-unref-dash-acct"
title = "account board の台帳の tab の未反映の数を、3 種とも まだ分からない の行は数えない字 ― にして測れていないの印を添えず未反映の列の最大と最小に数えず、1 種か 2 種が分からなければ今の数と印のまま出す（行 g-unref-dash と同じ字・面の account の ledger だけ）"
req = ["FR13"]
section = "9"
write-set = ["crates/tsuzuri-surface/src/account/ledger.rs", "crates/tsuzuri-surface/tests/hacols.rs", "crates/tsuzuri-surface/tests/harest.rs", "+crates/tsuzuri-surface/tests/udacct.rs", "=crates/tsuzuri-surface/tests/acctled.rs", "=crates/tsuzuri-surface/tests/hcled.rs", "=crates/tsuzuri-surface/tests/ledspark.rs"]
verify = ["cargo nextest run -p tsuzuri-surface --test udacct --no-tests=fail udacct_", "cargo nextest run -p tsuzuri-surface --test hacols --no-tests=fail hacols_", "cargo nextest run -p tsuzuri-surface --test harest --no-tests=fail harest_", "cargo nextest run -p tsuzuri-surface --test acctled --no-tests=fail acctled_", "cargo nextest run -p tsuzuri-surface --test hcled --no-tests=fail hcled_", "cargo nextest run -p tsuzuri-surface --test ledspark --no-tests=fail lspark_", "cargo run -q -p xtask -- check"]
size = "S"
done = "(1) 面の account の ledger の table は、fixture tests/fixtures/account/acct-doc.json の 3 行の台帳を memo だけ 9 件・3 種とも分からない未反映 0・memo だけ 4 件にした電文で、行の数の欄の 4 つ目と未反映の cell の class と印と Unref の partial を、9 と c-n c-un hi on と HI と偽・― と c-n c-un と無しと偽・4 と c-n c-un lo on と LO と偽にし、fixture の proj-a の台帳（未反映 3・ruling と request が分からない）・3 種とも分からない・memo 0 件では 3 と c-n c-un hi on と HI と真・― と c-n c-un と無しと偽・0 と c-n c-un lo と LO と偽、3 種とも分からない 2 行と memo 5 件では ― と c-n c-un と無しと偽の 2 行と 5 と c-n c-un on と無しと偽にする。project の ledger の NONE は字 ― で account の projects の NONE_MARK と同じ（歯 udacct_numbers_and_marks） (2) src/account/ledger.rs の mod dom の字は、未反映の数の b の中身を cells.unref.text() にする字と、印の式 cells.unref.partial() の then の state_icon(UNKNOWN) をそれぞれ 1 度持ち、中身を cells.unref.count にする字と字 cells.unref.unknown.is_empty() を持たない（歯 udacct_dom_wiring） (3) tests/udacct.rs の test の属性の付いた fn は 3 つで、名はどれも udacct_ で始まり、名から先頭の udacct_ を除いた字は 8 節に並べた filter の語のどれも部分の字として含まない（歯 udacct_names_clean）"
goal = "在りかの main は f371566（計画 surface-plan 第 0.98 版）。面の crate の src/account/ledger.rs と、着地済みの歯 tests/hacols.rs と tests/harest.rs を書き、新しい歯の file tests/udacct.rs を足す。計画 9 節の計画だけの行 g-unref-dash-acct（起草 w22d2 の見つけ・席の決め 2026-09-29）を契約の行にした。拠りは要件 FR13。 なぜ。行 c-unref-now（着地済み）で、中核は未反映の 3 種を器の局面の出力が来るまで全部 まだ分からない にし、電文の unreflected は 0 になった。行 g-unref-dash（ノート surface-wave22d・着地済み）で project board の台帳の block は 3 種とも分からない時に字 ― を出すようになり、account board の各 project の表も unref_of で ― を出す。ところが account board の台帳の tab（見本 mock3 の session の tab の ledger）は、行の未反映の数に 0 を出し、隣に測れていないの印を添える。見本 mock3 の account の頁の ledTable は未反映が null の行に ― を出し、extremes は null を除き、印の関数 xm は null に印を付けない。この行はその字に揃える。 形。src/account/ledger.rs の use に projects の unref_of を足す。LedRow の numbers の 4 つ目を c.unref.text()（行 g-unref-dash の Unref の text・3 種とも分からなければ ―・ほかは部分の和の数）にする。fn table の未反映の列の最大と最小は、電文の projects の unref_of が数を返す行（台帳が Known で 1 種でも読める行）の数だけで数え、行の未反映の cell の class の印は unref_of が数を返す行だけに付ける（3 種とも分からない行は c-n c-un で、数は 0 なので on も付かない）。mod dom の未反映の cell は b の中身を cells.unref.text() にし、印は cells.unref.partial() の時だけ state_icon(UNKNOWN) を置く。module の doc と numbers の doc と table の doc を直す。Cells の欄 unref は unref_count の値のまま（行の詳しくの段と card は変えない）。 画面の字（歯で測らず、この行の差分で持つ）。3 種とも分からない行は未反映の cell に ― だけで印を添えない。1 種か 2 種が分からない行は今のまま数と印、どれも分かる行は数だけ。台帳が Unknown の行は今のまま全部 ―。account board の各 project の表・project board の台帳の block・電文の形・中核の数え方は変えない。並べ方（judge・project・net・backlog）は未反映を使わないので変わらない。 直す着地済みの歯。hacols の fn hacols_dom_words の ledger.rs の DOM の字の 2 つ（cells.unref.count と cells.unref.unknown.is_empty()）を cells.unref.text() と cells.unref.partial() にする。harest の fn harest_dom_words の ledger.rs の字の 1 つ（un_class に mark(ext_un, f64::from(s.unreflected)) を渡す字）を unref_of(p).and_then(|u| mark(ext_un, f64::from(u.count))), にする。 歯（tests/udacct.rs・接頭辞 udacct_）。fixture tests/fixtures/account/acct-doc.json（行 h-acct-rest の fixture・proj-a の台帳は未反映 3 で ruling と request が分からない・proj-b と proj-c は台帳が Unknown）の 3 行の台帳を差し替えた電文を table に Sort の Project で渡す。3 種とも分からない台帳は proj-a の台帳の unreflected を 0、unreflected_kinds を空、unreflected_unknown を 3 種の全部にした値（行 c-unref-now の今の中核の値）。DOM は wasm の target でしか組めないので、src の字の mod dom 以降を読む。filter の語は 8 節に並べた 220 語。 置き場だけの = の歯。account の ledger の item（table・Cells・LedRow・numbers・marks・un_class）を面の crate の tests と src で grep すると、書かない歯は acctled（fixture の proj-a は部分の和で数 3 のまま）・hcled・ledspark で、verify で撃つ。unow と projects.rs は account の projects の表を見て、この行は書かない。 試作と噛み。main f371566 の写しで udacct の 3 本と hacols・harest・acctled・hcled・ledspark が通り、xtask の check が緑。変異 6 つ（数の字を count に戻す・読めない行も最大と最小に数える・読めない行にも印・DOM の数を count に戻す・DOM の印を読めない種類の有無に戻す・歯の名に filter の語）で、それぞれ名指した歯が落ちた。 依存と順。depends は空（行 g-unref-dash は着地済みで、その Unref の text と partial を使う）。計画 5 節の鎖の surface/account/ledger.rs は h-acct-rest（着地済み）→ この行、面の歯 hacols と harest も h-acct-rest と g-kind-label（着地済み）→ この行。同じノートのほかの行と書く file は重ならない。 範囲の外。account board の各 project の表と Σ の字（今のまま unref_of）。未反映の数え方と器の局面の出力を読むこと（計画だけの行 c-unref-lc・g-unref-lc）。"
