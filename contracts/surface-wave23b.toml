done = "(1) 境界の acct の pub const HEARTBEAT_ON は字 heartbeat-on で、境界の server の seat の Seat の pub fn marks は席の dir の state.jsonl・tick-last・heartbeat-off・heartbeat-on の 4 つをこの順に返す（歯 hbon_marks_name_on_file） (2) 口 /api/surface/events は、席の dir に heartbeat-on を置いた後と消した後にそれぞれ 5 秒以内に board-changed を送り、file の動かない 1.5 秒は送らない（歯 hbon_on_file_sends_board_changed） (3) 口 /api/seat の席の card の heartbeat は、偽の器の seat tick status の席の行が heartbeat=off heartbeat_by=group の間は Known(false) で、heartbeat-on を置いて行を heartbeat=on heartbeat_by=explicit にすると 5 秒の持ち回しの中でも集め直して Known(true)（器の撃ちは 3 回から 6 回）、印が動かなければ持ち回し（6 回のまま）、heartbeat-on を消しても行が on なら Known(true)（9 回）、heartbeat-on を置き直して行を heartbeat=unreadable heartbeat_by=unreadable にすると Unknown（12 回）（歯 hbon_card_reads_tick_word） (4) account board の読み（境界の acct の Acct の pub fn doc）の proj-a の席の card の heartbeat も、同じ置き方と行の替え方で Known(false)・Known(true)・Known(true) になり、器の撃ちの回数は最初の集めの回数の 2 倍と 3 倍で、印が動かない間は増えない（歯 hbon_acct_reads_tick_word） (5) 書き換えた着地済みの歯（hbmark_marks_name_three_files は marks の先頭の 3 つを見る・server_acct_marks_list は席の dir ごとに heartbeat-on を持つ）と置き場だけの = の歯の全部が通る（xtask の check）"
goal = "## 器の草稿の字（branch docs/park-lot-rows の器の行 aa・器の席の知らせ 2026-09-29） - seat tick status の欄 heartbeat= は実効の値（on・off・unreadable）になり、直後に欄 heartbeat_by=（explicit・group・default・unreadable）が入る。区画の席の move= と grace_left= は字 -。 - 記録の file は heartbeat-off と、新しく heartbeat-on（席の dir の下）。区画の宣言の heartbeat の既定が off の席を明示の on にすると、器は heartbeat-on を書く。 ## 今の欠陥 席の card の読み（境界の server の seat の Seat の fn marks）と account board の読み（境界の acct の Acct の fn marks）の変化の印は、席の dir の state.jsonl・tick-last・heartbeat-off だけ。器が heartbeat-on だけを書く切り替えでは印が動かず、board-changed が出ず、読みは 5 秒の持ち回しが切れるまで古い（面は知らせを受けないので、次の知らせまで古い字を出し続ける）。 ## 直し - 境界の acct に pub const HEARTBEAT_ON（字 heartbeat-on）を HEARTBEAT_OFF の隣に足し、Seat の fn marks と Acct の集めの印の並びの heartbeat-off の後ろに足す。module の doc（server の seat と events）と Acct の fn marks の doc の file の列にも足す。 - 値の読みは変えない。中核の seat の card の heartbeat は seat tick status の席の行の欄 heartbeat= の字 on と off だけを Known にし、unreadable と欄の無い行は Unknown のまま。欄 heartbeat_by= は読まない（欄の名で引くので、間に入っても heartbeat= の読みは変わらない）。file の有無は印にだけ使う。 ## 変えないもの - 群の宣言の file host.toml は印にしない（今までどおり）。区画の heartbeat の既定を持ち主が host.toml で替えた時は、器が席の file を書かなければ読みは 5 秒の持ち回しの後か次の印で追いつく。印に足すかは範囲の外（席に問う）。 - 着地済みの歯 hbmark_marks_name_three_files（ノート surface-wave13e の done が名指す）は名を替えず、marks の先頭の 3 つを見る形に書き換え、4 つの全部は新しい歯 hbon_marks_name_on_file が見る。server_acct_marks_list は席の dir ごとの file の名の列に heartbeat-on を足す。 ## 歯 - 新しい歯 hbon_ は着地済みの歯の file に足す（偽の器と作業場の組みを使うため・前例は hbmark_ と acchold_）。server_seat に 3 つ（hbon_marks_name_on_file・hbon_on_file_sends_board_changed・hbon_card_reads_tick_word）、server_acct に 1 つ（hbon_acct_reads_tick_word）。hbon_ と歯の名は main の契約表の filter の語のどれも含まない（起草の lint で見た）。account board の歯は器の撃ちの回数を最初の集めの回数の倍で見るので、行 c-grace-acct（便 t3-hub.53.38）の 1 回の集めの撃ちの数の替えに依らない。 - 置き場だけの = は、席の dir の印と停止の切り替えを撃つ着地済みの歯（evkind・shb・server_hb・server_acctwire・server_read）と、境界の lib の events の単体の歯。 ## 器の着地との順と便の順 - 器が heartbeat-on を書かない今は、印の file が無いまま動かないので振る舞いは変わらない。器の着地より前に着地してよい。 - 行 c-grace-acct（ノート surface-wave22e・便 t3-hub.53.38・open）が同じ境界の src/acct.rs と tests/server_acct.rs を書く。ノートの depends はほかのノートの行を持てないので、便の bead の依存（この行が後）は席が張る。試作は main 84be3ea2 の上で、c-grace-acct の差分は当てていない（着地の後に当て直す）。"

