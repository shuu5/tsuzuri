done = "(1) 中核の account の host の pub const PARK_KIND は字 park で、pub fn groups と pub fn accounts は、fixture tests/fixtures/account/acct-inputs.json の host の字の群の宣言の後ろに区画の宣言（名 lot・anchors 1 つ・accounts 2 つ・heartbeat の key の行）を足し、doctor の群の行の後ろか前に器の草稿の形の区画の行（group=lot kind=park accounts=acct-3,acct-4 anchors=1 seat-accounts=<字> current=- next=- refused=- pressure=<字>）を足した字の 14 組（pressure の字 5h:91/90・7d:80/85・model:95/90・-・unmeasured・unreadable・no-rule の 7 つと、区画の行を群の行の前に置くか後ろに置くかの 2 つ）から、fixture の期待の群の枠の列と口座の列と同じ値を返し、pub fn declaration は区画の宣言を 3 つ目の群（名・anchors・accounts）として読み、宣言と区画の行の名を Tier9 にしても群の枠の列は同じ（歯 apark_lot_left_out） (2) doctor に区画の名の行が無い字の群の枠の列は Unknown のまま（今の読み）で、欄 kind の無い行と kind=lot と kind=Park の行と、名 Tier9 の欄 kind の無い行は群の枠として 3 つ目に並び（今の口座は行の current の写し）、宣言に無い名の区画の行は読まず、current=acct-3 の区画の行は口座 acct-3 の占有に数えない（歯 apark_kind_alone_decides） (3) 中核の seat の pub fn card は、区画の宣言の anchor の席の group を区画の行の写し（口座の字 -・候補 acct-3 と acct-4・次の字 -・残りは空）にし、pressure を区画の行の 5h:91/90 は Known(Some)・字 - は Known(None)・unmeasured と unreadable と no-rule は Unknown に写し、refused は Known(None)（歯 apark_seat_card_copies_lot） (4) 中核の tests/apark.rs の test の fn の名は 4 つで、どれも apark_ で始まり、名から apark_ を除いた字は、歯の file の WORDS の 291 語（起草の時の main 3fcb0d18 の契約表の verify の filter の語）のどれも含まない（歯 apark_own_names_clean） (5) 置き場だけの = の歯の全部が通る（xtask の check）"
goal = "## 器の草稿の字（branch docs/park-lot-rows・器の席の知らせ 2026-09-29） - doctor の区画の行は群の行の後ろに 1 本（区画を宣言しない host は 0 本）で、形は group=<名> kind=park accounts=<a,b,…> anchors=<数> seat-accounts=<l1,…|none|unreadable> current=- next=- refused=- pressure=<字>。kind は 2 番目の欄で、群の行は kind を持たず 1 字も変わらない。current・next・refused は常に字 -。pressure は <5h|7d|model>:<使用率>/<閾値> か字 - か unmeasured・unreadable・no-rule。 - host の面の区画は群と同じ見出し [[account-group]] で、行は name・anchors・accounts と任意の key heartbeat（on か off）を持つ。 - 器は区画を、器の便 r2b の着地と binary の入れ替えの後まで、どの host.toml にも宣言しない。 ## 今の読みを測った字（main 84be3ea2） - 群の宣言の読み（pub fn declaration）は name・anchors・accounts だけを読み、heartbeat の key は読み捨てる。区画の宣言は 3 つ目の群として読まれ、落ちない。 - 区画の行を足した doctor では、群の枠の列は Unknown に倒れない。字 - は空の字でないので今の口座として読まれ、3 つ目に区画の名の群の枠（今の口座の字 -・次の口座の字 -・候補は区画の accounts・区画の席の一致は席の口座と字 - の比べで ! 移動待ち）が並ぶ。計画の 9 節の見込み（群の列の全部が まだ分からない に倒れる）は、宣言に在って doctor に行が無い字（器の古い binary に区画を宣言した時）だけで起きる。この行はその読みを変えない。 - 口座の占有は current が口座の名と同じ群の行で決まり、区画の行の current は字 - なのでどの口座とも合わない。 ## 直し - 中核の account の host に pub const PARK_KIND（字 park）と fn parked（頭が group= で欄 kind が PARK_KIND の行）を足す。群の行の読み（fn group_lines）は区画の行を除き、口座の占有と群の枠の行の引きは区画の行を読まない。 - pub fn groups は、doctor に同じ名の区画の行が在る宣言（fn in_park）を列に入れない。残りの宣言は今までどおり、どれかの枠が組めなければ Unknown。 - 見分けは欄 kind の字 park だけ（大文字の Park・ほかの kind の字・kind の無い行は群の行のまま）。名 Tier9 でも kind の無い行は群。 ## 区画の席の見せ方（見本を見て決めた） 見本 docs/design/mock3 の account board の群の所（acct.js と account/index.html の群の枠）は群の宣言の群だけを枠にし、park の区画も区画の席も持たない。区画は口座を占有せず、群の枠の欄（今の口座といつから・前の口座・候補と閾値・席の一致の数）が意味を持たないので、群の枠の列に出さない（区画として別の枠も出さない）。 ## 変えないもの - account board の project の行は、区画の anchor の project も宣言の順に並び、群の名は区画の名のまま（中核の account の project は書かない）。電文に区画の名の群の枠が無いので、面の口座の欄の群の今の口座は ?、project board の席の群の chip の card は面の project の seat の GROUP_MISSING の字になる。今の main で区画が群として並ぶ時の ! 移動待ちの誤りより正しいが、区画と書く見せ方は後の行の候補として席に問う。 - 移動の列と知らせの列は宣言の名で読むまま（区画の記録と event が在れば出す）。器の区画は口座を占有しないので記録は書かれない見込み。 - 席の card（中核の seat）は書かない。区画の席の card の群の欄は区画の行の写し（今の口座と次の口座は字 -・残りは空）で、逼迫は区画の行の pressure の写し、断りは字 - の Known(None) になり、壊れない（歯 apark_seat_card_copies_lot が測る）。 - fixture の file（tests/fixtures/account の 2 つ）は書かない。区画を fixture に足すと電文の fixture acct-doc.json と面の歯が動き、見本にも無いので、区画の宣言と行は歯の中で足す。 ## 歯 - 新しい歯 tests/apark.rs（中核）の 4 つ。filter の語は main の契約表の verify の nextest の最後の引数 291 語で、歯の file に const WORDS として持つ。 - 置き場だけの = は、中核の host の fn を撃つ着地済みの歯（中核の acctcore・acctpcore・athr・cdorm・cspk・lresume・pclosed・plimit・pquest・punmap・sclosed と、電文を組む境界の server_acct・athr・bport）。どれも区画の字を持たないので値は変わらない。 ## 器の着地との順 区画の行の無い今の doctor では振る舞いが変わらないので、器の r2b の着地より前に着地してよい。器の草稿の字（kind の位置・current の字 -）が変わっても、見分けは欄 kind の字だけに依るので、欄の名 kind と字 park が変わらない限りこの行は直さない。"

