r は自分の [workspace] を持てないので、この確かめで tsuzuri の crate の dir は名指せない。 錠の歯（cexcl_lock_drops_encoding）は、持ち込んだ木の錠の file folio2/Cargo.lock を字で塊に割り（見出し [[package]] と、塊の頭の name = の行）、encoding_rs が無いこと・folio を除く名が 26 本・folio の dependencies が clap と yaml-rust2 の 2 つ・表の R-2 の行の本数の字が錠の本数と等しいことを見る。表の字と錠がずれたら落ちる。持ち込みの後に folio の依存が変わる時は、この歯を直すことが R-2 の見張りになる。今の 0c910db の錠（35 本・encoding_rs が在る）ではこの歯は落ちるが、t-carry-ex は F3 の後の folio2 を merge した後に流すので、それで良い。 歯は 4 つ（cexcl_table_rows・cexcl_refuses_bad_rows・cexcl_lock_drops_encoding・cexcl_own_names_clean）。filter の語は、起草の時の main 821ed79 の契約表の verify の最後の字 294 語で、歯の file に const WORDS として持つ。 器の共通 verify と node。merge の後の木でも、器の共通 verify（.vessel.toml の common-verify = xtask の check）は folio2/ の下を撃たない。build・nextest・clippy は根の workspace の member だけを撃ち、面の組み立ては面の crate の dir だけを読み、木の全部を歩くのは pub-scan だけ（folio2 の側の直しの後は当たり 0）。試作の木（merge の後）で xtask の check は緑（1,619 本）。folio の歯は根の workspace の外なので撃たず、CI に node は要らない。folio の歯を撃つ段（k-join-folio）で CI に node を足す（folio の図の口 figure と、図を持つ文書の face と build が node を起こす・folio2 の CI は node 20）。 読み手。今は歯だけ。folio2/ は根の workspace の外（自分の [workspace] を持つ入れ子）なので、R-4・R-10・R-2 の検査はもともと folio2/ に当たらず、この表で切る仕組みは無い。k-join-folio が folio の crate を根の workspace に入れる時に、表を読んで lint と数えを外す実装を持つ。 範囲の外。folio2/ の木の中の、tsuzuri で働かない file（CLAUDE.md・.beads・.vessel など）の扱いは、持ち込みの後の最初の便で持ち主に問う。"

