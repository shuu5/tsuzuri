title = "器が新しく書く明示の on の記録 heartbeat-on を、席の card の読みと account board の読みの変化の印に足し、明示の on への切り替えでも持ち回しの中で集め直して board-changed を出す（on と off の値は今までどおり seat tick status の欄 heartbeat= から読み、file の有無では読まない・境界の crate だけ）"
