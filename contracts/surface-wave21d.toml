[[contract]]
id = "f-gate-install"
title = "問いの起票の門 tz hook question-gate を席の plugin の hooks.json の PreToolUse（matcher Bash・timeout 10 秒）に足し、器が runner の plugin の写しの根に置く印 scribe2-runner の在る session では撃たない"
req = ["FR4"]
section = "3"
write-set = ["plugin/hooks/hooks.json", "plugin/.claude-plugin/plugin.json", "+crates/tsuzuri-core/tests/gins.rs", "=crates/tsuzuri-core/tests/fstop.rs"]
verify = ["cargo nextest run -p tsuzuri-core --test gins --no-tests=fail gins_", "cargo nextest run -p tsuzuri-core --test fstop --no-tests=fail fstop_", "cargo run -q -p xtask -- check"]
size = "S"
done = "(1) plugin/hooks/hooks.json を serde_json で読んだ値は鍵が hooks だけの object で、hooks の鍵は PreToolUse と Stop の 2 つ、PreToolUse の値は要素 1 つの配列で、その要素は鍵が hooks と matcher の object、matcher は字 Bash、その hooks は要素 1 つの配列で、その要素は鍵が command と timeout と type の object、type は字 command、timeout は数 10、command の字を空白で分けて二重引用符を除いた語は節に並べた 10 語で、command は二重引用符で囲んだ字 $CLAUDE_PROJECT_DIR を 2 つと二重引用符で囲んだ字 $CLAUDE_PLUGIN_ROOT/scribe2-runner を 1 つ持ち、字 $CLAUDE_PROJECT_DIR を 2 度だけ持つ（歯 gins_pretool_bash_entry） (2) repo の plugin の dir の下（入れ子の dir も）に名が scribe2-runner の file も dir も無く、見た中身は 4 つ以上（歯 gins_repo_plugin_has_no_runner_mark） (3) hooks.json の PreToolUse の command の字を sh -c で撃つと、環境変数 CLAUDE_PROJECT_DIR の dir の下に target/debug/tz が在り環境変数 CLAUDE_PLUGIN_ROOT の dir に scribe2-runner が無い場では、tz を引数 hook と question-gate と --repo と CLAUDE_PROJECT_DIR の値の順で撃ち、標準入力の payload をそのまま tz に渡し、rc 0 で標準出力が tz の標準出力に等しく、CLAUDE_PLUGIN_ROOT の dir に scribe2-runner が在る場では tz を撃たずに rc 0 で標準出力が空で、CLAUDE_PROJECT_DIR の下に tz が無い場では rc が 0 でも 2 でもなく標準出力が空（歯 gins_command_under_sh） (4) hooks.json の Stop の値は要素 1 つの配列で、その要素は matcher を持たず、その hook の command の語は字 $CLAUDE_PROJECT_DIR/target/debug/tz と hook と stop と --repo と $CLAUDE_PROJECT_DIR で timeout は 30 以上、plugin.json は鍵 description と name と version の 3 つで name は中核の crate の名から -core を除いた字、2 つの file のどの字の語も斜線とチルダで始まらない（着地済みの歯）（歯 fstop_plugin_stop_entry）"
goal = "在りかの main は b5c24c8（計画 surface-plan 第 0.78 版・行 g-nav の着地の後）。計画 9 節の計画だけの行 f-gate-install を契約の行にする。承認は計画の裁定を継ぐ。拠りは持ち主の裁定 t3-hub.55.3（裁定 id = t3-hub.55.3:20260927T2233Z-1・門の便の着地の後に席の設定の PreToolUse の matcher Bash に門を入れる・計画の判断の表 d3）と要件 FR4 と、器の答え（2026-09-27T23:3xZ・hook の入れ先は repo の根の plugin・計画 6 節）。 なぜ。行 f-gate（ノート surface-wavef・着地済み）は問いの起票の門を tz の口 tz hook question-gate に置いたが、plugin の dir を書かなかったので、今の席の Bash の呼びでは門が撃たれない。今の plugin/hooks/hooks.json は鍵 hooks の下に鍵 Stop だけを持つ。Stop の値は要素 1 つの配列で、その要素は matcher を持たず、hooks の要素 1 つは type が字 command、command が二重引用符で囲んだ $CLAUDE_PROJECT_DIR の後に /target/debug/tz hook stop --repo と二重引用符で囲んだ $CLAUDE_PROJECT_DIR、timeout が 30（行 f-stop）。今の plugin/.claude-plugin/plugin.json は鍵 name（字 tsuzuri）・version（字 0.1.0）・description（停止の hook だけを言う字）の 3 つ。 在りか（門の口・着地済み・この行は書かない）。境界の crate の src/hook/question_gate.rs の pub fn run は標準入力を全部読み、中核の gate の drafts（Bash の command を一続きに分け、bd か bdw の create で label に intake:question を持つものを下書きに拾う）が空なら子 process を撃たずに rc 0 で何も出さない。下書きが在れば、台帳を bd の --readonly list --all --limit 0 --json（上限 BD_TIMEOUT の 5 秒）で、設計の索引を folio の graph --print --dir と repo の下の design-intent（上限 FOLIO_TIMEOUT の 5 秒）で std の thread の scope で並べて読み、judge と output の答え（鍵 hookSpecificOutput の permissionDecision が字 deny の JSON の 1 行）を出すか、通すときは何も出さずに rc 0。引数の誤りは、下書きが在れば deny の args を出して rc 0、無ければ rc 1。rc 2 は使わず、file を書かず、repo が git の worktree でも黙らない。main.rs の fn main の腕 hook と question-gate がこの run を呼ぶ。 Claude Code の hook の決まり（この repo の外の事実・行 f-stop と f-gate の節と同じ）。PreToolUse の hook は、matcher が道具の名に当たる呼びごとに、道具を撃つ前に command を shell で撃ち、呼びの JSON（鍵 tool_name と tool_input）を標準入力に渡す。rc 0 で標準出力が空なら決めを持たず呼びはふつうの許可の流れを通り、rc 0 の標準出力の JSON の permissionDecision が deny なら呼びを止めて理由を席に返し、rc 2 は呼びを止めて標準エラーを席に返し、ほかの rc は止めない誤りで呼びはそのまま進む。timeout（秒）を越えた hook は止められ、その出力は決めとして読まれない（呼びは進む）。同じ event の hook はほかの設定の hook と並べて撃たれ、どれかが deny なら止まる。plugin の hooks.json は session の起動の時に読まれる。 形。hooks.json の鍵 hooks に鍵 PreToolUse を足し（鍵の並びは PreToolUse・Stop・Stop の要素の字は変えない）、値を要素 1 つの配列にする。その要素は matcher（字 Bash）と hooks（要素 1 つの配列）で、その要素は type（字 command）と command と timeout（数 10）。command の字は次の 10 語で、二重引用符は 3 か所（$CLAUDE_PLUGIN_ROOT/scribe2-runner の全体・2 つの $CLAUDE_PROJECT_DIR）に付ける。語は [ と -e と $CLAUDE_PLUGIN_ROOT/scribe2-runner と ] と || と $CLAUDE_PROJECT_DIR/target/debug/tz と hook と question-gate と --repo と $CLAUDE_PROJECT_DIR。plugin.json は description の字だけを、停止の hook と問いの起票の門の 2 つを言う字に替える（鍵と name と version は変えない）。 どの呼びで何が撃たれるか（歯で測らず、この行の差分と節で持つ）。席（scribe2 seat が --plugin-dir で anchor の plugin を読む session・CLAUDE_PLUGIN_ROOT は anchor の plugin の dir で印は無い）では、Bash の道具の呼びの全部で sh が印の検査の後に anchor の target/debug/tz hook question-gate を撃つ。問いの起票でない command（ls・git・cargo・bdw の memo や notes の書きほか）は tz が標準入力を読むだけで rc 0 で何も出さず、子 process を撃たない（1 呼びにつき sh と tz の 2 つの process の起こしだけが増える）。問いの起票（bd か bdw の create で label intake:question）は bd の読みと設計の道具の読みを 1 本ずつ並べて撃ち（どちらも 5 秒まで）、門が止めるときは deny の答えで呼びを止め、処分の無い id と束の要約値と次の一手を席に返す。通すときは何も出さず、器の起票の門と許可の設定がそのまま効く。Edit・Write・Read・Agent ほかの Bash でない道具の呼びでは撃たない（matcher が Bash）。器の runner（器が便ごとに worktree の plugin を state dir の下の run の plugin の dir に写し、写しの根に空の file scribe2-runner を置く・器の memo s2-07l.723・席の実測で runner の CLAUDE_PLUGIN_ROOT はその写しで印が在った）では、印の検査が真で tz を撃たずに rc 0 で何も出さない。lens は plugin を読まない。停止の hook（Stop）は変えない。 落ちた時に席の作業を止めない形か（歯 gins_command_under_sh が 3 つの場を撃ち、ほかは節で持つ）。門が deny を出すのは tz の答えが問いの起票の下書きを持つときだけで、ほかの呼びは次のどの落ちでも進む。anchor に tz が無い（組み直しの途中を含む）と sh が rc 127 で終わり止めない誤り。行 f-gate より古い tz は使い方を出して rc 1 で止めない誤り。tz が panic すれば rc 101 で止めない誤り。tz が 10 秒を越えれば Claude Code が止めて呼びは進む（tz の子 process は 5 秒で断たれ、門は約 5 秒で答えるので、10 秒は 2 倍の余白）。これらの場では問いの起票も門を通らずに進む（器の起票の門はそのまま効く）。台帳か設計の索引が読めないときは、問いの起票だけを まだ分からない の deny で止める（行 f-gate の閉じる側）。門の欠陥で問いの起票でない呼びまで deny が出るときは、持ち主が素の端末で anchor の target/debug/tz を除くか組み直すと rc 127 で門が開く（hooks.json は session の起動の時に読まれるので、hooks.json の直しは席の起こし直しの後に効く）。hook は file を書かない。 runner で撃たない理由（決めた幅）。runner の CLAUDE_PROJECT_DIR は便の worktree で、その target/debug/tz は便が組みかけの binary か無い。組みかけの門の欠陥が便自身の Bash の呼びを止めうる。裁定 t3-hub.55.3 は門を席の設定に入れると言い、器の起票の門も席の道具の呼びだけを見る（計画 3 節）ので、印の在る session では hooks.json の command が tz を撃たない。tz hook question-gate の振る舞い（worktree でも黙らない）は変えない。計画 6 節の、門の hook は runner でも効く前提で書く、の字はこの印の前の字で、席が計画の次の版で直す（notes の席の問い）。 着地の後に効く時（歯で測らず、席の作業で持つ）。着地の後に席が restart.sh で anchor の target/debug/tz を組み直し、席の次の起こし直しから門が効く。 在りか・読み手（全部の crate の tests と src と xtask で plugin・hooks.json・plugin.json・scribe2-runner・CLAUDE_PLUGIN_ROOT の字を grep した）。hooks.json と plugin.json を読む着地済みの歯は中核の fstop_plugin_stop_entry（tests/fstop.rs）だけで、Stop の要素と plugin.json の鍵と、2 つの file の全部の字の語が斜線とチルダで始まらないことを見る（足す command の語はどれも斜線とチルダで始まらない）。これを置き場だけの = で持ち、verify で撃つ（試作で通った）。境界の src/hook/stop.rs は doc で hooks.json を名指すだけ。xtask の pub-scan は追跡される file の全部の字を読むので verify の xtask check で撃つ（この行は住所も名も書かない）。 測り方・歯（中核の crate の tests/gins.rs・新しい file・接頭辞 gins_）。境界の crate は serde_json に直に依存しないので、歯は着地済みの tests/fstop.rs と同じく中核の crate に置き、CARGO_MANIFEST_DIR から 2 つ上の workspace の根の plugin/hooks/hooks.json を読む。gins_command_under_sh は CARGO_TARGET_TMPDIR の下の作業場に、project の dir（下に target/debug/tz の偽の script・引数を 1 行ずつと標準入力を記録の file に書き、字 deny-line の 1 行を出して rc 0）と、印の無い plugin の dir と、空の file scribe2-runner を置いた plugin の dir と、tz の無い project の dir を作り、hooks.json から読んだ command の字を sh -c で、環境変数 CLAUDE_PROJECT_DIR と CLAUDE_PLUGIN_ROOT と標準入力の payload（tool_name が字 Bash で command が ls の JSON）を渡して撃つ。歯の名は gins_pretool_bash_entry・gins_repo_plugin_has_no_runner_mark・gins_command_under_sh。 filter の語。main b5c24c8 の contracts の verify の filter の語 272 のどれも、接頭辞 gins_ と 3 つの歯の名に部分の字として含まれず、接頭辞と名もどの語にも含まれない（確かめた）。 依存と順。depends は空（同じノートの行 e-signal と書く file が重ならない）。計画 5 節の鎖 plugin/hooks/hooks.json の f-stop（着地済み）→ f-gate-install で、依存の f-gate も着地済み。後の行 f-deliver（配達の hook）が同じ hooks.json に hook を足すなら、この行の着地の後に流す（席が便の bead の依存で持つ）。 範囲の外。停止の hook の command に印の検査を足すこと（tz hook stop は worktree で黙る・行 f-stop）。門の判じ方と tz の口の字（行 f-gate）。配達の hook（行 f-deliver）。席の許可の設定と、ほかの設定の hook。"

