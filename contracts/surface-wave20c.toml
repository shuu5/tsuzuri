schema = 1

[[contract]]
id = "g-nav"
title = "project board の nav と題の link の左の押しを、頁を読み直さない切り替え（href と同じ URL を履歴に積み、頁の signal を替えて頁の枠だけを組み直す・戻ると進むは popstate で戻す）にし、頁を替える時に節点の頁の読みを捨てる"
req = ["NFR1"]
section = "3"
write-set = ["crates/tsuzuri-surface/src/board.rs", "crates/tsuzuri-surface/src/frame.rs", "crates/tsuzuri-surface/src/project/nodearound.rs", "+crates/tsuzuri-surface/tests/pgsw.rs", "crates/tsuzuri-surface/tests/gcoach.rs", "=crates/tsuzuri-surface/tests/gpill.rs", "=crates/tsuzuri-surface/tests/hsblock.rs", "=crates/tsuzuri-surface/tests/ptitle.rs", "=crates/tsuzuri-surface/tests/gfresh.rs", "=crates/tsuzuri-surface/tests/gpulse.rs", "=crates/tsuzuri-surface/tests/gbnote.rs", "=crates/tsuzuri-surface/tests/aaround.rs", "=crates/tsuzuri-surface/tests/cround.rs", "=crates/tsuzuri-surface/tests/frame.rs", "=crates/tsuzuri-surface/tests/hspage.rs"]
verify = ["cargo nextest run -p tsuzuri-surface --test pgsw --no-tests=fail pgsw_", "cargo nextest run -p tsuzuri-surface --test gcoach --no-tests=fail gcoach_", "cargo nextest run -p tsuzuri-surface --test gpill --no-tests=fail gpill_", "cargo nextest run -p tsuzuri-surface --test hsblock --no-tests=fail hsblock_", "cargo nextest run -p tsuzuri-surface --test ptitle --no-tests=fail ptitle_", "cargo nextest run -p tsuzuri-surface --test gfresh --no-tests=fail gfresh_", "cargo nextest run -p tsuzuri-surface --test gpulse --no-tests=fail gpulse_", "cargo nextest run -p tsuzuri-surface --test gbnote --no-tests=fail gbnote_", "cargo nextest run -p tsuzuri-surface --test aaround --no-tests=fail aaround_", "cargo nextest run -p tsuzuri-surface --test cround --no-tests=fail cround_", "cargo nextest run -p tsuzuri-surface --test frame --no-tests=fail frame_", "cargo nextest run -p tsuzuri-surface --test hspage --no-tests=fail hspage_", "cargo run -q -p xtask -- surface-build", "cargo run -q -p xtask -- check"]
size = "M"
done = "(1) 面の crate の frame の pub fn switch_url は、左の button（Press の button が 0）を修飾の鍵なしで押し、今の頁と行き先の頁が違うとき、frame の href と同じ字を返す（地図から質問へ初心者で ?page=ask&mode=beginner・節点の頁から home へ経験者で ?mode=expert）。頁の全部の違う組と 2 つの mode で、返す字は PageId の from_query で行き先の頁に、Mode の from_query で同じ mode に読み戻る（歯 pgsw_plain_left_pushes_href） (2) 修飾の鍵（ctrl・meta・shift・alt のどれか 1 つ）つきの押しと、button が 1 か 2 の押しでは、初心者の mode で、地図から質問へも節点の頁から home へも None（歯 pgsw_keys_or_button_keep_default） (3) 今の頁と行き先の頁が同じときは、頁の全部と 2 つの mode で、左の押しでも None（歯 pgsw_same_page_keeps_default） (4) board.rs の fn App は let page = RwSignal::new(PageId::from_query(&query)); と {top(page, subject, mode)} と {move || page_view(page.get())} と {move || (page.get() == PageId::Home).then(|| view! { <CoachLayer/> })} と on_cleanup(move || back.remove()); をそれぞれ 1 度持ち、page_view( は 1 度で、window_event_listener(ev::popstate の後に Mode::from_query(&now) と go(page, subject, PageId::from_query(&now)); がこの順で 1 度ずつ在る。fn switch は frame::switch_url( と e.prevent_default(); と push_state_with_url( と go(page, subject, to); をこの順で 1 度ずつ持ち、fn press は e.button() と e.ctrl_key() と e.meta_key() と e.shift_key() と e.alt_key() を持ち、fn top は href=move || frame::href( を 2 度と on:click=move |e| switch(e, PageId::Home, page, subject, mode) と on:click=move |e| switch(e, l.page, page, subject, mode) を 1 度ずつ持つ（歯 pgsw_board_wiring_text） (5) nodearound.rs の pub use dom の並びに forget が在り、pub fn forget() の本文に SOURCE.set(None); が在り、board.rs の fn go は if page.get_untracked() == next { と project::nodearound::forget(); と subject.set(PageSubject::default()); と page.set(next); をこの順で 1 度ずつ持つ（歯 pgsw_node_source_forget_text） (6) 着地済みの歯 gcoach は board.rs の fn App に {move || (page.get() == PageId::Home).then(|| view! { <CoachLayer/> })} の字を見る（歯 gcoach_wasm_wiring）"
goal = "在りかの main は 70e45b0（計画 surface-plan 第 0.71 版・src と tests は試作の土台の bc5d92a と同じ）。計画 9 節の計画だけの行 g-nav を契約の行にする。承認は計画の裁定を継ぐ。拠りは持ち主の重いという指摘（2026-09-28・計画 9 節の行 g-nav の拠り）と、要件 NFR1（切り替えは URL に残る・page error 0）と規則の行 R-23。 なぜ。今の board.rs の fn App は頁を let page = PageId::from_query(&query); の値で頁の初めに 1 度だけ決め、上端の帯の nav の link と題の link は a の要素の href（frame の href の字 ?page=<頁の id>&mode=<mode>・home は ?mode=<mode>）だけを持ち on:click を持たない。そのため頁の link を押すたびに browser が文書を読み直し、index.html と stylesheet と js と wasm（試作の dist で wasm 3865263 byte・gzip の写し 1232784 byte）を取り直し、知らせの接続（/api/surface/events）を張り直し、上端の帯と頁の block の口を全部読み直す。通信の module（net.rs・行 g-reads）は、口ごとの読みの印で、見ている部品が無い間の読み直しの呼びを部品が戻ったときの 1 回にまとめるが、文書を読み直すとこの記録ごと捨てられる。 起草の測り（歯で測らず、この行の差分で持つ）。読むだけの境界の server を手元に 2 つ起こし（前 = 席の配る dist・後 = 試作の dist・同じ台帳）、Playwright で押しから 2 秒の間の要求を数えた。前は、どの切り替え（地図から質問・質問から題で home・home から抜けの検査・戻る 2 回）でも文書と stylesheet と js と wasm の 4 本と知らせの接続を取り直し、口を 5〜10 本読んだ（質問の頁 5 本・home の頁 9 本）。後は、文書と stylesheet と js と wasm と接続は 0 本（window に置いた印が残る）、口は地図から質問で 0 本・質問から home で home の頁だけの 4 本（next・pipeline・metrics・unreflected）・home から抜けの検査で 0 本・戻るで抜けの検査から home は 9 本（離れている間に知らせが来た home の 4 本と、同じ 2 秒の間の知らせの 1 巡の 5 本と読む）・戻るで home から質問は 0 本だった。節点の頁から質問へ替えて戻ると、つながりと時間軸の口を 1 本ずつ読み直して節点の頁を組み直し、頁の題は節点の題に戻り、page error は 0。対照に、頁を替える時に節点の頁の読みを捨てない版を組んで同じ手を撃つと、戻るで wasm が落ち（RuntimeError unreachable・片付いた signal の読み）、URL は節点の頁なのに画面は質問の block のまま残った。 在りか。board.rs（write-set・main で 290 行・wasm の target のときだけ組む）の fn App と fn project_name と fn top。frame.rs（write-set・448 行・host でも組む）の fn href と fn nav_links。nodearound.rs（write-set・772 行）の mod dom（wasm の target のときだけ）は、節点の頁の block（node・around・timeline の 3 つ・node.rs と timeline.rs も fn source を呼ぶ）が分ける読みを thread_local の SOURCE（Cell の Option の Source・Source は URL の query の RwSignal と read_path の読み）に持ち、fn source は SOURCE が在ればそれを返して read_path を呼ばない。頁の枠を組み直すと前の枠の RwSignal と read_path の Effect は片付くので、SOURCE を捨てずに節点の頁を組み直すと片付いた signal を読む（上の対照）。同じ形の手本は account board（account/board.rs）の tab の押し（修飾の鍵つきは browser の既定・prevent_default・push_state_with_url・query の signal・scroll_to_with_x_and_y・popstate で tab と mode を戻す・行 h-popstate）。 形（frame.rs）。pub struct Press（derive は Debug・Clone・Copy・Default・PartialEq・Eq・欄は pub の button が i16 と pub の ctrl・meta・shift・alt が bool）と、pub fn switch_url(now: PageId, to: PageId, mode: Mode, press: Press) -> Option<String> を fn node_href の前に足す。switch_url は button が 0 で 4 つの鍵のどれも押していず、now と to が違うときだけ Some(href(to, mode)) を返し、ほかは None（押しは browser の既定のまま＝新しい窓や tab・保存・今と同じ頁への link は今どおり文書を読み直す）。module の doc に 1 行（頁の切り替え・行 g-nav）を足す。 形（board.rs）。use leptos::ev; と frame の Press を use に足す。fn press（MouseEvent から Press を組む）・fn go(page, subject, next)（同じ頁なら何もしない・違えば project::nodearound::forget() と subject を PageSubject の既定に戻して page.set(next)）・fn switch(e, to, page, subject, mode)（switch_url が None なら何もしない・Some なら e.prevent_default()・history の push_state_with_url で URL を積む・go・window の scroll_to_with_x_and_y(0.0, 0.0)）を fn App の前に置く。fn App は page を RwSignal にし、PageSubject の RwSignal を変数 subject に持って provide_context し、window_event_listener(ev::popstate …) で今の URL から Mode を読んで変われば mode に置き、go(page, subject, PageId::from_query(&now)) を撃ち、on_cleanup で受け取りを外す。view は {top(page, subject, mode)}・<main class=page> の中の {move || page_view(page.get())}・TipLayer・CardLayer・{move || (page.get() == PageId::Home).then(|| view! { <CoachLayer/> })}。fn page_view(page: PageId) の形は変えない。fn project_name は (page: RwSignal<PageId>, subject: RwSignal<PageSubject>) を受け、頁の題の Effect の中で page.get() の見出しの語を読む（use_context は外す）。fn top は (page: RwSignal<PageId>, subject: RwSignal<PageSubject>, mode: RwSignal<Mode>) を受け、題の a と nav の a に on:click=move |e| switch(e, 行き先, page, subject, mode) を足し、nav の a の class は nav_links(page.get()) の中の同じ頁の class を返す closure にし、席の pill は Memo の seat_shown(page.get()) が真の間だけ seatpill::view を描く。href の字（frame::href）は残す。 形（nodearound.rs）。mod dom に pub fn forget()（SOURCE.set(None)）を足し、pub use dom の並びに forget を足し、SOURCE の doc を頁の枠を組んでから次に組み直すまでの読みに直す。fn source の形は変えない（SOURCE が無ければ今の URL で read_path を呼ぶ）。 変わらない物と読む順（歯で測らず、この行の差分で持つ）。fn App と上端の帯は頁の一生に 1 度だけ組むので、その口（台帳・project・問いの一覧・席）と知らせの接続は切り替えで組み直さない。頁の block の口は、前に読んだ口なら読みの印に戻って見ている部品が無い間に知らせが来たときだけ読み、初めての口なら 1 度読む（net.rs と flight.rs は書かない）。mode の切り替え（replace_state）と戻ると進むの中の頁の中の履歴（地図の眺めの切り替え・map.rs の popstate の受け取り）は今のまま。頁の一生の間だけと doc に書いた thread_local の記録（kit.rs の畳みの開き閉じ・地図のグラフの開いた箱の列と最後に読めた眺め）は、切り替えでは捨てず、文書を読み直すまで持つ（前の値を読むだけで片付いた signal を持たない）。節点の頁への link（グラフとつながりの図の箱の押し・location の set_href）と、account board へ戻る「戻る」は、今どおり文書を読み直すか別の窓を開く。 着地済みの歯（面の crate の tests を grep で確かめ、試作で撃った）。gcoach の gcoach_wasm_wiring は fn App の案内の層の字を見るので、字を {move || (page.get() == PageId::Home).then(|| view! { <CoachLayer/> })} に直す（write-set）。書く fn の字を読む歯 gpill（fn top の席の pill）・hsblock（fn App の画面の状態と fn page_view の形）・ptitle（頁の題の語）・gfresh と gpulse（fn top の最終の記録と脈と印）・gbnote（fn top の注記）・aaround と cround（nodearound.rs の pub use dom の並び）・frame と hspage（frame.rs の nav と href）は置き場だけの = で持ち、verify で撃つ（試作で全部通った）。board.rs・frame.rs・nodearound.rs を読むほかの着地済みの歯（brand・acctwire・hwstore・mstore・lcard・ncard・smore・maplink・ntime・nodepage・hsderive・graphnav・kcardlink）は書く fn の字を読まない（試作で通った・xtask check の workspace で撃つ）。 測り方・歯（tests/pgsw.rs・新しい file・接頭辞 pgsw_）。切り替えそのものと口の数は browser でしか測れない（net と board は wasm の target のときだけ・browser の runner の xtask accept は起こした server を要る）ので、歯は押しの決め（switch_url）を host で撃ち、board.rs と nodearound.rs の字を env! の CARGO_MANIFEST_DIR から読んで fn の本文（fn の名から次の行頭の fn・pub fn・#[component] まで）の字を見る（手本は歯 acctpop の apop_dom_wiring_in_source）。使う item は tsuzuri_surface::frame（pub mod）の Press（pub struct・pub の欄）・switch_url・href（pub fn）・Mode（ALL と from_query）・PageId（ALL と from_query）。歯の名は pgsw_plain_left_pushes_href・pgsw_keys_or_button_keep_default・pgsw_same_page_keeps_default・pgsw_board_wiring_text・pgsw_node_source_forget_text。 filter の語。main 70e45b0 の contracts の verify の filter の語 266 のどれも、接頭辞 pgsw_ と 5 つの歯の名に部分の字として含まれず、接頭辞と名もどの語にも含まれない（確かめた）。着地済みの gnav_（歯 graphnav）は pgsw_ を含まず pgsw_ にも含まれない。 依存と順。depends は空（ノートの行は 1 つ）。計画 5 節の鎖で、board.rs は g-coach（着地済み）の後、frame.rs は g-back-note（着地済み）の後、nodearound.rs は g-card-around（着地済み）の後で、この 3 つと tests/gcoach.rs を書く走行中と待ちの便は無い。台帳の一覧の行 g-ledger-kind（kit.rs と view.rs）と知らせの種類の行 c-ev-kind（view.rs と net.rs）と席の行 c-limit-resume（seatpill.rs）の書く file とは重ならない（この行は kit.rs・view.rs・net.rs・seatpill.rs を書かない）。tests/gcoach.rs は行 g-ledger-kind（ノート surface-wave18f・便 t3-hub.52.116）が置き場だけの = で持つので、この行は g-ledger-kind の後に流す（便の bead の依存・席が付ける・g-ledger-kind は gcoach.rs と board.rs を書かないので当て直しは要らない）。置き場だけの = の歯（frame・hsblock・gfresh は g-ledger-kind も、frame・hsblock は c-unref-now も = で持つ）を同じく = で持つ行とは器の交差の断りが同時に流さない。 範囲の外。節点の頁への link と hover の card の link の切り替え（文書を読み直すまま）。通信の module の path が変わる口の枠（read_path を呼ぶたびに足し、片付いた枠を外さない）の片付け。account board の題の link。browser での切り替えの測り（j-runner の accept を使う行）。"
