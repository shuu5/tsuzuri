r）に繋いで絶対にする（canonicalize はしない）。読めない file は、generated が base を読めない時と同じ断り（Refuse::ContractTable と TableError::Unreadable・理由は path を名乗る 1 行）を tailed で返す。 - 行の数は table::read_rows(path, text) の Ok の行の数で数える。Err の周（読めない区間）は行の数の断りにせず、そのまま後段へ渡し、後段の find_row の断りに任せる（base の行と同じ rc 2 と末尾 broken）。 - pointer は table::parse_pointer に、file の絶対 path と字 # と行の id を繋いだ字を渡して作る（Err は拡張子の断りと同じ字で返す）。契約は intake::generated_from(repo, pointer, text, materials) で組む。materials の読みと early と judge と render は今のまま同じ値を渡す。 - 関数 widen_lines は節の本文の読みを引数で受ける形にし、--design の周は今の show_head の読み、--contract の周は file の字を渡す。本文は、行が goal を持てば goal、無ければ section_text（review の design_text と同じ選び）。table_rows(repo, sha) の読みは替えない（file の行は base の行の列に無いので、自分の行の除外は pointer の字の比べのまま）。 - --placed の照らし（acceptance_of）は --design の周だけで撃つ（placed の断りがあるので --contract の周に来ない）。verify_gaps は両方の周で撃つ。 形（intake.rs）。関数 generated の本文のうち、置き場の外の照らしと show_head の読みを残し、find_row から Ok((contract, body)) までを新しい関数 generated_from（pub(in crate::pipe)・doc は「行の本文 text から契約を組む。text は base の doc か preflight の --contract の file」）へ移し、generated は読んだ text で generated_from を呼ぶだけにする。移した本文の字と断りの順は替えない。受付の read_args の --contract の断り（hand-written-contract）は替えない。file の行の数は 1467 行で、preflight の余地の行（headroom）は 15 行なので、足すのは関数の頭と doc と呼びの 12 行までにする（欄 growth）。 歯の file（vpfcon.rs）。頭の //! の行に接頭辞 vpfcon_ と親の helper を use super::*; で使うことを書き、続けて use super::*; を置く（vpfgap.rs と同じ形）。toy は derive_repo と table_doc と table_region と derive_row（行 a・欄 verify を字 cargo nextest run -p toy --no-tests=fail derive_ の 1 行の配列に差し替えた形・歯 vpfgap_ の通る見本 preflight_with と同じ差し替えで、write-set は導出が verify の歯の在りかから作る）の組み で作り、契約の file は置き場の dir の隣に作る一時の dir（repo の外）に、字 schema = 1 と空の行と derive_row（行 a・欄 verify を字 cargo nextest run -p toy --no-tests=fail derive_ の 1 行の配列に差し替えた上で、欄 goal の値は本文の字を二重引用符で囲んだ値）の字 を繋いだ字で書く。本文の字は 本文。とする。撃ちは pipe_cmd に引数の列（preflight・--contract・path・--bead s2-a・--repo・--rules ceiling_rules(state)・--state-dir）を渡し、作業 dir を替える歯だけ current_dir を足す。比べの相手は preflight_raw(&repo, &state, docs/design/toy.md#a, s2-a, true)。行を 2 本持つ file は derive_row の行 a と行 b の 2 行（どちらも欄 verify を字 cargo nextest run -p toy --no-tests=fail derive_ の 1 行の配列に差し替えた形）、0 本の file は字 schema = 1 だけ、md の file は同じ字を名 contract.md で書く。各歯は run_dirs(&state) が空であることを見て、終わりに clean で畳む。 文書（contract-source.md の 21 節）。節の箇条 触らない の行の直前に次の 1 行を足す（全体で +1 行・ほかの行は替えない）。 - 契約の file の口（tsuzuri の memo t3-hub.92.7・持ち主の決め D1）: ｀pipe preflight --contract F｀ は、契約表の導出の形の 1 行の ｀.toml｀ の file を base の木を通さずに読み、pointer の path を F の絶対 path にして同じ judge を撃つ（行の本文から契約を組む後段は ｀generated_from｀ の 1 本・受付の ｀--contract｀ は今のまま ｀hand-written-contract｀ で断る）。 この節では逆引用符を全角の ｀ で書く。doc に足す字では全角の ｀ を半角の逆引用符に替える（ほかの字は替えない）。 done と verify の対応。1 つ目から 5 つ目の項は verify の 2 行目（e2e の歯 vpfcon_）が測る。6 つ目は 4 行目、7 つ目は 3 行目（着地済みの歯 pipe_preflight_ の 4 本・行の歯の名は 1 本を代表に名指す）が測る。1 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので行の verify に書かない。 範囲の外。done の字が節の本文に在るかの機械の照らし（審査の section-material-missing の機械の分）、受付が bead から契約を読むこと、設計係の終えの門が preflight を撃ち直すこと、設計ノートと tz derive の契約表を退けることは、段 S4 の後の行（節 20）。"

