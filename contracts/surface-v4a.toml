goal = "在りか。差の file は無い（設計だけの行・決め D2）。便は器の src 5 file と器の e2e の歯 2 file と器の設計の文書 1 file を書く。判定と印と止めは scribe2/crates/scribe2/src/hook/turn_end.rs に足す。呼びは hook/mod.rs の fn dispatch の 2 つの腕（pre-tool-use と stop）を直す。頭の時刻の読みは hook/ledger_guard/notes.rs の fn head_time を pub(crate) にして使い（親 hook/ledger_guard.rs の mod notes を pub(crate) mod notes にする・第 2 の読み手を作らない）、runner の見分けは hook/utterance.rs の fn is_runner を pub(super) にして使う。歯は新しい子 module の file scribe2/crates/scribe2-boundary/tests/e2e/hook/session/wipst.rs（接頭辞 wipst_）に置き、親 tests/e2e/hook/session.rs には mod wipst; の 1 行だけを足す（子は use super::* で親と祖父 hook.rs の助けを使う）。lib の歯は turn_end.rs の tests module の 1 本を直す。群の main.rs と kfold の表は書かない（e2e の群に module を足さない）。depends は空（このノートのほかの行と触る file が交わらない・行 v-wip-lines と v-sort-gist は着地済み）。 なぜ。持ち主は作り直し v4 で、turn の終わりの門が、その turn で台帳か設計を書いたのに作業中の bead の定型の行が古い時に 1 度だけ止めると決めた（決め D5・判断の記録 ADR-72 の決定 (6)）。行 v-wip-lines は定型の行を圧縮の後に出すが、席が行を足し忘れると古い計画が出る。今の turn_end.rs は event log と控え told だけを読み、台帳を読まない（module の doc）。 決め（code で照らした・file 行は main 8837a96e）。 - 書きの測り。PreToolUse の門が全部通した周（fn dispatch の pre-tool-use の腕で pre_tool_use の戻りの rc が RC_OK の周）に、turn_end::mark が session の置き場（turn_end.rs の fn place・<state>/session/<id>/）の新しい file wrote に 1 行（UTC の秒の時刻・空白・語 ledger か design）を足す。台帳の書きは古さの印の門 stale_gate.rs の fn mark と同じ読み（ledger_guard の segments と write_of の subcommand が WRITES に在る片を持つ command）。設計の書きは編集の道具（guard.rs の GUARDED の 4 つ）の編集先を role_guard::locate で anchor の HEAD の宣言（PathKinds::read_at_head・鍵 design-intent-paths と design-doc-paths）から分けた種別が DesignIntent か DesignDoc の周。器は tsuzuri の path を焼かない。先に PathKinds::Default で locate して Outside の周は宣言を読まずに印を書かない（git の子 process を repo の外の編集で撃たない）。runner（is_runner が真・--plugin-root が置き場の pipe の dir の下）と session の id の無い周は印を書かない。印を書けない周は黙る（門の allow を変えない・fail-open）。 - turn の区切り。印は判定の後に空にする。turn の最初の書きの時刻 T は wrote の最初の読める行の時刻。再入の stop（stop_hook_active）は今のまま判定せず、印も消さない。 - 古さの定義。定型の行は、行の頭の空白を落とした字が recent::WIP_HEADS の 4 つの頭のどれかで始まり、頭の後の字が空白だけでない行（recent::wip_state と同じ選び）。行の時刻は、notes の中でその行より前の最後の段の頭の行（head_time が Some を返す行・札 [席 <時刻>] の形）の時刻の下の端。T を分に切った値（T から T を 60 で割った余りを引く）以上の時刻を持つ定型の行が、作業中の bead（status が in_progress）のどれか 1 本に在れば新しい。無ければ古い。分に切る訳は、席の段の頭が分の形（date で埋める）で、同じ分の書きを古いと読まないため。10 分と時の形の頭は下の端で読むので、同じ 10 分か同じ時の中でも古い側に倒れる。 - 作業中の bead が 0 本の turn。書いた turn は止める（行の wip= の値は字 -）。決め D5 は作業の状態を作業中の bead に置くので、bead が無いと圧縮の後に状態が残らない。止めの行が in_progress にする手を名指す。 - 台帳の読み。今の器の口 crate::seat::ledger::read_text（bd --readonly list --all --limit 0 --json・子 process の cwd は hooked.cwd・client は --bd の旗か PATH の bd）を 1 回だけ撃ち、recent::beads_of で読む。待ち上限は今の rules 行 seat.ledger_timeout_s（timeout_of・manifest は --rules か埋め込み）。新しい rules 行は足さない。印の無い turn は台帳を読まない（NFR5）。 - 1 度だけ。止めた周は控え told に stale <T の字> と block を 1 回の書きで足して rc 2・stdout 0 byte・stderr 1 行で止める（打刻しない・未仕分けの止めと同じ外形）。印は止める前に空にするので、続く再入でない stop は通し、次の turn は新しい書きの時だけ判じる。再入は今の fn release が控えの最後の block を見て Idle を打つ。 - 未仕分けの止めが先。fn stop は今の未仕分けの判定が Block の周はそれだけで止め、印を消さない。Pass と Unjudged の周だけ古さを判じる（1 度の stop で止めは 1 つ）。 - 読めない周。Reason に 3 語を足す。marks-unreadable（wrote が在るのに読めないか空にできない・控えを持たない）・ledger-unreadable（rules を読めない・行が無い・子が落ちる・JSON を読めない）・ledger-timeout（待ち上限を越えた）。台帳の 2 語は keeps_record を真にし session ごとに 1 度だけ記帳する。どれも止めず TurnEndUnjudged を記帳して打刻する（POLARITY は今の in-loop・fail-open のまま・極性の一覧と外形の snapshot は替わらない）。 形（turn_end.rs）。 - 定数 WROTE_FILE（字 wrote）。enum Wrote（Ledger と Design・as_str は ledger と design）。 - 純関数 wrote_of(tool, command, kind) は Option<Wrote> を返す。tool が Bash なら command の片のどれかが台帳の書きの時 Ledger。tool が GUARDED に在り kind が Some(DesignIntent) か Some(DesignDoc) の時 Design。ほかは None。 - 純関数 stale_of(since, beads) は enum Staleness（Fresh と Stale { wip: Vec<String> }・wip は作業中の bead の id の台帳の順）を返す。 - TurnEndDecision に腕 Stale { wrote: String, wip: Vec<String> } を足す（型の名は替えない・極性の一覧の boundary の字は今のまま）。Record に腕 Stale(String)（控えの行 stale <ts>）を足す。 - pub(super) fn mark(hooked, args, payload) と、fn stop の引数を state_dir から hooked（&Hooked）に替える（dispatch の stop の腕が &hooked を渡す・中の state_dir は hooked.dir）。 - 止めの 1 行は次の字（NAME は器の名）: NAME: turn-end stale 作業中の bead の定型の行が古い wrote=<T の字> wip=<id を , で繋いだ字か -> — 作業中の bead の notes に頭 [席 <UTC の時刻>] の段で 計画: 次の手: 優先: 未決: の行を足す（作業中の bead が無ければ手を付けた epic か memo を in_progress にする）。 - module の doc の頭の段に、印と古さの判定と台帳の 1 回の読みの 2 文を足し、今の台帳は読まないの字を、印の無い turn は台帳を読まないに直す。 - lib の歯 hook_unsorted_stop_reasons_are_five_closed_words_and_two_keep_a_record を名 hook_unsorted_stop_reasons_are_eight_closed_words_and_four_keep_a_record に替え、断言を done の最初の項の 2 つの列に直す。この名の歯を名指す契約の行は無い（main 8837a96e の contracts の grep で 0 件）。 形（mod.rs）。dispatch の pre-tool-use の腕は pre_tool_use の戻りを受け、rc が RC_OK の時だけ turn_end::mark(&hooked, args, payload) を撃ってから戻りを返す。stop の腕は turn_end::stop(args, payload, &hooked) にする。 形（dialogue-surface.md）。§12 の約束の末に 1 項を足し、約束 8 の閉じた 5 語を 8 語に直す。足す項: 書いた turn の古さの止め（印の file wrote・最初の書きの分・作業中の bead のどれかに新しい段の定型の行・0 本も止める・台帳の 1 回の読みと待ち上限 seat.ledger_timeout_s・未仕分けの止めが先）。 done と verify の対応。最初の項は verify の 3 行目（lib の歯）。2 つ目から 8 つ目の項は verify の 2 行目（新しい子 module wipst の歯）。最後の項は verify の 4 行目（着地済みの e2e の歯 hook_unsorted_stop_・session.rs に在る・stop の引数の替えで外形が替わらないこと）。歯の数と見本の字は節 26。 範囲の外。2 つ目の止め（要望の時刻）は行 v-sort-gist で着地済み。Bash の script や python で書いた設計の file は印に載らない（道具の編集だけを測る・席の設計の書きは台帳の記帳を伴うので台帳の印が拾う）。定型の行の字の中身の良し悪し、子の係（SubagentStop）の turn、頭の無い notes の書きの形の門は扱わない。"

