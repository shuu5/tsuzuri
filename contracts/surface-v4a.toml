に替える。『- verify の 1 行目は git apply --reverse --check docs/design/patch/<行>.patch、続けて clippy（-p <歯の crate> --all-targets --no-deps -- -D warnings）と、done の歯を撃つ』を『- verify の 1 行目は clippy（-p <歯の crate> --all-targets --no-deps -- -D warnings）、続けて done の歯を撃つ』に替える。『床と preflight は、前の行の差を着地の形で commit した branch で撃つ。』を外す。『（触る file が交わらない・交わっても差が両順で当たる）』を『（触る file が交わらない）』に替える。『交わる時は差の塊の文脈を離して両順で当てる（判断の記録 ADR-60）、それでも当たらなければ depends を書く。』を『交わる行は器が待ちの理由 overlap で順に流すので、depends は前の項の時だけ書く。』に替える。『gate に渡す diff は 150000 byte まで（gate は移動を畳むので、git diff を --no-renames を付けずに測る）。』を『gate に渡す diff は 150000 byte までなので、替える字の見込みがそれを越える行は割る。』に替える。『（適用の script の節の番号は行の数でない）』を『（節の番号は行の数でない）』に替える。 - 節 5。項『新しい歯の file は、頭の //! の行』と項『歯の file を path で読む歯は』と項『歯の fn も clippy の』を外す。『噛みの log は left と right の行を伏せる。』を外す。 - 節 6。見出しの行『## 6. 否定の見本と噛み』を『## 6. 否定の見本』に替える。『噛みは、log の panicked の行でその句の断言で落ちたことを照らす（歯の名が落ちただけでは足りない）。』を外す。項『噛みは句ごとに撃つ』と項『噛みで rc 0 が出たら』と項『噛みの script には』を外す。 - 節 7。『- 床は頼みが名指す席の pin の tz で、床の写しの根で』を『- 頼みの頭の組みが なし の係は cargo を撃たない。床は頼みが名指す席の pin の tz で、写しの根で』に替える。項『適用の script（python）は』と項『適用の script は、節の番号と版』と項『出す物に差の file（.patch）を持つ係は』と項『器の表の検査の rc は』と項『終える前の門は、床の写し』を外す。『- 足した行ごとに scribe2 pipe preflight --state-dir <空の state dir> --repo <床の写し> --design』を『- 写しの branch に行を commit し（preflight は HEAD の木を読む・main を動かさない）、足した行ごとに scribe2 pipe preflight --state-dir <空の state dir> --repo <写し> --design』に替える。 - 節 8。項の頭の『- 出す物は、notes.md（』から『席が撃つ命令の列。』までを『- 出す物は、頼みが名指す file（行と節の断片・判断の記録の下書き・調べの表など）と notes.md（調べ・実測・未確か・席への問い・印は V 確かめた・D 記録から・I 見立て・U 分からない）。』に替える（続く『出す物の file の名に report を使わない。』は残す）。 - 並べ替え。残る節を今の番号 1・3・5・6・8・9・10・7 の順に並べ、見出しの番号を 1 から 8 に付け直す。見出しの 8 行は、この順に『## 1. 置き場』『## 2. 契約の行の書き方』『## 3. 歯の置き方（段の束ね・判断の記録 ADR-32）』『## 4. 否定の見本』『## 5. 出す物と公開』『## 6. 道具の撃ち方と読む範囲』『## 7. 検証の群（判断の記録 ADR-61）』『## 8. 床と受付の照らし』。節と節の間は空の行 1 つ。床の節を最後に置くのは、句の歯の動かした見本が file の末（最後の節）に句を足すので、最後の節が句の表の句を持たないためである（今の検証の群の節は句 budget を持つ）。替えた後の file は 89 行。 歯（agref.rs）。module の doc の 1 行目の括弧の中の末に字『・設計ノート surface-v4a 行 ag-designer・判断の記録 ADR-72 の決定 (3)』を足し、2 行目の句の数の説明を『… reference.md が、設計係に残す 34 句を決めた節の塊の中に 1 度ずつ持ち、外した実装と道具の手順の 8 つの語と写さない案内の幅の値と直す前の群の頭の予算の字を持たず、見出しが 8 節であることを見る。』の形に直す（3 行目と 4 行目は替えない）。句の表 CLAUSES は、句 tmp-index・tmpdir・target-share・touch-trees・nested-binary・fmt-shape・diff-renames・panicked-line・bite-path・bite-guard・plus-one・srs-regex の 12 項を外し（長さ 46 を 34 に）、残る句の節の番号を 3 は 2・5 は 3・6 は 4・8 は 5・9 は 6・10 は 7 に替える（0 は替えない・句の字と名と並びは替えない）。表 ABSENT の末に 8 項を足す（長さ 2 を 10 に・この順）。patch-path『docs/design/patch/』・patch『差の file』・floor-record『floor.tsv』・bite『噛み』・fold『畳み』・apply-script『適用の script』・target-dir『CARGO_TARGET_DIR』・prototype『試作』。定数 HEADS（上の見出しの 8 行の字・この順）と、関数 heads（字 ## と空白で始まる行を順に返す）を足す。歯 agref_reference_heads_are_the_eight_sections は、heads の列が HEADS と一致することを断言する。歯 agref_old_procedure_words_are_named は、ABSENT の 3 項目から末までの項ごとに、file の末に改行と字 - と空白とその字と改行を足した見本の faults がその名 1 つだけであることを断言する。今の歯 4 本の本文は替えない。 歯（agflr.rs）。file の末の、doc の行『/// 参照の file の置き場（workspace の根から）。』から file の末まで（定数 REFERENCE と CLAUSES・関数 reference と section と faults・歯 agflr_reference_holds_the_floor_clauses_once_in_their_sections と agflr_reference_clause_removed_doubled_or_moved_is_named）を外し、直前の空の行も外して、file を前の歯の閉じ括弧の行と改行で終える。module の doc の 4 行目の『参照の file の 7 節と 11 節の句は、手引きが天井の文で振る舞いを持たないので、節の塊の中の字を照らす。』を外す（4 行目は『//! --scribe2 で渡す。』になる）。使われなくなった use の項は外す。ほかの歯は替えない。 done と verify の対応。1 番目から 4 番目の項は verify の 2 行目（群 teeth6 の歯 agpl_）、5 番目から 7 番目は 3 行目（段の file の歯 agref_）、8 番目は 4 行目（agflr_）、9 番目は 5 行目（ageff_）が測る。型と手引きと参照の file は Claude Code が係を起こす時に読む設定と天井の文で、歯から係を起こして振る舞いを測れないので、字を照らす。1 行目の clippy は done に載せない守り（外した助けの残りを dead_code で落とす）。xtask の check は器の共通 verify が撃つので verify に書かない。ageff.rs は書かず、5 行目の filter が当たるので置き場だけの = で名指す。入口の赤は、main の drafter.md が設計係の句を持たず、参照の file が外す語と 11 節の見出しを持つので、2 行目と 3 行目が rc 100 で落ちる。噛みは撃たない（決め D2）。 範囲の外。調べ係と検証役の型の本文は替えない。終える前の門の床の撃ち直しの code（境界の hook subagent_stop の床の段と中核の agent::stop::floor）と agflr.rs のその歯は、この行では消さない（差の file を出す物に持つ係が居なくなると門は撃たれず、消すのは後の段の行）。席の頼みの雛形と器の雛形と審査役の prompt は替えない。字の