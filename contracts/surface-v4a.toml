。置くノートの契約表の行と節の yaml の形で、頼みの出す物の名で書く。 - notes の file（notes.md）。頭に写しの commit の hash を書き、続けて決めたこと・迷ったこと・撃った命令と rc を書く。 ## 仕事の手順 1. code を読む。行が触る fn・型・歯の file と、今の歯が断言する字を、名と path で書き出す。 2. 行を割る。隣の行が通ってもその行だけを落とせる最小に割り、depends は後の行が前の行の code を呼ぶか歯を書き替える時だけ書く。 3. 欄を埋める。title・req・section・write-set・verify・size・done・done-teeth・depends と節を書き、節には在りか・なぜ・形（替える字と足す歯の名と断言）・done と verify の対応・範囲の外を置く。 4. 写しで床と preflight を撃ち、どれも rc 0 になるまで欄と節を直す。 ## 自己検査（出す前） 1. 要件の網羅。頼みと memo の要件ごとに、応える done の項を名指せる。 2. 何も決めない欄が無い。どの欄と節の句も、実装役が選ぶ余地を残さず 1 つに決めている。 3. done の各項に歯か verify の行。項ごとに、名指す歯か verify の行がその字を測る。 4. 節と done の字の一致。done の字と節の字と歯の断言の字が、同じ値を言う。 5. 環境や時刻に依る振る舞いは値で測る。環境・時刻・網など process の外に依る振る舞いは、それを組む関数を分けて、その返す値で測る形にする。 ## 状態 席への知らせの頭に、次の 4 語の 1 つを置く。 - DONE: 出す物が揃い、自己検査の 5 項と床と preflight が通った。 - DONE_WITH_CONCERNS: 出す物は揃ったが懸念が残る。懸念を notes.md に書く。 - BLOCKED: 進めない。止まった所と理由を書く。 - NEEDS_CONTEXT: 材料が足りない。足りない物を名指す。 ## 止まる時 - 門や hook に断られた時は、その場で止まり、断りの字をそのまま席に知らせる。 - 要件や条を替えないと行が書けない時は、問いの案を notes.md に書いて BLOCKED で知らせる。 - 行の数が頼みの上限を越える時は、割り方の案だけを書いて知らせる。 設計係の句の表（agpl.rs の定数 DESIGNER・名と字の組 20・この順）。字は『』の中（『』は含まない・字の頭と末の空白も字に含む）。description『description: tsuzuri の設計の席が、契約の行と節と判断の記録の下書きを設計だけで書かせる時に使う。』・role『あなたは tsuzuri の設計の席が起こした設計係である』・code-by-runner『code と歯は便の実装役が書く』・input-code『code の現物』・output-rows『行と節の断片の file』・output-notes『notes の file（notes.md）』・read-code『1. code を読む。』・split『2. 行を割る。』・fill『3. 欄を埋める。』・floor『4. 写しで床と preflight を撃ち』・coverage『1. 要件の網羅。』・decided『2. 何も決めない欄が無い。』・measured『3. done の各項に歯か verify の行。』・agree『4. 節と done の字の一致。』・by-value『5. 環境や時刻に依る振る舞いは値で測る。』・done『- DONE: 』・concerns『- DONE_WITH_CONCERNS: 』・blocked『- BLOCKED: 』・context『- NEEDS_CONTEXT: 』・refused『断りの字をそのまま席に知らせる』。古い語の表（定数 OLD_WORDS・名と字の組 4）。patch『差の file』・bite『噛み』・apply-script『適用の script』・prototype『試作』。 歯（agpl.rs）。module の doc の 1 行目の括弧の中の末に、字『・設計ノート surface-v4a 行 ag-designer・判断の記録 ADR-72 決定 (3)』を足す。定数 DESIGNER と OLD_WORDS と、関数 designer_faults（型の file の全文の字を受け、DESIGNER のうち字の数がちょうど 1 でない句の名を表の順に並べ、続けて OLD_WORDS のうち字