schema = 1

[[contract]]
id = "t-daily-deny"
title = "日に 1 度の全部の撃ち（xtask の daily）が、check の後に歯の写しの孤児の照らし（insta-refs）と依存の監査（根と scribe2 の cargo deny の 2 本）を順に撃ち、落ちた段の名を記録の行と memo に書く（持ち主の決め D3・memo t3-hub.92.3・設計だけの行）"
req = ["NFR3"]
section = "3"
write-set = ["xtask/src/daily.rs", "xtask/tests/teeth1/vdaily.rs"]
verify = ["cargo clippy -p xtask --all-targets --no-deps -- -D warnings", "cargo nextest run -p xtask --test teeth1 --no-tests=fail vdaily_"]
size = "M"
done = "(1) 定数 AFTER は 3 段をこの順に持ち（段 insta-refs は cargo の引数 run -q -p xtask -- insta-refs と cwd 写しの根・段 deny は引数 deny check -D unmatched-skip -D advisory-not-detected と cwd 写しの根・段 deny-scribe2 は引数 deny check と cwd scribe2）、定数 REFS_ENV は字 INSTA_SNAPSHOT_REFERENCES_FILE で src/snaprefs.rs の同じ名の定数の行と一致し、fn refs_dir は出力の file の拡張子を insta-refs に替えた path を返す（歯 vdaily_consts_fixed） (2) 全部の段が通る周は、偽の cargo がこの順に 4 度撃たれ（check は cwd 写しの根で FORCE の環境変数と、値が refs_dir の下の insta-refs.txt の REFS_ENV と、行 refs-entries=0 を持つ・insta-refs は引数の末に refs_dir の path を持ち 2 つの環境変数を持たない・deny は cwd 写しの根・deny-scribe2 は cwd 写しの scribe2）、出力の file は 4 度の撃ちの出力をこの順に持ち、記録の行は step=check rc=0 memo=- で台帳に書かない（歯 vdaily_pass_records_no_memo） (3) check の後の 3 段のどれか 1 段の偽の cargo が rc 0 でない周は、記録の行が step=その段の名 rc=その rc memo=fx-9 で、その段より後の段を撃たない（歯 vdaily_after_step_failure_names_the_step） (4) check が落ちた周は check の後の段を 1 つも撃たない（歯 vdaily_after_step_failure_names_the_step） (5) check を撃つ時、refs_dir は在って項目が 0 で（偽の cargo が check の撃ちで数えて記録した行 refs-entries=0）、撃つ前に refs_dir の下に置いた古い file は撃った後にも無い（歯 vdaily_refs_dir_emptied_before_check） (6) 着地済みの歯 vdaily_fail_memo_then_recur と vdaily_fetch_and_bdw_failures と vdaily_units_template と vdaily_main_wiring が緑のまま（verify の 2 行目） (7) AFTER の 3 段のそれぞれについて、fn after_command が返す Command は、program が NICE の program で、引数が NICE の引数・Daily の cargo・段の引数（段 insta-refs は末に渡した refs の path）の順で、cwd が写しの根か写しの根の下の dir scribe2 で、get_envs が FORCE の名と REFS_ENV の名をどちらも値 None（外す）で持つ（歯 vdaily_after_steps_drop_the_check_env）"
done-teeth = ["1:@2", "2:@2", "3:@2", "4:@2", "5:@2", "6:@2", "7:@2"]
goal = "在りか。差の file は無い（設計だけの行・作り直し v4 の決め D2）。便は 2 file を書く。xtask/src/daily.rs に段の定数と段の撃ちを足し、xtask/tests/teeth1/vdaily.rs の fixture を 4 度の撃ちに合わせて直し、歯 3 本（vdaily_after_step_failure_names_the_step・vdaily_refs_dir_emptied_before_check・vdaily_after_steps_drop_the_check_env）を足して着地済みの歯 2 本（vdaily_consts_fixed・vdaily_pass_records_no_memo）の断言を伸ばす。群の main.rs と kfold の表は書かない（module を足さない）。systemd の雛形（xtask/systemd/tsuzuri-daily.service と .timer）と main.rs の呼びは替えない。depends は空（行 v-ci-watch-off とは触る file が交わらず並べる）。 なぜ。持ち主は 2026-10-06 に、main への push ごとの GitHub の CI を止め、日に 1 度の全部の撃ち（xtask の daily）に寄せると決めた（決め D3・作業中の計画の正本は台帳の epic t3-hub.92・段の memo t3-hub.92.3）。器の着地の門が同じ xtask の check を着地の直前の木で撃つので、CI の job check（8 割り）は重なっている。ただし CI の 11 job のうち 3 つ（根の依存の監査 deny・器の依存の監査 scribe2-deny・歯の写しの孤児の照らし insta-refs）は着地の門の check に無い。この行はその 3 つを daily へ先に移し、CI を止める行 t-ci-stop が監査の穴を作らないようにする。決定はしご。要るか: 依存の監査は憲法の条 P-26.5 が求める。既に在るか: daily の段の撃ちと落ちの memo と記録の行（xtask/src/daily.rs の fn shoot と fn tell）と、写しの孤児の判じ（task insta-refs・xtask/src/snaprefs.rs）と、cargo-deny 0.20.2（ci.yml が pin する版と同じ・host の ~/.cargo/bin に在り、systemd の雛形の PATH が持つ）をそのまま使い、段を足すだけにする。 条 P-26.5 の読み。条の字「依存の重複した版・脆弱性・使ってよい条件（ライセンス）を CI で監査する」は、平易の文が「自動の検査（CI）で監査します」と書くので、日に 1 度の自動の撃ち（host の利用者の timer が撃つ daily）で満たすと読み、条の字は替えない。規則の行 R-5（CI 5 分以下）は検出線なので替えない。 形（xtask/src/daily.rs）。足す定数と関数は次の 3 つ（字は二重引用符で囲んだ Rust の字の literal・節は二重引用符を書けないので囲みを省いて書く。戻し方は、各段の名と各引数と環境変数の名と拡張子の字を、それぞれ両側を二重引用符で囲む）。 /// check の後の段（段の名・cargo の引数・写しの根からの cwd〔空の字は根〕）。最初の段 insta-refs だけ、引数の末に refs_dir の path を足す。 pub const AFTER: &[(&str, &[&str], &str)] = &[ (insta-refs, &[run, -q, -p, xtask, --, insta-refs], ), (deny, &[deny, check, -D, unmatched-skip, -D, advisory-not-detected], ), (deny-scribe2, &[deny, check], scribe2), ]; /// 入れ子の段の歯が読んだ写しの path を足す file を名指す環境変数（src/snaprefs.rs の REFS_ENV と同じ名）。 pub const REFS_ENV: &str = INSTA_SNAPSHOT_REFERENCES_FILE; /// 読んだ写しの file を置く dir（出力の file の拡張子を insta-refs に替えた path）。 pub fn refs_dir(out: &Path) -> PathBuf AFTER の 1 つ目の段の空の cwd の字は二重引用符 2 つ（空の字）で、ほかの 2 段も同じく 3 つ目の項を持つ（deny は空の字・deny-scribe2 は scribe2）。 形（段の撃ち・fn shoot）。段の順は fetch → checkout → 出力の file を作る（落ちれば段 out と rc 1・今のまま）→ refs_dir を空で置く（前の dir を消して作り直す・落ちれば段 refs と rc 1）→ check → AFTER の 3 段。check の撃ちは今の argv と cwd と FORCE の環境変数に、環境変数 REFS_ENV（値は refs_dir の下の file insta-refs.txt の path）を足す。AFTER の段は、NICE の program と引数・cargo の program・段の引数（insta-refs の段は末に refs_dir の path）を、cwd を写しの根（cwd の字が空）か写しの根の下の dir（scribe2）にして撃ち、FORCE と REFS_ENV の 2 つの環境変数を子の環境から外す（Command の env_remove で外し、親の process がどちらかを持っていても子に渡さない。daily 自身の check と CI の job check は入れ子の段の歯を撃つ時に 2 つを置くので、外さないと歯 vdaily_ を撃つ process から子へ継がれる・便 t3-hub.92.3.1 の契約審査の見つけ）。AFTER の段の Command は新しい関数 pub fn after_command(d: &Daily, step: (&str, &[&str], &str), refs: &Path) -> Command が組む（program・引数・cwd・2 つの env_remove までを持ち、stdout と stderr は持たない。cwd は段の 3 つ目の字が空なら Daily の root そのもの、空でなければ root にその字を join した path）。fn shoot は AFTER の項ごとに after_command を呼び、出力の file への stdout と stderr を足して撃つ。歯は process の環境変数を置けない（workspace は unsafe を禁じ、edition 2024 の set_var は unsafe）ので、外すことは after_command の返す Command の get_envs で測る。AFTER の段の stdout と stderr は出力の file の末に足す（追記で開き、開けなければ段 out と rc 1）。最初に rc 0 でない段の名と rc を返し、後の段は撃たない。全部の段が通れば今のまま段 check と rc 0 を返す（記録の行の形と open_memo の読みは替えない）。check の出力の file は今のまま撃つたびに作り直す。 形（memo の本文・fn memo_body）。観測の 1 行の「xtask の check を撃ち、段 X が」の所を「xtask の check と、check の後の段（insta-refs・deny・deny-scribe2）を順に撃ち、段 X が」に替える。ほかの字（origin/main と sha の木・出力は file と記録は file の句・4 つの節の見出し・引き金）は替えない。module の頭の doc は、撃つ物に check の後の 3 段を足した字に直す。 done と verify の対応。全部の項は verify の 2 行目（群 teeth1 の歯 vdaily_）が測る。1 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので verify に書かない。入口の赤は、main の daily.rs が AFTER と REFS_ENV と refs_dir を持たないので歯の file の組み立てが落ちる（2 行目が組み立ての失敗で rc 0 でない）。 歯（xtask/tests/teeth1/vdaily.rs）。fixture の偽の cargo は、撃たれた回数を file cargo.n に数え、1 度ごとに cwd（pwd -P）と環境変数 TSUZURI_CHECK_NESTED_ALL と環境変数 INSTA_SNAPSHOT_REFERENCES_FILE の値と引数の全部と区切りの行 --- を file cargo.seen の末に足し（環境変数 INSTA_SNAPSHOT_REFERENCES_FILE を持つ撃ちでは、区切りの行の前に、その値の親の dir の項目の数を字 refs-entries= に続けた 1 行も足す）、stdout に out- と回数の 1 行を出し、file cargo.rc.<回数> の rc（file が無ければ 0）で終える。Fx の shoot は撃つ前に cargo.n と cargo.seen と cargo.rc の file を消し、渡された rc を cargo.rc.1 に書く（1 度目の撃ちが check）。origin の最初の commit に scribe2/ の下の file を 1 つ置き、写しに dir scribe2 を持たせる（無いと段 deny-scribe2 の cwd が無く rc 127）。歯 vdaily_consts_fixed に、AFTER の 3 段の字（段の名・引数・cwd）と、REFS_ENV の字と、read_root で読んだ xtask/src/snaprefs.rs が行 pub const REFS_ENV: &str = INSTA_SNAPSHOT_REFERENCES_FILE;（字の値は二重引用符で囲む）を持つことと、refs_dir の値（daily.out から daily.insta-refs）を足す。deny の段の引数は、依存の監査の着地済みの 1 行（行 k-deny の ci.yml の job deny の run の字）から頭の cargo を除いた字と同じである。歯 vdaily_pass_records_no_memo は、cargo.seen が 4 度の撃ちの字（上の done の 2 つ目の項の cwd と環境変数と引数）をこの順に持ち、出力の file が out-1 から out-4 の 4 行で、記録と台帳の断言は今のままであることを断言する。新しい歯 vdaily_after_step_failure_names_the_step は、check の後の 3 段のそれぞれについて、その段の回数の rc を 3 にした撃ちの記録の行の段と rc と memo（fx-9）と、cargo.n がその段の回数で止まることを断言し、check の rc を 3 にした撃ちでは cargo.n が 1 であることを断言する。新しい歯 vdaily_after_steps_drop_the_check_env は、AFTER の 3 段のそれぞれを fixture の Daily と refs の path で after_command に渡し、返る Command の get_program と get_args の列と get_current_dir と、get_envs の中の FORCE の名と REFS_ENV の名の項がどちらも値 None であることを断言する（偽の cargo は撃たない）。新しい歯 vdaily_refs_dir_emptied_before_check は、撃つ前に refs_dir の下に古い file を置き、check の撃ちの cargo.seen の記録が行 refs-entries=0 を持つこと（check の時に dir が空）と、撃った後にその file が無く dir が在ることと、check の撃ちの REFS_ENV の値が refs_dir の下の insta-refs.txt であることを断言する。module の頭の doc に、check の後の 3 段を偽の cargo の回数で照らす句を足す。噛みは撃たない（作り直し v4 の決め D2・設計だけの行）。 未確か（I）。分割の無い check（daily は TSUZURI_CHECK_PARTITION を置かない）は入れ子の段の歯を全部撃つので、写しを読む歯が REFS_ENV の file を 1 本作り、段 insta-refs は役の file 1 本で照らす（snaprefs の fn run は 1 本以上で通る）。daily の写しで初めて撃つ夜に段 insta-refs が落ちたら、daily の memo が落ちの段を名指す。段 deny は advisory-db を網から取るので、網の無い夜は段 deny が落ちて memo になる（systemd の TimeoutStartSec の 2 時間は足りる）。 範囲の外。CI の ci.yml と、ci.yml を読む歯は替えない（行 t-ci-stop）。systemd の雛形の注（TSUZURI_DAILY_OUT の説明）は替えない（出力の file は全部の段の出力を持つが、雛形の字は歯 vdaily_units_template が固定し、注は手で読む物）。評価の撃ち（eval-daily）は替えない。"

[[contract]]
id = "v-ci-watch-off"
title = "器の宣言に任意の真偽の鍵 ci-watch を足し、値 false の repo の land の終端は push とこの host の緑の close だけを撃って GitHub の検査の子を起こさず、main-red の便の取り込みと PR の便の retire は CI を読まずに語 ci-off の 1 行で断る（鍵が無いか true の repo は今の動きのまま・持ち主の決め D3・memo t3-hub.92.3・設計だけの行）"
req = ["FR1050"]
section = "4"
write-set = ["scribe2/crates/scribe2/src/pipe/declaration/optional_keys.rs", "scribe2/crates/scribe2/src/pipe/declaration.rs", "scribe2/crates/scribe2/src/pipe/land/finish.rs", "scribe2/crates/scribe2/src/pipe/cli/step.rs", "scribe2/crates/scribe2/src/pipe/retire.rs", "scribe2/crates/scribe2-boundary/tests/e2e/pipe/land.rs", "scribe2/crates/scribe2-boundary/tests/e2e/pipe/land/cilast.rs", "scribe2/crates/scribe2-boundary/tests/e2e/pipe/land/redclose.rs", "scribe2/crates/scribe2-boundary/tests/e2e/pipe/land/retire.rs", "scribe2/docs/design/contract-source.md"]
verify = ["cargo clippy --manifest-path scribe2/crates/scribe2-boundary/Cargo.toml -p scribe2 -p scribe2-boundary --all-targets --no-deps -- -D warnings", "cargo nextest run --manifest-path scribe2/crates/scribe2-boundary/Cargo.toml -p scribe2 --lib --no-tests=fail declaration_ci_watch_", "cargo nextest run --manifest-path scribe2/crates/scribe2-boundary/Cargo.toml -p scribe2 --lib --no-tests=fail declaration_kind_passes_declarations_without_cargo_and_keeps_the_schema", "cargo nextest run --manifest-path scribe2/crates/scribe2-boundary/Cargo.toml -p scribe2-boundary --test e2e --no-tests=fail vcioff_", "cargo nextest run --manifest-path scribe2/crates/scribe2-boundary/Cargo.toml -p scribe2-boundary --test e2e --no-tests=fail vcil_", "cargo nextest run --manifest-path scribe2/crates/scribe2-boundary/Cargo.toml -p scribe2-boundary --test e2e --no-tests=fail vclhost_", "cargo nextest run --manifest-path scribe2/crates/scribe2-boundary/Cargo.toml -p scribe2-boundary --test e2e --no-tests=fail vredc_", "cargo nextest run --manifest-path scribe2/crates/scribe2-boundary/Cargo.toml -p scribe2-boundary --test e2e --no-tests=fail pr_retire_"]
size = "M"
done = "(1) 宣言の鍵 ci-watch は真偽だけを受け、値 false の宣言は fn ci_watch_on が偽、値 true の宣言と鍵の無い宣言は真で、字と整数と列の値は鍵の名 ci-watch と行の番号を名指す不備で断る（歯 declaration_ci_watch_reads_a_bool_and_refuses_other_values） (2) 宣言の鍵の列 DECLARED_KEYS は ci-cmd の直後に ci-watch を持つ（歯 declaration_kind_passes_declarations_without_cargo_and_keeps_the_schema） (3) ci-watch = false と remote を持つ宣言の repo の land は rc 0 と terminal=closed を出し、台帳の close の理由は landed と sha と host=green の 1 行で、便の終端の行は terminal:push:fake と terminal:close:ok の 2 件だけで、偽の CI は 1 度も撃たれない（歯 vcioff_land_closes_without_watching_ci） (4) ci-watch = false の repo で main-red の便を終端だけで撃ち直す周は、stdout の 1 行 run=便の id adopt=ci-off と rc 1 で、event を積まず、偽の CI と偽の bd を撃たず、偽 remote の main を動かさない（歯 vcioff_terminal_only_refuses_to_adopt_without_ci） (5) ci-watch = false の repo の PR の便の retire は、stdout の 1 行 run=便の id retire=ci-off と rc 1 で、偽の CI と偽の gh を撃たず、worktree と event と偽の台帳は不変（歯 vcioff_pr_retire_refuses_without_ci） (6) 鍵の無い宣言の着地済みの終端の歯 vcil_ が緑のまま（verify の 5 行目） (7) 着地済みの歯 vclhost_ が緑のまま（verify の 6 行目） (8) 着地済みの歯 vredc_ が緑のまま（verify の 7 行目） (9) 着地済みの歯 pr_retire_ が緑のまま（verify の 8 行目）"
