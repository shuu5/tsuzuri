done = "(1) 鍵 ci-watch の無い宣言と remote を持ち偽の CI が failure を答える repo の land は、rc 0 と stdout の terminal=closed を出し、偽 remote の main は着地した sha を指し、偽の台帳の argv は close と bead と --reason と理由 landed 着地した sha host=green をこの順に持ち、便の Landed の後の終端の行は terminal:push:fake と terminal:close:ok の 2 件だけで、偽の CI の呼びは 0 回（歯 vcicut_land_closes_without_a_ci_child） (2) close で止まった便の終端だけの撃ち直し（--terminal-only）は、main が着地した sha から別の commit へ進んだ周と、本文に run の行を持つ写しの上に main が進んだ周のどちらも、rc 0 と stdout の 1 行 run=便の id terminal=closed を出し、close の理由はそれぞれ landed 着地した sha host=green と landed 写しの sha host=green で、撃ち直しの周の終端の行は terminal:push:fake と terminal:close:ok の 2 件だけを足し、偽の CI の呼びは 0 回（歯 vcicut_terminal_only_closes_without_a_ci_child） (3) 着地した便の land に旗 --ci-only と 40 桁の 16 進の値を渡す撃ちは、rc 2 で stderr が字 未知の引数 --ci-only を持ち、event の数は撃つ前と同じ（歯 vcicut_ci_only_flag_is_unknown） (4) pipe の外形の snapshot の usage の land の旗の組は字 [land: --terminal-only|--detection-only] で、着地済みの歯 pipe_external_form がその snapshot と一致する（verify の 3 行目） (5) 着地済みの歯 pipe_terminal_ が緑のまま。直す歯 pipe_terminal_land_close_cwd_survives_a_vanished_driver_cwd は、消えた cwd から撃った land の便の終端の行が terminal:push:fake と terminal:close:ok の 2 件だけで、偽の台帳の cwd が repo（verify の 4 行目） (6) 着地済みの歯 pipe_replay_ が緑のまま。直す歯 pipe_replay_relocate_copy_at_the_tip_closes_without_tip は、close の理由が landed 写しの sha host=green で、便の終端の行が terminal:push:fake と terminal:close:failed:rc=1 と terminal:push:fake と terminal:close:ok の 4 件だけで、偽の CI の呼びは 0 回（verify の 5 行目） (7) 着地済みの歯 pipe_train_ が緑のまま。直す歯 pipe_train_terminal_every_run_closes_without_a_ci_child は、列の 3 便の終端の行が terminal:push:fake と terminal:close:ok の 2 件ずつで、偽の CI の呼びは 0 回、偽 remote の main は先端の sha。直す歯 pipe_train_tip_close_reason_is_host_green_and_failure_still_closes は、failure を答える偽の CI の列の 3 便の終端の行も terminal:push:fake と terminal:close:ok の 2 件ずつ（verify の 6 行目） (8) 着地済みの歯 vcioff_ が緑のまま（verify の 7 行目） (9) 着地済みの歯 vredc_ が緑のまま（verify の 8 行目） (10) 着地済みの歯 pr_retire_ が緑のまま（verify の 9 行目）"
