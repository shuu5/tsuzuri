goal = "在りか。差の file は無い（設計だけの行・決め D2）。便は 7 file を書く。中核に新しい module crates/tsuzuri-core/src/memo_gate.rs を足し（gate.rs は 622 行で、問いの門と同じ file に足すと読みの塊が大きくなるため分ける）、lib.rs に pub mod memo_gate の 1 行を足す。gate.rs は可視性と束の字の要約の関数の切り出しだけを替え、問いの門の判じの振る舞いと bundle_digest の値は替えない。境界の hook の口 crates/tsuzuri-boundary/src/hook/question_gate.rs の fn answer と fn refuse と module の頭の doc に memo の枝を足す。plugin/hooks/hooks.json は替えない（PreToolUse の Bash の hook が既に tz hook question-gate を撃つ・hooks.json の 51 行目）。歯は新しい段の file crates/tsuzuri-boundary/tests/mlnk.rs（接頭辞 mlnk_）に置き、着地済みの 2 つの歯の file の memo の payload を label の無い create に替える。 なぜ。持ち主は作り直し v4 で、memo の起票に繋ぐ門を置くと決めた（決め D4・判断の記録 ADR-72 の決定 (5)）。機械が候補を出し、席が処分し、処分の欠けを門が断る。門は問いの起票の門（touches・not-relevant・要約値）と同じ作りにする。今の開いた memo 63 本のうち最近の 6 本は設計の節点への辺を持たず、memo どうし・便への辺は 0 で、似た memo を探す口が無い（memo t3-hub.92.5 の観測）。決定はしご。既に在るか: 問いの門の中核（gate.rs の needs・bundle_digest・judge_one）と境界の口（question_gate.rs の graph が台帳と設計の索引でグラフを組む）が在り、グラフは memo の touches の辺（行 c-memo-touch・graph/build.rs の TOUCH_KINDS）と契約の design の辺と台帳の relates-to と discovered-from の辺を既に組む。新しい読みも子 process も足さず、同じ hook の撃ちの中で同じグラフを 1 度だけ組んで memo の下書きも判じる。memo 専用の AI の係は作らない（条 N-5.1・候補は機械が出し、処分は席がする）。新しい口と無効化の旗は足さない（条 N-3.1）。 形（memo_gate.rs）。 - struct MemoDraft は欄 metadata（Option の字）と欄 links（字の列）を持つ。fn drafts(payload) は gate.rs の create の一続きの拾いと同じ分け方（gate::segments・代入の語の飛ばし・program の名 bd か bdw・語 create）で、label の値（gate.rs の label_values と同じ旗の形）のどれかをコンマで割った項に intake:memo（tsuzuri_contract::ledger::MEMO_LABEL）を持つ一続きだけを拾う。links は旗 --deps の値（--deps 値 か --deps=値・何度でも）をコンマで割り、前後の空白を除いた項のうち、型と id をコロンで割った型が relates-to か discovered-from の項の id を書いた順に持つ（型の無い項と、ほかの型の項は数えない）。 - const CANDIDATE_KINDS は 8 種（条・規則行・判断の記録・要件・設計ノートの行・memo・契約・問い）。fn memo_needs(graph, touches) は 2 段で候補を集める。1 段目は、touches の各 id を一方の端に持つ辺（自分への辺と、端が索引に無い辺を除く）の他方の端のうち、種類が CANDIDATE_KINDS で、次数が gate::HUB_DEGREE 以下で、台帳の bead なら、種類が memo のものは開閉を問わず（直った問題の再発を古い memo に繋ぐため）、ほかの種類は BeadAttr の is_open が真のもの。2 段目は、1 段目の設計ノートの行ごとに、その行へ型 design の辺を持つ契約の bead のうち、次数が HUB_DEGREE 以下で is_open が真のもの。2 つの段の和を重ねずに natural_cmp の順に並べる。 - fn memo_digest(graph, touches) は、touches のうちグラフに在る id と memo_needs の和を、bundle_digest と同じ式（1 節点 1 行で id・要約値・状態・題をタブでつなぎ、行を改行でつないだ字の FNV-1a 64 bit・16 字の 16 進の小文字）で要約する。式は gate.rs の bundle_digest の本体から切り出す pub(crate) の関数を 2 つの門で共に使う。 - enum MemoWhy は閉じた 8 語（args・metadata・no-touches・unread・unknown-id・too-many・undisposed・stale）で、ALL・word・next_move を持つ。gate::Why は替えない（問いの門の語の数と答えの字を動かさない）。undisposed の次の一手の字は「名指した節点を touches か not-relevant か --deps の relates-to か discovered-from に足し、答えの要約値を metadata の digest に写して置き直す。同じ問題の memo が名指しに在れば、起票をやめてその memo の notes に [再発] の行を書く。」とする。 - enum MemoGate（Allow・Deny と Unknown は why と ids と digest を持つ）。fn judge(drafts, graph) は下書きを順に判じ、最初に通さなかった下書きの答えを返す。1 つの下書きの判じの順は、metadata が object でなければ Deny の metadata、touches（question::touches）が空なら Deny の no-touches、設計か台帳が読めていなければ Unknown の unread（ids は design か ledger）、touches にグラフに無い id が在れば Deny の unknown-id、memo_needs の数が gate::NEEDS_CAP を越えれば Unknown の too-many（ids は処分の無い候補・digest は memo_digest）、処分の無い候補が在れば Deny の undisposed（ids は処分の無い候補・digest は memo_digest）、metadata の digest の字が memo_digest と違えば Deny の stale（ids 空・digest は memo_digest）、ほかは Allow。処分は touches と links と、not-relevant の object の空白だけでない字の理由を持つ鍵の和。前提の方針の欄（premises）は memo では見ない。 - fn output(gate) は Allow で None、Deny で頭の字「memo の起票の門は止める（」、Unknown で頭の字「memo の起票の門は まだ分からない（」の後に語と閉じ括弧、ids が在れば「 id =」と空白で区切った ids、digest が在れば「 要約値 = 」と値、最後に「 次の一手 = 」と次の一手の字を続けた理由で、gate::deny_json の字を返す（問いの門の output と同じ形）。 形（question_gate.rs）。fn answer は、短い題の門の後に、問いの下書き（gate::drafts）と memo の下書き（memo_gate::drafts）を拾い、両方が 0 件なら子 process を撃たずに None。どちらかが在ればグラフを 1 度だけ組み、問いの下書きが在れば問いの門の答えを先に返し、問いの門が通す時（か問いの下書きが無い時）に memo の門の答えを返す。fn refuse は、問いの下書きが在れば今の答え（Why の args）、問いの下書きが無く memo の下書きが在れば MemoWhy の args の答えを書いて rc 0、どちらも無ければ rc 1。module の頭の doc の順の 2 と 4 に memo の下書きを足す。label に intake:question と intake:memo の両方を持つ create は両方の門が判じ、問いの門が先に答える。 着地済みの歯の file の替え（どちらも memo の門に当たらない入力を、label の無い create に替えるだけ）。 - crates/tsuzuri-boundary/tests/teeth3/qgate.rs の fn others の 4 つ目の payload（label intake:memo で touches の無い create）の label を --labels=intake:memo から外し、ほかの字は替えない（memo の門の no-touches で stdout が出るため）。 - crates/tsuzuri-boundary/tests/teeth5/shrtb.rs の歯 shrtb_pass_with_short の memo の create から --labels=intake:memo を外し、変数の名 memo を created に替える（短い題の門は label を問わないので、歯の測る事は替わらない）。shrtb_deny_without_short の memo は短い題の門が先に断るので替えない。 fixture（歯の file の中で組む字・file は足さない）。索引の節点は FR9・FR8・FR7（要件）・P-9（条）・ADR-9 と ADR-8（判断の記録）・NFR9（非機能要件）・nx#r1 と nx#r2（設計ノートの行・file は design-note/nx.yaml）・R-1 から R-31（規則行）。辺は FR9 から P-9（basis）・FR9 から ADR-9（adrs）・FR9 から ADR-8（adrs）・FR9 から NFR9（refs）・nx#r1 から FR9（req）・nx#r2 から FR8（req）・ADR-8 から R-1〜R-31（rules・ADR-8 の次数は 32 で hub）。台帳は bd の一覧の JSON の配列で、fx-m（epic・open）、fx-m.1（label intake:memo・open・touches FR9）、fx-m.2（intake:memo・closed・touches FR9）、fx-m.3（intake:memo・open・touches FR8）、fx-m.4（intake:question・open・touches FR9）、fx-m.5（task・open・acceptance の行 design = contracts/nx.toml#r1）、fx-m.6（task・open・acceptance の行 design = contracts/nx.toml#r2）、fx-m.7（task・closed・acceptance の行 design = contracts/nx.toml#r1）。too-many の見本は同じ索引に、FR7 を touches に持つ開いた memo fx-t.1 から fx-t.31 の 31 本を足した台帳で組む。FR9 だけの touches の候補は、1 段目が ADR-9・P-9・nx#r1・fx-m.1・fx-m.2・fx-m.4（ADR-8 は hub・NFR9 は種類の外・fx-m.2 は閉じた memo で候補に入る）、2 段目が fx-m.5（fx-m.7 は閉じた契約で候補に入らない・fx-m.6 は候補でない行 nx#r2 を指す）の 7 つ。 歯（mlnk.rs・頭の //! の続きのすぐ次の行に #![cfg(test)]）。純関数の歯 6 本は fixture の字から tsuzuri_core::graph::build でグラフを組んで memo_gate の関数を直に呼ぶ。hook の歯 3 本は、teeth3/qgate.rs の Place と同じ形の作業場（.git が file の repo・偽の bd が台帳の字を、偽の設計の道具が索引の字を出し、撃たれた引数を記録の file に 1 行足す script）で env!(CARGO_BIN_EXE_tz) を撃つ。作業場の置き場は CARGO_TARGET_TMPDIR の下の mlnk/<歯の名>。歯の fn の名は全部 mlnk_ で始める。偽の program の script は歯の file の中の助けで書く（群の common の module は段の file から使えない）。 - mlnk_drafts_pick_memo_creates は、bdw create --parent=fx-m --labels=intake:memo --deps relates-to:fx-m.1,blocks:fx-m.5 --deps=discovered-from:fx-m.4 --metadata=... の一続きの links が fx-m.1 と fx-m.4 の 2 つになること、label intake:question だけの create・bdw update・echo の後の bdw create の字・tool_name が Edit の入力・JSON でない字が 0 件になることを見る。 - mlnk_bin_question_answer_comes_first の問いの下書きは touches FR9 で not-relevant を持たない問いの create（候補 ADR-9 と P-9 が処分の欠け）で、期待の字は gate::output(gate::judge(gate::drafts(payload), graph)) の字。 done と verify の対応。1 つ目から 11 番目の項は verify の 2 行目（段の file mlnk の歯 mlnk_）が測る。12 番目の項は 3 行目、13 番目の項は 4 行目、14 番目の項は 5 行目（gate.rs の切り出しで問いの門の要約値と判じが替わらないことの守り・file は書かないので write-set に = で置く）。1 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので行の verify に書かない。新しい段の file は群に入らないので、表 GROUPS（xtask/tests/teeth1/kfold.rs）は替えない。接頭辞 mlnk は着地済みの code と契約表の filter の語のどれとも部分の字で重ならない（2026-10-06 の main 19aaf0f6 で grep 0 件）。 範囲の外。候補に似た memo（題と本文の語の重なり）と code の索引の file と関数を足すのは後の行（t-memo-similar・この行の memo_needs に足す）。[再発] の行を古い memo へ書く口は足さない（席が notes に書く・次の一手の字が名指す）。器の memo の起票の門（scribe2 の hook ledger_guard の 4 節の見出しと引き金の検め）と、器が子 process で撃つ memo の起票（席の道具の呼び出しでない書き）は替えない。premises の検めは問いだけのまま。"

