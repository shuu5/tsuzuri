ts の 3 つ目の見本（句 out）は、中核の stop.rs の、前後を改行で挟んだ字 pub mod floor; の後に OUT_LINE を足す swap を、前後を改行で挟んだ字 use serde_json::Value; の後に足す swap に替える（2 か所の字だけを替え、ほかの見本と断言は替えない・stop.rs から pub mod floor; が消えると見本の swap の字が 0 度になり歯 agshp_one_clause_mutants_are_named が落ちるため）。関数 run は、旗を抜く floor::tools の呼びと match を外して、残りの引数 rest をそのまま begin に渡し、欠けの足し floor::holes の 1 行を外す。USAGE は次の字にする（旗 --tz と --scribe2 を外す）。 usage: tz hook agent-stop --repo <dir> [--drafts <dir>] - src/hook/subagent_stop/floor.rs を消す（上限 LIMIT・型 Tools・Shot・Pre・関数 tools・fire・rc・find・places・preflight・rerun_all・append・holes）。それが使う server::proc の KILL と stop_with、server::ruling の minute、server::events の now、out の emit_err は、ほかの module が使うので残る。 - src/main.rs の頭の doc の口の行を次の字にする（旗の 2 項だけを外す）。 //! tz hook agent-stop --repo <dir> [--drafts <dir>]（係の終える前の門・欠けの在る 1 度目の終わりは rc 2・ほかは 0 か 1）。 - 旗を外した後の --tz と --scribe2 は、口の引数の読み agent_args::parse の知らない引数の断り（rc 1・標準エラーは口の名と訳の 1 行と USAGE の 1 行）に落ちる。plugin/hooks/hooks.json の終える前の門の command は今も旗を渡さないので、command の字は替えない。 - plugin/hooks/hooks.json の終える前の門（SubagentStop）の timeout を 120 から 10 に戻す（120 は撃ち直しの上限 100 秒のために行 ag-floor-rec が上げた値で、その前は 10）。群 teeth6 の module agpl.rs の助け wanted の SubagentStop の見込みの 120 を 10 に替える（歯の本文は替えない）。 歯の file（群 teeth6 の module agsg.rs・接頭辞 agsg_）。module の doc の 1 行目の括弧の中の末に字『・設計ノート surface-v4a 行 ag-floor-off』を足す。今の助け（place・whole・w・said・stop・spec・SUB）を使い、旗を足す撃ちのために助け stop の引数を足すか、同じ形の助けを 1 つ足す。足す歯は次の物。 - agsg_hook_passes_a_patch_output_without_a_floor_record。whole の置き場の札の出す物を notes.md と r1.patch の 2 つにし、出力の dir に r1.patch を置き、floor.tsv を置かない。1 度目の終わりの rc が 0・標準出力と標準エラーが空・札の ended が在り、出力の dir に floor-gate.tsv と STOP-GATE.txt が無く、係の dir drafts/w218a に floor-state が無いことを断言する。入口の赤は、main では床の段が記録の無い欠けで rc 2 を返す。 - agsg_hook_refuses_the_rerun_tool_flags。whole の置き場で、引数に 2 語 --tz と /x を足した撃ちと、1 語 --scribe2=/y を足した撃ちが、どれも rc 1・標準出力が空・標準エラーの 1 行目が字 知らない引数 と空白と旗の名（--tz・--scribe2）で終わり、2 行目が subagent_stop::USAGE の字で、札の ended が無いことを断言し、subagent_stop::USAGE が上の USAGE の字と同じことを断言す