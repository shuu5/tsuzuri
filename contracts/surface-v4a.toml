goal = "在りか。差の file は無い（設計だけの行・作り直し v4 の決め D2）。便は器の src 6 file（pipe/cli/run.rs・pipe/cli/resume.rs・pipe/follow.rs・pipe/spawn.rs・headless/runner.txt・rules/mod.rs）と埋め込み manifest scribe2/rules/manifest.toml と器の e2e の歯 2 file（pipe/spawn.rs・rules/embedded.rs）と snapshot 2 file と器の設計の文書 scribe2/docs/design/pipeline.md を書く。snapshot の歯の file tests/e2e/rules.rs と tests/e2e/headless.rs は verify の歯の在りかとして write-set に入れ、中身は替えない。輪と数えは pipe/cli/run.rs に、resume の入口の分岐は pipe/cli/resume.rs に、所見の節の値の読みは pipe/follow.rs に、節の型と stdin の組みと worktree の使い回しと Spawned の detail は pipe/spawn.rs に、節の読み方の 1 行は headless/runner.txt に、rules 行の kind は rules/mod.rs に置く。depends は空（このノートのほかの行と触る file が交わらない）。 なぜ。今は gate の FAIL が便の終端である。pipe run は gate の段の rc 1 で連鎖を止め（pipe/cli/run.rs の fn run_all）、pipe resume も Implemented の便に gate を 1 回撃って抜ける（pipe/cli/resume.rs の fn resume の Implemented の枝）。Gated の FAIL の便は列が設計の側の終端として write-set を予約し（pipe/dispatch/candidates.rs の fn design_side と fn siblings_of）、席が設計の節を替えて digest が動くか release を撃つまで同じ bead の便は起きない。起きた次の便は intake・契約の審査・runner・終わりの門・gate の全周をやり直し（1 周 約 17 万 token）、前の便の判定は「## 前の便の gate の FAIL」節で渡るだけである（pipe/follow.rs の fn prior_fail・設計 pipeline.md §68）。一方、終わりの門の赤は同じ worktree の runner を「## 門の赤」節つきで 2 周まで起こし直す（pipe/follow.rs の fn spawn_rounds・pipe/spawn.rs の fn end_gate と rules 行 runner.end_gate_rounds・設計 §66）。持ち主の決め D6（判断の記録 ADR-72 の決定 (7)）は gate の FAIL にも同じ口の直しの周を求める。決定はしご。要るか: 要る（上）。既に在るか: 起こし直しの口（launch と spawn_selected と spawn_turn・同じ worktree の使い回し・節の足し方）と、verdict.json の evidence と findings を節の行に写す読み手 verdict_lines と、rules 行の Int の読み手 int_row と、gate の 1 本 gate_run が在り、それを使う。新しく足すのは、gate の後の数えと輪、段 Implemented の印の記帳、節 1 つ、rules 行 1 本だけである。 形（数えと印・pipe/cli/run.rs）。const ROW_GATE_FIX_ROUNDS（字 runner.gate_fix_rounds）と const FIX_DETAIL（字 gate-fix:）を置く。純関数 fix_rounds(events, run) は、その便の RunStage のうち段 Implemented で detail が FIX_DETAIL で始まる記帳の数と、便の最後の RunStage がその記帳か（真偽）の対を返す。周の数は便の event から数え、process の記憶に持たない（FR1003 と同じ）。fn fix_due は gate を撃った後の便を閉じた 3 値 Due（Round(周)・Exhausted(上限)・Off）に分ける。Off は次のどれか: runner の字が無い・rules 行を int_row で読めない（行の無い・不発効・型違いの manifest）・event を読めない・便の最後の RunStage が段 Gated でないか、その detail が verdict:FAIL で始まらない（直しの周の runner が rc 0 でなく終わって spawn が段 Failed を記帳した便と、gate の前の照らしが段 Failed を書いた便は、最後の RunStage が Gated でないので Off になり、前の周の Gated の FAIL を読み直さない）・verdict.json の verify_red が 0 でないか読めない。それ以外は、数えが上限より小さければ Round(数え + 1)、届いていれば Exhausted(上限) である。値 0 の行の便は最初の FAIL で Exhausted(0) になる（終わりの門の値 0 と同じ読み）。verify の赤の FAIL を Off にするのは、verify の赤は終わりの門が runner.end_gate_rounds の周を使い切った後の赤で、gate の審査役の所見が無いからである。 形（輪・pipe/cli/run.rs）。fn gate_fixing(args, id, runner, manifest, policy) は gate_run を撃ち、rc が RC_REFUSED で fix_due が Round(n) の周は、段 Implemented で detail gate-fix:<n> の RunStage を 1 件記帳し（記帳の門は NotStopped・書けない周は broken で rc 2）、stdout の行に run=<id> gate-fix=<n>/<上限> を足し、launch(args, id, runner, policy, &[Stage::Implemented]) と ride_out_rate_limit を順に撃ち、どちらかが rc 0 でなければそこまでの行とその rc で返り、rc 0 なら gate_run から繰り返す。Exhausted(v) の周は stdout の行の末に run=<id> gate-fix=exhausted:<v> を足し、gate の rc 1 のまま返る。Off の周と rc が RC_REFUSED でない周は gate の戻りをそのまま返す（stdout も stderr も今のまま）。各段の out と err は段の順で積む（chain_noting と同じ畳み方）。輪は回数を数えず、止めるのは fix_due の数えである。fn run_all は gate_run の代わりに gate_fixing を呼ぶ。 形（resume・pipe/cli/resume.rs）。Implemented の枝は、follow_pending の周は今のまま。そうでなく、fix_rounds の 2 つ目が真（最後の RunStage が直しの印＝印の記帳の後に runner が起きる前に driver が死んだ便）で runner が idle の周は、--runner を need で読み、launch と ride_out_rate_limit を撃ってから gate_fixing を呼ぶ。ほかの周は gate_run の代わりに gate_fixing を呼ぶ（--runner の無い周は runner の字 None で Off になり、今の 1 回の gate と同じ）。driver の札と列の起こし直しは替えない（輪は 1 process の中で回り、札を握ったまま回る。印の後で driver が死んだ便は driver_is_dead の今の枝が resume を起こす）。 形（節・pipe/follow.rs と pipe/spawn.rs）。spawn.rs に struct GateFix（欄 round: u64・lines: Vec<String>）と fn section を置く。節の字は改行・## gate の FAIL（周 <round>）・改行・- この便の gate の審査役は次の所見で落とした。所見が名指す場所を直して commit してから終える・改行のあとに lines の行を - で 1 行ずつ足す形。Launch に欄 fix: Option<GateFix> を足す。stdin の節の順は 契約 → 共通 verify → ほかの行の touches → 前の便の gate の FAIL → gate の FAIL → 門の赤 → 回答 → 途中再開 → 追随 とし、spawn.rs の stdin の組みの doc の順の句を合わせる。fn prepare_worktree は fix が在る周も同じ worktree と記録済みの base を使う（条件に launch.fix.is_none() を足す）。fn spawned_detail は red の分岐の次、account の match の前に、fix が在り resumed が無い周は gate-fix:<round>（器が選んだ口座の在る周は ,account:<label> を足す）を返す（base: で始めない＝門の起こし直しと同じく base の読み手が飛ばす形）。follow.rs に fn gate_fix(state_dir, run) を置き、event を読み fix_rounds の 2 つ目と同じ判じ方で、最後の段の記帳のうち Gated より後ろに段 Implemented の直しの印が在る周だけ、印の周の番号と、verdict_lines（今の 1 本・前の便の節と同じ evidence と findings の行）の行に verdict.json の欄 at が在れば at: <字>（改行と tab を空白に畳み 2000 字まで）の 1 行を足した行で Some を返す。印の後に Gated が在る周と読めない周は None。fn spawn_rounds は毎周 gate_fix を読んで Launch の fix に渡す（直しの周の門の起こし直しと runner の死の途中再開も同じ節を持つ）。終わりの門の赤の数え red_count は段 Spawned でない記帳で 0 に戻るので、直しの周ごとに門の 2 周が新しく効く（替えない）。 形（雛形・headless/runner.txt）。器の取り扱いの節の「## 前の便の gate の FAIL」節と「## 門の赤」節の行の直後に 1 行を足す: - 「## gate の FAIL」節は、この便の gate の審査役が落とした所見である。所見が名指す場所を直して commit してから終える。所見の外を作り直さない。所見が契約と食い違う時は直さずに質問 record で止まる。外形の snapshot e2e__headless__headless_runner_prompt_external_form.snap をこの 1 行で直す。 形（rules 行）。scribe2/rules/manifest.toml の runner.end_gate_rounds の行の直後に、注の 2 行（gate の審査役の FAIL で同じ worktree の runner を所見の節つきで起こし直す回数の上限・値 0 も数えて exhausted を名乗る）と行 id runner.gate_fix_rounds・kind RunnerGateFixRounds・value 2・enabled true・ruling user 2026-10-06T08:08:35.348Z 項 D6・ruled_at 2026-10-06 を足す。rules/mod.rs の RunnerEndGateRounds の在る 5 か所（enum・ALL・字面・形 Int の腕・分類の腕）の直後に RunnerGateFixRounds を足す。埋め込み manifest の行数の pin を 116 から 117 にし、その文の末に行 v-gate-fix で +1〔gate の直しの周の回数〕の句を足す。同じ file の歯 rules_embedded_manifest_declares_one_capability_row_per_role の kind の母集団の pin を 101 から 102 にし、その文の末に行 v-gate-fix で +1〔gate の直しの周の回数〕の句を足す。外形の snapshot e2e__rules__rules_external_form.snap は、字 rules: ok で始まる 2 行の rows=116 kinds=101 を rows=117 kinds=102 に直し、ほかの行は替えない（snapshot は行の id を載せず、行と kind の数だけを載せる）。 形（器の設計の文書）。pipeline.md の末に §73（置く時の末の番号 + 1）を足し、上の形の数え・輪・resume・節・rules 行と範囲の外を書く。§66 の形 7 の輪の持ち主の段の末に、gate の直しの周の輪は pipe/cli/run.rs の gate_fixing が持つ 1 文を足す。 歯。lib の歯 gate_fix_rounds_count_the_markers_and_see_a_pending_one は pipe/cli/run.rs の末に置く tests module（#[cfg(test)]）に置き、Event の列を組んで fix_rounds の数えと真偽を断言する（ほかの便の記帳・段 Spawned の gate-fix: の記帳・印の後の Gated を数えないことを含む）。e2e の歯は tests/e2e/pipe/spawn.rs の終わりの門の歯の後に接頭辞 gfix_ で 5 本置き、助け gate_fix_rules（end_gate_rules に行 runner.end_gate_rounds を足さず、行 runner.gate_fix_rounds を値で足すか足さない）を足す。5 本目の歯 gfix_failed_fix_round_stops_without_another_round は、値 2 の行の manifest で、いつも FAIL を返す lens と、いつも rc 1 で終わる偽の runner で便を pipe resume で撃つ（直しの周 1 の runner が rc 1 で終わり、spawn が段 Failed を記帳し、続く gate は段違いで lens を起こさずに断る）。歯は gate_run_intake で受けた便を pipe spawn で Implemented にし、pipe resume に --runner と --lens と --rules を渡して撃つ。偽 runner は終わりの門の歯の偽 runner と同じく stdin を run ごとの file に写し、毎回違う 1 行を足して commit する（同じ字を書くと 2 回目の commit が空で Failed に倒れる）。2 つ目の項の偽 lens は呼びの印の file が無ければ印を置いて FAIL を、在れば PASS を返す（fake_lens と同じく末を ; : で閉じる）。呼びの数は印の file に 1 行ずつ足して数える。噛みは撃たない（作り直し v4 の決め D2・設計だけの行）。 done と verify の対応。1 つ目の項は verify の 2 行目、2〜6 つ目は 3 行目（e2e の歯 gfix_）、7 つ目は 4 行目、8 つ目は 5 行目、9 つ目は 6 行目、10 は 7 行目、11 は 8 行目、12 と 13 は 9 と 10 行目（着地済みの歯・9 行目は終わりの門の起こし直しの歯 1 本の名で絞る。接頭辞 end_gate_ は write-set の外の歯の file にも当たる）が測る。1 行目の clippy は done に載せない守り。xtask の check は器の共通 verify が撃つので verify に書かない。入口の赤は、main の器が fix_rounds と行 runner.gate_fix_rounds を知らないので 2〜4 行目と 7 行目が落ちる（5 行目と 6 行目は 116 と 101 のまま緑で、行と kind を足すと 117 と 102 にしなければ落ちる）。 数えと大きさ。器の src の file の行の数（main d7dd57a7）は spawn.rs 1397（見込み +35）・follow.rs 1311（見込み +35）・run.rs 168・resume.rs 323・rules/mod.rs 924 で、どれも上限 1500 に収まる。受付は size M の見込みを 300 行と数え、受付の数えの余地 spawn.rs 91 行・follow.rs 179 行で断るので、欄 growth に見込み 45 行ずつを置く。 ADR-72 の決定 (7) の字との差。直した差だけの再審査はこの行に入れず、gate は直しの周も今と同じく base..HEAD の全部の差を lens に渡す（理由と割り方は節 10）。直しの周の条件は今の lens の FAIL の全部である（今の lens は重さを出さない。段 S7 の審査役の prompt の行が重さ Critical と Important だけを FAIL にすれば、この行の条件はそのまま決定 (7) の字になる）。実装役は新しい process で起こす（終わりの門の起こし直しと同じ口で、会話の記録の --resume は使わない）。口座は起こし直しの選定 spawn_selected で選び直す（終わりの門の輪は同じ口座を使う。直しの周は gate の lens の時間を挟むので選び直す）。越えた便は今の Gated の FAIL の終端（列の予約・席への知らせ・節を替えて次の便）に入る＝設計係へ返す席の手番である。 範囲の外。pipe gate の 1 段だけの口（席や歯が撃つ）と land の追随の再 gate（pipe/land.rs の regated）は輪を持たず今のまま。pipe regate と dispatch の release は替えない（verify の赤の FAIL と揺れる歯の FAIL を測り直す口として残る）。契約の審査の FAIL（Reviewed）の扱いと列の hold の既定（memo t3-hub.92.8 の notes の候補）・main の差が閉包に触れない時の着地の前の撃ち直しを省く候補（memo の候補 2）は、この行で決めない。消す物: この行は code を消さない。消えるのは、lens の FAIL の便を席が節を替えて新しい便で全周やり直す手の道のうち、2 周で直る便の分である（regate と release は上の理由で残す・消す物の無い足しの理由は memo の notes に書く）。"

