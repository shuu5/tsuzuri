done = "(1) 契約の account の module の pub const SPARK_SPAN_S は 604800（7 日）で SPARK_STEP_S は 3600、その商は 168、中核の account の host の module の pub const MEASURED_EVENT は字 AllowanceMeasured（歯 cspk_consts_and_event_word） (2) 今 1790510400 で HostTexts の欄 events の log が、acct-1 の窓 five_hour の行を今の 3599・10・100 秒前（使った割合 38・42・40）と 3600 秒前（30）と 8000 秒前の 2 行（31 の後に 33）と 604799 秒前（5）と 604800 秒前（6）と 60 秒後（99）に、窓 seven_day の行を 200 秒前（300）に、窓 seven_day_model の行を 200 秒前（12・欄 model は opus）に持ち、読まない行（窓 seven_day_opus・used_pct が字の 12・used_pct の無い行・ts が字 bad・口座が空の字・種類 AllowanceUnmeasured・JSON でない行）と acct-2 の 700000 秒前の seven_day の行（50）を持つ入力で、pub fn spark の acct-1 は Known で measured_at は 1790510390、線は five_hour が (1789905601, 5)・(1790502400, 33)・(1790506800, 30)・(1790510390, 42) の 4 点、seven_day が (1790510200, 255)、seven_day_model が (1790510200, 12) の順の 3 本、acct-2 は measured_at 1789810400 と点の無い 3 本、acct-3 は measured_at None と点の無い 3 本、log の字が None なら Unknown、空の字なら measured_at None と点の無い 3 本（歯 cspk_steps_newest_per_hour） (3) 今を時の境の 30 分後の 1790512200 にし、acct-1 の five_hour の行を今から 600 秒ごとに 8 日分（1153 行）持つ log で、線は 168 点で at は古い順に真に増え、最初の点は今の 604800 秒前より後、最後の点は今、どの点も今からの秒が 3600 の倍数（刻みの中の最も新しい行）で、measured_at は今（歯 cspk_at_most_168_points） (4) 宣言の口座が acct-1・acct-2・acct-3（doctor の口座の行で acct-3 は retired=yes）、残量の出力が acct-1 の行だけ、log が acct-1 の five_hour の 600 秒前（42）と acct-3 の seven_day の 90000 秒前（70）の入力で、pub fn accounts の 3 行の spark はどれも Unknown、pub fn accounts_at（今 1790510400）の 3 行は spark の欄だけが accounts の行と違い、その値は pub fn spark の同じ口座の値（退役の acct-3 も measured_at 1790420400 と seven_day の 1 点 (1790420400, 70) を持つ）、中核の pub fn doc の電文の accounts は accounts_at の値、log の字が無ければ accounts_at は accounts と同じ、群の宣言の字が無ければ Unknown（歯 cspk_accounts_at_fills_only_spark） (5) 歯の file tests/server_acct.rs の作業場（引数の state dir は state-h）で、state-h に log が無ければ Acct の doc項 1790510400 の 3 つの口座の spark はどれも Unknown で電文は歯の fn core_doc の値と同じ、state-h の fleet/events.jsonl に acct-1 の five_hour（83）と seven_day_model（12）の行を 2026-09-27T11:50:00Z に、acct-2 の seven_day（300）の行を 2026-09-27T09:00:00Z に持つ字と字 AllowanceMeasured を含む JSON でない行を置き、state-b の log に acct-3 の five_hour の行を足すと、新しい Acct の電文の spark は acct-1 が measured_at 1790509800 と five_hour の (1790509800, 83) と点の無い seven_day と seven_day_model の (1790509800, 12)、acct-2 が measured_at 1790499600 と seven_day の (1790499600, 255)、acct-3 が measured_at None と点の無い 3 本（project の state dir の log は読まない）で、電文は core_doc の値と同じ、Acct の marks は state-h の log の path を持たない（歯 cspk_acct_reads_host_log） (6) 着地済みの server_acct_ の 11 本は、歯の私的な fn expected が HostTexts の欄 events に引数の state dir の fleet/events.jsonl の置いた字を入れて通る（引数の state dir が state-a の周はその字が EVENTS_A で、測りの行が無いので 3 つの口座の線は measured_at None と点の無い 3 本）（歯 server_acct_doc_matches_core） (7) fixture tests/fixtures/account/acct-inputs.json の期待の accounts の 4 行に spark の字 unknown を足し、fixture の texts に events が無いので、着地済みの acctcore_ の 10 本と acctpcore_ の 7 本は期待を直さずに通る（歯 acctcore_fixture_builds_expected） (8) fixture tests/fixtures/account/acct-doc.json の 3 つの口座の行に Known の spark を足し（acct-1 は measured_at 1790510100 と five_hour の 3 点・seven_day の 1 点・seven_day_model の 2 点、acct-2 は 1790510000 と 2 点・1 点・1 点、退役の acct-3 は 1789900000 と点の無い 3 本）、着地済みの acctdoc_ の 6 本（字 unknown の在りかの 12 は変わらない・fixture は 20000 byte 以下）と、fixture を読む面の accthome_ の 11 本と境界の acctwire_ の 6 本と bport_ の 4 本は期待を直さずに通る（歯 acctdoc_unknown_only_where_marked） (9) 外の依存は足さず、境界の crate の依存は tsuzuri-contract と tsuzuri-core、中核の crate の依存は serde と serde_json と tsuzuri-contract のまま（歯 server_acct_no_new_dependencies）"
goal = "在りかの main は 68e4a9b（計画 surface-plan v0.43）。この節の字はその code の値。fixture acct-doc.json と vocab.json を先に書く行 h-acct-rest（ノート surface-wave13c・便 t3-hub.53.29・proj-a の台帳の LedgerStats に欄 1 つ）はこの行の字と重ならない。 なぜ。持ち主の裁定 t3-hub.53.10（計画の判断の表 d7・拠る要件 FR12）は account board に口座ごとの 7 日の小さな図（spark）と測った時刻の列を作ると決めた。見本（docs/design/mock3/account/index.html の 258〜266 行の口座 × 窓の表の spark と measured_at の 2 列・docs/design/mock3/acct.js の 172〜181 行の fn spark）は器の event log の AllowanceMeasured の行を線にするが、今の電文の口座の行（契約の pub struct AccountRow）は窓ごとの今の使った割合（器の fleet usage --show の出力の写し）しか持たず、線と測った時刻の材料が無い。 席の決め（2026-09-28・この行の拠り）。(1) 線の幅は裁定どおり 7 日（見本と語の辞書の鍵 spark の字 直近 24 時間 は行 h-acct-spark が 7 日に直す）。(2) 読む log は引数の state dir（tz の server の --state-dir・群の宣言 host.toml の置き場）の fleet/events.jsonl の 1 つだけ（窓の棒の出所の fleet usage --show --state-dir と同じ log なので、最後の点の値と時刻が棒と合う。見本は全部の state dir の log を読むが、ほかの dir の新しい測りの時刻が古い棒の横に出るのを避ける）。(3) 点は今から 1 時間の刻みごとに ts の最も新しい行の 1 つにし、1 本 168 点以下（実物の log は直近 7 日で口座 × 窓ごとに約 600 行）。 起草の決め（席が変えうる）。最後に測った時刻は古さの閾値を持たない（見本の MEASURE_STALE の 60 分は写さない・規則の行 R-22 と同じく tsuzuri は閾値を持たず判じない）。窓の棒が読めない口座の時刻に unknown の印を添える面の決まりは行 h-acct-spark が持つ。 在りか・器の値（器 scribe2 の文書 docs/design/fleet-usage.md の 4 節の表と crates/scribe2/src/fleet/event.rs の fn measured_of を読んだ・読むだけ）。AllowanceMeasured の行は JSON の 1 行で、共通の欄 schema・ts（RFC 3339 の Z）・kind・host・actor と、必須の欄 account・window（five_hour・seven_day・seven_day_model のどれか）・endpoint・used_pct（整数）と、任意の欄 resets_at と model（window が seven_day_model の行は必須）を持つ。測れなかった周は種類 AllowanceUnmeasured の行（欄 reason）。 在りか・契約（crates/tsuzuri-contract/src/account.rs・write-set・188 行）。lib.rs の pub mod account と pub type EpochSecs（u64）。pub const PATH（14 行）と HEARTBEAT_PATH（17 行）。pub struct AccountRow（52〜61 行・derive は Debug・Clone・PartialEq・Serialize・Deserialize・serde の default の欄は無い）の pub な欄は label・retired・occupant・model・usage（Reading<Vec<QuotaUsed>>）。Reading は契約の board の pub enum（Known と Unknown・serde は kebab-case で Unknown は字 unknown）。 在りか・中核（crates/tsuzuri-core/src/account/host.rs と project.rs・write-set）。lib.rs の pub mod account、account の mod.rs の pub mod host と pub mod project。host.rs（538 行）は use crate::seat::WINDOWS（five_hour・seven_day・seven_day_model の順）と crate::ledger::epoch_secs（RFC 3339 の字を epoch 秒に）を持つ。pub struct HostTexts（60〜84 行・derive は Debug・Clone・Default・PartialEq・Eq・Deserialize）の pub な欄は host_toml・usage・doctor（Option<String>）と serde の default を付けた seat_doctors・records・history・caps・seat_logs（BTreeMap<String, String>）。pub fn accounts（283〜311 行・引数は &HostTexts だけ）は群の宣言の label の順に AccountRow を組み、残量の行の窓の使った割合は 255 で止める（私的な fn windows）。私的な fn event_text（462〜465 行）は JSON の欄の字。pub fn notices（509〜538 行）は project の state dir の event log を JSON で読む（この行の log とは別の読み）。project.rs（673 行）の pub fn doc（644〜673 行）は assemble の口座の列に host::accounts(host) の値（655 行）を渡す。着地済みの歯は host::accounts を acctcore・plimit・athr から直に呼ぶ。 在りか・境界（crates/tsuzuri-boundary/src/acct.rs・write-set・503 行）。私的な fn gather（241〜421 行）は host.toml を引数の state dir から読み、重ならない project の state dir ごとの event log（私的な fn events_log・429〜431 行・server::runs の pub const EVENTS_LOG の fleet と events.jsonl）を印（marks・336 行）に足して ProjectTexts の欄 events に入れ（395 行）、最後に HostTexts の host_toml・usage・doctor・caps を埋める（415〜418 行）。引数の state dir の log は、今はどれかの project の state dir と同じときだけ project の字として読まれる。module の doc（1〜14 行）は読む file の列を持つ（9〜11 行）。 形。(a) 契約: pub const SPARK_SPAN_S（7 × 24 × 60 × 60）と SPARK_STEP_S（60 × 60）を置き、pub struct Spark（pub な欄 measured_at は Option<EpochSecs>・lines は Vec<SparkLine>）と SparkLine（window は String・points は Vec<SparkPoint>）と SparkPoint（at は EpochSecs・used_pct は u8・Copy も derive）を足し（derive は Debug・Clone・PartialEq・Eq・Serialize・Deserialize）、AccountRow の最後に pub な欄 spark（Reading<Spark>・serde の default は付けない）を足す。(b) 中核 host.rs: pub const MEASURED_EVENT（字 AllowanceMeasured）と、HostTexts の最後の pub な欄 events（Option<String>・引数の state dir の fleet/events.jsonl の字）を足し、pub fn accounts の行の spark は Unknown にする。pub fn accounts_at（引数は &HostTexts と今・accounts の行の spark を log の 1 度の読みで埋める・log の字が無ければ accounts と同じ）と pub fn spark（引数は &HostTexts と口座の名と今・log の字が無ければ Unknown）と、私的な fn（測りの行の読み・口座の名 → 線の表・点の無い 3 本）と私的な type（読みかけの表の値）を置き、module の doc に 2 行足す。(c) 中核 project.rs: pub fn doc の 655 行を host::accounts_at(host, now) にし、fn の doc に 1 句足す。(d) 境界 acct.rs: gather で HostTexts の欄 events に read(&events_log(&self.state_dir)) を入れる 1 行と、module の doc の読む file の列に 1 行。印には足さない（窓の棒の出所の fleet usage --show も印に無いので、線と棒は同じ周で新しくなる）。子 process は増やさない。(e) fixture: acct-inputs.json の期待の 4 行に spark の字 unknown、acct-doc.json の 3 行に Known の spark。(f) 歯の file tests/server_acct.rs: 私的な fn expected の HostTexts に events を足し、私的な const MEASURED_H と MEASURED_B と、歯 cspk_acct_reads_host_log と私的な fn cspk_sparks と cspk_line を足す。 決めた幅。線に読む行は、種類が AllowanceMeasured で、口座が空でなく、窓が WINDOWS のどれかで、ts が epoch_secs で読め、used_pct が整数の行（255 で止める・着地済みの残量の読みと同じ）。ts が今より後の行は読まない。最後に測った時刻は口座の読めた行の ts の最大（窓と古さを問わない・7 日より前の行も数える）。点に読むのは今からの秒が SPARK_SPAN_S 未満の行で、刻みは今からの秒を SPARK_STEP_S で割った商（今が時の境に無くても 1 本 168 点以下）、刻みの中は ts の最も新しい行（同じ ts は log の後の行）、点は at の古い順。model の窓の行の欄 model は見ない。退役の口座も線を持つ（見本も退役の行に線を描く・出し方は面が決める）。log は 1 度だけ読み、字 AllowanceMeasured を含まない行は JSON として読まない（実物の log は約 7MB・約 3 万行）。電文は口座 × 窓ごとに 168 点以下の分だけ大きくなる（実物の口座 7 つで約 100KB・今の電文は約 144KB）。 着地済みの歯（確かめた）。中核の acctcore_fixture_builds_expected（76 行）と acctpcore_doc_host_parts_from_inputs（503 行）は fixture acct-inputs.json の期待の accounts と比べる（texts に events が無いので線は Unknown のまま・期待に字 unknown を足すだけ）。acctpcore_assemble_equals_doc_fixture は fixture acct-doc.json の値を assemble に通すだけ。契約の acctdoc_unknown_only_where_marked は fixture の字 unknown の在りか 12 を見る（3 つの口座の spark は Known なので変わらない）、acctdoc_fixture_names_and_size は 20000 byte 以下（直した後は 9140 byte）と口座の名を見る。境界の server_acct_ のうち Acct の電文と中核の doc を比べる 4 本（doc_matches_core・failed_output_only_its_parts・grace_unreadable_no_left・slow_output_is_unknown）は私的な fn expected の直しで通る。server_acctwire と bport は Acct の電文同士か、引数の state dir に log の無い作業場で比べる。面の crate の歯は fixture acct-doc.json を読むだけで線を見ない（見るのは後の行 h-acct-spark）。 測り方。verify は中核の新しい歯の file tests/cspk.rs の cspk_（4 本）と境界 server_acct の cspk_（1 本）と server_acct_（11 本）と、acctcore_・acctpcore_・acctdoc_・acctwire_・bport_・accthome_ と xtask の check。cspk.rs は tsuzuri_contract::account の SPARK_SPAN_S・SPARK_STEP_S・Spark・SparkLine・SparkPoint と、tsuzuri_core::account::host の HostTexts・MEASURED_EVENT・accounts・accounts_at・spark と、project の doc を use し、log の行は serde_json の json で組む（中核の crate の dev の依存は足さない）。新しい歯の名は接頭辞 cspk_ で始め（cspk_consts_and_event_word・cspk_steps_newest_per_hour・cspk_at_most_168_points・cspk_accounts_at_fills_only_spark・cspk_acct_reads_host_log）、main の contracts の verify の filter の語 229 のどれも含まず、接頭辞もどの語も含まない。試作（main e055edd の写しに行 h-sort-hist と h-acct-rest の差分を当てた写し・68e4a9b までの差はこの行の file に触れない）で xtask の check が通り、境界の log の読みを止めると cspk_acct_reads_host_log と server_acct_doc_matches_core が、doc を accounts のままにすると cspk_accounts_at_fills_only_spark が、刻みを時の境で切ると cspk_at_most_168_points が、刻みの中の古い行を残すと cspk_steps_newest_per_hour が、fn expected の直しを戻すと server_acct_doc_matches_core が、fixture の直しを戻すと acctcore_fixture_builds_expected と acctdoc_fixture_roundtrip が落ちることを同じ写しで確かめた。 依存と順。depends は無し。書く file の順は計画の 5 節の鎖で、便の bead の依存で持つ: 契約 account.rs・中核 host.rs・境界 acct.rs・歯 server_acct は c-dormant（着地済み）→ c-acct-spark → a-lean（まだ起草していない）。中核 project.rs と歯 acctpcore（置き場だけの =）は c-dormant（着地済み）→ c-acct-spark → c-limit-resume（ノート surface-wave13h・留め中）。fixture acct-doc.json は h-acct-rest（ノート surface-wave13c）→ c-acct-spark。歯 accthome（置き場だけの =）は c-acct-spark → h-acct-spark（同じノートの後の行・depends で持つ）。契約の欄の形が変わるので、契約の型を読む面の crate も同じ着地で組み直る（面の code は欄 spark を読まない）。 範囲の外。面の描き（行 h-acct-spark）、project board の席の block の線、AllowanceUnmeasured の行の写し、ほかの state dir の log の読み、線の幅と刻みを頁から変える口、古さの閾値。"

