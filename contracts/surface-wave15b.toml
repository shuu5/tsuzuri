id = "h-acct-spark"
title = "HOME の口座 × 窓の表の後ろに 7 日の線の列（見本の acct.js の spark の svg）と測った時刻の列を置き、見出しを 7 つにし、列の幅を stylesheet の 7 列に戻し、語の辞書の鍵 spark の字を 7 日に直す"
