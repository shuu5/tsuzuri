goal = "なぜ。要件 FR1 は project board を account board から名前つきの新しい窓で開き、既に開いていれば前面に出すと言う。本番の account board は開く手順（便 h-win の account の windows.rs）と、開く button（HOME の次の一手の行・各 project の表の開くの欄・開いている窓の一覧の行）を持つが、電文の ProjectRow の board が全部の project で無し（中核の project_rows が board に None を置く・確かめた）なので、どの button も押せない字（語の鍵 not_yet）のままで、実物の project board を開けない。project board は project ごとに別の process（tz surface serve）で別の port に配られ、その port は repo の外で決まる。持ち主の裁定（2026-09-27T22:18Z・案 A・台帳 t3-hub.53.1 の notes）は、account の server が各 anchor で git の -C と anchor と config と --get と鍵 tsuzuri.boardport を撃って読み（anchor の .git/config・版管理に載らない・host も住所も持たない）、電文の board に port だけを載せ、面が頁の location の protocol と hostname に port を足して URL を組む形。前提は全部の board が account board と同じ host に在ること（今は真）。port の古い値は開けない link になる（届かない印は後の行）。 電文の形と置き場の決め（設計席）。board は Option の String の「:<port>/」でなく Option の u16 にする。型が port だけを許すので、電文に host や住所が入る道が無く（行 D-4・N-6）、面は字を検めずに組める。着地済みの fixture の board の字（/proj-a/ と /proj-b/）は u16 として読めないので、この行が 2 つの値を数に替え、その値を見る着地済みの 2 つの歯（acctwin_ と acctproj_ の 1 本ずつ）を直す。port の読みと字の検めと行への置きは境界の acct.rs に閉じ、中核（crates/tsuzuri-core）は書かない。中核の doc は今のまま board が None の電文を組み、境界がその電文の行に port を置く（git を撃つのも字を数にするのも境界の仕事で、中核の組み立ての入口と ProjectTexts の形は変わらない）。 在りか（着地済み・main の commit 8693ad3 で確かめた・11d03d3 からの差は design-intent と docs だけで、この節の file は変わっていない）。この行が足す 4 つの名（境界の acct.rs の BOARD_ARGS・board_port・Acct の board と、面の windows.rs の board_href）は base のどの crate の src と tests にも無い（grep で確かめた）。契約の型の crate の account.rs の ProjectRow（pub struct・欄は全部 pub・derive は Debug・Clone・PartialEq・Serialize・Deserialize）は欄 name・group・state_dir_known・seat・move_left_s・runs・ledger・next・board を持ち、board は今 Option の String（注釈 project board の URL の字）。契約の型の crate の pub mod wire の pub fn encode（Serialize の値の参照を受け Result の String）と pub fn decode（字の &str を受け Deserialize の型の値の Result・Error は serde_json の再公開）が電文の字を読み書きし、encode は serde_json の to_string（鍵とコロンと値の間に空白を置かない字）を返す。ProjectRow を struct の字で組む所は、中核の project.rs の project_rows の 2 つの枝（どちらも board に None・None は Option の u16 でもそのまま組める）と、着地済みの acctled の歯の doc_of（fixture の行を型板に欄 name と ledger だけを書き、残りは型板の clone で埋める形・board の型に依らない）だけ。欄 board を読む所は、面の account の windows.rs の open_url と、面の account の home.rs の次の一手の行の描き（board の is_some で開く button か not_yet の字かを決め、押すと open_url の字を windows の open に渡す）と、着地済みの acctpcore_project_rows_seat_runs_and_order（中核の project_rows の行の board がどれも is_none であることを見る）と acctwin_ の 1 本だけ（src と tests を grep で確かめた）。is_some と is_none は Option の u16 でもそのまま組める。 中核（この行は書かない・crates/tsuzuri-core の src/account）。project.rs の pub fn doc（&HostTexts と anchor から ProjectTexts への &BTreeMap と猶予の Option の &str と今の EpochSecs を受け AccountDoc）は電文を組み、その projects は pub fn project_rows（同じ 4 つを受け ProjectRow の Vec）の値。project_rows は private の fn declared（&HostTexts を受け、宣言の順の anchor と群の名の列）の列の project ごとに 1 行を同じ順で返し、どの行も board は None。declared は host.toml の字を host.rs の pub fn declaration（&str を受け Declaration・欄 groups は群の宣言の順の DeclaredGroup の Vec・DeclaredGroup の欄 anchors は Option の String の Vec）に渡し、群の順に、群の中は anchors の配列の順に、account の mod.rs の pub(crate) same_path（末尾の「/」を除いて同じ path か）で同じ path の anchor は最初の 1 つだけを並べ、anchors が読めない群は数えない。行の欄 name は account の mod.rs の pub fn project_name（anchor の &str を受け、末尾の「/」を除いた path の最後の名の String）の値。 境界（crates/tsuzuri-boundary の src/acct.rs・lib.rs の pub mod acct・target の cfg は無い host の code）。pub const GIT（字 git）と pub const GIT_ARGS（[&str; 3]・config・--get・scribe2.statedir）。pub struct Acct と pub fn new（器と git と bd の program・引数の state dir・cwd を受ける）。pub fn state_dir（&self と anchor の &Path を受け Option の PathBuf）は git の program に -C と anchor と GIT_ARGS を渡して crate::server の子 process の部品 capture（program・引数・cwd・待ちの上限を受け、rc 0 で上限の内に返した標準出力の byte の Some・ほかは None）で撃ち、待ちの上限は SCRIBE2_TIMEOUT（5 秒）、UTF-8 の字の前後の空白を除いて空でなければ PathBuf にする。pub fn doc（&self と今の EpochSecs を受け AccountDoc）は持ち回しの字（private の struct Texts・derive は Debug・Clone・Default）の host と projects と猶予を中核の project の doc に渡した電文を返す。持ち回しは HOLD（5 秒）で、過ぎれば private の fn gather（&self を受け Texts）が集め直す。gather は引数の state dir の host.toml を読み、private の fn anchors（host.toml の Option の &str を受け String の Vec）で anchor の列を組み（中核の declaration の群の順と anchors の順・same_path と同じ決めの private の fn same_path で同じ path は最初の 1 つ・中核の declared と同じ列）、1 段目は thread の scope の中で anchor ごとの state_dir と口座と猶予と引数の state dir の doctor を並べて撃って待ち、2 段目は state dir ごとの tick と doctor と、state dir の引けた anchor の台帳を並べる。Texts の host の欄 host_toml には読んだ host.toml の字が入る。変化の印（marks）は file の path だけで、git config は印にしない。停止の切り替えの口（accthb.rs の pub fn accept）は、host.toml から名の同じ anchor を引き、git は Acct の state_dir の 1 回だけを撃ち（ほかに撃つのは器の doctor と seat heartbeat）、doc も gather も呼ばない（確かめた）。account の GET の口（server の routes の account.rs）は Acct の doc の電文をそのまま返す。 面（crates/tsuzuri-surface の src/account/windows.rs・account の mod.rs の pub mod windows・host でも組む）。pub fn open_url（&ProjectRow と crate::frame の Mode を受け Option の String）は今、board の字と「?mode=」と Mode の key をつないだ字を返す。Mode は Beginner と Expert の 2 つで、key は beginner と expert、pub const ALL はこの順。wasm の target のときだけの mod dom の pub fn open（project の &str と url の &str を受け返りは無し・windows.rs が wasm の target のときだけ pub use dom::open で出す）は、handle が生きていれば前面へ、無ければ leptos の window() の open_with_url_and_target に空の字と窓の名を渡して開き、新しい窓の location の href が about:blank なら set_href に url を渡す。open を呼ぶ所は 3 つで、どれも open_url の字を渡す。windows.rs の一覧の行（open_url が None なら not_yet の字で押せない）、home.rs の次の一手の行、projects.rs の開くの欄（projects の pub fn open が open_url の Some を Open の New に・None を Open の NotYet にし、押すと windows の open を呼ぶ）。web_sys の Location の protocol と hostname（どちらも Result の String を返す）は Cargo.toml の web-sys の feature Location で使え、feature は着地済み（acctwin_manifest_features_already_there が見る）。 形（契約と fixture）。ProjectRow の board を Option の u16 にし、注釈を project board の port（account board と同じ host で配る・host と住所は持たない・無ければ開けない）にする。ほかの欄と型は変えない。tests/fixtures/account/acct-doc.json は projects の proj-a の board を 40001・proj-b の board を 40002 にし（仮の port・本番の port と結びつかない数）、proj-c の null とほかの字は変えない。 形（境界・字の検め）。pub fn board_port（字の &str を受け Option の u16・純粋）。字の前後の空白を str の trim で除き、残りが 1 字以上で全部が ASCII の数字（0 から 9）で、値が 1 以上 65535 以下ならその値、ほかは None。符号（+ と -）・コロン・斜線・host の字・中の空白・0・65536 以上は None（port でない字として not_yet のまま）。前の 0 は値で決める（08121 は 8121）。u16 の from_str は先頭の + を受けるので、数字だけかを先に見る。 形（境界・読みと置き）。pub const BOARD_ARGS（[&str; 3]・config・--get・tsuzuri.boardport）。Acct の pub fn board（&self と anchor の &Path を受け Option の String）は state_dir と同じ撃ち方（git の program に -C と anchor と BOARD_ARGS・capture・SCRIBE2_TIMEOUT・cwd は Acct の cwd）で、UTF-8 の字の前後の空白を除いた字が空でなければ Some（port かどうかは board_port が決める）。state_dir と board は git を撃つ private の手を分け合ってよい（state_dir の値と撃つ argv は変えない）。gather は 1 段目で anchor ごとの board を state_dir と並べて spawn して待ち（同じ anchor は anchors の列のとおり 1 回）、anchor と字の組を Texts の新しい欄に入れる（欄の名と形は実装が決める）。Acct の doc は中核の doc の電文を受け、その projects の行ごとに、行の宣言の anchor の board の字を board_port に渡した値を board に置いて返す。行と anchor の対は、持ち回しの host.toml の字を anchors に渡した列と電文の projects を順に並べて作ってよい（中核の project_rows は declared の列ごとに 1 行を同じ順で返し、declared と境界の anchors は同じ host.toml の字から同じ決めで同じ列を組む・確かめた）。行の名と anchor の project_name が同じことを確かめてから置いてもよい。state dir が引けない行にも port を置く（project board の process は state dir に依らない）。表に在っても宣言に無い anchor は読まない。marks は変えない。 形（面）。open_url は board が Some の port なら「:」と port と「/?mode=」と Mode の key をつないだ字（開く URL の host の後ろの字）、None なら None を返す（関数の名と引数と返りの型は変えない・projects.rs と home.rs の呼びはそのまま組める）。pub fn board_href（protocol の &str と hostname の &str と host の後ろの字の &str を受け String）は protocol と「//」と hostname と後ろの字をつなぐ（純粋・host でも組む）。protocol は location の protocol の形（末尾にコロン・例 http:）で、hostname は port を含まない。mod dom の open は本体で window() の location の protocol() と hostname() を読み（どちらかが Err なら何もせずに返る・読んだ 2 つの字を束ねる名は protocol と hostname）、1 文 let url = &board_href(&protocol, &hostname, url); で引数の url を board_href の字の参照で覆い直し、今の set_href(url) の字のまま新しい窓の URL に置く（覆い直しを set_href(url) より前に書く・この 1 文の名と引数の順は字の歯が空白を除いて探すので変えない・読むのは新しい窓を開く枝の中でも本体の頭でもよい）。acctwin_no_storage_and_wasm_wiring が見るほかの字もそのまま残す。location の host と port は読まない（host は account board の port を含み、port は account board の port）。前面へ出すだけのときは URL を使わない（今のまま）。組んだ URL は例えば「http://host-1:40001/?mode=expert」の形（host-1 は歯の仮の hostname）。 出さない物と前提。port の古い値や止まった board を見分ける印（届かない印）は後の行。git config の変化は変化の印でないので、port を変えると次の読み（ほかの変化の知らせか頁の読み直し）で出る。board は同じ host の前提で、別の host の board は開けない（案 C の path の下の配りは ADR の候補として残す・持ち主の裁定）。各 repo の .git/config の鍵の値は持ち主が置き、版管理に載る file には書かない。中核の src と home.rs と projects.rs と vocab.json と style.css は書かない（not_yet と open_new の語の鍵は在る）。要件 FR1（第 0.8 版）の、account board から開いた窓の一覧をその browser に残すことは後の行（h-win-store・windows.rs を書く）の仕事で、この行は保存の字を足さない（acctwin_no_storage_and_wasm_wiring の保存の字の見張りは今のまま通る）。 着地済みの歯（直すもの）。server_acct_argv_exact（tests/server_acct.rs）は今、偽の git の argv の記録を、宣言の 5 つの anchor（proj-a・proj-e は末尾に「/」を付けて書く・proj-b・proj-c・proj-d）ごとの字 -C と anchor と config --get scribe2.statedir の 5 行（名の順）と見る。この行は同じ anchor ごとに config --get tsuzuri.boardport の行も足した 10 行（名の順）と見て、BOARD_ARGS の値も見るように直す（use に BOARD_ARGS を足す）。server_acct_holds_five_seconds は今、5 秒の中の git の数を 5 と見る。この行は 10 と見るように直す（5 秒の後に撃ち直して 2 倍になる所と、argv ごとに 1 回の所はそのまま通る）。acctwin_open_url_from_board_and_mode（tests/acctwin.rs）は今、fixture の proj-a と proj-b の open_url を字 /proj-a/ と /proj-b/ に ?mode= と key を足した字と見て、行の board に字 /elsewhere/ の String を置く。Option の u16 では組めないので、done (8) の値を見るように直す（注釈の (2) の字も直す）。acctproj_open_cell（tests/acctproj.rs）は今、開くの欄を Open の New の /proj-a/?mode=expert ほかと見るので、done (8) の値を見るように直す。4 つとも同じ file のほかの歯は変えない。 着地済みの歯（直さずに通る・write-set の外を含む・tests の下を grep で確かめた）。server_acct_ のほかの歯（tests/server_acct.rs）の偽の git は argv の -C の次の path の最後の区切りで字を選び、鍵を見ないので、tsuzuri.boardport の問いにも state dir の path の字（proj-a・proj-e・proj-b）か空白だけ（proj-d）を返すか落ちる（proj-c）。どれも board_port で None になり、server_acct_doc_matches_core と server_acct_failed_output_only_its_parts と server_acct_grace_unreadable_no_left が比べる中核の project の doc の電文（board は None）と同じになる。server_acct_slow_output_is_unknown は proj-b の git を 8 秒眠らせ、読みが 4 秒以上 8 秒未満で返ることを見る。board の git も同じ印で眠るので、1 段目で並べれば 5 秒の上限の 1 回分で済み、1 段目の後に撃てば 8 秒を越えて落ちる（done (4) の 1 段目の決めの歯）。server_acct_state_dir_from_git と server_acct_marks_list と server_acct_repo_and_state_bytes_unchanged と server_acct_fixture_names と server_acct_no_new_dependencies は state_dir・marks・byte・偽の出力の字の名・Cargo.toml を見て、変わらない。server_acctwire の acctwire_get_matches_acct は GET の口の電文と同じ偽の出所の Acct の doc を比べ（どちらも同じ関数）、acctwire_ のほかの歯は口を撃つ前と --state-dir の無い server と守りの枝で git を撃たないことを見る（gather を呼ばない所は変えない）。server_hb の server_hb_off_then_on_shoots_seat は停止の切り替えで git の argv が scribe2.statedir の 1 行だけであることを見る（accept の git は state_dir の 1 回だけ・変えない）。中核の歯（acctcore_・acctpcore_）は中核の src を読んで呼び、acctpcore_project_rows_seat_runs_and_order は中核の project_rows の board がどれも None であることを見る（中核は書かないので変わらない）。acctpcore_assemble_equals_doc_fixture は fixture の電文を serde_json で読んで assemble に渡した値と比べる（board の値に依らない）。契約の acctdoc_ の歯は fixture を読み書きし直して同じであること（acctdoc_fixture_roundtrip）と、字 unknown の在りか（acctdoc_unknown_only_where_marked・board は数か null で unknown でない）と口の path を見る。fixture を読む面の歯（accthome_・acctframe_・acctsess_・accthb_・acctled_・lspark_〔tests/ledspark.rs〕・hcard_・ticker_・pmore_〔tests/projmore.rs〕と、同じ波の行 h-sess-axis の sxaxis_）は board の値を見ず、acctled の doc_of は型板の clone で board を埋める。home.rs の next_view の描きは board の is_some と open_url と open の呼びだけで、字の歯（accthome_vocab_css_deps_and_frame が見る open(&p.name, &u) の字ほか）は変わらない。projects.rs は open_url と windows の open を今のまま呼ぶ（pmore_ の字の歯は projects.rs を読み、変わらない）。acctwin_no_storage_and_wasm_wiring は windows.rs に字 pub fn open(project: &str, url: &str)・open_with_url_and_target と空の字と &win_name(project) の呼び・引用符で囲んだ about:blank・set_href(url)・focus()・closed()・after_open(・after_close(・dom::list_view()・class と等号と引用符で囲んだ items wins が在ることと、src/account の下に localStorage・sessionStorage・cookie の字が無いことを見る（この行は 10 個を残し、3 つの語を書かない）。acctframe_ の歯は src/account の file の名の 8 つの列と block の id の字と class の字と /api/ の字の無さを見る（file を足さず、class と /api/ の字を足さない）。frame_classes_are_in_stylesheet と frame_no_heading_words_in_code は src の全部の class の字と、語の辞書の日本語の語と同じ literal を見る（足す