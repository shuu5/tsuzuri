acctframe_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・askcard_・batchpanel_・board_min_・contract_form_・frame_・gapspage_・gquestion_・graph_・gview_・hbconf_・hbpost_・hbproc_・hbroute_・hook_・hsblock_・hsderive_・hspage_・ledgerblock_・mapgraph_・mapview_・nextstep_・nodepage_・parts_・pipe_・project_・question_・seatblock_・seatcard_・server_・skeleton_・stage_・stats_・steady_・topbar_・tz_・mlink_・gnav_・mkeys_・klink_・ilink_・afocus_・nxact_・urpanel_・saxis_・ticker_・hfig_・pmore_・lspark_・apop_・brand_・runsdoc_・nbatch_・kcli_・hcard_・qgate_・nsum_・ntime_・ptitle_・ncard_・hsym_・smore_・lcard_・aaround_・hruling_・sxaxis_・plimit_。新しい歯の名から先頭の bport_ を除いた字は、このどれも部分の字として含まない（例 bport_project_x・bport_server_x・bport_frame_x・bport_stage_x は不可）。 ほかの行との重なり。この行の write-set は同じ波のほかの行の write-set と重ならない（中核の project.rs を書く行 c-limit-pipe とも重ならない・この行は中核を書かない）。c-limit-pipe が中核の session_lines を変えても、この行の done は中核の doc の電文の projects と、中核の doc と同じ字で比べる形なので、session の値に依らない。tests/fixtures/account/acct-doc.json と acctpcore.rs を置き場だけに持っていた行 c-next-batch と、projects.rs を書いた行 h-proj-more は着地済み。 依存は足さない。Cargo.toml・vocab.json・style.css は触らない。中核は書かず（git を撃つのも字を数にするのも境界だけ）、面の host の部分は location を読まない（読むのは mod dom の open だけ）。"

[[contract]]
id = "c-limit-pipe"
title = "中核の session の行で、器が run を上限で止めた印（run の段を決める最後の event が RunStage で段の名が RateLimited）を写し、pipeline の session の状態を限度（Limit）と印す"
req = ["FR12"]
section = "5"
write-set = ["crates/tsuzuri-core/src/account/project.rs", "+crates/tsuzuri-core/tests/plimit.rs", "=crates/tsuzuri-core/tests/acctpcore.rs"]
verify = ["cargo nextest run -p tsuzuri-core --test plimit --no-tests=fail plimit_", "cargo run -q -p xtask -- check"]
size = "S"
done = "(1) 中核の account の project の module（src/account/project.rs・host の code）に pub const RATE_LIMITED（&str・字 RateLimited）が在る（歯 plimit_const_names_vessel_word） (2) session_lines は pipeline の行ごとに、その run の段を決める最後の event（kind が RUN_STAGE_EVENTS のどれかの最後の event・行の stage と since を決める同じ event）の kind が字 RunStage で欄 stage が RATE_LIMITED と同じ字なら state を Limit にし、ほかは今までどおり（段が Questioned・Failed・Stopped でなく席が立っていれば Run・ほかは Wait）にして、節の host の字と 29 行の event log で、今 1790508300（11:25）の pipeline の 5 つの行と今 1790510400（12:00）の pipeline の 4 つの行が節の表の値と順（project・role・name・account・state・stage・since・spans）と同じになり、どちらの今も行の列の先頭は、同じ入力で events を無しにした session_lines のただ 1 つの行（orchestrator の行・state は Run）と同じ（歯 plimit_marks_on_both_times） (3) 今 12:00 で、残量の字を無しにしても、節の組 F（両方の口座の 3 つの窓を 100% にし戻る時刻を今より後にした字・host の accounts に渡すと両方の口座の five_hour と seven_day の used_pct が 100）にしても、session_lines の行の列は組 B の列と全部の欄で同じで、project の字の tick_last を 1 行 ts=1790509800 decision=move reason=account-pressed にすると先頭の orchestrator の行の state は Limit になり、2 つ目からの pipeline の行は組 B と同じ（歯 plimit_seat_and_usage_apart） (4) doc に節の入力と今 12:00 と猶予の字の無しを渡した電文の sessions は同じ入力の session_lines と同じで、そのうち role が Pipeline で state が Limit の行の name は pl-1-20260927T110000Z と pl-6-20260927T114500Z の 2 つで、その 2 つの行を serde_json の to_value で JSON の値にした欄 state は字 limit（歯 plimit_doc_carries_mark） (5) 着地済みの歯 acctpcore_session_lines_match_expected・acctpcore_doc_host_parts_from_inputs・acctpcore_assemble_equals_doc_fixture・acctpcore_run_counts_four_columns・stats_stage_of_closed_table・server_acct_doc_matches_core・acctwire_get_matches_acct は直さずに通り（xtask の check）、中核の src/account の下の字に std::fs・std::process・SystemTime を足さず、中核の Cargo.toml の直接依存は serde・serde_json・tsuzuri-contract のままで足す外の依存は 0 本（歯 acctcore_pure_and_no_new_dependencies） (6) tests/plimit.rs の test の属性の付いた fn の名はどれも plimit_ で始まり、名から先頭の plimit_ を除いた字は、節に並べた filter の語のどれも部分の字として含まない（歯 plimit_own_names_clean が自分の file の字を読んで全部の名を見る）"
goal = "なぜ。account board の HOME の群の枠の見出しの横の「限度で止まった session」の数（着地済みの行 h-cards-home・面の account の home.rs の pub fn limited・電文の sessions のうち state が Limit で project が群の members のどれかと同じ行の数）の「?」の注釈（面の語の辞書の鍵 limited の plain）は「この群で限度で止まった数・両方の session を数える」と言う。account の tab の印（面の account の mod.rs）も state が Limit か Silent の session を数える。ところが本番の中核（src/account/project.rs の pub fn session_lines）は pipeline の session の state を Run か Wait にしか印さないので、どちらの数も orchestrator の席しか数えない。orchestrator の席の Limit は、器が自分の閾値で決めた判定の語（合図の最後の判定の reason の字 account-pressed）の写しで、中核は数を持たない。pipeline の run にも器が自分で書く上限の印が在る（次の段）。設計席の決め（2026-09-28）で、pipeline の session もこの器の印だけを写して Limit にする。run の口座の使用量を tsuzuri の数で判じる形は取らない。取ると orchestrator と pipeline で限度の決め方が混ざり、要件 FR12 の「面も server も閾値を持たず判じない」と持ち主の裁定 t3-hub.53.8（器の値を写すだけで tsuzuri は判じない）に反するから。 器の印（器の scribe2 の main の code と設計文書で確かめた・この行は器を書かない）。器の run の段は閉じた 11 値（Intake・Reviewed・Blocked・Spawned・Questioned・RateLimited・Implemented・Gated・Landed・Stopped・Failed）で、event log の欄 stage は段の variant の名の字（器の設計文書 fleet-event-log.md）。runner が上限の rc（器の headless の RC_RATE_LIMIT・75）で終わった周に、器の pipe は SeatStopped を書いた後に、kind が RunStage で stage が字 RateLimited の event を 1 件書く（器の crate scribe2 の src/pipe/spawn.rs の fn settle_rate_limit）。その detail は字 rc: と rc の数・字 status: と上限の status・字 account: と口座をこの順にコンマでつないだ字で、status は runner の停止行の値か、読めなければ字 unknown、口座は器が runner に渡した口座か、渡していなければ字 inherited（器の境界の crate の歯 tests/e2e/pipe/ratelimit.rs が detail rc:75,status:allowed_warning,account:inherited を見る）。この段は終わりでない。器は別の口座で起こし直すと RunStage の Spawned（detail は字 account: と口座と字 ,resume:rate-limit）と SeatSpawned を書き、終えるのは pipe stop（RunStopped）だけ。器の run の今の段は、物理の順で最後の段（器の replay）。この host の実物の event log（state dir の fleet/events.jsonl）にはまだ RateLimited の event が 1 件も無い（grep で確かめた）ので、歯の event の形は器の code と器の歯から写す。 在りか（main の commit 8693ad3 で確かめた・中核の project.rs は commit 337fe32 から変わっていない）。中核の src/account/project.rs（account の mod.rs の pub mod project・host の code・wasm の target に限らない）。pub const ALIVE_S（u64・3600）と pub const RUN_STAGE_EVENTS（&str の 5 つの配列・RunCreated・RunStage・RunDone・RunStopped・QuestionRaised）、pub struct ProjectTexts（pub な欄 state_dir_known の bool と、tick_status・state_log・tick_last・move_signal・events・ledger の Option の String・derive は Debug・Clone・Default・PartialEq・Eq・Deserialize）。非公開の fn text（event の JSON の値と鍵を受け、その欄の字の Option）と event_ts（欄 ts の RFC 3339 の字を EpochSecs に）。非公開の struct Run（run の id と、ts が今以下の event の列を log の順に）と、その fn last_stage（kind が RUN_STAGE_EVENTS のどれかの最後の event）・seated（SeatSpawned の数が SeatStopped の数より多い）・ended（RunDone か RunStopped を持つ）・alive（席が立っているか、最後の event が今から ALIVE_S 以内）・account（各 event の detail をコンマと空白で切った字のうち、字 account: で始まり残りが空でない最後のものの残り）。非公開の fn runs（ts が今以下の RunCreated を持つ run を RunCreated の順に・RunCreated の無い run の event と ts の読めない event は読み捨てる）と seat（その project の席の card を中核の seat の card で組む）。pub fn session_lines（&HostTexts と、anchor の String から ProjectTexts への &BTreeMap と、今の EpochSecs を受け SessionLine の Vec を返す）は、群の宣言の順の project ごとに orchestrator の行（席の card が Known なら card の target・account・state・since・spans を写し、Unknown なら name が空の字で state が Unknown の行）を置き、state dir が引けて event log（ProjectTexts の events）が読めれば、終わっていない生きている run を RunCreated の順に pipeline の行として置く。pipeline の行は project が project の名・role が Pipeline・name が run の id・account が Run の account・stage が last_stage の event の kind と stage と detail を crate::pipeline の stage_of に渡した段・since が last_stage の event の ts・spans が Unknown で、state は段が Questioned・Failed・Stopped でなく席が立っていれば Run、ほかは Wait。pub fn doc（&HostTexts と project の字の表と猶予の秒の字の Option と今を受け AccountDoc）は assemble に host の accounts・groups・moves と project_rows と session_lines の値を渡して電文を組み、境界の src/acct.rs が口の電文をこの doc で組む。 段の表（中核の src/pipeline.rs・この行は書かない）。pub fn stage_of（event の種類の &str と段の名の Option の &str と detail の &str を受け、契約の型の Stage と理由の対の Option を返す）の閉じた表は、RunCreated と RunStage の Spawned・Implemented と通った審査の Reviewed を Running、RunStage の Gated を Gated（落ちた審査は Failed）、QuestionRaised を Questioned、RunDone を Landed にし、表に無い段（R