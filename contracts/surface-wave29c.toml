受付（審査 PASS の偽の lens）で起こす。 入口の赤。main には tests/e2e/pipe/dispatch/commute.rs も名に vcwire_ を持つ歯も無いので、verify の 3 行目は --no-tests=fail で落ちる。4 行目の歯は main に在るが、結末の欄の無い main では組めない。 試作と噛み。写し drafts/try-w226a で書く file は write-set の中で閉じる（14 file）。試作の木で verify の 1 行目から最後の行までが rc 0 で、器の入れ子の歯の全部（cd scribe2 で cargo nextest run --workspace --no-fail-fast）は 4,163 本が通り、器の xtask の check も rc 0（core-lines 85586/90000・intake.rs は幅で数えて 1492/1500）。根の xtask の check は撃っていない（書く file は全部 scribe2/ の下）。噛みは 9 の変異（記帳を外す・detail の並び・断りの字の結末・判じの結末を問わず通す・規則の行を読まない・同じ周に起こした bead を相手から外す・live な便を先に名乗る・main の先端の 1 つ前で判じる・描きの結末を外す）が全部 rc 100 で名指した歯が落ちた（2 番目から 7 番目の項の歯に各 1 つ以上・書き戻した後の写しは clean）。 範囲の外。着地の記帳（積み直しの衝突・stale・再 gate の不合格・候補の木の赤と行の差の数・v-commute-ledger）・規則の行を真にする（v-commute-on）・席の置く前の照らしの道具（席の手）・器の binary の入れ替え（席の手）。この行の契約表の行は欄 patch を書かない（前の行と同じ・規則の行が偽の間は判じに使われない）。"

