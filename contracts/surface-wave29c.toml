done = "(1) git apply --reverse --check docs/design/patch/v-commute-wire.patch が rc 0（差の file の hunk が全部木に在る・verify の 1 行目） (2) 器の e2e で、規則の行 pipe.overlap_commute を値 true で持つ manifest の受付は、面の中の 30 行の file crates/toy/src/lib.rs の 5 行目を替える差の行 a の live な便の下で、25 行目を替える差の行 b（bead s2-b）を rc 0 で受け、出来事の記録を読み直した kind OverlapCommuted の行は 1 行だけで、bead が s2-b、detail が字 run= と行 b の run id と空白と字 with= と行 a の run id と空白と字 files= と crates/toy/src/lib.rs と空白と字 main= と HEAD の sha の並び（歯 vcwire_intake_passes_a_commuting_pair_and_records_it） (3) 器の e2e で、同じ manifest の受付は、6 行目を替える差の行 c と差の file を持たない行 d をどちらも rc 1 で断り、stderr の 1 行目は字 pipe とコロンと空白の後に、行 c は「write-set が live な run （行 a の run id）と交差する（crates/toy/src/lib.rs・not-commuting）」、行 d は同じ字の末が「・no-patch）」で、run dir の列は替わらず kind OverlapCommuted の行は無い（歯 vcwire_intake_refusal_names_the_verdict） (4) 器の e2e で、規則の行を持たない manifest と値 false で持つ manifest のどちらでも、受付は行 b を rc 1 で断って stderr の 1 行目は結末を添えない字（末が「crates/toy/src/lib.rs）」）で、列の 1 周（pipe dispatch ls）の s2-b の理由は overlap と行 a の run id と字 /1 の並びで、kind OverlapCommuted の行は無い（歯 vcwire_rule_off_keeps_the_refusal_and_the_wait） (5) 器の e2e で、値 true の manifest の列の 1 周は、台帳の priority の順の s2-c（行 c）・s2-b（行 b）・s2-f（22 行目を替える差の行 f）・s2-d（行 d）の理由を、overlap と行 a の run id と字 /1/not-commuting の並び・字 -・字 overlap:s2-b/1/not-commuting・字 overlap:s2-b/1/no-patch と書き、件数の行の末が total=4 ready=1（同じ周に起こした s2-b を相手に判じる・歯 vcwire_dispatch_starts_the_commuting_bead_and_names_the_verdict） (6) 器の e2e で、値 true の列の 1 周が s2-b の理由を字 - と書いた後に、main に 25 行目を替える commit を足すと、受付は行 b を rc 1 で断って stderr の 1 行目の末が「・not-commuting）」で、その後の列の 1 周の s2-b の理由は overlap と行 a の run id と字 /1/not-commuting の並び（歯 vcwire_intake_judges_again_after_main_moves） (7) 器の lib で、待ちの理由の描き（src/pipe/dispatch.rs の WaitReason の render）は、結末の無い重なり（相手 r1・file 2 本）を字 overlap:r1/2、結末 same-name の重なり（相手 r2・file 1 本）を字 overlap:r2/1/same-name と描く（歯 pipe_dispatch_wait_reasons_render_the_name_and_the_value）"
