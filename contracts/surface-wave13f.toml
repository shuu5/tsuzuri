ない）。行 c-dormant の契約: AccountDoc の欄 dormant は Vec<DormantSeat>、DormantSeat の pub な欄は project・target・account（Option<String>）・last（EpochSecs）・tick_healthy と heartbeat（Reading<bool>）。 形。(a) account の mod.rs に pub const DORMANT_KEY（字 dormant）・DORMANT_CLASS（字 chip num dormant）・DORMANT_CARD（字 dormant:all）・DORMANT_STATE（字 wait）・DORMANT_KIND（字 12 時間以上 動きなし）・DORMANT_SRC（字 seat/<seat>/state.jsonl の最後）・DORMANT_VALUE_CHARS（34）・DORMANT_NAME_CHARS（18）を UPDATED_CLASS の後に置く。pub fn dormant_chip（&AccountDoc から Option<String>）は dormant が空なら None、ほかは語 dormant の label と空白と数。pub fn dormant_card（&AccountDoc から Option<Card>）は dormant_chip が None なら None、ほかは題 = dormant_chip の字、種類 = DORMANT_KIND、値 = 席の target を字 空白と斜線と空白 でつないで cut で DORMANT_VALUE_CHARS 字に切った字、出所 = DORMANT_SRC、詳しく = 席ごとに cut で DORMANT_NAME_CHARS 字に切った target と空白と口座（無ければ ?）と空白と ◷ と空白と hmd(last, 電文の at) と字 · tick と tick の語と字 · hb と hb の語（語は orch_card と同じ healthy・stale・on・off・?）。module の doc に休止中の chip と card を足す。use に mapview の graph の cut・project の seat の hmd・vocab の label・widgets の hover の Card を足す。(b) board.rs の top の nav の部品の {updated_chip()} の直後に {move || dormant_view(read)} を置き、私的な fn dormant_view（Memo を受け Option<AnyView>）は電文が読めて dormant_chip と dormant_card が Some のときだけ span（class DORMANT_CLASS・data-card DORMANT_CARD・tabindex 0・use:attach で card）の中に project::state_icon(DORMANT_STATE) と chip の字を出す。module の doc の 3 行目の未決の字を、休止中の chip を置く旨に直す。 決めた幅。chip の数は電文の dormant の数。時刻の字は hmd に任せる（休止中の席の最後の時刻は 12 時間より前なので、日の違う席は月日が付く・見本は時と分だけ）。経験者の mode の行（見本の ex の target と heartbeat と tick の 1 行）は Card に欄が無いので作らず、hb の語を詳しくの行に入れる。chip は電文が読めないとき（読みの落ちで Memo が None）は出さない。vocab.json と面のほかの block（session の表と project の表）は変えない。 着地済みの歯（確かめた）。board.rs の字を読む歯は tests/gfresh.rs の gfresh_boards_text（262 行）・gpulse.rs の gpulse_boards_text（165 行）・acctpop.rs の apop_dom_wiring_in_source（62 行）・hcard.rs の hcard_dom_wiring（377 行）・mstore.rs の mstore_board_calls（163 行）・acctwin.rs の acctwin_no_storage_and_wasm_wiring（266 行）、account の mod.rs の字を読む歯は acctframe.rs の acctframe_blocks_per_tab_and_module（257 行）と acctframe_path_from_contract_and_no_storage（463 行）と aord.rs の aord_one_place（196 行）で、試作でどれも直さずに通った（足した字は見ない字の並びを崩さない）。 測り方。verify は新しい歯の file tests/hdchip.rs の hdchip_（3 本）と、上の着地済みの 8 file の歯と xtask の check（面の wasm の clippy と surface-build を含む）。新しい歯の名は接頭辞 hdchip_ で始める（hdchip_none_without_resting_seats・hdchip_chip_and_card_follow_mock・hdchip_board_places_chip_after_updated）。hdchip.rs は tsuzuri_surface::account の pub な const と fn・tsuzuri_surface::project::seat::hmd・tsuzuri_surface::vocab::label と契約の DormantSeat を use し、fixture を契約の wire の decode で読み、board.rs を CARGO_MANIFEST_DIR の下から読む。時刻の期待は hmd の値で書く（時刻の字の形が後で変わっても歯を直さない）。main 8634bf2 の contracts の verify の filter の語 210 のどれも新しい名に含まれず、接頭辞 hdchip_ もどの語も含まない（近い語 hcard_・gpulse_・gfresh_ も含まない）。試作で 3 本が通り、chip を空の列でも出すと hdchip_none_without_resting_seats が、値の字数を 36 にすると hdchip_chip_and_card_follow_mock が、chip を読みの脈の印の後に置くと hdchip_board_places_chip_after_updated が落ちることを同じ写しで確かめた。 依存と順。depends は c-dormant（同じノートの前の行・契約の DormantSeat を使う・ノートの depends と便の bead の依存で持つ）。計画の 5 節の鎖（surface/account/board.rs は g-mode-store → g-fresh → g-pulse → h-dormant）の前は着地済み。account の mod.rs は第 13 波 c の起草中の行 h-acct-split（pub mod cards の行を足す）が書くので、器は同時に流さず、順は便の bead の依存で持つ。時刻の字を日本時間に替えた行 g-jst（ノート surface-wave13a・着地済み）とは書く file が重ならず、この行の歯は hmd の値で期待を書く（日の決め方は g-jst の歯が見る）。外の依存は足さず、vocab.json・Cargo.toml・契約と中核と境界の crate・fixture は触らない。行数は試作で mod.rs 398 → 457・board.rs 227 → 246・hdchip.rs 165。 範囲の外。経験者の mode の 1 行（Card に欄が無い）。休止中の席を session の表や project の表に印で出すこと（見本は表から外し数だけ）。時点のつまみと関係の頁（持ち主の裁定 t3-hub.53.10 で作らない）。"
