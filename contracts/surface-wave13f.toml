goal = "在りかの main は 8634bf2（計画 surface-plan v0.36）。この節の字はその code の値。 なぜ。account board の停止の切り替え（着地済みの行 e-seat-hb と h-wire・持ち主の裁定 t3-hub.52.29 の案 A）は、境界の POST /api/account/heartbeat（src/accthb.rs の pub fn accept）が器（scribe2）の CLI の seat heartbeat <on|off> を 1 回撃ち、器が返してから 200 を返す。器は off で席の dir に停止の記録 heartbeat-off を置き、on で消す。面は 200 の後に全部の口を読み直す（面の src/account/heartbeat.rs の 437 行の crate::net::reload_all）。ところが境界の account board の読み（src/acct.rs の pub struct Acct）は集めた字を 5 秒持ち回し、5 秒の中の読みは集め直さない。project の行の席の card の heartbeat は器の seat tick status の出力の席の行の字 heartbeat= の値なので、切り替えの前 5 秒の中に口 /api/account が読まれていれば、切り替えの後の読み直しは前の heartbeat を返し、account board の on/off の字と button の向きが古いまま残る。変化の知らせも同じで、見張りが印（heartbeat-off を含む）の変化で board-changed を送っても、その後の読みは持ち回しの前の字を返す。同じ古さを席の card から除いた行 e-seat-hbmark（ノート surface-wave13e・着地済み・51c4045）の起草で見つけた（席の決め・計画の 9 節の行 e-acct-hbmark・拠る要件は FR12 の停止の表示と NFR2 の器の変化は 5 秒以内に面へ届く）。行 e-seat-hbmark と同じ形で、印の file が動いたら持ち回しを解く（席の card の src/server/seat.rs は着地済みの字で、型の別名 Stamps と、集める前に取った印を held に持つ形・use super::events::stamp）。 在りか（src/acct.rs・write-set・main 8634bf2 で確かめた・456 行）。lib.rs の pub mod acct。pub struct Acct（75〜85 行）は私的な欄 scribe2・git・bd（OsString）・state_dir・cwd（PathBuf）・held（Mutex<Option<(Instant, Texts)>>）・ledgers（Mutex<BTreeMap<String, Source>>）を持つ。私的な struct Texts（62〜72 行・derive は Debug と Clone と Default）の欄 marks（Vec<PathBuf>）は、私的な fn gather（221〜384 行）が集めた変化の印の一覧で、state dir ごとの event log（fleet/events.jsonl）、doctor の orchestrator の席の dir の state.jsonl と tick-last と heartbeat-off（344〜348 行）、群の宣言の群ごとの今の記録（groups/<群>.account・366〜374 行）をこの順に持つ。pub fn marks（173〜175 行）は texts の字の marks を返す。私的な fn texts（177〜188 行・doc は持ち回しの字〔HOLD を過ぎていれば集め直す・集めるあいだは次の要求を待たせる〕）は held の lock を取り、Instant の elapsed が HOLD（server::seat の pub const・5 秒）未満なら持ち回しの字の clone を返し、ほかは gather の字を今の Instant と一緒に held に入れて返す。pub fn doc と pub fn doc_read は texts の字で中核の project::doc を呼ぶ。module の doc の 11 行目は集めた字は 5 秒のあいだ持ち回す、と書く。use は std の collections・ffi・path・sync::Mutex・thread・time::Instant と、契約と中核の item と crate::server::ledger の Source と capture と crate::server::runs の EVENTS_LOG と crate::server::seat の定数と Seat。 在りかの補い（読むだけの file・確かめた）。src/server/routes/account.rs の口 GET /api/account は最初の要求で別の thread（fn watch_acct_marks）を 1 度だけ始め、その thread は始めてすぐと ACCT_MARKS_EVERY（src/server/mod.rs の pub const・60 秒）ごとに Acct::marks の一覧を共有の一覧（Shared の欄 acct_marks）に置く。src/server/mod.rs の Server::bind_with が変化の見張り Hub::start に渡す閉包（207〜213 行）は周ごとに走行の印・設計の印・席の card の印・この共有の一覧をつなぐ。src/server/events.rs の Hub::watch_board はその列を POLL（500 ミリ秒）ごとに撃ち直し、pub fn stamp（61 行・fs::metadata の更新時刻と長さ・無ければ None）が前の周と違えば board-changed を送る。一覧に載ったまま無い file は None の印なので、無い file が現れても消えても変化になる。server の mod.rs は pub mod events を持つ（acct.rs から crate::server::events::stamp を use できる）。events.rs の module の doc の 11 行目は、便 e-seat は席の状態の file（state.jsonl と tick-last）の印を板の印に足す、とだけ書き、heartbeat-off を名指さない（ノート surface-wave13e の席への申し送り）。 形。(a) acct.rs に私的な型の別名 Stamps（Vec<Option<(SystemTime, u64)>>・doc は印の file ごとの更新時刻と長さ）と私的な fn stamps（印の一覧の順に crate::server::events::stamp の値を並べる）を置き、Acct の held を Mutex<Option<(Instant, Stamps, Texts)>> にする（欄の doc は集めた時刻と、集める前に取った印の file の更新時刻と長さと、集めた字）。(b) texts は lock を取った後、held が在ればその字の marks の今の印を取り（before）、held が在り elapsed が HOLD 未満で before が held の印と同じなら持ち回しの字を返す。ほかは gather し、集めた字の marks が held の字の marks と同じ一覧なら before を、違う一覧か初めての集めなら集めた後に取った印を、今の Instant と字と一緒に held に入れて返す。印を集める前に取るので、集める途中の変化は次の読みで集め直す（一覧が変わる周だけは集めた後に取る）。(c) acct.rs の module の doc の持ち回しの文に、変化の印の file の更新時刻と長さが集める前に取った値と違えば 5 秒の中でも集め直す旨と行の名を足し、fn texts の doc を (b) の決まりに直す。(d) events.rs の module の doc の 11 行目の文を、便 e-seat の state.jsonl と tick-last に続けて、席の card の印（行 e-seat-hbmark）と account board の印（crate::acct の Acct::marks）は同じ dir の停止の記録 heartbeat-off の印も持つ（停止の切り替えで board-changed が出る）旨の 2 行にする。gather・doc・doc_read・marks の返す値・HOLD・子 process の撃ち方と argv は変えない。routes と mod.rs と accthb.rs は変えない。 決めた幅。印は更新時刻と長さで、同じ長さで同じ時刻の書き換えは見分けない（変化の見張りの印と同じ決まり）。集め直しは印が動いたときだけで、器の出力（tick status・doctor・usage・rules）と git と 