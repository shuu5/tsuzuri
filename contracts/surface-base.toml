done = "(1) 子 process を撃つ関数（ledger の module の capture）は、子を新しい process group に入れる（group の id は子の pid） (2) 時間切れのとき・標準出力を取れないとき・子の終わりを待てないときは、子の process group の全体を止めてから子を待って片付ける (3) 歯の中で書く sh の script（孫の sleep 30 を背景で撃ち、孫の pid を file に書き、孫を待つ）を 300 ミリ秒の時間切れで撃つと capture は None を返し、返った時から 2 秒の内に孫の pid の /proc の stat が無くなるか状態の字が Z になる (4) 歯の中で書く script で、字 ok を出して rc 0 で終わるものは ok と改行の byte を返し、rc 1 で終わるものは None を返す (5) 止める関数 stop_with に在らない道具の path を渡すと、false を返し、子だけを止めて待って片付け（子の pid の /proc の stat が無い）、panic しない。道具 kill を渡して group へ送れたときは true を返す (6) unsafe の字と、足す外の依存は 0 本"
depends = ["e-coalesce"]
goal = "実物の server で 2026-09-27T12:26Z に測った。台帳の読み（bd --readonly list）の子 process が、親の居ない孤児として 150 本残っていた。bd の口は node の包みの script で、本物の bd はその子（server から見ると孫）として走る。server は 5 秒の時間切れで子（包み）だけを止めるので、孫の本物の bd は止まらずに走り続ける。台帳の置き場は同時に開く process が増えると 1 本ごとが遅くなる形らしく（孫が 20 本ほど残っているとき 1 本が 28 秒から 36 秒・残りが無いとき 0.5 秒）、残った孫が列を作り、新しい読みも遅れて、それがまた時間切れで孫を残す、という悪い循環になっていた。孤児を止めて、読みの合流（便 e-coalesce）を着地させた後は、7 つの口の読み直しの全体が 0.5 秒で返る。合流で時間切れは起きにくくなったが、起きたときに孫が残る穴は残っているので、ここで塞ぐ。 止め方。子を撃つ関数（ledger の module の capture・台帳・設計の索引・席の card・裁定の書き・届けの全部がこの 1 つを通る）は、子を新しい process group に入れる（標準 library の unix の CommandExt の process_group に 0 を渡す・group の id は子の pid になる）。止めるとき（時間切れ・標準出力を取れない・子の終わりを待てない）は、先に group の全体へ KILL の signal を送り、次に子を待って片付ける。group へ送るのは、道具 kill を撃つ（引数は -KILL と -- と、負の符号をつけた group の id・道具の名は module の定数）。道具が撃てないか失敗したときは、今の止め方（子の kill）に戻る。止める所は公開の関数 stop_with（子と道具の名を受け、group へ送れたかを bool で返す）にし、capture は道具の名の定数を渡して呼ぶ。unsafe と外の crate は使わない（libc の crate は依存に足さない）。 孫は止まった後、親が居ないので、OS の側（init か subreaper）が片付ける。server は孫を待たない。 在りか（着地済み）。capture は ledger の module の公開の関数（pub fn）で、ledger の module は server の module の下の公開の module（pub mod ledger）、server の module は crate の公開の module（lib.rs の pub mod server）なので、結合の歯（tests の下の file）から tsuzuri_boundary::server::ledger::capture と stop_with で届く（server/mod.rs と lib.rs は触らない）。 測り方。歯は新しい歯の file（server_reap.rs）に置き、名を server_reap_ で始める。done (3) と (4) は capture を、(5) は stop_with を撃つ（(5) の子は、歯の中で新しい process group に入れて撃つ sh の sleep 30）。歯は temp の置き場に一意の名の dir を作り、sh の script を書いて撃つ。孫が生きているかは、/proc の下の孫の pid の stat を読み、無いか、状態の字（3 つ目の欄）が Z なら止まったと見る。待つのは 50 ミリ秒ずつで、2 秒まで。 依存は足さない。"

