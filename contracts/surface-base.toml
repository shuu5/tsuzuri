goal = "持ち主が画面で問いに答えられるようにする。問いの一覧を配る口と、1 問の答えを受ける口を足す。束の承認と方針の欄と取り消しは後の便が足す。 問いの bead の本文の形を決める。席は問いを置くとき、本文の行頭に定型の字を書く。「概要 = 」の行は非エンジニア向けの概要、「技術 = 」の行はエンジニア向けの概要、「理由 = 」の行は理由、「推奨 = 」の行は推奨。1 つの定型は 1 行で、同じ定型が 2 行在れば最初の行を取る。定型の無い欄は無しにする。A-1 の印は、label のどれかが「A-1」で始まること。名指した節点は bead の metadata の touches の欄。 問いの一覧の関数は中核の crate に置く（新しい module question）。入力は台帳の一覧の字（bd の読み取りの口が返す JSON）。open の問い（label intake:question を持ち、状態が closed でも tombstone でもない bead）を、作られた時刻の古い順（同じなら id の順）に、契約の型の QuestionCard にして返す。要約値は契約の型の関数で付ける。字が読めなければ「まだ分からない」。関数は file も子 process も触らない。 口は 2 つ足す。GET /api/questions は問いの一覧（QuestionList）。POST /api/ruling は裁定の受付で、本文は契約の型の RulingRequest（問いの id・見た版の要約値・逐語）、応答は RulingResponse（記帳 id・記帳時刻）か断りの応答。 受付の順。(1) 逐語が空白だけなら断る（400・EmptyVerbatim）。(2) 台帳を bd の読み取りの口で読み直し（持ち回しの値を使わない）、id が無いか open の問いでなければ断る（404・UnknownQuestion）。台帳が読めなければ 503。(3) 今の版の要約値が要求の値と違えば断る（409・StaleVersion）。(4) id を発行する。形は「<問いの id>:<分>-<数>」で、分は今の時刻の UTC の「年月日 T 時分 Z」（例 20260927T1034Z）、数は 1 から始め、問いの notes に同じ id の定型行が在れば 1 つずつ増やす。契約の型の RulingId の for_question を使う。(5) 書く。1 回目は notes の末尾に 1 行を足す。行は「裁定 id = <id>・問い = <問いの id>・逐語 = <字>」。逐語の逆斜線は逆斜線 2 つに、改行は逆斜線と n の 2 字に写し、1 行にする。2 回目は問いを閉じる（理由は「裁定 <id>」）。書きは契約の型の LedgerWrite の argv の関数から組み、program は引数 --bdw（省いたら契約の型の定数 BDW）で、cwd は repo。1 回目が落ちたら 2 回目を撃たずに 502 を返す。2 回目が落ちたら 502 を返し、応答の字に発行した id を入れる。(6) 配達する。引数 --seat <target> と --state-dir の両方が在るときだけ、器の配達の口を撃つ。argv は「<program> seat deliver --state-dir <dir> --target <target> --ruling <id>」で、program は引数 --scribe2（省いたら scribe2）。配達が落ちても応答は 200 のままで、落ちたことを標準 error に 1 行書く。(7) 200 と RulingResponse を返す。 守り。POST を受ける口は /api/ruling だけ。ほかの口への GET でない要求は 405 のまま。本文は 65536 byte まで（超えたら 413）。Origin の頭が在って、その host と port が Host の頭と違えば 403。断りと 4xx と 5xx の応答では、(5) の書きの前なら何も書いていない。server 自身は repo の dir と state dir の file を書かない（台帳に書くのは bdw・席へ送るのは器の CLI）。 台帳の変化は bdw の書きで変化の印が動くので、着地済みの知らせ（ledger-changed）がそのまま画面に届く。この便は知らせの code を触らない。 在りか（着地済み）。要求と応答と断りの型（RulingRequest・RulingResponse・Refusal と http_status・RulingId）は契約の型の crate の面の module（src/surface.rs）、台帳への書きの型と argv の関数（LedgerWrite・BDW）は台帳の module（src/ledger.rs）。server の口の振り分けと起動の引数の型は crates/tsuzuri-boundary/src/server/mod.rs、要求の読みと応答の型は http.rs、bd の子 process の読みは ledger.rs、tz の引数の読みは crates/tsuzuri-boundary/src/main.rs。QuestionCard と QuestionList と要約値の関数は便 b-cards が足し、--state-dir の引数は便 e-read が足すので、この便は 2 つの着地の後に起こす。 歯は偽の program を使う。偽の bd は fixture を標準出力へ出す script、偽の bdw と偽の器は受けた argv を一時の file に 1 行ずつ書く script。fixture の question-2.json は bd の一覧の形で、open の問い 2 本（1 本は定型行を 4 つ持ち、1 本は持たない）と closed の問い 1 本。起動の引数の型に欄を足すので、着地済みの歯の file の引数の組み立ても直す（歯の中身は変えない）。 依存は足さない。"

