goal = "地図のグラフの面と近傍の図が読む値を、中核の crate の純粋な関数と、契約の型の crate の電文の型として置く。選ぶ・畳む・数える・段を決めるのは中核の関数で、画面は値を写して座標を決めるだけにする。見本は docs/design/mock3/ui.js の upOf と around、docs/design/mock3/map.html の graphModel。server の口と画面は後の便が足す。 辺の向き。辺の 2 つの端のうち、どちらが根拠の側かを返す関数 basis_end を、契約の型の crate の graph の module に置く。引数は辺の型・from の節点の種類・to の節点の種類。返りは端の型 EdgeEnd（閉じた 2 値・字は from と to）。決め方は 3 つで、上から順に当てる。1 つ目、型が in-article・article・relations.articles・relations.reqs・relations.rules・relations.sections の 6 つのどれかで、from の種類が条で to の種類が条でないなら from。2 つ目、型が verify.ac か amended_by なら from。3 つ目、それ以外は to。対の型（in-article の両向き・article と relations.rules・verify.ac と verifies・amended_by と amends）は、どちらの向きの辺でも同じ節点が根拠の側になる。例は 6 本。basis の FR1 から P-1 は to。in-article の P-1 から P-1.1 は from。in-article の P-1.1 から P-1 は to。verify.ac の FR1 から AC1 は from。verifies の AC1 から FR1 は to。parent-child の e.1 から e は to。見本の upOf と違うのは 2 つ目の決め方で、見本は対の型の 2 本が互いを根拠にして 2 節点の輪になるので、対の向きを揃えた。 id の自然な順。id を数字の並びとそれ以外の字の並びに分け、数字の並びは数として、それ以外は字の順で比べる関数 natural_cmp を同じ module に置く（返りは標準 library の Ordering）。例は、R-2 は R-10 より前、t3-hub.9 は t3-hub.10 より前。 次数。節点の次数は、辺でつながる隣の節点の数。同じ隣は辺が何本でも 1 と数え、自分へ戻る辺と、端の節点が無い辺は数えない。 例のグラフ（歯の中で中核の Graph の値を直に組む・fixture の file は足さない）。節点は 13 個で、条の P-1、規範文の P-1.1 と P-1.2、規則行の R-1、要件の FR1、受入基準の AC1、登場人物の ACT1、判断の記録の ADR-1、epic の e、task の e.1、question の e.2、ruling の e.2:20260927T0000Z-1、走行の e.1-20260927T000000Z。辺は 16 本で、in-article が P-1 から P-1.1・P-1.1 から P-1・P-1 から P-1.2・P-1.2 から P-1 の 4 本、article が R-1 から P-1、relations.rules が P-1 から R-1、basis が FR1 から P-1 と ADR-1 から P-1、verify.ac が FR1 から AC1、verifies が AC1 から FR1、adrs が FR1 から ADR-1、parent-child が e.1 から e と e.2 から e、answers が ruling から e.2、run_of が走行から e.1、touches が e.2 から FR1。 グラフの眺め（中核の crate の graph の module に新しい file の view を足す）。関数 view の引数はグラフ、返りは電文の型 GraphView。 畳み先。節点ごとに畳み先を決める。規範文は、id の末尾の点と数字を取った id の条が在れば、その条。question は、自分から出る parent-child の辺の先の節点が在れば、その節点。ruling は、自分から出る answers の辺の先の節点の畳み先。それ以外と、先が無いものは自分。畳み先が自分でない節点の数を、畳み先ごとに子の数として数える。 辺のまとめ。端の節点が両方在る辺を 1 本ずつ見て、根拠の側の端の畳み先を U、もう片方の端の畳み先を D とする。U と D が同じなら捨てる。D と U と型が同じ辺は 1 本にまとめ、本数を数える。まとめる前の辺 1 本ごとに、U と D の眺めの次数を 1 ずつ足す。 出す節点。眺めの次数が 1 以上の節点が候補。候補が 40 を超えたら、子を持つ節点を先に、次に眺めの次数の大きい順、同じなら id の自然な順に並べ、先頭の 40 個を出す。辺は両端が出す節点のものだけ残す。40 は見本の値で、規則の行にはまだ無いので module の定数に置く。 段。まとめた辺を D から U へたどる最も長い道の辺の数が、節点の段（出る辺の無い節点は 0）。節点は id の自然な順に訪ね、節点から出る辺はまとめた辺の並びの順に見る。たどっている途中の節点へ戻ったら、その節点の段を 0 として数え、先へはたどらない（輪で止まらない）。一度決めた段は決め直さない。輪の例は 2 節点で、条の A-1 と A-2 が relations.articles の辺で互いを指す。まとめた辺は 2 本。A-1 から訪ねると、A-2 は戻り先の A-1 を 0 と数えて段 1、A-1 は段 2。 GraphView の欄は、nodes（出す節点の列・並びは節点の種類の順、同じなら id の自然な順）・edges（まとめた辺の列・並びは from の id の自然な順、to の id の自然な順、辺の型の順）・shown（出す節点の数）・folded（畳まれた節点のうち、畳み先が出す節点に入っているものの数）・cut（上限で切った候補の数に、畳み先が自分で眺めの次数が 0 の節点の数を足した数）・total（グラフの節点の数）・unread（読めなかった出所の列・着地済みの型 GraphSource）。節点 ViewNode の欄は、node（着地済みの型 GraphNode）・status（bead は属性の状態の字、走行は属性の段の字、ほかは無し）・rank（段）・kids（子の数）・degree（次数）。辺 ViewEdge の欄は、from（D の id）・to（U の id）・type（辺の型）・count（本数）。節点の種類の順と辺の型の順は、契約の型の NodeKind と EdgeType の ALL の定数の順。 例のグラフの眺めの期待。出す節点は 8 個で、id と段と子の数と次数は、P-1 が 0 と 2 と 5、R-1 が 1 と 0 と 1、FR1 が 2 と 0 と 4、AC1 が 3 と 0 と 1、ADR-1 が 1 と 0 と 2、e が 3 と 2 と 2、e.1 が 4 と 0 と 2、走行が 5 と 0 と 1（並びはこの順）。まとめた辺は 10 本で、並びは、AC1 から FR1 の verify.ac、AC1 から FR1 の verifies、ADR-1 から P-1 の basis、FR1 から ADR-1 の adrs、FR1 から P-1 の basis、R-1 から P-1 の relations.rules、R-1 から P-1 の article、e から FR1 の touches、e.1 から e の parent-child、走行から e.1 の run_of で、本数はどれも 1。shown は 8、folded は 4（P-1.1・P-1.2・e.2・ruling）、cut は 1（ACT1）、total は 13。 近傍（中核の crate の graph の module の around・今の関数を置き換える）。引数は、グラフ・中心の節点の id・段数・畳み。返りは電文の型 AroundDoc で、中心の節点が無いときと、段数が 1 から 3 の外のときは無し。畳みの型 Fold は閉じた 4 値で、字は none・up・down・both（up は根拠の側を畳む・down は影響の側を畳む）。既定の段数は 2（規則の行 R-20 の各 2 段・今の定数 AROUND_STEPS）で、1 から 3 の幅は見本の値。 たどり方。根拠の側を先に、次に影響の側をたどる。1 つの側は中心から始めて、段数の回だけ広げる。広げる節点につながる辺（端の節点が両方在る辺だけ）を、型の字、from の id、to の id の順に字で比べて並べ、その順に見る。辺の向こうの端の節点が、まだ着いていない節点で、根拠の側をたどるときは辺の根拠の側の端、影響の側をたどるときは根拠の側でない端なら、その節点に着く。着いた節点は、列（根拠の側は段の数の負・影響の側は正）と、1 つ前の節点と、辺の型を持つ。着いた印は 2 つの側で共有する（根拠の側で着いた節点に、影響の側でもう一度は着かない）。中心でない節点の次数が 30 を超えたら hub で、そこから先は広げず、hub の一覧に足す（規則の行 R-20 の値・今の定数 HUB_DEGREE）。中心は次数が 30 を超えても広げる。畳んだ側はたどらない。 出す行の選び方。列を -1・1・-2・2・-3・3 の順に見て、列の中は節点の種類の順、同じなら id の自然な順に並べる。列の中の 10 個目までで、出す行の合計が 40 に満たず、1 段目であるか、1 つ前の節点が出す行に入っているなら、出す行に入れる。入らなかった節点の数が、上限で切った数。出す行の並びは、列の小さい順、種類の順、id の自然な順（中心は列 0）。10 と 40 は見本の値で、module の定数に置く。 AroundDoc の欄は、center（中心の id）・steps（段数）・fold（畳み）・rows（出す行の列）・basis（畳みなしでたどったときの、出す行のうち列が負の数）・impact（同じく列が正の数）・shown（出す行の数・中心を含む）・total（着いた節点の数に、中心の 1 と、hub で隠れた数を足した数）・cut_hub（hub で隠れた数・hub ごとの次数から 1 を引いた数の合計）・cut_cap（上限で切った数）・hubs（hub の列・見つけた順・型 HubCut の欄は id と degree）・unread（読めなかった出所の列）。行 AroundRow の欄は、node（GraphNode）・status（眺めと同じ決め方）・col（列・-3 から 3）・via（1 つ前の節点の id・中心は無し）・type（着いた辺の型・中心は無し）・degree（次数）。 例のグラフの近傍の期待（中心 FR1・段数 2）。畳みが none のとき、出す行は 6 つで、P-1（列 -1・FR1 から・basis）、ADR-1（列 -1・FR1 から・adrs）、FR1（列 0）、AC1（列 1・FR1 から・verifies）、e.2（列 1・FR1 から・touches）、ruling（列 2・e.2 から・answers）。shown は 6、total は 6。up のとき、出す行は FR1・AC1・e.2・ruling の 4 つで、shown と total は 4。down のとき、出す行は P-1・ADR-1・FR1 の 3 つで、shown と total は 3。both のとき、出す行は FR1 の 1 つで、shown と total は 1。basis は 2、impact は 3 で、畳みの 4 値のどれでも同じ。段数 1 のときは、出す行が P-1・ADR-1・FR1・AC1・e.2 の 5 つで、impact は 2。 在りか（着地済み）。節点の種類の型 NodeKind と辺の型 EdgeType と節点と辺の型と、出所の型 GraphSource と、導出グラフの電文 GraphDoc は、契約の型の crate の graph の module（crates/tsuzuri-contract/src/graph.rs・便 b と便 e-read の着地 fb8053f）。型の外形を pin する歯は crates/tsuzuri-contract/tests/contract_form.rs と、その snapshot の file。中核の crate のグラフの型 Graph（欄は nodes・edges・unread・skipped・beads・runs）と出所の型 Source（3 値・字は契約の型の GraphSource と同じ）は crates/tsuzuri-core/src/graph/mod.rs、今の近傍は同じ dir の around.rs（便 c の着地 58a3ea6）。今の近傍の関数と型（Around・Reached・Cut・CutReason）を使っているのは、中核の crate の歯の file（crates/tsuzuri-core/tests/graph.rs）の 2 本の歯と、定数を規則の行と照らす 1 本の歯だけで、境界の crate と画面は使っていない。この 3 本は新しい歯の file（gview.rs）へ新しい期待で移し、graph.rs からは消す。graph.rs のほかの歯は変えない。今の型（Around・Reached・Cut・CutReason）は電文の型に置き換えて消す。中核の Source から契約の型の GraphSource への写しは、境界の crate の板の module に在る（この便は触らない）。中核の関数が電文の unread を埋めるための写しは、中核の graph の module に小さな関数として足す。fixture の hub-619.json は便 c の着地済みの file（tests/fixtures/graph の下・子を 619 本持つ epic の h と、子 h.1 の走行を 1 つ持つ）で、この便は読むだけ。 契約の型の crate の入口の file（crates/tsuzuri-contract/src/lib.rs）は、歯の語 contract_form_ の字を comment に持つので write-set に入れるが、中身は変えない（新しい型は今の graph の module に足すので、module の宣言は増えない）。歯の語は gview_ にする（今の歯の語 graph_ は、境界の crate の file にも字が在るので使わない）。新しい歯は全部、新しい歯の file に置き、名を gview_ で始める。 依存は足さない。中核の crate は契約の型の crate と serde と serde_json に依存している（Cargo.toml は触らない）。"

[[contract]]
id = "e-view"
title = "眺めの口（地図のグラフの眺め・近傍・未反映の一覧を配る 3 つの GET の口と、未反映の一覧の電文の型）"
req = ["FR2", "FR5", "FR13", "NFR2"]
section = "16"
write-set = ["crates/tsuzuri-contract/src/lib.rs", "crates/tsuzuri-contract/src/stats.rs", "crates/tsuzuri-contract/tests/contract_form.rs", "crates/tsuzuri-contract/tests/snapshots/contract_form.json", "crates/tsuzuri-boundary/src/server/mod.rs", "crates/tsuzuri-boundary/src/server/http.rs", "crates/tsuzuri-boundary/src/server/board.rs", "+crates/tsuzuri-boundary/tests/server_view.rs"]
verify = ["cargo nextest run -p tsuzuri-boundary --no-tests=fail server_view_", "cargo nextest run -p tsuzuri-contract --no-tests=fail contract_form_", "cargo run -q -p xtask -- check"]
size = "M"
done = "(1) GET /api/graph/view は 200 と JSON を返し、本文の字が、同じ 3 つの字から中核の関数（組む関数の値を眺めの関数に渡した値）を電文にした字と 1 字も違わない (2) GET /api/around?id=R-25 は 200 で、本文の字が、中核の近傍の関数を中心 R-25・段数 2・畳みなしで呼んだ値を電文にした字と 1 字も違わず、GET /api/around?id=R-25&k=1&fold=up は段数 1・根拠の側を畳む値と 1 字も違わない (3) query の値は %XX と + を戻してから読み、GET /api/around?id=R%2D25 の本文は id=R-25 の本文と同じ (4) 近傍の口の断りは 4 つで、id が無いか空は 400 と no-id、k が 0・4・数でない字は 400 と steps、fold が知らない字は 400 と fold、節点の無い id は 404 と no-node (5) GET /api/unreflected は 200 で、memos は読めた列で、行の id と題の並びが中核の未反映の関数の memo の並びと一致し、年齢は要求の前後のどれかの時刻で中核の値と一致し、rulings と requests は「まだ分からない」 (6) 偽の bd が落ちる置き場では、未反映の一覧の 3 つとも「まだ分からない」になり、眺めの unread が ledger を持つ (7) 3 つの口に GET でない要求を撃つと 405 で、3 つの口を読んだ前後で repo の dir と state dir の全 file の byte が変わらない (8) 未反映の一覧の電文の型（UnreflectedList と UnreflectedRow）の外形が snapshot の file に pin される (9) 着地済みの口の歯（server_min_・server_src_・server_read_・server_ask_・server_seat_）が全部通り、足す外の依存は 0 本"
depends = ["e-seat", "c-view"]
goal = "画面の地図のグラフの面と、節点の近傍の図と、未反映の一覧が読む 3 つの口を server に足す。値を決めるのは中核の関数で（便 c-view の着地 41b138a と便 d の着地 715840c）、server は 3 つの字を集めて関数に渡し、値を電文にして返すだけにする。server は何も書かない。 口は 3 つ。どれも GET で、200 のときの本文は電文の object そのもの（読めたかの包みは付けない）。 1 つ目は GET /api/graph/view。設計の索引と台帳と event log の 3 つの字を集め（板の module の gather に設計と event log の両方を頼む）、中核の組む関数（graph の module の build）の値を眺めの関数（同じ module の view・便 c-view）に渡し、返りの GraphView を電文にして返す。読めなかった出所は電文の unread に入る（断らない）。 2 つ目は GET /api/around。query は 3 つで、id（中心の節点の id・必ず要る）・k（段数・1 か 2 か 3・省いたら 2）・fold（畳み・none か up か down か both・省いたら none）。同じ 3 つの字から組んだグラフと、中心と段数と畳みを、中核の近傍の関数（graph の module の around・引数はグラフ・中心の id・段数・畳み・返りは無いことが在る AroundDoc）に渡す。返りが在れば 200 と電文。断りは本文が 1 語の text で、id が無いか空なら 400 と no-id、k が 1 から 3 の整数でなければ 400 と steps、fold が 4 つの字のどれでもなければ 400 と fold、関数の返りが無ければ（節点が無い）404 と no-node。query を読む順は id・k・fold で、最初に当たった断りを返す。 3 つ目は GET /api/unreflected。台帳の字だけを集め（設計と event log は頼まない）、中核の未反映の関数（ledger の module の unreflected・引数は台帳の字と今の時刻・返りは種類ごとに、読めた一覧か「まだ分からない」）の値を、新しい電文の型に写して返す。 未反映の一覧の電文の型は、契約の型の crate の stats の module に足す。UnreflectedRow の欄は、id（bead の id の字）・title（題）・age_s（年齢の秒・作った時刻が読めなければ無し）。UnreflectedList の欄は、memos・rulings・requests の 3 つで、どれも、読めた UnreflectedRow の列か「まだ分からない」（着地済みの型 Reading）。中核の型（Unreflected と UnreflectedItem）は変えず、写しは境界の crate の板の module に置く（導出グラフの電文と同じ形）。今の中核の関数は、memo は open の memo の全部を年齢の古い順に返し、裁定と要望はつねに「まだ分からない」を返す（材料が入力にまだ無い）。 query の読み。要求の型（境界の crate の server の http の module の Request）に、query の 1 つの値を返す関数を足す（引数は鍵・返りは、値の %XX と + を戻した字か、無し）。今の関数 path は変えない。口を選ぶ関数（server の入口の module の route）は今は path だけを受けているので、query を読めるよう、要求を受ける形に直す（呼び手は同じ module の handle の 1 か所）。 在りか（着地済み）。GraphView・AroundDoc・Fold は契約の型の crate の graph の module。中核の関数は crates/tsuzuri-core/src/graph の下の view.rs と around.rs。未反映は crates/tsuzuri-core/src/ledger/unreflected.rs。3 つの字を集める関数と、中核の値を電文に写す関数は境界の crate の板の module（crates/tsuzuri-boundary/src/server/board.rs）。電文の字は契約の型の crate の wire の encode が作る（境界の crate は serde に直接依存しない）。今の時刻は events の module の now。契約の型の crate の入口の file（lib.rs）は、歯の語 contract_form_ の字を持つので write-set に入れるが、中身は変えない。境界の crate は契約の型の crate と中核の crate に依存している（Cargo.toml は触らない）。 歯は新しい file（server_view.rs）に置き、名を server_view_ で始める。歯の支度（一時の置き場・偽の bd と偽の設計の道具・server を起こして GET を撃つ関数）は、着地済みの歯の file（crates/tsuzuri-boundary/tests/server_read.rs・この便の write-set の外）と同じ形を新しい file に持つ。入力は着地済みの見本（tests/fixtures/graph/real の索引と event log・tests/fixtures/ledger の bd-list-8.json）を使い、fixture の file は足さない。値を比べる歯は、口の本文の字と、中核の値を電文にした字を比べる（小数や時刻を読み直して比べない）。時刻に依る値（年齢）は、要求の前後のどれかの秒で一致すれば通す。 依存は足さない。"

[[contract]]
id = "e-coalesce"
title = "読みの合流（同じ時に届いた要求は、台帳の読みと設計の索引の読みを 1 本の子 process で分け合う）"
