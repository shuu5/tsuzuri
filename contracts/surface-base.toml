goal = "設計の索引と台帳と走行を 1 つのグラフに毎回組み直す純粋な関数を中核の crate に置く。不変条件を 3 値（合格・違反・まだ分からない）で数え、近傍を返す。 入力は 3 つの字で、関数は file も子 process も触らない。設計の索引（設計の道具の graph の口が出す節点と辺の表・タブ区切り）・台帳の一覧（bd の読み取りの口が返す JSON）・器の event log（1 行 1 件の JSON）。読めない入力はその種類の節点だけ「まだ分からない」にして、ほかの種類は組む。設計文書の YAML は読まない（YAML の読み手の依存を足さない）。 節点。設計の索引の節点は表の行をそのまま写す（種類は 条・規範文・規則行・目的・要件・非機能要件・受入基準・制約・登場人物・出力・判断の記録 の 11）。bead の種類はこの順に決めて、どの bead も 1 つに当たる。bd の種類が epic なら epic、label intake:memo を持てば memo、label intake:question を持てば問い、それ以外は契約。走行は event log の RunCreated の 1 件が 1 つ。裁定と受けと方針は、bead の notes の定型行 1 行から 1 つずつ導く。定型行は行頭の字で見分け、「裁定 id = 」は裁定、「受け id = 」は受け、「方針 id = 」は方針で、id はその字の後から最初の「・」までの字。設計ノートの行はこの便では節点にしない。 辺。設計の索引の辺は表の行を写す。型は 3 列目の字で、閉じた一覧の 17 型（in-article・relations.articles・relations.reqs・relations.rules・relations.sections・amended_by・article・refs・basis・goals・rules・adrs・verify.ac・verifies・figures・produced・amends）の内側だけを組み、一覧に無い字の行は組まずに数える。台帳の辺は bead の dependencies の欄から組み、型は parent-child・blocks・relates-to・discovered-from の 4 つで、ほかの型は組まずに数える。answers は裁定から、その定型行を持つ問いの bead へ。touches は問いの bead の metadata の touches の欄の id へ。premises は問いの metadata の premises の欄の方針へ。source は memo の metadata の source の欄の裁定か走行へ。run_of は走行から、run の id の前半（時刻の前の字）の bead へ。raised は走行から、event の QuestionRaised が名指す問いへ。口座は節点にせず、走行の属性に持つ。design と ruled_by の辺は、先の節点（設計ノートの行と承認欄）がこの便に無いので組まない。契約の pointer の行（acceptance の中の「design = 」で始まる行）は契約の属性に持つ。 不変条件のうち、この便で数えるのは 9 本。g-1 組んだ辺の両端の節点が実在する。g-2 open の契約は pointer の行をちょうど 1 つ持つ（closed の契約は数えない）。g-4 open の問いは metadata の touches の欄に id を 1 つ以上持つ。g-5 根（親を持たない epic）でない bead は、parent-child をたどって根に着く。g-6 blocks に輪が無く、parent-child は木。g-8 memo の label と pointer の行の両方を持つ bead が無い。g-10 設計の索引と台帳と走行の id が互いに重ならない。g-11 走行は run_of の先の bead を持つ。g-12 段が Questioned の走行は raised の辺を持つ（この決め方は行 c-g12 で、その走行の中に答えの無い QuestionRaised を持つ、に改めた）。残りの 3 本（g-3 発効した記録は裁定の行を持つ・g-7 宙に浮いた裁定 0・g-9 名指した id は欄にも在る）は、材料が 3 つの入力に無いので、つねに「まだ分からない」を返す。 近傍は、1 つの節点から根拠の側（辺を逆にたどる）と影響の側（辺を順にたどる）を各 2 段たどって返す。次数が 30 を超える節点は hub で、hub から先は広げず、切った理由と hub の次数を返す（規則の行 R-20 の値）。 この便の近傍は辺の from から to へたどる側を影響の側と呼んでいて、根拠と影響が逆だった。向きと段数と畳みと出す行の選び方は便 c-view（15 節）が直す。 fixture。実物の入力の見本（tests/fixtures/graph/real の索引と event log、tests/fixtures/ledger の bd-list-8.json）は設計席が置いた。この便が作るのは 5 つ。violations.json は数える 9 本のそれぞれについて入力の組を 1 つ持ち、組ごとに、違反になるはずの条件の一覧を欄に持つ（1 つの欠陥が 2 本に当たる組は 2 本を書く）。hub-619.json は子を 619 本持つ epic を 1 つ含む。runs-5.json は同じ bead の走行を 5 つ含む。no-state.json は event log の字が空の入力。unruled.json は定型行の無い閉じた問いを 1 つ含む。 依存は serde_json を中核の crate に足す（workspace には便 b で入っている）。入力を読んで口に出す側（子 process と server の口と tz graph の口）は境界の crate の後の便が持つ。"

[[contract]]
id = "d"
title = "台帳の指標と未反映の一覧と次の一手と pipeline の板（純粋な関数と電文の型・閾値は規則の行の字と照らす）"
req = ["FR10", "FR11", "FR13", "NFR2"]
section = "5"
write-set = ["crates/tsuzuri-contract/src/lib.rs", "+crates/tsuzuri-contract/src/stats.rs", "crates/tsuzuri-contract/tests/contract_form.rs", "crates/tsuzuri-contract/tests/snapshots/contract_form.json", "crates/tsuzuri-core/src/lib.rs", "crates/tsuzuri-core/src/graph/mod.rs", "crates/tsuzuri-core/src/graph/build.rs", "+crates/tsuzuri-core/src/ledger/mod.rs", "+crates/tsuzuri-core/src/ledger/stats.rs", "+crates/tsuzuri-core/src/ledger/unreflected.rs", "+crates/tsuzuri-core/src/next_step.rs", "+crates/tsuzuri-core/src/pipeline.rs", "+crates/tsuzuri-core/tests/stats.rs", "+tests/fixtures/ledger/judge.json", "+tests/fixtures/ledger/stats-30.json", "+tests/fixtures/pipeline/pipeline.json", "+tests/fixtures/pipeline/next.json"]
verify = ["cargo nextest run -p tsuzuri-core --no-tests=fail stats_", "cargo nextest run -p tsuzuri-contract --no-tests=fail contract_form_"]
size = "M"
done = "(1) 判定の 5 値が judge.json の 7 組の期待と一致する (2) 指標の値が stats-30.json の期待と一致し、電文に作業中の数と最古の task の欄が無い (3) 閾値の定数（0.5・0・0.1・7 日）から組んだ字が rules の file の行 R-18 の value の字の全体と一致し、定数を 1 つ変えると歯が落ちる (4) 未反映の memo は年齢の古い順で、裁定と要望は 0 件でなく「まだ分からない」を返す (5) 次の一手は 7 種の宣言の順から組んだ字が規則の行 R-24 の value の順の字の全体と一致し、next.json の 4 組で 7 種それぞれの結果（3 値）と件数と対象の id と、大きく出す 1 つが期待と一致する (6) pipeline.json の対応の表の 1 行ごとの走行で札の段と回数と口座が期待と一致し、表に無い段の走行は札にならず数えられ、event log が読めない入力では札が「まだ分からない」になる (7) 足した 2 つの電文の型の外形が snapshot の file に pin される (8) 足す外の依存は 0 本"
depends = ["c"]
goal = "台帳の指標と未反映の一覧と次の一手と pipeline の板を、中核の crate の純粋な関数に置く。入力は便 c と同じ字（台帳の一覧の JSON・器の event log）と今の時刻（引数）で、関数は file も子 process も時計も触らない。字を読んで口に出す側（server の口）は境界の crate の後の便が持つ。 電文の型は契約の型の crate に足す。足すのは 2 つ（台帳の指標 LedgerStats・次の一手 NextStep）で、pipeline の板は着地済みの型（PipelineBoard と PipelineCard）を使う。足した型は便 b の snapshot の歯で pin する。 数え方は見本の集計（docs/design/mock3/ledger.js の stats と judge）と同じにする。bead の種類は便 c と同じ順で決める（epic・memo・問い・契約）。指標が数える task は契約の bead。 台帳の指標。open は status が closed でも tombstone でもない bead。blocked は open の task のうち、status が blocked のものと、status が in_progress でなく blocks の先に open の bead を持つもの。ready は status が open で blocks の先が全部閉じている task。時点 t の open の数は、created_at が t 以前で、closed_at が無いか t より後の task の数。純減 24h は今の open の数から 24 時間前の数を引いた値で、純減 7d は 7 日前の数を引いた値。closed/日 は直近 7 日に閉じた task の数を 7 で割った値。lead は直近 30 日に閉じた task の created_at から closed_at までの日数の中央値と p90 で、1 本も無ければ値なし。stale は updated_at が 7 日以上前の open の task。日ごとの 14 本は、その日に作られた数と閉じた数と、その日の終わりの open の数（burndown と sparkline の材料）。epic の進みは直下の task の閉じた数と全体の数で、直下の task が 0 本の epic は出さない。memo は open の数・昇格待ちの数（description に「昇格条件」の見出しの行を持つ open の memo）・直近 7 日に閉じた数・open の memo の年齢の中央値。種類ごとの open の数（task・memo・問い・epic）も持つ。作業中の数と最古の task は電文に持たない。 判定は規則の行 R-18 の順に当てて最初の 1 つ。open の task が 1 本以上で stale の数が open の task の 0.5 倍を超えれば滞り。でなく純減 7d が 0 を超えれば積み増し。でなく closed/日 が 0.1 未満なら停滞。どれでもなければ順調。台帳の字が読めなければ台帳なし。閾値の定数（0.5・0・0.1・7 日）は 1 か所に置き、歯が rules の file（design-intent/rules.yaml）の行 R-18 の字と照らす（読むだけ・YAML の読み手は足さず、行の字を探す）。 未反映の一覧は 3 種（memo・裁定・要望）を、種類ごとに「読めた一覧」か「まだ分からない」で持つ。memo は open の memo の全部（昇格先を指す辺がまだ無いので、open なら未反映）で、年齢の古い順。裁定（処分の宣言の無い裁定）と要望（反映されていない要望）は、材料（処分の宣言・要望の印）が入力にまだ無いので「まだ分からない」を返す。0 件とは区別する。指標の電文の未反映の数は memo の数で、分からない 2 種の名を欄に持つ。 次の一手は、閉じた 7 種を規則の行 R-24 の順に判じる。電文は 7 種の 1 つずつについて、判じた結果（当たった・当たらない・判じなかった の 3 値）と件数と対象の id を順に持ち、最初に当たった 1 つを「大きく出す 1 つ」として名指す（見本の画面は 1 つを大きく出し、残りを当たった・当たらないの印つきの一覧で出す）。この便の入力で判じられるのは 3 種。止まっている走行は、板の段が Questioned か Failed か Stopped の札で、その bead が open のもの（対象はいちばん古い札の bead）。質問は open の問い（対象は created_at がいちばん古い 1 本）。なしは、どれにも当たらないとき。残りの 4 種（限度と移動・応答なし・束の承認・発効待ち）は材料（席と口座の状態・束・発効待ちの記録）が入力に無いので、結果を「判じなかった」にする（後の便が材料と一緒に足す）。event log の字が読めなければ、止まっている走行も「判じなかった」にする。台帳の字が読めなければ、質問も「判じなかった」にする。なしは、判じた種類のどれも当たらないときに当たる。 pipeline の板。札は bead ごとに 1 枚で、その bead の走行のうち RunCreated がいちばん新しい 1 つの、最後の event で段を決める。走行の回数は同じ bead の RunCreated の数。口座は、その走行の event の detail の「account:」の後の字のうち最後のもの。経過は今の時刻から最後の event の時刻を引いた秒。器の event から板の段への対応は閉じた表で持つ。RunDone は Landed。RunStage の Reviewed と Gated で detail が「verdict:FAIL」か「verdict:INCONCLUSIVE」で始まれば Failed（段の理由は detail の字）。RunStage の Gated でそれ以外は Gated。RunCreated と、RunStage の Reviewed（verdict が PASS）・Spawned・Implemented は Running。最後の event が QuestionRaised なら Questioned。走行を 1 つも持たない open の契約は、blocks の先に open の bead が在れば Blocked、無ければ Queued。Stopped はこの便の入力に材料が無いので作らない。表に無い段の名の走行は札を作らず、数だけを返す。event log の字が読めなければ、板の札は「まだ分からない」。 fixture はこの便が作る。judge.json は見本の自己検査と同じ 7 組（滞り・積み増し・停滞・closed/日 がちょうど 0.1 なら順調・順調・台帳なし・open の task が 0 本なら滞りにしない）。stats-30.json は bead 30 本の台帳の一覧と今の時刻と、期待の指標の値。pipeline.json は対応の表の 1 行ごとに走行を 1 つ持つ event log と、期待の札。next.json は 3 種と event log が読めない組の 4 組。 依存は足さない。中核の crate は便 c の着地で契約の型の crate と serde と serde_json に依存している（crates/tsuzuri-core/Cargo.toml の dependencies の 3 行）ので、Cargo.toml も Cargo.lock も触らない。 歯が照らす規則の行の字（design-intent/rules.yaml・着地済み）。行 R-18 の value は「滞り = stale が open の task の 0.5 超・積み増し = 純減 7d が 0 超・停滞 = closed/日 が 0.1 未満・順に当てて最初の 1 つ・stale = 7 日 更新なし」。行 R-24 の value は「限度と移動 → 応答なし → 止まっている走行 → 束の承認 → 質問 → 発効待ち → なし の順に判じ 1 つを出す・応答なしは tick が stale のときだけ」。歯は字の在る無しでなく、字の全体を比べる。行 R-18 は、定数の 4 つの数を上の文の形に埋めて組んだ字（滞り = stale が open の task の <比> 超・積み増し = 純減 7d が <数> 超・停滞 = closed/日 が <率> 未満・順に当てて最初の 1 つ・stale = <日> 日 更新なし）が、rules の file の行 R-18 の value の字の全体と 1 字も違わないことを確かめる（定数のどれか 1 つを変えれば落ちる）。行 R-24 は、契約の型の 7 種の宣言の順に日本語の名を「 → 」でつないだ字が、行 R-24 の value の「 の順に判じ」より前の字の全体と 1 字も違わないことを確かめる（順を入れ替えれば落ちる）。"

