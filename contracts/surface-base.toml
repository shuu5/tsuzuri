goal = "便 e-min は .beads の issues.jsonl を読む形で置いたが、この file は席の台帳の書き（bdw）の後にしか作り直されない。器が便を閉じても古いままで、画面に古い状態が出る（2026-09-27 の実測・scribe2 の memo s2-07l.677）。 台帳の読みの出所を bd の読み取りの口に改める。server は子 process を 1 本撃つ。引数は --readonly list --all --limit 0 --json で、cwd は repo の置き場、標準入力は空、標準エラーは捨てる。program の名は既定が bd で、引数（--bd）で替えられる。歯は偽の bd を一時の dir に置いて回す。 起動できない・rc が 0 でない・JSON として読めない・5 秒を超えて返さない、のどれでも、0 件でなく測れていないの印を返す。5 秒は要件 NFR2 の上限（規則の行 R-21 の値）。 変化の印は .beads の issues.jsonl と interactions.jsonl の 2 つの file の更新時刻と長さで、500 ミリ秒ごとに見る。どちらかが変わったら 1.5 秒以内に読み直して SSE で知らせる。前の file は席の書きで、後の file は器の close を含む状態の変更で動く。 印の取りこぼしを拾うために、印が動かなくても 5 秒ごとに読み直す。読みの結果が前と同じなら知らせない。issues.jsonl の中身を読む経路は残さない。 台帳の一覧の型に親と label を足す。問いは label intake:question、memo は label intake:memo で見分ける（設計ノート surface の節点の一覧）。fixture（bd の出力の形の 8 本）は設計席が置いた。"
