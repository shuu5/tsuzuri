done = "(1) 実物の見本の 3 つの入力から組んだグラフで、設計の索引の節点の数が表の行の数と、bead の 4 種（epic・契約・memo・問い）の節点の数が台帳の bead の数と、走行の節点の数が RunCreated の数と一致し、設計の索引の辺は 17 型の一覧に在る型だけが組まれて、一覧に無い型の行を 1 行足した入力ではその行が組まれずに 1 と数えられる (2) violations.json の組ごとに、違反と名指される条件の一覧が組の欄の一覧と一致し、数える 9 本のどれもが少なくとも 1 つの組で違反になり、g-3 と g-7 と g-9 はどの組でも「まだ分からない」を返す (3) hub-619.json で、epic の近傍が hub を展開せず、切った理由と次数 619 を返す (4) no-state.json で走行の種類だけ「まだ分からない」になり、設計と台帳の節点は組める (5) runs-5.json で走行の節点が 5 つ、run_of の辺が 5 本 (6) unruled.json で、裁定の節点が 0 本で answers の辺が 0 本 (7) 中核の crate の直接依存は serde と serde_json と契約の型の crate だけ"
