boundary/src/main.rs に在る。契約の型の crate に、電文を字にする関数（wire の encode）・板の型（board の module の PipelineBoard）・節点と辺の型（graph の module の GraphNode と GraphEdge）・event の名の定数（surface の module の BOARD_CHANGED_EVENT と ledger の module の LEDGER_CHANGED_EVENT）が在る。中核の crate に、グラフを組む関数と不変条件を数える関数と入力の型（graph の module の build・check・Inputs）が在る。指標と次の一手と板の関数と、その電文の型（LedgerStats・NextStep）は便 d が足すので、この便は便 d の着地の後に起こす。xtask の歯の直接依存の名の一覧は xtask/src/main.rs の DIRECT_DEPS に在る。fixture の 3 つ（tests/fixtures/ledger/bd-list-8.json・tests/fixtures/graph/real/design-index.tsv・tests/fixtures/graph/real/events.jsonl）は着地済みで、この便は新しい fixture の file を作らない。 起動の引数の型に欄を足すので、着地済みの歯の file（tests/server_min.rs と tests/server_src.rs）の引数の組み立ても直す。歯の中身は変えない。 この便は面の crate と中核の crate の code を触らない。"

