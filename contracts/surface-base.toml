write-set = ["Cargo.lock", "crates/tsuzuri-core/Cargo.toml", "xtask/src/main.rs", "crates/tsuzuri-core/src/lib.rs", "+crates/tsuzuri-core/src/graph/mod.rs", "+crates/tsuzuri-core/src/graph/build.rs", "+crates/tsuzuri-core/src/graph/check.rs", "+crates/tsuzuri-core/src/graph/around.rs", "+crates/tsuzuri-core/tests/graph.rs", "+tests/fixtures/graph/hub-619.json", "+tests/fixtures/graph/unruled.json", "+tests/fixtures/graph/runs-5.json", "+tests/fixtures/graph/no-state.json", "+tests/fixtures/graph/violations.json", "tests/fixtures/graph/real/design-index.tsv", "tests/fixtures/graph/real/events.jsonl"]
verify = ["cargo nextest run -p tsuzuri-core --no-tests=fail graph_", "cargo nextest run -p xtask --no-tests=fail skeleton_"]
