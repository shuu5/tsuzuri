goal = "設計の索引と台帳と走行を 1 つのグラフに毎回組み直す純粋な関数を中核の crate に置く。不変条件を 3 値（合格・違反・まだ分からない）で数え、近傍を返す。 入力は 3 つの字で、関数は file も子 process も触らない。設計の索引（設計の道具の graph の口が出す節点と辺の表・タブ区切り）・台帳の一覧（bd の読み取りの口が返す JSON）・器の event log（1 行 1 件の JSON）。読めない入力はその種類の節点だけ「まだ分からない」にして、ほかの種類は組む。設計文書の YAML は読まない（YAML の読み手の依存を足さない）。 節点。設計の索引の節点は表の行をそのまま写す（種類は 条・規範文・規則行・目的・要件・非機能要件・受入基準・制約・登場人物・出力・判断の記録 の 11）。bead の種類はこの順に決めて、どの bead も 1 つに当たる。bd の種類が epic なら epic、label intake:memo を持てば memo、label intake:question を持てば問い、それ以外は契約。走行は event log の RunCreated の 1 件が 1 つ。裁定と受けと方針は、bead の notes の定型行 1 行から 1 つずつ導く。定型行は行頭の字で見分け、「裁定 id = 」は裁定、「受け id = 」は受け、「方針 id = 」は方針で、id はその字の後から最初の「・」までの字。設計ノートの行はこの便では節点にしない。 辺。設計の索引の辺は表の行を写す。型は 3 列目の字で、閉じた一覧の 17 型（in-article・relations.articles・relations.reqs・relations.rules・relations.sections・amended_by・article・refs・basis・goals・rules・adrs・verify.ac・verifies・figures・produced・amends）の内側だけを組み、一覧に無い字の行は組まずに数える。台帳の辺は bead の dependencies の欄から組み、型は parent-child・blocks・relates-to・discovered-from の 4 つで、ほかの型は組まずに数える。answers は裁定から、その定型行を持つ問いの bead へ。touches は問いの bead の metadata の touches の欄の id へ。premises は問いの metadata の premises の欄の方針へ。source は memo の metadata の source の欄の裁定か走行へ。run_of は走行から、run の id の前半（時刻の前の字）の bead へ。raised は走行から、event の QuestionRaised が名指す問いへ。口座は節点にせず、走行の属性に持つ。design と ruled_by の辺は、先の節点（設計ノートの行と承認欄）がこの便に無いので組まない。契約の pointer の行（acceptance の中の「design = 」で始まる行）は契約の属性に持つ。 不変条件のうち、この便で数えるのは 9 本。g-1 組んだ辺の両端の節点が実在する。g-2 open の契約は pointer の行をちょうど 1 つ持つ（closed の契約は数えない）。g-4 open の問いは metadata の touches の欄に id を 1 つ以上持つ。g-5 根（親を持たない epic）でない bead は、parent-child をたどって根に着く。g-6 blocks に輪が無く、parent-child は木。g-8 memo の label と pointer の行の両方を持つ bead が無い。g-10 設計の索引と台帳と走行の id が互いに重ならない。g-11 走行は run_of の先の bead を持つ。g-12 段が Questioned の走行は raised の辺を持つ。残りの 3 本（g-3 発効した記録は裁定の行を持つ・g-7 宙に浮いた裁定 0・g-9 名指した id は欄にも在る）は、材料が 3 つの入力に無いので、つねに「まだ分からない」を返す。 近傍は、1 つの節点から根拠の側（辺を逆にたどる）と影響の側（辺を順にたどる）を各 2 段たどって返す。次数が 30 を超える節点は hub で、hub から先は広げず、切った理由と hub の次数を返す（規則の行 R-20 の値）。 この便の近傍は辺の from から to へたどる側を影響の側と呼んでいて、根拠と影響が逆だった。向きと段数と畳みと出す行の選び方は便 c-view（15 節）が直す。 fixture。実物の入力の見本（tests/fixtures/graph/real の索引と event log、tests/fixtures/ledger の bd-list-8.json）は設計席が置いた。この便が作るのは 5 つ。violations.json は数える 9 本のそれぞれについて入力の組を 1 つ持ち、組ごとに、違反になるはずの条件の一覧を欄に持つ（1 つの欠陥が 2 本に当たる組は 2 本を書く）。hub-619.json は子を 619 本持つ epic を 1 つ含む。runs-5.json は同じ bead の走行を 5 つ含む。no-state.json は event log の字が空の入力。unruled.json は定型行の無い閉じた問いを 1 つ含む。 依存は serde_json を中核の crate に足す（workspace には便 b で入っている）。入力を読んで口に出す側（子 process と server の口と tz graph の口）は境界の crate の後の便が持つ。"

[[contract]]
id = "d"
title = "台帳の指標と未反映の一覧と次の一手と pipeline の板（純粋な関数と電文の型・閾値は規則の行の字と照らす）"
