goal = "台帳の指標と未反映の一覧と次の一手と pipeline の板を、中核の crate の純粋な関数に置く。入力は便 c と同じ字（台帳の一覧の JSON・器の event log）と今の時刻（引数）で、関数は file も子 process も時計も触らない。字を読んで口に出す側（server の口）は境界の crate の後の便が持つ。 電文の型は契約の型の crate に足す。足すのは 2 つ（台帳の指標 LedgerStats・次の一手 NextStep）で、pipeline の板は着地済みの型（PipelineBoard と PipelineCard）を使う。足した型は便 b の snapshot の歯で pin する。 数え方は見本の集計（docs/design/mock3/ledger.js の stats と judge）と同じにする。bead の種類は便 c と同じ順で決める（epic・memo・問い・契約）。指標が数える task は契約の bead。 台帳の指標。open は status が closed でも tombstone でもない bead。blocked は open の task のうち、status が blocked のものと、status が in_progress でなく blocks の先に open の bead を持つもの。ready は status が open で blocks の先が全部閉じている task。時点 t の open の数は、created_at が t 以前で、closed_at が無いか t より後の task の数。純減 24h は今の open の数から 24 時間前の数を引いた値で、純減 7d は 7 日前の数を引いた値。closed/日 は直近 7 日に閉じた task の数を 7 で割った値。lead は直近 30 日に閉じた task の created_at から closed_at までの日数の中央値と p90 で、1 本も無ければ値なし。stale は updated_at が 7 日以上前の open の task。日ごとの 14 本は、その日に作られた数と閉じた数と、その日の終わりの open の数（burndown と sparkline の材料）。epic の進みは直下の task の閉じた数と全体の数で、直下の task が 0 本の epic は出さない。memo は open の数・昇格待ちの数（description に「昇格条件」の見出しの行を持つ open の memo）・直近 7 日に閉じた数・open の memo の年齢の中央値。種類ごとの open の数（task・memo・問い・epic）も持つ。作業中の数と最古の task は電文に持たない。 判定は規則の行 R-18 の順に当てて最初の 1 つ。open の task が 1 本以上で stale の数が open の task の 0.5 倍を超えれば滞り。でなく純減 7d が 0 を超えれば積み増し。でなく closed/日 が 0.1 未満なら停滞。どれでもなければ順調。台帳の字が読めなければ台帳なし。閾値の定数（0.5・0・0.1・7 日）は 1 か所に置き、歯が rules の file（design-intent/rules.yaml）の行 R-18 の字と照らす（読むだけ・YAML の読み手は足さず、行の字を探す）。 未反映の一覧は 3 種（memo・裁定・要望）を、種類ごとに「読めた一覧」か「まだ分からない」で持つ。memo は open の memo の全部（昇格先を指す辺がまだ無いので、open なら未反映）で、年齢の古い順。裁定（処分の宣言の無い裁定）と要望（反映されていない要望）は、材料（処分の宣言・要望の印）が入力にまだ無いので「まだ分からない」を返す。0 件とは区別する。指標の電文の未反映の数は memo の数で、分からない 2 種の名を欄に持つ。 次の一手は、閉じた 7 種を規則の行 R-24 の順に判じ、最初に当たった 1 つと、その対象の id と件数を返す。この便の入力で判じられるのは 3 種。止まっている走行は、板の段が Questioned か Failed か Stopped の札で、その bead が open のもの（対象はいちばん古い札の bead）。質問は open の問い（対象は created_at がいちばん古い 1 本）。なしは、どれにも当たらないとき。残りの 4 種（限度と移動・応答なし・束の承認・発効待ち）は材料（席と口座の状態・束・発効待ちの記録）が入力に無いので判じず、判じなかった種類の一覧を電文に持つ（後の便が材料と一緒に足す）。event log の字が読めなければ、止まっている走行も判じなかった種類に入れる。 pipeline の板。札は bead ごとに 1 枚で、その bead の走行のうち RunCreated がいちばん新しい 1 つの、最後の event で段を決める。走行の回数は同じ bead の RunCreated の数。口座は、その走行の event の detail の「account:」の後の字のうち最後のもの。経過は今の時刻から最後の event の時刻を引いた秒。器の event から板の段への対応は閉じた表で持つ。RunDone は Landed。RunStage の Reviewed と Gated で detail が「verdict:FAIL」か「verdict:INCONCLUSIVE」で始まれば Failed（段の理由は detail の字）。RunStage の Gated でそれ以外は Gated。RunCreated と、RunStage の Reviewed（verdict が PASS）・Spawned・Implemented は Running。最後の event が QuestionRaised なら Questioned。走行を 1 つも持たない open の契約は、blocks の先に open の bead が在れば Blocked、無ければ Queued。Stopped はこの便の入力に材料が無いので作らない。表に無い段の名の走行は札を作らず、数だけを返す。event log の字が読めなければ、板の札は「まだ分からない」。 fixture はこの便が作る。judge.json は見本の自己検査と同じ 7 組（滞り・積み増し・停滞・closed/日 がちょうど 0.1 なら順調・順調・台帳なし・open の task が 0 本なら滞りにしない）。stats-30.json は bead 30 本の台帳の一覧と今の時刻と、期待の指標の値。pipeline.json は対応の表の 1 行ごとに走行を 1 つ持つ event log と、期待の札。next.json は 3 種と event log が読めない組の 4 組。 依存は足さない。"

