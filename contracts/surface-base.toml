は真）と heartbeat（on は真）から写し、行が無ければ「まだ分からない」。state は次の順で決める。(e) の reason が account-pressed なら limit。reason が state-stale なら silent。それ以外は (d) の最後の行の state が busy なら run、idle なら wait。(d) が無いか行が 1 つも読めなければ unknown。since は、limit と silent では (e) の ts、run と wait では (d) の末尾から同じ state が続く行のうち最も古い行の ts。 usage は、(c) の行のうち account が席の account と同じ行から 3 つの窓を組む。窓の名は five_hour・seven_day・seven_day_model。used_pct は数（100 を超える数は 100 にしない・255 を超える数は 255）。resets_at は時刻を epoch 秒にした値で、none なら無し。counted は、five_hour と seven_day はつねに真、seven_day_model は行の model の名が席の model と同じ（大文字と小文字を区別しない）ときだけ真。行が unmeasured か、行が無ければ「まだ分からない」。 group は、群の名（群の宣言から）と、(b) の群の行のうち名が同じ行の current（今の口座）・accounts（候補）・next（次の移り先・none なら無し）から組む。remaining は、(c) の行のうち account が今の口座と同じ行の 3 つの窓の残り（100 から使った割合を引いた値・0 より小さくしない）で、行が無いか unmeasured なら空の列。群の名か群の行が得られなければ「まだ分からない」。 spans は、(d) の行のうち ts が今の時刻の 24 時間前以後の行から組む。行を ts の順に並べ、同じ state が続く行を 1 つの区間にまとめ、区間の始まりは最初の行の ts、終わりは次の区間の始まり（最後の区間は今の時刻）。state は busy を run、idle を wait に写す。(d) が無ければ「まだ分からない」、在って 24 時間の中に行が無ければ空の列。 moves は、群の記録の字の列から組む。1 つの記録が 1 つの移動で、at は ts、to は account、from は previous（無いか空なら無し）。時刻の古い順に並べる。群の名が得られなければ「まだ分からない」。 次の一手。席の card を受ける関数を中核の crate の next_step の module に足す（着地済みの関数は変えず、席の card を受けない値のまま）。限度と移動は、席の card の state が limit か、account が群の今の口座と違うときに当たった（対象は無し・件数は 1）、どちらでもなければ当たらない。応答なしは、state が silent のときに当たった。席の card が無い（引数が無い）ときと、state が unknown のときは、2 種とも判じなかった。なしと大きく出す 1 つは、7 種の結果から着地済みの決め方で決め直す。 server。引数 --seat <席の名> を読む（便 e-ask が足した引数・省いたら席の card は組まない）。口 GET /api/seat を足す。3 つの出力は子 process で撃ち、5 秒で返らなければ読めない扱い。3 つの出力と file の読みは 5 秒のあいだ持ち回す（要求のたびに器を撃たない）。--seat か --state-dir が無いときは、器を撃たず、state が unknown で読む欄が全部「まだ分からない」の card を返す。口 GET /api/next は、席の card が読めるときは席の card を受ける関数の値を返す。変化の知らせは、(d) と (e) の file の変化の印を着地済みの周期の読み（500 ミリ秒）に足し、変わったら board-changed を流す。 在りか（着地済み）。席の card の型（SeatCard・SeatState・QuotaUsed・SeatSpan・AccountMove）は契約の型の crate の seat の module、群の行の型（GroupRow・QuotaLeft）と Reading は板の module、次の一手の型（NextStep・NextCheck・CheckResult）は stats の module。中核の crate の次の一手の関数は crates/tsuzuri-core/src/next_step.rs の next_step（引数は台帳の字・event log の字・今の時刻）で、歯は crates/tsuzuri-core/tests/stats.rs（この便の write-set の外・関数の外形を変えないので通る）。server の読む側の口は crates/tsuzuri-boundary/src/server/board.rs（次の一手の口は next の関数）、口の振り分けと起動の引数の型は mod.rs、周期の読みと SSE は events.rs。中核の crate は契約の型の crate と serde と serde_json に依存し、境界の crate は契約の型の crate と中核の crate に依存している（Cargo.toml は触らない）。時刻の字を epoch 秒にする関数は中核の crate の ledger の module の epoch_secs。 着地済みの読む側の口の歯（crates/tsuzuri-boundary/tests/server_read.rs・この便の write-set の外）のうち、指標の口の歯は、口の本文と中核の関数の値を電文にした字を比べる（小数の読み直しのずれで落ちないよう、設計席が 8fdfd1b で直した）。この便はこの歯の file を触らない。 歯は偽の器を使う（受けた argv を一時の file に書き、argv に応じて fixture の字を標準出力へ出す script）。fixture の seat-inputs.json は、組ごとに 7 つの字と期待の card を持つ。口座の名と host の名は見本の名（acct-1・host-1 の形）にして、実物の名を書かない（行 D-4）。fixture は 20000 byte 以下にする。 依存は足さない。"

