etired_notes の照らしを移す）・gmret_unread_folds_nothing と gmret_dom_wiring（圧縮の面の分を外す）・gmret_names_clean（歯の数 5 を 4）・gsum_dom_text（一覧の面の字を外す）・gsum_own_names_clean（下限 9 を 8）・ncard_dom_wiring（board の字だけ）・ncard_names_stay_apart（下限 7 を 6）・mtips_dom_text（表とグラフの注釈の字だけ）と、tests/btuck.rs と tests/gsum.rs の NO_GIST の use の行。新しい歯は tests/bvmcomp.rs の 2 本。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。(1) は verify の 1 行目、(2) は 2 行目の clippy、(3)(4) は 3 行目の歯 bvmcomp、(5) と (6) は 4〜9 行目の面の歯 6 file（(5) は tests/mapview.rs の行）、(7) は surface-build の行、(8) は check の行で測る。 構造の連鎖。圧縮の面と一覧の面を引く src は、表の面の DOM（pair_value と with_pair）と節点の card（NO_GIST と NO_STATE）だけなので、2 か所へ移せば残りは組み立てが通る。名の照らしで当たった widgets/help.rs の note_of は語の辞書の項から注釈を組む別の関数で、project/ask.rs の tag は局所の変数で、どちらも圧縮の面を引かない（試作で消して組み立てが通ることを見た）。表の面の with_pair が書く pair の値を読む面は一覧の面と一緒に無くなるが、表の面は行 m-map-tree で消すので、その時まで字を変えずに持つ。 試作と噛み。試作は 180cc9ba の上（係の写し drafts/w63a・branch proto-w63a）。書いた file は write-set の中で閉じる。面の歯 805 本（消した 22 本・足した 2 本）が緑、cargo run -q -p xtask -- check が rc 0（工房の歯 2900 本が緑）、surface-build が rc 0、clippy が rc 0。噛みは 5 つの変異で、一覧の面の file を置く・kit の doc に mapview::compact の字を足す・nodecard の 2 つの字を替えるは bvmcomp の歯が、表の組の query が帯の絞りを外さないは mapview_table_counts_and_pair_filter が、どれも rc 100 で落ちた。 流す時と順。depends は m-map-page（差はその試作の上で切った）。m-map-page の着地の後に流す。続く行 m-map-tree と m-map-graph は、この行の試作の commit da99fa55 を起点に切る。 範囲の外。語の辞書 vocab.json と stylesheet style.css の圧縮の面と一覧の面の語と class（col_band・sort・art7・cards7 ほか）は第 2 段の行 g-help-sweep で掃く。表の面と 2 つの木の面（table.rs・tree.rs）と、移した pair_value と with_pair は行 m-map-tree で消す。"

