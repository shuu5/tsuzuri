goal = "在りか。差の file docs/design/patch/c-bead-facts.patch は main ef01b1fc を起点に切った（試作の commit 0779f8e4・起草 w63d の写しの中だけ）。書く file は契約の crate の src/ledger.rs・tests/cform_ledger.rs・tests/snapshots/ledger.json と、中核の crate の src/ledger/mod.rs・新しい src/ledger/facts.rs・新しい歯 tests/bvfact.rs の 6 つ。write-set の =crates/tsuzuri-contract/tests/cfsplit.rs は verify が撃つだけで書かない。 なぜ。判断の記録 ADR-27 の決定 (9) は短い題を台帳の付帯の欄 metadata の鍵 short に置き、置いていない bead は題から機械で作る（便は契約の行 id・ほかは題の「—」の前）とし、決定 (10) は面の server の電文に bead の起票の時刻・依存の相手・本文の概要・短い題を足すとした（要件 FR5 の吹き出しと FR10 の札）。今の一覧の行の型 LedgerRow は歯の literal が多いので欄を足さず、別の型 BeadFacts を次の行 c-bead-route の新しい口で出し、面が id で結ぶ。中核の台帳の読みの struct（src/graph/build.rs の BdBead）は既に欄 metadata を serde_json の Value で全部読み、同じ file の metadata_ids が object と object を JSON にした字の両方から鍵の字を読むので、struct に欄を足さず metadata_ids で鍵 short を読む（build.rs は書かない）。 形。契約の src/ledger.rs の LedgerList の後に 2 つの型を足す。BeadFacts は欄 rows（Reading の Vec の BeadFact・読めなければ Unknown）だけ。BeadFact は欄 id（BeadId）・created_at（Option の EpochSecs）・short（String）・short_set（bool）・summary（String）・blocks（Vec の BeadId）をこの順に持つ。中核の新しい src/ledger/facts.rs は pub の関数 facts（台帳の字から BeadFacts）・short_of（題から機械の短い題）・summary_of（本文から概要）と pub の定数 SHORT_KEY・ROW_TITLE_PREFIX・TITLE_DASH・OBSERVATION_HEADING・SUMMARY_LABEL・SUMMARY_MAX を持ち、src/ledger/mod.rs が pub mod facts と pub use facts::facts を足す。決め: 台帳の字が空か JSON の配列として読めなければ rows は Unknown（空の配列は Known の 0 件）。tombstone の bead と id が bead の id の形でない bead は出さず、行は台帳の順。short は metadata の鍵 short の空でない字なら short_set は真。無ければ short_set は偽で、題の前後の空白を除き、頭が字「便」と半角の空白なら次の空白までの字（契約の行 id）、ほかは字「—」の前の字の前後の空白を除いた字（「—」が無ければ題の全体）、作った字が空なら題の全体。summary は本文の行を前後の空白を除いて見て、行の全体が字「### 観測」の行が在ればその下の最初の空でない行、無ければ空でなく字 # で始まらない最初の行を選び、頭の字「概要 =」とその後の空白を外し、Unicode の字で 120 に切る（要件の全角 120 字を Unicode の字の数と読む・題を 36 字に切る契約の title36 と同じ数え方）。選ぶ行が無ければ空の字。blocks は依存の type が blocks の先の全部を台帳の順に持ち、id の形の合わない先は外す。created_at は bd の欄 created_at の RFC 3339 の字を中核の epoch_secs で読み、読めないか欄が無ければ None。契約の歯 cform_ledger.rs は見本 2 つの BeadFact と 3 つの BeadFacts（Known の 1 行・Known の 0 件・Unknown）を LedgerList の見本の後に足し、snapshot ledger.json はその 2 つの鍵の字を持つ。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done (1) は verify の 1 行目（git apply --reverse --check）。(2) は 2 行目の clippy。(3) は 3 行目の中核の歯 bvfact_（tests/bvfact.rs の 10 本）。(4) は 4 行目の契約の歯 contract_form_（tests/cform_ledger.rs の 7 本）と 5 行目の cfsplit_（tests/cfsplit.rs の 6 本）。(5) は 6 行目の xtask の check。 構造の連鎖。契約の型を足すので、契約の群 ledger の snapshot ledger.json が変わる（cform_ledger.rs の見本の足しと同じ差）。群の見張り cfsplit.rs は足す行が一覧を直さない決まりなので書き替えない（鍵 ledger::BeadFact と ledger::BeadFacts は群 ledger の module ledger の鍵）。契約の群の歯のうち cform_ledger.rs の contract_form_snapshot_matches と contract_form_roundtrip_all_types が新しい見本を測る。一覧の行の型 LedgerRow・bd の行の読み BdLine・境界の一覧の読み・中核の Bead と read と build.rs の BdBead と metadata_ids は替えない。次の行 c-bead-route が口を足し、第 2 段の面の行（吹き出しと札）が読む。 試作と噛み。main ef01b1fc を git clone --local した写しで試作した（試作の commit 0779f8e4）。書く file は write-set の 6 つで閉じる（git diff --stat の file は 6・足し 404 行と消し 3 行）。差の byte は 19,242（gate の上限 150,000 の内）。cargo clippy -p tsuzuri-contract -p tsuzuri-core --all-targets --no-deps -- -D warnings が rc 0、中核と契約の全部の歯 355 本が緑、xtask の check が rc 0（workspace の歯 2930 本が緑）。変異 12 を 1 つずつ当て、どれも名指した歯が rc 100 で落ちた（short_set を常に偽・便の頭を外さない・区切りの前の空白を残す・観測の見出しを見ない・概要の頭を外さない・見出しの行を飛ばさない・121 字で切る・blocks に parent-child の外を全部・起票の時刻を読まない・読めない字を 0 件に・tombstone を残す・電文の欄の名を替える〔snapshot の歯〕）。 流す時と順。depends は無い（第 1 段の電文の鎖の頭）。次の行 c-bead-route がこの行の後。同時に置く第 1 段の行のうち契約の snapshot と形の歯（cform_*.rs・snapshots/*.json）を書く行とは、書く file が重なる時に席が置く順を決め、後に置く行は前の行の着地の後に差を切り直す（この行が書くのは群 ledger の cform_ledger.rs と ledger.json だけ）。 範囲の外。口 GET /api/beads（次の行 c-bead-route）・面の読みと台帳の変化の知らせでの読み直し（第 2 段の吹き出しの行）・metadata の鍵 short を書くこと（席の起票の手順・面も server も書かない）・依存の相手の段（面が台帳の一覧の状態で結ぶ）・器が自分で起こす bead の短い題（器の席と決める）。"

