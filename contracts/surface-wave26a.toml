 1 行目（差の hunk が全部木に在れば rc 0、当てる前の木では rc 1）。done (2) は 2 行目の clippy。done (3)〜(7) は 3 行目の中核の歯 tests/bvverd.rs（7 本）。done (8) は 4 行目の中核の着地済みの歯 tests/runsdoc.rs。done (9) と (10) は 5 行目の境界の歯 tests/bvvroute.rs（3 本）。done (11) は 6 行目の境界の着地済みの歯 tests/runsdoc.rs（書かない・判定の file の無い置き場で口の電文が中核の runs_of の電文と同じままであることを見る）。最後の行の xtask の check は repo の全部の歯と床を撃つ（done の項は持たない）。 構造の連鎖。RunLine の値を組むのは中核の runs_of の 1 か所だけ（欄を足す literal はそこと歯）。RunLine を読む面の src/project/timeline.rs は欄を名で読むので替えない。面の歯 tests/ntime.rs の電文の fixture は鍵 gate と review を持たないが、serde の既定で Unknown に読む。Runs を作るのは境界の server/mod.rs と cli/graph.rs の Runs::new で、欄 pipe は new が埋めるので替えない。契約の snapshot の群（tests/cfsplit.rs の GROUPS）は module runs を持たないので snapshot は替えない。口の一覧の歯は口を足さないので替えない。 試作と噛み。試作は main ef01b1fc の写しで、書く file は write-set の中で閉じる（git diff --name-only ef01b1fc 84e5fdbe が write-set の書く 7 file と同じ）。xtask の check は試作の木で rc 0（workspace の歯 2,930 本が緑・面の wasm の clippy と surface-build を含む）。噛みは変異 12 を 1 つずつ当て、名指した歯の file を撃った（schema を見ない・崩れた findings を None に・place を kind から・審査に gate の file を渡す・run の id の守りを外す・口が判定を置かない・鍵の無い電文の既定を外す・RunStopped を段にしない・0 の件数を落とす・findings の無い字を空の列に・gate の時刻を捨てる・電文に gate を出さない）。どの変異も組み立ては通り（nextest の rc 100）、done (3)〜(10) の各歯は少なくとも 1 つの変異で落ちた（変異と落ちた歯の一覧は起草の notes）。 流す時と順。depends は空。第 1 段のほかの行（地図を消す行・bead の事実の口・列の 5 つ・局面の出力の口・/api/graph/view を消す行）と書く file は重ならない見込み（中核の pipeline.rs は後の行 c-case-columns が書く見込みで、この行を先に置く）。 範囲の外。吹き出しの表示と段の語の対応（第 2 段の行）。器の欄 verify_red・diff_bytes・tree・scope・population の写し。過去の判定の歴（器は便ごとに最後の判定だけを file に残す・各回の段の結びは event の RunStage の detail を今の steps の verdict と verdict_kind が持つ）。新しい口と変化の印の file の足し。"

