goal = "在りか。main ef01b1fc（ノート surface-wave26a の第 0.1 版の木）。差の file docs/design/patch/c-case-read.patch は、起草 w63e の試作（写し drafts/w63e の 73d8e038・main ef01b1fc の上の 2 commit）から git diff --no-color --full-index で write-set の 14 file だけを切った。main の木で git apply --check が rc 0、試作の木で git apply --reverse --check が rc 0（41,454 byte・14 file・1030 行足して 1 行消す・src は 7 file で 233 行・歯は 3 file で 451 行・fixture と snapshot は 3 file で 344 行）。 なぜ。判断の記録 ADR-27 の決定 (10) が、一覧の段と Queued のまだ起きない理由と Blocked の相手を器（scribe2）の局面の出力 fleet/lifecycle.json の局面と理由と相手の欄から読むとした。要件 FR10（第 0.22 版）は Blocked と Queued の列を局面 contract-queued の理由と欄 links.on と links.runs で分け、要件 FR13 は未反映の一覧を局面の出力が席の手番とする 3 つから出し、読めない出力と古さの印の在る出力を示すと書く。この行はその読み手だけを置き、後の行（c-case-columns・c-unref-lc・c-ledger-lc）が中核の関数 cases_of の電文を使う。 形（要約・字は差の file）。契約の crate に module case（定数 PATH は /api/cases・型 CaseDoc は欄 generated_at〔epoch 秒か None〕・stale〔古さの印の種類の字の列〕・parts〔Reading の CasePart の列〕、型 CasePart は欄 part・id・phase・turn・since・reason・closed・links、型 CaseLinks は欄 on と runs）を足す。種類と局面と手番と理由の語と部品の id は閉じた列で持たず字のまま（id は bead id とは限らない・row は pointer の字・run は run id）。中核の crate に module case の関数 cases_of（引数は出力の字と、古さの印の字の Option）を足す。読めない時と古い時は器の読み手 crates/scribe2/src/fleet/lifecycle_read.rs の read を、比べる入力の組を空にして呼んだ形に合わせる（古さの印の file が無ければ印は無い・在って読めないか版が 1 でないか同じ種類の印が 2 つ在れば Unknown・出力が無いか読めないか版が 1 でなければ Unknown・古さの印が 1 つでも在れば古い）。器の読み手と違い、知らない語の部品を落とさず（面が知らない語をまだ分からないに倒す・ADR-27 決定 (10)）、読まない欄（scope・full_at・inputs・unmeasured・owned・overdue・種類ごとの欄）は形を見ない。境界の crate に読みの出所 server/cases.rs（型 Cases は state dir から 2 つの path を持ち、走行の出所 server/runs.rs の Runs と同じく起動の引数の state dir から作る・古さの印 → 出力の順に読む・古さの印の file は NotFound なら None・ほかの読みの誤りは空の字）と口 server/routes/cases.rs を足し、server/mod.rs は module の宣言と use と Shared の欄 cases とその初め（Cases::new に config.state_dir を渡す）と doc の 1 行を足す。口の列 Route は組み立ての script が routes の dir から作るので口の一覧の歯 tests/hbroute.rs は書き替えない。契約の群の見張り tests/cfsplit.rs は群の表 GROUPS を 6 から 7 にして群 case を足し、群の歯の file tests/cform_case.rs と snapshot tests/snapshots/case.json を足す。fixture tests/fixtures/case/ の 2 file は、器の実物の形（頭の欄・inputs・unmeasured・phases の 38 語・owned）を写した小さな字で、部品は 10（依存と重なりと予約の contract-queued・contract-running・run-blocked・memo-waiting・question-closed・epic-open・知らない局面の語の部品・closed の欠けた部品）。結びの on は理由の語で分けずに運ぶ（器の行 h〔器の main 417e4754〕で理由 reserved の部品の on に行を予約した bead が入る・部品の理由の欄は語 reserved だけ）。重なりの部品の on は相手の便の bead で、runs はその契約自身の最新の便（器の fleet/phase.rs の contract_part）。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done (1) は verify の 1 行目（git apply --reverse --check）。done (2)〜(6) は 3 行目（歯 bvcase_ の 5 本）。done (7) は 4 行目（歯 bvcroute_ の 6 本）。done (8) は 5 行目（歯 bvcform_ の 3 本）。done (9) は 6 行目（cfsplit の 6 本）と最後の行（xtask の check）。2 行目（3 つの crate の clippy）は足した src が unwrap・expect・panic・添え字を使わないことと型の derive の揃いを見る。 構造の連鎖（main ef01b1fc で grep と組み立てで全部）。契約の crate の module の列（src/lib.rs）に case を足す。契約の module のうち account・notice・project・runs・seathb・stage は群の見張りの表に無いが、この行は snapshot の群を足す（群の見張りの 6 本は群の表の全部の群に、cform の file の mod common の 1 行・共通の手を持たないこと・snapshot_matches の呼びの 1 度・群の json の鍵が群の module の型だけで群どうしで重ならないことを見る）。中核の crate の module の列（src/lib.rs）に case を足し、doc の 1 行を足す。中核の ledger の epoch_secs を使う（替えない）。境界の Shared の欄を足すのは server/mod.rs の 2 か所（struct の宣言と bind_with の初め）だけで、Sources（cli/graph.rs も組む）は替えない。mod.rs の字を数える着地済みの歯（evkind・ntcsrv・hbpost・hbconf・eheld・rhold・server_acct・dstg・iclose・ecache・hbroute の引用符の /api/ の字）が数える字を足さない（doc の 1 行は引用符を持たない）。口 /api/cases の要求と変化の知らせ（ChangeKind）は面のどこも読まない（面の読みは後の行）。 試作と噛み。試作は main ef01b1fc の上の 2 commit（写し drafts/w63e の bad358d5 と 73d8e038）で、書く file は write-set の 14 file の中で閉じる。3 つの crate の clippy（--all-targets --no-deps）が rc 0、歯 bvcase_ の 5 本・bvcroute_ の 6 本・bvcform_ の 3 本・cfsplit の 6 本が緑、xtask の check が rc 0（nextest の 2,934 本が全部緑）。fixture は器の読み手（scribe2 fleet lifecycle show）でも読め、器は知らない局面の部品と closed の欠けた部品を落として 8 つを出し、面の cases_of は知らない局面の部品を残して 9 つを出す。噛みは変異 10（読めない古さの印を印の無い扱いにする・知らない局面の部品を落とす・欠けた結びの key で部品を落とす・版を見ない・古さの印の種類を並べ替える・closed