_non_get_405_writes_nothing（3 の口）・server_read.rs の server_read_routes_write_nothing（4 の口）・server_coalesce.rs の server_coalesce_seven_routes_share_one_bd（7 の口）。面の crate の口の表（歯 hsderive.rs）と合図の種類の表（歯 evkindview.rs）は、面がこの口を読む第 2 段の行が書く。 試作と噛み。前の行の試作の commit 0779f8e4 の上で試作した（試作の commit fd870781）。書く file は write-set の 2 つで閉じる（git diff --stat の file は 2・足し 266 行）。差の byte は 11,215（gate の上限 150,000 の内）。cargo clippy -p tsuzuri-boundary --all-targets --no-deps -- -D warnings が rc 0、歯 bvfroute_ の 3 本と hbroute_ の 8 本が緑、xtask の check が rc 0。変異 5 を 1 つずつ当て、どれも名指した歯が rc 100 で落ちた（古さの印を付けない・読めない字を空の配列に・口の path を替える・行を逆の順に〔中核の facts〕・落ちた間は最後に読めた字を使わない）。 流す時と順。depends は c-bead-facts（型 BeadFacts と中核の facts を使う）。境界の routes/ に新しい file を足すだけなので、ほかの第 1 段の行とは書く file が重ならない（口の一覧を字で持つ歯を書く行とも重ならない）。 範囲の外。面の読み（第 2 段の吹き出しと札）・台帳の変化の知らせ ledger-changed での読み直しと合図の種類の表・口 /api/ledger と LedgerList の電文・依存の相手の段（面が台帳の一覧で結ぶ）・ほかの project の台帳。"

