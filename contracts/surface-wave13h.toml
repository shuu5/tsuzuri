goal = "在りかの main は 83036e2（計画 surface-plan は第 0.38 版・面の crate は行 g-jst〔8634bf2〕の着地の後）。この節の字はその code の値。器（scribe2）の字は、器の main（2b24f1f4）の code を読んで確かめた値。 なぜ。見本（docs/design/mock3・判断の記録 ADR-7 で確定）の project board は、header の席の pill（ui.js の関数 seatPillHTML）で、限度なら再開の時刻（関数 hmd に再開の時刻を渡した字・class eta num・stylesheet の限度の色）を、応答なしなら最後の tick からの経過を出し、席の card（関数 seatCard）は限度なら値の行に ↻ と再開の時刻を出す。見本の再開の時刻は、席の口座の窓のうち使った割合が 100 以上で戻る時刻が今より後の窓（model の窓は席の model と同じときだけ）の戻る時刻の最も遅いもの（関数 seatStatus の lim.resume）。着地済みの行 g-seatpill（ノート surface-wave12c）は、電文に再開の時刻が無いので pill の限度の eta と card の ↻ を出さなかった（面の src/seatpill.rs の module の doc の 4 行目 電文に無い見本の値〔限度の再開の時刻・管理の tick の最後の時刻からの経過〕は出さない）。計画 surface-plan の 9 節の行 c-limit-resume（第 12 波 c の起草の問い 4 への席の決め・見本どおり）は、再開の時刻を電文の席の card に足し、pill の限度の eta と card の再開の印を出すと決め、値は器の event log か rules 行の写しで tsuzuri は判じないとする（値の出所は起草で器に問う）。要件 FR12 は席の健康（限度を含む）を出すことを決める。 値の出所（器の code・この行の起草の見つけ）。器の管理 tick は、席の登録の口座の鮮度の内側の残量の実測のうち、どれかの窓の使った割合がその窓の閾値の rules 行（fleet.group_pressure_5h_pct・fleet.group_pressure_7d_pct・fleet.group_pressure_model_pct・model の窓は席の役の model の窓だけ）の値以上なら、席に合図を送らず tick-last に理由 account-pressed の行を書く（器の src/seat/tick.rs の fn account_pressed と src/hook/group.rs の fn pressed）。tick-last の行は ts・decision・reason の 3 欄だけで、どの窓か・いつ戻るかを持たない。器の event log の GroupPressureNotified は群の今の口座の逼迫の知らせで、detail に窓（閾値を越えた窓のうち使った割合の最大の 1 つ）と使った割合と閾値を持つが戻る時刻を持たず、群・口座・窓ごとに 1 度だけ書かれる。戻る時刻を持つ器の出力は残量の出力（fleet usage --show の行の窓ごとの resets=）と event log の AllowanceMeasured の欄 resets_at だけで、器は再開の時刻そのものを出さない。そこでこの行は、器の rules 行の閾値の出力の字を写し（account board の着地済みの行 c-acct-thr と同じ rules get の 3 行）、規則の行 R-22 の逼迫の印の式（窓の使った割合が cap 以上・器の判定と同じ式・持ち主の裁定 t3-hub.53.8 で面に出すと決めた器の値の写し）で当たる窓を選び、その窓の戻る時刻の最も遅いものを再開の時刻にする。閾値の数は code に書かない。event log は読まない（群ごとの知らせで席の口座の窓を名指さず、戻る時刻を持たず、読む file も大きい）。器が再開の時刻そのものを出すようになれば、それを写す形に替えるのが後の行（席への申し送り）。 在りか・契約（crates/tsuzuri-contract/src/seat.rs・write-set・80 行）。pub struct SeatCard（derive は Debug・Clone・PartialEq・Serialize・Deserialize）の pub な欄は at・target・state（SeatSt