goal = "在りか。起点は行 g-win-parts の試作の commit 53ff0933（席の積みの木・写し drafts/s26b の branch stack3・main 2ed91cab の crates の字と同じ）。差の file docs/design/patch/g-ask-win.patch は、その上に載せた試作の commit 29df800a（写し drafts/w70a の branch fix）との git diff --no-color --full-index で write-set の書く file の 10 だけを切った（43,965 byte・+799 −10）。53ff0933 の木と main 2ed91cab の木で git apply --check が rc 0、29df800a の木で git apply --reverse --check が rc 0。前の版の差（34,767 byte）を当てた便 t3-hub.52.179 は、問いの一覧が読めない時に窓が問いが無いと出すので、gate の審査が憲法 P-7.1 と P-7.2 で落とした。この版の差は前の版の差に読めない時の形を足した物で、前の版と字が違うのは src/askwin.rs と tests/bvaskw.rs だけ。席の積みの木の後の 17 行（g-pop から g-accept まで）は 29df800a の上に当て直した（写し drafts/w70a の branch stack4・最後の commit afbed52c）。 なぜ。判断の記録 ADR-27 決定 (4) は質問の窓を 1 問ずつ出し、答えを送ると次の問いへ進み、全部に答えると閉じ、束の承認と方針の欄を窓の下の段に置くとする（退けた案 g は全部を縦に並べる形）。見本 board-v2 の qModal・qsend（記録の後 650 ms で一覧の頭から最初の答えていない問いへ・全部なら 全部答えました ✓ を 1200 ms 出して閉じる）・qlater（後ろへ巡る）に合わせる。答えの口と記帳は今のまま（質問の block と同じ card と答えの欄）。憲法 P-7.1 は検査や読みができなかった結果を異常なしとして扱わないとし、P-7.2 は判定できないものをまだ分からないとして表に出すとする。前の質問の block（ask の view）は、問いの一覧が読めない時に測れていないの印と理由を出し、台帳が読めないほかの project には札と 1 行（ask の OTHER_UNKNOWN）を出し、本文の頭に席に届いていない裁定の 1 行（ask の late_view・届いたかが読めない時の 1 行も持つ）を出していたので、窓もこの 3 つを落とさない。 形。新しい file src/askwin.rs に、局面 Phase（Unmeasured・Empty・Walk・Done・Unmeasured は理由の字を持つ）と phase、1 問ずつ出す問い own_ids（ほかの project の問いを外す）、今の問い current（選んだ問いが答えていなければそれ・ほかは頭から最初の答えていない問い）、あとで later（後ろへ巡る・ほかに無ければ None）、残りの数 left、題 title（答えを待つ質問 と残りの数）、点の class dot_class（qd・cur・ok）と定数 ADVANCE_MS（650）・DONE_MS（1200）・DONE_KEY・LATER_KEY・FOLDS を置く。読めない時の形として、unread（ask の body が Unmeasured の時の理由・測れて 0 件と中身ありは None）・phase の頭の引数の読めない理由（在れば窓で答えた問いが在っても Unmeasured）・題の残りの数 remaining（Unmeasured では None）・数が分からない時の字 UNKNOWN_COUNT（?・帯のやる事の数が分からない数に出す字と同じ）・title の引数は Option の数（None は ?）・ほかの project の問いの数 others_count（一覧が読めないか台帳が読めないほかの project が 1 つでも在れば None）とその段の題 others_title を置く。wasm の枝の frame は窓の積みを受け、題の横の点で問いを選び、1 問は src/project/ask.rs に足した one_view（block と同じ card_view・答えの状態は問いの id ごと・Recorded の outcome で recorded を呼ぶ）で描き、記録の 650 ms 後に答えた問いに数え、全部に答えたら 1200 ms 後に窓が Ask のままなら閉じ、あとでの次が無ければ閉じる。局面は問いの一覧の口の読めない理由から決め、Unmeasured は前の block と同じ body_view の Unmeasured（測れていないの印と語と理由）で描く。窓の本文の頭に ask の late_view を置く。下の段は畳んだ details の ほかの project の質問（読むだけ・題は others_title・読めた問いの項の後に、台帳が読めない組を札と ask の OTHER_UNKNOWN の 1 行の項で同じ一覧に足す）・まとめて承認・全体への指示 で、src/project/batch.rs と policy.rs に pub fn inner を足し block の view も inner を描く。src/wins.rs の draw は窓の積みを受け、Ask の腕は askwin の frame を返す。src/lib.rs に pub mod askwin。stylesheet は質問の塊の末（つながりの塊の前）に点・全部答えた・あとで・下の段の規則と 600 px 以下の点の大きさを足す。語の辞書の rephrase の末に ask_done・ask_later・ask_others を足す。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done (1) は verify の 1 行目。done (2) は verify の 2 行目。done (3)〜(13) は verify の 3 行目（歯の file tests/bvaskw.rs・filter bvaskw_）の歯 bvaskw_one_at_a_time_in_order・bvaskw_advance_after_send・bvaskw_later_wraps・bvaskw_close_when_none_left・bvaskw_dots_and_title・bvaskw_batch_policy_below・bvaskw_words_and_rules・bvaskw_dom_wiring_text・bvaskw_unread_not_empty・bvaskw_others_unknown_shown・bvaskw_unread_dom_text。done (14) は verify の 4 行目（鎖の前の行の歯の file tests/bvwins.rs）。fixture は tests/fixtures/surface/question-list.json（読むだけ）。verify の最後の 2 行は done の項を持たない。 構造の連鎖。書き替える歯は行 g-win-parts の tests/bvwins.rs の bvwins_draw_wiring_text の 1 本（Ask の腕の字と doc）。src/project/ask.rs の one_view は着地済みの歯 qkey_dom_text の断る字（mod dom の中の .number と now の引数）を持たず、番号は一覧から target_number で読む。ask.rs は 1,047 行から 1,084 行（上限 1,500 の余地 416）。src/askwin.rs は 370 行。読めない時の字と関数は ask.rs の既存の物（body・listed・unknown_projects・late_view・REASON・CARDS_UNKNOWN・UNREADABLE・OTHER_UNKNOWN）と kit の body_view と NOT_READ を読むだけで替えない。帯の質問の数（行 g-topbar の counts）は次の一手の口 /api/next の件数を読み、分からなければ ? を出すので、この行の読みと別で替えない。今の質問の頁と block は替えない（頁を外すのは g-one-screen-a）。後の行 g-one-screen-b（AskFocus）と g-ask-hist（folds の末のこれまでの決定）は src/askwin.rs を書くので、この版の上に当て直して差を切り直した（g-ask-hist の folds の引数は w と focus になる）。 試作と噛み。試作の起点は 53ff0933、試作の commit は写し drafts/w70a の 29df800a。書く file は write-set の中で閉じる（git diff --name-only が write-set の 10 と同じ）。この木で歯 bvaskw の 11 本と bvwins の 7 本と clippy（host）と xtask の surface-build が緑。噛みは変異 7 つと対照 1 つ（log w/bite.log・対照は rc 0・どれも名指した歯が rc 100）: k1 unread が常に None → bvaskw_unread_not_empty・k2 問いが無く読めない時は Empty → 同・k3 remaining が読めない時も数える → 同・k4 others_count が台帳の読めない組を見ない → bvaskw_others_unknown_shown・k5 読めない組の 1 行の項を出さない → bvaskw_unread_dom_text・k6 Unmeasured の腕を 0 件の形に → 同・k7 窓の頭の届いていない裁定の 1 行を外す → 同。done (1) は 53ff0933 の木で verify の 1 行目が rc 1。 流す時と順。depends は g-win-parts（鎖）。 範囲の外。窓の層を頁に置き質問の頁と tab を外すこと（g-one-screen-a）・これまでの決定の段（g-ask-hist）・ほかの project の質問への答え（チャットで答える・今のまま）・帯の質問の数の読み（行 g-topbar・次の一手の口の件数）。"

[[contract]]
id = "g-pop"
title = "札と一覧の行の吹き出しの部品を widgets に足し、頁に 1 つの層を置く（判断の記録 ADR-27 決定 (7)・共通の欄と段ごとの欄・閉じる判定は窓の枠の closes・幅 600 px 以下は下からの板・bead の事実の口の path を契約の型に足す・差の file）"
req = ["FR5", "FR10"]
section = "7"
write-set = ["crates/tsuzuri-contract/src/ledger.rs", "crates/tsuzuri-surface/src/board.rs", "crates/tsuzuri-surface/src/widgets/mod.rs", "+crates/tsuzuri-surface/src/widgets/pop.rs", "crates/tsuzuri-surface/style.css", "crates/tsuzuri-surface/vocab.json", "+crates/tsuzuri-surface/tests/bvpop.rs"]
verify = ["git apply --reverse --check docs/design/patch/g-pop.patch", "cargo clippy -p tsuzuri-surface -p tsuzuri-contract --all-targets --no-deps -- -D warnings -D clippy::too_many_lines -D clippy::cognitive_complexity -D clippy::too_many_arguments", "cargo clippy -p tsuzuri-surface --target wasm32-unknown-unknown --no-deps -- -D warnings", "cargo nextest run -p tsuzuri-surface --test bvpop --no-tests=fail bvpop_", "cargo nextest run -p tsuzuri-surface --test parts --no-tests=fail", "cargo nextest run -p tsuzuri-surface --test frame --no-tests=fail", "cargo run -q -p xtask -- surface-build", "cargo run -q -p xtask -- check"]
size = "M"
done = "(1) git apply --reverse --check docs/design/patch/g-pop.patch が rc 0（差の file の hunk が全部木に在る） (2) cargo clippy -p tsuzuri-surface -p tsuzuri-contract --all-targets --no-deps -- -D warnings -D clippy::too_many_lines -D clippy::cognitive_complexity -D clippy::too_many_arguments が rc 0 (3) cargo clippy -p tsuzuri-surface --target wasm32-unknown-unknown --no-deps -- -D warnings が rc 0 (4) 吹き出しの欄は共通の欄が語の鍵 pf_id・pf_kind・pf_epic・pf_row・pf_created の順で段ごとの欄はその後、頭は bead の事実の短い題、題の全体は台帳の題、概要は事実の概要、種類は台帳の種類の語の鍵と札の段、epic は親をたどった最初の epic、設計の行はグラフの pointer の行から頭の字を外した字で、epic の無い bead と pointer の無い bead はその欄を出さず、札の無い bead は段ごとの欄を出さない（歯 bvpop_common_rows_in_order） (5) 事実と台帳とグラフと局面の出力が読めない時、種類・epic・設計の行・起票・待つ相手・待ちの長さの欄はまだ分からないで、題の全体と概要は無く、頭は id（歯 bvpop_unknown_fields_marked） (6) Blocked の待つ相手は、局面の出力の契約の部品が在ればその links.on の相手（短い題と札の段つき）、部品が無ければ bead の事実の blocks のうち台帳で閉じていない相手、links.on が空ならまだ分からない（歯 bvpop_blocked_targets_with_stage） (7) Queued の欄は列に入った時刻だけで、札の since が無ければまだ分からない（歯 bvpop_queued_since） (8) Failed と Stopped と Questioned の欄は理由の全文（切らない）と run の回と口座で、次の手は Questioned が問いの頁・Failed と Stopped が個別の頁の run の時間軸の block（歯 bvpop_stop_reason_full） (9) 着地の欄は着地の時刻と CI の語で、CI の読みが無ければまだ分からない（歯 bvpop_landed_time_ci） (10) 同じ bead を同じ口で押すと閉じ、違う口か違う bead は開き、吹き出しの中の click は閉じず、口の上の click は口に任せ、外の click は閉じる（歯 bvpop_toggle_and_outside） (11) 置き場は口の右・窓の右端を越えれば左・左端も越えれば口の下・下端を越えれば上へ寄せ上端は 60 より上へ出さず、口が無ければ窓の真ん中の上 80（歯 bvpop_place_right_left_below） (12) 吹き出しの id pop と幕の id popscrim と 9 つの class が stylesheet に在り、幅 600 px 以下（窓の枠の FULL_MAX_PX）の media の規則で幕を出し吹き出しを下からの板にする（歯 bvpop_classes_in_stylesheet） (13) 欄と次の手と閉じると個別の頁とまだ分からないの語の鍵が語の辞書に在る（歯 bvpop_word_keys） (14) 層は bead の事実と局面の出力と板と台帳とグラフの 5 つの口を読み、取り消しの鍵と頁の click を窓の枠の閉じる判定に渡し、App が層を頁に 1 つ置く（歯 bvpop_dom_wiring_text） (15) 着地済みの歯 crates/tsuzuri-surface/tests/parts.rs と frame.rs が全部緑 (16) board_unread は板の口をまだ読んでいない・口が読めない・電文が読めない時にそれぞれ理由 NOT_READ・pipeline の REASON・NO_CONTENT を返し、読めた板では無く、層は板の読めない理由を吹き出しの末に測れていないの 1 行（unmeasured）で出す（歯 bvpop_board_unread_marked）"
