goal = "在りか。差の file docs/design/patch/c-sse-eintr.patch は main 8253da1e（t3-hub.52.180 の在りかの commit）に試作を載せて切った（8 file・206 行）。書く file は tests の下の 8 本だけで、src は書かない。中核の tests/pmisfit.rs は書かず、歯 pmisfit_own_names_clean が tests/pmisroute.rs の歯の名を読むので置き場だけの = で持つ。 なぜ。便 t3-hub.52.180 の着地の主実測（xtask の check・全件の nextest）で、行と関わりの無い歯 pmisfit_sse_arms_and_tells だけが 583 行の読みの expect で Os code 4・Interrupted に落ち、便は main-red になった（同じ木の gate の 2 回の check は通った揺れ）。read の timeout（SO_RCVTIMEO）を付けた socket の読みは、process が止められて再開した周（SIGSTOP と SIGCONT）などに signal の手が無くても EINTR を返しうる（man 7 signal）。std の Read の read は Interrupted を撃ち直さない（read_to_end・read_exact・read_line は撃ち直す）。起草の試作で見立てを確かめた。歯の binary を撃つ間に自分の撃った process だけへ SIGSTOP と SIGCONT を繰り返し送ると、素の read の木は 10 回とも Interrupted で落ち、直した木は 10 回とも通った。 形。(a) tests/pmisroute.rs に私的な助けの関数 reread（読み手と buf と締め切りの Instant を受け、io::Result の usize を返す）を足す。読みを 1 回撃ち、Interrupted で締め切りの前なら撃ち直し、ほかの誤り（時間切れの WouldBlock と TimedOut を含む）と締め切りの後の Interrupted はそのまま返す。誤りを全部捨てて回る形にしない（憲法 P-7）。(b) 歯 pmisfit_sse_arms_and_tells の読みの閉包は、s.read を reread に替え、閉包の締め切りを渡す（expect の字は今のまま）。(c) 偽の読み手 struct Steps（撃たれるたびに頭の 1 つを返し、撃たれた数を数える）と、歯 pmisfit_reread_after_interrupt と pmisfit_reread_other_errors_fall を file の末に足す。歯の名は pmisfit_ で始める（中核の pmisfit_own_names_clean が見る）。頭の doc に 1 行を足し、use の行に io と ErrorKind を足す。(d) ほかの 7 本は、読みの match に腕 Err(e) if e.kind() == ErrorKind::Interrupted => {} を 1 行足すだけ（lstore・server_read・server_src・server_min は Ok(n) の腕の次、mqask は Ok(n) の腕の次、qsig は panic の腕の前）。lidle は 1 回の読みの expect を loop と match に包み、Interrupted なら撃ち直し、ほかは今の expect の字で落とす（use の行に ErrorKind を足す）。締め切りを持つ loop の中の腕は、loop が残りの時間を見て止まるので同じ締め切りの中で撃ち直す。lidle と qsig は 1 回ごとの読みの上限（2 秒と 5 秒）だけを持ち、撃ち直しはその上限を新しく張る。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done の 1 つ目の項は verify の 1 行目、2 つ目と 3 つ目の項は 2 行目（pmisroute の pmisfit_ は新しい 2 本を含む 8 本）、4 つ目の項は 2 行目と 3 行目、5 つ目の項は 4〜10 行目、6 つ目の項は 11 行目で測る。新しい filter の語は足さない（新しい歯は pmisfit_ の行で撃たれる・助けの歯に別の接頭辞を付けると pmisfit_own_names_clean が落ち、pmisfit_ を頭に持つ別の語は今の語 pmisfit_ と部分の字で重なる）。 構造の連鎖。歯の file の字を読む歯を grep で見た。中核の pmisfit_own_names_clean は pmisroute.rs の歯の名を読み、新しい 2 つの名から pmisfit_ を除いた字 reread_after_interrupt と reread_other_errors_fall はその file の filter の語 139 のどれも含まない。lidle_own_names_clean と lstore_own_names_clean は自分の file の歯の名だけを読み（歯の fn は足さない）、hbconf の歯は server_src・server_read・server_min の fn config の本文だけを、wsteady の歯は server_read の歯 server_read_board_changed_within_5s の本文と fs::rename の字だけを読む（腕を足すのは読みの助けの fn で、どれにも当たらない）。 試作と噛み。写しの main 8253da1e で、書いた 8 本の歯 53 本と中核の pmisfit_ 6 本が通り、境界の crate の clippy（--all-targets --no-deps・-D warnings）が rc 0。xtask の check は notes に書く。噛み（変異を 1 つずつ当てて pmisroute の pmisfit_ を撃った）は 4 つ。撃ち直しを外すと pmisfit_reread_after_interrupt が落ち、誤りを全部撃ち直すと pmisfit_reread_other_errors_fall が落ち、締め切りを見ないと同じ歯が落ちる。呼ぶ所を素の read に戻す変異は歯を落とさない（揺れは決まって起きない）ので、差の file の当たり（verify の 1 行目）で見る。 範囲の外。src の下の同じ形の読み（stage の ws.rs の握手の応答の読みと tunnel.rs の Chrome の HTTP の口の頭の読み）は直さない（別の行にするかは席が決める）。server の要求の読み（http.rs）は Interrupted を撃ち直し済み。tests の下の stcli と stlaunch の偽の Chrome の頭の読み（UnixStream・誤りを頭の切れとして記録して閉じる）と、誤りを捨てて回る esig・ntcsrv・server_seat・server_acctwire・evkind は書かない。"

