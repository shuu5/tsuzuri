sk を照らし、消した後に面の歯の全部を撃って照らした）。消した鍵 72 は、地図と眺めと線と拡大（map・views・view_ の 6 つ・bands・lines・matrix・overview・relation・parent・flow・zoom_hint・zoom_reset・gf_refused）、節点の状態と審査の結び（status: の 6 つ・verdict:FAIL・verdict:PASS・stage:Running）、前の一覧の列（col_ の 6 つ）、前の台帳の指標の段（l_epic・l_epics・l_net24・l_question・l_spark・lg_spawnstop・m_age・m_open・m_promo7・m_wait）、口座の段と群の移動（GroupMoved・GroupMovePending・GroupMoveRefused・Tier・group_name・acct_load・proj_acct・others_on・reset_in・resume・to_account・step_approve・step_exit・step_relaunch・state_dir・state_now・external・external_ledger・jump・jump_limit・recommend_seat・plan1・plan2・pros・cons）、時点と見本（at・when・now_btn・mock_not_sent）。stylesheet から無くなる class の名は 114 で、死んだ class 108 と、src は使うが規則が死んだ祖先の下にだけ在った 6 つ（c-none・c-v・done・stop・w・wait・どれも今の画面で効いていない）。残した鍵は、着地済みの歯 helpfig が字で名指す memo_promo・move_state と、accthome が字で名指す pressure と、測れていないを描く nx_na（憲法 P-7）。残した class は、着地済みの歯 frame が字で名指す l4、まだ分からないの meter の unmeasured（P-7）、行 g-accept-fix の差の hunk の中の行に在る m-grp・m-need、着地済みの歯（frame と acctframe が c-sp・accthb が cmd・hsym が off）が stylesheet に求める src の class の唯一の規則 .lrow .c-sp・dialog.hbdlg .cmd・#next .nxlist li.off の 3 つを残したことで残る祖先の lrow・hbdlg・nxlist。接頭辞で組む鍵と class（e: の辺の型 21 ほか）は消していない。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。(1) は verify の 1 行目。(2)〜(6) は verify の 4 行目（歯の file tests/bvlex.rs・filter bvlex_）の 5 本 bvlex_keys_named_in_src・bvlex_classes_named_in_src・bvlex_prefix_sites_in_src・bvlex_keep_lists_unnamed・bvlex_lexer_reads_literals。(7) は verify の 5 行目から 10 行目（残す名を字で名指すか stylesheet に求める着地済みの歯の file 6 本）。clippy の 2 行と xtask の check（最後の行）は差の全部を見る。 構造の連鎖。着地済みの歯で stylesheet と語の辞書を読む file は多い（style.css の字を持つ着地済みの歯の file は 53・語の辞書の鍵の全部を回す着地済みの歯は helpfig・hsym・pclosed・pfold）。この行はどの歯の file も書き替えない。helpfig は図を持つ注の鍵の組を、hsym は注の中の記号の名の組と記号の class を、frame と acctframe は DOM の class の全部が stylesheet に在ることを、accthb と accthome は使う語の鍵と class を見るので、残す一覧はその字から決めた。 試作と噛み。試作の起点は 83ef6a79、試作の commit は 285b90c7（3bc062db の上に歯の組む所の見分けを足した 1 つ）。書く file は write-set の書く file と同じ（git diff --name-only の 3 file）。この木で面の歯 838 本（起点の 833 本に 5 本を足す）と clippy（host と wasm の target）と xtask の check が緑。噛みは変異 10（使われない鍵を足す・消した鍵を戻す・使われない class の規則を足す・消した規則を戻す・接頭辞 st- と src に無い値の class を足す・注の中の字だけで引く class を足す・r- の組む所を外す・残す class を src が引く・残す class の規則を消す・起点の 2 file に戻す）で、どれも歯 bvlex の file が rc 100 で落ち、対照は rc 0。 流す時と順。depends は g-dead-sweep-b（鎖）と g-accept-fix（同じ style.css を書く）。g-accept-fix の差の style.css の hunk の行（起点の 641〜646 行・1160〜1166 行・1183〜1200 行）と前後の 1 行は、この差が替えない。起点に g-accept-fix の style.css の差を当てた木でこの差の当たりを見て rc 0、この差を当てた木で g-accept-fix の style.css の差の当たりを見て rc 0。 範囲の外。id の選び（次の一手の block の id ほか）は見ない（歯は class だけ）。src の使い手の無い関数（候補の外の一覧）は消さない。地図の面の部品は使い手が無いが候補の外で、e: の組む所が残るので辺の型の鍵も残る。残した 3 つの規則の祖先（lrow・hbdlg・nxlist）を外すには、c-sp・cmd・off に生きた規則を与えるか着地済みの歯の求めを替える後の行が要る。"

[[contract]]
id = "c-case-unreadable"
title = "局面の出力の電文 CaseDoc に欄 unreadable を足し、中核の cases_of は出力の字が在るのに読めない周（JSON でない・版が 1 でない・部品の列が無い・古さの印が読めない）に真、出力が無い周と読めた周に偽にする（要件 FR13 の読めない版の周を「まだ分からない」と分ける電文と中核の段・面の示しは後の行・試作の差の file docs/design/patch/c-case-unreadable.patch を当てる）"
req = ["FR13"]
section = "32"
write-set = ["crates/tsuzuri-contract/src/case.rs", "crates/tsuzuri-contract/tests/cform_case.rs", "crates/tsuzuri-contract/tests/snapshots/case.json", "crates/tsuzuri-core/src/case.rs", "crates/tsuzuri-core/tests/bvcase.rs"]
verify = ["git apply --reverse --check docs/design/patch/c-case-unreadable.patch", "cargo clippy -p tsuzuri-contract -p tsuzuri-core -p tsuzuri-boundary -p tsuzuri-surface --all-targets --no-deps -- -D warnings", "cargo nextest run -p tsuzuri-core --test bvcase --no-tests=fail bvcase_", "cargo nextest run -p tsuzuri-contract --test cform_case --no-tests=fail bvcform_", "cargo run -q -p xtask -- check"]
size = "S"
done = "(1) git apply --reverse --check docs/design/patch/c-case-unreadable.patch が rc 0（差の file の hunk が全部木に在る） (2) 中核の関数 cases_of は、出力の字が JSON でない・版が 1 でない・部品の列が無いか列でない周と、出力が fixture tests/fixtures/case/lifecycle.json の字で古さの印の字が空・JSON でない・版が 1 でない・同じ種類の印が 2 つ在る周に、電文 CaseDoc の欄 unreadable を真にし、parts は Unknown（歯 bvcase_unreadable_flag_on_present_output） (3) 出力の字が空の周は、古さの印が無いか JSON でないか字が空でも欄 unreadable が偽で parts は Unknown、出力が fixture lifecycle.json の字の周は、古さの印が無い・0 件の印・fixture lifecycle.stale の印のどれでも欄 unreadable が偽で部品は 9 つ（歯 bvcase_unreadable_flag_off_when_absent_or_read） (4) 着地済みの歯 bvcase_unreadable_is_unknown は、欄 unreadable を除いて parts が Unknown・generated_at が None・stale が空を見て通り、ほかの着地済みの bvcase_ の歯も通る（verify の 3 行目） (5) 欄 unreadable は偽なら電文に鍵を置かず、鍵の無い電文は偽に読み、真なら電文の末に鍵 unreadable と値 true を置く（歯 bvcform_unreadable_defaults_false） (6) snapshot tests/snapshots/case.json の case::CaseDoc の見本は 3 つで、3 つ目は parts が unknown で unreadable が true（歯 bvcform_snapshot_matches）、見本は全部往復で同じ値と字に戻る（歯 bvcform_roundtrip_all） (7) 契約と中核と境界と面の 4 つの crate の clippy（--all-targets --no-deps・-D warnings）と xtask の check が rc 0（verify の 2 行目と 5 行目）"
goal = "在りか。差の file docs/design/patch/c-case-unreadable.patch は main 01ace7f3（ノート surface-wave26b の第 0.13 版の木）に試作の commit 47861204（写し drafts/w74c・branch main）を載せて切った（5 file・9,895 byte・+108 −2）。main の木で git apply --check が rc 0、試作の木で git apply --reverse --check が rc 0。書く file は契約の crate の src/case.rs と歯の 2 file（tests/cform_case.rs・tests/snapshots/case.json）と、中核の crate の src/case.rs と歯 tests/bvcase.rs だけで、境界と面の crate は書かない。席の積みの木の最後（drafts/s26b の branch stack5・eb211e5b）にも git apply --check が rc 0 で当たる（積みの行の差はこの 5 file を書かない）。 なぜ。要件 FR13（第 0.22 版）は、局面の出力がまだ無い間は「まだ分からない」、読めない版の出力の周は「読めない」と示すと書く。着地済みの中核の関数 cases_of（行 c-case-read・ノート surface-wave26a）は、出力が無い周と、出力が在って JSON でない・版が 1 でない・部品の列が無い周と、古さの印の file が読めない周を、どれも parts が Unknown・generated_at が None・stale が空の同じ電文にする。電文で 2 つを分けられないので、面は「読めない」を出せない（起草の係 w74b の見立て）。判断の記録 ADR-27 の決定 (10) の、読めない間は面がその欄を「まだ分からない」と出す字とは、読みの失敗（file が無いか取れない）は「まだ分からない」・取れたが版が読めない出力は「読めない」と読んで両立させる。この行は電文と中核で 2 つを分ける段だけを置き、面の示し（行 g-unref-lc の見出しと行の局面の字・行 g-ledger-trim の窓の一覧）は後の行が持つ。 形（要約・字は差の file）。(a) 契約の型 CaseDoc の欄の末に欄 unreadable（bool）を足す。属性は serde の default と skip_serializing_if（std::ops::Not::not・型 GroupRow の欄 park と同じ形）で、偽は電文に鍵を置かず、鍵の無い前の電文は偽に読む。doc の 3 行に欄の名と意味（真の周・偽の周・面の示し）を書く。(b) 中核の cases_of は、部品が「まだ分からない」の電文（関数の頭の局所の値 unknown）の欄 unreadable を、出力の字が空でなければ真にし、読めた電文は偽にする。出力の字が空（境界の読み手が、出力の file が無いか読めない時に渡す字）の周は、古さの印が読めなくても偽のまま（要件 FR13 の出力がまだ無い間）。読みの順と Unknown にする条件は替えない。module の doc に 2 行、関数の doc に 1 行を足す。(c) 契約の歯 tests/cform_case.rs は、CaseDoc の見本の 2 つに unreadable の偽を足し（2 つ目の注を出力が無いに直す）、3 つ目の見本（parts が Unknown・unreadable が真）と歯 bvcform_unreadable_defaults_false を足し、use に契約の wire を足す。snapshot は 3 つ目の見本の 6 行が増える。(d) 中核の歯 tests/bvcase.rs は、着地済みの歯 bvcase_unreadable_is_unknown の見本に unreadable の偽を足して、比べを欄 unreadable を除いた形（struct の更新の構文で偽に揃えて見本と比べる）にし、歯 bvcase_unreadable_flag_on_present_output と bvcase_unreadable_flag_off_when_absent_or_read を足す。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done の 1 つ目の項は verify の 1 行目、2 つ目から 4 つ目の項は 3 行目（bvcase_ の 7 本・足すのは 2 本）、5 つ目と 6 つ目の項は 4 行目（bvcform_ の 4 本・足すのは 1 本）、7 つ目の項は 2 行目（4 つの crate の clippy）と 5 行目（xtask の check）で測る。clippy に境界と面の crate を入れるのは、CaseDoc を使う所（境界の routes/cases.rs・routes/pipeline.rs・server/board.rs と面の widgets/pop.rs）が欄を足した後も組み立てられることを見るため。新しい filter の語は足さない（足す歯は着地済みの接頭辞 bvcase_ と bvcform_ の file に置く）。 構造の連鎖（main 01ace7f3 で grep）。CaseDoc の struct の字を組む所は、中核の src/case.rs の 2 か所と、歯の cform_case.rs の 2 か所と bvcase.rs の 1 か所だけで、どれも差の中に在る。CaseDoc を戻りの型に持つ歯の fn（境界の bvcroute.rs の doc_of・中核の bvlc.rs の doc と bvqcol.rs の known）は cases_of の値か decode の値を返すので書き替えが要らない。境界の口 GET /api/cases は cases_of の電文をそのまま encode するので、欄はそのまま口に載る。面の crate は CaseDoc を decode して parts だけを読む（widgets/pop.rs）。中核の ledger/unreflected.rs は cases_of の parts と stale だけを読み、指標の電文 LedgerStats は替えない。契約の群の見張り tests/cfsplit.rs の群の表と snapshot の file の名は替えない。bvcase.rs と cform_case.rs の字や歯の名を読むほかの歯は無い。 試作と噛み。写しの main 01ace7f3 の上の試作で、4 つの crate の clippy（--all-targets --no-deps・-D warnings）が rc 0、契約と中核の crate の歯が全部（380 本）通り、境界の歯 bvcroute_ の 6 本も通る。xtask の check（workspace の歯 2,982 本・workspace の clippy・wasm の clippy・面の組み立て）も rc 0。噛み（変異を 1 つずつ当てて bvcase_ か bvcform_ を撃った）は 7 つで、全部が名指す歯を落とした。無い出力も真にすると bvcase_unreadable_flag_off_when_absent_or_read が落ち、いつも偽にすると bvcase_unreadable_flag_on_present_output が落ち、読めた電文も真にすると off の歯が落ち、古さの印の壊れを偽にすると on の歯が落ち、JSON でない出力を偽にすると on の歯が落ち、偽も鍵を置くと bvcform_unreadable_defaults_false と bvcform_snapshot_matches が落ち、鍵の無い電文を断ると bvcform_unreadable_defaults_false と bvcform_roundtrip_all が落ちる。対照（doc の字だけの変異）は落ちない。 流す時と順。depends は空（契約と中核の crate だけを書き、着地済みの行と 26b のほかの行の差の file のどれとも書く file が重ならない）。後の行 g-unref-lc の差の歯 tests/bvuphase.rs は CaseDoc の struct の字を欄 unreadable なしで組むので、この行の着地の後はその差のままでは面の crate の歯が組み立てられない。逆に g-unref-lc が先に着地すると、この行の verify の 2 行目（面の crate の clippy の --all-targets）が落ちる。だから g-unref-lc の差を切り直す時にその歯の CaseDoc の字へ unreadable の偽を足し、g-unref-lc の depends にこの行を足して、この行を先に流す。席の積みの木 eb211e5b にこの差を当て、歯 bvuphase.rs の CaseDoc の字に unreadable の偽の 1 行を足した木で、bvuphase_ の 5 本と行 c-cases-watch の bvlcw_ の 3 本が通り、4 つの crate の clippy が rc 0 だった。 範囲の外。面の示し（「読めない」の語と、見出しと行の局面の字と窓の一覧）は書かない（行 g-unref-lc と g-ledger-trim）。境界の読み手 server/cases.rs は替えない。出力の file が在っても読みの誤り（権限・UTF-8 でない字）は空の字になって「まだ分からない」に倒れ、古さの印の file の読みの誤りは空の字になって（出力の字が在れば）「読めない」になる（今の入力の形のまま）。局面の出力の見張り（行 c-cases-watch）が比べる中身に欄 unreadable を入れるかは、その行が決める。中核の unreflected と指標の電文 LedgerStats は替えない。"
