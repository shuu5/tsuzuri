goal = "在りか。起点は main 2ed91cab（写し drafts/w70b）。差の file docs/design/patch/c-deliver-retry.patch は、main 2ed91cab と試作の commit bef37c36（branch w70b-r2・親は行 c-ruling-reread の試作 ad5ebfc8 で、この行の 3 file はその commit で触らない）の git diff --no-color --full-index を、この行の書く 3 file に絞って切った（3 file・22,693 byte）。main 2ed91cab の木で git apply --check が rc 0、bef37c36 の木で git apply --reverse --check が rc 0。 なぜ。memo t3-hub.72 の候補 a（印の無い答えの配達を、間を空けて撃ち直す・器の断りの字を log に残す）の残り。ノート surface-wave23a の行 e-deliver-retry（2026-09-29 着地）で、答えごとの別の thread の redeliver が、器が受けない間 DELIVER_STEP 15 秒を空けて上限 DELIVER_SPAN 30 分まで撃ち直し、器の断りの字を NOT_TAKEN の行に残す形になった。残る穴は、その thread が process の中にだけ在り、server の起こし直しで消えること。席が idle の間は停止の hook も撃たれないので、起こし直しの前に答えて器に断られた裁定は、次に誰かが席を起こすまで届かない。 形。ruling.rs に字 SWEEP_FOUND（起動の周に印の無い裁定を撃ち直す）と SWEEP_UNREAD（起動の周の台帳の読みが落ちた（撃ち直さず、印の無い裁定は席の停止の hook が拾う））と、pub fn ｀sweep｀・｀id_minute｀・｀sweep_at_start｀ を足す。｀id_minute｀ は裁定の id の最後のコロンと最後の - の間の 14 字（UTC の年月日 T 時分 Z の形・数は空でない数字）を返し、形が違えば None（字の順は時刻の順と同じ）。｀sweep｀ は配達の先と書きの持ち物と Source と pace と今の epoch 秒を受け、台帳を text_within の READ_TIMEOUT で 1 度読み、中核の undelivered（印の無い裁定・台帳の順）のうち、｀id_minute｀ が今から pace の上限を引いた時刻の minute の字より前でないものだけを 1 つずつ荷（id はその裁定の id・問いと裁定の組は 1 つ）にし、前の荷の redeliver が終えてから次の荷の redeliver を pace で撃って、撃った荷の数を返す。上限より前の裁定は、答えごとの撃ち直しも上限で止めていたので撃たない。撃つ裁定が在れば撃つ前に SWEEP_FOUND の 1 行（裁定の id を , で並べた字と席）を書く。読みが落ちるか字が読めなければ SWEEP_UNREAD の 1 行（落ちた訳）を書いて撃たない。｀sweep_at_start｀ は Config を受け、読むだけの server と、--seat か --state-dir の無い server では始めずに偽を返す。ほかは server の裁定の書きと同じ引数（--seat・--state-dir・--scribe2・--repo・--bdw）から配達の先と書きの持ち物を作り、--bd の合流しない Source で、別の thread の ｀sweep｀ を PACE と今の時刻で始めて真を返す（待たない）。thread の閉じは block の形で、着地済みの歯 dretry_spawns_use_pace が数える redeliver の spawn の字と PACE の後の 2 つの閉じ括弧の字の数は変わらない。src/main.rs の serve は口の住所の行を書いた後、server の run の前に ｀sweep_at_start｀ を 1 度撃ち、頭の doc に 1 行を足す。新しい値は足さない（PACE と READ_TIMEOUT は着地済みの code の型付きの定数・規則の表の行は要らない）。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done (1) は verify の 1 行目、(2) は 2 行目。done (3)〜(7) は 3 行目（歯の file tests/bvdsweep.rs・filter bvdsweep_）の歯 bvdsweep_words・bvdsweep_fires_unmarked_in_order・bvdsweep_quiet_when_nothing・bvdsweep_start_gates・bvdsweep_serve_sweeps_at_start。done (8) は 4〜14 行目（着地済みの歯の file ごとに 1 行）。最後の 1 行 xtask の check は done の項を持たない。 構造の連鎖。ruling.rs は中核の delivery から undelivered を、server の module から Config を新しく引く。撃ち直しの周は見張りの周に置かない。見張りは受け手（知らせの接続）が 0 人の間は台帳を読まず、受け手が居ても store の印が動かなければ 600 秒ごとにしか読まない。見張りの周で器を撃つと、器の 1 回の撃ち（上限 DELIVER_TIMEOUT）が見張りの読みも止める。起動の周だけにし、周期の掃きにしないのは、周期にすると答えごとの thread が撃ち直している裁定を同じ時に 2 度撃つため。それを避ける撃ち直し中の表は Shared（src/server/mod.rs）に置くことになり、mod.rs は鎖の行 c-cases-watch が書く。器の seat deliver は撃つ回を絞らない（器の ADR-0077）。断る周は 1 key も送らない。送ったが確かめられない周（unconfirmed）を撃ち直すと、指し示しの 1 行が 2 度届くことがある（行 e-deliver-retry と同じ・入力欄に字が残れば次の周は input-busy で断られる）。着地済みの歯 fserve と server_ask の fixture の印の無い裁定（2026-09-24 の分）は上限より前なので、起動の掃きは撃たず、偽の器の回の数えは変わらない。歯の偽の bd は作業場の out.json（歯の file が今の分と 2 時間前の分で組む 4 本の台帳）を出し、無ければ rc 1。偽の bdw と偽の器は回ごとの argv を記録して rc 0。歯の撃ち直しの組は間 50 ms と上限 2000 ms。tz の binary の歯は 30 秒を上限に偽の器の 1 回目を待って止める。 試作と噛み。試作は main 2ed91cab の写しで書き、書く file は write-set の 3 file で閉じる。境の crate の全部の歯を cargo nextest run -p tsuzuri-boundary で撃ち、clippy と xtask の check と xtask の歯も撃った（結果は係の notes）。噛みは 8 つ（読むだけの server の門を外す・serve から ｀sweep_at_start｀ を外す・印の在る裁定も撃つ・上限の窓を外す・全部を 1 つの荷にする・台帳の逆の順に撃つ・SWEEP_FOUND の字を替える・｀id_minute｀ が形を見ない）で、どれも歯 bvdsweep_ のどれかが落ちる。 流す時と順。depends は空。同じノートの行 c-ruling-reread とは書く file が重ならない（あちらは policy.rs と routes/policy.rs）。鎖の行 c-cases-watch が書く src/server/mod.rs と cases.rs は書かない。 範囲の外。答えごとの撃ち直しの間と上限（PACE）は変えない。30 分の上限の後の撃ち直しは足さない（器が断り続けるのは席が idle のまま入力欄に字が在るか pane が無い形で、撃ち続けても届かず、席が turn に入れば終わりの停止の hook が拾う）。server の log を起こし直しで切り詰める起動の script は repo の外の席の道具で、この行では書かない。器の側の見張り（memo t3-hub.72 の候補 c と memo t3-hub.70）は持ち主が時期を決める。"

