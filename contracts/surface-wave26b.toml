EN_KEY は item が使う（view.rs はこの行で書かない）。kit.rs の node_item と item_view は抜けの検査の block gaps が使い、ALERT_STYLE は item_view と block node・askpage・nodearound が使う。pipeline.rs の stage_sym は札の DOM と widgets/pop.rs が使い、stage_word は ledgerlist と wins.rs と widgets/keyline.rs が、kcard は札の組み立てが、ci_key は widgets/keyline.rs と widgets/pop.rs と札の DOM が使う。ledger.rs の EMPTY・NO_OPEN・OUTSIDE・CLOSED は ledgerlist が使う。同じ名の別の関数（account の module の ledger の body・gaps.rs の body と mark と型 Mark・view.rs の mark・ask.rs と batch.rs の listed・account の session と projects と home の Group・account の session の stage_word・nodearound の中の item_view）は別物で、触らない。view.rs の画面の状態（型 Screen・Board・EpicGroup・関数 board・questions・ledger_groups）は board.rs が context に置くだけで読み手が無いが、board.rs を書く別の鎖と同じ所なので、この行の外に残す。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。(1) は verify の 1 行目。(2) と (3) は verify の 3 行目（歯の file tests/bvsweep.rs・filter bvsweep_）の 2 本。(4) は verify の 4 行目から 13 行目（書き替えた着地済みの歯の file 10 本）。clippy の行（2 行目）と xtask の check（最後の行・wasm の target の clippy と面の組み立てを含む）は差の全部を見る。 構造の連鎖。消す歯は 7 本（lstg_stages_from_board・lstg_list_items・lhome_listed_hides_closed・lhome_groups_rules・lhome_fixture_hides_closed・lhome_empty_and_count・cadl_group_cards_rules）。丸ごと消す歯の file は無い（lstg・lhome・cadl は残る関数の歯も持つので、消す関数の歯だけを外す）。lstg は札の段の字の歯 lstg_word_rules を残し、DOM の字の歯 lstg_dom_wiring から kit の item_view の段の記号と stages と staged_item の字を外し、名の数を 5 から 3 にする。lhome は 4 本を消し、一覧に出さない状態の字と閉じていない行が無いときの 1 行の値を DOM の字の歯 lhome_list_draws_body へ移し、名の数を 6 から 2 にする。cadl は組の card の歯と助けの関数 unread・graph_text・graph_doc を消し、歯の数の下限を 4 から 3 にする。lkind は段つきの項の 8 行と import を外す。lgrp は画面の歯から件数と一覧の中身の 8 行を外す（問いの一覧の断言は残す）。ledgerblock は一覧の件数と中身の助け list_unchanged と ledger_rows と known_screen と外形の 2 行（count と body の型）を外す。frame は台帳の一覧の中身の 8 行と known_screen と lost_and_empty の台帳の一覧の行を外す。parts は台帳の一覧の中身の 1 行を外す。board_min は件数の 2 行を外す。itemlink は欄 stage の 1 行を外す。外す import は使わなくなった物だけ。 試作と噛み。試作の起点は a25843e0。書く file は write-set の中で閉じる（試作の commit の差の file の数と write-set の書く file の数が同じ 14）。cargo clippy（host の --all-targets と wasm の target）・面の crate の歯の全部（849）・xtask の check が緑。噛みは変異 8 つ（ledger.rs に件数の関数を戻す・kit.rs に型 Staged を戻す・pipeline.rs に関数 stages を戻す・ledger.rs の use に LEDGER_UNREAD を残す・item_view に段の記号の束縛を戻す・項の右の字から種類を落とす・Item の欄の並びを替える・ledger.rs の頭の doc に staged_body の字を戻す）で、どれも名指した歯が落ちた（rc 100・前の起点 50c300b3 で 8 つを撃ち、積みの木で字が替わった pipeline.rs の変異はこの起点で撃ち直した）。席の積みの木の最後の commit 1268ca21（前半の 11 行と後半の 6 行の全部）で xtask の check が rc 0（2,992 本）。 流す時と順。depends は g-ledger-trim（積む順は g-select → g-one-screen-a → g-one-screen-b → g-layout → g-ledger-trim → この行）。差はその順に積んだ木の上で切ったので、前の行の着地の後に当たる。前の行の足し（pipeline.rs の use の行の前後・関数 card_keys の BTreeMap・ledgerlist.rs と wins.rs）は替えない。 範囲の外。view.rs の画面の状態（型 Screen・Board・EpicGroup と関数 board・questions・ledger_groups と board.rs の context の置き）の掃除・使わなくなった前の段の class と語の鍵の掃除（行 g-help-sweep）・block askpage の要否（行 g-one-screen-a が問いの頁を消した後の木で、item と kind_word と row_mark の使い手は askpage だけ・席が決める）。"

