の連鎖。消す歯と書き替える着地済みの歯は無い。行 g-pop の関数 pop の欄の組みは替えず、層で with_runs を後に通すだけなので、bvpop の歯は字を替えずに緑。runflow は pop の Fact・Pop・STAGE_KEYS・UNKNOWN_KEY・Val を use し、pop は runflow の Seg と Hist を欄の値に持つ。 試作と噛み。試作の起点は aae47359、試作の commit は 6a963467。書く file は write-set の中で閉じる（git diff --name-only が write-set の 6 と同じ）。試作の木で面と契約の歯が全部緑、clippy（host と wasm）と xtask の surface-build と check が rc 0。変異は鎖の最後の試作の木（30de4099）で 7 当て、done (4)〜(11) の各項が少なくとも 1 つで落ちた（撃った歯の file は bvstep と bvpop で、bvpop は落ちなかった・対照は前と後の rc 0）。(s1) 表の RateLimited を Queued に → bvstep_stages_are_vessel_eleven と bvstep_unknown_step_word・done (4)(8)。(s2) 次の段の event で段を閉じる行を消す → bvstep_flow_three_steps_with_minutes・bvstep_running_step_open_end・bvstep_unknown_step_word・bvstep_with_runs_places_facts・done (5)(6)(8)(10)。(s3) 走っている段の印を半角の波に → bvstep_running_step_open_end・done (6)。(s4) 結びを審査の判定から先に引く → bvstep_history_per_run・done (7)。(s5) commit の字数を 8 に → bvstep_landed_commit と bvstep_with_runs_places_facts・done (9)(10)。(s6) 流れを差す所を口座の前に → bvstep_with_runs_places_facts・done (10)。(s7) 層の with_runs を外す → bvstep_dom_wiring_text・done (11)。席の積みの木の最後の commit e5082775（11 行の全部）で xtask の check が rc 0（2,988 本）。 流す時と順。depends は g-pop。後の行 g-pop-why がこの行の試作の commit を起点に続く。 範囲の外。gate の観点ごとの件数（findings）の表と審査の根拠の全文を吹き出しに出すこと（個別の頁の run の時間軸が持つ）、走行の費用の欄、段の流れの帯の hover。"

