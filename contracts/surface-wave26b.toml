goal = "在りか。起点は席の積みの木（写し drafts/s26b・branch stack2・main 62a2f8fd の上に第 26 波 b の 11 行を g-win-frame → g-topbar → g-win-parts → g-ask-win → g-pop → g-pop-flow → g-pop-why → g-pipe-cards → g-list-groups → g-list-head → g-unref-lc の順に 1 行 1 commit で積んだ木）の前の行 g-pop-flow の commit 1f6dba5c。差の file docs/design/patch/g-pop-why.patch は、その上のこの行の commit 49d41ad5 との git diff --no-color --full-index で write-set の書く file の 3 だけを切った（20,284 byte）。1f6dba5c の木で git apply --check が rc 0、49d41ad5 の木で git apply --reverse --check が rc 0。係 w66b の試作（起点 6a963467・試作の commit 2175d3c6）の差を席が積みの木に当て直したもので、file ごとの足す行と消す行は係の差と同じ（替わったのは前の行の足しと並ぶ所の前後の字と位置だけ）。main 62a2f8fd の木には当たらない（前の行 g-pop-flow の着地の後に当てる）。行 g-pop と g-list-groups の直し（板が読めない時に札が無いと見せない・憲法 P-7・係 w70a）の後に当て直した積みの木（写し drafts/w70a の branch stack6b・行 g-ask-win は v0.5 の差の 29df800a）では、この行は e8318890 の上の commit dc4feda6 で、差の file はその 2 つの間の差（20,356 byte）。 なぜ。判断の記録 ADR-27 決定 (6)（Queued の理由の語を平易な字で出す・Blocked の相手は欄 links.on と links.runs・承認待ちの相手は持ち主）と決定 (7)（Blocked は待つ相手と待つ理由・Queued はまだ起きない理由）と決定 (10)（知らない理由の語はまだ分からない・閉じた列で持たない）。器の局面の出力の理由は語だけで詳細を持たない（器の席の答え）。予約（reserved）の相手は器の commit 417e4754（局面の出力の reserved の links.on に予約した bead を載せる）の後は links.on に載るので、載っていれば出し、空ならまだ分からない。 形。src/widgets/pop.rs に、器の列の待ちの理由の 12 語の表 REASONS と鍵の頭 REASON_HEAD（qr と半角のコロン）と、語の鍵（reason_key・詳細を外す）と欄の値（reason_val）と、札の待ちの種類（wait_of・契約の部品が contract-queued なら部品の理由と links.runs・contract-running で段が Blocked なら承認待ち・ほかは札の理由）と、吹き出しへの欄の足し（with_why）を純粋な関数で足す。層は with_runs の後に with_why を通す（1 行）。行 g-pop の関数 pop と wait_on は替えない。vocab.json は rephrase の末に 17 語（pf_why・pf_wait_why・pf_wait_runs・pw_owner・pw_approval・qr の 12 語）を足す。計画の表はこの行の write-set に src/project/pipeline.rs を名指したが、札の要の 1 行は行 g-pipe-cards が組むので、この行は pipeline.rs を書かない。器の今の main の語は計画の 11 語に sibling を足した 12 語（器の pipe/dispatch.rs）。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done (1) は verify の 1 行目。done (2) は 2 行目、done (3) は 3 行目。done (4)〜(9) は 4 行目（歯の file tests/bvwhy.rs・filter bvwhy_）の歯 bvwhy_twelve_reason_words_in_vocab・bvwhy_unknown_reason_word・bvwhy_queued_why_from_case・bvwhy_partners_from_links・bvwhy_approval_partner_is_owner・bvwhy_dom_wiring_text。done (10) は 5〜6 行目。最後の 2 行は done の項を持たない。 構造の連鎖。消す歯と書き替える着地済みの歯は無い。bvpop と bvstep の歯は関数 pop と with_runs だけを撃つので字を替えずに緑。局面の語の contract-queued と contract-running は中核の pipeline の定数の写し（面の crate は中核の crate に依存しない）。 試作と噛み。試作の起点は 6a963467、試作の commit は 2175d3c6。書く file は write-set の中で閉じる。試作の木で面の歯 799 本が緑、clippy（host と wasm）が rc 0（xtask の check は鎖の次の行の試作の木で撃った）。変異は鎖の最後の試作の木（30de4099）で 6 当て、done (4)〜(9) の各項が少なくとも 1 つで落ちた（撃った歯の file は bvwhy と bvpop と bvstep で、bvpop と bvstep は落ちなかった・対照は前と後の rc 0）。(w1) 表の sibling を siblings に → bvwhy_twelve_reason_words_in_vocab・done (4)。(w2) 理由の語の詳細を外さない → bvwhy_unknown_reason_word・done (5)。(w3) 列の待ちの理由を部品でなく札から引く → bvwhy_queued_why_from_case と bvwhy_partners_from_links・done (6)(7)。(w4) 相手の便を links.runs が空の時に出す → bvwhy_partners_from_links・done (7)。(w5) 承認待ちの段の比べを Queued に → bvwhy_approval_partner_is_owner・done (8)。(w6) 層の with_why の行を消す → bvwhy_dom_wiring_text・done (9)。席の積みの木の最後の commit e5082775（11 行の全部）で xtask の check が rc 0（2,988 本）。 流す時と順。depends は g-pop-flow。後の行 g-pipe-cards が wait_of と wait_on と APPROVAL_KEYS を札の要の 1 行に使う。 範囲の外。理由の詳細（コロンの後の値）を出すこと（器の局面の出力が持たない）、手番の語、承認の button。"

