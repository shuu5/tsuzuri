ata-pop-card を消す変異は cmark と kcardlink も・with_lines を外す変異は cadopt も・変異の無い対照は rc 0）。done (4) の 4（注意の秒を 2400 に・比べを以上に・Queued でない段にも・時刻の無い札にも）は bvcols_queued_warn_is_rule_r37。done (5) の 5（Blocked の経過を外す・頭の字の代わりを空に・起票からの経過を列の経過に・注意の印を外す・注意の class を kl に）は bvcols_key_line_per_stage。done (6) の 15（理由を切らない・切る字数を 21 に・理由の無い時の段の名を空に・止まりの class を kl に・止まりと Gated と Running の run の回を札の欄でなく固い 2 に・Gated と Questioned の run の回を外す・Questioned が理由を出す・Questioned の class を klstop に・Running の口座を外す・着地の class を klstop に・着地の CI の語を外す・閉じた札の枝を外す）は bvcols_key_line_run_stop_land。done (7) の 3（事実の short を使わない・代わりを id だけに・台帳の題を 30 字に切る）は bvcols_short_title_or_fallback。done (8) の 6（相手 1 つの頭を待ちの語だけに・2 つ以上の数を外す・承認待ちを待ちの語に・分からない時を空に・Blocked でない段にも頭の字・起票の時刻を事実から読まない）は bvcols_lines_from_pop_wait。done (9) の 7（data-pop-card を消す・hover を戻す・bead の事実の口を読まない・時計を ticker でなく今に・要の 1 行を時計でなく今で組む・klstop の class を stylesheet から外す・with_lines を外す）は bvcols_click_not_hover で、data-pop-card では書き替えた着地済みの cmark_dom_text と klink_dom_anchor_keeps_hover も、with_lines では cadopt_dom_wiring も落ちた（done (10)）。前の歯（627a33b0）では、このうち 8（理由を切らない・切る字数を 21 に・止まりと Gated と Running の run の回を固い 2 に・Questioned が理由を出す・台帳の題を 30 字に切る・時計を ticker でなく今に）が生き残った。前の噛み (c1)〜(c9)（係 w66b と w73a）は、この 40 の中の同じ形の変異に含まれる。stack7d の 01159fca の後の 13 commit（g-list-groups から g-accept まで）を 544d562c の上へ順に cherry-pick して衝突は 0（各 commit の差は stack7d と同じ字）で、その先端 99b1760a は、627a33b0 の上に積んだ先端 82ed578a（xtask の check が rc 0・3,011 本）と歯の file tests/bvcols.rs だけが違い、99b1760a で面の crate の clippy（host・全 target）と歯の file bvcols が rc 0。 流す時と順。depends は g-pop-why（待つ相手の読みと承認の語を使う）。台帳の一覧の行の口（data-pop-row）と epic の chip の絞りは選びの行。後の行 g-list-groups（台帳の一覧の組）は style.css を書くので、この行の commit の上に積んだ鎖で続く。 範囲の外。epic の chip で札を絞ること・札と行の選びの印（選びの行）、meta の行の回数と経過の字の掃除と節点の card の値の組みの削除（後の掃除の行）、スマホの段の tile（幅の 3 段の行）。"

