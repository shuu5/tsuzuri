 bvpop_）の歯 bvpop_common_rows_in_order・bvpop_unknown_fields_marked・bvpop_blocked_targets_with_stage・bvpop_queued_since・bvpop_stop_reason_full・bvpop_landed_time_ci・bvpop_toggle_and_outside・bvpop_place_right_left_below・bvpop_classes_in_stylesheet・bvpop_word_keys・bvpop_dom_wiring_text。done (15) は 5〜6 行目（着地済みの歯の file ごとに 1 行・口の path の字の決まりと見出しの語と class の決まり）。最後の 2 行（xtask の surface-build と check）は done の項を持たない。 構造の連鎖。消す歯は無い。書き替える着地済みの歯も無い（parts.rs と frame.rs は字を替えずに緑・口の字を契約の定数から引くので parts の決まりに合う）。契約の crate の足しは定数 1 つだけで、電文の形と snapshot は替えない。窓の枠の行の部品（closes・Hit・FULL_MAX_PX）を use する。 試作と噛み。試作の起点は 6cba15ef、試作の commit は aae47359。書く file は write-set の中で閉じる（git diff --name-only 6cba15ef aae47359 が write-set の 7 と同じ）。試作の木で面と契約の歯が全部緑、clippy（host と wasm の target）と xtask の surface-build と check が rc 0。変異は鎖の最後の試作の木（30de4099・この行の字を後の行が替えていない所）で 11 当て、done (4)〜(14) の各項が少なくとも 1 つで落ちた（nextest の落ちは rc 100・変異の後は file の字を元に戻した・対照は変異の前と後の撃ちの rc 0・撃った歯の file は bvpop と parts と frame と hsderive で、落ちたのは毎回 bvpop の歯だけ）。(p1) COMMON_KEYS の epic と設計の行の順を入れ替える → bvpop_common_rows_in_order・done (4)。(p2) 待つ相手の台帳で閉じた相手を外す filter をいつも真に → bvpop_blocked_targets_with_stage・done (6)。(p3) 起票の欄を時刻 0 に → bvpop_unknown_fields_marked・done (5)。(p4) toggle をいつも開くに → bvpop_toggle_and_outside・done (10)。(p5) GAP_PX を 10 に → bvpop_place_right_left_below・done (11)。(p6) 600 px 以下の幕を display none に → bvpop_classes_in_stylesheet・done (12)。(p7) Questioned の次の手を run の記録に → bvpop_stop_reason_full・done (8)。(p8) CI の欄をいつもまだ分からないに → bvpop_landed_time_ci・done (9)。(p9) board.rs の層の行を消す → bvpop_dom_wiring_text・done (14)。(p10) 列に入った時刻の欄をいつもまだ分からないに → bvpop_queued_since・done (7)。(p11) 語の辞書の鍵 pop_unknown の名を替える → bvpop_word_keys・done (13)。席の積みの木の最後の commit e5082775（11 行の全部）で xtask の check が rc 0（2,988 本）。 流す時と順。depends は g-ask-win（席の積みの順・帯と窓の鎖の 4 行も style.css と vocab.json と widgets/mod.rs を書くので、その鎖の最後の行の着地の後に流す・閉じる判定は鎖の頭 g-win-frame の closes と Hit を use する）。後の行 g-pop-flow・g-pop-why・g-pipe-cards がこの行の commit の上に鎖で続く。 範囲の外。札と一覧の行に口を付けること（g-pipe-cards と選びの行）、段の流れと run の歴（g-pop-flow）、起きない理由と待つ理由（g-pop-why）、窓を開くと吹き出しを閉じること（1 枚の画面への切り替えの行）、止まりの次の手の regate と止める（器の命令で面は撃たない）、吹き出しの scroll に付いて置き直すこと。"

