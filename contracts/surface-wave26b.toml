goal = "在りか。起点は席の積みの木（写し drafts/s26b の branch stack3・main 62a2f8fd の上に第 26 波 b の前半の 11 行と後半の g-select・g-one-screen-a・g-one-screen-b・g-layout・g-ledger-trim を 1 行 1 commit で積んだ木）の最後の commit a25843e0。差の file docs/design/patch/g-ask-hist.patch は、その上に載せた試作の commit 05390593（写し drafts/w68a の branch w68a）との git diff --no-color --full-index で切った（7 file・28,353 byte・+338 −45）。a25843e0 の木で git apply --check が rc 0、05390593 の木で git apply --reverse --check が rc 0。main 57ed5599 の木には当たらない（前の行の着地の後に当てる）。席が積み直した後に在りかの字を足す。席の積みの木（写し drafts/s26b・branch stack3・前半の 11 行と後半の 6 行を積んだ木 1268ca21 の上にこの 4 行を g-ask-hist → g-win-url → c-cases-watch → g-accept の順に 1 行 1 commit で積んだ木）でも、この行は 1268ca21 の上の commit 3e6bee04 だった。行 g-ask-win の直し（便 t3-hub.52.179 の審査 FAIL・憲法 P-7）の後に積みの木を当て直した木（写し drafts/w70a の branch stack4）では、この行は 37393750 の上の commit fb34fb95 で、差の file はその 2 つの間の差（28,593 byte・前と違うのは src/askwin.rs の folds の頭と frame の本文の字と、tests/bvaskw.rs の本文の字の 1 行と、hunk の文脈と index の行）。行 g-pop と g-list-groups の直し（板が読めない時に札が無いと見せない・憲法 P-7・係 w70a）の後に当て直した積みの木（写し drafts/w70a の branch stack6b・行 g-ask-win は v0.5 の差の 29df800a）では、この行は 701902a0 の上の commit d15c64c3 で、差の file はその 2 つの間の差（28,593 byte）。 なぜ。判断の記録 ADR-27 決定 (4) は質問を窓にし、束の承認と方針の欄を窓の下の段に置くとした。見本 board-v2 の qModal の下の畳みの段は、ほかの project の質問・まとめて承認・全体への指示・これまでの決定 N › の 4 つで、これまでの決定は件数と新しい順の決定（時刻・短い題・答え・節点の頁への口）を出す。質問の頁を消した行 g-one-screen-a の後、今のこれまでの決定の段（block hist）はどの頁にも描かれていない（席の答え 2026-10-02 は窓の下の畳みに入れると決めた）。 形。src/project/askpage.rs に、窓の畳みの 1 行の型 Decision（台帳の更新の時刻 at・短い題 short・今の段の行の型 HistEntry）と、中身の関数 decisions（台帳の一覧の口とグラフの口と bead の事実の口の読み）を足す。decisions は今の段の関数を使う: rows で台帳を読み（読めなければ同じ理由）、rulings で答え済みの問いを選び（方針の問いを出さず 0 件なら EMPTY）、台帳の updated_at の新しい順（同じなら id の自然な順の逆）に並べ替え、kit の item の項に hist_rows で答えた決定の id を添え、短い題は module ledgerlist の facts を metadata の short を持つ事実（short_set が真）だけに絞って short_of で引く（無ければ台帳の題・題から機械で作った字は問いの題の頭の語の 問い だけになるので使わない）。畳みの見出しの字 fold_title は語の鍵 rulings の語と件数と ›（測れていなければ件数を出さない）。wasm の枝の pub fn inner は名指しの問いの id を受け、3 つの口を読み、details の fold（id は block の id hist・開き閉じの鍵は今の ask:hist）の summary に fold_title、中に decisions の行を ul の items で描く。行の DOM の関数は今の名 hist_li のまま中身を替え、時刻の time（view の clock_short）・短い題の span の ttl（title に題の全体）・b の aside の中に答えた決定の頁への link（字は今の ruling_text・無ければ状態の字）・問いの頁への lk の link（字は問いの id）の順に置く。名指しの問いが答え済みの項に在れば、今の段と同じく段を開き（opens）、その行に背景を置いて寄せる（focus_index・row_selector・HIGHLIGHT・scroll_into_view_with_bool）。block の view は URL の問いの id（ask の focus）で inner を描く（頁には置かない）。src/askwin.rs の frame は質問の窓を開いた link の問いの id（AskFocus）を読み、下の段の関数 folds に渡し、folds は全体への指示の段の後に askpage の inner を描く。stylesheet は質問の窓の塊の .folds の規則の次に、行の時刻の規則を 1 行足す。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done (1)〜(3) は verify の 1〜3 行目。done (4)〜(7) は verify の 4 行目（歯の file tests/bvqhist.rs・filter bvqhist_）の歯 bvqhist_newest_first・bvqhist_reads_and_title・bvqhist_window_fold_wiring_text・bvqhist_time_rule。done (8) は verify の 5〜8 行目（書き替えた着地済みの歯の file tests/bvaskw.rs・tests/cadq.rs・tests/hruling.rs と、askpage の view の字を見る着地済みの歯の file tests/askfocus.rs）。最後の行（xtask の check）は done の項を持たない。 構造の連鎖。書き替える着地済みの歯は 3 file の字だけ。bvaskw は bvaskw_batch_policy_below の窓の本文の字を folds(w, focus) に替える（行 g-ask-win の folds は窓の状態 w を受ける）。cadq は cadq_dom_wiring の行の関数の呼びの字を hist_li(d, &cards, now, mode) に、問いの link の a の class を lk に替え、doc の字を合わせる。hruling は hruling_src_row_links の字を decisions の呼び（中の hist_rows）・lk の link・aside の b に替え、doc の字を合わせる。askfocus の afocus_src_links_and_scroll は view から後の字（inner を含む）で opens・focus・focus_index・row_selector・query_selector・set_attribute・HIGHLIGHT・scroll_into_view_with_bool を見るので、書かずに緑のまま。消すのは今の段の行の DOM の旧の形（印の span と題の link と aside の span）だけで、純粋な関数（rows・rulings・count・body・opens・focus_index・row_selector・ruling_links・hist_rows・hist_cards・ruling_text）と BLOCK・PATHS・FOLDS は替えず、着地済みの歯 askcard・epolqhist・gjst・parts・hsblock・hsderive は書かずに緑。ask の窓の FOLDS（ask_others・batch・policy）は替えない（これまでの決定の見出しは block の heading の鍵 rulings）。答えの字そのもの（裁定の行の逐語）はどの口にも無いので、答えの欄は答えた決定の頁への link にした。src/project/askpage.rs は 289 行から 355 行（上限 1,500 の余地は大きい）。 試作と噛み。試作の起点は a25843e0、試作の commit は 05390593。書く file は write-set の書く file の 7 と同じ（git diff --name-only）。この木で面の歯 858 本と clippy（host と wasm の target）と xtask の check（3,001 本・wasm の target の clippy と面の組み立てを含む）が緑。噛みは最後の木 6835ed7a で変異 10（新しい順を古い順に・同じ時刻の id の順を逆に・短い題を台帳の題だけに・見出しの › を外す・読めない台帳を空に・窓の段を描かない・行の時刻と題の順を入れ替える・時刻の規則を消す・機械で作った短い題も使う・名指しの行を寄せない）で、名指した歯（bvqhist の 4 本と afocus_src_links_and_scroll）がどれも落ちた（rc 100）。done (1) は起点 a25843e0 の木で verify の 1 行目が rc 1。席の積みの木の最後の commit 2f75ed2a（前半の 11 行と後半の 10 行の全部）で xtask の check が rc 0（3,005 本）。 流す時と順。depends は g-ledger-trim（style.css を書く前の行の最後・src/askwin.rs と歯 bvaskw を書く g-one-screen-b はその前の鎖に在る）。席の積みの木では g-list-sweep の commit の上に直に当てたが、書く file は g-list-sweep とも c-cases-watch・g-accept とも重ならないので、それらと並べて流す。後の行 g-win-url はこの行の試作の commit の上に切った。 範囲の外。答えの字（裁定の行の逐語）を口で運ぶこと（境界の行が要る）・見本のほかの畳みの字の差（ほかの project の質問の見出しの添え書き・まとめて承認の件数・全体への指示の …）は行 g-help-sweep か後の行・窓を開く URL の字を外すこと（行 g-win-url）。"

[[contract]]
id = "g-win-url"
title = "窓を開く URL（query の win と問いの id）で頁を開いて窓を開いた後に、history の置き替えで URL から win と問いの id を外し、読み直しても同じ窓を開かない（窓の開け閉めは history を足さない・判断の記録 ADR-27 決定 (4)・試作の差の file docs/design/patch/g-win-url.patch を当てる）"
req = ["FR5", "FR6"]
section = "21"
write-set = ["crates/tsuzuri-surface/src/topbar.rs", "crates/tsuzuri-surface/src/board.rs", "+crates/tsuzuri-surface/tests/bvwurl.rs", "=crates/tsuzuri-surface/tests/bvopen.rs", "=crates/tsuzuri-surface/tests/bvnav.rs"]
verify = ["git apply --reverse --check docs/design/patch/g-win-url.patch", "cargo clippy -p tsuzuri-surface --all-targets --no-deps -- -D warnings -D clippy::too_many_lines -D clippy::cognitive_complexity -D clippy::too_many_arguments", "cargo clippy -p tsuzuri-surface --target wasm32-unknown-unknown --no-deps -- -D warnings", "cargo nextest run -p tsuzuri-surface --test bvwurl --no-tests=fail bvwurl_", "cargo nextest run -p tsuzuri-surface --test bvopen --no-tests=fail bvopen_", "cargo nextest run -p tsuzuri-surface --test bvnav --no-tests=fail bvnav_", "cargo run -q -p xtask -- check"]
size = "S"
done = "(1) git apply --reverse --check docs/design/patch/g-win-url.patch が rc 0（差の file の hunk が全部木に在る） (2) cargo clippy -p tsuzuri-surface --all-targets --no-deps -- -D warnings -D clippy::too_many_lines -D clippy::cognitive_complexity -D clippy::too_many_arguments が rc 0 (3) cargo clippy -p tsuzuri-surface --target wasm32-unknown-unknown --no-deps -- -D warnings が rc 0 (4) settled_query は home の頁では query の win と問いの id を外してほかの値と順を残し、残りが無ければ空の字で、外した後の字は win_of_href で窓を開かず、節点の頁の id は残す（歯 bvwurl_drops_win_and_id） (5) src/board.rs の App は URL の win で窓を開いた直後に settle_url を呼び、settle_url は今の path と settled_query と井桁の後を history の replace_state_with_url に渡し、open_link は URL と history に触れず、src/board.rs は push_state を持たない（歯 bvwurl_board_settles_after_open_text） (6) 前の行の歯の file tests/bvopen.rs と tests/bvnav.rs の歯が全部緑"
depends = ["g-ask-hist"]
goal = "在りか。起点は前の行 g-ask-hist の試作の commit 05390593（写し drafts/w68a の branch w68a・席の積みの木 drafts/s26b の branch stack3 の最後 a25843e0 の上）。差の file docs/design/patch/g-win-url.patch は、その上のこの行の試作の commit 6835ed7a との git diff --no-color --full-index で切った（3 file・8,469 byte・+102 −1）。05390593 の木で git apply --check が rc 0、6835ed7a の木で git apply --reverse --check が rc 0。main 57ed5599 の木には当たらない（前の行の着地の後に当てる）。席が積み直した後に在りかの字を足す。席の積みの木（写し drafts/s26b・branch stack3・前半の 11 行と後半の 6 行を積んだ木 1268ca21 の上にこの 4 行を g-ask-hist → g-win-url → c-cases-watch → g-accept の順に 1 行 1 commit で積んだ木）でも、この行は 3e6bee04 の上の commit 6e267ed1 で、差の file はその 2 つの間の差と同じ字（8,469 byte）。 なぜ。行 g-one-screen-a は消した頁への link を窓を開く URL（query の win と問いの id）に替え、行 g-one-screen-b は home の頁の中の押しでは URL を替えずに窓を開く。けれども節点の頁の この問いに答える などから文書ごと開いた時は、窓を開いた後も URL に win と id が残り、読み直すと同じ窓がまた開き、答え済みの問いの id も残る。見本 board-v2 の窓（openModal と closeModal）は URL と history に触れない。要件 NFR1 と規則の行 R-23 が URL に残すと決めた切り替えは、受入の測り（境の crate の stage/measure.js の switch_at）が押す区切りの button と tab（class seg と role tab と aria-pressed と data-tab の要素）で、表示の型の段がそれに当たり、この行の置き替えの後も URL の mode は残る。帯の印が開く窓は判断の記録 ADR-27 決定 (4) の × と外の click と Esc で閉じる一時の重ねで、決定 (3) がなくした頁と tab の切り替えではなく、帯の印と窓の口は切り替えの印を持たないので、窓の開け閉めを URL に残さないことは NFR1 の切り替えの字に当たらない。要件 FR5 の URL に残す段数と畳みは節点の頁の値で、この行は節点の頁の id とほかの値を残す。 形。src/topbar.rs に純粋な関数 settled_query（頁の query と頁）を足す。query の win を外し、home の頁なら問いの id（ask の FOCUS_KEY の id）も外し、ほかの値と順は残し、残りが無ければ空の字を返す。節点の頁の id は頁の中心なので残す。src/board.rs の App は URL の win で窓を開いた直後に settle_url を呼び、settle_url は今の path と settled_query と井桁の後をつないだ URL を history の replace_state_with_url に渡す（文書は読み直さない）。決めた動き: 窓を開く・閉じる・戻る口と頁の中の link で窓を開くこと（open_link）は URL も history も替えない。URL で開いた時だけ今の history の項を win と id の無い URL に置き替えるので、読み直しても窓は開かず、ブラウザの戻るは窓を閉じるのでなく前の頁（例えば この問いに答える を押した節点の頁）へ戻り、進むは置き替えた URL（窓なし）へ来る。窓を閉じた時の URL は置き替えた後の字のまま。表示の型の切り替え（keep_mode_in_url）は今の URL の query を読むので、置き替えの後も mode を残す。src/topbar.rs と src/board.rs の doc の字に置き替えを足す。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。done (1)〜(3) は verify の 1〜3 行目。done (4) と (5) は verify の 4 行目（歯の file tests/bvwurl.rs・filter bvwurl_）の歯 bvwurl_drops_win_and_id と bvwurl_board_settles_after_open_text。done (6) は verify の 5〜6 行目（App の字を見る前の行の歯 bvopen と bvnav・書かないので write-set に置き場だけの = で置く）。最後の行（xtask の check）は done の項を持たない。 構造の連鎖。win_href・win_of_href・answer_href・next_href と窓の積み（widgets の modal）は替えない。App の窓の開きの 2 行（focus.0.set(id) と win.open(w, false)）は替えず、その後に 1 行を足すだけなので、前の行の歯 bvopen_wiring_text と bvnav_one_screen_wiring_text は書かずに緑。src/board.rs は 332 行から 349 行、src/topbar.rs は 580 行から 598 行。 試作と噛み。試作の起点は 05390593、試作の commit は 6835ed7a。書く file は write-set の書く file の 3 と同じ。この木で面の歯 860 本と clippy（host と wasm の target）と xtask の check（3,003 本）が緑。噛みは変異 5（home の頁で id を残す・空の query を ? にする・置き替えの呼びを外す・置き替えに元の query を渡す・win を外さない）で、bvwurl の 2 本のどちらかが落ちた（rc 100）。席の積みの木の最後の commit 2f75ed2a（前半の 11 行と後半の 10 行の全部）で xtask の check が rc 0（3,005 本）。 流す時と順。depends は g-ask-hist（鎖）。 範囲の外。窓を開くたびに history の項を足して戻るで窓を閉じる形（見本に無い・スマホの戻るの鍵の扱いは後の席の決め）・止まった run の窓から札の吹き出しを開く口（見本の cardFromModal・札を見る）は、窓を閉じてから吹き出しを開く押しが頁の外の click の聞き手に閉じられる件とスマホの段の tile を開く件が要るので後の行・帯の印から開いた質問の窓が前の名指しの問いの id を持ち続ける件（AskFocus を帯の押しで空にしない・行 g-one-screen-b のまま）。"

[[contract]]
id = "c-cases-watch"
title = "境界の server が器の局面の出力の 2 つの file を見張り、面が読む中身が動いた時だけ変化の種類 cases の合図を送り、面は局面の出力を読む 4 つの口をその合図で読み直す（試作の差の file docs/design/patch/c-cases-watch.patch を当てる）"
req = ["NFR2", "FR10", "FR13"]
section = "22"
write-set = ["crates/tsuzuri-boundary/src/server/cases.rs", "crates/tsuzuri-boundary/src/server/mod.rs", "+crates/tsuzuri-boundary/tests/bvlcw.rs", "=crates/tsuzuri-boundary/tests/evkind.rs", "crates/tsuzuri-contract/src/surface.rs", "crates/tsuzuri-contract/tests/snapshots/surface.json", "=crates/tsuzuri-contract/tests/cform_surface.rs", "crates/tsuzuri-surface/src/view.rs", "crates/tsuzuri-surface/tests/bvtrim.rs", "crates/tsuzuri-surface/tests/evkindview.rs", "=crates/tsuzuri-surface/tests/ntcface.rs"]
verify = ["git apply --reverse --check docs/design/patch/c-cases-watch.patch", "cargo clippy -p tsuzuri-boundary -p tsuzuri-contract -p tsuzuri-surface --all-targets --no-deps -- -D warnings", "cargo nextest run -p tsuzuri-boundary --test bvlcw --no-tests=fail bvlcw_", "cargo nextest run -p tsuzuri-boundary --test evkind --no-tests=fail evkind_", "cargo nextest run -p tsuzuri-contract --test cform_surface --no-tests=fail contract_form_", "cargo nextest run -p tsuzuri-surface --test evkindview --no-tests=fail evkind_", "cargo nextest run -p tsuzuri-surface --test bvtrim --no-tests=fail bvtrim_", "cargo nextest run -p tsuzuri-surface --test ntcface --no-tests=fail ntc_", "cargo run -q -p xtask -- check"]
size = "M"
done = "(1) git apply --reverse --check docs/design/patch/c-cases-watch.patch が rc 0（差の file の hunk が全部木に在る） (2) 局面の出力の見張り（Cases の watch）は、state dir の fleet/lifecycle.json と lifecycle.stale から面が読む中身（中核の cases_of の古さの印の種類と部品）が前の周と違う時だけ変化の種類 cases の board-changed を 1 件送り、生成の時刻と入力の印だけが動く書き直しでは送らず、部品の局面の変化と古さの印の file の出入りと読めない出力とその戻りでは 1 件ずつ送り、state dir を省いた読みは見張らない（歯 bvlcw_watch_sends_on_sight_change） (3) server の知らせの口 /api/surface/events は、state dir の局面の出力が現れた時と部品の局面が動いた時に種類 cases だけを載せた board-changed を 1 件送り、生成の時刻と入力の印だけが動く書き直しでは送らない（歯 bvlcw_serve_sends_cases_kind） (4) server の bind は Cases を 1 つ作って start_hub に渡し、start_hub は見張りを events の POLL の間隔で始め、cases.rs の board_changed の呼びは種類 Cases の 1 つだけ（歯 bvlcw_wiring_text） (5) 契約の変化の種類は 7 つで Runs の次に Cases（電文の字 cases）を持ち、snapshot の surface.json の ChangeKind の列も同じ並び（歯 contract_form_snapshot_matches） (6) 読み直しの表は 15 行のままで、局面の出力の口は種類 Cases だけ、指標の口と未反映の口は Ledger と Cases、pipeline の口は Ledger と Runs と Cases で読み直し、台帳の合図で読み直さない口は席の card・局面の出力・走行の歴・project の名の 4 つ（歯 evkind_path_kinds_table・evkind_seat_reloads_two・bvtrim_reload_beads_and_cases） (7) 書き替えた着地済みの歯の file 2 本（evkindview・bvtrim）と、字と型を読む着地済みの歯の file 3 本（evkind・ntcface・cform_surface）の歯が全部緑"
depends = ["g-ledger-trim"]
goal = "在りか。差の file docs/design/patch/c-cases-watch.patch は、席の積みの木の commit a25843e0（写し drafts/s26b の branch stack3・前半の 11 行と後半の g-select・g-one-screen-a・g-one-screen-b・g-layout・g-ledger-trim を積んだ木）に試作の commit cab24d8f（写し drafts/w68b の branch w68b）を載せて切った（8 file・git diff 29,089 byte・+399 −25）。新しい file は歯 tests/bvlcw.rs（286 行）。席が積み直した後に在りかの字を足す。席の積みの木（写し drafts/s26b・branch stack3・前半の 11 行と後半の 6 行を積んだ木 1268ca21 の上にこの 4 行を g-ask-hist → g-win-url → c-cases-watch → g-accept の順に 1 行 1 commit で積んだ木）でも、この行は 6e267ed1 の上の commit ce80dccb で、差の file はその 2 つの間の差と同じ字（29,089 byte）。 なぜ。器は局面の出力 fleet/lifecycle.json を配車の周（state の記録では 15 秒前後から数分ごと）と便の段の進みで書き直し、古さの印 lifecycle.stale も別に書く。面の局面の出力を読む口（/api/cases・/api/pipeline・/api/metrics・/api/unreflected）は要求のたびにその file を読むが、file はどの板の印の見張りにも無く、面は台帳か event log の合図でしか読み直さなかった（行 g-ledger-trim の未確か）。配車の周が台帳も event log も動かさずに出力だけを書き直すと、次の合図まで一覧の局面の字と板の列が古いまま残る。書き直しは毎回 generated_at と inputs の印を替えるので、更新時刻と長さの印でも字の全体の比べでも中身の変わらない書き直しで合図が出る（2026-10-02 の 25 分の実測で書き直し 18 回のうち部品の変わらない書き直しが 8 回）。 形。契約の変化の種類 ChangeKind に Runs の次へ Cases（電文の字 cases）を足し、ALL を 7 つにする（account と知らせの後ろに足さないので、知らせが最後の断言は今のまま）。境界の server/cases.rs の Cases に、面が読む中身 sight（texts の字から中核の cases_of が組んだ古さの印の種類と部品の組・生成の時刻は面が読まないので持たない）と、見張り watch を足す。watch は poll ごとに 2 つの file の更新時刻と長さ（events の stamp）を見て、動いた周だけ sight を読み、前の周の中身と違えば種類 Cases の board-changed を Hub に 1 件送る。最初の印と中身は戻る前に取り、Hub は弱く持つ（Hub が落ちれば止まる）。state dir を省いた読み（json が None）は見張らない。server/mod.rs の bind は Cases を 1 つ作って start_hub と Shared で分け合い、start_hub は板の印の見張りを始めた後に cases.watch(&hub, events::POLL) を撃つ。器の書き手は一時 file からの rename で置き替えるので、書きかけの字は見えない。面の src/view.rs の読み直しの表は 15 行のまま、局面の出力の口を Cases だけ、指標と未反映の口を Ledger と Cases、pipeline の口を Ledger と Runs と Cases に替える。古い面の wasm が字 cases を読めない時は全部の種類で読み直す（changed_kinds の今の倒し方）。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。(1) は verify の 1 行目。(2) から (4) は 3 行目（歯の file tests/bvlcw.rs・filter bvlcw_）の 3 本。(5) は 5 行目（cform_surface の contract_form_snapshot_matches）。(6) は 6 行目（evkindview の 2 本）と 7 行目（bvtrim の 1 本）。(7) は 4 行目から 8 行目。clippy の行（2 行目）と xtask の check（最後の行・wasm の target の clippy と面の組み立てを含む）は差の全部を見る。 構造の連鎖。ChangeKind を名指す着地済みの歯は、evkind（境界・mod.rs の kinded の 4 つの字と form.rs の Ledger の送りを読む・今のまま緑）・ntcsrv（知らせの種類だけを見る・触れない）・wsteady（Design だけ）・evkindview（表の行の種類と台帳で読み直さない口の列を書き替える）・ntcface（ALL の最後が Notice・Cases を Runs の次に置くので今のまま）・bvtrim（局面の出力の口の種類を書き替える・頭の doc と歯の doc も替える）・cform_surface（snapshot の列に cases を足す）。境界の routes/cases.rs と pipeline.rs と metrics.rs と unreflected.rs は今の texts を読むまま替えない。 試作と噛み。試作の起点は a25843e0。書く file は write-set の中で閉じる（試作の commit の差の 8 file と write-set の書く file の 8 項が同じ）。cargo clippy（3 crate・--all-targets --no-deps・-D warnings）と名指した歯の file と xtask の check が緑。噛みは変異 9 つ（中身の比べを外す・start_hub の見張りを外す・送る種類を Runs に・古さの印の file を印に入れない・state dir の無い読みも見張る・局面の出力の口を台帳と event log に戻す・pipeline の口から Cases を外す・指標の口から Cases を外す・ALL から Cases を外す）で、どれも名指した歯が落ちた（rc 100）。席の積みの木の最後の commit 2f75ed2a（前半の 11 行と後半の 10 行の全部）で xtask の check が rc 0（3,005 本）。 流す時と順。depends は g-ledger-trim（この行は同じ表 RELOAD_KINDS の局面の出力の口の行と歯 bvtrim と evkindview を書き替える・歯 ntcface を書く g-one-screen-a はその前の鎖に在る）。書く file は g-list-sweep とも g-ask-hist・g-win-url とも重ならないので、それらと並べて流す。後の行 g-accept は境界の audit.rs と受入の fixture を書き、この行と file が重ならない。 範囲の外。局面の出力を読む口の応答の中身（texts と cases_of の今の読み）は替えない。ほかの project の局面の出力（account board）は見張らない。器の書き直しの周の間隔は器の運用で決まり、この行は値を持たない。"

