lp.rs の 8 本）。gcoach_ の歯は 5 行目、hfig_ の歯は 6 行目、frame_ の歯は 7 行目、bvaskw_ の歯は 8 行目。(9) は 5〜8 行目。2・3・9 行目は clippy と組み立てと workspace の全部の歯。 構造の連鎖。窓の枠の Frame を組むのは wins.rs と askwin.rs の 2 か所だけ（試作で grep）。help の h3 と hs と legend の HOW は wasm の枝だけで描く。案内の層を頁に置く App の字（board.rs）は替えない。vocab.json と style.css は使わなくなった語と規則のうちこの行が替えた所だけを書き（案内の矢印・箱の幅の規則）、ほかの掃除は行 g-vocab-sweep が持つ。 試作と噛み。試作の木で面の crate の clippy（host の all-targets と wasm32）が rc 0、面の歯 869 本が全部緑、xtask の check が rc 0。噛みは前の起点 2f75ed2a の試作で 20 の変異（題の横の数が読めたかを見ない・読めない時も数を出す・題を h3 の字に戻す・題の横の数の class・空の字を英語混じりに戻す・置き直しが頭へ戻らない・見えるかを幅だけで見る・幅の替わりで置き直さない・字の帯を固定しない・頁の余白を広げない・記号の見方に出所の帯の行を戻す・画面の見方の見出しを外す・図 lay の字・案内の 1 段目を前の的に戻す・図 one の点線を実線に・輪の外の幅・分かったの段・図の名の順・1 枚の画面の注釈の図・記号の見方の詳しくの行の数）が全部、名指した歯の file で rc 100 になり、done が名指す歯の全部がどれかの変異で落ちる。起点 b6fe8b11 の上では替わった所の 4 つ（題を h3 の字に戻す・題の横の数の class・空の字を英語混じりに戻す・題の横の数が局面の残りを見ない）を撃ち直し、全部 rc 100。 流す時と順。depends は行 g-list-sweep と g-win-url と g-accept（3 本の鎖の最後）。後に行 g-vocab-sweep がこの行の足した語と消した語を照らし直す。 範囲の外。質問の窓の本文で問いの一覧が読めない時を空と分けて出す局面（測れていないと理由）は、行 g-ask-win が持つ（この行は空の字だけを直す）。節点の頁の近傍の図の hover（測りの式が pointerenter だけを見て、委ねの mouseover を数えない）と account board の 960 の溢れは、行 g-accept-fix に分ける。使わなくなった地図の 6 面と tab の語の掃除は行 g-vocab-sweep。"

