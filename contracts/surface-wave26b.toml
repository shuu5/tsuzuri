one (1) は verify の 1 行目、(2) は 2 行目。done (3)〜(7) は 3 行目（歯の file tests/bvdsweep.rs・filter bvdsweep_）の歯 bvdsweep_words・bvdsweep_fires_unmarked_in_order・bvdsweep_quiet_when_nothing・bvdsweep_start_gates・bvdsweep_serve_sweeps_at_start。done (8) は 4〜14 行目（着地済みの歯の file ごとに 1 行）。最後の 1 行 xtask の check は done の項を持たない。 構造の連鎖。ruling.rs は中核の delivery から undelivered を、server の module から Config を新しく引く。撃ち直しの周は見張りの周に置かない。見張りは受け手（知らせの接続）が 0 人の間は台帳を読まず、受け手が居ても store の印が動かなければ 600 秒ごとにしか読まない。見張りの周で器を撃つと、器の 1 回の撃ち（上限 DELIVER_TIMEOUT）が見張りの読みも止める。起動の周だけにし、周期の掃きにしないのは、周期にすると答えごとの thread が撃ち直している裁定を同じ時に 2 度撃つため。それを避ける撃ち直し中の表は Shared（src/server/mod.rs）に置くことになり、mod.rs は鎖の行 c-cases-watch が書く。器の seat deliver は撃つ回を絞らない（器の ADR-0077）。断る周は 1 key も送らない。送ったが確かめられない周（unconfirmed）を撃ち直すと、指し示しの 1 行が 2 度届くことがある（行 e-deliver-retry と同じ・入力欄に字が残れば次の周は input-busy で断られる）。着地済みの歯 fserve と server_ask の fixture の印の無い裁定（2026-09-24 の分）は上限より前なので、起動の掃きは撃たず、偽の器の回の数えは変わらない。歯の偽の bd は作業場の out.json（歯の file が今の分と 2 時間前の分で組む 4 本の台帳）を出し、無ければ rc 1。偽の bdw と偽の器は回ごとの argv を記録して rc 0。歯の撃ち直しの組は間 50 ms と上限 2000 ms。tz の binary の歯は 30 秒を上限に偽の器の 1 回目を待って止める。 試作と噛み。試作は main 2ed91cab の写しで書き、書く file は write-set の 3 file で閉じる。境の crate の全部の歯を cargo nextest run -p tsuzuri-boundary で撃ち、clippy と xtask の check と xtask の歯も撃った（結果は係の notes）。噛みは 8 つ（読むだけの server の門を外す・serve から ｀sweep_at_start｀ を外す・印の在る裁定も撃つ・上限の窓を外す・全部を 1 つの荷にする・台帳の逆の順に撃つ・SWEEP_FOUND の字を替える・｀id_minute｀ が形を見ない）で、どれも歯 bvdsweep_ のどれかが落ちる。 流す時と順。depends は空。同じノートの行 c-ruling-reread とは書く file が重ならない（あちらは policy.rs と routes/policy.rs）。鎖の行 c-cases-watch が書く src/server/mod.rs と cases.rs は書かない。 範囲の外。答えごとの撃ち直しの間と上限（PACE）は変えない。30 分の上限の後の撃ち直しは足さない（器が断り続けるのは席が idle のまま入力欄に字が在るか pane が無い形で、撃ち続けても届かず、席が turn に入れば終わりの停止の hook が拾う）。server の log を起こし直しで切り詰める起動の script は repo の外の席の道具で、この行では書かない。器の側の見張り（memo t3-hub.72 の候補 c と memo t3-hub.70）は持ち主が時期を決める。"
