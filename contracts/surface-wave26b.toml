_esc_outside_x・bvwin_stack_back_to_previous・bvwin_width_style・bvwin_classes_in_stylesheet・bvwin_words_in_vocab・bvwin_dom_wiring_text。verify の最後の 2 行（xtask の surface-build と check）は wasm の枝の組み立てと repo の全部の歯を撃つ（done の項は持たない）。 構造の連鎖。新しい module は widgets の下の modal だけで、ほかの module はまだ使わない（帯の行 g-topbar・窓の中身の行 g-win-parts・質問の窓の行 g-ask-win・吹き出しの行 g-pop が使う）。着地済みの歯で stylesheet の class と src の class の字を照らす frame_classes_are_in_stylesheet は、この行の class を src の字の class でなく定数で持つので数えない（歯 bvwin_classes_in_stylesheet が照らす）。語の辞書の全部の鍵を回る着地済みの歯（hsym・helpfig・nstall・frame_no_heading_words_in_code）は緑のまま。 試作と噛み。試作の main は 62a2f8fd、試作の commit は写し drafts/w66a の 6cba15ef。書く file は write-set の中で閉じる（git diff --name-only が write-set の 5 と同じ）。試作の木で面の全部の歯 774 本と clippy と xtask の surface-build と check（2917 本）が緑。変異 3 つと clippy の変異 1 つで、done の各項が落ちることを見た（log w/bite.log・k1 変換の途中でも閉じる → bvwin_close_on_esc_outside_x・k2 外から開いても前の窓を閉じない → bvwin_stack_back_to_previous・k3 全画面の規則を消す → bvwin_classes_in_stylesheet・k13 歯の file に使わない束縛 → clippy の rc 101）。done (1) は main の木で verify の 1 行目が rc 1。席の積みの木の最後の commit e5082775（11 行の全部）で xtask の check が rc 0（2,988 本）。 流す時と順。depends は空。鎖の後の行 g-topbar・g-win-parts・g-ask-win はこの行の試作の commit を起点に差を切った。吹き出しの行 g-pop の係（w66b）はこの行の試作の commit 6cba15ef から始め、閉じる判定 closes と押しの型 Hit を使う。席はどの行も style.css か vocab.json を書く第 26 波 b の 11 行を g-win-frame → g-topbar → g-win-parts → g-ask-win → g-pop → g-pop-flow → g-pop-why → g-pipe-cards → g-list-groups → g-list-head → g-unref-lc の順に 1 本の木に積み、depends もこの順の 1 本の鎖にした。 範囲の外。窓の層を頁に置くこと（g-one-screen-a）・窓の中身（g-win-parts・g-ask-win）・吹き出し（g-pop）・幅の 3 段の配置（g-layout）・Safari の変換の途中の keyCode 229 の判じ（今の質問の欄の keydown は持つが、この行の層は is_composing だけを見る）。"

