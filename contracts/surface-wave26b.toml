cked を ・ で 3 つ並べた字）、断りの 1 行は REFUSED_LOG と /api/policy 503 ledger-unknown と ・問い と空白。 試作と噛み。試作は main 2ed91cab の写しで書き、書く file は write-set の 3 file で閉じる。境の crate の全部の歯を cargo nextest run -p tsuzuri-boundary で撃ち、clippy と xtask の check と xtask の歯も撃った（結果は係の notes）。噛みは 4 つ（方針の読みを text_alone に戻す・1 回だけの読みにする・口の断りの log を書かない・log の path を裁定の口の字にする）で、どれも歯 bvrread_ のどれかが落ちる。 流す時と順。depends は空。同じノートの行 c-deliver-retry とは書く file が重ならない（あちらは ruling.rs と main.rs）。鎖の行 c-cases-watch が書く src/server/mod.rs と cases.rs は書かない。 範囲の外。台帳の 1 本の引きの口（GET /api/ledger/<id>・routes/item.rs）は書かない。この口は答えの口でなく見張りの読みを返す読みの口で、見張りの最後の読みが落ちた後に口が bd を撃たないことは着地済みの行 e-snap の決め（歯 server_coalesce_shared_failure_then_new_read が口の 503 と bd の 0 回を断言する）。面の決定の頁が 1 本の引きの 503 を取り消しの欄の無しとして見せる形（node.rs の shows_revoke）は面の行の範囲。台帳の読みを速くすること・見張りの読みの上限 BD_TIMEOUT は変えない。器の側の見張り（memo t3-hub.72 の候補 c）は持ち主が時期を決める。"

