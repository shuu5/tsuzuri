done = "(1) repo の根の Cargo.toml の表の鍵と値は、rust が unused_must_use の deny と unsafe_code の forbid、clippy が unwrap_used・expect_used・panic・todo・unimplemented・unreachable・exit・dbg_macro・allow_attributes・allow_attributes_without_reason の deny のこの順で、歯の file の一覧 ENABLED の 12 の lint を一覧 MAP の表と level で並べた列と同じ（歯 klint_workspace_table） (2) cargo clippy --workspace --all-targets -- -D warnings と cargo clippy -p tsuzuri-surface --target wasm32-unknown-unknown -- -D warnings がどちらも rc 0（表の 12 の lint の違反が 6 つの member の歯でない code と歯の全部で 0） (3) 境界の歯の file dstg.rs の test の fn 9 つが緑で、歯 dstg_route_reads_via_tz・dstg_own_post_order・dstg_open_drops_seat_mark は、tz の binary の子 process の server（子の環境だけに CLAUDECODE の 1 を置く）が撃つ偽の tz の記録の seat の行が全部 none であることを見る（歯 dstg_）"
growth = ["crates/tsuzuri-boundary/tests/server_acct.rs:5", "crates/tsuzuri-surface/src/account/home.rs:5", "crates/tsuzuri-surface/src/project/ledger.rs:20"]
