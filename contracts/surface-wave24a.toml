de の中身（条件と順と早い return と出す字と誤りの字）は変えず、閉包が外の束縛を借りていた所は引数で渡す。pub な関数の名は変えず、形（引数）を替えるのは引数の違反の 4 つ（private な fn watch と fn reopen、pub な fn redeliver と fn reach）だけ。unwrap・expect・panic・添字は足さない。足す関数と構造体と型の別名は、pub な関数の引数の型の 2 つ（ruling.rs の構造体 Parcel と relay.rs の構造体 Programs）を除いてどれも private。足す関数は割った元の関数と同じ file の中で、元の関数のすぐ後ろ（impl の中の関数は同じ impl の中）に置く。 形（file ごと）。acct.rs は、impl Acct の中の fn gather の 1 段目の thread::scope を fn gather_first（anchor の列と持ち回しの git の読みを受け、git の読みの字と usage と閾値の行と引数の state dir の doctor の字の 4 つ組を返す・中の anchors.clone() は anchors.to_vec() になる）に、2 段目の thread::scope を fn gather_second（state dir ごとの tick status と doctor の字の組の列と、anchor ごとの台帳の読みの列を返す）に、state dir ごとの event log の印と休止中の席の状態の記録の loop を fn gather_seat_logs に、anchor ごとの project の字と席の doctor の字の loop を fn gather_projects（読んだ event log の path の列を返す・重ならない dir の列と state dir ごとの字と台帳の読みの 3 つを 1 つの組の引数で受ける）に、その中の orchestrator の席の dir の引きを fn orchestrator_dir に移す（5 つとも impl Acct の中で fn gather のすぐ後ろ）。file の頭の型の別名の並び（Logged の後ろ）に型の別名 DirOutputs（state dir ごとの tick status と doctor の字の組・戻りの型の複雑さの lint を避ける）を足す。重ならない dir の列 unique と、group と host の欄の組みは fn gather に残す。cli/graph.rs は、fn run の Mode::Design の腕の中身を fn design_doc（&Args を受け、設計の字だけで組んだ電文と全部まだ分からないの床の組を返す）に移し、腕は design_doc の組を分けて (doc, None, None, floors) を返す。main.rs は、fn parse の引数の読みの loop の後（3 つの要る引数の欠け・省ける引数の空の値・bind 先の形・Config の組み・省いた program の既定）を fn build（要る 3 つの引数の値の長さ 3 の配列と、省ける 7 つの引数の値の長さ 7 の配列と、--read-only の印と --project の列を受ける・本文は変えない）に移し、parse は build を呼んで返す。server/batch.rs は、fn accept の行を確かめる loop を fn rows_of（書く前の行の列か、最初に当たった行の断りの理由を返す・accept は断りを Outcome::Refused で返す）に、書きの loop を fn write_rows（行ごとの結果と落ちたかの印を返す）に移し（どちらも accept のすぐ後ろ・use に OpenQuestion を足す）、配達の撃ち直しの spawn は accept に残して荷を ruling.rs の構造体 Parcel（id は束の id・pending は行ごとの問いと裁定の組）にする。use super::ruling の並びに Parcel を足す（rustfmt の形で並びは 2 行から 3 行になる）。server/events.rs は、fn watch の直前に private な構造体 Link（欄 hub は Hub への弱い参照の参照・wake は合図の受け口の参照・poll は待ちの上限）を置き、fn watch の引数を Link の分解と state・mark・read