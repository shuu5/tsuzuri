goal = "在りかの main は 0f443f3b（行 r4-args-mark の着地の後）に同じノートの行 r4-folio-src-a と r4-folio-src-b を当てた木。起草 w56c が main f17e983f に 3 行の試作（写しの commit 180cb89e・39e75f8b・1e92740c）を積んだ写しで試作した（写しの commit 3ae0b530）。書く file は write-set の 20（folio の src の 19 file と build.rs）で、置き場だけの 22（= の folio と境界の歯の file・verify の行が撃つ）は書かない。 なぜ。行 r4-folio-src-a の節のなぜと割り（3 行）の段のとおり。この行は folio の R-4 の本体の直しの最後の行で、残りの違反 35（関数の行 28・複雑度 7）と gate.rs の cfg(test) の歯の fn の複雑度 1 を直し、verify の clippy で folio の lib と build.rs の全部を 3 つの lint の -D で撃つ（a と b の module の属性の下の file も含めて、閾値の越えが package に 0 であることを見る）。 gate.rs の歯の fn の直しは verify の clippy の外（歯の crate と cfg(test) を撃たない）で、歯の断言の中身は替えない。 形（共通）。関数の本体の最上位の文の並びの切れ目で、後半か中ほどの塊を同じ file の新しい private な fn（元の fn の直後）に移し、移す行は字のまま・改行も元のまま（字下げを変えない形を第一にし、match の腕や入れ子の中を抜く所だけ字下げが変わる）。例外は下の段「試作で形を替えた行」に名指す行だけで、ほかの行を消したりつないだり書き替えたりしない。ただし、引数を struct にまとめた関数と、まとめた値を受ける関数の中で、移す行がまとめた値を読む形（局所の名 x・欄の読み s.x・参照 &s.x のどれか・関数の頭で let で分解するかどうか）は実装が選んでよく、その違いと、それに伴う & の足し外しと行の数の違いは、例外の段に名指さなくてよい（試作は多くを関数の頭で局所の名に分解する形）。この許しは値の読み方だけで、条件と式の組み立て・呼ぶ関数・出す字・Ok( での包み・.clone() と ? の足し外し・一覧に無い関数には及ばない。形を替えた関数と足す関数を呼ぶ行も rustfmt の形にする（幅 100 を越える呼びは試作の呼びの行のとおり引数を 1 行ずつに折る）。引数を struct にまとめる関数も、今の doc と注の行（引数を説明する行を含む）は消さず字を替えない（doc と注の差は下の doc と注の行の段に名指す行だけ）。移した塊の束縛の行（let x = … の行）を Ok( や戻りの式に包み直さず、.clone() と ? と & を足したり外したりしない（塊の値は試作のとおり let で束ねて後の行で返す・例外の段に名指す行を除く）。足す関数の頭は下の段「足す関数の頭の字」のとおりにする。足す字は rustfmt の幅 100 に収める（use の行を足す時も 100 を越えない）。新しい fn の頭に周りと同じ形の /// の doc の注を置く（字は下の doc と注の行の段）。引数の直しは、関係のある引数を小さな struct（欄ごとに /// の doc の注）か既にある文脈の struct にまとめ、呼ぶ所も直す。新しい関数も閾値の関数の行 60・複雑度 15・引数 5 の内に収める。 allow・expect・rustfmt::skip の属性と、unwrap・expect・panic・unreachable・添字を足さない。folio の file に rustfmt と cargo fmt を撃たない（folio の file は rustfmt の形でない所が多く、撃つと関係の無い行が書き換わる）。判定の順・短絡・副作用の順・出す字（HTML と YAML と標準出力と標準誤り）・終了 code は変えない。clippy の数えは、関数の行が fn の本体の波括弧の内側の空の行と注だけの行を除いた行、複雑度が 1 に if・else if・assert の類・腕が 2 つ以上の match・for・match の guard を足して return を補正した数（&& と || と ? と closure の中は数えない）、引数が self を含む数。 形（file ごと