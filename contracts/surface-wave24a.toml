（folio の 2 file の行数は変わらない）。(3) 構造の連鎖は上の段。(4) verify の clippy は -p folio を名指す。(5) 着地の後に席が xtask の check と nextest を手で 1 回撃つ。 流す時と順。depends は k-lint-folio（除外の表と carry.rs を書く・着地済み）と k-size-base（size.rs を書く・着地済み）。この版で行 k-size-base の done (4) と行 k-lint-folio の done (1) の字を、この行の後も成り立つ形（着地の時の字と、この行の後の字）に直した（歯 ksize_population_follows_carry と cexcl_table_rows の見方の字は、この行の試作のとおり）。この行の後、folio の src の file を 1,500 行を越えて育てる行と、6 つの member の src の検査の区間を本体より大きく育てる行は、check の数えの段で落ちる。器の便の受付は crates/<部品>/src/ だけを測るので（ADR-25 の決定 (8)）、folio2/ の越えは便を走らせ終えた後の check で落ちる。 範囲の外。関数の粒度の直しと、表に R-4 の lint と clippy.toml に引数の閾値を足すこと（後の行・folio を含む 6 つの member の違反を直す）。folio の根の lint の一覧を消すこと（表が R-10 の全部と unsafe_code の forbid を持った後の行）。歯 klint_members_follow_carry_table の R-4 の守りを消すこと（器の持ち込みの後も使う）。行 k-lint-base の 6 節の段の並びの字（上の計画との違いの段が替わりを書く）。src の外の tests/ の行数（ADR-25 の決定 (1)）。"

[[contract]]
id = "k-lint-rest"
title = "workspace の lint の表に unsafe_code を forbid で、expect_used・unreachable・allow_attributes・allow_attributes_without_reason を deny で足し、歯でない code の expect 24 と歯の unreachable 5 と unsafe 1 と契約の歯の allow の属性 1 を直す（根の Cargo.toml・xtask の main.rs と歯 klint・境界の events.rs と歯 4 file・契約と中核の歯 1 file ずつ・面の src の 15 file だけ）"
req = ["NFR3"]
section = "21"
