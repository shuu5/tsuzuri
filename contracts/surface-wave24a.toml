req = ["FR17"]
section = "11"
write-set = ["folio2/crates/folio/src/entry.rs", "folio2/crates/folio/src/lib.rs", "folio2/crates/folio/tests/check.rs", "folio2/crates/folio/tests/modules.rs", "+folio2/crates/folio/tests/fdrop.rs", "xtask/tests/retire.rs", "~folio2/crates/folio/src/inject.rs", "+folio2/retired/crates/folio/src/inject.rs", "~folio2/crates/folio/tests/inject.rs", "+folio2/retired/crates/folio/tests/inject.rs", "folio2/crates/folio/tests/init.rs", "~folio2/crates/folio/src/serve.rs", "+folio2/retired/crates/folio/src/serve.rs", "~folio2/crates/folio/tests/serve.rs", "+folio2/retired/crates/folio/tests/serve.rs", "folio2/crates/folio/tests/help.rs"]
