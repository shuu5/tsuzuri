goal = "在りかの main は 0f443f3b（行 r4-args-mark の着地の後）に同じノートの行 r4-folio-src-a を当てた木。起草 w56c が main f17e983f に r4-args-mark の試作（写しの commit 180cb89e）と r4-folio-src-a の試作（写しの commit 39e75f8b）を積んだ写しで試作した（写しの commit 1e92740c）。書く file は write-set の 13（folio の src の 11 file と entry.rs と xtask の歯の file klintf.rs）で、置き場だけの 12（= の境界の歯の file・verify の行が撃つ）は書かない。 なぜ。行 r4-folio-src-a の節のなぜと割り（3 行）の段のとおり。この行は、行 r4-args-mark の理由の字が名指す 8 file（anchor・ findings・freeze・graph・link・mentions・note・refs）と、形を替える関数を呼ぶ check.rs と stamp.rs と lineage.rs の、R-4 の違反 40 と前からの expect の 2 つを直す。entry.rs は freeze の fn after の呼びの 1 か所だけを直し、fn dispatch の割りは行 r4-folio-src-c。 形（共通）。関数の本体の最上位の文の並びの切れ目で、後半か中ほどの塊を同じ file の新しい private な fn（元の fn の直後）に移し、移す行は字のまま・改行も元のまま（字下げを変えない形を第一にし、match の腕や入れ子の中を抜く所だけ字下げが変わる）。例外は下の段「試作で形を替えた行」に名指す行だけで、ほかの行を消したりつないだり書き替えたりしない。ただし、引数を struct にまとめた関数と、まとめた値を受ける関数の中で、移す行がまとめた値を読む形（局所の名 x・欄の読み s.x・参照 &s.x のどれか・関数の頭で let で分解するかどうか）は実装が選んでよく、その違いと、それに伴う & の足し外しと行の数の違いは、例外の段に名指さなくてよい（試作は多くを関数の頭で局所の名に分解する形）。この許しは値の読み方だけで、条件と式の組み立て・呼ぶ関数・出す字・Ok( での包み・.clone() と ? の足し外し・一覧に無い関数には及ばない。便 t3-hub.74.17 の 2 度目の run は、src/anchor.rs の段の関数で index と scope と c と cur_ver と cur_proj を束ねた値の欄として読み（&chain.index・cur.scope・&cur.c ほか）、src/check.rs の flag を run.flag、src/note.rs の gate を ctx.gate と読んで、gate が contract-fit で落とした（この版から読み方の違いは許す）。形を替えた関数と足す関数を呼ぶ行も rustfmt の形にする（幅 100 を越える呼びは試作の呼びの行のとおり引数を 1 行ずつに折る）。引数を struct にまとめる関数も、今の doc と注の行（引数を説明する行を含む）は消さず字を替えない（doc と注の差は下の doc と注の行の段に名指す行だけ）。移した塊の束縛の行（let x = … の行）を Ok( や戻りの式に包み直さず、.clone() と ? と & を足したり外したりしない（塊の値は試作のとおり let で束ねて後の行で返す・例外の段に名指す行を除く）。足す関数の頭は下の段「足す関数の頭の字」のとおりにする。足す字は rustfmt の幅 100 に収める（use の行を足す時も 100 を越えない）。新しい fn の頭に周りと同じ形の /// の doc の注を置く（字は下の doc と注の行の段）。引数の直しは、関係のある引数を小さな struct（欄ごとに /// の doc の注）か既にある文脈の struct にまとめ、呼ぶ所も直す。新しい関数も閾値の関数の行 60・複雑度 15・引数 5 の内に収める。 allow・expect・rustfmt::skip の属性と、unwrap・expect・panic・unreachable・添字を足さない。folio の file に rustfmt と cargo fmt を撃たない（folio の file は rustfmt の形でない所が多く、撃つと関係の無い行が書き換わる）。判定の順・短絡・副作用の順・出す字（HTML と YAML と標準出力と標準誤り）・終了 code は変えない。clippy の数えは、関数の行が fn の本体の波括弧の内側の空の行と注だけの行を除いた行、複雑度が 1 に if・else if・assert の類・腕が 2 つ以上の match・for・match の guard を足して return を補正した数（&& と || と ? と closure の中は数えない）、引数が self を含む数。 形（file ごと）。行 r4-folio-src-b の形（引数の直しの 11 file と entry.rs の 1 か所）。module の属性の行 #![deny(clippy::too_many_lines, clippy::cognitive_complexity)] は、anchor.rs・check.rs・findings.rs・freeze.rs・graph.rs・lineage.rs・link.rs・mentions.rs・note.rs・refs.rs・stamp.rs の 11 file の頭の //! の続きの直後の行（空の行を挟まない）に足す。引数を束ねる型は、refs.rs の pub(crate) な Canon（憲法・rules・語彙・要件書の 4 つの木の参照・refs.rs の check_refs と link.rs と note.rs が受け、check.rs の impl Sources の fn canon が組む）と check.rs の Materials（freeze.rs の fn after が受ける）のほかは、使う file の private な struct（欄に doc の注）。引数の違反で付いていた expect(clippy::too_many_arguments) の属性（各 4 行）は 17 か所を全部消す（anchor 1・findings 3・freeze 1・graph 1・lineage 1・link 2・mentions 1・note 6・refs 1）。新しい fn は全部 private で元の fn の直後に置く。anchor.rs は、fn project（行 62/60）の条の statements の match を fn statements_of（規範文の一覧か Err を返す・字下げが 16 浅い）に移し、fn check_anchor（行 334/60・複雑度 42/15）を段ごとの fn の連鎖に割る。段の間の受け渡しは private な struct 2 つで、Cur（欄 dir・adr・history・flag・c・place・scope・cur_proj・cur_ver・meta_approval・name＝憲法の現行の読み）と Chain（derive(Default)・欄 anch・index・anchors・chain_exists・git・records_exist・newest・chain_versions＝anchors/ の読みと列の結果）。check_anchor は憲法を読んで Cur を組み（引数 5 のまま）、末尾呼びで fn read_chain（索引と anchor の file を読む）→ fn check_git_records（版管理）→ fn check_index（列の索引）→ fn check_versions（git の untracked）→ fn check_reuse（番号の再利用）→ fn check_pairs（隣り合う anchor の差分）→ fn check_current（現行）→ fn finish（State を詰めて返す）と元の検査の順に繋ぐ。check_index は索引の項ごとの loop を fn check_entries と fn check_entry_anchor（項と anchor の digest・previous・5 引数）に出し、check_current は始まりの凍結の承認の一覧を fn check_start_approvals に出す（loop の本文と承認の塊は字下げが 4〜8 浅い）。fn check_file（引数 7/5・行 124/60）は dir・adr・meta_approval を Cur から読む形で 5 引数にし、fn check_file_projection（5 引数・写しの取り方・範囲・写しの節）→ fn check_file_approval（5 引数・承認の写し・approvals・Anchor を返す）と 3 つに割る。fn check_approvals（行 96