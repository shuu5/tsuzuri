[[contract]]
id = "m-doctor-hold"
title = "面の server の器の doctor の出力の持ち回しの上限だけを 60 秒にし、使用量の読み（usage）と規則の行の読み（rules get）は 30 秒、tick status は 5 秒のままにする（判断の記録 ADR-26 の決定 (2)・境界の server の seat の定数 DOCTOR_HOLD と fn ceiling・着地済みの歯 eheld・server_seat・server_acct の字・新しい歯 mdoch）"
req = ["NFR4", "FR12"]
section = "19"
write-set = ["crates/tsuzuri-boundary/src/server/seat.rs", "+crates/tsuzuri-boundary/tests/mdoch.rs", "crates/tsuzuri-boundary/tests/eheld.rs", "crates/tsuzuri-boundary/tests/server_seat.rs", "crates/tsuzuri-boundary/tests/server_acct.rs"]
verify = ["cargo nextest run -p tsuzuri-boundary --test mdoch --no-tests=fail mdoch_", "cargo nextest run -p tsuzuri-boundary --test eheld --no-tests=fail eheld_vessel_", "cargo nextest run -p tsuzuri-boundary --test server_seat --no-tests=fail server_seat_", "cargo nextest run -p tsuzuri-boundary --test server_acct --no-tests=fail server_acct_", "cargo run -q -p xtask -- check"]
size = "S"
done = "(1) 境界の server の seat の pub const DOCTOR_HOLD は Duration の 60 秒、SLOW_HOLD は 30 秒、HOLD は 5 秒で、pub fn ceiling は頭 DOCTOR_ARGS に DOCTOR_HOLD を、頭 USAGE_ARGS に SLOW_HOLD を、頭 TICK_ARGS に HOLD を返す（歯 mdoch_holds_by_head） (2) 境界の crate の src/server/seat.rs の pub fn read_held の本体（字下げの後が字 pub fn read_held( で始まる最初の行から、その行と同じ字下げの閉じの括弧だけの行まで）は字 ceiling(head) を 1 度持ち、src/acct.rs の fn held_rule の本体（字下げの後が字 fn held_rule( で始まる最初の行から同じ形で切った字）は字 SLOW_HOLD を 1 度持ち、src/acct.rs の全体は字 DOCTOR_HOLD を持たない（歯 mdoch_reads_wiring_text） (3) 歯の file crates/tsuzuri-boundary/tests/mdoch.rs の test の fn は 3 つで、名はどれも mdoch_ で始まり、歯の file は 19 節のfilter の語の一覧の 356 語（起草の時の main 754442db の契約表の verify の最後の字）を字のまま持って数 356 を断言し、名から mdoch_ を除いた字はその 356 語のどれも含まず、356 語のどれも字 mdoch_ を含まず字 mdoch_ に含まれない（歯 mdoch_own_names_clean） (4) 書き換えた着地済みの歯が通る（eheld_vessel_marks_by_head は ceiling(&DOCTOR_ARGS) を DOCTOR_HOLD と比べる・server_seat_holds_outputs_five_seconds と server_acct_holds_five_seconds は 5 秒の後の読みで tick status だけを撃ち直す）。ほかの歯の全部も通る（xtask の check）"
goal = "在りかの main は 754442db（このノートの 16 行が置かれ、行 k-tz-tests〔便 t3-hub.74.4〕が走っている）。起草 w50a が main 754442db の写しで試作した。書く file は境界の server の seat（src/server/seat.rs）と、着地済みの歯の file 3 つ（tests/eheld.rs・tests/server_seat.rs・tests/server_acct.rs）と、新しい歯の file tests/mdoch.rs。 なぜ。判断の記録 ADR-26（持ち主の裁定 t3-hub.52.156:20260930T1120Z-1 と t3-hub.52.157:20260930T1120Z-1・案 A）の決定 (2) の行。判断の記録 ADR-23 の行の全部と行 m-big-copies の着地の後も、面の server の頁 1 枚の 300 秒の平均が規則の行 R-34 の 20% を越えた回が残った。器の doctor の撃ちは頁の 300 秒に 71〜85 本で、doctor だけの上限を 60 秒にした試作（起草 w36a の試作 B・この行と同じ形）は、並べた測りで doctor の計算を 1.2〜2.8 ポイント減らし、打ち切った台帳の読みまで数える組で頁の全体を 28.0% から 24.9% にした。使用量の読み（usage）と規則の行の読み（rules get）の計算は頁の 0.1〜0.2 ポイントで、延ばしても減らないので 30 秒のままにする（ADR-26 の却けた案 d）。これだけでは越えた回を 20% の内に戻せず、残りは器の側の直し（ADR-26 の決定 (4)・器の席は doctor の入口で event log を 1 回だけ読む便を器の側で起こすと答えた・出所は問い t3-hub.52.157 の notes）で扱う。 形。src/server/seat.rs の pub const SLOW_HOLD の直後に pub const DOCTOR_HOLD（Duration の 60 秒・doc は doctor の出力を持ち回す長さ）を足し、pub fn ceiling を 3 つの腕に分ける（頭が DOCTOR_ARGS なら DOCTOR_HOLD、USAGE_ARGS なら SLOW_HOLD、ほかは HOLD）。SLOW_HOLD の値は 30 秒のままで、その doc を、残量の出力と境界の acct の規則の行の読み（rules get）を持ち回す長さの字にする。module の doc の 10 行目と fn ceiling の doc の字を、doctor は DOCTOR_HOLD（60 秒）・usage は SLOW_HOLD（30 秒）の字にする。境界の acct の fn held_rule（rules get を印の無い鍵で SLOW_HOLD の間持つ）と、fn read_held（頭ごとの ceiling(head) を表に渡す）と、doctor の入力の印（fn input_marks・ADR-23 の決定 (2) のまま・event log を含むので器の event の書きの後の要求では上限の内でも撃ち直す）と、表の Held と読めなかった読みの FAILED_HOLD（5 秒と上限の短い方）は変えない。src の足しは unwrap・expect・panic・todo・unimplemented・dbg・exit を使わない。依存と口の電文の形は変えない。 開示（ADR-26 の決定 (3)・歯は測らない）。doctor の印の外の入力（tmux と起動の管理と口座の dir の file と plugin と git）の変化と、doctor の語の打刻が無いと読めないの変わりは、上限の 60 秒を過ぎた後の最初の頁の読み直しで面に出る。遅れる面の字は、account board の次の移り先と移り先の候補と候補が門で落ちた理由と休止中の席の列、席の card の群の行（断りと逼迫の欄）と anchor で、写す字は変えない。 今の字（main 754442db）。src/server/seat.rs の 47〜48 行は、doc の字 doctor と残量の出力を持ち回す長さ（入力の印が動けば、この中でも撃ち直す）。と pub const SLOW_HOLD の 30 秒の定義で、210〜217 行の pub fn ceiling は、頭が DOCTOR_ARGS か USAGE_ARGS なら SLOW_HOLD、ほかは HOLD を返す 1 つの