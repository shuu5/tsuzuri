goal = "判断の記録 ADR-23 の決定 (1)〜(5) の後の残りの、server の使う記憶の量（RSS）の直し。中核の account の project の ProjectTexts の欄 events と ledger と、host の HostTexts の欄 events を Option<Arc<str>> にする（fixture の JSON の字か null は、account の mod.rs に足す pub(crate) fn shared_text が String で読んで Arc に替え、欄の無い形は serde の default で None・serde の rc の機能を足さない）。境界の server の ledger の Source は、読めた台帳の字を Arc<str> で持ち、合流の読み（Coalesce）の結果・最後に読めた字（欄 last）・最後に終えた読みの結果（欄 latest）・Got の欄 text は同じ確保を分け合う。Source の text は今までどおり String を返し、Form の kick には String を写して渡し、口の board の Texts の欄 ledger も今までどおり String に写す。境界の acct の Acct は欄 logs（event log の path → 読む前に取った印〔server の events の stamp・更新時刻と長さ〕と字）を持ち、fn log は印が前の読みの前に取った印と同じなら file を読まず前の Arc を返し、違えば読み直して置く。project の字の events と host の字の events は fn log で読み（同じ state dir の anchor と引数の state dir は 1 つの字）、集めの終わりに、その集めで読まなかった state dir の字を放す。台帳の字は Got の Arc のまま project の字に渡すので、読み解きの持ち回し（行 c-acct-parse）の字の比べは、同じ確保なら字を比べない（Arc の等しさは確保が同じなら中身を見ない）。電文と口の形と依存は変えない。 なぜ。調べ役の測り（席の記帳）で、面の server の RSS は頁を開いた 300 秒で 0.7 GB から 1.2〜1.7 GB に伸び、同じ binary を MALLOC_ARENA_MAX=2 で起こすと 0.41 GB で平らだった（glibc の thread ごとの arena が、放した大きな確保を抱える）。起草の時の口 /api/account の 1 回は、群の宣言の state dir ごとの event log（8 本・合わせて約 15.1 MB・最大 8.2 MB）と引数の state dir の event log を file から読み直し、anchor ごとの台帳の字（8 本・合わせて約 38.1 MB・最大 11.8 MB）を持ち回しと Got から写していた。集めの scope の thread と口の接続の thread がそれぞれ確保して放すので、arena ごとに抱える。 起草の測り（試作の release と main 4ad0b18f の release を loopback の別の port で同じ時に並べ、--read-only --bdw /bin/false・客は project board の home の頁と同じ口を知らせの種類で読み直す・区間は R-34 と同じ・RSS は閉じた後の終わりの値）。(a) 2 本（器の event log の書き 1.8 行/分）: RSS 1191 MB → 850 MB、頁の 300 秒の server 自身 2.6% → 2.1%（子を足した和 13.0% → 12.4%）。(b) 4 本（1.5〜3.2 行/分・4 本が同時に読むので CPU は相対だけ）: MALLOC_ARENA_MAX 無しで 1234 MB → 750 MB、起こしの道具の今の環境と同じ MALLOC_ARENA_MAX=2 で 414 MB → 266 MB、server 自身 3.0% → 2.4%・3.6% → 2.3%。(c) 口 1 つだけを 7 秒ごとに 300 秒読んだ 4 本: /api/account で 797 MB → 311 MB、/api/next で 62 MB → 26 MB（大きな確保の元は account board の読み）。どの回も閉じた後の 120 秒は 0.1%。 依存と順。depends は無い。同じノートの行 k-tz-entry（tests/server_acct.rs の依存の歯の字）と k-lint-tests（3 つの crate の tests/ を dir の形で書き、歯の crate の根に #![cfg(test)] を足す）が、この行の書く歯の file と重なる。この行の着地済みの歯の file の替えは字の型の合わせだけ（server_acct.rs は fixture の組みの 3 行で行の数は同じ）なので、どちらが先でも当て直しは小さい。新しい歯の file tests/mbig.rs は頭の説明の直後に #![cfg(test)] を置く（k-lint-tests が先でも後でも根の形が合う・k-tz-entry の tzent.rs と同じ形）。歯でない code に unwrap と panic を書かない。台帳の読みの束ねや doctor の上限の行（持ち主の答え待ち）が後で acct.rs と ledger.rs を書くなら、この行の後に当て直す。 範囲の外と費用。印（更新時刻と長さ）が同じまま字だけが替わる書きは読み直さない（知らせの見張りの印と同じ形・器の event log は追記だけ）。台帳が動いた周の bd の出力の読み（proc の capture）・読めるかの確かめ（parse_bd）・読み解き（Parsed::of）の大きな確保と、口の board の Texts への写し（/api/next など・起草の測りで小さい）と、event log を要る欄だけの型で読む形は変えない（後の行の候補・計画だけの行にしない）。RSS の一番大きな手は起こしの道具の MALLOC_ARENA_MAX=2（repo の外・席が 2026-09-30 に当てた）で、この行はその上でも減らす。 今の字（main 4ad0b18f）。中核の src/account/project.rs の ProjectTexts は #[derive(Debug, Clone, Default, PartialEq, Eq, Deserialize)] で、欄 events と ledger は Option<String>。src/account/host.rs の HostTexts の欄 events も Option<String>。境界の src/acct.rs の fn gather は anchor ごとに ProjectTexts の events を read(&events_log(dir)) で、host の events を read(&events_log(&self.state_dir)) で要求ごとに読み、Kept は (Option<String>, Option<String>, Arc<Parsed>)。src/server/ledger.rs の Source は欄 shared に Coalesce<String>・last に (Option<String>, Instant)・latest に Option<Option<String>> を持ち、Got の欄 text は Option<String>。src/server/board.rs の gather_held は Texts の ledger に Got の text を渡す。着地済みの歯 lsnap と rhold は Got の text を String と比べ、server_acct と中核の acctpcore・athr・cdorm・cspk・pclosed・plimit・pquest・punmap・sclosed は ProjectTexts か HostTexts の events と ledger に String を置く。この行はそれらの字を Arc に替える（into か map(Into::into)・歯の数と名は変えない）。 試作と噛み。main 4ad0b18f の写しで、xtask の check（公開の走査・build・nextest の全部・clippy・面の組み立て）が rc 0（nextest 2934 本）。書く file は write-set と一致し（差分の file 18 個・新しい歯の file 1 個）、差分は 36558 byte（+366 −47 行）。tests/server_acct.rs は 1368 行のまま（上限 1500 の余地が大きさの見込みより小さいので growth 5）。変異 10 個を 1 つずつ当てて名指した歯を撃ち、done の歯は全部どれかの変異で落ちた（M1（印が同じでも event log を読み直す）と M4（project の event log を要求ごとに file から読む）で mbig_log_kept、M2（印が動いても読み直さない）で mbig_log_moved、M3（読まなかった state dir の字を放さない）で mbig_log_released、M5（見張りの読みの字を got ごとに写す）と M6（最後に読めた字を got ごとに写す）で mbig_got_shared、M7（shared_text が字を捨てる）と M8〜M10（ProjectTexts の ledger と events・HostTexts の events の欄の既定を外す）で mbig_texts_read_json）。"

