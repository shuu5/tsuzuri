esign_doc が要約を読まない変異（kcli は要約を見ない）、fn build が空の値を断らない変異（tz surface serve の空の値を撃つ歯は無い）、fn build が repo と files の dir を取り違える変異 2 つ（名指した歯はどちらも dir を渡し面の file を読まない）、put_flag が 2 度の旗を断らない変異（sttgt が撃つ 2 度の旗は --all で put_flag を通らない）、face_ports が読んだ port を捨てる変異（名指した歯はほかの project の board を持つ命令の列を撃たない）。verify の clippy の行への 3 つの変異（fn build を 82 行にする・fn watch の引数を 6 にする・stage/relay.rs に r4-args-mark の属性を残す）は、どれも clippy の行を rc 101 で落とした（too_many_lines 82/60・too_many_arguments 6/5・満たされない lint の expect の error）。 filter の語。この行は新しい歯を足さない。verify の語は着地済みの境界の歯の名の頭。 流す時と順。depends は r4-args-mark（境界の 3 file の 4 つの属性を外す）。書く file（境界の src の 13 と歯の 2）は、同じ時に起草している本体の行 r4-core-src・r4-surface-src と重ならないので、r4-args-mark の着地の後に並べて流せる（面の歯は境界を開発の依存として組むが、器の便はそれぞれの worktree で組む）。境界の crate は持ち込んだ folio の crate（folio2/crates/folio）に path で依り、境界の package の [[test]] が folio の歯を組むので、folio2/ の下を書く行（r4-folio-src-a と r4-folio-src-b）の便とは並べない（器は folio2/ の重なりを見ない・席が便を置く時に前後に分ける）。後の境界の歯の行（r4-boundary-tests-a と r4-boundary-tests-b）は tests/strelay.rs を書くので、この行を depends に置く。ほかのノートで流れている行が境界の src の 13 file か歯の 2 file を書くなら、席が置く時に照らす。 範囲の外。境界の歯の違反 72（後の歯の行）。根の Cargo.toml の表への R-4 の 3 つの lint の足しと一覧 ENABLED（後の表の行）。clippy.toml。中核・面・folio の本体（このノートのほかの本体の行）。"

