 試作と噛み。main 4ad0b18f に行 k-tz-entry とこの行を当てた木で撃った。書く file は write-set の 2 で閉じる（試作の diff 17,628 byte）。tzpar_ の 6 本は緑（xtask の check の中で、床と導出と天井の組 5.2 秒・面と図と配信の組 3.4 秒・索引 0.3 秒・始まり 0.2 秒）。xtask の check は行 k-tz-entry の節の数のとおり rc 0。変異 8（fixture から hello を落とす・tz が標準エラーを標準出力へ書く・床の不合格の期待を 0 にする・tz が --summary を落とす・部品の検査の期待を 0 にする・tz の init が作業場に余分な file を書く・usage の命令の名を戻さない・歯の名に filter の語）で、done の各歯が少なくとも 1 つの変異で落ちた。 filter の語。新しい接頭辞 tzpar_ は、main 4ad0b18f の契約表の verify の最後の字 325 語のどれとも、どちらの向きの部分の字としても重ならない。歯の名の字は、接頭辞を除いて 325 語のどれも含まない。 流す時と順。depends は同じノートの行 k-tz-entry（入口 folio::entry::run と NAMES と tz の口を使う）。書く file は行 k-tz-entry と重ならない。新しい歯の file tests/tzpar.rs の頭の説明の直後に #![cfg(test)] を置く（行 k-tz-entry の節と同じ）。 範囲の外。席の道具の切り替えの前の、道具の pin（外の固定の folio）と tz の口の出力の byte の比べ（判断の記録 ADR-18 の決定 (2)・席の手）。check --proposed の byte の一致。"

