icy_reason・REASON_HEAD・POLICY_MARK）は数えない。 器の読み手での確かめ。器の main 46205eaa（close の理由の読み手は 918b9180 と同じ字で、それが引く is_bead_id と epoch_of も 09197b21 から変わっていない）の close_reason.rs を起草の場の外の一時の crate に写し、台帳の接頭辞 t3 で掛けた。新しい 3 形（裁定 t3-hub.59.28:20260930T0215Z-1・同じ id に 束 batch:20260930T0215Z-1 を続けた形・別の id に 取り消す = <前の id> を続けた形）は Form::Ruling でそれぞれの id を返し、裁定 policy:t3-hub.62:20260928T1050Z-1 は接頭辞が在っても無くても Form::Ruling で policy:t3-hub.62:20260928T1050Z-1 を返した。前の束と取り消しの形は Defect::Value(Head::Ruling) を、前の方針の形 方針 t3-hub.62:20260928T1050Z-1 は Defect::UnknownHead を返した。写した読み手の in-file の歯 7 本も緑。器の file は書いていない。 決めた幅（起草の決め）。(a) 区切りは器の勧めの半角の空白 1 つ（器の読み手は全角の空白でも割るが、勧めの字に揃える）。(b) 理由を組むのは ruling.rs の 2 つの fn（reason と policy_reason）に寄せ、batch.rs と policy.rs はそれを呼ぶ（頭と区切りと印を 2 か所に書かない）。(c) 方針の閉じの理由に続きの字は付けない（方針の範囲は notes の 方針 id = の行と label に在る）。(d) policy.rs の const TITLE（字 方針）は方針の問いの題に残る。 試作と噛み（起草 w46a）。main 922314b0 の写しにこの行を当てた木で撃った。書く file は write-set の書く file の 8 で閉じる（試作の diff 31,026 byte・足し 541 行・消し 15 行・src の増えは ruling.rs が 22 行・batch.rs が 0 行・policy.rs が 0 行）。xtask の check は rc 0（歯 2,936 本）。変異 13（理由の区切りを字 ・ にする・束の close を前の字の形に戻す・取り消しの開き直しを前の字の形に戻す・続きの無い理由の末に空白を足す・理由の頭を別の字にする・束の close が束の id を落とす・1 問の close が理由を自前で組む・歯の file に filter の語を含む歯を足す・方針の閉じを前の字 方針 <id> に戻す・方針の閉じが印を落とす・方針の印を別の字にする・台帳の読みが方針の問いを見分けない・配達の読みが方針の行も裁定と数える）で、done の各歯が少なくとも 1 つの変異で落ちた。 filter の語。新しい接頭辞 rsid_ は、main 4ad0b18f の contracts の verify の filter の語（322 語・畳んで 247 語）のどれとも部分の字として重ならず、どの filter の語も rsid_ を含まない。main 922314b0 で足された filter の語はこの行の rsid_ だけ。 流す時と順。depends は k-tz-entry（席の決め 2026-09-30・tz 化を先に進める）。行 k-tz-entry は、この行が書く server_batch.rs と、この行の置き場の server_ask.rs を書くので、この行はその着地の後の main に当て直してから流す（重なる file は、その着地の後の字に当てる）。行 k-lint-tests も境界の crate の tests/ の dir を書くので、この行と同時には流れず（器の交差の断り）、後に着地する方が当て直す。器の局面の出力の切り替え（器の束 E の W4）より前に着地させる。この行の後に同じ ruling.rs・batch.rs・policy.rs を書く行は、この行の着地の後に当て直す。 範囲の外。台帳に在る前の形の理由の書き換え。器の読み手の変更。notes の定型行の形。close の理由を承認として読む新しい読み手。"

