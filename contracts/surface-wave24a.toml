goal = "在りかの main は 09d898f6。この節の今の字と試作の数は起草の main 922314b0 のもの（行 k-tz-entry の着地で、この行が書く server_batch.rs と置き場の server_ask.rs の字が変わるので、便はその着地の後の main に当て直す）。書く file は境界の crate の server の ruling.rs と batch.rs と policy.rs と、新しい歯の file の rsid.rs と、着地済みの歯の file の server_batch.rs・bhalf.rs・rvk.rs・epolq.rs（期待の argv の字だけ）。第 0.2 版の行（方針の閉じを範囲の外に置いた形）に、器の席の 2 つ目の答えの方針の閉じの形を足した直し。 なぜ。器（scribe2）の席の答え（2026-09-30T05:1xZ）。器の close の理由の読み手（器の main 09197b21 の ledger/close_reason.rs の pub fn read）は、前後の空白を除き Unicode の空白で割った 1 語目を 9 つの頭と照らし、頭が 裁定 なら 2 語目だけを裁定 id の形（問い id の形 <問い id>:<年月日 T 時分 Z>-<n>・batch: の形・policy: の形）で読み、3 語目から後は読まない。tsuzuri の束の受付（batch.rs の fn accept）は問いを 裁定 <id>・束 <束の id> で閉じ、取り消し（ruling.rs の fn reopen）は問いを 裁定 <id>・取り消す = <前の id> で開き直す。空白で割ると 2 語目は id と字 ・ と次の語の頭をつないだ字になり、問い id の形の裁定 id は値の形の外に落ちる（数の欄が 1・束 のような字になる）。方針の受付（policy.rs の fn accept）は方針の問いを 方針 <方針の id> で閉じ、1 語目が 9 つの頭の外に落ちる。器が局面の出力（lifecycle.json・器の束 E の W4）へ切り替えた後に、tsuzuri が閉じた問いが misfit と判じられないように、器の読み手を変えずに解ける形へ直す。器の席の 2 つ目の答え（2026-09-30）は、方針の閉じには器の頭を足さず、裁定 policy:<方針の id> の形にするとした（器の close_reason.rs〔main 918b9180〕は裁定 id の形として policy:<字> と batch:<字> を既に受ける・const RULING_POLICY と fn is_ruling_id）。 形。ruling.rs に pub const REASON_HEAD（字 裁定）と pub fn reason（裁定 id と続きの字の Option を受け、続きが無ければ 裁定 <id>、在れば 裁定 <id> <続き>・区切りは半角の空白 1 つ）を置き、1 問の裁定の close（fn accept）・取り消しの開き直し（fn reopen・続きは 取り消す = <前の id>）・束の close（batch.rs の fn accept・続きは 束 <束の id>）の 3 か所の理由をこの fn で組む。方針の問いの close（policy.rs の fn accept）は、ruling.rs の pub const POLICY_MARK（字 policy:）と pub fn policy_reason（裁定 policy:<方針の id>）で組む。方針の id は今までどおり <方針の問いの id>:<分>-1 で、notes の 方針 id = の行も変えない。新しく書く理由は 裁定 <id>・裁定 <id> 束 <束の id>・裁定 <id> 取り消す = <前の id>・裁定 policy:<方針の id> の 4 形で、1 問の形の字は今と同じ。続きの字（束 の語と束の id・取り消す = と前の id）は今のまま残す（器の読み手は読まないが、台帳を人が読む時の手がかり）。notes の定型行（裁定 id = <id>・問い = … の形と、その欄の終わりの字 ・）は変えない。新しい歯の file rsid.rs は crate の根に #![cfg(test)] を置き（規則 R-10 の lint の行が統合の歯の crate の根に置く形・歯の中の unwrap と panic は clippy の allow-*-in-tests で許す）、src の足しは unwrap・expect