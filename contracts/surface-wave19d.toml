schema = 1

[[contract]]
id = "g-gz"
title = "surface-build が dist の wasm・js・css ごとに gzip の写しを置き、server は要求が gzip を受けるときだけ写しを Content-Encoding gzip で返す（xtask の直接依存に miniz_oxide を 1 本足す）"
req = ["NFR2"]
section = "3"
write-set = ["xtask/Cargo.toml", "Cargo.lock", "xtask/src/main.rs", "+xtask/src/gz.rs", "crates/tsuzuri-boundary/src/server/http.rs", "crates/tsuzuri-boundary/src/server/files.rs", "+crates/tsuzuri-boundary/tests/pgz.rs", "=crates/tsuzuri-boundary/tests/ecache.rs"]
verify = ["cargo nextest run -p tsuzuri-boundary --test pgz --no-tests=fail pgz_", "cargo nextest run -p xtask --no-tests=fail pgz_", "cargo nextest run -p xtask --no-tests=fail skeleton_", "cargo nextest run -p tsuzuri-boundary --test ecache --no-tests=fail ecache_", "cargo nextest run -p tsuzuri-boundary --lib --no-tests=fail http_", "cargo run -q -p xtask -- check"]
size = "M"
done = "(1) 境界の crate の server の pub mod files の pub fn accepts_gzip（頭 Accept-Encoding の字の Option<&str> を受け bool を返す）は、節の表の 18 の字にそれぞれ表の値を返す（歯 pgz_accepts_gzip_table） (2) server の pub mod http の pub fn read_request は、頭の名が大小の字を問わず Accept-Encoding の行の値の前後の空白を除いた字を pub struct Request の pub な欄 accept_encoding（Option<String>）に置き、その頭の無い要求では None を置く（節の 3 つの要求の値）（歯 pgz_request_reads_encoding） (3) files の pub fn respond は、節の置き場への節の表の 10 の要求に表の status・Content-Type・本文・頭（Content-Length を除く名と値の列）を返し、無い file の要求に 404、置き場の外の要求に 403 を頭を足さずに返し、pub fn gz_copy は写しの在る style.css に隣の style.css.gz を、写しの無い file と置き場の外を指す写しの file に None を返し、pub const GZ_SUFFIX は .gz（歯 pgz_respond_picks_copy） (4) xtask の module gz の fn crc32 は、字 123456789 の byte に 0xCBF43926、空の byte に 0、字 a の byte に 0xE8B7BE43 を返す（歯 pgz_crc32_check_values） (5) gz の fn gzip は、空と字 tsuzuri と節の 70000 byte の入力に、頭の 10 byte が const HEADER、末の 8 byte が入力の CRC-32 と長さの下位 32 bit の little endian、間の byte を miniz_oxide の inflate で戻すと入力と同じ byte の出力を返し、70000 byte の入力の出力の長さは入力の 10 分の 1 より短く、同じ入力の 2 度の出力は同じ byte で、HEADER は 1f 8b 08 00 00 00 00 00 02 03、const LEVEL は 9（歯 pgz_gzip_round_trip） (6) gz の fn write_copies は、節の dist の 7 つの file（子の dir の下を含む）のうち拡張子が wasm・js・css の 4 つの file の隣に、名に .gz を足した名で fn gzip の出力と同じ byte の写しを書いて写しの path を名の順に返し、index.html と favicon.ico と名が .gz で終わる file の写しは書かず、無い dir を渡すとその dir の名を含む誤りを返し、const EXTENSIONS は wasm・js・css（歯 pgz_write_copies_only_assets） (7) xtask の歯の表 DIRECT_DEPS の xtask の行は miniz_oxide と tsuzuri-boundary の 2 つで、xtask/Cargo.toml の依存の節の名の列と一致する（歯 skeleton_direct_deps_match_list） (8) files.rs は fn respond の宣言の行（req の &Request と root の &Path を受け Response を返す 1 行）を持ち、字 outside・no-file・Cache-Control を引用符で囲んだ字をそれぞれ 1 度だけ持つ（歯 ecache_handle_wiring_text）"
goal = "在りかの main は b8beec2（計画 surface-plan v0.62）。書く file は 2 つの場に在る。xtask（workspace の member・bin の crate・cargo run -q -p xtask の形で撃つ）と、境界の crate tsuzuri-boundary の lib.rs の pub mod server の下の pub mod http と pub mod files（crate の外からは tsuzuri_boundary::server::http と tsuzuri_boundary::server::files）。 なぜ。g-strip の後の面の wasm は約 3.02 MB で、board の最初の取り込みが重い（要件 NFR2・持ち主の重いという指摘）。gzip -9 で約 0.96 MB になる（2026-09-28 の実測・着地の時に dist の実物で測る）。持ち主は配布の file の圧縮のために外の部品を 1 つ足すことを許した（条 A-3 の裁定 t3-hub.52.40:20260928T0156Z-1・計画の判断の表 d29）。足すのは xtask の直接依存 miniz_oxide の 1 本で、境界の crate と面の crate の依存は増やさない（計画の 3 節の席の決め・brotli・flate2・端末の gzip の道具を退けた理由も 3 節）。 在りか・xtask/src/main.rs（write-set・今の main で 472 行）。module の doc（1〜3 行・surface-build は trunk を呼び dist に index.html と wasm の file を出す）・fn surface_build（87 行の doc の後・面の crate の dir で trunk build を撃ち、fn dist_missing が None なら 0）・fn dist_missing・#[cfg(test)] mod tests の const DIRECT_DEPS（crate ごとの直接依存の名の一覧・名の順・上の doc の注に便ごとに足した外の部品の名）と歯 skeleton_direct_deps_match_list（各 member の manifest の依存の名の列と一覧が一致する）。xtask/Cargo.toml の依存の節は今の main で空。 在りか・server/http.rs（write-set・今の main で 399 行）。pub struct Request（pub な欄 method・target・host・origin・content_length・body・derive は Debug・Clone・PartialEq・Eq）と pub fn read_request（頭の行を名の大小の字を問わず読み、Content-Length・Host・Origin だけを欄に置く）。同じ file の単体の歯 5 本（server_min_http_ と server_ask_http_ と server_view_http_ で始まる名）のうち 2 本は Request を欄ごとの字で組む。 在りか・server/files.rs（write-set・今の main で 148 行）。pub const IMMUTABLE と NO_CACHE・pub enum Served・pub fn resolve（URL の path を置き場の中の file の実体の path に解く・dir は index.html）・pub fn serve・pub fn hashed・pub fn respond（serve の File なら Content-Type と本文に頭 Cache-Control を 1 つ足し、Outside は 403 の字 outside、Missing は 404 の字 no-file）・私的な fn percent_decode と content_type。server の mod.rs の fn handle は、どの口にも当たらない GET で files::respond を 1 度だけ呼ぶ（この行は mod.rs を書かない）。 使う物（この行は書かない・確かめた）。miniz_oxide 0.8 の pub fn deflate::compress_to_vec（生の deflate・段 0〜10）と inflate::decompress_to_vec（歯だけが使う）。既定の feature は with-alloc で、Cargo.lock に足す包みは miniz_oxide と adler2 の 2 つ（license は MIT OR Zlib OR Apache-2.0 と 0BSD OR MIT OR Apache-2.0・どちらも規則の行 R-2 の一覧に在る）。 形（xtask）。xtask/Cargo.toml の依存の節に miniz_oxide の版 0.8 の 1 行と、その上に行 g-gz と裁定 id を書いた注の 1 行を足す。新しい file xtask/src/gz.rs に pub const EXTENSIONS（wasm・js・css）・SUFFIX（.gz）・LEVEL（9）・HEADER（1f 8b 08 00 と時刻の 0 の 4 byte と 02 03）と、pub fn crc32（反転の多項式 0xEDB88320 の bit ごとの計算・表を持たない）・pub fn gzip（HEADER・compress_to_vec の出力・CRC-32・長さの下位 32 bit）・pub fn wanted（拡張子が EXTENSIONS のどれか）・pub fn write_copies（dist の下を子の dir まで名の順に歩き、wanted の file ごとに隣へ名に SUFFIX を足した写しを書く・在れば書き直す・読めない書けない file はその path を名指す誤り）と単体の歯 3 本を置く。main.rs は module の doc に 1 行と mod gz を足し、fn surface_build は dist_missing が None の後に write_copies を撃ち、書いた数を標準エラーに 1 行出して 0、誤りなら字を出して 1 を返す。DIRECT_DEPS の xtask の行に miniz_oxide を名の順に足し、上の注に行 g-gz と裁定 id を足す。 形（server）。http.rs は Request に pub な欄 accept_encoding（Option<String>・欄 origin の後）を足し、read_request は名が Accept-Encoding の頭の前後の空白を除いた値を置く（同じ名の頭が 2 行在れば後の行）。Request を欄の字で組む単体の歯 2 本に accept_encoding の None を 1 行ずつ足す。files.rs は module の doc に 3 行と pub const GZ_SUFFIX（.gz）と pub fn accepts_gzip と pub fn gz_copy を足し、respond を次の形にする。resolve の実体の path の隣に gz_copy の写しが在れば頭 Vary に Accept-Encoding を足し、さらに要求の accept_encoding が accepts_gzip で真なら写しの中身を読んで頭 Content-Encoding に gzip を足す。Content-Type は元の file の拡張子、Cache-Control は今と同じく URL の名の hashed で決める。字 outside と no-file と Cache-Control は今と同じくそれぞれ 1 か所に置く（読めない file も 404 の字 no-file の 1 か所に寄せる）。 accepts_gzip の読み（書き手と読み手が割れないことを節で持つ）。字を , で分けた項ごとに ; の前の名の前後の空白を除き、大小の字を問わず gzip の項が在り、その項の引数に q が無いか、q の値の前後の空白を除いた字が数として読めて 0 より大きければ真。x-gzip と *（どれでも）は受けない側に倒す（今の browser は gzip の名を送る・推測）。q の値が数として読めない項も受けない側に倒す。 節の表（accepts_gzip・歯 pgz_accepts_gzip_table）。真: gzip・GZIP・gzip, deflate, br, zstd・gzip;q=0.001・gzip;q=1.0・前後に空白の在る gzip ; Q=0.5・gzip;q=0, gzip・identity;q=1, gzip;level=9。偽: 字の無い頭・空の字・deflate, br・gzip;q=0・gzip; q=0.000・gzip;q=abc・br;q=1, gzip;q=0・x-gzip・*・gzipx, deflate。 節の置き場と表（respond・歯 pgz_respond_picks_copy）。置き場は index.html・app-0123abcd_bg.wasm と写し・app-0123abcd.js（写し無し）・style.css と写し・evil.js と、置き場の外の file を指す symlink の evil.js.gz。要求と応答は次の 10。wasm に gzip, br は写しの本文と頭 Cache-Control（IMMUTABLE）・Vary・Content-Encoding。wasm に頭無し・gzip;q=0・br は元の本文と Cache-Control（IMMUTABLE）・Vary。/style.css に gzip は写しの本文と Cache-Control（NO_CACHE）・Vary・Content-Encoding。/app-0123abcd.js に gzip は元の本文と Cache-Control（IMMUTABLE）だけ。/ と /index.html は元の本文と Cache-Control（NO_CACHE）だけ。/evil.js に gzip は元の本文と Cache-Control（NO_CACHE）だけ。/app-0123abcd_bg.wasm.gz に gzip は写しの本文を Content-Type application/octet-stream と Cache-Control（IMMUTABLE）だけで返す（写しを名指す要求は今と同じ配り）。 変わらない行と読む順と落ちる時（歯で測らず、この行の差分で持つ）。変わらない: 写しの無い file と Accept-Encoding の無い要求の本文と Content-Type と Cache-Control（写しの在る file にだけ Vary が足る）・resolve と serve と hashed の字・mod.rs の fn handle・index.html を写さないこと・trunk の撃ち方と dist_missing。読む順: surface-build は trunk の後に dist_missing を見て、揃っていれば写しを書く。落ちる時: 写しを書けなければ surface-build は rc 1（xtask check の段 surface-build が落ちる）。写しが読めなければ 404。 決めた幅（起草の決め）。(a) 写しは dist の下を子の dir まで写す（trunk の snippets の js も同じ扱い）。(b) Vary は写しの在る file だけに付け、写しの無い file の頭は今と同じにする。(c) gzip の頭の時刻は 0 に置き、同じ中身からどの host でも同じ byte の写しを作る（条 N-3）。(d) 圧縮の段は 9。(e) 枠と CRC-32 を xtask に自分で書く（flate2 の 4 つの包みを避ける・計画の 3 節）。(f) dev の profile の miniz_oxide の opt-level の上書きは足さない（xtask check の surface-build の圧縮の時間を便の記録に書き、長ければ後の行で足す・workspace の Cargo.toml を書かない）。 着地済みの歯（grep で確かめ、試作で撃った）。ecache は files.rs の respond の宣言の行と 3 つの字の数と mod.rs の fn handle の字を見る（置き場だけの =・直さずに通る）。http.rs の単体の歯 5 本は write-set の http.rs の中に在り、2 本の Request の組みを直す。xtask の skeleton_ の歯 9 本は DIRECT_DEPS を直して通る。server_min の 8 本は files.rs と http.rs を使うが字を見ず、直さずに通る（verify に入れない）。 測り方・歯（tests/pgz.rs・新しい file と xtask/src/gz.rs の単体の歯）。tests/pgz.rs が使う item は tsuzuri_boundary::server::files の GZ_SUFFIX・IMMUTABLE・NO_CACHE・accepts_gzip・gz_copy・respond と server::http の Response（pub な欄 status・content_type・body・headers）と read_request。置き場は CARGO_TARGET_TMPDIR の下に作る。xtask の単体の歯は置き場を std の temp_dir の下の process ごとの名の dir に作る。試作（main に行 j-runner の xtask の依存の字を当てた土台）で新しい 6 本と着地済みの歯が通り、噛みを見た（q を見ない・Accept-Encoding を読まない・Vary を付けない・置き場の外の写しも使う・受けなくても写しを返す・CRC の多項式を違える・末の長さを書かない・css でなく html を写す・依存の表を直さない、でそれぞれ名指した歯が落ちる）。 新しい歯の名。どれも接頭辞 pgz_ で始まり、pgz_ の後の字は着地済みの verify の filter の語を部分の字として含まない（試作の lint で確かめた）。xtask の --no-tests=fail skeleton_ と tsuzuri-boundary の --lib の filter は pgz_ の名に当たらない。 依存と順。depends は空（同じノートにほかの行を置かない）。計画の 5 節の鎖は xtask/src/main.rs と xtask/Cargo.toml と Cargo.lock が g-strip（着地済み）→ j-runner（ノート surface-wave18e・便は待ち・DIRECT_DEPS の xtask の行に tsuzuri-boundary・Cargo.toml に path の依存）→ g-gz、server/files.rs が e-cache（着地済み）→ g-gz、server/http.rs が e-idle-close（着地済み）→ g-gz。j-runner との順は便の bead の依存で持つ（席が付ける）。この行の DIRECT_DEPS と Cargo.toml と Cargo.lock の字は j-runner の着地の後の字に足す形で書き、j-runner の着地の前に流すなら xtask の行は miniz_oxide だけになる。 範囲の外。brotli・zstd の写し。index.html の写し。server の実行時の圧縮。境界の crate と面の crate の依存。Range の要求。"
