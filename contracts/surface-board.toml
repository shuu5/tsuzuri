goal = "block の便を 1 つずつ並べて走らせるために、block が共通に使う部品を先に置く。この便の後、block の便は自分の module の file と自分の歯の file だけを書く。 読みの口。block は自分の口を 1 本読む。口の path は閉じた 6 本で、ask と ledger の一覧は /api/ledger（着地済み）、next は /api/next、pipeline は /api/pipeline、seat は /api/seat、ledger の指標の段は /api/metrics、地図の頁は /api/graph。path は block の module の定数に置く。/api/ledger の外の 5 本は server にまだ無い（後の便が足す）。無い口は 200 を返さないので「読めない」になる。 読みの結果は 3 値にする（まだ読んでいない・本文・読めない）。通信の module は、path を受けて読みの結果の signal を返す関数を持つ。頁を開いたときに 1 回読み、読み直しの合図を受けたら登録された口を全部読み直す。 読み直しの合図は、変化の知らせ（SSE・/api/surface/events）の接続が開いたときと、event の名が ledger-changed か board-changed の知らせを受けたとき。board-changed は器の event の記録か設計文書が変わったことを表す名で、契約の型の crate の面の module に定数として足す（ledger-changed の定数は着地済み）。接続は頁に 1 本だけ持つ。接続が切れたら、登録された口の結果を全部「読めない」にする。 block の中身の関数は、読みの結果を受けて中身を返す純粋な関数にする。この便では next・pipeline・seat・地図の頁・ledger の指標の段の 5 つを、3 値のどれを受けても測れていないと理由の 1 行を返す形にする（本文を受けたときの理由は「この block の中身はまだ無い」）。本文を読んで中身を返すのは後の block の便。ask と ledger の一覧は今の中身のまま、同じ通信の関数で読む。 hover の card。card の層を頁に 1 つ置き、block は「要素に card を付ける関数」を呼ぶだけにする。card は 4 行（題・種類・値・出所）と「詳しく」で、1 行は 36 字まで（超える行は 35 字と「…」）。 置き場は規則の行 R-20 の値で、card の左上を pointer の右 16 ピクセルと上 20 ピクセルに置く。card の右端が窓の右端を越えるときは pointer の左 16 ピクセルに card の右端を置く。card が窓の上端か下端を越えるときは、窓に収まるまで縦に寄せる。 猶予は 150 ミリ秒（規則の行 R-20）。要素を出た点と今の pointer の点を比べ、card の矩形までの距離が縮んでいて、出てから 150 ミリ秒以内なら card を残す。それ以外は消す。置き場と猶予の判定と行の切り方は純粋な関数にして host の cargo test で pin する。行の数と字数は規則の行 R-19 の値（4 行・1 行 36 字）。歯は定数を rules の file（design-intent/rules.yaml）の行 R-20 と行 R-19 の字と照らす（読むだけ）。 web-sys の feature は、後の block の便が Cargo.toml を触らずに済むよう、この便でまとめて足す（Document・Element・HtmlElement・DomRect・Event・EventTarget・MouseEvent・PointerEvent・KeyboardEvent・WheelEvent・History・Location・Headers・Request・RequestInit・HtmlInputElement・HtmlTextAreaElement・SvgElement）。feature を足すだけで、外の依存の package は増やさない。 この便は server と中核の crate を触らない。契約の型の crate は定数 1 つを足すだけ。"
