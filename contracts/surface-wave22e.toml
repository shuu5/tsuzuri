goal = "何を。 (a) 中核。account の project の fn move_left は、その project の席の card（着地済みの fn seat が組む・2 行目で欄 move_to と grace_left を持つ）の move_to が口座で grace_left が秒のときだけその秒を返す 1 関数にする（器の字のまま・0 も写す）。群の今の記録の ts に猶予を足して今を引く計算、猶予の秒の字の読み fn grace_secs、合図の file の字の欄 ProjectTexts::move_signal、使われなくなる fn record_value と席の行を持つ struct Seat を消す。pub fn project_rows と pub fn doc は猶予の字の引数を持たない。 (b) 境界。account の読みの集めから、猶予の rules 行 seat.move_grace_s の撃ち（pub const GRACE_ARGS）と、席の dir の合図の file move-signal の読み（pub const MOVE_SIGNAL）を消す。1 回の集めの器の撃ちが 1 回減る（歯の作業場では 9 回から 8 回）。変化の印の file と持ち回しは変えない（move-signal は前から印にしない）。 (c) 語の辞書。鍵 move_grace の説明（plain と internal）の起点を群の記録の ts から器の合図の at に、猶予の 1800 秒を器の rules 行の秒に、合図の記録の file を器の欄 grace_left の写しに直す。label は変えない。 なぜ。 器の席の答え（2026-09-28）と規則の行 R-22 のとおり、判定は器だけが持ち、tsuzuri は器の字を写して代わりの計算を作らない。器の残り秒の起点は合図の at（器の seat-heartbeat.md §18 と §20・hook/group.rs の grace_left）で、今の中核の move_left は群の記録の ts を起点にするので、合図が遅れた周に器と食い違う（R-22 の note の「器の欄を写す行で直す」の行がこの行）。要件 FR12 と受入 AC11 の残り秒の字（前は「群の記録の時刻 + 猶予 − 今」）と、ノート surface の不変条件 move-grace の赤の条件は、この行の前置きとして席が要件書 第 0.17 版とノート surface 第 0.8 版で「器の欄 grace_left= の写し（器の式は合図の時刻 + 猶予 − 今）」に直した。規則の行 R-22 の value は前から「器が欄 grace_left を出したらその字を写す」と書くので字を変えず、note の「move_left はまだ ts を起点にしていて」の字はこの行の着地の後に席が直す。器は seat tick status の席の行に欄 grace_left= を出し、2 行目がそれを席の card に写したので、account board は同じ値を読むだけでよい。語の辞書の説明は、その語が説明する値を替えるこの行で直し、行ごとに字と値を揃える（席の決め 2026-09-29）。 依存と順。depends は [c-seat-grace]（同じノートの 2 行目・席の card の欄 move_to と grace_left と中核の seat.rs の写し）。中核の歯 lresume.rs（c-limit-resume・着地済み）はこの行と 2 行目の両方が書くので、2 行目の後に流す（便の bead の依存・席が付ける）。この後に計画だけの行 c-abs-seat（move_left_s を絶対の時刻にする）を流す。 範囲の外。 契約の型 ProjectRow の欄 move_left_s の名と型と、面の account board の残り秒の字と印（cards.rs・session.rs）は変えない。値の出どころだけが替わる。残り秒の毎秒の書き直しは c-abs-seat。器の move= で移動待ちを替えるかは 2 行目と同じく範囲の外。規則の行 R-22 の字は席が直す（起草の報告に案を添えた）。 歯と verify。 接頭辞 gacct_ の 4 本（中核の tests/gacct.rs）。fixture は読むだけで、器の §20 の形の欄は歯の中で組む。 書き換える着地済みの歯: 中核の acctpcore（acctpcore_move_left_seconds を器の字の写しの形に・doc と project_rows の呼びから猶予の字を除く）・athr・cdorm・cspk・lresume・pclosed・plimit（呼びから猶予の字を除く）、境界の server_acct（偽の器の合図の健康の行に reopens=- move=acct-2 grace_left=1200 を足し、撃ちの列と数から猶予の rules 行を除き、server_acct_grace_unreadable_no_left を器の字が unreadable なら無しの形に）・athr（撃ちの列から猶予の rules 行を除く）・bport（呼びから猶予の字を除く）。 置き場だけの = の歯（書かない・verify で撃つ）: 中核の acctcore（中核の src/account を歩く）、境界の brand・shb・stcli（境界の src を読む）と jcount・jrun（語の辞書を読む）、面の hspk・gwv・gfix（語の辞書を読む）と acctsess・hcproj（語 move_grace の鍵と account board の残り秒の字を見る）。 filter の語（main の契約表の verify の最後の字の 210 語・2 行目の sgrace_ を足して歯の名の見張りの WORDS と同じ 211 語）: aaround_・abst_・accept_・acchold_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・aface_・afocus_・alean_・aord_・aown_・apop_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadl_・cadopt_・cadq_・cdorm_・cfsplit_・cg9_・cgdom_・cmark_・cnote_・contract_form_・cround_・csled_・cspk_・ctick_・cupd_・cupdlist_・denv_・dnedge_・dngrp_・dnrow_・dnskip_・ecache_・epolq_・eretry_・esig_・evkind_・flight_・fmark_・fprem_・frame_・fserve_・fstop_・fxpre_・g3g7_・gapspage_・gatt_・gbnote_・gchip_・gcoach_・gfix_・gfresh_・ghb_・gins_・gjst_・glabel_・gnav_・gpface_・gpill_・gpulse_・graph_・gsum_・gtuck_・gview_・gwv_・hacols_・harest_・hasplit_・hbconf_・hbmark_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hdchip_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hshist_・hspage_・hspk_・hsym_・hthr_・http_・hwstore_・iclose_・ilink_・jcount_・jrun_・kcli_・kg9_・kindlab_・klink_・ksum_・launch_・lcard_・ledgerblock_・lgrp_・lhome_・lidle_・lkind_・lresume_・lsnap_・lspark_・lstg_・lstore_・mapview_・mkeys_・mlink_・mqask_・mqface_・mstore_・mtips_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntc_・ntime_・nxact_・nxorg_・parts_・pci_・pclosed_・pfold_・pgsw_・pgz_・pipe_・plimit_・pmisfit_・pmore_・pquest_・pqueue_・project_・ptitle_・pubscan_・punmap_・pwhole_・qblock_・qgate_・qkey_・qsig_・question_・rbusy_・relay_・rhold_・runsdoc_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server::events::・server_・sesplit_・shb_・skeleton_・sm