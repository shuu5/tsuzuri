goal = "在りかの main は 0b643453（計画 surface-plan は第 0.85 版）。この節の code の字はその値で、書く 2 つの file（面の src/project/seat.rs と src/project_dom/seat.rs）は、走行待ちの行 c-limit-resume（ノート surface-wave13h・書くのは契約と中核の seat.rs と面の seatpill.rs ほか）も、起草の間に着地した c-abs-time（ノート surface-wave21a・便 t3-hub.52.121）も書かない。試作は main 0b643453 に行 c-limit-resume の起草の差分を当てた木で撃った。 なぜ。見本（docs/design/mock3・判断の記録 ADR-7 で確定）の project board の席の block の下段（index.html の関数 lowHTML）は、登録の口座と project の群の chip（class pchip grp・data-card の鍵 pa:group）を出し、指を置くと群の card（window の __tz_card の枝 pa:group）を出す。card は題に語 project の群と群の名、種類に今の口座と、今の口座になった時刻の ◷ と時刻、値に群の orchestrator ごとの印（一致 ✓・移動待ち !・席なしは gi unknown の丸）と一致した席の数と群の席の数と字 席が一致、出所に groups/<群の名>.account ほか、more に群の orchestrator ごとの印と project の名と登録の口座（席が無ければ語 session なし・移動待ちなら語 移動待ちを足す）を持つ。着地済みの面（行 g-seat-split ほか）は群の chip に名だけを出し、card を持たない。要件 FR12 は席の健康と口座と群を出すことを決める。 値の出どころ（席の決め）。群の project ごとの登録の口座は、器（scribe2）の doctor の席の行（seat: role=… anchor=… target=… account=…）にしか無く、その行は project ごとの置き場（state dir）の doctor にだけ在る。器の doctor の群の行（器の crates/scribe2/src/account/mod.rs の fn render_group）は group= accounts= anchors= seat-accounts= current= next= refused= pressure= で、anchors= は群の anchor の数だけ、seat-accounts= は自分の置き場の席の口座の集まりだけを持つ。account board の読み（境界の src/acct.rs）は、宣言の anchor ごとに git config で state dir を引き、その dir で doctor と seat tick status を撃つので、中核の account の host（src/account/host.rs の私的な fn member・441 行）が群の project ごとに、その anchor の doctor の orchestrator の席の行の口座を登録の口座に置き、群の今の口座と同じなら Known(true)、違えば Known(false)、席の行か口座が無ければ Unknown を一致に置く。その群の枠は契約の account の pub struct GroupCard（127 行・pub な欄 row〔GroupRow〕・since・previous・recorded・members・refused）と pub struct GroupMember（142 行・pub な欄 project・seat_account・matches〔Reading の bool〕）で、AccountDoc の欄 groups（Reading の GroupCard の列）として口 /api/account に出る。席は 3 つの案から A を選んだ。A は project board の席の block が同じ server の口 /api/account を読み、群の名が合う GroupCard を群の chip の card に写す（書くのは面の 2 つの file だけ・account board の群の枠と同じ値）。B（口 /api/seat の境界が群の anchor ごとに state dir を引いて doctor を撃ち、SeatCard に群の project の欄を足す）は、/api/seat の集めの撃ちが群の anchor の数だけ増え、契約・中核・境界・面の 4 つの crate を書き、account board と同じ読みを 2 か所に持つので退けた。C（自分の置き場の doctor の席の行だけで組む）は、project ごとに置き場が別なので群のほかの project の席が常に分からないになり、見本の値が欠けるので退けた。 A の負荷（席の確かめ）。口 /api/account の集め（境界の src/acct.rs の fn gather）が器を撃つのは、doctor・seat tick status・rules get（seat.move_grace_s と窓の閾値の行）・git config（scribe2.statedir と tsuzuri.boardport）と fleet usage --show（境界の server/seat.rs の pub const USAGE_ARGS・記録を読むだけで口座の使用量の http を撃たない）だけで、A で project board を開いても使用量の問い合わせは増えない。増えるのは、口 /api/account の最初の要求で account の印の取り直しが 1 度だけ始まること（境界の server/routes/account.rs の fn account の call_once・32 行）と、集めた字の持ち回し（src/acct.rs の fn texts・持ち回しの間 HOLD は境界の server/seat.rs の pub const HOLD の 5 秒・印の file が変われば集め直す）の間の doctor の撃ちだけ。持ち回しは account board と共有する。 在りか・面（crates/tsuzuri-surface/src/project/seat.rs・write-set・733 行）。pub struct Low（374 行・pub な欄 account・group〔Reading の群の名〕・usage）と pub fn low（623 行・group は電文の SeatCard の欄 group の群の名）。pub const OK（231 行・glyph ✓ と class gi ok）と pub const NG（237 行・glyph ! と class gi ng）は pub struct Sign の値。pub fn hmd（196 行・時刻と今を受け、日本の日が同じなら日本時間の時と分と字 JST、違う日は月日を前に付けた字）。pub fn more（687 行）は「詳しく」の中身で、登録の口座と群の今の口座が同じかの印を今の字で持つ（この行は変えない）。wasm の target だけの pub fn view（726 行）は path の属性で src/project_dom/seat.rs を module dom として読む。 在りか・面の DOM（crates/tsuzuri-surface/src/project_dom/seat.rs・write-set・344 行）。pub fn view（36 行）は crate::net::read(PATH) で口 /api/seat を読み、私的な fn seat_view と fn low_view（255 行）で下段を組む。low_view は群の chip を字 <span class= の直後に二重引用符で囲んだ pchip grp と data-t の属性の span（273 行）に、群の名か測れていないの記号を置き、指の事件も data-card も tabindex も持たない。面の src/widgets/hover.rs の pub struct Card（94 行・pub な欄 title・kind・value・src・more〔字の列〕）と、wasm の target だけの pub fn delegate（341 行・show と leave を持つ Delegate・header の席の pill の src/seatpill.rs が同じ形で使う）。面の src/account/mod.rs の pub fn doc（287 行・Fetched を契約の wire で AccountDoc に読む・読めなければ理由の字）と pub use の PATH（契約の account の PATH・字 /api/account）。面の src/view.rs の口ごとの変化の種類の表は、口 /api