done = "(1) git apply --reverse --check docs/design/patch/cs-gone-once.patch が rc 0（差の file の hunk が全部木に在る・verify の 1 行目） (2) 中核の lines::notice は、話す窓の事象 Gone の本文を字「話す窓 cw3 が止まった（開き直しを待つ・持ち主が閉じると言えば /x/tzw consult close cw3 --by chat）」にし、頭の印と置き直しの命令の末を足した 1 行で出し、ほかの事象の字は替えない（歯 cwlin_notice_fixed_lines） (3) 閉じの行の無い問う窓 cw4（所見なし）と話す窓 cw5 の、最後の process の印が番号 1・pid 0（無い process）の時、tz consult watch は 1 度目に問う窓 cw4 の止まりの 1 行を出して起草の置き場の直下の file consult-watch.told-cw4 に字「k = 1・pid = 0」と改行を置き、2 度目に話す窓 cw5 の止まりの 1 行（本文は 2 番目の項の字の cw3 を cw5 に替えた字）を出して consult-watch.told-cw5 に同じ字を置き、3 度目（上限 1 秒）は上限の 1 行で終わる（歯 cwwat_stopped_window_told_once） (4) 同じ窓と見張りで、話す窓に番号 2 の process の印（pid 0）を足すと、見張りは話す窓 cw5 の止まりの 1 行をまた出して印の字を「k = 2・pid = 0」と改行に替え、問う窓の印を pid だけ違う字（pid = 7）に替えた時と、末の改行の欠けた字に替えた時は、見張りは問う窓 cw4 の止まりの 1 行をまた出す（歯 cwwat_stopped_window_told_once） (5) 同じ問う窓 cw4 と話す窓 cw5 で、話す窓の印が正しい字の普通の file、問う窓の印が正しい字の file への symlink の時、見張りは問う窓 cw4 の止まりの 1 行を出し、問う窓の印を symlink でない普通の file（正しい字）に置き直し、指す先の file の字を替えない（歯 cwwat_told_mark_not_followed） (6) 話す窓の印の path が dir の時、見張りは話す窓 cw5 の止まりの 1 行を出し、標準エラーに字「窓 cw5 の知らせ済みの印を書けない」を含む行を出し、次の見張りも同じ 1 行を出す（歯 cwwat_told_mark_not_followed） (7) 続けて台帳に話す窓 cw5 の閉じの行を足すと、印の path が dir のままでも、見張りは止まりの 1 行を出さずに上限の 1 行で終わる（歯 cwwat_told_mark_not_followed） (8) 着地済みの見張りの歯 cwwat_ の全部（頼み・止まり・閉じの順の歯 cwwat_request_stalled_gone_order は話す窓の字だけを新しい字に替える）と中核の歯 cwlin_ の全部が緑"
goal = "なぜ。境の consult/watch.rs の scan は、閉じの行の無い話す窓の最後の process が無いと事象 Gone を返し、見張りはその 1 行を出してすぐ終わる（問う窓の Stalled も同じ形）。判断の記録 ADR-55 の決定 (1) で、止まった話す窓は閉じずに同じ作業場で開き直すことになり、閉じると起動の口が「窓は閉じた」で断る（境の consult/launch.rs）。なので席は窓を閉じられず、見張りは置くたびに同じ窓の Gone ですぐ終わり、席の停止の hook（境の hook/stop.rs と中核の consult/pickup.rs の「見張りが居ない」）が turn ごとに席を止める。知らせの字も「閉じられた（close を撃て）」で、ADR-55 の後の扱いと合わない。 形。止まった窓（問う窓の Stalled・話す窓の Gone）は、同じ process について 1 度だけ出す。見張りは事象を出す時に、起草の置き場の直下の知らせ済みの印 consult-watch.told-cw<n>（窓ごとに 1 file・字は「k = <最後の process の印の番号>・pid = <その pid>」と改行）を置く。scan の止まりの照らし（私用の closure quiet）は、印の字が最後の process の印と同じ窓を飛ばす。新しい process が起きてまた止まれば、印の字と違うので、また 1 度出す。閉じの行を持つ窓は今のまま印を見ない。中核の lines.rs は Gone の doc と字を替える（字は「話す窓 cw<n> が止まった（開き直しを待つ・持ち主が閉じると言えば <tzw> consult close cw<n> --by chat）」）。字は差の file。 決め。印は窓の作業場の外（起草の置き場の直下・生きている印 consult-watch.alive と同じ dir）に置き、窓の殻が書けない。印の読みは symlink を辿らない（lstat で普通の file と見て開き、開いた後の fstat で dev と ino が同じかを照らし、頭の 256 byte だけを読む）。書きは在る印を消してから create_new で作る（symlink も辿らない）。普通の file でない印・読めない印・字の違う印は「知らせ済みでない」に倒し、書けない時は印を置かずに標準エラーへ 1 行を出す（どちらも知らせが多い側）。印は process の印の番号（k）も持つ（pid の使い回しでも新しい process を見落とさない）。印を置くのは、置く時に最後のprocess の印の process がまだ無い時だけ（scan と置く間に開き直した新しい process の印を知らせ済みにしない）。 ほかの行との当たり。write-set の 4 file のうち、consult/watch.rs と lines.rs は後の行 cs-follow（係 w185a の試作・未置き）の write-set と、cwwat.rs は置き済みの行 cs-acct-mark の write-set と交わる（器は交わる便を並べずに順に流す）。差の当たりは一時の index で見た（係 w192a の w/commute.out）。29b の係 w188a の 6 本（cs-plain-open から cs-status-verb）と係 w186a の 3 本（c-acct-consult・e-acct-cwread・e-acct-consult）の列では、この差をどの位置に差しても全部が当たり、最後の木は同じ。係 w185a の 3 本（cs-trust・cs-resume・cs-follow）の列では、この差は cs-trust と cs-resume とどちらの順でも当たるが、cs-follow とは中核の lines.rs の notice の Gone の腕の 1 か所（cs-follow の hunk の文脈）で当たらない。後に流す方は当て直した差（この行の cs-gone-once.after-follow.patch か、cs-follow の cs-follow.after-gone-once.patch）を使い、どちらの順でも最後の木は同じ（watch.rs の両行の hunk は重ならない）。cs-follow が先に置かれていないので depends は空にし、後で置く cs-follow の行が depends でこの行を名指す。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字