goal = "なぜ。窓は口座の設定を読まない形（--restricted）で起き、起動の口が渡す設定にも状態の 1 行の鍵が無いので、窓の下に何も出ない。裁定はどの案でも状態の 1 行を出す形で、話す窓と問う窓に共通の設定に statusLine を置く（問う窓は画面が無いので出ない）。公式の文書 statusline は、命令の標準入力に session の JSON を渡し、文脈の割合の鍵を context_window.used_percentage（早いうちは null）とし、出力の ANSI の色と OSC 8 の link を描くと書く。窓は作業場の file を書けるので、材料の字に端末を操る字を入れられる。だから字の欄は全部 clean を通す。 形。新しい中核の module consult::status（純な関数だけ）に VERB・SEP・DIGEST_HEAD（8）・FIELD_MAX（40）・command・clean・context_percent・render を置く。命令は作業場の絶対 path を引数に渡す（cwd に頼らない）。launch.rs の settings は鍵 statusLine に status_line(l) を置き、audit は設定の statusLine が同じ値でなければ欠けの名 /statusLine を足す。fixture は settings に statusLine の 1 行を足す。歯は段の file crates/tsuzuri-core/tests/cwsts.rs（判断の記録 ADR-32 の決定 (3)・群の main.rs と kfold.rs は書かない）。字は差の file。 確かめた事（V）。使い捨ての作業場で claude を --restricted と --settings の statusLine で起こし、窓の下に「窓 cw9 ｜ 題 probe ｜ haiku・low ｜ 所見 0 ｜ 束 01234567」が出た（文脈の割合は最初の答えの前で null のため出ない）。 ほかの行との当たり。行 cs-remote の差の後に当たる（main afe01c84（行 cs-plain-open と cs-acct-mark を置き、29a の cs-read-roots が着地した後）に、このノートの前の行の差を順に当てた木・係 w190a）。口 tz consult statusline は次の行 cs-status-verb が置く。間に起こした窓の状態の 1 行は、口が無いので空のまま（窓は止まらない）。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。(1) は verify の 1 行目、(2) から (7) は 3 行目（中核の歯の束 teeth3 の cwarg.rs と段の file cwsts.rs）、(8) は 3 行目と 4 行目で測る。clippy は守り。欄 done-teeth は書かない。 入口の赤。前の行の木（写し drafts/w190a の branch s2-hei の 7cbe7078）に段の file cwsts.rs だけを足した木で、verify の 3 行目の段の file の歯（--test cwsts）は rc 101（module consult::status が無く組めない）。 試作と噛み。写し drafts/w188a で verify の 2 行目から最後の行まで rc 0。句ごとに 9 の変異（命令の時間・命令に作業場を渡さない・C0 と C1 を落とさない・向きの上書きを落とさない・長さを切らない・範囲を見ない・題を clean しない・束の頭を切らない・設定の検めを外す）を当てて全部 rc 100、対照は rc 0。 範囲の外。口 tz consult statusline（行 cs-status-verb）・状態の 1 行に言付けの件数を出す事（行 cs-tell の予定）・refreshInterval。"

[[contract]]
id = "cs-status-verb"
title = "新しい口 tz consult statusline <作業場> が窓の控え・所見の数・束の要約値・標準入力の文脈の割合から状態の 1 行を出し、symlink を辿らず（どの段も lstat と、開いた後の fstat の照らし）、fifo を開かず、読む字に上限を置き、窓の作業場でない path を断る（判断の記録 ADR-57 決定 (1)(コ)・(4)・差の file）"
req = ["FR19"]
section = "9"
write-set = ["crates/tsuzuri-boundary/src/consult/mod.rs", "+crates/tsuzuri-boundary/src/consult/statusline.rs", "+crates/tsuzuri-boundary/tests/cwsln.rs", "=crates/tsuzuri-boundary/tests/teeth5/cwlch.rs"]
verify = ["git apply --reverse --check docs/design/patch/cs-status-verb.patch", "cargo clippy -p tsuzuri-boundary --all-targets --no-deps -- -D warnings", "cargo nextest run -p tsuzuri-boundary --test teeth5 --test cwsln --no-tests=fail cwsln_ cwlch_"]
size = "M"
done = "(1) git apply --reverse --check docs/design/patch/cs-status-verb.patch が rc 0（verify の 1 行目） (2) 作業場 consult-cw3（控えの題 t3-hub.78・model fable・念入りさ xhigh・findings/ に .json の file 2 つと .txt の file 1 つ・bundle/digest の字 3766ac7797cdf78f）で、標準入力の JSON（頂の鍵 context_window の object の鍵 used_percentage が数 42.4・鍵の字は二重引用符で囲む）の tz consult statusline <作業場> は rc 0 で 1 行「窓 cw3 ｜ 題 t3-hub.78 ｜ fable・xhigh ｜ 所見 2 ｜ 束 3766ac77 ｜ 文脈 42%」を出す（歯 cwsln_prints_the_line） (3) 控えの file・束の dir・束の file・所見の dir・所見の file の 1 つをそれぞれ外の物への symlink に替えると、その欄は外の字を出さない（控えは「窓 ?」・束は出ない・所見の dir は出ない・所見の file は 1 と数える）（歯 cwsln_does_not_follow_symlinks） (4) 束の file が fifo なら 2 秒の内に返し、束の欄を出さない（歯 cwsln_skips_fifo） (5) 控えの題に ESC・BEL・C1 の字を書いても、出す字に制御の字は無い（歯 cwsln_drops_control_chars） (6) cwd から在る作業場を指す相対の path・名が consult-cw<n> でない dir・作業場への symlink・引数の無い呼び・2 つの引数の呼びは、どれも標準出力が空で rc 1（歯 cwsln_refuses_non_workspace） (7) 境の歯 cwlch_ が緑"
depends = ["cs-status-text"]
goal = "なぜ。状態の 1 行の命令は設定の hook と同じく囲いの外で持ち主の権限で走り、窓が書ける作業場の file を読む。窓は作業場の中に symlink と fifo を作れるので、辿れば作業場の外の file の字を持ち主の画面に出し、fifo を開けば止まる。裁定は「制御の字を落とし symlink を辿らない」。 形。境の module consult::statusline に run・read_plain・count と FILE_MAX（16 KiB）・STDIN_MAX（256 KiB）・DIGEST（bundle/digest）を置く。照らしの助けは行 cs-plain-open の境の module consult::plain の plain_dir・plain_path・same_file を使う（この行は plain.rs を書かない・行 cs-acct-mark も同じ助けを使う）。run は渡した path が「/」で始まり、名が consult-cw<n> で、plain_dir（lstat で symlink でない dir）の時だけ読む。read_plain は plain_path で作業場から file までの途中の段を symlink でない dir と見て、file を lstat で普通の file と見て開き、開いた後の same_file（fstat で普通の file で dev と ino が同じか）で照らし、頭の FILE_MAX byte だけを読む。count は symlink でない dir の直下の、名が .json で終わる普通の file を数える（DirEntry の型は辿らない）。控えは wire::decode で読み、1 行は中核の status::render で組む。consult の mod.rs は module の行・USAGE の字・振り分けの 1 行・doc の 1 行を足す。歯は段の file crates/tsuzuri-boundary/tests/cwsln.rs（判断の記録 ADR-32 の決定 (3)・群の main.rs と kfold.rs は書かない）。字は差の file。 測らない事。lstat と開く間に fifo へ替える競り（開きが止まる）は、設定の命令の timeout 2 で終わる。fstat の照らしは歯で測っていない（競りを歯で作れない）。 ほかの行との当たり。行 cs-status-text の差の後に当たる（main afe01c84（行 cs-plain-open と cs-acct-mark を置き、29a の cs-read-roots が着地した後）に、このノートの前の行の差を順に当てた木・係 w190a）。境の consult/mod.rs は後の行 cs-tell（予定）も書く。 実装の約束。便は差の file を git apply で当てるだけで、差の外の字を 1 字も書かず、差の file も書き替えない。当たらない時は手で書かずに止まる。 done と verify の対応。(1) は verify の 1 行目、(2) から (7) は 3 行目（段の file cwsln.rs と境の歯の束 teeth5 の cwlch.rs）で測る。clippy は守り。欄 done-teeth は書かない。 入口の赤。前の行の木（写し drafts/w190a の branch s2-hei の c830ae8b）に段の file cwsln.rs だけを足した木で、verify の 3 行目の段の file の歯（--test cwsln）は rc 100（cwsln_ の 4 本が落ち、cwsln_refuses_non_workspace は口が無い断りで通る）。 試作と噛み。写し drafts/w188a で verify の 2 行目から最後の行まで rc 0。句ごとに 5 つの変異（作業場の名を見ない・絶対 path を見ない・dir の symlink を辿る〔共有の plain_dir〕・file の symlink を辿る・所見の symlink を数える）を当てて全部 rc 100、対照は rc 0。 範囲の外。言付けの件数の欄（行 cs-tell の予定）・refreshInterval・作業場の外の file。"
