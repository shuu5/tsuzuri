section = "4"
write-set = ["crates/tsuzuri-boundary/src/server/form.rs", "crates/tsuzuri-boundary/src/server/ledger.rs", "crates/tsuzuri-boundary/src/server/mod.rs", "crates/tsuzuri-boundary/src/server/board.rs", "crates/tsuzuri-boundary/src/server/routes/pipeline.rs", "crates/tsuzuri-boundary/tests/pmisroute.rs", "=crates/tsuzuri-core/tests/pmisfit.rs", "=crates/tsuzuri-boundary/tests/server_seat.rs", "=crates/tsuzuri-boundary/tests/lidle.rs", "=crates/tsuzuri-boundary/tests/lsnap.rs", "=crates/tsuzuri-boundary/tests/server_read.rs", "=crates/tsuzuri-boundary/tests/server_coalesce.rs", "=crates/tsuzuri-boundary/tests/rhold.rs", "=crates/tsuzuri-boundary/tests/hbconf.rs", "=crates/tsuzuri-boundary/tests/iclose.rs", "=crates/tsuzuri-boundary/tests/ecache.rs", "=crates/tsuzuri-boundary/tests/hbpost.rs", "=crates/tsuzuri-boundary/tests/hbroute.rs", "=crates/tsuzuri-boundary/tests/hbproc.rs"]
