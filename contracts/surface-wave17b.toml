size = "S"
done = "(1) 境界の server の form の module（src/server/form.rs）に pub struct Kept（pub な欄 ledger と form・どちらも String）と pub fn misfits（Kept の Option と今を受け、形の崩れの一覧の Reading を返す）が在り、Form の pub fn kick は台帳の字の Option を受け、pub fn kept は Kept の Option を返す。form_lines は節の境界の組の doctor の字に 2 行目（台帳の形の行）を、席の行だけの字に空の字を返し、FORM_ARGS は字 doctor の 1 つ、REPO_ARGS は字 --repo と字 . の 2 つ、FORM_TIMEOUT は 30 秒で、上限 1 秒の Form の argv は字 doctor・--state-dir・state dir・--repo・. の列。arm の前に節の台帳の字で撃った kick は偽の器を撃たず kept は None で、misfits に None と今 0 を渡すと Unknown。arm の後の kick は偽の器を doctor と --state-dir と state dir と --repo と . の 1 行で 1 度撃ち、kept は節の台帳の字と節の台帳の形の行の組で、misfits にその組と今 0 を渡すと Known の b.1（題 t b.1・Neither）と b.2（題 t b.2・Both）の 2 本で、Hub の受け手に event の名 board-changed の知らせを 1 件送る（200 ミリ秒の間に 2 件目は来ない）。同じ組の 2 度目の kick は知らせない。節の台帳に b.4（題 t b.4・設計の参照を持つ task）を足した字の kick は、組の台帳の字がその字になり、一覧は同じ 2 本で、知らせない。その字の b.1 の題を t b.1 new に替えた字の kick は知らせる。台帳の字が None の kick は器を撃たず（300 ミリ秒の後も撃ちの数は同じ）、kept が None になり知らせる。節の台帳の字に戻すと組に戻って知らせ、out-doctor を消した周は None で知らせ、席の行だけを出す周は器を撃っても kept が None のままで知らせず、節の doctor の字を置き直すと組に戻って知らせ、器が 3 秒待つ周は kick から 2.5 秒より前に kept が None になる（歯 pmisfit_form_kick_rules） (2) 器が 0.4 秒待つとき、上限 FORM_TIMEOUT の Form の arm の後に台帳の字 a・b・c で続けて撃った 3 回の kick は 200 ミリ秒より前に戻り、器は 2 回だけ撃たれ（1 秒待っても増えない）、kept は台帳の字 c と節の台帳の形の行の組（歯 pmisfit_form_one_at_a_time） (3) event log に走行を持たない 1 行（kind SeatSpawned）を置いた、席の target と state dir の在る server は、起こした直後の偽の bd の回が 1 で、口 /api/pipeline の要求の前は台帳の印が動いても器を撃たず、最初の要求の一覧は Unknown で器を撃たず、その後に印が動くと器を doctor と --state-dir と state dir と --repo と . の 1 行で撃つ。口の一覧は b.1 と b.2 の 2 本、札の列は b.3 の Queued の 1 枚で、板の全体は中核の board_with_doctor に節の台帳の字と同じ event log の字と偽の器の doctor の字と今 0 を渡した値と同じで、続けて 3 回の口の要求で偽の器の argv の記録は増えない。器が 2 秒待つようにし、偽の bd の出す字を節の台帳に b.4 を足して b.1 の題を t b.1 new に替えた字にして印が動くと、器を撃っている間の口は、台帳の口 /api/ledger の本文が字 t b.1 new を持つ時に、札の列が b.3 と b.4 の Queued の 2 枚（中核の board にその字と同じ event log の字と今 0 を渡した札の列と同じ）で、一覧は前の組の 2 本（b.1 の題 t b.1）のまま。撃ちを終えた後の口の板の全体は、board_with_doctor にその字と同じ event log の字と doctor の字と今 0 を渡した値と同じ（一覧の b.1 の題は t b.1 new）。out-doctor を消して印が動いた周の一覧は Unknown、置き直して印が動いた周はその一覧に戻る（歯 pmisfit_route_reads_kept_form） (4) 席の target と state dir の在る server に、口 /api/pipeline を撃たず印も動かさずに知らせの接続（GET /api/surface/events）を張ると、接続は頭の retry の行を受けた後に、偽の器を doctor と --state-dir と state dir と --repo と . の 1 行で 1 度撃たれ、偽の bd の回は 2 以上になり、接続に board-changed の知らせが届き、口の一覧は b.1 と b.2 の 2 本（歯 pmisfit_sse_arms_and_tells） (5) 着地済みの pmisfit_route_without_seat_or_line（席の target か state dir の無い server は撃たず、台帳の形の行の無い doctor の字の一覧は Unknown）は直さずに通る。中核の tests/pmisfit.rs の pmisfit_ の 6 本も直さずに通り、pmisfit_own_names_clean は tests/pmisroute.rs の test の属性の付いた fn の名（この行の後は 5 つ）がどれも pmisfit_ で始まり、名から pmisfit_ を除いた字がその file の filter の語のどれも部分の字として含まないことを見る（歯 pmisfit_route_without_seat_or_line・pmisfit_own_names_clean） (6) ほかの着地済みの歯は直さずに全部通る。境界の歯 server_seat_ の 10 本と hbmark_ の 3 本（席の target と state dir の在る server に知らせの接続を張り、板の印の file が動かない 1.5 秒の間は board-changed が届かないことを見る server_seat_state_files_send_board_changed と hbmark_off_file_sends_board_changed を含む）と、lidle_・lsnap_・server_read_・server_coalesce_・rhold_・hbconf_・iclose_・ecache_・hbpost_・hbroute_・hbproc_ の全部と、lib の server_read_doc_copies_verdicts・server_read_empty_texts_are_unread・server_min_epoch_secs_reads_rfc3339・server_min_parse_refuses_broken_lines・server_src_marks_are_two_files・server_src_unstartable_bd_is_unknown を含み、どれも verify で撃つ。境界の crate の足す外の依存は 0 本（歯 server_seat_state_files_send_board_changed・hbmark_off_file_sends_board_changed・server_seat_no_new_dependencies）"
goal = "在りかの main は b5fa1f6（計画 surface-plan 第 0.52 版・この行の書く file と置き場だけの = の file は f71082f と同じ・同じ file を最後に書いた行 c-pipe-misfit〔ノート surface-wave12g・便 t3-hub.52.88〕と、知らせの受け手の決まりの行 e-idle〔ノート surface-wave12f〕は着地済み）。この節の行の番号と行の数はその字で、試作は f71082f の写しで撃った。起草者 w12g2 の試作 proto13（c-pipe-misfit の前の main に当てた形）を材料にし、着地した c-pipe-misfit の今の字に合わせ直した。 なぜ。行 c-pipe-misfit は、境界の server が台帳の見張りの読みの後に器の doctor を撃ってその台帳の形の行だけを持ち、口 /api/pipeline はその時の台帳の字（集めた今の字）と持った行を中核に渡して一覧を組む。doctor の撃ちは測って 0.85〜15.76 秒かかり（c-pipe-misfit の起草の測り）、その間と次に撃ち終えるまでの口は、新しい台帳の字と前の周の形の行を混ぜる（題と閉じの判定は新しい台帳から、崩れの判定は前の台帳から）。計画の 9 節のこの行の字 (1) は、台帳の字と台帳の形の行を同じ周の組として持ち、一覧をその組の台帳から作る、と決める。また c-pipe-misfit は撃ちの許しを口 /api/pipeline の最初の要求だけに置いた。行 e-idle の後は、受け手が 0 人の間の見張りは印が動いたときだけ読み、受け手が 0 人から 1 人以上になった周で 1 回読む。面が知らせの接続を張った直後の読みは許しの前に来ることがあり、そのときは次に印が動くか読み直しの間隔（store の印で 60 秒）まで一覧が Unknown のまま残る。計画の字 (2) は、撃つ許しを知らせの接続の受け手が付いた周にも置き、受け手が付いた直後の読みですぐ撃つ、と決める（席の決め 2026-09-28・第 12 波 g の起草の後の試作）。 在りか・境界の code（write-set）。src/server/form.rs（193 行）は、頭の doc（1〜7 行）・pub const FORM_ARGS（23 行）・REPO_ARGS（27 行）・FORM_TIMEOUT（31 行・30 秒）・pub fn form_lines（34 行・頭が中核の FORM_PREFIX の行を改行でつなぐ・無ければ空の字）・私的な struct Run（43 行・欄 running と again の bool）・struct Inner（48 行・欄 program・state_dir・cwd・timeout・armed〔AtomicBool〕・run・text〔Option<String> の Mutex〕・hub〔Weak<Hub> の OnceLock〕）・pub struct Form（64 行・Inner の Arc・clone は撃ちと字を分け合う）と pub fn new（81 行）・with_timeout（90 行）・argv（111 行）・arm（116 行）・armed（121 行）・notify（126 行）・text（131 行）・kick（136 行・許しの前は何もせず、走っていれば again を真にして戻り、ほかは thread を 1 本起こして shoot を again が偽になるまで回す）と、Inner の私的な fn shoot（174 行・capture の出力を UTF-8 で読んで form_lines にし、落ちれば None・持つ字と違えば置いて Hub に board_changed を送る）を持つ。src/server/ledger.rs（471 行）は頭の doc の 12 行で with_form の Source の read が撃ちを起こすと書き、Source の欄 form（96 行）・pub fn with_form（131 行）・form（136 行）を持ち、pub fn read（208〜216 行）は fresh の字を parse_bd で読んだ後に form.kick() を撃つ。src/server/board.rs（279 行）の頭の doc の 2 行は口 /api/pipeline を名乗り、pub fn pipeline（88〜91 行）は中核の board_with_doctor に集めた台帳の字と event log の字と doctor の字の Option と今を渡す。src/server/routes/pipeline.rs（33 行）の fn pipeline（19〜33 行）は gather_held の後に form.arm() と form.text() を撃ち、その字を board::pipeline に渡す。src/server/mod.rs（337 行）は頭の doc の 18 行で form を名乗り、pub fn bind_with（166 行）の 186〜188 行で席の target と state dir の両方が在るときだけ Form を作って 191〜193 行で watched の Source に渡し、223〜225 行で Hub::start の後に notify を撃つ。fn handle（272 行）の 280〜283 行の腕は GET /api/surface/events を events::stream に渡して戻る。src/server/events.rs（書かない）の fn watch（271 行）は周ごとに受け手の数を見て、287 行で 0 人から 1 人以上になった周を attached にしてその周に読み、fn stream（308 行）は 309 行で受け手を足してから頭を書く。 在りか・中核（書かない）。crates/tsuzuri-core/src/pipeline.rs の pub fn board（234 行・形の崩れの一覧は Unknown）と pub fn board_with_doctor（240 行・読んだ台帳で札と一覧を組む）は、札を event log の字で組み（read_events は空の字に None を返し、札は Unknown）、一覧は台帳と doctor の字だけから組む（私的な fn misfits_of・206 行）。着地済みの中核の歯 pmisfit_unknown_sources は、event log の字が空のときも board_with_doctor の一覧が同じ 4 本であることを見る。 在りか・歯（write-set）。境界の歯 tests/pmisroute.rs（426 行）は、節の台帳 LEDGER（b.1 は印無し・b.2 は控えの印と設計の参照・b.3 は設計の参照）・席の行 SEAT_LINE・台帳の形の行 FORM_LINE（both=1:b.2 neither=1:b.1）と、作業場 Place（偽の bd は撃たれるたびに記録の file bd に 1 行を足して作業場の ledger.json を出し、偽の器は argv を記録して argv の頭が doctor なら sleep の字の秒だけ待って out-doctor を出す）を持ち、歯は pmisfit_form_kick_rules（260 行・kick と text）・pmisfit_form_one_at_a_time（335 行）・pmisfit_route_reads_kept_form（358 行・event log は空の字で札は Unknown）・pmisfit_route_without_seat_or_line（407 行）の 4 本。中核の tests/pmisfit.rs の pmisfit_own_names_clean は、この file と中核の file の test の属性の付いた fn の名を読む（境界の名は 4 以上）。 形。(a) form.rs に pub struct Kept（derive は Debug・Clone・PartialEq・Eq・pub な欄 ledger〔撃った周の見張りの読みの台帳の字〕と form〔その周の doctor の出力の form_lines・空でない〕）と、pub fn misfits（kept: Option<&Kept>・now: EpochSecs・返りは Reading<Vec<MisfitBead>>）を足す。misfits は None に Unknown を、組に中核の board_with_doctor へ組の台帳の字と空の event log の字と組の form を渡した板の欄 misfits を返す（一覧は event log の字を読まない）。(b) Inner の欄 text を kept（Option<Kept> の Mutex）に、Form の pub fn text を pub fn kept（Option<Kept> の複製）に替える。Run の欄 again を Option<Option<String>>（走っている間の最後の周の台帳の字・読めなかった周は内の None）にする。(c) pub fn kick は台帳の字の Option を受け、許しの前は何もせず、走っていれば again にその字を置いて戻り（前に置いた字は捨てる）、ほかは thread を 1 本起こしてその字で shoot を撃ち、again が在ればその字で撃ち直し、無ければ running を偽にして終わる。(d) shoot は台帳の字を受け、None なら器を撃たずに組を None にし、在れば capture を撃って出力の form_lines が空でないときだけ組にする（器が落ちた・上限を越えた・UTF-8 でない・台帳の形の行が無い周は None・前の組を持ち回さない）。組を置く前に、前の組と新しい組をそれぞれ misfits に通した一覧（今は events::now）を比べ、違えば Hub に board_changed を送る。(e) ledger.rs の Source::read は fresh の字を先に取り、form が在ればその字の複製で kick を撃ち、その後に parse_bd で読む（読めない字は Unknown で前と同じ）。(f) board.rs の pub fn pipeline は doctor の字の代わりに kept: Option<&Kept> を受け、札は中核の board に集めた今の台帳の字と event log の字で組み、欄 misfits を form::misfits(kept, now) にする。(g) routes/pipeline.rs は form.arm() の後に form.kept() を読み、組を board::pipeline に渡す（口は器を撃たない）。(h) mod.rs の fn handle の知らせの接続の腕は、events::stream の前に Sources の ledger の form が在れば form.arm() を撃つ（受け手を足す前に許すので、受け手の付いた周の読みが撃つ）。form.rs・ledger.rs・board.rs・routes/pipeline.rs・mod.rs の頭の doc は組と知らせの接続の許しを書く（doc の字は歯で測らない）。(i) 歯 tests/pmisroute.rs は、歯 3 本を組の形に直し（kick に台帳の字を渡し、kept と misfits を見る）、知らせの接続の歯 pmisfit_sse_arms_and_tells を足し、見本の手に const EVENT（走行を持たない event log の 1 行）・fn grown（節の台帳に b.4 を足した字）・fn renamed（grown の b.1 の題を t b.1 new に替えた字）・fn stages（札の列の id と段）・fn pair（節の組）を足す。pmisfit_route_without_seat_or_line は直さない。file は rustfmt の既定の形にする（main の字の 4 か所の形も整う）。 決めた幅（起草の決めと席の決め）。(j) 板の変化の知らせは、組でなく組から写した一覧が変わった周だけ送る。台帳の字だけが変わって一覧が同じ周は、見張りの ledger-changed で面がもう読み直しているので送らない（組で比べると台帳の変化のたびに面の全部の口の読み直しが 1 回増える）。(k) 台帳の形の行の無い周は組を持たず None にする（空の form の組は一覧が Unknown で None と同じ）。(l) 台帳の読みが落ちた周は器を撃たず組を None にする（組の片方が無い・器の中の台帳の読み 1 回を足さない）。(m) 走っている間の周が重なれば最後の周の台帳の字だけで撃ち直す（c-pipe-misfit の again の 1 回の決まりのまま・字は最後の周）。(n) 許しは口 /api/pipeline の最初の要求にも残す（計画の字）。起動で許す形は採らない（板を見ない server は撃たない・器の中の台帳の読みを足さない）。計画の 9 節のこの行の note の、許しを知らせの接続だけに置くと着地済みの歯 server_seat・server_ask・server_batch・epolq の 15 本が落ちる、は e-idle の前の main の測り。今の main（code は f71082f）で許しを起動で置く噛みを撃つと、その 4 つの file の歯はどれも落ちず、pmisfit_route_reads_kept_form だけが落ちた（e-idle の後は受け手 0 人の server 