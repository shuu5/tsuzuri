section = "3"
write-set = ["crates/tsuzuri-core/tests/runsdoc.rs"]
verify = ["cargo nextest run -p tsuzuri-core --test runsdoc --no-tests=fail runsdoc_", "cargo run -q -p xtask -- check"]
size = "S"
done = "(1) 中核の歯の file tests/runsdoc.rs の行のうち、前の空白を除いて属性 allow か expect（外の属性と内の属性の 2 つの形）で始まる行は 0 で、行頭の fn の宣言（改行の直後の字 fn と空白）はどれも、引数の括弧の中の括弧の深さ 1 のコロンと空白の数（引数の数）が 5 以下で、その宣言は 10 以上在る（歯 runsdoc_no_lint_allow） (2) runsdoc_hub2_three_runs は、実物の event log の写し（tests/fixtures/graph/real/events.jsonl・この行は書かない）の歯の名の bead の 3 つの走行の費用を、欄 events・turns・wall_ms・tokens_in・tokens_out・cache_read・cache_create の順に 1 つ目 1・1・17235・2・1541・10896・8407、2 つ目 2・33・155603・32・15638・503756・43725、3 つ目 3・40・212986・38・23140・706443・69522 の期待と比べて通る。期待の値は main と同じで、書き方を欄の名を付けた RunCost の struct の式にして fn cost を消すことは、この行の差分で持つ（歯 runsdoc_hub2_three_runs） (3) ほかの着地済みの 6 本は直さずに通る。runsdoc_own_names_clean は、この file の test の属性の付いた fn の名（見張りの歯を足して 8 つ）がどれも runsdoc_ で始まり、名から runsdoc_ を除いた字が file の const FILTERS の 65 語のどれも部分の字として含まず、名の数が 7 以上であることを見る（歯 runsdoc_hub5_second_run_inconclusive・runsdoc_absent_bead_is_known_empty・runsdoc_unread_log_is_unknown・runsdoc_early_events_dropped・runsdoc_wire_keys・runsdoc_own_names_clean）"
goal = "在りかの main は b5fa1f6（計画 surface-plan 第 0.52 版）で、この行の書く file は f71082f と同じ（間の commit は設計の字と、行 t-cform-json の契約の歯と snapshot と中核の歯 nsum・qblock と面の歯 gpface だけを書いた）。この節の行の番号と行の数はその字で、試作は f71082f の写しで撃った。この行が書く file は中核の歯の file tests/runsdoc.rs の 1 つだけ。 なぜ。憲法の条 P-22.2（must-not）は、粒度の lint を allow の属性で黙らせない、と決める。規則の行 R-4（条 P-22・kind deny・status 仮）は関数の引数を 5 以下とする。中核の歯 tests/runsdoc.rs の 119 行は属性 #[allow(clippy::too_many_arguments)] で、repo の crates と xtask の下の .rs の中で clippy の lint を allow で黙らせる唯一の行（grep で確かめた）。席は 2026-09-28 の第 14 波 c の起草の直しでこの既存の違反を見つけ、計画だけの行に置いた（席の決め）。clippy の lint too_many_arguments の既定の上限は 7 で、引数 7 つの fn は属性が無くても cargo clippy の -D warnings を通る（試作で属性の行だけを消して確かめた）。そのため属性を外すだけでは規則の行 R-4 の 5 以下にならず、引数を 1 つの struct に束ねる。束ねる struct は契約の型 RunCost そのもので、見本の fn は要らなくなる。 在りか・歯（write-set）。tests/runsdoc.rs（372 行・中核の crate・行 e-runs〔ノート surface-wave3b〕が置いた file）は、頭の doc（1〜2 行）・use（4〜12 行・契約の runs から PATH・RunCost・RunLine・RunStep・RunsDoc）・const FILTERS（15〜81 行・65 語）・見本の手 fn manifest（83 行）・read（87 行）・real_log（91 行）・bead（95 行）・known（100 行）・stages（107 行）・verdicts（112 行）を持ち、119 行の属性の後の fn cost（120〜138 行）は引数 7 つ（events の u32 と、turns・wall_ms・tokens_in・tokens_out・cache_read・cache_create の u64）を受けて同じ名の欄の RunCost を返すだけ。fn cost を呼ぶのは runsdoc_hub2_three_runs（141 行）の 177 行・197 行・227 行の 3 か所だけで、どれも assert_eq の右辺。ほかの歯は runsdoc_hub5_second_run_inconclusive（231 行）・runsdoc_absent_bead_is_known_empty（245 行）・runsdoc_unread_log_is_unknown（252 行）・runsdoc_early_events_dropped（266 行・RunCost::default と比べる）・runsdoc_wire_keys（302 行・手 keys 289 行と set 297 行）・runsdoc_own_names_clean（347 行・自分の file の字を読み、test の属性の次の行の fn の名を集める）。契約の crate の src/runs.rs の pub struct RunCost（46〜54 行）は derive に Default を持ち、pub な欄 events（u32）と turns・wall_ms・tokens_in・tokens_out・cache_read・cache_create（u64）をこの順に持つ。 形。(a) 119 行の属性と fn cost（120〜138 行）を消す。(b) 3 か所の cost の呼び出しを、欄の名を付けた RunCost の struct の式に替える（欄の順は struct の順・値は元の引数の順のまま・rustfmt の既定の形で 1 か所 11 行）。(c) 見張りの歯 runsdoc_no_lint_allow を runsdoc_own_names_clean の前に足す。本体は、read(&manifest(tests/runsdoc.rs)) の字の行ごとに前の空白を除いた字が #[allow( と #![allow( と #[expect( と #![expect( のどれでも始まらないことを見て、字の中の改行と fn と空白の並びごとに、その後の最初の開き括弧から対の閉じ括弧までを括弧の深さで辿り、深さ 1 でコロンと空白が続く所を引数に数えて 5 以下を見て、宣言の数が 10 以上であることを見る。見張りの 4 つの字は引用符の中に在り、行の頭に来ないので、歯の file 自身の字には当たらない。file の頭の doc は書き替えない。 決めた幅（起草の決め）。(d) 計画の字の、引数を 1 つの struct に束ねる、は契約の型 RunCost の式にすることと読んだ（引数 7 つの fn を残して struct を受けさせると、同じ struct を返すだけの fn になる）。見本の fn を残して欄を束ねる別の struct を置く案は採らない（歯だけが使う型が増え、期待の値が欄の名から離れる）。(e) 属性が無いことと引数の数は、この file の見張りの歯で測る（clippy の既定の上限は 7 で引数 7 つを通すので、属性を外すだけでは歯も clippy も落ちない）。測るのはこの file の字だけにする（repo 全体の lint の上限を clippy の設定の file で 5 に下げることは範囲の外・後で席が決める）。(f) 歯の期待の値と着地済みの歯の名は変えない（計画の字）。見張りの歯の名は file の決まり（runsdoc_own_names_clean）で接頭辞 runsdoc_ を持ち、着地済みの行 e-runs の verify の filter runsdoc_ に当たる。 測り方・歯。verify は --test runsdoc の filter runsdoc_ の 1 行と xtask の check。試作（main f71082f の写し）で runsdoc_ の 8 本が通り、xtask の check（workspace の build・歯の全部・host と面の wasm の clippy の -D warnings・面の組み立て）は rc 0。噛み: file を main の字に戻して見張りの歯だけを足すと runsdoc_no_lint_allow が落ち、属性の行だけを消して引数 7 つの fn cost を残すと同じ歯が落ち、期待の wall_ms の 17235 を 17236 に替えると runsdoc_hub2_three_runs が落ちる。 filter の語（main b5fa1f6 の contracts の verify の filter の語 238 を、ほかの語を部分の字として含まない 164 語に畳み、接頭辞 runsdoc_ を除いた 163 語）は aaround_・accept_・acchold_・account_・acctcore_・acctdoc_・accthb_・accthome_・acctled_・acctlook_・acctpcore_・acctproj_・acctsess_・acctwin_・acctwire_・afocus_・aord_・apop_・askcard_・athr_・batchpanel_・bhalf_・board_min_・bport_・brand_・btuck_・cadl_・cadopt_・cadq_・cdorm_・cfsplit_・cgdom_・cmark_・contract_form_・cround_・csled_・cspk_・ctick_・denv_・dnedge_・dnrow_・dnskip_・ecache_・epolq_・flight_・fmark_・fprem_・frame_・fserve_・fstop_・fxpre_・g3g7_・gapspage_・gbnote_・gfix_・gfresh_・ghb_・gjst_・glabel_・gnav_・gpface_・gpill_・gpulse_・graph_・gsum_・gtuck_・gview_・hacols_・harest_・hasplit_・hbconf_・hbmark_・hbpost_・hbproc_・hbroute_・hcard_・hcled_・hcnx_・hcproj_・hcsess_・hdchip_・hfig_・hnunk_・hook_・hruling_・hsblock_・hsderive_・hshist_・hspage_・hspk_・hsym_・iclose_・ilink_・kcli_・kindlab_・klink_・launch_・lcard_・ledgerblock_・lhome_・lidle_・lresume_・lsnap_・lspark_・lstore_・mapview_・mkeys_・mlink_・mstore_・mtree_・nact_・nbatch_・ncard_・nextstep_・nodepage_・nstall_・nsum_・nsumw_・ntime_・nxact_・nxorg_・parts_・pci_・pclosed_・pfold_・pipe_・plimit_・pmisfit_・pmore_・pquest_・pqueue_・project_・ptitle_・punmap_・pwhole_・qblock_・qgate_・qkey_・question_・relay_・rhold_・rvk_・saxis_・sclosed_・seatblock_・seatcard_・server_・sesplit_・shb_・skeleton_・smore_・stage_・stats_・stcli_・steady_・sxaxis_・ticker_・tipx_・topbar_・tz_・urpanel_・uword_・wstrip_ で、見張りの歯の名 runsdoc_no_lint_allow から runsdoc_ を除いた字はどの語も部分の字として含まない。 依存と順。depends は空。書く file は中核の歯の file 1 つで、ほかのノートの行と計画だけの行の write-set（置き場だけの = を含む）に tests/runsdoc.rs は無いので、ほかの行と並べて流せる。同じノートの c-misfit-pair とも書く file が重ならない。 範囲の外。境界の crate の tests/runsdoc.rs（属性 allow を持たない）・契約の型 RunCost・fixture の events.jsonl・clippy の設定の file（clippy.toml は repo に無い）・ほかの file の lint。"

[[contract]]
id = "c-misfit-pair"
title = "pipeline の板の要修正の一覧を、境界の server が台帳の見張りの読みの周に持つ台帳の字と器の doctor の台帳の形の行の組から写し、撃ちの許しを知らせの接続にも置いて受け手の付いた周の読みで撃つ"
