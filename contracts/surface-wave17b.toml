[[contract]]
id = "t-allow-runsdoc"
title = "中核の歯 tests/runsdoc.rs の粒度の lint を黙らせる属性 allow を外し、7 つの引数の見本の fn cost を消して費用の期待を欄の名を付けた RunCost の struct の式に束ね、属性と引数の数を見張りの歯で測る"
