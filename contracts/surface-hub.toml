[[contract]]
id = "hb-proc"
title = "子 process の撃ち方を server の proc.rs に、時刻の読みを clock.rs に割る（ledger.rs は同じ名で再公開）"
req = ["NFR3"]
section = "3"
write-set = ["crates/tsuzuri-boundary/src/server/mod.rs", "-crates/tsuzuri-boundary/src/server/ledger.rs", "+crates/tsuzuri-boundary/src/server/proc.rs", "+crates/tsuzuri-boundary/src/server/clock.rs", "+crates/tsuzuri-boundary/tests/hbproc.rs"]
verify = ["cargo nextest run -p tsuzuri-boundary --test hbproc --no-tests=fail hbproc_", "cargo run -q -p xtask -- check"]
size = "S"
done = "(1) server の proc.rs に pub fn capture（引数と返りは着地済みと同じ）と pub fn stop_with と pub const KILL（字 kill）が在り、clock.rs に pub fn epoch_secs が在り、ledger.rs の字に fn capture・fn stop_with・fn stop・fn epoch_secs・fn is_leap・fn days_in_month・fn days_from_civil・const KILL・const WAIT_STEP の定義が無い（歯 hbproc_ が src の字を読んで見る） (2) ledger の module から capture・stop_with・KILL・epoch_secs が今までの名のまま呼べ、proc と clock を直に呼んだ値と同じ値を返す（歯が両方の path で呼んで比べる） (3) epoch_secs は 1970-01-01T00:00:00Z で 0、2026-09-27T07:39:00Z と 2026-09-27T16:39:00.123456789+09:00 で 1790494740、節の 9 つの壊れた字で無しを返し、capture は rc 0 の子の標準出力を返し rc 1 の子で無しを返す（歯 hbproc_） (4) 着地済みの歯は全部直さずに通り（xtask の check）、足す外の依存は 0 本"
goal = "なぜ。境界の crate の server の ledger.rs（381 行）は、台帳の読みのほかに、子 process を撃つ共通の部品（capture・stop・stop_with・KILL・WAIT_STEP）と時刻の読み（epoch_secs と暦の 3 つの関数）を持ち、src の 7 つの module が capture を ledger から呼ぶ。台帳の読みを直す行と子 process の撃ち方を直す行が同じ file を書かないように割る。 在りか（着地済み・HEAD b02c2ae で確かめた）。crates/tsuzuri-boundary/src/server/ledger.rs の pub fn capture（型引数 I と S・引数は program の &OsStr・args の I・cwd の &Path・timeout の Duration・返りは Option の Vec の u8・I は IntoIterator で Item が S・S は AsRef の OsStr）・非公開の fn stop（Child を受ける）・pub fn stop_with（Child と kill の &OsStr を受けて bool を返す）・pub const KILL（&str の字 kill）・非公開の const WAIT_STEP（5 ミリ秒）・pub fn epoch_secs（&str を受けて Option の EpochSecs を返す・EpochSecs は契約の型の crate の根の型）・非公開の fn is_leap・days_in_month・days_from_civil。どれも wasm の target に限らない（境界の crate は host だけ）。 呼び手（確かめた・この行の write-set の外で直さない）。capture を ledger から use する src は accthb.rs・acct.rs・server の batch.rs・policy.rs・seat.rs・ruling.rs・design.rs。歯は tests/server_reap.rs（capture・stop_with・KILL を ledger の path で use）と tests/server_batch.rs と tests/server_ask.rs（epoch_secs を ledger の path で use）。ledger.rs の中の歯 server_min_epoch_secs_reads_rfc3339 は ledger の tests の module から super の epoch_secs を呼ぶ。中核の crate の ledger の module にも同じ名の epoch_secs が在るが別物で、この行は触らない。 形。server の proc.rs へ capture・stop・stop_with・KILL・WAIT_STEP を字を変えずに移し、clock.rs へ epoch_secs・is_leap・days_in_month・days_from_civil を字を変えずに移す。server の mod.rs の pub mod の並びに pub mod clock と pub mod proc を足す。ledger.rs は pub use で super の proc の capture・stop_with・KILL と super の clock の epoch_secs を同じ名で再公開し、自分の items の中の epoch_secs の呼びはその名のまま使う。ledger.rs で使わなくなった use（Read・CommandExt・Child・Command・Stdio・mpsc・thread・Instant・EpochSecs など）は外す（clippy の警告で落ちるため）。ledger.rs の #[cfg(test)] の歯は動かさず、字も変えない。ledger.rs は縮むだけ（write-set の印 -）。 測り方。新しい歯は tests/hbproc.rs に置き、名を hbproc_ で始める（着地済みの行の filter の語 server_・server_reap_・server_min_ ほかを名に含めない）。歯は tsuzuri_boundary::server::proc と clock と ledger の 3 つの path で呼ぶ。capture の歯は program に sh を、args に -c と printf の字の 2 つを渡し（rc 0 は出した byte・exit 1 は無し）、cwd は一時の dir、timeout は 5 秒。epoch_secs の歯の値は done (3) のとおりで、壊れた字の 9 つは空の字・2026-09-27T07:39:00（時差の無い字）・2026-02-29T00:00:00Z・2026-13-01T00:00:00Z・2026-09-27T24:00:00Z・2026-09-27T07:39:00.Z・2026-09-27T07:39:00+0900・1969-12-31T23:59:59Z・年を全角の数字で書いた字（着地済みの ledger.rs の歯と同じ字）。src の字の歯は CARGO_MANIFEST_DIR から src/server/ledger.rs・proc.rs・clock.rs を読み、done (1) の定義の字（fn の名の後の開き括弧か型引数の開き）が ledger.rs に無く、proc.rs と clock.rs に在ることを見る。着地済みの歯は xtask の check（nextest の workspace の全部）で通ることを見る。 依存は足さない。Cargo.toml は触らない。"

