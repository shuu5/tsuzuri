_fold_key_forms は fold_keys に着地済みの 6 つの形が全部在ることと今の通す字と断る字の判定を見て、steady_details_use_fold_record は Module の ALL の module ごとに src/project の下の file の details の数と記録を呼ぶ所の数と folds の数が同じで、鍵の字の集合が folds と同じであることを見る（合計 6 と鍵の列の比べを外す）。steady.rs のほかの歯は直さない。 測り方。新しい歯は tests/hsderive.rs に置き、名を hsderive_ で始める。13 の module の PATHS と FOLDS を節の値と比べる歯（着地の時の値の確かめ）と、Module の paths と folds が各 module の定数と同じであることを見る歯を置く。13 の block の file は 2 つの定数を足すだけで、ほかの字は変えない。 依存は足さない。Cargo.toml と vocab.json と style.css は触らない。"
