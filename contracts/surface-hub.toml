id = "hb-config"
title = "起動の引数 Config を server の config.rs に割り、Config::new で既定の値を 1 か所に置く（歯の file の fn config は Config::new を使う）"
req = ["NFR3"]
section = "4"
write-set = ["crates/tsuzuri-boundary/src/server/mod.rs", "+crates/tsuzuri-boundary/src/server/config.rs", "crates/tsuzuri-boundary/src/main.rs", "crates/tsuzuri-boundary/tests/server_src.rs", "crates/tsuzuri-boundary/tests/server_seat.rs", "crates/tsuzuri-boundary/tests/server_coalesce.rs", "crates/tsuzuri-boundary/tests/server_read.rs", "crates/tsuzuri-boundary/tests/server_ask.rs", "crates/tsuzuri-boundary/tests/server_min.rs", "crates/tsuzuri-boundary/tests/server_batch.rs", "crates/tsuzuri-boundary/tests/server_view.rs", "crates/tsuzuri-boundary/tests/server_acctwire.rs", "+crates/tsuzuri-boundary/tests/hbconf.rs"]
verify = ["cargo nextest run -p tsuzuri-boundary --test hbconf --no-tests=fail hbconf_", "cargo run -q -p xtask -- check"]
size = "S"
done = "(1) server の config.rs に pub struct Config（欄は着地済みの 9 つ・名と型と derive は同じ）と pub fn new（repo の PathBuf・bind の SocketAddr・files の PathBuf を受ける）が在り、server の mod.rs の字に pub struct Config が無く、tsuzuri_boundary::server::Config の path で今までどおり使える (2) Config::new の値は、bd が ledger の BD の字、state_dir が無し、folio が design の FOLIO の字、bdw が契約の型の crate の BDW の字、seat が無し、scribe2 が ruling の SCRIBE2 の字（歯 hbconf_ が欄を 1 つずつ比べる・歯は Config を struct の字で組まない） (3) 節の 9 つの歯の file の fn config の本文は Config::new を呼び、本文に Config の struct の字が在るときは同じ本文に Config::new による残りの欄の埋め（..Config::new の字）が在る（歯が 9 つの file の字を読んで見る） (4) main.rs の字に Config::new の呼びが在り、main.rs の中の Config の struct の字（名 Config に空白と開き波括弧が続く字）の数と、残りの欄の埋め（..Config::new の字）の数が同じ（歯 hbconf_ が main.rs の字を読んで数える・parse が 9 つの欄を並べた struct の字で組むままなら落ちる）。tz surface serve の引数の読みは変わらない（着地済みの歯 server_src_tz_takes_bd_flag と server_read_tz_takes_state_dir_and_folio が直さずに通る） (5) 9 つの歯の file の test の属性の付いた fn は 1 つも変わらず、着地済みの歯は全部通り（xtask の check）、足す外の依存は 0 本"
depends = ["hb-proc"]
goal = "なぜ。起動の引数の struct Config（server の mod.rs の 81 行目から）に欄を足すと、Config を struct の字で組む 9 つの歯の file と main.rs が全部組めなくなる（着地の前の行 h-wire は、これを避けるために欄を足さず bind_with を足した）。既定の値を持つ Config::new を置き、歯の file はそれと残りの欄の埋め（struct の更新の形）で組むようにする。後で欄を足す行は config.rs と main.rs だけを書く。 在りか（着地済み・確かめた）。Config は pub な欄 repo（PathBuf）・bind（SocketAddr）・files（PathBuf）・bd（OsString）・state_dir（Option の PathBuf）・folio（OsString）・bdw（OsString）・seat（Option の String）・scribe2（OsString）の 9 つを持ち、derive は Debug・Clone・PartialEq・Eq。既定の値の在りかは server の ledger の BD（字 bd）・server の design の FOLIO（字 folio）・契約の型の crate の ledger の BDW（字 bdw）・server の ruling の SCRIBE2（字 scribe2）で、main.rs の parse が省いた引数にこれらを入れる（state_dir と seat は無し）。 形。server の config.rs に Config を移し（欄と derive と doc は同じ）、impl に pub fn new を置く。new は repo の PathBuf・bind の SocketAddr・files の PathBuf を受け、ほかの 6 つの欄を上の既定の値で埋めた Config を返す。server の mod.rs は mod config と pub use で Config を再公開し、tsuzuri_boundary::server::Config の path を変えない。Server の bind と bind_with は変えない。main.rs の parse は Config::new に 3 つの引数を渡し、省ける引数が在る欄だけを上書きする（読みの決まりと断りの字は変えない）。 歯の file の直し（確かめた・この 9 つだけ）。crates/tsuzuri-boundary/tests の server_src.rs（107 行目）・server_seat.rs（164 行目）・server_coalesce.rs（102 行目）・server_read.rs（147 行目）・server_ask.rs（139 行目）・server_min.rs（92 行目）・server_batch.rs（166 行目）・server_view.rs（107 行目）・server_acctwire.rs（167 行目）の fn config は、今は Config を 9 つの欄の struct の字で組む。直した後は、既定と違う欄だけを書き、残りを Config::new（repo・bind・files の 3 つを渡す）で埋める。各 file の欄の値（例 server_read の folio は folio_program・server_coalesce の state_dir は Some）は変えない。#[test] の fn は 1 つも触らない。main.rs を除く src の file（config.rs と mod.rs のほか）と、Config を組まないほかの歯の file は触らない。 測り方。新しい歯は tests/hbconf.rs に置き、名を hbconf_ で始める。欄の歯は Config::new の値の欄を 1 つずつ比べ（歯の中で Config を struct の字で組まない＝後で欄が増えても歯を直さずに済む）、src の字の歯は CARGO_MANIFEST_DIR から server/mod.rs と config.rs と main.rs を読み（main.rs は done (4) の 2 つの字の数を比べる）、9 つの歯の file の fn config の本文（fn config の開き括弧から次の 4 つの空白と閉じ括弧だけの行まで）を読んで done (3) を見る。tz の引数の読みの振る舞いは着地済みの歯 server_src_tz_takes_bd_flag と server_read_tz_takes_state_dir_and_folio（tz の binary を撃つ）が見る。 依存は足さない。Cargo.toml は触らない。"

[[contract]]
id = "hb-route"
title = "境界の crate の組み立ての script が GET の口の列を生成する（server の route.rs と routes の下の 1 口 1 file）"
req = ["NFR3"]
section = "5"
write-set = ["+crates/tsuzuri-boundary/build.rs", "-crates/tsuzuri-boundary/src/server/mod.rs", "+crates/tsuzuri-boundary/src/server/route.rs", "+crates/tsuzuri-boundary/src/server/routes/account.rs", "+crates/tsuzuri-boundary/src/server/routes/around.rs", "+crates/tsuzuri-boundary/src/server/routes/graph.rs", "+crates/tsuzuri-boundary/src/server/routes/graphview.rs", "+crates/tsuzuri-boundary/src/server/routes/item.rs", "+crates/tsuzuri-boundary/src/server/routes/ledger.rs", "+crates/tsuzuri-boundary/src/server/routes/metrics.rs", "+crates/tsuzuri-boundary/src/server/routes/next.rs", "+crates/tsuzuri-boundary/src/server/routes/pipeline.rs", "+crates/tsuzuri-boundary/src/server/routes/questions.rs", "+crates/tsuzuri-boundary/src/server/routes/seat.rs", "+crates/tsuzuri-boundary/src/server/routes/unreflected.rs", "+crates/tsuzuri-boundary/tests/hbroute.rs", "+docs/measure/r2-boundary-build.txt"]
verify = ["cargo nextest run -p tsuzuri-boundary --test hbroute --no-tests=fail hbroute_", "cargo run -q -p xtask -- check"]
size = "M"
done = "(1) 生成した列挙 tsuzuri_boundary::server::Route の ALL の名の列（name の値）は、src/server/routes の下の .rs の file の名（拡張子を除く・名の順）と同じで、重なりが無い（歯 hbroute_ が dir を読んで比べる） (2) Route の ALL の key に、節の 12 の GET の口の鍵（method GET と Exact か Prefix の path）が全部在る（歯は多い分を許し、12 が在ることだけを見る） (3) 同じ method の 2 つの鍵は、どの path でも両方には当たらない（歯が全部の対を Key の matches の決まりで比べる） (4) server の mod.rs の字に fn route と fn around と fn account の定義が無く、引用符で囲んだ /api/ の path の字は /api/surface/events だけ（歯が字を読む） (5) 組み立ての script の字に rerun-if-changed の src/server/routes と build.rs の 2 行が在り、組み立ての出力の dir の routes.rs の字に、各 file の絶対の path の属性と mod の宣言が名の順に在る（歯が env の OUT_DIR と CARGO_MANIFEST_DIR から読む） (6) docs/measure/r2-boundary-build.txt に before_s と after_s の 2 行の秒の数が在り、差が 0.3 を越えるときは空でない reason の行が在る（歯が file の字を読む・規則の行 R-2） (7) 着地済みの歯は全部直さずに通り（xtask の check）、足す外の依存は 0 本"
depends = ["hb-config"]
goal = "なぜ。server の mod.rs の fn route は GET の口を path の字の match で振り分け、口ごとの本文も同じ file に在る。口を足す行は必ず mod.rs を書く。口を 1 口 1 file に割り、口の列は組み立ての script が dir から生成する（判断の記録 ADR-13・案 M2）。 口の型（server の route.rs・新しい file・pub mod route）。pub enum Match は Exact（&'static str）と Prefix（&'static str）の 2 つ。pub struct Key は pub な欄 method（&'static str・字 GET か POST）と path（Match）を持ち、pub fn matches（method の &str と path の &str を受けて bool）は method が等しく、Exact なら path が等しく、Prefix なら path がその字で始まるときに真。口の本体は server の module の中だけ（可視性 pub(in crate::server)）の struct Entry（欄 key の Key と handle の関数の pointer・handle は Request の参照と Shared の参照を受けて Response を返す）。振り分けは同じく server の中だけの fn dispatch（Request の参照と Shared の参照を受けて Option の Response を返す）の 1 つで、生成した列挙 Route の ALL を宣言の順に見て、key が要求の method と path に当たる最初の口の handle を呼ぶ（条 P-21）。Request は server の pub mod http の pub struct、Shared は server の mod.rs の非公開の struct（確かめた）で、どちらも server の中からは見えるので、Entry・dispatch・各口の file の ROUTE・生成の entry を server の中だけの可視性にすれば Shared の可視性は変えずに済む（crate 全体へ出すと、Shared より広い面に Shared が出て private_interfaces の警告になり、host の clippy の -D warnings で落ちる）。 口の file（src/server/routes の下・12 の新しい file）。各 file は server の中だけの const ROUTE（Entry）と、口の本文の関数を持つ。本文は今の route の腕の字を変えずに移す。account.rs は GET の account の PATH（契約の型の crate の account の PATH・字 /api/account）で fn account と fn watch_acct_marks を移し、around.rs は /api/around で fn around を移し、item.rs は Prefix の /api/ledger/（BeadId の読みと 400 の id-shape・404 の no-item・503 の ledger-unknown）、ledger.rs は /api/ledger、graph.rs は /api/graph、graphview.rs は /api/graph/view、metrics.rs は /api/metrics、next.rs は /api/next（席の card と台帳の字を thread の scope で並べて集める形のまま）、pipeline.rs は /api/pipeline、questions.rs は /api/questions、seat.rs は server の seat の PATH（字 /api/seat）、unreflected.rs は /api/unreflected。file の名と path の対はこのとおりにする（Route の変種の名になる）。json と lock と ACCT_MARKS_EVERY と GIT は server の mod.rs に残し、口の file は crate::server の path で使う（非公開の関数も子の module から呼べる）。 server の mod.rs の残り。Server・Config の再公開・bind と bind_with・guarded・refusal・post の 4 つの関数・handle・json・lock・SSE の口（/api/surface/events）・面の file の配布（files の serve の 3 つの応答）。handle の形は、読めない要求が 400 の bad-request、POST の 4 つの腕はそのまま、GET でない要求は 405、/api/surface/events は SSE、ほかの GET は dispatch が Some ならその応答、None なら面の file の配布。mod.rs の module の doc から口の path の一覧を外す（各口の file の doc が自分の path を書く）。mod.rs は縮む（write-set の印 -）。 組み立ての script（crates/tsuzuri-boundary/build.rs・新しい file・標準 library だけ）。main は Result を返し、unwrap と expect と panic を使わない。src/server/routes の下の拡張子 rs の file を読み、名（拡張子を除く字）を byte の順に並べる。名が英小文字で始まり英小文字と数字と下線だけでなければ、その file の名を書いた Err で組み立てを止める。生成する字は、名ごとに、path の属性（値は CARGO_MANIFEST_DIR の絶対の path に src/server/routes と名と拡張子をつないだ字を Rust の字の literal にしたもの・Debug の書式で引用符と逆斜線を escape する）と mod の宣言、次に列挙 Route（derive は Debug・Clone・Copy・PartialEq・Eq・変種の名は名の先頭と下線の後の字を大文字にして下線を外したもの・宣言の順は名の順）と、impl の pub const ALL（全部の変種の配列）・pub fn name（名の字）・pub fn key（その file の ROUTE の key）・server の中だけの fn entry（その file の ROUTE）。字は組み立ての出力の dir（環境の OUT_DIR）の routes.rs に書き、今の file の字と同じなら書き直さない。生成する字に内側の doc（//! の行）と内側の属性を置かない（include の macro の中で使えないため）。標準出力に rerun-if-changed の src/server/routes（dir は中の file の足し引きと書き換えで再び走る）と rerun-if-changed の build.rs の 2 行を書く（println か stdout への writeln）。 取り込み。server の mod.rs に、中身が include の macro 1 つの inline の module routes を置き、include の macro には concat の macro で env の macro の OUT_DIR と字 /routes.rs をつないだ path を渡す。mod.rs は pub use で routes の Route を server の Route として再公開する（歯が tsuzuri_boundary::server::Route で使う）。 着地済みの歯（全部、直さずに通る・write-set の外）。口の振る舞いは tests の server_min（server_min_ledger_list_returns_five・server_min_ledger_item_by_id・server_min_ledger_unreadable_is_unknown・server_min_files_refuse_outside・server_min_non_get_405_writes_nothing ほか）・server_read（server_read_four_routes_match_core ほか）・server_view（server_view_graph_view_matches_core・server_view_around_matches_core・server_view_around_refusals・server_view_unreflected_matches_core ほか）・server_seat（server_seat_card_matches_core・server_seat_next_uses_card ほか）・server_ask（server_ask_questions_route_matches_core ほか）・server_acctwire（acctwire_get_matches_acct・acctwire_get_without_state_dir・acctwire_marks_send_board_changed ほか）・server_coalesce（server_coalesce_seven_routes_share_one_bd・server_coalesce_graph_routes_share_one_folio ほか）が見る。子 process の撃つ数と引数は変えない。src の file の字を読む着地済みの歯は境界の crate に無い（確かめた）。 節の 12 の GET の口の鍵（done (2)）。Exact の /api/ledger・/api/pipeline・/api/metrics・/api/next・/api/seat・/api/account・/api/graph・/api/graph/view・/api/around・/api/unreflected・/api/questions と、Prefix の /api/ledger/ で、method はどれも GET。 規則の行 R-2 の測り（この crate の最初の生成の行）。増分 check の秒は、口の file を 1 つ書き換えた後（着地の前は server の mod.rs を書き換えた後）の cargo check -p tsuzuri-boundary --all-targets の Finished の行の秒で、3 回の中央値。組み立ての script を足す前の木で before を、足した後の木で after を測り、docs/measure/r2-boundary-build.txt に before_s = 秒・after_s = 秒・差が 0.3 秒を越えるときは reason = 理由 の行で書く。記録は commit の message でなくこの file に置く（歯が読めるため）。 測り方。新しい歯は tests/hbroute.rs に置き、名を hbroute_ で始める。dir の歯は CARGO_MANIFEST_DIR の src/server/routes を読み、生成の字の歯は env の OUT_DIR の routes.rs を読む（組み立ての script を持つ package の歯には OUT_DIR が渡る）。重なりの歯は Route の ALL の全部の対で、同じ method の 2 つの Exact は字が違い、Exact と Prefix は Exact の字が Prefix の字で始まらず、2 つの Prefix はどちらの字も他方で始まらないことを見る（この決まりで重ならなければ順は結果を変えない）。 依存は足さない。Cargo.toml は触らない（組み立ての script は package の根の build.rs として Cargo が見つける・build-dependencies を足さない・xtask の歯 skeleton_boundary_std_only_and_bin_tz が見る）。"

