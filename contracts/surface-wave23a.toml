fail でそれを out.json へ写す。 dretry_spawns_use_pace は ruling.rs と batch.rs の src の字を読む。 どの歯も fixture の id に台帳の接頭辞を使わない（fx-s と tsuzuri:0.1 と batch の形は着地済みの歯 fserve と同じ）。 着地済みの歯。読み手の grep は境界の crate の tests と src と xtask と、契約・中核・面の crate の tests で、字 ruling::deliver・deliver_argv・NOT_TAKEN・DELIVER_TIMEOUT・--scribe2・Delivery・fail_at と proc の fn を探した。 fserve（DELIVER の型・deliver の 1 周の期待）は書く。server_ask（server_ask_failed_delivery_stays_200_with_stderr_line は NOT_TAKEN の行が来たら tz を止め、偽の器の回が 1 で、裁定の id を含む行が 1 行）・ eretry（配達を応答の後の thread で待つ）・rvk（取り消しの配達の argv が 1 つ・ruling.rs の字 deliver_argv( が 2 つ）・server_batch（偽の器が断る周の回が 1）・bhalf・hbproc（proc.rs の capture）は置き場だけの = で持つ。 server_ask と server_batch と fserve の断りの歯は、最初の断りの後 15 秒の間に tz を止めるか数えるので、撃ち直しの周は数えに入らない。 歯で測らず、この行の差分で持つ字。log の 2 行の形（NOT_TAKEN の行の 器 の後の字と、GAVE_UP の行の回の数）と、字の同じ断りを 2 度書かないこと（歯は標準エラーを読まない）。 run の標準エラーの読みを子の終わりの後に上限の残りまで待つこと。batch.rs と ruling.rs の頭の doc の字。 器が送ったが送達を確かめられない周（unconfirmed）も撃ち直すので、席に同じ指し示しの 1 行が 2 度届くことがある。受けた周の入力欄に字が残れば次の周は入力欄の門で断られ、 席が turn に入れば busy で断られて停止の hook が拾う。撃ち直しの周の台帳の読みと停止の hook の印の書きが前後すると、同じ裁定を 2 経路で返すことがある（席は台帳の裁定を読むので害は無い）。 依存と順。書く src は境界の crate の proc.rs・ruling.rs・batch.rs。同じノートの行 e-answer-reread が ruling.rs を書き proc.rs の run を使うので、この行を先に流す（ノートの depends）。 計画だけの行 e-approval-event と e-multi-answer も ruling.rs を書くので、この 2 行の後に置く（計画の 5 節）。 便 i-11（ノート surface-wave22b・未着地）は歯 fserve・server_ask・eretry・rvk を置き場だけの = で持つ。この行は fserve を書くので、順は便の bead の依存で席が付ける。 範囲の外。器の側の見張り（席が idle の間に起きた事を席へ届ける道を 1 つにする・memo t3-hub.72 の候補 (c) と memo t3-hub.70）は持ち主が時期を決める。 器の断りの語を器の event log に書くこと、入力欄の門が提案の薄い字で断る形の直しは器の code なので、この行では書かない（写しで断る形が見えた時に器の席へ頼む）。 撃ち直しを上限で止めた後の知らせ（board の届いていないの印・規則の行 R-21 の 2 分）は計画だけの行 f-undelivered が持つ。"

