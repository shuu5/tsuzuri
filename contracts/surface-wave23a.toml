goal = "在りかの main は 538c00e（計画 surface-plan 第 0.88 版）で、節の字はこの main の境界の crate の字から取った。 今の形（main の字）。src/server/ruling.rs の fn accept と fn reopen と src/server/batch.rs の fn accept は、席の target と state dir の両方が在る時だけ、 別の thread で fn deliver を 1 度呼んで待たずに応答する。deliver は台帳を読み直し（Source の text_alone）、読めて pending のどれにも印が在れば撃たず、 器の配達の口（scribe2 seat deliver --state-dir S --target T --ruling ID）を proc.rs の fn capture で 1 度だけ撃ち（上限 DELIVER_TIMEOUT 10 秒）、 rc 0 なら pending の順に経路が配達の口の印を notes に足し、受けなければ標準エラーに 1 行（tz surface serve と NOT_TAKEN の字と id と席）を書いて終える。 capture は子の標準エラーを捨て、rc が 0 でなければ None を返すので、器の断りの字は残らない。撃ち直す者は居ない。 なぜ。器の seat deliver は、受けない周に標準エラーへ 1 行（seat deliver、refused か unconfirmed、reason= の後に語、target= の後に target）を書いて rc 1（store の断りだけ rc 2）で終わり、 器の event log には書かない（器の repo の crates/scribe2/src/seat/deliver.rs の fn run と fn refused_line・器の main 66d73b43）。 語は閉じた 13 語（id-empty・id-shape・id-long・state-dir・store・no-row・busy・state-missing・state-unreadable・no-rule・pane-missing・input-busy・input-unknown）と、 送達の本体（seat/inject.rs の fn deliver_within）が返す語（入力欄の門の語と tmux-failed ほか）。 門の順は id・置き場・event log・登録 row・席の状態の打刻の最終行が idle・送達の窓の rules 行・pane・入力欄（seat/inject.rs の fn guard_input と seat/mod.rs の fn input_tail）。 input_tail は pane の最後の字 ❯ を含む行の右を trim した字で、空なら通し、字が在れば input-busy、行が無ければ input-unknown で断る。 07:20Z の断りの語は server が捨てたので分からない（未確かめ）。席の状態の打刻は 07:16:11Z の Stop から 07:25:59Z の UserPromptSubmit まで idle で、 この間に送達の記録（器の tick の記録の seat-inject の行）は無い。席が idle になった後に席の pane を 3 回撮った写し（07:32Z から 07:33Z）では、 最後の ❯ の行の右は 3 回とも空で、入力欄の門は通る形だった（入力欄に提案の薄い字が残って門が断り続ける形は、この写しでは見えない）。 席の停止の hook は席の turn の終わりにしか撃たれないので、席が idle の間に器が断ると、次に誰かが席を起こすまで答えは届かない。 形。 - proc.rs に pub enum Failed（Unstartable・TimedOut・Exit の 3 枝・Exit は子の標準エラーの最後の空でない行の字を持つ）と pub fn run を足す。 run は capture と同じ撃ち（cwd・標準入力は空・新しい process group・時間切れは group ごと止める）で、標準エラーも別の thread で読み、 rc 0 なら標準出力、起動できなければ Unstartable、上限の内に終わらなければ TimedOut、rc が 0 でなければ Exit（子が終わった後に上限の残りまで標準エラーの読みを待ち、読みきれなければ空の字）を返す。 Failed の fn word は log の字（起動で