done = "(1) 契約の crate の歯の dir に共通の手の module の tests/common/mod.rs と群の歯の file の tests/cform_surface.rs・cform_ledger.rs・cform_graph.rs・cform_board.rs・cform_stats.rs・cform_seat.rs を置き、tests/contract_form.rs を消す。群の file の fn forms は、割る前の fn forms の form のうち名の頭（コロン 2 つの前）が群の module（ledger の群は ledger と question・ほかの群は群の名）のものだけを割る前の順と字のまま持ち、群の見本だけが使う私的な見本の fn を割る前の字のまま持つ。割る前の form と私的な見本の fn はどれもちょうど 1 つの群の file に在り、見本の値の字は変えない（歯 cfsplit_snapshots_by_group・contract_form_snapshot_matches） (2) 割る前の contract_form.rs の歯（test の属性を持つ fn）の名の集合と、割った後の群の file の歯の名の集合は同じ。contract_form_snapshot_matches と contract_form_roundtrip_all_types は群の file の 6 つ全部に在り、contract_form_closed_lists は閉じた列の文を持つ群の file に在り、ほかの歯はどれも、本体が名指す契約の型の数の最も多い群の file に 1 つだけ在る。closed_lists の文は、文が名指す型の module の群の file へ割る前の順と字のまま移し（let で束ねた名を使う後の文は束ねた文と同じ群）、ほかの歯の本体の字は変えない（歯 contract_form_roundtrip_all_types・contract_form_closed_lists） (3) 共通の手（const AT・fn bead・fn ruling・struct Samples・trait Form・fn form・fn snapshot_text・snapshot の読み比べの fn snapshot_matches・往復の fn roundtrip_all・閉じた列の異なる語を数える fn distinct）は tests/common/mod.rs に 1 つずつだけ在る。群の file はどれも行 mod common; を 1 つ持って共通の手を使い、同じ手の定義を持たない（歯 cfsplit_hands_in_common） (4) tests/snapshots/contract_form.json を消し、群ごとの tests/snapshots/surface.json・ledger.json・graph.json・board.json・stats.json・seat.json を置く。群の json は群の file の fn forms の見本の字（割る前の snapshot と同じ書き方・鍵は群の forms の順）で、各群の json の鍵は群の module の型の名だけで群どうしで重ならず、群の json の object の和は割る前の contract_form.json の object と鍵も値も同じ（歯 cfsplit_snapshots_by_group・contract_form_snapshot_matches） (5) 群の歯 contract_form_snapshot_matches は common::snapshot_matches に自分の群の名を渡して自分の群の json だけを読み比べ、字が違えば今の字を CARGO_TARGET_TMPDIR の群の名の json に書いて落ちる。群の file の頭の doc は、接頭辞 contract_form_ の歯のうちのどの群か・群の snapshot の file・今の字を CARGO_TARGET_TMPDIR に書いて落ちる作法・共通の手の在りかを名乗る（歯 cfsplit_snapshots_by_group） (6) 契約の crate の歯の dir の下の file（tests/common/mod.rs と群の json を含む）はどれも受付の 1 file の行数の上限 1500 行以下（歯 cfsplit_files_within_limit） (7) 群の snapshot を読むほかの crate の歯の path を群の json に替える。中核の qblock_snapshot_carries_ids は ledger.json を、中核の nsum_snapshot_carries_fields は graph.json を、面の gpface_contract_words は surface.json を読み、数と字の期待は変えずに通る。契約の crate の src/lib.rs の頭の doc は群ごとの歯と snapshot と共通の手の在りかを名乗り、repo の code の字に contract_form.rs と contract_form.json の path は残らない（歯 qblock_snapshot_carries_ids・nsum_snapshot_carries_fields・gpface_contract_words） (8) 見張りの歯 tests/cfsplit.rs の 3 本は名を cfsplit_ で始め、標準 library と serde_json だけを使う。着地済みの歯は write-set の外の file を直さずに全部通る（xtask の check）（歯 cfsplit_files_within_limit）"
goal = "在りかの main は 14665fe（計画 surface-plan 第 0.48 版・契約の歯と snapshot を最後に書いた行 h-acct-rest〔便 t3-hub.53.29〕の着地の commit a42dcd5 の後）。この節の行の番号と行の数はその字（この行の書く file は 46113c7〔計画 第 0.47 版〕の字と同じで、試作はその写しで撃った）。便は、置いた時点で走っている契約の歯の鎖の行（今は CI を待つ h-acct-rest・次の見込みは c-dn-unknown）の着地の後に起こすので、その間に contract_form.rs に見本が足されうる。割り方と done は見本の列でなく規則で決まる（試作は c-dn-unknown の試作の差分を先に当てた土台でも撃った）。 なぜ。契約の歯 tests/contract_form.rs と snapshot tests/snapshots/contract_form.json は、契約の型を足すか変える行が全部書く。器は write-set の交わる便を同時に起こさないので、地図のグラフ（c-dn-unknown・c-dn-edges・c-updated）・席の card（c-seat-tick・c-limit-resume・c-seat-grace）・pipeline の板（c-pipe-ci）・台帳の指標（h-acct-rest）の行が 1 本の鎖でしか流れない。席の調べ（contracts の write-set の交わり）では、これらの行の間で交わる file はこの 2 つだけ。2 つを契約の型の群ごとに割れば、群ごとの鎖に分かれて並べて流せる（持ち主の指示〔2026-09-28〕と席の決め）。計画の 9 節のこの行の字（見本と snapshot の読みは 1 か所に残し、snapshot の file は動かさない）は、この行で snapshot も群ごとに割ると改める。 在りか・歯（write-set）。tests/contract_form.rs（1432 行・受付の上限 1500）は頭の doc（1〜3 行）で、接頭辞 contract_form_ の歯の file で、snapshot は全型の見本の値を JSON にした 1 つの file、字が違えば今の字を CARGO_TARGET_TMPDIR の contract_form.json に書いて落ちる、と名乗る。共通の手は const AT（37 行）・fn bead（39 行・BeadId::new）・fn ruling（43 行・RulingId::new）・struct Samples（48 行・欄 name と values）・trait Form（53 行・name と json と roundtrip）とその impl（59 行）・fn form（85 行）・fn snapshot_text（1099 行・型の名を鍵にした 1 つの JSON の object・鍵は fn forms の順）。私的な見本の fn は 21 本（92〜404 行・seat_view・pipeline_card・ledger_row・root_row・ledger_writes・bead_attr・run_attr・invariant_checks・task_node・run_node・view_nodes・view_edge・around_rows・hub_cut・unreflected_rows・ledger_item・question_card・group_row・quota_used・seat_spans・account_moves）。fn forms（407 行）は let refusals の後の vec の中に 62 の form を、注の行 surface・ledger・graph・board・stats・question・seat の 7 つの塊（417〜1094 行）で並べる。#[test] は 8 本で、contract_form_snapshot_matches（1116 行）・contract_form_roundtrip_all_types（1140 行）・contract_form_ledger_write_argv（1146 行）・contract_form_ids_refuse_bad_shape（1200 行）・contract_form_bd_line_reads（1227 行）・contract_form_ledger_row_labels（1265 行）・contract_form_ledger_item_digest（1286 行）・contract_form_closed_lists（1365 行）。closed_lists は中に fn distinct を持ち、graph の NodeKind・EdgeType・GraphSource・EdgeEnd・Fold・BoxFold・Verdict と、board の NextMove・LedgerJudge・Stage と、stats の CheckResult・UnreflectedKind と、seat の SeatState の閉じた列の数と字を見る。question の見本 question_card の欄 digest は ledger の見本 ledger_item の要約値から組む。snapshot は 1350 行（鍵 62）。 在りか・snapshot を読むほかの歯と doc（write-set）。中核の歯 tests/qblock.rs（366 行）の qblock_snapshot_carries_ids は ../tsuzuri-contract/tests/snapshots/contract_form.json を読み、鍵 a1 を持つ object（問いの card）を全部集めて 3 つと数え、id と blocking を見る（3 つとも question の型の見本）。中核の歯 tests/nsum.rs（426 行）の nsum_snapshot_carries_fields は同じ file を読み、節点の object を 13 と数え、鍵 graph::GraphNode の 1 つ目の欄を見る（13 とも graph の型の見本）。面の歯 tests/gpface.rs（344 行）の gpface_contract_words は同じ file の字に、方針の旧い形の字が無く、方針の欄の字が方針の問いの見本の裁定 id であることを見る（surface の型 PolicyResponse の見本）。契約の crate の src/lib.rs（95 行）の頭の doc の 3 行目は、型の外形は tests/contract_form.rs の snapshot の歯が pin する、と書く。repo の code でほかに contract_form.rs か contract_form.json の path を字で持つ file は無い（grep で確かめた）。歯の名の語 contract_form_ を filter の一覧に持つ面と中核の歯（hspage・cmark・qblock・nsum・gpface ほか）は名を見るだけ。 形。(a) 群は契約の crate の module に合わせた 6 つ。surface（src/surface.rs）・ledger（src/ledger.rs と src/question.rs）・graph・board・stats・seat（それぞれ同じ名の src の file）。見本の群は form の名の頭（コロン 2 つの前の module の名）で決める。(b) 群の歯の file tests/cform_ と群の名の .rs は、頭の doc 3 行（契約の型の外形の歯〔接頭辞 contract_form_〕のうち群の型の見本・snapshot は tests/snapshots の群の名の json で、字の比べは標準 library だけ・共通の手は tests/common/mod.rs に 1 つだけ在る・字が違えば今の字を CARGO_TARGET_TMPDIR の群の名の json に書いて落ちる）、行 mod common;、use（群の file が使う名だけ・今の use の順）、群の見本だけが使う私的な見本の fn（今の字と順のまま）、fn forms（doc は、群の型の見本〔この順が snapshot の file の key の順〕・群の form を割る前の順と字のまま・塊の注の行も残し、surface の群は let refusals も持つ）、歯 contract_form_snapshot_matches（本体は common::snapshot_matches に群の名の字と &forms() を渡す 1 行）、歯 contract_form_roundtrip_all_types（本体は common::roundtrip_all(&forms()) の 1 行）、閉じた列の文を持つ群は歯 contract_form_closed_lists（割る前の文のうち群の型を名指す文と、その文が let で束ねた名を使う後の文を、割る前の順と字のまま）