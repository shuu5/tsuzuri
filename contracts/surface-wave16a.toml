title = "契約の歯 contract_form.rs と snapshot の contract_form.json を契約の型の群（surface・ledger・graph・board・stats・seat）ごとの歯の file と snapshot に割り、共通の手を 1 つの module に置き、群の持ち分と共通の手と行数の上限を新しい歯で見張る"
