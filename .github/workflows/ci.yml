name: ci

# 器（scribe2）の land の終端が、push した commit の判定をここから読む（既定の 1 行 = gh run list --commit <sha>）。
# 撃つのは器の common-verify（.vessel.toml）と同じ 1 行で、検査の中身は xtask の check が持つ（公開の走査 → build → 歯の全部 → clippy）。
on:
  push:
    branches: [main]
  pull_request:

# GITHUB_TOKEN は読取りのみ
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # 歯（nextest）だけを 8 つの job に分ける。ほかの段は job ごとに全部撃つ（どの job も同じ 1 行を撃つ）。
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      TSUZURI_CHECK_PARTITION: count:${{ matrix.shard }}/8
      # 入れ子の workspace の段は省かずに全部を撃つ（PR の木は origin/main との差で省けてしまうため・行 v-skip・判断の記録 ADR-34）
      TSUZURI_CHECK_NESTED_ALL: "1"
    steps:
      # action は commit の SHA で pin する（scribe2 の ci.yml と同じ版）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # 公開の走査（xtask の pub-scan）が基準の commit より後の commit を読むので、履歴の全部を取る
          fetch-depth: 0
      # toolchain の版と components は rust-toolchain.toml の 1 本が持つ
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6  # v2.87.7
        with:
          # trunk は面の crate の組み立て（xtask の surface-build）が呼ぶ
          tool: cargo-nextest,trunk
      # folio の図の口の歯は子の処理で node を起こす（どの partition にも入りうるので job ごとに入れる）
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20
      - run: cargo run -q -p xtask -- check
        env:
          # 入れ子の段の歯が読んだ写し（insta の snapshot）の path を 1 行ずつ残す（行 v-ci・job insta-refs が役の和を照らす）
          INSTA_SNAPSHOT_REFERENCES_FILE: ${{ runner.temp }}/insta-refs.txt
      # 写しを読む歯が割りに無い役は file を作らないので、file が無くても落とさない（和の照らしは読まれない写しを落とす側に倒れる）
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: insta-refs-${{ matrix.shard }}
          path: ${{ runner.temp }}/insta-refs.txt
          if-no-files-found: warn
          retention-days: 1

  # 依存の監査（条 P-26.5・行 k-deny）: 重複した版・脆弱性の知らせ・使ってよい条件・出所を、根の deny.toml で全面に撃つ。
  # 2 つの -D は、効かなくなった skip と ignore を落とし、版上げのたびに一覧の見直しを強いる。
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6  # v2.87.7
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check -D unmatched-skip -D advisory-not-detected

  # 器 scribe2 の CI にだけ在った門（行 v-ci・判断の記録 ADR-33 の決定 (5) と (14)）。器の build・歯・clippy・器の xtask の check は
  # job check の入れ子の段が撃ち、入口の赤と main の出所の門（flip-check・rules-diff・deps-delta・main-provenance）は行 v-gates へ回す。
  # 依存の監査は器の一覧（scribe2/deny.toml）で、器の ci.yml の job deny と同じ字を、job の既定の撃つ dir を scribe2/ にして撃つ
  # （字の照らしは xtask/tests/vcij.rs・根の workspace に入れる行 v-join の後は job deny が撃つ）。
  scribe2-deny:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scribe2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6  # v2.87.7
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  # 歯の写しの孤児の門（器の ci.yml の job insta の --unreferenced reject と --check の残り）: job check の役が残した、入れ子の段の歯が
  # 読んだ写しの path の和を、追跡される scribe2/ の下の写しと照らす。写しの食い違いは job check の入れ子の段の歯が CI の下で落とす。
  insta-refs:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: insta-refs-*
          path: ${{ runner.temp }}/insta-refs
      - run: cargo run -q -p xtask -- insta-refs "${{ runner.temp }}/insta-refs"
