# tsuzuri の workspace（設計ノート surface-base 便 a・b）: 契約の型・中核・境界・面の 4 crate と xtask と、持ち込んだ folio（行 k-join-folio）。
# 直接依存は crate ごとの名の一覧に限る（xtask の歯 skeleton_ が各 member の manifest で測る）。
# core の側は serde と serde_json。面の crate は別枠の予算（規則の行 R-25: 8 本以下）で Leptos の一式を wasm の target のときだけ持つ。
[workspace]
resolver = "3"
members = [
    "crates/tsuzuri-contract",
    "crates/tsuzuri-core",
    "crates/tsuzuri-boundary",
    "crates/tsuzuri-surface",
    "folio2/crates/folio",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 行 k-lint-base: 規則の行 R-10 の書き方（条 P-24.1）を workspace の lint の表で deny にする。表は違反が 0 になった lint から順に足し、直す行と表に足す行は同じ行にする（xtask の歯 klint_ が表と一覧 ENABLED を照らす）。
# 段の並び: この行（違反 0 の 5 つ）→ 歯の根の cfg(test)（k-lint-tests-face・k-lint-tests）→ print・expect・添字・引数・関数の粒度の直しと表の足し（後の行）。
# 持ち込んだ folio は除外の表 carry-exclusions.toml の R-10 の行が在る間は表を継がず（manifest に [lints] を置かない）、行 k-lint-folio が除外を消して継がせる。
[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
dbg_macro = "deny"

# 行 g-strip: release の profile の strip で面の wasm の関数の名の表（name の節）を抜く。
# opt-level と lto は組みの時間を測ってから別に決める。
[profile.release]
strip = "symbols"

# 行 k-join-folio: folio の歯の多く（65 の file のうち 60）は folio の binary を子の処理で撃ち、本物の設計文書で床と面を組む。
# 最適化の無い組みは CPU で遅いので folio の crate だけを opt-level 2 で組む（外の部品と tsuzuri の crate は変えない・4 core の測りで歯の組みは 86 → 147 秒）。
[profile.dev.package.folio]
opt-level = 2
