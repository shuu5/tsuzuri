# tsuzuri の workspace（設計ノート surface-base 便 a）: 契約の型・中核・境界・面の 4 crate と xtask。
# 依存は serde に限る（外の package は serde と serde の導出が連れて来るものだけ・xtask の歯 skeleton_ が Cargo.lock で測る）。
[workspace]
resolver = "3"
members = [
    "crates/tsuzuri-contract",
    "crates/tsuzuri-core",
    "crates/tsuzuri-boundary",
    "crates/tsuzuri-surface",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
