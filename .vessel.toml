# tsuzuri の vessel 宣言（器 scribe2 が便を起こすときに読む）。面の便 a（workspace の骨格）の前に cargo を足した（判断の記録 ADR-4 の注・scribe2 席の回答 2026-09-26: 受付は base の木の宣言を読むので同じ便の write-set では効かない）。
# 値は器の上限（rules 行 runner.allowed_commands）の内側。common-verify は便 a（workspace の骨格）で cargo run -q -p xtask -- check へ改めた（build・歯の全部・clippy を xtask の下で撃つ・xtask の歯 skeleton_ が 1 行であることを測る）。
schema = 1
allowed-commands = ["cargo", "git"]
# push 先の remote（CI は .github/workflows/ci.yml・持ち主の裁定 user 2026-09-27T07:30Z）。器は着地を push し、終端で CI の判定を読む。
# 2026-09-27T09:3xZ に一度外し（器が CI の判定を 20 ミリ秒ごとに読んだ・scribe2 の memo s2-07l.689）、器の直し（scribe2 8f6072d・30 秒ごと・上限 900 秒）の着地の後に戻した。
remote = "origin"
common-verify = ["cargo run -q -p xtask -- check"]
requirements = "design-intent/srs.yaml"
entrance-flip = "unmeasured"
# path の種別の宣言（scribe2 ADR-0047・seat-roles.md §24）: 討論の記録と作業記憶は設計文書、design-intent/ は設計意図
design-intent-paths = ["design-intent/"]
design-doc-paths = ["docs/design/", "docs/grill/", "docs/handoff/", "docs/consult/"]
# 入れ子の crate の根（器の任意の key crate-roots・器の設計 contract-source.md の 62 節・器の行 bq と br）。固定の根 crates/ に足すだけで、
# folio2/crates/ の下の crate を、器の追随の再 gate・着地の後の検出線・受付の上限の余地と歯の導出が crates/ の直下の crate と同じに読む。
# 器の持ち込みの前に folio2/crates/ だけを足した（持ち主の承認 2026-10-01T06:40Z）。scribe2/crates/ は器の持ち込みの時に足す。
crate-roots = ["folio2/crates/"]
